id: natarajakuncitapadasahasranamastotra
category: sahasranama
name:
  english: natarajakuncitapadasahasranamastotra
  devanagari: नटराजकुन्चितपादसहस्रनामस्तोत्र
content:
  english: shukabhridvamam karambhoruham dhakkacchakshasragutpalabhayakaram vamam padam kuncitam | uddhrityadharabhuta
    prishthavilasaddakshanghrimardhambikam samivastrasuvenidrikkucabharam dhyayennatam melanam || 3||
    dhyayedatmavimohasamsthitapadam raktamshukam shankaram kincitkuncitavamapadamatulam vyalambabahum
    tribhih | vame paundra dhanushca pashadahanau dakshe kare cabhayam paushpam marganamankusham damarukam
    bibhranamacchacchavim || 4|| || atha sahasranamastotram || akhandabodho'khandatma ghantamandalamanditah
    | akhandanandacidrupah paramanandatandavah || 1|| agamyamahimambhodhih anaupamyayashonidhih | agrevadho'gresampujyo
    hanta taro mayobhavah || 2|| aghoro'dbutacaritra anandavapuragranih | ajirnassukumaro'nyah paradarshi
    purandarah || 3|| atarkyassukarassarah sattamatrassadashivah | anantarupa ekatma svastarurvyahritih
    svadha || anantashaktiracaryah pushkalassarvapuranah | anargharatnakhacitakirito nikatesthitah ||
    5|| anahankritiracchedyassvanandaikaghanakritih | anavaranavijnano nirvibhago vibhavasuh || 6|| anirdeshyo'nilo'gamyo'vikriyo'moghavaibhavah
    | anuttamah parodaso muktido muditananah || 7|| annanam patiratyugro haridhyeyo'dvayakritih | aparoksho'vrano'lingo'pyadveshta
    premasagarah || 8|| aparyanto'paricchedyo'gocaro rugvimocakah | apasmritinyastapadah krittivasah kripakarah
    || 9|| aprameyo'pratirathah pradyumnah pramatheshvarah | amani madano'manyuramano manado manuh ||
    10|| amulyamanisabhasvatphanindrakarakankanah | arunah sharanah sharvah sharanya sharmadah shivah
    || 11|| avashassvavashassthasnurantaryami shatakratuh | ashubhakshayakrijjyotiranakashastvalepakah
    || 12|| asnehassanganirmukto'hrasvo'dirgho'visheshakah aksharastryaksharastrayakshah pakshapatavivarjitah
    || 13|| atatavi maharudrah kshetranamadhipo'kshadah | atanvanashshatanando gritso gritsapatismrirah
    || 14|| adityavarnassanjyotissamyagdarshanatatparah | adibhuto mahabhutassvecchakalitavigrahah ||
    15|| aptakamo'numanta''tmakamo'bhinno'nanurharah | abhasvarah parantatvamadimah peshalah pavih ||
    16|| avyadhipatiradityah kakubhah kalakovidah | icchanicchavirahito vihari viryavardhanah || 17||
    uddandatandavashcanda urdhvatandavapanditah | udasinaupadrashta maunagamyo munishvarah || 18|| urdhvapadurdhvaretashca
    praudhanartanalampatah | oshadhishassatamishauccairghosho vibhishanah || 19|| kandarpa kotisadrishah
    kapardi kamalananah | kapalamalabharanah kankalah kalinashanah || 20|| kapalamalalankarah kalantakavapurdharah
    | kamaniyah kalanathashekharah kambukandharah || 21|| kamaniyanijanandamudrancitakarambujah | karabjadhritakalagnih
    kadambakusumarunah || 22|| karicarmambaradharah kapali kalushapahah | kalyanamurtih kalyaniramanah
    kamalekshanah || 23|| kakshapashca bhuvantishca bhavakhyo varivaskritah | kalakanthah kalakalah kalakutavishashanah
    || 24|| kalaneta kalahanta kalacakrapravartakah | kalajnah kamadah kantah kamarih kamapalakah || 25||
    kalatma kalikanathah karkotakavibhushanah | kalikanatyarasiko nishanatananishcalah || 26|| kalivadapriyah
    kalah kalatitah kaladharah | kutharabhritkuladrishah kuncitaikapadambujah || 27|| kuluncanam patih
    kupyo dhanvavi dhanadadhipah | kutasthah kurmapithasthah kushmandagrahamocakah || 28|| kulankashakripasindhuh
    kushali kunkumeshvarah | kritajnah kritisarajnah krishanuh krishnapingalah || 29|| kritakritah krishah
    krishnah shantidah sharabhakritih | kritantakritkriyadharah kriti kripanarakshakah || 30|| kevalah
    keshavah kelikarah kevalanayakah | kailasavasi kameshah kavih kapatavarjitah || 31|| kotikandarpasaubhagyasundaro
    madhurasmitah | gadadharo ganasvami garishthastomarayudhah || 32|| garvito gaganavaso granthitraya
    vibhedanah | gahvareshtho ganadhisho ganesho gativarjitah || 33|| gayako garudarudho gajasuravimardanah
    | gayatrivallabho gargyo gayakanugrahonmukhah || 34|| guhashayo gunatito gurumurtirguhapriyah | gudho
    guhyataro gopyo gorakshi ganasevitah || 35|| caturbhujashshatatanuh shamitakhila kautukah | caturvaktrashcakradharah
    pancavaktrah parantapa || 36|| cicchaktilocananandakandalah kundapandarah | cidanandanatadhishah citkevalavapurdharah
    || 37|| cidekarasasampurnah hrim shivashshrimaheshvarah | caitanyam cicchidvaitashcinmatrashcitsabhadhipah
    || 38|| jatadharo'mritadharo'mritamshuramritodbhavah | jatilashcatulapango mahanatanalampatah || 39||
    janardano jagatsvami janmakarmanivarakah | javano jagadadharo jamadagnirjaraharah || 40|| jahnukanyadharo
    janmajaramrityunivarakah | nantanadinamayuktavishnunamyapadambujah || 41|| tattvavabodhastatveshastatvabhavastaponidhih
    || tarunastarakastamrastarishnustatvabodhakah | tridhama trijjagaddhetuh trimurtistiryagurdhvagah
    || 42|| trimatrikastrivridrupah tritiyastrigunadhikah | dakshadhvaraharo daksho daharastho dayanidhih
    || 43|| dakshinagnirgarhapatyo damano danavantakah | dirghapingajatajuto dirghabahurdigambarah ||
    44|| duraradhyo duradharsho dushtaduro durasadah | durvijneyo duracaranashano durmadantakah || 45||
    daivyo bhishak pramanajno brahmanyo brahmanatmakah | drashta darshayita danto dakshinamurtirupabhrit
    || 46|| dhanvi dhanadhipo dhanyo dharmagopta dharadhipah | dhushnurdutastikshnadamshtrassudhanva sutadah
    sukhi || 47|| dhyanagamyo dhyatrirupo dhyeyo dharmavidam varah | naktancarah prakrintanam patirgiricaro
    guruh || 48|| nandinatyapriyo nandi natesho nataveshabhrit | namadanandado namyo nagarajaniketanah
    || 49|| narasimho nagadhyaksho nadanto nadavarjitah | nicerukah paricaro'ranyanam patiradbhutah ||
    50|| nirankusho niradharo nirapayo niratyayah | niranjano nityashuddho nityabuddho nirashrayah ||
    51|| niramsho nigamanando niranando nidanabhuh | nirvanado nirvritistho nirvairo nirupadhikah || 52||
    nirvikalpo niralambo nirvikaro niramayah | nishangishudhimanindrastaskaranamadhishvarah || 53|| nispandah
    pratyayanando nirnimesho nirantarah | naishkarmyado navarasah tristhastripurabhairavah || 54|| pancabhutaprabhuh
    pancapujasantushtamanasah | pancayajnapriyah pancapranadhipatiravyayah || 55|| patanjaliprananashca
    paraparavivarjitah | patih pancatvanirmuktah pancakrityaparayanah || 56|| pattinamadhipah kritsnavito
    dhavamshca sattvapah | paramatma param jyotih parameshthi paratparah || 57|| parnashadyah pratyagatma
    prasannah paramonnatah | pavitrah parvatidarah paramapannivarakah || 58|| patalamshuh patutarah parijatadrumulagah
    | papatavibrihadbhanuh bhanumatkotikotibhah || 59|| pashi patakasamharta tikshneshustimirapahah |
    punyah pumanpurishayah pusha purnah puratanah || 60|| purajitpurvajah pushpahasah punyaphalapradah
    | puruhutah puradveshi puratrayaviharavan || 61|| pulastyah kshayano grihyo goshthyo goparipalakah
    | pushtanam patiravyagro bhavahetirjagatpatih || 62|| prakritishah pratishthata prabhavah pramathah
    prathi | prapancopashamo namarupadvayavivarjitah || 63|| prapancollasanirmuktah pratyakshah pratibhatmakah
    prabuddhah paramodarah paramanandasagarah || 64|| pramanah pranavah prajnah pranadah prananayakah
    | pravegah pramadardhangah pranartanaparayanah || 65|| babhrurbahuvidhakaro balapramathano bali |
    babhrusho bhagavanbhavyo vivyadhi vigatajvarah || 66|| bilmi varuthi dundubhyahananyau pramrishabhidhah
    | brahmavidyagururguhyo guhyakaissamabhishtutah || 67|| brahmavidyaprado brahma brihadgarbho brihaspatih
    | brahmandakandavisphotamahapralayatandavah || 68|| brahmishtho brahmasutrartho brahmanyo brahmacetanah
    | bhaganetraharo bhargo bhavaghno bhaktimannidhih || 69|| bhadro bhadraprado bhadravahano bhaktavatsalah
    | bhavajno bandhavicchetta bhavatito'bhayankarah || 70|| bhavabhavavinirmukto bharupo bhavito bharah
    | bhutamuktavalitantuh bhutapurvo bhujangabhrit || 71|| bhuma bhutapatirbhavyo bhurbhuvovyahritipriyah
    | bhringinatyapramanajno bhramarayitanatyakrit || 72|| bhrajishnurbhavanagamyo bhrantijnanavinashanah
    | manishi manujadhisho mithyapratyayanashanah || 73|| manobharta manogamyo mananaikaparayanah | manovacobhiragrahyo
    mahabilakritalayah || 74|| mayaskaro mahatirthyah kulyah paryah padatmakah | maharddhirmahimadharo
    mahasenagururmahah || 75|| mahakarta mahabhokta mahasamvinmayo madhuh | mahatatparyanilayah pratyagbrahmaikyanishcayah
    || 76|| mahanando mahaskando mahendro mahasannidhih | mahamayo mahagraso mahaviryo mahabhujah || 77||
    mahogratandavabhijnah paribhramanatandavah | manibhadrarcito manyo mayavi mantriko mahan || 78|| mayanatakakrinmayi
    mayayantravimocakah | mayanatyavinodajno mayanatanashikshakah || 79|| midhushtamo mrigadharo mrikandutanayapriyah
    | muniratarya aladyah sikatyashca ki~shilah || 80|| mocako mohavicchetta modaniyo mahaprabhuh | yashasvi
    yajamanatma yajnabhugyajanapriyah || 81|| yaksharadyajnaphalado yajnamurtiryashaskarah | yogagamyo
    yoganishtho yoganando yudhishthirah || 82|| yogayoniryathabhuto yakshagandharvavanditah | ravimandalamadhyastho
    rajogunavivarjitah || 83|| rajarajeshvaro ramyo ratrincara vinashanah | ratirdatishcatushpadah svatmabandhaharah
    svabhuh || 84|| rudrakshasranmayakalpah kahlarakiranadyutih | rohitassthapatirvrikshapatirmantri ca
    vanijah || 85|| lasyamritabdhilaharipurnenduh punyagocarah | varado vamano vandyo varishtho vajravarmabhrit
    || 86|| varabhayaprado brahmapuccho brahmavidam varah | vashi varenyo vitato vajrabhridvarunatmakah
    || 87|| vahnimandalamadhyastho varshiyan varuneshvarah | vacyavacakanirmukto vagisho vagagocarah ||
    88|| vikararahito vishnurviradisho viranmayah | vighneshvaro vighnaneta shaktipanih sharodbhavah ||
    89|| vijighatso vigatabhirvipipaso vibhavana | vidagdhamugdhaveshadyo vishvatito vishokadah || 90||
    vidyanidhirvirupaksho vishvayonirvrishadhvajah | vidyutyo vivaho medhyo reshmiyo vastupo vasah ||
    91|| vidvattamo vidurastho vishramo vedanamayah | viyadadijagatsrashta vividhanandadayakah || 92||
    virathridayapadmastho vidhirvishvadhiko vibhuh | virupo vishvadigvyapi vitashoko virocanah || 93||
    vishrantibhurvivasano vighnahanta vinodakah | visha
  devanagari: शुकभृद्वामं कराम्भोरुहं ढक्काच्छाक्षस्रगुत्पलाभयकरं वामं पदं कुञ्चितम् । उद्धृत्याधरभूत
    पृष्ठविलसद्दक्षाङ्घ्रिमर्धाम्बिकं सामीवस्त्रसुवेणिदृक्कुचभरं ध्यायेन्नटं मेलनम् ॥ ३॥ ध्यायेदात्मविमोहसंस्थितपदं
    रक्तांशुकं शङ्करं किञ्चित्कुञ्चितवामपादमतुलं व्यालम्बबाहुं त्रिभिः । वामे पौण्ड्र धनुश्च पाशदहनौ दक्षे
    करे चाभयं पौष्पं मार्गणमङ्कुशं डमरुकं बिभ्राणमच्छच्छविम् ॥ ४॥ ॥ अथ सहस्रनामस्तोत्रम् ॥ अखण्डबोधोऽखण्डात्मा
    घण्टामण्डलमण्डितः । अखण्डानन्दचिद्रूपः परमानन्दताण्डवः ॥ १॥ अगम्यमहिमाम्भोधिः अनौपम्ययशोनिधिः । अग्रेवधोऽग्रेसम्पूज्यो
    हन्ता तारो मयोभवः ॥ २॥ अघोरोऽद्बुतचारित्र आनन्दवपुरग्रणीः । अजीर्णस्सुकुमारोऽन्यः पारदर्शी पुरन्दरः
    ॥ ३॥ अतर्क्यस्सुकरस्सारः सत्तामात्रस्सदाशिवः । अनन्तरूप एकात्मा स्वस्तरुर्व्याहृतिः स्वधा ॥ अनन्तशक्तिराचार्यः
    पुष्कलस्सर्वपूरणः । अनर्घरत्नखचितकिरीटो निकटेस्थितः ॥ ५॥ अनहङ्कृतिरच्छेद्यस्स्वानन्दैकघनाकृतिः । अनावरणविज्ञानो
    निर्विभागो विभावसुः ॥ ६॥ अनिर्देश्योऽनिलोऽगम्योऽविक्रियोऽमोघवैभवः । अनुत्तमः परोदासो मुक्तिदो मुदिताननः
    ॥ ७॥ अन्नानां पतिरत्युग्रो हरिध्येयोऽद्वयाकृतिः । अपरोक्षोऽव्रणोऽलिङ्गोऽप्यद्वेष्टा प्रेमसागरः ॥ ८॥
    अपर्यन्तोऽपरिच्छेद्योऽगोचरो रुग्विमोचकः । अपस्मृतिन्यस्तपादः कृत्तिवासाः कृपाकरः ॥ ९॥ अप्रमेयोऽप्रतिरथः
    प्रद्युम्नः प्रमथेश्वरः । अमानी मदनोऽमन्युरमानो मानदो मनुः ॥ १०॥ अमूल्यमणिसभास्वत्फणीन्द्रकरकङ्कणः
    । अरुणः शरणः शर्वः शरण्य शर्मदः शिवः ॥ ११॥ अवशस्स्ववशस्स्थास्नुरन्तर्यामी शतक्रतुः । अशुभक्षयकृज्ज्योतिरनाकाशस्त्वलेपकः
    ॥ १२॥ अस्नेहस्सङ्गनिर्मुक्तोऽह्रस्वोऽदीर्घोऽविशेषकः अक्षरस्त्र्यक्षरस्त्रयक्षः पक्षपातविवर्जितः ॥
    १३॥ आततावी महारुद्रः क्षेत्राणामधिपोऽक्षदः । आतन्वानश्शतानन्दो गृत्सो गृत्सपतिस्मृरः ॥ १४॥ आदित्यवर्णस्सञ्ज्योतिस्सम्यग्दर्शनतत्परः
    । आदिभूतो महाभूतस्स्वेच्छाकलितविग्रहः ॥ १५॥ आप्तकामोऽनुमन्ताऽऽत्मकामोऽभिन्नोऽनणुर्हरः । आभास्वरः परन्तत्वमादिमः
    पेशलः पविः ॥ १६॥ आव्याधिपतिरादित्यः ककुभः कालकोविदः । इच्छानिच्छाविरहितो विहारी वीर्यवर्धनः ॥ १७॥
    उद्दण्डताण्डवश्चण्ड ऊर्ध्वताण्डवपण्डितः । उदासीनौपद्रष्टा मौनगम्यो मुनीश्वरः ॥ १८॥ ऊर्ध्वपादूर्ध्वरेताश्च
    प्रौढनर्तनलम्पटः । ओषधीशस्सतामीशौच्चैर्घोषो विभीषणः ॥ १९॥ कन्दर्प कोटिसदृशः कपर्दी कमलाननः । कपालमालाभरणाः
    कङ्कालः कलिनाशनः ॥ २०॥ कपालमालालङ्कारः कालान्तकवपुर्धरः । कमनीयः कलानाथशेखरः कम्बुकन्धरः ॥ २१॥ कमनीयनिजानन्दमुद्राञ्चितकराम्बुजः
    । कराब्जधृतकालाग्निः कदम्बकुसुमारुणः ॥ २२॥ करिचर्माम्बरधरः कपाली कलुषापहः । कल्याणमूर्तिः कल्याणीरमणः
    कमलेक्षणः ॥ २३॥ कक्षपश्च भुवन्तिश्च भवाख्यो वारिवस्कृतः । कालकण्ठः कालकालः कालकूटविषाशनः ॥ २४॥ कालनेता
    कालहन्ता कालचक्रप्रवर्तकः । कालज्ञः कामदः कान्तः कामारिः कामपालकः ॥ २५॥ कालात्मा कालिकानाथः कार्कोटकविभूषणः
    । कालिकानाट्यरसिको निशानटननिश्चलः ॥ २६॥ कालीवादप्रियः कालः कालातीतः कलाधरः । कुठारभृत्कुलाद्रीशः कुञ्चितैकपदाम्बुजः
    ॥ २७॥ कुलुञ्चानां पतिः कूप्यो धन्वावी धनदाधिपः । कूटस्थः कूर्मपीठस्थः कूश्माण्डग्रहमोचकः ॥ २८॥ कूलङ्कषकृपासिन्धुः
    कुशली कुङ्कुमेश्वरः । कृतज्ञः कृतिसारज्ञः कृशानुः कृष्णपिङ्गलः ॥ २९॥ कृताकृतः कृशः कृष्णाः शान्तिदः
    शरभाकृतिः । कृतान्तकृत्क्रियाधारः कृती कृपणरक्षकः ॥ ३०॥ केवलः केशवः केलीकरः केवलनायकः । कैलासवासी
    कामेशः कविः कपटवर्जितः ॥ ३१॥ कोटिकन्दर्पसौभाग्यसुन्दरो मधुरस्मितः । गदाधरो गणस्वामी गरिष्ठस्तोमरायुधः
    ॥ ३२॥ गर्वितो गगनावासो ग्रन्थित्रय विभेदनः । गह्वरेष्ठो गणाधीशो गणेशो गतिवर्जितः ॥ ३३॥ गायको गरुडारूढो
    गजासुरविमर्दनः । गायत्रीवल्लभो गार्ग्यो गायकानुग्रहोन्मुखः ॥ ३४॥ गुहाशयो गुणातीतो गुरुमूर्तिर्गुहप्रियः
    । गूढो गुह्यतरो गोप्यो गोरक्षी गणसेवितः ॥ ३५॥ चतुर्भुजश्शततनुः शमिताखिल कौतुकः । चतुर्वक्त्रश्चक्रधरः
    पञ्चवक्त्रः परन्तप ॥ ३६॥ चिच्छक्तिलोचनानन्दकन्दलः कुन्दपाण्डरः । चिदानन्दनटाधीशः चित्केवलवपुर्धरः
    ॥ ३७॥ चिदेकरससम्पूर्णः ह्रीं शिवश्श्रीमहेश्वरः । चैतन्यं चिच्छिद्वैतश्चिन्मात्रश्चित्सभाधिपः ॥ ३८॥
    जटाधरोऽमृताधारोऽमृतांशुरमृतोद्भवः । जटिलश्चटुलापाङ्गो महानटनलम्पटः ॥ ३९॥ जनार्दनो जगत्स्वामी जन्मकर्मनिवारकः
    । जवनो जगदाधारो जमदग्निर्जराहरः ॥ ४०॥ जह्नुकन्याधरो जन्मजरामृत्युनिवारकः । णान्तनादिनामयुक्तविष्णुनम्यपदाम्बुजः
    ॥ ४१॥ तत्त्वावबोधस्तत्वेशस्तत्वभावस्तपोनिधिः ॥ तरुणस्तारकस्ताम्रस्तरिष्णुस्तत्वबोधकः । त्रिधामा त्रिज्जगद्धेतुः
    त्रिमूर्तिस्तिर्यगूर्ध्वगः ॥ ४२॥ त्रिमातृकस्त्रिवृद्रूपः तृतीयस्त्रिगुणाधिकः । दक्षाध्वरहरो दक्षो
    दहरस्थो दयानिधिः ॥ ४३॥ दक्षिणाग्निर्गार्हपत्यो दमनो दानवान्तकः । दीर्घपिङ्गजटाजूटो दीर्घबाहुर्दिगम्बरः
    ॥ ४४॥ दुराराध्यो दुराधर्षो दुष्टदूरो दुरासदः । दुर्विज्ञेयो दुराचारनाशनो दुर्मदान्तकः ॥ ४५॥ दैव्यो
    भिषक् प्रमाणज्ञो ब्रह्मण्यो ब्राह्मणात्मकः । द्रष्टा दर्शयिता दान्तो दक्षिणामूर्तिरूपभृत् ॥ ४६॥ धन्वी
    धनाधिपो धन्यो धर्मगोप्ता धराधिपः । धूष्णुर्दूतस्तीक्ष्णदम्ष्ट्रस्सुधन्वा सुतदः सुखी ॥ ४७॥ ध्यानगम्यो
    ध्यातृरूपो ध्येयो धर्मविदां वरः । नक्तञ्चरः प्रकृन्तानां पतिर्गिरिचरो गुरुः ॥ ४८॥ नन्दिनाट्यप्रियो
    नन्दी नटेशो नटवेषभृत् । नमदानन्ददो नम्यो नगराजनिकेतनः ॥ ४९॥ नारसिंहो नगाध्यक्षो नादान्तो नादवर्जितः
    । निचेरुकः परिचरोऽरण्यानां पतिरद्भुतः ॥ ५०॥ निरङ्कुशो निराधारो निरपायो निरत्ययः । निरञ्जनो नित्यशुद्धो
    नित्यबुद्धो निराश्रयः ॥ ५१॥ निरंशो निगमानन्दो निरानन्दो निदानभूः । निर्वाणदो निर्वृतिस्थो निर्वैरो
    निरुपाधिकः ॥ ५२॥ निर्विकल्पो निरालम्बो निर्विकारो निरामयः । निषङ्गीषुधिमानिन्द्रस्तस्कराणामधीश्वरः
    ॥ ५३॥ निस्पन्दः प्रत्ययानन्दो निर्निमेषो निरन्तरः । नैष्कर्म्यदो नवरसः त्रिस्थस्त्रिपुरभैरवः ॥ ५४॥
    पञ्चभूतप्रभुः पञ्चपूजासन्तुष्टमानसः । पञ्चयज्ञप्रियः पञ्चप्राणाधिपतिरव्ययः ॥ ५५॥ पतञ्जलिप्राणनाश्च
    परापरविवर्जितः । पतिः पञ्चत्वनिर्मुक्तः पञ्चकृत्यपरायणः ॥ ५६॥ पत्तीनामधिपः कृत्स्नवीतो धावंश्च सत्त्वपः
    । परमात्मा परं ज्योतिः परमेष्ठी परात्परः ॥ ५७॥ पर्णशद्यः प्रत्यगात्मा प्रसन्नः परमोन्नतः । पवित्रः
    पार्वतीदारः परमापन्निवारकः ॥ ५८॥ पाटलाम्शुः पटुतरः पारिजातद्रुमूलगः । पापाटवीबृहद्भानुः भानुमत्कोटिकोटिभः
    ॥ ५९॥ पाशी पातकसंहर्ता तीक्ष्णेषुस्तिमिरापहः । पुण्यः पुमान्पुरिशयः पूषा पूर्णः पुरातनः ॥ ६०॥ पुरजित्पूर्वजः
    पुष्पहासः पुण्यफलप्रदः । पुरुहूतः पुरद्वेषी पुरत्रयविहारवान् ॥ ६१॥ पुलस्त्यः क्षयणो गृह्यो गोष्ठ्यो
    गोपरिपालकः । पुष्टानां पतिरव्यग्रो भवहेतिर्जगत्पतिः ॥ ६२॥ प्रकृतीशः प्रतिष्ठाता प्रभवः प्रमथः प्रथी
    । प्रपञ्चोपशमो नामरूपद्वयविवर्जितः ॥ ६३॥ प्रपञ्चोल्लासनिर्मुक्तः प्रत्यक्षः प्रतिभात्मकः प्रबुद्धः
    परमोदारः परमानन्दसागरः ॥ ६४॥ प्रमाणः प्रणवः प्राज्ञः प्राणदः प्राणनायकः । प्रवेगः प्रमदार्धाङ्गः प्रनर्तनपरायणः
    ॥ ६५॥ बभ्रुर्बहुविधाकारो बलप्रमथनो बली । बभ्रुशो भगवान्भाव्यो विव्याधी विगतज्वरः ॥ ६६॥ बिल्मी वरूथी
    दुन्दुभ्याहनन्यौ प्रमृशाभिधः । ब्रह्मविद्यागुरुर्गुह्यो गुह्यकैस्समभिष्टुतः ॥ ६७॥ ब्रह्मविद्याप्रदो
    ब्रह्म बृहद्गर्भो बृहस्पतिः । ब्रह्माण्डकाण्डविस्फोटमहाप्रलयताण्डवः ॥ ६८॥ ब्रह्मिष्ठो ब्रह्मसूत्रार्थो
    ब्रह्मण्यो ब्रह्मचेतनः । भगनेत्रहरो भर्गो भवघ्नो भक्तिमन्निधिः ॥ ६९॥ भद्रो भद्रप्रदो भद्रवाहनो भक्तवत्सलः
    । भावज्ञो बन्धविच्छेत्ता भावातीतोऽभयङ्करः ॥ ७०॥ भावाभावविनिर्मुक्तो भारूपो भावितो भरः । भूतमुक्तावलीतन्तुः
    भूतपूर्वो भुजङ्गभृत् ॥ ७१॥ भूमा भूतपतिर्भव्यो भूर्भुवोव्याहृतिप्रियः । भृङ्गिनाट्यप्रमाणज्ञो भ्रमरायितनाट्यकृत्
    ॥ ७२॥ भ्राजिष्णुर्भावनागम्यो भ्रान्तिज्ञानविनाशनः । मनीषी मनुजाधीशो मिथ्याप्रत्ययनाशनः ॥ ७३॥ मनोभर्ता
    मनोगम्यो मननैकपरायणः । मनोवचोभिरग्राह्यो महाबिलकृतालयः ॥ ७४॥ मयस्करो महातिर्थ्यः कूल्यः पार्यः पदात्मकः
    । महर्द्धिर्महिमाधारो महासेनगुरुर्महः ॥ ७५॥ महाकर्ता महाभोक्ता महासंविन्मयो मधुः । महातात्पर्यनिलयः
    प्रत्यग्ब्रह्मैक्यनिश्चयः ॥ ७६॥ महानन्दो महास्कन्दो महेन्द्रो महसान्निधिः । महामायो महाग्रासो महावीर्यो
    महाभुजः ॥ ७७॥ महोग्रताण्डवाभिज्ञः परिभ्रमणताण्डवः । माणिभद्रार्चितो मान्यो मायावी मान्त्रिको महान्
    ॥ ७८॥ मायानाटककृन्मायी मायायन्त्रविमोचकः । मायानाट्यविनोदज्ञो मायानटनशिक्षकः ॥ ७९॥ मीढुष्टमो मृगधरो
    मृकण्डुतनयप्रियः । मुनिरातार्य आलाद्यः सिकत्यश्च किँशिलः ॥ ८०॥ मोचको मोहविच्छेत्ता मोदनीयो महाप्रभुः
    । यशस्वी यजमानात्मा यज्ञभुग्यजनप्रियः ॥ ८१॥ यक्षराड्यज्ञफलदो यज्ञमूर्तिर्यशस्करः । योगगम्यो योगनिष्ठो
    योगानन्दो युधिष्ठिरः ॥ ८२॥ योगयोनिर्यथाभूतो यक्षगन्धर्ववन्दितः । रविमण्डलमध्यस्थो रजोगुणविवर्जितः
    ॥ ८३॥ राजराजेश्वरो रम्यो रात्रिञ्चर विनाशनः । रातिर्दातिश्चतुष्पादः स्वात्मबन्धहरः स्वभूः ॥ ८४॥ रुद्राक्षस्रङ्मयाकल्पः
    कह्लारकिरणद्युतिः । रोहितस्स्थपतिर्वृक्षपतिर्मन्त्री च वाणिजः ॥ ८५॥ लास्यामृताब्धिलहरीपूर्णेन्दुः
    पुण्यगोचरः । वरदो वामनो वन्द्यो वरिष्ठो वज्रवर्मभृत् ॥ ८६॥ वराभयप्रदो ब्रह्मपुच्छो ब्रह्मविदां वरः
    । वशी वरेण्यो विततो वज्रभृद्वरुणात्मकः ॥ ८७॥ वह्निमण्डलमध्यस्थो वर्षीयान् वरुणेश्वरः । वाच्यवाचकनिर्मुक्तो
    वागीशो वागगोचरः ॥ ८८॥ विकाररहितो विष्णुर्विराडीशो विराण्मयः । विघ्नेश्वरो विघ्ननेता शक्तिपाणिः शरोद्भवः
    ॥ ८९॥ विजिघत्सो विगतभीर्विपिपासो विभावना । विदग्धमुग्धवेषाड्यो विश्वातीतो विशोकदः ॥ ९०॥ विद्यानिधिर्विरूपाक्षो
    विश्वयोनिर्वृषध्वजः । विद्युत्यो विवहो मेध्यो रेष्मियो वास्तुपो वासः ॥ ९१॥ विद्वत्तमो विदूरस्थो विश्रमो
    वेदनामयः । वियदादिजगत्स्रष्टा विविधानन्ददायकः ॥ ९२॥ विराठृदयपद्मस्थो विधिर्विश्वाधिको विभुः । विरूपो
    विश्वदिग्व्यापी वीतशोको विरोचनः ॥ ९३॥ विश्रान्तिभूर्विवसनो विघ्नहन्ता विनोदकः । विश
