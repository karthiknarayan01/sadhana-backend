    नमः । ॐ ऐं ग्लौं कृत्यै नमः । ॐ ऐं ग्लौं कान्तायै नमः । ५० ॐ ऐं ग्लौं स्वाहायै नमः । ॐ ऐं ग्लौं शान्त्यै
    नमः । ॐ ऐं ग्लौं तमायै नमः । ॐ ऐं ग्लौं रत्यै नमः । ॐ ऐं ग्लौं लज्जायै नमः । ॐ ऐं ग्लौं मत्यै नमः
