id: kalisantaranopanishat
category: upanishad
name:
  english: kalisantaranopanishat
  devanagari: कलिसन्तरणोपनिषत्
content:
  english: upanishad kalisantaranopanishat yaddivyanama smaratam samsaro goshpadayate | sa navyabhaktirbhavati
    tadramapadamashraye || om saha navavatu | saha nau bhunaktu | saha viryamkaravavahai | tejasvinavadhitamastu
    ma vidvishavahai | om shantih shantih shantih | harih om | dvaparante narado brahmanam jagama katham
    bhagavan gam paryatan kalim santareyamiti | sa hovaca brahma sadhu prishto'smi sarvashrutirahasyam
    gopyam tacchrinu yena kalisamsaram tarishyasi | bhagavata adipurushasya narayanasya namoccaranamatrena
    nirdhutakalirbhavatiti || 1 || naradah punah papraccha tannama kimiti | sa hovaca hiranyagarbhah |
    hare rama hare rama rama rama hare hare | hare krishna hare krishna krishna krishna hare hare || iti
    shodashakam namnam kalikalmashanashanam | natah parataropayah sarvavedeshu drishyate || shodashakalavritasya
    jivasyavaranavinashanam | tatah prakashate param brahma meghapaye ravirashmimandaliveti || 2 || punarnaradah
    papraccha bhagavan ko'sya vidhiriti | tam hovaca nasya vidhiriti | sarvada shucirashucirva pathan
    brahmanah salokatam samipatam sarupatam sayujyameti | yadasya shodashakasya sardhatrikotirjapati tada
    brahmahatyam tarati | tarati virahatyam | svarnasteyat puto bhavati | vrishaligamanat puto bhavati
    | pitridevamanushyanamapakarat puto bhavati | sarvadharmaparityagapapat sadyah shucitamapnuyat | sadyo
    mucyate sadyo mucyate ityupanishat || 3 || om saha navavatu | saha nau bhunaktu | saha viryamkaravavahai
    | tejasvinavadhitamastu ma vidvishavahai | om shantih shantih shantih | adhikadhyayanaya
  devanagari: उपनिषद् कलिसन्तरणोपनिषत् यद्दिव्यनाम स्मरतां संसारो गोष्पदायते । सा नव्यभक्तिर्भवति तद्रामपदमाश्रये
    ।। ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यंकरवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै । ॐ शान्तिः
    शान्तिः शान्तिः । हरिः ॐ । द्वापरान्ते नारदो ब्रह्माणं जगाम कथं भगवन् गां पर्यटन् कलिं सन्तरेयमिति
    । स होवाच ब्रह्मा साधु पृष्टोऽस्मि सर्वश्रुतिरहस्यं गोप्यं तच्छृणु येन कलिसंसारं तरिष्यसि । भगवत आदिपुरुषस्य
    नारायणस्य नामोच्चारणमात्रेण निर्धूतकलिर्भवतीति ॥ १ ॥ नारदः पुनः पप्रच्छ तन्नाम किमिति । स होवाच हिरण्यगर्भः
    । हरे राम हरे राम राम राम हरे हरे । हरे कृष्ण हरे कृष्ण कृष्ण कृष्ण हरे हरे ॥ इति षोडशकं नाम्नां कलिकल्मषनाशनम्
    । नातः परतरोपायः सर्ववेदेषु दृश्यते ॥ षोडशकलावृतस्य जीवस्यावरणविनाशनम् । ततः प्रकाशते परं ब्रह्म मेघापाये
    रविरश्मिमण्डलीवेति ॥ २ ॥ पुनर्नारदः पप्रच्च्ह भगवन् कोऽस्य विधिरिति । तं होवाच नास्य विधिरिति । सर्वदा
    शुचिरशुचिर्वा पठन् ब्राह्मणः सलोकतां समीपतां सरूपतां सायुज्यमेति । यदास्य षोडशकस्य सार्धत्रिकोटीर्जपति
    तदा ब्रह्महत्यां तरति । तरति वीरहत्याम् । स्वर्णस्तेयात् पूतो भवति । वृषलीगमनात् पूतो भवति । पितृदेवमनुष्याणामपकारात्
    पूतो भवति । सर्वधर्मपरित्यागपापात् सद्यः शुचितामाप्नुयात् । सद्यो मुच्यते सद्यो मुच्यते इत्युपनिषत्
    ॥ ३ ॥ ॐ सह नाववतु । सह नौ भुनक्तु । सह वीर्यंकरवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै । ॐ शान्तिः
    शान्तिः शान्तिः । अधिकाध्ययनाय
