id: brahmakritam13vishnustotram
category: stotram
name:
  english: brahmakritam13vishnustotram
  devanagari: ब्रह्मकृतं१३विष्णुस्तोत्रम्
content:
  english: brahmakritam 13 vishnustotram namaste brahmahridaya namaste mama purvaja | lokadya bhuvanashreshtha
    sankhyayoganidhe vibho || 34|| vyaktavyaktakaracintya kshemam panthanamasthita | vishvabhuksarvabhutanamantaratmannayonija
    || 35|| aham prasadajastubhyam lokadhamne svayambhuve | tvatto me manasam janma prathamam dvijapujitam
    || 36|| cakshusham vai dvitiyam me janma casitpuratanam | tvatprasadacca me janma tritiyam vacikam
    mahat || 37|| tvattah shravanajam capi caturtham janma me vibho | nasikyam capi me janma tvattah pancamamucyate
    || 38|| andajam capi me janma tvattah shashtham vinirmitam | idam ca saptamam janma padmajam me'mitaprabha
    || 39|| sarge sarge hyaham putrastava trigunavarjitah | prathitah pundarikaksha pradhanagunakalpitah
    || 40|| tvamishvarasvabhavashca svayambhuh purushottamah | tvaya vinirmito'ham vai vedacakshurvayotigah
    || 41|| te me veda hritashcakshurandho jato'smi jagrihi | dadasva cakshushi mahyam priyo'ham te priyo'si
    me || 42|| iti mahabharate shantiparvani 335 adhyayantargatam brahmakritam vishnustotram sampurnam
    | mahabharata | shantiparva | adhyaya 335
  devanagari: ब्रह्मकृतं १३ विष्णुस्तोत्रम् नमस्ते ब्रह्महृदय नमस्ते मम पूर्वज । लोकाद्य भुवनश्रेष्ठ साङ्ख्ययोगनिधे
    विभो ॥ ३४॥ व्यक्ताव्यक्तकराचिन्त्य क्षेमं पन्थानमास्थित । विश्वभुक्सर्वभूतानामन्तरात्मन्नयोनिज ॥ ३५॥
    अहं प्रसादजस्तुभ्यं लोकधाम्ने स्वयम्भुवे । त्वत्तो मे मानसं जन्म प्रथमं द्विजपूजितम् ॥ ३६॥ चाक्षुषं
    वै द्वितीयं मे जन्म चासीत्पुरातनम् । त्वत्प्रसादाच्च मे जन्म तृतीयं वाचिकं महत् ॥ ३७॥ त्वत्तः श्रवणजं
    चापि चतुर्थं जन्म मे विभो । नासिक्यं चापि मे जन्म त्वत्तः पञ्चममुच्यते ॥ ३८॥ अण्डजं चापि मे जन्म त्वत्तः
    षष्ठं विनिर्मितम् । इदं च सप्तमं जन्म पद्मजं मेऽमितप्रभ ॥ ३९॥ सर्गे सर्गे ह्यहं पुत्रस्तव त्रिगुणवर्जितः
    । प्रथितः पुण्डरीकाक्ष प्रधानगुणकल्पितः ॥ ४०॥ त्वमीश्वरस्वभावश्च स्वयम्भूः पुरुषोत्तमः । त्वया विनिर्मितोऽहं
    वै वेदचक्षुर्वयोतिगः ॥ ४१॥ ते मे वेदा हृताश्चक्षुरन्धो जातोऽस्मि जागृहि । ददस्व चक्षुषी मह्यं प्रियोऽहं
    ते प्रियोऽसि मे ॥ ४२॥ इति महाभारते शान्तिपर्वणि ३३५ अध्यायान्तर्गतं ब्रह्मकृतं विष्णुस्तोत्रं सम्पूर्णम्
    । महाभारत । शान्तिपर्व । अध्याय ३३५
