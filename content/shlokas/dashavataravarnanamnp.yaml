id: dashavataravarnanamnp
category: stotram
name:
  english: dashavataravarnanamnP
  devanagari: दशावतरवर्णनम्ण्P
content:
  english: rinushva mahipala pavitran papanashanan || 1|| yatha matsyena rupena datta vedah svayambhuve
    | madhukaitabhau ca nidhanam prapitau ca mahatmana || 2|| yatha kaurmena rupena vishnuna mandaro dhritah
    | tatha prithvi dhrita rajan varahena mahatmana || 3|| tenaiva nidhanam prapto yatha rajan mahabalah
    | hiranyaksho mahaviryo ditiputro mahatanuh || 4|| yatha hiranyakashipustridashanamarih pura | narasimhena
    devena prapito nidhanam nripa || 5|| yatha baddho balih purvam vamanena mahatmana | indrastribhuvanadhyakshah
    kritastena nripatmaja || 6|| ramena bhutva ca yatha vishnuna ravano hatah | saganashcadabhuta rajan
    rakshasa devakantakah || 7|| yatha parashuramena kshatramutsaditam pura | balabhadrena ramena yatha
    daityah pura hatah || 8|| yatha krishnena kamsadya hata daityah suradvishah | kalau prapte yatha buddho
    bhavennarayanah prabhuh || 9|| kalkirupam samasthaya yatha mleccha nipatitah | samapte tu kalau bhuyastatha
    te kathayamyaham || 10|| hareranantasya parakramam yah sha
  devanagari: ृणुष्व महीपाल पवित्रान् पापनाशनान् ॥ १॥ यथा मत्स्येन रूपेण दत्ता वेदाः स्वयम्भुवे । मधुकैटभौ
    च निधनं प्रापितौ च महात्मना ॥ २॥ यथा कौर्मेण रूपेण विष्णुना मन्दरो धृतः । तथा पृथ्वी धृता राजन् वाराहेण
    महात्मना ॥ ३॥ तेनैव निधनं प्राप्तो यथा राजन् महाबलः । हिरण्याक्षो महावीर्यो दितिपुत्रो महातनुः ॥ ४॥
    यथा हिरण्यकशिपुस्त्रिदशानामरिः पुरा । नरसिंहेन देवेन प्रापितो निधनं नृप ॥ ५॥ यथा बद्धो बलिः पूर्वं
    वामनेन महात्मना । इन्द्रस्त्रिभुवनाध्यक्षः कृतस्तेन नृपात्मज ॥ ६॥ रामेण भूत्वा च यथा विष्णुना रावणो
    हतः । सगणाश्चदभुता राजन् राक्षसा देवकण्टकाः ॥ ७॥ यथा परशुरामेण क्षत्रमुत्सादितं पुरा । बलभद्रेण रामेण
    यथा दैत्यः पुरा हतः ॥ ८॥ यथा कृष्णेन कंसाद्या हता दैत्याः सुरद्विषः । कलौ प्राप्ते यथा बुद्धो भवेन्नारायणः
    प्रभुः ॥ ९॥ कल्किरूपं समास्थाय यथा म्लेच्छा निपातिताः । समाप्ते तु कलौ भूयस्तथा ते कथयाम्यहम् ॥ १०॥
    हरेरनन्तस्य पराक्रमं यः श
