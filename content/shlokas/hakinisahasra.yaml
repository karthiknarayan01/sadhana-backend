id: hakinisahasra
category: stotram
name:
  english: hakinisahasra
  devanagari: हाकिनीसहस्र
content:
  english: dehantargata mahakayajnanasiddhyarthe jape viniyogah | om hakini vasudha lakshmi paramatmakala
    para | parapriya paratita parama paramapriya || 3 || pareshvari paraprema parabrahmasvarupini | parantapa
    parananda paranathanisevini || 4 || parakashasthita para paraparanirupini | parakankshya parashaktih
    puratanatanuh prabha || 5 || pancananapriya purva paradara paradara | paradeshagata natha paramahladavardhini
    || 6 || parvati parakulakhya paranjanasulocana | parambrahmapriya maya parambrahmaprakashini || 7
    || parambrahmajnanagamya parambrahmeshvaraprimaya | purvatita paratita aparamahimasthita || 8 || aparasagaroddhara
    aparadustaroddhara | paranalashikhakara parabhrumadhyavasini || 9 || parashreshtha parakshetravasini
    paramalini | parvateshvarakanya ca paragnikotisambhava || 10 || paracchaya paracchatra paracchidravinirgata
    | paradevagatih prema pancacudamaniprabha || 11 || pancami pashunatheshi tripanca pancasundari | parijatavanastha
    ca parijatasrajapriya || 12 || paraparavibheda ca paralokavimuktida | paratapanalakara parastri parajapini
    || 13 || parastradharini puravasini parameshvari | premollasakari premasantanabhaktidayini || 14 ||
    parashabdapriya paura paramarshanakarini | prasanna parayantrastha prasanna padmamalini || 15 || priyamvada
    paratrapta paradhanyarthavardhini | parabhumirata pita parakatarapujita || 16|| parasyavakyavinata
    purushastha puranjana | praudha meyahara pritivardhini priyavardhini || 17 || prapancaduhkhahantri
    ca prapancasaranirgata | purananirgata pina pinastanabhavojjvala || 18 || pattavastraparidhana pattasutrapracalini
    | paradravyaprada prita parashraddha parantara || 19 || pavaniya parakshubdha parasaravinashini |
    parameva nigudharthatattvacintaprakashini || 20 || pracurarthaprada prithvi padmapatradvayasthita
    | prasannahridayananda prasannasanasamsthita || 21 || prasannaratnamaladhya prasannavanamalini | prasannakarunananda
    prasannahridayasthita || 22 || parabhasarata purvapashcimottaradakshina | pavanastha panarata pavanadharavigraha
    || 23 || prabhupriya prabhurata prabhubhaktipradayini | paratrishnavardhini ca pracaya parajanmada
    || 24 || parajanmanirasta ca parasancarakarini | parajata parijata pavitra punyavardhini || 25 ||
    papahartri papakotinashini paramokshada | paramanurata sukshma paramanuvibhanjini || 26 || paramanusthulakari
    paratparatara patha | pushanah priyakartri ca pushana poshanatraya || 27 || bhupapala pashahasta pracanda
    pranarakshini | payahshila'pupabhaksha piyushapanatatpara || 28 || piyushatriptadeha ca piyushamathanakriya
    | piyushasagarodbhuta piyushasnigdhadohini || 29 || piyushanirmalakara piyushaghanavigraha | pranapanasamanadipavanastambhanapriya
    || 30 || pavanamshaprabhakara premodgatasvabhaktida | pashanatanusamstha ca pashanacittavigraha ||
    31 || pashcimanandanirata pashcima pashcimapriya | prabhakaratanugra ca prabhakaramukhi prabha ||
    32 || suprabha prantarastha ca preyatvasadhanapriya | asthita pamasi purvanathapujitapaduka || 33
    || padukamantrasiddha ca padukamantrajapini | padukamangalastha ca padukambhojarajini || 34 || prabhabharunakotistha
    pracandasuryakotiga | palayanti trilokanam parama parahakini || 35 || paravaranana prajna prantarantahprasiddhida
    | parijatavanonmada paramonmadaragini || 36 || paramahladamoda ca paramakashavahini | paramakashadevi
    ca prathatripurasundari || 37 || pratikulakari prananukulaparikarini | pranarudreshvaraprita pracandagananayika
    || 38 || poshtri pautradirakshatri pundraka pancacamara | parayosha parapraya parasantanarakshaka
    || 39 || parayogirata pashapashupashavimohini | pashupashaprada pujya prasadagunadayini || 40 || prahladastha
    praphullabjamukhi paramasundari | pararama pararama parvani parvanapriya || 41 || priyankari purvamata
    palanakhya parasara | parasharasubhagyastha parakantinitambini || 42 || parashmashanagamya ca priyacandramukhipala
    | palasanakari plaksha plavangaganapujita || 43 || plakshastha pallavastha ca pankeruhamukhi pata
    | patakarasthita pathya pavitralokadayini || 44 || pavitramantrajapyastha pavitrasthanavasini | pavitralankritangi
    ca pavitradehadharini || 45 || tripura paramaishvaryapujita sarvapujita | palalapriyahridya ca palalacarvanapriya
    || 46 || paragoganagopya ca prabhustriraudrataijasi | praphullambhojavadana praphullapadmamalini ||
    47 || pushpapriya pushpakula kulapushpapriyakula | pushpastha pushpasankasha pushpakomalavigraha ||
    48 || paushpi panarata pushpamadhupanarata praca | pratici pracayahlado pracanakhya ca prancika ||
    49 || parodare gunananda paraudaryagunapriya | para kotidhvanirata padmasutraprabodhini || 50 || priyaprabodhanirata
    pracandanadamohini | pivara pivaragranthiprabheda pralayapaha || 51 || pralaya pralayananda pralayastha
    prayogini | prayogakushala paksha pakshabhedaprakashini || 52 || ekapaksha dvipaksha ca pancapakshaprasiddhida
    | palashakusumananda palashapushpamalini || 53 || palashapushpahomastha palashacchadasamsthita | patrapaksha
    pitavastra pitavarnaprakashini || 54 || nipitakalakuti ca pitasamsarasagara | padmapatrajalastha ca
    padmapatranivasini || 55 || padmamala papahara pattambaradhara para | paranirvanadatri ca parasha
    parashasana || 56 || apriyavinihantri ca parasamskarapalini | pratishtha pujita siddha prasiddhaprabhuvadini
    || 57 || prayasasiddhida kshubdha prapancagunanashini | pranipatya pranishishya pratishthitatanupriya
    || 58 || apratishtha nihantri ca padapadmadvayanvita | padambujapremabhaktipujyapranapradayini ||
    59 || paishaci ca prakshapita pitrishraddha pitamahi | prapitamahapujya ca pitrilokasvadhapara ||
    60 || punarbhava punarjiva paunahpunyagatisthita | pradhanabalibhakshadisupriya priyasakshini || 61
    || patangakotijivakhya pavakastha ca pavani | parajnanarthadatri ca paratantrarthasadhini || 62 ||
    pratyagjyotih svarupa ca prathamaprathamaruna | pratahsandhya parthasandhya parasandhyasvarupini ||
    63 || pradhanavarada pranajnananirnayakarini | prabhanjana pranjaneshi prayogodrekakarini || 64 ||
    praphullapadadatri ca prasamaya purodaya | parvatapranarakshatri parvatadharasakshini || 65 || parvatapranashobha
    ca parvatacchatrakarini | parvata jnanahartri ca pralayodayasakshini || 66 || prarabdhajanani kali
    pradyumnajanani sura | praksureshvarapatni ca paravirakulapaha || 67 || paraviraniyantri ca parapranavamalini
    | pranaveshi pranavaga pranavadyaksharapriya || 68 || pranavarnajapaprita pranamrityunjayaprada |
    pranavalankrita vyudha pashubhakshanatarpana || 69 || pashudoshahara pashupatastrakotidharini | praveshini
    praveshakhya padmapatratrilocana || 70 || pashumamsasavananda pashukotibalipriya | pashudharmakshaya
    prarya pashutarpanakarini || 71 || pashushraddhakari pujya pashumundasumalini | paravirayogashiksha
    parasiddhantayogini || 72 || parashukrodhamukhyastra parashupralayaprada | padmaragamaladhara padmaragasanasthita
    || 73 || padmaragamanishreniharalankarashobhita | paramadhulisaundaryamanjirapadukambuja || 74 ||
    hartri samastaduhkhanam hiranyaharashobhita | harinakshi haristha ca hara haravati hira || 75 || harakundalashobhadhya
    harakeyuramandita | haranastha hakini ca homakarmaprakashini || 76 || haridra haripujya ca haramala
    hareshvari | haratita harasiddha hrimkari hamsamalini || 77 || hamsamantrasvarupa ca hamsamandalabhedini
    | hamsah so'ham manikara hamsarajoparisthita || 78 || hirakabha hirakasukadharini haramekhala | harakundamekhala
    ca homadandasumekhala || 79 || haradharapriyananda halishani harodaya | harapatni hararata samharavigrahojjvala
    || 80 || samharanilaya hala hlimbijapranavapriya | halaksha hakshavarnastha hakini haramohini || 81
    || hahahuhupriyanandagayanapremasupriya | harabhutiprada harapriya hirakamalini || 82 || hirakabha
    hirakastha haradhara harasthita | halanishevita hinta hintalavanasiddhida || 83 || mahamaya maharaudri
    mahadevanishevita | mahanaya mahadevi mahasiddha mahodaya || 84 || mahayoga mahabhadra mahayogendratarini
    | mahadipashikhakara mahadipaprakashini || 85 || mahadipaprakashakhya mahashraddha mahamatih | mahamahiyasi
    mohanashini mahati maha || 86 || mahakalapujita ca mahakalakuleshvari | mahayogindrajanani mohasiddhipradayini
    || 87 || ahutisthahutirata hotrivedamanupriya | haiyangabijabhoktri ca haiyangabijasupriya || 88 ||
    he sambodhanarupa ca he hetoh paramatmaja | halanathapriya devi hitahitavinashini || 89 || hantri
    samastapapanam halahetupradaprada | halahetucchalastha ca hilihiliprayagini || 90 || hutasanamukhi
    shunya harini haratantrada | hathatkaragatiprita suntakalankrita ila || 91 || halayudhadyajanani hillola
    hemabahini | haimi himasuta hemaparvatasha
  devanagari: देहान्तर्गत महाकायज्ञानसिद्ध्यर्थे जपे विनियोगः । ॐ हाकिनी वसुधा लक्ष्मी परमात्मकला परा
    । परप्रिया परातीता परमा परमप्रिया ॥ ३ ॥ परेश्वरी परप्रेमा परब्रह्मस्वरूपिणी । परन्तपा परानन्दा परनाथनिसेविनी
    ॥ ४ ॥ पराकाशस्थिता पारा पारापारनिरूपिणी । पराकाङ्क्ष्या पराशक्तिः पुरातनतनुः प्रभा ॥ ५ ॥ पञ्चाननप्रिया
    पूर्वा परदारा परादरा । परदेशगता नाथा परमाह्लादवर्धिनी ॥ ६ ॥ पार्वती परकुलाख्या पराञ्जनसुलोचना । परंब्रह्मप्रिया
    माया परंब्रह्मप्रकाशिनी ॥ ७ ॥ परंब्रह्मज्ञानगम्या परंब्रह्मेश्वरप्रिमया । पूर्वातीता परातीता अपारमहिमस्थिता
    ॥ ८ ॥ अपारसागरोद्धारा अपारदुस्तरोद्धरा । परानलशिखाकारा परभ्रूमध्यवासिनी ॥ ९ ॥ परश्रेष्ठा परक्षेत्रवासिनी
    परमालिनी । पर्वतेश्वरकन्या च पराग्निकोटिसम्भवा ॥ १० ॥ परच्छाया परच्छत्रा परच्छिद्रविनिर्गता । परदेवगतिः
    प्रेमा पञ्चचूडामणिप्रभा ॥ ११ ॥ पञ्चमी पशुनाथेशी त्रिपञ्चा पञ्चसुन्दरी । पारिजातवनस्था च पारिजातस्रजप्रिया
    ॥ १२ ॥ परापरविभेदा च परलोकविमुक्तिदा । परतापानलाकारा परस्त्री परजापिनी ॥ १३ ॥ परास्त्रधारिणी पूरवासिनी
    परमेश्वरी । प्रेमोल्लासकरी प्रेमसन्तानभक्तिदायिनी ॥ १४ ॥ परशब्दप्रिया पौरा परामर्षणकारिणी । प्रसन्ना
    परयन्त्रस्था प्रसन्ना पद्ममालिनी ॥ १५ ॥ प्रियंवदा परत्राप्ता परधान्यार्थवर्धिनी । परभूमिरता पीता परकातरपूजिता
    ॥ १६॥ परास्यवाक्यविनता पुरुषस्था पुरञ्जना । प्रौढा मेयहरा प्रीतिवर्धिनी प्रियवर्धिनी ॥ १७ ॥ प्रपञ्चदुःखहन्त्री
    च प्रपञ्चसारनिर्गता । पुराणनिर्गता पीना पीनस्तनभवोज्ज्वला ॥ १८ ॥ पट्टवस्त्रपरीधाना पट्टसूत्रप्रचालिनी
    । परद्रव्यप्रदा प्रीता परश्रद्धा परान्तरा ॥ १९ ॥ पावनीया परक्षुब्धा परसारविनाशिनी । परमेव निगूढार्थतत्त्वचिन्ताप्रकाशिनी
    ॥ २० ॥ प्रचुरार्थप्रदा पृथ्वी पद्मपत्रद्वयस्थिता । प्रसन्नहृदयानन्दा प्रसन्नासनसंस्थिता ॥ २१ ॥ प्रसन्नरत्नमालाढ्या
    प्रसन्नवनमालिनी । प्रसन्नकरुणानन्दा प्रसन्नहृदयस्थिता ॥ २२ ॥ पराभासरता पूर्वपश्चिमोत्तरदक्षिणा । पवनस्था
    पानरता पवनाधारविग्रहा ॥ २३ ॥ प्रभुप्रिया प्रभुरता प्रभुभक्तिप्रदायिनी । परतृष्णावर्धिनी च प्रचया परजन्मदा
    ॥ २४ ॥ परजन्मनिरस्ता च परसञ्चारकारिणी । परजाता पारिजाता पवित्रा पुण्यवर्धिनी ॥ २५ ॥ पापहर्त्री पापकोटिनाशिनी
    परमोक्षदा । परमाणुरता सूक्ष्मा परमाणुविभञ्जिनी ॥ २६ ॥ परमाणुस्थूलकरी परात्परतरा पथा । पूषणः प्रियकर्त्री
    च पूषणा पोषणत्रया ॥ २७ ॥ भूपपाला पाशहस्ता प्रचण्डा प्राणरक्षिणी । पयःशिलाऽपूपभक्षा पीयूषपानतत्परा
    ॥ २८ ॥ पीयूषतृप्तदेहा च पीयूषमथनक्रिया । पीयूषसागरोद्भूता पीयूषस्निग्धदोहिनी ॥ २९ ॥ पीयूषनिर्मलाकारा
    पीयूषघनविग्रहा । प्राणापानसमानादिपवनस्तम्भनप्रिया ॥ ३० ॥ पवनांशप्रभाकारा प्रेमोद्गतस्वभक्तिदा । पाषाणतनुसंस्था
    च पाषाणचित्तविग्रहा ॥ ३१ ॥ पश्चिमानन्दनिरता पश्चिमा पश्चिमप्रिया । प्रभाकारतनूग्रा च प्रभाकरमुखी प्रभा
    ॥ ३२ ॥ सुप्रभा प्रान्तरस्था च प्रेयत्वसाधनप्रिया । अस्थिता पामसी पूर्वनाथपूजितपादुका ॥ ३३ ॥ पादुकामन्त्रसिद्धा
    च पादुकामन्त्रजापिनी । पादुकामङ्गलस्था च पादुकाम्भोजराजिनी ॥ ३४ ॥ प्रभाभारुणकोटिस्था प्रचण्डसूर्यकोटिगा
    । पालयन्ती त्रिलोकानां परमा परहाकिनी ॥ ३५ ॥ परावरानना प्रज्ञा प्रान्तरान्तःप्रसिद्धिदा । पारिजातवनोन्मादा
    परमोन्मादरागिणी ॥ ३६ ॥ परमाह्लादमोदा च परमाकाशवाहिनी । परमाकाशदेवी च प्रथात्रिपुरसुन्दरी ॥ ३७ ॥ प्रतिकूलकरी
    प्राणानुकूलपरिकारिणी । प्राणरुद्रेश्वरप्रीता प्रचण्डगणनायिका ॥ ३८ ॥ पोष्ट्री पौत्रादिरक्षत्री पुण्ड्रका
    पञ्चचामरा । परयोषा परप्राया परसन्तानरक्षका ॥ ३९ ॥ परयोगिरता पाशपशुपाशविमोहिनी । पशुपाशप्रदा पूज्या
    प्रसादगुणदायिनी ॥ ४० ॥ प्रह्लादस्था प्रफुल्लाब्जमुखी परमसुन्दरी । पररामा परारामा पार्वणी पार्वणप्रिया
    ॥ ४१ ॥ प्रियङ्करी पूर्वमाता पालनाख्या परासरा । पराशरसुभाग्यस्था परकान्तिनितम्बिनी ॥ ४२ ॥ परश्मशानगम्या
    च प्रियचन्द्रमुखीपला । पलसानकरी प्लक्षा प्लवङ्गगणपूजिता ॥ ४३ ॥ प्लक्षस्था पल्लवस्था च पङ्केरुहमुखी
    पटा । पटाकारस्थिता पाठ्या पवित्रलोकदायिनी ॥ ४४ ॥ पवित्रमन्त्रजाप्यस्था पवित्रस्थानवासिनी । पवित्रालङ्कृताङ्गी
    च पवित्रदेहधारिणी ॥ ४५ ॥ त्रिपुरा परमैश्वर्यपूजिता सर्वपूजिता । पलालप्रियहृद्या च पलालचर्वणप्रिया
    ॥ ४६ ॥ परगोगणगोप्या च प्रभुस्त्रीरौद्रतैजसी । प्रफुल्लाम्भोजवदना प्रफुल्लपद्ममालिनी ॥ ४७ ॥ पुष्पप्रिया
    पुष्पकुला कुलपुष्पप्रियाकुला । पुष्पस्था पुष्पसङ्काशा पुष्पकोमलविग्रहा ॥ ४८ ॥ पौष्पी पानरता पुष्पमधुपानरता
    प्रचा । प्रतीची प्रचयाह्लादो प्राचनाख्या च प्राञ्चिका ॥ ४९ ॥ परोदरे गुणानन्दा परौदार्यगुणप्रिया ।
    पारा कोटिध्वनिरता पद्मसूत्रप्रबोधिनी ॥ ५० ॥ प्रियप्रबोधनिरता प्रचण्डनादमोहिनी । पीवरा पीवरग्रन्थिप्रभेदा
    प्रलयापहा ॥ ५१ ॥ प्रलया प्रलयानन्दा प्रलयस्था प्रयोगिनी । प्रयोगकुशला पक्षा पक्षभेदप्रकाशिनी ॥ ५२
    ॥ एकपक्षा द्विपक्षा च पञ्चपक्षप्रसिद्धिदा । पलाशकुसुमानन्दा पलाशपुष्पमालिनी ॥ ५३ ॥ पलाशपुष्पहोमस्था
    पलाशच्छदसंस्थिता । पात्रपक्षा पीतवस्त्रा पीतवर्णप्रकाशिनी ॥ ५४ ॥ निपीतकालकूटी च पीतसंसारसागरा । पद्मपत्रजलस्था
    च पद्मपत्रनिवासिनी ॥ ५५ ॥ पद्ममाला पापहरा पट्टाम्बरधरा परा । परनिर्वाणदात्री च पराशा परशासना ॥ ५६
    ॥ अप्रियविनिहन्त्री च परसंस्कारपालिनी । प्रतिष्ठा पूजिता सिद्धा प्रसिद्धप्रभुवादिनी ॥ ५७ ॥ प्रयाससिद्धिदा
    क्षुब्धा प्रपञ्चगुणनाशिनी । प्रणिपत्या प्राणिशिष्या प्रतिष्ठिततनूप्रिया ॥ ५८ ॥ अप्रतिष्ठा निहन्त्री
    च पादपद्मद्वयान्विता । पादाम्बुजप्रेमभक्तिपूज्यप्राणप्रदायिनी ॥ ५९ ॥ पैशाची च प्रक्षपिता पितृश्रद्धा
    पितामही । प्रपितामहपूज्या च पितृलोकस्वधापरा ॥ ६० ॥ पुनर्भवा पुनर्जीवा पौनःपुन्यगतिस्थिता । प्रधानबलिभक्षादिसुप्रिया
    प्रियसाक्षिणी ॥ ६१ ॥ पतङ्गकोटिजीवाख्या पावकस्था च पावनी । परज्ञानार्थदात्री च परतन्त्रार्थसाधिनी ॥
    ६२ ॥ प्रत्यग्ज्योतिः स्वरूपा च प्रथमाप्रथमारुणा । प्रातःसन्ध्या पार्थसन्ध्या परसन्ध्यास्वरूपिणी ॥
    ६३ ॥ प्रधानवरदा प्राणज्ञाननिर्णयकारिणी । प्रभञ्जना प्राञ्जनेशी प्रयोगोद्रेककारिणी ॥ ६४ ॥ प्रफुल्लपददात्री
    च प्रसमाया पुरोदया । पर्वतप्राणरक्षत्री पर्वताधारसाक्षिणी ॥ ६५ ॥ पर्वतप्राणशोभा च पर्वतच्छत्रकारिणी
    । पर्वता ज्ञानहर्त्री च प्रलयोदयसाक्षिणी ॥ ६६ ॥ प्रारब्धजननी काली प्रद्युम्नजननी सुरा । प्राक्सुरेश्वरपत्नी
    च परवीरकुलापहा ॥ ६७ ॥ परवीरनियन्त्री च परप्रणवमालिनी । प्रणवेशी प्रणवगा प्रणवाद्याक्षरप्रिया ॥ ६८
    ॥ प्रणवार्णजपप्रीता प्राणमृत्युञ्जयप्रदा । प्रणवालङ्कृता व्यूढा पशुभक्षणतर्पणा ॥ ६९ ॥ पशुदोषहरा पाशुपतास्त्रकोटिधारिणी
    । प्रवेशिनी प्रवेशाख्या पद्मपत्रत्रिलोचना ॥ ७० ॥ पशुमांसासवानन्दा पशुकोटिबलिप्रिया । पशुधर्मक्षया
    प्रार्या पशुतर्पणकारिणी ॥ ७१ ॥ पशुश्रद्धाकरी पूज्या पशुमुण्डसुमालिनी । परवीरयोगशिक्षा परसिद्धान्तयोगिनी
    ॥ ७२ ॥ परशुक्रोधमुख्यास्त्रा परशुप्रलयप्रदा । पद्मरागमालधरा पद्मरागासनस्थिता ॥ ७३ ॥ पद्मरागमणिश्रेणीहारालङ्कारशोभिता
    । परमधूलिसौन्दर्यमञ्जीरपादुकाम्बुजा ॥ ७४ ॥ हर्त्री समस्तदुःखानां हिरण्यहारशोभिता । हरिणाक्षी हरिस्था
    च हरा हारावती हिरा ॥ ७५ ॥ हारकुण्डलशोभाढ्या हारकेयूरमण्डिता । हरणस्था हाकिनी च होमकर्मप्रकाशिनी ॥
    ७६ ॥ हरिद्रा हरिपूज्या च हरमाला हरेश्वरी । हरातीता हरसिद्धा ह्रींकारी हंसमालिनी ॥ ७७ ॥ हंसमन्त्रस्वरूपा
    च हंसमण्डलभेदिनी । हंसः सोऽहं मणिकरा हंसराजोपरिस्थिता ॥ ७८ ॥ हीरकाभा हीरकसूकधारिणी हरमेखला । हरकुण्डमेखला
    च होमदण्डसुमेखला ॥ ७९ ॥ हरधरप्रियानन्दा हलीशानी हरोदया । हरपत्नी हररता संहारविग्रहोज्ज्वला ॥ ८० ॥
    संहारनिलया हाला ह्लींबीजप्रणवप्रिया । हलक्षा हक्षवर्णस्था हाकिनी हरमोहिनी ॥ ८१ ॥ हाहाहूहूप्रियानन्दगायनप्रेमसुप्रिया
    । हरभूतिप्रदा हारप्रिया हीरकमालिनी ॥ ८२ ॥ हीरकाभा हीरकस्था हराधारा हरस्थिता । हालानिषेविता हिन्ता
    हिन्तालवनसिद्धिदा ॥ ८३ ॥ महामाया महारौद्री महादेवनिषेविता । महानया महादेवी महासिद्धा महोदया ॥ ८४ ॥
    महायोगा महाभद्रा महायोगेन्द्रतारिणी । महादीपशिखाकारा महादीपप्रकाशिनी ॥ ८५ ॥ महादीपप्रकाशाख्या महाश्रद्धा
    महामतिः । महामहीयसी मोहनाशिनी महती महा ॥ ८६ ॥ महाकालपूजिता च महाकालकुलेश्वरी । महायोगीन्द्रजननी मोहसिद्धिप्रदायिनी
    ॥ ८७ ॥ आहुतिस्थाहुतिरता होतृवेदमनुप्रिया । हैयङ्गबीजभोक्त्री च हैयङ्गबीजसुप्रिया ॥ ८८ ॥ हे सम्बोधनरूपा
    च हे हेतोः परमात्मजा । हलनाथप्रिया देवी हिताहितविनाशिनी ॥ ८९ ॥ हन्त्री समस्तपापानां हलहेतुप्रदाप्रदा
    । हलहेतुच्छलस्था च हिलिहिलिप्रयागिनी ॥ ९० ॥ हुतासनमुखी शून्या हरिणी हरतन्त्रदा । हठात्कारगतिप्रीता
    सुण्टकालङ्कृता इला ॥ ९१ ॥ हलायुधाद्यजननी हिल्लोला हेमबहीणी । हैमी हिमसुता हेमपर्वतश
