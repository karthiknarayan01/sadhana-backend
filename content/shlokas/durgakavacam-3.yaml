id: durgakavacam-3
category: kavacha
name:
  english: durgakavacam 3
  devanagari: दुर्गाकवचम् ३
content:
  english: sarasvati | patu jihvam mahamaya prishtham mem jagadambika || 9|| harapriya patu nityam shmashane
    jagadishvari | sarvan patu ca sarvani sada rakshatu candika || 10|| katyayani kulam patu sada ca shavavahini
    | ghoradamshtra karalasya parvati patu sarvada || 11|| kamala patu bahyam me mantram mantreshvari
    tatha | ityevam kavacam devi devanamapi durlabham || 12|| yah pathet satatam bhaktya siddhimapnoti
    nishcitam | siddhikale samutpanne kavacam prapathet sudhih || 13|| ajnatva kavacam devi
  devanagari: सरस्वती । पातु जिह्वां महामाया पृष्ठं में जगदम्बिका ॥ ९॥ हरप्रिया पातु नित्यं श्मशाने जगदीश्वरी
    । सर्वान् पातु च सर्वाणी सदा रक्षतु चण्डिका ॥ १०॥ कात्यायनी कुलं पातु सदा च शववाहिनी । घोरदंष्ट्रा
    करालास्या पार्वती पातु सर्वदा ॥ ११॥ कमला पातु बाह्यं मे मन्त्रं मन्त्रेश्वरी तथा । इत्येवं कवचं देवि
    देवानामपि दुर्लभम् ॥ १२॥ यः पठेत् सततं भक्त्या सिद्धिमाप्नोति निश्चितम् । सिद्धिकाले समुत्पन्ने कवचं
    प्रपठेत् सुधीः ॥ १३॥ अज्ञात्वा कवचं देवि
meaning: {}
