    mahavedine namah | om marutaya namah | om jagadishvaraya namah | om lokadhyakshaya namah | om agraganyaya
    namah | om shrimate namah | om aprameyaparakramaya namah om simharudhaya namah | om gajarudhaya namah
    | om hayarudhaya namah | om maheshvaraya namah | om nanashastradharaya namah | om anaghaya namah |
    om nanavidya visharadaya namah | om nanarupadharaya namah | om viraya namah | om nanapraninishevitaya
    namah om bhuteshaya namah | om bhutidaya namah | om bhrityaya namah | om bhujangabharanojvalaya namah
