id: atharvashiraupanishad
category: upanishad
name:
  english: atharvashiraupanishad
  devanagari: अथर्वशिरउपनिषद्
content:
  english: upanishad atharvavediya shaiva upanishat || atharvashirasamarthamanarthaprocavacakam | sarvadharamanadharam
    svamatratraipadaksharam || om bhadram karnebhih shrinuyama deva bhadram pashyemakshabhiryajatrah |
    sthirairangaistushtuvamsastanubhirvyashema devahitam yadayuh || svasti na indro vriddhashravah svasti
    nah pusha vishvavedah | svasti nastarkshyo arishtanemih svasti no brihaspatirdadhatu || om shantih
    shantih shantih || om deva ha vai svargam lokamayamste rudramapricchanko bhavaniti | so'bravidahamekah
    prathamamasam vartami ca bhavishyami ca nanyah kashcinmatto vyatirikta iti | so'ntaradantaram pravishat
    dishashcantaram pravishat so'ham nityanityo'ham vyaktavyakto brahmahamabrahmaham prancah pratyanco'ham
    dakshinanca udancoham adhashcordhvam caham dishashca pratidishashcaham pumanapuman striyashcaham gayatryaham
    savitryaham sarasvatyaham trishtubjagatyanushtup caham chando'ham garhapatyo dakshinagnirahavaniyo'ham
    satyo'ham gauraham gauryahamrigaham yajuraham samahamatharvangiraso'ham jyeshtho'ham shreshtho'ham
    varishtho'hamapo'ham tejo'ham guhyohamaranyo'hamaksharamaham ksharamaham pushkaramaham pavitramahamugram
    ca madhyam ca bahishca purastajjyotirityahameva sarve mameva sa sarve sa mam yo mam veda sa vedanveda
    sa sarvamshca vedansanganapi brahma brahmanaishca gam gobhirbrahmananbrahmanyena havirhavisha ayurayusha
    satyena satyam dharmena dharmam tarpayami svena tejasa | tato ha vai te deva rudramapricchante deva
    rudramapashyan | te deva rudramadhyayamstato deva urdhvabahavo rudram stuvanti || 1|| om yo vai rudrah
    sa bhagavanyashca brahma tasmai vai namonamah || 1 || yo vai rudrah sa bhagavan yashca vishnustasmai
    vai namonamah || 2 || yo vai rudrah sa bhagavanyashca skandastasmai vai namonamah || 3 || yo vai rudrah
    sa bhagavanyashcendrastasmai vai namonamah || 4 || yo vai rudrah sa bhagavanyashcagnistasmai vai namonamah
    || 5 || yo vai rudrah sa bhagavanyashca vayustasmai vai namonamah || 6 || yo vai rudrah sa bhagavanyashca
    suryastasmai vai namonamah || 7 || yo vai rudrah sa bhagavanyashca somastasmai vai namonamah || 8
    || yo vai rudrah sa bhagavanye cashtau grahastasmai vai namonamah || 9 || yo vai rudrah sa bhagavanye
    cashtau pratigrahastasmai vai namonamah || 10 || yo vai rudrah sa bhagavanyacca bhustasmai vai namonamah
    || 11 || yo vai rudrah sa bhagavanyacca bhuvastasmai vai namonamah || 12 || yo vai rudrah sa bhagavanyacca
    svastasmai vai namonamah || 13 || yo vai rudrah sa bhagavanyacca mahastasmai vai namonamah || 14 ||
    yo vai rudrah sa bhagavanya ca prithivi tasmai vai namonamah || 15 || yo vai rudrah sa bhagavanyaccantariksham
    tasmai vai namonamah || 16 || yo vai rudrah sa bhagavanya ca dyaustasmai vai namonamah || 17 || yo
    vai rudrah sa bhagavanyashcapastasmai vai namonamah || 18 || yo vai rudrah sa bhagavanyacca tejastasmai
    vai namonamah || 19 || yo vai rudrah sa bhagavanyaccakasham tasmai vai namonamah || 20 || yo vai rudrah
    sa bhagavanyashca kalastasmai vai namonamah || 21 || yo vai rudrah sa bhagavanyashca yamastasmai vai
    namonamah || 22 || yo vai rudrah sa bhagavanyashca mrityustasmai vai namonamah || 23|| yo vai rudrah
    sa bhagavanyaccamritam tasmai vai namonamah || 24 || yo vai rudrah sa bhagavanyacca vishvam tasmai
    vai namonamah || 25 || yo vai rudrah sa bhagavanyacca sthulam tasmai vai namonamah || 26 || yo vai
    rudrah sa bhagavanyacca sukshmam tasmai vai namonamah || 27 || yo vai rudrah sa bhagavanyacca shuklam
    tasmai namonamah || 28 || yo vai rudrah sa bhagavanyacca krishnam tasmai vai namonamah || 29 || yo
    vai rudrah sa bhagavanyacca kritsnam tasmai vai namonamah || 30 || yo vai rudrah sa bhagavanyacca
    satyam tasmai vai namonamah || 31 || yo vai rudrah sa bhagavanyacca sarvam tasmai vai namonamah ||
    32 || || 2 || bhuste adirmadhyam bhuvah svaste shirsham vishvarupo'si brahmaikastvam dvidha tridha
    baddhastvam shantistvam pushtistvam hutamahutam dattamadattam sarvamasarvam vishvamavishvam kritamakritam
    paramaparam parayanam ca tvam | apama somamamrita abhumaganma jyotiravidama devan | kim nunamasmankrinavadaratih
    kimu dhurtiramritam martyasya ca | somasuryapurastat sukshmah purushah | sarvam jagaddhitam va etadaksharam
    prajapatyam sukshmam saumyam purushamagrahyamagrahyena bhavam bhavena saumyam saumyena sukshmam sukshmena
    vayavyam vayavyena grasati svena tejasa tasmadupasamhartre mahagrasaya vai namo namah | hridistha
    devatah sarva hridi pranah pratishthitah | hridi tvamasi yo nityam tisro matrah parastu sah | tasyottaratah
    shiro dakshinatah padau ya uttaratah sa onkarah ya onkarah sa pranavah yah pranavah sa sarvavyapi
    yah sarvavyapi so'nantah yo'nantastattaram yattaram tatsukshmam yatsukshmam tacchuklam yacchuklam
    tadvaidyutam yadvaidyutam tatparam brahma yatparam brahma sa ekah ya ekah sa rudrah ya rudrah yo rudrah
    sa ishanah ya ishanah sa bhagavan maheshvarah || 3 || atha kasmaducyata onkaro yasmaduccaryamana eva
    prananurdhvamutkramayati tasmaducyate onkarah | atha kasmaducyate pranavah yasmaduccaryamana eva rigyajuhsamatharvangiraso
    brahma brahmanebhyah pranamayati namayati ca tasmaducyate pranavah | atha kasmaducyate sarvavyapi
    yasmaduccaryamana eva sarvan lokanvyapnoti sneho yatha palalapindamiva shantarupamotaprotamanuprapto
    vyatishiktashca tasmaducyate sarvavyapi | atha kasmaducyate'nanto yasmaduccaryamana eva tiryagurdhvamadhastaccasyanto
    nopalabhyate tasmaducyate'nantah | atha kasmaducyate taram yasmaduccaryamana eva garbhajanmavyadhi
  devanagari: उपनिषद् अथर्ववेदीय शैव उपनिषत् ॥ अथर्वशिरसामर्थमनर्थप्रोचवाचकम् । सर्वाधारमनाधारं स्वमात्रत्रैपदाक्षरम्
    ॥ ॐ भद्रं कर्णेभिः शृणुयाम देवा भद्रं पश्येमाक्षभिर्यजत्राः । स्थिरैरङ्गैस्तुष्टुवांसस्तनूभिर्व्यशेम
    देवहितं यदायुः ॥ स्वस्ति न इन्द्रो वॄद्धश्रवाः स्वस्ति नः पूषा विश्ववेदाः । स्वस्ति नस्तार्क्ष्यो
    अरिष्टनेमिः स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ देवा ह वै स्वर्गं लोकमायंस्ते
    रुद्रमपृच्छन्को भवानिति । सोऽब्रवीदहमेकः प्रथममासं वर्तामि च भविश्यामि च नान्यः कश्चिन्मत्तो व्यतिरिक्त
    इति । सोऽन्तरादन्तरं प्राविशत् दिशश्चान्तरं प्राविशत् सोऽहं नित्यानित्योऽहं व्यक्ताव्यक्तो ब्रह्माहमब्रह्माहं
    प्राञ्चः प्रत्यञ्चोऽहं दक्षिणाञ्च उदञ्चोहम् अधश्चोर्ध्वं चाहं दिशश्च प्रतिदिशश्चाहं पुमानपुमान् स्त्रियश्चाहं
    गायत्र्यहं सावित्र्यहं सरस्वत्यहं त्रिष्टुब्जगत्यनुष्टुप् चाहं छन्दोऽहं गार्हपत्यो दक्षिणाग्निराहवनीयोऽहं
    सत्योऽहं गौरहं गौर्यहमृगहं यजुरहं सामाहमथर्वाङ्गिरसोऽहं ज्येष्ठोऽहं श्रेष्ठोऽहं वरिष्ठोऽहमापोऽहं तेजोऽहं
    गुह्योहमरण्योऽहमक्षरमहं क्षरमहं पुष्करमहं पवित्रमहमुग्रं च मध्यं च बहिश्च पुरस्ताज्ज्योतिरित्यहमेव
    सर्वे मामेव स सर्वे स मां यो मां वेद स वेदान्वेद स सर्वांश्च वेदान्साङ्गानपि ब्रह्म ब्राह्मणैश्च गां
    गोभिर्ब्राह्माणान्ब्राह्मण्येन हविर्हविषा आयुरायुषा सत्येन सत्यं धर्मेण धर्मं तर्पयामि स्वेन तेजसा
    । ततो ह वै ते देवा रुद्रमपृच्छन्ते देवा रुद्रमपश्यन् । ते देवा रुद्रमध्यायंस्ततो देवा ऊर्ध्वबाहवो
    रुद्रं स्तुवन्ति ॥ १॥ ॐ यो वै रुद्रः स भगवान्यश्च ब्रह्मा तस्मै वै नमोनमः ॥ १ ॥ यो वै रुद्रः स भगवान्
    यश्च विष्णुस्तस्मै वै नमोनमः ॥ २ ॥ यो वै रुद्रः स भगवान्यश्च स्कन्दस्तस्मै वै नमोनमः ॥ ३ ॥ यो वै रुद्रः
    स भगवान्यश्चेन्द्रस्तस्मै वै नमोनमः ॥ ४ ॥ यो वै रुद्रः स भगवान्यश्चाग्निस्तस्मै वै नमोनमः ॥ ५ ॥ यो
    वै रुद्रः स भगवान्यश्च वायुस्तस्मै वै नमोनमः ॥ ६ ॥ यो वै रुद्रः स भगवान्यश्च सूर्यस्तस्मै वै नमोनमः
    ॥ ७ ॥ यो वै रुद्रः स भगवान्यश्च सोमस्तस्मै वै नमोनमः ॥ ८ ॥ यो वै रुद्रः स भगवान्ये चाष्टौ ग्रहास्तस्मै
    वै नमोनमः ॥ ९ ॥ यो वै रुद्रः स भगवान्ये चाष्टौ प्रतिग्रहास्तस्मै वै नमोनमः ॥ १० ॥ यो वै रुद्रः स भगवान्यच्च
    भूस्तस्मै वै नमोनमः ॥ ११ ॥ यो वै रुद्रः स भगवान्यच्च भुवस्तस्मै वै नमोनमः ॥ १२ ॥ यो वै रुद्रः स भगवान्यच्च
    स्वस्तस्मै वै नमोनमः ॥ १३ ॥ यो वै रुद्रः स भगवान्यच्च महस्तस्मै वै नमोनमः ॥ १४ ॥ यो वै रुद्रः स भगवान्या
    च पृथिवी तस्मै वै नमोनमः ॥ १५ ॥ यो वै रुद्रः स भगवान्यच्चान्तरिक्षं तस्मै वै नमोनमः ॥ १६ ॥ यो वै रुद्रः
    स भगवान्या च द्यौस्तस्मै वै नमोनमः ॥ १७ ॥ यो वै रुद्रः स भगवान्याश्चापस्तस्मै वै नमोनमः ॥ १८ ॥ यो
    वै रुद्रः स भगवान्यच्च तेजस्तस्मै वै नमोनमः ॥ १९ ॥ यो वै रुद्रः स भगवान्यच्चाकाशं तस्मै वै नमोनमः
    ॥ २० ॥ यो वै रुद्रः स भगवान्यश्च कालस्तस्मै वै नमोनमः ॥ २१ ॥ यो वै रुद्रः स भगवान्यश्च यमस्तस्मै वै
    नमोनमः ॥ २२ ॥ यो वै रुद्रः स भगवान्यश्च मृत्युस्तस्मै वै नमोनमः ॥ २३॥ यो वै रुद्रः स भगवान्यच्चामृतं
    तस्मै वै नमोनमः ॥ २४ ॥ यो वै रुद्रः स भगवान्यच्च विश्वं तस्मै वै नमोनमः ॥ २५ ॥ यो वै रुद्रः स भगवान्याच्च
    स्थूलं तस्मै वै नमोनमः ॥ २६ ॥ यो वै रुद्रः स भगवान्यच्च सूक्ष्मं तस्मै वै नमोनमः ॥ २७ ॥ यो वै रुद्रः
    स भगवान्यच्च शुक्लं तस्मै नमोनमः ॥ २८ ॥ यो वै रुद्रः स भगवान्यच्च कृष्णं तस्मै वै नमोनमः ॥ २९ ॥ यो
    वै रुद्रः स भगवान्यच्च कृत्स्नं तस्मै वै नमोनमः ॥ ३० ॥ यो वै रुद्रः स भगवान्यच्च सत्यं तस्मै वै नमोनमः
    ॥ ३१ ॥ यो वै रुद्रः स भगवान्यच्च सर्वं तस्मै वै नमोनमः ॥ ३२ ॥ ॥ २ ॥ भूस्ते आदिर्मध्यं भुवः स्वस्ते
    शीर्षं विश्वरूपोऽसि ब्रह्मैकस्त्वं द्विधा त्रिधा बद्धस्त्वं शान्तिस्त्वं पुष्टिस्त्वं हुतमहुतं दत्तमदत्तं
    सर्वमसर्वं विश्वमविश्वं कृतमकृतं परमपरं परायणं च त्वम् । अपाम सोमममृता अभूमागन्म ज्योतिरविदाम देवान्
    । किं नूनमस्मान्कृणवदरातिः किमु धूर्तिरमृतं मर्त्यस्य च । सोमसूर्यपुरस्तात् सूक्ष्मः पुरुषः । सर्वं
    जगद्धितं वा एतदक्षरं प्राजापत्यं सूक्ष्मं सौम्यं पुरुषमग्राह्यमग्राह्येण भावं भावेन सौम्यं सौम्येन
    सूक्ष्मं सूक्ष्मेण वायव्यं वायव्येन ग्रसति स्वेन तेजसा तस्मादुपसंहर्त्रे महाग्रासाय वै नमो नमः । हृदिस्था
    देवताः सर्वा हृदि प्राणाः प्रतिष्ठिताः । हृदि त्वमसि यो नित्यं तिस्रो मात्राः परस्तु सः । तस्योत्तरतः
    शिरो दक्षिणतः पादौ य उत्तरतः स ओङ्कारः य ओङ्कारः स प्रणवः यः प्रणवः स सर्वव्यापी यः सर्वव्यापी सोऽनन्तः
    योऽनन्तस्तत्तारं यत्तारं तत्सूक्ष्मं यत्सूक्ष्मं तच्छुक्लं यच्छुक्लं तद्वैद्युतं यद्वैद्युतं तत्परं
    ब्रह्म यत्परं ब्रह्म स एकः य एकः स रुद्रः य रुद्रः यो रुद्रः स ईशानः य ईशानः स भगवान् महेश्वरः ॥ ३
    ॥ अथ कस्मादुच्यत ओङ्कारो यस्मादुच्चार्यमाण एव प्राणानूर्ध्वमुत्क्रामयति तस्मादुच्यते ओङ्कारः । अथ
    कस्मादुच्यते प्रणवः यस्मादुच्चार्यमाण एव ऋग्यजुःसामाथर्वाङ्गिरसो ब्रह्म ब्राह्मणेभ्यः प्रणामयति नामयति
    च तस्मादुच्यते प्रणवः । अथ कस्मादुच्यते सर्वव्यापी यस्मादुच्चार्यमाण एव सर्वान् लोकान्व्याप्नोति स्नेहो
    यथा पललपिण्डमिव शान्तरूपमोतप्रोतमनुप्राप्तो व्यतिषिक्तश्च तस्मादुच्यते सर्वव्यापी । अथ कस्मादुच्यतेऽनन्तो
    यस्मादुच्चार्यमाण एव तिर्यगूर्ध्वमधस्ताच्चास्यान्तो नोपलभ्यते तस्मादुच्यतेऽनन्तः । अथ कस्मादुच्यते
    तारं यस्मादुच्चार्यमाण एव गर्भजन्मव्याधि
