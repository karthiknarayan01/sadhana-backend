id: krishnacaitanyacandrasahasranamastotram-2-naraharisarakarathakkuraviracitam
category: sahasranama
name:
  english: krishnacaitanyacandrasahasranamastotram 2 (naraharisarakarathakkuraviracitam)
  devanagari: कृष्णचैतन्यचन्द्रसहस्रनामस्तोत्रम् २ (नरहरिसरकारठक्कुरविरचितम्)
content:
  english: pradurbhutalasadvapuh brahmandakotilavanyasarasancayalanchitah || 64|| alekhyasvargapiyushasarashitalabhashanah
    | simhacarulasadgrivah kambucarusukanthavan || 65|| vishala bhalavibhrajaccandanalepamohanah | kapolamandaladvandvavibhrajanmanikundalah
    || 66|| arunadharavibhrajanmandahasasudhashrayah | mriduhasadaravyaktadantadyotitadinmukhah || 67||
    arunoshthacarusaushthavaninditamukhajatapakvabimbashrih | vibhushanamanimayakundalayugalacchataghatakamabhrit
    || 68|| kotisudhanidhighatitavartulasahladasidhumadvadanah | kutilakatakshodayavanaddhanavadvipanagarinikarah
    || 69|| madamattavaranendrapratimagatih simhashavakojasvi | kancananirmitamanimayanupuranadahritangananivahah
    || 70|| arunaghatikatibhushanastandavapandityashikshitasheshah | vistritalalitasukomalapadambujamadhurisindhuh
    || 71|| svarnapravalagumphitamadhyamanisphitahara lasadvakshah | pallavamridutarakaratalakalitalakshyanamajapalilah
    || 72|| dayapremardrahasitavitirnapremasagarah | kripamadhuradrikpatavashikritajagajjanah || 73||
    angalepamriganabhilalito bhavasucakaddagancalapatah | sarvalokanayanotsavakari hasabhasvaramukhambujadyutih
    || 74|| pugapunjaparipurnamukhashrih svedakarimahitorunasikah | tattadadbhutarahasyashilanah prantaraktapariveshtitambarah
    || 75|| karpuragurukasturigandhapuritadinmukhah | suvrittadirghadordandalasatkanakakankanah || 76||
    suvarna
  devanagari: प्रादुर्भूतलसद्वपुः ब्रह्माण्डकोटिलावण्यसारसञ्चयलाञ्छितः ॥ ६४॥ अलेख्यस्वर्गपीयूषसारशीतलभाषणः
    । सिंहचारुलसद्ग्रीवः कम्बुचारुसुकण्ठवान् ॥ ६५॥ विशाल भालविभ्राजच्चन्दनालेपमोहनः । कपोलमण्डलद्वन्द्वविभ्राजन्मणिकुण्डलः
    ॥ ६६॥ अरुणाधरविभ्राजन्मन्दहाससुधाश्रयः । मृदुहासदरव्यक्तदन्तद्योतितदिङ्मुखः ॥ ६७॥ अरुणोष्ठचारुसौष्ठवनिन्दितमुखजातपक्वबिम्बश्रीः
    । विभूषणमणिमयकुण्डलयुगलच्छटाघटाकामभृत् ॥ ६८॥ कोटिसुधानिधिघटितवर्तुलसाह्लादसीधुमद्वदनः । कुटिलकटाक्षोदयावनद्धनवद्वीपनागरीनिकरः
    ॥ ६९॥ मदमत्तवारणेन्द्रप्रतिमगतिः सिंहशावकोजस्वी । काञ्चननिर्मितमणिमयनूपुरनादाहृताङ्गनानिवहः ॥ ७०॥
    अरुणघटिकटिभूषणस्ताण्डवपाण्डित्यशिक्षिताशेषः । विस्तृतललितसुकोमलपादाम्बुजमाधुरीसिन्धुः ॥ ७१॥ स्वर्णप्रवालगुम्फितमध्यमणिस्फीतहार
    लसद्वक्षः । पल्लवमृदुतरकरतलकलितलक्ष्यनामजपलीलः ॥ ७२॥ दयाप्रेमार्द्रहसितवितीर्णप्रेमसागरः । कृपामधुरदृक्पातवशीकृतजगज्जनः
    ॥ ७३॥ अङ्गलेपमृगनाभिललितो भावसूचकद्दगञ्चलपातः । सर्वलोकनयनोत्सवकारी हासभास्वरमुखाम्बुजद्युतिः ॥ ७४॥
    पूगपुञ्जपरिपूर्णमुखश्रीः स्वेदकारिमहितोरुनासिकः । तत्तदद्भुतरहस्यशीलनः प्रान्तरक्तपरिवेष्टिताम्बरः
    ॥ ७५॥ कर्पूरागुरुकस्तुरीगन्धपूरितदिङ्मुखः । सुवृत्तदीर्घदोर्दण्डलसत्कनककङ्कणः ॥ ७६॥ सुवर्ण
