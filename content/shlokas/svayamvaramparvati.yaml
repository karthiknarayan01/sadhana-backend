id: svayamvaramparvati
category: stotram
name:
  english: svayamvaramparvati
  devanagari: स्वयम्वरम्पार्वति
content:
  english: nah || 8|| yogyam vatorvapurupasthitamatmabhaktim dirgham parikshitumanukshanamakshipantam
    | sakshagdirishamavadhuya rusha prayate draktena samshritapadam bhavatim bhajamah || 9|| gehe nije
    varanadamalasatkarabjam vyaharinupuramudancitamandahasam | niharubhanudharamuccalitam varitum mohavaham
    tribhuvanasya bhajamahe tvam || 10|| shvastahi kankanavilokanabhitabhitam pratyagraragavivasham mama
    tam nidhehi | utsvedavepathu pinakabhrita grihitam rudrani dakshinakarambujamuttamamge || 11|| rishtapaham
    bhavatu bharttrinakhendubimba
  devanagari: नः ॥ ८॥ योग्यं वटोर्वपुरुपस्थितमात्मभक्तिं दीर्घां परीक्षितुमनुक्षणमाक्षिपन्तम् । साक्षाग्दिरीशमवधूय
    रुषा प्रयाते द्राक्तेन संश्रितपदां भवतीं भजामः ॥ ९॥ गेहे निजे वरणदामलसत्कराब्जां व्याहारिनूपुरमुदञ्चितमन्दहासाम्
    । नीहारुभानुधरमुच्चलितां वरीतुं मोहावहां त्रिभुवनस्य भजामहे त्वाम् ॥ १०॥ श्वस्ताहि कङ्कणविलोकनभीतभीतं
    प्रत्यग्ररागविवशं मम तं निधेहि । उत्स्वेदवेपथु पिनाकभृता गृहीतं रुद्राणि दक्षिणकराम्बुजमुत्तमांगे
    ॥ ११॥ रिष्टापहं भवतु भर्त्तृनखेन्दुबिम्ब
