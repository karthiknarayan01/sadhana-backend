id: svarupakhyastotram
category: stotram
name:
  english: svarupakhyastotram
  devanagari: स्वरूपाख्यस्तोत्रम्
content:
  english: sa syat smaraharah || 18|| ma lomasthi svairam palalamapi marjaramapi te param caushtram maisham
    naramahishayoshchagamapi va | balim te pujaya mayi viralavaktre vitaratam satam siddhih sarva pratipadamapurva
    prabhavati || 19|| vashimantram laksham prajapati havishyashanarato diva mataryushmaccaranayugaladhyananiratah
    | param naktam nagno nidhuvanavinodena ca manum japellaksham sa syat smaraharasadrikshah kshititale
    || 20|| idam stotram matastava manusamuddharanajanuh svarupakhyam padambujayugalapujavidhiyutam |
    nisharddham va pujasamayamadhi va yastu pathati pralapastasyapi prasarati kavitvamritarasah || 21||
    kurangakshivrindam tamanusarati premataralam vashastasya kshaunipatirapi kuverapratinidhih | ripukaragaram
    kalayati ca tam kelikalaya ciram jivanmuktah prabhavati sa bhaktah pratijanuh || 22|| iti shyamarahasye
    mahakalaviracitam svarupakhyam stotram sampurnam |
  devanagari: स स्यात् स्मरहरः ॥ १८॥ म लोमास्थि स्वैरं पललमपि मार्जारमपि ते परं चौष्ट्रं मैषं नरमहिषयोश्छगमपि
    वा । बलिं ते पूजाया मयि विरलवक्त्रे वितरतां सतां सिद्धिः सर्वा प्रतिपदमपूर्वा प्रभवति ॥ १९॥ वशीमन्त्रं
    लक्षं प्रजपति हविष्याशनरतो दिवा मातर्युष्मच्चरणयुगलध्याननिरतः । परं नक्तं नग्नो निधुवनविनोदेन च मनुं
    जपेल्लक्षं स स्यात् स्मरहरसदृक्षः क्षितितले ॥ २०॥ इदं स्तोत्रं मातस्तव मनुसमुद्धारणजनुः स्वरूपाख्यं
    पादाम्बुजयुगलपूजाविधियुतम् । निशार्द्धं वा पूजासमयमधि वा यस्तु पठति प्रलापस्तस्यापि प्रसरति कवित्वामृतरसः
    ॥ २१॥ कुरङ्गाक्षीवृन्दं तमनुसरति प्रेमतरलं वशस्तस्य क्षौणीपतिरपि कुवेरप्रतिनिधिः । रिपुकारागारं कलयति
    च तं केलिकलया चिरं जीवन्मुक्तः प्रभवति स भक्तः प्रतिजनुः ॥ २२॥ इति श्यामारहस्ये महाकालविरचितं स्वरूपाख्यं
    स्तोत्रं सम्पूर्णम् ।
