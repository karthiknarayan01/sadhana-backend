id: munibhihkritamvishnustotram
category: stotram
name:
  english: munibhihkritamvishnustotram
  devanagari: मुनिभिःकृतंविष्णुस्तोत्रम्
content:
  english: munibhih kritam vishnustotram munaya ucuh | jayasva govinda jagannivasa jayo'stu nah keshava
    te prasadat | janardanasmansalilantarasthanuddhartumarhasyanaghapratapa || 31|| nishacarairdarunadarshanaih
    prabho varenya vaikuntha varaha vishno | narayanasheshamaheshvaresha prayahi bhitanjaya padmanabha
    || 32|| upendra yoginmadhukaitabhaghna vishno anantacyuta vasudeva | shrisharngacakrambujashankhapane
    rakshasva deveshvara rakshasebhyah || 33|| tvam pita jagatah shambho nanyah shaktah prabadhitum |
    nishacaraganam bhimamatastvam sharanam gatah || 34|| tvannamasankirtanato nishacara dravanti bhutanyapayanti
    carayah | nasham tatha samprati yanti vishno dharmadi satyam bhavatiha mukhyam || 35|| iti brahmapurane
    ekonavimshadhikadvishatatamadhyayantargatam munibhih kritam vishnustotram samaptam | brahmapurana
    | adhyaya 219
  devanagari: मुनिभिः कृतं विष्णुस्तोत्रम् मुनय ऊचुः । जयस्व गोविन्द जगन्निवास जयोऽस्तु नः केशव ते प्रसादात्
    । जनार्दनास्मान्सलिलान्तरस्थानुद्धर्तुमर्हस्यनघप्रताप ॥ ३१॥ निशाचरैर्दारुणादर्शनैः प्रभो वरेण्य वैकुण्ठ
    वराह विष्णो । नारायणाशेषमहेश्वरेश प्रयाहि भीताञ्जय पद्मनाभ ॥ ३२॥ उपेन्द्र योगिन्मधुकैटाभघ्न विष्णो
    अनन्ताच्युत वासुदेव । श्रीशार्ङ्गचक्राम्बुजशङ्खपाणे रक्षस्व देवेश्वर राक्षसेभ्यः ॥ ३३॥ त्वं पिता जगतः
    शम्भो नान्यः शक्तः प्रबाधितुम् । निशाचरगणं भीममतस्त्वां शरणं गताः ॥ ३४॥ त्वन्नामसङ्कीर्तनतो निशाचरा
    द्रवन्ति भूतान्यपयान्ति चारयः । नाशं तथा सम्प्रति यान्ति विष्णो धर्मादि सत्यं भवतीह मुख्यम् ॥ ३५॥
    इति ब्रह्मपुराणे एकोनविंशाधिकद्विशततमाध्यायान्तर्गतं मुनिभिः कृतं विष्णुस्तोत्रं समाप्तम् । ब्रह्मपुराण
    । अध्याय २१९
