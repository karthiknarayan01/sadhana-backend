id: saptavidhanuttarastotram
category: stotram
name:
  english: saptavidhanuttarastotram
  devanagari: सप्तविधानुत्तरस्तोत्रम्
content:
  english: saptavidhanuttarastotram namah shrilokanathaya | amitarucishirahstham padmapatrayataksham duritakritavinasham
    mohamaya'hitaksham | karadhritakanakabjam lokapalaikadaksham pranamitashirasa'ham naumi tam lokanatham
    || 1|| arunavarunashobhabodhivijnanahetum manimayamukutam samsarakambhodhisetum | kritamanasijanasham
    bodhisattvadiketum pranamitashirasa'ham naumi tam lokanatham || 2|| sarasijakritavasam durakandarpapasham
    suranaradanujasham purnacandraprakasham | sukritajanavilasam kotisuryavabhasam pranamitashirasa'ham
    naumi tam lokanatham || 3|| urasi vihitanagam mocitashesharagam bhavajaladhivibhagam mokshasaukhyaikamargam
    | pratapitakanakangam bodhibodhaikaragam pranamitashirasa'ham naumi tam lokanatham || 4|| jinavarasutarajam
    muktimalavirajam sulalitaphanirajam kirnitacabhirajam | pramuditavalirajam palitamartyarajam pranamitashirasa'ham
    naumi tam lokanatham || 5|| dhritamadhukararupam kshuptipasantakupam sucaritahayarupam simhaladantabhupam
    | agurusurabhidhupam dharitashesharupam pranamitashirasa'ham naumi tam lokanatham || 6|| trividhavidhritapapam
    me harantam tritapam pratidinamitijapam devacakre vilapam | nirayabhayakalapam bhedakajnanacapam pranamitashirasa'ham
    naumi tam lokanatham || 7|| vihitashubhajananam muktitapodyatanam vigalitakalushanam bhaktipujaratanam
    | varakushalasamuham samprapede svabhaktya pranamitashirasa'ham naumi tam lokanatham || 8|| dashabalakritasiddhim
    samvadhe buddhabodhim jananamaranabhitam marapashabhinitam | manasi malinavritte puritajnanavitte
    pranamitashirasa'ham naumi tam lokanatham || 9|| pravarasugataratnam dharmakayam samsangham ksharanamiha
    prayami karitanangabhangam | pramuditamanasaptam bodhilabhaikayatnam pranamitashirasa'ham naumi tam
    lokanatham || 10|| shrilokanathacaranambujabhaktipadma
  devanagari: सप्तविधानुत्तरस्तोत्रम् नमः श्रीलोकनाथाय । अमितरुचिशिरःस्थं पद्मपत्रायताक्षं दुरितकृतविनाशं
    मोहमायाऽहिताक्षम् । करधृतकनकाब्जं लोकपालैकदक्षं प्रणमितशिरसाऽहं नौमि तं लोकनाथम् ॥ १॥ अरुणवरुणशोभाबोधिविज्ञानहेतुं
    मणिमयमुकुटं संसारकाम्भोधिसेतुम् । कृतमनसिजनाशं बोधिसत्त्वादिकेतुं प्रणमितशिरसाऽहं नौमि तं लोकनाथम्
    ॥ २॥ सरसिजकृतवासं दूरकन्दर्पपाशं सुरनरदनुजाशं पूर्णचन्द्रप्रकाशम् । सुकृतजनविलासं कोटिसूर्यावभासं
    प्रणमितशिरसाऽहं नौमि तं लोकनाथम् ॥ ३॥ उरसि विहितनागं मोचिताशेषरागं भवजलधिविभागं मोक्षसौख्यैकमार्गम्
    । प्रतपितकनकाङ्गं बोधिबोधैकरागं प्रणमितशिरसाऽहं नौमि तं लोकनाथम् ॥ ४॥ जिनवरसुतराजं मुक्तिमालाविराजं
    सुललितफणिराजं कीर्णिताचाभिराजम् । प्रमुदितवलिराजं पालितामर्त्यराजं प्रणमितशिरसाऽहं नौमि तं लोकनाथम्
    ॥ ५॥ धृतमधुकररूपं क्षुप्तिपासान्तकूपं सुचरितहयरूपं सिंहलादन्तभूपम् । अगुरुसुरभिधूपं धारिताशेषरूपं
    प्रणमितशिरसाऽहं नौमि तं लोकनाथम् ॥ ६॥ त्रिविधविधृतपापं मे हरन्तं त्रितापं प्रतिदिनमितिजापं देवचक्रे
    विलापम् । निरयभयकलापं भेदकाज्ञानचापं प्रणमितशिरसाऽहं नौमि तं लोकनाथम् ॥ ७॥ विहितशुभजनानां मुक्तितापोद्यतानां
    विगलितकलुषाणां भक्तिपूजारतानाम् । वरकुशलसमूहं संप्रपेदे स्वभक्त्या प्रणमितशिरसाऽहं नौमि तं लोकनाथम्
    ॥ ८॥ दशबलकृतसिद्धिं संवधे बुद्धबोधिं जननमरणभीतं मारपाशाभिनीतम् । मनसि मलिनवृत्ते पूरिताज्ञानवित्ते
    प्रणमितशिरसाऽहं नौमि तं लोकनाथम् ॥ ९॥ प्रवरसुगतरत्नं धर्मकायं संसङ्घं क्षरणमिह प्रयामि कारितानङ्गभङ्गम्
    । प्रमुदितमनसाप्तं बोधिलाभैकयत्नं प्रणमितशिरसाऽहं नौमि तं लोकनाथम् ॥ १०॥ श्रीलोकनाथचरणाम्बुजभक्तिपद्म
