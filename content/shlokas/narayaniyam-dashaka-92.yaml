id: narayaniyam-dashaka-92
category: stotram
name:
  english: Narayaniyam Dashaka 92
content:
  english: vedaissarvani karmanyaphalaparataya varnitaniti budhva tani tvayyarpitanyeva hi samanucaran
    yani naishkarmyamisha | ma bhudvedairnishiddhe kuhacidapi manahkarmavacam pravritti rdurvarjam cedavaptam
    tadapi khalu bhavatyarpaye citprakashe || || yastvanyah karmayogastava bhajanamayastatra cabhishtamurtim
    hridyam sattvaikarupam drishadi hridi mridi kvapi va bhavayitva | pushpairgandhairnivedyairapi ca
    viracitaih shaktito bhaktiputai rnityam varyam saparyam vidadhadayi vibho tvatprasadam bhajeyam ||
    || strishudrastvatkathadishravanavirahita asatam te dayarha stvatpadasannayatan dvijakulajanusho hanta
    shocamyashantan | vrittyartham te yajanto bahukathitamapi tvamanakarnayanto dripta vidyabhijatyaih
    kimu na vidadhate tadrisham ma kritha mam || || papo'yam krishnarametyabhilapati nijam guhitum dushcaritram
    nirlajjasyasya vaca bahutarakathaniyani me vighnitani | bhrata me vandhyashilo bhajati kila sada vishnumittham
    budhamste nindantyuccairhasanti tvayi nihitamatimstadrisham ma kritha mam || || shvetacchayam krite
    tvam munivaravapusham prinayante tapobhi stretayam sruksruvadyankitamarunatanum yajnarupam yajante
    | sevante tantramargairvilasadarigadam dvapare shyamalangam nilam sankirtanadyairiha kalisamaye manushastvam
    bhajante || || so'yam kaleyakalo jayati muraripo yatra sankirtanadyai rniryatnaireva margairakhilada
    na cirattvatprasadam bhajante | jatastretakritadavapi hi kila kalau sambhavam kamayante daivattatraiva
    jatan vishayavisharasairma vibho vancayasman || || bhaktastavatkalau syurdramilabhuvi tato bhurishastatra
    coccai kaverim tamraparnimanu kila kritamalam ca punyam praticim | ha mamapyetadantarbhavamapi ca
    vibho kincidancadrasam tva yyashapashairnibadhya bhramaya na bhagavan puraya tvannishevam || || drishtva
    dharmadruham tam kalimapakarunam pranmahikshit parikshit hantum vyakrishtakhadgo'pi na vinihatavan
    saravedi gunamshat | tvatsevadyashu siddhyedasadiha na tatha tvatpare caisha bhiru ryattu prageva
    rogadibhirapaharate tatra ha shikshayainam || || ganga gita ca gayatryapi ca tulasika gopikacandanam
    tat salagramabhipuja parapurusha tathaikadashi namavarnah | etanyashtapyayatnanyapi kalisamaye tvatprasadapravriddhya
    kshipram muktipradanityabhidadhuh rishayasteshu mam sajjayethah || || devarshinam pitrinamapi na punah
    rini kinkaro va sa bhuman | yo'sau sarvatmana tvam sharanamupagatassarvakrityani hitva | tasyotpannam
    vikarmapyakhilamapanudasyeva cittasthitastvam tanme papotthatapan pavanapurapate rundhi bhaktim praniyah
    ||
  devanagari: वेदैस्सर्वाणि कर्माण्यफलपरतया वर्णितानीति बुध्वा तानि त्वय्यर्पितान्येव हि समनुचरन् यानि
    नैष्कर्म्यमीश । मा भूद्वेदैर्निषिद्धे कुहचिदपि मनःकर्मवाचां प्रवृत्ति र्दुर्वर्जं चेदवाप्तं तदपि खलु
    भवत्यर्पये चित्प्रकाशे ॥ ॥ यस्त्वन्यः कर्मयोगस्तव भजनमयस्तत्र चाभीष्टमूर्तिं हृद्यां सत्त्वैकरूपां
    दृषदि हृदि मृदि क्वापि वा भावयित्वा । पुष्पैर्गन्धैर्निवेद्यैरपि च विरचितैः शक्तितो भक्तिपूतै र्नित्यं
    वर्यां सपर्यां विदधदयि विभो त्वत्प्रसादं भजेयम् ॥ ॥ स्त्रीशूद्रास्त्वत्कथादिश्रवणविरहिता आसतां ते
    दयार्हा स्त्वत्पादासन्नयातान् द्विजकुलजनुषो हन्त शोचाम्यशान्तान् । वृत्त्यर्थं ते यजन्तो बहुकथितमपि
    त्वामनाकर्णयन्तो दृप्ता विद्याभिजात्यैः किमु न विदधते तादृशं मा कृथा माम् ॥ ॥ पापोऽयं कृष्णरामेत्यभिलपति
    निजं गूहितुं दुश्चरित्रं निर्लज्जस्यास्य वाचा बहुतरकथनीयानि मे विघ्नितानि । भ्राता मे वन्ध्यशीलो भजति
    किल सदा विष्णुमित्थं बुधांस्ते निन्दन्त्युच्चैर्हसन्ति त्वयि निहितमतींस्तादृशं मा कृथा माम् ॥ ॥ श्वेतच्छायं
    कृते त्वां मुनिवरवपुषं प्रीणयन्ते तपोभि स्त्रेतायां स्रुक्स्रुवाद्यङ्कितमरुणतनुं यज्ञरूपं यजन्ते ।
    सेवन्ते तन्त्रमार्गैर्विलसदरिगदं द्वापरे श्यामलाङ्गं नीलं सङ्कीर्तनाद्यैरिह कलिसमये मानुषास्त्वां
    भजन्ते ॥ ॥ सोऽयं कालेयकालो जयति मुररिपो यत्र सङ्कीर्तनाद्यै र्निर्यत्नैरेव मार्गैरखिलद न चिरात्त्वत्प्रसादं
    भजन्ते । जातास्त्रेताकृतादावपि हि किल कलौ सम्भवं कामयन्ते दैवात्तत्रैव जातान् विषयविषरसैर्मा विभो
    वञ्चयास्मान् ॥ ॥ भक्तास्तावत्कलौ स्युर्द्रमिलभुवि ततो भूरिशस्तत्र चोच्चै कावेरीं ताम्रपर्णीमनु किल
    कृतमालां च पुण्यां प्रतीचीम् । हा मामप्येतदन्तर्भवमपि च विभो किञ्चिदञ्चद्रसं त्व य्याशापाशैर्निबध्य
    भ्रमय न भगवन् पूरय त्वन्निषेवाम् ॥ ॥ दृष्ट्वा धर्मद्रुहं तं कलिमपकरुणं प्राङ्महीक्षित् परीक्षित् हन्तुं
    व्याकृष्टखड्गोऽपि न विनिहतवान् सारवेदी गुणांशात् । त्वत्सेवाद्याशु सिद्ध्येदसदिह न तथा त्वत्परे चैष
    भीरु र्यत्तु प्रागेव रोगादिभिरपहरते तत्र हा शिक्षयैनम् ॥ ॥ गङ्गा गीता च गायत्र्यपि च तुलसिका गोपिकाचन्दनं
    तत् सालग्रामाभिपूजा परपुरुष तथैकादशी नामवर्णाः । एतान्यष्टाप्ययत्नान्यपि कलिसमये त्वत्प्रसादप्रवृद्ध्या
    क्षिप्रं मुक्तिप्रदानीत्यभिदधुः ऋषयस्तेषु मां सज्जयेथाः ॥ ॥ देवर्षीणां पितृणामपि न पुनः ऋणी किङ्करो
    वा स भूमन् । योऽसौ सर्वात्मना त्वां शरणमुपगतस्सर्वकृत्यानि हित्वा । तस्योत्पन्नं विकर्माप्यखिलमपनुदस्येव
    चित्तस्थितस्त्वं तन्मे पापोत्थतापान् पवनपुरपते रुन्धि भक्तिं प्रणीयाः ॥
