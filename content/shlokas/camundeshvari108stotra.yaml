id: camundeshvari108stotra
category: stotram
name:
  english: camundeshvari108stotra
  devanagari: चामुण्डेश्वरी१०८स्तोत्र
content:
  english: shricamundeshvari ashtottarashatanamastotram shri camunda mahamaya shrimatsimhasaneshvari shrividya
    vedyamahima shricakrapuravasini || 1|| shrikanthadayita gauri girija bhuvaneshvari mahakaḻi mahalkshmih
    mahavani manonmani || 2|| sahasrashirshasamyukta sahasrakaramandita kausumbhavasanopeta ratnakancukadharini
    || 3|| ganeshaskandajanani japakusuma bhasura uma katyayani durga mantrini dandini jaya || 4|| karanguḻinakhotpanna
    narayana dashakritih sacamararamavanisavyadakshinasevita || 5|| indrakshi bagaḻa bala cakreshi vijaya'mbika
    pancapretasanarudha haridrakunkumapriya || 6|| mahabala'drinilaya mahishasuramardini madhukaitabhasamhartri
    madhurapuranayika || 7|| kameshvari yoganidra bhavani candika sati cakrarajaratharudha srishtisthityantakarini
    || 8|| annapurna jvalahjihva kaḻaratrisvarupini nishumbha shumbhadamani raktabijanishudini || 9||
    brahmyadimatrikarupa shubha shatcakradevata mulaprakritirupa''rya parvati parameshvari || 10|| bindupithakritavasa
    candramandalamadhyaka cidagnikundasambhuta vindhyacalanivasini || 11|| hayagrivagastya pujya suryacandragnilocana
    jalandharasupithastha shiva dakshayanishvari || 12|| navavaranasampujya navaksharamanustuta navalavanyarupadya
    jvaladdvatrimshatayudha || 13|| kameshabaddhamangalya candrarekha vibhushita caracarajagadrupa nityaklinna'parajita
    || 14|| odyannapithanilaya lalita vishnusodari damshtrakaraḻavadana vajreshi vahnivasini || 15|| sarvamangaḻarupadya
    saccidananda vigraha ashtadashasupithastha bherunda bhairavi para || 16|| rundamalalasatkantha bhandasuravimardhini
    pundrekshukanda kodanda pushpabana lasatkara || 17|| shivaduti vedamata shankari simhavahana | catuhshashtyupacaradya
    yoginiganasevita || 18|| navadurga bhadrakaḻi kadambavanavasini candamunda shirahchetri maharajni
    sudhamayi || 19|| shricakravaratatanka shrishailabhramarambika shrirajaraja varada shrimattripurasundari
    || 20|| shakambari shantidatri shatahantri shivaprada rakenduvadana ramya ramaniyavarakritih || 21||
    shrimatcamundikadevya namnamashtottaram shatam pathan bhaktya'rcayan devim sarvan kamanavapnuyat ||||
    iti shri camundeshvari ashtottarashatanama stotram ||||
  devanagari: श्रीचामुण्डेश्वरी अष्टोत्तरशतनामस्तोत्रम् श्री चामुण्डा माहामाया श्रीमत्सिंहासनेश्वरी श्रीविद्या
    वेद्यमहिमा श्रीचक्रपुरवासिनी ॥ १॥ श्रीकण्ठदयित गौरी गिरिजा भुवनेश्वरी महाकाळी महाल्क्ष्मीः माहावाणी
    मनोन्मणी ॥ २॥ सहस्रशीर्षसंयुक्ता सहस्रकरमण्डिता कौसुंभवसनोपेता रत्नकञ्चुकधारिणी ॥ ३॥ गणेशस्कन्दजननी
    जपाकुसुम भासुरा उमा कात्यायनी दुर्गा मन्त्रिणी दण्डिनी जया ॥ ४॥ कराङ्गुळिनखोत्पन्न नारायण दशाकृतिः
    सचामररमावाणीसव्यदक्षिणसेविता ॥ ५॥ इन्द्राक्षी बगळा बाला चक्रेशी विजयाऽम्बिका पञ्चप्रेतासनारूढा हरिद्राकुङ्कुमप्रिया
    ॥ ६॥ महाबलाऽद्रिनिलया महिषासुरमर्दिनी मधुकैटभसंहर्त्री मधुरापुरनायिका ॥ ७॥ कामेश्वरी योगनिद्रा भवानी
    चण्डिका सती चक्रराजरथारूढा सृष्टिस्थित्यन्तकारिणी ॥ ८॥ अन्नपूर्णा ज्वलःजिह्वा काळरात्रिस्वरूपिणी निषुंभ
    शुंभदमनी रक्तबीजनिषूदिनी ॥ ९॥ ब्राह्म्यादिमातृकारूपा शुभा षट्चक्रदेवता मूलप्रकृतिरूपाऽऽर्या पार्वती
    परमेश्वरी ॥ १०॥ बिन्दुपीठकृतावासा चन्द्रमण्डलमध्यका चिदग्निकुण्डसंभूता विन्ध्याचलनिवासिनी ॥ ११॥ हयग्रीवागस्त्य
    पूज्या सूर्यचन्द्राग्निलोचना जालन्धरसुपीठस्था शिवा दाक्षायणीश्वरी ॥ १२॥ नवावरणसम्पूज्या नवाक्षरमनुस्तुता
    नवलावण्यरूपाड्या ज्वलद्द्वात्रिंशतायुधा ॥ १३॥ कामेशबद्धमाङ्गल्या चन्द्ररेखा विभूषिता चरचरजगद्रूपा
    नित्यक्लिन्नाऽपराजिता ॥ १४॥ ओड्यान्नपीठनिलया ललिता विष्णुसोदरी दंष्ट्राकराळवदना वज्रेशी वह्निवासिनी
    ॥ १५॥ सर्वमङ्गळरूपाड्या सच्चिदानन्द विग्रहा अष्टादशसुपीठस्था भेरुण्डा भैरवी परा ॥ १६॥ रुण्डमालालसत्कण्ठा
    भण्डासुरविमर्धिनी पुण्ड्रेक्षुकाण्ड कोदण्ड पुष्पबाण लसत्करा ॥ १७॥ शिवदूती वेदमाता शाङ्करी सिंहवाहना
    । चतुःषष्ट्यूपचाराड्या योगिनीगणसेविता ॥ १८॥ नवदुर्गा भद्रकाळी कदम्बवनवासिनी चण्डमुण्ड शिरःछेत्री महाराज्ञी
    सुधामयी ॥ १९॥ श्रीचक्रवरताटङ्का श्रीशैलभ्रमराम्बिका श्रीराजराज वरदा श्रीमत्त्रिपुरसुन्दरी ॥ २०॥ शाकम्बरी
    शान्तिदात्री शतहन्त्री शिवप्रदा राकेन्दुवदना रम्या रमणीयवराकृतिः ॥ २१॥ श्रीमत्चामुण्डिकादेव्या नाम्नामष्टोत्तरं
    शतं पठन् भक्त्याऽर्चयन् देवीं सर्वान् कामानवाप्नुयात् ॥॥ इति श्री चामुण्डेश्वरी अष्टोत्तरशतनाम स्तोत्रम्
    ॥॥
