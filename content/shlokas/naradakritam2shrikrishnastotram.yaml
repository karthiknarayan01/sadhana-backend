id: naradakritam2shrikrishnastotram
category: stotram
name:
  english: naradakritam2shrikrishnastotram
  devanagari: नारदकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: naradakritam 2 shrikrishnastotram krishna krishnaprameyatman yogesha jagadishvara | vasudevakhilavasa
    satvatam pravara prabho || 11|| tvamatma sarvabhutanameko jyotirivaidhasam | gudho guhashayah sakshi
    mahapurusha ishvarah || 12|| atmana''tma''shrayah purvam mayaya sasrije gunan | tairidam satyasankalpah
    srijasyatsyavasishvarah || 13|| sa tvam bhudharabhutanam daityapramatharakshasam | avatirno vinashaya
    setunam rakshanaya ca || 14|| dishtya te nihato daityo lilayayam hayakritih | yasya heshitasantrastastyajantyanimisha
    divam || 15|| canuram mushtikam caiva mallananyamshca hastinam | kamsam ca nihatam drakshye parashvo'hani
    te vibho || 16|| tasyanu shankhayavanamuranam narakasya ca | parijatapaharanamindrasya ca parajayam
    || 17|| udvaham virakanyanam viryashulkadilakshanam | nrigasya mokshanam papaddvarakayam jagatpate
    || 18|| syamantakasya ca maneradanam saha bharyaya | mritaputrapradanam ca brahmanasya svadhamatah
    || 19|| paundrakasya vadham pashcatkashipuryashca dipanam | dantavaktrasya nidhanam caidyasya ca mahakratau
    || 20|| yani canyani viryani dvarakamavasan bhavan | karta drakshyamyaham tani geyani kavibhirbhuvi
    || 21|| atha te kalarupasya kshapayishnoramushya vai | akshauhininam nidhanam drakshyamyarjunasaratheh
    || 22|| vishuddhavijnanaghanam svasamsthaya samaptasarvarthamamoghavanchitam | svatejasa nityanivrittamaya
  devanagari: नारदकृतं २ श्रीकृष्णस्तोत्रम् कृष्ण कृष्णाप्रमेयात्मन् योगेश जगदीश्वर । वासुदेवाखिलावास
    सात्वतां प्रवर प्रभो ॥ ११॥ त्वमात्मा सर्वभूतानामेको ज्योतिरिवैधसाम् । गूढो गुहाशयः साक्षी महापुरुष
    ईश्वरः ॥ १२॥ आत्मनाऽऽत्माऽऽश्रयः पूर्वं मायया ससृजे गुणान् । तैरिदं सत्यसङ्कल्पः सृजस्यत्स्यवसीश्वरः
    ॥ १३॥ स त्वं भूधरभूतानां दैत्यप्रमथरक्षसाम् । अवतीर्णो विनाशाय सेतूनां रक्षणाय च ॥ १४॥ दिष्ट्या ते
    निहतो दैत्यो लीलयायं हयाकृतिः । यस्य हेषितसन्त्रस्तास्त्यजन्त्यनिमिषा दिवम् ॥ १५॥ चाणूरं मुष्टिकं
    चैव मल्लानन्यांश्च हस्तिनम् । कंसं च निहतं द्रक्ष्ये परश्वोऽहनि ते विभो ॥ १६॥ तस्यानु शङ्खयवनमुराणां
    नरकस्य च । पारिजातापहरणमिन्द्रस्य च पराजयम् ॥ १७॥ उद्वाहं वीरकन्यानां वीर्यशुल्कादिलक्षणम् । नृगस्य
    मोक्षणं पापाद्द्वारकायां जगत्पते ॥ १८॥ स्यमन्तकस्य च मणेरादानं सह भार्यया । मृतपुत्रप्रदानं च ब्राह्मणस्य
    स्वधामतः ॥ १९॥ पौण्ड्रकस्य वधं पश्चात्काशिपुर्याश्च दीपनम् । दन्तवक्त्रस्य निधनं चैद्यस्य च महाक्रतौ
    ॥ २०॥ यानि चान्यानि वीर्याणि द्वारकामावसन् भवान् । कर्ता द्रक्ष्याम्यहं तानि गेयानि कविभिर्भुवि ॥
    २१॥ अथ ते कालरूपस्य क्षपयिष्णोरमुष्य वै । अक्षौहिणीनां निधनं द्रक्ष्याम्यर्जुनसारथेः ॥ २२॥ विशुद्धविज्ञानघनं
    स्वसंस्थया समाप्तसर्वार्थममोघवाञ्छितम् । स्वतेजसा नित्यनिवृत्तमाया
