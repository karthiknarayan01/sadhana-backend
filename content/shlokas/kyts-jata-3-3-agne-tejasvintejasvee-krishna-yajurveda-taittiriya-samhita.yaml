id: kyts-jata-3-3-agne-tejasvintejasvee-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 3.3 Agne Tejasvintejasvee - Krishna Yajurveda Taittiriya Samhita
content:
  english: nnagne 'gne tejasvinn | ntejasvi tejasvi tejasvi ntejasvi tejasvi tvam | ndeveshu deveshu tva
    deveshu bhuya bhuya deveshu deveshu bhuyah | bhuya stejasvanta mbhuya bhuya stejasvantam | ma mayushmanta
    mayushmanta mma mayushmantam | ayushmantam ~varcasvantam ~varcasvanta mayushmanta mayushmantam ~varcasvantam
    | mmanushyeshu manushyeshu varcasvantam ~varcasvanta manushyeshu kuru kuru manushyeshu manushyeshu
    kuru | kuru dikshayai dikshayai kuru kuru dikshayai dikshayai ca ca dikshayai dikshayai ca | ca tva
    tva ca ca tva | tva tapasa stapasa stva tva tapasah | tapasashca ca tapasa stapasashca | ca tejase
    tejase ca ca tejase | tejase juhomi juhomi tejase tejase juhomi | ttejovij juhomi juhomi tejovit |
    tejovi dasyasi tejovi tejo ma ma teja stejo ma | ma ma ma ma ma ma | nma ma hasi ddhasi nteja stejo
    'ha maha tejo hasishagm hasisha nteja stejo hasisham | mma ma hasishagm hasisha tteja stejo hasit
    | hasi dindre ndra hasi ddhasi dindra | nnindre ndraujasvinn | nnoja svyoja svyojasvi ntva moja svyojasvi
    tvam | ndeveshu deveshu tva deveshu bhuya bhuya deveshu deveshu bhuyah | bhuya ojasvanta mojasvanta
    mbhuya bhuya ojasvantam | mma mojasvanta mojasvanta ma mayushmanta mayushmanta mma mayushmantam |
    ayushmantam ~varcasvantam ~varcasvanta mayushmanta mayushmantam ~varcasvantam | mmanushyeshu manushyeshu
    varcasvantam ~varcasvanta manushyeshu kuru kuru manushyeshu manushyeshu kuru | kuru brahmano brahmanah
    kuru kuru brahmanah | brahmanashca ca brahmano brahmanashca | ca tva tva ca ca tva | tva kshatrasya
    kshatrasya tva tva kshatrasya | kshatrasya ca ca kshatrasya kshatrasya ca | caujasa ojase ca caujase
    | || ojase juhomi juho myojasa ojase juhomi | juho myojovi dojovij juhomi juho myojovit | ojovi dasya
    syojovi dojovi dasi | ojo ma mauja ojo ma | ma ma ma ma ma ma | nma ma hasi ddhasi aha moja ojo 'ha
    maha mojah | ojo hasishagm hasisha moja ojo hasisham | mma ma hasishagm hasisha ojo hasi ddhasi doja
    ojo hasit | thsurya surya hasi ddhasi nthsurya surya bhrajasvinn | nbhrajasvi bhrajasvi bhrajasvi
    mbhrajasvi bhrajasvi tvam | ndeveshu deveshu tva deveshu bhuya bhuya deveshu deveshu bhuyah | bhuya
    bhrajasvanta mbhuya bhuya bhrajasvantam | ma mayushmanta mayushmanta mma mayushmantam | ayushmantam
    ~varcasvantam ~varcasvanta mayushmanta mayushmantam ~varcasvantam | mmanushyeshu manushyeshu varcasvantam
    ~varcasvanta manushyeshu kuru kuru manushyeshu manushyeshu kuru | rvayoh kuru kuru vayoh | ca tva
    tva ca ca tva | ca bhrajase bhrajase ca ca bhrajase | bhrajase juhomi juhomi bhrajase bhrajase juhomi
    | thsuvarvij juhomi juhomi suvarvit | suvarvidasyasi suvarvi ssuva rasyasi suvah | ma ma ma ma ma
    ma | nma ma hasi ddhasi ssuva raha mahagm suvah | hasishagm hasishagm suva mma ma hasishagm hasisha
    nmayi mayi hasi ddhasi mmayi mayi medham | mmayi mayi prajam | agni steja stejo 'gni ragni stejah
    | tejo dadhatu dadhatu teja stejo dadhatu | dadhatu mayi mayi dadhatu dadhatu mayi | mmayi mayi medham
    | mmayi mayi prajam | mayindra indro mayi mayindrah | indra indriya mindriya mindra indra indriyam
    | ndadhatu dadha tvindriya mindriya dadhatu mayi mayi dadhatu dadhatu mayi | mmayi mayi medham | mmayi
    mayi prajam | ssuryo mayi mayi suryah | suryo bhrajo bhraja bhrajo dadhatu dadhatu bhrajo bhrajo dadhatu
    | dadhatviti dadhatu | || hinkarta hinkarta vayu hinkarta 'gni ragnir hinkarta hinkarta 'gnih | agnih
    prastota prastota 'gni ragnih prastota | prastota prajapatih prajapatih prastota prastota prajapatih
    | ssama sama prajapatih prajapati prajapatiriti praja ssama sama brihaspatih | gata vishve vishva
    ud vishve deva deva vishve vishve devah | deva upagatara upagataro deva deva upagatarah | upagataro
    maruto maruta upagatara upagataro marutah | marutah pratihartarah pratihartaro maruto marutah pratihartarah
    | pratihartara indra indrah pratihartarah pratihartara indrah | pratihartara iti prati nnidhana mindra
    indro nidhana te deva deva ste te devah | devah pranabhritah pranabhrito deva devah pranabhritah |
    mpranabhritah pranabhritah pranam | pranabhrita iti prana mayi dadhatu dadhatu mayi mayi dadhatu |
    ddadhatu dadha tvetat | vai sarvagm sarvam ~vai vai sarva sarva maddhvaryu raddhvaryu ssarvagm sarva
    maddhvaryuh | addhvaryu rupakurva nnaddhvaryu raddhvaryu rupakurvann | upakurvannityupa gatribhya
    upakaro tyupakaro tyud gatribhya upakaroti | upakaroti te ta upakaro tyupakaroti te | te deva deva
    ste te devah | devah pranabhritah pranabhrito deva devah pranabhritah | mpranabhritah pranabhritah
    pranam | pranabhrita iti prana mayi dadhatu dadhatu mayi mayi dadhatu | dadha tvititi dadhatu dadha
    tviti | ityahahe tityaha | ahaita deta dahahaitat | eta devaivaita detadeva | eva sarvagm sarva mevaiva
    sarva nthsarvagm sarva matmann | dhatta ideda dhatte dhatta ida rdevahu rideda devahuh | brihaspati
    rukthamada nyukthamadani brihaspati rbrihaspati rukthamadani | ukthamadani shagmsisha cchagmsisha
    dukthamada nyukthamadani shagmsishat | ukthamadanityuktha dvishve vishve shagmsisha cchagmsisha vishve
    deva deva vishve vishve devah | ktavacah suktavaco deva deva suktavacah prithivi prithivi suktavacah
    suktavacah prithivi | suktavaca iti sukta rmatah prithivi prithivi matah | ma higmsir higmsi rma ma
    higmsih | rmadhu madhu higmsir madhu manishye manishye madhu madhu manishye | manishye madhu madhu
    manishye manishye madhu | madhu janishye janishye madhu madhu janishye | janishye madhu madhu janishye
    janishye madhu | madhu vakshyami vakshyami madhu madhu vakshyami | vakshyami madhu madhu vakshyami
    vakshyami madhu | madhu vadishyami vadishyami madhu madhu vadishyami | vadishyami madhumati mmadhumatim
    ~vadishyami vadishyami madhumatim | ndevebhyo devebhyo madhumati devebhyo vacam ~vaca ndevebhyo devebhyo
    vaca vaca mudyasa mudyasam ~vacam ~vaca mudyasam | udyasagm shushrushenyagm shushrushenya mudyasa
    mudyasagm shushrushenya shshushrushenyagm shushrushenya ma deva deva ma ma devah | deva ava ntvavantu
    deva deva avantu | avantu shobhayai shobhaya ava ntvavantu shobhayai shobhayai pitarah pitarah shobhayai
    shobhayai pitarah | pitaro 'nvanu pitarah pitaro 'nu | anu madantu mada ntvanvanu madantu | madantviti
    madantu | || vasava stva tva vasavo vasava stva | pra vrihantu vrihantu pra pra vrihantu | vrihantu
    gayatrena gayatrena vrihantu vrihantu gayatrena | gayatrena chandasa chandasa gayatrena gayatrena
    chandasa | chandasa 'gne ragne shchandasa chandasa 'gneh | mpriya magne ragneh priyam | mpathah pathah
    priya patha upopa pathah patha upa | upe hihyupope hi | ihi rudra rudra ihihi rudrah | tva rudra rudra
    stva pra vrihantu vrihantu pra pra vrihantu | vrihantu traishtubhena traishtubhena vrihantu vrihantu
    traishtubhena | traishtubhena chandasa chandasa traishtubhena traishtubhena chandasa | chanda sendrasye
    ndrasya chandasa chanda sendrasya | mpriya mindrasye ndrasya priyam | mpathah pathah priya patha upopa
    pathah patha upa | upe hihyupope hi | ihyaditya aditya ihi hyadityah | tva ''ditya aditya stva pra
    vrihantu vrihantu pra pra vrihantu | vrihantu jagatena jagatena vrihantu vrihantu jagatena | jagatena
    chandasa chandasa jagatena jagatena chandasa | chandasa vishvesham ~vishvesha nchandasa chandasa vishvesham
    | ndevanam ~vishvesham ~vishvesha mpathah pathah priya patha upopa pathah patha upa | upe hihyupope
    hi | ihi mandasu manda svihihi mandasu | mandasu te te mandasu mandasu te | te shukra shukra te te
    shukra | shukra shukragm shukragm shukra shukra shukram | shukra ma shukragm shukra ma | a dhunomi
    dhuno mya dhunomi | dhunomi bhandanasu bhandanasu dhunomi dhunomi bhandanasu | bhandanasu kotanasu
    kotanasu bhandanasu bhandanasu kotanasu | kotanasu nutanasu nutanasu kotanasu kotanasu nutanasu |
    nutanasu reshishu reshishu nutanasu nutanasu reshishu | reshishu meshishu meshishu reshishu reshishu
    meshishu | meshishu vashishu vashishu meshishu meshishu vashishu | vashishu vishvabhrithsu vishvabhrithsu
    vashishu vashishu vishvabhrithsu | vishvabhrithsu maddhvishu maddhvishu vishvabhrithsu vishvabhrithsu
    maddhvishu | vishvabhrithsviti vishvabhrit maddhvishu kakuhasu kakuhasu maddhvishu maddhvishu kakuhasu
    | kakuhasu shakvarishu shakvarishu kakuhasu kakuhasu shakvarishu | shakvarishu shukrasu shukrasu shakvarishu
    shakvarishu shukrasu | || shukrasu te te shukrasu shukrasu te | te shukra shukra te te shukra | shukra
    shukragm shukragm shukra shukra shukram | shukra ma shukragm shukra ma | a dhunomi dhuno mya dhunomi
    | dhunomi shukragm shukra ndhunomi dhunomi shukram | nte te shukragm shukra te shukrena shukrena te
    te shukrena | shukrena grihnami grihnami shukrena shukrena grihnami | grihna myahno 'hno grihnami
    grihna myahnah | ahno rupena rupena hno 'hno rupena | rupena suryasya suryasya rupena rupena suryasya
    | suryasya rashmibhi rashmibhi ssuryasya suryasya rashmibhih | rashmibhiriti rashmi nnugra ugra asmi
    ugra acucyavu racucyavu rugra ugra acucyavuh | rdivo divo 'cucyavu racucyavu divo dhara dhara divo
    divo dharah dhara asashcata sashcata dhara dhara asashcata | asashcatetyasashcata | kakuhagm rupagm
    rupa nkakuhagm rupam | rupam ~vrishabhasya vrishabhasya rupagm rupam ~vrishabhasya | vrishabhasya
    rocate rocate vrishabhasya vrishabhasya rocate | drocate rocate brihat | ssomasya somasya soma somasya
    purogah puroga ssomasya somasya purogah | shshukrah purogah puroga shshukrasya shukrasya shukra shukrasya
    purogah puroga shshukrasya shukrasya purogah | te soma soma te te soma | nama jagrivi jagrivi nama
    nama jagrivi | jagrivi tasmai tasmai jagrivi jagrivi tasmai tasmai te te tasmai tasmai te | te soma
    soma te te soma | soma somaya somaya soma soma somaya | somaya svaha svaha somaya somaya svaha khsvaha
    sva hoshik | deva soma soma deva deva soma | soma gayatrena gayatrena soma soma gayatrena | gayatrena
    chandasa chandasa gayatrena gayatrena chandasa | chandasa 'gne ragne shchandasa chandasa 'gneh | mpriya
    magne ragneh priyam | || mpathah pathah priya patho apyapi pathah patho api | apihi hyapyapihi | ihi
    vashi vashihihi vashi | ntvam ~vashi vashi tvam | deva soma soma deva deva soma | soma traishtubhena
    traishtubhena soma soma traishtubhena | traishtubhena chandasa chandasa traishtubhena traishtubhena
    chandasa | chanda sendrasye ndrasya chandasa chanda sendrasya | mpriya mindrasye ndrasya priyam |
    mpathah pathah priya patho apyapi pathah patho api | apihi hyapyapihi | ihyasmathsakha 'smathsakhe
    hi hyasmathsakha | ntva masmathsakha 'smathsakha tvam | asmathsakhetyasmat deva soma soma deva deva
    soma | soma jagatena jagatena soma soma jagatena | jagatena chandasa chandasa jagatena jagatena chandasa
    | chandasa vishvesham ~vishvesha nchandasa chandasa vishvesham | ndevanam ~vishvesham ~vishvesha mpathah
    pathah priya patho apyapi pathah patho api | apihi hyapyapihi | nah pranah prano no nah pranah | tvetu
    pranah prana etu | etu paravatah paravata etvetu paravatah | paravata a paravatah paravata a | a 'ntariksha
    dantariksha da 'ntarikshat | 'ntariksha dantariksha diva spari pari divo diva spari | ayuh prithivyah
    prithivya ayurayuh prithivyah | prithivya adhyadhi prithivyah prithivya adhi | adhyamrita mamrita
    madhya dhyamrita amrita masya syamrita mamrita masi | asi pranaya pranaya pranaya tva tva pranaya
    pranaya tva | indragni me ma indragni indragni me me varco varco me me varcah | nkrinutam ~varco varcah
    krinutam | krinutam ~varco varcah krinuta nkrinutam ~varcah | ssomo varco varca ssomo brihaspatih
    | brihaspatiriti brihaspatih | varco me me varco varco me | me vishve vishve me me vishve vishve deva
    deva vishve vishve devah | deva varco varco deva deva varcah | varco me me varco varco me | mme me
    dhattam | dhatta mashvina 'shvina dhatta ndhatta mashvina | ashvinetyashvina | dadhanve va va dadhanve
    dadhanve va i manvanvi mi manu | dvoca danvanu vocat | dbrahmani brahmani voca rbrahmani brahmani
    veh | pari vishvani vishvani pari pari vishvani | vishvani kavya kavya vishvani vishvani kavya rnemih
    kavya kavya nemih | iva bhava dabhava dive vabhavat | abhavadityabhavat | || va apa mapam ~vai va
    apam | nnamadheya mapa mapa adhava mandasu manda svadhava adhava mandasu | mandasu te te mandasu mandasu
    te | te shukra shukra te te shukra | shukra shukragm shukragm shukra shukra shukram | shukra ma shukragm
    shukra ma | a dhunomi dhuno mya dhunomi | dhuno mititi dhunomi dhunomiti | ityahahe tityaha | ahapa
    mapa mahaha pam | apa mevaivapa mapa meva | eva namadheyena namadheye naivaiva namadheyena | namadheyena
    guhyena guhyena namadheyena namadheyena guhyena | guhyena divo divo guhyena guhyena divah | divo vrishtim
    ~vrishti ndivo divo vrishti vrishti mavava vrishtim ~vrishti mava | ava rundhe rundhe 'vava rundhe
    | rundhe shukragm shukragm rundhe rundhe shukram | nte te shukragm shukra te shukrena shukrena te
    te shukrena | shukrena grihnami grihnami shukrena shukrena grihnami | grihna mititi grihnami grihna
    miti | ityahahe tityaha | ahaita deta daha haitat | va ahno 'hno vai va ahnah | ahno rupagm rupa mahno
    'hno rupam | drupagm rupam ~yat | ssuryasya suryasya ratri ratri suryasya rashmayo rashmaya ssuryasya
    suryasya rashmayah | rashmayo vrishtya vrishtya rashmayo rashmayo vrishtyah vrishtya ishata ishate
    vrishtya vrishtya ishate | ishate 'hno 'hna ishata ishate 'hnah | ahna evaivahno 'hna eva | eva rupena
    rupe naivaiva rupena | rupena suryasya suryasya rupena rupena suryasya | suryasya rashmibhi rashmibhi
    ssuryasya suryasya rashmibhih | rdivo divo rashmibhi rashmibhi rashmibhiriti rashmi divo vrishtim
    ~vrishti ndivo divo vrishti ncyavayati cyavayati vrishtim ~vrishti cyavayatya cyavayati cyavayatya
    | nnugra ugra asmi ugra acucyavu racucyavu rugra ugra acucyavuh | || acucyavu riti tyacucyavu racucyavu
    riti | ityahahe tityaha | ryathayaju rahaha yathayajuh | yathayaju revaiva yathayaju evaita deta devaivaitat
    | kakuhagm rupagm rupa nkakuhagm rupam | rupam ~vrishabhasya vrishabhasya rupagm rupam ~vrishabhasya
    | vrishabhasya rocate rocate vrishabhasya vrishabhasya rocate | drocate rocate brihat | ityahahe tityaha
    | ahaita deta daha haitat | va asya sya vai va asya | nkakuha masya sya kakuham | kakuhagm rupagm
    rupa nkakuhagm rupam | drupagm rupam ~yat | vrishti rupena rupena vrishti rupe naivaiva rupena rupenaiva
    | eva vrishtim ~vrishti mevaiva vrishti vrishti mavava vrishtim ~vrishti mava | ava rundhe rundhe
    'vava rundhe | drundhe rundhe yat | te soma soma te te soma | nama jagrivi jagrivi nama nama jagrivi
    | jagrivi titi jagrivi jagriviti | ityahahe tityaha | ahaisha esha aha haishah | esha ha haisha esha
    ha | vai havisha havisha vai vai havisha havisha havisha havih | yajati yo yo yajati yajati yah |
    ngrihitva grihitva 'da grihitva somaya somaya grihitva grihitva somaya | somaya juhoti juhoti somaya
    somaya juhoti | juhoti para para juhoti juhoti para para vai vai para para vai | va eta syaitasya
    vai va etasya | eta syayu rayu reta syaita syayuh | ayuh pranah prana ayu rayuh pranah | tyeti pranah
    prana eti | yo 'gmshu magmshum ~yo yo gmshum | ngrihnati grihna tyagmshu magmshu grihnatya grihnati
    grihnatya | nah pranah prano no nah pranah | tvetu pranah prana etu | etu paravatah paravata etvetu
    paravatah | paravata ititi paravatah paravata iti | ityahahe tityaha | ahayu rayu rahahayuh | ayu
    revaivayu rayu reva | mprana mevaiva pranam | mprana matmann | dhatte 'mrita mamrita amrita masya
    syamrita mamrita masi | asi pranaya pranaya pranaya tva tva pranaya pranaya tva | tvetiti tva tveti
    | iti hiranyagm hiranya mititi hiranyam | hiranya mabhyabhi hiranyagm hiranya mabhi | vyani tyaniti
    vi vyaniti | ani tyamrita mamrita mani tyani tyamrita amritam ~vai va amrita mamritam ~vai | vai hiranyagm
    hiranyam ~vai vai hiranyam | hiranya mayu rayur hiranyagm hiranya mayuh | ayuh pranah prana ayu rayuh
    pranah | prano 'mritena mritena pranah prano 'mritena | amrite naivaiva mritena mrite naiva | evayu
    rayu revai vayuh | nnayu rayu ratmann | dhatte shatamanagm shatamana ndhatte dhatte shatamanam | mbhavati
    bhavati shatamanagm shatamana bhavati shatayuh shatayu rbhavati bhavati shatayuh | shatayuh purushah
    purusha shshatayuh shatayuh purushah | shshatendriyah purushah purusha shatendriya ayu shyayushi shatendriya
    shshatendriya ayushi | shatendriya iti shata ayu shyevaivayu shyayu shyeva | evendriya indriya evai
    vendriye | indriye prati prati ndriya indriye prati | prati tishthati tishthati prati prati tishthati
    | tishtha tyapo 'pastishthati tishtha tyapah | apa upopapo 'pa upa | upa sprishati sprisha tyupopa
    sprishati | sprishati sprishati bheshajam | bheshajam ~vai vai bheshaja va apa apo vai va apah | mbheshaja
    mapa apo bheshajam | bheshaja mevaiva bheshaja eva kurute kuruta evaiva kurute | kuruta iti kurute
    | || asi pranah prano prano nama nama pranah prano nama | rnama nama savituh | savitu radhipatya adhipatye
    savitu ssavitu radhipatye | adhipatye 'pana mapana madhipatya adhipatye 'panam | mme me 'pana mapana
    me da da me me dah | da shcakshu shcakshu rda da shcakshuh | cakshu rasyasi cakshu shcakshu rasi |
    asi shrotragg shrotra masyasi shrotra nnama nama shrotragg shrotra rnama nama dhatuh | dhatu radhipatya
    adhipatye dhatu rdhatu radhipatye | adhipatya ayu rayu radhipatya adhipatya ayuh | me da da me me
    dah | rupa masyasi rupagm rupa masi | varno nama nama varno varno nama | rnama nama brihaspateh brihaspate
    radhipatya adhipatye brihaspate rbrihaspate radhipatye | mpraja madhipatya adhipatye prajam | me da
    da me me dah | rita masya syrita mrita masi | asi satyagm satya masyasi satyam | nnama nama satyagm
    satya name ndra syendrasya nama namendrasya | indra syadhipatya adhipatya indra syendra syadhipatye
    | nkshatra madhipatya adhipatye kshatram | me da da me me dah | mbhavya masyasi bhavya nnama nama
    pitrinam | pitrina madhipatya adhipatye pitrina mpitrina madhipatye | adhipatye 'pa mapa madhipatya
    adhipatye 'pam | apa moshadhina moshadhina mapa mapa moshadhinam | ngarbha moshadhina moshadhina dha
    ritasya rtasya dha dha ritasya | ritasya tva tva rtasya rtasya tva | tva vyomane vyomane tva tva vyomane
    | vyomana ritasya rtasya vyomane vyomana ritasya | ritasya tva tva rtasya rtasya tva | || tva vibhumane
    vibhumane tva tva vibhumane | vibhumana ritasya rtasya vibhumane vibhumana ritasya | ritasya tva tva
    rtasya rtasya tva | tva vidharmane vidharmane tva tva vidharmane | vidharmana ritasya rtasya vidharmane
    vidharmana ritasya | ritasya tva tva rtasya rtasya tva | tva satyaya satyaya tva tva satyaya | satyaya
    rtasya rtasya satyaya satyaya rtasya | ritasya tva tva rtasya rtasya tva | tva jyotishe jyotishe tva
    tva jyotishe | jyotishe prajapatih prajapati rjyotishe jyotishe prajapatih | rvirajam ~viraja mprajapatih
    prajapati prajapatiriti praja dvirajam ~viraja mapashyat | ttaya taya 'pashya dapashya ntaya taya
    bhutam | casrijata srijata ca casrijata | nta masrijata srijata tam | ta mrishibhya rishibhya sta
