id: kamakshi-duhkha-nivarana-ashtakam-tamil
category: stotram
name:
  english: Kamakshi Duhkha Nivarana Ashtakam (Tamil)
content:
  english: mankala rupini mati ani culini manmata paniyale cankatam ninkitac catutiyil vantitum cankari
    cauntariye kankana paniyan kalimukam kòntanal kaṟpakak kaminiye jèya jèya cankari kauri kirupakari
    tukka nivarani kamashi kan urimalar èna katir òlikattik kattita vantituval tan uri tavòli taròli matiòli
    tankiye vicituval man uri viliyal matavar mòliyal malaikal cutituval jèya jèya cankari kauri kirupakari
    tukka nivarani kamashi cankari cauntari caturmukan porritac capaiyil vantavale pònkari mavinil pònnadi
    vaittup pòruntita vantavale èmkulam talaittita èlilvativutane èluntanal turkkaiyale jèya jèya cankari
    kauri kirupakari tukka nivarani kamashi tanatana tantana tavil òli mulankitat tanmani ni varuvay kanakana
    kankana katiròli vicitak kanmani ni varuvay panapana pampana paṟaiyòli kuvitap panmani ni varuvay
    jèya jèya cankari kauri kirupakari tukka nivarani kamashi pancami pairavi parvata puttiri pancanal
    paniyale kòncitum kumaranaik kunammiku velanaik kòtutta nalkumariyale cankatam tirttitac camar atu
    cèytanal cakti ènum maye jèya jèya cankari kauri kirupakari tukka nivarani kamashi ènniyapati ni arulita
    varuvay èmkula teviyale panniya cèyalin palanatu nalamayp palkita arulituvay kannòli atanal karunaiye
    kattik kavalaikal tirppavale jèya jèya cankari kauri kirupakari tukka nivarani kamashi itartaru tòllai
    inimel illai ènri ni còllituvay cutartaru amute curutikal kuṟic cukamatu tantituvay patartaru irulil
    paritiyay vantu palavinai ottituvay jèya jèya cankari kauri kirupakari tukka nivarani kamashi jèya
    jèya pala camuntesvari jèya jèya sri tevi jèya jèya turkka sri paramesvari jèya jèya sri tevi jèya
    jèya jèyanti mankala kali jèya jèya sri tevi jèya jèya cankari kauri kirupakari tukka nivarani kamashi
    tukka nivarana ashtakam murrirru
  devanagari: मङ्कल रूपिणि मति अणि चूलिणि मन्मत पाणियले चङ्कटं नीङ्किटच् चटुतियिल् वन्तिटुं चङ्करि चौन्तरिये
    कङ्कण पाणियन् कलिमुकं कॊण्टनल् कऱ्पकक् कामिनिये जॆय जॆय चङ्करि कौरि किरुपाकरि तुक्क निवारणि कामाषि
    कान् उऋमलर् ऎन कतिर् ऒलिकाट्टिक् कात्तिट वन्तिटुवाल् तान् उऋ तवॊलि तारॊलि मतिऒलि ताङ्किये वीचिटुवाल्
    मान् ऊऋ विऴियाल् मातवर् मॊऴियाल् मालैकल् चूटिटुवाल् जॆय जॆय चङ्करि कौरि किरुपाकरि तुक्क निवारणि कामाषि
    चङ्करि चौन्तरि चतुर्मुकन् पोर्रिटच् चपैयिल् वन्तवले पॊङ्करि माविनिल् पॊन्नडि वैत्तुप् पॊरुन्तिट वन्तवले
    ऎम्कुलं तऴैत्तिट ऎऴिल्वटिवुटने ऎऴुन्तनल् तुर्क्कैयले जॆय जॆय चङ्करि कौरि किरुपाकरि तुक्क निवारणि कामाषि
    तणतण तन्तण तविल् ऒलि मुऴङ्किटत् तण्मणि नी वरुवाय् कणकण कङ्कण कतिरॊलि वीचिटक् कण्मणि नी वरुवाय् पणपण
    पम्पण पऱैयॊलि कूविटप् पण्मणि नी वरुवाय् जॆय जॆय चङ्करि कौरि किरुपाकरि तुक्क निवारणि कामाषि पञ्चमि
    पैरवि पर्वत पुत्तिरि पञ्चनल् पाणियले कॊञ्चिटुं कुमरनैक् कुणम्मिकु वेऴनैक् कॊटुत्त नल्कुमरियले चङ्कटं
    तीर्त्तिटच् चमर् अतु चॆय्तनल् चक्ति ऎनुं माये जॆय जॆय चङ्करि कौरि किरुपाकरि तुक्क निवारणि कामाषि ऎण्णियपटि
    नी अरुलिट वरुवाय् ऎम्कुल तेवियले पण्णिय चॆयलिन् पलनतु नलमाय्प् पल्किट अरुलिटुवाय् कण्णॊलि अतनाल् करुणैये
    काट्टिक् कवलैकल् तीर्प्पवले जॆय जॆय चङ्करि कौरि किरुपाकरि तुक्क निवारणि कामाषि इटर्तरु तॊल्लै इनिमेल्
    इल्लै ऎनृ नी चॊल्लिटुवाय् चुटर्तरु अमुते चुरुतिकल् कूऱिच् चुकमतु तन्तिटुवाय् पटर्तरु इरुलिल् परितियाय्
    वन्तु पऴविनै ओट्टिटुवाय् जॆय जॆय चङ्करि कौरि किरुपाकरि तुक्क निवारणि कामाषि जॆय जॆय पाला चामुण्टेस्वरि
    जॆय जॆय स्री तेवि जॆय जॆय तुर्क्का स्री परमेस्वरि जॆय जॆय स्री तेवि जॆय जॆय जॆयन्ति मङ्कल कालि जॆय
    जॆय स्री तेवि जॆय जॆय चङ्करि कौरि किरुपाकरि तुक्क निवारणि कामाषि तुक्क निवारण अष्टकं मुर्रिर्रु
