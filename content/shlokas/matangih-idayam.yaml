id: matangih-idayam
category: hridaya
name:
  english: matangihṟidayam
  devanagari: मातन्गीह्ऱिदयम्
content:
  english: rinvatam nityam sarvasampattidayakam | vidyaishvaryasukhavaptimangalapradamuttamam || 5|| matamgya
    hridayam stotra duhkhadaridryabhanjanam | mangalam mangalanam ca hyasti sarvasukhapradam || 6|| ||
    viniyogah || om asya shrimatangihridayastotramantrasya dakshinamurtirrishih | virat chandah | matangi
    devata | hrim bijam | hum shaktih | klim kilakam | sarvavanchitarthasiddhaye pathe viniyogah || rishyadinyasah
    | dakshinamurtirishaye namah shirasi | viratchandase namah mukhe | matangidevatayai namah hridi |
    hrim bijaya namah guhye | hum shaktaye namah padayoh | klim kilakaya namah nabhau | viniyogaya namah
    sarvange | iti rishyadinyasah || hridayadishadanganyasah | om hrim hridayaya namah | om klim shirase
    svaha | om hum shikhayai vashat | om hrim netratrayaya vaushat | om klim kavacaya hum | om hum astraya
    phat | iti hridayadishadanganyasah || karanyasah | om hrim angushthabhyam namah | om klim tarjanibhyam
    namah | om hum madhyamabhyam namah | om hrim anamikabhyam namah | om klim kanishthikabhyam namah |
    om hum karatalakaraprishthabhyam namah | iti karanyasah || || atha dhyanam || om shyamam shubhramshubhalam
    trikamalanayanam ratnasimhasanastham bhaktabhishtapradatrim suranikarakarasevyakanjamghriyugmam |
    nilambhojamshukantim nishicaranikararanyadavagnirupam pasham khadgam caturbhirvarakamalakaraih khetakam
    cankusham ca
  devanagari: ृण्वतां नित्यं सर्वसम्पत्तिदायकम् । विद्यैश्वर्यसुखावाप्तिमङ्गलप्रदमुत्तमम् ॥ ५॥ मातंग्या
    हृदयं स्तोत्र दुःखदारिद्र्यभञ्जनम् । मङ्गलं मङ्गलानां च ह्यस्ति सर्वसुखप्रदम् ॥ ६॥ ॥ विनियोगः ॥ ॐ
    अस्य श्रीमातङ्गीहृदयस्तोत्रमन्त्रस्य दक्षिणामूर्तिरृषिः । विराट् छन्दः । मातङ्गी देवता । ह्रीं बीजम्
    । हूं शक्तिः । क्लीं कीलकम् । सर्ववाञ्छितार्थसिद्धये पाठे विनियोगः ॥ ऋष्यादिन्यासः । दक्षिणामूर्तिऋषये
    नमः शिरसि । विराट्छन्दसे नमः मुखे । मातङ्गीदेवतायै नमः हृदि । ह्रीं बीजाय नमः गुह्ये । हूं शक्तये
    नमः पादयोः । क्लीं कीलकाय नमः नाभौ । विनियोगाय नमः सर्वाङ्गे । इति ऋष्यादिन्यासः ॥ हृदयादिषडङ्गन्यासः
    । ॐ ह्रीं हृदयाय नमः । ॐ क्लीं शिरसे स्वाहा । ॐ हूं शिखायै वषट् । ॐ ह्रीं नेत्रत्रयाय वौषट् । ॐ क्लीं
    कवचाय हुम् । ॐ हूं अस्त्राय फट् । इति हृदयादिषडङ्गन्यासः ॥ करन्यासः । ॐ ह्रीं अङ्गुष्ठाभ्यां नमः ।
    ॐ क्लीं तर्जनीभ्यां नमः । ॐ हूं मध्यमाभ्यां नमः । ॐ ह्रीं अनामिकाभ्यां नमः । ॐ क्लीं कनिष्ठिकाभ्यां
    नमः । ॐ हूं करतलकरपृष्ठाभ्यां नमः । इति करन्यासः ॥ ॥ अथ ध्यानम् ॥ ॐ श्यामां शुभ्रांशुभालां त्रिकमलनयनां
    रत्नसिंहासनस्थां भक्ताभीष्टप्रदात्रीं सुरनिकरकरासेव्यकञ्जांघ्रियुग्माम् । नीलाम्भोजांशुकान्तिं निशिचरनिकरारण्यदावाग्निरूपां
    पाशं खड्गं चतुर्भिर्वरकमलकरैः खेटकं चाङ्कुशं च
