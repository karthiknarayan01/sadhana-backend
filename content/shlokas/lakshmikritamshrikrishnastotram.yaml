id: lakshmikritamshrikrishnastotram
category: stotram
name:
  english: lakshmikritamshrikrishnastotram
  devanagari: लक्ष्मीकृतंश्रीकृष्णस्तोत्रम्
content:
  english: lakshmikritam shrikrishnastotram lakshmistada prithagbhutva sadhvi kashayadharini | astautsvamisvarupam
    shriparabrahmaprahamsakam || 60|| om namah shriparabrahma te namah paramatmane | brahmamuktadhipataye
    paradhamanivasine || 61|| aprithanmuktasamsthaya rahasyamuktasevine | namaste shrirangamaholadivasaya
    yogine || 62|| nirlepaya mahamukta'nadimuktadisevine | aksharairmuktavrindaishca sevitaya ca te namah
    || 63|| avatarairishvaradyaih sevitaya ca te namah | rishipitrisuradyaishca sevitaya ca te namah ||
    64|| manavaishcetaraishcapi yakshagandharvakinnaraih | nagaih sarpai rakshasaishca sevitaya ca te
    namah || 65|| udbhijjarasvedajaishca prasevitaya te namah | naraishca pramadabhishca sarvasthavarajangamaih
    || 66|| pushtyartham samsevitaya sukhadaya ca te namah | asankhyayoginam kamapurakaya ca te namah
    || 67|| asankhyanam svabhaktanam tarakaya ca te namah | manikyaya badaryashca nathaya te namo namah
    || 68|| badaro nama rajarshirvyadhadbadarikashramam | yatkripam'shatsvaminam tam vande badarikeshvaram
    || 69|| hemanalasuro yena parvatadho nishuditah | tasya badaranripateh prasannaya ca te namah || 70||
    badarisviyamuladho hemanalamamardayat | yatpratapena tam krishnam nata'smi sadhurupinam || 71|| badaro
    rasarupo'pi yatkripato vyajayata | phale tam paramatmanam vande shrisvaminam tviha || 72|| naro'pi
    bijatam prapto badarakhye phale sada | yatkripatastam phalesham vande shrisvaminam prabhum || 73||
    shrishilasya tu viprasya pretabhutasya mokshanam | badarasya pradanena kritam yena ca te namah ||
    74|| sadhusadhvisvarupabhyam darabhagyaya darshanam | datva'pyamokshayadbhupam tam yastasmai ca te
    namah || 75|| brahmadevadvijapatnyai datva dve badare phale | badrika putrikaputrau dadau badrisha
    te namah || 76|| yatpratapat krishnapatni jata vai balayogini | sureshvarisuta tam shrikrishnam vande
    narayanam || 77|| yah krishno divyadeham ca caranim nagnakesarim | kritva muktanikam ninye'ksharam
    tasmai namo namah || 78|| narmakartrya vinodinyah sadhuyogena mokshanam | kritam yena krito devaloko'pi
    ca sakhividhah || 79|| moksham tasmai dadau yashca tasmai te svamine namah | bahulakaya tatpatnyai
    lilavatyai ca nartanat || 80|| dadau brahmarasam moksham tushto yaste namah sada | maliyanam mallikam
    ca malakarau harih pura || 81|| prasannah payayamasa brahmarasam tatastayoh | mokshanam kritavan krishno
    yastasmai svamine namah || 82|| nikamadevasamjnaya dhishuraya harih svayam | moksham dadau ca tatpatnyai
    tasmai shrisvamine namah || 83|| nigadabhramakaivartam matsyashapat suduhkhinam | taritam bhaktaya
    patnya yasya kripadishevadheh || 84|| anayah svam param dhama taya sakam ca yoshita | tatha tatputrika
    cadya sadhvi pundarika sati || 85|| nirvanika sati canya''nandaghana tritiyaka | tatha pancatmaja
    jnanadarbhyadayo'pi yam prabhum || 86|| bhajitva mokshanam praptastam bhaje svaminam harim | kritaghnyastu
    kuthalyakhyastriya yo rajayakshmatah || 87|| raksham cakre dadau moksham tam vande svaminam prabhum
    | prataranya vishalanyah satam samagamaddharih || 88|| uddharam kritavan yastam vande shrisvaminam
    prabhum | gangam'janim katakartrim satsangena tvamokshayat || 89|| ramanjanim ramam cakre yastasmai
    haraye namah | sunarinim kulalim ca ranastambam ca tatpatim || 90|| sadhuyogena tatputram samsaradyo
    vyamocayat | vande tam svaminam krishnam vallabham prabhumishvaram || 91|| svarnakarastriya hemasudhayastu
    prabhaktitah | prasanno yo dadau tasyai ca'nnapurnatvamuttamam || 92|| muktim dadau tatha'nte ca vande
    shrisvaminam harim | radhikayanayogena vidruminim tu vishtinim || 93|| dhamni radhasamam cakre yastasmai
    svamine namah | shvapacim malavanim yo dharmayogena muktigam || 94|| sakutumbamakarodyastasmai shrisvamine
    namah | rathyamarjanikam karelikam hitanjalermuneh || 95|| yogat kathashravanena muktimanayadyah prabhuh
    | hetanjaleshca putrinam nirmohitvam ca yadbalat || 96|| mokshanam kritavan yashca tasmai te'stu namo
    muhuh | niranjanadayashcapi bhratarah panca tadrishah || 97|| muktim yena pranitastam vande shrisvaminam
    prabhum | yantrakartrim gomatim ca nayarajam ca tatpatim || 98|| arakshayadrajayakshmato yastam staumi
    mavaram | kanakangadayah krishno dhurtaya mokshanam vyadhat || 99|| bhanavanya dyutakartryah shreyashcakara
    yo harih | rayaharinripasya'pi tam vande svaminam prabhum || 100|| madhavarayanripateh shreyo vyadhattu
    yah prabhuh | vaidyotikam tu kamsarim divyamamokshayacca yah || 101|| nararajam kumbhakaram tadbharyam
    ratnikam ca yah | ambalikam svarnakartrim dhatudhmam ca vinodinim || 102|| amokshayaddhariryashca
    natam ranjanakovidam | shriramasundaram capi kadaryam yo'pyamokshayat || 103|| vande tam paramatmanam
    svaminam dikshitam prabhum | kshirodaviram bhupam ca rajnim ruharinim ca yah || 104|| ganikam somikam
    pancaputriyutamamokshayat | arunanipatim patalanyadisham namami tam || 109|| madyapaya liyaryashca
    mokshanam yo vyadhat prabhuh | mishtasavadhvajinashca tam vande svaminam harim || 106|| gandavatabhidhayashca
    cakrinya mokshanam vyadhat | yaskavadasya ca moksham tam vande svaminam harim || 107|| nindakartrya
    tvirvadantya mokshanam yo vyadhatprabhuh | dvirgarjanakhyapatyushca tam vande svaminam harim || 108||
    suraprasadam vipram ca gurughnam yo hyamocayat | mataram pitaram tasya ca'mokshayattu yah prabhuh
    || 109|| nagavikramabhupasya devadroharatasya ca | navadrohiyutasya'pi mokshakartre tu te namah ||
    110|| shalamitro jivikaghno jayalakshmishca tatpriya | uddhritau yena krishnena tasmai shrisvamine
    namah || 111|| kanyaghnam yaddharajam yo vishadam sadhuyogatah | amocayadyamadutat tam bhaje svaminam
    harim || 112|| sadhujivam kumaram ca kumarim sadhujivanim | nirvishadam ca yah krishno'mokshayat tam
    muhurnamah || 113|| narayanyai prabhavatyai ghatamalakhyayoshite | mokshanam pradadau yashca tasmai
    shrisvamine namah || 114|| anangavallyah kuttanyastatsakhinam ca mokshanam | kritavan yah prabhuh
    svami tasmai krishnaya te namah || 115|| shandhavajrabhidham shandham yah samsaradvyamocayat | napumsakanam
    pumstritvam cakre yaste namo muhuh || 116|| yavasandham tu mamsadam patnim majavalim ca yah | tatkutumbam
    harirvyamocayattasmai ca te namah || 117|| bhandam yo bhandashilam tu sakutumbam vyamocayat | trigalava~statha
    bhavayanadin yo vyamocayat || 118|| hariviryadimalla~shcamokshayadyah prabhurharih | vardhushikan
    harilaladimshca vyamokshayattu yah || 119|| kiravanadimrigayumamokshayacca yah prabhuh | amokshayacca
    nagadam vaditam yashca te namah || 120|| sarahasiyamartandamandaladipramokshakam | vilasadevam luncadam
    vyamokshayacca tam bhaje || 121|| daivan prakashakadimshca tatputran sadhudikshitan | mauktikayanikadyashca
    tatputrih sadhvikastatha || 122|| vyamokshayacca yah svami vande shrisvaminam ca tam | duritaghoshanamanam
    sarvadam yo vyamokshayat || 123|| tatpatnim ca mahasatyayanim vyamokshayacca yah | tatputran tatputrikashca'mokshayadyashca
    tam bhaje || 124|| dharmabhatam mahamatyam shilayanim ca tatpriyam | amokshayat prabhuryah shrisvaminam
    tam sada bhaje || 125|| dharmadhyaksham prabhurmukundasavitramamokshayat | nyayakshinim ca tadbharyam
    yastam vande janardanam || 126|| vishalarekhakam yashcauddharayallekhakam harih | shucikantam ca tatpatnim
    tam vande svaminam prabhum || 127|| krishnakanteshvaronatham namami vallabham prabhum | kayasthan
    karanadyan yo'mokshayatparameshvarah || 128|| shahavilapanadimshca'mokshayattam namami ca | gridhra
    uddharito yena purvakaulikadehavan || 129|| marjarashcoddhrito yena purvagobaragopakah | jambukashcoddhrito
    yena pura thathutholako vanik || 130|| svarnanjanadayo bhritya uddhrita yena sharngina | shyenah samuddhritashcapi
    pura yo bharavatakah || 131|| catakashcoddhritah purve'ja yastam naumi madhavam | kapota uddhrita
    yena sarthavarastu ye pura || 132|| kakastathoddhrita yena pura ye kankajatijah | grihagodhoddhrita
    yena nanaki prak khavasini || 133|| mushaka uddhrita yena prak shudrah sanghavatakah | nakulashcoddhrito
    yena prak varutastu sagarah || 134|| kiratarabhidho bhata uddhrito yena tam bhaje | jyotirvetta devagatishvaro
    yena samuddhritah || 135|| punyavati ca tadbharyoddhrita yena namami tam | bandijano jayamano nripashca
    vajravikramah || 136|| prajashcapyuddhrita yena vande shrisvaminam hi tam | sapta'bdhisimhanripatih
    sutastasya sukesari || 137|| rajni rakshavati yena mokshitastam namamyaham | magadho harshanayano
    yogidasashca sevakah || 138|| yena saurabhasavitrastambulakrit samuddhritah | rangilo rangakarashca
    damarukashca vadyakrit || 139|| cihnarayo bhavasarashcoddhrito yena tam bhaje | rameshvaro gramayaji
    tathoddhrito'pi yena ha || 140|| svarnastarano vidyadhrashcitrabarhadayastatha | uddhritah kinnara
    yena kimpumamsashca caranah || 141|| asankhyashca nripa yenoddhritastam tvam namami ca | nandibhillam
    hatavan yo raraksha nagavikramam || 142|| hatam sainyam punah sanjivayamasa namami tam | puranjayanripam
    hyamokshayadyastam namamyaham || 143|| mokshita yena bahavah saptasvarganivasinah | saptapatalavasashca
    tam namami mahaprabhum || 144|| ishvarebhyashca dharmibhyo darshanam yo dadau prabhuh | sarvastridasavargadhyastam
    bhaje purushottamam || 145|| sarvastribhyo nijabhyashca yugalapatyakani yah | manasani dadau tasmai
    namah shriparamatmane || 146|| mayapalo nripo mahanastiko yamalokatah | mocito yena krishnena tam
    bhaje sadhusatkritim || 147|| jyeshthaputraya ca dilavarirajyam dadau tatah | svayam patnim darshayitum
    yayau dhama'ksharam prati || 148|| dhama nitva nijan sarvan sarvashca pramadastatha | pare dhamni
    sviyamurtau vasam datva hyarakshayat || 149|| kunkumavapikakshetramagatya tyagamapya yah | sadhudiksham
    parigrihya vartate sakshigocarah || 150|| namami svamine tasmai shrikrishnaprabhave namah | anadishrikrishnanarayanayanaya
    yogine || 151|| yah sada shriharishcaste saptayatanamurtiman | lina lakshmiryadange'ham varte samaparayana
    || 152|| prajna lina pashavati lina ca svamini prabhau | yallilah shreyase sarva jivanam karmadehinam
    || 153|| tasmai te pataye capyapataye pranamamyaham | sarvadanishvaravaryottamaya paramatmane || 154||
    namo vishishtarupaya sarvatirthatitirthine | tirthartham bhagavan svamin lokakalyanahetave || 155||
    abhilasha jayate me mahatma~stam prapuraya | asankhyajanmabhih krishnoddhritastvaya hi dehinah ||
    156|| dharmavriddhih krita sarva punashcapi vibhavaya | lakshmibhakta bahavo'tra loke bhavanti tan
    prabho || 157|| sadhurupena nirbandhan kritva mokshaya macchritan | ityarthayami bhagavan viramami
    tvayi prabho || 158|| ityuktva badrike lakshmih svaminyantaradhiyata | lakshmistavam prabhasheta bhavagarbho'pi
    yo janah || 159|| lakshmivacchriharau linasthanameshyati shashvatam | nari stavamadhiyana lakshmih
    syannatra samshayah || 160|| priya lakshmih stavajjata jata lakshmishca madhavi | bhuktim muktim labhet
    stotradyatheshtam parameshvarim || 161|| yatkrishnasya samastam vai tattasyah syatsamastakam | shrikrishnarpanadakshayah
    karshnyah shribadrike svakam || 162|| iti shrilakshminarayaniyasamhitayah tishyasantanatmakasya caturthakhande
    120
  devanagari: लक्ष्मीकृतं श्रीकृष्णस्तोत्रम् लक्ष्मीस्तदा पृथग्भूत्वा साध्वी काषायधारिणी । अस्तौत्स्वामिस्वरूपं
    श्रीपरब्रह्मप्रहंसकम् ॥ ६०॥ ॐ नमः श्रीपरब्रह्म ते नमः परमात्मने । ब्रह्ममुक्ताधिपतये परधामनिवासिने
    ॥ ६१॥ अपृथङ्मुक्तसंस्थाय रहस्यमुक्तसेविने । नमस्ते श्रीरङ्गमहोलादिवासाय योगिने ॥ ६२॥ निर्लेपाय महामुक्ताऽनादिमुक्तादिसेविने
    । अक्षरैर्मुक्तवृन्दैश्च सेविताय च ते नमः ॥ ६३॥ अवतारैरीश्वराद्यैः सेविताय च ते नमः । ऋषिपितृसुराद्यैश्च
    सेविताय च ते नमः ॥ ६४॥ मानवैश्चेतरैश्चापि यक्षगन्धर्वकिन्नरैः । नागैः सर्पै राक्षसैश्च सेविताय च ते
    नमः ॥ ६५॥ उद्भिज्जरास्वेदजैश्च प्रसेविताय ते नमः । नरैश्च प्रमदाभिश्च सर्वस्थावरजङ्गमैः ॥ ६६॥ पुष्ट्यर्थं
    संसेविताय सुखदाय च ते नमः । असङ्ख्ययोगिनां कामपूरकाय च ते नमः ॥ ६७॥ असङ्ख्यानां स्वभक्तानां तारकाय
    च ते नमः । माणिक्याया बदर्याश्च नाथाय ते नमो नमः ॥ ६८॥ बदरो नाम राजर्षिर्व्यधाद्बदरिकाश्रमम् । यत्कृपांऽशात्स्वामिनं
    तं वन्दे बदरिकेश्वरम् ॥ ६९॥ हेमानलासुरो येन पर्वताधो निषूदितः । तस्य बदरनृपतेः प्रसन्नाय च ते नमः
    ॥ ७०॥ बदरीस्वीयमूलाधो हेमानलममर्दयत् । यत्प्रतापेन तं कृष्णं नताऽस्मि साधुरूपिणम् ॥ ७१॥ बदरो रसारूपोऽपि
    यत्कृपातो व्यजायत । फले तं परमात्मानं वन्दे श्रीस्वामिनं त्विह ॥ ७२॥ नरोऽपि बीजतां प्राप्तो बदराख्ये
    फले सदा । यत्कृपातस्तं फलेशं वन्दे श्रीस्वामिनं प्रभुम् ॥ ७३॥ श्रीशीलस्य तु विप्रस्य प्रेतभूतस्य मोक्षणम्
    । बदरस्य प्रदानेन कृतं येन च ते नमः ॥ ७४॥ साधुसाध्वीस्वरूपाभ्यां दाराभाग्याय दर्शनम् । दत्वाऽप्यमोक्षयद्भूपं
    तं यस्तस्मै च ते नमः ॥ ७५॥ ब्रह्मदेवद्विजपत्न्यै दत्वा द्वे बदरे फले । बद्रिका पुत्रिकापुत्रौ ददौ
    बद्रीश ते नमः ॥ ७६॥ यत्प्रतापात् कृष्णपत्नी जाता वै बालयोगिनी । सुरेश्वरीसुता तं श्रीकृष्णं वन्दे
    नरायणम् ॥ ७७॥ यः कृष्णो दिव्यदेहां च चारणीं नाग्नकेसरीम् । कृत्वा मुक्तानिकां निन्येऽक्षरं तस्मै नमो
    नमः ॥ ७८॥ नर्मकर्त्र्या विनोदिन्याः साधुयोगेन मोक्षणम् । कृतं येन कृतो देवलोकोऽपि च सखीविधः ॥ ७९॥
    मोक्षं तस्मै ददौ यश्च तस्मै ते स्वामिने नमः । बाहुलकाय तत्पत्न्यै लीलावत्यै च नर्तनात् ॥ ८०॥ ददौ ब्रह्मरसं
    मोक्षं तुष्टो यस्ते नमः सदा । मालियानं मल्लिकां च मालाकारौ हरिः पुरा ॥ ८१॥ प्रसन्नः पाययामास ब्रह्मरसं
    ततस्तयोः । मोक्षणं कृतवान् कृष्णो यस्तस्मै स्वामिने नमः ॥ ८२॥ निकामदेवसंज्ञाय धीशूराय हरिः स्वयम्
    । मोक्षं ददौ च तत्पत्न्यै तस्मै श्रीस्वामिने नमः ॥ ८३॥ निगडभ्रामकैवर्तं मत्स्याशापात् सुदुःखिनम् ।
    तारितं भक्तया पत्न्या यस्य कृपादिशेवधेः ॥ ८४॥ अनयः स्वं परं धाम तया साकं च योषिता । तथा तत्पुत्रिका
    चाद्या साध्वी पुण्डरिका सती ॥ ८५॥ निर्वाणिका सती चान्याऽऽनन्दघना तृतीयका । तथा पञ्चात्मजा ज्ञानदर्भ्यादयोऽपि
    यं प्रभुम् ॥ ८६॥ भजित्वा मोक्षणं प्राप्तास्तं भजे स्वामिनं हरिम् । कृतघ्न्यास्तु कुथल्याख्यस्त्रिया
    यो राजयक्ष्मतः ॥ ८७॥ रक्षां चक्रे ददौ मोक्षं तं वन्दे स्वामिनं प्रभुम् । प्रतारण्या विषलाण्याः सतां
    समागमाद्धरिः ॥ ८८॥ उद्धारं कृतवान् यस्तं वन्दे श्रीस्वामिनं प्रभुम् । गङ्गांऽजनीं कटकर्त्रीं सत्सङ्गेन
    त्वमोक्षयत् ॥ ८९॥ रमाञ्जनीं रमां चक्रे यस्तस्मै हरये नमः । सुनारिणीं कुलालीं च रणस्तम्बं च तत्पतिम्
    ॥ ९०॥ साधुयोगेन तत्पुत्रं संसाराद्यो व्यमोचयत् । वन्दे तं स्वामिनं कृष्णं वल्लभं प्रभुमीश्वरम् ॥ ९१॥
    स्वर्णकारस्त्रिया हेमसुधायास्तु प्रभक्तितः । प्रसन्नो यो ददौ तस्यै चाऽन्नपूर्णात्वमुत्तमम् ॥ ९२॥ मुक्तिं
    ददौ तथाऽन्ते च वन्दे श्रीस्वामिनं हरिम् । राधिकायनयोगेन विद्रुमिणीं तु विष्टिणीम् ॥ ९३॥ धाम्नि राधासमां
    चक्रे यस्तस्मै स्वामिने नमः । श्वपचीं मालवानीं यो धर्मयोगेन मुक्तिगाम् ॥ ९४॥ सकुटुम्बामकरोद्यस्तस्मै
    श्रीस्वामिने नमः । रथ्यामार्जनिकां कारेलिकां हिताञ्जलेर्मुनेः ॥ ९५॥ योगात् कथाश्रवणेन मुक्तिमनयद्यः
    प्रभुः । हेताञ्जलेश्च पुत्रीणां निर्मोहित्वं च यद्बलात् ॥ ९६॥ मोक्षणं कृतवान् यश्च तस्मै तेऽस्तु नमो
    मुहुः । निरञ्जनादयश्चापि भ्रातरः पञ्च तादृशाः ॥ ९७॥ मुक्तिं येन प्रणीतास्तं वन्दे श्रीस्वामिनं प्रभुम्
    । यन्त्रकर्त्रीं गोमतीं च नयराजं च तत्पतिम् ॥ ९८॥ अरक्षयद्राजयक्ष्मतो यस्तं स्तौमि मावरम् । कनकाङ्गदायाः
    कृष्णो धूर्ताया मोक्षणं व्यधात् ॥ ९९॥ भाणवाण्या द्यूतकर्त्र्याः श्रेयश्चकार यो हरिः । रायहरिनृपस्याऽपि
    तं वन्दे स्वामिनं प्रभुम् ॥ १००॥ माधवरायनृपतेः श्रेयो व्यधात्तु यः प्रभुः । वैद्योतिकां तु कंसारीं
    दिव्याममोक्षयच्च यः ॥ १०१॥ नरराजं कुम्भकारं तद्भार्यां रत्निकां च यः । अम्बालिकां स्वर्णकर्त्रीं धातुध्मां
    च विनोदिनीम् ॥ १०२॥ अमोक्षयद्धरिर्यश्च नटं रञ्जनकोविदम् । श्रीरामसुन्दरं चापि कदर्यं योऽप्यमोक्षयत्
    ॥ १०३॥ वन्दे तं परमात्मानं स्वामिनं दीक्षितं प्रभुम् । क्षीरोदवीरं भूपं च राज्ञीं रुहारिणीं च यः ॥
    १०४॥ गणिकां सोमिकां पञ्चपुत्रीयुताममोक्षयत् । अरुणानीपतिं पाटलान्यादीशं नमामि तम् ॥ १०९॥ मद्यपाया
    लियार्याश्च मोक्षणं यो व्यधात् प्रभुः । मिष्टासवध्वजिनश्च तं वन्दे स्वामिनं हरिम् ॥ १०६॥ गण्डवाताभिधायाश्च
    चक्रिण्या मोक्षणं व्यधात् । यास्कवादस्य च मोक्षं तं वन्दे स्वामिनं हरिम् ॥ १०७॥ निन्दाकर्त्र्या ट्विर्वदन्त्या
    मोक्षणं यो व्यधात्प्रभुः । द्विर्गर्जनाख्यपत्युश्च तं वन्दे स्वामिनं हरिम् ॥ १०८॥ सुरप्रसादं विप्रं
    च गुरुघ्नं यो ह्यमोचयत् । मातरं पितरं तस्य चाऽमोक्षयत्तु यः प्रभुः ॥ १०९॥ नागविक्रमभूपस्य देवद्रोहरतस्य
    च । नवद्रोहियुतस्याऽपि मोक्षकर्त्रे तु ते नमः ॥ ११०॥ शालमित्रो जीविकाघ्नो जयालक्ष्मीश्च तत्प्रिया
    । उद्धृतौ येन कृष्णेन तस्मै श्रीस्वामिने नमः ॥ १११॥ कन्याघ्नं यद्धराजं यो विषदं साधुयोगतः । अमोचयद्यमदूतात्
    तं भजे स्वामिनं हरिम् ॥ ११२॥ साधुजीवं कुमारं च कुमारीं साधुजीवनीम् । निर्विषादं च यः कृष्णोऽमोक्षयत्
    तं मुहुर्नमः ॥ ११३॥ नारायण्यै प्रभावत्यै घटमालाख्ययोषिते । मोक्षणं प्रददौ यश्च तस्मै श्रीस्वामिने
    नमः ॥ ११४॥ अनङ्गवल्ल्याः कुट्टन्यास्तत्सखीनां च मोक्षणम् । कृतवान् यः प्रभुः स्वामी तस्मै कृष्णाय
    ते नमः ॥ ११५॥ षण्ढवज्राभिधं षण्ढं यः संसाराद्व्यमोचयत् । नपुंसकानां पुंस्त्रीत्वं चक्रे यस्ते नमो
    मुहुः ॥ ११६॥ यवसन्धं तु मांसादं पत्नीं मजावलीं च यः । तत्कुटुम्बं हरिर्व्यमोचयत्तस्मै च ते नमः ॥ ११७॥
    भाण्डं यो भण्डशीलं तु सकुटुम्बं व्यमोचयत् । त्रिगालवाँस्तथा भवायनादीन् यो व्यमोचयत् ॥ ११८॥ हरिवीर्यादिमल्लाँश्चामोक्षयद्यः
    प्रभुर्हरिः । वार्धूषिकान् हरिलालादींश्च व्यमोक्षयत्तु यः ॥ ११९॥ कीरवणादिमृगयूममोक्षयच्च यः प्रभुः
    । अमोक्षयच्च नागादं वादिटं यश्च ते नमः ॥ १२०॥ सारहासीयमार्तण्डमण्डलादिप्रमोक्षकम् । विलासदेवं लुञ्चादं
    व्यमोक्षयच्च तं भजे ॥ १२१॥ दैवान् प्रकाशकादींश्च तत्पुत्रान् साधुदीक्षितान् । मौक्तिकायनिकाद्याश्च
    तत्पुत्रीः साध्विकास्तथा ॥ १२२॥ व्यमोक्षयच्च यः स्वामी वन्दे श्रीस्वामिनं च तम् । दुरितघोषनामानं सर्वादं
    यो व्यमोक्षयत् ॥ १२३॥ तत्पत्नीं च महासत्यायनीं व्यमोक्षयच्च यः । तत्पुत्रान् तत्पुत्रिकाश्चाऽमोक्षयद्यश्च
    तं भजे ॥ १२४॥ धर्मभटं महामात्यं शीलयानीं च तत्प्रियाम् । अमोक्षयत् प्रभुर्यः श्रीस्वामिनं तं सदा भजे
    ॥ १२५॥ धर्माध्यक्षं प्रभुर्मुकुन्दसावित्रममोक्षयत् । न्यायाक्षिणीं च तद्भार्यां यस्तं वन्दे जनार्दनम्
    ॥ १२६॥ विशालरेखकं यश्चौद्धारयल्लेखकं हरिः । शुचिकान्तां च तत्पत्नीं तं वन्दे स्वामिनं प्रभुम् ॥ १२७॥
    कृष्णकान्तेश्वरोनाथं नमामि वल्लभं प्रभुम् । कायस्थान् करणाद्यान् योऽमोक्षयत्परमेश्वरः ॥ १२८॥ शाहविलापनादींश्चाऽमोक्षयत्तं
    नमामि च । गृध्र उद्धारितो येन पूर्वकौलिकदेहवान् ॥ १२९॥ मार्जारश्चोद्धृतो येन पूर्वगोबारगोपकः । जम्बूकश्चोद्धृतो
    येन पुरा ठठूठोलको वणिक् ॥ १३०॥ स्वर्णाञ्जनादयो भृत्या उद्धृता येन शार्ङ्गिणा । श्येनः समुद्धृतश्चापि
    पुरा यो भरवाटकः ॥ १३१॥ चटकाश्चोद्धृताः पूर्वेऽजा यास्तं नौमि माधवम् । कपोता उद्धृता येन सार्थवारास्तु
    ये पुरा ॥ १३२॥ काकास्तथोद्धृता येन पुरा ये कङ्कजातिजाः । गृहगोधोद्धृता येन नाणकी प्राक् खवासिनी ॥
    १३३॥ मूषका उद्धृता येन प्राक् शूद्राः सङ्घवाटकाः । नकुलश्चोद्धृतो येन प्राक् वारुटस्तु सागरः ॥ १३४॥
    कीरताराभिधो भाट उद्धृतो येन तं भजे । ज्योतिर्वेत्ता देवगतीश्वरो येन समुद्धृतः ॥ १३५॥ पुण्यवती च तद्भार्योद्धृता
    येन नमामि तम् । बन्दिजनो जयमानो नृपश्च वज्रविक्रमः ॥ १३६॥ प्रजाश्चाप्युद्धृता येन वन्दे श्रीस्वामिनं
    हि तम् । सप्ताऽब्धिसिंहनृपतिः सूतस्तस्य सुकेसरी ॥ १३७॥ राज्ञी रक्षावती येन मोक्षितास्तं नमाम्यहम्
    । मागधो हर्षनयनो योगिदासश्च सेवकः ॥ १३८॥ येन सौरभसावित्रस्ताम्बूलकृत् समुद्धृतः । रङ्गिलो रङ्गकारश्च
    डमरूकश्च वाद्यकृत् ॥ १३९॥ चिह्नरायो भावसारश्चोद्धृतो येन तं भजे । रमेश्वरो ग्रामयाजी तथोद्धृतोऽपि
    येन ह ॥ १४०॥ स्वर्णास्तरणो विद्याध्रश्चित्रबर्हादयस्तथा । उद्धृताः किन्नरा येन किम्पुमांसश्च चारणाः
    ॥ १४१॥ असङ्ख्याश्च नृपा येनोद्धृतास्तं त्वां नमामि च । नन्दिभिल्लं हतवान् यो ररक्ष नागविक्रमम् ॥ १४२॥
    हतं सैन्यं पुनः सञ्जीवयामास नमामि तम् । पुरञ्जयनृपं ह्यमोक्षयद्यस्तं नमाम्यहम् ॥ १४३॥ मोक्षिता येन
    बहवः सप्तस्वर्गनिवासिनः । सप्तपातालवासाश्च तं नमामि महाप्रभुम् ॥ १४४॥ ईश्वरेभ्यश्च धार्मिभ्यो दर्शनं
    यो ददौ प्रभुः । सर्वस्त्रीदासवर्गाढ्यस्तं भजे पुरुषोत्तमम् ॥ १४५॥ सर्वस्त्रीभ्यो निजाभ्यश्च युगलापत्यकानि
    यः । मानसानि ददौ तस्मै नमः श्रीपरमात्मने ॥ १४६॥ मायापालो नृपो महानास्तिको यमलोकतः । मोचितो येन कृष्णेन
    तं भजे साधुसत्कृतिम् ॥ १४७॥ ज्येष्ठपुत्राय च दीलावरीराज्यं ददौ ततः । स्वयं पत्नीं दर्शयितुं ययौ धामाऽक्षरं
    प्रति ॥ १४८॥ धाम नीत्वा निजान् सर्वान् सर्वाश्च प्रमदास्तथा । परे धाम्नि स्वीयमूर्तौ वासं दत्वा ह्यरक्षयत्
    ॥ १४९॥ कुङ्कुमवापिकाक्षेत्रमागत्य त्यागमाप्य यः । साधुदीक्षां परिगृह्य वर्तते साक्षिगोचरः ॥ १५०॥ नमामि
    स्वामिने तस्मै श्रीकृष्णप्रभवे नमः । अनादिश्रीकृष्णनारायणायनाय योगिने ॥ १५१॥ यः सदा श्रीहरिश्चास्ते
    सप्तायतनमूर्तिमान् । लीना लक्ष्मीर्यदङ्गेऽहं वर्ते सामपरायणा ॥ १५२॥ प्रज्ञा लीना पाशवती लीना च स्वामिनि
    प्रभौ । यल्लीलाः श्रेयसे सर्वा जीवानां कर्मदेहिनाम् ॥ १५३॥ तस्मै ते पतये चाप्यपतये प्रणमाम्यहम् ।
    सर्वदानीश्वरवर्योत्तमाय परमात्मने ॥ १५४॥ नमो विशिष्टरूपाय सर्वतीर्थातितीर्थिने । तीर्थार्थं भगवन्
    स्वामिन् लोककल्याणहेतवे ॥ १५५॥ अभिलाषा जायते मे महात्मँस्तां प्रपूरय । असङ्ख्यजन्मभिः कृष्णोद्धृतास्त्वया
    हि देहिनः ॥ १५६॥ धर्मवृद्धिः कृता सर्वा पुनश्चापि विभावय । लक्ष्मीभक्ता बहवोऽत्र लोके भवन्ति तान्
    प्रभो ॥ १५७॥ साधुरूपेण निर्बन्धान् कृत्वा मोक्षय मच्छ्रितान् । इत्यर्थयामि भगवन् विरमामि त्वयि प्रभो
    ॥ १५८॥ इत्युक्त्वा बद्रिके लक्ष्मीः स्वामिन्यन्तरधीयत । लक्ष्मीस्तवं प्रभाषेत भावगर्भोऽपि यो जनः ॥
    १५९॥ लक्ष्मीवच्छ्रीहरौ लीनस्थानमेष्यति शाश्वतम् । नारी स्तवमधीयाना लक्ष्मीः स्यान्नात्र संशयः ॥ १६०॥
    प्रिया लक्ष्मीः स्तवाज्जाता जाता लक्ष्मीश्च माधवी । भुक्तिं मुक्तिं लभेत् स्तोत्राद्यथेष्टां पारमेश्वरीम्
    ॥ १६१॥ यत्कृष्णस्य समस्तं वै तत्तस्याः स्यात्समस्तकम् । श्रीकृष्णार्पणदक्षायाः कार्ष्ण्याः श्रीबद्रिके
    स्वकम् ॥ १६२॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः तिष्यसन्तानात्मकस्य चतुर्थखण्डे १२०
