id: mahabodhibhattarakastotram
category: stotram
name:
  english: mahabodhibhattarakastotram
  devanagari: महाबोधिभट्टारकस्तोत्रम्
content:
  english: mahabodhibhattarakastotram om namah shakyasimhaya | siddham prasiddham vijitamaram ca shantam
    viragam suvishuddhashilam | vishveshvaram sarvagunakaram vai shrishakyasimham pranamami nityam ||
    1|| chatrabhashirsham varanilakesham cornasushobham hi mahalalatam | nilotpalabham nayanam vishalam
    shrishakyasimham pranamami nityam || 2|| uttunganasam bharapinagandam bimbaushthakalpam mrigarajavakshasam
    | uttaptahemabhasuvarnavarnam shrishakyasimham pranamami nityam || 3|| payodhakosham shubhakarnashobham
    gandastrirekhavaracailabhusham | prajanubahum dvipanasakalpam shrishakyasimham pranamami nityam ||
    4|| vicitrapushpairnarayakshamanam shrivatsabhadradviganopayuktam | ashitisuvyanjanagatrashobham shrishakyasimham
    pranamami nityam || 5|| shastaramagryam naraviraviram mayasutam karunikam jinendram | shauddhodanim
    lokavidam munindram shrishakyasimham pranamami nityam || 6|| cakrankapanim navapallavabham mattebhalilagamanam
    virajam | devasurairvanditapadayugmam shrishakyasimham pranamami nityam || 7|| traiduhkhaduhkhad bhayavedilokan
    tranam ca nitum varabodhimatraih | jihva ca mattehi sucakshu sarvam shrishakyasimham pranamami nityam
    || 8|| iti mahabodhibhattarakastotram sampurnam ||
  devanagari: महाबोधिभट्टारकस्तोत्रम् ॐ नमः शाक्यसिंहाय । सिद्धं प्रसिद्धं विजितामरं च शान्तं विरागं सुविशुद्धशीलम्
    । विश्वेश्वरं सर्वगुणाकरं वै श्रीशाक्यसिंहं प्रणमामि नित्यम् ॥ १॥ छत्राभशीर्षं वरनीलकेशं चोर्णासुशोभं
    हि महाललाटम् । नीलोत्पलाभं नयनं विशालं श्रीशाक्यसिंहं प्रणमामि नित्यम् ॥ २॥ उत्तुङ्गनासं भरपीनगण्डं
    बिम्बौष्ठकल्पं मृगराजवक्षसम् । उत्तप्तहेमाभसुवर्णवर्णं श्रीशाक्यसिंहं प्रणमामि नित्यम् ॥ ३॥ पायोधकोषं
    शुभकर्णशोभं गण्डस्त्रिरेखावरचैलभूषम् । प्राजानुबाहुं द्विपनासकल्पं श्रीशाक्यसिंहं प्रणमामि नित्यम्
    ॥ ४॥ विचित्रपुष्पैर्नरयाक्षमानं श्रीवत्सभद्रद्विगणोपयुक्तम् । अशीतिसुव्यञ्जनगात्रशोभं श्रीशाक्यसिंहं
    प्रणमामि नित्यम् ॥ ५॥ शास्तारमग्र्यं नरवीरवीरं मायासुतं कारुणिकं जिनेन्द्रम् । शौद्धोदनिं लोकविदं
    मुनीन्द्रं श्रीशाक्यसिंहं प्रणमामि नित्यम् ॥ ६॥ चक्राङ्कपाणिं नवपल्लवाभं मत्तेभलीलागमनं विराजम् ।
    देवासुरैर्वन्दितपादयुग्मं श्रीशाक्यसिंहं प्रणमामि नित्यम् ॥ ७॥ त्रैदुःखदुःखाद् भयवेदिलोकान् त्राणं
    च नीतुं वरबोधिमात्रैः । जिह्वा च मत्तेहि सुचक्षु सर्वं श्रीशाक्यसिंहं प्रणमामि नित्यम् ॥ ८॥ इति महाबोधिभट्टारकस्तोत्रं
    सम्पूर्णम् ॥
