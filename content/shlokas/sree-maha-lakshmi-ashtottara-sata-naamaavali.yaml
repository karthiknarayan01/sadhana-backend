    namah om prasadabhimukhyai namah om prabhayai namah om candravadanayai namah om candrayai namah om
    candrasahodaryai namah om caturbhujayai namah om candrarupayai namah om indirayai namah om indushitalayai
    namah om ahladajananyai namah om pushtyai namah om shivayai namah om shivakaryai namah om satyai namah
    om vimalayai namah om vishvajananyai namah om tushtaye namah om daridryanashinyai namah om pritipushkarinyai
    namah om shantayai namah om shuklamalyambarayai namah om shriyai namah om bhaskaryai namah om bilvanilayayai
    namah om vararohayai namah om yashasvinyai namah om vasundharayai namah om udarangayai namah om harinyai
    namah om hemamalinyai namah om dhanadhanya karyai namah om siddhaye namah om strainasaumyayai namah
    om shubhapradayai namah om nripaveshmagatayai namah om nandayai namah om varalakshmyai namah om vasupradayai
    namah om shubhayai namah om hiranyaprakarayai namah om samudra tanayayai namah om jayayai namah om
