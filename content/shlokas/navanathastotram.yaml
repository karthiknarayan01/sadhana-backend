id: navanathastotram
category: stotram
name:
  english: navanathastotram
  devanagari: नवनाथस्तोत्रम्
content:
  english: svattvojjhitanapi paramparayopadeshtum | tattvam vimuktaya utakrita yogashastramadesha etu
    mama tatra ya adinathah || 2|| yo hyadinatha uta raghavamatsyajanma matsyendranatha iti yogakabhogavrittih
    | vismapayannakhilasiddhasuramshca jata adesha etu mama tatra pavitra murto || 3|| yo hyadinatha uta
    bhogabharam vihaya yogam satattvamudaya kramato ninaya | namna shruto'styudayanatha iti shritashriradesha
    etu mama tatra pavitramurto || 4|| yashcapyanekabhavabhutaganan kripatah patvatipiditahridah kila
    kaladandat | taddurlabhamarapadah sa sukham ninaya yaddandanatha iti siddhaganaprasiddhah i || 5||
    atmanameva sakalebhya upadidesha
  devanagari: स्वत्त्वोज्झितानपि परम्परयोपदेष्टुम् । तत्त्वं विमुक्तय उताकृत योगशास्त्रमादेश एतु मम तत्र
    य आदिनाथः ॥ २॥ यो ह्यादिनाथ उत राघवमत्स्यजन्मा मत्स्येन्द्रनाथ इति योगकभोगवृत्तिः । विस्मापयन्नखिलसिद्धसुरांश्च
    जात आदेश एतु मम तत्र पवित्र मूर्तो ॥ ३॥ यो ह्यादिनाथ उत भोगभरं विहाय योगं सतत्त्वमुदय क्रमतो निनाय
    । नाम्ना श्रुतोऽस्त्युदयनाथ इति श्रितश्रीरादेश एतु मम तत्र पवित्रमूर्तो ॥ ४॥ यश्चाप्यनेकभवभूतगणान्
    कृपातः पात्वातिपीडितहृदः किल कालदण्डात् । तद्दुर्लभामरपदः स सुखं निनाय यद्दण्डनाथ इति सिद्धगणप्रसिद्धः
    ई ॥ ५॥ आत्मानमेव सकलेभ्य उपादिदेशा
meaning: {}
