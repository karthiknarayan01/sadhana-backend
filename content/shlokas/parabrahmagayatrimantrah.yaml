id: parabrahmagayatrimantrah
category: mantra
name:
  english: parabrahmagayatrimantrah
  devanagari: परब्रह्मगायत्रीमन्त्रः
content:
  english: parabrahmasiddhayarthe jape viniyogah | atha rishyadinyasah | om sadashivarishaye namah shirasi
    | om anushtupchandase namah mukhe | om parabrahmadevatayai namah hridi | om viniyogaya namah sarvange
    || atha shadanganyasah | om saccidbrahmane hridayaya namah | om saccidbrahmane shirase svaha | om
    saccidbrahmane shikhayai vashat | om saccidbrahmane kavacaya hum | om saccidbrahmane netratrayaya
    vaushat | om saccidbrahmane astraya phat || atha varnanyasah | om sah hridayaya namah | om cchih shirase
    svaha | om dbrah shikhayai vashat | om hmah kavacaya hum | om nem netratrayaya vaushat | om om astraya
    phat ||
  devanagari: परब्रह्मसिद्धयर्थे जपे विनियोगः । अथ ऋष्यादिन्यासः । ॐ सदाशिवऋषये नमः शिरसि । ॐ अनुष्टुप्छन्दसे
    नमः मुखे । ॐ परब्रह्मदेवतायै नमः हृदि । ॐ विनियोगाय नमः सर्वाङ्गे ॥ अथ षडङ्गन्यासः । ॐ सच्चिद्ब्रह्मणे
    हृदयाय नमः । ॐ सच्चिद्ब्रह्मणे शिरसे स्वाहा । ॐ सच्चिद्ब्रह्मणे शिखायै वषट् । ॐ सच्चिद्ब्रह्मणे कवचाय
    हुम् । ॐ सच्चिद्ब्रह्मणे नेत्रत्रयाय वौषट् । ॐ सच्चिद्ब्रह्मणे अस्त्राय फट् ॥ अथ वर्णन्यासः । ॐ सः
    हृदयाय नमः । ॐ च्छिः शिरसे स्वाहा । ॐ द्ब्रः शिखायै वषट् । ॐ ह्मः कवचाय हुम् । ॐ णें नेत्रत्रयाय वौषट्
    । ॐ ॐ अस्त्राय फट् ॥
meaning: {}
