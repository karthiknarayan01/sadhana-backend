id: krishnacaitanyacandrasahasranamastotram-3-2
category: sahasranama
name:
  english: krishnacaitanyacandrasahasranamastotram 3
  devanagari: कृष्णचैतन्यचन्द्रसहस्रनामस्तोत्रम् ३
content:
  english: shrikrishnacaitanyacandrasahasranamastotram 3 krishnavarnam tvishakrishnam sangopangastraparshadam
    | yajnaih sankirtanaprayairyajanti hi sumedhasah || 1|| tam natva krishnacaitanyam sangopangam jagadgurum
    | divyanamnam sahasrena samstaumi parameshvaram || 2|| aishvaryanamani | shadaishvaryo brahmakantih
    purushamshi svayamharih | saccidanandashaktishca saccidanandavigrahah || 3|| sarvagah sarvavidyogi
    mahajnani mahavibhuh | sarvottamah sarvagatah sarvabhutaguhashayah || 4|| sarvatma sarvasakshi ca
    sarvadevanamaskritah | samsarashvatthabijancashvatthamulanikrintakah || 5|| puranapurusho'vyaktah
    sadakhyah sadasatparah | shuddhah pranavavacyashca ksharaksharaparo varah || 6|| aksharo nirvikarashca
    niriho nirupadhikah | niranjano nityanityah sarvakalyanavigrahah || 7|| bhagavan bhagaha bhargo bhavatrata'khileshvarah
    || shivah shivaprado vishnuh prabhavishnuranamayah || 8|| mukundo muktibijanca mukto muktipatirharih
    | sahasrakhyah sahasraksho bahupanih sahasrapat || 9|| sahasrashirsha sahasrajanmadhrik sarvatomukhah
    | trayyatma trayyantavedyastridashadistrikheshvarah || 10|| jitarishca jitakrodhah shatruha shatrutapanah
    | vaikunthanatho lokesho bhaktabhimatarupadhrik || 11|| narayano narasakhah shasta bhuvanapalanah
    | nirashrayo niradharah sarvadharo jagatpatih || 12|| kutastho'kutadarshi ca mayesho mayinamvarah
    | varenyo varado varyo varishtho bhayanashanah || 13|| sarvanama sarvarupo namarupadikaranam | hiranyakesho
    rukmango rukmamali hiranmayah || 14|| uttripadekapadekarupashca bahurupakah | asharirah shariri ca
    agrahyah shashvatah svayam || 15|| vaibhavah prabhavomshi ca vilasi svaprakashakah | prakashi ca tadekatmarupi
    svamshyaparajitah || 16|| jnanasadhyo bhaktisadhyo yogasadhyo narakritih | bhinno'bhinnashca sanmatram
    madhuro madhurashrayah || 17|| trimurtishca caturmurtishcaturvarnacaturgatih | akaranah karananca
    sarvakaranakaranam || 18|| advaito'dvaitarupashca srishtisthitilayeshvarah | cidvibhutirmahayogi bhaktaradhyah
    parashrayah || 19|| sarvaradhyah pararadhyo'naradhyo vishvabhavanah | paravyomordhvanilayah kripalugururvigrahah
    || 20|| srashta pata ca samharta'nantashrih purushottamah | atyacaryah punyalilo nigunah sagunah svarat
    || 21|| caturvimshatimurtishca dashamurtiranantakah | akalah kalakalashca channo'cchanno vibhutipah
    || 22|| anadiradih kshetrajno hyamayi mayinam priyah | shrotavyah paramatmamshi tryantaryami mahaprabhuh
    || 23|| brahmabho brahmakirano brahmayonistadashrayah | catushcatuhkalapadah sarvaspadapado gatih
    || 24|| sarvavatari sarvashrih sarvadivyavibhutidhrik | gunasangi gunatito gamyo'gamyo mahamanah ||
    25|| ityaishvaryanamani | adililanamani | balaliladharavaro dvyekamurtigunashrayah | shacigarbhodadhishayah
    svayamavihkalevarah || 26|| brajendranandanah shriman radhikapranavallabhah | dvaparodupatih krishno
    madhuryarasanayakah || 27|| antah krishno bahirgauaurah kalitrata shubhashrayah | advaitamantrito'dvaitanito'dvaitapriyaprabhuh
    || 2|| jagannathatmajo brahmasuto brahmakulambujah | shacisunuh shacinandih shacigarbhodajah parah
    || 29|| navadvipodayah purnodayashcandragrahodayah | pragvasantodayah phalgunyudayo mangalodayah ||
    30|| namasankirtanapritirnamasankirtanodayah gaudacandro gaudanatho gauro godrumacandramah || 31||
    caitanyah krishnacaitanyah svayankrishno rasatmakah | trisukhasvadako radhabhavo radhadyutigrahah
    || 32|| sangopangavatirnashca trisrotastirasambhavah | kalisandhyavatarashca triyugastridiveshvarah
    || 33|| vishvarupanujah shantah shubharkshagrahatarakah | shubhankitapadambhojah shubhankitakarambujah
    || 34|| dvatrishallakshanopeto mahapurushalakshanah | ajanulambitabhujo'ntarbhujah shubhavigrahah
    || 35|| vishvambharah sudivyashrirnamakrandanasamvarah | tyaktamritstanyapayi ca matripitrisukhapradah
    || 36|| atithyannatribhoji ca atithitranakarakah | kanyanaivedyabhokta ca kanyabhishtavarapradah ||
    37|| capalashca chalagrahi capalyasukhadayakah | lakshmisandarshanahlado lakshmisrakcandanarcitah
    || 38|| matrijnanapradata ca matrajnapratipalakah | divyalokagamagrihah shunyapannupuradhvanih ||
    39|| ashcaryabalyalilashca adbhutapriyadarshanah | balakanandadata ca balakapranavallabhah || 40||
    pitrivakyanuvarti ca matrivakyanuvartyapi | sarvanandananrityashca krishnalila'nukarakah || 41|| krishnavadbalyalilashca
    grihabhandadibhedakah | vidyabhyasarato'dhyeta pathadakshah supathakah || 42|| antevasyapranirgangadasashishyah
    kavih sudhih | pitrisantoshakah pitribhak mahayashah || 43|| pitriyajnavidheyatma dharmikah pitriyajnakrit
    | punyavan punyakirtishca punyashlokah supunyadah || 44|| udvahasaktacittashca garhasthyadharmavasanah
    | shripatirmadhavo lakshmipatih shrirukminipatih || 45|| shridharah shrinivasashca shrinatho janakipatih
    | kishoro rasarajashca madanojjvalavigrahah || 46|| manoharangapratyangastaptakancanavigrahah | kotisuryaprabhah
    kotimrigankasnigdhashitalah || 47|| kotikandarpalavanyah kotigishpatibhashanah | vidvatpriyo vavadukah
    satyavadi jitendriyah || 48|| vipashvicchabdiko vidvan sarvashastravisharadah | adhyapako mahamanyo
    bahushishyasamanvitah || 49|| sadvyakhyakarako vadi vadijid vinayi budhah | jalakeliratah krishnajalakelyanukarakah
    || 50|| tapanadvaidhasancchetta sadhyasadhanabodhadah | vangatano vangahitah vange namapracarakah
    || 51|| vangoddharta vangagururvangamangalanashanah | gaudanando gauda bandhurgaudavasijanapriyah
    || 52|| vishnupriyapati radhapatirdigvijayistatah | jitasanmanado digvijayibandhanakhandanah || 53||
    yuva yauvanakarma ca divyasrakacandanojjvalah | divyavaso divyamurtirdivyasadratnabhushanah || 54||
    kotikandarpasaundaryah koticandranibhananah | kotivagdevatavanih kotidevejyabuddhiman || 55|| panditadhyapako
    mani yatto yauvanaveshadhrik | nariganamanashcandro bhavanila rujadharah || 56|| premadah premamattashca
    gayagah pitrikarmakrit | ishvarapriyashishyashca dikshitah premavihvalah || 57|| jananipremadata ca
    jananipremavardhanah | advaitacaryamilito'dvaitavishvatmadarshakah || 58|| shrishrivasabhishiktashca
    mahaishvaryaprakashakah | svarupamilito nityanandashadbhujadarshakah || 59|| shankhacakragadapadmasharngavenudharo'bhayah
    dvicakravenuhastashca sudivyaishvaryavigrahah || 60|| muralivadano vamshivadano muralidharah | shadbhujashca
    bahubhujo dvibhujashca caturbhujah || 61|| shyamalah shyamalangashca shyamashrih shyamasundarah |
    varapitambaradharo balakrishnadvimurtidhrik || 62|| ambashtadvimurtishca madhurapriyavigrahah | pashandayugalatrata
    pashandayugalaghahrit || 63|| asaptayamabhavastha aveshambudhisamsthitah | varahabhavaveshashca murariskandhanartakah
    || 64|| shuklambarattandulabhun namashlokasadarthakrit | vaishnavacarasantushtah svapadyacarashikshakah
    || 65|| shrivasanganavarshaikaratrikirtanakarakah | namavighnashamopayo guptakirtanakarakah || 66||
    dushtagopalacapalakrimikushthavidhayakah | vyadhipiditagopalacapaladvijasamstutah || 67|| dushtagopalacapalaparadhatyantasheshakrit
    | mukundadattadandanugrahodvaitaryabhaktikrit || 68|| bhaktyadvaitatushtido'vajnanadvaitaprasadakrit
    | shridharayasapatrasthajalapanaparayanah || 69|| bhakteshtavaradata ca haridasaprasadakah | acaryasammukhambaparadhasamparikhandakah
    || 70|| namarthavadisantyagi namamahatmyavarnakah | bhakteshu namamahatmyashravako bhaktatoshakah
    || 71|| guptabhale ramadasabhidhanalipikarakah | sadyashca totpadakashca sagananraphalashanah || 72||
    nityacutotsava meghavighnanivarakah | guptalolo naikalilo bhakte lilapradarshakah || 73|| sahasranamasamshrota
    nrisimhaveshavigrahah | tejomayashcandamurtirjanadravanarupadhrik || 74|| shivasangitasamshrota shivaveshishabhavavrik
    | shaivaskandhanato bhikshunartakapremavardhakah || 75|| jijnasurganakaprashta jyotirvidganitagatah
    | jyotirviddhyanago jyotirvettrivismayakarakah || 76|| jyotirviduktiyathatmyah paripurno mahavibhuh
    | sarvaishvaryamayo nityanandarupo mahashrayah || 77|| kalidvaparekarupo durvijneyashca sarvavit |
    paratattvam parabrahma pareshah parameshvarah || 78|| sunarma purvavakta ca gopajatishca gopajah |
    gocarako gavamsevi purvapunyaphalagryajah || 79|| jyotirvit tranakarta ca balaveshi balanukrit | madhvopsurmadhupanepsurmadhvanayanashasanah
    || 80|| patrasthagangambupayi panavihvalanrityakrit | yamunakarshakarica madamattaskhaladgatih ||
    81|| suvarnalangaladharah sakshacchriramavigrahah | sagananandanrityashca acaturyamanartakah || 82||
    harisankirtanadesho gramasankirtanotsukah | turushkadandado mlecchadhyakshavighnavinashakah || 83||
    mlecchanugrahakarta ca mlecchashastrapradushakah | gohito gopatirgobhrid govindo gohite ratah || 84||
    mlecchaprasadako namakirtanapratibandhaha | shrivasavatsalah premna putrashokapanodanah || 85|| shrivasanandano
    bhaktavarado bhaktatoshanah | svabhuktocchishtado narayanisammanakarakah || 86|| shrivasasivakapritah
    sivakasvatmadarshakah | premabhaktaganasangi premaveshi priyashravah || 37|| gopibhavanuragi ca gopinamaparayanah
    | agaskrittranahridayah samnyasakaranotsukah || 88|| nyasibhikshapradata ca trisangi puratirthagah
    | bharatikritasamnyasastratrisannyasarupadhrik || 89|| dandi dandadharo nyasi samnyasi ca tridandadhrik
    | samnyasakricchamah shanto nishtha shantih parayanam || 90|| shubhangah shantidah pujyo brahmasammanadayakah
    | kritagobrahmanatrata samnyasijnanadayakah || 91|| turyashramyashramatito vidvadbrahmanamaskritah
    | nyasicudamanirnyasiharibhaktipradayakah || 92|| advaitadhvantavidhvamsi bhaktipankajabhaskarah |
    caturvarnanamasyashca caturashramapujitah || 93|| iti adililanamani | madhyalilanamani | shrivrindavanagah
    premavihvalo bahyavismritih | radhabhumibhramo gangayamunabhavadarshanah || 94|| acaryagrihabhikshakrinnishakirtanakarakah
    matradisarvamilano niladrigamanotsukah || 95|| devatapratimadarshi liladarshi janapriyah | madhavakhyanasamshrota
    vigrahakhyanakashravah || 96|| bhagnadandah shuddhatanurekaki ca nirashrami | darubrahmasamipastho
    daruvigrahadarshakah || 97|| jagannathadashajnano bhavasindhupralinadhih | sarvabhaumadhiraprasadakah
    dirghakalanucetanah || 98|| nityanandanumilano jagadanandavikshitah | mukundamilanah sarvabhaumadhiragrasadhakah
    || 99|| karunasagarah sarvabhaumaishvaryatmadarshakah | avacitirthaganta ca vaishnavaprananayakah
    || 100|| vasudevavyadhiharo ji vasudevamritapradah | nrisimhastota krishnanamapravartanah || 101||
    praptagodavaritiro vanavrindavanabhramah | ramanandasammilano ramanandasusamstutah || 102|| ramanandadalapo
    ramanandaprasadakrit | sadhyasadhanatattvajnah sadhyasadhanapricchakah || 103|| ramanandahridammbhojasarvatattvaprabhakarah
    | ramanandottarashrota ramanandavashikritah || 104|| ramanandaghanashyamagauramurtipradarshakah vidyapurajanatrata
    abhaktajanabhaktakrit || 105|| tirthikrittirthagastirthi sattirthastirthapavanah | tirthasnayi tirthadarshi
    traividhyajanabhaktakrit || 106|| mallikarjunabhuteshadarshi shaiveshtabhaktakrit | dasaramamahadevadarshi
    vaishnavakarakah || 107|| trimallatripadidarshi pashandidalanotsukah | shrivaishnavatattvavadikrishnabhaktipradayakah
    || 108|| ahobalanrisimhadivishnuvigrahadarshakah | shrisiddhavataganta ca shrisitapatidarshakah ||
    109|| ramanamajapadviprakrishnanamapravartakah skandakshetraskandadarshi shritrivikramadarshakah ||
    110|| vriddhakashishivaloki bahuviprapuragamah | bhaktishastri sutejasvi asacchastranikrintanah ||
    111|| garvigarvaharogarvi garvi ca sarvagarvaha | darpaha darpado dripto jayi jeta jayapradah || 112||
    pashandanigraho mayavadasiddhantakhandakah | bauddhacaryajayi bauddhamatakhandanakarakah || 113||
    buddhamshi buddhiman buddhavatari bauddhanigrahah | bauddhanugrahako bauddhatrata ca bauddhajivanah
    || 114|| venkateshvaradarshi ca bahutirthatanotsukah | shivakancigamah shaivashaktavaishnavakarakah
    || 115|| vishnukancigamah shrimadvishnustutiparayanah | krishnabhaktiprado ranganathadarshi sadashrayah
    || 116|| rangakshetravasi ca venkatapriyakritsukhah | bhattasamshayacchetta krishnatattvopadeshakah
    || 117|| bhaktapathashravanandi bhaktapathakashikshakah | vipravishvasadata ca sitatattvopadeshakah
    || 118|| viprajivanasamraksho bhaktavipraparishtutah | anekadakshinatatashcanekatirthadarshanah ||
    119|| krishnadasasamuddharta bhattamarijanardanah | shribrahmasamhitacyayalabhakrid vaishnavadritah
    || 120|| madhvagarvakharvakarah karmajnanapradushakah | svargapavarganarakatulyajnapaka artiha ||
    121|| shankararanyasantyasibhrata shrirangasaukhyadah | krishnakarnamritasvadi shrikarnamritalabhakrit
    || 122|| saptatalaparishvangah saptatalavimocanah | ramavataravikhyatih kashimishraprasadakrit ||
    123|| kashimishrarpitapranadhanagehapadambujah | kashimishrashadaishvaryapurnavigrahadarshakah ||
    124|| bhaktatmado bhaktasangi bhaktapyo bhaktajivanah | shrimadvishnuprasadashi prasadagunavarnakah
    || 125|| nilacalajananandi nilacalajanapriyah | bhavanandeshvaro vaninathasevyo varapradah || 126||
    svarupanandado bhrityagovindakritasevanah | brahmanandabahirvasapradata veshashodhakah || 127|| shunyadhyanatiraskarta
    krishnaikadhyanasiddhidah | vidhiheyopadeshta ca ragamargopadeshakah || 128|| svavargamilano bhaktapremalinganatatparah
    | amani manado manyah amanijanamanadah || 129|| advaitapremasamshlesho vasudevapramodakah | jagadanandakarunyah
    shankarasnehakarakah || 130|| shrivasapritidah pritah shrivasasnehabhashanah | shivanandanuragi ca
    murarindehamarjakah || 131|| vakreshvarapritamana narayanaparapriyah | shrimatpanditasamhlado budharaghavasupriyah
    || 132|| vasumadhavagovindaghoshakirtanasupriyah | shuklambarapremadah shrikantanarayanapriyah ||
    133|| shrinaravijayarhah shrinrisimhanandanandadah | vallabhasenasukhadah purushottamanandadah ||
    134|| sanjayanandadah satyarajakhanakripakarah | ramanandavasuprito mukundadasasupriyah || 135|| shriraghunandanapritah
    shrimannaraharipriyah | khandavasiciranjivadasyadah svajanapriyah || 136|| sulocanapriyo bhaktashleshah
    atmaratipradah | acaryaratnagunago vidyanidhigunagrahah || 137|| vinayi vinayasakto haridasaparapritih
    | haridasaparapritih prasadapariveshanah || 139|| sabhaktaganasamnyasiprasadannadibhakshakah mahanrityo
    mahaprema sankirtanamahojjvalah || 140|| nilacalajananandadata kritamahotsavah | prasadavantako divyalilakari
    sukhapradah || 141|| svatantrah prematantrashca bhaktatantrah sadagranih | nripanandasantoshi shrimanmandiramarjakah
    || 142|| shrisimhasanasamskari samskarakaryamshikshakah | sankaddandanrityakari satvikacihnavrik ||
    143|| bhukampakaranrityashca gopalacetanapradah | bhokta bhojayita shakapriyo'tyuttamabhojyabhuk ||
    144|| jagadanandasantoshi bhaktopahritibhakshakah | rathasthavishnusandrashta rathayatramahotsavi
    || 145|| vaishnavabhraghatanando namashrujalavarshah | uddandanrityakari ca divyatsattvikalakshanah
    || 143|| yugapaddalasandarshi yugapaddalasaptagah | lilavivartabhavajno lalasashlokapathakah || 147||
    prataparudrakarunah sthirasyandanacalakah | indradyumnajalakrido'dvaitasheshashayeshayah || 148||
    sundaracalaganta ca rasatattva sukhashravah | damodarasahalapah shrivasavarnanashravah || 149|| shriradhayogunashrota
    radhikapremavihvalah | vasusatyadeshakaro vasusatyakripakarah || 150|| pujasheshatulasyadyadvaitacaryaprapujakah
    | mukhavadyakaro'dvaitabhikshanityanimantritah || 151|| gopaveshadharah krishnajanmaghasramahotsavi
    | sanityanandalagudacalako vijayotsavi || 152|| hanumatparamasho rasadipotsavadika | svabhaktasammanayita
    maparadhakshamapanah || 153|| bhuktannajnapakah krishnaprananathapadapriyah | gunarajativina vasusatyopadeshakah
    || 154|| bhaktacihnepadeshta ca namamahatmyavarnakah | shrinaraharisantushtah sarvabhaumopadeshakah
    || 155|| vacaspatyupadeshta ca shrimurariparikshakah | vasudevagunakrishto vaishnavaprananayakah ||
    156|| svabhaktagunavakta ca bhaktanugrahakatarah | gadadharagunakrishto bhaktavicchedakatarah || 157||
    puryadisahasamvasi sarvabhaumanurodhabhrit | bhattabhikshanumodi ca pracurannadibhojakah || 158||
    amoghagahkshamo'moghaparadhaparibhanjanah | amoghapranado'moghanijabhaktipradayakah || 159|| bhaktecchapurako
    gaudagaurabhaktanumishranah | prataparudrasantrata mleccharajaprasadakrit || 160|| navikanugrahakashca
    kuliyagramatarakah | dushtagopalacapalakrimikushtanivarakah || 161|| advaitalayaganta ca shaciduhkhantakarakah
    | shacidarshanadata ca shacipritivivardhanah || 162|| rupasanatanagrahi raghunathakripakarah | balabhadraikarthashca
    himsrasevyapathakramah || 163|| vyaghradimadhyaganta ca pashukirtanakarakah | mrigasangi mrigasakho
    himsrahimsraikavartanah || 164|| mayuradyanusangashca tiryakkautukadarshakah | nrityagitanandagatih
    praphulladrulatadhvanih || 165|| jangamajangamanandadata vanagatipriyah | mahanandanago vanyakandashakaphalapriyah
    || 166|| vanamargasukhasvadi vanagramisubhaktidah | varanasitirthagashca tapanatisukhapradah || 167||
    shrimanikarnikasnayi shrivishveshvaradarshakah | bindumadhavasandarshi tapanalayapavanah || 168||
    candrashekharasampujyo bhiksharthabrahmavancakah | krishnaparadhyadrishtashca mayavadividambakah ||
    169|| prayagatirthasnayi ca venimadhavadarshakah | mathuranagaridarshi mathurapranamaskarahh || 170||
    vishramatirthasusnayi shrimatkeshavadarshakah | purishishyanumilitah purishishyapratoshakah || 171||
    yamunadvadashayugatirthasnanaparayanah gokarnadikadarshi ca viprasangi vanabhrami || 172|| goghataveshtito
    go'ngasevi mrigaganadritah | pikadigiyamanashca shikhinrityapradarshitah || 173|| caruphullalatagulmasevitashripadambujah
    | vrikshagulmalatashleshi sharishukapadyashravah || 174|| shashvatpremavishtacitto radhakundaishanonmukhah
    | luptakundodakasnayi shrigovardhanadarshakah || 175|| giripradakshinakarah shailagopaladarshakah
    | sarvakunda jalasnayi rasamandaladarshakah || 176|| pracinatintidivrikshatalavishramakarakah | krishnadasagunakrishtah
    krishnadasakripakarah || 177|| nirvisheshadvayabrahmavadavadanirasakrit sabhrityamlecchasantrata shrirupavallabhangikrit
    || 178|| shrirupashaktisancarah shrirupabhaktishikshakah | shantadirasatattvajnah shantadirasavarnakah
    || 179|| madhuryatipriyah premabhaktitattvopadeshakah | sanatananukampashca sanatanasushikshakah ||
    180|| nihsimakarunapurnah sarvatattvaprakashakah | shuddhavairagyadata ca nijabhaktavishodhakah ||
    181|| sanatanaguruh sarvashastrasiddhantakarakah | sanatanadeshakaro nijabhakteshtasiddhidah || 182||
    nyasyantardravakrinmayavadibhaktipradayakah | sutramukhyarthakarta ca prakashanandabhaktidah || 183||
    prakashanandasantrata kashinistarakarakah | subuddhitarakah kashivasivaishnavakarakah || 184|| iti
    madhyalilanamani | antyalilanamani shivanandanastrata rupanatakasamshravah | bhaktavesho bhaktadhamavirbhavo
    nakulantarah || 185|| pradyumnabhaktavirbhavah shivanandaprabodhanah | shivanandadvaidhaharo haridasasudandadah
    || 186|| haridasaprasadashca chalasvajanashikshakah | bhaktavakyadandasaho matrisantoshadayakah ||
    187|| svabhaktat svagunashrota svabhaktagunabhashakah | samarpitasvabhaktango bhaktajivanarakshakah
    || 188|| sanatanadeshadashca bhaktangamilanagrahah | svabhaktalalako bhaktavapurnirmalakarakah ||
    189|| luptatirthoddharayita raghunathaprasadadah | raghavanandadata ca raghunathaghakhandanah || 190||
    raghunathopadeshta ca bhattagarvavikhandanah | putahridvallabhadayo dara bhattadainyasusamstutah ||
    191|| gadadharaprananatho jagadanandacapalah | bhavanandatmajatrata munyadidrishtavigrahah || 192||
    nityanandadimilito narendrajalakhelanah | damayantiratagrahi odragitanumodanah || 193|| bhrityartiha
    bhrityapalo bhrityadoshanumodanah | bhrityasevatisantushta bhrityagovindasevitah || 194|| haridasokramonmado
    haridasantyakarmakrit | haridasotsavanando haridasaprasadakrit || 195|| shivanandamahanandah raghunathadayakarah
    | shrikrishnavirahonmado gopiva virahaturah || 196|| premadbhutavikarashca kalidasamahakripah | puridasanukampashca
    kurmango goshthabhavanah || 197|| matribhaktagraganyashca matritoshanatatparah | samudravaripatano
    dhivarapremadayakah || 198|| vrishabhanusutavesho divyonmadapradarshanah | krishnangasaurabhaghrata
    krishnadarshanalalasah || 199|| svashlokartharasasvadi bahyacakshuradarshanah | bhaktadarshanado divyadhamastho
    divyadarshanah || 200|| sarvaparadhashamano bhaktahritkamalasthitah | anantadityasankashah svapadambujadasyadah
    || 201|| smritasarvaghashamanah kirtitapremabhaktidah | harisankirtanarambhapremanamabhikirtanah ||
    202|| paramparabhaktaganapremabhaktipravardhanah | akalipremanamabhikirtanah sattvikapriyah || 203||
    sankirtanamahayajnairyajyo'paryaptavarnanah || 204|| ityantyalilanamani | etat sahasranamnam ca shricaitanyaparatmanah
    | yah pathet prayato bhutva sa param padamapnuyat || 205|| muktah sarvaparadhebhyah premabhaktiyuto
    bhavet | dehante krishnacaitanyasmritirbhavati shashvati || 206|| phalgunyamarcayitva ya ekavrittya
    pathejjanah | yadyat kamayate kamam labhate tadayatnatah || 207|| namasankirtanam yasya premabhaktivivardhanam
    | puja ca dasyada tasya tam shrigauramaham bhaje || 208|| krishnaya gauravarnaya haraye rasarupine
    | haribhaktasharanyaya premadaya namo namah || 209|| iti shricaitanyadasaciranjivisarvadhikari
  devanagari: श्रीकृष्णचैतन्यचन्द्रसहस्रनामस्तोत्रम् ३ कृष्णवर्णं त्विषाकृष्णं साङ्गोपाङ्गास्त्रपार्षदम्
    । यज्ञैः सङ्कीर्तनप्रायैर्यजन्ति हि सुमेधसः ॥ १॥ तं नत्वा कृष्णचैतन्यं साङ्गोपाङ्गं जगद्गुरुम् । दिव्यनाम्नां
    सहस्रेण संस्तौमि परमेश्वरम् ॥ २॥ ऐश्वर्यनामानि । षडैश्वर्यो ब्रह्मकान्तिः पुरुषांशी स्वयंहरिः । सच्चिदानन्दशक्तिश्च
    सच्चिदानन्दविग्रहः ॥ ३॥ सर्वगः सर्वविद्योगी महाज्ञानी महाविभुः । सर्वोत्तमः सर्वगतः सर्वभूतगुहाशयः
    ॥ ४॥ सर्वात्मा सर्वसाक्षी च सर्वदेवनमस्कृतः । संसाराश्वत्थबीजञ्चाश्वत्थमूलनिकृन्तकः ॥ ५॥ पुराणपुरुषोऽव्यक्तः
    सदाख्यः सदसत्परः । शुद्धः प्रणववाच्यश्च क्षराक्षरपरो वरः ॥ ६॥ अक्षरो निर्विकारश्च निरीहो निरुपाधिकः
    । निरञ्जनो नित्यनित्यः सर्वकल्याणविग्रहः ॥ ७॥ भगवान् भगहा भर्गो भवत्राताऽखिलेश्वरः ॥ शिवः शिवप्रदो
    विष्णुः प्रभविष्णुरनामयः ॥ ८॥ मुकुन्दो मुक्तिबीजञ्च मुक्तो मुक्तिपतिर्हरिः । सहस्राख्यः सहस्राक्षो
    बहुपाणिः सहस्रपात् ॥ ९॥ सहस्रशीर्षा साहस्रजन्मधृक् सर्वतोमुखः । त्रय्यात्मा त्रय्यन्तवेद्यस्त्रिदशादिस्त्रिखेश्वरः
    ॥ १०॥ जितारिश्च जितक्रोधः शत्रुहा शत्रुतापनः । वैकुण्ठनाथो लोकेशो भक्ताभिमतरूपधृक् ॥ ११॥ नारायणो नरसखः
    शास्ता भुवनपालनः । निराश्रयो निराधारः सर्वाधारो जगत्पतिः ॥ १२॥ कूटस्थोऽकूटदर्शी च मायेशो मायिनांवरः
    । वरेण्यो वरदो वर्यो वरिष्ठो भयनाशनः ॥ १३॥ सर्वनामा सर्वरूपो नामरूपादिकारणम् । हिरण्यकेशो रुक्माङ्गो
    रुक्ममाली हिरण्मयः ॥ १४॥ उत्त्रिपादेकपादेकरूपश्च बहुरूपकः । अशरीरः शरीरी च अग्राह्यः शाश्वतः स्वयम्
    ॥ १५॥ वैभवः प्राभवोंशी च विलासी स्वप्रकाशकः । प्रकाशी च तदेकात्मरूपी स्वांश्यपराजितः ॥ १६॥ ज्ञानासाध्यो
    भक्तिसाध्यो योगासाध्यो नराकृतिः । भिन्नोऽभिन्नश्च सन्मात्रं मधुरो मधुराश्रयः ॥ १७॥ त्रिमूर्तिश्च चतुर्मूर्तिश्चतुर्वर्णचतुर्गतिः
    । अकारणः कारणञ्च सर्वकारणकारणम् ॥ १८॥ अद्वैतोऽद्वैतरूपश्च सृष्टिस्थितिलयेश्वरः । चिद्विभूतिर्महायोगी
    भक्ताराध्यः पराश्रयः ॥ १९॥ सर्वाराध्यः पराराध्योऽनाराध्यो विश्वभावनः । परव्योमोर्ध्वनिलयः कृपालुगुरुर्विग्रहः
    ॥ २०॥ स्रष्टा पाता च संहर्ताऽनन्तश्रीः पुरुषोत्तमः । अत्याचार्यः पुण्यलीलो निगुणः सगुणः स्वराट् ॥
    २१॥ चतुर्विंशतिमूर्तिश्च दशमूर्तिरनन्तकः । अकालः कालकालश्च छन्नोऽच्छन्नो विभूतिपः ॥ २२॥ अनादिरादिः
    क्षेत्रज्ञो ह्यमायी मायिनां प्रियः । श्रोतव्यः परमात्मांशी त्र्यन्तर्यामी महाप्रभुः ॥ २३॥ ब्रह्माभो
    ब्रह्मकिरणो ब्रह्मयोनिस्तदाश्रयः । चतुश्चतुःकलापादः सर्वास्पदपदो गतिः ॥ २४॥ सर्वावतारी सर्वश्रीः सर्वदिव्यविभूतिधृक्
    । गुणसङ्गी गुणातीतो गम्योऽगम्यो महामनाः ॥ २५॥ इत्यैश्वर्यनामानि । आदिलीलानामानि । बाललीलाधरवरो द्व्येकमूर्तिगुणाश्रयः
    । शचीगर्भोदधिशयः स्वयमाविःकलेवरः ॥ २६॥ ब्रजेन्द्रनन्दनः श्रीमान् राधिकाप्राणवल्लभः । द्वापरोडुपतिः
    कृष्णो माधुर्यरसनायकः ॥ २७॥ अन्तः कृष्णो बहिर्गौऔरः कलित्राता शुभाश्रयः । अद्वैतामन्त्रितोऽद्वैतानीतोऽद्वैतप्रियप्रभुः
    ॥ २॥ जगन्नाथात्मजो ब्रह्मसुतो ब्रह्मकुलाम्बुजः । शचीसूनुः शचीनन्दिः शचीगर्भोदजः परः ॥ २९॥ नवद्वीपोदयः
    पूर्णोदयश्चन्द्रग्रहोदयः । प्राग्वसन्तोदयः फाल्गुन्युदयो मङ्गलोदयः ॥ ३०॥ नामसङ्कीर्तनप्रीतिर्नामसङ्कीर्तनोदयः
    गौडचन्द्रो गौडनाथो गौरो गोद्रुमचन्द्रमाः ॥ ३१॥ चैतन्यः कृष्णचैतन्यः स्वयङ्कृष्णो रसात्मकः । त्रिसुखास्वादको
    राधाभावो राधाद्युतिग्रहः ॥ ३२॥ साङ्गोपाङ्गावतीर्णश्च त्रिस्रोतस्तीरसम्भवः । कलिसन्ध्यावतारश्च त्रियुगस्त्रिदिवेश्वरः
    ॥ ३३॥ विश्वरूपानुजः शान्तः शुभर्क्षग्रहतारकः । शुभाङ्कितपदाम्भोजः शुभाङ्कितकराम्बुजः ॥ ३४॥ द्वात्रिशल्लक्षणोपेतो
    महापुरुषलक्षणः । आजानुलम्बितभुजोऽन्तर्भुजः शुभविग्रहः ॥ ३५॥ विश्वम्भरः सुदिव्यश्रीर्नामक्रन्दनसंवरः
    । त्यक्तमृत्स्तन्यपायी च मातृपितृसुखप्रदः ॥ ३६॥ अतिथ्यन्नत्रिभोजी च अतिथित्राणकारकः । कन्यानैवेद्यभोक्ता
    च कन्याभीष्टवरप्रदः ॥ ३७॥ चपलश्च छलग्राही चापल्यसुखदायकः । लक्ष्मीसन्दर्शनाह्लादो लक्ष्मीस्रक्चन्दनार्चितः
    ॥ ३८॥ मातृज्ञानप्रदाता च मात्राज्ञाप्रतिपालकः । दिव्यलोकागमगृहः शून्यपान्नूपुरध्वनिः ॥ ३९॥ आश्चर्यबाल्यलीलश्च
    अद्भुतप्रियदर्शनः । बालकानन्ददाता च बालकप्राणवल्लभः ॥ ४०॥ पितृवाक्यानुवर्ती च मातृवाक्यानुवर्त्यपि
    । सर्वानन्दननृत्यश्च कृष्णलीलाऽनुकारकः ॥ ४१॥ कृष्णवद्बाल्यलीलश्च गृहभाण्डादिभेदकः । विद्याभ्यासरतोऽध्येता
    पाठदक्षः सुपाठकः ॥ ४२॥ अन्तेवास्यप्रणीर्गङ्गादासशिष्यः कविः सुधीः । पितृसन्तोषकः पितृभक् महायशाः ॥
    ४३॥ पितृयज्ञविधेयात्मा धार्मिकः पितृयज्ञकृत् । पुण्यवान् पुण्यकीर्तिश्च पुण्यश्लोकः सुपुण्यदः ॥ ४४॥
    उद्वाहासक्तचित्तश्च गार्हस्थ्यधर्मवासनः । श्रीपतिर्माधवो लक्ष्मीपतिः श्रीरुक्मिणीपतिः ॥ ४५॥ श्रीधरः
    श्रीनिवासश्च श्रीनाथो जानकीपतिः । किशोरो रसराजश्च मदनोज्ज्वलविग्रहः ॥ ४६॥ मनोहराङ्गप्रत्यङ्गस्तप्तकाञ्चनविग्रहः
    । कोटिसूर्यप्रभः कोटिमृगाङ्कस्निग्धशीतलः ॥ ४७॥ कोटिकन्दर्पलावण्यः कोटिगीष्पतिभाषणः । विद्वत्प्रियो
    वावदूकः सत्यवादी जितेन्द्रियः ॥ ४८॥ विपश्विच्छाब्दिको विद्वान् सर्वशास्त्रविशारदः । अध्यापको महामान्यो
    बहुशिष्यसमन्वितः ॥ ४९॥ सद्व्याख्याकारको वादी वादिजिद् विनयी बुधः । जलकेलिरतः कृष्णजलकेल्यनुकारकः ॥
    ५०॥ तपनद्वैधसञ्च्छेत्ता साध्यसाधनबोधदः । वङ्गाटनो वङ्गहितः वङ्गे नामप्रचारकः ॥ ५१॥ वङ्गोद्धर्ता वङ्गगुरुर्वङ्गामङ्गलनाशनः
    । गौडानन्दो गौड बन्धुर्गौडवासिजनप्रियः ॥ ५२॥ विष्णुप्रियापती राधापतिर्दिग्विजयीस्ततः । जितसन्मानदो
    दिग्विजयीबन्धनखण्डनः ॥ ५३॥ युवा यौवनकर्मा च दिव्यस्रकचन्दनोज्ज्वलः । दिव्यवासो दिव्यमूर्तिर्दिव्यसद्रत्नभूषणः
    ॥ ५४॥ कोटिकन्दर्पसौन्दर्यः कोटिचन्द्रनिभाननः । कोटिवाग्देवतावाणिः कोटिदेवेज्यबुद्धिमान् ॥ ५५॥ पण्डिताध्यापको
    मानी यत्तो यौवनवेशधृक् । नारिगणमनश्चन्द्रो भावानिल रुजाधरः ॥ ५६॥ प्रेमदः प्रेममत्तश्च गयागः पितृकर्मकृत्
    । ईश्वरप्रियशिष्यश्च दीक्षितः प्रेमविह्वलः ॥ ५७॥ जननीप्रेमदाता च जननीप्रेमवर्धनः । अद्वैताचार्यमिलितोऽद्वैतविश्वात्मदर्शकः
    ॥ ५८॥ श्रीश्रीवासाभिषिक्तश्च महैश्वर्यप्रकाशकः । स्वरूपमिलितो नित्यानन्दषड्भुजदर्शकः ॥ ५९॥ शङ्खचक्रगदापद्मशार्ङ्गवेणुधरोऽभयः
    द्विचक्रवेणुहस्तश्च सुदिव्यैश्वर्यविग्रहः ॥ ६०॥ मुरलीवादनो वंशीवदनो मुरलीधरः । षड्भुजश्च बहुभुजो द्विभुजश्च
    चतुर्भुजः ॥ ६१॥ श्यामलः श्यामलाङ्गश्च श्यामश्रीः श्यामसुन्दरः । वरपीताम्बरधरो बलकृष्णद्विमूर्तिधृक्
    ॥ ६२॥ अम्बाष्टद्विमूर्तिश्च मधुरप्रियविग्रहः । पाषण्डयुगलत्राता पाषण्डयुगलाघहृत् ॥ ६३॥ आसप्तयामभावस्थ
    आवेशाम्बुधिसंस्थितः । वराहभावावेशश्च मुरारिस्कन्धनर्तकः ॥ ६४॥ शुक्लाम्बरात्तण्डुलभुङ् नामश्लोकसदर्थकृत्
    । वैष्णवाचारसन्तुष्टः स्वपद्याचारशिक्षकः ॥ ६५॥ श्रीवासाङ्गनवर्षैकरात्रिकीर्तनकारकः । नामविघ्नशमोपायो
    गुप्तकीर्तनकारकः ॥ ६६॥ दुष्टगोपालचापालकृमिकुष्ठविधायकः । व्याधिपीडितगोपालचापालद्विजसंस्तुतः ॥ ६७॥
    दुष्टगोपालचापालापराधात्यन्तशेषकृत् । मुकुन्ददत्तदण्डानुग्रहोद्वैतार्यभक्तिकृत् ॥ ६८॥ भक्त्यद्वैतातुष्टिदोऽवज्ञानाद्वैतप्रसादकृत्
    । श्रीधरायसपात्रस्थजलपानपरायणः ॥ ६९॥ भक्तेष्टवरदाता च हरिदासप्रसादकः । आचार्यसम्मुखाम्बापराधसम्परिखण्डकः
    ॥ ७०॥ नामार्थवादिसन्त्यागि नाममाहात्म्यवर्णकः । भक्तेषु नाममाहात्म्यश्रावको भक्ततोषकः ॥ ७१॥ गुप्तभाले
    रामदासाभिधानलिपिकारकः । सद्यश्च तोत्पादकश्च सगणान्रफलाशनः ॥ ७२॥ नित्यचूतोत्सव मेघविघ्ननिवारकः । गुप्तलोलो
    नैकलीलो भक्ते लीलाप्रदर्शकः ॥ ७३॥ सहस्रनामसंश्रोता नृसिंहावेशविग्रहः । तेजोमयश्चण्डमूर्तिर्जनद्रावणरूपधृक्
    ॥ ७४॥ शिवसङ्गीतसंश्रोता शिवावेशीशभाववृक् । शैवस्कन्धनटो भिक्षुनर्तकप्रेमवर्धकः ॥ ७५॥ जिज्ञासुर्गणकप्रष्टा
    ज्योतिर्विद्गणितागतः । ज्योतिर्विद्ध्यानगो ज्योतिर्वेत्तृविस्मयकारकः ॥ ७६॥ ज्योतिर्विदुक्तियाथात्म्यः
    परिपूर्णो महाविभुः । सर्वैश्वर्यमयो नित्यानन्दरूपो महाश्रयः ॥ ७७॥ कलिद्वापरेकरूपो दुर्विज्ञेयश्च सर्ववित्
    । परतत्त्वं परब्रह्म परेशः परमेश्वरः ॥ ७८॥ सुनर्मा पूर्ववक्ता च गोपजातिश्च गोपजः । गोचारको गवांसेवी
    पूर्वपुण्यफलाग्र्यजः ॥ ७९॥ ज्योतिर्वित् त्राणकर्ता च बलावेशी बलानुकृत् । मध्वोप्सुर्मधुपानेप्सुर्मध्वानयनशासनः
    ॥ ८०॥ पात्रस्थगङ्गाम्बुपायी पानविह्वलनृत्यकृत् । यमुनाकर्षकारीच मदमत्तस्खलद्गतिः ॥ ८१॥ सुवर्णलाङ्गलधरः
    साक्षाच्छ्रीरामविग्रहः । सगणानन्दनृत्यश्च आचतुर्यामनर्तकः ॥ ८२॥ हरिसङ्कीर्तनादेशो ग्रामसङ्कीर्तनोत्सुकः
    । तुरुष्कदण्डदो म्लेच्छाध्यक्षविघ्नविनाशकः ॥ ८३॥ म्लेच्छानुग्रहकर्ता च म्लेच्छशास्त्रप्रदूषकः । गोहितो
    गोपतिर्गोभृद् गोविन्दो गोहिते रतः ॥ ८४॥ म्लेच्छप्रसादको नामकीर्तनप्रतिबन्धहा । श्रीवासवत्सलः प्रेम्णा
    पुत्रशोकापनोदनः ॥ ८५॥ श्रीवासानन्दनो भक्तवरदो भक्ततोषणः । स्वभुक्तोच्छिष्टदो नारायणीसम्मानकारकः ॥
    ८६॥ श्रीवाससीवकप्रीतः सीवकस्वात्मदर्शकः । प्रेमभक्तगणासङ्गी प्रेमावेशी प्रियश्रवाः ॥ ३७॥ गोपीभावानुरागी
    च गोपीनामपरायणः । आगस्कृत्त्राणहृदयः संन्यासकरणोत्सुकः ॥ ८८॥ न्यासिभिक्षाप्रदाता च त्रिसङ्गी पुरतीर्थगः
    । भारतीकृतसंन्यासस्त्रातृसन्न्यासरूपधृक् ॥ ८९॥ दण्डी दण्डधरो न्यासी संन्यासी च त्रिदण्डधृक् । संन्यासकृच्छमः
    शान्तो निष्ठा शान्तिः परायणम् ॥ ९०॥ शुभाङ्गः शान्तिदः पूज्यो ब्रह्मसम्मानदायकः । कृतागोब्राह्मणत्राता
    संन्यासिज्ञानदायकः ॥ ९१॥ तुर्याश्रम्याश्रमातीतो विद्वद्ब्रह्मनमस्कृतः । न्यासिचूडामणिर्न्यासिहरिभक्तिप्रदायकः
    ॥ ९२॥ अद्वैतध्वान्तविध्वंसी भक्तिपङ्कजभास्करः । चतुर्वर्णनमस्यश्च चतुराश्रमपूजितः ॥ ९३॥ इति आदिलीलानामानि
    । मध्यलीलानामानि । श्रीवृन्दावनगः प्रेमविह्वलो बाह्यविस्मृतिः । राढभूमिभ्रमो गङ्गायमुनाभावदर्शनः ॥
    ९४॥ आचार्यगृहभिक्षाकृन्निशाकीर्तनकारकः मात्रादिसर्वमिलनो नीलाद्रिगमनोत्सुकः ॥ ९५॥ देवताप्रतिमादर्शी
    लीलादर्शी जनप्रियः । माधवाख्यानसंश्रोता विग्रहाख्यानकश्रवाः ॥ ९६॥ भग्नदण्डः शुद्धतनुरेकाकी च निराश्रमी
    । दारुब्रह्मसमीपस्थो दारुविग्रहदर्शकः ॥ ९७॥ जगन्नाथदशाज्ञानो भावसिन्धुप्रलीनधीः । सार्वभौमधीरप्रसादकः
    दीर्घकालानुचेतनः ॥ ९८॥ नित्यानन्दानुमिलनो जगदानन्दवीक्षितः । मुकुन्दमिलनः सार्वभौमधीरग्रसाधकः ॥ ९९॥
    करुणासागरः सार्वभौमैश्वर्यात्मदर्शकः । अवाचीतीर्थगन्ता च वैष्णवप्राणनायकः ॥ १००॥ वासुदेवव्याधिहरो
    जी वासुदेवामृतप्रदः । नृसिंहस्तोता कृष्णनामप्रवर्तनः ॥ १०१॥ प्राप्तगोदावरीतीरो वनवृन्दावनभ्रमः । रामानन्दसम्मिलनो
    रामानन्दसुसंस्तुतः ॥ १०२॥ रामानन्ददालापो रामानन्दप्रसादकृत् । साध्यसाधनतत्त्वज्ञः साध्यसाधनपृच्छकः
    ॥ १०३॥ रामानन्दहृदम्म्भोजसर्वतत्त्वप्रभाकरः । रामानन्दोत्तरश्रोता रामानन्दवशीकृतः ॥ १०४॥ रामानन्दघनश्यामगौरमूर्तिप्रदर्शकः
    विद्यापुरजनत्राता अभक्तजनभक्तकृत् ॥ १०५॥ तीर्थीकृत्तीर्थगस्तीर्थी सत्तीर्थस्तीर्थपावनः । तीर्थस्नायी
    तीर्थदर्शी त्रैविध्यजनभक्तकृत् ॥ १०६॥ मल्लिकार्जुनभूतेशदर्शी शैवेष्टभक्तकृत् । दासराममहादेवदर्शी वैष्णवकारकः
    ॥ १०७॥ त्रिमल्लत्रिपदीदर्शी पाषण्डिदलनोत्सुकः । श्रीवैष्णवतत्त्ववादिकृष्णभक्तिप्रदायकः ॥ १०८॥ अहोबलनृसिंहादिविष्णुविग्रहदर्शकः
    । श्रीसिद्धवटगन्ता च श्रीसीतापतिदर्शकः ॥ १०९॥ रामनामजपद्विप्रकृष्णनामप्रवर्तकः स्कन्दक्षेत्रस्कन्ददर्शी
    श्रीत्रिविक्रमदर्शकः ॥ ११०॥ वृद्धकाशीशिवालोकी बहुविप्रपुरागमः । भक्तिशस्त्री सुतेजस्वी असच्छास्त्रनिकृन्तनः
    ॥ १११॥ गर्विगर्वहरोगर्वी गर्वी च सर्वगर्वहा । दर्पहा दर्पदो दृप्तो जयी जेता जयप्रदः ॥ ११२॥ पाषण्डनिग्रहो
    मायावादसिद्धान्तखण्डकः । बौद्धाचार्यजयी बौद्धमतखण्डनकारकः ॥ ११३॥ बुद्धांशी बुद्धिमान् बुद्धावतारी
    बौद्धनिग्रहः । बौद्धानुग्राहको बौद्धत्राता च बौद्धजीवनः ॥ ११४॥ वेङ्कटेश्वरदर्शी च बहुतीर्थाटनोत्सुकः
    । शिवकाञ्चीगमः शैवशाक्तवैष्णवकारकः ॥ ११५॥ विष्णुकाञ्चीगमः श्रीमद्विष्णुस्तुतिपरायणः । कृष्णभक्तिप्रदो
    रङ्गनाथदर्शी सदाश्रयः ॥ ११६॥ रङ्गक्षेत्रवासी च वेङ्कटप्रियकृत्सुखः । भट्टसंशयच्छेत्ता कृष्णतत्त्वोपदेशकः
    ॥ ११७॥ भक्तपाठश्रवानन्दी भक्तपाठकशिक्षकः । विप्रविश्वासदाता च सीतातत्त्वोपदेशकः ॥ ११८॥ विप्रजीवनसंरक्षो
    भक्तविप्रपरिष्टुतः । अनेकदक्षिणाटाटश्चानेकतीर्थदर्शनः ॥ ११९॥ कृष्णदाससमुद्धर्ता भट्टमारिजनार्दनः ।
    श्रीब्रह्मसंहिताच्यायलाभकृद् वैष्णवादृतः ॥ १२०॥ माध्वगर्वखर्वकरः कर्मज्ञानप्रदूषकः । स्वर्गापवर्गनरकतुल्यज्ञापक
    आर्तिहा ॥ १२१॥ शङ्करारण्यसन्त्यासिभ्राता श्रीरङ्गसौख्यदः । कृष्णकर्णामृतास्वादी श्रीकर्णामृतलाभकृत्
    ॥ १२२॥ सप्ततालपरिष्वङ्गः सप्ततालविमोचनः । रामावतारविख्यातिः काशीमिश्रप्रसादकृत् ॥ १२३॥ काशीमिश्रार्पितप्राणधनगेहपदाम्बुजः
    । काशीमिश्रषडैश्वर्यपूर्णविग्रहदर्शकः ॥ १२४॥ भक्तात्मदो भक्तसङ्गी भक्ताप्यो भक्तजीवनः । श्रीमद्विष्णुप्रसादाशी
    प्रसादगुणवर्णकः ॥ १२५॥ नीलाचलजनानन्दी नीलाचलजनप्रियः । भवानन्देश्वरो वाणीनाथसेव्यो वरप्रदः ॥ १२६॥
    स्वरूपानन्ददो भृत्यगोविन्दकृतसेवनः । ब्रह्मानन्दबहिर्वासप्रदाता वेशशोधकः ॥ १२७॥ शून्यध्यानतिरस्कर्ता
    कृष्णैकध्यानसिद्धिदः । विधिहेयोपदेष्टा च रागमार्गोपदेशकः ॥ १२८॥ स्ववर्गमिलनो भक्तप्रेमालिङ्गनतत्परः
    । अमानी मानदो मान्यः अमानिजनमानदः ॥ १२९॥ अद्वैतप्रेमसंश्लेषो वासुदेवप्रमोदकः । जगदानन्दकारुण्यः शङ्करस्नेहकारकः
    ॥ १३०॥ श्रीवासप्रीतिदः प्रीतः श्रीवासस्नेहभाषणः । शिवानन्दानुरागी च मुरारिन्देहमार्जकः ॥ १३१॥ वक्रेश्वरप्रीतमना
    नारायणपरप्रियः । श्रीमत्पण्डितसंह्लादो बुधराघवसुप्रियः ॥ १३२॥ वासुमाधवगोविन्दघोषकीर्तनसुप्रियः । शुक्लाम्बरप्रेमदः
    श्रीकान्तनारायणप्रियः ॥ १३३॥ श्रीनरविजयार्हः श्रीनृसिंहानन्दनन्ददः । वल्लभसेनसुखदः पुरुषोत्तमनन्ददः
    ॥ १३४॥ सञ्जयानन्ददः सत्यराजखानकृपाकरः । रामानन्दवसुप्रीतो मुकुन्ददाससुप्रियः ॥ १३५॥ श्रीरघुनन्दनप्रीतः
    श्रीमन्नरहरिप्रियः । खण्डवासिचिरञ्जीवदास्यदः स्वजनप्रियः ॥ १३६॥ सुलोचनप्रियो भक्तश्लेषः आत्मरतिप्रदः
    । आचार्यरत्नगुणगो विद्यानिधिगुणग्रहः ॥ १३७॥ विनयी विनयासक्तो हरिदासपरप्रीतिः । हरिदासपरप्रीतिः प्रसादपरिवेषणः
    ॥ १३९॥ सभक्तगणसंन्यासिप्रसादान्नादिभक्षकः महानृत्यो महाप्रेमा सङ्कीर्तनमहोज्ज्वलः ॥ १४०॥ नीलाचलजनानन्ददाता
    कृतमहोत्सवः । प्रसादवण्टको दिव्यलीलाकारी सुखप्रदः ॥ १४१॥ स्वतन्त्रः प्रेमतन्त्रश्च भक्ततन्त्रः सदग्रणीः
    । नृपनन्दसन्तोषी श्रीमन्मन्दिरमार्जकः ॥ १४२॥ श्रीसिंहासनसंस्कारी संस्कारकार्यंशिक्षकः । सङ्काद्दण्डनृत्यकारी
    सात्विकचिह्नवृक् ॥ १४३॥ भूकम्पकरनृत्यश्च गोपालचेतनाप्रदः । भोक्ता भोजयिता शाकप्रियोऽत्युत्तमभोज्यभुक्
    ॥ १४४॥ जगदानन्दसन्तोषी भक्तोपहृतिभक्षकः । रथस्थविष्णुसन्द्रष्टा रथयात्रामहोत्सवी ॥ १४५॥ वैष्णवभ्रघटानन्दो
    नामाश्रुजलवर्षः । उद्दण्डनृत्यकारी च दिव्यत्सात्त्विकलक्षणः ॥ १४३॥ युगपद्दलसन्दर्शी युगपद्दलसप्तगः
    । लीलाविवर्तभावज्ञो लालसाश्लोकपाठकः ॥ १४७॥ प्रतापरुद्रकरुणः स्थिरस्यन्दनचालकः । इन्द्रद्युम्नजलक्रीडोऽद्वैतशेषशयेशयः
    ॥ १४८॥ सुन्दराचलगन्ता च रसतत्त्व सुखश्रवाः । दामोदरसहालापः श्रीवासवर्णनश्रवाः ॥ १४९॥ श्रीराधयोगुणश्रोता
    राधिकाप्रेमविह्वलः । वसुसत्यादेशकरो वसुसत्यकृपाकरः ॥ १५०॥ पूजाशेषतुलस्याद्यद्वैताचार्यप्रपूजकः । मुखवाद्यकरोऽद्वैतभिक्षानित्यनिमन्त्रितः
    ॥ १५१॥ गोपवेशधरः कृष्णजन्मघस्रमहोत्सवी । सनित्यानन्दलगुडचालको विजयोत्सवी ॥ १५२॥ हनुमत्परमाशो रासदीपोत्सवादिक
    । स्वभक्तसम्मानयिता मापराधक्षमापनः ॥ १५३॥ भुक्तान्नज्ञापकः कृष्णप्राणनाथपदप्रियः । गुणराजातिविन वसुसत्योपदेशकः
    ॥ १५४॥ भक्तचिह्नेपदेष्टा च नाममाहात्म्यवर्णकः । श्रीनरहरिसन्तुष्टः सार्वभौमोपदेशकः ॥ १५५॥ वाचस्पत्युपदेष्टा
    च श्रीमुरारिपरीक्षकः । वासुदेवगुणाकृष्टो वैष्णवप्राणनायकः ॥ १५६॥ स्वभक्तगुणवक्ता च भक्तानुग्रहकातरः
    । गदाधरगुणाकृष्टो भक्तविच्छेदकातरः ॥ १५७॥ पुर्यादिसहसंवासी सार्वभौमानुरोधभृत् । भट्टभिक्षानुमोदी च
    प्रचुरान्नादिभोजकः ॥ १५८॥ अमोघागःक्षमोऽमोघापराधपरिभञ्जनः । अमोघप्राणदोऽमोघनिजभक्तिप्रदायकः ॥ १५९॥
    भक्तेच्छापूरको गौडगौरभक्तानुमिश्रणः । प्रतापरुद्रसन्त्राता म्लेच्छराजप्रसादकृत् ॥ १६०॥ नाविकानुग्राहकश्च
    कुलियाग्रामतारकः । दुष्टगोपालचापालकृमिकुष्टनिवारकः ॥ १६१॥ अद्वैतालयगन्ता च शचीदुःखान्तकारकः । शचीदर्शनदाता
    च शचीप्रीतिविवर्धनः ॥ १६२॥ रूपसनातनग्राहि रघुनाथकृपाकरः । बलभद्रैकार्थश्च हिंस्रसेव्यपथक्रमः ॥ १६३॥
    व्याघ्रादिमध्यगन्ता च पशुकीर्तनकारकः । मृगसङ्गी मृगसखो हिंस्राहिंस्रैकवर्तनः ॥ १६४॥ मयूराद्यनुसङ्गश्च
    तिर्यक्कौतुकदर्शकः । नृत्यगीतानन्दगतिः प्रफुल्लद्रुलताध्वनिः ॥ १६५॥ जङ्गमाजङ्गमानन्ददाता वनगतिप्रियः
    । महानन्दनगो वन्यकन्दशाकफलप्रियः ॥ १६६॥ वनमार्गसुखास्वादी वनग्रामिसुभक्तिदः । वाराणसीतीर्थगश्च तपनातिसुखप्रदः
    ॥ १६७॥ श्रीमणिकर्णिकास्नायी श्रीविश्वेश्वरदर्शकः । बिन्दुमाधवसन्दर्शी तपनालयपावनः ॥ १६८॥ चन्द्रशेखरसम्पूज्यो
    भिक्षार्थब्रह्मवञ्चकः । कृष्णापराध्यदृष्टश्च मायावादिविडम्बकः ॥ १६९॥ प्रयागतीर्थस्नायी च वेणीमाधवदर्शकः
    । मथुरानगरीदर्शी मथुराप्रणमस्करःः ॥ १७०॥ विश्रामतीर्थसुस्नायी श्रीमत्केशवदर्शकः । पुरीशिष्यानुमिलितः
    पुरीशिष्यप्रतोषकः ॥ १७१॥ यमुनाद्वादशयुगतीर्थस्नानपरायणः गोकर्णादिकदर्शी च विप्रसङ्गी वनभ्रमी ॥ १७२॥
    गोघटावेष्टितो गोऽङ्गसेवी मृगगणादृतः । पिकादिगीयमानश्च शिखिनृत्यप्रदर्शितः ॥ १७३॥ चारुफुल्ललतागुल्मसेवितश्रीपदाम्बुजः
    । वृक्षगुल्मलताश्लेषी शारीशुकपद्यश्रवाः ॥ १७४॥ शश्वत्प्रेमाविष्टचित्तो राधाकुण्डैषणोन्मुखः । लुप्तकुण्डोदकस्नायी
    श्रीगोवर्धनदर्शकः ॥ १७५॥ गिरिप्रदक्षिणकरः शैलगोपालदर्शकः । सर्वकुण्ड जलस्नायी रासमण्डलदर्शकः ॥ १७६॥
    प्राचीनतिन्तिडीवृक्षतलविश्रामकारकः । कृष्णदासगुणाकृष्टः कृष्णदासकृपाकरः ॥ १७७॥ निर्विशेषाद्वयब्रह्मवादवादनिरासकृत्
    सभृत्यम्लेच्छसन्त्राता श्रीरूपवल्लभाङ्गीकृत् ॥ १७८॥ श्रीरूपशक्तिसञ्चारः श्रीरूपभक्तिशिक्षकः । शान्तादिरसतत्त्वज्ञः
    शान्तादिरसवर्णकः ॥ १७९॥ माधुर्यातिप्रियः प्रेमभक्तितत्त्वोपदेशकः । सनातनानुकम्पश्च सनातनसुशिक्षकः
    ॥ १८०॥ निःसीमकरुणापूर्णः सर्वतत्त्वप्रकाशकः । शुद्धवैराग्यदाता च निजभक्तविशोधकः ॥ १८१॥ सनातनगुरुः
    सर्वशास्त्रसिद्धान्तकारकः । सनातनादेशकरो निजभक्तेष्टसिद्धिदः ॥ १८२॥ न्यास्यन्तर्द्रवकृन्मायावादिभक्तिप्रदायकः
    । सूत्रमुख्यार्थकर्ता च प्रकाशानन्दभक्तिदः ॥ १८३॥ प्रकाशानन्दसन्त्राता काशीनिस्तारकारकः । सुबुद्धितारकः
    काशीवासिवैष्णवकारकः ॥ १८४॥ इति मध्यलीलानामानि । अन्त्यलीलानामानि शिवानन्दनस्त्राता रूपनाटकसंश्रवाः
    । भक्तावेशो भक्तधामाविर्भावो नकुलान्तरः ॥ १८५॥ प्रद्युम्नभक्ताविर्भावः शिवानन्दप्रबोधनः । शिवानन्दद्वैधहरो
    हरिदाससुदण्डदः ॥ १८६॥ हरिदासप्रसादश्च छलस्वजनशिक्षकः । भक्तवाक्यदण्डसहो मातृसन्तोषदायकः ॥ १८७॥ स्वभक्तात्
    स्वगुणश्रोता स्वभक्तगुणभाषकः । समर्पितस्वभक्ताङ्गो भक्तजीवनरक्षकः ॥ १८८॥ सनातनादेशदश्च भक्ताङ्गमिलनाग्रहः
    । स्वभक्तलालको भक्तवपुर्निर्मलकारकः ॥ १८९॥ लुप्ततीर्थोद्धारयिता रघुनाथप्रसाददः । राघवानन्ददाता च रघुनाथाघखण्डनः
    ॥ १९०॥ रघुनाथोपदेष्टा च भट्टगर्वविखण्डनः । पूतहृद्वल्लभदयो दारा भट्टदैन्यसुसंस्तुतः ॥ १९१॥ गदाधरप्राणनाथो
    जगदानन्दचापलः । भवानन्दात्मजत्राता मुन्यादिदृष्टविग्रहः ॥ १९२॥ नित्यानन्दादिमिलितो नरेन्द्रजलखेलनः
    । दमयन्तीरातग्राही ओड्रगीतानुमोदनः ॥ १९३॥ भृत्यार्तिहा भृत्यपालो भृत्यदोषानुमोदनः । भृत्यसेवातिसन्तुष्ट
    भृत्यगोविन्दसेवितः ॥ १९४॥ हरिदासोक्रमोन्मादो हरिदासान्त्यकर्मकृत् । हरिदासोत्सवानन्दो हरिदासप्रसादकृत्
    ॥ १९५॥ शिवानन्दमहानन्दः रघुनाथदयाकरः । श्रीकृष्णविरहोन्मादो गोपीव विरहातुरः ॥ १९६॥ प्रेमाद्भुतविकारश्च
    कालीदासमहाकृपः । पुरीदासानुकम्पश्च कूर्माङ्गो गोष्ठभावनः ॥ १९७॥ मातृभक्ताग्रगण्यश्च मातृतोषणतत्परः
    । समुद्रवारिपतनो धीवरप्रेमदायकः ॥ १९८॥ वृषभानुसुतावेशो दिव्योन्मादप्रदर्शनः । कृष्णाङ्गसौरभघ्राता
    कृष्णदर्शनलालसः ॥ १९९॥ स्वश्लोकार्थरसास्वादी बाह्यचक्षुरदर्शनः । भक्तदर्शनदो दिव्यधामस्थो दिव्यदर्शनः
    ॥ २००॥ सर्वापराधशमनो भक्तहृत्कमलस्थितः । अनन्तादित्यसङ्काशः स्वपादाम्बुजदास्यदः ॥ २०१॥ स्मृतसर्वाघशमनः
    कीर्तितप्रेमभक्तिदः । हरिसङ्कीर्तनारम्भप्रेमनामाभिकीर्तनः ॥ २०२॥ परम्पराभक्तगणप्रेमभक्तिप्रवर्धनः
    । आकलिप्रेमनामाभिकीर्तनः सात्त्विकप्रियः ॥ २०३॥ सङ्कीर्तनमहायज्ञैर्यज्योऽपर्याप्तवर्णनः ॥ २०४॥ इत्यन्त्यलीलानामानि
    । एतत् सहस्रनाम्नां च श्रीचैतन्यपरात्मनः । यः पठेत् प्रयतो भूत्वा स परं पदमाप्नुयात् ॥ २०५॥ मुक्तः
    सर्वापराधेभ्यः प्रेमभक्तियुतो भवेत् । देहान्ते कृष्णचैतन्यस्मृतिर्भवति शाश्वती ॥ २०६॥ फाल्गुन्यामर्चयित्वा
    य एकावृत्त्या पठेज्जनः । यद्यत् कामयते कामं लभते तदयत्नतः ॥ २०७॥ नामसङ्कीर्तनं यस्य प्रेमभक्तिविवर्धनम्
    । पूजा च दास्यदा तस्य तं श्रीगौरमहं भजे ॥ २०८॥ कृष्णाय गौरवर्णाय हरये रसरूपिणे । हरिभक्तशरण्याय प्रेमदाय
    नमो नमः ॥ २०९॥ इति श्रीचैतन्यदासचिरञ्जीवीसर्वाधिकारि
