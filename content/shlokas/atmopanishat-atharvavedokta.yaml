id: atmopanishat-atharvavedokta
category: upanishad
name:
  english: atmopanishat (atharvavedokta)
  devanagari: आत्मोपनिषत् (अथर्ववेदोक्त)
content:
  english: kamamohavikalpanadismritilingodattanudattahrsvadirghaplutah khalitagarjitasphutitamuditanrittagitavaditrapralayavijrimbhitadibhih
    shrota ghrata rasayita neta karta vijnanatma purushah purananyayamimamsadharmashastraniti shravanaghranakarshanakarmavisheshanam
    karotyesho'ntaratma | atha paramatma nama yathakshara upasaniyah | sa ca pranayamapratyaharadharnadhyanasamadhiyoganumanatmacintakavatakanika
    va shyamakatandulo va valagrashatasahasravikalpanabhih sa labhyate nopalabhyate na jayate na mriyate
    na shushyati na klidyate na dahyate na kampate na bhidyate na cchidyate nirgunah sakshibhutah shuddho
    niravayavatma kevalah sukshmo nirmamo niranjano nirvikarah shabdasparsharuparasagandhavarjito nirvikalpo
    nirakankshah sarvavyapi so'cintyo nirvarnyashca punatyashuddhanyaputani | nishkriyastasya samsaro
    nasti | atmasamjnah shivah shuddha eka evadvayah sada | brahmarupataya brahma kevalam pratibhasate
    || 1|| jagadrupatayapyetadbrahmaiva pratibhasate | vidyavidyadibhedena bhavabhavadibhedatah || 2||
    gurushishyadibhedena brahmaiva pratibhasate | brahmaiva kevalam shuddham vidyate tattvadarshane ||
    3|| na ca vidya na cavidya na jagacca na caparam | satyatvena jagadbhanam samsarasya pravartakam ||
    4|| asatyatvena bhanam tu samsarasya nivartakam | ghato'yamiti vijnatum niyamah konvapekshate || 5||
    vina pramanasushthutvam yasminsati padarthadhih | ayamatma nityasiddhah pramane sati bhasate || 6||
    na desham napi kalam va na shuddhim vapyapekshate | devadatto'hamityetadvijnanam nirapekshakam ||
    7|| tadvadbrahmavido'pyasyabrahmahamiti vedanam | bhanuneva jagatsarvam bhasyate yasya tejasa || 8||
    anatmakamasattuccham kim nu tasyavabhasakam | vedashastrapuranani bhutani sakalanyapi || 9|| yenarthavanti
    tam kim nu vijnataram prakashayet | kshudham dehavyatham tyaktva balah kridati vastuni || 10|| tathaiva
    vidvanramate nirmamo niraham sukhi | kamannishkamarupi samcaratyekacaro munih || 11|| svatmanaiva
    sada tushtah svayam sarvatmana sthitah | nirdhano'pi sada tushto'pyasahayo mahabalah || 12|| nityatripto'pyabhunjano'pyasamah
    samadarshanah | kurvannapi na kurvanashcabhokta phalabhogyapi || 13|| shariryapyashariryesha paricchinno'pi
    sarvagah | ashariram sada santamidam brahmavidam kvacit || 14|| priyapriye na sprishatastathaiva ca
    shubha shubhe | tamasa grastavadbhanadagrasto'pi ravirjanaih || 15|| grasta ityucyate bhrantya hyajnatva
    vastulakshanam | tadvaddehadibandhebhyo vimuktam brahmavittamam || 16|| pashyanti dehivanmudhah sharirabhasadarshanat
    | ahinirlvayanivayam muktadehastu tishthati || 17|| itastatashcalyamano yatkincitpranavayuna | srotasa
    niyate daru yatha nimnonnatasthalam || 18|| daivena niyate deho yatha kalopabhuktishu | lakshyalakshyagatim
    tyaktva yastishthetkevalatmana || 19|| shiva eva svayam sakshadayam brahmaviduttamah | jivanneva sada
    muktah kritartho brahmavittamah || 20|| upadhinashadbrahmaiva sadbrahmapyeti nirdvayam | shailusho
    veshasadbhavabhavayoshca yatha puman || 21|| tathaiva brahmavicchreshthah sada brahmaiva naparah |
    ghate nashte yatha vyoma vyomaiva bhavati svayam || 22|| tathaivopadhivilaye brahmaiva brahmavitsvayam
    | kshiram kshire yatha kshiptam tailam taile jalam jale || 23|| samyuktamekatam yati tathatmanyatmavinmunih
    | evam videhakaivalyam sanmatratvamakhanditam || 24|| brahmabhavam prapadyaisha yatirnavartate punah
    | sadatmakatvavijnanadagdha vidyadivarshmanah || 25|| amushya brahmabhutattvadbrahmanah kuta udbhavah
    | mayaklriptau bandhamokshau na stah svatmani vastutah || 26|| yatha rajjau nishkriyayam sarpabhasavinirgamau
    | avriteh sadasattvabhyam vaktavye bandhamokshane || 27|| navrittirbrahmanah kvacidanyabhavadanavritam
    | astiti pratyayo yashca yashca nastiti vastuni || 28|| buddhereva gunavetau na tu nityasya vastunah
    | atastau mayaya klriptau bandhamokshau na catmani || 29|| nishkale nishkriye shante niravadye niramjane
    | advitiye pare tattve vyomavatkalpana kutah || 30|| na nirodho na cotpattirna baddho na ca sadhakah
    | na mumukshurna vai mukta ityesha paramarthata || 31|| ityupanishat || om bhadram karnebhih shrunuyama
    devah | bhadram pashyemakshabhiryajatrah | sthirairangaistushtuva
  devanagari: काममोहविकल्पानादिस्मृतिलिङ्गोदात्तानुदात्तह्र्स्वदीर्घप्लुतः खलितगर्जितस्फुटितमुदितनृत्तगीतवादित्रप्रलयविजृम्भितादिभिः
    श्रोता घ्राता रसयिता नेता कर्ता विज्ञानात्मा पुरुषः पुराणन्यायमीमांसाधर्मशास्त्राणीति श्रवणघ्राणाकर्षणकर्मविशेषणं
    करोत्येषोऽन्तरात्मा । अथ परमात्मा नाम यथाक्षर उपासनीयः । स च प्राणायामप्रत्याहारधार्णाध्यानसमाधियोगानुमानात्मचिन्तकवटकणिका
    वा श्यामाकतण्डुलो वा वालाग्रशतसहस्रविकल्पनाभिः स लभ्यते नोपलभ्यते न जायते न म्रियते न शुष्यति न क्लिद्यते
    न दह्यते न कम्पते न भिद्यते न च्छिद्यते निर्गुणः साक्षिभूतः शुद्धो निरवयवात्मा केवलः सूक्ष्मो निर्ममो
    निरञ्जनो निर्विकारः शब्दस्पर्शरूपरसगन्धवर्जितो निर्विकल्पो निराकाङ्क्षः सर्वव्यापी सोऽचिन्त्यो निर्वर्ण्यश्च
    पुनात्यशुद्धान्यपूतानि । निष्क्रियस्तस्य संसारो नास्ति । आत्मसंज्ञः शिवः शुद्ध एक एवाद्वयः सदा । ब्रह्मरूपतया
    ब्रह्म केवलं प्रतिभासते ॥ १॥ जगद्रूपतयाप्येतद्ब्रह्मैव प्रतिभासते । विद्याविद्यादिभेदेन भावाभावादिभेदतः
    ॥ २॥ गुरुशिष्यादिभेदेन ब्रह्मैव प्रतिभासते । ब्रह्मैव केवलं शुद्धं विद्यते तत्त्वदर्शने ॥ ३॥ न च विद्या
    न चाविद्या न जगच्च न चापरम् । सत्यत्वेन जगद्भानं संसारस्य प्रवर्तकम् ॥ ४॥ असत्यत्वेन भानं तु संसारस्य
    निवर्तकम् । घटोऽयमिति विज्ञातुं नियमः कोन्वपेक्षते ॥ ५॥ विना प्रमाणसुष्ठुत्वं यस्मिन्सति पदार्थधीः
    । अयमात्मा नित्यसिद्धः प्रमाणे सति भासते ॥ ६॥ न देशं नापि कालं वा न शुद्धिं वाप्यपेक्षते । देवदत्तोऽहमित्येतद्विज्ञानं
    निरपेक्षकम् ॥ ७॥ तद्वद्ब्रह्मविदोऽप्यस्यब्रह्माहमिति वेदनम् । भानुनेव जगत्सर्वं भास्यते यस्य तेजसा
    ॥ ८॥ अनात्मकमसत्तुच्छं किं नु तस्यावभासकम् । वेदशास्त्रपुराणानि भूतानि सकलान्यपि ॥ ९॥ येनार्थवन्ति
    तं किं नु विज्ञातारं प्रकाशयेत् । क्षुधां देहव्यथां त्यक्त्वा बालः क्रीडति वस्तुनि ॥ १०॥ तथैव विद्वान्रमते
    निर्ममो निरहं सुखी । कामान्निष्कामरूपी संचरत्येकचरो मुनिः ॥ ११॥ स्वात्मनैव सदा तुष्टः स्वयं सर्वात्मना
    स्थितः । निर्धनोऽपि सदा तुष्टोऽप्यसहायो महाबलः ॥ १२॥ नित्यतृप्तोऽप्यभुञ्जानोऽप्यसमः समदर्शनः । कुर्वन्नपि
    न कुर्वाणश्चाभोक्ता फलभोग्यपि ॥ १३॥ शरीर्यप्यशरीर्येष परिच्छिन्नोऽपि सर्वगः । अशरीरं सदा सन्तमिदं
    ब्रह्मविदं क्वचित् ॥ १४॥ प्रियाप्रिये न स्पृशतस्तथैव च शुभा शुभे । तमसा ग्रस्तवद्भानादग्रस्तोऽपि रविर्जनैः
    ॥ १५॥ ग्रस्त इत्युच्यते भ्रान्त्या ह्यज्ञात्वा वस्तुलक्षणम् । तद्वद्देहादिबन्धेभ्यो विमुक्तं ब्रह्मवित्तमम्
    ॥ १६॥ पश्यन्ति देहिवन्मूढाः शरीराभासदर्शनात् । अहिनिर्ल्वयनीवायं मुक्तदेहस्तु तिष्ठति ॥ १७॥ इतस्ततश्चाल्यमानो
    यत्किञ्चित्प्राणवायुना । स्रोतसा नीयते दारु यथा निम्नोन्नतस्थलम् ॥ १८॥ दैवेन नीयते देहो यथा कालोपभुक्तिषु
    । लक्ष्यालक्ष्यगतिं त्यक्त्वा यस्तिष्ठेत्केवलात्मना ॥ १९॥ शिव एव स्वयं साक्षादयं ब्रह्मविदुत्तमः ।
    जीवन्नेव सदा मुक्तः कृतार्थो ब्रह्मवित्तमः ॥ २०॥ उपाधिनाशाद्ब्रह्मैव सद्ब्रह्माप्येति निर्द्वयम् ।
    शैलूषो वेषसद्भावाभावयोश्च यथा पुमान् ॥ २१॥ तथैव ब्रह्मविच्छ्रेष्ठः सदा ब्रह्मैव नापरः । घटे नष्टे
    यथा व्योम व्योमैव भवति स्वयम् ॥ २२॥ तथैवोपाधिविलये ब्रह्मैव ब्रह्मवित्स्वयम् । क्षीरं क्षीरे यथा क्षिप्तं
    तैलं तैले जलं जले ॥ २३॥ संयुक्तमेकतां याति तथात्मन्यात्मविन्मुनिः । एवं विदेहकैवल्यं सन्मात्रत्वमखण्डितम्
    ॥ २४॥ ब्रह्मभावं प्रपद्यैष यतिर्नावर्तते पुनः । सदात्मकत्वविज्ञानदग्धा विद्यादिवर्ष्मणः ॥ २५॥ अमुष्य
    ब्रह्मभूतत्त्वाद्ब्रह्मणः कुत उद्भवः । मायाक्लृप्तौ बन्धमोक्षौ न स्तः स्वात्मनि वस्तुतः ॥ २६॥ यथा
    रज्जौ निष्क्रियायां सर्पाभासविनिर्गमौ । अवृतेः सदसत्त्वाभ्यां वक्तव्ये बन्धमोक्षणे ॥ २७॥ नावृत्तिर्ब्रह्मणः
    क्वाचिदन्याभावादनावृतम् । अस्तीति प्रत्ययो यश्च यश्च नास्तीति वस्तुनि ॥ २८॥ बुद्धेरेव गुणावेतौ न तु
    नित्यस्य वस्तुनः । अतस्तौ मायया क्लृप्तौ बन्धमोक्षौ न चात्मनि ॥ २९॥ निष्कले निष्क्रिये शान्ते निरवद्ये
    निरंजने । अद्वितीये परे तत्त्वे व्योमवत्कल्पना कुतः ॥ ३०॥ न निरोधो न चोत्पत्तिर्न बद्धो न च साधकः
    । न मुमुक्षुर्न वै मुक्त इत्येषा परमार्थता ॥ ३१॥ इत्युपनिषत् ॥ ॐ भद्रं कर्णेभिः श्रुणुयाम देवाः ।
    भद्रं पश्येमाक्षभिर्यजत्राः । स्थिरैरङ्गैस्तुष्टुवा
