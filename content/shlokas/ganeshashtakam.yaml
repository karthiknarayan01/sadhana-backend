id: ganeshashtakam
category: stotram
name:
  english: ganeshashtakam
  devanagari: गणेशाष्टकम्
content:
  english: tavalinam shuddham vighneshabijam shashikarasadrisham yoginam dhyanagamyam | dam dam dam damarupam
    dalitabhavabhayam suryakotiprakasham yam yam yam yajnanatham japati munivaro bahyamabhyantaram ca
    || 4|| hum hum hum hemavarnam shruti
  devanagari: तावलीनां शुद्धं विघ्नेशबीजं शशिकरसदृशं योगिनां ध्यानगम्यम् । डं डं डं डामरूपं दलितभवभयं
    सूर्यकोटिप्रकाशं यं यं यं यज्ञनाथं जपति मुनिवरो बाह्यमभ्यन्तरं च ॥ ४॥ हुं हुं हुं हेमवर्णं श्रुति
meaning: {}
