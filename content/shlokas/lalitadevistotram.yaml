id: lalitadevistotram
category: stotram
name:
  english: lalitadevistotram
  devanagari: ललितादेवीस्तोत्रम्
content:
  english: lalitadevistotram ganeshagrahanakshatrayoginirashirupinim | devim mantramayim naumi matrikapitharupinim
    || 10|| pranamami mahadevim matrikam parameshvarim | kalahrillohalollohakalanashanakarinim || 11||
    yadaksharaikamatre'pi samsiddhe sparddhate narah | ravitarkshyendukandarpaih shankaranalavishnubhih
    || 12|| yadaksharashashijyotsnamanditam bhuvanatrayam | vande sarveshvarim devim mahashrisiddhamatrikam
    || 13|| yadaksharamahasutraprotametajjagattrayam | brahyandadikatahantam tam vande siddhamatrikam
    || 14|| yadekadashamadharam bijam konatrayodbhavam | brahmandadikatahantam jagadadyapi drishyate ||
    15|| akacaditatonnaddhapayashaksharavarginim | jyeshthangabahuhritkanthakatipadanivasinim || 16||
    naumikaraksharoddharam saratsaram paratparam | pranamami mahadevim paramanandarupinim || 17|| athapi
    yasya jananti na managapi devatah | keyam kasmatkva keneti saruparupabhavanam || 18|| vande tamahamakshayyam
    kshakarakshararupinim | devim kulakalollolaprollasantim shivam param || 19|| varganukramayogena yasyakhyomashtakam
    sthitam | vande tamashtavargotthamahasiddhyadikeshvarim || 20|| kamapurnajakarakhyasupithantarnnivasinim
    | caturajnakoshabhutam naumi shritripuramaham || 21|| etatstotram tu nityanam yah pathetsusamahitah
    | pujadau tasya sarvasta varadah syurna samshayah || 22|| iti naradapurane purvabhage ekonanavatitamadhyayantargatam
    lalitadevistotram samaptam | brihannaradiyapurana | purvabhaga | adhyaya 89
  devanagari: ललितादेवीस्तोत्रम् गणेशग्रहनक्षत्रयोगिनीराशिरूपिणीम् । देवीं मन्त्रमयीं नौमि मातृकापीठरूपिणीम्
    ॥ १०॥ प्रणमामि महादेवीं मातृकां परमेश्वरीम् । कालहृल्लोहलोल्लोहकलानाशनकारिणीम् ॥ ११॥ यदक्षरैकमात्रेऽपि
    संसिद्धे स्पर्द्धते नरः । रवितार्क्ष्येन्दुकन्दर्पैः शङ्करानलविष्णुभिः ॥ १२॥ यदक्षरशशिज्योत्स्नामण्डितं
    भुवनत्रयम् । वन्दे सर्वेश्वरीं देवीं महाश्रीसिद्धमातृकाम् ॥ १३॥ यदक्षरमहासूत्रप्रोतमेतज्जगत्त्रयम्
    । ब्रह्याण्डादिकटाहान्तं तां वन्दे सिद्धमातृकाम् ॥ १४॥ यदेकादशमाधारं बीजं कोणत्रयोद्भवम् । ब्रह्माण्डादिकटाहान्तं
    जगदद्यापि दृश्यते ॥ १५॥ अकचादिटतोन्नद्धपयशाक्षरवर्गिणीम् । ज्येष्ठाङ्गबाहुहृत्कण्ठकटिपादनिवासिनीम्
    ॥ १६॥ नौमीकाराक्षरोद्धारां सारात्सारां परात्पराम् । प्रणमामि महादेवीं परमानन्दरूपिणीम् ॥ १७॥ अथापि
    यस्या जानन्ति न मनागपि देवताः । केयं कस्मात्क्व केनेति सरूपारूपभावनाम् ॥ १८॥ वन्दे तामहमक्षय्यां क्षकाराक्षररूपिणीम्
    । देवीं कुलकलोल्लोलप्रोल्लसन्तीं शिवां पराम् ॥ १९॥ वर्गानुक्रमयोगेन यस्याख्योमाष्टकं स्थितम् । वन्दे
    तामष्टवर्गोत्थमहासिद्ध्यादिकेश्वरीम् ॥ २०॥ कामपूर्णजकाराख्यसुपीठान्तर्न्निवासिनीम् । चतुराज्ञाकोशभूतां
    नौमि श्रीत्रिपुरामहम् ॥ २१॥ एतत्स्तोत्रं तु नित्यानां यः पठेत्सुसमाहितः । पूजादौ तस्य सर्वास्ता वरदाः
    स्युर्न संशयः ॥ २२॥ इति नारदपुराणे पूर्वभागे एकोननवतितमाध्यायान्तर्गतं ललितादेवीस्तोत्रं समाप्तम्
    । बृहन्नारदीयपुराण । पूर्वभाग । अध्याय ८९
