id: palashamahimastotram
category: stotram
name:
  english: palashamahimastotram
  devanagari: पलाशमहिमास्तोत्रम्
content:
  english: palashamahimastotram vanyuvaca | palasho harirupena sevyate hi puravidaih | bahubhirhyupacaraistu
    brahmavrikshasya sevanam || 1|| sarvakamapradam proktam mahapatakanashanam | trini patrani palashe
    madhyamam vishnushapitam || 2|| vame brahma dakshine ca hara ekah prakirtitah | palashapatre yo bhunkte
    nityameva narottamah || 3|| ashvamedhasahasrasya phalam prapnotyasamshayam | caturmasye visheshena
    bhokturmokshapradam bhavet || 4|| payasa vatha dugdhena ravivare'nisham yadi | caturmasye'rcito yaistu
    te yanti paramam padam || 5|| drishyate yadi palashah pratarutthaya manavaih | narakanashu nirdhuya
    gamyate paramam padam || 6|| palashah sarvadevanamadharo dharmasadhanam | yatra lobhastu tasya syattatra
    pujyo mahataruh || 7|| yatha sarveshu varneshu vipro mukhyatamo bhavet | madhye sarvatarunam ca brahmavriksho
    mahottamah || 8|| yasya mule haro nityam skandhe shuladharahsvayam | shakhasu bhagavan rudrah pushpeshu
    tripurantakah || 9|| shivah patreshu vasati phale ganapatistatha | gangapatistvacayam tu majjayam
    bhagavanbhavah || 10|| ishvarastu prashakhasu sarvo'yam haravallabhah | harah karpuradhavalo yathavadvarnitah
    sada || 11|| tatha hyayam brahmarupah sitavarno mahabhagah | cintito ripunashaya papasamshoshanaya
    ca || 12|| manorathapradanaya jayate natra samshayah | guruvare samayate caturmasye tathaiva ca ||
    13|| pujitashca stuto dhyatah sarvaduhkhavinashakah || 14|| devastutyo devabijam param yanmurtam brahma
    brahmavrikshatvamaptam | nityam sevyah shraddhaya sthanurupashcaturmasye sevitah papaha syat || 15||
    iti shriskandapurane nagarakhande ashtacatvarimshadhikadvishatatamadhyayantargatam palashamahimastotram
    samaptam | skandapurana | nagarakhanda | adhyaya 248
  devanagari: पलाशमहिमास्तोत्रम् वाण्युवाच । पलाशो हरिरूपेण सेव्यते हि पुराविदैः । बहुभिर्ह्युपचारैस्तु
    ब्रह्मवृक्षस्य सेवनम् ॥ १॥ सर्वकामप्रदं प्रोक्तं महापातकनाशनम् । त्रीणि पत्राणि पालाशे मध्यमं विष्णुशापितम्
    ॥ २॥ वामे ब्रह्मा दक्षिणे च हर एकः प्रकीर्तितः । पलाशपात्रे यो भुङ्क्ते नित्यमेव नरोत्तमः ॥ ३॥ अश्वमेधसहस्रस्य
    फलं प्राप्नोत्यसंशयम् । चातुर्मास्ये विशेषेण भोक्तुर्मोक्षप्रदं भवेत् ॥ ४॥ पयसा वाथ दुग्धेन रविवारेऽनिशं
    यदि । चातुर्मास्येऽर्चितो यैस्तु ते यान्ति परमं पदम् ॥ ५॥ दृश्यते यदि पालाशः प्रातरुत्थाय मानवैः ।
    नरकानाशु निर्धूय गम्यते परमं पदम् ॥ ६॥ पालाशः सर्वदेवानामाधारो धर्मसाधनम् । यत्र लोभस्तु तस्य स्यात्तत्र
    पूज्यो महातरुः ॥ ७॥ यथा सर्वेषु वर्णेषु विप्रो मुख्यतमो भवेत् । मध्ये सर्वतरूणां च ब्रह्मवृक्षो महोत्तमः
    ॥ ८॥ यस्य मूले हरो नित्यं स्कन्धे शूलधरःस्वयम् । शाखासु भगवान् रुद्रः पुष्पेषु त्रिपुरान्तकः ॥ ९॥
    शिवः पत्रेषु वसति फले गणपतिस्तथा । गङ्गापतिस्त्वचायां तु मज्जायां भगवान्भवः ॥ १०॥ ईश्वरस्तु प्रशाखासु
    सर्वोऽयं हरवल्लभः । हरः कर्पूरधवलो यथावद्वर्णितः सदा ॥ ११॥ तथा ह्ययं ब्रह्मरूपः सितवर्णो महाभगः ।
    चिन्तितो रिपुनाशाय पापसंशोषणाय च ॥ १२॥ मनोरथप्रदानाय जायते नात्र संशयः । गुरुवारे समायाते चातुर्मास्ये
    तथैव च ॥ १३॥ पूजितश्च स्तुतो ध्यातः सर्वदुःखविनाशकः ॥ १४॥ देवस्तुत्यो देवबीजं परं यन्मूर्तं ब्रह्म
    ब्रह्मवृक्षत्वमाप्तम् । नित्यं सेव्यः श्रद्धया स्थाणुरूपश्चातुर्मास्ये सेवितः पापहा स्यात् ॥ १५॥ इति
    श्रीस्कन्दपुराणे नागरखण्डे अष्टचत्वारिंशाधिकद्विशततमाध्यायान्तर्गतं पलाशमहिमास्तोत्रं समाप्तम् । स्कन्दपुराण
    । नागरखण्ड । अध्याय २४८
