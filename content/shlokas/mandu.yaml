id: mandu
category: upanishad
name:
  english: mandu
  devanagari: मान्दु
content:
  english: sarvam tasyopavyakhyanam bhutam bhavad bhavishyaditi sarvamonkara eva yaccanyat trikalatitam
    tadapyonkara eva || 1|| sarvam hyetad brahmayamatma brahma so'yamatma catushpat || 2|| jagaritasthano
    bahishprajnah saptanga ekonavimshatimukhah sthulabhugvaishvanarah prathamah padah || 3|| svapnasthano'ntahprajnah
    saptanga ekonavimshatimukhah praviviktabhuktaijaso dvitiyah padah || 4|| yatra supto na kancana kamam
    kamayate na kancana svapnam pashyati tat sushuptam | sushuptasthana ekibhutah prajnanaghana evanandamayo
    hyanandabhuk cetomukhah prajnastritiyah padah || 5|| esha sarveshvarah esha sarvajna esho'ntaryamyesha
    yonih sarvasya prabhavapyayau hi bhutanam || 6|| nantahprajnam na bahishprajnam nobhayatahprajnam
    na prajnanaghanam na prajnam naprajnam | adrishtamavyavaharyamagrahyamalakshanam acintyamavyapadeshyamekatmapratyayasaram
    prapancopashamam shantam shivamadvaitam caturtham manyante sa atma sa vijneyah || 7|| so'yamatmadhyaksharamonkaro'dhimatram
    pada matra matrashca pada akara ukaro makara iti || 8|| jagaritasthano vaishvanaro'karah prathama
    matra''pteradimattvad va''pnoti ha vai sarvan kamanadishca bhavati ya evam veda || 9|| svapnasthanastaijasa
    ukaro dvitiya matrotkarshat ubhayatvadvotkarshati ha vai jnanasantatim samanashca bhavati nasyabrahmavitkule
    bhavati ya evam veda || 10|| sushuptasthanah prajno makarastritiya matra miterapiterva minoti ha va
    idam sarvamapitishca bhavati ya evam veda || 11|| amatrashcaturtho'vyavaharyah prapancopashamah shivo'dvaita
    evamonkara atmaiva samvishatyatmana''tmanam ya evam veda || 12|| || iti mandukyopanishat samapta ||
  devanagari: सर्वं तस्योपव्याख्यानं भूतं भवद् भविष्यदिति सर्वमोङ्कार एव यच्चान्यत् त्रिकालातीतं तदप्योङ्कार
    एव ॥ १॥ सर्वं ह्येतद् ब्रह्मायमात्मा ब्रह्म सोऽयमात्मा चतुष्पात् ॥ २॥ जागरितस्थानो बहिष्प्रज्ञः सप्ताङ्ग
    एकोनविंशतिमुखः स्थूलभुग्वैश्वानरः प्रथमः पादः ॥ ३॥ स्वप्नस्थानोऽन्तःप्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः
    प्रविविक्तभुक्तैजसो द्वितीयः पादः ॥ ४॥ यत्र सुप्तो न कञ्चन कामं कामयते न कञ्चन स्वप्नं पश्यति तत्
    सुषुप्तम् । सुषुप्तस्थान एकीभूतः प्रज्ञानघन एवानन्दमयो ह्यानन्दभुक् चेतोमुखः प्राज्ञस्तृतीयः पादः
    ॥ ५॥ एष सर्वेश्वरः एष सर्वज्ञ एषोऽन्तर्याम्येष योनिः सर्वस्य प्रभवाप्ययौ हि भूतानाम् ॥ ६॥ नान्तःप्रज्ञं
    न बहिष्प्रज्ञं नोभयतःप्रज्ञं न प्रज्ञानघनं न प्रज्ञं नाप्रज्ञम् । अदृष्टमव्यवहार्यमग्राह्यमलक्षणं
    अचिन्त्यमव्यपदेश्यमेकात्मप्रत्ययसारं प्रपञ्चोपशमं शान्तं शिवमद्वैतं चतुर्थं मन्यन्ते स आत्मा स विज्ञेयः
    ॥ ७॥ सोऽयमात्माध्यक्षरमोङ्कारोऽधिमात्रं पादा मात्रा मात्राश्च पादा अकार उकारो मकार इति ॥ ८॥ जागरितस्थानो
    वैश्वानरोऽकारः प्रथमा मात्राऽऽप्तेरादिमत्त्वाद् वाऽऽप्नोति ह वै सर्वान् कामानादिश्च भवति य एवं वेद
    ॥ ९॥ स्वप्नस्थानस्तैजस उकारो द्वितीया मात्रोत्कर्षात् उभयत्वाद्वोत्कर्षति ह वै ज्ञानसन्ततिं समानश्च
    भवति नास्याब्रह्मवित्कुले भवति य एवं वेद ॥ १०॥ सुषुप्तस्थानः प्राज्ञो मकारस्तृतीया मात्रा मितेरपीतेर्वा
    मिनोति ह वा इदं सर्वमपीतिश्च भवति य एवं वेद ॥ ११॥ अमात्रश्चतुर्थोऽव्यवहार्यः प्रपञ्चोपशमः शिवोऽद्वैत
    एवमोङ्कार आत्मैव संविशत्यात्मनाऽऽत्मानं य एवं वेद ॥ १२॥ ॥ इति माण्डूक्योपनिषत् समाप्ता ॥
