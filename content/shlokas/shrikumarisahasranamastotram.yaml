id: shrikumarisahasranamastotram
category: stotram
name:
  english: shrikumarisahasranamastotram
  devanagari: श्रीकुमारीसहस्रनामस्तोत्रम्
content:
  english: rinu sarveshvarapriya | ashtottarasahasrakhyam kumaryah paramadbhutam || 4|| pathittva dharayittva
    va naro mucyeta sankatat | sarvatra durlabham dhanyam dhanyalokanishevitam || 5|| animadyashtasiddhyangam
    sarvanandakaram param | mayamantranirastangam mantrasiddhiprade nrinam || 6|| na puja na japam snanam
    purashcaryavidhishca na | akasmat siddhimavapnoti sahasranamapathatah || 7|| sarvayajnaphalam natha
    prapnoti sadhakah kshanat | mantrartham mantracaitanyam yonimudrasvarupakam || 8|| kotivarshashatenapi
    phalam vaktum na shakyate | tathapi vaktumicchami hitaya jagatam prabho || 9|| asyah shrikumaryah
    sahasranamakavacasya vatukabhairavarishih | anushtupchandah | kumaridevata | sarvamantrasiddhisamriddhaye
    viniyogah || 10|| om kumari kaushiki kali kurukulla kuleshvari | kanakabha kancanabha kamala kalakamini
    || 11|| kapalini kalarupa kaumari kulapalika | kanta kumarakanta ca karana karigamini || 12|| kandhakanta
    kaulakanta kritakarmaphalaprada | karyakaryapriya kaksha kamsahantri kurukshaya || 13|| krishnakanta
    kalaratrih karneshudharinikara | kamaha kapila kala kalika kurukamini || 14|| kurukshetrapriya kaula
    kunti kamatura kaca | kalanjabhaksha kaikeyi kakapucchadhvaja kala || 15|| kamala kamalakshmi ca kamalananakamini
    | kamadhenusvarupa ca kamaha kamamadini || 16|| kamada kamapujya ca kamatita kalavati | bhairavi karanadhya
    ca kaishori kushalangala || 17|| kambugriva krishnanibha kamarajapriyakritih | kankanalankrita kanka
    kevala kakini kira || 18|| kiratini kakabhaksha karalavadana krisha | keshini keshiha kesha kasambashtha
    karipriya || 19|| kavinathasvarupa ca katuvani katusthita | kotara kotarakshi ca karanatakavasini
    || 20|| katakastha kashthasamstha kandarpa ketaki priya | kelipriya kambalastha kaladaityavinashini
    || 21|| ketakipushpashobhadhya karpurapurnajihvika | karpurakarakakola kailasagirivasini || 22|| kushasanastha
    kadamba kunjareshi kulanana | kharba khadgadhara khadga khalaha khalabuddhida || 23|| khanjana khararupa
    ca ksharamlatiktamadhyaga | khelana khetakakara kharavakya kharotkata || 24|| khadyotacancala khela
    khadyota khagavahini | khetakastha khalakhastha khecari khecarapriya || 25|| khacara kharaprema khaladhya
    khacaranana | khecareshi kharogra ca khecarapriyabhashini || 26|| kharjurasavasammatta kharjuraphalabhogini
    | khatamadhyasthita khata khatambuparipurini || 27|| khyatih khyatajalananda khulana khanjanagatih
    | khalva khalatara khari kharodveganikrintani || 28|| gaganastha ca bhita ca gabhiranadini gaya |
    ganga gabhira gauri ca gananatha priya gatih || 29|| gurubhakta gvalihina gehini gopini gira | goganastha
    ganapatya girija giripujita || 30|| girikanta ganastha ca girikanya ganeshvari | gadhirajasuta griva
    gurvi gurvyambashankari || 31|| gandharvvakamini gita gayatri gunada guna | guggulustha guroh pujya
    gitanandaprakashini || 32|| gayasurapriyageha gavakshajalamadhyaga | gurukanya guroh patni gahana
    gurunagini || 33|| gulphavayusthita gulpha garddabha garddabhapriya | guhya guhyaganastha ca garima
    gaurika guda || 34|| gudordhvastha ca galita ganika golaka gala | gandharvi gananagari gandharvaganapujita
    || 35|| ghoranada ghoramukhi ghora gharmanivarini | ghanada ghanavarna ca ghanavahanavahana || 36||
    ghargharadhvanicapala ghataghatapataghata | ghatita ghatana ghona ghanarupa ghaneshvari || 37|| ghunyatita
    gharghara ca ghorananavimohini | ghoranetra ghanaruca ghorabhairava kanyaka || 38|| ghataghatakaha
    ghatya ghranaghraneshavayavi | ghorandhakarasamstha ca ghasana ghasvara ghara || 39|| ghotakestha
    ghotaka ca ghotakeshvaravahana | ghananilamanishyama gharghareshvarakamini || 40|| nakarakutasampanna
    nakaracakragamini | nakari nasamsha caiva nipanita nakarini || 41|| candramandalamadhyastha catura
    caruhasini | carucandramukhi caiva calangamagatipriya || 42|| cancala capala candi cekitana carusthita
    | calita canana carvvo carubhramaranadini || 43|| cauraha candranilaya caindri candrapurasthita |
    cakrakaula cakrarupa cakrastha cakrasiddhida || 44|| cakrini cakrahasta ca cakranathakulapriya | cakrabhedya
    cakrakula cakramandalashobhita || 45|| cakreshvarapriya cela celajinakushottara | caturvedasthita
    canda candrakotisushitala || 46|| caturguna candravarna caturi caturapriya | cakshuhstha cakshuvasatishcanaka
    canakapriya || 47|| carvvangi candranilaya caladambujalocana | carvvarisha carumukhi carudanta carasthita
    || 48|| casakasthasava ceta cetahstha caitrapujita | cakshushi candramalini candrahasamaniprabha ||
    49|| chalastha chudrarupa ca chatracchayachalasthita | chalajna cheshvarachaya chaya chinnashiva chala
    || 50|| chatracamarashobhadhya chatrinam chatradharini | chinnatita chinnamasta chinnakesha chalodbhava
    || 51|| chalaha chalada chaya channa channajanapriya | chalachinna chadmavati chadmasadmanivasini
    || 52|| chadmagandha chadachanna chadmaveshi chakarika | chagala raktabhaksha ca chagalamodaraktapa
    || 53|| chagalandeshakanya ca chagalandakumarika | churika churikakara churikarinivashini || 54||
    chinnanasha chinnahasta chonalola chalodari | chalodvega changabijamala changavaraprada || 55|| jatila
    jatharashrida jara jajnapriya jaya | jantrastha jivaha jiva jayada jivayogada || 56|| jayini jamalastha
    ca jamalodbhavanayika | jamalapriyakanya ca jamaleshi javapriya || 57|| javakotisamaprakhya javapushpapriya
    jana | jalastha jagavishaya jaratita jalasthita || 58|| jivaha jivakanya ca janarddanakumarika | jatuka
    jalapujya ca jagannathadikamini || 59|| jirnangi jirnahina ca jimutattyantashobhita | jamada jamada
    jrimbha jrimbhanastradidharini || 60|| jaghanya jaraja prita jagadanandavaddhini | jamalarjunadarpaghni
    jamalarjunabhanjini || 61|| jayitrijagadananda jamalollasasiddhida | japamala japyasiddhirjapayajnaprakashini
    || 62|| jambuvati jambavatah kanyakajanavajapa | javahantri jagadbuddhirjjagatkartri jagadgatih ||
    63|| janani jivani jaya jaganmata janeshvari | jhankala jhankamadhyastha jhanatkarasvarupini || 64||
    jhanatjhanadvahnirupa jhananajhandarishvari | jhatitaksha jhara jhanjha jharjhara jharakanyaka ||
    65|| jhanatkari jhana jhanna jhakaramalayavrita | jhankari jharjhari jhalli jhalveshvaranivasini ||
    66|| nakari nakirati ca nakarabijamalini | nanayo'nta nakaranta nakaraparameshvari || 67|| nantabijaputakara
    nekale naikagamini | naikanela nasvarupa nahara naharitaki || 68|| tuntuni tankahasta ca tantavarga
    talavati | tapala tapabalakhya tankaradhvanirupini || 69|| talati taksharatita titkaradikumarika |
    tankastradharini tana tamotarnalabhashini || 70|| tankari vidhana taka takatakavimohini | tankaradharanamaha
    tivikhecaranadini || 71|| thathankari thatharupa thakarabijakarana | damarupriyavadya ca damarastha
    dabijika || 72|| dantavarga damaruka darastha doradamara | dagararddha dalatita dadarukeshvari duta
    || 73|| dharddhanarishvara dhama dhakkari dhalana dhala | dhakestha dheshvarasuta dhemanabhavadhonana
    || 74|| nomakanteshvari nantavargastha natunavati | nano manankakalyani nakshavinakshabijika || 75||
    tulasitantusukshmakhya taralya tailagandhika | tapasya tapasasuta tarini taruni tala || 76|| tantrastha
    tarakabrahmasvarupa tantumadhyaga | talabhakshatridhamuttistaraka tailabhakshika || 77|| tarogra talamala
    ca takara tintidipriya | tapasah talasandarbha tarjayanti kumarika || 78|| tokacara talodvega takshaka
    takshakapriya | takshakalankrita tosha tavadrupa talapriya || 79|| talastradharini tapa tapasam phaladayini
    | talvalvapraharalita talarigananashini || 80|| tula tauli tolaka ca talastha talapalika taruna taptabuddhisthastapta
    pradharini tapa || 81|| tantraprakashakarani tantrarthadayini tatha | tusharakiranangi ca caturdha
    va samaprabha || 82|| tailamargabhisuta ca tantrasiddhiphalaprada | tamraparna tamrakesha tamrapatrapriyatama
    || 83|| tamogunapriya tola takshakarinivarini | toshayukta tamayaci tamashodheshvarapriya || 84||
    tulana tulyarucira tulyabuddhistridha matih | takrabhaksha talasiddhih tatrasthastatra gamini || 85||
    talaya tailabha tali tantragopanatatpara | tantramantraprakasha ca trisharenusvarupini || 86|| trimshadarthapriya
    tushta tushtistushtajanapriya | thakarakutadandisha thadandishapriya'thava || 87|| thakarakshararudhangi
    thantavargatha karika | thanta thamishvari thaka thakarabijamalini || 88|| dakshadamapriya dosha doshajalavanashrita
    | dasha dashanaghora ca devidasapriya daya || 89|| daityahantripara daitya daityanam maddini disha
    | danta dantapriya dasa damana dirghakeshika || 90|| dashana raktavarna ca darigrahanivasini devamata
    ca durlabha ca dirghanga dasakanyaka || 91|| dashanashri dirghanetra dirghanasa ca doshaha | damayanti
    dalastha ca dveshyahantri dashasthita || 92|| daisheshika dishigata dashanastravinashini daridryaha
    daridrastha daridradhanadayini || 93|| dantura deshabhasha ca deshastha deshanayika | dvesharupa dveshahantri
    dveshariganamohini || 94|| damodarasthananada dalanam baladayini | digdarshana darshanastha darshanapriyavadini
    || 95|| damodarapriya danta damodarakalevara | dravini dravini daksha dakshakanya daladridha || 96||
    dridhasanadasashaktirdvandvayuddhaprakashini | dadhipriya dadhistha ca dadhimangalakarini || 97||
    darpaha darpada dripta darbhapunyapriya dadhih | darbhastha drupadasuta draupadi drupadapriya || 98||
    dharmacinta dhanadhyaksha dhashveshvaravaraprada | dhanaha dhanada dhanvi dhanurhasta dhanuhpriya
    || 99|| dharani dhairyarupa ca dhanastha dhanamohini | dhora dhirapriyadhara dharadharanatatpara ||
    100|| dhanyada dhanyabija ca dharmadharmasvarupini | dharadharastha dhanya ca dharmapunjanivasini
    || 101|| dhanadhyapriyakanya ca dhanyalokaishca sevita | dharmarthakamamokshangi dharmarthakamamokshada
    || 102|| dharadhara dhurona ca dhavala dhavalamukhi | dhara ca dhamarupa ca dhruva dhrauvya dhruvapriya
    || 103|| dhaneshi dharanakhya ca dharmanindavinashini | dharmatejomayi dharmya dhairyagrabhargamohini
    || 104|| dharana dhautavasana dhatturaphalabhogini | narayani narendrastha narayanakalevara || 105||
    naranarayanaprita dharmaninda namohita | nitya napitakanya ca nayanastha narapriya || 106|| namni
    namapriya nara narayanasuta nara | navinanayakaprita navya navaphalapriya || 107|| navinakusumaprita
    navinanam dhvajanuta | nari nimbasthitanandanandini nandakarika || 108|| navapushpamahaprita navapushpasugandhika
    | nandanastha nandakanya nandamokshapradayini || 109|| namita namabheda ca namnarttavanamohini | navabuddhipriyaneka
    nakastha namakanyaka || 110|| nindahina navollasa nakasthanapradayini | nimbavrikshasthita nimba nanavrikshanivasini
    || 111|| nashyatita nilavarna nilavarna sarasvati | nabhahstha nayakaprita nayakapriyakamini || 112||
    naivavarna nirahara nivihanam rajahpriya | nimnanabhipriyakara narendrahastapujita || 113|| nalasthita
    nalaprita nalarajakumarika | pareshvari parananda paraparavibhedika || 114|| parama paracakrastha
    parvati parvatapriya | parameshi parvanana pushpamalyapriya para || 115|| para priya pritidatri pritih
    prathamakamini | prathama prathama prita pushpagandhapriya para || 116|| paushyi panarata pina pinastanasushobhana
    | paramanarata pumsam pashahasta pashupriya || 117|| palalanandarasika palaladhumarupini | palashapushpasankasha
    palashapushpamalini || 118|| premabhuta padmamukhi padmaragasumalini | padmamala papahara patipremavilasini
    || 119|| pancananamanohari pancavaktraprakashini | phalamulashana phali phalada phalgunapriya || 120||
    phalanathapriya phalli phalgukanya phalonmukhi | phetkaritantramukhya ca phetkaraganapujita || 121||
    pheravi pheravasuta phalabhogodbhava phala | phalapriya phalashakta phalgunanandadayini || 122|| phalabhogottara
    phela phulambhojanivasini | vasudevagrihastha ca vasavi virapujita || 123|| vishabhaksha budhasuta
    blunkari bluvaraprada | brahmi brihaspatisuta vacaspativaraprada || 124|| vedacara vedyapara vyasavaktrasthita
    vibha | bodhajna vaushadakhya ca vamshivamdanapujita || 125|| vajrakanta vajragatirbadarivamshavivaddhini
    | bharati bhavarashrida bhavapatni bhavatmaja || 126|| bhavani bhavini bhima bhishagbharya turisthita
    | bhurbhuvahsvahsvarupa ca bhrishartta bhekanadini || 127|| bhauti bhangapriya bhangabhangaha bhangaharini
    | bharta bhagavati bhagya bhagirathanamaskrita || 128|| bhagamala bhutanatheshvari bhargavapujita
    | bhriguvamsha bhitihara bhumirbhujagaharini || 129|| bhalacandrabhabhalvabala bhavabhutivibhutida
    | makarastha mattagatirmadamatta madapriya || 130|| madirashtadashabhuja madira mattagamini | madirasiddhida
    madhya madantargatisiddhida || 131|| minabhaksha minarupa mudramudgapriya gatih | mushala muktida
    murtta mukikaranatatpara || 132|| mrishartta mrigatrishna ca meshabhakshanatatpara | maithunanandasiddhishca
    maithunanalasiddhida || 133|| mahalakshmirbhairavi ca mahendrapithanayika | manahstha madhavimukhya
    mahadevamanorama || 134|| yashoda yacana yasya yamarajapriya yama | yashorashivibhushangi yatipremakalavati
    || 135|| ramani ramapatni ca ripuha ritimadhyaga | rudrani rupada rupa rupasundaradharini || 136||
    retahstha retasah prita retahsthananivasini | rendradevasutareda ripuvargantakapriya || 137|| romavalindrajanani
    romakupajagatpatih | raupyavarna raudravarna raupyalankarabhushana || 138|| rangina rangaragastha
    ranavahnikuleshvari | lakshmih langalahasta ca langali kulakamini || 139|| lipirupa lidhapada latatantusvarupini
    | limpati leliha lola lomashapriyasiddhida || 140|| laukiki laukikisiddhirlankanathakumarika | lakshmana
    lakshmihina ca lapriya larnamadhyaga || 141|| vivasa vasanavesha vivasyakulakanyaka | vatastha vatarupa
    ca velamadhyanivasini || 142|| shmashanabhumimadhyastha shmashanasadhanapriya | shavastha parasiddhyarthi
    shavavakshasi shobhita || 143|| sharanagatapalya ca shivakanya shivapriya | shatcakrabhedini shodha
    nyasajaladridhanana || 144|| sandhyasarasvati sundya suryaga sharada sati | haripriya harahalalavanyastha
    kshama kshudha || 145|| kshetrajna siddhidatri ca ambika caparajita | adya indrapriya isha uma udha
    ritupriya || 146|| sutunda svarabijanta hariveshadisiddhida | ekadashivratastha ca endri oshadhisiddhida
    || 147|| aupakari amsharupa astrabijaprakashini | ityetat kamukinatha kumarinam sumangalam || 148||
    trailokyaphaladam nityamashtottarasahasrakam | mahastotram dharmasaram dhanadhanyasutapradam || 149||
    sarvavidyaphalollasam bhaktiman yah pathet sudhih | sa sarvada divaratrau sa bhavenmuktimargagah ||
    150|| sarvatra jayamapnoti viranam vallabho labhet | sarve deva vasham yanti vashibhutashca manavah
    || 151|| brahmande ye ca shamsanti te tushta natra samshayah | ye vashanti ca bhurloke devatulyaparakramah
    || 152|| te sarve bhrityatulyashca satyam satyam kuleshvara | akasmat siddhimapnoti homena yajanena
    ca || 153|| japyena kavacadyena mahastotrarthapathatah | vina yajnaivina danaivina japyairlabhet phalam
    || 154|| yah pathet stotrakam nama cashtottarasahasrakam | tasya shantirbhavet kshipram kanyastotram
    pathettatah || 155|| varatrayam prapathena rajanam vashamanayet | varaikapathito mantri dharmarthakamamokshabhak
    || 156|| tridinam prapathedvidvan yadi putram samicchati | varatrayakramenaiva varaikakramato'pi va
    || 157|| pathittva dhanaratnanamadhipah sarvavittagah | trijaganmohayenmantri vatsararddham prapathatah
    || 158|| vatsaram vapya yadi va bhaktibhavena yah pathet | cirajivi khecarattvam prapya yogi bhavennarah
    || 159|| mahadurasthitam varnam pashyati sthiramanasah | mahilamandale sthittva shaktiyuktah pathet
    sudhih || 160|| sa bhavetsadhakashreshthah kshiri kalpadrumo bhavet | sarvada yah pathennatha bhavodgatakalevarah
    || 161|| darshanat stambhanam karttum kshamo bhavati sadhakah | jaladistambhane shakto vahnistambhadisiddhibhak
    || 162|| vayuvegi mahavagmi vedajno bhavati dhruvam | kavinatho mahavidyo vandhakah pandito bhavet
    || 163|| sarvadeshadhipo bhuttva deviputrah svayam bhavet | kantim shriyam yasho vriddhim prapnoti
    balavan yatih || 164|| ashtasiddhiyuto natha yah pathedarthasiddhaye | ujjate'ranyamadhye ca parvate
    ghorakanane || 165|| vane va pretabhumau ca shavopari maharane | grame bhagnagrihe vapi shunyagare
    naditate || 166|| gangagarbhe mahapithe yonipithe gurorgrihe | dhanyakshetre devagrihe kanyagare kulalaye
    || 167|| prantare goshthamadhye va rajadibhayahinake | nirbhayadisvadesheshu shivalingalaye'thava
    || 168|| bhutagartte caikalingai va shunyadeshe nirakule | ashvatthamule bilve va kulavrikshasamipage
    || 169|| anyeshu siddhadesheshu kularupashca sadhakah | divye va virabhavastho yashtva kanyam kulakulai
    || 170|| kuladravyaishca vividhaih siddhidravyaishca sadhakah | mamsasavena juhuyanmuktena rasena
    ca || 171|| hutashesham kuladravyam tabhyo dadyat susiddhaye | tasamucchishtamaniya juhuyad raktapankaje
    || 172|| ghrinalajjavinirmuktah sadhakah sthiramanasah | pibenmamsarasam mantri sadanando mahabali
    || 173|| mahamamsashtakam tabhyo madirakumbhapuritam | taro maya ramavahnijayamantram pathet sudhih
    || 174|| nivedya vidhinanena pathittva stotramangalam | svayam prasadam bhuktva hi sarvavidyadhipo
    bhavet || 175|| shukarasyoshtrmamsena pinaminena mudraya | mahasavaghatenapi dattva pathati yo narah
    || 176|| dhruvam sa sarvagami syad vina homena pujaya | rudrarupo bhavennityam mahakalatmako bhavet
    || 177|| sarvapunyaphalam natha kshanat prapnoti sadhakah | kshirabdhiratnakoshesho viyadvyapi ca
    yogirat || 178|| bhaktyahladam dayasindhum nishkamattvam labhed dhruvam | mahashatrupatane ca mahashatrubhayaddite
    || 179|| varaikapathamatrena shatrunam vadhamanayet | samardayet shatrun kshipramandhakaram yatha
    ravih || 180|| uccatane marane ca bhaye ghoratare ripau | pathanaddharananmarttyo deva va rakshasadayah
    || 181|| prapnuvanti jhatit shantim kumarinamapathatah | purusho dakshine bahau nari vamakare tatha
    || 182|| dhritva putradisampattim labhate natra samshayah || 183|| mamajnaya mokshamupaiti sadhako
    gajantakam natha sahasranama ca | pathenmanushyo yahi bhaktibhavata
  devanagari: ृणु सर्वेश्वरप्रिय । अष्टोत्तरसहस्राख्यं कुमार्याः परमाद्भुतम् ॥ ४॥ पठित्त्वा धारयित्त्वा
    वा नरो मुच्येत सङ्कटात् । सर्वत्र दुर्लभं धन्यं धन्यलोकनिषेवितम् ॥ ५॥ अणिमाद्यष्टसिद्ध्यङ्गं सर्वानन्दकरं
    परम् । मायामन्त्रनिरस्ताङ्गं मन्त्रसिद्धिप्रदे नृणाम् ॥ ६॥ न पूजा न जपं स्नानं पुरश्चर्याविधिश्च न
    । अकस्मात् सिद्धिमवाप्नोति सहस्रनामपाठतः ॥ ७॥ सर्वयज्ञफलं नाथ प्राप्नोति साधकः क्षणात् । मन्त्रार्थं
    मन्त्रचैतन्यं योनिमुद्रास्वरूपकम् ॥ ८॥ कोटिवर्षशतेनापि फलं वक्तुं न शक्यते । तथापि वक्तुमिच्छामि हिताय
    जगतां प्रभो ॥ ९॥ अस्याः श्रीकुमार्याः सहस्रनामकवचस्य वटुकभैरवऋषिः । अनुष्टुप्छन्दः । कुमारीदेवता ।
    सर्वमन्त्रसिद्धिसमृद्धये विनियोगः ॥ १०॥ ॐ कुमारी कौशिकी काली कुरुकुल्ला कुलेश्वरी । कनकाभा काञ्चनाभा
    कमला कालकामिनी ॥ ११॥ कपालिनी कालरूपा कौमारी कुलपालिका । कान्ता कुमारकान्ता च कारणा करिगामिनी ॥ १२॥
    कन्धकान्ता कौलकान्ता कृतकर्मफलप्रदा । कार्याकार्यप्रिया कक्षा कंसहन्त्री कुरुक्षया ॥ १३॥ कृष्णकान्ता
    कालरात्रिः कर्णेषुधारिणीकरा । कामहा कपिला काला कालिका कुरुकामिनी ॥ १४॥ कुरुक्षेत्रप्रिया कौला कुन्ती
    कामातुरा कचा । कलञ्जभक्षा कैकेयी काकपुच्छध्वजा कला ॥ १५॥ कमला कामलक्ष्मी च कमलाननकामिनी । कामधेनुस्वरूपा
    च कामहा काममदीनी ॥ १६॥ कामदा कामपूज्या च कामातीता कलावती । भैरवी कारणाढ्या च कैशोरी कुशलाङ्गला ॥ १७॥
    कम्बुग्रीवा कृष्णनिभा कामराजप्रियाकृतिः । कङ्कणालङ्कृता कङ्का केवला काकिनी किरा ॥ १८॥ किरातिनी काकभक्षा
    करालवदना कृशा । केशिनी केशिहा केशा कासाम्बष्ठा करिप्रिया ॥ १९॥ कविनाथस्वरूपा च कटुवाणी कटुस्थिता ।
    कोटरा कोटराक्षी च करनाटकवासिनी ॥ २०॥ कटकस्था काष्ठसंस्था कन्दर्पा केतकी प्रिया । केलिप्रिया कम्बलस्था
    कालदैत्यविनाशिनी ॥ २१॥ केतकीपुष्पशोभाढ्या कर्पूरपूर्णजिह्विका । कर्पूराकरकाकोला कैलासगिरिवासिनी ॥
    २२॥ कुशासनस्था कादम्बा कुञ्जरेशी कुलानना । खर्बा खड्गधरा खड्गा खलहा खलबुद्धिदा ॥ २३॥ खञ्जना खररूपा
    च क्षाराम्लतिक्तमध्यगा । खेलना खेटककरा खरवाक्या खरोत्कटा ॥ २४॥ खद्योतचञ्चला खेला खद्योता खगवाहिनी
    । खेटकस्था खलाखस्था खेचरी खेचरप्रिया ॥ २५॥ खचरा खरप्रेमा खलाढ्या खचरानना । खेचरेशी खरोग्रा च खेचरप्रियभाषिणी
    ॥ २६॥ खर्जूरासवसंमत्ता खर्जूरफलभोगिनी । खातमध्यस्थिता खाता खाताम्बुपरिपूरिणी ॥ २७॥ ख्यातिः ख्यातजलानन्दा
    खुलना खञ्जनागतिः । खल्वा खलतरा खारी खरोद्वेगनिकृन्तनी ॥ २८॥ गगनस्था च भीता च गभीरनादिनी गया । गङ्गा
    गभीरा गौरी च गणनाथ प्रिया गतिः ॥ २९॥ गुरुभक्ता ग्वालिहीना गेहिनी गोपिनी गिरा । गोगणस्था गाणपत्या गिरिजा
    गिरिपूजिता ॥ ३०॥ गिरिकान्ता गणस्था च गिरिकन्या गणेश्वरी । गाधिराजसुता ग्रीवा गुर्वी गुर्व्यम्बशाङ्करी
    ॥ ३१॥ गन्धर्व्वकामिनी गीता गायत्री गुणदा गुणा । गुग्गुलुस्था गुरोः पूज्या गीतानन्दप्रकाशिनी ॥ ३२॥
    गयासुरप्रियागेहा गवाक्षजालमध्यगा । गुरुकन्या गुरोः पत्नी गहना गुरुनागिनी ॥ ३३॥ गुल्फवायुस्थिता गुल्फा
    गर्द्दभा गर्द्दभप्रिया । गुह्या गुह्यगणस्था च गरिमा गौरिका गुदा ॥ ३४॥ गुदोर्ध्वस्था च गलिता गणिका
    गोलका गला । गान्धर्वी गाननगरी गन्धर्वगणपूजिता ॥ ३५॥ घोरनादा घोरमुखी घोरा घर्मनिवारिणी । घनदा घनवर्णा
    च घनवाहनवाहना ॥ ३६॥ घर्घरध्वनिचपला घटाघटपटाघटा । घटिता घटना घोना घनरुप घनेश्वरी ॥ ३७॥ घुण्यातीता घर्घरा
    च घोराननविमोहिनी । घोरनेत्रा घनरुचा घोरभैरव कन्यका ॥ ३८॥ घाताघातकहा घात्या घ्राणाघ्राणेशवायवी । घोरान्धकारसंस्था
    च घसना घस्वरा घरा ॥ ३९॥ घोटकेस्था घोटका च घोटकेश्वरवाहना । घननीलमणिश्यामा घर्घरेश्वरकामिनी ॥ ४०॥ ङकारकूटसम्पन्ना
    ङकारचक्रगामिनी । ङकारी ङसंशा चैव ङीपनीता ङकारिणी ॥ ४१॥ चन्द्रमण्डलमध्यस्था चतुरा चारुहासिनी । चारुचन्द्रमुखी
    चैव चलङ्गमगतिप्रिया ॥ ४२॥ चञ्चला चपला चण्डी चेकिताना चरुस्थिता । चलिता चानना चार्व्वो चारुभ्रमरनादिनी
    ॥ ४३॥ चौरहा चन्द्रनिलया चैन्द्री चन्द्रपुरस्थिता । चक्रकौला चक्ररूपा चक्रस्था चक्रसिद्धिदा ॥ ४४॥ चक्रिणी
    चक्रहस्ता च चक्रनाथकुलप्रिया । चक्राभेद्या चक्रकुला चक्रमण्डलशोभिता ॥ ४५॥ चक्रेश्वरप्रिया चेला चेलाजिनकुशोत्तरा
    । चतुर्वेदस्थिता चण्डा चन्द्रकोटिसुशीतला ॥ ४६॥ चतुर्गुणा चन्द्रवर्णा चातुरी चतुरप्रिया । चक्षुःस्था
    चक्षुवसतिश्चणका चणकप्रिया ॥ ४७॥ चार्व्वङ्गी चन्द्रनिलया चलदम्बुजलोचना । चर्व्वरीशा चारुमुखी चारुदन्ता
    चरस्थिता ॥ ४८॥ चसकस्थासवा चेता चेतःस्था चैत्रपूजिता । चाक्षुषी चन्द्रमलिनी चन्द्रहासमणिप्रभा ॥ ४९॥
    छलस्था छुद्ररूपा च छत्रच्छायाछलस्थिता । छलज्ञा छेश्वराछाया छाया छिन्नशिवा छला ॥ ५०॥ छत्राचामरशोभाढ्या
    छत्रिणां छत्रधारिणी । छिन्नातीता छिन्नमस्ता छिन्नकेशा छलोद्भवा ॥ ५१॥ छलहा छलदा छाया छन्ना छन्नजनप्रिया
    । छलछिन्ना छद्मवती छद्मसद्मनिवासिनी ॥ ५२॥ छद्मगन्धा छदाछन्ना छद्मवेशी छकारिका । छगला रक्तभक्षा च छगलामोदरक्तपा
    ॥ ५३॥ छगलण्डेशकन्या च छगलण्डकुमारिका । छुरिका छुरिककरा छुरिकारिनिवाशिनी ॥ ५४॥ छिन्ननाशा छिन्नहस्ता
    छोणलोला छलोदरी । छलोद्वेगा छाङ्गबीजमाला छाङ्गवरप्रदा ॥ ५५॥ जटिला जठरश्रीदा जरा जज्ञप्रिया जया । जन्त्रस्था
    जीवहा जीवा जयदा जीवयोगदा ॥ ५६॥ जयिनी जामलस्था च जामलोद्भवनायिका । जामलप्रियकन्या च जामलेशी जवाप्रिया
    ॥ ५७॥ जवाकोटिसमप्रख्या जवापुष्पप्रिया जना । जलस्था जगविषया जरातीता जलस्थिता ॥ ५८॥ जीवहा जीवकन्या च
    जनार्द्दनकुमारिका । जतुका जलपूज्या च जगन्नाथादिकामिनी ॥ ५९॥ जीर्णाङ्गी जीर्णहीना च जीमूतात्त्यन्तशोभिता
    । जामदा जमदा जृम्भा जृम्भणास्त्रादिधारिणी ॥ ६०॥ जघन्या जारजा प्रीता जगदानन्दवद्धीनी । जमलार्जुनदर्पघ्नी
    जमलार्जुनभञ्जिनी ॥ ६१॥ जयित्रीजगदानन्दा जामलोल्लाससिद्धिदा । जपमाला जाप्यसिद्धिर्जपयज्ञप्रकाशिनी ॥
    ६२॥ जाम्बुवती जाम्बवतः कन्यकाजनवाजपा । जवाहन्त्री जगद्बुद्धिर्ज्जगत्कर्तृ जगद्गतिः ॥ ६३॥ जननी जीवनी
    जाया जगन्माता जनेश्वरी । झङ्कला झङ्कमध्यस्था झणत्कारस्वरूपिणी ॥ ६४॥ झणत्झणद्वह्निरूपा झननाझन्दरीश्वरी
    । झटिताक्षा झरा झञ्झा झर्झरा झरकन्यका ॥ ६५॥ झणत्कारी झना झन्ना झकारमालयावृता । झङ्करी झर्झरी झल्ली
    झल्वेश्वरनिवासिनी ॥ ६६॥ ञकारी ञकिराती च ञकारबीजमालिनी । ञनयोऽन्ता ञकारान्ता ञकारपरमेश्वरी ॥ ६७॥ ञान्तबीजपुटाकारा
    ञेकले ञैकगामिनी । ञैकनेला ञस्वरूपा ञहारा ञहरीतकी ॥ ६८॥ टुण्टुनी टङ्कहस्ता च टान्तवर्गा टलावती । टपला
    टापबालाख्या टङ्कारध्वनिरूपिणी ॥ ६९॥ टलाती टाक्षरातीता टित्कारादिकुमारिका । टङ्कास्त्रधारिणी टाना टमोटार्णलभाषिणी
    ॥ ७०॥ टङ्कारी विधना टाका टकाटकविमोहिनी । टङ्कारधरनामाहा टिवीखेचरनादिनी ॥ ७१॥ ठठङ्कारी ठाठरूपा ठकारबीजकारणा
    । डमरूप्रियवाद्या च डामरस्था डबीजिका ॥ ७२॥ डान्तवर्गा डमरुका डरस्था डोरडामरा । डगरार्द्धा डलातीता
    डदारुकेश्वरी डुता ॥ ७३॥ ढार्द्धनारीश्वरा ढामा ढक्कारी ढलना ढला । ढकेस्था ढेश्वरसुता ढेमनाभावढोनना
    ॥ ७४॥ णोमाकान्तेश्वरी णान्तवर्गस्था णतुनावती । णनो माणाङ्ककल्याणी णाक्षवीणाक्षबीजिका ॥ ७५॥ तुलसीतन्तुसूक्ष्माख्या
    तारल्या तैलगन्धिका । तपस्या तापससुता तारिणी तरुणी तला ॥ ७६॥ तन्त्रस्था तारकब्रह्मस्वरूपा तन्तुमध्यगा
    । तालभक्षत्रिधामूत्तीस्तारका तैलभक्षिका ॥ ७७॥ तारोग्रा तालमाला च तकरा तिन्तिडीप्रिया । तपसः तालसन्दर्भा
    तर्जयन्ती कुमारिका ॥ ७८॥ तोकाचारा तलोद्वेगा तक्षका तक्षकप्रिया । तक्षकालङ्कृता तोषा तावद्रूपा तलप्रिया
    ॥ ७९॥ तलास्त्रधारिणी तापा तपसां फलदायिनी । तल्वल्वप्रहरालीता तलारिगणनाशिनी ॥ ८०॥ तूला तौली तोलका च
    तलस्था तलपालिका तरुणा तप्तबुद्धिस्थास्तप्ता प्रधारिणी तपा ॥ ८१॥ तन्त्रप्रकाशकरणी तन्त्रार्थदायिनी
    तथा । तुषारकिरणाङ्गी च चतुर्धा वा समप्रभा ॥ ८२॥ तैलमार्गाभिसूता च तन्त्रसिद्धिफलप्रदा । ताम्रपर्णा
    ताम्रकेशा ताम्रपात्रप्रियातमा ॥ ८३॥ तमोगुणप्रिया तोला तक्षकारिनिवारिणी । तोषयुक्ता तमायाची तमषोढेश्वरप्रिया
    ॥ ८४॥ तुलना तुल्यरुचिरा तुल्यबुद्धिस्त्रिधा मतिः । तक्रभक्षा तालसिद्धिः तत्रस्थास्तत्र गामिनी ॥ ८५॥
    तलया तैलभा ताली तन्त्रगोपनतत्परा । तन्त्रमन्त्रप्रकाशा च त्रिशरेणुस्वरूपिणी ॥ ८६॥ त्रिंशदर्थप्रिया
    तुष्टा तुष्टिस्तुष्टजनप्रिया । थकारकूटदण्डीशा थदण्डीशप्रियाऽथवा ॥ ८७॥ थकाराक्षररूढाङ्गी थान्तवर्गाथ
    कारिका । थान्ता थमीश्वरी थाका थकारबीजमालिनी ॥ ८८॥ दक्षदामप्रिया दोषा दोषजालवनाश्रिता । दशा दशनघोरा
    च देवीदासप्रिया दया ॥ ८९॥ दैत्यहन्त्रीपरा दैत्या दैत्यानां मद्दीनी दिशा । दान्ता दान्तप्रिया दासा
    दामना दीर्घकेशिका ॥ ९०॥ दशना रक्तवर्णा च दरीग्रहनिवासिनी देवमाता च दुर्लभा च दीर्घाङ्गा दासकन्यका
    ॥ ९१॥ दशनश्री दीर्घनेत्रा दीर्घनासा च दोषहा । दमयन्ती दलस्था च द्वेष्यहन्त्री दशस्थिता ॥ ९२॥ दैशेषिका
    दिशिगता दशनास्त्रविनाशिनी दारिद्र्यहा दरिद्रस्था दरिद्रधनदायिनी ॥ ९३॥ दन्तुरा देशभाषा च देशस्था देशनायिका
    । द्वेषरूपा द्वेषहन्त्री द्वेषारिगणमोहिनी ॥ ९४॥ दामोदरस्थाननादा दलानां बलदायिनी । दिग्दर्शना दर्शनस्था
    दर्शनप्रियवादिनी ॥ ९५॥ दामोदरप्रिया दान्ता दामोदरकलेवरा । द्राविणी द्रविणी दक्षा दक्षकन्या दलदृढा
    ॥ ९६॥ दृढासनादासशक्तिर्द्वन्द्वयुद्धप्रकाशिनी । दधिप्रिया दधिस्था च दधिमङ्गलकारिणी ॥ ९७॥ दर्पहा दर्पदा
    दृप्ता दर्भपुण्यप्रिया दधिः । दर्भस्था द्रुपदसुता द्रौपदी द्रुपदप्रिया ॥ ९८॥ धर्मचिन्ता धनाध्यक्षा
    धश्वेश्वरवरप्रदा । धनहा धनदा धन्वी धनुर्हस्ता धनुःप्रिया ॥ ९९॥ धरणी धैर्यरूपा च धनस्था धनमोहिनी ।
    धोरा धीरप्रियाधारा धराधारणतत्परा ॥ १००॥ धान्यदा धान्यबीजा च धर्माधर्मस्वरूपिणी । धाराधरस्था धन्या
    च धर्मपुञ्जनिवासिनी ॥ १०१॥ धनाढ्यप्रियकन्या च धन्यलोकैश्च सेविता । धर्मार्थकाममोक्षाङ्गी धर्मार्थकाममोक्षदा
    ॥ १०२॥ धराधरा धुरोणा च धवला धवलामुखी । धरा च धामरूपा च ध्रुवा ध्रौव्या ध्रुवप्रिया ॥ १०३॥ धनेशी धारणाख्या
    च धर्मनिन्दाविनाशिनी । धर्मतेजोमयी धर्म्या धैर्याग्रभर्गमोहिनी ॥ १०४॥ धारणा धौतवसना धत्तूरफलभोगिनी
    । नारायणी नरेन्द्रस्था नारायणकलेवरा ॥ १०५॥ नरनारायणप्रीता धर्मनिन्दा नमोहिता । नित्या नापितकन्या च
    नयनस्था नरप्रिया ॥ १०६॥ नाम्नी नामप्रिया नारा नारायणसुता नरा । नवीननायकप्रीता नव्या नवफलप्रिया ॥ १०७॥
    नवीनकुसुमप्रीता नवीनानां ध्वजानुता । नारी निम्बस्थितानन्दानन्दिनी नन्दकारिका ॥ १०८॥ नवपुष्पमहाप्रीता
    नवपुष्पसुगन्धिका । नन्दनस्था नन्दकन्या नन्दमोक्षप्रदायिनी ॥ १०९॥ नमिता नामभेदा च नाम्नार्त्तवनमोहिनी
    । नवबुद्धिप्रियानेका नाकस्था नामकन्यका ॥ ११०॥ निन्दाहीना नवोल्लासा नाकस्थानप्रदायिनी । निम्बवृक्षस्थिता
    निम्बा नानावृक्षनिवासिनी ॥ १११॥ नाश्यातीता नीलवर्णा नीलवर्णा सरस्वती । नभःस्था नायकप्रीता नायकप्रियकामिनी
    ॥ ११२॥ नैववर्णा निराहारा निवीहाणां रजःप्रिया । निम्ननाभिप्रियाकारा नरेन्द्रहस्तपूजिता ॥ ११३॥ नलस्थिता
    नलप्रीता नलराजकुमारिका । परेश्वरी परानन्दा परापरविभेदिका ॥ ११४॥ परमा परचक्रस्था पार्वती पर्वतप्रिया
    । पारमेशी पर्वनाना पुष्पमाल्यप्रिया परा ॥ ११५॥ परा प्रिया प्रीतिदात्री प्रीतिः प्रथमकामिनी । प्रथमा
    प्रथमा प्रीता पुष्पगन्धप्रिया परा ॥ ११६॥ पौष्यी पानरता पीना पीनस्तनसुशोभना । परमानरता पुंसां पाशहस्ता
    पशुप्रिया ॥ ११७॥ पललानन्दरसिका पलालधूमरूपिणी । पलाशपुष्पसङ्काशा पलाशपुष्पमालिनी ॥ ११८॥ प्रेमभूता पद्ममुखी
    पद्मरागसुमालिनी । पद्ममाला पापहरा पतिप्रेमविलासिनी ॥ ११९॥ पञ्चाननमनोहारी पञ्चवक्त्रप्रकाशिनी । फलमूलाशना
    फाली फलदा फाल्गुनप्रिया ॥ १२०॥ फलनाथप्रिया फल्ली फल्गुकन्या फलोन्मुखी । फेत्कारीतन्त्रमुख्या च फेत्कारगणपूजिता
    ॥ १२१॥ फेरवी फेरवसुता फलभोगोद्भवा फला । फलप्रिया फलाशक्ता फाल्गुनानन्ददायिनी ॥ १२२॥ फालभोगोत्तरा फेला
    फुलाम्भोजनिवासिनी । वसुदेवगृहस्था च वासवी वीरपूजिता ॥ १२३॥ विषभक्षा बुधसुता ब्लुङ्कारी ब्लूवरप्रदा
    । ब्राह्मी बृहस्पतिसुता वाचस्पतिवरप्रदा ॥ १२४॥ वेदाचारा वेद्यपरा व्यासवक्त्रस्थिता विभा । बोधज्ञा
    वौषडाख्या च वंशीवंदनपूजिता ॥ १२५॥ वज्रकान्ता वज्रगतिर्बदरीवंशविवद्धीनी । भारती भवरश्रीदा भवपत्नी भवात्मजा
    ॥ १२६॥ भवानी भाविनी भीमा भिषग्भार्या तुरिस्थिता । भूर्भुवःस्वःस्वरूपा च भृशार्त्ता भेकनादिनी ॥ १२७॥
    भौती भङ्गप्रिया भङ्गभङ्गहा भङ्गहारिणी । भर्ता भगवती भाग्या भगीरथनमस्कृता ॥ १२८॥ भगमाला भूतनाथेश्वरी
    भार्गवपूजिता । भृगुवंशा भीतिहरा भूमिर्भुजगहारिणी ॥ १२९॥ भालचन्द्राभभल्वबाला भवभूतिवीभूतिदा । मकरस्था
    मत्तगतिर्मदमत्ता मदप्रिया ॥ १३०॥ मदिराष्टादशभुजा मदिरा मत्तगामिनी । मदिरासिद्धिदा मध्या मदान्तर्गतिसिद्धिदा
    ॥ १३१॥ मीनभक्षा मीनरूपा मुद्रामुद्गप्रिया गतिः । मुषला मुक्तिदा मूर्त्ता मूकीकरणतत्परा ॥ १३२॥ मृषार्त्ता
    मृगतृष्णा च मेषभक्षणतत्परा । मैथुनानन्दसिद्धिश्च मैथुनानलसिद्धिदा ॥ १३३॥ महालक्ष्मीर्भैरवी च महेन्द्रपीठनायिका
    । मनःस्था माधवीमुख्या महादेवमनोरमा ॥ १३४॥ यशोदा याचना यास्या यमराजप्रिया यमा । यशोराशिविभूषाङ्गी यतिप्रेमकलावती
    ॥ १३५॥ रमणी रामपत्नी च रिपुहा रीतिमध्यगा । रुद्राणी रूपदा रूपा रूपसुन्दरधारिणी ॥ १३६॥ रेतःस्था रेतसः
    प्रीता रेतःस्थाननिवासिनी । रेन्द्रादेवसुतारेदा रिपुवर्गान्तकप्रिया ॥ १३७॥ रोमावलीन्द्रजननी रोमकूपजगत्पतिः
    । रौप्यवर्णा रौद्रवर्णा रौप्यालङ्कारभूषणा ॥ १३८॥ रङ्गिणा रङ्गरागस्था रणवह्निकुलेश्वरी । लक्ष्मीः लाङ्गलहस्ता
    च लाङ्गली कुलकामिनी ॥ १३९॥ लिपिरूपा लीढपादा लतातन्तुस्वरूपिणी । लिम्पती लेलिहा लोला लोमशप्रियसिद्धिदा
    ॥ १४०॥ लौकिकी लौकिकीसिद्धिर्लङ्कानाथकुमारिका । लक्ष्मणा लक्ष्मीहीना च लप्रिया लार्णमध्यगा ॥ १४१॥ विवसा
    वसनावेशा विवस्यकुलकन्यका । वातस्था वातरूपा च वेलमध्यनिवासिनी ॥ १४२॥ श्मशानभूमिमध्यस्था श्मशानसाधनप्रिया
    । शवस्था परसिद्ध्यर्थी शववक्षसि शोभिता ॥ १४३॥ शरणागतपाल्या च शिवकन्या शिवप्रिया । षट्चक्रभेदिनी षोढा
    न्यासजालदृढानना ॥ १४४॥ सन्ध्यासरस्वती सुन्द्या सूर्यगा शारदा सती । हरिप्रिया हरहालालावण्यस्था क्षमा
    क्षुधा ॥ १४५॥ क्षेत्रज्ञा सिद्धिदात्री च अम्बिका चापराजिता । आद्या इन्द्रप्रिया ईशा उमा ऊढा ऋतुप्रिया
    ॥ १४६॥ सुतुण्डा स्वरबीजान्ता हरिवेशादिसिद्धिदा । एकादशीव्रतस्था च एन्द्री ओषधिसिद्धिदा ॥ १४७॥ औपकारी
    अंशरूपा अस्त्रबीजप्रकाशिनी । इत्येतत् कामुकीनाथ कुमारीणां सुमङ्गलम् ॥ १४८॥ त्रैलोक्यफलदं नित्यमष्टोत्तरसहस्रकम्
    । महास्तोत्रं धर्मसारं धनधान्यसुतप्रदम् ॥ १४९॥ सर्वविद्याफलोल्लासं भक्तिमान् यः पठेत् सुधीः । स सर्वदा
    दिवारात्रौ स भवेन्मुक्तिमार्गगः ॥ १५०॥ सर्वत्र जयमाप्नोति वीराणां वल्लभो लभेत् । सर्वे देवा वशं यान्ति
    वशीभूताश्च मानवाः ॥ १५१॥ ब्रह्माण्डे ये च शंसन्ति ते तुष्टा नात्र संशयः । ये वशन्ति च भूर्लोके देवतुल्यपराक्रमाः
    ॥ १५२॥ ते सर्वे भृत्यतुल्याश्च सत्यं सत्यं कुलेश्वर । अकस्मात् सिद्धिमाप्नोति होमेन यजनेन च ॥ १५३॥
    जाप्येन कवचाद्येन महास्तोत्रार्थपाठतः । विना यज्ञैवीना दानैवीना जाप्यैर्लभेत् फलम् ॥ १५४॥ यः पठेत्
    स्तोत्रकं नाम चाष्टोत्तरसहस्रकम् । तस्य शान्तिर्भवेत् क्षिप्रं कन्यास्तोत्रं पठेत्ततः ॥ १५५॥ वारत्रयं
    प्रपाठेन राजानं वशमानयेत् । वारैकपठितो मन्त्री धर्मार्थकाममोक्षभाक् ॥ १५६॥ त्रिदिनं प्रपठेद्विद्वान्
    यदि पुत्रं समिच्छति । वारत्रयक्रमेणैव वारैकक्रमतोऽपि वा ॥ १५७॥ पठित्त्वा धनरत्नानामधिपः सर्ववित्तगः
    । त्रिजगन्मोहयेन्मन्त्री वत्सरार्द्धं प्रपाठतः ॥ १५८॥ वत्सरं वाप्य यदि वा भक्तिभावेन यः पठेत् । चिरजीवी
    खेचरत्त्वं प्राप्य योगी भवेन्नरः ॥ १५९॥ महादूरस्थितं वर्णं पश्यति स्थिरमानसः । महिलामण्डले स्थित्त्वा
    शक्तियुक्तः पठेत् सुधीः ॥ १६०॥ स भवेत्साधकश्रेष्ठः क्षीरी कल्पद्रुमो भवेत् । सर्वदा यः पठेन्नाथ भावोद्गतकलेवरः
    ॥ १६१॥ दर्शनात् स्तम्भनं कर्त्तुं क्षमो भवति साधकः । जलादिस्तम्भने शक्तो वह्निस्तम्भादिसिद्धिभाक्
    ॥ १६२॥ वायुवेगी महावाग्मी वेदज्ञो भवति ध्रुवम् । कविनाथो महाविद्यो वन्धकः पण्डितो भवेत् ॥ १६३॥ सर्वदेशाधिपो
    भूत्त्वा देवीपुत्रः स्वयं भवेत् । कान्तिं श्रियं यशो वृद्धिं प्राप्नोति बलवान् यतिः ॥ १६४॥ अष्टसिद्धियुतो
    नाथ यः पठेदर्थसिद्धये । उज्जटेऽरण्यमध्ये च पर्वते घोरकानने ॥ १६५॥ वने वा प्रेतभूमौ च शवोपरि महारणे
    । ग्रामे भग्नगृहे वापि शून्यागारे नदीतटे ॥ १६६॥ गङ्गागर्भे महापीठे योनिपीठे गुरोर्गृहे । धान्यक्षेत्रे
    देवगृहे कन्यागारे कुलालये ॥ १६७॥ प्रान्तरे गोष्ठमध्ये वा राजादिभयहीनके । निर्भयादिस्वदेशेषु शिवलिङ्गालयेऽथवा
    ॥ १६८॥ भूतगर्त्ते चैकलिङ्गै वा शून्यदेशे निराकुले । अश्वत्थमूले बिल्वे वा कुलवृक्षसमीपगे ॥ १६९॥ अन्येषु
    सिद्धदेशेषु कुलरूपाश्च साधकः । दिव्ये वा वीरभावस्थो यष्ट्वा कन्यां कुलाकुलै ॥ १७०॥ कुलद्रव्यैश्च विविधैः
    सिद्धिद्रव्यैश्च साधकः । मांसासवेन जुहुयान्मुक्तेन रसेन च ॥ १७१॥ हुतशेषं कुलद्रव्यं ताभ्यो दद्यात्
    सुसिद्धये । तासामुच्छिष्टमानीय जुहुयाद् रक्तपङ्कजे ॥ १७२॥ घृणालज्जाविनिर्मुक्तः साधकः स्थिरमानसः ।
    पिबेन्मांसरसं मन्त्री सदानन्दो महाबली ॥ १७३॥ महामांसाष्टकं ताभ्यो मदिराकुम्भपूरितम् । तारो माया रमावह्निजायामन्त्रं
    पठेत् सुधीः ॥ १७४॥ निवेद्य विधिनानेन पठित्त्वा स्तोत्रमङ्गलम् । स्वयं प्रसादं भुक्त्वा हि सर्वविद्याधिपो
    भवेत् ॥ १७५॥ शूकरस्योष्ट्र्मांसेन पीनमीनेन मुद्रया । महासवघटेनापि दत्त्वा पठति यो नरः ॥ १७६॥ ध्रुवं
    स सर्वगामी स्याद् विना होमेन पूजया । रुद्ररूपो भवेन्नित्यं महाकालात्मको भवेत् ॥ १७७॥ सर्वपुण्यफलं
    नाथ क्षणात् प्राप्नोति साधकः । क्षीराब्धिरत्नकोषेशो वियद्व्यापी च योगिराट् ॥ १७८॥ भक्त्याह्लादं दयासिन्धुं
    निष्कामत्त्वं लभेद् ध्रुवम् । महाशत्रुपातने च महाशत्रुभयाद्दीते ॥ १७९॥ वारैकपाठमात्रेण शत्रूणां वधमानयेत्
    । समर्दयेत् शत्रून् क्षिप्रमन्धकारं यथा रविः ॥ १८०॥ उच्चाटने मारणे च भये घोरतरे रिपौ । पठनाद्धारणान्मर्त्त्यो
    देवा वा राक्षसादयः ॥ १८१॥ प्राप्नुवन्ति झटित् शान्तिं कुमारीनामपाठतः । पुरुषो दक्षिणे बाहौ नारी वामकरे
    तथा ॥ १८२॥ धृत्वा पुत्रादिसम्पत्तिं लभते नात्र संशयः ॥ १८३॥ ममाज्ञया मोक्षमुपैति साधको गजान्तकं नाथ
    सहस्रनाम च । पठेन्मनुष्यो यहि भक्तिभावत
