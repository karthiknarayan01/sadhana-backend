id: lakshminrisimhastavanastotram
category: stotram
name:
  english: lakshminrisimhastavanastotram
  devanagari: लक्ष्मीनृसिंहस्तवनस्तोत्रम्
content:
  english: shrilakshminrisimhastavanastotram shriganeshaya namah | shrilakshminrisimhaya namah | atha
    dhyanam | lakshmishobhitavamabhagamamalam simhasane sundaram savye cakradharam ca nirbhayakaram vamena
    capam varam | sarpadhishakritantapatramamalam shrivatsavakshahsthalam vande devamunindravanditapadam
    lakshminrisimham vibhum || 1|| namo'stu lilamayavigrahaya svarupadrishtya hatasadbhramaya | namah
    paranandaparalayaya svabhavasampattimahodayaya || 2|| namo gunanam pataye mahimne vikaradhamne'khilakaranaya
    | namo jagadbhasayate garimne sate cidatmakritaye gunaya || 3|| tvamadirasyasi nidanamadhyam vishvakritistvam
    pralayo vibhustvam | tvam sarvayonistvam sarvayonistvam sarvasho'si tvam sarvashashca || 4|| namah
    purastadatha parshvayoste pashcannamo te bahirishvaraya | purnadvitiyaya namah paraya aniyase'nantacide
    parasmai || 5|| vahneh sphullinga iva varibhajha sindhorivaugha iva vasananam | bhavanti tishthanti
    viyanti yatra brahmandasanghastamajam prapadye || 6|| yadikshaya janirasya prameyo vibhurnrisimho
    varado mamastu | yenahamasmin vividhe'trasarge sampreritah kalavinashtadrishtih || 7|| yasyadeshat
    sargakarmapravritto bhutvapyaham kalasammudhacetah | sa punyavaca mamasrishtimetamalankarotu prabhavishnurishah
    || 8|| ihaisha loke hyasamikshya baddho mayagunaih kamayate tu kaman | yacchannamushmai ya ihaprameyo
    harantyananto nimisham prasida || 9|| namo niyantre niyamalayaya namo jaganmohatamorunaya | namo nrisimhaya
    vilasadhamne namah shivayamitavikramaya || 10|| namo manoduracaraya vacam vacamanirdeshya padaya bhumne
    | namah svabhasakhilabhasakaya pramanamatre jagadishvaraya || 11|| iti padmapurane shrinrisimhastavanam
    sampurnam | om tatsat |
  devanagari: श्रीलक्ष्मीनृसिंहस्तवनस्तोत्रम् श्रीगणेशाय नमः । श्रीलक्ष्मीनृसिंहाय नमः । अथ ध्यानम् ।
    लक्ष्मीशोभितवामभागममलं सिंहासने सुन्दरं सव्ये चक्रधरं च निर्भयकरं वामेन चापं वरम् । सर्पाधीशकृतान्तपत्रममलं
    श्रीवत्सवक्षःस्थलं वन्दे देवमुनीन्द्रवन्दितपदं लक्ष्मीनृसिंहं विभुम् ॥ १॥ नमोऽस्तु लीलामयविग्रहाय
    स्वरूपदृष्ट्या हतसद्भ्रमाय । नमः परानन्दपरालयाय स्वभावसम्पत्तिमहोदयाय ॥ २॥ नमो गुणानां पतये महिम्ने
    विकारधाम्नेऽखिलकारणाय । नमो जगद्भासयते गरिम्णे सते चिदात्माकृतये गुणाय ॥ ३॥ त्वमादिरस्यासि निदानमध्यं
    विश्वाकृतिस्त्वं प्रलयो विभुस्त्वम् । त्वं सर्वयोनिस्त्वं सर्वयोनिस्त्वं सर्वशोऽसि त्वं सर्वशश्च ॥
    ४॥ नमः पुरस्तादथ पार्श्वयोस्ते पश्चान्नमो ते बहिरीश्वराय । पूर्णाद्वितीयाय नमः पराय अणीयसेऽनन्तचिदे
    परस्मै ॥ ५॥ वह्नेः स्फुल्लिङ्गा इव वारिभझ सिन्धोरिवौघा इव वासनानाम् । भवन्ति तिष्ठन्ति वियन्ति यत्र
    ब्रह्माण्डसङ्घास्तमजं प्रपद्ये ॥ ६॥ यदीक्षया जनिरस्या प्रमेयो विभुर्नृसिंहो वरदो ममास्तु । येनाहमस्मिन्
    विविधेऽत्रसर्गे सम्प्रेरितः कालविनष्टदृष्टिः ॥ ७॥ यस्यादेशात् सर्गकर्मप्रवृत्तो भूत्वाप्यहं कालसम्मूढचेताः
    । स पुण्यवाचा ममसृष्टीमेतामलङ्करोतु प्रभविष्णुरीशः ॥ ८॥ इहैष लोके ह्यसमीक्ष्य बद्धो मायागुणैः कामयते
    तु कामान् । यच्छन्नमुष्मै य इहाप्रमेयो हरन्त्यनन्तो निमिषं प्रसीद ॥ ९॥ नमो नियन्त्रे नियमालयाय नमो
    जगन्मोहतमोरुणाय । नमो नृसिंहाय विलासधाम्ने नमः शिवायामितविक्रमाय ॥ १०॥ नमो मनोदूरचराय वाचां वाचामनिर्देश्य
    पदाय भूम्ने । नमः स्वभासाखिलभासकाय प्रमाणमात्रे जगदीश्वराय ॥ ११॥ इति पद्मपुराणे श्रीनृसिंहस्तवनं सम्पूर्णम्
    । ॐ तत्सत् ।
