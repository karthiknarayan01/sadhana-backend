id: devikritam3shivastotram
category: stotram
name:
  english: devikritam3shivastotram
  devanagari: देवीकृतं३शिवस्तोत्रम्
content:
  english: devikritam 3 shivastotram devyuvaca | jaya deva mahadeva sarvabhavana ishvara | namaste'stu
    sureshaya parameshaya vai namah || 15|| anadisrishtikartre ca namah sarvagataya ca | sarvasthaya namastubhyam
    dhamnam dhamne namo'stu te || 16|| shadantaya namastubhyam dvadashantaya te namah | hamsabheda namastubhyam
    namastubhyam ca mokshada || 17|| iti shriskandapurane prabhasakhande prabhasakshetramahatmye navamadhyayantargatam
    devikritam shivastotram samaptam | skandapurana | prabhasakhanda | adhyaya 9
  devanagari: देवीकृतं ३ शिवस्तोत्रम् देव्युवाच । जय देव महादेव सर्वभावन ईश्वर । नमस्तेऽस्तु सुरेशाय परमेशाय
    वै नमः ॥ १५॥ अनादिसृष्टिकर्त्रे च नमः सर्वगताय च । सर्वस्थाय नमस्तुभ्यं धाम्नां धाम्ने नमोऽस्तु ते
    ॥ १६॥ षडन्ताय नमस्तुभ्यं द्वादशान्ताय ते नमः । हंसभेद नमस्तुभ्यं नमस्तुभ्यं च मोक्षद ॥ १७॥ इति श्रीस्कन्दपुराणे
    प्रभासखण्डे प्रभासक्षेत्रमाहात्म्ये नवमाध्यायान्तर्गतं देवीकृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण
    । प्रभासखण्ड । अध्याय ९
meaning: {}
