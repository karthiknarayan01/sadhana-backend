id: krishnastotramvadiraja
category: stotram
name:
  english: krishnastotramvadiraja
  devanagari: कृष्णस्तोत्रम्वादिराज
content:
  english: mishatsmitenduvadanam sharanam vrajami || 6|| kim samstavimi tava matsya sukurma kola shrimannrishimha
    varavamana bhargavesha | shrijanakiramana yadavakrishna buddha kalkyadirupa kritisevitasatprabhava
    || 7|| shrikrishnadeva karunakara saumyarupa shrivadirajamunihritkamaladhivasa | bhaktotsavepsitasutatvarahasyadipa
    mam pahi te caranasevakabhrityabhrityam || 8|| vadirajakhyayatina krishnastotramidam kritam | hareh
    kripaptaye'jastram pathatah priyate harih || 9|| iti shrimadvadirajapujyacaranaviracitam krishnastotram
    sampurnam | bharatiramanamukhyapranantargata shrikrishnarpanamastu |
  devanagari: मीषत्स्मितेन्दुवदनं शरणं व्रजामि ॥ ६॥ किं संस्तवीमि तव मत्स्य सुकूर्म कोल श्रीमन्नृशिंह
    वरवामन भार्गवेश । श्रीजानकीरमण यादवकृष्ण बुद्ध कल्क्यादिरूप कृतिसेवितसत्प्रभाव ॥ ७॥ श्रीकृष्णदेव करुणाकर
    सौम्यरूप श्रीवादिराजमुनिहृत्कमलाधिवास । भक्तोत्सवेप्सितसुतत्वरहस्यदीप मां पाहि ते चरणसेवकभृत्यभृत्यम्
    ॥ ८॥ वादिराजाख्ययतिना कृष्णस्तोत्रमिदं कृतम् । हरेः कृपाप्तयेऽजस्त्रं पठतः प्रीयते हरिः ॥ ९॥ इति श्रीमद्वादिराजपूज्यचरणविरचितं
    कृष्णस्तोत्रं सम्पूर्णम् । भारतीरमणमुख्यप्राणान्तर्गत श्रीकृष्णार्पणमस्तु ।
