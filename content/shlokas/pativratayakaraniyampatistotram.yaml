id: pativratayakaraniyampatistotram
category: stotram
name:
  english: pativratayakaraniyampatistotram
  devanagari: पतिव्रतयाकरणीयंपतिस्तोत्रम्
content:
  english: shirashchatrasvarupine | namo yavatsaukhyadaya sarvadevamayaya ca || 72|| namo brahmasvarupaya
    satisatyodbhavaya iva | namasyaya prapujyaya hridadharaya te namah || 73|| satipranasvarupaya saubhagyashripradaya
    ca | patninam paramanandasvarupine ca te namah || 74|| patirbrahma patirvishnuh patireva maheshvarah
    | patirvamshadharo devo brahmatmane ca te namah || 75|| kshamasva bhagavan doshan jnana'jnanavidhapitan
    | patnibandho dayasindho dasidoshan kshamasva vai || 76|| iti shrilakshminarayaniyasamhitayam prathame
    kritayugasantane 377
  devanagari: शिरश्छत्रस्वरूपिणे । नमो यावत्सौख्यदाय सर्वदेवमयाय च ॥ ७२॥ नमो ब्रह्मस्वरूपाय सतीसत्योद्भवाय
    इव । नमस्याय प्रपूज्याय हृदाधाराय ते नमः ॥ ७३॥ सतीप्राणस्वरूपाय सौभाग्यश्रीप्रदाय च । पत्नीनां परमानन्दस्वरूपिणे
    च ते नमः ॥ ७४॥ पतिर्ब्रह्मा पतिर्विष्णुः पतिरेव महेश्वरः । पतिर्वंशधरो देवो ब्रह्मात्मने च ते नमः
    ॥ ७५॥ क्षमस्व भगवन् दोषान् ज्ञानाऽज्ञानविधापितान् । पत्नीबन्धो दयासिन्धो दासीदोषान् क्षमस्व वै ॥ ७६॥
    इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने ३७७
