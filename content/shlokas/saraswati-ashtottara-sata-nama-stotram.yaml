id: saraswati-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Saraswati Ashtottara Sata Nama Stotram
  devanagari: सरस्वत्यष्टोत्तरशतनामस्तोत्रम्
content:
  english: sarasvatyashtottarashatanamastotram ya kundendutusharaharadhavala ya shubhravastravrita ya
    vinavaradandamanditakara ya shvetapadmasana ya brahmacyutashankaraprabhritibhirdevaih sada pujita
    sa mam patu sarasvati bhagavati nihsheshajadyapaha sarasvati mahabhadra mahamaya varaprada shriprada
    padmanilaya padmakshi padmavaktraka shivanuja pustakabhrijjnanamudra rama para kamarupa mahavidya
    mahapatakanashini mahashraya malini ca mahabhoga mahabhuja mahabhaga mahotsaha divyanga suravandita
    mahakali mahapasha mahakara mahankusha pita ca vimala vishva vidyunmala ca vaishnavi candrika candravadana
    candralekhavibhushita savitri surasa devi divyalankarabhushita vagdevi vasuda tivra mahabhadra mahabala
    bhogada bharati bhama govinda gomati shiva jatila vindhyavasa ca vindhyacalavirajita candika vaishnavi
    brahmi brahmajnanaikasadhana saudamini sudhamurtih subhadra surapujita suvasini sunasa ca vinidra
    padmalocana vidyarupa vishalakshi brahmajaya mahaphala trayimurti trikalajna triguna shastrarupini
    shumbhasurapramathini shubhada ca svaratmika raktabijanihantri ca camunda cambika tatha mundakayapraharana
    dhumralocanamardana sarvadevastuta saumya surasuranamaskrita kalaratrih kaladhara rupasaubhagyadayini
    vagdevi ca vararoha varahi varijasana citrambara citragandha citramalyavibhushita kanta kamaprada
    vandya vidyadharasupujita shvetanana nilabhuja caturvargaphalaprada caturananasamrajya raktamadhya
    niranjana hamsasana nilajangha brahmavishnushivatmika evam sarasvatidevya namnamashtottaram shatam
    sarasvatyashtottarashatanamastotram sampurnam||
  devanagari: सरस्वत्यष्टोत्तरशतनामस्तोत्रम् या कुन्देन्दुतुषारहारधवला या शुभ्रवस्त्रावृता या वीणावरदण्डमण्डितकरा
    या श्वेतपद्मासना या ब्रह्माच्युतशङ्करप्रभृतिभिर्देवैः सदा पूजिता सा मां पातु सरस्वती भगवती निःशेषजाड्यापहा
    सरस्वती महाभद्रा महामाया वरप्रदा श्रीप्रदा पद्मनिलया पद्माक्षी पद्मवक्त्रका शिवानुजा पुस्तकभृज्ज्ञानमुद्रा
    रमा परा कामरूपा महाविद्या महापातकनाशिनी महाश्रया मालिनी च महाभोगा महाभुजा महाभागा महोत्साहा दिव्याङ्गा
    सुरवन्दिता महाकाली महापाशा महाकारा महाङ्कुशा पीता च विमला विश्वा विद्युन्माला च वैष्णवी चन्द्रिका
    चन्द्रवदना चन्द्रलेखविभूषिता सावित्री सुरसा देवी दिव्यालङ्कारभूषिता वाग्देवी वसुदा तीव्रा महाभद्रा
    महाबला भोगदा भारती भामा गोविन्दा गोमती शिवा जटिला विन्ध्यवासा च विन्ध्याचलविराजिता चण्डिका वैष्णवी
    ब्राह्मी ब्रह्मज्ञानैकसाधना सौदामिनी सुधामूर्तिः सुभद्रा सुरपूजिता सुवासिनी सुनासा च विनिद्रा पद्मलोचना
    विद्यारूपा विशालाक्षी ब्रह्मजाया महाफला त्रयीमूर्ती त्रिकालज्ञा त्रिगुणा शास्त्ररूपिणी शुम्भासुरप्रमथिनी
    शुभदा च स्वरात्मिका रक्तबीजनिहन्त्री च चामुण्डा चाम्बिका तथा मुण्डकायप्रहरणा धूम्रलोचनमर्दना सर्वदेवस्तुता
    सौम्या सुरासुरनमस्कृता कालरात्रिः कलाधारा रूपसौभाग्यदायिनी वाग्देवी च वरारोहा वाराही वारिजासना चित्राम्बरा
    चित्रगन्धा चित्रमाल्यविभूषिता कान्ता कामप्रदा वन्द्या विद्याधरसुपूजिता श्वेतानना नीलभुजा चतुर्वर्गफलप्रदा
    चतुराननसाम्राज्या रक्तमध्या निरञ्जना हंसासना नीलजङ्घा ब्रह्मविष्णुशिवात्मिका एवं सरस्वतीदेव्या नाम्नामष्टोत्तरं
    शतम् सरस्वत्यष्टोत्तरशतनामस्तोत्रं सम्पूर्णम्॥
