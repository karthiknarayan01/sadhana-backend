id: balamantragarbhashtakam
category: mantra
name:
  english: balamantragarbhashtakam
  devanagari: बालामन्त्रगर्भाष्टकम्
content:
  english: shribalamantragarbhashtakam ainkararupinim satyam ainkaraksharamalinim | aimbijarupinim devim
    baladevim namamyaham || 1|| vagbhavam varunipitam vacasiddhipradam shivam | balipriyam varaladhyam
    vande balam shubhapradam || 2|| laksharasanibham tryaksham lalajjihvam bhavapriyam | lambakeshim lokadhatrim
    balam dravyapradam bhaje || 3|| yaikarastham yajnarupam yum rupam mantrarupinim | yudhishthiram mahabalam
    namami paramarthadam || 4|| namaste'stu mahabalam namaste shankarapriyam | namaste'stu gunatitam namaste'stu
    namo namah || 5|| mahamanim mantrarupam mokshadam muktakeshinim | mamsamshim candramaulim ca smarami
    satatam shivam || 6|| svayambhuvam svadharmastham svatmabodhaprakashikam | svarnabharanadiptangam
    balam jnanapradam bhaje || 7|| ha ha ha shabdaniratam hasyam hasyapriyam vibhum | hunkaraddaityakhandakhyam
    shribalam pranamamyaham || 8|| ityashtakam mahapunyam balayah siddhidayakam | ye pathanti sada bhaktya
    gacchanti paramam gatim || 9|| iti kulacudamanitantre shribalamantragarbhashtakam sampurnam |
  devanagari: श्रीबालामन्त्रगर्भाष्टकम् ऐङ्काररूपिणीं सत्यां ऐङ्काराक्षरमालिनीम् । ऐम्बीजरूपिणीं देवीं
    बालादेवीं नमाम्यहम् ॥ १॥ वाग्भवां वारुणीपीतां वाचासिद्धिप्रदां शिवाम् । बलिप्रियां वरालाढ्यां वन्दे
    बालां शुभप्रदाम् ॥ २॥ लाक्षारसनिभां त्र्यक्षां ललज्जिह्वां भवप्रियाम् । लम्बकेशीं लोकधात्रीं बालां
    द्रव्यप्रदां भजे ॥ ३॥ यैकारस्थां यज्ञरूपां यूं रूपां मन्त्ररूपिणीम् । युधिष्ठिरां महाबालां नमामि परमार्थदाम्
    ॥ ४॥ नमस्तेऽस्तु महाबालां नमस्ते शङ्करप्रियाम् । नमस्तेऽस्तु गुणातीतां नमस्तेऽस्तु नमो नमः ॥ ५॥ महामनीं
    मन्त्ररूपां मोक्षदां मुक्तकेशिनीम् । मांसांशीं चन्द्रमौलिं च स्मरामि सततं शिवाम् ॥ ६॥ स्वयम्भुवां
    स्वधर्मस्थां स्वात्मबोधप्रकाशिकाम् । स्वर्णाभरणदीप्ताङ्गं बालां ज्ञानप्रदां भजे ॥ ७॥ हा हा हा शब्दनिरतां
    हास्यां हास्यप्रियां विभुम् । हुङ्काराद्दैत्यखण्डाख्यां श्रीबालां प्रणमाम्यहम् ॥ ८॥ इत्यष्टकं महापुण्यं
    बालायाः सिद्धिदायकम् । ये पठन्ति सदा भक्त्या गच्छन्ति परमां गतिम् ॥ ९॥ इति कुलचूडामणितन्त्रे श्रीबालामन्त्रगर्भाष्टकं
    सम्पूर्णम् ।
