id: sadashivashakinikavacam
category: kavacha
name:
  english: sadashivashakinikavacam
  devanagari: सदाशिवशाकिनीकवचम्
content:
  english: 9|| viniyogakathanam asya shrishakinisadashivakamananamamahakavacasya sadashivarishirgayatricchandah
    shakini devata sakalaharim jivabijam mayastrashaktih kamasvaha kilakam vajram damshtraghoraghargharamahograshakinishaktih
    sadashivamahamantrasiddhaye viniyogah | om prabhava sada patu mahakashadhishakini | triguna candika
    patu krodhadamshtra karalini || 70
  devanagari: ९॥ विनियोगकथनं अस्य श्रीशाकिनीसदाशिवकामनानाममहाकवचस्य सदाशिवऋषिर्गायत्रीच्छन्दः शाकिनी देवता
    सकलहरीं जीवबीजं मायास्त्रशक्तिः कामस्वाहा कीलकं वज्रं दंष्ट्राघोरघर्घरामहोग्राशाकिनीशक्तिः सदाशिवमहामन्त्रसिद्धये
    विनियोगः । ॐ प्रभावा सदा पातु महाकाशाधिशाकिनी । त्रिगुणा चण्डिका पातु क्रोधदंष्ट्रा करालिनी ॥ ७०
meaning: {}
