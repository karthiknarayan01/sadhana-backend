id: anna-suktam
category: stotram
name:
  english: Anna Suktam
content:
  english: ahamasmi prathamaja ritasya | purva ndevebhyo amritasya nabhih | yo ma dadati sa ideva ma |
    ahamannamannamadantamadmi | purvamagnerapi dahatyanna ''sate ahamuttareshu | vyattamasya pashavah
    sujambha m | pashyanti dhirah pracaranti pakah nna jahamyanyam | ahamannam mparyemi bhunjat | ko mamanna
    mmanushyo dayeta | parake anna lo~ka etat | vishvai rdevaih pitribhirguptamanna m | yadadyate lupyate
    yatparopyate | shatatami sa tanurme babhuva | mahantau caru sakriddugdhena paprau | diva nca prishni
    prithivi nca sakam | tatsam pibanto na minanti vedhasah | naitadbhuyo bhavati no kaniyah || mpranamannamapanamahuh
    | anna ntamu jivatumahuh | anna mbrahmano jarasam va~danti | annamahuh prajanana vi~ndate apracetah
    | satya mbravimi vadha itsa tasya | naryamana mpushyati no sakhayam | kevalagho bhavati kevaladi |
    aha shannasmi | mamadantyahamadmyanyan || ahagm sadamrito bhavami | madaditya adhi sarve tapanti |
  devanagari: अ॒हम॑स्मि प्रथ॒मजा ऋ॒तस्य॑ । पूर्व॑ न्दे॒वेभ्यो॑ अ॒मृत॑स्य॒ नाभिः॑ । यो मा॒ ददा॑ति॒ स इदे॒व
    मा । अ॒हमन्न॒मन्न॑म॒दन्त॑मद्मि । पूर्व॑म॒ग्नेरपि॑ दह॒त्यन्न ऽऽसाते अहमुत्त॒रेषु॑ । व्यात्त॑मस्य प॒शवः॑
    सु॒जम्भ म् । पश्य॑न्ति॒ धीराः॒ प्रच॑रन्ति॒ पाकाः न्न ज॑हाम्य॒न्यम् । अ॒हमन्नं॒ म्पर्ये॑मि भु॒ञ्जत्
    । को मामन्न॑ म्मनु॒ष्यो॑ दयेत । परा॑के॒ अन्न॒ लोँ॒क ए॒तत् । विश्वै र्दे॒वैः पि॒तृभि॑र्गु॒प्तमन्न म्
    । यद॒द्यते॑ लु॒प्यते॒ यत्प॑रो॒प्यते । श॒त॒त॒मी सा त॒नूर्मे॑ बभूव । म॒हान्तौ॑ च॒रू स॑कृद्दु॒ग्धेन॑
    पप्रौ । दिव॑ ञ्च॒ पृश्नि॑ पृथि॒वी ञ्च॑ सा॒कम् । तत्सं॒ पिब॑न्तो॒ न मि॑नन्ति वे॒धसः॑ । नैतद्भूयो॒ भव॑ति॒
    नो कनी॑यः ॥ म्प्रा॒णमन्न॑मपा॒नमा॑हुः । अन्न॑ न्तमु॑ जी॒वातु॑माहुः । अन्न॑ म्ब्र॒ह्माणो॑ ज॒रसं॑ वँदन्ति
    । अन्न॑माहुः प्र॒जन॑न विँन्दते॒ अप्र॑चेताः । स॒त्य म्ब्र॑वीमि व॒ध इत्स तस्य॑ । नार्य॒मण॒ म्पुष्य॑ति॒
    नो सखा॑यम् । केव॑लाघो भवति केवला॒दी । अ॒ह ष॑न्नस्मि । माम॑दन्त्य॒हम॑द्म्य॒न्यान् ॥ अह॒ग्ं सद॒मृतो॑
    भवामि । मदा॑दि॒त्या अधि॒ सर्वे॑ तपन्ति ।
