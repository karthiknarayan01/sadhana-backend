id: balakavacam-3
category: kavacha
name:
  english: balakavacam 3
  devanagari: बालाकवचम् ३
content:
  english: rinushva tvam sarvasaubhagyakarakam || 5|| shiro rakshatu me bala lalate patu sundari | karnau
    shrih sarvada patu netre kamalavasini || 6|| oshthamadhye vishalakshi jihvam patu sarasvati | mukham
    manorama patu cibukam me tvacancala || 7|| kantham shrikalika patu bahu rakshatu candika | karau shadakshari
    patu hridayam harivallabha || 8|| matangi patu me madhyam bhavani jatharam mama | nabhim shribhairavi
    patu guhyam kameshvari tatha || 9|| katim payatkamadhatri januni jagadishvari | janghe me tvarita
    patu janghapashve'shvavahini || 10|| parvatastha patu padau anguli bhumivasini | agratastripura patu
    prishthato mama bhairavi || 11|| dakshine sundari patu vame mangaladayini | urdhvam jyotishmati shaktih
    adho'nantasvarupini || 12|| sarvashatruhara durga patu me vijaya rane | griham rakshedbhadrakali vacam
    vagvadini mama || 13|| oshthau me matrikah sarvah sarvakaryeshu sarvada | ityetatkavacam proktam yah
    pathetsusamahitah || 14|| diva va yadi va ratrau trisandhyam bhaktimannarah | jnatvaitatkavacam punyam
    sarvankamanavapnuyat || 15|| iti shribalakavacam
  devanagari: ृणुष्व त्वं सर्वसौभाग्यकारकम् ॥ ५॥ शिरो रक्षतु मे बाला ललाटे पातु सुन्दरी । कर्णौ श्रीः
    सर्वदा पातु नेत्रे कमलवासिनी ॥ ६॥ ओष्ठमध्ये विशालाक्षी जिह्वां पातु सरस्वती । मुखं मनोरमा पातु चिबुकं
    मे त्वचञ्चला ॥ ७॥ कण्ठं श्रीकालिका पातु बाहू रक्षतु चण्डिका । करौ षडक्षरी पातु हृदयं हरिवल्लभा ॥ ८॥
    मातङ्गी पातु मे मध्यं भवानी जठरं मम । नाभिं श्रीभैरवी पातु गुह्यं कामेश्वरी तथा ॥ ९॥ कटिं पायात्कामधात्री
    जानुनी जगदीश्वरी । जङ्घे मे त्वरिता पातु जङ्घपाश्वेऽश्ववाहिनी ॥ १०॥ पर्वतस्था पातु पादौ अङ्गुली भूमिवासिनी
    । अग्रतस्त्रिपुरा पातु पृष्ठतो मम भैरवी ॥ ११॥ दक्षिणे सुन्दरी पातु वामे मङ्गलदायिनी । ऊर्ध्वं ज्योतिष्मती
    शक्तिः अधोऽनन्तस्वरूपिणी ॥ १२॥ सर्वशत्रुहरा दुर्गा पातु मे विजया रणे । गृहं रक्षेद्भद्रकाली वाचं वाग्वादिनी
    मम ॥ १३॥ ओष्ठौ मे मातृकाः सर्वाः सर्वकार्येषु सर्वदा । इत्येतत्कवचं प्रोक्तं यः पठेत्सुसमाहितः ॥ १४॥
    दिवा वा यदि वा रात्रौ त्रिसन्ध्यं भक्तिमान्नरः । ज्ञात्वैतत्कवचं पुण्यं सर्वान्कामानवाप्नुयात् ॥ १५॥
    इति श्रीबालाकवचं
