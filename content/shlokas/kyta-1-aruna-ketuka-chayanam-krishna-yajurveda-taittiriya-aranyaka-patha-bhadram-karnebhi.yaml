  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय आरण्यके प्रथमः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ अनुवाकं
    श्शृणु॒याम॑ देवाः । भ॒द्र र्यज॑त्राः । स्थि॒रैरङ्गै स्तुष्टु॒वाग्ं स॑स्त॒नूभिः॑ । व्यशे॑म दे॒वहि॑तं॒
    यँदायुः॑ ॥ स्व॒स्ति न॒ इन्द्रो॑ वृ॒द्धश्र॑वाः । स्व॒स्ति नः॑ पू॒षा वि॒श्ववे॑दाः । स्व॒स्ति न॒स्तार्क्ष्यो॒
    अरि॑ष्टनेमिः । स्व॒स्ति नो॒ बृह॒स्पति॑ र्दधातु ॥ आप॑मापाम॒प ॥ अ॒ग्निर्वा॒युश्च॒ सूर्य॑श्च । स॒ह स॑ञ्च
    स्क॒रर्धि॑या ॥ वा॒य्वश्वा॑ रश्मि॒पत॑यः । मरी च्यात्मानो॒ अद्रु॑हः । दे॒वी र्भु॑वन॒ सूव॑रीः । पु॒त्र॒व॒त्त्वाय॑
