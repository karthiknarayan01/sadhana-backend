id: uddhava-geetha-chapter-5
category: stotram
name:
  english: Uddhava Geetha - Chapter 5
content:
  english: atha pancamo'dhyayah | raja uvaca | bhagavantam harim prayah na bhajanti atmavittamah | tesham
    ashantakamanam ka nishtha avijitatmanam || || camasah uvaca | mukhabahurupadebhyah purushasya ashramaih
    saha | catvarah jajnire varnah gunaih vipradayah prithak || || yah esham purusham sakshat atmaprabhavam
    ishvaram | na bhajanti avajananti sthanat bhrashtah patanti adhah || || dure harikathah kecit dure
    ca acyutakirrtanah | striyah shudradayah ca eva te anukampya bhavadrisham || || viprah rajanyavaishyau
    ca hareh praptah padantikam | shrautena janmana atha api muhyanti amnayavadinah || || karmani akovidah
    stabdhah murkhah panditamaninah | vadanti catukat mudhah yaya madhvya gira utsukah || || rajasa ghorasankalpah
    kamukah ahimanyavah | dambhikah maninah papah vihasanti acyutapriyan || || vadanti te anyonyam upasitastriyah
    griheshu maithunyasukheshu ca ashishah | yajanti asrishtan avidhan adakshinam vrittyai param ghnanti
    pashun atadvidah || || shriya vibhutya abhijanena vidyaya tyagena rupena balena karmana satah avamanyanti
    haripriyan khalah || || sarveshu shashvat tanubhrit svavasthitam yatha svam atmanam abhishtam ishvaram
    | vedopagitam ca na shrunvate abudhah manorathanam pravadanti vartaya || || loke vyavaya amisham adyaseva
    nityah tu jantoh na hi tatra codana | vyavasthitih teshu vivahayajna suragrahaih asu nivrittih ishta
    || || dhanam ca dharmekaphalam yatah vai jnanam savijnanam anuprashanti | griheshu yunjanti kalevarasya
    mrityum na pashyanti durantaviryam || || yat ghranabhakshah vihitah surayah tatha pashoh alabhanam
    na himsa | evam vyavayah prajaya na ratya iamam vishuddham na viduh svadharmam || || ye tu anevamvidah
    asantah stabdhah sat abhimaninah | pashun druhyanti visrabdhah pretya khadanti te ca tan || || dvishantah
    parakayeshu svatmanam harim ishvaram | mritake sanubandhe asmin baddhasnehah patanti adhah || || ye
    kaivalyam asampraptah ye ca atitah ca mudhatam | traivargikah hi akshanikah atmanam ghatayanti te
    || || etah atmahanah ashantah ajnane jnanamaninah | sidanti akritakrityah vai kaladhvastamanorathah
    || || hitva atyaya asaracitah griha apatyasuhrit shriyah | tamah vishanti anicchantah vasudevaparanmukhah
    || || raja uvaca | kasmin kale sah bhagavan kim varnah kidrishah nribhih | namna va kena vidhina pujyate
    tat iha ucyatam || || karabhajanah uvaca | kritam treta dvaparam ca kalih ityeshu keshavah | nanavarna
    abhidhakarah nana eva vidhina ijyate || || krite shuklah caturbahuh jatilah valkalambarah | krishnajinaupavitakshan
    bibhrat dandakamandalun || || manushyah tu tada shantah nirvairah suhridah samah | yajanti tapasa
    devam shamena ca damena ca || || hamsah suparnah vaikunthah dharmah yogeshvarah amalah | ishvarah
    purushah avyaktah paramatma iti giyate || || tretayam raktavarnah asau caturbahuh trimekhalah | hiranyakeshah
    trayi atma sruksruvadi upalakshanah || || tam tada manuja devam sarvadevamayam harim | yajanti vidyaya
    trayya dharmishthah brahmavadinah || || vishnuh yajnah prishnigarbhah sarvadevah urukramah | vrishakapih
    jayantah ca urugaya iti iryate || || dvapare bhagavan shyamah pitavasa nijayudhah | shrivatsadibhih
    ankaih ca lakshanaih upalakshitah || || tam tada purusham martya maharajaupalakshanam | yajanti vedatantrabhyam
    param jijnasavah nripa || || namah te vasudevaya namah sankarshanaya ca | pradyumnaya aniruddhaya
    tubhyam bhagavate namah || || narayanaya rishaye purushaya mahatmane | vishveshvaraya vishvaya sarvabhutatmane
    namah || || iti dvaparah urvisha stuvanti jagadishvaram | nanatantravidhanena kalau api yatha shrunu
    || || krishnavarnam tvishakrishnam sangaupangastra parshadam | yajnaih sankirtanaprayaih yajanti hi
    sumedhasah || || dhyeyam sada paribhavaghnam abhishtadoham tirthaspadam shivavirincinutam sharanyam
    | bhrityartihan pranatapala bhavabdhipotam vande mahapurusha te caranaravindam || || tyaktva sudustyajasuraipsitarajyalakshmim
    dharmishthah aryavacasa yat agat aranyam | mayamrigam dayitaya ipsitam anvadhavat vande mahapurusha
    te caranaravindam || || evam yuganurupabhyam bhagavan yugavartibhih | manujaih ijyate rajan shreyasam
    ishvarah harih || || kalim sabhajayanti arya gunajnah sarabhaginah | yatra sankirtanena eva sarvah
    svarthah abhilabhyate || || na hi atah paramah labhah dehinam bhramyatam iha | yatah vindeta paramam
    shantim nashyati samsritih || || kritadishu praja rajan kalau icchanti sambhavam | kalau khalu bhavishyanti
    narayanaparayanah || || kvacit kvacit maharaja dravideshu ca bhurishah | tamraparni nadi yatra kritamala
    payasvini || || kaveri ca mahapunya pratici ca mahanadi | ye pibanti jalam tasam manuja manujeshvara
    | prayah bhaktah bhagavati vasudevah amala ashayah || || devarshibhutaptanrina pitrinam na kinkarah
    na ayam rini ca rajan | sarvatmana yah sharanam sharanyam gatah mukundam parihritya kartum || || svapadamulam
    bhajatah priyasya tyaktanyabhavasya harih pareshah | vikarma yat ca utpatitam kathancit dhunoti sarvam
    hridi sannivishtah || || naradah uvaca | dharman bhagavatan ittham shrutva atha mithileshvarah | jayanta
    iyan munin pritah sopadhyayah hi apujayat || || tatah antah dadhire siddhah sarvalokasya pashyatah
    | raja dharman upatishthan avapa paramam gatim || || tvam api etan mahabhaga dharman bhagavatan shrutan
    | asthitah shraddhaya yuktah nihsangah yasyase param || || yuvayoh khalu dampatyoh yashasa puritam
    jagat | putratam agamat yat vam bhagavan ishvarah harih || || darshanalinganalapaih shayanasanabhojanaih
    | atma vam pavitah krishne putrasneha prakurvatoh || || vairena yam nripatayah shishupalapaundra shalvadayah
    gativilasavilokanadayaih | dhyayantah akritadhiyah shayanasanadau tat samyam apuh anuraktadhiyam punah
    kim || || ma apatyabuddhim akrithah krishne sarvatmanishvare | mayamanushyabhavena gudha aishvarye
    pare avyaye || || bhubhararajanyahantave guptaye satam | avatirnasya nirvrityai yashah loke vitanyate
    || || shrishukah uvaca | etat shrutva mahabhagah vasudevah ativismitah | devaki ca mahabhagah jahatuh
    moham atmanah || || itihasam imam punyam dharayet yah samahitah | sah vidhuya iha shamalam brahmabhuyaya
    kalpate || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe vasudevanaradasamvade
    pancamo'dhyayah ||
  devanagari: अथ पञ्चमोऽध्यायः । राजा उवाच । भगवन्तं हरिं प्रायः न भजन्ति आत्मवित्तमाः । तेषां अशान्तकामानां
    का निष्ठा अविजितात्मनाम् ॥ ॥ चमसः उवाच । मुखबाहूरूपादेभ्यः पुरुषस्य आश्रमैः सह । चत्वारः जज्ञिरे वर्णाः
    गुणैः विप्रादयः पृथक् ॥ ॥ यः एषां पुरुषं साक्षात् आत्मप्रभवं ईश्वरम् । न भजन्ति अवजानन्ति स्थानात्
    भ्रष्टाः पतन्ति अधः ॥ ॥ दूरे हरिकथाः केचित् दूरे च अच्युतकीर्र्तनाः । स्त्रियः शूद्रादयः च एव ते अनुकम्प्या
    भवादृशाम् ॥ ॥ विप्रः राजन्यवैश्यौ च हरेः प्राप्ताः पदान्तिकम् । श्रौतेन जन्मना अथ अपि मुह्यन्ति आम्नायवादिनः
    ॥ ॥ कर्मणि अकोविदाः स्तब्धाः मूर्खाः पण्डितमानिनः । वदन्ति चाटुकात् मूढाः यया माध्व्या गिर उत्सुकाः
    ॥ ॥ रजसा घोरसङ्कल्पाः कामुकाः अहिमन्यवः । दाम्भिकाः मानिनः पापाः विहसन्ति अच्युतप्रियान् ॥ ॥ वदन्ति
    ते अन्योन्यं उपासितस्त्रियः गृहेषु मैथुन्यसुखेषु च आशिषः । यजन्ति असृष्टान् अविधान् अदक्षिणम् वृत्त्यै
    परं घ्नन्ति पशून् अतद्विदः ॥ ॥ श्रिया विभूत्या अभिजनेन विद्यया त्यागेन रूपेण बलेन कर्मणा सतः अवमन्यन्ति
    हरिप्रियान् खलाः ॥ ॥ सर्वेषु शश्वत् तनुभृत् स्ववस्थितम् यथा स्वं आत्मानं अभीष्टं ईश्वरम् । वेदोपगीतं
    च न श्रुण्वते अबुधाः मनोरथानां प्रवदन्ति वार्तया ॥ ॥ लोके व्यवाय आमिषं अद्यसेवा नित्याः तु जन्तोः
    न हि तत्र चोदना । व्यवस्थितिः तेषु विवाहयज्ञ सुराग्रहैः आसु निवृत्तिः इष्टा ॥ ॥ धनं च धर्मेकफलं यतः
    वै ज्ञानं सविज्ञानं अनुप्रशान्ति । गृहेषु युञ्जन्ति कलेवरस्य मृत्युं न पश्यन्ति दुरन्तवीर्यम् ॥ ॥
    यत् घ्राणभक्षः विहितः सुरायाः तथा पशोः आलभनं न हिंसा । एवं व्यवायः प्रजया न रत्या इअमं विशुद्धं न
    विदुः स्वधर्मम् ॥ ॥ ये तु अनेवंविदः असन्तः स्तब्धाः सत् अभिमानिनः । पशून् द्रुह्यन्ति विस्रब्धाः प्रेत्य
    खादन्ति ते च तान् ॥ ॥ द्विषन्तः परकायेषु स्वात्मानं हरिं ईश्वरम् । मृतके सानुबन्धे अस्मिन् बद्धस्नेहाः
    पतन्ति अधः ॥ ॥ ये कैवल्यं असम्प्राप्ताः ये च अतीताः च मूढताम् । त्रैवर्गिकाः हि अक्षणिकाः आत्मानं
    घातयन्ति ते ॥ ॥ एतः आत्महनः अशान्ताः अज्ञाने ज्ञानमानिनः । सीदन्ति अकृतकृत्याः वै कालध्वस्तमनोरथाः
    ॥ ॥ हित्वा आत्याय असरचिताः गृह अपत्यसुहृत् श्रियः । तमः विशन्ति अनिच्छन्तः वासुदेवपराङ्मुखाः ॥ ॥ राजा
    उवाच । कस्मिन् काले सः भगवान् किं वर्णः कीदृशः नृभिः । नाम्ना वा केन विधिना पूज्यते तत् इह उच्यताम्
    ॥ ॥ करभाजनः उवाच । कृतं त्रेता द्वापरं च कलिः इत्येषु केशवः । नानावर्ण अभिधाकारः नाना एव विधिना इज्यते
    ॥ ॥ कृते शुक्लः चतुर्बाहुः जटिलः वल्कलाम्बरः । कृष्णाजिनौपवीताक्षान् बिभ्रत् दण्डकमण्डलून् ॥ ॥ मनुष्याः
    तु तदा शान्ताः निर्वैराः सुहृदः समाः । यजन्ति तपसा देवं शमेन च दमेन च ॥ ॥ हंसः सुपर्णः वैकुण्ठः धर्मः
    योगेश्वरः अमलः । ईश्वरः पुरुषः अव्यक्तः परमात्मा इति गीयते ॥ ॥ त्रेतायां रक्तवर्णः असौ चतुर्बाहुः
    त्रिमेखलः । हिरण्यकेशः त्रयी आत्मा स्रुक्स्रुवादि उपलक्षणः ॥ ॥ तं तदा मनुजा देवं सर्वदेवमयं हरिम्
    । यजन्ति विद्यया त्रय्या धर्मिष्ठाः ब्रह्मवादिनः ॥ ॥ विष्णुः यज्ञः पृष्णिगर्भः सर्वदेवः उरुक्रमः ।
    वृषाकपिः जयन्तः च उरुगाय इति ईर्यते ॥ ॥ द्वापरे भगवान् श्यामः पीतवासा निजायुधः । श्रीवत्सादिभिः अङ्कैः
    च लक्षणैः उपलक्षितः ॥ ॥ तं तदा पुरुषं मर्त्या महाराजौपलक्षणम् । यजन्ति वेदतन्त्राभ्यां परं जिज्ञासवः
    नृप ॥ ॥ नमः ते वासुदेवाय नमः सङ्कर्षणाय च । प्रद्युम्नाय अनिरुद्धाय तुभ्यं भगवते नमः ॥ ॥ नारायणाय
    ऋषये पुरुषाय महात्मने । विश्वेश्वराय विश्वाय सर्वभूतात्मने नमः ॥ ॥ इति द्वापरः उर्वीश स्तुवन्ति जगदीश्वरम्
    । नानातन्त्रविधानेन कलौ अपि यथा श्रुणु ॥ ॥ कृष्णवर्णं त्विषाकृष्णं साङ्गौपाङ्गास्त्र पार्षदम् । यज्ञैः
    सङ्कीर्तनप्रायैः यजन्ति हि सुमेधसः ॥ ॥ ध्येयं सदा परिभवघ्नं अभीष्टदोहम् तीर्थास्पदं शिवविरिञ्चिनुतं
    शरण्यम् । भृत्यार्तिहन् प्रणतपाल भवाब्धिपोतम् वन्दे महापुरुष ते चरणारविन्दम् ॥ ॥ त्यक्त्वा सुदुस्त्यजसुरैप्सितराज्यलक्ष्मीम्
    धर्मिष्ठः आर्यवचसा यत् अगात् अरण्यम् । मायामृगं दयितया इप्सितं अन्वधावत् वन्दे महापुरुष ते चरणारविन्दम्
    ॥ ॥ एवं युगानुरूपाभ्यां भगवान् युगवर्तिभिः । मनुजैः इज्यते राजन् श्रेयसां ईश्वरः हरिः ॥ ॥ कलिं सभाजयन्ति
    आर्या गुणज्ञाः सारभागिनः । यत्र सङ्कीर्तनेन एव सर्वः स्वार्थः अभिलभ्यते ॥ ॥ न हि अतः परमः लाभः देहिनां
    भ्राम्यतां इह । यतः विन्देत परमां शान्तिं नश्यति संसृतिः ॥ ॥ कृतादिषु प्रजा राजन् कलौ इच्छन्ति सम्भवम्
    । कलौ खलु भविष्यन्ति नारायणपरायणाः ॥ ॥ क्वचित् क्वचित् महाराज द्रविडेषु च भूरिशः । ताम्रपर्णी नदी
    यत्र कृतमाला पयस्विनी ॥ ॥ कावेरी च महापुण्या प्रतीची च महानदी । ये पिबन्ति जलं तासां मनुजा मनुजेश्वर
    । प्रायः भक्ताः भगवति वासुदेवः अमल आशयाः ॥ ॥ देवर्षिभूताप्तनृणा पितॄणां न किङ्करः न अयं ऋणी च राजन्
    । सर्वात्मना यः शरणं शरण्यम् गतः मुकुन्दं परिहृत्य कर्तुम् ॥ ॥ स्वपादमूलं भजतः प्रियस्य त्यक्तान्यभावस्य
    हरिः परेशः । विकर्म यत् च उत्पतितं कथञ्चित् धुनोति सर्वं हृदि सन्निविष्टः ॥ ॥ नारदः उवाच । धर्मान्
    भागवतान् इत्थं श्रुत्वा अथ मिथिलेश्वरः । जायन्त इयान् मुनीन् प्रीतः सोपाध्यायः हि अपूजयत् ॥ ॥ ततः
    अन्तः दधिरे सिद्धाः सर्वलोकस्य पश्यतः । राजा धर्मान् उपातिष्ठन् अवाप परमां गतिम् ॥ ॥ त्वं अपि एतान्
    महाभाग धर्मान् भागवतान् श्रुतान् । आस्थितः श्रद्धया युक्तः निःसङ्गः यास्यसे परम् ॥ ॥ युवयोः खलु दम्पत्योः
    यशसा पूरितं जगत् । पुत्रतां अगमत् यत् वां भगवान् ईश्वरः हरिः ॥ ॥ दर्शनालिङ्गनालापैः शयनासनभोजनैः ।
    आत्मा वां पावितः कृष्णे पुत्रस्नेह प्रकुर्वतोः ॥ ॥ वैरेण यं नृपतयः शिशुपालपौण्ड्र शाल्वादयः गतिविलासविलोकनादयैः
    । ध्यायन्तः आकृतधियः शयनासनादौ तत् साम्यं आपुः अनुरक्तधियां पुनः किम् ॥ ॥ मा अपत्यबुद्धिं अकृथाः कृष्णे
    सर्वात्मनीश्वरे । मायामनुष्यभावेन गूढ ऐश्वर्ये परे अव्यये ॥ ॥ भूभारराजन्यहन्तवे गुप्तये सताम् । अवतीर्णस्य
    निर्वृत्यै यशः लोके वितन्यते ॥ ॥ श्रीशुकः उवाच । एतत् श्रुत्वा महाभागः वसुदेवः अतिविस्मितः । देवकी
    च महाभागाः जहतुः मोहं आत्मनः ॥ ॥ इतिहासं इमं पुण्यं धारयेत् यः समाहितः । सः विधूय इह शमलं ब्रह्मभूयाय
    कल्पते ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे वसुदेवनारदसंवादे पञ्चमोऽध्यायः
    ॥
