    ग॑न्ध॒र्वाणां॒ ङ्क॒पिञ्ज॑लो रु॒द्राणा त्कु॑ण्डृ॒णाची॑ गो॒लत्ति॑का॒ ता अ॑फ्स॒रसा॒ श्वदे॒वः पि॒त्वो
    न्यङ्कुः॒ कश॒स्ते ङ्क॒श्यपः॒ क्वयिः॑ कु॒टरु॑र्दात्यौ॒हस्ते सि॑नीवा॒ल्यै बृह॒स्पत॑ये शित्पु॒टः ॥ शका॑
    भौ॒मी पा॒न्त्रः कशो॑ मान्थी॒लव॒स्ते पि॑तृ॒णा वँथ्स॒राय॒ लोपा॑ क॒पोत॒ उलू॑क ऋ॒ताः कृ॑क॒वाकुः॑ सावि॒त्रः
    ॥ रुरू॑ रौ॒द्रः कृ॑कला॒स श्श॒कुनिः॒ पिप्प॑का॒ ते श॑र॒व्या॑यै हरि॒णो मा॑रु॒तो ब्रह्म॑णे शा॒र्गस्त॒रक्षुः॑
    कृ॒ष्ण श्श्वा च॑तुर॒क्षो ग॑र्द॒भस्त इ॑तरज॒नाना॑म॒ग्नये॒ धूङ्क्ष्णा न्तरि॒क्ष उ॒द्रो म॒द्गुः प्ल॒वस्ते॑
    ऽपामदि॑त्यै हग्ंस॒साचि॑रिन्द्रा॒ण्यै कीर् शा॒ गृद्ध्रः॑ शितिक॒क्षी वा र्ध्राण॒सस्ते दि॒व्या द्या॑वापृथि॒व्या
    र्ज॒न्यो ह॒ग्ं॒सो वृको॑ वृषद॒ग्ं॒शस्त ऐ॒न्द्रा अ॒पामु॒द्रो स्सि॒ग्ं॒हो न॑कु॒लो व्या॒घ्रस्ते म॑हे॒न्द्राय॒
    कामा॑य॒ पर॑स्वान् ॥ आ॒ग्ने॒यः कृ॒ष्णग्री॑व स्सारस्व॒ती मे॒षी ब॒भ्रु श्शि॑तिपृ॒ष्ठो बा॑र् ऽरु॒णो मा॑रु॒तः
    क॒ल्माष॑ ऐन्द्रा॒ग्न स्सग्ं॑हि॒तो॑ ऽधोरा॑म स्सावि॒त्रो वा॑रु॒णः पेत्वः॑ ॥ अश्व॑स्तूप॒रो गो॑मृ॒गस्ते
    प्रा॑जाप॒त्या आ ग्ने॒यौ कृ॒ष्णग्री॑वौ त्वा॒ष्ट्रौ लो॑मशस॒क्थौ शि॑तिपृ॒ष्ठौ बा॑र् हस्प॒त्यौ धा॒त्रे
    पृ॑षोद॒र स्सौ॒र्यो ब॒लक्षः॒ पेत्वः॑ ॥ ऽनी॑कवते॒ रोहि॑ताञ्जि न॒धोरा॑मौ सावि॒त्रौ पौ॒ष्णौ र॑ज॒तना॑भी
    वैश्वदे॒वौ पि॒शङ्गौ॑ तूप॒रौ मा॑रु॒तः क॒ल्माष॑ आग्ने॒यः कृ॒ष्णो॑ स्सा॑रस्व॒ती मे॒षी वा॑रु॒णः कृ॒ष्ण
    एक॑शितिपा॒ दे॒वास्त्वेन्द्र॑ज्येष्ठा ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्पञ्चमकाण्डे
    पञ्चमः प्रश्न
