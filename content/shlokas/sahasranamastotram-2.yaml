id: sahasranamastotram-2
category: sahasranama
name:
  english: sahasranamastotram
  devanagari: सहस्रनामस्तोत्रम्
content:
  english: katikaram devim sabhesham bhaje || lam prithivyatmakam ityadina pancapuja | shrishiva uvaca
    shrishivah shrishivanathah shriman shripatipujitah | shivankarah shivatarashshishtahrishtashshivagamah
    || 1|| akhandanandacidrupah paramanandatandavah | apasmritinyastapadah krittivasah kripakarah || 2||
    kalivadapriyah kalah kalatitah kaladharah | kalaneta kalahanta kalacakrapravartakah || 3|| kalajnah
    kamadah kantah kamarih kamapalakah | kalyanamurtih kalyaniramanah kamalekshanah || 4|| kalakanthah
    kalakalah kalakutavishashanah | kritajnah kritisarajnah krishanuh krishnapingalah || 5|| karicarmambaradharah
    kapali kalushapahah | kapalamalabharanah kankalah kalinashanah || 6|| kailasavasi kameshah kavih kapatavarjitah
    | kamaniyah kalanathashekharah kambukandharah || 7|| kandarpakotisadrishah kapardi kamalananah | karabjadhritakalagnih
    kadambakusumarunah || 8|| kamaniyanijanandamudrancitakarambujah | sphuraddamarunidhvananirjitambhodhinisvanah
    || 9|| uddandatandavashcanda urdhvatandavapanditah | savyatandavasampanno mahatandavavaibhavah ||
    10|| brahmandakandavisphotamahapralayatandavah | mahogratandavabhijnah paribhramanatandavah || 11||
    nandinatyapriyo nandi natesho nataveshabhrit | kalikanatyarasiko nishanatananishcalah || 12|| bhringinatyapramanajno
    bhramarayitanatyakrit | viyadadijagatsrashta vividhanandadayakah || 13|| vikararahito vishnurviradisho
    viranmayah | viradhridayapadmastho vidhirvishvadhiko vibhuh || 14|| virabhadro vishalaksho vishnubano
    vishampatih | vidyanidhirvirupaksho vishvayonirvrishadhvajah || 15|| virupo vishvadigvyapi vitashoko
    virocanah | vyomakesho vyomamurtirvyomakaro'vyayakritih || 16|| vyaghrapadapriyo vyaghracarmadhridvyadhinashanah
    | vyakrito vyaprito vyapi vyapyasakshi visharadah || 17|| vyamohanashano vyaso vyakhyamudralasatkarah
    | varado vamano vandyo varishtho vajravarmabhrit || 18|| vedavedyo vedarupo vedavedantavittamah |
    vedarthavidvedayonih vedango vedasamstutah || 19|| vaikunthavallabho'varshyo vaishvanaravilocanah
    | samastabhuvanavyapi samriddhassatatoditah || 20|| sukshmatsukshmatarah suryah sukshmasthulatvavarjitah
    | jahnukanyadharo janmajaramrityunivarakah || 21|| shurasenah shubhakarah shubhramurtih shucismitah
    | anargharatnakhacitakirito nikate sthitah || 22|| sudharupah suradhyakshah subhruh sukhaghanah sudhih
    | bhadro bhadraprado bhadravahano bhaktavatsalah || 23|| bhaganetraharo bhargo bhavaghno bhaktimannidhih
    | arunah sharanah sharvah sharanyah sharmadah shivah || 24|| pavitrah paramodarah paramapannivarakah
    | sanatanassamah satyah satyavadi samriddhidah || 25|| dhanvi dhanadhipo dhanyo dharmagopta dharadhipah
    | tarunastarakastamrastarishnustattvabodhakah || 26|| rajarajeshvaro ramyo ratrincaravinashanah |
    gahvareshtho ganadhisho ganesho gativarjitah || 27|| patanjaliprananathah paraparavivarjitah | paramatma
    parajyotih parameshthi paratparah || 28|| narasimho nagadhyaksho nadanto nadavarjitah | namadanandado
    namyo nagarajaniketanah || 29|| daivyo bhishakpramanajno brahmanyo brahmanatmakah | kritakritah krishah
    krishnah shantidashsharabhakritih || 30|| brahmavidyaprado brahma brihadgarbho brihaspatih | sadyo
    jatassadaradhyah samagassamasamstutah || 31|| aghoro'dbhutacaritra anandavapuragranih | sarvavidyanamishana
    ishvaranamadhishvarah || 32|| sarvarthah sarvada tushtah sarvashastrarthasammatah | sarvajnah sarvadah
    sthanuh sarveshassamarapriyah || 33|| janardano jagatsvami janmakarmanivarakah | mocako mohavicchetta
    modaniyo mahaprabhuh || 34|| vpuptakesho vivishado vishvakseno vishodhakah | sahasrakshah sahasranghrih
    sahasravadanambujah || 35|| sahasraksharcitah samrat sandhata sampadalayah | babhrurbahuvidhakaro
    balapramathano bali || 36|| manobharta manogamyo mananaikaparayanah | udasina upadrashta maunagamyo
    munishvarah || 37|| amani madano'manyuramano manado manuh | yashasvi yajamanatma yajnabhugyajanapriyah
    || 38|| midhushtamo mrigadharo mrikandutanayapriyah | puruhutah puradveshi puratrayaviharavan || 39||
    punyah pumanpurishayah pusha purnah puratanah | shayanashshantamah shanta shasakashshyamalapriyah
    || 40|| bhavajno bandhavicchetta bhavatito'bhayankarah | manishi manujadhisho mithyapratyayanashanah
    || 41|| niranjano nityashuddho nityabuddho nirashrayah | nirvikalpo niralambo nirvikaro niramayah
    || 42|| nirankusho niradharo nirapayo niratyayah | guhashayo gunatito gurumurtirguhapriyah || 43||
    pramanam pranavah prajnah pranadah prananayakah | sutratma sulabhassvacchah sudarassundarananah ||
    44|| kapalamalalankarah kalantakavapurdharah | duraradhyo duradharsho dushtaduro durasadah || 45||
    durvijneyo duracaranashano durmadantakah | sarveshvarah sarvasakshi sarvatma sakshivarjitah || 46||
    sarvadvandvakshayakarah sarvapadvinivarakah | sarvapriyatamassarvadaridyakleshanashanah || 47|| drashta
    darshayita danto dakshinamurtirupabhrit | dakshadhvaraharo daksho daharastho dayanidhih || 48|| samadrishtissatyakamah
    sanakadimunistutah | patih pancatvanirmuktah pancakrityaparayanah || pancayajnapriyah pancapranadhipatiravyayah
    | pancabhutaprabhuh pancapujasantushtamanasah || 50|| vighneshvaro vighnahanta shaktipanishsharodbhavah
    | gudho guhyatamo gopyo gorakshi ganasevitah || 51|| suvratassatyasankalpah svasamvedyassukhavahah
    | yogagamyo yoganishtho yoganando yudhishthirah || 52|| tattvavabodhastatveshah tattvabhavastaponidhih
    | aksharastryaksharastrayakshah pakshapatavivarjitah || 53|| manibhadrarcito manyo mayavi mantriko
    mahan | kutharabhritkuladrishah kuncitaikapadambujah || 54|| yaksharadyajnaphalado yajnamurtiryashaskarah
    | siddheshassiddhijanakah siddhantassiddhavaibhavah || 55|| ravimandalamadhyastho rajogunavivarjitah
    | vahnimandalamadhyastho varshiyan varuneshvarah || 56|| somamandalamadhyasthah somassaumyassuhridvarah
    | dakshinagnirgarhapatyo damano damanantakah
  devanagari: कटिकरां देवीं सभेशं भजे ॥ लं पृथिव्यात्मकम् इत्यादिना पञ्चपूजा । श्रीशिव उवाच श्रीशिवः श्रीशिवानाथः
    श्रीमान् श्रीपतिपूजितः । शिवङ्करः शिवतरश्शिष्टहृष्टश्शिवागमः ॥ १॥ अखण्डानन्दचिद्रूपः परमानन्दताण्डवः
    । अपस्मृतिन्यस्तपादः कृत्तिवासाः कृपाकरः ॥ २॥ कालीवादप्रियः कालः कालातीतः कलाधरः । कालनेता कालहन्ता
    कालचक्रप्रवर्तकः ॥ ३॥ कालज्ञः कामदः कान्तः कामारिः कामपालकः । कल्याणमूर्तिः कल्याणीरमणः कमलेक्षणः
    ॥ ४॥ कालकण्ठः कालकालः कालकूटविषाशनः । कृतज्ञः कृतिसारज्ञः कृशानुः कृष्णपिङ्गलः ॥ ५॥ करिचर्माम्बरधरः
    कपाली कलुषापहः । कपालमालाभरणः कङ्कालः कलिनाशनः ॥ ६॥ कैलासवासी कामेशः कविः कपटवर्जितः । कमनीयः कलानाथशेखरः
    कम्बुकन्धरः ॥ ७॥ कन्दर्पकोटिसदृशः कपर्दी कमलाननः । कराब्जधृतकालाग्निः कदम्बकुसुमारुणः ॥ ८॥ कमनीयनिजानन्दमुद्राञ्चितकराम्बुजः
    । स्फुरड्डमरुनिध्वाननिर्जिताम्भोधिनिस्वनः ॥ ९॥ उद्दण्डताण्डवश्चण्ड ऊर्ध्वताण्डवपण्डितः । सव्यताण्डवसम्पन्नो
    महाताण्डववैभवः ॥ १०॥ ब्रह्माण्डकाण्डविस्फोटमहाप्रलयताण्डवः । महोग्रताण्डवाभिज्ञः परिभ्रमणताण्डवः ॥
    ११॥ नन्दिनाट्यप्रियो नन्दी नटेशो नटवेषभृत् । कालिकानाट्यरसिको निशानटननिश्चलः ॥ १२॥ भृङ्गिनाट्यप्रमाणज्ञो
    भ्रमरायितनाट्यकृत् । वियदादिजगत्स्रष्टा विविधानन्ददायकः ॥ १३॥ विकाररहितो विष्णुर्विराडीशो विराण्मयः
    । विराढृदयपद्मस्थो विधिर्विश्वाधिको विभुः ॥ १४॥ वीरभद्रो विशालाक्षो विष्णुबाणो विशाम्पतिः । विद्यानिधिर्विरूपाक्षो
    विश्वयोनिर्वृषध्वजः ॥ १५॥ विरूपो विश्वदिग्व्यापी वीतशोको विरोचनः । व्योमकेशो व्योममूर्तिर्व्योमाकारोऽव्ययाकृतिः
    ॥ १६॥ व्याघ्रपादप्रियो व्याघ्रचर्मधृद्व्याधिनाशनः । व्याकृतो व्यापृतो व्यापी व्याप्यसाक्षी विशारदः
    ॥ १७॥ व्यामोहनाशनो व्यासो व्याख्यामुद्रालसत्करः । वरदो वामनो वन्द्यो वरिष्ठो वज्रवर्मभृत् ॥ १८॥ वेदवेद्यो
    वेदरूपो वेदवेदान्तवित्तमः । वेदार्थविद्वेदयोनिः वेदाङ्गो वेदसंस्तुतः ॥ १९॥ वैकुण्ठवल्लभोऽवर्ष्यो वैश्वानरविलोचनः
    । समस्तभुवनव्यापी समृद्धस्सततोदितः ॥ २०॥ सूक्ष्मात्सूक्ष्मतरः सूर्यः सूक्ष्मस्थूलत्ववर्जितः । जह्नुकन्याधरो
    जन्मजरामृत्युनिवारकः ॥ २१॥ शूरसेनः शुभाकारः शुभ्रमूर्तिः शुचिस्मितः । अनर्घरत्नखचितकिरीटो निकटे स्थितः
    ॥ २२॥ सुधारूपः सुराध्यक्षः सुभ्रूः सुखघनः सुधीः । भद्रो भद्रप्रदो भद्रवाहनो भक्तवत्सलः ॥ २३॥ भगनेत्रहरो
    भर्गो भवघ्नो भक्तिमन्निधिः । अरुणः शरणः शर्वः शरण्यः शर्मदः शिवः ॥ २४॥ पवित्रः परमोदारः परमापन्निवारकः
    । सनातनस्समः सत्यः सत्यवादी समृद्धिदः ॥ २५॥ धन्वी धनाधिपो धन्यो धर्मगोप्ता धराधिपः । तरुणस्तारकस्ताम्रस्तरिष्णुस्तत्त्वबोधकः
    ॥ २६॥ राजराजेश्वरो रम्यो रात्रिञ्चरविनाशनः । गह्वरेष्ठो गणाधीशो गणेशो गतिवर्जितः ॥ २७॥ पतञ्जलिप्राणनाथः
    परापरविवर्जितः । परमात्मा परज्योतिः परमेष्ठी परात्परः ॥ २८॥ नारसिंहो नगाध्यक्षो नादान्तो नादवर्जितः
    । नमदानन्ददो नम्यो नगराजनिकेतनः ॥ २९॥ दैव्यो भिषक्प्रमाणज्ञो ब्रह्मण्यो ब्राह्मणात्मकः । कृताकृतः
    कृशः कृष्णः शान्तिदश्शरभाकृतिः ॥ ३०॥ ब्रह्मविद्याप्रदो ब्रह्मा बृहद्गर्भो बृहस्पतिः । सद्यो जातस्सदाराध्यः
    सामगस्सामसंस्तुतः ॥ ३१॥ अघोरोऽद्भुतचारित्र आनन्दवपुरग्रणीः । सर्वविद्यानामीशान ईश्वराणामधीश्वरः ॥
    ३२॥ सर्वार्थः सर्वदा तुष्टः सर्वशास्त्रार्थसम्मतः । सर्वज्ञः सर्वदः स्थाणुः सर्वेशस्समरप्रियः ॥ ३३॥
    जनार्दनो जगत्स्वामी जन्मकर्मनिवारकः । मोचको मोहविच्छेत्ता मोदनीयो महाप्रभुः ॥ ३४॥ व्पुप्तकेशो विविशदो
    विष्वक्सेनो विशोधकः । सहस्राक्षः सहस्राङ्घ्रिः सहस्रवदनाम्बुजः ॥ ३५॥ सहस्राक्षार्चितः सम्राट् सन्धाता
    सम्पदालयः । बभ्रुर्बहुविधाकारो बलप्रमथनो बली ॥ ३६॥ मनोभर्ता मनोगम्यो मननैकपरायणः । उदासीन उपद्रष्टा
    मौनगम्यो मुनीश्वरः ॥ ३७॥ अमानी मदनोऽमन्युरमानो मानदो मनुः । यशस्वी यजमानात्मा यज्ञभुग्यजनप्रियः ॥
    ३८॥ मीढुष्टमो मृगधरो मृकण्डुतनयप्रियः । पुरुहूतः पुरद्वेषी पुरत्रयविहारवान् ॥ ३९॥ पुण्यः पुमान्पुरिशयः
    पूषा पूर्णः पुरातनः । शयनश्शन्तमः शान्त शासकश्श्यामलाप्रियः ॥ ४०॥ भावज्ञो बन्धविच्छेत्ता भावातीतोऽभयङ्करः
    । मनीषी मनुजाधीशो मिथ्याप्रत्ययनाशनः ॥ ४१॥ निरञ्जनो नित्यशुद्धो नित्यबुद्धो निराश्रयः । निर्विकल्पो
    निरालम्बो निर्विकारो निरामयः ॥ ४२॥ निरङ्कुशो निराधारो निरपायो निरत्ययः । गुहाशयो गुणातीतो गुरुमूर्तिर्गुहप्रियः
    ॥ ४३॥ प्रमाणं प्रणवः प्राज्ञः प्राणदः प्राणनायकः । सूत्रात्मा सुलभस्स्वच्छः सूदरस्सुन्दराननः ॥ ४४॥
    कपालमालालङ्कारः कालान्तकवपुर्धरः । दुराराध्यो दुराधर्षो दुष्टदूरो दुरासदः ॥ ४५॥ दुर्विज्ञेयो दुराचारनाशनो
    दुर्मदान्तकः । सर्वेश्वरः सर्वसाक्षी सर्वात्मा साक्षिवर्जितः ॥ ४६॥ सर्वद्वन्द्वक्षयकरः सर्वापद्विनिवारकः
    । सर्वप्रियतमस्सर्वदारिद्यक्लेशनाशनः ॥ ४७॥ द्रष्टा दर्शयिता दान्तो दक्षिणामूर्तिरूपभृत् । दक्षाध्वरहरो
    दक्षो दहरस्थो दयानिधिः ॥ ४८॥ समदृष्टिस्सत्यकामः सनकादिमुनिस्तुतः । पतिः पञ्चत्वनिर्मुक्तः पञ्चकृत्यपरायणः
    ॥ पञ्चयज्ञप्रियः पञ्चप्राणाधिपतिरव्ययः । पञ्चभूतप्रभुः पञ्चपूजासन्तुष्टमानसः ॥ ५०॥ विघ्नेश्वरो विघ्नहन्ता
    शक्तिपाणिश्शरोद्भवः । गूढो गुह्यतमो गोप्यो गोरक्षी गणसेवितः ॥ ५१॥ सुव्रतस्सत्यसङ्कल्पः स्वसंवेद्यस्सुखावहः
    । योगगम्यो योगनिष्ठो योगानन्दो युधिष्ठिरः ॥ ५२॥ तत्त्वावबोधस्तत्वेशः तत्त्वभावस्तपोनिधिः । अक्षरस्त्र्यक्षरस्त्रयक्षः
    पक्षपातविवर्जितः ॥ ५३॥ माणिभद्रार्चितो मान्यो मायावी मान्त्रिको महान् । कुठारभृत्कुलाद्रीशः कुञ्चितैकपदाम्बुजः
    ॥ ५४॥ यक्षराड्यज्ञफलदो यज्ञमूर्तिर्यशस्करः । सिद्धेशस्सिद्धिजनकः सिद्धान्तस्सिद्धवैभवः ॥ ५५॥ रविमण्डलमध्यस्थो
    रजोगुणविवर्जितः । वह्निमण्डलमध्यस्थो वर्षीयान् वरुणेश्वरः ॥ ५६॥ सोममण्डलमध्यस्थः सोमस्सौम्यस्सुहृद्वरः
    । दक्षिणाग्निर्गार्हपत्यो दमनो दमनान्तकः
