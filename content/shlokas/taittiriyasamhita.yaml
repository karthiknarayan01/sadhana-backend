id: taittiriyasamhita
category: veda
name:
  english: taittiriyasamhita
  devanagari: तैत्तिरीयसम्हिता
content:
  english: 42 samgramametameva nirvapedyo hatamanah svayam papa iva syadetani hi va etasmadapakrantanyathaisha
    hatamanah svayam papa imdrameva manyumantam manasvantagg svena bhagadheyenopa dhavati sa evasminnimdriyam
    manyum mano dadhati na hatamanah svayam papo bhavatimdraya datre purodashamekadashakapalam nirvapedyah
    kamayeta danakama me prajah syu 43 ritimdrameva dataragg svena bhagadheyenopa dhavati sa evasmai danakamah
    prajah karoti danakama asmai praja bhavantimdraya pradatre purodashamekadashakapalam nirvapedyasmai
    prattamiva sanna pradiyetemdrameva pradataragg svena bhagadheyenopa dhavati sa evasmai pra dapayatimdraya
    sutramne purodashamekadashakapalam nirvapedaparuddho va 44 'parudhyamano vemdrameva sutramanagg svena
    bhagadheyenopa dhavati sa evainam trayate'naparudhyo bhavatimdro vai sadringevatabhirasithsa na vyavritamagacchathsa
    prajapatimupadhavattasma etamaimdramekadashakapalam niravapattenaivasminnimdriyamadadhacchakvari yajyanuvakye
    akarodvajro vai shakvari sa enam vajro bhutya aindha 45 so'bhavathso'bibhedbhutah pra ma dhakshyatiti
    sa prajapatim punarupadhavathsa prajapatih shakvarya adhi revatim niramimita shantya apradahaya yo'lagg
    shriyai santhsadrinkhsamanaih syattasma etamaimdramekadashakapalam nirvapedimdrameva svena bhagadheyenopa
    dhavati sa evasminnimdriyam dadhati revati puro'nuvakya bhavati shantya apradahaya shakvari yajya
    vajro vai shakvari sa enam vajro bhutya indhe bhavatyeva || 2| 2| 8|| api tagg syurvaindha bhavati
    caturdasha ca || 2| 2| 8|| 46 agnavaishnavamekadashakapalam nirvapedabhi caranthsarasvatyajyabhaga
    syadbarhaspatyashcaruryadagnavaishnava ekadashakapalo bhavatyagnih sarva devata vishnuryajno devatabhishcaivainam
    yajnena cabhi carati sarasvatyajyabhaga bhavati vagvai sarasvati vacaivainamabhi carati barhaspatyashcarurbhavati
    brahma vai devanam brihaspatirbrahmanaivainamabhi carati 47 prati vai parastadabhicarantamabhi caranti
    dve dve puro'nuvakye kuryadati prayuktya etayaiva yajetabhicaryamano devatabhireva devatah praticarati
    yajnena yajnam vaca vacam brahmana brahma sa devatashcaiva yajnam ca madhyato vyavasarpati tasya na
    kutashcanopavyadho bhavati nainamabhicaranth strinuta agnavaishnavamekadashakapalam nirvapedyam yajno
    no 48 panamedagnih sarva devata vishnuryajno'gnim caiva vishnum ca svena bhagadheyenopa dhavati tavevasmai
    yajnam pra yacchata upainam yajno namatyagnavaishnavam ghrite carum nirvapeccakshushkamo'gnervai cakshusha
    manushya vi pashyanti yajnasya deva agnim caiva vishnum ca svena bhagadheyenopa dhavati taveva 49
    'smincakshurdhattashcakshushmaneva bhavati dhenvai va etadreto yadajyamanaduhastandula mithunadevasmai
    cakshuh pra janayati ghrite bhavati tejo vai ghritam tejashcakshustejasaivasmai tejashcakshurava rundha
    imdriyam vai viryam vrinkte bhratrivyo yajamano'yajamanasyadhvarakalpam prati nirvapedbhratrivye yajamane
    nasyemdriyam 50 viryam vrinkte pura vacah pravaditornirvapedyavatyeva vaktamaproditam bhratrivyasya
    vrinkte tamasya vacam pravadantimanya vaco'nu pra vadanti ta imdriyam viryam yajamane dadhatyagnavaishnavamashtakapalam
    nirvapetpratahsavanasyakale sarasvatyajyabhaga syadbarhaspatyashcaruryadashtakapalo bhavatyashtakshara
    gayatri gayatram pratah savanam pratah savanameva tenapno 51 tyagnavaishnavamekadashakapalam nirvapenmadhyandinasya
    savanasyakale sarasvatyajyabhaga syadbarhaspatyashcaruryadekadashakapalo bhavatyekadashakshara trishtuptraishtubham
    madhyandina
  devanagari: ४२ संग्राममेतामेव निर्वपेद्यो हतमनाः स्वयं पाप इव स्यादेतानि हि वा एतस्मादपक्रान्तान्यथैष
    हतमनाः स्वयं पाप इंद्रमेव मन्युमन्तं मनस्वन्तग्ग् स्वेन भागधेयेनोप धावति स एवास्मिन्निंद्रियं मन्युं
    मनो दधाति न हतमनाः स्वयं पापो भवतींद्राय दात्रे पुरोडाशमेकादशकपालं निर्वपेद्यः कामयेत दानकामा मे प्रजाः
    स्यु ४३ रितींद्रमेव दातारग्ग् स्वेन भागधेयेनोप धावति स एवास्मै दानकामाः प्रजाः करोति दानकामा अस्मै
    प्रजा भवन्तींद्राय प्रदात्रे पुरोडाशमेकादशकपालं निर्वपेद्यस्मै प्रत्तमिव सन्न प्रदीयेतेंद्रमेव प्रदातारग्ग्
    स्वेन भागधेयेनोप धावति स एवास्मै प्र दापयतींद्राय सुत्राम्णे पुरोडाशमेकादशकपालं निर्वपेदपरुद्धो वा
    ४४ ऽपरुध्यमानो वेंद्रमेव सुत्रामाणग्ग् स्वेन भागधेयेनोप धावति स एवैनं त्रायतेऽनपरुध्यो भवतींद्रो वै
    सदृङ्गेवताभिरासीथ्स न व्यावृतमगच्छथ्स प्रजापतिमुपाधावत्तस्मा एतमैंद्रमेकादशकपालं निरवपत्तेनैवास्मिन्निंद्रियमदधाच्छक्वरी
    याज्यानुवाक्ये अकरोद्वज्रो वै शक्वरी स एनं वज्रो भूत्या ऐन्ध ४५ सोऽभवथ्सोऽबिभेद्भूतः प्र मा धक्ष्यतीति
    स प्रजापतिं पुनरुपाधावथ्स प्रजापतिः शक्वर्या अधि रेवतीं निरमिमीत शान्त्या अप्रदाहाय योऽलग्ग् श्रियै
    सन्थ्सदृङ्ख्समानैः स्यात्तस्मा एतमैंद्रमेकादशकपालं निर्वपेदिंद्रमेव स्वेन भागधेयेनोप धावति स एवास्मिन्निंद्रियं
    दधाति रेवती पुरोऽनुवाक्या भवति शान्त्या अप्रदाहाय शक्वरी याज्या वज्रो वै शक्वरी स एनं वज्रो भूत्या
    इन्धे भवत्येव ॥ २। २। ८॥ अपि तग्ग् स्युर्वैन्ध भवति चतुर्दश च ॥ २। २। ८॥ ४६ आग्नावैष्णवमेकादशकपालं
    निर्वपेदभि चरन्थ्सरस्वत्याज्यभागा स्याद्बार्हस्पत्यश्चरुर्यदाग्नावैष्णव एकादशकपालो भवत्यग्निः सर्वा
    देवता विष्णुर्यज्ञो देवताभिश्चैवैनं यज्ञेन चाभि चरति सरस्वत्याज्यभागा भवति वाग्वै सरस्वती वाचैवैनमभि
    चरति बार्हस्पत्यश्चरुर्भवति ब्रह्म वै देवानां बृहस्पतिर्ब्रह्मणैवैनमभि चरति ४७ प्रति वै परस्तादभिचरन्तमभि
    चरन्ति द्वे द्वे पुरोऽनुवाक्ये कुर्यादति प्रयुक्त्या एतयैव यजेताभिचर्यमाणो देवताभिरेव देवताः प्रतिचरति
    यज्ञेन यज्ञं वाचा वाचं ब्रह्मणा ब्रह्म स देवताश्चैव यज्ञं च मध्यतो व्यवसर्पति तस्य न कुतश्चनोपाव्याधो
    भवति नैनमभिचरन्थ् स्तृणुत आग्नावैष्णवमेकादशकपालं निर्वपेद्यं यज्ञो नो ४८ पनमेदग्निः सर्वा देवता विष्णुर्यज्ञोऽग्निं
    चैव विष्णुं च स्वेन भागधेयेनोप धावति तावेवास्मै यज्ञं प्र यच्छत उपैनं यज्ञो नमत्याग्नावैष्णवं घृते
    चरुं निर्वपेच्चक्षुष्कामोऽग्नेर्वै चक्षुषा मनुष्या वि पश्यन्ति यज्ञस्य देवा अग्निं चैव विष्णुं च स्वेन
    भागधेयेनोप धावति तावेवा ४९ ऽस्मिञ्चक्षुर्धत्तश्चक्षुष्मानेव भवति धेन्वै वा एतद्रेतो यदाज्यमनडुहस्तण्डुला
    मिथुनादेवास्मै चक्षुः प्र जनयति घृते भवति तेजो वै घृतं तेजश्चक्षुस्तेजसैवास्मै तेजश्चक्षुरव रुन्ध
    इंद्रियं वै वीर्यं वृङ्क्ते भ्रातृव्यो यजमानोऽयजमानस्याध्वरकल्पां प्रति निर्वपेद्भ्रातृव्ये यजमाने
    नास्येंद्रियं ५० वीर्यं वृङ्क्ते पुरा वाचः प्रवदितोर्निर्वपेद्यावत्येव वाक्तामप्रोदितां भ्रातृव्यस्य
    वृङ्क्ते तामस्य वाचं प्रवदन्तीमन्या वाचोऽनु प्र वदन्ति ता इंद्रियं वीर्यं यजमाने दधत्याग्नावैष्णवमष्टाकपालं
    निर्वपेत्प्रातःसवनस्याकाले सरस्वत्याज्यभागा स्याद्बार्हस्पत्यश्चरुर्यदष्टाकपालो भवत्यष्टाक्षरा गायत्री
    गायत्रं प्रातः सवनं प्रातः सवनमेव तेनाप्नो ५१ त्याग्नावैष्णवमेकादशकपालं निर्वपेन्माध्यन्दिनस्य सवनस्याकाले
    सरस्वत्याज्यभागा स्याद्बार्हस्पत्यश्चरुर्यदेकादशकपालो भवत्येकादशाक्षरा त्रिष्टुप्त्रैष्टुभं माध्यन्दिन
