id: dattastotra-1
category: stotram
name:
  english: dattastotra 1
  devanagari: दत्तस्तोत्र १
content:
  english: shridattatreyastotram svagatam tava svagatam || om || svagatam tava svagatam gurudeva tava
    susvagatam | smaranacintanapujanat nirmale hrinmandire | shridatta tava susvagatam gurudeva tava susvagatam
    || svagatarthe pranajyotirnayanadvare tishthita | caranakamalakshalanarta nayanajalasaritagata ||
    asanarthe hridayapadmam premagandhavilepanam | bhavakusumanyarpayeham pranavamantrairarcanam || yogadhenordohanam
    bhaktikshiram sevanam | svanandakandam bhojanam santoshaniram prashanam || pranavagayanatatpara tava
    prarthane dhanya para | talabaddham pranavahanam kumdalinyornartanam || venunadam pranavanadam shruyatam
    ghamtaravah | tattvamasi niramjanam so'hamiti mamtramjalih || gurudeva tava susvagatam shridatta tava
    susvagatam ||
  devanagari: श्रीदत्तात्रेयस्तोत्रं स्वागतं तव स्वागतम् ॥ ॐ ॥ स्वागतं तव स्वागतं गुरूदेव तव सुस्वागतम्
    । स्मरणचिन्तनपूजनात् निर्मले हृन्मन्दिरे । श्रीदत्त तव सुस्वागतं गुरूदेव तव सुस्वागतम् ॥ स्वागतार्थे
    प्राणज्योतिर्नयनद्वारे तिष्ठिता । चरणकमलक्षालनार्ता नयनजलसरितागता ॥ आसनार्थे हृदयपद्मं प्रेमगन्धविलेपनम्
    । भावकुसुमान्यर्पयेहं प्रणवमन्त्रैरर्चनम् ॥ योगधेनोर्दोहनं भक्तिक्षीरं सेवनम् । स्वानन्दकन्दं भोजनं
    सन्तोषनीरं प्राशनम् ॥ प्रणवगायनतत्परा तव प्रार्थने धन्या परा । तालबद्धं प्राणवहनं कुंडलिन्योर्नर्तनम्
    ॥ वेणुनादं प्रणवनादं श्रूयतां घंटारवः । तत्त्वमसि नीरांजनं सोऽहमिति मंत्रांजलिः ॥ गुरुदेव तव सुस्वागतं
    श्रीदत्त तव सुस्वागतम् ॥
