id: devi-mahatmyam-keelaka-stotram
category: stotram
name:
  english: Devi Mahatmyam Keelaka Stotram
content:
  english: asya shri kilaka stotra maha mantrasya | shiva rishih | anushtup chandah | mahasarasvati devata
    | mantrodita devyo bijam | navarno mantrashakti|shri sapta shati mantra statvam sri jagadamba prityarthe
    saptashati pathangatvaena jape viniyogah | om namashcandikayai markandeya uvaca om vishuddha jnanadehaya
    trivedi divyacakshushe | shreyah prapti nimittaya namah somartha dharine || || sarvameta dvijaniyanmantranapi
    kilakam | so'pi kshemamavapnoti satatam japya tatparah || || siddhyantuccatanadini karmani sakalanyapi
    | etena stuvatam devim stotravrindena bhaktitah || || na mantro naushadham tasya na kinci dapi vidhyate
    | vina japyam na siddhyettu sarva muccatanadikam || || samagranyapi setsyanti lokashajnka mimam harah
    | kritva nimantrayamasa sarva meva midam shubham || || stotramvai candikayastu tacca guhyam cakara
    sah | samapnoti sapunyena tam yathavannimantranam || || sopi'kshema mavapnoti sarva meva na samshayah
    | krishnayam va caturdashyam ashtamyam va samahitah|| || dadati pratigrihnati nanya thaisha prasidati
    | ittham rupena kilena mahadevena kilitam| || || yo nishkilam vidhayainam candim japati nitya shah
    | sa siddhah sa ganah so'tha gandharvo jayate dhruvam || || na caiva patavam tasya bhayam kvapi na
    jayate | napa mrityu vasham yati mriteca mokshamapnuyat|| || jnatvaprarabhya kurvita hyakurvano vinashyati
    | tato jnatvaiva sampurnam idam prarabhyate budhaih || || saubhagyadica yatkincid drishyate lalanajane
    | tatsarvam tatprasadena tena japyamidam shubham || || shanaistu japyamane'smin stotre sampattiruccakaih|
    bhavatyeva samagrapi tatah prarabhyamevatat || || aishvaryam tatprasadena saubhagyarogyamevacah |
    shatruhanih paro mokshah stuyate sana kim janai || || candikam hridayenapi yah smaret satatam narah
    | hridyam kamamavapnoti hridi devi sada vaset || || agrato'mum mahadeva kritam kilakavaranam | nishkilanca
    tatha kritva pathitavyam samahitaih || || || iti shri bhagavati kilaka stotram samaptam ||
  devanagari: अस्य श्री कीलक स्तोत्र महा मन्त्रस्य । शिव ऋषिः । अनुष्टुप् छन्दः । महासरस्वती देवता । मन्त्रोदित
    देव्यो बीजम् । नवार्णो मन्त्रशक्ति।श्री सप्त शती मन्त्र स्तत्वं स्री जगदम्बा प्रीत्यर्थे सप्तशती पाठाङ्गत्वएन
    जपे विनियोगः । ॐ नमश्चण्डिकायै मार्कण्डेय उवाच ॐ विशुद्ध ज्ञानदेहाय त्रिवेदी दिव्यचक्षुषे । श्रेयः
    प्राप्ति निमित्ताय नमः सोमार्थ धारिणे ॥ ॥ सर्वमेत द्विजानीयान्मन्त्राणापि कीलकम् । सोऽपि क्षेममवाप्नोति
    सततं जाप्य तत्परः ॥ ॥ सिद्ध्यन्तुच्चाटनादीनि कर्माणि सकलान्यपि । एतेन स्तुवतां देवीं स्तोत्रवृन्देन
    भक्तितः ॥ ॥ न मन्त्रो नौषधं तस्य न किञ्चि दपि विध्यते । विना जाप्यं न सिद्ध्येत्तु सर्व मुच्चाटनादिकम्
    ॥ ॥ समग्राण्यपि सेत्स्यन्ति लोकशज्ञ्का मिमां हरः । कृत्वा निमन्त्रयामास सर्व मेव मिदं शुभम् ॥ ॥ स्तोत्रंवै
    चण्डिकायास्तु तच्च गुह्यं चकार सः । समाप्नोति सपुण्येन तां यथावन्निमन्त्रणां ॥ ॥ सोपिऽक्षेम मवाप्नोति
    सर्व मेव न संशयः । कृष्णायां वा चतुर्दश्यां अष्टम्यां वा समाहितः॥ ॥ ददाति प्रतिगृह्णाति नान्य थैषा
    प्रसीदति । इत्थं रूपेण कीलेन महादेवेन कीलितम्। ॥ ॥ यो निष्कीलां विधायैनां चण्डीं जपति नित्य शः । स
    सिद्धः स गणः सोऽथ गन्धर्वो जायते ध्रुवम् ॥ ॥ न चैवा पाटवं तस्य भयं क्वापि न जायते । नाप मृत्यु वशं
    याति मृतेच मोक्षमाप्नुयात्॥ ॥ ज्ञात्वाप्रारभ्य कुर्वीत ह्यकुर्वाणो विनश्यति । ततो ज्ञात्वैव सम्पूर्नं
    इदं प्रारभ्यते बुधैः ॥ ॥ सौभाग्यादिच यत्किञ्चिद् दृश्यते ललनाजने । तत्सर्वं तत्प्रसादेन तेन जप्यमिदं
    शुभं ॥ ॥ शनैस्तु जप्यमानेऽस्मिन् स्तोत्रे सम्पत्तिरुच्चकैः। भवत्येव समग्रापि ततः प्रारभ्यमेवतत् ॥
    ॥ ऐश्वर्यं तत्प्रसादेन सौभाग्यारोग्यमेवचः । शत्रुहानिः परो मोक्षः स्तूयते सान किं जनै ॥ ॥ चण्दिकां
    हृदयेनापि यः स्मरेत् सततं नरः । हृद्यं काममवाप्नोति हृदि देवी सदा वसेत् ॥ ॥ अग्रतोऽमुं महादेव कृतं
    कीलकवारणम् । निष्कीलञ्च तथा कृत्वा पठितव्यं समाहितैः ॥ ॥ ॥ इति श्री भगवती कीलक स्तोत्रं समाप्तम् ॥
