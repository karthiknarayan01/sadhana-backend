id: nimbadrilakshminrisimhastotram
category: stotram
name:
  english: nimbadrilakshminrisimhastotram
  devanagari: निम्बाद्रीलक्ष्मीनृसिंहस्तोत्रम्
content:
  english: shrinimbadrilakshminrisimhastotram ramaniyaramastanamandalasangatagandhasugandhita simhatano
    | karunarunadirghadgabja hare vijayi bhava nimbagirindrapate || 1|| hara pankajajanma surendra mahavibudhadhipasevita
    devamane | natabhaktamanastimiradyumane paripalaya nimbagirisha hare || 2|| matihinataya vanitavadanastanalobhakritaismaramohasharaih
    | vivasham nripashum narasimha vibho kuru mam tava padasarojavasham || 3|| vara nimbagirindra dariviharatsurasimha
    nrisimha dayajaladhe | nigamantanibodhita kirtiyutannarasimha vidherna payam kalaye || 4|| nakhadamshtrasushobhita
    kesarabhullalitoru suphullamukhabja hare | natara kshanadaksha vivashanmam paripalaya nimbagirindrapate
    || 5|| suravairivinashaka kopavashat kritagarjananirjita daityaganam | saphalikrita sarvajagatritayam
    narasimha mahamanasa kalaye || 6|| varadam natabhaktamanovashagam kamalapatimambudha nilatanum | dhanadam
    ca dayakritasimhatanum na kadapi dhunomi hrada nriharim || 7|| bhujashakhamabhishtaphalaprakaram dhanashankhasudarshanapushpadharam
    | kamalalatikavritakalpatarum narasimham mahamanasa kalaye || 8|| harim nimbashaileshamisham vina
    me gatirnaiva gamyam ca naivasti loke | tatastatpadambhojayugmam bhaje'ham shriyam narasimhah svayam
    me dadatu || 9|| sharadyekavaram hi nimbadrinatham shriyashlishtarupam guhamandirastham | sudhasevate
    yah samagrabdapunyam dadatyaiva nimbadrilakshminrisimhah || 10|| mahaparadhayuktena maya stotram kritam
    hare | kshamasva shabdikan doshan nimbashailadarimane || 11|| iti shrinimbadrilakshminrisimhastotram
    sampurnam |
  devanagari: श्रीनिम्बाद्रीलक्ष्मीनृसिंहस्तोत्रम् रमणीयरमास्तनमण्डलसङ्गतगन्धसुगन्धित सिंहतनो । करुणारुणदीर्घद्गब्ज
    हरे विजयी भव निम्बागिरीन्द्रपते ॥ १॥ हर पङ्कजजन्म सुरेन्द्र महाविबुधाधिपसेवित देवमणे । नतभक्तमनस्तिमिरद्युमणे
    परिपालय निम्बगिरीश हरे ॥ २॥ मतिहीनतया वनितावदनस्तनलोभकृतैस्मरमोहशरैः । विवशं नृपशुं नरसिंह विभो कुरु
    मां तव पादसरोजवशम् ॥ ३॥ वर निम्बगिरीन्द्र दरीविहरत्सुरसिंह नृसिंह दयाजलधे । निगमान्तनिबोधित कीर्तियुतान्नरसिंह
    विधेर्न पयं कलये ॥ ४॥ नखदंष्ट्रसुशोभित केसरभूल्ललितोरु सुफुल्लमुखाब्ज हरे । नतर क्षणदक्ष विवाशान्मां
    परिपालय निम्बगिरीन्द्रपते ॥ ५॥ सुरवैरिविनाशक कोपवशात् कृतगर्जननिर्जित दैत्यगणम् । सफलीकृत सर्वजगत्रितयं
    नरसिंह महामनसा कलये ॥ ६॥ वरदं नतभक्तमनोवशगं कमलापतिमम्बुध नीलतनुम् । धनदं च दयाकृतसिंहतनुं न कदापि
    धुनोमि ह्रदा नृहरिम् ॥ ७॥ भुजशाखमभीष्टफलप्रकरं धनशङ्खसुदर्शनपुष्पधरम् । कमलालतिकावृतकल्पतरुं नरसिंहं
    महामनसा कलये ॥ ८॥ हरिं निम्बशैलेशमीशं विना मे गतिर्नैव गम्यं च नैवास्ति लोके । ततस्तत्पदाम्भोजयुग्मं
    भजेऽहं श्रियं नारसिंहः स्वयं मे ददातु ॥ ९॥ शरद्येकवारं हि निम्बाद्रिनाथं श्रियाश्लिष्टरूपं गुहामन्दिरस्थम्
    । सुधासेवते यः समग्राब्दपुण्यं ददात्यैव निम्बाद्रिलक्ष्मीनृसिंहः ॥ १०॥ महापराधयुक्तेन मया स्तोत्रं
    कृतं हरे । क्षमस्व शाब्दिकान् दोषान् निम्बशैलदरीमणे ॥ ११॥ इति श्रीनिम्बाद्रीलक्ष्मीनृसिंहस्तोत्रं
    सम्पूर्णम् ।
