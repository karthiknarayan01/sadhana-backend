id: mantrarnamuktavali
category: mantra
name:
  english: mantrarnamuktavali
  devanagari: मन्त्रार्णमुक्तावली
content:
  english: omkarasanmanisamudganidheya nityanivimayaya nigamantavidam muninam | anandabodhaghanamangalavigrahaya
    nyagrodhamulanilayaya namahshivaya || 1|| nakshatranathaparipatalacarugatram mandasmitancitamukham
    svasukhalasaksham | cinmudrikakalita pustaka cinhapanim pashyamyapasmritiharam haramantarange || 2||
    mokshaya muktavishayairmunibhih puranaih shridakshinananamupasyamapasya mandah | moho mahanayamaho
    mushita hrishikairyaddevatantaramupasitumarabhante || 3|| bhavyo bhavassarahitadibhavapravahe yasmin
    pathi trayagamagamakhedakhinnah | dishtya mahapathika vishramadivyavriksham devam vatadrutatamangalamashrayante
    || 4|| gamyam giramanidamadimasambhavanamanteshu santatasamadhigatantarangaih | pare tamah paracitam
    parayogadrishtya divyam vatadrutatavasi mahah prapadye || 5|| vastamabhavukabharerajinam mriganamastamanathavadadho
    vadabhuruhasya | alambatamapi citabhasitangaragamantastameva sharanam marane'pi kurve || 6|| te te
    samasta jagatamabhilobhaniya bhava bhavantu hridi me ciramaviravih | tejastadeva paramashritavrikshamulamalambate
    hridayamadritayodhamudram || 7|| datte svayam saghanadatvamudarabhogam vagishvaratvamapi vanchitamokshalakshmim
    | yasya smritau sakridapasmritihari tejo jagarti hrittimiramandalacandabhanuh || 8|| kshipram kshinotu
    duritam mama dakshinasyam kshinaghatapasapacelimabhagadheyam | jyotiryadantaratamam vatavrikshamule
    kshemaya dikshitamudikshitamattapunyaih || 9|| navishtavatprakritikaryamiti bruvana yannamavarnagunagandhyapi
    paniniyah | vidyavisharadaganeshu ganeyarupastam dakshinananagurum gunayami citte || 10|| murcchakulasya
    muhureva bhavadhidavajvalavalisamavalidhasudhi kulasya | arterapakaranamashvasaniyamaste murtam mahah
    kimapi mulatate vatadroh || 11|| taptam tapah paramatitabhavantareshu dattam ca vittamabhigamya mahattamebhyah
    | aradhita gurujana yadadho vatadrorikshe mahah kimapi mangaladayi sakshat || 12|| ye kecidajanijada
    api caidamuka mukashca kevalamami yamanusmarantah | cudapadeshu vidushamapi vavaduka divyanti divyagurudeshikamenamide
    || 13|| mandakshamantharadrisha shivayasitankam mandakiniprishatamanjujatakalapam | cinmudrikakshagunapustakakundikadhyam
    shridakshinabhimukhamadigurum bhajamah || 14|| hyante vasanti munayo hitadeshanartha maunam vibharti
    muhuradimadeshiko'pi | pashyantyathapi paratatvamamuntu manye sakshatkrite nahi bhavatyupadeshakanksha
    || 15| medhavino'pi vasu me vasanadikam me kshetrani me kshitiriyam sakalaiva veti | me me girajasamajopamita
    vatadruvastavyavastuvivasha mama shocaniyah || 16|| dhamna kadapi hridayam sadayantu tasmin dhatastu
    va shatamakho dhanado gururva | aradhyamadigurumadarate vatadrumulalayam yadi na mudhamatirnamasyan
    || 17|| pratyakshamakalayata pratibham purastadastadhibhirmunibhirantarupasaniyam | chayamayantimiramacchatanuprakashairatanvatim
    vatatarostarutanumeyam || 18|| jnantani karyakaranani vivicya vijnairyajjnanayoganiratairyatibhirviceyam
    | jyotih param kimapi tadvatavrikshamule vikshadhvamakshijadimakshipamattadeham || 19|| pratyarcaniyakushala
    mama te shukadyashshakhasu ye'pi bahupadurupadapasya | cacamyamam kamapi vasitabodhamudramasadya satsadasi
    deshikatam bhajante || 20|| yatsambhavo yamavatamucitanvavaye yaccapi sadgurupadabjaparagaseva | yaccapyapasmritiharasya
    harasya vidya sarvam tadanyabhavasancitabhagadheyam || 21|| chando mameti bahupadapi sambhaveyam yo
    dakshinananagurorupasamshrayena | maunavalambamatilambijatakalapamasevitam shukamukhairupayami samyam
    || 22|| svarajyamastu divi va divishannishevyam yamya bhavantu niraye mama yatana va | kravyadabhavyamapi
    va vipine mrigatvam smerananam yadi manah smarati smararim || 23|| ha hanta pashyata sameta vatadrumule
    moham nudatkimapi vastu munindraguhyam | cakshuh shucam prashamayaccaranabhibhutapasmaramasti bahuvismayaniyashilam
    || 24|| onkaradhvanivasanamupanishaddyosallatavallarim hardavyomasamudyadindukalikamantarnishahardasham
    | nyagrodhadrumamulanityanilayamekamanakaliki
  devanagari: ॐकारसन्मणिसमुद्गनिधेय नित्यनीवीमयाय निगमान्तविदां मुनीनाम् । आनन्दबोधघनमङ्गलविग्रहाय न्यग्रोधमूलनिलयाय
    नमःशिवाय ॥ १॥ नक्षत्रनाथपरिपाटलचारुगात्रं मन्दस्मिताञ्चितमुखं स्वसुखालसाक्षम् । चिन्मुद्रिकाकलित पुस्तक
    चिन्हपाणिं पश्याम्यपस्मृतिहरं हरमन्तरङ्गे ॥ २॥ मोक्षाय मुक्तविषयैर्मुनिभिः पुराणैः श्रीदक्षिणाननमुपास्यमपास्य
    मन्दाः । मोहो महानयमहो मुषिता हृषीकैर्यद्देवतान्तरमुपासितुमारभन्ते ॥ ३॥ भव्यो भवस्सरहितादिभवप्रवाहे
    यस्मिन् पथि त्रयगमागमखेदखिन्नाः । दिष्ट्या महापथिक विश्रमदिव्यवृक्षं देवं वटद्रुतटमङ्गलमाश्रयन्ते
    ॥ ४॥ गम्यं गिरामनिदमादिमसम्भवानामन्तेषु सन्ततसमाधिगतान्तरङ्गैः । पारे तमः परचितं परयोगदृष्ट्या दिव्यं
    वटद्रुतटवासि महः प्रपद्ये ॥ ५॥ वस्तामभावुकभरेरजिनं मृगाणामास्तामनाथवदधो वदभूरुहस्य । आलम्बतामपि चिताभसिताङ्गरागमन्तस्तमेव
    शरणं मरणेऽपि कुर्वे ॥ ६॥ ते ते समस्त जगतामभिलोभनीया भावा भवन्तु हृदि मे चिरमाविरावीः । तेजस्तदेव परमाश्रितवृक्षमूलमालम्बते
    हृदयमादृतयोधमुद्रम् ॥ ७॥ दत्ते स्वयं सघनदत्वमुदारभोगं वागीश्वरत्वमपि वाञ्छितमोक्षलक्ष्मीम् । यस्य
    स्मृतौ सकृदपस्मृतिहारि तेजो जागर्ति हृत्तिमिरमण्डलचण्डभानुः ॥ ८॥ क्षिप्रं क्षिणोतु दुरितं मम दक्षिणास्यं
    क्षीणाघतापसपचेलिमभागधेयम् । ज्योतिर्यदान्तरतमं वटवृक्षमूले क्षेमाय दीक्षितमुदीक्षितमात्तपुण्यैः ॥
    ९॥ णाविष्टवत्प्रकृतिकार्यमिति ब्रुवाणा यन्नामवर्णगुणगन्ध्यपि पाणिनीयाः । विद्याविशारदगणेषु गणेयरूपास्तं
    दक्षिणाननगुरुं गुणयामि चित्ते ॥ १०॥ मूर्च्छाकुलस्य मुहुरेव भवाधिदावज्वालावलीसमवलीढसुधी कुलस्य । आर्तेरपाकरणमाश्वसनीयमास्ते
    मूर्तं महः किमपि मूलतटे वटद्रोः ॥ ११॥ तप्तं तपः परमतीतभवान्तरेषु दत्तं च वित्तमभिगम्य महत्तमेभ्यः
    । आराधिता गुरुजना यदधो वटद्रोरीक्षे महः किमपि मङ्गलदायि साक्षात् ॥ १२॥ ये केचिदाजनिजडा अपि चैडमूका
    मूकाश्च केवलममी यमनुस्मरन्तः । चूडापदेषु विदुषामपि वावदूका दीव्यन्ति दिव्यगुरुदेशिकमेनमीडे ॥ १३॥ मन्दाक्षमन्थरदृशा
    शिवयासिताङ्कं मन्दाकिनीपृषतमञ्जुजटाकलापम् । चिन्मुद्रिकाक्षगुणपुस्तककुण्डिकाढ्यं श्रीदक्षिणाभिमुखमादिगुरुं
    भजामः ॥ १४॥ ह्यन्ते वसन्ति मुनयो हितदेशनार्था मौनं विभर्ति मुहुरादिमदेशिकोऽपि । पश्यन्त्यथापि परतत्वममुन्तु
    मन्ये साक्षात्कृते नहि भवत्युपदेशकाङ्क्षा ॥ १५। मेधाविनोऽपि वसु मे वसनादिकं मे क्षेत्राणि मे क्षितिरियं
    सकलैव वेति । मे मे गिराजसमजोपमिता वटद्रुवास्तव्यवस्तुविवशा मम शोचनीयाः ॥ १६॥ धाम्ना कदापि हृदयं सदयन्तु
    तस्मिन् धातास्तु वा शतमखो धनदो गुरुर्वा । आराध्यमादिगुरुमादरते वटद्रुमूलालयं यदि न मूढमतिर्नमस्यन्
    ॥ १७॥ प्रत्यक्षमाकलयत प्रतिभां पुरस्तादस्ताधिभिर्मुनिभिरन्तरुपासनीयाम् । छायामयन्तिमिरमच्छतनुप्रकाशैरातन्वतीं
    वटतरोस्तरुतानुमेयाम् ॥ १८॥ ज्ञान्तानि कार्यकरणानि विविच्य विज्ञैर्यज्ज्ञानयोगनिरतैर्यतिभिर्विचेयम्
    । ज्योतिः परं किमपि तद्वटवृक्षमूले वीक्षध्वमक्षिजडिमक्षिपमात्तदेहम् ॥ १९॥ प्रत्यर्चनीयकुशला मम ते
    शुकाद्याश्शाखासु येऽपि बहुपादुरुपादपस्य । चाचंयमं कमपि वासितबोधमुद्रमासाद्य सत्सदसि देशिकतां भजन्ते
    ॥ २०॥ यत्सम्भवो यमवतामुचितान्ववाये यच्चापि सद्गुरुपदाब्जपरागसेवा । यच्चाप्यपस्मृतिहरस्य हरस्य विद्या
    सर्वं तदन्यभवसञ्चितभागधेयम् ॥ २१॥ छन्दो ममेति बहुपादपि सम्भवेयं यो दक्षिणाननगुरोरुपसंश्रयेण । मौनावलम्बमतिलम्बिजटाकलापमासेवितं
    शुकमुखैरुपयामि साम्यम् ॥ २२॥ स्वाराज्यमस्तु दिवि वा दिविषन्निषेव्यं याम्या भवन्तु निरये मम यातना वा
    । क्रव्यादभव्यमपि वा विपिने मृगत्वं स्मेराननं यदि मनः स्मरति स्मरारिम् ॥ २३॥ हा हान्त पश्यत समेत वटद्रुमूले
    मोहं नुदत्किमपि वस्तु मुनीन्द्रगुह्यम् । चक्षुः शुचं प्रशमयच्चरणाभिभूतापस्मारमस्ति बहुविस्मयनीयशीलम्
    ॥ २४॥ ओङ्कारध्वनिवासनामुपनिषद्द्योसल्लतावल्लरीं हार्दव्योमसमुद्यदिन्दुकलिकामन्तर्निशाहर्दशाम् । न्यग्रोधद्रुममूलनित्यनिलयामेकामनाकालिकी
