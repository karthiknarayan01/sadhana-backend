id: durgambastotramshridharasvami
category: stotram
name:
  english: durgambastotramshridharasvami
  devanagari: दुर्गाम्बास्तोत्रम्श्रीधरस्वामी
content:
  english: shridurgambastotram jnanamatravasheshaya nishpaprapanca nirankusha | cidanandaghanatyaccha
    durgambam tam upasmahe || 1|| mantranam matrika devi jnananam jnanarupini | jnananam cinmayatita shunyanam
    shunyasakshini || 2|| yasyah parataram nasti saisha durga prakirtita | durgatsantrayate yasmat devi
    durgeti kathyate || 3|| prapadye sharanam devi duracaravidhatinim | namami bhavabhito'ham samsararnavatarinim
    || 4|| iti shrisamartharamadasanugrahita shriramapadapankajabhringayamana shrimatparamahamsaparivrajakacaryavarabhagavatashrishridharasvamina
    viracitam shridurgambastotram sampurnam ||
  devanagari: श्रीदुर्गाम्बास्तोत्रम् ज्ञानमात्रावशेषाया निष्पप्रपञ्चा निरङ्कुशा । चिदानन्दघनात्यच्छा
    दुर्गाम्बां तां उपास्महे ॥ १॥ मन्त्राणां मातृका देवि ज्ञानानां ज्ञानरूपिणी । ज्ञानानां चिन्मयातीता
    शून्यानां शून्यसाक्षिणी ॥ २॥ यस्याः परतरं नास्ति सैषा दुर्गा प्रकीर्तिता । दुर्गात्सन्त्रायते यस्मात्
    देवी दुर्गेति कथ्यते ॥ ३॥ प्रपद्ये शरणं देवि दुराचारविधातिनीम् । नमामि भवभीतोऽहं संसारार्णवतारिणीम्
    ॥ ४॥ इति श्रीसमर्थरामदासानुग्रहित श्रीरामपदपङ्कजभृङ्गायमान श्रीमत्परमहंसपरिव्राजकाचार्यवरभगवताश्रीश्रीधरस्वामिना
    विरचितं श्रीदुर्गाम्बास्तोत्रं सम्पूर्णम् ॥
