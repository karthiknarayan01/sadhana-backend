id: lalitha-pancha-ratnam
category: stotram
name:
  english: Lalitha Pancha Ratnam
content:
  english: pratah smarami lalita vadanaravindam bimbadharam prithula mauktika shobhinasam | akarnadirghanayanam
    manikundaladhyam mandasmitam mrigamadojjvala phaladesham || || pratarbhajami lalita bhujakalpavallim
    raktanguliya lasadanguli pallavadhyam | manikya hemavalayangada shobhamanam pundrekshucapa kusumeshu
    srinirdadhanam || || pratarnamami lalita caranaravindam bhakteshta dananiratam bhavasindhupotam |
    padmasanadi suranayaka pujaniyam padmankushadhvaja sudarshana lanchanadhyam || || pratah stuve parashivam
    lalitam bhavanim trayyantavedya vibhavam karunanavadyam | vishvasya srishtavilaya sthitihetubhutam
    vidyeshvarim nigamavanmamanasatiduram || || pratarvadami lalite tava punyanama kameshvariti kamaleti
    maheshvariti | shrishambhaviti jagatam janani pareti vagdevateti vacasa tripureshvariti || || yah
    shlokapancakamidam lalitambikayah saubhagyadam sulalitam pathati prabhate | tasmai dadati lalita jhatiti
    prasanna vidyam shriyam vimalasaukhyamanantakirtim ||
  devanagari: प्रातः स्मरामि ललिता वदनारविन्दं बिम्बाधरं पृथुल मौक्तिक शोभिनासम् । आकर्णदीर्घनयनं मणिकुण्डलाढ्यं
    मन्दस्मितं मृगमदोज्ज्वल फालदेशम् ॥ ॥ प्रातर्भजामि ललिता भुजकल्पवल्लीं रक्ताङ्गुलीय लसदङ्गुलि पल्लवाढ्याम्
    । माणिक्य हेमवलयाङ्गद शोभमानां पुण्ड्रेक्षुचाप कुसुमेषु सृणीर्दधानाम् ॥ ॥ प्रातर्नमामि ललिता चरणारविन्दं
    भक्तेष्ट दाननिरतं भवसिन्धुपोतम् । पद्मासनादि सुरनायक पूजनीयं पद्माङ्कुशध्वज सुदर्शन लाञ्छनाढ्यम् ॥
    ॥ प्रातः स्तुवे परशिवां ललितां भवानीं त्रय्यन्तवेद्य विभवां करुणानवद्याम् । विश्वस्य सृष्टविलय स्थितिहेतुभूतां
    विद्येश्वरीं निगमवाङ्ममनसातिदूराम् ॥ ॥ प्रातर्वदामि ललिते तव पुण्यनाम कामेश्वरीति कमलेति महेश्वरीति
    । श्रीशाम्भवीति जगतां जननी परेति वाग्देवतेति वचसा त्रिपुरेश्वरीति ॥ ॥ यः श्लोकपञ्चकमिदं ललिताम्बिकायाः
    सौभाग्यदं सुललितं पठति प्रभाते । तस्मै ददाति ललिता झटिति प्रसन्ना विद्यां श्रियं विमलसौख्यमनन्तकीर्तिम्
    ॥
