id: humanyukritammaheshvarastotram
category: stotram
name:
  english: humanyukritammaheshvarastotram
  devanagari: हुमन्युकृतंमहेश्वरस्तोत्रं
content:
  english: kurangasangardhadharam drigancalasphulingaleshairmadanopyanangitah | sarangamatangaharam hara
    tvam patangasamstham pranamamyasangam || 43|| shikhisakhasukhabhunidana shambho makhamukhashiksha
    surakshadikshitanga | varagangajatashobhitottamanga dhritarudraksha mahokshavaha pahi || 44|| matangatungocamakrittivasah
    bhujangabhasmangajanantaranga | tvallingasange vihitantarange harau rathangaprada deva pahi || 45||
    dagdhandhaka tripurasudana kalakala vyalendranilagaladhriggalahalahala | shulanalaniladharavyaya vyomakesha
    koshatigashitabhavaikasamuha pahi || 46|| jatanata tatinivatorumulasthitakayamritalampataishca devaih
    | khapata srutabhutaganaughasanghaih natacuda kapatam vihaya pahi || 47|| || iti shivarahasyantargate
    shivakhye humanyukritam maheshvarastotram sampurnam ||
  devanagari: कुरङ्गसङ्गार्धधरं दृगञ्चलस्फुलिङ्गलेशैर्मदनोप्यनङ्गितः । सारङ्गमातङ्गहरं हर त्वां पतङ्गसंस्थं
    प्रणमाम्यसङ्गम् ॥ ४३॥ शिखिसखसुखभूनिदान शम्भो मखमुखशिक्ष सुरक्षदीक्षिताङ्ग । वरगङ्गाजटशोभितोत्तमाङ्ग
    धृतरुद्राक्ष महोक्षवाह पाहि ॥ ४४॥ मातङ्गतुङ्गोचमकृत्तिवासः भुजङ्गभस्माङ्गजनान्तरङ्ग । त्वल्लिङ्गसङ्गे
    विहितान्तरङ्गे हरौ रथाङ्गप्रद देव पाहि ॥ ४५॥ दग्धान्धक त्रिपुरसूदन कालकाल व्यालेन्द्रनीलगलधृग्गलहालहाल
    । शूलानलानिलधराव्यय व्योमकेश कोशातिगाशितभवैकसमूह पाहि ॥ ४६॥ जटनट तटिनीवटोरुमूलस्थितकायामृतलम्पटैश्च
    देवैः । खपट स्रुतभूतगणौघसङ्घैः नटचूड कपटं विहाय पाहि ॥ ४७॥ ॥ इति शिवरहस्यान्तर्गते शिवाख्ये हुमन्युकृतं
    महेश्वरस्तोत्रं सम्पूर्णम् ॥
