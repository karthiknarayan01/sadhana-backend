id: achyutashtakam
category: stotram
name:
  english: Achyutashtakam
  devanagari: अच्युताष्टकम्
content:
  english: damodaram vasudevam harim shridharam madhavam gopikavallabham janakinayakam ramacandram bhaje
    acyutam keshavam satyabhamadhavam madhavam shridharam radhikaradhitam indira mandiram cetasa sundaram
    devakinandanam nandanam sandadhe vishnave jishnave shankhine cakrine vallabhaya'rcitayatmane vidhvamsine
    vamshine te namah krishna govinda he rama narayana shripate vasudevarjita acyutananta he madhavadhokshaja
    rakshasakshobhitah sitaya shobhito lakshmanenanvito vanaraih sevito 'gastsampujito raghavah patu mam
    dhenukarishtako'nishtakrid dveshinam keshiha kamsahrid vamshikavadakah gopalakah patu mam sarvada
    vidyudadyotavan prasphuradvasasam pravridambhodavat prollasadvigraham vanyaya malaya shobhitorasthalam
    lohitanghridvayam varijaksham bhaje kuncitaih kuntalairbhrajimanananam ratnamaulim lasat kundalam
    gandayoh manjulam shyamalam tam bhaje acyutasyashtakam yah pathedishtadam prematah pratyaham purushah
    saspriham vrittatah sundaram vedyavishvambaram tasya vashyo harirjayate satvaram ||iti shrimatparamahamsaparivrajakacaryasya
    shri shishyasya shrimacchankarabhagavatah kritau shri acyutashtakam sampurnam||
  devanagari: दामोदरं वासुदेवं हरिम् श्रीधरं माधवं गोपिकावल्लभं जानकीनायकं रामचन्द्रं भजे अच्युतं केशवं
    सत्यभामाधवं माधवं श्रीधरं राधिकाराधितम् इन्दिरा मन्दिरं चेतसा सुन्दरं देवकीनन्दनं नन्दनं सन्दधे विष्णवे
    जिष्णवे शङ्खिने चक्रिणे वल्लभायाऽर्चितायात्मने विध्वंसिने वंशिने ते नमः कृष्ण गोविन्द हे राम नारायण
    श्रीपते वासुदेवार्जित अच्युतानन्त हे माधवाधोक्षज राक्षसक्षोभितः सीतया शोभितो लक्ष्मणेनान्वितो वानरैः
    सेवितो ऽगस्त्सम्पूजितो राघवः पातु माम् धेनुकारिष्टकोऽनिष्टकृद् द्वेषिणां केशिहा कंसहृद् वंशिकावादकः
    गोपालकः पातु मां सर्वदा विद्युदाद्योतवान् प्रस्फुरद्वाससं प्रावृडम्भोदवत् प्रोल्लसद्विग्रहम् वन्यया
    मालया शोभितोरस्थलं लोहिताङ्घ्रिद्वयं वारिजाक्षं भजे कुञ्चितैः कुन्तलैर्भ्राजिमानाननं रत्नमौलिं लसत्
    कुण्डलं गण्डयोः मञ्जुलं श्यामलं तं भजे अच्युतस्याष्टकं यः पठेदिष्टदं प्रेमतः प्रत्यहं पूरुषः सस्पृहम्
    वृत्ततः सुन्दरं वेद्यविश्वम्बरं तस्य वश्यो हरिर्जायते सत्वरम् ॥इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य
    श्री शिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्री अच्युताष्टकं सम्पूर्णम्॥
