id: pashupati-ashtakam
category: stotram
name:
  english: Pashupati Ashtakam
content:
  english: pashupatindupatim dharanipatim bhujagalokapatim ca satipatim | pranatabhaktajanartiharam param
    bhajata re manuja girijapatim || || na janako janani na ca sodaro na tanayo na ca bhuribalam kulam
    | avati ko'pi na kalavasham gatam bhajata re manuja girijapatim || || murajadindimavadyavilakshanam
    madhurapancamanadavisharadam | pramathabhutaganairapi sevitam bhajata re manuja girijapatim || ||
    sharanadam sukhadam sharananvitam shiva shiveti shiveti natam nrinam | abhayadam karunavarunalayam
    bhajata re manuja girijapatim || || narashiroracitam manikundalam bhujagaharamudam vrishabhadhvajam
    | citirajodhavalikritavigraham bhajata re manuja girijapatim || || makhavinashakaram shashishekharam
    satatamadhvarabhajiphalapradam | pralayadagdhasurasuramanavam bhajata re manuja girijapatim || ||
    madamapasya ciram hridi samsthitam maranajanmajaramayapiditam | jagadudikshya samipabhayakulam bhajata
    re manuja girijapatim || || harivirancisuradhipapujitam yamajaneshadhaneshanamaskritam | trinayanam
    bhuvanatritayadhipam bhajata re manuja girijapatim || || pashupateridamashtakamadbhutam viracitam
    prithivipatisurina | pathati samsha rinute manujah sada shivapurim vasate labhate mudam || || iti
    shripashupatyashtakam sampurnam ||
  devanagari: पशुपतीन्दुपतिं धरणीपतिं भुजगलोकपतिं च सतीपतिम् । प्रणतभक्तजनार्तिहरं परं भजत रे मनुजा गिरिजापतिम्
    ॥ ॥ न जनको जननी न च सोदरो न तनयो न च भूरिबलं कुलम् । अवति कोऽपि न कालवशं गतं भजत रे मनुजा गिरिजापतिम्
    ॥ ॥ मुरजडिण्डिमवाद्यविलक्षणं मधुरपञ्चमनादविशारदम् । प्रमथभूतगणैरपि सेवितं भजत रे मनुजा गिरिजापतिम्
    ॥ ॥ शरणदं सुखदं शरणान्वितं शिव शिवेति शिवेति नतं नृणाम् । अभयदं करुणावरुणालयं भजत रे मनुजा गिरिजापतिम्
    ॥ ॥ नरशिरोरचितं मणिकुण्डलं भुजगहारमुदं वृषभध्वजम् । चितिरजोधवलीकृतविग्रहं भजत रे मनुजा गिरिजापतिम्
    ॥ ॥ मखविनाशकरं शशिशेखरं सततमध्वरभाजिफलप्रदम् । प्रलयदग्धसुरासुरमानवं भजत रे मनुजा गिरिजापतिम् ॥ ॥
    मदमपास्य चिरं हृदि संस्थितं मरणजन्मजरामयपीडितम् । जगदुदीक्ष्य समीपभयाकुलं भजत रे मनुजा गिरिजापतिम्
    ॥ ॥ हरिविरञ्चिसुराधिपपूजितं यमजनेशधनेशनमस्कॄतम् । त्रिनयनं भुवनत्रितयाधिपं भजत रे मनुजा गिरिजापतिम्
    ॥ ॥ पशुपतेरिदमष्टकमद्भुतं विरचितं पृथिवीपतिसूरिणा । पठति संश ऋणुते मनुजः सदा शिवपुरीं वसते लभते मुदम्
    ॥ ॥ इति श्रीपशुपत्यष्टकं सम्पूर्णम् ॥
