id: kartaviryakavacakathanam
category: kavacha
name:
  english: kartaviryakavacakathanam
  devanagari: कार्तवीर्यकवचकथनम्
content:
  english: rinu viprendra vakshyami kavacam paramadbhutam | kartaviryasya yenasau prasannah karyasiddhikrit
    || 3|| sahasradityasankashe nanaratnasamujjvale | bhasvaddhvajapatakadhye turagayutabhushite || 4||
    mahasamvartakambhodhibhimaravaviravini | samuddhritamahachatravitanitaviyatpathe || 5|| maharathavare
    diptananayudhavirajite | susthitam vipulodaram sahasrabhujamanditam || 6|| vamairuddandakodandandadhanamaparaih
    sharan | kiritaharamukutakeyuravalayangadaih || 7|| mudrikodarabandhadyairmaunjinupurakadibhih | bhushitam
    vividhakalpairbhasvaraih sumahadhanaih || 8|| abaddhakavacam viram suprasannananambujam | dhanurjyasimhanadena
    kampayantam jagattrayam || 9|| sarvashatrukshayakaram sarvavyadhivinashanam | sarvasampatpradataram
    vijayashrinishevitam || 10|| sarvasaubhagyadam bhadram bhaktabhayavidhayinam | divyamalyanulepadhyam
    sarvalakshanasamyutam || 11|| rathanagashvapadatavrindamadhyagamishvaram | varadam cakravartinam sarvalokaikapalakam
    || 12|| samanoditasahasradivakarasamadyutim | mahayogabhavaishvaryakirtyakrantajagattrayam || 13||
    shrimaccakram hareramshadavatirnam mahitale | samyagatmadibhedena dhyatva rakshamudirayet || 14||
    asyangamurtayah panca pantu mam sphatikojjvalah | agnishasuravayavyakoneshu hridayadikah || 15|| sarvato'strajvaladrupa
    daracarmasipanayah | avyahatabalaishvaryashaktisamarthyavigrahah || 16|| kshemankarishaktiyutashcauravargavibhanjanah
    | pracim disham rakshatu me banabanasanayudhah || 17|| shrikarishaktisahito maribhayavinashakah |
    sharacapadharah shriman disham me patu dakshinam || 18|| mahavashyakariyuktah sarvashatruvinashakrit
    | maheshucapadhrikpatu mama pracetasim disham || 19|| yashahkarya samayukto daityasanghavinashanah
    | parirakshatu me samyagvidisham caitrabhanavim || 20|| vidyakarisamayuktah sumahadduhkhanashanah
    | patu me nairritim capapanirvidishamishvarah || 21|| dhanakarya samayukto mahaduritanashanah | ishvasaneshudhrikpatu
    vidisham mama vayavim || 22|| ayuhkarya yutah shrimanmahabhayavinashanah | capeshudhari shaivim me
    vidisham parirakshatu || 23|| vijayashriyutah sakshatsahasraradharo vibhuh | dishamurddhvamavatu me
    sarvadushtabhayankarah || 24|| shankhabhritsumahashaktisamyuto'pyadharam disham | parirakshatu me
    duhkhadhvantasambhedabhaskarah || 25|| mahayogasamayuktah sarvadikcakramandalah | mahayogishvarah
    patu sarvato mama padmabhrit || 26|| etastu murtayo rakta raktamalyamshukavritah | pradhanadevatarupah
    prithagrathavare sthitah || 27|| shaktayah padmahastashca nilendivarasannnibhah | shuklamalyanuvasanah
    suliptatilakojjvalah || 28|| tatparshadeshvarah svasvavahanayudhabhushanah | svasvadikshu sthitah
    pantu mamindradya mahabalah || 29|| etastasya samakhyatah sarvavaranadevatah | sarvato mam sada pantu
    sarvashaktisamanvitah || 30|| hridaye codare nabhau jathare guhyamandale | tejorupah sthitah pantu
    vanchasukhavanadrumah || 31|| disham canye mahavarna mantrarupa mahojjvalah | vyapakatvena pantvasmanapadatalamastakam
    || 32|| kartaviryah shirah patu lalatam haihayeshvarah | sumukho me mukham patu karnau vyaptajagattrayah
    || 33|| sukumaro hanum patu bhruyugam me dhanurdharah | nayanam pundarikaksho nasikam me gunakarah
    || 34|| adharoshthau sada patu brahmajneyo dvijankavih | sarvashastrakaladhari jihvam cibukamavyayah
    || 35|| dattatreyapriyah kantham skandhau rajakuleshvarah | bhujau dashasyadarpaghno hridayam me mahabalah
    || 36|| kukshim rakshatu me vidvan vakshah parapuranjayah | karau sarvarthadah patu karagrani jagatpriyah
    || 37|| revambulilasandripto jatharam parirakshatu | virashurastu me nabhim parshvau me sarvadushtaha
    || 38|| sahasrabhujabhritprishtam saptadvipadhipah katim | uru mahishmatinatho januni vallabho bhuvah
    || 39|| janghe viradhipah patu patu padau manojavah | patu sarvayudhadharah sarvangam sarvamarmasu
    || 40|| sarvadushtantakah patu dhatvashtakakalevaram | pranadidashajiveshansarvashishteshtado'vatu
    || 41|| vashikritendriyagramah patu sarvendriyani me | anuktamapi yatsthanam sharirantarbahishca yat
    || 42|| tatsarvam patu me sarvalokanatheshvareshvarah | vajratsarataram cedam shariram kavacavritam
    || 43|| badhashatavinirmuktamastu me bhayavarjitam | baddhvedam kavacam divyamabhedyam haihayeshituh
    || 44|| vicarami diva ratrau nirbhayenantaratmana | rajamarge mahadurge marge cauradisankule || 45||
    vishame vipine ghore davagnau girikandare | sangrame shastrasanghate simhavyaghranishevite || 46||
    gahvare sarvasankirne sandhyakale nripalaye | vivade vipulavarte samudre ca naditate || 47|| paripanthijanakirne
    deshe dasyuganavrite | sarvasvaharane prapte prapte pranasya sankate || 48|| nanarogajvaraveshe pishacapretayatane
    | mariduhsvapnapidasu klishte vishvasaghatake || 49|| sharire ca mahaduhkhe manase ca mahajvare |
    adhivyadhibhaye vighnajvalopadravake'pi ca || 50|| na bhavatu bhayam kincitkavacenavritasya me | aguntukamanakhilanasmadvasuvilumpakan
    || 51|| nivarayatu dordandasahasrena maharathah | svakaroddhritasahasrapashabaddhansudurjayan || 52||
    samruddhagatisamarthyankarotu kritaviryajah | srinisahasranirbhinnansahasrasharakhanditan || 53||
    rajacudamanih kshipram karotvasmadvirodhakan | khadgasahasradalitansahasramusalarditan || 54|| cauradidushtasattvaughankarotu
    kamalekshanah | svashankhanadasantrastansahasrarasahasrabhrit || 55|| avataro hareh sakshatpalayatvakhilam
    mama | kartavirya mahavirya sarvadushtavinashana || 56|| sarvatra sarvada dushtacaurannashaya nashaya
    | kim tvam svapishi dushtaghna kim tishtasi cirayasi || 57|| uttishtha pahi nah sarvabhayebhyah svasutaniva
    | ye caura vasuhartaro vidvisho ye ca himsakah || 58|| sadhubhitikara dushtashchadmaka ye durashayah
    | durhrido dushtabhupala dushtamatyashca papakah || 59|| ye ca karyaviloptoro ye khalah paripanthinah
    | sarvasvaharinam ye ca panca mayavino'pare || 60|| mahakleshakara mleccha dasyavo vrishalashca ye
    | ye'gnida garadataro vancakah shastrapanayah || 61|| ye papa dushtakarmano duhkhada dushtabuddhayah
    | vyajakah kupathasakta ye ca nanabhayapradah || 62|| chidranvesharata nityam ye'smanbadhitumudyatah
    | te sarve kartaviryasya mahashankharavahatah || 63|| sahasa vilayam yantu duradiva vimohitah | ye
    danava mahadaitya ye yaksha ye ca rakshasah || 64|| pishaca ye mahasattva ye bhutabrahmarakshasah
    | apasmaragraha ye ca ye grahah pishitashanah || 65|| mahalohitabhoktaro vetala ye ca guhyakah | gandharvapsarasah
    siddha ye ca devadiyonayah || 66|| dakinyo drunasah pretah kshetrapala vinayakah | mahavyaghramahamegha
    mahaturagarupakah || 67|| mahagaja mahasimha mahamahishayonayah | rikshavarahashunakavanarolukamurtayah
    || 68|| mahoshtrakharamarjarasarpagovrishamastakah | nanarupa mahasattva nanakleshasahasradah || 69||
    nanarogakarah kshudra mahavirya mahabalah | vatikah paittika ghora shlaishmikah sannipatikah || 70||
    maheshvara vaishnavashca vairincyashca mahagrahah | skanda vainayakah krura ye ca pramathaguhyakah
    || 71|| mahashatrugraha raudra mahamarimasurikah | aikahika vdyahikashca tryahikashca mahajvarah ||
    72|| caturthikah pakshikashca masyah shanmasikashca ye | samvatsara durnivarya jvarah paramadarunah
    || 73|| svapnika ye mahotpata ye ca duhsvapnika grahah | kushmanda jrimbhika bhauma dronah sannidhyavancakah
    || 74|| bhramikah pranahartaro ye ca balagrahadayah | manobuddhindriyaharah sphotakashca mahagrahah
    || 75|| mahashana balibhujo mahakunapabhojanah | divacara ratricara ye ca sandhyasu darunah || 76||
    pramatta va'pramatta vai ye mam badhitumudyatah | te sarve karttaviryasya dhanurmuktasharahatah ||
    77|| sahasradha pranashyantu bhagnasattvabalodyamah | ye sarpa ye mahanaga mahagiribileshayah || 78||
    kalavyala mahadamshtra mahajagarasamjnakah | anantashulikadyashca damshtravishamahabhayah || 79||
    anekashatashirshashca khandapucchashca darunah | mahavishajalaukashca vrishcika ruktapucchakah ||
    80|| ashivishah kalakuta mahahalahalahvayah | jalasarpa jalavyala jalagrahashca kacchapah || 81||
    matsyaka vishapucchashca ye canye jalavasinah | jalajah sthalajashcaiva kritrimashca mahavishah ||
    82|| guptarupa guptavisha mushika grihagodhikah | nanavishashca ye ghora mahopavishasamjnakah || 83||
    ye'smanbadhitumicchanti shariraprananashakah | te sarve kartaviryasya khadgasahasradaritah || 84||
    duradeva vinashyantu pranashtendriyasahasah | manushyah pashavo tvrikshavanara vanagocarah || 85||
    simhavyaghravarahashca mahisha ye mahamrigah | gajasturanga gavaya rasabhah sharabha vrikah || 86||
    shunaka dvipinah shubhra marjara bilalolupah | sha
  devanagari: ृणु विप्रेन्द्र वक्ष्यामि कवचं परमाद्भुतम् । कार्तवीर्यस्य येनासौ प्रसन्नः कार्यसिद्धिकृत्
    ॥ ३॥ सहस्रादित्यसङ्काशे नानारत्नसमुज्ज्वले । भास्वद्ध्वजपताकाढ्ये तुरगायुतभूषिते ॥ ४॥ महासंवर्तकाम्भोधिभीमरावविराविणि
    । समुद्धृतमहाछत्रवितानितवियत्पथे ॥ ५॥ महारथवरे दीप्तनानायुधविराजिते । सुस्थितं विपुलोदारं सहस्रभुजमण्डितम्
    ॥ ६॥ वामैरुद्दण्डकोदण्डान्दधानमपरैः शरान् । किरीटहारमुकुटकेयूरवलयाङ्गदैः ॥ ७॥ मुद्रिकोदरबन्धाद्यैर्मौञ्जीनूपुरकादिभिः
    । भूषितं विविधाकल्पैर्भास्वरैः सुमहाधनैः ॥ ८॥ आबद्धकवचं वीरं सुप्रसन्नाननाम्बुजम् । धनुर्ज्यासिंहनादेन
    कम्पयन्तं जगत्त्रयम् ॥ ९॥ सर्वशत्रुक्षयकरं सर्वव्याधिविनाशनम् । सर्वसम्पत्प्रदातारं विजयश्रीनिषेवितम्
    ॥ १०॥ सर्वसौभाग्यदं भद्रं भक्ताभयविधायिनम् । दिव्यमाल्यानुलेपाढ्यं सर्वलक्षणसंयुतम् ॥ ११॥ रथनागाश्वपादातवृन्दमध्यगमीश्वरम्
    । वरदं चक्रवर्तीनं सर्वलोकैकपालकम् ॥ १२॥ समानोदितसाहस्रदिवाकरसमद्युतिम् । महायोगभवैश्वर्यकीर्त्याक्रान्तजगत्त्रयम्
    ॥ १३॥ श्रीमच्चक्रं हरेरंशादवतीर्णं महीतले । सम्यगात्मादिभेदेन ध्यात्वा रक्षामुदीरयेत् ॥ १४॥ अस्याङ्गमूर्तयः
    पञ्च पान्तु मां स्फटिकोज्ज्वलाः । अग्नीशासुरवायव्यकोणेषु हृदयादिकाः ॥ १५॥ सर्वतोऽस्त्रज्वलद्रूपा दरचर्मासिपाणयः
    । अव्याहतबलैश्वर्यशक्तिसामर्थ्यविग्रहाः ॥ १६॥ क्षेमङ्करीशक्तियुतश्चौरवर्गविभञ्जनः । प्राचीं दिशं रक्षतु
    मे बाणबाणासनायुधः ॥ १७॥ श्रीकरीशक्तिसहितो मारीभयविनाशकः । शरचापधरः श्रीमान् दिशं मे पातु दक्षिणाम्
    ॥ १८॥ महावश्यकरीयुक्तः सर्वशत्रुविनाशकृत् । महेषुचापधृक्पातु मम प्राचेतसीं दिशम् ॥ १९॥ यशःकर्या समायुक्तो
    दैत्यसङ्घविनाशनः । परिरक्षतु मे सम्यग्विदिशं चैत्रभानवीम् ॥ २०॥ विद्याकरीसमायुक्तः सुमहद्दुःखनाशनः
    । पातु मे नैरृतीं चापपाणिर्विदिशमीश्वरः ॥ २१॥ धनकर्या समायुक्तो महादुरितनाशनः । इष्वासनेषुधृक्पातु
    विदिशं मम वायवीम् ॥ २२॥ आयुःकर्या युतः श्रीमान्महाभयविनाशनः । चापेषुधारी शैवीं मे विदिशं परिरक्षतु
    ॥ २३॥ विजयश्रीयुतः साक्षात्सहस्रारधरो विभुः । दिशमूर्द्ध्वामवतु मे सर्वदुष्टभयङ्करः ॥ २४॥ शङ्खभृत्सुमहाशक्तिसंयुतोऽप्यधरां
    दिशम् । परिरक्षतु मे दुःखध्वान्तसम्भेदभास्करः ॥ २५॥ महायोगसमायुक्तः सर्वदिक्चक्रमण्डलः । महायोगीश्वरः
    पातु सर्वतो मम पद्मभृत् ॥ २६॥ एतास्तु मूर्तयो रक्ता रक्तमाल्यांशुकावृताः । प्रधानदेवतारूपाः पृथग्रथवरे
    स्थिताः ॥ २७॥ शक्तयः पद्महस्ताश्च नीलेन्दीवरसन्न्निभाः । शुक्लमाल्यानुवसनाः सुलिप्ततिलकोज्ज्वलाः ॥
    २८॥ तत्पार्षदेश्वराः स्वस्ववाहनायुधभूषणाः । स्वस्वदिक्षु स्थिताः पान्तु मामिन्द्राद्या महाबलाः ॥ २९॥
    एतास्तस्य समाख्याताः सर्वावरणदेवताः । सर्वतो मां सदा पान्तु सर्वशक्तिसमन्विताः ॥ ३०॥ हृदये चोदरे नाभौ
    जठरे गुह्यमण्डले । तेजोरूपाः स्थिताः पान्तु वाञ्छासुखवनद्रुमाः ॥ ३१॥ दिशं चान्ये महावर्णा मन्त्ररूपा
    महोज्ज्वलाः । व्यापकत्वेन पान्त्वस्मानापादतलमस्तकम् ॥ ३२॥ कार्तवीर्यः शिरः पातु ललाटं हैहयेश्वरः ।
    सुमुखो मे मुखं पातु कर्णौ व्याप्तजगत्त्रयः ॥ ३३॥ सुकुमारो हनुं पातु भ्रूयुगं मे धनुर्धरः । नयनं पुण्डरीकाक्षो
    नासिकां मे गुणाकरः ॥ ३४॥ अधरोष्ठौ सदा पातु ब्रह्मज्ञेयो द्विजान्कविः । सर्वशास्त्रकलाधारी जिह्वां
    चिबुकमव्ययः ॥ ३५॥ दत्तात्रेयप्रियः कण्ठं स्कन्धौ राजकुलेश्वरः । भुजौ दशास्यदर्पघ्नो हृदयं मे महाबलः
    ॥ ३६॥ कुक्षिं रक्षतु मे विद्वान् वक्षः परपुरञ्जयः । करौ सर्वार्थदः पातु कराग्राणि जगत्प्रियः ॥ ३७॥
    रेवाम्बुलीलासन्दृप्तो जठरं परिरक्षतु । वीरशूरस्तु मे नाभिं पार्श्वौ मे सर्वदुष्टहा ॥ ३८॥ सहस्रभुजभृत्पृष्टं
    सप्तद्वीपाधिपः कटिम् । ऊरू माहिष्मतीनाथो जानुनी वल्लभो भुवः ॥ ३९॥ जङ्घे वीराधिपः पातु पातु पादौ मनोजवः
    । पातु सर्वायुधधरः सर्वाङ्गं सर्वमर्मसु ॥ ४०॥ सर्वदुष्टान्तकः पातु धात्वष्टककलेवरम् । प्राणादिदशजीवेशान्सर्वशिष्टेष्टदोऽवतु
    ॥ ४१॥ वशीकृतेन्द्रियग्रामः पातु सर्वेन्द्रियाणि मे । अनुक्तमपि यत्स्थानं शरीरान्तर्बहिश्च यत् ॥ ४२॥
    तत्सर्वं पातु मे सर्वलोकनाथेश्वरेश्वरः । वज्रात्सारतरं चेदं शरीरं कवचावृतम् ॥ ४३॥ बाधाशतविनिर्मुक्तमस्तु
    मे भयवर्जितम् । बद्ध्वेदं कवचं दिव्यमभेद्यं हैहयेशितुः ॥ ४४॥ विचरामि दिवा रात्रौ निर्भयेनान्तरात्मना
    । राजमार्गे महादुर्गे मार्गे चौरादिसङ्कुले ॥ ४५॥ विषमे विपिने घोरे दावाग्नौ गिरिकन्दरे । सङ्ग्रामे
    शस्त्रसङ्घाते सिंहव्याघ्रनिषेविते ॥ ४६॥ गह्वरे सर्वसङ्कीर्णे सन्ध्याकाले नृपालये । विवादे विपुलावर्ते
    समुद्रे च नदीतटे ॥ ४७॥ परिपन्थिजनाकीर्णे देशे दस्युगणावृते । सर्वस्वहरणे प्राप्ते प्राप्ते प्राणस्य
    सङ्कटे ॥ ४८॥ नानारोगज्वरावेशे पिशाचप्रेतयातने । मारीदुःस्वप्नपीडासु क्लिष्टे विश्वासघातके ॥ ४९॥ शारीरे
    च महादुःखे मानसे च महाज्वरे । आधिव्याधिभये विघ्नज्वालोपद्रवकेऽपि च ॥ ५०॥ न भवतु भयं किञ्चित्कवचेनावृतस्य
    मे । आगुन्तुकामानखिलानस्मद्वसुविलुम्पकान् ॥ ५१॥ निवारयतु दोर्दण्डसहस्रेण महारथः । स्वकरोद्धृतसाहस्रपाशबद्धान्सुदुर्जयान्
    ॥ ५२॥ संरुद्धगतिसामर्थ्यान्करोतु कृतवीर्यजः । सृणिसाहस्रनिर्भिन्नान्सहस्रशरखण्डितान् ॥ ५३॥ राजचूडामणिः
    क्षिप्रं करोत्वस्मद्विरोधकान् । खड्गसाहस्रदलितान्सहस्रमुसलार्दितान् ॥ ५४॥ चौरादिदुष्टसत्त्वौघान्करोतु
    कमलेक्षणः । स्वशङ्खनादसन्त्रस्तान्सहस्रारसहस्रभृत् ॥ ५५॥ अवतारो हरेः साक्षात्पालयत्वखिलं मम । कार्तवीर्य
    महावीर्य सर्वदुष्टविनाशन ॥ ५६॥ सर्वत्र सर्वदा दुष्टचौरान्नाशाय नाशय । किं त्वं स्वपिषि दुष्टघ्न किं
    तिष्टसि चिरायसि ॥ ५७॥ उत्तिष्ठ पाहि नः सर्वभयेभ्यः स्वसुतानिव । ये चौरा वसुहर्तारो विद्विषो ये च हिंसकाः
    ॥ ५८॥ साधुभीतिकरा दुष्टाश्छद्मका ये दुराशयाः । दुर्हृदो दुष्टभूपाला दुष्टामात्याश्च पापकाः ॥ ५९॥ ये
    च कार्यविलोप्तोरो ये खलाः परिपन्थिनः । सर्वस्वहारिणां ये च पञ्च मायाविनोऽपरे ॥ ६०॥ महाक्लेशकरा म्लेच्छा
    दस्यवो वृषलाश्च ये । येऽग्निदा गरदातारो वञ्चकाः शस्त्रपाणयः ॥ ६१॥ ये पापा दुष्टकर्माणो दुःखदा दुष्टबुद्धयः
    । व्याजकाः कुपथासक्ता ये च नानाभयप्रदाः ॥ ६२॥ छिद्रान्वेषरता नित्यं येऽस्मान्बाधितुमुद्यताः । ते सर्वे
    कार्तवीर्यस्य महाशङ्खरवाहताः ॥ ६३॥ सहसा विलयं यान्तु दूरादिव विमोहिताः । ये दानवा महादैत्या ये यक्षा
    ये च राक्षसाः ॥ ६४॥ पिशाचा ये महासत्त्वा ये भूतब्रह्मराक्षसाः । अपस्मारग्रहा ये च ये ग्रहाः पिशिताशनाः
    ॥ ६५॥ महालोहितभोक्तारो वेताला ये च गुह्यकाः । गन्धर्वाप्सरसः सिद्धा ये च देवादियोनयः ॥ ६६॥ डाकिन्यो
    द्रुणसाः प्रेताः क्षेत्रपाला विनायकाः । महाव्याघ्रमहामेघा महातुरगरूपकाः ॥ ६७॥ महागजा महासिंहा महामहिषयोनयः
    । ऋक्षवाराहशुनकवानरोलूकमूर्तयः ॥ ६८॥ महोष्ट्रखरमार्जारसर्पगोवृषमस्तकाः । नानारूपा महासत्त्वा नानाक्लेशसहस्रदाः
    ॥ ६९॥ नानारोगकराः क्षुद्रा महावीर्या महाबलाः । वातिकाः पैत्तिका घोरा श्लैष्मिकाः सान्निपातिकाः ॥ ७०॥
    माहेश्वरा वैष्णवाश्च वैरिञ्च्याश्च महाग्रहाः । स्कान्दा वैनायकाः क्रूरा ये च प्रमथगुह्यकाः ॥ ७१॥ महाशत्रुग्रहा
    रौद्रा महामारीमसूरिकाः । ऐकाहिका व्द्याहिकाश्च त्र्याहिकाश्च महाज्वराः ॥ ७२॥ चातुर्थिकाः पाक्षिकाश्च
    मास्याः षाण्मासिकाश्च ये । सांवत्सरा दुर्निवार्या ज्वराः परमदारुणाः ॥ ७३॥ स्वाप्निका ये महोत्पाता
    ये च दुःस्वाप्निका ग्रहाः । कूष्माण्डा जृम्भिका भौमा द्रोणाः सान्निध्यवञ्चकाः ॥ ७४॥ भ्रमिकाः प्राणहर्तारो
    ये च बालग्रहादयः । मनोबुद्धीन्द्रियहराः स्फोटकाश्च महाग्रहाः ॥ ७५॥ महाशना बलिभुजो महाकुणपभोजनाः ।
    दिवाचरा रात्रिचरा ये च सन्ध्यासु दारुणाः ॥ ७६॥ प्रमत्ता वाऽप्रमत्ता वै ये मां बाधितुमुद्यताः । ते
    सर्वे कार्त्तवीर्यस्य धनुर्मुक्तशराहताः ॥ ७७॥ सहस्रधा प्रणश्यन्तु भग्नसत्त्वबलोद्यमाः । ये सर्पा ये
    महानागा महागिरिबिलेशयाः ॥ ७८॥ कालव्याला महादंष्ट्रा महाजगरसंज्ञकाः । अनन्तशूलिकाद्याश्च दंष्ट्राविषमहाभयाः
    ॥ ७९॥ अनेकशतशीर्षाश्च खण्डपुच्छाश्च दारुणाः । महाविषजलौकाश्च वृश्चिका रुक्तपुच्छकाः ॥ ८०॥ आशीविषाः
    कालकूटा महाहालाहलाह्वयाः । जलसर्पा जलव्याला जलग्राहाश्च कच्छपाः ॥ ८१॥ मत्स्यका विषपुच्छाश्च ये चान्ये
    जलवासिनः । जलजाः स्थलजाश्चैव कृत्रिमाश्च महाविषाः ॥ ८२॥ गुप्तरूपा गुप्तविषा मूषिका गृहगोधिकाः । नानाविषाश्च
    ये घोरा महोपविषसंज्ञकाः ॥ ८३॥ येऽस्मान्बाधितुमिच्छन्ति शरीरप्राणनाशकाः । ते सर्वे कार्तवीर्यस्य खड्गसाहस्रदारिताः
    ॥ ८४॥ दूरादेव विनश्यन्तु प्रणष्टेन्द्रियसाहसाः । मनुष्याः पशवो त्वृक्षवानरा वनगोचराः ॥ ८५॥ सिंहव्याघ्रवराहाश्च
    महिषा ये महामृगाः । गजास्तुरङ्गा गवया रासभाः शरभा वृकाः ॥ ८६॥ शुनका द्वीपिनः शुभ्रा मार्जारा बिललोलुपाः
    । श
