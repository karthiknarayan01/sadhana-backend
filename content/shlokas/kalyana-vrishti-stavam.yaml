id: kalyana-vrishti-stavam
category: stotram
name:
  english: Kalyana Vrishti Stavam
content:
  english: kalyanavrishtibhirivamritapuritabhi rlakshmisvayamvaranamangaladipikabhih | sevabhiramba tava
    padasarojamule nakari kim manasi bhagyavatam jananam || || etavadeva janani sprihaniyamaste tvadvandaneshu
    salilasthagite ca netre | sannidhyamudyadarunayutasodarasya tvadvigrahasya paraya sudhayaplutasya
    || || ishatvanamakalushah kati va na santi brahmadayah pratibhavam pralayabhibhutah | ekah sa eva
    janani sthirasiddhiraste yah padayostava sakritpranatim karoti || || labdhva sakrittripurasundari
    tavakinam karunyakandalitakantibharam kataksham | kandarpakotisubhagastvayi bhaktibhajah sammohayanti
    tarunirbhuvanatraye'pi || karameva tava nama grinanti veda matastrikonanilaye tripure trinetre | tvatsamsmritau
    yamabhatabhibhavam vihaya divyanti nandanavane saha lokapalaih || || hantuh puramadhigalam paripiyamanah
    krurah katham na bhavita garalasya vegah | nashvasanaya yadi mataridam tavartham dehasya shashvadamritaplutashitalasya
    || || sarvajnatam sadasi vakpatutam prasute devi tvadanghrisarasiruhayoh pranamah | kim ca sphuranmakutamujjvalamatapatram
    dve camare ca mahatim vasudham dadati || || kalpadrumairabhimatapratipadaneshu karunyavaridhibhiramba
    bhavatkatakshaih | alokaya tripurasundari mamanatham tvayyeva bhaktibharitam tvayi baddhatrishnam
    || || hantetareshvapi manamsi nidhaya canye bhaktim vahanti kila pamaradaivateshu | tvameva devi manasa
    samanusmarami tvameva naumi sharanam janani tvameva || || lakshyeshu satsvapi katakshanirikshanana
    malokaya tripurasundari mam kadacit | nunam maya tu sadrishah karunaikapatram jato janishyati jano
    na ca jayate va || || hrim hrimiti pratidinam japatam tavakhyam kim nama durlabhamiha tripuradhivase
    | malakiritamadavaranamananiya tansevate vasumati svayameva lakshmih || || sampatkarani sakalendriyanandanani
    samrajyadananiratani saroruhakshi | tvadvandanani duritaharanodyatani mameva mataranisham kalayantu
    nanyam || || kalpopasamhritishu kalpitatandavasya devasya khandaparashoh parabhairavasya | pashankushaikshavasharasanapushpabana
    sa sakshini vijayate tava murtireka || || lagnam sada bhavatu mataridam tavardham tejah param bahulakunkumapankashonam
    | bhasvatkiritamamritamshukalavatamsam madhye trikonanilayam paramamritardram || karameva tava nama
    tadeva rupam tvannama durlabhamiha tripure grinanti | tvattejasa parinatam viyadadibhutam saukhyam
    tanoti sarasiruhasambhavadeh || karatrayasamputena mahata mantrena sandipitam stotram yah prativasaram
    tava puro matarjapenmantravit | tasya kshonibhujo bhavanti vashaga lakshmishcirasthayini vani nirmalasuktibharabharita
    jagarti dirgham vayah || || iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya
    shrimacchankarabhagavatah kritau kalyanavrishti stavah |
  devanagari: कल्याणवृष्टिभिरिवामृतपूरिताभि र्लक्ष्मीस्वयंवरणमङ्गलदीपिकाभिः । सेवाभिरम्ब तव पादसरोजमूले
    नाकारि किं मनसि भाग्यवतां जनानाम् ॥ ॥ एतावदेव जननि स्पृहणीयमास्ते त्वद्वन्दनेषु सलिलस्थगिते च नेत्रे
    । सान्निध्यमुद्यदरुणायुतसोदरस्य त्वद्विग्रहस्य परया सुधयाप्लुतस्य ॥ ॥ ईशत्वनामकलुषाः कति वा न सन्ति
    ब्रह्मादयः प्रतिभवं प्रलयाभिभूताः । एकः स एव जननि स्थिरसिद्धिरास्ते यः पादयोस्तव सकृत्प्रणतिं करोति
    ॥ ॥ लब्ध्वा सकृत्त्रिपुरसुन्दरि तावकीनं कारुण्यकन्दलितकान्तिभरं कटाक्षम् । कन्दर्पकोटिसुभगास्त्वयि
    भक्तिभाजः सम्मोहयन्ति तरुणीर्भुवनत्रयेऽपि ॥ कारमेव तव नाम गृणन्ति वेदा मातस्त्रिकोणनिलये त्रिपुरे
    त्रिनेत्रे । त्वत्संस्मृतौ यमभटाभिभवं विहाय दीव्यन्ति नन्दनवने सह लोकपालैः ॥ ॥ हन्तुः पुरामधिगलं परिपीयमानः
    क्रूरः कथं न भविता गरलस्य वेगः । नाश्वासनाय यदि मातरिदं तवार्थं देहस्य शश्वदमृताप्लुतशीतलस्य ॥ ॥ सर्वज्ञतां
    सदसि वाक्पटुतां प्रसूते देवि त्वदङ्घ्रिसरसीरुहयोः प्रणामः । किं च स्फुरन्मकुटमुज्ज्वलमातपत्रं द्वे
    चामरे च महतीं वसुधां ददाति ॥ ॥ कल्पद्रुमैरभिमतप्रतिपादनेषु कारुण्यवारिधिभिरम्ब भवात्कटाक्षैः । आलोकय
    त्रिपुरसुन्दरि मामनाथं त्वय्येव भक्तिभरितं त्वयि बद्धतृष्णम् ॥ ॥ हन्तेतरेष्वपि मनांसि निधाय चान्ये
    भक्तिं वहन्ति किल पामरदैवतेषु । त्वामेव देवि मनसा समनुस्मरामि त्वामेव नौमि शरणं जननि त्वमेव ॥ ॥ लक्ष्येषु
    सत्स्वपि कटाक्षनिरीक्षणाना मालोकय त्रिपुरसुन्दरि मां कदाचित् । नूनं मया तु सदृशः करुणैकपात्रं जातो
    जनिष्यति जनो न च जायते वा ॥ ॥ ह्रीं ह्रीमिति प्रतिदिनं जपतां तवाख्यां किं नाम दुर्लभमिह त्रिपुराधिवासे
    । मालाकिरीटमदवारणमाननीया तान्सेवते वसुमती स्वयमेव लक्ष्मीः ॥ ॥ सम्पत्कराणि सकलेन्द्रियनन्दनानि साम्राज्यदाननिरतानि
    सरोरुहाक्षि । त्वद्वन्दनानि दुरिताहरणोद्यतानि मामेव मातरनिशं कलयन्तु नान्यम् ॥ ॥ कल्पोपसंहृतिषु कल्पितताण्डवस्य
    देवस्य खण्डपरशोः परभैरवस्य । पाशाङ्कुशैक्षवशरासनपुष्पबाणा सा साक्षिणी विजयते तव मूर्तिरेका ॥ ॥ लग्नं
    सदा भवतु मातरिदं तवार्धं तेजः परं बहुलकुङ्कुमपङ्कशोणम् । भास्वत्किरीटममृतांशुकलावतंसं मध्ये त्रिकोणनिलयं
    परमामृतार्द्रम् ॥ कारमेव तव नाम तदेव रूपं त्वन्नाम दुर्लभमिह त्रिपुरे गृणन्ति । त्वत्तेजसा परिणतं
    वियदादिभूतं सौख्यं तनोति सरसीरुहसम्भवादेः ॥ कारत्रयसम्पुटेन महता मन्त्रेण सन्दीपितं स्तोत्रं यः प्रतिवासरं
    तव पुरो मातर्जपेन्मन्त्रवित् । तस्य क्षोणिभुजो भवन्ति वशगा लक्ष्मीश्चिरस्थायिनी वाणी निर्मलसूक्तिभारभारिता
    जागर्ति दीर्घं वयः ॥ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः
    कृतौ कल्याणवृष्टि स्तवः ।
