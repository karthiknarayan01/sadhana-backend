    हि दे॒वाना॑मद्ध्व॒र्यू आस्ता भ्या॒मित्या॑ह॒ यत्यै॒ वज्र॑ इव॒ वा ए॒षा यदभ्रि॒रभ्रि॑रसि॒ नारि॑र॒सीत्या॑ह॒
    शान्त्यै॒ काण्डे॑ काण्डे॒ वै क्रि॒यमा॑णे य॒ज्ञग्ं रक्षाग्ं॑सि जिघाग्ंसन्ति॒ परि॑लिखित॒ग्ं॒ रक्षः॒
    परि॑लिखिता॒ अरा॑तय॒ इत्या॑ह॒ रक्ष॑सा॒ इ॒दम॒हग्ं रक्ष॑सो ग्री॒वा अपि॑ कृन्तामि॒ यो न्द्वि॒ष्म इत्या॑ह॒
    द्वौ वाव पुरु॑षौ॒ य ञ्चै॒व द्वेष्टि॒ यश्चै॑न॒ ङ्ग्री॒वाः कृ॑न्तति दि॒वे त्वा॒ ऽन्तरि॑क्षाय त्वा पृथि॒व्यै
    त्वेत्या॑है॒भ्य ए॒वैनां लोँ॒केभ्यः॒ प्रोक्ष॑ति प॒रस्ता॑ म्मनु॒ष्या॑ ऊर्ज॒मुप॑ जीवन्ति क्रू॒रमि॑व॒
    वा ए॒त ऽव॑ नयति॒ शान्त्यै॒ यव॑मती॒रव॑ नय॒त्यूर्ग्वै यव॒ ऊर्गु॑दु॒बंर॑ ऊ॒र्जैवोर्ज॒ग्ं॒ सम॑र्धयति॒
    यज॑मानेन॒ सम्मि॒तौदु॑बंरी भवति॒ यावा॑ने॒व यज॑मान॒स्ताव॑ती न्दधाति पितृ॒णाग्ं सद॑नम॒सीति॑ ब॒र्॒हिरव॑
    स्तृणाति पितृदेव॒त्या त्पि॑तृदेव॒त्या॑ निखा॑ता स्या र॑व॒स्तीर्य॑ मिनोत्य॒स्या विँधृ॑त्यै द्युता॒नस्त्वा॑
    मारु॒तो मि॑नो॒त्वित्या॑ह द्युता॒नो ह॑ स्म॒ वै मा॑रु॒तो दे॒वाना॒ म्मि॒नो॒ति॒ ब्र॒ह्म॒वनि॑ म्मिनोति
    ब्रह्म॒वनि॑ न्त्वा क्षत्र॒वनि॒मित्या॑ह यथाय॒जुरे॒वैत द्घृ॒तेन॑ द्यावापृथिवी॒ आ पृ॑णेथा॒मित्यौदु॑बंर्या
    ञ्जुहोति॒ द्यावा॑पृथि॒वी ए॒व रसे॑नानक्त्या॒ व॑स्रावयत्या॒न्तमे॒व यज॑मान॒ नक्त्यै॒न्द्रम॒सीति॑ छ॒दिरधि॒
    नि द॑धात्यै॒न्द्रग्ं हि दे॒वत॑या॒ सदो॑ विश्वज॒नस्य॑ छा॒येत्या॑ह विश्वज॒नस्य॒ ह्ये॑षा छा॒या य त्त्रि॒वृता॒
    स्तोमे॑न॒ सम्मि॑त॒ त्ते॑ज॒स्व्ये॑व भ॑व॒ स्यैका॑दशाक्षरा त्रि॒ष्टुगि॑न्द्रि॒य न्त्रि॒ष्टुगि॑न्द्रिया॒व्ये॑व
    भ॑वति॒ पञ्च॑दशछदि॒ भ्रातृ॑व्यवतः पञ्चद॒शो वज्रो॒ भ्रातृ॑व्याभिभूत्यै स॒प्तद॑शछदि प्र॒जाका॑मस्य सप्तद॒शः
    प्र॒जाप॑तिः प्र॒जाप॑ते॒राप्त्या॒ एक॑विग्ंशतिछदि प्रति॒ष्ठाका॑म म्प्रति॒ष्ठा प्रति॑ष्ठित्या उ॒दरं॒
    वैँ सद॒ ऊर्गु॑दु॒बंरो॑ मद्ध्य॒त औदु॑बंरी म्मिनोति मद्ध्य॒त ए॒व प्र॒जाना॒मूर्ज॑ न्मद्ध्य॒त ऊ॒र्जा भु॑ञ्जते
    यजमानलो॒के वै दक्षि॑णानि छ॒दीग्ंषि॑ भ्रातृव्यलो॒क उत्त॑राणि॒ दक्षि॑णा॒न्युत्त॑राणि करोति॒ यज॑मान ऽय॑जमाना॒दुत्त॑रो
    ऽन्तर्व॒र्तान् क॑रोति॒ व्यावृ॑त्त्यै॒ तस्मा॒दर॑ण्य म्प्र॒जा उप॑ जीवन्ति॒ परि॑ त्वा गिर्वणो॒ गिर॒ इत्या॑ह
    यथाय॒जुरे॒वैतदिन्द्र॑स्य॒ स्यूर॒सीन्द्र॑स्य ध्रु॒वम॒सीत्या॑है॒न्द्रग्ं हि दे॒वत॑या॒ सदो॒ य न्न वि॑स्र॒ग्ं॒
    सये॒दमे॑हेनाद्ध्व॒र्युः प्रमी॑येत॒ तस्मा॒ द्य॒ज्ञस्य॒ यद्ध॑वि॒र्धान॑ म्प्रा॒णा उ॑पर॒वा ह॑वि॒र्धाने॑
    खायन्ते॒ तस्मा ष्णः प्रा॒णा र॑क्षो॒हणो॑ वलग॒हनो॑ वैष्ण॒वा न्ख॑ना॒मीत्या॑ह वैष्ण॒वा हि दे॒वत॑योपर॒वा
    असु॑रा॒ वै नि॒र्यन्तो॑ दे॒वाना द्बाहुमा॒त्राः खा॑यन्त इ॒दम॒ह न्नः॑ समा॒नो यमस॑मानो निच॒खानेत्या॑ह॒
    द्वौ वाव पुरु॑षौ॒ यश्चै॒व स॑मा॒नो यश्चास॑मानो॒ यमे॒वास्मै॒ तौ व॑ल॒ग मे॒वोद्व॑पति॒ सन्तृ॑णत्ति॒ तस्मा॒
    थ्सन्तृ॑ण्णा अन्तर॒तः प्रा॒णा न स दस॑भिन्न्नाः प्रा॒णा अ॒पो दा॒र्द्रा अ॑न्तर॒तः प्रा॒णा यव॑मती॒ त्यूर्ग्वै
    यवः॑ प्रा॒णा उ॑पर॒वाः प्रा॒णेष्वे॒वोर्ज॑ न्दधाति ब॒र्॒हिरव॑ स्तृणाति॒ तस्मा ल्लोम॒शा अ॑न्तर॒तः प्रा॒णा
    आज्ये॑न॒ व्याघा॑रयति॒ तेजो॒ वा आज्य॑ म्प्रा॒णा उ॑पर॒वाः प्रा॒णेष्वे॒व तेजो॑ दधाति॒ हनू॒ वा ए॒ते य॒ज्ञस्य॒
    यद॑धि॒षव॑णे॒ न स न्तृ॑ण॒त्त्य स॑तृंण्णे॒ हि हनू॒ अथो॒ खलु॑ दीर्घसो॒मे स॒तृन्द्ये॒ धृत्यै॒ शिरो॒ वा
    ए॒त द्य॒ज्ञस्य॒ यद्ध॑वि॒र्धान॑ प्रा॒णा उ॑पर॒वा हनू॑ म्प्रा॒णा उ॑पर॒वा हनू॑ अधि॒षव॑णे जि॒ह्वा चर्म॒
    ग्रावा॑णो॒ दन्ता॒ मुख॑माहव॒नीयो॒ नासि॑को रु॒दर॒ग्ं॒ सदो॑ य॒दा खलु॒ वै जि॒ह्वया॑ द॒थ्स्वधि॒ खाद॒त्यथ॒
    मुख॑ द्धवि॒र्धाने॒ चर्म॒न्नधि॒ ग्राव॑भिरभि॒षुत्या॑ ऽऽहव॒नीये॑ हु॒त्वा प्र॒त्यञ्चः॑ प॒रेत्य॒ सद॑सि
    भक्षयन्ति॒ यो वै वि॒राजो॑ यज्ञमु॒खे दोहं॒ वेँद॑ दु॒ह ए॒वै ना॑मि॒यं ट्तस्यै॒ त्वक्चर्मोधो॑ ऽधि॒षव॑णे॒
    स्तना॑ उपर॒वा ग्रावा॑णो व॒थ्सा ऋ॒त्विजो॑ दुहन्ति॒ सोमः॒ पयो॒ य ए॒वं ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय
    तैत्तिरीय संहितायां षष्ठकाण्डे द्वितीयः प्रश्न
