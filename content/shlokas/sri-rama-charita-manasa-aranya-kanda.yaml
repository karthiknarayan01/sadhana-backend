  devanagari: श्री गणेशाय नमः श्री जानकीवल्लभो विजयते श्री रामचरितमानस तृतीय सोपान मूलं धर्मतरोर्विवेकजलधेः
    पूर्णेन्दुमानन्ददं वैराग्याम्बुजभास्करं ह्यघघनध्वान्तापहं तापहम्। मोहाम्भोधरपूगपाटनविधौ स्वःसम्भवं
    शङ्करं वन्दे ब्रह्मकुलं कलङ्कशमनं श्रीरामभूपप्रियम् ॥ ॥ सान्द्रानन्दपयोदसौभगतनुं पीताम्बरं सुन्दरं
    पाणौ बाणशरासनं कटिलसत्तूणीरभारं वरम् राजीवायतलोचनं धृतजटाजूटेन संशोभितं सीतालक्ष्मणसंयुतं पथिगतं रामाभिरामं
    भजे ॥ उमा राम गुन गूढ़ पण्डित मुनि पावहिं बिरति। पावहिं मोह बिमूढ़ जे हरि बिमुख न धर्म रति ॥ पुर नर
    भरत प्रीति मैं गाई। मति अनुरूप अनूप सुहाई ॥ अब प्रभु चरित सुनहु अति पावन। करत जे बन सुर नर मुनि भावन
    ॥ एक बार चुनि कुसुम सुहाए। निज कर भूषन राम बनाए ॥ सीतहि पहिराए प्रभु सादर। बैठे फटिक सिला पर सुन्दर
    ॥ सुरपति सुत धरि बायस बेषा। सठ चाहत रघुपति बल देखा ॥ जिमि पिपीलिका सागर थाहा। महा मन्दमति पावन चाहा
    ॥ सीता चरन चौञ्च हति भागा। मूढ़ मन्दमति कारन कागा ॥ चला रुधिर रघुनायक जाना। सीङ्क धनुष सायक सन्धाना
    ॥ दो अति कृपाल रघुनायक सदा दीन पर नेह। ता सन आइ कीन्ह छलु मूरख अवगुन गेह ॥ ॥ प्रेरित मन्त्र ब्रह्मसर
    धावा। चला भाजि बायस भय पावा ॥ धरि निज रुप गयु पितु पाहीं। राम बिमुख राखा तेहि नाहीम् ॥ भा निरास उपजी
    मन त्रासा। जथा चक्र भय रिषि दुर्बासा ॥ ब्रह्मधाम सिवपुर सब लोका। फिरा श्रमित ब्याकुल भय सोका ॥ काहूँ
    बैठन कहा न ओही। राखि को सकि राम कर द्रोही ॥ मातु मृत्यु पितु समन समाना। सुधा होइ बिष सुनु हरिजाना
    ॥ मित्र करि सत रिपु कै करनी। ता कहँ बिबुधनदी बैतरनी ॥ सब जगु ताहि अनलहु ते ताता। जो रघुबीर बिमुख सुनु
    भ्राता ॥ नारद देखा बिकल जयन्ता। लागि दया कोमल चित सन्ता ॥ पठवा तुरत राम पहिं ताही। कहेसि पुकारि प्रनत
    हित पाही ॥ आतुर सभय गहेसि पद जाई। त्राहि त्राहि दयाल रघुराई ॥ अतुलित बल अतुलित प्रभुताई। मैं मतिमन्द
    जानि नहिं पाई ॥ निज कृत कर्म जनित फल पायुँ। अब प्रभु पाहि सरन तकि आयुँ ॥ सुनि कृपाल अति आरत बानी।
    एकनयन करि तजा भवानी ॥ सो कीन्ह मोह बस द्रोह जद्यपि तेहि कर बध उचित। प्रभु छाड़एउ करि छोह को कृपाल
    रघुबीर सम ॥ ॥ रघुपति चित्रकूट बसि नाना। चरित किए श्रुति सुधा समाना ॥ बहुरि राम अस मन अनुमाना। होइहि
    भीर सबहिं मोहि जाना ॥ सकल मुनिन्ह सन बिदा कराई। सीता सहित चले द्वौ भाई ॥ अत्रि के आश्रम जब प्रभु गयू।
    सुनत महामुनि हरषित भयू ॥ पुलकित गात अत्रि उठि धाए। देखि रामु आतुर चलि आए ॥ करत दण्डवत मुनि उर लाए।
    प्रेम बारि द्वौ जन अन्हवाए ॥ देखि राम छबि नयन जुड़आने। सादर निज आश्रम तब आने ॥ करि पूजा कहि बचन सुहाए।
    दिए मूल फल प्रभु मन भाए ॥ सो प्रभु आसन आसीन भरि लोचन सोभा निरखि। मुनिबर परम प्रबीन जोरि पानि अस्तुति
    करत ॥ नमामि भक्त वत्सलं। कृपालु शील कोमलम् ॥ भजामि ते पदाम्बुजं। अकामिनां स्वधामदम् ॥ निकाम श्याम
    सुन्दरं। भवाम्बुनाथ मन्दरम् ॥ प्रफुल्ल कञ्ज लोचनं। मदादि दोष मोचनम् ॥ प्रलम्ब बाहु विक्रमं। प्रभोऽप्रमेय
    वैभवम् ॥ निषङ्ग चाप सायकं। धरं त्रिलोक नायकम् ॥ दिनेश वंश मण्डनं। महेश चाप खण्डनम् ॥ मुनीन्द्र सन्त
