id: sri-bhairava-chalisa
category: stotram
name:
  english: Sri Bhairava Chalisa
content:
  english: doha shri ganapati guru gauri pada prema sahita dhari mata | calisa vandana karaum shri shiva
    bhairavanatha || shri bhairava sankata harana mangala karana kripala | shyama varana vikarala vapu
    locana lala vishala || jaya jaya shri kali ke lala | jayati jayati kashi bhairava bhaya hari | jayati
    kala bhairava balakari || jayati natha bhairava vikhyata | jayati sarva bhairava sukhadata || bhairava
    rupa kiyo shiva dharana | bhava ke bhara utarana karana || bhairava rava suni hvai bhaya duri | saba
    vidhi hoya kamana puri || shesha mahesha adi guna gayo | kashi kotavala kahalayo || jata juta shira
    candra virajata | bala mukuta bijayatha sajata || kati karadhani ghu~gharu bajata | darshana karata
    sakala bhaya bhajata || jivana dana dasa ko dinhyo | kinhyo kripa natha taba cinhyo || vasi rasana
    bani sarada kali | dinhyo vara rakhyo mama lali || dhanya dhanya bhairava bhaya bhanjana | jaya manaranjana
    khala dala bhanjana || kara trishula damaru shuci koraa | kripa kataksha suyasha nahim thoda || jo
    bhairava nirbhaya guna gavata | ashtasiddhi nava nidhi phala pavata || rupa vishala kathina dukha
    mocana | krodha karala lala duhu~ locana || aganita bhuta preta sanga dolata | bam bam bam shiva bam
    bam bolata || rudrakaya kali ke lala | maha kalahu ke ho kala || batuka natha ho kala ga~bhira | shveta
    rakta aru shyama sharira || karata ninahu~ rupa prakasha | bharata subhaktana kaha~ shubha asha ||
    ratna jaraita kancana simhasana | vyaghra carma shuci narma su anana || tumahi jai kashihim jana dhyavahim
    | vishvanatha kaha~ darshana pavahim || jaya prabhu samharaka sunanda jaya | jaya unnata hara uma
    nanda jaya || bhima trilocana svana satha jaya | vaijanatha shri jagatanatha jaya || maha bhima bhishana
    sharira jaya | rudra tryambaka dhira vira jaya || ashvanatha jaya pretanatha jaya | svanarurha sayacandra
    natha jaya || nimisha digambara cakranatha jaya | gahata anathana natha hatha jaya || treshalesha
    bhutesha candra jaya | krodha vatsa amaresha nanda jaya || shri vamana nakulesha canda jaya | krity
    kirati pracanda jaya || rudra batuka krodhesha kaladhara | cakra tunda dasha panivyala dhara || kari
    mada pana shambhu gunagavata | caumsatha yogina sanga nacavata || karata kripa jana para bahu dhanga
    | kashi kotavala arabanga || deya~ kala bhairava jaba sota | nasai papa mota se mota || janakara nirmala
    hoya sharira | mitai sakala sankata bhava pira || shri bhairava bhutonke raja | badha harata karata
    shubha kaja || ailadi ke duhkha nivarayo | sada kripakari kaja samharayo || sundara dasa sahita anuraga
    | shri durvasa nikata prayaga || shri bhairava ji ki jaya lekhyo | sakala kamana purana dekhyo ||
    doha jaya jaya jaya bhairava batuka svami sankata tara | kripa dasa para kijie shankara ke avatara
    || arati jaya bhairava deva prabhu jaya bhairava deva | jaya kali aura gaura devi krita seva || jaya||
    tumhi papa uddharaka duhkha sindhu taraka | bhaktom ke sukha karaka bhishana vapu dharaka || jaya||
    vahana shvana virajata kara trishula dhari | mahima amita tumhari jaya jaya bhayahari || jaya|| tuma
    bina seva deva saphala nahim hove | caumukha dipaka darshana sabaka duhkha khove || jaya|| tela cataki
    dadhi mishrita bhashavali teri | kripa kariye bhairava kariye nahim deri || jaya|| pava ghungharu
    bajata aru damaru damakavata | batukanatha bana balakajana mana harashavata || jaya|| batukanatha
    ki arati jo koi nara gave | kahe dharanidhara nara manavanchita phala pave || jaya||
  devanagari: दोहा श्री गणपति गुरु गौरि पद प्रेम सहित धरि मात । चालीसा वन्दन करौं श्री शिव भैरवनाथ ॥ श्री
    भैरव सङ्कट हरण मङ्गल करण कृपाल । श्याम वरण विकराल वपु लोचन लाल विशाल ॥ जय जय श्री काली के लाला । जयति
    जयति काशी भैरव भय हारी । जयति काल भैरव बलकारी ॥ जयति नाथ भैरव विख्याता । जयति सर्व भैरव सुखदाता ॥
    भैरव रूप कियो शिव धारण । भव के भार उतारण कारण ॥ भैरव रव सुनि ह्वै भय दूरी । सब विधि होय कामना पूरी
    ॥ शेष महेश आदि गुण गायो । काशी कोतवाल कहलायो ॥ जटा जूट शिर चन्द्र विराजत । बाला मुकुट बिजायठ साजत
    ॥ कटि करधनी घूँघरू बाजत । दर्शन करत सकल भय भाजत ॥ जीवन दान दास को दीन्ह्यो । कीन्ह्यो कृपा नाथ तब
    चीन्ह्यो ॥ वसि रसना बनि सारद काली । दीन्ह्यो वर राख्यो मम लाली ॥ धन्य धन्य भैरव भय भञ्जन । जय मनरञ्जन
    खल दल भञ्जन ॥ कर त्रिशूल डमरू शुचि कोड़आ । कृपा कटाक्श सुयश नहिं थोडा ॥ जो भैरव निर्भय गुण गावत ।
    अष्टसिद्धि नव निधि फल पावत ॥ रूप विशाल कठिन दुख मोचन । क्रोध कराल लाल दुहुँ लोचन ॥ अगणित भूत प्रेत
    सङ्ग डोलत । बं बं बं शिव बं बं बोलत ॥ रुद्रकाय काली के लाला । महा कालहू के हो काला ॥ बटुक नाथ हो काल
    गँभीरा । श्वेत रक्त अरु श्याम शरीरा ॥ करत नीनहूँ रूप प्रकाशा । भरत सुभक्तन कहँ शुभ आशा ॥ रत्न जड़इत
    कञ्चन सिंहासन । व्याघ्र चर्म शुचि नर्म सु आनन ॥ तुमहि जाइ काशिहिं जन ध्यावहिम् । विश्वनाथ कहँ दर्शन
    पावहिम् ॥ जय प्रभु संहारक सुनन्द जय । जय उन्नत हर उमा नन्द जय ॥ भीम त्रिलोचन स्वान साथ जय । वैजनाथ
    श्री जगतनाथ जय ॥ महा भीम भीषण शरीर जय । रुद्र त्र्यम्बक धीर वीर जय ॥ अश्वनाथ जय प्रेतनाथ जय । स्वानारुढ़
    सयचन्द्र नाथ जय ॥ निमिष दिगम्बर चक्रनाथ जय । गहत अनाथन नाथ हाथ जय ॥ त्रेशलेश भूतेश चन्द्र जय । क्रोध
    वत्स अमरेश नन्द जय ॥ श्री वामन नकुलेश चण्ड जय । कृत्य् कीरति प्रचण्ड जय ॥ रुद्र बटुक क्रोधेश कालधर
    । चक्र तुण्ड दश पाणिव्याल धर ॥ करि मद पान शम्भु गुणगावत । चौंसठ योगिन सङ्ग नचावत ॥ करत कृपा जन पर
    बहु ढङ्गा । काशी कोतवाल अड़बङ्गा ॥ देयँ काल भैरव जब सोटा । नसै पाप मोटा से मोटा ॥ जनकर निर्मल होय
    शरीरा । मिटै सकल सङ्कट भव पीरा ॥ श्री भैरव भूतोङ्के राजा । बाधा हरत करत शुभ काजा ॥ ऐलादी के दुःख निवारयो
    । सदा कृपाकरि काज सम्हारयो ॥ सुन्दर दास सहित अनुरागा । श्री दुर्वासा निकट प्रयागा ॥ श्री भैरव जी की
    जय लेख्यो । सकल कामना पूरण देख्यो ॥ दोहा जय जय जय भैरव बटुक स्वामी सङ्कट टार । कृपा दास पर कीजिए शङ्कर
    के अवतार ॥ आरती जय भैरव देवा प्रभु जय भैरव देवा । जय काली और गौरा देवी कृत सेवा ॥ जय॥ तुम्ही पाप उद्धारक
    दुःख सिन्धु तारक । भक्तों के सुख कारक भीषण वपु धारक ॥ जय॥ वाहन श्वान विराजत कर त्रिशूल धारी । महिमा
    अमित तुम्हारी जय जय भयहारी ॥ जय॥ तुम बिन सेवा देवा सफल नहीं होवे । चौमुख दीपक दर्शन सबका दुःख खोवे
    ॥ जय॥ तेल चटकि दधि मिश्रित भाषावलि तेरी । कृपा करिये भैरव करिये नहीं देरी ॥ जय॥ पाव घूङ्घरु बाजत अरु
    डमरु डमकावत । बटुकनाथ बन बालकजन मन हरषावत ॥ जय॥ बटुकनाथ की आरती जो कोई नर गावे । कहे धरणीधर नर मनवाञ्छित
    फल पावे ॥ जय॥
