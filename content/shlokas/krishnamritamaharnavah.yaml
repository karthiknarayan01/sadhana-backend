id: krishnamritamaharnavah
category: stotram
name:
  english: krishnamritamaharnavah
  devanagari: कृष्णामृतमहार्णवः
content:
  english: '|| 155 || tasmacchuklam atho krishnam bharanyadiyutam api pratyavayanishedhartham upavasita
    nityashah prinanartham hareshvapi vishnulokasya ca''ptaye'
  devanagari: ।। १५५ ।। तस्माच्छुक्लां अथो कृष्णां भरण्यादियुतां अपि प्रत्यवायनिषेधार्थं उपवासीत नित्यशः
    प्रीणनार्थं हरेश्वापि विष्णुलोकस्य चाऽप्तये
meaning: {}
