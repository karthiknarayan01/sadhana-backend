id: ramakrishnavatarastotram
category: stotram
name:
  english: ramakrishnavatarastotram
  devanagari: रामकृष्णावतारस्तोत्रम्
content:
  english: suprapyashca na khalu kasyacit yato'nyah | so saveva paramahamsa ramakrishnah sarvajnah sakalamanomatah
    prashantah || 2|| rakshartham nijavacanam tritapaharta gaurangena bhagavata pratishrutam yat | bhaktartham
    paramadayalu gatastvam mahyam te purusha samarpayami sarvam || 3|| chadma prasadhana dharo'si vivetti
    kaste krishnadhunavataranasya nigur̤ha tattvam | svenaiva cenna kathitam shiva tvatpriyebhyo guptavatara
    bhagavan bhavatah kripaivam || 4|| iti svamitrigunatitaviracitam
  devanagari: सुप्राप्यश्च न खलु कस्यचित् यतोऽन्यः । सो सावेव परमहंस रामकृष्णः सर्वज्ञः सकलमनोमतः प्रशान्तः
    ॥ २॥ रक्षार्थं निजवचनं त्रितापहर्ता गौराङ्गेन भगवता प्रतिश्रुतं यत् । भक्तार्थं परमदयालु गतस्त्वं
    मह्यां ते पुरुष समर्पयामि सर्वम् ॥ ३॥ छद्म प्रसाधन धरोऽसि विवेत्ति कस्ते कृष्णाधुनावतरणस्य निगूढ़
    तत्त्वम् । स्वेनैव चेन्न कथितं शिव त्वत्प्रियेभ्यो गुप्तावतार भगवन् भवतः कृपैवम् ॥ ४॥ इति स्वामित्रिगुणातीतविरचितं
meaning: {}
