    । तस्य॑ प॒र्णम॑च्छिद्यत । त त्प॒र्णस्य॑ पर्ण॒त्वम् । ब्रह्म॒ वै प॒र्णः । य त्प॑र्णशा॒खया॑ व॒थ्सान॑पाक॒रोति॑
    । ब्रह्म॑णै॒वैना॑न॒पाक॑रोति ॥ गा॒य॒त्रो वै प॒र्णः । गा॒य॒त्राः प॒शवः॑ ॥ त्त्रीणि॑त्रीणि प॒र्णस्य॑
