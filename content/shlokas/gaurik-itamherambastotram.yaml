id: gaurik-itamherambastotram
category: stotram
name:
  english: gaurikṟitamherambastotram
  devanagari: गौरिक्ऱितंहेरम्बस्तोत्रम्
content:
  english: herambastotram gaurikritam shri ganeshaya namah | gauryuvaca | gajanana jnanaviharakarinna
    mam ca janasi paravamarsham | ganesha rakshasva na cecchariram tyajami sadyastvayi bhaktiyukta ||
    1|| vighnesha heramba mahodara priya lambodara premavivardhanacyuta | vighnasya harta'surasanghaharta
    mam raksha daityatvayi bhaktiyuktam || 2|| kim siddhibuddhiprasarena mohayukto'si kim va nishi nidrito'si
    | kim lakshalabharthavicarayuktah kim mam ca vismritya susamsthito'si || 3|| kim bhaktasangena ca
    devadeva nanopacaraishca suyantrito'si | kim modakarthe ganapaddhrito'si nanavihareshu ca vakratunda
    || 4|| svanandabhogeshu parihrito'si dasim ca vismritya mahanubhava | anantyalilasu ca lalaso'si kim
    bhaktaraksharthasusankatasthah || 5|| aho ganeshamritapanadakshamaraistatha va'surapaih smrito'si
    | tadarthananavidhisamyuto'si visrijya mam dasimananyabhavam || 6|| rakshasva mam dinatamam paresha
    sarvatra citteshu ca samsthitastvam | prabho vilambena vinayako'si brahmesha kim deva namo namaste
    || 7|| bhaktabhimaniti ca nama mukhyam vede tvabhavan nahi cenmahatman | agatya hatva'ditijam suresha
    mam raksha dasim hridi padanishtham || 8|| aho na duram tava kincideva katham na buddhisha samagato'si
    | sucintyadeva prajahami deham yashah karishye viparitamevam || 9|| raksha raksha dayasindho'paradhanme
    kshamasva ca | kshane kshane tvaham dasi rakshitavya visheshatah || 10|| stuvatyameva parvatyam shankaro
    bodhasamyutah | babhuva ganapanam vai shrutva haharavam vidheh || 11|| ganesham manasa smritva vrisharudhah
    samayayau | kshanena daityarajam tam drishtva damarunahanat || 12|| tatah so'pi shivam vikshyalingitum
    dhavito|abhavat | shivasya shulikadini shastrani kunthitani vai || 13|| tam drishtva paramashcaryam
    bhayabhito maheshvarah | sasmara ganapam so'pi nirvighnartham prajapate || 14|| parvatyah stavanam
    shrutva gajananah samayayau | iti mudgalapuranoktam herambastotram sampurnam |
  devanagari: हेरम्बस्तोत्रं गौरिकृतम् श्री गणेशाय नमः । गौर्युवाच । गजानन ज्ञानविहारकारिन्न मां च जानासि
    परावमर्षाम् । गणेश रक्षस्व न चेच्छरीरं त्यजामि सद्यस्त्वयि भक्तियुक्ता ॥ १॥ विघ्नेश हेरम्ब महोदर प्रिय
    लम्बोदर प्रेमविवर्धनाच्युत । विघ्नस्य हर्ताऽसुरसङ्घहर्ता मां रक्ष दैत्यात्वयि भक्तियुक्ताम् ॥ २॥ किं
    सिद्धिबुद्धिप्रसरेण मोहयुक्तोऽसि किं वा निशि निद्रितोऽसि । किं लक्षलाभार्थविचारयुक्तः किं मां च विस्मृत्य
    सुसंस्थितोऽसि ॥ ३॥ किं भक्तसङ्गेन च देवदेव नानोपचारैश्च सुयन्त्रितोऽसि । किं मोदकार्थे गणपाद्धृतोऽसि
    नानाविहारेषु च वक्रतुण्ड ॥ ४॥ स्वानन्दभोगेषु परिहृतोऽसि दासीं च विस्मृत्य महानुभाव । आनन्त्यलीलासु
    च लालसोऽसि किं भक्तरक्षार्थसुसङ्कटस्थः ॥ ५॥ अहो गणेशामृतपानदक्षामरैस्तथा वाऽसुरपैः स्मृतोऽसि । तदर्थनानाविधिसंयुतोऽसि
    विसृज्य मां दासीमनन्यभावाम् ॥ ६॥ रक्षस्व मां दीनतमां परेश सर्वत्र चित्तेषु च संस्थितस्त्वम् । प्रभो
    विलम्बेन विनायकोऽसि ब्रह्मेश किं देव नमो नमस्ते ॥ ७॥ भक्ताभिमानीति च नाम मुख्यं वेदे त्वभावान् नहि
    चेन्महात्मन् । आगत्य हत्वाऽदितिजं सुरेश मां रक्ष दासीं हृदि पादनिष्ठाम् ॥ ८॥ अहो न दूरं तव किञ्चिदेव
    कथं न बुद्धीश समागतोऽसि । सुचिन्त्यदेव प्रजहामि देहं यशः करिष्ये विपरीतमेवम् ॥ ९॥ रक्ष रक्ष दयासिन्धोऽपराधान्मे
    क्षमस्व च । क्षणे क्षणे त्वहं दासी रक्षितव्या विशेषतः ॥ १०॥ स्तुवत्यामेव पार्वत्यां शङ्करो बोधसंयुतः
    । बभूव गणपानां वै श्रुत्वा हाहारवं विधेः ॥ ११॥ गणेशं मनसा स्मृत्वा वृषारूढः समाययौ । क्षणेन दैत्यराजं
    तं दृष्ट्वा डमरुणाहनत् ॥ १२॥ ततः सोऽपि शिवं वीक्ष्यालिङ्गितुं धवितो।आभवत् । शिवस्य शूलिकादीनि शस्त्राणि
    कुण्ठितानि वै ॥ १३॥ तं दृष्ट्वा परमाश्चर्यं भयभीतो महेश्वरः । सस्मार गणपं सोऽपि निर्विघ्नार्थं प्रजापते
    ॥ १४॥ पार्वत्याः स्तवनं श्रुत्वा गजाननः समाययौ । इति मुद्गलपुराणोक्तं हेरम्बस्तोत्रं सम्पूर्णम् ।
