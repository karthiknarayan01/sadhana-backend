id: nanda-kumara-ashtakam
category: stotram
name:
  english: Nanda Kumara Ashtakam
content:
  english: sundaragopalam uravanamalam nayanavishalam duhkhaharam brindavanacandramanandakandam paramanandam
    dharanidharam | vallabhaghanashyamam purnakamam atyabhiramam pritikaram bhaja nandakumaram sarvasukhasaram
    tattvavicaram brahmaparam || || sundaravarijavadanam nirjitamadanam anandasadanam mukutadharam gunjakritiharam
    vipinaviharam paramodaram ciraharam | vallabhapatapitam krita upavitam karanavanitam vibudhavaram
    bhaja nandakumaram sarvasukhasaram tattvavicaram brahmaparam || || shobhitasukhamulam yamunakulam
    nipata atulam sukhadataram mukhamanditarenum caritadhenum vaditavenum madhurasuram | vallabhamativimalam
    shubhapadakamalam nakharuci amalam timiraharam bhaja nandakumaram sarvasukhasaram tattvavicaram brahmaparam
    || || shiramukutasudesham kuncitakesham natavaravesham kamavaram mayakritamanujam haladhara anujam
    pratihatadanujam bharaharam | vallabhavrajapalam subhagasucalam hitamanukalam bhavavaram bhaja nandakumaram
    sarvasukhasaram tattvavicaram brahmaparam || || indivarabhasam prakatasarasam kusumavikasam vamshadharam
    hritmanmathamanam rupanidhanam kritakalaganam cittaharam | vallabhamriduhasam kunjanivasam vividhavilasam
    kelikaram bhaja nandakumaram sarvasukhasaram tattvavicaram brahmaparam || || atiparamapravinam palitadinam
    bhaktadhinam karmakaram mohanamatidhiram phanibalaviram hataparaviram taralataram | vallabhavrajaramanam
    varijavadanam haladharashamanam shailadharam bhaja nandakumaram sarvasukhasaram tattvavicaram brahmaparam
    || || jaladharadyutiangam lalitatribhangam bahukritirangam rasikavaram gokulaparivaram madanakaram
    kunjaviharam gudhataram | vallabhavrajacandram subhagasuchandam krita anandam bhrantiharam bhaja nandakumaram
    sarvasukhasaram tattvavicaram brahmaparam || || vanditayugacaranam pavanakaranam jagaduddharanam vimaladharam
    kaliyashiragamanam kritaphaninamanam ghatitayamanam mridulataram | vallabhaduhkhaharanam nirmalacaranam
    asharanasharanam muktikaram bhaja nandakumaram sarvasukhasaram tattvavicaram brahmaparam || || iti
    shrimadvallabhacaryaviracitam shrinandakumarashtakam ||
  devanagari: सुन्दरगोपालं उरवनमालं नयनविशालं दुःखहरं बृन्दावनचन्द्रमानन्दकन्दं परमानन्दं धरणिधरम् । वल्लभघनश्यामं
    पूर्णकामं अत्यभिरामं प्रीतिकरं भज नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम् ॥ ॥ सुन्दरवारिजवदनं
    निर्जितमदनं आनन्दसदनं मुकुटधरं गुञ्जाकृतिहारं विपिनविहारं परमोदारं चीरहरम् । वल्लभपटपीतं कृत उपवीतं
    करनवनीतं विबुधवरं भज नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम् ॥ ॥ शोभितसुखमूलं यमुनाकूलं निपट
    अतूलं सुखदतरं मुखमण्डितरेणुं चारितधेनुं वादितवेणुं मधुरसुरम् । वल्लभमतिविमलं शुभपदकमलं नखरुचि अमलं
    तिमिरहरं भज नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम् ॥ ॥ शिरमुकुटसुदेशं कुञ्चितकेशं नटवरवेषं
    कामवरं मायाकृतमनुजं हलधर अनुजं प्रतिहतदनुजं भारहरम् । वल्लभव्रजपालं सुभगसुचालं हितमनुकालं भाववरं भज
    नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम् ॥ ॥ इन्दीवरभासं प्रकटसरासं कुसुमविकासं वंशधरं हृत्मन्मथमानं
    रूपनिधानं कृतकलगानं चित्तहरम् । वल्लभमृदुहासं कुञ्जनिवासं विविधविलासं केलिकरं भज नन्दकुमारं सर्वसुखसारं
    तत्त्वविचारं ब्रह्मपरम् ॥ ॥ अतिपरमप्रवीणं पालितदीनं भक्ताधीनं कर्मकरं मोहनमतिधीरं फणिबलवीरं हतपरवीरं
    तरलतरम् । वल्लभव्रजरमणं वारिजवदनं हलधरशमनं शैलधरं भज नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम्
    ॥ ॥ जलधरद्युतिअङ्गं ललितत्रिभङ्गं बहुकृतिरङ्गं रसिकवरं गोकुलपरिवारं मदनाकारं कुञ्जविहारं गूढतरम् ।
    वल्लभव्रजचन्द्रं सुभगसुछन्दं कृत आनन्दं भ्रान्तिहरं भज नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम्
    ॥ ॥ वन्दितयुगचरणं पावनकरणं जगदुद्धरणं विमलधरं कालियशिरगमनं कृतफणिनमनं घातितयमनं मृदुलतरम् । वल्लभदुःखहरणं
    निर्मलचरणं अशरणशरणं मुक्तिकरं भज नन्दकुमारं सर्वसुखसारं तत्त्वविचारं ब्रह्मपरम् ॥ ॥ इति श्रीमद्वल्लभाचार्यविरचितं
    श्रीनन्दकुमाराष्टकम् ॥
