id: candrashekharagurubhujangastotram
category: stotram
name:
  english: candrashekharagurubhujangastotram
  devanagari: चन्द्रशेखरगुरुभुजन्गस्तोत्रम्
content:
  english: shricandrashekharagurubhujangastotram kshitau vegavatyastate kancimadhye mahapunyadeshe susukshmam
    jvalantam | namatsurivrindam cidanandakandam bhaje kamakotigurum yogivaryam || 1||
  devanagari: श्रीचन्द्रशेखरगुरुभुजङ्गस्तोत्रम् क्षितौ वेगवत्यास्तटे काञ्चिमध्ये महापुण्यदेशे सुसूक्ष्मं
    ज्वलन्तम् । नमत्सूरिवृन्दं चिदानन्दकन्दं भजे कामकोटीगुरुं योगिवर्यम् ॥ १॥
meaning: {}
