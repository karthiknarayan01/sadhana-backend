id: ashtavakra-gita-chapter-6
category: stotram
name:
  english: Ashtavakra Gita Chapter 6
content:
  english: janaka uvaca || akashavadananto'ham ghatavat prakritam jagat | iti jnanam tathaitasya na tyago
    na graho layah || || mahodadhirivaham sa prapanco vicisannibhah | iti jnanam tathaitasya na tyago
    na graho layah || || aham sa shuktisankasho rupyavad vishvakalpana | iti jnanam tathaitasya na tyago
    na graho layah || || aham va sarvabhuteshu sarvabhutanyatho mayi | iti jnanam tathaitasya na tyago
    na graho layah ||
  devanagari: जनक उवाच ॥ आकाशवदनन्तोऽहं घटवत् प्राकृतं जगत् । इति ज्ञानं तथैतस्य न त्यागो न ग्रहो लयः
    ॥ ॥ महोदधिरिवाहं स प्रपञ्चो वीचिसन्निभः । इति ज्ञानं तथैतस्य न त्यागो न ग्रहो लयः ॥ ॥ अहं स शुक्तिसङ्काशो
    रूप्यवद् विश्वकल्पना । इति ज्ञानं तथैतस्य न त्यागो न ग्रहो लयः ॥ ॥ अहं वा सर्वभूतेषु सर्वभूतान्यथो
    मयि । इति ज्ञानं तथैतस्य न त्यागो न ग्रहो लयः ॥
