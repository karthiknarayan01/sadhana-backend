id: ramanujakritamvenkateshastotram
category: stotram
name:
  english: ramanujakritamvenkateshastotram
  devanagari: रामानुजकृतंवेन्कटेशस्तोत्रम्
content:
  english: ramanujakritam venkateshastotram ramanuja uvaca | namo devadhidevaya shankhacakragadabhrite
    | namo nityaya shuddhaya venkatashaya te namah || 16|| namo bhaktartihantre te havyakavyasvarupine
    | namastrimurtaye tubhyam srishtisthityantakarine || 17|| namah pareshaya namo'tibhumne namo'stu lakshmipataye
    vidhatre | namo'stu suryenduvilocanaya namo virincadyabhivanditaya || 18|| yo namajatyadivikalpahinah
    samastadoshairapi varjito yah | samastasamsarabhayapaharine tasmai namo daityavinashakaya || 19||
    vedantavedyaya rameshvaraya vrishadivasaya vidhatripitre | namo namah sarvajanartiharine narayanayamitavikramaya
    || 1
  devanagari: रामानुजकृतं वेङ्कटेशस्तोत्रम् रामानुज उवाच । नमो देवाधिदेवाय शङ्खचक्रगदाभृते । नमो नित्याय
    शुद्धाय वेङ्कटशाय ते नमः ॥ १६॥ नमो भक्तार्तिहन्त्रे ते हव्यकव्यस्वरूपिणे । नमस्त्रिमूर्तये तुभ्यं
    सृष्टिस्थित्यन्तकारिणे ॥ १७॥ नमः परेशाय नमोऽतिभूम्ने नमोऽस्तु लक्ष्मीपतये विधात्रे । नमोऽस्तु सूर्येन्दुविलोचनाय
    नमो विरिञ्चाद्यभिवन्दिताय ॥ १८॥ यो नामजात्यादिविकल्पहीनः समस्तदोषैरपि वर्जितो यः । समस्तसंसारभयापहारिणे
    तस्मै नमो दैत्यविनाशकाय ॥ १९॥ वेदान्तवेद्याय रमेश्वराय वृषादिवासाय विधातृपित्रे । नमो नमः सर्वजनार्तिहारिणे
    नारायणायामितविक्रमाय ॥ १
meaning: {}
