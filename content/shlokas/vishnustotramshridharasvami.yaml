id: vishnustotramshridharasvami
category: stotram
name:
  english: vishnustotramshridharasvami
  devanagari: विष्णुस्तोत्रम्श्रीधरस्वामि
content:
  english: yannityam shrutibhirmuhurmuhuraho samstuyamanam sthitam yadbrahmendrasuradikairaharahardhyatam
    ca gitam punah | yatsarveshu virajitam muninutam divyam param pavanam tadvishnoh paramam padam shraya
    iha svarajyasaukhyambudhim || 1|| yatsaukhyambudhileshatah surucira brahmandabhukotayo yatprapya sthiramokshadam
    punarasau navartate bhutale | esho'sya shrutayo vadanti paramanandashca yo jnaninah tadvishnoh paramam
    padam shraya iha svarajyasaukhyambudhim || 2|| suryacandramasau na yatra hutabhunnimastatha vidyuto
    naite yatra vasanti tarakagana yadbhasitum vishrutam | yadbhasaiva vibhati sarvamiha yaddhantam svatah
    shashvatam tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 3|| navidya na ca jivavishvakalana
    mayeshabhavadikam yasminnaiva vibhati yasya na tatha bhinnam vibhanam kvacit | cinmatraikarasam sthitam
    paramaho yadbrahmarupam shivam tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 4|| karyam
    yasya na karanam kimapi yadbaddham ca muktam ca no yah stri naiva pumamstatha na ca guna yasminvikarastatha
    | yannamnapi na bhati naiva ca tatha rupena vakti shrutih tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim
    || 5|| sanmatre sukhavigrahe suvimale'dvaitam kutah sambhavet kasya syatprabhavastatha bhavati ka
    nari ca ko va puman | dehapranahridindriyairbhavati kim yuktam ca baddho'sti kah tadvishnoh paramam
    padam shraya iha svarajyasaukhyambudhim || 6|| mayamatramidam hi vishvamakhilam jiveshabandhadikam
    ya maya kila sapi ma yadi bhavecchishyeta kim va punah | yanmaya janani na tatkhalu vasetsaccidghane'sminyatah
    tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 7|| maya ya khalu sa jada kathamiyam
    sambhavyate cidghane tatsannidhyavashatkarotyapi ca cejjnanam tadeva dhruvam | yatpurnam satatadvayam
    vibhumahadyasminna kincinmishat tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 8||
    cidbrahmeti ca shasanatkathamiyam maya ca bhinnaspada tadbhanam ca tathasya citsthitiraho lakshyeta
    kim mayaya | brahmacchayamanantamadvayaparam satyam ca yacchruyate tadvishnoh paramam padam shraya
    iha svarajyasaukhyambudhim || 9|| guhedbrahma na bhasakam kathamapi spardheta kim tena va tasmadbhinnamapiha
    kim punariyam maya srijedvai jada | maya naiva vijrimbhate citi shive yasminnakhande'dvaye tadvishnoh
    paramam padam shraya iha svarajyasaukhyambudhim || 10|| yajjnatvamritamashnute hi sakalan pashamshchinatti
    svayam sarvajnatvamavapyate kila kriti syadbrahmasaukhyam svayam | shishyedasya ca lambane kimapi
    no bhinnam tato lambanam tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 11|| mrityormrityumupaiti
    bhitimapi yah pashyedyato bhinnatam nana neha na taddvitiyamiti va brute shrutirnityashah | satyam
    jnanamanantamadvayamaho rupam hi yatpraninam dvashnoh paramam padamiha svarajyasaukhyambudhim || 12||
    maya yadyapi sarvakaryamiha yattasyabhavedastutau sarvavyapivibhasakam bhavati kim luptam ca tenadhuna
    | yatsarvasya vibhasitam shrutimatam satyam param cidrasam tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim
    || 13|| ko'nyadva vacanat sphutam parataram yatpraninam jivanam mudhah ko'tra vihaya tatparamaho manyeta
    vaikarikam | hitva sarvamapiha samsaranatah praptam sukham mayikam tadvishnoh paramam padam shraya
    iha svarajyasaukhyambudhim || 14|| cinmatraikarasadvayam shrutinutam yatsvatmasaukhyam shivam tajjneyam
    janayetkatham jadamaho doshairanekairvritam | cidrupam khalu yatsadaiva rahitam jneyena va mayaya
    tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 15|| cinmatre sukhamatrake jadamidam
    drishyam bhramadbhavyate syanmayapi vimohita khalu jada heturbhavedasya ya | labhyam yatsukharupakam
    na ca jadam mayabhrame va bhavet tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 16||
    brahmaivahamidam ca sarvamapi va brahmaiva vakti shrutih bhinnam kim samajayataikamiha yadbrahmaiva
    bahyantaram | yanmaya jagadishajivavishayabhrantya na lupyetkvacit tadvishnoh paramam padam shraya
    iha svarajyasaukhyambudhim || 17|| yadbrahmahamiti sphutam tanujagajjiveshabhava ime pumstriputrahridindriyani
    ca punarbhokta ca bhogadayah | devah pretaganashca tiryagathava yasmin khapushpayate tadvishnoh paramam
    padam shraya iha svarajyasaukhyambudhim || 18|| yatpurnam svata eva nirmalamaho svanandamatram param
    tasminsarvavibhasake sphutatare bhinnasya yatsarjane | yasyeccha na ca haitukam jagadaho jayeta yasmin
    kvacit tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 19|| maya napi tadutthitam ca
    jagatah sankalpanam naiva ca naiva syatprakritih pumanapi ca tadyogo jagatsarjane | vidyapurushashca
    yoshiduta tadyogashca putrodbhavah tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 20||
    jneyam naiva yadasti cighanashive dvaitam kuto bhavyate sarvajnah parameshvaro'pi na tatha kincijjnajivastatah
    | yasminsarvamapiti kincidathava jneyam na vettum kvacit tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim
    || 21|| maya cediha va''vrinoti kimidam shakyam jadayam bhavet tasmaccetayate ca sa yadi taya kim
    chadyate brahma tat | yannaiva'vriyate na karyamapi va jayeta yasmin kvacit tadvishnoh paramam padam
    shraya iha svarajyasaukhyambudhim || 22|| bhinneyam na ca vasti sa yadi bhavedbhinna na maya kvacit
    bhinneyam ca yada bhavettadapi no maya bhavedvastavi | sadbrahmeti ca shasanadbhavati ya bhinna sati
    yatra tu tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 23|| bhavo napyasatah sato'pi
    na tatha bhavah kvacidvarnyate maya napi tato na karyamiti va mantum kvacicchishyate | pashyennaiva
    kadapi kena yadi va shrutyaksharam yatsphutam tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim
    || 24|| jadyam duhkhamathamritatvamiti yatsambadhyate sajjane saccitsaukhyamiti sphutam paramaho brahmadvayam
    shashvatam | anandaikarasadvaye'paramidam duhkhadikam no yatah tadvishnoh paramam padam shraya iha
    svarajyasaukhyambudhim || 25|| sukshmasthulatayapi bhumni jagato'stitvam na satyam bhavet tacchakterapi
    va bhavedyadi tada shaktirna bhinna kvacit | bhinnam karyamito yato na hi bhavedyaccadvayam shashvatam
    tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 26|| bhinna sapi ca kapi shaktirathava
    bhinna na vaktum bhavet tasmadbhinnavibhasakarmakushala'nirvacyabhava yadi | mithyaiveyamiti sphutam
    yadi na sa yasminnasange'dvaye tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 27||
    maya ka'pi ca va bhavedbhavatu tatkaryam ca tasya api satyam jnanamanantamadvayamaho svasmadvivicyadishet
    | tanmatva vimukhena pashyati kada mayam ca yasmin pare tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim
    || 28|| duhkhantam kila jivitam kshanasukham doshairanekairvritam yogo yannarakasya tadratirasah kasmai
    sukhayodbhavet | sarvam duhkhamidam vimohakamato yanmayikam visphutam tadvishnoh paramam padam shraya
    iha svarajyasaukhyambudhim || 29|| tuccha duhkhamayi hyasatyapi ca sa durlanghaniya yadi mameveha
    bhavetprapanna iti cenmayam taredyovadat | yam labdhva paramam svakam punaraho mayam na pashyetkvacit
    tadvishnoh paramam padam shraya iha svarajyasaukhyambudhim || 30|| samsarartiharam kshipram jnanavijnanadayakam
    | vishnustotramidam nityam pathan svarajyamashnute || iti shrimat paramahamsaparivrajakacarya sadguru
    bhagavan shridharasvamimaharajaviracitam shrivishnustotram sampurnam | vaikunthacaturdashi
  devanagari: यन्नित्यं श्रुतिभिर्मुहुर्मुहुरहो संस्तूयमानं स्थितं यद्ब्रह्मेन्द्रसुरादिकैरहरहर्ध्यातं
    च गीतं पुनः । यत्सर्वेषु विराजितं मुनिनुतं दिव्यं परं पावनं तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम्
    ॥ १॥ यत्सौख्याम्बुधिलेशतः सुरुचिरा ब्रह्माण्डभूकोटयो यत्प्राप्य स्थिरमोक्षदं पुनरसौ नावर्तते भूतले
    । एषोऽस्य श्रुतयो वदन्ति परमानन्दश्च यो ज्ञानिनः तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम्
    ॥ २॥ सूर्याचन्द्रमसौ न यत्र हुतभुङ्नीमास्तथा विद्युतो नैते यत्र वसन्ति तारकगणा यद्भासितुं विश्रुतम्
    । यद्भासैव विभाति सर्वमिह यद्धान्तं स्वतः शाश्वतं तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम्
    ॥ ३॥ नाविद्या न च जीवविश्वकलना मायेशभावादिकं यस्मिन्नैव विभाति यस्य न तथा भिन्नं विभानं क्वचित् ।
    चिन्मात्रैकरसं स्थितं परमहो यद्ब्रह्मरूपं शिवं तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम्
    ॥ ४॥ कार्यं यस्य न कारणं किमपि यद्बद्धं च मुक्तं च नो यः स्त्री नैव पुमांस्तथा न च गुणा यस्मिन्विकारास्तथा
    । यन्नाम्नापि न भाति नैव च तथा रूपेण वक्ति श्रुतिः तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम्
    ॥ ५॥ सन्मात्रे सुखविग्रहे सुविमलेऽद्वैतं कुतः सम्भवेत् कस्य स्यात्प्रभवस्तथा भवति का नारी च को वा
    पुमान् । देहप्राणहृदिन्द्रियैर्भवति किं युक्तं च बद्धोऽस्ति कः तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम्
    ॥ ६॥ मायामात्रमिदं हि विश्वमखिलं जीवेशबन्धादिकं या माया किल सापि मा यदि भवेच्छिष्येत किं वा पुनः ।
    यन्माया जननी न तत्खलु वसेत्सच्चिद्घनेऽस्मिन्यतः तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम्
    ॥ ७॥ माया या खलु सा जडा कथमियं सम्भाव्यते चिद्घने तत्सान्निध्यवशात्करोत्यपि च चेज्ज्ञानं तदेव ध्रुवम्
    । यत्पूर्णं सतताद्वयं विभुमहद्यस्मिन्न किञ्चिन्मिषत् तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम्
    ॥ ८॥ चिद्ब्रह्मेति च शासनात्कथमियं माया च भिन्नास्पदा तद्भानं च तथास्य चित्स्थितिरहो लक्ष्येत किं
    मायया । ब्रह्मच्छायमनन्तमद्वयपरं सत्यं च यच्छ्रूयते तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम्
    ॥ ९॥ गूहेद्ब्रह्म न भासकं कथमपि स्पर्धेत किं तेन वा तस्माद्भिन्नमपीह किं पुनरियं माया सृजेद्वै जडा
    । माया नैव विजृम्भते चिति शिवे यस्मिन्नखण्डेऽद्वये तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम्
    ॥ १०॥ यज्ज्ञात्वामृतमश्नुते हि सकलान् पाशांश्छिनत्ति स्वयं सर्वज्ञत्वमवाप्यते किल कृती स्याद्ब्रह्मसौख्यं
    स्वयम् । शिष्येदस्य च लम्बने किमपि नो भिन्नं ततो लम्बनं तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम्
    ॥ ११॥ मृत्योर्मृत्युमुपैति भीतिमपि यः पश्येद्यतो भिन्नतां नाना नेह न तद्द्वितीयमिति वा ब्रूते श्रुतिर्नित्यशः
    । सत्यं ज्ञानमनन्तमद्वयमहो रूपं हि यत्प्राणिनां द्वष्णोः परमं पदमिह स्वाराज्यसौख्याम्बुधिम् ॥ १२॥
    माया यद्यपि सर्वकार्यमिह यत्तस्याभवेदस्तुतौ सर्वव्यापिविभासकं भवति किं लुप्तं च तेनाधुना । यत्सर्वस्य
    विभासितं श्रुतिमतं सत्यं परं चिद्रसं तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ १३॥ कोऽन्याद्वा
    वचनात् स्फुटं परतरं यत्प्राणिनां जीवनं मूढः कोऽत्र विहाय तत्परमहो मन्येत वैकारिकम् । हित्वा सर्वमपीह
    संसरणतः प्राप्तं सुखं मायिकं तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ १४॥ चिन्मात्रैकरसाद्वयं
    श्रुतिनुतं यत्स्वात्मसौख्यं शिवं तज्ज्ञेयं जनयेत्कथं जडमहो दोषैरनेकैर्वृतम् । चिद्रूपं खलु यत्सदैव
    रहितं ज्ञेयेन वा मायया तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ १५॥ चिन्मात्रे सुखमात्रके
    जडमिदं दृश्यं भ्रमाद्भाव्यते स्यान्मायापि विमोहिता खलु जडा हेतुर्भवेदस्य या । लभ्यं यत्सुखरूपकं न
    च जडं मायाभ्रमे वा भवेत् तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ १६॥ ब्रह्मैवाहमिदं
    च सर्वमपि वा ब्रह्मैव वक्ति श्रुतिः भिन्नं किं समजायतैकमिह यद्ब्रह्मैव बाह्यान्तरम् । यन्माया जगदीशजीवविषयभ्रान्त्या
    न लुप्येत्क्वचित् तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ १७॥ यद्ब्रह्माहमिति स्फुटं
    तनुजगज्जीवेशभावा इमे पुंस्त्रीपुत्रहृदिन्द्रियाणि च पुनर्भोक्ता च भोगादयः । देवाः प्रेतगणाश्च तिर्यगथवा
    यस्मिन् खपुष्पायते तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ १८॥ यत्पूर्णं स्वत एव निर्मलमहो
    स्वानन्दमात्रं परं तस्मिन्सर्वविभासके स्फुटतरे भिन्नस्य यत्सर्जने । यस्येच्छा न च हैतुकं जगदहो जायेत
    यस्मिन् क्वचित् तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ १९॥ माया नापि तदुत्थितं च जगतः
    सङ्कल्पनं नैव च नैव स्यात्प्रकृतिः पुमानपि च तद्योगो जगत्सर्जने । विद्यापुरुषश्च योषिदुत तद्योगश्च
    पुत्रोद्भवः तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ २०॥ ज्ञेयं नैव यदस्ति चिघनशिवे द्वैतं
    कुतो भाव्यते सर्वज्ञः परमेश्वरोऽपि न तथा किञ्चिज्ज्ञजीवस्ततः । यस्मिन्सर्वमपीति किञ्चिदथवा ज्ञेयं
    न वेत्तुं क्वचित् तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ २१॥ माया चेदिह वाऽऽवृणोति
    किमिदं शक्यं जडायां भवेत् तस्माच्चेतयते च सा यदि तया किं छाद्यते ब्रह्म तत् । यन्नैवाऽव्रियते न कार्यमपि
    वा जायेत यस्मिन् क्वचित् तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ २२॥ भिन्नेयं न च वास्ति
    सा यदि भवेद्भिन्ना न माया क्वचित् भिन्नेयं च यदा भवेत्तदपि नो माया भवेद्वास्तवी । सद्ब्रह्मेति च शासनाद्भवति
    या भिन्ना सती यत्र तु तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ २३॥ भावो नाप्यसतः सतोऽपि
    न तथा भावः क्वचिद्वर्ण्यते माया नापि ततो न कार्यमिति वा मन्तुं क्वचिच्छिष्यते । पश्येन्नैव कदापि केन
    यदि वा श्रुत्यक्षरं यत्स्फुटं तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ २४॥ जाड्यं दुःखमथामृतत्वमिति
    यत्सम्बाध्यते सज्जने सच्चित्सौख्यमिति स्फुटं परमहो ब्रह्माद्वयं शाश्वतम् । आनन्दैकरसाद्वयेऽपरमिदं
    दुःखादिकं नो यतः तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ २५॥ सूक्ष्मस्थूलतयापि भूम्नि
    जगतोऽस्तित्वं न सत्यं भवेत् तच्छक्तेरपि वा भवेद्यदि तदा शक्तिर्न भिन्ना क्वचित् । भिन्नं कार्यमितो
    यतो न हि भवेद्यच्चाद्वयं शाश्वतं तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ २६॥ भिन्ना
    सापि च कापि शक्तिरथवा भिन्ना न वक्तुं भवेत् तस्माद्भिन्नविभासकर्मकुशलाऽनिर्वाच्यभावा यदि । मिथ्यैवेयमिति
    स्फुटं यदि न सा यस्मिन्नसङ्गेऽद्वये तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ २७॥ माया
    काऽपि च वा भवेद्भवतु तत्कार्यं च तस्या अपि सत्यं ज्ञानमनन्तमद्वयमहो स्वस्माद्विविच्यादिशेत् । तन्मत्वा
    विमुखेन पश्यति कदा मायां च यस्मिन् परे तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ २८॥ दुःखान्तं
    किल जीवितं क्षणसुखं दोषैरनेकैर्वृतं योगो यन्नरकस्य तद्रतिरसः कस्मै सुखायोद्भवेत् । सर्वं दुःखमिदं
    विमोहकमतो यन्मायिकं विस्फुटं तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ २९॥ तुच्छा दुःखमयी
    ह्यसत्यपि च सा दुर्लङ्घनीया यदि मामेवेह भवेत्प्रपन्न इति चेन्मायां तरेद्योवदत् । यं लब्ध्वा परमं स्वकं
    पुनरहो मायां न पश्येत्क्वचित् तद्विष्णोः परमं पदं श्रय इह स्वाराज्यसौख्याम्बुधिम् ॥ ३०॥ संसारार्तिहरं
    क्षिप्रं ज्ञानविज्ञानदायकम् । विष्णुस्तोत्रमिदं नित्यं पठन् स्वाराज्यमश्नुते ॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य
    सद्गुरु भगवान् श्रीधरस्वामीमहाराजविरचितं श्रीविष्णुस्तोत्रं सम्पूर्णम् । वैकुण्ठचतुर्दशी
