id: vsahasranev-2
category: sahasranama
name:
  english: vsahasranev
  devanagari: व्सहस्रनेव्
content:
  english: namami vishnum shirasa caturbhujam || 6|| chayayam parijatasya hemasimhasanopari asinamambudashyamamayatakshamalamkritam
    | candrananam caturbahum shrivatsankitavakshasam rukminisatyabhamabhyam sahitam krishnamashraye ||
    7|| stotram harih om | om vishvam vishnurvashatkaro bhutabhavyabhavatprabhuh | bhutakridbhutabhridbhavo
    bhutatma bhutabhavanah || 1|| putatma paramatma ca muktanam parama gatih | avyayah purushah sakshi
    kshetrajno'kshara eva ca || 2|| yogo yogavidam neta pradhanapurusheshvarah | narasimhavapuh shriman
    keshavah purushottamah || 3|| sarvah sharvah shivah sthanurbhutadirnidhiravyayah | sambhavo bhavano
    bharta prabhavah prabhurishvarah || 4|| svayambhuh shambhuradityah pushkaraksho mahasvanah | anadinidhano
    dhata vidhata dhaturuttamah || 5|| aprameyo hrishikeshah padmanabho'maraprabhuh | vishvakarma manustvashta
    sthavishthah sthaviro dhruvah || 6|| agrahyah shashvatah krishno lohitakshah pratardanah | prabhutastrikakubdhama
    pavitram mangalam param || 7|| ishanah pranadah prano jyeshthah shreshthah prajapatih | hiranyagarbho
    bhugarbho madhavo madhusudanah || 8|| ishvaro vikrami dhanvi medhavi vikramah kramah | anuttamo duradharshah
    kritajnah kritiratmavan || 9|| sureshah sharanam sharma vishvaretah prajabhavah | ahah samvatsaro
    vyalah pratyayah sarvadarshanah || 10|| ajah sarveshvarah siddhah siddhih sarvadiracyutah | vrishakapirameyatma
    sarvayogavinihsritah || 11|| vasurvasumanah satyah samatma'sammitah samah | amoghah pundarikaksho
    vrishakarma vrishakritih || 12|| rudro bahushira babhrurvishvayonih shucishravah | amritah shashvatasthanurvararoho
    mahatapah || 13|| sarvagah sarvavidbhanurvishvakseno janardanah | vedo vedavidavyango vedango vedavit
    kavih || 14|| lokadhyakshah suradhyaksho dharmadhyakshah kritakritah | caturatma caturvyuhashcaturdamshtrashcaturbhujah
    || 15|| bhrajishnurbhojanam bhokta sahishnurjagadadijah | anagho vijayo jeta vishvayonih punarvasuh
    || 16|| upendro vamanah pramshuramoghah shucirurjitah | atindrah sangrahah sargo dhritatma niyamo
    yamah || 17|| vedyo vaidyah sadayogi viraha madhavo madhuh | atindriyo mahamayo mahotsaho mahabalah
    || 18|| mahabuddhirmahaviryo mahashaktirmahadyutih | anirdeshyavapuh shrimanameyatma mahadridhrik
    || 19|| maheshvaso mahibharta shrinivasah satam gatih | aniruddhah suranando govindo govidam patih
    || 20|| maricirdamano hamsah suparno bhujagottamah | hiranyanabhah sutapah padmanabhah prajapatih
    || 21|| amrityuh sarvadrik simhah sandhata sandhiman sthirah | ajo durmarshanah shasta vishrutatma
    surariha || 22|| gururgurutamo dhama satyah satyaparakramah | nimisho'nimishah sragvi vacaspatirudaradhih
    || 23|| agranirgramanih shriman nyayo neta samiranah | sahasramurdha vishvatma sahasrakshah sahasrapat
    || 24|| avartano nivrittatma samvritah sampramardanah | ahah samvartako vahniranilo dharanidharah
    || 25|| suprasadah prasannatma vishvadhrigvishvabhugvibhuh | satkarta satkritah sadhurjahnurnarayano
    narah || 26|| asankhyeyo'prameyatma vishishtah shishtakricchucih | siddharthah siddhasankalpah siddhidah
    siddhisadhanah || 27|| vrishahi vrishabho vishnurvrishaparva vrishodarah | vardhano vardhamanashca
    viviktah shrutisagarah || 28|| subhujo durdharo vagmi mahendro vasudo vasuh | naikarupo brihadrupah
    shipivishtah prakashanah || 29|| ojastejodyutidharah prakashatma pratapanah | riddhah spashtaksharo
    mantrashcandramshurbhaskaradyutih || 30|| amritamshudbhavo bhanuh shashabinduh sureshvarah | aushadham
    jagatah setuh satyadharmaparakramah || 31|| bhutabhavyabhavannathah pavanah pavano'nalah | kamaha
    kamakritkantah kamah kamapradah prabhuh || 32|| yugadikridyugavarto naikamayo mahashanah | adrishyo
    vyaktarupashca sahasrajidanantajit || 33|| ishto'vishishtah shishteshtah shikhandi nahusho vrishah
    | krodhaha krodhakritkarta vishvabahurmahidharah || 34|| acyutah prathitah pranah pranado vasavanujah
    | apamnidhiradhishthanamapramattah pratishthitah || 35|| skandah skandadharo dhuryo varado vayuvahanah
    | vasudevo brihadbhanuradidevah purandarah || 36|| ashokastaranastarah shurah shaurirjaneshvarah |
    anukulah shatavartah padmi padmanibhekshanah || 37|| padmanabho'ravindakshah padmagarbhah sharirabhrit
    | maharddhirriddho vriddhatma mahaksho garudadhvajah || 38|| atulah sharabho bhimah samayajno havirharih
    | sarvalakshanalakshanyo lakshmivan samitinjayah || 39|| viksharo rohito margo heturdamodarah sahah
    | mahidharo mahabhago vegavanamitashanah || 40|| udbhavah kshobhano devah shrigarbhah parameshvarah
    | karanam karanam karta vikarta gahano guhah || 41|| vyavasayo vyavasthanah samsthanah sthanado dhruvah
    | pararddhih paramaspashtastushtah pushtah shubhekshanah || 42|| ramo viramo virajo margo neyo nayo'nayah
    |
  devanagari: नमामि विष्णुं शिरसा चतुर्भुजम् ॥ ६॥ छायायां पारिजातस्य हेमसिंहासनोपरि आसीनमम्बुदश्याममायताक्षमलंकृतम्
    । चन्द्राननं चतुर्बाहुं श्रीवत्साङ्कितवक्षसं रुक्मिणीसत्यभामाभ्यां सहितं कृष्णमाश्रये ॥ ७॥ स्तोत्रम्
    हरिः ॐ । ॐ विश्वं विष्णुर्वषट्कारो भूतभव्यभवत्प्रभुः । भूतकृद्भूतभृद्भावो भूतात्मा भूतभावनः ॥ १॥ पूतात्मा
    परमात्मा च मुक्तानां परमा गतिः । अव्ययः पुरुषः साक्षी क्षेत्रज्ञोऽक्षर एव च ॥ २॥ योगो योगविदां नेता
    प्रधानपुरुषेश्वरः । नारसिंहवपुः श्रीमान् केशवः पुरुषोत्तमः ॥ ३॥ सर्वः शर्वः शिवः स्थाणुर्भूतादिर्निधिरव्ययः
    । सम्भवो भावनो भर्ता प्रभवः प्रभुरीश्वरः ॥ ४॥ स्वयम्भूः शम्भुरादित्यः पुष्कराक्षो महास्वनः । अनादिनिधनो
    धाता विधाता धातुरुत्तमः ॥ ५॥ अप्रमेयो हृषीकेशः पद्मनाभोऽमरप्रभुः । विश्वकर्मा मनुस्त्वष्टा स्थविष्ठः
    स्थविरो ध्रुवः ॥ ६॥ अग्राह्यः शाश्वतः कृष्णो लोहिताक्षः प्रतर्दनः । प्रभूतस्त्रिककुब्धाम पवित्रं मङ्गलं
    परम् ॥ ७॥ ईशानः प्राणदः प्राणो ज्येष्ठः श्रेष्ठः प्रजापतिः । हिरण्यगर्भो भूगर्भो माधवो मधुसूदनः ॥
    ८॥ ईश्वरो विक्रमी धन्वी मेधावी विक्रमः क्रमः । अनुत्तमो दुराधर्षः कृतज्ञः कृतिरात्मवान् ॥ ९॥ सुरेशः
    शरणं शर्म विश्वरेताः प्रजाभवः । अहः संवत्सरो व्यालः प्रत्ययः सर्वदर्शनः ॥ १०॥ अजः सर्वेश्वरः सिद्धः
    सिद्धिः सर्वादिरच्युतः । वृषाकपिरमेयात्मा सर्वयोगविनिःसृतः ॥ ११॥ वसुर्वसुमनाः सत्यः समात्माऽसम्मितः
    समः । अमोघः पुण्डरीकाक्षो वृषकर्मा वृषाकृतिः ॥ १२॥ रुद्रो बहुशिरा बभ्रुर्विश्वयोनिः शुचिश्रवाः । अमृतः
    शाश्वतस्थाणुर्वरारोहो महातपाः ॥ १३॥ सर्वगः सर्वविद्भानुर्विष्वक्सेनो जनार्दनः । वेदो वेदविदव्यङ्गो
    वेदाङ्गो वेदवित् कविः ॥ १४॥ लोकाध्यक्षः सुराध्यक्षो धर्माध्यक्षः कृताकृतः । चतुरात्मा चतुर्व्यूहश्चतुर्दंष्ट्रश्चतुर्भुजः
    ॥ १५॥ भ्राजिष्णुर्भोजनं भोक्ता सहिष्णुर्जगदादिजः । अनघो विजयो जेता विश्वयोनिः पुनर्वसुः ॥ १६॥ उपेन्द्रो
    वामनः प्रांशुरमोघः शुचिरूर्जितः । अतीन्द्रः सङ्ग्रहः सर्गो धृतात्मा नियमो यमः ॥ १७॥ वेद्यो वैद्यः
    सदायोगी वीरहा माधवो मधुः । अतीन्द्रियो महामायो महोत्साहो महाबलः ॥ १८॥ महाबुद्धिर्महावीर्यो महाशक्तिर्महाद्युतिः
    । अनिर्देश्यवपुः श्रीमानमेयात्मा महाद्रिधृक् ॥ १९॥ महेष्वासो महीभर्ता श्रीनिवासः सतां गतिः । अनिरुद्धः
    सुरानन्दो गोविन्दो गोविदां पतिः ॥ २०॥ मरीचिर्दमनो हंसः सुपर्णो भुजगोत्तमः । हिरण्यनाभः सुतपाः पद्मनाभः
    प्रजापतिः ॥ २१॥ अमृत्युः सर्वदृक् सिंहः सन्धाता सन्धिमान् स्थिरः । अजो दुर्मर्षणः शास्ता विश्रुतात्मा
    सुरारिहा ॥ २२॥ गुरुर्गुरुतमो धाम सत्यः सत्यपराक्रमः । निमिषोऽनिमिषः स्रग्वी वाचस्पतिरुदारधीः ॥ २३॥
    अग्रणीर्ग्रामणीः श्रीमान् न्यायो नेता समीरणः । सहस्रमूर्धा विश्वात्मा सहस्राक्षः सहस्रपात् ॥ २४॥ आवर्तनो
    निवृत्तात्मा संवृतः सम्प्रमर्दनः । अहः संवर्तको वह्निरनिलो धरणीधरः ॥ २५॥ सुप्रसादः प्रसन्नात्मा विश्वधृग्विश्वभुग्विभुः
    । सत्कर्ता सत्कृतः साधुर्जह्नुर्नारायणो नरः ॥ २६॥ असङ्ख्येयोऽप्रमेयात्मा विशिष्टः शिष्टकृच्छुचिः ।
    सिद्धार्थः सिद्धसङ्कल्पः सिद्धिदः सिद्धिसाधनः ॥ २७॥ वृषाही वृषभो विष्णुर्वृषपर्वा वृषोदरः । वर्धनो
    वर्धमानश्च विविक्तः श्रुतिसागरः ॥ २८॥ सुभुजो दुर्धरो वाग्मी महेन्द्रो वसुदो वसुः । नैकरूपो बृहद्रूपः
    शिपिविष्टः प्रकाशनः ॥ २९॥ ओजस्तेजोद्युतिधरः प्रकाशात्मा प्रतापनः । ऋद्धः स्पष्टाक्षरो मन्त्रश्चन्द्रांशुर्भास्करद्युतिः
    ॥ ३०॥ अमृतांशूद्भवो भानुः शशबिन्दुः सुरेश्वरः । औषधं जगतः सेतुः सत्यधर्मपराक्रमः ॥ ३१॥ भूतभव्यभवन्नाथः
    पवनः पावनोऽनलः । कामहा कामकृत्कान्तः कामः कामप्रदः प्रभुः ॥ ३२॥ युगादिकृद्युगावर्तो नैकमायो महाशनः
    । अदृश्यो व्यक्तरूपश्च सहस्रजिदनन्तजित् ॥ ३३॥ इष्टोऽविशिष्टः शिष्टेष्टः शिखण्डी नहुषो वृषः । क्रोधहा
    क्रोधकृत्कर्ता विश्वबाहुर्महीधरः ॥ ३४॥ अच्युतः प्रथितः प्राणः प्राणदो वासवानुजः । अपांनिधिरधिष्ठानमप्रमत्तः
    प्रतिष्ठितः ॥ ३५॥ स्कन्दः स्कन्दधरो धुर्यो वरदो वायुवाहनः । वासुदेवो बृहद्भानुरादिदेवः पुरन्दरः ॥
    ३६॥ अशोकस्तारणस्तारः शूरः शौरिर्जनेश्वरः । अनुकूलः शतावर्तः पद्मी पद्मनिभेक्षणः ॥ ३७॥ पद्मनाभोऽरविन्दाक्षः
    पद्मगर्भः शरीरभृत् । महर्द्धिरृद्धो वृद्धात्मा महाक्षो गरुडध्वजः ॥ ३८॥ अतुलः शरभो भीमः समयज्ञो हविर्हरिः
    । सर्वलक्षणलक्षण्यो लक्ष्मीवान् समितिञ्जयः ॥ ३९॥ विक्षरो रोहितो मार्गो हेतुर्दामोदरः सहः । महीधरो
    महाभागो वेगवानमिताशनः ॥ ४०॥ उद्भवः क्षोभणो देवः श्रीगर्भः परमेश्वरः । करणं कारणं कर्ता विकर्ता गहनो
    गुहः ॥ ४१॥ व्यवसायो व्यवस्थानः संस्थानः स्थानदो ध्रुवः । परर्द्धिः परमस्पष्टस्तुष्टः पुष्टः शुभेक्षणः
    ॥ ४२॥ रामो विरामो विरजो मार्गो नेयो नयोऽनयः ।
