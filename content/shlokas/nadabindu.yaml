id: nadabindu
category: upanishad
name:
  english: nadabindu
  devanagari: नदबिन्दु
content:
  english: vairajatmopasanaya sanjatajnanavahnina | dagdhva karmatrayam yogi yatpadam yati tadbhaje ||
    om vanme manasi pratishthita | mano me vaci pratishtitam | aviravirma edhi | vedasya ma anisthah |
    shrutam me ma prahasih | anenadhitenahoratransandadhami | ritam vadishyami | satyam vadishyami | tanmamavatu
    | tadvaktaramavatu | avatu mamavatu vaktaram || om shantih shantih shantih || om akaro dakshinah paksha
    ukarastuttarah smritah | makaram pucchamityahurardhamatra tu mastakam || 1|| padadikam gunastasya
    shariram tattvamucyate | dharmo'sya dakshinashcakshuradharmo yo'parah smritah || 2|| bhurlokah padayostasya
    bhuvarlokastu januni | suvarlokah katideshe nabhideshe maharjagat || 3|| janolokastu hriddeshe kanthe
    lokastapastatah | bhruvorlalatamadhye tu satyaloko vyavasthitah || 4|| sahasrarnamativatra mantra
    esha pradarshitah | evametam samarudho hamsayogavicakshanah || 5|| na bhidyate karmacaraih papakotishatairapi
    | agneyi prathama matra vayavyesha tathapara || 6|| bhanumandalasamkasha bhavenmatra tathottara |
    parama cardhamatra ya varunim tam vidurbudhah || 7|| kalatraye'pi yatrema matra nunam pratishthitah
    | esha onkara akhyato dharanabhirnibodhata || 8|| ghoshini prathama matra vidyunmatra tatha'para |
    patangini tritiya syaccaturthi vayuvegini || 9|| pancami namadheya tu shashthi caindryabhidhiyate
    | saptami vaishnavi nama ashtami shankariti ca || 10|| navami mahati nama dhritistu dashami mata |
    ekadashi bhavennari brahmi tu dvadashi para || 11|| prathamayam tu matrayam yadi pranairviyujyate
    | bharate varsharajasau sarvabhaumah prajayate || 12|| dvitiyayam samutkranto bhavedyaksho mahatmavan
    | vidyadharastritiyayam gandharvastu caturthika || 13|| pancamyamatha matrayam yadi pranairviyujyate
    | ushitah saha devatvam somaloke mahiyate || 14|| shashthyamindrasya sayujyam saptamyam vaishnavam
    padam | ashtamyam vrajate rudram pashunam ca patim tatha || 15|| navamyam tu maharlokam dashamyam
    tu janam vrajet | ekadashyam tapolokam dvadashyam brahma shashvatam || 16|| tatah parataram shuddham
    vyapakam nirmalam shivam | sadoditam param brahma jyotishamudayo yatah || 17|| atindriyam gunatitam
    mano linam yada bhavet | anupamam shivam shantam yogayuktam sada vishet || 18|| tadyuktastanmayo jantuh
    shanairmuncetkalevaram | samsthito yogacarena sarvasangavivarjitah || 19|| tato vilinapasho'sau vimalah
    kamalaprabhuh | tenaiva brahmabhavena paramanandamashnute || 20|| atmanam satatam jnatva kalam naya
    mahamate | prarabdhamakhilam bhunjannodvegam kartumarhasi || 21|| utpanne tattvavijnane prarabdham
    naiva muncati | tattvajnanodayadurdhvam prarabdham naiva vidyate || 22|| dehadinamasattvattu yatha
    svapno vibodhatah | karma janmantariyam yatprarabdhamiti kirtitam || 23|| tattu janmantarabhavatpumso
    naivasti karhicit | svapnadeho yathadhyastastathaivayam hi dehakah || 24|| adhyastasya kuto janma
    janmabhave kutah sthitih | upadanam prapancasya mridbhandasyeva pashyati || 25|| ajnanam ceti vedantaistasminnashte
    kva vishvata | yatha rajjum parityajya sarpam grihnati vai bhramat || 26|| tadvatsatyamavijnaya jagatpashyati
    mudhadhih | rajjukhande parijnate sarparupam na tishthati || 27|| adhishthane tatha jnate prapance
    shunyatam gate | dehasyapi prapancatvatprarabdhavasthitih kritah || 28|| ajnanajanabodhartham prarabdhamiti
    cocyate | tatah kalavashadeva prarabdhe tu kshayam gate || 29|| brahmapranavasandhanam nado jyotirmayah
    shivah | svayamavirbhavedatma meghapayem'shumaniva || 30|| siddhasane sthito yogi mudram sandhaya
    vaishnavim | sha
  devanagari: वैराजात्मोपासनया सञ्जातज्ञानवह्निना । दग्ध्वा कर्मत्रयं योगी यत्पदं याति तद्भजे ॥ ॐ वाङ्मे
    मनसि प्रतिष्ठिता । मनो मे वाचि प्रतिष्टितम् । आविरावीर्म एधि । वेदस्य मा आणीस्थः । श्रुतं मे मा प्रहासीः
    । अनेनाधीतेनाहोरात्रान्सन्दधामि । ऋतं वदिष्यामि । सत्यं वदिष्यामि । तन्मामवतु । तद्वक्तारमवतु । अवतु
    मामवतु वक्तारम् ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ अकारो दक्षिणः पक्ष उकारस्तूत्तरः स्मृतः । मकारं पुच्छमित्याहुरर्धमात्रा
    तु मस्तकम् ॥ १॥ पादादिकं गुणास्तस्य शरीरं तत्त्वमुच्यते । धर्मोऽस्य दक्षिणश्चक्षुरधर्मो योऽपरः स्मृतः
    ॥ २॥ भूर्लोकः पादयोस्तस्य भुवर्लोकस्तु जानुनि । सुवर्लोकः कटीदेशे नाभिदेशे महर्जगत् ॥ ३॥ जनोलोकस्तु
    हृद्देशे कण्ठे लोकस्तपस्ततः । भ्रुवोर्ललाटमध्ये तु सत्यलोको व्यवस्थितः ॥ ४॥ सहस्रार्णमतीवात्र मन्त्र
    एष प्रदर्शितः । एवमेतां समारूढो हंसयोगविचक्षणः ॥ ५॥ न भिद्यते कर्मचारैः पापकोटिशतैरपि । आग्नेयी प्रथमा
    मात्रा वायव्येषा तथापरा ॥ ६॥ भानुमण्डलसंकाशा भवेन्मात्रा तथोत्तरा । परमा चार्धमात्रा या वारुणीं तां
    विदुर्बुधाः ॥ ७॥ कालत्रयेऽपि यत्रेमा मात्रा नूनं प्रतिष्ठिताः । एष ओङ्कार आख्यातो धारणाभिर्निबोधत
    ॥ ८॥ घोषिणी प्रथमा मात्रा विद्युन्मात्रा तथाऽपरा । पतङ्गिनी तृतीया स्याच्चतुर्थी वायुवेगिनी ॥ ९॥ पञ्चमी
    नामधेया तु षष्ठी चैन्द्र्यभिधीयते । सप्तमी वैष्णवी नाम अष्टमी शाङ्करीति च ॥ १०॥ नवमी महती नाम धृतिस्तु
    दशमी मता । एकादशी भवेन्नारी ब्राह्मी तु द्वादशी परा ॥ ११॥ प्रथमायां तु मात्रायां यदि प्राणैर्वियुज्यते
    । भरते वर्षराजासौ सार्वभौमः प्रजायते ॥ १२॥ द्वितीयायां समुत्क्रान्तो भवेद्यक्षो महात्मवान् । विद्याधरस्तृतीयायां
    गान्धर्वस्तु चतुर्थिका ॥ १३॥ पञ्चम्यामथ मात्रायां यदि प्राणैर्वियुज्यते । उषितः सह देवत्वं सोमलोके
    महीयते ॥ १४॥ षष्ठ्यामिन्द्रस्य सायुज्यं सप्तम्यां वैष्णवं पदम् । अष्टम्यां व्रजते रुद्रं पशूनां च
    पतिं तथा ॥ १५॥ नवम्यां तु महर्लोकं दशम्यां तु जनं व्रजेत् । एकादश्यां तपोलोकं द्वादश्यां ब्रह्म शाश्वतम्
    ॥ १६॥ ततः परतरं शुद्धं व्यापकं निर्मलं शिवम् । सदोदितं परं ब्रह्म ज्योतिषामुदयो यतः ॥ १७॥ अतीन्द्रियं
    गुणातीतं मनो लीनं यदा भवेत् । अनूपमं शिवं शान्तं योगयुक्तं सदा विशेत् ॥ १८॥ तद्युक्तस्तन्मयो जन्तुः
    शनैर्मुञ्चेत्कलेवरम् । संस्थितो योगचारेण सर्वसङ्गविवर्जितः ॥ १९॥ ततो विलीनपाशोऽसौ विमलः कमलाप्रभुः
    । तेनैव ब्रह्मभावेन परमानन्दमश्नुते ॥ २०॥ आत्मानं सततं ज्ञात्वा कालं नय महामते । प्रारब्धमखिलं भुञ्जन्नोद्वेगं
    कर्तुमर्हसि ॥ २१॥ उत्पन्ने तत्त्वविज्ञाने प्रारब्धं नैव मुञ्चति । तत्त्वज्ञानोदयादूर्ध्वं प्रारब्धं
    नैव विद्यते ॥ २२॥ देहादीनामसत्त्वात्तु यथा स्वप्नो विबोधतः । कर्म जन्मान्तरीयं यत्प्रारब्धमिति कीर्तितम्
    ॥ २३॥ तत्तु जन्मान्तराभावात्पुंसो नैवास्ति कर्हिचित् । स्वप्नदेहो यथाध्यस्तस्तथैवायं हि देहकः ॥ २४॥
    अध्यस्तस्य कुतो जन्म जन्माभावे कुतः स्थितिः । उपादानं प्रपञ्चस्य मृद्भाण्डस्येव पश्यति ॥ २५॥ अज्ञानं
    चेति वेदान्तैस्तस्मिन्नष्टे क्व विश्वता । यथा रज्जुं परित्यज्य सर्पं गृह्णाति वै भ्रमात् ॥ २६॥ तद्वत्सत्यमविज्ञाय
    जगत्पश्यति मूढधीः । रज्जुखण्डे परिज्ञाते सर्परूपं न तिष्ठति ॥ २७॥ अधिष्ठाने तथा ज्ञाते प्रपञ्चे शून्यतां
    गते । देहस्यापि प्रपञ्चत्वात्प्रारब्धावस्थितिः कृतः ॥ २८॥ अज्ञानजनबोधार्थं प्रारब्धमिति चोच्यते ।
    ततः कालवशादेव प्रारब्धे तु क्षयं गते ॥ २९॥ ब्रह्मप्रणवसन्धानं नादो ज्योतिर्मयः शिवः । स्वयमाविर्भवेदात्मा
    मेघापायेंऽशुमानिव ॥ ३०॥ सिद्धासने स्थितो योगी मुद्रां सन्धाय वैष्णवीम् । श
