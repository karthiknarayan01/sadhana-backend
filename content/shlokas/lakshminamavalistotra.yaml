id: lakshminamavalistotra
category: stotram
name:
  english: lakshminamavalistotra
  devanagari: लक्ष्मीनामावलीस्तोत्र
content:
  english: shrilakshminamavalistotram brahmi narayani shrishcakshari muktanita rama | brahmpriya ca kamala
    haripriya ca maniki || 1|| radha lakshmih paravidya rama shrih ca narayani | vidya sarasvati mata
    vaishnavi padmini sati || 2|| padma ca padmaja cabdhiputri rambha ca radhika | bhurlila sukhadalakshmih
    harini madhavishvari || 3|| gauri karshni krishnanarayani svaha svadha ratih | sampatsmridhdirvasudevi
    viraja ca hiranmayi | bhargavi shivarajni shrirama shrikantavallabha || 4|| || phala shruti || aitani
    lakshminamani sada pratah pathedhdiyah | sa putrapautradiyuktah shriyamapnotyanashinim || 1 || ||
    shrilakshminarayanasamhitayam shrilakshminamavalistotram ||
  devanagari: श्रीलक्ष्मीनामावलीस्तोत्रम् ब्राह्मी नारायणी श्रीश्चाक्षरी मुक्तानिता रमा । ब्रह्म्प्रिया
    च कमला हरिप्रिया च माणिकी ॥ १॥ राधा लक्ष्मीः पराविद्या रमा श्रीः च नारायणी । विद्या सरस्वती माता वैष्णवी
    पद्मिनि सती ॥ २॥ पद्मा च पद्मजा चाब्धिपुत्री रम्भा च राधिका । भूर्लीला सुखदालक्ष्मीः हरिणी माधवीश्वरि
    ॥ ३॥ गौरी कार्ष्णी कृष्णनारायणी स्वाहा स्वधा रतिः । सम्पत्स्मृध्दिर्वासुदेवी विरजा च हिरण्मयी । भार्गवी
    शिवराज्ञी श्रीरामा श्रीकान्तवल्लभा ॥ ४॥ ॥ फल श्रुति ॥ ऐतानि लक्ष्मीनामानि सदा प्रातः पठेध्दियः । स
    पुत्रपौत्रादियुक्तः श्रियमाप्नोत्यनाशिनीम् ॥ १ ॥ ॥ श्रीलक्ष्मीनारायणसंहितायां श्रीलक्ष्मीनामावलीस्तोत्रम्
    ॥
