id: sri-venkateswara-suprabhatam
category: stotram
name:
  english: Sri Venkateswara Suprabhatam
content:
  english: kausalya supraja rama purvasandhya pravartate | uttishtha narashardula kartavyam daivamahnikam
    || || uttishthottishtha govinda uttishtha garudadhvaja | uttishtha kamalakanta trailokyam mangalam
    kuru || || matassamasta jagatam madhukaitabhareh vakshoviharini manohara divyamurte | shrisvamini
    shritajanapriya danashile shri venkatesha dayite tava suprabhatam || || tava suprabhatamaravinda locane
    bhavatu prasannamukha candramandale | vidhi shankarendra vanitabhirarcite vrisha shailanatha dayite
    dayanidhe || || atryadi sapta rishayassamupasya sandhyam akasha sindhu kamalani manoharani | adaya
    padayuga marcayitum prapannah sheshadri shekhara vibho tava suprabhatam || || pancananabja bhava shanmukha
    vasavadyah traivikramadi caritam vibudhah stuvanti | bhashapatih pathati vasara shuddhi marat sheshadri
    shekhara vibho tava suprabhatam || praphulla sarasiruha narikela pugadrumadi sumanohara palikanam
    | avati mandamanilah sahadivya gandhaih sheshadri shekhara vibho tava suprabhatam || || unmilyanetra
    yugamuttama panjarasthah patravasishta kadali phala payasani | bhuktva salila matha keli shukah pathanti
    sheshadri shekhara vibho tava suprabhatam || || tantri prakarsha madhura svanaya vipancya gayatyananta
    caritam tava narado'pi | bhashasamagra masakrit karacararamyam sheshadri shekhara vibho tava suprabhatam
    || || bhringavali ca makaranda rasanu viddha jhunkaragita ninadaih sahasevanaya | niryatyupanta sarasi
    kamalodarebhyah sheshadri shekhara vibho tava suprabhatam || || yoshaganena varadadhni vimathyamane
    ghoshalayeshu dadhimanthana tivraghoshah | roshatkalim vidadhate kakubhashca kumbhah sheshadri shekhara
    vibho tava suprabhatam || || padmeshamitra shatapatra gatalivargah hartum shriyam kuvalayasya nijangalakshmyah
    | bheri ninadamiva bibhrati tivranadam sheshadri shekhara vibho tava suprabhatam || || shrimannabhishta
    varadakhila loka bandho shri shrinivasa jagadeka dayaika sindho | shri devata griha bhujantara divyamurte
    shri venkatacalapate tava suprabhatam || || shri svami pushkarinikaplava nirmalangah shreyarthino
    haravirinci sanandanadyah | dvare vasanti varavetra hatottamangah shri venkatacalapate tava suprabhatam
    || || shri sheshashaila garudacala venkatadri narayanadri vrishabhadri vrishadri mukhyam | akhyam
    tvadiya vasate ranisham vadanti shri venkatacalapate tava suprabhatam || || sevaparah shiva suresha
    krishanudharma raksho'mbunatha pavamana dhanadhi nathah | baddhanjali pravilasannija shirshadeshah
    shri venkatacalapate tava suprabhatam || || dhatishu te vihagaraja mrigadhiraja nagadhiraja gajaraja
    hayadhirajah | svasvadhikara mahimadhika marthayante shri venkatacalapate tava suprabhatam || || suryendu
    bhauma budhavakpati kavyashauri svarbhanuketu divishat pradhanah | tvaddasadasa caramavadhi dasadasah
    shri venkatacalapate tava suprabhatam || padadhuli bharita sphuritottamangah svargapavarga nirapeksha
    nijantarangah | kalpagamakalanaya''kulatam labhante shri venkatacalapate tava suprabhatam || || tvadgopuragra
    shikharani nirikshamanah svargapavarga padavim paramam shrayantah | martya manushya bhuvane matimashrayante
    shri venkatacalapate tava suprabhatam || || shri bhuminayaka dayadi gunamritabde devadideva jagadeka
    sharanyamurte | shrimannananta garudadibhi rarcitanghre shri venkatacalapate tava suprabhatam || ||
    shri padmanabha purushottama vasudeva vaikuntha madhava janardana cakrapane | shri vatsa cihna sharanagata
    parijata shri venkatacalapate tava suprabhatam || || kandarpa darpa hara sundara divya murte kanta
    kucamburuha kutmala loladrishte | kalyana nirmala gunakara divyakirte shri venkatacalapate tava suprabhatam
    || || minakrite kamathakola nrisimha varnin svamin parashvatha tapodhana ramacandra | sheshamsharama
    yadunandana kalkirupa shri venkatacalapate tava suprabhatam || || elalavanga ghanasara sugandhi tirtham
    divyam viyatsariti hemaghateshu purnam | dhritvadya vaidika shikhamanayah prahrishtah tishthanti venkatapate
    tava suprabhatam || || bhasvanudeti vikacani saroruhani sampurayanti ninadaih kakubho vihangah | shrivaishnavah
    satata marthita mangalaste dhamashrayanti tava venkata suprabhatam || ssamaharshayaste santassanandana
    mukhastvatha yogivaryah | dhamantike tava hi mangalavastuhastah shri venkatacalapate tava suprabhatam
    || || lakshminivasa niravadya gunaika sindho samsarasagara samuttaranaika seto | vedanta vedya nijavaibhava
    bhakta bhogya shri venkatacalapate tava suprabhatam || || ittham vrishacalapateriha suprabhatam ye
    manavah pratidinam pathitum pravrittah | tesham prabhata samaye smritirangabhajam prajnam parartha
    sulabham paramam prasute ||
  devanagari: कौसल्या सुप्रजा राम पूर्वासन्ध्या प्रवर्तते । उत्तिष्ठ नरशार्दूल कर्तव्यं दैवमाह्निकम् ॥
    ॥ उत्तिष्ठोत्तिष्ठ गोविन्द उत्तिष्ठ गरुडध्वज । उत्तिष्ठ कमलाकान्त त्रैलोक्यं मङ्गलं कुरु ॥ ॥ मातस्समस्त
    जगतां मधुकैटभारेः वक्षोविहारिणि मनोहर दिव्यमूर्ते । श्रीस्वामिनि श्रितजनप्रिय दानशीले श्री वेङ्कटेश
    दयिते तव सुप्रभातम् ॥ ॥ तव सुप्रभातमरविन्द लोचने भवतु प्रसन्नमुख चन्द्रमण्डले । विधि शङ्करेन्द्र वनिताभिरर्चिते
    वृष शैलनाथ दयिते दयानिधे ॥ ॥ अत्र्यादि सप्त ऋषयस्समुपास्य सन्ध्यां आकाश सिन्धु कमलानि मनोहराणि । आदाय
    पादयुग मर्चयितुं प्रपन्नाः शेषाद्रि शेखर विभो तव सुप्रभातम् ॥ ॥ पञ्चाननाब्ज भव षण्मुख वासवाद्याः त्रैविक्रमादि
    चरितं विबुधाः स्तुवन्ति । भाषापतिः पठति वासर शुद्धि मारात् शेषाद्रि शेखर विभो तव सुप्रभातम् ॥ प्रफुल्ल
    सरसीरुह नारिकेल पूगद्रुमादि सुमनोहर पालिकानाम् । आवाति मन्दमनिलः सहदिव्य गन्धैः शेषाद्रि शेखर विभो
    तव सुप्रभातम् ॥ ॥ उन्मील्यनेत्र युगमुत्तम पञ्जरस्थाः पात्रावसिष्ट कदली फल पायसानि । भुक्त्वा सलील
    मथ केलि शुकाः पठन्ति शेषाद्रि शेखर विभो तव सुप्रभातम् ॥ ॥ तन्त्री प्रकर्ष मधुर स्वनया विपञ्च्या गायत्यनन्त
    चरितं तव नारदोऽपि । भाषासमग्र मसकृत् करचाररम्यं शेषाद्रि शेखर विभो तव सुप्रभातम् ॥ ॥ भृङ्गावली च मकरन्द
    रसानु विद्ध झुङ्कारगीत निनदैः सहसेवनाय । निर्यात्युपान्त सरसी कमलोदरेभ्यः शेषाद्रि शेखर विभो तव सुप्रभातम्
    ॥ ॥ योषागणेन वरदध्नि विमथ्यमाने घोषालयेषु दधिमन्थन तीव्रघोषाः । रोषात्कलिं विदधते ककुभश्च कुम्भाः
    शेषाद्रि शेखर विभो तव सुप्रभातम् ॥ ॥ पद्मेशमित्र शतपत्र गतालिवर्गाः हर्तुं श्रियं कुवलयस्य निजाङ्गलक्ष्म्याः
    । भेरी निनादमिव बिभ्रति तीव्रनादम् शेषाद्रि शेखर विभो तव सुप्रभातम् ॥ ॥ श्रीमन्नभीष्ट वरदाखिल लोक
    बन्धो श्री श्रीनिवास जगदेक दयैक सिन्धो । श्री देवता गृह भुजान्तर दिव्यमूर्ते श्री वेङ्कटाचलपते तव
    सुप्रभातम् ॥ ॥ श्री स्वामि पुष्करिणिकाप्लव निर्मलाङ्गाः श्रेयार्थिनो हरविरिञ्चि सनन्दनाद्याः । द्वारे
    वसन्ति वरवेत्र हतोत्तमाङ्गाः श्री वेङ्कटाचलपते तव सुप्रभातम् ॥ ॥ श्री शेषशैल गरुडाचल वेङ्कटाद्रि नारायणाद्रि
    वृषभाद्रि वृषाद्रि मुख्याम् । आख्यां त्वदीय वसते रनिशं वदन्ति श्री वेङ्कटाचलपते तव सुप्रभातम् ॥ ॥
    सेवापराः शिव सुरेश कृशानुधर्म रक्षोऽम्बुनाथ पवमान धनाधि नाथाः । बद्धाञ्जलि प्रविलसन्निज शीर्षदेशाः
    श्री वेङ्कटाचलपते तव सुप्रभातम् ॥ ॥ धाटीषु ते विहगराज मृगाधिराज नागाधिराज गजराज हयाधिराजाः । स्वस्वाधिकार
    महिमाधिक मर्थयन्ते श्री वेङ्कटाचलपते तव सुप्रभातम् ॥ ॥ सूर्येन्दु भौम बुधवाक्पति काव्यशौरि स्वर्भानुकेतु
    दिविषत् प्रधानाः । त्वद्दासदास चरमावधि दासदासाः श्री वेङ्कटाचलपते तव सुप्रभातम् ॥ पादधूलि भरित स्फुरितोत्तमाङ्गाः
    स्वर्गापवर्ग निरपेक्ष निजान्तरङ्गाः । कल्पागमाकलनयाऽऽकुलतां लभन्ते श्री वेङ्कटाचलपते तव सुप्रभातम्
    ॥ ॥ त्वद्गोपुराग्र शिखराणि निरीक्षमाणाः स्वर्गापवर्ग पदवीं परमां श्रयन्तः । मर्त्या मनुष्य भुवने मतिमाश्रयन्ते
    श्री वेङ्कटाचलपते तव सुप्रभातम् ॥ ॥ श्री भूमिनायक दयादि गुणामृताब्दे देवादिदेव जगदेक शरण्यमूर्ते ।
    श्रीमन्ननन्त गरुडादिभि रर्चिताङ्घ्रे श्री वेङ्कटाचलपते तव सुप्रभातम् ॥ ॥ श्री पद्मनाभ पुरुषोत्तम वासुदेव
    वैकुण्ठ माधव जनार्दन चक्रपाणे । श्री वत्स चिह्न शरणागत पारिजात श्री वेङ्कटाचलपते तव सुप्रभातम् ॥ ॥
    कन्दर्प दर्प हर सुन्दर दिव्य मूर्ते कान्ता कुचाम्बुरुह कुट्मल लोलदृष्टे । कल्याण निर्मल गुणाकर दिव्यकीर्ते
    श्री वेङ्कटाचलपते तव सुप्रभातम् ॥ ॥ मीनाकृते कमठकोल नृसिंह वर्णिन् स्वामिन् परश्वथ तपोधन रामचन्द्र
    । शेषांशराम यदुनन्दन कल्किरूप श्री वेङ्कटाचलपते तव सुप्रभातम् ॥ ॥ एलालवङ्ग घनसार सुगन्धि तीर्थं दिव्यं
    वियत्सरिति हेमघटेषु पूर्णम् । धृत्वाद्य वैदिक शिखामणयः प्रहृष्टाः तिष्ठन्ति वेङ्कटपते तव सुप्रभातम्
    ॥ ॥ भास्वानुदेति विकचानि सरोरुहाणि सम्पूरयन्ति निनदैः ककुभो विहङ्गाः । श्रीवैष्णवाः सतत मर्थित मङ्गलास्ते
    धामाश्रयन्ति तव वेङ्कट सुप्रभातम् ॥ स्समहर्षयस्ते सन्तस्सनन्दन मुखास्त्वथ योगिवर्याः । धामान्तिके
    तव हि मङ्गलवस्तुहस्ताः श्री वेङ्कटाचलपते तव सुप्रभातम् ॥ ॥ लक्ष्मीनिवास निरवद्य गुणैक सिन्धो संसारसागर
    समुत्तरणैक सेतो । वेदान्त वेद्य निजवैभव भक्त भोग्य श्री वेङ्कटाचलपते तव सुप्रभातम् ॥ ॥ इत्थं वृषाचलपतेरिह
    सुप्रभातं ये मानवाः प्रतिदिनं पठितुं प्रवृत्ताः । तेषां प्रभात समये स्मृतिरङ्गभाजां प्रज्ञां परार्थ
    सुलभां परमां प्रसूते ॥
