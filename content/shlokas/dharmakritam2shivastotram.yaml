id: dharmakritam2shivastotram
category: stotram
name:
  english: dharmakritam2shivastotram
  devanagari: धर्मकृतं२शिवस्तोत्रम्
content:
  english: dharmakritam 2 shivastotram dharma uvaca | devadeva mahadeva dharmapala namo'stu te | srishtisthitivinashanam
    karta shambho tvameva hi || 32|| srishtau brahma sthitau vishnuh pralaye hararupadhrik | rajassattvatamobhishca
    trigunairagunah prabho || 33|| nistraigunyah shivah sakshatturyashca prakriteh parah | nirguno nirvikari
    tvam nanalilavisharadah || 34|| raksha raksha mahadeva papanmam dustaraditah | matpitayam tatha ceme
    bhratarah papabuddhayah || 35|| iti shivapurane rudrasamhitayam satikhande tritiyadhyayantargatam
    dharmakritam shivastotram samaptam | shivapurana | rudrasamhita | satikhanda | adhyaya 3
  devanagari: धर्मकृतं २ शिवस्तोत्रम् धर्म उवाच । देवदेव महादेव धर्मपाल नमोऽस्तु ते । सृष्टिस्थितिविनाशानां
    कर्ता शम्भो त्वमेव हि ॥ ३२॥ सृष्टौ ब्रह्मा स्थितौ विष्णुः प्रलये हररूपधृक् । रजस्सत्त्वतमोभिश्च त्रिगुणैरगुणः
    प्रभो ॥ ३३॥ निस्त्रैगुण्यः शिवः साक्षात्तुर्यश्च प्रकृतेः परः । निर्गुणो निर्विकारी त्वं नानालीलाविशारदः
    ॥ ३४॥ रक्ष रक्ष महादेव पापान्मां दुस्तरादितः । मत्पितायं तथा चेमे भ्रातरः पापबुद्धयः ॥ ३५॥ इति शिवपुराणे
    रुद्रसंहितायां सतीखण्डे तृतीयाध्यायान्तर्गतं धर्मकृतं शिवस्तोत्रं समाप्तम् । शिवपुराण । रुद्रसंहिता
    । सतीखण्ड । अध्याय ३
meaning: {}
