id: brahmalekhinisvarupavarnanastotram
category: stotram
name:
  english: brahmalekhinisvarupavarnanastotram
  devanagari: ब्रह्मलेखिनीस्वरूपवर्णनस्तोत्रम्
content:
  english: vidhatryai namah || atha shribrahmalekhini athava mahagayatri svarupavarnanastotram || padaravinda
    vinyasta nakhacandrikavirajita padangushthamandala lalatpavana nupura ninada dhvanita
  devanagari: विधात्र्यै नमः ॥ अथ श्रीब्रह्मलेखिनी अथवा महागायत्री स्वरूपवर्णनस्तोत्रम् ॥ पादारविन्द विन्यस्त
    नखचन्द्रिकाविराजित पादाङ्गुष्ठमण्डल ललत्पावन नूपुर निनाद ध्वनित
meaning: {}
