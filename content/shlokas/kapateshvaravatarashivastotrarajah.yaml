id: kapateshvaravatarashivastotrarajah
category: stotram
name:
  english: kapateshvaravatarashivastotrarajah
  devanagari: कपटेश्वरावतारशिवस्तोत्रराजः
content:
  english: kapateshvaravatarashivastotrarajah om vrikshairavritakayaya paraya paramatmane | nanarupaya
    devaya namastubhyam svayambhuve || 1|| shivaya shitikanthaya somasuryagnicakshushe | bhimaya bhimarupaya
    bhishanayamritaya ca || 2|| candaya candarudraya candashulagrapanaye | yogine brahmanishthaya sarvayudhadharaya
    ca || 3|| umayah svamine tubhyam pashunam pataye namah | rigyajuhsamamantranam trailokyapataye namah
    || 4|| candrasuryagnimarutamambhasam pataye namah | sitaya krishnavarnaya pitaya karburaya ca || 5||
    arunaya pishangaya sarvodbhavabhavaya ca | savrishayograkayaya somaya saguhaya ca || 6|| saganaya
    namastubhyam namaste'stu sanandine | gajendravaktrasahitasabhringintiye namah || 7|| vishvaih sadhyaih
    sutastvam hi brahmana keshavena ca | satatam stuyase devairrishibhirbhavitatmadhih || 8|| stutyanam
    gunasanghanam nanto'sti tava shankara | devanpitrii~shca devesha muninsiddhanprajapatin || 9|| niyunakshi
    sada deva sveshu sveshveva karmasu | yoginam yogayonistvam yogakarta ca shankara || 10|| dhruvo'vyayo
    hyajo nityah samharta bhutabhavanah | vishvarupo hyanantashca svanityo vrishavahanah || 11|| ajito
    hyaprameyashca lokalokaprakashakah | prabhurvarenyo bhagavanvarnashramavibhagavit || 12|| susukshmo
    hyavyayo vyapi bhavarnavatarirvibhuh | tvam na jananti ye mudha naite yanti param gatim || 13|| jayante
    ca mriyante ca karmabhirvivashikritah | jitakama jitakrodha jitadvandva jitendriyah || 14|| tvam jnatva
    dehino nityam gacchanti paramam gatim | tryambakastripureshanastripuraghno mahidharah || 15|| trilokapata
    parjanyah kalakamanganashanah | brahmavishnvindrarudranamanyesham caiva dehinam || 16|| samharakale
    devesha smritimakshipya tishthasi | dhyeyastvam yoganishthanam muninam bhavitatmanam || 17|| stutavantashca
    te sarve sarvaduhkhavinashanam | yoginam yogasiddhistvam yogasyotpattikarakah || 18|| tishtha me hridaye
    nityam viryatma surasattamah | cakshushorhridaye caiva bhruvormadhyagatastatha || 19|| nishkalam dhyayinastvam
    hi prapashyanti sadashivam | pancadha tvam sharireshu dehinam sampratishthasi || 20|| pranayamaih
    kshapayase kalmasham vishvasambhavam | brahmadinam ca devanamanyesham caiva dehinam || 21|| sukhasya
    data nanyo'sti iti me nishcita matih | asmakamapi devesha karmanyudvignacetasam | sharanam bhava bhitanam
    samsaradhvani vartatam || 22|| nanya gatirmahadeva vidyate sharanarthinam | muktva tadbhaktimishana
    shashankakritashekhara || 23|| tanubhirdharayasyeva jagatsthavarajangamam | nanyam pashyami devesha
    vyapinam sacaracaram || 24|| angushthaparvamatranam jatanam brahmatejasa | tapasa ca mahadevadvanchitamuttamam
    varam || 25|| samsararnavamagnanamicchatam vipulam yashah | asmakam devadevesha prasadam kartumarhasi
    || 26|| na jnanam na ca va dhyanam na tapo na ca vai kratuh | sarvabhavavihinanam sharanam tvam maheshvara
    || 27|| brahmavishvindragopta tvam brahmanyo brahmavittamah | brahmacari param patram nilagrivo guhashayah
    || 28|| phalashrutih | evam stuto mahadevo valakhilyairaharnisham | priyate sma mahadevah kapateshvaravigrahah
    || 29|| idam pauranikastotram valakhilyairvinirmitam | kapateshvaradevasya pratyaham yah pathennarah
    || 30|| tasya roga vinashyanti dhanadhanyadi vardhate | ayushca dirghatam yati santatishca pravardhate
    || 31|| bhuktimuktitvamabhyeti samsarashca vinashyati | sha
  devanagari: कपटेश्वरावतारशिवस्तोत्रराजः ॐ वृक्षैरावृतकायाय पराय परमात्मने । नानारूपाय देवाय नमस्तुभ्यं
    स्वयम्भुवे ॥ १॥ शिवाय शितिकण्ठाय सोमसूर्याग्निचक्षुषे । भीमाय भीमरूपाय भीषणायामृताय च ॥ २॥ चण्डाय
    चण्डरुद्राय चण्डशूलाग्रपाणये । योगिने ब्रह्मनिष्ठाय सर्वायुधधराय च ॥ ३॥ उमायाः स्वामिने तुभ्यं पशूनां
    पतये नमः । ऋग्यजुःसाममन्त्राणां त्रैलोक्यपतये नमः ॥ ४॥ चन्द्रसूर्याग्निमरुतामम्भसां पतये नमः । सिताय
    कृष्णवर्णाय पीताय कर्बुराय च ॥ ५॥ अरुणाय पिशङ्गाय सर्वोद्भवभवाय च । सवृषायोग्रकायाय सोमाय सगुहाय च
    ॥ ६॥ सगणाय नमस्तुभ्यं नमस्तेऽस्तु सनन्दिने । गजेन्द्रवक्त्रसहितसभृङ्गिन्टिये नमः ॥ ७॥ विश्वैः साध्यैः
    सुतस्त्वं हि ब्रह्मणा केशवेन च । सततं स्तूयसे देवैरृषिभिर्भावितात्मधिः ॥ ८॥ स्तुत्यानां गुणसङ्घानां
    नान्तोऽस्ति तव शङ्कर । देवान्पितृईँश्च देवेश मुनीन्सिद्धान्प्रजापतीन् ॥ ९॥ नियुनक्षि सदा देव स्वेषु
    स्वेष्वेव कर्मसु । योगिनां योगयोनिस्त्वं योगकर्ता च शङ्कर ॥ १०॥ ध्रुवोऽव्ययो ह्यजो नित्यः संहर्ता
    भूतभावनः । विश्वरूपो ह्यनन्तश्च स्वनित्यो वृषवाहनः ॥ ११॥ अजितो ह्यप्रमेयश्च लोकालोकप्रकाशकः । प्रभुर्वरेण्यो
    भगवान्वर्णाश्रमविभागवित् ॥ १२॥ सुसूक्ष्मो ह्यव्ययो व्यापी भवार्णवतरिर्विभुः । त्वां न जानन्ति ये मूढा
    नैते यान्ति परां गतिम् ॥ १३॥ जायन्ते च म्रियन्ते च कर्मभिर्विवशीकृताः । जितकामा जितक्रोधा जितद्वन्द्वा
    जितेन्द्रियाः ॥ १४॥ त्वां ज्ञात्वा देहिनो नित्यं गच्छन्ति परमां गतिम् । त्र्यम्बकस्त्रिपुरेशानस्त्रिपुरघ्नो
    महीधरः ॥ १५॥ त्रिलोकपाता पर्जन्यः कालकामाङ्गनाशनः । ब्रह्मविष्ण्विन्द्ररुद्राणामन्येषां चैव देहिनाम्
    ॥ १६॥ संहारकाले देवेश स्मृतिमाक्षिप्य तिष्ठसि । ध्येयस्त्वं योगनिष्ठानां मुनीनां भावितात्मनाम् ॥ १७॥
    स्तुतवन्तश्च ते सर्वे सर्वदुःखविनाशनम् । योगिनां योगसिद्धिस्त्वं योगस्योत्पत्तिकारकः ॥ १८॥ तिष्ठ मे
    हृदये नित्यं वीर्यात्मा सुरसत्तमः । चक्षुषोर्हृदये चैव भ्रुवोर्मध्यगतस्तथा ॥ १९॥ निष्कलं ध्यायिनस्त्वां
    हि प्रपश्यन्ति सदाशिवम् । पञ्चधा त्वं शरीरेषु देहिनां सम्प्रतिष्ठसि ॥ २०॥ प्राणायामैः क्षपयसे कल्मषं
    विश्वसम्भवम् । ब्रह्मादीनां च देवानामन्येषां चैव देहिनाम् ॥ २१॥ सुखस्य दाता नान्योऽस्ति इति मे निश्चिता
    मतिः । अस्माकमपि देवेश कर्मण्युद्विग्नचेतसाम् । शरणं भव भीतानां संसाराध्वनि वर्तताम् ॥ २२॥ नान्या
    गतिर्महादेव विद्यते शरणार्थिनाम् । मुक्त्वा तद्भक्तिमीशान शशाङ्ककृतशेखर ॥ २३॥ तनुभिर्धारयस्येव जगत्स्थावरजङ्गमम्
    । नान्यं पश्यामि देवेश व्यापिनं सचराचरम् ॥ २४॥ अङ्गुष्ठपर्वमात्राणां जातानां ब्रह्मतेजसा । तपसा च
    महादेवाद्वाञ्छितमुत्तमं वरम् ॥ २५॥ संसारार्णवमग्नानामिच्छतां विपुलं यशः । अस्माकं देवदेवेश प्रसादं
    कर्तुमर्हसि ॥ २६॥ न ज्ञानं न च वा ध्यानं न तपो न च वै क्रतुः । सर्वभावविहीनानां शरणं त्वं महेश्वर
    ॥ २७॥ ब्रह्मविष्विन्द्रगोप्ता त्वं ब्रह्मण्यो ब्रह्मवित्तमः । ब्रह्मचारी परं पात्रं नीलग्रीवो गुहाशयः
    ॥ २८॥ फलश्रुतिः । एवं स्तुतो महादेवो वालखिल्यैरहर्निशम् । प्रीयते स्म महादेवः कपटेश्वरविग्रहः ॥ २९॥
    इदं पौराणिकस्तोत्रं वालखिल्यैर्विनिर्मितम् । कपटेश्वरदेवस्य प्रत्यहं यः पठेन्नरः ॥ ३०॥ तस्य रोगा विनश्यन्ति
    धनधान्यादि वर्धते । आयुश्च दीर्घतां याति सन्ततिश्च प्रवर्धते ॥ ३१॥ भुक्तिमुक्तित्वमभ्येति संसारश्च
    विनश्यति । श
