id: indrakrishnastotra
category: stotram
name:
  english: indrakrishnastotra
  devanagari: इन्द्रक्रिश्नस्तोत्र
content:
  english: indrakritam shrikrishnastotram shriganeshaya namah || indra uvaca | aksharam paramam brahma
    jyotirupam sanatanam | gunatitam nirakaram svecchamayamanantajam || 1|| bhaktadhyanaya sevayai nanarupadharam
    varam | shuklaraktapitashyamam yuganukramanena ca || 2|| shuklatejahsvarupam ca satye satyasvarupinam
    | tretayam kunkumakaram jvalantam brahmatejasa || 3|| dvapare pitavarnam ca shobhitam pitavasasa |
    krishnavarnam kalau krishnam paripurnatamam prabhum || 4|| navadharadharotkrishtashyamasundaravigraham
    | nandaikanandanam vande yashodanandanam prabhum || 5|| gopikacetanaharam radhapranadhikam param |
    vinodamuralishabdam kurvantam kautukena ca || 6|| rupenapratimenaiva ratnabhushanabhushitam | kandarpakotisaundaryam
    vibhratam shantamishvaram || 7|| kridantam radhaya sardham vrindaranye ca kutracit | kritracinnirjane'ranye
    radhavakshahsthalasthitam || 8|| jalakridam prakurvantam radhaya saha kutracit | radhikakabaribharam
    kurvantam kutracidvane || 9|| kutracidradhikapade dattavantamalaktakam | radharcavitatambulam grihnantam
    kutracinmuda || 10|| pashyantam kutracidradham pashyantim vakracakshusha | dattavantam ca radhayai
    kritva malam ca kutracit || 11|| kutracidradhaya sardham gacchantam rasamandalam | radhadattam gale
    malam dhritavantam ca kutracit || 12|| sardham gopalikabhishca viharantam ca kutracit | radham grihitva
    gacchantam tam vihaya ca kutracit || 13|| viprapatnidattamannam bhuktavantam ca kutracit | bhuktavantam
    talaphalam balakaih saha kutracit || 14|| vastram gopalikanam ca harantam kutracinmuda | gavam ganam
    vyaharantam kutracidbalakaih saha || 15|| kaliyamurdhni padabjam dattavantam ca kutracit | vinodamuralishabdam
    kurvantam kutracinmuda || 16|| gayantam ramyasangitam kutracidbalakaih saha | stutva shakrah stavendrena
    prananama harim bhiya || 17|| pura dattena guruna rane vritrasurena ca | krishnena dattam kripaya
    brahmane ca tapasyate || 18|| ekadashaksharo mantrah kavacam sarvalakshanam | dattametatkumaraya pushkare
    brahmana pura || 19|| tena cangirase dattam gurave'ngirasa mune | idamindrakritam stotram nityam bhaktya
    ca yah pathet || 20|| iha prapya dridham bhaktimante dasyam labheddhruvam | janmamrityujaravyadhishokebhyo
    mucyate narah || 21|| na hi pashyati svapne'pi yamadutam yamalayam || 22|| || iti shribrahmavaivarte
    indrakritam shrikrishnastotram samaptam || iti brahmavaivartapurane shrikrishnajanmakhande ekavimshadhyayantargatam
    indrakritam shrikrishnastotram sampurnam | brahmavaivartapurana | shrikrishnajanma
  devanagari: इन्द्रकृतं श्रीकृष्णस्तोत्रम् श्रीगणेशाय नमः ॥ इन्द्र उवाच । अक्षरं परमं ब्रह्म ज्योतीरूपं
    सनातनम् । गुणातीतं निराकारं स्वेच्छामयमनन्तजम् ॥ १॥ भक्तध्यानाय सेवायै नानारूपधरं वरम् । शुक्लरक्तपीतश्यामं
    युगानुक्रमणेन च ॥ २॥ शुक्लतेजःस्वरूपं च सत्ये सत्यस्वरूपिणम् । त्रेतायां कुङ्कुमाकारं ज्वलन्तं ब्रह्मतेजसा
    ॥ ३॥ द्वापरे पीतवर्णं च शोभितं पीतवाससा । कृष्णवर्णं कलौ कृष्णं परिपूर्णतमं प्रभुम् ॥ ४॥ नवधाराधरोत्कृष्टश्यामसुन्दरविग्रहम्
    । नन्दैकनन्दनं वन्दे यशोदानन्दनं प्रभुम् ॥ ५॥ गोपिकाचेतनहरं राधाप्राणाधिकं परम् । विनोदमुरलीशब्दं
    कुर्वन्तं कौतुकेन च ॥ ६॥ रूपेणाप्रतिमेनैव रत्नभूषणभूषितम् । कन्दर्पकोटिसौन्दर्यं विभ्रतं शान्तमीश्वरम्
    ॥ ७॥ क्रीडन्तं राधया सार्धं वृन्दारण्ये च कुत्रचित् । कृत्रचिन्निर्जनेऽरण्ये राधावक्षःस्थलस्थितम्
    ॥ ८॥ जलक्रीडां प्रकुर्वन्तं राधया सह कुत्रचित् । राधिकाकबरीभारं कुर्वन्तं कुत्रचिद्वने ॥ ९॥ कुत्रचिद्राधिकापादे
    दत्तवन्तमलक्तकम् । राधार्चवितताम्बूलं गृह्णन्तं कुत्रचिन्मुदा ॥ १०॥ पश्यन्तं कुत्रचिद्राधां पश्यन्तीं
    वक्रचक्षुषा । दत्तवन्तं च राधायै कृत्वा मालां च कुत्रचित् ॥ ११॥ कुत्रचिद्राधया सार्धं गच्छन्तं रासमण्डलम्
    । राधादत्तां गले मालां धृतवन्तं च कुत्रचित् ॥ १२॥ सार्धं गोपालिकाभिश्च विहरन्तं च कुत्रचित् । राधां
    गृहीत्वा गच्छन्तं तां विहाय च कुत्रचित् ॥ १३॥ विप्रपत्नीदत्तमन्नं भुक्तवन्तं च कुत्रचित् । भुक्तवन्तं
    तालफलं बालकैः सह कुत्रचित् ॥ १४॥ वस्त्रं गोपालिकानां च हरन्तं कुत्रचिन्मुदा । गवां गणं व्याहरन्तं
    कुत्रचिद्बालकैः सह ॥ १५॥ कालीयमूर्ध्नि पादाब्जं दत्तवन्तं च कुत्रचित् । विनोदमुरलीशब्दं कुर्वन्तं
    कुत्रचिन्मुदा ॥ १६॥ गायन्तं रम्यसङ्गीतं कुत्रचिद्बालकैः सह । स्तुत्वा शक्रः स्तवेन्द्रेण प्रणनाम हरिं
    भिया ॥ १७॥ पुरा दत्तेन गुरुणा रणे वृत्रासुरेण च । कृष्णेन दत्तं कृपया ब्रह्मणे च तपस्यते ॥ १८॥ एकादशाक्षरो
    मन्त्रः कवचं सर्वलक्षणम् । दत्तमेतत्कुमाराय पुष्करे ब्रह्मणा पुरा ॥ १९॥ तेन चाङ्गिरसे दत्तं गुरवेऽङ्गिरसा
    मुने । इदमिन्द्रकृतं स्तोत्रं नित्यं भक्त्या च यः पठेत् ॥ २०॥ इह प्राप्य दृढां भक्तिमन्ते दास्यं लभेद्ध्रुवम्
    । जन्ममृत्युजराव्याधिशोकेभ्यो मुच्यते नरः ॥ २१॥ न हि पश्यति स्वप्नेऽपि यमदूतं यमालयम् ॥ २२॥ ॥ इति
    श्रीब्रह्मवैवर्ते इन्द्रकृतं श्रीकृष्णस्तोत्रं समाप्तम् ॥ इति ब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे
    एकविंशाध्यायान्तर्गतं इन्द्रकृतं श्रीकृष्णस्तोत्रं सम्पूर्णम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
