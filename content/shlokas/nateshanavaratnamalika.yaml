id: nateshanavaratnamalika
category: stotram
name:
  english: nateshanavaratnamalika
  devanagari: नटेशनवरत्नमालिका
content:
  english: manandatundilahrido munayo babhuvuh | taddarshayadya mama modamupaimi caham nishpakshapata
    bhavatassama eva sarvah || 4|| nandadayo'pi nataraja puralabhanta bhaktya padambujayuge tava bandhamokam
    | deyadya sa na kimu me karunamburashe ko va maya vyaraci tam vada te'paradhah || 5|| kasmannatesha
    kurushe na kripam mayi tvam kim va tvaya na vidito mama dinabhavah | janati no yadi bhavanmama dinatam
    tat shrutyuktamisha vitatham kimu sarvavittvam || 6|| samsrityudanvati natesha sada'pyagadhe magnam
    na mam ciramudasitumarhasi tvam | yadyapyaham tava cakara bahun hi mantun shambho tava'pi na hi tan
    ganayantarange || 7|| duhkhambudau patitamisha samuddharainam noceccharanya na hi me kshatirasti kapi
    | bhuyannimajjanamakirtipayonidhau te sarveshvarasya bhavato na hi yuktametat || 8| | padambujatayugalam
    tava yo bhajeta hantadhirohati hi tasya lalatamagnih | vakshasthalam vishadharo vishamuttamangam kanthanca
    parshvabhujamasya pishacavargah || 9|| tvamamananti natanatha padabjabhajam sarvarthadayinamaho nikhilashca
    vedah | tvam corayasyahaha shokamasheshamesham anyadrishi vilasatisha vadanyata te || 10|| sarveshvaro'pi
    nataraja digambarastvam vaho vrishastava girau shayanam pishacah | mitrani bhushanamaho bhujagashca
    bhasma bhikshamatasyapi ca nrityasi nityameva || 11|| tato bhavanmama tanubhava esha te'ham sarveshvaro'syahamapisha
    nitantadinah | etadrisham na kila mam parirakshasi tvam prematmajeshvasadrisham bhavato vibhasi ||
    12|| shrimannatesha
  devanagari: मानन्दतुन्दिलहृदो मुनयो बभूवुः । तद्दर्शयाद्य मम मोदमुपैमि चाहं निष्पक्षपात भवतस्सम एव सर्वः
    ॥ ४॥ नन्दादयोऽपि नटराज पुरालभन्त भक्त्या पदांबुजयुगे तव बन्धमोकम् । देयाद्य सा न किमु मे करुणांबुराशे
    को वा मया व्यरचि तं वद तेऽपराधः ॥ ५॥ कस्मान्नटेश कुरुषे न कृपां मयि त्वं किं वा त्वया न विदितो मम
    दीनभावः । जानाति नो यदि भवान्मम दीनतां तत् श्रुत्युक्तमीश वितथं किमु सर्ववित्त्वम् ॥ ६॥ संसृत्युदन्वति
    नटेश सदाऽप्यगाधे मग्नं न मां चिरमुदासितुमर्हसि त्वम् । यद्यप्यहं तव चकार बहून् हि मन्तून् शंभो तवाऽपि
    न हि तान् गणयान्तरङ्गे ॥ ७॥ दुःखांबुदौ पतितमीश समुद्धरैनं नोचेच्छरण्य न हि मे क्षतिरस्ति कापि । भूयान्निमज्जनमकीर्तिपयोनिधौ
    ते सर्वेश्वरस्य भवतो न हि युक्तमेतत् ॥ ८। । पादांबुजातयुगलं तव यो भजेत हन्ताधिरोहति हि तस्य ललाटमग्निः
    । वक्षस्थलं विषधरो विषमुत्तमाङ्गं कण्ठञ्च पार्श्वभुजमस्य पिशाचवर्गाः ॥ ९॥ त्वामामनन्ति नटनाथ पदाब्जभाजां
    सर्वार्थदायिनमहो निखिलाश्च वेदाः । त्वं चोरयस्यहह शोकमशेषमेषां अन्यादृशी विलसतीश वदान्यता ते ॥ १०॥
    सर्वेश्वरोऽपि नटराज दिगंबरस्त्वं वाहो वृषस्तव गिरौ शयनं पिशाचाः । मित्राणि भूषणमहो भुजगश्च भस्म भिक्षामटस्यपि
    च नृत्यसि नित्यमेव ॥ ११॥ तातो भवान्मम तनूभव एष तेऽहं सर्वेश्वरोऽस्यहमपीश नितान्तदीनः । एतादृशं न किल
    मां परिरक्षसि त्वं प्रेमात्मजेष्वसदृशं भवतो विभासि ॥ १२॥ श्रीमन्नटेश
