id: kyta-9-bhrugu-valli-krishna-yajurveda-taittiriya-aranyaka-patha-bhrugurvai-varunih
category: stotram
name:
  english: KYTA 9 Bhrugu Valli - Krishna Yajurveda Taittiriya Aranyaka Patha - Bhrugurvai Varunih
content:
  english: krishna yajurvediya taittiriya aranyake navamah prapathakah shri gurubhyo namah | harih om
    || bhrigu valli saha na vavatu | saha nau bhunaktu | saha virya nkaravavahai | tejasvina vadhitamastu
    ma vidvishavahai shshantih || anuvakam bhrigurvai varunih | varuna mupasasara | adhihi bhagavo brahmeti
    || tasma eta mmano vacamiti || tagm hovaca | yato va imani bhutani jayante | yena jatani jivanti |
    ya dbrahmeti || sa tapo mbrahmeti vyajanat | annaddhyeva khalvimani bhutani jayante | annena jatani
    jivanti | anna dvijnaya | punareva varuna mupasasara | adhihi bhagavo brahmeti | tagm hovaca | tapasa
    brahma vijijnasasva | tapo brahmeti | sa tapo || prano brahmeti vyajanat | pranaddhyeva khalvimani
    bhutani jayante | pranena jatani jivanti | prana dvijnaya | punareva varuna mupasasara | adhihi bhagavo
    brahmeti | tagm hovaca | tapasa brahma vijijnasasva | tapo brahmeti | sa tapo || mano brahmeti vyajanat
    | manaso hyeva khalvimani bhutani jayante | manasa jatani jivanti | manah prayantyabhi dvijnaya |
    punareva varuna mupasasara | adhihi bhagavo brahmeti | tagm hovaca | tapasa brahma vijijnasasva |
    tapo brahmeti | sa tapo mbrahmeti vyajanat | vijnana ddhyeva khalvimani bhutani jayante | vijnanena
    jatani jivanti | vijnana dvijnaya | punareva varuna mupasasara | adhihi bhagavo brahmeti | tagm hovaca
    | tapasa brahma vijijnasasva | tapo brahmeti | sa tapo || anando brahmeti vyajanat | ananda khalvimani
    bhutani jayante | anandena jatani jivanti | ananda vi~shantiti || saisha bha rgavi varuni vidya |
    parame vyoma npratishthita || ya evam ve~da pratitishthati | annavanannado bhavati | maha nbhavati
    prajaya pashubhi rbrahmavarcasena | mahan kirtya || dvratam || prano va anna m | shariramannadam |
    prane sharira mpratishthitam | sharire pranah pratishthitah | tadeta manne pratishthitam || sa ya
    eta manne pratishthitam ve~da pratitishthati | annava nannado bhavati | maha nbhavati prajaya pashubhi
    rbrahmavarcasena | mahan kirtya || dvratam | apo va anna m | jyotirannadam | aphsu jyotih pratishthitam
    | jyotishyapah pratishthitah | tadeta manne pratishthitam || sa ya eta manne pratishthitam ve~da pratitishthati
    | annava nannado bhavati | maha nbhavati prajaya pashubhi rbrahmavarcasena | mahan kirtya || dvratam
    || prithivi va anna 'nnadah | prithivya makashah pratishthitah | akashe prithivi pratishthita | tadeta
    manne pratishthitam || sa ya eta manne pratishthitam ve~da pratitishthati | annavanannado bhavati
    | maha nbhavati prajaya pashubhi rbrahmavarcasena | mahan kirtya || || na kancana vasatau pratyacakshita
    | ta dvratam || tasmadyaya kaya ca vidhaya bahvanna mprapnuyat || araddhyasma annamityacakshate ||
    etadvai mukhato 'nnagm raddham | mukhato 'sma annagm raddhyate | etadvai maddhyato 'nnagm raddham
    | maddhyato 'sma annagm raddhyate | edadva antato 'nnagm raddham | antato 'sma annagm raddhyate |
    || ve~da || kshema iti vaci | yogakshema iti pranapanayoh | karmeti hastayoh | gati riti padayoh |
    vimukti riti payau | iti manushi ssamajnah || atha daivih | tripti b || yasha iti pashushu | jyotiriti
    nakshatreshu | prajati mananda ityupasthe | sarva mityakashe || ta tyupasita | pratishthava nbhavati
    | tanmaha ityupasita | maha nbhavati | tanmana ityupasita | manava c || tannama ityupasita | namyante
    'smai kamah | tadbrahme tyupasita | brahmava dbrahmanah parimara ityupasita | paryena mmriyante dvishantah
    sapatnah | pari ye bhratrivyah || sa yashcaya mpurushe | yashcasa vaditye | sa ekah | || tpretya |
    etamannamaya mupasankramya | etam mupasankramya | eta manandamaya matmana mupasankramya | iman ~lokan
    kamanni kama rupyanusancarann | eta thsama gayannaste || ha mahamannam | ahamannado 'hamannadah |
    ahagg shlokakrit | ahamasmi prathamaja rita ndevebhyo amritasya na bha i | yo ma dadati sa ideva ma
    mabhyabhavam | suvarna jyotih ve~da || ityupanishat || || saha na vavatu | saha nau bhunaktu | saha
    virya nkaravavahai | tejasvina vadhitamastu ma vidvishavahai mbahukurvi taikadashaikadasha na kanca
    naikashashtirdasha || iti bhriguvalli samapta || nna nindyaccatushcatvarigmshat || harih om || ||
    krishna yajurvediya taittiriya aranyake navamah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय आरण्यके नवमः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ भृगु वल्ली
    स॒ह ना॑ ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै । ते॒ज॒स्विना॒ वधी॑तमस्तु॒ मा वि॑द्विषा॒वहै
    श्शान्तिः॑ ॥ अनुवाकं भृगु॒र्वै वा॑रु॒णिः । वरु॑ण॒ मुप॑ससार । अधी॑हि भगवो॒ ब्रह्मेति॑ ॥ तस्मा॑ ए॒त
    म्मनो॒ वाच॒मिति॑ ॥ तग्ं हो॑वाच । यतो॒ वा इ॒मानि॒ भूता॑नि॒ जाय॑न्ते । येन॒ जाता॑नि॒ जीव॑न्ति । य द्ब्रह्मेति॑
    ॥ स तपो॑ म्ब्रह्मेति॒ व्य॑जानात् । अ॒न्नाद्ध्ये॑व खल्वि॒मानि॒ भूता॑नि॒ जाय॑न्ते । अन्ने॑न॒ जाता॑नि॒
    जीव॑न्ति । अन्न॒ द्वि॒ज्ञाय॑ । पुन॑रे॒व वरु॑ण॒ मुप॑ससार । अधी॑हि भगवो॒ ब्रह्मेति॑ । तग्ं हो॑वाच ।
    तप॑सा॒ ब्रह्म॒ विजि॑ज्ञासस्व । तपो॒ ब्रह्मेति॑ । स तपो॑ ॥ प्रा॒णो ब्र॒ह्मेति॒ व्य॑जानात् । प्रा॒णाद्ध्ये॑व
    खल्वि॒मानि॒ भूता॑नि॒ जाय॑न्ते । प्रा॒णेन॒ जाता॑नि॒ जीव॑न्ति । प्रा॒ण द्वि॒ज्ञाय॑ । पुन॑रे॒व वरु॑ण॒
    मुप॑ससार । अधी॑हि भगवो॒ ब्रह्मेति॑ । तग्ं हो॑वाच । तप॑सा॒ ब्रह्म॒ विजि॑ज्ञासस्व । तपो॒ ब्रह्मेति॑
    । स तपो॑ ॥ मनो॒ ब्रह्मेति॒ व्य॑जानात् । मन॑सो॒ ह्ये॑व खल्वि॒मानि॒ भूता॑नि॒ जाय॑न्ते । मन॑सा॒ जाता॑नि॒
    जीव॑न्ति । मनः॒ प्रय॑न्त्य॒भि द्वि॒ज्ञाय॑ । पुन॑रे॒व वरु॑ण॒ मुप॑ससार । अधी॑हि भगवो॒ ब्रह्मेति॑ । तग्ं
    हो॑वाच । तप॑सा॒ ब्रह्म॒ विजि॑ज्ञासस्व । तपो॒ ब्रह्मेति॑ । स तपो॑ म्ब्रह्मेति॒ व्य॑जानात् । वि॒ज्ञाना॒
    द्ध्ये॑व खल्वि॒मानि॒ भूता॑नि॒ जाय॑न्ते । वि॒ज्ञाने॑न॒ जाता॑नि॒ जीव॑न्ति । वि॒ज्ञान॒ द्वि॒ज्ञाय॑ ।
    पुन॑रे॒व वरु॑ण॒ मुप॑ससार । अधी॑हि भगवो॒ ब्रह्मेति॑ । तग्ं हो॑वाच । तप॑सा॒ ब्रह्म॒ विजि॑ज्ञासस्व ।
    तपो॒ ब्रह्मेति॑ । स तपो॑ ॥ आ॒न॒न्दो ब्र॒ह्मेति॒ व्य॑जानात् । आ॒नन्दा॒ खल्वि॒मानि॒ भूता॑नि॒ जाय॑न्ते
    । आ॒न॒न्देन॒ जाता॑नि॒ जीव॑न्ति । आ॒न॒न्द विँ॑श॒न्तीति॑ ॥ सैषा भा र्ग॒वी वा॑रु॒णी वि॒द्या । प॒र॒मे
    व्यो॑म॒ न्प्रति॑ष्ठिता ॥ य ए॒वं वेँद॒ प्रति॑तिष्ठति । अन्न॑वानन्ना॒दो भ॑वति । म॒हा न्भ॑वति प्र॒जया॑
    प॒शुभि॑ र्ब्रह्मवर्च॒सेन॑ । म॒हान् की॒र्त्या ॥ द्व्र॒तम् ॥ प्रा॒णो वा अन्न म् । शरी॑रमन्ना॒दम् । प्रा॒णे
    शरी॑र॒ म्प्रति॑ष्ठितम् । शरी॑रे प्रा॒णः प्रति॑ष्ठितः । तदे॒त मन्ने॒ प्रति॑ष्ठितम् ॥ स य ए॒त मन्ने॒
    प्रति॑ष्ठितं॒ वेँद॒ प्रति॑तिष्ठति । अन्न॑वा नन्ना॒दो भ॑वति । म॒हा न्भ॑वति प्र॒जया॑ प॒शुभि॑ र्ब्रह्मवर्च॒सेन॑
    । म॒हान् की॒र्त्या ॥ द्व्र॒तम् । आपो॒ वा अन्न म् । ज्योति॑रन्ना॒दम् । अ॒फ्सु ज्योतिः॒ प्रति॑ष्ठितम्
    । ज्योति॒ष्यापः॒ प्रति॑ष्ठिताः । तदे॒त मन्ने॒ प्रति॑ष्ठितम् ॥ स य ए॒त मन्ने॒ प्रति॑ष्ठितं॒ वेँद॒ प्रति॑तिष्ठति
    । अन्न॑वा नन्ना॒दो भ॑वति । म॒हा न्भ॑वति प्र॒जया॑ प॒शुभि॑ र्ब्रह्मवर्च॒सेन॑ । म॒हान् कीर्त्या ॥ द्व्र॒तम्
    ॥ पृ॒थि॒वी वा अन्न ऽन्ना॒दः । पृ॒थि॒व्या मा॑का॒शः प्रति॑ष्ठितः । आ॒का॒शे पृ॑थि॒वी प्रति॑ष्ठिता । तदे॒त
    मन्ने॒ प्रति॑ष्ठितम् ॥ स य ए॒त मन्ने॒ प्रति॑ष्ठितं॒ वेँद॒ प्रति॑तिष्ठति । अन्न॑वानन्ना॒दो भ॑वति ।
    म॒हा न्भ॑वति प्र॒जया॑ प॒शुभि॑ र्ब्रह्मवर्च॒सेन॑ । म॒हान् की॒र्त्या ॥ ॥ न कञ्चन वसतौ प्रत्या॑चक्षी॒त
    । त द्व्र॒तम् ॥ तस्माद्यया कया च विधया बह्व॑न्न म्प्रा॒प्नुयात् ॥ अराद्ध्यस्मा अन्नमि॑त्याच॒क्षते
    ॥ एतद्वै मुखतो ऽन्नग्ं रा॒द्धम् । मुखतो ऽस्मा अ॑न्नग्ं रा॒द्ध्यते । एतद्वै मद्ध्यतो ऽन्नग्ं रा॒द्धम्
    । मद्ध्यतो ऽस्मा अ॑न्नग्ं रा॒द्ध्यते । एदद्वा अन्ततो ऽन्नग्ं रा॒द्धम् । अन्ततो ऽस्मा अ॑न्नग्ं रा॒द्ध्यते
    । ॥ वेँ॒द ॥ क्षेम इ॑ति वा॒चि । योगक्षेम इति प्रा॑णापा॒नयोः । कर्मे॑ति ह॒स्तयोः । गति रि॑ति पा॒दयोः
    । विमुक्ति रि॑ति पा॒यौ । इति मानुषी स्समा॒ज्ञाः ॥ अथ दै॒वीः । तृप्ति ब् ॥ यश इ॑ति प॒शुषु । ज्योतिरिति
    न॑क्षत्रे॒षु । प्रजाति मानन्द इ॑त्युप॒स्थे । सर्व मि॑त्याका॒शे ॥ त त्यु॑पासी॒त । प्रतिष्ठा॑वा न्भ॒वति
    । तन्मह इत्यु॑पासी॒त । म॑हा न्भ॒वति । तन्मन इत्यु॑पासी॒त । मान॑वा च् ॥ तन्नम इत्यु॑पासी॒त । नम्यन्ते
    ऽस्मै का॒माः । तद्ब्रह्मे त्यु॑पासी॒त । ब्रह्म॑वा द्ब्रह्मणः परिमर इत्यु॑पासी॒त । पर्येण म्म्रियन्ते
    द्विषन्तः॑ सप॒त्नाः । परि ये भ्रातृ॒व्याः ॥ स यश्चा॑य म्पु॒रुषे । यश्चासा॑ वादि॒त्ये । स एकः॑ । ॥
    त्प्रे॒त्य । एतमन्नमय मुप॑सङ्क्र॒म्य । एतं मुप॑सङ्क्र॒म्य । एत मानन्दमय मात्मान मुप॑सङ्क्र॒म्य । इमान्
    ँलोकान् कामान्नी काम रूप्य॑नुस॒ञ्चरन्न् । एत थ्साम गा॑यन्ना॒स्ते ॥ हा म॒हमन्नम् । अ॒हमन्ना॒दो ऽहमन्ना॒दः
    । अ॒हग्ग् श्लोक॒कृत् । अ॒हमस्मि प्रथमजा ऋता न्देवेभ्यो अमृतस्य ना भा॒ इ॒ । यो मा ददाति स इदेव मा मभ्य॑भ॒वाम्
    । सुव॒र्न ज्योतीः वेँद॑ ॥ इत्यु॑प॒निष॑त् ॥ ॥ स॒ह ना॑ ववतु । स॒ह नौ॑ भुनक्तु । स॒ह वी॒र्य॑ ङ्करवावहै
    । ते॒ज॒स्विना॒ वधी॑तमस्तु॒ मा वि॑द्विषा॒वहै म्ब॒हुकु॑र्वि॒ तैका॑दशैकादश॒ न कञ्च नैक॑षष्टि॒र्दश॑ ॥
    इति भृगुवल्ली समाप्ता ॥ न्न नि॑न्द्या॒च्चतु॑श्चत्वारिग्ंशत् ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय
    आरण्यके नवमः प्रपाठक
