id: sharabheshvarakavacam
category: kavacha
name:
  english: sharabheshvarakavacam
  devanagari: शरभेश्वरकवचम्
content:
  english: smararih patu me talveroshthayorbhaktavatsalah || 4|| jihvam mama sada patu sarvavidya pradayakah
    | patu mrityunjayo dantancibukam patu bhutarat || 5|| parameshah kapolau me trikam patu kapalabhrit
    | kantham pashupatih patu shuli patu hanu mama || 6|| skandhadvayam harah patu dhurjati patu me bhujau
    | bhujasandhim mahadeva ishano me prakupare || 7|| madhyasandhi jagannathah prakoshthe candrashekharah
    | manibandhau trinetro me bhimah patu karasthale || 8|| karaprishthe mridah patu rudro'gumshthadvaye
    mama | umasahayastarjanyau bhargo me patu madhyame || 9|| anamike karalasyah kalakanthah kanishthike
    | gangadharo'nguliparvanyaprameyo nakhani me || 10|| vakshastatpurushah patu kakshe dakshadhvarantakah
    | aghoro hridayam patu vamadeva stanadvayam || 11|| bhaladrik jatharam patu nabhim narayanapriyah
    | kukshau prajakarah patu kukshiparshve mahabalah || 12|| sadyojatah kati patu prishthabhagam tu bhairavah
    | mohanojaghanam patu gudam mama jitendriyah || 13|| urdhvareta lingadesham vrishanam vishvamohanah
    | urudvayam bhavah patu januyugmam bhavantakah || 14||
  devanagari: स्मरारिः पातु मे ताल्वेरोष्ठयोर्भक्तवत्सलः ॥ ४॥ जिह्वां मम सदा पातु सर्वविद्या प्रदायकः
    । पातु मृत्युञ्जयो दन्तान्चिबुकं पातु भूतराट् ॥ ५॥ परमेशः कपोलौ मे त्रिकं पातु कपालभृत् । कण्ठं पशुपतिः
    पातु शूली पातु हनू मम ॥ ६॥ स्कन्धद्वयं हरः पातु धूर्जटि पातु मे भुजौ । भुजसन्धिं महादेव ईशानो मे प्रकूपरे
    ॥ ७॥ मध्यसन्धी जगन्नाथः प्रकोष्ठे चन्द्रशेखरः । मणिबन्धौ त्रिनेत्रो मे भीमः पातु करस्थले ॥ ८॥ करपृष्ठे
    मृडः पातु रुद्रोऽगुंष्ठद्वये मम । उमासहायस्तर्जन्यौ भर्गो मे पातु मध्यमे ॥ ९॥ अनामिके करालास्यः कालकण्ठः
    कनिष्ठिके । गङ्गाधरोऽङ्गुलीपर्वाण्यप्रमेयो नखानि मे ॥ १०॥ वक्षस्तत्पुरुषः पातु कक्षे दक्षाध्वरान्तकः
    । अघोरो हृदयं पातु वामदेव स्तनद्वयम् ॥ ११॥ भालदृक् जठरं पातु नाभिं नारायणप्रियः । कुक्षौ प्रजाकरः
    पातु कुक्षिपार्श्वे महाबलः ॥ १२॥ सद्योजातः कटी पातु पृष्ठभागं तु भैरवः । मोहनोजघनं पातु गुदं मम जितेन्द्रियः
    ॥ १३॥ ऊर्ध्वरेता लिङ्गदेशं वृषणं विश्वमोहनः । ऊरूद्वयं भवः पातु जानुयुग्मं भवान्तकः ॥ १४॥
