id: gayatrikavacam-3
category: kavacha
name:
  english: gayatrikavacam 3
  devanagari: गायत्रीकवचम् ३
content:
  english: dharmarthakamamokshartham jape viniyogah || om bhurbhuvahsvah tatsaviturvarenyam bhargo devasya
    dhimahi | dhiyo yo nah pracodayat | kamakrodhadikam sarvam smaranadyati duratah | idam kavacamajnatva
    brahmavidyam japedyadi || 20|| shatakotijapenapi na siddhirjayate priye | gayatrikavacatsarvam smaranatsidhyati
    dhruvam || 21|| pathitva kavacam vipro gayatrim sakriduccaret | sarvapapavinirmukto jivanmukto bhavedvijah
    || 22|| idam kavacamajnatva tvanyadyah kavacam pathet | sarvam tasya vritha devi trailokyamangaladikam
    || 23|| gayatri kavacam yasya jihvayam vidyate sada | tada'mritamayi jihva pavitra japapujane || 24||
    idam kavacamajnatva brahmavidyam japedyadi | vyartham bhavati carvangi tajjapo vanarodanam || 25||
    brahmahatya surapanam steyam gurvanganagamah | mahanti patakanyasya smaranadyanti duratah || 26||
    nashvaram mamsamedo'sthimajjashukravinirmitam || 27|| vatapittakaphairyuktam sthuladeham taducyate
    | sukshmam jyotirmayam deham pancabhutatmakam viduh || 28|| mahapadmavanantastham sarvavayavasamyutam
    | adharadehasambandhadgayatri brahmanah svayam || 29|| etadeva param brahma kathite ubhayatmake |
    brahmanasyaiva jivatma gayatrisahito vapuh || 30|| atmanam hridayambhoje pradipakalikopamam | nirdhumam
    ca yatha jyotistailagnivartiyogatah || 31|| tajjyotih paramam brahma shubhadam natra samshayah | gayatrikavacam
    nyasam matrikasthanasandhishu || 32|| sa kritva brahmanashreshtha canyanyasam samacaret | anyanyase
    tatha siddhiranyathaya'ranyarodanam || 33|| gayatrinyasamatrena parabrahmamayo dvijah | idam kavacamajnatva
    brahmacaryam karoti yah || 34|| brahmacaryam bhavedvyartham gayatrikavacam vina | kavacasya prasadena
    brahmano jvaladagnivat || 35|| kavacam parameshani srishtisthitilayatmakam | kavacam brahmana idam
    pratarutthaya yah pathet || 36|| gayatrim sa sakritsmritva japalakshaphalam bhavet | gayatrim dashadha
    japtva dashalakshaphalam bhavet || 37|| evam kramena gayatrim shatadha prajapedyadi | shatalakshaphalam
    prapya vihareddevavadbhuvi || 38 suryendorgrahane cedam pathitva kavacam dvijah | sakridyadi japedvidyam
    gayatrim paramaksharam || 39|| tatkshanattu bhavetsiddho brahmasayujyamapnuyat | idam kavakshamajnatva
    gayatrim prajapettu yah || 40|| japa eva vritha tasya nistejo na ca siddhidah | yah pathetkavacam
    devi satatam shivasannidhau || 41|| vishnudevasya kavacam prajapecchaktisannidhau | tejahpuncamayo
    viprastatkshanajjayate dhruvam || 42|| iti shrirudrayamale parvatishvarasamvade gayatrikavacam sampurnam
    ||
  devanagari: धर्मार्थकाममोक्षार्थं जपे विनियोगः ॥ ॐ भूर्भुवःस्वः तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि
    । धियो यो नः प्रचोदयात् । कामक्रोधादिकं सर्वं स्मरणाद्याति दूरतः । इदं कवचमज्ञात्वा ब्रह्मविद्यां
    जपेद्यदि ॥ २०॥ शतकोटिजपेनापि न सिद्धिर्जायते प्रिये । गायत्रीकवचात्सर्वं स्मरणात्सिध्यति ध्रुवम् ॥
    २१॥ पठित्वा कवचं विप्रो गायत्रीं सकृदुच्चरेत् । सर्वपापविनिर्मुक्तो जीवन्मुक्तो भवेद्विजः ॥ २२॥ इदं
    कवचमज्ञात्वा त्वन्यद्यः कवचं पठेत् । सर्वं तस्य वृथा देवि त्रैलोक्यमङ्गलादिकम् ॥ २३॥ गायत्री कवचं
    यस्य जिह्वायां विद्यते सदा । तदाऽमृतमयी जिह्वा पवित्रा जपपूजने ॥ २४॥ इदं कवचमज्ञात्वा ब्रह्मविद्यां
    जपेद्यदि । व्यर्थं भवति चार्वङ्गि तज्जपो वनरोदनम् ॥ २५॥ ब्रह्महत्या सुरापानं स्तेयं गुर्वङ्गनागमः
    । महान्ति पातकान्यस्य स्मरणाद्यान्ति दूरतः ॥ २६॥ नश्वरं मांसमेदोऽस्थिमज्जाशुक्रविनिर्मितम् ॥ २७॥ वातपित्तकफैर्युक्तं
    स्थूलदेहं तदुच्यते । सूक्ष्मं ज्योतिर्मयं देहं पञ्चभूतात्मकं विदुः ॥ २८॥ महापद्मवनान्तस्थं सर्वावयवसंयुतम्
    । आधारदेहसम्बन्धाद्गायत्री ब्रह्मणः स्वयम् ॥ २९॥ एतदेव परं ब्रह्म कथिते उभयात्मके । ब्राह्मणस्यैव
    जीवात्मा गायत्रीसहितो वपुः ॥ ३०॥ आत्मनां हृदयाम्भोजे प्रदीपकलिकोपमम् । निर्धूमं च यथा ज्योतिस्तैलाग्निवर्तियोगतः
    ॥ ३१॥ तज्ज्योतिः परमं ब्रह्म शुभदं नात्र संशयः । गायत्रीकवचं न्यासं मातृकास्थानसन्धिषु ॥ ३२॥ स कृत्वा
    ब्राह्मणश्रेष्ठ चान्यन्यासं समाचरेत् । अन्यन्यासे तथा सिद्धिरन्यथायाऽरण्यरोदनम् ॥ ३३॥ गायत्रीन्यासमात्रेण
    परब्रह्ममयो द्विजः । इदं कवचमज्ञात्वा ब्रह्मचर्यं करोति यः ॥ ३४॥ ब्रह्मचर्यं भवेद्व्यर्थं गायत्रीकवचं
    विना । कवचस्य प्रसादेन ब्राह्मणो ज्वलदग्निवत् ॥ ३५॥ कवचं परमेशानि सृष्टिस्थितिलयात्मकम् । कवचं ब्राह्मण
    इदं प्रातरुत्थाय यः पठेत् ॥ ३६॥ गायत्रीं स सकृत्स्मृत्वा जपलक्षफलं भवेत् । गायत्रीं दशधा जप्त्वा दशलक्षफलं
    भवेत् ॥ ३७॥ एवं क्रमेण गायत्रीं शतधा प्रजपेद्यदि । शतलक्षफलं प्राप्य विहरेद्देववद्भुवि ॥ ३८ सूर्येन्दोर्ग्रहणे
    चेदं पठित्वा कवचं द्विजः । सकृद्यदि जपेद्विद्यां गायत्रीं परमाक्षराम् ॥ ३९॥ तत्क्षणात्तु भवेत्सिद्धो
    ब्रह्मसायुज्यमाप्नुयात् । इदं कवक्षमज्ञात्वा गायत्रीं प्रजपेत्तु यः ॥ ४०॥ जप एव वृथा तस्य निस्तेजो
    न च सिद्धिदः । यः पठेत्कवचं देवि सततं शिवसन्निधौ ॥ ४१॥ विष्णुदेवस्य कवचं प्रजपेच्छक्तिसन्निधौ । तेजःपुञ्चमयो
    विप्रस्तत्क्षणाज्जायते ध्रुवम् ॥ ४२॥ इति श्रीरुद्रयामले पार्वतीश्वरसंवादे गायत्रीकवचं सम्पूर्णम् ॥
