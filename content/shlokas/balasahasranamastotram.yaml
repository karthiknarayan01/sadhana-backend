id: balasahasranamastotram
category: sahasranama
name:
  english: balasahasranamastotram
  devanagari: बालासहस्रनामस्तोत्रम्
content:
  english: aimkarasanagarbhitanalashikham sauh klim kalam bibhratim sauvarnambaradharinim varasudhadhautantarangojjvalam
    | vande pustakapashasankushajapasragbhasurodyatkaram tam balam tripuram bhaje trinayanam shatcakrasancarinim
    || 4|| lamityadi pancapuja | stotraprarambhah om subhaga sundari saumya sushumna sukhadayini | manojna
    sumana ramya shobhana lalita shiva || 5|| kanta kantimati kantih kamada kamalalaya | kalyani kamala
    hridya peshala hridayangama || 6|| subhadrakhyatiramani sarva sadhvi sumangala | rama bhavyavati bhavya
    kamaniya'tikomala || 7|| shobhabhirama ramani ramaniya ratipriya | manonmani mahamaya matangi madirapriya
    || 8|| mahalakshmirmahashaktirmahavidyasvarupini | maheshvari mahananda mahanandavidhayini || 9||
    manini madhavi madhvi madarupa madotkata | anandakanda vijaya vishveshi vishvarupini || 10|| suprabha
    kaumudi kanta bindunadasvarupini | kameshvari kamakala kamini kamavardhini || 11|| bherunda candika
    candi camundi mundamalini | anurupa maharupa bhuteshi bhuvaneshvari || 12|| citra vicitra citrangi
    hemagarbhasvarupini | caitanyarupini nitya nityanityasvarupini || 13|| hrinkari kundali dhatri vidhatri
    bhutasamplava |
  devanagari: ऐंकारासनगर्भितानलशिखां सौः क्लीं कलां बिभ्रतीं सौवर्णाम्बरधारिणीं वरसुधाधौतान्तरङ्गोज्ज्वलाम्
    । वन्दे पुस्तकपाशसाङ्कुशजपस्रग्भासुरोद्यत्करां तां बालां त्रिपुरां भजे त्रिनयनां षट्चक्रसञ्चारिणीम्
    ॥ ४॥ लमित्यादि पञ्चपूजा । स्तोत्रप्रारम्भः ओं सुभगा सुन्दरी सौम्या सुषुम्ना सुखदायिनी । मनोज्ञा सुमना
    रम्या शोभना ललिता शिवा ॥ ५॥ कान्ता कान्तिमती कान्तिः कामदा कमलालया । कल्याणी कमला हृद्या पेशला हृदयङ्गमा
    ॥ ६॥ सुभद्राख्यातिरमणी सर्वा साध्वी सुमङ्गला । रामा भव्यवती भव्या कमनीयाऽतिकोमला ॥ ७॥ शोभाभिरामा रमणी
    रमणीया रतिप्रिया । मनोन्मनी महामाया मातङ्गी मदिराप्रिया ॥ ८॥ महालक्ष्मीर्महाशक्तिर्महाविद्यास्वरूपिणी
    । महेश्वरी महानन्दा महानन्दविधायिनी ॥ ९॥ मानिनी माधवी माध्वी मदरूपा मदोत्कटा । आनन्दकन्दा विजया विश्वेशी
    विश्वरूपिणी ॥ १०॥ सुप्रभा कौमुदी कान्ता बिन्दुनादस्वरूपिणी । कामेश्वरी कामकला कामिनी कामवर्धिनी ॥
    ११॥ भेरुण्डा चण्डिका चण्डी चामुण्डी मुण्डमालिनी । अणुरूपा महारूपा भूतेशी भुवनेश्वरी ॥ १२॥ चित्रा विचित्रा
    चित्राङ्गी हेमगर्भस्वरूपिणी । चैतन्यरूपिणी नित्या नित्यानित्यस्वरूपिणी ॥ १३॥ ह्रीङ्कारी कुन्डली धात्री
    विधात्री भूतसम्प्लवा ।
