id: radhasahasranamastotram-1-2
category: sahasranama
name:
  english: radhasahasranamastotram 1
  devanagari: राधासहस्रनामस्तोत्रम् १
content:
  english: radha gokulanandadayini || 31|| govindavallabhadevi gopini gunasagara | gopalavallabha gopi
    gaurangi godhaneshvari || 32|| gopali gopikashreshtha gopakanya ganeshvari | gajendragaminiganya gandharvakulapavani
    || 33|| gunadhyaksha ganadhyaksha gavongati gunakara | gunagamya grihalakshmi gopyecudagramalika |||
    34|| gangagitagatirdatri gayatri brahmarupini | gandhapushpadharadevi gandhamalyadidharini || 35||
    govindapreyasi dhira govindabandhakarana | jnanadagunadagamya gopini gunashobhini || 36|| godavari
    gunatita govardhanadhanapriya | gopini gokulendrani gopika gunashalini || 37|| gandheshvari gunalamba
    gunangi gunapavani | gopalasya priyaradha kunjapunjaviharini || 38|| gokulendumukhi vrinda gopalapranavallabha
    | gopanganapriyaradha gaurangi gauravanvita || 39|| govatsadharinivatsa subalaveshadharini | girvanavandya
    girvani gopini ganashobhita || 40|| ghanashyamapriyadhira ghorasamsaratarini | ghurnayamananayana
    ghorakalmashanashini || 41|| caitanyarupinidevi cittacaitanyadayini | candranani candrakanti candrakotisamaprabha
    || 42|| candravali shuklapaksha candraca krishnavallabha | candrarkanakharajyoti caruvenishikharucih
    || 43|| candanaishcarcitangi ca caturacancalekshana | carugorocanagauri caturvargapradayini || 44||
    shrimaticaturadhyaksha caramagatidayini | caracareshvaridevi cintatita jaganmayi || 45|| catuhshashtikalalamba
    campapushpavidharini | cinmayi citshaktirupa carcitangi manorama || 46|| citralekhaca shriratri candrakantijitaprabha
    | caturapangamadhurya carucancalalocana || 47|| chandomayi chandarupa chidrachandovinashini | jagatkartri
    jagaddhatri jagadadhararupini || 48|| jayankari jaganmata jayadadiyakarini | jayapradajayalakshmi
    jayanti suyashaprada || 49|| jambunada hemakanti jayavati yashasvini | jagahita jagatpujya janani
    lokapalini || 50|| jagaddhatri jagatkartri jagadbijasvarupini | jaganmata yogamaya jivanam gatidayini
    || 51|| jivakritiryogagamya yashodanandadayini | japakusumasankasha padabjamanimandita || 52|| janudyutijitotphulla
    yantranavighnaghatini | jitendriya yajnarupa yajnangi jalashayini || 53|| janakijanmashunyaca janmamrityujarahara
    | jahnavi yamunarupa jambunadasvarupini || 54|| jhanatkritapadambhoja jadatarinivarini | tankarini
    mahadhyana divyavadyavinodini || 55|| taptakancanavarnabha trailokyalokatarini | tilapushpajitanasa
    tulasimanjaripriya || 56|| trailokya'karshini
  devanagari: राधा गोकुलानन्ददायिनी ॥ ३१॥ गोविन्दवल्लभादेवी गोपिनी गुणसागरा । गोपालवल्लभा गोपी गौराङ्गी
    गोधनेश्वरी ॥ ३२॥ गोपाली गोपिकाश्रेष्ठा गोपकन्या गणेश्वरी । गजेन्द्रगामिनीगन्या गन्धर्वकुलपावनी ॥ ३३॥
    गुणाध्यक्षा गणाध्यक्षा गवोन्गती गुणाकरा । गुणगम्या गृहलक्ष्मी गोप्येचूडाग्रमालिका ॥। ३४॥ गङ्गागीतागतिर्दात्री
    गायत्री ब्रह्मरूपिणी । गन्धपुष्पधरादेवी गन्धमाल्यादिधारिणी ॥ ३५॥ गोविन्दप्रेयसी धीरा गोविन्दबन्धकारणा
    । ज्ञानदागुणदागम्या गोपिनी गुणशोभिनी ॥ ३६॥ गोदावरी गुणातीता गोवर्धनधनप्रिया । गोपिनी गोकुलेन्द्राणी
    गोपिका गुणशालिनी ॥ ३७॥ गन्धेश्वरी गुणालम्बा गुणाङ्गी गुणपावनी । गोपालस्य प्रियाराधा कुञ्जपुञ्जविहारिणी
    ॥ ३८॥ गोकुलेन्दुमुखी वृन्दा गोपालप्राणवल्लभा । गोपाङ्गनाप्रियाराधा गौराङ्गी गौरवान्विता ॥ ३९॥ गोवत्सधारिणीवत्सा
    सुबलावेशधारिणी । गीर्वाणवन्द्या गीर्वाणी गोपिनी गणशोभिता ॥ ४०॥ घनश्यामप्रियाधीरा घोरसंसारतारिणी ।
    घूर्णायमाननयना घोरकल्मषनाशिनी ॥ ४१॥ चैतन्यरूपिणीदेवी चित्तचैतन्यदायिनी । चन्द्राननी चन्द्रकान्ती चन्द्रकोटिसमप्रभा
    ॥ ४२॥ चन्द्रावली शुक्लपक्षा चन्द्राच कृष्णवल्लभा । चन्द्रार्कनखरज्योती चारुवेणीशिखारुचिः ॥ ४३॥ चन्दनैश्चर्चिताङ्गी
    च चतुराचञ्चलेक्षणा । चारुगोरोचनागौरी चतुर्वर्गप्रदायिनी ॥ ४४॥ श्रीमतीचतुराध्यक्षा चरमागतिदायिनी ।
    चराचरेश्वरीदेवी चिन्तातीता जगन्मयी ॥ ४५॥ चतुःषष्टिकलालम्बा चम्पापुष्पविधारिणी । चिन्मयी चित्शक्तिरूपा
    चर्चिताङ्गी मनोरमा ॥ ४६॥ चित्रलेखाच श्रीरात्री चन्द्रकान्तिजितप्रभा । चतुरापाङ्गमाधुर्या चारुचञ्चललोचना
    ॥ ४७॥ छन्दोमयी छन्दरूपा छिद्रछन्दोविनाशिनी । जगत्कर्त्री जगद्धात्री जगदाधाररूपिणी ॥ ४८॥ जयङ्करी जगन्माता
    जयदादियकारिणी । जयप्रदाजयालक्ष्मी जयन्ती सुयशप्रदा ॥ ४९॥ जाम्बूनदा हेमकान्ती जयावती यशस्विनी । जगहिता
    जगत्पूज्या जननी लोकपालिनी ॥ ५०॥ जगद्धात्री जगत्कर्त्री जगद्बीजस्वरूपिणी । जगन्माता योगमाया जीवानां
    गतिदायिनी ॥ ५१॥ जीवाकृतिर्योगगम्या यशोदानन्ददायिनी । जपाकुसुमसङ्काशा पादाब्जामणिमण्डिता ॥ ५२॥ जानुद्युतिजितोत्फुल्ला
    यन्त्रणाविघ्नघातिनी । जितेन्द्रिया यज्ञरूपा यज्ञाङ्गी जलशायिनी ॥ ५३॥ जानकीजन्मशून्याच जन्ममृत्युजराहरा
    । जाह्नवी यमुनारूपा जाम्बूनदस्वरूपिणी ॥ ५४॥ झणत्कृतपदाम्भोजा जडतारिनिवारिणी । टङ्कारिणी महाध्याना
    दिव्यवाद्यविनोदिनी ॥ ५५॥ तप्तकाञ्चनवर्णाभा त्रैलोक्यलोकतारिणी । तिलपुष्पजितानासा तुलसीमञ्जरीप्रिया
    ॥ ५६॥ त्रैलोक्याऽकर्षिणी
