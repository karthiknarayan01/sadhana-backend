id: sri-gananatham-bhajamyaham
category: stotram
name:
  english: Sri Gananatham Bhajamyaham
content:
  english: adi pallavi shri gana natham bhajamyaham shrikaram cintitartha phaladam anupallavi shri guru
    guhagrajam agra pujyam shri kanthatmajam shrita samrajyam caranam ranjita nataka ranga toshanam shinjita
    vara mani subhashanam kunjara mukham tyagaraja poshanam
  devanagari: आदि पल्लवि श्री गण नाथं भजाम्यहं श्रीकरं चिन्तितार्थ फलदं अनुपल्लवि श्री गुरु गुहाग्रजं
    अग्र पूज्यं श्री कण्ठात्मजं श्रित साम्राज्यं चरनम् रञ्जित नाटक रङ्ग तोषणं शिञ्जित वर मणि सुभाषणं कुञ्जर
    मुखं त्यागराज पोषणं
meaning: {}
