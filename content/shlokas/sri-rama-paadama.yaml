id: sri-rama-paadama
category: stotram
name:
  english: Sri Rama Paadama
content:
  english: adi pallavi shri rama padama ni kripa calune cittaniki rave anupallavi varija bhava sanaka
    sanandana vasavadi naradulèlla pujince caranam darini shilayai tapamu talaka varamu kannirunu ralcaga
    shura ahalyanu juci brocitivi a riti dhanyu seyave tyagaraja geyama
  devanagari: आदि पल्लवि श्री राम पादमा नी कृप चालुने चित्तानिकि रावे अनुपल्लवि वारिज भव सनक सनन्दन वासवादि
    नारदुलॆल्ल पूजिञ्चे चरनम् दारिनि शिलयै तापमु तालक वारमु कन्नीरुनु राल्चग शूर अहल्यनु जूचि ब्रोचितिवि
    आ रीति धन्यु सेयवे त्यागराज गेयमा
meaning: {}
