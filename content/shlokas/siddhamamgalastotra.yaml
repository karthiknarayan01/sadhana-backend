id: siddhamamgalastotra
category: stotram
name:
  english: siddhamamgalastotra
  devanagari: सिद्धमंगलस्तोत्र
content:
  english: shrimadakhamda shri vijayibhava || 4 || savitra kathakacayana punyaphala bharavdaja rishi gotra
    sambhava | jaya vijayibhava
  devanagari: श्रीमदखंड श्री विजयीभव ।। ४ ।। सावित्र काठकचयन पुण्यफल भारव्दाज ऋषी गोत्र संभवा । जय विजयीभव
