id: dhritarashtrakritamshrikrishnastotram
category: stotram
name:
  english: dhritarashtrakritamshrikrishnastotram
  devanagari: धृतराष्ट्रकृतंश्रीकृष्णस्तोत्रम्
content:
  english: dhritarashtrakritam shrikrishnastotram rishim sanatanatamam vipashcitam vacah samudram kalasham
    yatinam | arishtanemim garudam suparnam patim prajanam bhuvanasya dhama || 5|| sahasrashirsham purusham
    puranamanadimadhyantamanantakirtim | shukrasya dhataramajam janitram param parebhyah sharanam prapadye
    || 6|| trailokyanirmanakaram janitram devasuranamatha nagarakshasam | naradhipanam vidusham pradhanamindranujam
    tam sharanam prapadye || 7|| iti mahabharate udyogaparvani 69 adhyayantargatam dhritarashtrakritam
    shrikrishnastotram sampurnam | mahabharata | udyogaparva | adhyaya 69
  devanagari: धृतराष्ट्रकृतं श्रीकृष्णस्तोत्रम् ऋषिं सनातनतमं विपश्चितं वाचः समुद्रं कलशं यतीनाम् । अरिष्टनेमिं
    गरुडं सुपर्णं पतिं प्रजानां भुवनस्य धाम ॥ ५॥ सहस्रशीर्षं पुरुषं पुराणमनादिमध्यान्तमनन्तकीर्तिम् ।
    शुक्रस्य धातारमजं जनित्रं परं परेभ्यः शरणं प्रपद्ये ॥ ६॥ त्रैलोक्यनिर्माणकरं जनित्रं देवासुराणामथ
    नागरक्षसाम् । नराधिपानां विदुषां प्रधानमिन्द्रानुजं तं शरणं प्रपद्ये ॥ ७॥ इति महाभारते उद्योगपर्वणि
    ६९ अध्यायान्तर्गतं धृतराष्ट्रकृतं श्रीकृष्णस्तोत्रं सम्पूर्णम् । महाभारत । उद्योगपर्व । अध्याय ६९
