id: guhyakalisahasranamastotram-mahakalasamhitayam
category: sahasranama
name:
  english: guhyakalisahasranamastotram (mahakalasamhitayam)
  devanagari: गुह्यकालीसहस्रनामस्तोत्रम् (महाकालसंहितायां)
content:
  english: ulkamukhi pherurava bhishana bhairavasana | kapalini kalaratrirgauri kankaladharini || 2||
    shmashanavasini pretasana raktodadhipriya | yogamata maharatrih pancakalanalasthita || 3|| rudrani
    raudrarupa ca rudhiradvipacarini | mundamaladhara candi balavarvarakuntala || 4|| medha mahadakini
    ca yogini yogivandita | kaulini kurukulla ca ghora pingajata jaya || 5|| savitri vedajanani gayatri
    gaganalaya | navapancamahacakranilaya darunasvana || 6|| ugra kapardigrihini jagadadya janashraya
    | kalakarni kundalini bhutapretaganadhipa || 7|| jalandhari masideha purnanandapatangini | palini
    pavakabhasa prasanna parameshvari || 8|| ratipriya rogahari nagahara nagatmaja | avyaya vitaraga ca
    bhavani bhutadharini || 9|| kadambini niladeha kali kadambaripriya | mananiya mahadevi mahamandalavartini
    || 10|| mahamamsashanishani cidrupa vagagocara | yajnambujamanadevi darvikaravibhushita || 11|| candamundapramathani
    khecari khecarodita | tamalashyamala tivra tapini tapanashini || 12|| mahamaya mahadamshtra mahoragavirajita
    | lambodari lolajata lakshmyalakshmipradayini || 13|| dhatri dharadharakara dhorani dhavanapriya |
    harajaya hararadhya harivaktra harishvari || 14|| vishveshvari vajranakhi svararoha balaprada | ghonaki
    gharghararava ghoraghaughapranashini || 15|| kalpantakarini bhima jvalamalinyavamaya | srishtih sthitih
    kshobhana ca karala caparajita || 16|| vajrahastanantashaktirvirupa ca parapara | brahmandamardini
    pradhvamsini lakshabhuja sati || 17|| vidyujjihva mahadamshtra chayadhvarasutadyahrit | mahakalagnimurtishca
    meghanada katankata || 18|| pradipta vishvarupa ca jivadatri janeshvari | sakshini sharvari shanta
    shamamargaprakashika || 19|| kshetrajna kshepani kshamya'kshata kshamodari kshitih | aprameya kulacarakartri
    kaulikapalini || 20|| mananiya manogamya menanandapradayini | siddhantakhaniradhyaksha mundini mandalapriya
    || 21|| bala ca yuvati vriddha vayotita balaprada | ratnamaladhara danta darvikaravirajita || 22||
    dharmamurtirdhvantarucirdharitri dhavanapriya | sankalpini kalpakari kalatita kalasvana || 23|| vasundhara
    bodhadatri varnini vanaranara | vidya vidyatmika vanya bandhani bandhanashini || 24|| geya jatajataramya
    jarati jahnavi jada | tarini tirtharupa ca tapaniya tanudari || 25|| tapatrayahara tapi tapasya tapasapriya
    | bhogibhushya bhogavati bhagini bhagamalini || 26|| bhaktilabhya bhavagamya bhutida bhavavallabha
    | svaharupa svadharupa vashatkarasvarupini || 27|| hanta kritirnamorupa yajnadiryajnasambhava | sphyasurpacamasakara
    sraksru vakritidharini || 28|| udgithahimkaradeha namah svastiprakashini | rigyajuh samarupa ca mantrabrahmanarupini
    || 29|| sarvashakhamayi kharva pivaryupanishadbudha | raudri mrityunjayacintamanirvaihayasi dhritih
    || 30|| tartiya hamsini candri tara traivikrami sthitih | yogini dakini dhara vaidyuti vinayaprada
    || 31|| upamshurmanasi vacya rocana rucidayini | satvakritistamorupa rajasi gunavarjita || 32|| adisargadikalinabhanavi
    nabhasi tatha | muladhara kundalini svadhipthanaparayana || 33|| manipurakavasa ca vishuddhanahata
    tatha | ajna prajna mahasamjna varvara vyomacarini || 34|| brihadrathantarakara jyeshtha catharvani
    tatha | prajapatya mahabrahmi humhunkara patangini || 35|| rakshasi danavi bhutih pishaci pratyanikara
    | udattapyanudatta ca svarita nihsvarapyaja || 36|| nishkala pushkala sadhvi sa nuta khandarupini
    | gudha purana carama pragbhavi vamani dhruva || 37|| kakimukhi sakala ca sthavara jangameshvari |
    ida ca pingala caiva sushumna dhyanagocara || 38|| sarga visarga dhamani kampini bandhani hita | sankocini
    bhasura ca nimna dripta prakashini || 39|| prabuddha kshepani kshipta purnalasya vilambita | aveshini
    gharghara ca ruksha klinna sarasvati || 40|| snigdha canda kuhuh pusha varana ca yashasvini | gandhari
    shankhini caiva hastijihva payasvini || 41|| vishvodaralambusha ca bibhra tejasvini sati | avyakta
    galani manda mudita cetanapi ca || 42|| dravani capala lamba bhramari madhumatyapi | dharma rasavaha
    candi sauviri kapila tatha || 43|| randottara karshini ca revati sumukhi nati | rajanyapyayani vishvaduta
    candra kapardini || 44|| nanda candravati maitri vishalapi ca mandavi | vicitra lohinikalpa sukalpa
    putanapi ca || 45|| dhorani dharani hela dhira vegavati jata | agnijvala ca surabhi vivarna krintani
    tatha || 46|| tapini tapini dhumra maricirjvalini rucih | tapasvini svapnavaha sammoha kotara cala
    || 47|| vikalpa lambika mula tandravatyapi ghantika | avigraha ca kaivalya turiya capunarbhava ||
    48|| vibhrantishca prashanta ca yoginih shrenyalakshita | nirvana svastika vriddhirnivrittishca mahodaya
    || 49|| bodhya'vidya ca tamisra vasana yogamedini | niranjana ca prakritih sattaravya paramarthiki
    || 50|| pratibimbanirabhasa sadasadrupadharini | upashanta ca caitanya kuta vijnanamayyapi || 51||
    shaktividya vasita ca modini muditanana | anaya pravaha vyadi sarvajna sharanaprada || 52|| varuni
    marjanibhasha pratima brihati khala | praticcha pramitih pritih kuhika tarpanapriya || 53|| svastika
    sarvatobhadra gayatri pranavatmika | savitri vedajanani nigamacarabodhini || 54|| vikarala karala
    ca jvalajalaikamalini | bhima ca kshobhanananta vira vajrayudha tatha || 55|| pradhvamsini ca malanka
    vishvamardinyavikshita | mrityuh sahasrabahushca ghoradamshtra valahaki || 56|| pinga pingashata dipta
    pracanda sarvatomukhi | vidarini vishvarupa vikranta bhutabhavani || 57|| vidravini mokshadatri kalacakreshvari
    nati | taptahatakavarna ca kritanta bhrantibhanjini || 58|| sarvatejomayi bhavya ditishokakari kritih
    | mahakruddha shmashanastha kapalasragalankrita || 59|| kalatikala kalantakaritih karunanidhih | mahaghora
    ghoratara samharakarini tatha || 60|| anadishca mahonmatta bhutadhatryasitekshana | bhishmakara ca
    vakrangi bahupadaikapadika || 61|| kulangana kularadhya kulamargarateshvari | digambara muktakeshi
    vajramushtirnirindhani || 62|| sammohini kshobhakari stambhini vashyakarini | durdharsha darpadalani
    trailokyajanani jaya || 63|| unmadoccatanakari kritya krityavighatini | virupa kalaratrishca maharatrirmanonmani
    || 64|| mahavirya gudhanidra candadordandamandita | nirmala shulini tantra vajrini capadharini ||
    65|| sthulodari ca kumuda kamuka lingadharini | dhatodari pheravi ca pravina kalasundari || 66|| taravati
    damaruka bhanumandalamalini | ekananga pingalakshi pracandakshi shubhankari || 67|| vidyutkeshi mahamari
    suci tundi ca jrimbhaka | prasvapini mahativra varaniya varaprada || 68|| candacanda jvaladdeha lambodaryagnimardini
    | mahadantolkadrigamba jvalajalajalandhari || 69|| maya krisha prabha rama mahavibhavadayini | paurandari
    vishnumaya kirtih pushtistanudari || 70|| yogajna yogadatri ca yogini yogivallabha | sahasrashirshapada
    ca sahasranayanojvala || 71|| panakartri pavakabha paramritaparayana | jagadgatirjagajjetri janmakalavimocini
    || 72|| mulavatamsini mula maunavrataparanmukhi | lalita lolupa lola lakshaniya lalamadhrik || 73||
    matangini bhavani ca sarvalokeshvareshvari | parvati shambhudayita mahishasuramardini || 74|| candamundapahartri
    ca raktabijanikrintani | nishumbhashumbhamathani devarajavaraprada || 75|| kalyanakarini kali kolamamsasrapayini
    | khadgahasta carmini ca pashini shaktidharini || 76|| khatvangini mundadhara bhushundi dhanuranvita
    | cakraghantanvita balapretashailapradharini || 77|| narakankalanakulasarpahasta samudgara | muralidharini
    balikundini damarupriya || 78|| bhindipalastrini pujya sadhya parighini tatha | pattishaprasini ramya
    shatasho musalinyapi || 79|| shivapotadharadandankushahasta trishulini | ratnakumbhadhara danta churikakuntadoryuta
    || 80|| kamandalukara kshama gridhradhya pushpamalini | mamsakhandakara bijapuravatyakshara kshara
    || 81|| gadaparashuyashtyanka mushtinanaladharini | prabhuta ca pavitra ca shreshtha punyavivardhano
    || 82|| prasannananditamukhi vishishta shishtapalini | kamarupa kamagavi kamaniya kalavati || 83||
    ganga kalingatanaya sipra godavari mahi | reva sarasvati candrabhaga krishna drishadvati || 84|| varanasi
    gayavanti kanci malayavasini | sarvadevisvarupa ca nanarupadharamala || 85|| lakshmirgauri mahalakshmi
    ratnapurna kripamayi | durga ca vijaya ghora padmavatyamareshvari || 86|| vagala rajamatangi candi
    mahishamardini | triputocchishtacandali bharunda bhuvaneshvari || 87|| rajarajeshvari nityaklinna
    ca jayabhairavi | candayogeshvari rajyalakshmi rudranyarundhati || 88|| ashvarudha mahaguhya yantrapramathani
    tatha | dhanalakshmirvishvalakshmirvashyakarinyakalmasha || 89|| tvarita ca mahacandabhairavi parameshvari
    | trailokyavijaya jvalamukhi dikkaravasini || 90|| mahamantreshvari vajraprastarinyajanavati | candakapaleshvari
    ca svarnakoteshvari tatha || 91|| ugracanda shmashanogracanda vartalyajeshvari | candogra ca pracanda
    ca candika candanayika || 92|| vagvadini madhumati varuni tumbureshvari | vagishvari ca purneshi saumyogra
    kalabhairavi || 93|| digambara ca dhanada kalaratrishca kubjika | kirati shivaduti ca kalasankarshani
    tatha || 94|| kukkuti sankata devi capalabhramarambika | maharnaveshvari nitya jayajhankeshvari tatha
    || 95|| shavari pingala buddhiprada samsaratarini | vijna mahamohini ca bala tripurasundari || 96||
    ugratara caikajata tatha nilasarasvati | trikantaki chinnamasta bodhisatva raneshvari || 97|| brahmani
    vaishnavi maheshvari kaumaryalambusha | varahi narasimhi ca camundendranyonija || 98|| candeshvari
    candaghanta nakuli mrityuharini | hamseshvari mokshada ca shatakarni jalandhari || 99||
  devanagari: उल्कामुखी फेरुरावा भीषणा भैरवासना । कपालिनी कालरात्रिर्गौरी कङ्कालधारिणी ॥ २॥ श्मशानवासिनी
    प्रेतासना रक्तोदधिप्रिया । योगमाता महारात्रिः पञ्चकालानलस्थिता ॥ ३॥ रुद्राणी रौद्ररूपा च रुधिरद्वीपचारिणी
    । मुण्डमालाधरा चण्डी बलवर्वरकुन्तला ॥ ४॥ मेधा महाडाकिनी च योगिनी योगिवन्दिता । कौलिनी कुरुकुल्ला च
    घोरा पिङ्गजटा जया ॥ ५॥ सावित्री वेदजननी गायत्री गगनालया । नवपञ्चमहाचक्रनिलया दारुणस्वना ॥ ६॥ उग्रा
    कपर्दिगृहिणी जगदाद्या जनाश्रया । कालकर्णी कुण्डलिनी भूतप्रेतगणाधिपा ॥ ७॥ जालन्धरी मसीदेहा पूर्णानन्दपतङ्गिनी
    । पालिनी पावकाभासा प्रसन्ना परमेश्वरी ॥ ८॥ रतिप्रिया रोगहरी नागहारा नगात्मजा । अव्यया वीतरागा च भवानी
    भूतधारिणी ॥ ९॥ कादम्बिनी नीलदेहा काली कादम्बरीप्रिया । माननीया महादेवी महामण्डलवर्तिनी ॥ १०॥ महामांसाशनीशानी
    चिद्रूपा वागगोचरा । यज्ञाम्बुजामनादेवी दर्वीकरविभूषिता ॥ ११॥ चण्डमुण्डप्रमथनी खेचरी खेचरोदिता । तमालश्यामला
    तीव्रा तापिनी तापनाशिनी ॥ १२॥ महामाया महादंष्ट्रा महोरगविराजिता । लम्बोदरी लोलजटा लक्ष्म्यालक्ष्मीप्रदायिनी
    ॥ १३॥ धात्री धाराधराकारा धोरणी धावनप्रिया । हरजाया हराराध्या हरिवक्त्रा हरीश्वरी ॥ १४॥ विश्वेश्वरी
    वज्रनखी स्वरारोहा बलप्रदा । घोणकी घर्घरारावा घोराघौघप्रणाशिनी ॥ १५॥ कल्पान्तकारिणी भीमा ज्वालामालिन्यवामया
    । सृष्टिः स्थितिः क्षोभणा च कराला चापराजिता ॥ १६॥ वज्रहस्तानन्तशक्तिर्विरूपा च परापरा । ब्रह्माण्डमर्दिनी
    प्रध्वंसिनी लक्षभुजा सती ॥ १७॥ विद्युज्जिह्वा महादंष्ट्रा छायाध्वरसुताद्यहृत् । महाकालाग्निमूर्तिश्च
    मेघनादा कटङ्कटा ॥ १८॥ प्रदीप्ता विश्वरूपा च जीवदात्री जनेश्वरी । साक्षिणी शर्वरी शान्ता शममार्गप्रकाशिका
    ॥ १९॥ क्षेत्रज्ञा क्षेपणी क्षम्याऽक्षता क्षामोदरी क्षितिः । अप्रमेया कुलाचारकर्त्री कौलिकपालिनी ॥
    २०॥ माननीया मनोगम्या मेनानन्दप्रदायिनी । सिद्धान्तखनिरध्यक्षा मुण्डिनी मण्डलप्रिया ॥ २१॥ बाला च युवती
    वृद्धा वयोतीता बलप्रदा । रत्नमालाधरा दान्ता दर्वीकरविराजिता ॥ २२॥ धर्ममूर्तिर्ध्वान्तरुचिर्धरित्री
    धावनप्रिया । सङ्कल्पिनी कल्पकरी कलातीता कलस्वना ॥ २३॥ वसुन्धरा बोधदात्री वर्णिनी वानरानरा । विद्या
    विद्यात्मिका वन्या बन्धनी बन्धनाशिनी ॥ २४॥ गेया जटाजटरम्या जरती जाह्नवी जडा । तारिणी तीर्थरूपा च तपनीया
    तनूदरी ॥ २५॥ तापत्रयहरा तापी तपस्या तापसप्रिया । भोगिभूष्या भोगवती भगिनी भगमालिनी ॥ २६॥ भक्तिलभ्या
    भावगम्या भूतिदा भववल्लभा । स्वाहारूपा स्वधारूपा वषट्कारस्वरूपिणी ॥ २७॥ हन्ता कृतिर्नमोरूपा यज्ञादिर्यज्ञसम्भवा
    । स्फ्यसूर्पचमसाकारा स्रक्स्रु वाकृतिधारिणी ॥ २८॥ उद्गीथहिंकारदेहा नमः स्वस्तिप्रकाशिनी । ऋग्यजुः
    सामरूपा च मन्त्रब्राह्मणरूपिणी ॥ २९॥ सर्वशाखामयी खर्वा पीवर्युपनिषद्बुधा । रौद्री मृत्युञ्जयाचिन्तामणिर्वैहायसी
    धृतिः ॥ ३०॥ तार्तीया हंसिनी चान्द्री तारा त्रैविक्रमी स्थितिः । योगिनी डाकिनी धारा वैद्युती विनयप्रदा
    ॥ ३१॥ उपांशुर्मानसी वाच्या रोचना रुचिदायिनी । सत्वाकृतिस्तमोरूपा राजसी गुणवर्जिता ॥ ३२॥ आदिसर्गादिकालीनभानवी
    नाभसी तथा । मूलाधारा कुण्डलिनी स्वाधिप्ठानपरायणा ॥ ३३॥ मणिपूरकवासा च विशुद्धानाहता तथा । आज्ञा प्रज्ञा
    महासंज्ञा वर्वरा व्योमचारिणी ॥ ३४॥ बृहद्रथन्तराकारा ज्येष्ठा चाथर्वणी तथा । प्राजापत्या महाब्राह्मी
    हूंहूङ्कारा पतङ्गिनी ॥ ३५॥ राक्षसी दानवी भूतिः पिशाची प्रत्यनीकरा । उदात्ताप्यनुदात्ता च स्वरिता निःस्वराप्यजा
    ॥ ३६॥ निष्कला पुष्कला साध्वी सा नुता खण्डरूपिणी । गूढा पुराणा चरमा प्राग्भवी वामनी ध्रुवा ॥ ३७॥ काकीमुखी
    साकला च स्थावरा जङ्गमेश्वरी । ईडा च पिङ्गला चैव सुषुम्णा ध्यानगोचरा ॥ ३८॥ सर्गा विसर्गा धमनी कम्पिनी
    बन्धनी हिता । सङ्कोचिनी भासुरा च निम्ना दृप्ता प्रकाशिनी ॥ ३९॥ प्रबुद्धा क्षेपणी क्षिप्ता पूर्णालस्या
    विलम्बिता । आवेशिनी घर्घरा च रूक्षा क्लिन्ना सरस्वती ॥ ४०॥ स्निग्धा चण्डा कुहूः पूषा वारणा च यशस्विनी
    । गान्धारी शङ्खिनी चैव हस्तिजिह्वा पयस्विनी ॥ ४१॥ विश्वोदरालम्बुषा च बिभ्रा तेजस्विनी सती । अव्यक्ता
    गालनी मन्दा मुदिता चेतनापि च ॥ ४२॥ द्रावणी चपला लम्बा भ्रामरी मधुमत्यपि । धर्मा रसवहा चण्डी सौवीरी
    कपिला तथा ॥ ४३॥ रण्डोत्तरा कर्षिणी च रेवती सुमुखी नटी । रजन्याप्यायनी विश्वदूता चन्द्रा कपर्दिनी ॥
    ४४॥ नन्दा चन्द्रावती मैत्री विशालापि च माण्डवी । विचित्रा लोहिनीकल्पा सुकल्पा पूतनापि च ॥ ४५॥ धोरणी
    धारणी हेला धीरा वेगवती जटा । अग्निज्वाला च सुरभी विवर्णा कृन्तनी तथा ॥ ४६॥ तपिनी तापिनी धूम्रा मरीचिर्ज्वालिनी
    रुचिः । तपस्विनी स्वप्नवहा संमोहा कोटरा चला ॥ ४७॥ विकल्पा लम्बिका मूला तन्द्रावत्यपि घण्टिका । अविग्रहा
    च कैवल्या तुरीया चापुनर्भवा ॥ ४८॥ विभ्रान्तिश्च प्रशान्ता च योगिनिः श्रेण्यलक्षिता । निर्वाणा स्वस्तिका
    वृद्धिर्निवृत्तिश्च महोदया ॥ ४९॥ बोध्याऽविद्या च तामिस्रा वासना योगमेदिनी । निरञ्जना च प्रकृतिः सत्तारव्या
    पारमार्थिकी ॥ ५०॥ प्रतिबिम्बनिराभासा सदसद्रूपधारिणी । उपशान्ता च चैतन्या कूटा विज्ञानमय्यपि ॥ ५१॥
    शक्तिविद्या वासिता च मोदिनी मुदितानना । अनया प्रवहा व्याडी सर्वज्ञा शरणप्रदा ॥ ५२॥ वारुणी मार्जनीभाषा
    प्रतिमा बृहती खला । प्रतीच्छा प्रमितिः प्रीतिः कुहिका तर्पणप्रिया ॥ ५३॥ स्वस्तिका सर्वतोभद्रा गायत्री
    प्रणवात्मिका । सावित्री वेदजननी निगमाचारबोधिनी ॥ ५४॥ विकराला कराला च ज्वालाजालैकमालिनी । भीमा च क्षोभणानन्ता
    वीरा वज्रायुधा तथा ॥ ५५॥ प्रध्वंसिनी च मालङ्का विश्वमर्दिन्यवीक्षिता । मृत्युः सहस्रबाहुश्च घोरदंष्ट्रा
    वलाहकी ॥ ५६॥ पिङ्गा पिङ्गशता दीप्ता प्रचण्डा सर्वतोमुखी । विदारिणी विश्वरूपा विक्रान्ता भूतभावनी ॥
    ५७॥ विद्राविणी मोक्षदात्री कालचक्रेश्वरी नटी । तप्तहाटकवर्णा च कृतान्ता भ्रान्तिभञ्जिनी ॥ ५८॥ सर्वतेजोमयी
    भव्या दितिशोककरी कृतिः । महाक्रुद्धा श्मशानस्था कपालस्रगलङ्कृता ॥ ५९॥ कालातिकाला कालान्तकरीतिः करुणानिधिः
    । महाघोरा घोरतरा संहारकरिणी तथा ॥ ६०॥ अनादिश्च महोन्मत्ता भूतधात्र्यसितेक्षणा । भीष्माकारा च वक्राङ्गी
    बहुपादैकपादिका ॥ ६१॥ कुलाङ्गना कुलाराध्या कुलमार्गरतेश्वरी । दिगम्बरा मुक्तकेशी वज्रमुष्टिर्निरिन्धनी
    ॥ ६२॥ सम्मोहिनी क्षोभकरी स्तम्भिनी वश्यकारिणी । दुर्धर्षा दर्पदलनी त्रैलोक्यजननी जया ॥ ६३॥ उन्मादोच्चाटनकरी
    कृत्या कृत्याविघातिनी । विरूपा कालरात्रिश्च महारात्रिर्मनोन्मनी ॥ ६४॥ महावीर्या गूढनिद्रा चण्डदोर्दण्डमण्डिता
    । निर्मला शूलिनी तन्त्रा वज्रिणी चापधारिणी ॥ ६५॥ स्थूलोदरी च कुमुदा कामुका लिङ्गधारिणी । धटोदरी फेरवी
    च प्रवीणा कालसुन्दरी ॥ ६६॥ तारावती डमरुका भानुमण्डलमालिनी । एकानङ्गा पिङ्गलाक्षी प्रचण्डाक्षी शुभङ्करी
    ॥ ६७॥ विद्युत्केशी महामारी सूची तूण्डी च जृम्भका । प्रस्वापिनी महातीव्रा वरणीया वरप्रदा ॥ ६८॥ चण्डचण्डा
    ज्वलद्देहा लम्बोदर्यग्निमर्दिनी । महादन्तोल्कादृगम्बा ज्वालाजालजलन्धरी ॥ ६९॥ माया कृशा प्रभा रामा
    महाविभवदायिनी । पौरन्दरी विष्णुमाया कीर्तिः पुष्टिस्तनूदरी ॥ ७०॥ योगज्ञा योगदात्री च योगिनी योगिवल्लभा
    । सहस्रशीर्षपादा च सहस्रनयनोज्वला ॥ ७१॥ पानकर्त्री पावकाभा परामृतपरायणा । जगद्गतिर्जगज्जेत्री जन्मकालविमोचिनी
    ॥ ७२॥ मूलावतंसिनी मूला मौनव्रतपराङ्मुखी । ललिता लोलुपा लोला लक्षणीया ललामधृक् ॥ ७३॥ मातङ्गिनी भवानी
    च सर्वलोकेश्वरेश्वरी । पार्वती शम्भुदयिता महिषासुरमर्दिनी ॥ ७४॥ चण्डमुण्डापहर्त्री च रक्तबीजनिकृन्तनी
    । निशुम्भशुम्भमथनी देवराजवरप्रदा ॥ ७५॥ कल्याणकारिणी काली कोलमांसास्रपायिनी । खड्गहस्ता चर्मिणी च पाशिनी
    शक्तिधारिणी ॥ ७६॥ खट्वाङ्गिनी मुण्डधरा भुशुण्डी धनुरन्विता । चक्रघण्टान्विता बालप्रेतशैलप्रधारिणी
    ॥ ७७॥ नरकङ्कालनकुलसर्पहस्ता समुद्गरा । मुरलीधारिणी बलिकुण्डिनी डमरुप्रिया ॥ ७८॥ भिन्दिपालास्त्रिणी
    पूज्या साध्या परिघिणी तथा । पट्टिशप्रासिनी रम्या शतशो मुसलिन्यपि ॥ ७९॥ शिवापोतधरादण्डाङ्कुशहस्ता त्रिशूलिनी
    । रत्नकुम्भधरा दान्ता छुरिकाकुन्तदोर्युता ॥ ८०॥ कमण्डलुकरा क्षामा गृध्राढ्या पुष्पमालिनी । मांसखण्डकरा
    बीजपूरवत्यक्षरा क्षरा ॥ ८१॥ गदापरशुयष्ट्यङ्का मुष्टिनानलधारिणी । प्रभूता च पवित्रा च श्रेष्ठा पुण्यविवर्धनो
    ॥ ८२॥ प्रसन्नानन्दितमुखी विशिष्टा शिष्टपालिनी । कामरूपा कामगवी कमनीय कलावती ॥ ८३॥ गङ्गा कलिङ्गतनया
    सिप्रा गोदावरी मही । रेवा सरस्वती चन्द्रभागा कृष्णा दृषद्वती ॥ ८४॥ वाराणसी गयावन्ती काञ्ची मलयवासिनी
    । सर्वदेवीस्वरूपा च नानारूपधरामला ॥ ८५॥ लक्ष्मीर्गौरी महालक्ष्मी रत्नपूर्णा कृपामयी । दुर्गा च विजया
    घोरा पद्मावत्यमरेश्वरी ॥ ८६॥ वगला राजमातङ्गी चण्डी महिषमर्दिनी । त्रिपुटोच्छिष्टचाण्डाली भारुण्डा
    भुवनेश्वरी ॥ ८७॥ राजराजेश्वरी नित्यक्लिन्ना च जयभैरवी । चण्डयोगेश्वरी राज्यलक्ष्मी रुद्राण्यरुन्धती
    ॥ ८८॥ अश्वारूढा महागुह्या यन्त्रप्रमथनी तथा । धनलक्ष्मीर्विश्वलक्ष्मीर्वश्यकारिण्यकल्मषा ॥ ८९॥ त्वरिता
    च महाचण्डभैरवी परमेश्वरी । त्रैलोक्यविजया ज्वालामुखी दिक्करवासिनी ॥ ९०॥ महामन्त्रेश्वरी वज्रप्रस्तारिण्यजनावती
    । चण्डकापालेश्वरी च स्वर्णकोटेश्वरी तथा ॥ ९१॥ उग्रचण्डा श्मशानोग्रचण्डा वार्ताल्यजेश्वरी । चण्डोग्रा
    च प्रचण्डा च चण्डिका चण्डनायिका ॥ ९२॥ वाग्वादिनी मधुमती वारुणी तुम्बुरेश्वरी । वागीश्वरी च पूर्णेशी
    सौम्योग्रा कालभैरवी ॥ ९३॥ दिगम्बरा च धनदा कालरात्रिश्च कुब्जिका । किराटी शिवदूती च कालसङ्कर्षणी तथा
    ॥ ९४॥ कुक्कुटी सङ्कटा देवी चपलभ्रमराम्बिका । महार्णवेश्वरी नित्या जयझङ्केश्वरी तथा ॥ ९५॥ शवरी पिङ्गला
    बुद्धिप्रदा संसारतारिणी । विज्ञा महामोहिनी च बाला त्रिपुरसुन्दरी ॥ ९६॥ उग्रतारा चैकजटा तथा नीलसरस्वती
    । त्रिकण्टकी छिन्नमस्ता बोधिसत्वा रणेश्वरी ॥ ९७॥ ब्रह्माणी वैष्णवी माहेश्वरी कौमार्यलम्बुषा । वाराही
    नारसिंही च चामुण्डेन्द्राण्योनिजा ॥ ९८॥ चण्डेश्वरी चण्डघण्टा नाकुली मृत्युहारिणी । हंसेश्वरी मोक्षदा
    च शातकर्णी जलन्धरी ॥ ९९॥
