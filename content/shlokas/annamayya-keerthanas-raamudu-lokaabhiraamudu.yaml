id: annamayya-keerthanas-raamudu-lokaabhiraamudu
category: stotram
name:
  english: Annamayya Keerthanas Raamudu Lokaabhiraamudu
content:
  english: adi pallavi ramudu lokabhi ramudu | vemaru mòkkucu sevincaro janulu || cèluvupu rupamunu jitakamudu
    malasi birutina samara bhimudu || pòlupaina saketapura dhamudu ilalo prajalakèlla hita dhamudu ||
    ghana kantula nila megha shyamudu anishamu sutula sahasra namudu || kanupattu kapi nayaka stomudu
    tanunèncite devata sarvabhaumudu || sirula mincina tulasi dhamudu karunanidhiyaina bhakta premudu
    || urutara mahimala nuddhamudu arimèmè shṟi venkatagiri gramudu || ramudu lokabhiramudu trailokya
    dhamudu ranaranga bhimudu vade ||
  devanagari: आदि पल्लवि रामुडु लोकाभि रामुडु । वेमारु मॊक्कुचु सेविन्चरो जनुलु ॥ चॆलुवुपु रूपमुनु जितकामुडु
    मलसि बिरुतिन समर भीमुडु ॥ पॊलुपैन साकेतपुर धामुडु इललो प्रजलकॆल्ल हित धामुडु ॥ घन कान्तुल नील मेघ
    श्यामुडु अनिशमु सुतुल सहस्र नामुडु ॥ कनुपट्टु कपि नायक स्तोमुडु तनुनॆन्चिते देवता सार्वभौमुडु ॥ सिरुल
    मिन्चिन तुलसी धामुडु करुणानिधियैन भक्त प्रेमुडु ॥ उरुतर महिमल नुद्धामुडु अरिमॆमॆ श्ऱि वेन्कटगिरि ग्रामुडु
    ॥ रामुडु लोकाभिरामुडु त्रैलोक्य धामुडु रणरङ्ग भीमुडु वाडे ॥
