id: yamaprityarthamyamastotram
category: stotram
name:
  english: yamaprityarthamyamastotram
  devanagari: यमप्रीत्यर्थंयमस्तोत्रम्
content:
  english: yamaprityartham yamastotram om niyamasthah svayam yashca kurute'nyanniyantritan | praharine
    maryadanam shamanaya tasmai namah || 1|| yasya smritya vijanati bhanguratvam nijam narah | pramadalasyarahito
    bodhakaya namo'stute || 2|| vidhaya dhulishayanam yenaham maninam khalu | mahatam curnito garvah tasmai
    namo'ntakaya ca || 3|| yasya pracandadandasya vidhanena hi trasitah | hahakaram prakurvanti dushtastasmai
    namo namah || 4|| kripadrishtirananta ca yasya satkarmakarishu | purushesha namastasmai yamaya pitrisvamine
    || 5|| karmanam phaladanam hi karyameva yathocitam | pakshapato na kasyapi namo yasya yamaya ca ||
    6|| yasya dandabhayadruddhah dushpravrittim kukarmakrit | kritantaya namastasmai pradatte cetanam
    sada || 7|| pradhanyam yena nyayasya mahattvam karmanam sada | maryadarakshanam kartre namastasmai
    yamaya ca || 8|| nyayartham yasya sarve tu gacchanti maranottaram | shubhashubham phalam praptum namastasmai
    yamaya ca || 9|| simhasanadhirudho'tra balavanapi papakrit | yasyagre kampate trasattasmai namo'ntakaya
    ca || 10|| iti shriyamastotram samaptam ||
  devanagari: यमप्रीत्यर्थं यमस्तोत्रम् ॐ नियमस्थः स्वयं यश्च कुरुतेऽन्यान्नियन्त्रितान् । प्रहरिणे मर्यादानां
    शमनाय तस्मै नमः ॥ १॥ यस्य स्मृत्या विजानाति भङ्गुरत्वं निजं नरः । प्रमादालस्यरहितो बोधकाय नमोऽस्तुते
    ॥ २॥ विधाय धूलिशयनं येनाहं मानिनां खलु । महतां चूर्णितो गर्वः तस्मै नमोऽन्तकाय च ॥ ३॥ यस्य प्रचण्डदण्डस्य
    विधानेन हि त्रासिताः । हाहाकारं प्रकुर्वन्ति दुष्टास्तस्मै नमो नमः ॥ ४॥ कृपादृष्टिरनन्ता च यस्य सत्कर्मकारिषु
    । पुरुषेश नमस्तस्मै यमाय पितृस्वामिने ॥ ५॥ कर्मणां फलदानं हि कार्यमेव यथोचितम् । पक्षपातो न कस्यापि
    नमो यस्य यमाय च ॥ ६॥ यस्य दण्डभयाद्रुद्धः दुष्प्रवृत्तिं कुकर्मकृत् । कृतान्ताय नमस्तस्मै प्रदत्ते
    चेतनां सदा ॥ ७॥ प्राधान्यं येन न्यायस्य महत्त्वं कर्मणां सदा । मर्यादारक्षणं कर्त्रे नमस्तस्मै यमाय
    च ॥ ८॥ न्यायार्थं यस्य सर्वे तु गच्छन्ति मरणोत्तरम् । शुभाशुभं फलं प्राप्तुं नमस्तस्मै यमाय च ॥ ९॥
    सिंहासनाधिरूढोऽत्र बलवानपि पापकृत् । यस्याग्रे कम्पते त्रासात्तस्मै नमोऽन्तकाय च ॥ १०॥ इति श्रीयमस्तोत्रं
    समाप्तम् ॥
