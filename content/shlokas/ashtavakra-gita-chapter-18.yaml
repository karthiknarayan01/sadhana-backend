id: ashtavakra-gita-chapter-18
category: stotram
name:
  english: Ashtavakra Gita Chapter 18
content:
  english: ashtavakra uvaca || yasya bodhodaye tavatsvapnavad bhavati bhramah | tasmai sukhaikarupaya
    namah shantaya tejase || || arjayitvakhilan arthan bhoganapnoti pushkalan | na hi sarvaparityagamantarena
    sukhi bhavet || || kartavyaduhkhamartandajvaladagdhantaratmanah | kutah prashamapiyushadharasaramrite
    sukham || || bhavo'yam bhavanamatro na kincit paramarthatah | nastyabhavah svabhavanam bhavabhavavibhavinam
    || || na duram na ca sankocallabdhamevatmanah padam | nirvikalpam nirayasam nirvikaram niranjanam
    || || vyamohamatraviratau svarupadanamatratah | vitashoka virajante niravaranadrishtayah || || samastam
    kalpanamatramatma muktah sanatanah | iti vijnaya dhiro hi kimabhyasyati balavat || || atma brahmeti
    nishcitya bhavabhavau ca kalpitau | nishkamah kim vijanati kim brute ca karoti kim || || ayam so'hamayam
    nahamiti kshina vikalpana | sarvamatmeti nishcitya tushnimbhutasya yoginah || || na vikshepo na caikagryam
    natibodho na mudhata | na sukham na ca va duhkhamupashantasya yoginah || || svarajye bhaikshavrittau
    ca labhalabhe jane vane | nirvikalpasvabhavasya na vishesho'sti yoginah || || kva dharmah kva ca va
    kamah kva carthah kva vivekita | idam kritamidam neti dvandvairmuktasya yoginah || || krityam kimapi
    naivasti na kapi hridi ranjana | yatha jivanameveha jivanmuktasya yoginah || || kva mohah kva ca va
    vishvam kva tad dhyanam kva muktata | sarvasankalpasimayam vishrantasya mahatmanah || || yena vishvamidam
    drishtam sa nastiti karotu vai | nirvasanah kim kurute pashyannapi na pashyati || || yena drishtam
    param brahma so'ham brahmeti cintayet | kim cintayati nishcinto dvitiyam yo na pashyati || || drishto
    yenatmavikshepo nirodham kurute tvasau | udarastu na vikshiptah sadhyabhavatkaroti kim || || dhiro
    lokaviparyasto vartamano'pi lokavat | na samadhim na vikshepam na lopam svasya pashyati || || bhavabhavavihino
    yastripto nirvasano budhah | naiva kincitkritam tena lokadrishtya vikurvata || || pravrittau va nivrittau
    va naiva dhirasya durgrahah | yada yatkartumayati tatkritva tishthatah sukham || || nirvasano niralambah
    svacchando muktabandhanah | kshiptah samskaravatena ceshtate shushkaparnavat || || asamsarasya tu
    kvapi na harsho na vishadata | sa shitalamana nityam videha iva rajate || || kutrapi na jihasasti
    nasho vapi na kutracit | atmaramasya dhirasya shitalacchataratmanah || || prakritya shunyacittasya
    kurvato'sya yadricchaya | prakritasyeva dhirasya na mano navamanata || || kritam dehena karmedam na
    maya shuddharupina | iti cintanurodhi yah kurvannapi karoti na || || atadvadiva kurute na bhavedapi
    balishah | jivanmuktah sukhi shriman samsarannapi shobhate || || nanavicarasushranto dhiro vishrantimagatah
    | na kalpate na janati na shrinoti na pashyati || || asamadheravikshepan na mumukshurna cetarah |
    nishcitya kalpitam pashyan brahmaivaste mahashayah || || yasyantah syadahankaro na karoti karoti sah
    | nirahankaradhirena na kincidakritam kritam || || nodvignam na ca santushtamakartri spandavarjitam
    | nirasham gatasandeham cittam muktasya rajate || || nirdhyatum ceshtitum vapi yaccittam na pravartate
    | nirnimittamidam kintu nirdhyayati viceshtate || || tattvam yatharthamakarnya mandah prapnoti mudhatam
    | athava yati sankocamamudhah ko'pi mudhavat || || ekagrata nirodho va mudhairabhyasyate bhrisham
    | dhirah krityam na pashyanti suptavatsvapade sthitah || || aprayatnat prayatnad va mudho napnoti
    nirvritim | tattvanishcayamatrena prajno bhavati nirvritah || || shuddham buddham priyam purnam nishprapancam
    niramayam | atmanam tam na jananti tatrabhyasapara janah || || napnoti karmana moksham vimudho'bhyasarupina
    | dhanyo vijnanamatrena muktastishthatyavikriyah || || mudho napnoti tad brahma yato bhavitumicchati
    | anicchannapi dhiro hi parabrahmasvarupabhak || || niradhara grahavyagra mudhah samsaraposhakah |
    etasyanarthamulasya mulacchedah krito budhaih || || na shantim labhate mudho yatah shamitumicchati
    | dhirastattvam vinishcitya sarvada shantamanasah || || kvatmano darshanam tasya yad drishtamavalambate
    | dhirastam tam na pashyanti pashyantyatmanamavyayam || || kva nirodho vimudhasya yo nirbandham karoti
    vai | svaramasyaiva dhirasya sarvadasavakritrimah || || bhavasya bhavakah kashcin na kincid bhavakoparah
    | ubhayabhavakah kashcid evameva nirakulah || || shuddhamadvayamatmanam bhavayanti kubuddhayah | na
    tu jananti sammohadyavajjivamanirvritah || || mumukshorbuddhiralambamantarena na vidyate | niralambaiva
    nishkama buddhirmuktasya sarvada || || vishayadvipino vikshya cakitah sharanarthinah | vishanti jhatiti
    krodam nirodhaikagrasiddhaye || || nirvasanam harim drishtva tushnim vishayadantinah | palayante na
    shaktaste sevante kritacatavah || || na muktikarikam dhatte nihshanko yuktamanasah | pashyan shrinvan
    sprishan jighrannashnannaste yathasukham || || vastushravanamatrena shuddhabuddhirnirakulah | naivacaramanacaramaudasyam
    va prapashyati || || yada yatkartumayati tada tatkurute rijuh | shubham vapyashubham vapi tasya ceshta
    hi balavat || || svatantryatsukhamapnoti svatantryallabhate param | svatantryannirvritim gacchetsvatantryat
    paramam padam || || akartritvamabhoktritvam svatmano manyate yada | tada kshina bhavantyeva samastashcittavrittayah
    || || ucchrinkhalapyakritika sthitirdhirasya rajate | na tu sasprihacittasya shantirmudhasya kritrima
    || || vilasanti mahabhogairvishanti girigahvaran | nirastakalpana dhira abaddha muktabuddhayah ||
    || shrotriyam devatam tirthamanganam bhupatim priyam | drishtva sampujya dhirasya na kapi hridi vasana
    || || bhrityaih putraih kalatraishca dauhitraishcapi gotrajaih | vihasya dhikkrito yogi na yati vikritim
    manak || || santushto'pi na santushtah khinno'pi na ca khidyate | tasyashcaryadasham tam tam tadrisha
    eva janate || || kartavyataiva samsaro na tam pashyanti surayah | shunyakara nirakara nirvikara niramayah
    || || akurvannapi sankshobhad vyagrah sarvatra mudhadhih | kurvannapi tu krityani kushalo hi nirakulah
    || || sukhamaste sukham shete sukhamayati yati ca | sukham vakti sukham bhunkte vyavahare'pi shantadhih
    || || svabhavadyasya naivartirlokavad vyavaharinah | mahahrada ivakshobhyo gatakleshah sushobhate
    || || nivrittirapi mudhasya pravritti rupajayate | pravrittirapi dhirasya nivrittiphalabhagini ||
    || parigraheshu vairagyam prayo mudhasya drishyate | dehe vigalitashasya kva ragah kva viragata ||
    || bhavanabhavanasakta drishtirmudhasya sarvada | bhavyabhavanaya sa tu svasthasyadrishtirupini ||
    || sarvarambheshu nishkamo yashcared balavan munih | na lepastasya shuddhasya kriyamane'pi karmani
    || || sa eva dhanya atmajnah sarvabhaveshu yah samah | pashyan shrinvan sprishan jighrann ashnannistarshamanasah
    || || kva samsarah kva cabhasah kva sadhyam kva ca sadhanam | akashasyeva dhirasya nirvikalpasya sarvada
    || || sa jayatyarthasannyasi purnasvarasavigrahah | akritrimo'navacchinne samadhiryasya vartate ||
    || bahunatra kimuktena jnatatattvo mahashayah | bhogamokshanirakankshi sada sarvatra nirasah || ||
    mahadadi jagaddvaitam namamatravijrimbhitam | vihaya shuddhabodhasya kim krityamavashishyate || ||
    bhramabhutamidam sarvam kincinnastiti nishcayi | alakshyasphuranah shuddhah svabhavenaiva shamyati
    || || shuddhasphuranarupasya drishyabhavamapashyatah | kva vidhih kva ca vairagyam kva tyagah kva
    shamo'pi va || || sphurato'nantarupena prakritim ca na pashyatah | kva bandhah kva ca va mokshah kva
    harshah kva vishadita || || buddhiparyantasamsare mayamatram vivartate | nirmamo nirahankaro nishkamah
    shobhate budhah || || akshayam gatasantapamatmanam pashyato muneh | kva vidya ca kva va vishvam kva
    deho'ham mameti va || || nirodhadini karmani jahati jadadhiryadi | manorathan pralapamshca kartumapnotyatatkshanat
    || || mandah shrutvapi tadvastu na jahati vimudhatam | nirvikalpo bahiryatnadantarvishayalalasah ||
    || jnanad galitakarma yo lokadrishtyapi karmakrit | napnotyavasaram kartum vaktumeva na kincana ||
    || kva tamah kva prakasho va hanam kva ca na kincana | nirvikarasya dhirasya niratankasya sarvada
    || || kva dhairyam kva vivekitvam kva niratankatapi va | anirvacyasvabhavasya nihsvabhavasya yoginah
    || || na svargo naiva narako jivanmuktirna caiva hi | bahunatra kimuktena yogadrishtya na kincana
    || || naiva prarthayate labham nalabhenanushocati | dhirasya shitalam cittamamritenaiva puritam ||
    || na shantam stauti nishkamo na dushtamapi nindati | samaduhkhasukhastriptah kincit krityam na pashyati
    || || dhiro na dveshti samsaramatmanam na didrikshati | harshamarshavinirmukto na mrito na ca jivati
    || || nihsnehah putradaradau nishkamo vishayeshu ca | nishcintah svasharire'pi nirashah shobhate budhah
    || || tushtih sarvatra dhirasya yathapatitavartinah | svacchandam carato deshan yatrastamitashayinah
    || || patatudetu va deho nasya cinta mahatmanah | svabhavabhumivishrantivismritasheshasamsriteh ||
    || akincanah kamacaro nirdvandvashchinnasamshayah | asaktah sarvabhaveshu kevalo ramate budhah ||
    || nirmamah shobhate dhirah samaloshtashmakancanah | subhinnahridayagranthirvinirdhutarajastamah ||
    || sarvatranavadhanasya na kincid vasana hridi | muktatmano vitriptasya tulana kena jayate || || janannapi
    na janati pashyannapi na pashyati | bruvann api na ca brute ko'nyo nirvasanadrite || || bhikshurva
    bhupatirvapi yo nishkamah sa shobhate | bhaveshu galita yasya shobhanashobhana matih || || kva svacchandyam
    kva sankocah kva va tattvavinishcayah | nirvyajarjavabhutasya caritarthasya yoginah || || atmavishrantitriptena
    nirashena gatartina | antaryadanubhuyeta tat katham kasya kathyate || || supto'pi na sushuptau ca
    svapne'pi shayito na ca | jagare'pi na jagarti dhirastriptah pade pade || || jnah sacinto'pi nishcintah
    sendriyo'pi nirindriyah | subuddhirapi nirbuddhih sahankaro'nahankritih || || na sukhi na ca va duhkhi
    na virakto na sangavan | na mumukshurna va mukto na kincinna ca kincana || || vikshepe'pi na vikshiptah
    samadhau na samadhiman | jadye'pi na jado dhanyah panditye'pi na panditah || || mukto yathasthitisvasthah
    kritakartavyanirvritah | samah sarvatra vaitrishnyanna smaratyakritam kritam || || na priyate vandyamano
    nindyamano na kupyati | naivodvijati marane jivane nabhinandati || || na dhavati janakirnam naranyamupashantadhih
    | yathatatha yatratatra sama evavatishthate ||
  devanagari: अष्टावक्र उवाच ॥ यस्य बोधोदये तावत्स्वप्नवद् भवति भ्रमः । तस्मै सुखैकरूपाय नमः शान्ताय तेजसे
    ॥ ॥ अर्जयित्वाखिलान् अर्थान् भोगानाप्नोति पुष्कलान् । न हि सर्वपरित्यागमन्तरेण सुखी भवेत् ॥ ॥ कर्तव्यदुःखमार्तण्डज्वालादग्धान्तरात्मनः
    । कुतः प्रशमपीयूषधारासारमृते सुखम् ॥ ॥ भवोऽयं भावनामात्रो न किञ्चित् परमार्थतः । नास्त्यभावः स्वभावानां
    भावाभावविभाविनाम् ॥ ॥ न दूरं न च सङ्कोचाल्लब्धमेवात्मनः पदम् । निर्विकल्पं निरायासं निर्विकारं निरञ्जनम्
    ॥ ॥ व्यामोहमात्रविरतौ स्वरूपादानमात्रतः । वीतशोका विराजन्ते निरावरणदृष्टयः ॥ ॥ समस्तं कल्पनामात्रमात्मा
    मुक्तः सनातनः । इति विज्ञाय धीरो हि किमभ्यस्यति बालवत् ॥ ॥ आत्मा ब्रह्मेति निश्चित्य भावाभावौ च कल्पितौ
    । निष्कामः किं विजानाति किं ब्रूते च करोति किम् ॥ ॥ अयं सोऽहमयं नाहमिति क्षीणा विकल्पना । सर्वमात्मेति
    निश्चित्य तूष्णीम्भूतस्य योगिनः ॥ ॥ न विक्षेपो न चैकाग्र्यं नातिबोधो न मूढता । न सुखं न च वा दुःखमुपशान्तस्य
    योगिनः ॥ ॥ स्वाराज्ये भैक्षवृत्तौ च लाभालाभे जने वने । निर्विकल्पस्वभावस्य न विशेषोऽस्ति योगिनः ॥
    ॥ क्व धर्मः क्व च वा कामः क्व चार्थः क्व विवेकिता । इदं कृतमिदं नेति द्वन्द्वैर्मुक्तस्य योगिनः ॥
    ॥ कृत्यं किमपि नैवास्ति न कापि हृदि रञ्जना । यथा जीवनमेवेह जीवन्मुक्तस्य योगिनः ॥ ॥ क्व मोहः क्व च
    वा विश्वं क्व तद् ध्यानं क्व मुक्तता । सर्वसङ्कल्पसीमायां विश्रान्तस्य महात्मनः ॥ ॥ येन विश्वमिदं
    दृष्टं स नास्तीति करोतु वै । निर्वासनः किं कुरुते पश्यन्नपि न पश्यति ॥ ॥ येन दृष्टं परं ब्रह्म सोऽहं
    ब्रह्मेति चिन्तयेत् । किं चिन्तयति निश्चिन्तो द्वितीयं यो न पश्यति ॥ ॥ दृष्टो येनात्मविक्षेपो निरोधं
    कुरुते त्वसौ । उदारस्तु न विक्षिप्तः साध्याभावात्करोति किम् ॥ ॥ धीरो लोकविपर्यस्तो वर्तमानोऽपि लोकवत्
    । न समाधिं न विक्षेपं न लोपं स्वस्य पश्यति ॥ ॥ भावाभावविहीनो यस्तृप्तो निर्वासनो बुधः । नैव किञ्चित्कृतं
    तेन लोकदृष्ट्या विकुर्वता ॥ ॥ प्रवृत्तौ वा निवृत्तौ वा नैव धीरस्य दुर्ग्रहः । यदा यत्कर्तुमायाति तत्कृत्वा
    तिष्ठतः सुखम् ॥ ॥ निर्वासनो निरालम्बः स्वच्छन्दो मुक्तबन्धनः । क्षिप्तः संस्कारवातेन चेष्टते शुष्कपर्णवत्
    ॥ ॥ असंसारस्य तु क्वापि न हर्षो न विषादता । स शीतलमना नित्यं विदेह इव राजते ॥ ॥ कुत्रापि न जिहासास्ति
    नाशो वापि न कुत्रचित् । आत्मारामस्य धीरस्य शीतलाच्छतरात्मनः ॥ ॥ प्रकृत्या शून्यचित्तस्य कुर्वतोऽस्य
    यदृच्छया । प्राकृतस्येव धीरस्य न मानो नावमानता ॥ ॥ कृतं देहेन कर्मेदं न मया शुद्धरूपिणा । इति चिन्तानुरोधी
    यः कुर्वन्नपि करोति न ॥ ॥ अतद्वादीव कुरुते न भवेदपि बालिशः । जीवन्मुक्तः सुखी श्रीमान् संसरन्नपि शोभते
    ॥ ॥ नानाविचारसुश्रान्तो धीरो विश्रान्तिमागतः । न कल्पते न जानाति न शृणोति न पश्यति ॥ ॥ असमाधेरविक्षेपान्
    न मुमुक्षुर्न चेतरः । निश्चित्य कल्पितं पश्यन् ब्रह्मैवास्ते महाशयः ॥ ॥ यस्यान्तः स्यादहङ्कारो न करोति
    करोति सः । निरहङ्कारधीरेण न किञ्चिदकृतं कृतम् ॥ ॥ नोद्विग्नं न च सन्तुष्टमकर्तृ स्पन्दवर्जितम् । निराशं
    गतसन्देहं चित्तं मुक्तस्य राजते ॥ ॥ निर्ध्यातुं चेष्टितुं वापि यच्चित्तं न प्रवर्तते । निर्निमित्तमिदं
    किन्तु निर्ध्यायति विचेष्टते ॥ ॥ तत्त्वं यथार्थमाकर्ण्य मन्दः प्राप्नोति मूढताम् । अथवा याति सङ्कोचममूढः
    कोऽपि मूढवत् ॥ ॥ एकाग्रता निरोधो वा मूढैरभ्यस्यते भृशम् । धीराः कृत्यं न पश्यन्ति सुप्तवत्स्वपदे स्थिताः
    ॥ ॥ अप्रयत्नात् प्रयत्नाद् वा मूढो नाप्नोति निर्वृतिम् । तत्त्वनिश्चयमात्रेण प्राज्ञो भवति निर्वृतः
    ॥ ॥ शुद्धं बुद्धं प्रियं पूर्णं निष्प्रपञ्चं निरामयम् । आत्मानं तं न जानन्ति तत्राभ्यासपरा जनाः ॥
    ॥ नाप्नोति कर्मणा मोक्षं विमूढोऽभ्यासरूपिणा । धन्यो विज्ञानमात्रेण मुक्तस्तिष्ठत्यविक्रियः ॥ ॥ मूढो
    नाप्नोति तद् ब्रह्म यतो भवितुमिच्छति । अनिच्छन्नपि धीरो हि परब्रह्मस्वरूपभाक् ॥ ॥ निराधारा ग्रहव्यग्रा
    मूढाः संसारपोषकाः । एतस्यानर्थमूलस्य मूलच्छेदः कृतो बुधैः ॥ ॥ न शान्तिं लभते मूढो यतः शमितुमिच्छति
    । धीरस्तत्त्वं विनिश्चित्य सर्वदा शान्तमानसः ॥ ॥ क्वात्मनो दर्शनं तस्य यद् दृष्टमवलम्बते । धीरास्तं
    तं न पश्यन्ति पश्यन्त्यात्मानमव्ययम् ॥ ॥ क्व निरोधो विमूढस्य यो निर्बन्धं करोति वै । स्वारामस्यैव
    धीरस्य सर्वदासावकृत्रिमः ॥ ॥ भावस्य भावकः कश्चिन् न किञ्चिद् भावकोपरः । उभयाभावकः कश्चिद् एवमेव निराकुलः
    ॥ ॥ शुद्धमद्वयमात्मानं भावयन्ति कुबुद्धयः । न तु जानन्ति सम्मोहाद्यावज्जीवमनिर्वृताः ॥ ॥ मुमुक्षोर्बुद्धिरालम्बमन्तरेण
    न विद्यते । निरालम्बैव निष्कामा बुद्धिर्मुक्तस्य सर्वदा ॥ ॥ विषयद्वीपिनो वीक्ष्य चकिताः शरणार्थिनः
    । विशन्ति झटिति क्रोडं निरोधैकाग्रसिद्धये ॥ ॥ निर्वासनं हरिं दृष्ट्वा तूष्णीं विषयदन्तिनः । पलायन्ते
    न शक्तास्ते सेवन्ते कृतचाटवः ॥ ॥ न मुक्तिकारिकां धत्ते निःशङ्को युक्तमानसः । पश्यन् शृण्वन् स्पृशन्
    जिघ्रन्नश्नन्नास्ते यथासुखम् ॥ ॥ वस्तुश्रवणमात्रेण शुद्धबुद्धिर्निराकुलः । नैवाचारमनाचारमौदास्यं वा
    प्रपश्यति ॥ ॥ यदा यत्कर्तुमायाति तदा तत्कुरुते ऋजुः । शुभं वाप्यशुभं वापि तस्य चेष्टा हि बालवत् ॥
    ॥ स्वातन्त्र्यात्सुखमाप्नोति स्वातन्त्र्याल्लभते परम् । स्वातन्त्र्यान्निर्वृतिं गच्छेत्स्वातन्त्र्यात्
    परमं पदम् ॥ ॥ अकर्तृत्वमभोक्तृत्वं स्वात्मनो मन्यते यदा । तदा क्षीणा भवन्त्येव समस्ताश्चित्तवृत्तयः
    ॥ ॥ उच्छृङ्खलाप्यकृतिका स्थितिर्धीरस्य राजते । न तु सस्पृहचित्तस्य शान्तिर्मूढस्य कृत्रिमा ॥ ॥ विलसन्ति
    महाभोगैर्विशन्ति गिरिगह्वरान् । निरस्तकल्पना धीरा अबद्धा मुक्तबुद्धयः ॥ ॥ श्रोत्रियं देवतां तीर्थमङ्गनां
    भूपतिं प्रियम् । दृष्ट्वा सम्पूज्य धीरस्य न कापि हृदि वासना ॥ ॥ भृत्यैः पुत्रैः कलत्रैश्च दौहित्रैश्चापि
    गोत्रजैः । विहस्य धिक्कृतो योगी न याति विकृतिं मनाक् ॥ ॥ सन्तुष्टोऽपि न सन्तुष्टः खिन्नोऽपि न च खिद्यते
    । तस्याश्चर्यदशां तां तां तादृशा एव जानते ॥ ॥ कर्तव्यतैव संसारो न तां पश्यन्ति सूरयः । शून्याकारा
    निराकारा निर्विकारा निरामयाः ॥ ॥ अकुर्वन्नपि सङ्क्षोभाद् व्यग्रः सर्वत्र मूढधीः । कुर्वन्नपि तु कृत्यानि
    कुशलो हि निराकुलः ॥ ॥ सुखमास्ते सुखं शेते सुखमायाति याति च । सुखं वक्ति सुखं भुङ्क्ते व्यवहारेऽपि
    शान्तधीः ॥ ॥ स्वभावाद्यस्य नैवार्तिर्लोकवद् व्यवहारिणः । महाह्रद इवाक्षोभ्यो गतक्लेशः सुशोभते ॥ ॥
    निवृत्तिरपि मूढस्य प्रवृत्ति रुपजायते । प्रवृत्तिरपि धीरस्य निवृत्तिफलभागिनी ॥ ॥ परिग्रहेषु वैराग्यं
    प्रायो मूढस्य दृश्यते । देहे विगलिताशस्य क्व रागः क्व विरागता ॥ ॥ भावनाभावनासक्ता दृष्टिर्मूढस्य सर्वदा
    । भाव्यभावनया सा तु स्वस्थस्यादृष्टिरूपिणी ॥ ॥ सर्वारम्भेषु निष्कामो यश्चरेद् बालवन् मुनिः । न लेपस्तस्य
    शुद्धस्य क्रियमाणेऽपि कर्मणि ॥ ॥ स एव धन्य आत्मज्ञः सर्वभावेषु यः समः । पश्यन् शृण्वन् स्पृशन् जिघ्रन्न्
    अश्नन्निस्तर्षमानसः ॥ ॥ क्व संसारः क्व चाभासः क्व साध्यं क्व च साधनम् । आकाशस्येव धीरस्य निर्विकल्पस्य
    सर्वदा ॥ ॥ स जयत्यर्थसन्न्यासी पूर्णस्वरसविग्रहः । अकृत्रिमोऽनवच्छिन्ने समाधिर्यस्य वर्तते ॥ ॥ बहुनात्र
    किमुक्तेन ज्ञाततत्त्वो महाशयः । भोगमोक्षनिराकाङ्क्षी सदा सर्वत्र नीरसः ॥ ॥ महदादि जगद्द्वैतं नाममात्रविजृम्भितम्
    । विहाय शुद्धबोधस्य किं कृत्यमवशिष्यते ॥ ॥ भ्रमभूतमिदं सर्वं किञ्चिन्नास्तीति निश्चयी । अलक्ष्यस्फुरणः
    शुद्धः स्वभावेनैव शाम्यति ॥ ॥ शुद्धस्फुरणरूपस्य दृश्यभावमपश्यतः । क्व विधिः क्व च वैराग्यं क्व त्यागः
    क्व शमोऽपि वा ॥ ॥ स्फुरतोऽनन्तरूपेण प्रकृतिं च न पश्यतः । क्व बन्धः क्व च वा मोक्षः क्व हर्षः क्व
    विषादिता ॥ ॥ बुद्धिपर्यन्तसंसारे मायामात्रं विवर्तते । निर्ममो निरहङ्कारो निष्कामः शोभते बुधः ॥ ॥
    अक्षयं गतसन्तापमात्मानं पश्यतो मुनेः । क्व विद्या च क्व वा विश्वं क्व देहोऽहं ममेति वा ॥ ॥ निरोधादीनि
    कर्माणि जहाति जडधीर्यदि । मनोरथान् प्रलापांश्च कर्तुमाप्नोत्यतत्क्षणात् ॥ ॥ मन्दः श्रुत्वापि तद्वस्तु
    न जहाति विमूढताम् । निर्विकल्पो बहिर्यत्नादन्तर्विषयलालसः ॥ ॥ ज्ञानाद् गलितकर्मा यो लोकदृष्ट्यापि
    कर्मकृत् । नाप्नोत्यवसरं कर्तुं वक्तुमेव न किञ्चन ॥ ॥ क्व तमः क्व प्रकाशो वा हानं क्व च न किञ्चन ।
    निर्विकारस्य धीरस्य निरातङ्कस्य सर्वदा ॥ ॥ क्व धैर्यं क्व विवेकित्वं क्व निरातङ्कतापि वा । अनिर्वाच्यस्वभावस्य
    निःस्वभावस्य योगिनः ॥ ॥ न स्वर्गो नैव नरको जीवन्मुक्तिर्न चैव हि । बहुनात्र किमुक्तेन योगदृष्ट्या
    न किञ्चन ॥ ॥ नैव प्रार्थयते लाभं नालाभेनानुशोचति । धीरस्य शीतलं चित्तममृतेनैव पूरितम् ॥ ॥ न शान्तं
    स्तौति निष्कामो न दुष्टमपि निन्दति । समदुःखसुखस्तृप्तः किञ्चित् कृत्यं न पश्यति ॥ ॥ धीरो न द्वेष्टि
    संसारमात्मानं न दिदृक्षति । हर्षामर्षविनिर्मुक्तो न मृतो न च जीवति ॥ ॥ निःस्नेहः पुत्रदारादौ निष्कामो
    विषयेषु च । निश्चिन्तः स्वशरीरेऽपि निराशः शोभते बुधः ॥ ॥ तुष्टिः सर्वत्र धीरस्य यथापतितवर्तिनः । स्वच्छन्दं
    चरतो देशान् यत्रस्तमितशायिनः ॥ ॥ पततूदेतु वा देहो नास्य चिन्ता महात्मनः । स्वभावभूमिविश्रान्तिविस्मृताशेषसंसृतेः
    ॥ ॥ अकिञ्चनः कामचारो निर्द्वन्द्वश्छिन्नसंशयः । असक्तः सर्वभावेषु केवलो रमते बुधः ॥ ॥ निर्ममः शोभते
    धीरः समलोष्टाश्मकाञ्चनः । सुभिन्नहृदयग्रन्थिर्विनिर्धूतरजस्तमः ॥ ॥ सर्वत्रानवधानस्य न किञ्चिद् वासना
    हृदि । मुक्तात्मनो वितृप्तस्य तुलना केन जायते ॥ ॥ जानन्नपि न जानाति पश्यन्नपि न पश्यति । ब्रुवन्न्
    अपि न च ब्रूते कोऽन्यो निर्वासनादृते ॥ ॥ भिक्षुर्वा भूपतिर्वापि यो निष्कामः स शोभते । भावेषु गलिता
    यस्य शोभनाशोभना मतिः ॥ ॥ क्व स्वाच्छन्द्यं क्व सङ्कोचः क्व वा तत्त्वविनिश्चयः । निर्व्याजार्जवभूतस्य
    चरितार्थस्य योगिनः ॥ ॥ आत्मविश्रान्तितृप्तेन निराशेन गतार्तिना । अन्तर्यदनुभूयेत तत् कथं कस्य कथ्यते
    ॥ ॥ सुप्तोऽपि न सुषुप्तौ च स्वप्नेऽपि शयितो न च । जागरेऽपि न जागर्ति धीरस्तृप्तः पदे पदे ॥ ॥ ज्ञः
    सचिन्तोऽपि निश्चिन्तः सेन्द्रियोऽपि निरिन्द्रियः । सुबुद्धिरपि निर्बुद्धिः साहङ्कारोऽनहङ्कृतिः ॥ ॥
    न सुखी न च वा दुःखी न विरक्तो न सङ्गवान् । न मुमुक्षुर्न वा मुक्तो न किञ्चिन्न च किञ्चन ॥ ॥ विक्षेपेऽपि
    न विक्षिप्तः समाधौ न समाधिमान् । जाड्येऽपि न जडो धन्यः पाण्डित्येऽपि न पण्डितः ॥ ॥ मुक्तो यथास्थितिस्वस्थः
    कृतकर्तव्यनिर्वृतः । समः सर्वत्र वैतृष्ण्यान्न स्मरत्यकृतं कृतम् ॥ ॥ न प्रीयते वन्द्यमानो निन्द्यमानो
    न कुप्यति । नैवोद्विजति मरणे जीवने नाभिनन्दति ॥ ॥ न धावति जनाकीर्णं नारण्यमुपशान्तधीः । यथातथा यत्रतत्र
    सम एवावतिष्ठते ॥
