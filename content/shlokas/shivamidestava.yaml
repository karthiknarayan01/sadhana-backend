id: shivamidestava
category: stotram
name:
  english: shivamidestava
  devanagari: शिवमीडेस्तव
content:
  english: shrishivamidestavaratnam svaprakashashivarupasadgurum nishprakashajadacaityabhasakam | aprameyasugunamritalayam
    samsmarami hridi nityamadbhutam || 1|| yah kridartham vishvamashesham nijashaktya srishtva svasmin
    kridati devo'pyanavadyah | nistraigunyo mayikabhumivyatiriktah tam sarvaghadhvamsakamadyam shivamide
    || 2|| eko devo bhati tarangeshviva bhanuh nanabhuteshvatmasu sarveshvapi nityam | shuddho buddho
    nirmalarupo niravadyah tam sarvaghadhvamsakamadyam shivamide || 3|| devadhisham sarvavarenyam hridayabje
    nityam dhyatva yogivara yam dridhabhaktya | shuddha bhutva yanti bhavabdhim na punaste tam sarvaghadhvamsakamadyam
    shivamide || 4|| shrautaih smartaih karmashataishcapi ya isho durvijneyah kalpashatam tairjadarupaih
    | samvidrupasvaikavicaradadhigamyah tam sarvaghadhvamsakamadyam shivamide || 5|| karmadhyakshah kamijananam
    phaladata kartritvahankaravimukto nirapekshah | dehatito drishyavivikto jagadishah tam sarvaghadhvamsakamadyam
    shivamide || 6|| nantarbahye nobhayato va pravibhaktam yam sarvajnam napi samartho nigamadih | tattvatitam
    tatpadalakshyam gurugamyam tam sarvaghadhvamsakamadyam shivamide || 7|| yadbhasarko bhati himamshurdahano
    va drishyairbhasyairyo na ca bhati priyarupah | yasmad bhati vyashtisamashtyatmakametat tam sarvaghadhvamsakamadyam
    shivamide || 8|| ashadeshadyavyavadhano vibhurekah sarvadharah sarvaniyanta paramatma | purnanandah
    sattvavatam yo hridi devah tam sarvaghadhvamsakamadyam shivamide || 9|| ko'ham devah kim jagadetat
    pravicarad drishyam sarvam nashvararupam guruvakyat | siddhe caivam yah khalu sheshah pratipannah
    tam sarvaghadhvamsakamadyam shivamide || 10|| satyam jnanam brahma sukham yam pranavantam sarvasphurtih
    shashvatarupastviti vedah | jalpantyevam svacchadhiyo'pi prabhumekam tam sarvaghadhvamsakamadyam shivamide
    || 11|| yasmad bhito vati ca vayustripureshu brahmendradyaste nijakarmasvanubaddhah | candradityau
    lokasamuhe pracarantau tam sarvaghadhvamsakamadyam shivamide || 12|| mayakaryam janma ca nashah purajetuh
    nasti dvandvam nama ca rupam shrutivakyat | nirnitartho nityavimukto nirapayah tam sarvaghadhvamsakamadyam
    shivamide || 13|| nayam deho nendriyavargo na ca vayuh nedam drishyam jatyabhimano na ca buddhih |
    ittham shrutya yo guruvakyat pratilabdhah tam sarvaghadhvamsakamadyam shivamide || 14|| sthulam sukshmam
    kshamamanekam na ca dirgham hrasvam shuklam krishnamakhando'vyayarupah | pratyaksakshi yah paratejah
    pranavantah tam sarvaghadhvamsakamadyam shivamide || 15|| yatsaukhyabdherleshakanamshoh suramartya
  devanagari: श्रीशिवमीडेस्तवरत्नम् स्वप्रकाशशिवरूपसद्गुरुं निष्प्रकाशजडचैत्यभासकम् । अप्रमेयसुगुणामृतालयं
    संस्मरामि हृदि नित्यमद्भुतम् ॥ १॥ यः क्रीडार्थं विश्वमशेषं निजशक्त्या सृष्ट्वा स्वस्मिन् क्रीडति देवोऽप्यनवद्यः
    । निस्त्रैगुण्यो मायिकभूमिव्यतिरिक्तः तं सर्वाघध्वंसकमाद्यं शिवमीडे ॥ २॥ एको देवो भाति तरङ्गेष्विव
    भानुः नानाभूतेष्वात्मसु सर्वेष्वपि नित्यम् । शुद्धो बुद्धो निर्मलरूपो निरवद्यः तं सर्वाघध्वंसकमाद्यं
    शिवमीडे ॥ ३॥ देवाधीशं सर्ववरेण्यं हृदयाब्जे नित्यं ध्यात्वा योगिवरा यं दृढभक्त्या । शुद्धा भूत्वा
    यान्ति भवाब्धिं न पुनस्ते तं सर्वाघध्वंसकमाद्यं शिवमीडे ॥ ४॥ श्रौतैः स्मार्तैः कर्मशतैश्चपि य ईशो
    दुर्विज्ञेयः कल्पशतं तैर्जडरूपैः । संविद्रूपस्वैकविचारादधिगम्यः तं सर्वाघध्वंसकमाद्यं शिवमीडे ॥ ५॥
    कर्माध्यक्षः कामिजनानां फलदाता कर्तृत्वाहङ्कारविमुक्तो निरपेक्षः । देहातीतो दृश्यविविक्तो जगदीशः तं
    सर्वाघध्वंसकमाद्यं शिवमीडे ॥ ६॥ नान्तर्बाह्ये नोभयतो वा प्रविभक्तं यं सर्वज्ञं नापि समर्थो निगमादिः
    । तत्त्वातीतं तत्पदलक्ष्यं गुरुगम्यं तं सर्वाघध्वंसकमाद्यं शिवमीडे ॥ ७॥ यद्भासार्को भाति हिमांशुर्दहनो
    वा दृश्यैर्भास्यैर्यो न च भाति प्रियरूपः । यस्माद् भाति व्यष्टिसमष्ट्यात्मकमेतत् तं सर्वाघध्वंसकमाद्यं
    शिवमीडे ॥ ८॥ आशादेशाद्यव्यवधानो विभुरेकः सर्वाधारः सर्वनियन्ता परमात्मा । पूर्णानन्दः सत्त्ववतां यो
    हृदि देवः तं सर्वाघध्वंसकमाद्यं शिवमीडे ॥ ९॥ कोऽहं देवः किं जगदेतत् प्रविचाराद् दृश्यं सर्वं नश्वररूपं
    गुरुवाक्यात् । सिद्धे चैवं यः खलु शेषः प्रतिपन्नः तं सर्वाघध्वंसकमाद्यं शिवमीडे ॥ १०॥ सत्यं ज्ञानं
    ब्रह्म सुखं यं प्रणवान्तं सर्वस्फूर्तिः शाश्वतरूपस्त्विति वेदाः । जल्पन्त्येवं स्वच्छधियोऽपि प्रभुमेकं
    तं सर्वाघध्वंसकमाद्यं शिवमीडे ॥ ११॥ यस्माद् भीतो वाति च वायुस्त्रिपुरेषु ब्रह्मेन्द्राद्यास्ते निजकर्मस्वनुबद्धाः
    । चन्द्रादित्यौ लोकसमूहे प्रचरन्तौ तं सर्वाघध्वंसकमाद्यं शिवमीडे ॥ १२॥ मायाकार्यं जन्म च नाशः पुरजेतुः
    नास्ति द्वन्द्वं नाम च रूपं श्रुतिवाक्यात् । निर्णीतार्थो नित्यविमुक्तो निरपायः तं सर्वाघध्वंसकमाद्यं
    शिवमीडे ॥ १३॥ नायं देहो नेन्द्रियवर्गो न च वायुः नेदं दृश्यं जात्यभिमानो न च बुद्धिः । इत्थं श्रुत्या
    यो गुरुवाक्यात् प्रतिलब्धः तं सर्वाघध्वंसकमाद्यं शिवमीडे ॥ १४॥ स्थूलं सूक्ष्मं क्षाममनेकं न च दीर्घं
    ह्रस्वं शुक्लं कृष्णमखण्डोऽव्ययरूपः । प्रत्यक्साक्षी यः परतेजाः प्रणवान्तः तं सर्वाघध्वंसकमाद्यं शिवमीडे
    ॥ १५॥ यत्सौख्याब्धेर्लेशकणांशोः सुरमर्त्या
