id: pancapancashannamasthalastotram
category: stotram
name:
  english: pancapancashannamasthalastotram
  devanagari: पन्चपन्चाशन्नामस्थलस्तोत्रम्
content:
  english: sarvagah sarvabhuto'ham na hi kincinmaya vina | caracare jagatyasminvidyate kurusattama ||
    9|| tathapi yeshu sthaneshu cintaniyo'hamarjuna | stotavyo namabhiryaistu shruyatam tadvadami te ||
    10|| pushkare pundarikaksham gayayam ca gadadharam | lohadande tatha vishnum stuvamstarati dushkritam
    || 11|| kamakhye kumaram nepale lokabhavanam raghavam citrakute tu prabhase daityasudanam | vrindavane
    ca govindam ma stuvanpunyabhagbhavet || 12|| mandodapane vaikuntham mahantre cacyutam vibhum jayam
    jayantyam tadvacca jayantam hastinapure | varaham kardamale tu kashmire cakrapaninam || 13|| janardanam
    ca kubjamre mathurayam ca keshavam | kubjake shridharam tadvadgangadvare surottamam || 14|| shalagrame
    mahayogim harim govardhanacale | pindarake caturbahum shankhoddhare ca shankhinam || 15|| vamanam
    ca kurukshetre yamunayam trivikramam vanamalam ca kishkindhayam devam raivatake dvija kashijale mahayogam
    devam camitatejasam vaishakhayupe ajitam virajayam viprapriyam | vishveshvaram tatha shone kapilam
    purvasagare || 16|| shvetadvipapatim capi gangasagarasangame | bhudharam devikanadyam prayage caiva
    madhavam || 17|| naranarayanakhyam ca tatha badarikashrame | samudre dakshine stavyam padmanabheti
    phalguna || 18|| dvarakayam tatha krishnam stuvamstarati durgatim | ramam nama mahendradrau hrishikesham
    tatharbude || 19|| ashvatirthe hayagrivam vishvarupam himacale | nrisimham kritashauce ca vipashayam
    dvijapriyam || 20|| naimishe yajnapurusham jambumarge tathacyutam | anantam saindhavaranye dandake
    sharngadharinam || 21|| utpalavartake shaurim narmadayam shriyahpatim | damodaram raivatake nandayam
    jalashayinam || 22|| sarvayogeshvaram caiva sindhusagarasangame | sahyadrau devadevesham vaikuntham
    magadhe vane || 23|| sarvapapaharam vindhye udreshu purushottamam | hridaye capi kaunteya paramatmanamatmanah
    || 24|| vate vate vaishravanam catvare catvare shivam | parvate parvate ramam sarvatra madhusudanam
    || 25|| naram bhumau tatha vyomni kaunteya garudadhvajam | vasudevam ca sarvatra samsmaranjyotisham
    patim || 26|| arcayanpranamamstu tvam samsmaramshca dhananjaya | eteshvetani namani narah papaih pramucyate
    || 27|| sthaneshveteshu mannamnametesham prinanam narah | dvijanam prinanam kritva svargaloke'bhijayate
    || 28|| iti vishnudharmeshu shattrimsho'dhyayantargatam shrikrishnaproktam pancapancashannamasthalastotram
    sampurnam |
  devanagari: सर्वगः सर्वभूतोऽहं न हि किञ्चिन्मया विना । चराचरे जगत्यस्मिन्विद्यते कुरुसत्तम ॥ ९॥ तथापि
    येषु स्थानेषु चिन्तनीयोऽहमर्जुन । स्तोतव्यो नामभिर्यैस्तु श्रूयतां तद्वदामि ते ॥ १०॥ पुष्करे पुण्डरीकाक्षं
    गयायां च गदाधरम् । लोहदण्डे तथा विष्णुं स्तुवंस्तरति दुष्कृतम् ॥ ११॥ कामाख्ये कुमारं नेपाले लोकभावनं
    राघवं चित्रकूटे तु प्रभासे दैत्यसूदनम् । वृन्दावने च गोविन्दं मा स्तुवन्पुण्यभाग्भवेत् ॥ १२॥ मन्दोदपाने
    वैकुण्ठं माहन्त्रे चाच्युतं विभुं जयं जयन्त्यां तद्वच्च जयन्तं हस्तिनापुरे । वाराहं कर्दमाले तु काश्मीरे
    चक्रपाणिनम् ॥ १३॥ जनार्दनं च कुब्जाम्रे मथुरायां च केशवम् । कुब्जके श्रीधरं तद्वद्गङ्गाद्वारे सुरोत्तमम्
    ॥ १४॥ शालग्रामे महायोगिं हरिं गोवर्धनाचले । पिण्डारके चतुर्बाहुं शङ्खोद्धारे च शङ्खिनम् ॥ १५॥ वामनं
    च कुरुक्षेत्रे यमुनायां त्रिविक्रमं वनमालं च किष्किन्धायां देवं रैवतके द्विज काशीजले महायोगं देवं
    चामिततेजसं वैशाखयूपे अजितं विरजायां विप्रप्रियम् । विश्वेश्वरं तथा शोणे कपिलं पूर्वसागरे ॥ १६॥ श्वेतद्वीपपतिं
    चापि गङ्गासागरसङ्गमे । भूधरं देविकानद्यां प्रयागे चैव माधवम् ॥ १७॥ नरनारायणाख्यं च तथा बदरिकाश्रमे
    । समुद्रे दक्षिणे स्तव्यं पद्मनाभेति फाल्गुन ॥ १८॥ द्वारकायां तथा कृष्णं स्तुवंस्तरति दुर्गतिम् ।
    रामं नाम महेन्द्राद्रौ हृषीकेशं तथार्बुदे ॥ १९॥ अश्वतीर्थे हयग्रीवं विश्वरूपं हिमाचले । नृसिंहं कृतशौचे
    च विपाशायां द्विजप्रियम् ॥ २०॥ नैमिषे यज्ञपुरुषं जम्बूमार्गे तथाच्युतम् । अनन्तं सैन्धवारण्ये दण्डके
    शार्ङ्गधारिणम् ॥ २१॥ उत्पलावर्तके शौरिं नर्मदायां श्रियःपतिम् । दामोदरं रैवतके नन्दायां जलशायिनम्
    ॥ २२॥ सर्वयोगेश्वरं चैव सिन्धुसागरसङ्गमे । सह्याद्रौ देवदेवेशं वैकुण्ठं मागधे वने ॥ २३॥ सर्वपापहरं
    विन्ध्ये उड्रेषु पुरुषोत्तमम् । हृदये चापि कौन्तेय परमात्मानमात्मनः ॥ २४॥ वटे वटे वैश्रवणं चत्वरे
    चत्वरे शिवम् । पर्वते पर्वते रामं सर्वत्र मधुसूदनम् ॥ २५॥ नरं भूमौ तथा व्योम्नि कौन्तेय गरुडध्वजम्
    । वासुदेवं च सर्वत्र संस्मरञ्ज्योतिषां पतिम् ॥ २६॥ अर्चयन्प्रणमंस्तु त्वं संस्मरंश्च धनञ्जय । एतेष्वेतानि
    नामानि नरः पापैः प्रमुच्यते ॥ २७॥ स्थानेष्वेतेषु मन्नाम्नामेतेषां प्रीणनं नरः । द्विजानां प्रीणनं
    कृत्वा स्वर्गलोकेऽभिजायते ॥ २८॥ इति विष्णुधर्मेषु षट्त्रिंशोऽध्यायान्तर्गतं श्रीकृष्णप्रोक्तं पञ्चपञ्चाशन्नामस्थलस्तोत्रं
    सम्पूर्णम् ।
