id: vishnustotrammarkandeyaproktam
category: stotram
name:
  english: vishnustotrammarkandeyaproktam
  devanagari: विष्णुस्तोत्रम्मार्कण्डेयप्रोक्तं
content:
  english: markandeyaproktam vishnustotram vyaktavyaktasvarupaya sadasadvyaktirupine | sthulaya sukshmarupaya
    vishvarupaya vedhase || 19|| nityaya nityajnanaya nirvikaraya tejase | vidyavidyasvarupaya kalarupaya
    vai namah || 20|| nirmalayormishatkadirahitaya viragine | vyapine vishvarupaya srishtisthityantakarine
    || 21|| yogibhishcintyate yo'sau vedantantagacintakaih | antarantah paranjyotihsvarupam pranamami
    tam || 22|| iti kalikapurane prathamadhyayantargatam markandeyaproktam vishnustotram sampurnam |
  devanagari: मार्कण्डेयप्रोक्तं विष्णुस्तोत्रम् व्यक्ताव्यक्तस्वरूपाय सदसद्व्यक्तिरूपिणे । स्थूलाय सूक्ष्मरूपाय
    विश्वरूपाय वेधसे ॥ १९॥ नित्याय नित्यज्ञानाय निर्विकाराय तेजसे । विद्याविद्यास्वरूपाय कालरूपाय वै नमः
    ॥ २०॥ निर्मलायोर्मिषट्कादिरहिताय विरागिणे । व्यापिने विश्वरूपाय सृष्टिस्थित्यन्तकारिणे ॥ २१॥ योगिभिश्चिन्त्यते
    योऽसौ वेदान्तान्तगचिन्तकैः । अन्तरन्तः परञ्ज्योतिःस्वरूपं प्रणमामि तम् ॥ २२॥ इति कालिकापुराणे प्रथमाध्यायान्तर्गतं
    मार्कण्डेयप्रोक्तं विष्णुस्तोत्रं सम्पूर्णम् ।
meaning: {}
