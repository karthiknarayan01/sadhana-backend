id: umasahasranamastotram-3
category: stotram
name:
  english: umasahasranamastotram
  devanagari: उमासहस्रनामस्तोत्रम्
content:
  english: prathamashatakam dvitiyashatakam tritiyashatakam caturthashatakam pancamashatakam shashthamashatakam
    saptamashatakam ashtamashatakam navamashatakam dashamashatakam
  devanagari: प्रथमशतकम् द्वितीयशतकम् तृतीयशतकम् चतुर्थशतकम् पञ्चमशतकम् षष्ठमशतकम् सप्तमशतकम् अष्टमशतकम्
    नवमशतकम् दशमशतकम्
meaning: {}
