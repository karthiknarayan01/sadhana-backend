    drishtya manasa vacasa tatha | padbhya 'shtangamucyate || om shri ramasahita satyanarayana svamine
    nama ssashtanga namaskaram samarpayami | sarvopacarah om shri ramasahita satyanarayana svamine nama
    shchatram acchadayami | om shri ramasahita satyanarayana svamine nama shcamarairvijayami | om shri
    ramasahita satyanarayana svamine namah nritya shayami | om shri ramasahita satyanarayana svamine namah
    gitam shravayami | om shri ramasahita satyanarayana svamine namah andolikannarohayami | om shri ramasahita
    satyanarayana svamine namah ashvanarohayami | om shri ramasahita satyanarayana svamine namah gajanarohayami
    | samasta rajopacara ndevopacaran samarpayami | kshamaprarthana yasya smritya ca namoktya tapah puja
    kriyadishu | nyunam sampurnatam ya~ti sadyo vande tamacyutam | mantrahina njanardana | yatpujita ntadastu
    te | anaya purushasukta vidhanena dhyana avahanadi shodashopacara pujanena bhagavan sarvatmaka shshri
    ramasahita satyanarayana svami suprito suprasanno varado bhavantu || ndaityasudanam | hrishikesha
    ngarudhadhvajam | janardana njanakivallabham harim || pranamami sada bhaktya narayanamatah param |
    durgame vishame ghore shatruna paripiditah | nistarayatu sarveshu tatha 'nishtabhayeshu ca | namanyetani
    sankirtya phalamipsitamapnuyat | satyanarayana devam mprabhum | lilaya vitatam ye~na tasmai namo namah
    || om shri ramasahita satyanarayana svamine namah prarthana namaskaran samarpayami | phalam ida mpuratastava
    | tena me sa phala 'vaptirbhavejjanmani janmani || om shri ramasahita satyanarayana svamine namah
    phalam samarpayami | shri satyanarayana svami vratakatha || shri ganeshaya namah || || shriparamatmane
    namah || atha katha prarambhah | atha prathamo 'dhyayah shrivyasa uvaca | ekada naimisharanye rishaya
    shshaunakadayah | papracchurmunaya || rishaya ucuh | vratena tapasa kim va~ prapyate vanchita mphalam
    | tatsarvam shrotumicchamah kathayasva mahamune || || suta uvaca | naradenaiva samprishto bhagavan
    kamalapatih | surar shaye yathaivaha tacchrinudhvam samahitah || || ekada narado yogi paranugrahakankshaya
    | paryatan vividha nmartyalokamupagatah || || tatodrishtva janansarva nnanakleshasamanvitan | nanayonisamutpannan
    klishyamanan svakarmabhih || nduhkhanasho bhaved dhruvam | iti sancintya manasa vishnuloka ndevadevesham
    stotum samupacakrame | narada uvaca | namo vangamanasatitarupayanantashaktaye | adimadhyantahinaya
    nirgunaya gunatmane || || sarveshamadibhutaya bhaktanamartinashine | shrutva stotra || shribhagavanuvaca
    | kimarthamagato nte manasi vartate | kathayasva mahabhaga tatsarva || narada uvaca | martyaloke jana
    ssarve nanakleshasamanvitah | nanayonisamutpannah pacyante papakarmabhih || || tatkatham shamayennatha
    laghupayena tadvada | shrotumicchami tatsarva nkripasti yadi te mayi || || shribhagavanuvaca | sadhu
    prishta ntvaya vatsa lokanugrahakankshaya | yatkritva mucyate moha ttacchrinushva vadami te || ||
    vratamasti mahatpunyam svarge martye ca durlabham | tava snehanmaya vatsa prakashah kriyate || satyanarayanasyaiva
    vratam samyagvidhanatah | mbhuktva paratra mokshamapnuyat | tacchrutva bhagavadvakya nnarado munirabravit
    || nkenaiva tad vratam | tatsarvam vi~starad bruhi kada karyam shribhagavanuvaca | duhkhashokadishamana
    ndhanadhanyapravardhanam || || saubhagyasantatikaram sarvatra vijayapradam | yasmin kasmi ndine martyo
    bhaktishraddhasamanvitah || ya~jeccaiva nishamukhe | brahmanairbandhavaishcaiva sahito dharmatatparah
    || mbhakshyamuttamam | rambhaphala ngodhumasya ca curnakam || va~ sharkara va gudastatha | sapadam
    sarvabhakshyani caikikritya nivedayet || ssaha | tatashca bandhubhi vi~pramshca pratibhojayet || mbhakshayed
    bhaktya nrityagitadika ncaret | tatashca svagriha thsatyanarayanam smarann || va~nchasiddhirbhaved
    dhruvam | visheshatah kaliyuge laghupayo || iti shriskandapurane revakhande shrisatyanarayana vratakathaya
    'dhyayah suta uvaca | athanya thsampravakshyami kritam ye~na pura dvijah | kashci tkashipure ramye
    hyasidvipro hyasidviprotinirdhanah vya~kulobhutva nitya mbabhrama bhutale | duhkhita || vriddhabrahmana
    rupasta mpapraccha dvijamadarat | kimartha nnityam suduhkhitah | tatsarvam shrotumicchami kathyata
    || brahmana uvaca | brahmano ya~di janasi kripaya kathaya prabho | vriddhabrahmana uvaca | satyanarayano
    vishnurvanchitarthaphalapradah || vi~pra kurushva vratamuttamama | yatkritva sarvaduhkhebhyo mukto
    bhavati manavah || nca vratasyapi viprayabhashya yatnatah | satyanarayano vriddhastatraivantaradhiyata
    || || tad vratam sankarishyami yadukta mbrahmanena vai | iti sancintya vipro 'sau ratrau nidra na
    labdhavan || ssamutthaya satyanarayanavratam | karishya iti sankalpya bhiksharthamagamadvijah || bhiksharthamagamaddvijah
    tasminneva dine viprah pracura ndravyamaptavan | tenaiva bandhubhi ssardham satyasyavratamacarat ||
    || sarvaduhkhavinirmukta ssarvasampatsamanvitah | babhuva sa dvijashreshtho vratasyasya prabhavatah
    || nkritva dvijottamah || || sarvapapavinirmukto durlabha mmokshamaptavan | vratamasya yada vipra
    prithivyam sankarishyati || ntu manujasya vinashyati | tkathayami vah | rishaya ucuh | tasmad vipracchruta
    mmune | tatsarvam shrotumicchama mbhuvi | ekada sa dvijavaro yathavibhava vistaraih || nkartum samudyatah
    | etasminnantare kale kashthakreta samagamat || nca samsthapya viprasya grihamayayau | trishnaya piditatma
    ca drishtva vipra nkriyate tvaya | krite ki mphalamapnoti vistarad vada me prabho || vipra uvaca |
    satyanarayanesyedam vra~tam sarvepsitapradam | tasya prasadanme sarva njnatva kashthakreta mmanasa
    ityacintayat | kashtham vi~krayato grame prapyate cadya yad dhanam || tenaiva satyadevasya karishye
    vratamuttamam | iti sancintya manasa kashtha ndhritva tu mastake || || jagama nagare ramye dhaninam
    ya~tra samsthitih | taddine kashthamulya nkadali phalam | sharkaraghritadugdha nca godhumasya ca curnakam
    || nca grihitva svagriham ya~yau | tato bandhun samahuya cakara vidhina vratam || || tad vratasya
    prabhavena dhanaputranvito mbhuktva cante satyapuram || || iti shriskandapurane revakhande shrisatyanarayana
    vratakathaya 'dhyayah suta uvaca | punaragre pravakshyami sha mmuni sattamah | pura colkamukho nama
    nripashcasinmahamatih || ssatyavadi yayau devalaya mprati | dine dine dhana ndattva dvijan santoshaya
    || bharya tasya pramugdha ca sarojavadana sati | bhadrashilanadi tire satyasyavratamacarat || || etasminnantare
    tatra sadhureka ssamagatah | vanijyartha mbahudhanairanekaih paripuritah || || navam samsthapya tattire
    jagama nripati mprati | drishtva sa vratina mprapaccha vinayanvitah || nbhaktiyuktena cetasa | prakasha
    nkuru tatsarvam shrotumicchami sampratam || nkriyate sadho vishnoratulatejasah | vrata mputradyavapti
    kamyaya || || bhupasya vacanam shrutva sadhuh provaca sadaram | sarva nkathaya me rajan karishye ||
    mamapi santatirnasti hyetasmajjayate dhruvam | tato nivrittya vanijya thsanando grihamagatah || ||
    bharyayai kathitam sarvam vra~tam santati dayakam | tada vrata nkarishyami yada me santatirbhavet
    || ndivase tasya bharya lilavati sati || bhartriyuktanandacitta 'bhavad dharmaparayana | rgabhini
    sa ttasya bharya satyaprasadatah || dashame masi vai tasyah kanyaratnamajayata | dine dine sa vavridhe
    shuklapakshe yatha shashi || || namna kalavati ceti tannamakarana nkritam | tato lilavati praha svamina
    vra~tam | sadhuruvaca | vivaha samaye tvasyah karishyami vrata || iti bharyam samashvasya jagama nagara
    mprati | tatah kalavati kanya vavridhe pitriveshmani || ssaha | mantrayitva druta mpreshayamasa dharmavit
    || nca kanyaya varam shreshtham vi~caraya | tenajnaptashca duto va~nikputram samadayagato hi sah |
    drishtva tu sundara mparitushtena cetasa | dattavan sadhuputraya kanyam vivahasamaye tasyastena rushto
    bhava tatah kalena niyato nijakarma visharadah | vanijyartha njamatri sahito vanik || || ratnasarapure
    ramye gatva sindhu samipatah | vanijyamakaro thsadhurjamatra shrimata saha || || tau gatau nagare
    ramye candraketornripasya ca | etasminneva kale tu satyanarayanah prabhuh || || bhrashtapratijnamalokya
    shapa ntasmai pradattavan | daruna || ekasmindivase rajno dhanamadaya taskarah | tatraiva cagata shcauro
    vanijau yatra samsthitau || ndrishtava bhitena cetasa | dhanam samsthapya tatraiva sa tu shighramalakshitah
    || || tato dutassamayata yatraste sajjano vanik | drishtva nripadhana shena dhavamanashca procurnripasamipatah
    | taskarau dvau samanitau vilokyajnapaya prabho || mbaddhva tu ta vubhau | sthapitau dvau mahadurge
    karagare || mayaya satyadevasya na shruta nkaistayorvacah | atastayordhanam rajna grihita || tacchapacca
    tayorgehe bharya caivati duhkhita | caurenapahritam sarva || adhivyadhisamayukta kshutpipashati duhkhita
    | annacintapara bhutva babhrama ca grihe grihe | kalavati tu kanyapi babhrama prativasaram || ndivase
    yata kshudharta dvijamandiram | ntatra satyanarayanasya ca || upavishya katham shrutva varam rprathitavatyapi
    | prasada bhakshana nkritva yayau ratrau griha nkathayamasa prematah | putri ratrau sthita kutra ki
    || kanya kalavati praha matara mprati satvaram | dvijalaye vrata || tacchrutva kanyaka vakyam nkartum
    samudyata | sa muda tu vanigbharya satyanarayanasya ca || ncakre saiva sadhvi bandhubhi ssaha | bhartrijamatarau
    kshipramagacchetam svamashramam || nca me bharturjamatuh hasi | vratenanena tushto 'sau satyanarayanah
    punah || shayamasa svapnam hi candraketu nnripottamam | bandinau mocaya pratarvanijau nripasattama
    || nnashayishyami sarajyadhanaputrakam || tatah prabhatasamaye raja ca svajanai || upavishya sabhamadhye
    praha svapna mprati | baddhau mahajanau shighra mmocaya dvau vaniksutau || shshrutva mocayitva mahajanau
    | samaniya nripasyagre prahuste vinayanvitah || || anitau dvau vanikputrau muktau nigadabandhanat
    | tato mahajanau natva candraketu || smarantau purva vrittanta nnocaturbhayavihvalau | raja vaniksutau
    vikshya vacah provaca sadaram || nnasti vai bhayam | tada nigadasantyaga nkshaurakarmadyakarayat ||
    ndattva paritoshya nripashca tau | puraskritya vanikputrau vacasa ndvigunikritya dattavan | provaca
    ca tato raja gaccha sadho nijashramam || mpranipatyaha gantavya ntvatprasadatah | ityuktva tau mahavaishyau
    jagmatu || iti shriskanda purane revakhande shrisatyanarayana vratakathaya 'dhyayah suta uvaca | yatra
    ntu kritavan sadhurmangalayanapurvikam | brahmanebhyo dhana ndattva tada tu nagaram || kiyad dure
    gate sadho satyanarayanah prabhuh | jijnasa nkritavan sadhau kimasti tava nausthitam || || tato mahajanau
    mattau helaya ca prahasya vai | ncaiva vartate taranau mama | nishthura ndandi tasya samipatah | kiyad
    dure tato gatva sthita || gate dandini sadhushca kritanityakriyastada | utthita ncaiva murcchito nyapatad
    bhuvi | labdhasanjno vanikputrastatashcintanvito vanikputrastatashcintanvitobhavat tada tu duhituh
    kanto vacana ncedamabravit | kimartha shshapo dattashca dandina || || shakyate tena sarvam hi kartu
    ya~mo vanchatartho bhavishyati || jamaturvacanam shrutva tatsakasha ngatastada | drishtva ca dandina
    mbhaktya natva provaca sadaram || mpunah punarnatva mahashokakulo vi~lokya ca | ma rodi mmama pujabahirmukhah
    || || mamajnaya ca durbuddhe labdha mmuhurmuhuh | tacchrutva bhagavadvakyam stuti || sadhuruvaca |
    tvanmayamohita ssarve brahmadyastridivaukasah | na jananti guna njane mohitastavamayaya | prasida
    pujayishyami yathavibhavavistaraih || ntrahi mam sharanagatam | shrutva bhaktiyutam mparitushto janardanah
    || ndattva tatraivantardadhe harih | tato navam samaruhya drishtva vittaprapuritam || || kripaya satyadevasya
    saphalam mmama | ityuktva svajanai tpurnassatyadevaprasadatah | navam sam yo~jya yatnena svadeshagamana
    mpraha pashya ratnapuri nca preshayamasa nijavittasya rakshakam || nnatva baddhanjalistada || || nikate
    nagarasyaiva jamatra sahito vanik | agato bandhuvargaishca vittaishca bahubhiryutah || || shrutva
    dutamukhadvakya ntatah kritva provaca tanuja || vrajami shighramagaccha sadhusandar nca parityajya
    gata sa njale tasyavamajjayat | tatah kalavati kanya na vilokya nija || shokena mahata tatra rudanti
    capatad bhuvi | || bhitena manasa sadhuh kimashcaryamida mbhavet | cintyamanashca te sarve babhuvustarivahakah
    || ndrishtva sa vihvala 'bhavat | vilalapatiduhkhena bhartara 'bhudalakshitah | na jane kasya devasya
    helaya caiva sa hrita || || satyadevasya mahatmya va~ kena shakyate | ityuktva vilalapaiva tatashca
    svajanai nkraude kritva ruroda ha | tatahkalavati kanya nashte svamini duhkhita || || grihitva paduke
    tasyanugatu || atishokena santaptashcintayamasa dharmavit | hritam va~ satyadevena bhranto nkarishyami
    yathavibhavavistaraih | iti sarvan samahuya kathayitva manoratham || || natva ca dandavad bhumau satyadeva
    mpunah punah | tatastushta nkripaya bhaktavatsalah | tyaktva prasada 'bhavattasyah kanyakayah patirdhruvam
    | griha labdhabhartri suta sadho bhavishyati na samshayah | kanyaka tadrisham va~kyam shrutva gaganamandalat
    || nca bubhoja sa | pashca tatah kalavati kanya jagada pitara || tacchrutva kanyakavakyam santushto
    'bhudvaniksutah | pujanam satyadevasya kritva vidhividhanatah || njagama nijamandiram | paurnamasya
    nca sankrantau kritavan satyasya pujanam || mbhuktva cante satyapuram || || iti shriskanda purane
    revakhande shrisatyanarayana vratakathaya 'dhyayah suta uvaca | athanyacca pravakshyami shrunudhva
    ttungadhvajo raja prajapalanatatparah || || prasadam satyadevasya tyaktva duhkhamavapa sah | ekada
    sa vana ngatva hatva bahuvidha nca drishtva satyasya pujanam | gopah kurvanti santushta bhaktiyukta
    || raja drishtva tu darpena na gato na nanama sah | tato gopagana || samsthapya punaragatya bhuktatva
    sarve yathepsitam | tatah prasadam santyajya raja duhkhamavapa sah || nca yat | satyadevena tatsarva
    || atastatraiva gacchami yatra devasya pujanam | manasa tu vinishcitya yayau gopalasannidhau || ngopaganaissaha
    | bhaktishraddhanvito bhutva cakara vidhina nripah || || satyadevaprasadena dhanaputranvito mbhuktatva
    cante satyapuram mbhaktiyuktah phalapradam || thsatyaprasadatah | daridro labhate vitta mbaddho mucyeta
    bandhanat || tpramucyeta satyameva na samshayah | ipsita mbhuktva cante satyapuram ssatyanarayanavratam
    | ya tkritva sarvaduhkhebhyo mukto bhavati manavah || || visheshatah kaliyuge satyapuja phalaprada
    | keci ntathapare | nanarupadharo bhutva sarveshamipsitapradam || bhavishyati kalau satyavratarupi
    sanatanah | shrivishnuna dhritam rupam sarveshamipsitapradam || rinoti munisattamah | tasya nashyanti
    papani satyadevaprasadatah || mpurvam satyanarayanasya ca | tesha ntvaparajanmani kathayami munishvarah
    || || shatanandomahaprajnassudamabrahmano hyabhut | tasminjanmani shrikrishna ndhyatva mokshamavapa
    ha || || kashthabharavaho bhillo guharajo babhuva ha | tasminjanmani shriramam sevya moksha || ulkamukho
    maharajo nripo dasharatho 'bhavat | shriranganatham sampujya shrivaikuntha shriramacandrasamprapya
    ssatyasandhashca sadhurmoradhvajo nkrakacaishchittva datva mokshamavapa ha || nbhagavatan kritva shrivaikuntha
    bhutva gopashca te sarve vrajamandalavasinah | nihatya rakshasan sarva || || iti shriskandapurane
    revakhande shrisatyanarayana vratakathaya akala mrityuharanam sarvavyadhi nivaranam | samasta papakshayakaram
    shri satyanarayana padodaka mpavanam shubham || shri ramasahita satyanarayana svami prasadam shirasa
    grihnami || shri ramasahita satyanarayana svamine namah || kalashodvasana yajnena yajnamayajanta devah
    | tani dharmani prathamanyasann | te ha naka mmahimanah sacante | yatra purve sadhya ssanti devah
    || shri ramasahita satyanarayana svamine namah avahita sarvebhyo devebhyo nama ssarvabhyo devatabhyo
    namah yatha sthana mpraveshayami || shobhanarthe kshemaya punaragamanaya ca | samasta sanmangalani
    bhavantu || sarvejana ssukhino bhavantu || om shanti shshantih | svasti ||
  devanagari: पूर्वाङ्ग पूजा श्रीमहागणाधिपतये नमः । श्री गुरुभ्यो नमः । हरिः ओम् । शुचिः अपवित्रः पवित्रो
    वा सर्वावस्था त्पुण्डरीकाक्षं स बाह्याभ्यन्तर श्शुचिः ॥ पुण्डरीकाक्ष पुण्डरीकाक्ष पुण्डरीकाक्षाय नमः
    ॥ प्रार्थना शुक्लाम्बरधरं ञ्चतुर्भुजम् । प्रसन्नवदन थ्सर्वविघ्नोपशान्तये ॥ अगजानन पद्मार्क ङ्गजाननमहर्निशम्
    । अनेकद म्भक्तानां एकदन्तमुपास्महे ॥ दे॒वीं वाँच॑मजनयन्त दे॒वास्तां विँ॒श्वरू॑पाः प॒शवो॑ वदन्ति ।
    सा नो॑ म॒न्द्रेष॒मूर्ज॒ न्दुहा॑ना धे॒नुर्वाग॒स्मानुप॒ सुष्टु॒तैतु॑ ॥ य श्शिवो नाम रूपाभ्यां याँ देवी
    सर्वमङ्गला । तयो स्संस्मरणान्नित्यं सर्वदा जय मङ्गलम् ॥ तदेव लग्नं सुदिन न्तदेव लक्ष्मीपते ते ऽङ्घ्रियुगं
    स्मरामि ॥ गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरु त्परब्रह्म तस्मै श्रीगुरवे नमः ॥
    लाभस्तेषा म्पराभवः । एषामिन्दीवरश्यामो हृदयस्थो जनार्दनः ॥ सर्वमङ्गल माङ्गल्ये शिवे सर्वार्थसाधिके
    । शरण्ये त्र्यम्बके गौरी नारायणि नमो ऽस्तु ते ॥ श्रीलक्ष्मीनारायणाभ्या न्नमः । उमामहेश्वराभ्या न्नमः
    । वाणीहिरण्यगर्भाभ्या न्नमः । शचीपुरन्दराभ्या न्नमः । अरुन्धतीवसिष्ठाभ्या न्नमः । श्रीसीतारामाभ्या
    न्नमः । मातापितृभ्यो नमः । सर्वेभ्यो महाजनेभ्यो नमः । दीपाराधनम् दीपस्त्व म्प्रभुरव्ययः । सौभाग्य
    न्देहि पुत्रांश्च सर्वान्कामांश्च देहि मे ॥ भो दीप देवि रूपस्त्व ङ्कर्मसाक्षी ह्यविघ्नकृत् । यावत्पूजा
