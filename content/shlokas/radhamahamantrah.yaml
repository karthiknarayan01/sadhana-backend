id: radhamahamantrah
category: mantra
name:
  english: radhamahamantrah
  devanagari: राधामहामन्त्राः
content:
  english: radhikayai svaha astraya phat | dhyatva japet lakshamatram purashcaranam kalau caturlaksham
    japitva kushali bhavet || vrajarajakumaravallabha kulasimantamani prasida me | parivaraganasya te
    yatha padavi me na daviyasi bhavet || || shriradhikayai namah || iti shriradha mahamantrah ||
  devanagari: राधिकायै स्वाहा अस्त्राय फट् । ध्यात्वा जपेत् लक्षमात्रं पुरश्चरणं कलौ चतुर्लक्षं जपित्वा
    कुशली भवेत् ॥ व्रजराजकुमारवल्लभा कुलसीमन्तमणि प्रसीद मे । परिवारगणस्य ते यथा पदवी मे न दवीयसी भवेत्
    ॥ ॥ श्रीराधिकायै नमः ॥ इति श्रीराधा महामन्त्रः ॥
meaning: {}
