id: yonikavacam
category: kavacha
name:
  english: yonikavacam
  devanagari: योनिकवचम्
content:
  english: viniyogah | hrim yonirme sada patu svaha vighnavinashini | shatrunashatmika yonih sada mam
    patu sagare || 3|| brahmatmika mahayonih sarvan kaman prarakshatu | rajadvare mahaghore klim yonih
    sarvada'vatu || 4|| humatmika sada devi yonirupa jaganmayi | sarvangam patu mam nityam sabhayam rajaveshmani
    || 5|| vedatmika sada yonirvedarupa sarasvati | kirtim shrim kantimarogyam putrapautradikam tatha
    || 6|| raksha raksha mahayone sarvasiddhipradayini | rajoyogatmika yonih sarvatra mam sada'vatu ||
    7|| phalashrutih | iti te kathitam devi kavacam sarvasiddhidam | trisandhyam yah pathennityam rajopadravanashakrit
    || 8|| sabhayam vakpatishcaiva rajaveshmani rajavat | sarvatra jayamapnoti kavacasya japena hi ||
    9|| shriyonyah sangame devi pathedevamananyadhih | sa eva sarvasiddhisho natra karya vicarana || 10||
    matrikaksharasamputam kritva yadi pathennarah | bhunjate vipulan bhogan durgaya saha modate || 11||
    iti guhyatamam devi sarvadharmottamottamam | bhurje va tadipatre va likhitva dharayedyadi || 12||
    haricandanamishrena rocana kunkumena ca | shikhayamathava kanthe shivah so'pi na samshayah || 13||
    sharatkale mahashtamyam navamyam kulasundari | pujakale pathedetat jayi nityam na samshayah || 14||
    || iti shaktikagamasarvasve haragaurisamvade shriyonikavacam sampurnam ||
  devanagari: विनियोगः । ह्रीं योनिर्मे सदा पातु स्वाहा विघ्नविनाशिनी । शत्रुनाशात्मिका योनिः सदा मां
    पातु सागरे ॥ ३॥ ब्रह्मात्मिका महायोनिः सर्वान् कामान् प्ररक्षतु । राजद्वारे महाघोरे क्लीं योनिः सर्वदाऽवतु
    ॥ ४॥ हूमात्मिका सदा देवी योनिरूपा जगन्मयी । सर्वाङ्गं पातु मां नित्यं सभायां राजवेश्मनि ॥ ५॥ वेदात्मिका
    सदा योनिर्वेदरूपा सरस्वती । कीर्तिं श्रीं कान्तिमारोग्यं पुत्रपौत्रादिकं तथा ॥ ६॥ रक्ष रक्ष महायोने
    सर्वसिद्धिप्रदायिनि । रजोयोगात्मिका योनिः सर्वत्र मां सदाऽवतु ॥ ७॥ फलश्रुतिः । इति ते कथितं देवि कवचं
    सर्वसिद्धिदम् । त्रिसन्ध्यं यः पठेन्नित्यं राजोपद्रवनाशकृत् ॥ ८॥ सभायां वाक्पतिश्चैव राजवेश्मनि राजवत्
    । सर्वत्र जयमाप्नोति कवचस्य जपेन हि ॥ ९॥ श्रीयोन्याः सङ्गमे देवि पठेदेवमनन्यधीः । स एव सर्वसिद्धीशो
    नात्र कार्या विचारणा ॥ १०॥ मातृकाक्षरसम्पुटं कृत्वा यदि पठेन्नरः । भुञ्जते विपुलान् भोगान् दुर्गया
    सह मोदते ॥ ११॥ इति गुह्यतमं देवि सर्वधर्मोत्तमोत्तमम् । भूर्जे वा ताडिपत्रे वा लिखित्वा धारयेद्यदि
    ॥ १२॥ हरिचन्दनमिश्रेण रोचना कुङ्कुमेन च । शिखायामथवा कण्ठे शिवः सोऽपि न संशयः ॥ १३॥ शरत्काले महाष्टम्यां
    नवम्यां कुलसुन्दरि । पूजाकाले पठेदेतत् जयी नित्यं न संशयः ॥ १४॥ ॥ इति शक्तिकागमसर्वस्वे हरगौरीसंवादे
    श्रीयोनिकवचं सम्पूर्णम् ॥
