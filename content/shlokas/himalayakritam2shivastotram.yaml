id: himalayakritam2shivastotram
category: stotram
name:
  english: himalayakritam2shivastotram
  devanagari: हिमालयकृतं२शिवस्तोत्रम्
content:
  english: himalayakritam 2 shivastotram himalaya uvaca | devadeva mahadeva kapardin shankara prabho |
    tvayaiva lokanathena palitam bhuvanatrayam || 12|| namaste devadevesha yogirupadharaya ca | nirgunaya
    namastubhyam sagunaya viharine || 13|| kailasavasine shambho sarvalokatanaya ca | namaste parameshaya
    lilakaraya shuline || 14|| paripurnagunadhanavikararahitaya te | namo'nihaya vihaya dhiraya paramatmane
    || 15|| abahirbhogakaraya janavatsala te namah | trigunadhisha mayesha brahmane paramatmane || 16||
    vishnubrahmadisevyaya vishnubrahmasvarupine | vishnubrahmakadatre te bhaktapriya namo'stu te || 17||
    taporata tapasthanasutapahphaladayine | tapahpriyaya shantaya namaste brahmarupine || 18|| vyavaharakarayaiva
    lokacarakaraya te | sagunaya pareshaya namo'stu paramatmane || 19|| lila tava maheshanavedya sadhusukhaprada
    | bhaktadhinasvarupo'si bhaktavashyo hi karmakrit || 3
  devanagari: हिमालयकृतं २ शिवस्तोत्रम् हिमालय उवाच । देवदेव महादेव कपर्दिन् शङ्कर प्रभो । त्वयैव लोकनाथेन
    पालितं भुवनत्रयम् ॥ १२॥ नमस्ते देवदेवेश योगिरूपधराय च । निर्गुणाय नमस्तुभ्यं सगुणाय विहारिणे ॥ १३॥
    कैलासवासिने शम्भो सर्वलोकाटनाय च । नमस्ते परमेशाय लीलाकाराय शूलिने ॥ १४॥ परिपूर्णगुणाधानविकाररहिताय
    ते । नमोऽनीहाय वीहाय धीराय परमात्मने ॥ १५॥ अबहिर्भोगकाराय जनवत्सल ते नमः । त्रिगुणाधीश मायेश ब्रह्मणे
    परमात्मने ॥ १६॥ विष्णुब्रह्मादिसेव्याय विष्णुब्रह्मस्वरूपिणे । विष्णुब्रह्मकदात्रे ते भक्तप्रिय नमोऽस्तु
    ते ॥ १७॥ तपोरत तपस्थानसुतपःफलदायिने । तपःप्रियाय शान्ताय नमस्ते ब्रह्मरूपिणे ॥ १८॥ व्यवहारकरायैव लोकाचारकराय
    ते । सगुणाय परेशाय नमोऽस्तु परमात्मने ॥ १९॥ लीला तव महेशानावेद्या साधुसुखप्रदा । भक्ताधीनस्वरूपोऽसि
    भक्तवश्यो हि कर्मकृत् ॥ ३
