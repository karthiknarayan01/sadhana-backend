id: vemkateshadvadashanamastotram
category: stotram
name:
  english: vemkateshadvadashanamastotram
  devanagari: वेंकटेशद्वादशनामस्तोत्रम्
content:
  english: shrivenkateshadvadashanamastotram brahmandapuranantargatam asya shrivenkateshadvadashanamastotramahamantrasya
    brahma rishih anushtup chandah shrivenkateshvaro devata | ishtarthe viniyogah || narayano jagannatho
    varijasanavanditah | svamipushkarinivasi shannkhacakragadadharah || 1|| pitambaradharo devo garudasanashobhitah
    | kandarpakotilavanyah kamalayatalocanah || 2|| indirapatigovindah candrasuryaprabhakarah | vishvatma
    vishvalokesho jayashrivenkateshvarah || 3|| etaddvadashanamani trisandhyam yah pathennarah | daridryaduhkhanirmukto
    dhanadhanyasamriddhiman || 4|| janavashyam rajavashya sarvakamarthasiddhidam | divyatejah samapnoti
    dirghamayushca vindati || 5|| graharogadinasham ca kamitarthaphalapradam | iha janmani saukhyam ca
    vishnusayujyamapnuyat || 6|| || iti brahmandapurane brahmanaradasamvade venkateshadvadashanamastotram
    sampurnam ||
  devanagari: श्रीवेङ्कटेशद्वादशनामस्तोत्रम् ब्रह्माण्डपुराणान्तर्गतम् अस्य श्रीवेङ्कटेशद्वादशनामस्तोत्रमहामन्त्रस्य
    ब्रह्मा ऋषिः अनुष्टुप् छन्दः श्रीवेङ्कटेश्वरो देवता । इष्टार्थे विनियोगः ॥ नारायणो जगन्नाथो वारिजासनवन्दितः
    । स्वामिपुष्करिणीवासी शन्ङ्खचक्रगदाधरः ॥ १॥ पीताम्बरधरो देवो गरुडासनशोभितः । कन्दर्पकोटिलावण्यः कमलायतलोचनः
    ॥ २॥ इन्दिरापतिगोविन्दः चन्द्रसूर्यप्रभाकरः । विश्वात्मा विश्वलोकेशो जयश्रीवेङ्कटेश्वरः ॥ ३॥ एतद्द्वादशनामानि
    त्रिसन्ध्यं यः पठेन्नरः । दारिद्र्यदुःखनिर्मुक्तो धनधान्यसमृद्धिमान् ॥ ४॥ जनवश्यं राजवश्य सर्वकामार्थसिद्धिदम्
    । दिव्यतेजः समाप्नोति दीर्घमायुश्च विन्दति ॥ ५॥ ग्रहरोगादिनाशं च कामितार्थफलप्रदम् । इह जन्मनि सौख्यं
    च विष्णुसायुज्यमाप्नुयात् ॥ ६॥ ॥ इति ब्रह्माण्डपुराणे ब्रह्मनारदसंवादे वेङ्कटेशद्वादशनामस्तोत्रं सम्पूर्णम्
    ॥
