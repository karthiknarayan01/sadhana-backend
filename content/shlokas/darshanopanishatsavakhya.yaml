id: darshanopanishatsavakhya
category: upanishad
name:
  english: darshanopanishatsavakhya
  devanagari: दर्शनोपनिषत्सवाख्या
content:
  english: 25|| asteyam anyadiye trine ratne kancane mauktike'pi ca | manasa vinivrittirya tadasteyam
    vidurbudhah || 11|| atmanyanatmabhavena vyavaharavivarjitam | yattadasteyamityuktamatmavidbhirmahamune
    || 12|| brahmacaryam karyana vaca manasa strinam parivivarjanam | rito bharyo nada svasya brahmacaryam
    taducyate || 13|| brahmabhave manashcaram brahmacaryam parantapa | daya svatmavatsarvabhuteshu kayena
    manama gira || 14|| anujna ya daya saiva prokta vedantavedibhih | arjavam putra mitre kalatre ca ripo
    svatmani santatam || 15|| ekarupam mune yattadarjavam procyate maya | kshama kayena manasa vaca shatrubhih
    paripidite || 16|| buddhikshobhanivrittirya kshama sa munipungava | dhritih vedadeva vinirmokshah
    samsarasya na canyatha || 17|| iti vijnananishpattirdhritih prokta hi vaidikaih | ahamatma na canyo'mmityevamapracyuta
    matih || 18|| mitaharah alpamrishtashanabhyam ca caturthamshavasheshakam | tasmadyoganugunyena bhojanam
    mitabhojanam || 19|| shaucama svadehamalanirmoksho mrijjalabhyam mahamune | yattacchaucam bhavedbahyam
    manasam mananam viduh || 20|| aham shuddha iti jnanam shaucamahurmanishinah | atyantamalino deho dehi
    catyantanirmalah || 21|| ubhayorantaram jnatva kasya shaucam vidhiyate | jnanashaucam parityajya bahye
    yo ramate narah || 22|| sa mudhah kancanam tyaktva loshtam grihnati suvrata | brahmatmavedanavidhih
    jnanamritena triptasya kritakrityasya yoginah || 23|| na casti kincitkartavyamasti cena sa tattvavit
    | lokatraye'pi kartavyam kincinnastyatmavedinam || 24|| tasmatsarvaprayatnena mune'himsadisadhanaih
    | atmanamaksharam brahma viddhi jnanattu vedanat || 25|| iti prathamah khandah || 1|| dvitiyah khandah
    dashavidhaniyamah tapah santoshamastikyam danamishvarapujanam | siddhantashravanam caiva hrimatishca
    japo vratam || 1|| ete ca niyamah proktastanvakshyami kramacchrinu | dashadha bhinnaniyamavayavanaha
  devanagari: २५॥ अस्तेयं अन्यदीये तृणे रत्ने काञ्चने मौक्तिकेऽपि च । मनसा विनिवृत्तिर्या तदस्तेयं विदुर्बुधाः
    ॥ ११॥ आत्मन्यनात्मभावेन व्यवहारविवर्जितम् । यत्तदस्तेयमित्युक्तमात्मविद्भिर्महामुने ॥ १२॥ ब्रह्मचर्यं
    कार्यन वाचा मनसा स्त्रीणां परिविवर्जनम् । ऋतो भार्यो नदा स्वस्य ब्रह्मचर्यं तदुच्यते ॥ १३॥ ब्रह्मभावे
    मनश्चारं ब्रह्मचर्यं परन्तप । दया स्वात्मवत्सर्वभूतेषु कायेन मनमा गिरा ॥ १४॥ अनुज्ञा या दया सैव प्रोक्ता
    वेदान्तवेदिभिः । आर्जवं पुत्र मित्रे कलत्रे च रिपो स्वात्मनि सन्ततम् ॥ १५॥ एकरूपं मुने यत्तदार्जवं
    प्रोच्यते मया । क्षमा कायेन मनसा वाचा शत्रुभिः परिपीडिते ॥ १६॥ बुद्धिक्षोभनिवृत्तिर्या क्षमा सा मुनिपुङ्गव
    । धृतिः वेदादेव विनिर्मोक्षः सम्सारस्य न चान्यथा ॥ १७॥ इति विज्ञाननिष्पत्तिर्धृतिः प्रोक्ता हि वैदिकैः
    । अहमात्मा न चान्योऽम्मीत्येवमप्रच्युता मतिः ॥ १८॥ मिताहारः अल्पमृष्टाशनाभ्यां च चतुर्थांशावशेषकम्
    । तस्माद्योगानुगुण्येन भोजनं मितभोजनम् ॥ १९॥ शौचम स्वदेहमलनिर्मोक्षो मृज्जलाभ्यां महामुने । यत्तच्छौचं
    भवेद्बाह्यं मानसं मननं विदुः ॥ २०॥ अहं शुद्ध इति ज्ञानं शौचमाहुर्मनीषिणः । अत्यन्तमलिनो देहो देही
    चात्यन्तनिर्मलः ॥ २१॥ उभयोरन्तरं ज्ञात्वा कस्य शौचं विधीयते । ज्ञानशौचं परित्यज्य बाह्ये यो रमते नरः
    ॥ २२॥ स मूढः काञ्चनं त्यक्त्वा लोष्टं गृह्णाति सुव्रत । ब्रह्मात्मवेदनविधिः ज्ञानामृतेन तृप्तस्य कृतकृत्यस्य
    योगिनः ॥ २३॥ न चास्ति किञ्चित्कर्तव्यमस्ति चेन स तत्त्ववित् । लोकत्रयेऽपि कर्तव्यं किञ्चिन्नास्त्यात्मवेदिनाम्
    ॥ २४॥ तस्मात्सर्वप्रयत्नेन मुनेऽहिंसादिसाधनैः । आत्मानमक्षरं ब्रह्म विद्धि ज्ञानात्तु वेदनात् ॥ २५॥
    इति प्रथमः खण्डः ॥ १॥ द्वितीयः खण्डः दशविधनियमः तपः सन्तोषमास्तिक्यं दानमीश्वरपूजनम् । सिद्धान्तश्रवणं
    चैव ह्रीमतिश्च जपो व्रतम् ॥ १॥ एते च नियमाः प्रोक्तास्तान्वक्ष्यामि क्रमाच्छृणु । दशधा भिन्ननियमावयवानाह
