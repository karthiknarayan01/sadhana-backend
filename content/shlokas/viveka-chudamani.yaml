id: viveka-chudamani
category: stotram
name:
  english: Viveka Chudamani
content:
  english: sarvavedantasiddhantagocaram tamagocaram | govindam paramanandam sadgurum pranato'smyaham ||
    || jantunam narajanma durlabhamatah pumstvam tato viprata tasmadvaidikadharmamargaparata vidvattvamasmatparam
    | atmanatmavivecanam svanubhavo brahmatmana samsthitih muktirno shatajanmakotisukritaih punyairvina
    labhyate || durlabham trayamevaitaddevanugrahahetukam | manushyatvam mumukshutvam mahapurushasamshrayah
    || || labdhva kathancinnarajanma durlabham tatrapi pumstvam shrutiparadarshanam | yastvatmamuktau
    na yateta mudhadhih sa hyatmaha svam vinihantyasadgrahat || itah ko nvasti mudhatma yastu svarthe
    pramadyati | durlabham manusham deham prapya tatrapi paurusham || || vadantu shastrani yajantu devan
    kurvantu karmani bhajantu devatah | atmaikyabodhena vinapi mukti rna sidhyati brahmashatantare'pi
    || || amritattvasya nashasti vittenetyeva hi shrutih | braviti karmano mukterahetutvam sphutam yatah
    || || ato vimuktyai prayateta vidvan sannyastabahyarthasukhasprihah san | santam mahantam samupetya
    deshikam tenopadishtarthasamahitatma || || uddharedatmana''tmanam magnam samsaravaridhau | yogarudhatvamasadya
    samyagdarshananishthaya || || sannyasya sarvakarmani bhavabandhavimuktaye | yatyatam panditairdhirairatmabhyasa
    upasthitaih || || cittasya shuddhaye karma na tu vastupalabdhaye | vastusiddhirvicarena na kincitkarmakotibhih
    || || samyagvicaratah siddha rajjutattvavadharana | bhrantoditamahasarpabhayaduhkhavinashini || arthasya
    nishcayo drishto vicarena hitoktitah | na snanena na danena pranayamashatena va || || adhikarinamashaste
    phalasiddhirvisheshatah | upaya deshakaladyah santyasminsahakarinah || ato vicarah kartavyo jijnasoratmavastunah
    || samasadya dayasindhum gurum brahmaviduttamam || || medhavi purusho vidvanuhapohavicakshanah | adhikaryatmavidyayamuktalakshanalakshitah
    || || vivekino viraktasya shamadigunashalinah | mumukshoreva hi brahmajijnasayogyata mata || || sadhananyatra
    catvari kathitani manishibhih | yeshu satsveva sannishtha yadabhave na sidhyati || || adau nityanityavastuvivekah
    pariganyate | ihamutraphalabhogaviragastadanantaram | shamadishatkasampattirmumukshutvamiti sphutam
    || || brahma satyam jaganmithyetyevamrupo vinishcayah | so'yam nityanityavastuvivekah samudahritah
    || || tadvairagyam jihasa ya darshanashravanadibhih | dehadibrahmaparyante hyanitye bhogavastuni ||
    virajya vishayavrataddoshadrishtya muhurmuhuh | svalakshye niyatavastha manasah shama ucyate || ||
    vishayebhyah paravartya sthapanam svasvagolake | ubhayeshamindriyanam sa damah parikirtitah | bahyanalambanam
    vrittereshoparatiruttama || || sahanam sarvaduhkhanamapratikarapurvakam | cintavilaparahitam sa titiksha
    nigadyate || || shastrasya guruvakyasya satyabuddhyavadharanam | sa shraddha kathita sadbhiryaya vastupalabhyate
    || || sarvada sthapanam buddheh shuddhe brahmani sarvada | tatsamadhanamityuktam na tu cittasya lalanam
    || || ahankaradidehantan bandhanajnanakalpitan | svasvarupavabodhena moktumiccha mumukshuta || ||
    mandamadhyamarupapi vairagyena shamadina | prasadena guroh seyam pravriddha suyate phalam || || vairagyam
    ca mumukshutvam tivram yasya tu vidyate | tasminnevarthavantah syuh phalavantah shamadayah || || etayormandata
    yatra viraktatvamumukshayoh | marau salilavattatra shamaderbhanamatrata || || mokshakaranasamagryam
    bhaktireva gariyasi | svasvarupanusandhanam bhaktirityabhidhiyate || || svatmatattvanusandhanam bhaktirityapare
    jaguh | uktasadhanasampannastattvajijnasuratmanah | upasidedgurum prajnam yasmadbandhavimokshanam
    || || shrotriyo'vrijino'kamahato yo brahmavittamah | brahmanyuparatah shanto nirindhana ivanalah |
    ahetukadayasindhurbandhuranamatam satam || || tamaradhya gurum bhaktya prahvaprashrayasevanaih | prasannam
    tamanuprapya pricchejjnatavyamatmanah || || svaminnamaste natalokabandho karunyasindho patitam bhavabdhau
    | mamuddharatmiyakatakshadrishtya rijvyatikarunyasudhabhivrishtya || || durvarasamsaradavagnitaptam
    dodhuyamanam duradrishtavataih | bhitam prapannam paripahi mrityoh sharanyamanyadyadaham na jane ||
    shanta mahanto nivasanti santo vasantavallokahitam carantah | tirnah svayam bhimabhavarnavam jana
    nahetunanyanapi tarayantah || || ayam svabhavah svata eva yatpara shramapanodapravanam mahatmanam
    | sudhamshuresha svayamarkakarkasha prabhabhitaptamavati kshitim kila || || brahmanandarasanubhutikalitaih
    putaih sushitairyutai ryushmadvakkalashojjhitaih shrutisukhairvakyamritaih secaya | santaptam bhavatapadavadahanajvalabhirenam
    prabho dhanyaste bhavadikshanakshanagateh patrikritah svikritah || || katham tareyam bhavasindhumetam
    ka va gatirme katamo'styupayah | jane na kincitkripaya'va mam prabho samsaraduhkhakshatimatanushva
    || || tatha vadantam sharanagatam svam samsaradavanalatapataptam | nirikshya karunyarasardradrishtya
    dadyadabhitim sahasa mahatma || || vidvan sa tasma upasattimiyushe mumukshave sadhu yathoktakarine
    | prashantacittaya shamanvitaya tattvopadesham kripayaiva kuryat || || ma bhaishta vidvamstava nastyapayah
    samsarasindhostarane'styupayah | yenaiva yata yatayo'sya param tameva margam tava nirdishami || ||
    astyupayo mahankashcitsamsarabhayanashanah | tena tirtva bhavambhodhim paramanandamapsyasi || || vedantarthavicarena
    jayate jnanamuttamam | tenatyantikasamsaraduhkhanasho bhavatyanu || || shraddhabhaktidhyanayoganmumukshoh
    mukterhetunvakti sakshacchrutergih | yo va eteshveva tishthatyamushya moksho'vidyakalpitaddehabandhat
    || || ajnanayogatparamatmanastava hyanatmabandhastata eva samsritih | tayorvivekoditabodhavahnih ajnanakaryam
    pradahetsamulam || || shishya uvaca | kripaya shruyatam svaminprashno'yam kriyate maya | yaduttaramaham
    shrutva kritarthah syam bhavanmukhat || || ko nama bandhah kathamesha agatah katham pratishthasya
    katham vimokshah | ko'savanatma paramah ka atma tayorvivekah kathametaducyatam || || shriguruvaca
    | dhanyo'si kritakrityo'si pavitam te kulam tvaya | yadavidyabandhamuktya brahmibhavitumicchasi ||
    || rinamocanakartarah pituh santi sutadayah | bandhamocanakarta tu svasmadanyo na kashcana || || mastakanyastabharaderduhkhamanyairnivaryate
    | kshudhadikritaduhkham tu vina svena na kenacit || || pathyamaushadhaseva ca kriyate yena rogina
    | arogyasiddhirdrishta'sya nanyanushthitakarmana || || vastusvarupam sphutabodhacakshusha svenaiva
    vedyam na tu panditena | candrasvarupam nijacakshushaiva jnatavyamanyairavagamyate kim || || avidyakamakarmadipashabandham
    vimocitum | kah shaknuyadvina''tmanam kalpakotishatairapi || || na yogena na sankhyena karmana no
    na vidyaya | brahmatmaikatvabodhena mokshah sidhyati nanyatha || || vinaya rupasaundaryam tantrivadanasaushthavam
    | prajaranjanamatram tanna samrajyaya kalpate || || vagvaikhari shabdajhari shastravyakhyanakaushalam
    | vaidushyam vidusham tadvadbhuktaye na tu muktaye || || avijnate pare tattve shastradhitistu nishphala
    | vijnate'pi pare tattve shastradhitistu nishphala || || shabdajalam maharanyam cittabhramanakaranam
    | atah prayatnajjnatavyam tattvajnaistattvamatmanah || || tattvajnattattva ajnanasarpadashtasya brahmajnanaushadham
    vina | kimu vedaishca shastraishca kimu mantraih kimaushadhaih || || na gacchati vina panam vyadhiraushadhashabdatah
    | vina'parokshanubhavam brahmashabdairna mucyate || || akritva drishyavilayamajnatva tattvamatmanah
    | brahmashabdaih kuto muktiruktimatraphalairnrinam || akritva shatrusamharamagatvakhilabhushriyam
    | rajahamiti shabdanno raja bhavitumarhati || || aptoktim khananam tathoparishiladyutkarshanam svikritim
    nikshepah samapekshate na hi bahihshabdaistu nirgacchati | tadvadbrahmavidopadeshamananadhyanadibhirlabhyate
    mayakaryatirohitam svamamalam tattvam na duryuktibhih || || tasmatsarvaprayatnena bhavabandhavimuktaye
    | svaireva yatnah kartavyo rogadaviva panditaih || yastvayadya kritah prashno variyanchastravinmatah
    | sutraprayo nigudhartho jnatavyashca mumukshubhih || || sharinushvavahito vidvanyanmaya samudiryate
    | tadetacchravanatsadyo bhavabandhadvimokshyase || || mokshasya hetuh prathamo nigadyate vairagyamatyantamanityavastushu
    | tatah shamashcapi damastitiksha nyasah prasaktakhilakarmanam bhrisham || || tatah shrutistanmananam
    satattva dhyanam ciram nityanirantaram muneh | tato'vikalpam parametya vidvan ihaiva nirvanasukham
    samricchati || || yadboddhavyam tavedanimatmanatmavivecanam | taducyate maya samyak shrutvatmanyavadharaya
    || || majjasthimedahpalaraktacarma tvagahvayairdhatubhirebhiranvitam | padoruvakshobhujaprishthamastakaih
    angairupangairupayuktametat || || ahammameti prathitam shariram mohaspadam sthulamitiryate budhaih
    | nabhonabhasvaddahanambubhumayah sukshmani bhutani bhavanti tani || || parasparamshairmilitani bhutva
    sthulani ca sthulasharirahetavah | matrastadiya vishaya bhavanti shabdadayah panca sukhaya bhoktuh
    || || ya eshu mudha vishayeshu baddha ragorupashena sudurdamena | ayanti niryantyadha urdhvamuccaih
    svakarmadutena javena nitah || || shabdadibhih pancabhireva panca pancatvamapuh svagunena baddhah
    | kurangamatangapatangamina bhringa narah pancabhirancitah kim || || doshena tivro vishayah krishnasarpavishadapi
    | visham nihanti bhoktaram drashtaram cakshushapyayam || || vishayashamahapashadyo vimuktah sudustyajat
    | sa eva kalpate muktyai nanyah shatshastravedyapi || || apatavairagyavato mumukshun bhavabdhiparam
    pratiyatumudyatan | ashagraho majjayate'ntarale nigrihya kanthe vinivartya vegat || || vishayakhyagraho
    yena suviraktyasina hatah | sa gacchati bhavambhodheh param pratyuhavarjitah || || vishamavishayamargairgacchato'nacchabuddheh
    pratipadamabhiyato mrityurapyesha viddhi | pratipadamabhighato mrityurapyesha siddhah hitasujanaguruktya
    gacchatah svasya yuktya prabhavati phalasiddhih satyamityeva viddhi || || mokshasya kanksha yadi vai
    tavasti tyajatiduradvishayanvisham yatha | piyushavattoshadayakshamarjava prashantidantirbhaja nityamadarat
    || || anukshanam yatparihritya krityam anadyavidyakritabandhamokshanam | dehah parartho'yamamushya
    poshane yah sajjate sa svamanena hanti || || shariraposhanarthi san ya atmanam didrikshati | graham
    darudhiya dhritva nadim tartum sa gacchati || moha eva mahamrityurmumukshorvapuradishu | moho vinirjito
    yena sa muktipadamarhati || || moham jahi mahamrityum dehadarasutadishu | yam jitva munayo yanti tadvishnoh
    paramam padam || || tvanmamsarudhirasnayumedomajjasthisankulam | purnam mutrapurishabhyam sthulam
    nindyamidam vapuh || || pancikritebhyo bhutebhyah sthulebhyah purvakarmana | samutpannamidam sthulam
    bhogayatanamatmanah | avastha jagarastasya sthularthanubhavo yatah || || bahyendriyaih sthulapadarthasevam
    srakcandanastryadivicitrarupam | karoti jivah svayametadatmana tasmatprashastirvapusho'sya jagare
    || || sarvo'pi bahyasamsarah purushasya yadashrayah | viddhi dehamidam sthulam grihavadgrihamedhinah
    || || sthulasya sambhavajaramaranani dharmah sthaulyadayo bahuvidhah shishutadyavasthah | varnashramadiniyama
    bahudha''mayah syuh pujavamanabahumanamukha visheshah || || buddhindriyani shravanam tvagakshi ghranam
    ca jihva vishayavabodhanat | vakpanipada gudamapyupasthah karmendriyani pravanena karmasu || nigadyate'ntahkaranam
    manodhih ahankritishcittamiti svavrittibhih | manastu sankalpavikalpanadibhih buddhih padarthadhyavasayadharmatah
    || || atrabhimanadahamityahankritih | svarthanusandhanagunena cittam || || pranapanavyanodanasamana
    bhavatyasau pranah | svayameva vrittibhedadvikritibhedatsuvarnasaliladivat || vikriterbhedatsuvarnasalilamiva
    vagadi panca shravanadi panca pranadi pancabhramukhani panca | buddhyadyavidyapi ca kamakarmani puryashtakam
    sukshmashariramahuh || rinu sukshmasanjnitam lingam tvapancikritabhutasambhavam | savasanam karmaphalanubhavakam
    svajnanato'nadirupadhiratmanah || || svapno bhavatyasya vibhaktyavastha svamatrasheshena vibhati yatra
    | svapne tu buddhih svayameva jagrat kalinananavidhavasanabhih || || kartradibhavam pratipadya rajate
    yatra svayam bhati hyayam paratma | dhimatrakopadhirasheshasakshi na lipyate tatkritakarmaleshaih
    | karmalepaih yasmadasangastata eva karmabhih na lipyate kincidupadhina kritaih || || sarvavyapritikaranam
    lingamidam syaccidatmanah pumsah | vasyadikamiva takshnastenaivatma bhavatyasango'yam || || andhatvamandatvapatutvadharmah
    saugunyavaigunyavashaddhi cakshushah | badhiryamukatvamukhastathaiva shrotradidharma na tu vetturatmanah
    || || ucchvasanihshvasavijrimbhanakshu tprasyandanadyutkramanadikah kriyah | pranadikarmani vadanti
    tajnah pranasya dharmavashanapipase || || antahkaranameteshu cakshuradishu varshmani | ahamityabhimanena
    tishthatyabhasatejasa || || ahankarah sa vijneyah karta bhoktabhimanyayam | sattvadigunayogena cavasthatrayamashnute
    || yogenavasthatritayamshnute vishayanamanukulye sukhi duhkhi viparyaye | sukham duhkham ca taddharmah
    sadanandasya natmanah || || atmarthatvena hi preyanvishayo na svatah priyah | svata eva hi sarveshamatma
    priyatamo yatah | tata atma sadanando nasya duhkham kadacana || || yatsushuptau nirvishaya atmanando'nubhuyate
    | shrutih pratyakshamaitihyamanumanam ca jagrati || || avyaktanamni parameshashaktih anadyavidya trigunatmika
    para | karyanumeya sudhiyaiva maya yaya jagatsarvamidam prasuyate || || sannapyasannapyubhayatmika
    no bhinnapyabhinnapyubhayatmika no | sangapyananga hyubhayatmika no mahadbhuta'nirvacaniyarupa ||
    || shuddhadvayabrahmavibodhanashya sarpabhramo rajjuvivekato yatha | rajastamahsattvamiti prasiddha
    gunastadiyah prathitaih svakaryaih || || vikshepashakti rajasah kriyatmika yatah pravrittih prasrita
    purani | ragadayo'syah prabhavanti nityam duhkhadayo ye manaso vikarah || || kamah krodho lobhadambhadyasuya
    ahankarershyamatsaradyastu ghorah | dharma ete rajasah pumpravritti ryasmadesha tadrajo bandhahetuh
    || esha''vritirnama tamogunasya shaktirmaya vastvavabhasate'nyatha | shaktiryaya saisha nidanam purushasya
    samsriteh vikshepashakteh pravanasya hetuh || prajnavanapi pandito'pi caturo'pyatyantasukshmatmadrig
    vyalidhastamasa na vetti bahudha sambodhito'pi sphutam | bhrantyaropitameva sadhu kalayatyalambate
    tadgunan hantasau prabala durantatamasah shaktirmahatyavritih || || abhavana va viparitabhavana' sambhavana
    vipratipattirasyah | samsargayuktam na vimuncati dhruvam vikshepashaktih kshapayatyajasram || || ajnanamalasyajadatvanidra
    pramadamudhatvamukhastamogunah | etaih prayukto na hi vetti kincit nidraluvatstambhavadeva tishthati
    || || sattvam vishuddham jalavattathapi tabhyam militva saranaya kalpate | yatratmabimbah pratibimbitah
    san prakashayatyarka ivakhilam jadam || || mishrasya sattvasya bhavanti dharmah tvamanitadya niyama
    yamadyah | shraddha ca bhaktishca mumukshuta ca daivi ca sampattirasannivrittih || || vishuddhasattvasya
    gunah prasadah svatmanubhutih parama prashantih | triptih praharshah paramatmanishtha yaya sadanandarasam
    samricchati || || avyaktametattrigunairniruktam tatkaranam nama shariramatmanah | sushuptiretasya
    vibhaktyavastha pralinasarvendriyabuddhivrittih || || sarvaprakarapramitiprashantih bijatmanavasthitireva
    buddheh | sushuptiretasya kila pratitih kincinna vedmiti jagatprasiddheh || || dehendriyapranamano'hamadayah
    sarve vikara vishayah sukhadayah | vyomadibhutanyakhilam ca vishvam avyaktaparyantamidam hyanatma
    || || maya mayakaryam sarvam mahadadidehaparyantam | asadidamanatmatattvam viddhi tvam marumaricikakalpam
    || || atha te sampravakshyami svarupam paramatmanah | yadvijnaya naro bandhanmuktah kaivalyamashnute
    || || asti kashcitsvayam nityamahampratyayalambanah | avasthatrayasakshi sanpancakoshavilakshanah
    || || yo vijanati sakalam jagratsvapnasushuptishu | buddhitadvrittisadbhavamabhavamahamityayam ||
    || yah pashyati svayam sarvam yam na pashyati kashcana | yashcetayati buddhyadi na tadyam cetayatyayam
    || || yena vishvamidam vyaptam yam na vyapnoti kincana | abharupamidam sarvam yam bhantamanubhatyayam
    || || yasya sannidhimatrena dehendriyamanodhiyah | vishayeshu svakiyeshu vartante prerita iva || ||
    ahankaradidehanta vishayashca sukhadayah | vedyante ghatavadyena nityabodhasvarupina || || esho'ntaratma
    purushah purano nirantarakhandasukhanubhutih | sadaikarupah pratibodhamatro yeneshita vagasavashcaranti
    || || atraiva sattvatmani dhiguhayam avyakritakasha ushatprakashah | akasha uccai ravivatprakashate
    svatejasa vishvamidam prakashayan || || jnata mano'hankritivikriyanam dehendriyapranakritakriyanam
    | ayo'gnivattananuvartamano na ceshtate no vikaroti kincana || || na jayate no mriyate na vardhate
    na kshiyate no vikaroti nityah | viliyamane'pi vapushyamushmi nna liyate kumbha ivambaram svayam ||
    || prakritivikritibhinnah shuddhabodhasvabhavah sadasadidamashesham bhasayannirvisheshah | vilasati
    paramatma jagradadishvavastha svahamahamiti sakshatsakshirupena buddheh || || niyamitamanasamum tvam
    svamatmanamatma nyayamahamiti sakshadviddhi buddhiprasadat | janimaranatarangaparasamsarasindhum pratara
    bhava kritartho brahmarupena samsthah || || atranatmanyahamiti matirbandha esho'sya pumsah prapto'jnanajjananamaranakleshasampatahetuh
    | yenaivayam vapuridamasatsatyamityatmabuddhya pushyatyukshatyavati vishayaistantubhih koshakridvat
    || || atasmimstadbuddhih prabhavati vimudhasya tamasa vivekabhavadvai sphurati bhujage rajjudhishana
    | tato'narthavrato nipatati samadaturadhikah tato yo'sadgrahah sa hi bhavati bandhah sharinu sakhe
    || || akhandanityadvayabodhashaktya sphurantamatmanamanantavaibhavam | samavrinotyavritishaktiresha
    tamomayi rahurivarkabimbam || || tirobhute svatmanyamalataratejovati puman anatmanam mohadahamiti
    shariram kalayati | tatah kamakrodhaprabhritibhiramum bandhanagunaih param vikshepakhya rajasa urushaktirvyathayati
    || || mahamohagrahagrasanagalitatmavagamano dhiyo nanavastham svayamabhinayamstadgunataya | apare
    samsare vishayavishapure jalanidhau nimajyonmajyayam bhramati kumatih kutsitagatih || || bhanuprabhasanjanitabhrapanktih
    bhanum tirodhaya vijrimbhate yatha | atmoditahankritiratmatattvam tatha tirodhaya vijrimbhate svayam
    || || kavalitadinanathe durdine sandrameghaih vyathayati himajhanjhavayurugro yathaitan | aviratatamasa''tmanyavrite
    mudhabuddhim kshapayati bahuduhkhaistivravikshepashaktih || || etabhyameva shaktibhyam bandhah pumsah
    samagatah | yabhyam vimohito deham matva''tmanam bhramatyayam || || bijam samsritibhumijasya tu tamo
    dehatmadhirankuro ragah pallavamambu karma tu vapuh skandho'savah shakhikah | agranindriyasamhatishca
    vishayah pushpani duhkham phalam nanakarmasamudbhavam bahuvidham bhoktatra jivah khagah || || ajnanamulo'yamanatmabandho
    naisargiko'nadirananta iritah | janmapyayavyadhijaradiduhkha pravahapatam janayatyamushya || || nastrairna
    shastrairanilena vahnina chettum na shakyo na ca karmakotibhih | vivekavijnanamahasina vina dhatuh
    prasadena shitena manjuna || || shrutipramanaikamateh svadharma nishtha tayaivatmavishuddhirasya |
    vishuddhabuddheh paramatmavedanam tenaiva samsarasamulanashah || || koshairannamayadyaih pancabhiratma
    na samvrito bhati | nijashaktisamutpannaih shaivalapatalairivambu vapistham || || tacchaivalapanaye
    samyak salilam pratiyate shuddham | trishnasantapaharam sadyah saukhyapradam param pumsah || || pancanamapi
    koshanamapavade vibhatyayam shuddhah | nityanandaikarasah pratyagrupah parah svayanjyotih || || atmanatmavivekah
    kartavyo bandhamuktaye vidusha | tenaivanandi bhavati svam vijnaya saccidanandam || || munjadishikamiva
    drishyavargat pratyancamatmanamasangamakriyam | vivicya tatra pravilapya sarvam tadatmana tishthati
    yah sa muktah || || deho'yamannabhavano'nnamayastu kosha shcannena jivati vinashyati tadvihinah |
    tvakcarmamamsarudhirasthipurisharashi rnayam svayam bhavitumarhati nityashuddhah || || purvam janeradhimriterapi
    nayamasti jatakshanah kshanaguno'niyatasvabhavah | naiko jadashca ghatavatparidrishyamanah svatma
    katham bhavati bhavavikaravetta || || panipadadimandeho natma vyange'pi jivanat | tattacchakteranashacca
    na niyamyo niyamakah || || dehataddharmatatkarmatadavasthadisakshinah | sata eva svatahsiddham tadvailakshanyamatmanah
    || || shalyarashirmamsalipto malapurno'tikashmalah | katham bhavedayam vetta svayametadvilakshanah
    || || tvanmamsamedo'sthipurisharasha vahammatim mudhajanah karoti | vilakshanam vetti vicarashilo
    nijasvarupam paramarthabhutam || || deho'hamityeva jadasya buddhih dehe ca jive vidushastvahandhih
    | vivekavijnanavato mahatmano brahmahamityeva matih sadatmani || || atratmabuddhim tyaja mudhabuddhe
    tvanmamsamedo'sthipurisharashau | sarvatmani brahmani nirvikalpe kurushva shantim paramam bhajasva
    || || dehendriyadavasati bhramoditam vidvanahantam na jahati yavat | tavanna tasyasti vimuktivarta
    pyastvesha vedantanayantadarshi || || chayasharire pratibimbagatre yatsvapnadehe hridi kalpitange
    | yathatmabuddhistava nasti kaci jjivaccharire ca tathaiva ma'stu || || dehatmadhireva nrinamasaddhiyam
    janmadiduhkhaprabhavasya bijam | yatastatastvam jahi tam prayatnat tyakte tu citte na punarbhavasha
    || || karmendriyaih pancabhirancito'yam prano bhavetpranamayastu koshah || yenatmavanannamayo'nupurnah
    pravartate'sau sakalakriyasu || || naivatmapi pranamayo vayuvikaro ganta''ganta vayuvadantarbahireshah
    | yasmatkincitkvapi na vettishtamanishtam svam vanyam va kincana nityam paratantrah || || jnanendriyani
    ca manashca manomayah syat kosho mamahamiti vastuvikalpahetuh | sanjnadibhedakalanakalito baliyam
    statpurvakoshamabhipurya vijrimbhate yah || pancendriyaih pancabhireva hotribhih praciyamano vishayajyadharaya
    | jajvalyamano bahuvasanendhanaih manomayagnirdahati prapancam || na hyastyavidya manaso'tirikta mano
    hyavidya bhavabandhahetuh | tasminvinashte sakalam vinashtam vijrimbhite'sminsakalam vijrimbhate ||
    || svapne'rthashunye srijati svashaktya bhoktradivishvam mana eva sarvam | tathaiva jagratyapi no
    visheshah tatsarvametanmanaso vijrimbhanam || || sushuptikale manasi praline naivasti kincitsakalaprasiddheh
    | ato manahkalpita eva pumsah samsara etasya na vastuto'sti || || vayuna''niyate meghah punastenaiva
    niyate | vayuna niyate meghah punastenaiva liyate manasa kalpyate bandho mokshastenaiva kalpyate ||
    || dehadisarvavishaye parikalpya ragam badhnati tena purusham pashuvadgunena | vairasyamatra vishavat
    suvidhaya pashcad enam vimocayati tanmana eva bandhat || || tasmanmanah karanamasya jantoh bandhasya
    mokshasya ca va vidhane | bandhasya heturmalinam rajogunaih mokshasya shuddham virajastamaskam ||
    || vivekavairagyagunatireka cchuddhatvamasadya mano vimuktyai | bhavatyato buddhimato mumuksho stabhyam
    dridhabhyam bhavitavyamagre || || mano nama mahavyaghro vishayaranyabhumishu | caratyatra na gacchantu
    sadhavo ye mumukshavah || || manah prasute vishayanasheshan sthulatmana sukshmataya ca bhoktuh | shariravarnashramajatibhedan
    gunakriyahetuphalani nityam || || asangacidrupamamum vimohya dehendriyapranagunairnibaddhya | ahammameti
    bhramayatyajasram manah svakrityeshu phalopabhuktishu || || adhyasadoshatpurushasya samsritih adhyasabandhastvamunaiva
    kalpitah | rajastamodoshavato'vivekino janmadiduhkhasya nidanametat || || atah prahurmano'vidyam panditastattvadarshinah
    | yenaiva bhramyate vishvam vayunevabhramandalam || || tanmanahshodhanam karyam prayatnena mumukshuna
    | vishuddhe sati caitasminmuktih karaphalayate || || mokshaikasaktya vishayeshu ragam nirmulya sannyasya
    ca sarvakarma | sacchraddhaya yah shravanadinishtho rajahsvabhavam sa dhunoti buddheh || || manomayo
    napi bhavetparatma hyadyantavattvatparinamibhavat | duhkhatmakatvadvishayatvahetoh drashta hi drishyatmataya
    na drishtah || || buddhirbuddhindriyaih sardham savrittih kartrilakshanah | vijnanamayakoshah syatpumsah
    samsarakaranam || || anuvrajaccitpratibimbashaktih vijnanasanjnah prakritervikarah | jnanakriyavanahamityajasram
    dehendriyadishvabhimanyate bhrisham || || anadikalo'yamahamsvabhavo jivah samastavyavaharavodha |
    karoti karmanyapi purvavasanah punyanyapunyani ca tatphalani || || bhunkte vicitrasvapi yonishu vraja
    nnayati niryatyadha urdhvameshah | asyaiva vijnanamayasya jagrat svapnadyavasthah sukhaduhkhabhogah
    || || dehadinishthashramadharmakarma gunabhimanah satatam mameti | vijnanakosho'yamatiprakashah prakrishtasannidhyavashatparatmanah
    | ato bhavatyesha upadhirasya yadatmadhih samsarati bhramena || || yo'yam vijnanamayah praneshu hridi
    sphuratyayam jyotih | sphuratsvayanjyotih kutasthah sannatma karta bhokta bhavatyupadhisthah || ||
    svayam paricchedamupetya buddheh tadatmyadoshena param mrishatmanah | sarvatmakah sannapi vikshate
    svayam svatah prithaktvena mrido ghataniva || || upadhisambandhavashatparatma hyupadhidharmananubhati
    tadgunah | ayovikaranavikarivahnivat sadaikarupo'pi parah svabhavat || || shishya uvaca | bhramenapyanyatha
    va'stu jivabhavah paratmanah | tadupadheranaditvannanadernasha ishyate || || ato'sya jivabhavo'pi
    nitya bhavati samsritih | na nivarteta tanmokshah katham me shriguro vada || || shrigururuvaca | samyakprishtam
    tvaya vidvansavadhanena tacchrinu | pramaniki na bhavati bhrantya mohitakalpana || || bhrantim vina
    tvasangasya nishkriyasya nirakriteh | na ghatetarthasambandho nabhaso nilatadivat || || svasya drashturnirgunasyakriyasya
    pratyagbodhanandarupasya buddheh | bhrantya prapto jivabhavo na satyo mohapaye nastyavastusvabhavat
    || || yavadbhrantistavadevasya satta mithyajnanojjrimbhitasya pramadat | rajjvam sarpo bhrantikalina
    eva bhranternashe naiva sarpo'pi tadvat || anaditvamavidyayah karyasyapi tatheshyate | utpannayam
    tu vidyayamavidyakamanadyapi || || prabodhe svapnavatsarvam sahamulam vinashyati | anadyapidam no
    nityam pragabhava iva sphutam || || anaderapi vidhvamsah pragabhavasya vikshitah | yadbuddhyupadhisambandhatparikalpitamatmani
    || || jivatvam na tato'nyastu svarupena vilakshanah | sambandhastvatmano buddhya mithyajnanapurahsarah
    || vinivrittirbhavettasya samyagjnanena nanyatha | brahmatmaikatvavijnanam samyagjnanam shrutermatam
    || || tadatmanatmanoh samyagvivekenaiva sidhyati | tato vivekah kartavyah pratyagatmasadatmanoh ||
    pratyagatmasadatmanoh jalam pankavadatyantam pankapaye jalam sphutam | yatha bhati tathatmapi doshabhave
    sphutaprabhah || || asannivrittau tu sadatmana sphutam pratitiretasya bhavetpraticah | tato nirasah
    karaniya eva sadatmanah sadhvahamadivastunah || ato nayam paratma syadvijnanamayashabdabhak | vikaritvajjadatvacca
    paricchinnatvahetutah | drishyatvadvyabhicaritvannanityo nitya ishyate || || anandapratibimbacumbitatanurvrittistamojrimbhita
    syadanandamayah priyadigunakah sveshtarthalabhodayah | punyasyanubhave vibhati kritinamanandarupah
    svayam sarvo nandati yatra sadhu tanubhrinmatrah prayatnam vina || anandamayakoshasya sushuptau sphurtirutkata
    | svapnajagarayorishadishtasandarshanadina || || naivayamanandamayah paratma sopadhikatvatprakritervikarat
    | karyatvahetoh sukritakriyaya vikarasanghatasamahitatvat || || pancanamapi koshanam nishedhe yuktitah
    shruteh | tannishedhavadhi sakshi bodharupo'vashishyate || yo'yamatma svayanjyotih pancakoshavilakshanah
    | avasthatrayasakshi sannirvikaro niranjanah | sadanandah sa vijneyah svatmatvena vipashcita || ||
    shishya uvaca | mithyatvena nishiddheshu kosheshveteshu pancasu | sarvabhavam vina kincinna pashyamyatra
    he guro | vijneyam kimu vastvasti svatmana''tmavipashcita || svatmanatra vipashcita shrigururuvaca
    | satyamuktam tvaya vidvannipuno'si vicarane | ahamadivikaraste tadabhavo'yamapyanu || sarve yenanubhuyante
    yah svayam nanubhuyate | tamatmanam veditaram viddhi buddhya susukshmaya || || tatsakshikam bhavettattadyadyadyenanubhuyate
    | kasyapyananubhutarthe sakshitvam nopayujyate || asau svasakshiko bhavo yatah svenanubhuyate | atah
    param svayam sakshatpratyagatma na cetarah || || jagratsvapnasushuptishu sphutataram yo'sau samujjrimbhate
    pratyagrupataya sadahamahamityantah sphurannaikadha | nanakaravikarabhagina iman pashyannahandhimukhan
    nityanandacidatmana sphurati tam viddhi svametam hridi || || ghatodake bimbitamarkabimba malokya mudho
    ravimeva manyate | tatha cidabhasamupadhisamstham bhrantyahamityeva jado'bhimanyate || || ghatam jalam
    tadgatamarkabimbam vihaya sarvam vinirikshyate'rkah | tatastha etattritayavabhasakah svayamprakasho
    vidusha yatha tatha || || deham dhiyam citpratibimbamevam visrijya buddhau nihitam guhayam | drashtaramatmanamakhandabodham
    sarvaprakasham sadasadvilakshanam || || nityam vibhum sarvagatam susukshmam antarbahihshunyamananyamatmanah
    | vijnaya samyannijarupametat puman vipapma virajo vimrityuh || || vishoka anandaghano vipashcit svayam
    kutashcinna bibheti kashcit | nanyo'sti pantha bhavabandhamukteh vina svatattvavagamam mumukshoh ||
    || brahmabhinnatvavijnanam bhavamokshasya karanam | yenadvitiyamanandam brahma sampadyate budhaih
    || brahmabhutastu samsrityai vidvannavartate punah | vijnatavyamatah samyagbrahmabhinnatvamatmanah
    || || satyam jnanamanantam brahma vishuddham param svatahsiddham | nityanandaikarasam pratyagabhinnam
    nirantaram jayati || || sadidam paramadvaitam svasmadanyasya vastuno'bhavat | na hyanyadasti kincit
    samyak paramarthatattvabodhadashayam || paratattvabodhasudashayam yadidam sakalam vishvam nanarupam
    pratitamajnanat | tatsarvam brahmaiva pratyastasheshabhavanadosham || || mritkaryabhuto'pi mrido na
    bhinnah kumbho'sti sarvatra tu mritsvarupat | na kumbharupam prithagasti kumbhah kuto mrisha kalpitanamamatrah
    || || kenapi mridbhinnataya svarupam ghatasya sandarshayitum na shakyate | ato ghatah kalpita eva
    moha nmrideva satyam paramarthabhutam || || sadbrahmakaryam sakalam sadevam tanmatrametanna tato'nyadasti
    | astiti yo vakti na tasya moho vinirgato nidritavatprajalpah || || brahmaivedam vishvamityeva vani
    shrauti brute'tharvanishtha varishtha | tasmadetadbrahmamatram hi vishvam nadhishthanadbhinnata''ropitasya
    || || satyam yadi syajjagadetadatmano' nantattvahanirnigamapramanata | asatyavaditvamapishituh sya
    nnaitattrayam sadhu hitam mahatmanam || || ishvaro vastutattvajno na caham teshvavasthitah | na ca
    matsthani bhutanityevameva vyaciklripat || yadi satyam bhavedvishvam sushuptavupalabhyatam | yannopalabhyate
    kincidato'satsvapnavanmrisha || || atah prithannasti jagatparatmanah prithakpratitistu mrisha gunadivat
    | gunahivat aropitasyasti kimarthavatta' dhishthanamabhati tatha bhramena || || bhrantasya yadyadbhramatah
    pratitam brahmaiva tattadrajatam hi shuktih | idantaya brahma sadaiva rupyate tvaropitam brahmani
    namamatram || || atah param brahma sadadvitiyam vishuddhavijnanaghanam niranjanam | prashantamadyantavihinamakriyam
    nirantaranandarasasvarupam || || nirastamayakritasarvabhedam nityam sukham nishkalamaprameyam | arupamavyaktamanakhyamavyayam
    jyotih svayam kincididam cakasti || || jnatrijneyajnanashunyamanantam nirvikalpakam | kevalakhandacinmatram
    param tattvam vidurbudhah || || aheyamanupadeyam manovacamagocaram | aprameyamanadyantam brahma purnamaham
    mahah || tattvampadabhyamabhidhiyamanayoh brahmatmanoh shodhitayoryadittham | shrutya tayostattvamasiti
    samyag ekatvameva pratipadyate muhuh || ekyam tayorlakshitayorna vacyayoh nigadyate'nyonyaviruddhadharminoh
    | khadyotabhanvoriva rajabhrityayoh kupamburashyoh paramanumervoh || || tayorvirodho'yamupadhikalpito
    na vastavah kashcidupadhireshah | ishasya maya mahadadikaranam jivasya karyam sharinu pancakosham
    || etavupadhi parajivayostayoh samyannirase na paro na jivah | rajyam narendrasya bhatasya khetak
    stayorapohe na bhato na raja || || athata adesha iti shrutih svayam nishedhati brahmani kalpitam dvayam
    | shrutipramananugrihitabodha pramananugrihitayuktya ttayornirasah karaniya eva || || nedam nedam
    kalpitatvanna satyam rajjudrishtavyalavatsvapnavacca | ittham drishyam sadhuyuktya vyapohya jneyah
    pashcadekabhavastayoryah || || tatastu tau lakshanaya sulakshyau tayorakhandaikarasatvasiddhaye |
    nalam jahatya na tatha'jahatya kintubhayarthatmikayaiva bhavyam || sa devadatto'yamitiha caikata viruddhadharmamshamapasya
    kathyate | yatha tatha tattvamasitivakye viruddhadharmanubhayatra hitva || || samlakshya cinmatrataya
    sadatmanoh akhandabhavah pariciyate budhaih | evam mahavakyashatena kathyate brahmatmanoraikyamakhandabhavah
    || || asthulamityetadasannirasya siddham svato vyomavadapratarkyam | ato mrishamatramidam pratitam
    jahihi yatsvatmataya grihitam | brahmahamityeva vishuddhabuddhya viddhi svamatmanamakhandabodham ||
    || mritkaryam sakalam ghatadi satatam mrinmatramevahitam tadvatsajjanitam sadatmakamidam sanmatramevakhilam
    | yasmannasti satah param kimapi tatsatyam sa atma svayam tasmattattvamasi prashantamamalam brahmadvayam
    yatparam || || nidrakalpitadeshakalavishayajnatradi sarvam yatha mithya tadvadihapi jagrati jagatsvajnanakaryatvatah
    | yasmadevamidam sharirakaranapranahamadyapyasat tasmattattvamasi prashantamamalam brahmadvayam yatparam
    || || yatra bhrantya kalpitam tadviveke tattanmatram naiva tasmadvibhinnam | svapne nashtam svapnavishvam
    vicitram svasmadbhinnam kinnu drishtam prabodhe || || jatinitikulagotraduragam namarupagunadoshavarjitam
    | deshakalavishayativarti yad brahma tattvamasi bhavayatmani || || yatparam sakalavagagocaram gocaram
    vimalabodhacakshushah | shuddhacidghanamanadi vastu yad brahma tattvamasi bhavayatmani || || shadbhirurmibhirayogi
    yogihrid bhavitam na karanairvibhavitam | buddhyavedyamanavadyamasti yad brahma tattvamasi bhavayatmani
    || || bhrantikalpitajagatkalashrayam svashrayam ca sadasadvilakshanam | nishkalam nirupamanavaddhi
    yad brahma tattvamasi bhavayatmani || || janmavriddhiparinatyapakshaya vyadhinashanavihinamavyayam
    | vishvasrishtyavavighatakaranam brahma tattvamasi bhavayatmani || || astabhedamanapastalakshanam
    nistarangajalarashinishcalam | nityamuktamavibhaktamurti yad brahma tattvamasi bhavayatmani || ||
    ekameva sadanekakaranam karanantaranirasyakaranam | karyakaranavilakshanam svayam brahma tattvamasi
    bhavayatmani || || nirvikalpakamanalpamaksharam yatksharaksharavilakshanam param | nityamavyayasukham
    niranjanam brahma tattvamasi bhavayatmani || || yadvibhati sadanekadha bhrama nnamarupagunavikriyatmana
    | hemavatsvayamavikriyam sada brahma tattvamasi bhavayatmani || || yaccakastyanaparam paratparam pratyagekarasamatmalakshanam
    | satyacitsukhamanantamavyayam brahma tattvamasi bhavayatmani || || uktamarthamimamatmani svayam bhavayetprathitayuktibhirdhiya
    | samshayadirahitam karambuvat tena tattvanigamo bhavishyati || || sambodhamatram parishuddhatattvam
    vijnaya sanghe nripavacca sainye | tadashrayah svatmani sarvada sthito vilapaya brahmani vishvajatam
    || buddhau guhayam sadasadvilakshanam brahmasti satyam paramadvitiyam | tadatmana yo'tra vasedguhayam
    punarna tasyangaguhapraveshah || || jnate vastunyapi balavati vasana'nadiresha karta bhoktapyahamiti
    dridha ya'sya samsarahetuh | pratyagdrishtya''tmani nivasata sapaneya prayatna nmuktim prahustadiha
    munayo vasanatanavam yat || || aham mameti yo bhavo dehakshadavanatmani | adhyaso'yam nirastavyo vidusha
    svatmanishthaya || || jnatva svam pratyagatmanam buddhitadvrittisakshinam | so'hamityeva sadvrittya'natmanyatmamatim
    jahi || || lokanuvartanam tyaktva tyaktva dehanuvartanam | shastranuvartanam tyaktva svadhyasapanayam
    kuru || || lokavasanaya jantoh shastravasanayapi ca | dehavasanaya jnanam yathavannaiva jayate ||
    samsarakaragrihamokshamiccho rayomayam padanibandhasharinkhalam | vadanti tajjnah patu vasanatrayam
    yo'smadvimuktah samupaiti muktim || || jaladisamsargavashatprabhuta durgandhadhuta'garudivyavasana
    | sangharshanenaiva vibhati samya gvidhuyamane sati bahyagandhe || || antahshritanantadurantavasana
    dhulivilipta paramatmavasana | prajnatisangharshanato vishuddha pratiyate candanagandhavat sphutam
    || anatmavasanajalaistirobhutatmavasana | nityatmanishthaya tesham nashe bhati svayam sphutam || yatha
    yatha pratyagavasthitam manah tatha tatha muncati bahyavasanam | nihsheshamokshe sati vasananam atmanubhutih
    pratibandhashunya || || svatmanyeva sada sthitva mano nashyati yoginah | vasananam kshayashcatah svadhyasapanayam
    kuru || || tamo dvabhyam rajah sattvatsattvam shuddhena nashyati | tasmatsattvamavashtabhya svadhyasapanayam
    kuru || || prarabdham pushyati vapuriti nishcitya nishcalah | dhairyamalambya yatnena svadhyasapanayam
    kuru || || naham jivah param brahmetyatadvyavrittipurvakam | vasanavegatah praptasvadhyasapanayam
    kuru || || shrutya yuktya svanubhutya jnatva sarvatmyamatmanah | kvacidabhasatah praptasvadhyasapanayam
    kuru || || anadanavisargabhyamishannasti kriya muneh | tadekanishthaya nityam svadhyasapanayam kuru
    || || tattvamasyadivakyotthabrahmatmaikatvabodhatah | brahmanyatmatvadardhyaya svadhyasapanayam kuru
    || || ahambhavasya dehe'sminnihsheshavilayavadhi | savadhanena yuktatma svadhyasapanayam kuru || ||
    pratitirjivajagatoh svapnavadbhati yavata | tavannirantaram vidvansvadhyasapanayam kuru || || nidraya
    lokavartayah shabdaderapi vismriteh | kvacinnavasaram dattva cintayatmanamatmani || || matapitrormalodbhutam
    malamamsamayam vapuh | tyaktva candalavadduram brahmibhuya kriti bhava || || ghatakasham mahakasha
    ivatmanam paratmani | vilapyakhandabhavena tushni bhava sada mune || svaprakashamadhishthanam svayambhuya
    sadatmana | brahmandamapi pindandam tyajyatam malabhandavat || || cidatmani sadanande deharudhamahandhiyam
    | niveshya lingamutsrijya kevalo bhava sarvada || || yatraisha jagadabhaso darpanantah puram yatha
    | tadbrahmahamiti jnatva kritakrityo bhavishyasi || || yatsatyabhutam nijarupamadyam cidadvayanandamarupamakriyam
    | tadetya mithyavapurutsrijeta shailushavadveshamupattamatmanah || || sarvatmana drishyamidam mrishaiva
    naivahamarthah kshanikatvadarshanat | janamyaham sarvamiti pratitih kuto'hamadeh kshanikasya sidhyet
    || || ahampadarthastvahamadisakshi nityam sushuptavapi bhavadarshanat | brute hyajo nitya iti shrutih
    svayam tatpratyagatma sadasadvilakshanah || || vikarinam sarvavikaravetta nityavikaro bhavitum samarhati
    | manorathasvapnasushuptishu sphutam punah punardrishtamasattvametayoh || || ato'bhimanam tyaja mamsapinde
    pindabhimaninyapi buddhikalpite | kalatrayabadhyamakhandabodham jnatva svamatmanamupaihi shantim ||
    || tyajabhimanam kulagotranama rupashrameshvardrashavashriteshu | lingasya dharmanapi kartritadim
    styaktva bhavakhandasukhasvarupah || || santyanye pratibandhah pumsah samsarahetavo drishtah | teshamevam
    mulam prathamavikaro bhavatyahankarah || yavatsyatsvasya sambandho'hankarena duratmana | tavanna leshamatrapi
    muktivarta vilakshana || || ahankaragrahanmuktah svarupamupapadyate | candravadvimalah purnah sadanandah
    svayamprabhah || || yo va pure so'hamiti pratito buddhya praklriptastamasa'timudhaya | buddhya'viviktastamasa
    tasyaiva nihsheshataya vinashe brahmatmabhavah pratibandhashunyah || || brahmanandanidhirmahabalavata'hankaraghorahina
    samveshtyatmani rakshyate gunamayaishcandestribhirmastakaih vijnanakhyamahasina shrutimata vicchidya
    shirshatrayam nirmulyahimimam nidhim sukhakaram dhiro'nubhoktunkshamah || || yavadva yatkincidvishadoshasphurtirasti
    ceddehe | kathamarogyaya bhavettadvadahantapi yogino muktyai || || ahamo'tyantanivrittya tatkritananavikalpasamhritya
    | pratyaktattvavivekadidamahamasmiti vindate tattvam || ahankare kartaryahamiti matim munca sahasa
    ahankartaryasminnahamiti vikaratmanyatmapratiphalajushi svasthitimushi | yadadhyasatprapta janimritijaraduhkhabahula
    praticashcinmurtestava sukhatanoh samsritiriyam || || sadaikarupasya cidatmano vibho ranandamurteranavadyakirteh
    | naivanyatha kvapyavikarinaste vinahamadhyasamamushya samsritih || || tasmadahankaramimam svashatrum
    bhokturgale kantakavatpratitam | vicchidya vijnanamahasina sphutam bhunkshvatmasamrajyasukham yatheshtam
    || || tato'hamadervinivartya vrittim santyaktaragah paramarthalabhat | tushnim samassvatmasukhanubhutya
    purnatmana brahmani nirvikalpah || || samulakritto'pi mahanaham punah vyullekhitah syadyadi cetasa
    kshanam | sanjivya vikshepashatam karoti nabhasvata pravrishi varido yatha || || nigrihya shatrorahamo'vakashah
    kvacinna deyo vishayanucintaya | sa eva sanjivanaheturasya prakshinajambiratarorivambu || || dehatmana
    samsthita eva kami vilakshanah kamayita katham syat | ato'rthasandhanaparatvameva bhedaprasaktya bhavabandhahetuh
    || || karyapravardhanadbijapravriddhih paridrishyate | karyanashadbijanashastasmatkaryam nirodhayet
    || || vasanavriddhitah karyam karyavriddhya ca vasana | vardhate sarvatha pumsah samsaro na nivartate
    || || samsarabandhavicchittyai tad dvayam pradahedyatih | vasanavriddhiretabhyam cintaya kriyaya bahih
    || vasana preryate hyantah tabhyam pravardhamana sa sute samsritimatmanah | trayanam ca kshayopayah
    sarvavasthasu sarvada || || sarvatra sarvatah sarvabrahmamatravalokanaih | sadbhavavasanadardhyattattrayam
    layamashnute || || kriyanashe bhaveccintanasho'smadvasanakshayah | vasanaprakshayo mokshah sa jivanmuktirishyate
    || sadvasanasphurtivijrimbhane sati hyasau vilinapyahamadivasana | vilina tvahamadivasana atiprakrishtapyarunaprabhayam
    viliyate sadhu yatha tamisra || || tamastamahkaryamanarthajalam na drishyate satyudite dineshe | tatha'dvayanandarasanubhutau
    naivasti bandho na ca duhkhagandhah || || drishyam pratitam pravilapayansan sanmatramanandaghanam
    vibhavayan | samahitah sanbahirantaram va kalam nayethah sati karmabandhe || || pramado brahmanishthayam
    na kartavyah kadacana | pramado mrityurityaha bhagavanbrahmanah sutah || || na pramadadanartho'nyo
    jnaninah svasvarupatah | tato mohastato'handhistato bandhastato vyatha || || vishayabhimukham drishtva
    vidvamsamapi vismritih | vikshepayati dhidoshairyosha jaramiva priyam || || yathapakrishtam shaivalam
    kshanamatram na tishthati | avrinoti tatha maya prajnam vapi paranmukham || || lakshyacyutam cedyadi
    cittamishad bahirmukham sannipatettatastatah | pramadatah pracyutakelikandukah sopanapanktau patito
    yatha tatha || || vishayeshvavishaccetah sankalpayati tadgunan | samyaksankalpanatkamah kamatpumsah
    pravartanam || || atah pramadanna paro'sti mrityuh vivekino brahmavidah samadhau | samahitah siddhimupaiti
    samyak samahitatma bhava savadhanah || || tatah svarupavibhramsho vibhrashtastu patatyadhah | patitasya
    vina nasham punarnaroha ikshyate || || sankalpam varjayettasmatsarvanarthasya karanam | apathyani
    hi vastuni vyadhigrasto yathotsrije | jivato yasya kaivalyam videhe sa ca kevalah | yatkincit pashyato
    bhedam bhayam brute yajuhshrutih || || yada kada vapi vipashcidesha brahmanyanante'pyanumatrabhedam
    | pashyatyathamushya bhayam tadaiva yadvikshitam bhinnataya pramadat || shrutismritinyayashatairnishiddhe
    drishye'tra yah svatmamatim karoti | upaiti duhkhopari duhkhajatam nishiddhakarta sa malimluco yatha
    || || satyabhisandhanarato vimukto mahattvamatmiyamupaiti nityam | mithyabhisandhanaratastu nashyed
    drishtam tadetadyadacauracaurayoh || yatirasadanusandhim bandhahetum vihaya svayamayamahamasmityatmadrishtyaiva
    tishthet sukhayati nanu nishtha brahmani svanubhutya harati paramavidyakaryaduhkham pratitam || ||
    bahyanusandhih parivardhayetphalam durvasanameva tatastato'dhikam | jnatva vivekaih parihritya bahyam
    svatmanusandhim vidadhita nityam || || bahye niruddhe manasah prasannata manahprasade paramatmadarshanam
    | tasminsudrishte bhavabandhanasho bahirnirodhah padavi vimukteh || || kah panditah sansadasadviveki
    shrutipramanah paramarthadarshi | jananhi kuryadasato'valambam svapatahetoh shishuvanmumukshuh ||
    || dehadisamsaktimato na muktih muktasya dehadyabhimatyabhavah | suptasya no jagaranam na jagratah
    svapnastayorbhinnagunashrayatvat || || antarbahih svam sthirajangameshu jnatva''tmanadharataya vilokya
    | tyaktakhilopadhirakhandarupah purnatmana yah sthita esha muktah || || sarvatmana bandhavimuktihetuh
    sarvatmabhavanna paro'sti kashcit | drishyagrahe satyupapadyate'sau sarvatmabhavo'sya sadatmanishthaya
    || || drishyasyagrahanam katham nu ghatate dehatmana tishthato bahyarthanubhavaprasaktamanasastattatkriyam
    kurvatah | sannyastakhiladharmakarmavishayairnityatmanishthaparaih tattvajnaih karaniyamatmani sadanandecchubhiryatnatah
    || || sarvatmasiddhaye bhikshoh kritashravanakarmanah | samadhim vidadhatyesha shanto danta iti shrutih
    || || arudhashakterahamo vinashah kartunna shakya sahasapi panditaih | ye nirvikalpakhyasamadhinishcalah
    tanantara'nantabhava hi vasanah || || ahambuddhyaiva mohinya yojayitva''vriterbalat | vikshepashaktih
    purusham vikshepayati tadgunaih || || vikshepashaktivijayo vishamo vidhatum nihsheshamavaranashaktinivrittyabhave
    | drigdrishyayoh sphutapayojalavadvibhage nashyettadavaranamatmani ca svabhavat | nihsamshayena bhavati
    pratibandhashunyo vikshepanam na hi tada yadi cenmrisharthe || samyagvivekah sphutabodhajanyo vibhajya
    drigdrishyapadarthatattvam | chinatti mayakritamohabandham yasmadvimuktastu punarna samsritih || paravaraikatvavivekavahnih
    dahatyavidyagahanam hyashesham | kim syatpunah samsaranasya bijam advaitabhavam samupeyusho'sya ||
    || avaranasya nivrittirbhavati hi samyakpadarthadarshanatah | mithyajnanavinashastadvikshepajanitaduhkhanivrittih
    || || etattritayam drishtam samyagrajjusvarupavijnanat | tasmadvastusatattvam jnatavyam bandhamuktaye
    vidusha || || ayo'gniyogadiva satsamanvayan matradirupena vijrimbhate dhih | tatkaryametaddvitayam
    yato mrisha drishtam bhramasvapnamanoratheshu || || tato vikarah prakriterahammukha dehavasana vishayashca
    sarve | kshane'nyathabhavitaya hyamisha masattvamatma tu kadapi nanyatha || masattvamatma tu kadapi
    nityadvayakhandacidekarupo buddhyadisakshi sadasadvilakshanah | ahampadapratyayalakshitarthah pratyak
    sadanandaghanah paratma || || ittham vipashcitsadasadvibhajya nishcitya tattvam nijabodhadrishtya
    | jnatva svamatmanamakhandabodham tebhyo vimuktah svayameva shamyati || || ajnanahridayagranthernihsheshavilayastada
    | samadhina'vikalpena yada'dvaitatmadarshanam || || tvamahamidamitiyam kalpana buddhidoshat prabhavati
    paramatmanyadvaye nirvisheshe | pravilasati samadhavasya sarvo vikalpo vilayanamupagacchedvastutattvavadhritya
    || || shanto dantah paramuparatah kshantiyuktah samadhim kurvannityam kalayati yatih svasya sarvatmabhavam
    | tenavidyatimirajanitansadhu dagdhva vikalpan brahmakritya nivasati sukham nishkriyo nirvikalpah
    || || samahita ye pravilapya bahyam shrotradi cetah svamaham cidatmani | ta eva mukta bhavapashabandhaih
    nanye tu parokshyakathabhidhayinah || || upadhibhedatsvayameva bhidyate copadhyapohe svayameva kevalah
    | tasmadupadhervilayaya vidvan vasetsada'kalpasamadhinishthaya || || sati sakto naro yati sadbhavam
    hyekanishthaya | kitako bhramaram dhyayan bhramaratvaya kalpate || || kriyantarasaktimapasya kitako
    dhyayannalitvam hyalibhavamricchati | tathaiva yogi paramatmatattvam dhyatva samayati tadekanishthaya
    || || ativa sukshmam paramatmatattvam na sthuladrishtya pratipattumarhati | samadhinatyantasusukshmavrittya
    jnatavyamaryairatishuddhabuddhibhih || || yatha suvarnam putapakashodhitam tyaktva malam svatmagunam
    samricchati | tatha manah sattvarajastamomalam dhyanena santyajya sameti tattvam || || nirantarabhyasavashattadittham
    pakvam mano brahmani liyate yada | tada samadhih savikalpavarjitah svato'dvayanandarasanubhavakah
    || || samadhina'nena samastavasana granthervinasho'khilakarmanashah | antarbahih sarvata eva sarvada
    svarupavisphurtirayatnatah syat || || shruteh shatagunam vidyanmananam mananadapi | nididhyasam lakshagunamanantam
    nirvikalpakam || || nirvikalpakasamadhina sphutam brahmatattvamavagamyate dhruvam | nanyatha calataya
    manogateh pratyayantaravimishritam bhavet || || atah samadhatsva yatendriyah san nirantaram shantamanah
    pratici | vidhvamsaya dhvantamanadyavidyaya kritam sadekatvavilokanena || || yogasya prathamadvaram
    vannirodho'parigrahah | nirasha ca niriha ca nityamekantashilata || || ekantasthitirindriyoparamane
    heturdamashcetasah samrodhe karanam shamena vilayam yayadahamvasana | tenanandarasanubhutiracala brahmi
    sada yoginah tasmaccittanirodha eva satatam karyah prayatno muneh || || prayatnanmuneh vacam niyacchatmani
    tam niyaccha buddhau dhiyam yaccha ca buddhisakshini | tam capi purnatmani nirvikalpe vilapya shantim
    paramam bhajasva || || dehapranendriyamanobuddhyadibhirupadhibhih | yairyairvrittehsamayogastattadbhavo'sya
    yoginah || || tannivrittya muneh samyak sarvoparamanam sukham | sandrishyate sadanandarasanubhavaviplavah
    || || antastyago bahistyago viraktasyaiva yujyate | tyajatyantarbahihsangam viraktastu mumukshaya
    || || bahistu vishayaih sangam tathantarahamadibhih | virakta eva shaknoti tyaktum brahmani nishthitah
    || || vairagyabodhau purushasya pakshivat pakshau vijanihi vicakshana tvam | vimuktisaudhagralatadhirohanam
    tabhyam vina nanyatarena sidhyati || || atyantavairagyavatah samadhih samahitasyaiva dridhaprabodhah
    | prabuddhatattvasya hi bandhamuktih muktatmano nityasukhanubhutih || || vairagyanna param sukhasya
    janakam pashyami vashyatmanah taccecchuddhataratmabodhasahitam svarajyasamrajyadhuk | etaddvaramajasramuktiyuvateryasmattvamasmatparam
    sarvatrasprihaya sadatmani sada prajnam kuru shreyase || || asham chinddhi vishopameshu vishayeshveshaiva
    mrityoh kriti styaktva jatikulashrameshvabhimatim muncatiduratkriyah | dehadavasati tyajatmadhishanam
    prajnam kurushvatmani tvam drashtasyamano'si nirdvayaparam brahmasi yadvastutah || lakshye brahmani
    manasam dridhataram samsthapya bahyendriyam svasthane viniveshya nishcalatanushcopekshya dehasthitim
    | brahmatmaikyamupetya tanmayataya cakhandavrittya'nisham brahmanandarasam pibatmani muda shunyaih
    kimanyairbhrisham || anatmacintanam tyaktva kashmalam duhkhakaranam | cintayatmanamanandarupam yanmuktikaranam
    || || esha svayanjyotirasheshasakshi vijnanakosho vilasatyajasram | vijnanakoshe lakshyam vidhayainamasadvilakshana
    makhandavrittya''tmataya'nubhavaya || || etamacchinnaya vrittya pratyayantarashunyaya | ullekhayanvijaniyatsvasvarupataya
    sphutam || || atratmatvam dridhikurvannahamadishu santyajan | udasinataya teshu tishthetsphutaghatadivat
    || vishuddhamantahkaranam svarupe niveshya sakshinyavabodhamatre | shanaih shanairnishcalatamupanayan
    purnam svamevanuvilokayettatah || dehendriyapranamano'hamadibhih svajnanaklriptairakhilairupadhibhih
    | vimuktamatmanamakhandarupam purnam mahakashamivavalokayet || || ghatakalashakusulasucimukhyaih gaganamupadhishatairvimuktamekam
    | bhavati na vividham tathaiva shuddham paramahamadivimuktamekameva || || brahmadistambaparyanta mrishamatra
    upadhayah | tatah purnam svamatmanam pashyedekatmana sthitam || || yatra bhrantya kalpitam tadviveke
    tattanmatram naiva tasmadvibhinnam | bhranternashe bhati drishtahitattvam rajjustadvadvishvamatmasvarupam
    || || svayam brahma svayam vishnuh svayamindrah svayam shivah | svayam vishvamidam sarvam svasmadanyanna
    kincana || || antah svayam capi bahih svayam ca svayam purastat svayameva pashcat | svayam hyavacyam
    svayamapyudicyam tathoparishtatsvayamapyadhastat || || tarangaphenabhramabudbudadi sarvam svarupena
    jalam yatha tatha | cideva dehadyahamantametat sarvam cidevaikarasam vishuddham || || sadevedam sarvam
    jagadavagatam vanmanasayoh sato'nyannastyeva prakritiparasimni sthitavatah | prithak kim mritsnayah
    kalashaghatakumbhadyavagatam vadatyesha bhrantastvamahamiti mayamadiraya || || kriyasamabhiharena
    yatra nanyaditi shrutih | braviti dvaitarahityam mithyadhyasanivrittaye || || akashavannirmalanirvikalpam
    nihsimanihspandananirvikaram | antarbahihshunyamananyamadvayam svayam param brahma kimasti bodhyam
    || || vaktavyam kimu vidyate'tra bahudha brahmaiva jivah svayam brahmaitajjagadatatam nu sakalam brahmadvitiyam
    shrutih | brahmaivahamiti prabuddhamatayah santyaktabahyah sphutam brahmibhuya vasanti santatacidanandatmanaitaddhruvam
    || anandatmanaiva dhruvam jahi malamayakoshe'handhiyotthapitasham prasabhamanilakalpe lingadehe'pi
    pashcat | nigamagaditakirtim nityamanandamurtim svayamiti pariciya brahmarupena tishtha || || shavakaram
    yavadbhajati manujastavadashucih parebhyah syatklesho jananamaranavyadhinilayah | yadatmanam shuddham
    kalayati shivakaramacalam tada tebhyo mukto bhavati hi tadaha shrutirapi || || svatmanyaropitasheshabhasavastunirasatah
    | svayameva param brahma purnamadvayamakriyam || || samahitayam sati cittavrittau paratmani brahmani
    nirvikalpe | na drishyate kashcidayam vikalpah prajalpamatrah parishishyate yatah || asatkalpo vikalpo'yam
    vishvamityekavastuni | nirvikare nirakare nirvisheshe bhida kutah || || drashtudarshanadrishyadibhavashunyaikavastuni
    | nirvikare nirakare nirvisheshe bhida kutah || || kalparnava ivatyantaparipurnaikavastuni | nirvikare
    nirakare nirvisheshe bhida kutah || || tejasiva tamo yatra pralinam bhrantikaranam | advitiye pare
    tattve nirvisheshe bhida kutah || || ekatmake pare tattve bhedavarta katham vaset | sushuptau sukhamatrayam
    bhedah kenavalokitah || || na hyasti vishvam paratattvabodhat sadatmani brahmani nirvikalpe | kalatraye
    napyahirikshito gune na hyambubindurmrigatrishnikayam || || mayamatramidam dvaitamadvaitam paramarthatah
    | iti brute shrutih sakshatsushuptavanubhuyate || || ananyatvamadhishthanadaropyasya nirikshitam |
    panditai rajjusarpadau vikalpo bhrantijivanah || || cittamulo vikalpo'yam cittabhave na kashcana |
    atashcittam samadhehi pratyagrupe paratmani || || kimapi satatabodham kevalanandarupam nirupamamativelam
    nityamuktam niriham | niravadhigaganabham nishkalam nirvikalpam hridi kalayati vidvan brahma purnam
    samadhau || || prakritivikritishunyam bhavanatitabhavam samarasamasamanam manasambandhaduram | nigamavacanasiddham
    nityamasmatprasiddham hridi kalayati vidvan brahma purnam samadhau || || ajaramamaramastabhavavastusvarupam
    stimitasalilarashiprakhyamakhyavihinam | shamitagunavikaram shashvatam shantamekam hridi kalayati
    vidvan brahma purnam samadhau || || samahitantahkaranah svarupe vilokayatmanamakhandavaibhavam | vicchinddhi
    bandham bhavagandhagandhitam yatnena pumstvam saphalikurushva || sarvopadhivinirmuktam saccidanandamadvayam
    | bhavayatmanamatmastham na bhuyah kalpase'dhvane || || chayeva pumsah paridrishyamana mabhasarupena
    phalanubhutya | shariramaracchavavannirastam punarna sandhatta idam mahatma || || satatavimalabodhanandarupam
    sametya tyaja jadamalarupopadhimetam sudure | atha punarapi naisha smaryatam vantavastu smaranavishayabhutam
    kalpate kutsanaya || || samulametatparidahya vahnau sadatmani brahmani nirvikalpe | tatah svayam nityavishuddhabodha
    nandatmana tishthati vidvarishthah || || prarabdhasutragrathitam shariram prayatu va tishthatu goriva
    srak | na tatpunah pashyati tattvavetta ''nandatmani brahmani linavrittih || || akhandanandamatmanam
    vijnaya svasvarupatah | kimicchan kasya va hetordeham pushnati tattvavit || || samsiddhasya phalam
    tvetajjivanmuktasya yoginah | bahirantah sadanandarasasvadanamatmani || || vairagyasya phalam bodho
    bodhasyoparatih phalam | svanandanubhavacchantireshaivoparateh phalam || || yadyuttarottarabhavah
    purvapurvantu nishphalam | nivrittih parama triptiranando'nupamah svatah || || drishtaduhkheshvanudvego
    vidyayah prastutam phalam | yatkritam bhrantivelayam nana karma jugupsitam | pashcannaro vivekena
    tatkatham kartumarhati || || vidyaphalam syadasato nivrittih pravrittirajnanaphalam tadikshitam |
    tajjnajnayoryanmrigatrishnikadau nocedvidam drishtaphalam kimasmat || ajnanahridayagranthervinasho
    yadyasheshatah | anicchorvishayah kim nu pravritteh karanam svatah || vasananudayo bhogye vairagyasya
    tadavadhih | ahambhavodayabhavo bodhasya paramavadhih | linavrittairanutpattirmaryadoparatestu sa
    || brahmakarataya sada sthitataya nirmuktabahyarthadhi ranyaveditabhogyabhogakalano nidraluvadbalavat
    | svapnalokitalokavajjagadidam pashyankvacillabdhadhi raste kashcidanantapunyaphalabhugdhanyah sa
    manyo bhuvi || || sthitaprajno yatirayam yah sadanandamashnute | brahmanyeva vilinatma nirvikaro vinishkriyah
    || || brahmatmanoh shodhitayorekabhavavagahini | nirvikalpa ca cinmatra vrittih prajneti kathyate
    | susthita'sau bhavedyasya sthitaprajnah sa ucyate || || yasya sthita bhavetprajna yasyanando nirantarah
    | prapanco vismritaprayah sa jivanmukta ishyate || || linadhirapi jagarti jagraddharmavivarjitah |
    bodho nirvasano yasya sa jivanmukta ishyate || || shantasamsarakalanah kalavanapi nishkalah | yasya
    cittam vinishcintam sa jivanmukta ishyate || yah sacitto'pi nishcittah vartamane'pi dehe'sminchayavadanuvartini
    | ahantamamata'bhavo jivanmuktasya lakshanam || || atitananusandhanam bhavishyadavicaranam | audasinyamapi
    praptam jivanmuktasya lakshanam || gunadoshavishishte'sminsvabhavena vilakshane | sarvatra samadarshitvam
    jivanmuktasya lakshanam || || ishtanishtarthasampraptau samadarshitaya''tmani | ubhayatravikaritvam
    jivanmuktasya lakshanam || || brahmanandarasasvadasaktacittataya yateh | antarbahiravijnanam jivanmuktasya
    lakshanam || || dehendriyadau kartavye mamahambhavavarjitah | audasinyena yastishthetsa jivanmuktalakshanah
    || vijnata atmano yasya brahmabhavah shruterbalat | bhavabandhavinirmuktah sa jivanmuktalakshanah
    || dehendriyeshvahambhava idambhavastadanyake | yasya no bhavatah kvapi sa jivanmukta ishyate || ||
    jiveshobhayasamsararupadurvasanojjhita | sa sarvada bhavedyasya sa jivanmukta ishyate || na pratyagbrahmanorbhedam
    kadapi brahmasargayoh | prajnaya yo vijaniti sa jivanmuktalakshanah || sadhubhih pujyamane'sminpidyamane'pi
    durjanaih | samabhavo bhavedyasya sa jivanmuktalakshanah || yatra pravishta vishayah parerita nadipravaha
    iva varirashau | linanti sanmatrataya na vikriyam utpadayantyesha yatirvimuktah || || vijnatabrahmatattvasya
    yathapurvam na samsritih | asti cenna sa vijnatabrahmabhavo bahirmukhah || || pracinavasanavegadasau
    samsaratiti cet | na sadekatvavijnananmandi bhavati vasana || || atyantakamukasyapi vrittih kunthati
    matari | tathaiva brahmani jnate purnanande manishinah || || nididhyasanashilasya bahyapratyaya ikshyate
    | braviti shrutiretasya prarabdham phaladarshanat || || sukhadyanubhavo yavattavatprarabdhamishyate
    | phalodayah kriyapurvo nishkriyo na hi kutracit || || aham brahmeti vijnanatkalpakotishatarjitam
    | sancitam vilayam yati prabodhatsvapnakarmavat || || yatkritam svapnavelayam punyam va papamulbanam
    | suptotthitasya kintatsyatsvargaya narakaya va || || svamasangamudasinam parijnaya nabho yatha |
    na shlishyati ca yatkincitkadacidbhavikarmabhih || shlishyate yatih kincit na nabho ghatayogena suragandhena
    lipyate | tathatmopadhiyogena taddharmairnaiva lipyate || || jnanodayatpurarabdham karmajnananna nashyati
    | adatva svaphalam lakshyamuddishyotsrishtabanavat || || vyaghrabuddhya vinirmukto banah pashcattu
    gomatau | na tishthati chinatyeva lakshyam vegena nirbharam || || prarabdham balavattaram khalu vidam
    bhogena tasya kshayah samyagjnanahutashanena vilayah praksancitagaminam | brahmatmaikyamavekshya tanmayataya
    ye sarvada samsthitah tesham tattritayam nahi kvacidapi brahmaiva te nirgunam || || upadhitadatmyavihinakevala
    brahmatmanaivatmani tishthato muneh | prarabdhasadbhavakatha na yukta svapnarthasambandhakatheva jagratah
    || || na hi prabuddhah pratibhasadehe dehopayoginyapi ca prapance | karotyahantam mamatamidantam kintu
    svayam tishthati jagarena || || na tasya mithyarthasamarthaneccha na sangrahastajjagato'pi drishtah
    | tatranuvrittiryadi cenmrisharthe na nidraya mukta itishyate dhruvam || || tadvatpare brahmani vartamanah
    sadatmana tishthati nanyadikshate | smritiryatha svapnavilokitarthe tatha vidah prashanamocanadau
    || || karmana nirmito dehah prarabdham tasya kalpyatam | nanaderatmano yuktam naivatma karmanirmitah
    || || ajo nityah shashvata iti brute shrutiramoghavak | ajo nitya iti brute shrutiresha tvamoghavak
    tadatmana tishthato'sya kutah prarabdhakalpana || || prarabdham sidhyati tada yada dehatmana sthitih
    | dehatmabhavo naiveshtah prarabdham tyajyatamatah || || sharirasyapi prarabdhakalpana bhrantireva
    hi | adhyastasya kutah sattvamasatyasya kuto janih | ajatasya kuto nashah prarabdhamasatah kutah ||
    || jnanenajnanakaryasya samulasya layo yadi | tishthatyayam katham deha iti shankavato jadan || ||
    samadhatum bahyadrishtya prarabdham vadati shrutih | na tu dehadisatyatvabodhanaya vipashcitam | yatah
    shruterabhiprayah paramarthaikagocarah || || paripurnamanadyantamaprameyamavikriyam | ekamevadvayam
    brahma neha nanasti kincana || || sadghanam cidghanam nityamanandaghanamakriyam | ekamevadvayam brahma
    neha nanasti kincana || || pratyagekarasam purnamanantam sarvatomukham | ekamevadvayam brahma neha
    nanasti kincana || || aheyamanupadeyamanadeyamanashrayam | manadheyamana ekamevadvayam brahma neha
    nanasti kincana || || nirgunam nishkalam sukshmam nirvikalpam niranjanam | ekamevadvayam brahma neha
    nanasti kincana || || anirupya svarupam yanmanovacamagocaram | ekamevadvayam brahma neha nanasti kincana
    || || satsamriddham svatahsiddham shuddham buddhamanidrisham | ekamevadvayam brahma neha nanasti kincana
    || || nirastaraga vinirastabhogah shantah sudanta yatayo mahantah | vijnaya tattvam parametadante
    praptah param nirvritimatmayogat || || bhavanapidam paratattvamatmanah svarupamanandaghanam vicarya
    | vidhuya moham svamanahprakalpitam muktah kritartho bhavatu prabuddhah || || samadhina sadhuvinishcalatmana
    pashyatmatattvam sphutabodhacakshusha | nihsamshayam samyagavekshitashce cchrutah padartho na punarvikalpyate
    || svasyavidyabandhasambandhamoksha tsatyajnananandarupatmalabdhau | shastram yuktirdeshikoktih pramanam
    cantahsiddha svanubhutih pramanam || || bandho mokshashca triptishca cinta''rogyakshudhadayah | svenaiva
    vedya yajjnanam pareshamanumanikam || || tatasthita bodhayanti guravah shrutayo yatha | prajnayaiva
    taredvidvanishvaranugrihitaya || || svanubhutya svayam jnatva svamatmanamakhanditam | samsiddhah sammukham
    tishthennirvikalpatmana''tmani || vedantasiddhantaniruktiresha brahmaiva jivah sakalam jagacca | akhandarupasthitireva
    moksho brahmadvitiye shrutayah pramanam || iti guruvacanacchrutipramanat paramavagamya satattvamatmayuktya
    | prashamitakaranah samahitatma kvacidacalakritiratmanishthato'bhut || kincitkalam samadhaya pare
    brahmani manasam | utthaya paramanandadidam vacanamabravit || buddhirvinashta galita pravrittih brahmatmanorekataya'dhigatya
    | idam na jane'pyanidam na jane kim va kiyadva sukhamastyaparam || vaca vaktumashakyameva manasa mantum
    na va shakyate svanandamritapurapuritaparabrahmambudhervaibhavam | ambhorashivishirnavarshikashilabhavam
    bhajanme mano yasyamshamshalave vilinamadhuna''nandatmana nirvritam || || kva gatam kena va nitam
    kutra linamidam jagat | adhunaiva maya drishtam nasti kim mahadadbhutam || || kim heyam kimupadeyam
    kimanyatkim vilakshanam | akhandanandapiyushapurne brahmamaharnave || || na kincidatra pashyami na
    sharinomi na vedmyaham | svatmanaiva sadanandarupenasmi vilakshanah || || namo namaste gurave mahatmane
    vimuktasangaya saduttamaya | nityadvayanandarasasvarupine bhumne sada'paradayambudhamne || || yatkatakshashashisandracandrika
    patadhutabhavatapajashramah | praptavanahamakhandavaibhava nandamatmapadamakshayam kshanat || || dhanyo'ham
    kritakrityo'ham vimukto'ham bhavagrahat | nityanandasvarupo'ham purno'ham tvadanugrahat || || asango'hamanango'hamalingo'hamabhangurah
    | prashanto'hamananto'hamamalo'ham cirantanah || akartahamabhoktahamavikaro'hamakriyah | shuddhabodhasvarupo'ham
    kevalo'ham sadashivah || || drashtuh shroturvaktuh karturbhokturvibhinna evaham | nityanirantaranishkriyanihsimasangapurnabodhatma
    || || nahamidam nahamado'pyubhayoravabhasakam param shuddham | bahyabhyantarashunyam purnam brahmadvitiyamevaham
    || || nirupamamanaditattvam tvamahamidamada iti kalpanaduram | nityanandaikarasam satyam brahmadvitiyamevaham
    || || narayano'ham narakantako'ham purantako'ham purusho'hamishah | akhandabodho'hamasheshasakshi
    nirishvaro'ham niraham ca nirmamah || || sarveshu bhuteshvahameva samsthito jnanatmana'ntarbahirashrayah
    san | bhokta ca bhogyam svayameva sarvam yadyatprithagdrishtamidantaya pura || || mayyakhandasukhambhodhau
    bahudha vishvavicayah | utpadyante viliyante mayamarutavibhramat || || sthuladibhava mayi kalpita
    bhrama daropitanusphuranena lokaih | kale yatha kalpakavatsaraya nartvadayo nishkalanirvikalpe ||
    || aropitam nashrayadushakam bhavet kadapi mudhairatidoshadushitaih | mudhairmati nardrikarotyusharabhumibhagam
    maricikavari mahapravahah || || akashavallepavidurago'ham adityavadbhasyavilakshano'ham | aharyavannityavinishcalo'ham
    ambhodhivatparavivarjito'ham || || na me dehena sambandho megheneva vihayasah | atah kuto me taddharma
    jagratsvapnasushuptayah || || upadhirayati sa eva gacchati sa eva karmani karoti bhunkte | sa eva
    jiryan mriyate sadaham kuladrivannishcala eva samsthitah || || na me pravrittirna ca me nivrittih
    sadaikarupasya niramshakasya | ekatmako yo nivido nirantaro vyomeva purnah sa katham nu ceshtate ||
    || punyani papani nirindriyasya nishcetaso nirvikriternirakriteh | kuto mamakhandasukhanubhuteh brute
    hyananvagatamityapi shrutih || || chayaya sprishtamushnam va shitam va sushthu duhshthu va | na sprishatyeva
    yatkincitpurusham tadvilakshanam || || na sakshinam sakshyadharmah samsprishanti vilakshanam | avikaramudasinam
    grihadharmah pradipavat | dehendriyamanodharma naivatmanam sprishantyaho || || ekshtra raveryatha
    karmani sakshibhavo vahneryatha dahaniyamakatvam | rajjoryatha''ropitavastusangah tathaiva kutasthacidatmano
    me || || kartapi va karayitapi naham bhoktapi va bhojayitapi naham | drashtapi va darshayitapi naham
    so'ham svayanjyotiranidrigatma || || calatyupadhau pratibimbalaulya maupadhikam mudhadhiyo nayanti
    | svabimbabhutam ravivadvinishkriyam kartasmi bhoktasmi hato'smi heti || || jale vapi sthale vapi
    luthatvesha jadatmakah | naham vilipye taddharmairghatadharmairnabho yatha || || kartritvabhoktritvakhalatvamattata
    jadatvabaddhatvavimuktatadayah | buddhervikalpa na tu santi vastutah svasminpare brahmani kevale'dvaye
    || || santu vikarah prakriterdashadha shatadha sahasradha vapi | kim me'sangacitastairna ghanah kvacidambaram
    sprishati || taih kim me'sangaciterna hyambudadambaro'mbaram avyaktadisthulaparyantametat vishvam
    yatrabhasamatram pratitam | vyomaprakhyam sukshmamadyantahinam brahmadvaitam yattadevahamasmi || ||
    sarvadharam sarvavastuprakasham sarvakaram sarvagam sarvashunyam | nityam shuddham nishcalam nirvikalpam
    brahmadvaitam yattadevahamasmi || || yatpratyastasheshamayavishesham pratyagrupam pratyayagamyamanam
    | satyajnananantamanandarupam brahmadvaitam yattadevahamasmi || || nishkriyo'smyavikaro'smi nishkalo'smi
    nirakritih | nirvikalpo'smi nityo'smi niralambo'smi nirdvayah || || sarvatmako'ham sarvo'ham sarvatito'hamadvayah
    | kevalakhandabodho'hamanando'ham nirantarah || || svarajyasamrajyavibhutiresha bhavatkripashrimahimaprasadat
    | prapta maya shrigurave mahatmane namo namaste'stu punarnamo'stu || || mahasvapne mayakritajanijaramrityugahane
    bhramantam klishyantam bahulataratapairanudinam | ahankaravyaghravyathitamimamatyantakripaya prabodhya
    prasvapatparamavitavanmamasi guro || || namastasmai sadaikasmai kasmaicinmahase namah | sadekasmai
    namashcinmahase muhuh yadetadvishvarupena rajate gururaja te || || iti natamavalokya shishyavaryam
    samadhigatatmasukham prabuddhatattvam | pramuditahridayam sa deshikendrah punaridamaha vacah param
    mahatma || || brahmapratyayasantatirjagadato brahmaiva tatsarvatah pashyadhyatmadrisha prashantamanasa
    sarvasvavasthasvapi | rupadanyadavekshitam kimabhitashcakshushmatam drishyate tadvadbrahmavidah satah
    kimaparam buddherviharaspadam || || kastam paranandarasanubhuti mritsrijya shunyeshu rameta vidvan
    | mutsrijya candre mahahladini dipyamane citrendumalokayitum ka icchet || || asatpadarthanubhavena
    kincin na hyasti triptirna ca duhkhahanih | tadadvayanandarasanubhutya triptah sukham tishtha sadatmanishthaya
    || || svameva sarvatha pashyanmanyamanah svamadvayam | svanandamanubhunjanah kalam naya mahamate ||
    || akhandabodhatmani nirvikalpe vikalpanam vyomni puraprakalpanam | tadadvayanandamayatmana sada shantim
    parametya bhajasva maunam || || tushnimavastha paramopashantih buddherasatkalpavikalpahetoh | brahmatmano
    brahmavido mahatmano yatradvayanandasukham nirantaram || || nasti nirvasananmaunatparam sukhakriduttamam
    | vijnatatmasvarupasya svanandarasapayinah || || gacchamstishthannupavishanchayano va'nyathapi va
    | yathecchaya vasedvidvanatmaramah sada munih || || na deshakalasanadigyamadi lakshyadyapeksha'pratibaddhavritteh
    | pratibaddha samsiddhatattvasya mahatmano'sti svavedane ka niyamadyavastha || || ghato'yamiti vijnatum
    niyamah ko'nvavekshate | vina pramanasushthutvam yasminsati padarthadhih || || ayamatma nityasiddhah
    pramane sati bhasate | na desham napi va kalam na shuddhim vapyapekshate || || devadatto'hamityetadvijnanam
    nirapekshakam | tadvadbrahmavido'pyasya brahmahamiti vedanam || || bhanuneva jagatsarvam bhasate yasya
    tejasa | anatmakamasattuccham kim nu tasyavabhasakam || || vedashastrapuranani bhutani sakalanyapi
    | yenarthavanti tam kinnu vijnataram prakashayet || || esha svayanjyotiranantashaktih atma'prameyah
    sakalanubhutih | yameva vijnaya vimuktabandho jayatyayam brahmaviduttamottamah || || na khidyate no
    vishayaih pramodate na sajjate napi virajyate ca | svasminsada kridati nandati svayam nirantaranandarasena
    triptah || || kshudham dehavyatham tyaktva balah kridati vastunih | tathaiva vidvan ramate nirmamo
    niraham sukhi || || cintashunyamadainyabhaikshamashanam panam saridvarishu svatantryena nirankusha
    sthitirabhirnidra shmashane vane | vastram kshalanashoshanadirahitam digvastu shayya mahi sancaro
    nigamantavithishu vidam krida pare brahmani || || vimanamalambya sharirametad bhunaktyasheshanvishayanupasthitan
    | parecchaya balavadatmavetta yo'vyaktalingo'nanushaktabahyah || || digambaro vapi ca sambaro va tvagambaro
    vapi cidambarasthah | unmattavadvapi ca balavadva pishacavadvapi caratyavanyam || || kamannishkamarupi
    samshcaratyekacaro munih | svatmanaiva sada tushtah svayam sarvatmana sthitah || || kvacinmudho vidvan
    kvacidapi maharajavibhavah kvacidbhrantah saumyah kvacidajagaracarakalitah | kvacitpatribhutah kvacidavamatah
    kvapyaviditah caratyevam prajnah satataparamanandasukhitah || || nirdhano'pi sada tushto'pyasahayo
    mahabalah | nityatripto'pyabhunjano'pyasamah samadarshanah || || api kurvannakurvanashcabhokta phalabhogyapi
    | shariryapyashariryesha paricchinno'pi sarvagah || || ashariram sada santamimam brahmavidam kvacit
    | priyapriye na sprishatastathaiva ca shubhashubhe || || sthuladisambandhavato'bhimaninah sukham ca
    duhkham ca shubhashubhe ca | vidhvastabandhasya sadatmano muneh kutah shubham va'pyashubham phalam
    va || || tamasa grastavadbhanadagrasto'pi ravirjanaih | grasta ityucyate bhrantyam hyajnatva vastulakshanam
    || tadvaddehadibandhebhyo vimuktam brahmavittamam | pashyanti dehivanmudhah sharirabhasadarshanat
    || || ahirnirlvayanim vayam muktva deham tu tishthati | itastatashcalyamano yatkincitpranavayuna ||
    || strotasa niyate daru yatha nimnonnatasthalam | daivena niyate deho yathakalopabhuktishu || || prarabdhakarmaparikalpitavasanabhih
    samsarivaccarati bhuktishu muktadehah | siddhah svayam vasati sakshivadatra tushnim cakrasya mulamiva
    kalpavikalpashunyah || || naivendriyani vishayeshu niyunkta esha naivapayunkta upadarshanalakshanasthah
    | naiva kriyaphalamapishadavekshate sa svanandasandrarasapanasumattacittah || || lakshyalakshyagatim
    tyaktva yastishthetkevalatmana | shiva eva svayam sakshadayam brahmaviduttamah || || jivanneva sada
    muktah kritartho brahmavittamah | upadhinashadbrahmaiva san brahmapyeti nirdvayam || || shailusho
    veshasadbhavabhavayoshca yatha puman | tathaiva brahmavicchreshthah sada brahmaiva naparah || || yatra
    kvapi vishirnam satparnamiva tarorvapuh patatat | brahmibhutasya yateh prageva taccidagnina dagdham
    || || sadatmani brahmani tishthato muneh purna'dvayanandamayatmana sada | na deshakaladyucitapratiksha
    tvanmamsavitpindavisarjanaya || || dehasya moksho no moksho na dandasya kamandaloh | avidyahridayagranthimoksho
    moksho yatastatah || || kulyayamatha nadyam va shivakshetre'pi catvare | parnam patati cettena taroh
    kim nu shubhashubham || || patrasya pushpasya phalasya nashavad dehendriyapranadhiyam vinashah | naivatmanah
    svasya sadatmakasya nandakritervrikshavadasti caishah || prajnanaghana ityatmalakshanam satyasucakam
    | anudyaupadhikasyaiva kathayanti vinashanam || || avinashi va are'yamatmeti shrutiratmanah | prabravityavinashitvam
    vinashyatsu vikarishu || || pashanavrikshatrinadhanyakadankaradya dagdha bhavanti hi mrideva yatha
    tathaiva | dehendriyasumana adi samastadrishyam jnanagnidagdhamupayati paratmabhavam || || vilakshanam
    yatha dhvantam liyate bhanutejasi | tathaiva sakalam drishyam brahmani praviliyate || || ghate nashte
    yatha vyoma vyomaiva bhavati sphutam | tathaivopadhivilaye brahmaiva brahmavitsvayam || || kshiram
    kshire yatha kshiptam tailam taile jalam jale | samyuktamekatam yati tatha''tmanyatmavinmunih || ||
    evam videhakaivalyam sanmatratvamakhanditam | brahmabhavam prapadyaisha yatirnavartate punah || ||
    sadatmaikatvavijnanadagdhavidyadivarshmanah | amushya brahmabhutatvad brahmanah kuta udbhavah || ||
    mayaklriptau bandhamokshau na stah svatmani vastutah | yatha rajjau nishkriyayam sarpabhasavinirgamau
    || || avriteh sadasattvabhyam vaktavye bandhamokshane | navritirbrahmanah kacidanyabhavadanavritam
    | yadyastyadvaitahanih syad dvaitam no sahate shrutih || || bandhanca mokshanca mrishaiva mudha buddhergunam
    vastuni kalpayanti | drigavritim meghakritam yatha ravau yato'dvaya'sangacidetadaksharam || astiti
    pratyayo yashca yashca nastiti vastuni | buddhereva gunavetau na tu nityasya vastunah || || atastau
    mayaya klriptau bandhamokshau na catmani | nishkale nishkriye shante niravadye niranjane | advitiye
    pare tattve vyomavatkalpana kutah || || na nirodho na cotpattirna baddho na ca sadhakah | na mumukshurna
    vai mukta ityesha paramarthata || || sakalanigamacudasvantasiddhantarupam paramidamatiguhyam darshitam
    te mayadya | apagatakalidosham kamanirmuktabuddhim svasutavadasakrittvam bhavayitva mumukshum || ||
    iti shrutva gurorvakyam prashrayena kritanatih | sa tena samanujnato yayau nirmuktabandhanah || ||
    gurureva sadanandasindhau nirmagnamanasah | pavayanvasudham sarvam vicacara nirantarah || || ityacaryasya
    shishyasya samvadenatmalakshanam | nirupitam mumukshunam sukhabodhopapattaye || || hitamidamupadeshamadriyantam
    vihitanirastasamastacittadoshah | bhavasukhaviratah prashantacittah shrutirasika yatayo mumukshavo
    ye || || samsaradhvani tapabhanukiranaprodbhutadahavyatha khinnanam jalakankshaya marubhuvi bhrantya
    paribhramyatam | atyasannasudhambudhim sukhakaram brahmadvayam darshaya tyesha shankarabharati vijayate
    nirvanasandayini || || || iti shankaracaryaviracitam vivekacudamanih || || om tatsat ||
  devanagari: सर्ववेदान्तसिद्धान्तगोचरं तमगोचरम् । गोविन्दं परमानन्दं सद्गुरुं प्रणतोऽस्म्यहम् ॥ ॥ जन्तूनां
    नरजन्म दुर्लभमतः पुंस्त्वं ततो विप्रता तस्माद्वैदिकधर्ममार्गपरता विद्वत्त्वमस्मात्परम् । आत्मानात्मविवेचनं
    स्वनुभवो ब्रह्मात्मना संस्थितिः मुक्तिर्नो शतजन्मकोटिसुकृतैः पुण्यैर्विना लभ्यते ॥ दुर्लभं त्रयमेवैतद्देवानुग्रहहेतुकम्
    । मनुष्यत्वं मुमुक्षुत्वं महापुरुषसंश्रयः ॥ ॥ लब्ध्वा कथञ्चिन्नरजन्म दुर्लभं तत्रापि पुंस्त्वं श्रुतिपारदर्शनम्
    । यस्त्वात्ममुक्तौ न यतेत मूढधीः स ह्यात्महा स्वं विनिहन्त्यसद्ग्रहात् ॥ इतः को न्वस्ति मूढात्मा यस्तु
    स्वार्थे प्रमाद्यति । दुर्लभं मानुषं देहं प्राप्य तत्रापि पौरुषम् ॥ ॥ वदन्तु शास्त्राणि यजन्तु देवान्
    कुर्वन्तु कर्माणि भजन्तु देवताः । आत्मैक्यबोधेन विनापि मुक्ति र्न सिध्यति ब्रह्मशतान्तरेऽपि ॥ ॥ अमृतत्त्वस्य
    नाशास्ति वित्तेनेत्येव हि श्रुतिः । ब्रवीति कर्मणो मुक्तेरहेतुत्वं स्फुटं यतः ॥ ॥ अतो विमुक्त्यै प्रयतेत
    विद्वान् सन्न्यस्तबाह्यार्थसुखस्पृहः सन् । सन्तं महान्तं समुपेत्य देशिकं तेनोपदिष्टार्थसमाहितात्मा
    ॥ ॥ उद्धरेदात्मनाऽऽत्मानं मग्नं संसारवारिधौ । योगारूढत्वमासाद्य सम्यग्दर्शननिष्ठया ॥ ॥ सन्न्यस्य सर्वकर्माणि
    भवबन्धविमुक्तये । यत्यतां पण्डितैर्धीरैरात्माभ्यास उपस्थितैः ॥ ॥ चित्तस्य शुद्धये कर्म न तु वस्तूपलब्धये
    । वस्तुसिद्धिर्विचारेण न किञ्चित्कर्मकोटिभिः ॥ ॥ सम्यग्विचारतः सिद्धा रज्जुतत्त्वावधारणा । भ्रान्तोदितमहासर्पभयदुःखविनाशिनी
    ॥ अर्थस्य निश्चयो दृष्टो विचारेण हितोक्तितः । न स्नानेन न दानेन प्राणायामशतेन वा ॥ ॥ अधिकारिणमाशास्ते
    फलसिद्धिर्विशेषतः । उपाया देशकालाद्याः सन्त्यस्मिन्सहकारिणः ॥ अतो विचारः कर्तव्यो जिज्ञासोरात्मवस्तुनः
    ॥ समासाद्य दयासिन्धुं गुरुं ब्रह्मविदुत्तमम् ॥ ॥ मेधावी पुरुषो विद्वानूहापोहविचक्षणः । अधिकार्यात्मविद्यायामुक्तलक्षणलक्षितः
    ॥ ॥ विवेकिनो विरक्तस्य शमादिगुणशालिनः । मुमुक्षोरेव हि ब्रह्मजिज्ञासायोग्यता मता ॥ ॥ साधनान्यत्र चत्वारि
    कथितानि मनीषिभिः । येषु सत्स्वेव सन्निष्ठा यदभावे न सिध्यति ॥ ॥ आदौ नित्यानित्यवस्तुविवेकः परिगण्यते
    । इहामुत्रफलभोगविरागस्तदनन्तरम् । शमादिषट्कसम्पत्तिर्मुमुक्षुत्वमिति स्फुटम् ॥ ॥ ब्रह्म सत्यं जगन्मिथ्येत्येवंरूपो
    विनिश्चयः । सोऽयं नित्यानित्यवस्तुविवेकः समुदाहृतः ॥ ॥ तद्वैराग्यं जिहासा या दर्शनश्रवणादिभिः । देहादिब्रह्मपर्यन्ते
    ह्यनित्ये भोगवस्तुनि ॥ विरज्य विषयव्राताद्दोषदृष्ट्या मुहुर्मुहुः । स्वलक्ष्ये नियतावस्था मनसः शम
    उच्यते ॥ ॥ विषयेभ्यः परावर्त्य स्थापनं स्वस्वगोलके । उभयेषामिन्द्रियाणां स दमः परिकीर्तितः । बाह्यानालम्बनं
    वृत्तेरेषोपरतिरुत्तमा ॥ ॥ सहनं सर्वदुःखानामप्रतीकारपूर्वकम् । चिन्ताविलापरहितं सा तितिक्षा निगद्यते
    ॥ ॥ शास्त्रस्य गुरुवाक्यस्य सत्यबुद्ध्यवधारणम् । सा श्रद्धा कथिता सद्भिर्यया वस्तूपलभ्यते ॥ ॥ सर्वदा
    स्थापनं बुद्धेः शुद्धे ब्रह्मणि सर्वदा । तत्समाधानमित्युक्तं न तु चित्तस्य लालनम् ॥ ॥ अहङ्कारादिदेहान्तान्
    बन्धानज्ञानकल्पितान् । स्वस्वरूपावबोधेन मोक्तुमिच्छा मुमुक्षुता ॥ ॥ मन्दमध्यमरूपापि वैराग्येण शमादिना
    । प्रसादेन गुरोः सेयं प्रवृद्धा सूयते फलम् ॥ ॥ वैराग्यं च मुमुक्षुत्वं तीव्रं यस्य तु विद्यते । तस्मिन्नेवार्थवन्तः
    स्युः फलवन्तः शमादयः ॥ ॥ एतयोर्मन्दता यत्र विरक्तत्वमुमुक्षयोः । मरौ सलिलवत्तत्र शमादेर्भानमात्रता
    ॥ ॥ मोक्षकारणसामग्र्यां भक्तिरेव गरीयसी । स्वस्वरूपानुसन्धानं भक्तिरित्यभिधीयते ॥ ॥ स्वात्मतत्त्वानुसन्धानं
    भक्तिरित्यपरे जगुः । उक्तसाधनसम्पन्नस्तत्त्वजिज्ञासुरात्मनः । उपसीदेद्गुरुं प्राज्ञं यस्माद्बन्धविमोक्षणम्
    ॥ ॥ श्रोत्रियोऽवृजिनोऽकामहतो यो ब्रह्मवित्तमः । ब्रह्मण्युपरतः शान्तो निरिन्धन इवानलः । अहेतुकदयासिन्धुर्बन्धुरानमतां
    सताम् ॥ ॥ तमाराध्य गुरुं भक्त्या प्रह्वप्रश्रयसेवनैः । प्रसन्नं तमनुप्राप्य पृच्छेज्ज्ञातव्यमात्मनः
    ॥ ॥ स्वामिन्नमस्ते नतलोकबन्धो कारुण्यसिन्धो पतितं भवाब्धौ । मामुद्धरात्मीयकटाक्षदृष्ट्या ऋज्व्यातिकारुण्यसुधाभिवृष्ट्या
    ॥ ॥ दुर्वारसंसारदवाग्नितप्तं दोधूयमानं दुरदृष्टवातैः । भीतं प्रपन्नं परिपाहि मृत्योः शरण्यमन्यद्यदहं
    न जाने ॥ शान्ता महान्तो निवसन्ति सन्तो वसन्तवल्लोकहितं चरन्तः । तीर्णाः स्वयं भीमभवार्णवं जना नहेतुनान्यानपि
    तारयन्तः ॥ ॥ अयं स्वभावः स्वत एव यत्पर श्रमापनोदप्रवणं महात्मनाम् । सुधांशुरेष स्वयमर्ककर्कश प्रभाभितप्तामवति
    क्षितिं किल ॥ ॥ ब्रह्मानन्दरसानुभूतिकलितैः पूतैः सुशीतैर्युतै र्युष्मद्वाक्कलशोज्झितैः श्रुतिसुखैर्वाक्यामृतैः
    सेचय । सन्तप्तं भवतापदावदहनज्वालाभिरेनं प्रभो धन्यास्ते भवदीक्षणक्षणगतेः पात्रीकृताः स्वीकृताः ॥ ॥
    कथं तरेयं भवसिन्धुमेतं का वा गतिर्मे कतमोऽस्त्युपायः । जाने न किञ्चित्कृपयाऽव मां प्रभो संसारदुःखक्षतिमातनुष्व
    ॥ ॥ तथा वदन्तं शरणागतं स्वं संसारदावानलतापतप्तम् । निरीक्ष्य कारुण्यरसार्द्रदृष्ट्या दद्यादभीतिं सहसा
    महात्मा ॥ ॥ विद्वान् स तस्मा उपसत्तिमीयुषे मुमुक्षवे साधु यथोक्तकारिणे । प्रशान्तचित्ताय शमान्विताय
    तत्त्वोपदेशं कृपयैव कुर्यात् ॥ ॥ मा भैष्ट विद्वंस्तव नास्त्यपायः संसारसिन्धोस्तरणेऽस्त्युपायः । येनैव
    याता यतयोऽस्य पारं तमेव मार्गं तव निर्दिशामि ॥ ॥ अस्त्युपायो महान्कश्चित्संसारभयनाशनः । तेन तीर्त्वा
    भवाम्भोधिं परमानन्दमाप्स्यसि ॥ ॥ वेदान्तार्थविचारेण जायते ज्ञानमुत्तमम् । तेनात्यन्तिकसंसारदुःखनाशो
    भवत्यनु ॥ ॥ श्रद्धाभक्तिध्यानयोगान्मुमुक्षोः मुक्तेर्हेतून्वक्ति साक्षाच्छ्रुतेर्गीः । यो वा एतेष्वेव
    तिष्ठत्यमुष्य मोक्षोऽविद्याकल्पिताद्देहबन्धात् ॥ ॥ अज्ञानयोगात्परमात्मनस्तव ह्यनात्मबन्धस्तत एव संसृतिः
    । तयोर्विवेकोदितबोधवह्निः अज्ञानकार्यं प्रदहेत्समूलम् ॥ ॥ शिष्य उवाच । कृपया श्रूयतां स्वामिन्प्रश्नोऽयं
    क्रियते मया । यदुत्तरमहं श्रुत्वा कृतार्थः स्यां भवन्मुखात् ॥ ॥ को नाम बन्धः कथमेष आगतः कथं प्रतिष्ठास्य
    कथं विमोक्षः । कोऽसावनात्मा परमः क आत्मा तयोर्विवेकः कथमेतदुच्यताम् ॥ ॥ श्रीगुरुवाच । धन्योऽसि कृतकृत्योऽसि
    पावितं ते कुलं त्वया । यदविद्याबन्धमुक्त्या ब्रह्मीभवितुमिच्छसि ॥ ॥ ऋणमोचनकर्तारः पितुः सन्ति सुतादयः
    । बन्धमोचनकर्ता तु स्वस्मादन्यो न कश्चन ॥ ॥ मस्तकन्यस्तभारादेर्दुःखमन्यैर्निवार्यते । क्षुधादिकृतदुःखं
    तु विना स्वेन न केनचित् ॥ ॥ पथ्यमौषधसेवा च क्रियते येन रोगिणा । आरोग्यसिद्धिर्दृष्टाऽस्य नान्यानुष्ठितकर्मणा
    ॥ ॥ वस्तुस्वरूपं स्फुटबोधचक्षुषा स्वेनैव वेद्यं न तु पण्डितेन । चन्द्रस्वरूपं निजचक्षुषैव ज्ञातव्यमन्यैरवगम्यते
    किम् ॥ ॥ अविद्याकामकर्मादिपाशबन्धं विमोचितुम् । कः शक्नुयाद्विनाऽऽत्मानं कल्पकोटिशतैरपि ॥ ॥ न योगेन
    न साङ्ख्येन कर्मणा नो न विद्यया । ब्रह्मात्मैकत्वबोधेन मोक्षः सिध्यति नान्यथा ॥ ॥ वीणाया रूपसौन्दर्यं
    तन्त्रीवादनसौष्ठवम् । प्रजारञ्जनमात्रं तन्न साम्राज्याय कल्पते ॥ ॥ वाग्वैखरी शब्दझरी शास्त्रव्याख्यानकौशलम्
    । वैदुष्यं विदुषां तद्वद्भुक्तये न तु मुक्तये ॥ ॥ अविज्ञाते परे तत्त्वे शास्त्राधीतिस्तु निष्फला ।
    विज्ञातेऽपि परे तत्त्वे शास्त्राधीतिस्तु निष्फला ॥ ॥ शब्दजालं महारण्यं चित्तभ्रमणकारणम् । अतः प्रयत्नाज्ज्ञातव्यं
    तत्त्वज्ञैस्तत्त्वमात्मनः ॥ ॥ तत्त्वज्ञात्तत्त्व अज्ञानसर्पदष्टस्य ब्रह्मज्ञानौषधं विना । किमु वेदैश्च
    शास्त्रैश्च किमु मन्त्रैः किमौषधैः ॥ ॥ न गच्छति विना पानं व्याधिरौषधशब्दतः । विनाऽपरोक्षानुभवं ब्रह्मशब्दैर्न
    मुच्यते ॥ ॥ अकृत्वा दृश्यविलयमज्ञात्वा तत्त्वमात्मनः । ब्रह्मशब्दैः कुतो मुक्तिरुक्तिमात्रफलैर्नृणाम्
    ॥ अकृत्वा शत्रुसंहारमगत्वाखिलभूश्रियम् । राजाहमिति शब्दान्नो राजा भवितुमर्हति ॥ ॥ आप्तोक्तिं खननं
    तथोपरिशिलाद्युत्कर्षणं स्वीकृतिं निक्षेपः समपेक्षते न हि बहिःशब्दैस्तु निर्गच्छति । तद्वद्ब्रह्मविदोपदेशमननध्यानादिभिर्लभ्यते
    मायाकार्यतिरोहितं स्वममलं तत्त्वं न दुर्युक्तिभिः ॥ ॥ तस्मात्सर्वप्रयत्नेन भवबन्धविमुक्तये । स्वैरेव
    यत्नः कर्तव्यो रोगादाविव पण्डितैः ॥ यस्त्वयाद्य कृतः प्रश्नो वरीयाञ्छास्त्रविन्मतः । सूत्रप्रायो निगूढार्थो
    ज्ञातव्यश्च मुमुक्षुभिः ॥ ॥ शऋणुष्वावहितो विद्वन्यन्मया समुदीर्यते । तदेतच्छ्रवणात्सद्यो भवबन्धाद्विमोक्ष्यसे
    ॥ ॥ मोक्षस्य हेतुः प्रथमो निगद्यते वैराग्यमत्यन्तमनित्यवस्तुषु । ततः शमश्चापि दमस्तितिक्षा न्यासः
    प्रसक्ताखिलकर्मणां भृशम् ॥ ॥ ततः श्रुतिस्तन्मननं सतत्त्व ध्यानं चिरं नित्यनिरन्तरं मुनेः । ततोऽविकल्पं
    परमेत्य विद्वान् इहैव निर्वाणसुखं समृच्छति ॥ ॥ यद्बोद्धव्यं तवेदानीमात्मानात्मविवेचनम् । तदुच्यते
    मया सम्यक् श्रुत्वात्मन्यवधारय ॥ ॥ मज्जास्थिमेदःपलरक्तचर्म त्वगाह्वयैर्धातुभिरेभिरन्वितम् । पादोरुवक्षोभुजपृष्ठमस्तकैः
    अङ्गैरुपाङ्गैरुपयुक्तमेतत् ॥ ॥ अहम्ममेति प्रथितं शरीरं मोहास्पदं स्थूलमितीर्यते बुधैः । नभोनभस्वद्दहनाम्बुभूमयः
    सूक्ष्माणि भूतानि भवन्ति तानि ॥ ॥ परस्परांशैर्मिलितानि भूत्वा स्थूलानि च स्थूलशरीरहेतवः । मात्रास्तदीया
    विषया भवन्ति शब्दादयः पञ्च सुखाय भोक्तुः ॥ ॥ य एषु मूढा विषयेषु बद्धा रागोरुपाशेन सुदुर्दमेन । आयान्ति
    निर्यान्त्यध ऊर्ध्वमुच्चैः स्वकर्मदूतेन जवेन नीताः ॥ ॥ शब्दादिभिः पञ्चभिरेव पञ्च पञ्चत्वमापुः स्वगुणेन
    बद्धाः । कुरङ्गमातङ्गपतङ्गमीन भृङ्गा नरः पञ्चभिरञ्चितः किम् ॥ ॥ दोषेण तीव्रो विषयः कृष्णसर्पविषादपि
    । विषं निहन्ति भोक्तारं द्रष्टारं चक्षुषाप्ययम् ॥ ॥ विषयाशामहापाशाद्यो विमुक्तः सुदुस्त्यजात् । स
    एव कल्पते मुक्त्यै नान्यः षट्शास्त्रवेद्यपि ॥ ॥ आपातवैराग्यवतो मुमुक्षून् भवाब्धिपारं प्रतियातुमुद्यतान्
    । आशाग्रहो मज्जयतेऽन्तराले निगृह्य कण्ठे विनिवर्त्य वेगात् ॥ ॥ विषयाख्यग्रहो येन सुविरक्त्यसिना हतः
    । स गच्छति भवाम्भोधेः पारं प्रत्यूहवर्जितः ॥ ॥ विषमविषयमार्गैर्गच्छतोऽनच्छबुद्धेः प्रतिपदमभियातो मृत्युरप्येष
    विद्धि । प्रतिपदमभिघातो मृत्युरप्येष सिद्धः हितसुजनगुरूक्त्या गच्छतः स्वस्य युक्त्या प्रभवति फलसिद्धिः
    सत्यमित्येव विद्धि ॥ ॥ मोक्षस्य काङ्क्षा यदि वै तवास्ति त्यजातिदूराद्विषयान्विषं यथा । पीयूषवत्तोषदयाक्षमार्जव
    प्रशान्तिदान्तीर्भज नित्यमादरात् ॥ ॥ अनुक्षणं यत्परिहृत्य कृत्यं अनाद्यविद्याकृतबन्धमोक्षणम् । देहः
    परार्थोऽयममुष्य पोषणे यः सज्जते स स्वमनेन हन्ति ॥ ॥ शरीरपोषणार्थी सन् य आत्मानं दिदृक्षति । ग्राहं
    दारुधिया धृत्वा नदीं तर्तुं स गच्छति ॥ मोह एव महामृत्युर्मुमुक्षोर्वपुरादिषु । मोहो विनिर्जितो येन
    स मुक्तिपदमर्हति ॥ ॥ मोहं जहि महामृत्युं देहदारसुतादिषु । यं जित्वा मुनयो यान्ति तद्विष्णोः परमं पदम्
    ॥ ॥ त्वङ्मांसरुधिरस्नायुमेदोमज्जास्थिसङ्कुलम् । पूर्णं मूत्रपुरीषाभ्यां स्थूलं निन्द्यमिदं वपुः ॥
    ॥ पञ्चीकृतेभ्यो भूतेभ्यः स्थूलेभ्यः पूर्वकर्मणा । समुत्पन्नमिदं स्थूलं भोगायतनमात्मनः । अवस्था जागरस्तस्य
    स्थूलार्थानुभवो यतः ॥ ॥ बाह्येन्द्रियैः स्थूलपदार्थसेवां स्रक्चन्दनस्त्र्यादिविचित्ररूपाम् । करोति
    जीवः स्वयमेतदात्मना तस्मात्प्रशस्तिर्वपुषोऽस्य जागरे ॥ ॥ सर्वोऽपि बाह्यसंसारः पुरुषस्य यदाश्रयः ।
    विद्धि देहमिदं स्थूलं गृहवद्गृहमेधिनः ॥ ॥ स्थूलस्य सम्भवजरामरणानि धर्माः स्थौल्यादयो बहुविधाः शिशुताद्यवस्थाः
    । वर्णाश्रमादिनियमा बहुधाऽऽमयाः स्युः पूजावमानबहुमानमुखा विशेषाः ॥ ॥ बुद्धीन्द्रियाणि श्रवणं त्वगक्षि
    घ्राणं च जिह्वा विषयावबोधनात् । वाक्पाणिपादा गुदमप्युपस्थः कर्मेन्द्रियाणि प्रवणेन कर्मसु ॥ निगद्यतेऽन्तःकरणं
    मनोधीः अहङ्कृतिश्चित्तमिति स्ववृत्तिभिः । मनस्तु सङ्कल्पविकल्पनादिभिः बुद्धिः पदार्थाध्यवसायधर्मतः
    ॥ ॥ अत्राभिमानादहमित्यहङ्कृतिः । स्वार्थानुसन्धानगुणेन चित्तम् ॥ ॥ प्राणापानव्यानोदानसमाना भवत्यसौ
    प्राणः । स्वयमेव वृत्तिभेदाद्विकृतिभेदात्सुवर्णसलिलादिवत् ॥ विकृतेर्भेदात्सुवर्णसलिलमिव वागादि पञ्च
    श्रवणादि पञ्च प्राणादि पञ्चाभ्रमुखानि पञ्च । बुद्ध्याद्यविद्यापि च कामकर्मणी पुर्यष्टकं सूक्ष्मशरीरमाहुः
    ॥ ऋणु सूक्ष्मसञ्ज्ञितं लिङ्गं त्वपञ्चीकृतभूतसम्भवम् । सवासनं कर्मफलानुभावकं स्वाज्ञानतोऽनादिरुपाधिरात्मनः
    ॥ ॥ स्वप्नो भवत्यस्य विभक्त्यवस्था स्वमात्रशेषेण विभाति यत्र । स्वप्ने तु बुद्धिः स्वयमेव जाग्रत्
    कालीननानाविधवासनाभिः ॥ ॥ कर्त्रादिभावं प्रतिपद्य राजते यत्र स्वयं भाति ह्ययं परात्मा । धीमात्रकोपाधिरशेषसाक्षी
    न लिप्यते तत्कृतकर्मलेशैः । कर्मलेपैः यस्मादसङ्गस्तत एव कर्मभिः न लिप्यते किञ्चिदुपाधिना कृतैः ॥ ॥
    सर्वव्यापृतिकरणं लिङ्गमिदं स्याच्चिदात्मनः पुंसः । वास्यादिकमिव तक्ष्णस्तेनैवात्मा भवत्यसङ्गोऽयम्
    ॥ ॥ अन्धत्वमन्दत्वपटुत्वधर्माः सौगुण्यवैगुण्यवशाद्धि चक्षुषः । बाधिर्यमूकत्वमुखास्तथैव श्रोत्रादिधर्मा
    न तु वेत्तुरात्मनः ॥ ॥ उच्छ्वासनिःश्वासविजृम्भणक्षु त्प्रस्यन्दनाद्युत्क्रमणादिकाः क्रियाः । प्राणादिकर्माणि
    वदन्ति तज्ञाः प्राणस्य धर्मावशनापिपासे ॥ ॥ अन्तःकरणमेतेषु चक्षुरादिषु वर्ष्मणि । अहमित्यभिमानेन तिष्ठत्याभासतेजसा
    ॥ ॥ अहङ्कारः स विज्ञेयः कर्ता भोक्ताभिमान्ययम् । सत्त्वादिगुणयोगेन चावस्थात्रयमश्नुते ॥ योगेनावस्थात्रितयम्श्नुते
    विषयाणामानुकूल्ये सुखी दुःखी विपर्यये । सुखं दुःखं च तद्धर्मः सदानन्दस्य नात्मनः ॥ ॥ आत्मार्थत्वेन
    हि प्रेयान्विषयो न स्वतः प्रियः । स्वत एव हि सर्वेषामात्मा प्रियतमो यतः । तत आत्मा सदानन्दो नास्य
    दुःखं कदाचन ॥ ॥ यत्सुषुप्तौ निर्विषय आत्मानन्दोऽनुभूयते । श्रुतिः प्रत्यक्षमैतिह्यमनुमानं च जाग्रति
    ॥ ॥ अव्यक्तनाम्नी परमेशशक्तिः अनाद्यविद्या त्रिगुणात्मिका परा । कार्यानुमेया सुधियैव माया यया जगत्सर्वमिदं
    प्रसूयते ॥ ॥ सन्नाप्यसन्नाप्युभयात्मिका नो भिन्नाप्यभिन्नाप्युभयात्मिका नो । साङ्गाप्यनङ्गा ह्युभयात्मिका
    नो महाद्भुताऽनिर्वचनीयरूपा ॥ ॥ शुद्धाद्वयब्रह्मविबोधनाश्या सर्पभ्रमो रज्जुविवेकतो यथा । रजस्तमःसत्त्वमिति
    प्रसिद्धा गुणास्तदीयाः प्रथितैः स्वकार्यैः ॥ ॥ विक्षेपशक्ती रजसः क्रियात्मिका यतः प्रवृत्तिः प्रसृता
    पुराणी । रागादयोऽस्याः प्रभवन्ति नित्यं दुःखादयो ये मनसो विकाराः ॥ ॥ कामः क्रोधो लोभदम्भाद्यसूया अहङ्कारेर्ष्यामत्सराद्यास्तु
    घोराः । धर्मा एते राजसाः पुम्प्रवृत्ति र्यस्मादेषा तद्रजो बन्धहेतुः ॥ एषाऽऽवृतिर्नाम तमोगुणस्य शक्तिर्मया
    वस्त्ववभासतेऽन्यथा । शक्तिर्यया सैषा निदानं पुरुषस्य संसृतेः विक्षेपशक्तेः प्रवणस्य हेतुः ॥ प्रज्ञावानपि
    पण्डितोऽपि चतुरोऽप्यत्यन्तसूक्ष्मात्मदृग् व्यालीढस्तमसा न वेत्ति बहुधा सम्बोधितोऽपि स्फुटम् । भ्रान्त्यारोपितमेव
    साधु कलयत्यालम्बते तद्गुणान् हन्तासौ प्रबला दुरन्ततमसः शक्तिर्महत्यावृतिः ॥ ॥ अभावना वा विपरीतभावनाऽ
    सम्भावना विप्रतिपत्तिरस्याः । संसर्गयुक्तं न विमुञ्चति ध्रुवं विक्षेपशक्तिः क्षपयत्यजस्रम् ॥ ॥ अज्ञानमालस्यजडत्वनिद्रा
    प्रमादमूढत्वमुखास्तमोगुणाः । एतैः प्रयुक्तो न हि वेत्ति किञ्चित् निद्रालुवत्स्तम्भवदेव तिष्ठति ॥ ॥
    सत्त्वं विशुद्धं जलवत्तथापि ताभ्यां मिलित्वा सरणाय कल्पते । यत्रात्मबिम्बः प्रतिबिम्बितः सन् प्रकाशयत्यर्क
    इवाखिलं जडम् ॥ ॥ मिश्रस्य सत्त्वस्य भवन्ति धर्माः त्वमानिताद्या नियमा यमाद्याः । श्रद्धा च भक्तिश्च
    मुमुक्षुता च दैवी च सम्पत्तिरसन्निवृत्तिः ॥ ॥ विशुद्धसत्त्वस्य गुणाः प्रसादः स्वात्मानुभूतिः परमा
    प्रशान्तिः । तृप्तिः प्रहर्षः परमात्मनिष्ठा यया सदानन्दरसं समृच्छति ॥ ॥ अव्यक्तमेतत्त्रिगुणैर्निरुक्तं
    तत्कारणं नाम शरीरमात्मनः । सुषुप्तिरेतस्य विभक्त्यवस्था प्रलीनसर्वेन्द्रियबुद्धिवृत्तिः ॥ ॥ सर्वप्रकारप्रमितिप्रशान्तिः
    बीजात्मनावस्थितिरेव बुद्धेः । सुषुप्तिरेतस्य किल प्रतीतिः किञ्चिन्न वेद्मीति जगत्प्रसिद्धेः ॥ ॥ देहेन्द्रियप्राणमनोऽहमादयः
    सर्वे विकारा विषयाः सुखादयः । व्योमादिभूतान्यखिलं च विश्वं अव्यक्तपर्यन्तमिदं ह्यनात्मा ॥ ॥ माया मायाकार्यं
    सर्वं महदादिदेहपर्यन्तम् । असदिदमनात्मतत्त्वं विद्धि त्वं मरुमरीचिकाकल्पम् ॥ ॥ अथ ते सम्प्रवक्ष्यामि
    स्वरूपं परमात्मनः । यद्विज्ञाय नरो बन्धान्मुक्तः कैवल्यमश्नुते ॥ ॥ अस्ति कश्चित्स्वयं नित्यमहम्प्रत्ययलम्बनः
    । अवस्थात्रयसाक्षी सन्पञ्चकोशविलक्षणः ॥ ॥ यो विजानाति सकलं जाग्रत्स्वप्नसुषुप्तिषु । बुद्धितद्वृत्तिसद्भावमभावमहमित्ययम्
    ॥ ॥ यः पश्यति स्वयं सर्वं यं न पश्यति कश्चन । यश्चेतयति बुद्ध्यादि न तद्यं चेतयत्ययम् ॥ ॥ येन विश्वमिदं
    व्याप्तं यं न व्याप्नोति किञ्चन । आभारूपमिदं सर्वं यं भान्तमनुभात्ययम् ॥ ॥ यस्य सन्निधिमात्रेण देहेन्द्रियमनोधियः
    । विषयेषु स्वकीयेषु वर्तन्ते प्रेरिता इव ॥ ॥ अहङ्कारादिदेहान्ता विषयाश्च सुखादयः । वेद्यन्ते घटवद्येन
    नित्यबोधस्वरूपिणा ॥ ॥ एषोऽन्तरात्मा पुरुषः पुराणो निरन्तराखण्डसुखानुभूतिः । सदैकरूपः प्रतिबोधमात्रो
    येनेषिता वागसवश्चरन्ति ॥ ॥ अत्रैव सत्त्वात्मनि धीगुहायां अव्याकृताकाश उशत्प्रकाशः । आकाश उच्चै रविवत्प्रकाशते
    स्वतेजसा विश्वमिदं प्रकाशयन् ॥ ॥ ज्ञाता मनोऽहङ्कृतिविक्रियाणां देहेन्द्रियप्राणकृतक्रियाणाम् । अयोऽग्निवत्ताननुवर्तमानो
    न चेष्टते नो विकरोति किञ्चन ॥ ॥ न जायते नो म्रियते न वर्धते न क्षीयते नो विकरोति नित्यः । विलीयमानेऽपि
    वपुष्यमुष्मि न्न लीयते कुम्भ इवाम्बरं स्वयम् ॥ ॥ प्रकृतिविकृतिभिन्नः शुद्धबोधस्वभावः सदसदिदमशेषं भासयन्निर्विशेषः
    । विलसति परमात्मा जाग्रदादिष्ववस्था स्वहमहमिति साक्षात्साक्षिरूपेण बुद्धेः ॥ ॥ नियमितमनसामुं त्वं
    स्वमात्मानमात्म न्ययमहमिति साक्षाद्विद्धि बुद्धिप्रसादात् । जनिमरणतरङ्गापारसंसारसिन्धुं प्रतर भव कृतार्थो
    ब्रह्मरूपेण संस्थः ॥ ॥ अत्रानात्मन्यहमिति मतिर्बन्ध एषोऽस्य पुंसः प्राप्तोऽज्ञानाज्जननमरणक्लेशसम्पातहेतुः
    । येनैवायं वपुरिदमसत्सत्यमित्यात्मबुद्ध्या पुष्यत्युक्षत्यवति विषयैस्तन्तुभिः कोशकृद्वत् ॥ ॥ अतस्मिंस्तद्बुद्धिः
    प्रभवति विमूढस्य तमसा विवेकाभावाद्वै स्फुरति भुजगे रज्जुधिषणा । ततोऽनर्थव्रातो निपतति समादातुरधिकः
    ततो योऽसद्ग्राहः स हि भवति बन्धः शऋणु सखे ॥ ॥ अखण्डनित्याद्वयबोधशक्त्या स्फुरन्तमात्मानमनन्तवैभवम्
    । समावृणोत्यावृतिशक्तिरेषा तमोमयी राहुरिवार्कबिम्बम् ॥ ॥ तिरोभूते स्वात्मन्यमलतरतेजोवति पुमान् अनात्मानं
    मोहादहमिति शरीरं कलयति । ततः कामक्रोधप्रभृतिभिरमुं बन्धनगुणैः परं विक्षेपाख्या रजस उरुशक्तिर्व्यथयति
    ॥ ॥ महामोहग्राहग्रसनगलितात्मावगमनो धियो नानावस्थां स्वयमभिनयंस्तद्गुणतया । अपारे संसारे विषयविषपूरे
    जलनिधौ निमज्योन्मज्यायं भ्रमति कुमतिः कुत्सितगतिः ॥ ॥ भानुप्रभासञ्जनिताभ्रपङ्क्तिः भानुं तिरोधाय विजृम्भते
    यथा । आत्मोदिताहङ्कृतिरात्मतत्त्वं तथा तिरोधाय विजृम्भते स्वयम् ॥ ॥ कवलितदिननाथे दुर्दिने सान्द्रमेघैः
    व्यथयति हिमझञ्झावायुरुग्रो यथैतान् । अविरततमसाऽऽत्मन्यावृते मूढबुद्धिं क्षपयति बहुदुःखैस्तीव्रविक्षेपशक्तिः
    ॥ ॥ एताभ्यामेव शक्तिभ्यां बन्धः पुंसः समागतः । याभ्यां विमोहितो देहं मत्वाऽऽत्मानं भ्रमत्ययम् ॥ ॥
    बीजं संसृतिभूमिजस्य तु तमो देहात्मधीरङ्कुरो रागः पल्लवमम्बु कर्म तु वपुः स्कन्धोऽसवः शाखिकाः । अग्राणीन्द्रियसंहतिश्च
    विषयाः पुष्पाणि दुःखं फलं नानाकर्मसमुद्भवं बहुविधं भोक्तात्र जीवः खगः ॥ ॥ अज्ञानमूलोऽयमनात्मबन्धो
    नैसर्गिकोऽनादिरनन्त ईरितः । जन्माप्ययव्याधिजरादिदुःख प्रवाहपातं जनयत्यमुष्य ॥ ॥ नास्त्रैर्न शस्त्रैरनिलेन
    वह्निना छेत्तुं न शक्यो न च कर्मकोटिभिः । विवेकविज्ञानमहासिना विना धातुः प्रसादेन शितेन मञ्जुना ॥
    ॥ श्रुतिप्रमाणैकमतेः स्वधर्म निष्ठा तयैवात्मविशुद्धिरस्य । विशुद्धबुद्धेः परमात्मवेदनं तेनैव संसारसमूलनाशः
    ॥ ॥ कोशैरन्नमयाद्यैः पञ्चभिरात्मा न संवृतो भाति । निजशक्तिसमुत्पन्नैः शैवालपटलैरिवाम्बु वापीस्थम्
    ॥ ॥ तच्छैवालापनये सम्यक् सलिलं प्रतीयते शुद्धम् । तृष्णासन्तापहरं सद्यः सौख्यप्रदं परं पुंसः ॥ ॥ पञ्चानामपि
    कोशानामपवादे विभात्ययं शुद्धः । नित्यानन्दैकरसः प्रत्यग्रूपः परः स्वयञ्ज्योतिः ॥ ॥ आत्मानात्मविवेकः
    कर्तव्यो बन्धमुक्तये विदुषा । तेनैवानन्दी भवति स्वं विज्ञाय सच्चिदानन्दम् ॥ ॥ मुञ्जादिषीकामिव दृश्यवर्गात्
    प्रत्यञ्चमात्मानमसङ्गमक्रियम् । विविच्य तत्र प्रविलाप्य सर्वं तदात्मना तिष्ठति यः स मुक्तः ॥ ॥ देहोऽयमन्नभवनोऽन्नमयस्तु
    कोश श्चान्नेन जीवति विनश्यति तद्विहीनः । त्वक्चर्ममांसरुधिरास्थिपुरीषराशि र्नायं स्वयं भवितुमर्हति
    नित्यशुद्धः ॥ ॥ पूर्वं जनेरधिमृतेरपि नायमस्ति जातक्षणः क्षणगुणोऽनियतस्वभावः । नैको जडश्च घटवत्परिदृश्यमानः
    स्वात्मा कथं भवति भावविकारवेत्ता ॥ ॥ पाणिपादादिमान्देहो नात्मा व्यङ्गेऽपि जीवनात् । तत्तच्छक्तेरनाशाच्च
    न नियम्यो नियामकः ॥ ॥ देहतद्धर्मतत्कर्मतदवस्थादिसाक्षिणः । सत एव स्वतःसिद्धं तद्वैलक्षण्यमात्मनः ॥
    ॥ शल्यराशिर्मांसलिप्तो मलपूर्णोऽतिकश्मलः । कथं भवेदयं वेत्ता स्वयमेतद्विलक्षणः ॥ ॥ त्वङ्मांसमेदोऽस्थिपुरीषराशा
    वहम्मतिं मूढजनः करोति । विलक्षणं वेत्ति विचारशीलो निजस्वरूपं परमार्थभूतम् ॥ ॥ देहोऽहमित्येव जडस्य
    बुद्धिः देहे च जीवे विदुषस्त्वहन्धीः । विवेकविज्ञानवतो महात्मनो ब्रह्माहमित्येव मतिः सदात्मनि ॥ ॥
    अत्रात्मबुद्धिं त्यज मूढबुद्धे त्वङ्मांसमेदोऽस्थिपुरीषराशौ । सर्वात्मनि ब्रह्मणि निर्विकल्पे कुरुष्व
    शान्तिं परमां भजस्व ॥ ॥ देहेन्द्रियादावसति भ्रमोदितां विद्वानहन्तां न जहाति यावत् । तावन्न तस्यास्ति
    विमुक्तिवार्ता प्यस्त्वेष वेदान्तनयान्तदर्शी ॥ ॥ छायाशरीरे प्रतिबिम्बगात्रे यत्स्वप्नदेहे हृदि कल्पिताङ्गे
    । यथात्मबुद्धिस्तव नास्ति काचि ज्जीवच्छरीरे च तथैव माऽस्तु ॥ ॥ देहात्मधीरेव नृणामसद्धियां जन्मादिदुःखप्रभवस्य
    बीजम् । यतस्ततस्त्वं जहि तां प्रयत्नात् त्यक्ते तु चित्ते न पुनर्भवाशा ॥ ॥ कर्मेन्द्रियैः पञ्चभिरञ्चितोऽयं
    प्राणो भवेत्प्राणमयस्तु कोशः ॥ येनात्मवानन्नमयोऽनुपूर्णः प्रवर्ततेऽसौ सकलक्रियासु ॥ ॥ नैवात्मापि प्राणमयो
    वायुविकारो गन्ताऽऽगन्ता वायुवदन्तर्बहिरेषः । यस्मात्किञ्चित्क्वापि न वेत्तीष्टमनिष्टं स्वं वान्यं
    वा किञ्चन नित्यं परतन्त्रः ॥ ॥ ज्ञानेन्द्रियाणि च मनश्च मनोमयः स्यात् कोशो ममाहमिति वस्तुविकल्पहेतुः
    । सञ्ज्ञादिभेदकलनाकलितो बलीयां स्तत्पूर्वकोशमभिपूर्य विजृम्भते यः ॥ पञ्चेन्द्रियैः पञ्चभिरेव होतृभिः
    प्रचीयमानो विषयाज्यधारया । जाज्वल्यमानो बहुवासनेन्धनैः मनोमयाग्निर्दहति प्रपञ्चम् ॥ न ह्यस्त्यविद्या
    मनसोऽतिरिक्ता मनो ह्यविद्या भवबन्धहेतुः । तस्मिन्विनष्टे सकलं विनष्टं विजृम्भितेऽस्मिन्सकलं विजृम्भते
    ॥ ॥ स्वप्नेऽर्थशून्ये सृजति स्वशक्त्या भोक्त्रादिविश्वं मन एव सर्वम् । तथैव जाग्रत्यपि नो विशेषः तत्सर्वमेतन्मनसो
    विजृम्भणम् ॥ ॥ सुषुप्तिकाले मनसि प्रलीने नैवास्ति किञ्चित्सकलप्रसिद्धेः । अतो मनःकल्पित एव पुंसः संसार
    एतस्य न वस्तुतोऽस्ति ॥ ॥ वायुनाऽऽनीयते मेघः पुनस्तेनैव नीयते । वायुना नीयते मेघः पुनस्तेनैव लीयते
    मनसा कल्प्यते बन्धो मोक्षस्तेनैव कल्प्यते ॥ ॥ देहादिसर्वविषये परिकल्प्य रागं बध्नाति तेन पुरुषं पशुवद्गुणेन
    । वैरस्यमत्र विषवत् सुविधाय पश्चाद् एनं विमोचयति तन्मन एव बन्धात् ॥ ॥ तस्मान्मनः कारणमस्य जन्तोः बन्धस्य
    मोक्षस्य च वा विधाने । बन्धस्य हेतुर्मलिनं रजोगुणैः मोक्षस्य शुद्धं विरजस्तमस्कम् ॥ ॥ विवेकवैराग्यगुणातिरेका
    च्छुद्धत्वमासाद्य मनो विमुक्त्यै । भवत्यतो बुद्धिमतो मुमुक्षो स्ताभ्यां दृढाभ्यां भवितव्यमग्रे ॥ ॥
    मनो नाम महाव्याघ्रो विषयारण्यभूमिषु । चरत्यत्र न गच्छन्तु साधवो ये मुमुक्षवः ॥ ॥ मनः प्रसूते विषयानशेषान्
    स्थूलात्मना सूक्ष्मतया च भोक्तुः । शरीरवर्णाश्रमजातिभेदान् गुणक्रियाहेतुफलानि नित्यम् ॥ ॥ असङ्गचिद्रूपममुं
    विमोह्य देहेन्द्रियप्राणगुणैर्निबद्ध्य । अहम्ममेति भ्रमयत्यजस्रं मनः स्वकृत्येषु फलोपभुक्तिषु ॥ ॥
    अध्यासदोषात्पुरुषस्य संसृतिः अध्यासबन्धस्त्वमुनैव कल्पितः । रजस्तमोदोषवतोऽविवेकिनो जन्मादिदुःखस्य
    निदानमेतत् ॥ ॥ अतः प्राहुर्मनोऽविद्यां पण्डितास्तत्त्वदर्शिनः । येनैव भ्राम्यते विश्वं वायुनेवाभ्रमण्डलम्
    ॥ ॥ तन्मनःशोधनं कार्यं प्रयत्नेन मुमुक्षुणा । विशुद्धे सति चैतस्मिन्मुक्तिः करफलायते ॥ ॥ मोक्षैकसक्त्या
    विषयेषु रागं निर्मूल्य सन्न्यस्य च सर्वकर्म । सच्छ्रद्धया यः श्रवणादिनिष्ठो रजःस्वभावं स धुनोति बुद्धेः
    ॥ ॥ मनोमयो नापि भवेत्परात्मा ह्याद्यन्तवत्त्वात्परिणामिभावात् । दुःखात्मकत्वाद्विषयत्वहेतोः द्रष्टा
    हि दृश्यात्मतया न दृष्टः ॥ ॥ बुद्धिर्बुद्धीन्द्रियैः सार्धं सवृत्तिः कर्तृलक्षणः । विज्ञानमयकोशः स्यात्पुंसः
    संसारकारणम् ॥ ॥ अनुव्रजच्चित्प्रतिबिम्बशक्तिः विज्ञानसञ्ज्ञः प्रकृतेर्विकारः । ज्ञानक्रियावानहमित्यजस्रं
    देहेन्द्रियादिष्वभिमन्यते भृशम् ॥ ॥ अनादिकालोऽयमहंस्वभावो जीवः समस्तव्यवहारवोढा । करोति कर्माण्यपि
    पूर्ववासनः पुण्यान्यपुण्यानि च तत्फलानि ॥ ॥ भुङ्क्ते विचित्रास्वपि योनिषु व्रज न्नायाति निर्यात्यध
    ऊर्ध्वमेषः । अस्यैव विज्ञानमयस्य जाग्रत् स्वप्नाद्यवस्थाः सुखदुःखभोगः ॥ ॥ देहादिनिष्ठाश्रमधर्मकर्म
    गुणाभिमानः सततं ममेति । विज्ञानकोशोऽयमतिप्रकाशः प्रकृष्टसान्निध्यवशात्परात्मनः । अतो भवत्येष उपाधिरस्य
    यदात्मधीः संसरति भ्रमेण ॥ ॥ योऽयं विज्ञानमयः प्राणेषु हृदि स्फुरत्ययं ज्योतिः । स्फुरत्स्वयञ्ज्योतिः
    कूटस्थः सन्नात्मा कर्ता भोक्ता भवत्युपाधिस्थः ॥ ॥ स्वयं परिच्छेदमुपेत्य बुद्धेः तादात्म्यदोषेण परं
    मृषात्मनः । सर्वात्मकः सन्नपि वीक्षते स्वयं स्वतः पृथक्त्वेन मृदो घटानिव ॥ ॥ उपाधिसम्बन्धवशात्परात्मा
    ह्युपाधिधर्माननुभाति तद्गुणः । अयोविकारानविकारिवह्निवत् सदैकरूपोऽपि परः स्वभावात् ॥ ॥ शिष्य उवाच ।
    भ्रमेणाप्यन्यथा वाऽस्तु जीवभावः परात्मनः । तदुपाधेरनादित्वान्नानादेर्नाश इष्यते ॥ ॥ अतोऽस्य जीवभावोऽपि
    नित्या भवति संसृतिः । न निवर्तेत तन्मोक्षः कथं मे श्रीगुरो वद ॥ ॥ श्रीगुरुरुवाच । सम्यक्पृष्टं त्वया
    विद्वन्सावधानेन तच्छृणु । प्रामाणिकी न भवति भ्रान्त्या मोहितकल्पना ॥ ॥ भ्रान्तिं विना त्वसङ्गस्य निष्क्रियस्य
    निराकृतेः । न घटेतार्थसम्बन्धो नभसो नीलतादिवत् ॥ ॥ स्वस्य द्रष्टुर्निर्गुणस्याक्रियस्य प्रत्यग्बोधानन्दरूपस्य
    बुद्धेः । भ्रान्त्या प्राप्तो जीवभावो न सत्यो मोहापाये नास्त्यवस्तुस्वभावात् ॥ ॥ यावद्भ्रान्तिस्तावदेवास्य
    सत्ता मिथ्याज्ञानोज्जृम्भितस्य प्रमादात् । रज्ज्वां सर्पो भ्रान्तिकालीन एव भ्रान्तेर्नाशे नैव सर्पोऽपि
    तद्वत् ॥ अनादित्वमविद्यायाः कार्यस्यापि तथेष्यते । उत्पन्नायां तु विद्यायामाविद्यकमनाद्यपि ॥ ॥ प्रबोधे
    स्वप्नवत्सर्वं सहमूलं विनश्यति । अनाद्यपीदं नो नित्यं प्रागभाव इव स्फुटम् ॥ ॥ अनादेरपि विध्वंसः प्रागभावस्य
    वीक्षितः । यद्बुद्ध्युपाधिसम्बन्धात्परिकल्पितमात्मनि ॥ ॥ जीवत्वं न ततोऽन्यस्तु स्वरूपेण विलक्षणः ।
    सम्बन्धस्त्वात्मनो बुद्ध्या मिथ्याज्ञानपुरःसरः ॥ विनिवृत्तिर्भवेत्तस्य सम्यग्ज्ञानेन नान्यथा । ब्रह्मात्मैकत्वविज्ञानं
    सम्यग्ज्ञानं श्रुतेर्मतम् ॥ ॥ तदात्मानात्मनोः सम्यग्विवेकेनैव सिध्यति । ततो विवेकः कर्तव्यः प्रत्यगात्मसदात्मनोः
    ॥ प्रत्यगात्मासदात्मनोः जलं पङ्कवदत्यन्तं पङ्कापाये जलं स्फुटम् । यथा भाति तथात्मापि दोषाभावे स्फुटप्रभः
    ॥ ॥ असन्निवृत्तौ तु सदात्मना स्फुटं प्रतीतिरेतस्य भवेत्प्रतीचः । ततो निरासः करणीय एव सदात्मनः साध्वहमादिवस्तुनः
    ॥ अतो नायं परात्मा स्याद्विज्ञानमयशब्दभाक् । विकारित्वाज्जडत्वाच्च परिच्छिन्नत्वहेतुतः । दृश्यत्वाद्व्यभिचारित्वान्नानित्यो
    नित्य इष्यते ॥ ॥ आनन्दप्रतिबिम्बचुम्बिततनुर्वृत्तिस्तमोजृम्भिता स्यादानन्दमयः प्रियादिगुणकः स्वेष्टार्थलाभोदयः
    । पुण्यस्यानुभवे विभाति कृतिनामानन्दरूपः स्वयं सर्वो नन्दति यत्र साधु तनुभृन्मात्रः प्रयत्नं विना
    ॥ आनन्दमयकोशस्य सुषुप्तौ स्फूर्तिरुत्कटा । स्वप्नजागरयोरीषदिष्टसन्दर्शनादिना ॥ ॥ नैवायमानन्दमयः परात्मा
    सोपाधिकत्वात्प्रकृतेर्विकारात् । कार्यत्वहेतोः सुकृतक्रियाया विकारसङ्घातसमाहितत्वात् ॥ ॥ पञ्चानामपि
    कोशानां निषेधे युक्तितः श्रुतेः । तन्निषेधावधि साक्षी बोधरूपोऽवशिष्यते ॥ योऽयमात्मा स्वयञ्ज्योतिः
    पञ्चकोशविलक्षणः । अवस्थात्रयसाक्षी सन्निर्विकारो निरञ्जनः । सदानन्दः स विज्ञेयः स्वात्मत्वेन विपश्चिता
    ॥ ॥ शिष्य उवाच । मिथ्यात्वेन निषिद्धेषु कोशेष्वेतेषु पञ्चसु । सर्वाभावं विना किञ्चिन्न पश्याम्यत्र
    हे गुरो । विज्ञेयं किमु वस्त्वस्ति स्वात्मनाऽऽत्मविपश्चिता ॥ स्वात्मनात्र विपश्चिता श्रीगुरुरुवाच
    । सत्यमुक्तं त्वया विद्वन्निपुणोऽसि विचारणे । अहमादिविकारास्ते तदभावोऽयमप्यनु ॥ सर्वे येनानुभूयन्ते
    यः स्वयं नानुभूयते । तमात्मानं वेदितारं विद्धि बुद्ध्या सुसूक्ष्मया ॥ ॥ तत्साक्षिकं भवेत्तत्तद्यद्यद्येनानुभूयते
    । कस्याप्यननुभूतार्थे साक्षित्वं नोपयुज्यते ॥ असौ स्वसाक्षिको भावो यतः स्वेनानुभूयते । अतः परं स्वयं
    साक्षात्प्रत्यगात्मा न चेतरः ॥ ॥ जाग्रत्स्वप्नसुषुप्तिषु स्फुटतरं योऽसौ समुज्जृम्भते प्रत्यग्रूपतया
    सदाहमहमित्यन्तः स्फुरन्नैकधा । नानाकारविकारभागिन इमान् पश्यन्नहन्धीमुखान् नित्यानन्दचिदात्मना स्फुरति
    तं विद्धि स्वमेतं हृदि ॥ ॥ घटोदके बिम्बितमर्कबिम्ब मालोक्य मूढो रविमेव मन्यते । तथा चिदाभासमुपाधिसंस्थं
    भ्रान्त्याहमित्येव जडोऽभिमन्यते ॥ ॥ घटं जलं तद्गतमर्कबिम्बं विहाय सर्वं विनिरीक्ष्यतेऽर्कः । तटस्थ
    एतत्त्रितयावभासकः स्वयम्प्रकाशो विदुषा यथा तथा ॥ ॥ देहं धियं चित्प्रतिबिम्बमेवं विसृज्य बुद्धौ निहितं
    गुहायाम् । द्रष्टारमात्मानमखण्डबोधं सर्वप्रकाशं सदसद्विलक्षणम् ॥ ॥ नित्यं विभुं सर्वगतं सुसूक्ष्मं
    अन्तर्बहिःशून्यमनन्यमात्मनः । विज्ञाय सम्यङ्निजरूपमेतत् पुमान् विपाप्मा विरजो विमृत्युः ॥ ॥ विशोक
    आनन्दघनो विपश्चित् स्वयं कुतश्चिन्न बिभेति कश्चित् । नान्योऽस्ति पन्था भवबन्धमुक्तेः विना स्वतत्त्वावगमं
    मुमुक्षोः ॥ ॥ ब्रह्माभिन्नत्वविज्ञानं भवमोक्षस्य कारणम् । येनाद्वितीयमानन्दं ब्रह्म सम्पद्यते बुधैः
    ॥ ब्रह्मभूतस्तु संसृत्यै विद्वान्नावर्तते पुनः । विज्ञातव्यमतः सम्यग्ब्रह्माभिन्नत्वमात्मनः ॥ ॥ सत्यं
    ज्ञानमनन्तं ब्रह्म विशुद्धं परं स्वतःसिद्धम् । नित्यानन्दैकरसं प्रत्यगभिन्नं निरन्तरं जयति ॥ ॥ सदिदं
    परमाद्वैतं स्वस्मादन्यस्य वस्तुनोऽभावात् । न ह्यन्यदस्ति किञ्चित् सम्यक् परमार्थतत्त्वबोधदशायाम् ॥
    परतत्त्वबोधसुदशायाम् यदिदं सकलं विश्वं नानारूपं प्रतीतमज्ञानात् । तत्सर्वं ब्रह्मैव प्रत्यस्ताशेषभावनादोषम्
    ॥ ॥ मृत्कार्यभूतोऽपि मृदो न भिन्नः कुम्भोऽस्ति सर्वत्र तु मृत्स्वरूपात् । न कुम्भरूपं पृथगस्ति कुम्भः
    कुतो मृषा कल्पितनाममात्रः ॥ ॥ केनापि मृद्भिन्नतया स्वरूपं घटस्य सन्दर्शयितुं न शक्यते । अतो घटः कल्पित
    एव मोहा न्मृदेव सत्यं परमार्थभूतम् ॥ ॥ सद्ब्रह्मकार्यं सकलं सदेवं तन्मात्रमेतन्न ततोऽन्यदस्ति । अस्तीति
    यो वक्ति न तस्य मोहो विनिर्गतो निद्रितवत्प्रजल्पः ॥ ॥ ब्रह्मैवेदं विश्वमित्येव वाणी श्रौती ब्रूतेऽथर्वनिष्ठा
    वरिष्ठा । तस्मादेतद्ब्रह्ममात्रं हि विश्वं नाधिष्ठानाद्भिन्नताऽऽरोपितस्य ॥ ॥ सत्यं यदि स्याज्जगदेतदात्मनोऽ
    नन्तत्त्वहानिर्निगमाप्रमाणता । असत्यवादित्वमपीशितुः स्या न्नैतत्त्रयं साधु हितं महात्मनाम् ॥ ॥ ईश्वरो
    वस्तुतत्त्वज्ञो न चाहं तेष्ववस्थितः । न च मत्स्थानि भूतानीत्येवमेव व्यचीक्लृपत् ॥ यदि सत्यं भवेद्विश्वं
    सुषुप्तावुपलभ्यताम् । यन्नोपलभ्यते किञ्चिदतोऽसत्स्वप्नवन्मृषा ॥ ॥ अतः पृथङ्नास्ति जगत्परात्मनः पृथक्प्रतीतिस्तु
    मृषा गुणादिवत् । गुणाहिवत् आरोपितस्यास्ति किमर्थवत्ताऽ धिष्ठानमाभाति तथा भ्रमेण ॥ ॥ भ्रान्तस्य यद्यद्भ्रमतः
    प्रतीतं ब्रह्मैव तत्तद्रजतं हि शुक्तिः । इदन्तया ब्रह्म सदैव रूप्यते त्वारोपितं ब्रह्मणि नाममात्रम्
    ॥ ॥ अतः परं ब्रह्म सदद्वितीयं विशुद्धविज्ञानघनं निरञ्जनम् । प्रशान्तमाद्यन्तविहीनमक्रियं निरन्तरानन्दरसस्वरूपम्
    ॥ ॥ निरस्तमायाकृतसर्वभेदं नित्यं सुखं निष्कलमप्रमेयम् । अरूपमव्यक्तमनाख्यमव्ययं ज्योतिः स्वयं किञ्चिदिदं
    चकास्ति ॥ ॥ ज्ञातृज्ञेयज्ञानशून्यमनन्तं निर्विकल्पकम् । केवलाखण्डचिन्मात्रं परं तत्त्वं विदुर्बुधाः
    ॥ ॥ अहेयमनुपादेयं मनोवाचामगोचरम् । अप्रमेयमनाद्यन्तं ब्रह्म पूर्णमहं महः ॥ तत्त्वम्पदाभ्यामभिधीयमानयोः
    ब्रह्मात्मनोः शोधितयोर्यदीत्थम् । श्रुत्या तयोस्तत्त्वमसीति सम्यग् एकत्वमेव प्रतिपाद्यते मुहुः ॥ एक्यं
    तयोर्लक्षितयोर्न वाच्ययोः निगद्यतेऽन्योन्यविरुद्धधर्मिणोः । खद्योतभान्वोरिव राजभृत्ययोः कूपाम्बुराश्योः
    परमाणुमेर्वोः ॥ ॥ तयोर्विरोधोऽयमुपाधिकल्पितो न वास्तवः कश्चिदुपाधिरेषः । ईशस्य माया महदादिकारणं जीवस्य
    कार्यं शऋणु पञ्चकोशम् ॥ एतावुपाधी परजीवयोस्तयोः सम्यङ्निरासे न परो न जीवः । राज्यं नरेन्द्रस्य भटस्य
    खेटक् स्तयोरपोहे न भटो न राजा ॥ ॥ अथात आदेश इति श्रुतिः स्वयं निषेधति ब्रह्मणि कल्पितं द्वयम् । श्रुतिप्रमाणानुगृहीतबोधा
    प्रमाणानुगृहीतयुक्त्या त्तयोर्निरासः करणीय एव ॥ ॥ नेदं नेदं कल्पितत्वान्न सत्यं रज्जुदृष्टव्यालवत्स्वप्नवच्च
    । इत्थं दृश्यं साधुयुक्त्या व्यपोह्य ज्ञेयः पश्चादेकभावस्तयोर्यः ॥ ॥ ततस्तु तौ लक्षणया सुलक्ष्यौ तयोरखण्डैकरसत्वसिद्धये
    । नालं जहत्या न तथाऽजहत्या किन्तूभयार्थात्मिकयैव भाव्यम् ॥ स देवदत्तोऽयमितीह चैकता विरुद्धधर्मांशमपास्य
    कथ्यते । यथा तथा तत्त्वमसीतिवाक्ये विरुद्धधर्मानुभयत्र हित्वा ॥ ॥ संलक्ष्य चिन्मात्रतया सदात्मनोः
    अखण्डभावः परिचीयते बुधैः । एवं महावाक्यशतेन कथ्यते ब्रह्मात्मनोरैक्यमखण्डभावः ॥ ॥ अस्थूलमित्येतदसन्निरस्य
    सिद्धं स्वतो व्योमवदप्रतर्क्यम् । अतो मृषामात्रमिदं प्रतीतं जहीहि यत्स्वात्मतया गृहीतम् । ब्रह्माहमित्येव
    विशुद्धबुद्ध्या विद्धि स्वमात्मानमखण्डबोधम् ॥ ॥ मृत्कार्यं सकलं घटादि सततं मृन्मात्रमेवाहितं तद्वत्सज्जनितं
    सदात्मकमिदं सन्मात्रमेवाखिलम् । यस्मान्नास्ति सतः परं किमपि तत्सत्यं स आत्मा स्वयं तस्मात्तत्त्वमसि
    प्रशान्तममलं ब्रह्माद्वयं यत्परम् ॥ ॥ निद्राकल्पितदेशकालविषयज्ञात्रादि सर्वं यथा मिथ्या तद्वदिहापि
    जाग्रति जगत्स्वाज्ञानकार्यत्वतः । यस्मादेवमिदं शरीरकरणप्राणाहमाद्यप्यसत् तस्मात्तत्त्वमसि प्रशान्तममलं
    ब्रह्माद्वयं यत्परम् ॥ ॥ यत्र भ्रान्त्या कल्पितं तद्विवेके तत्तन्मात्रं नैव तस्माद्विभिन्नम् । स्वप्ने
    नष्टं स्वप्नविश्वं विचित्रं स्वस्माद्भिन्नं किन्नु दृष्टं प्रबोधे ॥ ॥ जातिनीतिकुलगोत्रदूरगं नामरूपगुणदोषवर्जितम्
    । देशकालविषयातिवर्ति यद् ब्रह्म तत्त्वमसि भावयात्मनि ॥ ॥ यत्परं सकलवागगोचरं गोचरं विमलबोधचक्षुषः ।
    शुद्धचिद्घनमनादि वस्तु यद् ब्रह्म तत्त्वमसि भावयात्मनि ॥ ॥ षड्भिरूर्मिभिरयोगि योगिहृद् भावितं न करणैर्विभावितम्
    । बुद्ध्यवेद्यमनवद्यमस्ति यद् ब्रह्म तत्त्वमसि भावयात्मनि ॥ ॥ भ्रान्तिकल्पितजगत्कलाश्रयं स्वाश्रयं
    च सदसद्विलक्षणम् । निष्कलं निरुपमानवद्धि यद् ब्रह्म तत्त्वमसि भावयात्मनि ॥ ॥ जन्मवृद्धिपरिणत्यपक्षय
    व्याधिनाशनविहीनमव्ययम् । विश्वसृष्ट्यवविघातकारणं ब्रह्म तत्त्वमसि भावयात्मनि ॥ ॥ अस्तभेदमनपास्तलक्षणं
    निस्तरङ्गजलराशिनिश्चलम् । नित्यमुक्तमविभक्तमूर्ति यद् ब्रह्म तत्त्वमसि भावयात्मनि ॥ ॥ एकमेव सदनेककारणं
    कारणान्तरनिरास्यकारणम् । कार्यकारणविलक्षणं स्वयं ब्रह्म तत्त्वमसि भावयात्मनि ॥ ॥ निर्विकल्पकमनल्पमक्षरं
    यत्क्षराक्षरविलक्षणं परम् । नित्यमव्ययसुखं निरञ्जनं ब्रह्म तत्त्वमसि भावयात्मनि ॥ ॥ यद्विभाति सदनेकधा
    भ्रमा न्नामरूपगुणविक्रियात्मना । हेमवत्स्वयमविक्रियं सदा ब्रह्म तत्त्वमसि भावयात्मनि ॥ ॥ यच्चकास्त्यनपरं
    परात्परं प्रत्यगेकरसमात्मलक्षणम् । सत्यचित्सुखमनन्तमव्ययं ब्रह्म तत्त्वमसि भावयात्मनि ॥ ॥ उक्तमर्थमिममात्मनि
    स्वयं भावयेत्प्रथितयुक्तिभिर्धिया । संशयादिरहितं कराम्बुवत् तेन तत्त्वनिगमो भविष्यति ॥ ॥ सम्बोधमात्रं
    परिशुद्धतत्त्वं विज्ञाय सङ्घे नृपवच्च सैन्ये । तदाश्रयः स्वात्मनि सर्वदा स्थितो विलापय ब्रह्मणि विश्वजातम्
    ॥ बुद्धौ गुहायां सदसद्विलक्षणं ब्रह्मास्ति सत्यं परमद्वितीयम् । तदात्मना योऽत्र वसेद्गुहायां पुनर्न
    तस्याङ्गगुहाप्रवेशः ॥ ॥ ज्ञाते वस्तुन्यपि बलवती वासनाऽनादिरेषा कर्ता भोक्ताप्यहमिति दृढा याऽस्य संसारहेतुः
    । प्रत्यग्दृष्ट्याऽऽत्मनि निवसता सापनेया प्रयत्ना न्मुक्तिं प्राहुस्तदिह मुनयो वासनातानवं यत् ॥ ॥
    अहं ममेति यो भावो देहाक्षादावनात्मनि । अध्यासोऽयं निरस्तव्यो विदुषा स्वात्मनिष्ठया ॥ ॥ ज्ञात्वा स्वं
    प्रत्यगात्मानं बुद्धितद्वृत्तिसाक्षिणम् । सोऽहमित्येव सद्वृत्त्याऽनात्मन्यात्ममतिं जहि ॥ ॥ लोकानुवर्तनं
    त्यक्त्वा त्यक्त्वा देहानुवर्तनम् । शास्त्रानुवर्तनं त्यक्त्वा स्वाध्यासापनयं कुरु ॥ ॥ लोकवासनया जन्तोः
    शास्त्रवासनयापि च । देहवासनया ज्ञानं यथावन्नैव जायते ॥ संसारकारागृहमोक्षमिच्छो रयोमयं पादनिबन्धशऋङ्खलम्
    । वदन्ति तज्ज्ञाः पटु वासनात्रयं योऽस्माद्विमुक्तः समुपैति मुक्तिम् ॥ ॥ जलादिसंसर्गवशात्प्रभूत दुर्गन्धधूताऽगरुदिव्यवासना
    । सङ्घर्षणेनैव विभाति सम्य ग्विधूयमाने सति बाह्यगन्धे ॥ ॥ अन्तःश्रितानन्तदुरन्तवासना धूलीविलिप्ता
    परमात्मवासना । प्रज्ञातिसङ्घर्षणतो विशुद्धा प्रतीयते चन्दनगन्धवत् स्फुटम् ॥ अनात्मवासनाजालैस्तिरोभूतात्मवासना
    । नित्यात्मनिष्ठया तेषां नाशे भाति स्वयं स्फुटम् ॥ यथा यथा प्रत्यगवस्थितं मनः तथा तथा मुञ्चति बाह्यवासनाम्
    । निःशेषमोक्षे सति वासनानां आत्मानुभूतिः प्रतिबन्धशून्या ॥ ॥ स्वात्मन्येव सदा स्थित्वा मनो नश्यति
    योगिनः । वासनानां क्षयश्चातः स्वाध्यासापनयं कुरु ॥ ॥ तमो द्वाभ्यां रजः सत्त्वात्सत्त्वं शुद्धेन नश्यति
    । तस्मात्सत्त्वमवष्टभ्य स्वाध्यासापनयं कुरु ॥ ॥ प्रारब्धं पुष्यति वपुरिति निश्चित्य निश्चलः । धैर्यमालम्ब्य
    यत्नेन स्वाध्यासापनयं कुरु ॥ ॥ नाहं जीवः परं ब्रह्मेत्यतद्व्यावृत्तिपूर्वकम् । वासनावेगतः प्राप्तस्वाध्यासापनयं
    कुरु ॥ ॥ श्रुत्या युक्त्या स्वानुभूत्या ज्ञात्वा सार्वात्म्यमात्मनः । क्वचिदाभासतः प्राप्तस्वाध्यासापनयं
    कुरु ॥ ॥ अनादानविसर्गाभ्यामीषन्नास्ति क्रिया मुनेः । तदेकनिष्ठया नित्यं स्वाध्यासापनयं कुरु ॥ ॥ तत्त्वमस्यादिवाक्योत्थब्रह्मात्मैकत्वबोधतः
    । ब्रह्मण्यात्मत्वदार्ढ्याय स्वाध्यासापनयं कुरु ॥ ॥ अहम्भावस्य देहेऽस्मिन्निःशेषविलयावधि । सावधानेन
    युक्तात्मा स्वाध्यासापनयं कुरु ॥ ॥ प्रतीतिर्जीवजगतोः स्वप्नवद्भाति यावता । तावन्निरन्तरं विद्वन्स्वाध्यासापनयं
    कुरु ॥ ॥ निद्राया लोकवार्तायाः शब्दादेरपि विस्मृतेः । क्वचिन्नावसरं दत्त्वा चिन्तयात्मानमात्मनि ॥
    ॥ मातापित्रोर्मलोद्भूतं मलमांसमयं वपुः । त्यक्त्वा चाण्डालवद्दूरं ब्रह्मीभूय कृती भव ॥ ॥ घटाकाशं महाकाश
    इवात्मानं परात्मनि । विलाप्याखण्डभावेन तूष्णी भव सदा मुने ॥ स्वप्रकाशमधिष्ठानं स्वयम्भूय सदात्मना
    । ब्रह्माण्डमपि पिण्डाण्डं त्यज्यतां मलभाण्डवत् ॥ ॥ चिदात्मनि सदानन्दे देहारूढामहन्धियम् । निवेश्य
    लिङ्गमुत्सृज्य केवलो भव सर्वदा ॥ ॥ यत्रैष जगदाभासो दर्पणान्तः पुरं यथा । तद्ब्रह्माहमिति ज्ञात्वा
    कृतकृत्यो भविष्यसि ॥ ॥ यत्सत्यभूतं निजरूपमाद्यं चिदद्वयानन्दमरूपमक्रियम् । तदेत्य मिथ्यावपुरुत्सृजेत
    शैलूषवद्वेषमुपात्तमात्मनः ॥ ॥ सर्वात्मना दृश्यमिदं मृषैव नैवाहमर्थः क्षणिकत्वदर्शनात् । जानाम्यहं
    सर्वमिति प्रतीतिः कुतोऽहमादेः क्षणिकस्य सिध्येत् ॥ ॥ अहम्पदार्थस्त्वहमादिसाक्षी नित्यं सुषुप्तावपि
    भावदर्शनात् । ब्रूते ह्यजो नित्य इति श्रुतिः स्वयं तत्प्रत्यगात्मा सदसद्विलक्षणः ॥ ॥ विकारिणां सर्वविकारवेत्ता
    नित्याविकारो भवितुं समर्हति । मनोरथस्वप्नसुषुप्तिषु स्फुटं पुनः पुनर्दृष्टमसत्त्वमेतयोः ॥ ॥ अतोऽभिमानं
    त्यज मांसपिण्डे पिण्डाभिमानिन्यपि बुद्धिकल्पिते । कालत्रयाबाध्यमखण्डबोधं ज्ञात्वा स्वमात्मानमुपैहि
    शान्तिम् ॥ ॥ त्यजाभिमानं कुलगोत्रनाम रूपाश्रमेष्वार्द्रशवाश्रितेषु । लिङ्गस्य धर्मानपि कर्तृतादीं
    स्त्यक्त्वा भवाखण्डसुखस्वरूपः ॥ ॥ सन्त्यन्ये प्रतिबन्धाः पुंसः संसारहेतवो दृष्टाः । तेषामेवं मूलं
    प्रथमविकारो भवत्यहङ्कारः ॥ यावत्स्यात्स्वस्य सम्बन्धोऽहङ्कारेण दुरात्मना । तावन्न लेशमात्रापि मुक्तिवार्ता
    विलक्षणा ॥ ॥ अहङ्कारग्रहान्मुक्तः स्वरूपमुपपद्यते । चन्द्रवद्विमलः पूर्णः सदानन्दः स्वयम्प्रभः ॥ ॥
    यो वा पुरे सोऽहमिति प्रतीतो बुद्ध्या प्रक्लृप्तस्तमसाऽतिमूढया । बुद्ध्याऽविविक्तस्तमसा तस्यैव निःशेषतया
    विनाशे ब्रह्मात्मभावः प्रतिबन्धशून्यः ॥ ॥ ब्रह्मानन्दनिधिर्महाबलवताऽहङ्कारघोराहिना संवेष्ट्यात्मनि
    रक्ष्यते गुणमयैश्चण्डेस्त्रिभिर्मस्तकैः विज्ञानाख्यमहासिना श्रुतिमता विच्छिद्य शीर्षत्रयं निर्मूल्याहिमिमं
    निधिं सुखकरं धीरोऽनुभोक्तुङ्क्षमः ॥ ॥ यावद्वा यत्किञ्चिद्विषदोषस्फूर्तिरस्ति चेद्देहे । कथमारोग्याय
    भवेत्तद्वदहन्तापि योगिनो मुक्त्यै ॥ ॥ अहमोऽत्यन्तनिवृत्त्या तत्कृतनानाविकल्पसंहृत्या । प्रत्यक्तत्त्वविवेकादिदमहमस्मीति
    विन्दते तत्त्वम् ॥ अहङ्कारे कर्तर्यहमिति मतिं मुञ्च सहसा अहङ्कर्तर्यस्मिन्नहमिति विकारात्मन्यात्मप्रतिफलजुषि
    स्वस्थितिमुषि । यदध्यासात्प्राप्ता जनिमृतिजरादुःखबहुला प्रतीचश्चिन्मूर्तेस्तव सुखतनोः संसृतिरियम्
    ॥ ॥ सदैकरूपस्य चिदात्मनो विभो रानन्दमूर्तेरनवद्यकीर्तेः । नैवान्यथा क्वाप्यविकारिणस्ते विनाहमध्यासममुष्य
    संसृतिः ॥ ॥ तस्मादहङ्कारमिमं स्वशत्रुं भोक्तुर्गले कण्टकवत्प्रतीतम् । विच्छिद्य विज्ञानमहासिना स्फुटं
    भुङ्क्ष्वात्मसाम्राज्यसुखं यथेष्टम् ॥ ॥ ततोऽहमादेर्विनिवर्त्य वृत्तिं सन्त्यक्तरागः परमार्थलाभात्
    । तूष्णीं समास्स्वात्मसुखानुभूत्या पूर्णात्मना ब्रह्मणि निर्विकल्पः ॥ ॥ समूलकृत्तोऽपि महानहं पुनः
    व्युल्लेखितः स्याद्यदि चेतसा क्षणम् । सञ्जीव्य विक्षेपशतं करोति नभस्वता प्रावृषि वारिदो यथा ॥ ॥ निगृह्य
    शत्रोरहमोऽवकाशः क्वचिन्न देयो विषयानुचिन्तया । स एव सञ्जीवनहेतुरस्य प्रक्षीणजम्बीरतरोरिवाम्बु ॥ ॥
    देहात्मना संस्थित एव कामी विलक्षणः कामयिता कथं स्यात् । अतोऽर्थसन्धानपरत्वमेव भेदप्रसक्त्या भवबन्धहेतुः
    ॥ ॥ कार्यप्रवर्धनाद्बीजप्रवृद्धिः परिदृश्यते । कार्यनाशाद्बीजनाशस्तस्मात्कार्यं निरोधयेत् ॥ ॥ वासनावृद्धितः
    कार्यं कार्यवृद्ध्या च वासना । वर्धते सर्वथा पुंसः संसारो न निवर्तते ॥ ॥ संसारबन्धविच्छित्त्यै तद्
    द्वयं प्रदहेद्यतिः । वासनावृद्धिरेताभ्यां चिन्तया क्रियया बहिः ॥ वासना प्रेर्यते ह्यन्तः ताभ्यां प्रवर्धमाना
    सा सूते संसृतिमात्मनः । त्रयाणां च क्षयोपायः सर्वावस्थासु सर्वदा ॥ ॥ सर्वत्र सर्वतः सर्वब्रह्ममात्रावलोकनैः
    । सद्भाववासनादार्ढ्यात्तत्त्रयं लयमश्नुते ॥ ॥ क्रियानाशे भवेच्चिन्तानाशोऽस्माद्वासनाक्षयः । वासनाप्रक्षयो
    मोक्षः सा जीवन्मुक्तिरिष्यते ॥ सद्वासनास्फूर्तिविजृम्भणे सति ह्यसौ विलीनाप्यहमादिवासना । विलीना त्वहमादिवासना
    अतिप्रकृष्टाप्यरुणप्रभायां विलीयते साधु यथा तमिस्रा ॥ ॥ तमस्तमःकार्यमनर्थजालं न दृश्यते सत्युदिते
    दिनेशे । तथाऽद्वयानन्दरसानुभूतौ नैवास्ति बन्धो न च दुःखगन्धः ॥ ॥ दृश्यं प्रतीतं प्रविलापयन्सन् सन्मात्रमानन्दघनं
    विभावयन् । समाहितः सन्बहिरन्तरं वा कालं नयेथाः सति कर्मबन्धे ॥ ॥ प्रमादो ब्रह्मनिष्ठायां न कर्तव्यः
    कदाचन । प्रमादो मृत्युरित्याह भगवान्ब्रह्मणः सुतः ॥ ॥ न प्रमादादनर्थोऽन्यो ज्ञानिनः स्वस्वरूपतः ।
    ततो मोहस्ततोऽहन्धीस्ततो बन्धस्ततो व्यथा ॥ ॥ विषयाभिमुखं दृष्ट्वा विद्वांसमपि विस्मृतिः । विक्षेपयति
    धीदोषैर्योषा जारमिव प्रियम् ॥ ॥ यथापकृष्टं शैवालं क्षणमात्रं न तिष्ठति । आवृणोति तथा माया प्राज्ञं
    वापि पराङ्मुखम् ॥ ॥ लक्ष्यच्युतं चेद्यदि चित्तमीषद् बहिर्मुखं सन्निपतेत्ततस्ततः । प्रमादतः प्रच्युतकेलिकन्दुकः
    सोपानपङ्क्तौ पतितो यथा तथा ॥ ॥ विषयेष्वाविशच्चेतः सङ्कल्पयति तद्गुणान् । सम्यक्सङ्कल्पनात्कामः कामात्पुंसः
    प्रवर्तनम् ॥ ॥ अतः प्रमादान्न परोऽस्ति मृत्युः विवेकिनो ब्रह्मविदः समाधौ । समाहितः सिद्धिमुपैति सम्यक्
    समाहितात्मा भव सावधानः ॥ ॥ ततः स्वरूपविभ्रंशो विभ्रष्टस्तु पतत्यधः । पतितस्य विना नाशं पुनर्नारोह
    ईक्ष्यते ॥ ॥ सङ्कल्पं वर्जयेत्तस्मात्सर्वानर्थस्य कारणम् । अपथ्यानि हि वस्तूनि व्याधिग्रस्तो यथोत्सृजे
    । जीवतो यस्य कैवल्यं विदेहे स च केवलः । यत्किञ्चित् पश्यतो भेदं भयं ब्रूते यजुःश्रुतिः ॥ ॥ यदा कदा
    वापि विपश्चिदेष ब्रह्मण्यनन्तेऽप्यणुमात्रभेदम् । पश्यत्यथामुष्य भयं तदैव यद्वीक्षितं भिन्नतया प्रमादात्
    ॥ श्रुतिस्मृतिन्यायशतैर्निषिद्धे दृश्येऽत्र यः स्वात्ममतिं करोति । उपैति दुःखोपरि दुःखजातं निषिद्धकर्ता
    स मलिम्लुचो यथा ॥ ॥ सत्याभिसन्धानरतो विमुक्तो महत्त्वमात्मीयमुपैति नित्यम् । मिथ्याभिसन्धानरतस्तु
    नश्येद् दृष्टं तदेतद्यदचौरचौरयोः ॥ यतिरसदनुसन्धिं बन्धहेतुं विहाय स्वयमयमहमस्मीत्यात्मदृष्ट्यैव तिष्ठेत्
    सुखयति ननु निष्ठा ब्रह्मणि स्वानुभूत्या हरति परमविद्याकार्यदुःखं प्रतीतम् ॥ ॥ बाह्यानुसन्धिः परिवर्धयेत्फलं
    दुर्वासनामेव ततस्ततोऽधिकाम् । ज्ञात्वा विवेकैः परिहृत्य बाह्यं स्वात्मानुसन्धिं विदधीत नित्यम् ॥ ॥
    बाह्ये निरुद्धे मनसः प्रसन्नता मनःप्रसादे परमात्मदर्शनम् । तस्मिन्सुदृष्टे भवबन्धनाशो बहिर्निरोधः
    पदवी विमुक्तेः ॥ ॥ कः पण्डितः सन्सदसद्विवेकी श्रुतिप्रमाणः परमार्थदर्शी । जानन्हि कुर्यादसतोऽवलम्बं
    स्वपातहेतोः शिशुवन्मुमुक्षुः ॥ ॥ देहादिसंसक्तिमतो न मुक्तिः मुक्तस्य देहाद्यभिमत्यभावः । सुप्तस्य
    नो जागरणं न जाग्रतः स्वप्नस्तयोर्भिन्नगुणाश्रयत्वात् ॥ ॥ अन्तर्बहिः स्वं स्थिरजङ्गमेषु ज्ञात्वाऽऽत्मनाधारतया
    विलोक्य । त्यक्ताखिलोपाधिरखण्डरूपः पूर्णात्मना यः स्थित एष मुक्तः ॥ ॥ सर्वात्मना बन्धविमुक्तिहेतुः
    सर्वात्मभावान्न परोऽस्ति कश्चित् । दृश्याग्रहे सत्युपपद्यतेऽसौ सर्वात्मभावोऽस्य सदात्मनिष्ठया ॥ ॥
    दृश्यस्याग्रहणं कथं नु घटते देहात्मना तिष्ठतो बाह्यार्थानुभवप्रसक्तमनसस्तत्तत्क्रियां कुर्वतः । सन्न्यस्ताखिलधर्मकर्मविषयैर्नित्यात्मनिष्ठापरैः
    तत्त्वज्ञैः करणीयमात्मनि सदानन्देच्छुभिर्यत्नतः ॥ ॥ सर्वात्मसिद्धये भिक्षोः कृतश्रवणकर्मणः । समाधिं
    विदधात्येषा शान्तो दान्त इति श्रुतिः ॥ ॥ आरूढशक्तेरहमो विनाशः कर्तुन्न शक्य सहसापि पण्डितैः । ये निर्विकल्पाख्यसमाधिनिश्चलाः
    तानन्तराऽनन्तभवा हि वासनाः ॥ ॥ अहम्बुद्ध्यैव मोहिन्या योजयित्वाऽऽवृतेर्बलात् । विक्षेपशक्तिः पुरुषं
    विक्षेपयति तद्गुणैः ॥ ॥ विक्षेपशक्तिविजयो विषमो विधातुं निःशेषमावरणशक्तिनिवृत्त्यभावे । दृग्दृश्ययोः
    स्फुटपयोजलवद्विभागे नश्येत्तदावरणमात्मनि च स्वभावात् । निःसंशयेन भवति प्रतिबन्धशून्यो विक्षेपणं न
    हि तदा यदि चेन्मृषार्थे ॥ सम्यग्विवेकः स्फुटबोधजन्यो विभज्य दृग्दृश्यपदार्थतत्त्वम् । छिनत्ति मायाकृतमोहबन्धं
    यस्माद्विमुक्तस्तु पुनर्न संसृतिः ॥ परावरैकत्वविवेकवह्निः दहत्यविद्यागहनं ह्यशेषम् । किं स्यात्पुनः
    संसरणस्य बीजं अद्वैतभावं समुपेयुषोऽस्य ॥ ॥ आवरणस्य निवृत्तिर्भवति हि सम्यक्पदार्थदर्शनतः । मिथ्याज्ञानविनाशस्तद्विक्षेपजनितदुःखनिवृत्तिः
    ॥ ॥ एतत्त्रितयं दृष्टं सम्यग्रज्जुस्वरूपविज्ञानात् । तस्माद्वस्तुसतत्त्वं ज्ञातव्यं बन्धमुक्तये विदुषा
    ॥ ॥ अयोऽग्नियोगादिव सत्समन्वयान् मात्रादिरूपेण विजृम्भते धीः । तत्कार्यमेतद्द्वितयं यतो मृषा दृष्टं
    भ्रमस्वप्नमनोरथेषु ॥ ॥ ततो विकाराः प्रकृतेरहम्मुखा देहावसाना विषयाश्च सर्वे । क्षणेऽन्यथाभावितया ह्यमीषा
    मसत्त्वमात्मा तु कदापि नान्यथा ॥ मसत्त्वमात्मा तु कदापि नित्याद्वयाखण्डचिदेकरूपो बुद्ध्यादिसाक्षी
    सदसद्विलक्षणः । अहम्पदप्रत्ययलक्षितार्थः प्रत्यक् सदानन्दघनः परात्मा ॥ ॥ इत्थं विपश्चित्सदसद्विभज्य
    निश्चित्य तत्त्वं निजबोधदृष्ट्या । ज्ञात्वा स्वमात्मानमखण्डबोधं तेभ्यो विमुक्तः स्वयमेव शाम्यति ॥
    ॥ अज्ञानहृदयग्रन्थेर्निःशेषविलयस्तदा । समाधिनाऽविकल्पेन यदाऽद्वैतात्मदर्शनम् ॥ ॥ त्वमहमिदमितीयं कल्पना
    बुद्धिदोषात् प्रभवति परमात्मन्यद्वये निर्विशेषे । प्रविलसति समाधावस्य सर्वो विकल्पो विलयनमुपगच्छेद्वस्तुतत्त्वावधृत्या
    ॥ ॥ शान्तो दान्तः परमुपरतः क्षान्तियुक्तः समाधिं कुर्वन्नित्यं कलयति यतिः स्वस्य सर्वात्मभावम् । तेनाविद्यातिमिरजनितान्साधु
    दग्ध्वा विकल्पान् ब्रह्माकृत्या निवसति सुखं निष्क्रियो निर्विकल्पः ॥ ॥ समाहिता ये प्रविलाप्य बाह्यं
    श्रोत्रादि चेतः स्वमहं चिदात्मनि । त एव मुक्ता भवपाशबन्धैः नान्ये तु पारोक्ष्यकथाभिधायिनः ॥ ॥ उपाधिभेदात्स्वयमेव
    भिद्यते चोपाध्यपोहे स्वयमेव केवलः । तस्मादुपाधेर्विलयाय विद्वान् वसेत्सदाऽकल्पसमाधिनिष्ठया ॥ ॥ सति
    सक्तो नरो याति सद्भावं ह्येकनिष्ठया । कीटको भ्रमरं ध्यायन् भ्रमरत्वाय कल्पते ॥ ॥ क्रियान्तरासक्तिमपास्य
    कीटको ध्यायन्नलित्वं ह्यलिभावमृच्छति । तथैव योगी परमात्मतत्त्वं ध्यात्वा समायाति तदेकनिष्ठया ॥ ॥ अतीव
    सूक्ष्मं परमात्मतत्त्वं न स्थूलदृष्ट्या प्रतिपत्तुमर्हति । समाधिनात्यन्तसुसूक्ष्मवृत्त्या ज्ञातव्यमार्यैरतिशुद्धबुद्धिभिः
    ॥ ॥ यथा सुवर्णं पुटपाकशोधितं त्यक्त्वा मलं स्वात्मगुणं समृच्छति । तथा मनः सत्त्वरजस्तमोमलं ध्यानेन
    सन्त्यज्य समेति तत्त्वम् ॥ ॥ निरन्तराभ्यासवशात्तदित्थं पक्वं मनो ब्रह्मणि लीयते यदा । तदा समाधिः सविकल्पवर्जितः
    स्वतोऽद्वयानन्दरसानुभावकः ॥ ॥ समाधिनाऽनेन समस्तवासना ग्रन्थेर्विनाशोऽखिलकर्मनाशः । अन्तर्बहिः सर्वत
    एव सर्वदा स्वरूपविस्फूर्तिरयत्नतः स्यात् ॥ ॥ श्रुतेः शतगुणं विद्यान्मननं मननादपि । निदिध्यासं लक्षगुणमनन्तं
    निर्विकल्पकम् ॥ ॥ निर्विकल्पकसमाधिना स्फुटं ब्रह्मतत्त्वमवगम्यते ध्रुवम् । नान्यथा चलतया मनोगतेः प्रत्ययान्तरविमिश्रितं
    भवेत् ॥ ॥ अतः समाधत्स्व यतेन्द्रियः सन् निरन्तरं शान्तमनाः प्रतीचि । विध्वंसय ध्वान्तमनाद्यविद्यया
    कृतं सदेकत्वविलोकनेन ॥ ॥ योगस्य प्रथमद्वारं वाङ्निरोधोऽपरिग्रहः । निराशा च निरीहा च नित्यमेकान्तशीलता
    ॥ ॥ एकान्तस्थितिरिन्द्रियोपरमणे हेतुर्दमश्चेतसः संरोधे करणं शमेन विलयं यायादहंवासना । तेनानन्दरसानुभूतिरचला
    ब्राह्मी सदा योगिनः तस्माच्चित्तनिरोध एव सततं कार्यः प्रयत्नो मुनेः ॥ ॥ प्रयत्नान्मुनेः वाचं नियच्छात्मनि
    तं नियच्छ बुद्धौ धियं यच्छ च बुद्धिसाक्षिणि । तं चापि पूर्णात्मनि निर्विकल्पे विलाप्य शान्तिं परमां
    भजस्व ॥ ॥ देहप्राणेन्द्रियमनोबुद्ध्यादिभिरुपाधिभिः । यैर्यैर्वृत्तेःसमायोगस्तत्तद्भावोऽस्य योगिनः
    ॥ ॥ तन्निवृत्त्या मुनेः सम्यक् सर्वोपरमणं सुखम् । सन्दृश्यते सदानन्दरसानुभवविप्लवः ॥ ॥ अन्तस्त्यागो
    बहिस्त्यागो विरक्तस्यैव युज्यते । त्यजत्यन्तर्बहिःसङ्गं विरक्तस्तु मुमुक्षया ॥ ॥ बहिस्तु विषयैः सङ्गं
    तथान्तरहमादिभिः । विरक्त एव शक्नोति त्यक्तुं ब्रह्मणि निष्ठितः ॥ ॥ वैराग्यबोधौ पुरुषस्य पक्षिवत् पक्षौ
    विजानीहि विचक्षण त्वम् । विमुक्तिसौधाग्रलताधिरोहणं ताभ्यां विना नान्यतरेण सिध्यति ॥ ॥ अत्यन्तवैराग्यवतः
    समाधिः समाहितस्यैव दृढप्रबोधः । प्रबुद्धतत्त्वस्य हि बन्धमुक्तिः मुक्तात्मनो नित्यसुखानुभूतिः ॥ ॥
    वैराग्यान्न परं सुखस्य जनकं पश्यामि वश्यात्मनः तच्चेच्छुद्धतरात्मबोधसहितं स्वाराज्यसाम्राज्यधुक् ।
    एतद्द्वारमजस्रमुक्तियुवतेर्यस्मात्त्वमस्मात्परं सर्वत्रास्पृहया सदात्मनि सदा प्रज्ञां कुरु श्रेयसे
    ॥ ॥ आशां छिन्द्धि विषोपमेषु विषयेष्वेषैव मृत्योः कृति स्त्यक्त्वा जातिकुलाश्रमेष्वभिमतिं मुञ्चातिदूरात्क्रियाः
    । देहादावसति त्यजात्मधिषणां प्रज्ञां कुरुष्वात्मनि त्वं द्रष्टास्यमनोऽसि निर्द्वयपरं ब्रह्मासि यद्वस्तुतः
    ॥ लक्ष्ये ब्रह्मणि मानसं दृढतरं संस्थाप्य बाह्येन्द्रियं स्वस्थाने विनिवेश्य निश्चलतनुश्चोपेक्ष्य
    देहस्थितिम् । ब्रह्मात्मैक्यमुपेत्य तन्मयतया चाखण्डवृत्त्याऽनिशं ब्रह्मानन्दरसं पिबात्मनि मुदा शून्यैः
    किमन्यैर्भृशम् ॥ अनात्मचिन्तनं त्यक्त्वा कश्मलं दुःखकारणम् । चिन्तयात्मानमानन्दरूपं यन्मुक्तिकारणम्
    ॥ ॥ एष स्वयञ्ज्योतिरशेषसाक्षी विज्ञानकोशो विलसत्यजस्रम् । विज्ञानकोशे लक्ष्यं विधायैनमसद्विलक्षण मखण्डवृत्त्याऽऽत्मतयाऽनुभावय
    ॥ ॥ एतमच्छिन्नया वृत्त्या प्रत्ययान्तरशून्यया । उल्लेखयन्विजानीयात्स्वस्वरूपतया स्फुटम् ॥ ॥ अत्रात्मत्वं
    दृढीकुर्वन्नहमादिषु सन्त्यजन् । उदासीनतया तेषु तिष्ठेत्स्फुटघटादिवत् ॥ विशुद्धमन्तःकरणं स्वरूपे निवेश्य
    साक्षिण्यवबोधमात्रे । शनैः शनैर्निश्चलतामुपानयन् पूर्णं स्वमेवानुविलोकयेत्ततः ॥ देहेन्द्रियप्राणमनोऽहमादिभिः
    स्वाज्ञानक्लृप्तैरखिलैरुपाधिभिः । विमुक्तमात्मानमखण्डरूपं पूर्णं महाकाशमिवावलोकयेत् ॥ ॥ घटकलशकुसूलसूचिमुख्यैः
    गगनमुपाधिशतैर्विमुक्तमेकम् । भवति न विविधं तथैव शुद्धं परमहमादिविमुक्तमेकमेव ॥ ॥ ब्रह्मादिस्तम्बपर्यन्ता
    मृषामात्रा उपाधयः । ततः पूर्णं स्वमात्मानं पश्येदेकात्मना स्थितम् ॥ ॥ यत्र भ्रान्त्या कल्पितं तद्विवेके
    तत्तन्मात्रं नैव तस्माद्विभिन्नम् । भ्रान्तेर्नाशे भाति दृष्टाहितत्त्वं रज्जुस्तद्वद्विश्वमात्मस्वरूपम्
    ॥ ॥ स्वयं ब्रह्मा स्वयं विष्णुः स्वयमिन्द्रः स्वयं शिवः । स्वयं विश्वमिदं सर्वं स्वस्मादन्यन्न किञ्चन
    ॥ ॥ अन्तः स्वयं चापि बहिः स्वयं च स्वयं पुरस्तात् स्वयमेव पश्चात् । स्वयं ह्यावाच्यां स्वयमप्युदीच्यां
    तथोपरिष्टात्स्वयमप्यधस्तात् ॥ ॥ तरङ्गफेनभ्रमबुद्बुदादि सर्वं स्वरूपेण जलं यथा तथा । चिदेव देहाद्यहमन्तमेतत्
    सर्वं चिदेवैकरसं विशुद्धम् ॥ ॥ सदेवेदं सर्वं जगदवगतं वाङ्मनसयोः सतोऽन्यन्नास्त्येव प्रकृतिपरसीम्नि
    स्थितवतः । पृथक् किं मृत्स्नायाः कलशघटकुम्भाद्यवगतं वदत्येष भ्रान्तस्त्वमहमिति मायामदिरया ॥ ॥ क्रियासमभिहारेण
    यत्र नान्यदिति श्रुतिः । ब्रवीति द्वैतराहित्यं मिथ्याध्यासनिवृत्तये ॥ ॥ आकाशवन्निर्मलनिर्विकल्पं निःसीमनिःस्पन्दननिर्विकारम्
    । अन्तर्बहिःशून्यमनन्यमद्वयं स्वयं परं ब्रह्म किमस्ति बोध्यम् ॥ ॥ वक्तव्यं किमु विद्यतेऽत्र बहुधा
    ब्रह्मैव जीवः स्वयं ब्रह्मैतज्जगदाततं नु सकलं ब्रह्माद्वितीयं श्रुतिः । ब्रह्मैवाहमिति प्रबुद्धमतयः
    सन्त्यक्तबाह्याः स्फुटं ब्रह्मीभूय वसन्ति सन्ततचिदानन्दात्मनैतद्ध्रुवम् ॥ आनन्दात्मनैव ध्रुवम् जहि
    मलमयकोशेऽहन्धियोत्थापिताशां प्रसभमनिलकल्पे लिङ्गदेहेऽपि पश्चात् । निगमगदितकीर्तिं नित्यमानन्दमूर्तिं
    स्वयमिति परिचीय ब्रह्मरूपेण तिष्ठ ॥ ॥ शवाकारं यावद्भजति मनुजस्तावदशुचिः परेभ्यः स्यात्क्लेशो जननमरणव्याधिनिलयः
    । यदात्मानं शुद्धं कलयति शिवाकारमचलम् तदा तेभ्यो मुक्तो भवति हि तदाह श्रुतिरपि ॥ ॥ स्वात्मन्यारोपिताशेषाभासवस्तुनिरासतः
    । स्वयमेव परं ब्रह्म पूर्णमद्वयमक्रियम् ॥ ॥ समाहितायां सति चित्तवृत्तौ परात्मनि ब्रह्मणि निर्विकल्पे
    । न दृश्यते कश्चिदयं विकल्पः प्रजल्पमात्रः परिशिष्यते यतः ॥ असत्कल्पो विकल्पोऽयं विश्वमित्येकवस्तुनि
    । निर्विकारे निराकारे निर्विशेषे भिदा कुतः ॥ ॥ द्रष्टुदर्शनदृश्यादिभावशून्यैकवस्तुनि । निर्विकारे
    निराकारे निर्विशेषे भिदा कुतः ॥ ॥ कल्पार्णव इवात्यन्तपरिपूर्णैकवस्तुनि । निर्विकारे निराकारे निर्विशेषे
    भिदा कुतः ॥ ॥ तेजसीव तमो यत्र प्रलीनं भ्रान्तिकारणम् । अद्वितीये परे तत्त्वे निर्विशेषे भिदा कुतः
    ॥ ॥ एकात्मके परे तत्त्वे भेदवार्ता कथं वसेत् । सुषुप्तौ सुखमात्रायां भेदः केनावलोकितः ॥ ॥ न ह्यस्ति
    विश्वं परतत्त्वबोधात् सदात्मनि ब्रह्मणि निर्विकल्पे । कालत्रये नाप्यहिरीक्षितो गुणे न ह्यम्बुबिन्दुर्मृगतृष्णिकायाम्
    ॥ ॥ मायामात्रमिदं द्वैतमद्वैतं परमार्थतः । इति ब्रूते श्रुतिः साक्षात्सुषुप्तावनुभूयते ॥ ॥ अनन्यत्वमधिष्ठानादारोप्यस्य
    निरीक्षितम् । पण्डितै रज्जुसर्पादौ विकल्पो भ्रान्तिजीवनः ॥ ॥ चित्तमूलो विकल्पोऽयं चित्ताभावे न कश्चन
    । अतश्चित्तं समाधेहि प्रत्यग्रूपे परात्मनि ॥ ॥ किमपि सततबोधं केवलानन्दरूपं निरुपममतिवेलं नित्यमुक्तं
    निरीहम् । निरवधिगगनाभं निष्कलं निर्विकल्पं हृदि कलयति विद्वान् ब्रह्म पूर्णं समाधौ ॥ ॥ प्रकृतिविकृतिशून्यं
    भावनातीतभावं समरसमसमानं मानसम्बन्धदूरम् । निगमवचनसिद्धं नित्यमस्मत्प्रसिद्धं हृदि कलयति विद्वान् ब्रह्म
    पूर्णं समाधौ ॥ ॥ अजरममरमस्ताभाववस्तुस्वरूपं स्तिमितसलिलराशिप्रख्यमाख्याविहीनम् । शमितगुणविकारं शाश्वतं
    शान्तमेकं हृदि कलयति विद्वान् ब्रह्म पूर्णं समाधौ ॥ ॥ समाहितान्तःकरणः स्वरूपे विलोकयात्मानमखण्डवैभवम्
    । विच्छिन्द्धि बन्धं भवगन्धगन्धितं यत्नेन पुंस्त्वं सफलीकुरुष्व ॥ सर्वोपाधिविनिर्मुक्तं सच्चिदानन्दमद्वयम्
    । भावयात्मानमात्मस्थं न भूयः कल्पसेऽध्वने ॥ ॥ छायेव पुंसः परिदृश्यमान माभासरूपेण फलानुभूत्या । शरीरमाराच्छववन्निरस्तं
    पुनर्न सन्धत्त इदं महात्मा ॥ ॥ सततविमलबोधानन्दरूपं समेत्य त्यज जडमलरूपोपाधिमेतं सुदूरे । अथ पुनरपि
    नैष स्मर्यतां वान्तवस्तु स्मरणविषयभूतं कल्पते कुत्सनाय ॥ ॥ समूलमेतत्परिदाह्य वह्नौ सदात्मनि ब्रह्मणि
    निर्विकल्पे । ततः स्वयं नित्यविशुद्धबोधा नन्दात्मना तिष्ठति विद्वरिष्ठः ॥ ॥ प्रारब्धसूत्रग्रथितं शरीरं
    प्रयातु वा तिष्ठतु गोरिव स्रक् । न तत्पुनः पश्यति तत्त्ववेत्ता ऽऽनन्दात्मनि ब्रह्मणि लीनवृत्तिः ॥
    ॥ अखण्डानन्दमात्मानं विज्ञाय स्वस्वरूपतः । किमिच्छन् कस्य वा हेतोर्देहं पुष्णाति तत्त्ववित् ॥ ॥ संसिद्धस्य
    फलं त्वेतज्जीवन्मुक्तस्य योगिनः । बहिरन्तः सदानन्दरसास्वादनमात्मनि ॥ ॥ वैराग्यस्य फलं बोधो बोधस्योपरतिः
    फलम् । स्वानन्दानुभवाच्छान्तिरेषैवोपरतेः फलम् ॥ ॥ यद्युत्तरोत्तराभावः पूर्वपूर्वन्तु निष्फलम् । निवृत्तिः
    परमा तृप्तिरानन्दोऽनुपमः स्वतः ॥ ॥ दृष्टदुःखेष्वनुद्वेगो विद्यायाः प्रस्तुतं फलम् । यत्कृतं भ्रान्तिवेलायां
    नाना कर्म जुगुप्सितम् । पश्चान्नरो विवेकेन तत्कथं कर्तुमर्हति ॥ ॥ विद्याफलं स्यादसतो निवृत्तिः प्रवृत्तिरज्ञानफलं
    तदीक्षितम् । तज्ज्ञाज्ञयोर्यन्मृगतृष्णिकादौ नोचेद्विदां दृष्टफलं किमस्मात् ॥ अज्ञानहृदयग्रन्थेर्विनाशो
    यद्यशेषतः । अनिच्छोर्विषयः किं नु प्रवृत्तेः कारणं स्वतः ॥ वासनानुदयो भोग्ये वैराग्यस्य तदावधिः ।
    अहम्भावोदयाभावो बोधस्य परमावधिः । लीनवृत्तैरनुत्पत्तिर्मर्यादोपरतेस्तु सा ॥ ब्रह्माकारतया सदा स्थिततया
    निर्मुक्तबाह्यार्थधी रन्यावेदितभोग्यभोगकलनो निद्रालुवद्बालवत् । स्वप्नालोकितलोकवज्जगदिदं पश्यन्क्वचिल्लब्धधी
    रास्ते कश्चिदनन्तपुण्यफलभुग्धन्यः स मान्यो भुवि ॥ ॥ स्थितप्रज्ञो यतिरयं यः सदानन्दमश्नुते । ब्रह्मण्येव
    विलीनात्मा निर्विकारो विनिष्क्रियः ॥ ॥ ब्रह्मात्मनोः शोधितयोरेकभावावगाहिनी । निर्विकल्पा च चिन्मात्रा
    वृत्तिः प्रज्ञेति कथ्यते । सुस्थिताऽसौ भवेद्यस्य स्थितप्रज्ञः स उच्यते ॥ ॥ यस्य स्थिता भवेत्प्रज्ञा
    यस्यानन्दो निरन्तरः । प्रपञ्चो विस्मृतप्रायः स जीवन्मुक्त इष्यते ॥ ॥ लीनधीरपि जागर्ति जाग्रद्धर्मविवर्जितः
    । बोधो निर्वासनो यस्य स जीवन्मुक्त इष्यते ॥ ॥ शान्तसंसारकलनः कलावानपि निष्कलः । यस्य चित्तं विनिश्चिन्तं
    स जीवन्मुक्त इष्यते ॥ यः सचित्तोऽपि निश्चित्तः वर्तमानेऽपि देहेऽस्मिञ्छायावदनुवर्तिनि । अहन्ताममताऽभावो
    जीवन्मुक्तस्य लक्षणम् ॥ ॥ अतीताननुसन्धानं भविष्यदविचारणम् । औदासीन्यमपि प्राप्तं जीवन्मुक्तस्य लक्षणम्
    ॥ गुणदोषविशिष्टेऽस्मिन्स्वभावेन विलक्षणे । सर्वत्र समदर्शित्वं जीवन्मुक्तस्य लक्षणम् ॥ ॥ इष्टानिष्टार्थसम्प्राप्तौ
    समदर्शितयाऽऽत्मनि । उभयत्राविकारित्वं जीवन्मुक्तस्य लक्षणम् ॥ ॥ ब्रह्मानन्दरसास्वादासक्तचित्ततया यतेः
    । अन्तर्बहिरविज्ञानं जीवन्मुक्तस्य लक्षणम् ॥ ॥ देहेन्द्रियादौ कर्तव्ये ममाहम्भाववर्जितः । औदासीन्येन
    यस्तिष्ठेत्स जीवन्मुक्तलक्षणः ॥ विज्ञात आत्मनो यस्य ब्रह्मभावः श्रुतेर्बलात् । भवबन्धविनिर्मुक्तः
    स जीवन्मुक्तलक्षणः ॥ देहेन्द्रियेष्वहम्भाव इदम्भावस्तदन्यके । यस्य नो भवतः क्वापि स जीवन्मुक्त इष्यते
    ॥ ॥ जीवेशोभयसंसाररूपदुर्वासनोज्झिता । सा सर्वदा भवेद्यस्य स जीवन्मुक्त इष्यते ॥ न प्रत्यग्ब्रह्मणोर्भेदं
    कदापि ब्रह्मसर्गयोः । प्रज्ञया यो विजानिति स जीवन्मुक्तलक्षणः ॥ साधुभिः पूज्यमानेऽस्मिन्पीड्यमानेऽपि
    दुर्जनैः । समभावो भवेद्यस्य स जीवन्मुक्तलक्षणः ॥ यत्र प्रविष्टा विषयाः परेरिता नदीप्रवाहा इव वारिराशौ
    । लिनन्ति सन्मात्रतया न विक्रियां उत्पादयन्त्येष यतिर्विमुक्तः ॥ ॥ विज्ञातब्रह्मतत्त्वस्य यथापूर्वं
    न संसृतिः । अस्ति चेन्न स विज्ञातब्रह्मभावो बहिर्मुखः ॥ ॥ प्राचीनवासनावेगादसौ संसरतीति चेत् । न सदेकत्वविज्ञानान्मन्दी
    भवति वासना ॥ ॥ अत्यन्तकामुकस्यापि वृत्तिः कुण्ठति मातरि । तथैव ब्रह्मणि ज्ञाते पूर्णानन्दे मनीषिणः
    ॥ ॥ निदिध्यासनशीलस्य बाह्यप्रत्यय ईक्ष्यते । ब्रवीति श्रुतिरेतस्य प्रारब्धं फलदर्शनात् ॥ ॥ सुखाद्यनुभवो
    यावत्तावत्प्रारब्धमिष्यते । फलोदयः क्रियापूर्वो निष्क्रियो न हि कुत्रचित् ॥ ॥ अहं ब्रह्मेति विज्ञानात्कल्पकोटिशतार्जितम्
    । सञ्चितं विलयं याति प्रबोधात्स्वप्नकर्मवत् ॥ ॥ यत्कृतं स्वप्नवेलायां पुण्यं वा पापमुल्बणम् । सुप्तोत्थितस्य
    किन्तत्स्यात्स्वर्गाय नरकाय वा ॥ ॥ स्वमसङ्गमुदासीनं परिज्ञाय नभो यथा । न श्लिष्यति च यत्किञ्चित्कदाचिद्भाविकर्मभिः
    ॥ श्लिष्यते यतिः किञ्चित् न नभो घटयोगेन सुरागन्धेन लिप्यते । तथात्मोपाधियोगेन तद्धर्मैर्नैव लिप्यते
    ॥ ॥ ज्ञानोदयात्पुरारब्धं कर्मज्ञानान्न नश्यति । अदत्वा स्वफलं लक्ष्यमुद्दिश्योत्सृष्टबाणवत् ॥ ॥ व्याघ्रबुद्ध्या
    विनिर्मुक्तो बाणः पश्चात्तु गोमतौ । न तिष्ठति छिनत्येव लक्ष्यं वेगेन निर्भरम् ॥ ॥ प्रारब्धं बलवत्तरं
    खलु विदां भोगेन तस्य क्षयः सम्यग्ज्ञानहुताशनेन विलयः प्राक्सञ्चितागामिनाम् । ब्रह्मात्मैक्यमवेक्ष्य
    तन्मयतया ये सर्वदा संस्थिताः तेषां तत्त्रितयं नहि क्वचिदपि ब्रह्मैव ते निर्गुणम् ॥ ॥ उपाधितादात्म्यविहीनकेवल
    ब्रह्मात्मनैवात्मनि तिष्ठतो मुनेः । प्रारब्धसद्भावकथा न युक्ता स्वप्नार्थसम्बन्धकथेव जाग्रतः ॥ ॥ न
    हि प्रबुद्धः प्रतिभासदेहे देहोपयोगिन्यपि च प्रपञ्चे । करोत्यहन्तां ममतामिदन्तां किन्तु स्वयं तिष्ठति
    जागरेण ॥ ॥ न तस्य मिथ्यार्थसमर्थनेच्छा न सङ्ग्रहस्तज्जगतोऽपि दृष्टः । तत्रानुवृत्तिर्यदि चेन्मृषार्थे
    न निद्रया मुक्त इतीष्यते ध्रुवम् ॥ ॥ तद्वत्परे ब्रह्मणि वर्तमानः सदात्मना तिष्ठति नान्यदीक्षते । स्मृतिर्यथा
    स्वप्नविलोकितार्थे तथा विदः प्राशनमोचनादौ ॥ ॥ कर्मणा निर्मितो देहः प्रारब्धं तस्य कल्प्यताम् । नानादेरात्मनो
    युक्तं नैवात्मा कर्मनिर्मितः ॥ ॥ अजो नित्यः शाश्वत इति ब्रूते श्रुतिरमोघवाक् । अजो नित्य इति ब्रूते
    श्रुतिरेषा त्वमोघवाक् तदात्मना तिष्ठतोऽस्य कुतः प्रारब्धकल्पना ॥ ॥ प्रारब्धं सिध्यति तदा यदा देहात्मना
    स्थितिः । देहात्मभावो नैवेष्टः प्रारब्धं त्यज्यतामतः ॥ ॥ शरीरस्यापि प्रारब्धकल्पना भ्रान्तिरेव हि
    । अध्यस्तस्य कुतः सत्त्वमसत्यस्य कुतो जनिः । अजातस्य कुतो नाशः प्रारब्धमसतः कुतः ॥ ॥ ज्ञानेनाज्ञानकार्यस्य
    समूलस्य लयो यदि । तिष्ठत्ययं कथं देह इति शङ्कावतो जडान् ॥ ॥ समाधातुं बाह्यदृष्ट्या प्रारब्धं वदति
    श्रुतिः । न तु देहादिसत्यत्वबोधनाय विपश्चिताम् । यतः श्रुतेरभिप्रायः परमार्थैकगोचरः ॥ ॥ परिपूर्णमनाद्यन्तमप्रमेयमविक्रियम्
    । एकमेवाद्वयं ब्रह्म नेह नानास्ति किञ्चन ॥ ॥ सद्घनं चिद्घनं नित्यमानन्दघनमक्रियम् । एकमेवाद्वयं ब्रह्म
    नेह नानास्ति किञ्चन ॥ ॥ प्रत्यगेकरसं पूर्णमनन्तं सर्वतोमुखम् । एकमेवाद्वयं ब्रह्म नेह नानास्ति किञ्चन
    ॥ ॥ अहेयमनुपादेयमनादेयमनाश्रयम् । मनाधेयमना एकमेवाद्वयं ब्रह्म नेह नानास्ति किञ्चन ॥ ॥ निर्गुणं निष्कलं
    सूक्ष्मं निर्विकल्पं निरञ्जनम् । एकमेवाद्वयं ब्रह्म नेह नानास्ति किञ्चन ॥ ॥ अनिरूप्य स्वरूपं यन्मनोवाचामगोचरम्
    । एकमेवाद्वयं ब्रह्म नेह नानास्ति किञ्चन ॥ ॥ सत्समृद्धं स्वतःसिद्धं शुद्धं बुद्धमनीदृशम् । एकमेवाद्वयं
    ब्रह्म नेह नानास्ति किञ्चन ॥ ॥ निरस्तरागा विनिरस्तभोगाः शान्ताः सुदान्ता यतयो महान्तः । विज्ञाय तत्त्वं
    परमेतदन्ते प्राप्ताः परां निर्वृतिमात्मयोगात् ॥ ॥ भवानपीदं परतत्त्वमात्मनः स्वरूपमानन्दघनं विचार्य
    । विधूय मोहं स्वमनःप्रकल्पितं मुक्तः कृतार्थो भवतु प्रबुद्धः ॥ ॥ समाधिना साधुविनिश्चलात्मना पश्यात्मतत्त्वं
    स्फुटबोधचक्षुषा । निःसंशयं सम्यगवेक्षितश्चे च्छ्रुतः पदार्थो न पुनर्विकल्प्यते ॥ स्वस्याविद्याबन्धसम्बन्धमोक्षा
    त्सत्यज्ञानानन्दरूपात्मलब्धौ । शास्त्रं युक्तिर्देशिकोक्तिः प्रमाणं चान्तःसिद्धा स्वानुभूतिः प्रमाणम्
    ॥ ॥ बन्धो मोक्षश्च तृप्तिश्च चिन्ताऽऽरोग्यक्षुधादयः । स्वेनैव वेद्या यज्ज्ञानं परेषामानुमानिकम् ॥
    ॥ तटस्थिता बोधयन्ति गुरवः श्रुतयो यथा । प्रज्ञयैव तरेद्विद्वानीश्वरानुगृहीतया ॥ ॥ स्वानुभूत्या स्वयं
    ज्ञात्वा स्वमात्मानमखण्डितम् । संसिद्धः सम्मुखं तिष्ठेन्निर्विकल्पात्मनाऽऽत्मनि ॥ वेदान्तसिद्धान्तनिरुक्तिरेषा
    ब्रह्मैव जीवः सकलं जगच्च । अखण्डरूपस्थितिरेव मोक्षो ब्रह्माद्वितीये श्रुतयः प्रमाणम् ॥ इति गुरुवचनाच्छ्रुतिप्रमाणात्
    परमवगम्य सतत्त्वमात्मयुक्त्या । प्रशमितकरणः समाहितात्मा क्वचिदचलाकृतिरात्मनिष्ठतोऽभूत् ॥ किञ्चित्कालं
    समाधाय परे ब्रह्मणि मानसम् । उत्थाय परमानन्दादिदं वचनमब्रवीत् ॥ बुद्धिर्विनष्टा गलिता प्रवृत्तिः ब्रह्मात्मनोरेकतयाऽधिगत्या
    । इदं न जानेऽप्यनिदं न जाने किं वा कियद्वा सुखमस्त्यपारम् ॥ वाचा वक्तुमशक्यमेव मनसा मन्तुं न वा शक्यते
    स्वानन्दामृतपूरपूरितपरब्रह्माम्बुधेर्वैभवम् । अम्भोराशिविशीर्णवार्षिकशिलाभावं भजन्मे मनो यस्यांशांशलवे
    विलीनमधुनाऽऽनन्दात्मना निर्वृतम् ॥ ॥ क्व गतं केन वा नीतं कुत्र लीनमिदं जगत् । अधुनैव मया दृष्टं नास्ति
    किं महदद्भुतम् ॥ ॥ किं हेयं किमुपादेयं किमन्यत्किं विलक्षणम् । अखण्डानन्दपीयूषपूर्णे ब्रह्ममहार्णवे
    ॥ ॥ न किञ्चिदत्र पश्यामि न शऋणोमि न वेद्म्यहम् । स्वात्मनैव सदानन्दरूपेणास्मि विलक्षणः ॥ ॥ नमो नमस्ते
    गुरवे महात्मने विमुक्तसङ्गाय सदुत्तमाय । नित्याद्वयानन्दरसस्वरूपिणे भूम्ने सदाऽपारदयाम्बुधाम्ने ॥
    ॥ यत्कटाक्षशशिसान्द्रचन्द्रिका पातधूतभवतापजश्रमः । प्राप्तवानहमखण्डवैभवा नन्दमात्मपदमक्षयं क्षणात्
    ॥ ॥ धन्योऽहं कृतकृत्योऽहं विमुक्तोऽहं भवग्रहात् । नित्यानन्दस्वरूपोऽहं पूर्णोऽहं त्वदनुग्रहात् ॥ ॥
    असङ्गोऽहमनङ्गोऽहमलिङ्गोऽहमभङ्गुरः । प्रशान्तोऽहमनन्तोऽहममलोऽहं चिरन्तनः ॥ अकर्ताहमभोक्ताहमविकारोऽहमक्रियः
    । शुद्धबोधस्वरूपोऽहं केवलोऽहं सदाशिवः ॥ ॥ द्रष्टुः श्रोतुर्वक्तुः कर्तुर्भोक्तुर्विभिन्न एवाहम् ।
    नित्यनिरन्तरनिष्क्रियनिःसीमासङ्गपूर्णबोधात्मा ॥ ॥ नाहमिदं नाहमदोऽप्युभयोरवभासकं परं शुद्धम् । बाह्याभ्यन्तरशून्यं
    पूर्णं ब्रह्माद्वितीयमेवाहम् ॥ ॥ निरुपममनादितत्त्वं त्वमहमिदमद इति कल्पनादूरम् । नित्यानन्दैकरसं सत्यं
    ब्रह्माद्वितीयमेवाहम् ॥ ॥ नारायणोऽहं नरकान्तकोऽहं पुरान्तकोऽहं पुरुषोऽहमीशः । अखण्डबोधोऽहमशेषसाक्षी
    निरीश्वरोऽहं निरहं च निर्ममः ॥ ॥ सर्वेषु भूतेष्वहमेव संस्थितो ज्ञानात्मनाऽन्तर्बहिराश्रयः सन् । भोक्ता
    च भोग्यं स्वयमेव सर्वं यद्यत्पृथग्दृष्टमिदन्तया पुरा ॥ ॥ मय्यखण्डसुखाम्भोधौ बहुधा विश्ववीचयः । उत्पद्यन्ते
    विलीयन्ते मायामारुतविभ्रमात् ॥ ॥ स्थुलादिभावा मयि कल्पिता भ्रमा दारोपितानुस्फुरणेन लोकैः । काले यथा
    कल्पकवत्सराय णर्त्वादयो निष्कलनिर्विकल्पे ॥ ॥ आरोपितं नाश्रयदूषकं भवेत् कदापि मूढैरतिदोषदूषितैः ।
    मूढैर्मति नार्द्रीकरोत्यूषरभूमिभागं मरीचिकावारि महाप्रवाहः ॥ ॥ आकाशवल्लेपविदूरगोऽहं आदित्यवद्भास्यविलक्षणोऽहम्
    । अहार्यवन्नित्यविनिश्चलोऽहं अम्भोधिवत्पारविवर्जितोऽहम् ॥ ॥ न मे देहेन सम्बन्धो मेघेनेव विहायसः ।
    अतः कुतो मे तद्धर्मा जाग्रत्स्वप्नसुषुप्तयः ॥ ॥ उपाधिरायाति स एव गच्छति स एव कर्माणि करोति भुङ्क्ते
    । स एव जीर्यन् म्रियते सदाहं कुलाद्रिवन्निश्चल एव संस्थितः ॥ ॥ न मे प्रवृत्तिर्न च मे निवृत्तिः सदैकरूपस्य
    निरंशकस्य । एकात्मको यो निविडो निरन्तरो व्योमेव पूर्णः स कथं नु चेष्टते ॥ ॥ पुण्यानि पापानि निरिन्द्रियस्य
    निश्चेतसो निर्विकृतेर्निराकृतेः । कुतो ममाखण्डसुखानुभूतेः ब्रूते ह्यनन्वागतमित्यपि श्रुतिः ॥ ॥ छायया
    स्पृष्टमुष्णं वा शीतं वा सुष्ठु दुःष्ठु वा । न स्पृशत्येव यत्किञ्चित्पुरुषं तद्विलक्षणम् ॥ ॥ न साक्षिणं
    साक्ष्यधर्माः संस्पृशन्ति विलक्षणम् । अविकारमुदासीनं गृहधर्माः प्रदीपवत् । देहेन्द्रियमनोधर्मा नैवात्मानं
    स्पृशन्त्यहो ॥ ॥ एक्ष्त्र रवेर्यथा कर्मणि साक्षिभावो वह्नेर्यथा दाहनियामकत्वम् । रज्जोर्यथाऽऽरोपितवस्तुसङ्गः
    तथैव कूटस्थचिदात्मनो मे ॥ ॥ कर्तापि वा कारयितापि नाहं भोक्तापि वा भोजयितापि नाहम् । द्रष्टापि वा दर्शयितापि
    नाहं सोऽहं स्वयञ्ज्योतिरनीदृगात्मा ॥ ॥ चलत्युपाधौ प्रतिबिम्बलौल्य मौपाधिकं मूढधियो नयन्ति । स्वबिम्बभूतं
    रविवद्विनिष्क्रियं कर्तास्मि भोक्तास्मि हतोऽस्मि हेति ॥ ॥ जले वापि स्थले वापि लुठत्वेष जडात्मकः ।
    नाहं विलिप्ये तद्धर्मैर्घटधर्मैर्नभो यथा ॥ ॥ कर्तृत्वभोक्तृत्वखलत्वमत्तता जडत्वबद्धत्वविमुक्ततादयः
    । बुद्धेर्विकल्पा न तु सन्ति वस्तुतः स्वस्मिन्परे ब्रह्मणि केवलेऽद्वये ॥ ॥ सन्तु विकाराः प्रकृतेर्दशधा
    शतधा सहस्रधा वापि । किं मेऽसङ्गचितस्तैर्न घनः क्वचिदम्बरं स्पृशति ॥ तैः किं मेऽसङ्गचितेर्न ह्यम्बुदडम्बरोऽम्बरं
    अव्यक्तादिस्थूलपर्यन्तमेतत् विश्वं यत्राभासमात्रं प्रतीतम् । व्योमप्रख्यं सूक्ष्ममाद्यन्तहीनं ब्रह्माद्वैतं
    यत्तदेवाहमस्मि ॥ ॥ सर्वाधारं सर्ववस्तुप्रकाशं सर्वाकारं सर्वगं सर्वशून्यम् । नित्यं शुद्धं निश्चलं
    निर्विकल्पं ब्रह्माद्वैतं यत्तदेवाहमस्मि ॥ ॥ यत्प्रत्यस्ताशेषमायाविशेषं प्रत्यग्रूपं प्रत्ययागम्यमानम्
    । सत्यज्ञानानन्तमानन्दरूपं ब्रह्माद्वैतं यत्तदेवाहमस्मि ॥ ॥ निष्क्रियोऽस्म्यविकारोऽस्मि निष्कलोऽस्मि
    निराकृतिः । निर्विकल्पोऽस्मि नित्योऽस्मि निरालम्बोऽस्मि निर्द्वयः ॥ ॥ सर्वात्मकोऽहं सर्वोऽहं सर्वातीतोऽहमद्वयः
    । केवलाखण्डबोधोऽहमानन्दोऽहं निरन्तरः ॥ ॥ स्वाराज्यसाम्राज्यविभूतिरेषा भवत्कृपाश्रीमहिमप्रसादात् ।
    प्राप्ता मया श्रीगुरवे महात्मने नमो नमस्तेऽस्तु पुनर्नमोऽस्तु ॥ ॥ महास्वप्ने मायाकृतजनिजरामृत्युगहने
    भ्रमन्तं क्लिश्यन्तं बहुलतरतापैरनुदिनम् । अहङ्कारव्याघ्रव्यथितमिममत्यन्तकृपया प्रबोध्य प्रस्वापात्परमवितवान्मामसि
    गुरो ॥ ॥ नमस्तस्मै सदैकस्मै कस्मैचिन्महसे नमः । सदेकस्मै नमश्चिन्महसे मुहुः यदेतद्विश्वरूपेण राजते
    गुरुराज ते ॥ ॥ इति नतमवलोक्य शिष्यवर्यं समधिगतात्मसुखं प्रबुद्धतत्त्वम् । प्रमुदितहृदयं स देशिकेन्द्रः
    पुनरिदमाह वचः परं महात्मा ॥ ॥ ब्रह्मप्रत्ययसन्ततिर्जगदतो ब्रह्मैव तत्सर्वतः पश्याध्यात्मदृशा प्रशान्तमनसा
    सर्वास्ववस्थास्वपि । रूपादन्यदवेक्षितं किमभितश्चक्षुष्मतां दृश्यते तद्वद्ब्रह्मविदः सतः किमपरं बुद्धेर्विहारास्पदम्
    ॥ ॥ कस्तां परानन्दरसानुभूति मृत्सृज्य शून्येषु रमेत विद्वान् । मुत्सृज्य चन्द्रे महाह्लादिनि दीप्यमाने
    चित्रेन्दुमालोकयितुं क इच्छेत् ॥ ॥ असत्पदार्थानुभवेन किञ्चिन् न ह्यस्ति तृप्तिर्न च दुःखहानिः । तदद्वयानन्दरसानुभूत्या
    तृप्तः सुखं तिष्ठ सदात्मनिष्ठया ॥ ॥ स्वमेव सर्वथा पश्यन्मन्यमानः स्वमद्वयम् । स्वानन्दमनुभुञ्जानः
    कालं नय महामते ॥ ॥ अखण्डबोधात्मनि निर्विकल्पे विकल्पनं व्योम्नि पुरप्रकल्पनम् । तदद्वयानन्दमयात्मना
    सदा शान्तिं परामेत्य भजस्व मौनम् ॥ ॥ तूष्णीमवस्था परमोपशान्तिः बुद्धेरसत्कल्पविकल्पहेतोः । ब्रह्मात्मनो
    ब्रह्मविदो महात्मनो यत्राद्वयानन्दसुखं निरन्तरम् ॥ ॥ नास्ति निर्वासनान्मौनात्परं सुखकृदुत्तमम् । विज्ञातात्मस्वरूपस्य
    स्वानन्दरसपायिनः ॥ ॥ गच्छंस्तिष्ठन्नुपविशञ्छयानो वाऽन्यथापि वा । यथेच्छया वसेद्विद्वानात्मारामः सदा
    मुनिः ॥ ॥ न देशकालासनदिग्यमादि लक्ष्याद्यपेक्षाऽप्रतिबद्धवृत्तेः । प्रतिबद्ध संसिद्धतत्त्वस्य महात्मनोऽस्ति
    स्ववेदने का नियमाद्यवस्था ॥ ॥ घटोऽयमिति विज्ञातुं नियमः कोऽन्ववेक्षते । विना प्रमाणसुष्ठुत्वं यस्मिन्सति
    पदार्थधीः ॥ ॥ अयमात्मा नित्यसिद्धः प्रमाणे सति भासते । न देशं नापि वा कालं न शुद्धिं वाप्यपेक्षते
    ॥ ॥ देवदत्तोऽहमित्येतद्विज्ञानं निरपेक्षकम् । तद्वद्ब्रह्मविदोऽप्यस्य ब्रह्माहमिति वेदनम् ॥ ॥ भानुनेव
    जगत्सर्वं भासते यस्य तेजसा । अनात्मकमसत्तुच्छं किं नु तस्यावभासकम् ॥ ॥ वेदशास्त्रपुराणानि भूतानि सकलान्यपि
    । येनार्थवन्ति तं किन्नु विज्ञातारं प्रकाशयेत् ॥ ॥ एष स्वयञ्ज्योतिरनन्तशक्तिः आत्माऽप्रमेयः सकलानुभूतिः
    । यमेव विज्ञाय विमुक्तबन्धो जयत्ययं ब्रह्मविदुत्तमोत्तमः ॥ ॥ न खिद्यते नो विषयैः प्रमोदते न सज्जते
    नापि विरज्यते च । स्वस्मिन्सदा क्रीडति नन्दति स्वयं निरन्तरानन्दरसेन तृप्तः ॥ ॥ क्षुधां देहव्यथां
    त्यक्त्वा बालः क्रीडति वस्तुनिः । तथैव विद्वान् रमते निर्ममो निरहं सुखी ॥ ॥ चिन्ताशून्यमदैन्यभैक्षमशनं
    पानं सरिद्वारिषु स्वातन्त्र्येण निरङ्कुशा स्थितिरभीर्निद्रा श्मशाने वने । वस्त्रं क्षालनशोषणादिरहितं
    दिग्वास्तु शय्या मही सञ्चारो निगमान्तवीथिषु विदां क्रीडा परे ब्रह्मणि ॥ ॥ विमानमालम्ब्य शरीरमेतद्
    भुनक्त्यशेषान्विषयानुपस्थितान् । परेच्छया बालवदात्मवेत्ता योऽव्यक्तलिङ्गोऽननुषक्तबाह्यः ॥ ॥ दिगम्बरो
    वापि च साम्बरो वा त्वगम्बरो वापि चिदम्बरस्थः । उन्मत्तवद्वापि च बालवद्वा पिशाचवद्वापि चरत्यवन्याम्
    ॥ ॥ कामान्निष्कामरूपी संश्चरत्येकचरो मुनिः । स्वात्मनैव सदा तुष्टः स्वयं सर्वात्मना स्थितः ॥ ॥ क्वचिन्मूढो
    विद्वान् क्वचिदपि महाराजविभवः क्वचिद्भ्रान्तः सौम्यः क्वचिदजगराचारकलितः । क्वचित्पात्रीभूतः क्वचिदवमतः
    क्वाप्यविदितः चरत्येवं प्राज्ञः सततपरमानन्दसुखितः ॥ ॥ निर्धनोऽपि सदा तुष्टोऽप्यसहायो महाबलः । नित्यतृप्तोऽप्यभुञ्जानोऽप्यसमः
    समदर्शनः ॥ ॥ अपि कुर्वन्नकुर्वाणश्चाभोक्ता फलभोग्यपि । शरीर्यप्यशरीर्येष परिच्छिन्नोऽपि सर्वगः ॥ ॥
    अशरीरं सदा सन्तमिमं ब्रह्मविदं क्वचित् । प्रियाप्रिये न स्पृशतस्तथैव च शुभाशुभे ॥ ॥ स्थूलादिसम्बन्धवतोऽभिमानिनः
    सुखं च दुःखं च शुभाशुभे च । विध्वस्तबन्धस्य सदात्मनो मुनेः कुतः शुभं वाऽप्यशुभं फलं वा ॥ ॥ तमसा ग्रस्तवद्भानादग्रस्तोऽपि
    रविर्जनैः । ग्रस्त इत्युच्यते भ्रान्त्यां ह्यज्ञात्वा वस्तुलक्षणम् ॥ तद्वद्देहादिबन्धेभ्यो विमुक्तं
    ब्रह्मवित्तमम् । पश्यन्ति देहिवन्मूढाः शरीराभासदर्शनात् ॥ ॥ अहिर्निर्ल्वयनीं वायं मुक्त्वा देहं तु
    तिष्ठति । इतस्ततश्चाल्यमानो यत्किञ्चित्प्राणवायुना ॥ ॥ स्त्रोतसा नीयते दारु यथा निम्नोन्नतस्थलम् ।
    दैवेन नीयते देहो यथाकालोपभुक्तिषु ॥ ॥ प्रारब्धकर्मपरिकल्पितवासनाभिः संसारिवच्चरति भुक्तिषु मुक्तदेहः
    । सिद्धः स्वयं वसति साक्षिवदत्र तूष्णीं चक्रस्य मूलमिव कल्पविकल्पशून्यः ॥ ॥ नैवेन्द्रियाणि विषयेषु
    नियुङ्क्त एष नैवापयुङ्क्त उपदर्शनलक्षणस्थः । नैव क्रियाफलमपीषदवेक्षते स स्वानन्दसान्द्ररसपानसुमत्तचित्तः
    ॥ ॥ लक्ष्यालक्ष्यगतिं त्यक्त्वा यस्तिष्ठेत्केवलात्मना । शिव एव स्वयं साक्षादयं ब्रह्मविदुत्तमः ॥ ॥
    जीवन्नेव सदा मुक्तः कृतार्थो ब्रह्मवित्तमः । उपाधिनाशाद्ब्रह्मैव सन् ब्रह्माप्येति निर्द्वयम् ॥ ॥
    शैलूषो वेषसद्भावाभावयोश्च यथा पुमान् । तथैव ब्रह्मविच्छ्रेष्ठः सदा ब्रह्मैव नापरः ॥ ॥ यत्र क्वापि
    विशीर्णं सत्पर्णमिव तरोर्वपुः पततात् । ब्रह्मीभूतस्य यतेः प्रागेव तच्चिदग्निना दग्धम् ॥ ॥ सदात्मनि
    ब्रह्मणि तिष्ठतो मुनेः पूर्णाऽद्वयानन्दमयात्मना सदा । न देशकालाद्युचितप्रतीक्षा त्वङ्मांसविट्पिण्डविसर्जनाय
    ॥ ॥ देहस्य मोक्षो नो मोक्षो न दण्डस्य कमण्डलोः । अविद्याहृदयग्रन्थिमोक्षो मोक्षो यतस्ततः ॥ ॥ कुल्यायामथ
    नद्यां वा शिवक्षेत्रेऽपि चत्वरे । पर्णं पतति चेत्तेन तरोः किं नु शुभाशुभम् ॥ ॥ पत्रस्य पुष्पस्य फलस्य
    नाशवद् देहेन्द्रियप्राणधियां विनाशः । नैवात्मनः स्वस्य सदात्मकस्या नन्दाकृतेर्वृक्षवदस्ति चैषः ॥ प्रज्ञानघन
    इत्यात्मलक्षणं सत्यसूचकम् । अनूद्यौपाधिकस्यैव कथयन्ति विनाशनम् ॥ ॥ अविनाशी वा अरेऽयमात्मेति श्रुतिरात्मनः
    । प्रब्रवीत्यविनाशित्वं विनश्यत्सु विकारिषु ॥ ॥ पाषाणवृक्षतृणधान्यकडङ्कराद्या दग्धा भवन्ति हि मृदेव
    यथा तथैव । देहेन्द्रियासुमन आदि समस्तदृश्यं ज्ञानाग्निदग्धमुपयाति परात्मभावम् ॥ ॥ विलक्षणं यथा ध्वान्तं
    लीयते भानुतेजसि । तथैव सकलं दृश्यं ब्रह्मणि प्रविलीयते ॥ ॥ घटे नष्टे यथा व्योम व्योमैव भवति स्फुटम्
    । तथैवोपाधिविलये ब्रह्मैव ब्रह्मवित्स्वयम् ॥ ॥ क्षीरं क्षीरे यथा क्षिप्तं तैलं तैले जलं जले । संयुक्तमेकतां
    याति तथाऽऽत्मन्यात्मविन्मुनिः ॥ ॥ एवं विदेहकैवल्यं सन्मात्रत्वमखण्डितम् । ब्रह्मभावं प्रपद्यैष यतिर्नावर्तते
    पुनः ॥ ॥ सदात्मैकत्वविज्ञानदग्धाविद्यादिवर्ष्मणः । अमुष्य ब्रह्मभूतत्वाद् ब्रह्मणः कुत उद्भवः ॥ ॥
    मायाक्लृप्तौ बन्धमोक्षौ न स्तः स्वात्मनि वस्तुतः । यथा रज्जौ निष्क्रियायां सर्पाभासविनिर्गमौ ॥ ॥ आवृतेः
    सदसत्त्वाभ्यां वक्तव्ये बन्धमोक्षणे । नावृतिर्ब्रह्मणः काचिदन्याभावादनावृतम् । यद्यस्त्यद्वैतहानिः
    स्याद् द्वैतं नो सहते श्रुतिः ॥ ॥ बन्धञ्च मोक्षञ्च मृषैव मूढा बुद्धेर्गुणं वस्तुनि कल्पयन्ति । दृगावृतिं
    मेघकृतां यथा रवौ यतोऽद्वयाऽसङ्गचिदेतदक्षरम् ॥ अस्तीति प्रत्ययो यश्च यश्च नास्तीति वस्तुनि । बुद्धेरेव
    गुणावेतौ न तु नित्यस्य वस्तुनः ॥ ॥ अतस्तौ मायया क्लृप्तौ बन्धमोक्षौ न चात्मनि । निष्कले निष्क्रिये
    शान्ते निरवद्ये निरञ्जने । अद्वितीये परे तत्त्वे व्योमवत्कल्पना कुतः ॥ ॥ न निरोधो न चोत्पत्तिर्न बद्धो
    न च साधकः । न मुमुक्षुर्न वै मुक्त इत्येषा परमार्थता ॥ ॥ सकलनिगमचूडास्वान्तसिद्धान्तरूपं परमिदमतिगुह्यं
    दर्शितं ते मयाद्य । अपगतकलिदोषं कामनिर्मुक्तबुद्धिं स्वसुतवदसकृत्त्वां भावयित्वा मुमुक्षुम् ॥ ॥ इति
    श्रुत्वा गुरोर्वाक्यं प्रश्रयेण कृतानतिः । स तेन समनुज्ञातो ययौ निर्मुक्तबन्धनः ॥ ॥ गुरुरेव सदानन्दसिन्धौ
    निर्मग्नमानसः । पावयन्वसुधां सर्वां विचचार निरन्तरः ॥ ॥ इत्याचार्यस्य शिष्यस्य संवादेनात्मलक्षणम्
    । निरूपितं मुमुक्षूणां सुखबोधोपपत्तये ॥ ॥ हितमिदमुपदेशमाद्रियन्तां विहितनिरस्तसमस्तचित्तदोषाः । भवसुखविरताः
    प्रशान्तचित्ताः श्रुतिरसिका यतयो मुमुक्षवो ये ॥ ॥ संसाराध्वनि तापभानुकिरणप्रोद्भूतदाहव्यथा खिन्नानां
    जलकाङ्क्षया मरुभुवि भ्रान्त्या परिभ्राम्यताम् । अत्यासन्नसुधाम्बुधिं सुखकरं ब्रह्माद्वयं दर्शय त्येषा
    शङ्करभारती विजयते निर्वाणसन्दायिनी ॥ ॥ ॥ इति शङ्कराचार्यविरचितं विवेकचूडामणिः ॥ ॥ ॐ तत्सत् ॥
