id: sri-madhvacharya-kruta-dwadasha-stotra-5
category: stotram
name:
  english: Sri Madhvacharya Kruta Dwadasha Stotra - 5
content:
  english: atha pancamastotram vasudevaparimeyasudhaman shuddhasadodita sundarikanta | dharadharadharana
    vedhuradhartah saudhritididhitivedhrividhatah || || adhikabandham randhaya bodha cchindhipidhanam
    bandhuramaddha | keshava keshava shasaka vande pashadhararcita shuraparesha vande karanakarana purna
    varenya | madhava madhava sadhaka vande badhaka bodhaka shuddha samadhe || || govinda govinda purandara
    vande skanda sanandana vandita pada | vishnu srijishnu grasishnu vivande krishna sadushna vadhishna
    sudhrishno || || vishno srijishno grasishno vivande krishna sadushnavadhishno sudhrishno madhusudana
    danavasadana vande daivatamodana vedita pada | trivikrama nishkrama vikrama vande sukrama sankramahunkritavaktra
    || sankrama sukrama hunkritavaktra vamana vamana bhamana vande samana simana samana sano | shridhara
    shridhara shandhara vande bhudhara vardhara kandharadharin || || hrishikesha sukesha paresha vivande
    sharanesha kalesha balesha sukhesha | padmanabha shubhodbhava vande sambhritalokabharabhara bhure
    | damodara duratarantara vande daritaparaka para || anandasutirtha munindrakrita harigitiriyam paramadaratah
    | paralokavilokana suryanibha haribhakti vivardhana shaundatama || || iti shrimadanandatirthabhagavatpadacarya
    viracitam dvadashastotreshu pancamastotram sampurnam
  devanagari: अथ पञ्चमस्तोत्रम् वासुदेवापरिमेयसुधामन् शुद्धसदोदित सुन्दरीकान्त । धराधरधारण वेधुरधर्तः
    सौधृतिदीधितिवेधृविधातः ॥ ॥ अधिकबन्धं रन्धय बोधा च्छिन्धिपिधानं बन्धुरमद्धा । केशव केशव शासक वन्दे
    पाशधरार्चित शूरपरेश वन्दे कारणकारण पूर्ण वरेण्य । माधव माधव साधक वन्दे बाधक बोधक शुद्ध समाधे ॥ ॥ गोविन्द
    गोविन्द पुरन्दर वन्दे स्कन्द सनन्दन वन्दित पाद । विष्णु सृजिष्णु ग्रसिष्णु विवन्दे कृष्ण सदुष्ण वधिष्ण
    सुधृष्णो ॥ ॥ विष्णो सृजिष्णो ग्रसिष्णो विवन्दे कृष्ण सदुष्णवधिष्णो सुधृष्णो मधुसूदन दानवसादन वन्दे
    दैवतमोदन वेदित पाद । त्रिविक्रम निष्क्रम विक्रम वन्दे सुक्रम सङ्क्रमहुङ्कृतवक्त्र ॥ सङ्क्रम सुक्रम
    हुङ्कृतवक्त्र वामन वामन भामन वन्दे सामन सीमन सामन सानो । श्रीधर श्रीधर शन्धर वन्दे भूधर वार्धर कन्धरधारिन्
    ॥ ॥ हृषीकेश सुकेश परेश विवन्दे शरणेश कलेश बलेश सुखेश । पद्मनाभ शुभोद्भव वन्दे सम्भृतलोकभराभर भूरे
    । दामोदर दूरतरान्तर वन्दे दारितपारक पार ॥ आनन्दसुतीर्थ मुनीन्द्रकृता हरिगीतिरियं परमादरतः । परलोकविलोकन
    सूर्यनिभा हरिभक्ति विवर्धन शौण्डतमा ॥ ॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य विरचितं द्वादशस्तोत्रेषु
    पञ्चमस्तोत्रं सम्पूर्णम्
