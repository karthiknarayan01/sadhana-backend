    ते परद्रोह रत पापौघमय तव तनु अयं। तुम्हहू दियो निज धाम राम नमामि ब्रह्म निरामयम् ॥ दो अहह नाथ रघुनाथ
    सम कृपासिन्धु नहिं आन। जोगि बृन्द दुर्लभ गति तोहि दीन्हि भगवान ॥ ॥ मन्दोदरी बचन सुनि काना। सुर मुनि
    सिद्ध सबन्हि सुख माना ॥ अज महेस नारद सनकादी। जे मुनिबर परमारथबादी ॥ भरि लोचन रघुपतिहि निहारी। प्रेम
    मगन सब भे सुखारी ॥ रुदन करत देखीं सब नारी। गयु बिभीषनु मन दुख भारी ॥ बन्धु दसा बिलोकि दुख कीन्हा।
    तब प्रभु अनुजहि आयसु दीन्हा ॥ लछिमन तेहि बहु बिधि समुझायो। बहुरि बिभीषन प्रभु पहिं आयो ॥ कृपादृष्टि
    प्रभु ताहि बिलोका। करहु क्रिया परिहरि सब सोका ॥ कीन्हि क्रिया प्रभु आयसु मानी। बिधिवत देस काल जियँ
    जानी ॥ दो मन्दोदरी आदि सब देइ तिलाञ्जलि ताहि। भवन गी रघुपति गुन गन बरनत मन माहि ॥ ॥ आइ बिभीषन पुनि
    सिरु नायो। कृपासिन्धु तब अनुज बोलायो ॥ तुम्ह कपीस अङ्गद नल नीला। जामवन्त मारुति नयसीला ॥ सब मिलि जाहु
    बिभीषन साथा। सारेहु तिलक कहेउ रघुनाथा ॥ पिता बचन मैं नगर न आवुँ। आपु सरिस कपि अनुज पठावुँ ॥ तुरत चले
    कपि सुनि प्रभु बचना। कीन्ही जाइ तिलक की रचना ॥ सादर सिंहासन बैठारी। तिलक सारि अस्तुति अनुसारी ॥ जोरि
    पानि सबहीं सिर नाए। सहित बिभीषन प्रभु पहिं आए ॥ तब रघुबीर बोलि कपि लीन्हे। कहि प्रिय बचन सुखी सब कीन्हे
    ॥ छं किए सुखी कहि बानी सुधा सम बल तुम्हारें रिपु हयो। पायो बिभीषन राज तिहुँ पुर जसु तुम्हारो नित नयो
    ॥ मोहि सहित सुभ कीरति तुम्हारी परम प्रीति जो गाइहैं। संसार सिन्धु अपार पार प्रयास बिनु नर पाइहैम्
    ॥ दो प्रभु के बचन श्रवन सुनि नहिं अघाहिं कपि पुञ्ज। बार बार सिर नावहिं गहहिं सकल पद कञ्ज ॥ ॥ पुनि
    प्रभु बोलि लियु हनुमाना। लङ्का जाहु कहेउ भगवाना ॥ समाचार जानकिहि सुनावहु। तासु कुसल लै तुम्ह चलि आवहु
    ॥ तब हनुमन्त नगर महुँ आए। सुनि निसिचरी निसाचर धाए ॥ बहु प्रकार तिन्ह पूजा कीन्ही। जनकसुता देखाइ पुनि
    दीन्ही ॥ दूरहि ते प्रनाम कपि कीन्हा। रघुपति दूत जानकीं चीन्हा ॥ कहहु तात प्रभु कृपानिकेता। कुसल अनुज
    कपि सेन समेता ॥ सब बिधि कुसल कोसलाधीसा। मातु समर जीत्यो दससीसा ॥ अबिचल राजु बिभीषन पायो। सुनि कपि
    बचन हरष उर छायो ॥ छं अति हरष मन तन पुलक लोचन सजल कह पुनि पुनि रमा। का देउँ तोहि त्रेलोक महुँ कपि किमपि
    नहिं बानी समा ॥ सुनु मातु मैं पायो अखिल जग राजु आजु न संसयं। रन जीति रिपुदल बन्धु जुत पस्यामि राममनामयम्
    ॥ दो सुनु सुत सदगुन सकल तव हृदयँ बसहुँ हनुमन्त। सानुकूल कोसलपति रहहुँ समेत अनन्त ॥ ॥ अब सोइ जतन करहु
    तुम्ह ताता। देखौं नयन स्याम मृदु गाता ॥ तब हनुमान राम पहिं जाई। जनकसुता कै कुसल सुनाई ॥ सुनि सन्देसु
    भानुकुलभूषन। बोलि लिए जुबराज बिभीषन ॥ मारुतसुत के सङ्ग सिधावहु। सादर जनकसुतहि लै आवहु ॥ तुरतहिं सकल
    गे जहँ सीता। सेवहिं सब निसिचरीं बिनीता ॥ बेगि बिभीषन तिन्हहि सिखायो। तिन्ह बहु बिधि मज्जन करवायो ॥
    बहु प्रकार भूषन पहिराए। सिबिका रुचिर साजि पुनि ल्याए ॥ ता पर हरषि चढ़ई बैदेही। सुमिरि राम सुखधाम सनेही
    ॥ बेतपानि रच्छक चहुँ पासा। चले सकल मन परम हुलासा ॥ देखन भालु कीस सब आए। रच्छक कोऽपि निवारन धाए ॥ कह
    रघुबीर कहा मम मानहु। सीतहि सखा पयादें आनहु ॥ देखहुँ कपि जननी की नाईं। बिहसि कहा रघुनाथ गोसाई ॥ सुनि
    प्रभु बचन भालु कपि हरषे। नभ ते सुरन्ह सुमन बहु बरषे ॥ सीता प्रथम अनल महुँ राखी। प्रगट कीन्हि चह अन्तर
    साखी ॥ दो तेहि कारन करुनानिधि कहे कछुक दुर्बाद। सुनत जातुधानीं सब लागीं करै बिषाद ॥ ॥ प्रभु के बचन
    सीस धरि सीता। बोली मन क्रम बचन पुनीता ॥ लछिमन होहु धरम के नेगी। पावक प्रगट करहु तुम्ह बेगी ॥ सुनि
    लछिमन सीता कै बानी। बिरह बिबेक धरम निति सानी ॥ लोचन सजल जोरि कर दोऊ। प्रभु सन कछु कहि सकत न ओऊ ॥ देखि
    राम रुख लछिमन धाए। पावक प्रगटि काठ बहु लाए ॥ पावक प्रबल देखि बैदेही। हृदयँ हरष नहिं भय कछु तेही ॥
    जौं मन बच क्रम मम उर माहीं। तजि रघुबीर आन गति नाहीम् ॥ तौ कृसानु सब कै गति जाना। मो कहुँ हौ श्रीखण्ड
    समाना ॥ छं श्रीखण्ड सम पावक प्रबेस कियो सुमिरि प्रभु मैथिली। जय कोसलेस महेस बन्दित चरन रति अति निर्मली
    ॥ प्रतिबिम्ब अरु लौकिक कलङ्क प्रचण्ड पावक महुँ जरे। प्रभु चरित काहुँ न लखे नभ सुर सिद्ध मुनि देखहिं
    खरे ॥ ॥ धरि रूप पावक पानि गहि श्री सत्य श्रुति जग बिदित जो। जिमि छीरसागर इन्दिरा रामहि समर्पी आनि
    सो ॥ सो राम बाम बिभाग राजति रुचिर अति सोभा भली। नव नील नीरज निकट मानहुँ कनक पङ्कज की कली ॥ बरषहिं
    सुमन हरषि सुन बाजहिं गगन निसान। गावहिं किन्नर सुरबधू नाचहिं चढ़ईं बिमान ॥ ॥ जनकसुता समेत प्रभु सोभा
    अमित अपार। देखि भालु कपि हरषे जय रघुपति सुख सार ॥ ॥ तब रघुपति अनुसासन पाई। मातलि चलेउ चरन सिरु नाई
    ॥ आए देव सदा स्वारथी। बचन कहहिं जनु परमारथी ॥ दीन बन्धु दयाल रघुराया। देव कीन्हि देवन्ह पर दाया ॥
    बिस्व द्रोह रत यह खल कामी। निज अघ गयु कुमारगगामी ॥ तुम्ह समरूप ब्रह्म अबिनासी। सदा एकरस सहज उदासी
    ॥ अकल अगुन अज अनघ अनामय। अजित अमोघसक्ति करुनामय ॥ मीन कमठ सूकर नरहरी। बामन परसुराम बपु धरी ॥ जब जब
    नाथ सुरन्ह दुखु पायो। नाना तनु धरि तुम्हिँ नसायो ॥ यह खल मलिन सदा सुरद्रोही। काम लोभ मद रत अति कोही
    ॥ अधम सिरोमनि तव पद पावा। यह हमरे मन बिसमय आवा ॥ हम देवता परम अधिकारी। स्वारथ रत प्रभु भगति बिसारी
    ॥ भव प्रबाहँ सन्तत हम परे। अब प्रभु पाहि सरन अनुसरे ॥ दो करि बिनती सुर सिद्ध सब रहे जहँ तहँ कर जोरि।
    अति सप्रेम तन पुलकि बिधि अस्तुति करत बहोरि ॥ जय राम सदा सुखधाम हरे। रघुनायक सायक चाप धरे ॥ भव बारन
    दारन सिंह प्रभो। गुन सागर नागर नाथ बिभो ॥ तन काम अनेक अनूप छबी। गुन गावत सिद्ध मुनीन्द्र कबी ॥ जसु
    पावन रावन नाग महा। खगनाथ जथा करि कोप गहा ॥ जन रञ्जन भञ्जन सोक भयं। गतक्रोध सदा प्रभु बोधमयम् ॥ अवतार
    उदार अपार गुनं। महि भार बिभञ्जन ग्यानघनम् ॥ अज ब्यापकमेकमनादि सदा। करुनाकर राम नमामि मुदा ॥ रघुबंस
    बिभूषन दूषन हा। कृत भूप बिभीषन दीन रहा ॥ गुन ग्यान निधान अमान अजं। नित राम नमामि बिभुं बिरजम् ॥ भुजदण्ड
    प्रचण्ड प्रताप बलं। खल बृन्द निकन्द महा कुसलम् ॥ बिनु कारन दीन दयाल हितं। छबि धाम नमामि रमा सहितम्
    ॥ भव तारन कारन काज परं। मन सम्भव दारुन दोष हरम् ॥ सर चाप मनोहर त्रोन धरं। जरजारुन लोचन भूपबरम् ॥ सुख
    मन्दिर सुन्दर श्रीरमनं। मद मार मुधा ममता समनम् ॥ अनवद्य अखण्ड न गोचर गो। सबरूप सदा सब होइ न गो ॥ इति
    बेद बदन्ति न दन्तकथा। रबि आतप भिन्नमभिन्न जथा ॥ कृतकृत्य बिभो सब बानर ए। निरखन्ति तवानन सादर ए ॥ धिग
    जीवन देव सरीर हरे। तव भक्ति बिना भव भूलि परे ॥ अब दीन दयाल दया करिऐ। मति मोरि बिभेदकरी हरिऐ ॥ जेहि
    ते बिपरीत क्रिया करिऐ। दुख सो सुख मानि सुखी चरिऐ ॥ खल खण्डन मण्डन रम्य छमा। पद पङ्कज सेवित सम्भु उमा
    ॥ नृप नायक दे बरदानमिदं। चरनाम्बुज प्रेम सदा सुभदम् ॥ दो बिनय कीन्हि चतुरानन प्रेम पुलक अति गात। सोभासिन्धु
    बिलोकत लोचन नहीं अघात ॥ ॥ तेहि अवसर दसरथ तहँ आए। तनय बिलोकि नयन जल छाए ॥ अनुज सहित प्रभु बन्दन कीन्हा।
    आसिरबाद पिताँ तब दीन्हा ॥ तात सकल तव पुन्य प्रभ् । जीत्यों अजय निसाचर र् ॥ सुनि सुत बचन प्रीति अति
    बाढ़ई। नयन सलिल रोमावलि ठाढ़ई ॥ रघुपति प्रथम प्रेम अनुमाना। चिति पितहि दीन्हेउ दृढ़ ग्याना ॥ ताते
    उमा मोच्छ नहिं पायो। दसरथ भेद भगति मन लायो ॥ सगुनोपासक मोच्छ न लेहीं। तिन्ह कहुँ राम भगति निज देहीम्
    ॥ बार बार करि प्रभुहि प्रनामा। दसरथ हरषि गे सुरधामा ॥ दो अनुज जानकी सहित प्रभु कुसल कोसलाधीस। सोभा
    देखि हरषि मन अस्तुति कर सुर ईस ॥ जय राम सोभा धाम। दायक प्रनत बिश्राम ॥ धृत त्रोन बर सर चाप। भुजदण्ड
    प्रबल प्रताप ॥ ॥ जय दूषनारि खरारि। मर्दन निसाचर धारि ॥ यह दुष्ट मारेउ नाथ। भे देव सकल सनाथ ॥ ॥ जय
    हरन धरनी भार। महिमा उदार अपार ॥ जय रावनारि कृपाल। किए जातुधान बिहाल ॥ ॥ लङ्केस अति बल गर्ब। किए बस्य
    सुर गन्धर्ब ॥ मुनि सिद्ध नर खग नाग। हठि पन्थ सब कें लाग ॥ ॥ परद्रोह रत अति दुष्ट। पायो सो फलु पापिष्ट
    ॥ अब सुनहु दीन दयाल। राजीव नयन बिसाल ॥ ॥ मोहि रहा अति अभिमान। नहिं कौ मोहि समान ॥ अब देखि प्रभु पद
    कञ्ज। गत मान प्रद दुख पुञ्ज ॥ ॥ कौ ब्रह्म निर्गुन ध्याव। अब्यक्त जेहि श्रुति गाव ॥ मोहि भाव कोसल भूप।
    श्रीराम सगुन सरूप ॥ ॥ बैदेहि अनुज समेत। मम हृदयँ करहु निकेत ॥ मोहि जानिए निज दास। दे भक्ति रमानिवास
    ॥ ॥ दे भक्ति रमानिवास त्रास हरन सरन सुखदायकं। सुख धाम राम नमामि काम अनेक छबि रघुनायकम् ॥ सुर बृन्द
    रञ्जन द्वन्द भञ्जन मनुज तनु अतुलितबलं। ब्रह्मादि सङ्कर सेब्य राम नमामि करुना कोमलम् ॥ दो अब करि कृपा
    बिलोकि मोहि आयसु देहु कृपाल। काह करौं सुनि प्रिय बचन बोले दीनदयाल ॥ ॥ सुनु सुरपति कपि भालु हमारे।
    परे भूमि निसचरन्हि जे मारे ॥ मम हित लागि तजे इन्ह प्राना। सकल जिआउ सुरेस सुजाना ॥ सुनु खगेस प्रभु
    कै यह बानी। अति अगाध जानहिं मुनि ग्यानी ॥ प्रभु सक त्रिभुअन मारि जिआई। केवल सक्रहि दीन्हि बड़आई ॥
    सुधा बरषि कपि भालु जिआए। हरषि उठे सब प्रभु पहिं आए ॥ सुधाबृष्टि भै दुहु दल ऊपर। जिए भालु कपि नहिं
    रजनीचर ॥ रामाकार भे तिन्ह के मन। मुक्त भे छूटे भव बन्धन ॥ सुर अंसिक सब कपि अरु रीछा। जिए सकल रघुपति
    कीं ईछा ॥ राम सरिस को दीन हितकारी। कीन्हे मुकुत निसाचर झारी ॥ खल मल धाम काम रत रावन। गति पाई जो मुनिबर
    पाव न ॥ दो सुमन बरषि सब सुर चले चढ़इ चढ़इ रुचिर बिमान। देखि सुअवसरु प्रभु पहिं आयु सम्भु सुजान ॥ ॥
    परम प्रीति कर जोरि जुग नलिन नयन भरि बारि। पुलकित तन गदगद गिराँ बिनय करत त्रिपुरारि ॥ मामभिरक्षय रघुकुल
    नायक। धृत बर चाप रुचिर कर सायक ॥ मोह महा घन पटल प्रभञ्जन। संसय बिपिन अनल सुर रञ्जन ॥ ॥ अगुन सगुन गुन
    मन्दिर सुन्दर। भ्रम तम प्रबल प्रताप दिवाकर ॥ काम क्रोध मद गज पञ्चानन। बसहु निरन्तर जन मन कानन ॥ ॥
    बिषय मनोरथ पुञ्ज कञ्ज बन। प्रबल तुषार उदार पार मन ॥ भव बारिधि मन्दर परमं दर। बारय तारय संसृति दुस्तर
    ॥ ॥ स्याम गात राजीव बिलोचन। दीन बन्धु प्रनतारति मोचन ॥ अनुज जानकी सहित निरन्तर। बसहु राम नृप मम उर
    अन्तर ॥ ॥ मुनि रञ्जन महि मण्डल मण्डन। तुलसिदास प्रभु त्रास बिखण्डन ॥ नाथ जबहिं कोसलपुरीं होइहि तिलक
    तुम्हार। कृपासिन्धु मैं आउब देखन चरित उदार ॥ ॥ करि बिनती जब सम्भु सिधाए। तब प्रभु निकट बिभीषनु आए
    ॥ नाइ चरन सिरु कह मृदु बानी। बिनय सुनहु प्रभु सारँगपानी ॥ सकुल सदल प्रभु रावन मार् यो। पावन जस त्रिभुवन
    बिस्तार् यो ॥ दीन मलीन हीन मति जाती। मो पर कृपा कीन्हि बहु भाँती ॥ अब जन गृह पुनीत प्रभु कीजे। मज्जनु
    करिअ समर श्रम छीजे ॥ देखि कोस मन्दिर सम्पदा। देहु कृपाल कपिन्ह कहुँ मुदा ॥ सब बिधि नाथ मोहि अपनाइअ।
    पुनि मोहि सहित अवधपुर जाइअ ॥ सुनत बचन मृदु दीनदयाला। सजल भे द्वौ नयन बिसाला ॥ दो तोर कोस गृह मोर सब
    सत्य बचन सुनु भ्रात। भरत दसा सुमिरत मोहि निमिष कल्प सम जात ॥ ॥ तापस बेष गात कृस जपत निरन्तर मोहि।
    देखौं बेगि सो जतनु करु सखा निहोरुँ तोहि ॥ ॥ बीतें अवधि जाउँ जौं जिअत न पावुँ बीर। सुमिरत अनुज प्रीति
    प्रभु पुनि पुनि पुलक सरीर ॥ ॥ करेहु कल्प भरि राजु तुम्ह मोहि सुमिरेहु मन माहिं। पुनि मम धाम पाइहहु
    जहाँ सन्त सब जाहिम् ॥ ॥ सुनत बिभीषन बचन राम के। हरषि गहे पद कृपाधाम के ॥ बानर भालु सकल हरषाने। गहि
    प्रभु पद गुन बिमल बखाने ॥ बहुरि बिभीषन भवन सिधायो। मनि गन बसन बिमान भरायो ॥ लै पुष्पक प्रभु आगें राखा।
    हँसि करि कृपासिन्धु तब भाषा ॥ चढ़इ बिमान सुनु सखा बिभीषन। गगन जाइ बरषहु पट भूषन ॥ नभ पर जाइ बिभीषन
    तबही। बरषि दिए मनि अम्बर सबही ॥ जोइ जोइ मन भावि सोइ लेहीं। मनि मुख मेलि डारि कपि देहीम् ॥ हँसे रामु
    श्री अनुज समेता। परम कौतुकी कृपा निकेता ॥ दो मुनि जेहि ध्यान न पावहिं नेति नेति कह बेद। कृपासिन्धु
    सोइ कपिन्ह सन करत अनेक बिनोद ॥ ॥ उमा जोग जप दान तप नाना मख ब्रत नेम। राम कृपा नहि करहिं तसि जसि निष्केवल
    प्रेम ॥ ॥ भालु कपिन्ह पट भूषन पाए। पहिरि पहिरि रघुपति पहिं आए ॥ नाना जिनस देखि सब कीसा। पुनि पुनि
    हँसत कोसलाधीसा ॥ चिति सबन्हि पर कीन्हि दाया। बोले मृदुल बचन रघुराया ॥ तुम्हरें बल मैं रावनु मार् यो।
    तिलक बिभीषन कहँ पुनि सार् यो ॥ निज निज गृह अब तुम्ह सब जाहू। सुमिरेहु मोहि डरपहु जनि काहू ॥ सुनत बचन
    प्रेमाकुल बानर। जोरि पानि बोले सब सादर ॥ प्रभु जोइ कहहु तुम्हहि सब सोहा। हमरे होत बचन सुनि मोहा ॥
    दीन जानि कपि किए सनाथा। तुम्ह त्रेलोक ईस रघुनाथा ॥ सुनि प्रभु बचन लाज हम मरहीं। मसक कहूँ खगपति हित
    करहीम् ॥ देखि राम रुख बानर रीछा। प्रेम मगन नहिं गृह कै ईछा ॥ दो प्रभु प्रेरित कपि भालु सब राम रूप
    उर राखि। हरष बिषाद सहित चले बिनय बिबिध बिधि भाषि ॥ ॥ कपिपति नील रीछपति अङ्गद नल हनुमान। सहित बिभीषन
    अपर जे जूथप कपि बलवान ॥ कहि न सकहिं कछु प्रेम बस भरि भरि लोचन बारि। सन्मुख चितवहिं राम तन नयन निमेष
    निवारि ॥ ॥ ऽ अतिसय प्रीति देख रघुराई। लिन्हे सकल बिमान चढ़आई ॥ मन महुँ बिप्र चरन सिरु नायो। उत्तर
    दिसिहि बिमान चलायो ॥ चलत बिमान कोलाहल होई। जय रघुबीर कहि सबु कोई ॥ सिंहासन अति उच्च मनोहर। श्री समेत
    प्रभु बैठै ता पर ॥ राजत रामु सहित भामिनी। मेरु सृङ्ग जनु घन दामिनी ॥ रुचिर बिमानु चलेउ अति आतुर। कीन्ही
    सुमन बृष्टि हरषे सुर ॥ परम सुखद चलि त्रिबिध बयारी। सागर सर सरि निर्मल बारी ॥ सगुन होहिं सुन्दर चहुँ
    पासा। मन प्रसन्न निर्मल नभ आसा ॥ कह रघुबीर देखु रन सीता। लछिमन इहाँ हत्यो इँद्रजीता ॥ हनूमान अङ्गद
    के मारे। रन महि परे निसाचर भारे ॥ कुम्भकरन रावन द्वौ भाई। इहाँ हते सुर मुनि दुखदाई ॥ दो इहाँ सेतु
    बाँध्यो अरु थापेउँ सिव सुख धाम। सीता सहित कृपानिधि सम्भुहि कीन्ह प्रनाम ॥ ॥ जहँ जहँ कृपासिन्धु बन
    कीन्ह बास बिश्राम। सकल देखाए जानकिहि कहे सबन्हि के नाम ॥ ॥ तुरत बिमान तहाँ चलि आवा। दण्डक बन जहँ परम
    सुहावा ॥ कुम्भजादि मुनिनायक नाना। गे रामु सब कें अस्थाना ॥ सकल रिषिन्ह सन पाइ असीसा। चित्रकूट आए जगदीसा
    ॥ तहँ करि मुनिन्ह केर सन्तोषा। चला बिमानु तहाँ ते चोखा ॥ बहुरि राम जानकिहि देखाई। जमुना कलि मल हरनि
    सुहाई ॥ पुनि देखी सुरसरी पुनीता। राम कहा प्रनाम करु सीता ॥ तीरथपति पुनि देखु प्रयागा। निरखत जन्म कोटि
    अघ भागा ॥ देखु परम पावनि पुनि बेनी। हरनि सोक हरि लोक निसेनी ॥ पुनि देखु अवधपुरी अति पावनि। त्रिबिध
    ताप भव रोग नसावनि ॥ । दो सीता सहित अवध कहुँ कीन्ह कृपाल प्रनाम। सजल नयन तन पुलकित पुनि पुनि हरषित
    राम ॥ ॥ पुनि प्रभु आइ त्रिबेनीं हरषित मज्जनु कीन्ह। कपिन्ह सहित बिप्रन्ह कहुँ दान बिबिध बिधि दीन्ह
    ॥ ॥ प्रभु हनुमन्तहि कहा बुझाई। धरि बटु रूप अवधपुर जाई ॥ भरतहि कुसल हमारि सुनाएहु। समाचार लै तुम्ह
    चलि आएहु ॥ तुरत पवनसुत गवनत भयु। तब प्रभु भरद्वाज पहिं गयू ॥ नाना बिधि मुनि पूजा कीन्ही। अस्तुती करि
    पुनि आसिष दीन्ही ॥ मुनि पद बन्दि जुगल कर जोरी। चढ़इ बिमान प्रभु चले बहोरी ॥ इहाँ निषाद सुना प्रभु
    आए। नाव नाव कहँ लोग बोलाए ॥ सुरसरि नाघि जान तब आयो। उतरेउ तट प्रभु आयसु पायो ॥ तब सीताँ पूजी सुरसरी।
    बहु प्रकार पुनि चरनन्हि परी ॥ दीन्हि असीस हरषि मन गङ्गा। सुन्दरि तव अहिवात अभङ्गा ॥ सुनत गुहा धायु
    प्रेमाकुल। आयु निकट परम सुख सङ्कुल ॥ प्रभुहि सहित बिलोकि बैदेही। परेउ अवनि तन सुधि नहिं तेही ॥ प्रीति
    परम बिलोकि रघुराई। हरषि उठाइ लियो उर लाई ॥ छं लियो हृदयँ लाइ कृपा निधान सुजान रायँ रमापती। बैठारि
    परम समीप बूझी कुसल सो कर बीनती। अब कुसल पद पङ्कज बिलोकि बिरञ्चि सङ्कर सेब्य जे। सुख धाम पूरनकाम राम
    नमामि राम नमामि ते ॥ ॥ सब भाँति अधम निषाद सो हरि भरत ज्यों उर लाइयो। मतिमन्द तुलसीदास सो प्रभु मोह
    बस बिसराइयो ॥ यह रावनारि चरित्र पावन राम पद रतिप्रद सदा। कामादिहर बिग्यानकर सुर सिद्ध मुनि गावहिं
    मुदा ॥ समर बिजय रघुबीर के चरित जे सुनहिं सुजान। बिजय बिबेक बिभूति नित तिन्हहि देहिं भगवान ॥ ॥ यह कलिकाल
    मलायतन मन करि देखु बिचार। श्रीरघुनाथ नाम तजि नाहिन आन अधार ॥ सत्ताईसवाँ विश्राम इति श्रीमद्रामचरितमानसे
    सकलकलिकलुषविध्वंसने षष्ठः सोपानः समाप्तः।
