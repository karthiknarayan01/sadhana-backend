id: carnatic-music-geethams-kamala-sulochana
category: stotram
name:
  english: Carnatic Music Geethams - Kamala Sulochana
content:
  english: catusra jati triputa talam samskritam sahityam kamala sulocana vimala la tatakini marala gamini
    kari hara madhye bimba anana vidu mandalare candana kunkuma sankalita parimala kasturi tilakadhare
    re jaji saiya kaca kuca ghana jaga nambhoja marala gamini karihara madhye bimbanana vidu mandalare
    svarah ni da ni sa ni | ni da | pa ma || vi ma la ta | ta | ki ni || pa pa pa da | ni da | pa ma ||
    ma ra | mi ni || ma pa ma pa | ga ri | sa | na na || ga ma pa ma | ga ri | sa || pa pa ma ga | ma
    ma | ga ri || pa ri ma la | ka | stu ri || ga ga ri ni || sa ga ri ga | ma ga | ma || pa ni da ni
    | pa da | ni sa || ka ca ku ca | gha na | ja ga || ga ni | ni da | pa ma || nam ja || pa pa pa da
    | ni da | pa ma || ma ra | mi ni || ma pa ma pa | ga ri | sa | na na || ga ma pa ma | ga ri | sa
  devanagari: चतुस्र जाति त्रिपुट तालम् संस्कृतम् साहित्यम् कमल सुलोचन विमल ल ताटाकिनि मराल गामिनि करि
    हर मध्ये बिम्बा आनन विदु मण्डलरे चन्दन कुङ्कुम सङ्कलित परिमल कस्तूरि तिलकधरे रे जाजि सैय कच कुच घन
    जग नाम्भोज मराल गामिनि करिहर मध्ये बिम्बानन विदु मण्डलरे स्वराः नि द नि स नि । नि द । प म ॥ वि म ल
    त । टा । कि नि ॥ प प प द । नि द । प म ॥ म रा । मि नि ॥ म प म प । ग रि । स । न न ॥ ग म प म । ग रि ।
    स ॥ प प म ग । म म । ग रि ॥ प रि म ल । क । स्तू रि ॥ ग ग रि नि ॥ स ग रि ग । म ग । म ॥ प नि द नि । प
    द । नि स ॥ क च कु च । घ न । ज ग ॥ ग नि । नि द । प म ॥ नम् ज ॥ प प प द । नि द । प म ॥ म रा । मि नि
    ॥ म प म प । ग रि । स । न न ॥ ग म प म । ग रि । स
