id: sri-krishna-krupa-kataksha-stotram
category: stotram
name:
  english: Sri Krishna Krupa Kataksha Stotram
content:
  english: shrikrishna prarthana mukam karoti vacalam pangu langhayate girim| yatkripa tamaham vande paramananda
    madhavam|| naham vasami vaikunthe yoginam hridaye na ca| madbhakta yatra gayanti tatra tishthami narada||
    atha shri krishna kripa kataksha stotra || bhaje vrajaikamandanam samastapapakhandanam svabhaktacittaranjanam
    sadaiva nandanandanam | supicchagucchamastakam sunadavenuhastakam anangarangasagaram namami krishnanagaram
    || manojagarvamocanam vishalalolalocanam vidhutagopashocanam namami padmalocanam | kararavindabhudharam
    smitavalokasundaram mahendramanadaranam namami krishna varanam || kadambasunakundalam sucarugandamandalam
    vrajanganaikavallabham namami krishnadurlabham | yashodaya samodaya sagopaya sanandaya yutam sukhaikadayakam
    namami gopanayakam || sadaiva padapankajam madiya manase nijam dadhanamuktamalakam namami nandabalakam
    | samastadoshashoshanam samastalokaposhanam samastagopamanasam namami nandalalasam || bhuvo bharavatarakam
    bhavabdhikarnadharakam yashomatikishorakam namami cittacorakam | drigantakantabhanginam sada sadalisanginam
    dine navam namami nandasambhavam || gunakaram sukhakaram kripakaram kripaparam suradvishannikandanam
    namami gopanandanam | navina gopanagaram navinakeli lampatam namami meghasundaram taditprabhalasatpatam
    || samasta gopa mohanam hridambujaika modanam namamikunjamadhyagam prasanna bhanushobhanam | nikamakamadayakam
    drigantacarusayakam rasalavenugayakam namamikunjanayakam || vidagdha gopikamano manojnatalpashayinam
    namami kunjakanane pravriddhavahnipayinam | kishorakanti ranjitam driganjanam sushobhitam gajendramokshakarinam
    namami shriviharinam || phalashriti yada tada yatha tatha tathaiva krishnasatkatha maya sadaiva giyatam
    tatha kripa vidhiyatam | pramanikashtakadvayam japatyadhitya yah puman bhavetsa nandanandane bhave
    bhave subhaktimana ||
  devanagari: श्रीकृष्ण प्रार्थना मूकं करोति वाचालं पङ्गु लङ्घयते गिरिम्। यत्कृपा तमहं वन्दे परमानन्द
    माधवम्॥ नाहं वसामि वैकुण्ठे योगिनां हृदये न च। मद्भक्ता यत्र गायन्ति तत्र तिष्ठामि नारद॥ अथ श्री कृष्ण
    कृपा कटाक्ष स्तोत्र ॥ भजे व्रजैकमण्डनं समस्तपापखण्डनं स्वभक्तचित्तरञ्जनं सदैव नन्दनन्दनम् । सुपिच्छगुच्छमस्तकं
    सुनादवेणुहस्तकं अनङ्गरङ्गसागरं नमामि कृष्णनागरम् ॥ मनोजगर्वमोचनं विशाललोललोचनं विधूतगोपशोचनं नमामि
    पद्मलोचनम् । करारविन्दभूधरं स्मितावलोकसुन्दरं महेन्द्रमानदारणं नमामि कृष्ण वारणम् ॥ कदम्बसूनकुण्डलं
    सुचारुगण्डमण्डलं व्रजाङ्गनैकवल्लभं नमामि कृष्णदुर्लभम् । यशोदया समोदया सगोपया सनन्दया युतं सुखैकदायकं
    नमामि गोपनायकम् ॥ सदैव पादपङ्कजं मदीय मानसे निजं दधानमुक्तमालकं नमामि नन्दबालकम् । समस्तदोषशोषणं समस्तलोकपोषणं
    समस्तगोपमानसं नमामि नन्दलालसम् ॥ भुवो भरावतारकं भवाब्धिकर्णधारकं यशोमतीकिशोरकं नमामि चित्तचोरकम् ।
    दृगन्तकान्तभङ्गिनं सदा सदालिसङ्गिनं दिने नवं नमामि नन्दसम्भवम् ॥ गुणाकरं सुखाकरं कृपाकरं कृपापरं सुरद्विषन्निकन्दनं
    नमामि गोपनन्दनम् । नवीन गोपनागरं नवीनकेलि लम्पटं नमामि मेघसुन्दरं तडित्प्रभालसत्पटम् ॥ समस्त गोप मोहनं
    हृदम्बुजैक मोदनं नमामिकुञ्जमध्यगं प्रसन्न भानुशोभनम् । निकामकामदायकं दृगन्तचारुसायकं रसालवेणुगायकं
    नमामिकुञ्जनायकम् ॥ विदग्ध गोपिकामनो मनोज्ञतल्पशायिनं नमामि कुञ्जकानने प्रवृद्धवह्निपायिनम् । किशोरकान्ति
    रञ्जितं दृगञ्जनं सुशोभितं गजेन्द्रमोक्षकारिणं नमामि श्रीविहारिणम् ॥ फलशृति यदा तदा यथा तथा तथैव कृष्णसत्कथा
    मया सदैव गीयतां तथा कृपा विधीयताम् । प्रमाणिकाष्टकद्वयं जपत्यधीत्य यः पुमान् भवेत्स नन्दनन्दने भवे
    भवे सुभक्तिमान ॥
