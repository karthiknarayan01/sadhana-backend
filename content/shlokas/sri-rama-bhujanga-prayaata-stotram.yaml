id: sri-rama-bhujanga-prayaata-stotram
category: stotram
name:
  english: Sri Rama Bhujanga Prayaata Stotram
  devanagari: श्रीरामभुजङ्गप्रयातस्तोत्रम् (मूलसहितम्)
content:
  english: shriramabhujangaprayatastotram shankaracaryah 1910 shriramabhujangaprayatastotram shankaracaryah
    1910 || shri || || shriramabhujamgaprayatastotram || vishuddham param saccidanandarupam gunadharamadharahinam
    varenyam | mahantam vibhantam guhantam gunantam sukhantam svayam dhama ramam prapadye || 1 || shivam
    nityamekam vibhum tarakakhyam sukhakaramakarashunyam sumanyam | mahesham kalesham suresham paresham
    naresham nirisham mahisham prapadye || 2 || yadavarnayatkarnamule'ntakale shivo rama rameti rameti
    kashyam | tadekam param tarakabrahmarupam bhaje'ham bhaje'ham bhaje'ham bhaje'ham || 3 || maharatnapithe
    shubhe kalpamule sukhasinamadityakotiprakasham | sada janakilakshmanopetamekam sada ramacandram bhaje'ham
    bhaje'ham || 4 || kvanadratnamanjirapadaravindam lasanmekhalacarupitambaradhyam | maharatnaharollasatkaustubhangam
    nadaccancarimanjarilolamalam || 5 || lasaccandrikasmerashonadharabham samudyatpatangendukotiprakasham
    | namadbrahmarudradikotiraratna sphuratkantinirajanaradhitanghrim || 6 || purah pranjalinanjaneyadibhakta
    nsvacinmudraya bhadraya bodhayantam | bhaje'ham bhaje'ham sada ramacandram tvadanyam na manye na manye
    na manye || 7 || yada matsamipam kritantah sametya pracandaprakopairbhatairbhishayenmam | tadavishkaroshi
    tvadiyam svarupam sadapatpranasham sakodandabanam || 8 || nije manase mandire sannidhehi prasida prasida
    prabho ramacandra | sasaumitrina kaikayinandanena svashaktyanubhaktya ca samsevyamana || 9 || svabhaktagraganyaih
    kapishairmahishai ranikairanekaishca rama prasida | namaste namo'stvisha rama prasida prashadhi prashadhi
    prakasham prabho mam || 10 || tvamevasi daivam param me yadekam sucaitanyametattvadanyam na manye
    | yato'bhudameyam viyadvayutejo jalorvyadikaryam caram cacaram ca || 11 || namah saccidanandarupaya
    tasmai namo devadevaya ramaya tubhyam | namo janakijiviteshaya tubhyam namah pundarikayatakshaya tubhyam
    || 12 || namo bhaktiyuktanuraktaya tubhyam namah punyapunjaikalabhyaya tubhyam | namo vedavedyaya
    cadyaya pumse namah sundarayendiravallabhaya || 13 || namo vishvakartre namo vishvahartre namo vishvabhoktre
    namo vishvamatre | namo vishvanetre namo vishvajetre namo vishvapitre namo vishvamatre || 14 || namaste
    namaste samastaprapanca prabhagaprayogapramanapravina | madiyam manastvatpadadvandvaseva vidhatum
    pravrittam sucaitanyasiddhyai || 15 || shilapi tvadanghrikshamasangirenu prasadaddhi caitanyamadhatta
    rama | narastvatpadavandvasevavidhana tsucaitanyametiti kim citramadya || 16 || pavitram caritram
    vicitram tvadiyam nara ye smarantyanvaham ramacandra | bhavantam bhavantam bharantam bhajanto labhante
    kritantam na pashyantyato'nte || 17 || sa punyah sa ganyah sharanyo mamayam naro veda yo devacudamanim
    tvam | sadakaramekam cidanandarupam manovagagamyam parandhama rama || 18 || pracandapratapaprabhavabhibhuta
    prabhutarivira prabho ramacandra | balam te katham varnyate'tiva balye yato'khandi candishakodandadandam
    || 19 || dashagrivamugram saputram samitram sariddurgamadhyastharakshoganesham | bhavantam vina rama
    viro naro va suro vamaro va jayetkastrilokyam || 20 || sada rama rameti ramamritam te sadaramamanandanishyandakandam
    | pibantam namantam sudantam hasantam hanumantamantarbhaje tam nitantam || 21 || sada rama rameti
    ramamritam te sadaramamanandanishyandakandam | pibannanvaham nanvaham naiva mrityo rbibhemi prasadadasadattavaiva
    || 22 || asitasametairakodandabhushai rasaumitrivandyairacandapratapaih | alankeshakalairasugrivamitrai
    raramabhidheyairalam daivatairnah || 23 || avirasanasthairacinmudrikadhyai rabhaktanjaneyaditattvaprakashaih
    | amandaramulairamandaramalai raramabhidheyairalam daivatairnah || 24 || asindhuprakopairavandyapratapai
    rabandhuprayanairamandasmitadhyaih | adandapravasairakhandaprabodhai raramabhidheyairalam daivatairnah
    || 25 || hare rama sitapate ravanare kharare murare'surare pareti | lapantam nayantam sadakalameva
    samalokayalokayasheshabandho || 26 || namaste sumitrasuputrabhivandya namaste sada kaikayinandanedya
    | namaste sada vanaradhishavandya namaste namaste sada ramacandra || 27 || prasida prasida pracandapratapa
    prasida prasida pracandarikala | prasida prasida prapannanukampin prasida prasida prabho ramacandra
    || 28 || bhujangaprayatam param vedasaram muda ramacandrasya bhaktya ca nityam | pathansantatam cintayansvantarange
    sa eva svayam ramacandrah sa dhanyah || 29 || iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya
    shrimacchankarabhagavatah kritau shriramabhujangaprayatastotram sampurnam ||
  devanagari: श्रीरामभुजङ्गप्रयातस्तोत्रम् शङ्कराचार्यः १९१० श्रीरामभुजङ्गप्रयातस्तोत्रम् शङ्कराचार्यः
    १९१० ॥ श्री ॥ ॥ श्रीरामभुजंगप्रयातस्तोत्रम् ॥ विशुद्धं परं सच्चिदानन्दरूपं गुणाधारमाधारहीनं वरेण्यम्
    । महान्तं विभान्तं गुहान्तं गुणान्तं सुखान्तं स्वयं धाम रामं प्रपद्ये ॥ १ ॥ शिवं नित्यमेकं विभुं तारकाख्यं
    सुखाकारमाकारशून्यं सुमान्यम् । महेशं कलेशं सुरेशं परेशं नरेशं निरीशं महीशं प्रपद्ये ॥ २ ॥ यदावर्णयत्कर्णमूलेऽन्तकाले
    शिवो राम रामेति रामेति काश्याम् । तदेकं परं तारकब्रह्मरूपं भजेऽहं भजेऽहं भजेऽहं भजेऽहम् ॥ ३ ॥ महारत्नपीठे
    शुभे कल्पमूले सुखासीनमादित्यकोटिप्रकाशम् । सदा जानकीलक्ष्मणोपेतमेकं सदा रामचन्द्रं भजेऽहं भजेऽहम्
    ॥ ४ ॥ क्वणद्रत्नमञ्जीरपादारविन्दं लसन्मेखलाचारुपीताम्बराढ्यम् । महारत्नहारोल्लसत्कौस्तुभाङ्गं नदच्चञ्चरीमञ्जरीलोलमालम्
    ॥ ५ ॥ लसच्चन्द्रिकास्मेरशोणाधराभं समुद्यत्पतङ्गेन्दुकोटिप्रकाशम् । नमद्ब्रह्मरुद्रादिकोटीररत्न स्फुरत्कान्तिनीराजनाराधिताङ्घ्रिम्
    ॥ ६ ॥ पुरः प्राञ्जलीनाञ्जनेयादिभक्ता न्स्वचिन्मुद्रया भद्रया बोधयन्तम् । भजेऽहं भजेऽहं सदा रामचन्द्रं
    त्वदन्यं न मन्ये न मन्ये न मन्ये ॥ ७ ॥ यदा मत्समीपं कृतान्तः समेत्य प्रचण्डप्रकोपैर्भटैर्भीषयेन्माम्
    । तदाविष्करोषि त्वदीयं स्वरूपं सदापत्प्रणाशं सकोदण्डबाणम् ॥ ८ ॥ निजे मानसे मन्दिरे सन्निधेहि प्रसीद
    प्रसीद प्रभो रामचन्द्र । ससौमित्रिणा कैकयीनन्दनेन स्वशक्त्यानुभक्त्या च संसेव्यमान ॥ ९ ॥ स्वभक्ताग्रगण्यैः
    कपीशैर्महीशै रनीकैरनेकैश्च राम प्रसीद । नमस्ते नमोऽस्त्वीश राम प्रसीद प्रशाधि प्रशाधि प्रकाशं प्रभो
    माम् ॥ १० ॥ त्वमेवासि दैवं परं मे यदेकं सुचैतन्यमेतत्त्वदन्यं न मन्ये । यतोऽभूदमेयं वियद्वायुतेजो
    जलोर्व्यादिकार्यं चरं चाचरं च ॥ ११ ॥ नमः सच्चिदानन्दरूपाय तस्मै नमो देवदेवाय रामाय तुभ्यम् । नमो जानकीजीवितेशाय
    तुभ्यं नमः पुण्डरीकायताक्षाय तुभ्यम् ॥ १२ ॥ नमो भक्तियुक्तानुरक्ताय तुभ्यं नमः पुण्यपुञ्जैकलभ्याय
    तुभ्यम् । नमो वेदवेद्याय चाद्याय पुंसे नमः सुन्दरायेन्दिरावल्लभाय ॥ १३ ॥ नमो विश्वकर्त्रे नमो विश्वहर्त्रे
    नमो विश्वभोक्त्रे नमो विश्वमात्रे । नमो विश्वनेत्रे नमो विश्वजेत्रे नमो विश्वपित्रे नमो विश्वमात्रे
    ॥ १४ ॥ नमस्ते नमस्ते समस्तप्रपञ्च प्रभागप्रयोगप्रमाणप्रवीण । मदीयं मनस्त्वत्पदद्वन्द्वसेवा विधातुं
    प्रवृत्तं सुचैतन्यसिद्ध्यै ॥ १५ ॥ शिलापि त्वदङ्घ्रिक्षमासङ्गिरेणु प्रसादाद्धि चैतन्यमाधत्त राम । नरस्त्वत्पदवन्द्वसेवाविधाना
    त्सुचैतन्यमेतीति किं चित्रमद्य ॥ १६ ॥ पवित्रं चरित्रं विचित्रं त्वदीयं नरा ये स्मरन्त्यन्वहं रामचन्द्र
    । भवन्तं भवान्तं भरन्तं भजन्तो लभन्ते कृतान्तं न पश्यन्त्यतोऽन्ते ॥ १७ ॥ स पुण्यः स गण्यः शरण्यो ममायं
    नरो वेद यो देवचूडामणिं त्वाम् । सदाकारमेकं चिदानन्दरूपं मनोवागगम्यं परन्धाम राम ॥ १८ ॥ प्रचण्डप्रतापप्रभावाभिभूत
    प्रभूतारिवीर प्रभो रामचन्द्र । बलं ते कथं वर्ण्यतेऽतीव बाल्ये यतोऽखण्डि चण्डीशकोदण्डदण्डम् ॥ १९ ॥
    दशग्रीवमुग्रं सपुत्रं समित्रं सरिद्दुर्गमध्यस्थरक्षोगणेशम् । भवन्तं विना राम वीरो नरो वा सुरो वामरो
    वा जयेत्कस्त्रिलोक्याम् ॥ २० ॥ सदा राम रामेति रामामृतं ते सदाराममानन्दनिष्यन्दकन्दम् । पिबन्तं नमन्तं
    सुदन्तं हसन्तं हनूमन्तमन्तर्भजे तं नितान्तम् ॥ २१ ॥ सदा राम रामेति रामामृतं ते सदाराममानन्दनिष्यन्दकन्दम्
    । पिबन्नन्वहं नन्वहं नैव मृत्यो र्बिभेमि प्रसादादसादात्तवैव ॥ २२ ॥ असीतासमेतैरकोदण्डभूषै रसौमित्रिवन्द्यैरचण्डप्रतापैः
    । अलङ्केशकालैरसुग्रीवमित्रै ररामाभिधेयैरलं दैवतैर्नः ॥ २३ ॥ अवीरासनस्थैरचिन्मुद्रिकाढ्यै रभक्ताञ्जनेयादितत्त्वप्रकाशैः
    । अमन्दारमूलैरमन्दारमालै ररामाभिधेयैरलं दैवतैर्नः ॥ २४ ॥ असिन्धुप्रकोपैरवन्द्यप्रतापै रबन्धुप्रयाणैरमन्दस्मिताढ्यैः
    । अदण्डप्रवासैरखण्डप्रबोधै ररामाभिधेयैरलं दैवतैर्नः ॥ २५ ॥ हरे राम सीतापते रावणारे खरारे मुरारेऽसुरारे
    परेति । लपन्तं नयन्तं सदाकालमेव समालोकयालोकयाशेषबन्धो ॥ २६ ॥ नमस्ते सुमित्रासुपुत्राभिवन्द्य नमस्ते
    सदा कैकयीनन्दनेड्य । नमस्ते सदा वानराधीशवन्द्य नमस्ते नमस्ते सदा रामचन्द्र ॥ २७ ॥ प्रसीद प्रसीद प्रचण्डप्रताप
    प्रसीद प्रसीद प्रचण्डारिकाल । प्रसीद प्रसीद प्रपन्नानुकम्पिन् प्रसीद प्रसीद प्रभो रामचन्द्र ॥ २८ ॥
    भुजङ्गप्रयातं परं वेदसारं मुदा रामचन्द्रस्य भक्त्या च नित्यम् । पठन्सन्ततं चिन्तयन्स्वान्तरङ्गे स
    एव स्वयं रामचन्द्रः स धन्यः ॥ २९ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य
    श्रीमच्छङ्करभगवतः कृतौ श्रीरामभुजङ्गप्रयातस्तोत्रम् सम्पूर्णम् ॥
