id: mahadevaproktamstavapradanastotram
category: stotram
name:
  english: mahadevaproktamstavapradanastotram
  devanagari: महादेवप्रोक्तंस्तवप्रदानस्तोत्रम्
content:
  english: rinu manmukhato mune | sarveshvarasya krishnasya bhaktimuktipradayi ca || 7|| navinajaladashyamam
    nilendivaralocanam | sharatparvanacandrasyamishaddhasyam manoharam || 8|| kotikandarpalavanyaliladhamamanoharam
    | ratnasimhasanastham tam ratnabhushanabhushitam || 9|| candanokshitasarvangam pitambaradharam varam
    | vikshyamanam ca gopibhih sasmitabhishca santatam || 10|| praphullamalatimalavanamalavibhushitam
    | dadhatam kundapushpadhyam cudam candrakacarccitam || 11|| prabham kshipantim nabhasashcandrataranvitasya
    ca | ratnabhushitasarvangam radhavakshahsthalasthitam || 12|| siddhendraishca munindraishca devendraih
    parisevitam | brahmavishnumaheshaishca shrutibhishca stutam bhaje || 13|| dhyanenanena tam dhyatva
    copacaramstu shodasha | dattva bhaktya ca sampujya sarvajnatvam labhetpuman || 14|| arghyam padyam
    casanam ca vasanam bhushanam tatha | gamarghyam madhuparkam ca yajnasutramanuttamam || 15|| dhupadipau
    ca naivedyam punaracamaniyakam | nanaprakarapushpani tambulam ca suvasitam || 16|| manoharam divyatalpam
    kasturyagarucandanaih | bhaktya bhagavate deyam malyam pushpanjalitrayam || 17|| tatah shadangam sampujya
    pashcatsampujayedganam | shridamanam sudamanam vasudamanameva ca || 18|| haribhanum candrabhanum suryabhanum
    subhanukam | parshadapravaransapta pujayedbhaktibhavatah || 19|| gopishvarim radhikam ca mulaprakritimishvarim
    | krishnashaktim krishnapujyam pujayedbhaktipurvakam || 20|| gopagopiganam shantam mam brahmanam ca
    parvatim | lakshmim sarasvatim prithvim sarvadevam saparshadam || 21|| devashatkam samabhyarcya punah
    pancopacaratah | pashcadevam kramenaiva shrikrishnam pujayetsudhih || 22|| ganesham ca dinesham ca
    vahnim vishnum shivam shivam | devashatkam samabhyarcya ceshtadevam ca pujayet || 23|| ganesham vighnanashaya
    vyadhinashaya bhaskaram | atmanah shuddhaye vahnim shrivishnum muktihetave || 24|| jnanaya shankaram
    durgam paramaishvaryahetave | sampujane phalamidam viparitamapujane || 25|| tatah kritva pariharamishtadevam
    ca bhaktitah | stotram ca samavedoktam pathedbhaktya ca tacchrinu || 26|| mahadeva uvaca | param brahma
    param dhama param jyotih sanatanam | nirliptam paramatmanam namamyakhilakaranam || 27|| sthulatsthulatamam
    devam sukshmatsukshmatamam param | sarvadrishyamadrishyam ca svecchacaram namamyaham || 28|| sakaram
    ca nirakaram sagunam nirgunam prabhum | sarvadharam ca sarvam ca sveccharupam namamyaham || 29|| ativa
    kamaniyam ca rupam nirupamam vibhum | karalarupamatyantam bibhratam pranamamyaham || 30|| karmanah
    karmarupam tam sakshinam sarvakarmanah | phalam ca phaladataram sarvarupam namamyaham || 31|| srashta
    pata ca samharta kalaya murtibhedatah | nanamurtih kalamshena yah pumamstam namamyaham || 32|| svayam
    prakritirupashca mayaya ca svayam puman | tayoh param svayam shashvattannamami paratparam || 33||
    stripunnapumsakam rupam yo bibharti svamayaya | svayam maya svayam mayi yo devastam namamyaham ||
    34|| tarakam sarvaduhkhanam sarvakaranakaranam | dharakam sarvavishvanam sarvabijam namamyaham ||
    35|| tejasvinam raviryo hi sarvajatishu vadavah | nakshatranam ca yashcandrastam namami jagatprabhum
    || 36|| rudranam vaishnavanam ca jnaninam yo hi shankarah | naganam yo hi sheshashca tam namami jagatpatim
    || 37|| prajapatinam yo brahma siddhanam kapilah svayam | sanatkumaro munishu tam namami jagadgurum
    || 38|| devanam yo hi vishnushca devinam prakritih svayam | svayambhuvo manunam yo manaveshu ca vaishnavah
    | narinam shatarupa ca bahurupam namamyaham || 39|| ritunam yo vasantashca masanam margashirshakah
    | ekadashi tithinam ca namamyakhilarupinam || 40|| sagarah saritam yashca parvatanam himalayah | vasundhara
    sahishnunam tam sarvam pranamamyaham || 41|| patranam tulasipatram darurupeshu candanam | vrikshanam
    kalpavriksho yastam namami jagatpatim || 42|| pushpanam parijatashca sasyanam dhanyameva ca | amritam
    bhakshyavastunam nanarupam namamyaham || 43|| airavato gajendranam vainateyashca pakshinam | kamadhenushca
    dhenunam sarvarupam namamyaham || 44|| taijasanam suvarnam ca dhanyanam yava eva ca | yah kesari pashunam
    ca vararupam namamyaham || 49|| yakshanam ca kubero yo grahanam ca brihaspatih | dikpalanam mahendrashca
    tam namami param varam || 46|| vedasanghashca shastranam panditanam sarasvati | aksharanamakaro yastam
    pradhanam namamyaham || 47|| mantranam vishnumantrashca tirthanam jahnavi svayam | indriyanam mano
    yo hi sarvashreshtham namamyaham || 48|| sudarshanam ca shastranam vyadhinam vaishnavo jvarah | tejasam
    brahmatejashca varenyam tam namamyaham || 49|| balam yo vai balavatam mano vai shighragaminam | kalah
    kalayatam yo hi tam namami vilakshanam || 50|| jnanadata gurunam ca matrirupashca bandhushu | mitreshu
    janmadata yastam saram pranamamyaham || 51|| shilpinam vishvakarma yah kamadevashca rupinam | pativrata
    ca patninam namasyam tam namamyaham || 52|| priyeshu putrarupo yo nriparupo nareshu ca | shalagramashca
    yantranam tam vishishtam namamyaham || 53|| dharmmah kalyanabijanam vedanam samavedakah | dharmanam
    satyarupo yo vishishtam tam namamyaham || 54|| jale shaityasvarupo yo gandharupashca bhumishu | shabdarupashca
    gagane tam pranamya namamyaham || 55|| kratunam rajasuyo yo gayatri chandasam ca yah | gandharvanam
    citrarathastam garishtham namamyaham || 56|| kshirasvarupo gavyanam pavitranam ca pavakah | punyadanam
    ca yah stotram tam namami shubhapradam || 57|| trinanam kusharupo yo vyadhirupashca vairinam | gunanam
    shantarupo yashcitrarupam namamyaham || 58|| tejorupo jnanarupah sarvarupashca yo mahan | sarvanirvacaniyam
    ca tam namami svayam vibhum || 59|| sarvadhareshu yo vayuryatha''tma nityarupinam | akasho vyapakanam
    yo vyapakam tam namamyaham || 60|| vedanirvacaniyam yanna stotum panditah kshamah | yadanirvacaniyam
    ca ko va tatstotumishvarah || 61|| veda na shakta yam stotum jadibhuta sarasvati | tam ca vanmanasaparam
    ko vidvan stotumishvarah || 62|| shuddhatejassvarupam ca bhaktanugrahavigraham | ativa kamaniyam ca
    shyamarupam namamyaham || 63|| dvibhujam muralivaktram kishoram sasmitam muda | shashvadgopanganabhishca
    vikshyamanam namamyaham || 64|| radhaya dattatambulam bhuktavantam manoharam | ratnasimhasanastham
    ca tamisham pranamamyaham || 65|| ratnabhushanabhushadhyam sevitam shvetacamaraih | parshadapravarairgopakumaraistam
    namamyaham || 66|| vrindavanantare ramye rasollasasamutsukam | rasamandalamadhyastham namami rasikeshvaram
    || 67|| shatasha
  devanagari: ृणु मन्मुखतो मुने । सर्वेश्वरस्य कृष्णस्य भक्तिमुक्तिप्रदायि च ॥ ७॥ नवीनजलदश्यामं नीलेन्दीवरलोचनम्
    । शरत्पार्वणचन्द्रास्यमीषद्धास्यं मनोहरम् ॥ ८॥ कोटिकन्दर्पलावण्यलीलाधाममनोहरम् । रत्नसिंहासनस्थं तं
    रत्नभूषणभूषितम् ॥ ९॥ चन्दनोक्षितसर्वाङ्गं पीताम्बरधरं वरम् । वीक्ष्यमाणं च गोपीभिः सस्मिताभिश्च सन्ततम्
    ॥ १०॥ प्रफुल्लमालतीमालावनमालाविभूषितम् । दधतं कुन्दपुष्पाढ्यां चूडां चन्द्रकचर्च्चिताम् ॥ ११॥ प्रभां
    क्षिपन्तीं नभसश्चन्द्रतारान्वितस्य च । रत्नभूषितसर्वाङ्गं राधावक्षःस्थलस्थितम् ॥ १२॥ सिद्धेन्द्रैश्च
    मुनीन्द्रैश्च देवेन्द्रैः परिसेवितम् । ब्रह्मविष्णुमहेशैश्च श्रुतिभिश्च स्तुतं भजे ॥ १३॥ ध्यानेनानेन
    तं ध्यात्वा चोपचारांस्तु षोडश । दत्त्वा भक्त्या च सम्पूज्य सर्वज्ञत्वं लभेत्पुमान् ॥ १४॥ अर्घ्यं पाद्यं
    चासनं च वसनं भूषणं तथा । गामर्घ्यं मधुपर्कं च यज्ञसूत्रमनुत्तमम् ॥ १५॥ धूपदीपौ च नैवेद्यं पुनराचमनीयकम्
    । नानाप्रकारपुष्पाणि ताम्बूलं च सुवासितम् ॥ १६॥ मनोहरं दिव्यतल्पं कस्तूर्यगरुचन्दनैः । भक्त्या भगवते
    देयं माल्यं पुष्पाञ्जलित्रयम् ॥ १७॥ ततः षडङ्गं सम्पूज्य पश्चात्सम्पूजयेद्गणम् । श्रीदामानं सुदामानं
    वसुदामानमेव च ॥ १८॥ हरिभानुं चन्द्रभानुं सूर्यभानुं सुभानुकम् । पार्षदप्रवरान्सप्त पूजयेद्भक्तिभावतः
    ॥ १९॥ गोपीश्वरीं राधिकां च मूलप्रकृतिमीश्वरीम् । कृष्णशक्तिं कृष्णपूज्यां पूजयेद्भक्तिपूर्वकम् ॥ २०॥
    गोपगोपीगणं शान्तं मां ब्रह्माणं च पार्वतीम् । लक्ष्मीं सरस्वतीं पृथ्वीं सर्वदेवं सपार्षदम् ॥ २१॥ देवषट्कं
    समभ्यर्च्य पुनः पञ्चोपचारतः । पश्चादेवं क्रमेणैव श्रीकृष्णं पूजयेत्सुधीः ॥ २२॥ गणेशं च दिनेशं च वह्निं
    विष्णुं शिवं शिवाम् । देवषट्कं समभ्यर्च्य चेष्टदेवं च पूजयेत् ॥ २३॥ गणेशं विघ्ननाशाय व्याधिनाशाय भास्करम्
    । आत्मनः शुद्धये वह्निं श्रीविष्णुं मुक्तिहेतवे ॥ २४॥ ज्ञानाय शङ्करं दुर्गां परमैश्वर्यहेतवे । सम्पूजने
    फलमिदं विपरीतमपूजने ॥ २५॥ ततः कृत्वा परीहारमिष्टदेवं च भक्तितः । स्तोत्रं च सामवेदोक्तं पठेद्भक्त्या
    च तच्छृणु ॥ २६॥ महादेव उवाच । परं ब्रह्म परं धाम परं ज्योतिः सनातनम् । निर्लिप्तं परमात्मानं नमाम्यखिलकारणम्
    ॥ २७॥ स्थूलात्स्थूलतमं देवं सूक्ष्मात्सूक्ष्मतमं परम् । सर्वदृश्यमदृश्यं च स्वेच्छाचारं नमाम्यहम्
    ॥ २८॥ साकारं च निराकारं सगुणं निर्गुणं प्रभुम् । सर्वाधारं च सर्वं च स्वेच्छारूपं नमाम्यहम् ॥ २९॥
    अतीव कमनीयं च रूपं निरुपमं विभुम् । करालरूपमत्यन्तं बिभ्रतं प्रणमाम्यहम् ॥ ३०॥ कर्मणः कर्मरूपं तं
    साक्षिणं सर्वकर्मणः । फलं च फलदातारं सर्वरूपं नमाम्यहम् ॥ ३१॥ स्रष्टा पाता च संहर्ता कलया मूर्तिभेदतः
    । नानामूर्तिः कलांशेन यः पुमांस्तं नमाम्यहम् ॥ ३२॥ स्वयं प्रकृतिरूपश्च मायया च स्वयं पुमान् । तयोः
    परं स्वयं शश्वत्तन्नमामि परात्परम् ॥ ३३॥ स्त्रीपुन्नपुंसकं रूपं यो बिभर्ति स्वमायया । स्वयं माया स्वयं
    मायी यो देवस्तं नमाम्यहम् ॥ ३४॥ तारकं सर्वदुःखानां सर्वकारणकारणम् । धारकं सर्वविश्वानां सर्वबीजं नमाम्यहम्
    ॥ ३५॥ तेजस्विनां रविर्यो हि सर्वजातिषु वाडवः । नक्षत्राणां च यश्चन्द्रस्तं नमामि जगत्प्रभुम् ॥ ३६॥
    रुद्राणां वैष्णवानां च ज्ञानिनां यो हि शङ्करः । नागानां यो हि शेषश्च तं नमामि जगत्पतिम् ॥ ३७॥ प्रजापतीनां
    यो ब्रह्मा सिद्धानां कपिलः स्वयम् । सनत्कुमारो मुनिषु तं नमामि जगद्गुरुम् ॥ ३८॥ देवानां यो हि विष्णुश्च
    देवीनां प्रकृतिः स्वयम् । स्वायम्भुवो मनूनां यो मानवेषु च वैष्णवः । नारीणां शतरूपा च बहुरूपं नमाम्यहम्
    ॥ ३९॥ ऋतूनां यो वसन्तश्च मासानां मार्गशीर्षकः । एकादशी तिथीनां च नमाम्यखिलरूपिणम् ॥ ४०॥ सागरः सरितां
    यश्च पर्वतानां हिमालयः । वसुन्धरा सहिष्णूनां तं सर्वं प्रणमाम्यहम् ॥ ४१॥ पत्राणां तुलसीपत्रं दारुरूपेषु
    चन्दनम् । वृक्षाणां कल्पवृक्षो यस्तं नमामि जगत्पतिम् ॥ ४२॥ पुष्पाणां पारिजातश्च सस्यानां धान्यमेव
    च । अमृतं भक्ष्यवस्तूनां नानारूपं नमाम्यहम् ॥ ४३॥ ऐरावतो गजेन्द्राणां वैनतेयश्च पक्षिणाम् । कामधेनुश्च
    धेनूनां सर्वरूपं नमाम्यहम् ॥ ४४॥ तैजसानां सुवर्णं च धान्यानां यव एव च । यः केसरी पशूनां च वररूपं नमाम्यहम्
    ॥ ४९॥ यक्षाणां च कुबेरो यो ग्रहाणां च बृहस्पतिः । दिक्पालानां महेन्द्रश्च तं नमामि परं वरम् ॥ ४६॥
    वेदसङ्घश्च शास्त्राणां पण्डितानां सरस्वती । अक्षराणामकारो यस्तं प्रधानं नमाम्यहम् ॥ ४७॥ मन्त्राणां
    विष्णुमन्त्रश्च तीर्थानां जाह्नवी स्वयम् । इन्द्रियाणां मनो यो हि सर्वश्रेष्ठं नमाम्यहम् ॥ ४८॥ सुदर्शनं
    च शस्त्राणां व्याधिनां वैष्णवो ज्वरः । तेजसां ब्रह्मतेजश्च वरेण्यं तं नमाम्यहम् ॥ ४९॥ बलं यो वै बलवतां
    मनो वै शीघ्रगामिनाम् । कालः कलयतां यो हि तं नमामि विलक्षणम् ॥ ५०॥ ज्ञानदाता गुरूणां च मातृरूपश्च बन्धुषु
    । मित्रेषु जन्मदाता यस्तं सारं प्रणमाम्यहम् ॥ ५१॥ शिल्पीनां विश्वकर्मा यः कामदेवश्च रूपिणाम् । पतिव्रता
    च पत्नीनां नमस्यं तं नमाम्यहम् ॥ ५२॥ प्रियेषु पुत्ररूपो यो नृपरूपो नरेषु च । शालग्रामश्च यन्त्राणां
    तं विशिष्टं नमाम्यहम् ॥ ५३॥ धर्म्मः कल्याणबीजानां वेदानां सामवेदकः । धर्माणां सत्यरूपो यो विशिष्टं
    तं नमाम्यहम् ॥ ५४॥ जले शैत्यस्वरूपो यो गन्धरूपश्च भूमिषु । शब्दरूपश्च गगने तं प्रणम्य नमाम्यहम् ॥
    ५५॥ क्रतूनां राजसूयो यो गायत्री छन्दसां च यः । गन्धर्वाणां चित्ररथस्तं गरिष्ठं नमाम्यहम् ॥ ५६॥ क्षीरस्वरूपो
    गव्यानां पवित्राणां च पावकः । पुण्यदानां च यः स्तोत्रं तं नमामि शुभप्रदम् ॥ ५७॥ तृणानां कुशरूपो यो
    व्याधिरूपश्च वैरिणाम् । गुणानां शान्तरूपो यश्चित्ररूपं नमाम्यहम् ॥ ५८॥ तेजोरूपो ज्ञानरूपः सर्वरूपश्च
    यो महान् । सर्वानिर्वचनीयं च तं नमामि स्वयं विभुम् ॥ ५९॥ सर्वाधारेषु यो वायुर्यथाऽऽत्मा नित्यरूपिणाम्
    । आकाशो व्यापकानां यो व्यापकं तं नमाम्यहम् ॥ ६०॥ वेदानिर्वचनीयं यन्न स्तोतुं पण्डितः क्षमः । यदनिर्वचनीयं
    च को वा तत्स्तोतुमीश्वरः ॥ ६१॥ वेदा न शक्ता यं स्तोतुं जडीभूता सरस्वती । तं च वाङ्मनसापारं को विद्वान्
    स्तोतुमीश्वरः ॥ ६२॥ शुद्धतेजस्स्वरूपं च भक्तानुग्रहविग्रहम् । अतीव कमनीयं च श्यामरूपं नमाम्यहम् ॥
    ६३॥ द्विभुजं मुरलीवक्त्रं किशोरं सस्मितं मुदा । शश्वद्गोपाङ्गनाभिश्च वीक्ष्यमाणं नमाम्यहम् ॥ ६४॥ राधया
    दत्तताम्बूलं भुक्तवन्तं मनोहरम् । रत्नसिंहासनस्थं च तमीशं प्रणमाम्यहम् ॥ ६५॥ रत्नभूषणभूषाढ्यं सेवितं
    श्वेतचामरैः । पार्षदप्रवरैर्गोपकुमारैस्तं नमाम्यहम् ॥ ६६॥ वृन्दावनान्तरे रम्ये रासोल्लाससमुत्सुकम्
    । रासमण्डलमध्यस्थं नमामि रसिकेश्वरम् ॥ ६७॥ शतश
