id: kyts-jata-3-2-yo-vai-pavamanaanaam-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 3.2 Yo Vai Pavamanaanaam - Krishna Yajurveda Taittiriya Samhita
content:
  english: m ~vai vai pavamananam | te 'vavac chidyate | na shchidyate chidyate shye trachanda asyasi
    gaya shtupchanda asyasi tri m ~vai vai pavamananam | te 'vavac chidyate | yo ya shchidyate chidyate
    graha grihyante grihyante nte 'thatha grihyante grihya tva 'grihi tvopaku vic chindyac chindya d vi
    vic chindyat | || nchindyac chindya vic chidyeta chidyeta magrihita shchidyeta chidye topaya magrihito
    'sya syupaya japataye tva tva pra vebhya stva tva de ntyavava lumpanti | mavadviryani karoti karoti
    sa mavadviryani karoti | dvau dvau karoti karoti ntya tyati yanti | ntya tyati yanti | nyam ~yanti
    ya ntya haya datte datte anu vai yad yad vai vai yat | asura akurvata kurva te te 'kurvata kurvata
    tra matanvata tanvata gniho ta makurvata kurvata vra ttasma dakurvata kurvata shu makurvata kurvata
    pa shya makurvata kurvata da shu makurvata kurvata pa va makurvata kurvata vaishvade na makurvatakurvata
    pratassava sa nakurvata kurvata varunapragha mmaddhyandinam ~varunapragha na makurvata kurvata tritiyasava
    nta makurvata kurvata vya vai va addhvarta bhratrivyo 'syasya bhratrivyo bhavati bhavati sya cchinnasya
    te | viryasya rayipate rayipate su tarah syama syama dadi naya pavasva pavasva pa va tarpayati tarpaya
    tye sa sa tarpayati tarpayati sakamah pavate pavate brahmavarca va tarpayati tarpaya tye sa sa tarpayati
    tarpayati va tarpayati tarpaya tye sa sa tarpayati tarpayati va tarpayati tarpaya tye sa sa tarpayati
    tarpayati mupopa hvayaddhvam | jna stishthate tishthate ya vava sa sa vava vava sah | tmanah sarpati
    sarpa tya tmanah sarpati sarpa tya ma nir nir ma ma nih | r nir nir vadhih | yasya shaste shasta indri
    ryasya nirghataya | ya sta sta yo ya stah | tasta arpaya ntyarpayanti ta yo ya sta sta yah | dhe riccha
    tyricchati dri ma ma dvarau dvarau vya he 'he daidhishavya | vyo dud daidhishavya daidhisha shthato
    'ta stishtha | nyasya tishtha tishtha dyadya dyavaprithivi dyavaprithivi a pra sarpanti sarpanti te
    te sarpanti sarpanti mbhuyasta bhuyasta yu ste titi bhuyasta bhuya tmanah sarpati sarpa tya tvaya
    visha visha dirghayu stvayeti suprajah yah purovaso purovaso pri somasya tripyatu tripyatu ndra tripyatu
    tripyatu ma somasya tripyatu tripyatu pra pra harivarna harivarna ma ma bibhisho bibhisho sha vadhir
    vadhi stvi trachandasah pratassava sye ndrapitasya gaya upahuto bhakshayami bhakshaya ganasya bhakshayami
    bhakshayami ru maddhyandinasya mati sye ndrapitasya tri upahuto bhakshayami bhakshaya ganasya bhakshayami
    bhakshaya myadi upahuto bhakshayami bhakshaya mpyayasva pyayasva ma ma tishthasva tishthasva martyasya
    mrita mrita va mashvina 'shvina yu tastomasya soma soma stu upahuto bhakshayami bhakshaya jaya purayata
    purayata pra ye ye prapitamaha prapitamaha anvatra tra nva nvatra | ro 'tratra pitarah | mpitarah
    pitaro yathabha nyave pitarah pitaro ma vasishtha bhuyasta bhuyasta ye ye bhuyasta bhuyasta shyakrita
    syasyasi manu upahuto bhakshayami bhakshaya dyadya prishatinam | ti shcakrame cakrame bhu tena varddhatam
    ~varddhata tasya varddhatam ~varddhata r jyotir gamyad gamya tavanta mindre ndra rja grihnami grihna
    myu rjorja grihnami | mayuka asyasya pra tasya skandanti skanda ntye yasya skandanti skandanti punar
    grihnati grihnati no grihnati grihnati pra tasya skandati skanda tye yasya skandati skandati punar
    grihnati grihnati dhaya grihnati grihna tyava ngrihnati grihna tya m ~vai vai hiranyam | ne dadhati
    dadhati pra prati tishthati tishthati tyo ghrapayati ghrapayati prajapa tyo 'shvo 'shvah prajapa r
    yone rasma asmai vi vi mimite mimite jna shchidyate chidyate ya yasya chidyate chidyate punar grihnati
    grihnati jno grihnati grihnati ya hma ''yushmatyah | strasya gamyad gamya ccha ngamyad gamya ccha
    yavanto gamyad gamya dindri yavanto vanamahe vanamaha indri mahi vanamahe vanamahe dhukshi veshu bhuyad
    bhuyad de mbhuyad bhuyad brahmavarca shtve shtva papiyan | shtve shtva vasiyan | tasya bhavati bhavati
    stu strasya gamyad gamya ccha ngamyad gamya ccha dititi gamyad gamya shtve shtva vasiyan | shvakarma
    srijatu srijatu vi ntam ~vishvakarmann | npra pra vishvakarman staye munca munca sva shvakarma krinotu
    krinotu vi enasah papayishta papayi m ~yo yo dakshinam | yad yad vrishcyeta vrishcyeta tprinati prinati
    sme prinati prina tya sme devaso devaso a vapushe devaso devaso vapushe cikithsata cikithsata ncikithsata
    cikithsata tro jayate jayate pu ndate jayate jayate vi ma mashnuta mashnutam ~va arishto ashnuta mashnuta
    na indre ndra krinva pari grihnami grihnami vishve grihnami grihnami pra cyavayantu cyavayantu pra
    pra cyavayantu | vi cyavayantu cyavayantu di yad vai vai yad yad vai | bhi pra prabhyabhi pra | pra
    vartayati vartayati ukthasha vartayati vartaya mmaddhyandina mahaha vaiva maddhyandine | dino dhatte
    dhatte brahmava dino vadanti vadanti brahmava ryur vai va addhva maddhyandina indri mmaddhyandina
    mahaha mmaddhyandina mindri vaiva maddhyandine | yad yad dhatte dhatte yad vai vai yad yad vai | ra
    dasyasya sam~vathsa yad yad yadabhipratigrini ntyupopa jivanti | yad yaj jivanti jivanti ntyupopa
    jivanti | yad yaj jivanti jivanti tpran pran yad ya h pran pranasinah | ja jayante jayante pra yad
    yaj jayante jayante yad vai vai yad yad vai | bhi pra prabhyabhi pra | pra vartayati vartayati n paran
    vartayati vartayati m ~vajram ~vartate vartate magrihito 'sya syupaya vasya ddhyakshabhya vasya ddhyakshabhyam
    | magrihito grihnami grihna myupaya magrihito 'sya syupaya shpabhya masyasi cakshu vasya ddhyakshabhya
    vasya ddhyakshabhyam | magrihito grihnami grihna myupaya magrihito 'sya syupaya pabhya masyasi shrotra
    vasya ddhyakshabhya vasya ddhyakshabhyam | vebhyo grihnami grihnami de vebhya stva tva de shvadevebhya
    stva tva vi shvadevebhya stva tva vi shvadevebhya stva | vebhya stva tva de vishna vurukramo rukrama
    dasa tyashvina vashvina vabhi yatha padayami padayami pra sa sa pra pra sah | virabhi starati tarati
    su r vajakarmabhi starati tarati tri tryagne 'gne hva ritajata rtajata ji indravishnu hinomi hino
    bha jigyathur jigyathu ru r na na jigyathur jigyathu ro jigye jigye kata yad yad vishno vishno m ~yad
    yadapaspridhetham | sro jatavedo jataveda sti kshyavo 'vo yakshi | tra mabravi dabravid vri ram ~vishno
    vishno vita
  devanagari: ं ँवै वै पव॑मानानाम् । ते ऽवाव॑च् छिद्यते । न श्छि॑द्यते छिद्यते श्ये त्रछ॑न्दा अस्यसि गाय
    ष्टुप्छ॑न्दा अस्यसि त्रि ं ँवै वै पव॑मानानाम् । ते ऽवाव॑च् छिद्यते । यो य श्छि॑द्यते छिद्यते ग्रहा॑
    गृह्यन्ते गृह्यन्ते न्ते ऽथाथ॑ गृह्यन्ते गृह्य त्वा ऽगृ॑ही त्वोपाकु विच् छि॑न्द्याच् छिन्द्या द् वि
    विच् छि॑न्द्यात् । ॥ ञ्छि॑न्द्याच् छिन्द्या विच् छि॑द्येत छिद्येत मगृ॑हीत श्छिद्येत छिद्ये तोपया मगृ॑हीतो
    ऽस्य स्युपया जाप॑तये त्वा त्वा प्र वेभ्य॑ स्त्वा त्वा दे न्त्यवाव॑ लुम्पन्ति । माव॑द्वीर्याणि करोति
    करोति स माव॑द्वीर्याणि करोति । द्वौ द्वौ क॑रोति करोति न्त्य त्यति॑ यन्ति । न्त्य त्यति॑ यन्ति । न्यं
    ँय॑न्ति य न्त्य हाय॑ दत्ते दत्ते अनु वै यद् यद् वै वै यत् । असु॑रा अकुर्वता कुर्व ते ते॑ ऽकुर्वता
    कुर्वत त्र म॑तन्वता तन्वता ग्निहो त म॑कुर्वता कुर्वत व्र त्तस्मा॑ दकुर्वता कुर्वत शु म॑कुर्वता कुर्वत
    प श्य म॑कुर्वता कुर्वत दा शु म॑कुर्वता कुर्वत प व म॑कुर्वता कुर्वत वैश्वदे न म॑कुर्वताकुर्वत प्रातस्सव
    सा न॑कुर्वता कुर्वत वरुणप्रघा म्माद्ध्य॑न्दिनं ँवरुणप्रघा न म॑कुर्वता कुर्वत तृतीयसव न्त म॑कुर्वता
    कुर्वत व्या वै वा अ॑द्ध्वर्त भ्रातृ॑व्यो ऽस्यास्य भ्रातृ॑व्यो भवति भवति स्या च्छि॑न्नस्य ते । वीर्य॑स्य
    रयिपते रयिपते सु तारः॑ स्याम स्याम ददि नाय॑ पवस्व पवस्वा पा व त॑र्पयति तर्पय त्ये स स त॑र्पयति तर्पयति
    सका॑मः पवते पवते ब्रह्मवर्च व त॑र्पयति तर्पय त्ये स स त॑र्पयति तर्पयति व त॑र्पयति तर्पय त्ये स स त॑र्पयति
    तर्पयति व त॑र्पयति तर्पय त्ये स स त॑र्पयति तर्पयति मुपोप॑ ह्वयद्ध्वम् । ज्ञ स्ति॑ष्ठते तिष्ठते य वाव
    स स वाव वाव सः । त्मनः॑ सर्पति सर्प त्या त्मनः॑ सर्पति सर्प त्या मा निर् णिर् मा मा निः । र् निर्
    णिर् व॑धीः । यस्य॑ शास्ते शास्त इन्द्रि र्य॑स्या नि॑र्घाताय । य स्ता स्ता यो य स्ताः । तास्ता अ॑र्पय
    न्त्यर्पयन्ति ता यो य स्ता स्ता यः । ढे ऋ॑च्छ त्यृच्छति दृ मा मा द्वा॑रौ द्वारौ व्या हे ऽहे॑ दैधिषव्य
    । व्यो दुद् दै॑धिषव्य दैधिष ष्ठातो ऽत॑ स्तिष्ठ । न्यस्य॑ तिष्ठ तिष्ठा द्याद्य द्या॑वापृथिवी द्यावापृथिवी
    अ प्र स॑र्पन्ति सर्पन्ति ते ते स॑र्पन्ति सर्पन्ति म्भू॑यास्त भूयास्त यू स्ते तीति॑ भूयास्त भूया त्मनः॑
    सर्पति सर्प त्या त्वाय॑ विश विश दीर्घायु स्त्वायेति॑ सुप्रजाः यः पु॑रोवसो पुरोवसो प्रि सोम॑स्य तृप्यतु
    तृप्यतु न्द्रा तृ॑प्यतु तृप्यतु म सोम॑स्य तृप्यतु तृप्यतु प्र प्र ह॑रिवर्ण हरिवर्ण मा मा बी॑भिषो बीभिषो
    षा व॑धीर् वधी स्त्वि त्रछ॑न्दसः प्रातस्सव स्ये न्द्र॑पीतस्य गाय उप॑हूतो भक्षयामि भक्षया गणस्य भक्षयामि
    भक्षयामि रु माद्ध्य॑न्दिनस्य मति स्ये न्द्र॑पीतस्य त्रि उप॑हूतो भक्षयामि भक्षया गणस्य भक्षयामि भक्षया
    म्यादि उप॑हूतो भक्षयामि भक्षया म्प्या॑यस्व प्यायस्व मा मा ति॑ष्ठस्व तिष्ठस्व मर्त्य॑स्या मृता मृत
    व म॑श्विना ऽश्विना यु तस्तो॑मस्य सोम सोम स्तु उप॑हूतो भक्षयामि भक्षया जया॑ पूरयत पूरयत प्र ये ये प्र॑पितामह
    प्रपितामह अन्वत्रा त्रा न्व न्वत्र॑ । रो ऽत्रात्र॑ पितरः । म्पि॑तरः पितरो यथाभा न्यवे॑ पितरः पितरो
    म वसि॑ष्ठा भूयास्त भूयास्त ये ये भू॑यास्त भूयास्त ष्य॑कृत स्यास्यसि मनु उप॑हूतो भक्षयामि भक्षया द्याद्य
    पृष॑तीनाम् । ति श्च॑क्रमे चक्रमे भू तेन॑ वर्द्धतां ँवर्द्धता तस्य॑ वर्द्धतां ँवर्द्धता र् ज्योति॑र्
    गम्याद् गम्या ताव॑न्त मिन्द्रे न्द्र र्जा गृ॑ह्णामि गृह्णा म्यू र्जोर्जा गृ॑ह्णामि । मायु॑का अस्यास्य
    प्र तस्य॑ स्कन्दन्ति स्कन्द न्त्ये यस्य॑ स्कन्दन्ति स्कन्दन्ति पुन॑र् गृह्णाति गृह्णाति णो गृ॑ह्णाति
    गृह्णाति प्रा तस्य॑ स्कन्दति स्कन्द त्ये यस्य॑ स्कन्दति स्कन्दति पुन॑र् गृह्णाति गृह्णाति धाय॑ गृह्णाति
    गृह्णा त्यव ङ्गृह्णाति गृह्णा त्य ं ँवै वै हिर॑ण्यम् । णे द॑धाति दधाति प्रा प्रति॑ तिष्ठति तिष्ठति
    त्यो घ्रा॑पयति घ्रापयति प्राजाप त्यो ऽश्वो ऽश्वः॑ प्राजाप र् योने॑ रस्मा अस्मै वि वि मि॑मीते मिमीते
    ज्ञ श्छि॑द्यते छिद्यते य यस्य॑ छिद्यते छिद्यते पुन॑र् गृह्णाति गृह्णाति ज्ञो गृ॑ह्णाति गृह्णाति य
    ह्मा ऽऽयु॑ष्मत्याः । स्त्रस्य॑ गम्याद् गम्या च्छ ङ्ग॑म्याद् गम्या च्छ याव॑न्तो गम्याद् गम्या दिन्द्रि
    याव॑न्तो वनामहे वनामह इन्द्रि महि॑ वनामहे वनामहे धुक्षी वेषु॑ भूयाद् भूयाद् दे म्भू॑याद् भूयाद् ब्रह्मवर्च
    ष्ट्वे ष्ट्वा पापी॑यान् । ष्ट्वे ष्ट्वा वसी॑यान् । तस्य॑ भवति भवति स्तु स्त्रस्य॑ गम्याद् गम्या च्छ
    ङ्ग॑म्याद् गम्या च्छ दितीति॑ गम्याद् गम्या ष्ट्वे ष्ट्वा वसी॑यान् । श्वक॑र्मा सृजतु सृजतु वि न्तं
    ँवि॑श्वकर्मन्न् । न्प्र प्र वि॑श्वकर्मन् स्तये॑ मुञ्च मुञ्चा स्व श्वक॑र्मा कृणोतु कृणोतु वि एन॑सः
    पापयिष्ट पापयि ं ँयो यो दक्षि॑णाम् । यद् यद् वृ॑श्च्येत वृश्च्येत त्प्री॑णाति प्रीणाति स्मे प्री॑णाति
    प्रीणा त्य स्मे दे॑वासो देवासो अ वपु॑षे देवासो देवासो वपु॑षे चिकिथ्सत चिकिथ्सत ञ्चि॑किथ्सत चिकिथ्सत
    त्रो जा॑यते जायते पु न्दते॑ जायते जायते वि म म॑श्ञुता मश्ञुतां ँवा अरि॑ष्टो अश्ञुता मश्ञुता न इ॑न्द्रे
    न्द्र कृण्वा परि॑ गृह्णामि गृह्णामि विश्वे॑ गृह्णामि गृह्णामि प्र च्या॑वयन्तु च्यावयन्तु प्र प्र च्या॑वयन्तु
    । वि च्या॑वयन्तु च्यावयन्तु दि यद् वै वै यद् यद् वै । भि प्र प्राभ्य॑भि प्र । प्र व॑र्तयति वर्तयति
    उक्थ॑शा वर्तयति वर्तय म्माद्ध्य॑न्दिन माहाह वैव माद्ध्य॑न्दिने । दिनो॑ धत्ते धत्ते ब्रह्मवा दिनो॑
    वदन्ति वदन्ति ब्रह्मवा र्युर् वै वा अ॑द्ध्व माद्ध्य॑न्दिन इन्द्रि म्माद्ध्य॑न्दिन माहाह म्माद्ध्य॑न्दिन
    मिन्द्रि वैव माद्ध्य॑न्दिने । यद् यद् ध॑त्ते धत्ते यद् वै वै यद् यद् वै । रा द॑स्यास्य संँवथ्स याद्
    यद् यद॑भिप्रतिगृणी न्त्युपोप॑ जीवन्ति । यद् यज् जी॑वन्ति जीवन्ति न्त्युपोप॑ जीवन्ति । यद् यज् जी॑वन्ति
    जीवन्ति त्प्राङ् प्राङ् यद् य ः प्राङ् प्राङासी॑नः । जा जा॑यन्ते जायन्ते प्र यद् यज् जा॑यन्ते जायन्ते
    यद् वै वै यद् यद् वै । भि प्र प्राभ्य॑भि प्र । प्र व॑र्तयति वर्तयति ङ् पराङ्॑ वर्तयति वर्तयति ं ँवज्रं॑
    ँवर्तते वर्तते मगृ॑हीतो ऽस्य स्युपया वस्या द्ध्य॑क्षाभ्या वस्या द्ध्य॑क्षाभ्याम् । मगृ॑हीतो गृह्णामि
    गृह्णा म्युपया मगृ॑हीतो ऽस्य स्युपया ष्पाभ्या॑ मस्यसि चक्षु वस्या द्ध्य॑क्षाभ्या वस्या द्ध्य॑क्षाभ्याम्
    । मगृ॑हीतो गृह्णामि गृह्णा म्युपया मगृ॑हीतो ऽस्य स्युपया पाभ्या॑ मस्यसि श्रोत्र वस्या द्ध्य॑क्षाभ्या
    वस्या द्ध्य॑क्षाभ्याम् । वेभ्यो॑ गृह्णामि गृह्णामि दे वेभ्य॑ स्त्वा त्वा दे श्वदे॑वेभ्य स्त्वा त्वा
    वि श्वदे॑वेभ्य स्त्वा त्वा वि श्वदे॑वेभ्य स्त्वा । वेभ्य॑ स्त्वा त्वा दे विष्ण॑ वुरुक्रमो रुक्रम दास॑
    त्यश्विना वश्विना वभि यथा॑ पादयामि पादयामि प्र स स प्र प्र सः । वीरा॑भि स्तरति तरति सु र् वाज॑कर्मभि
    स्तरति तरति त्री त्र्यग्ने ऽग्ने ह्वा ऋ॑तजात र्तजात जि इन्द्रा॑विष्णू हिनोमि हिनो भा जि॑ग्यथुर् जिग्यथु
    रु र् न न जि॑ग्यथुर् जिग्यथु रो जि॑ग्ये जिग्ये कत यद् यद् वि॑ष्णो विष्णो ं ँयद् यदप॑स्पृधेथाम् । स्रो
    जा॑तवेदो जातवेद स्ति क्ष्यवो ऽवो॑ यक्षि । त्र म॑ब्रवी दब्रवीद् वृ रं ँवि॑ष्णो विष्णो वित
