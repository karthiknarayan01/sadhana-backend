id: devaihkritam06devistotram
category: stotram
name:
  english: devaihkritam06devistotram
  devanagari: देवैःकृतं०६देवीस्तोत्रम्
content:
  english: devaih kritam 6 devistotram deva ucuh | namah shivayai kalyanyai shantyai pushtyai namo namah
    | bhagavatyai namo devyai rudranyai satatam namah || 23|| kalaratryai tathambayai indranyai te namo
    namah | siddhyai buddhyai tatha vriddhyai vaishnavyai te namo namah || 24|| prithivyam ya sthita prithvya
    na jnata prithivinca ya | antahsthita yamayati vande tamishvarim param || 25|| mayayam ya sthita jnata
    mayaya na ca tamajam | antahsthita prerayati prerayitrim numah shivam || 26|| kalyanam kuru bho matastrahi
    nah shatrutapitan | jahi papam hayarim tvam tejasa svena mohitam || 27|| khalam mayavinam ghoram strivadhyam
    varadarpitam | duhkhadam sarvadevanam nanarupadharam shatam || 28|| tvameka sarvadevanam sharanam
    bhaktavatsale | piditandanavenadya trahi devi namo'stu te || 29|| iti devibhagavate pancamaskandhe
    navamadhyayantargatam devaih kritam devistotram sampurnam | devibhagavatam | skandha 5| adhyaya 9
  devanagari: देवैः कृतं ६ देवीस्तोत्रम् देवा ऊचुः । नमः शिवायै कल्याण्यै शान्त्यै पुष्ट्यै नमो नमः ।
    भगवत्यै नमो देव्यै रुद्राण्यै सततं नमः ॥ २३॥ कालरात्र्यै तथाम्बायै इन्द्राण्यै ते नमो नमः । सिद्ध्यै
    बुद्ध्यै तथा वृद्ध्यै वैष्णव्यै ते नमो नमः ॥ २४॥ पृथिव्यां या स्थिता पृथ्व्या न ज्ञाता पृथिवीञ्च या
    । अन्तःस्थिता यमयति वन्दे तामीश्वरीं पराम् ॥ २५॥ मायायां या स्थिता ज्ञाता मायया न च तामजाम् । अन्तःस्थिता
    प्रेरयति प्रेरयित्रीं नुमः शिवाम् ॥ २६॥ कल्याणं कुरु भो मातस्त्राहि नः शत्रुतापितान् । जहि पापं हयारिं
    त्वं तेजसा स्वेन मोहितम् ॥ २७॥ खलं मायाविनं घोरं स्त्रीवध्यं वरदर्पितम् । दुःखदं सर्वदेवानां नानारूपधरं
    शतम् ॥ २८॥ त्वमेका सर्वदेवानां शरणं भक्तवत्सले । पीडितान्दानवेनाद्य त्राहि देवि नमोऽस्तु ते ॥ २९॥
    इति देवीभागवते पञ्चमस्कन्धे नवमाध्यायान्तर्गतं देवैः कृतं देवीस्तोत्रं सम्पूर्णम् । देवीभागवतम् ।
    स्कन्ध ५। अध्याय ९
