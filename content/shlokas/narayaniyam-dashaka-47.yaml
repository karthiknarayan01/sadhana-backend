id: narayaniyam-dashaka-47
category: stotram
name:
  english: Narayaniyam Dashaka 47
content:
  english: ekada dadhivimathakarinim mataram samupasedivan bhavan | stanyalolupataya nivarayannankametya
    papivan payodharau || || ardhapitakucakudmale tvayi snigdhahasamadhurananambuje | dugdhamisha dahane
    parisrutam dhartumashu janani jagama te || || samipitarasabhangasangatakrodhabharaparibhutacetasa|
    manthadandamupagrihya patitam hanta deva dadhibhajanam tvaya || || uccaladdhvanitamuccakaistada sannishamya
    janani samadruta | tvadyashovisaravaddadarsha sa sadya eva dadhi vistritam kshitau || || vedamargaparimargitam
    rusha tvamavikshya parimargayantyasau | sandadarsha sukritinyulukhale diyamananavanitamotave || ||
    tvam pragrihya bata bhitibhavanabhasurananasarojamashu sa | rosharushitamukhi sakhipuro bandhanaya
    rashanamupadade || || bandhumicchati yameva sajjanastam bhavantamayi bandhumicchati | sa niyujya rashanagunan
    bahun dvyangulonamakhilam kilaikshata || || vismitotsmitasakhijanekshitam svinnasannavapusham nirikshya
    tam | nityamuktavapurapyaho hare bandhameva kripaya'nvamanyathah || || sthiyatam ciramulukhale khaletyagata
    bhavanameva sa yada| pragulukhalabilantare tada sarpirarpitamadannavasthithah || || yadyapashasugamo
    vibho bhavan samyatah kimu sapashaya'naya | evamadi divijairabhishtuto vatanatha paripahi mam gadat
    ||
  devanagari: एकदा दधिविमाथकारिणीं मातरं समुपसेदिवान् भवान् । स्तन्यलोलुपतया निवारयन्नङ्कमेत्य पपिवान्
    पयोधरौ ॥ ॥ अर्धपीतकुचकुड्मले त्वयि स्निग्धहासमधुराननाम्बुजे । दुग्धमीश दहने परिस्रुतं धर्तुमाशु जननी
    जगाम ते ॥ ॥ सामिपीतरसभङ्गसङ्गतक्रोधभारपरिभूतचेतसा। मन्थदण्डमुपगृह्य पाटितं हन्त देव दधिभाजनं त्वया
    ॥ ॥ उच्चलद्ध्वनितमुच्चकैस्तदा सन्निशम्य जननी समाद्रुता । त्वद्यशोविसरवद्ददर्श सा सद्य एव दधि विस्तृतं
    क्षितौ ॥ ॥ वेदमार्गपरिमार्गितं रुषा त्वमवीक्ष्य परिमार्गयन्त्यसौ । सन्ददर्श सुकृतिन्युलूखले दीयमाननवनीतमोतवे
    ॥ ॥ त्वां प्रगृह्य बत भीतिभावनाभासुराननसरोजमाशु सा । रोषरूषितमुखी सखीपुरो बन्धनाय रशनामुपाददे ॥ ॥
    बन्धुमिच्छति यमेव सज्जनस्तं भवन्तमयि बन्धुमिच्छती । सा नियुज्य रशनागुणान् बहून् द्व्यङ्गुलोनमखिलं
    किलैक्षत ॥ ॥ विस्मितोत्स्मितसखीजनेक्षितां स्विन्नसन्नवपुषं निरीक्ष्य ताम् । नित्यमुक्तवपुरप्यहो हरे
    बन्धमेव कृपयाऽन्वमन्यथाः ॥ ॥ स्थीयतां चिरमुलूखले खलेत्यागता भवनमेव सा यदा। प्रागुलूखलबिलान्तरे तदा
    सर्पिरर्पितमदन्नवास्थिथाः ॥ ॥ यद्यपाशसुगमो विभो भवान् संयतः किमु सपाशयाऽनया । एवमादि दिविजैरभिष्टुतो
    वातनाथ परिपाहि मां गदात् ॥
