id: lalita-108
category: stotram
name:
  english: lalita 108
  devanagari: ललिता १०८
content:
  english: shrilalita'shtottarashatanamadivyastotram || shrih || || atha shrilalita'shtottarashatanamadivyastotram
    || shivapriyashivaradhya shiveshta shivakomala | shivotsava shivarasa shivadivyashikhamanih || 1||
    shivapurna shivaghana shivastha shivavallabha | shivabhinna shivardhangi shivadhina shivamkari ||
    2|| shivanamajapasakta shivasamnidhyakarini | shivashaktih shivadhyaksha shivakameshvari shiva ||
    3|| shivayogishvaridevi shivajnavashavartini | shivavidyatinipuna shivapancaksharapriya || 4|| shivasaubhagyasampanna
    shivakainkaryakarini | shivankastha shivasakta shivakaivalyadayini || 5|| shivakrida shivanidhih shivashrayasamanvita
    | shivalila shivakala shivakanta shivaprada || 6|| shivashrilalitadevi shivasya nayanamrita | shivacintamanipada
    shivasya hridayojjvala || 7|| shivottama shivakara shivakamaprapurini | shivalingarcanapara shivalinganakautuki
    || 8|| shivalokanasamtushta shivalokanivasini | shivakailasanagarasvamini shivaranjini || 9|| shivasyahopurushika
    shivasamkalpapuraka | shivasaundaryasarvangi shivasaubhagyadayini || 10|| shivashabdaikanirata shivadhyanaparayana
    | shivabhaktaikasulabha shivabhaktajanapriya || 11|| shivanugrahasampurna shivanandarasarnava | shivaprakashasamtushta
    shivashailakumarika || 12|| shivasyapankajarkabha shivantahpuravasini | shivajivatukalika shivapunyaparampara
    || 13|| shivakshamalasamtripta shivanityamanohara | shivabhaktashivajnanaprada shivavilasini || 14||
    shivasammohanakari shivasamrajyashalini | shivasakshadbrahmavidya shivatandavasakshini || 15|| shivagamarthatattvajna
    shivamanya shivatmika | shivakaryaikacatura shivashastrapravartaka || 16|| shivaprasadajanani shivasya
    hitakarini | shivojjvala shivajyotih shivabhogasukhamkari || 17|| shivasya nityataruni shivakalpakavallari
    | shivabilvarcanakari shivabhaktartibhanjani || 18|| shivakshikumudajyotsna shivashrikarunakara |
    shivanandasudhapurna shivabhagyabdhicandrika || 19|| shivashaktyaikyalalita shivakridarasojjvala |
    shivapremamaharatnakathinyakalashastani || 20|| shivalalitaḻakshardracaranambujakomala | shivacittaikaharanavyalolaghanavenika
    || 21|| shivabhishtapradanashrikalpavallikarambuja | shivetaramahatapanirmulamritavarshini || 22||
    shivayogindradurvasamahimnastutitoshita | shivasampurnavimalajnanadugdhabdhishayini || 23|| shivabhaktagraganyeshavishnubrahmendravandita
    | shivamayasamakrantamahishasuramardini | shivadattabalonmattashumbhadyasuranashini || 24|| shivadvijarbhakastanyajnanakshirapradayini
    | shivatipriyabhaktadinandibhringiritistuta || 25|| shivanalasamudbhutabhasmoddhulitavigraha | shivajnanabdhiparajnamahatripurasundari
    || 26|| ityetallalitanamnamashtottarashatam mune | anekajanmapapaghnam lalitapritidayakam || 27||
    sarvaishvaryapradam nrinamadhivyadhinivaranam | yo martyah pathate nityam sarvankamanavapnuyat ||
    28|| itishrilalitopakhyane stotrakhande shrilalitashtottara
  devanagari: श्रीललिताऽष्टोत्तरशतनामदिव्यस्तोत्रम् ॥ श्रीः ॥ ॥ अथ श्रीललिताऽष्टोत्तरशतनामदिव्यस्तोत्रम्
    ॥ शिवप्रियाशिवाराध्या शिवेष्टा शिवकोमला । शिवोत्सवा शिवरसा शिवदिव्यशिखामणिः ॥ १॥ शिवपूर्णा शिवघना
    शिवस्था शिववल्लभा । शिवाभिन्ना शिवार्धाङ्गी शिवाधीना शिवंकरी ॥ २॥ शिवनामजपासक्ता शिवसांनिध्यकारिणी
    । शिवशक्तिः शिवाध्यक्षा शिवकामेश्वरी शिवा ॥ ३॥ शिवयोगीश्वरीदेवी शिवाज्ञावशवर्तिनी । शिवविद्यातिनिपुणा
    शिवपञ्चाक्षरप्रिया ॥ ४॥ शिवसौभाग्यसम्पन्ना शिवकैङ्कर्यकारिणी । शिवाङ्कस्था शिवासक्ता शिवकैवल्यदायिनी
    ॥ ५॥ शिवक्रीडा शिवनिधिः शिवाश्रयसमन्विता । शिवलीला शिवकला शिवकान्ता शिवप्रदा ॥ ६॥ शिवश्रीललितादेवी
    शिवस्य नयनामृता । शिवचिन्तामणिपदा शिवस्य हृदयोज्ज्वला ॥ ७॥ शिवोत्तमा शिवाकारा शिवकामप्रपूरिणी । शिवलिङ्गार्चनपरा
    शिवालिङ्गनकौतुकी ॥ ८॥ शिवालोकनसंतुष्टा शिवलोकनिवासिनी । शिवकैलासनगरस्वामिनी शिवरञ्जिनी ॥ ९॥ शिवस्याहोपुरुषिका
    शिवसंकल्पपूरका । शिवसौन्दर्यसर्वाङ्गी शिवसौभाग्यदायिनी ॥ १०॥ शिवशब्दैकनिरता शिवध्यानपरायणा । शिवभक्तैकसुलभा
    शिवभक्तजनप्रिया ॥ ११॥ शिवानुग्रहसम्पूर्णा शिवानन्दरसार्णवा । शिवप्रकाशसंतुष्टा शिवशैलकुमारिका ॥ १२॥
    शिवास्यपङ्कजार्काभा शिवान्तःपुरवासिनी । शिवजीवातुकलिका शिवपुण्यपरंपरा ॥ १३॥ शिवाक्षमालासंतृप्ता शिवनित्यमनोहरा
    । शिवभक्तशिवज्ञानप्रदा शिवविलासिनी ॥ १४॥ शिवसंमोहनकरी शिवसांराज्यशालिनी । शिवसाक्षाद्ब्रह्मविद्या
    शिवताण्डवसाक्षिणी ॥ १५॥ शिवागमार्थतत्त्वज्ञा शिवमान्या शिवात्मिका । शिवकार्यैकचतुरा शिवशास्त्रप्रवर्तका
    ॥ १६॥ शिवप्रसादजननी शिवस्य हितकारिणी । शिवोज्ज्वला शिवज्योतिः शिवभोगसुखंकरी ॥ १७॥ शिवस्य नित्यतरुणी
    शिवकल्पकवल्लरी । शिवबिल्वार्चनकरी शिवभक्तार्तिभञ्जनी ॥ १८॥ शिवाक्षिकुमुदज्योत्स्ना शिवश्रीकरुणाकरा
    । शिवानन्दसुधापूर्णा शिवभाग्याब्धिचन्द्रिका ॥ १९॥ शिवशक्त्यैक्यललिता शिवक्रीडारसोज्ज्वला । शिवप्रेममहारत्नकाठिन्यकलशस्तनी
    ॥ २०॥ शिवलालितळाक्षार्द्रचरणांबुजकोमला । शिवचित्तैकहरणव्यालोलघनवेणिका ॥ २१॥ शिवाभीष्टप्रदानश्रीकल्पवल्लीकरांबुजा
    । शिवेतरमहातापनिर्मूलामृतवर्षिणी ॥ २२॥ शिवयोगीन्द्रदुर्वासमहिम्नस्तुतितोषिता । शिवसम्पूर्णविमलज्ञानदुग्धाब्धिशायिनी
    ॥ २३॥ शिवभक्ताग्रगण्येशविष्णुब्रह्मेन्द्रवन्दिता । शिवमायासमाक्रान्तमहिषासुरमर्दिनी । शिवदत्तबलोन्मत्तशुम्भाद्यसुरनाशिनी
    ॥ २४॥ शिवद्विजार्भकस्तन्यज्ञानक्षीरप्रदायिनी । शिवातिप्रियभक्तादिनन्दिभृङ्गिरिटिस्तुता ॥ २५॥ शिवानलसमुद्भूतभस्मोद्धूलितविग्रहा
    । शिवज्ञानाब्धिपारज्ञमहात्रिपुरसुन्दरी ॥ २६॥ इत्येतल्ललितानाम्नामष्टोत्तरशतं मुने । अनेकजन्मपापघ्नं
    ललिताप्रीतिदायकम् ॥ २७॥ सर्वैश्वर्यप्रदं नॄणामाधिव्याधिनिवारणम् । यो मर्त्यः पठते नित्यं सर्वान्कामानवाप्नुयात्
    ॥ २८॥ इतिश्रीललितोपाख्याने स्तोत्रखण्डे श्रीललिताष्टोत्तर
