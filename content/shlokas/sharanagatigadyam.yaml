id: sharanagatigadyam
category: stotram
name:
  english: sharanagatigadyam
  devanagari: शरणागतिगद्यम्
content:
  english: vyamohatastaditarani trinaya mene | asmadgurorbhagavato'sya dayaikasindhoh ramanujasya caranau
    sharanam prapadye || vande vedantakarpuracamikarakarandakam ramanujaryamaryanam cudamanimaharnisham
    || shriranganayikaramanujasamvadah || shriramanujah bhagavannarayanabhimatanurupasvaruparupagunavibhava
    aishvaryashiladyanavadhikatishaya asankhyeyakalyanagunaganam padmavanalayam bhagavatim shriyam devim
    nityanapayinim niravadyam devadevadivyamahishim akhilajaganmataramasmanmataramasharanyasharanyamananyasharanah
    sharanamaham prapadye || paramarthika bhagavaccaranaravindayugaḻa aikantikatyantika parabhakti parajnana
    paramabhaktikrita paripurnanavarata nityavishadatama ananyaprayojana anavadhikatishayapriya bhagavadanubhavajanita
    anavadhikatishaya pritikarita asheshavasthocita asheshasheshataikaratirupa nityakainkaryapraptyapekshaya
    paramarthiki bhagavaccaranaravindasharanagatih yathavasthita avirata'stu me || shriranganayika astu
    te | tayaiva sarvam sampatsyate || || shriranganatharamanujasamvadah || shriramanujah akhilaheyapratyanikakalyanaikatana
  devanagari: व्यामोहतस्तदितराणि तृणाय मेने । अस्मद्गुरोर्भगवतोऽस्य दयैकसिन्धोः रामानुजस्य चरणौ शरणं प्रपद्ये
    ॥ वन्दे वेदान्तकर्पूरचामीकरकरण्डकम् रामानुजार्यमार्याणां चूडामणिमहर्निशम् ॥ श्रीरङ्गनायिकारामानुजसंवादः
    ॥ श्रीरामानुजः भगवन्नारायणाभिमतानुरूपस्वरूपरूपगुणविभव ऐश्वर्यशीलाद्यनवधिकातिशय असङ्ख्येयकल्याणगुणगणां
    पद्मवनालयां भगवतीं श्रियं देवीं नित्यानपायिनीं निरवद्यां देवदेवदिव्यमहिषीं अखिलजगन्मातरमस्मन्मातरमशरण्यशरण्यामनन्यशरणः
    शरणमहं प्रपद्ये ॥ पारमार्थिक भगवच्चरणारविन्दयुगळ ऐकान्तिकात्यन्तिक परभक्ति परज्ञान परमभक्तिकृत परिपूर्णानवरत
    नित्यविशदतम अनन्यप्रयोजन अनवधिकातिशयप्रिय भगवदनुभवजनित अनवधिकातिशय प्रीतिकारित अशेषावस्थोचित अशेषशेषतैकरतिरूप
    नित्यकैङ्कर्यप्राप्त्यपेक्षया पारमार्थिकी भगवच्चरणारविन्दशरणागतिः यथावस्थिता अविरताऽस्तु मे ॥ श्रीरङ्गनायिका
    अस्तु ते । तयैव सर्वं सम्पत्स्यते ॥ ॥ श्रीरङ्गनाथरामानुजसंवादः ॥ श्रीरामानुजः अखिलहेयप्रत्यनीककल्याणैकतान
