id: kyts-4-4-rasmirasi-kshayaaya-tvaa-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 4.4 Rasmirasi Kshayaaya Tvaa - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ncaturthakande caturthah prashnah pancamacitisheshanirupanam
    o shri gurubhyo namah | harih om || rashmirasi kshayaya tva kshaya njinva pretirasi dharmaya tva dharma
    njinvanvitirasi dive tva diva njinva sandhirasyantarikshaya tva njinva pratidhirasi prithivyai tva
    prithivi 'si ratriyai tva ratri 'si rudrebhyastva rudranjinva suditirasyadityebhyastva ''dityanjinvaujo
    'si pitribhyastva pitrinjinva tanturasi prajabhyastva praja jinva pritanashadasi pashubhyastva pashunjinva
    revadasyoshadhibhya rjinvabhijidasi yuktagravendraya tvendra njinvadhipatirasi pranaya njinva sagmsarpo
    'si cakshushe tva cakshurjinva vayodha asi shrotraya tva shrotra njinva trivridasi pravridasi sam
    vri~dasi vivridasi sagmroho 'si veshashrirasi vasyashtirasi || rajnyasi praci digvasavaste deva adhipatayo
    mpratidharta trivri ttva stomah prithivyag thstabhnatu rathantaragm sama pratishthityai viradasi dakshina
    digrudraste deva adhipataya indro hetina mpratidharta pancadashastva stomah prithivyag thsama pratishthityai
    samradasi pratici di gadityaste deva adhipataya mpratidharta saptadashastva stomah prithivyag shrayatu
    marutvatiyamuktha thstabhnatu vairupagm sama pratishthityayai svaradasyudici dig vishve te deva adhipatayo
    varuno hetina mpratidhartaikavigmsha stva stomah prithivyag shrayatu nishkevalya thstabhnatu vairajagm
    sama pratishthitya adhipatnyasi brihati dimmarutaste deva adhipatayo mpratidharta trinavatrayastrigmshau
    tva stomau prithivyag vai~shvadevagnimarute ukthe avyathayanti stabhnitagm shakvararaivate samani
    pratishthitya antarikshayar shayastva prathamaja deveshu divo matraya varina prathantu vidharta cayamadhipatishca
    te tva sarve sam vi~dana nakasya prishthe suvarge loke yajamana marutaste deva adhipataya ssuryarashmistasya
    rathagrithsashca rathaujashca senani gramanyau punjikasthala ca kritasthala ca phsarasau yatudhana
    heti rakshagmsi praheti raya ndakshina vishva karma tasya rathasvanashca rathecitrashca senani gramanyau
    menaka ca sahajanya ca phsarasau damnavah pashavo hetih paurusheyo vadhah praheti raya dvishvavyaca
    stasya ratha protashca samarathashca senani gramanyau caphsarasau sarpa heti rvyaghrah praheti raya
    muttara vasustasya senajicca sushenashca senani gramanyau vishvaci ca ghritaci caphsarasa vapo heti
    rvatah praheti rayamuparya rvagva sustasya tarkshya nemishca senani gramanya vurvashi ca purvacittishca
    phsarasau vidyuddhetira npraheti stebhyo namaste no mridayantu te ya ndvishmo yashca no dveshti tam
    vo~ jambhe dadhamyayostva sadane sadayamyavata shchayaya nnamah samudraya namah samudrasya cakshase
    parameshthi tva sadayatu divah prishthe vyacasvati mma higmsirvishvasmai pranayapanaya vyanayodanaya
    pratishthayai caritraya suryastva 'bhi patu mahya svastya chardisha shantamena taya devataya ddhruva
    sida || prothadashvo na yavase avishyan t | adasya vato anu vati shociradha sma te vrajana agnirmurdha
    divah kaku tpatih prithivya ayam | apagm retagmsi jinvati || tvamagne pushkaradaddhyatharva niramanthata
    | murdhno vishvasya vaghatah || ayamagni ssahasrino vajasya shatinaspatih | murdha kavi rayinam ||
    bhuvo yajnasya rajasashca neta yatra niyudbhi ssacase shivabhih | divi murdhana njihvamagne cakrishe
    havyavaha mprati dhenumiva yatimushasa m | yahva iva pravaya mujjihanah pra bhanavah sisrate nakamaccha
    || avocama kavaye meddhyaya vaco vandaru vrishabhaya vrishne | gavishthiro namasa stomamagnau diviva
    rukmamurvyancamashret || janasya gopa ajanishta jagriviragni ssudakshah suvitaya navyase | ghritapratiko
    brihata divisprisha dyumadvi bhati bharatebhya shshucih || tvamagne angiraso va~nevane | sa jayase
    mathyamana ssahasasputramangirah || yajnasya ketu nnarastrishadhasthe samindhate | indrena devai ssarathagm
    sa barhishi sidanni hota yajathaya sukratuh || tva ncitrashravastama havante vikshu jantavah | shocishkesha
    mpurupriyagne havyaya vodhave || sakhaya shishthaya kshitinamurjo naptre sahasvate || sagmsamidyuvase
    vrishannagne vishva nyarya a | idaspade samiddhyase sa no vasunya bhara || ena vo agni nnamasorjo
    napatama huve | priya vi~shvasya dutamamrita m || sa yojate arusho vishvabhojasa sa dudrava thsvahutah
    | subrahma yajna ndevagm radho jananam || udasya shocirasthada juhvanasya midhushah | uddhamaso arushaso
    divisprisha ssamagnimindhate narah || agne vajasya gomata ishana ssahaso yaho | asme dhehi jatavedo
    mahi shravah || sa idhano vasushkavi ragniridenyo gira | revadasmabhya mpurvanika didihi || kshapo
    rajannuta tmana 'gne vastorutoshasah | sa tigmajambha rakshaso daha prati || a te agna idhimahi dyumanta
    m | yaddha sya te paniyasi sami ddidayati dyavishagg stotribhya a bhara || a te agna rica havi shshukrasya
    jyotishaspate | sushcandra dasma vishpate havyava ttubhyagm huyata ishagg stotribhya a bhara || ubhe
    sushcandra sarpisho darvi shrinisha asani | uto na u uktheshu shavasaspata ishagg stotribhya a bhara
    || agne tamadyashva nna bhadragm hridisprisha m | riddhyama ta ohaih || adha hyagne krato rbhadrasya
    dakshasya sadhoh | rathir ritasya brihato babhutha || abhishte adya girbhirgrinanto 'gne dashema |
    pra te divo na stanayanti shushmah || ebhirno arkairbhava no arva nkhsuvarna jyotih | agne vishvebhi
    ssumana anikaih || agnigm hotara mmanye dasvantam ssunugm sahaso jatavedasam | vipra nna jatavedasam
    | ya urdhvaya svaddhvaro devo devacya kripa | ghritasya vibhra shtimanu shukrashocisha ajuhvanasya
    sarpishah || agne tva nno antamah | uta trata shivo bhava varuthyah || ta ntva shocishtha didivah
    | sumnaya nunamimahe sakhibhyah || vasuragnirvasushravah | accha nakshi dyumattamo rayi ntva sayuja
    yuja yunajmya gharabhya ntejasa varcaso kthebhi sstomebhi shchandobhi rayyai poshaya sajatana mmaddhyamastheyaya
    maya tva sayuja yuja yunajmyaba ndula nitatni rabhrayanti meghayanti varshayanti cupunika namasi prajapatina
    tva vishvabhirdhibhirupa dadhami prithivyudapuramannena vishta manushya ste goptaro 'gnirviyatto me
    sharma ca varma castvadhi dyaurantariksha mbrahmana vishta marutaste goptaro vayurviyatto mpra padye
    sa me sharma ca varma castu dyauraparajita ''dityaste goptara mpra padye sa me sharma ca varma castu
    || 'shtacatvarigmshacca brihaspatistva sadayatu prithivyah prishthe jyotishmatim vi~shvasmai pranayapanaya
    vishva 'dhipati rvishvakarma tva sadayatvantarikshasya prishthe jyotishmatim vi~shvasmai pranayapanaya
    vishva njyotiryaccha vayuste 'dhipatih prajapatistva sadayatu divah prishthe jyotishmatim vi~shvasmai
    pranayapanaya vishva njyotiryaccha parameshthi te 'dhipatih purovatasanirasya bhrasanirasi vidyuthsani
    asi stanayitnusanirasi rasi stanayitnusanirasi vrishtisanirasya gneryanyasi devanamagne yanyasi vayoryanyasi
    devanam va~yoyanyasyantarikshasya yanyasi devana mantarikshayanyasya ntarikshamasyantarikshaya tva
    salilaya tva sarnikaya tva satikaya tva ketaya tva pracetase tva vivasvate tva divastva jyotisha adityebhyastvarce
    tva ruce tva dyute tva bhase tva jyotishe tva yashoda ntva yashasi tejoda ntva tejasi payoda ntva
    payasi varcoda ntva varcasi dravinoda ntva dravine sadayami tenar shina tena brahmana taya devataya
    kanna trigmshacca bhuyaskridasi varivaskridasi pracyasyurdhva phsushadasi shyenasadasi griddhrasadasi
    suparnasadasi nakasadasi prithivyastva dravine sadayamya ntarikshasya tva dravine sadayami divastva
    dravine sadayami disha ntva dravine sadayami dravinoda ntva dravine sadayami prana pahyayurme pahi
    vishvayurme pahi sarvayurme pahyagne ya tte paragm hrinnama tavehi sagm rabhavahai panca janyeshva
    ddhyagne yava ayava eva uma agnina vishvashat suryena svara tkratva shacipatir rishabhena tvashta
    yajnena maghava ndakshinaya suvargo manyuna vritraha sauha rdyena tanudha annena gayah prithivya 'sano
    drigbhirannado vashatkarenardha ssamna tanupa viraja jyotishma nbrahmana somapa gobhiryajna ndadhara
    kshatrena manushya nashvena ca rathena ca vajryritubhih prabhu va~thsarena paribhu stapasa prajapatirmanasa
    'ndho 'ccheto dhata dikshayagm savita bhritya mpusha somakrayanyam va~runa upanaddho 'surah kriyamano
    mitrah krita shshipivishta asadito narandhishah prohyamano 'dhipatiragatah prajapatih praniyamano
    'gniragni ddhre brihaspatiragni tpraniyamana indro havirdhane 'ditirasadito vishnurupavahriyamano
    'tharvopo 'bhishuto 'putapa adhuyamano vayuh puyamano mitrah kshirashrirmanthi saktushrirvai shvadeva
    unnito rudra ahuto vayuravritto nricakshah pratikhyato bhaksha agatah pitrina nnarashagmso 'suratta
    'gne rucah stha prajapaterdhatu ssomasyarce tva ruce tva dyute tva bhase tva jyotishe tva rohini nakshatra
    mprajapatirdevata mrigashirsha nnakshatragm somo devata ''rdra nakshatragm rudro devata punarvasu
    nakshatramaditirdevata mbrihaspatirdevata ''shresha nakshatragm sarpa devata magha nakshatra mpitaro
    devata phalguni nakshatra maryama devata phalguni nakshatra mbhago devata hasto nakshatragm savita
    devata citra nakshatramindro devata va~yurdevata vishakhe nakshatramindragni devata 'nuradha nakshatra
    mmitro devata rohini nakshatramindro devata vicritau nakshatra mpitaro devata 'shadha nakshatramapo
    devata 'shadha nakshatram vi~shve deva devata vi~shnurdevata shravishtha nakshatram nnakshatramindro
    devata proshthapada nakshatramaja ekapa proshthapada nakshatramahirbuddhniyo devata revati nakshatra
    'shvayujau nakshatramashvinau devata 'pabharanirnakshatram tte deva adadhuh || phalguni nakshatram
    strayastrigmshacca madhushca madhavashca vasantikavritu shukrashca shucishca graishmavritu nabhashca
    nabhasyashca var shikavritu ishashcorjashca sharadavritu sahashca sahasyashca haimantikavritu tapashca
    tapasyashca shaishiravritu agneranta ndyavaprithivi kalpantamapa oshadhih kalpantamagnayah prithammama
    jyaishthyaya savrata 'ntara dyavaprithivi shaishiravritu abhi kalpamana indramiva deva abhi sam ya~cca
    pracetashcagne ssomasya suryasyo gra ca bhima ca pitrinam ya~masyendrasya dhruva ca prithivi ca devasya
    saviturmarutam va~runasya dhartri ca dharitri ca mitravarunayo rmitrasya dhatuh praci ca pratici ca
    vasunagm rudrana 'dhipatayastebhyo namaste no mridayantu te ya ndvishmo yashca no dveshti tam vo~
    jambhe dadhami sahasrasya prama asi sahasrasya pratima asi sahasrasya vima asi sahasrasyonma asi sahasro
    'si sahasraya tvema me agna ishtaka dhenavah santveka ca shata nca samudrashca maddhya ncantashca
    parardhashcema me agna ishtaka dhenavah santu shashthi makshiyamana ritastha sthartavridho ghritashcuto
    madhushcuta urjasvati ssvadhavinista me agna ishtaka dhenavah santu virajo nama kamadugha amutramushmin
    ~loke || ssuvarvinmadhorato madhavah patvasman | agnirdevo dushtariturada nkshatragm rakshatu patvasman
    || rathantaragm samabhih patvasma ngayatri chandasam vi~shvarupa | trivrinno vishthaya stomo ahnagm
    samudro vata idamojah pipartu || ugra dishamabhi shshucih shukre ahanyojasina | indradhipatih pipritadato
    no mahi vi~shvato dharayedam || briha ntrishtubhaujah shubhita mugraviram | indra stomena pancadashena
    maddhyamidam va~tena sagarena raksha || praci dishagm sahayasha yashasvati vishve devah pravrisha
    'hnagm suvarvati | ida ndushtaramastvojo 'nadhrishtagm sahasriyagm sahasvat || vairupe samanniha tacchakema
    jagatyainam vi~kshva veshayamah | vishve deva nkshatragm salilavatamugram || dhartri disha mmitravadastvojah
    | mitravaruna sharada ncikitnu asmai rashtraya mahi sharma yacchatam || vairaje samannadhi me manisha
    'nushtubha sambhritam vi~ryagm sahah | ida mmitravadardradanu mitravaruna rakshata madhipatyaih ||
    samra mni sahasvatyritur hemanto vishthaya nah pipartu | avasyuvata brihatirnu shakvaririmam ya~jnamavantu
    no ghritacih || suvarvati sudugha nah payasvati disha ndevyavatu no ghritaci ngopah puraetota pashca
    dbrihaspate yamyam m || urdhva dishagm rantirashaushadhinagm sam va~thsarena savita no ahna thsamaticchanda
    u chando ssyona no astu || stomatrayastrigmshe bhuvanasya patni vivasvadvate abhi no grinahi | ghritavati
    savitaradhipatyaih payasvati rantirasha no astu || dhruva disham vi~shnupatnyaghora 'syeshana sahaso
    ya manota | brihaspati rmatarishvota vayu ssandhuvana vata abhi no grinantu || vishtabho ndivo dharunah
    prithivya asyeshana jagato vishnupatni | vishvavyaca ishayanti subhuti shshiva no astvaditirupasthe
    || vaishvanaro na utyaprishto divyanu no 'dyanumatiranvidanumate tva nkaya nashcitra abhuvatko adya
    yunkte || syagnina vishvashat masi stanayitnusanira || harih om || || krishna yajurvediya taittiriya
    samhitaya ncaturtha kande caturthah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया ञ्चतुर्थकाण्डे चतुर्थः प्रश्नः पञ्चमचितिशेषनिरूपणं ओ
    श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ र॒श्मिर॑सि॒ क्षया॑य त्वा॒ क्षय॑ ञ्जिन्व॒ प्रेति॑रसि॒ धर्मा॑य त्वा॒
    धर्म॑ ञ्जि॒न्वान्वि॑तिरसि दि॒वे त्वा॒ दिव॑ ञ्जिन्व स॒न्धिर॑स्य॒न्तरि॑क्षाय त्वा॒ ञ्जिन्व प्रति॒धिर॑सि
    पृथि॒व्यै त्वा॑ पृथि॒वी ऽसि॒ रात्रि॑यै त्वा॒ रात्रि॑ ऽसि रु॒द्रेभ्य॑स्त्वा रु॒द्राञ्जि॑न्व सुदी॒तिर॑स्यादि॒त्येभ्य॑स्त्वा
    ऽऽदि॒त्याञ्जि॒न्वौजो॑ ऽसि पि॒तृभ्य॑स्त्वा पि॒तॄञ्जि॑न्व॒ तन्तु॑रसि प्र॒जाभ्य॑स्त्वा प्र॒जा जि॑न्व
    पृतना॒षाड॑सि प॒शुभ्य॑स्त्वा प॒शूञ्जि॑न्व रे॒वद॒स्योष॑धीभ्य॒ र्जिन्वाभि॒जिद॑सि यु॒क्तग्रा॒वेन्द्रा॑य॒
    त्वेन्द्र॑ ञ्जि॒न्वाधि॑पतिरसि प्रा॒णाय॑ ञ्जि॑न्व स॒ग्ं॒सर्पो॑ ऽसि॒ चक्षु॑षे त्वा॒ चक्षु॑र्जिन्व वयो॒धा
    अ॑सि॒ श्रोत्रा॑य त्वा॒ श्रोत्र॑ ञ्जिन्व त्रि॒वृद॑सि प्र॒वृद॑सि सं॒ वृँद॑सि वि॒वृद॑सि सग्ंरो॒हो॑ ऽसि॒
    वेष॑श्रिरसि॒ वस्य॑ष्टिरसि ॥ राज्ञ्य॑सि॒ प्राची॒ दिग्वस॑वस्ते दे॒वा अधि॑पतयो॒ म्प्र॑तिध॒र्ता त्रि॒वृ
    त्त्वा॒ स्तोमः॑ पृथि॒व्याग् थ्स्तभ्नातु रथन्त॒रग्ं साम॒ प्रति॑ष्ठित्यै वि॒राड॑सि दक्षि॒णा दिग्रु॒द्रास्ते॑
    दे॒वा अधि॑पतय॒ इन्द्रो॑ हेती॒ना म्प्र॑तिध॒र्ता प॑ञ्चद॒शस्त्वा॒ स्तोमः॑ पृथि॒व्याग् थ्साम॒ प्रति॑ष्ठित्यै
    स॒म्राड॑सि प्र॒तीची॒ दि गा॑दि॒त्यास्ते॑ दे॒वा अधि॑पतय॒ म्प्र॑तिध॒र्ता स॑प्तद॒शस्त्वा॒ स्तोमः॑ पृथि॒व्याग्
    श्र॑यतु मरुत्व॒तीय॑मु॒क्थ थ्स्तभ्नातु वैरू॒पग्ं साम॒ प्रति॑ष्ठित्यायै स्व॒राड॒स्युदी॑ची॒ दिग् विश्वे॑
    ते दे॒वा अधि॑पतयो॒ वरु॑णो हेती॒ना म्प्र॑तिध॒र्तैक॑वि॒ग्ं॒श स्त्वा॒ स्तोमः॑ पृथि॒व्याग् श्र॑यतु॒ निष्के॑वल्य
    थ्स्तभ्नातु वैरा॒जग्ं साम॒ प्रति॑ष्ठित्या॒ अधि॑पत्न्यसि बृह॒ती दिम्म॒रुत॑स्ते दे॒वा अधि॑पतयो॒ म्प्र॑तिध॒र्ता
    त्रि॑णवत्रयस्त्रि॒ग्ं॒शौ त्वा॒ स्तोमौ॑ पृथि॒व्याग् वैँश्वदेवाग्निमारु॒ते उ॒क्थे अव्य॑थयन्ती स्तभ्नीताग्ं
    शाक्वररैव॒ते साम॑नी॒ प्रति॑ष्ठित्या अ॒न्तरि॑क्षा॒यर् ष॑यस्त्वा प्रथम॒जा दे॒वेषु॑ दि॒वो मात्र॑या वरि॒णा
    प्र॑थन्तु विध॒र्ता चा॒यमधि॑पतिश्च॒ ते त्वा॒ सर्वे॑ सं विँदा॒ना नाक॑स्य पृ॒ष्ठे सु॑व॒र्गे लो॒के यज॑मान
    म॒रुत॑स्ते दे॒वा अधि॑पतय स्सूर्य॑रश्मि॒स्तस्य॑ रथगृ॒थ्सश्च॒ रथौ॑जाश्च सेनानि ग्राम॒ण्यौ॑ पुञ्जिकस्थ॒ला
    च॑ कृतस्थ॒ला चा फ्स॒रसौ॑ यातु॒धाना॑ हे॒ती रक्षाग्ं॑सि॒ प्रहे॑ति र॒य न्द॑क्षि॒णा वि॒श्व क॑र्मा॒ तस्य॑
    रथस्व॒नश्च॒ रथे॑चित्रश्च सेनानि ग्राम॒ण्यौ॑ मेन॒का च॑ सहज॒न्या चा फ्स॒रसौ॑ दं॒णवः॑ प॒शवो॑ हे॒तिः पौरु॑षेयो
