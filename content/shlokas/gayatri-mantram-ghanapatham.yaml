id: gayatri-mantram-ghanapatham
category: stotram
name:
  english: Gayatri Mantram Ghanapatham
content:
  english: mbhurbhuvassuvah tathsaviturvare nyam bhargo devasya dhimahi | dhiyo yo nah pracodaya stattathsaviturvare
    nyagm savitu stattathsaviturvare nyam | saviturvare mbhargo devasya devasya bhargo vare mbhargo devasya
    | bhargo devasya devasya bhargo bhargo devasya dhimahi dhimahi devasya bhargo bhargo devasya dhimahi
    | devasya dhimahi dhimahi devasya devasya dhimahi | dhimahiti dhimahi | dhiyo yo yo dhiyo dhiyo yo
    no no yo dhiyo dhiyo yonah || yo no no yo yonah pracodaya nno yo yonah pracodaya t | pracodayaditi
    pra mbhuvah | ogm suvah | o ntapah | ogm satyam | o nyam bhargo devasya dhimahi | dhiyo yo nah pracodaya
    t || omapo jyoti raso
  devanagari: म्भूर्भुव॒स्सुवः॒ तथ्स॑वि॒तुर्वरे ण्यं॒ भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो नः॑ प्रचोदया स्तत्त॒थ्स॑वि॒तुर्वरे
    ण्यग्ं सवि॒तु स्तत्तथ्स॑वि॒तुर्वरे ण्यम् । स॒वि॒तुर्वरे म्भर्गो॑ दे॒वस्य॑ दे॒वस्य॒ भर्गो॒ वरे म्भर्गो॑
    दे॒वस्य॑ । भर्गो॑ दे॒वस्य॑ दे॒वस्य॒ भर्गो॒ भर्गो॑ दे॒वस्य॑ धीमहि धीमहि दे॒वस्य॒ भर्गो॒ भर्गो॑ दे॒वस्य॑
    धीमहि । दे॒वस्य॑ धीमहि धीमहि दे॒वस्य॑ दे॒वस्य॑ धीमहि । धी॒म॒हीति॑ धीमहि । धियो॒ यो यो धियो॒ धियो॒
    यो नो॑ नो॒ यो धियो॒ धियो॒ योनः॑ ॥ यो नो॑ नो॒ यो योनः॑ प्रचो॒दया न्नो॒ यो योनः॑ प्रचो॒दया त् । प्र॒चो॒दया॒दिति॑
    प्र म्भुवः । ओग्ं सुवः । ओ न्तपः । ओग्ं स॒त्यम् । ओ ण्यं॒ भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो नः॑ प्रचोदया
    त् ॥ ओमापो॒ ज्योती॒ रसो॒
