id: shivamahi
category: stotram
name:
  english: shivamahi
  devanagari: शिवमहि
content:
  english: '|| 13|| akandabrahmandakshayacakitadevasurakripa vidheyasya''''sidyastrinayana visham samhritavatah
    | sa kalmashah kanthe tava na kurute na shriyamaho vikaro''pi shlaghyo bhuvanabhayabhangavyasaninah
    || 14|| asiddhartha naiva kvacidapi sadevasuranare nivartante nityam jagati jayino yasya vishikhah
    | sa pashyannisha tvamitarasurasadharanamabhut smarah smartavyatma na hi vashishu pathyah paribhavah
    || 15|| mahi padaghatadvrajati sahasa samshayapadam padam vishnorbhramyadbhujaparigharugna grahaganam
    | muhurdyaurdausthyam yatyanibhrita jatatadita tata jagadrakshayai tvam natasi nanu vamaiva vibhuta
    || 16|| viyadvyapi taraganagunitaphenodgamarucih pravaho varam yah prishatalaghudrishtah shirasi te
    | jagaddvipakaram jaladhivalayam tena kritamiti anenaivonneyam dhritamahima divyam tava vapuh || 17||
    rathah kshoni yanta shatadhritiragendro dhanuratho rathange candrarkau rathacaranapanih shara iti
    | didhakshoste ko''yam tripuratrinamadambara vidhih vidheyaih kridantyo na khalu paratantrah prabhudhiyah
    || 18|| hariste sahasram kamalabalimadhaya padayoh yadekone tasmin nijamudaharannetrakamalam | gato
    bhaktyudrekah parinatimasau cakra vapusha'
  devanagari: ॥ १३॥ अकाण्डब्रह्माण्डक्षयचकितदेवासुरकृपा विधेयस्याऽऽसीद्यस्त्रिनयन विषं संहृतवतः । स कल्माषः
    कण्ठे तव न कुरुते न श्रियमहो विकारोऽपि श्लाघ्यो भुवनभयभङ्गव्यसनिनः ॥ १४॥ असिद्धार्था नैव क्वचिदपि
    सदेवासुरनरे निवर्तन्ते नित्यं जगति जयिनो यस्य विशिखाः । स पश्यन्नीश त्वामितरसुरसाधारणमभूत् स्मरः स्मर्तव्यात्मा
    न हि वशिषु पथ्यः परिभवः ॥ १५॥ मही पादाघाताद्व्रजति सहसा संशयपदं पदं विष्णोर्भ्राम्यद्भुजपरिघरुग्ण
    ग्रहगणम् । मुहुर्द्यौर्दौस्थ्यं यात्यनिभृत जटाताडित तटा जगद्रक्षायै त्वं नटसि ननु वामैव विभुता ॥ १६॥
    वियद्व्यापी तारागणगुणितफेनोद्गमरुचिः प्रवाहो वारां यः पृषतलघुदृष्टः शिरसि ते । जगद्द्वीपाकारं जलधिवलयं
    तेन कृतमिति अनेनैवोन्नेयं धृतमहिम दिव्यं तव वपुः ॥ १७॥ रथः क्षोणी यन्ता शतधृतिरगेन्द्रो धनुरथो रथाङ्गे
    चन्द्रार्कौ रथचरणपाणिः शर इति । दिधक्षोस्ते कोऽयं त्रिपुरतृणमाडम्बर विधिः विधेयैः क्रीडन्त्यो न खलु
    परतन्त्राः प्रभुधियः ॥ १८॥ हरिस्ते साहस्रं कमलबलिमाधाय पदयोः यदेकोने तस्मिन् निजमुदहरन्नेत्रकमलम्
    । गतो भक्त्युद्रेकः परिणतिमसौ चक्र वपुषा
