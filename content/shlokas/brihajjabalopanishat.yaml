id: brihajjabalopanishat
category: upanishad
name:
  english: brihajjabalopanishat
  devanagari: बृहज्जाबालोपनिषत्
content:
  english: sastanubhih | vyashema devahitam yadayuh || svasti na indro vriddhashravah | svasti nah pusha
    vishvavedah | svasti nastarkshyo arishtanemih | svasti no brihaspatirdadhatu || om shantih shantih
    shantih || om apo va idamasatsalilameva | sa prajapatirekah pushkaraparne samabhavat | tasyantarmanasi
    kamah samavartata idam srijeyamiti | tasmadyatpurusho manasabhigacchati | tadvaca vadati | tatkarmana
    karoti | tadeshabhyanukta | kamastadagre samavartatadhi | manaso retah prathamam yadasit | sato bandhumasati
    niravindan | hridi pratishya kavayo manisheti | upainam tadupanamati | yatkamo bhavati | ya evam veda
    | sa tapo'tapyata | sa tapastaptva | sa etam bhusundah kalagnirudramagamadagatya bho vibhutermahatmyam
    bruhiti tatheti pratyavocadbhusundam vakshyamanam kimiti vibhutirudrakshayormahatmyam babhaneti adaveva
    paippaladena sahoktamiti tatphalashrutiriti tasyordhvam kim vadameti | brihajjabalabhidham muktishrutim
    mamopadesham kurushveti | om tadeti | sadyojatatprithivi | tasyah syannivrittih | tasyah kapilavarnananda
    | tadgomayena vibhutirjata | vamadevadudakam | tasmatpratishtha | tasyah krishnavarnabhadra | tadgomayena
    bhasitam jatam | aghoradvahnih | tasmadvidya | tasya raktavarna surabhih | tadgomayena bhasma jatam
    | tatpurushadvayuh | tasmacchantih | tasyah shvetavarna sushila | tasya gomayena ksharam jatam | ishanadakasham
    | tasmacchantyatita | tasyashcitravarna sumanah | tadgomayena raksha jata | vibhutirbhasitam bhasma
    ksharam raksheti bhasmano bhavanti panca namani | pancabhirnamabhirbhrishamaishvaryakaranadbhutih
    | bhasma sarvaghabhakshanat | bhasanadbhasitam | ksharanadapadam ksharam | bhutapretapishacabrahmarakshasapasmarabhavabhitibhyo'bhirakshana
    adraksheti || prathamam brahmanam || 1|| atha bhusundah kalagnirudramagnishomatmakam bhasmasnanavidhim
    papraccha | agniryathaiko bhuvanam pravishto rupam rupam pratirupo babhuva | ekam bhasma sarvabhutantaratma
    rupam rupam pratirupo bahishca || agnishomatmakam vishvamityagniracakshate | raudri ghora ya taijasi
    tanuh | somah shaktyamritamayah shaktikari tanuh | amritam yatpratishtha sa tejovidyakala svayam |
    sthulasukshmeshu bhuteshu sa eva rasatejasi || 1|| dvividha tejaso vrittih suryatma canalatmika |
    tathaiva rasashaktishca somatma canalatmika || 2|| vaidyudadimayam tejo madhuradimayo rasah | tejorasavibhedaistu
    vrittametaccaracaram || 3|| agneramritanishpattiramritenagniredhate | ata eva havih klriptamagnishomatmakam
    jagat || 4|| urdhvashaktimayam soma adhoshaktimayo'nalah | tabhyam samputitastasmacchashvadvishvamidam
    jagat || 5|| agnerurdhvam bhavatyesha yavatsaumyam paramritam | yavadagnyatmakam saumyamamritam visrityadhah
    || 6|| ata eva hi kalagniradhastacchaktirurdhvaga | yavadadahanashcordhvamadhastatpavanam bhavet ||
    7|| adharashaktyavadhritah kalagnirayamurdhvagah | tathaiva nimnagah somah shivashaktipadaspadah ||
    8|| shivashcordhvamayah shaktirurdhvashaktimayah shivah | tadittham shivashaktibhyam navyaptamiha
    kimcana || 9|| asakriccagnina dagdham jagattadbhasmasatkritam | agnerviryamidam prahustadviryam bhasma
    yattatah || 10|| yashcettham bhasmasadbhavam jnatvabhisnati bhasmana | agnirityadibhirmantrairdagdhapapah
    sa ucyate || 11|| agnerviryam ca tadbhasma somenaplavitam punah | ayogayuktya prakriteradhikaraya
    kalpate || 12|| yogayuktya tu tadbhasma plavyamanam samantatah | shaktenamritavarshena hyadhikarannivartate
    || 13|| ato mrityunjayayetthamamritaplavanam satam | shivashaktyamritasparshe labdha eva kuto mritih
    || 14|| yo veda gahanam guhyam pavanam ca tathoditam | agnishomaputam kritva na sa bhuyo'bhijayate
    || 15|| shivagnina tanum dagdhva shaktisomamritena yah | plavayedyogamargena so'mritatvaya kalpate
    so'mritvaya kalpata iti || 16|| dvitiyam brahmanam || 2|| atha bhusundah kalagnirudram vibhutiyogamanubruhiti
    hovaca vikatangamunmattam mahakhalam malinamashivadicihnanvitam punardhenum krishangam vatsahinamashantamadughdhadohinim
    nirindriyam jagdhatrinam keshacelasthibhakshinim sandhinim navaprasutam rogartam gam vihaya prashastagomayamaharedgomayam
    svastham grahyam shubhe sthane va patitamaparityajyata urdhvam mardayedgavyena gomayagrahanam kapila
    va dhavala va alabhe tadanya gauh syaddoshavarjita kapilagorbhasmoktam labdham gobhasma no cedanyagoksharam
    yatra kvapi sthitam ca yattanna hi dharyam samskarasahitam dharyam | tatraite shloka bhavanti | vidyashaktih
    samastanam shaktirityabhidhiyate | gunatrayashraya vidya sa vidya ca tadashraya || 1|| gunatrayamidam
    dhenurvidyabhudgomayam shubham | mutram copanishatproktam kuryadbhasma tatah param || vatsastu smritayashcasya
    tatsambhutam tu gomayam | agava iti mantrena dhenum tatrabhimantrayet || 3|| gavo bhaga gavo iti prashayettarpanam
    jalam | uposhya ca caturdashyam shukle krishne'thava vrati || 4|| paredyuh pratarutthaya shucirbhutva
    samahitah | kritasnano dhautavastrah payordham ca srijecca gam || 5|| utthapya gam prayatnena gayatrya
    mutramaharet | sauvarne rajate tamre dharayenmrinmaye ghate || 6|| paushkare'tha palashe va patre
    goshringa eva va | adadhita hi gomutram gandhadvareti gomayam || 7|| abhumipatam grihniyatpatre purvodite
    grihi | gomayam shodhayedvidvanshrirme bhajatumantratah || 8|| alakshmirma iti mantrena gomayam dhanyavarjitam
    | samtvasimcami mantrena gomaye kshipet || 9|| pancanam tviti mantrena pindanam ca caturdasha | kuryatsamshodhya
    kiranaih saurakairaharettatah || 10|| nidadhyadatha purvoktapatre gomayapindakan | svagrihyoktavidhanena
    pratishthapyagnimijayet || 11|| pindamshca nikshipettatra adyantam pranavena tu | shadaksharasya suktasya
    vyakritasya tathaksharaih || 12|| svahante juhuyattatra varnadevaya pindakan | agharavajyabhagau ca
    prakshipedvyahritih sudhih || 13|| tato nidhanapataye trayovimshajjuhoti ca | hotavyah panca brahmani
    namo hiranyabahave || 14|| iti sarvahutirhutva caturthyantaishca mantrakaih | ritamsatyam kadrudraya
    yasya vakankatiti ca || 15|| etaishca juhuyadvidvananajnatatrayam tatha | vyahritiratha hutva ca tatah
    svishtakritam hunet || 16|| homashesham tu nirvartya purnapatrodakam tatha | purnamasiti yajusha jalenanyena
    brimhayet || 17|| brahmaneshvamritamiti tajjalam shirasi kshipet | pracyamiti disham lingairdikshu
    toyam vinikshipet || 18|| brahmane dakshinam dattva shantyai pulakamaharet | aharishyami devanam sarvesham
    karmaguptaye || 19|| jatavedasamenam tvam pulakaishchadayamyaham | mantrenanena tam vahnim pulakaishchadayettatah
    || 20|| tridinam jvalanasthityai chadanam pulakaih smritam | brahmananbhojayedbhaktya svayam bhunjita
    vagyatah || 21|| bhasmadhikyamabhipsustu adhikam gomayam haret | dinatrayena yadi va ekasmindivase'thava
    || 22|| tritiye va caturthe va pratah snatva sitambarah | shuklayajnopaviti ca shuklamalyanulepanah
    || 23|| shukladanto bhasmadigdho mantrenanena mantravit | om tadbrahmeti coccarya paulakam bhasma
    samtyajet || 24|| tatra cavahanamukhanupacaramstu shodasha | kuryadvyahritibhistvevam tato'gnimupasamharet
    || 25|| agnirbhasmeti mantrena grihniyadbhasma cottaram | agnirityadimantrena pramrijya ca tatah param
    || 26|| samyojya gandhasalilaih kapilamutrakena va | candrakunkumakashmiramushiram candanam tatha
    || 27|| agarutritayam caiva curnayitva tu sukshmatah | kshipedbhasmani taccurnamomiti brahmamantratah
    || 28|| pranavenaharedvidvanbrihato vatakanatha | anoraniyaniti hi mantrena ca vicakshanah || 29||
    ittham bhasma susampadya shushkamadaya mantravit | pranavena vimrijyatha saptapranavamantritam ||
    30|| ishaneti shirodeshe mukham tatpurushena tu | urudeshamaghorena guhyam vamena mantrayet || 31||
    sadyojatena vai padansarvangam pranavena tu | tata uddhulya sarvangamapadatalamastakam || 32|| acamya
    vasanam dhautam tatashcaitatpradharayet | punaracamya karma svam kartumarhasi sattama || 33|| atha
    caturvidham bhasma kalpam | prathamamanukalpam | dvitiyamupakalpam | upopakalpam tritiyam | akalpam
    caturtham | agnihotram samudbhutam virajanalajamanukalpam | vane shushkam shakritsamgrihya kalpoktavidhina
    kalpitamupakalpam syat | aranye shushkagomayam curnikritya gomutraih pindikritya yathakalpam samskritamupopakalpam
    | shivalayasthamakalpam shatakalpam ca | ittham caturvidham bhasma papam nikrintayenmoksham dadatiti
    bhagavankalagnirudrah || 34|| iti tritiyam brahmanam || 3|| atha bhusundah kalagnirudram bhasmasnanavidhim
    bruhiti hovacatha pranavena vimrijyatha saptapranavenabhimantritamagamena tu tenaiva digbandhanam
    karayetpunarapi tenastramantrenangani murdhadinyuddhulayenmalasnanamidamishanadyaih pancabhirmantraistanum
    kramaddhulayet | ishaneti shirodesham mukham tatpurushena tu | urudeshamaghorena guhyakam vamadevatah
    | sadyojatena vai pado sarvangam pranavena tu | apadatalamastakam sarvangam tata uddhulacamya vasanam
    dhautam shvetam pradharayedvidhisnanamidam || tatra shloka bhavanti | bhasmamushtim samadaya samhitamantramantritam
    | mastakatpadaparyantam malasnanam puroditam || 1|| tanmantrenaiva kartavyam vidhisnanam samacaret
    | ishane pancadha bhasma vikirenmurdhni yatratah || 2|| mukhe caturthavaktrena aghorenashtadha hridi
    | vamena guhyadeshe tu tridashasthanabhedatah || 3|| ashtavantena sadhyena padavaddhulya yatratah
    | sarvangoddhulanam karyam rajanyasya yathavidhi || 4|| mukham vina ca tatsarvamuddhulya kramayogatah
    | sandhyadvaye nishithe ca tatha purvavasanayoh || 5|| suptva bhuktva payah pitva kritva cavashyakadikam
    | striyam napumsakam gridhram bidalam bakamushikam || 6|| sprishtva tathavidhananyanbhasmasnanam samacaret
    | devagniguruvriddhanam samipe'ntyajadarshane || 7|| ashuddhabhutale marge kuryanoddhulanam vrati
    | shankhatoyena mulena bhasmana mishranam bhavet || 8|| yojitam candanenaiva varina bhasmasamyutam
    | candanena samalimpejjnanadam curnameva tat || 9|| madhyahnatpragjalairyuktam toyam tadanuvarjayet
    || atha bhusundo bhagavantam kalagnirudram tripundravidhim papraccha || tatraite shloka bhavanti |
    tripundram karayetpashcadbrahmavishnushivatmakam | madhyangulibhiradaya tisribhirmulamantratah ||
    10|| anamamadhyamangushthairathava syattripundrakam | uddhulayenmukham viprah kshatriyastacchirodinam
    || 11|| dvatrimshasthanake cardham shodashasthanake'pi va | ashtasthane tatha caiva pancasthane'pi
    yojayet || 12|| uttamange lalate ca karnayornetrayostatha | nasavakre gale caivamamsadvayamatah param
    || 13|| kurpare manibandhe ca hridaye parshvayordvayoh | nabhau guhyadvaye caivamurvoh sphigbimbajanuni
    || 14|| janghadvaye ca padau ca dvatrimshatsthanamuttamam | ashtamurtyashtavidyeshandikpalanvasubhih
    saha || 15|| dharo dhruvashca somashca kripashcaivanilo'nalah | pratyupashca prabhasashca vasavo'shtavitiritah
    || 16|| etesham namamantrena tripundrandharayedbudhah | vidadhyatshodashasthane tripundram tu samahitah
    || 17|| shirshake ca lalate ca karne kanthem'sakadvaye | kurpare manibandhe ca hridaye nabhiparshvayoh
    || 18|| prishthe caikam pratisthanam japettatradhidevatah | shivam shaktim ca sadakhyamisham vidyakhyameva
    ca || 19|| vamadinavashaktishca etah shodasha devatah | nasatyo dasrakashcaiva ashvinau dvau samiritau
    || 20|| athava murdhnyalike ca karnayoh shvasane tatha | bahudvaye ca hridaye nabhyamurvoryuge tatha
    || 21|| janudvaye ca padayoh prishthabhage ca shodasha | shivashcendrashca rudrarkau vighnesho vishnureva
    ca || 22|| shrishcaiva hridayeshashca tatha nabhau prajapatih | nagashca nagakanyashca ubhe ca rishikanyake
    || 23|| padayoshca samudrashca tirthah prishthe'pi ca sthitah | evam va shodashasthanamashtasthanamthocyate
    || 24|| gurusthanam lalatam ca karnadvayamanantaram | asayugmam ca hridayam nabhirityashtamam bhavet
    || 25|| brahma ca rishayah sapta devatashca prakirtitah | athava mastakam bahu hridayam nabhireva
    ca || 26|| pancasthananyamunyahurbhasmatattvavido janah | yathasambhavatah kuryaddeshakaladyapekshaya
    || 27|| uddhulane'pyashaktashcettripundradini karayet | lalate hridaye nabhau gale ca manibandhayoh
    || 28|| bahumadhye bahumule prishthe caiva ca shirshake || lalate brahmane namah | hridaye havyavahanaya
    namah | nabhau skandaya namah | gale vishnave namah | madhye prabhanjanaya namah | manibandhe vasubhyo
    namah | prishthe haraye namah | kukudi shambhave namah | shirasi paramatmane namah | ityadisthaneshu
    tripundram dharayet || trinetram trigunadharam trayanam janakam prabhum | smarannamah shivayeti lalate
    tattripundrakam || 29|| kurparadhah pitribhyam tu ishanabhyam tathopari | ishabhyam nama ityuktva
    parshvayoshca tripundrakam || 30|| svacchabhyam nama ityuktva dharayettatprakoshthayoh | bhimayeti
    tatha prishthe shivayeti ca parshvayoh || 31|| nilakanthaya shirasi kshipetsarvatmane namah | papam
    nashayate kritsnamapi janmantararjitam || 32|| kanthopari kritam papam nashtam syattatra dharanat
    | karne tu dharanatkarnarogadikritapatakam || 33|| bahvobahukritam papam vakshahsu manasa kritam |
    nabhyam shishnakritam papam prishthe gudakritam tatha || 34|| parshvayordharanatpapam parastryalinganadikam
    | tadbhasmadharanam kuryatsarvatraiva tripundrakam || 35|| brahmavishnumaheshanam trayyagninam ca
    dharanam | gunalokatrayanam ca dharanam tena vai shrutam || 36|| iti caturtham brahmanam || 4|| manastokena
    mantrena mantritam bhasma dharayet | urdhvapundram bhavetsamam madhyapundram triyayusham || 1|| triyayushani
    kurute lalate ca bhujadvaye | nabhau shirasi hritparshve brahmanah kshatriyastatha || 2|| traivarnikanam
    sarveshamagnihotrasamudbhavam | idam mukhyam grihasthanam virajanalajam bhavet || 3|| virajanalajam
    caiva dharyam proktam maharshibhih | aupasanasamutpannam grihasthanam visheshatah || 4|| samidagnisamutpannam
    dharyam vai brahmacarina | shudranam shrotriyagarapacanagnisamudbhavam || 5|| anyeshamapi sarvesham
    dharyam caivanalodbhavam | yatinam jnanadam proktam vanasthanam viraktidam || 6|| ativarnashramanam
    tu shmashanagnisamudbhavam | sarvesham devalayastham bhasma shivagnijam shivayoginam | shivalayastham
    tallingaliptam va mantrasamskaradagdham va || tatraite shloka bhavanti | tenadhitam shrutam tena tena
    sarvamanushthitam | yena viprena shirasi tripundram bhasmana dhritam || 7|| tyaktavarnashramacaro
    luptasarvakriyo'pi yah | sakrittiryaktripundrankadharanatso'pi pujyate || 8|| ye bhasmadharanam tyaktva
    karma kurvanti manavah | tesham nasti vinirmokshah samsarajjanmakotibhih || 9|| mahapatakayuktanam
    purvajanmarjitagasam | tripundroddhulanadvesho jayate sudridham budhah || 10|| yesham kopo bhavedbrahmam|
  devanagari: सस्तनूभिः । व्यशेम देवहितं यदायुः ॥ स्वस्ति न इन्द्रो वृद्धश्रवाः । स्वस्ति नः पूषा विश्ववेदाः
    । स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः । स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ आपो
    वा इदमसत्सलिलमेव । स प्रजापतिरेकः पुष्करपर्णे समभवत् । तस्यान्तर्मनसि कामः समवर्तत इदं सृजेयमिति ।
    तस्माद्यत्पुरुषो मनसाभिगच्च्हति । तद्वाचा वदति । तत्कर्मणा करोति । तदेषाभ्यनूक्ता । कामस्तदग्रे समवर्तताधि
    । मनसो रेतः प्रथमं यदासीत् । सतो बन्धुमसति निरविन्दन् । हृदि प्रतीष्या कवयो मनीषेति । उपैनं तदुपनमति
    । यत्कामो भवति । य एवं वेद । स तपोऽतप्यत । स तपस्तप्त्वा । स एतं भुसुण्डः कालाग्निरुद्रमगमदागत्य भो
    विभूतेर्माहात्म्यं ब्रूहीति तथेति प्रत्यवोचद्भुसुण्डं वक्ष्यमाणं किमिति विभूतिरुद्राक्षयोर्माहात्म्यं
    बभाणेति आदावेव पैप्पलादेन सहोक्तमिति तत्फलश्रुतिरिति तस्योर्ध्वं किं वदामेति । बृहज्जाबालाभिधां मुक्तिश्रुतिं
    ममोपदेशं कुरुष्वेति । ॐ तदेति । सद्योजातात्पृथिवी । तस्याः स्यान्निवृत्तिः । तस्याः कपिलवर्णानन्दा
    । तद्गोमयेन विभूतिर्जाता । वामदेवादुदकम् । तस्मात्प्रतिष्ठा । तस्याः कृष्णवर्णाभद्रा । तद्गोमयेन भसितं
    जातम् । अघोराद्वह्निः । तस्माद्विद्या । तस्या रक्तवर्णा सुरभिः । तद्गोमयेन भस्म जातम् । तत्पुरुषाद्वायुः
    । तस्माच्छान्तिः । तस्याः श्वेतवर्णा सुशीला । तस्या गोमयेन क्षारं जातम् । ईशानादाकाशम् । तस्माच्छान्त्यतीता
    । तस्याश्चित्रवर्णा सुमनाः । तद्गोमयेन रक्षा जाता । विभूतिर्भसितं भस्म क्षारं रक्षेति भस्मनो भवन्ति
    पञ्च नामानि । पञ्चभिर्नामभिर्भृशमैश्वर्यकारणाद्भूतिः । भस्म सर्वाघभक्षणात् । भासनाद्भसितम् । क्षारणदापदां
    क्षारम् । भूतप्रेतपिशाचब्रह्मराक्षसापस्मारभवभीतिभ्योऽभिरक्षण अद्रक्षेति ॥ प्रथमं ब्राह्मणम् ॥ १॥ अथ
    भुसुण्डः कालाग्निरुद्रमग्नीषोमात्मकं भस्मस्नानविधिं पप्रच्च्ह । अग्निर्यथैको भुवनं प्रविष्टो रूपं
    रूपं प्रतिरूपो बभूव । एकं भस्म सर्वभूतान्तरात्मा रूपं रूपं प्रतिरूपो बहिश्च ॥ अग्नीषोमात्मकं विश्वमित्यग्निराचक्षते
    । रौद्री घोरा या तैजसी तनूः । सोमः शक्त्यमृतमयः शक्तिकरी तनूः । अमृतं यत्प्रतिष्ठा सा तेजोविद्याकला
    स्वयम् । स्थूलसूक्ष्मेषु भूतेषु स एव रसतेजसी ॥ १॥ द्विविधा तेजसो वृत्तिः सूर्यात्मा चानलात्मिका ।
    तथैव रसशक्तिश्च सोमात्मा चानलात्मिका ॥ २॥ वैद्युदादिमयं तेजो मधुरादिमयो रसः । तेजोरसविभेदैस्तु वृत्तमेतच्चराचरम्
    ॥ ३॥ अग्नेरमृतनिष्पत्तिरमृतेनाग्निरेधते । अत एव हविः क्लृप्तमग्नीषोमात्मकं जगत् ॥ ४॥ ऊर्ध्वशक्तिमयं
    सोम अधोशक्तिमयोऽनलः । ताभ्यां संपुटितस्तस्माच्च्हश्वद्विश्वमिदं जगत् ॥ ५॥ अग्नेरूर्ध्वं भवत्येषा यावत्सौम्यं
    परामृतम् । यावदग्न्यात्मकं सौम्यममृतं विसृत्यधः ॥ ६॥ अत एव हि कालाग्निरधस्ताच्च्हक्तिरूर्ध्वगा । यावदादहनश्चोर्ध्वमधस्तात्पावनं
    भवेत् ॥ ७॥ आधारशक्त्यावधृतः कालाग्निरयमूर्ध्वगः । तथैव निम्नगः सोमः शिवशक्तिपदास्पदः ॥ ८॥ शिवश्चोर्ध्वमयः
    शक्तिरूर्ध्वशक्तिमयः शिवः । तदित्थं शिवशक्तिभ्यां नाव्याप्तमिह किंचन ॥ ९॥ असकृच्चाग्निना दग्धं जगत्तद्भस्मसात्कृतम्
    । अग्नेर्वीर्यमिदं प्राहुस्तद्वीर्यं भस्म यत्ततः ॥ १०॥ यश्चेत्थं भस्मसद्भावं ज्ञात्वाभिस्नाति भस्मना
    । अग्निरित्यादिभिर्मन्त्रैर्दग्धपापः स उच्यते ॥ ११॥ अग्नेर्वीर्यं च तद्भस्म सोमेनाप्लावितं पुनः ।
    अयोगयुक्त्या प्रकृतेरधिकाराय कल्पते ॥ १२॥ योगयुक्त्या तु तद्भस्म प्लाव्यमानं समन्ततः । शाक्तेनामृतवर्षेण
    ह्यधिकारान्निवर्तते ॥ १३॥ अतो मृत्युञ्जयायेत्थममृतप्लावनं सताम् । शिवशक्त्यमृतस्पर्शे लब्ध एव कुतो
    मृतिः ॥ १४॥ यो वेद गहनं गुह्यं पावनं च तथोदितम् । अग्नीषोमपुटं कृत्वा न स भूयोऽभिजायते ॥ १५॥ शिवाग्निना
    तनुं दग्ध्वा शक्तिसोमामृतेन यः । प्लावयेद्योगमार्गेण सोऽमृतत्वाय कल्पते सोऽमृत्वाय कल्पत इति ॥ १६॥
    द्वितीयं ब्राह्मणम् ॥ २॥ अथ भुसुण्डः कालाग्निरुद्रं विभूतियोगमनुब्रूहीति होवाच विकटाङ्गामुन्मत्तां
    महाखलां मलिनामशिवादिचिह्नान्वितां पुनर्धेनुं कृशाङ्गां वत्सहीनामशान्तामदुघ्धदोहिनीं निरिन्द्रियां
    जग्धतृणां केशचेलास्थिभक्षिणीं सन्धिनीं नवप्रसूतां रोगार्तां गां विहाय प्रशस्तगोमयमाहरेद्गोमयं स्वस्थं
    ग्राह्यं शुभे स्थाने वा पतितमपरित्यज्यात ऊर्ध्वं मर्दयेद्गव्येन गोमयग्रहणं कपिला वा धवला वा अलाभे
    तदन्या गौः स्याद्दोषवर्जिता कपिलागोर्भस्मोक्तं लब्धं गोभस्म नो चेदन्यगोक्षारं यत्र क्वापि स्थितं च
    यत्तन्न हि धार्यं संस्कारसहितं धार्यम् । तत्रैते श्लोका भवन्ति । विद्याशक्तिः समस्तानां शक्तिरित्यभिधीयते
    । गुणत्रयाश्रया विद्या सा विद्या च तदाश्रया ॥ १॥ गुणत्रयमिदं धेनुर्विद्याभूद्गोमयं शुभम् । मूत्रं
    चोपनिषत्प्रोक्तं कुर्याद्भस्म ततः परम् ॥ वत्सस्तु स्मृतयश्चास्य तत्संभूतं तु गोमयम् । आगाव इति मन्त्रेण
    धेनुं तत्राभिमन्त्रयेत् ॥ ३॥ गावो भग गावो इति प्राशयेत्तर्पणं जलम् । उपोष्य च चतुर्दश्यां शुक्ले कृष्णेऽथवा
    व्रती ॥ ४॥ परेद्युः प्रातरुत्थाय शुचिर्भूत्वा समाहितः । कृतस्नानो धौतवस्त्रः पयोर्धं च सृजेच्च गाम्
    ॥ ५॥ उत्थाप्य गां प्रयत्नेन गायत्र्या मूत्रमाहरेत् । सौवर्णे राजते ताम्रे धारयेन्मृण्मये घटे ॥ ६॥
    पौष्करेऽथ पलाशे वा पात्रे गोशृङ्ग एव वा । आदधीत हि गोमूत्रं गन्धद्वारेति गोमयम् ॥ ७॥ अभूमिपातं गृह्णीयात्पात्रे
    पूर्वोदिते गृही । गोमयं शोधयेद्विद्वान्श्रीर्मे भजतुमन्त्रतः ॥ ८॥ अलक्ष्मीर्म इति मन्त्रेण गोमयं धान्यवर्जितम्
    । संत्वासिंचामि मन्त्रेण गोमये क्षिपेत् ॥ ९॥ पञ्चानां त्विति मन्त्रेण पिण्डानां च चतुर्दश । कुर्यात्संशोध्य
    किरणैः सौरकैराहरेत्ततः ॥ १०॥ निदध्यादथ पूर्वोक्तपात्रे गोमयपिण्डकान् । स्वगृह्योक्तविधानेन प्रतिष्ठाप्याग्निमीजयेत्
    ॥ ११॥ पिण्डांश्च निक्षिपेत्तत्र आद्यन्तं प्रणवेन तु । षडक्षरस्य सूक्तस्य व्याकृतस्य तथाक्षरैः ॥ १२॥
    स्वाहान्ते जुहुयात्तत्र वर्णदेवाय पिण्डकान् । आघारावाज्यभागौ च प्रक्षिपेद्व्याहृतीः सुधीः ॥ १३॥ ततो
    निधनपतये त्रयोविंशज्जुहोति च । होतव्याः पञ्च ब्रह्माणि नमो हिरण्यबाहवे ॥ १४॥ इति सर्वाहुतिर्हुत्वा
    चतुर्थ्यन्तैश्च मन्त्रकैः । ऋतंसत्यं कद्रुद्राय यस्य वकङ्कतीति च ॥ १५॥ एतैश्च जुहुयाद्विद्वाननाज्ञातत्रयं
    तथा । व्याहृतीरथ हुत्वा च ततः स्विष्टकृतं हुनेत् ॥ १६॥ होमशेषं तु निर्वर्त्य पूर्णपात्रोदकं तथा ।
    पूर्णमसीति यजुषा जलेनान्येन बृंहयेत् ॥ १७॥ ब्राह्मणेष्वमृतमिति तज्जलं शिरसि क्षिपेत् । प्राच्यामिति
    दिशां लिङ्गैर्दिक्षु तोयं विनिक्षिपेत् ॥ १८॥ ब्रह्मणे दक्षिणां दत्त्वा शान्त्यै पुलकमाहरेत् । आहरिष्यामि
    देवानां सर्वेषां कर्मगुप्तये ॥ १९॥ जातवेदसमेनं त्वां पुलकैश्च्हादयाम्यहम् । मन्त्रेणानेन तं वह्निं
    पुलकैश्च्हादयेत्ततः ॥ २०॥ त्रिदिनं ज्वलनस्थित्यै च्हादनं पुलकैः स्मृतम् । ब्राह्मणान्भोजयेद्भक्त्या
    स्वयं भुञ्जीत वाग्यतः ॥ २१॥ भस्माधिक्यमभीप्सुस्तु अधिकं गोमयं हरेत् । दिनत्रयेण यदि वा एकस्मिन्दिवसेऽथवा
    ॥ २२॥ तृतीये वा चतुर्थे वा प्रातः स्नात्वा सिताम्बरः । शुक्लयज्ञोपवीती च शुक्लमाल्यानुलेपनः ॥ २३॥
    शुक्लदन्तो भस्मदिग्धो मन्त्रेणानेन मन्त्रवित् । ॐ तद्ब्रह्मेति चोच्चार्य पौलकं भस्म संत्यजेत् ॥ २४॥
    तत्र चावाहनमुखानुपचारांस्तु षोडश । कुर्याद्व्याहृतिभिस्त्वेवं ततोऽग्निमुपसंहरेत् ॥ २५॥ अग्निर्भस्मेति
    मन्त्रेण गृह्णीयाद्भस्म चोत्तरम् । अग्निरित्यादिमन्त्रेण प्रमृज्य च ततः परम् ॥ २६॥ संयोज्य गन्धसलिलैः
    कपिलामूत्रकेण वा । चन्द्रकुङ्कुमकाश्मीरमुशिरं चन्दनं तथा ॥ २७॥ अगरुत्रितयं चैव चूर्णयित्वा तु सूक्ष्मतः
    । क्षिपेद्भस्मनि तच्चूर्णमोमिति ब्रह्ममन्त्रतः ॥ २८॥ प्रणवेनाहरेद्विद्वान्बृहतो वटकानथ । अणोरणीयनिति
    हि मन्त्रेण च विचक्षणः ॥ २९॥ इत्थं भस्म सुसम्पाद्य शुष्कमादय मन्त्रवित् । प्रणवेन विमृज्याथ सप्तप्रणवमन्त्रितम्
    ॥ ३०॥ ईशानेति शिरोदेशे मुखं तत्पुरुषेण तु । उरुदेशमघोरेण गुह्यं वामेन मन्त्रयेत् ॥ ३१॥ सद्योजातेन
    वै पादान्सर्वाङ्गं प्रणवेन तु । तत उद्धूल्य सर्वाङ्गमापादतलमस्तकम् ॥ ३२॥ आचम्य वसनं धौतं ततश्चैतत्प्रधारयेत्
    । पुनराचम्य कर्म स्वं कर्तुमर्हसि सत्तम ॥ ३३॥ अथ चतुर्विधं भस्म कल्पम् । प्रथममनुकल्पम् । द्वितीयमुपकल्पम्
    । उपोपकल्पं तृतीयम् । अकल्पं चतुर्थम् । अग्निहोत्रं समुद्भूतं विरजानलजमनुकल्पम् । वने शुष्कं शकृत्संगृह्य
    कल्पोक्तविधिना कल्पितमुपकल्पं स्यात् । अरण्ये शुष्कगोमयं चूर्णीकृत्य गोमूत्रैः पिण्डीकृत्य यथाकल्पं
    संस्कृतमुपोपकल्पम् । शिवालयस्थमकल्पं शतकल्पं च । इत्थं चतुर्विधं भस्म पापं निकृन्तयेन्मोक्षं ददातीति
    भगवान्कालाग्निरुद्रः ॥ ३४॥ इति तृतीयं ब्राह्मणम् ॥ ३॥ अथ भुसुण्डः कालाग्निरुद्रं भस्मस्नानविधिं ब्रूहीति
    होवाचाथ प्रणवेन विमृज्याथ सप्तप्रणवेनाभिमन्त्रितमागमेन तु तेनैव दिग्बन्धनं कारयेत्पुनरपि तेनास्त्रमन्त्रेणाङ्गानि
    मूर्धादीन्युद्धूलयेन्मलस्नानमिदमीशानाद्यैः पञ्चभिर्मन्त्रैस्तनुं क्रमाद्धूलयेत् । ईशानेति शिरोदेशं
    मुखं तत्पुरुषेण तु । ऊरुदेशमघोरेण गुह्यकं वामदेवतः । सद्योजातेन वै पादो सर्वाङ्गं प्रणवेन तु । आपादतलमस्तकं
    सर्वाङ्गं तत उद्धूलाचम्य वसनं धौतं श्वेतं प्रधारयेद्विधिस्नानमिदम् ॥ तत्र श्लोका भवन्ति । भस्ममुष्टिं
    समादाय संहितामन्त्रमन्त्रिताम् । मस्तकात्पादपर्यन्तं मलस्नानं पुरोदितम् ॥ १॥ तन्मन्त्रेणैव कर्तव्यं
    विधिस्नानं समाचरेत् । ईशाने पञ्चधा भस्म विकिरेन्मूर्ध्नि यत्रतः ॥ २॥ मुखे चतुर्थवक्त्रेण अघोरेणाष्टधा
    हृदि । वामेन गुह्यदेशे तु त्रिदशस्थानभेदतः ॥ ३॥ अष्टावन्तेन साध्येन पादावद्धूल्य यत्रतः । सर्वाङ्गोद्धूलनं
    कार्यं राजन्यस्य यथाविधि ॥ ४॥ मुखं विना च तत्सर्वमुद्धूल्य क्रमयोगतः । सन्ध्याद्वये निशीथे च तथा पूर्वावसानयोः
    ॥ ५॥ सुप्त्वा भुक्त्वा पयः पीत्वा कृत्वा चावश्यकादिकम् । स्त्रियं नपुंसकं गृध्रं बिडालं बकमूषिकम्
    ॥ ६॥ स्पृष्ट्वा तथाविधानन्यान्भस्मस्नानं समाचरेत् । देवाग्निगुरुवृद्धानां समीपेऽन्त्यजदर्शने ॥ ७॥
    अशुद्धभूतले मार्गे कुर्यानोद्धूलनं व्रती । शङ्खतोयेन मूलेन भस्मना मिश्रणं भवेत् ॥ ८॥ योजितं चन्दनेनैव
    वारिणा भस्मसंयुतम् । चन्दनेन समालिम्पेज्ज्ञानदं चूर्णमेव तत् ॥ ९॥ मध्याह्नात्प्राग्जलैर्युक्तं तोयं
    तदनुवर्जयेत् ॥ अथ भुसुण्डो भगवन्तं कालाग्निरुद्रं त्रिपुण्ड्रविधिं पप्रच्च्ह ॥ तत्रैते श्लोका भवन्ति
    । त्रिपुण्ड्रं कारयेत्पश्चाद्ब्रह्मविष्णुशिवात्मकम् । मध्याङ्गुलिभिरादाय तिसृभिर्मूलमन्त्रतः ॥ १०॥
    अनामामध्यमाङ्गुष्ठैरथवा स्यात्त्रिपुण्ड्रकम् । उद्धूलयेन्मुखं विप्रः क्षत्रियस्तच्च्हिरोदिनम् ॥ ११॥
    द्वात्रिंशस्थानके चार्धं षोडशस्थानकेऽपि वा । अष्टस्थाने तथा चैव पञ्चस्थानेऽपि योजयेत् ॥ १२॥ उत्तमाङ्गे
    ललाटे च कर्णयोर्नेत्रयोस्तथा । नासावक्रे गले चैवमंसद्वयमतः परम् ॥ १३॥ कूर्परे मणिबन्धे च हृदये पार्श्वयोर्द्वयोः
    । नाभौ गुह्यद्वये चैवमूर्वोः स्फिग्बिम्बजानुनी ॥ १४॥ जङ्घाद्वये च पादौ च द्वात्रिंशत्स्थानमुत्तमम्
    । अष्टमूर्त्यष्टविद्येशान्दिक्पालान्वसुभिः सह ॥ १५॥ धरो ध्रुवश्च सोमश्च कृपश्चैवानिलोऽनलः । प्रत्यूपश्च
    प्रभासश्च वसवोऽष्टावितीरिताः ॥ १६॥ एतेषां नाममन्त्रेण त्रिपुण्ड्रान्धारयेद्बुधः । विदध्यात्षोडशस्थाने
    त्रिपुण्ड्रं तु समाहितः ॥ १७॥ शीर्षके च ललाटे च कर्णे कण्ठेंऽसकद्वये । कूर्परे मणिबन्धे च हृदये नाभिपार्श्वयोः
    ॥ १८॥ पृष्ठे चैकं प्रतिस्थानं जपेत्तत्राधिदेवताः । शिवं शक्तिं च सादाख्यमीशं विद्याख्यमेव च ॥ १९॥
    वामादिनवशक्तीश्च एताः षोडश देवताः । नासत्यो दस्रकश्चैव अश्विनौ द्वौ समीरितौ ॥ २०॥ अथवा मूर्ध्न्यलीके
    च कर्णयोः श्वसने तथा । बाहुद्वये च हृदये नाभ्यामूर्वोर्युगे तथा ॥ २१॥ जानुद्वये च पदयोः पृष्ठभागे
    च षोडश । शिवश्चेन्द्रश्च रुद्रार्कौ विघ्नेशो विष्णुरेव च ॥ २२॥ श्रीश्चैव हृदयेशश्च तथा नाभौ प्रजापतिः
    । नागश्च नागकन्याश्च उभे च ऋषिकन्यके ॥ २३॥ पादयोश्च समुद्राश्च तीर्थाः पृष्ठेऽपि च स्थिताः । एवं वा
    षोडशस्थानमष्टस्थानम्थोच्यते ॥ २४॥ गुरुस्थानं ललाटं च कर्णद्वयमनन्तरम् । असयुग्मं च हृदयं नाभिरित्यष्टमं
    भवेत् ॥ २५॥ ब्रह्मा च ऋषयः सप्त देवताश्च प्रकीर्तिताः । अथवा मस्तकं बाहू हृदयं नाभिरेव च ॥ २६॥ पञ्चस्थानान्यमून्याहुर्भस्मतत्त्वविदो
    जनाः । यथासम्भवतः कुर्याद्देशकलाद्यपेक्षया ॥ २७॥ उद्धूलनेऽप्यशक्तश्चेत्त्रिपुण्ड्रादीनि कारयेत् ।
    ललाटे हृदये नाभौ गले च मणिबन्धयोः ॥ २८॥ बाहुमध्ये बाहुमूले पृष्ठे चैव च शीर्षके ॥ ललाटे ब्रह्मणे नमः
    । हृदये हव्यवाहनाय नमः । नाभौ स्कन्दाय नमः । गले विष्णवे नमः । मध्ये प्रभञ्जनाय नमः । मणिबन्धे वसुभ्यो
    नमः । पृष्ठे हरये नमः । कुकुदि शम्भवे नमः । शिरसि परमात्मने नमः । इत्यादिस्थानेषु त्रिपुण्ड्रं धारयेत्
    ॥ त्रिनेत्रं त्रिगुणाधारं त्रयाणां जनकं प्रभुम् । स्मरन्नमः शिवायेति ललाटे तत्त्रिपुण्ड्रकम् ॥ २९॥
    कूर्पराधः पितृभ्यां तु ईशानाभ्यां तथोपरि । ईशाभ्यां नम इत्युक्त्वा पार्श्वयोश्च त्रिपुण्ड्रकम् ॥ ३०॥
    स्वच्छाभ्यां नम इत्युक्त्वा धारयेत्तत्प्रकोष्ठयोः । भीमायेति तथा पृष्ठे शिवायेति च पार्श्वयोः ॥ ३१॥
    नीलकण्ठाय शिरसि क्षिपेत्सर्वात्मने नमः । पापं नाशयते कृत्स्नमपि जन्मान्तरार्जितम् ॥ ३२॥ कण्ठोपरि कृतं
    पापं नष्टं स्यात्तत्र धारणात् । कर्णे तु धारणात्कर्णरोगादिकृतपातकम् ॥ ३३॥ बाह्वोबाहुकृतं पापं वक्षःसु
    मनसा कृतम् । नाभ्यां शिश्नकृतं पापं पृष्ठे गुदकृतं तथा ॥ ३४॥ पार्श्वयोर्धारणात्पापं परस्त्र्यालिङ्गनादिकम्
    । तद्भस्मधारणं कुर्यात्सर्वत्रैव त्रिपुण्ड्रकम् ॥ ३५॥ ब्रह्मविष्णुमहेशानां त्रय्यग्नीनां च धारणम्
    । गुणलोकत्रयाणां च धारणं तेन वै श्रुतम् ॥ ३६॥ इति चतुर्थं ब्राह्मणम् ॥ ४॥ मानस्तोकेन मन्त्रेण मन्त्रितं
    भस्म धारयेत् । ऊर्ध्वपुण्ड्रं भवेत्सामं मध्यपुण्ड्रं त्रियायुषम् ॥ १॥ त्रियायुषाणि कुरुते ललाटे च
    भुजद्वये । नाभौ शिरसि हृत्पार्श्वे ब्राह्मणाः क्षत्रियास्तथा ॥ २॥ त्रैवर्णिकानां सर्वेषामग्निहोत्रसमुद्भवम्
    । इदं मुख्यं गृहस्थानां विरजानलजं भवेत् ॥ ३॥ विरजानलजं चैव धार्यं प्रोक्तं महर्षिभिः । औपासनसमुत्पन्नं
    गृहस्थानां विशेषतः ॥ ४॥ समिदग्निसमुत्पन्नं धार्यं वै ब्रह्मचारिणा । शूद्राणां श्रोत्रियागारपचनाग्निसमुद्भवम्
    ॥ ५॥ अन्येषामपि सर्वेषां धार्यं चैवानलोद्भवम् । यतीनां ज्ञानदं प्रोक्तं वनस्थानां विरक्तिदम् ॥ ६॥
    अतिवर्णाश्रमाणां तु श्मशानाग्निसमुद्भवम् । सर्वेषां देवालयस्थं भस्म शिवाग्निजं शिवयोगिनाम् । शिवालयस्थं
    तल्लिङ्गलिप्तं वा मन्त्रसंस्कारदग्धं वा ॥ तत्रैते श्लोका भवन्ति । तेनाधीतं श्रुतं तेन तेन सर्वमनुष्ठितम्
    । येन विप्रेण शिरसि त्रिपुण्ड्रं भस्मना धृतम् ॥ ७॥ त्यक्तवर्णाश्रमाचारो लुप्तसर्वक्रियोऽपि यः । सकृत्तिर्यक्त्रिपुण्ड्राङ्कधारणात्सोऽपि
    पूज्यते ॥ ८॥ ये भस्मधारणं त्यक्त्वा कर्म कुर्वन्ति मानवाः । तेषां नास्ति विनिर्मोक्षः संसाराज्जन्मकोटिभिः
    ॥ ९॥ महापातकयुक्तानां पूर्वजन्मार्जितागसाम् । त्रिपुण्ड्रोद्धूलनद्वेषो जायते सुदृढं बुधाः ॥ १०॥ येषां
    कोपो भवेद्ब्रह्मं।
