id: ganapatishodashanamavalih
category: stotram
name:
  english: ganapatishodashanamavalih
  devanagari: गणपतिषोडशनामावलिः
content:
  english: rinuyadapi | vidyarambhe vivahe ca praveshe nirgame tatha | sangrame sarvakaryeshu vighnastasya
    na jayate || 3|| atha namavalih | om sumukhaya namah | om ekadantaya namah | om kapilaya namah | om
    gajakarnakaya namah | om lambodaraya namah | om vikataya namah | om vighnarajaya namah | om vinayakaya
    namah | om dhumaketave namah | om ganadhyakshaya namah | om bhalacandraya namah | om gajananaya namah
    | om vakratundaya namah | om shurpakarnaya namah | om herambaya namah | om skandapurvajaya namah |
    iti shriganapatishodashanamavalih samapta |
  devanagari: ृणुयादपि । विद्यारम्भे विवाहे च प्रवेशे निर्गमे तथा । सङ्ग्रामे सर्वकार्येषु विघ्नस्तस्य
    न जायते ॥ ३॥ अथ नामावलिः । ॐ सुमुखाय नमः । ॐ एकदन्ताय नमः । ॐ कपिलाय नमः । ॐ गजकर्णकाय नमः । ॐ लम्बोदराय
    नमः । ॐ विकटाय नमः । ॐ विघ्नराजाय नमः । ॐ विनायकाय नमः । ॐ धूमकेतवे नमः । ॐ गणाध्यक्षाय नमः । ॐ भालचन्द्राय
    नमः । ॐ गजाननाय नमः । ॐ वक्रतुण्डाय नमः । ॐ शूर्पकर्णाय नमः । ॐ हेरम्बाय नमः । ॐ स्कन्दपूर्वजाय नमः
    । इति श्रीगणपतिषोडशनामावलिः समाप्ता ।
meaning: {}
