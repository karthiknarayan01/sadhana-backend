id: bhagavadgita-parayana-gita-saram
category: stotram
name:
  english: Bhagavadgita Parayana - Gita Saram
content:
  english: gitasaram shrinuta sada manasi vikasam vahatamuda kamam krodham tyajata hrida bhuyat samvit
    parasukhada caranam vishada yogat parthena bhanitam kincinmoha dhiya tam sandigdham mocayitum gitashastram
    gitamidam || || sankhyam jnanam janihi sharanagati patha mavapnuhi atma nitya ssarvagato nainam kincit
    kledayati || phaleshu saktim maiva kuru karyam karma tu samacara karmabaddhah parameti karmani sangah
    patayati || || karmakarma vikarmatvam cintaya catmani karmagatim nasti jnanasamam loke tyaja cahankriti
    miha dehe || vaha samabuddhim sarvatra bhava samadarshi tvam hi sakhe yonanurakto na dveshti yogi
    yogam janati || || mitram tava te shatrurapi tvameva nanyo janturayi yuktastvam bhava ceshtasu aharadishu
    vividhasu || anatmarupa mashtavidham prakriti mavidyam janihi jiva ssaiva hi paramatma yasmin protam
    sarvamidam || || akshara para vara purusham tam dhyayan preto yati param tata stameva dhyayan tvam
    kalam yapaya nashyantam || sarvam brahmarpana buddhya karma kriyatam samabuddhya bhaktya dattam patramapi
    phalamapi tena svikriyate || || yatra vibhuti shshri yukta yatra vibhuti ssattvayuta tatra tamisham
    pashyantam nershya dveshau sajjete || kalastasya mahan rupo lokan sarvan sangrasati bhaktya bhagavadrupam
    tam prabhavati loka ssandrashtum || || bhakti stasmin ratirupa saiva hi bhaktoddharanacana bhavam
    tasya madhaya buddhim tasmi nniveshaya || jnam janihi kshetre mamatam ma kuru ca atmanam yo janati
    atmani soyam nanu ramate || || sattvika rajasa tamasika bandhana hetava athavarjyah trayam gunanam
    yotita ssaiva brahmam sukhameti || chitva samsarikavriksham padam gaveshaya munilakshyam tatkila sarvam
    tejo yat vedai ssarvai ssamvedyam || || srishti rdaivi casurika dvividha prokta lokesmin daive sakta
    yanti param asurasakta asuragatim || nishtha yajne dane ca tapasi prokta saditi para satkila saphalam
    sashraddham tatkila nishphala mashraddham || || dharman sarvan tyaktva tvam sharanam vraja para matmanam
    moksham prapsyasi satyam tvam santata saccidananda ghanam || || || gitasaram shrinuta sada ||
  devanagari: गीतासारं शृणुत सदा मनसि विकासं वहतमुदा कामं क्रोधं त्यजत हृदा भूयात् संवित् परसुखदा चरणं
    विषाद योगात् पार्थेन भणितं किञ्चिन्मोह धिया तं सन्दिग्धं मोचयितुं गीताशास्त्रं गीतमिदं ॥ ॥ साङ्ख्यं
    ज्ञानं जानीहि शरणागति पथ मवाप्नुहि आत्म नित्य स्सर्वगतो नैनं किञ्चित् क्लेदयति ॥ फलेषु सक्तिं मैव
    कुरु कार्यं कर्म तु समाचर कर्माबद्धः परमेति कर्मणि सङ्गः पातयति ॥ ॥ कर्माकर्म विकर्मत्वं चिन्तय चात्मनि
    कर्मगतिं नास्ति ज्ञानसमं लोके त्यज चाहङ्कृति मिह देहे ॥ वह समबुद्धिं सर्वत्र भव समदर्शी त्वं हि सखे
    योननुरक्तो न द्वेष्टि योगी योगं जानाति ॥ ॥ मित्रं तव ते शत्रुरपि त्वमेव नान्यो जन्तुरयि युक्तस्त्वं
    भव चेष्टासु आहारादिषु विविधासु ॥ अनात्मरूपा मष्टविधां प्रकृति मविद्यां जानीहि जीव स्सैव हि परमात्मा
    यस्मिन् प्रोतं सर्वमिदं ॥ ॥ अक्षर पर वर पुरुषं तं ध्यायन् प्रेतो याति परं तत स्तमेव ध्यायन् त्वं कालं
    यापय नश्यन्तं ॥ सर्वं ब्रह्मार्पण बुद्ध्या कर्म क्रियतां समबुद्ध्या भक्त्या दत्तं पत्रमपि फलमपि तेन
    स्वीक्रियते ॥ ॥ यत्र विभूति श्श्री युक्ता यत्र विभूति स्सत्त्वयुता तत्र तमीशं पश्यन्तं नेर्ष्या द्वेषौ
    सज्जेते ॥ कालस्तस्य महान् रूपो लोकान् सर्वान् सङ्ग्रसति भक्त्या भगवद्रूपं तं प्रभवति लोक स्सन्द्रष्टुं
    ॥ ॥ भक्ति स्तस्मिन् रतिरूपा सैव हि भक्तोद्धरणचणा भावं तस्या माधाय बुद्धिं तस्मि न्निवेशय ॥ ज्ञं जानीहि
    क्षेत्रे ममतां मा कुरु च आत्मानं यो जानाति आत्मनि सोयं ननु रमते ॥ ॥ सात्त्विक राजस तामसिका बन्धन हेतव
    अथवर्ज्यः त्रयं गुणानां योतीत स्सैव ब्राह्मं सुखमेति ॥ छित्वा सांसारिकवृक्षं पदं गवेषय मुनिलक्ष्यं
    तत्किल सर्वं तेजो यत् वेदै स्सर्वै स्संवेद्यं ॥ ॥ सृष्टि र्दैवी चासुरिका द्विविधा प्रोक्ता लोकेस्मिन्
    दैवे सक्ता यान्ति परं आसुरसक्ता असुरगतिं ॥ निष्ठा यज्ञे दाने च तपसि प्रोक्ता सदिति परा सत्किल सफलं
    सश्रद्धं तत्किल निष्फल मश्रद्धं ॥ ॥ धर्मान् सर्वान् त्यक्त्वा त्वं शरणं व्रज पर मात्मानं मोक्षं प्राप्स्यसि
    सत्यं त्वं सन्तत सच्चिदानन्द घनं ॥ ॥ ॥ गीतासारं शृणुत सदा ॥
