id: totakashtakam
category: stotram
name:
  english: Totakashtakam
  devanagari: तोटकाष्टकम्
content:
  english: shankaram shankaracaryam keshavam badarayanam sutrabhashyakritau vande bhagavantau punah punah
    narayanam padmabhuvam vasishtham shaktim ca tatputraparasharam ca vyasam shukam gaudapadam mahantam
    govindayogindramathasya shishyam shankaracaryamathasya padmapadam ca hastamalakam ca shishyam tam
    totakam vartikakaramanyanasmadgurun santatamanato'smi hridaye kalaye vimalam caranam bhava shankara
    deshika me sharanam vidam bhava shankara deshika me sharanam bhavata janata suhita bhavita nija vidam
    bhava shankara deshika me sharanam bhava eva bhavaniti me nitaram samajayata cetasi kautukita jaladhim
    bhava shankara deshika me sharanam sukrite'dhikrite bahudha bhavato bhavita sama atidinamimam paripalaya
    mam bhava shankara deshika me sharanam jagatimavitum kalitakritayo vicaranti maha ahimamshurivatra
    vibhasi puro bhava shankara deshika me sharanam ketana te samatamayatam na hi ko'pi sudhih nidhe bhava
    shankara deshika me sharanam kala na ca kincana kancanamasti guro drutameva vidhehi kripam sahajam
    bhava shankara deshika me sharanam totakacaryaviracitam shri totakashtakam sampurnam||
  devanagari: शङ्करं शङ्कराचार्यं केशवं बादरायणम् सूत्रभाष्यकृतौ वन्दे भगवन्तौ पुनः पुनः नारायणं पद्मभुवं
    वसिष्ठं शक्तिं च तत्पुत्रपराशरं च व्यासं शुकं गौडपदं महान्तं गोविन्दयोगीन्द्रमथास्य शिष्यम् शङ्कराचार्यमथास्य
    पद्मपादं च हस्तामलकं च शिष्यं तं तोटकं वार्तिककारमन्यानस्मद्गुरून् सन्ततमानतोऽस्मि हृदये कलये विमलं
    चरणं भव शङ्कर देशिक मे शरणम् विदं भव शङ्कर देशिक मे शरणम् भवता जनता सुहिता भविता निज विदं भव शङ्कर
    देशिक मे शरणम् भव एव भवानिति मे नितरां समजायत चेतसि कौतुकिता जलधिं भव शङ्कर देशिक मे शरणम् सुकृतेऽधिकृते
    बहुधा भवतो भविता सम अतिदीनमिमं परिपालय मां भव शङ्कर देशिक मे शरणम् जगतीमवितुं कलिताकृतयो विचरन्ति
    महा अहिमांशुरिवात्र विभासि पुरो भव शङ्कर देशिक मे शरणम् केतन ते समतामयतां न हि कोऽपि सुधीः निधे भव
    शङ्कर देशिक मे शरणम् कला न च किञ्चन काञ्चनमस्ति गुरो द्रुतमेव विधेहि कृपां सहजां भव शङ्कर देशिक मे
    शरणम् तोटकाचार्यविरचितं श्री तोटकाष्टकं सम्पूर्णम्॥
