id: dattagayatrimantravidhanam
category: mantra
name:
  english: dattagayatrimantravidhanam
  devanagari: दत्तगायत्रीमन्त्रविधानम्
content:
  english: om asya shridattatreyamantrasya shabara rishih | gayatri chandah | shridattatreyo devata |
    dram bijam | hrim shaktih | krom kilakam | shridattatreyaprityarthe jape viniyogah || rishyadinyasah
    | shabararishaye namah shirasi | gayatrichandase namah mukhe | shridattatreyadevatayai namah hridaye
    | dram bijaya namah guhye | hrim shaktaye namah padayoh | krom kilakaya namah nabhau | shridattatreyaprityarthe
    jape viniyogaya namah sarvange || karanyasah
  devanagari: ॐ अस्य श्रीदत्तात्रेयमन्त्रस्य शबर ऋषिः । गायत्री छन्दः । श्रीदत्तात्रेयो देवता । द्रां
    बीजम् । ह्रीं शक्तिः । क्रों कीलकम् । श्रीदत्तात्रेयप्रीत्यर्थे जपे विनियोगः ॥ ऋष्यादिन्यासः । शबरऋषये
    नमः शिरसि । गायत्रीछन्दसे नमः मुखे । श्रीदत्तात्रेयदेवतायै नमः हृदये । द्रां बीजाय नमः गुह्ये । ह्रीं
    शक्तये नमः पादयोः । क्रों कीलकाय नमः नाभौ । श्रीदत्तात्रेयप्रीत्यर्थे जपे विनियोगाय नमः सर्वाङ्गे
    ॥ करन्यासः
meaning: {}
