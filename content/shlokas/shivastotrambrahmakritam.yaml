id: shivastotrambrahmakritam
category: stotram
name:
  english: shivastotrambrahmakritam
  devanagari: शिवस्तोत्रम्ब्रह्मकृतं
content:
  english: namaste'stu mahadeva namaste parameshvara | namah shivaya devaya namaste brahmarupine || 20||
    yasya dyaurabhavanmurdha padau prithvi disho bhujah | akashamudaram tasmai viraje pranamamyaham ||
    34|| santapayati yo nityam svabhabhirbhasayandishah | brahmatejomayam vishvam tasmai suryatmane namah
    || 35|| havyam vahati yo nityam rodri tejomayi tanuh | kavyam pitrigananam ca tasmai vahnyatmane namah
    || 36|| apyayayati yo nityam svadhamna sakalam jagat | piyate devatasandhaistasmai candratmane namah
    || 37|| bibhartyasheshabhutani yo'ntashcarati sarvada | shaktirmaheshvari tubhyam tasmai vayvatmane
    namah || 38|| srijatyasheshamevedam yah svakarmanurupatah || svatmanyavasthitastasmai caturvaktratmane
    namah || 39|| yah shete sheshashayane vishvamavritya mayaya | atmanubhutiyogena tasmai vishvatmane
    namah || 40|| bibharti shirasa nityam dvisaptabhuvanatmakam | brahmandam yo'khiladharam tasmai sheshatmane
    namah || 41|| yah parante paranandam pitva divyaikasakshinam | nrityatyanantamahima tasmai rudratmane
    namah || 42|| yo'ntara sarvabhutanam niyanta tishthatishvarah | tam sarvasakshinam devam namaste paramatmane
    || 43|| yasya kesheshu jimuta nadyah sarvangasandhishu | kukshau samudrashcatvarastasmai vyomatmane
    namah || 44|| yam vinidra yatashvasah santushtah samadarshinah || jyotih pashyanti yunjanastasmai
    yogatmane namah || 45| yasya bhasa vibhatidam tadaham tamasah param | tattvam sada nirakaram cidrupam
    parameshvaram || 46|| yaya santarate mayam yogi sankshinakalmashah | aparantamaparyantam tasmai vidyatmane
    namah || 47|| nityanandam niradharam nishkalam paramam shivam | prapadye paramatmanam bhavantam parameshvaram
    || 48|| evam stutva mahadevam brahma tadbhavabhavitah | pranjalih pranatastasthau grinanbrahma sanatanam
    || 49|| tatastatya mahadevo nityayogamanuttamam | aishvaryam brahmasadbhavam vairagyam ca dado harah
    || 50|| iti saurapurane trayovimshatyadhyayantargatam brahmakritam shivastotram sampurnam |
  devanagari: नमस्तेऽस्तु महादेव नमस्ते परमेश्वर । नमः शिवाय देवाय नमस्ते ब्रह्मरूपिणे ॥ २०॥ यस्य द्यौरभवन्मूर्धा
    पादौ पृथ्वी दिशो भुजाः । आकाशमुदरं तस्मै विराजे प्रणमाम्यहम् ॥ ३४॥ सन्तापयति यो नित्यं स्वभाभिर्भासयन्दिशः
    । ब्रह्मतेजोमयं विश्वं तस्मै सूर्यात्मने नमः ॥ ३५॥ हव्यं वहति यो नित्यं रोद्री तेजोमयी तनुः । कव्यं
    पितृगणानां च तस्मै वह्न्यात्मने नमः ॥ ३६॥ आप्याययति यो नित्यं स्वधाम्ना सकलं जगत् । पीयते देवतासन्धैस्तस्मै
    चन्द्रात्मने नमः ॥ ३७॥ बिभर्त्यशेषभूतानि योऽन्तश्चरति सर्वदा । शक्तिर्माहेश्वरी तुभ्यं तस्मै वाय्वात्मने
    नमः ॥ ३८॥ सृजत्यशेषमेवेदं यः स्वकर्मानुरूपतः ॥ स्वात्मन्यवस्थितस्तस्मै चतुर्वक्त्रात्मने नमः ॥ ३९॥
    यः शेते शेषशयने विश्वमावृत्य मायया । आत्मानुभूतियोगेन तस्मै विश्वात्मने नमः ॥ ४०॥ बिभर्ति शिरसा नित्यं
    द्विसप्तभुवनात्मकम् । ब्रह्माण्डं योऽखिलाधारं तस्मै शेषात्मने नमः ॥ ४१॥ यः परान्ते परानन्दं पीत्वा
    दिव्यैकसाक्षिणम् । नृत्यत्यनन्तमहिमा तस्मै रुद्रात्मने नमः ॥ ४२॥ योऽन्तरा सर्वभूतानां नियन्ता तिष्ठतीश्वरः
    । तं सर्वसाक्षिणं देवं नमस्ते परमात्मने ॥ ४३॥ यस्य केशेषु जीमूता नद्यः सर्वाङ्गसन्धिषु । कुक्षौ समुद्राश्चत्वारस्तस्मै
    व्योमात्मने नमः ॥ ४४॥ यं विनिद्रा यतश्वासाः सन्तुष्टाः समदर्शिनः ॥ ज्योतिः पश्यन्ति युञ्जानास्तस्मै
    योगात्मने नमः ॥ ४५। यस्य भासा विभातीदं तदहं तमसः परम् । तत्त्वं सदा निराकारं चिद्रूपं पारमेश्वरम्
    ॥ ४६॥ यया सन्तरते मायां योगी सङ्क्षीणकल्मषः । अपरान्तामपर्यन्तां तस्मै विद्यात्मने नमः ॥ ४७॥ नित्यानन्दं
    निराधारं निष्कलं परमं शिवम् । प्रपद्ये परमात्मानं भवन्तं परमेश्वरम् ॥ ४८॥ एवं स्तुत्वा महादेवं ब्रह्मा
    तद्भावभावितः । प्राञ्जलिः प्रणतस्तस्थौ गृणन्ब्रह्म सनातनम् ॥ ४९॥ ततस्तत्य महादेवो नित्ययोगमनुत्तमम्
    । ऐश्वर्यं ब्रह्मसद्भावं वैराग्यं च ददो हरः ॥ ५०॥ इति सौरपुराणे त्रयोविंशत्यध्यायान्तर्गतं ब्रह्मकृतं
    शिवस्तोत्रं सम्पूर्णम् ।
