id: devaihkritamnrisimhastotram
category: stotram
name:
  english: devaihkritamnrisimhastotram
  devanagari: देवैःकृतंनृसिंहस्तोत्रम्
content:
  english: devaih kritam nrisimhastotram tam tushtuvuh surashreshtha loka lokacale sthitah | sabrahmakah
    sasadhyashca sayamah samarudganah || 21|| paratparataram brahma tattvattattvatamam bhavan | jyotisham
    tu paranjyotih paramatma jaganmayah || 22|| sthulam sukshmam susukshmam ca shabdabrahmamayah shubhah
    | vagatito niralambo nirddhandvo nirupaplavah || 23|| yajnabhugyajnamurtistvam yajninam phaladah prabhuh
    | bhavanmatsyakritih kaurmamasthaya jagati sthitah || 24|| varahim caiva tam saimhimasthayeha vyavasthitah
    | devanam devarakshartham nihatya ditijeshvaram || 25|| dvijashapacchalenaivamavatirno'si lilaya |
    na drishtam yattvadanyam hi bhavansarvancaracaram || 26|| bhavanvishnurbhavan rudro bhavaneva pitamahah
    | bhavanadirbhavananto bhavaneva vayam vibho || 27|| bhavaneva jagatsarvam pralapena kimishvara |
    mayaya bahudha samsthamadvitiyamayam prabho || 28|| stoshyamastvam katham bhasi devadeva mrigadhipa
    | stuto'pi vividhaih stutyairbhavairnanavidhaih prabhuh || 29|| na jagama dvijah shantim manayanyonimatmanah
    | yo nrisimhastavam bhaktya pathedvartham vicarayet || 30|| shravayedva dvijansarvan vishnuloke mahiyate
    | tadantare shivam devah sendrah sabrahmakah prabhum || 31|| samprapya tushtavuh sarvam vijnapya mrigarupinah
    | tato brahmadayasturnam samstuya parameshvaram || 32|| atmatranaya sharanam jagmuh paramakaranam
    | mandarastham mahadevam kridamanam sahomaya || 33|| sevitam ganagandharvaih siddhairapsarasam ganaih
    | devatabhih saha brahma bhitabhitah sagadgadam | pranamya dandavadbhumau tushtava parameshvaram ||
    34|| brahmovaca | namaste kalakalaya namaste rudra manyave | namah shivaya rudraya shankaraya shivaya
    te || 35|| ugro'si sarvabhutanam niyantasi shivo'si nah | namah shivaya sharvaya shankarayarttiharine
    || 36|| mayaskaraya vishvaya vishnave brahmane namah | antakaya namastubhyamumayah pataye namah ||
    37|| hiranyabahave sakshaddhiranyapataye namah | sharvaya sarvarupaya purushaya namo namah || 38||
    sadasadvyaktihinaya mahatah karanaya te | nityaya vishvarupaya jayamanaya te namah || 39|| jataya
    bahudha loke prabhutaya namo namah | rudraya nilarudraya kadrudraya pracetase || 40|| kalaya kalarupaya
    namah kalangaharine | midhushtamaya devaya shitikanthaya te namah || 41|| mahiyase namastubhyam hantre
    devarinam sada | taraya ca sutaraya taranaya namo namah || 42|| harikeshaya devaya shambhave paramatmane
    | devanam shambhave tubhyam bhutanam shambhave namah || 43|| shambhave haimavatyashca manyave rudrarupine
    | kapardine namastubhyam kalakanthaya te namah || 44|| hiranyaya maheshaya shrikanthaya namo namah
    | bhasmadigdhashariraya dandamundishvaraya ca || 45|| namo hrasvaya dirghaya vamanaya namo namah |
    nama ugratrishulaya ugraya ca namo namah || 46|| bhimaya bhimarupaya bhimakarmarataya te | agrevadhaya
    vai bhutva namo durevadhaya ca || 47|| dhanvine shuline tubhyam gadine haline namah | cakrine varmine
    nityam daityanam karmabhedine || 48|| sadyaya sadyarupaya sadyojataya te namah | vamaya vamarupaya
    vamanetraya te namah || 49|| aghorarupaya vikataya vikatashariraya te namah | purusharupaya purushaikatatpurushaya
    vai namah || 50|| purusharthapradanaya pataye parameshthine | ishanaya namastubhyamishvaraya namo
    namah || 51|| brahmane brahmarupaya namah sakshacchivaya te | sarvavishnurnrisimhasya rupamasthaya
    vishvakrit || 52|| hiranyakashipum hatva karajairnishitaih svayam | daityendrairbahubhih sardham hitartham
    jagatam prabhuh || 53|| saimhim samanayanyonim badhate nikhilam jagat | yatkrityamatra devesha tatkurushva
    bhavaniha || 54|| ugro'si sarvadushtanam niyantasi shivo'si nah | kalakutadivapusha trahi nah sharanagatan
    || 55|| shukram tu vrittam vishvesha krida vai kevalam vayam | tavonmeshanimeshabhyamasmakam pralayodayau
    || 56|| unmilaye tvayi brahmanvinasho'sti na te shiva | santaptah smo vayam deva harinamitatejasa
    || 57|| sarvalokahitayainam tattvam samharttumicchasi | iti shrilingamahapurane purvabhage pancanavatitamadhyayantargatam
    devaih kritam nrisimhastotram samaptam | lingapurana | purvabhaga | adhyaya 95
  devanagari: देवैः कृतं नृसिंहस्तोत्रम् तं तुष्टुवुः सुरश्रेष्ठा लोका लोकाचले स्थिताः । सब्रह्मकाः ससाध्याश्च
    सयमाः समरुद्गणाः ॥ २१॥ परात्परतरं ब्रह्म तत्त्वात्तत्त्वतमं भवान् । ज्योतिषां तु परञ्ज्योतिः परमात्मा
    जगन्मयः ॥ २२॥ स्थूलं सूक्ष्मं सुसूक्ष्मं च शब्दब्रह्ममयः शुभः । वागतीतो निरालम्बो निर्द्धन्द्वो निरुपप्लवः
    ॥ २३॥ यज्ञभुग्यज्ञमूर्तिस्त्वं यज्ञिनां फलदः प्रभुः । भवान्मत्स्याकृतिः कौर्ममास्थाय जगति स्थितः ॥
    २४॥ वाराहिं चैव तां सैंहीमास्थायेह व्यवस्थितः । देवानां देवरक्षार्थं निहत्य दितिजेश्वरम् ॥ २५॥ द्विजशापच्छलेनैवमवतीर्णोऽसि
    लीलया । न दृष्टं यत्त्वदन्यं हि भवान्सर्वञ्चराचरम् ॥ २६॥ भवान्विष्णुर्भवान् रुद्रो भवानेव पितामहः
    । भवानादिर्भवानन्तो भवानेव वयं विभो ॥ २७॥ भवानेव जगत्सर्वं प्रलापेन किमीश्वर । मायया बहुधा संस्थमद्वितीयमयं
    प्रभो ॥ २८॥ स्तोष्यामस्त्वां कथं भासि देवदेव मृगाधिप । स्तुतोऽपि विविधैः स्तुत्यैर्भावैर्नानाविधैः
    प्रभुः ॥ २९॥ न जगाम द्विजाः शान्तिं मानयन्योनिमात्मनः । यो नृसिंहस्तवं भक्त्या पठेद्वार्थं विचारयेत्
    ॥ ३०॥ श्रावयेद्वा द्विजान्सर्वान् विष्णुलोके महीयते । तदन्तरे शिवं देवाः सेन्द्राः सब्रह्मकाः प्रभुम्
    ॥ ३१॥ सम्प्राप्य तुष्टवुः सर्वं विज्ञाप्य मृगरूपिणः । ततो ब्रह्मादयस्तूर्णं संस्तूय परमेश्वरम् ॥ ३२॥
    आत्मत्राणाय शरणं जग्मुः परमकारणम् । मन्दरस्थं महादेवं क्रीडमानं सहोमया ॥ ३३॥ सेवितं गणगन्धर्वैः सिद्धैरप्सरसां
    गणैः । देवताभिः सह ब्रह्मा भीतभीतः सगद्गदम् । प्रणम्य दण्डवद्भूमौ तुष्टाव परमेश्वरम् ॥ ३४॥ ब्रह्मोवाच
    । नमस्ते कालकालाय नमस्ते रुद्र मन्यवे । नमः शिवाय रुद्राय शङ्कराय शिवाय ते ॥ ३५॥ उग्रोऽसि सर्वभूतानां
    नियन्तासि शिवोऽसि नः । नमः शिवाय शर्वाय शङ्करायार्त्तिहारिणे ॥ ३६॥ मयस्कराय विश्वाय विष्णवे ब्रह्मणे
    नमः । अन्तकाय नमस्तुभ्यमुमायाः पतये नमः ॥ ३७॥ हिरण्यबाहवे साक्षाद्धिरण्यपतये नमः । शर्वाय सर्वरूपाय
    पुरुषाय नमो नमः ॥ ३८॥ सदसद्व्यक्तिहीनाय महतः कारणाय ते । नित्याय विश्वरूपाय जायमानाय ते नमः ॥ ३९॥
    जाताय बहुधा लोके प्रभूताय नमो नमः । रुद्राय नीलरुद्राय कद्रुद्राय प्रचेतसे ॥ ४०॥ कालाय कालरूपाय नमः
    कालाङ्गहारिणे । मीढुष्टमाय देवाय शितिकण्ठाय ते नमः ॥ ४१॥ महीयसे नमस्तुभ्यं हन्त्रे देवारिणां सदा ।
    ताराय च सुताराय तारणाय नमो नमः ॥ ४२॥ हरिकेशाय देवाय शम्भवे परमात्मने । देवानां शम्भवे तुभ्यं भूतानां
    शम्भवे नमः ॥ ४३॥ शम्भवे हैमवत्याश्च मन्यवे रुद्ररूपिणे । कपर्दिने नमस्तुभ्यं कालकण्ठाय ते नमः ॥ ४४॥
    हिरण्याय महेशाय श्रीकण्ठाय नमो नमः । भस्मदिग्धशरीराय दण्डमुण्डीश्वराय च ॥ ४५॥ नमो ह्रस्वाय दीर्घाय
    वामनाय नमो नमः । नम उग्रत्रिशूलाय उग्राय च नमो नमः ॥ ४६॥ भीमाय भीमरूपाय भीमकर्मरताय ते । अग्रेवधाय
    वै भूत्वा नमो दूरेवधाय च ॥ ४७॥ धन्विने शूलिने तुभ्यं गदिने हलिने नमः । चक्रिणे वर्मिणे नित्यं दैत्यानां
    कर्मभेदिने ॥ ४८॥ सद्याय सद्यरूपाय सद्योजाताय ते नमः । वामाय वामरूपाय वामनेत्राय ते नमः ॥ ४९॥ अघोररूपाय
    विकटाय विकटशरीराय ते नामः । पुरुषरूपाय पुरुषैकतत्पुरुषाय वै नमः ॥ ५०॥ पुरुषार्थप्रदानाय पतये परमेष्ठिने
    । ईशानाय नमस्तुभ्यमीश्वराय नमो नमः ॥ ५१॥ ब्रह्मणे ब्रह्मरूपाय नमः साक्षाच्छिवाय ते । सर्वविष्णुर्नृसिंहस्य
    रूपमास्थाय विश्वकृत् ॥ ५२॥ हिरण्यकशिपुं हत्वा करजैर्निशितैः स्वयम् । दैत्येन्द्रैर्बहुभिः सार्धं हितार्थं
    जगतां प्रभुः ॥ ५३॥ सैंहीं समानयन्योनिं बाधते निखिलं जगत् । यत्कृत्यमत्र देवेश तत्कुरुष्व भवानिह ॥
    ५४॥ उग्रोऽसि सर्वदुष्टानां नियन्तासि शिवोऽसि नः । कालकूटादिवपुषा त्राहि नः शरणागतान् ॥ ५५॥ शुक्रं
    तु वृत्तं विश्वेश क्रीडा वै केवलं वयम् । तवोन्मेषनिमेषाभ्यामस्माकं प्रलयोदयौ ॥ ५६॥ उन्मीलये त्वयि
    ब्रह्मन्विनाशोऽस्ति न ते शिव । सन्तप्ताः स्मो वयं देव हरिणामिततेजसा ॥ ५७॥ सर्वलोकहितायैनं तत्त्वं
    संहर्त्तुमिच्छसि । इति श्रीलिङ्गमहापुराणे पूर्वभागे पञ्चनवतितमाध्यायान्तर्गतं देवैः कृतं नृसिंहस्तोत्रं
    समाप्तम् । लिङ्गपुराण । पूर्वभाग । अध्याय ९५
