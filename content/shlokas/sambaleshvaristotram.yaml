id: sambaleshvaristotram
category: stotram
name:
  english: sambaleshvaristotram
  devanagari: सम्बलेश्वरीस्तोत्रम्
content:
  english: shaktyai namonamah || 6|| tavashirvadah sarvesham dadatu manovanchitam | tava snehancalacchaya
    bhaktan rakshatu saukhyada || 7|| amba
  devanagari: शक्त्यै नमोनमः ॥ ६॥ तवाशीर्वादः सर्वेषां ददातु मनोवाञ्छितम् । तव स्नेहाञ्चलच्छाया भक्तान्
    रक्षतु सौख्यदा ॥ ७॥ अम्ब
meaning: {}
