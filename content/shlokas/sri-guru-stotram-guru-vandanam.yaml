id: sri-guru-stotram-guru-vandanam
category: stotram
name:
  english: Sri Guru Stotram (Guru Vandanam)
content:
  english: akhandamandalakaram vyaptam yena caracaram | tatpadam darshitam yena tasmai shrigurave namah
    || || ajnanatimirandhasya jnananjanashalakaya | cakshurunmilitam yena tasmai shrigurave namah || ||
    gururbrahma gururvishnuh gururdevo maheshvarah | gurureva parambrahma tasmai shrigurave namah || ||
    sthavaram jangamam vyaptam yatkincitsacaracaram | tatpadam darshitam yena tasmai shrigurave namah
    || || cinmayam vyapiyatsarvam trailokyam sacaracaram | tatpadam darshitam yena tasmai shrigurave namah
    || || tsarvashrutishiroratnavirajita padambujah | vedantambujasuryoyah tasmai shrigurave namah ||
    || caitanyah shashvatahshanto vyomatito niranjanah | bindunada kalatitah tasmai shrigurave namah ||
    || jnanashaktisamarudhah tattvamalavibhushitah | bhuktimuktipradata ca tasmai shrigurave namah ||
    || anekajanmasamprapta karmabandhavidahine | atmajnanapradanena tasmai shrigurave namah || || shoshanam
    bhavasindhoshca jnapanam sarasampadah | guroh padodakam samyak tasmai shrigurave namah || || na guroradhikam
    tattvam na guroradhikam tapah | tattvajnanatparam nasti tasmai shrigurave namah || || mannathah shrijagannathah
    madguruh shrijagadguruh | madatma sarvabhutatma tasmai shrigurave namah || || gururadiranadishca guruh
    paramadaivatam | guroh parataram nasti tasmai shrigurave namah || || tvameva mata ca pita tvameva
    tvameva bandhushca sakha tvameva | tvameva vidya dravinam tvameva tvameva sarvam mama deva deva ||
  devanagari: अखण्डमण्डलाकारं व्याप्तं येन चराचरम् । तत्पदं दर्शितं येन तस्मै श्रीगुरवे नमः ॥ ॥ अज्ञानतिमिरान्धस्य
    ज्ञानाञ्जनशलाकया । चक्षुरुन्मीलितं येन तस्मै श्रीगुरवे नमः ॥ ॥ गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो
    महेश्वरः । गुरुरेव परम्ब्रह्म तस्मै श्रीगुरवे नमः ॥ ॥ स्थावरं जङ्गमं व्याप्तं यत्किञ्चित्सचराचरम्
    । तत्पदं दर्शितं येन तस्मै श्रीगुरवे नमः ॥ ॥ चिन्मयं व्यापियत्सर्वं त्रैलोक्यं सचराचरम् । तत्पदं दर्शितं
    येन तस्मै श्रीगुरवे नमः ॥ ॥ त्सर्वश्रुतिशिरोरत्नविराजित पदाम्बुजः । वेदान्ताम्बुजसूर्योयः तस्मै श्रीगुरवे
    नमः ॥ ॥ चैतन्यः शाश्वतःशान्तो व्योमातीतो निरञ्जनः । बिन्दुनाद कलातीतः तस्मै श्रीगुरवे नमः ॥ ॥ ज्ञानशक्तिसमारूढः
    तत्त्वमालाविभूषितः । भुक्तिमुक्तिप्रदाता च तस्मै श्रीगुरवे नमः ॥ ॥ अनेकजन्मसम्प्राप्त कर्मबन्धविदाहिने
    । आत्मज्ञानप्रदानेन तस्मै श्रीगुरवे नमः ॥ ॥ शोषणं भवसिन्धोश्च ज्ञापणं सारसम्पदः । गुरोः पादोदकं सम्यक्
    तस्मै श्रीगुरवे नमः ॥ ॥ न गुरोरधिकं तत्त्वं न गुरोरधिकं तपः । तत्त्वज्ञानात्परं नास्ति तस्मै श्रीगुरवे
    नमः ॥ ॥ मन्नाथः श्रीजगन्नाथः मद्गुरुः श्रीजगद्गुरुः । मदात्मा सर्वभूतात्मा तस्मै श्रीगुरवे नमः ॥ ॥
    गुरुरादिरनादिश्च गुरुः परमदैवतम् । गुरोः परतरं नास्ति तस्मै श्रीगुरवे नमः ॥ ॥ त्वमेव माता च पिता त्वमेव
    त्वमेव बन्धुश्च सखा त्वमेव । त्वमेव विद्या द्रविणं त्वमेव त्वमेव सर्वं मम देव देव ॥
