id: svastisuktam-2
category: veda
name:
  english: svastisuktam
  devanagari: स्वस्तिसूक्तम्
content:
  english: 15 svastyayanam tarkshyamarishtanemim mahadbhutam vayasam devatanam | asuraghnamindrasakham
    samatsu brihadyasho navamiva ruhema || amhomucamangirasam gayam ca svastyatreyam manasa ca tarkshyam
    | prayatapanih sharanam prapadye svasti sambadheshvabhayam no astu || svasti na indro vriddhashravah
    svasti nah pusha vishvavedah | svasti nastarkshyo arishtanemih svasti no brihaspatirdadhatu || 1
  devanagari: १५ स्वस्त्ययनं तार्क्ष्यमरिष्टनेमिं महद्भूतं वायसं देवतानाम् । असुरघ्नमिन्द्रसखं समत्सु
    बृहद्यशो नावमिवा रुहेम ॥ अंहोमुचमाङ्गिरसं गयं च स्वस्त्यात्रेयं मनसा च तार्क्ष्यम् । प्रयतपाणिः शरणं
    प्रपद्ये स्वस्ति संबाधेष्वभयं नो अस्तु ॥ स्वस्ति न इन्द्रो वृद्धश्रवाः स्वस्ति नः पूषा विश्ववेदाः
    । स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः स्वस्ति नो बृहस्पतिर्दधातु ॥ १
meaning: {}
