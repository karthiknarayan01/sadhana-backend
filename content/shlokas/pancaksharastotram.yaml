id: pancaksharastotram
category: stotram
name:
  english: pancaksharastotram
  devanagari: पन्चाक्षरस्तोत्रम्
content:
  english: pancaksharastotram namo buddhaya na jato na mritashcaiva na rupo napi rupavan | na samsare
    na nirvane na karastena sucyate || 1|| mohadhvamsakaro nityam mokshasaukhyapradayakah | mohanam sarvamaranam
    mokarastena sucyate || 2|| buddhanamuditam dhyanam buddhanam janamelakam | buddhanihklesha sambuddha
    bukarastena sucyate || 3|| dharyate bodhisattvaih sa dharmadhatugatih sada | dharmanam paramo dharmah
    dhakarastena sucyate || 4|| yatha nasti tatha nasti yatha nasti tathasti yah | yathavadi tathakarh
    yakarastena sucyate || 5|| pancaksharamidam punyam pavitram papanashanam | ye pathanti divaratrau
    te yanti paramam gatim || 6|| iti shri pancaksharastotram sampurnam ||
  devanagari: पञ्चाक्षरस्तोत्रम् नमो बुद्धाय न जातो न मृतश्चैव न रूपो नापि रूपवान् । न संसारे न निर्वाणे
    न कारस्तेन सूच्यते ॥ १॥ मोहध्वंसकरो नित्यं मोक्षसौख्यप्रदायकः । मोहनं सर्वमाराणां मोकारस्तेन सूच्यते
    ॥ २॥ बुद्धानामुदितं ध्यानं बुद्धानां जनमेलकम् । बुद्धनिःक्लेश सम्बुद्ध बुकारस्तेन सूच्यते ॥ ३॥ धार्यते
    बोधिसत्त्वैः स धर्मधातुगतिः सदा । धर्माणां परमो धर्मः धकारस्तेन सूच्यते ॥ ४॥ यथा नास्ति तथा नास्ति
    यथा नास्ति तथास्ति यः । यथावादी तथाकार्ः यकारस्तेन सूच्यते ॥ ५॥ पञ्चाक्षरमिदं पुण्यं पवित्रं पापनाशनम्
    । ये पठन्ति दिवारात्रौ ते यान्ति परमां गतिम् ॥ ६॥ इति श्री पञ्चाक्षरस्तोत्रं सम्पूर्णम् ॥
