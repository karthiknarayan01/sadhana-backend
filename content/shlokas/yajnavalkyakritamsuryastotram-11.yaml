id: yajnavalkyakritamsuryastotram-11
category: stotram
name:
  english: yajnavalkyakritamsuryastotram 11
  devanagari: याज्नवल्क्यकृतंसूर्यस्तोत्रम् ११
content:
  english: yajnavalkyakritam suryastotram 11 yajnavalkya uvaca | namassavitre dvaraya mukteramitatejase
    | rigyajussamabhutaya trayidhamne ca te namah || 16|| namo'gnishomabhutaya jagatah karanatmane | bhaskaraya
    param tejassaushumnarucibibhrate || 17|| kalakashthanimeshadikalajnanatmarupine | dhyeyaya vishnurupaya
    paramakshararupine || 18|| bibhartti yassuragananapyayendum svarashmibhih | svadhamritena ca pitrimstasmai
    triptatmane namah || 19|| himambugharmavrishtinam kartta bhartta ca yah prabhuh | tasmai trikalarupaya
    namassuryaya vedhase || 20|| apahanti tamo yashca jagato'sya jagatpatih | tasya dhamadharo devo namastasmai
    vivasvate || 21|| satkarmayogyo na jano naivapah shuddhikaranam | yasminnanudite tasmai namo devaya
    bhasvate || 22|| sprishto yadamshubhirlokah kriyayogyo hi jayate | pavitrakaranatmaya tasmai shuddhatmane
    nah || 23|| namah savitre suryaya bhaskaraya vivasvate | adityayadibhutaya devadinam namo namah ||
    24|| hiranmayam ratham yasya ketavo'mritavajinah | vahanti bhuvanalokacakshusham tam namamyaham ||
    25|| iti vishnupurane tritiyabhage pancamadhyayanitargatam yajnavalkyakritam suryastotram samaptam
    | vishnupurana | adhyaya 3
  devanagari: याज्ञवल्क्यकृतं सूर्यस्तोत्रम् ११ याज्ञवल्क्य उवाच । नमस्सवित्रे द्वाराय मुक्तेरमिततेजसे
    । ऋग्यजुस्सामभूताय त्रयीधाम्ने च ते नमः ॥ १६॥ नमोऽग्निषोमभूताय जगतः कारणात्मने । भास्कराय परं तेजस्सौषुम्णरुचिबिभ्रते
    ॥ १७॥ कलाकाष्ठानिमेषादिकालज्ञानात्मरूपिणे । ध्येयाय विष्णुरूपाय परमाक्षररूपिणे ॥ १८॥ बिभर्त्ति यस्सुरगणानाप्यायेन्दुं
    स्वरश्मिभिः । स्वधामृतेन च पितॄंस्तस्मै तृप्तात्मने नमः ॥ १९॥ हिमाम्बुघर्मवृष्टीनां कर्त्ता भर्त्ता
    च यः प्रभुः । तस्मै त्रिकालरूपाय नमस्सूर्याय वेधसे ॥ २०॥ अपहन्ति तमो यश्च जगतोऽस्य जगत्पतिः । तस्य
    धामधरो देवो नमस्तस्मै विवस्वते ॥ २१॥ सत्कर्मयोग्यो न जनो नैवापः शुद्धिकारणम् । यस्मिन्ननुदिते तस्मै
    नमो देवाय भास्वते ॥ २२॥ स्पृष्टो यदंशुभिर्लोकः क्रियायोग्यो हि जायते । पवित्रकारणात्माय तस्मै शुद्धात्मने
    नः ॥ २३॥ नमः सवित्रे सूर्याय भास्कराय विवस्वते । आदित्यायादिभूताय देवादीनां नमो नमः ॥ २४॥ हिरण्मयं
    रथं यस्य केतवोऽमृतवाजिनः । वहन्ति भुवनालोकचक्षुषं तं नमाम्यहम् ॥ २५॥ इति विष्णुपुराणे तृतीयभागे पञ्चमाध्यायानितर्गतं
    याज्ञवल्क्यकृतं सूर्यस्तोत्रं समाप्तम् । विष्णुपुराण । अध्याय ३
