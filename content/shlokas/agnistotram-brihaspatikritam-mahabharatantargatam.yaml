id: agnistotram-brihaspatikritam-mahabharatantargatam
category: stotram
name:
  english: agnistotram (brihaspatikritam mahabharatantargatam)
  devanagari: अग्निस्तोत्रम् (बृहस्पतिकृतं महाभारतान्तर्गतम्)
content:
  english: brihaspatikritam agnistotram brihaspatiruvaca | tvamagne sarvadevanam mukham tvamasi havyavat
    | tvamantah sarvabhutanam gudhashcarasi sakshivat || 1|| tvamahurekam kavayastvamahustrividham punah
    | tvaya tyaktam jagaccedam sadyo nashyeddhutashana || 2|| kritva tubhyam namo viprah svakarmavijitam
    gatim | gacchanti saha patnibhih sutairapi ca shashvatim || 3|| tvamevagne havyavahastvameva paramam
    havih | yajanti satraistvameva yajnaishca paramadhvare || 4|| srishtva lokamstrinimanhavyavaha prapte
    kale pacasi punah samiddhah | sarvasyasya bhuvanasya prasutistvamevagne bhavasi punah pratishtha ||
    5|| tvamagne jaladanahurvidyutashca tvameva hi | dahanti sarvabhutani tvatto nishkramya hayanah ||
    6|| tvayyapo nihitah sarvastvayi sarvamidam jagat | na te'styaviditam kincittrishu lokeshu pavaka
    || 7|| svayonim bhajate sarvo vishasvapo'vishankitah | aham tvam vardhayishyami brahmairmantraih sanatanaih
    || 8|| iti mahabharate udyogaparvani 16 adhyayantargatam brihaspatikritam agnistotram sampurnam |
    mahabharata | udyogaparva | adhyaya 16
  devanagari: बृहस्पतिकृतं अग्निस्तोत्रम् बृहस्पतिरुवाच । त्वमग्ने सर्वदेवानां मुखं त्वमसि हव्यवाट् ।
    त्वमन्तः सर्वभूतानां गूढश्चरसि साक्षिवत् ॥ १॥ त्वामाहुरेकं कवयस्त्वामाहुस्त्रिविधं पुनः । त्वया त्यक्तं
    जगच्चेदं सद्यो नश्येद्धुताशन ॥ २॥ कृत्वा तुभ्यं नमो विप्राः स्वकर्मविजितां गतिम् । गच्छन्ति सह पत्नीभिः
    सुतैरपि च शाश्वतीम् ॥ ३॥ त्वमेवाग्ने हव्यवाहस्त्वमेव परमं हविः । यजन्ति सत्रैस्त्वामेव यज्ञैश्च परमाध्वरे
    ॥ ४॥ सृष्ट्वा लोकांस्त्रीनिमान्हव्यवाह प्राप्ते काले पचसि पुनः समिद्धः । सर्वस्यास्य भुवनस्य प्रसूतिस्त्वमेवाग्ने
    भवसि पुनः प्रतिष्ठा ॥ ५॥ त्वामग्ने जलदानाहुर्विद्युतश्च त्वमेव हि । दहन्ति सर्वभूतानि त्वत्तो निष्क्रम्य
    हायनाः ॥ ६॥ त्वय्यापो निहिताः सर्वास्त्वयि सर्वमिदं जगत् । न तेऽस्त्यविदितं किञ्चित्त्रिषु लोकेषु
    पावक ॥ ७॥ स्वयोनिं भजते सर्वो विशस्वापोऽविशङ्कितः । अहं त्वां वर्धयिष्यामि ब्राह्मैर्मन्त्रैः सनातनैः
    ॥ ८॥ इति महाभारते उद्योगपर्वणि १६ अध्यायान्तर्गतं बृहस्पतिकृतं अग्निस्तोत्रं सम्पूर्णम् । महाभारत
    । उद्योगपर्व । अध्याय १६
