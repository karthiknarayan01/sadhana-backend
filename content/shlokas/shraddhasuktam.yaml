id: shraddhasuktam
category: sukta
name:
  english: shraddhasuktam
  devanagari: श्रद्धासूक्तम्
content:
  english: 04 shra̱ddham pra̱tarha̭vamahe shra̱ddham ma̱dhyamdi̭na̱m pari̭ | shra̱ddham surya̭sya ni̱mruci̱
    shraddhe̱ shraddha̭paye̱ha na̭h || 10
  devanagari: ०४ श्र॒द्धां प्रा॒तर्ह॑वामहे श्र॒द्धां म॒ध्यंदि॑नं॒ परि॑ । श्र॒द्धां सूर्य॑स्य नि॒म्रुचि॒
    श्रद्धे॒ श्रद्धा॑पये॒ह नः॑ ॥ १०
