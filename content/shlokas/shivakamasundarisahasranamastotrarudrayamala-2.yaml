id: shivakamasundarisahasranamastotrarudrayamala-2
category: sahasranama
name:
  english: shivakamasundarisahasranamastotrarudrayamala
  devanagari: शिवकामसुन्दरीसहस्रनामस्तोत्ररुद्रयामल
content:
  english: ringaramurtirvirata rasanubhavarocana | paramanandalahari ratirangavati sati || 3|| rangamalanangakalakelih
    kaivalyada kala | rasakalpa kalpalata kutuhalavati gatih || 4|| vinodadugdha susnigdha mugdhamurtinohara
    | balarkakotikirana candrakotisushitala || 5|| sravatpiyushadigdhangi sangita natika shiva | kuranganayana
    kanta sukhasantatirindira || 6|| mangala madhurapanga ranjani ramani ratih | rajarajeshvari rajni
    mahendraparivandita || 7|| prapancagatirishani samarasyaparayana | hamsollasa hamsagatih shinjatkanakanupura
    || 8|| merumandaravakshoja srinipashavarayudha | shankhakodandasastabjapanidvayavirajita || 9|| candrabimbanana
    carumakutottamsacandrika | sinduratilaka carudhammillamalamalika || 10|| mandaradamamudita raktapushpavibhushita
    | suvarnabharanaprita muktadamamanohara || 11|| tambulapuravadana madananandamanasa | sukharadhya
    tapassara kripavaridhirishvari || 12|| vakshahsthalalasanmagna prabha madhurasonmukha | bindunadatmika
    carurasita turyarupini || 13|| kamaniyakritih dhanya shankarapritimanjari | kanya kalavati mata gajendragamana
    shubha || 14|| kumari karabhoru shrih rupalakshmih surajita | santoshasima sampattih shatakumbhapriya
    dyutih || 15|| paripurna jagaddhatri vidhatri balavardhini | sarvabhaumanripashrishca samrajyagatirasika
    || 16|| sarojakshi dirghadrishtih saucakshanavicakshana | rangasravanti rasika pradhanarasarupini
    || 17|| rasasindhuh sugatri ca yuvatih maithunonmukhi | nirantara rasasakta shaktistribhuvanatmika
    || kamakshi kamanishtha ca kameshi bhagamangala | subhaga bhagini bhogya bhagyada bhayada bhaga |
    bhagalinganandakala bhagamadhyanivasini || 19|| bhagarupa bhagamayi bhagayantra bhagottama | yonirjaya
    kamakala kulamritaparayana || 20|| kulakundalaya sukshmajivasphulingarupini | mulasthita kelirata
    valayakritiridita || 21|| sushumna kamalananda citra kurmagatirgirih | sitaruna sindhurupa pravega
    nirdhani kshama || 22|| dhantakotirasarava ravibimbotthitadbhuta | nadantalina sampurna pranava bahurupini
    || 23|| bhringarava vashagatih vagishi madhuradhvanih | varnamala siddhikala shatcakrakramavasini
    || 24|| manipurasthita snigdha kurmacakraparayana | mulakelirata sadhvi svadhishthananivasini || 25||
    anahatagatirdipa shivanandamayadyutih | viruddharudha sambuddha jivabhoktri sthalirata || 26|| ajnacakrojjvalaspharasphuranti
    nirgatadvisha | candrika candrakotishi suryakotiprabhamayi || 27|| padmaragarunacchaya nityahladamayiprabha
    | mahashunyalaya candramandalamritanandita || 28|| kantangasangamudita sudhamadhuryasambhrita | mahacandrasmitalisa
    mritpatrastha sudhadyutih || 29|| sravatpimushasamsakta shashvatkundalaya bhava | shreyo dyutih pratyagartha
    seva phalavati mahi || 30|| shiva shivapriya shaiva shankari shambhavi vibhuh | svayambhu svapriya
    sviya svakiya janamatrika || surama svapriya shreyah svadhikaradhinayika | mandala janani manya sarvamangalasantatih
    || 32|| bhadra bhagavati bhavya kalitardhendubhasura | kalyanalalita kamya kukarmakumatiprada || 33||
    kurangakshi kshiranetra kshira madhurasonmada | varunipanamudita madiramudita sthira || 34|| kadambaripanarucih
    vipasha pashubhavana | mudita lalitapanga darandolitadirghadrik || 35|| daityakulanalashikha manorathasudhadyutih
    | suvasini pitagatri pinashronipayodhara || 36|| sucarukabari dadhyudadhyutthimauktika | bimbadharadyutih
    mugdha pravalottamadidhitih || 37|| tilaprasunanasagra hemamauktikakoraka | nishkalankenduvadana balenduvadanojvala
    || 38|| nrityantyanjananetranta prasphuratkarnashashkuli | bhalacandrataponnaddha manisuryakiritini
    || 39|| kacaughacampakashreni malinidamamandita | hemamanikya tatanka manikancana kundala || 40||
    sucarucubuka kambukanthi kundavali rama | gangatarangaharormih mattakokilanisvana || 41|| mrinalavilasadbahupashakushadhanurdhara
    | keyurakankanashreni nanamanimanorama || 42|| tamrapankajapanishrih navaratnaprabhavati | anguliyamanishreni
    kantimangalasantatih || 43|| mandaradvandvasukuca romarajibhujangika | gambhiranabhistrivalibhangura
    kshanimadhyama || 44|| ranatkancigunanaddha pattamshukanitambika | merusandhinitambadhya gajashundoruyugmayuk
    || 45|| sujanurmadananandamayajanghadvayanvita | gudhagulpha manjushinjanmaninupuramandita || 46||
    padadvandvajitambhoja nakhacandravaliprabha | susimaprapada rajamhasamattebhamandaga || 47|| yogidhyeyapadadvadva
    saundaryamritasarini | lavapayasindhuh sinduratilaka kutilalaka || 48|| sadhusimantini siddhabuddhavrindarakodaya
    | balarkakiranashrenishonashrih premakamadhuk || 49|| rasagambhirasarasi padmini rasasarasa | prasannasannavarada
    sharada bhuvi bhagyada || 50|| natarajapriya vishvanadya nartakanartaki | citrayantra citratantra
    citravidyavaliyatih || 51|| citrakuta trikuta ca pandhakuta ca pancami | catushtkuta shambhuvidya
    shatkuta vishnupujita || 52|| kutashodashasampanna turiya parama kala | shodashi mantrayantranam ishvari
    merumandala || 53|| shodasharna trivarna ca bindunadasvarupini | varnatita varnamata shabdabrahmamayi
    sukha || 54|| sukhajyotsnanandavidyudantarakashadevata | caitanya vidhikutatma kameshi svapnadarshana
    || 55|| svapnarupa bodhakari jagrati jagarashraya | svapnashraya sushuptistha tantramurtishca madhavi
    || 56|| lopamudra kamarajni madhavi mitrarupini | shankari nandividya ca bhasvanmandalamadhyaga ||
    57|| mahendrasvargasampattih durvasassevita shrutih | sadhakendragatissadhvi sulipta siddhikandhara
    || 58|| puratrayeshi purakrit shashthi ca paradevata | vighnaduri bhuriguna pushtih pujitakamadhuk
    || 59|| herambamata ganapa guhamba''rya nitambini | esha simantini mokshadaksha dikshitamatrika ||
    60|| sadhakamba siddhamata sadhakendramanorama | yauvanonmadini tungastani sushronimandita || 61||
    padmaraktotpalavati raktamalyanulepana | raktamalyarucirdaksha shikhandinyatisundari || 62|| shikhandinrityasantushta
    shikhandikulapalini | vasundhara ca surabhih kamaniyatanushshubha || 63|| nandini trikshanavati vasishthalayadevata
    | golakeshi ca lokendra nrilokaparipalika || 64|| havirdhatri devamata vrindarakaparatmayuk | rudramata
    rudrapatni madodgarabhara kshitih || 65|| dakshina yajnasampattih svabala dhiranandita | kshirapurnarnavagatih
    sudhayonih sulocana || 66|| rama tunga sadasevya surasanghadaya uma | sucaritra citravara sustani
    vatsavatsala || 67|| rajasvala rajoyukta ranjita rangamalika | raktapriya surakta ca ratirangasvarupini
    || 68|| rajashshuklakshika nishtha ritusnata ratipriya | bhavyabhavya kamakelih smarabhuh smarajivika
    || 69|| samadhikusumananda svayambhukusumapriya | svayambhupremasantushta svayambhunindakantaka ||
    70|| svayambhustha shaktiputa ravih sarvasvapetika | atyantarasika dutih vidagdha pritipujita || 71||
    tulikayantranilaya yogapithanivasini | sulakshana drishyarupa sarva lakshanalakshita || 72|| nanalankarasubhaga
    pancakamashararcita | urdhvatrikonayantrastha bala kameshvari tatha || 73|| gunadhyaksha kuladhyaksha
    lakshmishcaiva sarasvati | vasantamadanottunga stani kucabharonnata || 74|| kaladharamukhi murdhapathodhishca
    kalavati | dakshapadadishirshantashodashasvarasamyuta || 75|| shraddha purtih ratishcaiva bhutih kantirmanorama
    | vimala yogini ghora madanonmadini mada || 76|| modini dipini caiva shoshini ca vashankari | rajanyanta
    kamakala lasatkamaladharini || 77|| vamamurdhadipadantashodashasvarasamyuta | pusharupa sumanasam
    sevya pritih dyutistatha || 78|| riddhih saudamini cicca hamsamalavrita tatha | shashini caiva ca
    svastha sampurnamandalodaya || 79|| pushtishcamritapurna ca bhagamalasvarupini | bhagayantrashraya
    shambhurupa samyogayogini || 80|| dravini bijarupa ca hyakshubdha sadhakapriya | rajah pithamayi nadya
    sukhada vanchitaprada || 81|| rajassavit rajashshaktih shuklabindusvarupini | sarvasakshi samarasya
    shivashaktimayi prabha || 82|| samyoganandanilaya samyogapritimatrika | samyogakusumananda samyogayogapaddhatih
    || 83|| samyogasukhadavastha cidanandardhyasevita | arghyapujya ca sampattih ardhyadabhinnarupini
    || 84|| samarasyapara prita priyasangamarangini | jnanaduti jnanagamya jnanayonishshivalaya || 85||
    citkala satkala jnanakala samvitkalatmika | kalacatushtayi padmavasini sukshmarupini || 86|| hamsakelisthalasvastha
    hamsadvayavikasini | viragita mokshakala paramatmakalavati || 87|| vidyakalantaratmastha catushtayakalavati
    | vidyasantoshana tripti parabrahmaprakashini || 88|| paramatmapara vastulina shakticatushtayi | shantirbodhakala
    vyaptih parajnanatmika kala || 89|| pashyanti paramatmastha cantaratmakala shiva | madhyama vaikhari
    catma kala''nandakalavati || 90|| taruni taraka tara shivalingalayatmavit | parasparasvabhava ca brahmajnanavinodini
    || 91|| ramollasa ca durdharsha paramarghyapriya rama | jatyadirahita yoginyanandamatrapaddhatih ||
    92|| kanta shanta dantayatih kalita homapaddhatih | divyabhavaprada divya virasurvirabhavada || 93||
    pashudeha viragatih virahamsamanodaya | murdhabhishikta rajashrih kshatriyottamamatrika || 94|| shastrastrakushala
    shobha rathastha yuddhajivika | ashvarudha gajarudha bhutoktih surasushraya || 95|| rajanitishshantikartri
    caturangabalashraya | poshini sharana padmapalika jayapalika || 96|| vijaya yogini yatra parasainyavimardini
    | purnavitta vittagamya vittasancaya shalini || 97|| maheshi rajyabhoga ca ganikaganabhogabhrit |
    ukarini rama yogya mandasevya padatmika || sainyashreni shauryarata patakadhvajamalini | succhatra
    camarashrenih yuvarajavivardhini || 99|| puja sarvasvasambhara pujapalanalalasa | pujabhipujaniya
    ca rajakaryaparayana || 100|| brahmakshatramayi somasuryavahnisvarupini | paurohityapriya sadhvi brahmani
    yantrasantatih || somapanajanaprita yojanadhvagatikshama | pritigraha para datri shreshthajatih satangatih
    || 102|| gayatri vedaviddhyeya diksha santoshatarpana | ratnadidhitividyutsahasana vaishyajivika ||
    103|| krishirvanijyabhutishca vriddhida vriddhasevita | tuladhara svapnakama manonmanaparayana ||
    104|| shraddha vipragatih karmakari kautukapujita | nanabhicaracatura varastrishrih kalamayi || sukarnadhara
    naupara sarvasha ratimohini | durga vindhyavanastha ca kaladarpanishudini || bhumarashamani krishna
    rakshorakshasasahasa | vividhotpatashamani samaya surasevita || 107|| pancavayavavakyashrih prapancodyanacandrika
    | siddhisandohasamsiddhayoginivrindasevita || 108|| nitya shodashikarupa kameshi bhagamalini | nityaklinna
    niradhara vahnimandalavasini || 109|| mahavajreshvari nityashivadutiti vishruta | tvarita prathita
    khyata vikhyata kulasundari || 110|| nitya nilapataka ca vijaya sarvamangala | jvalamala vicitra ca
    mahatripurasundari || 111|| guruvrinda paraguruh prakashanandadayini | shivananda nadarupa shakranandasvarupini
    || 112|| devyananda nadamayi kauleshanandanathini | shukladevyanandanatha kuleshanandadayini || 113||
    divyaughasevita divyabhogadanaparayana | kridananda kridamana samayanandadayini || 114|| vedananda
    parvati ca sahajanandadayini | siddhaughagururupa capyapara gururupini || 115|| gagananandanatha ca
    vishvadyanandadayini | vimalanandanatha ca madananandadayini || 116|| bhuvananandanatha ca lilodyanapriya
    gatih | svatmandavinoda ca priyadyanandanathini || 117|| manavadya gurushreshtha parameshthi guruprabha
    | paramadya gurushshaktih kirtanapriya || 118|| trailokyamohanakhya ca sarvashaparipuraka | sarvasankshobhini
    purvamnaya cakratrayalaya || 119|| sarvasaubhagyadatri ca sarvarthasadhakapriya | sarvarakshakari
    sadhurdakshinamnayadevata || 120|| madhyacakraikanilaya pashcimamnayadevata | navacakrakritavasa kauberamnayadevata
    || 121|| binducakrakritayasa madhyasimhasaneshvari | shrividya navadurga ca mahishasuramardini ||
    122|| sarvasamrajyalakshmishca ashtalakshmishca samshruta | shailendratanaya jyotih nishkala shambhavi
    uma || 123|| ajapa matrika ceti shuklavarna shadanana | parijateshvari caiva trikuta pancabanada ||
    114|| pancakalpalata caiva tryakshari mulapithika | sudhashriramriteshani hyannapurna ca kamadhuk
    || 125|| pashahasta siddhalakshmih matangi bhuvaneshvari | varahi navaratnanamishvari ca prakirtida
    || 126|| param jyotih kosharupa saindhavi shivadarshana | parapara svamini ca shaktadarshanavishruta
    || 127|| brahmadarshanarupa ca shivadarshanarupini | vishnudarshanarupa ca srashtridarshanarupini
    || 128|| sauradarshanarupa ca sthiticakrakritashraya | bauddhadarshanarupa ca turiya bahurupini ||
    129|| tattvamudrasvarupa ca prasanna jnanamatrika | sarvopacarasantushta hrinmayi shirshadevata ||
    130|| shikhasthita varmamayi netratrayavilasini | astrastha caturasrastha dvarastha dvaradevata ||
    131|| anima pashcimastha ca dakshinadvaradevata | vashitva vayukonastha prakamyeshanadevata || 132||
    mahimapurvanatha ca laghimottaradevata | agnikonasthagarima praptirnairritivasini || 133|| ishitvasiddhisuratha
    sarvakamordhvavasini | brahmi maheshvari caiva kaumari vaishnavi tatha || 134|| varahyaindri ca camunda
    vama jyeshtha sarasvati | kshobhini dravini raudri kalyunmadanakarini || 135|| khecara kalakarani
    ca balanam vikarani tatha | manonmani sarvabhutadamani sarvasiddhida || 136|| balapramathini shaktih
    buddhyakarshanarupini | ahankarakarshini ca shabdakarshanarupini || 137|| sparshakarshanarupa ca rupakarshanarupini
    | rasakarshanarupa ca pladhakarshanarupini || 138|| citrakarshanarupa ca dhairyakarshanarupini | smrityakarshanarupa
    ca namakarshanastvapini || 139|| bijakarshanarupa ca hyatmakarshanarupini | amritakarshini caiva sharirakarshani
    tatha || 140|| shodashasvarasampanna sravatpiyushamandita | tripureshi siddhidatri kaladarshanavasini
    || 141|| sarvasankshobhacakreshi shaktirguhyatarabhidha | anangakusumashaktih tathaivanangamekhala
    || 142|| anangamadana'nangamadanaturarupini | anangarekha canangaveganangakushabhidha || 143|| anangamalini
    caiva hyashtavargadhigamini | vasvashtakakritavasa shrimattripurasundari || 144|| sarvasamrajyasubhaga
    sarvabhagyapradeshvari | sampradayeshvari sarvasankshobhanakari tatha || 145|| sarvavidravani sarvakarshinirupakarini
    | sarvahladanashaktishca sarvasammohini tatha || 146|| sarvastambhanashaktishca sarvajrimbhanakarini
    | sarvavashyakashaktishca tatha sarvanuranjani || 147|| sarvonmadanashaktishca tatha sarvarthasadhika
    | sarvasampattida caiva sarvamatrimayi tatha || 148|| sarvadvandvakshayakari siddhistripuravasini
    | caturdasharacakreshi kulayogasamanvaya || 149|| sarvasiddhiprada caiva sarvasampatprada tatha |
    sarvapriyakari caiva sarvamangalakarini || 150|| sarvakamaprapurna ca sarvaduhkhavimocini | sarvamrityuprashamani
    sarva vighnavinashini || 151|| sarvangasundari caiva sarvasaubhagyadayini | tripura shrishca sarvarthasadhika
    dashakonaga || 15|| sarvarakshakari caiva ishvari yogini tatha | sarvajna sarvashaktishca sarvaishvaryaprada
    tatha || 153|| sarvajnanamayi caiva sarvavyadhivinashini | sarvadharasvarupa ca sarvapapahara tatha
    || 154|| sarvanandamayi caiva sarvarakshasvarupini | tathaiva ca mahashaktih sarvepsitaphalaprada
    || 155|| antardasharacakrastha tatha tripuramalini | sarvarogahara caiva rahasyayogini tatha || 156||
    vagdevi vashini caiva tatha kameshvari tatha | modini vimala caiva hyaruna jayini tatha || 15|| shivakamaprada
    devi shivakamasya sundari | lalita lalitadhyanaphalada shubhakarini || 15|| sarveshvari kaulini ca
    vasuvamshabhivarddhini | sarvakamaprada caiva parapararahasyavit || 159|| trikonacaturashrastha kameshvaryayudhatmika
    | kameshvaribanarupa kameshi caparupini || 160|| kameshi pashahasta ca kameshyankusharupini | kameshvari
    rudrashaktih agnicakrakritalaya || 161|| kamabhintra kamadogdhri kamada ca trikonaga | dakshakoneshvari
    vishnushaktirjalandharalaya || 162|| suryacakralaya vamakonaga somacakraga | bhagamala brihacchakti
    purna purvasraragini || 163|| shrimattrikonabhuvana tripurakhya maheshvari | sarvanandamayishani bindugatirahasyaga
    || 164|| parabrahmasvarupa ca mahatripurasundari | sarvacakrantarastha ca sarvacakradhidevata || 165||
    sarvacakreshvari sarvamantranamishvari tatha | sarvavidyeshvari caiva sarvavagishvari tatha || 166||
    sarvayogeshvari sarvapitheshvaryakhileshvari | sarvakameshvari sarvatatveshvaryagameshvari || 167||
    shaktih shaktibhridullasa nirdvandvadvaitagarbhini | nishprapanca prapancabha mahamaya prapancasuh
    || 168|| sarvavishvotpattidhatri paramanandakarana | lavanyasindhulahari sundaritoshamandira || 169||
    shivakamasundari devi sarvamangaladayini | itinamnam sahasram ca gaditam ishtadayakam || 170|| ||
    uttarapitika || sahasranama mantranam saramakrishya parvati | racitam hi maya caitat siddhidam paramokshadam
    || 1|| anena stuvato nityam ardharatre nishamukhe | pratah kale ca pujayam pathanam sarvakamadam ||
    2|| sarvasamrajyasukhada sundari paritushyati | ratnani vividhanyasya vittani pracurani ca || 3||
    manoratharathasthani dadati parameshvari | putrapautrashca vardhante santatissarvakalika || 4|| shatravastasya
    nashyanti vardhante ca balani ca | vyadhayastasya nashyanti labhate caushadhani ca || 5|| mandirani
    vicitrani rajante tasya sarvada | krishih phalavati tasya bhumih kamakhilaprada || 6|| sthiram janapadam
    tasya rajyam tasya nirangusham | matangasturagastungah sincinto madavaribhih || 7|| sainikashca virajante
    tushtah pushtasturangamah | pujah shashvat vivardhante nirvivadashca mantrinah || 8|| jnatayastasya
    tushyanti bandhavah vigatajvarah | bhrityastasya vashe nityam vartante'sya manonugah || 9|| gadyapadyamayi
    vani vaktvaturyasusambhrita | samagra sukhasampatti shalini lasyamalini || 10|| nanapadamayi vani
    tasya gangapravahavat | adrishtanyapi ca shastrani prakashante nirantaram || 11|| nigrahah paravakyanam
    sabhayam tasya jayate | stuvanti kritinastam vai rajano dasavattatha || 12|| shastranyastrani tadgatre
    janayanti rujo nahi | matangah tasya vashagah sarpavarya bhavanti ca || 13|| visham nirvishatam yati
    paniyamamritam bhavet | parasenastambhanam ca prativadivijrimbhanam || 14|| navaratrena jayante satatanyasayogatah
    | ahoratram pathedyastu stotram samyatamanasah || 15|| vashah tasyopajayante sarve lokah sunishcitam
    | shanmasabhyasayogena deva yakshashca kinnarah || 16|| siddha mahoragassarve vashamayanti nishcayam
    | nityam kamakalam nyasyan yah patet stotramuttamam || 17|| madanonmadini lilapurastri tadvashanuga
    | lavanyamadana sakshat vidagdhamukhacandrika || 18|| premapurnashrunayana sundari vashaga bhavet
    | bhurjapatre rocanena kunkumena varanane || 19|| dhaturagena va devi mulamantram vilikhya ca | rakshartham
    bhasma vinyasya putikritya samantrakam || 20|| suvarnaraupyakhacite sushire sthapya yatnatah | sampujya
    tatra deveshim punaradaya bhaktitah || 21|| dharayenmastake kanthe bahumule tatha hridi | nabhau ca
    vidyutam dhanyam jayadam sarvakamadam || 22|| rakshakaram nanyadasmat vidyate bhuvanatraye | jvararoganripavishtabhayahrit
    bhutivardhanam || 23|| balaviryakaram catha bhutashatruvinashanam | putrapautragunashreyovardhakam
    dhanadhanyakrit || 24|| ya idam pathati stotram sa sarvam labhate narah | yadgrihe likhitam stotram
    tishthedetad varanane || 25|| tatra tishthamyaham nityam harishca kamalasanah | vasanti sarvatirthani
    gauri lakshmissarasvati || 26|| shivakameshvarim dhyatva pathennamasahasrakam | asakrit dhyanapathena
    sadhakah siddhimapnuyat || 27|| shukravare paurnamasyam pathannamasahasrakam | pujam yah kurute bhaktya
    vanchitam labhate dhruvam || 28|| shivakameshvarimantrah mantrarajah prakirtitah | tadabhyasatsadhakashca
    siddhimapnotyanuttamam || 29|| nasadhakaya datavyamashraddhaya shathaya ca | bhaktihinaya maline gurunindaparaya
    ca || 30|| alasayayatnavate'shivabhaktaya sundari | vishnubhaktivihinaya na datavyam kadacana || 31||
    deyam bhaktavarayaitatbhuktimukyikaram shubham | siddhidam bhavarogaghnam stotrametadvaranane || 32||
    latayoge pathedyastu tasya kshipram phalam bhavet | saiva kalpalata tasya vanchaphalakari smrita ||
    33|| pushpitam yam latam samyak drishtva shrilalitam smaran | akshubdhah prapathedyastu sa yajnakratupunyabhak
    || 34|| vikalparahito yo hi nirvikalpah svayam shivah | naitatprakashayedbhaktah kushishyayalpamedhase
    || 35|| anekajanmapunyena dikshito jayate narah | tatrapyanekabhagyena shaivo vishnu parayanah ||
    36|| tatrapyanekapunyena shaktibhavah prajayate | mahodayena tatrapi sundaribhavabhagbhavet || 37||
    sahasranamnam tatrapi kirtanam ca sudurlabham | yatra janmani sa nityam purvapunyavashadbhavet ||
    38|| jivanmukto bhavettasya kartavyam navashishyate | avadhutatvameva syat na varnashramakalpana ||
    39|| brahmadayo'pi deveshim prarthayante tadavyayam | hamsatvam bhaktibhavena paramanandakaranam ||
    40|| devo'sau sarvada shakti bhavayanneva samsthitah | svayam shivastu vijneyah sundaribhavalampatah
    || 41|| brahmanandamayim jyotsnam sadashivaparayanam | shivakameshvarim devim bhavayan siddhimapnuyat
    || 42|| ahladah sundaridhyanat sundarinamakirtanat | sundaridarshanaccaiva sadanandah prajayate ||
    43|| || iti shrirudrayamale umamaheshasamvade shrishivakamasundaryah shrimattripurasundaryah shodasharnayah
    turiyasahasranamastotram sampurnam ||
  devanagari: ृङ्गारमूर्तिर्विरता रसानुभवरोचना । परमानन्दलहरी रतिरङ्गवती सती ॥ ३॥ रङ्गमालानङ्गकलाकेलिः
    कैवल्यदा कला । रसकल्पा कल्पलता कुतूहलवती गतिः ॥ ४॥ विनोददुग्धा सुस्निग्धा मुग्धमूर्तिनोहरा । बालार्ककोटिकिरणा
    चन्द्रकोटिसुशीतला ॥ ५॥ स्रवत्पीयूषदिग्धाङ्गी सङ्गीत नटिका शिवा । कुरङ्गनयना कान्ता सुखसन्ततिरिन्दिरा
    ॥ ६॥ मङ्गला मधुरापाङ्गा रञ्जनी रमणी रतिः । राजराजेश्वरी राज्ञी महेन्द्रपरिवन्दिता ॥ ७॥ प्रपञ्चगतिरीशानी
    सामरस्यपरायणा । हंसोल्लासा हंसगतिः शिञ्जत्कनकनूपुरा ॥ ८॥ मेरुमन्दरवक्षोजा सृणिपाशवरायुधा । शङ्खकोदण्डसस्ताब्जपाणिद्वयविराजिता
    ॥ ९॥ चन्द्रबिम्बानना चारुमकुटोत्तंसचन्द्रिका । सिन्दूरतिलका चारुधम्मिल्लामलमालिका ॥ १०॥ मन्दारदाममुदिता
    रक्तपुष्पविभूषिता । सुवर्णाभरणप्रीता मुक्तादाममनोहरा ॥ ११॥ ताम्बूलपूरवदना मदनानन्दमानसा । सुखाराध्या
    तपस्सारा कृपावारिधिरीश्वरी ॥ १२॥ वक्षःस्थललसन्मग्ना प्रभा मधुरसोन्मुखा । बिन्दुनादात्मिका चारुरसिता
    तुर्यरूपिणी ॥ १३॥ कमनीयाकृतिः धन्या शङ्करप्रीतिमञ्जरी । कन्या कलावती माता गजेन्द्रगमना शुभा ॥ १४॥
    कुमारी करभोरु श्रीः रूपलक्ष्मीः सुराजिता । सन्तोषसीमा सम्पत्तिः शातकुम्भप्रिया द्युतिः ॥ १५॥ परिपूर्णा
    जगद्धात्री विधात्री बलवर्धिनी । सार्वभौमनृपश्रीश्च साम्राज्यगतिरासिका ॥ १६॥ सरोजाक्षी दीर्घदृष्टिः
    सौचक्षणविचक्षणा । रङ्गस्रवन्ती रसिका प्रधानरसरूपिणी ॥ १७॥ रससिन्धुः सुगात्री च युवतिः मैथुनोन्मुखी
    । निरन्तरा रसासक्ता शक्तिस्त्रिभुवनात्मिका ॥ कामाक्षी कामनिष्ठा च कामेशी भगमङ्गला । सुभगा भगिनी भोग्या
    भाग्यदा भयदा भगा । भगलिङ्गानन्दकला भगमध्यनिवासिनी ॥ १९॥ भगरूपा भगमयी भगयन्त्रा भगोत्तमा । योनिर्जया
    कामकला कुलामृतपरायणा ॥ २०॥ कुलकुण्डालया सूक्ष्मजीवस्फुलिङ्गरूपिणी । मूलस्थिता केलिरता वलयाकृतिरीडिता
    ॥ २१॥ सुषुम्ना कमलानन्दा चित्रा कूर्मगतिर्गिरिः । सितारुणा सिन्धुरूपा प्रवेगा निर्धनी क्षमा ॥ २२॥
    धण्टाकोटिरसारावा रविबिम्बोत्थिताद्भूता । नादान्तलीना सम्पूर्णा प्रणवा बहुरूपिणी ॥ २३॥ भृङ्गारावा वशगतिः
    वागीशी मधुरध्वनिः । वर्णमाला सिद्धिकला षट्चक्रक्रमवासिनी ॥ २४॥ मणिपूरस्थिता स्निग्धा कूर्मचक्रपरायणा
    । मूलकेलिरता साध्वी स्वाधिष्ठाननिवासिनी ॥ २५॥ अनाहतगतिर्दीपा शिवानन्दमयद्युतिः । विरुद्धरुधा सम्बुद्धा
    जीवभोक्त्री स्थलीरता ॥ २६॥ आज्ञाचक्रोज्ज्वलस्फारस्फुरन्ती निर्गतद्विषा । चन्द्रिका चन्द्रकोटीशी सूर्यकोटिप्रभामयी
    ॥ २७॥ पद्मरागारुणच्छाया नित्याह्लादमयीप्रभा । महाशून्यालया चन्द्रमण्डलामृतनन्दिता ॥ २८॥ कान्ताङ्गसङ्गमुदिता
    सुधामाधुर्यसम्भृता । महाचन्द्रस्मितालिसा मृत्पात्रस्था सुधाद्युतिः ॥ २९॥ स्रवत्पीमूषसंसक्ता शश्वत्कुण्डालया
    भवा । श्रेयो द्युतिः प्रत्यगर्था सेवा फलवती मही ॥ ३०॥ शिवा शिवप्रिया शैवा शङ्करी शाम्भवी विभुः । स्वयम्भू
    स्वप्रिया स्वीया स्वकीया जनमातृका ॥ सुरामा स्वप्रिया श्रेयः स्वाधिकाराधिनायिका । मण्डला जननी मान्या
    सर्वमङ्गलसन्ततिः ॥ ३२॥ भद्रा भगवती भाव्या कलितार्धेन्दुभासुरा । कल्याणललिता काम्या कुकर्मकुमतिप्रदा
    ॥ ३३॥ कुरङ्गाक्षी क्षीरनेत्रा क्षीरा मधुरसोन्मदा । वारुणीपानमुदिता मदिरामुदिता स्थिरा ॥ ३४॥ कादम्बरीपानरुचिः
    विपाशा पशुभावना । मुदिता ललितापाङ्गा दरान्दोलितदीर्घदृक् ॥ ३५॥ दैत्याकुलानलशिखा मनोरथसुधाद्युतिः ।
    सुवासिनी पीतगात्री पीनश्रोणिपयोधरा ॥ ३६॥ सुचारुकबरी दध्युदध्युत्थिमौक्तिका । बिम्बाधरद्युतिः मुग्धा
    प्रवालोत्तमदीधितिः ॥ ३७॥ तिलप्रसूननासाग्रा हेममौक्तिककोरका । निष्कलङ्केन्दुवदना बालेन्दुवदनोज्वला
    ॥ ३८॥ नृत्यन्त्यञ्जननेत्रान्ता प्रस्फुरत्कर्णशष्कुली । भालचन्द्रातपोन्नद्धा मणिसूर्यकिरीटिनी ॥ ३९॥
    कचौघचम्पकश्रेणी मालिनीदाममण्डिता । हेममाणिक्य ताटङ्का मणिकाञ्चन कुण्डला ॥ ४०॥ सुचारुचुबुका कम्बुकण्ठी
    कुण्डावली रमा । गङ्गातरङ्गहारोर्मिः मत्तकोकिलनिस्वना ॥ ४१॥ मृणालविलसद्बाहुपाशाकुशधनुर्धरा । केयूरकङ्कणश्रेणी
    नानामणिमनोरमा ॥ ४२॥ ताम्रपङ्कजपाणिश्रीः नवरत्नप्रभावती । अङ्गुलीयमणिश्रेणी कान्तिमङ्गलसन्ततिः ॥ ४३॥
    मन्दरद्वन्द्वसुकुचा रोमराजिभुजङ्गिका । गम्भीरनाभिस्त्रिवलीभङ्गुरा क्षणिमध्यमा ॥ ४४॥ रणत्काञ्चीगुणानद्धा
    पट्टांशुकनितम्बिका । मेरुसन्धिनितम्बाढ्या गजशुण्डोरुयुग्मयुक् ॥ ४५॥ सुजानुर्मदनानन्दमयजङ्घाद्वयान्विता
    । गूढगुल्फा मञ्जुशिञ्जन्मणिनूपुरमण्डिता ॥ ४६॥ पदद्वन्द्वजिताम्भोजा नखचन्द्रावलीप्रभा । सुसीमप्रपदा
    राजंहसमत्तेभमन्दगा ॥ ४७॥ योगिध्येयपदद्वद्वा सौन्दर्यामृतसारिणी । लावपयसिन्धुः सिन्दूरतिलका कुटिलालका
    ॥ ४८॥ साधुसीमन्तिनी सिद्धबुद्धवृन्दारकोदया । बालार्ककिरणश्रेणिशोणश्रीः प्रेमकामधुक् ॥ ४९॥ रसगम्भीरसरसी
    पद्मिनी रससारसा । प्रसन्नासन्नवरदा शारदा भुवि भाग्यदा ॥ ५०॥ नटराजप्रिया विश्वानाद्या नर्तकनर्तकी ।
    चित्रयन्त्रा चित्रतन्त्रा चित्रविद्यावलीयतिः ॥ ५१॥ चित्रकूटा त्रिकूटा च पन्धकूटा च पञ्चमी । चतुष्ट्कूटा
    शम्भुविद्या षट्कूटा विष्णुपूजिता ॥ ५२॥ कूटषोडशसम्पन्ना तुरीया परमा कला । षोडशी मन्त्रयन्त्राणां ईश्वरी
    मेरुमण्डला ॥ ५३॥ षोडशार्णा त्रिवर्णा च बिन्दुनादस्वरूपिणी । वर्णातीता वर्णमता शब्दब्रह्ममयी सुखा ॥
    ५४॥ सुखज्योत्स्नानन्दविद्युदन्तराकाशदेवता । चैतन्या विधिकूटात्मा कामेशी स्वप्नदर्शना ॥ ५५॥ स्वप्नरूपा
    बोधकरी जाग्रती जागराश्रया । स्वप्नाश्रया सुषुप्तिस्था तन्त्रमूर्तिश्च माधवी ॥ ५६॥ लोपामुद्रा कामराज्ञी
    माधवी मित्ररूपिणी । शाङ्करी नन्दिविद्या च भास्वन्मण्डलमध्यगा ॥ ५७॥ माहेन्द्रस्वर्गसम्पत्तिः दूर्वासस्सेविता
    श्रुतिः । साधकेन्द्रगतिस्साध्वी सुलिप्ता सिद्धिकन्धरा ॥ ५८॥ पुरत्रयेशी पुरकृत् षष्ठी च परदेवता । विघ्नदूरी
    भूरिगुणा पुष्टिः पूजितकामधुक् ॥ ५९॥ हेरम्बमाता गणपा गुहाम्बाऽऽर्या नितम्बिनी । एषा सीमन्तिनी मोक्षदक्षा
    दीक्षितमातृका ॥ ६०॥ साधकाम्बा सिद्धमाता साधकेन्द्रमनोरमा । यौवनोन्मादिनी तुङ्गस्तनी सुश्रोणिमण्डिता
    ॥ ६१॥ पद्मरक्तोत्पलवती रक्तमाल्यानुलेपना । रक्तमाल्यरुचिर्दक्षा शिखण्डिन्यतिसुन्दरी ॥ ६२॥ शिखण्डिनृत्यसन्तुष्टा
    शिखण्डिकुलपालिनी । वसुन्धरा च सुरभिः कमनीयतनुश्शुभा ॥ ६३॥ नन्दिनी त्रीक्षणवती वसिष्ठालयदेवता । गोलकेशी
    च लोकेन्द्रा नृलोकपरिपालिका ॥ ६४॥ हविर्धात्री देवमाता वृन्दारकपरात्मयुक् । रुद्रमाता रुद्रपत्नी मदोद्गारभरा
    क्षितिः ॥ ६५॥ दक्षिणा यज्ञसम्पत्तिः स्वबला धीरनन्दिता । क्षीरपूर्णार्णवगतिः सुधायोनिः सुलोचना ॥ ६६॥
    रमा तुङ्गा सदासेव्या सुरसङ्घदया उमा । सुचरित्रा चित्रवरा सुस्तनी वत्सवत्सला ॥ ६७॥ रजस्वला रजोयुक्ता
    रञ्जिता रङ्गमालिका । रक्तप्रिया सुरक्ता च रतिरङ्गस्वरूपिणी ॥ ६८॥ रजश्शुक्लाक्षिका निष्ठा ऋतुस्नाता
    रतिप्रिया । भाव्यभाव्या कामकेलिः स्मरभूः स्मरजीविका ॥ ६९॥ समाधिकुसुमानन्दा स्वयम्भुकुसुमप्रिया । स्वयम्भुप्रेमसन्तुष्टा
    स्वयम्भूनिन्दकान्तका ॥ ७०॥ स्वयम्भुस्था शक्तिपुटा रविः सर्वस्वपेटिका । अत्यन्तरसिका दूतिः विदग्धा
    प्रीतिपूजिता ॥ ७१॥ तूलिकायन्त्रनिलया योगपीठनिवासिनी । सुलक्षणा दृश्यरूपा सर्व लक्षणलक्षिता ॥ ७२॥ नानालङ्कारसुभगा
    पञ्चकामशरार्चिता । ऊर्ध्वत्रिकोणयन्त्रस्था बाला कामेश्वरी तथा ॥ ७३॥ गुणाध्यक्षा कुलाध्यक्षा लक्ष्मीश्चैव
    सरस्वती । वसन्तमदनोत्तुङ्ग स्तनी कुचभरोन्नता ॥ ७४॥ कलाधरमुखी मूर्धपाथोधिश्च कलावती । दक्षपादादिशीर्षान्तषोडशस्वरसंयुता
    ॥ ७५॥ श्रद्धा पूर्तिः रतिश्चैव भूतिः कान्तिर्मनोरमा । विमला योगिनी घोरा मदनोन्मादिनी मदा ॥ ७६॥ मोदिनी
    दीपिनी चैव शोषिणी च वशङ्करी । रजन्यन्ता कामकला लसत्कमलधारिणी ॥ ७७॥ वाममूर्धादिपादान्तषोडशस्वरसंयुता
    । पूषरूपा सुमनसां सेव्या प्रीतिः द्युतिस्तथा ॥ ७८॥ ऋद्धिः सौदामिनी चिच्च हंसमालावृता तथा । शशिनी चैव
    च स्वस्था सम्पूर्णमण्डलोदया ॥ ७९॥ पुष्टिश्चामृतपूर्णा च भगमालास्वरूपिणी । भगयन्त्राश्रया शम्भुरूपा
    संयोगयोगिनी ॥ ८०॥ द्राविणी बीजरूपा च ह्यक्षुब्धा साधकप्रिया । रजः पीठमयी नाद्या सुखदा वाञ्छितप्रदा
    ॥ ८१॥ रजस्सवित् रजश्शक्तिः शुक्लबिन्दुस्वरूपिणी । सर्वसाक्षी सामरस्या शिवशक्तिमयी प्रभा ॥ ८२॥ संयोगानन्दनिलया
    संयोगप्रीतिमातृका । संयोगकुसुमानन्दा संयोगयोगपद्धतिः ॥ ८३॥ संयोगसुखदावस्था चिदानन्दार्ध्यसेविता ।
    अर्घ्यपूज्या च सम्पत्तिः अर्ध्यदाभिन्नरूपिणी ॥ ८४॥ सामरस्यपरा प्रीता प्रियसङ्गमरङ्गिणी । ज्ञानदूती
    ज्ञानगम्या ज्ञानयोनिश्शिवालया ॥ ८५॥ चित्कला सत्कला ज्ञानकला संवित्कलात्मिका । कलाचतुष्टयी पद्मवासिनी
    सूक्ष्मरूपिणी ॥ ८६॥ हंसकेलिस्थलस्वस्था हंसद्वयविकासिनी । विरागिता मोक्षकला परमात्मकलावती ॥ ८७॥ विद्याकलान्तरात्मस्था
    चतुष्टयकलावती । विद्यासन्तोषणा तृप्ति परब्रह्मप्रकाशिनी ॥ ८८॥ परमात्मपरा वस्तुलीना शक्तिचतुष्टयी ।
    शान्तिर्बोधकला व्याप्तिः परज्ञानात्मिका कला ॥ ८९॥ पश्यन्ती परमात्मस्था चान्तरात्मकला शिवा । मध्यमा
    वैखरी चात्म कलाऽऽनन्दकलावती ॥ ९०॥ तरुणी तारका तारा शिवलिङ्गालयात्मवित् । परस्परस्वभावा च ब्रह्मज्ञानविनोदिनी
    ॥ ९१॥ रामोल्लासा च दुर्धर्षा परमार्घ्यप्रिया रमा । जात्यादिरहिता योगिन्यानन्दमात्रपद्धतिः ॥ ९२॥ कान्ता
    शान्ता दान्तयातिः कलिता होमपद्धतिः । दिव्यभावप्रदा दिव्या वीरसूर्वीरभावदा ॥ ९३॥ पशुदेहा वीरगतिः वीरहंसमनोदया
    । मूर्धाभिषिक्ता राजश्रीः क्षत्रियोत्तममातृका ॥ ९४॥ शस्त्रास्त्रकुशला शोभा रथस्था युद्धजीविका । अश्वारूढा
    गजारूढा भूतोक्तिः सुरसुश्रया ॥ ९५॥ राजनीतिश्शान्तिकर्त्री चतुरङ्गबलाश्रया । पोषिणी शरणा पद्मपालिका
    जयपालिका ॥ ९६॥ विजया योगिनी यात्रा परसैन्यविमर्दिनी । पूर्णवित्ता वित्तगम्या वित्तसञ्चय शालिनी ॥ ९७॥
    महेशी राज्यभोगा च गणिकागणभोगभृत् । उकारिणी रमा योग्या मन्दसेव्या पदात्मिका ॥ सैन्यश्रेणी शौर्यरता
    पताकाध्वजमालिनी । सुच्छत्र चामरश्रेणिः युवराजविवर्धिनी ॥ ९९॥ पूजा सर्वस्वसम्भारा पूजापालनलालसा । पूजाभिपूजनीया
    च राजकार्यपरायणा ॥ १००॥ ब्रह्मक्षत्रमयी सोमसूर्यवह्निस्वरूपिणी । पौरोहित्यप्रिया साध्वी ब्रह्माणी
    यन्त्रसन्ततिः ॥ सोमपानजनाप्रीता योजनाध्वगतिक्षमा । प्रीतिग्रहा परा दात्री श्रेष्ठजातिः सताङ्गतिः ॥
    १०२॥ गायत्री वेदविद्ध्येया दीक्षा सन्तोषतर्पणा । रत्नदीधितिविद्युत्सहसना वैश्यजीविका ॥ १०३॥ कृषिर्वाणिज्यभूतिश्च
    वृद्धिदा वृद्धसेविता । तुलाधारा स्वप्नकामा मानोन्मानपरायणा ॥ १०४॥ श्रद्धा विप्रगतिः कर्मकरी कौतुकपूजिता
    । नानाभिचारचतुरा वारस्त्रीश्रीः कलामयी ॥ सुकर्णधारा नौपारा सर्वाशा रतिमोहिनी । दुर्गा विन्ध्यवनस्था
    च कालदर्पनिषूदिनी ॥ भूमारशमनी कृष्णा रक्षोराक्षससाहसा । विविधोत्पातशमनी समया सुरसेविता ॥ १०७॥ पञ्चावयववाक्यश्रीः
    प्रपञ्चोद्यानचन्द्रिका । सिद्धिसन्दोहसंसिद्धयोगिनीवृन्दसेविता ॥ १०८॥ नित्या षोडशिकारूपा कामेशी भगमालिनी
    । नित्यक्लिन्ना निराधारा वह्निमण्डलवासिनी ॥ १०९॥ महावज्रेश्वरी नित्यशिवदूतीति विश्रुता । त्वरिता प्रथिता
    ख्याता विख्याता कुलसुन्दरी ॥ ११०॥ नित्या नीलपताका च विजया सर्वमङ्गला । ज्वालामाला विचित्रा च महात्रिपुरसुन्दरी
    ॥ १११॥ गुरुवृन्दा परगुरुः प्रकाशानन्ददायिनी । शिवानन्दा नादरूपा शक्रानन्दस्वरूपिणी ॥ ११२॥ देव्यानन्दा
    नादमयी कौलेशानन्दनाथिनी । शुक्लदेव्यानन्दनाथा कुलेशानन्ददायिनी ॥ ११३॥ दिव्यौघसेविता दिव्यभोगदानपरायणा
    । क्रीडानन्दा क्रीडमाना समयानन्ददायिनी ॥ ११४॥ वेदानन्दा पार्वती च सहजानन्ददायिनी । सिद्धौघगुरुरूपा
    चाप्यपरा गुरुरूपिणी ॥ ११५॥ गगनानन्दनाथा च विश्वाद्यानन्ददायिनी । विमलानन्दनाथा च मदनानन्ददायिनी ॥
    ११६॥ भुवनानन्दनाथा च लीलोद्यानप्रिया गतिः । स्वात्मान्दविनोदा च प्रियाद्यानन्दनाथिनी ॥ ११७॥ मानवाद्या
    गुरुश्रेष्ठा परमेष्ठि गुरुप्रभा । परमाद्या गुरुश्शक्तिः किर्तनप्रिया ॥ ११८॥ त्रैलोक्यमोहनाख्या च सर्वाशापरिपूरका
    । सर्वसङ्क्षोभिणी पूर्वाम्नाया चक्रत्रयालया ॥ ११९॥ सर्वसौभाग्यदात्री च सर्वार्थसाधकप्रिया । सर्वरक्षाकरी
    साधुर्दक्षिणाम्नायदेवता ॥ १२०॥ मध्यचक्रैकनिलया पश्चिमाम्नायदेवता । नवचक्रकृतावासा कौबेराम्नायदेवता
    ॥ १२१॥ बिन्दुचक्रकृतायासा मध्यसिंहासनेश्वरी । श्रीविद्या नवदुर्गा च महिषासुरमर्दिनी ॥ १२२॥ सर्वसाम्राज्यलक्ष्मीश्च
    अष्टलक्ष्मीश्च संश्रुता । शैलेन्द्रतनया ज्योतिः निष्कला शाम्भवी उमा ॥ १२३॥ अजपा मातृका चेति शुक्लवर्णा
    षडानना । पारिजातेश्वरी चैव त्रिकूटा पञ्चबाणदा ॥ ११४॥ पञ्चकल्पलता चैव त्र्यक्षरी मूलपीठिका । सुधाश्रीरमृतेशानी
    ह्यन्नपूर्णा च कामधुक् ॥ १२५॥ पाशहस्ता सिद्धलक्ष्मीः मातङ्गी भुवनेश्वरी । वाराही नवरत्नानामीश्वरी
    च प्रकीर्तिदा ॥ १२६॥ परं ज्योतिः कोशरूपा सैन्धवी शिवदर्शना । परापरा स्वामिनी च शाक्तदर्शनविश्रुता
    ॥ १२७॥ ब्रह्मदर्शनरूपा च शिवदर्शनरूपिणी । विष्णुदर्शनरूपा च स्रष्टॄदर्शनरूपिणी ॥ १२८॥ सौरदर्शनरूपा
    च स्थितिचक्रकृताश्रया । बौद्धदर्शनरूपा च तुरीया बहुरूपिणी ॥ १२९॥ तत्त्वमुद्रास्वरूपा च प्रसन्ना ज्ञानमातृका
    । सर्वोपचारसन्तुष्टा हृन्मयी शीर्षदेवता ॥ १३०॥ शिखास्थिता वर्ममयी नेत्रत्रयविलासिनी । अस्त्रस्था चतुरस्रस्था
    द्वारस्था द्वारदेवता ॥ १३१॥ अणिमा पश्चिमस्था च दक्षिणद्वारदेवता । वशित्वा वायुकोणस्था प्राकाम्येशानदेवता
    ॥ १३२॥ महिमापूर्वनाथा च लघिमोत्तरदेवता । अग्निकोणस्थगरिमा प्राप्तिर्नैरृतिवासिनी ॥ १३३॥ ईशित्वसिद्धिसुरथा
    सर्वकामोर्ध्ववासिनी । ब्राह्मी माहेश्वरी चैव कौमारी वैष्णवी तथा ॥ १३४॥ वाराह्यैन्द्री च चामुण्डा वामा
    ज्येष्ठा सरस्वती । क्षोभिणी द्राविणी रौद्री काल्युन्मादनकारिणी ॥ १३५॥ खेचरा कालकरणी च बलानां विकरणी
    तथा । मनोन्मनी सर्वभूतदमनी सर्वसिद्धिदा ॥ १३६॥ बलप्रमथिनी शक्तिः बुद्ध्याकर्षणरूपिणी । अहङ्काराकर्षिणी
    च शब्दाकर्षणरूपिणी ॥ १३७॥ स्पर्शाकर्षणरूपा च रूपाकर्षणरूपिणी । रसाकर्षणरूपा च प्लधाकर्षणरूपिणी ॥ १३८॥
    चित्राकर्षणरूपा च धैर्याकर्षणरूपिणी । स्मृत्याकर्षणरूपा च नामाकर्षणस्त्वपिणी ॥ १३९॥ बीजाकर्षणरूपा
    च ह्यात्माकर्षणरूपिणी । अमृताकर्षिणी चैव शरीराकर्षणी तथा ॥ १४०॥ षोडशस्वरसम्पन्ना स्रवत्पीयूषमण्डिता
    । त्रिपुरेशी सिद्धिदात्री कलादर्शनवासिनी ॥ १४१॥ सर्वसङ्क्षोभचक्रेशी शक्तिर्गुह्यतराभिधा । अनङ्गकुसुमाशक्तिः
    तथैवानङ्गमेखला ॥ १४२॥ अनङ्गमदनाऽनङ्गमदनातुररूपिणी । अनङ्गरेखा चानङ्गवेगानङ्गाकुशाभिधा ॥ १४३॥ अनङ्गमालिनी
    चैव ह्यष्टवर्गाधिगामिनी । वस्वष्टककृतावासा श्रीमत्त्रिपुरसुन्दरी ॥ १४४॥ सर्वसाम्राज्यसुभगा सर्वभाग्यप्रदेश्वरी
    । सम्प्रदायेश्वरी सर्वसङ्क्षोभणकरी तथा ॥ १४५॥ सर्वविद्रावणी सर्वाकर्षिणीरूपकारिणी । सर्वाह्लादनशक्तिश्च
    सर्वसम्मोहिनी तथा ॥ १४६॥ सर्वस्तम्भनशक्तिश्च सर्वजृम्भणकारिणी । सर्ववश्यकशक्तिश्च तथा सर्वानुरञ्जनी
    ॥ १४७॥ सर्वोन्मादनशक्तिश्च तथा सर्वार्थसाधिका । सर्वसम्पत्तिदा चैव सर्वमातृमयी तथा ॥ १४८॥ सर्वद्वन्द्वक्षयकरी
    सिद्धिस्त्रिपुरवसिनी । चतुर्दशारचक्रेशी कुलयोगसमन्वया ॥ १४९॥ सर्वसिद्धिप्रदा चैव सर्वसम्पत्प्रदा तथा
    । सर्वप्रियकरी चैव सर्वमङ्गलकारिणी ॥ १५०॥ सर्वकामप्रपूर्णा च सर्वदुःखविमोचिनी । सर्वमृत्युप्रशमनी
    सर्व विघ्नविनाशिनी ॥ १५१॥ सर्वाङ्गसुन्दरी चैव सर्वसौभाग्यदायिनी । त्रिपुरा श्रीश्च सर्वार्थसाधिका
    दशकोणगा ॥ १५॥ सर्वरक्षाकरी चैव ईश्वरी योगिनी तथा । सर्वज्ञा सर्वशक्तिश्च सर्वैश्वर्यप्रदा तथा ॥ १५३॥
    सर्वज्ञानमयी चैव सर्वव्याधिविनाशिनी । सर्वाधारस्वरूपा च सर्वपापहरा तथा ॥ १५४॥ सर्वानन्दमयी चैव सर्वरक्षास्वरूपिणी
    । तथैव च महाशक्तिः सर्वेप्सितफलप्रदा ॥ १५५॥ अन्तर्दशारचक्रस्था तथा त्रिपुरमालिनी । सर्वरोगहरा चैव
    रहस्ययोगिनी तथा ॥ १५६॥ वाग्देवी वशिनी चैव तथा कामेश्वरी तथा । मोदिनी विमला चैव ह्यरुणा जयिनी तथा ॥
    १५॥ शिवकामप्रदा देवी शिवकामस्य सुन्दरी । ललिता ललिताध्यानफलदा शुभकारिणी ॥ १५॥ सर्वेश्वरी कौलिनी च
    वसुवंशाभिवर्द्धिनी । सर्वकामप्रदा चैव परापररहस्यवित् ॥ १५९॥ त्रिकोणचतुरश्रस्थ कामेश्वर्यायुधात्मिका
    । कामेश्वरीबाणरूपा कामेशी चापरूपिणी ॥ १६०॥ कामेशी पाशहस्ता च कामेश्यङ्कुशरूपिणी । कामेश्वरी रुद्रशक्तिः
    अग्निचक्रकृतालया ॥ १६१॥ कामाभिन्त्रा कामदोग्ध्री कामदा च त्रिकोणगा । दक्षकोणेश्वरी विष्णुशक्तिर्जालन्धरालया
    ॥ १६२॥ सूर्यचक्रालया वामकोणगा सोमचक्रगा । भगमाला बृहच्छक्ति पूर्णा पूर्वास्ररागिणी ॥ १६३॥ श्रीमत्त्रिकोणभुवना
    त्रिपुराख्या महेश्वरी । सर्वानन्दमयीशानी बिन्दुगातिरहस्यगा ॥ १६४॥ परब्रह्मस्वरूपा च महात्रिपुरसुन्दरी
    । सर्वचक्रान्तरस्था च सर्वचक्राधिदेवता ॥ १६५॥ सर्वचक्रेश्वरी सर्वमन्त्राणामीश्वरी तथा । सर्वविद्येश्वरी
    चैव सर्ववागीश्वरी तथा ॥ १६६॥ सर्वयोगेश्वरी सर्वपीठेश्वर्यखिलेश्वरी । सर्वकामेश्वरी सर्वतत्वेश्वर्यागमेश्वरी
    ॥ १६७॥ शक्तिः शक्तिभृदुल्लासा निर्द्वन्द्वाद्वैतगर्भिणी । निष्प्रपञ्चा प्रपञ्चाभा महामाया प्रपञ्चसूः
    ॥ १६८॥ सर्वविश्वोत्पत्तिधात्री परमानन्दकारणा । लावण्यसिन्धुलहरी सुन्दरीतोषमन्दिरा ॥ १६९॥ शिवकामसुन्दरी
    देवी सर्वमङ्गलदायिनी । इतिनाम्नां सहस्रं च गदितं इष्टदायकम् ॥ १७०॥ ॥ उत्तरपीतिका ॥ सहस्रनाम मन्त्राणां
    सारमाकृष्य पार्वति । रचितं हि मया चैतत् सिद्धिदं परमोक्षदम् ॥ १॥ अनेन स्तुवतो नित्यं अर्धरात्रे निशामुखे
    । प्रातः काले च पूजायां पठनं सर्वकामदम् ॥ २॥ सर्वसाम्राज्यसुखदा सुन्दरी परितुष्यति । रत्नानि विविधान्यस्य
    वित्तानि प्रचुराणि च ॥ ३॥ मनोरथरथस्थानि ददाति परमेश्वरी । पुत्रपौत्राश्च वर्धन्ते सन्ततिस्सार्वकालिका
    ॥ ४॥ शत्रवस्तस्य नश्यन्ति वर्धन्ते च बलानि च । व्याधयस्तस्य नश्यन्ति लभते चौषधानि च ॥ ५॥ मन्दिराणि
    विचित्राणि राजन्ते तस्य सर्वदा । कृषिः फलवती तस्य भूमिः कामाखिलप्रदा ॥ ६॥ स्थिरं जनपदं तस्य राज्यं
    तस्य निरङ्गुशम् । मातङ्गास्तुरगास्तुङ्गाः सिञ्चिन्तो मदवारिभिः ॥ ७॥ सैनिकाश्च विराजन्ते तुष्टाः पुष्टास्तुरङ्गमाः
    । पूजाः शश्वत् विवर्धन्ते निर्विवादाश्च मन्त्रिणः ॥ ८॥ ज्ञातयस्तस्य तुष्यन्ति बान्धवाः विगतज्वराः
    । भृत्यास्तस्य वशे नित्यं वर्तन्तेऽस्य मनोनुगाः ॥ ९॥ गद्यपद्यमयी वाणी वाक्त्वातुर्यसुसम्भृता । समग्र
    सुखसम्पत्ति शालिनी लास्यमालिनी ॥ १०॥ नानापदमयी वाणी तस्य गङ्गाप्रवाहवत् । अदृष्टान्यपि च शास्त्राणि
    प्रकाशन्ते निरन्तरम् ॥ ११॥ निग्रहः परवाक्यानां सभायां तस्य जायते । स्तुवन्ति कृतिनस्तं वै राजानो दासवत्तथा
    ॥ १२॥ शस्त्राण्यस्त्राणि तद्गात्रे जनयन्ति रुजो नहि । मातङ्गाः तस्य वशगाः सर्पवर्या भवन्ति च ॥ १३॥
    विषं निर्विषतां याति पानीयममृतं भवेत् । परसेनास्तम्भनं च प्रतिवादिविजृम्भणम् ॥ १४॥ नवरात्रेण जायन्ते
    सततन्यासयोगतः । अहोरात्रं पठेद्यस्तु स्तोत्रं संयतमानसः ॥ १५॥ वशाः तस्योपजायन्ते सर्वे लोकाः सुनिश्चितम्
    । षण्मासाभ्यासयोगेन देवा यक्षाश्च किन्नराः ॥ १६॥ सिद्धा महोरगास्सर्वे वशमायान्ति निश्चयम् । नित्यं
    कामकलां न्यस्यन् यः पतेत् स्तोत्रमुत्तमम् ॥ १७॥ मदनोन्मादिनी लीलापुरस्त्री तद्वशानुगा । लावण्यमदना
    साक्षात् विदग्धमुखचन्द्रिका ॥ १८॥ प्रेमपूर्णाश्रुनयना सुन्दरी वशगा भवेत् । भूर्जपत्रे रोचनेन कुङ्कुमेन
    वरानने ॥ १९॥ धातुरागेण वा देवी मूलमन्त्रं विलिख्य च । रक्षार्थं भस्म विन्यस्य पुटीकृत्य समन्त्रकम्
    ॥ २०॥ सुवर्णरौप्यखचिते सुषिरे स्थाप्य यत्नतः । सम्पूज्य तत्र देवेशीं पुनरादाय भक्तितः ॥ २१॥ धारयेन्मस्तके
    कण्ठे बाहुमूले तथा हृदि । नाभौ च विद्युतं धन्यं जयदं सर्वकामदम् ॥ २२॥ रक्षाकरं नान्यदस्मात् विद्यते
    भुवनत्रये । ज्वररोगनृपाविष्टभयहृत् भूतिवर्धनम् ॥ २३॥ बलवीर्यकरं चाथ भूतशत्रुविनाशनम् । पुत्रपौत्रगुणश्रेयोवर्धकं
    धनधान्यकृत् ॥ २४॥ य इदं पठति स्तोत्रं स सर्वं लभते नरः । यद्गृहे लिखितं स्तोत्रं तिष्ठेदेतद् वरानने
    ॥ २५॥ तत्र तिष्ठाम्यहं नित्यं हरिश्च कमलासनः । वसन्ति सर्वतीर्थानि गौरी लक्ष्मीस्सरस्वती ॥ २६॥ शिवकामेश्वरीं
    ध्यात्वा पठेन्नामसहस्रकम् । असकृत् ध्यानपाठेन साधकः सिद्धिमाप्नुयात् ॥ २७॥ शुक्रवारे पौर्णमास्यां
    पठन्नामसहस्रकम् । पूजां यः कुरुते भक्त्या वाञ्छितं लभते ध्रुवम् ॥ २८॥ शिवकामेश्वरीमन्त्रः मन्त्रराजः
    प्रकीर्तितः । तदभ्यासात्साधकश्च सिद्धिमाप्नोत्यनुत्तमाम् ॥ २९॥ नासाधकाय दातव्यमश्रद्धाय शठाय च । भक्तिहीनाय
    मलिने गुरुनिन्दापराय च ॥ ३०॥ अलसायायत्नवतेऽशिवभक्ताय सुन्दरि । विष्णुभक्तिविहीनाय न दातव्यं कदाचन
    ॥ ३१॥ देयं भक्तवरायैतत्भुक्तिमुक्यिकरं शुभम् । सिद्धिदं भवरोगघ्नं स्तोत्रमेतद्वरानने ॥ ३२॥ लतायोगे
    पठेद्यस्तु तस्य क्षिप्रं फलं भवेत् । सैव कल्पलता तस्य वाञ्छाफलकरी स्मृता ॥ ३३॥ पुष्पितां यां लतां
    सम्यक् दृष्ट्वा श्रीललितां स्मरन् । अक्षुब्धः प्रपठेद्यस्तु स यज्ञक्रतुपुण्यभाक् ॥ ३४॥ विकल्परहितो
    यो हि निर्विकल्पः स्वयं शिवः । नैतत्प्रकाशयेद्भक्तः कुशिष्यायाल्पमेधसे ॥ ३५॥ अनेकजन्मपुण्येन दीक्षितो
    जायते नरः । तत्राप्यनेकभाग्येन शैवो विष्णु परायणः ॥ ३६॥ तत्राप्यनेकपुण्येन शक्तिभावः प्रजायते । महोदयेन
    तत्रापि सुन्दरीभावभाग्भवेत् ॥ ३७॥ सहस्रनाम्नां तत्रापि कीर्तनं च सुदुर्लभम् । यत्र जन्मनि सा नित्यं
    पूर्वपुण्यवशाद्भवेत् ॥ ३८॥ जीवन्मुक्तो भवेत्तस्य कर्तव्यं नावशिष्यते । अवधूतत्वमेव स्यात् न वर्णाश्रमकल्पना
    ॥ ३९॥ ब्रह्मादयोऽपि देवेशीं प्रार्थयन्ते तदव्ययाम् । हंसत्वं भक्तिभावेन परमानन्दकारणम् ॥ ४०॥ देवोऽसौ
    सर्वदा शक्ति भावयन्नेव संस्थितः । स्वयं शिवस्तु विज्ञेयः सुन्दरीभावलम्पटः ॥ ४१॥ ब्रह्मानन्दमयीं ज्योत्स्नां
    सदाशिवपरायणाम् । शिवकामेश्वरीं देवीं भावयन् सिद्धिमाप्नुयात् ॥ ४२॥ आह्लादः सुन्दरीध्यानात् सुन्दरीनामकीर्तनात्
    । सुन्दरीदर्शनाच्चैव सदानन्दः प्रजायते ॥ ४३॥ ॥ इति श्रीरुद्रयामले उमामहेशसंवादे श्रीशिवकामसुन्दर्याः
    श्रीमत्त्रिपुरसुन्दर्याः षोडशार्णायाः तुरीयसहस्रनामस्तोत्रं सम्पूर्णम् ॥
