id: shakyasimhastotram-8
category: stotram
name:
  english: shakyasimhastotram 8
  devanagari: शाक्यसिंहस्तोत्रम् ८
content:
  english: shakyasimhastotram 8 esho hi bhavatastato janmamrityujarantakah | sarvarthasiddhanamneti shakyasimho'dhuna
    suta || 1|| yasya chayamupashritya divyatisundaro bhaveh | dvatrimshallakshanadharam pitaram darshayadhuna
    || 2|| caturashitisahasram strinam vihaya nirmadah | tapovanamagad yo'sau vandayainam maharddhikam
    || 3|| saptaratnani rajyam ca mahaishvaryapadam varam | hitva pravrajito yo'sau tam darshaya jagadgurum
    || 4|| mayakhyayah pitamahya yo'janaddakshakukshitah | lumbinyamudayat surya iva tam pitaram nama
    || 5|| abhayayah kuleshvarya yena padambuje natam | traidhatukadhipam devam pitaram tvam sada nama
    || 6|| vishvamitramupadhyayam yo'yojayat susamvare | balakridabhiraktatma tatamenam sada nama || 7||
    jambutarusamasinam pancarshayo hatatvishah | nirmaninah prabhajan yamenam tatam sada nama || 8|| pitaram
    bodhayitva yo'tyajayattu shadamshakam | dayakaram jagadvandyam janakam pranamatmaja || 9|| yo'jayaddevadattadin
    maninah sarvavit sudhih | sarvaphaladidam vijnam sudhiyam janakam bhaja || 10|| yatrayamaturam jirnam
    mritam drishtivivarjitam | svayam vijno'pi papraccha sada tam janakam bhaja || 11|| kamagnirnaharadyasya
    cittam pramadavasinah | niranjanam nirvikalpam suta tam janakam bhaja || 12|| kanakashvam samaruhya
    chandakena bahiryayau | deshannishithe tridashaih stuyamanam muda bhaja || 13|| hayam nivartayamasa
    chandakam ca tapovanat | sukanthabharanam dattva bhanainam vanacarinam || 14|| nairanjanamupasritya
    prakarod yastapovratam | jagaddhitartham shadvarshamenam bhaja tapahparam || 15|| bodhidrumasamasino
    jitva maram suduhsaham | pralabhadbodhiratnam yo darshayainam tathagatam || 16|| mrigadavasthitah
    kashyam dharmacarkra pravartayan | brahmadibhirvrito yo'sau darshayainam gurum suta || 17|| iti matroditam
    shrutva rahulah so'tivismitah | pranamya pitaram pashyan mudamapa smitananah || 18|| iti shrishakyasimhastotram
    yashodharakritam sampurnam ||
  devanagari: शाक्यसिंहस्तोत्रम् ८ एषो हि भवतस्तातो जन्ममृत्युजरान्तकः । सर्वार्थसिद्धनाम्नेति शाक्यसिंहोऽधुना
    सुत ॥ १॥ यस्य छायामुपाश्रित्य दिव्यातिसुन्दरो भवेः । द्वात्रिंशल्लक्षणधरं पितरं दर्शयाधुना ॥ २॥ चतुरशीतिसाहस्रं
    स्त्रीणां विहाय निर्मदः । तपोवनमगाद् योऽसौ वन्दयैनं महर्द्धिकम् ॥ ३॥ सप्तरत्नानि राज्यं च महैश्वर्यपदं
    वरम् । हित्वा प्रव्रजितो योऽसौ तं दर्शय जगद्गुरुम् ॥ ४॥ मायाख्यायाः पितामह्या योऽजनद्दक्षकुक्षितः
    । लुम्बिन्यामुदयात् सूर्य इव तं पितरं नम ॥ ५॥ अभयायाः कुलेश्वर्या येन पादाम्बुजे नतम् । त्रैधातुकाधिपं
    देवं पितरं त्वं सदा नम ॥ ६॥ विश्वामित्रमुपाध्यायं योऽयोजयत् सुसंवरे । बालक्रीडाभिरक्तात्मा तातमेनं
    सदा नम ॥ ७॥ जम्बूतरुसमासीनं पञ्चर्षयो हतत्विषः । निर्मानिनः प्राभजन् यमेनं तातं सदा नम ॥ ८॥ पितरं
    बोधयित्वा योऽत्याजयत्तु षडंशकम् । दयाकरं जगद्वन्द्यं जनकं प्रणमात्मज ॥ ९॥ योऽजयद्देवदत्तादीन् मानिनः
    सर्ववित् सुधीः । सर्वफलादिदं विज्ञं सुधियं जनकं भज ॥ १०॥ यात्रायामातुरं जीर्णं मृतं दृष्टिविवर्जितम्
    । स्वयं विज्ञोऽपि पप्रच्छ सदा तं जनकं भज ॥ ११॥ कामाग्निर्नाहरद्यस्य चित्तं प्रमदवासिनः । निरञ्जनं
    निर्विकल्पं सुत तं जनकं भज ॥ १२॥ कनकाश्वं समारुह्य छन्दकेन बहिर्ययौ । देशान्निशीथे त्रिदशैः स्तूयमानं
    मुदा भज ॥ १३॥ हयं निवर्तयामास छन्दकं च तपोवनात् । सुकण्ठाभरणं दत्त्वा भणैनं वनचारिणम् ॥ १४॥ नैरञ्जनामुपासृत्य
    प्राकरोद् यस्तपोव्रतम् । जगद्धितार्थं षड्वर्षमेनं भज तपःपरम् ॥ १५॥ बोधिद्रुमसमासीनो जित्वा मारं सुदुःसहम्
    । प्रालभद्बोधिरत्नं यो दर्शयैनं तथागतम् ॥ १६॥ मृगदावस्थितः काश्यां धर्मचर्क्र प्रवर्तयन् । ब्रह्मादिभिर्वृतो
    योऽसौ दर्शयैनं गुरुं सुत ॥ १७॥ इति मात्रोदितं श्रुत्वा राहुलः सोऽतिविस्मितः । प्रणम्य पितरं पश्यन्
    मुदमाप स्मिताननः ॥ १८॥ इति श्रीशाक्यसिंहस्तोत्रं यशोधराकृतं सम्पूर्णम् ॥
