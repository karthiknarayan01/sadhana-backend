id: advaitashatakam-3
category: stotram
name:
  english: advaitashatakam
  devanagari: अद्वैतशतकम्
content:
  english: statra tatra dridham bhavet ||56|| lokeshu vartamananam pumsam tena ca hetuna | deham vinapyahankaro
    vartate vasanavashat ||57|| vrikshabije yatha vriksho sthitashshakhadisamyutah | tathahami sthito
    deho hastapadadisamyutah ||58|| tasmad garbhasthitim kurvan jibo'vidyadisamyutah | ahankaravashadeva
    deha eva prajayate ||59|| dehi sampurnadeho'sau janmantarashubhashubhat | punargarbhagrihad gatva
    murcchamapa suvismitam ||60|| evam dehatraye kurvan sthitim dehi paribhraman | jivatmetucyate sadbhih
    sarvavedantaparagaih ||61|| evam samsaratah pumsah svenarjitashubhashubhat | deshikalokanadeva vairagyam
    jayate hridi ||62|| evam vairagyayuktasya pumso hridi nirantaram | avirbabhuva shuddhatma vicarassoyamidrishah
    ||63|| dhanena duhkharopena durlabhenatmamrityuna | pumsam ka pritirevasyat paparupena sarvada ||64||
    kim me gehena kim bhogaih kim dhanairdhanadairapi | kim mitrabandhavaih karyam sarva kalavashadasat
    ||65|| kim striya paparupinya kim putrairbhandahetukaih | mrityuna grihyamanasya taih kim karyam kshane
    kshane ||66|| atita bahavah putrah dara janmani janmani | prarabdhakarmabhoktrinam pumsam kimiha taih
    phalam ||67|| bhaveshvaratiyuktasya pumsassatyarthabhashinah | ko'ham kathamidanceti cinta syat suvhisharada
    ||68|| sa cinta deshikam vipram vedashastragamanvitam | brahmajnanavatam pumsam varam ghatayati kshanat
    ||69|| shaktipatapavitro'yam jivatma guruvigraham | drishtva paravasho bhutva natincakai punah punah
    ||70|| natva devam mahatmanam deshikam karunamayam | svasvarupam parijnatum pranjalistamabhashata
    ||71|| svarupam paramanandam jnatubhicchami deshika | samsarabdhititirshunam karnadharo'si dehinam
    ||72|| iti prishto viraktena shishyena paramarthavit | svasvarupam pam dhyayan deshikastamabhashata
    ||73|| yamashritya pravartante janassarve nirantaram | svarupamiti tam vidyat karanaishcakshuradibhih
    ||74|| jagrat
  devanagari: स्तत्र तत्र दृढं भवेत् ॥५६॥ लोकेषु वर्तमानानां पुंसां तेन च हेतुना । देहं विनाप्यहङ्कारो
    वर्तते वासनावशात् ॥५७॥ वृक्षबीजे यथा वृक्षो स्थितश्शाखादिसंयुतः । तथाहमि स्थितो देहो हस्तपादादिसंयुतः
    ॥५८॥ तस्माद् गर्भस्थितिं कुर्वन् जीबोऽविद्यादिसंयुतः । अहङ्कारवशादेव देह एव प्रजायते ॥५९॥ देहि सम्पूर्णदेहोऽसौ
    जन्मान्तरशुभाशुभात् । पुनर्गर्भगृहाद् गत्वा मूर्च्छामाप सुविस्मिताम् ॥६०॥ एवं देहत्रये कुर्वन् स्थितिं
    देहि परिभ्रमन् । जीवात्मेतुच्यते सद्भिः सर्ववेदान्तपारगैः ॥६१॥ एवं संसरतः पुंसः स्वेनार्जितशुभाशुभात्
    । देशिकालोकनादेव वैराग्यं जायते हृदि ॥६२॥ एवं वैराग्ययुक्तस्य पुंसो हृदि निरन्तरम् । आविर्बभूव शुद्धात्मा
    विचारस्सोयमीदृशः ॥६३॥ धनेन दुःखरोपेण दुर्लभेनात्ममृत्युना । पुंसां का प्रीतिरेवस्यात् पापरूपेण सर्वदा
    ॥६४॥ किं मे गेहेन किं भोगैः किं धनईर्धनदैरपि । किं मित्रबान्धवईः कार्यं सर्व कालवशादसत् ॥६५॥ किं स्त्रिया
    पापरूपिण्या किं पुत्रैर्भन्दहेतुकैः । मृत्युना गृह्यमाणस्य तैः किं कार्यं क्षणे क्षणे ॥६६॥ अतीता बहवः
    पुत्राः दारा जन्मनि जन्मनि । प्रारब्धकर्मभोक्तृणां पुंसां किमिह तैः फलम् ॥६७॥ भावेष्वरतियुक्तस्य पुंसस्सत्यार्थभाषिणः
    । कोऽहं कथमिदञ्चेति चिन्ता स्यात् सुव्हिशारदा ॥६८॥ सा चिन्ता देशिकं विप्रं वेदशास्त्रागमान्वितम् ।
    ब्रह्मज्ञानवतां पुंसां वरं घटयति क्षणात् ॥६९॥ शक्तिपातपवित्रोऽयं जीवात्मा गुरुविग्रहम् । दृष्ट्वा
    परवशो भूत्वा नतिञ्चकै पुनः पुनः ॥७०॥ नत्वा देवं महात्मानं देशिकं करुणामयम् । स्वस्वरूपं परिज्ञातुं
    प्राञ्जलिस्तमभाषत ॥७१॥ स्वरूपं परमानन्दं ज्ञातुभिच्छामि देशिक । संसाराब्धितितीर्षूणां कर्णधारोऽसि
    देहिनाम् ॥७२॥ इति पृष्टो विरक्तेन शिष्येण परमार्थवित् । स्वस्वरूपं पां ध्यायन् देशिकस्तमभाषत ॥७३॥
    यमाश्रित्य प्रवर्तन्ते जनास्सर्वे निरन्तरम् । स्वरूपमिति तं विद्यात् करणैश्चक्षुरादिभिः ॥७४॥ जाग्रत्
