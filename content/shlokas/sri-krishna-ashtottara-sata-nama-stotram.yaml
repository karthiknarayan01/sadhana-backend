id: sri-krishna-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Sri Krishna Ashtottara Sata Nama Stotram
content:
  english: shrigopalakrishnaya namah || shrishesha uvaca || om asya shrikrishnashtottarashatanamastotrasya|
    shrishesha rishih || anushtup chandah || shrikrishnodevata || shrikrishnashtottarashatanamajape viniyogah
    || om shrikrishnah kamalanatho vasudevah sanatanah | vasudevatmajah punyo lilamanushavigrahah || ||
    shrivatsakaustubhadharo yashodavatsalo harih | caturbhujattacakrasigada shankhadyudayudhah || || devakinandanah
    shrisho nandagopapriyatmajah | yamunavegasamhari balabhadrapriyanujah || || putanajivitaharah shakatasurabhanjanah
    | nandavrajajananandi saccidanandavigrahah || || navanitaviliptango navanitanato'naghah | navanitanavaharo
    mucukundaprasadakah || || shodashastri sahasresha sribhangi madhurakritih | shukavagamritabdhindurgovindo
    govidampatih || || vatsavatacaro'nanto dhenukasurabhanjanah | trinikritatrinavarto yamalarjunabhanjanah
    || || uttanatalabhetta ca tamalashyamalakritih | gopagopishvaro yogi suryakotisamaprabhah || || ilapatih
    paranjyotiryadavendro yadudvahah | vanamali pitavasah parijatapaharakah || || govardhanacaloddharta
    gopalah sarvapalakah | ajo niranjanah kamajanakah kanjalocanah || || madhuha mathuranatho dvarakanayako
    bali | vrindavanantasancari tulasidamabhushanah || || shyamantakamanerharta naranarayanatmakah | kubjakrishnambaradharo
    mayi paramapurushah || || mushtikasuracanuramahayuddhavisharadah | samsaravairi kamsarirmurarirnarakantakah
    || || anadibrahmacari ca krishnavyasanakarshakah | shishupalashirashchetta duryodhanakulantakah ||
    || vidurakruravarado vishvarupapradarshakah | satyavak satyasankalpah satyabhamarato jayi || || subhadrapurvajo
    vishnurbhishmamuktipradayakah | jagadgururjagannatho venunadavisharadah || || vrishabhasuravidhvamsi
    banasurabalantakah | yudhishthirapratishthata barhibarhavatamsakah || || parthasarathiravyakto gitamritamahodadhih
    | kaliyaphanimanikyaranjitashripadambujah || || damodaro yajnabhokta danavendravinashakah | narayanah
    parambrahma pannagashanavahanah || || jalakridasamasakta gopivastrapaharakah | punyashlokastirthapado
    vedavedyo dayanidhih || || sarvatirthatmakah sarvagraharupi paratparah | evam shrikrishnadevasya namnamashtottaram
    shatam || || krishnanamamritam nama paramanandakarakam | atyupadravadoshaghnam paramayushyavardhanam
    || || || iti shrinaradapancaratre jnanamritasare caturtharatre umamaheshvarasamvade dharanisheshasamvade
    shrikrishnashtottarashatanamastotram sampurnam ||
  devanagari: श्रीगोपालकृष्णाय नमः ॥ श्रीशेष उवाच ॥ ॐ अस्य श्रीकृष्णाष्टोत्तरशतनामस्तोत्रस्य। श्रीशेष
    ऋषिः ॥ अनुष्टुप् छन्दः ॥ श्रीकृष्णोदेवता ॥ श्रीकृष्णाष्टोत्तरशतनामजपे विनियोगः ॥ ॐ श्रीकृष्णः कमलानाथो
    वासुदेवः सनातनः । वसुदेवात्मजः पुण्यो लीलामानुषविग्रहः ॥ ॥ श्रीवत्सकौस्तुभधरो यशोदावत्सलो हरिः । चतुर्भुजात्तचक्रासिगदा
    शङ्खाद्युदायुधः ॥ ॥ देवकीनन्दनः श्रीशो नन्दगोपप्रियात्मजः । यमुनावेगसंहारी बलभद्रप्रियानुजः ॥ ॥ पूतनाजीवितहरः
    शकटासुरभञ्जनः । नन्दव्रजजनानन्दी सच्चिदानन्दविग्रहः ॥ ॥ नवनीतविलिप्ताङ्गो नवनीतनटोऽनघः । नवनीतनवाहारो
    मुचुकुन्दप्रसादकः ॥ ॥ षोडशस्त्री सहस्रेश स्रिभङ्गि मधुराकृतिः । शुकवागमृताब्धीन्दुर्गोविन्दो गोविदाम्पतिः
    ॥ ॥ वत्सवाटचरोऽनन्तो धेनुकासुरभञ्जनः । तृणीकृततृणावर्तो यमलार्जुनभञ्जनः ॥ ॥ उत्तानतालभेत्ता च तमालश्यामलाकृतिः
    । गोपगोपीश्वरो योगी सूर्यकोटिसमप्रभः ॥ ॥ इलापतिः परञ्ज्योतिर्यादवेन्द्रो यदूद्वहः । वनमाली पीतवासाः
    पारिजातापहारकः ॥ ॥ गोवर्धनाचलोद्धर्ता गोपालः सर्वपालकः । अजो निरञ्जनः कामजनकः कञ्जलोचनः ॥ ॥ मधुहा
    मथुरानाथो द्वारकानायको बली । वृन्दावनान्तसञ्चारी तुलसीदामभूषणः ॥ ॥ श्यमन्तकमणेर्हर्ता नरनारायणात्मकः
    । कुब्जाकृष्णाम्बरधरो मायी परमपूरुषः ॥ ॥ मुष्टिकासुरचाणूरमहायुद्धविशारदः । संसारवैरी कंसारिर्मुरारिर्नरकान्तकः
    ॥ ॥ अनादिब्रह्मचारी च कृष्णाव्यसनकर्षकः । शिशुपालशिरश्छेत्ता दुर्योधनकुलान्तकः ॥ ॥ विदुराक्रूरवरदो
    विश्वरूपप्रदर्शकः । सत्यवाक् सत्यसङ्कल्पः सत्यभामारतो जयी ॥ ॥ सुभद्रापूर्वजो विष्णुर्भीष्ममुक्तिप्रदायकः
    । जगद्गुरुर्जगन्नाथो वेणुनादविशारदः ॥ ॥ वृषभासुरविध्वंसी बाणासुरबलान्तकः । युधिष्ठिरप्रतिष्ठाता बर्हिबर्हावतंसकः
    ॥ ॥ पार्थसारथिरव्यक्तो गीतामृतमहोदधिः । कालीयफणिमाणिक्यरञ्जितश्रीपदाम्बुजः ॥ ॥ दामोदरो यज्ञभोक्ता
    दानवेन्द्रविनाशकः । नारायणः परम्ब्रह्म पन्नगाशनवाहनः ॥ ॥ जलक्रीडासमासक्त गोपीवस्त्रापहारकः । पुण्यश्लोकस्तीर्थपादो
    वेदवेद्यो दयानिधिः ॥ ॥ सर्वतीर्थात्मकः सर्वग्रहरुपी परात्परः । एवं श्रीकृष्णदेवस्य नाम्नामष्टोत्तरं
    शतम् ॥ ॥ कृष्णनामामृतं नाम परमानन्दकारकम् । अत्युपद्रवदोषघ्नं परमायुष्यवर्धनम् ॥ ॥ ॥ इति श्रीनारदपञ्चरात्रे
    ज्ञानामृतसारे चतुर्थरात्रे उमामहेश्वरसंवादे धरणीशेषसंवादे श्रीकृष्णाष्टोत्तरशतनामस्तोत्रं सम्पूर्णम्
    ॥
