id: carnatic-music-svarajathi-1-rara-venu-gopa-bala
category: stotram
name:
  english: Carnatic Music Svarajathi 1 (Rara Venu Gopa Bala)
content:
  english: dhira shankarabharanam janyaraga caturasra jati triputa patnam subrahmanya ayyar bhasha tèlugu
    sahityam pallavi rara venu gopabala rajita sadguna jayashila anupallavi sarasaksha neramemi marubadha
    korvalera caranam nandagopala ne nèndu pojala ni vindu rara sadamalamadito mudamalaraga nakèduruga
    gadiyara palumarunu garavamuna nin pilacina palukavu nalugakura karivarada marimari na yadharamu grolara
    kanikaramuga ra nagadhara ra murahara ra bhavahara ravera i maguvanu i lalalanu i sògasini cekora
    korikalimpònda dèndamu niyandu cerènu ni cèn ta maruvakura karamulace marimari ninu sharananèdara
    da pa | ma ga ri sa | ri sa ni | ga pa ma ga | ri sa ri ga || mu da ma la | ra ga na | kè du ru ga
    | ga di ya ra || | ga pa ma ga | ma ga ri sa | ri ga ri sa | sa || pi la ci na | pa lu ka vu | na
    lu ga ku | ra ni da | pa ma ga ri || ya dha ra mu | gro | la ra ka ni | ka ra mu ga || ni | da pa
    ma ga | ri sa ri ga || ce | ma ri ma ri | ni nu sha ra | na nè da ra ||
  devanagari: धीर शङ्कराभरणं जन्यराग चतुरस्र जाति त्रिपुट पट्नं सुब्रह्मण्य अय्यर् भाषा तॆलुगु साहित्यम्
    पल्लवि रार वेणु गोपबाल राजित सद्गुण जयशील अनुपल्लवि सारसाक्ष नेरमेमि मरुबाध कोर्वलेरा चरणं नन्दगोपाला
    ने नॆन्दु पोजाला नी विन्दु रारा सदमलमदितो मुदमलरग नाकॆदुरुग गदियरा पलुमारुनु गारवमुन निन् पिलचिन पलुकवु
    नलुगकुरा करिवरद मरिमरि ना यधरमु ग्रोलरा कनिकरमुग रा नगधर रा मुरहर रा भवहर रावेरा ई मगुवनु ई लललनु
    ई सॊगसिनि चेकोरा कोरिकलिम्पॊन्द डॆन्दमु नीयन्दु चेरॆनु नी चॆन् त मरुवकुरा करमुलचे मरिमरि निनु शरणनॆदर
    द प । म ग रि स । रि स नि । ग प म ग । रि स रि ग ॥ मु द म ल । र ग ना । कॆ दु रु ग । ग दि य रा ॥ । ग
    प म ग । म ग रि स । रि ग रि स । स ॥ पि ल चि न । प लु क वु । न लु ग कु । रा नि द । प म ग रि ॥ य ध र
    मु । ग्रो । ल रा क नि । क र मु ग ॥ नि । द प म ग । रि स रि ग ॥ चे । म रि म रि । नि नु श र । ण नॆ द
    र ॥
