id: gayatri-ramayana
category: stotram
name:
  english: gayatri ramayana
  devanagari: गायत्री रामायण
content:
  english: 001|| 24|| idam ramayanam kritsnam gayatribijasamyutam | trisandhyam yah pathennityam sarvapapaih
    pramucyate || iti gayatriramayanam sampurnam |
  devanagari: ००१॥ २४॥ इदं रामायणं कृत्स्नं गायत्रीबीजसंयुतम् । त्रिसन्ध्यं यः पठेन्नित्यं सर्वपापैः प्रमुच्यते
    ॥ इति गायत्रीरामायणं सम्पूर्णम् ।
meaning: {}
