id: shriramasamarthyanirupanam
category: stotram
name:
  english: shriramasamarthyanirupanam
  devanagari: श्रीरामसामर्थ्यनिरूपणम्
content:
  english: siddheshu kinnarendreshu patattrishu ca sarvatah | sarvatra sarvabhuteshu sarvakaleshu nasti
    sah || 41|| yo ramam pratiyudhyeta vishnutulyaparakramam | arthah
  devanagari: सिद्धेषु किन्नरेन्द्रेषु पतत्त्रिषु च सर्वतः । सर्वत्र सर्वभूतेषु सर्वकालेषु नास्ति सः ॥
    ४१॥ यो रामं प्रतियुध्येत विष्णुतुल्यपराक्रमम् । अर्थः
meaning: {}
