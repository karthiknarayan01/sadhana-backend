id: n-isimhamalamantra
category: mantra
name:
  english: nṟisimhamalamantra
  devanagari: न्ऱिसिंहमालामन्त्र
content:
  english: pavananrisimhaya pashcimadisham bandha bandha darunanrisimhaya uttaradisham bandha bandha jvalanrisimhaya
    akashadisham bandha bandha lakshminrisimhaya pataladisham bandha bandha kah kah kampaya kampaya aveshaya
    aveshaya avataraya avataraya shighram shighram || om namo narasimhaya navakotidevagrahoccatanaya |
    om namo narasimhaya ashtakotigandharvagrahoccatanaya | om namo narasimhaya saptakotikinnaragrahoccatanaya
    | om namo narasimhaya shatkotishakinigrahoccatanaya | om namo narasimhaya pancakotipannagagrahoccatanaya
    | om namo narasimhaya catushkotibrahmarakshasagrahoccatanaya | om namo narasimhaya dvikotidanujagrahoccatanaya
    | om namo narasimhaya ekakotigrahoccatanaya | om namo narasimhaya arimuricorarakshasajitih varam varam
    | shribhaya corabhaya vyadhibhaya sakalabhayakantakan vidhvamsaya vidhvamsaya | sharanagata vajrapanjaraya
    vishvahridayaya prahladavaradaya kshraum shrim nrisimhaya svaha | om namo narasimhaya mudgalashankhacakragadapadmahastaya
    nilaprabhangavarnaya bhimaya bhishanaya jvalakaralabhayabhashita shrinrisimhahiranyakashipuvakshasthalavidaranaya
    jaya jaya ehi ehi bhagavan bhagavan garudadhvaja garudadhvaja mama sarvopadravam vajradehena curnaya
    curnaya apatsamudram shoshaya shoshaya | asuragandharvayakshabrahmarakshasabhutapretapishacadin vidhvamsaya
    vidhvamsaya | purvakhilam mulaya mulaya | praticcham stambhaya paramantra parayantra paratantra parakashtam
    chindi chindi bhindi bhindi hum phat svaha | iti shriatharvanavedokta nrisimhamalamantrah samaptah
    || shrinrisimharpanamastu || shrilakshminrisimhamalamantrah
  devanagari: पावननृसिंहाय पश्चिमदिशां बन्ध बन्ध दारुणनृसिंहाय उत्तरदिशां बन्ध बन्ध ज्वालानृसिंहाय आकाशदिशां
    बन्ध बन्ध लक्ष्मीनृसिंहाय पातालदिशां बन्ध बन्ध कः कः कम्पय कम्पय आवेशय आवेशय अवतारय अवतारय शीघ्रं
    शीघ्रम् ॥ ॐ नमो नारसिंहाय नवकोटिदेवग्रहोच्चाटनाय । ॐ नमो नारसिंहाय अष्टकोटिगन्धर्वग्रहोच्चाटनाय ।
    ॐ नमो नारसिंहाय सप्तकोटिकिन्नरग्रहोच्चाटनाय । ॐ नमो नारसिंहाय षट्कोटिशाकिनीग्रहोच्चाटनाय । ॐ नमो नारसिंहाय
    पञ्चकोटिपन्नगग्रहोच्चाटनाय । ॐ नमो नारसिंहाय चतुष्कोटिब्रह्मराक्षसग्रहोच्चाटनाय । ॐ नमो नारसिंहाय
    द्विकोटिदनुजग्रहोच्चाटनाय । ॐ नमो नारसिंहाय एककोटिग्रहोच्चाटनाय । ॐ नमो नारसिंहाय अरिमुरिचोरराक्षसजितिः
    वारं वारम् । श्रीभय चोरभय व्याधिभय सकलभयकण्टकान् विध्वंसय विध्वंसय । शरणागत वज्रपञ्जराय विश्वहृदयाय
    प्रह्लादवरदाय क्ष्रौं श्रीं नृसिंहाय स्वाहा । ॐ नमो नारसिंहाय मुद्गलशङ्खचक्रगदापद्महस्ताय नीलप्रभाङ्गवर्णाय
    भीमाय भीषणाय ज्वालाकरालभयभाषित श्रीनृसिंहहिरण्यकशिपुवक्षस्थलविदारणाय जय जय एहि एहि भगवन् भगवन् गरुडध्वज
    गरुडध्वज मम सर्वोपद्रवं वज्रदेहेन चूर्णय चूर्णय आपत्समुद्रं शोषय शोषय । असुरगन्धर्वयक्षब्रह्मराक्षसभूतप्रेतपिशाचादीन्
    विध्वंसय विध्वंसय । पूर्वाखिलं मूलय मूलय । प्रतिच्छां स्तम्भय परमन्त्र परयन्त्र परतन्त्र परकष्टं छिन्दि
    छिन्दि भिन्दि भिन्दि हुं फट् स्वाहा । इति श्रीअथर्वणवेदोक्त नृसिंहमालामन्त्रः समाप्तः ॥ श्रीनृसिंहार्पणमस्तु
    ॥ श्रीलक्ष्मीनृसिंहमालामन्त्रः
