id: vishnukritam1shivastotram
category: stotram
name:
  english: vishnukritam1shivastotram
  devanagari: विष्णुकृतं१शिवस्तोत्रम्
content:
  english: vishnukritam 1 shivastotram vishnuruvaca | om vedavedyaya devaya tasmai shuddhaprabhacintyarupaya
    kasmai | brahmadyadhishaya srishtyadikartre vishnupriyayartihantre'ntakartre || 79
  devanagari: विष्णुकृतं १ शिवस्तोत्रम् विष्णुरुवाच । ॐ वेदवेद्याय देवाय तस्मै शुद्धप्रभाचिन्त्यरूपाय
    कस्मै । ब्रह्माद्यधीशाय सृष्ट्यादिकर्त्रे विष्णुप्रियायार्तिहन्त्रेऽन्तकर्त्रे ॥ ७९
meaning: {}
