id: dattatreyavajrakavacam
category: kavacha
name:
  english: dattatreyavajrakavacam
  devanagari: दत्तात्रेयवज्रकवचम्
content:
  english: atha karanyasah | om dram angushthabhyam namah | om drim tarjanibhyam namah | om drum madhyamabhyam
    namah | om draim anamikabhyam namah | om draum kanishthikabhyam namah | om drah karatalakaraprishthabhyam
    namah || atha hridayadinyasah | om dram hridayaya namah | om drim shirase svaha | om drum shikhayai
    vashat | om draim kavacaya hum | om draum netratrayaya vaushat | om drah astraya phat | om bhurbhuvahsvaromiti
    digbandhah || etanme vajrakavacam yah pathecchrinuyadapi | vajrakayashciranjivi dattatreyo'hamabruvam
    || 23|| tyagi bhogi mahayogi sukhaduhkhavivarjitah | sarvatrasiddhasankalpo jivanmukto'dya vartate
    || 24|| ityuktvantardadhe yogi dattatreyo digambarah | daladano'pi tajjaptva jivanmuktah sa vartate
    || 25|| bhillo durashrava nama tadanim shrutavadinam | sakricchravanamatrena vajrango'bhavadapyasau
    || 26|| ityetadvajrakavacam dattatreyasya yoginah | shrutvashesham shambhumukhat punarapyaha parvati
    || 27|| parvatyuvaca | etatkavacamahatmyam vada vistarato mama | kutra kena kada japyam kim yajapyam
    katham katham || 28|| uvaca shambhustatsarvam parvatya vinayoditam | shrishiva uvaca | shrunu parvati
    vakshyami samahitamanavilam || 29|| dharmarthakamamokshanamidameva parayanam | hastyashvarathapadatisarvaishvaryapradayakam
    || 30|| putramitrakalatradisarvasantoshasadhanam | vedashastradividyanam nidhanam paramam hi tat ||
    31|| sangitashastrasahityasatkavitvavidhayakam | buddhividyasmritiprajnamatipraudhipradayakam || 32||
    sarvasantoshakaranam sarvaduhkhanivaranam | shatru samharakam shighram yashahkirtivivardhanam || 33||
    ashtasamkhya maharogah sannipatastrayodasha | shannavatyakshirogashca vimshatirmeharogakah || 34||
    ashtadasha tu kushthani gulmanyashtavidhanyapi | ashitirvatarogashca catvarishattu paittikah || 35||
    vimshatishleshmarogashca kshayacaturthikadayah | mantrayantrakuyogadyah kalpatantradinirmitah || 36||
    brahmarakshasavetalakushmandadigrahodbhavah | sangajah deshakalasthastapatrayasamutthitah || 37||
    navagrahasamudbhuta mahapatakasambhavah | sarve rogah pranashyanti sahasravartanaddhruvam || 38||
    ayutavrittimatrena vandhya putravati bhavet | ayutadvitayavrittya hyapamrityujayo bhavet || 39|| ayutatritayaccaiva
    khecaratvam prajayate | sahasradayutadarvak sarvakaryani sadhayet || 40|| lakshavritya karyasiddhirbhavetyeva
    na samshayah || 41|| vishavrikshasya muleshu tishthan vai dakshinamukhah | kurute masamatrena vairinam
    vikalendriyam || 42|| audumbaratarormule vriddhikamena japyate | shrivakshamule shrikami tintini shantikarmani
    || 43|| ojaskamo'shvatthamule strikamaih sahakarake | jnanarthi tulasimule garbhagehe sutarthibhih
    || 44|| dhanarthibhistu sukshetre pashukamaistu goshthake | devalaye sarvakamaistatkale sarvadarshitam
    || 45|| nabhimatrajale sthitva bhanumalokya yo japet | yuddhe va shastravade va sahasrena jayo bhavet
    || 46|| kanthamatre jale sthitva yo ratrau kavacam pathet | jvarapasmarakushthaditapajvaranivaranam
    || 47|| yatra yatsyatsthiram yadyatprasannam tannivartate | tena tatra hi japtavyam tatah siddhirbhaveddhruvam
    || 48|| ityuktvan ca shivo gaurye rahasyam paramam shubham | yah pathet vajrakavacam dattatreyosamo
    bhavet || 49|| evam shivena kathitam himavatsutayai proktam daladamunaye'trisutenapurvam | yah ko'pi
    vajrakavacam pathatiha loke dattopamashcarati yogivarashcirayuh || 50|| || iti shrirudrayamale himavatkhande
    mantrashastre upasanakhande shivavijayasiddhante umamaheshvarasamvade shridattatreyavajrakavacastotram
    sampurnam || || shridattatreyarpanamastu |
  devanagari: अथ करन्यासः । ॐ द्रां अङ्गुष्ठाभ्यां नमः । ॐ द्रीं तर्जनीभ्यां नमः । ॐ द्रूं मध्यमाभ्यां
    नमः । ॐ द्रैं अनामिकाभ्यां नमः । ॐ द्रौं कनिष्ठिकाभ्यां नमः । ॐ द्रः करतलकरपृष्ठाभ्यां नमः ॥ अथ हृदयादिन्यासः
    । ॐ द्रां हृदयाय नमः । ॐ द्रीं शिरसे स्वाहा । ॐ द्रूं शिखायै वषट् । ॐ द्रैं कवचाय हुं । ॐ द्रौं नेत्रत्रयाय
    वौषट् । ॐ द्रः अस्त्राय फट् । ॐ भूर्भुवःस्वरोमिति दिग्बन्धः ॥ एतन्मे वज्रकवचं यः पठेच्छृणुयादपि ।
    वज्रकायश्चिरञ्जीवी दत्तात्रेयोऽहमब्रुवम् ॥ २३॥ त्यागी भोगी महायोगी सुखदुःखविवर्जितः । सर्वत्रसिद्धसङ्कल्पो
    जीवन्मुक्तोऽद्य वर्तते ॥ २४॥ इत्युक्त्वान्तर्दधे योगी दत्तात्रेयो दिगम्बरः । दलादनोऽपि तज्जप्त्वा
    जीवन्मुक्तः स वर्तते ॥ २५॥ भिल्लो दूरश्रवा नाम तदानीं श्रुतवादिनम् । सकृच्छ्रवणमात्रेण वज्राङ्गोऽभवदप्यसौ
    ॥ २६॥ इत्येतद्वज्रकवचं दत्तात्रेयस्य योगिनः । श्रुत्वाशेषं शम्भुमुखात् पुनरप्याह पार्वती ॥ २७॥ पार्वत्युवाच
    । एतत्कवचमाहात्म्यं वद विस्तरतो मम । कुत्र केन कदा जाप्यं किं यजाप्यं कथं कथम् ॥ २८॥ उवाच शम्भुस्तत्सर्वं
    पार्वत्या विनयोदितम् । श्रीशिव उवाच । श्रुणु पार्वति वक्ष्यामि समाहितमनाविलम् ॥ २९॥ धर्मार्थकाममोक्षाणामिदमेव
    परायणम् । हस्त्यश्वरथपादातिसर्वैश्वर्यप्रदायकम् ॥ ३०॥ पुत्रमित्रकलत्रादिसर्वसन्तोषसाधनम् । वेदशास्त्रादिविद्यानां
    निधानं परमं हि तत् ॥ ३१॥ सङ्गीतशास्त्रसाहित्यसत्कवित्वविधायकम् । बुद्धिविद्यास्मृतिप्रज्ञामतिप्रौढिप्रदायकम्
    ॥ ३२॥ सर्वसन्तोषकरणं सर्वदुःखनिवारणम् । शत्रु संहारकं शीघ्रं यशःकीर्तिविवर्धनम् ॥ ३३॥ अष्टसंख्या महारोगाः
    सन्निपातास्त्रयोदश । षण्णवत्यक्षिरोगाश्च विंशतिर्मेहरोगकाः ॥ ३४॥ अष्टादश तु कुष्ठानि गुल्मान्यष्टविधान्यपि
    । अशीतिर्वातरोगाश्च चत्वारिशत्तु पैत्तिकाः ॥ ३५॥ विंशतिश्लेष्मरोगाश्च क्षयचातुर्थिकादयः । मन्त्रयन्त्रकुयोगाद्याः
    कल्पतन्त्रादिनिर्मिताः ॥ ३६॥ ब्रह्मराक्षसवेतालकूष्माण्डादिग्रहोद्भवाः । सङ्गजाः देशकालस्थास्तापत्रयसमुत्थिताः
    ॥ ३७॥ नवग्रहसमुद्भूता महापातकसम्भवाः । सर्वे रोगाः प्रणश्यन्ति सहस्रावर्तनाद्ध्रुवम् ॥ ३८॥ अयुतावृत्तिमात्रेण
    वन्ध्या पुत्रवती भवेत् । अयुतद्वितयावृत्त्या ह्यपमृत्युजयो भवेत् ॥ ३९॥ अयुतत्रितयाच्चैव खेचरत्वं प्रजायते
    । सहस्रादयुतादर्वाक् सर्वकार्याणि साधयेत् ॥ ४०॥ लक्षावृत्या कार्यसिद्धिर्भवेत्येव न संशयः ॥ ४१॥ विषवृक्षस्य
    मूलेषु तिष्ठन् वै दक्षिणामुखः । कुरुते मासमात्रेण वैरिणं विकलेन्द्रियम् ॥ ४२॥ औदुम्बरतरोर्मूले वृद्धिकामेन
    जाप्यते । श्रीवक्षमूले श्रीकामी तिन्तिणी शान्तिकर्मणि ॥ ४३॥ ओजस्कामोऽश्वत्थमूले स्त्रीकामैः सहकारके
    । ज्ञानार्थी तुलसीमूले गर्भगेहे सुतार्थिभिः ॥ ४४॥ धनार्थिभिस्तु सुक्षेत्रे पशुकामैस्तु गोष्ठके । देवालये
    सर्वकामैस्तत्काले सर्वदर्शितम् ॥ ४५॥ नाभिमात्रजले स्थित्वा भानुमालोक्य यो जपेत् । युद्धे वा शास्त्रवादे
    वा सहस्रेण जयो भवेत् ॥ ४६॥ कण्ठमात्रे जले स्थित्वा यो रात्रौ कवचं पठेत् । ज्वरापस्मारकुष्ठादितापज्वरनिवारणम्
    ॥ ४७॥ यत्र यत्स्यात्स्थिरं यद्यत्प्रसन्नं तन्निवर्तते । तेन तत्र हि जप्तव्यं ततः सिद्धिर्भवेद्ध्रुवम्
    ॥ ४८॥ इत्युक्त्वान् च शिवो गौर्ये रहस्यं परमं शुभम् । यः पठेत् वज्रकवचं दत्तात्रेयोसमो भवेत् ॥ ४९॥
    एवं शिवेन कथितं हिमवत्सुतायै प्रोक्तं दलादमुनयेऽत्रिसुतेनपूर्वम् । यः कोऽपि वज्रकवचं पठतीह लोके दत्तोपमश्चरति
    योगिवरश्चिरायुः ॥ ५०॥ ॥ इति श्रीरुद्रयामले हिमवत्खण्डे मन्त्रशास्त्रे उपासनाखण्डे शिवविजयसिद्धान्ते
    उमामहेश्वरसंवादे श्रीदत्तात्रेयवज्रकवचस्तोत्रं सम्पूर्णम् ॥ ॥ श्रीदत्तात्रेयार्पणमस्तु ।
