id: shristava
category: stotram
name:
  english: shristava
  devanagari: श्रीस्तव
content:
  english: shrishristavah pancastavyam 5 shristavah shriganeshaya namah | svasti shrirdishatadasheshajagatam
    svargapavargasthitih svargam durgatimapavargikapadam sarvam ca kurvanharih | yasya vikshya mukham
    tadingitaparadhino vidhatte'khilam krideyam khalu nanyatha'sya rasada syadaikarasyattaya || 1|| he
    shrirdevi samastalokajanani tvam stotumihamahe yuktam bhavaya bharatim pragunaya premapradhanam dhiyam
    | bhaktim bandhaya nandayashritamimam dasam janam tavakam lakshyam lakshmi katakshavicivisriteste
    syama cami vayam || 2|| stotram nama kimamananti kavayo yadyanyadiyangunananyatra tvasato'dhiropya
    bhanitih sa tarhi vandhya tvayi | samyaksatyagunabhivarnanamatho bruyuh katham tadrishi vagvacaspatinapyashakyaracana
    tvatsadgunarnonidhau || 3|| ye vacam manasam ca durgrahataya khyata gunastavakastaneva prati sambujihvamudita
    yanmamika bharati | hasyam tattu na manmahe na hi cakoryeka'khilam candrikam nalam patumiti pragrihya
    rasanamasita satyam trishi || 4|| kshodiyanapi dushtabuddhirapi nihsneho'pyaniho'pi te kirtim devi
    lihannaham na ca bibhemyajno na jihremi ca | dushyetsa tu na tavata na hi shuna lidha'pi bhagirathi
    dushyeccapi na lajjate na ca bibhetyartistu shamyecchunah || 5|| aishvaryam mahadeva va'lpamathava
    drishyeta pumsam hi yattalakshmyah samudikshanattava yatah sarvatrikam vartate | tenaitena na vismayemahi
    jagannatho'pi narayano dhanyam manyata ikshanattava yatah svatmanamatmeshvarah || 6|| aishvaryam yadasheshapumsi
    yadidam saundaryalavanyayo rupam yacca hi mangalam kimapi yalloke sadityucyate | tatsarvam tvadadhinameva
    yadatah shrirityabhedena va yadva shrimaditidrishena vacasa devi prathamashnute || 7|| devi tvanmahimavadhirna
    harina napi tvaya jnayate yadyapyevamathapi naiva yuvayoh sarvajnata hiyate | yannastyeva tadajnatamanugunam
    sarvajnataya vidurvyomambhojamidantaya khalu vidan bhranto'yamityucyate || 8|| loke vanaspatibrihaspatitaratamyam
    yasyah katakshaparinamamudaharanti | sa bharati bhagavati tu yadiyadasi tam devadevamahishim shriyamashrayamah
    || 9|| yasyah katakshamriduvikshanadikshitena sadyah samullasitapallavamullalasa | vishvam viparyayasamutthaviparyayam
    tvam tam devadevamahishim shriyamashrayamah || 10|| || iti shri kuresha shrivatsamkamishracarya evam
    shri kuranatha shrivatsacinhamishra shristavah sampurnah ||
  devanagari: श्रीश्रीस्तवः पञ्चस्तव्यां ५ श्रीस्तवः श्रीगणेशाय नमः । स्वस्ति श्रीर्दिशतादशेषजगतां स्वर्गापवर्गस्थितीः
    स्वर्गं दुर्गतिमापवर्गिकपदं सर्वं च कुर्वन्हरिः । यस्या वीक्ष्य मुखं तदिङ्गितपराधीनो विधत्तेऽखिलं
    क्रीडेयं खलु नान्यथाऽस्य रसदा स्यादैकरस्यात्तया ॥ १॥ हे श्रीर्देवि समस्तलोकजननि त्वां स्तोतुमीहामहे
    युक्तां भावय भारतीं प्रगुणय प्रेमप्रधानां धियम् । भक्तिं बन्धय नन्दयाश्रितमिमं दासं जनं तावकं लक्ष्यं
    लक्ष्मि कटाक्षवीचिविसृतेस्ते स्याम चामी वयम् ॥ २॥ स्तोत्रं नाम किमामनन्ति कवयो यद्यन्यदीयान्गुणानन्यत्र
    त्वसतोऽधिरोप्य भणितिः सा तर्हि वन्ध्या त्वयि । सम्यक्सत्यगुणाभिवर्णनमथो ब्रूयुः कथं तादृशी वाग्वाचस्पतिनाप्यशक्यरचना
    त्वत्सद्गुणार्णोनिधौ ॥ ३॥ ये वाचां मनसां च दुर्ग्रहतया ख्याता गुणास्तावकास्तानेव प्रति साम्बुजिह्वमुदिता
    यन्मामिका भारती । हास्यं तत्तु न मन्महे न हि चकोर्येकाऽखिलां चन्द्रिकां नालं पातुमिति प्रगृह्य रसनामासीत
    सत्यां तृषि ॥ ४॥ क्षोदीयानपि दुष्टबुद्धिरपि निःस्नेहोऽप्यनीहोऽपि ते कीर्तिं देवि लिहन्नहं न च बिभेम्यज्ञो
    न जिह्रेमि च । दुष्येत्सा तु न तावता न हि शुना लीढाऽपि भागीरथी दुष्येच्चापि न लज्जते न च बिभेत्यार्तिस्तु
    शाम्येच्छुनः ॥ ५॥ ऐश्वर्यं महदेव वाऽल्पमथवा दृश्येत पुंसां हि यत्तलक्ष्म्याः समुदीक्षणात्तव यतः सार्वत्रिकं
    वर्तते । तेनैतेन न विस्मयेमहि जगन्नाथोऽपि नारायणो धन्यं मन्यत ईक्षणात्तव यतः स्वात्मानमात्मेश्वरः
    ॥ ६॥ ऐश्वर्यं यदशेषपुंसि यदिदं सौन्दर्यलावण्ययो रूपं यच्च हि मङ्गलं किमपि यल्लोके सदित्युच्यते । तत्सर्वं
    त्वदधीनमेव यदतः श्रीरित्यभेदेन वा यद्वा श्रीमदितीदृशेन वचसा देवि प्रथामश्नुते ॥ ७॥ देवि त्वन्महिमावधिर्न
    हरिणा नापि त्वया ज्ञायते यद्यप्येवमथापि नैव युवयोः सर्वज्ञता हीयते । यन्नास्त्येव तदज्ञतामनुगुणां
    सर्वज्ञताया विदुर्व्योमाम्भोजमिदन्तया खलु विदन् भ्रान्तोऽयमित्युच्यते ॥ ८॥ लोके वनस्पतिबृहस्पतितारतम्यं
    यस्याः कटाक्षपरिणाममुदाहरन्ति । सा भारती भगवती तु यदीयदासी तां देवदेवमहिषीं श्रियमाश्रयामः ॥ ९॥ यस्याः
    कटाक्षमृदुवीक्षणदीक्षितेन सद्यः समुल्लसितपल्लवमुल्ललास । विश्वं विपर्ययसमुत्थविपर्ययं त्वां तां देवदेवमहिषीं
    श्रियमाश्रयामः ॥ १०॥ ॥ इति श्री कुरेश श्रीवत्सांकमिश्राचार्य एवं श्री कुरनाथ श्रीवत्सचिन्हमिश्र श्रीस्तवः
    सम्पूर्णः ॥
