id: margabandhu-stotram
category: stotram
name:
  english: Margabandhu Stotram
  devanagari: मार्गबन्धुस्तोत्रम्
content:
  english: shiva shambho mahadeva devesha shambho phalavanamratkiritam phalanetrarcisha shulahataratikutam
    shuddhamardhenducudam bhaje margabandhum ange virajadbhujangam abhra kurangam siddhasamsevitanghrim
    bhaje margabandhum nityam cidanandarupam nihnutashesha capam krittivasam bhaje divyasanmargabandhum
    darpaghnamisham kalakantham mahesham mahavyomakesham kundabhadantam suresham kotisuryaprakasham bhaje
    margabandhum mandarabhuterudaram mandaragendrasaram mahagauryaduram pracaram sindhurajatidhiram bhaje
    margabandhum appayyayajvendragitam stotrarajam pathedyastu bhaktya prayane tasyarthasiddhim vidhatte
    margamadhye'bhayam ca''shutosho maheshah
  devanagari: शिव शम्भो महादेव देवेश शम्भो फालावनम्रत्किरीटं फालनेत्रार्चिषा शूलाहतारातिकूटं शुद्धमर्धेन्दुचूडं
    भजे मार्गबन्धुम् अङ्गे विराजद्भुजङ्गम् अभ्र कुरङ्गं सिद्धसंसेविताङ्घ्रिं भजे मार्गबन्धुम् नित्यं चिदानन्दरूपं
    निह्नुताशेष चापं कृत्तिवासं भजे दिव्यसन्मार्गबन्धुम् दर्पघ्नमीशं कालकण्ठं महेशं महाव्योमकेशम् कुन्दाभदन्तं
    सुरेशं कोटिसूर्यप्रकाशं भजे मार्गबन्धुम् मन्दारभूतेरुदारं मन्दरागेन्द्रसारं महागौर्यदूरम् प्रचारं
    सिन्धुराजातिधीरं भजे मार्गबन्धुम् अप्पय्ययज्वेन्द्रगीतं स्तोत्रराजं पठेद्यस्तु भक्त्या प्रयाणे तस्यार्थसिद्धिं
    विधत्ते मार्गमध्येऽभयं चाऽऽशुतोषो महेशः
meaning: {}
