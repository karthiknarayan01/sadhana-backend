id: devikritam1shivastotram
category: stotram
name:
  english: devikritam1shivastotram
  devanagari: देवीकृतं१शिवस्तोत्रम्
content:
  english: 40|| anantarupine tubhyam devadeva namo'stu te | namo vedarahasyaya namo vedaih stutaya ca
    || 41|| shmashanaratinityaya namo gaganacarine | jyeshthasamarahasyaya shatarudrapriyaya ca || 42||
    namo vrishakritankaya yajurvedadharaya ca | brahmandakotisamlagnamaline gaganatmane || 43|| manicitritakandaya
    namah sarvarthasiddhaye | namo vedasvarupaya dvijasiddhipriyaya ca || 44|| pumstrivikararupaya namashcandrarddhadharine
    | namo'gnaye sahomaya adityavarunaya ca || 45|| prithivyai cantarikshaya vayave dikshitaya ca | samyogaya
    viyogaya dhatre kartre'paharine || 46|| pradiptashulahastaya brahmadandadharaya ca | namah patinam
    pataye mahatam pataye namah || 47|| namah kalagnirudraya saptalokanivasine | tvam gatih sarvabhutanam
    bhutanam pataye namah || 48|| namaste bhagavan rudra namaste bhagavanchiva | namaste paratah shreshtha
    namaste paratah para || 49|| jihvacapalyabhavena khedito'si maya prabho | tatkshantavyam maheshana
    jnanadivya namo'stu te || 1
  devanagari: ४०॥ अनन्तरूपिणे तुभ्यं देवदेव नमोऽस्तु ते । नमो वेदरहस्याय नमो वेदैः स्तुताय च ॥ ४१॥ श्मशानरतिनित्याय
    नमो गगनचारिणे । ज्येष्ठसामरहस्याय शतरुद्रप्रियाय च ॥ ४२॥ नमो वृषकृताङ्काय यजुर्वेदधराय च । ब्रह्माण्डकोटिसंलग्नमालिने
    गगनात्मने ॥ ४३॥ मणिचित्रितकन्दाय नमः सर्वार्थसिद्धये । नमो वेदस्वरूपाय द्विजसिद्धिप्रियाय च ॥ ४४॥
    पुंस्त्रीविकाररूपाय नमश्चन्द्रार्द्धधारिणे । नमोऽग्नये सहोमाय आदित्यवरुणाय च ॥ ४५॥ पृथिव्यै चान्तरिक्षाय
    वायवे दीक्षिताय च । संयोगाय वियोगाय धात्रे कर्त्रेऽपहारिणे ॥ ४६॥ प्रदीप्तशूलहस्ताय ब्रह्मदण्डधराय
    च । नमः पतीनां पतये महतां पतये नमः ॥ ४७॥ नमः कालाग्निरुद्राय सप्तलोकनिवासिने । त्वं गतिः सर्वभूतानां
    भूतानां पतये नमः ॥ ४८॥ नमस्ते भगवन् रुद्र नमस्ते भगवञ्छिव । नमस्ते परतः श्रेष्ठ नमस्ते परतः पर ॥ ४९॥
    जिह्वाचापल्यभावेन खेदितोऽसि मया प्रभो । तत्क्षन्तव्यं महेशान ज्ञानदिव्य नमोऽस्तु ते ॥ १
meaning: {}
