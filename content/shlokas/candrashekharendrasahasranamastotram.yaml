id: candrashekharendrasahasranamastotram
category: sahasranama
name:
  english: candrashekharendrasahasranamastotram
  devanagari: चन्द्रशेखरेन्द्रसहस्रनामस्तोत्रम्
content:
  english: '|| 193|| mahaniyagunagramo jayendranyastapithadhuh | svahamsagamanavyaptabharato vibudhakritih
    || 194|| kadannatriptah kshamodaro mugdhatarananah | mahadhvagamanashranto mahapashupatakritih ||
    195|| samaganapriyah samaganatoshitashankarah | mahamantrajapapraptavibhutirbhutidonrinam || 196||
    sudhadharikriticanasuktih svikritasamyamah | vrittau madhukarashcitte himovagishvaro dhiya || 197||
    suvasinyarcanarato navakanyasamarcakah | suvasinimandalagadevidarshananirvritah || 198|| ajapajapasupritah
    kamakshiprakatakritih | devyai navanavasnigdhamadhurannanivedakah || 199|| agrajagro''cintyaguno''garvito''maravagvadah
    | vaidikaistantrikairmantrairarhitambohyatantrikah || 200|| anakalitasadrishyah shrividyamantratantravit
    | sarvadhishayikarunolalitah smitarocisha || 201|| advaitam satyamityakhyanmadhyarjunashivarcakah
    | tryashramasthairarhitanghrih pratyak citivimarshakah || 202|| dayamano dirghadrishtih gurusanketapalakah
    | nijasamlapamadhuryahritasajjanamanasah || 203|| upacaraih shodashabhirmanasairmahiteshvarah | abalagopaviditah
    karmakarmavibhagavit || 204|| luptavighnah svashritanam rijucittasamipagah | daivisampaddhritakaro
    daivisampannidhanabhuh || 205|| ambapadavalambisvajivanah sukhajivanah | maunyaceshto''vacanapravakta
    shrotritarpakah || 206|| jarashoshitasarvango jaraya''jaritantarah | vacapanitavaimatyah shastrarakshanatatparah
    || 207|| guruvare shastravidbhih kritashastravicaranah | svajanmabhanuradhasu vedarakshavicarakrit
    || 208|| apraudhakanyodvaharthanidhido lokanayakah | anathapretasamskaropakrinnidhividhayakah || 209||
    vedabhashyadhitipalah kshudhitannavitarakah | mushtitandulacittyattanihsvalayasuposhanah || 210||
    rugnalayagatartanam ishanugrahavedakah | kalavaisthasvagururadvrindavanacirasthitih || 211|| satarakshetragodicya
    cidambarashivashrayah | dehalinirmitadryagrya svamishaileshamandirah || 212|| sharanagatadinartaparitranaparayanah
    | amnayasaragulikacushakah svacchahricchayah || 213|| viditatmarasanandasvadatyaktaishanah svabhuh
    | simhasaneshimanuradjapanistandritantarah || 214|| atmanandarasasvadardhasammilitapakshmakah | pujagehanantarabhukritavaso''niketanah
    || 215|| mahagurumahasvamiparamacaryasamjnakah | navomahanitikhyata shishyah shishyopanayakah || 216||
    deshapalairarcitanghrih kotyatitajanairnutah | shrijayendrasarasvatyai svayamadvaitabodhakah || 217||
    shishyaya yogalingarcamarganirdeshakarakah | sundarivarivasyarha shrividyadikshitashravah || 218||
    prakhyapitaprashishyashca balasvamiti samjnaya | svasannidhau prashishyaya bodhitadvaita ashukrit
    || 219|| shishyaprashishyanirvrittashatabdiparamotsavah | vedaishcaturbhirvipraughaghoshitairmuditantarah
    || 220|| padapithe nyastapado hemasimhasanasthitah | gurudvitayashishyagryakritacamaravijanah || 221||
    shishyairjayendraih kanakamudrakritapadarcanah | vrindavanesannihitah kancyantaritavigrahah'
  devanagari: ॥ १९३॥ महनीयगुणग्रामो जयेन्द्रन्यस्तपीठधूः । स्वहंसगमनव्याप्तभारतो विबुधाकृतिः ॥ १९४॥ कदन्नतृप्तः
    क्षामोदरो मुग्धतराननः । महाध्वगमनाश्रान्तो महापाशुपताकृतिः ॥ १९५॥ सामगानप्रियः सामगानतोषितशङ्करः ।
    महामन्त्रजपप्राप्तविभूतिर्भूतिदोनृणाम् ॥ १९६॥ सुधाधरीकृतिचणसूक्तिः स्वीकृतसंयमः । वृत्तौ मधुकरश्चित्ते
    हिमोवागीश्वरो धिया ॥ १९७॥ सुवासिन्यर्चनरतो नवकन्यासमर्चकः । सुवासिनीमण्डलगदेवीदर्शननिर्वृतः ॥ १९८॥
    अजपाजपसुप्रीतः कामाक्षीप्रकटाकृतिः । देव्यै नवनवस्निग्धमधुरान्ननिवेदकः ॥ १९९॥ अग्रजाग्रोऽचिन्त्यगुणोऽगर्वितोऽमरवाग्वदः
    । वैदिकैस्तान्त्रिकैर्मन्त्रैरर्हिताम्बोह्यतान्त्रिकः ॥ २००॥ अनाकलितसादृश्यः श्रीविद्यामन्त्रतन्त्रवित्
    । सर्वाधिशायिकरुणोललितः स्मितरोचिषा ॥ २०१॥ अद्वैतं सत्यमित्याख्यन्मध्यार्जुनशिवार्चकः । त्र्याश्रमस्थैरर्हिताङ्घ्रिः
    प्रत्यक् चितिविमर्शकः ॥ २०२॥ दयमानो दीर्घदृष्टिः गुरुसङ्केतपालकः । निजसंलापमाधुर्यहृतसज्जनमानसः ॥
    २०३॥ उपचारैः षोडशभिर्मानसैर्महितेश्वरः । आबालगोपविदितः कर्माकर्मविभागवित् ॥ २०४॥ लुप्तविघ्नः स्वाश्रितानां
    ऋजुचित्तसमीपगः । दैवीसम्पद्धृताकारो दैवीसम्पन्निधानभूः ॥ २०५॥ अम्बापादावलम्बिस्वजीवनः सुखजीवनः । मौन्यचेष्टोऽवचनप्रवक्ता
    श्रोतृतर्पकः ॥ २०६॥ जराशोषितसर्वाङ्गो जरयाऽजरितान्तरः । वाचापनीतवैमत्यः शास्त्ररक्षणतत्परः ॥ २०७॥
    गुरुवारे शास्त्रविद्भिः कृतशास्त्रविचारणः । स्वजन्मभानुराधासु वेदरक्षाविचारकृत् ॥ २०८॥ अप्रौढकन्योद्वाहार्थनिधिदो
    लोकनायकः । अनाथप्रेतसंस्कारोपकृन्निधिविधायकः ॥ २०९॥ वेदभाष्याधीतिपालः क्षुधितान्नवितारकः । मुष्टितण्डुलचित्त्यात्तनिःस्वालयसुपोषणः
    ॥ २१०॥ रुग्णालयगतार्तानां ईशानुग्रहवेदकः । कलवैस्थस्वगुरुराड्वृन्दावनचिरस्थितिः ॥ २११॥ सताराक्षेत्रगोदीच्य
    चिदम्बरशिवाश्रयः । देहलीनिर्मिताद्र्यग्र्य स्वामिशैलेशमन्दिरः ॥ २१२॥ शरणागतदीनार्तपरित्राणपरायणः ।
    आम्नायसारगुलिकाचूषकः स्वच्छहृच्छयः ॥ २१३॥ विदितात्मरसानन्दास्वादत्यक्तैषणः स्वभूः । सिंहासनेशीमनुराड्जपनिस्तन्द्रितान्तरः
    ॥ २१४॥ आत्मानन्दरसास्वादार्धसम्मीलितपक्ष्मकः । पूजागेहानन्तरभूकृतवासोऽनिकेतनः ॥ २१५॥ महागुरुमहास्वामिपरमाचार्यसंज्ञकः
    । नवोमहानितिख्यात शिष्यः शिष्योपनायकः ॥ २१६॥ देशपालैरर्चिताङ्घ्रिः कोट्यतीतजनैर्नुतः । श्रीजयेन्द्रसरस्वत्यै
    स्वयमद्वैतबोधकः ॥ २१७॥ शिष्याय योगलिङ्गार्चामार्गनिर्देशकारकः । सुन्दरीवरिवस्यार्ह श्रीविद्यादीक्षिताश्रवः
    ॥ २१८॥ प्रख्यापितप्रशिष्यश्च बालस्वामीति संज्ञया । स्वसन्निधौ प्रशिष्याय बोधिताद्वैत आशुकृत् ॥ २१९॥
    शिष्यप्रशिष्यनिर्वृत्तशताब्दीपरमोत्सवः । वेदैश्चतुर्भिर्विप्रौघघोषितैर्मुदितान्तरः ॥ २२०॥ पादपीठे
    न्यस्तपादो हेमसिंहासनास्थितः । गुरुद्वितयशिष्याग्र्यकृतचामरवीजनः ॥ २२१॥ शिष्यैर्जयेन्द्रैः कनकमुद्राकृतपदार्चनः
    । वृन्दावनेसन्निहितः काञ्च्यन्तरितविग्रहः
