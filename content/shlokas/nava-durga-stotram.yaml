id: nava-durga-stotram
category: stotram
name:
  english: Nava Durga Stotram
content:
  english: ganeshah haridrabhancaturvadu haridravasanamvibhum | pashankushadharam daivammodakandantameva
    ca || devi shailaputri vande vanchitalabhaya candrardhakritashekharam| vrisharudham shuladharam shailaputri
    yashasvinim || devi brahmacarini dadhana karapadmabhyamakshamala kamandalu | devi prasidatu mayi brahmacarinyanuttama
    || devi candraghanteti pindajapravararudha candakopastrakairyuta | prasadam tanute mahyam candraghanteti
    vishruta || devi kushmanda surasampurnakalasham rudhiraplutameva ca | dadhana hastapadmabhyam kushmanda
    shubhadastu me || deviskandamata simhasanagata nityam padmashritakaradvaya | shubhadastu sada devi
    skandamata yashasvini || devikatyayani candrahasojjvalakara shardulavaravahana | katyayani shubham
    dadyadevi danavaghatini || devikalaratri ekaveni japakarnapura nagna kharasthita | lamboshthi karnikakarni
    tailabhyaktasharirini || vamapadollasallohalatakantakabhushana | vardhanamurdhvaja krishna kalaratrirbhayankari
    || devimahagauri shvete vrishe samarudha shvetambaradhara shucih | mahagauri shubham dadyanmahadevapramodada
    || devisiddhidatri siddhagandharvayakshadyairasurairamarairapi | sevyamana sada bhuyat siddhida siddhidayini
    ||
  devanagari: गणेशः हरिद्राभञ्चतुर्वादु हारिद्रवसनंविभुम् । पाशाङ्कुशधरं दैवम्मोदकन्दन्तमेव च ॥ देवी शैलपुत्री
    वन्दे वाञ्छितलाभाय चन्द्रार्धकृतशेखरां। वृषारूढां शूलधरां शैलपुत्री यशस्विनीम् ॥ देवी ब्रह्मचारिणी
    दधाना करपद्माभ्यामक्षमाला कमण्डलू । देवी प्रसीदतु मयि ब्रह्मचारिण्यनुत्तमा ॥ देवी चन्द्रघण्टेति पिण्डजप्रवरारूढा
    चन्दकोपास्त्रकैर्युता । प्रसादं तनुते मह्यं चन्द्रघण्टेति विश्रुता ॥ देवी कूष्माण्डा सुरासम्पूर्णकलशं
    रुधिराप्लुतमेव च । दधाना हस्तपद्माभ्यां कूष्माण्डा शुभदास्तु मे ॥ देवीस्कन्दमाता सिंहासनगता नित्यं
    पद्माश्रितकरद्वया । शुभदास्तु सदा देवी स्कन्दमाता यशस्विनी ॥ देवीकात्यायणी चन्द्रहासोज्ज्वलकरा शार्दूलवरवाहना
    । कात्यायनी शुभं दद्यादेवी दानवघातिनी ॥ देवीकालरात्रि एकवेणी जपाकर्णपूर नग्ना खरास्थिता । लम्बोष्ठी
    कर्णिकाकर्णी तैलाभ्यक्तशरीरिणी ॥ वामपादोल्लसल्लोहलताकण्टकभूषणा । वर्धनमूर्ध्वजा कृष्णा कालरात्रिर्भयङ्करी
    ॥ देवीमहागौरी श्वेते वृषे समारूढा श्वेताम्बरधरा शुचिः । महागौरी शुभं दद्यान्महादेवप्रमोददा ॥ देवीसिद्धिदात्रि
    सिद्धगन्धर्वयक्षाद्यैरसुरैरमरैरपि । सेव्यमाना सदा भूयात् सिद्धिदा सिद्धिदायिनी ॥
