id: kilakastotram
category: stotram
name:
  english: kilakastotram
  devanagari: कीलकस्तोत्रम्
content:
  english: atha kilakam om asya shrikilakamantrasya shiva rishih anushtupa chandah mahasarasvati devata
    shrijagadambaprityartham saptashatipathangatvena viniyogah | om namashcandikayai || markandeya uvaca
    om vishuddhajnanadehaya trivedidivyacakshushe | shreyahpraptinimittaya namah somarddhadharine ||1||
    sarvametadvijaniyanmantranamabhikilakam | so'pi kshemamavapnoti satatam japyatatparah ||2|| siddhyantyuccatanadini
    vastuni sakalanyapi | etena stuvatam devi stotramatrena siddhyati ||3|| na mantro naushadham tatra
    na kicnidapi vidyate | vina japyena siddhyeta sarvamuccatanadikam ||4|| samagranyapi siddhyanti lokashankamimam
    harah | kritva nimantrayamasa sarvamevamidam shubham ||5|| stotram vai candikayastu tacca guptam cakara
    sah | samaptirna ca punyasya tam yathavanniyantranam ||6|| so'pi kshemamavapnoti sarvamevam na samshayah
  devanagari: अथ कीलकम् ॐ अस्य श्रीकीलकमन्त्रस्य शिव ऋषिः अनुष्टुप छन्दः महासरस्वती देवता श्रीजगदम्बाप्रीत्यर्थं
    सप्तशतीपाठाङ्गत्वेन विनियोगः । ॐ नमश्चण्डिकायै ॥ मार्कण्डेय उवाच ॐ विशुद्धज्ञानदेहाय त्रिवेदीदिव्यचक्षुषे
    । श्रेयःप्राप्तिनिमित्ताय नमः सोमार्द्धधारिणे ॥१॥ सर्वमेतद्विजानीयान्मन्त्राणामभिकीलकम् । सोऽपि क्षेममवाप्नोति
    सततं जाप्यतत्परः ॥२॥ सिद्ध्यन्त्युच्चाटनादीनि वस्तूनि सकलान्यपि । एतेन स्तुवतां देवि स्तोत्रमात्रेण
    सिद्ध्यति ॥३॥ न मन्त्रो नौषधं तत्र न किच्ञिदपि विद्यते । विना जाप्येन सिद्ध्येत सर्वमुच्चाटनादिकम्
    ॥४॥ समग्राण्यपि सिद्ध्यन्ति लोकशङ्कामिमां हरः । कृत्वा निमन्त्रयामास सर्वमेवमिदं शुभम् ॥५॥ स्तोत्रं
    वै चण्डिकायास्तु तच्च गुप्तं चकार सः । समाप्तिर्न च पुण्यस्य तां यथावन्नियन्त्रणाम् ॥६॥ सोऽपि क्षेममवाप्नोति
    सर्वमेवं न संशयः
