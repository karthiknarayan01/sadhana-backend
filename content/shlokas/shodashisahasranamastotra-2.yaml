id: shodashisahasranamastotra-2
category: sahasranama
name:
  english: shodashisahasranamastotra
  devanagari: षोडशीसहस्रनामस्तोत्र
content:
  english: madirakshi 800 siddheshvari siddhavidya siddhadya siddhasambhava || 118|| siddharddhih siddhamata
    ca siddhahsarvarthasiddhida | manomayi gunatita paranjyotihsvarupini || 119|| pareshi paragapara parasiddhih
    paragatih | vimala mohini adya madhupanaparayana || 120|| vedavedangajanani sarvashastravisharada
    | sarvadevamayividya sarvashastramayi tatha || 121|| sarvajnanamayidevi sarvadharmamayishvari | sarvayajnamayi
    yajna sarvamantradhikarini || 122|| sarvasampatapratishthatri sarvavidravini para | sarvasankshobhinidevi
    sarvamangalakarini || 123|| trailokyakarshini devi sarvahladanakarini | sarvasammohinidevi sarvastambhanakarini||
    124|| trailokyajrimbhini devi tatha sarvavashankari | trailokyaranjanidevi sarvasampattidayini ||
    125|| sarvamantramayidevi sarvadvandvakshayankari | sarvasiddhipradadevi sarvasampatpradayini || 126||
    sarvapriyankaridevi sarvamangalakarini | sarvakamapradadevi sarvaduhkhavimocini || 127|| sarvamrityuprashamani
    sarvavighnavinashini | sarvangasundarimata sarvasaubhagyadayini || 128|| sarvajna sarvashaktishca
    sarvaishvaryaphalaprada | sarvajnanamayidevi sarvavyadhivinashini || 129|| sarvadharasvarupa ca sarvapapahara
    tatha | sarvanandamayidevi sarvecchaya
  devanagari: मदिराक्षी ८०० सिद्धेश्वरी सिद्धविद्या सिद्धाद्या सिद्धसम्भवा ॥ ११८॥ सिद्धर्द्धिः सिद्धमाता
    च सिद्धःसर्वार्थसिद्धिदा । मनोमयी गुणातीता परञ्ज्योतिःस्वरूपिणी ॥ ११९॥ परेशी परगापारा परासिद्धिः परागतिः
    । विमला मोहिनी आद्या मधुपानपरायणा ॥ १२०॥ वेदवेदाङ्गजननी सर्वशास्त्रविशारदा । सर्वदेवमयीविद्या सर्वशास्त्रमयी
    तथा ॥ १२१॥ सर्वज्ञानमयीदेवी सर्वधर्ममयीश्वरी । सर्वयज्ञमयी यज्ञा सर्वमन्त्राधिकारिणी ॥ १२२॥ सर्वसम्पतप्रतिष्ठात्री
    सर्वविद्राविणी परा । सर्वसङ्क्षोभिणीदेवी सर्वमङ्गलकारिणी ॥ १२३॥ त्रैलोक्याकर्षिणी देवी सर्वाह्लादनकारिणी
    । सर्वसम्मोहिनीदेवी सर्वस्तम्भनकारिणी॥ १२४॥ त्रैलोक्यजृम्भिणी देवी तथा सर्ववशङ्करी । त्रैलोक्यरञ्जनीदेवी
    सर्वसम्पत्तिदायिनी ॥ १२५॥ सर्वमन्त्रमयिदेवी सर्वद्वन्द्वक्षयङ्करी । सर्वसिद्धिप्रदादेवी सर्वसम्पत्प्रदायिनी
    ॥ १२६॥ सर्वप्रियङ्करीदेवी सर्वमङ्गलकारिणी । सर्वकामप्रदादेवी सर्वदुःखविमोचिनी ॥ १२७॥ सर्वमृत्युप्रशमनी
    सर्वविघ्नविनाशिनी । सर्वाङ्गसुन्दरीमाता सर्वसौभाग्यदायिनी ॥ १२८॥ सर्वज्ञा सर्वशक्तिश्च सर्वैश्वर्यफलप्रदा
    । सर्वज्ञानमयीदेवी सर्वव्याधिविनाशिनी ॥ १२९॥ सर्वाधारस्वरूपा च सर्वपापहरा तथा । सर्वानन्दमयीदेवी सर्वेच्छाया
