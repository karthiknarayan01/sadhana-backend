id: sri-mahishasura-mardini-stotram-ayigiri-nandini
category: stotram
name:
  english: Sri Mahishasura Mardini Stotram (Ayigiri Nandini)
content:
  english: ayi girinandini nanditamedini vishvavinodini nandinute girivaravindhyashirodhinivasini vishnuvilasini
    jishnunute | bhagavati he shitikanthakutumbini bhurikutumbini bhurikrite jaya jaya he mahishasuramardini
    ramyakapardini shailasute || || suravaravarshini durdharadharshini durmukhamarshini harsharate tribhuvanaposhini
    shankaratoshini kalmashamoshini ghorarate | danujaniroshini ditisutaroshini durmadashoshini sindhusute
    jaya jaya he mahishasuramardini ramyakapardini shailasute || || ayi jagadamba madamba kadambavanapriyavasini
    hasarate shikhari shiromani tungahimalaya shringanijalaya madhyagate | madhumadhure madhukaitabhaganjini
    kaitabhabhanjini rasarate jaya jaya he mahishasuramardini ramyakapardini shailasute || || ayi shatakhanda
    vikhanditarunda vitunditashunda gajadhipate ripugajaganda vidaranacanda parakramashunda mrigadhipate
    | nijabhujadanda nipatitakhanda vipatitamunda bhatadhipate jaya jaya he mahishasuramardini ramyakapardini
    shailasute || || ayi ranadurmada shatruvadhodita durdharanirjara shaktibhrite caturavicaradhurina
    mahashiva dutakrita pramathadhipate | duritaduriha durashaya durmati danavaduta kritantamate jaya
    jaya he mahishasuramardini ramyakapardini shailasute || || ayi sharanagata vairivadhuvara viravarabhayadayakare
    tribhuvana mastaka shulavirodhi shirodhikritamala shulakare | dumidumitamara dundubhinada maho mukharikrita
    tigmakare jaya jaya he mahishasuramardini ramyakapardini shailasute || || ayi nijahunkritimatra nirakrita
    dhumravilocana dhumrashate samaravishoshita shonitabija samudbhavashonita bijalate | shiva shiva shumbha
    nishumbha mahahava tarpita bhuta pishacarate jaya jaya he mahishasuramardini ramyakapardini shailasute
    || || dhanuranusanga ranakshanasanga parisphuradanga natatkatake kanaka pishanga prishatkanishangarasadbhata
    shringa hatavatuke | kritacaturanga balakshitiranga ghatadbahuranga ratadbatuke jaya jaya he mahishasuramardini
    ramyakapardini shailasute || || suralalana tatatheyi tatheyi kritabhinayodara nrityarate krita kukuthah
    kukutho gadadadikatala kutuhala ganarate | dhudhukuta dhukkuta dhindhimita dhvani dhira mridanga ninadarate
    jaya jaya he mahishasuramardini ramyakapardini shailasute || || jaya jaya japya jaye jaya shabdaparastuti
    tatpara vishvanute bhana bhana bhinjimi bhinkritanupura sinjitamohita bhutapate | natitanatardha natinatanayaka
    natitanatya suganarate jaya jaya he mahishasuramardini ramyakapardini shailasute || || ayi sumanah
    sumanah sumanah sumanah sumanohara kantiyute shrita rajani rajani rajani rajani rajanikara vaktravrite
    | sunayana vibhramara bhramara bhramara bhramara bhramaradhipate jaya jaya he mahishasuramardini ramyakapardini
    shailasute || || sahita mahahava mallama tallika mallita rallaka mallarate viracita vallika pallika
    mallika bhillika bhillika varga vrite | sitakrita phullasamullasitaruna tallaja pallava sallalite
    jaya jaya he mahishasuramardini ramyakapardini shailasute || || aviralagandagalanmadamedura mattamatangaja
    rajapate tribhuvanabhushana bhutakalanidhi rupapayonidhi rajasute | ayi sudatijana lalasamanasa mohanamanmatha
    rajasute jaya jaya he mahishasuramardini ramyakapardini shailasute || || kamaladalamala komalakanti
    kalakalitamala bhalalate sakalavilasa kalanilaya kramakelicalatkalahamsakule | alikula sankula kuvalaya
    mandala maulimiladbakulali kule jaya jaya he mahishasuramardini ramyakapardini shailasute || || karamuralirava
    vijita kujita lajjitakokila manjumate milita pulinda manohara gunjita ranjitashaila nikunjagate |
    nijagunabhuta mahashabarigana sadgunasambhrita kelitale jaya jaya he mahishasuramardini ramyakapardini
    shailasute || || katitatapita dukulavicitra mayukhatiraskrita candraruce pranatasurasura maulimanisphura
    damshulasannakha candraruce | jitakanakacala maulipadorjita nirbharakunjara kumbhakuce jaya jaya he
    mahishasuramardini ramyakapardini shailasute || || vijita sahasrakaraika sahasrakaraika sahasrakaraikanute
    krita surataraka sangarataraka sangarataraka sunusute | surathasamadhi samanasamadhi samadhi samadhi
    sujatarate jaya jaya he mahishasuramardini ramyakapardini shailasute || || padakamalam karunanilaye
    varivasyati yo'nudinam sa shive ayi kamale kamalanilaye kamalanilayah sa katham na bhavet | tava padameva
    parampadamityanushilayato mama kim na shive jaya jaya he mahishasuramardini ramyakapardini shailasute
    || || kanakalasatkala sindhujalairanusincinute gunarangabhuvam bhajati sa kim na shacikucakumbha tatiparirambha
    sukhanubhavam | tava caranam sharanam karavani natamaravani nivasi shivam jaya jaya he mahishasuramardini
    ramyakapardini shailasute || || tava vimalendukulam vadanendumalam sakalam nanu kulayate kimu puruhuta
    purindumukhi sumukhibhirasau vimukhikriyate | mama tu matam shivanamadhane bhavati kripaya kimuta
    kriyate jaya jaya he mahishasuramardini ramyakapardini shailasute || || ayi mayi dinadayalutaya kripayaiva
    tvaya bhavitavyamume ayi jagato janani kripayasi yathasi tatha'numitasirate | yaducitamatra bhavatyurari
    kurutadurutapamapakuru te jaya jaya he mahishasuramardini ramyakapardini shailasute || || iti shri
    mahishasuramardini stotram ||
  devanagari: अयि गिरिनन्दिनि नन्दितमेदिनि विश्वविनोदिनि नन्दिनुते गिरिवरविन्ध्यशिरोधिनिवासिनि विष्णुविलासिनि
    जिष्णुनुते । भगवति हे शितिकण्ठकुटुम्बिनि भूरिकुटुम्बिनि भूरिकृते जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि
    शैलसुते ॥ ॥ सुरवरवर्षिणि दुर्धरधर्षिणि दुर्मुखमर्षिणि हर्षरते त्रिभुवनपोषिणि शङ्करतोषिणि कल्मषमोषिणि
    घोररते । दनुजनिरोषिणि दितिसुतरोषिणि दुर्मदशोषिणि सिन्धुसुते जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि
    शैलसुते ॥ ॥ अयि जगदम्ब मदम्ब कदम्बवनप्रियवासिनि हासरते शिखरि शिरोमणि तुङ्गहिमालय शृङ्गनिजालय मध्यगते
    । मधुमधुरे मधुकैटभगञ्जिनि कैटभभञ्जिनि रासरते जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ अयि
    शतखण्ड विखण्डितरुण्ड वितुण्डितशुण्ड गजाधिपते रिपुगजगण्ड विदारणचण्ड पराक्रमशुण्ड मृगाधिपते । निजभुजदण्ड
    निपातितखण्ड विपातितमुण्ड भटाधिपते जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ अयि रणदुर्मद शत्रुवधोदित
    दुर्धरनिर्जर शक्तिभृते चतुरविचारधुरीण महाशिव दूतकृत प्रमथाधिपते । दुरितदुरीह दुराशय दुर्मति दानवदूत
    कृतान्तमते जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ अयि शरणागत वैरिवधूवर वीरवराभयदायकरे त्रिभुवन
    मस्तक शूलविरोधि शिरोधिकृतामल शूलकरे । दुमिदुमितामर दुन्दुभिनाद महो मुखरीकृत तिग्मकरे जय जय हे महिषासुरमर्दिनि
    रम्यकपर्दिनि शैलसुते ॥ ॥ अयि निजहुङ्कृतिमात्र निराकृत धूम्रविलोचन धूम्रशते समरविशोषित शोणितबीज समुद्भवशोणित
    बीजलते । शिव शिव शुम्भ निशुम्भ महाहव तर्पित भूत पिशाचरते जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते
    ॥ ॥ धनुरनुसङ्ग रणक्षणसङ्ग परिस्फुरदङ्ग नटत्कटके कनक पिशङ्ग पृषत्कनिषङ्गरसद्भट शृङ्ग हतावटुके । कृतचतुरङ्ग
    बलक्षितिरङ्ग घटद्बहुरङ्ग रटद्बटुके जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ सुरललना ततथेयि
    तथेयि कृताभिनयोदर नृत्यरते कृत कुकुथः कुकुथो गडदादिकताल कुतूहल गानरते । धुधुकुट धुक्कुट धिन्धिमित
    ध्वनि धीर मृदङ्ग निनादरते जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ जय जय जप्य जये जय शब्दपरस्तुति
    तत्पर विश्वनुते भण भण भिञ्जिमि भिङ्कृतनूपुर सिञ्जितमोहित भूतपते । नटितनटार्ध नटीनटनायक नाटितनाट्य
    सुगानरते जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ अयि सुमनः सुमनः सुमनः सुमनः सुमनोहर कान्तियुते
    श्रित रजनी रजनी रजनी रजनी रजनीकर वक्त्रवृते । सुनयन विभ्रमर भ्रमर भ्रमर भ्रमर भ्रमराधिपते जय जय हे
    महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ सहित महाहव मल्लम तल्लिक मल्लित रल्लक मल्लरते विरचित वल्लिक
    पल्लिक मल्लिक भिल्लिक भिल्लिक वर्ग वृते । सितकृत फुल्लसमुल्लसितारुण तल्लज पल्लव सल्ललिते जय जय हे
    महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ अविरलगण्डगलन्मदमेदुर मत्तमतङ्गज राजपते त्रिभुवनभूषण भूतकलानिधि
    रूपपयोनिधि राजसुते । अयि सुदतीजन लालसमानस मोहनमन्मथ राजसुते जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि
    शैलसुते ॥ ॥ कमलदलामल कोमलकान्ति कलाकलितामल भाललते सकलविलास कलानिलय क्रमकेलिचलत्कलहंसकुले । अलिकुल
    सङ्कुल कुवलय मण्डल मौलिमिलद्बकुलालि कुले जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ करमुरलीरव
    वीजित कूजित लज्जितकोकिल मञ्जुमते मिलित पुलिन्द मनोहर गुञ्जित रञ्जितशैल निकुञ्जगते । निजगुणभूत महाशबरीगण
    सद्गुणसम्भृत केलितले जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ कटितटपीत दुकूलविचित्र मयूखतिरस्कृत
    चन्द्ररुचे प्रणतसुरासुर मौलिमणिस्फुर दंशुलसन्नख चन्द्ररुचे । जितकनकाचल मौलिपदोर्जित निर्भरकुञ्जर कुम्भकुचे
    जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ विजित सहस्रकरैक सहस्रकरैक सहस्रकरैकनुते कृत सुरतारक
    सङ्गरतारक सङ्गरतारक सूनुसुते । सुरथसमाधि समानसमाधि समाधि समाधि सुजातरते जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि
    शैलसुते ॥ ॥ पदकमलं करुणानिलये वरिवस्यति योऽनुदिनं स शिवे अयि कमले कमलानिलये कमलानिलयः स कथं न भवेत्
    । तव पदमेव परम्पदमित्यनुशीलयतो मम किं न शिवे जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ कनकलसत्कल
    सिन्धुजलैरनुसिञ्चिनुते गुणरङ्गभुवं भजति स किं न शचीकुचकुम्भ तटीपरिरम्भ सुखानुभवम् । तव चरणं शरणं करवाणि
    नतामरवाणि निवासि शिवं जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ तव विमलेन्दुकुलं वदनेन्दुमलं
    सकलं ननु कूलयते किमु पुरुहूत पुरीन्दुमुखी सुमुखीभिरसौ विमुखीक्रियते । मम तु मतं शिवनामधने भवती कृपया
    किमुत क्रियते जय जय हे महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ अयि मयि दीनदयालुतया कृपयैव त्वया भवितव्यमुमे
    अयि जगतो जननी कृपयासि यथासि तथाऽनुमितासिरते । यदुचितमत्र भवत्युररी कुरुतादुरुतापमपाकुरु ते जय जय हे
    महिषासुरमर्दिनि रम्यकपर्दिनि शैलसुते ॥ ॥ इति श्री महिषासुरमर्दिनि स्तोत्रम् ॥
