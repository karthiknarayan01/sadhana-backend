    ॐ श्रीं ह्रीं वैद्यविद्या च ॐ क्लीं वैद्यप्रसू तथा । ॐ श्रीं ह्रीं नवोढा च ॐ स्त्रीं नेबीं ह्सौः मुनिः
    ॥ १५९॥ ॐ श्रीं नागात्मजा स्वाहा ॐ ऐं सौः नागिनी तथा । ॐ श्रीं नवाम्बरधरा ॐ ऐं सौः नवनी तथा ॥ १६०॥
    ॐ श्रीं ऐं श्रीं नवनीताङ्गी ॐ श्रीं अम्बसुनन्दिनी । ॐ श्रीं प्रीता ह्सौः पामा ॐ श्रीं क्लीं पीवरस्तनी
    ॥ १६१॥ ॐ श्रीं ह्रीं प्रीं च पीनाङ्गी ॐ क्लीं ऐं पर्वतात्मजा । ॐ श्रीं शोभावती स्वाहा ॐ क्लीं शान्ता
    ह्सौः शिवा ॥ १६२॥ ॐ ऐं सौः स्पन्दिनी स्वाहा ॐ श्रीं ह्रीं स्पन्दनस्थिता । ॐ श्रीं रसात्मिका स्वाहा
    ॐ ह्रां मन्दोदरी तथा ॥ १६३॥ ॐ श्रीं मन्दगतिः स्वाहा ॐ श्रीं मन्दानना तथा । ॐ श्रीं मन्दप्रसू स्वाहा
    ॐ श्रीं मन्दक्षयङ्करी ॥ १६४॥ ॐ श्रीं क्लीं बल्लवी स्वाहा श्रीं बल्ली ह्रीं प्रबलिका । ॐ श्रीं ह्रीं
    वणिजा स्वाहा ॐ प्रीं पुण्याङ्गना तथा ॥ १६५॥ ॐ क्रीं हूं कामधेनुश्च ॐ श्रीं अं अन्नदायिनी । ॐ प्रीं
    श्रीं क्लीं महामारी ऐं श्रीं मृत्युहरा तथा ॥ १६६॥ ॐ श्रीं ह्रीं म्रीं ह्सौः माध्वी म्रीं माध्वीरसघूर्णिता
    । ॐ श्रीं क्लीं ऐं सौः ह्सौः माता ऐं क्लीं सौः मानसी तथा ॥ १६७॥ ॐ महाभाषिणी क्रीं हूं क्रीडा क्रीं
    क्रीं कषा तथा । ॐ ह्रीं श्रीं क्रोडहन्त्री च क्रीं क्रीं क्रीं कामरोचना ॥ १६८॥ ॐ श्रीं कामवती स्वाहा
    ॐ ऐं भाग्या ह्सौः भगा । ॐ श्रीं गन्धर्वकन्या च ॐ गीं गजनिभाकृतिः ॥ १६९॥ ॐ श्रीं गोप्त्री ह्सौः गुह्या
    ॐ श्रीं गजाजिनाम्बरा । ॐ श्रीं पिङ्गा ह्सौः सङ्ख्या ॐ श्रीं सौख्यकरी तथा ॥ १७०॥ ॐ श्रीं सुखात्मिका
    स्वाहा ॐ श्रीं साहसकारिणी । ॐ श्रीं क्लीं सजया स्वाहा ॐ श्रीं गीं जनवल्लभा ॥ १७१॥ ऐं सौः क्लीं द्रीं
    द्विजा ऐं सौः दान्ता क्लीं दानतत्परा । ॐ क्रीं कलशहस्ता च क्रीं हूं कुञ्जरगामिनी ॥ १७२॥ ॐ क्रीं कौलगतिः
    श्रीं ह्रीं कुमतिः क्रीं च चापिनी । ॐ क्रीं कपिवरेशानी क्लीं कपिन्द्रवरप्रदा ॥ १७३॥ ॐ क्रीं श्रीं
    विनता ह्रीं श्रीं वैनतेयसमर्चिता । ॐ क्लीं श्रीं विरतिः स्वाहा ॐ क्लीं वानरसेविता ॥ १७४॥ ॐ क्रीं हूं
    ह्रीं कलङ्केशी क्रीं लङ्केशनिषेविता । ॐ क्रां लाटा ह्सौः लूता ॐ क्रीं श्रीं ललिताम्बरा ॥ १७५॥ क्रीं
    हूं ह्रीं क्लेशहर्त्री च ॐ क्लीं लीलावती तथा । ॐ श्रीं लोला ऐं क्लीं लता ऐं क्लीं मुसलायुधा तथा ॥
    १७६॥ ॐ ऐं श्रीं आदिदेवी च ॐ श्रीं शून्यगता तथा । ॐ क्लीं श्रीं शङ्करी स्वाहा सर्वस्म्मोहनी ह्सौः ॥
    १७७॥ ॐ श्रीं शुभङ्करी स्वाहा ह्रीं क्ष्मां क्षेमङ्करी तथा । ॐ श्रीं अशोकपत्राभा ॐ अशोका ह्सौः तमा
    ॥ १७८॥ ॐ श्रीं गीं गदिनी स्वाहा गीं गदाधरसेविता । श्रीं लं लोलरसा स्वाहा क्रीं कृपाणकरा तथा ॥ १७९॥
    ॐ श्रीं ह्सौः क्लीं ह्रीं विद्युत् ॐ श्रीं जीमूतवल्लभा । ऐं सौः क्लीं श्रीं जराध्यक्षा ॐ स्त्रीं तरुसमाश्रिता
    ॥ १८०॥ ॐ क्लीं ह्रीं होटिका स्वाहा श्रीं ह्रीं क्लीं हरवल्लभा । ऐं सौः ऐं वाग्भवी स्वाहा ॐ वां वीरुत्समर्चिता
    ॥ १८१॥ ॐ श्रीं विद्यामयी ह्रीं क्लीं ॐ जुं जनितवैभवा । ॐ श्रीं वीरार्चिता ऐं सौः वधूः ह्रां क्लीं
    वरेश्वरा ॥ १८२॥ ॐ क्लीं ह्रीं वरहस्ता च ॐ वां वरप्रदायिनी । ॐ श्रीं क्लीं सः च वाचाला ऐं सौः वाचालपूजिता
    ॥ १८३॥ ॐ श्रीं विनाशदा ॐ ह्रीं विरूपा ऐं वरूथिनी । ॐ रं वैश्वानराक्षी च ॐ श्रीं सौः वायुनन्दिनी ॥
    १८४॥ ॐ क्लीं वायुतनुः ऐं सौः वालीशा ॐ वरीतनुः । ॐ क्रीं वामा ह्सौः वीरा ॐ श्रीं वैश्वानरार्चिता ॥
    १८५॥ ॐ ऐं वाल्मीकिपूज्या च ॐ वाल्मीकधरा ह्सौः । ॐ श्रीं सीता ह्सौः ऐं क्लीं धराधरसुता तथा ॥ १८६॥ ॐ
    श्रीं धरा ह्सौः धात्री ॐ देवेश्वरपूजिता । ॐ श्रीं रुक्माङ्गदेष्टा च ऐं सौः क्लीं रुक्मभास्वरा ॥ १८७॥
    ॐ रां रुक्माङ्गदा श्रीं क्लीं रुक्मिणी ॐ ह्सौः रमा । ॐ श्रीं रं अरुणेशानी ॐ श्रीं अर्वाचिनी ह्सौः
    ॥ १८८॥ ॐ भैं अष्टारपद्मस्था ॐ ह्रीं श्रीं अष्टमी तथा । ॐ श्रीं क्रीं हूं अमावस्या ॐ तिथि ऐं त्रयोदशी
    ॥ १८९॥ ॐ ऐं एकादशी श्रीं ह्रीं द्वादशी श्रीं चतुर्दशी । ॐ ऐं सौः क्लीं सप्तमी श्रीं श्रीं दशमी ऐं
    सुपूर्णिमा ॥ १९०॥ ॐ श्रीं शुद्धात्मिका ऐं सौः शुद्धा श्रीं शुद्धरूपिणी । ॐ क्रीं हूं शुक्रसेव्या च
    क्रीं शुक्रेशी ह्सौः शुचिः ॥ १९१॥ क्रीं हूं श्रीं सप्ततिः ॐ श्रीं सर्वाङ्गी ऐं शिवेश्वरी । ॐ ऐं शुद्धेश्वरी
    ऐं क्लीं श्रीमती श्रीं श्रविश्रवा ॥ १९२॥ ॐ ऐं श्रेयस्करी ॐ श्रीं श्रीदा ॐ श्रीं धरेश्वरी । ॐ ऐं श्रीं
    शक्तिरूपा च ऐं श्रीं शब्दादिवल्लभा ॥ १९३॥ ॐ श्रीं क्लीं श्रुत्पतिः श्रीं क्लीं क्लेबेशी क्रीं कुरूपिणी
    । ॐ श्रीं मुविष्टरा श्रीं क्लीं श्रेष्ठा ऐं शाम्भवी ह्सौः ॥ १९४॥ ॐ श्रीं क्लीं नित्यक्लिन्ना श्रीं
    नरनारायणेश्वरी । ॐ नराधिपसेव्या च श्रीं नारायणवल्लभा ॥ १९५॥ ॐ क्लीं श्रीं पद्मपत्राक्षी ॐ ऐं पूर्वाधिकेश्वरी
    । ॐ क्लीं प्रीं श्रीं अपूर्वा च ॐ श्रीं क्लीं प्रीं परात्परा ॥ १९६॥ ॐ अपारभवा ऐं क्लीं पारावारसमाश्रिता
    । ॐ श्रीं पल्लवहस्ता च ॐ श्रीं प्रीं पल्लवाधरा ॥ १९७॥ ॐ स्त्रीं पयोधसदृशी ॐ पयोधरभारिणी । ॐ प्रीं
    पराङ्गमा स्वाहा ॐ प्रीं पाशविमोचिनी ॥ १९८॥ प्रीं क्लीं पश्चिमदिग्रूपा ॐ प्रीं पाषाणमण्डिता । ॐ श्रीं
    पीताम्बरेशानी ॐ क्रीं केवलरूपिणी ॥ १९९॥ ॐ श्रीं महादशाष्टेशी ॐ क्रीं मकुरगामिनी । ॐ क्रीं मन्त्रितगात्रा
    च ॐ गीं गुरुप्रभावदा ॥ २००॥ ॐ गीं गुर्वी ह्सौः गोष्ठी गीं गुञ्जावलिभूषिता । ॐ गीं गोदावरी क्लीं गीं
    गोष्ठिकानन्ददायिनी ॥ २०१॥ ॐ गीं गोष्ठात्मिका ऐं सौः गौराङ्गी गीं गुरुत्तमा । ॐ गीं श्रीं गम्यरूपा
    गीं अगम्या ह्सौः गुटी ॥ २०२॥ ॐ गीं गीतप्रिया ॐ गीं गजराजनिषेविता । ॐ श्रीं रां रक्तदन्ता ॐ रक्तबीजनिसूदिनी
    ॥ २०३॥ ॐ क्लीं श्रीं ह्रीं मधुमती ॐ ऐं सौः स्वप्ननायिका । ॐ श्रीं क्लीं स्वप्नमाया च ऐं सौः स्वप्नावती
    तथा ॥ २०४॥ श्रीं स्वादुमयी ऐं सौः सारात्मा ऐं समर्चिका । ऐं सौः सत्या ह्सौः सार्त्री ॐ श्रीं मन्त्रफलप्रदा
    ॥ २०५॥ ॐ सद्रूपा ह्सौः सज्जा ऐं मज्जा सौः धनुर्लता । ॐ श्रीं धनुर्धरेशानी द्रीं श्रीं धूमरकेशिनी ॥
    २०६॥ ॐ श्रीं मायावती स्वाहा ॐ श्रीं क्लीं कुब्जचारिणी । ऐं क्लीं कठोरपुलका क्रीं कार्मुकफलप्रदा ॥
    २०७॥ क्रीं क्रीं क्रीं कर्मदा हूं हूं कर्मलेषा ह्सौः कटिः । क्रीं कर्मेष्ठा ह्सौः कुः ऐं कर्मस्था
    क्रीं च कर्मिणी ॥ २०८॥ ॐ क्रीं कार्मुकहस्ता च क्रीं कार्मुकरवाकुला । क्रीं कपोलसद्दीप्तिः क्रीं क्रीं
    कमलजार्चिता ॥ २०९॥ क्रीं लेखकप्रिया क्रीं हूं लेख्या क्रीं लेखचारिका । क्रीं मषीरूपिणी ऐं क्लीं मुष्टि
    ऐं मुष्टिवर्धिनी ॥ २१०॥ क्रीं म्रों मोहप्रदा स्रीं स्रूं मन्त्रविद्या ह्सौः मघा । ॐ श्रीं सुन्दरी
    श्रीं श्रीं सारदर्पसमुज्ज्वला ॥ २११॥ ऐं श्रीं मज्जा ह्सौः श्रीं म्रीं ऐं सौः मूत्रपुरीषिका । ऐं सौः
    क्लीं श्रीं सुनन्दा च ऐं सौः क्लीं सद्गतिः तथा ॥ २१२॥ ॐ श्रीं सन्तानवल्ली च ॐ सन्तानफलप्रदा । ॐ श्रीं
    महोदरी ऐं सौः सः प्रजा ऐं प्रजावती ॥ २१३॥ ॐ भ्रातृवल्लभा भैं क्रीं भीतिहा भैं भटार्चिता । ॐ भटेशी
    ह्सौः कद्रूः ॐ क्रीं हूं कनकेश्वरी ॥ २१४॥ क्रीं स्कन्दजननी ऐं सौः द्रीं दाडिमफलानना । श्रीं दीर्घास्या
    ह्सौः धीः श्रीं द्युमणीन्दुविलोचना ॥ २१५॥ ॐ द्रीं दम्भेशलोभाढ्या ॐ श्रीं धीः सचिवाश्रया । अं श्रीं
    अमात्यवर्गेष्टा ॐ अमात्यप्रियङ्करी ॥ २१६॥ ॐ श्रीं असिलता क्रीं हूं अनेकाक्षरभूषणा । ॐ क्रीं अल्परसा
    ह्सौः श्रीं अल्पहासा ह्सौः अणुः ॥ २१७॥ ॐ श्रीं अत्रिभरा ऐं सौः हावभावसमन्विता । ऐं सौः सीत्कारिणी
    स्वाहा ऐं सौः सुरसमण्डना ॥ २१८॥ ऐं सुरा श्रीं सुरादेवी ऐं सुरासुरसेविता । ऐं श्रीं सत्कारगा स्वाहा
    ॐ श्रीं सत्कारपूजिता ॥ २१९॥ ॐ सौः साधकसेव्या च ऐं सौः साधकवल्लभा । ॐ ह्रीं श्रीं भैं च भीरुण्डा ॐ
    क्रीं भैं भगमालिनी ॥ २२०॥ ॐ भैं भगोदरा ह्रीं भैं भीमा हूं भैं भगात्मिका । ॐ भैं भर्गशिखा हूं भैं भास्वती
    भैं ह्सौः भगा ॥ २२१॥ ॐ भैं भगेश्वरी स्वाहा ॐ भैं भर्गाङ्गवासिनी । ॐ श्रीं भैं भानुमध्यथा क्रीं ह्रीं
    भैं बैन्दवेश्वरी ॥ २२२॥ ॐ भैं बन्धुररूपा च ॐ भैं भास्वररूपिणी । ॐ भैं बलिभुजाकान्ता ॐ भैं बलिनिषेविता
    ॥ २२३॥ ॐ भैं बलिबलघ्नी ॐ भैं बल्या भैं बलात्मिका । ॐ भैं श्रीं भूचरी ॐ श्रीं भूचराणामतिप्रिया ॥ २२४॥
    ॐ भैं क्रीं भगिनी हूं भैं भवेशी भैं भगोत्सुका । भैं श्रीं भगैकलिङ्गा भैं भगलिङ्गसुखावहा ॥ २२५॥ ॐ भैं
    भगैकशुक्रा भैं क्रीं भैं भुवनपालिनी । क्रीं हूं ह्रीं ह्रीं ह्सौः काली क्रीं ह्रीं दक्षिणकालिका ॥
    २२६॥ क्रीं क्रीं क्रीं ह्रीं ह्रीं स्वाहा देवी श्मशानकालिका । क्रीं क्रीं क्रीं हूं हूं ह्रीं ह्रीं
    भैं भैं स्वाहा भद्रकालिका ॥ २२७॥ इति भैं भद्रकाल्याश्च मन्त्रनाम सहस्रकम् । भद्रकाल्याश्च सर्वस्वं
    रहस्यातिरहस्यकम् ॥ २२८॥ भैं बीजरूपतत्वैकं मन्त्रगर्भं परं महत् । सर्वागमैकसारन्तु सारात्सारोत्तमोत्तमम्
    ॥ २२९॥ सर्वमन्त्रमयं दिव्यं सिद्धविद्या विनायकम् । सर्वपाप प्रशमनं रहस्यं त्रिदिवौकसाम् ॥ २३०॥ गोप्यं
    गोप्यतमं गोप्यं गुप्तागुप्ततमं कलौ । भोगदं मोक्षदं स्तुत्यं सर्ववर्ग फलप्रदम् ॥ २३१॥ मन्त्रात्मिकं
    मनुमयं त्रैलोक्योद्धारणक्षमम् । जगत्सारं स्थितो ब्रह्मा ततः सारं शिवः स्मृतः ॥ २३२॥ ततः शक्तिः स्मृताः
    सारं ततः ततः त्रिपुरसुन्दरी । ततः श्री दक्षिणाकाली ततो भैं भद्रकालिका ॥ २३३॥ द्वाविंशत्यक्षरी देवी
    सर्वामृतमयी शिवा । सिद्धिदा बुद्धिदा लोके सर्वमन्त्रमयी तथा ॥ २३४॥ शुद्धचैतन्यरूपेयं विद्या भुवन दुर्लभा
    । द्वाविंशत्यक्षरी विद्या प्रतिलोम स्वरूपिणी ॥ २३५॥ गोपिता गोपनीया च सारात्सारोत्तमोत्तमा । अस्या
    सारमिदं नाम्नां सहस्रं मन्त्रगर्भकम् ॥ २३६॥ नात्र शुद्धेरपेक्षास्ति न वा मित्रादि दूषणम् । न मोहेन
    च दौर्बल्यं न शोको नियमो न वा ॥ २३७॥ सर्वथामृतरूपा च विद्येयं शुद्धरूपिणी । तत् ब्रह्ममयी विद्या तत्
    बीजमयी तथा ॥ २३८॥ न दारिद्र्यभयं देवि न च दुर्भिक्षपीडनम् । न च मारीभयं तत्र यत्र नाम्नासहस्रकम् ॥
    २३९॥ अर्धरात्रे पठेन्नाम्नां सहस्रं मन्त्रगर्भकम् । स्त्रिया सहचरेद्भोगं देवी दर्शनमाप्नुयात् ॥ २४०॥
    विनार्धरात्र समये पठनं न फलप्रदम् । ब्रह्महत्या गुरोर्हत्या ब्रह्महत्या प्रिया वधम् ॥ २४१॥ तत्क्षालयति
    विद्येयं द्वाविंशत्यक्षरापरा । त्रयस्त्रिंशतकोटिनां देवतानां महेश्वरि ॥ २४२॥ तेजोरूपमिदं नाम्नां सहस्रं
    मन्त्ररूपकम् । रहस्यं पुत्रपौत्रादि गो गजाश्वरथ प्रदम् ॥ २४३॥ अमावस्यां रवेर्वारे मध्यान्हे कूप सन्निधौ
    । पठेन्मन्त्री त्रिवारं यः स भवेत् भक्त विशेषतः ॥ २४४॥ भौमेष्टम्यां च सायं यः पठेद्दीपागतोरहः । तस्य
    सर्वार्थ सिद्धिः स्यानातिदूरा महेश्वरिः ॥ २४५॥ शुक्लेचैकादशी रात्रौ लिखेनाम्नासहस्रकम् । कर्पूर कुङ्कुमारक्त
    कस्तूरी मलयैः शनैः ॥ २४६॥ तविभूर्जस्य देवेशि धूपदीपादि पूर्वकम् । नीलवस्त्रेण संवेष्ट्यं लाक्षया परिवेष्टयेत्
    ॥ २४७॥ सुवर्णेनापिसंवेष्टय पञ्चगव्येन शोधयेत् । रवौ कन्या नवप्रीता सम्पूज्य विधिवत् शिवे ॥ २४८॥ भोजयित्ताततोदेवि
    गुटिकेयं फलप्रदा । वन्ध्यालभेत्सुतात् शीघ्रं निर्धनो धनमाप्नुयात् ॥ २४९॥ सर्वथा सर्वदा लोके गुटिकेयं
    भविष्यति । यो स्त्री वामकरे व धारये पुरुषे दक्षिणे भुजे ॥ २५०॥ तत्रत्फलमवाप्नोति यत्रन्मनसि वर्तते
    । प्रभाते पर्वते नाम्नां सहस्रं मन्त्रगर्भकम् ॥ २५१॥ स्तम्भयेदपि ब्रह्माणं मोहयेदपि केशवम् । मारयेदपि
    कीनाशं वशयेदपि शङ्करम् ॥ २५२॥ उच्चाटयति स्वान्शत्रूनाकर्षयति योषितः । स्तम्भयेद्वायु सूर्या च शमयेदपि
    पावकम् ॥ २५३॥ इदं नाम्नां सहस्रन्तु भद्रकाल्याश्च पाठनम् । रणे राजकुले द्यूते विवादे शत्रू संसदिम्
    ॥ २५४॥ साधको जयमाप्नोति स्मरणात्साधकेश्वरि । राज्यं देयं शिरो देयं देया सन्ततिरर्थिने ॥ २५५॥ भद्रकाल्या
    इदं नाम्नां सहस्रं मन्मुखोदितम् । नो देयं साधकैः देवि विनाशिष्याय सिद्धये ॥ २५६॥ दुर्जनाय अकुलीनाय
    भ्रष्टाय अमितभाषिणे । न दातव्यं न दातव्यं साधकै सर्व सिद्धये ॥ २५७॥ स्वशिष्याय कुलीनाय भक्ताय मितभाषिणे
    । दातव्यं साधकैर्देवि शुभदं स्वसिद्धये ॥ २५८॥ यः पठेत्पाठयेद्वापि श
