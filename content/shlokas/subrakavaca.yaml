id: subrakavaca
category: kavacha
name:
  english: subrakavaca
  devanagari: सुब्रकवच
content:
  english: shri subrahmanyo devata | om nama iti bijam | bhagavata iti shaktih | subrahmanyayeti kilakam
    | subrahmanyaprasada siddhyarthe jape viniyogah || karanyasah || sam amgushthabhyam namah sim tarjanibhyam
    namah sum madhyamabhyam namah saim anamikabhyam namah saum kanishthikabhyam namah sah karatalakaraprishthabhyam
    namah || anga nyasah || sam hridayaya namah sim shirase svaha sum shikhayai vashat saim kavacaya hum
    saum netratrayaya vaushat sah astraya phat bhurbhuvahsuvaromiti digbandhah || dhyanam || sindurarunamindukantivadanam
    keyuraharadibhih divyairabharanervibhushitatanum svargadisaukhyapradam | ambhojabhayashaktikukkutadharam
    raktamgaragojvalam subrahmanyamupasmahe pranamatam bhitipranashodyatam || subrahmanyogratah patu senanih
    patu prishthatah | guho mam dakshine patu vahnijam patu vamatah || 1|| shirah patu mahasenah skando
    rakshellalatakam | netro me dvadashakshashca shrotre rakshatu vishvabhrit || 2|| mukham me shanmukhah
    patu nasikam shankaratmajah | oshthau vallipatih patu jihvam patu shadananah || 3|| devasenapatirdantan
    cubukam bahulatmajah |
  devanagari: श्री सुब्रह्मण्यो देवता । ॐ नम इति बीजम् । भगवत इति शक्तिः । सुब्रह्मण्यायेति कीलकम् । सुब्रह्मण्यप्रसाद
    सिद्ध्यर्थे जपे विनियोगः ॥ करन्यासः ॥ सां अंगुष्ठाभ्यां नमः सीं तर्जनीभ्यां नमः सूं मध्यमाभ्यां नमः
    सैं अनामिकाभ्यां नमः सौं कनिष्ठिकाभ्यां नमः सः करतलकरपृष्ठाभ्यां नमः ॥ अङ्ग न्यासः ॥ सां हृदयाय नमः
    सीं शिरसे स्वाहा सूं शिखायै वषट् सैं कवचाय हुं सौं नेत्रत्रयाय वौषट् सः अस्त्राय फट् भूर्भुवःसुवरोमिति
    दिग्बन्धः ॥ ध्यानम् ॥ सिन्दूरारुणमिन्दुकान्तिवदनं केयूरहारादिभिः दिव्यैराभरणेर्विभूषिततनुं स्वर्गादिसौख्यप्रदम्
    । अंभोजाभयशक्तिकुक्कुटधरं रक्तांगरागोज्वलं सुब्रह्मण्यमुपास्महे प्रणमतां भीतिप्रणाशोद्यतम् ॥ सुब्रह्मण्योग्रतः
    पातु सेनानीः पातु पृष्ठतः । गुहो मां दक्षिणे पातु वह्निजं पातु वामतः ॥ १॥ शिरः पातु महासेनः स्कन्दो
    रक्षेल्ललाटकम् । नेत्रो मे द्वादशाक्षश्च श्रोत्रे रक्षतु विश्वभृत् ॥ २॥ मुखं मे षण्मुखः पातु नासिकां
    शङ्करात्मजः । ओष्ठौ वल्लीपतिः पातु जिह्वां पातु षडाननः ॥ ३॥ देवसेनापतिर्दन्तान् चुबुकं बहुलात्मजः
    ।
