id: nrisimhavadavanalastotram
category: stotram
name:
  english: nrisimhavadavanalastotram
  devanagari: नृसिंहवडवानलस्तोत्रम्
content:
  english: shrinrisimhapreranya shrinrisimhaprityarthe jape viniyogah || atha karanyasah | om ugram viram
    angushthabhyam namah | om mahavishnum tarjanibhyam namah | om jvalantam madhyamabhyam namah | om vishvatomukham
    anamikabhyam namah | om nrisimham kanishthikabhyam namah | om bhishanam bhadram karatalakaraprishthabhyam
    namah || atha hridayadi nyasah | om ugram viram hridayaya namah | om mahavishnum shirase svaha | om
    jvalantam shikhayai vashat | om vishvatomukham kavacaya hum | om nrisimham netratrayaya vaushat |
    om bhishanam bhadram astraya phat | om mrityurmrityu namamyaham bhurbhuvasvarom iti digbandhah ||
    atha dhyanam | shrimannrisimha vibhave garudadhvajaya tapatrayopashamanaya bhavaushadhaya | krishnaya
    vrishcika jalagni bhujanga rogam kleshakshayaya haraye gurave namaste || om namo bhagavate nrisimharudraya
    anka lalita pingalalocanaya vajranakhaya vajradamshtrakaralaya ahavaniyam garhapatyam dakshinagni
    netravaktraya rakshasasamharakalaya prahladarakshaka stambhodbhavaya devatarakshakaya dushtamardanaya
    hanakapaghora vajranarasimhaya atmamantra atmayantra atmatantra rakshanaya hram hrim hrum hraim hraum
    la la la la shriviranrisimhaya paramantra paratantra parayantra chedanaya ca hum phat || vyaghra simha
    sharabha bhalluka dushtamriga chedanaya || tam tam tam tam shriviranarasimhaya rajabhaya corabhaya
    nivaranaya || blam blim blum blaim blaum vajradamshtraya bhaya sarvabhayoccatanaya sarvashatrun chedi
    sarvashatrun chedi sarva shatrujihvam kilaya buddhivinashaya dushtanam vaca mukham stambhaya || cham
    cham cham cham atmatantraraksha paravairijihvamudgaram kilaya || a ya ra la va ma ra yam || sa va
    ma ra ma la yam || ha va ma ra ma la yam || klam klim klum klaim klaum viranrisimhaya indradisham
    bandhah || jvalavaktraya yamyadisham bandhah || karaladamshtraya nairrityadisham bandhah || pingalakshaya
    kuberadisham bandhah || madhukeshaya ishanyadisham bandhah || urdhvabhak urdhvadisham bandhah || kashyapasamharaya
    agneyadisham bandhah || aghorarupaya pataladisham bandhah || ugradeha hridayakamalodbhavaya sarvadisham
    bandhah || hana la la la la li li li li lu lu lu lu le le le le lo lo lo lo ku li li li ku lu lu lu
    ko lo lo lo ko ko ko shakini dakini vetala brahmarakshasa sarpashcarada taskaraupadravadi uccatanaya
    shesha vasuki takshaka shankha dhutika
  devanagari: श्रीनृसिंहप्रेरण्या श्रीनृसिंहप्रीत्यर्थे जपे विनियोगः ॥ अथ करन्यासः । ॐ उग्रं वीरं अङ्गुष्ठाभ्यां
    नमः । ॐ महाविष्णुं तर्जनीभ्यां नमः । ॐ ज्वलन्तं मध्यमाभ्यां नमः । ॐ विश्वतोमुखं अनामिकाभ्यां नमः ।
    ॐ नृसिंहं कनिष्ठिकाभ्यां नमः । ॐ भीषणं भद्रं करतलकरपृष्ठाभ्यां नमः ॥ अथ हृदयादि न्यासः । ॐ उग्रं वीरं
    हृदयाय नमः । ॐ महाविष्णुं शिरसे स्वाहा । ॐ ज्वलन्तं शिखायै वषट् । ॐ विश्वतोमुखं कवचाय हुं । ॐ नृसिंहं
    नेत्रत्रयाय वौषट् । ॐ भीषणं भद्रं अस्त्राय फट् । ॐ मृत्युर्मृत्यु नमाम्यहं भूर्भुवस्वरों इति दिग्बन्धः
    ॥ अथ ध्यानम् । श्रीमन्नृसिंह विभवे गरुडध्वजाय तापत्रयोपशमनाय भवौषधाय । कृष्णाय वृश्चिक जलाग्नि भुजङ्ग
    रोगं क्लेशक्षयाय हरये गुरवे नमस्ते ॥ ॐ नमो भगवते नृसिंहरुद्राय अङ्क ललित पिङ्गललोचनाय वज्रनखाय वज्रदंष्ट्राकरालाय
    आहवनीयं गार्हपत्यं दक्षिणाग्नि नेत्रवक्त्राय राक्षससंहारकालाय प्रह्लादरक्षक स्तम्भोद्भवाय देवतारक्षकाय
    दुष्टमर्दनाय हनकपघोर वज्रनरसिंहाय आत्ममन्त्र आत्मयन्त्र आत्मतन्त्र रक्षणाय ह्रां ह्रीं ह्रूं ह्रैं
    ह्रौं ल ल ल ल श्रीवीरनृसिंहाय परमन्त्र परतन्त्र परयन्त्र छेदनाय च हुं फट् ॥ व्याघ्र सिंह शरभ भल्लुक
    दुष्टमृग छेदनाय ॥ टं टं टं टं श्रीवीरनरसिंहाय राजभय चोरभय निवारणाय ॥ ब्लां ब्लीं ब्लूं ब्लैं ब्लौं
    वज्रदंष्ट्राय भय सर्वभयोच्चाटनाय सर्वशत्रून् छेदि सर्वशत्रून् छेदि सर्व शत्रुजिह्वां कीलय बुद्धिविनाशय
    दुष्टानां वाचा मुखं स्तम्भय ॥ छं छं छं छं आत्मतन्त्ररक्ष परवैरिजिह्वामुद्गरं कीलय ॥ अ य र ल व म र
    यं ॥ स व म र म ल यं ॥ ह व म र म ल यं ॥ क्लां क्लीं क्लूं क्लैं क्लौं वीरनृसिंहाय इन्द्रदिशं बन्धः
    ॥ ज्वालावक्त्राय याम्यादिशं बन्धः ॥ करालदंष्ट्राय नैरृत्यदिशं बन्धः ॥ पिङ्गलाक्षाय कुबेरदिशं बन्धः
    ॥ मधुकेशाय ईशान्यदिशं बन्धः ॥ ऊर्ध्वभाक् ऊर्ध्वदिशं बन्धः ॥ कश्यपसंहाराय आग्नेयदिशं बन्धः ॥ अघोररूपाय
    पातालदिशं बन्धः ॥ उग्रदेह हृदयकमलोद्भवाय सर्वदिशं बन्धः ॥ हन ल ल ल ल लि लि लि लि लु लु लु लु ले ले
    ले ले लो लो लो लो कु लि लि लि कु लु लु लु को लो लो लो को को को शाकिनी डाकिनी वेताल ब्रह्मराक्षस सर्पश्चरद
    तस्करौपद्रवादि उच्चाटनाय शेष वासुकि तक्षक शङ्ख धुटिक
