id: krishnapurushottamasiddhantopanishat
category: upanishad
name:
  english: krishnapurushottamasiddhantopanishat
  devanagari: कृष्णपुरुषोत्तमसिद्धान्तोपनिषत्
content:
  english: shrikrishnapurushottamasiddhantopanishat niranjano nirakhyato nirvikalpo namo namah | purnanando
    harirmayarahita purushottamah || ashtavashtasahasre dve striyo jayante purushottamat | smritirjayate
    purushottamat | shatcchastrani jayante purushottamat | chando jayate purushottamat | nigamo jayate
    purushottamat | prajapatirjayate purushottamat | shashiravi jayete purushottamat | sakalatirthani
    jayante purushottamat | parashivashaktirjayate purushottamat | rishayo'nrishayo jayante purushottamat
    | indro jayate purushottamat | dvadashaditya rudrah sarva devata jjayante purushottamat | deva jayante
    purushottamat | sapta sagara jayante purushottamat | sarva atma jayate purushottamat | manahsarvendriyani
    jayante purushottamat | ashtadasha brahmandani jayante purushottamat | ashtasiddhinavanidhayo jayante
    purushottamat | vanabhara ashtadasha jayante purushottamat | amrito jayate purushottamat | ambho jayate
    purushottamat || om nigamam shankaro'bravit | gauh | gma | jma | kshma | ksha | kshama | kshonih |
    kshitih | avanih | urvi | prithvi | mahi | ripah | aditih | ila | jivamakalashuta
  devanagari: श्रीकृष्णपुरुषोत्तमसिद्धान्तोपनिषत् निरञ्जनो निराख्यातो निर्विकल्पो नमो नमः । पूर्णानन्दो
    हरिर्मायारहित पुरुषोत्तमः ॥ अष्टावष्टसहस्रे द्वे स्त्रियो जायन्ते पुरुषोत्तमात् । स्मृतिर्जायते पुरुषोत्तमात्
    । षट्च्छास्त्राणि जायन्ते पुरुषोत्तमात् । छन्दो जायते पुरुषोत्तमात् । निगमो जायते पुरुषोत्तमात् ।
    प्रजापतिर्जायते पुरुषोत्तमात् । शशिरवी जायेते पुरुषोत्तमात् । सकलतीर्थानि जायन्ते पुरुषोत्तमात् ।
    परशिवशक्तिर्जायते पुरुषोत्तमात् । ऋषयोऽनृषयो जायन्ते पुरुषोत्तमात् । इन्द्रो जायते पुरुषोत्तमात् ।
    द्वादशादित्या रुद्राः सर्वा देवता ज्जयन्ते पुरुषोत्तमात् । देवा जायन्ते पुरुषोत्तमात् । सप्त सागरा
    जायन्ते पुरुषोत्तमात् । सर्व आत्मा जायते पुरुषोत्तमात् । मनःसर्वेन्द्रियाणि जायन्ते पुरुषोत्तमात्
    । अष्टादश ब्रह्माण्डानि जायन्ते पुरुषोत्तमात् । अष्टसिद्धिनवनिधयो जायन्ते पुरुषोत्तमात् । वनभारा अष्टादश
    जायन्ते पुरुषोत्तमात् । अमृतो जायते पुरुषोत्तमात् । अम्भो जायते पुरुषोत्तमात् ॥ ॐ निगमं शङ्करोऽब्रवीत्
    । गौः । ग्मा । ज्मा । क्ष्मा । क्षा । क्षमा । क्षोणिः । क्षितिः । अवनिः । उर्वी । पृथ्वी । मही । रिपः
    । अदितिः । इला । जीवामकालाशूता
