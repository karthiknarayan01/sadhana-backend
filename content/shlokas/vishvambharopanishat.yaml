id: vishvambharopanishat
category: upanishad
name:
  english: vishvambharopanishat
  devanagari: विश्वम्भरोपनिषत्
content:
  english: shrimadramacandra caranau angushthabhyam namah sharanam tarjanibhyam namah prapadye madhyamabhyam
    namah shrimate anamikabhyam namah ramacandraya kanishthikabhyam namah namah karatalakara prishthabhyam
    namah shriramacandra caranau jnanayahridayaya namah sharanamaishvaryyaya shirase svaha prapadye shaktaye
    shishayai vashat shrimate balaya kavacayahum ramacandraya tejase netrabhyam vaushat namo bijaya astraya
    phat shriramacandracaranau jnanaya udaraya namah sharanamaishvaryyaya prishthaya namah prapadye shaktaye
    bahubhyam namah shrimate balaya urubhyam namah ramacandraya tejase janubhyam namah namoviryyaya padabhyam
    namah athadehanyasah shrim namah mannamah ram namah mannamah cannamah drannamah cannamah rannamah
    naum namah shannamah rannamah nannamah prannamah pannamah dyannamah shrinamah mannamah tennamah rannamah
    mannamah cannamah drannamah yannamah nannamah monnamah evamuparyyavinyaset shrimmuddhinamatebhaleramanetre
    candranasika yam carashrotre nau mukhesharabhujayoh namhridiprapastanayoh dyenabhau shriprishthematejanghayoh
    ramakatyam candra urvoh ya januni namah padayeh athadhyanam | janaki sahitam ramamindranila maniprabham
    | jnana mudradharam sarva bhushabhih samalankritam || parshvanyasta dhanurvanam sarvavayava sundaram
    | rajivalocanam dhyayetsarvabhishtartha siddhaye || artha
  devanagari: श्रीमद्रामचन्द्र चरणौ अङ्गुष्ठाभ्यां नमः शरणं तर्जनीभ्यां नमः प्रपद्ये मध्यमाभ्यां नमः श्रीमते
    अनामिकाभ्यां नमः रामचन्द्राय कनिष्ठिकाभ्यां नमः नमः करतलकर पृष्ठाभ्यां नमः श्रीरामचन्द्र चरणौ ज्ञानायहृदयाय
    नमः शरणमैश्वर्य्याय शिरसे स्वाहा प्रपद्ये शक्तये शिषायै वषट् श्रीमते बलाय कवचायहुं रामचन्द्राय तेजसे
    नेत्राभ्यां वौषट् नमो बीजाय अस्त्राय फट् श्रीरामचन्द्रचरणौ ज्ञानाय उदराय नमः शरणमैश्वर्य्याय पृष्ठाय
    नमः प्रपद्ये शक्तये बाहुभ्यां नमः श्रीमते बलाय ऊरूभ्यां नमः रामचन्द्राय तेजसे जानुभ्यां नमः नमोवीर्य्याय
    पादाभ्यां नमः अथदेहन्यासः श्रीं नमः मन्नमः रां नमः मन्नमः चन्नमः द्रन्नमः चन्नमः रन्नमः णौं नमः शन्नमः
    रन्नमः णन्नमः प्रन्नमः पन्नमः द्यन्नमः श्रीनमः मन्नमः तेन्नमः रान्नमः मन्नमः चन्नमः द्रान्नमः यन्नमः
    नन्नमः मोन्नमः एवमुपर्य्यविन्यसेत् श्रीम्मूद्धिनमतेभालेरामनेत्रे चन्द्रनासिका यां चरश्रोत्रे णौ मुखेशरभुजयोः
    णंहृदिप्रपस्तनयोः द्येनाभौ श्रीपृष्ठेमतेजङ्घयोः रामकट्यां चन्द्रा ऊर्वोः य जानुनि नमः पादयेः अथध्यानम्
    । जानकी सहितं राममिन्द्रनील मणिप्रभम् । ज्ञान मुद्राधरं सर्व भूषाभिः समलङ्कृतम् ॥ पार्श्वन्यस्त धनुर्वाणं
    सर्वावयव सुन्दरम् । राजीवलोचनं ध्यायेत्सर्वाभिष्टार्थ सिद्धये ॥ अर्थ
