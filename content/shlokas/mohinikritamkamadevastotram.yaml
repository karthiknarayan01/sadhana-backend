id: mohinikritamkamadevastotram
category: stotram
name:
  english: mohinikritamkamadevastotram
  devanagari: मोहिनिकृतंकामदेवस्तोत्रम्
content:
  english: mohinikritam kamadevastotram mohinyuvaca | sarvendriyanam pravaram vishnoramsham ca manasam
    | tadeva karmanam bijam tadudbhava namo'stu te || 66|| svayamatma hi bhagavamjnanarupo maheshvarah
    | namo brahmanjagatsrashtastadudbhava namo'stu te || 67|| srishtih sarvasharireshu drishtishca yoginamapi
    | jagatsadhya duraradhya durnivara namo'stu te || 68|| sarvajita jagajjetarjiva jiva manohara | ratibija
    ratisvamin ratipriya namo'stu te || 69|| shashvadyoshidadhishthana yoshitpranadhikapriya | yoshidvahana
    yoshastra yoshidbandho namo'stu te || 70|| patisadhyakarashesharupadhara gunashraya | sugandhivatasaciva
    madhumitra namo'stu te || 71|| shashvadyonikritadhara strisandarshanavardhana | vidagdhanam virahinam
    pranantaka namo'stu te || 72|| akripa yeshu te'narthastesham jnanavinashanam | anuharupabhakteshu
    kripasindho namo'stu te || 73|| tapasvinam ca tapasam vighnabijavalilaya | manah sakamam muktanam
    kartum shakta namo'stu te || 74|| tapahsadhyashcaradhyashca sadaivam pancabhautikah | pancendriyakritadhara
    pancabana namo'stu te || 75|| iti brahmavaivartapurane shrikrishnajanmakhande purvabhage ekatrimshadhyayantargatam
    mohinikritam kimadevastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: मोहिनिकृतं कामदेवस्तोत्रम् मोहिन्युवाच । सर्वेन्द्रियाणां प्रवरं विष्णोरंशं च मानसम् । तदेव
    कर्मणां बीजं तदुद्भव नमोऽस्तु ते ॥ ६६॥ स्वयमात्मा हि भगवांज्ञानरूपो महेश्वरः । नमो ब्रह्मञ्जगत्स्रष्टस्तदुद्भव
    नमोऽस्तु ते ॥ ६७॥ सृष्टिः सर्वशरीरेषु दृष्टिश्च योगिनामपि । जगत्साध्य दुराराध्य दुर्निवार नमोऽस्तु
    ते ॥ ६८॥ सर्वाजित जगज्जेतर्जीव जीव मनोहर । रतिबीज रतिस्वामिन् रतिप्रिय नमोऽस्तु ते ॥ ६९॥ शश्वद्योषिदधिष्ठान
    योषित्प्राणाधिकप्रिय । योषिद्वाहन योषास्त्र योषिद्बन्धो नमोऽस्तु ते ॥ ७०॥ पतिसाध्यकराशेषरूपाधार गुणाश्रय
    । सुगन्धिवातसचिव मधुमित्र नमोऽस्तु ते ॥ ७१॥ शश्वद्योनिकृताधार स्त्रीसन्दर्शनवर्धन । विदग्धानां विरहिणां
    प्राणान्तक नमोऽस्तु ते ॥ ७२॥ अकृपा येषु तेऽनर्थास्तेषां ज्ञानविनाशनम् । अनूहरूपभक्तेषु कृपासिन्धो
    नमोऽस्तु ते ॥ ७३॥ तपस्विनां च तपसां विघ्नबीजावलीलया । मनः सकामं मुक्तानां कर्तुं शक्त नमोऽस्तु ते
    ॥ ७४॥ तपःसाध्याश्चाराध्याश्च सदैवं पाञ्चभौतिकाः । पञ्चेन्द्रियकृताधार पञ्चबाण नमोऽस्तु ते ॥ ७५॥ इति
    ब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे पूर्वभागे एकत्रिंशाध्यायान्तर्गतं मोहिनिकृतं कीमदेवस्तोत्रं
    समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
