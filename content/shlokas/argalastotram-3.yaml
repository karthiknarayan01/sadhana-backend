id: argalastotram-3
category: stotram
name:
  english: argalastotram
  devanagari: अर्गलास्तोत्रं
content:
  english: athargalastotram om asya shriargalastotramantrasya vishnurishih anushtupa chandah shrimahalakshmirdevata
    shrijagadambapritaye saptashatipathangatvena jape viniyogah || om namashcandikayai || markandeya uvaca
    om jayanti mangala kali bhadrakali kapalini | durga kshama shiva dhatri svaha svadha namo'stute ||1||
    jaya tvam devi camunde jaya bhutartiharini | jaya sarvagate devi kalaratri namo'stute ||2|| madhukaitabhavidravividhatrivarade
    namah | rupam dehi jayam dehi yasho dehi dvisho jahi ||3|| mahishasuranirnashi bhaktanam sukhade namah
    | rupam dehi jayam dehi yasho dehi dvisho jahi ||4|| raktabijavadhe devi candamundavinashini | rupam
    dehi jayam dehi yasho dehi dvisho jahi ||5|| shumbhasyaiva nishumbhasya dhumrakshasya ca mardini |
    rupam dehi jayam dehi yasho dehi dvisho jahi ||6|| vanditanaghriyuge devi sarvasaubhagyadayini | rupam
    dehi jayam dehi yasho dehi dvisho jahi ||7|| cintyarupacarite sarvashatruvinashini | rupam dehi jayam
    dehi yasho dehi dvisho jahi ||8|| natebhyah sarvada bhaktya candike duritashahe | rupam dehi jayam
    dehi yasho dehi dvisho jahi ||9|| stuvadabhyo bhaktipurvam tvam candike vyadhinashini | rupam dehi
    jayam dehi yasho dehi dvisho jahi ||10|| candike satatam ye tvamarcayantiha bhaktitah | rupam dehi
    jayam dehi yasho dehi dvisho jahi ||11|| dehi saubhagyammarogyam dehi me paramam sukham | rupam dehi
    jayam dehi yasho dehi dvisho jahi ||12|| vidhehi dvishatam nasham vidhehi balamuccakaih | rupam dehi
    jayam dehi yasho dehi dvisho jahi ||13|| vidhehi devi kalyanam vidhehi paramam shriyam | rupam dehi
    jayam dehi yasho dehi dvisho jahi ||14|| surasurashiroratnanighrishtacarane'mbike | rupam dehi jayam
    dehi yasho dehi dvisho jahi ||15|| vidyavantam yashasvantam lakshmivantam janam kuru | rupam dehi
    jayam dehi yasho dehi dvisho jahi ||16|| pracandadaityadarpaghne candike pranataya me | rupam dehi
    jayam dehi yasho dehi dvisho jahi ||17|| caturbhuje caturvaktrasamstute parameshvari | rupam dehi
    jayam dehi yasho dehi dvisho jahi ||18|| krishnena samstute devi shashvadbhaktya sadambike | rupam
    dehi jayam dehi yasho dehi dvisho jahi ||19|| himacalasutanathasamstute parameshvari | rupam dehi
    jayam dehi yasho dehi dvisho jahi ||20|| indranipatisadbhavapujite parameshvari | rupam dehi jayam
    dehi yasho dehi dvisho jahi ||21|| devi pracandadordandadaityadarpavinashini | rupam dehi jayam dehi
    yasho dehi dvisho jahi ||22|| devi bhaktajanoddamadattanandodaye'mbike | rupam dehi jayam dehi yasho
    dehi dvisho jahi ||23|| patnim manoramam dehi manovrittanusarinim | tarinim durgasamsarasagarasya
    kulodbhavam ||24|| idam stotram pathitva tu mahastotram pathennarah | sa tu saptashatisamkhyavaramapnoti
    sampadam ||25|| iti devya argalastotram sampurnam |
  devanagari: अथार्गलास्तोत्रम् ॐ अस्य श्रीअर्गलास्तोत्रमन्त्रस्य विष्णुऋषिः अनुष्टुप छन्दः श्रीमहालक्ष्मीर्देवता
    श्रीजगदम्बाप्रीतये सप्तशतीपाठाङ्गत्वेन जपे विनियोगः ॥ ॐ नमश्चण्डिकायै ॥ मार्कण्डेय उवाच ॐ जयन्ती मङ्गला
    काली भद्रकाली कपालिनी । दुर्गा क्षमा शिवा धात्री स्वाहा स्वधा नमोऽस्तुते ॥१॥ जय त्वं देवि चामुण्डे
    जय भूतार्तिहारिणि । जय सर्वगते देवि कालरात्रि नमोऽस्तुते ॥२॥ मधुकैटभविद्राविविधातृवरदे नमः । रुपं
    देहि जयं देहि यशो देहि द्विषो जहि ॥३॥ महिषासुरनिर्णाशि भक्तानां सुखदे नमः । रुपं देहि जयं देहि यशो
    देहि द्विषो जहि ॥४॥ रक्तबीजवधे देवि चण्डमुण्डविनाशिनि । रुपं देहि जयं देहि यशो देहि द्विषो जहि ॥५॥
    शुम्भस्यैव निशुम्भस्य धूम्राक्षस्य च मर्दिनि । रुपं देहि जयं देहि यशो देहि द्विषो जहि ॥६॥ वन्दिताङघ्रियुगे
    देवि सर्वसौभाग्यदायिनि । रुपं देहि जयं देहि यशो देहि द्विषो जहि ॥७॥ चिन्त्यरुपचरिते सर्वशत्रुविनाशिनि
    । रुपं देहि जयं देहि यशो देहि द्विषो जहि ॥८॥ नतेभ्यः सर्वदा भक्त्या चण्डिके दुरिताषहे । रुपं देहि
    जयं देहि यशो देहि द्विषो जहि ॥९॥ स्तुवदभ्यो भक्तिपूर्वं त्वां चण्डिके व्याधिनाशिनि । रुपं देहि जयं
    देहि यशो देहि द्विषो जहि ॥१०॥ चण्डिके सततं ये त्वामर्चयन्तीह भक्तितः । रुपं देहि जयं देहि यशो देहि
    द्विषो जहि ॥११॥ देहि सौभाग्यंमारोग्यं देहि मे परमं सुखम् । रुपं देहि जयं देहि यशो देहि द्विषो जहि
    ॥१२॥ विधेहि द्विषतां नाशं विधेहि बलमुच्चकैः । रुपं देहि जयं देहि यशो देहि द्विषो जहि ॥१३॥ विधेहि देवि
    कल्याणं विधेहि परमां श्रियम् । रुपं देहि जयं देहि यशो देहि द्विषो जहि ॥१४॥ सुरासुरशिरोरत्ननिघृष्टचरणेऽम्बिके
    । रुपं देहि जयं देहि यशो देहि द्विषो जहि ॥१५॥ विद्यावन्तं यशस्वन्तं लक्ष्मीवन्तं जनं कुरु । रुपं देहि
    जयं देहि यशो देहि द्विषो जहि ॥१६॥ प्रचण्डदैत्यदर्पघ्ने चण्डिके प्रणताय मे । रुपं देहि जयं देहि यशो
    देहि द्विषो जहि ॥१७॥ चतुर्भुजे चतुर्वक्त्रसंस्तुते परमेश्वरि । रुपं देहि जयं देहि यशो देहि द्विषो
    जहि ॥१८॥ कृष्णेन संस्तुते देवि शश्वद्भक्त्या सदाम्बिके । रुपं देहि जयं देहि यशो देहि द्विषो जहि ॥१९॥
    हिमाचलसुतानाथसंस्तुते परमेश्वरि । रुपं देहि जयं देहि यशो देहि द्विषो जहि ॥२०॥ इन्द्राणीपतिसद्भावपूजिते
    परमेश्वरि । रुपं देहि जयं देहि यशो देहि द्विषो जहि ॥२१॥ देवि प्रचण्डदोर्दण्डदैत्यदर्पविनाशिनि । रुपं
    देहि जयं देहि यशो देहि द्विषो जहि ॥२२॥ देवि भक्तजनोद्दामदत्तानन्दोदयेऽम्बिके । रुपं देहि जयं देहि
    यशो देहि द्विषो जहि ॥२३॥ पत्नीं मनोरमां देहि मनोवृत्तानुसारिणीम् । तारिणीं दुर्गसंसारसागरस्य कुलोद्भवाम्
    ॥२४॥ इदं स्तोत्रं पठित्वा तु महास्तोत्रं पठेन्नरः । स तु सप्तशतीसंख्यावरमाप्नोति सम्पदाम् ॥२५॥ इति
    देव्या अर्गलास्तोत्रं सम्पूर्णम् ।
