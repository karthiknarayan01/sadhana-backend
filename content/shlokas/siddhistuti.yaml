id: siddhistuti
category: stotram
name:
  english: siddhistuti
  devanagari: सिद्धिस्तुति
content:
  english: lakshyalakshmi namo'stu te || yah shrih padvane kadambashikhare rajagrihe kumjare shvete cashvayute
    vrishe ca yugale yajne ca yupasthite | shamkhe devakule narendrabhavane gamgatate gokule ya shristishthati
    sarvada mama grihe bhuyat sada nishcala || ya sa padmasanastha vipulakatitati padmapatrayatakshi gambhiravartanabhih
    stanabharanamita shuddhavastrottariya | lakshmirdivyairgajendrairmaniganakhacitaih snapita hemakumbhai
  devanagari: लक्ष्यलक्ष्मि नमोऽस्तु ते ॥ याः श्रीः पद्वने कदम्बशिखरे राजगृहे कुंजरे श्वेते चाश्वयुते
    वृषे च युगले यज्ञे च यूपस्थिते । शंखे देवकुले नरेन्द्रभवने गंगातटे गोकुले या श्रीस्तिष्ठति सर्वदा
    मम गृहे भूयात् सदा निश्चला ॥ या सा पद्मासनस्था विपुलकटितटी पद्मपत्रायताक्षी गम्भीरावर्तनाभिः स्तनभरनमिता
    शुद्धवस्त्रोत्तरीया । लक्ष्मिर्दिव्यैर्गजेन्द्रैर्मणिगणखचितैः स्नापिता हेमकुम्भै
meaning: {}
