    तुम्हहि रघुनन्दन। जानहिं भगत भगत उर चन्दन ॥ चिदानन्दमय देह तुम्हारी। बिगत बिकार जान अधिकारी ॥ नर तनु
    धरेहु सन्त सुर काजा। कहहु करहु जस प्राकृत राजा ॥ राम देखि सुनि चरित तुम्हारे। जड़ मोहहिं बुध होहिं
    सुखारे ॥ तुम्ह जो कहहु करहु सबु साँचा। जस काछिअ तस चाहिअ नाचा ॥ दो पूँछेहु मोहि कि रहौं कहँ मैं पूँछत
    सकुचाउँ। जहँ न होहु तहँ देहु कहि तुम्हहि देखावौं ठाउँ ॥ ॥ सुनि मुनि बचन प्रेम रस साने। सकुचि राम मन
    महुँ मुसुकाने ॥ बालमीकि हँसि कहहिं बहोरी। बानी मधुर अमिअ रस बोरी ॥ सुनहु राम अब कहुँ निकेता। जहाँ
    बसहु सिय लखन समेता ॥ जिन्ह के श्रवन समुद्र समाना। कथा तुम्हारि सुभग सरि नाना ॥ भरहिं निरन्तर होहिं
    न पूरे। तिन्ह के हिय तुम्ह कहुँ गृह रूरे ॥ लोचन चातक जिन्ह करि राखे। रहहिं दरस जलधर अभिलाषे ॥ निदरहिं
    सरित सिन्धु सर भारी। रूप बिन्दु जल होहिं सुखारी ॥ तिन्ह के हृदय सदन सुखदायक। बसहु बन्धु सिय सह रघुनायक
    ॥ दो जसु तुम्हार मानस बिमल हंसिनि जीहा जासु। मुकुताहल गुन गन चुनि राम बसहु हियँ तासु ॥ ॥ प्रभु प्रसाद
    सुचि सुभग सुबासा। सादर जासु लहि नित नासा ॥ तुम्हहि निबेदित भोजन करहीं। प्रभु प्रसाद पट भूषन धरहीम्
    ॥ सीस नवहिं सुर गुरु द्विज देखी। प्रीति सहित करि बिनय बिसेषी ॥ कर नित करहिं राम पद पूजा। राम भरोस
    हृदयँ नहि दूजा ॥ चरन राम तीरथ चलि जाहीं। राम बसहु तिन्ह के मन माहीम् ॥ मन्त्रराजु नित जपहिं तुम्हारा।
    पूजहिं तुम्हहि सहित परिवारा ॥ तरपन होम करहिं बिधि नाना। बिप्र जेवाँइ देहिं बहु दाना ॥ तुम्ह तें अधिक
    गुरहि जियँ जानी। सकल भायँ सेवहिं सनमानी ॥ दो सबु करि मागहिं एक फलु राम चरन रति हौ। तिन्ह कें मन मन्दिर
    बसहु सिय रघुनन्दन दौ ॥ ॥ काम कोह मद मान न मोहा। लोभ न छोभ न राग न द्रोहा ॥ जिन्ह कें कपट दम्भ नहिं
    माया। तिन्ह कें हृदय बसहु रघुराया ॥ सब के प्रिय सब के हितकारी। दुख सुख सरिस प्रसंसा गारी ॥ कहहिं सत्य
    प्रिय बचन बिचारी। जागत सोवत सरन तुम्हारी ॥ तुम्हहि छाड़इ गति दूसरि नाहीं। राम बसहु तिन्ह के मन माहीम्
    ॥ जननी सम जानहिं परनारी। धनु पराव बिष तें बिष भारी ॥ जे हरषहिं पर सम्पति देखी। दुखित होहिं पर बिपति
    बिसेषी ॥ जिन्हहि राम तुम्ह प्रानपिआरे। तिन्ह के मन सुभ सदन तुम्हारे ॥ दो स्वामि सखा पितु मातु गुर
    जिन्ह के सब तुम्ह तात। मन मन्दिर तिन्ह कें बसहु सीय सहित दौ भ्रात ॥ ॥ अवगुन तजि सब के गुन गहहीं। बिप्र
    धेनु हित सङ्कट सहहीम् ॥ नीति निपुन जिन्ह कि जग लीका। घर तुम्हार तिन्ह कर मनु नीका ॥ गुन तुम्हार समुझि
    निज दोसा। जेहि सब भाँति तुम्हार भरोसा ॥ राम भगत प्रिय लागहिं जेही। तेहि उर बसहु सहित बैदेही ॥ जाति
    पाँति धनु धरम बड़आई। प्रिय परिवार सदन सुखदाई ॥ सब तजि तुम्हहि रहि उर लाई। तेहि के हृदयँ रहहु रघुराई
    ॥ सरगु नरकु अपबरगु समाना। जहँ तहँ देख धरें धनु बाना ॥ करम बचन मन राउर चेरा। राम करहु तेहि कें उर डेरा
    ॥ दो जाहि न चाहिअ कबहुँ कछु तुम्ह सन सहज सनेहु। बसहु निरन्तर तासु मन सो राउर निज गेहु ॥ ॥ एहि बिधि
    मुनिबर भवन देखाए। बचन सप्रेम राम मन भाए ॥ कह मुनि सुनहु भानुकुलनायक। आश्रम कहुँ समय सुखदायक ॥ चित्रकूट
    गिरि करहु निवासू। तहँ तुम्हार सब भाँति सुपासू ॥ सैलु सुहावन कानन चारू। करि केहरि मृग बिहग बिहारू ॥
    नदी पुनीत पुरान बखानी। अत्रिप्रिया निज तपबल आनी ॥ सुरसरि धार नाउँ मन्दाकिनि। जो सब पातक पोतक डाकिनि
    ॥ अत्रि आदि मुनिबर बहु बसहीं। करहिं जोग जप तप तन कसहीम् ॥ चलहु सफल श्रम सब कर करहू। राम देहु गौरव
    गिरिबरहू ॥ दो चित्रकूट महिमा अमित कहीं महामुनि गाइ। आए नहाए सरित बर सिय समेत दौ भाइ ॥ ॥ रघुबर कहेउ
    लखन भल घाटू। करहु कतहुँ अब ठाहर ठाटू ॥ लखन दीख पय उतर करारा। चहुँ दिसि फिरेउ धनुष जिमि नारा ॥ नदी
    पनच सर सम दम दाना। सकल कलुष कलि साउज नाना ॥ चित्रकूट जनु अचल अहेरी। चुकि न घात मार मुठभेरी ॥ अस कहि
    लखन ठाउँ देखरावा। थलु बिलोकि रघुबर सुखु पावा ॥ रमेउ राम मनु देवन्ह जाना। चले सहित सुर थपति प्रधाना
    ॥ कोल किरात बेष सब आए। रचे परन तृन सदन सुहाए ॥ बरनि न जाहि मञ्जु दुइ साला। एक ललित लघु एक बिसाला ॥
    दो लखन जानकी सहित प्रभु राजत रुचिर निकेत। सोह मदनु मुनि बेष जनु रति रितुराज समेत ॥ सत्रहँवा विश्राम
    अमर नाग किन्नर दिसिपाला। चित्रकूट आए तेहि काला ॥ राम प्रनामु कीन्ह सब काहू। मुदित देव लहि लोचन लाहू
    ॥ बरषि सुमन कह देव समाजू। नाथ सनाथ भे हम आजू ॥ करि बिनती दुख दुसह सुनाए। हरषित निज निज सदन सिधाए ॥
    चित्रकूट रघुनन्दनु छाए। समाचार सुनि सुनि मुनि आए ॥ आवत देखि मुदित मुनिबृन्दा। कीन्ह दण्डवत रघुकुल
    चन्दा ॥ मुनि रघुबरहि लाइ उर लेहीं। सुफल होन हित आसिष देहीम् ॥ सिय सौमित्र राम छबि देखहिं। साधन सकल
    सफल करि लेखहिम् ॥ दो जथाजोग सनमानि प्रभु बिदा किए मुनिबृन्द। करहि जोग जप जाग तप निज आश्रमन्हि सुछन्द
    ॥ ॥ यह सुधि कोल किरातन्ह पाई। हरषे जनु नव निधि घर आई ॥ कन्द मूल फल भरि भरि दोना। चले रङ्क जनु लूटन
    सोना ॥ तिन्ह महँ जिन्ह देखे दौ भ्राता। अपर तिन्हहि पूँछहि मगु जाता ॥ कहत सुनत रघुबीर निकाई। आइ सबन्हि
    देखे रघुराई ॥ करहिं जोहारु भेण्ट धरि आगे। प्रभुहि बिलोकहिं अति अनुरागे ॥ चित्र लिखे जनु जहँ तहँ ठाढ़ए।
    पुलक सरीर नयन जल बाढ़ए ॥ राम सनेह मगन सब जाने। कहि प्रिय बचन सकल सनमाने ॥ प्रभुहि जोहारि बहोरि बहोरी।
    बचन बिनीत कहहिं कर जोरी ॥ दो अब हम नाथ सनाथ सब भे देखि प्रभु पाय। भाग हमारे आगमनु राउर कोसलराय ॥ ॥
    धन्य भूमि बन पन्थ पहारा। जहँ जहँ नाथ पाउ तुम्ह धारा ॥ धन्य बिहग मृग काननचारी। सफल जनम भे तुम्हहि निहारी
    ॥ हम सब धन्य सहित परिवारा। दीख दरसु भरि नयन तुम्हारा ॥ कीन्ह बासु भल ठाउँ बिचारी। इहाँ सकल रितु रहब
    सुखारी ॥ हम सब भाँति करब सेवकाई। करि केहरि अहि बाघ बराई ॥ बन बेहड़ गिरि कन्दर खोहा। सब हमार प्रभु
    पग पग जोहा ॥ तहँ तहँ तुम्हहि अहेर खेलाउब। सर निरझर जलठाउँ देखाउब ॥ हम सेवक परिवार समेता। नाथ न सकुचब
    आयसु देता ॥ दो बेद बचन मुनि मन अगम ते प्रभु करुना ऐन। बचन किरातन्ह के सुनत जिमि पितु बालक बैन ॥ ॥
    रामहि केवल प्रेमु पिआरा। जानि लेउ जो जाननिहारा ॥ राम सकल बनचर तब तोषे। कहि मृदु बचन प्रेम परिपोषे
    ॥ बिदा किए सिर नाइ सिधाए। प्रभु गुन कहत सुनत घर आए ॥ एहि बिधि सिय समेत दौ भाई। बसहिं बिपिन सुर मुनि
    सुखदाई ॥ जब ते आइ रहे रघुनायकु। तब तें भयु बनु मङ्गलदायकु ॥ फूलहिं फलहिं बिटप बिधि नाना ॥ मञ्जु बलित
    बर बेलि बिताना ॥ सुरतरु सरिस सुभायँ सुहाए। मनहुँ बिबुध बन परिहरि आए ॥ गञ्ज मञ्जुतर मधुकर श्रेनी। त्रिबिध
    बयारि बहि सुख देनी ॥ दो नीलकण्ठ कलकण्ठ सुक चातक चक्क चकोर। भाँति भाँति बोलहिं बिहग श्रवन सुखद चित
    चोर ॥ ॥ केरि केहरि कपि कोल कुरङ्गा। बिगतबैर बिचरहिं सब सङ्गा ॥ फिरत अहेर राम छबि देखी। होहिं मुदित
    मृगबन्द बिसेषी ॥ बिबुध बिपिन जहँ लगि जग माहीं। देखि राम बनु सकल सिहाहीम् ॥ सुरसरि सरसि दिनकर कन्या।
    मेकलसुता गोदावरि धन्या ॥ सब सर सिन्धु नदी नद नाना। मन्दाकिनि कर करहिं बखाना ॥ उदय अस्त गिरि अरु कैलासू।
    मन्दर मेरु सकल सुरबासू ॥ सैल हिमाचल आदिक जेते। चित्रकूट जसु गावहिं तेते ॥ बिन्धि मुदित मन सुखु न समाई।
    श्रम बिनु बिपुल बड़आई पाई ॥ दो चित्रकूट के बिहग मृग बेलि बिटप तृन जाति। पुन्य पुञ्ज सब धन्य अस कहहिं
    देव दिन राति ॥ ॥ नयनवन्त रघुबरहि बिलोकी। पाइ जनम फल होहिं बिसोकी ॥ परसि चरन रज अचर सुखारी। भे परम
    पद के अधिकारी ॥ सो बनु सैलु सुभायँ सुहावन। मङ्गलमय अति पावन पावन ॥ महिमा कहिअ कवनि बिधि तासू। सुखसागर
    जहँ कीन्ह निवासू ॥ पय पयोधि तजि अवध बिहाई। जहँ सिय लखनु रामु रहे आई ॥ कहि न सकहिं सुषमा जसि कानन।
    जौं सत सहस होंहिं सहसानन ॥ सो मैं बरनि कहौं बिधि केहीं। डाबर कमठ कि मन्दर लेहीम् ॥ सेवहिं लखनु करम
    मन बानी। जाइ न सीलु सनेहु बखानी ॥ दो छिनु छिनु लखि सिय राम पद जानि आपु पर नेहु। करत न सपनेहुँ लखनु
    चितु बन्धु मातु पितु गेहु ॥ ॥ राम सङ्ग सिय रहति सुखारी। पुर परिजन गृह सुरति बिसारी ॥ छिनु छिनु पिय
    बिधु बदनु निहारी। प्रमुदित मनहुँ चकोरकुमारी ॥ नाह नेहु नित बढ़त बिलोकी। हरषित रहति दिवस जिमि कोकी
    ॥ सिय मनु राम चरन अनुरागा। अवध सहस सम बनु प्रिय लागा ॥ परनकुटी प्रिय प्रियतम सङ्गा। प्रिय परिवारु
    कुरङ्ग बिहङ्गा ॥ सासु ससुर सम मुनितिय मुनिबर। असनु अमिअ सम कन्द मूल फर ॥ नाथ साथ साँथरी सुहाई। मयन
    सयन सय सम सुखदाई ॥ लोकप होहिं बिलोकत जासू। तेहि कि मोहि सक बिषय बिलासू ॥ दो सुमिरत रामहि तजहिं जन
    तृन सम बिषय बिलासु। रामप्रिया जग जननि सिय कछु न आचरजु तासु ॥ ॥ सीय लखन जेहि बिधि सुखु लहहीं। सोइ रघुनाथ
    करहि सोइ कहहीम् ॥ कहहिं पुरातन कथा कहानी। सुनहिं लखनु सिय अति सुखु मानी। जब जब रामु अवध सुधि करहीं।
    तब तब बारि बिलोचन भरहीम् ॥ सुमिरि मातु पितु परिजन भाई। भरत सनेहु सीलु सेवकाई ॥ कृपासिन्धु प्रभु होहिं
    दुखारी। धीरजु धरहिं कुसमु बिचारी ॥ लखि सिय लखनु बिकल होइ जाहीं। जिमि पुरुषहि अनुसर परिछाहीम् ॥ प्रिया
