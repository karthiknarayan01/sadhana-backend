id: sharadadevistotram-5
category: stotram
name:
  english: sharadadevistotram 5
  devanagari: शारदादेवीस्तोत्रम् ५
content:
  english: tadbhashya rupini tu ya | mahasanghasya janani varenya gururupini stri ratnabhuta ya devi sharadam
    tam namamyaham || 4|| martyanam jananim devimakhilartipranashinim sadasaccetare jiva ye'nye kripabhilashukah
    | yatkripadrishtimatrena dhanyah sarve'bhavanniha sarvajivaprasum devim sharadam tam smaramyaham ||
    5|| amritabhashinim devim shravanasukhadam tatha susmitavadanam caiva
  devanagari: तद्भाष्य रूपिणी तु या । महासङ्घस्य जननी वरेण्या गुरुरूपिणी स्त्री रत्नभूता या देवी शारदां
    तां नमाम्यहम् ॥ ४॥ मर्त्यानां जननीं देवीमखिलार्तिप्रणाशिनीम् सदसच्चेतरे जीवा येऽन्ये कृपाभिलाषुकाः
    । यत्कृपादृष्टिमात्रेण धन्याः सर्वेऽभवन्निह सर्वजीवप्रसूं देवीं शारदां तां स्मराम्यहम् ॥ ५॥ अमृतभाषिणीं
    देवीं श्रवणसुखदां तथा सुस्मितवदनां चैव
meaning: {}
