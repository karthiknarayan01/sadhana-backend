id: shraddha-suktam
category: stotram
name:
  english: Shraddha Suktam
content:
  english: ssamidhyate | shraddhaya vindate havih | shraddha mbhagasya murdhani | vacasa ''vedayamasi
    | priyagg shraddhe dadatah | priyagg shraddhe didasatah | priya mbhojeshu yajvasu || ida nkridhi |
    yatha deva asureshu | shraddhamugreshu cakrire | eva mbhojeshu yajvasu | asmakamudita ndeva yajamanah
    | vayugopa upasate | shraddhagm hridayyaya tya | shraddhaya huyate havih | shraddha mpari | shraddhagm
    suryasya nimrici | shraddhe shraddhapayeha ma | shraddha devanadhivaste | shraddha vishvamida | havisha
    vardhayamasi |
  devanagari: स्समि॑ध्यते । श्र॒द्धया॑ विन्दते ह॒विः । श्र॒द्धा म्भग॑स्य मू॒र्धनि॑ । वच॒सा ऽऽवे॑दयामसि
    । प्रि॒यग्ग् श्र॑द्धे॒ दद॑तः । प्रि॒यग्ग् श्र॑द्धे॒ दिदा॑सतः । प्रि॒य म्भो॒जेषु॒ यज्व॑सु ॥ इ॒द ङ्कृ॑धि
    । यथा॑ दे॒वा असु॑रेषु । श्र॒द्धामु॒ग्रेषु॑ चक्रि॒रे । ए॒व म्भो॒जेषु॒ यज्व॑सु । अ॒स्माक॑मुदि॒त न्दे॑वा॒
    यज॑मानाः । वा॒युगो॑पा॒ उपा॑सते । श्र॒द्धाग्ं हृ॑द॒य्य॑या त्या । श्र॒द्धया॑ हूयते ह॒विः । श्र॒द्धा
    म्परि॑ । श्र॒द्धाग्ं सूर्य॑स्य नि॒मृचि॑ । श्रद्धे॒ श्रद्धा॑पये॒ह मा । श्र॒द्धा दे॒वानधि॑वस्ते । श्र॒द्धा
    विश्व॑मि॒द । ह॒विषा॑ वर्धयामसि ।
