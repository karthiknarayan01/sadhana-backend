id: devaihkritam1ganeshastotram
category: stotram
name:
  english: devaihkritam1ganeshastotram
  devanagari: देवैःकृतं१गणेशस्तोत्रम्
content:
  english: '| ato''vadansurasanghah kritarthah sadyojatam vighnarajam namantah || 9|| yo maturutsangagato''tha
    matra nivaryamano''pi balacca candram | sangopayamasa piturjatasu ganadhinathasya vinoda eshah ||
    10|| papau stanam maturathapi tripto yo bhratrimatsaryakashayabuddhih | lambodarastvam bhava vighnarajo
    lambodaram nama cakara shambhuh || 11|| samveshtito devaganairmaheshah pravartatam nrityamitityuvaca
    | santoshito nupuraravamatradganeshvaratve''bhishisheca putram || 12|| yo vighnapasham ca karena bibhratskandhe
    kutharam ca tatha parena | apujito vighnamatho''pi matuh karoti ko vighnapateh samo''nyah || 13||
    dharmarthakamadishu purvapujyo devasuraih pujyata eva nityam | yasyarcanam naiva vinashamasti tam
    purvapujyam prathamam namami || 14|| yasyarcanatprarthanaya''nurupam drishtva tu sarvasya phalasya
    siddhim | svatantrasamarthyakritatigarvam bhratripriyam tvakhuratham tamide || 15|| yo mataram sarasairnrityagitaistatha''bhilashairakhilairvinodaih
    | santoshayamasa tada''titushtam tam shriganesham sharanam prapadye || 16|| suropakarairasuraishca
    yuddhaih stotrairnamaskaraparaishca mantraih | pitriprasadena sada samriddham tam shriganesham sharanam
    prapadye || 17|| jaye puranamakarotpratipam pitra''pi harshatpratipujito yah | nirvighnatam capi punashcakara
    tasmai ganeshaya namaskaromi || 18|| iti brahmapurane caturdashadhikashatatamadhyayantargatam devaih
    kritam ganeshastotram samaptam | brahmapurana | adhyaya 114'
  devanagari: । अतोऽवदन्सुरसङ्घाः कृतार्थाः सद्योजातं विघ्नराजं नमन्तः ॥ ९॥ यो मातुरुत्सङ्गगतोऽथ मात्रा
    निवार्यमाणोऽपि बलाच्च चन्द्रम् । सङ्गोपयामास पितुर्जटासु गणाधिनाथस्य विनोद एषः ॥ १०॥ पपौ स्तनं मातुरथापि
    तृप्तो यो भ्रातृमात्सर्यकषायबुद्धिः । लम्बोदरस्त्वं भव विघ्नराजो लम्बोदरं नाम चकार शम्भुः ॥ ११॥ संवेष्टितो
    देवगणैर्महेशः प्रवर्ततां नृत्यमितीत्युवाच । सन्तोषितो नूपुररावमात्राद्गणेश्वरत्वेऽभिषिषेच पुत्रम्
    ॥ १२॥ यो विघ्नपाशं च करेण बिभ्रत्स्कन्धे कुठारं च तथा परेण । अपूजितो विघ्नमथोऽपि मातुः करोति को विघ्नपतेः
    समोऽन्यः ॥ १३॥ धर्मार्थकामादिषु पूर्वपूज्यो देवासुरैः पूज्यत एव नित्यम् । यस्यार्चनं नैव विनाशमस्ति
    तं पूर्वपूज्यं प्रथमं नमामि ॥ १४॥ यस्यार्चनात्प्रार्थनयाऽनुरूपां दृष्ट्वा तु सर्वस्य फलस्य सिद्धिम्
    । स्वतन्त्रसामर्थ्यकृतातिगर्वं भ्रातृप्रियं त्वाखुरथं तमीडे ॥ १५॥ यो मातरं सरसैर्नृत्यगीतैस्तथाऽभिलाषैरखिलैर्विनोदैः
    । सन्तोषयामास तदाऽतितुष्टं तं श्रीगणेशं शरणं प्रपद्ये ॥ १६॥ सुरोपकारैरसुरैश्च युद्धैः स्तोत्रैर्नमस्कारपरैश्च
    मन्त्रैः । पितृप्रसादेन सदा समृद्धं तं श्रीगणेशं शरणं प्रपद्ये ॥ १७॥ जये पुराणामकरोत्प्रतीपं पित्राऽपि
    हर्षात्प्रतिपूजितो यः । निर्विघ्नतां चापि पुनश्चकार तस्मै गणेशाय नमस्करोमि ॥ १८॥ इति ब्रह्मपुराणे
    चतुर्दशाधिकशततमाध्यायान्तर्गतं देवैः कृतं गणेशस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय ११४
