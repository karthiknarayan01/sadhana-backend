id: narayaniyam-dashaka-60
category: stotram
name:
  english: Narayaniyam Dashaka 60
content:
  english: madanaturacetaso'nvaham bhavadanghridvayadasyakamyaya | yamunatatasimni saikatim taralakshyo
    girijam samarcican || || tava namakatharatah samam sudrishah pratarupagata nadim | upaharashatairapujayan
    dayito nandasuto bhavediti || || iti masamupahitavratastaralakshirabhivikshya ta bhavan | karunamridulo
    naditatam samayasittadanugrahecchaya || || niyamavasitau nijambaram tatasimanyavamucya tastada | yamunajalakhelanakulah
    puratastvamavalokya lajjitah || || trapaya namitananasvatho vanitasvambarajalamantike | nihitam parigrihya
    bhuruho vitapam tvam tarasa'dhirudhavan || || iha tavadupetya niyatam vasanam vah sudrisho yathayatham
    | iti narmamridusmite tvayi bruvati vyamumuhe vadhujanaih || || ayi jiva ciram kishora nastava dasiravashikaroshi
    kim | pradishambaramambujekshanetyuditastvam smitameva dattavan || || adhiruhya tatam kritanjalih
    parishuddhah svagatirnirikshya tah | vasananyakhilanyanugraham punarevam giramapyada muda || || viditam
    nanu vo manishitam vaditarastviha yogyamuttaram | yamunapuline sacandrikah kshanada ityabalastvamucivan
    || || upakarnya bhavanmukhacyutam madhunishyandi vaco mrigidrishah | pranayadayi vikshya vikshya te
    vadanabjam shanakairgriham gatah || || iti nanvanugrihya vallavirvipinanteshu pureva sancaran | karunashishiro
    hare hara tvaraya me sakalamayavalim ||
  devanagari: मदनातुरचेतसोऽन्वहं भवदङ्घ्रिद्वयदास्यकाम्यया । यमुनातटसीम्नि सैकतीं तरलाक्ष्यो गिरिजां समार्चिचन्
    ॥ ॥ तव नामकथारताः समं सुदृशः प्रातरुपागता नदीम् । उपहारशतैरपूजयन् दयितो नन्दसुतो भवेदिति ॥ ॥ इति मासमुपाहितव्रतास्तरलाक्षीरभिवीक्ष्य
    ता भवान् । करुणामृदुलो नदीतटं समयासीत्तदनुग्रहेच्छया ॥ ॥ नियमावसितौ निजाम्बरं तटसीमन्यवमुच्य तास्तदा
    । यमुनाजलखेलनाकुलाः पुरतस्त्वामवलोक्य लज्जिताः ॥ ॥ त्रपया नमिताननास्वथो वनितास्वम्बरजालमन्तिके । निहितं
    परिगृह्य भूरुहो विटपं त्वं तरसाऽधिरूढवान् ॥ ॥ इह तावदुपेत्य नीयतां वसनं वः सुदृशो यथायथम् । इति नर्ममृदुस्मिते
    त्वयि ब्रुवति व्यामुमुहे वधूजनैः ॥ ॥ अयि जीव चिरं किशोर नस्तव दासीरवशीकरोषि किम् । प्रदिशाम्बरमम्बुजेक्षणेत्युदितस्त्वं
    स्मितमेव दत्तवान् ॥ ॥ अधिरुह्य तटं कृताञ्जलीः परिशुद्धाः स्वगतीर्निरीक्ष्य ताः । वसनान्यखिलान्यनुग्रहं
    पुनरेवं गिरमप्यदा मुदा ॥ ॥ विदितं ननु वो मनीषितं वदितारस्त्विह योग्यमुत्तरम् । यमुनापुलिने सचन्द्रिकाः
    क्षणदा इत्यबलास्त्वमूचिवान् ॥ ॥ उपकर्ण्य भवन्मुखच्युतं मधुनिष्यन्दि वचो मृगीदृशः । प्रणयादयि वीक्ष्य
    वीक्ष्य ते वदनाब्जं शनकैर्गृहं गताः ॥ ॥ इति नन्वनुगृह्य वल्लवीर्विपिनान्तेषु पुरेव सञ्चरन् । करुणाशिशिरो
    हरे हर त्वरया मे सकलामयावलिम् ॥
