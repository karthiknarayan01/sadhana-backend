id: tvameva-mata
category: stotra
name:
  english: Tvameva Mata
  devanagari: त्वमेव माता
content:
  english: >-
    tvameva mata cha pita tvameva, tvameva bandhush cha sakha
    tvameva, tvameva vidya dravinam tvameva, tvameva sarvam mama
    deva deva
  devanagari: >-
    त्वमेव माता च पिता त्वमेव त्वमेव बन्धुश्च सखा त्वमेव । त्वमेव
    विद्या द्रविणं त्वमेव त्वमेव सर्वं मम देव देव ॥
meaning:
  english: >-
    You alone are my mother and father, you alone are my kin and
    friend, you alone are my knowledge and wealth — you alone are
    everything to me, O Lord.
source_attribution:
  text_source: Traditional Sanskrit prayer verse of unknown authorship, widely recited
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
