id: chandra-ashtottara-sata-namavali
category: stotram
name:
  english: Chandra Ashtottara Sata Namavali
content:
  english: om shashadharaya namah | om candraya namah | om taradhishaya namah | om nishakaraya namah |
    om sudhanidhaye namah | om sadaradhyaya namah | om satpataye namah | om sadhupujitaya namah | om jitendriyaya
    namah || || om jagadyonaye namah | om jyotishcakrapravartakaya namah | om vikartananujaya namah |
    om viraya namah | om vishveshaya namah | om vidushampataye namah | om doshakaraya namah | om dushtaduraya
    namah | om pushtimate namah | om shishtapalakaya namah || || om ashtamurtipriyaya namah | om anantaya
    namah | om kashtadarukutharakaya namah | om svaprakashaya namah | om prakashatmane namah | om dyucaraya
    namah | om devabhojanaya namah | om kaladharaya namah | om kalahetave namah | om kamakrite namah ||
    || om kamadayakaya namah | om mrityusamharakaya namah | om amartyaya namah | om nityanushthanadayakaya
    namah | om kshapakaraya namah | om kshinapapaya namah | om kshayavriddhisamanvitaya namah | om jaivatrikaya
    namah | om shucaye namah | om shubhraya namah || || om jayine namah | om jayaphalapradaya namah |
    om sudhamayaya namah | om surasvamine namah | om bhaktanamishtadayakaya namah | om bhuktidaya namah
    | om muktidaya namah | om bhadraya namah | om bhaktadaridryabhanjakaya namah | om samaganapriyaya
    namah || || om sarvarakshakaya namah | om sagarodbhavaya namah | om bhayantakrite namah | om bhaktigamyaya
    namah | om bhavabandhavimocakaya namah | om jagatprakashakiranaya namah | om jagadanandakaranaya namah
    | om nissapatnaya namah | om niraharaya namah | om nirvikaraya namah || || om niramayaya namah | om
    bhucchaya''cchaditaya namah | om bhavyaya namah | om bhuvanapratipalakaya namah | om sakalartiharaya
    namah | om saumyajanakaya namah | om sadhuvanditaya namah | om sarvagamajnaya namah | om sarvajnaya
    namah | om sanakadimunistutaya namah || || om sitacchatradhvajopetaya namah | om sitangaya namah |
    om sitabhushanaya namah | om shvetamalyambaradharaya namah | om shvetagandhanulepanaya namah | om
    dashashvarathasamrudhaya namah | om dandapanaye namah | om dhanurdharaya namah | om kundapushpojjvalakaraya
    namah | om nayanabjasamudbhavaya namah || || om atreyagotrajaya namah | om atyantavinayaya namah |
    om priyadayakaya namah | om karunarasasampurnaya namah | om karkataprabhave namah | om avyayaya namah
    | om caturashrasanarudhaya namah | om caturaya namah | om divyavahanaya namah | om vivasvanmandalagneyavasase
    namah || || om vasusamriddhidaya namah | om maheshvarapriyaya namah | om dantaya namah | om merugotrapradakshinaya
    namah | om grahamandalamadhyasthaya namah | om grasitarkaya namah | om grahadhipaya namah | om dvijarajaya
    namah | om dyutilakaya namah | om dvibhujaya namah || || om dvijapujitaya namah | om audumbaranagavasaya
    namah | om udaraya namah | om rohinipataye namah | om nityodayaya namah | om munistutyaya namah |
    om nityanandaphalapradaya namah | om sakalahladanakaraya namah || || om palashasamidhapriyaya namah
