id: devaihkritam23shivastotram
category: stotram
name:
  english: devaihkritam23shivastotram
  devanagari: देवैःकृतं२३शिवस्तोत्रम्
content:
  english: devaih kritam 23 shivastotram deva ucuh | namaste devadevesha bhaktanamabhayankara | namaste
    sarvavasaya sarvayajnamayaya ca || 24|| sarveshvaraya devaya paramajyotishe namah | namah sthulaya
    sukshmaya jnanagamyaya vedhase || 25|| tryambakaya ca bhimaya pinakavarapanaye | tvayi sarvamidam
    protam sutre manigana iva || 26|| samsare vibudhashreshtha jagatsthavarajangamam | na tadasti triloke'sminsusukshmamapi
    shankara | yattvaya na prabho vyaptam srishtisamharakaranat || 27|| prithivyadini bhutani tvaya srishtani
    kamatah | yasyanti tani bhuyo'pi tava kaye jagatpate || 28|| prasida bhagavamstasmallingametatsureshvara
    | sthane sthapaya bhadram te yavanna syatprajakshayah || 29|| iti shriskandapurane prabhasakhande
    arbudakhande ekonacatvarimshadhyayantargatam devaih kritam shivastotram samaptam | skandapurana |
    prabhasakhanda | arbudakhanda | adhyaya 39
  devanagari: देवैः कृतं २३ शिवस्तोत्रम् देवा ऊचुः । नमस्ते देवदेवेश भक्तानामभयङ्कर । नमस्ते सर्ववासाय
    सर्वयज्ञमयाय च ॥ २४॥ सर्वेश्वराय देवाय परमज्योतिषे नमः । नमः स्थूलाय सूक्ष्माय ज्ञानगम्याय वेधसे ॥
    २५॥ त्र्यम्बकाय च भीमाय पिनाकवरपाणये । त्वयि सर्वमिदं प्रोतं सूत्रे मणिगणा इव ॥ २६॥ संसारे विबुधश्रेष्ठ
    जगत्स्थावरजङ्गमम् । न तदस्ति त्रिलोकेऽस्मिन्सुसूक्ष्ममपि शङ्कर । यत्त्वया न प्रभो व्याप्तं सृष्टिसंहारकारणात्
    ॥ २७॥ पृथिव्यादीनि भूतानि त्वया सृष्टानि कामतः । यास्यन्ति तानि भूयोऽपि तव काये जगत्पते ॥ २८॥ प्रसीद
    भगवंस्तस्माल्लिङ्गमेतत्सुरेश्वर । स्थाने स्थापय भद्रं ते यावन्न स्यात्प्रजाक्षयः ॥ २९॥ इति श्रीस्कन्दपुराणे
    प्रभासखण्डे अर्बुदखण्डे एकोनचत्वारिंशाध्यायान्तर्गतं देवैः कृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण
    । प्रभासखण्ड । अर्बुदखण्ड । अध्याय ३९
