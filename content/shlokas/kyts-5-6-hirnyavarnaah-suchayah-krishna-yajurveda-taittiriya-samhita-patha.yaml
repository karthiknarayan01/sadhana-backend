    छग॒लः क॒ल्माषः॑ किकिदी॒विर्वि॑दी॒गय॒स्ते त्वा॒ष्ट्रा स्सौ॒रीर्नव॑ श्वे॒ता व॒शा अ॑नूब॒न्ध्या॑ भवन्त्याग्ने॒य
    ऐ श्वि॒नस्ते वि॑शालयू॒प आ ल॑भ्यन्ते ॥ पि॒शङ्गा॒स्त्रयो॑ वास॒न्ता स्सा॒रङ्गा॒स्त्रयो॒ ग्रैष्माः॒ पृष॑न्त॒स्त्रयो॒
    वार् षि॑काः॒ पृश्न॑य॒स्त्रयः॑ शार॒दाः पृ॑श्ञिस॒क्था स्त्रयो॒ हैम॑न्तिका अवलि॒प्तास्त्रयः॑ शैशि॒रा
    वँथ्स॒राय॒ निव॑क्षसः ॥ रोहि॑तः कृ॒ष्णा धू॒म्रल॑लामाः॒ पृश्ञिः॑ श्या॒मा अ॑रु॒णल॑लामाः स्सि॒द्ध्मा धा॒त्रे
    पौ॒ष्णा क॒र्णा ब॒भ्रुल॑लामाः इन्द्रा॑य कृ॒ष्णाल॑लामा॒ अदि॑त्यै॒ रोहि॑त ललामः र॒वग्नेर्वै दी॒क्षया॑
