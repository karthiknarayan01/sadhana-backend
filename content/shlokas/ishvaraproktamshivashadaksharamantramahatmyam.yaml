id: ishvaraproktamshivashadaksharamantramahatmyam
category: mantra
name:
  english: ishvaraproktamshivashadaksharamantramahatmyam
  devanagari: ईश्वरप्रोक्तंशिवषडक्षरमन्त्रमाहात्म्यम्
content:
  english: rinu || 6|| vede shivagame cayam ubhayatra shadaksharah | mantrasthitah sada mukhyo loke pancaksharah
    smritah || 7|| sarvamantradhikashcayamonkaradyah shadaksharah | sarvesham shivabhaktanamashesharthaprasadhakah
    || 8|| tadalpaksharamarthadhyam vedasaram vimuktidam | ajnasiddhamasandigdham vakyametacchivatmakam
    || 9|| nanasiddhiyutam divyam lokacittanunjanam | sunishcitarthagambhiram vakyam tatparameshvaram
    || 10|| mantram sukhamukhoccaryamashesharthaprasiddhaye | prahonnamah shivayeti sarvajnah sarvadehinam
    || 11|| tadbijam sarvavidyanam mantramadyam shadaksharam | atisukshmamahartham ca jneyam tadvatabijavat
    || 12|| devo gunatrayatitah sarvajnah sarvakrit prabhuh | omityekakshare mantre sthitah sarvagatah
    shivah || 13|| ishanadyani sukshmani brahmanyekaksharena ca | mantre om namah shivayeti susthito niyatah
    kramah || 14|| mantre shadakshare sukshmah pancabrahmatanuh shivah | vacyavacakabhavena sthitah sakshatsvabhavatah
    || 15|| vacyah shivah prameyah syat mantrastadvacakah smritah | vacyavacakabhavo'yamanadih susthitastayoh
    || 16|| yathanadipravritto'yam ghorah samsarasagarah | shivo'pi hi tatha'nadih samsaranmocakah sthitah
    || 17|| vyadhinam bheshajam yadvat pratipakshasvabhavatah | tadvatsamsaradoshanam pratipakshah sthitah
    shivah || 18|| asatyasmin jagannathe tamobhutamidam bhavet | adityena yatha hinam niralokamidam jagat
    || 19|| abhave hishvarasyeyam jagatsrishtih katham bhavet | acetanatvatprakriterajnatvadishvarasya
    ca || 20|| pradhanaparamanvadi yavatkincidacetanam | matkartritvam svayam drishtam buddhimatkaranam
    vina || 21|| dharmadharmopadeshashca bandhamokshavicarana | na sarvajnyam vina pumsam adisarge prasidhyati
    || 22|| vaidyam vina niranandah klishyante rogino yatha | shivam vina niranandam klishyate hi jagattatha
    || 23|| tasmadanadih sarvajnah paripurnah sadashivah | asti nathah paritrata pumsam samsarasagarat
    || 24|| adimadhyantanirmuktah svabhavavimalah prabhuh | sarvajnah paripurnashca shivo jneyah shivagame
    || 25|| tasyabhidhanamantro'yamabhidheyah tatah smritah | abhidhanabhidheyatvanmantrarthah paramah
    shivah || 26|| etavaddhi shivajnanam etavaddhi param padam | tadonnamah shivayeti shivavakyam shadaksharam
    || 27|| vidhivakyamidam shaivam narthavadah shivatmakam | yah sarvajnah susampurnah svabhavavimalah
    shivah || 28|| lokanugrahakarta yah sa mrisharthah katham bhavet | yadyatha'vasthitam vastu gunadoshaihsvabhavatah
    || 29|| yavatphalam ca yatpunyam sarvajnatvam tatha bhavet | raja ganadibhirdoshairgrastatvadanritam
    vadet || 30|| te ceshvare na vidyante bruyatsa kathamanyatha | ajatasheshadoshena sarvajnena shivena
    yat || 31|| pranitamamalam vakyam tatpramanam na samshayah | tasmadishvaravakyani shraddheyani vipashcita
    || 32|| yathartham punyapapeshu tadashraddho vrajatyadhah | svargapavargasiddhyartham bhashitam yatsushobhanam
    || 33|| vakyam munivaraih shantaistadvijneyam subhashitam | ragadveshatmakakrodhakamatrishnanusari
    yat || 34|| vakyam nirayahetutvat taddurbhashitamucyate | samskritenapi kim tena mriduna lalitena
    va || 35|| avidyaragavakyena samsarakleshahetuna | yacchrutva jayate shraddha ragadinam ca sankshayah
    || 36|| virupamapi tadvakyam vijneyamatishobhanam | bahutvenapi mantranam sarvajnena shivena yat ||
    37|| pranitamamalam mantram na tena sadrisham kvacit | saptakotimahamantrairupamantrairanekadha ||
    38|| mantrah shadaksharo bhinnah sutravrityatmana yatha | shivajnanani yavanti vidyasthanani yani
    ca || 39|| shadaksharasya sutrasya tani bhashyam samasatah | kim tasya bahubhirmantraihshastrairva
    bahuvistaraih || 40|| yasyom namahshivayeti mantro'yam hridi susthirah | tenadhitam shrutam tena tena
    sarvamanushthitam || 41|| yenonnamah shivayeti mantrabhyasahsthirikritah | namaskaradisamyuktam shivayetyaksharatrayam
    || 42|| jihvagre vartate yasya saphalam tasya jivitam | antyajo va'dhamo vapi murkho va pandito'pi
    va || 43|| pancaksharajape nishtho mucyate papabandhanat | 44
  devanagari: ृणु ॥ ६॥ वेदे शिवागमे चायं उभयत्र षडक्षरः । मन्त्रस्थितः सदा मुख्यो लोके पञ्चाक्षरः स्मृतः
    ॥ ७॥ सर्वमन्त्राधिकश्चायमोङ्काराद्यः षडक्षरः । सर्वेषां शिवभक्तानामशेषार्थप्रसाधकः ॥ ८॥ तदल्पाक्षरमर्थाढ्यं
    वेदसारं विमुक्तिदम् । आज्ञासिद्धमसन्दिग्धं वाक्यमेतच्छिवात्मकम् ॥ ९॥ नानासिद्धियुतं दिव्यं लोकचित्तानुञ्जनम्
    । सुनिश्चितार्थगम्भीरं वाक्यं तत्पारमेश्वरम् ॥ १०॥ मन्त्रं सुखमुखोच्चार्यमशेषार्थप्रसिद्धये । प्राहोन्नमः
    शिवायेति सर्वज्ञः सर्वदेहिनाम् ॥ ११॥ तद्बीजं सर्वविद्यानां मन्त्रमाद्यं षडक्षरम् । अतिसूक्ष्ममहार्थं
    च ज्ञेयं तद्वटबीजवत् ॥ १२॥ देवो गुणत्रयातीतः सर्वज्ञः सर्वकृत् प्रभुः । ओमित्येकाक्षरे मन्त्रे स्थितः
    सर्वगतः शिवः ॥ १३॥ ईशानाद्यानि सूक्ष्माणि ब्रह्माण्येकाक्षरेण च । मन्त्रे ॐ नमः शिवायेति सुस्थितो
    नियतः क्रमः ॥ १४॥ मन्त्रे षडक्षरे सूक्ष्मः पञ्चब्रह्मतनुः शिवः । वाच्यवाचकभावेन स्थितः साक्षात्स्वभावतः
    ॥ १५॥ वाच्यः शिवः प्रमेयः स्यात् मन्त्रस्तद्वाचकः स्मृतः । वाच्यवाचकभावोऽयमनादिः सुस्थितस्तयोः ॥ १६॥
    यथानादिप्रवृत्तोऽयं घोरः संसारसागरः । शिवोऽपि हि तथाऽनादिः संसारान्मोचकः स्थितः ॥ १७॥ व्याधीनां भेषजं
    यद्वत् प्रतिपक्षस्वभावतः । तद्वत्संसारदोषाणां प्रतिपक्षः स्थितः शिवः ॥ १८॥ असत्यस्मिन् जगन्नाथे तमोभूतमिदं
    भवेत् । आदित्येन यथा हीनं निरालोकमिदं जगत् ॥ १९॥ अभावे हीश्वरस्येयं जगत्सृष्टिः कथं भवेत् । अचेतनत्वात्प्रकृतेरज्ञत्वादीश्वरस्य
    च ॥ २०॥ प्रधानपरमाण्वादि यावत्किञ्चिदचेतनम् । मत्कर्तृत्वं स्वयं दृष्टं बुद्धिमत्करणं विना ॥ २१॥ धर्माधर्मोपदेशश्च
    बन्धमोक्षविचारणा । न सार्वज्ञ्यं विना पुंसां आदिसर्गे प्रसिध्यति ॥ २२॥ वैद्यं विना निरानन्दाः क्लिश्यन्ते
    रोगिणो यथा । शिवं विना निरानन्दं क्लिश्यते हि जगत्तथा ॥ २३॥ तस्मादनादिः सर्वज्ञः परिपूर्णः सदाशिवः
    । अस्ति नाथः परित्राता पुंसां संसारसागरात् ॥ २४॥ आदिमध्यान्तनिर्मुक्तः स्वभावविमलः प्रभुः । सर्वज्ञः
    परिपूर्णश्च शिवो ज्ञेयः शिवागमे ॥ २५॥ तस्याभिधानमन्त्रोऽयमभिधेयः ततः स्मृतः । अभिधानाभिधेयत्वान्मन्त्रार्थः
    परमः शिवः ॥ २६॥ एतावद्धि शिवज्ञानं एतावद्धि परं पदम् । तदोन्नमः शिवायेति शिववाक्यं षडक्षरम् ॥ २७॥
    विधिवाक्यमिदं शैवं नार्थवादः शिवात्मकम् । यः सर्वज्ञः सुसम्पूर्णः स्वभावविमलः शिवः ॥ २८॥ लोकानुग्रहकर्ता
    यः स मृषार्थः कथं भवेत् । यद्यथाऽवस्थितं वस्तु गुणदोषैःस्वभावतः ॥ २९॥ यावत्फलं च यत्पुण्यं सर्वज्ञत्वं
    तथा भवेत् । राजा गानादिभिर्दोषैर्ग्रस्तत्वादनृतं वदेत् ॥ ३०॥ ते चेश्वरे न विद्यन्ते ब्रूयात्स कथमन्यथा
    । अजाताशेषदोषेण सर्वज्ञेन शिवेन यत् ॥ ३१॥ प्रणीतममलं वाक्यं तत्प्रमाणं न संशयः । तस्मादीश्वरवाक्यानि
    श्रद्धेयानि विपश्चिता ॥ ३२॥ यथार्थं पुण्यपापेषु तदश्रद्धो व्रजत्यधः । स्वर्गापवर्गसिद्ध्यर्थं भाषितं
    यत्सुशोभनम् ॥ ३३॥ वाक्यं मुनिवरैः शान्तैस्तद्विज्ञेयं सुभाषितम् । रागद्वेषात्मकक्रोधकामतृष्णानुसारि
    यत् ॥ ३४॥ वाक्यं निरयहेतुत्वात् तद्दुर्भाषितमुच्यते । संस्कृतेनापि किं तेन मृदुना ललितेन वा ॥ ३५॥
    अविद्यारागवाक्येन संसारक्लेशहेतुना । यच्छ्रुत्वा जायते श्रद्धा रागादीनां च सङ्क्षयः ॥ ३६॥ विरूपमपि
    तद्वाक्यं विज्ञेयमतिशोभनम् । बहुत्वेनापि मन्त्राणां सर्वज्ञेन शिवेन यत् ॥ ३७॥ प्रणीतममलं मन्त्रं न
    तेन सदृशं क्वचित् । सप्तकोटिमहामन्त्रैरुपमन्त्रैरनेकधा ॥ ३८॥ मन्त्रः षडक्षरो भिन्नः सूत्रवृत्यात्मना
    यथा । शिवज्ञानानि यावन्ति विद्यास्थानानि यानि च ॥ ३९॥ षडक्षरस्य सूत्रस्य तानि भाष्यं समासतः । किं
    तस्य बहुभिर्मन्त्रैःशास्त्रैर्वा बहुविस्तरैः ॥ ४०॥ यस्यों नमःशिवायेति मन्त्रोऽयं हृदि सुस्थिरः । तेनाधीतं
    श्रुतं तेन तेन सर्वमनुष्ठितम् ॥ ४१॥ येनोन्नमः शिवायेति मन्त्राभ्यासःस्थिरीकृतः । नमस्कारादिसंयुक्तं
    शिवायेत्यक्षरत्रयम् ॥ ४२॥ जिह्वाग्रे वर्तते यस्य सफलं तस्य जीवितम् । अन्त्यजो वाऽधमो वापि मूर्खो वा
    पण्डितोऽपि वा ॥ ४३॥ पञ्चाक्षरजपे निष्ठो मुच्यते पापबन्धनात् । ४४
