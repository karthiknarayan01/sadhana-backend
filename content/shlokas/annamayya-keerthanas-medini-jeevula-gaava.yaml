id: annamayya-keerthanas-medini-jeevula-gaava
category: stotram
name:
  english: Annamayya Keerthanas Medini Jeevula Gaava
content:
  english: adi pallavi medini jivula gava melukovayya | ni daye makèlla raksha nidra melukovayya || tagugopikala
    kannudamaralu vikasincè migula suryanetruda melukovayya | tèguva rakshasulane timiramu viriyaga nègadina
    paranjyoti nidra melukovayya || medini jivula gava melukovayya ghanaduritapu galuvalu vikasincè minuku
    shashinetruda melukovayya | panivadi vedalane pakshulèlla balukaga janaka yashritaparijata melukovayya
    || medini jivula gava melukovayya varalakshmi kucacakravakamu lòndònti raya mèrayu dosharahita melukovayya
    | pòrasi nivu nityabhogamulu bhoginca nirati shrivenkatesha nedu melukovayya || medini jivula gava
    melukovayya | ni daye makèlla raksha nidra melukovayya ||
  devanagari: आदि पल्लवि मेदिनि जीवुल गाव मेलुकोवय्या । नी दये माकॆल्ल रक्ष निद्र मेलुकोवय्या ॥ तगुगोपिकल
    कन्नुदामरलु विकसिञ्चॆ मिगुल सूर्यनेत्रुड मेलुकोवय्या । तॆगुव राक्षसुलने तिमिरमु विरियग नॆगडिन परञ्ज्योति
    निद्र मेलुकोवय्या ॥ मेदिनि जीवुल गाव मेलुकोवय्या घनदुरितपु गलुवलु विकसिञ्चॆ मिनुकु शशिनेत्रुड मेलुकोवय्या
    । पनिवडि वेदालने पक्षुलॆल्ला बलुकग जनक याश्रितपारिजात मेलुकोवय्या ॥ मेदिनि जीवुल गाव मेलुकोवय्या वरलक्ष्मी
    कुचचक्रवाकमु लॊण्डॊण्टि राय मॆरयु दोषरहित मेलुकोवय्या । पॊरसि नीवु नित्यभोगमुलु भोगिञ्च निरति श्रीवेङ्कटेश
    नेडु मेलुकोवय्या ॥ मेदिनि जीवुल गाव मेलुकोवय्या । नी दये माकॆल्ल रक्ष निद्र मेलुकोवय्या ॥
