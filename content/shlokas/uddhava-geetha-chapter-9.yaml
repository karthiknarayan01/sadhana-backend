id: uddhava-geetha-chapter-9
category: stotram
name:
  english: Uddhava Geetha - Chapter 9
content:
  english: atha navamo'dhyayah | brahmanah uvaca | parigrahah hi duhkhaya yat yat priyatamam nrinam |
    anantam sukham apnoti tat vidvan yah tu akincanah || || samisham kuraram jaghnuh balinah ye niramishah
    | tat amisham parityajya sah sukham samavindata || || na me manavamanau stah na cinta gehaputrinam
    | atmakridah atmaratih vicarami iha balavat || || dvau eva cintaya muktau parama anandah aplutau |
    yah vimugdhah jadah balah yah gunebhyah param gatah || || kvacit kumari tu atmanam vrinanan griham
    agatan | svayam tan arhayamasa kvapi yateshu bandhushu || || tesham abhyavaharartham shalin rahasi
    parthiva | avaghnantyah prakoshthasthah cakruh shankhah svanam mahat || || sa tat jugupsitam matva
    mahati vridita tatah | babhanja ekaikashah shankhan dvau dvau panyoh asheshayat || || ubhayoh api
    abhut ghoshah hi avaghnantyah sma shankhayoh | tatra api ekam nirabhidat ekasman na abhavat dhvanih
    || || anvashiksham imam tasyah upadesham arindama | lokan anucaran etan lokatattvavivitsaya || ||
    vase bahunam kalahah bhavet varta dvayoh api | ekah eva caret tasmat kumaryah iva kankanah || || manah
    ekatra samyujyat jitashvasah jita asanah | vairagyabhyasayogena dhriyamanam atandritah || || yasmin
    manah labdhapadam yat etat shanaih shanaih muncati karmarenun | sattvena vriddhena rajah tamah ca
    vidhuya nirvanam upaiti anindhanam || || tat evam atmani avaruddhacittah na veda kincit bahih antaram
    va | yatha ishukarah nripatim vrajantam ishau gatatma na dadarsha parshve || || ekacaryaniketah syat
    apramattah guhashayah | alakshyamanah acaraih munih ekah alpabhashanah || || griharambhah atiduhkhaya
    viphalah ca adhruvatmanah | sarpah parakritam veshma pravishya sukham edhate || || eko narayano devah
    purvasrishtam svamayaya | samhritya kalakalaya kalpanta idamishvarah || || eka evadvitiyo'bhudatmadharo'khilashrayah
    | kalenatmanubhavena samyam nitasu shaktishu | sattvadishvadipuerushah pradhanapurusheshvarah || ||
    paravaranam parama aste kaivalyasanjnitah | kevalanubhavanandasandoho nirupadhikah || || kevalatmanubhavena
    svamayam trigunatmikam | sankshobhayansrijatyadau taya sutramarindama || || tamahustrigunavyaktim
    srijantim vishvatomukham | yasminprotamidam vishvam yena samsarate puman || || yatha urnanabhih hridayat
    urnam santatya vaktratah | taya vihritya bhuyastam grasati evam maheshvarah || || yatra yatra manah
    dehi dharayet sakalam dhiya | snehat dveshat bhayat va api yati tat tat sarupatam || || kitah peshaskritam
    dhyayan kudyam tena praveshitah | yati tat ssatmatam rajan purvarupam asantyajan || || evam gurubhyah
    etebhyah esha me shikshita matih | svatma upashikshitam buddhim shrunu me vadatah prabho || || dehah
    guruh mama viraktivivekahetuh bibhrat sma sattvanidhanam satata artyut arkam | tattvani anena vimrishami
    yatha tatha api parakyam iti avasitah vicarami asangah || || jayatmajarthapashubhrityagrihaptavargan
    pushnati yat priyacikirshaya vitanvan || svante sakricchram avaruddhadhanah sah dehah srishtva asya
    bijam avasidati vrikshadharma || || jihva ekatah amum avakarshati karhi tarsha shishnah anyatah tvak
    udaram shravanam kutashcit | granah anyatah capaladrik kva ca karmashaktih bahvyah sapatnyah iva gehapatim
    lunanti || || srishtva purani vividhani ajaya atmashaktya vrikshan sarisripapashunkhagadamshamatsyan
    | taih taih atushtahridayah purusham vidhaya brahmavalokadhishanam mudamapa devah || || labdhva sudurlabham
    idam bahusambhavante manushyamarthadamanityamapiha dhirah | turnam yateta na patet anumrityuh yavat
    nihshreyasaya vishayah khalu sarvatah syat || || evam sanjatavairagyah vijnanaloka atmani | vicarami
    mahim etam muktasangah anahankritih || || na hi ekasmat guroh jnanam susthiram syat supushkalam |
    brahma etat advitiyam vai giyate bahudha rishibhih || || shribhagavanuvaca | ityuktva sa yadum viprastamamantraya
    gabhiradhih | vandito|abhyarthito rajna yayau prito yathagatam || || avadhutavacah shrutva purvesham
    nah sa purvajah | sarvasangavinirmuktah samacitto babhuva ha || iti shrimadbhagavate mahapurane paramahamsyam
    samhitayamekadashaskandhe bhagavaduddhavasamvade navamo'dhyayah ||
  devanagari: अथ नवमोऽध्यायः । ब्राह्मणः उवाच । परिग्रहः हि दुःखाय यत् यत् प्रियतमं नृणाम् । अनन्तं सुखं
    आप्नोति तत् विद्वान् यः तु अकिञ्चनः ॥ ॥ सामिषं कुररं जघ्नुः बलिनः ये निरामिषाः । तत् आमिषं परित्यज्य
    सः सुखं समविन्दत ॥ ॥ न मे मानावमानौ स्तः न चिन्ता गेहपुत्रिणाम् । आत्मक्रीडः आत्मरतिः विचरामि इह बालवत्
    ॥ ॥ द्वौ एव चिन्तया मुक्तौ परम आनन्दः आप्लुतौ । यः विमुग्धः जडः बालः यः गुणेभ्यः परं गतः ॥ ॥ क्वचित्
    कुमारी तु आत्मानं वृणानान् गृहं आगतान् । स्वयं तान् अर्हयामास क्वापि यातेषु बन्धुषु ॥ ॥ तेषं अभ्यवहारार्थं
    शालीन् रहसि पार्थिव । अवघ्नन्त्याः प्रकोष्ठस्थाः चक्रुः शङ्खाः स्वनं महत् ॥ ॥ सा तत् जुगुप्सितं मत्वा
    महती व्रीडिता ततः । बभञ्ज एकैकशः शङ्खान् द्वौ द्वौ पाण्योः अशेषयत् ॥ ॥ उभयोः अपि अभूत् घोषः हि अवघ्नन्त्याः
    स्म शङ्खयोः । तत्र अपि एकं निरभिदत् एकस्मान् न अभवत् ध्वनिः ॥ ॥ अन्वशिक्षं इमं तस्याः उपदेशं अरिन्दम
    । लोकान् अनुचरन् एतान् लोकतत्त्वविवित्सया ॥ ॥ वासे बहूनां कलहः भवेत् वार्ता द्वयोः अपि । एकः एव चरेत्
    तस्मात् कुमार्याः इव कङ्कणः ॥ ॥ मनः एकत्र संयुज्यात् जितश्वासः जित आसनः । वैराग्याभ्यासयोगेन ध्रियमाणं
    अतन्द्रितः ॥ ॥ यस्मिन् मनः लब्धपदं यत् एतत् शनैः शनैः मुञ्चति कर्मरेणून् । सत्त्वेन वृद्धेन रजः तमः
    च विधूय निर्वाणं उपैति अनिन्धनम् ॥ ॥ तत् एवं आत्मनि अवरुद्धचित्तः न वेद किञ्चित् बहिः अन्तरं वा ।
    यथा इषुकारः नृपतिं व्रजन्तम् इषौ गतात्मा न ददर्श पार्श्वे ॥ ॥ एकचार्यनिकेतः स्यात् अप्रमत्तः गुहाशयः
    । अलक्ष्यमाणः आचारैः मुनिः एकः अल्पभाषणः ॥ ॥ गृहारम्भः अतिदुःखाय विफलः च अध्रुवात्मनः । सर्पः परकृतं
    वेश्म प्रविश्य सुखं एधते ॥ ॥ एको नारायणो देवः पूर्वसृष्टं स्वमायया । संहृत्य कालकलया कल्पान्त इदमीश्वरः
    ॥ ॥ एक एवाद्वितीयोऽभूदात्माधारोऽखिलाश्रयः । कालेनात्मानुभावेन साम्यं नीतासु शक्तिषु । सत्त्वादिष्वादिपुएरुषः
    प्रधानपुरुषेश्वरः ॥ ॥ परावराणां परम आस्ते कैवल्यसञ्ज्ञितः । केवलानुभवानन्दसन्दोहो निरुपाधिकः ॥ ॥ केवलात्मानुभावेन
    स्वमायां त्रिगुणात्मिकाम् । सङ्क्षोभयन्सृजत्यादौ तया सूत्रमरिन्दम ॥ ॥ तामाहुस्त्रिगुणव्यक्तिं सृजन्तीं
    विश्वतोमुखम् । यस्मिन्प्रोतमिदं विश्वं येन संसरते पुमान् ॥ ॥ यथा ऊर्णनाभिः हृदयात् ऊर्णां सन्तत्य
    वक्त्रतः । तया विहृत्य भूयस्तां ग्रसति एवं महेश्वरः ॥ ॥ यत्र यत्र मनः देही धारयेत् सकलं धिया । स्नेहात्
    द्वेषात् भयात् वा अपि याति तत् तत् सरूपताम् ॥ ॥ कीटः पेशस्कृतं ध्यायन् कुड्यां तेन प्रवेशितः । याति
    तत् स्सत्मतां राजन् पूर्वरूपं असन्त्यजन् ॥ ॥ एवं गुरुभ्यः एतेभ्यः एष मे शिक्षिता मतिः । स्वात्मा उपशिक्षितां
    बुद्धिं श्रुणु मे वदतः प्रभो ॥ ॥ देहः गुरुः मम विरक्तिविवेकहेतुः बिभ्रत् स्म सत्त्वनिधनं सतत अर्त्युत्
    अर्कम् । तत्त्वानि अनेन विमृशामि यथा तथा अपि पारक्यं इति अवसितः विचरामि असङ्गः ॥ ॥ जायात्मजार्थपशुभृत्यगृहाप्तवर्गान्
    पुष्णाति यत् प्रियचिकीर्षया वितन्वन् ॥ स्वान्ते सकृच्छ्रं अवरुद्धधनः सः देहः सृष्ट्वा अस्य बीजं अवसीदति
    वृक्षधर्मा ॥ ॥ जिह्वा एकतः अमुं अवकर्षति कर्हि तर्षा शिश्नः अन्यतः त्वक् उदरं श्रवणं कुतश्चित् । ग्राणः
    अन्यतः चपलदृक् क्व च कर्मशक्तिः बह्व्यः सपत्न्यः इव गेहपतिं लुनन्ति ॥ ॥ सृष्ट्वा पुराणि विविधानि अजया
    आत्मशक्त्या वृक्षान् सरीसृपपशून्खगदंशमत्स्यान् । तैः तैः अतुष्टहृदयः पुरुषं विधाय ब्रह्मावलोकधिषणं
    मुदमाप देवः ॥ ॥ लब्ध्वा सुदुर्लभं इदं बहुसम्भवान्ते मानुष्यमर्थदमनित्यमपीह धीरः । तूर्णं यतेत न पतेत्
    अनुमृत्युः यावत् निःश्रेयसाय विषयः खलु सर्वतः स्यात् ॥ ॥ एवं सञ्जातवैराग्यः विज्ञानलोक आत्मनि । विचरामि
    महीं एतां मुक्तसङ्गः अनहङ्कृतिः ॥ ॥ न हि एकस्मात् गुरोः ज्ञानं सुस्थिरं स्यात् सुपुष्कलम् । ब्रह्म
    एतत् अद्वितीयं वै गीयते बहुधा ऋषिभिः ॥ ॥ श्रीभगवानुवाच । इत्युक्त्वा स यदुं विप्रस्तमामन्त्रय गभीरधीः
    । वन्दितो।आभ्यर्थितो राज्ञा ययौ प्रीतो यथागतम् ॥ ॥ अवधूतवचः श्रुत्वा पूर्वेषां नः स पूर्वजः । सर्वसङ्गविनिर्मुक्तः
    समचित्तो बभूव ह ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे भगवदुद्धवसंवादे नवमोऽध्यायः
    ॥
