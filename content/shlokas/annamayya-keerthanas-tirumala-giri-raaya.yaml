id: annamayya-keerthanas-tirumala-giri-raaya
category: stotram
name:
  english: Annamayya Keerthanas Tirumala Giri Raaya
content:
  english: adi pallavi tirumalagiriraya devarahuttaraya | suratabinnanaraya sugunakonetiraya || caranam
    sirulasingararaya cèluvaputimmaraya | sarasavaibhavaraya sakalavinodaraya | varavasantamularaya vanitalavitaraya
    | gurutaina tegaraya kòndalakonetiraya || tirumalagiriraya devarahuttaraya gòllètalavuddandaraya gopalakrishnaraya
    | calluvèdajanaraya callabarimalaraya | cèllubadidharmaraya cèpparanivalaraya | kòllalaina bhogaraya
    kòndalakonetiraya || tirumalagiriraya devarahuttaraya samasangitaraya sarvamohanaraya | dhamavaikuntharaya
    daityavibhalaraya | kaminci ninnu gorite garunincitivi nannu | shrimantuda niku jaya shrivenkataraya
    || tirumalagiriraya devarahuttaraya | suratabinnanaraya sugunakonetiraya ||
  devanagari: आदि पल्लवि तिरुमलगिरिराय देवराहुत्तराय । सुरतबिन्नाणराय सुगुणकोनेटिराय ॥ चरणं सिरुलसिङ्गारराय
    चॆलुवपुतिम्मराय । सरसवैभवराय सकलविनोदराय । वरवसन्तमुलराय वनितलविटराय । गुरुतैन तेगराय कॊण्डलकोनेटिराय
    ॥ तिरुमलगिरिराय देवराहुत्तराय गॊल्लॆतलवुद्दण्डराय गोपालकृष्णराय । चल्लुवॆदजाणराय चल्लबरिमलराय । चॆल्लुबडिधर्मराय
    चॆप्परानिवलराय । कॊल्ललैन भोगराय कॊण्डलकोनेटिराय ॥ तिरुमलगिरिराय देवराहुत्तराय सामसङ्गीतराय सर्वमोहनराय
    । धामवैकुण्ठराय दैत्यविभालराय । कामिञ्चि निन्नु गोरिते गरुणिञ्चितिवि नन्नु । श्रीमन्तुड नीकु जय श्रीवेङ्कटराय
    ॥ तिरुमलगिरिराय देवराहुत्तराय । सुरतबिन्नाणराय सुगुणकोनेटिराय ॥
