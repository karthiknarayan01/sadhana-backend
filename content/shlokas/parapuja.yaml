id: parapuja
category: stotram
name:
  english: parapuja
  devanagari: परापूजा
content:
  english: para puja akhande saccidanande nirvikalpaikarupini | sthite'dvitiyabhave'smin katham puja vidhiyate
    || 1|| purnasyavahanam kutra sarvadharasya casanam | svacchasya padyamarghyam tu shuddhasyacamanam
    kutah || 2|| nirmalasya kutah snanam vastram vishvodarasya ca | niralambasyopavitam pushpam nirvasanasya
    ca || 3||
  devanagari: परा पूजा अखण्डे सच्चिदानन्दे निर्विकल्पैकरूपिणि । स्थितेऽद्वितीयभावेऽस्मिन् कथं पूजा विधीयते
    ॥ १॥ पूर्णस्यावाहनं कुत्र सर्वाधारस्य चासनम् । स्वच्छस्य पाद्यमर्घ्यं तु शुद्धस्याचमनं कुतः ॥ २॥ निर्मलस्य
    कुतः स्नानं वस्त्रं विश्वोदरस्य च । निरालम्बस्योपवीतं पुष्पं निर्वासनस्य च ॥ ३॥
meaning: {}
