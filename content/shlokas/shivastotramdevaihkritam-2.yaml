id: shivastotramdevaihkritam-2
category: stotram
name:
  english: shivastotramdevaihkritam 2
  devanagari: शिवस्तोत्रम्देवैःकृतं २
content:
  english: tarivrittaye namo namaste dhritadantikrittaye | namo namaste munihridyavrittaye namo namaste
    suravandyamurtaye || 376|| namo namaste sukritapriyaya namo namaste girijadhavaya | namo namaste vrishabhadhvajaya
    namo namaste vrishavahanaya || 377|| namo namaste kalushapahaya namo namaste'mitakamadaya | namo namaste
    purasudanaya namo namaste vibudhottamaya || 378|| namo namaste'ganyavibhushanaya namo namaste'mitakaranaya
    | namo namaste samavikshanaya namo namaste vishamekshanaya || 379|| namo namaste karunakaraya namo
    namaste kalinashakaya | namo namaste sakalaushadhaya namo namaste sakalamritaya || 380|| namo namaste'khilamuktidaya
    namo namaste'khilasamstutaya | namo namaste'khilapujitaya namo namaste'khilarakshakaya || 381|| ||
    iti shivarahasyantargate devaih kritam shivastotram sampurnam ||
  devanagari: तारिवृत्तये नमो नमस्ते धृतदन्तिकृत्तये । नमो नमस्ते मुनिहृद्यवृत्तये नमो नमस्ते सुरवन्द्यमूर्तये
    ॥ ३७६॥ नमो नमस्ते सुकृतप्रियाय नमो नमस्ते गिरिजाधवाय । नमो नमस्ते वृषभध्वजाय नमो नमस्ते वृषवाहनाय
    ॥ ३७७॥ नमो नमस्ते कलुषापहाय नमो नमस्तेऽमितकामदाय । नमो नमस्ते पुरसूदनाय नमो नमस्ते विबुधोत्तमाय ॥
    ३७८॥ नमो नमस्तेऽगण्यविभूषणाय नमो नमस्तेऽमितकारणाय । नमो नमस्ते समवीक्षणाय नमो नमस्ते विषमेक्षणाय ॥
    ३७९॥ नमो नमस्ते करुणाकराय नमो नमस्ते कलिनाशकाय । नमो नमस्ते सकलौषधाय नमो नमस्ते सकलामृताय ॥ ३८०॥ नमो
    नमस्तेऽखिलमुक्तिदाय नमो नमस्तेऽखिलसंस्तुताय । नमो नमस्तेऽखिलपूजिताय नमो नमस्तेऽखिलरक्षकाय ॥ ३८१॥ ॥
    इति शिवरहस्यान्तर्गते देवैः कृतं शिवस्तोत्रं सम्पूर्णम् ॥
