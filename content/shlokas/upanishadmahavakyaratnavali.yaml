    2|73 aham brahmasmi mantro'yam janmapapam vinashayet || 113|| tejobindu 3|61 aham brahmasmi mantro'yam
    bhedabuddhim vinashayet || 114|| tejobindu 3|63 aham brahmasmi mantro'yam kotidosham vinashayet ||
    115|| tejobindu 3|68 aham brahmasmi mantro'yam jnananandam prayacchati || 116|| tejobindu 3|73 sarvamantransamutsrijya
    imam mantram samabhyaset || 117|| tejobindu 3|74 sadyo mokshamavapnoti nasti sandehamanvapi || 118||
    tejobindu 3|74 iti svanubhutivakyani ashtadashottarashatam || 118|| navamam prakaranam samaptam |
    10 atha sardhantikasamadhivakyani |
  devanagari: नित्यः शुद्धो बुद्धमुक्तस्वभावः सत्यः सूक्ष्मः सन्विभुश्चाद्वितीयः ॥ १९॥ मैत्रेयी १।११ आनन्दाब्धिर्यत्परः
    सोऽहमस्मि प्रत्यग्धातुर्नात्र संशीतिरस्ति ॥ २०॥ मैत्रेयी १।११ सोऽहमर्कः परं ज्योतिरर्कज्योतिरहं शिवः
    ॥ २१॥ महावाक्य आत्मज्योतिरहं शुक्रः सर्वज्योतिरसावहोम् ॥ २२॥ महावाक्य द्वैतभावविमुक्तोऽस्मि सच्चिदानन्दलक्षणः
    ॥ २३॥ अन्नपूर्णा ५।६८ शुद्धबोधस्वरूपोऽहं केवलोऽहं सदाशिवः ॥ २४॥ अध्यात्म ६९ निष्क्रियोऽस्म्यविकारोऽस्मि
    निर्गुणोऽस्मि निराकृतिः ॥ २५॥ कुण्डिका २५ निर्विकल्पोऽस्मि नित्योऽस्मि निरालम्बोऽस्मि निर्द्वयः ॥
    २६॥ कुण्डिका २५ केवलाखण्डबोधोऽहं स्वानन्दोऽहं निरन्तरः ॥ २७॥ कुण्डिका २६ सत्यं ज्ञानमनन्तं यत्परं
    ब्रह्माहमेव तत् ॥ २८॥ वराह ३।२ केवलं चित्सदानन्दं ब्रह्मैवाहं जनार्दनः ॥ २९॥ वराह ३।१९ अशुभाशुभसङ्कल्पैः
    संशान्तोऽस्मि निरामयः ॥ ३०॥ सन्न्यास २।४९ नष्टेष्टानिष्टकलनः संविन्मात्रपरोऽस्म्यहम् ॥ ३१॥ सन्न्यास
    २।४९ अन्तर्याम्यहमग्राह्योऽनिर्देश्योऽहमलक्षणः ॥ ३२॥ ब्रह्मविद्या ८० अद्वैतोऽहं पूर्णोऽहमबाह्योऽहमनन्तरः
    ॥ ३३॥ ब्रह्मविद्या ८८ अद्वयानन्दविज्ञानघनोऽस्म्यहमविक्रियः ॥ ३४॥ ब्रह्मविद्या ८९ अविद्याकार्यहीनोऽहमवाङ्मनसगोचरः
    ॥ ३५॥ ब्रह्मविद्या ९० आत्मचैतन्यरूपोऽहमहमानन्दचिद्घनः ॥ ३६॥ ब्रह्मविद्या ९१ आप्तकामोऽहमाकाशात्परमात्मेश्वरोऽस्म्यहम्
    ॥ ३७॥ ब्रह्मविद्या ९२ चिदानन्दोऽस्म्यहं चेता चिद्घनश्चिन्मयोऽस्म्यहम् ॥ ३८॥ ब्रह्मविद्या ९५ ज्योतिर्मयोऽस्म्यहं
    ज्यायाज्ज्योतिषां ज्योतिरस्म्यहम् ॥ ३९॥ ब्रह्मविद्या ९५ नित्योऽहं निरवद्योऽहं निष्क्रियोऽमि निरञ्जनः
    ॥ ४०॥ ब्रह्मविद्या ९७ निर्मलो निर्विकल्पोऽहं निराख्यातोऽस्मि निश्चलः ॥ ४१॥ ब्रह्मविद्या ९७ निर्विकारो
    नित्यपूतो निर्गुणो निस्पृहोऽस्म्यहम् ॥ ४२॥ ब्रह्मविद्या ९८ निरिन्द्रियो नियन्ताहं निरपेक्षोऽस्मि निष्कलः
    ॥ ४३॥ ब्रह्मविद्या ९८ पुरुषः परमात्माहं पुराणः परमोऽस्म्यहम् ॥ ४४॥ ब्रह्मविद्या ९९ पूर्णानन्दैकबोधोऽहं
    प्रत्यगेकरसोऽस्म्यहम् ॥ ४५॥ ब्रह्मविद्या १०० प्रज्ञातोऽहं प्रशान्तोऽहं प्रकाशः परमेश्वरः ॥ ४६॥ ब्रह्मविद्या
    १०१ एकधा चिन्त्यमानोऽहं द्वैताद्वैतविलक्षणः ॥ ४७॥ ब्रह्मविद्या १०१ शुद्धोऽस्मि शुक्रः शान्तोऽस्मि
    शाश्वतोऽस्मि शिवोऽस्म्यहम् ॥ ४८॥ ब्रह्मविद्या १०४ अहं सकृद्विभातोऽस्मि स्वे महिम्नि सदा स्थितः ॥ ४९॥
    ब्रह्मविद्या १०५ सच्चिदानन्द्मात्रोऽहं स्वप्रकाशोऽस्मि चिद्घनः ॥ ५०॥ ब्रह्मविद्य १०९ मानावमानहीनोऽस्मि
    निर्गुणोऽस्मि शिवोऽस्म्यहम् ॥ ५१॥ मैत्रेयी ३।४ द्वैताद्वैतविहीनोऽस्मि द्वन्द्वहीनोऽस्मि सोऽस्म्यहम्
    ॥ ५२॥ मैत्रेयी ३।४ भावाभावविहीनोऽस्मि भाषाहीनोऽस्मि भास्म्यहम् ॥ ५३॥ मैत्रेयी ३।५ शून्याशून्यविहीनोऽस्मि
    शोभनाशोभनोऽस्म्यहम् ॥ ५४॥ मैत्रेयी ३।५ सदसद्भेदहीनोऽस्मि सङ्कल्परहितोऽस्म्यहम् ॥ ५५॥ मैत्रेयी ३।७
    नानात्मभेदहीनोऽस्मि ह्यखण्डानन्दविग्रहः ॥ ५६॥ मैत्रेयी ३।८ बन्धमोक्षविहीनोऽस्मि शुद्धं ब्रह्मास्मि
    सोऽस्म्यहम् ॥ ५७॥ मैत्रेयी ३।९ चित्तादिसर्वहीनोऽस्मि परमोऽस्मि परात्परः ॥ ५८॥ मैत्रेयी ३।१० सदा विचाररूपोऽस्मि
    निर्विचारोऽस्मि सोऽस्म्यहम् ॥ ५९॥ मैत्रेयी ३।१० ध्यातृध्यानविहीनोऽस्मि ध्येयहीनोऽस्मि सोऽस्म्यहम्
    ॥ ६०॥ मैत्रेयी ३।११ लक्ष्यालक्ष्यविहीनोऽस्मि लयहीनरसोऽस्म्यहम् ॥ ६१॥ मैत्रेयी ३।१३ मातृमानविहीनोऽस्मि
    मेयहीनः शिवोऽस्म्यहम् ॥ ६२॥ मैत्रेयी ३।१३ सर्वेन्द्रियविहीनोऽस्मि सर्वकर्मकृदप्यहम् ॥ ६३॥ मैत्रेयी
    ३।१५ मुदितामुदिताख्योऽस्मि सर्वमौनफलोऽस्म्यहम् ॥ ६४॥ मैत्रेयी ३।१६ षड्विकारविहीनोऽस्मि षट्कोशरहितोऽस्म्यहम्
    ॥ ६५॥ मैत्रेयी ३।१८ देशकालविमुक्तोऽस्मि दिगम्बरसुखोऽस्म्यहम् ॥ ६६॥ मैत्रेयी ३।१९ अखण्डाकाशरूपोऽस्मि
    ह्यखण्डाकारमस्म्यहम् ॥ ६७॥ मैत्रेयी ३।२० प्रपञ्चमुक्तचित्तोऽस्मि प्रपञ्चरहितोऽस्म्यहम् ॥ ६८॥ मैत्रेयी
    ३।२० सर्वप्रकाशरूपोऽस्मि चिन्मात्रज्योतिरस्म्यहम् ॥ ६९॥ मैत्रेयी ३।२१ कालत्रयविमुक्तोऽस्मि कामादिरहितोऽस्म्यहम्
    ॥ ७०॥ मैत्रेयी ३।२१ मुक्तिहीनोऽस्मि मुक्तोऽस्मि मोक्षहीनोऽस्म्यहम् सदा ॥ ७१॥ मैत्रेयी ३।२२ गन्तव्यदेशहीनोऽस्मि
    गमनादिविवर्जितः ॥ ७२॥ मैत्रेयी ३।२३ सर्वदा समरूपोऽस्मि शान्तोऽस्मि पुरुषोत्तमः ॥ ७३॥ मैत्रेयी ३।२४
    चिदक्षरोऽहं सत्योऽहं वासुदेवोऽजरोऽमरः ॥ ७४॥ तेजोबिन्दु ६।६९ अहमेवाक्षरं ब्रह्म वासुदेवाख्यमद्वयम्
    ॥ ७५॥ नारदपरिव्राजक ३।२० परब्रह्मस्वरूपोऽहं परमानन्दमस्म्यहम् ॥ ७६॥ तेजोबिन्दु ३।१ केवलं ज्ञानरूपोऽहं
    केवलं परमोऽस्म्यहम् ॥ ७७॥ तेजोबिन्दु ३।१ केवलं शान्तरूपोऽहं केवलं चिन्मयोऽस्म्यहम् ॥ ७८॥ तेजोबिन्दु
    ३।२ केवलं नित्यरूपोऽहं केवलं शाश्वतोऽस्म्यहम् ॥ ७९॥ तेजोबिन्दु ३।२ केवलं सत्त्वरूपोऽहमहं त्यक्त्वाहमस्म्यहम्
    ॥ ८०॥ तेजोबिन्दु ३।३ केवलं तुर्यरूपोऽस्मि तुर्यातीतोऽस्मि केवलः ॥ ८१॥ तेजोबिन्दु ३।४ केवलाकाररूपोऽस्मि
    शुद्धरूपोऽस्म्यहं सदा ॥ ८२॥ तेजोबिन्दु ३।५ निर्विकल्पस्वरूपोऽस्मि निरीहोऽस्मि निरामयः ॥ ८३॥ तेजोबिन्दु
    ३।६ अपरिच्छिन्नरूपोऽस्मि ह्यनन्तानन्दरूपवान् ॥ ८४॥ तेजोबिन्दु ३।७ आत्मारामस्वरूपोऽस्मि अहमात्मा सदाशिवः
    ॥ ८५॥ तेजोबिन्दु ३।९ आदिमध्यान्तशून्योऽस्मि ह्याकाशसदृशोऽस्म्यहम् ॥ ८६॥ तेजोबिन्दु ३।१० नित्यशुद्धचिदानन्दः
    सत्तामात्रोऽहमव्ययः ॥ ८७॥ तेजोबिन्दु ३।११ नित्यबुद्धविशुद्धैकः सच्चिदानन्दमस्म्यहम् ॥ ८८॥ तेजोबिन्दु
    ३।११ भूमानन्दस्वरूपोऽस्मि भाषाहीनोऽस्म्यहं सदा ॥ ८९॥ तेजोबिन्दु ३।१२ सर्वाधिष्ठानरूपोऽस्मि सर्वदा
    चिद्घनोऽस्म्यहम् ॥ ९०॥ तेजोबिन्दु ३।१२ चित्तवृत्तिविहीनोऽहं चिदात्मैकरसोऽस्म्यहम् ॥ ९१॥तेजोबिन्दु
    ३।१४ अहं ब्रह्मैव सर्वं स्यादहं चैतन्यमेव हि ॥ ९२॥ तेजोबिन्दु ३।१६ अहमेवाहमेवास्मि भूमाकारस्वरूपवान्
    ॥ ९३॥ तेजोबिन्दु ३।१६ अहमेव महानात्मा ह्यहमेव परात्परः ॥ ९४॥ तेजोबिन्दु ३।१७ अहमन्यवदाभामि ह्यहमेव
    शरीरवत् ॥ ९५॥ तेजोबिन्दु ३।१७ अहं शिष्यवदाभामि ह्यहं लोकत्रयाश्रयः ॥ ९६॥ तेजोबिन्दु ३।१८ अहं कालत्रयातीतो
    ह्यहं वेदैरुपासितः ॥ ९७॥ तेजोबिन्दु ३।१८ अहं शास्त्रेण निर्णीत अहं चित्ते व्यवस्थितः ॥ ९८॥ तेजोबिन्दु
    ३।१९ आनन्दघन एवाहमहं ब्रह्मास्मि केवलम् ॥ ९९॥ तेजोबिन्दु ३।२६ आत्मनात्मनि तृप्तोऽस्मि ह्यरूपो ह्यहमव्ययः
    ॥ १००॥ तेजोबिन्दु ३।२८ आकाशादपि सूक्ष्मोऽहमाद्यन्ताभाववानहम् ॥ १०१॥ तेजोबिन्दु ३।२९ सत्तामात्रस्वरूपोऽहं
    शुद्धमोक्षस्वरूपवान् ॥ १०२॥ तेजोबिन्दु ३।३० सत्यानन्दस्वरूपोऽहं ज्ञानानन्दघनोऽस्म्यहम् ॥ १०३॥ तेजोबिन्दु
    ३।३१ नामरूपविमुक्तोऽहमहमानन्दविग्रहः ॥ १०४॥ तेजोबिन्दु ३।३६ आदिचैतन्यमात्रोऽहमखण्डैकरसोऽस्म्यहम् ॥
    १०५॥ तेजोबिन्दु ३।३७ सर्वत्र पूर्णरूपोऽहं परामृतरसोऽस्म्यहम् ॥ १०६॥ तेजोबिन्दु ३।३८ एकमेवाद्वितीयं
    सद्ब्रह्मैवाहं न संशयः ॥ १०७॥ तेजोबिन्दु ३।३९ अहमेव परं ब्रह्म ह्यहमेव गुरोर्गुरुः ॥ १०८॥ तेजोबिन्दु
    ६।४४ सर्वज्ञानप्रकाशोऽस्मि मुख्यविज्ञानविग्रहः ॥ १०९॥ तेजोबिन्दु ६।६८ तुर्यातुर्यप्रकाशोऽस्मि तुर्यातुर्यादिवर्जितः
    ॥ ११०॥ तेजोबिन्दु ६।६९ दृशिस्वरूपं गगनोपमं परं सकृद्विभातं त्वजमेकमक्षरम् ॥ १११॥ मुक्तिका २।७३ अलेपकं
    सर्वगतं यदव्ययं तदेव चाहं सकलं विमुक्त ॐ ॥ ११२॥ मुक्तिका २।७३ अहं ब्रह्मास्मि मन्त्रोऽयं जन्मपापं
    विनाशयेत् ॥ ११३॥ तेजोबिन्दु ३।६१ अहं ब्रह्मास्मि मन्त्रोऽयं भेदबुद्धिं विनाशयेत् ॥ ११४॥ तेजोबिन्दु
    ३।६३ अहं ब्रह्मास्मि मन्त्रोऽयं कोटिदोषं विनाशयेत् ॥ ११५॥ तेजोबिन्दु ३।६८ अहं ब्रह्मास्मि मन्त्रोऽयं
    ज्ञानानन्दं प्रयच्छति ॥ ११६॥ तेजोबिन्दु ३।७३ सर्वमन्त्रान्समुत्सृज्य इमं मन्त्रं समभ्यसेत् ॥ ११७॥
    तेजोबिन्दु ३।७४ सद्यो मोक्षमवाप्नोति नास्ति सन्देहमण्वपि ॥ ११८॥ तेजोबिन्दु ३।७४ इति स्वानुभूतिवाक्यानि
    अष्टादशोत्तरशतम् ॥ ११८॥ नवमं प्रकरणं समाप्तम् । १० अथ सार्धान्तिकसमाधिवाक्यानि ।
