id: parashaktikavacam
category: kavacha
name:
  english: parashaktikavacam
  devanagari: पराशक्तिकवचम्
content:
  english: dhyayetpadmasanasinam devim sarveshvarim shivam | kotisuryapratikasham sarvashaktyudayodbhavam
    || parabrahmamayim nityam parashaktim jaganmayim | mantrapanjaramadhyastham dhyayeham sadhakabhaye
    || om ekakshari patu mastakam me lajjabijam lalatamuparishtat | vadhubijam netrayugalam patu hrinkaram
    shrutidvayam || 1|| krim krim patu nasikagram hum hum mukham vagbhavam tatha | dakshinakalika patu
    kantham me sarvasiddhida || 2|| hrim ha sa ka ha la hrim mantrairbahuyugmam sada'vatu | sarasvati
    mantrarajo vakshasthalam rakshatu me sada || 3|| pancakshari mantramayi hridayastha sarasvati | patu
    mam sarvada devi mantrairbijasamanvitaih || 4|| lakshmirbijam patu nabhim shrim hrim hrim patu guhyakam
    | pranavah sarvagatreshu rakshanam kurute mama || 5|| bhurbhuvah svah shiro deshe omkarah patu sarvada
    | maho mahah sada patu mantraih pancangapuritah || 6|| namah patu padau nityam tapah patu ca janghake
    | satyam patu katim desham jyotirmayasvarupini || 7|| paranjyotih patu cakshuh paramatman hridaye
    vasa | parabrahma mantraratnam patu me sarvatah sada || 8|| shrim jikam patu me deham sarvangeshu
    ca sarvada | saccidekam brahma patu yonisthane visheshatah || 9|| hridaye shodashakshari patu mantram
    mahattaram | dashakshari patu kanthe pancakshari ca mastakam || 10|| om hrim strim hum phat ca vada
    vada vagvadini me ca jihvam | patu sarvatra devim vade vade pravardhatam || 11|| om aim hrim klim
    patu netre camunda patu padakam | vica patu padamulam sarvadikshu ca sarvatah || 12|| kshraum bijam
    jatharagnim me rakshatu sarvatomukhi | vagvadini patu kantham sarvamantramayi svayam || 13|| tara
    mantram sada patu matim me brahmarupinim | shodashi mantrarajashca sarvantan patu me sada || 14||
    vyahritibhih saptashtabhih patu me sarvasandhishu | angani me patu devi mantraih sarvangashobhanaih
    || 15|| etah sarvah shaktidevyo dehabhageshu samsthitah | parabrahma svarupena mam rakshantu sada
    dhruvam || 16|| om hrim hrim patu me prishtham ha sa ka ha la hrim patu padakam | sa ka la hrim patu
    januni mantrabijaishca rakshitam || 17|| gam ganapataye patu padau gulphau sada'vatu | hrim shriyai
    patu jangham ca namah patu ca me katim || 18|| aim klim sauh patu nabhim ca bala mantramayi sada |
    sauh klim aim patu hridayam hrinkaro me shirodharam || 19|| krim hrim shrim patu sarvatra lajjashaktih
    prapalayet | hrim kshraum candikayai ca patu me hastakadvayam || 20|| bhurbhuvah svah prapancatma
    satyam patu tu me tanum | omakarah sarvamantreshu mantrapanjaramadhyagah || 21|| jyotisham jyotirurdhvam
    me patu cakshuhpradipakam | paramatmanamo'stveva patu me sarvamangalam || 22|| parabrahmasvarupini
    shaktih patu sada'mutah | om namo brahmane tubhyam patu me sakalam vapuh || 23|| shadaksharam mahamantram
    patu me buddhimashritam | saccidekam ca yanmantram patu me cittamavyayam || 24|| omkaram patu me jihvam
    hridayam mantrarupini | patu me camunda devi mantramantraksharatmika || 25|| vica patu me parshvau
    mantrashaktirnirantaram | kshraum rakshatu me deham mantrarat sandhisandhishu || 26|| vada vada vagvadini
    me vacam siddhim pradapayet | vagvadini patu me vacam mantram kanthasthitam sada || 27|| evam mantraksharadini
    nyasakramena ca sthitam | mantrapanjaramadhyastham patu mam sarvato dishi || 28|| na kincidapi me
    rakshyam na kincidapi me bhayam | mantrashaktirvapurhyetat parabrahmasvarupakam || 29|| yatha nadishu
    mantranam vinyaso hyasti dehake | tathaiva patu mam devi parashaktirmahabala || 30|| tarabijam shirah
    patu hrim patu me drishormanim | klim patu hridayam me'dya mantrashaktirmayodita || 31|| sarvamantramayi
    devi sarvangeshu ca samsthitam | rakshatu mam sada shaktya mahashaktisvarupa || 32|| phalashrutih
    | shrutva'sya kavacam divyam parashaktisamanvitam | na bhutam na bhavishyacca na ca kincitsamam kvacit
    || 33|| yo dharayati martyo'yam sa sakshacchaktirupadhrik | sarvamantramayi vani tasya jihvagragamini
    || 34|| yadyadabhilashate nityam tattadapnoti kevalam | aganitam ca siddhim vai nidhishriyamavapnuyat
    || 35|| na homo na ca homashca na ca kincitpurashcaram | asya pathatprasidanti sarvah shaktih parah
    sada || 36|| brahmarakshasavetalah bhutapretapishacakah | disham na labhate gantum mantrapanjaradharinah
    || 37|| maranam mohanam vashyam stambhanashcaiva durjayam | asyaiva kavacadasya sadhako labhate dhruvam
    || 38|| brahmanah kshatriya vaishyah shudra api ca ye janah | na jatibhedam tatrasti na desham na
    ca kalakam || 39|| strinam visheshalabhashca kanyanam ca visheshatah | saubhagyam labhate nityam yavaccandradivakarau
    || 40|| muktavastho naro nityam parabrahmasvarupakah | asya stotrasya mahatmyam vaktum brahma na shaknuyat
    || 41|| shivo'pi ca sada shaktya dhyayate kavacam shubham | vishnurlakshmisamanvitah palayatyeva nityashah
    || 42|| shakrah saparivaraya devah sarve ca matarah | rakshanti tam sada bhaktam mantrapanjararakshitam
    || 43|| idam na shapitam loke na ca kilakasamyutam | na caiva doshabahulyadasmin kavace vidyate ||
    44|| yo'tra dosham prapashyeta sa naro narakam vrajet | mantrashaktisvarupam ca sakshadbrahmamayam
    param || 45|| pathanadasya mantrasya rogavyadhirvinashyati | mrityubhitirna tasyasti sarvaih papaih
    pramucyate || 46|| svapne'pi na sa pashyeta daridryam mantrayogavit | kulajah pitarastasya nityam
    triptah sura api || 47|| gramam va yadi va rajyam yatra tatra pathedidam | tatra tatra ca siddhih
    syat tatra tatra jaya''vaha || 48|| yah pathetpratimasam va sankrantyam va visheshatah | tasya buddhirna
    calokya suryavattejasa'dhika || 49|| narayanasvarupam ca sakshacchaktimayam param | parabrahma mahastotram
    sarvakalyanakarakam || 50|| tasmatsarvaprayatnena sadhako niyatah sudhih | pathedetanmahastotram nanyatha
    vindate sukham || 51|| yo na pathedidam nityam mokshasamrajyakankshaya | sa bhranto'nyatra dhavan
    vai pashane'pi krandanah || 52|| tasmanmahapanjaramidam dhritva kanthe bhuje'pi va | nityam dhyayan
    mahashaktim parabrahmapadam labhet || 53|| iti parashaktikavacam sampurnam |
  devanagari: ध्यायेत्पद्मासनासीनां देवीं सर्वेश्वरीं शिवाम् । कोटिसूर्यप्रतीकाशां सर्वशक्त्युदयोद्भवाम्
    ॥ परब्रह्ममयीं नित्यां परशक्तिं जगन्मयीम् । मन्त्रपञ्जरमध्यस्थां ध्यायेहं साधकाभये ॥ ॐ एकाक्षरी पातु
    मस्तकं मे लज्जाबीजं ललाटमुपरिष्टात् । वधूबीजं नेत्रयुगलं पातु ह्रीङ्कारं श्रुतिद्वयम् ॥ १॥ क्रीं क्रीं
    पातु नासिकाग्रं हुं हुं मुखं वाग्भवं तथा । दक्षिणाकालिका पातु कण्ठं मे सर्वसिद्धिदा ॥ २॥ ह्रीं ह स
    क ह ल ह्रीं मन्त्रैर्बाहुयुग्मं सदाऽवतु । सरस्वती मन्त्रराजो वक्षस्थलं रक्षतु मे सदा ॥ ३॥ पञ्चाक्षरी
    मन्त्रमयी हृदयस्था सरस्वती । पातु मां सर्वदा देवी मन्त्रैर्बीजसमन्वितैः ॥ ४॥ लक्ष्मीर्बीजं पातु नाभिं
    श्रीं ह्रीं ह्रीं पातु गुह्यकम् । प्रणवः सर्वगात्रेषु रक्षणं कुरुते मम ॥ ५॥ भूर्भुवः स्वः शिरो देशे
    ॐकारः पातु सर्वदा । महो महः सदा पातु मन्त्रैः पञ्चाङ्गपूरितः ॥ ६॥ नमः पातु पादौ नित्यं तपः पातु च
    जङ्घके । सत्यं पातु कटिं देशं ज्योतिर्मयस्वरूपिणी ॥ ७॥ परञ्ज्योतिः पातु चक्षुः परमात्मन् हृदये वस
    । परब्रह्म मन्त्ररत्नं पातु मे सर्वतः सदा ॥ ८॥ श्रीं जीकां पातु मे देहं सर्वाङ्गेषु च सर्वदा । सच्चिदेकं
    ब्रह्म पातु योनिस्थाने विशेषतः ॥ ९॥ हृदये षोडशाक्षरी पातु मन्त्रं महत्तरम् । दशाक्षरी पातु कण्ठे पञ्चाक्षरी
    च मस्तकम् ॥ १०॥ ॐ ह्रीं स्त्रीं हुं फट् च वद वद वाग्वादिनी मे च जिह्वाम् । पातु सर्वत्र देवीं वादे
    वादे प्रवर्धताम् ॥ ११॥ ॐ ऐं ह्रीं क्लीं पातु नेत्रे चामुण्डा पातु पादकम् । विच पातु पदमूलं सर्वदिक्षु
    च सर्वतः ॥ १२॥ क्ष्रौं बीजं जठराग्निं मे रक्षतु सर्वतोमुखि । वाग्वादिनी पातु कण्ठं सर्वमन्त्रमयी स्वयम्
    ॥ १३॥ तारा मन्त्रं सदा पातु मतिं मे ब्रह्मरूपिणीम् । षोडशी मन्त्रराजश्च सर्वान्तान् पातु मे सदा ॥
    १४॥ व्याहृतिभिः सप्ताष्टभिः पातु मे सर्वसन्धिषु । अङ्गानि मे पातु देवी मन्त्रैः सर्वाङ्गशोभनैः ॥ १५॥
    एताः सर्वाः शक्तिदेव्यो देहभागेषु संस्थिताः । परब्रह्म स्वरूपेण मां रक्षन्तु सदा ध्रुवम् ॥ १६॥ ॐ ह्रीं
    ह्रीं पातु मे पृष्ठं ह स क ह ल ह्रीं पातु पादकम् । स क ल ह्रीं पातु जानुनी मन्त्रबीजैश्च रक्षितम्
    ॥ १७॥ गं गणपतये पातु पादौ गुल्फौ सदाऽवतु । ह्रीं श्रियै पातु जङ्घां च नमः पातु च मे कटिम् ॥ १८॥ ऐं
    क्लीं सौः पातु नाभिं च बाला मन्त्रमयी सदा । सौः क्लीं ऐं पातु हृदयं ह्रीङ्कारो मे शिरोधराम् ॥ १९॥
    क्रीं ह्रीं श्रीं पातु सर्वत्र लज्जाशक्तिः प्रपालयेत् । ह्रीं क्ष्रौं चण्डिकायै च पातु मे हस्तकद्वयम्
    ॥ २०॥ भूर्भुवः स्वः प्रपञ्चात्मा सत्यं पातु तु मे तनुम् । ओमकारः सर्वमन्त्रेषु मन्त्रपञ्जरमध्यगः ॥
    २१॥ ज्योतिषां ज्योतिरूर्ध्वं मे पातु चक्षुःप्रदीपकम् । परमात्मनमोऽस्त्वेव पातु मे सर्वमङ्गलम् ॥ २२॥
    परब्रह्मस्वरूपिणी शक्तिः पातु सदाऽमुतः । ॐ नमो ब्रह्मणे तुभ्यं पातु मे सकलं वपुः ॥ २३॥ षडक्षरं महामन्त्रं
    पातु मे बुद्धिमाश्रितम् । सच्चिदेकं च यन्मन्त्रं पातु मे चित्तमव्ययम् ॥ २४॥ ॐकारं पातु मे जिह्वां
    हृदयं मन्त्ररूपिणी । पातु मे चामुण्डा देवी मन्त्रमन्त्राक्षरात्मिका ॥ २५॥ विच पातु मे पार्श्वौ मन्त्रशक्तिर्निरन्तरम्
    । क्ष्रौं रक्षतु मे देहं मन्त्रराट् सन्धिसन्धिषु ॥ २६॥ वद वद वाग्वादिनी मे वाचां सिद्धिं प्रदापयेत्
    । वाग्वादिनी पातु मे वाचं मन्त्रं कण्ठस्थितं सदा ॥ २७॥ एवं मन्त्राक्षरादीनि न्यासक्रमेण च स्थितम्
    । मन्त्रपञ्जरमध्यस्थं पातु मां सर्वतो दिशि ॥ २८॥ न किञ्चिदपि मे रक्ष्यं न किञ्चिदपि मे भयम् । मन्त्रशक्तिर्वपुर्ह्येतत्
    परब्रह्मस्वरूपकम् ॥ २९॥ यथा नाडीषु मन्त्राणां विन्यासो ह्यस्ति देहके । तथैव पातु मां देवी परशक्तिर्महाबला
    ॥ ३०॥ ताराबीजं शिरः पातु ह्रीं पातु मे दृशोर्मणिम् । क्लीं पातु हृदयं मेऽद्य मन्त्रशक्तिर्मयोदिता
    ॥ ३१॥ सर्वमन्त्रमयी देवी सर्वाङ्गेषु च संस्थितम् । रक्षतु मां सदा शक्त्या महाशक्तिस्वरूपा ॥ ३२॥ फलश्रुतिः
    । श्रुत्वाऽस्य कवचं दिव्यं परशक्तिसमन्वितम् । न भूतं न भविष्यच्च न च किञ्चित्समं क्वचित् ॥ ३३॥ यो
    धारयति मर्त्योऽयं स साक्षाच्छक्तिरूपधृक् । सर्वमन्त्रमयी वाणी तस्य जिह्वाग्रगामिनी ॥ ३४॥ यद्यदभिलषते
    नित्यं तत्तदाप्नोति केवलम् । अगणितं च सिद्धिं वै निधिश्रियमवाप्नुयात् ॥ ३५॥ न होमो न च होमश्च न च
    किञ्चित्पुरश्चरम् । अस्य पाठात्प्रसीदन्ति सर्वाः शक्तिः पराः सदा ॥ ३६॥ ब्रह्मराक्षसवेतालाः भूतप्रेतपिशाचकाः
    । दिशं न लभते गन्तुं मन्त्रपञ्जरधारिणः ॥ ३७॥ मारणं मोहनं वश्यं स्तम्भनश्चैव दुर्जयम् । अस्यैव कवचादस्य
    साधको लभते ध्रुवम् ॥ ३८॥ ब्राह्मणाः क्षत्रिया वैश्याः शूद्रा अपि च ये जनाः । न जातिभेदं तत्रास्ति
    न देशं न च कालकम् ॥ ३९॥ स्त्रीणां विशेषलाभश्च कन्यानां च विशेषतः । सौभाग्यं लभते नित्यं यावच्चन्द्रदिवाकरौ
    ॥ ४०॥ मुक्तावस्थो नरो नित्यं परब्रह्मस्वरूपकः । अस्य स्तोत्रस्य माहात्म्यं वक्तुं ब्रह्मा न शक्नुयात्
    ॥ ४१॥ शिवोऽपि च सदा शक्त्या ध्यायते कवचं शुभम् । विष्णुर्लक्ष्मीसमन्वितः पालयत्येव नित्यशः ॥ ४२॥ शक्रः
    सपरिवाराय देवाः सर्वे च मातरः । रक्षन्ति तं सदा भक्तं मन्त्रपञ्जररक्षितम् ॥ ४३॥ इदं न शापितं लोके
    न च कीलकसंयुतम् । न चैव दोषबाहुल्यादस्मिन् कवचे विद्यते ॥ ४४॥ योऽत्र दोषं प्रपश्येत स नरो नरकं व्रजेत्
    । मन्त्रशक्तिस्वरूपं च साक्षाद्ब्रह्ममयं परम् ॥ ४५॥ पठनादस्य मन्त्रस्य रोगव्याधिर्विनश्यति । मृत्युभीतिर्न
    तस्यास्ति सर्वैः पापैः प्रमुच्यते ॥ ४६॥ स्वप्नेऽपि न स पश्येत दारिद्र्यं मन्त्रयोगवित् । कुलजाः पितरस्तस्य
    नित्यं तृप्ताः सुरा अपि ॥ ४७॥ ग्रामं वा यदि वा राज्यं यत्र तत्र पठेदिदम् । तत्र तत्र च सिद्धिः स्यात्
    तत्र तत्र जयाऽऽवहा ॥ ४८॥ यः पठेत्प्रतिमासं वा सङ्क्रान्त्यां वा विशेषतः । तस्य बुद्धिर्न चालोक्या
    सूर्यवत्तेजसाऽधिका ॥ ४९॥ नारायणस्वरूपं च साक्षाच्छक्तिमयं परम् । परब्रह्म महास्तोत्रं सर्वकल्याणकारकम्
    ॥ ५०॥ तस्मात्सर्वप्रयत्नेन साधको नियतः सुधीः । पठेदेतन्महास्तोत्रं नान्यथा विन्दते सुखम् ॥ ५१॥ यो
    न पठेदिदं नित्यं मोक्षसाम्राज्यकाङ्क्षया । स भ्रान्तोऽन्यत्र धावन् वै पाषाणेऽपि क्रन्दनः ॥ ५२॥ तस्मान्महापञ्जरमिदं
    धृत्वा कण्ठे भुजेऽपि वा । नित्यं ध्यायन् महाशक्तिं परब्रह्मपदं लभेत् ॥ ५३॥ इति पराशक्तिकवचं सम्पूर्णम्
    ।
