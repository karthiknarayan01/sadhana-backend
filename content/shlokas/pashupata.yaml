id: pashupata
category: upanishad
name:
  english: pashupata
  devanagari: पशुपत
content:
  english: sastanubhih vyashema devahitam yadayuh || svasti na indro vriddhashravah svasti nah pusha vishvavedah
    | svasti nastarkshyo arishtanemih svasti no brihaspatirdadhatu || om shantih shantih shantih || harih
    om || atha ha vai svayambhurbrahma prajah srijaniti kamakamo jayate kameshvaro vaishravanah | vaishravano
    brahmaputro valakhilyah svayambhuvam paripricchati jagatam ka vidya ka devata jagratturiyayorasya
    ko devo yani tasya vashani kalah kiyatpramanah kasyajnaya ravicandragrahadayo bhasante kasya mahima
    gaganasvarupa etadaham shrotumicchami nanyo janati tvam bruhi brahman | svayambhuruvaca kritsnajagatam
    matrika vidya dvitrivarnasahita dvivarnamata trivarnasahita | caturmatratmakonkaro mama pranatmika
    devata | ahameva jagattrayasyaikah patih | mama vashani sarvani yuganyapi | ahoratradayo matsamvardhitah
    kalah | mama rupa ravestejashcandranakshatragrahatejamsi ca | gagano mama trishaktimayasvarupah nanyo
    madasti | tamomayatmako rudrah satvikamayatmako vishnu rajasamayatmako brahma | indradayastamasarajasatmika
    na satvikah ko'pi aghorah sarvasadharanasvarupah | samastayaganam rudrah pashupatih karta | rudro
    yagadevo vishnuradhvaryurhotendro devata yajnabhug manasam brahma maheshvaram brahma manasam hamsah
    so'ham hamsa iti | tanmayayajno nadanusandhanam | tanmayavikaro jivah | paramatmasvarupo hamsah |
    antarbahishcarati hamsah | antargato'nakashantargatasuparnasvarupo hamsah | shannavatitattvatantuvadvyaktam
    citsutratrayacinmayalakshanam navatattvatriravritam brahmavishnumaheshvaratmakamagnitrayakalopetam
    cidgranthibandhanam | advaitagranthih yajnasadharanangam bahirantarjvalanam yajnangalakshanabrahmasvarupo
    hamsah | upavitalakshanasutrabrahmaga yajnah | brahmangalakshanayukto yajnasutram | tadbrahmasutram
    | yajnasutrasambandhi brahmayajnah | tatsvarupo'ngani matrani mano yajnasya hamso yajnasutram | pranavam
    brahmasutram brahmayajnamayam | pranavantarvarti hamso brahmasutram | tadeva brahmayajnamayam mokshakramam
    | brahmasandhyakriya manoyagah | sandhyakriya manoyagasya lakshanam | yajnasutrapranavabrahmayajnakriyayukto
    brahmanah | brahmacaryena haranti devah | hamsasutracarya yajnah | hamsapranavayorabhedah | hamsasya
    prarthanastrikalah | trikalastrivarnah | tretagnyanusandhano yagah | tretagnyatmakritivarnonkarahamsanusandhano'ntaryagah
    | citsvarupavattanmayam turiyasvarupam | antaraditye jyotihsvarupo hamsah | yajnangam brahmasampattih
    | brahmapravrittau tatpranavahamsasutrenaiva dhyanamacaranti | provaca punah svayambhuvam pratijanite
    brahmaputro rishirvalakhilyah | hamsasutrani katisamkhyani kiyadva pramanam | hridyadityamaricinam
    padam shannavatih | citsutraghranayoh svarnirgata pranavadhara shadanguladashashitih | vamabahurdakshinakathyorantashcarati
    hamsah paramatma brahmaguhyaprakaro nanyatra viditah | jananti te'mritaphalakah | sarvakalam hamsam
    prakashakam | pranavahamsantardhyanaprakritim vina na muktih | navasutranparicarcitan | te'pi yadbrahma
    caranti | antaraditye na jnatam manushyanam | jagadadityo rocata iti jnatva te martya vibudhastapana
    prarthanayukta acaranti | vajapeyah pashuharta adhvaryurindro devata ahimsa dharmayagah paramahamso'dhvaryuh
    paramatma devata pashupatih brahmopanishado brahma | svadhyayayukta brahmanashcaranti | ashvamedho
    mahayajnakatha | tadrajna brahmacaryamacaranti | sarvesham purvoktabrahmayajnakramam muktikramamiti
    brahmaputrah provaca | udito hamsa rishih | svayambhustirodadhe | rudro brahmopanishado hamsajyotih
    pashupatih pranavastarakah sa evam veda | hamsatmamalikavarnabrahmakalapracodita | paramatma pumaniti
    brahmasampattikarini || 1|| adhyatmabrahmakalpasyakritih kidrishi katha | brahmajnanaprabhasandhyakalo
    gacchati dhimatam | hamsakhyo devamatmakhyamatmatattvapraja katham || 2|| antahpranavanadakhyo hamsah
    pratyayabodhakah | antargatapramagudham jnananalam virajitam || 3|| shivashaktyatmakam rupam cinmayanandaveditam
    | nadabindukala trini netram vishvaviceshtitam || 4|| triyangani shikha trini dvitranam samkhyamakritih
    | antargudhaprama hamsah pramanannirgatam bahih || 5|| brahmasutrapadam jneyam brahmam vidhyuktalakshanam
    | hamsarkapranavadhyanamityukto jnanasagare || 6|| etadvijnanamatrena jnanasagaraparagah | svatah
    shivah pashupatih sakshi sarvasya sarvada || 7|| sarvesham tu manastena preritam niyamena tu | vishaye
    gacchati pranashceshtate vagvadatyapi || 8|| cakshuh pashyati rupani shrotram sarvam sha
  devanagari: सस्तनूभिः व्यशेम देवहितं यदायुः ॥ स्वस्ति न इन्द्रो वृद्धश्रवाः स्वस्ति नः पूषा विश्ववेदाः
    । स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः
    ॐ ॥ अथ ह वै स्वयंभूर्ब्रह्मा प्रजाः सृजानीति कामकामो जायते कामेश्वरो वैश्रवणः । वैश्रवणो ब्रह्मपुत्रो
    वालखिल्यः स्वयंभुवं परिपृच्छति जगतां का विद्या का देवता जाग्रत्तुरीययोरस्य को देवो यानि तस्य वशानि
    कालाः कियत्प्रमाणाः कस्याज्ञया रविचन्द्रग्रहादयो भासन्ते कस्य महिमा गगनस्वरूप एतदहं श्रोतुमिच्छामि
    नान्यो जानाति त्वं ब्रूहि ब्रह्मन् । स्वयंभूरुवाच कृत्स्नजगतां मातृका विद्या द्वित्रिवर्णसहिता द्विवर्णमाता
    त्रिवर्णसहिता । चतुर्मात्रात्मकोङ्कारो मम प्राणात्मिका देवता । अहमेव जगत्त्रयस्यैकः पतिः । मम वशानि
    सर्वाणि युगान्यपि । अहोरात्रादयो मत्संवर्धिताः कालाः । मम रूपा रवेस्तेजश्चन्द्रनक्षत्रग्रहतेजांसि
    च । गगनो मम त्रिशक्तिमायास्वरूपः नान्यो मदस्ति । तमोमायात्मको रुद्रः सात्विकमायात्मको विष्णू राजसमायात्मको
    ब्रह्मा । इन्द्रादयस्तामसराजसात्मिका न सात्विकः कोऽपि अघोरः सर्वसाधारणस्वरूपः । समस्तयागानां रुद्रः
    पशुपतिः कर्ता । रुद्रो यागदेवो विष्णुरध्वर्युर्होतेन्द्रो देवता यज्ञभुग् मानसं ब्रह्म माहेश्वरं ब्रह्म
    मानसं हंसः सोऽहं हंस इति । तन्मययज्ञो नादानुसन्धानम् । तन्मयविकारो जीवः । परमात्मस्वरूपो हंसः । अन्तर्बहिश्चरति
    हंसः । अन्तर्गतोऽनकाशान्तर्गतसुपर्णस्वरूपो हंसः । षण्णवतितत्त्वतन्तुवद्व्यक्तं चित्सूत्रत्रयचिन्मयलक्षणं
    नवतत्त्वत्रिरावृतं ब्रह्मविष्णुमहेश्वरात्मकमग्नित्रयकलोपेतं चिद्ग्रन्थिबन्धनम् । अद्वैतग्रन्थिः यज्ञसाधारणाङ्गं
    बहिरन्तर्ज्वलनं यज्ञाङ्गलक्षणब्रह्मस्वरूपो हंसः । उपवीतलक्षणसूत्रब्रह्मगा यज्ञाः । ब्रह्माङ्गलक्षणयुक्तो
    यज्ञसूत्रम् । तद्ब्रह्मसूत्रम् । यज्ञसूत्रसंबन्धी ब्रह्मयज्ञः । तत्स्वरूपोऽङ्गानि मात्राणि मनो यज्ञस्य
    हंसो यज्ञसूत्रम् । प्रणवं ब्रह्मसूत्रं ब्रह्मयज्ञमयम् । प्रणवान्तर्वर्ती हंसो ब्रह्मसूत्रम् । तदेव
    ब्रह्मयज्ञमयं मोक्षक्रमम् । ब्रह्मसन्ध्याक्रिया मनोयागः । सन्ध्याक्रिया मनोयागस्य लक्षणम् । यज्ञसूत्रप्रणवब्रह्मयज्ञक्रियायुक्तो
    ब्राह्मणः । ब्रह्मचर्येण हरन्ति देवाः । हंससूत्रचर्या यज्ञाः । हंसप्रणवयोरभेदः । हंसस्य प्रार्थनास्त्रिकालाः
    । त्रिकालस्त्रिवर्णाः । त्रेताग्न्यनुसन्धानो यागः । त्रेताग्न्यात्माकृतिवर्णोङ्कारहंसानुसन्धानोऽन्तर्यागः
    । चित्स्वरूपवत्तन्मयं तुरीयस्वरूपम् । अन्तरादित्ये ज्योतिःस्वरूपो हंसः । यज्ञाङ्गं ब्रह्मसम्पत्तिः
    । ब्रह्मप्रवृत्तौ तत्प्रणवहंससूत्रेणैव ध्यानमाचरन्ति । प्रोवाच पुनः स्वयंभुवं प्रतिजानीते ब्रह्मपुत्रो
    ऋषिर्वालखिल्यः । हंससूत्राणि कतिसंख्यानि कियद्वा प्रमाणम् । हृद्यादित्यमरीचीनां पदं षण्णवतिः । चित्सूत्रघ्राणयोः
    स्वर्निर्गता प्रणवधारा षडङ्गुलदशाशीतिः । वामबाहुर्दक्षिणकठ्योरन्तश्चरति हंसः परमात्मा ब्रह्मगुह्यप्रकारो
    नान्यत्र विदितः । जानन्ति तेऽमृतफलकाः । सर्वकालं हंसं प्रकाशकम् । प्रणवहंसान्तर्ध्यानप्रकृतिं विना
    न मुक्तिः । नवसूत्रान्परिचर्चितान् । तेऽपि यद्ब्रह्म चरन्ति । अन्तरादित्ये न ज्ञातं मनुष्याणाम् ।
    जगदादित्यो रोचत इति ज्ञात्वा ते मर्त्या विबुधास्तपन प्रार्थनायुक्ता आचरन्ति । वाजपेयः पशुहर्ता अध्वर्युरिन्द्रो
    देवता अहिंसा धर्मयागः परमहंसोऽध्वर्युः परमात्मा देवता पशुपतिः ब्रह्मोपनिषदो ब्रह्म । स्वाध्याययुक्ता
    ब्राह्मणाश्चरन्ति । अश्वमेधो महायज्ञकथा । तद्राज्ञा ब्रह्मचर्यमाचरन्ति । सर्वेषां पूर्वोक्तब्रह्मयज्ञक्रमं
    मुक्तिक्रममिति ब्रह्मपुत्रः प्रोवाच । उदितो हंस ऋषिः । स्वयंभूस्तिरोदधे । रुद्रो ब्रह्मोपनिषदो हंसज्योतिः
    पशुपतिः प्रणवस्तारकः स एवं वेद । हंसात्ममालिकावर्णब्रह्मकालप्रचोदिता । परमात्मा पुमानिति ब्रह्मसम्पत्तिकारिणी
    ॥ १॥ अध्यात्मब्रह्मकल्पस्याकृतिः कीदृशी कथा । ब्रह्मज्ञानप्रभासन्ध्याकालो गच्छति धीमताम् । हंसाख्यो
    देवमात्माख्यमात्मतत्त्वप्रजा कथम् ॥ २॥ अन्तःप्रणवनादाख्यो हंसः प्रत्ययबोधकः । अन्तर्गतप्रमागूढं ज्ञाननालं
    विराजितम् ॥ ३॥ शिवशक्त्यात्मकं रूपं चिन्मयानन्दवेदितम् । नादबिन्दुकला त्रीणि नेत्रं विश्वविचेष्टितम्
    ॥ ४॥ त्रियङ्गानि शिखा त्रीणि द्वित्राणां संख्यमाकृतिः । अन्तर्गूढप्रमा हंसः प्रमाणान्निर्गतं बहिः
    ॥ ५॥ ब्रह्मसूत्रपदं ज्ञेयं ब्राह्मं विध्युक्तलक्षणम् । हंसार्कप्रणवध्यानमित्युक्तो ज्ञानसागरे ॥ ६॥
    एतद्विज्ञानमत्रेण ज्ञानसागरपारगः । स्वतः शिवः पशुपतिः साक्षी सर्वस्य सर्वदा ॥ ७॥ सर्वेषां तु मनस्तेन
    प्रेरितं नियमेन तु । विषये गच्छति प्राणश्चेष्टते वाग्वदत्यपि ॥ ८॥ चक्षुः पश्यति रूपाणि श्रोत्रं सर्वं
    श
