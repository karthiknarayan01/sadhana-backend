id: kaivalyopanishad
category: upanishad
name:
  english: kaivalyopanishad
  devanagari: कैवल्योपनिषद्
content:
  english: athashvalayano bhagavantam parameshthinamupasametyovaca | adhihi bhagavanbrahmavidyam varishtham
    sada sadbhih sevyamanam nigudham | yatha'ciratsarvapapam vyapohya paratparam purusham yati vidvan
    || 1 || tasmai sa hovaca pitamahashca shraddhabhaktidhyanayogadavaihi || 2 || na karmana na prajaya
    dhanena tyagenaike amritatvamanashuh | parena nakam nihitam guhayam vibhrajate yadyatayo vishanti
    || 3 || vedantavijnanasunishcitarthah samnyasayogadyatayah shuddhasattvah | te brahmalokeshu parantakale
    paramritah parimucyanti sarve || 4 || viviktadeshe ca sukhasanasthah shucih samagrivashirah sharirah
    | atyashramasthah sakalendriyani nirudhya bhaktya svagurum pranamya || 5 || hritpundarikam virajam
    vishuddham vicintya madhye vishadam vishokam | acintyamavyaktamanantarupam shivam prashantamamritam
    brahmayonim || 6 || tamadimadhyantavihinamekam vibhum cidanandamarupamadbhutam | umasahayam parameshvaram
    prabhum trilocanam nilakantham prashantam | dhyatva munirgacchati bhutayonim samastasakshim tamasah
    parastat || 7 || sa brahma sa shivah sendrah so'ksharah paramah svarat | sa eva vishnuh sa pranah
    sa kalo'gnih sa candramah || 8 || sa eva sarvam yadbhutam yacca bhavyam sanatanam | jnatva tam mrityumatyeti
    nanyah pantha vimuktaye || 9 || sarvabhutasthamatmanam sarvabhutani catmani | sampashyanbrahma paramam
    yati nanyena hetuna || 10 || atmanamaranim kritva pranavam cottararanim | jnananirmathanabhyasatpapam
    dahati panditah || 11 || sa eva mayaparimohitatma shariramasthaya karoti sarvam | striyannapanadivicitrabhogaih
    sa eva jagratparitriptimeti || 12 || svapne sa jivah sukhaduhkhabhokta svamayaya kalpitajivaloke |
    sushuptikale sakale viline tamo'bhibhutah sukharupameti || 13 || punashca janmantarakarmayogatsa eva
    jivah svapiti prabuddhah | puratraye kridati yashca jivastatastu jatam sakalam vicitram | adharamanandamakhandabodham
    yasmi~llayam yati puratrayam ca || 14 || etasmajjayate prano manah sarvendriyani ca | kham vayurjyotirapashca
    prithivi vishvasya dharini || 15 || yatparam brahma sarvatma vishvasyayatanam mahat | sukshmatsukshmataram
    nityam tattvameva tvameva tat || 16 || jagratsvapnasushuptyadiprapancam yatprakashate | tadbrahmahamiti
    jnatva sarvabandhaih pramucyate || 17 || trishu dhamasu yadbhogyam bhokta bhogashca yadbhavet | tebhyo
    vilakshanah sakshi cinmatro'ham sadashivah || 18 || mayyeva sakalam jatam mayi sarvam pratishthitam
    | mayi sarvam layam yati tadbrahmadvayamasmyaham || 19 || anoraniyanahameva tadvanmahanaham vishvamaham
    vicitram | puratano'ham purusho'hamisho hiranmayo'ham shivarupamasmi || 20 || apanipado'hamacintyashaktih
    pashyamyacakshuh sa shrinomyakarnah | aham vijanami viviktarupo na casti vetta mama citsada'ham ||
    21 || vedairanekairahameva vedyo vedantakridvedavideva caham || 22 || na punyapape mama nasti nasho
    na janma dehendriyabuddhirasti | na bhumirapo na ca vahnirasti na canilo me'sti na cambaram ca ||
    23 || evam viditva paramatmarupam guhashayam nishkalamadvitiyam | samastasakshim sadasadvihinam prayati
    shuddham paramatmarupam || 24 || iti prathamah khandah yah shatarudriyamadhite so'gniputo bhavati
    sa vayuputo bhavati sa atmaputo bhavati sa surapanatputo bhavati sa brahmahatyayah puto bhavati sa
    suvarnasteyatputo bhavati sa krityakrityatputo bhavati tasmadavimuktamashrito bhavattvityashrami sarvada
    sakridva japet || 25 || anena jnanamapnoti samsararnavanashanam | tasmadevam viditvainam kaivalyam
    padamashnute kaivalyam padamashnuta iti || 26 || iti dvitiyah khandah om sahanavavatu | saha nau bhunaktu
    | saha viryam karavavahai | tejasvinavadhitamastu | ma vidvishavahai || om shantih shantih shantih
  devanagari: अथाश्वलायनो भगवन्तं परमेष्ठिनमुपसमेत्योवाच । अधीहि भगवन्ब्रह्मविद्यां वरिष्ठां सदा सद्भिः
    सेव्यमानां निगूढाम् । यथाऽचिरात्सर्वपापं व्यपोह्य परात्परं पुरुषं याति विद्वान् ॥ १ ॥ तस्मै स होवाच
    पितामहश्च श्रद्धाभक्तिध्यानयोगादवैहि ॥ २ ॥ न कर्मणा न प्रजया धनेन त्यागेनैके अमृतत्वमानशुः । परेण
    नाकं निहितं गुहायां विभ्राजते यद्यतयो विशन्ति ॥ ३ ॥ वेदान्तविज्ञानसुनिश्चितार्थाः संन्यासयोगाद्यतयः
    शुद्धसत्त्वाः । ते ब्रह्मलोकेषु परान्तकाले परामृताः परिमुच्यन्ति सर्वे ॥ ४ ॥ विविक्तदेशे च सुखासनस्थः
    शुचिः समग्रीवशिरः शरीरः । अत्याश्रमस्थः सकलेन्द्रियाणि निरुध्य भक्त्या स्वगुरुं प्रणम्य ॥ ५ ॥ हृत्पुण्डरीकं
    विरजं विशुद्धं विचिन्त्य मध्ये विशदं विशोकम् । अचिन्त्यमव्यक्तमनन्तरूपं शिवं प्रशान्तममृतं ब्रह्मयोनिम्
    ॥ ६ ॥ तमादिमध्यान्तविहीनमेकं विभुं चिदानन्दमरूपमद्भुतम् । उमासहायं परमेश्वरं प्रभुं त्रिलोचनं नीलकण्ठं
    प्रशान्तम् । ध्यात्वा मुनिर्गच्छति भूतयोनिं समस्तसाक्षिं तमसः परस्तात् ॥ ७ ॥ स ब्रह्मा स शिवः सेन्द्रः
    सोऽक्षरः परमः स्वराट् । स एव विष्णुः स प्राणः स कालोऽग्निः स चन्द्रमाः ॥ ८ ॥ स एव सर्वं यद्भूतं यच्च
    भव्यं सनातनम् । ज्ञात्वा तं मृत्युमत्येति नान्यः पन्था विमुक्तये ॥ ९ ॥ सर्वभूतस्थमात्मानं सर्वभूतानि
    चात्मनि । सम्पश्यन्ब्रह्म परमं याति नान्येन हेतुना ॥ १० ॥ आत्मानमरणिं कृत्वा प्रणवं चोत्तरारणिम् ।
    ज्ञाननिर्मथनाभ्यासात्पापं दहति पण्डितः ॥ ११ ॥ स एव मायापरिमोहितात्मा शरीरमास्थाय करोति सर्वम् । स्त्रियन्नपानादिविचित्रभोगैः
    स एव जाग्रत्परितृप्तिमेति ॥ १२ ॥ स्वप्ने स जीवः सुखदुःखभोक्ता स्वमायया कल्पितजीवलोके । सुषुप्तिकाले
    सकले विलीने तमोऽभिभूतः सुखरूपमेति ॥ १३ ॥ पुनश्च जन्मान्तरकर्मयोगात्स एव जीवः स्वपिति प्रबुद्धः । पुरत्रये
    क्रीडति यश्च जीवस्ततस्तु जातं सकलं विचित्रम् । आधारमानन्दमखण्डबोधं यस्मिँल्लयं याति पुरत्रयं च ॥ १४
    ॥ एतस्माज्जायते प्राणो मनः सर्वेन्द्रियाणि च । खं वायुर्ज्योतिरापश्च पृथिवी विश्वस्य धारिणी ॥ १५ ॥
    यत्परं ब्रह्म सर्वात्मा विश्वस्यायतनं महत् । सूक्ष्मात्सूक्ष्मतरं नित्यं तत्त्वमेव त्वमेव तत् ॥ १६
    ॥ जाग्रत्स्वप्नसुषुप्त्यादिप्रपञ्चं यत्प्रकाशते । तद्ब्रह्माहमिति ज्ञात्वा सर्वबन्धैः प्रमुच्यते ॥
    १७ ॥ त्रिषु धामसु यद्भोग्यं भोक्ता भोगश्च यद्भवेत् । तेभ्यो विलक्षणः साक्षी चिन्मात्रोऽहं सदाशिवः
    ॥ १८ ॥ मय्येव सकलं जातं मयि सर्वं प्रतिष्ठितम् । मयि सर्वं लयं याति तद्ब्रह्माद्वयमस्म्यहम् ॥ १९ ॥
    अणोरणीयानहमेव तद्वन्महानहं विश्वमहं विचित्रम् । पुरातनोऽहं पुरुषोऽहमीशो हिरण्मयोऽहं शिवरूपमस्मि ॥
    २० ॥ अपाणिपादोऽहमचिन्त्यशक्तिः पश्याम्यचक्षुः स शृणोम्यकर्णः । अहं विजानामि विविक्तरूपो न चास्ति वेत्ता
    मम चित्सदाऽहम् ॥ २१ ॥ वेदैरनेकैरहमेव वेद्यो वेदान्तकृद्वेदविदेव चाहम् ॥ २२ ॥ न पुण्यपापे मम नास्ति
    नाशो न जन्म देहेन्द्रियबुद्धिरस्ति । न भूमिरापो न च वह्निरस्ति न चानिलो मेऽस्ति न चाम्बरं च ॥ २३ ॥
    एवं विदित्वा परमात्मरूपं गुहाशयं निष्कलमद्वितीयम् । समस्तसाक्षिं सदसद्विहीनं प्रयाति शुद्धं परमात्मरूपम्
    ॥ २४ ॥ इति प्रथमः खण्डः यः शतरूद्रियमधीते सोऽग्निपूतो भवति स वायुपूतो भवति स आत्मपूतो भवति स सुरापानात्पूतो
    भवति स ब्रह्महत्यायाः पूतो भवति स सुवर्णस्तेयात्पूतो भवति स कृत्याकृत्यात्पूतो भवति तस्मादविमुक्तमाश्रितो
    भवत्त्वित्याश्रमी सर्वदा सकृद्वा जपेत् ॥ २५ ॥ अनेन ज्ञानमाप्नोति संसारार्णवनाशनम् । तस्मादेवं विदित्वैनं
    कैवल्यं पदमश्नुते कैवल्यं पदमश्नुत इति ॥ २६ ॥ इति द्वितीयः खण्डः ॐ सहनाववतु । सह नौ भुनक्तु । सह वीर्यं
    करवावहै । तेजस्विनावधीतमस्तु । मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः
