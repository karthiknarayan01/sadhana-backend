id: uddhava-geetha-chapter-4
category: stotram
name:
  english: Uddhava Geetha - Chapter 4
content:
  english: atha caturtho'dhyayah | raja uvaca | yani yani iha karmani yaih yaih svacchandajanmabhih |
    cakre karoti karta va harih tani bruvantu nah || || drumilah uvaca | yah va anantasya gunan anantan
    anukramishyan sah tu balabuddhih | rajamsi bhumeh ganayet kathancit kalena na eva akhilashaktidhamnah
    || || bhutaih yada pancabhih atmasrishtaih puram virajam viracayya tasmin | svamshena vishtah purushabhidhana
    mavapa narayanah adidevah || || yat kayah eshah bhuvanatrayasanniveshah yasya indriyaih tanubhritam
    ubhayaindriyani | jnanam svatah shvasanatah balam ojah iha sattvadibhih sthitilayaudbhavah adikarta
    || || adau abhut shatadhriti rajasa asya sarge vishnu sthitau kratupatih dvijadharmasetuh | rudrah
    api ayaya tamasa purushah sah adyah iti udbhavasthitilayah satatam prajasu || || dharmasya dakshaduhitaryajanishtah
    murtya narayanah narah rishipravarah prashantah | naishkarmyalakshanam uvaca cacara karma yah adya
    api ca asta rishivaryanishevitanghrih || || indrah vishankya mama dhama jighrikshati iti kamam nyayunkta
    saganam sah badariupakhyam | gatva apsaroganavasantasumandavataih striprekshana ishubhih avidhyatat
    mahijnah || || vijnaya shakrakritam akramam adidevah praha prahasya gatavismayah ejamanan | ma bhaishta
    bho madana maruta devavadhvah grihnita nah balim ashunyam imam kurudhvam || || ittham bruvati abhayade
    naradeva devah savridanamrashirasah saghrinam tam ucuh | na etat vibho tvayi pare avikrite vicitram
    svaramadhih anikaranatapadapadme || || tvam sevatam surakrita bahavah antarayah svauko vilanghya paramam
    vrajatam padam te | na anyasya barhishi balin dadatah svabhagan dhatte padam tvam avita yadi vighnamurdhni
    || || kshut trittrikalagunamarutajaivhyashaishnyan asman aparajaladhin atitirya kecit | krodhasya
    yanti viphalasya vasha pade goh majjanti dushcaratapah ca vritha utsrijanti || || iti pragrinatam
    tesham striyah ati adbhutadarshanah | darshayamasa shushrusham svarcitah kurvatih vibhuh || || te
    deva anucarah drishtva striyah shrih iva rupinih | gandhena mumuhuh tasam rupa audaryahatashriyah
    || || tan aha devadeva ishah pranatan prahasan iva | asam ekatamam vringdhvam savarnam svargabhushanam
    || || om iti adesham adaya natva tam suravandinah | urvashim apsarahshreshtham puraskritya divam yayuh
    || || indraya anamya sadasi shrunvatam tridivaukasam | ucuh narayanabalam shakrah tatra asa vismitah
    || || hamsasvarupi avadadat acyutah atmayogam dattah kumara rishabhah bhagavan pita nah | vishnuh
    shivaya jagatam kalaya avatirnah tena ahritah madhubhida shrutayah hayasye || || guptah api aye manuh
    ila oshadhayah ca matsye kraude hatah ditijah uddharata ambhasah kshmam | kaurme dhritah adrih amrita
    unmathane svaprishthe grahat prapannamibharajam amuncat artam || || samstunvatah abdhipatitan shramanan
    rishim ca shakram ca vritravadhatah tamasi pravishtam | devastriyah asuragrihe pihitah anathah jaghne
    asurendram abhayaya satam nrisimhe || || deva asure yudhi ca daityapatin surarthe hatva antareshu
    bhuvanani adadhat kalabhih | bhutva atha vamanah imam aharat baleh kshmam yancacchalena samadat aditeh
    sutebhyah || || nihkshatriyam akrita gam ca trihsaptakritvah ramah tu haihayakula api ayabhargava
    agnih | sah abdhim babandha dashavaktram ahan salankam sitapatih jayati lokam alaghnakirtih || ||
    bhumeh bhara avataranaya yadushi ajanma jatah karishyati suraih api dushkarani | vadaih vimohayati
    yajnakritah atadarhan shudram kalau kshitibhujah nyahanishyadante || || evamvidhani karmani janmani
    ca jagat pateh | bhurini bhuriyashasah varnitani mahabhuja || || iti shrimadbhagavate mahapurane paramahamsyam
    samhitayamekadashaskandhe nimijayantasamvade caturtho'dhyayah ||
  devanagari: अथ चतुर्थोऽध्यायः । राजा उवाच । यानि यानि इह कर्माणि यैः यैः स्वच्छन्दजन्मभिः । चक्रे करोति
    कर्ता वा हरिः तानि ब्रुवन्तु नः ॥ ॥ द्रुमिलः उवाच । यः वा अनन्तस्य गुणान् अनन्तान् अनुक्रमिष्यन् सः
    तु बालबुद्धिः । रजांसि भूमेः गणयेत् कथञ्चित् कालेन न एव अखिलशक्तिधाम्नः ॥ ॥ भूतैः यदा पञ्चभिः आत्मसृष्टैः
    पुरं विराजं विरचय्य तस्मिन् । स्वांशेन विष्टः पुरुषाभिधान मवाप नारायणः आदिदेवः ॥ ॥ यत् कायः एषः भुवनत्रयसन्निवेशः
    यस्य इन्द्रियैः तनुभृतां उभयैन्द्रियाणि । ज्ञानं स्वतः श्वसनतः बलं ओजः ईहा सत्त्वादिभिः स्थितिलयौद्भवः
    आदिकर्ता ॥ ॥ आदौ अभूत् शतधृती रजस अस्य सर्गे विष्णु स्थितौ क्रतुपतिः द्विजधर्मसेतुः । रुद्रः अपि अयाय
    तमसा पुरुषः सः आद्यः इति उद्भवस्थितिलयाः सततं प्रजासु ॥ ॥ धर्मस्य दक्षदुहितर्यजनिष्टः मूर्त्या नारायणः
    नरः ऋषिप्रवरः प्रशान्तः । नैष्कर्म्यलक्षणं उवाच चचार कर्म यः अद्य अपि च आस्त ऋषिवर्यनिषेविताङ्घ्रिः
    ॥ ॥ इन्द्रः विशङ्क्य मम धाम जिघृक्षति इति कामं न्ययुङ्क्त सगणं सः बदरिउपाख्यम् । गत्वा अप्सरोगणवसन्तसुमन्दवातैः
    स्त्रीप्रेक्षण इषुभिः अविध्यतत् महिज्ञः ॥ ॥ विज्ञाय शक्रकृतं अक्रमं आदिदेवः प्राह प्रहस्य गतविस्मयः
    एजमानान् । मा भैष्ट भो मदन मारुत देववध्वः गृह्णीत नः बलिं अशून्यं इमं कुरुध्वम् ॥ ॥ इत्थं ब्रुवति
    अभयदे नरदेव देवाः सव्रीडनम्रशिरसः सघृणं तं ऊचुः । न एतत् विभो त्वयि परे अविकृते विचित्रम् स्वारामधीः
    अनिकरानतपादपद्मे ॥ ॥ त्वां सेवतां सुरकृता बहवः अन्तरायाः स्वौको विलङ्घ्य परमं व्रजतां पदं ते । न अन्यस्य
    बर्हिषि बलीन् ददतः स्वभागान् धत्ते पदं त्वं अविता यदि विघ्नमूर्ध्नि ॥ ॥ क्षुत् तृट्त्रिकालगुणमारुतजैव्ह्यशैश्न्यान्
    अस्मान् अपारजलधीन् अतितीर्य केचित् । क्रोधस्य यान्ति विफलस्य वश पदे गोः मज्जन्ति दुश्चरतपः च वृथा
    उत्सृजन्ति ॥ ॥ इति प्रगृणतां तेषां स्त्रियः अति अद्भुतदर्शनाः । दर्शयामास शुश्रूषां स्वर्चिताः कुर्वतीः
    विभुः ॥ ॥ ते देव अनुचराः दृष्ट्वा स्त्रियः श्रीः इव रूपिणीः । गन्धेन मुमुहुः तासां रूप औदार्यहतश्रियः
    ॥ ॥ तान् आह देवदेव ईशः प्रणतान् प्रहसन् इव । आसां एकतमां वृङ्ग्ध्वं सवर्णां स्वर्गभूषणाम् ॥ ॥ ॐ इति
    आदेशं आदाय नत्वा तं सुरवन्दिनः । उर्वशीं अप्सरःश्रेष्ठां पुरस्कृत्य दिवं ययुः ॥ ॥ इन्द्राय आनम्य सदसि
    श्रुण्वतां त्रिदिवौकसाम् । ऊचुः नारायणबलं शक्रः तत्र आस विस्मितः ॥ ॥ हंसस्वरूपी अवददत् अच्युतः आत्मयोगम्
    दत्तः कुमार ऋषभः भगवान् पिता नः । विष्णुः शिवाय जगतां कलया अवतीर्णः तेन आहृताः मधुभिदा श्रुतयः हयास्ये
    ॥ ॥ गुप्तः अपि अये मनुः इला ओषधयः च मात्स्ये क्रौडे हतः दितिजः उद्धरता अम्भसः क्ष्माम् । कौर्मे धृतः
    अद्रिः अमृत उन्मथने स्वपृष्ठे ग्राहात् प्रपन्नमिभराजं अमुञ्चत् आर्तम् ॥ ॥ संस्तुन्वतः अब्धिपतितान्
    श्रमणान् ऋषीं च शक्रं च वृत्रवधतः तमसि प्रविष्टम् । देवस्त्रियः असुरगृहे पिहिताः अनाथाः जघ्ने असुरेन्द्रं
    अभयाय सतां नृसिंहे ॥ ॥ देव असुरे युधि च दैत्यपतीन् सुरार्थे हत्वा अन्तरेषु भुवनानि अदधात् कलाभिः ।
    भूत्वा अथ वामनः इमां अहरत् बलेः क्ष्माम् याञ्चाच्छलेन समदात् अदितेः सुतेभ्यः ॥ ॥ निःक्षत्रियां अकृत
    गां च त्रिःसप्तकृत्वः रामः तु हैहयकुल अपि अयभार्गव अग्निः । सः अब्धिं बबन्ध दशवक्त्रं अहन् सलङ्कम्
    सीतापतिः जयति लोकं अलघ्नकीर्तिः ॥ ॥ भूमेः भर अवतरणाय यदुषि अजन्मा जातः करिष्यति सुरैः अपि दुष्कराणि
    । वादैः विमोहयति यज्ञकृतः अतदर्हान् शूद्रां कलौ क्षितिभुजः न्यहनिष्यदन्ते ॥ ॥ एवंविधानि कर्माणि जन्मानि
    च जगत् पतेः । भूरीणि भूरियशसः वर्णितानि महाभुज ॥ ॥ इति श्रीमद्भगवते महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे
    निमिजायन्तसंवादे चतुर्थोऽध्यायः ॥
