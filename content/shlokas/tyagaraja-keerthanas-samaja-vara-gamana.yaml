id: tyagaraja-keerthanas-samaja-vara-gamana
category: stotram
name:
  english: Tyagaraja Keerthanas Samaja Vara Gamana
content:
  english: adi pallavi samaja vara gamana sadhu hrit sarasabju pala kalatita vikhyata anupallavi sama
    nigamaja sudha maya gana vicakshana gunashila dayalavala mam palaya samaja vara gamana sapta svara
    nada cala dipa svikrita yadavakula murali vadana vinoda mohana kara tyagaraja vandaniya samaja vara
    gamana sadhu hrit sarasabju pala kalatita vikhyata
  devanagari: आदि पल्लवि सामज वर गमन साधु हृत् सारसाब्जु पाल कालातीत विख्यात अनुपल्लवि साम निगमज सुधा
    मय गान विचक्षण गुणशील दयालवाल मां पालय सामज वर गमन सप्त स्वर नादा चल दीप स्वीकृत यादवकुल मुरली वादन
    विनोद मोहन कर त्यागराज वन्दनीय सामज वर गमन साधु हृत् सारसाब्जु पाल कालातीत विख्यात
meaning: {}
