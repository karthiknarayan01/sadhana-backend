    चान्द्रमसादीष्टिब्राह्मणम् च॒न्द्रमा॒ वा अ॑कामयत । अ॒हो॒रा॒त्रा मा॒प्त्वा । च॒न्द्रम॑स॒ स्सायु॑ज्यग्ं
