id: brahmanakritamsuryastotram-17
category: stotram
name:
  english: brahmanakritamsuryastotram 17
  devanagari: ब्रह्मणाकृतंसूर्यस्तोत्रम् १७
content:
  english: brahmana kritam suryastotram 17 brahmovaca | bhagavantam bhagakaram shantacittamanuttamam |
    devamargapranetaram pranato'smi ravim sada || 36|| shashvatam shobhanam shuddham citrabhanum divaspatim
    | devadeveshamishesham pranato'smi divakaram || 37|| sarvaduhkhaharam devam sarvaduhkhaharam ravim
    | varananam varangam ca varasthanam varapradam || 38|| varenyam varadam nityam pranato'smi vibhavasum
    | arkamaryamanam cendram vishnumisham divakaram || 39|| deveshvaram devaratam pranato'smi vibhavasum
    | ya idam sha
  devanagari: ब्रह्मणा कृतं सूर्यस्तोत्रम् १७ ब्रह्मोवाच । भगवन्तं भगकरं शान्तचित्तमनुत्तमम् । देवमार्गप्रणेतारं
    प्रणतोऽस्मि रविं सदा ॥ ३६॥ शाश्वतं शोभनं शुद्धं चित्रभानुं दिवस्पतिम् । देवदेवेशमीशेशं प्रणतोऽस्मि
    दिवाकरम् ॥ ३७॥ सर्वदुःखहरं देवं सर्वदुःखहरं रविम् । वराननं वराङ्गं च वरस्थानं वरप्रदम् ॥ ३८॥ वरेण्यं
    वरदं नित्यं प्रणतोऽस्मि विभावसुम् । अर्कमर्यमणं चेन्द्रं विष्णुमीशं दिवाकरम् ॥ ३९॥ देवेश्वरं देवरतं
    प्रणतोऽस्मि विभावसुम् । य इदं श
