id: lalitasahasranamastotrashiva-2
category: sahasranama
name:
  english: lalitasahasranamastotrashiva
  devanagari: ललितासहस्रनामस्तोत्रशिव
content:
  english: om anadya parama vidya pradhana prakritih para | pradhanapurusharadhya pradhanapurusheshvari
    || 29|| pranatmika pranashaktih sarvapranahitaishini | uma cottamakeshinyuttama conmattabhairavi ||
    30|| urvashi connata cogra mahogra connatastani | ugracandogranayana mahogra daityanashini || 31||
    ugraprabhavati cogravega'nugra'pramardini | ugratarogranayana cordhvasthananivasini || 32|| unmattanayana'tyugradantottungasthalalaya
    | ullasinyullasacitta cotphullanayanojjvala || 33|| utphullakamalarudha kamala kamini kala | kali
    karalavadana kamini mukhakamini || 34|| komalangi krishangi ca kaitabhasuramardini | kalindi kamalastha
    ca kanta kananavasini || 35|| kulina nishkala krishna kalaratrisvarupini | kumari kamarupa ca kamini
    krishnapingala || 36|| kapila shantida shuddha shankarardhasharirini | kaumari karttiki durga kaushiki
    kundalojjavala || 37|| kuleshvari kulashreshtha kundalojjvalamastaka | bhavani bhavini vani shiva
    ca shivamohini || 38|| shivapriya shivaradhya shivapranaikavallabha | shivapatni shivastutya shivanandapradayini
    || 39|| nityanandamayi nitya saccidanandavigraha | trailokyajanani shambhuhridayastha sanatani ||
    40|| sadaya nirdaya maya shiva trailokyamohini | brahmaditridasharadhya sarvabhishtapradayini || 41||
    brahmani brahma gayatri savitri brahmasamstuta | brahmopasya brahmashaktirbrahmasrishtividhayini ||
    42|| kamandalukara srishtikartri brahmasvarupini | caturbhujatmika yajnasutrarupa dridhavrata || 43||
    hamsarudha caturvaktra caturvedabhisamstuta | vaishnavi palanakari mahalakshmirharipriya || 44|| shankhacakradhara
    vishnushaktirvishnusvarupini | vishnupriya vishnumaya vishnupranaikavallabha || 45|| yoganidra'kshara
    vishnumohini vishnusamstuta | vishnusammohanakari trailokyaparipalini || 46|| shankhini cakrini padma
    padmini musalayudha | padmalaya padmahasta padmamaladibhushita || 47|| garudastha carurupa sampadrupa
    sarasvati | vishnuparshvasthita vishnuparama''hladadayini || 48|| sampattih sampadadhara sarvasampatpradayini
    | shrirvidya sukhada saukhyadayini duhkhanashini || 49|| duhkhahantri sukhakari sukhasina sukhaprada
    | sukhaprasannavadana narayanamanorama || 50|| narayani jagaddhatri narayanavimohini | narayanasharirastha
    vanamalavibhushita || 51|| daityaghni pitavasana sarvadaityapramardini | varahi narasimhi ca ramacandrasvarupini
    || 52|| rakshoghni kananavasa cahalyashapamocini | setubandhakari sarvarakshahkulavinashini || 53||
    sita pativrata sadhvi ramapranaikavallabha | ashokakananavasa lankeshvaravinashini || 54|| nitih sunitih
    sukritih kirtirmedha vasundhara | divyamalyadhara divya divyagandhanulepana || 55|| divyavastraparidhana
    divyasthananivasini | maheshvari pretasamstha pretabhuminivasini || 56|| nirjanastha shmashanastha
    bhairavi bhimalocana | sughoranayana ghora ghorarupa ghanaprabha || 57|| ghanastani vara shyama pretabhumikritalaya
    | khatvangadharini dvipicarmambarasushobhana || 58|| mahakali candavaktra candamundavinashini | udyanakananavasa
    pushpodyanavanapriya || 59|| balipriya mamsabhakshya rudhirasavabhakshini | bhimarava sattahasa rananrityaparayana
    || 60|| asurasrikpriya tushta daityadanavamardini | daityavidravini daityamathani daityasudani ||
    61|| detyaghni daityahantri ca mahishasuramardini | raktabijanihantri ca shumbhasuravinashini || 62||
    nishumbhahantri dhumrakshamardini durgaharini | durgasuranihantri ca shivaduti mahabala || 63|| mahabalavati
    citravastra raktambara'mala | vimala lalita caruhasa carustrilocana || 64|| ajeya jayada jyeshtha
    jayashila'parajita | vijaya jahnavi dushtajrimbhini jayadayini || 65|| jagadrakshakari sarvajagaccaitanyakarini
    | jaya jayanti janani janabhakshanatatpara || 66|| jalarupa jalastha ca japya japakavatsala | jajjvalyamana
    yajnesha janmanashavivarjita || 67|| jaratita jaganmata jagadrupa jaganmayi | jangama jvalini jrimbha
    stambhini dushtatapini || 68|| tripuraghni trinayana mahatripuratapini | trishna jatih pipasa ca bubhuksha
    tripura prabha || 69|| tvarita triputa tryaksha tanvi tapavivarjita | trilokeshi tivravega tivra tivrabalalaya
    || 70|| nihshanka nirmalabha ca niratanka'malaprabha | vinita vinayabhijna visheshajna vilakshana
    || 71|| varada vallabha vidyutprabha vinayashalini | bimboshthi vidhuvaktra ca vivastra vinayaprabha
    || 72|| vishveshapatni vishvatma vishvarupa balotkata | vishveshi vishvavanita vishvamata vicakshana
    || 73|| vidushi vishvavidita vishvamohanakarini | vishvamurtirvishvadhara vishveshaparipalini || 74||
    vishvakartri vishvahartri vishvapalanatatpara | vishveshahridayavasa vishveshvaramanorama || 75||
    vishvaha vishvanilaya vishvamaya vibhutida | vishva vishvopakara ca vishvapranatmikapi ca || 76||
    vishvapriya vishvamayi vishvadushtavinashini | dakshayani dakshakanya dakshayajnavinashini || 77||
    vishvambhari vasumati vasudha vishvapavani | sarvatishayini sarvaduhkhadaridryaharini || 78|| mahavibhutiravyakta
    shashvati sarvasiddhida | acintya'cintyarupa ca kevala paramatmika || 79|| sarvajna sarvavishaya sarvopariparayana
    | sarvasyartihara sarvamangala mangalaprada || 80|| mangalarha mahadevi sarvamangaladayika | sarvantarastha
    sarvartharupini ca niranjana || 81|| cicchaktishcinmayi sarvavidya sarvavidhayini | shantih shantikari
    saumya sarva sarvapradayini || 82|| shantih kshama kshemakari kshetrajna kshetravasini | kshanatmika
    kshinatanuh kshinangi kshinamadhyama || 83|| kshipraga kshemada kshipta kshanada kshanavasini | vrittirnivrittirbhutanam
    pravrittirvrittalocana || 84|| vyomamurtirvyomasamstha vyomalayakritashraya | candranana candrakantishcandrardhankitamastaka
    || 85|| candraprabha candrakala sharaccandranibhanana | candratmika candramukhi candrashekharavallabha
    || 86|| candrashekharavakshahstha candralokanivasini | candrashekharashailastha cancala cancalekshana
    || 87|| chinnamasta chagamamsapriya chagabalipriya | jyotsna jyotirmayi sarvajyayasi jivanatmika ||
    88|| sarvakaryaniyantri ca sarvabhutahitaishini | gunatita gunamayi triguna gunashalini || 89|| gunaikanilaya
    gauri guhya gopakulodbhava | gariyasi gururata guhyasthananivasini || 90|| gunajna nirguna sarvagunarha
    guhyaka'mbika | galajjata galatkesha galadrudhiracarcita || 91|| gajendragamana gantri gitanrityaparayana
    | gamanastha gayadhyaksha ganeshajanani tatha || 92|| ganapriya ganarata grihastha grihini para |
    gajasamstha gajarudha grasanti garudasana || 93|| yogastha yoginigamya yogacintaparayana | yogidhyeya
    yogivandya yogalabhya yugatmika || 94|| yogijneya yogayukta mahayogeshvareshvari | yoganurakta yugada
    yugantajaladaprabha || 95|| yuganukarini yajnarupa suryasamaprabha | yugantanilavega ca sarvayajnaphalaprada
    || 96|| samsarayonih samsaravyapini saphalaspada | samsaratarunihsevya samsararnavatarini || 97||
    sarvarthasadhika sarva samsaravyapini tatha | samsarabandhakartri ca samsaraparivarjita || 98|| durnirikshya
    sudushprapya bhutirbhutimatityapi | atyantavibhava'rupa mahavibhavarupini || 99|| shabdabrahmasvarupa
    ca shabdayonih paratpara | bhutida bhutimata ca bhutistandri vibhutida || 100|| bhutantarastha kutastha
    bhutanathapriyangana | bhutamata bhutanatha bhutalayanivasini || 101|| bhutanrityapriya bhutasangini
    bhutalashraya | janmamrityujaratita mahapurushasangata || 102|| bhujaga tamasi vyakta tamogunavati
    tatha | tritattva tattvarupa ca tattvajna tattvakapriya || 103|| tryambaka tryambakarata shukla tryambakarupini
    | trikalajna janmahina raktangi jnanarupini || 104|| akarya karyajanani brahmakhya brahmasamsthita
    | vairagyayukta vijnanagamya dharmasvarupini || 105|| sarvadharmavidhanajna dharmishtha dharmatatpara
    | dharmishthapalanakari dharmashastraparayana || 106|| dharmadharmavihina ca dharmajanyaphalaprada
    | dharmini dharmanirata dharminamishtadayini || 107|| dhanya dhirdharana dhira dhanvini dhanadayini
    | dhanushmati dharasamstha dharani sthitikarini || 108|| sarvayonirvishvayonirapamyonirayonija | rudrani
    rudravanita rudraikadasharupini || 109|| rudrakshamalini raudri bhuktimuktiphalaprada | brahmopendrapravandya
    ca nityam muditamanasa || 110|| indrani vasavi caindri vicitrairavatasthita | sahasranetra divyangi
    divyakeshavilasini || 111|| divyangana divyanetra divyacandanacarcita | divyalankarana divyashvetacamaravijita
    || 112|| divyahara divyapada divyanupurashobhita | keyurashobhita hrishta hrishtacittapraharshini
    || 113|| samprahrishtamana harshaprasannavadana tatha | devendravandyapadabja devendraparipujita ||
    114|| rajasa raktanayana raktapushpapriya sada | raktangi raktanetra ca raktotpalavilocana || 115||
    raktabha raktavastra ca raktacandanacarcita | raktekshana raktabhakshya raktamattoragashraya || 116||
    raktadanta raktajihva raktabhakshanatatpara | raktapriya raktatushta raktapanasutatpara || 117|| bandhukakusumabha
    ca raktamalyanulepana | sphuradraktancitatanuh sphuratsuryashataprabha || 118|| sphurannetra pingajata
    pingala pingalekshana | bagala pitavastra ca pitapushpapriya sada || 119|| pitambara pibadrakta pitapushpopashobhita
    | shatrughni shatrusammohajanani shatrutapini || 120|| shatrupramardini shatruvakyastambhanakarini
    | uccatanakari sarvadushtotsaranakarini || 121|| shatruvidravini shatrusammohanakari tatha | vipakshamardanakari
    shatrupakshakshayankari || 122|| sarvadushtaghatini ca sarvadushtavinashini | dvibhuja shulahasta
    ca trishulavaradharini || 123|| dushtasantapajanani dushtakshobhapravardhini | dushtanam kshobhasambaddha
    bhaktakshobhanivarini || 124|| dushtasantapini dushtasantapaparimardini | santaparahita bhaktasantapaparinashini
    || 125|| advaita dvaitarahita nishkala brahmarupini | tridasheshi trilokeshi sarveshi jagadishvari
    || 126|| brahmeshasevitapada sarvavandyapadambuja | acintyarupacarita cacintyabalavikrama || 127||
    sarvacintyaprabhava ca svaprabhavapradarshini | acintyamahima'cintyarupa saundaryashalini || 128||
    acintyaveshashobha ca lokacintyagunanvita | acintyashaktirdushcintyaprabhava cintyarupini || 129||
    yogicintya mahacintanashini cetanatmika | girija dakshaja vishvajanayitri jagatprasuh || 130|| sannamya'pranata
    sarvapranatartihari tatha | pranataishvaryada sarvapranatashubhanashini || 131|| pranatapannashakari
    pranatashubhamocani | siddheshvari siddhasevya siddhacaranasevita || 132|| siddhiprada siddhikari
    sarvasiddhaganeshvari | ashtasiddhiprada siddhaganasevyapadambuja || 133|| katyayani svadha svaha
    vashad vaushatsvarupini | pitrinam triptijanani kavyarupa sureshvari || 134|| havyabhoktri havyatushta
    pitrirupa'sitapriya | krishpapakshaprapujya ca pretapakshasamarcita || 135|| ashtahasta dashabhuja
    cashtadashabhujanvita | caturdashabhuja'sankhyabhujavallivirajita || 136|| simhaprishthasamarudha
    sahasrabhujarajita | bhuvaneshi cannapurna mahatripurasundari || 137|| tripura sundari saumyamukhi
    sundaralocana | sundarasya shubhradamshtra subhruh parvatanandini || 138|| nilotpaladalashyama smerotphullamukhambuja
    | satyasandha padmavaktra bhrukutikutilanana || 139|| vidyadhari vararoha mahasandhyasvarupini | arundhati
    hiranyakshi sudhumrakshi shubhekshana || 140|| shrutih smritih kritiryogamaya punya puratani | vagdevata
    vedavidya brahmavidyasvarupini || 141|| vedashaktirvedamata vedadya parama gatih | anvikshiki tarkavidya
    yogashastraprakashini || 142|| dhumavati viyanmurtirvidyunmala vilasini | mahavrata sadanandanandini
    naganandini || 143|| sunanda yamuna candi rudracandi prabhavati | parijatavanavasa parijatavanapriya
    || 144|| supushpagandhasantushta divyapushpopashobhita | pushpakananasadvasa pushpamalavilasini ||
    145|| pushpamalyadhara pushpagucchalankritadehika | prataptakancanabhasa shuddhakancanamandita ||
    146|| suvarnakundalavati svarnapushpapriya sada | narmada sindhunilaya samudratanaya tatha || 147||
    shodashi shodashabhuja mahabhujangamandita | patalavasini nagi nagendrakritabhushana || 148|| nagini
    nagakanya ca nagamata nagalaya | durga''pattarini durgadushtagrahanivarini || 149|| abhaya''pannihantri
    ca sarvapatparinashini | brahmanya shrutishastrajna jagatam karanatmika || 150|| nishkarana janmahina
    mrityunjayamanorama | mrityunjayahridavasa muladharanivasini || 151|| shatcakrasamstha mahati mahotsavavilasini
    | rohini sundaramukhi sarvavidyavisharada || 152|| sadasadvasturupa ca nishkama kamapidita | kamatura
    kamamatta kamamanasasattanuh || 153|| kamarupa ca kalindi kacalambitavigraha | atasikusumabhasa simhaprishthanishedushi
    || 154|| yuvati yauvanodrikta yauvanodriktamanasa | aditirdevajanani tridashartivinashini || 155||
    dakshina'purvavasana purvakalavivarjita | ashoka shokarahita sarvashokanivarini || 156|| ashokakusumabhasa
    shokaduhkhakshayankari | sarvayoshitsvarupa ca sarvapranimanorama || 157|| mahashcarya madashcarya
    mahamohasvarupini | mahamokshakari mohakarini mohadayini || 158|| ashocya purnakama ca purna purnamanoratha
    | purnabhilashita purnanishanathasamanana || 159|| dvadasharkasvarupa ca sahasrarkasamaprabha | tejasvini
    siddhamata candra nayanarakshana || 160|| apara'paramahatmya nityavijnanashalini | vivasvati havyavaha
    jatavedahsvarupini || 161|| svairini svecchavihara nirbija bijarupini | anantavarna'nantakhya'nantasamstha
    mahodari || 162|| dushtabhutapahantri ca saddhrittaparipalika | kapalini panamatta mattavaranagamini
    || 163|| vindhyastha vindhyanilaya vindhyaparvatavasini | bandhupriya jagadvandhuh pavitra sapavitrini
    || 164|| paramrita'mritakala capamrityuvinashini | maharajatasankasha rajatadrinivasini || 165|| kashivilasini
    kashikshetrarakshanatatpara | yonirupa yonipithasthita yonisvarupini || 166|| kamollasitacarvangi
    katakshakshepamohini | katakshakshepanirata kalpavrikshasvarupini || 167|| pashankushadhara shaktidharini
    khetakayudha | banayudha'moghashastra divyashastra'stravarshini || 168|| mahastrajalavikshepavipakshakshayakarini
    | ghantini pashini pashahasta pashankushayudha || 169|| citrasimhasanagata mahasimhasanasthita | mantratmika
    mantrabija mantradhishthatridevata || 170|| surupa'nekarupa ca virupa bahurupini | virupakshapriyatama
    virupakshamanorama || 171|| virupaksha kotarakshi kutastha kutarupini | karalasya vishalasya dharmashastrarthaparaga
    || 172|| mulakriya mularupa mulaprakritirupini | kamakshi kamaniya ca kameshi bhagamangala || 173||
    subhaga bhogini bhogya bhagyada subhaga bhaga | shveta'runa bindurupa vedayonirdhvanikshana || 174||
    adhyatmavidya shastrarthakushala shailanandini | nagadhirajaputri ca nagaputri nagodbhava || 175||
    girindrabala girishapranatulya manorama | prasanna caruvadana prasannasya prasannada || 176|| shivaprana
    patiprana patisammohakarini | mrigakshi cancalapangi sudrishtirhamsagamini || 177|| nityam kutuhalapara
    nityananda'bhinandita | satyavijnanarupa ca tattvajnanaikakarini || 178|| trailokyasakshini lokadharmadharmapradarshini
    | dharma'dharmavidhatri ca shambhupranatmika para || 179|| menakagarbhasambhuta mainakabhagini tatha
    | shrikantha kanthahara ca shrikanthahridayasthita || 180|| shrikanthakanthajapya ca nilakanthamanorama
    | kalakutatmika kalakutabhakshanakarini || 181|| varnamala siddhikala shatcakrakramavasini | mulakelirata
    svadhishthana turyanivasini || 182|| manipurasthitih snigdha kurmacakraparayana | anahatagatirdipashikha
    manimayakritih || 183|| vishuddhicakrasamsthana cajnacakrabjamadhyaga | mahakalapriya kalakalanaikavidhayini
    | akshobhyapatni sankshobhanashini te namo namah || 184|| shrimahadeva uvaca
  devanagari: ॐ अनाद्या परमा विद्या प्रधाना प्रकृतिः परा । प्रधानपुरुषाराध्या प्रधानपुरुषेश्वरी ॥ २९॥
    प्राणात्मिका प्राणशक्तिः सर्वप्राणहितैषिणी । उमा चोत्तमकेशिन्युत्तमा चोन्मत्तभैरवी ॥ ३०॥ उर्वशी चोन्नता
    चोग्रा महोग्रा चोन्नतस्तनी । उग्रचण्डोग्रनयना महोग्रा दैत्यनाशिनी ॥ ३१॥ उग्रप्रभावती चोग्रवेगाऽनुग्राऽप्रमर्दिनी
    । उग्रतारोग्रनयना चोर्ध्वस्थाननिवासिनी ॥ ३२॥ उन्मत्तनयनाऽत्युग्रदन्तोत्तुङ्गस्थलालया । उल्लासिन्युल्लासचित्ता
    चोत्फुल्लनयनोज्ज्वला ॥ ३३॥ उत्फुल्लकमलारूढा कमला कामिनी कला । काली करालवदना कामिनी मुखकामिनी ॥ ३४॥
    कोमलाङ्गी कृशाङ्गी च कैटभासुरमर्दिनी । कालिन्दी कमलस्था च कान्ता काननवासिनी ॥ ३५॥ कुलीना निष्कला कृष्णा
    कालरात्रिस्वरूपिणी । कुमारी कामरूपा च कामिनी कृष्णपिङ्गला ॥ ३६॥ कपिला शान्तिदा शुद्धा शङ्करार्धशरीरिणी
    । कौमारी कार्त्तिकी दुर्गा कौशिकी कुण्डलोज्जवला ॥ ३७॥ कुलेश्वरी कुलश्रेष्ठा कुण्डलोज्ज्वलमस्तका ।
    भवानी भाविनी वाणी शिवा च शिवमोहिनी ॥ ३८॥ शिवप्रिया शिवाराध्या शिवप्राणैकवल्लभा । शिवपत्नी शिवस्तुत्या
    शिवानन्दप्रदायिनी ॥ ३९॥ नित्यानन्दमयी नित्या सच्चिदानन्दविग्रहा । त्रैलोक्यजननी शम्भुहृदयस्था सनातनी
    ॥ ४०॥ सदया निर्दया माया शिवा त्रैलोक्यमोहिनी । ब्रह्मादित्रिदशाराध्या सर्वाभीष्टप्रदायिनी ॥ ४१॥ ब्रह्माणी
    ब्रह्म गायत्री सावित्री ब्रह्मसंस्तुता । ब्रह्मोपास्या ब्रह्मशक्तिर्ब्रह्मसृष्टिविधायिनी ॥ ४२॥ कमण्डलुकरा
    सृष्टिकर्त्री ब्रह्मस्वरूपिणी । चतुर्भुजात्मिका यज्ञसूत्ररूपा दृढव्रता ॥ ४३॥ हंसारूढा चतुर्वक्त्रा
    चतुर्वेदाभिसंस्तुता । वैष्णवी पालनकारी महालक्ष्मीर्हरिप्रिया ॥ ४४॥ शङ्खचक्रधरा विष्णुशक्तिर्विष्णुस्वरूपिणी
    । विष्णुप्रिया विष्णुमाया विष्णुप्राणैकवल्लभा ॥ ४५॥ योगनिद्राऽक्षरा विष्णुमोहिनी विष्णुसंस्तुता ।
    विष्णुसम्मोहनकरी त्रैलोक्यपरिपालिनी ॥ ४६॥ शङ्खिनी चक्रिणी पद्मा पद्मिनी मुसलायुधा । पद्मालया पद्महस्ता
    पद्ममालादिभूषिता ॥ ४७॥ गरुडस्था चारुरूपा सम्पद्रूपा सरस्वती । विष्णुपार्श्वस्थिता विष्णुपरमाऽऽह्लाददायिनी
    ॥ ४८॥ सम्पत्तिः सम्पदाधारा सर्वसम्पत्प्रदायिनी । श्रीर्विद्या सुखदा सौख्यदायिनी दुःखनाशिनी ॥ ४९॥ दुःखहन्त्री
    सुखकरी सुखासीना सुखप्रदा । सुखप्रसन्नवदना नारायणमनोरमा ॥ ५०॥ नारायणी जगद्धात्री नारायणविमोहिनी । नारायणशरीरस्था
    वनमालाविभूषिता ॥ ५१॥ दैत्यघ्नी पीतवसना सर्वदैत्यप्रमर्दिनी । वाराही नारसिंही च रामचन्द्रस्वरूपिणी
    ॥ ५२॥ रक्षोघ्नी काननावासा चाहल्याशापमोचिनी । सेतुबन्धकरी सर्वरक्षःकुलविनाशिनी ॥ ५३॥ सीता पतिव्रता
    साध्वी रामप्राणैकवल्लभा । अशोककाननावासा लङ्केश्वरविनाशिनी ॥ ५४॥ नीतिः सुनीतिः सुकृतिः कीर्तिर्मेधा
    वसुन्धरा । दिव्यमाल्यधरा दिव्या दिव्यगन्धानुलेपना ॥ ५५॥ दिव्यवस्त्रपरीधाना दिव्यस्थाननिवासिनी । माहेश्वरी
    प्रेतसंस्था प्रेतभूमिनिवासिनी ॥ ५६॥ निर्जनस्था श्मशानस्था भैरवी भीमलोचना । सुघोरनयना घोरा घोररूपा
    घनप्रभा ॥ ५७॥ घनस्तनी वरा श्यामा प्रेतभूमिकृतालया । खट्वाङ्गधारिणी द्वीपिचर्माम्बरसुशोभना ॥ ५८॥ महाकाली
    चण्डवक्त्रा चण्डमुण्डविनाशिनी । उद्यानकाननावासा पुष्पोद्यानवनप्रिया ॥ ५९॥ बलिप्रिया मांसभक्ष्या रुधिरासवभक्षिणी
    । भीमरावा साट्टहासा रणनृत्यपरायणा ॥ ६०॥ असुरासृक्प्रिया तुष्टा दैत्यदानवमर्दिनी । दैत्यविद्राविणी
    दैत्यमथनी दैत्यसूदनी ॥ ६१॥ देत्यघ्नी दैत्यहन्त्री च महिषासुरमर्दिनी । रक्तबीजनिहन्त्री च शुम्भासुरविनाशिनी
    ॥ ६२॥ निशुम्भहन्त्री धूम्राक्षमर्दिनी दुर्गहारिणी । दुर्गासुरनिहन्त्री च शिवदूती महाबला ॥ ६३॥ महाबलवती
    चित्रवस्त्रा रक्ताम्बराऽमला । विमला ललिता चारुहासा चारुस्त्रिलोचना ॥ ६४॥ अजेया जयदा ज्येष्ठा जयशीलाऽपराजिता
    । विजया जाह्नवी दुष्टजृम्भिणी जयदायिनी ॥ ६५॥ जगद्रक्षाकरी सर्वजगच्चैतन्यकारिणी । जया जयन्ती जननी जनभक्षणतत्परा
    ॥ ६६॥ जलरूपा जलस्था च जप्या जापकवत्सला । जाज्ज्वल्यमाना यज्ञेशा जन्मनाशविवर्जिता ॥ ६७॥ जरातीता जगन्माता
    जगद्रूपा जगन्मयी । जङ्गमा ज्वालिनी जृम्भा स्तम्भिनी दुष्टतापिनी ॥ ६८॥ त्रिपुरघ्नी त्रिनयना महात्रिपुरतापिनी
    । तृष्णा जातिः पिपासा च बुभुक्षा त्रिपुरा प्रभा ॥ ६९॥ त्वरिता त्रिपुटा त्र्यक्षा तन्वी तापविवर्जिता
    । त्रिलोकेशी तीव्रवेगा तीव्रा तिव्रबलालया ॥ ७०॥ निःशङ्का निर्मलाभा च निरातङ्काऽमलप्रभा । विनीता विनयाभिज्ञा
    विशेषज्ञा विलक्षणा ॥ ७१॥ वरदा वल्लभा विद्युत्प्रभा विनयशालिनी । बिम्बोष्ठी विधुवक्त्रा च विवस्त्रा
    विनयप्रभा ॥ ७२॥ विश्वेशपत्नी विश्वात्मा विश्वरूपा बलोत्कटा । विश्वेशी विश्ववनिता विश्वमाता विचक्षणा
    ॥ ७३॥ विदुषी विश्वविदिता विश्वमोहनकारिणी । विश्वमूर्तिर्विश्वधरा विश्वेशपरिपालिनी ॥ ७४॥ विश्वकर्त्री
    विश्वहर्त्री विश्वपालनतत्परा । विश्वेशहृदयावासा विश्वेश्वरमनोरमा ॥ ७५॥ विश्वहा विश्वनिलया विश्वमाया
    विभूतिदा । विश्वा विश्वोपकारा च विश्वप्राणात्मिकापि च ॥ ७६॥ विश्वप्रिया विश्वमयी विश्वदुष्टविनाशिनी
    । दाक्षायणी दक्षकन्या दक्षयज्ञविनाशिनी ॥ ७७॥ विश्वम्भरी वसुमती वसुधा विश्वपावनी । सर्वातिशायिनी सर्वदुःखदारिद्र्यहारिणी
    ॥ ७८॥ महाविभूतिरव्यक्ता शाश्वती सर्वसिद्धिदा । अचिन्त्याऽचिन्त्यरूपा च केवला परमात्मिका ॥ ७९॥ सर्वज्ञा
    सर्वविषया सर्वोपरिपरायणा । सर्वस्यार्तिहरा सर्वमङ्गला मङ्गलप्रदा ॥ ८०॥ मङ्गलार्हा महादेवी सर्वमङ्गलदायिका
    । सर्वान्तरस्था सर्वार्थरूपिणी च निरञ्जना ॥ ८१॥ चिच्छक्तिश्चिन्मयी सर्वविद्या सर्वविधायिनी । शान्तिः
    शान्तिकरी सौम्या सर्वा सर्वप्रदायिनी ॥ ८२॥ शान्तिः क्षमा क्षेमकरी क्षेत्रज्ञा क्षेत्रवासिनी । क्षणात्मिका
    क्षीणतनुः क्षीणाङ्गी क्षीणमध्यमा ॥ ८३॥ क्षिप्रगा क्षेमदा क्षिप्ता क्षणदा क्षणवासिनी । वृत्तिर्निवृत्तिर्भूतानां
    प्रवृत्तिर्वृत्तलोचना ॥ ८४॥ व्योममूर्तिर्व्योमसंस्था व्योमालयकृताश्रया । चन्द्रानना चन्द्रकान्तिश्चन्द्रार्धाङ्कितमस्तका
    ॥ ८५॥ चन्द्रप्रभा चन्द्रकला शरच्चन्द्रनिभानना । चन्द्रात्मिका चन्द्रमुखी चन्द्रशेखरवल्लभा ॥ ८६॥ चन्द्रशेखरवक्षःस्था
    चन्द्रलोकनिवासिनी । चन्द्रशेखरशैलस्था चञ्चला चञ्चलेक्षणा ॥ ८७॥ छिन्नमस्ता छागमांसप्रिया छागबलिप्रिया
    । ज्योत्स्ना ज्योतिर्मयी सर्वज्यायसी जीवनात्मिका ॥ ८८॥ सर्वकार्यनियन्त्री च सर्वभूतहितैषिणी । गुणातीता
    गुणमयी त्रिगुणा गुणशालिनी ॥ ८९॥ गुणैकनिलया गौरी गुह्या गोपकुलोद्भवा । गरीयसी गुरुरता गुह्यस्थाननिवासिनी
    ॥ ९०॥ गुणज्ञा निर्गुणा सर्वगुणार्हा गुह्यकाऽम्बिका । गलज्जटा गलत्केशा गलद्रुधिरचर्चिता ॥ ९१॥ गजेन्द्रगमना
    गन्त्री गीतनृत्यपरायणा । गमनस्था गयाध्यक्षा गणेशजननी तथा ॥ ९२॥ गानप्रिया गानरता गृहस्था गृहिणी परा
    । गजसंस्था गजारूढा ग्रसन्ती गरुडासना ॥ ९३॥ योगस्था योगिनीगम्या योगचिन्तापरायणा । योगिध्येया योगिवन्द्या
    योगलभ्या युगात्मिका ॥ ९४॥ योगिज्ञेया योगयुक्ता महायोगेश्वरेश्वरी । योगानुरक्ता युगदा युगान्तजलदप्रभा
    ॥ ९५॥ युगानुकारिणी यज्ञरूपा सूर्यसमप्रभा । युगान्तानिलवेगा च सर्वयज्ञफलप्रदा ॥ ९६॥ संसारयोनिः संसारव्यापिनी
    सफलास्पदा । संसारतरुनिःसेव्या संसारार्णवतारिणी ॥ ९७॥ सर्वार्थसाधिका सर्वा संसारव्यापिनी तथा । संसारबन्धकर्त्री
    च संसारपरिवर्जिता ॥ ९८॥ दुर्निरीक्ष्या सुदुष्प्राप्या भूतिर्भूतिमतीत्यपि । अत्यन्तविभवाऽरूपा महाविभवरूपिणी
    ॥ ९९॥ शब्दब्रह्मस्वरूपा च शब्दयोनिः परात्परा । भूतिदा भूतिमाता च भूतिस्तन्द्री विभूतिदा ॥ १००॥ भूतान्तरस्था
    कूटस्था भूतनाथप्रियाङ्गना । भूतमाता भूतनाथा भूतालयनिवासिनी ॥ १०१॥ भूतनृत्यप्रिया भूतसङ्गिनी भूतलाश्रया
    । जन्ममृत्युजरातीता महापुरुषसङ्गता ॥ १०२॥ भुजगा तामसी व्यक्ता तमोगुणवती तथा । त्रितत्त्वा तत्त्वरूपा
    च तत्त्वज्ञा तत्त्वकप्रिया ॥ १०३॥ त्र्यम्बका त्र्यम्बकरता शुक्ला त्र्यम्बकरूपिणी । त्रिकालज्ञा जन्महीना
    रक्ताङ्गी ज्ञानरूपिणी ॥ १०४॥ अकार्या कार्यजननी ब्रह्माख्या ब्रह्मसंस्थिता । वैराग्ययुक्ता विज्ञानगम्या
    धर्मस्वरूपिणी ॥ १०५॥ सर्वधर्मविधानज्ञा धर्मिष्ठा धर्मतत्परा । धर्मिष्ठपालनकरी धर्मशास्त्रपरायणा ॥
    १०६॥ धर्माधर्मविहीना च धर्मजन्यफलप्रदा । धर्मिणी धर्मनिरता धर्मिणामिष्टदायिनी ॥ १०७॥ धन्या धीर्धारणा
    धीरा धन्विनी धनदायिनी । धनुष्मती धरासंस्था धरणी स्थितिकारिणी ॥ १०८॥ सर्वयोनिर्विश्वयोनिरपांयोनिरयोनिजा
    । रुद्राणी रुद्रवनिता रुद्रैकादशरूपिणी ॥ १०९॥ रुद्राक्षमालिनी रौद्री भुक्तिमुक्तिफलप्रदा । ब्रह्मोपेन्द्रप्रवन्द्या
    च नित्यं मुदितमानसा ॥ ११०॥ इन्द्राणी वासवी चैन्द्री विचित्रैरावतस्थिता । सहस्रनेत्रा दिव्याङ्गी दिव्यकेशविलासिनी
    ॥ १११॥ दिव्याङ्गना दिव्यनेत्रा दिव्यचन्दनचर्चिता । दिव्यालङ्करणा दिव्यश्वेतचामरवीजिता ॥ ११२॥ दिव्यहारा
    दिव्यपदा दिव्यनूपुरशोभिता । केयूरशोभिता हृष्टा हृष्टचित्तप्रहर्षिणी ॥ ११३॥ सम्प्रहृष्टमना हर्षप्रसन्नवदना
    तथा । देवेन्द्रवन्द्यपादाब्जा देवेन्द्रपरिपूजिता ॥ ११४॥ रजसा रक्तनयना रक्तपुष्पप्रिया सदा । रक्ताङ्गी
    रक्तनेत्रा च रक्तोत्पलविलोचना ॥ ११५॥ रक्ताभा रक्तवस्त्रा च रक्तचन्दनचर्चिता । रक्तेक्षणा रक्तभक्ष्या
    रक्तमत्तोरगाश्रया ॥ ११६॥ रक्तदन्ता रक्तजिह्वा रक्तभक्षणतत्परा । रक्तप्रिया रक्ततुष्टा रक्तपानसुतत्परा
    ॥ ११७॥ बन्धूककुसुमाभा च रक्तमाल्यानुलेपना । स्फुरद्रक्ताञ्चिततनुः स्फुरत्सूर्यशतप्रभा ॥ ११८॥ स्फुरन्नेत्रा
    पिङ्गजटा पिङ्गला पिङ्गलेक्षणा । बगला पीतवस्त्रा च पीतपुष्पप्रिया सदा ॥ ११९॥ पीताम्बरा पिबद्रक्ता पीतपुष्पोपशोभिता
    । शत्रुघ्नी शत्रुसम्मोहजननी शत्रुतापिनी ॥ १२०॥ शत्रुप्रमर्दिनी शत्रुवाक्यस्तम्भनकारिणी । उच्चाटनकरी
    सर्वदुष्टोत्सारणकारिणी ॥ १२१॥ शत्रुविद्राविणी शत्रुसम्मोहनकरी तथा । विपक्षमर्दनकरी शत्रुपक्षक्षयङ्करी
    ॥ १२२॥ सर्वदुष्टघातिनी च सर्वदुष्टविनाशिनी । द्विभुजा शूलहस्ता च त्रिशूलवरधारिणी ॥ १२३॥ दुष्टसन्तापजननी
    दुष्टक्षोभप्रवर्धिनी । दुष्टानां क्षोभसम्बद्धा भक्तक्षोभनिवारिणी ॥ १२४॥ दुष्टसन्तापिनी दुष्टसन्तापपरिमर्दिनी
    । सन्तापरहिता भक्तसन्तापपरिनाशिनी ॥ १२५॥ अद्वैता द्वैतरहिता निष्कला ब्रह्मरूपिणी । त्रिदशेशी त्रिलोकेशी
    सर्वेशी जगदीश्वरी ॥ १२६॥ ब्रह्मेशसेवितपदा सर्ववन्द्यपदाम्बुजा । अचिन्त्यरूपचरिता चाचिन्त्यबलविक्रमा
    ॥ १२७॥ सर्वाचिन्त्यप्रभावा च स्वप्रभावप्रदर्शिनी । अचिन्त्यमहिमाऽचिन्त्यरूपा सौन्दर्यशालिनी ॥ १२८॥
    अचिन्त्यवेशशोभा च लोकाचिन्त्यगुणान्विता । अचिन्त्यशक्तिर्दुश्चिन्त्यप्रभावा चिन्त्यरूपिणी ॥ १२९॥ योगीचिन्त्या
    महाचिन्तानाशिनी चेतनात्मिका । गिरिजा दक्षजा विश्वजनयित्री जगत्प्रसूः ॥ १३०॥ सन्नम्याऽप्रणता सर्वप्रणतार्तिहरी
    तथा । प्रणतैश्वर्यदा सर्वप्रणताशुभनाशिनी ॥ १३१॥ प्रणतापन्नाशकरी प्रणताशुभमोचनी । सिद्धेश्वरी सिद्धसेव्या
    सिद्धचारणसेविता ॥ १३२॥ सिद्धिप्रदा सिद्धिकरी सर्वसिद्धगणेश्वरी । अष्टसिद्धिप्रदा सिद्धगणसेव्यपदाम्बुजा
    ॥ १३३॥ कात्यायनी स्वधा स्वाहा वषड् वौषट्स्वरूपिणी । पितृणां तृप्तिजननी कव्यरूपा सुरेश्वरी ॥ १३४॥ हव्यभोक्त्री
    हव्यतुष्टा पितृरूपाऽसितप्रिया । कृष्पपक्षप्रपूज्या च प्रेतपक्षसमर्चिता ॥ १३५॥ अष्टहस्ता दशभुजा चाष्टादशभुजान्विता
    । चतुर्दशभुजाऽसङ्ख्यभुजवल्लीविराजिता ॥ १३६॥ सिंहपृष्ठसमारूढा सहस्रभूजराजिता । भुवनेशी चान्नपूर्णा
    महात्रिपुरसुन्दरी ॥ १३७॥ त्रिपुरा सुन्दरी सौम्यमुखी सुन्दरलोचना । सुन्दरास्या शुभ्रदंष्ट्रा सुभ्रूः
    पर्वतनन्दिनी ॥ १३८॥ नीलोत्पलदलश्यामा स्मेरोत्फुल्लमुखाम्बुजा । सत्यसन्धा पद्मवक्त्रा भ्रूकुटीकुटिलानना
    ॥ १३९॥ विद्याधरी वरारोहा महासन्ध्यास्वरूपिणी । अरुन्धती हिरण्याक्षी सुधूम्राक्षी शुभेक्षणा ॥ १४०॥
    श्रुतिः स्मृतिः कृतिर्योगमाया पुण्या पुरातनी । वाग्देवता वेदविद्या ब्रह्मविद्यास्वरूपिणी ॥ १४१॥ वेदशक्तिर्वेदमाता
    वेदाद्या परमा गतिः । आन्वीक्षिकी तर्कविद्या योगशास्त्रप्रकाशिनी ॥ १४२॥ धूमावती वियन्मूर्तिर्विद्युन्माला
    विलासिनी । महाव्रता सदानन्दनन्दिनी नगनन्दिनी ॥ १४३॥ सुनन्दा यमुना चण्डी रुद्रचण्डी प्रभावती । पारिजातवनावासा
    पारिजातवनप्रिया ॥ १४४॥ सुपुष्पगन्धसन्तुष्टा दिव्यपुष्पोपशोभिता । पुष्पकाननसद्वासा पुष्पमालाविलासिनी
    ॥ १४५॥ पुष्पमाल्यधरा पुष्पगुच्छालङ्कृतदेहिका । प्रतप्तकाञ्चनाभासा शुद्धकाञ्चनमण्डिता ॥ १४६॥ सुवर्णकुण्डलवती
    स्वर्णपुष्पप्रिया सदा । नर्मदा सिन्धुनिलया समुद्रतनया तथा ॥ १४७॥ षोडशी षोडशभुजा महाभुजङ्गमण्डिता ।
    पातालवासिनी नागी नागेन्द्रकृतभूषणा ॥ १४८॥ नागिनी नागकन्या च नागमाता नगालया । दुर्गाऽऽपत्तारिणी दुर्गदुष्टग्रहनिवारिणी
    ॥ १४९॥ अभयाऽऽपन्निहन्त्री च सर्वापत्परिनाशिनी । ब्रह्मण्या श्रुतिशास्त्रज्ञा जगतां कारणात्मिका ॥ १५०॥
    निष्कारणा जन्महीना मृत्युञ्जयमनोरमा । मृत्युञ्जयहृदावासा मूलाधारनिवासिनी ॥ १५१॥ षट्चक्रसंस्था महती
    महोत्सवविलासिनी । रोहिणी सुन्दरमुखी सर्वविद्याविशारदा ॥ १५२॥ सदसद्वस्तुरूपा च निष्कामा कामपीडिता ।
    कामातुरा काममत्ता काममानससत्तनुः ॥ १५३॥ कामरूपा च कालिन्दी कचालम्बितविग्रहा । अतसीकुसुमाभासा सिंहपृष्ठनिषेदुषी
    ॥ १५४॥ युवती यौवनोद्रिक्ता यौवनोद्रिक्तमानसा । अदितिर्देवजननी त्रिदशार्तिविनाशिनी ॥ १५५॥ दक्षिणाऽपूर्ववसना
    पूर्वकालविवर्जिता । अशोका शोकरहिता सर्वशोकनिवारिणी ॥ १५६॥ अशोककुसुमाभासा शोकदुःखक्षयङ्करी । सर्वयोषित्स्वरूपा
    च सर्वप्राणिमनोरमा ॥ १५७॥ महाश्चर्या मदाश्चर्या महामोहस्वरूपिणी । महामोक्षकरी मोहकारिणी मोहदायिनी
    ॥ १५८॥ अशोच्या पूर्णकामा च पूर्णा पूर्णमनोरथा । पूर्णाभिलषिता पूर्णनिशानाथसमानना ॥ १५९॥ द्वादशार्कस्वरूपा
    च सहस्रार्कसमप्रभा । तेजस्विनी सिद्धमाता चन्द्रा नयनरक्षणा ॥ १६०॥ अपराऽपारमाहात्म्या नित्यविज्ञानशालिनी
    । विवस्वती हव्यवाहा जातवेदःस्वरूपिणी ॥ १६१॥ स्वैरिणी स्वेच्छविहरा निर्बीजा बीजरूपिणी । अनन्तवर्णाऽनन्ताख्याऽनन्तसंस्था
    महोदरी ॥ १६२॥ दुष्टभूतापहन्त्री च सद्धृत्तपरिपालिका । कपालिनी पानमत्ता मत्तवारणगामिनी ॥ १६३॥ विन्ध्यस्था
    विन्ध्यनिलया विन्ध्यपर्वतवासिनी । बन्धुप्रिया जगद्वन्धुः पवित्रा सपवित्रिणी ॥ १६४॥ परामृताऽमृतकला
    चापमृत्युविनाशिनी । महारजतसङ्काशा रजताद्रिनिवासिनी ॥ १६५॥ काशीविलासिनी काशीक्षेत्ररक्षणतत्परा । योनिरूपा
    योनिपीठस्थिता योनिस्वरूपिणी ॥ १६६॥ कामोल्लसितचार्वङ्गी कटाक्षक्षेपमोहिनी । कटाक्षक्षेपनिरता कल्पवृक्षस्वरूपिणी
    ॥ १६७॥ पाशाङ्कुशधरा शक्तिधारिणी खेटकायुधा । बाणायुधाऽमोघशस्त्रा दिव्यशस्त्राऽस्त्रवर्षिणी ॥ १६८॥ महास्त्रजालविक्षेपविपक्षक्षयकारिणी
    । घण्टिनी पाशिनी पाशहस्ता पाशाङ्कुशायुधा ॥ १६९॥ चित्रसिंहासनगता महासिंहासनस्थिता । मन्त्रात्मिका मन्त्रबीजा
    मन्त्राधिष्ठातृदेवता ॥ १७०॥ सुरूपाऽनेकरूपा च विरूपा बहुरूपिणी । विरूपाक्षप्रियतमा विरूपाक्षमनोरमा
    ॥ १७१॥ विरूपाक्षा कोटराक्षी कूटस्था कूटरूपिणी । करालास्या विशालास्या धर्मशास्त्रार्थपारगा ॥ १७२॥ मूलक्रिया
    मूलरूपा मूलप्रकृतिरूपिणी । कामाक्षी कमनीया च कामेशी भगमङ्गला ॥ १७३॥ सूभगा भोगिनी भोग्या भाग्यदा सुभगा
    भगा । श्वेताऽरुणा बिन्दुरूपा वेदयोनिर्ध्वनिक्षणा ॥ १७४॥ अध्यात्मविद्या शास्त्रार्थकुशला शैलनन्दिनी
    । नगाधिराजपुत्री च नगपुत्री नगोद्भवा ॥ १७५॥ गिरीन्द्रबाला गिरिशप्राणतुल्या मनोरमा । प्रसन्ना चारुवदना
    प्रसन्नास्या प्रसन्नदा ॥ १७६॥ शिवप्राणा पतिप्राणा पतिसम्मोहकारिणी । मृगाक्षी चञ्चलापाङ्गी सुदृष्टिर्हंसगामिनी
    ॥ १७७॥ नित्यं कुतूहलपरा नित्यानन्दाऽभिनन्दिता । सत्यविज्ञानरूपा च तत्त्वज्ञानैककारिणी ॥ १७८॥ त्रैलोक्यसाक्षिणी
    लोकधर्माधर्मप्रदर्शिनी । धर्माऽधर्मविधात्री च शम्भुप्राणात्मिका परा ॥ १७९॥ मेनकागर्भसम्भूता मैनाकभगिनी
    तथा । श्रीकण्ठा कण्ठहारा च श्रीकण्ठहृदयस्थिता ॥ १८०॥ श्रीकण्ठकण्ठजप्या च नीलकण्ठमनोरमा । कालकूटात्मिका
    कालकूटभक्षणकारिणी ॥ १८१॥ वर्णमाला सिद्धिकला षट्चक्रक्रमवासिनी । मूलकेलीरता स्वाधिष्ठाना तुर्यनिवासिनी
    ॥ १८२॥ मणिपूरस्थितिः स्निग्धा कूर्मचक्रपरायणा । अनाहतगतिर्दीपशिखा मणिमयाकृतिः ॥ १८३॥ विशुद्धिचक्रसंस्थाना
    चाज्ञाचक्राब्जमध्यगा । महाकालप्रिया कालकलनैकविधायिनी । अक्षोभ्यपत्नी सङ्क्षोभनाशिनी ते नमो नमः ॥ १८४॥
    श्रीमहादेव उवाच
