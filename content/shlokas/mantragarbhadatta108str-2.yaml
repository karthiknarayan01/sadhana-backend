id: mantragarbhadatta108str-2
category: mantra
name:
  english: mantragarbhadatta108str
  devanagari: मन्त्रगर्भदत्त१०८स्त्र्
content:
  english: ttakaraya virupine || 12|| naraya dhipradipaya yashasviyashase namah | harine cojvalangayatrestanujaya
    sambhave || 13|| mocitamarasanghaya dhimatam dhirakaya ca | balishthavipralabhyaya yagahomapriyaya
    ca || 14|| bhajanmahimavik͟hyatre'mararimahimacchide | labhaya mundipujyaya yamine hemamaline || 15||
    gatopadhivyadhaye ca hiranyahitakantaye | yatindracaryam dadhate narabhavaushadhaya ca || 16|| varishthayogipujyaya
    tantusantanvate namah | svatmagathasutirthaya mahshriye shatkaraya ca || 17|| tejomayottamangaya nodananodyakarmane
    | hanyaptimritivijnatra omkaritasubhaktaye || 18|| rukshunmanahkhedahrite darshanavishayatmane | ramkavatatavastraya
    naratattvaprakashine || 19|| dravitapranataghaya
  devanagari: त्ताकाराय विरूपिणे ॥ १२॥ नराय धीप्रदीपाय यशस्वियशसे नमः । हारिणे चोज्वलाङ्गायात्रेस्तनूजाय
    सम्भवे ॥ १३॥ मोचितामरसङ्घाय धीमतां धीरकाय च । बलिष्ठविप्रलभ्याय यागहोमप्रियाय च ॥ १४॥ भजन्महिमविख़्यात्रेऽमरारिमहिमच्छिदे
    । लाभाय मुण्डिपूज्याय यमिने हेममालिने ॥ १५॥ गतोपाधिव्याधये च हिरण्याहितकान्तये । यतीन्द्रचर्यां दधते
    नरभावौषधाय च ॥ १६॥ वरिष्ठयोगिपूज्याय तन्तुसन्तन्वते नमः । स्वात्मगाथासुतीर्थाय मःश्रिये षट्कराय च
    ॥ १७॥ तेजोमयोत्तमाङ्गाय नोदनानोद्यकर्मणे । हान्याप्तिमृतिविज्ञात्र ओंकारितसुभक्तये ॥ १८॥ रुक्षुङ्मनःखेदहृते
    दर्शनाविषयात्मने । रांकवाततवस्त्राय नरतत्त्वप्रकाशिने ॥ १९॥ द्रावितप्रणताघाया
