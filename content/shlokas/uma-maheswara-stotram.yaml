id: uma-maheswara-stotram
category: stotram
name:
  english: Uma Maheswara Stotram
content:
  english: namah shivabhyam navayauvanabhyam parasparashlishtavapurdharabhyam | nagendrakanyavrishaketanabhyam
    namo namah shankaraparvatibhyam || || namah shivabhyam sarasotsavabhyam namaskritabhishtavarapradabhyam
    | narayanenarcitapadukabhyam namo namah shankaraparvatibhyam || || namah shivabhyam vrishavahanabhyam
    virincivishnvindrasupujitabhyam | vibhutipatiravilepanabhyam namo namah shankaraparvatibhyam || ||
    namah shivabhyam jagadishvarabhyam jagatpatibhyam jayavigrahabhyam | jambharimukhyairabhivanditabhyam
    namo namah shankaraparvatibhyam || || namah shivabhyam paramaushadhabhyam pancaksharipanjararanjitabhyam
    | prapancasrishtisthitisamhritabhyam namo namah shankaraparvatibhyam || || namah shivabhyamatisundarabhyam
    atyantamasaktahridambujabhyam | asheshalokaikahitankarabhyam namo namah shankaraparvatibhyam || ||
    namah shivabhyam kalinashanabhyam kankalakalyanavapurdharabhyam | kailasashailasthitadevatabhyam namo
    namah shankaraparvatibhyam || || namah shivabhyamashubhapahabhyam asheshalokaikavisheshitabhyam |
    akunthitabhyam smritisambhritabhyam namo namah shankaraparvatibhyam || || namah shivabhyam rathavahanabhyam
    ravinduvaishvanaralocanabhyam | rakashashankabhamukhambujabhyam namo namah shankaraparvatibhyam ||
    || namah shivabhyam jatilandharabhyam jaramritibhyam ca vivarjitabhyam | janardanabjodbhavapujitabhyam
    namo namah shankaraparvatibhyam || || namah shivabhyam vishamekshanabhyam bilvacchadamallikadamabhridbhyam
    | shobhavatishantavatishvarabhyam namo namah shankaraparvatibhyam || || namah shivabhyam pashupalakabhyam
    jagatrayirakshanabaddhahridbhyam | samastadevasurapujitabhyam namo namah shankaraparvatibhyam || ||
    stotram trisandhyam shivaparvatibhyam bhaktya patheddvadashakam naro yah | sa sarvasaubhagyaphalani
    bhunkte shatayurante shivalokameti ||
  devanagari: नमः शिवाभ्यां नवयौवनाभ्यां परस्पराश्लिष्टवपुर्धराभ्याम् । नगेन्द्रकन्यावृषकेतनाभ्यां नमो
    नमः शङ्करपार्वतीभ्याम् ॥ ॥ नमः शिवाभ्यां सरसोत्सवाभ्यां नमस्कृताभीष्टवरप्रदाभ्याम् । नारायणेनार्चितपादुकाभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ॥ नमः शिवाभ्यां वृषवाहनाभ्यां विरिञ्चिविष्ण्विन्द्रसुपूजिताभ्याम् । विभूतिपाटीरविलेपनाभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ॥ नमः शिवाभ्यां जगदीश्वराभ्यां जगत्पतिभ्यां जयविग्रहाभ्याम् । जम्भारिमुख्यैरभिवन्दिताभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ॥ नमः शिवाभ्यां परमौषधाभ्यां पञ्चाक्षरीपञ्जररञ्जिताभ्याम् । प्रपञ्चसृष्टिस्थितिसंहृताभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ॥ नमः शिवाभ्यामतिसुन्दराभ्यां अत्यन्तमासक्तहृदम्बुजाभ्याम् । अशेषलोकैकहितङ्कराभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ॥ नमः शिवाभ्यां कलिनाशनाभ्यां कङ्कालकल्याणवपुर्धराभ्याम् । कैलासशैलस्थितदेवताभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ॥ नमः शिवाभ्यामशुभापहाभ्यां अशेषलोकैकविशेषिताभ्याम् । अकुण्ठिताभ्यां
    स्मृतिसम्भृताभ्यां नमो नमः शङ्करपार्वतीभ्याम् ॥ ॥ नमः शिवाभ्यां रथवाहनाभ्यां रवीन्दुवैश्वानरलोचनाभ्याम्
    । राकाशशाङ्काभमुखाम्बुजाभ्यां नमो नमः शङ्करपार्वतीभ्याम् ॥ ॥ नमः शिवाभ्यां जटिलन्धराभ्यां जरामृतिभ्यां
    च विवर्जिताभ्याम् । जनार्दनाब्जोद्भवपूजिताभ्यां नमो नमः शङ्करपार्वतीभ्याम् ॥ ॥ नमः शिवाभ्यां विषमेक्षणाभ्यां
    बिल्वच्छदामल्लिकदामभृद्भ्याम् । शोभावतीशान्तवतीश्वराभ्यां नमो नमः शङ्करपार्वतीभ्याम् ॥ ॥ नमः शिवाभ्यां
    पशुपालकाभ्यां जगत्रयीरक्षणबद्धहृद्भ्याम् । समस्तदेवासुरपूजिताभ्यां नमो नमः शङ्करपार्वतीभ्याम् ॥ ॥
    स्तोत्रं त्रिसन्ध्यं शिवपार्वतीभ्यां भक्त्या पठेद्द्वादशकं नरो यः । स सर्वसौभाग्यफलानि भुङ्क्ते शतायुरान्ते
    शिवलोकमेति ॥
