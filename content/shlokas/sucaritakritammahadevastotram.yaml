id: sucaritakritammahadevastotram
category: stotram
name:
  english: sucaritakritammahadevastotram
  devanagari: सुचरितकृतंमहादेवस्तोत्रम्
content:
  english: sucaritakritam mahadevastotram sucarita uvaca | jaya deva maheshana jaya shankara dhurjate
    || 22|| jaya brahmadipujya tvam tripuraghna yamantaka | jayomesha mahadeva kamantaka jayamala || 23||
    jaya samsaravaidya tvam bhutapala shivavyaya | triyambaka namastubhyam bhaktarakshanadikshita || 24||
    vyomakesha namastubhyam jaya karunyavigraha | nilakantha namastubhyam jaya samsaramocaka || 25|| maheshvara
    namastubhyam paramanandavigraha | gangadhara namastubhyam vishveshvara mridavyaya || 26|| namastubhyam
    bhagavate vasudevaya shambhave | sharvayograya garbhaya kailasapataye namah || 27|| raksha mam karunasindho
    kripadrishtyavalokanat | mama vrittamanalocya trahi mam kripaya hara || 28|| iti shriskandapurane
    brahmakhande setukhande ekonatrimsha
  devanagari: सुचरितकृतं महादेवस्तोत्रम् सुचरित उवाच । जय देव महेशान जय शङ्कर धूर्जटे ॥ २२॥ जय ब्रह्मादिपूज्य
    त्वं त्रिपुरघ्न यमान्तक । जयोमेश महादेव कामान्तक जयामल ॥ २३॥ जय संसारवैद्य त्वं भूतपाल शिवाव्यय ।
    त्रियम्बक नमस्तुभ्यं भक्तरक्षणदीक्षित ॥ २४॥ व्योमकेश नमस्तुभ्यं जय कारुण्यविग्रह । नीलकण्ठ नमस्तुभ्यं
    जय संसारमोचक ॥ २५॥ महेश्वर नमस्तुभ्यं परमानन्दविग्रह । गङ्गाधर नमस्तुभ्यं विश्वेश्वर मृडाव्यय ॥ २६॥
    नमस्तुभ्यं भगवते वासुदेवाय शम्भवे । शर्वायोग्राय गर्भाय कैलासपतये नमः ॥ २७॥ रक्ष मां करुणासिन्धो कृपादृष्ट्यवलोकनात्
    । मम वृत्तमनालोच्य त्राहि मां कृपया हर ॥ २८॥ इति श्रीस्कन्दपुराणे ब्रह्मखण्डे सेतुखण्डे एकोनत्रिंशा
meaning: {}
