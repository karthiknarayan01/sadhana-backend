id: kyts-1-6-santva-sinchami-yajusha-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 1.6 Santva Sinchami Yajusha - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mprathamakande shashthah prashnah shri gurubhyo namah
    | harih om || sa ntva sincami yajusha prajamayurdhana nca | brihaspatiprasuto yajamana iha ma rishat
    || ajyamasi satyamasi satyasyaddhyakshamasi havirasi vaishvanaram mutputashushmagm satyauja 'si sahamanamasi
    sahasvarati ssahasva pritanyatah | sahasraviryamasi tanma jinvajyasyajyamasi satyasya satyamasi satyayu
    asi satyashushmamasi rasi satyashushmamasi satyena tva 'bhi gharayami tasya te bhakshiya pancana ya~ntraya
    dhartraya grihnami pancana ya~ntraya dhartraya grihnami pancana ya~ntraya dhartraya grihnami pancana
    ya~ntraya dhartraya grihnami carostva pancabilasya yantraya dhartraya grihnami brahmanastva tejase
    yantraya dhartraya grihnami kshatrasya tvaujase yantraya dhartraya grihnami vishe tva yantraya dhartraya
    grihnami suviryaya tva grihnami suprajastvaya tva grihnami rayasposhaya tva grihnami brahmavarcasaya
    tva grihnami bhurasmakagm havirdevana mashisho yajamanasya devana bhyo grihnami kamaya tva grihnami
    || 'hagm sajateshu bhuyasa ndhirashcetta vasuvidugro 'hagm sajateshu bhuyasa mugrashcetta vasuvidabhi
    bhurasyabhibhurahagm sajateshu bhuyasamabhibhushcetta vasuvi dyunajmi tva brahmana daivyena havyayasmai
    vodhave jatavedah || indhanastva suprajasah suvira jyogjivema balihrito vaya || yanme agne asya yajnasya
    rishya dajyasyota vishno | tena hanmi sapatna ssuvarucchushmo agne yajamanayaidhi nishushmo abhidasate
    | agne deve ddha manviddha mandrajihva martyasya te hotarmurdhanna jigharmi rayasposhaya suprajastvaya
    suviryaya mano mmanasa ma bhutena visha vagasyaindri sapatnakshayani ndriyena visha vasantamrituna
    pritah prinatu grishmamrituna pritah prinatu varsha rituna pritah prinantu sharadamrituna prita prinatu
    hemantashishiravrituna ndevayajyaya cakshushma ndabdhirasyadabdho bhuyasamamu ndevayajyaya vritraha
    bhuyasamindragniyoraha ndriyavyannado bhuyasamindrasya ndevayajyaya jemana ndevayajyaya ''yushman
    agnirma durishta 'ratiyati tametena jeshagm surupavar nduryagm abhyehi mamanuvrata nyu shirshani mridhvamida
    ehyadita ehi sarasvatyehi rantirasi ramatirasi sunaryasi jushte jushti ''shirasya yajnasya bhuyadaredata
    manasa tacchakeyam ya~jno divagm rohatu yajno diva ngacchatu yo devayanah panthastena yajno devagm
    apye tvasmasvindra indriya ndadhatvasmanraya uta yajna ssacantamasmasu santvashisha ssa nah priya
    supratu rtirmaghoni jushtirasi jushasva no jushta no ndadhatu | brihaspati stanutamimanno vishve deva
    iha madayantam || braddhna pinvasva dadato me ma kshayi kurvato me mopa dasa npranapanau me pahi samanavyanau
    me pahyudanavyanau me pahyakshito 'syakshityai tva ma me ksheshtha amutramushmin ~loke || ndevayajyaya
    pashuma manujjeshagm somasyaha mmahendrasyahamujjiti va~jasya ma prasaveno dgrabhenodagrabhit | atha
    sapatnagm indro me nigrabhenadharagm akah || udgrabha nca brahma deva avivridhann | atha sapatnanindragni
    me vishucinan vyasyatam || ema agmannashisho dohakama indravanto vanamahe dhukshimahi vanamahe dhukshimahi
    prajamisha ntvendro devata ngamayatvetashena tva suryo devata ngamayatu vi te muncami rashana vi rashmin
    vi yoktra yani paricartanani dhattadasmasu dravinam ndevatasu || vishno ndevayajyaya yajnena pratishtha
    ngameyagm somasyaha sureta reto dhishiya tvashturaha ndevayajyaya pashunagm rupa ndevayajyaya mithunena
    prabhuyasam 'si vittirasi videya karma 'si karunamasi kriyasagm sanirasi sanita nkulayinagm rayasposhagm
    sahasrinam ve~do dadatu vajina catushcatvarigmshacca ndhruva ghritena yajnam mprati devayadbhyah |
    suryaya udho 'ditya upastha urudhara prithivi yajne asminn || prajapate rvibhannama lokastasmiggstva
    dadhami saha yajamanena sadasi sanme bhuya mme bhuyah purnamasi purna mme bhuya akshitamasi ma me
    ndishi deva ritvijo marjayanta ndishi grihah pashavo marjayantamudi ndishyapa oshadhayo vanaspatayo
    marjayantamurdhvaya 'syabhimatiha gayatrena chandasa prithivimanu vi krame nirbhakta ndvishmo vishnoh
    kramo 'syabhishastiha traishtubhena chandasa 'ntarikshamanu vi krame nirbhakta ndvishmo vishnoh kramo
    'syaratiyato hanta jagatena chandasa divamanu vi krame nirbhakta ndvishmo vishnoh kramo 'si shatruyato
    hanta ''nushtubhena chandasa disho 'nu vi krame nirbhakta mantarikshamanu vi krame nirbhakta rekannatrigmshacca
    ssuvaraganma sandrishaste ma chithsi yatte tapastasmai te ma '' vrikshi subhurasi shreshtho rashminamayurdha
    asyayurme dhehi varcodha asi varco mayi dhehidamahamamu mbhratrivyamabhyo digbhyo 'smadantarikshadasyai
    prithivya asmadannadyannirbhajami nirbhakta praja samahagm rayasposhena sa ssamiddho agne me didihi
    sameddha te agne didyasam nbhuyasamagna ayugmshi pavasa a suvorjamisha nca nah | are badhasva ducchuna
    m || agne pavasva svapa asme varcah suvirya mmayi | agne grihapate sugrihapatiraha ntvaya grihapatina
    bhuyasagm sugrihapatirmaya tva shshatagm himastamashishama shase tantave jyotishmati ntamashishama
    shase 'mushmai jyotishmati nkastva yunakti sa tva vimuncatvagne vratapate vratamacarisha 'radhi yajno
    babhuva sa a babhuva sa prajajne sa vavridhe | sa devanamadhipati rbabhuva so asmagm adhipatin karotu
    vayagg syama patayo rayinam || gomagm agne 'vimagm ashvi yajno nrivathsakha sadamidapramrishyah |idavagm
    esho asura prajava ndirgho rayih prithubuddhna yatha vai samritasoma evam va~ ete samritayajna yaddar
    shapurnamasau kasya va 'ha deva yajnamagacchanti kasya va na bahunam yo~ vai devatah purvah parigrihnati
    sa ena shshvo bhute yajata etadvai devana manvaharyapacanah pitrinamagni ngrihnati sva evayatane devatah
    pari shshvo bhute yajate vratena vai meddhyo rbrahmano vratabhri ncarishyamityagni vra~tapatistasma
    eva pratiprocya vratama labhate barhisha purnamase vratamupaiti vathsairamavasyayametaddhyetayo rayatanamupastiryah
    purvashcagniraparashcetyahu micchanti kimu deva yesha sminchvo yakshyamane devata vasanti ya evam
    mupastrinati yajamanena gramyashca pashavo 'varuddhya aranyashcetyahu dgramyanupavasati tena gramyanava
    rundhe yadaranyasya 'shnati tenaranyan tpitridevatyah syadaranyasya 'sya pashunabhi manyeta 'shnati
    tannevashita nna kshodhuko bhavati nasya rudrah pashunabhi manyate vajro vai yajnah tkhalu vai manushyasya
    bhratrivyo yadana 'shvanupavasati vajrenaiva saksha mbhratrivyagm hanti || yo vai shraddhamanarabhya
    yajnena yajate nasyeshtaya shraddadhate 'pah pra nayati shraddha va apah shraddhameva ''rabhya yajnena
    yajata ubhaye 'sya devamanushya ishtaya shraddadhate tadahurati va eta vartra mmano vavaita nati nedantiti
    manasa pra nayatiyam 'nayaivainah pra nayatya ve~da yajnayudhani sa mbharati yajno vai yajnayudhani
    yajnameva tathsa mbharati yadekamekagm sambhare pitridevatyani syurya thsaha sarvani manushani dvedve
    sambharati yajyanuvakyayoreva rupa nkarotyatho mithunamevayo vai dasha yajnayudhani veda mukhato 'sya
    yajnah kalpate sphya shca kapalani cagnihotrahavani ca shurpa nca shamya colukhala nca drishaccopala
    caitani vai dasha yajnayudhani ya evam 'sya yajnah kalpate yo vai devebhyah pratiprocya yajnena yajate
    jushante 'sya deva havyagm havi rnirupyamanamabhi mantrayeta 'gnigm hotaramiha tagm huva iti devebhya
    eva pratiprocya yajnena yajate jushante 'sya deva havyamesha vai yajnasya graho grihitvaiva yajnena
    yajate taduditva vacam ya~cchati yajnasya dhritya atho manasa vai prajapati ryajnamatanuta manasaiva
    ta mananvavacaraya yo vai yajnam yo~ga agate yunakti yunkte yunjaneshu kastva yunakti sa tva yunaktvi
    rvai kah prajapatinaivainam yu~nakti yunkte yunjaneshu || nca tanudamimita yavadagnihotra ttavanagnishtomo
    yavati paurnamasi tavanukthyo yavatyamavasya tavanatiratro ya evam vi~dvanagnihotra njuhoti yavadagnishtomeno
    papnoti tavadupa ya~jate yavadukthyenopapnoti yavadukthyenopapnoti vi~dvanamavasyam ya~jate yavadatiratrenopapnoti
    tavadupa ''pnoti parameshthino va esha yajno ttena prajapatih parama 'gnishomau niravasayaya ttenagnishomau
    parama shapurnamasau yajate paramameva kashtha ngacchati yo vai prajatena yajnena yajate pra prajaya
    pashubhi rjayate dvadasha masa va~thsaro dvadasha dvandvani dar shapurnamasayostani sampadyanityahu
    ncadhi shrayatyava ca hanti drishadau ca samahantyadhi ca vapate kapalani copa dadhati purodasha nca
    stambayajushca haratyabhi ca grihnati vedi nca pari grihnati patni nca sannahyati prokshanishca ''sadayatyajya
    ncaitani vai dvadasha dvandvani dar shapurnamasayostani ya evagm sampadya yajate prajatenaiva yajnena
    yajate pra prajaya pashubhi ukthyenopapnotya 'hagm sajateshu bhuyasamityaha dhruvanevaina 'hagm sajateshu
    bhuyasa mityahaprativadina evaina 'bhibhurasyabhibhurahagm sajateshu bhuyasamityaha ya evaina mpratyutpipite
    tamupa syate yunajmi tva brahmana daivyenetyahaisha vaagneryogastenai vaagneryogastena yu~nakti yajnasya
    vai samriddhena deva yajnasya vyriddhenasura yanme agne asya yajnasya rishyadityaha yajnasyaiva tathsamriddhena
    yajamana lo~kameti yajnasya vyriddhena bhratrivya npara bhavayatyagnihotra rvyahritibhirupa sadayedyajnamukham
    mbrahmaita vyahritayo yajnamukha eva brahma va~thsare paryagata etabhirevopa sadaye dbrahmanaivobhayatah
    sam shapurnamasau caturmasyanyalabhamana etabhi shapurnamasau caturmasyani brahmaita vyahritayo yajnamukha
    eva brahma kurute sam va~thsare paryagata etabhirevasadaye dbrahmanaivobhayatah sam mparigrihnati
    yadvai yajnasya samna shirgacchati yadrica visham shirgacchatyatha brahmano 'nashirkena yajnena yajate
    samidheni ranuvakshyanneta vyahritih purasta dbrahmaiva pratipada rkena yajnena yajate ya mbhratrivyamasya
    yajnasyashirgacchediti tasyaita vyahritih puronuvakyaya dbhratrivyadevatya vai puronuvakya bhratrivyamevasya
    yajnasya ''shirgacchati yan kamayeta yajamanan thsamavatyenan yajnasya ''shirgacchediti teshameta
    vyahritih puronuvakyaya ardharca eka dyajyayai purastadekam ya~jyaya ardharca eka thsamavati yajnasya
    ''shirgacchati yatha vai parjanya ya~jno yajamanaya var mparigrihnantyashisha yajnam ya~jamanah pari
    grihnati mano ''vishetyaha mano vai prajapatya mprajapatyo yajno mana eva yajnamatma ndhatte vagasyaindri
    sapatnakshayani vaca me ''vishetyahaindri vai vagvaca ve~da prati yajnena tishthati na yajna dbhragmshata
    a shravayeti caturaksharamastu shraushaditi caturaksharam ya~jeti dvyaksharam ye~ yajamaha iti panca
    ndvyaksharo vashatkara esha vai saptadashah prajapati ryajnamanvayatto ya evam ve~da prati yajnena
    tishthati na yajnad bhragmshate yo vai yajnasya prayana ve~da pratishthitenarishtena yajnena saggstha
    ngacchatyashravayastu shraushadyaja ye yajamahe vashatkara etadvai yajnasya prayanamesha pratishthaitadudayanam
    ve~da pratishthitena 'rishtena yajnena saggstha ngacchati yo vai sunritayai doham ya~jno vai sunrita
    '' shravayetyaivaina gyajetyudanaishidye yajamaha ityupa dvashatkarena dogddhyesha vai sunritayai
    doho ya evam ndeva vai satramasata tesha 'dasyanta etamardra mpanktimapashyanna shravayeti purovata
    majanayannastu shraushadityabhragm samaplavayan majanayan ye yajamaha iti pravar shayannabhyastanayan
    vashatkarena tato vai tebhyo dishah prapyayanta ya evam ve~da prasmai dishah pyayante prajapati ntvoveda
    prajapati stvam rveda sa punyo bhavatyesha vai chandasyah prajapatira shravaya 'stu shraushadyaja
    ye yajamahe vashatkaro ya evam ve~da punyo bhavati vasanta mprinamityahartavo vai prayaja rituneva
    prinati te 'smai prita yathapurva nkalpante kalpante ndevayajyaya cakshushma vai~ yajnashcakshushma
    ntabhyameva cakshuratma 'nnado bhuyasamityahagnirvai devana ndhatte dabdhirasyadabdho bhuyasamamu
    ndabheyamityahaitaya vai dabddhya deva asuranadabhnuvantayaiva bhratrivya ndabhnotyagnishomayoraha
    ndevayajyaya vritraha bhuyasamityaha va~ indro vritramahantabhyameva bhratrivyagg strinuta indragniyoraha
    ndriyavyannado bhuyasamityahendriyavyevannado bhavatindrasya ndriyavi bhuyasamityahendriyavyeva bhavati
    mahendrasya ndevayajyaya jemana ngameyamityaha jemanameva mahimana ndevayajyaya ''yushman ndhatte
    prati yajnena vo~ vishvataspari havamahe jane bhyah | asmakamastu kevalah || indra nnaro nemadhita
    havante yatparya yunajate dhiyastah | shuro nrishata shavasashcakana a gomati vraje bhaja tvannah
    || indriyani shatakrato ya te janeshu pancasu || indra tani ta a vrine || anu te dayi maha indriyaya
    satra te vishvamanu vritrahatye kshatramanu saho yajatrendra devebhiranu te nrishahye thsaptavasava
    stishthanti svaruho yatha | rishir ha dirghashruttama indrasya gharmo atithih || amasu pakvamairaya
    a suryagm rohayo divi | gharma ngirvanase girah || indrami dgathino brihadindra rarkinah | indram
    va~niranushata || gayanti tva gayatrino markinah | brahmanastva shatakratavu miva yemire || agmhomuce
    pra bharema manishamoshishthadavamne sumati ngrinanah | idamindra prati havya ssantu yajamanasya kamah
    || vivesha yanma dhishana jajana stavai pura paryadindra mahnah | agmhaso yatra piparadyatha no naveva
    yanta mubhaye havante || pra samraja ya~jniyanam | apa nnapatamashvina hayanta masminnara indriya
    ndhattamojah || vi na indra mridho jahi nica yaccha pritanyatah | adhaspada nkridhi yo asmagm abhidasati
    || indra kshatramabhi vamamojo 'jayatha vrishabha car shaninam | apanudo jana ru lokam || mrigo na
    bhimah kucaro girishthah paravata a jagama parasyah | a jagama parasyah | srikagm sagmshaya pavimindra
    tigmam ntadhi vimridho nudasva || vi shatrun vi mridho nuda vivritrasya hanu ruja | vi manyumindra
    bhamito 'bhidasatah || tratara mindragm havehave suhavagm shuramindra mpuruhutamindragg svasti no
    maghava dhatvindrah || ma te asyagm nparishtavaghaya bhuma harivah paradai | trayasva no 'vrikebhi
    stava priyasah surishu syama || anavaste rathamashvaya taksha m | brahmana indra mmahayanto arkairavardhayannahaye
    hantava u || vrishne ya tte vrishano arkamarcanindra gravano aditi | anashvaso ye pavayo 'ratha indreshita
    abhyavarta nta dasyun || mashtacatvarigmshacca || harih om || || krishna yajurvediya taittiriya samhitaya
    mprathamakande shashthah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्प्रथमकाण्डे षष्ठः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ स न्त्वा॑ सिञ्चामि॒ यजु॑षा प्र॒जामायु॒र्धन॑ ञ्च । बृह॒स्पति॑प्रसूतो॒ यज॑मान इ॒ह मा रि॑षत् ॥
    आज्य॑मसि स॒त्यम॑सि स॒त्यस्याद्ध्य॑क्षमसि ह॒विर॑सि वैश्वान॒रं मुत्पू॑तशुष्मग्ं स॒त्यौजा॒ ऽसि॒ सह॑मानमसि॒
    सह॒स्वारा॑ती॒ स्सह॑स्व पृतन्य॒तः । स॒हस्र॑वीर्यमसि॒ तन्मा॑ जि॒न्वाज्य॒स्याज्य॑मसि स॒त्यस्य॑ स॒त्यम॑सि
    स॒त्यायु॑ अ॒सि॒ स॒त्यशु॑ष्ममसि रसि स॒त्यशु॑ष्ममसि स॒त्येन॑ त्वा॒ ऽभि घा॑रयामि॒ तस्य॑ ते भक्षीय पञ्चा॒ना
    यँ॒न्त्राय॑ ध॒र्त्राय॑ गृह्णामि पञ्चा॒ना यँ॒न्त्राय॑ ध॒र्त्राय॑ गृह्णामि पञ्चा॒ना यँ॒न्त्राय॑ ध॒र्त्राय॑
    गृह्णामि पञ्चा॒ना यँ॒न्त्राय॑ ध॒र्त्राय॑ गृह्णामि च॒रोस्त्वा॒ पञ्च॑बिलस्य य॒न्त्राय॑ ध॒र्त्राय॑ गृह्णामि॒
    ब्रह्म॑णस्त्वा॒ तेज॑से य॒न्त्राय॑ ध॒र्त्राय॑ गृह्णामि क्ष॒त्रस्य॒ त्वौज॑से य॒न्त्राय॑ ध॒र्त्राय॑ गृह्णामि
    वि॒शे त्वा॑ य॒न्त्राय॑ ध॒र्त्राय॑ गृह्णामि सु॒वीर्या॑य त्वा गृह्णामि सुप्रजा॒स्त्वाय॑ त्वा गृह्णामि
    रा॒यस्पोषा॑य त्वा गृह्णामि ब्रह्मवर्च॒साय॑ त्वा गृह्णामि॒ भूर॒स्माकग्ं॑ ह॒विर्दे॒वाना॑ मा॒शिषो॒ यज॑मानस्य
    दे॒वाना भ्यो गृह्णामि॒ कामा॑य त्वा गृह्णामि ॥ ऽहग्ं स॑जा॒तेषु॑ भूयास॒ न्धीर॒श्चेत्ता॑ वसु॒विदु॒ग्रो
    ऽहग्ं स॑जा॒तेषु॑ भूयास मु॒ग्रश्चेत्ता॑ वसु॒विद॑भि॒ भूर॑स्यभि॒भूर॒हग्ं स॑जा॒तेषु॑ भूयासमभि॒भूश्चेत्ता॑
    वसु॒वि द्यु॒नज्मि॑ त्वा॒ ब्रह्म॑णा॒ दैव्ये॑न ह॒व्याया॒स्मै वोढ॒वे जा॑तवेदः ॥ इन्धा॑नास्त्वा सुप्र॒जसः॑
    सु॒वीरा॒ ज्योग्जी॑वेम बलि॒हृतो॑ व॒य ॥ यन्मे॑ अग्ने अ॒स्य य॒ज्ञस्य॒ रिष्या॒ दाज्य॑स्यो॒त वि॑ष्णो ।
    तेन॑ हन्मि स॒पत्न॑ स्सुव॒रुच्छु॑ष्मो अग्ने॒ यज॑मानायैधि॒ निशु॑ष्मो अभि॒दास॑ते । अग्ने॒ देवे द्ध॒ मन्वि॑द्ध॒
    मन्द्र॑जि॒ह्वा म॑र्त्यस्य ते होतर्मू॒र्धन्ना जि॑घर्मि रा॒यस्पोषा॑य सुप्रजा॒स्त्वाय॑ सु॒वीर्या॑य॒ मनो॑
