id: yogaminakshi
category: stotram
name:
  english: yogaminakshi
  devanagari: योगमीनाक्षी
content:
  english: shriyogaminakshistotram shivanandapiyusharatnakarastham shivabrahmavishnvamareshabhivandyam
    | shivadhyanalagnam shivajnanamurtim shivakhyamatitam bhaje pandyabalam || 1|| shivadisphuratpancamancadhirudham
    dhanurbanapashankushotbhasihastam | navinarkavarnam navinenducudam parabrahmapatnim bhaje pandyabalam
    || 2|| kiritangadodbhasimangalyasutram sphuranmekhalaharatatangabhusham | paramantrakam pandyasimhasanastham
    parandhamarupam bhaje pandyabalam || 3|| lalamancitasnigdhaphalendubhagam lasannirajotphullakalharasamstham
    | lalatekshanardhangalagnojjvalangim parandhamarupam bhaje pandyabalam || 4|| trikhandatmavidyam tribindusvarupam
    trikone lasantim trilokavanamram | tribijadhirudham trimurtyatmavidyam parabrahmapatnim bhaje pandyabalam
    || 5|| sada bindumadhyollasadveniramyam samuttungavakshojabharavanamram | kvanannupuropetalaksharasardraspuratpadapadmam
    bhaje pandyabalam || 6|| yamadyashtayogangarupamarupamakaratkshakarantavarnamavarnam | akhandamananyamacintyamalakshyamameyatmavidyam
    bhaje pandyabalam || 7|| sudhasagarante manidvipamadhye lasatkalpavrikshojjvaladbinducakre | mahayogapithe
    shivakaramance sada sannishannam bhaje pandyabalam || 8|| sushumnantarandhre sahasrarapadme ravindvagnisamyuktaciccakramadhye
    | sudhamandalasthe sunirvanapithe sada sancarantim bhaje pandyabalam || 9|| shadante navante lasaddvadashante
    mahabindumadhye sunadantaraḻe | shivakhye kalatitanishshabdadeshe sada sancarantim bhaje pandyabalam
    || 10|| caturmargamadhye sukonantarange kharandhre sudhakarakupantaraḻe | niralambapadme kalashodashante
    sada sancarantim bhaje pandyabalam || 11|| putadvandvanirmuktavayupralinaprakashantarale dhruvopetaramye
    | mahashodashante manonashadeshe sada sancarantim bhaje pandyabalam || 12|| catushpatramadhye sukonatrayante
    trimurtyadhivase trimargantaraḻe | sahasrarapadmocitam citprakashapravahapralinam bhaje pandyabalam
    || 13|| lasaddvadashantendupiyushadharavritam murtimanandamagnantarangam | param tristanim tam catushkutamadhye
    parandhamarupam bhaje pandyabalam || 14|| sahasrarapadme sushumnantamarge sphuraccandrapiyushadharam
    pibantim | sada sravayantim sudhamurtimambam paranjyotirupam bhaje pandyabalam || 15|| namaste sada
    pandyarajendrakanye namaste sada sundareshankavase | namaste namaste suminakshi devi namaste namaste
    punaste namo'stu || 16|| iti shriyogaminakshistotram sampurnam |
  devanagari: श्रीयोगमीनाक्षीस्तोत्रम् शिवानन्दपीयूषरत्नाकरस्थां शिवब्रह्मविष्ण्वामरेशाभिवन्द्याम् । शिवध्यानलग्नां
    शिवज्ञानमूर्तिं शिवाख्यामतीतां भजे पाण्ड्यबालाम् ॥ १॥ शिवादिस्फुरत्पञ्चमञ्चाधिरूढां धनुर्बाणपाशाङ्कुशोत्भासिहस्ताम्
    । नवीनार्कवर्णां नवीनेन्दुचूडां परब्रह्मपत्नीं भजे पाण्ड्यबालाम् ॥ २॥ किरीटाङ्गदोद्भासिमाङ्गल्यसूत्रां
    स्फुरन्मेखलाहारताटङ्गभूषाम् । परामन्त्रकां पाण्ड्यसिंहासनस्थां परन्धामरूपां भजे पाण्ड्यबालाम् ॥ ३॥
    ललामाञ्चितस्निग्धफालेन्दुभागां लसन्नीरजोत्फुल्लकल्हारसंस्थाम् । ललाटेक्षणार्धाङ्गलग्नोज्ज्वलाङ्गीं
    परन्धामरूपां भजे पाण्ड्यबालाम् ॥ ४॥ त्रिखण्डात्मविद्यां त्रिबिन्दुस्वरूपां त्रिकोणे लसन्तीं त्रिलोकावनम्राम्
    । त्रिबीजाधिरूढां त्रिमूर्त्यात्मविद्यां परब्रह्मपत्नीं भजे पाण्ड्यबालाम् ॥ ५॥ सदा बिन्दुमध्योल्लसद्वेणिरम्यां
    समुत्तुङ्गवक्षोजभारावनम्राम् । क्वणन्नूपुरोपेतलाक्षारसार्द्रस्पुरत्पादपद्मां भजे पाण्ड्यबालाम् ॥ ६॥
    यमाद्यष्टयोगाङ्गरूपामरूपामकारात्क्षकारान्तवर्णामवर्णाम् । अखण्डामनन्यामचिन्त्यामलक्ष्याममेयात्मविद्यां
    भजे पाण्ड्यबालाम् ॥ ७॥ सुधासागरान्ते मणिद्वीपमध्ये लसत्कल्पवृक्षोज्ज्वलद्बिन्दुचक्रे । महायोगपीठे
    शिवाकारमञ्चे सदा सन्निषण्णां भजे पाण्ड्यबालाम् ॥ ८॥ सुषुम्नान्तरन्ध्रे सहस्रारपद्मे रवीन्द्वग्निसम्युक्तचिच्चक्रमध्ये
    । सुधामण्डलस्थे सुनिर्वाणापीठे सदा सञ्चरन्तीं भजे पाण्ड्यबालाम् ॥ ९॥ षडन्ते नवान्ते लसद्द्वादशान्ते
    महाबिन्दुमध्ये सुनादान्तराळे । शिवाख्ये कलातीतनिश्शब्ददेशे सदा सञ्चरन्तीं भजे पाण्ड्यबालाम् ॥ १०॥
    चतुर्मार्गमध्ये सुकोणान्तरङ्गे खरन्ध्रे सुधाकारकूपान्तराळे । निरालम्बपद्मे कलाषोडशान्ते सदा सञ्चरन्तीं
    भजे पाण्ड्यबालाम् ॥ ११॥ पुटद्वन्द्वनिर्मुक्तवायुप्रलीनप्रकाशान्तराले ध्रुवोपेतरम्ये । महाषोडशान्ते
    मनोनाशदेशे सदा सञ्चरन्तीं भजे पाण्ड्यबालाम् ॥ १२॥ चतुष्पत्रमध्ये सुकोणत्रयान्ते त्रिमूर्त्याधिवासे
    त्रिमार्गान्तराळे । सहस्रारपद्मोचितां चित्प्रकाशप्रवाहप्रलीनां भजे पाण्ड्यबालाम् ॥ १३॥ लसद्द्वादशान्तेन्दुपीयूषधारावृतां
    मूर्तिमानन्दमग्नान्तरङ्गाम् । परां त्रिस्तनीं तां चतुष्कूटमध्ये परन्धामरूपां भजे पाण्ड्यबालाम् ॥ १४॥
    सहस्रारपद्मे सुषुम्नान्तमार्गे स्फुरच्चन्द्रपीयूषधारां पिबन्तीम् । सदा स्रावयन्तीं सुधामूर्तिमम्बां
    परञ्ज्योतिरूपां भजे पाण्ड्यबालाम् ॥ १५॥ नमस्ते सदा पाण्ड्यराजेन्द्रकन्ये नमस्ते सदा सुन्दरेशाङ्कवासे
    । नमस्ते नमस्ते सुमीनाक्षि देवि नमस्ते नमस्ते पुनस्ते नमोऽस्तु ॥ १६॥ इति श्रीयोगमीनाक्षीस्तोत्रं सम्पूर्णम्
    ।
