id: atmapujopanishat-samanya
category: upanishad
name:
  english: atmapujopanishat (samanya)
  devanagari: आत्मपूजोपनिषत् (सामान्य)
content:
  english: cidadityasvarupam dipah paripurnacandramritarasaikikaranam naivedyam | nishcalatvam pradakshinam
    | so'hambhavo namaskarah | parameshvarastutirmaunam | sadasantosho visarjanam | evam paripurnarajayoginah
    sarvatmakapujopacarah syat | sarvatmakatvam atmadharo bhavati | sarvaniramayaparipurno'hamasmiti mumukshunam
    mokshaikasiddhirbhavati || ityupanishat || || iti atmapujopanishat samapta||
  devanagari: चिदादित्यस्वरूपं दीपः परिपूर्णचन्द्रामृतरसैकीकरणं नैवेद्यम् । निश्चलत्वं प्रदक्षिणम् । सोऽहंभावो
    नमस्कारः । परमेश्वरस्तुतिर्मौनम् । सदासन्तोषो विसर्जनम् । एवं परिपूर्णराजयोगिनः सर्वात्मकपूजोपचारः
    स्यात् । सर्वात्मकत्वं आत्माधारो भवति । सर्वनिरामयपरिपूर्णोऽहमस्मीति मुमुक्षूणां मोक्षैकसिद्धिर्भवति
    ॥ इत्युपनिषत् ॥ ॥ इति आत्मपूजोपनिषत् समाप्ता॥
meaning: {}
