id: devaihkritam07vishnustotram
category: stotram
name:
  english: devaihkritam07vishnustotram
  devanagari: देवैःकृतं०७विष्णुस्तोत्रम्
content:
  english: 40|| nandishvaro'si pashushu vrishabhah parameshvara | vedeshupanishadrupi yajvanam shitabhanuman
    || 41|| pratapinam pavakastvam shaivanamacyuto bhavan | bharatam tvam purananam makaro'syakshareshu
    ca || 42|| pranavo bijamantranam darunanam visham bhavan | vyomavyaptimatam tvam vai paramatmasi catmanam
    || 43|| indriyanam manashca tvam dananamabhayam bhavan | pavananam jalam casi jivananam tathamritam
    || 44|| labhanam putralabho'si vayurvegavatamasi | nityakarmasu sarveshu sandhyopastirbhavanmata ||
    45|| kratunamashvamedho'si yuganam prathamo yugah | pushyastvam sarvadhishnyanamamavasya tithishvasi
    || 46|| sarvartushu vasantastvam sarvaparvasu sankramah | kusho'si trinajatinam sthulavriksheshu vai
    vatah || 47|| yogeshu ca vyatipatassomavalli latasu ca | buddhinam dharmabuddhistvam kalatram suhridam
    bhavan || 48|| sadhakanam shucinam tvam pranayamo maheshvara | jyotirlingeshu sarveshu bhavan vishveshvaro
    matah || 49|| dharmastvam sarvabandhunamashramanam paro bhavan | mokshastvam sarvavarneshu rudranam
    nilalohitah || 5
  devanagari: ४०॥ नन्दीश्वरोऽसि पशुषु वृषभः परमेश्वर । वेदेषूपनिषद्रूपी यज्वनां शीतभानुमान् ॥ ४१॥ प्रतापिनां
    पावकस्त्वं शैवानामच्युतो भवान् । भारतं त्वं पुराणानां मकारोऽस्यक्षरेषु च ॥ ४२॥ प्रणवो बीजमन्त्राणां
    दारुणानां विषं भवान् । व्योमव्यप्तिमतां त्वं वै परमात्मासि चात्मनाम् ॥ ४३॥ इन्द्रियाणां मनश्च त्वं
    दानानामभयं भवान् । पावनानां जलं चासि जीवनानां तथामृतम् ॥ ४४॥ लाभानां पुत्रलाभोऽसि वायुर्वेगवतामसि
    । नित्यकर्मसु सर्वेषु सन्ध्योपास्तिर्भवान्मता ॥ ४५॥ क्रतूनामश्वमेधोऽसि युगानां प्रथमो युगः । पुष्यस्त्वं
    सर्वधिष्ण्यानाममावास्या तिथिष्वसि ॥ ४६॥ सर्वर्तुषु वसन्तस्त्वं सर्वपर्वसु सङ्क्रमः । कुशोऽसि तृणजातीनां
    स्थूलवृक्षेषु वै वटः ॥ ४७॥ योगेषु च व्यतीपातस्सोमवल्ली लतासु च । बुद्धीनां धर्मबुद्धिस्त्वं कलत्रं
    सुहृदां भवान् ॥ ४८॥ साधकानां शुचीनां त्वं प्राणायामो महेश्वर । ज्योतिर्लिङ्गेषु सर्वेषु भवान् विश्वेश्वरो
    मतः ॥ ४९॥ धर्मस्त्वं सर्वबन्धूनामाश्रमाणां परो भवान् । मोक्षस्त्वं सर्ववर्णेषु रुद्राणां नीललोहितः
    ॥ ५
