id: atmadeharakshanaprayogah
category: raksha
name:
  english: atmadeharakshanaprayogah
  devanagari: आत्मदेहरक्षणप्रयोगः
content:
  english: atmadeharakshanaprayogah shriganeshaya namah | atha atmadeharakshanartha prayogah | om namo
    bhagavate mahanrisimhaya simhaya simhamukhaya vikataya vajradantanakhaya mam raksha raksha mamashariram
    nakhashikhaparyantam raksha raksham kuru kuru madiyam shariram vajrangam | kuru kuru parayantraparamantraparatantranam
    kshinu kshinu khadgadidhanurbanagnibanabhushundi adi shastranam indravajradi brahmastranam stambhaya
    stambhaya | jalagnimadhye raksha grihamadhye gramamadhye nagaramadhye vanamadhye ranamadhye smashanamadhye
    raksha raksha | rajadvare rajasabhamadhye raksha raksham kuru | kuru bhutapreta pishacadevadanavayakshakinnararakshasabrahmarakshasadakinishakinimaujiyadi
    avidham pretanam bhasmam kuru kuru | bhoh atratyam girau simhisimhamukhijvalajvala jivhe karalavadane
    mam raksha raksha | mama shariram vajramayam kuru kuru dashadisham bandha bandha vajrakotam kuru kuru
    | atmacakram bhramavartam sarvatram raksha raksha sarvabhayam nashaya nashaya | vyaghrasarpavarahacoradin
    bandhaya bandhaya | pishacashvanadutan kilaya kilaya hum hum hum phat | iti prayogah | iti atmadeharakshanaprayogah
    sampurnah |
  devanagari: आत्मदेहरक्षणप्रयोगः श्रीगणेशाय नमः । अथ आत्मदेहरक्षणार्थ प्रयोगः । ॐ नमो भगवते महानृसिंहाय
    सिंहाय सिंहमुखाय विकटाय वज्रदन्तनखाय मां रक्ष रक्ष ममशरीरं नखशिखापर्यन्तं रक्ष रक्षां कुरु कुरु मदीयं
    शरीरं वज्राङ्गम् । कुरु कुरु परयन्त्रपरमन्त्रपरतन्त्राणां क्षिणु क्षिणु खड्गादिधनुर्बाणाग्निबाणभुशुण्डि
    आदि शस्त्राणां इन्द्रवज्रादि ब्रह्मास्त्राणां स्तम्भय स्तम्भय । जलाग्निमध्ये रक्ष गृहमध्ये ग्राममध्ये
    नगरमध्ये वनमध्ये रणमध्ये स्मशानमध्ये रक्ष रक्ष । राजद्वारे राजसभामध्ये रक्ष रक्षां कुरु । कुरु भूतप्रेत
    पिशाचदेवदानवयक्षकिन्नरराक्षसब्रह्मराक्षसडाकिनीशाकिनीमौजियादि अविधं प्रेतानां भस्मं कुरु कुरु । भोः
    अत्रत्यं गिरौ सिंहीसिंहमुखीज्वलज्वाला जिव्हे करालवदने मां रक्ष रक्ष । मम शरीरं वज्रमयं कुरु कुरु दशदिशां
    बन्ध बन्ध वज्रकोटं कुरु कुरु । आत्मचक्रं भ्रमावर्तं सर्वत्रं रक्ष रक्ष सर्वभयं नाशय नाशय । व्याघ्रसर्पवराहचोरादीन्
    बन्धय बन्धय । पिशाचश्वानदूतान् कीलय कीलय हुं हुं हुं फट् । इति प्रयोगः । इति आत्मदेहरक्षणप्रयोगः सम्पूर्णः
    ।
