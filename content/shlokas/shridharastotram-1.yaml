id: shridharastotram-1
category: stotram
name:
  english: shridharastotram 1
  devanagari: श्रीधरस्तोत्रम् १
content:
  english: shridharastotram svatmadhyanaparayanam shrutidhanam vedantagamyam gurum nihshreyasvaradam sadashubhakaram
    sadyastapobhasvaram | shantishrisahitam sukhalayalayam sanandavaktraprabham seve sadgurushridharam
    yativaram bhaktantarastham vibhum || 1|| dharmaglaniharam dhiyavikasitam saccitsukhalambanam atmanandaparam
    sudhavilasitam divyaprabhaveshtitam | vidyavedaratam sada vihasitam cittaprashantipradam seve sadgurushridharam
    yativaram bhaktantarastham vibhum || 2|| brahmajnanavikashakam pramuditam vijnanayogasthitam shabde
    jnanapare pravinamakalam sarvarthasiddhipradam | shraddhasadhanatah sulabhyamamalam saddharmasamsthapakam
    seve sadgurushridharam yativaram bhaktantarastham vibhum || 3|| dvandvatitapada samahitamatim phullaravindananam
    brahmavishnumaheshashakradivijairyatpadapankeruham | samyagpujitamagratah sahajato yah sarvada nishcalah
    seve sadgurushridharam yativaram bhaktantarastham vibhum || 4|| satyajnanamanantamadvayamidam vakyarthato
    lakshyitam adhyatmasmritisarakalpitamidam shrivigraham tattvatah | cittam yasya kripardrasandrasaralam
    kaivalyanishthanvitam seve sadgurushridharam yativaram bhaktantarastham vibhum || 5|| prajnanotkatamedhasavilasitam
    samnyasayogadvara pidartoddharanam varabhayakaram lilavataram prabhum | dinatranakaram sprihavirahitam
    jyotihsvarupam param seve sadgurushridharam yativaram bhaktantarastham vibhum || 6|| bhaktantahkaranabdhisaumyashashinam
    karunyaratnakaram satyasvargatale sukhamritaghatam cidratnacintamanim | yah sankalpataruh sadasuphalito
    brahmaikyatakamadhuk seve sadgurushridharam yativaram bhaktantarastham vibhum || 7|| samsarambudhitarakam
    suranutam tattvarthasamveditam tattvajnanagatam prabodhagaditam sanmargamokshapradam | shishyabhishtakaram
    prasannavadanam snehankitam sundaram seve sadgurushridharam yativaram bhaktantarastham vibhum || 8||
    yah shrisadgurusamstutim yadipathennishkamato bhaktiman sah shantim pralabhetparamavicalam satyam
    ca no samshayah | cittam nirvishayam sthiram hyavikalam kritva pathedyah shucih santoshamritavaridhau
    hyaviratammagno bhavetsah puman || 9||
  devanagari: श्रीधरस्तोत्रम् स्वात्मध्यानपरायणं श्रुतिधनं वेदान्तगम्यं गुरुं निःश्रेयस्वरदं सदाशुभकरं
    सद्यस्तपोभास्वरम् । शान्तिश्रीसहितं सुखालयलयं सानन्दवक्त्रप्रभं सेवे सद्गुरुश्रीधरं यतिवरं भक्तान्तरस्थं
    विभुम् ॥ १॥ धर्मग्लानिहरं धियाविकसितं सच्चित्सुखालम्बनं आत्मानन्दपरं सुधाविलसितं दिव्यप्रभावेष्टितम्
    । विद्यावेदरतं सदा विहसितं चित्तप्रशान्तिप्रदं सेवे सद्गुरुश्रीधरं यतिवरं भक्तान्तरस्थं विभुम् ॥ २॥
    ब्रह्मज्ञानविकाशकं प्रमुदितं विज्ञानयोगस्थितं शाब्दे ज्ञानपरे प्रवीणमकलं सर्वार्थसिद्धिप्रदम् । श्रद्धासाधनतः
    सुलभ्यममलं सद्धर्मसंस्थापकं सेवे सद्गुरुश्रीधरं यतिवरं भक्तान्तरस्थं विभुम् ॥ ३॥ द्वन्द्वातीतपद समाहितमतिं
    फुल्लारविन्दाननं ब्रह्माविष्णुमहेशशक्रदिविजैर्यत्पादपङ्केरुहम् । सम्यग्पूजितमग्रतः सहजतो यः सर्वदा
    निश्चलः सेवे सद्गुरुश्रीधरं यतिवरं भक्तान्तरस्थं विभुम् ॥ ४॥ सत्यज्ञानमनन्तमद्वयमिदं वाक्यार्थतो लक्ष्यितं
    अध्यात्मस्मृतिसारकल्पितमिदं श्रीविग्रहं तत्त्वतः । चित्तं यस्य कृपार्द्रसान्द्रसरलं कैवल्यनिष्ठान्वितं
    सेवे सद्गुरुश्रीधरं यतिवरं भक्तान्तरस्थं विभुम् ॥ ५॥ प्रज्ञानोत्कटमेधसाविलसितं संन्यासयोगाद्वर पीडार्तोद्धरणं
    वराभयकरं लीलावतारं प्रभुम् । दीनत्राणकरं स्पृहाविरहितं ज्योतिःस्वरूपं परं सेवे सद्गुरुश्रीधरं यतिवरं
    भक्तान्तरस्थं विभुम् ॥ ६॥ भक्तान्तःकरणाब्धिसौम्यशशिनं कारुण्यरत्नाकरं सत्यस्वर्गतले सुखामृतघटं चिद्रत्नचिन्तामणिम्
    । यः सङ्कल्पतरुः सदासुफलितो ब्रह्मैक्यताकामधुक् सेवे सद्गुरुश्रीधरं यतिवरं भक्तान्तरस्थं विभुम् ॥
    ७॥ संसाराम्बुधितारकं सुरनुतं तत्त्वार्थसंवेदितं तत्त्वज्ञानगतं प्रबोधगदितं सन्मार्गमोक्षप्रदम् । शिष्याभीष्टकरं
    प्रसन्नवदनं स्नेहाङ्कितं सुन्दरं सेवे सद्गुरुश्रीधरं यतिवरं भक्तान्तरस्थं विभुम् ॥ ८॥ यः श्रीसद्गुरुसंस्तुतिं
    यदिपठेन्निष्कामतो भक्तिमान् सः शान्तिं प्रलभेत्परामविचलां सत्यं च नो संशयः । चित्तं निर्विषयं स्थिरं
    ह्यविकलं कृत्वा पठेद्यः शुचिः सन्तोषामृतवारिधौ ह्यविरतम्मग्नो भवेत्सः पुमान् ॥ ९॥
