id: subramalamantra
category: mantra
name:
  english: subramalamantra
  devanagari: सुब्रमालामन्त्र
content:
  english: gangasahayaya omkarasvarupaya vishnushaktisvarupaya rudrabijasvarupine vishvarupaya mahashantayate
    namah | tim mohinyai namah | hrim akarshanyai namah | hrim stambhinyai namah | shatrunakarshayakarshaya
    bandhaya bandhaya santadaya santadaya vatapittashleshmajvaramayadi nashu nivaraya nivaraya sakalavisham
    bhishaya bhishaya sarvopadrava mutsarayotsaraya mam raksha raksha bhagavan kartikeya prasida prasida
    | om namo bhagavate subrahmanyaya mahabalaparakramaya krauncagirimardanaya anekasurapranapaharaya
    indranimangalyarakshakaya trayastrimshatkotidevatanandakaraya dushtanigrahaya shishtaparipalakaya
    viramahabala hanumannarasimha varahadisahitaya indragniyamanairyutavarunavayukubereshanadigakashapataḻabandhanaya
    sarvacandagrahadi navakotigurunathaya navakotidanavashakini dakini kamini mohini stambhini gandabhairavi
    dushtabhairavadisahitabhutapretapishacabhetaḻabrahmarakshasadushtagrahan bandhaya bandhaya shanmukhaya
    vajradharaya sarvagrahanigrahaya sarvagraham nashaya nashaya sarvajvaram nashaya nashaya sarvarogam
    nashaya nashaya sarvaduritam nashaya nashaya | om ram hram hrim mayuravahanaya hum phat svaha | om
    saim hrim klim aim saim nam kam saim sharavanabhava |
  devanagari: गङ्गासहायाय ॐकारस्वरूपाय विष्णुशक्तिस्वरूपाय रुद्रबीजस्वरूपिणे विश्वरूपाय महाशान्तायते नमः
    । टीं मोहिन्यै नमः । ह्रीं आकर्षण्यै नमः । ह्रीं स्तम्भिन्यै नमः । शत्रूनाकर्षयाकर्षय बन्धय बन्धय
    सन्ताडय सन्ताडय वातपित्तश्लेष्मज्वरामयादी नाशु निवारय निवारय सकलविषं भीषय भीषय सर्वोपद्रव मुत्सारयोत्सारय
    मां रक्ष रक्ष भगवन् कार्तिकेय प्रसीद प्रसीद । ॐ नमो भगवते सुब्रह्मण्याय महाबलपराक्रमाय क्रौञ्चगिरिमर्दनाय
    अनेकासुरप्राणापहाराय इन्द्राणीमाङ्गल्यरक्षकाय त्रयस्त्रिंशत्कोटिदेवतानन्दकराय दुष्टनिग्रहाय शिष्टपरिपालकाय
    वीरमहाबल हनुमन्नारसिंह वराहादिसहिताय इन्द्राग्नियमनैर्युतवरुणवायुकुबेरेशानदिगाकाशपाताळबन्धनाय सर्वचण्डग्रहादि
    नवकोटिगुरुनाथाय नवकोटिदानवशाकिनी डाकिनी कामिनी मोहिनी स्तम्भिनी गण्डभैरवी दुष्टभैरवादिसहितभूतप्रेतपिशाचभेताळब्रह्मराक्षसदुष्टग्रहान्
    बन्धय बन्धय षण्मुखाय वज्रधराय सर्वग्रहनिग्रहाय सर्वग्रहं नाशय नाशय सर्वज्वरं नाशय नाशय सर्वरोगं नाशय
    नाशय सर्वदुरितं नाशय नाशय । ॐ रं ह्रां ह्रीं मयूरवाहनाय हुं फट् स्वाहा । ॐ सैं ह्रीं क्लीं ऐं सैं
    नं कं सैं शरवणभव ।
