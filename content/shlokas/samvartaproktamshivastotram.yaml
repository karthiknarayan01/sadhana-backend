id: samvartaproktamshivastotram
category: stotram
name:
  english: samvartaproktamshivastotram
  devanagari: संवर्तप्रोक्तंशिवस्तोत्रम्
content:
  english: samvartaproktam shivastotram tasmai bhagavate kritva namah sharvaya vedhase | rudraya shitikanthaya
    surupaya suvarcase || 12|| kapardine karalaya haryakshne varadaya ca | tryakshne pushno dantabhide
    vamanaya shivaya ca || 13|| yamyayavyaktakeshaya sadvritte shankaraya ca | kshemyaya harinetraya sthanave
    purushaya ca || 14|| harikeshaya mundaya krishayottaranaya ca | bhaskaraya sutirthaya devadevaya ramhase
    || 15|| ushnishine suvaktraya sahasrakshaya midhushe | girishaya prashantaya yataye ciravasase ||
    16|| bilvadandaya siddhaya sarvadandadharaya ca | mrigavyadhaya mahate dhanvine'tha bhavaya ca ||
    17|| varaya saumyavaktraya pashuhastaya varshine | hiranyabahave rajannugraya pataye disham || 18||
    pashunam pataye caiva bhutanam pataye tatha | vrishaya matribhaktaya senanye madhyamaya ca || 19||
    sruvahastaya pataye dhanvine bhargavaya ca | ajaya krishnanetraya virupakshaya caiva ha || 20|| tikshnadamshtraya
    tikshnaya vaishvanaramukhaya ca | mahadyutaye'nangaya sarvangaya prajavate || 21|| tatha shukradhipataye
    prithave krittivasase | kapalamaline nityam suvarnamukutaya ca || 22|| mahadevaya krishnaya tryambakayanaghaya
    ca | krodhanaya nrishamsaya mridave bahushaline || 23|| dandine taptatapase tathaiva krurakarmane
    | sahasrashirase caiva sahasracaranaya ca || 24|| namah svadhasvarupaya bahurupaya damshtrine || 24||
    pinakinam mahadevam mahayoginamavyayam | trishulapanim varadam tryambakam bhuvaneshvaram || 25|| tripuraghnam
    trinayanam trilokesham mahaujasam | prabhavam sarvabhutanam dharanam dharanidharam || 26|| ishanam
    shankaram sarvam shivam vishveshvaram bhavam | umapatim pashupatim vishvarupam maheshvaram || 27||
    virupaksham dashabhujam tishyagovrishabhadhvajam | ugram sthanum shivam ghoram sharvam gaurishamishvaram
    || 28|| shitikanthamajam shukram prithum prithuharam haram | vishvarupam virupaksham bahurupamumapatim
    || 29|| pranamya shirasa devamanangangaharam haram | sharanyam sharanam yahi mahadevam caturmukham
    || 30|| evam kritva namastasmai mahadevaya ramhase | mahatmane kshitipate tatsuvarnamavapsyasi ||
    31|| suvarnamaharishyantastatra gacchantu te narah || 31|| iti mahabharate ashvamedhikaparvani 8 adhyayantargatam
    samvartaproktam shivastotram mahabharata | ashvaparva | adhyaya 8
  devanagari: संवर्तप्रोक्तं शिवस्तोत्रम् तस्मै भगवते कृत्वा नमः शर्वाय वेधसे । रुद्राय शितिकण्ठाय सुरूपाय
    सुवर्चसे ॥ १२॥ कपर्दिने करालाय हर्यक्ष्णे वरदाय च । त्र्यक्ष्णे पूष्णो दन्तभिदे वामनाय शिवाय च ॥ १३॥
    याम्यायाव्यक्तकेशाय सद्वृत्ते शङ्कराय च । क्षेम्याय हरिनेत्राय स्थाणवे पुरुषाय च ॥ १४॥ हरिकेशाय मुण्डाय
    कृशायोत्तारणाय च । भास्कराय सुतीर्थाय देवदेवाय रंहसे ॥ १५॥ उष्णीषिणे सुवक्त्राय सहस्राक्षाय मीढुषे
    । गिरिशाय प्रशान्ताय यतये चीरवाससे ॥ १६॥ बिल्वदण्डाय सिद्धाय सर्वदण्डधराय च । मृगव्याधाय महते धन्विनेऽथ
    भवाय च ॥ १७॥ वराय सौम्यवक्त्राय पशुहस्ताय वर्षिणे । हिरण्यबाहवे राजन्नुग्राय पतये दिशाम् ॥ १८॥ पशूनां
    पतये चैव भूतानां पतये तथा । वृषाय मातृभक्ताय सेनान्ये मध्यमाय च ॥ १९॥ स्रुवहस्ताय पतये धन्विने भार्गवाय
    च । अजाय कृष्णनेत्राय विरूपाक्षाय चैव ह ॥ २०॥ तीक्ष्णदंष्ट्राय तीक्ष्णाय वैश्वानरमुखाय च । महाद्युतयेऽनङ्गाय
    सर्वाङ्गाय प्रजावते ॥ २१॥ तथा शुक्राधिपतये पृथवे कृत्तिवाससे । कपालमालिने नित्यं सुवर्णमुकुटाय च ॥
    २२॥ महादेवाय कृष्णाय त्र्यम्बकायानघाय च । क्रोधनाय नृशंसाय मृदवे बाहुशालिने ॥ २३॥ दण्डिने तप्ततपसे
    तथैव क्रूरकर्मणे । सहस्रशिरसे चैव सहस्रचरणाय च ॥ २४॥ नमः स्वधास्वरूपाय बहुरूपाय दंष्ट्रिणे ॥ २४॥ पिनाकिनं
    महादेवं महायोगिनमव्ययम् । त्रिशूलपाणिं वरदं त्र्यम्बकं भुवनेश्वरम् ॥ २५॥ त्रिपुरघ्नं त्रिनयनं त्रिलोकेशं
    महौजसम् । प्रभवं सर्वभूतानां धारणं धरणीधरम् ॥ २६॥ ईशानं शङ्करं सर्वं शिवं विश्वेश्वरं भवम् । उमापतिं
    पशुपतिं विश्वरूपं महेश्वरम् ॥ २७॥ विरूपाक्षं दशभुजं तिष्यगोवृषभध्वजम् । उग्रं स्थाणुं शिवं घोरं शर्वं
    गौरीशमीश्वरम् ॥ २८॥ शितिकण्ठमजं शुक्रं पृथुं पृथुहरं हरम् । विश्वरूपं विरूपाक्षं बहुरूपमुमापतिम् ॥
    २९॥ प्रणम्य शिरसा देवमनङ्गाङ्गहरं हरम् । शरण्यं शरणं याहि महादेवं चतुर्मुखम् ॥ ३०॥ एवं कृत्वा नमस्तस्मै
    महादेवाय रंहसे । महात्मने क्षितिपते तत्सुवर्णमवाप्स्यसि ॥ ३१॥ सुवर्णमाहरिष्यन्तस्तत्र गच्छन्तु ते
    नराः ॥ ३१॥ इति महाभारते आश्वमेधिकपर्वणि ८ अध्यायान्तर्गतं संवर्तप्रोक्तं शिवस्तोत्रं महाभारत । आश्वपर्व
    । अध्याय ८
