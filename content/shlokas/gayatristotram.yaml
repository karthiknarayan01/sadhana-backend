id: gayatristotram
category: stotram
name:
  english: gayatristotram
  devanagari: गायत्रीस्तोत्रम्
content:
  english: sukalyanim vanim suramunivaraih pujitapadam | shivam adyam vandyam tribhuvanamayim vedajananim
    | param shaktim srashtum vividha vidha rupam guna mayim | bhaje ambam gayatrim parama subhaga namdajananima
    || vishuddham sattvasthama akhila duravasthadiharanim | nirakaram saram suvimala tapo murtim atulam
    | jagat jyeshtham shreshtham sura asura pujyam shrutinutam | bhaje ambam gayatrim parama subhaga namdajananim
    | tapo nishtham abhishtam svajanamana samtapa shamanima dayamurtim sphurtim yatitati prasadaika sulabham
    varenyam punyam tam nikhila bhavabandhapa haranim bhaje ambam gayatrim parama subhaga namdajananima
    sada aradhyam sadhyam sumati mati vistarakaranim vishokam alokam hradayagata mohandhaharanim param
    divyam bhavyam agama bhava sindhveka taranim bhaje ambam gayatrim parama subhaga namdajananima ajam
    dvaitam tretam vividha gunarupam suvimalam tamo hantrim tantrim shruti madhuranadam rasamayim mahamanyam
    dhanyam satatakarunashila vibhavam bhaje ambam gayatrim parama subhaga namdajananima jagat dhatrim
    patrim sakala bhava samharakaranim suviram dhiram tam suvimalatapo rashi saranim anaikam aikam vai
    trayajagat adhishthan padavim bhaje ambam gayatrim parama subhaga namdajananima prabuddham buddham
    tam svajanayati jadyapaharanim hiranyam gunyam tam sukavijana gitam sunipunim suvidyam niravadyamamala
    gunagatham bhagavatim bhaje ambam gayatrim parama subhaga namdajananima anantam shantam yam bhajati
    vudha vrindah shrutimayima sugeyam dhyeyam yam smarati hradi nityam surapatih sada bhaktya shaktya
    pranatamatibhih pritivashagam bhaje ambam gayatrim parama subhaga namdajananima shuddha citah pathedyastu
    gayatrya ashtakam shubham aho bhagyo bhavelloke tasmin mata prasidati sambaddhanubandhah
  devanagari: सुकल्याणीं वाणीं सुरमुनिवरैः पूजितपदाम् । शिवाम् आद्यां वन्द्याम् त्रिभुवनमयीं वेदजननीं
    । परां शक्तिं स्रष्टुं विविध विध रूपां गुण मयीं । भजे अम्बां गायत्रीं परम सुभगा नंदजननीम ॥ विशुद्धां
    सत्त्वस्थाम अखिल दुरवस्थादिहरणीम् । निराकारां सारां सुविमल तपो मुर्तिं अतुलां । जगत् ज्येष्ठां श्रेष्ठां
    सुर असुर पूज्यां श्रुतिनुतां । भजे अम्बां गायत्रीं परम सुभगा नंदजननीम् । तपो निष्ठां अभिष्टां स्वजनमन
    संताप शमनीम दयामूर्तिं स्फूर्तिं यतितति प्रसादैक सुलभां वरेण्यां पुण्यां तां निखिल भवबन्धाप हरणीं
    भजे अम्बां गायत्रीं परम सुभगा नंदजननीम सदा आराध्यां साध्यां सुमति मति विस्तारकरणीं विशोकां आलोकां
    ह्रदयगत मोहान्धहरणीं परां दिव्यां भव्यां अगम भव सिन्ध्वेक तरणीं भजे अम्बां गायत्रीं परम सुभगा नंदजननीम
    अजां द्वैतां त्रेतां विविध गुणरूपां सुविमलां तमो हन्त्रीं तन्त्रीं श्रुति मधुरनादां रसमयीं महामान्यां
    धन्यां सततकरूणाशील विभवां भजे अम्बां गायत्रीं परम सुभगा नंदजननीम जगत् धात्रीं पात्रीं सकल भव संहारकरणीं
    सुवीरां धीरां तां सुविमलतपो राशि सरणीं अनैकां ऐकां वै त्रयजगत् अधिष्ठान् पदवीं भजे अम्बां गायत्रीं
    परम सुभगा नंदजननीम प्रबुद्धां बुद्धां तां स्वजनयति जाड्यापहरणीं हिरण्यां गुण्यां तां सुकविजन गीतां
    सुनिपुणीं सुविद्यां निरवद्याममल गुणगाथां भगवतीं भजे अम्बां गायत्रीं परम सुभगा नंदजननीम अनन्तां शान्तां
    यां भजति वुध वृन्दः श्रुतिमयीम सुगेयां ध्येयां यां स्मरति ह्रदि नित्यं सुरपतिः सदा भक्त्या शक्त्या
    प्रणतमतिभिः प्रितिवशगां भजे अम्बां गायत्रीं परम सुभगा नंदजननीम शुद्ध चितः पठेद्यस्तु गायत्र्या अष्टकं
    शुभम् अहो भाग्यो भवेल्लोके तस्मिन् माता प्रसीदति सम्बद्धानुबन्धाः
