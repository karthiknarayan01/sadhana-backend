id: gayatryashtakam-gayatri-ashtakam
category: stotram
name:
  english: Gayatryashtakam (Gayatri Ashtakam)
  devanagari: गायत्र्यष्टकम् १ (शङ्कराचार्यविरचितं विश्वामित्रपःफलां)
content:
  english: vishvamitrapahphalam priyataram vipralisamsevitam nityanityavivekadam smitamukhim khandendubhushojjvalam
    | tambularunabhasamanavadanam martandamadhyasthitam gayatrim harivallabham trinayanam dhyayami pancananam
    || 1 || jatipankajaketakikuvalayaih sampujitanghridvayam tattvarthatmikavarnapanktisahitam tattvarthabuddhipradam
    | pranayamaparayanairbudhajanaih samsevyamanam shivam gayatrim harivallabham trinayanam dhyayami pancananam
    || 2 || manjiradhvanibhih samastajagatam manjutvasamvardhanim vipraprenkhitavarivaritamaharakshoganam
    mrinmayim | japtuh papaharam japasumanibham hamsena samshobhitam gayatrim harivallabham trinayanam
    dhyayami pancananam || 3 || kancicelavibhushitam shivamayim malardhamaladikan bibhranam parameshvarim
    sharanadam mohandhabuddhicchidam | bhuraditripuram trilokajananimadhyatmashakhanutam gayatrim harivallabham
    trinayanam dhyayami pancananam || 4 || dhyaturgarbhakrishanutapaharanam samatmikam samagam sayamkalasusevitam
    svaramayim durvadalashyamalam | maturdasyavilocanaikamatimatkhetindrasamrajitam gayatrim harivallabham
    trinayanam dhyayami pancananam || 5 || sandhyaragavicitravastravilasadviprottamaih sevitam tarahirasumalikam
    suvilasadratnendukumbhantaram | rakacandramukhim ramapatinutam shankhadibhasvatkaram gayatrim harivallabham
    trinayanam dhyayami pancananam || 6 || venibhushitamalakadhvanikarairbhringaih sada shobhitam tattvajnanarasayanajnarasanasaudhabhramadbhramarim
    | nasalamkritamauktikendukiranaih sayantamashchedinim gayatrim harivallabham trinayanam dhyayami pancananam
    || 7 || padabjantararenukunkumalasatphaladyuramavritam rambhanatyavilokanaikarasikam vedantabuddhipradam
    | vinavenumridangakahalaravan devaih kritanchrinvatim gayatrim harivallabham trinayanam dhyayami pancananam
    || 8 || hatyapanasuvarnataskaramahagurvanganasangaman doshanchailasaman purandarasamah sancchidya
    suryopamah | gayatrim shrutimaturekamanasa sandhyasu ye bhusura japtva yanti param gatim manumimam
    devyah param vaidikah || 9 || iti shrimatparamahamsaparivrajakacarya shrimacchankaracaryaviracitam
    gayatryashtakam sampurnam |
  devanagari: विश्वामित्रपःफलां प्रियतरां विप्रालिसंसेवितां नित्यानित्यविवेकदां स्मितमुखीं खण्डेन्दुभूषोज्ज्वलाम्
    । ताम्बूलारुणभासमानवदनां मार्ताण्डमध्यस्थितां गायत्रीं हरिवल्लभां त्रिनयनां ध्यायामि पञ्चाननाम् ॥
    १ ॥ जातीपङ्कजकेतकीकुवलयैः संपूजिताङ्घ्रिद्वयां तत्त्वार्थात्मिकवर्णपङ्क्तिसहितां तत्त्वार्थबुद्धिप्रदाम्
    । प्राणायामपरायणैर्बुधजनैः संसेव्यमानां शिवां गायत्रीं हरिवल्लभां त्रिनयनां ध्यायामि पञ्चाननाम् ॥
    २ ॥ मञ्जीरध्वनिभिः समस्तजगतां मञ्जुत्वसंवर्धनीं विप्रप्रेङ्खितवारिवारितमहारक्षोगणां मृण्मयीम् । जप्तुः
    पापहरां जपासुमनिभां हंसेन संशोभितां गायत्रीं हरिवल्लभां त्रिनयनां ध्यायामि पञ्चाननाम् ॥ ३ ॥ काञ्चीचेलविभूषितां
    शिवमयीं मालार्धमालादिकान् बिभ्राणां परमेश्वरीं शरणदां मोहान्धबुद्धिच्छिदाम् । भूरादित्रिपुरां त्रिलोकजननीमध्यात्मशाखानुतां
    गायत्रीं हरिवल्लभां त्रिनयनां ध्यायामि पञ्चाननाम् ॥ ४ ॥ ध्यातुर्गर्भकृशानुतापहरणां सामात्मिकां सामगां
    सायंकालसुसेवितां स्वरमयीं दूर्वादलश्यामलाम् । मातुर्दास्यविलोचनैकमतिमत्खेटीन्द्रसंराजितां गायत्रीं
    हरिवल्लभां त्रिनयनां ध्यायामि पञ्चाननाम् ॥ ५ ॥ सन्ध्यारागविचित्रवस्त्रविलसद्विप्रोत्तमैः सेवितां ताराहीरसुमालिकां
    सुविलसद्रत्नेन्दुकुम्भान्तराम् । राकाचन्द्रमुखीं रमापतिनुतां शङ्खादिभास्वत्करां गायत्रीं हरिवल्लभां
    त्रिनयनां ध्यायामि पञ्चाननाम् ॥ ६ ॥ वेणीभूशितमालकध्वनिकरैर्भृङ्गैः सदा शोभितां तत्त्वज्ञानरसायनज्ञरसनासौधभ्रमद्भ्रामरीम्
    । नासालंकृतमौक्तिकेन्दुकिरणैः सायन्तमश्छेदिनीं गायत्रीं हरिवल्लभां त्रिनयनां ध्यायामि पञ्चाननाम् ॥
    ७ ॥ पादाब्जान्तररेणुकुङ्कुमलसत्फालद्युरामावृतां रम्भानाट्यविलोकनैकरसिकां वेदान्तबुद्धिप्रदाम् । वीणावेणुमृदङ्गकाहलरवान्
    देवैः कृताञ्छृण्वतीं गायत्रीं हरिवल्लभां त्रिनयनां ध्यायामि पञ्चाननाम् ॥ ८ ॥ हत्यापानसुवर्णतस्करमहागुर्वङ्गनासङ्गमान्
    दोषाञ्छैलसमान् पुरन्दरसमाः सञ्च्छिद्य सूर्योपमाः । गायत्रीं श्रुतिमातुरेकमनसा सन्ध्यासु ये भूसुरा
    जप्त्वा यान्ति परां गतिं मनुमिमं देव्याः परं वैदिकाः ॥ ९ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्य श्रीमच्छङ्कराचार्यविरचितं
    गायत्र्यष्टकं सम्पूर्णम् ।
