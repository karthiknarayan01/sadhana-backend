id: kirata108stotra
category: stotram
name:
  english: kirata108stotra
  devanagari: किरात१०८स्तोत्र
content:
  english: shrikiratashastuh ashtottarashatanamastotram kiratatma shivah shanta shivatma shivanandanah
    | puranapurushodhanvi puruhuta sahayakrit || 1 nilambaro mahabahurviryavan vijayapradah | vidhumaulirviradatma
    vishvatma viryamohanah || 2 varado vamadevashca vasudevapriyo vibhuh | keyuravan pinchamaulih pingalakshah
    kripanavan || 3 shasvatah sharakodandi sharanagatavatsalah | shyamalangah sharadhiman sharadindu nibhananah
    || 4 pinakantho virupakshah kshudraha kshurikayudhah | dharadhara vapurdhiman satyasandhah pratapavan
    || 5 kairatapatirakhetapriyah pritipradah prabhuh | renukatmaja shrirama cittapatmalayo bali || 6
    vyadharupadharo vyadhinashanah kalashasanah | kamadevasamo devah kamitartha phalapradah || 7 abhritah
    svabhrito dhirah sarah satvikasattamah | samavedapriyo vedhah vedo vedavidamvarah || 8 tryaksharatma
    trilokeshah trisvaratma trilocanah | trigunatma trikalajnah trimurtyatma trivargadah || 9 parvatinandanah
    shriman pavanah papanashanah | paravaragabhiratma paramatma paratparah || 10 gitapriyo gitakirtih
    kartikeyasahodarah | karunyasagaro hamsah siddha simhaparakramah || 11 sushlokah sumukho virah sundarah
    suravanditah | suravairikuladhvamsi sthulashmashruramitraha || 12 amritah sarvagah sukshma sthulasturagavahanah
    | amalo vimalo daksho vasuman vanago guruh || 13 sarvapriyah sarvasakshi sarvayogishvareshvarah taraka
    brahmarupi ca candrikavishadasmitah kirata vapuraramasancari parameshvarah || 14 iti shri kiratashastuh
    ashtottarashatanamastotram sampurnam ||
  devanagari: श्रीकिरातशास्तुः अष्टोत्तरशतनामस्तोत्रम् किरातात्मा शिवः शान्त शिवात्मा शिवनन्दनः । पुराणपुरुषोधन्वी
    पुरुहुत सहायकृत् ॥ १ नीलाम्बरो महाबाहुर्वीर्यवान् विजयप्रदः । विधुमौलिर्विराडात्मा विश्वात्मा वीर्यमोहनः
    ॥ २ वरदो वामदेवश्च वासुदेवप्रियो विभुः । केयूरवान् पिञ्छमौलिः पिङ्गलाक्षः कृपाणवान् ॥ ३ शास्वतः शरकोदण्डी
    शरणागतवत्सलः । श्यामलाङ्गः शरधीमान् शरदिन्दु निभाननः ॥ ४ पीनकण्ठो विरूपाक्षः क्षुद्रहा क्षुरिकायुधः
    । धाराधर वपुर्धीमान् सत्यसन्धः प्रतापवान् ॥ ५ कैरातपतिराखेटप्रियः प्रीतिप्रदः प्रभुः । रेणुकात्मज
    श्रीराम चित्तपत्मालयो बली ॥ ६ व्याधरूपधरो व्याधिनाशनः कालशासनः । कामदेवसमो देवः कामितार्थ फलप्रदः
    ॥ ७ अभृतः स्वभृतो धीरः सारः सात्विकसत्तमः । सामवेदप्रियो वेधाः वेदो वेदविदांवरः ॥ ८ त्र्यक्षरात्मा
    त्रिलोकेशः त्रिस्वरात्मा त्रिलोचनः । त्रिगुणात्मा त्रिकालज्ञः त्रिमूर्त्यात्मा त्रिवर्गदः ॥ ९ पार्वतीनन्दनः
    श्रीमान् पावनः पापनाशनः । पारावारगभीरात्मा परमात्मा परात्परः ॥ १० गीतप्रियो गीतकीर्तिः कार्तिकेयसहोदरः
    । कारुण्यसागरो हंसः सिद्ध सिम्हपराक्रमः ॥ ११ सुश्लोकः सुमुखो वीरः सुन्दरः सुरवन्दितः । सुरवैरिकुलध्वंसी
    स्थूलश्मश्रुरमित्रहा ॥ १२ अमृतः सर्वगः सूक्ष्म स्थूलस्तुरगवाहनः । अमलो विमलो दक्षो वसुमान् वनगो गुरुः
    ॥ १३ सर्वप्रियः सर्वसाक्षी सर्वयोगीश्वरेश्वरः तारक ब्रह्मरूपी च चन्द्रिकाविशदस्मितः किरात वपुरारामसञ्चारी
    परमेश्वरः ॥ १४ इति श्री किरातशास्तुः अष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥
