    धार॒याना॑मि क्ष॒त्रम॒जरग्ं॑ सु॒वीर्य ञ्ज॑येम श॒तिनग्ं॑ सह॒स्रिणं॒ वाज॑मग्ने॒ तवो॒तिभिः॑ ॥ वै॒श्वा॒न॒रस्य॑
    सुम॒तौ स्या॑म॒ राजा॒ हिक॒ मभि॒श्रीः । इ॒तो जा॒तो विश्व॑मि॒दं विँ च॑ष्टे वैश्वान॒रो य॑तते॒ सूर्ये॑ण
    ॥ अव॑ ते॒ हेडो॑ वरुण॒ नमो॑भि॒रव॑ य॒ज्ञेभि॑रीमहे ह॒विर्भिः॑ । क्षय॑न्न॒स्मभ्य॑मसुर प्रचेतो॒ राज॒न्नेनाग्ं॑सि
    शिश्रथः कृ॒तानि॑ ॥ उदु॑त्त॒मं वँ॑रुण॒ पाश॑म॒स्मदवा॑ श्र॑थाय । अथा॑ व॒यमा॑दित्य ऽना॑गसो॒ अदि॑तये स्याम
    ॥ द॒धि॒क्राव् ञ्जि॒ष्णोरश्व॑स्य वा॒जिनः॑ ॥ सु॒र॒भिनो॒ मुखा॑ कर॒ त्प्रण॒ आयूग्ं॑षि तारिषत् ॥ आ द॑धि॒क्रा
    श्शव॑स॒ पञ्च॑ कृ॒ष्टी स्सूर्य॑ इव॒ ज्योति॑षा॒ ऽपस्त॑तान । स॒ह॒स्र॒सा श्श॑त॒सा वा॒ज्यर्वा॑ पृ॒णक्तु॒
    मद्ध्वा॒ समि॒मा वचाग्ं॑सि । अ॒ग्नि भुवः॑ । मरु॑तो॒ यद्ध॑वो दि॒व स्सु॑म्ना॒यन्तो॒ हवा॑महे । आ तू न॒
    श्शर्म॑ शशमा॒नाय॒ सन्ति॑ त्रि॒धातू॑नि दा॒शुषे॑ यच्छ॒ताधि॑ । अ॒स्मभ्य॒ न्तानि॑ मरुतो॒ वि य॑न्त र॒यि
    र्न उरुष्य॒त्वदि॑ति॒ श्शर्म॑ यच्छतु । अदि॑तिः पा॒त्वग्ंह॑सः ॥ म॒हीमू॒षु मा॒तरग्ं॑ सुव्र॒ताना॑मृ॒तस्य॒
    पत्नी॒मव॑से हुवेम । तु॒वि॒क्ष॒त्रा मुरू॒चीग्ं सु॒शर्मा॑ण॒मदि॑तिग्ं सु॒प्रणी॑तिम् ॥ सु॒त्रामा॑ण न्द्याम॑ने॒हसग्ं॑
    सु॒शर्मा॑ण॒ मदि॑तिग्ं सु॒प्रणी॑तिम् । दैवी॒ न्नावग्ग्॑ स्वरि॒त्रा मस्र॑वन्ती॒मा रु॑हेमा स्व॒स्तये
    ऽरु॑हग्ं श॒तारि॑त्राग्ं श॒तस्फ्या ऽने॒हसग्ं॑ सु॒शर्मा॑ण॒ मेका॒न्नविग्ं॑श॒तिश्च॑ ॥ हरिः॑ ओम् ॥ ॥ कृष्ण
    यजुर्वेदीय तैत्तिरीय संहिताया म्प्रथमकाण्डे पञ्चमः प्रश्न
