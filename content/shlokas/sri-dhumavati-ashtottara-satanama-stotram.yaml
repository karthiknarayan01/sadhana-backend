id: sri-dhumavati-ashtottara-satanama-stotram
category: stotram
name:
  english: Sri Dhumavati Ashtottara Satanama Stotram
content:
  english: ishvara uvaca om dhumavati dhumravarna dhumrapanaparayana | dhumrakshamathini dhanya dhanyasthananivasini
    || || aghoracarasantushta aghoracaramandita | aghoramantrasamprita aghoramantrapujita || || attattahasanirata
    malinambaradharini | vriddha virupa vidhava vidya ca viraladvija || || pravriddhaghona kumukhi kutila
    kutilekshana | karali ca karalasya kankali shurpadharini || || kakadhvajaratharudha kevala kathina
    kuhuh | kshutpipasardita nitya lalajjihva digambari || || dirghodari dirgharava dirghangi dirghamastaka
    | vimuktakuntala kirtya kailasasthanavasini || || krura kalasvarupa ca kalacakrapravartini | vivarna
    cancala dushta dushtavidhvamsakarini || || candi candasvarupa ca camunda candanihsvana | candavega
    candagatishcandamundavinashini || || candalini citrarekha citrangi citrarupini | krishna kapardini
    kulla krishnarupa kriyavati || || kumbhastani mahonmatta madirapanavihvala | caturbhuja lalajjihva
    shatrusamharakarini || || shavarudha shavagata shmashanasthanavasini | duraradhya duracara durjanapritidayini
    || || nirmamsa ca nirakara dhumahasta varanvita | kalaha ca kaliprita kalikalmashanashini || || mahakalasvarupa
    ca mahakalaprapujita | mahadevapriya medha mahasankatanashini || || bhaktapriya bhaktagatirbhaktashatruvinashini
    | bhairavi bhuvana bhima bharati bhuvanatmika || || bherunda bhimanayana trinetra bahurupini | trilokeshi
    trikalajna trisvarupa trayitanuh || || trimurtishca tatha tanvi trishaktishca trishulini | iti dhumamahat
    stotram namnamashtashatatmakam || || maya te kathitam devi shatrusanghavinashanam | karagare ripugraste
    mahotpate mahabhaye || || idam stotram pathenmartyo mucyate sarvasankataih | guhyadguhyataram guhyam
    gopaniyam prayatnatah || || catushpadarthadam nrinam sarvasampatpradayakam || || iti shridhumavatyashtottarashatanamastotram
    |
  devanagari: ईश्वर उवाच ॐ धूमावती धूम्रवर्णा धूम्रपानपरायणा । धूम्राक्षमथिनी धन्या धन्यस्थाननिवासिनी
    ॥ ॥ अघोराचारसन्तुष्टा अघोराचारमण्डिता । अघोरमन्त्रसम्प्रीता अघोरमन्त्रपूजिता ॥ ॥ अट्टाट्टहासनिरता
    मलिनाम्बरधारिणी । वृद्धा विरूपा विधवा विद्या च विरलद्विजा ॥ ॥ प्रवृद्धघोणा कुमुखी कुटिला कुटिलेक्षणा
    । कराली च करालास्या कङ्काली शूर्पधारिणी ॥ ॥ काकध्वजरथारूढा केवला कठिना कुहूः । क्षुत्पिपासार्दिता
    नित्या ललज्जिह्वा दिगम्बरी ॥ ॥ दीर्घोदरी दीर्घरवा दीर्घाङ्गी दीर्घमस्तका । विमुक्तकुन्तला कीर्त्या
    कैलासस्थानवासिनी ॥ ॥ क्रूरा कालस्वरूपा च कालचक्रप्रवर्तिनी । विवर्णा चञ्चला दुष्टा दुष्टविध्वंसकारिणी
    ॥ ॥ चण्डी चण्डस्वरूपा च चामुण्डा चण्डनिःस्वना । चण्डवेगा चण्डगतिश्चण्डमुण्डविनाशिनी ॥ ॥ चाण्डालिनी
    चित्ररेखा चित्राङ्गी चित्ररूपिणी । कृष्णा कपर्दिनी कुल्ला कृष्णारूपा क्रियावती ॥ ॥ कुम्भस्तनी महोन्मत्ता
    मदिरापानविह्वला । चतुर्भुजा ललज्जिह्वा शत्रुसंहारकारिणी ॥ ॥ शवारूढा शवगता श्मशानस्थानवासिनी । दुराराध्या
    दुराचारा दुर्जनप्रीतिदायिनी ॥ ॥ निर्मांसा च निराकारा धूमहस्ता वरान्विता । कलहा च कलिप्रीता कलिकल्मषनाशिनी
    ॥ ॥ महाकालस्वरूपा च महाकालप्रपूजिता । महादेवप्रिया मेधा महासङ्कटनाशिनी ॥ ॥ भक्तप्रिया भक्तगतिर्भक्तशत्रुविनाशिनी
    । भैरवी भुवना भीमा भारती भुवनात्मिका ॥ ॥ भेरुण्डा भीमनयना त्रिनेत्रा बहुरूपिणी । त्रिलोकेशी त्रिकालज्ञा
    त्रिस्वरूपा त्रयीतनुः ॥ ॥ त्रिमूर्तिश्च तथा तन्वी त्रिशक्तिश्च त्रिशूलिनी । इति धूमामहत् स्तोत्रं
    नाम्नामष्टशतात्मकम् ॥ ॥ मया ते कथितं देवि शत्रुसङ्घविनाशनम् । कारागारे रिपुग्रस्ते महोत्पाते महाभये
    ॥ ॥ इदं स्तोत्रं पठेन्मर्त्यो मुच्यते सर्वसङ्कटैः । गुह्याद्गुह्यतरं गुह्यं गोपनीयं प्रयत्नतः ॥ ॥
    चतुष्पदार्थदं नॄणां सर्वसम्पत्प्रदायकम् ॥ ॥ इति श्रीधूमावत्यष्टोत्तरशतनामस्तोत्रम् ।
