id: rudrakritam2shrikrishnastotram
category: stotram
name:
  english: rudrakritam2shrikrishnastotram
  devanagari: रुद्रकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: matmapradipo guninashca bhuman || 39|| yanmayamohitadhiyah putradaragrihadishu | unmajjanti
    nimajjanti prasakta vrijinarnave || 40|| devadattamimam labdhva nrilokamajitendriyah | yo nadriyeta
    tvatpadau sa shocyo hyatmavancakah || 41|| yastvam visrijate martya atmanam priyamishvaram | viparyayendriyarthartham
    vishamattyamritam tyajan || 42|| aham brahmatha vibudha munayashcamalashayah | sarvatmana prapannastvamatmanam
    preshthamishvaram || 43|| tam tva jagatsthityudayantahetum samam prashantam suhridatmadaivam | ananyamekam
    jagadatmaketam bhavapavargaya bhajama devam || 44|| ayam mameshto dayito'nuvarti mayabhayam dattamamushya
    deva | sampadyatam tadbhavatah prasado yatha hi te daityapatau prasadah || 45|| iti shrimadbhagavatamahapurane
    dashamaskandhe uttarardhe trishashtitamadhyayantargatam shrirudrakritam shrikrishnastotram samaptam
    | bhagavatapurana | adhyaya 10
  devanagari: मात्मप्रदीपो गुणिनश्च भूमन् ॥ ३९॥ यन्मायामोहितधियः पुत्रदारगृहादिषु । उन्मज्जन्ति निमज्जन्ति
    प्रसक्ता वृजिनार्णवे ॥ ४०॥ देवदत्तमिमं लब्ध्वा नृलोकमजितेन्द्रियः । यो नाद्रियेत त्वत्पादौ स शोच्यो
    ह्यात्मवञ्चकः ॥ ४१॥ यस्त्वां विसृजते मर्त्य आत्मानं प्रियमीश्वरम् । विपर्ययेन्द्रियार्थार्थं विषमत्त्यमृतं
    त्यजन् ॥ ४२॥ अहं ब्रह्माथ विबुधा मुनयश्चामलाशयाः । सर्वात्मना प्रपन्नास्त्वामात्मानं प्रेष्ठमीश्वरम्
    ॥ ४३॥ तं त्वा जगत्स्थित्युदयान्तहेतुं समं प्रशान्तं सुहृदात्मदैवम् । अनन्यमेकं जगदात्मकेतं भवापवर्गाय
    भजाम देवम् ॥ ४४॥ अयं ममेष्टो दयितोऽनुवर्ती मयाभयं दत्तममुष्य देव । सम्पाद्यतां तद्भवतः प्रसादो यथा
    हि ते दैत्यपतौ प्रसादः ॥ ४५॥ इति श्रीमद्भागवतमहापुराणे दशमस्कन्धे उत्तरार्धे त्रिषष्टितमाध्यायान्तर्गतं
    श्रीरुद्रकृतं श्रीकृष्णस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय १०
