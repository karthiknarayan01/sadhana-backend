id: citraketukritamanantastotram
category: stotram
name:
  english: citraketukritamanantastotram
  devanagari: चित्रकेतुकृतंअनन्तस्तोत्रम्
content:
  english: madyantantaravarti trayavidhurah | adavante'pi ca sattvanam yaddhruvam tadevantarale'pi ||
    36|| kshityadibhiresha kilavritah saptabhirdashagunottarairandakoshah | yatra patatyanukalpah sahandakotikotibhistadanantah
    || 37|| vishayatrisho narapashavo ya upasate vibhutirna param tvam | teshamashisha isha tadanu vinashyanti
    yatha rajakulam || 38|| kamadhiyastvayi racita na parama rohanti yatha karambhabijani | jnanatmanyagunamaye
    gunaganato'sya dvandvajalani || 39|| jitamajita tada bhavata yadaha bhagavatam dharmamanavadyam |
    nishkincana ye munaya atmarama yamupasate'pavargaya || 40|| vishamamatirna yatra nrinam tvamahamiti
    mama taveti ca yadanyatra | vishamadhiya racito yah sa hyavishuddhah kshayishnuradharmabahulah ||
    41|| kah kshemo nijaparayoh kiyanarthah svaparadruha dharmena | svadrohattava kopah parasampidaya
    ca tathadharmah || 42|| na vyabhicarati taveksha yaya hyabhihito bhagavato dharmah | sthiracarasattvakadambeshvaprithagdhiyo
    yamupasate tvaryah || 43|| na hi bhagavannaghatitamidam tvaddarshanannrinamakhilapapakshayah | yannama
    sakricchravanatpulkasako'pi vimucyate samsarat || 44|| atha bhagavan vayamadhuna tvadavalokaparimrishtashayamalah
    | surarishina yaduditam tavakena kathamanyatha bhavati || 45|| viditamananta samastam tava jagadatmano
    janairihacaritam | vijnapyam paramaguroh kiyadiva savituriva khadyotaih || 46|| namastubhyam bhagavate
    sakalajaga
  devanagari: माद्यन्तान्तरवर्ती त्रयविधुरः । आदावन्तेऽपि च सत्त्वानां यद्ध्रुवं तदेवान्तरालेऽपि ॥ ३६॥
    क्षित्यादिभिरेष किलावृतः सप्तभिर्दशगुणोत्तरैरण्डकोशः । यत्र पतत्यणुकल्पः सहाण्डकोटिकोटिभिस्तदनन्तः
    ॥ ३७॥ विषयतृषो नरपशवो य उपासते विभूतीर्न परं त्वाम् । तेषामाशिष ईश तदनु विनश्यन्ति यथा राजकुलम् ॥
    ३८॥ कामधियस्त्वयि रचिता न परम रोहन्ति यथा करम्भबीजानि । ज्ञानात्मन्यगुणमये गुणगणतोऽस्य द्वन्द्वजालानि
    ॥ ३९॥ जितमजित तदा भवता यदाह भागवतं धर्ममनवद्यम् । निष्किञ्चना ये मुनय आत्मारामा यमुपासतेऽपवर्गाय ॥
    ४०॥ विषममतिर्न यत्र नृणां त्वमहमिति मम तवेति च यदन्यत्र । विषमधिया रचितो यः स ह्यविशुद्धः क्षयिष्णुरधर्मबहुलः
    ॥ ४१॥ कः क्षेमो निजपरयोः कियानर्थः स्वपरद्रुहा धर्मेण । स्वद्रोहात्तव कोपः परसम्पीडया च तथाधर्मः ॥
    ४२॥ न व्यभिचरति तवेक्षा यया ह्यभिहितो भागवतो धर्मः । स्थिरचरसत्त्वकदम्बेष्वपृथग्धियो यमुपासते त्वार्याः
    ॥ ४३॥ न हि भगवन्नघटितमिदं त्वद्दर्शनान्नृणामखिलपापक्षयः । यन्नाम सकृच्छ्रवणात्पुल्कसकोऽपि विमुच्यते
    संसारात् ॥ ४४॥ अथ भगवन् वयमधुना त्वदवलोकपरिमृष्टाशयमलाः । सुरऋषिणा यदुदितं तावकेन कथमन्यथा भवति ॥
    ४५॥ विदितमनन्त समस्तं तव जगदात्मनो जनैरिहाचरितम् । विज्ञाप्यं परमगुरोः कियदिव सवितुरिव खद्योतैः ॥
    ४६॥ नमस्तुभ्यं भगवते सकलजग
