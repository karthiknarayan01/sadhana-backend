id: shankaracarya-ashtottarasahasranamavalih
category: stotram
name:
  english: shankaracarya ashtottarasahasranamavalih
  devanagari: शङ्करचार्य अष्टोत्तरसहस्रनामावलिः
content:
  english: shrimat shankaracarya ashtottarasahasranamavalih om gadhadhvantanimajjanapramushitaprajnanetram
    param nashtaprayamapastasarvakaranam shvasavashesham janam
  devanagari: श्रीमत् शङ्करचार्य अष्टोत्तरसहस्रनामावलिः ॐ गाढध्वान्तनिमज्जनप्रमुषितप्रज्ञानेत्रं परम्
    नष्टप्रायमपास्तसर्वकरणं श्वासावशेषं जनम्
meaning: {}
