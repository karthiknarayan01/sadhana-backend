id: gurukavacam
category: kavacha
name:
  english: gurukavacam
  devanagari: गुरुकवचम्
content:
  english: gagananandanathashca gulphayoh patu sarvada || 6|| nilaughanandanathashca rakshayet padaprishthatah
    | svatmanandanathaguruh padangulishca rakshatu || 7|| kandolanandanathashca rakshet padatale sada
    | ityevam manavaughashca nyasennabhyadipadayoh || 8|| gururme rakshayedurvyam salile paramo guruh
    | paraparagururvahnau rakshayet shivavallabhe || 9|| parameshthigurushcaiva rakshayet vayumandale
    | shivadiguravah sakshat akashe rakshayet sada || 10|| indro guruh patu purve agneyam gururagnayah
    | dakshe yamo guruh patu nairrityam niritirguruh || 11|| varuno guruh pashcime vayavyam maruto guruh
    | uttare dhanadah patu aishanyamishvaro guruh || 12|| urdhvam patu gururbrahma ananto gururapyadhah
    | evam dashadishah pantu indradiguravah kramat || 13|| shirasah padaparyantam pantu divyaughasiddhayah
    | manavaughashca guravo vyapakam pantu sarvada || 14|| sarvatra gururupena samrakshet sadhakottamam
    | atmanam gururupam ca dhyayen mantram sada budhah || 15|| || phalashrutih || ityevam gurukavacam
    brahmaloke'pi durlabham | tava pritya maya khyatam na kasya kathitam priye || 1|| pujakale pathed
    yastu japakale visheshatah | trailokyadurlabham devi | bhuktimuktiphalapradam || 2|| sarvamantraphalam
    tasya sarvayantraphalam tatha | sarvatirthaphalam devi | yah pathet kavacam guroh || 3|| ashtagandhena
    bhurje ca likhyate cakrasamyutam | kavacam gurupanktestu bhaktya ca shubavasare || 4|| pujayet dhupadipadyaih
    sudhabhih sitasamyutaih | tarpayet gurumantrena sadhakah shuddhacetasa || 5|| dharayet kavacam devi
  devanagari: गगनानन्दनाथश्च गुल्फयोः पातु सर्वदा ॥ ६॥ नीलौघानन्दनाथश्च रक्षयेत् पादपृष्ठतः । स्वात्मानन्दनाथगुरुः
    पादाङ्गुलीश्च रक्षतु ॥ ७॥ कन्दोलानन्दनाथश्च रक्षेत् पादतले सदा । इत्येवं मानवौघाश्च न्यसेन्नाभ्यादिपादयोः
    ॥ ८॥ गुरुर्मे रक्षयेदुर्व्यां सलिले परमो गुरुः । परापरगुरुर्वह्नौ रक्षयेत् शिववल्लभे ॥ ९॥ परमेष्ठीगुरुश्चैव
    रक्षयेत् वायुमण्डले । शिवादिगुरवः साक्षात् आकाशे रक्षयेत् सदा ॥ १०॥ इन्द्रो गुरुः पातु पूर्वे आग्नेयां
    गुरुरग्नयः । दक्षे यमो गुरुः पातु नैरृत्यां निऋतिर्गुरुः ॥ ११॥ वरुणो गुरुः पश्चिमे वायव्यां मारुतो
    गुरुः । उत्तरे धनदः पातु ऐशान्यामीश्वरो गुरुः ॥ १२॥ ऊर्ध्वं पातु गुरुर्ब्रह्मा अनन्तो गुरुरप्यधः ।
    एवं दशदिशः पान्तु इन्द्रादिगुरवः क्रमात् ॥ १३॥ शिरसः पादपर्यन्तं पान्तु दिव्यौघसिद्धयः । मानवौघाश्च
    गुरवो व्यापकं पान्तु सर्वदा ॥ १४॥ सर्वत्र गुरुरूपेण संरक्षेत् साधकोत्तमम् । आत्मानं गुरुरूपं च ध्यायेन्
    मन्त्रं सदा बुधः ॥ १५॥ ॥ फलश्रुतिः ॥ इत्येवं गुरुकवचं ब्रह्मलोकेऽपि दुर्लभम् । तव प्रीत्या मया ख्यातं
    न कस्य कथितं प्रिये ॥ १॥ पूजाकाले पठेद् यस्तु जपकाले विशेषतः । त्रैलोक्यदुर्लभं देवि । भुक्तिमुक्तिफलप्रदम्
    ॥ २॥ सर्वमन्त्रफलं तस्य सर्वयन्त्रफलं तथा । सर्वतीर्थफलं देवि । यः पठेत् कवचं गुरोः ॥ ३॥ अष्टगन्धेन
    भूर्जे च लिख्यते चक्रसंयुतम् । कवचं गुरुपङ्क्तेस्तु भक्त्या च शुबवासरे ॥ ४॥ पूजयेत् धूपदीपाद्यैः सुधाभिः
    सितसंयुतैः । तर्पयेत् गुरुमन्त्रेण साधकः शुद्धचेतसा ॥ ५॥ धारयेत् कवचं देवि
