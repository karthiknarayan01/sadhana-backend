id: lingabhangamuktishatakam
category: shataka
name:
  english: lingabhangamuktishatakam
  devanagari: लिन्गभन्गमुक्तिशतकम्
content:
  english: ddadyannishkalanirbhayadvayapadam muktim sa ramo'dya me || 93|| kama tvam bhaja vitakamapadavim
    trishne vitrishnasukham bho bho manasa nirvikalpamadhunahankarashantim taram | santvoktyaiva suhrijjanam
    pariharan yasmin bhajantyekattam dadyatkamamukharibhangavibhavam muktim sa ramo'dya me || 94|| vishvakaramatim
    vihaya sahajanandavabodham matim svikrityeva mahanubhavacaranah shrivitahavyadayah | satyajnanasukharnave'tivipule
    yasmin bhajantyekadam dadyanmauniganattasaukhyavibhavam muktim sa ramo'dya me || 95|| brahmasmityanubhutiyogadahane
    nirvrittitailaidhite hutva mayikacittacaityakalanam homanalottham satim | muktyakhyam parirabhya maskarivaro
    yatsaukhyatalpam gato dadyaddrishyavirupanashavibhavam muktim sa ramo'dya me || 96|| samshantakhilapancabhutakalanasanjatananajani
  devanagari: द्दद्यान्निष्कलनिर्भयाद्वयपदां मुक्तिं स रामोऽद्य मे ॥ ९३॥ काम त्वं भज वीतकामपदवीं तृष्णे
    वितृष्णासुखं भो भो मानस निर्विकल्पमधुनाहङ्कारशान्तिं तराम् । सान्त्वोक्त्यैव सुहृज्जनं परिहरन् यस्मिन्
    भजन्त्येकत्तां दद्यात्काममुखारिभङ्गविभवां मुक्तिं स रामोऽद्य मे ॥ ९४॥ विश्वाकारमतिं विहाय सहजानन्दावबोधां
    मतिं स्वीकृत्येव महानुभावचरणाः श्रीवीतहव्यादयः । सत्यज्ञानसुखार्णवेऽतिविपुले यस्मिन् भजन्त्येकदां
    दद्यान्मौनिगणात्तसौख्यविभवां मुक्तिं स रामोऽद्य मे ॥ ९५॥ ब्रह्मास्मीत्यनुभूतियोगदहने निर्वृत्तितैलैधिते
    हुत्वा मायिकचित्तचैत्यकलनां होमानलोत्थां सतीम् । मुक्त्याख्यां परिरभ्य मस्करिवरो यत्सौख्यतल्पं गतो
    दद्याद्दृश्यविरूपनाशविभवां मुक्तिं स रामोऽद्य मे ॥ ९६॥ संशान्ताखिलपञ्चभूतकलनासञ्जातनानाजनि
