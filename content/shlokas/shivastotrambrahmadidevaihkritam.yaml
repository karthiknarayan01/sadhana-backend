id: shivastotrambrahmadidevaihkritam
category: stotram
name:
  english: shivastotrambrahmadidevaihkritam
  devanagari: शिवस्तोत्रम्ब्रह्मादिदेवैःकृतं
content:
  english: ringaradya vishanti ca | svabalenaiva tam devam tvam vayam pranata haram || 31|| hiranyaretah
    svarnabho yo hiranyabhujahvayah | sa tvam sargaharo devo nityam no'bhiprasidatu || 32|| jaganmayi
    yoganidra vishnumaya baliyasi | tasyabhavatsvayam jaya tasmai tubhyam namo namah || 33|| pancabhutamayam
    yasya pancashirsham virajate | tam pancavadanam devam bhaktya tvam pranamamahe || 34|| sadyojatamaghoram
    ca vamadevamumapatim | ishanam pranamamo'dya yam tatpurushamaha vai || 35|| yo'satamashivo nityam
    yo va bhaktimatam shivah | shivashivasvarupaya namastasmai shivaya te || 36|| rupaistribhiryah sthitisrishtinasham
    vishnvatmabhih shambhuriti prasiddhaih | karoti shashvajjagatam numastam shivam virupakshamamum shivesham
    || 37|| ah shulakhatvangamrigankadhari yo godhvajah shaktiman pancarupi | tasmai tubhyam jatavedah
    prabhaya bhuyo bhuyo namo namah shankaraya || 38|| brahmarcishman bhogabhriddaityahanta yanta yoddha
    vitagarbho jagatyah | sa tvam stuto nah prasidatvananto nityodreki uktarupah pradhanah || 39|| parabrahmarupi
    niyataikamuktah paranjyotirupi niyatastvanantah | parah pararupi niyatatmabhagi a no bhargarupi girisho'stu
    bhutyai || 40|| umapatim mahamayam mahadevam jagatpatim | shivam shivakaram shantam namamah sa prasidatu
    || 41|| iti kalikapurane shatcatvarimshadhyayantargatam brahmadidevaih kritam shivastotram sampurnam
    |
  devanagari: ृङ्गाराद्या विशन्ति च । स्वबलेनैव तं देवं त्वां वयं प्रणता हरम् ॥ ३१॥ हिरण्यरेताः स्वर्णाभो
    यो हिरण्यभुजाह्वयः । स त्वं सर्गहरो देवो नित्यं नोऽभिप्रसीदतु ॥ ३२॥ जगन्मयी योगनिद्रा विष्णुमाया बलीयसी
    । तस्याभवत्स्वयं जाया तस्मै तुभ्यं नमो नमः ॥ ३३॥ पञ्चभूतमयं यस्य पञ्चशीर्षं विराजते । तं पञ्चवदनं
    देवं भक्त्या त्वां प्रणमामहे ॥ ३४॥ सद्योजातमघोरं च वामदेवमुमापतिम् । ईशानं प्रणमामोऽद्य यं तत्पुरुषमाह
    वै ॥ ३५॥ योऽसतामशिवो नित्यं यो वा भक्तिमतां शिवः । शिवाशिवस्वरूपाय नमस्तस्मै शिवाय ते ॥ ३६॥ रूपैस्त्रिभिर्यः
    स्थितिसृष्टिनाशं विष्ण्वात्मभिः शम्भुरिति प्रसिद्धैः । करोति शश्वज्जगतां नुमस्तं शिवं विरूपाक्षममुं
    शिवेशम् ॥ ३७॥ अः शूलखट्वाङ्गमृगाङ्कधारी यो गोध्वजः शक्तिमान् पञ्चरूपी । तस्मै तुभ्यं जातवेदः प्रभाय
    भूयो भूयो नमो नमः शङ्कराय ॥ ३८॥ ब्रह्मार्चिष्मान् भोगभृद्दैत्यहन्ता यन्ता योद्धा वीतगर्भो जगत्याः
    । स त्वं स्तुतो नः प्रसीदत्वनन्तो नित्योद्रेकी उक्तरूपः प्रधानः ॥ ३९॥ परब्रह्मरूपी नियतैकमुक्तः परञ्ज्योतिरूपी
    नियतस्त्वनन्तः । परः पाररूपी नियतात्मभागी आ नो भर्गरूपी गिरिशोऽस्तु भूत्यै ॥ ४०॥ उमापतिं महामायं महादेवं
    जगत्पतिम् । शिवं शिवकरं शान्तं नमामः स प्रसीदतु ॥ ४१॥ इति कालिकापुराणे षट्चत्वारिंशाध्यायान्तर्गतं
    ब्रह्मादिदेवैः कृतं शिवस्तोत्रं सम्पूर्णम् ।
