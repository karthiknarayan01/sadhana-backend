id: sri-satyanarayana-swami-vratha-katha
category: stotram
name:
  english: Sri Satyanarayana Swami Vratha Katha
content:
  english: '|| shri ganeshaya namah || || shriparamatmane namah || atha katha prarambhah | atha prathamo
    ''dhyayah shrivyasa uvaca | ekada naimisharanye rishaya shshaunakadayah | papracchurmunaya || rishaya
    ucuh | vratena tapasa kim va~ prapyate vanchita mphalam | tatsarvam shrotumicchamah kathayasva mahamune
    || || suta uvaca | naradenaiva samprishto bhagavan kamalapatih | surar shaye yathaivaha tacchrinudhvam
    samahitah || || ekada narado yogi paranugrahakankshaya | paryatan vividha nmartyalokamupagatah ||
    || tatodrishtva janansarva nnanakleshasamanvitan | nanayonisamutpannan klishyamanan svakarmabhih ||
    nduhkhanasho bhaved dhruvam | iti sancintya manasa vishnuloka ndevadevesham stotum samupacakrame |
    narada uvaca | namo vangamanasatitarupayanantashaktaye | adimadhyantahinaya nirgunaya gunatmane ||
    || sarveshamadibhutaya bhaktanamartinashine | shrutva stotra || shribhagavanuvaca | kimarthamagato
    nte manasi vartate | kathayasva mahabhaga tatsarva || narada uvaca | martyaloke jana ssarve nanakleshasamanvitah
    | nanayonisamutpannah pacyante papakarmabhih || || tatkatham shamayennatha laghupayena tadvada | shrotumicchami
    tatsarva nkripasti yadi te mayi || || shribhagavanuvaca | sadhu prishta ntvaya vatsa lokanugrahakankshaya
    | yatkritva mucyate moha ttacchrinushva vadami te || || vratamasti mahatpunyam svarge martye ca durlabham
    | tava snehanmaya vatsa prakashah kriyate || satyanarayanasyaiva vratam samyagvidhanatah | mbhuktva
    paratra mokshamapnuyat | tacchrutva bhagavadvakya nnarado munirabravit || nkenaiva tad vratam | tatsarvam
    vi~starad bruhi kada karyam shribhagavanuvaca | duhkhashokadishamana ndhanadhanyapravardhanam || ||
    saubhagyasantatikaram sarvatra vijayapradam | yasmin kasmi ndine martyo bhaktishraddhasamanvitah ||
    ya~jeccaiva nishamukhe | brahmanairbandhavaishcaiva sahito dharmatatparah || mbhakshyamuttamam | rambhaphala
    ngodhumasya ca curnakam || va~ sharkara va gudastatha | sapadam sarvabhakshyani caikikritya nivedayet
    || ssaha | tatashca bandhubhi vi~pramshca pratibhojayet || mbhakshayed bhaktya nrityagitadika ncaret
    | tatashca svagriha thsatyanarayanam smarann || va~nchasiddhirbhaved dhruvam | visheshatah kaliyuge
    laghupayo || iti shriskandapurane revakhande shrisatyanarayana vratakathaya ''dhyayah suta uvaca |
    athanya thsampravakshyami kritam ye~na pura dvijah | kashci tkashipure ramye hyasidvipro hyasidviprotinirdhanah
    vya~kulobhutva nitya mbabhrama bhutale | duhkhita || vriddhabrahmana rupasta mpapraccha dvijamadarat
    | kimartha nnityam suduhkhitah | tatsarvam shrotumicchami kathyata || brahmana uvaca | brahmano ya~di
    janasi kripaya kathaya prabho | vriddhabrahmana uvaca | satyanarayano vishnurvanchitarthaphalapradah
    || vi~pra kurushva vratamuttamama | yatkritva sarvaduhkhebhyo mukto bhavati manavah || nca vratasyapi
    viprayabhashya yatnatah | satyanarayano vriddhastatraivantaradhiyata || || tad vratam sankarishyami
    yadukta mbrahmanena vai | iti sancintya vipro ''sau ratrau nidra na labdhavan || ssamutthaya satyanarayanavratam
    | karishya iti sankalpya bhiksharthamagamadvijah || bhiksharthamagamaddvijah tasminneva dine viprah
    pracura ndravyamaptavan | tenaiva bandhubhi ssardham satyasyavratamacarat || || sarvaduhkhavinirmukta
    ssarvasampatsamanvitah | babhuva sa dvijashreshtho vratasyasya prabhavatah || nkritva dvijottamah
    || || sarvapapavinirmukto durlabha mmokshamaptavan | vratamasya yada vipra prithivyam sankarishyati
    || ntu manujasya vinashyati | tkathayami vah | rishaya ucuh | tasmad vipracchruta mmune | tatsarvam
    shrotumicchama mbhuvi | ekada sa dvijavaro yathavibhava vistaraih || nkartum samudyatah | etasminnantare
    kale kashthakreta samagamat || nca samsthapya viprasya grihamayayau | trishnaya piditatma ca drishtva
    vipra nkriyate tvaya | krite ki mphalamapnoti vistarad vada me prabho || vipra uvaca | satyanarayanesyedam
    vra~tam sarvepsitapradam | tasya prasadanme sarva njnatva kashthakreta mmanasa ityacintayat | kashtham
    vi~krayato grame prapyate cadya yad dhanam || tenaiva satyadevasya karishye vratamuttamam | iti sancintya
    manasa kashtha ndhritva tu mastake || || jagama nagare ramye dhaninam ya~tra samsthitih | taddine
    kashthamulya nkadali phalam | sharkaraghritadugdha nca godhumasya ca curnakam || nca grihitva svagriham
    ya~yau | tato bandhun samahuya cakara vidhina vratam || || tad vratasya prabhavena dhanaputranvito
    mbhuktva cante satyapuram || || iti shriskandapurane revakhande shrisatyanarayana vratakathaya ''dhyayah
    suta uvaca | punaragre pravakshyami shrinudhva mmuni sattamah | pura colkamukho nama nripashcasinmahamatih
    || ssatyavadi yayau devalaya mprati | dine dine dhana ndattva dvijan santoshaya || bharya tasya pramugdha
    ca sarojavadana sati | bhadrashilanadi tire satyasyavratamacarat || || etasminnantare tatra sadhureka
    ssamagatah | vanijyartha mbahudhanairanekaih paripuritah || || navam samsthapya tattire jagama nripati
    mprati | drishtva sa vratina mprapaccha vinayanvitah || nbhaktiyuktena cetasa | prakasha nkuru tatsarvam
    shrotumicchami sampratam || nkriyate sadho vishnoratulatejasah | vrata mputradyavapti kamyaya || ||
    bhupasya vacanam shrutva sadhuh provaca sadaram | sarva nkathaya me rajan karishye || mamapi santatirnasti
    hyetasmajjayate dhruvam | tato nivrittya vanijya thsanando grihamagatah || || bharyayai kathitam sarvam
    vra~tam santati dayakam | tada vrata nkarishyami yada me santatirbhavet || ndivase tasya bharya lilavati
    sati || bhartriyuktanandacitta ''bhavad dharmaparayana | rgabhini sa ttasya bharya satyaprasadatah
    || dashame masi vai tasyah kanyaratnamajayata | dine dine sa vavridhe shuklapakshe yatha shashi ||
    || namna kalavati ceti tannamakarana nkritam | tato lilavati praha svamina vra~tam | sadhuruvaca |
    vivaha samaye tvasyah karishyami vrata || iti bharyam samashvasya jagama nagara mprati | tatah kalavati
    kanya vavridhe pitriveshmani || ssaha | mantrayitva druta mpreshayamasa dharmavit || nca kanyaya varam
    shreshtham vi~caraya | tenajnaptashca duto va~nikputram samadayagato hi sah | drishtva tu sundara
    mparitushtena cetasa | dattavan sadhuputraya kanyam vivahasamaye tasyastena rushto bhava tatah kalena
    niyato nijakarma visharadah | vanijyartha njamatri sahito vanik || || ratnasarapure ramye gatva sindhu
    samipatah | vanijyamakaro thsadhurjamatra shrimata saha || || tau gatau nagare ramye candraketornripasya
    ca | etasminneva kale tu satyanarayanah prabhuh || || bhrashtapratijnamalokya shapa ntasmai pradattavan
    | daruna || ekasmindivase rajno dhanamadaya taskarah | tatraiva cagata shcauro vanijau yatra samsthitau
    || ndrishtava bhitena cetasa | dhanam samsthapya tatraiva sa tu shighramalakshitah || || tato dutassamayata
    yatraste sajjano vanik | drishtva nripadhana shena dhavamanashca procurnripasamipatah | taskarau dvau
    samanitau vilokyajnapaya prabho || mbaddhva tu ta vubhau | sthapitau dvau mahadurge karagare || mayaya
    satyadevasya na shruta nkaistayorvacah | atastayordhanam rajna grihita || tacchapacca tayorgehe bharya
    caivati duhkhita | caurenapahritam sarva || adhivyadhisamayukta kshutpipashati duhkhita | annacintapara
    bhutva babhrama ca grihe grihe | kalavati tu kanyapi babhrama prativasaram || ndivase yata kshudharta
    dvijamandiram | ntatra satyanarayanasya ca || upavishya katham shrutva varam rprathitavatyapi | prasada
    bhakshana nkritva yayau ratrau griha nkathayamasa prematah | putri ratrau sthita kutra ki || kanya
    kalavati praha matara mprati satvaram | dvijalaye vrata || tacchrutva kanyaka vakyam nkartum samudyata
    | sa muda tu vanigbharya satyanarayanasya ca || ncakre saiva sadhvi bandhubhi ssaha | bhartrijamatarau
    kshipramagacchetam svamashramam || nca me bharturjamatuh hasi | vratenanena tushto ''sau satyanarayanah
    punah || shayamasa svapnam hi candraketu nnripottamam | bandinau mocaya pratarvanijau nripasattama
    || nnashayishyami sarajyadhanaputrakam || tatah prabhatasamaye raja ca svajanai || upavishya sabhamadhye
    praha svapna mprati | baddhau mahajanau shighra mmocaya dvau vaniksutau || shshrutva mocayitva mahajanau
    | samaniya nripasyagre prahuste vinayanvitah || || anitau dvau vanikputrau muktau nigadabandhanat
    | tato mahajanau natva candraketu || smarantau purva vrittanta nnocaturbhayavihvalau | raja vaniksutau
    vikshya vacah provaca sadaram || nnasti vai bhayam | tada nigadasantyaga nkshaurakarmadyakarayat ||
    ndattva paritoshya nripashca tau | puraskritya vanikputrau vacasa ndvigunikritya dattavan | provaca
    ca tato raja gaccha sadho nijashramam || mpranipatyaha gantavya ntvatprasadatah | ityuktva tau mahavaishyau
    jagmatu || iti shriskanda purane revakhande shrisatyanarayana vratakathaya ''dhyayah suta uvaca |
    yatra ntu kritavan sadhurmangalayanapurvikam | brahmanebhyo dhana ndattva tada tu nagaram || kiyad
    dure gate sadho satyanarayanah prabhuh | jijnasa nkritavan sadhau kimasti tava nausthitam || || tato
    mahajanau mattau helaya ca prahasya vai | ncaiva vartate taranau mama | nishthura ndandi tasya samipatah
    | kiyad dure tato gatva sthita || gate dandini sadhushca kritanityakriyastada | utthita ncaiva murcchito
    nyapatad bhuvi | labdhasanjno vanikputrastatashcintanvito vanikputrastatashcintanvitobhavat tada tu
    duhituh kanto vacana ncedamabravit | kimartha shshapo dattashca dandina || || shakyate tena sarvam
    hi kartu ya~mo vanchatartho bhavishyati || jamaturvacanam shrutva tatsakasha ngatastada | drishtva
    ca dandina mbhaktya natva provaca sadaram || mpunah punarnatva mahashokakulo vi~lokya ca | ma rodi
    mmama pujabahirmukhah || || mamajnaya ca durbuddhe labdha mmuhurmuhuh | tacchrutva bhagavadvakyam
    stuti || sadhuruvaca | tvanmayamohita ssarve brahmadyastridivaukasah | na jananti guna njane mohitastavamayaya
    | prasida pujayishyami yathavibhavavistaraih || ntrahi mam sharanagatam | shrutva bhaktiyutam mparitushto
    janardanah || ndattva tatraivantardadhe harih | tato navam samaruhya drishtva vittaprapuritam || ||
    kripaya satyadevasya saphalam mmama | ityuktva svajanai tpurnassatyadevaprasadatah | navam sam yo~jya
    yatnena svadeshagamana mpraha pashya ratnapuri nca preshayamasa nijavittasya rakshakam || nnatva baddhanjalistada
    || || nikate nagarasyaiva jamatra sahito vanik | agato bandhuvargaishca vittaishca bahubhiryutah ||
    || shrutva dutamukhadvakya ntatah kritva provaca tanuja || vrajami shighramagaccha sadhusandar nca
    parityajya gata sa njale tasyavamajjayat | tatah kalavati kanya na vilokya nija || shokena mahata
    tatra rudanti capatad bhuvi | || bhitena manasa sadhuh kimashcaryamida mbhavet | cintyamanashca te
    sarve babhuvustarivahakah || ndrishtva sa vihvala ''bhavat | vilalapatiduhkhena bhartara ''bhudalakshitah
    | na jane kasya devasya helaya caiva sa hrita || || satyadevasya mahatmya va~ kena shakyate | ityuktva
    vilalapaiva tatashca svajanai nkraude kritva ruroda ha | tatahkalavati kanya nashte svamini duhkhita
    || || grihitva paduke tasyanugatu || atishokena santaptashcintayamasa dharmavit | hritam va~ satyadevena
    bhranto nkarishyami yathavibhavavistaraih | iti sarvan samahuya kathayitva manoratham || || natva
    ca dandavad bhumau satyadeva mpunah punah | tatastushta nkripaya bhaktavatsalah | tyaktva prasada
    ''bhavattasyah kanyakayah patirdhruvam | griha labdhabhartri suta sadho bhavishyati na samshayah |
    kanyaka tadrisham va~kyam shrutva gaganamandalat || nca bubhoja sa | pashca tatah kalavati kanya jagada
    pitara || tacchrutva kanyakavakyam santushto ''bhudvaniksutah | pujanam satyadevasya kritva vidhividhanatah
    || njagama nijamandiram | paurnamasya nca sankrantau kritavan satyasya pujanam || mbhuktva cante satyapuram
    || || iti shriskanda purane revakhande shrisatyanarayana vratakathaya ''dhyayah suta uvaca | athanyacca
    pravakshyami shrunudhva ttungadhvajo raja prajapalanatatparah || || prasadam satyadevasya tyaktva
    duhkhamavapa sah | ekada sa vana ngatva hatva bahuvidha nca drishtva satyasya pujanam | gopah kurvanti
    santushta bhaktiyukta || raja drishtva tu darpena na gato na nanama sah | tato gopagana || samsthapya
    punaragatya bhuktatva sarve yathepsitam | tatah prasadam santyajya raja duhkhamavapa sah || nca yat
    | satyadevena tatsarva || atastatraiva gacchami yatra devasya pujanam | manasa tu vinishcitya yayau
    gopalasannidhau || ngopaganaissaha | bhaktishraddhanvito bhutva cakara vidhina nripah || || satyadevaprasadena
    dhanaputranvito mbhuktatva cante satyapuram mparamadurlabham | shrinoti ca katha mbhaktiyuktah phalapradam
    || thsatyaprasadatah | daridro labhate vitta mbaddho mucyeta bandhanat || tpramucyeta satyameva na
    samshayah | ipsita mbhuktva cante satyapuram ssatyanarayanavratam | ya tkritva sarvaduhkhebhyo mukto
    bhavati manavah || || visheshatah kaliyuge satyapuja phalaprada | keci ntathapare | nanarupadharo
    bhutva sarveshamipsitapradam || bhavishyati kalau satyavratarupi sanatanah | shrivishnuna dhritam
    rupam sarveshamipsitapradam || mpathate nityam shrinoti munisattamah | tasya nashyanti papani satyadevaprasadatah
    || mpurvam satyanarayanasya ca | tesha ntvaparajanmani kathayami munishvarah || || shatanandomahaprajnassudamabrahmano
    hyabhut | tasminjanmani shrikrishna ndhyatva mokshamavapa ha || || kashthabharavaho bhillo guharajo
    babhuva ha | tasminjanmani shriramam sevya moksha || ulkamukho maharajo nripo dasharatho ''bhavat
    | shriranganatham sampujya shrivaikuntha shriramacandrasamprapya ssatyasandhashca sadhurmoradhvajo
    nkrakacaishchittva datva mokshamavapa ha || nbhagavatan kritva shrivaikuntha bhutva gopashca te sarve
    vrajamandalavasinah | nihatya rakshasan sarva || || iti shriskandapurane revakhande shrisatyanarayana
    vratakathaya'
  devanagari: ॥ श्री गणेशाय नमः ॥ ॥ श्रीपरमात्मने नमः ॥ अथ कथा प्रारम्भः । अथ प्रथमो ऽध्यायः श्रीव्यास
    उवाच । एकदा नैमिषारण्ये ऋषय श्शौनकादयः । पप्रच्छुर्मुनय ॥ ऋषय ऊचुः । व्रतेन तपसा किं वाँ प्राप्यते
    वाञ्छित म्फलम् । तत्सर्वं श्रोतुमिच्छामः कथयस्व महामुने ॥ ॥ सूत उवाच । नारदेनैव सम्पृष्टो भगवान् कमलापतिः
    । सुरर् षये यथैवाह तच्छृणुध्वं समाहिताः ॥ ॥ एकदा नारदो योगी परानुग्रहकाङ्क्षया । पर्यटन् विविधा न्मर्त्यलोकमुपागतः
    ॥ ॥ ततोदृष्ट्वा जनान्सर्वा न्नानाक्लेशसमन्वितान् । नानायोनिसमुत्पन्नान् क्लिश्यमानान् स्वकर्मभिः ॥
    न्दुःखनाशो भवेद् ध्रुवम् । इति सञ्चिन्त्य मनसा विष्णुलोक न्देवदेवेशं स्तोतुं समुपचक्रमे । नारद उवाच
    । नमो वाङ्गमनसातीतरूपायानन्तशक्तये । आदिमध्यान्तहीनाय निर्गुणाय गुणात्मने ॥ ॥ सर्वेषामादिभूताय भक्तानामार्तिनाशिने
    । श्रुत्वा स्तोत्र ॥ श्रीभगवानुवाच । किमर्थमागतो न्ते मनसि वर्तते । कथयस्व महाभाग तत्सर्व ॥ नारद उवाच
    । मर्त्यलोके जना स्सर्वे नानाक्लेशसमन्विताः । ननायोनिसमुत्पन्नाः पच्यन्ते पापकर्मभिः ॥ ॥ तत्कथं शमयेन्नाथ
    लघूपायेन तद्वद । श्रोतुमिच्छामि तत्सर्व ङ्कृपास्ति यदि ते मयि ॥ ॥ श्रीभगवानुवाच । साधु पृष्ट न्त्वया
    वत्स लोकानुग्रहकाङ्क्षया । यत्कृत्वा मुच्यते मोह त्तच्छृणुष्व वदामि ते ॥ ॥ व्रतमस्ति महत्पुण्यं स्वर्गे
    मर्त्ये च दुर्लभम् । तव स्नेहान्मया वत्स प्रकाशः क्रियते ॥ सत्यनारायणस्यैव व्रतं सम्यग्विधानतः । म्भुक्त्वा
    परत्र मोक्षमाप्नुयात् । तच्छ्रुत्वा भगवद्वाक्य न्नारदो मुनिरब्रवीत् ॥ ङ्केनैव तद् व्रतम् । तत्सर्वं
    विँस्तराद् ब्रूहि कदा कार्यं श्रीभगवानुवाच । दुःखशोकादिशमन न्धनधान्यप्रवर्धनम् ॥ ॥ सौभाग्यसन्ततिकरं
    सर्वत्र विजयप्रदम् । यस्मिन् कस्मि न्दिने मर्त्यो भक्तिश्रद्धासमन्वितः ॥ यँजेच्चैव निशामुखे । ब्राह्मणैर्बान्धवैश्चैव
    सहितो धर्मतत्परः ॥ म्भक्ष्यमुत्तमम् । रम्भाफल ङ्गोधूमस्य च चूर्णकम् ॥ वाँ शर्करा वा गुडस्तथा । सपादं
    सर्वभक्ष्याणि चैकीकृत्य निवेदयेत् ॥ स्सह । ततश्च बन्धुभि विँप्रांश्च प्रतिभोजयेत् ॥ म्भक्षयेद् भक्त्या
    नृत्यगीतादिक ञ्चरेत् । ततश्च स्वगृह थ्सत्यनारायणं स्मरन्न् ॥ वाँञ्छासिद्धिर्भवेद् ध्रुवम् । विशेषतः
    कलियुगे लघूपायो ॥ इति श्रीस्कान्दपुराणे रेवाखण्डे श्रीसत्यनारायण व्रतकथाया ऽध्यायः सूत उवाच । अथान्य
    थ्सम्प्रवक्ष्यामि कृतं येँन पुरा द्विजाः । कश्चि त्काशीपुरे रम्ये ह्यासीद्विप्रो ह्यासीद्विप्रोतिनिर्धनः
    व्याँकुलोभूत्वा नित्य म्बभ्राम भूतले । दुःखित ॥ वृद्धब्राह्मण रूपस्त म्पप्रच्छ द्विजमादरात् । किमर्थ
    न्नित्यं सुदुःखितः । तत्सर्वं श्रोतुमिच्छामि कथ्यता ॥ ब्राह्मण उवाच । ब्राह्मणो यँदि जानासि कृपया
    कथय प्रभो । वृद्धब्राह्मण उवाच । सत्यनारायणो विष्णुर्वाञ्छितार्थफलप्रदः ॥ विँप्र कुरुष्व व्रतमुत्तमम
    । यत्कृत्वा सर्वदुःखेभ्यो मुक्तो भवति मानवः ॥ ञ्च व्रतस्यापि विप्रायाभाष्य यत्नतः । सत्यनारायणो वृद्धस्तत्रैवान्तरधीयत
    ॥ ॥ तद् व्रतं सङ्करिष्यामि यदुक्त म्ब्राह्मणेन वै । इति सञ्चिन्त्य विप्रो ऽसौ रात्रौ निद्रा न लब्धवान्
    ॥ स्समुत्थाय सत्यनारायणव्रतम् । करिष्य इति सङ्कल्प्य भिक्षार्थमगमद्विजः ॥ भिक्षार्थमगमद्द्विजः तस्मिन्नेव
    दिने विप्रः प्रचुर न्द्रव्यमाप्तवान् । तेनैव बन्धुभि स्सार्धं सत्यस्यव्रतमाचरत् ॥ ॥ सर्वदुःखविनिर्मुक्त
    स्सर्वसम्पत्समन्वितः । बभूव स द्विजश्रेष्ठो व्रतस्यास्य प्रभावतः ॥ ङ्कृत्वा द्विजोत्तमः ॥ ॥ सर्वपापविनिर्मुक्तो
    दुर्लभ म्मोक्षमाप्तवान् । व्रतमस्य यदा विप्र पृथिव्यां सङ्करिष्यति ॥ न्तु मनुजस्य विनश्यति । त्कथयामि
    वः । ऋषय ऊचुः । तस्माद् विप्राच्छ्रुत म्मुने । तत्सर्वं श्रोतुमिच्छाम म्भुवि । एकदा स द्विजवरो यथाविभव
    विस्तरैः ॥ ङ्कर्तुं समुद्यतः । एतस्मिन्नन्तरे काले काष्ठक्रेता समागमत् ॥ ञ्च संस्थाप्य विप्रस्य गृहमाययौ
    । तृष्णाया पीडितात्मा च दृष्ट्वा विप्र ङ्क्रियते त्वया । कृते कि म्फलमाप्नोति विस्तराद् वद मे प्रभो
    ॥ विप्र उवाच । सत्यनारायणेस्येदं व्रँतं सर्वेप्सितप्रदम् । तस्य प्रसादान्मे सर्व ञ्ज्ञात्वा काष्ठक्रेता
    म्मनसा इत्यचिन्तयत् । काष्ठं विँक्रयतो ग्रामे प्राप्यते चाद्य यद् धनम् ॥ तेनैव सत्यदेवस्य करिष्ये
    व्रतमुत्तमम् । इति सञ्चिन्त्य मनसा काष्ठ न्धृत्वा तु मस्तके ॥ ॥ जगाम नगरे रम्ये धनिनां यँत्र संस्थितिः
    । तद्दिने काष्ठमूल्य ङ्कदली फलम् । शर्कराघृतदुग्ध ञ्च गोधूमस्य च चूर्णकम् ॥ ञ्च गृहीत्वा स्वगृहं यँयौ
    । ततो बन्धून् समाहूय चकार विधिना व्रतम् ॥ ॥ तद् व्रतस्य प्रभावेण धनपुत्रान्वितो म्भुक्त्वा चान्ते
    सत्यपुरं ॥ ॥ इति श्रीस्कान्दपुराणे रेवाखण्डे श्रीसत्यनारायण व्रतकथाया ऽध्यायः सूत उवाच । पुनरग्रे
    प्रवक्ष्यामि शृणुध्व म्मुनि सत्तमाः । पुरा चोल्कामुखो नाम नृपश्चासीन्महामतिः ॥ स्सत्यवादी ययौ देवालय
    म्प्रति । दिने दिने धन न्दत्त्वा द्विजान् सन्तोषय ॥ भार्या तस्य प्रमुग्धा च सरोजवदना सती । भद्रशीलानदी
    तीरे सत्यस्यव्रतमाचरत् ॥ ॥ एतस्मिन्नन्तरे तत्र साधुरेक स्समागतः । वाणिज्यार्थ म्बहुधनैरनेकैः परिपूरितः
    ॥ ॥ नावं संस्थाप्य तत्तीरे जगाम नृपति म्प्रति । दृष्ट्वा स व्रतिन म्प्रपच्छ विनयान्वितः ॥ न्भक्तियुक्तेन
    चेतसा । प्रकाश ङ्कुरु तत्सर्वं श्रोतुमिच्छामि साम्प्रतम् ॥ ङ्क्रियते साधो विष्णोरतुलतेजसः । व्रत म्पुत्राद्यावाप्ति
    काम्यया ॥ ॥ भूपस्य वचनं श्रुत्वा साधुः प्रोवाच सादरम् । सर्व ङ्कथय मे राजन् करिष्ये ॥ ममापि सन्ततिर्नास्ति
    ह्येतस्माज्जायते ध्रुवम् । ततो निवृत्त्य वाणिज्या थ्सानन्दो गृहमागतः ॥ ॥ भार्यायै कथितं सर्वं व्रँतं
    सन्तति दायकम् । तदा व्रत ङ्करिष्यामि यदा मे सन्ततिर्भवेत् ॥ न्दिवसे तस्य भार्या लीलावती सती ॥ भर्तृयुक्तानन्दचित्ता
    ऽभवद् धर्मपरायणा । र्गभिणी सा त्तस्य भार्या सत्यप्रसादतः ॥ दशमे मासि वै तस्याः कन्यारत्नमजायत । दिने
    दिने सा ववृधे शुक्लपक्षे यथा शशी ॥ ॥ नाम्ना कलावती चेति तन्नामकरण ङ्कृतम् । ततो लीलावती प्राह स्वामिन
    व्रँतम् । साधुरुवाच । विवाह समये त्वस्याः करिष्यामि व्रत ॥ इति भार्यां समाश्वास्य जगाम नगर म्प्रति
    । ततः कलावती कन्या ववृधे पितृवेश्मनि ॥ स्सह । मन्त्रयित्वा द्रुत म्प्रेषयामास धर्मवित् ॥ ञ्च कन्याया
    वरं श्रेष्ठं विँचारय । तेनाज्ञप्तश्च दूतो वँणिक्पुत्रं समादायागतो हि सः । दृष्ट्वा तु सुन्दर म्परितुष्टेन
    चेतसा । दत्तावान् साधुपुत्राय कन्यां विवाहसमये तस्यास्तेन रुष्टो भव ततः कालेन नियतो निजकर्म विशारदः
    । वाणिज्यार्थ ञ्जामातृ सहितो वणिक् ॥ ॥ रत्नसारपुरे रम्ये गत्वा सिन्धु समीपतः । वाणिज्यमकरो थ्साधुर्जामात्रा
    श्रीमता सह ॥ ॥ तौ गतौ नगरे रम्ये चन्द्रकेतोर्नृपस्य च । एतस्मिन्नेव काले तु सत्यनारायणः प्रभुः ॥ ॥
    भ्रष्टप्रतिज्ञमालोक्य शाप न्तस्मै प्रदत्तवान् । दारुण ॥ एकस्मिन्दिवसे राज्ञो धनमादाय तस्करः । तत्रैव
    चागत श्चौरो वणिजौ यत्र संस्थितौ ॥ न्दृष्टवा भीतेन चेतसा । धनं संस्थाप्य तत्रैव स तु शीघ्रमलक्षितः
    ॥ ॥ ततो दूतास्समायाता यत्रास्ते सज्जनो वणिक् । दृष्ट्वा नृपधन षेण धावमानाश्च प्रोचुर्नृपसमीपतः । तस्करौ
    द्वौ समानीतौ विलोक्याज्ञापय प्रभो ॥ म्बद्ध्वा तु ता वुभौ । स्थापितौ द्वौ महादुर्गे कारागारे ॥ मायया
    सत्यदेवस्य न श्रुत ङ्कैस्तयोर्वचः । अतस्तयोर्धनं राज्ञा गृहीत ॥ तच्छापाच्च तयोर्गेहे भार्या चैवाति
    दुःखिता । चौरेणापहृतं सर्व ॥ आधिव्याधिसमायुक्ता क्षुत्पिपाशाति दुःखिता । अन्नचिन्तापरा भूत्वा बभ्राम
    च गृहे गृहे । कलावती तु कन्यापि बभ्राम प्रतिवासरम् ॥ न्दिवसे याता क्षुधार्ता द्विजमन्दिरम् । न्तत्र
    सत्यनारायणस्य च ॥ उपविश्य कथां श्रुत्वा वरं र्प्राथितवत्यपि । प्रसाद भक्षण ङ्कृत्वा ययौ रात्रौ गृह
    ङ्कथयामास प्रेमतः । पुत्रि रात्रौ स्थिता कुत्र कि ॥ कन्या कलावती प्राह मातर म्प्रति सत्वरम् । द्विजालये
    व्रत ॥ तच्छ्रुत्वा कन्यका वाक्यं ङ्कर्तुं समुद्यता । सा मुदा तु वणिग्भार्या सत्यनारायणस्य च ॥ ञ्चक्रे
    सैव साध्वी बन्धुभि स्सह । भर्तृजामातरौ क्षिप्रमागच्छेतां स्वमाश्रमम् ॥ ञ्च मे भर्तुर्जामातुः हसि ।
    व्रतेनानेन तुष्टो ऽसौ सत्यनारायणः पुनः ॥ शयामास स्वप्नं ही चन्द्रकेतु न्नृपोत्तमम् । बन्दिनौ मोचय
    प्रातर्वणिजौ नृपसत्तम ॥ न्नाशयिष्यामि सराज्यधनपुत्रकम् ॥ ततः प्रभातसमये राजा च स्वजनै ॥ उपविश्य सभामध्ये
    प्राह स्वप्न म्प्रति । बद्धौ महाजनौ शीघ्र म्मोचय द्वौ वणिक्सुतौ ॥ श्श्रुत्वा मोचयित्वा महाजनौ । समानीय
    नृपस्याग्रे प्राहुस्ते विनयान्विताः ॥ ॥ आनीतौ द्वौ वणिक्पुत्रौ मुक्तौ निगडबन्धनात् । ततो महाजनौ नत्वा
    चन्द्रकेतु ॥ स्मरन्तौ पूर्व वृत्तान्त न्नोचतुर्भयविह्वलौ । राजा वणिक्सुतौ वीक्ष्य वचः प्रोवाच सादरम्
    ॥ न्नास्ति वै भयम् । तदा निगडसन्त्याग ङ्क्षौरकर्माद्यकारयत् ॥ न्दत्त्वा परितोष्य नृपश्च तौ । पुरस्कृत्य
    वणिक्पुत्रौ वचसा न्द्विगुणीकृत्य दत्तवान् । प्रोवाच च ततो राजा गच्छ साधो निजाश्रमम् ॥ म्प्रणिपत्याह
    गन्तव्य न्त्वत्प्रसादतः । इत्युक्त्वा तौ महावैश्यौ जग्मतु ॥ इति श्रीस्कान्द पुराणे रेवाखण्डे श्रीसत्यनारायण
    व्रतकथाया ऽध्यायः सूत उवाच । यात्रा न्तु कृतवान् साधुर्मङ्गलायनपूर्विकाम् । ब्राह्मणेभ्यो धन न्दत्त्वा
    तदा तु नगरं ॥ कियद् दूरे गते साधो सत्यनारायणः प्रभुः । जिज्ञासा ङ्कृतवान् साधौ किमस्ति तव नौस्थितम्
    ॥ ॥ ततो महाजनौ मत्तौ हेलया च प्रहस्य वै । ञ्चैव वर्तते तरणौ मम । निष्ठुर न्दण्डी तस्य समीपतः । कियद्
    दूरे ततो गत्वा स्थित ॥ गते दण्डिनि साधुश्च कृतनित्यक्रियस्तदा । उत्थिता ञ्चैव मूर्च्छितो न्यपतद् भुवि
    । लब्धसञ्ज्ञो वणिक्पुत्रस्ततश्चिन्तान्वितो वणिक्पुत्रस्ततश्चिन्तान्वितोभवत् तदा तु दुहितुः कान्तो
    वचन ञ्चेदमब्रवीत् । किमर्थ श्शापो दत्तश्च दण्डिना ॥ ॥ शक्यते तेन सर्वं हि कर्तु याँमो वाञ्छतार्थो
    भविष्यति ॥ जामातुर्वचनं श्रुत्वा तत्सकाश ङ्गतस्तदा । दृष्ट्वा च दण्डिन म्भक्त्या नत्वा प्रोवाच सादरम्
    ॥ म्पुनः पुनर्नत्वा महाशोकाकुलो विँलोक्य च । मा रोदी म्मम पूजाबहिर्मुखः ॥ ॥ ममाज्ञया च दुर्बुद्धे
    लब्ध म्मुहुर्मुहुः । तच्छ्रुत्वा भगवद्वाक्यं स्तुति ॥ साधुरुवाच । त्वन्मायामोहिता स्सर्वे ब्रह्माद्यास्त्रिदिवौकसः
    । न जानन्ति गुणा ञ्जाने मोहितस्तवमायया । प्रसीद पूजयिष्यामि यथाविभवविस्तरैः ॥ न्त्राहि मां शरणागतम्
    । श्रुत्वा भक्तियुतं म्परितुष्टो जनार्दनः ॥ न्दत्त्वा तत्रैवान्तर्दधे हरिः । ततो नावं समारूह्य दृष्ट्वा
    वित्तप्रपूरिताम् ॥ ॥ कृपया सत्यदेवस्य सफलं म्मम । इत्युक्त्वा स्वजनै त्पूर्णस्सत्यदेवप्रसादतः । नावं
    सं योँज्य यत्नेन स्वदेशगमन म्प्राह पश्य रत्नपुरी ञ्च प्रेषयामास निजवित्तस्य रक्षकम् ॥ न्नत्वा बद्धाञ्जलिस्तदा
    ॥ ॥ निकटे नगरस्यैव जामात्रा सहितो वणिक् । आगतो बन्धुवर्गैश्च वित्तैश्च बहुभिर्युतः ॥ ॥ श्रुत्वा दूतमुखाद्वाक्य
    न्ततः कृत्वा प्रोवाच तनुजा ॥ व्रजामि शीघ्रमागच्छ साधुसन्दर् ञ्च परित्यज्य गता सा ञ्जले तस्यावमज्जयत्
    । ततः कलावती कन्या न विलोक्य निज ॥ शोकेन महता तत्र रुदन्ती चापतद् भुवि । ॥ भीतेन मनसा साधुः किमाश्चर्यमिद
    म्भवेत् । चिन्त्यमानाश्च ते सर्वे बभूवुस्तरिवाहकाः ॥ न्दृष्ट्वा सा विह्वला ऽभवत् । विललापातिदुःखेन
    भर्तार ऽभूदलक्षितः । न जाने कस्य देवस्य हेलया चैव सा हृता ॥ ॥ सत्यदेवस्य माहात्म्य वाँ केन शक्यते
    । इत्युक्त्वा विललापैव ततश्च स्वजनै ङ्क्रौडे कृत्वा रुरोद ह । ततःकलावती कन्या नष्टे स्वामिनि दुःखिता
    ॥ ॥ गृहीत्वा पादुके तस्यानुगतु ॥ अतिशोकेन सन्तप्तश्चिन्तयामास धर्मवित् । हृतं वाँ सत्यदेवेन भ्रान्तो
    ङ्करिष्यामि यथाविभवविस्तरैः । इति सर्वान् समाहूय कथयित्वा मनोरथम् ॥ ॥ नत्वा च दण्डवद् भूमौ सत्यदेव
    म्पुनः पुनः । ततस्तुष्ट ङ्कृपया भक्तवत्सलः । त्यक्त्वा प्रसाद ऽभवत्तस्याः कन्यकायाः पतिर्ध्रुवम् ।
    गृह लब्धभर्त्री सुता साधो भविष्यति न संशयः । कन्यका तादृशं वाँक्यं श्रुत्वा गगनमण्डलात् ॥ ञ्च बुभोज
    सा । पश्चा ततः कलावती कन्या जगाद पितर ॥ तच्छ्रुत्वा कन्यकावाक्यं सन्तुष्टो ऽभूद्वणिक्सुतः । पूजनं
    सत्यदेवस्य कृत्वा विधिविधानतः ॥ ञ्जगाम निजमन्दिरम् । पौर्णमास्या ञ्च सङ्क्रान्तौ कृतवान् सत्यस्य पूजनम्
    ॥ म्भुक्त्वा चान्ते सत्यपुरं ॥ ॥ इति श्रीस्कान्द पुराणे रेवाखण्डे श्रीसत्यनारायण व्रतकथाया ऽध्यायः
    सूत उवाच । अथान्यच्च प्रवक्ष्यामि श्रुणुध्व त्तुङ्गध्वजो राजा प्रजापालनतत्परः ॥ ॥ प्रसादं सत्यदेवस्य
    त्यक्त्वा दुःखमवाप सः । एकदा स वन ङ्गत्वा हत्वा बहुविधा ञ्च दृष्ट्वा सत्यस्य पूजनम् । गोपाः कुर्वन्ति
    सन्तुष्टा भक्तियुक्ता ॥ राजा दृष्ट्वा तु दर्पेण न गतो न ननाम सः । ततो गोपगणा ॥ संस्थाप्य पुनरागत्य
    भुक्तत्वा सर्वे यथेप्सितम् । ततः प्रसादं सन्त्यज्य राजा दुःखमवाप सः ॥ ञ्च यत् । सत्यदेवेन तत्सर्व
    ॥ अतस्तत्रैव गच्छामि यत्र देवस्य पूजनम् । मनसा तु विनिश्चित्य ययौ गोपालसन्निधौ ॥ ङ्गोपगणैस्सह । भक्तिश्रद्धान्वितो
    भूत्वा चकार विधिना नृपः ॥ ॥ सत्यदेवप्रसादेन धनपुत्रान्वितो म्भुक्तत्वा चान्ते सत्यपुरं म्परमदुर्लभम्
    । शृणोति च कथा म्भक्तियुक्तः फलप्रदाम् ॥ थ्सत्यप्रसादतः । दरिद्रो लभते वित्त म्बद्धो मुच्येत बन्धनात्
    ॥ त्प्रमुच्येत सत्यमेव न संशयः । ईप्सित म्भुक्त्वा चान्ते सत्यपुरं स्सत्यनारायणव्रतम् । य त्कृत्वा
    सर्वदुःखेभ्यो मुक्तो भवति मानवः ॥ ॥ विशेषतः कलियुगे सत्यपूजा फलप्रदा । केचि न्तथापरे । नानारूपधरो
    भूत्वा सर्वेषामीप्सितप्रदम् ॥ भविष्यति कलौ सत्यव्रतरूपी सनातनः । श्रीविष्णुना धृतं रूपं सर्वेषामीप्सितप्रदम्
    ॥ म्पठते नित्यं शृणोति मुनिसत्तमाः । तस्य नश्यन्ति पापानि सत्यदेवप्रसादतः ॥ म्पूर्वं सत्यनारायणस्य
    च । तेषा न्त्वपरजन्मानि कथयामि मुनीश्वराः ॥ ॥ शतानन्दोमहाप्राज्ञस्सुदामाब्राह्मणो ह्यभूत् । तस्मिञ्जन्मनि
    श्रीकृष्ण न्ध्यात्वा मोक्षमवाप ह ॥ ॥ काष्ठभारवहो भिल्लो गुहराजो बभूव ह । तस्मिञ्जन्मनि श्रीरामं सेव्य
    मोक्ष ॥ उल्कामुखो महाराजो नृपो दशरथो ऽभवत् । श्रीरङ्गनाथं सम्पूज्य श्रीवैकुण्ठ श्रीरामचन्द्रसम्प्राप्य
    स्सत्यसन्धश्च साधुर्मोरध्वजो ङ्क्रकचैश्छित्त्वा दत्वा मोक्षमवाप ह ॥ न्भागवतान् कृत्वा श्रीवैकुण्ठ
    भूत्वा गोपाश्च ते सर्वे व्रजमण्डलवासिनः । निहत्य राक्षसान् सर्वा ॥ ॥ इति श्रीस्कान्दपुराणे रेवाखण्डे
    श्रीसत्यनारायण व्रतकथाया
