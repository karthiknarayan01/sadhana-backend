    तपस्या सौः तपोनिष्ठा ह्सौः स्तुतिः । ॐ श्रीं क्लीं तौलिनी ऐं सौः तारकेशी ह्सौः तुला ॥ ११७॥ ॐ श्रीं
    ह्रीं ह्सौः सुतार्त्तीया श्रीं श्रीं ऐं मुक्तिदा तथा । ॐ ऐं क्लीं सौः च कामाक्षी ॐ श्रीं स्त्रीं पिङ्गलालका
    ॥ ११८॥ ॐ श्रीं ऐं सौः च कुलजा ॐ श्रीं क्रीं कुन्तलेश्वरी । ॐ श्री ऐं क्लीं अपर्णा च ॐ श्रीं पर्णाशना
