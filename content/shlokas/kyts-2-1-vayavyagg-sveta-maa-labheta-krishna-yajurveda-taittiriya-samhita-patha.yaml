id: kyts-2-1-vayavyagg-sveta-maa-labheta-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 2.1 Vayavyagg Sveta Maa Labheta - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ndvitiyakande prathamah prashnah shri gurubhyo namah
    | harih om || vayavyagg shvetama labheta bhutikamo vayurvai kshepishtha devatavayumeva svena bhagadheyenopa
    dhavati sa evaina tikshipra devatetyahu ssainamishvara pradaha ityetameva santam va~yave niyutvata
    a labheta niyudva asya dhritirdhrita eva bhutimupaitya pradahaya bhavatyeva vayave niyutvata a labheta
    gramakamo vayurva imah praja nasyota neniyate vayumeva niyutvantagg svena bhagadheyenopa dhavati sa
    evasmai praja nasyota niyacchati gramyeva bhavati niyutvate bhavati dhruva evasma anapagah karoti
    vayave niyutvata a labheta prajakamah prano vai vayurapano niyu tpranapanau khalu va etasya prajaya
    nna vindate vayumeva niyutvantagg svena bhagadheyenopa dhavati sa evasmai mpra janayati vindate va~yave
    niyutvata a labheta jyogamayavi prano vai vayurapano niyu tpranapanau khalu va etasma dapakramato
    yasya jyogamayati vayumeva niyutvantagg svena bhagadheyenopa npranapanau dadhatyuta yaditasurbhavati
    jivatyeva prajapatirva idameka asi 'kamayata prajah pashun thsrijeyeti sa atmano vapamudakkhida ttamagnau
    pragrihna svayai devataya a 'labhata tato vai sa prajah pashunasrijata yah prajakamah ntuparama labheta
    prajapatimeva svena bhagadheyenopa dhavati sa evasmai tpurushanagm rupam ttuparastadashvanam ya~davya
    iva shaphastadavinam metavanto vai gramyah pashavasta nrupenaivava rundhe somapaushna ntraitama labheta
    pashukamodvau va ajayai stanau nanaiva dvavabhi jayete urja ntritiyahsomapushanaveva svena bhagadheyenopa
    dhavati tavevasmai pashu ssomo vai retodhah pusha pashuna mprajanayita soma evasmai reto dadhati pusha
    pashu npra janayatyaudumbaro yupo bhavatyurgva udumbara urkpashava urjaivasma urja apradahaya bhavatyeva
    amayati vayumeva niyutvatagg svena bhagadheyenopa prajapatih praja asrijata ta asma thsrishtah paraciraya
    ttah punarayacata ta asmai na punaradada vri~nishvatha me punardehiti tasam va~rama 'labhata sa krishna
    ekashitipada bhavadyo varuna grihita meva svena bhagadheyenopa dhavati sa evainam nmuncati krishna
    ekashitipa dbhavati varuno hyesha devataya samriddhyai suvarbhanurasura 'viddhyata tasmaidevah prayashcitti
    ddvitiyagm sa phalguni yata tritiyagm sa balakshi yadaddhyastha ndevapashurva ayagm samabhu tkasma
    imama laphsyamaha ityatha vai tar hyalpa prithivyasi dajata oshadhayastamavim va~shamadityebhyah kamaya
    'labhanta tato va aprathata prithivya jayantaushadhayo yah kamayeta pratheya pashubhih pra prajaya
    jayeyeti sa etamavim va~shamadityebhyah kamaya alabheta ''dityaneva ''labheta ''dityaneva kamagg svena
    bhagadheyenopa dhavati ta evaina mprathayanti pashubhih pra prajaya janayantya savadityo na vyarocata
    tasmai devah prayashcittimaiccha nkrishnagrivigm sagmhitamaindrig nrucamadadhuryo brahmavarcasa nkrishnagrivigm
    sagmhitamaindrig haspatyameta eva devata ssvena bhagadheyenopa dhavati ta evasmi ndadhati brahmavarcasyeva
    bhavati vasanta nkrishna grivima labheta grishme maddhyandine sagmhitamaindrigm sharadyaparahne shveta
    ntrini va adityasya tejagmsi vasanta pratargrishme maddhyandine sharadyaparahne yavantyeva tejagmsi
    tanyeva mparyalabhyante sam va~thsaro vai brahmavarcasasya pradata sam mpra yacchati brahmavarcasyeva
    bhavati garbhinayo bhavantindriyam vai~ garbha indriyamevasmi mmeshima labheta ya i shvaro vaco vadito
    dvagvai sarasvati sarasvatimeva svena bhagadheyenopa dhavati saivasmi ndadhati pravadita vaco bhavatyapannadati
    bhavati tasma nkrishnagrivama labheta saumya njyogamayavyagnim ngacchati somagm raso yasya jyogamayatyagnerevasya
    sharira nnishkrinati soma drasamuta yaditasurbhavati jivatyeva saumya vai retodha agnih prajana mprajanayita
    soma evasmai reto dadha mprajanayati vindate nkrishnagrivama labheta saumya hmano vidyamanucya na
    viroceta yada gneyo bhavati teja evasmi thsaumyo brahmavarcasa ntena krishnagriva agneyo bhavati tama
    evasmadapa hanti shveto bhavati ssaumyo bhavati brahmavarcasamevasmi nkrishnagrivama labheta saumya
    mpurodhayag spardhamana agneyo vai bra ssaumyo rajanyo stejasaiva brahmanobhayato rashtra mpari grihnatyekadha
    sama vrinkte pura ena va~shamadityebhyah kamaya devasura eshu lokeshvaspardhanta sa etam svayai devataya
    a 'labhata tato vai sa imam va~manama labheta spardhamano vishnureva bhutveman ~lokanabhi jayati vishama
    a labheta vishama iva hime loka ssamriddhya indraya manyumate manasvate lalama mprashringama labheta
    sangrame ya~tta indriyena vai manyuna manasa sangrama njayatindrameva manyumanta mmanasvantagg svena
    bhagadheyenopa dhavati sa evasminnindriya mmano dadhati jayati tagm sagrammamindraya marutvate prishnisakthama
    labheta gramakama indrameva marutvantagg svena bhagadheyenopa dhavati sa evasmai sa jata nprayacchati
    gramyeva bhavati yadrishabhastenai tprishnistena maruta tprishnisaktho bhavati pashcadanva vasayinimevasmai
    visha mbabhruma labhetannakama va~ annagm somameva svena bhagadheyenopa dhavati sa evasma anna mprayacchatyannada
    eva bhavati babhrurbhavatyetadva annasya rupagm samriddhyai saumya mbabhruma labheta yamalagm rajyaya
    santagm rajya vai~ rajyagm somameva svena bhagadheyenopa dhavati sa evasmai rajya mprayacchatyupainagm
    rajya nnamati babhrurbhavatyeta dvai somasya rupagm samriddhya indraya vritrature lalama mprashringama
    labheta gatashrih pratishthakamah papmanameva vritra ntirtva pratishtha ngacchatindrayabhimatighne
    lalama labheta yah papmana labheta yah papmana grihita tpapma va abhimatirindrameva bhimatihanagg
    svena bhagadheyenopa dhavati sa evasma tpapmanamabhimati mpranudata indraya vajrine lalama mprashringama
    labheta yamalagm rajyaya santagm rajya nnopanamedindrameva vajrinagg svena bhagadheyenopa dhavati
    sa evasmai vajra mpra yacchati sa enam ~vajro bhutya indha upainagm rajya nnamati lalamah prashringo
    bhavatyetadvai vajrasya rupagm samriddhyai || asavadityo na vyarocata tasmai devah prayashcittimaiccha
    'labhanta tayaivasmi nrucamadadhuryo brahmavarcasakama svena bhagadheyenopa dhavati sa evasmi ndadhati
    brahmavarcasyeva bhavati vasanta pratastrin ~lalamana labheta grishme maddhyandine trinchiti prishthancharadyaparahne
    trinchiti prishthancharadyaparahne trinchitivara ntrini va adityasya tejagmsi vasanta pratargrishme
    maddhyandine sharadyaparahne yavantyeva tejagmsi tanyevava rundhe trayastraya a labhyante 'bhi purvamevasmi
    mparyalabhyante sam va~thsaro vai brahmavarcasasya pradata sam mpra yacchati brahmavarcasyeva bhavati
    sam ma labheta prajapati ssarva devata devata sveva pratitishthati yadi bibhiya ddushcarma bhavishyamiti
    somapaushnagg shyamama labheta saumyo vai devataya purushah paushnah pashava ssvayaivasmai devataya
    pashubhistvaca nkaroti na dushcarma bhavati devashca vai yamashcasmin ~loke 'spardhanta sa yamo devanamindriyam
    vi~ryamayuvata tadyamasya nte deva amanyanta yamo va idamabhu sma iti te prajapatimupadhavan thsa
    etau prajapatiratmana ukshavashau niramimita te deva vai 'labhantaindramukshanantam va~runenaiva grahayitva
    vishnuna yajnena pranudantaindrenai vrinjata yo bhratrivyavan thsa spardhamano vaishnavarunim ~vashama
    labhetaindramukshanam va~runenaiva bhratrivya ngrahayitva vishnuna yajnena pranudata aindrenaivasye
    vri~nkte bhavatyatmana para sya bhratrivyo bhavatindro vritramaha ttasya vritrasya shir 'manyata yo
    va imamalabheta mucyetasma nkrishnagrivama labhataindramrishabha ntasyagnireva svena bhagadheyenopa
    srita shshodashadha vritrasya bhoganapyadahadaindrene matmannadhatta yah papmana grihita nkrishnagrivama
    labhetaindramrishabha magnirevasya svena bhagadheyenopasritah papmanamapi dahatyaindrene ndhatte mucyate
    papmano bhavatyeva dyavaprithivya ndhenuma labheta jyogaparuddho 'nayorhi va esho 'thaisha jyogaparuddho
    dyavaprithivi eva svena bhagadheyenopa dhavati te evaina ngamayatah pratyeva tishthati paryarini bhavati
    paryariva hyetasya rashtram ssamriddhyai vayavyam ~vathsama labheta vayurva anayo rvathsa ime va etasmai
    loka apashushka vidapashushka 'thaisha jyogaparuddho vayumeva svena bhagadheyenopa dhavati sa evasma
    imam mpradapayati prasma ime loka ssnuvantibhunjatyenam spardhamano vaishnavarunim 'sya svena bhagadheyenopasrito
    indro valasya bilamapau thsa ya uttamah pashurasi mprati sagrimhyodakkhida thsa etamaindramunnatama
    labhetendrameva svena bhagadheyenopa dhavati sa evasmai pashu nprayacchati pashumaneva bhavatyunnato
    bhavati sahasri va esha lakshmi yadunnato lakshmiyai va pashunava rundhe yada sahasra va~ manama labhetaitasmin
    thsahasramaddhyatishtha ssamishitah pashubhya eva prajatebhyah pratishtha npraptumityahu rahoratranyeva
    sahasragm sampadya va ahoratrani pashuneva prajata tyoshadhibhyo vehatama labheta prajakama oshadhayo
    va eta mprajayai paribadhante yo nna vindata oshadhayah khalu va etasyai sutumapi ghnanti ya veha
    dbhavatyoshadhireva svena bhagadheyenopa dhavati ta evasmai svadyoneh mpra janayanti vindate prajamapo
    va oshadhayo tpurusha apa evasma asata ssaddadati tasmadahuryashcaivam ve~da yashca napastvavasata
    tyaindrigm sutavashama labheta bhutikamo nna prapnotindra nkhalu va esha sutva vasha dindrameva svena
    bhagadheyenopa dhavati sa evaina ngamayati bhavatyeva yagm sutva vasha sya '' labhetaitadvava tadindriyagm
    sakshadevendriyamava rundha aindragna thsrishtama labheta ya a tritiya dvicchinno va etasya somapitho
    yo bra nna pibatindragni eva svena bhagadheyenopa dhavati tavevasmai somapitha mprayacchata upainagm
    somapitho namati yadaindro bhavatindriyam vai~ somapitha indriyameva somapithamava rundhe yada gneyo
    bhavatyagneyo vai bra ssvameva devatamanu santanoti punaruth srishto bhavati punaruth srishta iva
    hyetasya ssamriddhyai brahmanaspatya nbrahmanaspatimeva svena bhagadheyenopa dhavati tasma evainama
    vrishcati tajagarti marcchati tuparo bhavati kshurapavirva esha lakshmi ya ssamriddhyai sphyo yupo
    bhavati vajro vai sphyo vajramevasmai praharati sharamaya vai~bhidaka iddhmo bhinattyevaina barhaspatyagm
    shitiprishthama labheta gramakamo yah kamayeta prishthagm samananag syamiti brihaspatimeva svena bhagadheyenopa
    dhavati sa evaina mprishthagm samanana nkaroti gramyeva bhavati shitiprishtho bhavati bar haspatyo
    hyesha devataya samriddhyai paushnagg shyamama labhetannakamo vai~ pusha pushanameva svena bhagadheyenopa
    dhavati sa evasma mpra yacchatyannada eva bhavati shyamo bhavatyetadva annasya rupagm samriddhyai
    maruta vai~ marutomaruta eva svena bhagadheyenopa dhavati ta evasma anna mprayacchantyannada eva bhavati
    prishni rbhavatyetadva annasya rupagm samriddhya aindramarunama labhetendriyakama indrameva svena
    bhagadheyenopa dhavati sa evasminnindriya ndadhatindriyavyeva bhavatyaruno bhruma nbhavatyetadva indrasya
    rupagm samriddhyai savitramupaddhvastama labheta sanikama ssavita vai prasavanamishe savitarameva
    svena bhagadheyenopa dhavati sa evasmai sani mprasuvati danakama asmai praja bhavantyupaddhvasto bhavati
    savitro hyesha devataya samriddhyai devataya samriddhyai vaishvadeva mbahurupama labheta vi~shvaneva
    devan thsvena bhagadheyenopa dhavatita evasma anna mprayacchantyannada eva bhavati bahurupo bhavatibahurupagg
    hyannagm samriddhyai vaishvadeva mbahurupama labheta gramakamo vaishvadeva vai sajata vishvaneva devan
    thsvena bhagadheyenopa dhavati ta eva npra yacchanti gramyeva bhavati bahurupo bhavati bahudevatyo
    hyesha samriddhyai prajapatya ntuparama labheta yasyana jnatamiva jyogamaye tprajapatyo vai purushah
    prajapatih khalu vai tasya veda yasyana jnatamiva jyogamayati prajapatimeva svena bhagadheyenopa dhavati
    sa evaina nmuncati tuparo bhavati prajapatyo hye sha devataya samriddhyai || sajata vishvaneva devan
    thsvena bhagadheyenopa dhavati ta evasmai vashatkaro vai gayatriyai shiro ttasyai rasah parapata sa
    shitiprishtha vasha 'bhavadyo dvitiyah para vupagrihnitagm sa dvirupa vasha dyastritiyah parapata
    vi~shve deva upagrihnan thsa bahurupa vasha bhavadya shcaturthah parapata mbhogayeti sa ukshavasha
    thsa raudri rohini vasha haspatyagm shitiprishthama labheta brahmavarcasakamo brihaspatimeva svena
    bhagadheyenopa dhavati sa evasmi ndadhati brahmavarcasyeva bhavati chandasam va~ esha raso yadvasha
    rasa iva khalu nchandasameva rasena rasa mbrahmavarcasamava rundhe maitravaruni ndvirupama labheta
    vrishtikamo maitram va~ aharvaruni ratrirahoratrabhya nkhalu vai parjanyo var shati mitravarunaveva
    svena bhagadheyenopa dhavati tavevasma ahoratrabhya va~ esha raso yadvasha rasa iva khalu vai vrishti
    shchandasameva rasena vri~shtimava rundhe maitravaruni ndvirupama labheta prajakamo maitram va~ aharvaruni
    ratrirahoratrabhya nkhalu vai prajah prajayante mitravarunaveva svena bhagadheyenopa dhavati tavevasma
    ahoratrabhya va~ esha raso yadvasha rasa iva khalu vai praja chandasameva rasena rasa rundhe vaishvadevim
    mbahurupama labhetannakamo vaishvadevam vi~shvaneva devan thsvena bhagadheyenopa dhavati ta evasma
    annam prayacchantyannada eva bhavati chandasam va~ esha raso yadvasha rasa iva khalu va anna nchandasameva
    rasena rasamannamava rundhe vaishvadevi mbahurupama labheta gramakamo vaishvadeva vai sajata vishvaneva
    devan thsvena bhagadheyenopa dhavati ta evasmai sajata npra yacchanti gramyeva bhavati chandasam va~
    esha raso yadvasha rasa iva khalu vai sajata shchandasameva rasena rasagm sajatanava rundhe bar mukshavashama
    labheta brahmavarcasakamo brihaspatimeva svena bhagadheyenopa dhavati sa eva dadhati brahmavarcasyeva
    dadhati brahmavarcasyeva bhavati vasham va~ esha carati yadukshavasha iva khalu vai brahmavarcasam
    mbrahmavarcasamava rundheraudrigmrohinima labhetabhicara nrudrameva svena bhagadheyenopa dhavati tasma
    evainama vrishcati tajagartimarcchati rohini bhavati raudri hyesha devataya samriddhyai sphyo yupo
    bhavati vajro vai sphyo vajramevasmai pra harati sharamaya vai~bhidaka iddhmo bhinattyevaina ekannavigmshatishca
    asavadityo na vyarocata tasmai devah prayashcittimaiccha ntasma etagm saurig 'labhanta tayaivasmi
    nrucamadadhuryo brahmavarcasakama ttasma etagm saurig va~shama labhetamumeva ''dityagg svena bhagadheyenopa
    dhavati sa evasmi ndadhati brahmavarcasyeva bhavati bail 'jayata tato bilva udatishtha nyeva brahmavarcasamava
    rundhe brahmanaspatya mbabhrukarnima labheta dvarunenaiva bhratrivya ngrahayitva brahmana strinute
    babhrukarni bhavatyetadvai brahmano rupagm samriddhyai sphyo yupo bhavati vajro vai sphyo vajramevasmai
    pra harati sharamaya vai~bhidaka iddhmo bhinattyevainam dvishnurvai yajno vishnumeva svena bhagadheyenopa
    dhavati sa evasmai yajna mpra yacchatyupainam ya~jno namati vamano bhavati vaishnavo hyesha devataya
    samriddhyai tvashtram va~daba ma labheta pashukamastvashta vai pashuna prajanayita tvashtarameva svena
    bhagadheyenopa dhavati sa evasmai pashu npra janayati praja hi va etasmi npashavah pravishta athaisha
    pumanth ssakshadeva praja mpashunava rundhe maitragg shvetama labheta sangrame sam ya~tte samayakamo
    mitrameva svena bhagadheyenopa dhavati sa evaina vishalo bhavati vyavasayayatyevaina nkrishnama labheta
    vrishtikamah prajapatirvai vrishtya ishe prajapatimeva svena bhagadheyenopa dhavati sa evasmai parjanyam
    shayati krishno bhavatyetadvai vrishtyai rupagm rupenaiva vrishtimava rundhe shabalo bhavati vidyutamevasmai
    janayitva var shayatyavashringo bhavati vrishtimevasmai ni yacchati || varunagm sushuvanamannadya
    svayai devataya alabhata tato vai tamanna mannadyaya santamannadya va~shama labheta varunameva svena
    bhagadheyenopa dhavati sa evasma anna mpra yacchatyannada mpra yacchatyannadah eva bhavati krishna
    bhavati varuni hyesha devataya samriddhyai maitragg shvetama labheta varuna va~nnakamo maitrirva oshadhayo
    varunirapo nca khalu va oshadhina nca rasamupa jivamo mitravarunaveva svena bhagadheyenopa dhavati
    tavevasma anna varuddhyaivishakho yupo bhavati dve hyete devate samriddhyai maitragg shvetama labheta
    varuna nmaitro bhavati mitrenaiva 'smai varunagm shamayati ya nmuncatyuta yaditasurbhavati jivatyeva
    deva vai pushti mavayorva esha maitasyam ~vadaddhvamiti sashvinorevabhavadyah pushtikama 'shvinaveva
    svena bhagadheyenopa dhavati tavevasmi ndhattah pushyati prajaya pashubhih || ndhumralalama ma labheta
    yo durbra dashvinau vai devana ntau pashca somapitha vetasya devata yo durbra mpipasatyashvinaveva
    svena bhagadheyenopa dhavati mpra yacchata upainagm somapitho namati ya ddhumro bhavati dhumrimana
    bhavati mukhata evasmi ntejo dadhati vayavya ngomrigama labheta yamajaghnivagm samabhishagm seyuraputa
    va etam va~gricchati yamajaghnivagm samabhishagm santi naisha gramyah pashurnaranyo ya dgomrigo nevaisha
    grame naranye yamajaghnivagm samabhishagm santi vayurvai devana va~yumeva svena bhagadheyenopa dhavati
    sa evai mpavayati paraci va etasmai vyucchanti vyucchati tamah papmana ''shvine shasyamane suryo na
    mbahurupama labheta svena bhagadheyenopa dhavati sa evasma ttamah papmanamapa hanti praticyasmai vyucchanti
    vyucchatyapa tamah papmanagm hate || maruto yaddha vo divo shsharma || bhareshvindragm suhavagm havamahe
    'gmhomucagm sukrita va~runagm sataye bhaga ndyavaprithivi marutah svastaye || mamattu nah parijma
    vasarha mamattu vato apam vri~shanvann | shishitamindraparvata yuva nnastanno vishve varivasyantu
    devah || priya vo nama ttripanmaruto vavashanah || shriyase ka mmimikshire te rashmibhista rikvabhi
    ssukhadayah | te vashimanta ishmino abhiravo vidre priyasya marutasya dhamnah || agnih prathamo vasubhirno
    avya thsomo rudrebhirabhi rakshata tmana | indro marudbhir ritudha krinotvadityairno varuna nno devo
    vasubhiragni somastanubhi rudriyabhih | somastanubhi rudriyabhih | samindro marudbhi ryajniyai ssamadityairno
    varuno ajijnipat || yatha ssamajanatabhi | eva trinamanna hriniyamana vishve deva ssamanaso bhavantu
    || kutra cidyasya samritau ranva naro nrishadane | ar dyamindhate sanjanayanti jantavah || sam ya~disho
    vanamahe sagm havya manushanam | uta dyumnasya shavasa ritasya rashmima dade | ritasya rashmima dade
    || yajno devana mpratyeti sumnamadityaso bhavata mridayantah | a vo 'rvaci sumatirvavrityadagm hoshcidya
    varivovittara ssuyavasa adabdha upa ksheti vriddhavaya ssuvirah | nakishtam ghnantyantito na duradya
    adityana mbhavati pranitau || dharayanta adityaso jagathstha deva vishvasya bhuvanasya gopah | dirghadhiyo
    rakshamana shcayamana rinani || tisro bhumi ntrini vrata vidathe antaresham | ritena ''ditya mahi
    vo mahitva ntadaryaman varuna mitra caru || tyannu kshatriyagm ava adityan yacishamahe | sumridikagm
    abhishtaye || na dakshina vicikite na savya na pracinamaditya nota pashca | pakya cidvasavo dhirya
    ci dyushmanito abhaya njyotirashyam || adityanamavasa nutanena sakshimahi sharmana shantamena | anagastve
    adititve turasa imam ndadhatu shroshamanah || ima mme varuna shrudhi havamadya ca mridaya | tvamavasyura
    cake || tattva yami brahmana vandamana ste yajamano havirbhih | ahedamano varuneha boddhyurushagmsa
    ma na ayuh pramoshih || prajapatista varunam || harih om || || krishna yajurvediya taittiriya samhitaya
    ndvitiyakande prathamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्द्वितीयकाण्डे प्रथमः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
