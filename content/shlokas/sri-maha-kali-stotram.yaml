id: sri-maha-kali-stotram
category: stotram
name:
  english: Sri Maha Kali Stotram
content:
  english: dhyanam shavarudham mahabhimam ghoradamshtram varapradam hasyayuktam trinetranca kapala kartrika
    karam | muktakeshim lalajjihvam pibantim rudhiram muhuh caturbahuyutam devim varabhayakaram smaret
    || shavarudham mahabhimam ghoradamshtram hasanmukhim caturbhujam khadgamundavarabhayakaram shivam
    | mundamaladharam devim lalajjihvam digambaram evam sancintayetkalim shmashanalayavasinim || stotram
    vishveshvarim jagaddhatrim sthitisamharakarinim | nidram bhagavatim vishnoratulam tejasah prabham
    || || tvam svaha tvam svadha tvam hi vashatkarah svaratmika | sudha tvamakshare nitye tridha matratmika
    sthita || || arthamatrasthita nitya yanuccarya visheshatah | tvameva sandhya savitri tvam devi janani
    para || || tvayaitaddharyate vishvam tvayaitadsrijyate jagat | tvayaitatpalyate devi tvamatsyante
    ca sarvada || || visrishtau srishtirupa tvam sthitirupa ca palane | tatha samhritirupante jagato'sya
    jaganmaye || || mahavidya mahamaya mahamedha mahasmritih | mahamoha ca bhavati mahadevi maheshvari
    || || prakritistvam ca sarvasya gunatrayavibhavini | kalaratrirmaharatrirmoharatrishca daruna || ||
    tvam shristvamishvari tvam hristvam buddhirbodhalakshana | lajja pushtistatha tushtistvam shantih
    kshantireva ca || || khadgini shulini ghora gadini cakrini tatha | shankhini capini banabhushundiparighayudha
    || || saumya saumyatarashesha saumyebhyastvatisundari | paraparanam parama tvameva parameshvari ||
    || yacca kincit kvacidvastu sadasadvakhilatmike | tasya sarvasya ya shaktih sa tvam kim stuyase tada
    || || yaya tvaya jagatsrashta jagatpatyatti yo jagat | so'pi nidravasham nitah kastvam stotumiheshvarah
    || || vishnuh shariragrahanamahamishana eva ca | karitaste yato'tastvam kah stotum shaktiman bhavet
    || || sa tvamittham prabhavaih svairudarairdevi samstuta | mohayaitau duradharshavasurau madhukaitabhau
    || || prabodham ca jagatsvami niyatamacyuto laghu | bodhashca kriyatamasya hantumetau mahasurau ||
    || iti shri mahakali stotram |
  devanagari: ध्यानम् शवारूढां महाभीमां घोरदंष्ट्रां वरप्रदां हास्ययुक्तां त्रिणेत्राञ्च कपाल कर्त्रिका
    कराम् । मुक्तकेशीं ललज्जिह्वां पिबन्तीं रुधिरं मुहुः चतुर्बाहुयुतां देवीं वराभयकरां स्मरेत् ॥ शवारूढां
    महाभीमां घोरदंष्ट्रां हसन्मुखीं चतुर्भुजां खड्गमुण्डवराभयकरां शिवाम् । मुण्डमालाधरां देवीं ललज्जिह्वां
    दिगम्बरां एवं सञ्चिन्तयेत्कालीं श्मशनालयवासिनीम् ॥ स्तोत्रम् विश्वेश्वरीं जगद्धात्रीं स्थितिसंहारकारिणीम्
    । निद्रां भगवतीं विष्णोरतुलां तेजसः प्रभाम् ॥ ॥ त्वं स्वाहा त्वं स्वधा त्वं हि वषट्कारः स्वरात्मिका
    । सुधा त्वमक्षरे नित्ये त्रिधा मात्रात्मिका स्थिता ॥ ॥ अर्थमात्रास्थिता नित्या यानुच्चार्या विशेषतः
    । त्वमेव सन्ध्या सावित्री त्वं देवी जननी परा ॥ ॥ त्वयैतद्धार्यते विश्वं त्वयैतद्सृज्यते जगत् । त्वयैतत्पाल्यते
    देवि त्वमत्स्यन्ते च सर्वदा ॥ ॥ विसृष्टौ सृष्टिरूपा त्वं स्थितिरूपा च पालने । तथा संहृतिरूपान्ते जगतोऽस्य
    जगन्मये ॥ ॥ महाविद्या महामाया महामेधा महास्मृतिः । महामोहा च भवती महादेवी महेश्वरी ॥ ॥ प्रकृतिस्त्वं
    च सर्वस्य गुणत्रयविभाविनी । कालरात्रिर्महारात्रिर्मोहरात्रिश्च दारुणा ॥ ॥ त्वं श्रीस्त्वमीश्वरी त्वं
    ह्रीस्त्वं बुद्धिर्बोधलक्षणा । लज्जा पुष्टिस्तथा तुष्टिस्त्वं शान्तिः क्षान्तिरेव च ॥ ॥ खड्गिनी शूलिनी
    घोरा गदिनी चक्रिणी तथा । शङ्खिनी चापिनी बाणभुशुण्डीपरिघायुधा ॥ ॥ सौम्या सौम्यतराशेषा सौम्येभ्यस्त्वतिसुन्दरी
    । परापराणां परमा त्वमेव परमेश्वरी ॥ ॥ यच्च किञ्चित् क्वचिद्वस्तु सदसद्वाखिलात्मिके । तस्य सर्वस्य
    या शक्तिः सा त्वं किं स्तूयसे तदा ॥ ॥ यया त्वया जगत्स्रष्टा जगत्पात्यत्ति यो जगत् । सोऽपि निद्रावशं
    नीतः कस्त्वां स्तोतुमिहेश्वरः ॥ ॥ विष्णुः शरीरग्रहणमहमीशान एव च । कारितास्ते यतोऽतस्त्वां कः स्तोतुं
    शक्तिमान् भवेत् ॥ ॥ सा त्वमित्थं प्रभावैः स्वैरुदारैर्देवि संस्तुता । मोहयैतौ दुराधर्षावसुरौ मधुकैटभौ
    ॥ ॥ प्रबोधं च जगत्स्वामी नीयतामच्युतो लघु । बोधश्च क्रियतामस्य हन्तुमेतौ महासुरौ ॥ ॥ इति श्री महाकाली
    स्तोत्रम् ।
