id: surabhikritamshrikrishnastotram
category: stotram
name:
  english: surabhikritamshrikrishnastotram
  devanagari: सुरभिकृतंश्रीकृष्णस्तोत्रम्
content:
  english: surabhikritam shrikrishnastotram surabhiruvaca | krishna krishna mahayogin vishvatman vishvasambhava
    | bhavata lokanathena sanatha vayamacyuta || 19|| tvam nah paramakam daivam tvam na indro jagatpate
    | bhavaya bhava govipradevanam ye ca sadhavah || 20|| indram nastvabhishekshyamo brahmana nodita vayam
    | avatirno'si vishvatman bhumerbharapanuttaye || 21|| iti shrimadbhagavatamahapurane dashamaskandhe
    purvardhe saptavimshadhyayantargatam surabhikritam shrikrishnastotram samaptam | bhagavatapurana |
    adhyaya 10
  devanagari: सुरभिकृतं श्रीकृष्णस्तोत्रम् सुरभिरुवाच । कृष्ण कृष्ण महायोगिन् विश्वात्मन् विश्वसम्भव ।
    भवता लोकनाथेन सनाथा वयमच्युत ॥ १९॥ त्वं नः परमकं दैवं त्वं न इन्द्रो जगत्पते । भवाय भव गोविप्रदेवानां
    ये च साधवः ॥ २०॥ इन्द्रं नस्त्वाभिषेक्ष्यामो ब्रह्मणा नोदिता वयम् । अवतीर्णोऽसि विश्वात्मन् भूमेर्भारापनुत्तये
    ॥ २१॥ इति श्रीमद्भागवतमहापुराणे दशमस्कन्धे पूर्वार्धे सप्तविंशाध्यायान्तर्गतं सुरभिकृतं श्रीकृष्णस्तोत्रं
    समाप्तम् । भागवतपुराण । अध्याय १०
meaning: {}
