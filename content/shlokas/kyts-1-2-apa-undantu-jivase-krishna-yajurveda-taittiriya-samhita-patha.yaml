id: kyts-1-2-apa-undantu-jivase-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 1.2 Apa Undantu Jivase - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mprathamakande dvitiyah prashnah shri gurubhyo namah
    | harih om || apa undantu jivase dirghayutvaya varcasa oshadhe trayasvainagg svadhite mainagm higmsi
    rdevashruretani pra vape svastyuttaranyashiyapo asma nmatarah shundhantu ghritena no ghritapuvah punantu
    vishvamasma tpra vahantu ripramuda shshucira puta emi somasya tanurasi tanuva 'si varcodha asi varco
    mayi dhehi vritrasya mayi dhehi vritrasya kaninika 'si cakshushpa asi cakshurme pahi citpatistva punatu
    vakpatistva punatu devastva savita punatvacchidrena pavitrena vaso ssuryasya rashmibhistasya te pavitrapate
    pavitrena yasmai ka mpune tacchakeyama vo devasa imahe satyadharmano addhvare yadvo devasa agure yajniyaso
    havamaha indra gni dyavaprithivi apa oshadhi stva madhipatirasiha ma santa 'gnaye svaha medhayai manase
    'gnaye svaha dikshayai tapase 'gnaye svaha sarasvatyai pushne rvishvashambhuvo dyavaprithivi urvantariksha
    mbrihaspatirno havisha vridhatu svaha vishve devasya neturmarto vrinita sakhyam vi~shve raya ishuddhyasi
    dyumnam vri~nita pushyase svaharkhsamayo sthaste vama rabhe te ma 'sya yajnasyodrica ima ndhiyagm
    shikshamanasya deva kratu va~runa sagm shishadhi yaya 'ti vishva durita tarema sutarmanamadhi navagm
    ruhemorgasyangirasyurnamrada urja mme yaccha pahi ma ma ma higmsi shsharmasi sharma yajamanasya sharma
    me yaccha nakshatrana tpahindrasya yonirasi ma ma higmsih krishyai tva susasyayai supippalabhya ssupastha
    devo vanaspatirurdhvo ma pahyodrica mmanasa svaha dyavaprithivibhyag svahoro mabhishtaye varcodham
    ya~jnavahasagm supara no asa | ye deva manojata manoyujah sudaksha dakshapitaraste nah pantu te no
    'vantu tebhyo namastebhya 'gne tvagm su jagrihi vayagm su mandishimahi gopaya nah svastaye prabudhe
    nah punardadah | tvamagne vratapa asi deva a martyeshva | tvam yajneshvidyah || vishve deva abhi mama
    npusha sanya somo radhasa deva rvasudava rasveya thsoma ''bhuyo bhara ma prina npurtya vi radhi ma
    'hamayusha candramasi mama bhogaya bhava vastramasi mama bhogaya bhavosra 'si mama bhogaya bhava hayo
    'si mama bhogaya bhava mesho 'si mama bhogaya bhava vayave tva varunaya tva nir rityai tva rudraya
    tva devirapo apa havishya indriyava 'va kramishamacchinna mprithivya anu gesha mbhadradabhi shreyah
    prehi brihaspatih puraeta te astvathemava sya vara a prithivya are shatru n krinuhi sarvavira edamaganma
    devayajana mprithivya vishve deva yadajushanta purva rikhsamabhyam ya~jusha santaranto rayasposhena
    samisha madema || nte shukra tanuridam ngaccha jurasi dhrita manasa jushta vishnave tasya ste satyasavasah
    prasave vaco yantramashiya svaha shukramasyamritamasi vaishvadevagm havi ssuryasya cakshura 'ruhamagne
    rakshnah kaninikam ya~detashebhiriyase bhrajamano vipashcita cidasi mana 'si dhirasi dakshina 'si
    kshatriya 'syaditi ssupraci supratici sa mbhava mitrastva padi baddhnatu pusha 'ddhvanah patvindraya
    ddhyakshayanu tva mata manyatamanu pita 'nu bhrata sagarbhyo ssa devi devamacchehindraya somagm rudrastva
    ''vartayatu mitrasya patha svasti somasakha punarehi saha rayya || 'si brihaspatistva sumne ranvatu
    rudro vasubhira ciketu prithivyastva murdhanna jigharmi devayajana idayah pade ghritavati svaha parilikhitagm
    rakshah parilikhita arataya idamahagm rakshaso griva api krintami yo ndvishma idamasya griva api krintamyasme
    rayastve rayastote raya ndevi devyorvashya pashyasva tvashtimati te sapeya sureta reto dadhana viram
    vi~deya tava sandrishi ma 'hagmrayasposhena vi yosham || ekanna trigmshacca agmshuna te agmshuh pricyata
    rgandhaste kamamavatu madaya raso acyuto 'matyo 'si shukraste graho ndevagm savitaramunyoh kavikratumarcami
    satyasavasagm ratnadhamabhi priya mmatimurdhva yasyamatirbha adidyuta thsavimani hiranyapaniramimita
    sukratuh kripa suvah | prajabhyastva pranaya tva vyanaya tva prajastvamanu pranihi prajastvamanu pranantu
    || nte krinamyurjasvanta nte shukrena krinami candra ncandrenamritamamritena samyatte gorasme candrani
    tapasastanurasi prajapate mpushyantyashcaramena pashuna krinamyasme te bandhurmayi te rayah shrayantamasme
    jyotih somavikrayini tamo mitro na ehi sumitradha indrasyoru ma visha dakshina mushannushantagg syona
    svana bhrajanghare bambhare hasta suhasta krishanavete vah soma krayanasta udayusha svayushodoshadhinagm
    raseno tparjanyasya shushmenodasthamamritagm anu | urvantarikshamanvihyaditya ssada a sidastabhna
    ddyamrishabho antarikshamamimita varimana dvishva bhuvanani samra dvishvettani varunasya vratani vaneshu
    vyantariksha ntatana vajamarvathsu payo aghniyasu hrithsu va~runo vikshvagni thsomamadravudutya va~hanti
    ketavah | drishe vishvaya surya shahavanashru avirahanau brahmacodanau varunasya skambhanamasi varunasya
    skambhasarjanamasi pratyasto varunasya pashah || pra cyavasva bhuvaspate vishva nyabhi dhamani ma
    tva paripari vidanma tva paripanthino vidanma tva vrika aghayavo ma gandharvo vishvavasura daghacchyeno
    bhutva para pata yajamanasya no grihe devai ya~jamanasya svastyayanyasyapi panthamagasmahi svastiga
    ye~na vishvah pari dvisho vrinakti vindate vasu namo mitrasya varunasya cakshase maho devaya tadritagm
    saparyata duredrishe devajataya ketave divasputraya suryaya shagmsata varunasya skambhanamasi varunasya
    skambhasarjana masyunmukto varunasya pashah || ratithyamasi vishnave tva somasya ''tithyamasi vishnave
    tva 'titheratithyamasi vishnave tva nne vishnave tva shyenaya tva somabhrite vishnave tva ya te dhamani
    havisha yajanti ta te vishva paribhurastu yajna ngayasphanah pratarana 'viraha pracara soma duryanaditya
    'si dhritavrato varunamasi sham rdevanagm sakhyanma devana shchithsmahyapataye tva grihnami paripataye
    tva grihnami tanunaptre tva grihnami shakvaraya tva grihnami shakmannojishthaya tva grihnamya 'bhishastipa
    anabhishaste rmanyatamanu tapastapaspatiranjasa satyamupa geshagm suvite ma dhah || agmshuragmshuste
    deva soma mindrayaikadhanavida a tubhyamindrah pyayatama tvamindraya pyayasva svasti te deva soma
    sutyamashiyeshta rayah preshe bhagayartamritavadibhyo namo dive namah prithivya agne vra~tapatirasi
    ya mama tanuresha sa tvayi || ya tava tanuriyagm sa mayi saha nau rvratani ya te agne rudriya tanustaya
    nah pahi tasya ste svaha ya te agne 'yashaya rajashaya harashaya tanurvar va~co apavadhig svaha 'syavatanma
    nathitamavatanma vyathitam vi~deragnirnabho namagne angiro yo mprithivyamasyayusha namnehi yatte 'gne
    angiro yo dvitiyasya masyayusha namnehi yatte ''dadhe sigmhirasi mahishirasyuru prathasvoru te yajnapatih
    prathata 'si devebhyah shundhasva devebhyah shumbhasvendraghoshastva vasubhih purasta tpatu manojavastva
    pitribhi rdakshinatah patu pracetastva rudraih pashca tpatu vishvakarma tva ''dityairuttaratah patu
    sigmhirasi sapatnasahi svaha sigmhirasi suprajavani asi rayasposhavani ssvaha sigmhirasyadityavani
    ssvaha sigmhirasya vaha devandevayate yajamanaya svaha bhutebhyastva vishvayurasi prithivi ndrigmha
    dhruvakshidasyantariksha ndrigmhacyutakshidasi diva syagneh purishamasi || ssvaha sigmsih yunjate
    mana uta yunjate dhiyo vipra viprasya brihato vipashcitah | vi hotra dadhe vayunavideka inmahi devasya
    savituh parishtutih || suvagdeva duryagm a vada devashrutau deveshva ghoshethama no viro jayata nkarmanyo
    yagm sarve 'nu jivama yo bahunamasadvashi || idam rvicakrame tredha ni dadhe padam || samudhamasya
    pagmsura iravati dhenumati hi bhutagm suyavasini manave yashasye drodasi vishnurete dadhara prithivimabhito
    mayukhaih || praci pretamaddhvara nkalpayanti urdhvam nprithivya divo va vishnavuta va prithivya maho
    va vishnavuta va 'ntarikshaddhastau prinasva bahubhi rvasavyaira pra yaccha dakshinadota savyat |
    vishnornukam vi~ryani pra vocam yah ~parthivani vimame rajagmsi yo askabhayaduttaragm sadhastham vi~cakramana
    stredhorugayo vishno raratamasi vishnoh rdhruvamasi vaishnavamasi vishnave tva || yacchaikanna catvarigmshacca
    krinushva pajah prasitinna prithvim ya~hi rajevamavagm ibhena | trishvimanu prasitim 'si viddhya rakshasa
    stapishthaih || tava bhramasa ashuya pantatyanu sprisha dhrishata shoshucanah | tapugshyagne juhva
    patanganasandito visrija vishvagulkah || pratispasho visrija turnitamo bhava payurvisho asya adabdhah
    | yo no dure aghashagmso yo antyagne makishte vyathira dadhar shit || udagne tishtha pratya ''tanushva
    nyamitragm oshata ttigmahete | yo no aratigm samidhana cakre nica ta m || urdhvo bhava pratividdhya
    'ddhyasmadavishkrinushva daivya nyagne | avasthira tanuhi yatujuna njamimajamim pramrinihi shatrun
    || sa te ya~vishthaya ivate brahmane gatumairat | vishva nyasmai sudinani rayo dyumnanyaryo viduro
    abhi dyau t || sedagne astu subhagah sudanu ryastva nityena havishaya ukthaih | piprishati sva ayushi
    durone vishvedasmai sudina sa 'sadishtih || arcami te sumati sante va va ta jarata stva suratha marjayemasme
    kshatrani dharayeranu dyun || iha tva bhurya care dupatma rdidivagmsamanu dyun | kridantastva sumanasa
    ssapemabhi dyumna tasthivagmso jananam || yastva svashvah suhiranyo agna upayati vasumata rathena
    | tasya trata bhavasi tasya sakha yasta atithyamanushag jujoshat || maho rujami bandhuta vacobhistanma
    piturgotamada nviyaya | tvanno asya vacasa shcikiddhi hotaryavishtha sukrato damunah || asvapnaja
    staranaya ssusheva atandraso 'vrika ashramishthah | te payavah saddhriyanco nishadya 'gne tavanah
    pantvamura || ye payavo mamateya nte agne pashyanto andha nduritadarakshann | rarakshatan thsukrito
    vishvaveda diphsanta idripavo na ha debhuh || tvaya vayagm sadhanya tyashyama vajan | ubha shagmsa
    sudaya satyatate 'nushthuya krinuhyahrayana || aya te agne samidha vidhema pratistomagm shasyamana
    ngribhaya | dahashaso rakshasah pahyasma ndruho nido mitramaho avadyat || rakshohanam ~vajinamajigharmi
    mitra mupayami sharma | shishano agnih kratubhi ssamiddhassano diva m || vijyotisha brihata bha rvishvani
    krinute mahitva | pradevi shshishite shringe rakshase vinikshe || uta svanaso divishantvagne stigmayudha
    rakshase hantava u | made cidasya prarujanti bhama na varante paribadho adevih || vasvyasyagm shuna
    te shcatustrigmshat | || harih om || || krishna yajurvediya taittiriya samhitaya mprathamakande dvitiyah
    prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्प्रथमकाण्डे द्वितीयः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ आप॑ उन्दन्तु जी॒वसे॑ दीर्घायु॒त्वाय॒ वर्च॑स॒ ओष॑धे॒ त्राय॑स्वैन॒ग्ग्॒ स्वधि॑ते॒ मैनग्ं॑ हिग्ंसी
    र्देव॒श्रूरे॒तानि॒ प्र व॑पे स्व॒स्त्युत्त॑राण्यशी॒यापो॑ अ॒स्मा न्मा॒तरः॑ शुन्धन्तु घृ॒तेन॑ नो घृत॒पुवः॑
    पुनन्तु॒ विश्व॑म॒स्म त्प्र व॑हन्तु रि॒प्रमुदा श्शुचि॒रा पू॒त ए॑मि॒ सोम॑स्य त॒नूर॑सि त॒नुव॑ ऽसि वर्चो॒धा
    अ॑सि॒ वर्चो॒ मयि॑ धेहि वृ॒त्रस्य॑ मयि॑ धेहि वृ॒त्रस्य॑ क॒नीनि॑का ऽसि चक्षु॒ष्पा अ॑सि॒ चक्षु॑र्मे पाहि
    चि॒त्पति॑स्त्वा पुनातु वा॒क्पति॑स्त्वा पुनातु दे॒वस्त्वा॑ सवि॒ता पु॑ना॒त्वच्छि॑द्रेण प॒वित्रे॑ण॒ वसो॒
    स्सूर्य॑स्य र॒श्मिभि॒स्तस्य॑ ते पवित्रपते प॒वित्रे॑ण॒ यस्मै॒ क म्पु॒ने तच्छ॑केय॒मा वो॑ देवास ईमहे॒
    सत्य॑धर्माणो अद्ध्व॒रे यद्वो॑ देवास आगु॒रे यज्ञि॑यासो॒ हवा॑मह॒ इन्द्रा ग्नी॒ द्यावा॑पृथिवी॒ आप॑ ओषधी॒
    स्त्व मधि॑पतिरसी॒ह मा॒ सन्त॑ ऽग्नये॒ स्वाहा॑ मे॒धायै॒ मन॑से॒ ऽग्नये॒ स्वाहा॑ दी॒क्षायै॒ तप॑से॒ ऽग्नये॒
    स्वाहा॒ सर॑स्वत्यै पू॒ष्णे र्विश्वशम्भुवो॒ द्यावा॑पृथि॒वी उ॒र्व॑न्तरि॑क्ष॒ म्बृह॒स्पति॑र्नो ह॒विषा॑
    वृधातु॒ स्वाहा॒ विश्वे॑ दे॒वस्य॑ ने॒तुर्मर्तो॑ वृणीत स॒ख्यं विँश्वे॑ रा॒य इ॑षुद्ध्यसि द्यु॒म्नं वृँ॑णीत
    पु॒ष्यसे॒ स्वाह॑र्ख्सा॒मयो॒ स्थ॒स्ते वा॒मा र॑भे॒ ते मा॑ ऽस्य य॒ज्ञस्यो॒दृच॑ इ॒मा न्धिय॒ग्ं॒ शिक्ष॑माणस्य
    देव॒ क्रतु॒ वँरुण॒ सग्ं शि॑शाधि॒ यया ऽति॒ विश्वा॑ दुरि॒ता तरे॑म सु॒तर्मा॑ण॒मधि॒ नावग्ं॑ रुहे॒मोर्ग॑स्याङ्गिर॒स्यूर्ण॑म्रदा॒
    ऊर्ज॑ म्मे यच्छ पा॒हि मा॒ मा मा॑ हिग्ंसी॒ श्शर्मा॑सि॒ शर्म॒ यज॑मानस्य॒ शर्म॑ मे यच्छ॒ नक्ष॑त्राणा
    त्पा॒हीन्द्र॑स्य॒ योनि॑रसि॒ मा मा॑ हिग्ंसीः कृ॒ष्यै त्वा॑ सुस॒स्यायै॑ सुपिप्प॒लाभ्य॒ स्सूप॒स्था दे॒वो
    वन॒स्पति॑रू॒र्ध्वो मा॑ पा॒ह्योदृच॒ म्मन॑सा॒ स्वाहा॒ द्यावा॑पृथि॒वीभ्या॒ग्॒ स्वाहो॒रो म॒भिष्ट॑ये वर्चो॒धां
    यँ॒ज्ञवा॑हसग्ं सुपा॒रा नो॑ अस॒ । ये दे॒वा मनो॑जाता मनो॒युजः॑ सु॒दक्षा॒ दक्ष॑पितार॒स्ते नः॑ पान्तु॒
    ते नो॑ ऽवन्तु॒ तेभ्यो॒ नम॒स्तेभ्य॒ ऽग्ने॒ त्वग्ं सु जा॑गृहि व॒यग्ं सु म॑न्दिषीमहि गोपा॒य नः॑ स्व॒स्तये
    प्र॒बुधे॑ नः॒ पुन॑र्ददः । त्वम॑ग्ने व्रत॒पा अ॑सि दे॒व आ मर्त्ये॒ष्वा । त्वं य॒ज्ञेष्वीड्यः॑ ॥ विश्वे॑
    दे॒वा अ॒भि मामा न्पू॒षा स॒न्या सोमो॒ राध॑सा दे॒व र्वसु॒दावा॒ रास्वेय॑ थ्सो॒मा ऽऽभूयो॑ भर॒ मा पृ॒ण
    न्पू॒र्त्या वि रा॑धि॒ मा ऽहमायु॑षा च॒न्द्रम॑सि॒ मम॒ भोगा॑य भव॒ वस्त्र॑मसि॒ मम॒ भोगा॑य भवो॒स्रा ऽसि॒
    मम॒ भोगा॑य भव॒ हयो॑ ऽसि॒ मम॒ भोगा॑य भव मे॒षो॑ ऽसि॒ मम॒ भोगा॑य भव वा॒यवे त्वा॒ वरु॑णाय त्वा॒ निर् ऋ॑त्यै
    त्वा रु॒द्राय॑ त्वा॒ देवी॑रापो अपा ह॑वि॒ष्य॑ इन्द्रि॒यावा ऽव॑ क्रमिष॒मच्छि॑न्न॒ म्पृथि॒व्या अनु॑ गेष
    म्भ॒द्राद॒भि श्रेयः॒ प्रेहि॒ बृह॒स्पतिः॑ पुरए॒ता ते॑ अ॒स्त्वथे॒मव॑ स्य॒ वर॒ आ पृ॑थि॒व्या आ॒रे शत्रू
    न् कृणुहि॒ सर्व॑वीर॒ एदम॑गन्म देव॒यज॑न म्पृथि॒व्या विश्वे॑ दे॒वा यदजु॑षन्त॒ पूर्व॑ ऋख्सा॒माभ्यां॒
    यँजु॑षा स॒न्तर॑न्तो रा॒यस्पोषे॑ण॒ समि॒षा म॑देम ॥ न्ते॑ शुक्र त॒नूरि॒दं ङ्गच्छ॒ जूर॑सि धृ॒ता मन॑सा॒
    जुष्टा॒ विष्ण॑वे॒ तस्या स्ते स॒त्यस॑वसः प्रस॒वे वा॒चो य॒न्त्रम॑शीय॒ स्वाहा॑ शु॒क्रम॑स्य॒मृत॑मसि वैश्वदे॒वग्ं
    ह॒वि स्सूर्य॑स्य॒ चक्षु॒रा ऽरु॑हम॒ग्ने र॒क्ष्णः क॒नीनि॑कां॒ यँदेत॑शेभि॒रीय॑से॒ भ्राज॑मानो विप॒श्चिता॒
    चिद॑सि म॒ना ऽसि॒ धीर॑सि॒ दक्षि॑णा ऽसि क्ष॒त्रिया॒ ऽस्यदि॑ति स्सुप्रा॑ची॒ सुप्र॑तीची॒ स म्भ॑व मि॒त्रस्त्वा॑
