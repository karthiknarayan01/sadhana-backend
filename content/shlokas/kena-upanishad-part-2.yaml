id: kena-upanishad-part-2
category: stotram
name:
  english: Kena Upanishad - Part 2
content:
  english: yadi manyase suvedeti daharamevapi nuna ve~ttha brahmano rupam | yadasya tvam ya~dasya deveshvatha
    nu mimamsyameva te manye viditam || mmanye suvedeti no na vedeti veda ca | yo nastadveda tadveda no
    na vedeti veda ca || ya~sya na veda sah | avijnatam vi~jnatamavijanatam || mmatamamritatvam hi vindate
    | atmana vindate viryam || iha cedavedidatha satyamasti na cedihavedinmahati vinashtih | bhuteshu
    bhuteshu vicitya dhirah pretyasmallokadamrita bhavanti || || || iti kenopanishadi dvitiyah khandah
    ||
  devanagari: यदि मन्यसे सुवेदेति दहरमेवापि नून वेँत्थ ब्रह्मणो रूपम् । यदस्य त्वं यँदस्य देवेष्वथ नु
    मीमाम्स्यमेव ते मन्ये विदितम् ॥ म्मन्ये सुवेदेति नो न वेदेति वेद च । यो नस्तद्वेद तद्वेद नो न वेदेति
    वेद च ॥ यँस्य न वेद सः । अविज्ञातं विँज्ञातमविजानताम् ॥ म्मतममृतत्वं हि विन्दते । आत्मना विन्दते वीर्यं
    ॥ इह चेदवेदीदथ सत्यमस्ति न चेदिहावेदीन्महती विनष्टिः । भूतेषु भूतेषु विचित्य धीराः प्रेत्यास्माल्लोकादमृता
    भवन्ति ॥ ॥ ॥ इति केनोपनिषदि द्वितीयः खण्डः ॥
