id: namavali-33
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: bhuvaneshvaryashtottarashatanamavalih ishvarokta shribhuvaneshvaryashtottarashatanamavalih
    | shrimahasammohinyai namah | shridevyai namah | shrisundaryai namah | shribhuvaneshvaryai namah |
    shriekaksharyai namah | shriekamantryai namah | shriekakyai namah | shrilokanayikayai namah | shriekarupayai
    namah | shrimaharupayai namah | 10 shristhulasukshmasharirinyai namah | shribijarupayai namah | shrimahashaktyai
    namah | shrisangrame jayavardhinyai namah | shrimaharatyai namah | shrimahashaktyai namah | shriyoginyai
    namah | shripapanashinyai namah | shriashtasiddhyai namah | shrikalarupayai namah | 20 shrivaishnavyai
    namah | shribhadrakalikayai namah | shribhaktipriyayai namah | shrimahadevyai namah | shriharibrahmayai
    namah | shriadirupinyai namah | shrishivarupyai namah | shrivishnurupyai namah | shrikalarupyai namah
    | shrisukhasinyai namah | 30 shripuranyai namah | shripunyarupayai namah | shriparvatyai namah | shripunyavardhinyai
    namah | shrirudranyai namah | shriparvatindranyai namah | shrishankarardhasharirinyai namah | shrinarayanyai
    namah | shrimahadevyai namah | shrimahishyai namah | 40 shrisarvamangalayai namah | shriakaradikshakarantayai
    namah | shrihyashtatrimshatkaladharyai namah | shrisaptamayai namah | shritrigunayai namah | shrinaryai
    namah | shrisharirotpattikarinyai namah | shriakalpantakalavyapyai namah | shrisrishtisamharakarinyai
    namah | shrisarvashaktyai namah | 50 shrimahashaktyai namah | shrisharvanyai namah | shriparameshvaryai
    namah | shrihrillekhayai namah | shribhuvanyai namah | shridevyai namah | shrimahakaviparayanayai
    namah | shriicchajnanakriyarupayai namah | shrianimadigunashtakayai namah | shrishivayai namah | 60
    shrishantayai namah | shrishankaryai namah | shribhuvaneshvaryai namah | shrivedavedangarupayai namah
    | shriatisukshmayai namah | shrisharirinyai namah | shrikalajnanyai namah | shrishivajnanyai namah
    | shrishaivadharmaparayanayai namah | shrikalantaryai namah | 70 shrikalarupyai namah | shrisamjnanayai
    namah | shripranadharinyai namah | shrikhadgashreshthayai namah | shrikhatvangyai namah | shritrishulavaradharinyai
    namah | shriarupayai namah | shribahurupayai namah | shrinayikayai namah | shrilokavashyagayai namah
    | 80 shriabhayayai namah | shrilokarakshayai namah | shripinakyai namah | shrinagadharinyai namah
    | shrivajrashaktyai namah | shrimahashaktyai namah | shripashatomaradharinyai namah | shriashtadashabhujayai
    namah | shridevyai namah | shrihrillekhayai namah | 90 shribhuvanayai namah | shrikhadgadharyai namah
    | shrimaharupayai namah | shrisomasuryagnimadhyagayai namah | 94 iti shrirudrayamale tantre bhuvaneshvaryashtottarashatanamavalih
    samapta |
  devanagari: भुवनेश्वर्यष्टोत्तरशतनामावलिः ईश्वरोक्त श्रीभुवनेश्वर्यष्टोत्तरशतनामावलिः । श्रीमहासम्मोहिन्यै
    नमः । श्रीदेव्यै नमः । श्रीसुन्दर्यै नमः । श्रीभुवनेश्वर्यै नमः । श्रीएकाक्षर्यै नमः । श्रीएकमन्त्र्यै
    नमः । श्रीएकाक्यै नमः । श्रीलोकनायिकायै नमः । श्रीएकरूपायै नमः । श्रीमहारूपायै नमः । १० श्रीस्थूलसूक्ष्मशरीरिण्यै
    नमः । श्रीबीजरूपायै नमः । श्रीमहाशक्त्यै नमः । श्रीसङ्ग्रामे जयवर्धिन्यै नमः । श्रीमहारत्यै नमः ।
    श्रीमहाशक्त्यै नमः । श्रीयोगिन्यै नमः । श्रीपापनाशिन्यै नमः । श्रीअष्टसिद्ध्यै नमः । श्रीकलारूपायै
    नमः । २० श्रीवैष्णव्यै नमः । श्रीभद्रकालिकायै नमः । श्रीभक्तिप्रियायै नमः । श्रीमहादेव्यै नमः । श्रीहरिब्रह्मायै
    नमः । श्रीआदिरूपिण्यै नमः । श्रीशिवरूप्यै नमः । श्रीविष्णुरूप्यै नमः । श्रीकालरूप्यै नमः । श्रीसुखासिन्यै
    नमः । ३० श्रीपुराण्यै नमः । श्रीपुण्यरूपायै नमः । श्रीपार्वत्यै नमः । श्रीपुण्यवर्धिन्यै नमः । श्रीरुद्राण्यै
    नमः । श्रीपार्वतीन्द्राण्यै नमः । श्रीशङ्करार्धशरीरिण्यै नमः । श्रीनारायण्यै नमः । श्रीमहादेव्यै नमः
    । श्रीमहिष्यै नमः । ४० श्रीसर्वमङ्गलायै नमः । श्रीअकारादिक्षकारान्तायै नमः । श्रीह्यष्टात्रिंशत्कलाधर्यै
    नमः । श्रीसप्तमायै नमः । श्रीत्रिगुणायै नमः । श्रीनार्यै नमः । श्रीशरीरोत्पत्तिकारिण्यै नमः । श्रीआकल्पान्तकलाव्याप्यै
    नमः । श्रीसृष्टिसंहारकारिण्यै नमः । श्रीसर्वशक्त्यै नमः । ५० श्रीमहाशक्त्यै नमः । श्रीशर्वाण्यै नमः
    । श्रीपरमेश्वर्यै नमः । श्रीहृल्लेखायै नमः । श्रीभुवन्यै नमः । श्रीदेव्यै नमः । श्रीमहाकविपरायणायै
    नमः । श्रीइच्छाज्ञानक्रियारूपायै नमः । श्रीअणिमादिगुणाष्टकायै नमः । श्रीशिवायै नमः । ६० श्रीशान्तायै
    नमः । श्रीशाङ्कर्यै नमः । श्रीभुवनेश्वर्यै नमः । श्रीवेदवेदाङ्गरूपायै नमः । श्रीअतिसूक्ष्मायै नमः
    । श्रीशरीरिण्यै नमः । श्रीकालज्ञान्यै नमः । श्रीशिवज्ञान्यै नमः । श्रीशैवधर्मपरायणायै नमः । श्रीकालान्तर्यै
    नमः । ७० श्रीकालरूप्यै नमः । श्रीसंज्ञानायै नमः । श्रीप्राणधारिण्यै नमः । श्रीखड्गश्रेष्ठायै नमः ।
    श्रीखट्वाङ्ग्यै नमः । श्रीत्रिशूलवरधारिण्यै नमः । श्रीअरूपायै नमः । श्रीबहुरूपायै नमः । श्रीनायिकायै
    नमः । श्रीलोकवश्यगायै नमः । ८० श्रीअभयायै नमः । श्रीलोकरक्षायै नमः । श्रीपिनाक्यै नमः । श्रीनागधारिण्यै
    नमः । श्रीवज्रशक्त्यै नमः । श्रीमहाशक्त्यै नमः । श्रीपाशतोमरधारिण्यै नमः । श्रीअष्टादशभुजायै नमः ।
    श्रीदेव्यै नमः । श्रीहृल्लेखायै नमः । ९० श्रीभुवनायै नमः । श्रीखड्गधार्यै नमः । श्रीमहारूपायै नमः
    । श्रीसोमसूर्याग्निमध्यगायै नमः । ९४ इति श्रीरुद्रयामले तन्त्रे भुवनेश्वर्यष्टोत्तरशतनामावलिः समाप्ता
    ।
