id: shivapujasadhanani1snanakarmashivamantropadesham
category: mantra
name:
  english: shivapujasadhanani1snanakarmashivamantropadesham
  devanagari: शिवपूजासाधनानि१स्नानकर्मशिवमन्त्रोपदेशम्
content:
  english: mantraretaih snanakarma shivaya vinivedayet | caitrasnanena bhagavan maharudro viratpatih ||
    140|| prinatu parvatinathashcitrasrishtivisharadah | vaishakhamasasnanena bhagavangirijapatih || 141||
    prinatu shrimahadevo vishnubrahmadivanditah | jyeshthasnanena bhagavandevashreshtho maheshvarah ||
    142|| prinatu shankariyukto nanagananishevitah | ashadhamasasnanena bhagavangirijapatih || 143|| prinatu
    sarvabhutatma sadyo dakshayaniyutah | nabhahsnanena bhagavanbhaganetrabhidishvarah || 144|| prinatvaryayuto
    devo devavaryah sanatanah | nabhasyamasasnanena bhagavanvishvalocanah || 145|| prinatuh somah somatma
    vibhurhaimavatiyutah | ashvijamasasnanena bhagavanvishvahridgatah || 146|| prinatu tripuraratirishaniprananayakah
    | bhagavan kartikasnanat somasuryagnilocanah || 147|| prinatu durgasamyukto durgapatakanashanah |
    margashirshasya masiya
  devanagari: मन्त्ररेतैः स्नानकर्म शिवाय विनिवेदयेत् । चैत्रस्नानेन भगवान् महारुद्रो विराट्पतिः ॥ १४०॥
    प्रीणातु पार्वतीनाथश्चित्रसृष्टिविशारदः । वैशाखमासस्नानेन भगवान्गिरिजापतिः ॥ १४१॥ प्रीणातु श्रीमहादेवो
    विष्णुब्रह्मादिवन्दितः । ज्येष्ठस्नानेन भगवान्देवश्रेष्ठो महेश्वरः ॥ १४२॥ प्रीणातु शङ्करीयुक्तो नानागणनिषेवितः
    । अषाढमासस्नानेन भगवान्गिरिजापतिः ॥ १४३॥ प्रीणातु सर्वभूतात्मा सद्यो दाक्षायणीयुतः । नभःस्नानेन भगवान्भगनेत्रभिदीश्वरः
    ॥ १४४॥ प्रीणात्वार्यायुतो देवो देववर्यः सनातनः । नभस्यमासस्नानेन भगवान्विश्वलोचनः ॥ १४५॥ प्रीणातुः
    सोमः सोमात्मा विभुर्हैमवतीयुतः । आश्वीजमासस्नानेन भगवान्विश्वहृद्गतः ॥ १४६॥ प्रीणातु त्रिपुरारातिरीशानीप्राणनायकः
    । भगवान् कार्तिकस्नानात् सोमसूर्याग्निलोचनः ॥ १४७॥ प्रीणातु दुर्गासंयुक्तो दुर्गपातकनाशनः । मार्गशीर्षस्य
    मासीय
