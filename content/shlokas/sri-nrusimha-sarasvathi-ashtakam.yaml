id: sri-nrusimha-sarasvathi-ashtakam
category: stotram
name:
  english: Sri Nrusimha Sarasvathi Ashtakam
content:
  english: indukotiteja karunasindhu bhaktavatsalam nandanatrisunu dattamindiraksha shrigurum | gandhamalya
    akshatadi brindadevavanditam vandayami narasimha sarasvatisha pahi mam || || mohapasha andhakara chaya
    dura bhaskaram ayataksha pahi shriyavallabhesha nayakam | sevyabhaktabrindavarada bhuyo bhuyo namamyaham
    vandayami narasimha sarasvatisha pahi mam || || cittajadivargashatkamattavaranankusham tattvasarashobhitatma
    datta shriyavallabham | uttamavatara bhutakartri bhaktavatsalam vandayami narasimha sarasvatisha pahi
    mam || || vyoma vayu teja apa bhumi kartrimishvaram kamakrodhamoharahita somasuryalocanam | kamitarthadatri
    bhaktakamadhenu shrigurum vandayami narasimha sarasvatisha pahi mam || || pundarika ayataksha kundalendutejasam
    candaduritakhandanartha dandadhari shrigurum | mandalikamauli martanda bhasitananam vandayami narasimha
    sarasvatisha pahi mam || || vedashastrastutyapada adimurti shrigurum nadabindukalatita kalpapadasevyayam
    | sevyabhaktabrindavarada bhuyo bhuyo namamyaham vandayami narasimha sarasvatisha pahi mam || || ashtayogatattvanishtha
    tushtajnanavaridhim krishnavenitiravasa pancanadisangamam | kashtadainyaduri bhaktatushtakamyadayakam
    vandayami narasimha sarasvatisha pahi mam || || narasimhasarasvati nama ashtamauktikam hara kritya
    sharadena gangadhara atmajam | dharanika devadiksha gurumurti toshitam paramatmananda shriya putrapautradayakam
    || prarthayami dattadeva sadgurum sadavibhum narasimhasarasvatiya ashtakam ca yah pathet ghora samsara
    sindhu taranakhya sadhanam | sarajnana dirgha ayurarogyadi sampadam caruvargakamyalabha nityameva
    yah pathet || iti shrigurucaritamrite shrinrisimhasarasvatyupakhyane siddhanamadharaka samvade shrinrisimhasarasvati
    ashtakam ||
  devanagari: इन्दुकोटितेज करुणसिन्धु भक्तवत्सलं नन्दनात्रिसूनु दत्तमिन्दिराक्ष श्रीगुरुम् । गन्धमाल्य
    अक्षतादि बृन्ददेववन्दितं वन्दयामि नारसिंह सरस्वतीश पाहि माम् ॥ ॥ मोहपाश अन्धकार छाय दूर भास्करं आयताक्ष
    पाहि श्रियावल्लभेश नायकम् । सेव्यभक्तबृन्दवरद भूयो भूयो नमाम्यहं वन्दयामि नारसिंह सरस्वतीश पाहि माम्
    ॥ ॥ चित्तजादिवर्गषट्कमत्तवारणाङ्कुशं तत्त्वसारशोभितात्म दत्त श्रियावल्लभम् । उत्तमावतार भूतकर्तृ भक्तवत्सलं
    वन्दयामि नारसिंह सरस्वतीश पाहि माम् ॥ ॥ व्योम वायु तेज आप भूमि कर्तृमीश्वरं कामक्रोधमोहरहित सोमसूर्यलोचनम्
    । कामितार्थदातृ भक्तकामधेनु श्रीगुरुं वन्दयामि नारसिंह सरस्वतीश पाहि माम् ॥ ॥ पुण्डरीक आयताक्ष कुण्डलेन्दुतेजसं
    चण्डदुरितखण्डनार्थ दण्डधारि श्रीगुरुम् । मण्डलीकमौलि मार्ताण्ड भासिताननं वन्दयामि नारसिंह सरस्वतीश
    पाहि माम् ॥ ॥ वेदशास्त्रस्तुत्यपाद आदिमूर्ति श्रीगुरुं नादबिन्दुकलातीत कल्पपादसेव्ययम् । सेव्यभक्तबृन्दवरद
    भूयो भूयो नमाम्यहं वन्दयामि नारसिंह सरस्वतीश पाहि माम् ॥ ॥ अष्टयोगतत्त्वनिष्ठ तुष्टज्ञानवारिधिं कृष्णवेणितीरवास
    पञ्चनदीसङ्गमम् । कष्टदैन्यदूरि भक्ततुष्टकाम्यदायकं वन्दयामि नारसिंह सरस्वतीश पाहि माम् ॥ ॥ नारसिंहसरस्वती
    नाम अष्टमौक्तिकं हार कृत्य शारदेन गङ्गाधर आत्मजम् । धारणीक देवदीक्ष गुरुमूर्ति तोषितं परमात्मानन्द
    श्रिया पुत्रपौत्रदायकम् ॥ प्रार्थयामि दत्तदेव सद्गुरुं सदाविभुम् नारसिंहसरस्वतीय अष्टकं च यः पठेत्
    घोर संसार सिन्धु तारणाख्य साधनम् । सारज्ञान दीर्घ आयुरारोग्यादि सम्पदां चारुवर्गकाम्यलाभ नित्यमेव
    यः पठेत् ॥ इति श्रीगुरुचरितामृते श्रीनृसिंहसरस्वत्युपाख्याने सिद्धनामधारक संवादे श्रीनृसिंहसरस्वती
    अष्टकम् ॥
