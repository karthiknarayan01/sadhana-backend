id: dashaksharamantrastotram
category: mantra
name:
  english: dashaksharamantrastotram
  devanagari: दशाक्षरमन्त्रस्तोत्रम्
content:
  english: dashaksharamantrastotram shriganeshaya namah | mudgala uvaca | asacchaktishca satsuryah samo
    vishnurmahamune | avyaktah shankarastesham samyoge ganapo bhavet || 1|| samyoge mayaya yukto ganesho
    brahmanayakah | ayoge mayaya hino bhavati munisattama || 2|| samyogayogayoryoge yogo ganeshasamjnitah
    | shantibhyah shantidah prokto bhajane bhaktisamyutah || 3|| evamuktva ganeshasya dadau mantram sa
    mudgalah | ekaksharam vidhiyutam tatah so'ntarhito'bhavat || 4|| tato'ham ganarajam tamabhajam sarvabhavatah
    | tena shanti samayuktashcarami tvakutobhayah || 5|| na ganeshatparam brahma na ganeshatparam tapah
    | na ganeshatparam karma jnanam na ganapatparam || 6|| na ganeshatparo yogo bhaktirna ganapatpara
    | tasmatsa sarvapujyo'yam sarvadau siddhidayakah || 7|| ganeshanam parityajya karmajnanadikam caret
    | tatsarvam nishphalam yati bhasmani prahutam yatha || 8|| sarvamstyajya ganesham yo bhajate'nanyacetasa
    | sarvasiddhim labhetsadyo brahmabhutah sa kathyate || 9|| evamuktva'tritastasmai dadau mantram dashaksharam
    | vidhiyuktam tatah sakshadantardhanam cakara ha || 10|| iti dashaksharamantrastotram samaptam |
  devanagari: दशाक्षरमन्त्रस्तोत्रम् श्रीगणेशाय नमः । मुद्गल उवाच । असच्छक्तिश्च सत्सूर्यः समो विष्णुर्महामुने
    । अव्यक्तः शङ्करस्तेषां संयोगे गणपो भवेत् ॥ १॥ संयोगे मायया युक्तो गणेशो ब्रह्मनायकः । अयोगे मायया
    हीनो भवति मुनिसत्तमा ॥ २॥ संयोगायोगयोर्योगे योगो गणेशसंज्ञितः । शान्तिभ्यः शान्तिदः प्रोक्तो भजने
    भक्तिसंयुतः ॥ ३॥ एवमुक्त्वा गणेशस्य ददौ मन्त्रं स मुद्गलः । एकाक्षरं विधियुतं ततः सोऽन्तर्हितोऽभवत्
    ॥ ४॥ ततोऽहं गणराजं तमभजं सर्वभावतः । तेन शान्ति समायुक्तश्चरामि त्वकुतोभयः ॥ ५॥ न गणेशात्परं ब्रह्म
    न गणेशात्परं तपः । न गणेशात्परं कर्म ज्ञानं न गणपात्परम् ॥ ६॥ न गणेशात्परो योगो भक्तिर्न गणपात्परा
    । तस्मात्स सर्वपूज्योऽयं सर्वादौ सिद्धिदायकः ॥ ७॥ गणेशानं परित्यज्य कर्मज्ञानादिकं चरेत् । तत्सर्वं
    निष्फलं याति भस्मनि प्रहुतं यथा ॥ ८॥ सर्वांस्त्यज्य गणेशं यो भजतेऽनन्यचेतसा । सर्वसिद्धिं लभेत्सद्यो
    ब्रह्मभूतः स कथ्यते ॥ ९॥ एवमुक्त्वाऽत्रितस्तस्मै ददौ मन्त्रं दशाक्षरम् । विधियुक्तं ततः साक्षादन्तर्धानं
    चकार ह ॥ १०॥ इति दशाक्षरमन्त्रस्तोत्रं समाप्तम् ।
