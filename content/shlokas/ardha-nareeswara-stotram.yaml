id: ardha-nareeswara-stotram
category: stotram
name:
  english: Ardha Nareeswara Stotram
content:
  english: campeyagaurardhasharirakayai karpuragaurardhasharirakaya | dhammillakayai ca jatadharaya namah
    shivayai ca namah shivaya || || kasturikakunkumacarcitayai citarajahpunja vicarcitaya | kritasmarayai
    vikritasmaraya namah shivayai ca namah shivaya || || jhanatkvanatkankananupurayai padabjarajatphaninupuraya
    | hemangadayai bhujagangadaya namah shivayai ca namah shivaya || || vishalanilotpalalocanayai vikasipankeruhalocanaya
    | samekshanayai vishamekshanaya namah shivayai ca namah shivaya || || mandaramalakalitalakayai kapalamalankitakandharaya
    | divyambarayai ca digambaraya namah shivayai ca namah shivaya || || ambhodharashyamalakuntalayai
    tatitprabhatamrajatadharaya | nirishvarayai nikhileshvaraya namah shivayai ca namah shivaya || ||
    prapancasrishtyunmukhalasyakayai samastasamharakatandavaya | jagajjananyai jagadekapitre namah shivayai
    ca namah shivaya || || pradiptaratnojjvalakundalayai sphuranmahapannagabhushanaya | shivanvitayai
    ca shivanvitaya namah shivayai ca namah shivaya || || etatpathedashtakamishtadam yo bhaktya sa manyo
    bhuvi dirghajivi | prapnoti saubhagyamanantakalam bhuyatsada tasya samastasiddhih ||
  devanagari: चाम्पेयगौरार्धशरीरकायै कर्पूरगौरार्धशरीरकाय । धम्मिल्लकायै च जटाधराय नमः शिवायै च नमः शिवाय
    ॥ ॥ कस्तूरिकाकुङ्कुमचर्चितायै चितारजःपुञ्ज विचर्चिताय । कृतस्मरायै विकृतस्मराय नमः शिवायै च नमः शिवाय
    ॥ ॥ झणत्क्वणत्कङ्कणनूपुरायै पादाब्जराजत्फणिनूपुराय । हेमाङ्गदायै भुजगाङ्गदाय नमः शिवायै च नमः शिवाय
    ॥ ॥ विशालनीलोत्पललोचनायै विकासिपङ्केरुहलोचनाय । समेक्षणायै विषमेक्षणाय नमः शिवायै च नमः शिवाय ॥ ॥
    मन्दारमालाकलितालकायै कपालमालाङ्कितकन्धराय । दिव्याम्बरायै च दिगम्बराय नमः शिवायै च नमः शिवाय ॥ ॥ अम्भोधरश्यामलकुन्तलायै
    तटित्प्रभाताम्रजटाधराय । निरीश्वरायै निखिलेश्वराय नमः शिवायै च नमः शिवाय ॥ ॥ प्रपञ्चसृष्ट्युन्मुखलास्यकायै
    समस्तसंहारकताण्डवाय । जगज्जनन्यै जगदेकपित्रे नमः शिवायै च नमः शिवाय ॥ ॥ प्रदीप्तरत्नोज्ज्वलकुण्डलायै
    स्फुरन्महापन्नगभूषणाय । शिवान्वितायै च शिवान्विताय नमः शिवायै च नमः शिवाय ॥ ॥ एतत्पठेदष्टकमिष्टदं
    यो भक्त्या स मान्यो भुवि दीर्घजीवी । प्राप्नोति सौभाग्यमनन्तकालं भूयात्सदा तस्य समस्तसिद्धिः ॥
