id: narayana-sukta
category: sukta
name:
  english: narayana-sukta
  devanagari: नरयन-सुक्त
content:
  english: tiryagurdhvamadhashshayi rashmayah tasya santata | santapayati svam dehamapadatalamastakah
    | tasya madhye vahnishikha aniyordhva vyavasthitah ||
  devanagari: तिर्यगूर्ध्वमधश्शायी रश्मयः तस्य सन्तता । सन्तापयति स्वं देहमापादतलमास्तकः । तस्य मध्ये
    वह्निशिखा अणीयोर्ध्वा व्यवस्थिताः ॥
meaning: {}
