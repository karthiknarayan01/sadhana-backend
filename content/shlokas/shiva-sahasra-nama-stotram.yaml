id: shiva-sahasra-nama-stotram
category: stotram
name:
  english: Shiva Sahasra Nama Stotram
  devanagari: शिवसहस्रनामस्तोत्रम् (आदिशेषकृतं शिवरहस्यान्तर्गतम् नवमांशे अध्याय २ गङ्गाधरोऽन्धकरिपुः
    पिनाकी प्रमथाधिपन्)
content:
  english: '(shivarahasyantargate sadashivakhye) - jaigishavyaskandasamvade skandaproktam - skandah uvaca
    | (sheshasheshamukhodgitam namasaravalimimam | hatakeshorukatakabhutenakahina(ndra)kena tu || 1||
    sahasranama yatproktam tatte vakshyamyaham shrinu | dhanyam manyam mahamanyupritidayakamuttamam ||
    2|| nanyeshu dapaniyam te na deyam vedamidrisham | pancasya hridayashasyamanushasyami te hridi ||
    3||) rishirasyadishesho vai devo devomaheshvarah | sarvatra viniyogo''sya karmasvapi sada dvija |
    dhyanam tasyanuvakshyami tvamekagramanah shrinu || 4|| - - atha dhyanam | dhyayedindukaladharam giridhanum
    somagnibhalojjvalam vaikunthoruvipathabanasukaram devam rathe''dhishthitam | (vaikunthoruvipathabanasukaram
    hyurvirathadhishthatam) | vedashvam vidhisarathim girijaya citte''nusandadhmahe nanakarakalavilasajagadandadisampurtaye
    || 5|| - - japopadesham | evam dhyatva mahadevam namnam sahasramuttamam | prajapenniyato mantri bhasmarudrakshabhushanah
    || 6|| lingamabhyarcayanvapi bilvakomalapallavaih | pankajairutpalairvapi prasadaya maheshituh ||
    7|| ashtamyam va caturdashyam parvasvapi visheshatah | yam yam kamam sadacitte bhavayettam tamapnuyat
    || 8|| - - atha shivasahasranamastotram | om gangadharo''ndhakaripuh pinaki pramathadhipah | bhava
    ishana ataryo''nekadhanyo maheshvarah || 9|| mahadevah pashupatih sthanuh sarvajna ishvarah | vishvadhikah
    shivah shanto vishvatma gaganantarah || 10|| paravaro''mbikanathah sharadindukaladharah | ganeshatato
    devesho bhavavaidyah pitamahah || 11|| taranastarakastamro prapancarahito harah | vinayakastutapadah
    kshmaratho nandivahanah || 12|| gajantako dhanurdhari viraghoshah stutipriyah | prajasaho ranoccandatandavo
    manmathantakah || 13|| shipivishtah shashvatatma meghavaho durasadah | anandapurno varshatma rudrah
    samharakarakah || 14|| bhaganetrapramathano nityajeta''parajitah | mahakarunikah shvabhruh prasannasyo
    makhantakah || 15|| ghanabhakantho garabhuk babhrusho viryavardhanah | prakatastavano mani manasvi
    jnanadayakah || 16|| kandarpasarpadarpaghno vishadi nilalohitah | kalantako yugavartah sankrandanasunandanah
    || 17|| dinaposhah pashahanta shantatma krodhavardhanah | kandarpo visalaccandro lingadhyaksho gajantakah
    || 18|| vaikunthapujyo vishvatma trinetro vrishabhadhvajah | jahnujapatirishanah smashananilayo yuva
    || 19|| parvatijaniruhyadhyo natyavidyaparayanah | samavedapriyo vaidyo vidyadhipatirishvarah || 20||
    kumarajanako maramarako virasattamah | kambalashvatarodgarisuphanotkrishtakundalah || 21|| anandavanavaso''tha
    avimuktamaheshvarah | onkaranilayo dhanvi kedaresho''mitaprabhah || 22|| narmadalinganilayo nishpapajanavatsalah
    | mahakailasalingatma virabhadraprasadakrit || 23|| kalagnirudro''nantatma bhasmango gopatipriyah
    | vedashvah kanjajajaninetrapujitapadukah || 24|| jalandharavadhodyuktadivyacakrapradayakah | vamano
    vikato mundastuhundakritasamstutih || 25|| phanishvaramahaharo rudrakshakritakankanah | vinapanirganarato
    dhakkavadyapriyo vashi || 26|| vishalavakshah shailendrajamata''marasattamah | hrittamonashako buddho
    jagatkandardano bali || 27|| palashapushpapujyanghrih palashanavarapradah | sagarantargato ghorah
    sadyojato''mbikasakhah || 28|| vamadevah samagitah somah somakaladharah | nihsima mahimodaro du(da)ritakhilapatakah
    || 29|| tapanantargato dhata dhenuputravarapradah | banahastaprado neta namucerviryavardhanah || 30||
    nagajinango nagesho nageshavarabhushanah | ageshashayi bhutesho ganakolahalapriyah || 31|| prasannasyo''nekabahuh
    shuladhrik kalatapanah | kolapramathanah kurmamahakharpatadharakah || 32|| marasihmajinadharo mahalangaladhrigbali
    | kakudunmathano heturahetuh sarvakaranah || 33|| krishanuretah sotphullabhalanetro''marariha | mrigabaladharo
    dhanvi shakrabahuvibhanjakah || 34|| dakshayajnapramathanah pramathadhipatih shivah | shatavarto yugavarto
    meghavarto durasadah || 35|| manojavo jatajano vedadharah sanatanah | pandaragoh(ngo)go''jinangah
    karmandijanavatsalah || 36|| caturhotro virahota shatarudriyamadhyagah | bhimo rudra udavarto vishamaksho''runeshvarah
    || 37|| yaksharajanuto natho nitishastrapravartakah | kapalapanirbhagavanvaiyaghratvagalankritah ||
    38|| mokshasaro''dhvaradhyaksha dhvajajivo marutsakhah | aruneyastvagadhyaksho kamanarahitastaruh
    || 39|| bilvapujyo bilvanisho haridashvo''parajitah | brihadrathantarastutyo vamadevyastavapriyah
    || 40|| aghoratara rocishnurgambhiro manyurishvarah | kalipravartako yogi sankhyamayavisharadah ||
    41|| vidharako dhairyadhuryah somadhamantarasthitah | shipivishto gahvareshto jyeshtho devah kanishthakah
    || 42|| pinakahasto''varajo varshaharishvarah | kavaci ca nishangi ca rathaghosho''mitaprabhah ||
    43|| kalanjaro dandashuko vidarbhesho ganatigah | gabhastisho munishreshtho maharshih samshitavratah
    || 44|| karnikaravanavasi karavirasumapriyah | nilotpalamahasragvi karahatapureshvarah || 45|| shatarcanah
    paranando brahmanarcyopavitavan | bali balapriyo dharmo hiranyapatirappatih || 46|| yamapramathanoshnishi
    cakrahastah purantakah | vasusheno''nganadehah kaulacarapravartakah || 47|| tantradhyaksho mantramayo
    gayatrimadhyagah shucih | vedatma yajnasamprito garishthah paradah kali || 48|| rigyajuhsamarupatma
    sarvatma kraturishvarah | hiranyagarbhajanako hiranyakshavarapradah || 49|| damitasheshapashando dandahasto
    durasadah | durvarcanapriyakaro rantidevo''mareshvarah || 50|| amritatma mahadevo harah samharakarakah
    | triguno vikhana vagmi tvanmamsarudhiramshakah || 51|| vatsapriyo''tha sanustho vishnu raktapriyo
    guruh | kirataveshah shonatma ratnagarbho''runekshanah || 52|| surasavabalipritastatpursho''gandhadehavan
    | vyomakeshah koshahinah kalpanarahito''kshami || 53|| sahamanashca vivyadhi sphatikopalanirmalah
    | mrityunjayo duradhyaksho bhaktiprito bhayapahah || 54|| gandharvaganasuprito vishnugarbho''mitadyutih
    | brahmastutah suryanetro vitihotro''rjunantakah || 55|| garvapaharako vagmi kumbhasambhavapujitah
    | malayo vindhyanilayo mahendro merunayakah || 56|| parvatinayako''jayyo jangamajangamashrayah | kuruvindo''runo
    dhanvi asthibhusho nishakarah || 57|| (kuruvindaruno dhanvi asthibhusho nishakarah) || 57|| samudramathanodbhutakalakutavishadanah
    | surasurendravarado dayamurtih sahasrapat || 58|| karano viranah putri jantugarbhe garadanah | shrishailamulanilayah
    shrimadabhrasabhapatih || 59|| dakshinamurtiranagho jalandharanipatanah | dakshino yajamanatma dikshito
    daityanashanah || 60|| kalmashapadapujyanghriratido turagapriyah | umadhavo dinadayo data danto dayaparah
    || 61|| shrimaddakshinakailasanivaso janavatsalah | darbharoma balonneta tamaso''nnavivardhanah ||
    62|| namaskarapriyo natha anandatma sanatanah | tamalanilasugalah kutarkavinivarakah || 63|| kamarupah
    prashantatma karananam ca karanah | trinapanih kantiparo manipanih kulacalah || 64|| kasturitilakakrantabhalo
    bhasmatripundravan | varanangalankritango mahapapanivaranah || 65|| prakasharupo guhyatma balarupo
    bileshayah | bhikshupriyo bhakshyabhokta bharadvajapriyo vashi || 67|| karmanyastarakobhuta karano
    yanaharshadah | (karmanyonarakodbhuta karano yanaharshadah) | vrishagami dharmagopta kami kamanganashanah
    || 68|| karunyo vajarupatma nirdharmo gramanih prabhuh | aranyah pashuharshashca sauniko meghavahanah
    || 69|| kumaragururanando vamano vagbhavo yuva | svardhunidhanyamaulishca tarurajo mahamanah || 70||
    kanashanastamraghano mayaprito''jaramarah | kaunaparih bhalanetro varnashramaparayanah || 71|| puranavrindasamprita
    itihasavisharadah | samartho namitasheshadevo dyotakarah phani || 72|| karshako langaleshashca merudhanva
    prajapatih | ugrah pashupatirgopta pavamano vibhavasuh || 73|| udavasurvitaraga urvisho viryavardhanah
    | jvalamalo''jitangashca vaidyudagnipravartakah || 74|| kamaniyakritih pata ashadho(dhah)shandhavarjitah
    | pulindarupah punyatma punyapapaphalapradah || 75|| garhapatyo dakshinagnih sabhyo vasathabhritkavih
    | druma ahavaniyashca taskaro''tha mayaskarah || 76|| shankaro varido''varyo vatacakrapravartakah
    | kulishayudhahastashca vikrito jatilah shikhi || 77|| saurashtravasi devedyah sahyajatirasamsthitah
    | mahakayo vitabhayo ganagito visharadah || 78|| tapasvi tapasacaryo drumahastojjvalatprabhuh | kindamo
    mankanah prito jatukarnistutipriyah || 79|| veno vainyo vishakhashca''kampanah somadharakah | upayado
    daritango nanagamavisharadah || 80|| kavyalapaikakushalo mimamsavallabho dhruvah | talamulanikentashca
    bilvamulaprapujitah || 81|| vedango gamano''gamyo gavyah pratah phaladanah | gangatirasthito lingi
    alingo rupasamshrayah || 82|| shrantiha punyanilayah palalasho''rkapujitah | mahendravishnujanako
    brahmatatastuto''vyayah || 83|| kardamesho matangesho vishvesho gandhadharakah | vishalo vimalo jishnurjayashilo
    jayapradah || 84|| daridryamathano mantri shambhuh shashikaladharah | shimshumarah shaunakejyah shvanapah
    shvetajivadah || 85|| munibalapriyo''gotro milindo mantrasamsthitah | kashishah kamitangashca vallakivadanapriyah
    || 86|| hallisalasyanipunah sallilo vallaripriyah | mahaparada samviryo vahninetro jatadharah || 87||
    alapo''nekarupatma purushah prakriteh parah | sthanurvenuvanaprito ranajitpakashasanah || 88|| nagno
    nirakrito dhumro vaidyuto vishvanayakah | vishvadhikah shantaravah shashvatah sumukho mahan || 89||
    anoranuh shvabhragatah (tohya) avatesho nateshvarah | citradhama citrabhanurvicitrakritirishvarah
    || 90|| indro''jo''murtirupatma(hya)amurto vahnidharakah | apasmaraharo gupto yogidhyeyo''khiladanah
    || 91|| nakshatrarupah kshatratma kshuttrishnashramavarjitah | asango bhutahridayo valakhilyo maricipah
    || 92|| pancapretasanasino yoginiganasevitah | nanabhashanucato (nuvacano) nanadeshasamashrayah ||
    93|| vrindarakaganastutyah purandaranatipriyah | praghaso vighasashi ca (capya) annadhipatirannadah
    || 94|| pannagabharano yogi gururlaukikanayakah | virajo (virajo, viraja) vishvatodharmi babhrusho
    bahukapriyah || 95|| pradhananipuno mitro hyurdhvareta mahatapah | kurujangalavasi ca nityatripto
    niranjanah || 96|| hiranyagarbho bhutadisvarat samraradviradvatuh | patahadhvanisamprito natamuktipradayakah
    || 97|| phalapradah bhalanetrah phanishvaramahangadhrik | vastupo vasavo vatyo varmabhidvasanojjvalah
    || 98|| midhushtamah shivatamo vasuh shivataro bali | nidhanesho nidhaneshah purujidrashtravardhanah
    || 99|| ayutayuh shatayushca pramitayuh shatadhvarah | sahasrashringo vrishabha urugayorumidhukah
    || 100|| ganta gamayita gata garutman gitavardhanah | ragaraginikapritastalapanirgadapahah || 101||
    deveshah khandaparashuh pracandataravikramah | urukramo mahabahurhetidhrikpavakadanah || 102|| ganikanatyanirato
    vimarsho vavadukakah | kalipramathano dhiro dhirodatto mahahanuh || 103|| kshayadviromunji(manju)kesha
    kalmalikah(ki) surottamah | vajrango vayujanako hyashtamurtih kripakarah || 104|| prahutah paramodarah
    pancaksharaparayanah | karkandhuh kamadahano malinaksho jadajadah || 105|| kuberapujitapado mahatakshakakankanah
    | shankhano madhuraravo mrinah saspinjaro''jarah || 106|| margo margaprado mukto vijitarih paro''varah
    | pranavartho vedamayo vedantambuja bhaskarah || 107|| sarvavidyadhipah saumyo yajneshah kshetranayakah
    | papanashakaro divyo gobhilo goparo ganah || 108|| ganeshapujitapado lalitambamanoharah | kakshavaso
    mahokshanko nistamastomavarjitah || 109|| nihsimamahimodarah prabhamurtih prasanna(dri)k | stobhaprito
    bharabhuto bhubharaharanah sthirah || 110|| ksharaksharodharo dharta sagarantargato vashi | ramyo
    rasyo rajasyo''tha pravahyo vaidyuto''nalah || 111|| sikatyo vadya urvaryo medhya idhriya vakpatuh
    | prapancamayarahitah kirtido viryavardhanah || 112|| kalacakrantarahito nityanityo''tha cetanah |
    garvonnato bhatakaro mrigayurbhavaha bhavah || 113|| shangah shatangah shitango nagango bhasmabhushanah
    | triyambako''mbikabharta nandikeshah prasadakrit || 114|| candishavarado divyo mayavidyavisharadah
    | mrigankashekharo bhavyo gauripujyo dayamayah || 115|| pramathano''vikathano gargo vinapriyah patuh
    | varni vanastho yatirat gudhagarbho virocanah || 116|| shabaro barbaro dhaumyo viradrupah sthitipradah
    | mahakaruniko bhrantinashakah shokaha prabhuh || 117|| ashokapushpapujyanghrirmanibhadro dhaneshvarah
    | amriteshodrutagatistagaro''rjunamadhyagah || 118|| damo virodhahritkanto nitijno vishnupujitah |
    sumapriyo vatamayo variyankarmatho yamah || 119|| digambaro(rah) shamamayo dhumapah shukragarbhakah
    | attahaso''talpashaya asino dhavamanakah || 120|| turashanmeghamadhyastho vipashatirasamsthitah |
    kulonnatah kulinashca vyavaharapravartakah || 121|| ketumalo haridrango dravi(vi) pushpamayo bhriguh
    | vishoshakorviniratastvagjato rudhika(ra)priyah || 122|| akaitaka(va)hridavasah kshapanathakaladharah
    | naktancarodivacari divyadeho vinashakah || 123|| kadambavanamadhyastho haridragormimadhyagah | yamunajalamadhyastho
    jalako''jamakho vasuh || 124|| vasuprado viravaryah shulahastah pratapavan | khadgahasto mandalatma
    mrityurmrityujidishvarah || 125|| lankavaso meghamalo gandhamadanasamsthitah | bhairavo bharano bharta
    bhratrivyo namarupagah || 126|| avyakritatma bhutatma pancabhutantaro''smayah | ahananyah shabdamaya
    kaladharah kaladharah || 127|| bhrigutungashciravasi(sah) kaivarto''nayako''rdhakah | karenupo gandhamadashcampeyakusumapriyah
    || 128|| bhadradashcarmavasano vairajastotrakarakah | sumapritah samagiti urjo varcah kuleshvarah
    || 129|| kakudman pitavasano vadhyesho naradahpita | kravyadano nitimayo dharmacakrapravartakah ||
    130|| shashyah phenyo vinirneta kankano''nasiko''calah | enankah shalabhakarah shaluro gramasamsthitah
    || 131|| mahavisheshakathano varitirasthito''calah | kripitayonih shantatma gunavan jnanavanchucih
    || 132|| sarvapapaharo''lingo bhagamalo''prataranah | anandadhana atarya irinyo''thaprapathyakah ||
    133|| gangatirasthito devo hyavimuktasamashrayah | mahashmashananilayo''valayo valipujitah || 134||
    karandhamo vratyavaryo manavo jivako''shathah | karmadevamayo brahma ritam satyam maheshvarah || 135||
    sumangalah sukhamayo jnananando''mitashanah | manomayah pranamayo vijnanatma prasadanah || 136|| anandamayakoshatma
    dharmasimatha bhumakah | sadashivo vishishtatma vasishtharcitapadukah || 137|| nilagrivah sainyapalo
    dishanatho natipriyah | keshavonmathano mauni madhusudanasudanah || 138|| udumbarakaro dimbho bambharah
    pinchilatalah | mulastalakaro varnyo''parnadah pranamasha(sha)kah || 139|| aparnapatirishasyo''sampurnah
    purnarupavan | dipamalo jangaliko vaitundastundakah priyah || 140|| ulukah kalavinko''tha shukanadaprasadakrit
    | jaigishavyatapahprito ravanendrabalardanah || 141|| markandeyamahamrityunashako jnanadharakah |
    aharganakriyatitah sarpaprito''nilashanah || 142|| vegadharo dhairyadhano dhanadhanyapradayakah |
    nadyo vaidyo vadyarato gadyapadyastuto dyukah || 143|| bheribhankaranirato mrigacarmavidhayakah |
    punyakirtih punyalabhyo mohanastravisharadah || 144|| kailasashikharavasah parijatavanashrayah | ila(da)diravasamprito
    mahendrastutiharshitah || 145|| yupavato bhara vaha komalango janashrayah | vishvamitrapriyo balah
    pakayajnaratah sukhi || 146|| vamacarapriyonneta shaktihasto durasadah | sarvakarah shashvatatma vanmanodurago
    harah || 147|| - - phalashrutih | ityetannamasahasram sheshasheshamukhodgatam | shambhordivyam munishreshtha
    shravanatpapanashanam || 148|| sarvankamanavapnoti shivarcanaparayanah | tvamebhirmunimukhyaishca
    shrinvanbhaktimavapnuyah || 149|| kumari patimapnoti nirdhano dhanavanbhavet | jayarthi jayamapnoti
    kshayadviraprasadatah || 150|| || iti shivarahasyantargate adisheshakritam shivasahasranamastotram
    sampurnam || - || shrishivarahasyam | sadashivakhyah navamamshah | adhyayah 2 sahasranamakathanam
    | 1-150|| - || shrishivarahasyam | sadashivakhyah navamamshah | adhyayah 2 sahasranamakathanam | 1-150||
    notes:'
  devanagari: '(शिवरहस्यान्तर्गते सदाशिवाख्ये) - जैगीषव्यस्कन्दसंवादे स्कन्दप्रोक्तम् - स्कन्दः उवाच ।
    (शेषाशेषमुखोद्गीतां नामसारावलीमिमाम् । हाटकेशोरुकटकभूतेनकहीन(न्द्र)केण तु ॥ १॥ सहस्रनाम यत्प्रोक्तं
    तत्ते वक्ष्याम्यहं शृणु । धन्यं मान्यं महामन्युप्रीतिदायकमुत्तमम् ॥ २॥ नान्येषु दापनीयं ते न देयं
    वेदमीदृशम् । पञ्चास्य हृदयाशास्यमनुशास्यामि ते हृदि ॥ ३॥) ऋषिरस्यादिशेषो वै देवो देवोमहेश्वरः । सर्वत्र
    विनियोगोऽस्य कर्मस्वपि सदा द्विज । ध्यानं तस्यानुवक्ष्यामि त्वमेकाग्रमनाः शृणु ॥ ४॥ - - अथ ध्यानम्
    । ध्यायेदिन्दुकलाधरं गिरिधनुं सोमाग्निभालोज्ज्वलं वैकुण्ठोरुविपाठबाणसुकरं देवं रथेऽधिष्ठितम् । (वैकुण्ठोरुविपाठबाणसुकरं
    ह्युर्वीरथाधिष्ठतम्) । वेदाश्वं विधिसारथिं गिरिजया चित्तेऽनुसन्दध्महे नानाकारकलाविलासजगदान्ददिसम्पूर्तये
    ॥ ५॥ - - जपोपदेशम् । एवं ध्यात्वा महादेवं नाम्नां साहस्रमुत्तमम् । प्रजपेन्नियतो मन्त्री भस्मरुद्राक्षभूषणः
    ॥ ६॥ लिङ्गमभ्यर्चयन्वापि बिल्वकोमलपल्लवैः । पङ्कजैरुत्पलैर्वापि प्रसादाय महेशितुः ॥ ७॥ अष्टम्यां वा
    चतुर्दश्यां पर्वस्वपि विशेषतः । यं यं कामं सदाचित्ते भावयेत्तं तमाप्नुयात् ॥ ८॥ - - अथ शिवसहस्रनामस्तोत्रम्
    । ॐ गङ्गाधरोऽन्धकरिपुः पिनाकी प्रमथाधिपः । भव ईशान आतार्योऽनेकधन्यो महेश्वरः ॥ ९॥ महादेवः पशुपतिः
    स्थाणुः सर्वज्ञ ईश्वरः । विश्वाधिकः शिवः शान्तो विश्वात्मा गगनान्तरः ॥ १०॥ परावरोऽम्बिकानाथः शरदिन्दुकलाधरः
    । गणेशतातो देवेशो भववैद्यः पितामहः ॥ ११॥ तरणस्तारकस्ताम्रो प्रपञ्चरहितो हरः । विनायकस्तुतपदः क्ष्मारथो
    नन्दिवाहनः ॥ १२॥ गजान्तको धनुर्धारी वीरघोषः स्तुतिप्रियः । प्रजासहो रणोच्चण्डताण्डवो मन्मथान्तकः ॥
    १३॥ शिपिविष्टः शाश्वतात्मा मेघवाहो दुरासदः । आनन्दपूर्णो वर्षात्मा रुद्रः संहारकारकः ॥ १४॥ भगनेत्रप्रमथनो
    नित्यजेताऽपराजितः । महाकारुणिकः श्वभ्रुः प्रसन्नास्यो मखान्तकः ॥ १५॥ घनाभकण्ठो गरभुक् बभ्रुशो वीर्यवर्धनः
    । प्रकटस्तवनो मानी मनस्वी ज्ञानदायकः ॥ १६॥ कन्दर्पसर्पदर्पघ्नो विषादी नीललोहितः । कालान्तको युगावर्तः
    सङ्क्रन्दनसुनन्दनः ॥ १७॥ दीनपोषः पाशहन्ता शान्तात्मा क्रोधवर्धनः । कन्दर्पो विसलच्चन्द्रो लिङ्गाध्यक्षो
    गजान्तकः ॥ १८॥ वैकुण्ठपूज्यो विश्वात्मा त्रिणेत्रो वृषभध्वजः । जह्नुजापतिरीशानः स्मशाननिलयो युवा ॥
    १९॥ पार्वतीजानिरूह्याढ्यो नाट्यविद्यापरायणः । सामवेदप्रियो वैद्यो विद्याधिपतिरीश्वरः ॥ २०॥ कुमारजनको
    मारमारको वीरसत्तमः । कम्बलाश्वतरोद्गारिसुफणोत्कृष्टकुण्डलः ॥ २१॥ आनन्दवनवासोऽथ अविमुक्तमहेश्वरः ।
    ओङ्कारनिलयो धन्वी केदारेशोऽमितप्रभः ॥ २२॥ नर्मदालिङ्गनिलयो निष्पापजनवत्सलः । महाकैलासलिङ्गात्मा वीरभद्रप्रसादकृत्
    ॥ २३॥ कालाग्निरुद्रोऽनन्तात्मा भस्माङ्गो गोपतिप्रियः । वेदाश्वः कञ्जजाजानिनेत्रपूजितपादुकः ॥ २४॥ जलन्धरवधोद्युक्तदिव्यचक्रप्रदायकः
    । वामनो विकटो मुण्डस्तुहुण्डकृतसंस्तुतिः ॥ २५॥ फणीश्वरमहाहारो रुद्राक्षकृतकङ्कणः । वीणापाणिर्गानरतो
    ढक्कावाद्यप्रियो वशी ॥ २६॥ विशालवक्षाः शैलेन्द्रजामाताऽमरसत्तमः । हृत्तमोनाशको बुद्धो जगत्कन्दार्दनो
    बली ॥ २७॥ पलाशपुष्पपूज्याङ्घ्रिः पलाशनवरप्रदः । सागरान्तर्गतो घोरः सद्योजातोऽम्बिकासखः ॥ २८॥ वामदेवः
    सामगीतः सोमः सोमकलाधरः । निःसीम महिमोदारो दू(दा)रिताखिलपातकः ॥ २९॥ तपनान्तर्गतो धाता धेनुपुत्रवरप्रदः
    । बाणहस्तप्रदो नेता नमुचेर्वीर्यवर्धनः ॥ ३०॥ नागाजिनाङ्गो नागेशो नागेशवरभूषणः । अगेशशायी भूतेशो गणकोलाहलप्रियः
    ॥ ३१॥ प्रसन्नास्योऽनेकबाहुः शूलधृक् कालतापनः । कोलप्रमथनः कूर्ममहाखर्पटधारकः ॥ ३२॥ मारसिह्माजिनधरो
    महालाङ्गलधृग्बली । ककुदुन्मथनो हेतुरहेतुः सर्वकारणः ॥ ३३॥ कृशानुरेताः सोत्फुल्लभालनेत्रोऽमरारिहा ।
    मृगबालधरो धन्वी शक्रबाहुविभञ्जकः ॥ ३४॥ दक्षयज्ञप्रमथनः प्रमथाधिपतिः शिवः । शतावर्तो युगावर्तो मेघावर्तो
    दुरासदः ॥ ३५॥ मनोजवो जातजनो वेदाधारः सनातनः । पाण्डरागोः(ङ्गो)गोऽजिनाङ्गः कर्मन्दिजनवत्सलः ॥ ३६॥ चातुर्होत्रो
    वीरहोता शतरुद्रीयमध्यगः । भीमो रुद्र उदावर्तो विषमाक्षोऽरुणेश्वरः ॥ ३७॥ यक्षराजनुतो नाथो नीतिशास्त्रप्रवर्तकः
    । कपालपाणिर्भगवान्वैयाघ्रत्वगलङ्कृतः ॥ ३८॥ मोक्षसारोऽध्वराध्यक्ष ध्वजजीवो मरुत्सखः । आरुणेयस्त्वगध्यक्षो
    कामनारहितस्तरुः ॥ ३९॥ बिल्वपूज्यो बिल्वनीशो हरिदश्वोऽपराजितः । बृहद्रथन्तरस्तुत्यो वामदेव्यस्तवप्रियः
    ॥ ४०॥ अघोरतर रोचिष्णुर्गम्भीरो मन्युरीश्वरः । कलिप्रवर्तको योगी साङ्ख्यमायाविशारदः ॥ ४१॥ विधारको धैर्यधुर्यः
    सोमधामान्तरस्थितः । शिपिविष्टो गह्वरेष्टो ज्येष्ठो देवः कनिष्ठकः ॥ ४२॥ पिनाकहस्तोऽवरजो वर्षहरीश्वरः
    । कवची च निषङ्गी च रथघोषोऽमितप्रभः ॥ ४३॥ कालञ्जरो दन्दशूको विदर्भेशो गणातिगः । गभस्तीशो मुनिश्रेष्ठो
    महर्षिः संशितव्रतः ॥ ४४॥ कर्णिकारवनावासी करवीरसुमप्रियः । नीलोत्पलमहास्रग्वी करहाटपुरेश्वरः ॥ ४५॥
    शतर्चनः परानन्दो ब्राह्मणार्च्योपवीतवान् । बली बालप्रियो धर्मो हिरण्यपतिरप्पतिः ॥ ४६॥ यमप्रमथनोष्णीषी
    चक्रहस्तः पुरान्तकः । वसुषेणोऽङ्गनादेहः कौलाचारप्रवर्तकः ॥ ४७॥ तन्त्राध्यक्षो मन्त्रमयो गायत्रीमध्यगः
    शुचिः । वेदात्मा यज्ञसम्प्रीतो गरिष्ठः पारदः कली ॥ ४८॥ ऋग्यजुःसामरूपात्मा सर्वात्मा क्रतुरीश्वरः ।
    हिरण्यगर्भजनको हिरण्याक्षवरप्रदः ॥ ४९॥ दमिताशेषपाषण्डो दण्डहस्तो दुरासदः । दूर्वार्चनप्रियकरो रन्तिदेवोऽमरेश्वरः
    ॥ ५०॥ अमृतात्मा महादेवो हरः संहारकारकः । त्रिगुणो विखना वाग्मी त्वङ्मांसरुधिरांशकः ॥ ५१॥ वत्सप्रियोऽथ
    सानुस्थो विष्णू रक्तप्रियो गुरुः । किरातवेषः शोणात्मा रत्नगर्भोऽरुणेक्षणः ॥ ५२॥ सुरासवबलिप्रीतस्तत्पूर्षोऽगन्धदेहवान्
    । व्योमकेशः कोशहीनः कल्पनारहितोऽक्षमी ॥ ५३॥ सहमानश्च विव्याधी स्फटिकोपलनिर्मलः । मृत्युञ्जयो दुराध्यक्षो
    भक्तिप्रीतो भयापहः ॥ ५४॥ गन्धर्वगानसुप्रीतो विष्णुगर्भोऽमितद्युतिः । ब्रह्मस्तुतः सूर्यनेत्रो वीतिहोत्रोऽर्जुनान्तकः
    ॥ ५५॥ गर्वापहारको वाग्मी कुम्भसम्भवपूजितः । मलयो विन्ध्यनिलयो महेन्द्रो मेरुनायकः ॥ ५६॥ पार्वतीनायकोऽजय्यो
    जङ्गमाजङ्गमाश्रयः । कुरुविन्दोऽरुणो धन्वी अस्थिभूषो निशाकरः ॥ ५७॥ (कुरुविन्दारुणो धन्वी अस्थिभूषो
    निशाकरः) ॥ ५७॥ समुद्रमथनोद्भूतकालकूटविषादनः । सुरासुरेन्द्रवरदो दयामूर्तिः सहस्रपात् ॥ ५८॥ कारणो वीरणः
    पुत्री जन्तुगर्भे गरादनः । श्रीशैलमूलनिलयः श्रीमदभ्रसभापतिः ॥ ५९॥ दक्षिणामूर्तिरनघो जलन्धरनिपातनः
    । दक्षिणो यजमानात्मा दीक्षितो दैत्यनाशनः ॥ ६०॥ कल्माषपादपूज्याङ्घ्रिरतिदो तुरगप्रियः । उमाधवो दीनदयो
    दाता दान्तो दयापरः ॥ ६१॥ श्रीमद्दक्षिणकैलासनिवासो जनवत्सलः । दर्भरोमा बलोन्नेता तामसोऽन्नविवर्धनः
    ॥ ६२॥ नमस्कारप्रियो नाथ आनन्दात्मा सनातनः । तमालनीलसुगलः कुतर्कविनिवारकः ॥ ६३॥ कामरूपः प्रशान्तात्मा
    कारणानां च कारणः । तृणपाणिः कान्तिपरो मणिपाणिः कुलाचलः ॥ ६४॥ कस्तूरीतिलकाक्रान्तभालो भस्मत्रिपुण्ड्रवान्
    । वारणाङ्गालङ्कृताङ्गो महापापनिवारणः ॥ ६५॥ प्रकाशरूपो गुह्यात्मा बालरूपो बिलेशयः । भिक्षुप्रियो भक्ष्यभोक्ता
    भरद्वाजप्रियो वशी ॥ ६७॥ कर्मण्यस्तारकोभूत कारणो यानहर्षदः । (कर्मण्योनारकोद्भूत कारणो यानहर्षदः) ।
    वृषगामी धर्मगोप्ता कामी कामाङ्गनाशनः ॥ ६८॥ कारुण्यो वाजरूपात्मा निर्धर्मो ग्रामणीः प्रभुः । अरण्यः
    पशुहर्षश्च सौनिको मेघवाहनः ॥ ६९॥ कुमारगुरूरानन्दो वामनो वाग्भवो युवा । स्वर्धुनीधन्यमौलिश्च तरुराजो
    महामनाः ॥ ७०॥ कणाशनस्ताम्रघनो मयप्रीतोऽजरामरः । कौणपारिः भालनेत्रो वर्णाश्रमपरायणः ॥ ७१॥ पुराणवृन्दसम्प्रीत
    इतिहासविशारदः । समर्थो नमिताशेषदेवो द्योतकरः फणी ॥ ७२॥ कर्षको लाङ्गलेशश्च मेरुधन्वा प्रजापतिः । उग्रः
    पशुपतिर्गोप्ता पवमानो विभावसुः ॥ ७३॥ उदावसुर्वीतराग उर्वीशो वीर्यवर्धनः । ज्वालमालोऽजिताङ्गश्च वैद्युदग्निप्रवर्तकः
    ॥ ७४॥ कमनीयाकृतिः पाता आषाढो(ढः)षण्ढवर्जितः । पुलिन्दरूपः पुण्यात्मा पुण्यपापफलप्रदः ॥ ७५॥ गार्हपत्यो
    दक्षिणाग्निः सभ्यो वसथभृत्कविः । द्रुम आहवनीयश्च तस्करोऽथ मयस्करः ॥ ७६॥ शाङ्करो वारिदोऽवार्यो वातचक्रप्रवर्तकः
    । कुलिशायुधहस्तश्च विकृतो जटिलः शिखी ॥ ७७॥ सौराष्ट्रवासी देवेड्यः सह्यजातीरसंस्थितः । महाकायो वीतभयो
    गणगीतो विशारदः ॥ ७८॥ तपस्वी तापसाचार्यो द्रुमहस्तोज्ज्वलत्प्रभुः । किन्दमो मङ्कणः प्रीतो जातुकर्णिस्तुतिप्रियः
    ॥ ७९॥ वेनो वैन्यो विशाखश्चाऽकम्पनः सोमधारकः । उपायदो दारिताङ्गो नानागमविशारदः ॥ ८०॥ काव्यालापैककुशलो
    मीमांसावल्लभो ध्रुवः । तालमूलनिकेन्तश्च बिल्वमूलप्रपूजितः ॥ ८१॥ वेदाङ्गो गमनोऽगम्यो गव्यः प्रातः फलादनः
    । गङ्गातीरस्थितो लिङ्गी अलिङ्गो रूपसंश्रयः ॥ ८२॥ श्रान्तिहा पुण्यनिलयः पललाशोऽर्कपूजितः । महेन्द्रविष्णुजनको
    ब्रह्मतातस्तुतोऽव्ययः ॥ ८३॥ कर्दमेशो मतङ्गेशो विश्वेशो गन्धधारकः । विशालो विमलो जिष्णुर्जयशीलो जयप्रदः
    ॥ ८४॥ दारिद्र्यमथनो मन्त्री शम्भुः शशिकलाधरः । शिंशुमारः शौनकेज्यः श्वानपः श्वेतजीवदः ॥ ८५॥ मुनिबालप्रियोऽगोत्रो
    मिलिन्दो मन्त्रसंस्थितः । काशीशः कामिताङ्गश्च वल्लकीवादनप्रियः ॥ ८६॥ हल्लीसलास्यनिपुणः सल्लीलो वल्लरीप्रियः
    । महापारद संवीर्यो वह्निनेत्रो जटाधरः ॥ ८७॥ आलापोऽनेकरूपात्मा पुरुषः प्रकृतेः परः । स्थाणुर्वेणुवनप्रीतो
    रणजित्पाकशासनः ॥ ८८॥ नग्नो निराकृतो धूम्रो वैद्युतो विश्वनायकः । विश्वाधिकः शान्तरवः शाश्वतः सुमुखो
    महान् ॥ ८९॥ अणोरणुः श्वभ्रगतः (तोह्य) अवटेशो नटेश्वरः । चित्रधामा चित्रभानुर्विचित्राकृतिरीश्वरः ॥
    ९०॥ इन्द्रोऽजोऽमूर्तिरूपात्मा(ह्य)अमूर्तो वह्निधारकः । अपस्मारहरो गुप्तो योगिध्येयोऽखिलादनः ॥ ९१॥
    नक्षत्ररूपः क्षत्रात्मा क्षुत्तृष्णाश्रमवर्जितः । असङ्गो भूतहृदयो वालखिल्यो मरीचिपः ॥ ९२॥ पञ्चप्रेतासनासीनो
    योगिनीगणसेवितः । नानाभाषानुचतो (नुवचनो) नानादेशसमाश्रयः ॥ ९३॥ वृन्दारकगणस्तुत्यः पुरन्दरनतिप्रियः
    । प्रघसो विघसाशी च (चाप्य) अन्नाधिपतिरन्नदः ॥ ९४॥ पन्नगाभरणो योगी गुरुर्लौकिकनायकः । विराजो (विरजो,
    विरजा) विश्वतोधर्मी बभ्रुशो बाहुकप्रियः ॥ ९५॥ प्रधाननिपुणो मित्रो ह्यूर्ध्वरेता महातपाः । कुरुजाङ्गलवासी
    च नित्यतृप्तो निरञ्जनः ॥ ९६॥ हिरण्यगर्भो भूतादिस्वराट् सम्राराड्विराड्वटुः । पटहध्वनिसम्प्रीतो नतमुक्तिप्रदायकः
    ॥ ९७॥ फलप्रदः भालनेत्रः फणीश्वरमहाङ्गधृक् । वास्तुपो वासवो वात्यो वर्मभिद्वसनोज्ज्वलः ॥ ९८॥ मीढुष्टमः
    शिवतमो वसुः शिवतरो बली । निधनेशो निधानेशः पुरुजिद्राष्ट्रवर्धनः ॥ ९९॥ अयुतायुः शतायुश्च प्रमितायुः
    शताध्वरः । सहस्रशृङ्गो वृषभ उरुगायोरुमीढुकः ॥ १००॥ गन्ता गमयिता गाता गरुत्मान् गीतवर्धनः । रागरागिणिकाप्रीतस्तालपाणिर्गदापहः
    ॥ १०१॥ देवेशः खण्डपरशुः प्रचण्डतरविक्रमः । उरुक्रमो महाबाहुर्हेतिधृक्पावकादनः ॥ १०२॥ गणिकानाट्यनिरतो
    विमर्शो वावदूककः । कलिप्रमथनो धीरो धीरोदात्तो महाहनुः ॥ १०३॥ क्षयद्वीरोमुञ्जि(मञ्जु)केश कल्मलीकः(की)
    सुरोत्तमः । वज्राङ्गो वायुजनको ह्यष्टमूर्तिः कृपाकरः ॥ १०४॥ प्रहूतः परमोदारः पञ्चाक्षरपरायणः । कर्कन्धुः
    कामदहनो मलिनाक्षो जडाजडः ॥ १०५॥ कुबेरपूजितपदो महातक्षककङ्कणः । शङ्खणो मधुरारावो मृङः सस्पिञ्जरोऽजरः
    ॥ १०६॥ मार्गो मार्गप्रदो मुक्तो विजितारिः परोऽवरः । प्रणवार्थो वेदमयो वेदान्ताम्बुज भास्करः ॥ १०७॥
    सर्वविद्याधिपः सौम्यो यज्ञेशः क्षेत्रनायकः । पापनाशकरो दिव्यो गोभिलो गोपरो गणः ॥ १०८॥ गणेशपूजितपदो
    ललिताम्बामनोहरः । कक्षवासो महोक्षाङ्को निस्तमस्तोमवर्जितः ॥ १०९॥ निःसीममहिमोदारः प्रभामूर्तिः प्रसन्न(दृ)क्
    । स्तोभप्रीतो भारभूतो भूभारहरणः स्थिरः ॥ ११०॥ क्षराक्षरोधरो धर्ता सागरान्तर्गतो वशी । रम्यो रस्यो
    रजस्योऽथ प्रवाह्यो वैद्युतोऽनलः ॥ १११॥ सिकत्यो वाद्य उर्वर्यो मेध्य ईध्रिय वाक्पटुः । प्रपञ्चमायारहितः
    कीर्तिदो वीर्यवर्धनः ॥ ११२॥ कालचक्रान्तरहितो नित्यानित्योऽथ चेतनः । गर्वोन्नतो भटाकारो मृगयुर्भवहा
    भवः ॥ ११३॥ शङ्गः शताङ्गः शीताङ्गो नागाङ्गो भस्मभूषणः । त्रियम्बकोऽम्बिकाभर्ता नन्दिकेशः प्रसादकृत्
    ॥ ११४॥ चण्डीशवरदो दिव्यो मायाविद्याविशारदः । मृगाङ्कशेखरो भव्यो गौरीपूज्यो दयामयः ॥ ११५॥ प्रमाथनोऽविकथनो
    गर्गो वीणाप्रियः पटुः । वर्णी वनस्थो यतिराट् गूढगर्भो विरोचनः ॥ ११६॥ शबरो बर्बरो धौम्यो विराड्रूपः
    स्थितिप्रदः । महाकारुणिको भ्रान्तिनाशकः शोकहा प्रभुः ॥ ११७॥ अशोकपुष्पपूज्याङ्घ्रिर्मणिभद्रो धनेश्वरः
    । अमृतेशोद्रुतगतिस्तगरोऽर्जुनमध्यगः ॥ ११८॥ दमो विरोधहृत्कान्तो नीतिज्ञो विष्णुपूजितः । सुमप्रियो वातमयो
    वरीयान्कर्मठो यमः ॥ ११९॥ दिगम्बरो(रः) शममयो धूमपः शुक्रगर्भकः । अट्टहासोऽतल्पशय आसीनो धावमानकः ॥ १२०॥
    तुराषाण्मेघमध्यस्थो विपाशातीरसंस्थितः । कुलोन्नतः कुलीनश्च व्यवहारप्रवर्तकः ॥ १२१॥ केतुमालो हरिद्राङ्गो
    द्रावि(वी) पुष्पमयो भृगुः । विशोषकोर्वीनिरतस्त्वग्जातो रुधिक(र)प्रियः ॥ १२२॥ अकैतक(व)हृदावासः क्षपानाथकलाधरः
    । नक्तञ्चरोदिवाचारी दिव्यदेहो विनाशकः ॥ १२३॥ कदम्बवनमध्यस्थो हरिद्रागोर्मिमध्यगः । यमुनाजलमध्यस्थो
    जालकोऽजमखो वसुः ॥ १२४॥ वसुप्रदो वीरवर्यः शूलहस्तः प्रतापवान् । खड्गहस्तो मण्डलात्मा मृत्युर्मृत्युजिदीश्वरः
    ॥ १२५॥ लङ्कावासो मेघमालो गन्धमादनसंस्थितः । भैरवो भरणो भर्ता भ्रातृव्यो नामरूपगः ॥ १२६॥ अव्याकृतात्मा
    भूतात्मा पञ्चभूतान्तरोऽस्मयः । अहनन्यः शब्दमय कालाधरः कलाधरः ॥ १२७॥ भृगुतुङ्गश्चीरवासी(साः) कैवर्तोऽनायकोऽर्धकः
    । करेणुपो गन्धमदश्चाम्पेयकुसुमप्रियः ॥ १२८॥ भद्रदश्चर्मवसनो वैराजस्तोत्रकारकः । सुमप्रीतः सामगीती
    उर्जो वर्चः कुलेश्वरः ॥ १२९॥ ककुद्मान् पीतवसनो वध्येशो नारदःपिता । क्रव्यादनो नीतिमयो धर्मचक्रप्रवर्तकः
    ॥ १३०॥ शष्यः फेन्यो विनीर्णेता कङ्कणोऽनासिकोऽचलः । एणाङ्कः शलभाकारः शालूरो ग्रामसंस्थितः ॥ १३१॥ महाविशेषकथनो
    वारितीरास्थितोऽचलः । कृपीटयोनिः शान्तात्मा गुणवान् ज्ञानवाञ्छुचिः ॥ १३२॥ सर्वपापहरोऽलिङ्गो भगमालोऽप्रतारणः
    । आनन्दधन आतार्य इरिण्योऽथप्रपथ्यकः ॥ १३३॥ गङ्गातीरस्थितो देवो ह्यविमुक्तसमाश्रयः । महाश्मशाननिलयोऽवलयो
    वालिपूजितः ॥ १३४॥ करन्धमो व्रात्यवर्यो मानवो जीवकोऽशठः । कर्मदेवमयो ब्रह्मा ऋतं सत्यं महेश्वरः ॥ १३५॥
    सुमङ्गलः सुखमयो ज्ञानानन्दोऽमिताशनः । मनोमयः प्राणमयो विज्ञानात्मा प्रसादनः ॥ १३६॥ आनन्दमयकोशात्मा
    धर्मसीमाथ भूमकः । सदाशिवो विशिष्टात्मा वसिष्ठार्चितपादुकः ॥ १३७॥ नीलग्रीवः सैन्यपालो दिशानाथो नतिप्रियः
    । केशवोन्मथनो मौनी मधुसूदनसूदनः ॥ १३८॥ उदुम्बरकरो डिम्भो बम्भरः पिञ्छिलातलः । मूलस्तालकरो वर्ण्योऽपर्णादः
    प्राणमाश(ष)कः ॥ १३९॥ अपर्णापतिरीशास्योऽसम्पूर्णः पूर्णरूपवान् । दीपमालो जाङ्गलिको वैतुण्डस्तुण्डकः
    प्रियः ॥ १४०॥ ऊलूकः कलविङ्कोऽथ शुकनादप्रसादकृत् । जैगीषव्यतपःप्रीतो रावणेन्द्रबलार्दनः ॥ १४१॥ मार्कण्डेयमहामृत्युनाशको
    ज्ञानधारकः । अहर्गणक्रियातीतः सर्पप्रीतोऽनिलाशनः ॥ १४२॥ वेगाधारो धैर्यधनो धनधान्यप्रदायकः । नाद्यो
    वैद्यो वाद्यरतो गद्यपद्यस्तुतो द्युकः ॥ १४३॥ भेरीभाङ्कारनिरतो मृगचर्मविधायकः । पुण्यकीर्तिः पुण्यलभ्यो
    मोहनास्त्रविशारदः ॥ १४४॥ कैलासशिखरावासः पारिजातवनाश्रयः । ईला(डा)दिरवसम्प्रीतो माहेन्द्रस्तुतिहर्षितः
    ॥ १४५॥ यूपवाटो भार वह कोमलाङ्गो जनाश्रयः । विश्वामित्रप्रियो बालः पाकयज्ञरतः सुखी ॥ १४६॥ वामाचारप्रियोन्नेता
    शक्तिहस्तो दुरासदः । सर्वाकारः शाश्वतात्मा वाङ्मनोदूरगो हरः ॥ १४७॥ - - फलश्रुतिः । इत्येतन्नामसाहस्रं
    शेषाशेषमुखोद्गतम् । शम्भोर्दिव्यं मुनिश्रेष्ठ श्रवणात्पापनाशनम् ॥ १४८॥ सर्वान्कामानवाप्नोति शिवार्चनपरायणः
    । त्वमेभिर्मुनिमुख्यैश्च शृण्वन्भक्तिमवाप्नुयाः ॥ १४९॥ कुमारी पतिमाप्नोति निर्धनो धनवान्भवेत् । जयार्थी
    जयमाप्नोति क्षयद्वीरप्रसादतः ॥ १५०॥ ॥ इति शिवरहस्यान्तर्गते आदिशेषकृतं शिवसहस्रनामस्तोत्रं सम्पूर्णम्
    ॥ - ॥ श्रीशिवरहस्यम् । सदाशिवाख्यः नवमांशः । अध्यायः २ सहस्रनामकथनम् । १-१५०॥ - ॥ श्रीशिवरहस्यम् ।
    सदाशिवाख्यः नवमांशः । अध्यायः २ सहस्रनामकथनम् । १-१५०॥ णोतेस्:'
