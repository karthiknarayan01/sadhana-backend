id: devaihkritam11vishnustotram
category: stotram
name:
  english: devaihkritam11vishnustotram
  devanagari: देवैःकृतं११विष्णुस्तोत्रम्
content:
  english: devaih kritam 11 vishnustotram deva ucuh | namo'nantaya brihate kurmaya vai namo namah || 12||
    nrisimharupayograya namo varaharupine | raghavaya ca ramaya brahmane'nantashaktaye || 13|| vasudevaya
    shantaya yadunam pataye namah | namo buddhaya shuddhaya kalkaye mlecchanashine || 14|| iti shriskandapurane
    avantyakhande avantikshetramahatmye dvicatvarimshadhyayantargatam devaih kritam vishnustotram samaptam
    | skandapurana | avantyakhanda | avantyakhanda | adhyaya 42
  devanagari: देवैः कृतं ११ विष्णुस्तोत्रम् देवा ऊचुः । नमोऽनन्ताय बृहते कूर्माय वै नमो नमः ॥ १२॥ नृसिंहरूपायोग्राय
    नमो वाराहरूपिणे । राघवाय च रामाय ब्रह्मणेऽनन्तशक्तये ॥ १३॥ वासुदेवाय शान्ताय यदूनां पतये नमः । नमो
    बुद्धाय शुद्धाय कल्कये म्लेच्छनाशिने ॥ १४॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे अवन्तीक्षेत्रमाहात्म्ये
    द्विचत्वारिंशाध्यायान्तर्गतं देवैः कृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । आवन्त्यखण्ड । आवन्त्यखण्ड
    । अध्याय ४२
meaning: {}
