id: ashtavakra-gita-chapter-10
category: stotram
name:
  english: Ashtavakra Gita Chapter 10
content:
  english: ashtavakra uvaca || vihaya vairinam kamamartham canarthasankulam | dharmamapyetayorhetum sarvatranadaram
    kuru || || svapnendrajalavat pashya dinani trini panca va | mitrakshetradhanagaradaradayadisampadah
    || || yatra yatra bhavettrishna samsaram viddhi tatra vai | praudhavairagyamashritya vitatrishnah
    sukhi bhava || || trishnamatratmako bandhastannasho moksha ucyate | bhavasamsaktimatrena praptitushtirmuhurmuhuh
    || || tvamekashcetanah shuddho jadam vishvamasattatha | avidyapi na kincitsa ka bubhutsa tathapi te
    || || rajyam sutah kalatrani sharirani sukhani ca | samsaktasyapi nashtani tava janmani janmani ||
    || alamarthena kamena sukritenapi karmana | ebhyah samsarakantare na vishrantamabhun manah || || kritam
    na kati janmani kayena manasa gira | duhkhamayasadam karma tadadyapyuparamyatam ||
  devanagari: अष्टावक्र उवाच ॥ विहाय वैरिणं काममर्थं चानर्थसङ्कुलम् । धर्ममप्येतयोर्हेतुं सर्वत्रानादरं
    कुरु ॥ ॥ स्वप्नेन्द्रजालवत् पश्य दिनानि त्रीणि पञ्च वा । मित्रक्षेत्रधनागारदारदायादिसम्पदः ॥ ॥ यत्र
    यत्र भवेत्तृष्णा संसारं विद्धि तत्र वै । प्रौढवैराग्यमाश्रित्य वीततृष्णः सुखी भव ॥ ॥ तृष्णामात्रात्मको
    बन्धस्तन्नाशो मोक्ष उच्यते । भवासंसक्तिमात्रेण प्राप्तितुष्टिर्मुहुर्मुहुः ॥ ॥ त्वमेकश्चेतनः शुद्धो
    जडं विश्वमसत्तथा । अविद्यापि न किञ्चित्सा का बुभुत्सा तथापि ते ॥ ॥ राज्यं सुताः कलत्राणि शरीराणि सुखानि
    च । संसक्तस्यापि नष्टानि तव जन्मनि जन्मनि ॥ ॥ अलमर्थेन कामेन सुकृतेनापि कर्मणा । एभ्यः संसारकान्तारे
    न विश्रान्तमभून् मनः ॥ ॥ कृतं न कति जन्मानि कायेन मनसा गिरा । दुःखमायासदं कर्म तदद्याप्युपरम्यताम्
    ॥
