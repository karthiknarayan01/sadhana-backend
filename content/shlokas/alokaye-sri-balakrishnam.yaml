id: alokaye-sri-balakrishnam
category: stotram
name:
  english: Alokaye Sri Balakrishnam
content:
  english: adi pallavi alokaye shri bala krishnam sakhi ananda sundara tandava krishnam ||alokaye|| caranam
    carana nikvanita nupura krishnam kara sangata kanaka kankana krishnam ||alokaye|| kinkini jala ghana
    ghanita krishnam loka shankita taravali mauktika krishnam ||alokaye|| caranam sundara nasa mauktika
    shobhita krishnam nanda nandanam akhanda vibhuti krishnam kanthopa kantha shobhi kaustubha krishnam
    kali kalmasha timira bhaskara krishnam navanita khantha dadhi cora krishnam bhakta bhava pasha bandha
    mocana krishnam ||alokaye|| nila megha shyama sundara krishnam nitya nirmalananda bodha lakshana krishnam
    vamshi nada vinoda sundara krishnam paramahamsa kula shamsita carita krishnam ||alokaye|| caranam
    govatsa brinda palaka krishnam krita gopika cala khelana krishnam nanda sunandadi vandita krishnam
    shri narayana tirtha varada krishnam ||alokaye||
  devanagari: आदि पल्लवि आलोकये श्री बाल कृष्णं सखि आनन्द सुन्दर ताण्डव कृष्णम् ॥आलोकये॥ चरणं चरण निक्वणित
    नूपुर कृष्णं कर सङ्गत कनक कङ्कण कृष्णम् ॥आलोकये॥ किङ्किणी जाल घण घणित कृष्णं लोक शङ्कित तारावलि मौक्तिक
    कृष्णम् ॥आलोकये॥ चरणं सुन्दर नासा मौक्तिक शोभित कृष्णं नन्द नन्दनं अखण्ड विभूति कृष्णं कण्ठोप कण्ठ
    शोभि कौस्तुभ कृष्णं कलि कल्मष तिमिर भास्कर कृष्णं नवनीत खण्ठ दधि चोर कृष्णं भक्त भव पाश बन्ध मोचन
    कृष्णम् ॥आलोकये॥ नील मेघ श्याम सुन्दर कृष्णं नित्य निर्मलानन्द बोध लक्षण कृष्णं वंशी नाद विनोद सुन्दर
    कृष्णं परमहंस कुल शंसित चरित कृष्णम् ॥आलोकये॥ चरणं गोवत्स बृन्द पालक कृष्णं कृत गोपिका चाल खेलन कृष्णं
    नन्द सुनन्दादि वन्दित कृष्णं श्री नारायण तीर्थ वरद कृष्णम् ॥आलोकये॥
