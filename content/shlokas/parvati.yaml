id: parvati
category: stotram
name:
  english: parvati
  devanagari: पार्वती
content:
  english: parvatistotram vibudhadhipatejinishakante vadanabhajitayaminishakante | navakundavirajamanadante
    nalinabham pranamamyaham padam te || 1|| vikacamburuham vilasacorairatishitaih pravahaddayambupuraih
    | shashishekharacittanrittarangaistarasalokaya devi mamapangaih || 2|| avanidharanayakasya kanye kripanam
    mam paripalayatidhanye | vidhimadhavavasavadimanye drutamunmulitabhaktalokadainye || 3|| kucaninditashatakumbhashaile
    manikancivalayollasaddukule | paripalaya mam bhavani bale trijagadrakshanajagarukalile || 4|| svaruca
    jitataptashatakumbhe kacashobhajitakalameghadambhe | paripalaya mam trasannishumbhe makutollasisudhamayukhadimbhe
    || 5|| kusumayudhajivanakshikone parito mamava padmaragashone | smaravairivashikritapravine caranabjanatasatkriyadhurine
    || 6|| girije gaganopamavalagne giritungastanagauravena bhugne | vasa me hridaye tavangalagne tava
    samdarshanamodasindhumagne || 7|| sakalopanishatsarojavatikalahamsyastava me kavitvadhati | kripayavirabhudiyam
    tu peti vahatu tvadgunaramyaratnakotih || 8|| || iti shriparvatistotram sampurnam||
  devanagari: पार्वतीस्तोत्रम् विबुधाधिपतेजिनीशकान्ते वदनाभाजितयामिनीशकान्ते । नवकुन्दविराजमानदन्ते नलिनाभं
    प्रणमाम्यहं पदं ते ॥ १॥ विकचाम्बुरुहां विलासचोरैरतिशीतैः प्रवहद्दयाम्बुपूरैः । शशिशेखरचित्तनृत्तरङ्गैस्तरसालोकय
    देवि मामपाङ्गैः ॥ २॥ अवनीधरनायकस्य कन्ये कृपणं मां परिपालयातिधन्ये । विधिमाधववासवादिमान्ये द्रुतमुन्मूलितभक्तलोकदैन्ये
    ॥ ३॥ कुचनिन्दितशातकुम्भशैले मणिकाञ्चीवलयोल्लसद्दुकूले । परिपालय मां भवानि बाले त्रिजगद्रक्षणजागरूकलीले
    ॥ ४॥ स्वरुचा जिततप्तशातकुम्भे कचशोभाजितकालमेघडम्भे । परिपालय मां त्रसन्निशुम्भे मकुटोल्लासिसुधामयूखडिम्भे
    ॥ ५॥ कुसुमायुधजीवनाक्षिकोणे परितो मामव पद्मरागशोणे । स्मरवैरिवशीकृतप्रवीणे चरणाब्जानतसत्क्रियाधुरीणे
    ॥ ६॥ गिरिजे गगनोपमावलग्ने गिरितुङ्गस्तनगौरवेण भुग्ने । वस मे हृदये तवाङ्गलग्ने तव संदर्शनमोदसिन्धुमग्ने
    ॥ ७॥ सकलोपनिषत्सरोजवाटीकलहंस्यास्तव मे कवित्वधाटी । कृपयाविरभूदियं तु पेटी वहतु त्वद्गुणरम्यरत्नकोटीः
    ॥ ८॥ ॥ इति श्रीपार्वतीस्तोत्रं संपूर्णम्॥
