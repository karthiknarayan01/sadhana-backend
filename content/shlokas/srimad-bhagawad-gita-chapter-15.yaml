id: srimad-bhagawad-gita-chapter-15
category: stotram
name:
  english: Srimad Bhagawad Gita Chapter 15
content:
  english: om shri paramatmane namah atha pancadasho'dhyayah | purushottamapraptiyogah shribhagavanuvaca
    urdhvamulamadhahshakhamashvattham prahuravyayam | chandamsi yasya parnani yastam veda sa vedavit ||
    || adhashcordhvam prasritastasya shakha gunapravriddha vishayapravalah| adhashca mulanyanusantatani
    karmanubandhini manushyaloke || || na rupamasyeha tathopalabhyate nanto na cadirna ca sampratishtha|
    ashvatthamenam suvirudhamulamasangashastrena dridhena chittva || || tatah padam tatparimargitavyam
    yasmingata na nivartanti bhuyah| tameva cadyam purusham prapadye yatah pravrittih prasrita purani
    || || nirmanamoha jitasangadosha adhyatmanitya vinivrittakamah| dvandvairvimuktah sukhaduhkhasanjnairgacchantyamudhah
    padamavyayam tat || || na tadbhasayate suryo na shashanko na pavakah | yadgatva na nivartante taddhama
    paramam mama || || mamaivamsho jivaloke jivabhutah sanatanah | manahshashthanindriyani prakritisthani
    karshati || || shariram yadavapnoti yaccapyutkramatishvarah | grihitvaitani samyati vayurgandhanivashayat
    || || shrotram cakshuh sparshanam ca rasanam ghranameva ca | adhishthaya manashcayam vishayanupasevate
    || || utkramantam sthitam vapi bhunjanam va gunanvitam | vimudha nanupashyanti pashyanti jnanacakshushah
    || || yatanto yoginashcainam pashyantyatmanyavasthitam | yatanto'pyakritatmano nainam pashyantyacetasah
    || || yadadityagatam tejo jagadbhasayate'khilam | yaccandramasi yaccagnau tattejo viddhi mamakam ||
    || gamavishya ca bhutani dharayamyahamojasa | pushnami caushadhih sarvah somo bhutva rasatmakah ||
    || aham vaishvanaro bhutva praninam dehamashritah | pranapanasamayuktah pacamyannam caturvidham ||
    || sarvasya caham hridi sannivishto mattah smritirjnanamapohanam ca| vedaishca sarvairahameva vedyo
    vedantakridvedavideva caham || || dvavimau purushau loke ksharashcakshara eva ca | ksharah sarvani
    bhutani kutastho'kshara ucyate || || uttamah purushastvanyah paramatmetyudhahritah | yo lokatrayamavishya
    bibhartyavyaya ishvarah || || yasmatksharamatito'hamaksharadapi cottamah | ato'smi loke vede ca prathitah
    purushottamah || || yo mamevamasammudho janati purushottamam | sa sarvavidbhajati mam sarvabhavena
    bharata || || iti guhyatamam shastramidamuktam mayanagha | etadbuddhva buddhimansyatkritakrityashca
    bharata || || om tatsaditi shrimadbhagavadgitasupanishatsu brahmavidyayam yogashastre shrikrishnarjunasamvade
    purushottamayogo nama pancadasho'dhyayah ||
  devanagari: ॐ श्री परमात्मने नमः अथ पञ्चदशोऽध्यायः । पुरुषोत्तमप्राप्तियोगः श्रीभगवानुवाच ऊर्ध्वमूलमधःशाखमश्वत्थं
    प्राहुरव्ययम् । छन्दांसि यस्य पर्णानि यस्तं वेद स वेदवित् ॥ ॥ अधश्चोर्ध्वं प्रसृतास्तस्य शाखा गुणप्रवृद्धा
    विषयप्रवालाः। अधश्च मूलान्यनुसन्ततानि कर्मानुबन्धीनि मनुष्यलोके ॥ ॥ न रूपमस्येह तथोपलभ्यते नान्तो
    न चादिर्न च सम्प्रतिष्ठा। अश्वत्थमेनं सुविरूढमूलमसङ्गशस्त्रेण दृढेन छित्त्वा ॥ ॥ ततः पदं तत्परिमार्गितव्यं
    यस्मिन्गता न निवर्तन्ति भूयः। तमेव चाद्यं पुरुषं प्रपद्ये यतः प्रवृत्तिः प्रसृता पुराणी ॥ ॥ निर्मानमोहा
    जितसङ्गदोषा अध्यात्मनित्या विनिवृत्तकामाः। द्वन्द्वैर्विमुक्ताः सुखदुःखसञ्ज्ञैर्गच्छन्त्यमूढाः पदमव्ययं
    तत् ॥ ॥ न तद्भासयते सूर्यो न शशाङ्को न पावकः । यद्गत्वा न निवर्तन्ते तद्धाम परमं मम ॥ ॥ ममैवांशो जीवलोके
    जीवभूतः सनातनः । मनःषष्ठानीन्द्रियाणि प्रकृतिस्थानि कर्षति ॥ ॥ शरीरं यदवाप्नोति यच्चाप्युत्क्रामतीश्वरः
    । गृहीत्वैतानि संयाति वायुर्गन्धानिवाशयात् ॥ ॥ श्रोत्रं चक्षुः स्पर्शनं च रसनं घ्राणमेव च । अधिष्ठाय
    मनश्चायं विषयानुपसेवते ॥ ॥ उत्क्रामन्तं स्थितं वापि भुञ्जानं वा गुणान्वितम् । विमूढा नानुपश्यन्ति
    पश्यन्ति ज्ञानचक्षुषः ॥ ॥ यतन्तो योगिनश्चैनं पश्यन्त्यात्मन्यवस्थितम् । यतन्तोऽप्यकृतात्मानो नैनं
    पश्यन्त्यचेतसः ॥ ॥ यदादित्यगतं तेजो जगद्भासयतेऽखिलम् । यच्चन्द्रमसि यच्चाग्नौ तत्तेजो विद्धि मामकम्
    ॥ ॥ गामाविश्य च भूतानि धारयाम्यहमोजसा । पुष्णामि चौषधीः सर्वाः सोमो भूत्वा रसात्मकः ॥ ॥ अहं वैश्वानरो
    भूत्वा प्राणिनां देहमाश्रितः । प्राणापानसमायुक्तः पचाम्यन्नं चतुर्विधम् ॥ ॥ सर्वस्य चाहं हृदि सन्निविष्टो
    मत्तः स्मृतिर्ज्ञानमपोहनं च। वेदैश्च सर्वैरहमेव वेद्यो वेदान्तकृद्वेदविदेव चाहम् ॥ ॥ द्वाविमौ पुरुषौ
    लोके क्षरश्चाक्षर एव च । क्षरः सर्वाणि भूतानि कूटस्थोऽक्षर उच्यते ॥ ॥ उत्तमः पुरुषस्त्वन्यः परमात्मेत्युधाहृतः
    । यो लोकत्रयमाविश्य बिभर्त्यव्यय ईश्वरः ॥ ॥ यस्मात्क्षरमतीतोऽहमक्षरादपि चोत्तमः । अतोऽस्मि लोके वेदे
    च प्रथितः पुरुषोत्तमः ॥ ॥ यो मामेवमसम्मूढो जानाति पुरुषोत्तमम् । स सर्वविद्भजति मां सर्वभावेन भारत
    ॥ ॥ इति गुह्यतमं शास्त्रमिदमुक्तं मयानघ । एतद्बुद्ध्वा बुद्धिमान्स्यात्कृतकृत्यश्च भारत ॥ ॥ ॐ तत्सदिति
    श्रीमद्भगवद्गीतासूपनिषत्सु ब्रह्मविद्यायां योगशास्त्रे श्रीकृष्णार्जुनसंवादे पुरुषोत्तमयोगो नाम पञ्चदशोऽध्यायः
    ॥
