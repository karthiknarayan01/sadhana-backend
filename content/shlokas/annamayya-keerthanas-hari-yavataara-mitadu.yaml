id: annamayya-keerthanas-hari-yavataara-mitadu
category: stotram
name:
  english: Annamayya Keerthanas Hari Yavataara Mitadu
content:
  english: hari yavatara mitadu annamayya | araya ma guruditadu annamayya | vaikuntha nathuni vadda vadi
    padu cunna vadu akaramai tallapaka annamayya | akasapu vishnu padamandu nityamai unna vadu akadikada
    tallapaka annamayya || ivala samsara lila indireshuto nunna vadu avatinci tallapaka annamayya | bhavimpa
    shri venkateshu padamulande yunnavadu hava bhavamai tallapaka annamayya || kshirabdhishayi batti sevimpucu
    nunnavadu ariteri tallapaka annamayya | dhirudai suryamandala tejamu vadda nunnavadu aritula tallapaka
    annamayya ||
  devanagari: हरि यवतार मीतडु अन्नमय्य । अरय मा गुरुडीतडु अन्नमय्य । वैकुण्ठ नाथुनि वद्द वडि पडु चुन्न
    वाडु आकरमै ताल्लपाक अन्नमय्य । आकसपु विष्णु पादमन्दु नित्यमै उन्न वाडु आकडीकड ताल्लपाक अन्नमय्य ॥
    ईवल संसार लील इन्दिरेशुतो नुन्न वाडु आवटिञ्चि ताल्लपाक अन्नमय्य । भाविम्प श्री वेङ्कटेशु पदमुलन्दे
    युन्नवाडु हाव भावमै ताल्लपाक अन्नमय्य ॥ क्षीराब्धिशायि बट्टि सेविम्पुचु नुन्नवाडु आरितेरि ताल्लपाक
    अन्नमय्य । धीरुडै सूर्यमण्डल तेजमु वद्द नुन्नवाडु आरीतुल ताल्लपाक अन्नमय्य ॥
