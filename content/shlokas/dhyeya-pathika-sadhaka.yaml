id: dhyeya-pathika-sadhaka
category: stotram
name:
  english: Dhyeya Pathika Sadhaka
  devanagari: ध्येयपथिकसाधक
content:
  english: dhyeyapathikasadhaka karyapathe sadhaya mridu hasan madhukiran mataram sada smaran || jivanam
    na shashvatam, vaibhavam na hi sthiram svarthalepanam vina, yatkritam hi tacciram saralata svajivane
    cintane sadoccata samajaposhita vayam samajaposhakashciram || 1|| yacca manasi cintyate, yacca kirtyate
    gira tacca murtarupatam, eti nityajivane jananyananyacaranayoh samarpitasvajivanah dhyeyasadhanavrata
    vayam bhavema sangatah || 2|| smaratvihagrajanmanam, tyagabalisamarpanam simhakulasamudbhavah simhavikrama
    vayam santu kashtakotayo bhavatu vighnavarshanam sakritpratijnaka vayam bhajema no palayanam || 3||
    - shri janardana hegade
  devanagari: ध्येयपथिकसाधक कार्यपथे साधय मृदु हसन् मधुकिरन् मातरं सदा स्मरन् ॥ जीवनं न शाश्वतं, वैभवं
    न हि स्थिरं स्वार्थलेपनं विना, यत्कृतं हि तच्चिरं सरलता स्वजीवने चिन्तने सदोच्चता समाजपोषिता वयं समाजपोषकाश्चिरम्
    ॥ १॥ यच्च मनसि चिन्त्यते, यच्च कीर्त्यते गिरा तच्च मूर्तरूपताम्, एति नित्यजीवने जनन्यनन्यचरणयोः समर्पितस्वजीवनाः
    ध्येयसाधनव्रता वयं भवेम सङ्गताः ॥ २॥ स्मरत्विहाग्रजन्मनां, त्यागबलिसमर्पणं सिंहकुलसमुद्भवाः सिंहविक्रमा
    वयं सन्तु कष्टकोटयो भवतु विघ्नवर्षणं सकृत्प्रतिज्ञका वयं भजेम नो पलायनम् ॥ ३॥ - श्री जनार्दन हेगडे
