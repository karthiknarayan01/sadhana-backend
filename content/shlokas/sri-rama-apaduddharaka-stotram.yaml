id: sri-rama-apaduddharaka-stotram
category: stotram
name:
  english: Sri Rama Apaduddharaka Stotram
content:
  english: apadamapahartaram dataram sarvasampadam | lokabhiramam shriramam bhuyo bhuyo namamyaham ||
    namah kodandahastaya sandhikritasharaya ca | danditakhiladaityaya ramayapannivarine || || apannajanarakshaikadikshayamitatejase
    | namo'stu vishnave tubhyam ramayapannivarine || || padambhojarajassparshapavitramuniyoshite | namo'stu
    sitapataye ramayapannivarine || || danavendramahamattagajapancasyarupine | namo'stu raghunathaya ramayapannivarine
    || || mahijakucasamlagnakunkumarunavakshase | namah kalyanarupaya ramayapannivarine || || padmasambhava
    bhutesha munisamstutakirtaye | namo martandavamshyaya ramayapannivarine || || haratyartim ca lokanam
    yo va madhunishudanah | namo'stu haraye tubhyam ramayapannivarine || || tapakaranasamsaragajasimhasvarupine
    | namo vedantavedyaya ramayapannivarine || || rangattarangajaladhigarvahriccharadharine | namah prataparupaya
    ramayapannivarine || || daropahitacandravatamsadhyatasvamurtaye | namah satyasvarupaya ramayapannivarine
    || || taranayakasankashavadanaya mahaujase | namo'stu tatakahantre ramayapannivarine || || ramyasanulasaccitrakutashramaviharine
    | namah saumitrisevyaya ramayapannivarine || || sarvadevahitasakta dashananavinashine | namo'stu duhkhadhvamsaya
    ramayapannivarine || || ratnasanunivasaika vandyapadambujaya ca | namastrailokyanathaya ramayapannivarine
    || || samsarabandhamokshaikahetudhamaprakashine | namah kalushasamhartre ramayapannivarine || || pavanashuga
    sankshipta maricadi suraraye | namo makhaparitratre ramayapannivarine || || dambhiketarabhaktaughamahadanandadayine
    | namah kamalanetraya ramayapannivarine || || lokatrayodvegakara kumbhakarnashirashchide | namo niradadehaya
    ramayapannivarine || || kakasuraikanayanaharallilastradharine | namo bhaktaikavedyaya ramayapannivarine
    || || bhikshurupasamakranta balisarvaikasampade | namo vamanarupaya ramayapannivarine || || rajivanetrasuspanda
    rucirangasurocishe | namah kaivalyanidhaye ramayapannivarine || || mandamarutasamvita mandaradrumavasine
    | namah pallavapadaya ramayapannivarine || || shrikanthacapadalanadhurinabalabahave | namah sitanushaktaya
    ramayapannivarine || || rajarajasuhridyosharcita mangalamurtaye | nama ikshvakuvamshyaya ramayapannivarine
    || || manjuladarshaviprekshanotsukaikavilasine | namah palitabhaktaya ramayapannivarine || || bhuribhudhara
    kodandamurti dhyeyasvarupine | namo'stu tejonidhaye ramayapannivarine || || yogindrahritsarojatamadhupaya
    mahatmane | namo rajadhirajaya ramayapannivarine || || bhuvarahasvarupaya namo bhuripradayine | namo
    hiranyagarbhaya ramayapannivarine || || yoshanjalivinirmukta lajancitavapushmate | namah saundaryanidhaye
    ramayapannivarine || || nakhakotivinirbhinnadaityadhipativakshase | namo nrisimharupaya ramayapannivarine
    || || mayamanushadehaya vedoddharanahetave | namo'stu matsyarupaya ramayapannivarine || || mitishunya
    mahadivyamahimne manitatmane | namo brahmasvarupaya ramayapannivarine || || ahankaretarajana svantasaudhaviharine
    | namo'stu citsvarupaya ramayapannivarine || || sitalakshmanasamshobhiparshvaya paramatmane | namah
    pattabhishiktaya ramayapannivarine || || agratah prishthatashcaiva parshvatashca mahabalau | akarnapurnadhanvanau
    rakshetam ramalakshmanau || || sannaddhah kavaci khadgi capabanadharo yuva | tishthanmamagrato nityam
    ramah patu salakshmanah || || apadamapahartaram dataram sarvasampadam | lokabhiramam shriramam bhuyo
    bhuyo namamyaham || phalashruti imam stavam bhagavatah pathedyah pritamanasah | prabhate va pradoshe
    va ramasya paramatmanah || || sa tu tirtva bhavambodhimapadassakalanapi | ramasayujyamapnoti devadevaprasadatah
    || || karagrihadibadhasu samprapte bahusankate | apannivarakastotram pathedyastu yathavidhih || ||
    samyojyanushtubham mantramanushlokam smaranvibhum | saptahatsarvabadhabhyo mucyate natra samshayah
    || || dvatrimshadvarajapatah pratyaham tu dridhavratah | vaishakhe bhanumalokya pratyaham shatasankhyaya
    || || dhanavan dhanadaprakhyassa bhavennatra samshayah | bahunatra kimuktena yam yam kamayate narah
    || || tam tam kamamavapnoti stotrenanena manavah | yantrapujavidhanena japahomaditarpanaih || || yastu
    kurvita sahasa sarvankamanavapnuyat | iha loke sukhi bhutva pare mukto bhavishyati ||
  devanagari: आपदामपहर्तारं दातारं सर्वसम्पदाम् । लोकाभिरामं श्रीरामं भूयो भूयो नमाम्यहम् ॥ नमः कोदण्डहस्ताय
    सन्धीकृतशराय च । दण्डिताखिलदैत्याय रामायापन्निवारिणे ॥ ॥ आपन्नजनरक्षैकदीक्षायामिततेजसे । नमोऽस्तु
    विष्णवे तुभ्यं रामायापन्निवारिणे ॥ ॥ पदाम्भोजरजस्स्पर्शपवित्रमुनियोषिते । नमोऽस्तु सीतापतये रामायापन्निवारिणे
    ॥ ॥ दानवेन्द्रमहामत्तगजपञ्चास्यरूपिणे । नमोऽस्तु रघुनाथाय रामायापन्निवारिणे ॥ ॥ महिजाकुचसंलग्नकुङ्कुमारुणवक्षसे
    । नमः कल्याणरूपाय रामायापन्निवारिणे ॥ ॥ पद्मसम्भव भूतेश मुनिसंस्तुतकीर्तये । नमो मार्ताण्डवंश्याय
    रामायापन्निवारिणे ॥ ॥ हरत्यार्तिं च लोकानां यो वा मधुनिषूदनः । नमोऽस्तु हरये तुभ्यं रामायापन्निवारिणे
    ॥ ॥ तापकारणसंसारगजसिंहस्वरूपिणे । नमो वेदान्तवेद्याय रामायापन्निवारिणे ॥ ॥ रङ्गत्तरङ्गजलधिगर्वहृच्छरधारिणे
    । नमः प्रतापरूपाय रामायापन्निवारिणे ॥ ॥ दारोपहितचन्द्रावतंसध्यातस्वमूर्तये । नमः सत्यस्वरूपाय रामायापन्निवारिणे
    ॥ ॥ तारानायकसङ्काशवदनाय महौजसे । नमोऽस्तु ताटकाहन्त्रे रामायापन्निवारिणे ॥ ॥ रम्यसानुलसच्चित्रकूटाश्रमविहारिणे
    । नमः सौमित्रिसेव्याय रामायापन्निवारिणे ॥ ॥ सर्वदेवहितासक्त दशाननविनाशिने । नमोऽस्तु दुःखध्वंसाय रामायापन्निवारिणे
    ॥ ॥ रत्नसानुनिवासैक वन्द्यपादाम्बुजाय च । नमस्त्रैलोक्यनाथाय रामायापन्निवारिणे ॥ ॥ संसारबन्धमोक्षैकहेतुधामप्रकाशिने
    । नमः कलुषसंहर्त्रे रामायापन्निवारिणे ॥ ॥ पवनाशुग सङ्क्षिप्त मारीचादि सुरारये । नमो मखपरित्रात्रे
    रामायापन्निवारिणे ॥ ॥ दाम्भिकेतरभक्तौघमहदानन्ददायिने । नमः कमलनेत्राय रामायापन्निवारिणे ॥ ॥ लोकत्रयोद्वेगकर
    कुम्भकर्णशिरश्छिदे । नमो नीरददेहाय रामायापन्निवारिणे ॥ ॥ काकासुरैकनयनहरल्लीलास्त्रधारिणे । नमो भक्तैकवेद्याय
    रामायापन्निवारिणे ॥ ॥ भिक्षुरूपसमाक्रान्त बलिसर्वैकसम्पदे । नमो वामनरूपाय रामायापन्निवारिणे ॥ ॥ राजीवनेत्रसुस्पन्द
    रुचिराङ्गसुरोचिषे । नमः कैवल्यनिधये रामायापन्निवारिणे ॥ ॥ मन्दमारुतसंवीत मन्दारद्रुमवासिने । नमः पल्लवपादाय
    रामायापन्निवारिणे ॥ ॥ श्रीकण्ठचापदलनधुरीणबलबाहवे । नमः सीतानुषक्ताय रामायापन्निवारिणे ॥ ॥ राजराजसुहृद्योषार्चित
    मङ्गलमूर्तये । नम इक्ष्वाकुवंश्याय रामायापन्निवारिणे ॥ ॥ मञ्जुलादर्शविप्रेक्षणोत्सुकैकविलासिने । नमः
    पालितभक्ताय रामायापन्निवारिणे ॥ ॥ भूरिभूधर कोदण्डमूर्ति ध्येयस्वरूपिणे । नमोऽस्तु तेजोनिधये रामायापन्निवारिणे
    ॥ ॥ योगीन्द्रहृत्सरोजातमधुपाय महात्मने । नमो राजाधिराजाय रामायापन्निवारिणे ॥ ॥ भूवराहस्वरूपाय नमो
    भूरिप्रदायिने । नमो हिरण्यगर्भाय रामायापन्निवारिणे ॥ ॥ योषाञ्जलिविनिर्मुक्त लाजाञ्चितवपुष्मते । नमः
    सौन्दर्यनिधये रामायापन्निवारिणे ॥ ॥ नखकोटिविनिर्भिन्नदैत्याधिपतिवक्षसे । नमो नृसिंहरूपाय रामायापन्निवारिणे
    ॥ ॥ मायामानुषदेहाय वेदोद्धरणहेतवे । नमोऽस्तु मत्स्यरूपाय रामायापन्निवारिणे ॥ ॥ मितिशून्य महादिव्यमहिम्ने
    मानितात्मने । नमो ब्रह्मस्वरूपाय रामायापन्निवारिणे ॥ ॥ अहङ्कारेतरजन स्वान्तसौधविहारिणे । नमोऽस्तु
    चित्स्वरूपाय रामायापन्निवारिणे ॥ ॥ सीतालक्ष्मणसंशोभिपार्श्वाय परमात्मने । नमः पट्टाभिषिक्ताय रामायापन्निवारिणे
    ॥ ॥ अग्रतः पृष्ठतश्चैव पार्श्वतश्च महाबलौ । आकर्णपूर्णधन्वानौ रक्षेतां रामलक्ष्मणौ ॥ ॥ सन्नद्धः कवची
    खड्गी चापबाणधरो युवा । तिष्ठन्ममाग्रतो नित्यं रामः पातु सलक्ष्मणः ॥ ॥ आपदामपहर्तारं दातारं सर्वसम्पदाम्
    । लोकाभिरामं श्रीरामं भूयो भूयो नमाम्यहम् ॥ फलश्रुति इमं स्तवं भगवतः पठेद्यः प्रीतमानसः । प्रभाते
    वा प्रदोषे वा रामस्य परमात्मनः ॥ ॥ स तु तीर्त्वा भवाम्बोधिमापदस्सकलानपि । रामसायुज्यमाप्नोति देवदेवप्रसादतः
    ॥ ॥ कारागृहादिबाधासु सम्प्राप्ते बहुसङ्कटे । आपन्निवारकस्तोत्रं पठेद्यस्तु यथाविधिः ॥ ॥ संयोज्यानुष्टुभं
    मन्त्रमनुश्लोकं स्मरन्विभुम् । सप्ताहात्सर्वबाधाभ्यो मुच्यते नात्र संशयः ॥ ॥ द्वात्रिंशद्वारजपतः प्रत्यहं
    तु दृढव्रतः । वैशाखे भानुमालोक्य प्रत्यहं शतसङ्ख्यया ॥ ॥ धनवान् धनदप्रख्यस्स भवेन्नात्र संशयः । बहुनात्र
    किमुक्तेन यं यं कामयते नरः ॥ ॥ तं तं काममवाप्नोति स्तोत्रेणानेन मानवः । यन्त्रपूजाविधानेन जपहोमादितर्पणैः
    ॥ ॥ यस्तु कुर्वीत सहसा सर्वान्कामानवाप्नुयात् । इह लोके सुखी भूत्वा परे मुक्तो भविष्यति ॥
