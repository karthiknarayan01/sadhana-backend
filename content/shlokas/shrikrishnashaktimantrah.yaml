id: shrikrishnashaktimantrah
category: mantra
name:
  english: shrikrishnashaktimantrah
  devanagari: श्रीकृष्णशक्तिमन्त्राः
content:
  english: om asya shrisandhinishaktimantrasya gargarishih | panktichandah | shrisandhinishaktirdevata
    | shrim bijam | adhyatmikasthairyapraptyarthe jape viniyogah || mantrah
  devanagari: ॐ अस्य श्रीसन्धिनीशक्तिमन्त्रस्य गर्गऋषिः । पङ्क्तिछन्दः । श्रीसन्धिनीशक्तिर्देवता । श्रीं
    बीजम् । आध्यात्मिकस्थैर्यप्राप्त्यर्थे जपे विनियोगः ॥ मन्त्रः
meaning: {}
