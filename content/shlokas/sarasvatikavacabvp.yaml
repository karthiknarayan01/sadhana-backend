id: sarasvatikavacabvp
category: kavacha
name:
  english: sarasvatikavacaBVP
  devanagari: सरस्वतीकवचBVP
content:
  english: ringo bharadvajashca''stiko devalastatha | jaigishavyo'tha jabaliryatddhritva sarvapujitah
    || 71|| kavacasyasya viprendra rishiresha prajapatih | svayam brihaspatishchando devo raseshvarah
    prabhuh || 72|| sarvatattvaparijnane sarvarthe'pi ca sadhane | kavitasu ca sarvasu viniyogah prakirtitah
    || 73|| om hrim sarasvatyai svaha shiro me patu sarvatah | shrim vagdevatayai svaha bhalam me sarvada'vatu
    || 74|| om sarasvatyai svaheti shrotram patu nirantaram | om shrim hrim bhartyai svaha netrayugmam
    sada'vatu || 75|| om hrim vagvadinyai svaha nasam me sarvato'vatu | hrim vidyadhishthatridevyai svaha
    shrotram sada'vatu || 76|| om shrim hrim brahmyai svaheti dantapanktih sada'vatu | aimityekaksharo
    mantro mama kantham sada'vatu || 77|| om shrim hrim patu me grivam skandham me shrim sada'vatu | shrim
    vidyadhishthatridevyai svaha vakshah sada'vatu || 78|| om hrim vidyasvarupayai svaha me patu nabhikam
    | om hrim klim vanyai svaheti mama prshtham sada'vatu || 79|| om sarvavarnatmikayai padayugmam sada'vatu
    | om vagadhishthatridevyai sarvangam me sada'vatu || 80|| om sarvakanthavasinyai svaha pracyam sada'vatu
    | om hrim jihvagravasinyai svaha'gnidishi rakshatu || 81|| om aim shrim hrim sarasvatyai budhajananyai
    svaha | satatam mantrarajo'yam dakshine mam sada'vatu || 82|| om hrim shrim tryaksharo mantro nairrityam
    me sada'vatu | kavijihvagravasinyai svaha mam varune'vatu || 83|| om sadambakayai svaha vayavyai mam
    sada'vastu | om gadyapadyavasinyai svaha mamuttare'vatu || 84|| om sarvashastravasinyai svahaishanyam
    sada'vatu | om hrim sarvapujitayai svaha cordhvam sada'vatu || 85|| om hrim pustakavasinyai svaha'dho
    mam sada'vatu | om granthabijarupayai svaha mam sarvato'vatu || 86|| iti te kathitam vipra sarvamantraughavigraham
    | idam vishvajayam nama kavacam brahmarupakam || 87|| pura shrutam dharmavaktratparvate gandhmadane
    | tava snehanmaya''khyatam pravaktavyam na kasyacit || 88|| gurumabhyarcya vidhivadvastralamkaracandanaih
    | pranamya dandavadbhumau kavacam dharayetsudhih || 89|| pancalakshajapenaiva siddham tu kavacam bhavet
    | yadi syatsiddhakavaco brihaspatisamo bhavet || 90|| mahavagmi kavindrashca trailokyavijayi bhavet
    | shaknoti sarvm jetum sa kavacasya prabhavatah || 91|| idam te kanvashakhoktam kathitam kavacam mune
    | stotram pujavidhanam ca dhyanam vai vandanam tatha || 92|| iti shri brahmavaivarte mahapurane prakritikhande
    naradanarayanasamvade sarasvatikavacam nama caturtho'dhyayah || 4||
  devanagari: ृङ्गो भरद्वाजश्चाऽऽस्तीको देवलस्तथा । जैगीषव्योऽथ जाबालिर्यत्द्धृत्वा सर्वपूजितः ॥ ७१॥ कवचस्यास्य
    विप्रेन्द्र ऋषिरेष प्रजापतिः । स्वयं बॄहस्पतिश्छन्दो देवो रासेश्वरः प्रभुः ॥ ७२॥ सर्वतत्त्वपरिज्ञाने
    सर्वार्थेऽपि च साधने । कवितासु च सर्वासु विनियोगः प्रकीर्तितः ॥ ७३॥ ओं ह्रीं सरस्वत्यै स्वाहा शिरो
    मे पातु सर्वतः । श्रीं वाग्देवतायै स्वाहा भालं मे सर्वदाऽवतु ॥ ७४॥ ओं सरस्वत्यै स्वाहेति श्रोत्रं
    पातु निरन्तरम् । ओं श्रीं ह्रीं भार्त्यै स्वाहा नेत्रयुग्मं सदाऽवतु ॥ ७५॥ ओं ह्रीं वाग्वादिन्यै स्वाहा
    नासां मे सर्वतोऽवतु । ह्रीं विद्याधिष्ठातृदेव्यै स्वाहा श्रोत्रं सदाऽवतु ॥ ७६॥ ओं श्रीं ह्रीं ब्राह्म्यै
    स्वाहेति दन्तपङ्क्तीः सदाऽवतु । ऐमित्येकाक्षरो मन्त्रो मम कण्ठं सदाऽवतु ॥ ७७॥ ओं श्रीं ह्रीं पातु
    मे ग्रीवां स्कन्धं मे श्रीं सदाऽवतु । श्रीं विद्याधिष्ठातृदेव्यै स्वाहा वक्षः सदाऽवतु ॥ ७८॥ ओं ह्रीं
    विद्यास्वरूपायै स्वाहा मे पातु नाभिकाम् । ओं ह्रीं क्लीं वाण्यै स्वाहेति मम प्र्ष्ठं सदाऽवतु ॥ ७९॥
    ओं सर्ववर्णात्मिकायै पादयुग्मं सदाऽवतु । ओं वागधिष्ठातृदेव्यै सर्वाङ्गं मे सदाऽवतु ॥ ८०॥ ओं सर्वकण्ठवासिन्यै
    स्वाहा प्रच्यां सदाऽवतु । ओं ह्रीं जिह्वाग्रवासिन्यै स्वाहाऽग्निदिशि रक्षतु ॥ ८१॥ ओं ऐं श्रीं ह्रीं
    सरस्वत्यै बुधजनन्यै स्वाहा । सततं मन्त्रराजोऽयं दक्षिणे मां सदाऽवतु ॥ ८२॥ ओं ह्रीं श्रीं त्र्यक्षरो
    मन्त्रो नैरॄत्यां मे सदाऽवतु । कविजिह्वाग्रवासिन्यै स्वाहा मां वारुणेऽवतु ॥ ८३॥ ओं सदम्बकायै स्वाहा
    वायव्यै मां सदाऽवस्तु । ओं गद्यपद्यवासिन्यै स्वाहा मामुत्तरेऽवतु ॥ ८४॥ ओं सर्वशास्त्रवासिन्यै स्वाहैशान्यां
    सदाऽवतु । ओं ह्रीं सर्वपूजितायै स्वाहा चोर्ध्वं सदाऽवतु ॥ ८५॥ ओं ह्रीं पुस्तकवासिन्यै स्वाहाऽधो मां
    सदाऽवतु । ओं ग्रन्थबीजरूपायै स्वाहा मां सर्वतोऽवतु ॥ ८६॥ इति ते कथितं विप्र सर्वमन्त्रौघविग्रहम् ।
    इदं विश्वजयं नाम कवचं ब्रह्मारूपकम् ॥ ८७॥ पुरा श्रुतं धर्मवक्त्रात्पर्वते गन्ध्मादने । तव स्नेहान्मयाऽऽख्यातं
    प्रवक्तव्यं न कस्यचित् ॥ ८८॥ गुरुमभ्यर्च्य विधिवद्वस्त्रालंकारचन्दनैः । प्रणम्य दण्डवद्भूमौ कवचं धारयेत्सुधीः
    ॥ ८९॥ पञ्चलक्षजपेनैव सिद्धं तु कवचं भवेत् । यदि स्यात्सिद्धकवचो बृहस्पतिसमो भवेत् ॥ ९०॥ महावाग्मी
    कवीन्द्रश्च त्रैलोक्यविजयी भवेत् । शक्नोति सर्व्ं जेतुं स कवचस्य प्रभावतः ॥ ९१॥ इदं ते काण्वशाखोक्तं
    कथितं कवचं मुने । स्तोत्रं पूजाविधानं च ध्यानं वै वन्दनं तथा ॥ ९२॥ इति श्री ब्रह्मवैवर्ते महापुराणे
    प्रकृतिखण्डे नारदनारायणसंवादे सरस्वतीकवचं नाम चतुर्थोऽध्यायः ॥ ४॥
