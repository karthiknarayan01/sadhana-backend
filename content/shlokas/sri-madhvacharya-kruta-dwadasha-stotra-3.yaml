id: sri-madhvacharya-kruta-dwadasha-stotra-3
category: stotram
name:
  english: Sri Madhvacharya Kruta Dwadasha Stotra - 3
content:
  english: atha tritiyastotram kuru bhunkshva ca karma nijam niyatam haripadavinamradhiya satatam | harireva
    paro harireva guruh harireva jagatpitrimatrigatih || || na tato'styaparam jagadidyatamam paramatparatah
    purushottamatah | tadalam bahulokavicintanaya pravanam kuru manasamishapade || || yatato'pi hareh
    padasamsmarane sakalam hyaghamashu layam vrajati | smaratastu vimuktipadam paramam sphutameshyati
    tatkimapakriyate || rinutamalasatyavacah paramam shapatheritam ucchritabahuyugam | na hareh paramo
    na hareh sadrishah paramah sa tu sarva cidatmaganat || || yadi nama paro na bhaveta harih kathamasya
    vashe jagadetadabhut | yadi nama na tasya vashe sakalam kathameva tu nityasukham na bhavet || || na
    ca karmavimamala kalagunaprabhritishamacittanu taddhi yatah | cidacittanu sarvamasau tu hariryamayediti
    vaidikamasti vacah || || vyavaharabhida'pi gurorjagatam na tu cittagata sa hi codyaparam | bahavah
    purushah purushapravaro harirityavadatsvayameva harih || || caturanana purvavimuktagana harimetya
    tu purvavadeva sada | niyatoccavinicatayaiva nijam sthitimapuriti sma param vacanam || || anandatirthasannamna
    purnaprajnabhidhayuja | kritam haryashtakam bhaktya pathatah priyate harih || || iti shrimadanandatirthabhagavatpadacarya
    viracitam dvadashastotreshu tritiyastotram sampurnam
  devanagari: अथ तृतीयस्तोत्रम् कुरु भुङ्क्ष्व च कर्म निजं नियतं हरिपादविनम्रधिया सततम् । हरिरेव परो हरिरेव
    गुरुः हरिरेव जगत्पितृमातृगतिः ॥ ॥ न ततोऽस्त्यपरं जगदीड्यतमं परमात्परतः पुरुषोत्तमतः । तदलं बहुलोकविचिन्तनया
    प्रवणं कुरु मानसमीशपदे ॥ ॥ यततोऽपि हरेः पदसंस्मरणे सकलं ह्यघमाशु लयं व्रजति । स्मरतस्तु विमुक्तिपदं
    परमं स्फुटमेष्यति तत्किमपाक्रियते ॥ ऋणुतामलसत्यवचः परमं शपथेरितं उच्छ्रितबाहुयुगम् । न हरेः परमो न
    हरेः सदृशः परमः स तु सर्व चिदात्मगणात् ॥ ॥ यदि नाम परो न भवेत हरिः कथमस्य वशे जगदेतदभूत् । यदि नाम
    न तस्य वशे सकलं कथमेव तु नित्यसुखं न भवेत् ॥ ॥ न च कर्मविमामल कालगुणप्रभृतीशमचित्तनु तद्धि यतः । चिदचित्तनु
    सर्वमसौ तु हरिर्यमयेदिति वैदिकमस्ति वचः ॥ ॥ व्यवहारभिदाऽपि गुरोर्जगतां न तु चित्तगता स हि चोद्यपरम्
    । बहवः पुरुषाः पुरुषप्रवरो हरिरित्यवदत्स्वयमेव हरिः ॥ ॥ चतुरानन पूर्वविमुक्तगणा हरिमेत्य तु पूर्ववदेव
    सदा । नियतोच्चविनीचतयैव निजां स्थितिमापुरिति स्म परं वचनम् ॥ ॥ आनन्दतीर्थसन्नाम्ना पूर्णप्रज्ञाभिधायुजा
    । कृतं हर्यष्टकं भक्त्या पठतः प्रीयते हरिः ॥ ॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य विरचितं द्वादशस्तोत्रेषु
    तृतीयस्तोत्रं सम्पूर्णम्
