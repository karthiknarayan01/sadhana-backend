id: bhishmakritam1shrikrishnastotram
category: stotram
name:
  english: bhishmakritam1shrikrishnastotram
  devanagari: भीष्मकृतं१श्रीकृष्णस्तोत्रम्
content:
  english: bhishmakritam 1 shrikrishnastotram shribhishma uvaca | iti matirupakalpita vitrishna bhagavati
    satvatapungave vibhumni | svasukhamupagate kvacidvihartum prakritimupeyushi yadbhavapravahah || 32||
    tribhuvanakamanam tamalavarnam ravikaragauravarambaram dadhane | vapuralakakulavritananabjam vijayasakhe
    ratirastu me'navadya || 33|| yudhi turagarajovidhumravishvak kacalulitashramavaryalankritasye | mama
    nishitasharairvibhidyamana
  devanagari: भीष्मकृतं १ श्रीकृष्णस्तोत्रम् श्रीभीष्म उवाच । इति मतिरुपकल्पिता वितृष्णा भगवति सात्वतपुङ्गवे
    विभूम्नि । स्वसुखमुपगते क्वचिद्विहर्तुं प्रकृतिमुपेयुषि यद्भवप्रवाहः ॥ ३२॥ त्रिभुवनकमनं तमालवर्णं
    रविकरगौरवराम्बरं दधाने । वपुरलककुलावृताननाब्जं विजयसखे रतिरस्तु मेऽनवद्या ॥ ३३॥ युधि तुरगरजोविधूम्रविष्वक्
    कचलुलितश्रमवार्यलङ्कृतास्ये । मम निशितशरैर्विभिद्यमान
meaning: {}
