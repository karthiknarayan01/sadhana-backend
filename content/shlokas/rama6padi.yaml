id: rama6padi
category: stotram
name:
  english: rama6padi
  devanagari: राम६पदि
content:
  english: shriramashatpadi shri ganeshaya namah | taranikulajalatarane tarunataranitejasa vibhatarane
    | kritavidashadashamukhamukhatimiragane'ntastamo nuda me || 1|| shayavidhritasharasharasana nikhilakhalojjasanaprathitasuyashah
    | mathitahridayantaralam dushkritijalam mamapanaya || 2|| suruciramaricinicayamshcarananakhendunudaya
    mama hridaye | hridayesha vikalatapam svasakalatapam kilapahara || 3|| indivaradalasundara varadalasadvamajanakijane
    | jane tvamakhilesham leshalasallokalokesham || 4|| sham kuru shankaravallabha yallabhatamashvayam
    tvadamghriyuge | anuraktidridham bhaktim cirasya cintabdhibhavabhaktim || 5|| vairajarajarajo'pyabhutsusaketarajanararajah
    | vanararajasahayo lilakaivalyametaddhi || 6|| jagadasusutasuparavasumude yadesha stutih krita sphita
    | sa ramashatpadiyam vilasatu tatpadajalajate || 7|| || iti shrimanmalaviyashukla shrimanmathuranathapranita
    ramashatpadi samapta ||
  devanagari: श्रीरामषट्पदी श्री गणेशाय नमः । तरणिकुलजलतरणे तरुणतरणितेजसा विभातरणे । कृतविदशदशमुखमुखतिमिरगणेऽन्तस्तमो
    नुद मे ॥ १॥ शयविधृतशरशरासन निखिलखलोज्जासनप्रथितसुयशाः । मथितहृदयान्तरालं दुष्कृतिजालं ममापनय ॥ २॥
    सुरुचिरमरीचिनिचयांश्चरणनखेन्दूनुदाय मम हृदये । हृदयेश विकलतापं स्वसकलतापं किलापहर ॥ ३॥ इन्दीवरदलसुन्दर
    वरदलसद्वामजानकीजाने । जाने त्वामखिलेशं लेशलसल्लोकलोकेशम् ॥ ४॥ शं कुरु शङ्करवल्लभ यल्लभतामाश्वयं त्वदंघ्रियुगे
    । अनुरक्तिदृढां भक्तिं चिरस्य चिन्ताब्धिभवभक्तिम् ॥ ५॥ वैराजराजराजोऽप्यभूत्सुसाकेतराजनरराजः । वानरराजसहायो
    लीलाकैवल्यमेतद्धि ॥ ६॥ जगदसुसुतासुपरवसुमुदे यदेषा स्तुतिः कृता स्फीता । सा रामषट्पदीयं विलसतु तत्पादजलजाते
    ॥ ७॥ ॥ इति श्रीमन्मालवीयशुक्ल श्रीमन्मथुरानाथप्रणीता रामषट्पदी समाप्ता ॥
