  devanagari: मेधादक्षिणामूर्तिसहस्रनामावली १
content:
  english: shrimedhadakshinamurtisahasranamavalih 1 shrih asya shri medhadakshinamurtisahasranamastotrasya
    brahma rishih | gayatri chandah | dakshinamurtirdevata | om bijam | svaha shaktih | namah kilakam
    | medhadakshinamurtiprasadasiddhyarthe jape viniyogah | hram ityadina anganyasah | dhyanam | siddhitoyanidhermadhye
    ratnagrive manorame | kadambavanikamadhye shrimadvatataroradhah || 1|| asinamadyam purushamadimadhyantavarjitam
    | shuddhasphatikagokshirasharatpurnendushekharam || 2|| dakshine cakshamalam ca vahnim vai vamahastake
    | jatamandalasamlagnashitamshukaramanditam || 3|| nagaharadharam carukankanaih katisutrakaih | virajamanavrishabham
    vyaghracarmambaravritam || 4|| cintamanimahavrindaih kalpakaih kamadhenubhih | catushshashtikalavidyamurtibhih
    shrutimastakaih || 5|| ratnasimhasane sadhudvipicarmasamayutam | tatrashtadalapadmasya karnikayam
    sushobhane || 6|| virasane samasinam lambadakshapadambujam | jnanamudram pustakam ca varabhitidharam
    haram || 7|| padamulasamakrantamahapasmaravaibhavam | rudrakshamalabharanabhushitam bhutibhasuram
    || 8|| gajacarmottariyam ca mandasmitamukhambujam | siddhavrindairyogivrindairmunivrindairnishevitam
    || 9|| aradhyamanavrishabham agninduravilocanam | purayantam kripadrishtya pumarthanashrite jane ||
    10|| evam vibhavayedisham sarvavidyakalanidhim || 11|| lam ityadina pancopacarah || || shri gurubhyo
