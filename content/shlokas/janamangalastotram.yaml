id: janamangalastotram
category: stotram
name:
  english: janamangalastotram
  devanagari: जनमन्गलस्तोत्रम्
content:
  english: namastotramantrasya shatananda rishih | anushtup chandah | dharmanandanah shriharirdevata |
    dharmika iti bijam | brihadvratadhara iti shaktih | bhaktinandana iti kilakam | caturvargasiddhyarthe
    jape viniyogah | atha dhyanam | varnivesharamaniyadarshanam mandahasarucirananambujam | pujitam suranarottamairmuda
    dharmanandanamaham vicintaye || 4|| shrikrishnah shrivasudevo naranarayanah prabhuh | bhaktidharmatmajojanma
    krishno narayano harih || 5|| harikrishno ghanashyamo dharmiko bhaktinandanah | brihadvratadharah
    shuddho radhakrishneshtadaivatah || 6|| marutsutapriyah kalibhairavadyatibhishanah | jitendriyo jitaharastivravairagya
    astikah || 7|| yogeshvaro yogakalapravrittiratidhairyavan | jnani paramahamsashca tirthakrittairthikarcitah
    || 8|| kshamanidhih sadonnidro dhyananishthastapah priyah | siddheshvarah svatantrashca brahmavidyapravartakah
    || 9|| pashandochedanapatuh svasvarupacalasthitih | prashantamurtirnirdosho'suragurvadimohanah ||
    10|| atikarunyanayana uddhavadhvapravartakah | mahavratah sadhushilah sadhuvipraprapujakah || 11||
    ahimsayajnaprastota sakarabrahmavarnanah | svaminarayanah svami kaladoshanivarakah || 12|| sacchastravyasanah
    sadyahsamadhisthitikarakah | krishnarcasthapanakarah kauladvit kalitarakah || 13|| prakasharupo nirdambhah
    sarvajivahitavahah | bhaktisamposhako vagmi caturvargaphalapradah || 14|| nirmatsaro bhaktavarma buddhidata'tipavanah
    | abuddhihridbrahmadhamadarshakashcaparajitah || 15|| asamudranta satkirtih shritasamsritimocanah
    | udarah sahajanandah sadhvidharmapravartakah || 16|| kandarpadarpadalano vaishnavakratukarakah |
    pancayatanasammano naishthikavrataposhakah || 17|| pragalbho nihsprihah satyapratijno bhaktavatsalah
    | aroshano dirghadarshi shadurmivijayakshamah || 18|| nirahankritiradroha rijuh sarvopakarakah | niyamakashcopashamasthitirvinayavan
    guruh || 19|| ajatavairi nirlobho mahapurusha atmadah | akhanditarshamaryado vyasasiddhantabodhakah
    || 20|| manonigrahayuktijno yamadutavimocakah | purnakamah satyavadi gunagrahi gatasmayah || 21||
    sadacarapriyatarah punyashravanakirtanah | sarvamangalasadrupananagunaviceshtitah || 22|| ityetatparamam
    stotram janamangalasamjnitam | yah pathettena pathitam bhavedvai sarvamangalam || 23|| yah pathecchrinuyadbhaktya
    trikalam shravayecca va | etattasya tu papani nashyeyuh kila sarvashah || 24|| etatsamsevamananam
    purusharthacatushtaye | durlabham nasti kimapi harikrishnaprasadatah || 25|| bhutapretapishacanam
    dakinibrahmarakshasam | yogininam tatha balagrahadinamupadravah || 26|| abhicaro ripukrito rogashcanyo'pyupadravah
    | ayutavartanadasya nashyatyeva na samshayah || 27|| dashavritya pratidinamasyabhishtam sukham bhavet
    | grihibhistyagibhishcapi pathaniyamidam tatah || 28|| iti shrishatanandamuniviracitam shrijanamangalakhyam
    shriharyashtottarashatanamastotram sampurnam || shrijanamangalastotram
  devanagari: नामस्तोत्रमन्त्रस्य शतानन्द ऋषिः । अनुष्टुप् छन्दः । धर्मनन्दनः श्रीहरिर्देवता । धार्मिक
    इति बीजम् । बृहद्व्रतधर इति शक्तिः । भक्तिनन्दन इति कीलकम् । चतुर्वर्गसिद्ध्यर्थे जपे विनियोगः । अथ
    ध्यानम् । वर्णिवेषरमणीयदर्शनं मन्दहासरुचिराननाम्बुजम् । पूजितं सुरनरोत्तमैर्मुदा धर्मनन्दनमहं विचिन्तये
    ॥ ४॥ श्रीकृष्णः श्रीवासुदेवो नरनारायणः प्रभुः । भक्तिधर्मात्मजोजन्मा कृष्णो नारायणो हरिः ॥ ५॥ हरिकृष्णो
    घनश्यामो धार्मिको भक्तिनन्दनः । बृहद्व्रतधरः शुद्धो राधाकृष्णेष्टदैवतः ॥ ६॥ मरुत्सुतप्रियः कालीभैरवाद्यतिभीषणः
    । जितेन्द्रियो जिताहारस्तीव्रवैराग्य आस्तिकः ॥ ७॥ योगेश्वरो योगकलाप्रवृत्तिरतिधैर्यवान् । ज्ञानी परमहंसश्च
    तीर्थकृत्तैर्थिकार्चितः ॥ ८॥ क्षमानिधिः सदोन्निद्रो ध्याननिष्ठस्तपः प्रियः । सिद्धेश्वरः स्वतन्त्रश्च
    ब्रह्मविद्याप्रवर्तकः ॥ ९॥ पाषण्डोछेदनपटुः स्वस्वरूपाचलस्थितिः । प्रशान्तमूर्तिर्निर्दोषोऽसुरगुर्वादिमोहनः
    ॥ १०॥ अतिकारुण्यनयन उद्धवाध्वप्रवर्तकः । महाव्रतः साधुशीलः साधुविप्रप्रपूजकः ॥ ११॥ अहिंसयज्ञप्रस्तोता
    साकारब्रह्मवर्णनः । स्वामिनारायणः स्वामी कालदोषनिवारकः ॥ १२॥ सच्छास्त्रव्यसनः सद्यःसमाधिस्थितिकारकः
    । कृष्णार्चास्थापनकरः कौलद्विट् कलितारकः ॥ १३॥ प्रकाशरूपो निर्दम्भः सर्वजीवहितावहः । भक्तिसम्पोषको
    वाग्मी चतुर्वर्गफलप्रदः ॥ १४॥ निर्मत्सरो भक्तवर्मा बुद्धिदाताऽतिपावनः । अबुद्धिहृद्ब्रह्मधामदर्शकश्चापराजितः
    ॥ १५॥ आसमुद्रान्त सत्कीर्तिः श्रितसंसृतिमोचनः । उदारः सहजानन्दः साध्वीधर्मप्रवर्तकः ॥ १६॥ कन्दर्पदर्पदलनो
    वैष्णवक्रतुकारकः । पञ्चायतनसम्मानो नैष्ठिकव्रतपोषकः ॥ १७॥ प्रगल्भो निःस्पृहः सत्यप्रतिज्ञो भक्तवत्सलः
    । अरोषणो दीर्घदर्शी षडूर्मिविजयक्षमः ॥ १८॥ निरहङ्कृतिरद्रोह ऋजुः सर्वोपकारकः । नियामकश्चोपशमस्थितिर्विनयवान्
    गुरुः ॥ १९॥ अजातवैरी निर्लोभो महापुरुष आत्मदः । अखण्डितार्षमर्यादो व्याससिद्धान्तबोधकः ॥ २०॥ मनोनिग्रहयुक्तिज्ञो
    यमदूतविमोचकः । पूर्णकामः सत्यवादी गुणग्राही गतस्मयः ॥ २१॥ सदाचारप्रियतरः पुण्यश्रवणकीर्तनः । सर्वमङ्गलसद्रूपनानागुणविचेष्टितः
    ॥ २२॥ इत्येतत्परमं स्तोत्रं जनमङ्गलसंज्ञितम् । यः पठेत्तेन पठितं भवेद्वै सर्वमङ्गलम् ॥ २३॥ यः पठेच्छृणुयाद्भक्त्या
    त्रिकालं श्रावयेच्च वा । एतत्तस्य तु पापानि नश्येयुः किल सर्वशः ॥ २४॥ एतत्संसेवमानानां पुरुषार्थचतुष्टये
    । दुर्लभं नास्ति किमपि हरिकृष्णप्रसादतः ॥ २५॥ भूतप्रेतपिशाचानां डाकिनीब्रह्मराक्षसाम् । योगिनीनां
    तथा बालग्रहादीनामुपद्रवः ॥ २६॥ अभिचारो रिपुकृतो रोगश्चान्योऽप्युपद्रवः । अयुतावर्तनादस्य नश्यत्येव
    न संशयः ॥ २७॥ दशावृत्या प्रतिदिनमस्याभीष्टं सुखं भवेत् । गृहिभिस्त्यागिभिश्चापि पठनीयमिदं ततः ॥ २८॥
    इति श्रीशतानन्दमुनिविरचितं श्रीजनमङ्गलाख्यं श्रीहर्यष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥ श्रीजनमङ्गलस्तोत्रम्
