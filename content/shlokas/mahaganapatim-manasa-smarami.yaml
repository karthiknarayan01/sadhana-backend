id: mahaganapatim-manasa-smarami
category: stotram
name:
  english: Mahaganapatim Manasa Smarami
content:
  english: muttusvami dikshitar bhasha samskritam pallavi maha ganapatim manasa smarami | maha ganapatim
    vasishtha vama devadi vandita || anupallavi maha deva sutam guruguha nutam | mara koti prakasham shantam
    || mahakavya natakadi priyam mushikavahana modakapriyam || svarah pallavi ma pa ni sa ni pa ma ga
    ma pa ma ri sa ri ni pa ni ma ri sa sa ni pa ma
  devanagari: मुत्तुस्वामि दीक्षितर् भाषा संस्कृतम् पल्लवि महा गणपतिं मनसा स्मरामि । महा गणपतिम् वसिष्ठ
    वाम देवादि वन्दित ॥ अनुपल्लवि महा देव सुतं गुरुगुह नुतम् । मार कोटि प्रकाशं शान्तम् ॥ महाकाव्य नाटकादि
    प्रियम् मूषिकवाहन मोदकप्रियम् ॥ स्वराः पल्लवि म प नि स नि प म ग म प म रि स रि नि प नि म रि स स नि
    प म
