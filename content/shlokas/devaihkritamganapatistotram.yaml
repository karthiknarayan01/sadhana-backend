id: devaihkritamganapatistotram
category: stotram
name:
  english: devaihkritamganapatistotram
  devanagari: देवैःकृतंगणपतिस्तोत्रम्
content:
  english: devaih kritam ganapatistotram deva ucuh | ganadhipa namastubhyam sarvadevaikapalaka | svargabhogaprada
    pritya heramba tvam natah smah || 32|| jayadam sarvayuddheshu siddhidam sarvakarmasu | mahamayam mahakayam
    heramba tvam natah smah || 33|| ekadantam mahaprajnam lambatundam vinayakam | devam maharshidevanammindrasya
    ca natah smah || 34|| yatte purarcanam yajne na kritam tatkshamasva nah iti shripadmapurane srishtikhande
    pancashashtitamadhyayantargatam devaih kritam ganapatistotram samaptam | padmapurana | srishtikhanda
    | adhyaya 65
  devanagari: देवैः कृतं गणपतिस्तोत्रम् देवा ऊचुः । गणाधिप नमस्तुभ्यं सर्वदेवैकपालक । स्वर्गभोगप्रद प्रीत्या
    हेरम्ब त्वां नताः स्मः ॥ ३२॥ जयदं सर्वयुद्धेषु सिद्धिदं सर्वकर्मसु । महामायं महाकायं हेरम्ब त्वां
    नताः स्मः ॥ ३३॥ एकदन्तं महाप्राज्ञं लम्बतुण्डं विनायकम् । देवं महर्षिदेवानाम्मिन्द्रस्य च नताः स्मः
    ॥ ३४॥ यत्ते पुरार्चनं यज्ञे न कृतं तत्क्षमस्व नः इति श्रीपाद्मपुराणे सृष्टिखण्डे पञ्चषष्टितमाध्यायान्तर्गतं
    देवैः कृतं गणपतिस्तोत्रं समाप्तम् । पद्मपुराण । सृष्टिखण्ड । अध्याय ६५
meaning: {}
