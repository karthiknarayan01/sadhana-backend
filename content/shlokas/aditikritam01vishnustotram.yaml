id: aditikritam01vishnustotram
category: stotram
name:
  english: aditikritam01vishnustotram
  devanagari: अदितिकृतं०१विष्णुस्तोत्रम्
content:
  english: aditikritam 1 vishnustotram aditiruvaca | namah krityartinashaya namah pushkaramaline | namah
    paramakalyanakalyanayadivedhase || 17|| namah pankajanetraya namah pankajanabhaye | namah pankajasambhutisambhavayatmayonaye
    || 18|| shriyah kantaya dantaya dantadrishyaya cakrine | namah padmasihastaya namah kanakaretase ||
    19|| tathatmajnanayajnaya yogicintyaya yogine | nirgunaya visheshaya haraye brahmarupine || 20|| jagacca
    tishthate yatra jagato yo na drishyate | namah sthulatisukshmaya tasmai devaya sharngine || 21|| yam
    na pashyanti pashyanto jagadapyakhilam narah | apashyadbhirjagadyashca drishyate hridi samsthitah
    || 22|| bahirjyotiralakshyo yo lakshyate jyotishah parah | yasminneva yatashcaiva yasyaitadakhilam
    jagat || 23|| tasmai samastajagatamamaraya namo namah | adyah prajapatih so'pi pitrinam paramah patih
    | patih suranam yastasmai namah krishnaya vedhase || 24|| yah pravrittairnivrittaishca karmabhistu
    virajyate | svargapavargaphalado namastasmai gadabhrite || 25|| yastu sancintyamano'pi sarvam papam
    vyapohati | namastasmai vishuddhaya parasmai harimedhase || 26|| ye pashyantyakhiladharamishanamajamavyayam
    | na punarjanmamaranam prapnuvanti namami tam || 27|| yo yajno yajnaparamairijyate yajnasamsthitah
    | tam yajnapurusham vishnum namami prabhumishvaram || 28|| giyate sarvavedeshu vedavidbhirvidam gatih
    | yastasmai vedavedyaya nityaya vishnave namah || 29|| yato vishvam samudbhutam yasmin pralayameshyati
    | vishvodbhavapratishthaya namastasmai mahatmane || 30|| abrahmastambaparyantam vyaptam yena caracaram
    | mayajalasamunnaddham tamupendram namamyaham || 31|| yo'tra toyasvarupastho bibhartyakhilamishvarah
    | vishvam vishvapatim vishnum tam namami prajapatim || 32|| murttam tamo'suramayam tadvidho vinihanti
    yah | ratrijam suryarupi ca tamupendram namamyaham || 33|| yasyakshini candrasuryau sarvalokashubhashubham
    | pashyatah karma satatam tamupendram namamyaham || 34|| yasmin sarveshvare sarvam satyametanmayoditam
    | nanritam tamajam vishnum namami prabhumavyayam || 35|| yadyetatsatyamuktam me bhuyashcato janardana
    | satyena tena sakalah puryantam me manorathah || 36|| iti vamanapurane saptavimshadhyayantargatam
    aditikritam vishnustotram samaptam | vamanapurana | adhyaya 27
  devanagari: अदितिकृतं १ विष्णुस्तोत्रम् अदितिरुवाच । नमः कृत्यार्तिनाशाय नमः पुष्करमालिने । नमः परमकल्याणकल्याणायादिवेधसे
    ॥ १७॥ नमः पङ्कजनेत्राय नमः पङ्कजनाभये । नमः पङ्कजसम्भूतिसम्भवायात्मयोनये ॥ १८॥ श्रियः कान्ताय दान्ताय
    दान्तदृश्याय चक्रिणे । नमः पद्मासिहस्ताय नमः कनकरेतसे ॥ १९॥ तथात्मज्ञानयज्ञाय योगिचिन्त्याय योगिने
    । निर्गुणाय विशेषाय हरये ब्रह्मरूपिणे ॥ २०॥ जगच्च तिष्ठते यत्र जगतो यो न दृश्यते । नमः स्थूलातिसूक्ष्माय
    तस्मै देवाय शार्ङ्गिणे ॥ २१॥ यं न पश्यन्ति पश्यन्तो जगदप्यखिलं नराः । अपश्यद्भिर्जगद्यश्च दृश्यते
    हृदि संस्थितः ॥ २२॥ बहिर्ज्योतिरलक्ष्यो यो लक्ष्यते ज्योतिषः परः । यस्मिन्नेव यतश्चैव यस्यैतदखिलं
    जगत् ॥ २३॥ तस्मै समस्तजगताममराय नमो नमः । आद्यः प्रजापतिः सोऽपि पितॄणां परमः पतिः । पतिः सुराणां यस्तस्मै
    नमः कृष्णाय वेधसे ॥ २४॥ यः प्रवृत्तैर्निवृत्तैश्च कर्मभिस्तु विरज्यते । स्वर्गापवर्गफलदो नमस्तस्मै
    गदाभृते ॥ २५॥ यस्तु सञ्चिन्त्यमानोऽपि सर्वं पापं व्यपोहति । नमस्तस्मै विशुद्धाय परस्मै हरिमेधसे ॥
    २६॥ ये पश्यन्त्यखिलाधारमीशानमजमव्ययम् । न पुनर्जन्ममरणं प्राप्नुवन्ति नमामि तम् ॥ २७॥ यो यज्ञो यज्ञपरमैरिज्यते
    यज्ञसंस्थितः । तं यज्ञपुरुषं विष्णुं नमामि प्रभुमीश्वरम् ॥ २८॥ गीयते सर्ववेदेषु वेदविद्भिर्विदां गतिः
    । यस्तस्मै वेदवेद्याय नित्याय विष्णवे नमः ॥ २९॥ यतो विश्वं समुद्भूतं यस्मिन् प्रलयमेष्यति । विश्वोद्भवप्रतिष्ठाय
    नमस्तस्मै महात्मने ॥ ३०॥ आब्रह्मस्तम्बपर्यन्तं व्याप्तं येन चराचरम् । मायाजालसमुन्नद्धं तमुपेन्द्रं
    नमाम्यहम् ॥ ३१॥ योऽत्र तोयस्वरूपस्थो बिभर्त्यखिलमीश्वरः । विश्वं विश्वपतिं विष्णुं तं नमामि प्रजापतिम्
    ॥ ३२॥ मूर्त्तं तमोऽसुरमयं तद्विधो विनिहन्ति यः । रात्रिजं सूर्यरूपी च तमुपेन्द्रं नमाम्यहम् ॥ ३३॥
    यस्याक्षिणी चन्द्रसूर्यौ सर्वलोकशुभाशुभम् । पश्यतः कर्म सततं तमुपेन्द्रं नमाम्यहम् ॥ ३४॥ यस्मिन् सर्वेश्वरे
    सर्वं सत्यमेतन्मयोदितम् । नानृतं तमजं विष्णुं नमामि प्रभुमव्ययम् ॥ ३५॥ यद्येतत्सत्यमुक्तं मे भूयश्चातो
    जनार्दन । सत्येन तेन सकलाः पूर्यन्तां मे मनोरथाः ॥ ३६॥ इति वामनपुराणे सप्तविंशाध्यायान्तर्गतं अदितिकृतं
    विष्णुस्तोत्रं समाप्तम् । वामनपुराण । अध्याय २७
