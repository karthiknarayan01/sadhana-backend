id: ranganathastotram-2
category: stotram
name:
  english: ranganathastotram 2
  devanagari: रन्गनाथस्तोत्रम् २
content:
  english: shriranganathastotram shrirange sheshashayi vilasati bhagavan divyavaikunthanathah kaveri divyagandha
    vilasati viraja divyatirthaprashasta | shrirangam divyarangam vilasati nagaram divyavaikunthameva
    shrimantah surisangha divi ca vilasita rangadeshasthabhaktah || 1|| pratyuptaih padmaragaraphatikamarakatairdivyamanikyasanghah
    prakarairgopuradyairvilasati vimale divyavaikunthatulye | shrirange sheshashayi shatamakhamanibhistulyakalyanagatro
    bhaktanam kalpavriksho dishatu mama sukham ranganatho dayaluh || 2|| ambhojakshah sushila shubhagunanilayashcandrakantananabjah
    vakshahsthalyam virajanmanivarakamalavatsajajvalyamanah | manikyacchannamaulimanimayavalayo bhaktakalyanadata
    vaikunthah sheshashayi dishatu mama sukham ranganatho dayaluh || 3|| sarvajnah sarvashaktah sakalagunanidhih
    satyakamah sureshah shrivatsahshrinivasah shritajanavaradah sarvasauhardasindhuh | shrirange divyadeshe
    sakalajananidhau sheshatalpe shayano meghashyamah kripalurdishatu mama sukham ranganatho mukundah
    || 4|| shrirangashrinagaryam jvalitamaniphane nagaraje shayanah brahmadyaih surisadvaih stutapadakamalah
    sarvalokaprasiddhah | mugdhasmerah shrutinam shirasi vilasitah sindhujavatsavakshah karunyabdhirvadanyo
    dishatu mama sukham ranganatho mukundah || 5|| pratyaksham paramam padam divi bhuvi shrirangamatyadbhutam
    tatra shribhagavan phanindrashayanah shrirangarajo vibhuh | lakshmidivyanivasakaustubhamanih shrivatsavakshahsthalo
    jiyad bhutadayalurambujamukhah shrivaishnavanam nidhih || 6|| vilasatu mama citta ranganatho dayalu
  devanagari: श्रीरङ्गनाथस्तोत्रम् श्रीरङ्गे शेषशायी विलसति भगवान् दिव्यवैकुण्ठनाथः कावेरी दिव्यगन्धा
    विलसति विरजा दिव्यतीर्थप्रशस्ता । श्रीरङ्गं दिव्यरङ्गं विलसति नगरं दिव्यवैकुण्ठमेव श्रीमन्तः सूरिसङ्घा
    दिवि च विलसिता रङ्गदेशस्थभक्ताः ॥ १॥ प्रत्युप्तैः पद्मरागरफटिकमरकतैर्दिव्यमाणिक्यसङ्घः प्राकारैर्गोपुराद्यैर्विलसति
    विमले दिव्यवैकुण्ठतुल्ये । श्रीरङ्गे शेषशायी शतमखमणिभिस्तुल्यकल्याणगात्रो भक्तानां कल्पवृक्षो दिशतु
    मम सुखं रङ्गनाथो दयालुः ॥ २॥ अम्भोजाक्षः सुशील शुभगुणनिलयश्चन्द्रकान्ताननाब्जः वक्षःस्थल्यां विराजन्मणिवरकमलावत्सजाज्वल्यमानः
    । माणिक्यच्छन्नमौलिमणिमयवलयो भक्तकल्याणदाता वैकुण्ठः शेषशायी दिशतु मम सुखं रङ्गनाथो दयालुः ॥ ३॥ सर्वज्ञः
    सर्वशक्तः सकलगुणनिधिः सत्यकामः सुरेशः श्रीवत्सःश्रीनिवासः श्रितजनवरदः सर्वसौहार्दसिन्धुः । श्रीरङ्गे
    दिव्यदेशे सकलजननिधौ शेषतल्पे शयानो मेघश्यामः कृपालुर्दिशतु मम सुखं रङ्गनाथो मुकुन्दः ॥ ४॥ श्रीरङ्गश्रीनगर्यां
    ज्वलितमणिफणे नागराजे शयानः ब्रह्माद्यैः सूरिसद्वैः स्तुतपदकमलः सर्वलोकप्रसिद्धः । मुग्धस्मेरः श्रुतीनां
    शिरसि विलसितः सिन्धुजावत्सवक्षाः कारुण्याब्धिर्वदान्यो दिशतु मम सुखं रङ्गनाथो मुकुन्दः ॥ ५॥ प्रत्यक्षं
    परमं पदं दिवि भुवि श्रीरङ्गमत्यद्भुतं तत्र श्रीभगवान् फणीन्द्रशयनः श्रीरङ्गराजो विभुः । लक्ष्मीदिव्यनिवासकौस्तुभमणिः
    श्रीवत्सवक्षःस्थलो जीयाद् भूतदयालुरम्बुजमुखः श्रीवैष्णवानां निधिः ॥ ६॥ विलसतु मम चित्त रङ्गनाथो दयालु
