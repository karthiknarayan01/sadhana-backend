id: shrikamalakavacam
category: stotram
name:
  english: shrikamalakavacam
  devanagari: श्रीकमलाकवचम्
content:
  english: '|| shrikamalakavacam || shriganeshaya namah | om asyashcaturaksharavishnuvanitayah kavacasya
    shribhagavan shiva rishih | anushtupchandah | vagbhava devata | vagbhavam bijam | lajja shaktih |
    rama kilakam | kamabijatmakam kavacam | mama sukavitvapandityasamriddhisiddhaye pathe viniyogah |
    ainkaro mastake patu vagbhavam sarvasiddhida | hrim patu cakshushormadhye cakshuryugme ca shankari
    || 1|| jihvayam mukhavritte ca karnayordantayornasi | oshthadhare dantapanktau talumule hanau punah
    || 2|| patu mam vishnuvanita lakshmih shrivarnarupini || karnayugme bhujadvandve stanadvandve ca parvati
    || 3|| hridaye manibandhe ca grivayam parshvaryodvayoh | prishthadeshe tatha guhye vame ca dakshine
    tatha || 4|| upasthe ca nitambe ca nabhau jamghadvaye punah | janucakre padadvandve ghutike''ngulimulake
    || 5|| svadha tu pranashaktyam va simanyam mastake tatha | sarvange patu kameshi mahadevi samunnatih
    || 6|| pushtih patu mahamaya utkrishtih sarvada''vatu | riddhih patu sada devi sarvatra shambhuvallabha
    || 7|| vagbhava sarvada patu patu mam haragehini | rama patu mahadevi patu maya svarat svayam || 8||
    sarvange patu mam lakshmirvishnumaya sureshvari | vijaya patu bhavane jaya patu sada mama || 9|| shivaduti
    sada patu sundari patu sarvada | bhairavi patu sarvatra bherunda sarvada''vatu || 10|| tvarita patu
    mam nityamugratara sada''vatu | patu mam kalika nityam kalaratrih sada''vatu || 11|| navadurgah sada
    patu kamakhya sarvada''vatu | yoginyah sarvada patu mudrah patu sada sama || 12|| matrah patu sada
    devyashcakrastha yogini ganah | sarvatra sarvakaryeshu sarvakarmasu sarvada || 13|| patu mam devadevi
    ca lakshmih sarvasamriddhida || || iti vishvasaratantre shrikamalakavacam sampurnam ||'
  devanagari: ॥ श्रीकमलाकवचम् ॥ श्रीगणेशाय नमः । ॐ अस्याश्चतुरक्षराविष्णुवनितायाः कवचस्य श्रीभगवान् शिव
    ऋषीः । अनुष्टुप्छन्दः । वाग्भवा देवता । वाग्भवं बीजम् । लज्जा शक्तिः । रमा कीलकम् । कामबीजात्मकं कवचम्
    । मम सुकवित्वपाण्डित्यसमृद्धिसिद्धये पाठे विनियोगः । ऐङ्कारो मस्तके पातु वाग्भवां सर्वसिद्धिदा । ह्रीं
    पातु चक्षुषोर्मध्ये चक्षुर्युग्मे च शाङ्करी ॥ १॥ जिह्वायां मुखवृत्ते च कर्णयोर्दन्तयोर्नसि । ओष्ठाधारे
    दन्तपङ्क्तौ तालुमूले हनौ पुनः ॥ २॥ पातु मां विष्णुवनिता लक्ष्मीः श्रीवर्णरूपिणी ॥ कर्णयुग्मे भुजद्वन्द्वे
    स्तनद्वन्द्वे च पार्वती ॥ ३॥ हृदये मणिबन्धे च ग्रीवायां पार्श्वर्योद्वयोः । पृष्ठदेशे तथा गुह्ये वामे
    च दक्षिणे तथा ॥ ४॥ उपस्थे च नितम्बे च नाभौ जंघाद्वये पुनः । जानुचक्रे पदद्वन्द्वे घुटिकेऽङ्गुलिमूलके
    ॥ ५॥ स्वधा तु प्राणशक्त्यां वा सीमन्यां मस्तके तथा । सर्वाङ्गे पातु कामेशी महादेवी समुन्नतिः ॥ ६॥
    पुष्टिः पातु महामाया उत्कृष्टिः सर्वदाऽवतु । ऋद्धिः पातु सदा देवी सर्वत्र शम्भुवल्लभा ॥ ७॥ वाग्भवा
    सर्वदा पातु पातु मां हरगेहिनी । रमा पातु महादेवी पातु माया स्वराट् स्वयम् ॥ ८॥ सर्वाङ्गे पातु मां
    लक्ष्मीर्विष्णुमाया सुरेश्वरी । विजया पातु भवने जया पातु सदा मम ॥ ९॥ शिवदूती सदा पातु सुन्दरी पातु
    सर्वदा । भैरवी पातु सर्वत्र भेरुण्डा सर्वदाऽवतु ॥ १०॥ त्वरिता पातु मां नित्यमुग्रतारा सदाऽवतु । पातु
    मां कालिका नित्यं कालरात्रिः सदाऽवतु ॥ ११॥ नवदुर्गाः सदा पातु कामाख्या सर्वदाऽवतु । योगिन्यः सर्वदा
    पातु मुद्राः पातु सदा सम ॥ १२॥ मात्राः पातु सदा देव्यश्चक्रस्था योगिनी गणाः । सर्वत्र सर्वकार्येषु
    सर्वकर्मसु सर्वदा ॥ १३॥ पातु मां देवदेवी च लक्ष्मीः सर्वसमृद्धिदा ॥ ॥ इति विश्वसारतन्त्रे श्रीकमलाकवचं
    सम्पूर्णम् ॥
