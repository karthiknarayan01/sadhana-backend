id: narayanapurvatapiniyopanishat-3
category: upanishad
name:
  english: narayanapurvatapiniyopanishat
  devanagari: नारायणपूर्वतापिनीयोपनिषत्
content:
  english: akshanvantah karnavantah sakhayo mano jiveshvasama babhuvuh | tasmallakshminarayanam sarvabijam
    sarvabhutadhivasam yo vetti sa vidvan bhavati | upasakanam mokshapraptirbhavati | sa jivanmukto bhavati
    | sa hovaca bhagavan upasanavidhim vyacashte | brahma rishirbhavati | gayatri chanda ucyate | shrimannarayanaparamatma
    devata | pranavam bijam | namah shaktirucyate | kilakam narayaneti || dharmarthakamamoksheshu viniyogo'tha
    bhavana | maholkaya virolkaya vriddholkaya prithulkaya vidyulkaya jvaladulkaya ca shadangakalpitah
    namahsvahavashadvaushatpadanta anganyasa bhavanti | nilajimutasankasham pitakausheyavasasam | kiritakundaladharam
    kaustubhodbhasitorasam || shankhacakragadakhadgadharinam vanamalinam | vamabhage mahalakshmyalingitardhasharirinam
    || sanakadibhih samsevyam stuyamanam maharshibhih | brahmadibhih sada dhyeyam dhyatva narayanam vibhum
    || karmana manasa vaca samsmaret prajapet sudhih | ayutam japamatrena sarvajnanaprado bhavet || lakshamatram
    tu prajapet svasvarupam bhavenmanuh | ata urdhvam sada dhyayet sakshannarayano harih || sa hovaca
    bhagavan ya evam veda | ityupanishat || ityatharvanarahasye narayanapurvatapiniye caturthah khanda
    | pancamah khandah | sa hovaca bhagavan brahma dashakaḻatmako'vatarah kathyate || jara palinika shantirishvari
    ratikamika | varada hladini pritirdirgha dashakala hareh || narayanadavatara mantrarupa jayante |
    om namo narayanaya svaha | tvam dashaksharo mahamantro bhavati | tatra prathamo matsyavatarah | dvitiyah
    kurmah | tritiyo varahah | caturtho narasimhah | pancamo vamanah | shashtho jamadagnih | saptamo ramacandrah
    | ashtamah krishnah paramatma | navamo buddhavatarah | dashamah kalkirjanardanah | om matsyavataraya
    namah | shrim kurmavataraya namah | him varahavataraya namah | hum nrisimhavataraya namah | sauh vamanavataraya
    namah | aim parashuramavataraya namah | glaum ramacandraya namah | klim krishnaya namah | blum buddhavataraya
    namah | sah kalkyavataraya namah iti | prajapatih prajayate | tasmannarayanah prajayate | brahma jayate
    | brahmanahsakashat pancamahabhutani tanmatrani jayante | jnanendriyakarmendriyani manobuddhicittahankara
    jayante | prakritirjayate | caturvimshatitattvatmako narayanah | pancavimshatitattvatmakah purushatvam
    parabrahma bhavet | shivashca narayanah | shakrashca narayanah | dishashca narayanah | urdhvanja narayanah
    | antashca narayanah | narayanah sarvam khalvidam brahma | tasmannarayanadandajasvedajodbhijjajarayujamanasijadayah
    sarve mahabhutah prajayante || ajamekam lohitashuklakrishnam barahvim prajam janayanti
  devanagari: अक्षन्वन्तः कर्णवन्तः सखायो मनो जीवेष्वसमा बभूवुः । तस्माल्लक्ष्मीनारायणं सर्वबीजं सर्वभूताधिवासं
    यो वेत्ति स विद्वान् भवति । उपासकानां मोक्षप्राप्तिर्भवति । स जीवन्मुक्तो भवति । स होवाच भगवान् उपासनविधिं
    व्याचष्टे । ब्रह्मा ऋषिर्भवति । गायत्री छन्द उच्यते । श्रीमन्नारायणपरमात्मा देवता । प्रणवं बीजम् ।
    नमः शक्तिरुच्यते । कीलकं नारायणेति ॥ धर्मार्थकाममोक्षेषु विनियोगोऽथ भावना । महोल्काय वीरोल्काय वृद्धोल्काय
    पृथूल्काय विद्युल्काय ज्वलदुल्काय च षडङ्गकल्पिताः नमःस्वाहावषड्वौषट्पदान्ता अङ्गन्यासा भवन्ति । नीलजीमूतसङ्काशं
    पीतकौशेयवाससम् । किरीटकुण्डलधरं कौस्तुभोद्भासितोरसम् ॥ शङ्खचक्रगदाखड्गधारिणं वनमालिनम् । वामभागे महालक्ष्म्यालिङ्गितार्धशरीरिणम्
    ॥ सनकादिभिः संसेव्यं स्तूयमानं महर्षिभिः । ब्रह्मादिभिः सदा ध्येयं ध्यात्वा नारायणं विभुम् ॥ कर्मणा
    मनसा वाचा संस्मरेत् प्रजपेत् सुधीः । अयुतं जपमात्रेण सर्वज्ञानप्रदो भवेत् ॥ लक्षमात्रं तु प्रजपेत्
    स्वस्वरूपं भवेन्मनुः । अत ऊर्ध्वं सदा ध्यायेत् साक्षान्नारायणो हरिः ॥ स होवाच भगवान् य एवं वेद । इत्युपनिषत्
    ॥ इत्याथर्वणरहस्ये नारायणपूर्वतापिनीये चतुर्थः खण्ड । पञ्चमः खण्डः । स होवाच भगवान् ब्रह्मा दशकळात्मकोऽवतारः
    कथ्यते ॥ जरा पालिनिका शान्तिरीश्वरी रतिकामिका । वरदा ह्लादिनी प्रीतिर्दीर्घा दशकला हरेः ॥ नारायणादवतारा
    मन्त्ररूपा जायन्ते । ॐ नमो नारायणाय स्वाहा । त्वं दशाक्षरो महामन्त्रो भवति । तत्र प्रथमो मत्स्यावतारः
    । द्वितीयः कूर्मः । तृतीयो वराहः । चतुर्थो नरसिंहः । पञ्चमो वामनः । षष्ठो जमदग्निः । सप्तमो रामचन्द्रः
    । अष्टमः कृष्णः परमात्मा । नवमो बुद्धावतारः । दशमः कल्किर्जनार्दनः । ॐ मत्स्यावताराय नमः । श्रीं कूर्मावताराय
    नमः । हीं वराहावताराय नमः । हूं नृसिंहावताराय नमः । सौः वामनावताराय नमः । ऐं परशुरामावताराय नमः ।
    ग्लौं रामचन्द्राय नमः । क्लीं कृष्णाय नमः । ब्लूं बुद्धावताराय नमः । सः कल्क्यवताराय नमः इति । प्रजापतिः
    प्रजायते । तस्मान्नारायणः प्रजायते । ब्रह्मा जायते । ब्रह्मणःसकाशात् पञ्चमहाभूतानि तन्मात्राणि जायन्ते
    । ज्ञानेन्द्रियकर्मेन्द्रियाणि मनोबुद्धिचित्ताहङ्कारा जायन्ते । प्रकृतिर्जायते । चतुर्विंशतितत्त्वात्मको
    नारायणः । पञ्चविंशतितत्त्वात्मकः पुरुषत्वं परब्रह्म भवेत् । शिवश्च नारायणः । शक्रश्च नारायणः । दिशश्च
    नारायणः । ऊर्ध्वञ्ज नारायणः । अन्तश्च नारायणः । नारायणः सर्वं खल्विदं ब्रह्म । तस्मान्नारायणादण्डजस्वेदजोद्भिज्जजरायुजमनसिजादयः
    सर्वे महाभूताः प्रजायन्ते ॥ अजामेकां लोहितशुक्लकृष्णां बरह्वीं प्रजां जनयन्ती
