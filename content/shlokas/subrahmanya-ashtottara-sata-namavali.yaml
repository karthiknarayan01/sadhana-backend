id: subrahmanya-ashtottara-sata-namavali
category: stotram
name:
  english: Subrahmanya Ashtottara Sata Namavali
  devanagari: सुब्रह्मण्याष्टोत्तरशतनामावलिः २
content:
  english: om shriganeshaya namah | om subrahmanyaya namah | parabrahmane | sharanagatavatsalaya | bhaktapriyaya
    | parasmai jyotishe | kartikeyaya | mahamataye | kripanidhaye | mahasenaya | bhimaya | bhimaparakramaya
    | parvatinandanaya | shrimate | ishaputraya | mahadyutaye | ekarupaya | svayam jyotishe | aprameyaya
    | jitendriyaya | senapataye namah | (20) om mahavishnave namah | adyantarahitaya | shivaya | agnigarbhaya
    | mahadevaya | tarakasuramardanaya | anadaye | bhagavate | devaya | sharajanmane | shadananaya | guhashayaya
    | mahatejase | lokajnaya | lokarakshakaya | sundaraya | sutrakaraya | vishakhaya | parabhanjanaya
    | ishaya namah | (40) om khadgadharaya namah | kartre | vishvarupaya | dhanurdharaya | jnanagamyaya
    | dridhaprajnaya | kumaraya | kamalasanaya | akalmashaya | shaktidharaya | sukirtaye | dinarakshakaya
    | shanmaturaya | sarvagoptre | sarvabhutadayanidhaye | vishvapriyaya | vishveshaya | vishvabhuje |
    vishvamangalaya | sarvavyapine namah | (60) om sarvabhoktre namah | sarvarakshakaraya | prabhave |
    karanatrayakartre | nirgunaya | krauncadaranaya | sarvabhutaya | bhaktigamyaya | bhakteshaya | bhaktavatsalaya
    | kalpavrikshaya | gahvaraya | sarvabhutashayasthitaya | devagoptre | duhkhajnaya | varadaya | varapriyaya
    | anadibrahmacarine | sahasrakshaya | sahasrapade namah | (80) om jnanasvarupaya namah | jnanine |
    jnanadatre | jnanadatre | sadashivaya | vedantavedyaya | vedatmane | vedasaraya | vicakshanaya | yogine
    | yogapriyaya | anantaya | mahaṟupaya | bahurupaya | nirvikalpaya | nirlepaya | nirvikaraya | niranjanaya
    | nityatriptaya | niraharaya | nirabhasaya namah | (100) om nirashrayaya namah | akhandanirmalaya
    | anantaya | cidanandatmakaya | guhaya | cinmayaya | girishaya | dandayudhadharaya namah | (108) iti
    |
  devanagari: ॐ श्रीगणेशाय नमः । ॐ सुब्रह्मण्याय नमः । परब्रह्मणे । शरणागतवत्सलाय । भक्तप्रियाय । परस्मै
    ज्योतिषे । कार्तिकेयाय । महामतये । कृपनिधये । महासेनाय । भीमाय । भीमपरक्रमाय । पार्वतीनन्दनाय । श्रीमते
    । ईशपुत्राय । महाद्युतये । एकरूपाय । स्वयं ज्योतिषे । अप्रमेयाय । जितेन्द्रियाय । सेनापतये नमः । (२०)
    ॐ महाविष्णवे नमः । आद्यन्तरहिताय । शिवाय । अग्निगर्भाय । महादेवाय । तारकासुरमर्दनाय । अनादये । भगवते
    । देवाय । शरजन्मने । षडाननाय । गुहाशयाय । महातेजसे । लोकज्ञाय । लोकरक्षकाय । सुन्दराय । सूत्रकाराय
    । विशाखाय । परभञ्जनाय । ईशाय नमः । (४०) ॐ खड्गधराय नमः । कर्त्रे । विश्वरूपाय । धनुर्धराय । ज्ञानगम्याय
    । दृढप्रज्ञाय । कुमाराय । कमलासनाय । अकल्मषाय । शक्तिधराय । सुकीर्तये । दीनरक्षकाय । षाण्मातुराय ।
    सर्वगोप्त्रे । सर्वभूतदयानिधये । विश्वप्रियाय । विश्वेशाय । विश्वभुजे । विश्वमङ्गलाय । सर्वव्यापिने
    नमः । (६०) ॐ सर्वभोक्त्रे नमः । सर्वरक्षाकराय । प्रभवे । कारणत्रयकर्त्रे । निर्गुणाय । क्रौञ्चदारणाय
    । सर्वभूताय । भक्तिगम्याय । भक्तेशाय । भक्तवत्सलाय । कल्पवृक्षाय । गह्वराय । सर्वभूताशयस्थिताय । देवगोप्त्रे
    । दुःखज्ञाय । वरदाय । वरप्रियाय । अनादिब्रह्मचारिणे । सहस्राक्षाय । सहस्रपदे नमः । (८०) ॐ ज्ञानस्वरूपाय
    नमः । ज्ञानिने । ज्ञानदात्रे । ज्ञानदात्रे । सदाशिवाय । वेदान्तवेद्याय । वेदात्मने । वेदसाराय । विचक्षणाय
    । योगिने । योगप्रियाय । अनन्ताय । महाऱूपाय । बहुरूपाय । निर्विकल्पाय । निर्लेपाय । निर्विकाराय । निरञ्जनाय
    । नित्यतृप्ताय । निराहाराय । निराभासाय नमः । (१००) ॐ निराश्रयाय नमः । अखण्डनिर्मलाय । अनन्ताय । चिदानन्दात्मकाय
    । गुहाय । चिन्मयाय । गिरीशाय । दण्डायुधधराय नमः । (१०८) इति ।
