id: devistutihshakradaya
category: stotram
name:
  english: devistutihshakradaya
  devanagari: देवीस्तुतिःशक्रादय
content:
  english: masmakamunmadasuraribhavam namaste || 23|| shulena pahi no devi pahi khadgena cambike | ghantasvanena
    nah pahi capajyanihsvanena ca || 24|| pracyam raksha praticyam ca candike raksha dakshine | bhramanenatmashulasya
    uttarasyam tatheshvari || 25|| saumyani yani rupani trailokye vicaranti te | yani catyarthaghorani
    tai rakshasmamstatha bhuvam || 26|| khadgashulagadadini yani castrani te'mbike | karapallavasangini
    tairasmanraksha sarvatah || 27|| rishiruvaca || 28|| evam stuta surairdivyaih kusumairnandanodbhavaih
    | arcita jagatam dhatri tatha gandhanulepanaih || 29|| bhaktya samastaistridashairdivyairdhupaistu
    dhupita | praha prasadasumukhi samastan pranatan suran || 30|| devyuvaca || 31|| vriyatam tridashah
    sarve yadasmatto'bhivanchatam || 32|| deva ucuh || 33|| bhagavatya kritam sarvam na kincidavashishyate
    | yadayam nihatah shatrurasmakam mahishasurah || 34|| yadi capi varo deyastvaya'smakam maheshvari
    | samsmrita samsmrita tvam no himsethah paramapadah || 35|| yashca martyah stavairebhistvam stoshyatyamalanane
    || 36|| tasya vittarddhivibhavairdhanadaradisampadam | vriddhaye'smatprasanna tvam bhavethah sarvadambike
    || 37|| rishiruvaca || 38|| iti prasadita devairjagato'rthe tatha'tmanah | tathetyuktva bhadrakali
    babhuvantarhita nripa || 39|| ityetatkathitam bhupa sambhuta sa yatha pura | devi devasharirebhyo
    jagattrayahitaishini || 40|| punashca gauridehatsa samudbhuta yathabhavat | vadhaya dushtadaityanam
    tatha shumbhanishumbhayoh || 41|| rakshanaya ca lokanam devanamupakarini | tacchrinushva maya''khyatam
    yathavatkathayami te || 42|| iti shri markandeyapurane savarnike manvantare devimahatmye shakradistutirnama
    caturtho'dhyayah || 4||
  devanagari: मस्माकमुन्मदसुरारिभवं नमस्ते ॥ २३॥ शूलेन पाहि नो देवि पाहि खड्गेन चाम्बिके । घण्टास्वनेन
    नः पाहि चापज्यानिःस्वनेन च ॥ २४॥ प्राच्यां रक्ष प्रतीच्यां च चण्डिके रक्ष दक्षिणे । भ्रामणेनात्मशूलस्य
    उत्तरस्यां तथेश्वरि ॥ २५॥ सौम्यानि यानि रूपाणि त्रैलोक्ये विचरन्ति ते । यानि चात्यर्थघोराणि तै रक्षास्मांस्तथा
    भुवम् ॥ २६॥ खड्गशूलगदादीनि यानि चास्त्रानि तेऽम्बिके । करपल्लवसङ्गीनि तैरस्मान्रक्ष सर्वतः ॥ २७॥ ऋषिरुवाच
    ॥ २८॥ एवं स्तुता सुरैर्दिव्यैः कुसुमैर्नन्दनोद्भवैः । अर्चिता जगतां धात्री तथा गन्धानुलेपनैः ॥ २९॥
    भक्त्या समस्तैस्त्रिदशैर्दिव्यैर्धूपैस्तु धूपिता । प्राह प्रसादसुमुखी समस्तान् प्रणतान् सुरान् ॥ ३०॥
    देव्युवाच ॥ ३१॥ व्रियतां त्रिदशाः सर्वे यदस्मत्तोऽभिवाञ्छतम् ॥ ३२॥ देवा उचुः ॥ ३३॥ भगवत्या कृतं सर्वं
    न किञ्चिदवशिष्यते । यदयं निहतः शत्रुरस्माकं महिषासुरः ॥ ३४॥ यदि चापि वरो देयस्त्वयाऽस्माकं महेश्वरि
    । संस्मृता संस्मृता त्वं नो हिंसेथाः परमापदः ॥ ३५॥ यश्च मर्त्यः स्तवैरेभिस्त्वां स्तोष्यत्यमलानने
    ॥ ३६॥ तस्य वित्तर्द्धिविभवैर्धनदारादिसम्पदाम् । वृद्धयेऽस्मत्प्रसन्ना त्वं भवेथाः सर्वदाम्बिके ॥ ३७॥
    ऋषिरुवाच ॥ ३८॥ इति प्रसादिता देवैर्जगतोऽर्थे तथाऽत्मनः । तथेत्युक्त्वा भद्रकाली बभूवान्तर्हिता नृप
    ॥ ३९॥ इत्येतत्कथितं भूप सम्भूता सा यथा पुरा । देवी देवशरीरेभ्यो जगत्त्रयहितैषिणी ॥ ४०॥ पुनश्च गौरीदेहात्सा
    समुद्भूता यथाभवत् । वधाय दुष्टदैत्यानां तथा शुम्भनिशुम्भयोः ॥ ४१॥ रक्षणाय च लोकानां देवानामुपकारिणी
    । तच्छृणुष्व मयाऽऽख्यातं यथावत्कथयामि ते ॥ ४२॥ इति श्री मार्कण्डेयपुराणे सावर्णिके मन्वन्तरे देवीमाहात्म्ये
    शक्रादिस्तुतिर्नाम चतुर्थोऽध्यायः ॥ ४॥
