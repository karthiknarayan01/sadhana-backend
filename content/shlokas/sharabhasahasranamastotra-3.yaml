id: sharabhasahasranamastotra-3
category: sahasranama
name:
  english: sharabhasahasranamastotra 3
  devanagari: शरभसहस्रनामस्तोत्र ३
content:
  english: ravikrodhatiraskritah hiranyagarbho hemango hemarupo hiranyadah | brahmajyotiranavekshyashcamundajanako
    ravi || 137|| moksharthijanasamsevyo mokshado mokshanayakah | mahashmashananilayo vedashvo bhurathasthirah
    || 138|| mrigavyadho dharmadhama prabhinnasphatikah prabhah | sarvajnah paramatma ca brahmanandashrayo
    vibhuh || 139|| sharabhesho mahadevah parabrahma sadashivah | svaravikritikarta ca svaratitah svayamvibhuh
    || 140|| svargatah svargatirdata niyanta niyatashrayah | bhumirupo bhumikarta bhudharo bhudharashrayah
    || 141|| bhutanatho bhutakarta bhutasamharakarakah | bhavishyajno bhavatrata bhavado bhavaharakah
    || 142|| varado varadata ca varaprito varapradah | kutasthah kutarupashca trikuto mantravigrahah ||
    143|| mantrartho mantragamyashca mantremsho mantrabhagakah | siddhimantrah siddhidata japasiddhisvabhavakah
    || 144|| namatigo namarupo namarupagunashrayah | gunakarta gunatrata gunatita gunariha || 145|| gunagramo
    gunadhishah gunanirgunakarakah | akaramatrikarupah akaratitabhavanah || 146|| paramaishvaryadata ca
    paramapritidayakah | paramah paramanandah paranandah paratparah || 147|| vaikunthapithamadhyastho
    vaikuntho vishnuvigrahah | kailasavasi kailase shivarupah shivapradah || 148|| jatajutodbhushitango
    bhasmadhusarabhushanah | digvasah digvibhagashca dingataranivasakah || 149|| dhyanakarta dhyanamurtirdharanadharanapriyah
    | jivanmuktipurinatho dvadashantasthitaprabhuh || 150|| tattvasthastattvarupasthastattvatito'titattvagah
    | tattvasamyastattvagamyastattvarthasarvadarshakah || 151|| tattvasanastattvamargastattvantastattvavigrahah
    | darshanadatigo drishyo drishyatitatidarshakah || 152|| darshano darshanatito bhavanakararupadhrit
    | maniparvatasamsthano manibhushanabhushitah || 153|| maniprito manishreshtho manistho manirupakah
    | cintamanigrihantasthah sarvacintavivarjitah || 154|| cintakrantabhaktacintyo cintanakaracintakah
    | acintyashcintyarupashca nishcintyo nishcayatmakah || 155|| nishcayo nishcayadhisho nishcayatmakadarshakah
    | trivikramastrikalajnastrimurtistripurantakah || 156|| brahmacari vrataprito grihastho grihavasakah
    | paramdhama parambrahma paramatma paratparah || 157|| sarveshvarah sarvamayah sarvasakshi vilakshanah
    | manidvipo dvipanatho dvipanto dvipalakshanah || 158|| saptasagarakarta ca saptasagaranayakah | mahidharo
    mahibharta mahipalo mahasvanah || 159|| mahivyapto'vyaktarupah suvyakto vyaktabhavanah | suveshadhyah
    sukhapritah sugamah sugamashrayah || 160|| tapatrayagnisantaptasamahladanacandramah | taranastapasaradhyastanumadhyastamomahah
    || 161|| pararupah paradhyeyah paradaivatadaivatah | brahmapujyo jagatpujyo bhaktapujyo varapradah
    || 162|| advaito dvaitacittashca dvaitadvaitavivarjitah | abhedyah sarvabhedyashca bhedyabhedakabodhakah
    || 163|| laksharasasavarnabhah plavangamapriyottamah | shatrusamharakarta ca avataraparo harah ||
    164|| samvidishah samvidatma samvijjnanapradayakah | samvitkarta ca bhaktashca samvidanandarupavan
    || 165|| samshayatitasamharyah sarvasamshayaharakah | nihsamshayamanodhyeyah samshayatmatiduragah
    || 166|| shaivamantra shivapritadikshashaivasvabhavakah | bhupatih kshmakrito bhupo bhupabhupatvadayakah
    || 167|| sarvadharmasamayuktah sarvadharmavivardhakah | sarvashasta sarvavedah sarvavetta satriptiman
    || 168|| bhaktabhavavatarashca bhuktimuktiphalapradah | bhaktasiddharthasiddhishca siddhibuddhipradayakah
    || 169|| varanasivasadata varanasivarapradah | varanasinatharupo gangamastakadharakah || 170|| parvatashrayakarta
    ca lingam tryambakaparvatah | lingadeho lingapatirlingapujyo'tidurlabhah || 171|| rudrapriyo rudrasevya
    ugrarupa virat stutah | malarudrakshabhushango japarudrakshatoshitah || 172|| satyasatyah satyadata
    satyakarta sadashrayah | satyasakshi satyalakshmi lakshmyatitamanoharah || 173|| janako jagatamisho
    janita jananishcayah | srishtisthitah srishtirupi srishtirupasthitipradah || 174|| samhararupah kalagnih
    kalasamhararupakah | saptapatalapadastho mahadakashashirshavan || 175|| amritashcamritakarah amritamritarupakah
    | amritakaracittisthah amritokrivakaranah || 176|| amritaharanityasthastvamritodbhavarupavan | amritamsho'mritadhisho'mritapritivivardhanah
    || 177|| anirdeshyo anirvacyo anango'nangasamshrayah | shrayedah shreyo rupashca shreyo'titaphalottamah
    || 178|| sarah samsarasakshi ca sarasaravicakshanah | dharanatitabhavastho dharananvayagocarah ||
    179|| gocaro gocaratitah ativa priyagocarah | priyapriyah tatha svarthi svarthah svarthaphalapradah
    || 180|| artharthasakshi lakshamsho lakshyalakshanavigrahah | jagadisho jagattrata jaganmayo jagadguruh
    || 181|| gurumurtih svayamvedyo vedyavedakarupakah | rupapito rupakarta sarvaruparthadayakah || 182||
    arthadastvarthamanyaca artharthi arthadayakah | vibhavo vaibhavah shreshthah sarvavaibhavadayakah
    || 183|| catuhshashtikalasutrah catuhshashtikalamayah | puranashravanakarah puranapurushottamah ||
    184|| puratanapurakhyatah purvajah purvapurvakah | mantratantrarthasarvajnah sarvatantraprakashakah
    || 185|| tantraveta tantrakarta tantrataranivasakah | tantragamyastantramanyastantrayantraphalapradah
    || 186|| sarvatantrarthatattvajnastantrarajah svatantrakah | brahmandakotikarta ca brahmandodarapurakah
    || 187|| brahmandadeshadata ca brahmajnanaparayanah | svayambhuh shambhurupashca hamsavigrahanisprihah
    || 188|| shvasinih shvasa ucchvasah sarvasamshayaharakah | so'hamrupasvabhavashca so'hamrupapradarshakah
    || 189|| so'hamasmiti nityasthah so'ham hamsah svarupavan | hamsohamsah svarupashca hamsavigrahanihsprihah
    | shvasanihshvasaucchvasah pakshirajo niranjanah || 190|| || phalashruti || ashtadhikasahasram tu
    nama sahasramuttamam | nityam sankirtanasaktah kirtayetpunyavasare || 191|| sankratau vishuve caiva
    paurnamasyam visheshatah | amavasyam ravivare trihsaptavarapathakah || 192|| svapne darshanamapnoti
    karyakarye'pi drishyate | ravivare dashavritya roganasho bhavishyati || 193|| sarvada sarvakamarthi
    japedetattu sarvada | yasya smarana matrena vairinam kulanashanam || 194|| bhogamokshapradam shreshtham
    bhuktimuktiphalapradam | sarvapapaprashamanam sarvapasmaranashanam || 195|| rajacairari mrityunam
    nashanam jayavardhanam | marane saptaratram tu dakshinabhimukho japet || 196|| udan mukhah sahasram
    tu rakshanaya japennaishi | pathatam sha
  devanagari: रविक्रोधतिरस्कृतः हिरण्यगर्भो हेमाङ्गो हेमरूपो हिरण्यदः । ब्रह्मज्योतिरनावेक्ष्यश्चामुण्डाजनको
    रवि ॥ १३७॥ मोक्षार्थिजनसंसेव्यो मोक्षदो मोक्षनायकः । महाश्मशाननिलयो वेदाश्वो भूरथस्थिरः ॥ १३८॥ मृगव्याधो
    धर्मधाम प्रभिन्नस्फटिकः प्रभः । सर्वज्ञः परमात्मा च ब्रह्मानन्दाश्रयो विभुः ॥ १३९॥ शरभेशो महादेवः
    परब्रह्म सदाशिवः । स्वराविकृतिकर्ता च स्वरातीतः स्वयंविभुः ॥ १४०॥ स्वर्गतः स्वर्गतिर्दाता नियन्ता
    नियताश्रयः । भूमिरूपो भूमिकर्ता भूधरो भूधराश्रयः ॥ १४१॥ भूतनाथो भूतकर्ता भूतसंहारकारकः । भविष्यज्ञो
    भवत्राता भवदो भवहारकः ॥ १४२॥ वरदो वरदाता च वरप्रीतो वरप्रदः । कूटस्थः कूटरूपश्च त्रिकूटो मन्त्रविग्रहः
    ॥ १४३॥ मन्त्रार्थो मन्त्रगम्यश्च मन्त्रेंशो मन्त्रभागकः । सिद्धिमन्त्रः सिद्धिदाता जपसिद्धिस्वभावकः
    ॥ १४४॥ नामातिगो नामरूपो नामरूपगुणाश्रयः । गुणकर्ता गुणत्राता गुणातीता गुणरिहा ॥ १४५॥ गुणग्रामो गुणाधीशः
    गुणनिर्गुणकारकः । अकारमातृकारूपः अकारातीतभावनः ॥ १४६॥ परमैश्वर्यदाता च परमप्रीतिदायकः । परमः परमानन्दः
    परानन्दः परात्परः ॥ १४७॥ वैकुण्ठपीठमध्यस्थो वैकुण्ठो विष्णुविग्रहः । कैलासवासी कैलासे शिवरूपः शिवप्रदः
    ॥ १४८॥ जटाजूटोद्भूषिताङ्गो भस्मधूसरभूषणः । दिग्वासाः दिग्विभागश्च दिङ्गतरनिवासकः ॥ १४९॥ ध्यानकर्ता
    ध्यानमूर्तिर्धारणाधारणप्रियः । जीवन्मुक्तिपुरीनाथो द्वादशान्तस्थितप्रभुः ॥ १५०॥ तत्त्वस्थस्तत्त्वरूपस्थस्तत्त्वातीतोऽतितत्त्वगः
    । तत्त्वासाम्यस्तत्त्वगम्यस्तत्त्वार्थसर्वदर्शकः ॥ १५१॥ तत्त्वासनस्तत्त्वमार्गस्तत्त्वान्तस्तत्त्वविग्रहः
    । दर्शनादतिगो दृश्यो दृश्यातीतातिदर्शकः ॥ १५२॥ दर्शनो दर्शनातीतो भावनाकाररूपधृत् । मणिपर्वतसंस्थानो
    मणिभूषणभूषितः ॥ १५३॥ मणिप्रीतो मणिश्रेष्ठो मणिस्थो मणिरूपकः । चिन्तामणिगृहान्तस्थः सर्वचिन्ताविवर्जितः
    ॥ १५४॥ चिन्ताक्रान्तभक्तचिन्त्यो चिन्तनाकारचिन्तकः । अचिन्त्यश्चिन्त्यरूपश्च निश्चिन्त्यो निश्चयात्मकः
    ॥ १५५॥ निश्चयो निश्चयाधीशो निश्चयात्मकदर्शकः । त्रिविक्रमस्त्रिकालज्ञस्त्रिमूर्तिस्त्रिपुरान्तकः ॥
    १५६॥ ब्रह्मचारी व्रतप्रीतो गृहस्थो गृहवासकः । परम्धाम परंब्रह्म परमात्मा परात्परः ॥ १५७॥ सर्वेश्वरः
    सर्वमयः सर्वसाक्षी विलक्षणः । मणिद्वीपो द्वीपनाथो द्वीपान्तो द्वीपलक्षणः ॥ १५८॥ सप्तसागरकर्ता च सप्तसागरनायकः
    । महीधरो महीभर्ता महीपालो महास्वनः ॥ १५९॥ महीव्याप्तोऽव्यक्तरूपः सुव्यक्तो व्यक्तभावनः । सुवेषाढ्यः
    सुखप्रीतः सुगमः सुगमाश्रयः ॥ १६०॥ तापत्रयाग्निसन्तप्तसमाह्लादनचन्द्रमाः । तारणस्तापसाराध्यस्तनुमध्यस्तमोमहः
    ॥ १६१॥ पररूपः परध्येयः परदैवतदैवतः । ब्रह्मपूज्यो जगत्पूज्यो भक्तपूज्यो वरप्रदः ॥ १६२॥ अद्वैतो द्वैतचित्तश्च
    द्वैताद्वैतविवर्जितः । अभेद्यः सर्वभेद्यश्च भेद्यभेदकबोधकः ॥ १६३॥ लाक्षारससवर्णाभः प्लवङ्गमप्रियोत्तमः
    । शत्रूसम्हारकर्ता च अवतारपरो हरः ॥ १६४॥ संविदीशः संविदात्मा संविज्ज्ञानप्रदायकः । संवित्कर्ता च भक्तश्च
    संविदानन्दरूपवान् ॥ १६५॥ संशयातीतसंहार्यः सर्वसंशयहारकः । निःसंशयमनोध्येयः संशयात्मातिदूरगः ॥ १६६॥
    शैवमन्त्र शिवप्रीतदीक्षाशैवस्वभावकः । भूपतिः क्ष्माकृतो भूपो भूपभूपत्वदायकः ॥ १६७॥ सर्वधर्मसमायुक्तः
    सर्वधर्मविवर्धकः । सर्वशास्ता सर्ववेदः सर्ववेत्ता सतृप्तिमान् ॥ १६८॥ भक्तभावावतारश्च भुक्तिमुक्तिफलप्रदः
    । भक्तसिद्धार्थसिद्धिश्च सिद्धिबुद्धिप्रदायकः ॥ १६९॥ वाराणसीवासदाता वाराणसीवरप्रदः । वाराणसीनाथरूपो
    गङ्गामस्तकधारकः ॥ १७०॥ पर्वताश्रयकर्ता च लिङ्गं त्र्यम्बकपर्वतः । लिङ्गदेहो लिङ्गपतिर्लिङ्गपूज्योऽतिदुर्लभः
    ॥ १७१॥ रुद्रप्रियो रुद्रसेव्य उग्ररूप विराट् स्तुतः । मालारुद्राक्षभूषाङ्गो जपरुद्राक्षतोषितः ॥ १७२॥
    सत्यसत्यः सत्यदाता सत्यकर्ता सदाश्रयः । सत्यसाक्षी सत्यलक्ष्मी लक्ष्म्यातीतमनोहरः ॥ १७३॥ जनको जगतामीशो
    जनिता जननिश्चयः । सृष्टिस्थितः सृष्टिरूपी सृष्टिरूपस्थितिप्रदः ॥ १७४॥ संहाररूपः कालाग्निः कालसंहाररूपकः
    । सप्तपातालपादस्थो महदाकाशशीर्षवान् ॥ १७५॥ अमृतश्चामृताकारः अमृतामृतरूपकः । अमृताकारचित्तिस्थः अमृतोकृवकारणः
    ॥ १७६॥ अमृताहारनित्यस्थस्त्वमृतोद्भवरूपवान् । अमृतांशोऽमृताधीशोऽमृतप्रीतिविवर्धनः ॥ १७७॥ अनिर्देश्यो
    अनिर्वाच्यो अनङ्गोऽनङ्गसंश्रयः । श्रयेदः श्रेयो रूपश्च श्रेयोऽतीतफलोत्तमः ॥ १७८॥ सारः संसारसाक्षी
    च सारासारविचक्षणः । धारणातीतभावस्थो धारणान्वयगोचरः ॥ १७९॥ गोचरो गोचरातीतः अतीव प्रियगोचरः । प्रियप्रियः
    तथा स्वार्थी स्वार्थः स्वार्थफलप्रदः ॥ १८०॥ अर्थार्थसाक्षी लक्षांशो लक्ष्यलक्षणविग्रहः । जगदीशो जगत्त्राता
    जगन्मयो जगद्गुरुः ॥ १८१॥ गुरुमूर्तिः स्वयंवेद्यो वेद्यवेदकरूपकः । रूपापीतो रूपकर्ता सर्वरूपार्थदायकः
    ॥ १८२॥ अर्थदस्त्वर्थमान्यच अर्थार्थी अर्थदायकः । विभवो वैभवः श्रेष्ठः सर्ववैभवादायकः ॥ १८३॥ चतुःषष्टिकलासूत्रः
    चतुःषष्टिकलामयः । पुराणश्रवणाकारः पुराणपुरुषोत्तमः ॥ १८४॥ पुरातनपुराख्यातः पूर्वजः पूर्वपूर्वकः ।
    मन्त्रतन्त्रार्थसर्वज्ञः सर्वतन्त्रप्रकाशकः ॥ १८५॥ तन्त्रवेता तन्त्रकर्ता तन्त्रातरनिवासकः । तन्त्रगम्यस्तन्त्रमान्यस्तन्त्रयन्त्रफलप्रदः
    ॥ १८६॥ सर्वतन्त्रार्थतत्त्वज्ञस्तन्त्रराजः स्वतन्त्रकः । ब्रह्माण्डकोटिकर्ता च ब्रह्माण्डोदरपूरकः
    ॥ १८७॥ ब्रह्माण्डदेशदाता च ब्रह्मज्ञानपरायणः । स्वयम्भूः शम्भुरूपश्च हंसविग्रहनिस्पृहः ॥ १८८॥ श्वासिनिः
    श्वास उच्छ्वासः सर्वसंशयहारकः । सोऽहंरूपस्वभावश्च सोऽहंरूपप्रदर्शकः ॥ १८९॥ सोऽहमस्मीति नित्यस्थः सोऽहं
    हंसः स्वरूपवान् । हंसोहंसः स्वरूपश्च हंसविग्रहनिःस्पृहः । श्वासनिःश्वासौच्छ्वासः पक्षिराजो निरञ्जनः
    ॥ १९०॥ ॥ फलश्रुति ॥ अष्टाधिकसहस्रं तु नाम साहस्रमुत्तमम् । नित्यं सङ्कीर्तनासक्तः कीर्तयेत्पुण्यवासरे
    ॥ १९१॥ सङ्क्रातौ विषुवे चैव पौर्णमास्यां विशेषतः । अमावस्यां रविवारे त्रिःसप्तवारपाठकः ॥ १९२॥ स्वप्ने
    दर्शनमाप्नोति कार्याकार्येऽपि दृश्यते । रविवारे दशावृत्या रोगनाशो भविष्यति ॥ १९३॥ सर्वदा सर्वकामार्थी
    जपेदेतत्तु सर्वदा । यस्य स्मरण मात्रेण वैरिणां कुलनाशनम् ॥ १९४॥ भोगमोक्षप्रदं श्रेष्ठं भुक्तिमुक्तिफलप्रदम्
    । सर्वपापप्रशमनं सर्वापस्मारनाशनम् ॥ १९५॥ राजचैरारि मृत्युनां नाशनं जयवर्धनम् । मारणे सप्तरात्रं तु
    दक्षिणाभिमुखो जपेत् ॥ १९६॥ उदङ् मुखः सहस्रं तु रक्षाणाय जपेन्नैशि । पठतां श
