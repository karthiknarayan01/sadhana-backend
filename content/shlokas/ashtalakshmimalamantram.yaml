id: ashtalakshmimalamantram
category: mantra
name:
  english: ashtalakshmimalamantram
  devanagari: अष्टलक्ष्मीमालामन्त्रम्
content:
  english: om namo bhagavatyai shrimahalakshmyai hrim phat svaha || iti shriashtalakshmimalamantram sampurnam
    |
  devanagari: ॐ नमो भगवत्यै श्रीमहालाक्ष्म्यै ह्रीं फट् स्वाहा ॥ इति श्रीअष्टलक्ष्मीमालामन्त्रं सम्पूर्णम्
    ।
