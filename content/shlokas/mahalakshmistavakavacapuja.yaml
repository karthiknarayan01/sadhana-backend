id: mahalakshmistavakavacapuja
category: kavacha
name:
  english: mahalakshmistavakavacapuja
  devanagari: महालक्ष्मीस्तवकवचपूजा
content:
  english: shrimahalakshmistavakavacapuja shriganeshaya namah | narada uvaca | avirbhuya haristasmai kim
    stotram kavacam dadau | mahalakshmyashca lakshmishastanme bruhi tapodhana || 1|| narayana uvaca |
    pushkare ca tapastaptva virarama sureshvarah | avirbabhuva tatraiva klishtam drishtva harih svayam
    || 2|| tamuvaca hrishikesho varam vrinu yathepsitam | sa ca vavre varam lakshmimishastasmai dadau
    muda || 3|| varam dattva hrishikeshah pravaktumupacakrame | hitam satyam ca saram ca parinamasukhavaham
    || 4|| madhusudana uvaca | grihana kavacam shakra sarvaduhkhavinashanam | paramaishvaryajanakam sarvashatruvimardanam
    || 5|| brahmane ca pura dattam vishtape ca jalaplute | yaddhritva jagatam shreshthah sarvaishvaryayuto
    vidhih || 6|| babhuvurmanavah sarve sarvaishvaryayuta yatah | sarvaishvaryapradasyasya kavacasya rishirvidhih
    || 7|| panktishchandashca sa devi svayam padmalaya vara | siddhyaishvaryasukheshveva viniyogah prakirtitah
    || 8|| yaddhritva kavacam lokah sarvatra vijayi bhavet | mastakam patu me padma kantham patu haripriya
    || 9|| nasikam patu me lakshmih kamala patu locane | keshankeshavakanta ca kapalam kamalalaya || 10||
    jagatprasurgandayugmam skandham sampatprada sada | om shrim kamalavasinyai svaha prishtham sada'vatu
    || 11|| om hrim shrim padmalayayai svaha vakshah sada'vatu | patu shrirmama kankalam bahuyugmam ca
    te namah || 12|| om hrim shrim lakshmyai namah padau patu me santatam ciram | om hrim shrim namah
    padmayai svaha patu nitambakam || 13|| om shrim mahalakshmyai svaha sarvangam patu me sada | om hrim
    shrim klim mahalakshmyai svaha mam patu sarvatah || 14|| iti te kathitam vatsa sarvasampatkaram param
    | sarvaishvaryapradam nama kavacam paramadbhutam || 15|| gurumabhyarcya vidhivatkavacam dharayettu
    yah | kanthe va dakshine bahau sa sarvavijayi bhavet || 16|| mahalakshmirgriham tasya na jahati kadacana
    | tasyacchayeva satatam sa ca janmani janmani || 17|| idam kavacamajnatva bhajellakshmim sa mandadhih
    | shatalakshaprajape'pi na mantrah siddhidayakah || 18|| narayana uvaca | dattva tasmai ca kavacam
    mantram vai shodashaksharam | santushtashca jagannatho jagatam hitakaranam || 19|| om hrim shrim klim
    namo mahalakshmyai svaha | dadau tasmai ca kripaya cendraya ca mahamune || 20|| dhyanam ca samavedoktam
    gopaniyam sudurlabham | siddhairmunindrairdushprapyam dhruvam siddhipradam shubham || 21|| shvetacampakavarnabham
    shatacandrasamaprabham | vahnishuddhamshukadhanam ratnabhushanabhushitam || 22|| ishaddhasyaprasannasyam
    bhaktanugrahakarikam | kasturibindumadhyastham sinduram bhushanam tatha || 23|| amulyaratnaracitakundalojjvalabhushanam
    | bimrati kabaribharam malatimalyashobhitam || 24|| sahasradalapadmastham svastham ca sumanoharam
    | shantam ca shrihareh kantam tam bhajejjagatam prasum || 25|| dhyanenanena devendro dhyatva lakshmim
    manoharam | bhaktya sampujya tasyai ca copacaramstu shodasha || 26|| stutva'nena stavenaiva vakshyamanena
    vasava | natva varam grihitva ca labhishyasi ca nirvritim || 27|| stavanam sha
  devanagari: श्रीमहालक्ष्मीस्तवकवचपूजा श्रीगणेशाय नमः । नारद उवाच । आविर्भूय हरिस्तस्मै किं स्तोत्रं
    कवचं ददौ । महालक्ष्म्याश्च लक्ष्मीशस्तन्मे ब्रूहि तपोधन ॥ १॥ नारायण उवाच । पुष्करे च तपस्तप्त्वा विरराम
    सुरेश्वरः । आविर्बभूव तत्रैव क्लिष्टं दृष्ट्वा हरिः स्वयम् ॥ २॥ तमुवाच हृषीकेशो वरं वृणु यथेप्सितम्
    । स च वव्रे वरं लक्ष्मीमीशस्तस्मै ददौ मुदा ॥ ३॥ वरं दत्त्वा हृषीकेशः प्रवक्तुमुपचक्रमे । हितं सत्यं
    च सारं च परिणामसुखावहम् ॥ ४॥ मधुसूदन उवाच । गृहाण कवचं शक्र सर्वदुःखविनाशनम् । परमैश्वर्यजनकं सर्वशत्रुविमर्दनम्
    ॥ ५॥ ब्रह्मणे च पुरा दत्तं विष्टपे च जलप्लुते । यद्धृत्वा जगतां श्रेष्ठः सर्वैश्वर्ययुतो विधिः ॥ ६॥
    बभूवुर्मनवः सर्वे सर्वैश्वर्ययुता यतः । सर्वैश्वर्यप्रदस्यास्य कवचस्य ऋषिर्विधिः ॥ ७॥ पङ्क्तिश्छन्दश्च
    सा देवी स्वयं पद्मालया वरा । सिद्ध्यैश्वर्यसुखेष्वेव विनियोगः प्रकीर्तितः ॥ ८॥ यद्धृत्वा कवचं लोकः
    सर्वत्र विजयी भवेत् । मस्तकं पातु मे पद्मा कण्ठं पातु हरिप्रिया ॥ ९॥ नासिकां पातु मे लक्ष्मीः कमला
    पातु लोचने । केशान्केशवकान्ता च कपालं कमलालया ॥ १०॥ जगत्प्रसूर्गण्डयुग्मं स्कन्धं सम्पत्प्रदा सदा
    । ॐ श्रीं कमलवासिन्यै स्वाहा पृष्ठं सदाऽवतु ॥ ११॥ ॐ ह्रीं श्रीं पद्मालयायै स्वाहा वक्षः सदाऽवतु ।
    पातु श्रीर्मम कङ्कालं बाहुयुग्मं च ते नमः ॥ १२॥ ॐ ह्रीं श्रीं लक्ष्म्यै नमः पादौ पातु मे सन्ततं चिरम्
    । ॐ ह्रीं श्रीं नमः पद्मायै स्वाहा पातु नितम्बकम् ॥ १३॥ ॐ श्रीं महालक्ष्म्यै स्वाहा सर्वाङ्गं पातु
    मे सदा । ॐ ह्रीं श्रीं क्लीं महालक्ष्म्यै स्वाहा मां पातु सर्वतः ॥ १४॥ इति ते कथितं वत्स सर्वसम्पत्करं
    परम् । सर्वैश्वर्यप्रदं नाम कवचं परमाद्भुतम् ॥ १५॥ गुरुमभ्यर्च्य विधिवत्कवचं धारयेत्तु यः । कण्ठे
    वा दक्षिणे बाहौ स सर्वविजयी भवेत् ॥ १६॥ महालक्ष्मीर्गृहं तस्य न जहाति कदाचन । तस्यच्छायेव सततं सा
    च जन्मनि जन्मनि ॥ १७॥ इदं कवचमज्ञात्वा भजेल्लक्ष्मीं स मन्दधीः । शतलक्षप्रजापेऽपि न मन्त्रः सिद्धिदायकः
    ॥ १८॥ नारायण उवाच । दत्त्वा तस्मै च कवचं मन्त्रं वै षोडशाक्षरम् । सन्तुष्टश्च जगन्नाथो जगतां हितकारणम्
    ॥ १९॥ ॐ ह्रीं श्रीं क्लीं नमो महालक्ष्म्यै स्वाहा । ददौ तस्मै च कृपया चेन्द्राय च महामुने ॥ २०॥ ध्यानं
    च सामवेदोक्तं गोपनीयं सुदुर्लभम् । सिद्धैर्मुनीन्द्रैर्दुष्प्राप्यं ध्रुवं सिद्धिप्रदं शुभम् ॥ २१॥
    श्वेतचम्पकवर्णाभां शतचन्द्रसमप्रभाम् । वह्निशुद्धांशुकाधानां रत्नभूषणभूषिताम् ॥ २२॥ ईषद्धास्यप्रसन्नास्यां
    भक्तानुग्रहकारिकाम् । कस्तूरीबिन्दुमध्यस्थं सिन्दूरं भूषणं तथा ॥ २३॥ अमूल्यरत्नरचितकुण्डलोज्ज्वलभूषणम्
    । बिम्रती कबरीभारं मालतीमाल्यशोभितम् ॥ २४॥ सहस्रदलपद्मस्थां स्वस्थां च सुमनोहराम् । शान्तां च श्रीहरेः
    कान्तां तां भजेज्जगतां प्रसूम् ॥ २५॥ ध्यानेनानेन देवेन्द्रो ध्यात्वा लक्ष्मीं मनोहराम् । भक्त्या सम्पूज्य
    तस्यै च चोपचारांस्तु षोडश ॥ २६॥ स्तुत्वाऽनेन स्तवेनैव वक्ष्यमाणेन वासव । नत्वा वरं गृहीत्वा च लभिष्यसि
    च निर्वृतिम् ॥ २७॥ स्तवनं श
