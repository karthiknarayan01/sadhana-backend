id: sri-venkateswara-sharanagati-gadyam
category: stotram
name:
  english: Sri Venkateswara Sharanagati Gadyam
content:
  english: yo nityamacyutapadambujayugmarukma vyamohatastaditarani trinaya mene | asmadgurorbhagavato'sya
    dayaikasindhoh ramanujasya caranau sharanam prapadye || vande vedantakarpuracamikara karandakam |
    ramanujaryamaryanam cudamanimaharnisham || om || bhagavannarayanabhimatanurupa svaruparupa gunavibhavaishvarya
    shiladyanavadhikatishaya asankhyeya kalyanagunaganam padmavanalayam bhagavatim shriyam devim nityanapayinim
    niravadyam devadevadivyamahishim akhilajaganmataram asmanmataram asharanyasharanyam ananyasharanah
    sharanamaham prapadye || paramarthika bhagavaccaranaravinda yugalaikantikatyantika parabhakti parajnana
    paramabhaktikrita paripurnanavarata nityavishadatamananya prayojananavadhikatishaya priya bhagavadanubhavajanitanavadhikatishaya
    pritikaritasheshavasthocita asheshasheshataikaratirupa nityakainkaryapraptyapekshaya paramarthiki
    bhagavaccaranaravinda sharanagatih yathavasthita avirata'stu me || astu te | tayaiva sarvam sampatsyate
    || akhilaheyapratyanika kalyanaikatana svetara samastavastuvilakshanananta jnananandaikasvarupa svabhimatanurupaikarupacintya
    divyadbhuta nityaniravadya niratishayaujjvalya saundarya saugandhya saukumarya lavanya yauvanadyanantagunanidhi
    divyarupa svabhavikanavadhikatishaya jnana balaishvarya virya shakti tejassaushilya vatsalya mardavarjava
    sauharda samya karunya madhurya gambhiryaudarya caturya sthairya dhairya shaurya parakrama satyakama
    satyasankalpa krititva kritajnatadyasankhyeya kalyanagunaganaugha maharnava svocita vividha vicitranantashcarya
    nitya niravadya niratishaya sugandha niratishaya sukhasparsha niratishayaujjvalya kirita makuta cudavatamsa
    makarakundala graiveyaka hara keyura kataka shrivatsa kaustubha muktadamodarabandhana pitambara kanciguna
    nupuradyaparimita divyabhushana svanurupacintyashakti shankhacakragada'si sharngadyasankhyeya nityaniravadya
    niratishaya kalyanadivyayudha svabhimata nityaniravadyanurupa svaruparupaguna vibhavaishvarya shiladyanavadhikatishayasankhyeya
    kalyanagunaganashrivallabha evambhuta bhuminilanayaka svacchandanuvarti svarupasthiti pravrittibhedashesha
    sheshataikaratirupa nityaniravadyaniratishaya jnana kriyaishvaryadyananta kalyanagunagana shesha sheshashana
    garudapramukha nanavidhananta parijana paricarika paricarita caranayugala paramayogi vanmanasa'paricchedya
    svarupa svabhava svabhimata vividhavicitranantabhogya bhogopakarana bhogasthana samriddhanantashcaryananta
    mahavibhavananta parimana nitya niravadya niratishaya shrivaikunthanatha svasankalpanuvidhayi svarupasthiti
    pravritti svasheshataikasvabhava prakriti purusha kalatmaka vividha vicitrananta bhogya bhoktrivarga
    bhogopakarana bhogasthanarupa nikhilajagadudaya vibhava layalila apara karunya saushilya vatsalyaudaryaishvarya
    saundarya mahodadhe analocitavisheshasheshaloka sharanya ashrita vatsalyaikajaladhe anavaratavidita
    nikhilabhutajatayathatmya asheshacaracarabhuta nikhilaniyamana nirata asheshacidacidvastu sheshibhuta
    ananyasharanastvatpadaravinda yugalam sharanamaham prapadye || atra dvayam | pitaram mataram daran
    putran bandhun sakhin gurun | ratnani dhanadhanyani kshetrani ca grihani ca || sarvadharmamshca santyajya
    sarvakamamshca saksharan | lokavikrantacaranau sharanam te'vrajam vibho || tvameva mata ca pita tvameva
    tvameva bandhushca gurustvameva | tvameva vidya dravinam tvameva tvameva sarvam mama devadeva || pita'si
    lokasya caracarasya tvamasya pujyashca gururgariyan | na tvatsamo'styabhyadhikah kuto'nyo lokatraye'pyapratimaprabhava
    || tasmatpranamya pranidhaya kayam prasadaye tvamahamishamidyam | piteva putrasya sakheva sakhyuh
    priyah priyayarhasi deva sodhum || manovakkayairanadikala pravrittanantakrityakarana krityakarana
    bhagavadapacara bhagavatapacarasahyapacararupa nanavidhanantapacaran arabdhakaryan anarabdhakaryan
    kritan kriyamanan karishyamanamshca sarvanasheshatah kshamasva | anadikalapravrittaviparita jnanamatmavishayam
    kritsna jagadvishayam ca viparitavrittam casheshavishayamadyapi vartamanam vartishyamanam ca sarvam
    kshamasva | madiyanadikarma pravahapravrittam bhagavatsvarupa tirodhanakarim viparitajnanajananim
    svavishayayashca bhogyabuddherjananim dehendriyatvena bhogyatvena sukshmarupena cavasthitam daivim
    gunamayim mayam dasabhutam sharanagato'smi tavasmi dasah iti vaktaram mam taraya | tesham jnani nityayuktah
    ekabhaktirvishishyate | priyo hi jnanino'tyarthamaham sa ca mama priyah || udarah sarva evaite jnani
    tvatmaiva me matam | asthitah sa hi yuktatma mamevanuttamam gatim || bahunam janmanamante jnanavanmam
    prapadyate | vasudevah sarvamiti sa mahatma sudurlabhah || iti shlokatrayoditajnaninam mam kurushva
    | purushah sa parah partha bhaktya labhyastvananyaya | bhaktya tvananyaya shakyah madbhaktim labhate
    param | iti sthanatrayodita parabhaktiyuktam mam kurushva | parabhakti parajnana paramabhaktyekasvabhavam
    mam kurushva | parabhakti parajnana paramabhaktikrita paripurnanavarata nityavishadatamananya prayojananavadhikatishaya
    priya bhagavadanubhavo'ham tathavidha bhagavadanubhava janitanavadhikatishaya pritikaritasheshavasthocitashesha
    sheshataikaratirupa nityakinkaro bhavani | evambhuta matkainkaryapraptyupayataya'vakluptasamasta vastuvihino'pi
    ananta tadvirodhipapakranto'pi ananta madapacarayukto'pi ananta madiyapacarayukto'pi anantasahyapacara
    yukto'pi etatkaryakarana bhutanadi viparitahankara vimudhatma svabhavo'pi etadubhayakaryakaranabhutanadi
    viparitavasana sambaddho'pi etadanuguna prakriti visheshasambaddho'pi etanmuladhyatmikadhibhautikadhidaivika
    sukhaduhkha taddhetu taditaropekshaniya vishayanubhava jnanasankocarupa maccaranaravindayugalaikantikatyantika
    parabhakti parajnana paramabhakti vighnapratihato'pi yena kenapi prakarena dvayavakta tvam kevalam
    madiyayaiva dayaya nishsheshavinashta sahetuka maccaranaravindayugalaikantikatyantika parabhakti parajnana
    paramabhaktivighnah matprasadalabdha maccaranaravindayugalaikantikatyantika parabhakti parajnana paramabhaktih
    matprasadadeva sakshatkrita yathavasthita matsvaruparupagunavibhuti lilopakaranavistarah aparokshasiddha
    manniyamyata maddasyaika svabhavatma svarupah madekanubhavah maddasyaikapriyah paripurnanavarata nityavishadatamananya
    prayojananavadhikatishayapriya madanubhavastvam tathavidha madanubhava janitanavadhikatishaya pritikaritasheshavasthocitashesha
    sheshataikaratirupa nityakinkaro bhava | evambhuto'si | adhyatmikadhibhautikadhidaivika duhkhavighnagandharahitastvam
    dvayamarthanusandhanena saha sadaivam vakta yavaccharirapatamatraiva shrirange sukhamasva || sharirapatasamaye
    tu kevalam madiyayaiva dayaya'tiprabuddhah mamevavalokayan apracyuta purvasamskaramanorathah jirnamiva
    vastram sukhenemam prakritim sthulasukshmarupam visrijya tadanimeva matprasadalabdha maccaranaravinda
    yugalaikantikatyantika parabhakti parajnana paramabhaktikrita paripurnanavarata nityavishadatamananya
    prayojananavadhikatishaya priya madanubhavastvam tathavidha madanubhavajanitanavadhikatishaya pritikaritasheshavasthocitasheshasheshataika
    ratirupa nityakinkaro bhavishyasi | mate'bhudatra samshayah | anritam noktapurvam me na ca vakshye
    kadacana | ramo dvirnabhibhashate | sakrideva prapannaya tavasmiti ca yacate | abhayam sarvabhutebhyo
    dadamyetadvratam mama || sarvadharman parityajya mamekam sharanam vraja | aham tva sarvapapebhyo mokshayishyami
    ma shucah || iti mayaiva hyuktam | atastvam tava tattvato mat jnanadarshana praptishu nissamshayah
    sukhamasva || antyakale smritiryatu tava kainkaryakarita | tamenam bhagavannadya kriyamanam kurushva
    me || iti shribhagavadramanuja viracitam sharanagati gadyam |
  devanagari: यो नित्यमच्युतपदाम्बुजयुग्मरुक्म व्यामोहतस्तदितराणि तृणाय मेने । अस्मद्गुरोर्भगवतोऽस्य दयैकसिन्धोः
    रामानुजस्य चरणौ शरणं प्रपद्ये ॥ वन्दे वेदान्तकर्पूरचामीकर करण्डकम् । रामानुजार्यमार्याणां चूडामणिमहर्निशम्
    ॥ ओम् ॥ भगवन्नारायणाभिमतानुरूप स्वरूपरूप गुणविभवैश्वर्य शीलाद्यनवधिकातिशय असङ्ख्येय कल्याणगुणगणां
    पद्मवनालयां भगवतीं श्रियं देवीं नित्यानपायिनीं निरवद्यां देवदेवदिव्यमहिषीं अखिलजगन्मातरं अस्मन्मातरं
    अशरण्यशरण्यां अनन्यशरणः शरणमहं प्रपद्ये ॥ पारमार्थिक भगवच्चरणारविन्द युगलैकान्तिकात्यन्तिक परभक्ति
    परज्ञान परमभक्तिकृत परिपूर्णानवरत नित्यविशदतमानन्य प्रयोजनानवधिकातिशय प्रिय भगवदनुभवजनितानवधिकातिशय
    प्रीतिकारिताशेषावस्थोचित अशेषशेषतैकरतिरूप नित्यकैङ्कर्यप्राप्त्यपेक्षया पारमार्थिकी भगवच्चरणारविन्द
    शरणागतिः यथावस्थिता अविरताऽस्तु मे ॥ अस्तु ते । तयैव सर्वं सम्पत्स्यते ॥ अखिलहेयप्रत्यनीक कल्याणैकतान
    स्वेतर समस्तवस्तुविलक्षणानन्त ज्ञानानन्दैकस्वरूप स्वाभिमतानुरूपैकरूपाचिन्त्य दिव्याद्भुत नित्यनिरवद्य
    निरतिशयौज्ज्वल्य सौन्दर्य सौगन्ध्य सौकुमार्य लावण्य यौवनाद्यनन्तगुणनिधि दिव्यरूप स्वाभाविकानवधिकातिशय
    ज्ञान बलैश्वर्य वीर्य शक्ति तेजस्सौशील्य वात्सल्य मार्दवार्जव सौहार्द साम्य कारुण्य माधुर्य गाम्भीर्यौदार्य
    चातुर्य स्थैर्य धैर्य शौर्य पराक्रम सत्यकाम सत्यसङ्कल्प कृतित्व कृतज्ञताद्यसङ्ख्येय कल्याणगुणगणौघ
    महार्णव स्वोचित विविध विचित्रानन्ताश्चर्य नित्य निरवद्य निरतिशय सुगन्ध निरतिशय सुखस्पर्श निरतिशयौज्ज्वल्य
    किरीट मकुट चूडावतंस मकरकुण्डल ग्रैवेयक हार केयूर कटक श्रीवत्स कौस्तुभ मुक्तादामोदरबन्धन पीताम्बर काञ्चीगुण
    नूपुराद्यपरिमित दिव्यभूषण स्वानुरूपाचिन्त्यशक्ति शङ्खचक्रगदाऽसि शार्ङ्गाद्यसङ्ख्येय नित्यनिरवद्य निरतिशय
    कल्याणदिव्यायुध स्वाभिमत नित्यनिरवद्यानुरूप स्वरूपरूपगुण विभवैश्वर्य शीलाद्यनवधिकातिशयासङ्ख्येय कल्याणगुणगणश्रीवल्लभ
    एवम्भूत भूमिनीलानायक स्वच्छन्दानुवर्ति स्वरूपस्थिति प्रवृत्तिभेदाशेष शेषतैकरतिरूप नित्यनिरवद्यनिरतिशय
    ज्ञान क्रियैश्वर्याद्यनन्त कल्याणगुणगण शेष शेषाशन गरुडप्रमुख नानाविधानन्त परिजन परिचारिका परिचरित
    चरणयुगल परमयोगि वाङ्मनसाऽपरिच्छेद्य स्वरूप स्वभाव स्वाभिमत विविधविचित्रानन्तभोग्य भोगोपकरण भोगस्थान
    समृद्धानन्ताश्चर्यानन्त महाविभवानन्त परिमाण नित्य निरवद्य निरतिशय श्रीवैकुण्ठनाथ स्वसङ्कल्पानुविधायि
    स्वरूपस्थिति प्रवृत्ति स्वशेषतैकस्वभाव प्रकृति पुरुष कालात्मक विविध विचित्रानन्त भोग्य भोक्तृवर्ग
    भोगोपकरण भोगस्थानरूप निखिलजगदुदय विभव लयलील अपार कारुण्य सौशील्य वात्सल्यौदार्यैश्वर्य सौन्दर्य महोदधे
    अनालोचितविशेषाशेषलोक शरण्य आश्रित वात्सल्यैकजलधे अनवरतविदित निखिलभूतजातयाथात्म्य अशेषचराचरभूत निखिलनियमन
    निरत अशेषचिदचिद्वस्तु शेषिभूत अनन्यशरणस्त्वत्पादारविन्द युगलं शरणमहं प्रपद्ये ॥ अत्र द्वयम् । पितरं
    मातरं दारान् पुत्रान् बन्धून् सखीन् गुरून् । रत्नानि धनधान्यानि क्षेत्राणि च गृहाणि च ॥ सर्वधर्मांश्च
    सन्त्यज्य सर्वकामांश्च साक्षरान् । लोकविक्रान्तचरणौ शरणं तेऽव्रजं विभो ॥ त्वमेव माता च पिता त्वमेव
    त्वमेव बन्धुश्च गुरुस्त्वमेव । त्वमेव विद्या द्रविणं त्वमेव त्वमेव सर्वं मम देवदेव ॥ पिताऽसि लोकस्य
    चराचरस्य त्वमस्य पूज्यश्च गुरुर्गरीयान् । न त्वत्समोऽस्त्यभ्यधिकः कुतोऽन्यो लोकत्रयेऽप्यप्रतिमप्रभाव
    ॥ तस्मात्प्रणम्य प्रणिधाय कायं प्रसादये त्वामहमीशमीड्यम् । पितेव पुत्रस्य सखेव सख्युः प्रियः प्रियायार्हसि
    देव सोढुम् ॥ मनोवाक्कायैरनादिकाल प्रवृत्तानन्ताकृत्यकरण कृत्याकरण भगवदपचार भागवतापचारासह्यापचाररूप
    नानाविधानन्तापचारान् आरब्धकार्यान् अनारब्धकार्यान् कृतान् क्रियमाणान् करिष्यमाणांश्च सर्वानशेषतः क्षमस्व
    । अनादिकालप्रवृत्तविपरीत ज्ञानमात्मविषयं कृत्स्न जगद्विषयं च विपरीतवृत्तं चाशेषविषयमद्यापि वर्तमानं
    वर्तिष्यमाणं च सर्वं क्षमस्व । मदीयानादिकर्म प्रवाहप्रवृत्तां भगवत्स्वरूप तिरोधानकरीं विपरीतज्ञानजननीं
    स्वविषयायाश्च भोग्यबुद्धेर्जननीं देहेन्द्रियत्वेन भोग्यत्वेन सूक्ष्मरूपेण चावस्थितां दैवीं गुणमयीं
    मायां दासभूतं शरणागतोऽस्मि तवास्मि दासः इति वक्तारं मां तारय । तेषां ज्ञानी नित्ययुक्तः एकभक्तिर्विशिष्यते
    । प्रियो हि ज्ञानिनोऽत्यर्थमहं स च मम प्रियः ॥ उदाराः सर्व एवैते ज्ञानी त्वात्मैव मे मतम् । आस्थितः
    स हि युक्तात्मा मामेवानुत्तमां गतिम् ॥ बहूनां जन्मनामन्ते ज्ञानवान्मां प्रपद्यते । वासुदेवः सर्वमिति
    स महात्मा सुदुर्लभः ॥ इति श्लोकत्रयोदितज्ञानिनं मां कुरुष्व । पुरुषः स परः पार्थ भक्त्या लभ्यस्त्वनन्यया
    । भक्त्या त्वनन्यया शक्यः मद्भक्तिं लभते पराम् । इति स्थानत्रयोदित परभक्तियुक्तं मां कुरुष्व । परभक्ति
    परज्ञान परमभक्त्येकस्वभावं मां कुरुष्व । परभक्ति परज्ञान परमभक्तिकृत परिपूर्णानवरत नित्यविशदतमानन्य
    प्रयोजनानवधिकातिशय प्रिय भगवदनुभवोऽहं तथाविध भगवदनुभव जनितानवधिकातिशय प्रीतिकारिताशेषावस्थोचिताशेष
    शेषतैकरतिरूप नित्यकिङ्करो भवानि । एवम्भूत मत्कैङ्कर्यप्राप्त्युपायतयाऽवक्लुप्तसमस्त वस्तुविहीनोऽपि
    अनन्त तद्विरोधिपापाक्रान्तोऽपि अनन्त मदपचारयुक्तोऽपि अनन्त मदीयापचारयुक्तोऽपि अनन्तासह्यापचार युक्तोऽपि
    एतत्कार्यकारण भूतानादि विपरीताहङ्कार विमूढात्म स्वभावोऽपि एतदुभयकार्यकारणभूतानादि विपरीतवासना सम्बद्धोऽपि
    एतदनुगुण प्रकृति विशेषसम्बद्धोऽपि एतन्मूलाध्यात्मिकाधिभौतिकाधिदैविक सुखदुःख तद्धेतु तदितरोपेक्षणीय
    विषयानुभव ज्ञानसङ्कोचरूप मच्चरणारविन्दयुगलैकान्तिकात्यन्तिक परभक्ति परज्ञान परमभक्ति विघ्नप्रतिहतोऽपि
    येन केनापि प्रकारेण द्वयवक्ता त्वं केवलं मदीययैव दयया निश्शेषविनष्ट सहेतुक मच्चरणारविन्दयुगलैकान्तिकात्यन्तिक
    परभक्ति परज्ञान परमभक्तिविघ्नः मत्प्रसादलब्ध मच्चरणारविन्दयुगलैकान्तिकात्यन्तिक परभक्ति परज्ञान परमभक्तिः
    मत्प्रसादादेव साक्षात्कृत यथावस्थित मत्स्वरूपरूपगुणविभूति लीलोपकरणविस्तारः अपरोक्षसिद्ध मन्नियाम्यता
    मद्दास्यैक स्वभावात्म स्वरूपः मदेकानुभवः मद्दास्यैकप्रियः परिपूर्णानवरत नित्यविशदतमानन्य प्रयोजनानवधिकातिशयप्रिय
    मदनुभवस्त्वं तथाविध मदनुभव जनितानवधिकातिशय प्रीतिकारिताशेषावस्थोचिताशेष शेषतैकरतिरूप नित्यकिङ्करो
    भव । एवम्भूतोऽसि । आध्यात्मिकाधिभौतिकाधिदैविक दुःखविघ्नगन्धरहितस्त्वं द्वयमर्थानुसन्धानेन सह सदैवं
    वक्ता यावच्छरीरपातमत्रैव श्रीरङ्गे सुखमास्व ॥ शरीरपातसमये तु केवलं मदीययैव दययाऽतिप्रबुद्धः मामेवावलोकयन्
    अप्रच्युत पूर्वसंस्कारमनोरथः जीर्णमिव वस्त्रं सुखेनेमां प्रकृतिं स्थूलसूक्ष्मरूपां विसृज्य तदानीमेव
    मत्प्रसादलब्ध मच्चरणारविन्द युगलैकान्तिकात्यन्तिक परभक्ति परज्ञान परमभक्तिकृत परिपूर्णानवरत नित्यविशदतमानन्य
    प्रयोजनानवधिकातिशय प्रिय मदनुभवस्त्वं तथाविध मदनुभवजनितानवधिकातिशय प्रीतिकारिताशेषावस्थोचिताशेषशेषतैक
    रतिरूप नित्यकिङ्करो भविष्यसि । मातेऽभूदत्र संशयः । अनृतं नोक्तपूर्वं मे न च वक्ष्ये कदाचन । रामो द्विर्नाभिभाषते
    । सकृदेव प्रपन्नाय तवास्मीति च याचते । अभयं सर्वभूतेभ्यो ददाम्येतद्व्रतं मम ॥ सर्वधर्मान् परित्यज्य
    मामेकं शरणं व्रज । अहं त्वा सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः ॥ इति मयैव ह्युक्तम् । अतस्त्वं तव
    तत्त्वतो मत् ज्ञानदर्शन प्राप्तिषु निस्संशयः सुखमास्व ॥ अन्त्यकाले स्मृतिर्यातु तव कैङ्कर्यकारिता
    । तामेनां भगवन्नद्य क्रियमाणां कुरुष्व मे ॥ इति श्रीभगवद्रामानुज विरचितं शरणागति गद्यम् ।
