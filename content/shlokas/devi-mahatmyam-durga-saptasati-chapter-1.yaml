id: devi-mahatmyam-durga-saptasati-chapter-1
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 1
content:
  english: '|| devi mahatmyam || || shridurgayai namah || || atha shridurgasaptashati || || madhukaitabhavadho
    nama prathamo''dhyayah || asya shri pradhama caritrasya brahma rishih | mahakali devata | gayatri
    chandah | nanda shaktih | rakta dantika bijam | agnistatvam | rigvedah svarupam | shri mahakali prityarthe
    pradhama caritra jape viniyogah | dhyanam khadgam cakra gadeshucapa parigha shulam bhushundim shirah
    shamnkham sandadhatim karaistrinayanam sarvamngabhushavritam | yam hantum madhukaibhau jalajabhustushtava
    supte harau nilashmadyuti masyapadadashakam seve mahakalikam|| om namashcandikayai om aim markandeya
    uvaca|| || savarnih suryatanayo yomanuh kathyate''shtamah| nishamaya tadutpattim vistaradgadato mama
    || || mahamayanubhavena yatha manvantaradhipah sa babhuva mahabhagah savarnistanayo raveh || || svarocishe''ntare
    purvam caitravamshasamudbhavah| suratho nama raja''bhut samaste kshitimandale || || tasya palayatah
    samyak prajah putranivaurasan| babhuvuh shatravo bhupah kolavidhvamsinastada || || tasya tairabhavadyuddham
    atiprabaladandinah| nyunairapi sa tairyuddhe kolavidhvamsibhirjitah || || tatah svapuramayato nijadeshadhipo''bhavat|
    akrantah sa mahabhagastaistada prabalaribhih || || amatyairbalibhirdushtai rdurbalasya duratmabhih|
    kosho balam capahritam tatrapi svapure tatah || || tato mrigayavyajena hritasvamyah sa bhupatih| ekaki
    hayamaruhya jagama gahanam vanam || || satatrashramamadrakshi ddvijavaryasya medhasah| prashantashvapadakirna
    munishishyopashobhitam || || tasthau kancitsa kalam ca munina tena satkritah| itashcetashca vicaramstasmin
    munivarashrame|| || so''cintayattada tatra mamatvakrishtacetanah| || || matpurvaih palitam purvam
    mayahinam puram hi tat madbhrityaistairasadvrittaih rdharmatah palyate na va || || na jane sa pradhano
    me shura hastisadamadah mama vairivasham yatah kanbhoganupalapsyate || || ye mamanugata nityam prasadadhanabhojanaih
    anuvrittim dhruvam te''dya kurvantyanyamahibhritam || || asamyagvyayashilaistaih kurvadbhih satatam
    vyayam sancitah so''tiduhkhena kshayam kosho gamishyati || || etaccanyacca satatam cintayamasa parthivah
    tatra viprashramabhyashe vaishyamekam dadarsha sah || || sa prishtastena kastvam bho hetushca agamane''tra
    kah sashoka iva kasmatvam durmana iva lakshyase| || || ityakarnya vacastasya bhupateh pranayoditam
    pratyuvaca sa tam vaishyah prashrayavanato nripam|| || samadhirnama vaishyo''hamutpanno dhaninam kule
    putradarairnirastashca dhanalobhad asadhubhih|| || vihinashca dhanaidaraih putrairadaya me dhanam|
    vanamabhyagato duhkhi nirastashcaptabandhubhih|| || so''ham na vedmi putranam kushalakushalatmikam|
    pravrittim svajananam ca daranam catra samsthitah|| || kim nu tesham grihe kshemam akshemam kinnu
    sampratam katham tekinnusadvritta durvritta kinnumesutah|| || yairnirasto bhava~llubdhaih putradaradibhirdhanaih||
    || teshu kim bhavatah sneha manubadhnati manasam|| || evametadyatha praha bhavanasmadgatam vacah kim
    karomi na badhnati mama nishturatam manah|| || aih santyajya pitrisneham dhana lubdhairnirakritah
    patihsvajanahardam ca harditeshveva me manah| || || kimetannabhijanami janannapi mahamate yatprema
    pravanam cittam viguneshvapi bandhushu|| || tesham krite me nihshvaso daurmanasyam cajayate|| || aromi
    kim yanna manasteshvapritishu nishthuram || || tatastau sahitau vipra tammunim samupasthitau|| ||
    samadhirnama vaishyo''sau sa ca pardhiva sattamah|| || kritva tu tau yathanyayyam yatharham tena samvidam|
    upavishtau kathah kashcit ccakraturvaishyapardhivau|| || bhagavamstvamaham prashtumicchamyekam vadasvatat
    || || duhkhaya yanme manasah svacittayattatam vina|| || mamatvam gatarajyasya rajyangeshvakhileshvapi
    | janato''pi yathajnasya kimetanmunisattama || || ayam ca ikritah putraih darairbhrityaistathojghitah
    svajanena ca santyaktah steshu hardi tathapyati || || eva mesha tathaham ca dvavaptyantaduhkhitau|
    drishtadoshe''pi vishaye mamatvakrishtamanasau || || tatkenaitanmahabhaga yanmohò jnaninorapi mamasya
    ca bhavatyesha vivekandhasya mudhata || || jnana masti samastasya jantorvshaya gocare| vishayashca
    mahabhaga yanti caivam prithakprithak|| || keciddiva tatha ratrau praninah stulyadrishtayah || ||
    jnanino manujah satyam kim tu te na hi kevalam| yato hi jnaninah sarve pashupakshimrigadayah|| ||
    jnanam ca tanmanushyanam yattesham mrigapakshinam manushyanam ca yattesham tulyamanyattathobhayoh||
    || jnane''pi sati pashyaitan pataganchabacancushu| kanamokshadritan mohatpidyamananapi kshudha|| ||
    manusha manujavyaghra sabhilashah sutan prati lobhat pratyupakaraya nanvetan kim na pashyasi|| ||
    tathapi mamatavarte mohagarte nipatitah mahamaya prabhavena samsarasthitikarina|| || tannatra vismayah
    karyo yoganidra jagatpateh| mahamaya hareshcaisha taya sammohyate jagat|| || jnaninamapi cetamsi devi
    bhagavati hi sa baladakṟshyamohaya mahamaya prayacchati || || taya visrijyate vishvam jagadetaccaracaram
    | saisha prasanna varada nrinam bhavati muktaye || || sa vidya parama mukterhetubhuta sanatani samsarabandhahetushca
    saiva sarveshvareshvari|| || bhagavan kahi sa devi mamayeti yam bhavan | braviti kathamutpanna sa
    karmasyashca kim dvija|| || yatprabhava ca sa devi yatsvarupa yadudbhava| tatsarvam shrotumicchami
    tvatto brahmavidam vara|| || nityaiva sa jaganmurtistaya sarvamidam tatam|| || tathapi tatsamutpattirbahudha
    shruyatam mamah|| || devanam karyasiddhyartham avirbhavati sa yada| utpanneti tada loke sa nityapyabhidhiyate
    || || yoganidram yada vishnurjagatyekarnavikrite| astirya sheshamabhajat kalpante bhagavan prabhuh||
    || tada dvavasurau ghorau vikhyatau madhukaitabhau| vishnukarnamalodbhutau hantum brahmanamudyatau||
    || sa nabhi kamale vishnoh sthito brahma prajapatih drishtva tavasurau cograu prasuptam ca janardanam||
    || tushtava yoganidram tamekagrahridayah sthitah vibodhanardhaya harerharinetrakritalayam || || vishveshvarim
    jagaddhatrim sthitisamharakarinim| nidram bhagavatim vishnoratulam tejasah prabhuh || || tvam svaha
    tvam svadha tvamhi vashatkarah svaratmika| sudha tvamakshare nitye tridha matratmika sthita|| || ardhamatra
    sthita nitya yanuccaryavisheshatah tvameva sa tvam savitri tvam deva janani para || || tvayaitaddharyate
    vishvam tvayaitat srijyate jagat| tvayaitat palyate devi tvamatsyante ca sarvada|| || visrishtau srishtirupatvam
    sthiti rupa ca palane| tatha samhritirupante jagato''sya jaganmaye || || mahavidya mahamaya mahamedha
    mahasmritih| mahamoha ca bhavati mahadevi mahasuri || || prakritistvam ca sarvasya gunatraya vibhavini|
    kalaratrirmaharatrirmoharatrishca daruna|| || tvam shristvamishvari tvam hristvam buddhirbhodhalakshana|
    lajjapushtistatha tushtistvam shantih kshanti reva ca|| || khadgini shulini ghora gadini cakrini tatha|
    shankhini capini banabhushundiparighayudha|| || saumya saumyatarasheshasaumyebhyastvatisundari paraparanam
    parama tvameva parameshvari|| || yacca kincitkvacidvastu sadasadvakhilatmike| tasya sarvasya ya shaktih
    sa tvam kim stuyasemaya|| || yaya tvaya jagat srashta jagatpatatti yo jagat| so''pi nidravasham nitah
    kastvam stotumiheshvarah|| || vishnuh shariragrahanam ahamishana eva ca karitaste yato''tastvam kah
    stotum shaktiman bhavet|| || sa tvamittham prabhavaih svairudarairdevi samstuta| mohayaitau duradharshavasurau
    madhukaitabhau || || prabodham ca jagatsvami niyatamacyuta laghu || || bodhashca kriyatamasya hantumetau
    mahasurau || || evam stuta tada devi tamasi tatra vedhasa vishnoh prabhodhanardhaya nihantum madhukaitabhau
    || || netrasyanasikabahuhridayebhyastathorasah| nirgamya darshane tasthau brahmano avyaktajanmanah
    || || uttasthau ca jagannathah staya mukto janardanah| ekarnave ahishayanattatah sa dadrishe ca tau
    || || madhukaitabhau duratmana vativiryaparakramau krodharaktekshanavattum brahmanam janitodyamau
    || || samutthaya tatastabhyam yuyudhe bhagavan harih pancavarshasahastrani bahupraharano vibhuh ||
    || tavapyatibalonmattau mahamayavimohitau || || uktavantau varo''smatto vriyatamiti keshavam || ||
    bhavetamadya me tushtau mama vadhyavubhavapi || || kimanyena varenatra etavriddi vritam mama || ||
    vancitabhyamiti tada sarvamapomayam jagat| vilokya tabhyam gadito bhagavan kamalekshanah || || avam
    jahi na yatrorvi salilena paripluta| || || tathetyuktva bhagavata shankhacakragadabhrita| kritva cakrena
    vai chinne jaghane shirasi tayoh || || evamesha samutpanna brahmana samstuta svayam| prabhavamasya
    devyastu bhuyah shrinu vadami te || || || jaya jaya shri svasti shrimarkandeyapurane savarnike manvantare
    devimahatmye madhukaitabhavadho nama pradhamo''dhyayah || ahuti om em sangayai sayudhayai sashaktikayai
    saparivarayai savahanayai em bijadhishtayai maha kalikayai maha ahutim samarpayami namah svaha ||'
  devanagari: ॥ देवी माहात्म्यम् ॥ ॥ श्रीदुर्गायै नमः ॥ ॥ अथ श्रीदुर्गासप्तशती ॥ ॥ मधुकैटभवधो नाम प्रथमोऽध्यायः
    ॥ अस्य श्री प्रधम चरित्रस्य ब्रह्मा ऋषिः । महाकाली देवता । गायत्री छन्दः । नन्दा शक्तिः । रक्त दन्तिका
    बीजम् । अग्निस्तत्वम् । ऋग्वेदः स्वरूपम् । श्री महाकाली प्रीत्यर्थे प्रधम चरित्र जपे विनियोगः । ध्यानं
    खड्गं चक्र गदेषुचाप परिघा शूलं भुशुण्डीं शिरः शंङ्खं सन्दधतीं करैस्त्रिनयनां सर्वांङ्गभूषावृताम् ।
    यां हन्तुं मधुकैभौ जलजभूस्तुष्टाव सुप्ते हरौ नीलाश्मद्युति मास्यपाददशकां सेवे महाकालिकां॥ ॐ नमश्चण्डिकायै
    ॐ ऐं मार्कण्डेय उवाच॥ ॥ सावर्णिः सूर्यतनयो योमनुः कथ्यतेऽष्टमः। निशामय तदुत्पत्तिं विस्तराद्गदतो मम
    ॥ ॥ महामायानुभावेन यथा मन्वन्तराधिपः स बभूव महाभागः सावर्णिस्तनयो रवेः ॥ ॥ स्वारोचिषेऽन्तरे पूर्वं
    चैत्रवंशसमुद्भवः। सुरथो नाम राजाऽभूत् समस्ते क्षितिमण्डले ॥ ॥ तस्य पालयतः सम्यक् प्रजाः पुत्रानिवौरसान्।
    बभूवुः शत्रवो भूपाः कोलाविध्वंसिनस्तदा ॥ ॥ तस्य तैरभवद्युद्धं अतिप्रबलदण्डिनः। न्यूनैरपि स तैर्युद्धे
    कोलाविध्वंसिभिर्जितः ॥ ॥ ततः स्वपुरमायातो निजदेशाधिपोऽभवत्। आक्रान्तः स महाभागस्तैस्तदा प्रबलारिभिः
    ॥ ॥ अमात्यैर्बलिभिर्दुष्टै र्दुर्बलस्य दुरात्मभिः। कोशो बलं चापहृतं तत्रापि स्वपुरे ततः ॥ ॥ ततो मृगयाव्याजेन
    हृतस्वाम्यः स भूपतिः। एकाकी हयमारुह्य जगाम गहनं वनम् ॥ ॥ सतत्राश्रममद्राक्षी द्द्विजवर्यस्य मेधसः।
    प्रशान्तश्वापदाकीर्ण मुनिशिष्योपशोभितम् ॥ ॥ तस्थौ कञ्चित्स कालं च मुनिना तेन सत्कृतः। इतश्चेतश्च विचरंस्तस्मिन्
    मुनिवराश्रमे॥ ॥ सोऽचिन्तयत्तदा तत्र ममत्वाकृष्टचेतनः। ॥ ॥ मत्पूर्वैः पालितं पूर्वं मयाहीनं पुरं हि
    तत् मद्भृत्यैस्तैरसद्वृत्तैः र्धर्मतः पाल्यते न वा ॥ ॥ न जाने स प्रधानो मे शूर हस्तीसदामदः मम वैरिवशं
    यातः कान्भोगानुपलप्स्यते ॥ ॥ ये ममानुगता नित्यं प्रसादधनभोजनैः अनुवृत्तिं ध्रुवं तेऽद्य कुर्वन्त्यन्यमहीभृतां
    ॥ ॥ असम्यग्व्ययशीलैस्तैः कुर्वद्भिः सततं व्ययं सञ्चितः सोऽतिदुःखेन क्षयं कोशो गमिष्यति ॥ ॥ एतच्चान्यच्च
    सततं चिन्तयामास पार्थिवः तत्र विप्राश्रमाभ्याशे वैश्यमेकं ददर्श सः ॥ ॥ स पृष्टस्तेन कस्त्वं भो हेतुश्च
    आगमनेऽत्र कः सशोक इव कस्मात्वं दुर्मना इव लक्ष्यसे। ॥ ॥ इत्याकर्ण्य वचस्तस्य भूपतेः प्रणायोदितम् प्रत्युवाच
    स तं वैश्यः प्रश्रयावनतो नृपम्॥ ॥ समाधिर्नाम वैश्योऽहमुत्पन्नो धनिनां कुले पुत्रदारैर्निरस्तश्च धनलोभाद्
    असाधुभिः॥ ॥ विहीनश्च धनैदारैः पुत्रैरादाय मे धनम्। वनमभ्यागतो दुःखी निरस्तश्चाप्तबन्धुभिः॥ ॥ सोऽहं
    न वेद्मि पुत्राणां कुशलाकुशलात्मिकाम्। प्रवृत्तिं स्वजनानां च दाराणां चात्र संस्थितः॥ ॥ किं नु तेषां
    गृहे क्षेमं अक्षेमं किन्नु साम्प्रतं कथं तेकिन्नुसद्वृत्ता दुर्वृत्ता किन्नुमेसुताः॥ ॥ यैर्निरस्तो
    भवाँल्लुब्धैः पुत्रदारादिभिर्धनैः॥ ॥ तेषु किं भवतः स्नेह मनुबध्नाति मानसम्॥ ॥ एवमेतद्यथा प्राह भवानस्मद्गतं
    वचः किं करोमि न बध्नाति मम निष्टुरतां मनः॥ ॥ ऐः सन्त्यज्य पितृस्नेहं धन लुब्धैर्निराकृतः पतिःस्वजनहार्दं
    च हार्दितेष्वेव मे मनः। ॥ ॥ किमेतन्नाभिजानामि जानन्नपि महामते यत्प्रेम प्रवणं चित्तं विगुणेष्वपि बन्धुषु॥
    ॥ तेषां कृते मे निःश्वासो दौर्मनस्यं चजायते॥ ॥ अरोमि किं यन्न मनस्तेष्वप्रीतिषु निष्ठुरम् ॥ ॥ ततस्तौ
    सहितौ विप्र तम्मुनिं समुपस्थितौ॥ ॥ समाधिर्नाम वैश्योऽसौ स च पार्धिव सत्तमः॥ ॥ कृत्वा तु तौ यथान्याय्यं
    यथार्हं तेन संविदम्। उपविष्टौ कथाः काश्चित् च्चक्रतुर्वैश्यपार्धिवौ॥ ॥ भगवंस्त्वामहं प्रष्टुमिच्छाम्येकं
    वदस्वतत् ॥ ॥ दुःखाय यन्मे मनसः स्वचित्तायत्ततां विना॥ ॥ ममत्वं गतराज्यस्य राज्याङ्गेष्वखिलेष्वपि ।
    जानतोऽपि यथाज्ञस्य किमेतन्मुनिसत्तम ॥ ॥ अयं च इकृतः पुत्रैः दारैर्भृत्यैस्तथोज्घितः स्वजनेन च सन्त्यक्तः
    स्तेषु हार्दी तथाप्यति ॥ ॥ एव मेष तथाहं च द्वावप्त्यन्तदुःखितौ। दृष्टदोषेऽपि विषये ममत्वाकृष्टमानसौ
    ॥ ॥ तत्केनैतन्महाभाग यन्मोहॊ ज्ञानिनोरपि ममास्य च भवत्येषा विवेकान्धस्य मूढता ॥ ॥ ज्ञान मस्ति समस्तस्य
    जन्तोर्व्षय गोचरे। विषयश्च महाभाग यान्ति चैवं पृथक्पृथक्॥ ॥ केचिद्दिवा तथा रात्रौ प्राणिनः स्तुल्यदृष्टयः
    ॥ ॥ ज्ञानिनो मनुजाः सत्यं किं तु ते न हि केवलम्। यतो हि ज्ञानिनः सर्वे पशुपक्षिमृगादयः॥ ॥ ज्ञानं च
    तन्मनुष्याणां यत्तेषां मृगपक्षिणां मनुष्याणां च यत्तेषां तुल्यमन्यत्तथोभयोः॥ ॥ ज्ञानेऽपि सति पश्यैतान्
    पतगाञ्छाबचञ्चुषु। कणमोक्षादृतान् मोहात्पीड्यमानानपि क्षुधा॥ ॥ मानुषा मनुजव्याघ्र साभिलाषाः सुतान्
    प्रति लोभात् प्रत्युपकाराय नन्वेतान् किं न पश्यसि॥ ॥ तथापि ममतावर्ते मोहगर्ते निपातिताः महामाया प्रभावेण
    संसारस्थितिकारिणा॥ ॥ तन्नात्र विस्मयः कार्यो योगनिद्रा जगत्पतेः। महामाया हरेश्चैषा तया सम्मोह्यते
    जगत्॥ ॥ ज्ङानिनामपि चेतांसि देवी भगवती हि सा बलादाक्ऱ्ष्यमोहाय महामाया प्रयच्छति ॥ ॥ तया विसृज्यते
    विश्वं जगदेतच्चराचरम् । सैषा प्रसन्ना वरदा नृणां भवति मुक्तये ॥ ॥ सा विद्या परमा मुक्तेर्हेतुभूता
    सनातनी संसारबन्धहेतुश्च सैव सर्वेश्वरेश्वरी॥ ॥ भगवन् काहि सा देवी मामायेति यां भवान् । ब्रवीति कथमुत्पन्ना
    सा कर्मास्याश्च किं द्विज॥ ॥ यत्प्रभावा च सा देवी यत्स्वरूपा यदुद्भवा। तत्सर्वं श्रोतुमिच्छामि त्वत्तो
    ब्रह्मविदां वर॥ ॥ नित्यैव सा जगन्मूर्तिस्तया सर्वमिदं ततम्॥ ॥ तथापि तत्समुत्पत्तिर्बहुधा श्रूयतां
    ममः॥ ॥ देवानां कार्यसिद्ध्यर्थं आविर्भवति सा यदा। उत्पन्नेति तदा लोके सा नित्याप्यभिधीयते ॥ ॥ योगनिद्रां
    यदा विष्णुर्जगत्येकार्णवीकृते। आस्तीर्य शेषमभजत् कल्पान्ते भगवान् प्रभुः॥ ॥ तदा द्वावसुरौ घोरौ विख्यातौ
    मधुकैटभौ। विष्णुकर्णमलोद्भूतौ हन्तुं ब्रह्माणमुद्यतौ॥ ॥ स नाभि कमले विष्णोः स्थितो ब्रह्मा प्रजापतिः
    दृष्ट्वा तावसुरौ चोग्रौ प्रसुप्तं च जनार्दनम्॥ ॥ तुष्टाव योगनिद्रां तामेकाग्रहृदयः स्थितः विबोधनार्धाय
    हरेर्हरिनेत्रकृतालयाम् ॥ ॥ विश्वेश्वरीं जगद्धात्रीं स्थितिसंहारकारिणीम्। निद्रां भगवतीं विष्णोरतुलां
    तेजसः प्रभुः ॥ ॥ त्वं स्वाहा त्वं स्वधा त्वंहि वषट्कारः स्वरात्मिका। सुधा त्वमक्षरे नित्ये त्रिधा
    मात्रात्मिका स्थिता॥ ॥ अर्धमात्रा स्थिता नित्या यानुच्चार्याविशेषतः त्वमेव सा त्वं सावित्री त्वं देव
    जननी परा ॥ ॥ त्वयैतद्धार्यते विश्वं त्वयैतत् सृज्यते जगत्। त्वयैतत् पाल्यते देवि त्वमत्स्यन्ते च सर्वदा॥
    ॥ विसृष्टौ सृष्टिरूपात्वं स्थिति रूपा च पालने। तथा संहृतिरूपान्ते जगतोऽस्य जगन्मये ॥ ॥ महाविद्या महामाया
    महामेधा महास्मृतिः। महामोहा च भवती महादेवी महासुरी ॥ ॥ प्रकृतिस्त्वं च सर्वस्य गुणत्रय विभाविनी। कालरात्रिर्महारात्रिर्मोहरात्रिश्च
    दारुणा॥ ॥ त्वं श्रीस्त्वमीश्वरी त्वं ह्रीस्त्वं बुद्धिर्भोधलक्षणा। लज्जापुष्टिस्तथा तुष्टिस्त्वं शान्तिः
    क्षान्ति रेव च॥ ॥ खड्गिनी शूलिनी घोरा गदिनी चक्रिणी तथा। शङ्खिणी चापिनी बाणाभुशुण्डीपरिघायुधा॥ ॥ सौम्या
    सौम्यतराशेषसौम्येभ्यस्त्वतिसुन्दरी परापराणां परमा त्वमेव परमेश्वरी॥ ॥ यच्च किञ्चित्क्वचिद्वस्तु सदसद्वाखिलात्मिके।
    तस्य सर्वस्य या शक्तिः सा त्वं किं स्तूयसेमया॥ ॥ यया त्वया जगत् स्रष्टा जगत्पातात्ति यो जगत्। सोऽपि
    निद्रावशं नीतः कस्त्वां स्तोतुमिहेश्वरः॥ ॥ विष्णुः शरीरग्रहणं अहमीशान एव च कारितास्ते यतोऽतस्त्वां
    कः स्तोतुं शक्तिमान् भवेत्॥ ॥ सा त्वमित्थं प्रभावैः स्वैरुदारैर्देवि संस्तुता। मोहयैतौ दुराधर्षावसुरौ
    मधुकैटभौ ॥ ॥ प्रबोधं च जगत्स्वामी नीयतामच्युता लघु ॥ ॥ बोधश्च क्रियतामस्य हन्तुमेतौ महासुरौ ॥ ॥ एवं
    स्तुता तदा देवी तामसी तत्र वेधसा विष्णोः प्रभोधनार्धाय निहन्तुं मधुकैटभौ ॥ ॥ नेत्रास्यनासिकाबाहुहृदयेभ्यस्तथोरसः।
    निर्गम्य दर्शने तस्थौ ब्रह्मणो अव्यक्तजन्मनः ॥ ॥ उत्तस्थौ च जगन्नाथः स्तया मुक्तो जनार्दनः। एकार्णवे
    अहिशयनात्ततः स ददृशे च तौ ॥ ॥ मधुकैटभौ दुरात्माना वतिवीर्यपराक्रमौ क्रोधरक्तेक्षणावत्तुं ब्रह्मणां
    जनितोद्यमौ ॥ ॥ समुत्थाय ततस्ताभ्यां युयुधे भगवान् हरिः पञ्चवर्षसहस्त्राणि बाहुप्रहरणो विभुः ॥ ॥ तावप्यतिबलोन्मत्तौ
    महामायाविमोहितौ ॥ ॥ उक्तवन्तौ वरोऽस्मत्तो व्रियतामिति केशवम् ॥ ॥ भवेतामद्य मे तुष्टौ मम वध्यावुभावपि
    ॥ ॥ किमन्येन वरेणात्र एतावृद्दि वृतं मम ॥ ॥ वञ्चिताभ्यामिति तदा सर्वमापोमयं जगत्। विलोक्य ताभ्यां
    गदितो भगवान् कमलेक्षणः ॥ ॥ आवां जहि न यत्रोर्वी सलिलेन परिप्लुता। ॥ ॥ तथेत्युक्त्वा भगवता शङ्खचक्रगदाभृता।
    कृत्वा चक्रेण वै छिन्ने जघने शिरसी तयोः ॥ ॥ एवमेषा समुत्पन्ना ब्रह्मणा संस्तुता स्वयम्। प्रभावमस्या
    देव्यास्तु भूयः शृणु वदामि ते ॥ ॥ ॥ जय जय श्री स्वस्ति श्रीमार्कण्डेयपुराणे सावर्णिके मन्वन्तरे देवीमहात्म्ये
    मधुकैटभवधो नाम प्रधमोऽध्यायः ॥ आहुति ॐ एं साङ्गायै सायुधायै सशक्तिकायै सपरिवारायै सवाहनायै एं बीजाधिष्टायै
    महा कालिकायै महा अहुतिं समर्पयामि नमः स्वाहा ॥
