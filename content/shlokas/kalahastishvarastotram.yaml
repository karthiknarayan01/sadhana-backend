id: kalahastishvarastotram
category: stotram
name:
  english: kalahastishvarastotram
  devanagari: कालहस्तीश्वरस्तोत्रम्
content:
  english: ghumanghumanghumanghumaddhvanidhvanaddarisphutam | katitatighatikritotkatajinam kakuppatam
    sada bhajami kalahastisambamurtimishvaram || 4|| sudhashanadhiratpurisugahvarijamanjari
  devanagari: घुमङ्घुमङ्घुमङ्घुमद्ध्वनिध्वनद्दरीस्फुटम् । कटीतटीघटीकृतोत्कटाजिनं ककुप्पटं सदा भजामि कालहस्तिसाम्बमूर्तिमीश्वरम्
    ॥ ४॥ सुधाशनाधिराट्पुरीसुगह्वरीजमञ्जरी
meaning: {}
