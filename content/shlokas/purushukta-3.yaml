id: purushukta-3
category: veda
name:
  english: purushukta
  devanagari: पुरुषुक्त
content:
  english: '| 16 dha̱ta pu̱rasta̱dyamṷdaja̱hara̭ | sha̱krah pravi̱dvanpra̱disha̱shcata̭srah | tame̱vam
    vi̱dvana̱mrita̭ i̱ha bha̭vati | nanyah pantha̱ aya̭naya vidyate | 17 ya̱jnena̭ ya̱jnama̭yajanta de̱vah
    | tani̱ dharma̭ni pratha̱manya̭san | te ha̱ naka̭m mahi̱mana̭h sacante | yatra̱ purvḙ sa̱dhyah santi̭
    de̱vah | 18 || om namo nara̭yana̱ya || || uttaranarayanam || a̱dbhyah sambhṷtah prithi̱vyai rasa'
  devanagari: । १६ धा॒ता पु॒रस्ता॒द्यमु॑दाज॒हार॑ । श॒क्रः प्रवि॒द्वान्प्र॒दिश॒श्चत॑स्रः । तमे॒वं वि॒द्वान॒मृत॑
    इ॒ह भ॑वति । नान्यः पन्था॒ अय॑नाय विद्यते । १७ य॒ज्ञेन॑ य॒ज्ञम॑यजन्त दे॒वाः । तानि॒ धर्मा॑णि प्रथ॒मान्या॑सन्
    । ते ह॒ नाकं॑ महि॒मानः॑ सचन्ते । यत्र॒ पूर्वे॑ सा॒ध्याः सन्ति॑ दे॒वाः । १८ ॥ ॐ नमो नारा॑यणा॒य ॥ ॥
    उत्तरनारायणम् ॥ अ॒द्भ्यः संभू॑तः पृथि॒व्यै रसा
meaning: {}
