id: medha-suktam
category: stotram
name:
  english: Medha Suktam
  devanagari: मेधासूक्तम्
content:
  english: taittiriyaranyakam - 4 prapathakah 10 - anuvakah 41-44 om yashchandasamrishabho vishvarupah
    | chandobhyo'dhyamritathsambabhuva | sa mendro medhaya sprinotu | amritasya devadharano bhuyasam |
    shariram me vicarshanam | jihva me madhumattama | karnabhyam bhurivishruvam | brahmanah kosho'si medhaya
    pihitah | shrutam me gopaya | om shantih shantih shantih || om medhadevi jushamana na agadvishvaci
    bhadra sumanasyamana | tvaya jushta nudamana duruktan brihadvadema vidathe suvirah | tvaya jushta
    rishirbhavati devi tvaya brahma''gatashriruta tvaya | tvaya jushtashcitram vindate vasu sano jushasva
    dravino na medhe || medham ma indro dadatu medham devi sarasvati | medham me ashvinavubhavadhattam
    pushkarasraja | apsarasu ca ya medha gandharveshu ca yanmanah | daivim medha sarasvati sa mam medha
    surabhirjushata svaha || amam medha surabhirvishvarupa hiranyavarna jagati jagamya | urjasvati payasa
    pinvamana sa mam medha supratika jushantam | mayi medham mayi prajam mayyagnistejo dadhatu mayi medham
    mayi prajam mayindra indriyam dadhatu mayi medham mayi prajam mayi suryo bhrajo dadhatu | om mahadevyai
    ca vidmahe brahmapatni ca dhimahi | tanno vani pracodayat | om hamsa hamsaya vidmahe paramahamsaya
    dhimahi | tanno hamsah pracodayat | om shantih shantih shantih || nihsvarah - medhasuktam taittiriyaranyakam
    - 4 prapathakah 10 - anuvakah 41-44 om yashchandasamrishabho vishvarupah | chandobhyo'dhyamritathsambabhuva
    | sa mendro medhaya sprinotu | amritasya devadharano bhuyasam | shariram me vicarshanam | jihva me
    madhumattama | karnabhyam bhurivishruvam | brahmanah kosho'si medhaya pihitah | shrutam me gopaya
    | om shantih shantih shantih || om medhadevi jushamana na agadvishvaci bhadra sumanasyamana | tvaya
    jushta nudamana duruktan brihadvadema vidathe suvirah | tvaya jushta rishirbhavati devi tvaya brahma''gatashriruta
    tvaya | tvaya jushtashcitram vindate vasu sano jushasva dravino na medhe || medham ma indro dadatu
    medham devi sarasvati | medham me ashvinavubhavadhattam pushkarasraja | apsarasu ca ya medha gandharveshu
    ca yanmanah | daivim medha sarasvati sa mam medha surabhirjushata svaha || amam medha surabhirvishvarupa
    hiranyavarna jagati jagamya | urjasvati payasa pinvamana sa mam medha supratika jushantam | mayi medham
    mayi prajam mayyagnistejo dadhatu mayi medham mayi prajam mayindra indriyam dadhatu mayi medham mayi
    prajam mayi suryo bhrajo dadhatu | om mahadevyai ca vidmahe brahmapatni ca dhimahi | tanno vani pracodayat
    | om hamsa hamsaya vidmahe paramahamsaya dhimahi | tanno hamsah pracodayat | om shantih shantih shantih
    || Encoded vith accents by ṟajagopal iyer
  devanagari: तैत्तिरीयारण्यकम् - ४ प्रपाठकः १० - अनुवाकः ४१-४४ ॐ यश्छन्दसामृषभो विश्वरूपः । छन्दोभ्योऽध्यमृताथ्संबभूव
    । स मेन्द्रो मेधया स्पृणोतु । अमृतस्य देवधारणो भूयासम् । शरीरं मे विचर्षणम् । जिह्वा मे मधुमत्तमा
    । कर्णाभ्यां भूरिविश्रुवम् । ब्रह्मणः कोशोऽसि मेधया पिहितः । श्रुतं मे गोपाय । ॐ शान्तिः शान्तिः शान्तिः
    ॥ ॐ मेधादेवी जुषमाणा न आगाद्विश्वाची भद्रा सुमनस्यमाना । त्वया जुष्टा नुदमाना दुरुक्तान् बृहद्वदेम
    विदथे सुवीराः । त्वया जुष्ट ऋषिर्भवति देवि त्वया ब्रह्माऽऽगतश्रीरुत त्वया । त्वया जुष्टश्चित्रं विन्दते
    वसु सानो जुषस्व द्रविणो न मेधे ॥ मेधां म इन्द्रो ददातु मेधां देवी सरस्वती । मेधां मे अश्विनावुभावाधत्तां
    पुष्करस्रजा । अप्सरासु च या मेधा गन्धर्वेषु च यन्मनः । दैवीं मेधा सरस्वती सा मां मेधा सुरभिर्जुषता
    स्वाहा ॥ आमां मेधा सुरभिर्विश्वरूपा हिरण्यवर्णा जगती जगम्या । ऊर्जस्वती पयसा पिन्वमाना सा मां मेधा
    सुप्रतीका जुषन्ताम् । मयि मेधां मयि प्रजां मय्यग्निस्तेजो दधातु मयि मेधां मयि प्रजां मयीन्द्र इन्द्रियं
    दधातु मयि मेधां मयि प्रजां मयि सूर्यो भ्राजो दधातु । ॐ महादेव्यै च विद्महे ब्रह्मपत्नी च धीमहि । तन्नो
    वाणी प्रचोदयात् । ॐ हंस हंसाय विद्महे परमहंसाय धीमहि । तन्नो हंसः प्रचोदयात् । ॐ शान्तिः शान्तिः शान्तिः
    ॥ निःस्वराः - मेधासूक्तम् तैत्तिरीयारण्यकम् - ४ प्रपाठकः १० - अनुवाकः ४१-४४ ॐ यश्छन्दसामृषभो विश्वरूपः
    । छन्दोभ्योऽध्यमृताथ्संबभूव । स मेन्द्रो मेधया स्पृणोतु । अमृतस्य देवधारणो भूयासम् । शरीरं मे विचर्षणम्
    । जिह्वा मे मधुमत्तमा । कर्णाभ्यां भूरिविश्रुवम् । ब्रह्मणः कोशोऽसि मेधया पिहितः । श्रुतं मे गोपाय
    । ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ मेधादेवी जुषमाणा न आगाद्विश्वाची भद्रा सुमनस्यमाना । त्वया जुष्टा
    नुदमाना दुरुक्तान् बृहद्वदेम विदथे सुवीराः । त्वया जुष्ट ऋषिर्भवति देवि त्वया ब्रह्माऽऽगतश्रीरुत त्वया
    । त्वया जुष्टश्चित्रं विन्दते वसु सानो जुषस्व द्रविणो न मेधे ॥ मेधां म इन्द्रो ददातु मेधां देवी सरस्वती
    । मेधां मे अश्विनावुभावाधत्तां पुष्करस्रजा । अप्सरासु च या मेधा गन्धर्वेषु च यन्मनः । दैवीं मेधा सरस्वती
    सा मां मेधा सुरभिर्जुषता स्वाहा ॥ आमां मेधा सुरभिर्विश्वरूपा हिरण्यवर्णा जगती जगम्या । ऊर्जस्वती पयसा
    पिन्वमाना सा मां मेधा सुप्रतीका जुषन्ताम् । मयि मेधां मयि प्रजां मय्यग्निस्तेजो दधातु मयि मेधां मयि
    प्रजां मयीन्द्र इन्द्रियं दधातु मयि मेधां मयि प्रजां मयि सूर्यो भ्राजो दधातु । ॐ महादेव्यै च विद्महे
    ब्रह्मपत्नी च धीमहि । तन्नो वाणी प्रचोदयात् । ॐ हंस हंसाय विद्महे परमहंसाय धीमहि । तन्नो हंसः प्रचोदयात्
    । ॐ शान्तिः शान्तिः शान्तिः ॥ Eन्चोदेद् विथ् आच्चेन्त्स् ब्य् ऱजगोपल् ईयेर्
