id: sharadabhujangastotram
category: stotram
name:
  english: sharadabhujangastotram
  devanagari: शारदाभुजङ्गस्तोत्रम्
content:
  english: '||8|| ||iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah
    kritau sharadabhujangaprayatashtakam||'
  devanagari: ॥८॥ ॥इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः
    कृतौ शारदाभुजङ्गप्रयाताष्टकम्॥
meaning: {}
