id: avadhutopanishat
category: upanishad
name:
  english: avadhutopanishat
  devanagari: अवधूतोपनिषत्
content:
  english: upanishad avadhutopanishat gaunamukhyavadhutalihridayambujavarti yat | tattraipadam brahmatattvam
    svamatramavashishyate || om saha navavatu || saha nau bhunaktu || saha viryam karavavahai || tejasvinavadhitamastu
    ma vidvishavahai || om shantih shantih shantih || harih om atha ha samkritirbhagavantamavadhutam dattatreyam
    parisametya papraccha bhagavanko'vadhutasya ka sthitih kim lakshma kim samsaranamiti | tam hovaca
    bhagavo dattatreyah paramakarunikah || aksharatvadvarenyatvaddhritasamsarabandhanat | tattvamasyadilakshyatvadavadhuta
    itiryate || 1|| yo vilanghyashramanvarnanatmanyeva sthitah sada | ativarnashrami yogi avadhutah sa
    kathyate || 2|| tasya priyam shirah kritva modo dakshinapakshakah | pramoda uttarah paksha anando
    goshpadayate || 3|| gopalasadrisham shirshe napi madhye na capyadhah | brahmapuccham pratishtheti
    pucchakarena karayet || 4|| evam catushpatham kritva te yanti paramam gatim | na karmana na prajaya
    dhanena tyagenaike amritatvamanashuh || 5|| svairam svairaviharanam tatsamsaranam | sambara va digambara
    va | na tesham dharmadharmau na medhyamedhau | sada samgrahanyeshtyashvamedhamantayagam yajate | sa
    mahamakho mahayogah | kritsnametaccitram karma| svairam na vigayettanmahavratam | na sa mudhavallipyate
    | yatha ravih sarvarasanprabhunkte hutashanashcapi hi sarvabhakshah | tathaiva yogi vishayanprabhunkte
    na lipyate punyapapaishca shuddhah || 6|| apuryamanamacalapratishtham samudramapah pravishanti yadvat
    | tadvatkama yam pravishanti sarve sa shantimapnoti na kamakami || 7|| na nirodho na cotpattirna baddho
    na ca sadhakah | na mumukshurna vai mukta ityesha paramarthata || 8|| aihikamushmikavratasiddhai mukteshca
    siddhaye | bahukrityam pura syanme tatsarvamadhuna kritam || 9|| tadeva kritakrityatvam pratiyogipurahsaram
    | anusandadhadevayamevam tripyati nityashah || 10|| duhkhino'jnah samsarantu kamam putradyapekshaya
    | paramanandapurno'ham samsarami kimicchaya || 11|| anutishthantu karmani paralokayiyasavah | sarvalokatmakah
    kasmadanutishthami kim katham || 12|| vyacakshatam te shastrani vedanadhyapayantu va | ye'tradhikarino
    me tu nadhikaro'kriyatvatah || 13|| nidrabhikshe snanashauce necchami na karomi ca | drashtarashcetkalpayantu
    kim me syadanyakalpanat || 14|| gunjapunjadi dahyeta nanyaropitavahnina | nanyaropitasamsaradharma
    naivamaham bhaje || 15|| shrinvantvajnatatattvaste janankasmanchrinomyaham | manyantam samshayapanna
    na manye'hamasamshayah || 16|| viparyasto nididhyase kim dhyanamaviparyaye | dehatmatvaviparyasam
    na kadacidbhajamyaham || 17|| aham manushya ityadivyavaharo vinapyamum | viparyasam cirabhyastavasanato'vakalpate
    || 18|| arabdhakarmani kshine vyavaharo nivartate | karmakshaye tvasau naiva shameddhyanasahasratah
    || 19|| viralatvam vyavahriterishtam ceddhyanamastu te | badhikarmavyavahritim pashyandhyayamyaham
    kutah || 20|| vikshepo nasti yasmanme na samadhistato mama | vikshepo va samadhirva manasah syadvikarinah
    | nityanubhavarupasya ko me'tranubhavah prithak || 21|| kritam krityam prapaniyam praptamityeva nityashah
    | vyavaharo laukiko va shastriyo vanyathapi va | mamakarturalepasya yatharabdham pravartatam || 22||
    athava kritakritye'pi lokanugrahakamyaya | shastriyenaiva margena varte'ham mama ka kshatih || 23||
    devarcanasnanashaucabhikshadau vartatam vapuh | taram japatu vaktadvatpathatvamnayamastakam || 24||
    vishnum dhyayatu dhiryadva brahmanande viliyatam | sakshyaham kimcidapyatra na kurve napi karaye ||
    25|| kritakrityataya triptah praptaprapyataya punah | tripyannevam svamanasa manyatesau nirantaram
    || 26|| dhanyo'ham dhanyo'ham nityam svatmanamanjasa vedmi | dhanyo'ham dhanyo'ham brahmanando vibhati
    me spashtam || 27|| dhanyo'ham dhanyo'ham duhkham samsarikam na vikshe'dya | dhanyo'ham dhanyo'ham
    svasyajnanam palayitam k
  devanagari: उपनिषद् अवधूतोपनिषत् गौणमुख्यावधूतालिहृदयाम्बुजवर्ति यत् । तत्त्रैपदं ब्रह्मतत्त्वं स्वमात्रमवशिष्यते
    ॥ ॐ सह नाववतु ॥ सह नौ भुनक्तु ॥ सह वीर्यं करवावहै ॥ तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ हरिः ॐ अथ ह सांकृतिर्भगवन्तमवधूतं दत्तात्रेयं परिसमेत्य पप्रच्छ भगवन्कोऽवधूतस्य
    का स्थितिः किं लक्ष्म किं संसरणमिति । तं होवाच भगवो दत्तात्रेयः परमकारुणिकः ॥ अक्षरत्वाद्वरेण्यत्वाद्धृतसंसारबन्धनात्
    । तत्त्वमस्यादिलक्ष्यत्वादवधूत इतीर्यते ॥ १॥ यो विलङ्घ्याश्रमान्वर्णानात्मन्येव स्थितः सदा । अतिवर्णाश्रमी
    योगी अवधूतः स कथ्यते ॥ २॥ तस्य प्रियं शिरः कृत्वा मोदो दक्षिणपक्षकः । प्रमोद उत्तरः पक्ष आनन्दो गोष्पदायते
    ॥ ३॥ गोपालसदृशां शीर्षे नापि मध्ये न चाप्यधः । ब्रह्मपुच्छं प्रतिष्ठेति पुच्छाकारेण कारयेत् ॥ ४॥ एवं
    चतुष्पथं कृत्वा ते यान्ति परमां गतिम् । न कर्मणा न प्रजया धनेन त्यागेनैके अमृतत्वमानशुः ॥ ५॥ स्वैरं
    स्वैरविहरणं तत्संसरणम् । सांबरा वा दिगंबरा वा । न तेषां धर्माधर्मौ न मेध्यामेधौ । सदा सांग्रहण्येष्ट्याश्वमेधमन्तयागं
    यजते । स महामखो महायोगः । कृत्स्नमेतच्चित्रं कर्म। स्वैरं न विगायेत्तन्महाव्रतम् । न स मूढवल्लिप्यते
    । यथा रविः सर्वरसान्प्रभुङ्क्ते हुताशनश्चापि हि सर्वभक्षः । तथैव योगी विषयान्प्रभुङ्क्ते न लिप्यते
    पुण्यपापैश्च शुद्धः ॥ ६॥ आपूर्यमाणमचलप्रतिष्ठं समुद्रमापः प्रविशन्ति यद्वत् । तद्वत्कामा यं प्रविशन्ति
    सर्वे स शान्तिमाप्नोति न कामकामी ॥ ७॥ न निरोधो न चोत्पत्तिर्न बद्धो न च साधकः । न मुमुक्षुर्न वै मुक्त
    इत्येषा परमार्थता ॥ ८॥ ऐहिकामुष्मिकव्रातसिद्धै मुक्तेश्च सिद्धये । बहुकृत्यं पुरा स्यान्मे तत्सर्वमधुना
    कृतम् ॥ ९॥ तदेव कृतकृत्यत्वं प्रतियोगिपुरःसरम् । अनुसन्दधदेवायमेवं तृप्यति नित्यशः ॥ १०॥ दुःखिनोऽज्ञाः
    संसरन्तु कामं पुत्राद्यपेक्षया । परमानन्दपूर्णोऽहं संसरामि किमिच्छया ॥ ११॥ अनुतिष्ठन्तु कर्माणि परलोकयियासवः
    । सर्वलोकात्मकः कस्मादनुतिष्ठामि किं कथम् ॥ १२॥ व्याचक्षतां ते शास्त्राणि वेदानध्यापयन्तु वा । येऽत्राधिकारिणो
    मे तु नाधिकारोऽक्रियत्वतः ॥ १३॥ निद्राभिक्षे स्नानशौचे नेच्छामि न करोमि च । द्रष्टारश्चेत्कल्पयन्तु
    किं मे स्यादन्यकल्पनात् ॥ १४॥ गुञ्जापुञ्जादि दह्येत नान्यारोपितवह्निना । नान्यारोपितसंसारधर्मा नैवमहं
    भजे ॥ १५॥ शृण्वन्त्वज्ञाततत्त्वास्ते जानन्कस्माञ्छृणोम्यहम् । मन्यन्तां संशयापन्ना न मन्येऽहमसंशयः
    ॥ १६॥ विपर्यस्तो निदिध्यासे किं ध्यानमविपर्यये । देहात्मत्वविपर्यासं न कदाचिद्भजाम्यहम् ॥ १७॥ अहं
    मनुष्य इत्यादिव्यवहारो विनाप्यमुम् । विपर्यासं चिराभ्यस्तवासनातोऽवकल्पते ॥ १८॥ आरब्धकर्मणि क्षीणे
    व्यवहारो निवर्तते । कर्मक्षये त्वसौ नैव शामेद्ध्यानसहस्रतः ॥ १९॥ विरलत्वं व्यवहृतेरिष्टं चेद्ध्यानमस्तु
    ते । बाधिकर्मव्यवहृतिं पश्यन्ध्यायाम्यहं कुतः ॥ २०॥ विक्षेपो नास्ति यस्मान्मे न समाधिस्ततो मम । विक्षेपो
    वा समाधिर्वा मनसः स्याद्विकारिणः । नित्यानुभवरूपस्य को मेऽत्रानुभवः पृथक् ॥ २१॥ कृतं कृत्यं प्रापणीयं
    प्राप्तमित्येव नित्यशः । व्यवहारो लौकिको वा शास्त्रीयो वान्यथापि वा । ममाकर्तुरलेपस्य यथारब्धं प्रवर्तताम्
    ॥ २२॥ अथवा कृतकृत्येऽपि लोकानुग्रहकाम्यया । शास्त्रीयेणैव मार्गेन वर्तेऽहं मम का क्षतिः ॥ २३॥ देवार्चनस्नानशौचभिक्षादौ
    वर्ततां वपुः । तारं जपतु वाक्तद्वत्पठत्वाम्नायमस्तकम् ॥ २४॥ विष्णुं ध्यायतु धीर्यद्वा ब्रह्मानन्दे
    विलीयताम् । साक्ष्यहं किंचिदप्यत्र न कुर्वे नापि कारये ॥ २५॥ कृतकृत्यतया तृप्तः प्राप्तप्राप्यतया
    पुनः । तृप्यन्नेवं स्वमनसा मन्यतेसौ निरन्तरम् ॥ २६॥ धन्योऽहं धन्योऽहं नित्यं स्वात्मानमञ्जसा वेद्मि
    । धन्योऽहं धन्योऽहं ब्रह्मानन्दो विभाति मे स्पष्टम् ॥ २७॥ धन्योऽहं धन्योऽहं दुःखं सांसारिकं न वीक्षेऽद्य
    । धन्योऽहं धन्योऽहं स्वस्याज्ञानं पलायितं क्
