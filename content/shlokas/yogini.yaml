id: yogini
category: hridaya
name:
  english: yogini
  devanagari: योगिनी
content:
  english: h prithivi jata tasmad vishvamayi ca sa | gunahpancadasha prokta bhutanam tanmayi shiva ||
    30|| yasya yasya padarthasya sa ya shaktirudirita | sa sa sarveshvari devi sa sa sarvo maheshvarah
    || 31|| vyapta pancadasharnah sa vidya bhutagunatmikah | pancabhishca tatha shad bhishcaturbhirapi
    caksharah || 32|| svaravyanjanabhedena saptatrimshatprabhedeni | saptatrimshatprabhedena shat trimshatattvarupini
    || 33|| tattvatitasvabhava ca vidyaisham bhavyate sada | prithivyadishu bhuteshu vyapakam cottarottaram
    || 34|| bhutam tvadhastanam vyapyam tad guna vyapakashrayah | vyapyeshvavasthita devi sthulasukshmavibhedatah
    || 35|| tasmadvyomagunah shabdo vayvadin vyapya samsthitah | vyomabihaistu vidyasthairlakshayecchabdapancakam
    || 36|| tesham karunarupena sthita dhvanimayam param | bhaved gunavatam bijam gunanamapi vacakam ||
    37|| karyakaranabhavena tayoraikya vivakshaya | mahamayatrayenapi karanena ca binduna || 38|| vayvagnijalabhuminam
    sparshanam ca catushtayam | utpannam bhavayed devi sthulasukshmavibhedatah || 39|| rupanam tritayam
    tadvat tribhi rephairvibhavitam | pradhanam tejaso rupam tad bijena hi janyate || 40|| vidyasthaishcandrabijaistu
    sthulasukshmo rasah smritah | sambandho vidito loke rasasyapyamritasya ca || 41|| vasu dhaya guno
    gandhastallipirgandhavacika | bhuvanatrayasambhandhat tridhatvam tu maheshvari || 42|| ashuddhashuddhamishranam
    pramatrinam param vapuh | krodhishatritaye natha vidyasthena prakashyate || 43|| shrikanthadashakam
    tadvada vyaktasyapi vacakah | pranarupasthito devi tadvadekadashah parah || 44|| ekah sanneva purusho
    bahudha kayate hi sah | rudreshvarasadeshakhya devata mitavigrahah || 45|| bindutrayena kathita amitamitavigrahah
    | shantih shaktishca shambhushca nadatritayabodhanah || 46|| vaguramulavalaye sutradyah kavalikritah
    | tatha mantrah samastashca vidyayamatra samsthitah || 47|| gurukramena sampraptah sampradayartha
    iritah | nigarbhartho mahadevi shivagurvatmagocarah || 48|| shivagurvatmanamaikyanusamdhanattadatmakam
    || 49|| nishkalatvam shive budhva tadrupatvam gurorapi | tannirikshanasamarthyadatmanashca shivatmatam
    || 50|| bhavayedabhaktinamrah sankoconmeshakalankitah | kaulikam kathayishyami cakradevatayorapi ||
    51|| vidyagurvatmanamaikyam tatprakarah pradarshyate | lakaraishcaturasrani vrittatritayasamyutam
    || 52|| saroruhadvayam shaktairagnishomatmakam priye | hrillekhatrayasambhutairaksharairnavasankhyakaih
    || 53|| bindutrayayutairjatam navayonyatmakam priye | mandalatrayayuktam tu cakram shaktyanalatmakam
    || 54|| vyomabijatrayenaiva pramatritrityanvitam | icchajnanakriyarupamadanatrayasamyutam || 55||
    sadashivasanam devi mahabindumayam param | ittham mantratmakam cakram devatayah param vapuh || 56||
    ekadashadhikashatadevatatmataya punah | ganeshatvam mahadevyah sasomaravipavakaih || 57|| icchajnanakriyabhishca
    gunatrayayutaih punah | graharupa ca sa devi jnanakarmendriyairapi || 58|| tadarthaireva deveshi karanairantaraih
    punah | prakritya ca gunenapi pumstvabandhena catmana || 59|| nakshatravigraha jata yoginitvamathocyate
    | tvagadidhatunathabhirdakinyadibhirapyasau || 60|| vargashtakanivishtabhiryoginibhishca samyuta |
    yoginirupamasthaya rajate vishvavigra || 61|| pranapanau samanashcodanavyanau tatha punah | nagah
    kurmo'tha krikaro devadatto dhananjayah || 62|| jivatma parmatma caityetai rashisvarupini | akathaditripanktyatma
    tartiyadikramena sa || 63|| ganesho'bhunmahavidya paravagadivanmayi | bijabindudhvaninam ca trikuteshu
    grahatmika || 64|| hrillekhatrayasambhutaistithisamkhyaistathaksharaih | anyairdvadashabhirvarnairesha
    nakshatrarupini || 65|| vidyanantarbhutashaktyadyaih shaktaih shad bhistathaksharaih | yoginitvam
    ca vidyaya rashitvam cantyavarjitaih || 66|| evam vishvaprakara ca cakra rupa maheshvari | devya dehe
    yatha prokto gurudehe tathaiva hi || 67|| tatprasadacca shishyo'pi tadrupah samprajayate | ityevam
    kaulikarthastu kathito viravandite || 68|| tatha sarvarahsyartham kathayami tavanaghe | muladhare
    tadidrupe vagbhavakaratam gate || 69|| ashtatrimshatkalayuktapancashadvarnavigraha | vidya kundalinirupa
    mandalatrayabhedini || 70|| taditkotinibhaprakhya bisatantunibhakritih | vyomendumandalasakta sudhastrotahsvarupini
    || 71|| sada vyaptajagat kritsna sadanandasvarupini | esha svatmeti buddhistu rahasyartho maheshvari
    || 72|| mahatattvartham iti yattaca devi vadami te | nishkale prame sukshme nirlakshye bhavavarjite
    || 73|| vyomatite pare tattve prakashanandavigrahe | vishvottirne vishvamaye tattve svatmaniyojanam
    || 74|| tada prakashamanatvam tejasam tamasamapi | avinabhavarupatvam tasmadvishvasya sarvatah ||
    75|| prakashate mahatattvam divyakridarasojjvale | nirastasarvasamkalpavikalpasthitipurvakah || 76||
    rahasyartho maya guptah sadyah pratyayakarakah | mahajnanarnave drishtah shanka tatra na parvati ||
    77|| vidyapithanibaddheshu samsthito divyasiddhidah | kaulacaraparairdevi padukabhavanaparaih || 78||
    yoginimelanodyuktaih praptavidyabhishecanaih | shankakalankavigataih sada muditamanasaih || 79|| paramparyena
    vijnatarahasyarthavisharadaih | labhyate nanyatha devi tvam shapekulasundari || 80|| paramparyavihina
    ye jnanamatrena garvitah | tesham samayalopena vikurvanti maricayah || 81|| yastu divyarasasvadamodamanavimarshanah
    | deatatithinakshatre vare'pi ca vivasvatah || 82|| maricin prinayatyeva madiranandaghurnitah | sarvada
    ca visheshana labhate purnabodhatam || 83|| evamvhavastu deveshi deshikendraprasadatah | mahajnanamayo
    devi sadyah samprapyate naraih || 84|| evametatpradam jnanam vidyarnagamagocaram | devi guhyapriyenaiva
    vyakhyatam durgi shad vidham | sadyo yasya prabodhena viracakreshvaro bhavet || 85|| iti dvitiyah
    patalah samaptah | atha tritayah patalah pujasanketamadhuna kathayami tavanaghe | yasya prabodhamatrena
    jivanmuktah pramodate || 1|| tava nityodita puja tribhirbhedairvyavasthita | para capyapara gauri
    tritiya ca parapara || 2|| prathamadvaitabhavastha sarvaprasaragocara | dvitiya cakrapuja ca sada
    nishpadyate maya || 3|| evam jnanamaye devi tritiya tu parapara | uttama sa para jneya vidhanam sha
  devanagari: ह् पृथिवी जाता तस्माद् विश्वमयी च सा । गुणाःपञ्चदश प्रोक्ता भूतानं तन्मयी शिवा ॥ ३०॥ यस्य
    यस्य पदार्थस्य सा या शक्तिरुदीरिता । सा सा सर्वेश्वरी देवी स स सर्वो महेश्वरः ॥ ३१॥ व्याप्ता पञ्चदशार्णः
    सा विद्या भूतगुणात्मिकाः । पञ्चभिश्च तथा षड् भिश्चतुर्भिरपि चाक्षरः ॥ ३२॥ स्वरव्यञ्जनभेदेन सप्तत्रिंशत्प्रभेदेनी
    । सप्तत्रिंशत्प्रभेदेन षट् त्रिंशतत्त्वरूपिणी ॥ ३३॥ तत्त्वातीतस्वभावा च विद्यैषं भाव्यते सदा । पृथिव्यादिषु
    भूतेषु व्यापकं चोत्तरोत्तरम् ॥ ३४॥ भूतं त्वधस्तनं व्याप्यं तद् गुणा व्यापकाश्रयाः । व्याप्येष्ववस्थिता
    देवि स्थूलसूक्ष्मविभेदतः ॥ ३५॥ तस्माद्व्योमगुणः शब्दो वाय्वादीन् व्याप्य संस्थितः । व्योमबिहैस्तु
    विद्यास्थैर्लक्षयेच्छब्दपञ्चकम् ॥ ३६॥ तेषां कारुणरूपेण स्थित ध्वनिमयं परम् । भवेद् गुणवतां बीजं गुणानामपि
    वाचकम् ॥ ३७॥ कार्यकारणभावेन तयोरैक्य विवक्षया । महामायात्रयेणापि कारणेन च बिन्दुना ॥ ३८॥ वाय्वाग्निजलभूमीनां
    स्पर्शानां च चतुष्टयम् । उत्पन्नं भावयेद् देवि स्थूलसूक्ष्मविभेदतः ॥ ३९॥ रूपाणां त्रितयं तद्वत् त्रिभी
    रेफैर्विभावितम् । प्रधानं तेजसो रूपं तद् बीजेन हि जन्यते ॥ ४०॥ विद्यास्थैश्चन्द्रबीजैस्तु स्थूलसूक्ष्मो
    रसः स्मृतः । सम्बन्धो विदितो लोके रसस्याप्यमृतस्य च ॥ ४१॥ वसु धाया गुणो गन्धस्तल्लिपिर्गन्धवाचिका
    । भुवनत्रयसम्भन्धात् त्रिधात्वं तु महेश्वरि ॥ ४२॥ अशुद्धशुद्धमिश्राणां प्रमातॄणां परं वपुः । क्रोधीशत्रितये
    नाथ विद्यास्थेन प्रकाश्यते ॥ ४३॥ श्रीकण्ठदशकं तद्वद व्यक्तस्यापि वाचकः । प्राणरूपस्थितो देवि तद्वदेकादशः
    परः ॥ ४४॥ एकः सन्नेव पुरुषो बहुधा कायते हि सः । रुद्रेश्वरसदेशाख्या देवता मितविग्रहाः ॥ ४५॥ बिन्दुत्रयेण
    कथिता अमितामितविग्रहाः । शान्तिः शक्तिश्च शम्भुश्च नादत्रितयबोधनाः ॥ ४६॥ वागुरामूलवलये सूत्राद्याः
    कवलीकृताः । तथा मन्त्राः समस्ताश्च विद्यायामत्र संस्थिताः ॥ ४७॥ गुरुक्रमेण सम्प्राप्तः सम्प्रदायार्थ
    ईरितः । निगर्भार्थो महदेवि शिवगुर्वात्मगोचरः ॥ ४८॥ शिवगुर्वात्मनामैक्यानुसंधानात्तदात्मकम् ॥ ४९॥ निष्कलत्वं
    शिवे बुध्वा तद्रूपत्वं गुरोरपि । तन्निरीक्षणसामर्थ्यादात्मनश्च शिवात्मताम् ॥ ५०॥ भावयेदभक्तिनम्रः
    सङ्कोचोन्मेषाकलङ्कितः । कौलिकं कथयिष्यामि चक्रदेवतयोरपि ॥ ५१॥ विद्यागुर्वात्मनामैक्यं तत्प्रकारः प्रदर्श्यते
    । लकारैश्चतुरस्राणि वृत्तत्रितयसंयुतम् ॥ ५२॥ सरोरुहद्वयं शक्तैरग्नीषोमात्मकं प्रिये । हृल्लेखात्रयसंभूतैरक्षरैर्नवसङ्ख्यकैः
    ॥ ५३॥ बिन्दुत्रययुतैर्जातं नवयोन्यात्मकं प्रिये । मण्डलत्रययुक्तं तु चक्रं शक्त्यनलात्मकम् ॥ ५४॥ व्योमबीजत्रयेणैव
    प्रमातृत्रित्यान्वितम् । इच्छाज्ञानक्रियारूपमादनत्रयसंयुतम् ॥ ५५॥ सदाशिवासनं देवि महाबिन्दुमयं परम्
    । इत्थं मन्त्रात्मकं चक्रं देवतायाः परं वपुः ॥ ५६॥ एकादशाधिकशतदेवतात्मतया पुनः । गणेशत्वं महादेव्याः
    ससोमरविपावकैः ॥ ५७॥ इच्छाज्ञानक्रियाभिश्च गुणत्रययुतैह् पुनः । ग्रहरूपा च सा देवी ज्ञानकर्मेन्द्रियैरपि
    ॥ ५८॥ तदर्थैरेव देवेशि करणैरान्तरैः पुनः । प्रकृत्या च गुणेनापि पुंस्त्वबन्धेन चात्मना ॥ ५९॥ नक्षत्रविग्रहा
    जाता योगिनीत्वमथोच्यते । त्वगादिधातुनाथाभिर्डाकिन्यादिभिरप्यसौ ॥ ६०॥ वर्गाष्टकनिविष्टाभिर्योगिनीभिश्च
    संयुता । योगिनीरूपमास्थाय राजते विश्वविग्रा ॥ ६१॥ प्राणापानौ समानश्चोदनव्यानौ तथा पुनः । नागः कूर्मोऽथ
    कृकरो देवदत्तो धनञ्जयः ॥ ६२॥ जीवात्मा पर्मात्मा चैत्येतै राशिस्वरूपिणी । अकथादित्रिपङ्क्त्यात्मा तार्तियादिक्रमेण
    सा ॥ ६३॥ गणेशोऽभून्महाविद्या परावागादिवाङ्मयी । बीजबिन्दुध्वनीनां च त्रिकूटेषु ग्रहात्मिका ॥ ६४॥ हृल्लेखात्रयसंभूतैस्तिथिसंख्यैस्तथाक्षरैः
    । अन्यैर्द्वादशभिर्वर्णैरेषा नक्षत्ररूपिणी ॥ ६५॥ विद्यानन्तर्भूतशक्त्याद्यैः शाक्तैः षड् भिस्तथाक्षरैः
    । योगिनीत्वं च विद्याय राशित्वं चान्त्यवर्जितैः ॥ ६६॥ एवं विश्वप्रकारा च चक्र रूपा महेश्वरी । देव्या
    देहे यथा प्रोक्तो गुरुदेहे तथैव हि ॥ ६७॥ तत्प्रसादाच्च शिष्योऽपि तद्रूपः सम्प्रजायते । इत्येवं कौलिकार्थस्तु
    कथितो विरवन्दिते ॥ ६८॥ तथा सर्वरह्स्यार्थं कथयामि तवानघे । मूलाधारे तडिद्रूपे वाग्भवाकारतां गते ॥
    ६९॥ अष्टात्रिंशत्कलायुक्तपञ्चाशद्वर्णविग्रहा । विद्या कुण्डलिनीरूपा मण्डलत्रयभेदिनी ॥ ७०॥ तडित्कोटिनिभप्रख्या
    बिसतन्तुनिभाकृतिः । व्योमेन्दुमण्डलासक्ता सुधास्त्रोतःस्वरूपिणी ॥ ७१॥ सदा व्याप्तजगत् कृत्स्ना सदानन्दस्वरूपिणी
    । एषा स्वात्मेति बुद्धिस्तु रहस्यार्थो महेश्वरि ॥ ७२॥ महातत्त्वार्थं इति यत्तच देवि वदामि ते । निष्कले
    प्रमे सूक्ष्मे निर्लक्ष्ये भाववर्जिते ॥ ७३॥ व्योमातीते परे तत्त्वे प्रकाशानन्दविग्रहे । विश्वोत्तिर्णे
    विश्वमये तत्त्वे स्वात्मनियोजनम् ॥ ७४॥ तदा प्रकाशमानत्वं तेजसां तमसामपि । अविनाभावरूपत्वं तस्माद्विश्वस्य
    सर्वतः ॥ ७५॥ प्रकाशते महातत्त्वं दिव्यक्रीडारसोज्ज्वले । निरस्तसर्वसंकल्पविकल्पस्थितिपूर्वकः ॥ ७६॥
    रहस्यार्थो मया गुप्तः सद्यः प्रत्ययकारकः । महाज्ञानार्णवे दृष्टः शङ्का तत्र न पार्वति ॥ ७७॥ विद्यापीठनिबद्धेषु
    संस्थितो दिव्यसिद्धिदः । कौलाचारपरैर्देवि पादुकाभावनापरैः ॥ ७८॥ योगिनीमेलनोद्युक्तैः प्राप्तविद्याभिषेचनैः
    । शङ्काकलङ्कविगतैः सदा मुदितमानसैः ॥ ७९॥ पारम्पर्येण विज्ञातरहस्यार्थविशारदैः । लभ्यते नान्यथ देवि
    त्वां शपेकुलसुन्दरि ॥ ८०॥ पारम्पर्यविहीना ये ज्ञानमात्रेण गर्विताः । तेषां समयलोपेन विकुर्वन्ति मरीचयः
    ॥ ८१॥ यस्तु दिव्यरसास्वादमोदमानविमर्शनः । देअतातिथिनक्षत्रे वारेऽपि च विवस्वतः ॥ ८२॥ मरीचीन् प्रीणयत्येव
    मदिरानन्दघूर्णितः । सर्वदा च विशेषण लभते पूर्णबोधताम् ॥ ८३॥ एवंव्हावस्तु देवेशि देशिकेन्द्रप्रसादतः
    । महाज्ञानमयो देवि सद्यः सम्प्राप्यते नरैः ॥ ८४॥ एवमेतत्प्रदं ज्ञानं विद्यार्णागमगोचरम् । देवि गुह्यप्रियेणैव
    व्याख्यातं दुर्गि षड् विधम् । सद्यो यस्य प्रबोधेन वीरचक्रेश्वरो भवेत् ॥ ८५॥ इति द्वितीयः पटलः समाप्तः
    । अथ तृतायः पटलः पूजासङ्केतमधुना कथयामि तवानघे । यस्य प्रबोधमात्रेण जिवन्मुक्तः प्रमोदते ॥ १॥ तव नित्योदिता
    पूजा त्रिभिर्भेदैर्व्यवस्थिता । परा चाप्यपर गौरि तृतीया च परापरा ॥ २॥ प्रथमाद्वैतभावस्था सर्वप्रसरगोचरा
    । द्वितीया चक्रपूजा च सदा निष्पाद्यते मया ॥ ३॥ एवं ज्ञानमये देवि तृतीया तु परापरा । उत्तमा सा परा
    ज्ञेया विधानं श
