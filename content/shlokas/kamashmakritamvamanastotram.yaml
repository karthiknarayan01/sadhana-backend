id: kamashmakritamvamanastotram
category: stotram
name:
  english: kamashmakritamvamanastotram
  devanagari: कामश्मकृतंवामनस्तोत्रम्
content:
  english: kamashmakritam vamanastotram kamasharmovaca | namo devaya mahate sarvapujyaya te namah || 27||
    dharmapriyaya dharmaya devadaityakaraya ca | daivadhinanrinam bhartre karmakartre namo namah || 28||
    daivadhinashca te deva daivollanghashca danavah | tesham bhartta kramaddharta tasmai devaya te namah
    || 29|| putro bhava hare svaminsaphalam vanchitam kuru | iti bhavishyapurane pratisargaparvani caturthakhande
    caturvimshadhyayantargatam kamashmakritam vamanastotram samaptam | bhavishyapurana | pratisargaparva
    | caturthakhanda | adhyaya 24
  devanagari: कामश्मकृतं वामनस्तोत्रम् कामशर्मोवाच । नमो देवाय महते सर्वपूज्याय ते नमः ॥ २७॥ धर्मप्रियाय
    धर्माय देवदैत्यकराय च । दैवाधीननृणां भर्त्रे कर्मकर्त्रे नमो नमः ॥ २८॥ दैवाधीनाश्च ते देवा दैवोल्लङ्घाश्च
    दानवाः । तेषां भर्त्ता क्रमाद्धर्ता तस्मै देवाय ते नमः ॥ २९॥ पुत्रो भव हरे स्वामिन्सफलं वाञ्छितं कुरु
    । इति भविष्यपुराणे प्रतिसर्गपर्वणि चतुर्थखण्डे चतुर्विंशाध्यायान्तर्गतं कामश्मकृतं वामनस्तोत्रं समाप्तम्
    । भविष्यपुराण । प्रतिसर्गपर्व । चतुर्थखण्ड । अध्याय २४
