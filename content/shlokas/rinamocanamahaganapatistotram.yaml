id: rinamocanamahaganapatistotram
category: stotram
name:
  english: rinamocanamahaganapatistotram
  devanagari: ऋणमोचनमहागणपतिस्तोत्रं
content:
  english: shririnamocaka mahaganapatirdevata | mama rinamocanamahaganapatiprasadasiddhyarthe jape viniyogah
    || raktangam raktavastram sitakusumaganaih pujitam raktagandhaih kshirabdhau ratnapithe surataruvimale
    ratnasimhasanastham | dorbhih pashankusheshtabhayadharamatulam candramaulim trinetram dhyayet shantyarthamisham
    ganapatimamalam shrisametam prasannam || smarami deva devesham vakratundam mahabalam | shadaksharam
    kripasindhum namami rinamuktaye || 1|| ekaksharam hyekadantamekam brahma sanatanam | ekamevadvitiyam
    ca namami rinamuktaye || 2|| mahaganapatim devam mahasatvam
  devanagari: श्रीऋणमोचक महागणपतिर्देवता । मम ऋणमोचनमहागणपतिप्रसादसिद्ध्यर्थे जपे विनियोगः ॥ रक्ताङ्गं
    रक्तवस्त्रं सितकुसुमगणैः पूजितं रक्तगन्धैः क्षीराब्धौ रत्नपीठे सुरतरुविमले रत्नसिंहासनस्थम् । दोर्भिः
    पाशाङ्कुशेष्टाभयधरमतुलं चन्द्रमौलिं त्रिणेत्रं ध्यायेत् शान्त्यर्थमीशं गणपतिममलं श्रीसमेतं प्रसन्नम्
    ॥ स्मरामि देव देवेशं वक्रतुण्डं महाबलम् । षडक्षरं कृपासिन्धुं नमामि ऋणमुक्तये ॥ १॥ एकाक्षरं ह्येकदन्तमेकं
    ब्रह्म सनातनम् । एकमेवाद्वितीयं च नमामि ऋणमुक्तये ॥ २॥ महागणपतिं देवं महासत्वं
meaning: {}
