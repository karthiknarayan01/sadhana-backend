id: ganesha-mahimna-stotram
category: stotram
name:
  english: Ganesha Mahimna Stotram
content:
  english: anirvacyam rupam stavana nikaro yatra galitah tatha vakshye stotram prathama purushasyatra
    mahatah | yato jatam vishvasthitimapi sada yatra vilayah sakidriggirvanah sunigama nutah shriganapatih
    || || gakaro herambah saguna iti pum nirgunamayo dvidhapyekojatah prakriti purusho brahma hi ganah
    | sa ceshashcotpatti sthiti laya karoyam pramathako yatobhutam bhavyam bhavati patirisho ganapatih
    || || gakarah kanthordhvam gajamukhasamo martyasadrisho nakarah kanthadho jathara sadrishakara iti
    ca | adhobhavah katyam carana iti hishosya ca tamah vibhatittham nama tribhuvana samam bhu rbhuva
    ssuvah || || ganadhyaksho jyeshthah kapila aparo mangalanidhih dayalurherambo varada iti cintamani
    rajah | varanisho dhundhirgajavadana nama shivasuto mayuresho gauritanaya iti namani pathati || ||
    maheshoyam vishnuh sa kavi ravirinduh kamalajah kshiti stoyam vahnih shvasana iti kham tvadrirudadhih
    | kujastarah shukro pururudu budhogucca dhanado yamah pashi kavyah shanirakhila rupo ganapatih ||
    || mukham vahnih padau harirasi vidhata prajananam ravirnetre candro hridaya mapi kamosya madana |
    karau shukrah katyamavanirudaram bhati dashanam ganeshasyasan vai kratumaya vapu shcaiva sakalam ||
    || site bhadre mase pratisharadi madhyahna samaye mrido murtim kritva ganapatitithau dhundhi sadrishim
    | samarcatyutsahah prabhavati mahan sarvasadane vilokyanandastam prabhavati nrinam vismaya iti ||
    || ganeshadevasya mahatmyametadyah shravayedvapi pathecca tasya | klesha layam yanti labhecca shighram
    shriputtra vidyarthi griham ca muktim || || || iti shri ganesha mahimna stotram ||
  devanagari: अनिर्वाच्यं रूपं स्तवन निकरो यत्र गलितः तथा वक्ष्ये स्तोत्रं प्रथम पुरुषस्यात्र महतः । यतो
    जातं विश्वस्थितिमपि सदा यत्र विलयः सकीदृग्गीर्वाणः सुनिगम नुतः श्रीगणपतिः ॥ ॥ गकारो हेरम्बः सगुण इति
    पुं निर्गुणमयो द्विधाप्येकोजातः प्रकृति पुरुषो ब्रह्म हि गणः । स चेशश्चोत्पत्ति स्थिति लय करोयं प्रमथको
    यतोभूतं भव्यं भवति पतिरीशो गणपतिः ॥ ॥ गकारः कण्ठोर्ध्वं गजमुखसमो मर्त्यसदृशो णकारः कण्ठाधो जठर सदृशाकार
    इति च । अधोभावः कट्यां चरण इति हीशोस्य च तमः विभातीत्थं नाम त्रिभुवन समं भू र्भुव स्सुवः ॥ ॥ गणाध्यक्षो
    ज्येष्ठः कपिल अपरो मङ्गलनिधिः दयालुर्हेरम्बो वरद इति चिन्तामणि रजः । वरानीशो ढुण्ढिर्गजवदन नामा शिवसुतो
    मयूरेशो गौरीतनय इति नामानि पठति ॥ ॥ महेशोयं विष्णुः स कवि रविरिन्दुः कमलजः क्षिति स्तोयं वह्निः श्वसन
    इति खं त्वद्रिरुदधिः । कुजस्तारः शुक्रो पुरुरुडु बुधोगुच्च धनदो यमः पाशी काव्यः शनिरखिल रूपो गणपतिः
    ॥ ॥ मुखं वह्निः पादौ हरिरसि विधात प्रजननं रविर्नेत्रे चन्द्रो हृदय मपि कामोस्य मदन । करौ शुक्रः कट्यामवनिरुदरं
    भाति दशनं गणेशस्यासन् वै क्रतुमय वपु श्चैव सकलम् ॥ ॥ सिते भाद्रे मासे प्रतिशरदि मध्याह्न समये मृदो
    मूर्तिं कृत्वा गणपतितिथौ ढुण्ढि सदृशीम् । समर्चत्युत्साहः प्रभवति महान् सर्वसदने विलोक्यानन्दस्तां
    प्रभवति नृणां विस्मय इति ॥ ॥ गणेशदेवस्य माहात्म्यमेतद्यः श्रावयेद्वापि पठेच्च तस्य । क्लेशा लयं यान्ति
    लभेच्च शीघ्रं श्रीपुत्त्र विद्यार्थि गृहं च मुक्तिम् ॥ ॥ ॥ इति श्री गणेश महिम्न स्तोत्रम् ॥
