id: bala-mukundashtakam
category: stotram
name:
  english: Bala Mukundashtakam
  devanagari: बालमुकुन्दाष्टकम्
content:
  english: balamukundashtakam shri bilvamamgala thakura balamukundashtakam vishnustotrani shri bilvamamgala
    thakura kararavindena padaravindam mukharavinde viniveshayantam | vatasya patrasya pute shayanam balam
    mukundam manasa smarami || 1|| samhritya lokanvatapatramadhye shayanamadyantavihinarupam | sarveshvaram
    sarvahitavataram balam mukundam manasa smarami || 2|| indivarashyamalakomalamgamindradidevarcitapadapadmam
    | santanakalpadrumamashritanam balam mukundam manasa smarami || 3|| lambalakam lambitaharayashtim
    shringaralilankitadantapanktim | bimbadharam caruvishalanetram balam mukundam manasa smarami || 4||
    shikye nidhayadyapayodadhini bahirgatayam vrajanayikayam | bhuktva yatheshtam kapatena suptam balam
    mukundam manasa smarami || 5|| kalindajantasthitakaliyasya phanagrarange natanapriyantam | tatpucchahastam
    sharadinduvaktram balam mukundam manasa smarami || 6|| ulukhale baddhamudarashauryamuttungayugmarjunabhangalilam
    | utphullapadmayatacarunetram balam mukundam manasa smarami || 7|| alokya maturmukhamadarena stanyam
    pibantam sarasiruhaksham | saccinmayam devamanantarupam balam mukundam manasa smarami || 8|| || iti
    balamukundashtakam sampurnam ||
  devanagari: बालमुकुन्दाष्टकं श्री बिल्वमंगल ठाकुर बालमुकुन्दाष्टकं विष्णुस्तोत्राणि श्री बिल्वमंगल ठाकुर
    करारविन्देन पदारविन्दं मुखारविन्दे विनिवेशयन्तम् । वटस्य पत्रस्य पुटे शयानं बालं मुकुन्दं मनसा स्मरामि
    ॥ १॥ संहृत्य लोकान्वटपत्रमध्ये शयानमाद्यन्तविहीनरूपम् । सर्वेश्वरं सर्वहितावतारं बालं मुकुन्दं मनसा
    स्मरामि ॥ २॥ इन्दीवरश्यामलकोमलांगमिन्द्रादिदेवार्चितपादपद्मम् । सन्तानकल्पद्रुममाश्रितानां बालं मुकुन्दं
    मनसा स्मरामि ॥ ३॥ लम्बालकं लम्बितहारयष्टिं शृङ्गारलीलाङ्कितदन्तपङ्क्तिम् । बिम्बाधरं चारुविशालनेत्रं
    बालं मुकुन्दं मनसा स्मरामि ॥ ४॥ शिक्ये निधायाद्यपयोदधीनि बहिर्गतायां व्रजनायिकायाम् । भुक्त्वा यथेष्टं
    कपटेन सुप्तं बालं मुकुन्दं मनसा स्मरामि ॥ ५॥ कलिन्दजान्तस्थितकालियस्य फणाग्ररङ्गे नटनप्रियन्तम् ।
    तत्पुच्छहस्तं शरदिन्दुवक्त्रं बालं मुकुन्दं मनसा स्मरामि ॥ ६॥ उलूखले बद्धमुदारशौर्यमुत्तुङ्गयुग्मार्जुनभङ्गलीलम्
    । उत्फुल्लपद्मायतचारुनेत्रं बालं मुकुन्दं मनसा स्मरामि ॥ ७॥ आलोक्य मातुर्मुखमादरेण स्तन्यं पिबन्तं
    सरसीरुहाक्षम् । सच्चिन्मयं देवमनन्तरूपं बालं मुकुन्दं मनसा स्मरामि ॥ ८॥ ॥ इति बालमुकुन्दाष्टकम् सम्पूर्णम्
    ॥
