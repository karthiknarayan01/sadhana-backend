id: kamala
category: stotram
name:
  english: kamala
  devanagari: कमला
content:
  english: use kisi prakara ka jvara ka bhaya nahim rahata hai | idam stotram mahapunyamapaduddharakaranam
    | trisamdhyamekasandhyam va yah pathetsatatam narah || mucyate sarvapapebhyo tatha tu sarvasamkatat
    | mucyate natra sandeho bhuvi svarge rasatale || yaha lakshmi stotra parama pavitra aura vipatti ka
    nashaka hai | jo prani tinom samdhyaom mem athava kevala eka bara hi isaka patha karata hai
  devanagari: उसे किसी प्रकार का ज्वर का भय नहीं रहता है । इदं स्तोत्रं महापुण्यमापदुद्धारकारणम् । त्रिसंध्यमेकसन्ध्यं
    वा यः पठेत्सततं नरः ॥ मुच्यते सर्वपापेभ्यो तथा तु सर्वसंकटात् । मुच्यते नात्र सन्देहो भुवि स्वर्गे
    रसातले ॥ यह लक्ष्मी स्तोत्र परम पवित्र और विपत्ति का नाशक है । जो प्राणी तीनों संध्याओं में अथवा केवल
    एक बार ही इसका पाठ करता है
meaning: {}
