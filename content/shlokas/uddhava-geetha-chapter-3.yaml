id: uddhava-geetha-chapter-3
category: stotram
name:
  english: Uddhava Geetha - Chapter 3
content:
  english: atha tritiyo'dhyayah | parasya vishnoh ishasya mayinama api mohinim | mayam veditum icchamah
    bhagavantah bruvantu nah || || na anutripye jushan yushmat vacah harikatha amritam | samsaratapanihtaptah
    martyah tat tapa bheshajam || || antarikshah uvaca | ebhih bhutani bhutatma mahabhutaih mahabhuja
    | sasarjot ca avacani adyah svamatraprasiddhaye || || evam srishtani bhutani pravishtah pancadhatubhih
    | ekadha dashadha atmanam vibhajan jushate gunan || || gunaih gunan sah bhunjanah atmapradyoditaih
    prabhuh | manyamanah idam srishtam atmanam iha sajjate || || karmani karmabhih kurvan sanimittani
    dehabhrit | tat tat karmaphalam grihnan bhramati iha sukhaitaram || || ittham karmagatih gacchan bahvabhadravahah
    puman | abhutasamplavat sargapralayau ashnute avashah || || dhatu upaplavah asanne vyaktam dravyagunatmakam
    | anadinidhanah kalah hi avyaktaya apakarshati || || shatavarshah hi anavrishtih bhavishyati ulbana
    bhuvi | tat kala upacita ushna arkah lokan trin pratapishyati || || patalatalam arabhya sankarshanamukha
    analah | dahan urdhvashikhah vishvak vardhate vayuna iritah || || samvartakah meghaganah varshati
    sma shatam samah | dharabhih hastihastabhih liyate salile virat || || tatah virajam utsrijya vairajah
    purushah nripa | avyaktam vishate sukshmam nirindhanah iva analah || || vayuna hritagandha bhuh salilatvaya
    kalpate | salilam tat dhritarasam jyotishtvaya upakalpate || || hritarupam tu tamasa vayau jyotih
    praliyate | hritasparshah avakashena vayuh nabhasi liyate | kalatmana hritagunam navah atmani liyate
    || || indriyani manah buddhih saha vaikarikaih nripa | pravishanti hi ahankaram svagunaih aham atmani
    || || esha maya bhagavatah sargasthiti antakarini | trivarna varnita asmabhih kim bhuyah shrotum icchasi
    || || raja uvaca | yatha etam aishvarim mayam dustaram akritatmabhih | taranti anjah sthuladhiyah
    maharshah idam ucyatam || || prabuddhah uvaca | karmani arabhamananam duhkhahatyai sukhaya ca | pashyet
    pakaviparyasam mithunicarinam nrinam || || nityartidena vittena durlabhena atmamrityuna | griha apatyaptapashubhih
    ka pritih sadhitaih calaih || || evam lokam param vidyat nashvaram karmanirmitam | satulya atishaya
    dhvamsam yatha mandalavartinam || || tasmat gurum prapadyeta jijnasuh shreyah uttamam | shabde pare
    ca nishnatam brahmani upashamashrayam || || tatra bhagavatan dharman shikshet guruatmadaivatah | amayaya
    anuvritya yaih tushyet atma atmadah harih || || sarvatah manasah asangam adau sangam ca sadhushu |
    dayam maitrim prashrayam ca bhuteshu addha yatha ucitam || || shaucam tapah titiksham ca maunam svadhyayam
    arjavam | brahmacaryam ahimsam ca samatvam dvandvasanjnayoh || || sarvatra atmeshvara anviksham kaivalyam
    aniketatam | viviktaciravasanam santosham yena kenacit || || shraddham bhagavate shastre anindam anyatra
    ca api hi | manovak karmadandam ca satyam shamadamau api || || shravanam kirtanam dhyanam hareh adbhutakarmanah
    | janmakarmagunanam ca tadarthe akhilaceshtitam || || ishtam dattam tapah japtam vrittam yat ca atmanah
    priyam | daran sutan grihan pranan yat parasmai nivedanam || || evam krishnatmanatheshu manushyeshu
    ca sauhridam | paricaryam ca ubhayatra mahatsu nrishu sadhushu || || paraspara anukathanam pavanam
    bhagavat yashah | mithah ratih mithah tushtih nivrittih mithah atmanah || || smarantah smarayantah
    ca mithah aghaughaharam harim | bhaktya sanjataya bhaktya bibhrati utpulakam tanum || || kvacit rudanti
    acyutacintaya kvacit hasanti nandanti vadanti alaukikah | nrityanti gayanti anushilayanti ajam bhavanti
    tushnim param etya nirvritah || || iti bhagavatan dharman shikshan bhaktya tadutthaya | narayanaparah
    mayam anjah tarati dustaram || || raja uvaca | narayana abhidhanasya brahmanah paramatmanah | nishtham
    arhatha nah vaktum yuyam hi brahmavittamah || || pippalayanah uvaca | sthiti udbhavapralayahetuh ahetuh
    asya yat svapnajagarasushuptishu sat bahih ca | deha indriyasuhridayani caranti yena sanjivitani tat
    avehi param narendra || || na etat manah vishati vaguta cakshuh atma pranendriyani ca yatha analam
    arcishah svah | shabdah api bodhakanishedhataya atmamulam artha uktam aha yadrite na nishedhasiddhih
    || || satvam rajah tamah iti trivridekam adau sutram mahan aham iti pravadanti jivam | jnanakriya
    arthaphalarupatayoh ushakti brahma eva bhati sat asat ca tayoh param yat || || na atma jajana na marishyati
    na edhate asau na kshiyate savanavit vyabhicarinam hi | sarvatra shasvadanapayi upalabdhimatram pranah
    yatha indriyavalena vikalpitam sat || || andeshu peshishu tarushu avinishciteshu pranah hi jivam upadhavati
    tatra tatra | sanne yat indriyagane ahami ca prasupte kutasthah ashayamrite tat anusmritih nah ||
    || yah hi abja nabha carana eshanayoh ubhaktya cetomalani vidhamet gunakarmajani | tasmin vishuddhah
    upalabhyatah atmatattvam sakshat yatha amaladrishah savitriprakashah || || karmayogam vadata nah purushah
    yena samskritah | vidhuya iha ashu karmani naishkarmyam vindate param || || evam prashnam rishin purvam
    apriccham pituh antike | na abruvan brahmanah putrah tatra karanam ucyatam || || avirhotrah uvaca
    | karma akarmavikarma iti vedavadah na laukikah | vedasya ca ishvaratmatvat tatra muhyanti surayah
    || || parokshavadah vedah ayam balanam anushasanam | karmamokshaya karmani vidhatte hi agadam yatha
    || || na acaret yah tu veda uktam svayam ajnah ajitendriyah | vikarmana hi adharmena mrityoh mrityum
    upaiti sah || || veda uktam eva kurvanah nihsangah arpitam ishvare | naishkarmyam labhate siddhim
    rocanartha phalashrutih || || yah ashu hridayagranthim nirjihishuh paratmanah | vidhina upacaret devam
    tantra uktena ca keshavam || || labdha anugrahah acaryat tena sandarshitagamah | mahapurusham abhyarcet
    murtya abhimataya atmanah || || shucih sammukham asinah pranasamyamanadibhih | pindam vishodhya sannyasakritarakshah
    arcayet harim || || arcadau hridaye ca api yathalabdha upacarakaih | dravyakshitiatmalingani nishpadya
    prokshya ca asanam || || padyadin upakalpya atha sannidhapya samahitah | hrit adibhih kritanyasah
    mulamantrena ca arcayet || || sangopangam saparshadam tam tam murtim svamantratah | padya arghyacamaniyadyaih
    snanavasahvibhushanaih || || gandhamalyakshatasragbhih dhupadipaharakaih | sangam sampujya vidhivat
    stavaih stutva namet harim || || atmam tanmayam dhyayan murtim sampujayet hareh | shesham adhaya shirasi
    svadhamni udvasya satkritam || || evam agni arkatoyadau atithau hridaye ca yah | yajati ishvaram atmanam
    acirat mucyate hi sah || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe
    nimijayantasamvade mayakarmabrahmanirupanam tritiyo'dhyayah ||
  devanagari: अथ तृतीयोऽध्यायः । परस्य विष्णोः ईशस्य मायिनाम अपि मोहिनीम् । मायां वेदितुं इच्छामः भगवन्तः
    ब्रुवन्तु नः ॥ ॥ न अनुतृप्ये जुषन् युष्मत् वचः हरिकथा अमृतम् । संसारतापनिःतप्तः मर्त्यः तत् ताप भेषजम्
    ॥ ॥ अन्तरिक्षः उवाच । एभिः भूतानि भूतात्मा महाभूतैः महाभुज । ससर्जोत् च अवचानि आद्यः स्वमात्रप्रसिद्धये
    ॥ ॥ एवं सृष्टानि भूतानि प्रविष्टः पञ्चधातुभिः । एकधा दशधा आत्मानं विभजन् जुषते गुणान् ॥ ॥ गुणैः गुणान्
    सः भुञ्जानः आत्मप्रद्योदितैः प्रभुः । मन्यमानः इदं सृष्टं आत्मानं इह सज्जते ॥ ॥ कर्माणि कर्मभिः कुर्वन्
    सनिमित्तानि देहभृत् । तत् तत् कर्मफलं गृह्णन् भ्रमति इह सुखैतरम् ॥ ॥ इत्थं कर्मगतीः गच्छन् बह्वभद्रवहाः
    पुमान् । आभूतसम्प्लवात् सर्गप्रलयौ अश्नुते अवशः ॥ ॥ धातु उपप्लवः आसन्ने व्यक्तं द्रव्यगुणात्मकम् ।
    अनादिनिधनः कालः हि अव्यक्ताय अपकर्षति ॥ ॥ शतवर्षाः हि अनावृष्टिः भविष्यति उल्बणा भुवि । तत् काल उपचित
    उष्ण अर्कः लोकान् त्रीन् प्रतपिष्यति ॥ ॥ पातालतलं आरभ्य सङ्कर्षणमुख अनलः । दहन् ऊर्ध्वशिखः विष्वक्
    वर्धते वायुना ईरितः ॥ ॥ सांवर्तकः मेघगणः वर्षति स्म शतं समाः । धाराभिः हस्तिहस्ताभिः लीयते सलिले विराट्
    ॥ ॥ ततः विराजं उत्सृज्य वैराजः पुरुषः नृप । अव्यक्तं विशते सूक्ष्मं निरिन्धनः इव अनलः ॥ ॥ वायुना हृतगन्धा
    भूः सलिलत्वाय कल्पते । सलिलं तत् धृतरसं ज्योतिष्ट्वाय उपकल्पते ॥ ॥ हृतरूपं तु तमसा वायौ ज्योतिः प्रलीयते
    । हृतस्पर्शः अवकाशेन वायुः नभसि लीयते । कालात्मना हृतगुणं नवः आत्मनि लीयते ॥ ॥ इन्द्रियाणि मनः बुद्धिः
    सह वैकारिकैः नृप । प्रविशन्ति हि अहङ्कारं स्वगुणैः अहं आत्मनि ॥ ॥ एषा माया भगवतः सर्गस्थिति अन्तकारिणी
    । त्रिवर्णा वर्णिता अस्माभिः किं भूयः श्रोतुं इच्छसि ॥ ॥ राजा उवाच । यथा एतां ऐश्वरीं मायां दुस्तरां
    अकृतात्मभिः । तरन्ति अञ्जः स्थूलधियः महर्षः इदं उच्यताम् ॥ ॥ प्रबुद्धः उवाच । कर्माणि आरभमाणानां दुःखहत्यै
    सुखाय च । पश्येत् पाकविपर्यासं मिथुनीचारिणां नृणाम् ॥ ॥ नित्यार्तिदेन वित्तेन दुर्लभेन आत्ममृत्युना
    । गृह अपत्याप्तपशुभिः का प्रीतिः साधितैः चलैः ॥ ॥ एवं लोकं परं विद्यात् नश्वरं कर्मनिर्मितम् । सतुल्य
    अतिशय ध्वंसं यथा मण्डलवर्तिनाम् ॥ ॥ तस्मात् गुरुं प्रपद्येत जिज्ञासुः श्रेयः उत्तमम् । शाब्दे परे
    च निष्णातं ब्रह्मणि उपशमाश्रयम् ॥ ॥ तत्र भागवतान् धर्मान् शिक्षेत् गुरुआत्मदैवतः । अमायया अनुवृत्या
    यैः तुष्येत् आत्मा आत्मदः हरिः ॥ ॥ सर्वतः मनसः असङ्गं आदौ सङ्गं च साधुषु । दयां मैत्रीं प्रश्रयं च
    भूतेषु अद्धा यथा उचितम् ॥ ॥ शौचं तपः तितिक्षां च मौनं स्वाध्यायं आर्जवम् । ब्रह्मचर्यं अहिंसां च समत्वं
    द्वन्द्वसञ्ज्ञयोः ॥ ॥ सर्वत्र आत्मेश्वर अन्वीक्षां कैवल्यं अनिकेतताम् । विविक्तचीरवसनं सन्तोषं येन
    केनचित् ॥ ॥ श्रद्धां भागवते शास्त्रे अनिन्दां अन्यत्र च अपि हि । मनोवाक् कर्मदण्डं च सत्यं शमदमौ अपि
    ॥ ॥ श्रवणं कीर्तनं ध्यानं हरेः अद्भुतकर्मणः । जन्मकर्मगुणानां च तदर्थे अखिलचेष्टितम् ॥ ॥ इष्टं दत्तं
    तपः जप्तं वृत्तं यत् च आत्मनः प्रियम् । दारान् सुतान् गृहान् प्राणान् यत् परस्मै निवेदनम् ॥ ॥ एवं
    कृष्णात्मनाथेषु मनुष्येषु च सौहृदम् । परिचर्यां च उभयत्र महत्सु नृषु साधुषु ॥ ॥ परस्पर अनुकथनं पावनं
    भगवत् यशः । मिथः रतिः मिथः तुष्टिः निवृत्तिः मिथः आत्मनः ॥ ॥ स्मरन्तः स्मारयन्तः च मिथः अघौघहरं हरिम्
    । भक्त्या सञ्जातया भक्त्या बिभ्रति उत्पुलकां तनुम् ॥ ॥ क्वचित् रुदन्ति अच्युतचिन्तया क्वचित् हसन्ति
    नन्दन्ति वदन्ति अलौकिकाः । नृत्यन्ति गायन्ति अनुशीलयन्ति अजं भवन्ति तूष्णीं परं एत्य निर्वृताः ॥ ॥
    इति भागवतान् धर्मान् शिक्षन् भक्त्या तदुत्थया । नारायणपरः मायं अञ्जः तरति दुस्तराम् ॥ ॥ राजा उवाच
    । नारायण अभिधानस्य ब्रह्मणः परमात्मनः । निष्ठां अर्हथ नः वक्तुं यूयं हि ब्रह्मवित्तमाः ॥ ॥ पिप्पलायनः
    उवाच । स्थिति उद्भवप्रलयहेतुः अहेतुः अस्य यत् स्वप्नजागरसुषुप्तिषु सत् बहिः च । देह इन्द्रियासुहृदयानि
    चरन्ति येन सञ्जीवितानि तत् अवेहि परं नरेन्द्र ॥ ॥ न एतत् मनः विशति वागुत चक्षुः आत्मा प्राणेन्द्रियाणि
    च यथा अनलं अर्चिषः स्वाः । शब्दः अपि बोधकनिषेधतया आत्ममूलम् अर्थ उक्तं आह यदृते न निषेधसिद्धिः ॥ ॥
    सत्वं रजः तमः इति त्रिवृदेकं आदौ सूत्रं महान् अहं इति प्रवदन्ति जीवम् । ज्ञानक्रिया अर्थफलरूपतयोः
    उशक्ति ब्रह्म एव भाति सत् असत् च तयोः परं यत् ॥ ॥ न आत्मा जजान न मरिष्यति न एधते असौ न क्षीयते सवनवित्
    व्यभिचारिणां हि । सर्वत्र शस्वदनपायि उपलब्धिमात्रं प्राणः यथा इन्द्रियवलेन विकल्पितं सत् ॥ ॥ अण्डेषु
    पेशिषु तरुषु अविनिश्चितेषु प्राणः हि जीवं उपधावति तत्र तत्र । सन्ने यत् इन्द्रियगणे अहमि च प्रसुप्ते
    कूटस्थः आशयमृते तत् अनुस्मृतिः नः ॥ ॥ यः हि अब्ज नाभ चरण एषणयोः उभक्त्या चेतोमलानि विधमेत् गुणकर्मजानि
    । तस्मिन् विशुद्धः उपलभ्यतः आत्मतत्त्वम् साक्षात् यथा अमलदृशः सवितृप्रकाशः ॥ ॥ कर्मयोगं वदत नः पुरुषः
    येन संस्कृतः । विधूय इह आशु कर्माणि नैष्कर्म्यं विन्दते परम् ॥ ॥ एवं प्रश्नं ऋषिन् पूर्वं अपृच्छं
    पितुः अन्तिके । न अब्रुवन् ब्रह्मणः पुत्राः तत्र कारणं उच्यताम् ॥ ॥ आविर्होत्रः उवाच । कर्म अकर्मविकर्म
    इति वेदवादः न लौकिकः । वेदस्य च ईश्वरात्मत्वात् तत्र मुह्यन्ति सूरयः ॥ ॥ परोक्षवादः वेदः अयं बालानां
    अनुशासनम् । कर्ममोक्षाय कर्माणि विधत्ते हि अगदं यथा ॥ ॥ न आचरेत् यः तु वेद उक्तं स्वयं अज्ञः अजितेन्द्रियः
    । विकर्मणा हि अधर्मेण मृत्योः मृत्युं उपैति सः ॥ ॥ वेद उक्तं एव कुर्वाणः निःसङ्गः अर्पितं ईश्वरे ।
    नैष्कर्म्यां लभते सिद्धिं रोचनार्था फलश्रुतिः ॥ ॥ यः आशु हृदयग्रन्थिं निर्जिहीषुः परात्मनः । विधिना
    उपचरेत् देवं तन्त्र उक्तेन च केशवम् ॥ ॥ लब्ध अनुग्रहः आचार्यात् तेन सन्दर्शितागमः । महापुरुषं अभ्यर्चेत्
    मूर्त्या अभिमतया आत्मनः ॥ ॥ शुचिः सम्मुखं आसीनः प्राणसंयमनादिभिः । पिण्डं विशोध्य सन्न्यासकृतरक्षः
    अर्चयेत् हरिम् ॥ ॥ अर्चादौ हृदये च अपि यथालब्ध उपचारकैः । द्रव्यक्षितिआत्मलिङ्गानि निष्पाद्य प्रोक्ष्य
    च आसनम् ॥ ॥ पाद्यादीन् उपकल्प्या अथ सन्निधाप्य समाहितः । हृत् आदिभिः कृतन्यासः मूलमन्त्रेण च अर्चयेत्
    ॥ ॥ साङ्गोपाङ्गां सपार्षदां तां तां मूर्तिं स्वमन्त्रतः । पाद्य अर्घ्याचमनीयाद्यैः स्नानवासःविभूषणैः
    ॥ ॥ गन्धमाल्याक्षतस्रग्भिः धूपदीपहारकैः । साङ्गं सम्पूज्य विधिवत् स्तवैः स्तुत्वा नमेत् हरिम् ॥ ॥
    आत्मां तन्मयं ध्यायन् मूर्तिं सम्पूजयेत् हरेः । शेषां आधाय शिरसि स्वधाम्नि उद्वास्य सत्कृतम् ॥ ॥ एवं
    अग्नि अर्कतोयादौ अतिथौ हृदये च यः । यजति ईश्वरं आत्मानं अचिरात् मुच्यते हि सः ॥ ॥ इति श्रीमद्भागवते
    महापुराणे पारमहंस्यां संहितायामेकादशस्कन्धे निमिजायन्तसंवादे मायाकर्मब्रह्मनिरूपणं तृतीयोऽध्यायः ॥
