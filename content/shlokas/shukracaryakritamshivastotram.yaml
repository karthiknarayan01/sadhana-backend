id: shukracaryakritamshivastotram
category: stotram
name:
  english: shukracaryakritamshivastotram
  devanagari: शुक्राचार्यकृतंशिवस्तोत्रम्
content:
  english: 195|| iti shribrahmandapurane madhyamabhage dvisaptatitamadhyayantargatam shukracaryakritam
    shivastotram samaptam | brahmandapurana | madhyabhaga | upoddhata | adhyaya 72
  devanagari: १९५॥ इति श्रीब्रह्माण्डपुराणे मध्यमभागे द्विसप्ततितमाध्यायान्तर्गतं शुक्राचार्यकृतं शिवस्तोत्रं
    समाप्तम् । ब्रह्माण्डपुराण । मध्यभाग । उपोद्धात । अध्याय ७२
meaning: {}
