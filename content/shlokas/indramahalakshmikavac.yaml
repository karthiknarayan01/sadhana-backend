id: indramahalakshmikavac
category: kavacha
name:
  english: indramahalakshmikavac
  devanagari: इन्द्रमहालक्ष्मीकवच्
content:
  english: shrimahalakshmikavacam shri ganeshaya namah | asya shrimahalakshmikavacamantrasya brahma rishih
    gayatri chandah mahalakshmirdevata mahalakshmiprityartham jape viniyogah | indra uvaca | samastakavacanam
    tu tejasvi kavacottamam | atmarakshanamarogyam satyam tvam bruhi gishpate || 1|| shrigururuvaca |
    mahalakshmyastu kavacam pravakshyami samasatah | caturdashasu lokeshu rahasyam brahmanoditam || 2||
    brahmovaca | shiro me vishnupatni ca lalatamamritodbhava | cakshushi suvishalakshi shravane sagarambuja
    || 3|| ghranam patu vararoha jihvamamnayarupini | mukham patu mahalakshmih kantham vaikunthavasini
    || 4|| skandhau me janaki patu bhujau bhargavanandini | bahu dvau dravini patu karau harivarangana
    || 5|| vakshah patu ca shrirdevi hridayam harisundari | kukshim ca vaishnavi patu nabhim bhuvanamatrika
    || 6|| katim ca patu varahi sakthini devadevata | uru narayani patu januni candrasodari || 7|| indira
    patu janghe me padau bhaktanamaskrita | nakhan tejasvini patu sarvangam karunamayi || 8||
  devanagari: श्रीमहालक्ष्मीकवचम् श्री गणेशाय नमः । अस्य श्रीमहालक्ष्मीकवचमन्त्रस्य ब्रह्मा ऋषिः गायत्री
    छन्दः महालक्ष्मीर्देवता महालक्ष्मीप्रीत्यर्थं जपे विनियोगः । इन्द्र उवाच । समस्तकवचानां तु तेजस्वि
    कवचोत्तमम् । आत्मरक्षणमारोग्यं सत्यं त्वं ब्रूहि गीष्पते ॥ १॥ श्रीगुरुरुवाच । महालक्ष्म्यास्तु कवचं
    प्रवक्ष्यामि समासतः । चतुर्दशसु लोकेषु रहस्यं ब्रह्मणोदितम् ॥ २॥ ब्रह्मोवाच । शिरो मे विष्णुपत्नी
    च ललाटममृतोद्भवा । चक्षुषी सुविशालाक्षी श्रवणे सागराम्बुजा ॥ ३॥ घ्राणं पातु वरारोहा जिह्वामाम्नायरूपिणी
    । मुखं पातु महालक्ष्मीः कण्ठं वैकुण्ठवासिनी ॥ ४॥ स्कन्धौ मे जानकी पातु भुजौ भार्गवनन्दिनी । बाहू द्वौ
    द्रविणी पातु करौ हरिवराङ्गना ॥ ५॥ वक्षः पातु च श्रीर्देवी हृदयं हरिसुन्दरी । कुक्षिं च वैष्णवी पातु
    नाभिं भुवनमातृका ॥ ६॥ कटिं च पातु वाराही सक्थिनी देवदेवता । ऊरू नारायणी पातु जानुनी चन्द्रसोदरी ॥
    ७॥ इन्दिरा पातु जङ्घे मे पादौ भक्तनमस्कृता । नखान् तेजस्विनी पातु सर्वाङ्गं करुणामयी ॥ ८॥
