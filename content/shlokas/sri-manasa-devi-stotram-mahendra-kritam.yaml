id: sri-manasa-devi-stotram-mahendra-kritam
category: stotram
name:
  english: Sri Manasa Devi Stotram (Mahendra Kritam)
content:
  english: devi tvam stotumicchami sadhvinam pravaram param | paratparam ca paramam na hi stotum kshamo'dhuna
    || || stotranam lakshanam vede svabhavakhyanatah param | na kshamah prakritim vaktum gunanam tava
    suvrate || || shuddhasattvasvarupa tvam kopahimsavivarjita | na ca shapto munistena tyaktaya ca tvaya
    yatah || || tvam maya pujita sadhvi janani ca yatha'ditih | dayarupa ca bhagini kshamarupa yatha prasuh
    || || tvaya me rakshitah prana putradarah sureshvari | aham karomi tvam pujyam mama pritishca vardhate
    || || nityam yadyapi pujya tvam bhave'tra jagadambike | tathapi tava pujam vai vardhayami punah punah
    || || ye tvamashadhasankrantyam pujayishyanti bhaktitah | pancamyam manasakhyayam masante va dine
    dine || || putrapautradayastesham vardhante ca dhanani ca | yashasvinah kirtimanto vidyavanto gunanvitah
    || || ye tvam na pujayishyanti nindantyajnanato janah | lakshmihina bhavishyanti tesham nagabhayam
    sada || || tvam svargalakshmih svarge ca vaikunthe kamalakala | narayanamsho bhagavan jaratkarurmunishvarah
    || || tapasa tejasa tvam ca manasa sasrije pita | asmakam rakshanayaiva tena tvam manasabhidha ||
    || manasa devi tu shakta catmana siddhayogini | tena tvam manasadevi pujita vandita bhave || || yam
    bhaktya manasa devah pujayantyanisham bhrisham | tena tvam manasadevim pravadanti puravidah || ||
    sattvarupa ca devi tvam shashvatsattvanishevaya | yo hi yadbhavayennityam shatam prapnoti tatsamam
    || || idam stotram punyabijam tam sampujya ca yah pathet | tasya nagabhayam nasti tasya vamshodbhavasya
    ca || || visham bhavetsudhatulyam siddhastotram yada pathet | pancalakshajapenaiva siddhastotro bhavennarah
    | sarpashayi bhavetso'pi nishcitam sarpavahanah || || iti shribrahmavaivarte mahapurane prakritikhande
    shatcatvarimsho'dhyaye mahendra krita shri manasadevi stotram || astikamuni mantrah sarpapasarpa bhadram
    te gaccha sarpa mahavisha | janamejayasya yajnante astikavacanam smara ||
  devanagari: देवि त्वां स्तोतुमिच्छामि साध्वीनां प्रवरां पराम् । परात्परां च परमां न हि स्तोतुं क्षमोऽधुना
    ॥ ॥ स्तोत्राणां लक्षणं वेदे स्वभावाख्यानतः परम् । न क्षमः प्रकृतिं वक्तुं गुणानां तव सुव्रते ॥ ॥ शुद्धसत्त्वस्वरूपा
    त्वं कोपहिंसाविवर्जिता । न च शप्तो मुनिस्तेन त्यक्तया च त्वया यतः ॥ ॥ त्वं मया पूजिता साध्वी जननी
    च यथाऽदितिः । दयारूपा च भगिनी क्षमारूपा यथा प्रसूः ॥ ॥ त्वया मे रक्षिताः प्राणा पुत्रदाराः सुरेश्वरि
    । अहं करोमि त्वां पूज्यां मम प्रीतिश्च वर्धते ॥ ॥ नित्यं यद्यपि पूज्या त्वं भवेऽत्र जगदम्बिके । तथापि
    तव पूजां वै वर्धयामि पुनः पुनः ॥ ॥ ये त्वामाषाढसङ्क्रान्त्यां पूजयिष्यन्ति भक्तितः । पञ्चम्यां मनसाख्यायां
    मासान्ते वा दिने दिने ॥ ॥ पुत्रपौत्रादयस्तेषां वर्धन्ते च धनानि च । यशस्विनः कीर्तिमन्तो विद्यावन्तो
    गुणान्विताः ॥ ॥ ये त्वां न पूजयिष्यन्ति निन्दन्त्यज्ञानतो जनाः । लक्ष्मीहीना भविष्यन्ति तेषां नागभयं
    सदा ॥ ॥ त्वं स्वर्गलक्ष्मीः स्वर्गे च वैकुण्ठे कमलाकला । नारायणांशो भगवान् जरत्कारुर्मुनीश्वरः ॥ ॥
    तपसा तेजसा त्वां च मनसा ससृजे पिता । अस्माकं रक्षणायैव तेन त्वं मनसाभिधा ॥ ॥ मनसा देवि तु शक्ता चात्मना
    सिद्धयोगिनी । तेन त्वं मनसादेवी पूजिता वन्दिता भवे ॥ ॥ यां भक्त्या मनसा देवाः पूजयन्त्यनिशं भृशम्
    । तेन त्वां मनसादेवीं प्रवदन्ति पुराविदः ॥ ॥ सत्त्वरूपा च देवी त्वं शश्वत्सत्त्वनिषेवया । यो हि यद्भावयेन्नित्यं
    शतं प्राप्नोति तत्समम् ॥ ॥ इदं स्तोत्रं पुण्यबीजं तां सम्पूज्य च यः पठेत् । तस्य नागभयं नास्ति तस्य
    वंशोद्भवस्य च ॥ ॥ विषं भवेत्सुधातुल्यं सिद्धस्तोत्रं यदा पठेत् । पञ्चलक्षजपेनैव सिद्धस्तोत्रो भवेन्नरः
    । सर्पशायी भवेत्सोऽपि निश्चितं सर्पवाहनः ॥ ॥ इति श्रीब्रह्मवैवर्ते महापुराणे प्रकृतिखण्डे षट्चत्वारिंशोऽध्याये
    महेन्द्र कृत श्री मनसादेवी स्तोत्रम् ॥ आस्तीकमुनि मन्त्रः सर्पापसर्प भद्रं ते गच्छ सर्प महाविष । जनमेजयस्य
    यज्ञान्ते आस्तीकवचनं स्मर ॥
