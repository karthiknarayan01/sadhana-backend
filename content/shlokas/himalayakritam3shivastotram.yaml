id: himalayakritam3shivastotram
category: stotram
name:
  english: himalayakritam3shivastotram
  devanagari: हिमालयकृतं३शिवस्तोत्रम्
content:
  english: himalayakritam 3 shivastotram himalaya uvaca | prasida dakshayajnaghna narakarnavataraka |
    sarvatmarupa sarvesha paramanandavigraha || 63|| gunarnava gunatita gunayukta ganeshvara | gunabija
    mahabhaga prasida guninam vara || 64|| yogadhara yogarupa yogajna yogakarana | yogisha yoginam bija
    prasida yoginam guro || 65|| pralayapralayadyaikabhavapralayakarana | pralayante srishtibija prasida
    paripalaka || 66|| samharakale ghore ca srishtisamharakarana | durnivarya duraradhya cashutosha prasida
    me || 67|| kalasvarupa kalesha kale ca phaladayaka | kalabijaikakalaghna prasida kalapalaka || 68||
    shivasvarupa shivada shivabija shivashraya | shivabhuta shivaprana prasida paramashraya || 69|| ityevam
    stavanam kritva virarama himalayah | prashashamsuh surah sarve munayashca girishvaram || 70|| himalayakritam
    stotram samyato yah pathennarah | pradadati shivastasmai vanchitam radhike dhruvam || 71|| iti shribrahmavaivartapurane
    shrikrishnajanmakhande purve catushcatvarimshadhyayantargatam himalayakritam shivastotram samaptam
    | brahmavaivartapurana | shrikrishnajanma
  devanagari: हिमालयकृतं ३ शिवस्तोत्रम् हिमालय उवाच । प्रसीद दक्षयज्ञघ्न नरकार्णवतारक । सर्वात्मरूप सर्वेश
    परमानन्दविग्रह ॥ ६३॥ गुणार्णव गुणातीत गुणयुक्त गणेश्वर । गुणबीज महाभाग प्रसीद गुणिनां वर ॥ ६४॥ योगाधार
    योगरूप योगज्ञ योगकारण । योगीश योगिनां बीज प्रसीद योगिनां गुरो ॥ ६५॥ प्रलयप्रलयाद्यैकभवप्रलयकारण ।
    प्रलयान्ते सृष्टिबीज प्रसीद परिपालक ॥ ६६॥ संहारकाले घोरे च सृष्टिसंहारकारण । दुर्निवार्य दुराराध्य
    चाशुतोष प्रसीद मे ॥ ६७॥ कालस्वरूप कालेश काले च फलदायक । कालबीजैककालघ्न प्रसीद कालपालक ॥ ६८॥ शिवस्वरूप
    शिवद शिवबीज शिवाश्रय । शिवभूत शिवप्राण प्रसीद परमाश्रय ॥ ६९॥ इत्येवं स्तवनं कृत्वा विरराम हिमालयः
    । प्रशशंसुः सुराः सर्वे मुनयश्च गिरीश्वरम् ॥ ७०॥ हिमालयकृतं स्तोत्रं संयतो यः पठेन्नरः । प्रददाति
    शिवस्तस्मै वाञ्छितं राधिके ध्रुवम् ॥ ७१॥ इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे पूर्वे चतुश्चत्वारिंशाध्यायान्तर्गतं
    हिमालयकृतं शिवस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
