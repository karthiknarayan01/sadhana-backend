id: garbha-rakshambika-stotram
category: stotram
name:
  english: Garbha Rakshambika Stotram
content:
  english: shrimadhavi kananasthe garbharakshambike pahi bhaktam stuvantim || vapitate vamabhage vamadevasya
    devasya devi sthita tvam | manya varenya vadanya pahi garbhasthajantun tatha bhaktalokan || || shrimadhavi
    kananasthe garbharakshambike pahi bhaktam stuvantim || shrigarbharakshapure ya divyasaundaryayukta
    sumangalyagatri | dhatri janitri jananam divyarupam dayardram manojnam bhaje tvam || || shrimadhavi
    kananasthe garbharakshambike pahi bhaktam stuvantim || ashadhamase supunye shukravare sugandhena gandhena
    lipta | divyambarakalpavesha vajapeyadiyagasthabhaktaih sudrishta || || shrimadhavi kananasthe garbharakshambike
    pahi bhaktam stuvantim || kalyanadatrim namasye vedikadhyastriya garbharakshakarim tvam | balaissada
    sevitanghrim garbharaksharthamaradupetairupetam || || shrimadhavi kananasthe garbharakshambike pahi
    bhaktam stuvantim || brahmotsave vipravithyam vadyaghoshena tushtam rathe sannivishtam | sarvarthadatrim
    bhaje'ham devavrindairapidyam jaganmataram tvam || || shrimadhavi kananasthe garbharakshambike pahi
    bhaktam stuvantim || etat kritam stotraratnam dikshitanantaramena devyashca tushtyai | nityam pathedyastu
    bhaktya putrapautradi bhagyam bhavettasya nityam || || shrimadhavi kananasthe garbharakshambike pahi
    bhaktam stuvantim || iti shrianantaramadikshitavarya viracitam garbharakshambika stotram ||
  devanagari: श्रीमाधवी काननस्थे गर्भरक्षाम्बिके पाहि भक्तां स्तुवन्तीम् ॥ वापीतटे वामभागे वामदेवस्य देवस्य
    देवि स्थिता त्वम् । मान्या वरेण्या वदान्या पाहि गर्भस्थजन्तून् तथा भक्तलोकान् ॥ ॥ श्रीमाधवी काननस्थे
    गर्भरक्षाम्बिके पाहि भक्तां स्तुवन्तीम् ॥ श्रीगर्भरक्षापुरे या दिव्यसौन्दर्ययुक्ता सुमाङ्गल्यगात्री
    । धात्री जनित्री जनानां दिव्यरूपां दयार्द्रां मनोज्ञां भजे त्वाम् ॥ ॥ श्रीमाधवी काननस्थे गर्भरक्षाम्बिके
    पाहि भक्तां स्तुवन्तीम् ॥ आषाढमासे सुपुण्ये शुक्रवारे सुगन्धेन गन्धेन लिप्ता । दिव्याम्बराकल्पवेषा
    वाजपेयादियागस्थभक्तैः सुदृष्टा ॥ ॥ श्रीमाधवी काननस्थे गर्भरक्षाम्बिके पाहि भक्तां स्तुवन्तीम् ॥ कल्याणदात्रीं
    नमस्ये वेदिकाढ्यस्त्रिया गर्भरक्षाकरीं त्वाम् । बालैस्सदा सेविताङ्घ्रिं गर्भरक्षार्थमारादुपेतैरुपेताम्
    ॥ ॥ श्रीमाधवी काननस्थे गर्भरक्षाम्बिके पाहि भक्तां स्तुवन्तीम् ॥ ब्रह्मोत्सवे विप्रवीथ्यां वाद्यघोषेण
    तुष्टां रथे सन्निविष्टाम् । सर्वार्थदात्रीं भजेऽहं देववृन्दैरपीड्यां जगन्मातरं त्वाम् ॥ ॥ श्रीमाधवी
    काननस्थे गर्भरक्षाम्बिके पाहि भक्तां स्तुवन्तीम् ॥ एतत् कृतं स्तोत्ररत्नं दीक्षितानन्तरामेण देव्याश्च
    तुष्ट्यै । नित्यं पठेद्यस्तु भक्त्या पुत्रपौत्रादि भाग्यं भवेत्तस्य नित्यम् ॥ ॥ श्रीमाधवी काननस्थे
    गर्भरक्षाम्बिके पाहि भक्तां स्तुवन्तीम् ॥ इति श्रीअनन्तरामदीक्षितवर्य विरचितं गर्भरक्षाम्बिका स्तोत्रम्
    ॥
