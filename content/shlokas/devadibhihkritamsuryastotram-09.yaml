id: devadibhihkritamsuryastotram-09
category: stotram
name:
  english: devadibhihkritamsuryastotram 09
  devanagari: देवादिभिःकृतंसूर्यस्तोत्रम् ०९
content:
  english: devadibhih kritam suryastotram 9 trailokyamakulam vikshya bhramamanam surarshayah | devashca
    brahmana sarddham bhasvantamabhitushtuvuh || 88|| devadaya ucuh | adidevo'si devanam jatastvam bhutaye
    bhuvah | svargasthityantakaleshu tridha bhedena tishthasi || 89|| svasti te'stu jagannatha gharmavarsha
    divakara | indradayastada deva likhyamanamathastuvan || 90|| jaya deva jagatsvamin jayashesha jagatpate
    | rishayashca tatah sapta vasishthatripurogamah || 91|| tushtuvurvidhaih stotraih svasti svastitivadinah
    | vedoktibhirathagyrabhirvalakhilyashca tushtuvuh || 92|| agniradyashca bhasvantam likhyamanam muda
    yutah | tvam natha mokshinam moksho dhyeyastvam dhyaninam parah || 93|| tvam gatih sarvabhutanam karmakandavivarttinam
    | sampujyastvam tu devesha sham no'stu jagatam pate || 94|| sham no'stu dvipade nityam sham nashcastu
    catushpade | tato vidyadharagana yaksharakshasapannagah || 95|| kritanjaliputah sarve shirobhih pranata
    ravim | ucuste vividha vaco manahshrotrasukhavahah || 96|| iti brahmapurane dvatrimshadhyayantargatam
    devadibhih kritam suryastotram samaptam | brahmapurana | adhyaya 32
  devanagari: देवादिभिः कृतं सूर्यस्तोत्रम् ९ त्रैलोक्यमाकुलं वीक्ष्य भ्रममाणं सुरर्षयः । देवाश्च ब्रह्मणा
    सार्द्धं भास्वन्तमभितुष्टुवुः ॥ ८८॥ देवादय ऊचुः । आदिदेवोऽसि देवानां जातस्त्वं भूतये भुवः । स्वर्गस्थित्यन्तकालेषु
    त्रिधा भेदेन तिष्ठसि ॥ ८९॥ स्वस्ति तेऽस्तु जगन्नाथ घर्मवर्ष दिवाकर । इन्द्रादयस्तदा देवा लिख्यमानमथास्तुवन्
    ॥ ९०॥ जय देव जगत्स्वामिन् जयाशेष जगत्पते । ऋषयश्च ततः सप्त वसिष्ठात्रिपुरोगमाः ॥ ९१॥ तुष्टुवुर्विधैः
    स्तोत्रैः स्वस्ति स्वस्तीतिवादिनः । वेदोक्तिभिरथाग्य्राभिर्वालखिल्याश्च तुष्टुवुः ॥ ९२॥ अग्निराद्याश्च
    भास्वन्तं लिख्यमानं मुदा युताः । त्वं नाथ मोक्षिणां मोक्षो ध्येयस्त्वं ध्यानिनां परः ॥ ९३॥ त्वं गतिः
    सर्वभूतानां कर्मकाण्डविवर्त्तिनाम् । सम्पूज्यस्त्वं तु देवेश शं नोऽस्तु जगतां पते ॥ ९४॥ शं नोऽस्तु
    द्विपदे नित्यं शं नश्चास्तु चतुष्पदे । ततो विद्याधरगणा यक्षराक्षसपन्नगाः ॥ ९५॥ कृताञ्जलिपुटाः सर्वे
    शिरोभिः प्रणता रविम् । ऊचुस्ते विविधा वाचो मनःश्रोत्रसुखावहाः ॥ ९६॥ इति ब्रह्मपुराणे द्वात्रिंशाध्यायान्तर्गतं
    देवादिभिः कृतं सूर्यस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय ३२
