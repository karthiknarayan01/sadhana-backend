id: umashatakam-1
category: stotram
name:
  english: umashatakam 1
  devanagari: उमाशतकम् १
content:
  english: udurajakalakalapakante sadaye sundari komalangi matah | shrutipadmadrishavatamsitam te padapadmam
    pratibhatu manase me || 41|| arunacalanathasadmanathe caritam te caranasya dhatri citram | kriyate'bjasanabhinamuna
    yadgatapanke munimanase nivasah || 42|| caritam caranambujanmanaste paramam vismayamatanoti matah
    | atiragavadapyado vidhate sahavasena yadantaram viragam || 43|| bhavabhamini karmasharmadatuh bhavadiyasya
    padasya vismayaya | api dhulividhusaram vidhatte yadidam vitarajo mano muninam || 44|| caranam jagadamba
    kaitabhariryatamano'pi dadarsha naiva yasya | sa harastava drishyate vilagnashcarane candi caracaradhinathah
    || 45|| kamalasanakanjalocanadinavamatya tridashannageshakanye | agune ramase nage'tra shone kva gunan
    pashyati jatipakshapatah || 46|| kusumadapi komalam vapuste hridayeshastvaruno girih kathorah | pracalakhuturangamasya
    matah samanudhyaya bibhemi cetasedam || 47|| yadasau vihitah sito'runadristava hasena sitena natra
    citram | idamadbhutamasya manasam yadvimalam parvati niyate'tiragam || 48|| navakunkumarenupankilasya
    smaranatte satatam stanacalasya | svayamapyacalo babhuva shonah shashidhari jagatam savitri shanke
    || 49|| smaranadarunacalasya mukttih kathamashlilakapalabhushanasya | vapusho'dharmamushya cennacetastimiradhvamsini
    sarvamangale tvam || 50|| shashtham dashakam
  devanagari: उडुराजकलाकलापकान्ते सदये सुन्दरि कोमलाङ्गि मातः । श्रुतिपद्मदृशावतंसितं ते पदपद्मं प्रतिभातु
    मानसे मे ॥ ४१॥ अरुणाचलनाथसद्मनाथे चरितं ते चरणस्य धात्रि चित्रम् । क्रियतेऽब्जसनाभिनामुना यद्गतपङ्के
    मुनिमानसे निवासः ॥ ४२॥ चरितं चरणाम्बुजन्मनस्ते परमं विस्मयमातनोति मातः । अतिरागवदप्यदो विधते सहवासेन
    यदन्तरं विरागम् ॥ ४३॥ भवभामिनि कर्मशर्मदातुः भवदीयस्य पदस्य विस्मयाय । अपि धूलिविधूसरं विधत्ते यदिदं
    वीतरजो मनो मुनीनाम् ॥ ४४॥ चरणं जगदम्ब कैटभारिर्यतमानोऽपि ददर्श नैव यस्य । स हरस्तव दृश्यते विलग्नश्चरणे
    चण्डि चराचराधिनाथः ॥ ४५॥ कमलासनकञ्जलोचनादीनवमत्य त्रिदशान्नगेशकन्ये । अगुणे रमसे नगेऽत्र शोणे क्व
    गुणान् पश्यति जातिपक्षपातः ॥ ४६॥ कुसुमादपि कोमलं वपुस्ते हृदयेशस्त्वरुणो गिरिः कठोरः । प्रचलाखुतुरङ्गमस्य
    मातः समनुध्याय बिभेमि चेतसेदम् ॥ ४७॥ यदसौ विहितः सितोऽरुणाद्रिस्तव हासेन सितेन नात्र चित्रम् । इदमद्भुतमस्य
    मानसं यद्विमलं पार्वति नीयतेऽतिरागम् ॥ ४८॥ नवकुङ्कुमरेणुपङ्किलस्य स्मरणात्ते सततं स्तनाचलस्य । स्वयमप्यचलो
    बभूव शोणः शशिधारी जगतं सवित्रि शङ्के ॥ ४९॥ स्मरणादरुणाचलस्य मुक्त्तिः कथमश्लीलकपालभूषणस्य । वपुषोऽधर्ममुष्य
    चेन्नचेतस्तिमिरध्वंसिनि सर्वमङ्गले त्वम् ॥ ५०॥ षष्ठं दशकम्
