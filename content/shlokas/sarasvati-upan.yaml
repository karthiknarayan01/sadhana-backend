id: sarasvati-upan
category: upanishad
name:
  english: sarasvati upan
  devanagari: सरस्वति उपन्
content:
  english: naptirupaika sa mam patu sarasvati || aim catvari vak parimita padani tani vidurbrahmana ye
    manishinah | guha trini nihita nengayanti turiyam vaco manushya vadanti || 6|| yadragvadantiti mantrasya
    bhargava rishih | trishtup chandah | sarasvati devata | klimiti bijashaktih kilakam | mantrena nyasah
    | namajatyadibhirbhedairashtadha ya vikalpita | nirvikalpatmana vyakta sa mam patu sarasvati || klim
    yadvagvadantyavicetanani rashtri devanam nishasada mandra | catasra urjam duduhe payamsi kva svidasyah
    paramam jagama || 7|| devim vacamiti mantrasya bhargava rishih | trishtup chandah | sarasvati devata
    | sauriti bijashaktih kilakam | mantrena nyasah | vyaktavyaktagirah sarve vedadya vyaharanti yam |
    sarvakamadudha dhenuh sa mam patu sarasvati || sauh devim vacamajanayanta devasta vishvarupah pashavo
    vadanti | sa no mandreshamurjam duhana dhenurvagasmanupasushtutaitu || 8|| uta tva iti mantrasya brihaspatirrishih
    | trishtup chandah | sarasvati devata | samiti bijashaktih kilakam | mantrena nyasah | yam viditvakhilam
    bandham nirmathyakhilavartmana | yogi yati param sthanam sa mam patu sarasvati || sam uta tvah pashyanna
    dadarsha vacamuta tvah shrunvanna shrunotyenam | uto tvasmai tanvam 1 visasre jayeva patya ushati
    suvasah || 9|| ambitama iti mantrasya gritsamada rishih | anushtup chandah | sarasvati devata | aimiti
    bijashaktih kilakam | mantrena nyasah | namarupatmakam sarvam yasyamaveshya tam punah | dhyayanti
    brahmarupaika sa mam patu sarasvati || aim ambitame naditame devitame sarasvati | aprashasta iva smasi
    prashastimamba naskridhi || 10|| caturmukhamukhambhojavanahamsavadhurmama | manase ramatam nityam
    sarvashukla sarasvati || 1|| namaste sharade devi kashmirapuravasini | tvamaham prarthaye nityam vidyadanam
    ca dehi me || 2|| akshasutrankushadhara pashapustakadharini | muktaharasamayukta vaci tishthatu me
    sada || 3|| kambukanthi sutamroshthi sarvabharanabhushita | mahasarasvati devi jihvagre samnivishyatam
    || 4|| ya shraddha dharana medha vagdevi vidhivallabha | bhaktajihvagrasadana shamadigunadayini ||
    5|| namami yamininathalekhalankritakuntalam | bhavanim bhavasantapanirvapanasudhanadim || 6|| yah
    kavitvam niratankam bhuktimukti ca vanchati | so'bhaircyainam dashashlokya nityam stauti sarasvatim
    || 7|| tasyaivam stuvato nityam samabhyarcya sarasvatim | bhaktishraddhabhiyuktasya shanmasatpratyayo
    bhavet || 8|| tatah pravartate vani svecchaya lalitakshara | gadyapadyatmakaih shabdairaprameyairvivakshitaih
    || 9|| ashruto budhyate granthah prayah sarasvatah kavih | ityevam nishcayam viprah sa hovaca sarasvati
    || 10|| atmavidya maya labdhva brahmanaiva sanatani | brahmatvam me sada nityam saccidanandarupatah
    || 11|| prakrititvam tatah srishtam sattvadigunasamyatah | satyamabhati cicchaya darpane pratibimbavat
    || 12|| tena citpratibimbena trividha bhati sa punah | prakrityavacchinnataya purushatvam punashca
    te || 13|| shuddhasattvapradhanayam mayayam bimbito hyajah | sattvapradhana prakritirmayeti pratipadyate
    || 14|| sa maya svavashopadhih sarvajnasyeshvarasya hi | vashyamayatvamekatvam sarvajnatvam ca tasya
    tu || 15|| satvikatvatsamashtitvatsakshitvajjagatamapi | jagatkartumakartum va canyatha kartumishate
    || 16|| yah sa ishvara ityuktah sarvajnatvadibhirgunaih | shaktidvayam hi mayaya vikshepavritirupakam
    || 17|| vikshepashaktirlingadibrahmandantam jagatsrijet | antardrigdrishyayorbhedam bahishca brahmasargayoh
    || 18|| avrinotyapara shaktih sa samsarasya karanam | sakshinah purato bhatam lingadehena samyutam
    || 19|| citicchayasamaveshajjivah syadvyavaharikah | asya jivatvamaropatsakshinyapyavabhasate || 20||
    avritau tu vinashtayam bhede bhate'payati tat | tatha sargabrahmanoshca bhedamavritya tishthati ||
    21|| ya shaktistvadvashadbrahma vikritatvena bhasate | atrapyavritinashena vibhati brahmasargayoh
    || 22|| bhedastayorvikarah syatsarge na brahmani kvacit | asti bhati priyam rupam nama cetyamshapancakam
    || 23|| adyatrayam brahmarupam jagadrupam tato dvayam | apekshya namarupadve saccidanandatatparah
    || 24|| samadhim sarvada kuryadhridaye vatha va bahih | savikalpo nirvikalpah samadhirdvividho hridi
    || 25|| drishyashabdanubhedena sa vikalpah punardvidha | kamadyashcittaga drishyastatsakshitvena cetanam
    || 26|| dhyayaddrishyanuviddho'yam samadhih savikalpakah | svanubhutirasaveshaddrishyashabdadyapekshituh
    || 28|| nirvikalpah samadhih syannivantasthitadipavat | hridiva bahyadeshe'pi yasminkasmimshca vastuni
    || 29|| samadhiradyasanmatrannamarupaprithakkritih | stabdhibhavo rasasvadattritiyah purvavanmatah
    || 30|| etaih samadhibhih shadbhirnayetkalam nirantaram | dehabhimane galite vijnate paramatmani |
    yatra yatra mano yati tatra tatra paramritam || 31|| bhidyate hridayagranthishchidyante sarvasamshayah
    | kshiyante casya karmani tasmindrishte paravare || 32|| mayi jivatvamishatvam kalpitam vastuto nahi
    | iti yastu vijanati sa mukto natra samshayah || 33|| ityupanishat || om vanme manasi pratishthita
    mano me vaci pratishthita
  devanagari: नप्तिरूपैका सा मां पातु सरस्वती ॥ ऐं चत्वारि वाक् परिमिता पदानि तानि विदुर्ब्राह्मणा ये
    मनीषिणः । गुहा त्रीणि निहिता नेङ्गयन्ति तुरीयं वाचो मनुष्या वदन्ति ॥ ६॥ यद्राग्वदन्तीति मन्त्रस्य
    भार्गव ऋषिः । त्रिष्टुप् छन्दः । सरस्वती देवता । क्लीमिति बीजशक्तिः कीलकम् । मन्त्रेण न्यासः । नामजात्यादिभिर्भेदैरष्टधा
    या विकल्पिता । निर्विकल्पात्मना व्यक्ता सा मां पातु सरस्वती ॥ क्लीं यद्वाग्वदन्त्यविचेतनानि राष्ट्री
    देवानां निषसाद मन्द्रा । चतस्र ऊर्जं दुदुहे पयांसि क्व स्विदस्याः परमं जगाम ॥ ७॥ देवीं वाचमिति मन्त्रस्य
    भार्गव ऋषिः । त्रिष्टुप् छन्दः । सरस्वती देवता । सौरिति बीजशक्तिः कीलकम् । मन्त्रेण न्यासः । व्यक्ताव्यक्तगिरः
    सर्वे वेदाद्या व्याहरन्ति याम् । सर्वकामदुधा धेनुः सा मां पातु सरस्वती ॥ सौः देवीं वाचमजनयन्त देवास्ता
    विश्वरूपाः पशवो वदन्ति । सा नो मन्द्रेषमूर्जं दुहाना धेनुर्वागस्मानुपसुष्टुतैतु ॥ ८॥ उत त्व इति मन्त्रस्य
    बृहस्पतिरृषिः । त्रिष्टुप् छन्दः । सरस्वती देवता । समिति बीजशक्तिः कीलकम् । मन्त्रेण न्यासः । यां
    विदित्वाखिलं बन्धं निर्मथ्याखिलवर्त्मना । योगी याति परं स्थानं सा मां पातु सरस्वती ॥ सं उत त्वः पश्यन्न
    ददर्श वाचमुत त्वः श्रुण्वन्न श्रुणोत्येनाम् । उतो त्वस्मै तन्वं १ विसस्रे जायेव पत्य उशती सुवासाः
    ॥ ९॥ अम्बितम इति मन्त्रस्य गृत्समद ऋषिः । अनुष्टुप् छन्दः । सरस्वती देवता । ऐमिति बीजशक्तिः कीलकम्
    । मन्त्रेण न्यासः । नामरूपात्मकं सर्वं यस्यामावेश्य तां पुनः । ध्यायन्ति ब्रह्मरूपैका सा मां पातु
    सरस्वती ॥ ऐं अम्बितमे नदीतमे देवितमे सरस्वती । अप्रशस्ता इव स्मसि प्रशस्तिमम्ब नस्कृधि ॥ १०॥ चतुर्मुखमुखाम्भोजवनहंसवधूर्मम
    । मानसे रमतां नित्यं सर्वशुक्ला सरस्वती ॥ १॥ नमस्ते शारदे देवि काश्मीरपुरवासिनि । त्वामहं प्रार्थये
    नित्यं विद्यादानं च देहि मे ॥ २॥ अक्षसूत्राङ्कुशधरा पाशपुस्तकधारिणी । मुक्ताहारसमायुक्ता वाचि तिष्ठतु
    मे सदा ॥ ३॥ कम्बुकण्ठी सुताम्रोष्ठी सर्वाभरणभूषिता । महासरस्वती देवी जिह्वाग्रे संनिविश्यताम् ॥ ४॥
    या श्रद्धा धारणा मेधा वाग्देवी विधिवल्लभा । भक्तजिह्वाग्रसदना शमादिगुणदायिनी ॥ ५॥ नमामि यामिनीनाथलेखालङ्कृतकुन्तलाम्
    । भवानीं भवसन्तापनिर्वापणसुधानदीम् ॥ ६॥ यः कवित्वं निरातङ्कं भुक्तिमुक्ती च वाञ्छति । सोऽभैर्च्यैनां
    दशश्लोक्या नित्यं स्तौति सरस्वतीम् ॥ ७॥ तस्यैवं स्तुवतो नित्यं समभ्यर्च्य सरस्वतीम् । भक्तिश्रद्धाभियुक्तस्य
    षण्मासात्प्रत्ययो भवेत् ॥ ८॥ ततः प्रवर्तते वाणी स्वेच्छया ललिताक्षरा । गद्यपद्यात्मकैः शब्दैरप्रमेयैर्विवक्षितैः
    ॥ ९॥ अश्रुतो बुध्यते ग्रन्थः प्रायः सारस्वतः कविः । इत्येवं निश्चयं विप्राः सा होवाच सरस्वती ॥ १०॥
    आत्मविद्या मया लब्ध्वा ब्रह्मणैव सनातनी । ब्रह्मत्वं मे सदा नित्यं सच्चिदानन्दरूपतः ॥ ११॥ प्रकृतित्वं
    ततः सृष्टं सत्त्वादिगुणसाम्यतः । सत्यमाभाति चिच्छाया दर्पणे प्रतिबिम्बवत् ॥ १२॥ तेन चित्प्रतिबिम्बेन
    त्रिविधा भाति सा पुनः । प्रकृत्यवच्छिन्नतया पुरुषत्वं पुनश्च ते ॥ १३॥ शुद्धसत्त्वप्रधानायां मायायां
    बिम्बितो ह्यजः । सत्त्वप्रधाना प्रकृतिर्मायेति प्रतिपाद्यते ॥ १४॥ सा माया स्ववशोपाधिः सर्वज्ञस्येश्वरस्य
    हि । वश्यमायत्वमेकत्वं सर्वज्ञत्वं च तस्य तु ॥ १५॥ सात्विकत्वात्समष्टित्वात्साक्षित्वाज्जगतामपि ।
    जगत्कर्तुमकर्तुं वा चान्यथा कर्तुमीशते ॥ १६॥ यः स ईश्वर इत्युक्तः सर्वज्ञत्वादिभिर्गुणैः । शक्तिद्वयं
    हि मायाया विक्षेपावृतिरूपकम् ॥ १७॥ विक्षेपशक्तिर्लिङ्गादिब्रह्माण्डान्तं जगत्सृजेत् । अन्तर्दृग्दृश्ययोर्भेदं
    बहिश्च ब्रह्मसर्गयोः ॥ १८॥ आवृणोत्यपरा शक्तिः सा संसारस्य कारणम् । साक्षिणः पुरतो भातं लिङ्गदेहेन
    संयुतम् ॥ १९॥ चितिच्छायासमावेशाज्जीवः स्याद्व्यावहारिकः । अस्य जीवत्वमारोपात्साक्षिण्यप्यवभासते ॥
    २०॥ आवृतौ तु विनष्टायां भेदे भातेऽपयाति तत् । तथा सर्गब्रह्मणोश्च भेदमावृत्य तिष्ठति ॥ २१॥ या शक्तिस्त्वद्वशाद्ब्रह्म
    विकृतत्वेन भासते । अत्राप्यावृतिनाशेन विभाति ब्रह्मसर्गयोः ॥ २२॥ भेदस्तयोर्विकारः स्यात्सर्गे न ब्रह्मणि
    क्वचित् । अस्ति भाति प्रियं रूपं नाम चेत्यंशपञ्चकम् ॥ २३॥ आद्यत्रयं ब्रह्मरूपं जगद्रूपं ततो द्वयम्
    । अपेक्ष्य नामरूपद्वे सच्चिदानन्दतत्परः ॥ २४॥ समाधिं सर्वदा कुर्याधृदये वाथ वा बहिः । सविकल्पो निर्विकल्पः
    समाधिर्द्विविधो हृदि ॥ २५॥ दृश्यशब्दानुभेदेन स विकल्पः पुनर्द्विधा । कामाद्याश्चित्तगा दृश्यास्तत्साक्षित्वेन
    चेतनम् ॥ २६॥ ध्यायद्दृश्यानुविद्धोऽयं समाधिः सविकल्पकः । स्वानुभूतिरसावेशाद्दृश्यशब्दाद्यपेक्षितुः
    ॥ २८॥ निर्विकल्पः समाधिः स्यान्निवान्तस्थितदीपवत् । हृदीव बाह्यदेशेऽपि यस्मिन्कस्मिंश्च वस्तुनि ॥
    २९॥ समाधिराद्यसन्मात्रान्नामरूपपृथक्कृतिः । स्तब्धीभावो रसास्वादात्तृतीयः पूर्ववन्मतः ॥ ३०॥ एतैः समाधिभिः
    षड्भिर्नयेत्कालं निरन्तरम् । देहाभिमाने गलिते विज्ञाते परमात्मनि । यत्र यत्र मनो याति तत्र तत्र परामृतम्
    ॥ ३१॥ भिद्यते हृदयग्रन्थिश्छिद्यन्ते सर्वसंशयाः । क्षीयन्ते चास्य कर्माणि तस्मिन्दृष्टे परावरे ॥ ३२॥
    मयि जीवत्वमीशत्वं कल्पितं वस्तुतो नहि । इति यस्तु विजानाति स मुक्तो नात्र संशयः ॥ ३३॥ इत्युपनिषत्
    ॥ ॐ वाङ्मे मनसि प्रतिष्ठिता मनो मे वाचि प्रतिष्ठित
