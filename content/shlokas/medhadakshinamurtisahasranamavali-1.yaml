    सर्वविद्याकलानिधिम् ॥ ११॥ लं इत्यादिना पञ्चोपचाराः ॥ ॥ श्री गुरुभ्यो नमः । अथ श्रीमेधादक्षिणामूर्तिसहस्रनामावलिः
