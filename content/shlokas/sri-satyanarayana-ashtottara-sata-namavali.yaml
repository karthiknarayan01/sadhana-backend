id: sri-satyanarayana-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Satyanarayana Ashtottara Sata Namavali
content:
  english: om narayanaya namah | om naraya namah | om shauraye namah | om cakrapanaye namah | om janardanaya
    namah | om vasudevaya namah | om jagadyonaye namah | om vamanaya namah | om jnanapanjaraya namah om
    shrivallabhaya namah | om jagannathaya namah | om caturmurtaye namah | om vyomakeshaya namah | om
    hrishikeshaya namah | om shankaraya namah | om garudadhvajaya namah | om narasimhaya namah | om mahadevaya
    namah | om svayambhuve namah | om bhuvaneshvaraya namah om shridharaya namah | om devakiputraya namah
    | om parthasarathaye namah | om acyutaya namah | om shankhapanaye namah | om paranjyotishe namah |
    om atmajyotishe namah | om acancalaya namah | om shrivatsankaya namah | om akhiladharaya namah om
    sarvalokapratiprabhave namah | om trivikramaya namah | om trikalajnanaya namah | om tridhamne namah
    | om karunakaraya namah | om sarvajnaya namah | om sarvagaya namah | om sarvasmai namah | om sarveshaya
    namah | om sarvasakshikaya namah om haraye namah | om sharngine namah | om haraya namah | om sheshaya
    namah | om halayudhaya namah | om sahasrabahave namah | om avyaktaya namah | om sahasrakshaya namah
    | om aksharaya namah | om ksharaya namah om gajarighnaya namah | om keshavaya namah | om keshimardanaya
    namah | om kaitabharaye namah | om avidyaraye namah | om kamadaya namah | om kamalekshanaya namah
    | om hamsashatrave namah | om adharmashatrave namah | om kakutthsaya namah om khagavahanaya namah
    | om nilambudadyutaye namah | om nityaya namah | om nityatriptaya namah | om nityanandaya namah |
    om suradhyakshaya namah | om nirvikalpaya namah | om niranjanaya namah | om brahmanyaya namah | om
    prithivinathaya namah om pitavasase namah | om guhashrayaya namah | om vedagarbhaya namah | om vibhave
    namah | om vishnave namah | om shrimate namah | om trailokyabhushanaya namah | om yajnamurtaye namah
    | om ameyatmane namah | om varadaya namah om vasavanujaya namah | om jitendriyaya namah | om jitakrodhaya
    namah | om samadrishtaye namah | om sanatanaya namah | om bhaktapriyaya namah | om jagatpujyaya namah
    | om paramatmane namah | om asurantakaya namah | om sarvalokanamantakaya namah om anantaya namah |
    om anantavikramaya namah | om mayadharaya namah | om niradharaya namah | om sarvadharaya namah | om
    dharadharaya namah | om nishkalankaya namah | om nirabhasaya namah | om nishprapancaya namah | om
    niramayaya namah om bhaktavashyaya namah | om mahodaraya namah | om punyakirtaye namah | om puratanaya
    namah | om trikalajnaya namah | om vishtarashravase namah | om caturbhujaya namah | om shrisatyanarayanasvamine
    namah
