    दुख दुख सुख सुख देखे पर ॥ सम अभूतरिपु बिमद बिरागी। लोभामरष हरष भय त्यागी ॥ कोमलचित दीनन्ह पर दाया।
    मन बच क्रम मम भगति अमाया ॥ सबहि मानप्रद आपु अमानी। भरत प्रान सम मम ते प्रानी ॥ बिगत काम मम नाम परायन।
    सान्ति बिरति बिनती मुदितायन ॥ सीतलता सरलता मयत्री। द्विज पद प्रीति धर्म जनयत्री ॥ ए सब लच्छन बसहिं
