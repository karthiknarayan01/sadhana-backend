id: laghu-raghavendra-stotra
category: stotram
name:
  english: laghu raghavendra stotra
  devanagari: लघु राघवेन्द्र स्तोत्र
content:
  english: laghu raghavendrastotra || laghuraghavemdrastutih || pujyaya raghavemdraya satyadharmarataya
    ca | bhajatam kalpavrikshaya namatam kamadhenave || 1|| durvadidhvamtaravaye vaishnavimdivarimdave
    | namo shri raghavemdragurave namo'tyamtadayaḻuve || 2|| shrisudhimdrabdhisambhutan raghavemdrakalanidhin
    | seve sajnanasaukhyartham samtapatraya shamtaye || 3|| agham dravayate yasmadvemkaro vanchitapradah
    | raghavemdrayatistasmalloke khyato bhavishyati || 4|| vyasena vyaptabijah shrutibhuvi bhagavatpadalabdhankurashrih
    | pratnairishatprabhinno'jani jayamunina samyagudbhinnashakhah | maunishavyasarajadudita kisalayah
    pushtito'yam jayemdrad | adya shri raghavemdradvilasati phalito madhvasiddhamtashakhi || 6|| iti shri
    laghuraghavemdrastutih sampurnam || bharatiramanamukhyapranamtargata shrikrishnarpanamastu ||
  devanagari: लघु राघवेन्द्रस्तोत्र ॥ लघुराघवेंद्रस्तुतिः ॥ पूज्याय राघवेंद्राय सत्यधर्मरताय च । भजतां
    कल्पवृक्षाय नमतां कामधेनवे ॥ १॥ दुर्वादिध्वांतरवये वैष्णवींदीवरींदवे । नमो श्री राघवेंद्रगुरवे नमोऽत्यंतदयाळुवे
    ॥ २॥ श्रीसुधींद्राब्धिसंभूतान् राघवेंद्रकलानिधीन् । सेवे सज्ञानसौख्यार्थं संतापत्रय शांतये ॥ ३॥ अघं
    द्रावयते यस्माद्वेंकारो वाञ्छितप्रदः । राघवेंद्रयतिस्तस्माल्लोके ख्यातो भविष्यति ॥ ४॥ व्यासेन व्याप्तबीजः
    श्रुतिभुवि भगवत्पादलब्धाङ्कुरश्रीः । प्रत्नैरीषत्प्रभिन्नोऽजनि जयमुनिना सम्यगुद्भिन्नशाखः । मौनीशव्यासराजादुदित
    किसलयः पुष्टितोऽयं जयेंद्राद् । अद्य श्री राघवेंद्राद्विलसति फलितो मध्वसिद्धांतशाखी ॥ ६॥ इति श्री
    लघुराघवेंद्रस्तुतिः सम्पूर्णम् ॥ भारतीरमणमुख्यप्राणांतर्गत श्रीकृष्णार्पणमस्तु ॥
