id: annamayya-keerthanas-vinnapaalu-vinavale
category: stotram
name:
  english: Annamayya Keerthanas Vinnapaalu Vinavale
content:
  english: jhampa pallavi vinnapalu vinavalè vinta vintalu | pannagapu domatèra paikèttavelayya || tèllavarè
    jamèkkè devatalu munulu | allanalla nantaninta nadigovare | callani tammirekulu sarasapu gannulu |
    mèllamèllanè vicci melukònavelayya || vinnapalu vinavalè vinta vintalu | pannagapu domatèra paikèttavelayya
    || garuda kinnarayaksha kaminulu gamulai | virahapu gitamula vintalapala | pariparividhamula baderu
    ninnadivo | sirimògamu dèraci cittagincavelayya || vinnapalu vinavalè vinta vintalu | pannagapu domatèra
    paikèttavelayya || pònkapu sheshadulu tumburu naradadulu | pankajabhavadulu ni padalu ceri | ankèlanunnaru
    leci alamelumanganu | venkateshuda rèppalu vicci cuci levayya || vinnapalu vinavalè vinta vintalu
    | pannagapu domatèra paikèttavelayya ||
  devanagari: झम्प पल्लवि विन्नपालु विनवलॆ विन्त विन्तलु । पन्नगपु दोमतॆर पैकॆत्तवेलय्या ॥ तॆल्लवारॆ जामॆक्कॆ
    देवतलु मुनुलु । अल्लनल्ल नन्तनिन्त नदिगोवारे । चल्लनि तम्मिरेकुलु सारसपु गन्नुलु । मॆल्लमॆल्लनॆ विच्चि
    मेलुकॊनवेलय्या ॥ विन्नपालु विनवलॆ विन्त विन्तलु । पन्नगपु दोमतॆर पैकॆत्तवेलय्या ॥ गरुड किन्नरयक्ष
    कामिनुलु गमुलै । विरहपु गीतमुल विन्तालापाल । परिपरिविधमुल बाडेरु निन्नदिवो । सिरिमॊगमु दॆरचि चित्तगिञ्चवेलय्या
    ॥ विन्नपालु विनवलॆ विन्त विन्तलु । पन्नगपु दोमतॆर पैकॆत्तवेलय्या ॥ पॊङ्कपु शेषादुलु तुम्बुरु नारदादुलु
    । पङ्कजभवादुलु नी पादालु चेरि । अङ्कॆलनुन्नारु लेचि अलमेलुमङ्गनु । वेङ्कटेशुडा रॆप्पलु विच्चि चूचि
    लेवय्या ॥ विन्नपालु विनवलॆ विन्त विन्तलु । पन्नगपु दोमतॆर पैकॆत्तवेलय्या ॥
