id: haribrahmabhyamkritamshivastotram
category: stotram
name:
  english: haribrahmabhyamkritamshivastotram
  devanagari: हरिब्रह्मभ्यांकृतंशिवस्तोत्रम्
content:
  english: haribrahmabhyam kritam shivastotram haribrahmanavucatuh | namo'stu te shulapane namo'stu vrishabhadhvaja
    | jimutavahana kave sharva tryambaka shankara || 78|| maheshvara maheshana suparnaksha vrishakape
    | dakshayajnakshayakara kalarupa namo'stu te || 79|| tvamadirasya jagatastvam madhyam parameshvara
    | bhavanantashca bhagavan sarvagastvam namo'stu te || 80|| iti vamanapurane shashthadhyayantargatam
    haribrahmabhyam kritam shivastotram samaptam | vamanapurana | adhyaya 6
  devanagari: हरिब्रह्मभ्यां कृतं शिवस्तोत्रम् हरिब्रह्माणावूचतुः । नमोऽस्तु ते शूलपाणे नमोऽस्तु वृषभध्वज
    । जीमूतवाहन कवे शर्व त्र्यम्बक शङ्कर ॥ ७८॥ महेश्वर महेशान सुपर्णाक्ष वृषाकपे । दक्षयज्ञक्षयकर कालरूप
    नमोऽस्तु ते ॥ ७९॥ त्वमादिरस्य जगतस्त्वं मध्यं परमेश्वर । भवानन्तश्च भगवान् सर्वगस्त्वं नमोऽस्तु ते
    ॥ ८०॥ इति वामनपुराणे षष्ठाध्यायान्तर्गतं हरिब्रह्मभ्यां कृतं शिवस्तोत्रं समाप्तम् । वामनपुराण । अध्याय
    ६
meaning: {}
