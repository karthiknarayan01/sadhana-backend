id: brahmanakritamvamanastotram
category: stotram
name:
  english: brahmanakritamvamanastotram
  devanagari: ब्रह्मणाकृतंवामनस्तोत्रम्
content:
  english: brahmana kritam vamanastotram brahmovaca | jayadhisha jayajeya jaya vishvaguro hare | janmamrityujaratita
    jayananta jayacyuta || 18|| jayajita jayashesha jayavyaktasthite jaya | paramarthartha sarvajna jnanajneyarthanihsrita
    || 19|| jayashesha jagatsakshinjagatkartarjagadguro | jagato'jagadantesha sthitau palayate jaya ||
    20|| jayakhila jayashesha jaya sarvahridisthita | jayadimadhyantamaya sarvajnanamayottama || 21||
    mumukshubhiranirdeshya nityahrishta jayeshvara | yogibhirmuktikamaistu damadigunabhushana || 22||
    jayatisukshma durjneya jaya sthula jaganmaya | jaya sukshmatisukshma tvam jayanindriya sendriya ||
    23|| jaya svamayayogastha sheshabhoga jayakshara | jayaikadamshtraprantena samuddhritavasundhara ||
    24|| nrikesarin surarativakshahsthalavidarana | sampratam jaya vishvatman mayavamana keshava || 25||
    nijamayaparicchinna jagaddhatarjanardana | jayacintya jayanekasvarupaikavidha prabho || 26|| varddhasva
    vardhitanekavikaraprakrite hare | tvayyesha jagatamishe samsthita dharmapaddhatih || 27|| na tvamaham
    na ceshano nendradyastridasha hare | jnatumisha na munayah sanakadya na yoginah || 28|| tvam mayapatasamvito
    jagatyatra jagatpate | kastvam vetsyati sarvesha tvatprasadam vina narah || 29|| tvamevaradhito yasya
    prasadasumukhah prabho | sa eva kevalam devam vetti tvam netaro janah || 30|| tadishvareshvareshana
    vibho varddhasva bhavana | prabhavayasya vishvasya vishvatman prithulocana || 31|| iti vamanapurane
    trimshattamadhyayantargatam brahmana kritam vamanastotram samaptam | vamanapurana | adhyaya 30
  devanagari: ब्रह्मणा कृतं वामनस्तोत्रम् ब्रह्मोवाच । जयाधीश जयाजेय जय विश्वगुरो हरे । जन्ममृत्युजरातीत
    जयानन्त जयाच्युत ॥ १८॥ जयाजित जयाशेष जयाव्यक्तस्थिते जय । परमार्थार्थ सर्वज्ञ ज्ञानज्ञेयार्थनिःसृत
    ॥ १९॥ जयाशेष जगत्साक्षिञ्जगत्कर्तर्जगद्गुरो । जगतोऽजगदन्तेश स्थितौ पालयते जय ॥ २०॥ जयाखिल जयाशेष जय
    सर्वहृदिस्थित । जयादिमध्यान्तमय सर्वज्ञानमयोत्तम ॥ २१॥ मुमुक्षुभिरनिर्देश्य नित्यहृष्ट जयेश्वर । योगिभिर्मुक्तिकामैस्तु
    दमादिगुणभूषण ॥ २२॥ जयातिसूक्ष्म दुर्ज्ञेय जय स्थूल जगन्मय । जय सूक्ष्मातिसूक्ष्म त्वं जयानिन्द्रिय
    सेन्द्रिय ॥ २३॥ जय स्वमायायोगस्थ शेषभोग जयाक्षर । जयैकदंष्ट्रप्रान्तेन समुद्धृतवसुन्धर ॥ २४॥ नृकेसरिन्
    सुरारातिवक्षःस्थलविदारण । साम्प्रतं जय विश्वात्मन् मायावामन केशव ॥ २५॥ निजमायापरिच्छिन्न जगद्धातर्जनार्दन
    । जयाचिन्त्य जयानेकस्वरूपैकविध प्रभो ॥ २६॥ वर्द्धस्व वर्धितानेकविकारप्रकृते हरे । त्वय्येषा जगतामीशे
    संस्थिता धर्मपद्धतिः ॥ २७॥ न त्वामहं न चेशानो नेन्द्राद्यास्त्रिदशा हरे । ज्ञातुमीशा न मुनयः सनकाद्या
    न योगिनः ॥ २८॥ त्वं मायापटसंवीतो जगत्यत्र जगत्पते । कस्त्वां वेत्स्यति सर्वेश त्वत्प्रसादं विना नरः
    ॥ २९॥ त्वमेवाराधितो यस्य प्रसादसुमुखः प्रभो । स एव केवलं देवं वेत्ति त्वां नेतरो जनः ॥ ३०॥ तदीश्वरेश्वरेशान
    विभो वर्द्धस्व भावन । प्रभवायास्य विश्वस्य विश्वात्मन् पृथुलोचन ॥ ३१॥ इति वामनपुराणे त्रिंशत्तमाध्यायान्तर्गतं
    ब्रह्मणा कृतं वामनस्तोत्रं समाप्तम् । वामनपुराण । अध्याय ३०
