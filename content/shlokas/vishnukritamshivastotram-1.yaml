id: vishnukritamshivastotram-1
category: stotram
name:
  english: vishnukritamshivastotram 1
  devanagari: विष्णुकृतंशिवस्तोत्रम् १
content:
  english: kadacitkincidva sphuratu kripaya cetasi tava sphuradrupam bhavyam bhavahara namo nadya shiva
    te || 539|| tvamindurbhanustvam hutabhugasi vayushca salilam tvamevakasho'si kshitirasi tathatmasi
    bhagavan | tatah sarvakarastvamasi bhavato bhinnamanu ca na tatsatyam satyam trinayana namo'nanta
    shiva te || 540|| vidhum dhattse nityam shirasi mridu kanthe'pi garalam navam naga hara bhasitamamalam
    bhasuratanau | kare shulam bhale jvalanamanisham tatkimiti te na tattvam jane'ham bhavahara namah
    kupya shiva te || 541|| tavapangasyando yadi bhavati bhavyah shubhakarah kadacitkasmimshcillaghutaranare'pi
    prabhavati | sa evaitallokan viracitumalpo'pi sa mahan kripadharayatto sukhakara namo'nanta shiva
    te || 542|| bhavantam devesham shivamitaragirvanasadrisham pramadadyah kashcidyadi vadati citte'pi
    manute | sa duhkham labdhva'nte narakamapi yati dhruvamidam dhruvam daivaradhyamitaguna namo'nanta
    shiva te || 543|| pradoshe ratnadhye mridulatarasihmasanavare bhavanimarudhamasakridapi samvikshya
    bhavata | kritam samyan natyam prathitamiti vedo'pi vadati prabhavah ko va'yam tava hara namo dipya
    shiva te || 544|| shmashane sancarastava kila na te kvapi gamanam yato vishvam vyapyakhilamapi sada
    tishthati bhavan | vibhum nityam shuddham shivamayamato vyapakamiti shrutih sakshadvakti svayamapi
    namah sudya shiva te || 545|| dhanurmeruh shesho'pyatha varaguno yanamavani
  devanagari: कदाचित्किञ्चिद्वा स्फुरतु कृपया चेतसि तव स्फुरद्रूपं भव्यं भवहर नमो नाद्य शिव ते ॥ ५३९॥
    त्वमिन्दुर्भानुस्त्वं हुतभुगसि वायुश्च सलिलं त्वमेवाकाशोऽसि क्षितिरसि तथात्मासि भगवन् । ततः सर्वाकारस्त्वमसि
    भवतो भिन्नमणु च न तत्सत्यं सत्यं त्रिणयन नमोऽनन्त शिव ते ॥ ५४०॥ विधुं धत्त्से नित्यं शिरसि मृदु कण्ठेऽपि
    गरलं नवं नागा हारा भसितममलं भासुरतनौ । करे शूलं भाले ज्वलनमनिशं तत्किमिति ते न तत्त्वं जानेऽहं भवहर
    नमः कूप्य शिव ते ॥ ५४१॥ तवापाङ्गस्यन्दो यदि भवति भव्यः शुभकरः कदाचित्कस्मिंश्चिल्लघुतरनरेऽपि प्रभवति
    । स एवैतल्लोकान् विरचितुमल्पोऽपि स महान् कृपाधारायत्तो सुखकर नमोऽनन्त शिव ते ॥ ५४२॥ भवन्तं देवेशं
    शिवमितरगीर्वाणसदृशं प्रमादाद्यः कश्चिद्यदि वदति चित्तेऽपि मनुते । स दुःखं लब्ध्वाऽन्ते नरकमपि याति
    ध्रुवमिदं ध्रुवं दैवाराध्यामितगुण नमोऽनन्त शिव ते ॥ ५४३॥ प्रदोषे रत्नाढ्ये मृदुलतरसिह्मासनवरे भवानीमारूढामसकृदपि
    संवीक्ष्य भवता । कृतं सम्यङ् नाट्यं प्रथितमिति वेदोऽपि वदति प्रभावः को वाऽयं तव हर नमो दीप्य शिव ते
    ॥ ५४४॥ श्मशाने सञ्चारस्तव किल न ते क्वापि गमनं यतो विश्वं व्याप्याखिलमपि सदा तिष्ठति भवान् । विभुं
    नित्यं शुद्धं शिवमयमतो व्यापकमिति श्रुतिः साक्षाद्वक्ति स्वयमपि नमः सूद्य शिव ते ॥ ५४५॥ धनुर्मेरुः
    शेषोऽप्यथ वरगुणो यानमवनि
