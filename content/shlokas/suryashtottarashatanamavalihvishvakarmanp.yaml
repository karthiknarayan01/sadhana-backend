id: suryashtottarashatanamavalihvishvakarmanp
category: stotram
name:
  english: suryashtottarashatanamavalihvishvakarmanP
  devanagari: सूर्याष्टोत्तरशतनामावलिःविश्वकर्मण्P
content:
  english: narasimhapurane suryashtottarashatanamavalih vishvakarmakrita om adityaya namah | savitre |
    suryaya | khagaya | pushne | gabhastimate | timironmathanaya | shambhave | tvashtre | martandaya |
    ashugaya | hiranyagarbhaya | kapilaya | tapanaya | bhaskaraya | ravaye | agnigarbhaya | aditeh putraya
    | shambhave | timiranashanaya namah | 20 om amshumate namah | amshumaline | tamoghnaya | tejasam nidhaye
    | atapine | mandaline | mrityave | kapilaya | sarvatapanaya | haraye | vishvaya | mahatejase | sarvaratnaprabhakaraya
    | amshumaline | timiraghne | rigyajussamabhavitaya | pranavishkaranaya | mitraya | supradipaya | manojavaya
    namah | 40 om yajneshaya namah | gopataye | shrimate | bhutajnaya | kleshanashanaya | amitraghne |
    shivaya | hamsaya | nayakaya | priyadarshanaya | shuddhaya | virocanaya | keshine | sahasramshave
    | pratardanaya | dharmarashmaye | patangaya | vishalaya | vishvasamstutaya | durvijneyagataye namah
    | 60 om shuraya namah | tejorashaye | mahayashase | bhrajishnave | jyotishamishaya | vishnave | jishnave
    | vishvabhavanaya | prabhavishnave | prakashatmane | jnanarashaye | prabhakaraya | adityaya | vishvadrishe
    | yajnakartre | netre | yashaskaraya | vimalaya | viryavate | ishaya namah | 80 om yogajnaya namah
    | yogabhavanaya | amritatmane | shivaya | nityaya | varenyaya | varadaya | prabhave | dhanadaya |
    pranadaya | shreshthaya | kamadaya | kamarupadhrike | taranaye | shashvataya | shastre | shastrajnaya
    | tapanaya | shayaya | vedagarbhaya namah | 100 om vibhave namah | viraya | shantaya | savitrivallabhaya
    | dhyeyaya | vishveshvaraya | bhartre | lokanathaya | maheshvaraya | mahendraya | varunaya | dhatre
    | vishnave | agnaye | divakaraya namah | 115 iti narasimhapurane suryashtottarashatanamavalih vishvakarmakrita
    samapta |
  devanagari: नरसिंहपुराणे सूर्याष्टोत्तरशतनामावलिः विश्वकर्मकृता ॐ आदित्याय नमः । सवित्रे । सूर्याय ।
    खगाय । पूष्णे । गभस्तिमते । तिमिरोन्मथनाय । शम्भवे । त्वष्ट्रे । मार्तण्डाय । आशुगाय । हिरण्यगर्भाय
    । कपिलाय । तपनाय । भास्कराय । रवये । अग्निगर्भाय । अदितेः पुत्राय । शम्भवे । तिमिरनाशनाय नमः । २०
    ॐ अंशुमते नमः । अंशुमालिने । तमोघ्नाय । तेजसां निधये । आतपिने । मण्डलिने । मृत्यवे । कपिलाय । सर्वतापनाय
    । हरये । विश्वाय । महातेजसे । सर्वरत्नप्रभाकराय । अंशुमालिने । तिमिरघ्ने । ऋग्यजुस्सामभाविताय । प्राणाविष्करणाय
    । मित्राय । सुप्रदीपाय । मनोजवाय नमः । ४० ॐ यज्ञेशाय नमः । गोपतये । श्रीमते । भूतज्ञाय । क्लेशनाशनाय
    । अमित्रघ्ने । शिवाय । हंसाय । नायकाय । प्रियदर्शनाय । शुद्धाय । विरोचनाय । केशिने । सहस्रांशवे ।
    प्रतर्दनाय । धर्मरश्मये । पतङ्गाय । विशालाय । विश्वसंस्तुताय । दुर्विज्ञेयगतये नमः । ६० ॐ शूराय नमः
    । तेजोराशये । महायशसे । भ्राजिष्णवे । ज्योतिषामीशाय । विष्णवे । जिष्णवे । विश्वभावनाय । प्रभविष्णवे
    । प्रकाशात्मने । ज्ञानराशये । प्रभाकराय । आदित्याय । विश्वदृशे । यज्ञकर्त्रे । नेत्रे । यशस्कराय ।
    विमलाय । वीर्यवते । ईशाय नमः । ८० ॐ योगज्ञाय नमः । योगभावनाय । अमृतात्मने । शिवाय । नित्याय । वरेण्याय
    । वरदाय । प्रभवे । धनदाय । प्राणदाय । श्रेष्ठाय । कामदाय । कामरूपधृके । तरणये । शाश्वताय । शास्त्रे
    । शास्त्रज्ञाय । तपनाय । शयाय । वेदगर्भाय नमः । १०० ॐ विभवे नमः । वीराय । शान्ताय । सावित्रीवल्लभाय
    । ध्येयाय । विश्वेश्वराय । भर्त्रे । लोकनाथाय । महेश्वराय । महेन्द्राय । वरुणाय । धात्रे । विष्णवे
    । अग्नये । दिवाकराय नमः । ११५ इति नरसिंहपुराणे सूर्याष्टोत्तरशतनामावलिः विश्वकर्मकृता समाप्ता ।
