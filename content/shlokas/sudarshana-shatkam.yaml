id: sudarshana-shatkam
category: stotram
name:
  english: Sudarshana Shatkam
  devanagari: सुदर्शनषट्कम् १
content:
  english: sarvakaryasiddhyarthe shrisudarshanashatkam || sahasradityasamkasham sahasravadanam prabhum
    | param sahasradam sahasraram prapadye'ham sudarshanam || 1|| hasamtam harakeyura mukutangada bhushanaih
    | shobhanairbhushitatanum prapadye'ham sudarshanam || 2|| srakara sahitam mamtram vadatam shatru nigraham
    | sarvaroga prashamanam prapadye'ham sudarshanam || 3|| ranatkinkini jalena rakshasaghnam mahatbhutam
    | vyaptakesham virupaksham prapadye'ham sudarshanam || 4|| hu~kara bhairavam bhimam pranatarti haram
    prabhum | sarvadushta prashamanam prapadye'ham sudarshanam || 5|| phatsharantamanirdeshyam divyamamtrena
    samyutam | shubham prasannavadanam prapadye'ham sudarshanam || 6|| etaishshadbhih stuto devah prasannah
    shrisudarshanah | raksham karotu sarvatma sarvatra vijayibhavet || 7||
  devanagari: सर्वकार्यसिद्ध्यर्थे श्रीसुदर्शनषट्कम् ॥ सहस्रादित्यसंकाशं सहस्रवदनं प्रभुम् । परम् सहस्रदं
    सहस्रारं प्रपद्येऽहं सुदर्शनम् ॥ १॥ हसंतम् हारकेयुर मुकुटाङ्गद भूषणैः । शोभनैर्भूषिततनुं प्रपद्येऽहं
    सुदर्शनम् ॥ २॥ स्राकार सहितं मंत्रं वदतां शत्रु निग्रहम् । सर्वरोग प्रशमनं प्रपद्येऽहं सुदर्शनम् ॥
    ३॥ रणत्किङ्किणि जालेन राक्षसघ्नं महात्भुतम् । व्याप्तकेशं विरूपाक्षं प्रपद्येऽहं सुदर्शनम् ॥ ४॥ हूँकार
    भैरवं भीमं प्रणतार्ति हरं प्रभुम् । सर्वदुष्ट प्रशमनं प्रपद्येऽहं सुदर्शनम् ॥ ५॥ फट्शारान्तमनिर्देश्यं
    दिव्यमंत्रेण संयुतम् । शुभं प्रसन्नवदनं प्रपद्येऽहं सुदर्शनम् ॥ ६॥ एतैष्षड्भिः स्तुतो देवः प्रसन्नः
    श्रीसुदर्शनः । रक्षां करोतु सर्वात्मा सर्वत्र विजयीभवेत् ॥ ७॥
