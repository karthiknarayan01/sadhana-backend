id: lalitha-ashtottara-sata-namaavali
category: stotram
name:
  english: Lalitha Ashtottara Sata Namaavali
content:
  english: dhyanashlokah sindhurarunavigraham trinayanam manikyamaulisphura ttaranayakashekharam smitamukhi
    mapinavakshoruham | panibhyamalipurnaratnacashakam raktotpalam bibhratim saumyam ratnaghatastharaktacaranam
    dhyayetparamambikam || om aim hrim shrim rajatacala shringagra madhyasthayai namonamah om aim hrim
