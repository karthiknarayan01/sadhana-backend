id: devi-mahatmyam-durga-saptasati-chapter-5
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 5
content:
  english: devya duta samvado nama pancamo dhyayah || asya shri uttaracaritrasya rudra rishih | shri mahasarasvati
    devata | anushtupchandhah |bhima shaktih | bhramari bijam | suryastatvam | samavedah | svarupam |
    shri mahasarasvatiprityarthe | uttaracaritrapathe viniyogah || dhyanam ghantashulahalani shankha musale
    cakram dhanuh sayakam hastabjairdhadatim ghanantavilasacchitamshutulyaprabham gauri deha samudbhavam
    trijagatam adharabhutam maha purvamatra sarasvati manubhaje shumbhadidaityardinim|| ||rishiruvaca||
    || || pura shumbhanishumbhabhyamasurabhyam shacipateh trailokyam yajnya bhagashca hrita madabalashrayat
    || || taveva suryatam tadvadadhikaram tathaindavam kauberamatha yamyam cakrante varunasya ca taveva
    pavanarddhi'm ca cakraturvahni karmaca tato deva vinirdhuta bhrashtarajyah parajitah || || hritadhikarastridashastabhyam
    sarve nirakrita| mahasurabhyam tam devim samsmarantyaparajitam || || tayasmakam varo datto yadhapatsu
    smritakhilah| bhavatam nashayishyami tatkshanatparamapadah || || itikritva matim deva himavantam nageshvaram|
    jagmustatra tato devim vishnumayam pratushtuvuh || || deva ucuh namo devyai mahadevyai shivayai satatam
    namah| namah prakrityai bhadrayai niyatah pranatah smatam || || raudraya namo nityayai gauryai dhatryai
    namo namah jyotsnayai cendurupinyai sukhayai satatam namah || || kalyanyai pranata vriddhyai siddhyai
    kurmo namo namah| nairrityai bhubhritam lakshmai sharvanyai te namo namah || || durgayai durgaparayai
    sarayai sarvakarinyai khyatyai tathaiva krishnayai dhumrayai satatam namah || || atisaumyatiraudrayai
    natastasyai namo namah namo jagatpratishthayai devyai krityai namo namah || || yadevi sarvabhuteshu
    vishnumayeti shabdhita| namastasyai yadevi sarvabhuteshu cetanetyabhidhiyate| namastasyai || yadevi
    sarvabhuteshu buddhirupena samsthita| namastasyai || yadevi sarvabhuteshu nidrarupena samsthita| namastasyai
    || yadevi sarvabhuteshu kshudharupena samsthita namastasyai || yadevi sarvabhuteshu chayarupena samsthita
    namastasyai || yadevi sarvabhuteshu shaktirupena samsthita namastasyai || yadevi sarvabhuteshu trishnarupena
    samsthita namastasyai || yadevi sarvabhuteshu kshantirupena samsthita namastasyai || yadevi sarvabhuteshu
    jatirupena samsthita namastasyai || yadevi sarvabhuteshu lajjarupena samsthita namastasyai || yadevi
    sarvabhuteshu shantirupena samsthita namastasyai || yadevi sarvabhuteshu shraddharupena samsthita
    namastasyai || yadevi sarvabhuteshu kantirupena samsthita namastasyai || yadevi sarvabhuteshu lakshmirupena
    samsthita namastasyai || yadevi sarvabhuteshu vrittirupena samsthita namastasyai || yadevi sarvabhuteshu
    smritirupena samsthita namastasyai || yadevi sarvabhuteshu dayarupena samsthita namastasyai || yadevi
    sarvabhuteshu tushtirupena samsthita namastasyai || yadevi sarvabhuteshu matrirupena samsthita namastasyai
    || yadevi sarvabhuteshu bhrantirupena samsthita namastasyai || indriyanamadhishthatri bhutanam cakhileshu
    ya| bhuteshu satatam tasyai vyapti devyai namo namah || || citirupena ya kritsnameta dvyapya sthita
    jagat namastasyai || stutasuraih purvamabhishta samshrayattatha surendrena dineshusevita| karotusa
    nah shubhaheturishvari shubhani bhadranya bhihantu capadah || || ya sampratam coddhatadaityatapitai
    rasmabhirishacasurairnamashyate| yaca smata tat kshana meva hanti nah sarva padobhaktivinamramurtibhih
    || || rishiruvaca|| evam stavabhi yuktanam devanam tatra parvati| snatumabhyayayau toye jahnavya nripanandana
    || || sabravittan suran subhrurbhavadbhih stuyate'tra ka sharirakoshatashcasyah samudbhuta' bravicchiva
    || || stotram mamaitatkriyate shumbhadaitya nirakritaih devaih sametaih samare nishumbhena parajitaih
    || || sharirakoshadyattasyah parvatya nihsritambika| kaushikiti samasteshu tato lokeshu giyate ||
    || tasyamvinirgatayam tu krishnabhutsapi parvati| kaliketi samakhyata himacalakritashraya || || tato'mbikam
    param rupam bibhranam sumanoharam | dadarsha cando mundashca bhrityau shumbhanishumbhayoh || || tabhyam
    shumbhaya cakhyata sativa sumanohara| kapyaste stri maharaja bhasa yanti himacalam || || naiva tadrik
    kvacidrupam drishtam kenaciduttamam| jnayatam kapyasau devi grihyatam casureshvara || || stri ratna
    maticarvanjgi dyotayantidishastvisha| satutishtati daityendra tam bhavan drashtu marhati || || yani
    ratnani manayo gajashvadini vai prabho| trai lokyetu samastani sampratam bhantite grihe || || airavatah
    samanito gajaratnam punardarat| parijata tarushcayam tathaivoccaih shrava hayah || || vimanam hamsasamyuktametattishthati
    te'ngane| ratnabhuta mihanitam yadasidvedhaso'dbhutam || || nidhiresha maha padmah samanito dhaneshvarat|
    kinjalkinim dadau cabdhirmalamamlanapajkajam || || chatram tevarunam gehe kancanasravi tishthati|
    tathayam syandanavaro yah purasitprajapateh || || mrityorutkrantida nama shaktirisha tvaya hrita|
    pashah salila rajasya bhratustava parigrahe || || nishumbhasyabdhijatashca samasta ratna jatayah|
    vahnishcapi dadau tubhya magnishauce ca vasasi || || evam daityendra ratnani samastanyahritani te
    strri ratna mesha kalyani tvaya kasmanna grihyate || || rishiruvaca| nishamyeti vacah shumbhah sa
    tada candamundayoh| preshayamasa sugrivam dutam devya mahasuram || || iti ceti ca vaktavya sa gatva
    vacananmama| yatha cabhyeti sampritya tatha karyam tvaya laghu || || satatra gatva yatraste shailoddoshe'tishobhane|
    sadevi tam tatah praha shlakshnam madhuraya gira || || duta uvaca|| devi daityeshvarah shumbhastrèlokye
    parameshvarah| duto'ham preshi tastena tvatsakashamihagatah || || avyahatajnah sarvasu yah sada devayonishu|
    nirjitakhila daityarih sa yadaha shrinushva tat || || mamatrailokya makhilam mamadeva vashanugah|
    yajnabhaganaham sarvanupashnami prithak prithak || || trailokyevararatnani mama vashyanyasheshatah|
    tathaiva gajaratnam ca hritam devendravahanam || || kshirodamathanodbhuta mashvaratnam mamamaraih|
    uccaihshravasasanjnam tatpranipatya samarpitam || || yanicanyani deveshu gandharveshurageshu ca |
    ratnabhutani bhutani tani mayyeva shobhane || || stri ratnabhutam tam devim loke manya mahe vayam|
    sa tvamasmanupagaccha yato ratnabhujo vayam || || mamva mamanujam vapi nishumbhamuruvikramam| bhajatvam
    cancalapajgi ratna bhutasi vai yatah || || paramaishvarya matulam prapsyase matparigrahat| etadbhudthya
    samalocya matparigrahatam vraja || || rishiruvaca|| ityukta sa tada devi gambhirantahsmita jagau|
    durga bhagavati bhadra yayedam dharyate jagat || || devyuvaca|| satya muktam tvaya natra mithyakincittvayoditam|
    trailokyadhipatih shumbho nishumbhashcapi tadrishah || || kim tvatra yatpratijnatam mithya tatkriyate
    katham| shruyatamalpabhuddhitvat tpratijna ya krita pura || || yomam jayati sajgrame yo me darpam
    vyapohati| yome pratibalo loke sa me bharta bhavishyati || || tadagacchatu shumbho'tra nishumbho va
    mahasurah| mam jitva kim cirenatra paningrihnatumelaghu || || duta uvaca|| avaliptasi maivam tvam
    devi bruhi mamagratah| trailokyekah pumamstishted agre shumbhanishumbhayoh || || anyeshamapi daityanam
    sarve deva na vai yudhi| kim tishthanti summukhe devi punah stri tvamekika || || indradyah sakala
    devastasthuryesham na samyuge| shumbhadinam katham tesham stri prayasyasi sammukham || || satvam gaccha
    mayaivokta parshvam shumbhanishumbhayoh| keshakarshana nirdhuta gaurava ma gamishyasi|| || devyuvaca|
    evametad bali shumbho nishumbhashcativiryavan| kim karomi pratijna me yadanalocitapura || || satvam
    gaccha mayoktam te yadetattsarva madritah| tadacakshva surendraya sa ca yuktam karotu yat || || ||
    iti shri markandeya purane savarnike manvantare devi mahatmye devya duta samvado nama pancamo dhyayah
    samaptam || ahuti klim jayanti sangayai sayudhayai sashaktikayai saparivarayai savahanayai dhumrakshyai
    vishnumayadi caturvimshad devatabhyo mahahutim samarpayami namah svaha ||
  devanagari: देव्या दूत संवादो नाम पञ्चमो ध्यायः ॥ अस्य श्री उत्तरचरित्रस्य रुद्र ऋषिः । श्री महासरस्वती
    देवता । अनुष्टुप्छन्धः ।भीमा शक्तिः । भ्रामरी बीजम् । सूर्यस्तत्वम् । सामवेदः । स्वरूपम् । श्री महासरस्वतिप्रीत्यर्थे
    । उत्तरचरित्रपाठे विनियोगः ॥ ध्यानं घण्टाशूलहलानि शङ्ख मुसले चक्रं धनुः सायकं हस्ताब्जैर्धदतीं घनान्तविलसच्छीतांशुतुल्यप्रभां
    गौरी देह समुद्भवां त्रिजगतां आधारभूतां महा पूर्वामत्र सरस्वती मनुभजे शुम्भादिदैत्यार्दिनीं॥ ॥ऋषिरुवाच॥
    ॥ ॥ पुरा शुम्भनिशुम्भाभ्यामसुराभ्यां शचीपतेः त्रैलोक्यं यज्ञ्य भागाश्च हृता मदबलाश्रयात् ॥ ॥ तावेव
    सूर्यतां तद्वदधिकारं तथैन्दवं कौबेरमथ याम्यं चक्रान्ते वरुणस्य च तावेव पवनर्द्धिऽं च चक्रतुर्वह्नि
    कर्मच ततो देवा विनिर्धूता भ्रष्टराज्याः पराजिताः ॥ ॥ हृताधिकारास्त्रिदशास्ताभ्यां सर्वे निराकृता।
    महासुराभ्यां तां देवीं संस्मरन्त्यपराजितां ॥ ॥ तयास्माकं वरो दत्तो यधापत्सु स्मृताखिलाः। भवतां नाशयिष्यामि
    तत्क्षणात्परमापदः ॥ ॥ इतिकृत्वा मतिं देवा हिमवन्तं नगेश्वरं। जग्मुस्तत्र ततो देवीं विष्णुमायां प्रतुष्टुवुः
    ॥ ॥ देवा ऊचुः नमो देव्यै महादेव्यै शिवायै सततं नमः। नमः प्रकृत्यै भद्रायै नियताः प्रणताः स्मतां ॥
    ॥ रौद्राय नमो नित्यायै गौर्यै धात्र्यै नमो नमः ज्योत्स्नायै चेन्दुरूपिण्यै सुखायै सततं नमः ॥ ॥ कल्याण्यै
    प्रणता वृद्ध्यै सिद्ध्यै कुर्मो नमो नमः। नैरृत्यै भूभृतां लक्ष्मै शर्वाण्यै ते नमो नमः ॥ ॥ दुर्गायै
    दुर्गपारायै सारायै सर्वकारिण्यै ख्यात्यै तथैव कृष्णायै धूम्रायै सततं नमः ॥ ॥ अतिसौम्यतिरौद्रायै नतास्तस्यै
    नमो नमः नमो जगत्प्रतिष्ठायै देव्यै कृत्यै नमो नमः ॥ ॥ यादेवी सर्वभूतेषू विष्णुमायेति शब्धिता। नमस्तस्यै
    यादेवी सर्वभूतेषू चेतनेत्यभिधीयते। नमस्तस्यै ॥ यादेवी सर्वभूतेषू बुद्धिरूपेण संस्थिता। नमस्तस्यै ॥
    यादेवी सर्वभूतेषू निद्रारूपेण संस्थिता। नमस्तस्यै ॥ यादेवी सर्वभूतेषू क्षुधारूपेण संस्थिता नमस्तस्यै
    ॥ यादेवी सर्वभूतेषू छायारूपेण संस्थिता नमस्तस्यै ॥ यादेवी सर्वभूतेषू शक्तिरूपेण संस्थिता नमस्तस्यै
    ॥ यादेवी सर्वभूतेषू तृष्णारूपेण संस्थिता नमस्तस्यै ॥ यादेवी सर्वभूतेषू क्षान्तिरूपेण संस्थिता नमस्तस्यै
    ॥ यादेवी सर्वभूतेषू जातिरूपेण संस्थिता नमस्तस्यै ॥ यादेवी सर्वभूतेषू लज्जारूपेण संस्थिता नमस्तस्यै
    ॥ यादेवी सर्वभूतेषू शान्तिरूपेण संस्थिता नमस्तस्यै ॥ यादेवी सर्वभूतेषू श्रद्धारूपेण संस्थिता नमस्तस्यै
    ॥ यादेवी सर्वभूतेषू कान्तिरूपेण संस्थिता नमस्तस्यै ॥ यादेवी सर्वभूतेषू लक्ष्मीरूपेण संस्थिता नमस्तस्यै
    ॥ यादेवी सर्वभूतेषू वृत्तिरूपेण संस्थिता नमस्तस्यै ॥ यादेवी सर्वभूतेषू स्मृतिरूपेण संस्थिता नमस्तस्यै
    ॥ यादेवी सर्वभूतेषू दयारूपेण संस्थिता नमस्तस्यै ॥ यादेवी सर्वभूतेषू तुष्टिरूपेण संस्थिता नमस्तस्यै
    ॥ यादेवी सर्वभूतेषू मातृरूपेण संस्थिता नमस्तस्यै ॥ यादेवी सर्वभूतेषू भ्रान्तिरूपेण संस्थिता नमस्तस्यै
    ॥ इन्द्रियाणामधिष्ठात्री भूतानां चाखिलेषु या। भूतेषु सततं तस्यै व्याप्ति देव्यै नमो नमः ॥ ॥ चितिरूपेण
    या कृत्स्नमेत द्व्याप्य स्थिता जगत् नमस्तस्यै ॥ स्तुतासुरैः पूर्वमभीष्ट संश्रयात्तथा सुरेन्द्रेण दिनेषुसेविता।
    करोतुसा नः शुभहेतुरीश्वरी शुभानि भद्राण्य भिहन्तु चापदः ॥ ॥ या साम्प्रतं चोद्धतदैत्यतापितै रस्माभिरीशाचसुरैर्नमश्यते।
    याच स्मता तत् क्षण मेव हन्ति नः सर्वा पदोभक्तिविनम्रमूर्तिभिः ॥ ॥ ऋषिरुवाच॥ एवं स्तवाभि युक्तानां
    देवानां तत्र पार्वती। स्नातुमभ्याययौ तोये जाह्नव्या नृपनन्दन ॥ ॥ साब्रवीत्तान् सुरान् सुभ्रूर्भवद्भिः
    स्तूयतेऽत्र का शरीरकोशतश्चास्याः समुद्भूताऽ ब्रवीच्छिवा ॥ ॥ स्तोत्रं ममैतत्क्रियते शुम्भदैत्य निराकृतैः
    देवैः समेतैः समरे निशुम्भेन पराजितैः ॥ ॥ शरीरकोशाद्यत्तस्याः पार्वत्या निःसृताम्बिका। कौशिकीति समस्तेषु
    ततो लोकेषु गीयते ॥ ॥ तस्यांविनिर्गतायां तु कृष्णाभूत्सापि पार्वती। कालिकेति समाख्याता हिमाचलकृताश्रया
    ॥ ॥ ततोऽम्बिकां परं रूपं बिभ्राणां सुमनोहरम् । ददर्श चण्दो मुण्दश्च भृत्यौ शुम्भनिशुम्भयोः ॥ ॥ ताभ्यां
    शुम्भाय चाख्याता सातीव सुमनोहरा। काप्यास्ते स्त्री महाराज भास यन्ती हिमाचलम् ॥ ॥ नैव तादृक् क्वचिद्रूपं
    दृष्टं केनचिदुत्तमम्। ज्ञायतां काप्यसौ देवी गृह्यतां चासुरेश्वर ॥ ॥ स्त्री रत्न मतिचार्वञ्ज्गी द्योतयन्तीदिशस्त्विषा।
    सातुतिष्टति दैत्येन्द्र तां भवान् द्रष्टु मर्हति ॥ ॥ यानि रत्नानि मणयो गजाश्वादीनि वै प्रभो। त्रै
    लोक्येतु समस्तानि साम्प्रतं भान्तिते गृहे ॥ ॥ ऐरावतः समानीतो गजरत्नं पुनर्दरात्। पारिजात तरुश्चायं
    तथैवोच्चैः श्रवा हयः ॥ ॥ विमानं हंससंयुक्तमेतत्तिष्ठति तेऽङ्गणे। रत्नभूत मिहानीतं यदासीद्वेधसोऽद्भुतं
    ॥ ॥ निधिरेष महा पद्मः समानीतो धनेश्वरात्। किञ्जल्किनीं ददौ चाब्धिर्मालामम्लानपज्कजां ॥ ॥ छत्रं तेवारुणं
    गेहे काञ्चनस्रावि तिष्ठति। तथायं स्यन्दनवरो यः पुरासीत्प्रजापतेः ॥ ॥ मृत्योरुत्क्रान्तिदा नाम शक्तिरीश
    त्वया हृता। पाशः सलिल राजस्य भ्रातुस्तव परिग्रहे ॥ ॥ निशुम्भस्याब्धिजाताश्च समस्ता रत्न जातयः। वह्निश्चापि
    ददौ तुभ्य मग्निशौचे च वाससी ॥ ॥ एवं दैत्येन्द्र रत्नानि समस्तान्याहृतानि ते स्त्र्री रत्न मेषा कल्याणी
    त्वया कस्मान्न गृह्यते ॥ ॥ ऋषिरुवाच। निशम्येति वचः शुम्भः स तदा चण्डमुण्डयोः। प्रेषयामास सुग्रीवं
    दूतं देव्या महासुरं ॥ ॥ इति चेति च वक्तव्या सा गत्वा वचनान्मम। यथा चाभ्येति सम्प्रीत्या तथा कार्यं
    त्वया लघु ॥ ॥ सतत्र गत्वा यत्रास्ते शैलोद्दोशेऽतिशोभने। सादेवी तां ततः प्राह श्लक्ष्णं मधुरया गिरा
    ॥ ॥ दूत उवाच॥ देवि दैत्येश्वरः शुम्भस्त्रॆलोक्ये परमेश्वरः। दूतोऽहं प्रेषि तस्तेन त्वत्सकाशमिहागतः
    ॥ ॥ अव्याहताज्ञः सर्वासु यः सदा देवयोनिषु। निर्जिताखिल दैत्यारिः स यदाह शृणुष्व तत् ॥ ॥ ममत्रैलोक्य
    मखिलं ममदेवा वशानुगाः। यज्ञभागानहं सर्वानुपाश्नामि पृथक् पृथक् ॥ ॥ त्रैलोक्येवररत्नानि मम वश्यान्यशेषतः।
    तथैव गजरत्नं च हृतं देवेन्द्रवाहनं ॥ ॥ क्षीरोदमथनोद्भूत मश्वरत्नं ममामरैः। उच्चैःश्रवससञ्ज्ञं तत्प्रणिपत्य
    समर्पितं ॥ ॥ यानिचान्यानि देवेषु गन्धर्वेषूरगेषु च । रत्नभूतानि भूतानि तानि मय्येव शोभने ॥ ॥ स्त्री
    रत्नभूतां तां देवीं लोके मन्या महे वयं। सा त्वमस्मानुपागच्छ यतो रत्नभुजो वयं ॥ ॥ मांवा ममानुजं वापि
    निशुम्भमुरुविक्रमम्। भजत्वं चञ्चलापाज्गि रत्न भूतासि वै यतः ॥ ॥ परमैश्वर्य मतुलं प्राप्स्यसे मत्परिग्रहात्।
    एतद्भुद्थ्या समालोच्य मत्परिग्रहतां व्रज ॥ ॥ ऋषिरुवाच॥ इत्युक्ता सा तदा देवी गम्भीरान्तःस्मिता जगौ।
    दुर्गा भगवती भद्रा ययेदं धार्यते जगत् ॥ ॥ देव्युवाच॥ सत्य मुक्तं त्वया नात्र मिथ्याकिञ्चित्त्वयोदितम्।
    त्रैलोक्याधिपतिः शुम्भो निशुम्भश्चापि तादृशः ॥ ॥ किं त्वत्र यत्प्रतिज्ञातं मिथ्या तत्क्रियते कथम्।
    श्रूयतामल्पभुद्धित्वात् त्प्रतिज्ञा या कृता पुरा ॥ ॥ योमां जयति सज्ग्रामे यो मे दर्पं व्यपोहति। योमे
    प्रतिबलो लोके स मे भर्ता भविष्यति ॥ ॥ तदागच्छतु शुम्भोऽत्र निशुम्भो वा महासुरः। मां जित्वा किं चिरेणात्र
    पाणिङ्गृह्णातुमेलघु ॥ ॥ दूत उवाच॥ अवलिप्तासि मैवं त्वं देवि ब्रूहि ममाग्रतः। त्रैलोक्येकः पुमांस्तिष्टेद्
    अग्रे शुम्भनिशुम्भयोः ॥ ॥ अन्येषामपि दैत्यानां सर्वे देवा न वै युधि। किं तिष्ठन्ति सुम्मुखे देवि पुनः
    स्त्री त्वमेकिका ॥ ॥ इन्द्राद्याः सकला देवास्तस्थुर्येषां न संयुगे। शुम्भादीनां कथं तेषां स्त्री प्रयास्यसि
    सम्मुखम् ॥ ॥ सात्वं गच्छ मयैवोक्ता पार्श्वं शुम्भनिशुम्भयोः। केशाकर्षण निर्धूत गौरवा मा गमिष्यसि॥
    ॥ देव्युवाच। एवमेतद् बली शुम्भो निशुम्भश्चातिवीर्यवान्। किं करोमि प्रतिज्ञा मे यदनालोचितापुरा ॥ ॥
    सत्वं गच्छ मयोक्तं ते यदेतत्त्सर्व मादृतः। तदाचक्ष्वा सुरेन्द्राय स च युक्तं करोतु यत् ॥ ॥ ॥ इति श्री
    मार्कण्डेय पुराणे सावर्निके मन्वन्तरे देवि महत्म्ये देव्या दूत संवादो नाम पञ्चमो ध्यायः समाप्तम् ॥
    आहुति क्लीं जयन्ती साङ्गायै सायुधायै सशक्तिकायै सपरिवारायै सवाहनायै धूम्राक्ष्यै विष्णुमायादि चतुर्विंशद्
    देवताभ्यो महाहुतिं समर्पयामि नमः स्वाहा ॥
