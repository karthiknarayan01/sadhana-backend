id: annapurna
category: stotram
name:
  english: annapurna
  devanagari: अन्नपुर्न
content:
  english: praleyacalavamshapavanakari kashipuradhishvari bhiksham dehi kripavalambanakari mata'nnapurneshvari
    || 1|| nanaratnavicitrabhushanakari hemambaradambari muktaharavilambamana vilasat vakshojakumbhantari
    | kashmiragaruvasita rucikari kashipuradhishvari bhiksham dehi kripavalambanakari mata'nnapurneshvari
    || 2|| yoganandakari ripukshayakari dharmarthanishthakari candrarkanalabhasamanalahari trailokyarakshakari
    | sarvaishvaryasamastavanchitakari kashipuradhishvari bhiksham dehi kripavalambanakari mata'nnapurneshvari
    || 3|| kailasacalakandaralayakari gauri uma shankari kaumari nigamarthagocarakari onkarabijakshari
    | mokshadvarakapatapatanakari kashipuradhishvari bhiksham dehi kripavalambanakari mata'nnapurneshvari
    || 4|| drishyadrishya vibhutivahanakari brahmandabhandodari lilanatakasutrabhedanakari vijnanadipankuri
    | shrivishveshamanah prasadanakari kashipuradhishvari bhiksham dehi kripavalambanakari mata'nnapurneshvari
    || 5|| urvi sarvajaneshvari bhagavati mata'nnapurneshvari veninilasamanakuntaladhari nityannadaneshvari
    | sarvanandakari sadashubhakari kashipuradhishvari bhiksham dehi kripavalambanakari mata'nnapurneshvari
    || 6|| adikshantasamastavarnanakari shambhostribhavakari kashmira trijaleshvari trilahari nityankura
    sharvari | kamakankshakari janodayakari kashipuradhishvari bhiksham dehi kripavalambanakari mata'nnapurneshvari
    || 7|| devi sarvavicitraratnaracita dakshayani sundari vame svadupayodhara priyakari saubhagya maheshvari
    | bhaktabhishtakari sadashubhakari kashipuradhishvari bhiksham dehi kripavalambanakari mata'nnapurneshvari
    || 8|| candrarkanalakotikotisadrisha candramshubimbadhari candrarkagnisamanakundaladhari candrarkavarneshvari
    | malapustakapashasankushadhari kashipuradhishvari bhiksham dehi kripavalambanakari mata'nnapurneshvari
    || 9|| kshatratranakari maha'bhayakari mata kripasagari sakshanmokshakari sada shivakari vishveshvari
    shridhari | dakshakrandakari niramayakari kashipuradhishvari bhiksham dehi kripavalambanakari mata'nnapurneshvari
    || 10|| annapurne sadapurne shankarapranavallabhe | jnanavairagyasiddhyartham bhiksham dehi ca parvati
    || 11|| mata me parvati devi pita devo maheshvarah | bandhavah shivabhaktashca svadesho bhuvanatrayam
    || 12|| || iti shrishankarabhagavatah kritau annapurnastotram sampurnam ||
  devanagari: प्रालेयाचलवंशपावनकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी माताऽन्नपूर्णेश्वरी ॥ १॥
    नानारत्नविचित्रभूषणकरी हेमाम्बराडम्बरी मुक्ताहारविलम्बमान विलसत् वक्षोजकुम्भान्तरी । काश्मीरागरुवासिता
    रुचिकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी माताऽन्नपूर्णेश्वरी ॥ २॥ योगानन्दकरी रिपुक्षयकरी
    धर्मार्थनिष्ठाकरी चन्द्रार्कानलभासमानलहरी त्रैलोक्यरक्षाकरी । सर्वैश्वर्यसमस्तवाञ्छितकरी काशीपुराधीश्वरी
    भिक्षां देहि कृपावलम्बनकरी माताऽन्नपूर्णेश्वरी ॥ ३॥ कैलासाचलकन्दरालयकरी गौरी उमा शङ्करी कौमारी निगमार्थगोचरकरी
    ओङ्कारबीजाक्षरी । मोक्षद्वारकपाटपाटनकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी माताऽन्नपूर्णेश्वरी
    ॥ ४॥ दृश्यादृश्य विभूतिवाहनकरी ब्रह्माण्डभाण्डोदरी लीलानाटकसूत्रभेदनकरी विज्ञानदीपाङ्कुरी । श्रीविश्वेशमनः
    प्रसादनकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी माताऽन्नपूर्णेश्वरी ॥ ५॥ उर्वी सर्वजनेश्वरी
    भगवती माताऽन्नपूर्णेश्वरी वेणीनीलसमानकुन्तलधरी नित्यान्नदानेश्वरी । सर्वानन्दकरी सदाशुभकरी काशीपुराधीश्वरी
    भिक्षां देहि कृपावलम्बनकरी माताऽन्नपूर्णेश्वरी ॥ ६॥ आदिक्षान्तसमस्तवर्णनकरी शम्भोस्त्रिभावाकरी काश्मीरा
    त्रिजलेश्वरी त्रिलहरी नित्याङ्कुरा शर्वरी । कामाकाङ्क्षकरी जनोदयकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी
    माताऽन्नपूर्णेश्वरी ॥ ७॥ देवी सर्वविचित्ररत्नरचिता दाक्षायणी सुन्दरी वामे स्वादुपयोधरा प्रियकरी सौभाग्य
    माहेश्वरी । भक्ताभीष्टकरी सदाशुभकरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी माताऽन्नपूर्णेश्वरी
    ॥ ८॥ चन्द्रार्कानलकोटिकोटिसदृशा चन्द्रांशुबिम्बाधरी चन्द्रार्काग्निसमानकुण्डलधरी चन्द्रार्कवर्णेश्वरी
    । मालापुस्तकपाशसाङ्कुशधरी काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी माताऽन्नपूर्णेश्वरी ॥ ९॥ क्षत्रत्राणकरी
    महाऽभयकरी माता कृपासागरी साक्षान्मोक्षकरी सदा शिवकरी विश्वेश्वरी श्रीधरी । दक्षाक्रन्दकरी निरामयकरी
    काशीपुराधीश्वरी भिक्षां देहि कृपावलम्बनकरी माताऽन्नपूर्णेश्वरी ॥ १०॥ अन्नपूर्णे सदापूर्णे शङ्करप्राणवल्लभे
    । ज्ञानवैराग्यसिद्ध्यर्थं भिक्षां देहि च पार्वति ॥ ११॥ माता मे पार्वती देवी पिता देवो महेश्वरः । बान्धवाः
    शिवभक्ताश्च स्वदेशो भुवनत्रयम् ॥ १२॥ ॥ इति श्रीशङ्करभगवतः कृतौ अन्नपूर्णास्तोत्रं सम्पूर्णम् ॥
