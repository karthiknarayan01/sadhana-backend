id: gitashtottaramtejomayananda
category: stotram
name:
  english: gitashtottaramtejomayananda
  devanagari: गीताष्टोत्तरम्टेजोमयनन्द
content:
  english: shrimadbhagavadgitashtottaram om shrimadbhagavadgitayai namah | om shrikrishnamritavanyai namah
    | om parthaya pratibodhitayai namah | om vyasena grathitayai namah | om sanjayavarnitayai namah |
    om mahabharatamadhyasthitayai namah | om kurukshetre upadishtayai namah | om bhagavatyai namah | om
    ambarupayai namah | om advaitamritavarshinyai namah | 10| om bhavadveshinyai namah | om ashtadashadhyayyai
    namah | om sarvopanishatsarayai namah | om brahmavidyayai namah | om yogashastrarupayai namah | om
    shrikrishnarjunasamvadarupayai namah | om shrikrishnahridayayai namah | om sundaryai namah | om madhurayai
    namah | om punitayai namah | 20| om karmamarmaprakashinyai namah | om kamasaktiharayai namah | om
    tattvajnanaprakashinyai namah | om nishcalabhaktividhayinyai namah | om nirmalayai namah | om kalimalaharinyai
    namah | om ragadveshavidarinyai namah | om modakarinyai namah | om bhavabhayaharinyai namah | om tarinyai
    namah | 30| om paramanandapradayai namah | om ajnananashinyai namah | om asurabhavavinashinyai namah
    | om daivisampatpradayai namah | om haribhaktapriyayai namah | om sarvashastrasvaminyai namah | om
    dayasudhavarshinyai namah | om haripadapremapradayinyai namah | om shripradayai namah | om vijayapradayai
    namah | 40| om bhutidayai namah | om nitidayai namah | om sanatanyai namah | om sarvadharmasvarupinyai
    namah | om samastasiddhidayai namah | om sanmargadarshikayai namah | om trilokipujyayai namah | om
    arjunavishadaharinyai namah | om prasadapradayai namah | om nityatmasvarupadarshikayai namah | 50|
    om anityadehasamsararupadarshikayai namah | om punarjanmarahasyaprakatikayai namah | om svadharmaprabodhinyai
    namah | om sthitaprajnalakshanadarshikayai namah | om karmayogaprakashikayai namah | om yajnabhavanaprakashinyai
    namah | om vividhayajnapradarshikayai namah | om cittashuddhidayai namah | om kamanashopayabodhikayai
    namah | om avataratattvavicarinyai namah | 60| om jnanapraptisadhanopadeshikayai namah | om dhyanayogabodhinyai
    namah | om manonigrahamargapradipikayai namah | om sarvavidhasadhakahitakarinyai namah | om jnanavijnanaprakashikayai
    namah | om paraparaprakritibodhikayai namah | om srishtirahasyaprakatikayai namah | om caturvidhabhaktalakshanadarshikayai
    namah | om bhuktimuktidayai namah | om jivajagadishvarasvarupabodhikayai namah | 70| om pranavadhyanopadeshikayai
    namah | om karmopasanaphaladarshikayai namah | om rajavidyayai namah | om rajaguhyayai namah | om
    pratyakshavagamayai namah | om dharmyayai namah | om sulabhayai namah | om yogakshemakarinyai namah
    | om bhagavadvibhutivistarikayai namah | om vishvarupadarshanayogayuktayai namah | 80| om bhagavadaishvaryapradarshikayai
    namah | om bhaktidayai namah | om bhaktivivardhinyai namah | om bhaktalakshanabodhikayai namah | om
    sagunanirgunaprakashinyai namah | om kshetrakshetrajnavivekakarinyai namah | om dridhavairagyakarinyai
    namah | om gunatrayavibhagadarshikayai namah | om gunatitapurushalakshanadarshikayai namah | om ashvatthavrikshavarnanakarinyai
    namah | 90| om samsaravrikshacchedanopayabodhinyai namah | om trividhashraddhasvarupaprakashikayai
    namah | om tyagasamnyasatattvadarshikayai namah93| om yajnadanatapahsvarupabodhinyai namah | om jnanakarmakartrisvarupabodhikayai
    namah | om sharanagatirahasyapradarshikayai namah | om ashcaryarupayai namah | om vismayakarinyai
    namah | om ahladakarinyai namah | om bhaktihinajanagamyayai namah | 100| om jagata uddharinyai namah
    | om divyadrishtipradayai namah | om dharmasamsthapikayai namah | om bhaktajanasevyayai namah | om
    sarvadevastutayai namah | om jnanagangayai namah | om shrikrishnapriyatamayai namah | om sarvamangalayai
    namah | 108| || iti svamitejomayanandaracita shrimadbhagavadgitashtottarashatanamavali ||
  devanagari: श्रीमद्भगवद्गीताष्टोत्तरम् ॐ श्रीमद्भगवद्गीतायै नमः । ॐ श्रीकृष्णामृतवाण्यै नमः । ॐ पार्थाय
    प्रतिबोधितायै नमः । ॐ व्यासेन ग्रथितायै नमः । ॐ सञ्जयवर्णितायै नमः । ॐ महाभारतमध्यस्थितायै नमः । ॐ
    कुरुक्षेत्रे उपदिष्टायै नमः । ॐ भगवत्यै नमः । ॐ अम्बारूपायै नमः । ॐ अद्वैतामृतवर्षिण्यै नमः । १०।
    ॐ भवद्वेषिण्यै नमः । ॐ अष्टादशाध्याय्यै नमः । ॐ सर्वोपनिषत्सारायै नमः । ॐ ब्रह्मविद्यायै नमः । ॐ योगशास्त्ररूपायै
    नमः । ॐ श्रीकृष्णार्जुनसंवादरूपायै नमः । ॐ श्रीकृष्णहृदयायै नमः । ॐ सुन्दर्यै नमः । ॐ मधुरायै नमः
    । ॐ पुनीतायै नमः । २०। ॐ कर्ममर्मप्रकाशिन्यै नमः । ॐ कामासक्तिहरायै नमः । ॐ तत्त्वज्ञानप्रकाशिन्यै
    नमः । ॐ निश्चलभक्तिविधायिन्यै नमः । ॐ निर्मलायै नमः । ॐ कलिमलहारिण्यै नमः । ॐ रागद्वेषविदारिण्यै नमः
    । ॐ मोदकारिण्यै नमः । ॐ भवभयहारिण्यै नमः । ॐ तारिण्यै नमः । ३०। ॐ परमानन्दप्रदायै नमः । ॐ अज्ञाननाशिन्यै
    नमः । ॐ आसुरभावविनाशिन्यै नमः । ॐ दैवीसम्पत्प्रदायै नमः । ॐ हरिभक्तप्रियायै नमः । ॐ सर्वशास्त्रस्वामिन्यै
    नमः । ॐ दयासुधावर्षिण्यै नमः । ॐ हरिपदप्रेमप्रदायिन्यै नमः । ॐ श्रीप्रदायै नमः । ॐ विजयप्रदायै नमः
    । ४०। ॐ भूतिदायै नमः । ॐ नीतिदायै नमः । ॐ सनातन्यै नमः । ॐ सर्वधर्मस्वरूपिण्यै नमः । ॐ समस्तसिद्धिदायै
    नमः । ॐ सन्मार्गदर्शिकायै नमः । ॐ त्रिलोकीपूज्यायै नमः । ॐ अर्जुनविषादहारिण्यै नमः । ॐ प्रसादप्रदायै
    नमः । ॐ नित्यात्मस्वरूपदर्शिकायै नमः । ५०। ॐ अनित्यदेहसंसाररूपदर्शिकायै नमः । ॐ पुनर्जन्मरहस्यप्रकटिकायै
    नमः । ॐ स्वधर्मप्रबोधिन्यै नमः । ॐ स्थितप्रज्ञलक्षणदर्शिकायै नमः । ॐ कर्मयोगप्रकाशिकायै नमः । ॐ यज्ञभावनाप्रकाशिन्यै
    नमः । ॐ विविधयज्ञप्रदर्शिकायै नमः । ॐ चित्तशुद्धिदायै नमः । ॐ कामनाशोपायबोधिकायै नमः । ॐ अवतारतत्त्वविचारिण्यै
    नमः । ६०। ॐ ज्ञानप्राप्तिसाधनोपदेशिकायै नमः । ॐ ध्यानयोगबोधिन्यै नमः । ॐ मनोनिग्रहमार्गप्रदीपिकायै
    नमः । ॐ सर्वविधसाधकहितकारिण्यै नमः । ॐ ज्ञानविज्ञानप्रकाशिकायै नमः । ॐ परापरप्रकृतिबोधिकायै नमः ।
    ॐ सृष्टिरहस्यप्रकटिकायै नमः । ॐ चतुर्विधभक्तलक्षणदर्शिकायै नमः । ॐ भुक्तिमुक्तिदायै नमः । ॐ जीवजगदीश्वरस्वरूपबोधिकायै
    नमः । ७०। ॐ प्रणवध्यानोपदेशिकायै नमः । ॐ कर्मोपासनफलदर्शिकायै नमः । ॐ राजविद्यायै नमः । ॐ राजगुह्यायै
    नमः । ॐ प्रत्यक्षावगमायै नमः । ॐ धर्म्यायै नमः । ॐ सुलभायै नमः । ॐ योगक्षेमकारिण्यै नमः । ॐ भगवद्विभूतिविस्तारिकायै
    नमः । ॐ विश्वरूपदर्शनयोगयुक्तायै नमः । ८०। ॐ भगवदैश्वर्यप्रदर्शिकायै नमः । ॐ भक्तिदायै नमः । ॐ भक्तिविवर्धिन्यै
    नमः । ॐ भक्तलक्षणबोधिकायै नमः । ॐ सगुणनिर्गुणप्रकाशिन्यै नमः । ॐ क्षेत्रक्षेत्रज्ञविवेककारिण्यै नमः
    । ॐ दृढवैराग्यकारिण्यै नमः । ॐ गुणत्रयविभागदर्शिकायै नमः । ॐ गुणातीतपुरुषलक्षणदर्शिकायै नमः । ॐ अश्वत्थवृक्षवर्णनकारिण्यै
    नमः । ९०। ॐ संसारवृक्षच्छेदनोपायबोधिन्यै नमः । ॐ त्रिविधश्रद्धास्वरूपप्रकाशिकायै नमः । ॐ त्यागसंन्यासतत्त्वदर्शिकायै
    नमः९३। ॐ यज्ञदानतपःस्वरूपबोधिन्यै नमः । ॐ ज्ञानकर्मकर्तृस्वरूपबोधिकायै नमः । ॐ शरणागतिरहस्यप्रदर्शिकायै
    नमः । ॐ आश्चर्यरूपायै नमः । ॐ विस्मयकारिण्यै नमः । ॐ आह्लादकारिण्यै नमः । ॐ भक्तिहीनजनागम्यायै नमः
    । १००। ॐ जगत उद्धारिण्यै नमः । ॐ दिव्यदृष्टिप्रदायै नमः । ॐ धर्मसंस्थापिकायै नमः । ॐ भक्तजनसेव्यायै
    नमः । ॐ सर्वदेवस्तुतायै नमः । ॐ ज्ञानगङ्गायै नमः । ॐ श्रीकृष्णप्रियतमायै नमः । ॐ सर्वमङ्गलायै नमः
    । १०८। ॥ इति स्वामीतेजोमयानन्दरचिता श्रीमद्भगवद्गीताष्टोत्तरशतनामावली ॥
