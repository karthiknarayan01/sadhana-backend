id: annamayya-keerthanas-andariki-aadhaaramaina
category: stotram
name:
  english: Annamayya Keerthanas Andariki Aadhaaramaina
content:
  english: andarikadharamaina adi purushuditadu vindai munnaragincè vidurunikada nitudu || sanakadulu
    kòniyadèdi sarvatmakuditadu vanaja bhavadulakunu daivambai nataditadu | inamandalamuna jèlagetihitavai
    bhavuditadu munuputtina devatalaku mulabhuti yitadu || sirulòsagi yashodayinta shishuvainata ditadu
    dharanavula mandalalo taga jarincè nitadu | sarasatalanu gòllètalaku janavulòsagè nitadu arasi kuceluni
    yadukulu aragincènitadu || pankajabhavunakunu brahma pada mòsagènu yitudu sankirtana ladyulace jatti
    gòniyènitadu | tènkiga nekalamu paradevudaina yitadu venkatagiri mida prabhala vèlasina ghanuditadu
    ||
  devanagari: अन्दरिकाधारमैन आदि पुरुषुडीतडु विन्दै मुन्नारगिञ्चॆ विदुरुनिकड नीतुडु ॥ सनकादुलु कॊनियाडॆडि
    सर्वात्मकुडीतडु वनज भवादुलकुनु दैवम्बै नतडीतडु । इनमण्डलमुन जॆलगेटिहितवै भवुडितडु मुनुपुट्टिन देवतलकु
    मूलभूति यीतडु ॥ सिरुलॊसगि यशोदयिण्ट शिशुवैनत डीतडु धरनावुल मन्दललो तग जरिञ्चॆ नीतडु । सरसतलनु गॊल्लॆतलकु
    जनवुलॊसगॆ नीतडु आरसि कुचेलुनि यडुकुलु आरगिञ्चॆनीतडु ॥ पङ्कजभवुनकुनु ब्रह्म पद मॊसगॆनु यीतुडु सङ्कीर्तन
    लाद्युलचे जट्टि गॊनियॆनीतडु । तॆङ्किग नेकालमु परदेवुडैन यीतडु वेङ्कटगिरि मीद प्रभल वॆलसिन घनुडीतडु
    ॥
