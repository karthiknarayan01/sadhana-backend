id: bilvamahimastotram
category: stotram
name:
  english: bilvamahimastotram
  devanagari: बिल्वमहिमास्तोत्रम्
content:
  english: bilvamahimastotram vanyuvaca | ayam bilvataruh shreshthah pavitrah papanashanah | tasya mule
    sthita devi girija natra samshayah || 14|| skandhe dakshayani devi shakhasu ca maheshvari | patreshu
    parvati devi phale katyayani smrita || 15|| tvaci gauri samakhyata aparna madhyavalkale | pushpe durga
    samakhyata uma shakhangakeshu ca || 16|| kantakeshu ca sarveshu kotayo navasankhyaya | shaktayah pranirakshartham
    samsthita girija''jnaya || 17|| tam bhajanti supatraishca pujayanti sanatanim | yamyam kamayate kamam
    tasya siddhirbhaveddhruvam || 18|| iti shriskandapurane nagarakhande pancashattmadhikadvishatatamadhyayantargatam
    vilvamahimastotram samaptam | skandapurana | nagarakhanda | adhyaya 250
  devanagari: बिल्वमहिमास्तोत्रम् वाण्युवाच । अयं बिल्वतरुः श्रेष्ठः पवित्रः पापनाशनः । तस्य मूले स्थिता
    देवी गिरिजा नात्र संशयः ॥ १४॥ स्कन्धे दाक्षायणी देवी शाखासु च महेश्वरी । पत्रेषु पार्वती देवी फले
    कात्यायनी स्मृता ॥ १५॥ त्वचि गौरी समाख्याता अपर्णा मध्यवल्कले । पुष्पे दुर्गा समाख्याता उमा शाखाङ्गकेषु
    च ॥ १६॥ कण्टकेषु च सर्वेषु कोटयो नवसङ्ख्यया । शक्तयः प्राणिरक्षार्थं संस्थिता गिरिजाऽऽज्ञया ॥ १७॥
    तां भजन्ति सुपत्रैश्च पूजयन्ति सनातनीम् । यंयं कामयते कामं तस्य सिद्धिर्भवेद्ध्रुवम् ॥ १८॥ इति श्रीस्कन्दपुराणे
    नागरखण्डे पञ्चाशत्त्माधिकद्विशततमाध्यायान्तर्गतं विल्वमहिमास्तोत्रं समाप्तम् । स्कन्दपुराण । नागरखण्ड
    । अध्याय २५०
