id: narayaniyam-dashaka-33
category: stotram
name:
  english: Narayaniyam Dashaka 33
content:
  english: vaivasvatakhyamanuputranabhagajata nabhaganamakanarendrasuto'mbarishah | saptarnavavritamahidayito'pi
    reme tvatsangishu tvayi ca magnamanassadaiva || || tvatpritaye sakalameva vitanvato'sya bhaktyaiva
    deva naciradabhrithah prasadam | yenasya yacanamrite'pyabhirakshanartham cakram bhavan pravitatara
    sahasradharam || || sa dvadashivratamatho bhavadarcanartham varsham dadhau madhuvane yamunopakanthe
    | patnya samam sumanasa mahatim vitanvan pujam dvijeshu visrijan pashushashtikotim || || tatratha
    paranadine bhavadarcanante durvasasa'sya munina bhavanam prapede | bhoktum vritashcasa nripena parartishilo
    mandam jagama yamunam niyamanvidhasyan || || rajna'tha paranamuhurtasamaptikheda dvaraiva paranamakari
    bhavatparena | prapto munistadatha divyadrisha vijanan kshipyan krudhoddhritajato vitatana krityam
    || || krityam ca tamasidharam bhuvanam dahanti magre'bhivikshyanripatirna padaccakampe | tvadbhaktabadhamabhivikshya
    sudarshanam te krityanalam shalabhayan munimanvadhavit || || dhavannasheshabhuvaneshu bhiya sa pashyan
    vishvatra cakramapi te gatavan virincam | kah kalacakramatilanghayatityapastah sharvam yayau sa ca
    bhavantamavandataiva || || bhuyo bhavannilayametya munim namantam proce bhavanahamrishe nanu bhaktadasah
    | jnanam tapashca vinayanvitameva manyam yahyambarishapadameva bhajeti bhuman || || tavatsametya munina
    sa grihitapado raja'pasritya bhavadastramasavanaushit | cakre gate muniradadakhilashisho'smai tvadbhaktimagasi
    krite'pi kripam ca shamsan || || raja pratikshya munimekasamamanashvan sambhojya sadhu tamrishim visrijan
    prasannam | bhuktva svayam tvayi tato'pi dridham rato'bhu tsayujyamapa ca sa mam pavanesha payah ||
  devanagari: वैवस्वताख्यमनुपुत्रनभागजात नाभागनामकनरेन्द्रसुतोऽम्बरीषः । सप्तार्णवावृतमहीदयितोऽपि रेमे
    त्वत्सङ्गिषु त्वयि च मग्नमनास्सदैव ॥ ॥ त्वत्प्रीतये सकलमेव वितन्वतोऽस्य भक्त्यैव देव नचिरादभृथाः प्रसादम्
    । येनास्य याचनमृतेऽप्यभिरक्षणार्थं चक्रं भवान् प्रविततार सहस्रधारम् ॥ ॥ स द्वादशीव्रतमथो भवदर्चनार्थं
    वर्षं दधौ मधुवने यमुनोपकण्ठे । पत्न्या समं सुमनसा महतीं वितन्वन् पूजां द्विजेषु विसृजन् पशुषष्टिकोटिम्
    ॥ ॥ तत्राथ पारणदिने भवदर्चनान्ते दुर्वाससाऽस्य मुनिना भवनं प्रपेदे । भोक्तुं वृतश्चस नृपेण परार्तिशीलो
    मन्दं जगाम यमुनां नियमान्विधास्यन् ॥ ॥ राज्ञाऽथ पारणमुहूर्तसमाप्तिखेदा द्वारैव पारणमकारि भवत्परेण
    । प्राप्तो मुनिस्तदथ दिव्यदृशा विजानन् क्षिप्यन् क्रुधोद्धृतजटो विततान कृत्याम् ॥ ॥ कृत्यां च तामसिधरां
    भुवनं दहन्ती मग्रेऽभिवीक्ष्यनृपतिर्न पदाच्चकम्पे । त्वद्भक्तबाधमभिवीक्ष्य सुदर्शनं ते कृत्यानलं शलभयन्
    मुनिमन्वधावीत् ॥ ॥ धावन्नशेषभुवनेषु भिया स पश्यन् विश्वत्र चक्रमपि ते गतवान् विरिञ्चम् । कः कालचक्रमतिलङ्घयतीत्यपास्तः
    शर्वं ययौ स च भवन्तमवन्दतैव ॥ ॥ भूयो भवन्निलयमेत्य मुनिं नमन्तं प्रोचे भवानहमृषे ननु भक्तदासः । ज्ञानं
    तपश्च विनयान्वितमेव मान्यं याह्यम्बरीषपदमेव भजेति भूमन् ॥ ॥ तावत्समेत्य मुनिना स गृहीतपादो राजाऽपसृत्य
    भवदस्त्रमसावनौषीत् । चक्रे गते मुनिरदादखिलाशिषोऽस्मै त्वद्भक्तिमागसि कृतेऽपि कृपां च शंसन् ॥ ॥ राजा
    प्रतीक्ष्य मुनिमेकसमामनाश्वान् सम्भोज्य साधु तमृषिं विसृजन् प्रसन्नम् । भुक्त्वा स्वयं त्वयि ततोऽपि
    दृढं रतोऽभू त्सायुज्यमाप च स मां पवनेश पायाः ॥
