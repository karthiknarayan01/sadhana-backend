id: aruna-prasna
category: stotram
name:
  english: Aruna Prasna
  devanagari: प्रथमः प्रश्नः --- अरुणप्रश्नः
content:
  english: om bhadram karnebhih shrinuyama devah| bhadram pashyemakshabhiryajatrah| sthirairangai sastanubhih|
    vyashema devahitam yadayuh| svasti na indro vriddhashravah| svasti nah pusha vishvavedah| svasti nastarkshyo
    arishtanemih| svasti no brihaspatirdadhatu|| om shantih shantih shantih|| bhadram karnebhih shrinuyama
    devah| bhadram pashyemakshabhiryajatrah| sthirairangai sastanubhih| vyashema devahitam yadayuh| svasti
    na indro vriddhashravah| svasti nah pusha vishvavedah| svasti nastarkshyo arishtanemih| svasti no
    brihaspatirdadhatu| apamapamapah sarvah agnirvayushca suryashca| saha sancaskararddhiya| vayvashva
    rashmipatayah| mari cyatmano adruhah| devirbhuvanasuvarih| putravatvaya me suta| mahanamnirmaha manah|
    mahaso mahasah svah| devih parjanyasuvarih| putravatvaya me suta||2|| apashnyushnimapa rakshah| apashnyushnimapa
    ragham | apadevirito hita| vajram devirajita shca| bhuvanam devasuvarih| adityanaditim devim| yoninordhvamudishata|
    shiva nah shantama bhavantu| divya apa oshadhayah| sumridika sarasvati| ma te vyoma sandrishi||3||
    smritih pratyakshamaitihyam | anumanashcatushtayam| etairaditya mandalam| sarvaireva vidha syate|
    suryo maricimadatte| sarvasma dadhi| tasyah pakavisheshena| smritam kala visheshanam| nadiva prabhavatkacit|
    akshayya 'bhi samayanti| soruh sati na nivartate| evam nanasamutthanah| kalah samvathsara shritah|
    anushashca mahashashca| sarve samavayantritam| sataih sarvaih samavishtah| uruh sanna nivartate| adhisamvathsaram
    vidyat| tadeva lakshane||5|| anubhishca mahadbhishca| samarudhah pradrishyate| samvathsarah pratyakshena|
    nadhisatvah pradrishyate| pataro viklidhah pingah| etadvarunalakshanam| yatraitadupadrishyate| sahasram
    tatra niyate| eka hi shiro nana mukhe| krithsnam tadritulakshanam||6|| ndriyani| jalpitam tveva dihyate|
    shuklakrishne samvathsarasya| dakshinavamayoh parshvayoh| tasyaisha bhavati| shukram te anyadyajatam
    te anyat| vishurupe ahani dyaurivasi| vishva hi maya avasi svadhavah| bhadra te pushanniha ratirastviti|
    natra bhuvanam| na pusha| na pashavah| na ''dityah samvathsara eva pratyakshena priyatamam vidyat|
    etadvai samvathsarasya priyatama 'sya mahanartha utpathsyamano bhavati| idam punyam kurushveti| tamaharanam
    dadyat||7|| saptathamahurekajam| shadudyama rishayo devaja iti| teshamishtani vihitani dhamashah|
    sthatre rejante vikritani rupashah| ko nu marya amithitah| sakha sakhayamabravit| jahako asmadishate|
    yastityaja sakhivida sakhayam| na tasya vacyapi bhago asti| yadi na hi praveda sukritasya panthamiti|
    ritur rituna nudyamanah| vinanada bhidhavah| shashtishca tri shaka valgah| shuklakrishnau ca shashtikau|
    saragavastrairjara dakshah| vasanto vasubhih saha| samvathsarasya savituh| praishakritprathamah smritah|
    amunadayatetyanyan||9|| shca parirakshatah| eta vacah prayujyante| yatraitadupadrishyate| etadeva
    vijaniyat| pramanam kalaparyaye| visheshanam tu vakshyamah| ritunam tannibodhata| shuklavasa rudraganah|
    grishmena ''vartate saha| nijahan 'pratikhyena sah| vishvarupani vasa nibodhata| samvathsarinam karmaphalam|
    var saha| aduhkho duhkhacakshuriva| tadma ''pita iva drishyate| shitena vyathayanniva| rurudaksha
    iva drishyate| hladayate jvalatashcaiva| shamyatashcasya cakshushi| ya vai praja bhra shyante| samvathsaratta
    bhra shyante| yah pratitishthanti| samvathsare tah pratitishthanti| var shabhya ityarthah||11|| akshiduhkhotthitasyaiva|
    viprasanne kaninike| ankte cadganam nasti| ribhunam tannibodhata| kanakabhani vasa si| ahatani nibodhata|
    annamashnita mrijmita| aham vo jivanapradah| eta vacah prayujyante| sharadyatropadrishyate||12|| 'bhighnanta
    iva| vatavanto marudganah| amuto jetumishumukhamiva| sannaddhah saha dadrishe ha| apadhvastairvastivarnairiva|
    vishikhasah kapardinah| akruddhasya yothsyamanasya| kruddhasyeva lohini| hematashcakshushi vidyat|
    akshnayoh durbhiksham devalokeshu| manunamudakam grihe| eta vacah pravadantih| vaidyuto yanti shaishirih|
    ta agnih pavamana anvai kshata| iha jivikamaparipashyan| tasyaisha bhavati| ihehavah svatapasah| marutah
    suryatvacah| sharma sapratha avrine||14|| atitamrani vasa si| ashtivajrishataghni ca| vishve deva
    vipraharanti| agnijihva asashcata| naiva devo na martyah| na raja varuno vibhuh| nagnirnendro na pavamanah|
    matrikkaccana vidyate| divyasyaika dhanurartnih| prithivyamapara shrita||15|| tasyendro vamrirupena|
    dhanurjyamachinathsvayam| tadindradhanu rityajyam| abhravarneshu cakshate| etadeva shamyorbar haspatyasya|
    etadrudrasya dhanuh| rudrasya tveva dhanurartnih| shira utpipesha| sa pravargyo 'bhavat| tasmadyah
    sapravargyena yajnena yajate| rudrasya sa shirah pratidadhati| naina rudra aruko bhavati| ya evam
    veda||16|| 'tirashcat| shishirah pradrishyate| naiva rupam na vasa si| na cakshuh pratidrishyate|
    anyonyam tu na hi sratah| satastaddevalakshanam| lohito 'kshni sharashirshnih| suryasyodayanam prati|
    tvam karoshi nyanjalikam| tvam karoshi nijanukam||17|| nyanjalika| ami vacamupasatamiti| tasmai sarva
    ritavo namante| maryadakaratvatpra purodham| brahmana apnoti| ya evam veda| sa khalu samvathsara etaih
    senanibhih saha| indraya sarvankamanabhivahati| sa draphsah| tasyaisha bhavati||18|| shumatimatishthat|
    iyanah krishno dashabhih sahasraih | avartamindrah shacya dhamantam| upasnuhi tam nrimanamathadramiti|
    etayaivendrah salavrikya saha| asuran parivrishcati| prithivya shumati| tamanvavasthitah samvathsaro
    divam ca| naivam vidusha ntevasinau| anyonyasmai druhyatam| yo druhyati| bhrashyate svargallokat|
    ityritumandalani| suryamandala khyayikah| ata urdhva arogo bhrajah patarah patangah| svarnaro jyotishiman
    vibhasah| te asmai sarve divamatapanti| urjam duhana anapasphuranta iti| kashyapo 'shtamah| sa mahamerum
    na jahati| tasyaisha bhavati| yatte shilpam kashyapa rocanavat| indriyavatpushkalam citrabhanu| yasminthsurya
    arpitah sapta sakam||20|| rajanamadhivishrayemamiti| te asmai sarve kashyapajjyo tirlabhante| tanthsomah
    kashyapa nirdhamati| bhrastakarmakridivaivam| prano jivanindriyajivani| sapta shir shanyah pranah|
    surya ityacaryah| apashyamahametanthsapta su karno vathsyayanah| saptakarnashca plakshih||21|| anushravika
    eva nau kashyapa iti| ubhau vedayite| na hi shekumiva mahamerum gantum| apashyamahamethsuryamandalam
    parivartamanam| gargyah pranatratah| gacchanta mahamerum| ekam cajahatam| bhrajapatarapatanga nihane|
    tishthannatapanti| tasmadiha taptritapah||22|| amutretare| tasmadihataptritapah| teshamesha bhavati|
    sapta surya divamanupravishtah| tananveti pathibhirdakshinavan| te asmai sarve ghritamatapanti| urjam
    duhana anapasphuranta iti| saptartvijah surya ityacaryah| teshamesha bhavati| sapta disho nanasuryah||23||
    sapta hotara ritvijah| deva aditya ye sapta| tebhih somabhi rakshana iti| tadapyamnayah| digbhraja
    ritu karoti| etayaivavrita sahasrasuryataya iti vaishampayanah| tasyaisha bhavati| yaddyava indra
    te shata | utasyuh| natva vajrinthsahasra anu na jatamashta rodasi iti| nanalingatvadritunam nanasuryatvam|
    ashtau tu vyavasita iti| suryamandalanyashtata urdhvam| teshamesha bhavati| citram devanamudagadanikam|
    cakshurmitrasya varunasyagneh| a 'pra dyavaprithivi antariksham| surya atma jagatastasthu kvedamabhram
    nivishate| kvaya samvathsaro mithah| kvahah kveyam deva ratri| kva masa ritavah shritah| ardhamasa
    muhurtah| nimeshastrutibhih saha| kvema apo nivishante| yadito yanti samprati| kala aphsu nivishante|
    apah surye samahitah||26|| nyapah prapadyante| vidyuthsurye samahita| anavarne ime bhumi| iyam ca
    svidatrantara bhutam| yeneme vidhrite ubhe| vishnuna vidhrite bhumi| iti vathsasya vedana| iravati
    dhenumati hi bhutam| suyavasini manushe dashasye vyashtabhnadrodasi vishnavete| dadhartha prithivimabhito
    mayukhaih | kim tadvishnorbala mahuh| ka diptih kim parayanam| eko yaddharayaddevah| rejati rodasi
    ubhe| vatadvishnorbalamahuh| akshara ddiptirucyate| tripadaddharayaddevah| yadvishnoreka agnayo vayavashcaiva|
    etadasya parayanam| pricchami tva param mrityum| avamam madhyamancatum| lokam ca punyapapanam| etatpricchami
    samprati| amumahuh param mrityum| pavamanam tu madhyamam| agnirevavamo mrityuh| candrama anabhogah
    param mrityum| papah samyanti sarvada| abhogastveva samyanti| yatra punyakrito janah| tato madhyamamayanti|
    catumagnim ca samprati| pricchami tva papakritah| yatra yatayate yamah| tvam nastadbrahman kashyapaduditah
    suryah| papannirghnanti sarvada| rodasyontarde sheshu| tatra nyasyante vasavaih| te 'sharirah prapadyante|
    yatha 'punyasya karmanah| apa nyapadakeshasah| tatra te 'yonija janah| mritva punarmrityumapadyante|
    adyamanah svakarmabhih||31|| ashatikah krimaya iva| tatah puyante vasavaih| apaitam mrityum jayati|
    ya evam veda| sa khalvaivam vidbrahmanah| dirghashruttamo bhavati| kashyapasyatithih siddhagamanah
    siddhagamanah| tasyaisha bhavati| ayasmi nthsapta vasavah| rohanti purvya ruhah||32|| ha dirghashruttamah|
    indrasya gharmo atithiriti| kashyapah pashyako bhavati| yathsarvam paripashyatiti saukshmyat| athagnerashtapurushasya|
    tasyaisha bhavati| agne naya supatha raye asman| vishvani deva vayunani vidvan| yuyodhyasmajjuhuranamenah|
    bhuyishtham te nama uktim vidhemeti||33|| agnishca jatavedashca| sahoja ajiraprabhuh| vaishvanaro
    naryapashca| panktiradhashca saptamah| visarpeva kshita iti| yathartvevagnerarcirvarnavisheshah| nilarcishca
    pitaka rcishceti| atha vayorekadasha dashastrikasya| prabhrajamana vyavadatah||34|| yashca vasukivaidyutah|
    rajatah parushah shyamah| kapila atilohitah| urdhva avapatantashca| vaidyuta ityekadasha| nainam vaidyuto
    hinasti| ya evam veda| sa hovaca vyasah parasharyah| vidyudvadhamevaham mrityumai ya evam veda| atha
    gandharvaganah| svanabhrat| angharirbambharih| hastah suhastah| krishanurvishvavasuh| murdhanvanthsu
    ryavarcah| kritirityeka ganah| devashca mahadevah| rashmayashca deva garagirah||36|| nainam garo hinasti|
    ya evam veda| gauri mimaya salilani takshati| ekapadi dvipadi sa catushpadi| ashtapadi navapadi babhuvushi
    | sahasrakshara parame vyomanniti| vaco visheshanam| atha nigadavyakhyatah| tananukramishyamah| varahavah
    svatapasah||37|| vidyunmahaso dhupayah| shvapayo grihamedha shcetyete| ye ceme dvishah| parjanyah
    sapta prithivimabhivar shanti| vrishtibhiriti| etayaiva vibhaktiviparitah| saptabhirva tairudiritah|
    amu~llokana shanti| teshamesha bhavati| samana uccaityavacahabhih| bhumim parjanya jinvanti| divam
    jinvantyagnaya iti| yadaksharam bhutakritam| vishve deva upasate| mahar | jamadagnimakurvata| jamadagni
    rapyayate| chandobhishcaturuttaraih| rajnah somasya triptasah||39|| brahmana viryavata| shiva nah
    pradisho dishah| taccham yoravrinimahe| gatum yajnaya| gatum yajnapataye| daivi svastirastu nah| svastirmanushebhyah|
    urdhvam jigatu bheshajam| sham no astu dvipade | sham catushpade| somapa iti nigadavyakhyatah||40||
    sahasravridiyam bhumih| param vyoma sahasravrit| ashvina bhujyunasatya| vishvasya jagataspati| jaya
    bhumih patirvyoma| mithunanta aturyathuh| putro brihaspati rudrah| sarama iti stripumam| shukram vamanyadyajatam
    vamanyat| vishurupe ahani dyauriva sthah||41|| vishva hi maya avathah svadhavantau| bhadra vam pushanaviha
    ratirastu| vasa tyau citrau jagato nidhanau | dyavabhumi carathah sa sakhayau| tavashvina rasabha
    shva havam me| shubhaspati agata suryaya saha| tyugroha bhujyumashvinodameghe| rayim na kashcinmamrivam
    avahah| tamuhathurnaubhira vatibhih| antarikshaprudbhirapodakabhih||42|| kshapastrirahativrajadbhih|
    nasatya bhujyumuhathuh patangaih| samudrasya dhanvannardrasya pare| tribhirathaih shatapadbhih shadashvaih|
    savitaram vitanvantam| anubadhnati shambarah| apapur shambarashcaiva| savita sutriptam viditvaiva|
    bahusoma giram vashi||43|| anveti tugro vakriyantam| ayasuyanthsomatriphsushu| sa sangrama 'tyotah|
    vaco gah pipati tat| sa tadgobhih stava 'tyetyanye| rakshasananvitashca ye| anveti parivritya metau
    stho ashvina| te ete dyuh prithivyoh| aharahargarbham dadhathe||44|| tayoretau vathsavahoratre| prithivya
    ahah| divo ratrih| ta avisrishtau| dampati eva bhavatah| tayoretau vathsau| agnishca ''dityashca|
    ratrervathsah| shveta adityah| ahno tamro arunah| ta avisrishtau| dampati eva bhavatah| tayoretau
    vathsau| vritrashca vaidyutashca| agnervritrah| vaidyuta adityasya| ta avisrishtau| dampati eva bhavatah|
    tayoretau vathsau||46|| ushma ca niharashca| vritrasyoshma| vaidyutasya niharah| tau taveva pratipadyete|
    seya ratri garbhini putrena samvasati| tasya va etadulbanam | yadratrau rashmayah| yatha gorgarbhinya
    ulbanam | evametasya ulbanam | prajayishnuh prajaya ca pashubhishca bhavati| ya evam veda| etamudyantamapiyantam
    ceti| adityah punyasya vathsah| atha pavitrangirasah||47|| pavitravantah parivajamasate| pitaisham
    pratno abhirakshati vratam| mahah samudram varunastirodadhe| dhira icchekurdharuneshvarabham | pavitram
    te vitatam brahmanaspate | prabhurgatrani paryeshivishvatah| ataptatanurna tadamo ashnute| shritasa
    idvahantastathsamashata| brahma devana m| asatah sadye tatakshuh||48|| rishayah saptatrishca yat|
    sarve 'trayo agastyashca| nakshatraih shankrito 'vasan| atha savituh shyavashvasya vartikamasya| ami
    ya riksha nihitasa ucca| naktam dadrishre kuhaciddiveyuh| adabdhani varunasya vratani| vicakashaccandrama
    nakshatrameti| tathsaviturvare nyam| bhargo devasya dhimahi||49|| dhiyo yo nah pracodaya t| tathsaviturvrinimahe|
    vayam devasya bhojanam| shreshtha sarvadhatamam| turam bhagasya dhimahi| apaguhata savita tribhin|
    sarva ndivo andhasah| naktam tanya bhavandrishe| asthyasthna sambhavishyamah| nama namaiva nama me
    stryasmi| sthavaro 'smyatha jangamah| yaje 'yakshi yashtahe ca| maya bhutanyayakshata| pashavo mama
    bhutani| anubandhyo 'smyaham vibhuh| striyah satih| ta ume pu sa ahuh| pashyadakshanvannavicetadandhah|
    kaviryah putrah sa ima ciketa||51|| yasta vijanathsavituh pita 'sat| andho manimavindat| tamananguliravayat|
    agrivah pratyamuncat| tamajihva asashcata| urdhvamulamavakchakham| vriksham yo veda samprati| na sa
    jatu janah shraddadhyat| mrityurma marayaditih| hasita vinapanavalasitam| mritam jivam ca yatkincit|
    angani sneva viddhi tat| atrishya strishyadhyayat| asmajjata me mithu carann| putro nir ritya vaidehah|
    aceta yashca cetanah| sa tam manimavindat| so 'nanguliravayat| so grivah pratyamuncat||53|| 'jihvo
    asashcata| naitamrishim viditva nagaram pravishet| yadi pravishet| mithau caritva pravishet| tathsambhavasya
    vratam| atamagne ratham tishtha| eka shvamekayojanam| ekacakramekadhuram| vatadhrajigatim vibho| na
    rishyati na vyathate||54|| nasyaksho yatu sajjati| yacchveta shcagneh| rathe yuktva tishthati| ekaya
    ca dashabhishca svabhute| dvabhyamishtaye vi shatya ca| tisribhishca vahase tri shata ca| niyudbhirvayaviha
    ta vimunca||55|| atanushva pratanushva| uddhama ''dhama sandhama| aditye candravarnanam| garbhamadhehi
    yah puman| itah sikta suryagatam| candramase rasam kridhi| varadam janayagre 'gnim| ya eko rudra ucyate|
    asankhyatah sahasrani| smaryate na ca drishyate||56|| evametam nibodhata| a mandrairindra haribhih|
    yahi mayuraromabhih| ma tva kecinniyemurinna pashinah| dadhanveva ta ihi| ma mandrairindra haribhih|
    yami mayuraromabhih| ma ma kecinniyemurinna pashinah| nidhanveva imi| anubhishca mahadbhishca||57||
    nighrishvairasamayutaih| kalair haritvamapannaih| indra yuk| agnirvibhrashtivasanah| vayuh shvetasikadrukah|
    samvathsaro vishu carastava| subrahmanyo subrahmanyom| indra ''gaccha hariva agaccha medhatitheh|
    mesha vrishanashvasya mene||58|| gauravaskandinnahalyayai jara| kaushikabrahmana gautamabruvana| arunashva
    ihagatah| vasavah prithivikshitah| ashtaudigvasaso 'gnayah| agnishca jata shcetyete| tamrashva stamrarathah|
    tamravarna khadagdatah| ito rudrah sthanam pramanam ca pura ita| brihaspatishca savita ca| vishvarupairiha
    ''gatam| rathenodakavartmana| aphsusha iti taddvayoh| ukto vesho vasa si ca| kalavayavanamitah praticya|
    vasatya ityashvinoh| ko 'ntarikshe shabdam karotiti| vasishto rauhino mima sam cakre| tasyaisha bhavati|
    vashreva vidyuditi| brahmana udaranamasi| brahmana udiranamasi| brahmana astaranamasi| brahmana upastaranamasi||60||
    apakramata garbhinyah ashtayonimashtaputram| ashtapatnimimam mahi m| aham veda na me mrityuh| na camrityuragha
    nyashtaputram| ashtapadidamantariksham| aham veda na me mrityuh| na camrityuragha ''harat| ashtayonimashtaputram|
    ashtapatnimamum divam aham veda na me mrityuh| na camrityuragha ''harat| sutramanam mahimu shu| aditirdyauraditirantariksham|
    aditirmata sa pita sa putrah| vishve deva aditih panca | aditirjatamaditirjanitvam| ashtau putraso
    aditeh| ye jatastanvah pari| devam upapraithsaptabhih||62|| para martandamasyat| saptabhih putrairaditih|
    upapraitpurvyam yugam | prajayai mrityave tat| para martandamabharaditi| tananukramishyamah| mitrashca
    varunashca| dhata ca shashca bhagashca| indrashca vivasva shcetyete| hiranyagarbho ha sah shucishat|
    brahmajajnanam taditpadamiti| garbhah prajapatyah| atha purushah sapta purushah||63|| yathasthanam
    garbhinyah 'sau tapannudeti| sa sarvesham bhutanam prananadayodeti| ma me prajaya ma pashunam| ma
    mama prananadayodagah| asau yo 'stameti| sa sarvesham bhutanam prananadayastameti| ma me prajaya ma
    pashunam| ma mama prananadayastam gah| asau ya apuryati| sa sarvesham bhutanam pranairapuryati||64||
    prajaya ma pashunam| ma mama pranairapurishthah| asau yo 'pakshiyati| sa sarvesham bhutanam pranairapakshiyati|
    ma me prajaya ma pashunam| ma mama pranairapaksheshthah| amuni nakshatrani| sarvesham bhutanam pranairapaprasarpanti
    cothsarpanti ca| ma me prajaya ma pashunam| ma mama pranairapaprasripata mothsripata||65|| shcardhamasashca|
    sarvesham bhutanam pranairapaprasarpanti cothsarpanti ca| ma me prajaya ma pashunam| ma mama pranairapaprasripata
    mothsripata| ima ritavah| sarvesham bhutanam pranairapaprasarpanti cothsarpanti ca| ma me prajaya
    ma pashunam| ma mama pranairapaprasripata mothsripata| aya samvathsarah| sarvesham bhutanam pranairapaprasarpati
    cothsarpati ca||66|| prajaya ma pashunam| ma mama pranairapaprasripa mothsripa| idamahah| sarvesham
    bhutanam pranairapaprasarpati cothsarpati ca| ma me prajaya ma pashunam| ma mama pranairapaprasripa
    mothsripa| iya ratrih| sarvesham bhutanam pranairapaprasarpati cothsarpati ca| ma me prajaya ma pashunam|
    ma mama pranairapaprasripa mothsripa| om bhurbhuvah svah| etadvo mithunam ma no mithuna ''dityasyashtapurushasya|
    vasunamadityana sthane svatejasa bhani| rudranamadityana sthane svatejasa bhani| adityanamadi sthane
    svatejasa bhani| sata satyanam| adityana sthane svatejasa bhani| abhidhunvata mabhighnatam| vatavatam
    marutam| adityana sthane svatejasa bhani| ribhunamadityana sthane svatejasa bhani| vishvesham devanam|
    adityana sthane svatejasa bhani| samvathsarasya savituh| adityasya sthane svatejasa bhani| om bhurbhuvah
    svah| rashmayo vo mithunam ma no mithuna arogasya sthane svatejasa bhani| bhrajasya sthane svatejasa
    bhani| patarasya sthane svatejasa bhani| patangasya sthane svatejasa bhani| svarnarasya sthane svatejasa
    bhani| jyotishimatasya sthane svatejasa bhani| vibhasasya sthane svatejasa bhani| kashyapasya sthane
    svatejasa bhani| om bhurbhuvah svah| apo vo mithunam ma no mithuna purushasyaikadashastrikasya| prabhrajamanana
    sthane svatejasa bhani| vyavadatana sthane svatejasa bhani| vasukivaidyutana sthane svatejasa bhani|
    rajatana sthane svatejasa bhani| parushana sthane svatejasa bhani| shyamana sthane svatejasa bhani|
    kapilana sthane svatejasa bhani| atilohitana sthane svatejasa bhani| urdhvana sthane svatejasa bhani||70||
    sthane svatejasa bhani| vaidyutana sthane svatejasa bhani| prabhrajamanina sthane svatejasa bhani|
    vyavadatina sthane svatejasa bhani| vasukivaidyutina sthane svatejasa bhani| rajatana sthane svatejasa
    bhani| parushana sthane svatejasa bhani| shyamana sthane svatejasa bhani| kapilana sthane svatejasa
    bhani| atilohitina sthane svatejasa bhani| urdhvana sthane svatejasa bhani| avapatantina sthane svatejasa
    bhani| vaidyutina sthane svatejasa bhani| om bhurbhuvah svah| rupani vo mithunam ma no mithuna athagnerashtapurushasya|
    agneh purvadishyasya sthane svatejasa bhani| jatavedasa upadishyasya sthane svatejasa bhani| sahojaso
    dakshinadishyasya sthane svatejasa bhani| ajiraprabhava upadishyasya sthane svatejasa bhani| vaishvanarasyaparadishyasya
    sthane svatejasa bhani| naryapasa upadishyasya sthane svatejasa bhani| panktiradhasa udagdishyasya
    sthane svatejasa bhani| visarpina upadishyasya sthane svatejasa bhani| om bhurbhuvah svah| disho vo
    mithunam ma no mithuna dakshinapurvasyam dishi visarpi narakah| tasmannah paripahi| dakshinaparasyam
    dishyavisarpi narakah| tasmannah paripahi| uttarapurvasyam dishi vishadi narakah| tasmannah paripahi|
    uttaraparasyam dishyavishadi narakah| tasmannah paripahi| a yasminthsapta vasava indriyani shatakratavityete||73||
    indraghosha vo vasubhih purastadupadadhatam| manojavaso vah pitribhirdakshinata upadadhatam| praceta
    vo rudraih pashcadupadadhatam| vishvakarma va adityairuttarata upadadhatam| tvashta vo rupairuparishtadupa
    dadhatam| samjnanam vah pashcaditi| adityah sarvo 'gnih prithivyam| vayurantarikshe| suryo divi| candrama
    dikshu| nakshatrani svaloke| eva hyeva| eva hyagne| eva hi vayo| eva hi ndra| eva hi pushan| eva hi
    devah||74|| 'mutah| agnirvayushca suryashca| saha sancaskararddhiya| vayvashva rashmipatayah| mari
    cyatmano adruhah| devirbhuvanasuvarih| putravatvaya me suta| mahanamnirmaha manah| mahaso mahasah
    svah||75|| devih parjanyasuvarih| putravatvaya me suta| apa shnyushnimapa rakshah| apa | apadevirito
    hita| vajram devi shca| bhuvanam devasuvarih| adityanaditim devim| yoninordhvamudishata||76|| bhadram
    karnebhih shrinuyama devah| bhadram pashyemakshabhiryajatrah| sthirairangai sastanubhih| vyashema
    devahitam yadayuh| svasti na indro vriddhashravah| svasti nah pusha vishvavedah| svasti nastarkshyo
    arishtanemih| svasti no brihaspatirdadhatu| ketavo arunasashca| rishayo vatarashanah| pratishtha shatadha
    hi| samahitaso sahasradhayasam| shiva nah shantama bhavantu| divya apa oshadhayah| sumridika sarasvati|
    ma te vyoma sandrishi||77|| 'pam pushpam veda| pushpavan n pashuman bhavati| candrama va apam pushpam
    | pushpavan prajava bhavati| ya evam veda| yo 'pamayatanam veda| ayatanavan bhavati| agnirva apamayatanam|
    ayatanavan 'gnerayatanam veda||78|| bhavati| apo va agnerayatanam| ayatanavan bhavati| ya evam veda|
    yo 'pamayatanam veda| ayatanavan bhavati| vayurva apamayatanam| ayatanavan bhavati| yo vayorayatanam
    veda| ayatanavan apo vai vayorayatanam| ayatanavan bhavati| ya evam veda| yo 'pamayatanam veda| ayatanavan
    bhavati| asau vai tapannapa mayatanam| ayatanavan 'mushya tapata ayatanam veda| ayatanavan bhavati|
    apo va amushya tapata ayatanam||80|| bhavati| ya evam veda| yo 'pamayatanam veda| ayatanavan bhavati|
    candrama va apamayatanam| ayatanavan bhavati| yashcandramasa ayatanam veda| ayatanavan bhavati| apo
    vai candramasa ayatanam| ayatanavan 'pamayatanam veda| ayatanavan bhavati| nakshatrani va apamayatanam|
    ayatanavan bhavati| yo nakshatranamayatanam veda| ayatanavan bhavati| apo vai nakshatranamayatanam|
    ayatanavan bhavati| ya evam veda||82|| 'pamayatanam veda| ayatanavan bhavati| parjanyo va apamayatanam|
    ayatanavan bhavati| yah parjanyasya yatanam veda| ayatanavan bhavati| apo vai parjanyasya bhavati|
    ya evam veda| yo 'pamayatanam veda||83|| bhavati| samvathsaro va apamayatanam| ayatanavan bhavati|
    yah samvathsarasya yatanam veda| ayatanavan bhavati| apo vai samvathsarasya bhavati| ya evam veda|
    yo 'phsu navam pratishthitam veda| pratyeva tishthati||84|| ime vai loka aphsu pratishthitah| tadesha
    rasasya yo rasah| tam vo grihnamyuttamamiti| ime vai loka apa 'mushminnaditye samabhritah| janudaghnimuttara
    vedim khatva| apam purayitva gulphadaghnam||85|| pushkaraparnaih pushkaradandaih pushkaraishca sa
    stirya| tasminvi hayase| agnim praniyopasamadhaya| brahmavadino vadanti| kasma 'yamaphsu hyayam ciyate
    'pyanahitagniretah| tamabhita eta abishtaka upadadhati| agnihotre darshapurnamasayoh | pashubandhe
    caturmasyeshu||86|| atho ahuh| sarveshu yajnakratushviti| etaddha sma va ahuh shandilah| kamagnim
    cinute| satriyamagnim cinvanah| samvathsaram pratyakshena| kamagnim cinute| savitramagnim cinvanah|
    amumadityam pratyakshena| kamagnim cinute||87|| naciketamagnim cinvanah| prananpratyakshena| kamagnim
    cinute| catur magnim cinvanah| brahma pratyakshena| kamagnim cinute| vaishvasrijamagnim cinvanah|
    shariram pratyakshena| kamagnim cinute| upanuvakya mashumagnim cinvanah||88|| ima~llokanpratyakshena|
    kamagnim cinute| imamarunaketukamagnim cinvana iti| ya evasau| itashca 'vyatipati| tamiti| yo 'gnermithuya
    veda| mithunavanbhavati| apo va agnermithuyah| mithunavanbhavati| ya evam veda||89|| apo va idamasanthsalilameva|
    sa prajapatirekah pushkaraparne samabhavat| tasyantarmanasi kamah samavartata| ida srijeyamiti| tasmadyatpurusho
    manasa 'bhigacchati| tadvaca vadati| tatkarmana karoti| tadesha kta| kamastadagre samavartatadhi|
    manaso retah prathamam yadasi sato bandhumasati niravindan| hridi pratishya kavayo manisheti| upainantadupanamati|
    yatkamo bhavati| ya evam veda| sa tapo 'tapyata| sa tapastaptva| shariramadhunuta| tasya yanma 'runah
    ketavo vatarashana rishaya udatishthan||91|| | te vaikhanasah| ye valah | te valakhilyah| yo rasah|
    so 'pam| antaratah kurmam bhuta sarpantam| tamabravit| mama vaitvanma netyabravit| purvamevahamihasamiti|
    tatpurushasya purushatvam| sa sahasrashir sha purushah| sahasrakshah sahasrapat| bhutvodatishthat|
    tamabravit| tvam vai purva samabhuh| tvamidam purvah kurushveti| sa ita adaya anjalina purastadupadadhat|
    eva hyeveti| tata aditya udatishthat| sa praci dik| atharunah keturdakshinata upadadhat| eva hyagna
    iti| tato va agnirudatishthat| sa dakshina dik| atharunah ketuh pashcadupadadhat| eva hi vayo iti||94||
    tato vayurudatishthat| sa pratici dik| atharunah keturuttarata upadadhat| eva hindreti| tato va indra
    udatishthat| sodici dik| atharunah keturmadhya upadadhat| eva hi pushanniti| tato vai pushodatishthat|
    seyam dik||95|| atharunah keturuparishtadupadadhat| eva hi deva iti| tato devamanushyah pitarah| gandharvaphsarasa
    tishthan| sordhva dik| ya viprusho viparapatan| tabhyo si pishacashcodatishthan| tasmatte parabhavan|
    viprudbhyo hi te samabhavan| tadesha apo ha yadbrihatirgarbhamayann| daksham dadhana janayantih svayambhum|
    tata imedhyasrijyanta sargah sarvam brahma svayambhviti| tasmadida dhruvamivabhavat| prajapatirvava
    tat| atmana ''tmanam vidhaya| tadevanupravishat| tadesha vidhaya bhutani| vidhaya sarvah pradisho
    dishashca| prajapatih prathamaja ritasya| atmana ''tmanamabhi samvivesheti| sarvamevedamaptva| sarvamavaruddhya|
    tadevanupravishati| ya evam veda||98|| catushtayya apo grihnati| catvari va apa rupani| megho vidyut|
    stanayitnurvrishtih| tanyevavarundhe| atapati varshya grihnati| tah purastadupadadhati| eta vai brahmavarcasya
    apah| mukhata eva brahmavarcasamavarundhe| tasma nmukhato brahmavarcasitarah||99|| kupya grihnati|
    ta dakshinata upadadhati| eta vai tejasvinirapah| teja evasya dakshinato dadhati| tasmaddakshino svitarah|
    sthavara grihnati| tah pashcadupadadhati| pratishthita vai sthavarah| pashcadeva pratitishthati| vahantirgrihnati||100||
    ta uttarata upadadhati| ojasa va eta vahantirivodgatiriva akujatiriva dhavantih| oja evasyo ttarato
    dadhati| tasmaduttaro 'rdha ojasvitarah| sambharya grihnati| ta madhya upadadhati| iyam vai sambharyah|
    asyameva pratitishthati| palvalya grihnati| ta uparishtadupadadhati||101|| asau vai palvayah| amushyameva
    pratitishthati| dikshupadadhati| dikshu va apah| annam va apah| adbhyo va annam jayate| yadevadbhyo
    'nnam jayate| tadavarundhe| tam va etamarunah ketavo vatarashana rishayo 'cinvan| tasmadarunaketukah||102||
    kta| ketavo arunasashca| rishayo vatarashanah| pratishtha shatadha hi| samahitaso sahasradhayasamiti|
    shatashashcaiva sahasrashashca pratitishthati| ya etamagnim cinute| ya ucainamevam veda||103|| janudaghnimuttaravedim
    khatva| apam purayati| apa sarvatvaya| pushkaraparna rukmam purushamityupadadhati| tapo vai pushkaraparnam|
    satya rukmah| amritam purushah| etavadva va 'sti| yavadetat| yavadevasti||104|| tadavarundhe| kurmamupadadhati|
    apameva medhamavarundhe| atho svargasya lokasya samashtyai| apamapamapah sarvah 'mutah| agnirvayushca
    suryashca| saha sancaskararddhiya iti| vayvashva rashmipatayah| lokam prinacchidram prina||105|| yastisrah
    paramajah| indraghosha vo vasubhirevahyeveti| panca citaya upadadhati| pankto 'gnih| yavanevagnih|
    tam cinute| lokam prinaya dvitiyamupa dadhati| panca pada vai virat| tasya va iyam padah| antariksham
    padah| dyauh padah| dishah padah| parorajah padah| virajyeva pratitishthati| ya etamagnim cinute|
    ya ucainamevam veda||106|| agnim praniyopasamadhaya| tamabhita eta abishtaka upadadhati| agnihotre
    darshapurnamasayoh | pashubandhe caturmasyeshu| atho ahuh| sarveshu yajnakratushviti| atha ha smaharunah
    svayambhuvah| savitrah sarvo 'gnirityananushangam manyamahe| nana va etesham viryani| kamagnim cinute||107||
    satriyamagnim cinvanah| kamagnim cinute| savitramagnim cinvanah| kamagnim cinute| naciketamagnim cinvanah|
    kamagnim cinute| catur magnim cinvanah| kamagnim cinute| vaishvasrijamagnim cinvanah| kamagnim cinute||108||
    upanuvakyamashumagnim cinvanah| kamagnim cinute| ima magnim cinvana iti| vrisha va agnih| vrishanau
    sa sphalayet| hanyeta sya yajnah| tasmannanushajyah| sottaravedishu kratushu cinvita| uttaravedya
    | prajakamashcinvita||109|| prajapatyo va esho 'gnih| prajapatyah prajah| prajava bhavati| ya evam
    veda| pashukamashcinvita| samjnanam va etat pashunam| yadapah| pashunameva samjnane 'gnim cinute|
    pashuman bhavati| ya evam veda||110|| vrishtikamashcinvita| apo vai vrishtih| parjanyo var shuko bhavati|
    ya evam veda| amayavi cinvita| apo vai bheshajam| bheshajamevasmai karoti| sarvamayureti| abhicara
    shcinvita| vajro va apah||111|| vajrameva bhratrivyebhyah praharati| strinuta enam| tejaskamo yashaskamah|
    brahmavarcasakamah svarga kamashcinvita| etavadva va 'sti| yavadetat| yavadevasti| tadavarundhe| tasyaitadvratam|
    var shati na dhavet||112|| amritam va apah| amritasyanantarityai| naphsu mutrapurisham kuryat| na
    nishthivet| na vivasanah snayat| guhyo va esho 'gnih| etasyagneranatidahaya| na pushkaraparnani hiranyam
    va t| etasyagneranabhyarohaya| na kurmasyashniyat| nodakasyaghatukanyena modakani bhavanti| aghatuka
    apah| ya etamagnim cinute| ya ucainamevam veda||113|| imanukam bhuvana sishadhema| indrashca vishve
    ca devah| yajnam ca nastanvam ca prajam ca| adityairindrah saha sishadhatu| adityairindrah sagano
    marudbhih| asmakam bhutvavita tanuna m| aplavasva praplavasva| andibhavaja ma muhuh| sukhadinduhkhanidhanam|
    pratimuncasva svam puram||114|| maricayah svayambhuvah| ye shariranyakalpayan| te te deham kalpayantu|
    ma ca te khyasma tirishat| uttishthata ma svapta| agnimicchadhvam bharatah| rajnah somasya triptasah|
    suryena sayujoshasah| yuva suvasah | ashtacakra navadvara||115|| devanam purayodhya| tasya hiranmayah
    koshah| svargo loko jyotisha brahmano veda| amritena ''vritam purim| tasmai brahma ca brahma ca| ayuh
    kirtim prajam daduh| vibhrajamana harinim| yashasa samparivritam| pura hiranmayim brahma||116|| 'parajita|
    paranetyajyamayi| paranetyanashaki| iha camutra canveti| vidvandevasuranubhayan| yatkumari mandrayate|
    yadyoshidyatpativrata | arishtam yatkim ca kriyate | agnistadanuvedhati| ashritasah shritasashca||117||
    'pyayajvanah| svaryanto nape kshante| indramagnim ca ye viduh| sikata iva samyanti| rashmibhih samudiritah|
    asma damushmacca| rishibhiradatprishnibhih| apeta vita vi ca sarpatatah| ye 'tra stha purana ye ca
    nutanah| ahobhiradbhiraktu yamo dadatvavasanamasmai| nri munantu nripatvaryah| akrishta ye ca krishtajah|
    kumarishu kaninishu| jarinishu ca ye hitah| retah pita andapitah| angareshu ca ye hutah| ubhaya putrapautrakan|
    yuve 'ham yamarajagan| shataminnu sharadah||119|| ado yadbrahma vilabam| pitrinam ca yamasya ca| varunasyashvinoragneh|
    marutam ca vihayasam| kamaprayavanam me astu| sa hyevasmi sanatanah| iti nako brahmishravo rayo dhanam|
    putranapo deviriha rshnim gridhrashirshnim ca| apeto nir shvetakuksham| nijangha shabalodaram| sa
    tan vacyayaya saha| agne nashaya sandrishah| irshyasuye bubhuksham| manyum krityam ca didhire| rathena
    ki shukavata| agne nashaya sandrishah||121|| parjanyaya pragayata| divasputraya midhushe | sa no yavasamicchatu|
    idam vacah parjanyaya svaraje | hrido astvantarantadyuyota| mayobhurvato vishvakrishtayah santvasme|
    supippala oshadhirdevagopah| yo garbhamoshadhinam| gavam krinotyarvatam| parjanyah purushina punarmamaitvindriyam|
    punarayuh punarbhagah| punarbrahmanamaitu ma| punardravinamaitu ma| yanme 'dya retah prithivimaskan|
    yadoshadhirapyasaradyadapah| idam tatpunaradade| dirghayutvaya varcase| yanme retah prasicyate| yanma
    ajayate punah| tena mamamritam kuru| tena suprajasam kuru||123|| 'jayata| tava vaishravanah sada|
    tiro 'dhehi sapatnannah| ye apo 'shnanti kecana| tvashtrim mayam vai sahasravandhuram| purushcakra
    sahasrashvam| asthaya ''yahi no balim| yasmai bhutani balimavahanti| dhanam gavo hasti hiranyamashvan||124||
    asama sumatau yajniyasya| shriyam bibhrato shane ca kraunce ca| mainage ca mahagirau| shatadvattaragamanta|
    sa haryam nagaram tava| iti mantrah 'ta urdhvam| yadi bali t| hiranyanabhaye vitudaye kauberayayam
    balih||125|| sarvabhutadhipataye nama iti| atha bali hritvopatishtheta| kshatram kshatram vai shravanah|
    brahmana vaya smah| namaste astu ma ma hi sih| asmatpravishyannamaddhiti| atha tamagnimadadhita| yasminnetatkarma
    prayunjita| tiro 'dha bhurbhuvah svah| sarvesham lokanamadhipatye sideti| atha tamagnimindhita| yasminnetatkarma
    prayunjita| tiro 'dha bhurbhuvah svah svaha | yasminnasya kale sarva ahutir api brahmanamukhinah|
    tasminnahnah kale prayunjita| parah suptajanadvepi| masma pramadyantamadhyapayet| sarvarthah siddhyante|
    ya evam veda| kshudhyannidama tam| sarvartha na siddhyante| yaste vighatuko bhrata| mamantar tasma
    imamagrapindam juhomi| sa me 'rthanma vivadhit| mayi svaha | rajadhirajaya prasahyasahine shravanaya
    kurmahe| sa me kamankamakamaya mahyam shravano dadatu| kuberaya vaishravanaya| maharajaya namah| ketavo
    arunasashca| rishayo vatarashanah| pratishtha shatadha hi| samahitaso sahasradhayasam| shiva nah shantama
    bhavantu| divya apa oshadhayah| sumridika sarasvati| ma te vyoma sandrishi||129|| samvathsarametadvratam
    caret| dvau va masau| niyamah samasena| tasminniyama visheshah| trishavanamudakopasparshi| caturthakalapanabhaktah
    syat| aharaharva bhaikshamashniyat| audumbaribhih samidbhiragnim paricaret| punarmamaittvindriyami
    tyetenanuvakena| uddhritapariputabhi radbhih karyam kurvita||130|| asancayavan| agnaye vayave suryaya|
    brahmane prajapataye| candramase nakshatrebhyah| ritubhyah samvathsaraya| varunayarunayeti vratahomah|
    pravargyavadadeshah| arunah ka yiran| bhadram karnebhiriti dve japitva||131|| ryo dadyat| shiva nah
    shantametyoshadhiralabhate| sumridiketi bhumim| evamapavarge| dhenurdakshina| ka sam vasashca kshaumam|
    anyadva shuklam| yathashakti va| eva svadhyayadharmena| aranye 'dhiyita| tapasvi punyo bhavati tapasvi
    punyo bhavati||132|| bhadram karnebhih shrinuyama devah| bhadram pashyemakshabhiryajatrah| sthirairangai
    sastanubhih| vyashema devahitam yadayuh| svasti na indro vriddhashravah| svasti nah pusha vishvavedah|
    svasti nastarkshyo arishtanemih| svasti no brihaspatirdadhatu|| ||om shantih shantih shantih|| iti
    shrikrishnayajurvediyataittiriyaranyake prathamah prashnah samaptah||
  devanagari: ॐ भ॒द्रं कर्णे॑भिः शृणु॒याम॑ देवाः। भ॒द्रं प॑श्येमा॒क्षभि॒र्यज॑त्राः। स्थि॒रैरङ्गै स॑स्त॒नूभिः॑।
    व्यशे॑म दे॒वहि॑तं॒ यदायुः॑। स्व॒स्ति न॒ इन्द्रो॑ वृ॒द्धश्र॑वाः। स्व॒स्ति नः॑ पू॒षा वि॒श्ववे॑दाः। स्व॒स्ति
    न॒स्तार्क्ष्यो॒ अरि॑ष्टनेमिः। स्व॒स्ति नो॒ बृह॒स्पति॑र्दधातु॥ ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑॥ भ॒द्रं
