id: govindamadipurushastotram
category: stotram
name:
  english: govindamadipurushastotram
  devanagari: गोविन्दमादिपुरुषस्तोत्रम्
content:
  english: kotishvasheshavasudhadivibhutibhinnam | tadbrahma nishkalamanantamasheshabhutam govindamadipurusham
    tamaham bhajami || 13|| maya hi yasya jagadandashatani sute traigunyatadvishayavedavitayamana | sattvavalambiparasattvavishuddhasattvam
    govindamadipurusham tamaham bhajami || 14|| anandacinmayarasatmakataya manahsu yah praninam pratiphalam
    smaratamupetya | lilayitena bhuvanani jayatyajasram govindamadipurusham tamaham bhajami || 15|| golokanamni
    nijadhamni tale ca tasya devi maheshaharidhamasu teshu teshu | te te prabhavanicaya vihitashca yena
    govindamadipurusham tamaham bhajami || 16|| srishtisthitipralayasadhanashaktireka chayeva yasya bhuvanani
    bibharti durga | icchanurupamapi yasya ca ceshtate sa govindamadipurusham tamaham bhajami || 17||
    kshiram yatha dadhivikaravisheshayogat sanjayate nahi tatah prithagasti hetoh | yatsambhutamapi tatha
    samupaiti karyad govindamadipurusham tamaham bhajami || 18|| diparcireva hi dashantaramabhyupetya
    dipayate vivritahetusamanadharma | yastadrigeva hi ca vishnutaya vibhati govindamadipurusham tamaham
    bhajami || 19|| yah karanarnavajale bhajati sma yoga
  devanagari: कोटिष्वशेषवसुधादिविभूतिभिन्नम् । तद्ब्रह्म निष्कलमनन्तमशेषभूतं गोविन्दमादिपुरुषं तमहं भजामि
    ॥ १३॥ माया हि यस्य जगदण्डशतानि सूते त्रैगुण्यतद्विषयवेदवितायमाना । सत्त्वावलम्बिपरसत्त्वविशुद्धसत्त्वं
    गोविन्दमादिपुरुषं तमहं भजामि ॥ १४॥ आनन्दचिन्मयरसात्मकतया मनःसु यः प्राणिनां प्रतिफलं स्मरतामुपेत्य
    । लीलायितेन भुवनानि जयत्यजस्रं गोविन्दमादिपुरुषं तमहं भजामि ॥ १५॥ गोलोकनाम्नि निजधाम्नि तले च तस्य
    देवि महेशहरिधामसु तेषु तेषु । ते ते प्रभावनिचया विहिताश्च येन गोविन्दमादिपुरुषं तमहं भजामि ॥ १६॥ सृष्टिस्थितिप्रलयसाधनशक्तिरेका
    छायेव यस्य भुवनानि बिभर्ति दुर्गा । इच्छानुरूपमपि यस्य च चेष्टते सा गोविन्दमादिपुरुषं तमहं भजामि ॥
    १७॥ क्षीरं यथा दधिविकारविशेषयोगात् सञ्जायते नहि ततः पृथगस्ति हेतोः । यत्सम्भूतमपि तथा समुपैति कार्याद्
    गोविन्दमादिपुरुषं तमहं भजामि ॥ १८॥ दीपार्चिरेव हि दशान्तरमभ्युपेत्य दीपायते विवृतहेतुसमानधर्मा । यस्तादृगेव
    हि च विष्णुतया विभाति गोविन्दमादिपुरुषं तमहं भजामि ॥ १९॥ यः कारणार्णवजले भजति स्म योग
