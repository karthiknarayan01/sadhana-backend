id: shambhukritam1vishnustotram
category: stotram
name:
  english: shambhukritam1vishnustotram
  devanagari: शम्भुकृतं१विष्णुस्तोत्रम्
content:
  english: 42|| dharanibharaharasuraripujya prakritishesha jagannivasa rama | gunaganavilasaccaracaresha
    trigunatita sanatanagrapujya | nijajanaparirakshitantakare kamalanghre kamaniya padmanabha | kamalakara
    kusheshayadhivasa priyakamonmathana tryadhishavandya || 29
  devanagari: ४२॥ धरणिभरहरासुरारिपूज्य प्रकृतीशेश जगन्निवास राम । गुणगणविलसच्चराचरेश त्रिगुणातीत सनातनाग्रपूज्य
    । निजजनपरिरक्षितान्तकारे कमलाङ्घ्रे कमनीय पद्मनाभ । कमलकर कुशेशयाधिवास प्रियकामोन्मथन त्र्यधीशवन्द्य
    ॥ २९
meaning: {}
