id: mundaka-upanishad-mundaka-1-section-1
category: stotram
name:
  english: Mundaka Upanishad - Mundaka 1, Section 1
content:
  english: shshrinuyama devah | bhadra ryajatrah | sthirairangai stushtuvagm sastanubhih | vyashema devahitam
    ya~dayuh | svasti na indro vriddhashravah | svasti nah pusha vishvavedah | svasti nastarkshyo arishtanemih
    | svasti no brihaspati mbrahmane namah || || prathamamundake prathamah khandah || o ssambabhuva vishvasya
    karta bhuvanasya gopta | sa brahmavidyam sarvavidyapratishthamatharvaya jyeshthaputraya praha || 'tharva
    tam purovacangire brahmavidyam | sa bharadvajaya satyavahaya praha bharadvajo || shaunako ha vai mahashalo
    vi~dhivadupasannah papraccha | kasminnu bhagavo vijnate sarvamidam || tasmai sa hovaca | dve vidye
    veditavye iti ha sma yadbrahmavido vadanti para caivapara ca || || tatrapara rigvedo yajurveda 'tharvavedah
    shiksha kalpo vyakarana nchando jyotishamiti | atha para yaya tadaksharamadhigamyate || || yattadadreshyamagrahyamagotramavarna
    ntadapanipadam | nityam vi~bhum sarvagatam susukshmam tadavyayam mparipashyanti dhirah || ssrijate
    grihnate ca yatha prithivyamoshadhaya ssambhavanti | yatha satah purusha thsambhavatiha vishvam ||
    || tapasa ciyate brahma tato 'nnamabhijayate | anna lo~kah karmasu camritam || ssarvavidyasya jnanamaya
    ntapah | tasmadetadbrahma nama rupamanna || || iti mundakopanishadi prathamamundake prathamah khandah
    ||
  devanagari: श्शृणु॒याम॑ देवाः । भ॒द्र र्यज॑त्राः । स्थि॒रैरङ्गै स्तुष्टु॒वाग्ं स॑स्त॒नूभिः॑ । व्यशे॑म
    दे॒वहि॑तं॒ यँदायुः॑ । स्व॒स्ति न॒ इन्द्रो॑ वृ॒द्धश्र॑वाः । स्व॒स्ति नः॑ पू॒षा वि॒श्ववे॑दाः । स्व॒स्ति
    न॒स्तार्क्ष्यो॒ अरि॑ष्टनेमिः । स्व॒स्ति नो॒ बृह॒स्पति॑ म्ब्रह्मणे नमः ॥ ॥ प्रथममुण्डके प्रथमः खण्डः
    ॥ ओ स्सम्बभूव विश्वस्य कर्ता भुवनस्य गोप्ता । स ब्रह्मविद्यां सर्वविद्याप्रतिष्ठामथर्वाय ज्येष्ठपुत्राय
    प्राह ॥ ऽथर्वा तां पुरोवाचाङ्गिरे ब्रह्मविद्याम् । स भारद्वाजाय सत्यवाहाय प्राह भारद्वाजो ॥ शौनको
    ह वै महाशालो विँधिवदुपसन्नः पप्रच्छ । कस्मिन्नु भगवो विज्ञाते सर्वमिदं ॥ तस्मै स होवाच । द्वे विद्ये
    वेदितव्ये इति ह स्म यद्ब्रह्मविदो वदन्ति परा चैवापरा च ॥ ॥ तत्रापरा ऋग्वेदो यजुर्वेद ऽथर्ववेदः शिक्षा
    कल्पो व्याकरण ञ्छन्दो ज्योतिषमिति । अथ परा यया तदक्षरमधिगम्यते ॥ ॥ यत्तदद्रेश्यमग्राह्यमगोत्रमवर्ण
    न्तदपाणिपादम् । नित्यं विँभुं सर्वगतं सुसूक्ष्मं तदव्ययं म्परिपश्यन्ति धीराः ॥ स्सृजते गृह्णते च यथा
    पृथिव्यामोषधय स्सम्भवन्ति । यथा सतः पुरुषा थ्सम्भवतीह विश्वम् ॥ ॥ तपसा चीयते ब्रह्म ततो ऽन्नमभिजायते
    । अन्ना लोँकाः कर्मसु चामृतम् ॥ स्सर्वविद्यस्य ज्ञानमय न्तपः । तस्मादेतद्ब्रह्म नाम रूपमन्न ॥ ॥ इति
    मुण्डकोपनिषदि प्रथममुण्डके प्रथमः खण्डः ॥
