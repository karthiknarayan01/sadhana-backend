id: sita-2
category: upanishad
name:
  english: sita
  devanagari: सित
content:
  english: samanyena prithakprithak | ekavimshatishakhayamrigvedah parikirtitah | shatam ca navashakhasu
    yajushameva janmanam | samnah sahasrashakhah syuh pancashakha atharvanah | vaikhanasamatastasminnadau
    pratyakshadarshanam | smaryate munibhirnityam vaikhanasamatah param | kalpo vyakaranam shiksha niruktam
    jyotisham chanda etani shadangani || upangamayanam caiva mimamsanyayavistarah | dharmajnasevitartham
    ca vedavedo'dhikam tatha | nibandhah sarvashakha ca samayacarasangatih | dharmashastram maharshinamantahkaranasambhritam
    | itihasapuranakhyamupangam ca prakirtitam | vastuvedo dhanurvedo gandharvashca tatha mune | ayurvedashca
    pancaite upavedah prakirtitah | dando nitishca varta ca vidya vayujayah parah | ekavimshatibhedo'yam
    svaprakashah prakirtitah | vaikhanasarisheh purvam vishnorvani samudbhavet | trayirupena sankalpya
    vaikhanasarisheh pura | udito yadrishah purvam tadrisham sha
  devanagari: सामान्येन पृथक्पृथक् । एकविंशतिशाखायामृग्वेदः परिकीर्तितः । शतं च नवशाखासु यजुषामेव जन्मनाम्
    । साम्नः सहस्रशाखाः स्युः पञ्चशाखा अथर्वणः । वैखानसमतस्तस्मिन्नादौ प्रत्यक्षदर्शनम् । स्मर्यते मुनिभिर्नित्यं
    वैखानसमतः परम् । कल्पो व्याकरणं शिक्षा निरुक्तं ज्योतिषं छन्द एतानि षडङ्गानि ॥ उपाङ्गमयनं चैव मीमांसान्यायविस्तरः
    । धर्मज्ञसेवितार्थं च वेदवेदोऽधिकं तथा । निबन्धाः सर्वशाखा च समयाचारसङ्गतिः । धर्मशास्त्रं महर्षिणामन्तःकरणसम्भृतम्
    । इतिहासपुराणाख्यमुपाङ्गं च प्रकीर्तितम् । वास्तुवेदो धनुर्वेदो गान्धर्वश्च तथा मुने । आयुर्वेदश्च
    पञ्चैते उपवेदाः प्रकीर्तिताः । दण्डो नीतिश्च वार्ता च विद्या वायुजयः परः । एकविंशतिभेदोऽयं स्वप्रकाशः
    प्रकीर्तितः । वैखानसऋषेः पूर्वं विष्णोर्वाणी समुद्भवेत् । त्रयीरूपेण सङ्कल्प्य वैखानसऋषेः पुरा । उदितो
    यादृशः पूर्वं तादृशं श
