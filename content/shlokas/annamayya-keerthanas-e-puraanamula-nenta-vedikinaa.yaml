id: annamayya-keerthanas-e-puraanamula-nenta-vedikinaa
category: stotram
name:
  english: Annamayya Keerthanas E Puraanamula Nenta Vedikinaa
content:
  english: adi pallavi epuranamula nènta vèdikina | shripatidasulu cèda rènnadunu || varivirahitamulu
    avi gònnallaku | virasambulu mari viphalamulu | narahari gòli citu namminavaramulu | niratamu lènnadu
    nèlavulu cèdavu || epuranamula nènta vèdikina kamalakshuni mati ganani caduvulu | kumatambulu bahukupathamulu
    | jamali nacyutuni samaradhanalu | vimalamule kani vitathamugavu || epuranamula nènta vèdikina shrivallabhugati
    jerani padavulu | davatulu kapatadharmamulu | shrivenkatapati sevincunevalu | pavanamu ladhika bhagyapu
    sirulu || epuranamula nènta vèdikina
  devanagari: आदि पल्लवि एपुराणमुल नॆन्त वॆदिकिना । श्रीपतिदासुलु चॆड रॆन्नडुनु ॥ वारिविरहितमुलु अवि गॊन्नाल्लकु
    । विरसम्बुलु मरि विफलमुलु । नरहरि गॊलि चिटु नम्मिनवरमुलु । निरतमु लॆन्नडु नॆलवुलु चॆडवु ॥ एपुराणमुल
    नॆन्त वॆदिकिना कमलाक्षुनि मति गाननि चदुवुलु । कुमतम्बुलु बहुकुपथमुलु । जमलि नच्युतुनि समाराधनलु ।
    विमलमुले कानि वितथमुगावु ॥ एपुराणमुल नॆन्त वॆदिकिना श्रीवल्लभुगति जेरनि पदवुलु । दावतुलु कपटधर्ममुलु
    । श्रीवेङ्कटपति सेविञ्चुनेवलु । पावनमु लधिक भाग्यपु सिरुलु ॥ एपुराणमुल नॆन्त वॆदिकिना
