id: narayana-ashtakshari-stuti
category: stotram
name:
  english: Narayana Ashtakshari Stuti
  devanagari: नारायणाष्टाक्षरीस्तुतिः
content:
  english: om namo narayanaya | om- namah pranavarthartha sthulasukshma ksharakshara | vyaktavyakta kalatita
    omkaraya namo namah || 1|| na- namo devadidevaya dehasancarahetave | daityasanghavinashaya nakaraya
    namo namah || 2|| mo- mohanam vishvarupam ca shishtacarasuposhitam | mohavidhvamsakam vande mokaraya
    namo namah || 3|| na- narayanaya navyaya narasimhaya namine | nadaya nadine tubhyam nakaraya namo
    namah || 4|| ra- ramacandram raghupatim pitrajnaparipalakam | kausalyatanayam vande rakaraya namo
    namah || 5|| ya- yajnaya yajnagamyaya yajnarakshakaraya ca | yajnangarupine tubhyam yakaraya namo
    namah || 6|| na- nakaram lokavikhyatam nanajanmaphalapradam | nanabhishtapradam vande nakaraya namo
    namah || 7|| ya- yajnakartre yajnabhartre yajnarupaya te namah | sujnanagocaraya'stu yakaraya namo
    namah || 8|| omkaramantrasamyuktam nityam dhyayanti yoginah | (omkarabindusamyuktam) kamadam mokshadam
    tasmai omkaraya namo namah || 9|| narayanah param brahma narayanah param tapah | narayanah paro devah
    sarvam narayanassada || 10|| om namo narayanaya | iti narayanashtaksharistutih samapta |
  devanagari: ॐ नमो नारायणाय । ॐ- नमः प्रणवार्थार्थ स्थूलसूक्ष्म क्षराक्षर । व्यक्ताव्यक्त कलातीत ॐकाराय
    नमो नमः ॥ १॥ न- नमो देवादिदेवाय देहसञ्चारहेतवे । दैत्यसङ्घविनाशाय नकाराय नमो नमः ॥ २॥ मो- मोहनं विश्वरूपं
    च शिष्टाचारसुपोषितम् । मोहविध्वंसकं वन्दे मोकाराय नमो नमः ॥ ३॥ ना- नारायणाय नव्याय नरसिंहाय नामिने
    । नादाय नादिने तुभ्यं नाकाराय नमो नमः ॥ ४॥ रा- रामचन्द्रं रघुपतिं पित्राज्ञापरिपालकम् । कौसल्यातनयं
    वन्दे राकाराय नमो नमः ॥ ५॥ य- यज्ञाय यज्ञगम्याय यज्ञरक्षाकराय च । यज्ञाङ्गरूपिणे तुभ्यं यकाराय नमो
    नमः ॥ ६॥ णा- णाकारं लोकविख्यातं नानाजन्मफलप्रदम् । नानाभीष्टप्रदं वन्दे णाकाराय नमो नमः ॥ ७॥ य- यज्ञकर्त्रे
    यज्ञभर्त्रे यज्ञरूपाय ते नमः । सुज्ञानगोचरायाऽस्तु यकाराय नमो नमः ॥ ८॥ ॐकारमन्त्रसंयुक्तं नित्यं ध्यायन्ति
    योगिनः । (ॐकारबिन्दुसंयुक्तं) कामदं मोक्षदं तस्मै ॐकाराय नमो नमः ॥ ९॥ नारायणः परं ब्रह्म नारायणः परं
    तपः । नारायणः परो देवः सर्वं नारायणस्सदा ॥ १०॥ ॐ नमो नारायणाय । इति नारायणाष्टाक्षरीस्तुतिः समाप्ता
    ।
