id: pundarikakritam1vishnustotram
category: stotram
name:
  english: pundarikakritam1vishnustotram
  devanagari: पुण्डरीककृतं१विष्णुस्तोत्रम्
content:
  english: pundarikakritam 1 vishnustotram pundarika uvaca | namaste jagadadhara sargasthityantakarana
    | narayana namaste'stu paramatmanparayana || 21|| paramarthastvamevaiko bhavapyayavivarjitah | nityanandasvarupam
    tvam vidanti dhyanacakshushah || 22|| cinmatram jagatamishamadhishthanam paratparam | katham nu mudhahridayastvam
    jananti sunirmalam || 23|| kamarthalipsasambhratacetaso'tyantaduhkhinah | gatagatapathe shrantah sukhabhajah
    kadacana || 24|| anukampaya mam natha sudinam sharanagatam | mudham dushkritakarmanam patitam bhavasagare
    || 25|| ko'nyastvatsadrisho bandhurbrahmande natha varttate | svakarttavyanapeksho yo dinanathadayalukah
    || 26|| uccavacabhramadduhkham jalayantraghatimiva | ajasramadhikarttaram paritrahi kripambudhe ||
    27|| yogakshemabhisandhana ye mudhastvamupasate | lilavimuktidam te vai tvanmayaparimohitah || 28||
    narayaneti tvannama kirtitam tu yadricchaya | tvatto'dhikam jagannatha caturvargaikasadhanam || 29||
    tvam tu taistaih prithagyajnaistastah siddhih prayacchasi | tvamekah sharanam natha patitanam bhavarnave
    || 2
  devanagari: पुण्डरीककृतं १ विष्णुस्तोत्रम् पुण्डरीक उवाच । नमस्ते जगदाधार सर्गस्थित्यन्तकारण । नारायण
    नमस्तेऽस्तु परमात्मन्परायण ॥ २१॥ परमार्थस्त्वमेवैको भवाप्ययविवर्जितः । नित्यानन्दस्वरूपं त्वां विदन्ति
    ध्यानचक्षुषः ॥ २२॥ चिन्मात्रं जगतामीशमधिष्ठानं परात्परम् । कथं नु मूढहृदयास्त्वां जानन्ति सुनिर्मलम्
    ॥ २३॥ कामार्थलिप्सासम्भ्रातचेतसोऽत्यन्तदुःखिनः । गतागतपथे श्रान्ताः सुखभाजः कदाचन ॥ २४॥ अनुकम्पय मां
    नाथ सुदीनं शरणागतम् । मूढं दुष्कृतकर्माणं पतितं भवसागरे ॥ २५॥ कोऽन्यस्त्वत्सदृशो बन्धुर्ब्रह्माण्डे
    नाथ वर्त्तते । स्वकर्त्तव्यानपेक्षो यो दीनानाथदयालुकः ॥ २६॥ उच्चावचभ्रमाद्दुःखं जलयन्त्रघटीमिव । अजस्रमधिकर्त्तारं
    परित्राहि कृपाम्बुधे ॥ २७॥ योगक्षेमाभिसन्धाना ये मूढास्त्वामुपासते । लीलाविमुक्तिदं ते वै त्वन्मायापरिमोहिताः
    ॥ २८॥ नारायणेति त्वन्नाम कीर्तितं तु यदृच्छया । त्वत्तोऽधिकं जगन्नाथ चतुर्वर्गैकसाधनम् ॥ २९॥ त्वं
    तु तैस्तैः पृथग्यज्ञैस्तास्ताः सिद्धीः प्रयच्छसि । त्वमेकः शरणं नाथ पतितानां भवार्णवे ॥ २
