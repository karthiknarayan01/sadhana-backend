id: sri-hanuman-badabanala-stotram
category: stotram
name:
  english: Sri Hanuman Badabanala Stotram
content:
  english: om asya shri hanumadbadabanala stotra mahamantrasya shriramacandra rishih shri badabanala hanuman
    devata mama samasta roga prashamanartham ayurarogya aishvaryabhivriddhyartham samasta papakshayartham
    shrisitaramacandra prityartham hanumadbadabanala stotra japam karishye | om hram hrim om namo bhagavate
    shrimahahanumate prakata parakrama sakala dinmandala yashovitana dhavalikrita jagattritaya vajradeha
    uma analamantra udadhibandhana shriramalakshmananandakara kapisainyaprakara sugriva sahayyakarana
    gambhiranada sarvapapagrahavarana om hram hrim om namo bhagavate mahaviraya sarvagrahamandala sarvabhutamandala
    sarvapishacamandaloccatana bhutajvara ekahikajvara dvyahikajvara tryahikajvara caturthikajvara santapajvara
    vishamajvara tapajvara maheshvara vaishnava jvaran chindi chindi yaksha rakshasa bhutapretapishacan
    uccataya uccataya om hram hrim om namo bhagavate shrimahahanumate om hram hrim hrum hraim hraum hrah
    am ham ham ham aum saum ehi ehi om ham om ham om ham om namo bhagavate shrimahahanumate shravanacakshurbhutanam
    shakini dakini vishama dushtanam sarvavisham hara hara akasha bhuvanam bhedaya bhedaya chedaya chedaya
    maraya maraya shoshaya shoshaya mohaya mohaya jvalaya jvalaya praharaya praharaya sakalamayam bhedaya
    bhedaya om hram hrim om namo bhagavate shrimahahanumate sarvagrahoccatana parabalam kshobhaya kshobhaya
    sakalabandhana mokshanam kuru kuru shirahshula gulmashula sarvashulannirmulaya nirmulaya naga pasha
    ananta vasuki takshaka karkotaka kaliyan yaksha kula jalagata bilagata ratrincara divacara sarvannirvisham
    kuru kuru svaha rajabhaya corabhaya parayantra paramantra paratantra paravidya chedaya chedaya svamantra
    svayantra svavidyah prakataya prakataya sarvarishtannashaya nashaya sarvashatrunnashaya nashaya asadhyam
    sadhaya sadhaya hum phat svaha | iti shri vibhishanakrita hanumadbadabanala stotram |
  devanagari: ॐ अस्य श्री हनुमद्बडबानल स्तोत्र महामन्त्रस्य श्रीरामचन्द्र ऋषिः श्री बडबानल हनुमान् देवता
    मम समस्त रोग प्रशमनार्थं आयुरारोग्य ऐश्वर्याभिवृद्ध्यर्थं समस्त पापक्षयार्थं श्रीसीतारामचन्द्र प्रीत्यर्थं
    हनुमद्बडबानल स्तोत्र जपं करिष्ये । ॐ ह्रां ह्रीं ॐ नमो भगवते श्रीमहाहनुमते प्रकट पराक्रम सकल दिङ्मण्डल
    यशोवितान धवलीकृत जगत्त्रितय वज्रदेह उमा अनलमन्त्र उदधिबन्धन श्रीरामलक्ष्मणानन्दकर कपिसैन्यप्राकार
    सुग्रीव साहाय्यकरण गम्भीरनाद सर्वपापग्रहवारण ॐ ह्रां ह्रीं ॐ नमो भगवते महावीराय सर्वग्रहमण्डल सर्वभूतमण्डल
    सर्वपिशाचमण्डलोच्चाटन भूतज्वर एकाहिकज्वर द्व्याहिकज्वर त्र्याहिकज्वर चातुर्थिकज्वर सन्तापज्वर विषमज्वर
    तापज्वर माहेश्वर वैष्णव ज्वरान् छिन्दि छिन्दि यक्ष राक्षस भूतप्रेतपिशाचान् उच्चाटय उच्चाटय ॐ ह्रां
    ह्रीं ॐ नमो भगवते श्रीमहाहनुमते ॐ ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः आं हां हां हां औं सौं एहि एहि
    ॐ हं ॐ हं ॐ हं ॐ नमो भगवते श्रीमहाहनुमते श्रवणचक्षुर्भूतानां शाकिनी डाकिनी विषम दुष्टानां सर्वविषं
    हर हर आकाश भुवनं भेदय भेदय छेदय छेदय मारय मारय शोषय शोषय मोहय मोहय ज्वालय ज्वालय प्रहारय प्रहारय सकलमायां
    भेदय भेदय ॐ ह्रां ह्रीं ॐ नमो भगवते श्रीमहाहनुमते सर्वग्रहोच्चाटन परबलं क्षोभय क्षोभय सकलबन्धन मोक्षणं
    कुरु कुरु शिरःशूल गुल्मशूल सर्वशूलान्निर्मूलय निर्मूलय नाग पाश अनन्त वासुकि तक्षक कर्कोटक कालीयान्
    यक्ष कुल जलगत बिलगत रात्रिञ्चर दिवाचर सर्वान्निर्विषं कुरु कुरु स्वाहा राजभय चोरभय परयन्त्र परमन्त्र
    परतन्त्र परविद्या छेदय छेदय स्वमन्त्र स्वयन्त्र स्वविद्यः प्रकटय प्रकटय सर्वारिष्टान्नाशय नाशय सर्वशत्रून्नाशय
    नाशय असाध्यं साधय साधय हुं फट् स्वाहा । इति श्री विभीषणकृत हनुमद्बडबानल स्तोत्रम् ।
