    वा ए॒ता ह्म॒णाः पु॒रा विदाम॑क्र॒ त्तेषा॒ग्ं॒ सर्वा॒ दिशो॒ यस्यै॒ ते गृ॒ह्यन्ते॒ ज्यैष्ठ्य॑मे॒व ग॑च्छत्य॒भि
    दिशो॑ जयति॒ पञ्च॑ गृह्यन्ते॒ पञ्च॒ दिश॒ वृ॑द्ध्नुवन्ति॒ नव॑नव गृह्यन्ते॒ नव॒ वै पुरु॑षे प्रा॒णाः प्रा॒णाने॒व
    यज॑मानेषु दधति प्राय॒णीये॑ चोदय॒नीये॑ च गृह्यन्ते प्रा॒णा वै प्रा॑णग्र॒हाः प्रा॒णा वै प्रा॑णग्र॒हाः
    प्रा॒णैरे॒व प्र॒यन्ति॑ प्रा॒णैरुद्य॑न्ति दश॒मे न्गृह्यन्ते प्रा॒णा वै प्रा॑णग्र॒हाः प्रा॒णेभ्यः॒ खलु॒
    वा ए॒त त्प्र॒जा य॑न्ति॒ यद्वा॑मदे॒व्यं योँने॒श्च्यव॑ते दश॒मे प्र दे॒वन्दे॒व्या धि॒या भर॑ता जा॒तवे॑दसम्
    । ह॒व्या नो॑ वक्षदानु॒षक् ॥ अ॒यमु॒ ष्य प्रदे॑व॒युर् होता॑ य॒ज्ञाय॑ नीयते । रथो॒ न योर॒भीवृ॑तो॒ घृणी॑वान्
    चेतति॒ त्मना ॥ अ॒यम॒ग्निरु॑रुष्यत्य॒मृता॑दिव॒ जन्म॑नः । सह॑सश्चि॒ न्दे॒वो जी॒वात॑वे कृ॒तः ॥ इडा॑यास्त्वा
    प॒दे व॒य न्नाभा॑ पृथि॒व्या अधि॑ । जात॑वेदो॒ नि धी॑म॒ह्यग्ने॑ ह॒व्याय॒ वोढ॑वे । स्स्वनीक दे॒वैरूर्णा॑वन्त
    ङ्घृ॒तव॑न्तग्ं सवि॒त्रे य॒ज्ञ न्न॑य॒ यज॑मानाय सा॒धु ॥ सीद॑ होत॒ स्स्व उ॑ लो॒के चि॑कि॒त्वान् थ्सा॒दया॑
    य॒ज्ञग्ं सु॑कृ॒तस्य॒ योनौ ह॒विषा॑ यजा॒स्यग्ने॑ बृ॒ह द्यज॑माने॒ वयो॑ धाः ॥ नि होता॑ होतृ॒षद॑ने॒ विदा॑नस्त्वे॒षो
    दी॑दि॒वाग्ं अ॑सद थ्सु॒दक्षः॑ । अद॑ब्धव्रत श्शुचि॑जिह्वो अ॒ग्निः ॥ त्व उ॒ नः॒ प॒र॒स्पास्त्वं मु॑ नः
    पर॒स्पास्त्वं वँस्य॒ आ वृ॑षभ प्रणे॒ता । अग्ने॑ तो॒कस्य॑ न॒स्तने॑ त॒नूना॒मप्र॑युच्छ॒ न्दीद्य॑द्बोधि
    गो॒पाः ॥ अ॒भि त्वा॑ देव सवित॒रीशा॑नं॒ न्भा॒गमी॑महे ॥ म॒ही द्यौः पृ॑थि॒वी च॑न इ॒मं म्मि॑मिक्षताम् ।
    पि॒पृ॒ता न्नो॒ भरी॑मभिः ॥ त्वाम॑ग्ने॒ पुष्क॑रा॒दद्ध्यथ॑र्वा॒ निर॑मन्थत । मू॒र्ध्नो विश्व॑स्य वा॒घतः॑
    ॥ तमु॑ त्वा॒ द॒द्ध्यङ्ङृषिः॑ त्वा द॒द्ध्यङ्ङृषिः॑ पु॒त्र ई॑धे॒ अथ॑र्वणः । वृ॒त्र॒हण॑ म्पुरन्द॒रम्
    ॥ तमु॑ त्वा पा॒थ्यो वृषा॒ समी॑धे दस्यु॒हन्त॑मम् । ध॒न॒ ञ्ज॒यग्ं रणे॑रणे ॥ उ॒त ब्रु॑वन्तु ज॒न्तव॒ उद॒ग्निर्वृ॑त्र॒हा
    ञ्ज॒यो रणे॑रणे ॥ आ यग्ं हस्ते॒ न खा॒दिन॒ग्ं॒ शिशु॑ न्न बिभ्र॑ति । वि॒शाम॒ग्निग्ग् स्व॑द्ध्व॒रम् ॥
    प्रदे॒व न्दे॒ववी॑तये॒ भर॑ता वसु॒वित्त॑मम् । आस्वे योनौ॒ नि षी॑दतु ॥ आ ञ्जा॒तवे॑दसि प्रि॒यग्ं शि॑शी॒ता
    ऽति॑थिम् । स्यो॒न आ गृ॒हप॑तिम् ॥ अ॒ग्निना॒ स्समि॑द्ध्यते क॒विर्गृ॒हप॑ति॒र्युवा ह्य॑ग्ने अ॒ग्निना॒
    विप्रो॒ विप्रे॑ण॒ सन् थ्स॒ता । सखा॒ सख्या॑ समि॒द्ध्यसे म्म॑र्जयन्त सु॒क्रतु॑ म्पुरो॒यावा॑नमा॒जिषु॑
    । स्वेषु॒ क्षये॑षु वा॒जिन म् ॥ य॒ज्ञेन॑ य॒ज्ञम॑यजन्त दे॒वास्तानि॒ धर्मा॑णि प्रथ॒मान्या॑सन्न् । ते
    ह॒ नाक॑ म्महि॒मानः॑ सचन्ते॒ यत्र॒ पूर्वे॑ सा॒द्ध्या ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्तृतीयकाण्डे
    पञ्चमः प्रश्न
