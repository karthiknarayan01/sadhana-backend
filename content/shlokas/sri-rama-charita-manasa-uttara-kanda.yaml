    कौ तापस ग्याता। कौ धनवन्त सूर कौ दाता ॥ कौ सर्बग्य धर्मरत कोई। सब पर पितहि प्रीति सम होई ॥ कौ पितु
    भगत बचन मन कर्मा। सपनेहुँ जान न दूसर धर्मा ॥ सो सुत प्रिय पितु प्रान समाना। जद्यपि सो सब भाँति अयाना
    ॥ एहि बिधि जीव चराचर जेते। त्रिजग देव नर असुर समेते ॥ अखिल बिस्व यह मोर उपाया। सब पर मोहि बराबरि दाया
    ॥ तिन्ह महँ जो परिहरि मद माया। भजै मोहि मन बच अरू काया ॥ दो पुरूष नपुंसक नारि वा जीव चराचर कोइ। सर्ब
    भाव भज कपट तजि मोहि परम प्रिय सोइ ॥ सत्य कहुँ खग तोहि सुचि सेवक मम प्रानप्रिय। अस बिचारि भजु मोहि
    परिहरि आस भरोस सब ॥ ॥ कबहूँ काल न ब्यापिहि तोही। सुमिरेसु भजेसु निरन्तर मोही ॥ प्रभु बचनामृत सुनि
    न अघ् ँ। तनु पुलकित मन अति हरष् ँ ॥ सो सुख जानि मन अरु काना। नहिं रसना पहिं जाइ बखाना ॥ प्रभु सोभा
    सुख जानहिं नयना। कहि किमि सकहिं तिन्हहि नहिं बयना ॥ बहु बिधि मोहि प्रबोधि सुख देई। लगे करन सिसु कौतुक
    तेई ॥ सजल नयन कछु मुख करि रूखा। चिति मातु लागी अति भूखा ॥ देखि मातु आतुर उठि धाई। कहि मृदु बचन लिए
    उर लाई ॥ गोद राखि कराव पय पाना। रघुपति चरित ललित कर गाना ॥ सो जेहि सुख लागि पुरारि असुभ बेष कृत सिव
    सुखद। अवधपुरी नर नारि तेहि सुख महुँ सन्तत मगन ॥ ॥ सोइ सुख लवलेस जिन्ह बारक सपनेहुँ लहेउ। ते नहिं गनहिं
    खगेस ब्रह्मसुखहि सज्जन सुमति ॥ ॥ मैं पुनि अवध रहेउँ कछु काला। देखेउँ बालबिनोद रसाला ॥ राम प्रसाद भगति
    बर पायुँ। प्रभु पद बन्दि निजाश्रम आयुँ ॥ तब ते मोहि न ब्यापी माया। जब ते रघुनायक अपनाया ॥ यह सब गुप्त
    चरित मैं गावा। हरि मायाँ जिमि मोहि नचावा ॥ निज अनुभव अब कहुँ खगेसा। बिनु हरि भजन न जाहि कलेसा ॥ राम
    कृपा बिनु सुनु खगराई। जानि न जाइ राम प्रभुताई ॥ जानें बिनु न होइ परतीती। बिनु परतीति होइ नहिं प्रीती
    ॥ प्रीति बिना नहिं भगति दिढ़आई। जिमि खगपति जल कै चिकनाई ॥ सो बिनु गुर होइ कि ग्यान ग्यान कि होइ बिराग
    बिनु। गावहिं बेद पुरान सुख कि लहिअ हरि भगति बिनु ॥ ॥ कौ बिश्राम कि पाव तात सहज सन्तोष बिनु। चलै कि
    जल बिनु नाव कोटि जतन पचि पचि मरिअ ॥ ॥ बिनु सन्तोष न काम नसाहीं। काम अछत सुख सपनेहुँ नाहीम् ॥ राम भजन
    बिनु मिटहिं कि कामा। थल बिहीन तरु कबहुँ कि जामा ॥ बिनु बिग्यान कि समता आवि। कौ अवकास कि नभ बिनु पावि
    ॥ श्रद्धा बिना धर्म नहिं होई। बिनु महि गन्ध कि पावि कोई ॥ बिनु तप तेज कि कर बिस्तारा। जल बिनु रस कि
    होइ संसारा ॥ सील कि मिल बिनु बुध सेवकाई। जिमि बिनु तेज न रूप गोसाई ॥ निज सुख बिनु मन होइ कि थीरा।
    परस कि होइ बिहीन समीरा ॥ कवनिउ सिद्धि कि बिनु बिस्वासा। बिनु हरि भजन न भव भय नासा ॥ दो बिनु बिस्वास
    भगति नहिं तेहि बिनु द्रवहिं न रामु। राम कृपा बिनु सपनेहुँ जीव न लह बिश्रामु ॥ अस बिचारि मतिधीर तजि
    कुतर्क संसय सकल। भजहु राम रघुबीर करुनाकर सुन्दर सुखद ॥ ॥ निज मति सरिस नाथ मैं गाई। प्रभु प्रताप महिमा
    खगराई ॥ कहेउँ न कछु करि जुगुति बिसेषी। यह सब मैं निज नयनन्हि देखी ॥ महिमा नाम रूप गुन गाथा। सकल अमित
    अनन्त रघुनाथा ॥ निज निज मति मुनि हरि गुन गावहिं। निगम सेष सिव पार न पावहिम् ॥ तुम्हहि आदि खग मसक प्रजन्ता।
    नभ उड़आहिं नहिं पावहिं अन्ता ॥ तिमि रघुपति महिमा अवगाहा। तात कबहुँ कौ पाव कि थाहा ॥ रामु काम सत कोटि
    सुभग तन। दुर्गा कोटि अमित अरि मर्दन ॥ सक्र कोटि सत सरिस बिलासा। नभ सत कोटि अमित अवकासा ॥ दो मरुत कोटि
    सत बिपुल बल रबि सत कोटि प्रकास। ससि सत कोटि सुसीतल समन सकल भव त्रास ॥ ॥ काल कोटि सत सरिस अति दुस्तर
    दुर्ग दुरन्त। धूमकेतु सत कोटि सम दुराधरष भगवन्त ॥ ॥ प्रभु अगाध सत कोटि पताला। समन कोटि सत सरिस कराला
    ॥ तीरथ अमित कोटि सम पावन। नाम अखिल अघ पूग नसावन ॥ हिमगिरि कोटि अचल रघुबीरा। सिन्धु कोटि सत सम गम्भीरा
    ॥ कामधेनु सत कोटि समाना। सकल काम दायक भगवाना ॥ सारद कोटि अमित चतुराई। बिधि सत कोटि सृष्टि निपुनाई
    ॥ बिष्नु कोटि सम पालन कर्ता। रुद्र कोटि सत सम संहर्ता ॥ धनद कोटि सत सम धनवाना। माया कोटि प्रपञ्च निधाना
    ॥ भार धरन सत कोटि अहीसा। निरवधि निरुपम प्रभु जगदीसा ॥ छं निरुपम न उपमा आन राम समान रामु निगम कहै।
    जिमि कोटि सत खद्योत सम रबि कहत अति लघुता लहै ॥ एहि भाँति निज निज मति बिलास मुनिस हरिहि बखानहीं। प्रभु
    भाव गाहक अति कृपाल सप्रेम सुनि सुख मानहीम् ॥ दो रामु अमित गुन सागर थाह कि पावि कोइ। सन्तन्ह सन जस
    किछु सुनेउँ तुम्हहि सुनायुँ सोइ ॥ भाव बस्य भगवान सुख निधान करुना भवन। तजि ममता मद मान भजिअ सदा सीता
    रवन ॥ ॥ सुनि भुसुण्डि के बचन सुहाए। हरषित खगपति पङ्ख फुलाए ॥ नयन नीर मन अति हरषाना। श्रीरघुपति प्रताप
    उर आना ॥ पाछिल मोह समुझि पछिताना। ब्रह्म अनादि मनुज करि माना ॥ पुनि पुनि काग चरन सिरु नावा। जानि राम
    सम प्रेम बढ़आवा ॥ गुर बिनु भव निधि तरि न कोई। जौं बिरञ्चि सङ्कर सम होई ॥ संसय सर्प ग्रसेउ मोहि ताता।
    दुखद लहरि कुतर्क बहु ब्राता ॥ तव सरूप गारुड़इ रघुनायक। मोहि जिआयु जन सुखदायक ॥ तव प्रसाद मम मोह नसाना।
    राम रहस्य अनूपम जाना ॥ दो ताहि प्रसंसि बिबिध बिधि सीस नाइ कर जोरि। बचन बिनीत सप्रेम मृदु बोलेउ गरुड़
    बहोरि ॥ ॥ प्रभु अपने अबिबेक ते बूझुँ स्वामी तोहि। कृपासिन्धु सादर कहहु जानि दास निज मोहि ॥ ॥ तुम्ह
    सर्बग्य तन्य तम पारा। सुमति सुसील सरल आचारा ॥ ग्यान बिरति बिग्यान निवासा। रघुनायक के तुम्ह प्रिय दासा
    ॥ कारन कवन देह यह पाई। तात सकल मोहि कहहु बुझाई ॥ राम चरित सर सुन्दर स्वामी। पायहु कहाँ कहहु नभगामी
    ॥ नाथ सुना मैं अस सिव पाहीं। महा प्रलयहुँ नास तव नाहीम् ॥ मुधा बचन नहिं ईस्वर कही। सौ मोरें मन संसय
    अही ॥ अग जग जीव नाग नर देवा। नाथ सकल जगु काल कलेवा ॥ अण्ड कटाह अमित लय कारी। कालु सदा दुरतिक्रम भारी
    ॥ सो तुम्हहि न ब्यापत काल अति कराल कारन कवन। मोहि सो कहहु कृपाल ग्यान प्रभाव कि जोग बल ॥ प्रभु तव
    आश्रम आएँ मोर मोह भ्रम भाग। कारन कवन सो नाथ सब कहहु सहित अनुराग ॥ ॥ गरुड़ गिरा सुनि हरषेउ कागा। बोलेउ
    उमा परम अनुरागा ॥ धन्य धन्य तव मति उरगारी। प्रस्न तुम्हारि मोहि अति प्यारी ॥ सुनि तव प्रस्न सप्रेम
    सुहाई। बहुत जनम कै सुधि मोहि आई ॥ सब निज कथा कहुँ मैं गाई। तात सुनहु सादर मन लाई ॥ जप तप मख सम दम
    ब्रत दाना। बिरति बिबेक जोग बिग्याना ॥ सब कर फल रघुपति पद प्रेमा। तेहि बिनु कौ न पावि छेमा ॥ एहि तन
    राम भगति मैं पाई। ताते मोहि ममता अधिकाई ॥ जेहि तें कछु निज स्वारथ होई। तेहि पर ममता कर सब कोई ॥ सो
    पन्नगारि असि नीति श्रुति सम्मत सज्जन कहहिं। अति नीचहु सन प्रीति करिअ जानि निज परम हित ॥ ॥ पाट कीट
    तें होइ तेहि तें पाटम्बर रुचिर। कृमि पालि सबु कोइ परम अपावन प्रान सम ॥ ॥ स्वारथ साँच जीव कहुँ एहा।
    मन क्रम बचन राम पद नेहा ॥ सोइ पावन सोइ सुभग सरीरा। जो तनु पाइ भजिअ रघुबीरा ॥ राम बिमुख लहि बिधि सम
    देही। कबि कोबिद न प्रसंसहिं तेही ॥ राम भगति एहिं तन उर जामी। ताते मोहि परम प्रिय स्वामी ॥ तजुँ न तन
    निज इच्छा मरना। तन बिनु बेद भजन नहिं बरना ॥ प्रथम मोहँ मोहि बहुत बिगोवा। राम बिमुख सुख कबहुँ न सोवा
    ॥ नाना जनम कर्म पुनि नाना। किए जोग जप तप मख दाना ॥ कवन जोनि जनमेउँ जहँ नाहीं। मैं खगेस भ्रमि भ्रमि
    जग माहीम् ॥ देखेउँ करि सब करम गोसाई। सुखी न भयुँ अबहिं की नाई ॥ सुधि मोहि नाथ जन्म बहु केरी। सिव प्रसाद
    मति मोहँ न घेरी ॥ दो प्रथम जन्म के चरित अब कहुँ सुनहु बिहगेस। सुनि प्रभु पद रति उपजि जातें मिटहिं
    कलेस ॥ ॥ पूरुब कल्प एक प्रभु जुग कलिजुग मल मूल ॥ नर अरु नारि अधर्म रत सकल निगम प्रतिकूल ॥ ॥ तेहि कलिजुग
    कोसलपुर जाई। जन्मत भयुँ सूद्र तनु पाई ॥ सिव सेवक मन क्रम अरु बानी। आन देव निन्दक अभिमानी ॥ धन मद मत्त
    परम बाचाला। उग्रबुद्धि उर दम्भ बिसाला ॥ जदपि रहेउँ रघुपति रजधानी। तदपि न कछु महिमा तब जानी ॥ अब जाना
    मैं अवध प्रभावा। निगमागम पुरान अस गावा ॥ कवनेहुँ जन्म अवध बस जोई। राम परायन सो परि होई ॥ अवध प्रभाव
    जान तब प्रानी। जब उर बसहिं रामु धनुपानी ॥ सो कलिकाल कठिन उरगारी। पाप परायन सब नर नारी ॥ दो कलिमल ग्रसे
    धर्म सब लुप्त भे सदग्रन्थ। दम्भिन्ह निज मति कल्पि करि प्रगट किए बहु पन्थ ॥ ॥ भे लोग सब मोहबस लोभ ग्रसे
    सुभ कर्म। सुनु हरिजान ग्यान निधि कहुँ कछुक कलिधर्म ॥ ॥ बरन धर्म नहिं आश्रम चारी। श्रुति बिरोध रत सब
    नर नारी ॥ द्विज श्रुति बेचक भूप प्रजासन। कौ नहिं मान निगम अनुसासन ॥ मारग सोइ जा कहुँ जोइ भावा। पण्डित
    सोइ जो गाल बजावा ॥ मिथ्यारम्भ दम्भ रत जोई। ता कहुँ सन्त कहि सब कोई ॥ सोइ सयान जो परधन हारी। जो कर
    दम्भ सो बड़ आचारी ॥ जौ कह झूँठ मसखरी जाना। कलिजुग सोइ गुनवन्त बखाना ॥ निराचार जो श्रुति पथ त्यागी।
    कलिजुग सोइ ग्यानी सो बिरागी ॥ जाकें नख अरु जटा बिसाला। सोइ तापस प्रसिद्ध कलिकाला ॥ दो असुभ बेष भूषन
    धरें भच्छाभच्छ जे खाहिं। तेइ जोगी तेइ सिद्ध नर पूज्य ते कलिजुग माहिम् ॥ जे अपकारी चार तिन्ह कर गौरव
    मान्य तेइ। मन क्रम बचन लबार तेइ बकता कलिकाल महुँ ॥ ॥ नारि बिबस नर सकल गोसाई। नाचहिं नट मर्कट की नाई
    ॥ सूद्र द्विजन्ह उपदेसहिं ग्याना। मेलि जनेऊ लेहिं कुदाना ॥ सब नर काम लोभ रत क्रोधी। देव बिप्र श्रुति
    सन्त बिरोधी ॥ गुन मन्दिर सुन्दर पति त्यागी। भजहिं नारि पर पुरुष अभागी ॥ सौभागिनीं बिभूषन हीना। बिधवन्ह
    के सिङ्गार नबीना ॥ गुर सिष बधिर अन्ध का लेखा। एक न सुनि एक नहिं देखा ॥ हरि सिष्य धन सोक न हरी। सो
    गुर घोर नरक महुँ परी ॥ मातु पिता बालकन्हि बोलाबहिं। उदर भरै सोइ धर्म सिखावहिम् ॥ दो ब्रह्म ग्यान बिनु
    नारि नर कहहिं न दूसरि बात। कौड़ई लागि लोभ बस करहिं बिप्र गुर घात ॥ ॥ बादहिं सूद्र द्विजन्ह सन हम तुम्ह
    ते कछु घाटि। जानि ब्रह्म सो बिप्रबर आँखि देखावहिं डाटि ॥ ॥ पर त्रिय लम्पट कपट सयाने। मोह द्रोह ममता
    लपटाने ॥ तेइ अभेदबादी ग्यानी नर। देखा में चरित्र कलिजुग कर ॥ आपु गे अरु तिन्हहू घालहिं। जे कहुँ सत
    मारग प्रतिपालहिम् ॥ कल्प कल्प भरि एक एक नरका। परहिं जे दूषहिं श्रुति करि तरका ॥ जे बरनाधम तेलि कुम्हारा।
    स्वपच किरात कोल कलवारा ॥ नारि मुई गृह सम्पति नासी। मूड़ मुड़आइ होहिं सन्यासी ॥ ते बिप्रन्ह सन आपु
    पुजावहिं। उभय लोक निज हाथ नसावहिम् ॥ बिप्र निरच्छर लोलुप कामी। निराचार सठ बृषली स्वामी ॥ सूद्र करहिं
    जप तप ब्रत नाना। बैठि बरासन कहहिं पुराना ॥ सब नर कल्पित करहिं अचारा। जाइ न बरनि अनीति अपारा ॥ दो भे
    बरन सङ्कर कलि भिन्नसेतु सब लोग। करहिं पाप पावहिं दुख भय रुज सोक बियोग ॥ ॥ श्रुति सम्मत हरि भक्ति पथ
    सञ्जुत बिरति बिबेक। तेहि न चलहिं नर मोह बस कल्पहिं पन्थ अनेक ॥ बहु दाम सँवारहिं धाम जती। बिषया हरि
    लीन्हि न रहि बिरती ॥ तपसी धनवन्त दरिद्र गृही। कलि कौतुक तात न जात कही ॥ कुलवन्ति निकारहिं नारि सती।
    गृह आनिहिं चेरी निबेरि गती ॥ सुत मानहिं मातु पिता तब लौं। अबलानन दीख नहीं जब लौम् ॥ ससुरारि पिआरि
    लगी जब तें। रिपरूप कुटुम्ब भे तब तेम् ॥ नृप पाप परायन धर्म नहीं। करि दण्ड बिडम्ब प्रजा नितहीम् ॥ धनवन्त
    कुलीन मलीन अपी। द्विज चिन्ह जनेउ उघार तपी ॥ नहिं मान पुरान न बेदहि जो। हरि सेवक सन्त सही कलि सो। कबि
    बृन्द उदार दुनी न सुनी। गुन दूषक ब्रात न कोऽपि गुनी ॥ कलि बारहिं बार दुकाल परै। बिनु अन्न दुखी सब
    लोग मरै ॥ दो सुनु खगेस कलि कपट हठ दम्भ द्वेष पाषण्ड। मान मोह मारादि मद ब्यापि रहे ब्रह्मण्ड ॥ ॥ तामस
    धर्म करहिं नर जप तप ब्रत मख दान। देव न बरषहिं धरनीं बे न जामहिं धान ॥ अबला कच भूषन भूरि छुधा। धनहीन
    दुखी ममता बहुधा ॥ सुख चाहहिं मूढ़ न धर्म रता। मति थोरि कठोरि न कोमलता ॥ ॥ नर पीड़इत रोग न भोग कहीं।
    अभिमान बिरोध अकारनहीम् ॥ लघु जीवन सम्बतु पञ्च दसा। कलपान्त न नास गुमानु असा ॥ ॥ कलिकाल बिहाल किए मनुजा।
    नहिं मानत क्वौ अनुजा तनुजा। नहिं तोष बिचार न सीतलता। सब जाति कुजाति भे मगता ॥ ॥ इरिषा परुषाच्छर लोलुपता।
    भरि पूरि रही समता बिगता ॥ सब लोग बियोग बिसोक हुए। बरनाश्रम धर्म अचार गे ॥ ॥ दम दान दया नहिं जानपनी।
    जड़ता परबञ्चनताति घनी ॥ तनु पोषक नारि नरा सगरे। परनिन्दक जे जग मो बगरे ॥ सुनु ब्यालारि काल कलि मल
    अवगुन आगार। गुनुँ बहुत कलिजुग कर बिनु प्रयास निस्तार ॥ ॥ कृतजुग त्रेता द्वापर पूजा मख अरु जोग। जो
    गति होइ सो कलि हरि नाम ते पावहिं लोग ॥ ॥ कृतजुग सब जोगी बिग्यानी। करि हरि ध्यान तरहिं भव प्रानी ॥
    त्रेताँ बिबिध जग्य नर करहीं। प्रभुहि समर्पि कर्म भव तरहीम् ॥ द्वापर करि रघुपति पद पूजा। नर भव तरहिं
    उपाय न दूजा ॥ कलिजुग केवल हरि गुन गाहा। गावत नर पावहिं भव थाहा ॥ कलिजुग जोग न जग्य न ग्याना। एक अधार
    राम गुन गाना ॥ सब भरोस तजि जो भज रामहि। प्रेम समेत गाव गुन ग्रामहि ॥ सोइ भव तर कछु संसय नाहीं। नाम
    प्रताप प्रगट कलि माहीम् ॥ कलि कर एक पुनीत प्रतापा। मानस पुन्य होहिं नहिं पापा ॥ दो कलिजुग सम जुग आन
    नहिं जौं नर कर बिस्वास। गाइ राम गुन गन बिमलँ भव तर बिनहिं प्रयास ॥ ॥ प्रगट चारि पद धर्म के कलिल महुँ
    एक प्रधान। जेन केन बिधि दीन्हें दान करि कल्यान ॥ ॥ नित जुग धर्म होहिं सब केरे। हृदयँ राम माया के प्रेरे
    ॥ सुद्ध सत्व समता बिग्याना। कृत प्रभाव प्रसन्न मन जाना ॥ सत्व बहुत रज कछु रति कर्मा। सब बिधि सुख त्रेता
    कर धर्मा ॥ बहु रज स्वल्प सत्व कछु तामस। द्वापर धर्म हरष भय मानस ॥ तामस बहुत रजोगुन थोरा। कलि प्रभाव
    बिरोध चहुँ ओरा ॥ बुध जुग धर्म जानि मन माहीं। तजि अधर्म रति धर्म कराहीम् ॥ काल धर्म नहिं ब्यापहिं ताही।
    रघुपति चरन प्रीति अति जाही ॥ नट कृत बिकट कपट खगराया। नट सेवकहि न ब्यापि माया ॥ दो हरि माया कृत दोष
    गुन बिनु हरि भजन न जाहिं। भजिअ राम तजि काम सब अस बिचारि मन माहिम् ॥ ॥ तेहि कलिकाल बरष बहु बसेउँ अवध
    बिहगेस। परेउ दुकाल बिपति बस तब मैं गयुँ बिदेस ॥ ॥ गयुँ उजेनी सुनु उरगारी। दीन मलीन दरिद्र दुखारी ॥
    गेँ काल कछु सम्पति पाई। तहँ पुनि करुँ सम्भु सेवकाई ॥ बिप्र एक बैदिक सिव पूजा। करि सदा तेहि काजु न
    दूजा ॥ परम साधु परमारथ बिन्दक। सम्भु उपासक नहिं हरि निन्दक ॥ तेहि सेवुँ मैं कपट समेता। द्विज दयाल
    अति नीति निकेता ॥ बाहिज नम्र देखि मोहि साईं। बिप्र पढ़आव पुत्र की नाईम् ॥ सम्भु मन्त्र मोहि द्विजबर
    दीन्हा। सुभ उपदेस बिबिध बिधि कीन्हा ॥ जपुँ मन्त्र सिव मन्दिर जाई। हृदयँ दम्भ अहमिति अधिकाई ॥ दो मैं
    खल मल सङ्कुल मति नीच जाति बस मोह। हरि जन द्विज देखें जरुँ करुँ बिष्नु कर द्रोह ॥ गुर नित मोहि प्रबोध
    दुखित देखि आचरन मम। मोहि उपजि अति क्रोध दम्भिहि नीति कि भावी ॥ ॥ एक बार गुर लीन्ह बोलाई। मोहि नीति
    बहु भाँति सिखाई ॥ सिव सेवा कर फल सुत सोई। अबिरल भगति राम पद होई ॥ रामहि भजहिं तात सिव धाता। नर पावँर
    कै केतिक बाता ॥ जासु चरन अज सिव अनुरागी। तातु द्रोहँ सुख चहसि अभागी ॥ हर कहुँ हरि सेवक गुर कहेऊ। सुनि
    खगनाथ हृदय मम दहेऊ ॥ अधम जाति मैं बिद्या पाएँ। भयुँ जथा अहि दूध पिआएँ ॥ मानी कुटिल कुभाग्य कुजाती।
    गुर कर द्रोह करुँ दिनु राती ॥ अति दयाल गुर स्वल्प न क्रोधा। पुनि पुनि मोहि सिखाव सुबोधा ॥ जेहि ते
    नीच बड़आई पावा। सो प्रथमहिं हति ताहि नसावा ॥ धूम अनल सम्भव सुनु भाई। तेहि बुझाव घन पदवी पाई ॥ रज मग
    परी निरादर रही। सब कर पद प्रहार नित सही ॥ मरुत उड़आव प्रथम तेहि भरी। पुनि नृप नयन किरीटन्हि परी ॥
    सुनु खगपति अस समुझि प्रसङ्गा। बुध नहिं करहिं अधम कर सङ्गा ॥ कबि कोबिद गावहिं असि नीती। खल सन कलह न
    भल नहिं प्रीती ॥ उदासीन नित रहिअ गोसाईं। खल परिहरिअ स्वान की नाईम् ॥ मैं खल हृदयँ कपट कुटिलाई। गुर
    हित कहि न मोहि सोहाई ॥ दो एक बार हर मन्दिर जपत रहेउँ सिव नाम। गुर आयु अभिमान तें उठि नहिं कीन्ह प्रनाम
    ॥ ॥ सो दयाल नहिं कहेउ कछु उर न रोष लवलेस। अति अघ गुर अपमानता सहि नहिं सके महेस ॥ ॥ मन्दिर माझ भी नभ
    बानी। रे हतभाग्य अग्य अभिमानी ॥ जद्यपि तव गुर कें नहिं क्रोधा। अति कृपाल चित सम्यक बोधा ॥ तदपि साप
    सठ दैहुँ तोही। नीति बिरोध सोहाइ न मोही ॥ जौं नहिं दण्ड करौं खल तोरा। भ्रष्ट होइ श्रुतिमारग मोरा ॥
    जे सठ गुर सन इरिषा करहीं। रौरव नरक कोटि जुग परहीम् ॥ त्रिजग जोनि पुनि धरहिं सरीरा। अयुत जन्म भरि पावहिं
    पीरा ॥ बैठ रहेसि अजगर इव पापी। सर्प होहि खल मल मति ब्यापी ॥ महा बिटप कोटर महुँ जाई ॥ रहु अधमाधम अधगति
    पाई ॥ दो हाहाकार कीन्ह गुर दारुन सुनि सिव साप ॥ कम्पित मोहि बिलोकि अति उर उपजा परिताप ॥ ॥ करि दण्डवत
    सप्रेम द्विज सिव सन्मुख कर जोरि। बिनय करत गदगद स्वर समुझि घोर गति मोरि ॥ ॥ नमामीशमीशान निर्वाणरूपं।
    विम्भुं ब्यापकं ब्रह्म वेदस्वरूपं। निजं निर्गुणं निर्विकल्पं निरींह। चिदाकाशमाकाशवासं भजेऽहम् ॥ निराकारमोङ्कारमूलं
    तुरीयं। गिरा ग्यान गोतीतमीशं गिरीशम् ॥ करालं महाकाल कालं कृपालं। गुणागार संसारपारं नतोऽहम् ॥ तुषाराद्रि
    सङ्काश गौरं गभीरं। मनोभूत कोटि प्रभा श्री शरीरम् ॥ स्फुरन्मौलि कल्लोलिनी चारु गङ्गा। लसद्भालबालेन्दु
    कण्ठे भुजङ्गा ॥ चलत्कुण्डलं भ्रू सुनेत्रं विशालं। प्रसन्नाननं नीलकण्ठं दयालम् ॥ मृगाधीशचर्माम्बरं
    मुण्डमालं। प्रियं शङ्करं सर्वनाथं भजामि ॥ प्रचण्डं प्रकृष्टं प्रगल्भं परेशं। अखण्डं अजं भानुकोटिप्रकाशम्
    ॥ त्रयःशूल निर्मूलनं शूलपाणिं। भजेऽहं भवानीपतिं भावगम्यम् ॥ कलातीत कल्याण कल्पान्तकारी। सदा सज्जनान्ददाता
    पुरारी ॥ चिदानन्दसन्दोह मोहापहारी। प्रसीद प्रसीद प्रभो मन्मथारी ॥ न यावद् उमानाथ पादारविन्दं। भजन्तीह
    लोके परे वा नराणाम् ॥ न तावत्सुखं शान्ति सन्तापनाशं। प्रसीद प्रभो सर्वभूताधिवासम् ॥ न जानामि योगं
    जपं नैव पूजां। नतोऽहं सदा सर्वदा शम्भु तुभ्यम् ॥ जरा जन्म दुःखौघ तातप्यमानं। प्रभो पाहि आपन्नमामीश
    शम्भो ॥ श्लोक रुद्राष्टकमिदं प्रोक्तं विप्रेण हरतोषये। ये पठन्ति नरा भक्त्या तेषां शम्भुः प्रसीदति
    ॥ सुनि बिनती सर्बग्य सिव देखि ब्रिप्र अनुरागु। पुनि मन्दिर नभबानी भि द्विजबर बर मागु ॥ ॥ जौं प्रसन्न
    प्रभु मो पर नाथ दीन पर नेहु। निज पद भगति देइ प्रभु पुनि दूसर बर देहु ॥ ॥ तव माया बस जीव जड़ सन्तत
    फिरि भुलान। तेहि पर क्रोध न करिअ प्रभु कृपा सिन्धु भगवान ॥ ॥ सङ्कर दीनदयाल अब एहि पर होहु कृपाल। साप
    अनुग्रह होइ जेहिं नाथ थोरेहीं काल ॥ ॥ एहि कर होइ परम कल्याना। सोइ करहु अब कृपानिधाना ॥ बिप्रगिरा सुनि
    परहित सानी। एवमस्तु इति भि नभबानी ॥ जदपि कीन्ह एहिं दारुन पापा। मैं पुनि दीन्ह कोप करि सापा ॥ तदपि
    तुम्हार साधुता देखी। करिहुँ एहि पर कृपा बिसेषी ॥ छमासील जे पर उपकारी। ते द्विज मोहि प्रिय जथा खरारी
