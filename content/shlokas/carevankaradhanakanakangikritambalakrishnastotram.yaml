id: carevankaradhanakanakangikritambalakrishnastotram
category: stotram
name:
  english: carevankaradhanakanakangikritambalakrishnastotram
  devanagari: चारेवन्कराधनकनकान्गीकृतंबालकृष्णस्तोत्रम्
content:
  english: om namo'nadishrikrishnanarayanaya sadhave || 56|| yogine sarvavijnaya bhaktarakshakaraya ca
    | adhamoddharanakartre dinanathadayalave || 57|| namah sadhusvarupaya balakrishnaya te namah | kambharanandabalaya
    gopalabalakaya te || 68|| namo radhaviharaya kamalapataye namah | namo'ntaryamine bhaktabhavukaya
    sate namah || 99|| antaratma paramatma prasanno bhava sarvada | sadhuseva tava seva narayana grihana
    tam || 60|| ityevam bhavabhinna sa dadau tat kanakangada | putrah putryah samastasta daduryatheshtavastukam
    || 61|| carvankaradhanashcapi sadhusevam tada'karot | mishtavanya caranayoh samvahanam vyadhanmuda
    || 62|| evam sarvam kutumbam vai camathajatijam tada | sevaparayanam jatam saptaha'nashananvitam ||
    63|| iti shrilakshminarayaniyasamhitayah tishyasantanatmakasya caturthakhande 39
  devanagari: ॐ नमोऽनादिश्रीकृष्णनारायणाय साधवे ॥ ५६॥ योगिने सर्वविज्ञाय भक्तरक्षाकराय च । अधमोद्धारणकर्त्रे
    दीनानाथदयालवे ॥ ५७॥ नमः साधुस्वरूपाय बालकृष्णाय ते नमः । कम्भरानन्दबालाय गोपालबालकाय ते ॥ ६८॥ नमो
    राधाविहाराय कमलापतये नमः । नमोऽन्तर्यामिणे भक्तभावुकाय सते नमः ॥ ९९॥ अन्तरात्मा परमात्मा प्रसन्नो
    भव सर्वदा । साधुसेवा तव सेवा नारायण गृहाण ताम् ॥ ६०॥ इत्येवं भावभिन्ना सा ददौ तत् कनकाङ्गदा । पुत्राः
    पुत्र्यः समस्तास्ता ददुर्यथेष्टवस्तुकम् ॥ ६१॥ चार्वङ्कराधनश्चापि साधुसेवां तदाऽकरोत् । मिष्टवाण्या
    चरणयोः संवाहनं व्यधान्मुदा ॥ ६२॥ एवं सर्वं कुटुम्बं वै चामठाजातिजं तदा । सेवापरायणं जातं सप्ताहाऽनशनान्वितम्
    ॥ ६३॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः तिष्यसन्तानात्मकस्य चतुर्थखण्डे ३९
