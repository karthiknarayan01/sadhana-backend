id: agnisahasranamavalih-ricasahita-sambadikshitena-sankalitam
category: stotram
name:
  english: agnisahasranamavalih ricasahita (sambadikshitena sankalitam)
  devanagari: अग्निसहस्रनामावलिः ऋचासहिता (साम्बदीक्षितेन सङ्कलितम्)
content:
  english: '|| iti shrigokarnabhijanasya dikshitadamodarasunoh sambadikshitasya kritau agnisahasranamavalih
    ||'
  devanagari: ॥ इति श्रीगोकर्णाभिजनस्य दीक्षितदामोदरसूनोः साम्बदीक्षितस्य कृतौ अग्निसहस्रनामावलिः ॥
meaning: {}
