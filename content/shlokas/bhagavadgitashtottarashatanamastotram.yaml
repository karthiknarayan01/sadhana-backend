id: bhagavadgitashtottarashatanamastotram
category: stotram
name:
  english: bhagavadgitashtottarashatanamastotram
  devanagari: भगवद्गीताष्टोत्तरशतनामस्तोत्रम्
content:
  english: prakashini || 10|| dehidehavivekadhya buddhidvayavilasini | nirdvandva nitya sattvastha nihspriha
    samshayapaha || 11|| brahmisthitih sthitaprajna brahmasparshasukhaspada | brahmayoniryajnamayi brahmanirvanadayini
    || 12|| karmanta kamaha kamya saumya yogatrayashraya | dharmakshetrodbhava dharmya dhyanastha bhakti
    nirjhari || 13|| jnanavijnanasopana divyasmaranasantatih | rajavidya rajaguhya pratyaksha sulabhagatih
    || 14|| vibhutibhushitananta vishvarupapradarshini | adveshtritvadisandoha kshetrakshetrajnapalini
    || 15|| gunajna trigunatita ksharaksharavimarshini | purushottamapara purna kritakrityapadaprada ||
    16|| divyasampatprasurdivya sharanagatidharmini | samnyasarasika mukta sarvapapapramocini || 17||
    shrishankaradrita'dvaita shrinivasanivasabhuh | sarvashastramayi samvit smritih samarasakritih ||
    18|| yogeshvaranandakari gitam bhagavatim sada | ye stuvantyanaya bhaktya yanti paramagatim || 19||
    iti shrimadbhagavadgitashtottarashatanamastotram sampurnam |
  devanagari: प्रकाशिनी ॥ १०॥ देहीदेहविवेकाढ्या बुद्धिद्वयविलासिनी । निर्द्वन्द्वा नित्य सत्त्वस्था निःस्पृहा
    संशयापहा ॥ ११॥ ब्राह्मीस्थितिः स्थितप्रज्ञा ब्रह्मस्पर्शसुखास्पदा । ब्रह्मयोनिर्यज्ञमयी ब्रह्मनिर्वाणदायिनी
    ॥ १२॥ कर्मान्ता कामहा काम्या सौम्या योगत्रयाश्रया । धर्मक्षेत्रोद्भवा धर्म्या ध्यानस्था भक्ति निर्झरी
    ॥ १३॥ ज्ञानविज्ञानसोपाना दिव्यस्मरणसन्ततिः । राजविद्या राजगुह्या प्रत्यक्षा सुलभागतिः ॥ १४॥ विभूतिभूषितानन्ता
    विश्वरूपप्रदर्शिनी । अद्वेष्टृत्वादिसन्दोहा क्षेत्रक्षेत्रज्ञपालिनी ॥ १५॥ गुणज्ञा त्रिगुणातीता क्षराक्षरविमर्शिनी
    । पुरुषोत्तमपरा पूर्णा कृतकृत्यपदप्रदा ॥ १६॥ दिव्यसम्पत्प्रसूर्दिव्या शरणागतिधर्मिणी । संन्यासरसिका
    मुक्ता सर्वपापप्रमोचिनी ॥ १७॥ श्रीशङ्करादृताऽद्वैता श्रीनिवासनिवासभूः । सर्वशास्त्रमयी संवित् स्मृतिः
    समरसाकृतिः ॥ १८॥ योगेश्वरानन्दकरी गीतां भगवतीं सदा । ये स्तुवन्त्यनया भक्त्या यान्ति परमागतिम् ॥ १९॥
    इति श्रीमद्भगवद्गीताष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ।
