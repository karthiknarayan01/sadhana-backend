id: ekashlokinavagrahastotram
category: ekashloki
name:
  english: ekashlokinavagrahastotram
  devanagari: एकश्लोकीनवग्रहस्तोत्रम्
content:
  english: ekashlokinavagrahastotram adhare prathame sahasrakiranam taradhavam svashraye maheyam manipurake
    hridi budham kanthe ca vacaspatim | bhrumadhye bhrigunandanam dinamaneh putram trikutasthale nadimarmasu
    rahu
  devanagari: एकश्लोकीनवग्रहस्तोत्रम् आधारे प्रथमे सहस्रकिरणं ताराधवं स्वाश्रये माहेयं मणिपूरके हृदि बुधं
    कण्ठे च वाचस्पतिम् । भ्रूमध्ये भृगुनन्दनं दिनमणेः पुत्रं त्रिकूटस्थले नाडीमर्मसु राहु
meaning: {}
