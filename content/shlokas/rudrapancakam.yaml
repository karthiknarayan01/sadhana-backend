id: rudrapancakam
category: veda
name:
  english: rudrapancakam
  devanagari: रुद्रपन्चकम्
content:
  english: rudrapancakam rudramantrakasuktam prathamam om namah shivaya | pranato'smi mahadeva prapanno'smi
    sadashiva | nivaraya mahamrityum mrityunjaya namo'stu te || devam sudhakalashasomakaram trinetram
    padmasanam ca varada'bhayadam sushubhram | shankha'bhayabjavarabhushitaya ca devya vame'nkitam shamanabhangaharam
    namami || shuddhasphatikasankasham trinetram pancavaktrakam | gangadharam dashabhujam sarvabharanabhushitam
    || 1|| nilagrivam shashankankam nagayajnopavitinam | vyaghracarmottariyam ca varenyamabhayapradam
    || 2|| kamandalvakshasutrabhyamanvitam shulapanikam | jvalantam pingalajatashikhamudyotakarinam ||
    3|| amritenaplutam hrishtamumadehardhadharinam | divyasimhasanasinam divyabhogasamanvitam || 4|| digdevatasamayuktam
    surasuranamaskritam | nityam ca shashvatam shuddham dhruvamaksharama'vyayam || 5|| sarvavyapinamishanam
    rudram vai vishvarupinam | evam dhyatva dvijah samyaktato yajanamarabhet || 6|| mrityunjaya mahadeva
    pahi mam sharanagatam | janmamrityujararogaih piditam bhavabandhanat || 7|| aradhito manushyaistvam
    siddhairdevairmaharshibhih | avahayami bhaktya tvam grihanarcam maheshvara || 8|| hara shambho mahadeva
    vishveshamaravallabha | shiva shankara sarvatman nilakantha namo'stu te || 9|| iti vijnapya devesham
    japenmantram ca tryambakam || 10|| om tryambakam yajamahe sugandhim rayiposhanam | urvarukamiva bandhananmrityormukshiya
    ma'mritat || om atva vahantu harayah sacetasah shvetairashvairiha ketumadbhirvatajavena balamadbhirmanojava
    yantu shighram mama rudraya havyandevanam ca rishinam casuranam ca purvajam sahasraksham virupaksham
    vishvarupam mahadeva shivamavahayamyaham || avahayamyaham devamishvaram parvatipatim | vrishabhasanamarudham
    nagabharanabhushitam || priyatam yajamanasya tushto bhuyajjagatpatih | shuklavarno mahatejah shuklasragdamabhushitah
    | balih punyam carushcaiva dhupo'yam pratigrihyatam || om tatpurushaya vidmahe mahadevaya dhimahi
    | tanno rudrah pracodayat || 3|| om shatarudriyandevanam rudrashamanam bhavaya sharviyashca pratyutkrantanuvakau
    devarshi rudradaivatyastrishtupcchandashcayane viniyogah
  devanagari: रुद्रपञ्चकम् रुद्रमन्त्रकसूक्तं प्रथमम् ॐ नमः शिवाय । प्रणतोऽस्मि महादेव प्रपन्नोऽस्मि सदाशिव
    । निवारय महामृत्युं मृत्युञ्जय नमोऽस्तु ते ॥ देवं सुधाकलशसोमकरं त्रिनेत्रं पद्मासनं च वरदाऽभयदं सुशुभ्रम्
    । शङ्खाऽभयाब्जवरभूषितया च देव्या वामेऽङ्कितं शमनभङ्गहरं नमामि ॥ शुद्धस्फटिकसङ्काशं त्रिनेत्रं पञ्चवक्त्रकम्
    । गङ्गाधरं दशभुजं सर्वाभरणभूषितम् ॥ १॥ नीलग्रीवं शशाङ्काङ्कं नागयज्ञोपवीतिनम् । व्याघ्रचर्मोत्तरीयं
    च वरेण्यमभयप्रदम् ॥ २॥ कमण्डल्वक्षसूत्राभ्यामन्वितं शूलपाणिकम् । ज्वलन्तं पिङ्गलजटाशिखमुद्योतकारिणम्
    ॥ ३॥ अमृतेनाप्लुतं हृष्टमुमादेहार्धधारिणम् । दिव्यसिंहासनासीनं दिव्यभोगसमन्वितम् ॥ ४॥ दिग्देवतासमायुक्तं
    सुरासुरनमस्कृतम् । नित्यं च शाश्वतं शुद्धं ध्रुवमक्षरमऽव्ययम् ॥ ५॥ सर्वव्यापिनमीशानं रुद्रं वै विश्वरूपिणम्
    । एवं ध्यात्वा द्विजः सम्यक्ततो यजनमारभेत् ॥ ६॥ मृत्युञ्जय महादेव पाहि मां शरणागतम् । जन्ममृत्युजरारोगैः
    पीडितं भवबन्धनात् ॥ ७॥ आराधितो मनुष्यैस्त्वं सिद्धैर्देवैर्महर्षिभिः । आवाहयामि भक्त्या त्वां गृहाणार्चां
    महेश्वर ॥ ८॥ हर शम्भो महादेव विश्वेशामरवल्लभ । शिव शङ्कर सर्वात्मन् नीलकण्ठ नमोऽस्तु ते ॥ ९॥ इति विज्ञाप्य
    देवेशं जपेन्मन्त्रं च त्र्यम्बकम् ॥ १०॥ ॐ त्र्यम्बकं यजामहे सुगन्धिं रयिपोषणम् । उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय
    माऽमृतात् ॥ ॐ आत्वा वहन्तु हरयः सचेतसः श्वेतैरश्वैरिह केतुमद्भिर्वाताजवेन बलमद्भिर्मनोजवा यान्तु शीघ्रं
    मम रुद्राय हव्यन्देवानां च ऋषीणां चासुराणां च पूर्वजं सहस्राक्षं विरूपाक्षं विश्वरूपं महादेव शिवमावाहयाम्यहम्
    ॥ आवाहयाम्यहं देवमीश्वरं पार्वतीपतिम् । वृषभासनमारूढं नागाभरणभूषितम् ॥ प्रीयतां यजमानस्य तुष्टो भूयाज्जगत्पतिः
    । शुक्लवर्णो महातेजाः शुक्लस्रग्दामभूषितः । बलिः पुण्यं चरुश्चैव धूपोऽयं प्रतिगृह्यताम् ॥ ॐ तत्पुरुषाय
    विद्महे महादेवाय धीमहि । तन्नो रुद्रः प्रचोदयात् ॥ ३॥ ॐ शतरुद्रियन्देवानां रुद्रशमनं भवाय शर्वीयश्च
    प्रत्युत्क्रान्तानुवाकौ देवर्षी रुद्रदैवत्यस्त्रिष्टुप्च्छन्दश्चयने विनियोगः
