id: pippaladakritamshivastotram
category: stotram
name:
  english: pippaladakritamshivastotram
  devanagari: पिप्पलादकृतंशिवस्तोत्रम्
content:
  english: pippaladakritam shivastotram pippalada uvaca | sarvani karmani vihaya dhirastyaktaishana nirjitacittavatah
    | yam yanti muktyai sharanam prayatnattamadidevam pranamami shambhum || 100|| yah sarvasakshi sakalantaratma
    sarveshvarah sarvakalanidhanam | vijnaya maccittagatam samastam sa me smararih karunam karotu || 101||
    digishvaranjitya surarcitasya kailasamandolayatah purareh | angushthakrityaiva rasataladadhogatasya
    tasyaiva dashananasya || 102|| alunakayasya giram nishamya vihasya devya saha dattamishtam | tasmai
    prasannah kupito'pi tadvadayuktadata'si maheshvara tvam || 103|| sautramanimriddhimadhah sa cakre
    yo'rcam harau
  devanagari: पिप्पलादकृतं शिवस्तोत्रम् पिप्पालाद उवाच । सर्वाणि कर्माणि विहाय धीरास्त्यक्तैषणा निर्जितचित्तवाताः
    । यं यान्ति मुक्त्यै शरणं प्रयत्नात्तमादिदेवं प्रणमामि शम्भुम् ॥ १००॥ यः सर्वसाक्षी सकलान्तरात्मा
    सर्वेश्वरः सर्वकलानिधानम् । विज्ञाय मच्चित्तगतं समस्तं स मे स्मरारिः करुणां करोतु ॥ १०१॥ दिगीश्वराञ्जित्य
    सुरार्चितस्य कैलासमान्दोलयतः पुरारेः । अङ्गुष्ठकृत्यैव रसातलादधोगतस्य तस्यैव दशाननस्य ॥ १०२॥ आलूनकायस्य
    गिरं निशम्य विहस्य देव्या सह दत्तमिष्टम् । तस्मै प्रसन्नः कुपितोऽपि तद्वदयुक्तदाताऽसि महेश्वर त्वम्
    ॥ १०३॥ सौत्रामणीमृद्धिमधः स चक्रे योऽर्चां हरौ
