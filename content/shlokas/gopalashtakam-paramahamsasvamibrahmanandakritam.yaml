id: gopalashtakam-paramahamsasvamibrahmanandakritam
category: stotram
name:
  english: gopalashtakam (paramahamsasvamibrahmanandakritam)
  devanagari: गोपालाष्टकम् (परमहंसस्वामिब्रह्मानन्दकृतम्)
content:
  english: shri ganeshaya namah || yasmadvishvam jatamidam citramatarkyam yasminnanandatmani nityam ramate
    vai | yatrante samyati layam caitadashesham tam gopalam santatakalam prati vande || 1|| yasyajnanajjanmajararogakadambam
    jnate yasminnashyati tatsarvamihashu | gatva yatrayati punarno bhavabhumim tam gopalam santatakalam
    prati vande || 2|| tishthannantaryo yamayatyetadajasram yam kashcinno veda jano'pyatmani santam |
    sarvam yasyedam ca vashe tishthati vishvam tam gopalam santatakalam prati vande || 3|| dharmo'dharmeneha
    tiraskaramupaiti kale yasminmatsyamukhaishcarucaritraih | nanarupaih pati tada yo'vanibimbam tam gopalam
    santatakalam prati vande || 4|| pranayamairdhvastasamastendriyadosha rudhva cittam yam hridi pashyanti
    samadhau | jyotirupam yogijanamodanimagnastam gopalam santatakalam prati vande || 5|| bhanushcandrashcoduganaishcaiva
    hutasho yasminnaivabhati tadiccapi kadapi | yadbhasa cabhati samastam jagadetat tam gopalam santatakalam
    prati vande || 6|| satyajnanam modamavocurnigama yam yo brahmendradityagirisharcitapadah | shete'nanto'nantatanavambunidhau
    yastam gopalam santatakalam prati vande || 7|| shaivah prahuryam shivamanye gananatham shaktim caike'rkam
    ca tathanye matibhedat | nanakarairbhati ya eko'khilashaktistam gopalam santatakalam prati vande ||
    8|| shrimadgopalashtakametat samadhite bhaktya nityam yo manujo vai sthiracetah | hitva turnam papakalapam
    sa sameti punyam vishnordhama yato naiva nipatah || 9|| iti shriparamahamsasvamibrahmanandaviracitam
    shri gopalashtakam sampurnam ||
  devanagari: श्री गणेशाय नमः ॥ यस्माद्विश्वं जातमिदं चित्रमतर्क्यं यस्मिन्नानन्दात्मनि नित्यं रमते वै
    । यत्रान्ते संयाति लयं चैतदशेषं तं गोपालं सन्ततकालं प्रति वन्दे ॥ १॥ यस्याज्ञानाज्जन्मजरारोगकदम्बं
    ज्ञाते यस्मिन्नश्यति तत्सर्वमिहाशु । गत्वा यत्रायाति पुनर्नो भवभूमिं तं गोपालं सन्ततकालं प्रति वन्दे
    ॥ २॥ तिष्ठन्नन्तर्यो यमयत्येतदजस्रं यं कश्चिन्नो वेद जनोऽप्यात्मनि सन्तम् । सर्वं यस्येदं च वशे तिष्ठति
    विश्वं तं गोपालं सन्ततकालं प्रति वन्दे ॥ ३॥ धर्मोऽधर्मेणेह तिरस्कारमुपैति काले यस्मिन्मत्स्यमुखैश्चारुचरित्रैः
    । नानारूपैः पाति तदा योऽवनिबिम्बं तं गोपालं सन्ततकालं प्रति वन्दे ॥ ४॥ प्राणायामैर्ध्वस्तसमस्तेन्द्रियदोषा
    रुध्वा चित्तं यं हृदि पश्यन्ति समाधौ । ज्योतीरूपं योगिजनामोदनिमग्नास्तं गोपालं सन्ततकालं प्रति वन्दे
    ॥ ५॥ भानुश्चन्द्रश्चोडुगणैश्चैव हुताशो यस्मिन्नैवाभाति तडिच्चापि कदापि । यद्भासा चाभाति समस्तं जगदेतत्
    तं गोपालं सन्ततकालं प्रति वन्दे ॥ ६॥ सत्यज्ञानं मोदमवोचुर्निगमा यं यो ब्रह्मेन्द्रादित्यगिरीशार्चितपादः
    । शेतेऽनन्तोऽनन्ततनावम्बुनिधौ यस्तं गोपालं सन्ततकालं प्रति वन्दे ॥ ७॥ शैवाः प्राहुर्यं शिवमन्ये गणनाथं
    शक्तिं चैकेऽर्कं च तथान्ये मतिभेदात् । नानाकारैर्भाति य एकोऽखिलशक्तिस्तं गोपालं सन्ततकालं प्रति वन्दे
    ॥ ८॥ श्रीमद्गोपालाष्टकमेतत् समधीते भक्त्या नित्यं यो मनुजो वै स्थिरचेताः । हित्वा तूर्णं पापकलापं
    स समेति पुण्यं विष्णोर्धाम यतो नैव निपातः ॥ ९॥ इति श्रीपरमहंसस्वामिब्रह्मानन्दविरचितं श्री गोपालाष्टकं
    सम्पूर्णम् ॥
