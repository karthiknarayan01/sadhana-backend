id: yogacudamanyupanishat
category: upanishad
name:
  english: yogacudamanyupanishat
  devanagari: योगचूडामण्युपनिषत्
content:
  english: upanishad om apyayantu mamangani vakpranashcakshuh shrotramatho balamindriyani ca || sarvani
    sarvam brahmopanishadam maham brahma nirakuryam ma ma brahma nirakarodanirakaranamastvanirakaranam
    mestu tadatmani nirate ya upanishatsu dharmaste mayi santu te mayi santu|| om shantih shantih shantih
    || yogacudamanim vakshye yoginam hitakamyaya | kaivalyasiddhidam gudham sevitam yogavittamaih || 1||
    asanam pranasamrodhah pratyaharashca dharana | dhyanam samadhiretani yogangani bhavanti shat || 2||
    ekam siddhasanam proktam dvitiyam kamalasanam | shatcakram shodashadharam trilakshyam vyomapancakam
    || 3|| svadehe yo na janati tasya siddhih katham bhavet | caturdalam syadadharam svadhishthanam ca
    shaddalam || 4|| nabhau dashadalam padmam hridaye dvadasharakam | shodasharam vishuddhakhyam bhrumadhye
    dvidalam tatha || 5|| sahasradalasankhyatam brahmarandhre mahapathi | adharam prathamam cakram svadhishthanam
    dvitiyakam || 6|| yonisthanam dvayormadhye kamarupam nigadyate | kamakhyam tu gudasthane pankajam
    tu caturdalam || 7|| tanmadhye procyate yonih kamakhya siddhavandita | tasya madhye mahalingam pashcimabhimukham
    sthitam || 8|| nabhau tu manivadbimbam yo janati sa yogavit | taptacamikarabhasam tadillekheva visphurat
    || 9|| trikonam tatpuram vahneradhomedhratpratishthitam | samadhau paramam jyotiranantam vishvatomukham
    || 10|| tasmindrishte mahayoge yatayato na vidyate | svashabdena bhavetpranah svadhishthanam tadashrayah
    || 11|| svadhishthashrayadasmanmedhramevabhidhiyate | tantuna manivatproto yo'tra kandah sushumnaya
    || 12|| tannabhimandale cakram procyate manipurakam | dvadashare mahacakre punyapapavivarjite || 13||
    tavajjivo bhramatyevam yavattattvam na vindati | urdhvam medhradadho nabheh kande yonih khagandavat
    || 14|| tatra nadyah samutpannah sahasranam dvisaptatih | teshu nadisahasreshu dvisaptatirudahrita
    || 15|| pradhanah pranavahinyo bhuyastasu dasha smritah | ida ca pingala caiva sushumna ca tritiyaga
    || 16|| gandhari hastijihva ca pusha caiva yashasvini | alambusa kuhushcaiva shankhini dashami smrita
    || 17|| etannadimahacakram jnatavyam yogibhih sada | ida vame sthita bhage dakshine pingala sthita
    || 18|| sushumna madhyadeshe tu gandhari vamacakshushi | dakshine hastijihva ca pusha karne ca dakshine
    || 19|| yashasvini vamakarne canane capyalambusa | kuhushca lingadeshe tu mulasthane tu shankhini
    || 20|| evam dvaram samashritya tishthante nadayah kramat | idapingalasaushumnah pranamarge ca samsthitah
    || 21|| satatam pranavahinyah somasuryagnidevatah | pranapanasamanakhya vyanodanau ca vayavah || 22||
    nagah kurmo'tha krikaro devadatto dhananjayah | hridi pranah sthito nityamapano gudamandale || 23||
    samano nabhideshe tu udanah kanthamadhyagah | vyanah sarvasharire tu pradhanah pancavayavah || 24||
    udgare naga akhyatah kurma unmilane tatha | krikarah kshutkaro jneyo devadatto vijrimbhane || 25||
    na jahati mritam vapi sarvavyapi dhananjayah | ete nadishu sarvasu bhramante jivajantavah || 26||
    akshipto bhujadandena yatha calati kandukah | pranapanasamakshiptastatha jivo na tishthati || 27||
    pranapanavasho jivo hyadhashcordhvam ca gachati | vamadakshinamargabhyam cancalatvanna drishyate ||
    28|| rajjubaddho yatha shyeno gato'pyakrishyate punah | gunabaddhastatha jivah pranapanena karshati
    || 29|| pranapanavasho jivo hyadhashcordhvam ca gacchati | apanah karshati pranam prano'panam ca karshati|
    urdhvadhahsamsthitavetau yo janati sa yogavit || 30|| hakarena bahiryati sakarena vishetpunah| hamsahamsetyamum
    matram jivo japati sarvada || 31|| shatshatani divaratrau sahasranyekavimshatih| etatsankhyanvitam
    mantram jivo japati sarvada || 32|| ajapanama gayatri yoginam mokshada sada | asyah sankalpamatrena
    sarvapapaih pramucyate || 33|| anaya sadrishi vidya anaya sadrisho japah| anaya sadrisham jnanam na
    bhutam na bhavishyati || 34|| kundalinya samudbhuta gayatri pranadharini | pranavidya mahavidya yastam
    vetti sa vedavit ||35|| kandordhve kundalishaktirashtadha kundalakritih | brahmadvaramukham nityam
    mukhenacchadya tishthati || 36|| yena dvarena gantavyam brahmadvaram manomayam | mukhenacchadya taddvaram
    prasupta parameshvari || 37|| prabuddha vahniyogena manasa maruta saha | sucivadgatramadaya vrajatyurdhvam
    sushumnaya || 38|| udghatayetkavatam tu yathakuncikaya griham | kundalinyam tatha yogi mokshadvaram
    prabhedayet || 39|| kritva samputitau karau dridhataram badhva tu padmasanam gadham vakshasi samnidhaya
    cubukam dhyanam ca tacceshtitam | varamvaramapanamurdhvamanilam proccharayetpuritam muncanpranamupaiti
    bodhamatulam shaktiprabhavannarah || 40|| anganam mardanam kritva shramasamjatavarina | katvamlalavanatyagi
    kshirabhojanamacaret ||41|| brahmacari mitahari yogi yogaparayanah | abdadurdhvam bhavetsiddho natra
    karya vicarana || 42|| susnigdhamadhuraharashcaturthamshavivarjitah | bhunjate shivasampritya mitahari
    sa ucyate || 43|| kandordhve kundalishaktirashtadha kundalikritih | bandhanaya ca mudhanam yoginam
    mokshada sada || 44|| mahamudra nabhomudra odyanam ca jalandharam | mulabandham ca yo vetti sa yogi
    muktibhajanam || 45|| parshnighatena sampidya yonimakuncayeddridham | apanamurdhvamakrishya mulabandho
    vidhiyate || 46|| apanapranayoraikyam kshayanmutrapurishayoh | yuva bhavati vriddho'pi satatam mulabandhanat
    || 47|| odyanam kurute yasmadavishrantam mahakhagah | oddiyanam tadeva syanmrityumatangakesari ||
    48|| udaratpashcimam tanamadhonabhernigadyate | odyanamudare bandhastatra bandho vidhiyate || 49||
    badhnati hi shirojatamadhogami nabhojalam | tato jalandharo bandhah kashtaduhkhaughanashanah || 50||
    jalandhare krite bandhe kanthasankocalakshane | na piyusham patatyagnau na ca vayuh pradhavati ||
    51|| kapalakuhare jihva pravishta viparitaga | bhruvorantargata drishtirmudra bhavati khecari || 52||
    na rogo maranam tasya na nidra na kshudha trisha | na ca murccha bhavettasya yo mudram vetti khecarim
    || 53|| pidyate na ca rogena likhyate na sa karmabhih | badhyate na ca kenapi yo mudram vetti khecarim
    || 54|| cittam carati khe yasmajjihva carati khe yatah | teneyam khecari mudra sarvasiddhanamaskrita
    ||55|| bindumulasharirani shirastatra pratishthitah | bhavayanti sharirani apadatalamastakam || 56||
    khecarya mudritam yena vivaram lambikordhvatah | na tasya kshiyate binduh kaminyalingitasya ca ||
    57|| yavadbinduh sthito dehe tavanmrityubhayam kutah | yavadbaddha nabhomudra tavadbindurna gacchati
    || 58|| jvalito'pi yatha binduh sampraptashca hutashanam | vrajatyurdhvam gatah shaktya niruddho yonimudraya
    || 59|| sa punardvividho binduh pandaro lohitastatha | pandaram shuklamityahurlohitakhyam maharajah
    || 60|| sinduravratasankasham ravisthanasthitam rajah | shashisthanasthitam shuklam tayoraikyam sudurlabham
    || 61|| bindurbrahma rajah shaktirbindurindu rajo ravih | ubhayoh sangamadeva prapyate paramam padam
    || 62|| vayuna shakticalena preritam ca yatha rajah | yati binduh sadaikatvam bhaveddivyavapustada
    || 63|| shuklam candrena samyuktam rajah suryena sangatam | tayoh samarasaikatvam yo janati sa yogavit
    || 64|| shodhanam nadijalasya calanam candrasuryayoh | rasanam shoshanam caiva mahamudrabhidhiyate
    || 65|| vakshonyastahanuh prapidya suciram yonim ca vamanghanina hastabhyamanudharayanprasaritam padam
    tatha dakshinam | apurya shvasanena kukshiyugalam badhva shanai recayetseyam vyadhivinashini sumahati
    mudra nrinam kathyate || 66|| candramshena samabhyasya suryamshenabhyasetpunah | ya tulya tu bhavetsankhya
    tato mudram visarjayet || 67|| nahi pathyamapathyam va rasah sarve'pi nirasah | atibhuktam visham
    ghoram piyushamiva jiryate || 68|| kshayakushthagudavartagulmajirnapurogamah | tasya rogah kshayam
    yanti mahamudram tu yo'bhyaset || 69|| kathiteyam mahamudra mahasiddhikari nrinam | gopaniya prayatnena
    na deya yasya kasyacit || 70|| padmasanam samaruhya samakayashirodharah | nasagradrishtirekante japedonkaramavyayam
    || 71|| om nityam shuddham buddham nirvikalpam niranjanam nirakhyatamanadinidhanamekam turiyam yadbhutam
    bhavadbhavishyatparivartamanam sarvada'navacchinnam param brahma tasmajjata para shaktih svayamjyotira
  devanagari: उपनिषद् ॐ आप्यायन्तु ममाङ्गानि वाक्प्राणश्चक्षुः श्रोत्रमथो बलमिन्द्रियाणि च ॥ सर्वाणि सर्वं
    ब्रह्मोपनिषदं माहं ब्रह्म निराकुर्यां मा मा ब्रह्म निराकरोदनिराकरणमस्त्वनिराकरणं मेस्तु तदात्मनि निरते
    य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु॥ ॐ शान्तिः शान्तिः शान्तिः ॥ योगचूडामणिं वक्ष्ये योगिनां
    हितकाम्यया । कैवल्यसिद्धिदं गूढं सेवितं योगवित्तमैः ॥ १॥ आसनं प्राणसंरोधः प्रत्याहारश्च धारणा । ध्यानं
    समाधिरेतानि योगाङ्गानि भवन्ति षट् ॥ २॥ एकं सिद्धासनं प्रोक्तं द्वितीयं कमलासनम् । षट्चक्रं षोडशाधारं
    त्रिलक्ष्यं व्योमपञ्चकम् ॥ ३॥ स्वदेहे यो न जानाति तस्य सिद्धिः कथं भवेत् । चतुर्दलं स्यादाधारं स्वाधिष्ठानं
    च षड्दलम् ॥ ४॥ नाभौ दशदलं पद्मं हृदये द्वादशारकम् । षोडशारं विशुद्धाख्यं भ्रूमध्ये द्विदलं तथा ॥ ५॥
    सहस्रदलसङ्ख्यातं ब्रह्मरन्ध्रे महापथि । आधारं प्रथमं चक्रं स्वाधिष्ठानं द्वितीयकम् ॥ ६॥ योनिस्थानं
    द्वयोर्मध्ये कामरूपं निगद्यते । कामाख्यं तु गुदस्थाने पङ्कजं तु चतुर्दलम् ॥ ७॥ तन्मध्ये प्रोच्यते
    योनिः कामाख्या सिद्धवन्दिता । तस्य मध्ये महालिङ्गं पश्चिमाभिमुखं स्थितम् ॥ ८॥ नाभौ तु मणिवद्बिम्बं
    यो जानाति स योगवित् । तप्तचामीकराभासं तडिल्लेखेव विस्फुरत् ॥ ९॥ त्रिकोणं तत्पुरं वह्नेरधोमेढ्रात्प्रतिष्ठितम्
    । समाधौ परमं ज्योतिरनन्तं विश्वतोमुखम् ॥ १०॥ तस्मिन्दृष्टे महायोगे यातायातो न विद्यते । स्वशब्देन
    भवेत्प्राणः स्वाधिष्ठानं तदाश्रयः ॥ ११॥ स्वाधिष्ठाश्रयादस्मान्मेढ्रमेवभिधीयते । तन्तुना मणिवत्प्रोतो
    योऽत्र कन्दः सुषुम्नया ॥ १२॥ तन्नाभिमण्डले चक्रं प्रोच्यते मणिपूरकम् । द्वादशारे महाचक्रे पुण्यपापविवर्जिते
    ॥ १३॥ तावज्जीवो भ्रमत्येवं यावत्तत्त्वं न विन्दति । ऊर्ध्वं मेढ्रादधो नाभेः कन्दे योनिः खगाण्डवत्
    ॥ १४॥ तत्र नाड्यः समुत्पन्नाः सहस्राणां द्विसप्ततिः । तेषु नाडीसहस्रेषु द्विसप्ततिरुदाहृता ॥ १५॥ प्रधानाः
    प्राणवाहिन्यो भूयस्तासु दश स्मृताः । इडा च पिङ्गला चैव सुषुम्ना च तृतीयगा ॥ १६॥ गान्धारी हस्तिजिह्वा
    च पूषा चैव यशस्विनी । अलम्बुसा कुहूश्चैव शङ्खिनी दशमी स्मृता ॥ १७॥ एतन्नाडीमहाचक्रं ज्ञातव्यं योगिभिः
    सदा । इडा वामे स्थिता भागे दक्षिणे पिङ्गला स्थिता ॥ १८॥ सुषुम्ना मध्यदेशे तु गान्धारी वामचक्षुषि ।
    दक्षिणे हस्तिजिह्वा च पूषा कर्णे च दक्षिणे ॥ १९॥ यशस्विनी वामकर्णे चानने चाप्यलम्बुसा । कुहूश्च लिङ्गदेशे
    तु मूलस्थाने तु शङ्खिनी ॥ २०॥ एवं द्वारं समाश्रित्य तिष्ठन्ते नाडयः क्रमात् । इडापिङ्गलासौषुम्नाः
    प्राणमार्गे च संस्थिताः ॥ २१॥ सततं प्राणवाहिन्यः सोमसूर्याग्निदेवताः । प्राणापानसमानाख्या व्यानोदानौ
    च वायवः ॥ २२॥ नागः कूर्मोऽथ कृकरो देवदत्तो धनञ्जयः । हृदि प्राणः स्थितो नित्यमपानो गुदमण्डले ॥ २३॥
    समानो नाभिदेशे तु उदानः कण्ठमध्यगः । व्यानः सर्वशरीरे तु प्रधानाः पञ्चवायवः ॥ २४॥ उद्गारे नाग आख्यातः
    कूर्म उन्मीलने तथा । कृकरः क्षुत्करो ज्ञेयो देवदत्तो विजृम्भणे ॥ २५॥ न जहाति मृतं वापि सर्वव्यापी
    धनञ्जयः । एते नाडीषु सर्वासु भ्रमन्ते जीवजन्तवः ॥ २६॥ आक्षिप्तो भुजदण्डेन यथा चलति कन्दुकः । प्राणापानसमाक्षिप्तस्तथा
    जीवो न तिष्ठति ॥ २७॥ प्राणापानवशो जीवो ह्यधश्चोर्ध्वं च गछति । वामदक्षिणमार्गाभ्यां चञ्चलत्वान्न दृश्यते
    ॥ २८॥ रज्जुबद्धो यथा श्येनो गतोऽप्याकृष्यते पुनः । गुणबद्धस्तथा जीवः प्राणापानेन कर्षति ॥ २९॥ प्राणापानवशो
    जीवो ह्यधश्चोर्ध्वं च गच्छति । अपानः कर्षति प्राणं प्राणोऽपानं च कर्षति। ऊर्ध्वाधःसंस्थितावेतौ यो
    जानाति स योगवित् ॥ ३०॥ हकारेण बहिर्याति सकारेण विशेत्पुनः। हंसहंसेत्यमुं मत्रं जीवो जपति सर्वदा ॥
    ३१॥ षट्शतानि दिवारात्रौ सहस्राण्येकविंशतिः। एतत्सङ्ख्यान्वितं मन्त्रं जीवो जपति सर्वदा ॥ ३२॥ अजपानाम
    गायत्री योगिनां मोक्षदा सदा । अस्याः सङ्कल्पमात्रेण सर्वपापैः प्रमुच्यते ॥ ३३॥ अनया सदृशी विद्या अनया
    सदृशो जपः। अनया सदृशं ज्ञानं न भूतं न भविष्यति ॥ ३४॥ कुण्डलिन्या समुद्भूता गायत्री प्राणधारिणी । प्राणविद्या
    महाविद्या यस्तां वेत्ति स वेदवित् ॥३५॥ कन्दोर्ध्वे कुण्डलीशक्तिरष्टधा कुण्डलाकृतिः । ब्रह्मद्वारमुखं
    नित्यं मुखेनाच्छाद्य तिष्ठति ॥ ३६॥ येन द्वारेण गन्तव्यं ब्रह्मद्वारं मनोमयम् । मुखेनाच्छाद्य तद्द्वारं
    प्रसुप्ता परमेश्वरी ॥ ३७॥ प्रबुद्धा वह्नियोगेन मनसा मरुता सह । सूचिवद्गात्रमादाय व्रजत्यूर्ध्वं सुषुम्नया
    ॥ ३८॥ उद्घाटयेत्कवाटं तु यथाकुञ्चिकया गृहम् । कुण्डलिन्यां तथा योगी मोक्षद्वारं प्रभेदयेत् ॥ ३९॥ कृत्वा
    संपुटितौ करौ दृढतरं बध्वा तु पद्मासनं गाढं वक्षसि संनिधाय चुबुकं ध्यानं च तच्चेष्टितम् । वारंवारमपानमूर्ध्वमनिलं
    प्रोच्च्हारयेत्पूरितं मुञ्चन्प्राणमुपैति बोधमतुलं शक्तिप्रभावान्नरः ॥ ४०॥ अङ्गानां मर्दनं कृत्वा श्रमसंजातवारिणा
    । कट्वम्ललवणत्यागी क्षीरभोजनमाचरेत् ॥४१॥ ब्रह्मचारी मिताहारी योगी योगपरायणः । अब्दादूर्ध्वं भवेत्सिद्धो
    नात्र कार्या विचारणा ॥ ४२॥ सुस्निग्धमधुराहारश्चतुर्थांशविवर्जितः । भुञ्जते शिवसंप्रीत्या मिताहारी
    स उच्यते ॥ ४३॥ कन्दोर्ध्वे कुण्डलीशक्तिरष्टधा कुण्डलीकृतिः । बन्धनाय च मूढानां योगिनां मोक्षदा सदा
    ॥ ४४॥ महामुद्रा नभोमुद्रा ओड्याणं च जलन्धरम् । मूलबन्धं च यो वेत्ति स योगी मुक्तिभाजनम् ॥ ४५॥ पार्ष्णिघातेन
    संपीड्य योनिमाकुञ्चयेद्दृढम् । अपानमूर्ध्वमाकृष्य मूलबन्धो विधीयते ॥ ४६॥ अपानप्राणयोरैक्यं क्षयान्मूत्रपुरीषयोः
    । युवा भवति वृद्धोऽपि सततं मूलबन्धनात् ॥ ४७॥ ओड्याणं कुरुते यस्मादविश्रान्तं महाखगः । ओड्डियाणं तदेव
    स्यान्मृत्युमातङ्गकेसरी ॥ ४८॥ उदरात्पश्चिमं ताणमधोनाभेर्निगद्यते । ओड्याणमुदरे बन्धस्तत्र बन्धो विधीयते
    ॥ ४९॥ बध्नाति हि शिरोजातमधोगामि नभोजलम् । ततो जालन्धरो बन्धः कष्टदुःखौघनाशनः ॥ ५०॥ जालन्धरे कृते बन्धे
    कण्ठसङ्कोचलक्षणे । न पीयूषं पतत्यग्नौ न च वायुः प्रधावति ॥ ५१॥ कपालकुहरे जिह्वा प्रविष्टा विपरीतगा
    । भ्रुवोरन्तर्गता दृष्टिर्मुद्रा भवति खेचरी ॥ ५२॥ न रोगो मरणं तस्य न निद्रा न क्षुधा तृषा । न च मूर्च्छा
    भवेत्तस्य यो मुद्रां वेत्ति खेचरीम् ॥ ५३॥ पीड्यते न च रोगेण लिख्यते न स कर्मभिः । बाध्यते न च केनापि
    यो मुद्रां वेत्ति खेचरीम् ॥ ५४॥ चित्तं चरति खे यस्माज्जिह्वा चरति खे यतः । तेनेयं खेचरी मुद्रा सर्वसिद्धनमस्कृता
    ॥५५॥ बिन्दुमूलशरीरणि शिरास्तत्र प्रतिष्ठिताः । भावयन्ती शरीराणि आपादतलमस्तकम् ॥ ५६॥ खेचर्या मुद्रितं
    येन विवरं लम्बिकोर्ध्वतः । न तस्य क्षीयते बिन्दुः कामिन्यालिङ्गितस्य च ॥ ५७॥ यावद्बिन्दुः स्थितो देहे
    तावन्मृत्युभयं कुतः । यावद्बद्धा नभोमुद्रा तावद्बिन्दुर्न गच्च्हति ॥ ५८॥ ज्वलितोऽपि यथा बिन्दुः संप्राप्तश्च
    हुताशनम् । व्रजत्यूर्ध्वं गतः शक्त्या निरुद्धो योनिमुद्रया ॥ ५९॥ स पुनर्द्विविधो बिन्दुः पाण्डरो लोहितस्तथा
    । पाण्डरं शुक्लमित्याहुर्लोहिताख्यं महारजः ॥ ६०॥ सिन्दूरव्रातसङ्काशं रविस्थानस्थितं रजः । शशिस्थानस्थितं
    शुक्लं तयोरैक्यं सुदुर्लभम् ॥ ६१॥ बिन्दुर्ब्रह्मा रजः शक्तिर्बिन्दुरिन्दू रजो रविः । उभयोः सङ्गमादेव
    प्राप्यते परमं पदम् ॥ ६२॥ वायुना शक्तिचालेन प्रेरितं च यथा रजः । याति बिन्दुः सदैकत्वं भवेद्दिव्यवपुस्तदा
    ॥ ६३॥ शुक्लं चन्द्रेण संयुक्तं रजः सूर्येण सङ्गतम् । तयोः समरसैकत्वं यो जानाति स योगवित् ॥ ६४॥ शोधनं
    नाडिजालस्य चालनं चन्द्रसूर्ययोः । रसानां शोषणं चैव महामुद्राभिधीयते ॥ ६५॥ वक्षोन्यस्तहनुः प्रपीड्य
    सुचिरं योनिं च वामाङ्घनिणा हस्ताभ्यामनुधारयन्प्रसरितं पादं तथा दक्षिणम् । आपूर्य श्वसनेन कुक्षियुगलं
    बध्वा शनै रेचयेत्सेयं व्याधिविनाशिनी सुमहती मुद्रा नृणां कथ्यते ॥ ६६॥ चन्द्रांशेन समभ्यस्य सूर्यांशेनाभ्यसेत्पुनः
    । या तुल्या तु भवेत्सङ्ख्या ततो मुद्रां विसर्जयेत् ॥ ६७॥ नहि पथ्यमपथ्यं वा रसाः सर्वेऽपि नीरसाः ।
    अतिभुक्तं विषं घोरं पीयूषमिव जीर्यते ॥ ६८॥ क्षयकुष्ठगुदावर्तगुल्माजीर्णपुरोगमाः । तस्य रोगाः क्षयं
    यान्ति महामुद्रां तु योऽभ्यसेत् ॥ ६९॥ कथितेयं महामुद्रा महासिद्धिकरी नृणाम् । गोपनीया प्रयत्नेन न
    देया यस्य कस्यचित् ॥ ७०॥ पद्मासनं समारुह्य समकायशिरोधरः । नासाग्रदृष्टिरेकान्ते जपेदोङ्कारमव्ययम्
    ॥ ७१॥ ॐ नित्यं शुद्धं बुद्धं निर्विकल्पं निरञ्जनं निराख्यातमनादिनिधनमेकं तुरीयं यद्भूतं भवद्भविष्यत्परिवर्तमानं
    सर्वदाऽनवच्छिन्नं परं ब्रह्म तस्माज्जाता परा शक्तिः स्वयंज्योतिरा
