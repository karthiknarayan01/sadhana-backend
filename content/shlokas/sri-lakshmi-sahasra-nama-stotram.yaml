id: sri-lakshmi-sahasra-nama-stotram
category: stotram
name:
  english: Sri Lakshmi Sahasra Nama Stotram
content:
  english: namnam sashtasahasranca bruhi gargya mahamate | mahalakshmya mahadevya bhuktimuktyarthasiddhaye
    || || gargya uvaca sanatkumaramasinam dvadashadityasannibham | apricchanyogino bhaktya yoginamarthasiddhaye
    || || sarvalaukikakarmabhyo vimuktanam hitaya vai | bhuktimuktipradam japyamanubruhi dayanidhe ||
    || sanatkumara bhagavansarvajno'si visheshatah | astikyasiddhaye nrinam kshipradharmarthasadhanam
    || || khidyanti manavassarve dhanabhavena kevalam | siddhyanti dhanino'nyasya naiva dharmarthakamanah
    || || daridryadhvamsini nama kena vidya prakirtita | kena va brahmavidya'pi kena mrityuvinashini ||
    || sarvasam sarabhutaika vidyanam kena kirtita | pratyakshasiddhida brahman tamacakshva dayanidhe
    || || sanatkumara uvaca sadhu prishtam mahabhagassarvalokahitaishinah | mahatamesha dharmashca nanyeshamiti
    me matih || || brahmavishnumahadevamahendradimahatmabhih | samproktam kathayamyadya lakshminamasahasrakam
    || || yasyoccaranamatrena daridryanmucyate narah | kim punastajjapajjapi sarveshtarthanavapnuyat ||
    || asya shrilakshmidivyasahasranamastotramahamantrasya anandakardamaciklitendirasutadayo mahatmano
    maharshayah anushtupchandah vishnumaya shaktih mahalakshmih paradevata shrimahalakshmiprasadadvara
    sarveshtarthasiddhyarthe jape viniyogah | dhyanam padmanabhapriyam devim padmakshim padmavasinim |
    padmavaktram padmahastam vande padmamaharnisham || || purnenduvadanam divyaratnabharanabhushitam |
    varadabhayahastadhyam dhyayeccandrasahodarim || || iccharupam bhagavatassaccidanandarupinim | sarvajnam
    sarvajananim vishnuvakshassthalalayam | dayalumanisham dhyayetsukhasiddhisvarupinim || || stotram
    nityagatanantanitya nandini janaranjani | nityaprakashini caiva svaprakashasvarupini || || mahalakshmirmahakali
    mahakanya sarasvati | bhogavaibhavasandhatri bhaktanugrahakarini || || ishavasya mahamaya mahadevi
    maheshvari | hrillekha parama shaktirmatrikabijarupini || || nityananda nityabodha nadini janamodini
    | satyapratyayani caiva svaprakashatmarupini || || tripura bhairavi vidya hamsa vagishvari shiva |
    vagdevi ca maharatrih kalaratristrilocana || || bhadrakali karali ca mahakali tilottama | kali karalavaktranta
    kamakshi kamada shubha || || candika candarupesha camunda cakradharini | trailokyajayini devi trailokyavijayottama
    || || siddhalakshmih kriyalakshmirmokshalakshmih prasadini | uma bhagavati durga candri dakshayani
    shiva || || pratyangira dharavela lokamata haripriya | parvati parama devi brahmavidyapradayini ||
    || arupa bahurupa ca virupa vishvarupini | pancabhutatmika vani pancabhutatmika para || || kali ma
    pancika vagmi havihpratyadhidevata | devamata sureshana devagarbha'mbika dhritih || || sankhya jatih
    kriyashaktih prakritirmohini mahi | yajnavidya mahavidya guhyavidya vibhavari || || jyotishmati mahamata
    sarvamantraphalaprada | daridryadhvamsini devi hridayagranthibhedini || || sahasradityasankasha candrika
    candrarupini | gayatri somasambhutissavitri pranavatmika || || shankari vaishnavi brahmi sarvadevanamaskrita
    | sevyadurga kuberakshi karaviranivasini || || jaya ca vijaya caiva jayanti ca'parajita | kubjika
    kalika shastri vinapustakadharini || || sarvajnashaktishshrishaktirbrahmavishnushivatmika | idapingalikamadhyamrinalitanturupini
    || || yajneshani pratha diksha dakshina sarvamohini | ashtangayogini devi nirbijadhyanagocara || ||
    sarvatirthasthita shuddha sarvaparvatavasini | vedashastraprabha devi shadangadipadakrama || || shiva
    dhatri shubhananda yajnakarmasvarupini | vratini menaka devi brahmani brahmacarini || || ekaksharapara
    tara bhavabandhavinashini | vishvambhara dharadhara niradhara'dhikasvara || || raka kuhuramavasya
    purnima'numatirdyutih | sinivali shiva'vashya vaishvadevi pishangila || || pippala ca vishalakshi
    rakshoghni vrishtikarini | dushtavidravini devi sarvopadravanashini || || sharada sharasandhana sarvashastrasvarupini
    | yuddhamadhyasthita devi sarvabhutaprabhanjani || || ayuddha yuddharupa ca shanta shantisvarupini
    | ganga sarasvativeniyamunanarmadapaga || || samudravasanavasa brahmandashronimekhala | pancavaktra
    dashabhuja shuddhasphatikasannibha || || rakta krishna sita pita sarvavarna nirishvari | kalika cakrika
    devi satya tu vatukasthita || || taruni varuni nari jyeshthadevi sureshvari | vishvambharadhara kartri
    galargalavibhanjani || || sandhyaratrirdivajyotsna kalakashtha nimeshika | urvi katyayani shubhra
    samsararnavatarini || || kapila kilika'shoka mallikanavamallika | devika nandika shanta bhanjika bhayabhanjika
    || || kaushiki vaidiki devi sauri rupadhika'tibha | digvastra navavastra ca kanyaka kamalodbhava ||
    || shrissaumyalakshana'titadurga sutraprabodhika | shraddha medha kritih prajna dharana kantireva
    ca || || shrutih smritirdhritirdhanya bhutirishtirmanishini | viraktirvyapini maya sarvamayaprabhanjani
    || || mahendri mantrini simhi cendrajalasvarupini | avasthatrayanirmukta gunatrayavivarjita || ||
    ishanatrayanirmukta sarvarogavivarjita | yogidhyanantagamya ca yogadhyanaparayana || || trayishikha
    visheshajna vedantajnanarupini | bharati kamala bhasha padma padmavati kritih || || gautami gomati
    gauri ishana hamsavahini | narayani prabhadhara jahnavi shankaratmaja || || citraghanta sunanda shrirmanavi
    manusambhava | stambhini kshobhini mari bhramini shatrumarini || || mohini dveshini vira aghora rudrarupini
    | rudraikadashini punya kalyani labhakarini || || devadurga mahadurga svapnadurga'shtabhairavi | suryacandragnirupa
    ca grahanakshatrarupini || || bindunadakalatita bindunadakalatmika | dashavayujayakara kalashodashasamyuta
    || || kashyapi kamaladevi nadacakranivasini | mridadhara sthira guhya devika cakrarupini || || avidya
    sharvari bhunja jambhasuranibarhini | shrikaya shrikala shubhra karmanirmulakarini || || adilakshmirgunadhara
    pancabrahmatmika para | shrutirbrahmamukhavasa sarvasampattirupini || || mritasanjivani maitri kamini
    kamavarjita | nirvanamargada devi hamsini kashika kshama || || saparya gunini bhinna nirguna khanditashubha
    | svamini vedini shakya shambari cakradharini || || dandini mundini vyaghri shikhini somasamhatih
    | cintamanishcidananda pancabanaprabodhini || || banashrenissahasrakshi sahasrabhujapaduka | sandhyavalistrisandhyakhya
    brahmandamanibhushana || || vasavi varunisena kulika mantraranjani | jitapranasvarupa ca kanta kamyavaraprada
    || || mantrabrahmanavidyartha nadarupa havishmati | atharvanih shrutih shunya kalpanavarjita sati
    || || sattajatih prama'meya'pramitih pranada gatih | avarna pancavarna ca sarvada bhuvaneshvari ||
    || trailokyamohini vidya sarvabhartri kshara'kshara | hiranyavarna harini sarvopadravanashini || ||
    kaivalyapadavirekha suryamandalasamsthita | somamandalamadhyastha vahnimandalasamsthita || || vayumandalamadhyastha
    vyomamandalasamsthita | cakrika cakramadhyastha cakramargapravartini || || kokilakulacakresha pakshatih
    panktipavani | sarvasiddhantamargastha shadvarnavaravarjita || || shararudrahara hantri sarvasamharakarini
    | purusha paurushi tushtissarvatantraprasutika || || ardhanarishvari devi sarvavidyapradayini | bhargavi
    yajushividya sarvopanishadasthita || vyomakeshakhilaprana pancakoshavilakshana | pancakoshatmika pratyakpancabrahmatmika
    shiva || || jagajjarajanitri ca pancakarmaprasutika | vagdevyabharanakara sarvakamyasthitasthitih
    || || ashtadashacatushshashthipithika vidyaya yuta | kalikakarshanashyama yakshini kinnareshvari ||
    || ketaki mallika'shoka varahi dharani dhruva | narasimhi mahograsya bhaktanamartinashini || || antarbala
    sthira lakshmirjaramarananashini | shriranjita mahakaya somasuryagnilocana || || aditirdevamata ca
    ashtaputra'shtayogini | ashtaprakritirashtashtavibhrajadvikritakritih || || durbhikshadhvamsini devi
    sita satya ca rukmini | khyatija bhargavi devi devayonistapasvini || || shakambhari mahashona garudoparisamsthita
    | simhaga vyaghraga devi vayuga ca mahadriga || || akaradikshakaranta sarvavidyadhidevata | mantravyakhyananipuna
    jyotishshastraikalocana || || idapingalikamadhyasushumna granthibhedini | kalacakrashrayopeta kalacakrasvarupini
    || || vaisharadi matishshreshtha varishtha sarvadipika | vainayaki vararoha shronivela bahirvalih
    || || jambhini jrimbhini jambhakarini ganakarika | sharani cakrika'nanta sarvavyadhicikitsaki || ||
    devaki devasankasha varidhih karunakara | sharvari sarvasampanna sarvapapaprabhanjani || || ekamatra
    dvimatra ca trimatra ca tatha'para | ardhamatra para sukshma sukshmartha'rthapara'para || || ekavira
    visheshakhya shashthidevi manasvini | naishkarmya nishkalaloka jnanakarmadhika guna || || sabandhvanandasandoha
    vyomakara'nirupita | gadyapadyatmika vani sarvalankarasamyuta || || sadhubandhapadanyasa sarvauko
    ghatikavalih | shatkarma karkashakara sarvakarmavivarjita || || adityavarna caparna kamini vararupini
    | brahmani brahmasantana vedavagishvari shiva || || purananyayamimamsadharmashastragamashruta | sadyovedavati
    sarva hamsi vidyadhidevata || || vishveshvari jagaddhatri vishvanirmanakarini | vaidiki vedarupa ca
    kalika kalarupini || || narayani mahadevi sarvatattvapravartini | hiranyavarnarupa ca hiranyapadasambhava
    || || kaivalyapadavi punya kaivalyajnanalakshita | brahmasampattirupa ca brahmasampattikarini || ||
    varuni varunaradhya sarvakarmapravartini | ekaksharapara''yukta sarvadaridryabhanjini || || pashankushanvita
    divya vinavyakhyakshasutrabhrit | ekamurtistrayimurtirmadhukaitabhabhanjini || || sankhya sankhyavati
    jvala jvalanti kamarupini | jagrati sarvasampattissushupta sveshtadayini || || kapalini mahadamshtra
    bhrukuti kutilanana | sarvavasa suvasa ca brihatyashtishca shakvari || || chandoganapratishtha ca
    kalmashi karunatmika | cakshushmati mahaghosha khadgacarmadhara'shanih || || shilpavaicitryavidyota
    sarvatobhadravasini | acintyalakshanakara sutrabhashyanibandhana || || sarvavedarthasampattissarvashastrarthamatrika
    | akaradikshakarantasarvavarnakritasthala || || sarvalakshmissadananda saravidya sadashiva | sarvajna
    sarvashaktishca khecarirupagocchrita || || animadigunopeta para kashtha para gatih | hamsayuktavimanastha
    hamsarudha shashiprabha || || bhavani vasanashaktirakritisthakhila'khila | tantraheturvicitrangi vyomagangavinodini
    || || varsha ca varshika caiva rigyajussamarupini | mahanadinadipunya'ganyapunyagunakriya || || samadhigatalabhyartha
    shrotavya svapriya ghrina | namaksharapara devi upasarganakhancita || || nipatorudvayijangha matrika
    mantrarupini | asina ca shayana ca tishthanti dhavanadhika || || lakshyalakshanayogadhya tadrupyagananakritih
    | saikarupa naikarupa sendurupa tadakritih || || samasataddhitakara vibhaktivacanatmika | svahakara
    svadhakara shripatyardhanganandini || || gambhira gahana guhya yonilingardhadharini | sheshavasukisamsevya
    capala varavarnini || || karunyakarasampattih kilakrinmantrakilika | shaktibijatmika sarvamantreshtakshayakamana
    || || agneyi parthiva apya vayavya vyomaketana | satyajnanatmika''nanda brahmi brahma sanatani ||
    || avidyavasana mayaprakritissarvamohini | shaktirdharanashaktishca cidacicchaktiyogini || || vaktraruna
    mahamaya maricirmadamardini | virat svaha svadha shuddha nirupastissubhaktiga || || nirupitadvayividya
    nityanityasvarupini | vairajamargasancara sarvasatpathadarshini || || jalandhari mridani ca bhavani
    bhavabhanjani | traikalikajnanatantustrikalajnanadayini || || nadatita smritih prajna dhatrirupa tripushkara
    | parajitavidhanajna visheshitagunatmika || || hiranyakeshini hemabrahmasutravicakshana | asankhyeyaparardhantasvaravyanjanavaikhari
    || || madhujihva madhumati madhumasodaya madhuh | madhavi ca mahabhaga meghagambhiranisvana || ||
    brahmavishnumaheshadijnatavyarthavisheshaga | nabhau vahnishikhakara lalate candrasannibha || || bhrumadhye
    bhaskarakara sarvatarakritirhridi | krittikadibharanyantanakshatreshtyarcitodaya || || grahavidyatmika
    jyotirjyotirvinmatijivika | brahmandagarbhini bala saptavaranadevata || || vairajottamasamrajya kumarakushalodaya
    | bagala bhramaramba ca shivaduti shivatmika || || meruvindhyadisamsthana kashmirapuravasini | yoganidra
    mahanidra vinidra rakshasashrita || || suvarnada mahaganga pancakhya pancasamhatih | suprajata suvira
    ca suposha supatishshiva || || sugriha raktabijanta hatakandarpajivika | samudravyomamadhyastha samabindusamashraya
    || || saubhagyarasajivatussarasaravivekadrik | trivalyadisupushtanga bharati bharatashrita || || nadabrahmamayividya
    jnanabrahmamayipara | brahmanadi niruktishca brahmakaivalyasadhanam || || kalikeyamahodaraviryavikramarupini
    | vadavagnishikhavaktra mahakavalatarpana || || mahabhuta mahadarpa mahasara mahakratuh | panjabhutamahagrasa
    pancabhutadhidevata || || sarvapramana sampattissarvarogapratikriya | brahmandantarbahirvyapta vishnuvakshovibhushini
    || || shankari vidhivaktrastha pravara varahetuki | hemamala shikhamala trishikha pancalocana || sarvagamasadacaramaryada
    yatubhanjani | punyashlokaprabandhadhya sarvantaryamirupini || || samaganasamaradhya shrotrakarnarasayanam
    | jivalokaikajivaturbhadrodaravilokana || || tatitkotilasatkantistaruni harisundari | minanetra ca
    sendrakshi vishalakshi sumangala || || sarvamangalasampanna sakshanmangaladevata | dehahriddipika
    diptirjihvapapapranashini || || ardhacandrollasaddamshtra yajnavativilasini | mahadurga mahotsaha
    mahadevabalodaya || || dakinidya shakinidya sakinidya samastajut | nirankusha nakivandya shadadharadhidevata
    || || bhuvanajnaninishshreni bhuvanakaravallari | shashvati shashvatakara lokanugrahakarini || ||
    sarasi manasi hamsi hamsalokapradayini | cinmudralankritakara kotisuryasamaprabha || || sukhapranishirorekha
    sadadrishtapradayini | sarvasankaryadoshaghni grahopadravanashini || || kshudrajantubhayaghni ca visharogadibhanjani
    | sadashanta sadashuddha grihacchidranivarini || || kalidoshaprashamani kolahalapurasthita | gauri
    lakshaniki mukhya jaghanyakritivarjita || || maya vidya mulabhuta vasavi vishnucetana | vadini vasurupa
    ca vasuratnaparicchada || || chandasi candrahridaya mantrasvacchandabhairavi | vanamala vaijayanti
    pancadivyayudhatmika || || pitambaramayi cancatkaustubha harikamini | nitya tathya rama rama ramani
    mrityubhanjani || || jyeshtha kashtha dhanishthanta sharangi nirgunapriya | maitreya mitravinda ca
    sheshyasheshakalashaya || || varanasivasalabhya caryavartajanastuta | jagadutpattisamsthanasamharatrayakaranam
    || || tvamamba vishnusarvasvam namaste'stu maheshvari | namaste sarvalokanam jananyai punyamurtaye
    || || siddhalakshmirmahakali mahalakshmi namo'stu te | sadyojatadipancagnirupa pancakapancakam ||
    || yantralakshmirbhavatyadiradyadye te namo namah | srishtyadikaranakaravitate doshavarjite || ||
    jagallakshmirjaganmatarvishnupatni namo'stu te | navakotimahashaktisamupasyapadambuje || || kanatsauvarnaratnadhya
    sarvabharanabhushite | anantanityamahishiprapanceshvaranayaki || || atyucchritapadantasthe paramavyomanayaki
    | nakaprishthagataradhye vishnulokavilasini || || vaikuntharajamahishi shriranganagarashrite | ranganayaki
    bhuputri krishne varadavallabhe || || kotibrahmadisamsevye kotirudradikirtite | matulungamayam khetam
    sauvarnacashakam tatha || || padmadvayam purnakumbham kiranca varadabhaye | pashamankushakam shankham
    cakram shulam kripanikam || || dhanurbanau cakshamalam cinmudramapi bibhrati | ashtadashabhuje lakshmirmahashtadashapithage
    || || bhuminiladisamsevye svamicittanuvartini | padme padmalaye padmi purnakumbhabhishecite || ||
    indirendindirabhakshi kshirasagarakanyake | bhargavi tvam svatantreccha vashikritajagatpatih || ||
    mangalam mangalanam tvam devatanam ca devata | tvamuttamottamanam ca tvam shreyah paramamritam ||
    || dhanadhanyabhivriddhishca sarvabhaumasukhocchraya | andolikadisaubhagyam mattebhadimahodayah ||
    || putrapautrabhivriddhishca vidyabhogabaladikam | ayurarogyasampattirashtaishvaryam tvameva hi ||
    || parameshavibhutishca sukshmatsukshmataragatih | sadayapangasandattabrahmendradipadasthitih || ||
    avyahatamahabhagyam tvamevakshobhyavikramah | samanvayashca vedanamavirodhastvameva hi || || nihshreyasapadapraptisadhanam
    phalameva ca | shrimantrarajarajni ca shrividya kshemakarini || || shrimbijajapasantushta aim hrim
    shrim bijapalika | prapattimargasulabha vishnuprathamakinkari || || klinkararthasavitri ca saumangalyadhidevata
    | shrishodashaksharividya shriyantrapuravasini || || sarvamangalamangalye shive sarvarthasadhike |
    sharanye tryambake gauri narayani namo'stu te || || punah punarnamaste'stu sashtangamayutam punah
    | sanatkumara uvaca evam stuta mahalakshmirbrahmarudradibhissuraih | namadbhirartairdinaishca nissvatvairbhogavarjitaih
    || || jyeshtha jushtaishca nishshrikaissamsaratsvaparayanaih | vishnupatni dadau tesham darshanam
    drishtitarpanam || || sharatpurnendukotyabhadhavalapangavikshanaih | sarvansattvasamavishtan cakre
    hrishta varam dadau || namnam sashtasahasram me pramadadvapi yassakrit | kirtayettatkule satyam vasamyacandratarakam
    || || kim punarniyamajjapturmadekasharanasya ca | matrivatsanukampaham poshaki syamaharnisham || ||
    mannama stavatam loke durlabham nasti cintitam | matprasadena sarve'pi svasveshtarthamavapsyatha ||
    || luptavaishnavadharmasya madvrateshvavakirninah | bhaktiprapattihinasya vandyo namnam stavo'pi me
    || || tasmadavashyam tairdoshairvihinah papavarjitah | japetsashtasahasram me namnam pratyahamadarat
    || || sakshadalakshmiputro'pi durbhagyo'pyalaso'pi va | aprayatno'pi mudho'pi vikalah patito'pi ca
    || || avashyam prapnuyadbhagyam matprasadena kevalam | spriheyamaciraddeva varadanaya japinah | dadami
    sarvamishtartham lakshmiti smaratam dhruvam || ityuktva'ntardadhe lakshmirvaishnavi bhagavatkala |
    ishtapurtam ca sukritam bhagadheyam ca cintitam || || svam svam sthanam ca bhogam ca vijayam lebhire
    surah | tadetat pravadamyadya lakshminamasahasrakam | yoginah pathata kshipram cintitarthanavapsyatha
    || sanatkumaroyogindra ityuktva sa dayanidhih | anugrihya yayau kshipram tamshca dvadashayoginah ||
    || tasmadetadrahasyam ca gopyam japyam prayatnatah | ashtamyam ca caturdashyam navamyam bhriguvasare
    || || paurnamasyamamayam ca parvakale visheshatah | japedva nityakaryeshu sarvankamanavapnuyat ||
    || iti shriskandapurane sanatkumarasamhitayam lakshmisahasranamastotram sampurnam ||
  devanagari: नाम्नां साष्टसहस्रञ्च ब्रूहि गार्ग्य महामते । महालक्ष्म्या महादेव्या भुक्तिमुक्त्यर्थसिद्धये
    ॥ ॥ गार्ग्य उवाच सनत्कुमारमासीनं द्वादशादित्यसन्निभम् । अपृच्छन्योगिनो भक्त्या योगिनामर्थसिद्धये ॥
    ॥ सर्वलौकिककर्मभ्यो विमुक्तानां हिताय वै । भुक्तिमुक्तिप्रदं जप्यमनुब्रूहि दयानिधे ॥ ॥ सनत्कुमार भगवन्सर्वज्ञोऽसि
    विशेषतः । आस्तिक्यसिद्धये नॄणां क्षिप्रधर्मार्थसाधनम् ॥ ॥ खिद्यन्ति मानवास्सर्वे धनाभावेन केवलम् ।
    सिद्ध्यन्ति धनिनोऽन्यस्य नैव धर्मार्थकामनाः ॥ ॥ दारिद्र्यध्वंसिनी नाम केन विद्या प्रकीर्तिता । केन
    वा ब्रह्मविद्याऽपि केन मृत्युविनाशिनी ॥ ॥ सर्वासां सारभूतैका विद्यानां केन कीर्तिता । प्रत्यक्षसिद्धिदा
    ब्रह्मन् तामाचक्ष्व दयानिधे ॥ ॥ सनत्कुमार उवाच साधु पृष्टं महाभागास्सर्वलोकहितैषिणः । महतामेष धर्मश्च
    नान्येषामिति मे मतिः ॥ ॥ ब्रह्मविष्णुमहादेवमहेन्द्रादिमहात्मभिः । सम्प्रोक्तं कथयाम्यद्य लक्ष्मीनामसहस्रकम्
    ॥ ॥ यस्योच्चारणमात्रेण दारिद्र्यान्मुच्यते नरः । किं पुनस्तज्जपाज्जापी सर्वेष्टार्थानवाप्नुयात् ॥
    ॥ अस्य श्रीलक्ष्मीदिव्यसहस्रनामस्तोत्रमहामन्त्रस्य आनन्दकर्दमचिक्लीतेन्दिरासुतादयो महात्मानो महर्षयः
    अनुष्टुप्छन्दः विष्णुमाया शक्तिः महालक्ष्मीः परादेवता श्रीमहालक्ष्मीप्रसादद्वारा सर्वेष्टार्थसिद्ध्यर्थे
    जपे विनियोगः । ध्यानम् पद्मनाभप्रियां देवीं पद्माक्षीं पद्मवासिनीम् । पद्मवक्त्रां पद्महस्तां वन्दे
    पद्मामहर्निशम् ॥ ॥ पूर्णेन्दुवदनां दिव्यरत्नाभरणभूषिताम् । वरदाभयहस्ताढ्यां ध्यायेच्चन्द्रसहोदरीम्
    ॥ ॥ इच्छारूपां भगवतस्सच्चिदानन्दरूपिणीम् । सर्वज्ञां सर्वजननीं विष्णुवक्षस्स्थलालयाम् । दयालुमनिशं
    ध्यायेत्सुखसिद्धिस्वरूपिणीम् ॥ ॥ स्तोत्रम् नित्यागतानन्तनित्या नन्दिनी जनरञ्जनी । नित्यप्रकाशिनी चैव
    स्वप्रकाशस्वरूपिणी ॥ ॥ महालक्ष्मीर्महाकाली महाकन्या सरस्वती । भोगवैभवसन्धात्री भक्तानुग्रहकारिणी ॥
    ॥ ईशावास्या महामाया महादेवी महेश्वरी । हृल्लेखा परमा शक्तिर्मातृकाबीजरूपिणी ॥ ॥ नित्यानन्दा नित्यबोधा
    नादिनी जनमोदिनी । सत्यप्रत्ययनी चैव स्वप्रकाशात्मरूपिणी ॥ ॥ त्रिपुरा भैरवी विद्या हंसा वागीश्वरी शिवा
    । वाग्देवी च महारात्रिः कालरात्रिस्त्रिलोचना ॥ ॥ भद्रकाली कराली च महाकाली तिलोत्तमा । काली करालवक्त्रान्ता
    कामाक्षी कामदा शुभा ॥ ॥ चण्डिका चण्डरूपेशा चामुण्डा चक्रधारिणी । त्रैलोक्यजयिनी देवी त्रैलोक्यविजयोत्तमा
    ॥ ॥ सिद्धलक्ष्मीः क्रियालक्ष्मीर्मोक्षलक्ष्मीः प्रसादिनी । उमा भगवती दुर्गा चान्द्री दाक्षायणी शिवा
    ॥ ॥ प्रत्यङ्गिरा धरावेला लोकमाता हरिप्रिया । पार्वती परमा देवी ब्रह्मविद्याप्रदायिनी ॥ ॥ अरूपा बहुरूपा
    च विरूपा विश्वरूपिणी । पञ्चभूतात्मिका वाणी पञ्चभूतात्मिका परा ॥ ॥ काली मा पञ्चिका वाग्मी हविःप्रत्यधिदेवता
    । देवमाता सुरेशाना देवगर्भाऽम्बिका धृतिः ॥ ॥ सङ्ख्या जातिः क्रियाशक्तिः प्रकृतिर्मोहिनी मही । यज्ञविद्या
    महाविद्या गुह्यविद्या विभावरी ॥ ॥ ज्योतिष्मती महामाता सर्वमन्त्रफलप्रदा । दारिद्र्यध्वंसिनी देवी हृदयग्रन्थिभेदिनी
    ॥ ॥ सहस्रादित्यसङ्काशा चन्द्रिका चन्द्ररूपिणी । गायत्री सोमसम्भूतिस्सावित्री प्रणवात्मिका ॥ ॥ शाङ्करी
    वैष्णवी ब्राह्मी सर्वदेवनमस्कृता । सेव्यदुर्गा कुबेराक्षी करवीरनिवासिनी ॥ ॥ जया च विजया चैव जयन्ती
    चाऽपराजिता । कुब्जिका कालिका शास्त्री वीणापुस्तकधारिणी ॥ ॥ सर्वज्ञशक्तिश्श्रीशक्तिर्ब्रह्मविष्णुशिवात्मिका
    । इडापिङ्गलिकामध्यमृणालीतन्तुरूपिणी ॥ ॥ यज्ञेशानी प्रथा दीक्षा दक्षिणा सर्वमोहिनी । अष्टाङ्गयोगिनी
    देवी निर्बीजध्यानगोचरा ॥ ॥ सर्वतीर्थस्थिता शुद्धा सर्वपर्वतवासिनी । वेदशास्त्रप्रभा देवी षडङ्गादिपदक्रमा
    ॥ ॥ शिवा धात्री शुभानन्दा यज्ञकर्मस्वरूपिणी । व्रतिनी मेनका देवी ब्रह्माणी ब्रह्मचारिणी ॥ ॥ एकाक्षरपरा
    तारा भवबन्धविनाशिनी । विश्वम्भरा धराधारा निराधाराऽधिकस्वरा ॥ ॥ राका कुहूरमावास्या पूर्णिमाऽनुमतिर्द्युतिः
    । सिनीवाली शिवाऽवश्या वैश्वदेवी पिशङ्गिला ॥ ॥ पिप्पला च विशालाक्षी रक्षोघ्नी वृष्टिकारिणी । दुष्टविद्राविणी
    देवी सर्वोपद्रवनाशिनी ॥ ॥ शारदा शरसन्धाना सर्वशस्त्रस्वरूपिणी । युद्धमध्यस्थिता देवी सर्वभूतप्रभञ्जनी
    ॥ ॥ अयुद्धा युद्धरूपा च शान्ता शान्तिस्वरूपिणी । गङ्गा सरस्वतीवेणीयमुनानर्मदापगा ॥ ॥ समुद्रवसनावासा
    ब्रह्माण्डश्रोणिमेखला । पञ्चवक्त्रा दशभुजा शुद्धस्फटिकसन्निभा ॥ ॥ रक्ता कृष्णा सिता पीता सर्ववर्णा
    निरीश्वरी । कालिका चक्रिका देवी सत्या तु वटुकास्थिता ॥ ॥ तरुणी वारुणी नारी ज्येष्ठादेवी सुरेश्वरी
    । विश्वम्भराधरा कर्त्री गलार्गलविभञ्जनी ॥ ॥ सन्ध्यारात्रिर्दिवाज्योत्स्ना कलाकाष्ठा निमेषिका । उर्वी
    कात्यायनी शुभ्रा संसारार्णवतारिणी ॥ ॥ कपिला कीलिकाऽशोका मल्लिकानवमल्लिका । देविका नन्दिका शान्ता भञ्जिका
    भयभञ्जिका ॥ ॥ कौशिकी वैदिकी देवी सौरी रूपाधिकाऽतिभा । दिग्वस्त्रा नववस्त्रा च कन्यका कमलोद्भवा ॥ ॥
    श्रीस्सौम्यलक्षणाऽतीतदुर्गा सूत्रप्रबोधिका । श्रद्धा मेधा कृतिः प्रज्ञा धारणा कान्तिरेव च ॥ ॥ श्रुतिः
    स्मृतिर्धृतिर्धन्या भूतिरिष्टिर्मनीषिणी । विरक्तिर्व्यापिनी माया सर्वमायाप्रभञ्जनी ॥ ॥ माहेन्द्री
    मन्त्रिणी सिंही चेन्द्रजालस्वरूपिणी । अवस्थात्रयनिर्मुक्ता गुणत्रयविवर्जिता ॥ ॥ ईषणात्रयनिर्मुक्ता
    सर्वरोगविवर्जिता । योगिध्यानान्तगम्या च योगध्यानपरायणा ॥ ॥ त्रयीशिखा विशेषज्ञा वेदान्तज्ञानरूपिणी
    । भारती कमला भाषा पद्मा पद्मवती कृतिः ॥ ॥ गौतमी गोमती गौरी ईशाना हंसवाहिनी । नारायणी प्रभाधारा जाह्नवी
    शङ्करात्मजा ॥ ॥ चित्रघण्टा सुनन्दा श्रीर्मानवी मनुसम्भवा । स्तम्भिनी क्षोभिणी मारी भ्रामिणी शत्रुमारिणी
    ॥ ॥ मोहिनी द्वेषिणी वीरा अघोरा रुद्ररूपिणी । रुद्रैकादशिनी पुण्या कल्याणी लाभकारिणी ॥ ॥ देवदुर्गा
    महादुर्गा स्वप्नदुर्गाऽष्टभैरवी । सूर्यचन्द्राग्निरूपा च ग्रहनक्षत्ररूपिणी ॥ ॥ बिन्दुनादकलातीता बिन्दुनादकलात्मिका
    । दशवायुजयाकारा कलाषोडशसंयुता ॥ ॥ काश्यपी कमलादेवी नादचक्रनिवासिनी । मृडाधारा स्थिरा गुह्या देविका
    चक्ररूपिणी ॥ ॥ अविद्या शार्वरी भुञ्जा जम्भासुरनिबर्हिणी । श्रीकाया श्रीकला शुभ्रा कर्मनिर्मूलकारिणी
    ॥ ॥ आदिलक्ष्मीर्गुणाधारा पञ्चब्रह्मात्मिका परा । श्रुतिर्ब्रह्ममुखावासा सर्वसम्पत्तिरूपिणी ॥ ॥ मृतसञ्जीवनी
    मैत्री कामिनी कामवर्जिता । निर्वाणमार्गदा देवी हंसिनी काशिका क्षमा ॥ ॥ सपर्या गुणिनी भिन्ना निर्गुणा
    खण्डिताशुभा । स्वामिनी वेदिनी शक्या शाम्बरी चक्रधारिणी ॥ ॥ दण्डिनी मुण्डिनी व्याघ्री शिखिनी सोमसंहतिः
    । चिन्तामणिश्चिदानन्दा पञ्चबाणप्रबोधिनी ॥ ॥ बाणश्रेणिस्सहस्राक्षी सहस्रभुजपादुका । सन्ध्यावलिस्त्रिसन्ध्याख्या
    ब्रह्माण्डमणिभूषणा ॥ ॥ वासवी वारुणीसेना कुलिका मन्त्ररञ्जनी । जितप्राणस्वरूपा च कान्ता काम्यवरप्रदा
    ॥ ॥ मन्त्रब्राह्मणविद्यार्था नादरूपा हविष्मती । आथर्वणिः श्रुतिः शून्या कल्पनावर्जिता सती ॥ ॥ सत्ताजातिः
    प्रमाऽमेयाऽप्रमितिः प्राणदा गतिः । अवर्णा पञ्चवर्णा च सर्वदा भुवनेश्वरी ॥ ॥ त्रैलोक्यमोहिनी विद्या
    सर्वभर्त्री क्षराऽक्षरा । हिरण्यवर्णा हरिणी सर्वोपद्रवनाशिनी ॥ ॥ कैवल्यपदवीरेखा सूर्यमण्डलसंस्थिता
    । सोममण्डलमध्यस्था वह्निमण्डलसंस्थिता ॥ ॥ वायुमण्डलमध्यस्था व्योममण्डलसंस्थिता । चक्रिका चक्रमध्यस्था
    चक्रमार्गप्रवर्तिनी ॥ ॥ कोकिलाकुलचक्रेशा पक्षतिः पङ्क्तिपावनी । सर्वसिद्धान्तमार्गस्था षड्वर्णावरवर्जिता
    ॥ ॥ शररुद्रहरा हन्त्री सर्वसंहारकारिणी । पुरुषा पौरुषी तुष्टिस्सर्वतन्त्रप्रसूतिका ॥ ॥ अर्धनारीश्वरी
    देवी सर्वविद्याप्रदायिनी । भार्गवी याजुषीविद्या सर्वोपनिषदास्थिता ॥ व्योमकेशाखिलप्राणा पञ्चकोशविलक्षणा
    । पञ्चकोशात्मिका प्रत्यक्पञ्चब्रह्मात्मिका शिवा ॥ ॥ जगज्जराजनित्री च पञ्चकर्मप्रसूतिका । वाग्देव्याभरणाकारा
    सर्वकाम्यस्थितास्थितिः ॥ ॥ अष्टादशचतुष्षष्ठिपीठिका विद्यया युता । कालिकाकर्षणश्यामा यक्षिणी किन्नरेश्वरी
    ॥ ॥ केतकी मल्लिकाऽशोका वाराही धरणी ध्रुवा । नारसिंही महोग्रास्या भक्तानामार्तिनाशिनी ॥ ॥ अन्तर्बला
    स्थिरा लक्ष्मीर्जरामरणनाशिनी । श्रीरञ्जिता महाकाया सोमसूर्याग्निलोचना ॥ ॥ अदितिर्देवमाता च अष्टपुत्राऽष्टयोगिनी
    । अष्टप्रकृतिरष्टाष्टविभ्राजद्विकृताकृतिः ॥ ॥ दुर्भिक्षध्वंसिनी देवी सीता सत्या च रुक्मिणी । ख्यातिजा
    भार्गवी देवी देवयोनिस्तपस्विनी ॥ ॥ शाकम्भरी महाशोणा गरुडोपरिसंस्थिता । सिंहगा व्याघ्रगा देवी वायुगा
    च महाद्रिगा ॥ ॥ अकारादिक्षकारान्ता सर्वविद्याधिदेवता । मन्त्रव्याख्याननिपुणा ज्योतिश्शास्त्रैकलोचना
    ॥ ॥ इडापिङ्गलिकामध्यासुषुम्ना ग्रन्थिभेदिनी । कालचक्राश्रयोपेता कालचक्रस्वरूपिणी ॥ ॥ वैशारदी मतिश्श्रेष्ठा
    वरिष्ठा सर्वदीपिका । वैनायकी वरारोहा श्रोणिवेला बहिर्वलिः ॥ ॥ जम्भिनी जृम्भिणी जम्भकारिणी गणकारिका
    । शरणी चक्रिकाऽनन्ता सर्वव्याधिचिकित्सकी ॥ ॥ देवकी देवसङ्काशा वारिधिः करुणाकरा । शर्वरी सर्वसम्पन्ना
    सर्वपापप्रभञ्जनी ॥ ॥ एकमात्रा द्विमात्रा च त्रिमात्रा च तथाऽपरा । अर्धमात्रा परा सूक्ष्मा सूक्ष्मार्थाऽर्थपराऽपरा
    ॥ ॥ एकवीरा विशेषाख्या षष्ठीदेवी मनस्विनी । नैष्कर्म्या निष्कलालोका ज्ञानकर्माधिका गुणा ॥ ॥ सबन्ध्वानन्दसन्दोहा
    व्योमाकाराऽनिरूपिता । गद्यपद्यात्मिका वाणी सर्वालङ्कारसंयुता ॥ ॥ साधुबन्धपदन्यासा सर्वौको घटिकावलिः
    । षट्कर्मा कर्कशाकारा सर्वकर्मविवर्जिता ॥ ॥ आदित्यवर्णा चापर्णा कामिनी वररूपिणी । ब्रह्माणी ब्रह्मसन्ताना
    वेदवागीश्वरी शिवा ॥ ॥ पुराणन्यायमीमांसाधर्मशास्त्रागमश्रुता । सद्योवेदवती सर्वा हंसी विद्याधिदेवता
    ॥ ॥ विश्वेश्वरी जगद्धात्री विश्वनिर्माणकारिणी । वैदिकी वेदरूपा च कालिका कालरूपिणी ॥ ॥ नारायणी महादेवी
    सर्वतत्त्वप्रवर्तिनी । हिरण्यवर्णरूपा च हिरण्यपदसम्भवा ॥ ॥ कैवल्यपदवी पुण्या कैवल्यज्ञानलक्षिता ।
    ब्रह्मसम्पत्तिरूपा च ब्रह्मसम्पत्तिकारिणी ॥ ॥ वारुणी वारुणाराध्या सर्वकर्मप्रवर्तिनी । एकाक्षरपराऽऽयुक्ता
    सर्वदारिद्र्यभञ्जिनी ॥ ॥ पाशाङ्कुशान्विता दिव्या वीणाव्याख्याक्षसूत्रभृत् । एकमूर्तिस्त्रयीमूर्तिर्मधुकैटभभञ्जिनी
    ॥ ॥ साङ्ख्या साङ्ख्यवती ज्वाला ज्वलन्ती कामरूपिणी । जाग्रती सर्वसम्पत्तिस्सुषुप्ता स्वेष्टदायिनी ॥
    ॥ कपालिनी महादंष्ट्रा भ्रुकुटी कुटिलानना । सर्वावासा सुवासा च बृहत्यष्टिश्च शक्वरी ॥ ॥ छन्दोगणप्रतिष्ठा
    च कल्माषी करुणात्मिका । चक्षुष्मती महाघोषा खड्गचर्मधराऽशनिः ॥ ॥ शिल्पवैचित्र्यविद्योता सर्वतोभद्रवासिनी
    । अचिन्त्यलक्षणाकारा सूत्रभाष्यनिबन्धना ॥ ॥ सर्ववेदार्थसम्पत्तिस्सर्वशास्त्रार्थमातृका । अकारादिक्षकारान्तसर्ववर्णकृतस्थला
    ॥ ॥ सर्वलक्ष्मीस्सदानन्दा सारविद्या सदाशिवा । सर्वज्ञा सर्वशक्तिश्च खेचरीरूपगोच्छ्रिता ॥ ॥ अणिमादिगुणोपेता
    परा काष्ठा परा गतिः । हंसयुक्तविमानस्था हंसारूढा शशिप्रभा ॥ ॥ भवानी वासनाशक्तिराकृतिस्थाखिलाऽखिला
    । तन्त्रहेतुर्विचित्राङ्गी व्योमगङ्गाविनोदिनी ॥ ॥ वर्षा च वार्षिका चैव ऋग्यजुस्सामरूपिणी । महानदीनदीपुण्याऽगण्यपुण्यगुणक्रिया
    ॥ ॥ समाधिगतलभ्यार्था श्रोतव्या स्वप्रिया घृणा । नामाक्षरपरा देवी उपसर्गनखाञ्चिता ॥ ॥ निपातोरुद्वयीजङ्घा
    मातृका मन्त्ररूपिणी । आसीना च शयाना च तिष्ठन्ती धावनाधिका ॥ ॥ लक्ष्यलक्षणयोगाढ्या ताद्रूप्यगणनाकृतिः
    । सैकरूपा नैकरूपा सेन्दुरूपा तदाकृतिः ॥ ॥ समासतद्धिताकारा विभक्तिवचनात्मिका । स्वाहाकारा स्वधाकारा
    श्रीपत्यर्धाङ्गनन्दिनी ॥ ॥ गम्भीरा गहना गुह्या योनिलिङ्गार्धधारिणी । शेषवासुकिसंसेव्या चपला वरवर्णिनी
    ॥ ॥ कारुण्याकारसम्पत्तिः कीलकृन्मन्त्रकीलिका । शक्तिबीजात्मिका सर्वमन्त्रेष्टाक्षयकामना ॥ ॥ आग्नेयी
    पार्थिवा आप्या वायव्या व्योमकेतना । सत्यज्ञानात्मिकाऽऽनन्दा ब्राह्मी ब्रह्म सनातनी ॥ ॥ अविद्यावासना
    मायाप्रकृतिस्सर्वमोहिनी । शक्तिर्धारणशक्तिश्च चिदचिच्छक्तियोगिनी ॥ ॥ वक्त्रारुणा महामाया मरीचिर्मदमर्दिनी
    । विराट् स्वाहा स्वधा शुद्धा नीरूपास्तिस्सुभक्तिगा ॥ ॥ निरूपिताद्वयीविद्या नित्यानित्यस्वरूपिणी ।
    वैराजमार्गसञ्चारा सर्वसत्पथदर्शिनी ॥ ॥ जालन्धरी मृडानी च भवानी भवभञ्जनी । त्रैकालिकज्ञानतन्तुस्त्रिकालज्ञानदायिनी
    ॥ ॥ नादातीता स्मृतिः प्रज्ञा धात्रीरूपा त्रिपुष्करा । पराजिताविधानज्ञा विशेषितगुणात्मिका ॥ ॥ हिरण्यकेशिनी
    हेमब्रह्मसूत्रविचक्षणा । असङ्ख्येयपरार्धान्तस्वरव्यञ्जनवैखरी ॥ ॥ मधुजिह्वा मधुमती मधुमासोदया मधुः
    । माधवी च महाभागा मेघगम्भीरनिस्वना ॥ ॥ ब्रह्मविष्णुमहेशादिज्ञातव्यार्थविशेषगा । नाभौ वह्निशिखाकारा
    ललाटे चन्द्रसन्निभा ॥ ॥ भ्रूमध्ये भास्कराकारा सर्वताराकृतिर्हृदि । कृत्तिकादिभरण्यन्तनक्षत्रेष्ट्यार्चितोदया
    ॥ ॥ ग्रहविद्यात्मिका ज्योतिर्ज्योतिर्विन्मतिजीविका । ब्रह्माण्डगर्भिणी बाला सप्तावरणदेवता ॥ ॥ वैराजोत्तमसाम्राज्या
    कुमारकुशलोदया । बगला भ्रमराम्बा च शिवदूती शिवात्मिका ॥ ॥ मेरुविन्ध्यादिसंस्थाना काश्मीरपुरवासिनी ।
    योगनिद्रा महानिद्रा विनिद्रा राक्षसाश्रिता ॥ ॥ सुवर्णदा महागङ्गा पञ्चाख्या पञ्चसंहतिः । सुप्रजाता
    सुवीरा च सुपोषा सुपतिश्शिवा ॥ ॥ सुगृहा रक्तबीजान्ता हतकन्दर्पजीविका । समुद्रव्योममध्यस्था समबिन्दुसमाश्रया
    ॥ ॥ सौभाग्यरसजीवातुस्सारासारविवेकदृक् । त्रिवल्यादिसुपुष्टाङ्गा भारती भरताश्रिता ॥ ॥ नादब्रह्ममयीविद्या
    ज्ञानब्रह्ममयीपरा । ब्रह्मनाडी निरुक्तिश्च ब्रह्मकैवल्यसाधनम् ॥ ॥ कालिकेयमहोदारवीर्यविक्रमरूपिणी ।
    वडवाग्निशिखावक्त्रा महाकवलतर्पणा ॥ ॥ महाभूता महादर्पा महासारा महाक्रतुः । पञ्जभूतमहाग्रासा पञ्चभूताधिदेवता
    ॥ ॥ सर्वप्रमाणा सम्पत्तिस्सर्वरोगप्रतिक्रिया । ब्रह्माण्डान्तर्बहिर्व्याप्ता विष्णुवक्षोविभूषिणी ॥
    ॥ शाङ्करी विधिवक्त्रस्था प्रवरा वरहेतुकी । हेममाला शिखामाला त्रिशिखा पञ्चलोचना ॥ सर्वागमसदाचारमर्यादा
    यातुभञ्जनी । पुण्यश्लोकप्रबन्धाढ्या सर्वान्तर्यामिरूपिणी ॥ ॥ सामगानसमाराध्या श्रोत्रकर्णरसायनम् ।
    जीवलोकैकजीवातुर्भद्रोदारविलोकना ॥ ॥ तटित्कोटिलसत्कान्तिस्तरुणी हरिसुन्दरी । मीननेत्रा च सेन्द्राक्षी
    विशालाक्षी सुमङ्गला ॥ ॥ सर्वमङ्गलसम्पन्ना साक्षान्मङ्गलदेवता । देहहृद्दीपिका दीप्तिर्जिह्वपापप्रणाशिनी
    ॥ ॥ अर्धचन्द्रोल्लसद्दंष्ट्रा यज्ञवाटीविलासिनी । महादुर्गा महोत्साहा महादेवबलोदया ॥ ॥ डाकिनीड्या शाकिनीड्या
    साकिनीड्या समस्तजुट् । निरङ्कुशा नाकिवन्द्या षडाधाराधिदेवता ॥ ॥ भुवनज्ञानिनिश्श्रेणी भुवनाकारवल्लरी
    । शाश्वती शाश्वताकारा लोकानुग्रहकारिणी ॥ ॥ सारसी मानसी हंसी हंसलोकप्रदायिनी । चिन्मुद्रालङ्कृतकरा
    कोटिसूर्यसमप्रभा ॥ ॥ सुखप्राणिशिरोरेखा सददृष्टप्रदायिनी । सर्वसाङ्कर्यदोषघ्नी ग्रहोपद्रवनाशिनी ॥ ॥
    क्षुद्रजन्तुभयघ्नी च विषरोगादिभञ्जनी । सदाशान्ता सदाशुद्धा गृहच्छिद्रनिवारिणी ॥ ॥ कलिदोषप्रशमनी कोलाहलपुरस्थिता
    । गौरी लाक्षणिकी मुख्या जघन्याकृतिवर्जिता ॥ ॥ माया विद्या मूलभूता वासवी विष्णुचेतना । वादिनी वसुरूपा
    च वसुरत्नपरिच्छदा ॥ ॥ छान्दसी चन्द्रहृदया मन्त्रस्वच्छन्दभैरवी । वनमाला वैजयन्ती पञ्चदिव्यायुधात्मिका
    ॥ ॥ पीताम्बरमयी चञ्चत्कौस्तुभा हरिकामिनी । नित्या तथ्या रमा रामा रमणी मृत्युभञ्जनी ॥ ॥ ज्येष्ठा काष्ठा
    धनिष्ठान्ता शराङ्गी निर्गुणप्रिया । मैत्रेया मित्रविन्दा च शेष्यशेषकलाशया ॥ ॥ वाराणसीवासलभ्या चार्यावर्तजनस्तुता
    । जगदुत्पत्तिसंस्थानसंहारत्रयकारणम् ॥ ॥ त्वमम्ब विष्णुसर्वस्वं नमस्तेऽस्तु महेश्वरि । नमस्ते सर्वलोकानां
    जनन्यै पुण्यमूर्तये ॥ ॥ सिद्धलक्ष्मीर्महाकालि महलक्ष्मि नमोऽस्तु ते । सद्योजातादिपञ्चाग्निरूपा पञ्चकपञ्चकम्
    ॥ ॥ यन्त्रलक्ष्मीर्भवत्यादिराद्याद्ये ते नमो नमः । सृष्ट्यादिकारणाकारवितते दोषवर्जिते ॥ ॥ जगल्लक्ष्मीर्जगन्मातर्विष्णुपत्नि
    नमोऽस्तु ते । नवकोटिमहाशक्तिसमुपास्यपदाम्बुजे ॥ ॥ कनत्सौवर्णरत्नाढ्य सर्वाभरणभूषिते । अनन्तानित्यमहिषीप्रपञ्चेश्वरनायकि
    ॥ ॥ अत्युच्छ्रितपदान्तस्थे परमव्योमनायकि । नाकपृष्ठगताराध्ये विष्णुलोकविलासिनि ॥ ॥ वैकुण्ठराजमहिषि
    श्रीरङ्गनगराश्रिते । रङ्गनायकि भूपुत्रि कृष्णे वरदवल्लभे ॥ ॥ कोटिब्रह्मादिसंसेव्ये कोटिरुद्रादिकीर्तिते
    । मातुलुङ्गमयं खेटं सौवर्णचषकं तथा ॥ ॥ पद्मद्वयं पूर्णकुम्भं कीरञ्च वरदाभये । पाशमङ्कुशकं शङ्खं चक्रं
    शूलं कृपाणिकाम् ॥ ॥ धनुर्बाणौ चाक्षमालां चिन्मुद्रामपि बिभ्रती । अष्टादशभुजे लक्ष्मीर्महाष्टादशपीठगे
    ॥ ॥ भूमिनीलादिसंसेव्ये स्वामिचित्तानुवर्तिनि । पद्मे पद्मालये पद्मि पूर्णकुम्भाभिषेचिते ॥ ॥ इन्दिरेन्दिन्दिराभाक्षि
    क्षीरसागरकन्यके । भार्गवि त्वं स्वतन्त्रेच्छा वशीकृतजगत्पतिः ॥ ॥ मङ्गलं मङ्गलानां त्वं देवतानां च
    देवता । त्वमुत्तमोत्तमानां च त्वं श्रेयः परमामृतम् ॥ ॥ धनधान्याभिवृद्धिश्च सार्वभौमसुखोच्छ्रया । आन्दोलिकादिसौभाग्यं
    मत्तेभादिमहोदयः ॥ ॥ पुत्रपौत्राभिवृद्धिश्च विद्याभोगबलादिकम् । आयुरारोग्यसम्पत्तिरष्टैश्वर्यं त्वमेव
    हि ॥ ॥ परमेशविभूतिश्च सूक्ष्मात्सूक्ष्मतरागतिः । सदयापाङ्गसन्दत्तब्रह्मेन्द्रादिपदस्थितिः ॥ ॥ अव्याहतमहाभाग्यं
    त्वमेवाक्षोभ्यविक्रमः । समन्वयश्च वेदानामविरोधस्त्वमेव हि ॥ ॥ निःश्रेयसपदप्राप्तिसाधनं फलमेव च । श्रीमन्त्रराजराज्ञी
    च श्रीविद्या क्षेमकारिणी ॥ ॥ श्रीम्बीजजपसन्तुष्टा ऐं ह्रीं श्रीं बीजपालिका । प्रपत्तिमार्गसुलभा विष्णुप्रथमकिङ्करी
    ॥ ॥ क्लीङ्कारार्थसवित्री च सौमङ्गल्याधिदेवता । श्रीषोडशाक्षरीविद्या श्रीयन्त्रपुरवासिनी ॥ ॥ सर्वमङ्गलमाङ्गल्ये
    शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरी नारायणि नमोऽस्तु ते ॥ ॥ पुनः पुनर्नमस्तेऽस्तु साष्टाङ्गमयुतं
    पुनः । सनत्कुमार उवाच एवं स्तुता महालक्ष्मीर्ब्रह्मरुद्रादिभिस्सुरैः । नमद्भिरार्तैर्दीनैश्च निस्स्वत्वैर्भोगवर्जितैः
    ॥ ॥ ज्येष्ठा जुष्टैश्च निश्श्रीकैस्संसारात्स्वपरायणैः । विष्णुपत्नी ददौ तेषां दर्शनं दृष्टितर्पणम्
    ॥ ॥ शरत्पूर्णेन्दुकोट्याभधवलापाङ्गवीक्षणैः । सर्वान्सत्त्वसमाविष्टान् चक्रे हृष्टा वरं ददौ ॥ नाम्नां
    साष्टसहस्रं मे प्रमादाद्वापि यस्सकृत् । कीर्तयेत्तत्कुले सत्यं वसाम्याचन्द्रतारकम् ॥ ॥ किं पुनर्नियमाज्जप्तुर्मदेकशरणस्य
    च । मातृवत्सानुकम्पाहं पोषकी स्यामहर्निशम् ॥ ॥ मन्नाम स्तवतां लोके दुर्लभं नास्ति चिन्तितम् । मत्प्रसादेन
    सर्वेऽपि स्वस्वेष्टार्थमवाप्स्यथ ॥ ॥ लुप्तवैष्णवधर्मस्य मद्व्रतेष्ववकीर्णिनः । भक्तिप्रपत्तिहीनस्य
    वन्द्यो नाम्नां स्तवोऽपि मे ॥ ॥ तस्मादवश्यं तैर्दोषैर्विहीनः पापवर्जितः । जपेत्साष्टसहस्रं मे नाम्नां
    प्रत्यहमादरात् ॥ ॥ साक्षादलक्ष्मीपुत्रोऽपि दुर्भाग्योऽप्यलसोऽपि वा । अप्रयत्नोऽपि मूढोऽपि विकलः पतितोऽपि
    च ॥ ॥ अवश्यं प्राप्नुयाद्भाग्यं मत्प्रसादेन केवलम् । स्पृहेयमचिराद्देवा वरदानाय जापिनः । ददामि सर्वमिष्टार्थं
    लक्ष्मीति स्मरतां ध्रुवम् ॥ इत्युक्त्वाऽन्तर्दधे लक्ष्मीर्वैष्णवी भगवत्कला । इष्टापूर्तं च सुकृतं
    भागधेयं च चिन्तितम् ॥ ॥ स्वं स्वं स्थानं च भोगं च विजयं लेभिरे सुराः । तदेतत् प्रवदाम्यद्य लक्ष्मीनामसहस्रकम्
    । योगिनः पठत क्षिप्रं चिन्तितार्थानवाप्स्यथ ॥ सनत्कुमारोयोगीन्द्र इत्युक्त्वा स दयानिधिः । अनुगृह्य
    ययौ क्षिप्रं तांश्च द्वादशयोगिनः ॥ ॥ तस्मादेतद्रहस्यं च गोप्यं जप्यं प्रयत्नतः । अष्टम्यां च चतुर्दश्यां
    नवम्यां भृगुवासरे ॥ ॥ पौर्णमास्याममायां च पर्वकाले विशेषतः । जपेद्वा नित्यकार्येषु सर्वान्कामानवाप्नुयात्
    ॥ ॥ इति श्रीस्कन्दपुराणे सनत्कुमारसंहितायां लक्ष्मीसहस्रनामस्तोत्रं सम्पूर्णम् ॥
