id: brahmanaribhihkritamkrishnanarayanastotram
category: stotram
name:
  english: brahmanaribhihkritamkrishnanarayanastotram
  devanagari: ब्रह्मनारीभिःकृतंकृष्णनारायणस्तोत्रम्
content:
  english: namah sarvavataranamavatarin paratmane | muktanam mandalavasaya'pi manushavasine || 77|| kripalave
    satyalokalabhadaya ca te namah | namastapasadevaya tapolokagataya te || 78|| namo mokshapradatre te
    namah pitripramocine | namo'nantasvarupayanantashaktyabhishaline || 79|| namo brahmapriyakantasvarupayantaratmane
    | haripriyabhisevyaya balakrishnaya te namah || 80|| tapolokastapahprapyastapahkshaye kshayam vrajet
    | tapasashca gataishvarya nashyanti bhavasagare || 81|| harim vina na vai muktih so'yam bhavanupagatah
    | uddharaya tapolokat samsarasagaraditah || 82|| purvesham kalpakalanam punyabhajo vayam tviha | kripaya
    nivasamo hi yadyapi shribhujah sada || 83|| tathapi tava sannidhyam padayoh pujanam tu nah | kadapi
    prapyate naiva navapyeta kripam vina || 84|| svargasatyantalokanam nivasinam tu sarvatha | mahapunyani
    santyeva kevalam bandhanani hi || 85|| naiva punyaphalam bhogamantaranyat pravartate | iyam tu karuna
    te'tra hare yaddarshanam tava || 86|| varam tu bhutale janma yatra krishno hyavapyate | na dinam tu
    vina krishnam sakshat prithvigatam kvacit || 87|| anyalokeshvekavaram samayasyati gauravat | mahakaryanivahartham
    sarvatha drishyase na hi || 88|| varam bhutapishacadijanma devarshipitritah | yatra kvapi milenmuktiryogatah
    shrihareh satam || 89|| tadadya bhagavan prapto dayashevadhiracyutah | kuru nah sarvatha mokshamarthayamo
    varam tviyam || 90|| iti shrilakshminarayaniyasamhitayah tishyasantanatmakasya caturthakhande 90
  devanagari: नमः सर्वावताराणामवतारिन् परात्मने । मुक्तानां मण्डलावासायाऽपि मानुषवासिने ॥ ७७॥ कृपालवे
    सत्यलोकलाभदाय च ते नमः । नमस्तापसदेवाय तपोलोकागताय ते ॥ ७८॥ नमो मोक्षप्रदात्रे ते नमः पितृप्रमोचिने
    । नमोऽनन्तस्वरूपायानन्तशक्त्यभिशालिने ॥ ७९॥ नमो ब्रह्मप्रियाकान्तस्वरूपायान्तरात्मने । हरिप्रियाभिसेव्याय
    बालकृष्णाय ते नमः ॥ ८०॥ तपोलोकस्तपःप्राप्यस्तपःक्षये क्षयं व्रजेत् । तापसाश्च गतैश्वर्या नश्यन्ति
    भवसागरे ॥ ८१॥ हरिं विना न वै मुक्तिः सोऽयं भवानुपागतः । उद्धारय तपोलोकात् संसारसागरादितः ॥ ८२॥ पूर्वेषां
    कल्पकालानां पुण्यभाजो वयं त्विह । कृपया निवसामो हि यद्यपि श्रीभुजः सदा ॥ ८३॥ तथापि तव सान्निध्यं पादयोः
    पूजनं तु नः । कदापि प्राप्यते नैव नावाप्येत कृपां विना ॥ ८४॥ स्वर्गसत्यान्तलोकानां निवासिनां तु सर्वथा
    । महापुण्यानि सन्त्येव केवलं बन्धनानि हि ॥ ८५॥ नैव पुण्यफलं भोगमन्तरान्यत् प्रवर्तते । इयं तु करुणा
    तेऽत्र हरे यद्दर्शनं तव ॥ ८६॥ वरं तु भूतले जन्म यत्र कृष्णो ह्यवाप्यते । न दिनं तु विना कृष्णं साक्षात्
    पृथ्वीगतं क्वचित् ॥ ८७॥ अन्यलोकेष्वेकवारं समायास्यति गौरवात् । महाकार्यनिवहार्थं सर्वथा दृश्यसे न
    हि ॥ ८८॥ वरं भूतपिशाचादिजन्म देवर्षिपितृतः । यत्र क्वापि मिलेन्मुक्तिर्योगतः श्रीहरेः सताम् ॥ ८९॥
    तदद्य भगवान् प्राप्तो दयाशेवधिरच्युतः । कुरु नः सर्वथा मोक्षमर्थयामो वरं त्वियम् ॥ ९०॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः
    तिष्यसन्तानात्मकस्य चतुर्थखण्डे ९०
