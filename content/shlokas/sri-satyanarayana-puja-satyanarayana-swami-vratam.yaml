id: sri-satyanarayana-puja-satyanarayana-swami-vratam
category: stotram
name:
  english: Sri Satyanarayana Puja (Satyanarayana Swami Vratam)
content:
  english: purvanga puja shrimahaganadhipataye namah | shri gurubhyo namah | harih om | shucih apavitrah
    pavitro va sarvavastha tpundarikaksham sa bahyabhyantara shshucih || pundarikaksha pundarikaksha pundarikakshaya
    namah || prarthana shuklambaradharam ncaturbhujam | prasannavadana thsarvavighnopashantaye || agajanana
    padmarka ngajananamaharnisham | anekada mbhaktanam ekadantamupasmahe || devim va~camajanayanta devastam
    vi~shvarupah pashavo vadanti | sa no mandreshamurja nduhana dhenurvagasmanupa sushtutaitu || ya shshivo
    nama rupabhyam ya~ devi sarvamangala | tayo ssamsmaranannityam sarvada jaya mangalam || tadeva lagnam
    sudina ntadeva lakshmipate te 'nghriyugam smarami || gururbrahma gururvishnuh gururdevo maheshvarah
    | guru tparabrahma tasmai shrigurave namah || labhastesha mparabhavah | eshamindivarashyamo hridayastho
    janardanah || sarvamangala mangalye shive sarvarthasadhike | sharanye tryambake gauri narayani namo
    'stu te || shrilakshminarayanabhya nnamah | umamaheshvarabhya nnamah | vanihiranyagarbhabhya nnamah
    | shacipurandarabhya nnamah | arundhativasishthabhya nnamah | shrisitaramabhya nnamah | matapitribhyo
    namah | sarvebhyo mahajanebhyo namah | diparadhanam dipastva mprabhuravyayah | saubhagya ndehi putramshca
    sarvankamamshca dehi me || bho dipa devi rupastva nkarmasakshi hyavighnakrit | yavatpuja nkarishyami
    tavattvam susthiro bhava || diparadhana muhurta 'stu || pujarthe haridra kunkuma vilepana nnarayanaya
    svaha | o ntrivikramaya namah | om va~manaya namah | om shridharaya namah | om hrishikeshaya namah
    | o ndamodaraya namah | om sankar mpradyumnaya namah | om aniruddhaya namah | o mpurushottamaya namah
    | om adhokshajaya namah | o nnarasimhaya namah | om acyutaya namah | o njanardanaya namah | om upendraya
    namah | om haraye namah | om shrikrishnaya namah | bhutoccatanam uttishthantu bhutapishacah ya ete
    bhumi bharakah | eteshamavirodhena brahmakarma samarabhe || apasarpantu te bhuta ye bhuta bhumisamsthitah
    | ye bhuta vighnakartaraste gacchantu shiva 'jnaya || pranayamam o mbhargo devasya dhimahi | dhiyo
    yo nah pracodaya t || omapo jyoti raso mbrahma bhurbhuvassuvarom || sankalpam mama upatta samasta
    duritakshaya dvara shriparameshvaramuddishya shriparameshvara prityartham shubhabhyam shubhe shobhane
    muhurte shrimahavishnorajnaya pravartamanasya adya brahmanah dvitiyapararthe shvetavarahakalpe vaivasvatamanvantare
    kaliyuge prathamapade jambudvipe bharatavar she bharatakhande meroh dakshina digbhage shrishailasya
    nadyoh madhyapradeshe lakshminivasagrihe samasta devata brahmana acarya hari hara guru carana sannidhau
    asmin vartamane vyavaharika candramanena shri nguna visheshana vishishtayam shubhatithau shriman mama
    dharmapatni shrimatah asmakam sahakutumbasya kshema sthairya dhairya virya vijaya abhaya ayuh arogya
    aishvara abhivriddhyartha ndharma artha kama moksha caturvidha purushartha phala siddhyartha ndhana
    kanaka vastu vahana samriddhyartham sarvabhishta siddhyartham shri prityartham sambhavadbhih dravyai
    ssambhavadbhih upacaraishca sambhavata niyamena sambhavita prakarena yavacchakti dhyana avahanadi
    shodashopacara puja nirvighna puja parisamaptyartham adau shrimahaganapati puja nkarishye | kalasharadhanam
    kalashe gandha pushpakshatairabhyarcya | kalashe udaka mpurayitva | kalashasyopari hasta nnidhaya
    | kalashasya mukhe vishnuh kanthe rudra ssamashritah | mule tvasya sthito brahma madhye matrigana
    ssmrita || kukshau tu sagara ssarve saptadvipa vasundhara | rigvedo 'tha yajurvedo samavedo hyatharvanah
    || angaishca sahita ssarve kalashambu samashritah | om akalashe shu dhavati pavitre parishicyate |
    ukthairyajneshu vardhate | apo va idag vi~shva bhutanyapah prana va apah pashava apo 'mritamapah samradapo
    viradapah svaradapashchandag shyapah satyamapah sarva devata apo bhurbhuva ssuvarapa om || gange ca
    yamune caiva godavari sarasvati | narmade sindhu kaveri jale nkuru || kaveri tungabhadra ca krishnaveni
    ca gautami | bhagirathiti vikhyatah pancagangah prakirtitah || ayantu shri mmama duritakshayakarakah
    | om om o nkalashodakena puja dravyani samprokshya nca samprokshya || shankhapuja kalashodakena shankha
    mpurayitva || shankhe gandhakunkumapushpatulasipatrairalankritya || shankha mmadhye varuna devatam
    | prishthe prajapatim vi~ndyadagre ganga sarasvatim || trailokyeyani tirthani vasudevasyadadraya |
    shankhe tishthantu viprendra tasma mpura sagarotpanno vishnuna vidhritah kare | pujita ssarvadevaishca
    pancajanya namo 'stu te || garbhadevarinarinam vi~shiryante sahasradha | navanadenapatale pancajanya
    namo 'stu te || om shankhaya namah | o mpancajanyaya namah | om shankhadevatabhyo namah | sakalapujarthe
    akshatan samarpayami || ghantanadam o ssvaha | ghantadevatabhyo namah | sakalopacara pujarthe akshatan
    samarpayami | agamartha ntu rakshasam | ghantarava nkaromyadau devatahvana lanchanam || iti ghantanada
    nkritva || atha haridraganapati puja asmin haridrabimbe shrimahaganapatim avahayami pujayami || pranapratishtha
    om asunite punarasmasu cakshuh punah pranamiha no m | jyokpashyema suryamuccara ssvasti || amritam
    vai~ prana amritamapah prananeva yathasthanamupahvayate || shri mahaganapataye namah | sthiro bhava
    varado bhava | sumukho bhava suprasanno bhava | sthirasana nkuru | dhyanam haridrabha ncaturbahum
    haridravadana mprabhum | pashankushadhara 'bhayapradataram vande vighnavinashanam | om haridra ganapataye
    namah | agajanana padmarka ngajananamaharnisham anekada mbhaktanam ekadantamupasmahe || o ntva ganapatigm
    havamahe kavi nkavinamupamashravastamam | jyeshtharaja mbrahmanaspata a nah shrinvannutibhissida sadanam
    || o mmahaganapataye namah | dhyayami | dhyanam samarpayami | mmahaganapataye namah | avahayami |
    avahanam samarpayami | mmahaganapataye namah | navaratnakhacita divya hema simhasanam samarpayami
    | mmahaganapataye namah | padayoh padyam samarpayami | mmahaganapataye namah | hastayoh arghyam samarpayami
    | mmahaganapataye namah | mukhe acamaniyam samarpayami | || snanam apo hishtha mayobhuvasta na urje
    dadhatana | mahe ranaya cakshase || yo vah shivatamo rasastasya bhajayateha nah | ushatiriva matarah
    || tasma ara ngamama vo yasya kshayaya jinvatha | apo janayatha ca nah || o mmahaganapataye namah
    | shuddhodaka snanam samarpayami | || snananantaram acamaniyam samarpayami | vastram abhi vastra suvasananyar
    ssudughah puyamanah | abhi candra bhartave no hiranyabhyashvanrathino deva soma || o mmahaganapataye
    namah | vastram samarpayami | mpavitram prajapateryatsahaja mprati munca shubhram yajnopavita mbalamastu
    tejah || o mmahaganapataye namah | yajnopavitartham akshatan samarpayami | | gandham gandhadvara m
    | ishvarigm sarvabhutana ntamihopahvaye shriyam || o mmahaganapataye namah | divya shri gandham samarpayami
    | mmahaganapataye namah | abharanam samarpayami | || pushpaih pujayami om sumukhaya namah | om ekadantaya
    namah | o nganadhyakshaya namah | o mphalacandraya namah | o va~kratundaya namah | om shurpakarnaya
    namah | om herambaya namah | om skandapurvajaya namah | om sarvasiddhipradaya namah | o mmahaganapataye
    namah | nanavidha parimala patra pushpani samarpayami | || dhupam vanaspatyudbhavirdivyaih nana gandhai
    mpratigrihyatam || o mmahaganapataye namah | dhupam aghrapayami | mpriyam | grihana mangala ntrailokya
    timirapaha || bhaktya dipa mprayacchami devaya paramatmane | trahima nnarakadghorat divya jyotirnamo
    mmahaganapataye namah | pratyaksha dipam samarpayami | || dhupa dipanantaram acamaniyam samarpayami
    | naivedyam o mbhurbhuvassuvah | tatsaviturvare mbhargo devasya dhimahi | dhiyo yo nah pracodaya ntva
    ritena parishincami | ntva satyena parishincami amritamastu | amritopastaranamasi | shri mahaganapataye
    namah | om apanaya svaha | om udanaya svaha | om samanaya svaha | madhye madhye paniyam samarpayami
    | amritapidhanamasi | uttaraposhanam samarpayami | hastau prakshalayami | padau prakshalayami | shuddhacamaniyam
    samarpayami | o mmahaganapataye namah | naivedyam samarpayami | || tambulam pugiphalashca karpuraih
    nagavallidalairyutam | muktacurnasam mpratigrihyatam || o mmahaganapataye namah | tambulam samarpayami
    | || nirajanam vedahameta | adityavarnam tamasastu pare | sarvani rupani vicitya dhirah | namani kritva
    mmahaganapataye namah | nirajanam samarpayami | || mantrapushpam sumukhashcaikadantashca kapilo gajakarnakah
    lambodarashca vikato vighnarajo ganadhipah || dhumaketurganadhyakshah phalacandro gajananah vakratundashshurpakarno
    herambasskandapurvajah || shodashaitani namani yah pathecchrinuyadapi vidyarambhe vivahe ca praveshe
    nirgame tatha sangrame sarvakaryeshu vighnastasya na jayate || o mmahaganapataye namah | suvarna mantrapushpam
    samarpayami | pradakshinam yanikani ca papani janmantarakritani ca | tani tani pranashyanti pradakshina
    pade pade || papo mpapatma papasambhavah | trahi ma nkripaya deva sharanagatavatsala || anyadha sharana
    mmama | tasmatkarunya bhavena raksha raksha ganadhipa || o mmahaganapataye namah | pradakshina namaskaran
    samarpayami | o mmahaganapataye namah | chatra camaradi samasta rajopacaran samarpayami || kshamaprarthana
    yasya smritya ca namoktya tapah puja kriyadishu | nyunam sampurnatam ya~ti sadyo vande gajananam ||
    mantrahina va~kratunda mahakaya surya koti samaprabha | nirvighna nkuru me deva sarva karyeshu sarvada
    || anaya dhyana avahanadi shodashopacara pujaya bhagavan sarvatmaka shshri mahaganapati suprito suprasanno
    varado bhavantu || uttare shubhakarmanyavighnamastu iti bhavanto bruvantu | uttare shubhakarmani avighnamastu
    || tirtham akalamrityuharanam sarvavyadhinivaranam | samastapapakshayakaram shri mahaganapati padodaka
    mpavanam shubham || shri mahaganapati prasadam shirasa grihnami || udvasanam om ya~jnena yajnamayajanta
    devah | tani dharmani prathamanyasann | te ha naka mmahimanassacante | yatra purve sadhyassanti devah
    || om shri mahaganapati namah yathasthanam udvasayami || shobhanarthe kshemaya punaragamanaya ca |
    om shanti shshantih | shri satyanarayanasvami parivara puja puna ssankalpam purvokta eva nguna visheshana
    vishishtayam shubha tithau mama ishtakamyartha siddhyartha mmama rajadvare rajamukhe sarvada digvijaya
    praptyartha mmama janmarashi vashat namarashi vashat janmanakshatra vashat namanakshatra vasha thshadbala
    veda vashat nitya gocara veda vashat mama ye ye grahah arishta sthaneshu sthita sstaih kriyamana karmamana
    vartamana vartishyamana sucita bhavita agamita dushtarishta parihara dvara ayushya abhivriddhyartha
    mmama rama parivara sameta satyanarayana svami anugraha siddhyartham rama parivara sameta satyanarayana
    svami prasadena mama grihe sthiralakshmi praptyartha mmama ramaparivara sameta shri satyanarayana
    svami vrata puja nca karishye | tadanga ganapatyadi pancalokapalakapujam adityadi navagraha pujam
    indradi ashtadikpalakapuja nca karishye | adau vratanga devataradhana nkarishye | varuna puja ima
    mme varuna shrudhi hava madya ca mridaya | tvamavasyu racake | o mbhuh varunamavahayami sthapayami
    pujayami | brahma jajnana ssuruco vena avah | sa budhniya upama asya vishthah | satashca yonimasatashca
    vivah || o mbrahmamavahayami sthapayami pujayami | pancaloka palaka puja ntva ganapatim havamahe kavi
    nkavinamupamashravastamam | jyeshtharaja mbrahmanaspata a nah shrinvannutibhissida sadanam || sangam
    sayudham savahanam sashakti mpatniputraparivara sametam ganapatim lo~kapalakam avahayami sthapayami
    pujayami | mpadavih kavinamrishirviprana m | shyenogridhranagsvadhitirvananagm somah pavitramatyeti
    rebhan || sangam sayudham savahanam sashakti mpatniputraparivara sametam brahmanam lo~kapalakam avahayami
    sthapayami pujayami | vi~shnurvicakrame tredha nidadhe padam | samudhamasyapagm sure || sangam sayudham
    savahanam sashakti mpatniputraparivara sametam vishnum lo~kapalakam avahayami sthapayami pujayami
    | nkadrudraya pracetase midhushtamaya tavyase| vocema shantamam hride || sangam sayudham savahanam
    sashakti mpatniputraparivara sametam rudram lo~kapalakam avahayami sthapayami pujayami | ngaurirmimaya
    salilani takshatyekapadi dvipadi sa catushpadi | ashtapadi navapadi babhuvushi sahasrakshara parame
    vyomann || sangam sayudham savahanam sashakti mpatiputraparivara sametam gaurim lo~kapalakim avahayami
    sthapayami pujayami | ganeshadi pancalokapalaka devatabhyo namah | dhyayami shuddhacamaniyam samarpayami
    yajnopavitam samarpayami mantrapushpam samarpayami | ganeshadi pancalokapalaka devata prasada siddhirastu
    || navagraha puja surya graham om asatyena rajasa vartamano niveshayannamrita mmartyanca | hiranyayena
    savita rathena ''devo yatibhuvana vipashyan || o ssuryagrahe agaccha | suryagraham raktavarnam raktagandham
    raktapushpam raktamalyambaradharam raktacchatra dhvajapatakadi shobhita mpradakshini kurvana ndvibhujam
    saptashvam saptarajju va~tsare maghamase shuklapakshe saptamya mbhanuvasare ashvini nakshatre jatam
    simharashyadhipati mpatniputraparivara sameta ngrahamandale pravishthamasminnadhikarane vartulakaramandale
    sthapita svarnapratimarupena suryagrahamavahayami sthapayami pujayami | om agni vi~shvavedasam | asya
    yajnasya sukratum suryagrahasya adhidevatah agnim sangam sayudham savahanam sashakti mpatniputraparivarasametam
    suryagrahasya dakshinatah agnimavahayami sthapayami pujayami | o nkadrudraya pracetase midhushtamaya
    tavyase| vocema shantamam hride || suryagrahasya pratyadhidevatah rudram sangam sayudham savahanam
    sashakti mpatniputraparivarasametam suryagrahasya uttaratah rudramavahayami sthapayami pujayami |
    candra graham om apyayasva sametu te vishvatassoma vrishniyam | bhava vajasya sangathe || o shcandragrahe
    agaccha | candragraham shvetavarnam shvetagandham shvetapushpam shvetamalyambaradharam shvetacchatra
    dhvajapatakadishobhita mpradakshini kurvana ya~munadeshadhipatim atreyasagotram saumya sam va~tsare
    kartikamase shuklapakshe paurnamasyam induvasare krittika nakshatre jata mpatniputrapari varasameta
    ngrahamandale pravishthamasminnadhi karane suryagrahasya agneyadigbhage samacaturashramandale sthapita
    rajatapratima rupena candragrahamavahayami sthapayami pujayami | om apsume somo abravidantarvishvani
    bheshaja | agninca vishvashambhuvamapashca vishvabheshajih || candragrahasya adhidevatah apam sangam
    sayudham savahanam sashakti mpatniputraparivarasameta ncandragrahasya dakshinatah apah avahayami sthapayami
    pujayami | o ngauri mimaya salilani takshatyekapadi dvipadi sa catushpadi | ashtapadi navapadi babhuvushi
    sahasra kshara parame vyomann || candragrahasya pratyadhidevatah gaurim sangam sayudham savahanam
    sashakti mpatiputraparivarasameta ncandragrahasya uttaratah gaurim avahayami sthapayami pujayami ||
    angaraka graham om agnirmurdha divah kakutpatih prithivya ayam | apagmretagmsi jinvati || o mbhurbhuvassuvah
    angarakagrahe agaccha | angaraka graham raktavarnam raktagandham raktapushpam raktamalyambaradharam
    raktacchatradhvajapatakadishobhita mpradakshini kurvana ngadashulashaktidharam avanti deshadhipati
    mbharadvajasagotram rakshasanama sam va~tsare ashadhamase shuklapakshe dashamya mbhaumavasare anuradha
    nakshatre jata mmesha vrishcika rashyadhipati mpatniputraparivarasameta ngrahamandale pravishtamasminnadhikarane
    suryagrahasya dakshinadigbhage trikonakaramandale sthapita tamrapratimarupena angarakagraham avahayami
    sthapayami pujayami || om syona prithivi bhava 'nrikshara niveshani | yacchanashsharma saprathah ||
    angarakagrahasya adhidevatah prithivim sangam sayudham savahanam sashakti mputraparivarasametam angarakagrahasya
    dakshinatah prithivim avahayami sthapayami pujayami | o nkshetrasya patina vayagmhite neva jayamasi
    | gamashva mposh ayitnva sa no mridatidrishe || angarakagrahasya pratyadhidevatah kshetrapalakam sangam
    sayudham savahanam sashakti mpatniputraparivarasametam angarakagrahasya uttaratah kshetrapalakamavahayami
    sthapayami pujayami || budha graham om udbudhyasvagne pratijagrihyenamishtapurte sagmsrijethamayanca
    | punah krinvagg yu~vanamanvatagmsittvayi tantumetam || o mbhurbhuvassuvah budhagrahe agaccha | budhagraha
    mpitacchatra dhvajapatakadi shobhita mpradakshini kurvanam simhavahanam udanmukha nkhadgacarmambaradharam
    atreyasagotram angirasanamasam shamase shuklapakshe saptamyam saumyavasare purvabhadra nakshatre jata
    mmithuna kanya rashyadhipati mpatniputra parivarasameta ngrahamandale pravishtamasminnadhikarane suryagrahasya
    ishanyadigbhage banakaramandale sthapita kamsyapratimarupena budhagraham avahayami sthapayami pujayami
    | om idam vi~shnurvicakrame tredha nidadhe padam | samudhamasyapagm sure || vishno raratamasi vishnoh
    prishthamasi vishnoshshnaptre stho vishnossyurasi vishno rdhruvamasi vaishnavamasi vishnave tva ||
    budhagrahasya adhidevatah vishnum sangam sayudham savahanam sashakti mpatniputraparivarasameta mbudhagrahasya
    dakshinatah vishnumavahayami sthapayami pujayami | om sahasrashir sha purushah | sahasraksha ssahasrapat
    | sa bhumim vi~shvato vritva | atyatishthaddashangulam | budhagrahasya pratyadhidevatah narayanam
    sangam sayudham savahanam sashakti mpatniputraparivarasameta mbudhagrahasya uttaratah narayanamavahayami
    sthapayami pujayami | mbrihaspate atiyadaryo ar ddyumadvibhati kratumajjaneshu | yaddidayaccavasartaprajata
    tadasmasu dravinandhehi citram || o mbhurbhuvassuvah brihaspatigrahe agaccha | brihaspatigraha nkanakacchatra
    dhvajapatakadishobhita mpradakshinikurvana ndandakshamaladharinam sindhu dvipadeshadhipatim angirasagotram
    angirasasam va~tsare vaishakhemase shuklapakshe ekadashya nguruvasare uttara nakshatre jata ndhanurminarashyadhipati
    mpatniputraparivarasametam grahamandale pravishtamasminnadhikarane suryagrahasya uttaradigbhage dirghacaturasrakaramandale
    sthapita trapupratimarupena brihaspatigraham avahayami sthapayami pujayami | o mpurastadvisimatassuruco
    vena avah | sabudhniya upama asya vishthassatashca yonimasatashca vivah || brihaspatigrahasya adhidevata
    mbrahmanam sangam sayudham savahanam sashakti mpatniputraparivarasameta mbrihaspatigrahasya dakshinatah
    brahmanamavahayami sthapayami pujayami | om indramarutva iha pahi somam ya~tha sharyate apibassutasya
    | tava praniti tava shurasharmannavivasanti kavayassuyajnah || brihaspatigrahasya pratyadhidevatah
    indram sangam sayudham savahanam sashakti mpatniputraparivarasameta mbrihaspatigrahasya uttaratah
    indramavahayami sthapayami pujayami | shukra graham om shukra nte anyat | vishurupe ahani dyaurivasi
    | vishva hi maya avasi svadhavah | bhadra te pushanniha ratirastviti | shshukragrahe agaccha | shukragraham
    shvetavarnam shvetagandham shvetapushpam shvetamalyambaradharam shvetacchatra dhvajapatakadishobhita
    mpradakshini kurvana ndandakshamala jatavalkala dharini va~tsare shravanamase shuklapakshe ashtamya
    mbhriguvasare svati nakshatre jata ntula vrishabharashyadhipati mpatniputraparivara sameta ngrahamandale
    pravishtamasminnadhikarane suryagrahasya pragbhage pancakonakara mandale sthapita sisa pratimarupena
    shukragraham avahayami sthapayami pujayami | om indranimasu narishu supat mimahamashravam | na hyasya
    aparancana jarasa marate patih || shukragrahasya adhidevatam indranim sangam sayudham savahanam sashakti
    mpatiputraparivarasametam shukragrahasya dakshinatah indranim avahayami sthapayami pujayami | om indra
    marutva iha pahi somam ya~tha sharyate apiba ssutasya | tava praniti tava shura sharmanna vivasanti
    kavayah suyajnah || shukragrahasya pratyadhidevatam indramarutvantam sangam sayudham savahanam sashakti
    mpatniputraparivarasametam shukragrahasya uttaratah indramarutvantamavahayami sthapayami pujayami
    | shani graham om shamagniragnibhih karaccha nnastapatu suryah | sham va~to vatvarapa apa stridhah
