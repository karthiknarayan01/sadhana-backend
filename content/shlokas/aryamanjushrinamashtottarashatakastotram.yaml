id: aryamanjushrinamashtottarashatakastotram
category: stotram
name:
  english: aryamanjushrinamashtottarashatakastotram
  devanagari: आर्यमञ्जुश्रीनामाष्टोत्तरशतकस्तोत्रम्
content:
  english: aryamanjushrinamashtottarashatakastotram pranipatya munim murdhna suprasannena cetasa | vakshyamyadya
    ca namani sambuddhairanuvarnitam || 1|| surupo rupadhari ca sarvarupo hyanuttarah | sarvalakshanasampurno
    manjushriruttamah shriya || 2|| acintyashcintyavigato'cintyo'dbhutavikramah | acintyah sarvadharmanamacintyo
    manasastatha || 3|| shunyatabhavitatmakah shunyadharmasamanvitah | shunyastvamadhimuktishca shunyatribhavadeshakah
    || 4|| sarvajnah sarvadarshi ca sarvabhumipatirvibhuh | manjushrivashavarti ca padmakshah padmasambhavah
    || 5|| padmakinjalkavarnashca padmaparyankavasanah | nilotpaladharah putah pavitrah shantamanasah
    || 6|| pratyekabuddho buddhastvamadibuddho nirucyase | riddhiman vashitapraptashcatuhsatyopadeshakah
    || 7|| lokapalah sahasraksha ishvarastvam prajapatih | shivastvam sarvabhutanam tvam vibhurgunasagarah
    || 8|| rishistvam punyah shreshthashca jyeshtho jatismarastatha | vinayako vineta ca jinaputro jinatmajah
    || 9|| bhanuh sahasrarashmimastvam somastvam ca brihaspatih | dhanado varunashcaiva tvam vishnustvam
    maheshvarah || 10|| ananto nagarajastvam skandah senapatistatha | vemacitrasurendrastvam bhaumah shukro
    budhastatha || 11|| sarvadevamayo virah sarvadevairnamaskritah | lokadharmamalatitastvam loke cagrapudgalah
    || 12|| lokajno lokavijnato jnaninam pravaro varah | varado layanam tranamadhrishyo marakarminam ||
    13|| gambhirashcanavadyashca kalyanamitrasampadah | vaidyastvam shalyaharta na naradamyah susarathih
    || 14|| matiman gatimamshcaiva buddhimamshca vicakshanah | punyavan kalpavrikshashca bodhyangapushpamanditah
    || 15|| vimuktiphalasampanna ashrayah sarvadehinam | manoharo manojnashca anagho brahmacarinam ||
    16|| ketustvam grahashreshthashca rishibhirmunipungavah | yuvarajnabhishiktasttvam dashabhumishvarah
    prabhuh || 17|| sarthavaho ganashreshtho nirvanottamadeshakah | khasamo madhyakalpastvam tvam tejo
    vayureva ca || 18|| cintamanistvam sattvanam sarvashaparipurakah | namo'stu te mahavidya sarvabhutanamaskrita
    || 19|| iti shriaryamanjushrinamashtottarashatakastotram sampurnam ||
  devanagari: आर्यमञ्जुश्रीनामाष्टोत्तरशतकस्तोत्रम् प्रणिपत्य मुनिं मूर्ध्ना सुप्रसन्नेन चेतसा । वक्ष्याम्यद्य
    च नामानि सम्बुद्धैरनुवर्णितम् ॥ १॥ सुरूपो रूपधारी च सर्वरूपो ह्यनुत्तरः । सर्वलक्षणसम्पूर्णो मञ्जुश्रीरुत्तमः
    श्रिया ॥ २॥ अचिन्त्यश्चिन्त्यविगतोऽचिन्त्योऽद्भुतविक्रमः । अचिन्त्यः सर्वधर्माणामचिन्त्यो मनसस्तथा
    ॥ ३॥ शून्यताभावितात्माकः शून्यधर्मसमन्वितः । शून्यस्त्वमधिमुक्तिश्च शून्यत्रिभवदेशकः ॥ ४॥ सर्वज्ञः
    सर्वदर्शी च सर्वभूमिपतिर्विभुः । मञ्जुश्रीवशवर्ती च पद्माक्षः पद्मसम्भवः ॥ ५॥ पद्मकिञ्जल्कवर्णश्च
    पद्मपर्यङ्कवासनः । नीलोत्पलधरः पूतः पवित्रः शान्तमानसः ॥ ६॥ प्रत्येकबुद्धो बुद्धस्त्वमादिबुद्धो निरुच्यसे
    । ऋद्धिमान् वशिताप्राप्तश्चतुःसत्योपदेशकः ॥ ७॥ लोकपालः सहस्राक्ष ईश्वरस्त्वं प्रजापतिः । शिवस्त्वं
    सर्वभूतानां त्वं विभुर्गुणसागरः ॥ ८॥ ऋषिस्त्वं पुण्यः श्रेष्ठश्च ज्येष्ठो जातिस्मरस्तथा । विनायको
    विनेता च जिनपुत्रो जिनात्मजः ॥ ९॥ भानुः सहस्ररश्मिमस्त्वं सोमस्त्वं च बृहस्पतिः । धनदो वरुणश्चैव त्वं
    विष्णुस्त्वं महेश्वरः ॥ १०॥ अनन्तो नागराजस्त्वं स्कन्दः सेनापतिस्तथा । वेमचित्रासुरेन्द्रस्त्वं भौमः
    शुक्रो बुधस्तथा ॥ ११॥ सर्वदेवमयो वीरः सर्वदेवैर्नमस्कृतः । लोकधर्ममलातीतस्त्वं लोके चाग्रपुद्गलः ॥
    १२॥ लोकज्ञो लोकविज्ञातो ज्ञानिनां प्रवरो वरः । वरदो लयनं त्राणमधृष्यो मारकर्मिणाम् ॥ १३॥ गम्भीरश्चानवद्यश्च
    कल्याणमित्रसम्पदः । वैद्यस्त्वं शल्यहर्ता न नरदम्यः सुसारथिः ॥ १४॥ मतिमान् गतिमांश्चैव बुद्धिमांश्च
    विचक्षणः । पुण्यवान् कल्पवृक्षश्च बोध्यङ्गपुष्पमण्डितः ॥ १५॥ विमुक्तिफलसम्पन्न आश्रयः सर्वदेहिनाम्
    । मनोहरो मनोज्ञश्च अनघो ब्रह्मचारिणाम् ॥ १६॥ केतुस्त्वं ग्रहश्रेष्ठश्च ऋषिभिर्मुनिपुङ्गवः । युवराज्ञाभिषिक्तस्त्त्वं
    दशभूमीश्वरः प्रभुः ॥ १७॥ सार्थवाहो गणश्रेष्ठो निर्वाणोत्तमदेशकः । खसमो मध्यकल्पस्त्वं त्वं तेजो वायुरेव
    च ॥ १८॥ चिन्तामणिस्त्वं सत्त्वानां सर्वाशापरिपूरकः । नमोऽस्तु ते महाविद्य सर्वभूतनमस्कृत ॥ १९॥ इति
    श्रीआर्यमञ्जुश्रीनामाष्टोत्तरशतकस्तोत्रं सम्पूर्णम् ॥
