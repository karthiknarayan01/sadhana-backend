id: naradabhaktisutrani
category: sutra
name:
  english: naradabhaktisutrani
  devanagari: नारदभक्तिसूत्राणि
content:
  english: 17 ya idam naradaproktam shivanushasanam vishvasiti shraddhate sa bhaktiman bhavati sah preshtam
    labhate sah preshtam labhate | 84
  devanagari: १७ य इदं नारदप्रोक्तं शिवानुशासनं विश्वसिति श्रद्धते स भक्तिमान् भवति सः प्रेष्टं लभते सः
    प्रेष्टं लभते । ८४
meaning: {}
