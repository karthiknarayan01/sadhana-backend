id: govinda-damodara-stotram
category: stotram
name:
  english: Govinda Damodara Stotram
content:
  english: agre kurunamatha pandavanam duhshasanenahritavastrakesha | krishna tadakroshadananyanatha govinda
    damodara madhaveti || || shrikrishna vishno madhukaitabhare bhaktanukampin bhagavan murare | trayasva
    mam keshava lokanatha govinda damodara madhaveti || || vikretukama kila gopakanya muraripadarpitacittavrittih
    | dadhyadikam mohavashadavocad govinda damodara madhaveti || || ulukhale sambhritatandulamshca sanghattayantyo
    musalaih pramugdhah | gayanti gopyo janitanuraga govinda damodara madhaveti || || kacitkarambhojapute
    nishannam kridashukam kimshukaraktatundam | adhyapayamasa saroruhakshi govinda damodara madhaveti
    || || grihe grihe gopavadhusamuhah pratikshanam pinjarasarikanam | skhaladgiram vacayitum pravritto
    govinda damodara madhaveti || || paryyankikabhajamalam kumaram prasvapayantyo'khilagopakanyah | jaguh
    prabandham svaratalabandham govinda damodara madhaveti || || ramanujam vikshanakelilolam gopi grihitva
    navanitagolam | abalakam balakamajuhava govinda damodara madhaveti || || vicitravarnabharanabhirame
    'bhidhehi vaktrambujarajahamsi | sada madiye rasane'grarange govinda damodara madhaveti || || ankadhirudham
    shishugopagudham stanam dhayantam kamalaikakantam | sambodhayamasa muda yashoda govinda damodara madhaveti
    || || kridantamantarvrajamatmajam svam samam vayasyaih pashupalabalaih | premna yashoda prajuhava
    krishnam govinda damodara madhaveti || || yashodaya gadhamulukhalena gokanthapashena nibadhyamanah
    | ruroda mandam navanitabhoji govinda damodara madhaveti || || nijangane kankanakelilolam gopi grihitva
    navanitagolam | amardayatpanitalena netre govinda damodara madhaveti || || grihe grihe gopavadhukadambah
    sarve militva samavayayoge | punyani namani pathanti nityam govinda damodara madhaveti || || mandaramule
    vadanabhiramam bimbadhare puritavenunadam | gogopagopijanamadhyasamstham govinda damodara madhaveti
    || ratrabhage smritva yashodasutabalakelim | gayanti proccairdadhi manthayantyo govinda damodara madhaveti
    || || jagdho'tha datto navanitapindo grihe yashoda vicikitsayanti | uvaca satyam vada he murare govinda
    damodara madhaveti || || abhyarcya geham yuvatih pravriddha premapravaha dadhi nirmamantha | gayanti
    gopyo'tha sakhisameta govinda damodara madhaveti || || kvacit prabhate dadhipurnapatre nikshipya mantham
    yuvati mukundam | alokya ganam vividham karoti govinda damodara madhaveti || || kridaparam bhojanamajjanartham
    hitaishini stri tanujam yashoda | ajuhavat premapariplutakshi govinda damodara madhaveti || || sukham
    shayanam nilaye ca vishnum devarshimukhya munayah prapannah | tenacyute tanmayatam vrajanti govinda
    damodara madhaveti || || vihaya nidramarunodaye ca vidhaya krityani ca vipramukhyah | vedavasane prapathanti
    nityam govinda damodara madhaveti || || vrindavane gopaganashca gopyo vilokya govindaviyogakhinnam
    | radham jaguh sashruvilocanabhyam govinda damodara madhaveti || || prabhatasancaragata nu gavas tadrakshanartham
    tanayam yashoda | prabodhayat panitalena mandam govinda damodara madhaveti || || pravalashobha iva
    dirghakesha vatambuparnashanaputadehah | mule tarunam munayah pathanti govinda damodara madhaveti
    || || evam bruvana virahatura bhrisham vrajastriyah krishnavishaktamanasah | visrijya lajjam ruruduh
    sma susvaram govinda damodara madhaveti || || gopi kadacinmanipanjarastham shukam vaco vacayitum pravritta
    | anandakanda vrajacandra krishna govinda damodara madhaveti || || govatsabalaih shishukakapaksham
    badhnantamambhojadalayataksham | uvaca mata cibukam grihitva govinda damodara madhaveti || || prabhatakale
    varavallavaugha gorakshanartham dhritavetradandah | akarayamasuranantamadyam govinda damodara madhaveti
    || || jalashaye kaliyamardanaya yada kadambadapatanmurarih | gopanganashcukrushuretya gopa govinda
    damodara madhaveti || || akruramasadya yada mukundash capotsavartham mathuram pravishtah | tada sa
    paurairjayasityabhashi govinda damodara madhaveti || || kamsasya dutena yadaiva nitau vrindavanantad
    vasudevasunu | ruroda gopi bhavanasya madhye govinda damodara madhaveti || || sarovare kaliyanagabaddham
    shishum yashodatanayam nishamya | cakrurluthantyah pathi gopabala govinda damodara madhaveti || ||
    akrurayane yaduvamshanatham sangacchamanam mathuram nirikshya | ucurviyogat kila gopabala govinda
    damodara madhaveti || || cakranda gopi nalinivanante krishnena hina kusume shayana | praphullanilotpalalocanabhyam
    govinda damodara madhaveti || || matapitribhyam parivaryamana geham pravishta vilalapa gopi | agatya
    mam palaya vishvanatha govinda damodara madhaveti || || vrindavanastham harimashu buddhva gopi gata
    kapi vanam nishayam | tatrapyadrishtva'tibhayadavocad govinda damodara madhaveti || || sukham shayana
    nilaye nije'pi namani vishnoh pravadanti martyah | te nishcitam tanmayatam vrajanti govinda damodara
    madhaveti || || sa nirajakshimavalokya radham ruroda govindaviyogakhinnam | sakhi praphullotpalalocanabhyam
    govinda damodara madhaveti || || jihve rasajne madhurapriya tvam satyam hitam tvam paramam vadami
    | avarnayetha madhuraksharani govinda damodara madhaveti || || atyantikavyadhiharam jananam cikitsakam
    vedavido vadanti | samsaratapatrayanashabijam govinda damodara madhaveti || || tatajnaya gacchati
    ramacandre salakshmane'ranyacaye sasite | cakranda ramasya nija janitri govinda damodara madhaveti
    || || ekakini dandakakananantat sa niyamana dashakandharena | sita tadakrandadananyanatha govinda
    damodara madhaveti || || ramadviyukta janakatmaja sa vicintayanti hridi ramarupam | ruroda sita raghunatha
    pahi govinda damodara madhaveti || || prasida vishno raghuvamshanatha surasuranam sukhaduhkhaheto
    | ruroda sita tu samudramadhye govinda damodara madhaveti || || antarjale grahagrihitapado visrishtaviklishtasamastabandhuh
    | tada gajendro nitaram jagada govinda damodara madhaveti || || hamsadhvajah shankhayuto dadarsha
    putram katahe pratapantamenam | punyani namani harerjapantam govinda damodara madhaveti || || durvasaso
    vakyamupetya krishna sa cabravit kananavasinisham | antah pravishtam manasa juhava govinda damodara
    madhaveti || || dhyeyah sada yogibhiraprameyah cintaharashcintitaparijatah | kasturikakalpitanilavarno
    govinda damodara madhaveti || || samsarakupe patito'tyagadhe mohandhapurne vishayabhitapte | karavalambam
    mama dehi vishno govinda damodara madhaveti || || bhajasva mantram bhavabandhamuktyai jihve rasajne
    sulabham manojnam | dvaipayanadyairmunibhih prajaptam govinda damodara madhaveti || || tvameva yace
    mama dehi jihve samagate dandadhare kritante | vaktavyamevam madhuram subhaktya govinda damodara madhaveti
    || || gopala vamshidhara rupasindho lokesha narayana dinabandho | uccasvaraistvam vada sarvadaiva
    govinda damodara madhaveti || || jihve sadaivam bhaja sundarani namani krishnasya manoharani | samastabhaktartivinashanani
    govinda damodara madhaveti || || govinda govinda hare murare govinda govinda mukunda krishna | govinda
    govinda rathangapane govinda damodara madhaveti || || sukhavasane tvidameva saram duhkhavasane tvidameva
    geyam | dehavasane tvidameva japyam govinda damodara madhaveti || || durvaravakyam parigrihya krishna
    mrigiva bhita tu katham kathancit | sabham pravishta manasa juhava govinda damodara madhaveti || ||
    shrikrishna radhavara gokulesha gopala govardhana natha vishno | jihve pibasvamritametadeva govinda
    damodara madhaveti || || shrinatha vishveshvara vishvamurte shridevakinandana daityashatro | jihve
    pibasvamritametadeva govinda damodara madhaveti || || gopipate kamsaripo mukunda lakshmipate keshava
    vasudeva | jihve pibasvamritametadeva govinda damodara madhaveti || || gopijanahladakara vrajesha
    gocaranaranyakritapravesha | jihve pibasvamritametadeva govinda damodara madhaveti || || pranesha
    vishvambhara kaitabhare vaikuntha narayana cakrapane | jihve pibasvamritametadeva govinda damodara
    madhaveti || || hare murare madhusudanadya shrirama sitavara ravanare | jihve pibasvamritametadeva
    govinda damodara madhaveti || || shriyadavendradridharambujaksha gogopagopisukhadanadaksha | jihve
    pibasvamritametadeva govinda damodara madhaveti || || dharabharottaranagopavesha viharalilakritabandhushesha
    | jihve pibasvamritametadeva govinda damodara madhaveti || || bakibakaghasuradhenukare keshitrinavartavighatadaksha
    | jihve pibasvamritametadeva govinda damodara madhaveti || || shrijanakijivana ramacandra nishacarare
    bharatagrajesha | jihve pibasvamritametadeva govinda damodara madhaveti || || narayanananta hare nrisimha
    prahladabadhahara he kripalo | jihve pibasvamritametadeva govinda damodara madhaveti || || lilamanushyakritiramarupa
    pratapadasikritasarvabhupa | jihve pibasvamritametadeva govinda damodara madhaveti || || shrikrishna
    govinda hare murare he natha narayana vasudeva | jihve pibasvamritametadeva govinda damodara madhaveti
    || || vaktum samartho'pi na vakti kashcid aho jananam vyasanabhimukhyam | jihve pibasvamritametadeva
    govinda damodara madhaveti || || iti shribilvamangalacaryaviracitam shrigovindadamodarastotram sampurnam
    |
  devanagari: अग्रे कुरूणामथ पाण्डवानां दुःशासनेनाहृतवस्त्रकेशा । कृष्णा तदाक्रोशदनन्यनाथा गोविन्द दामोदर
    माधवेति ॥ ॥ श्रीकृष्ण विष्णो मधुकैटभारे भक्तानुकम्पिन् भगवन् मुरारे । त्रायस्व मां केशव लोकनाथ गोविन्द
    दामोदर माधवेति ॥ ॥ विक्रेतुकामा किल गोपकन्या मुरारिपादार्पितचित्तवृत्तिः । दध्यादिकं मोहवशादवोचद्
    गोविन्द दामोदर माधवेति ॥ ॥ उलूखले सम्भृततण्डुलांश्च सङ्घट्टयन्त्यो मुसलैः प्रमुग्धाः । गायन्ति गोप्यो
    जनितानुरागा गोविन्द दामोदर माधवेति ॥ ॥ काचित्कराम्भोजपुटे निषण्णं क्रीडाशुकं किंशुकरक्ततुण्डम् । अध्यापयामास
    सरोरुहाक्षी गोविन्द दामोदर माधवेति ॥ ॥ गृहे गृहे गोपवधूसमूहः प्रतिक्षणं पिञ्जरसारिकाणाम् । स्खलद्गिरां
    वाचयितुं प्रवृत्तो गोविन्द दामोदर माधवेति ॥ ॥ पर्य्यङ्किकाभाजमलं कुमारं प्रस्वापयन्त्योऽखिलगोपकन्याः
    । जगुः प्रबन्धं स्वरतालबन्धं गोविन्द दामोदर माधवेति ॥ ॥ रामानुजं वीक्षणकेलिलोलं गोपी गृहीत्वा नवनीतगोलम्
    । आबालकं बालकमाजुहाव गोविन्द दामोदर माधवेति ॥ ॥ विचित्रवर्णाभरणाभिरामे ऽभिधेहि वक्त्राम्बुजराजहंसि
    । सदा मदीये रसनेऽग्ररङ्गे गोविन्द दामोदर माधवेति ॥ ॥ अङ्काधिरूढं शिशुगोपगूढं स्तनं धयन्तं कमलैककान्तम्
    । सम्बोधयामास मुदा यशोदा गोविन्द दामोदर माधवेति ॥ ॥ क्रीडन्तमन्तर्व्रजमात्मजं स्वं समं वयस्यैः पशुपालबालैः
    । प्रेम्णा यशोदा प्रजुहाव कृष्णं गोविन्द दामोदर माधवेति ॥ ॥ यशोदया गाढमुलूखलेन गोकण्ठपाशेन निबध्यमानः
    । रुरोद मन्दं नवनीतभोजी गोविन्द दामोदर माधवेति ॥ ॥ निजाङ्गणे कङ्कणकेलिलोलं गोपी गृहीत्वा नवनीतगोलम्
    । आमर्दयत्पाणितलेन नेत्रे गोविन्द दामोदर माधवेति ॥ ॥ गृहे गृहे गोपवधूकदम्बाः सर्वे मिलित्वा समवाययोगे
    । पुण्यानि नामानि पठन्ति नित्यं गोविन्द दामोदर माधवेति ॥ ॥ मन्दारमूले वदनाभिरामं बिम्बाधरे पूरितवेणुनादम्
    । गोगोपगोपीजनमध्यसंस्थं गोविन्द दामोदर माधवेति ॥ रात्रभागे स्मृत्वा यशोदासुतबालकेलिम् । गायन्ति प्रोच्चैर्दधि
    मन्थयन्त्यो गोविन्द दामोदर माधवेति ॥ ॥ जग्धोऽथ दत्तो नवनीतपिण्डो गृहे यशोदा विचिकित्सयन्ती । उवाच
    सत्यं वद हे मुरारे गोविन्द दामोदर माधवेति ॥ ॥ अभ्यर्च्य गेहं युवतिः प्रवृद्ध प्रेमप्रवाहा दधि निर्ममन्थ
    । गायन्ति गोप्योऽथ सखीसमेता गोविन्द दामोदर माधवेति ॥ ॥ क्वचित् प्रभाते दधिपूर्णपात्रे निक्षिप्य मन्थं
    युवती मुकुन्दम् । आलोक्य गानं विविधं करोति गोविन्द दामोदर माधवेति ॥ ॥ क्रीडापरं भोजनमज्जनार्थं हितैषिणी
    स्त्री तनुजं यशोदा । आजूहवत् प्रेमपरिप्लुताक्षी गोविन्द दामोदर माधवेति ॥ ॥ सुखं शयानं निलये च विष्णुं
    देवर्षिमुख्या मुनयः प्रपन्नाः । तेनाच्युते तन्मयतां व्रजन्ति गोविन्द दामोदर माधवेति ॥ ॥ विहाय निद्रामरुणोदये
    च विधाय कृत्यानि च विप्रमुख्याः । वेदावसाने प्रपठन्ति नित्यं गोविन्द दामोदर माधवेति ॥ ॥ वृन्दावने
    गोपगणाश्च गोप्यो विलोक्य गोविन्दवियोगखिन्नाम् । राधां जगुः साश्रुविलोचनाभ्यां गोविन्द दामोदर माधवेति
    ॥ ॥ प्रभातसञ्चारगता नु गावस् तद्रक्षणार्थं तनयं यशोदा । प्राबोधयत् पाणितलेन मन्दं गोविन्द दामोदर माधवेति
    ॥ ॥ प्रवालशोभा इव दीर्घकेशा वाताम्बुपर्णाशनपूतदेहाः । मूले तरूणां मुनयः पठन्ति गोविन्द दामोदर माधवेति
    ॥ ॥ एवं ब्रुवाणा विरहातुरा भृशं व्रजस्त्रियः कृष्णविषक्तमानसाः । विसृज्य लज्जां रुरुदुः स्म सुस्वरं
    गोविन्द दामोदर माधवेति ॥ ॥ गोपी कदाचिन्मणिपञ्जरस्थं शुकं वचो वाचयितुं प्रवृत्ता । आनन्दकन्द व्रजचन्द्र
    कृष्ण गोविन्द दामोदर माधवेति ॥ ॥ गोवत्सबालैः शिशुकाकपक्षं बध्नन्तमम्भोजदलायताक्षम् । उवाच माता चिबुकं
    गृहीत्वा गोविन्द दामोदर माधवेति ॥ ॥ प्रभातकाले वरवल्लवौघा गोरक्षणार्थं धृतवेत्रदण्डाः । आकारयामासुरनन्तमाद्यं
    गोविन्द दामोदर माधवेति ॥ ॥ जलाशये कालियमर्दनाय यदा कदम्बादपतन्मुरारिः । गोपाङ्गनाश्चुक्रुशुरेत्य गोपा
    गोविन्द दामोदर माधवेति ॥ ॥ अक्रूरमासाद्य यदा मुकुन्दश् चापोत्सवार्थं मथुरां प्रविष्टः । तदा स पौरैर्जयसीत्यभाषि
    गोविन्द दामोदर माधवेति ॥ ॥ कंसस्य दूतेन यदैव नीतौ वृन्दावनान्ताद् वसुदेवसूनू । रुरोद गोपी भवनस्य मध्ये
    गोविन्द दामोदर माधवेति ॥ ॥ सरोवरे कालियनागबद्धं शिशुं यशोदातनयं निशम्य । चक्रुर्लुठन्त्यः पथि गोपबाला
    गोविन्द दामोदर माधवेति ॥ ॥ अक्रूरयाने यदुवंशनाथं सङ्गच्छमानं मथुरां निरीक्ष्य । ऊचुर्वियोगत् किल गोपबाला
    गोविन्द दामोदर माधवेति ॥ ॥ चक्रन्द गोपी नलिनीवनान्ते कृष्णेन हीना कुसुमे शयाना । प्रफुल्लनीलोत्पललोचनाभ्यां
    गोविन्द दामोदर माधवेति ॥ ॥ मातापितृभ्यां परिवार्यमाणा गेहं प्रविष्टा विललाप गोपी । आगत्य मां पालय
    विश्वनाथ गोविन्द दामोदर माधवेति ॥ ॥ वृन्दावनस्थं हरिमाशु बुद्ध्वा गोपी गता कापि वनं निशायाम् । तत्राप्यदृष्ट्वाऽतिभयादवोचद्
    गोविन्द दामोदर माधवेति ॥ ॥ सुखं शयाना निलये निजेऽपि नामानि विष्णोः प्रवदन्ति मर्त्याः । ते निश्चितं
    तन्मयतां व्रजन्ति गोविन्द दामोदर माधवेति ॥ ॥ सा नीरजाक्षीमवलोक्य राधां रुरोद गोविन्दवियोगखिन्नाम्
    । सखी प्रफुल्लोत्पललोचनाभ्यां गोविन्द दामोदर माधवेति ॥ ॥ जिह्वे रसज्ञे मधुरप्रिया त्वं सत्यं हितं
    त्वां परमं वदामि । आवर्णयेथा मधुराक्षराणि गोविन्द दामोदर माधवेति ॥ ॥ आत्यन्तिकव्याधिहरं जनानां चिकित्सकं
    वेदविदो वदन्ति । संसारतापत्रयनाशबीजं गोविन्द दामोदर माधवेति ॥ ॥ ताताज्ञया गच्छति रामचन्द्रे सलक्ष्मणेऽरण्यचये
    ससीते । चक्रन्द रामस्य निजा जनित्री गोविन्द दामोदर माधवेति ॥ ॥ एकाकिनी दण्डककाननान्तात् सा नीयमाना
    दशकन्धरेण । सीता तदाक्रन्ददनन्यनाथा गोविन्द दामोदर माधवेति ॥ ॥ रामाद्वियुक्ता जनकात्मजा सा विचिन्तयन्ती
    हृदि रामरूपम् । रुरोद सीता रघुनाथ पाहि गोविन्द दामोदर माधवेति ॥ ॥ प्रसीद विष्णो रघुवंशनाथ सुरासुराणां
    सुखदुःखहेतो । रुरोद सीता तु समुद्रमध्ये गोविन्द दामोदर माधवेति ॥ ॥ अन्तर्जले ग्राहगृहीतपादो विसृष्टविक्लिष्टसमस्तबन्धुः
    । तदा गजेन्द्रो नितरां जगाद गोविन्द दामोदर माधवेति ॥ ॥ हंसध्वजः शङ्खयुतो ददर्श पुत्रं कटाहे प्रतपन्तमेनम्
    । पुण्यानि नामानि हरेर्जपन्तं गोविन्द दामोदर माधवेति ॥ ॥ दुर्वाससो वाक्यमुपेत्य कृष्णा सा चाब्रवीत्
    काननवासिनीशम् । अन्तः प्रविष्टं मनसा जुहाव गोविन्द दामोदर माधवेति ॥ ॥ ध्येयः सदा योगिभिरप्रमेयः चिन्ताहरश्चिन्तितपारिजातः
    । कस्तूरिकाकल्पितनीलवर्णो गोविन्द दामोदर माधवेति ॥ ॥ संसारकूपे पतितोऽत्यगाधे मोहान्धपूर्णे विषयाभितप्ते
    । करावलम्बं मम देहि विष्णो गोविन्द दामोदर माधवेति ॥ ॥ भजस्व मन्त्रं भवबन्धमुक्त्यै जिह्वे रसज्ञे सुलभं
    मनोज्ञम् । द्वैपायनाद्यैर्मुनिभिः प्रजप्तं गोविन्द दामोदर माधवेति ॥ ॥ त्वामेव याचे मम देहि जिह्वे
    समागते दण्डधरे कृतान्ते । वक्तव्यमेवं मधुरं सुभक्त्या गोविन्द दामोदर माधवेति ॥ ॥ गोपाल वंशीधर रूपसिन्धो
    लोकेश नारायण दीनबन्धो । उच्चस्वरैस्त्वं वद सर्वदैव गोविन्द दामोदर माधवेति ॥ ॥ जिह्वे सदैवं भज सुन्दराणि
    नामानि कृष्णस्य मनोहराणि । समस्तभक्तार्तिविनाशनानि गोविन्द दामोदर माधवेति ॥ ॥ गोविन्द गोविन्द हरे
    मुरारे गोविन्द गोविन्द मुकुन्द कृष्ण । गोविन्द गोविन्द रथाङ्गपाणे गोविन्द दामोदर माधवेति ॥ ॥ सुखावसाने
    त्विदमेव सारं दुःखावसाने त्विदमेव गेयम् । देहावसाने त्विदमेव जाप्यं गोविन्द दामोदर माधवेति ॥ ॥ दुर्वारवाक्यं
    परिगृह्य कृष्णा मृगीव भीता तु कथं कथञ्चित् । सभां प्रविष्टा मनसा जुहाव गोविन्द दामोदर माधवेति ॥ ॥
    श्रीकृष्ण राधावर गोकुलेश गोपाल गोवर्धन नाथ विष्णो । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति
    ॥ ॥ श्रीनाथ विश्वेश्वर विश्वमूर्ते श्रीदेवकीनन्दन दैत्यशत्रो । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर
    माधवेति ॥ ॥ गोपीपते कंसरिपो मुकुन्द लक्ष्मीपते केशव वासुदेव । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर
    माधवेति ॥ ॥ गोपीजनाह्लादकर व्रजेश गोचारणारण्यकृतप्रवेश । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति
    ॥ ॥ प्राणेश विश्वम्भर कैटभारे वैकुण्ठ नारायण चक्रपाणे । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति
    ॥ ॥ हरे मुरारे मधुसूदनाद्य श्रीराम सीतावर रावणारे । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति
    ॥ ॥ श्रीयादवेन्द्राद्रिधराम्बुजाक्ष गोगोपगोपीसुखदानदक्ष । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति
    ॥ ॥ धराभरोत्तारणगोपवेष विहारलीलाकृतबन्धुशेष । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ॥ बकीबकाघासुरधेनुकारे
    केशीतृणावर्तविघातदक्ष । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ॥ श्रीजानकीजीवन रामचन्द्र
    निशाचरारे भरताग्रजेश । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ॥ नारायणानन्त हरे नृसिंह प्रह्लादबाधाहर
    हे कृपालो । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ॥ लीलामनुष्याकृतिरामरूप प्रतापदासीकृतसर्वभूप
    । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ॥ श्रीकृष्ण गोविन्द हरे मुरारे हे नाथ नारायण वासुदेव
    । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ॥ वक्तुं समर्थोऽपि न वक्ति कश्चिद् अहो जनानां व्यसनाभिमुख्यम्
    । जिह्वे पिबस्वामृतमेतदेव गोविन्द दामोदर माधवेति ॥ ॥ इति श्रीबिल्वमङ्गलाचार्यविरचितं श्रीगोविन्ददामोदरस्तोत्रं
    सम्पूर्णम् ।
