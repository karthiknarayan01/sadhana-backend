id: shridattatreyastotram
category: stotram
name:
  english: shridattatreyastotram
  devanagari: श्रीदत्तात्रेयस्तोत्रम्
content:
  english: balakaprabha imdranila jathilam | bhasmamgara gotvalam | shantamnada vilida cittapavanam |
    shardula canmambaram | brahmadyesanakadi visvari vridam | siddhaisamaradhitam | atreyam samupasmagheghrudimuda
    | gheyam sada yogibhih | digambaram bhasmavilepitamgam | cakram trishulam damarum gadamca | padmasanastam
    shashisujnanetram | dattatreyam gheya vabhishta siddhye | om namoshri gurumdattam | datta devam jagadagurum
    | nishkalam nirgunam vamde | dattatreyam namamyaham | brahmalokeshabhutesha | shamkha cakra gadadharam
    | panipatradharamdevam | dattatreyam namamyaham | suresha vamditam devam | trailokya lokavamditam
    | hariharatmakamdevam | dattatreyam namamyaham | nirmalam nila varnamca | sumdaram shamashobhitam
    | sulocanam vishalaksham | dattatreyam namamyaham | trishulam damarummala | jatamukutamamditam | mamditam
    kumdalam karne | dattatreyam namamyaham | vibhutimbhushitamdeham | hara keyura shobhitam | anantapranavakaram
    | shri dattatreyam namamyaham | prasannavadanam devam | bhukti bhukti pradayakam | janardhanam jagatranam
    | dattatreyam namamyaham | rajarajam nidacaram | kartaviryavarapradam | subhadrambhadrakalyanam |
    dattatreyam namamyaham | anasuya priyakaram | atriputram sureshvaram | vikhyata yoginammoksham | dattatreyam
    namamyaham | digambara tanumshreshtham | brahmasajjyapradesthitam | hamsamkham satmakam nityam | dattatreyam
    namamyaham | kadayogi kadabhogi | balalila vinodagraha | dashanairatnasamkashaihi | dattatreyam namamyaham
    | bhutavata bhavatrasaha | grahapidatathaivaca | daridryabhyasandvambhi | dattatreyam namamyaham |
    caturdashyam budhevare | janmamargashireshubhe | sarakam vipulam vamde | dattatreyam namamyaham |
    raktotpala dalampadam | sarvatirtham samud
  devanagari: बालाकप्रभा इंद्रनील जठीलं । भस्मांगरा गोत्वलं । शान्तंनाद विलीद चित्तपवनं । शार्दूल चन्मांबरं
    । ब्रह्मद्येसनकादी विस्वरी व्रीदं । सिद्धैसमाराधितं । आत्रेयं समूपास्मघेघ्रुदीमूदा । घेयं सदा योगीभीः
    । दिगंबरं भस्मविलेपितांगं । चक्रं त्रिशूलं डमरूं गदांच । पद्मासनस्तं शशीसूज्ञनेत्रं । दत्तात्रेयं
    घेय वभीष्ट सिद्ध्ये । ॐ नमोश्री गुरूंदत्तं । दत्त देवं जगदगुरुं । निष्कलं निर्गुणं वंदे । दत्तात्रेयं
    नमाम्यहं । ब्रह्मालोकेशभूतेश । शंख चक्र गदाधरं । पाणीपात्रधरंदेवं । दत्तात्रेयं नमाम्यहं । सुरेश वंदितं
    देवं । त्रैलोक्य लोकवंदितं । हरिहरात्मकंदेवं । दत्तात्रेयं नमाम्यहं । निर्मलं नील वर्णंच । सुंदरं
    शामशोभितं । सुलोचनं विशालाक्षं । दत्तात्रेयं नमाम्यहं । त्रिशूलं डमरूंमाला । जटामुकुटमंडितं । मंडितं
    कुंडलं कर्णे । दत्तात्रेयं नमाम्यहं । विभूतींभूषितंदेहं । हार केयूर शोभितं । अनन्तप्रणवाकारं । श्री
    दत्तात्रेयं नमाम्यहं । प्रसन्नवदनं देवं । भुक्ति भुक्ती प्रदायकं । जनार्धनम् जगत्राणं । दत्तात्रेयं
    नमाम्यहं । राजराजं निदाचारं । कार्तवीर्यवरप्रदं । सुभद्रंभद्रकल्याणम् । दत्तात्रेयं नमाम्यहं । अनसूया
    प्रियकरं । अत्रिपुत्रं सुरेश्वरं । विख्यात योगीनांमोक्षं । दत्तात्रेयं नमाम्यहं । दिगंबर तनूंश्रेष्ठं
    । ब्रह्मसज्ज्यप्रदेस्थितं । हंसंखं सात्मकं नित्यं । दत्तात्रेयं नमाम्यहं । कदायोगी कदाभोगी । बाललीला
    विनोदग्रह । दशनैरत्नसंकाशैही । दत्तात्रेयं नमाम्यहं । भूतवाता भवत्रासह । ग्रहपीडातथैवच । दरिद्र्यभ्यसन्द्वंभी
    । दत्तात्रेयं नमाम्यहं । चतुर्दश्यां बुधेवारे । जन्ममार्गशीरेशुभे । सारकं विपुलं वंदे । दत्तात्रेयं
    नमाम्यहं । रक्तोत्पल दलंपादं । सर्वतीर्थं समुद्
