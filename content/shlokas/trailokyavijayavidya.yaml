id: trailokyavijayavidya
category: kavacha
name:
  english: trailokyavijayavidya
  devanagari: त्रैलोक्यविजयविद्या
content:
  english: trailokyavijayavidya || atha trailokyavijayavidya || ishvara uvaca trailokyavijayam vakshye
    sarvayatravimardinim || 1|| om hum kshum hum om namo bhagavati damshtrani bhimavaktre mahograrupe
    hili hili raktanetre kili kili mahanisvane kulu om nirmamse kata kata gonasabharane cili cili shavamaladharini
    dravaya
  devanagari: त्रैलोक्यविजयविद्या ॥ अथ त्रैलोक्यविजयविद्या ॥ ईश्वर उवाच त्रैलोक्यविजयां वक्ष्ये सर्वयत्रविमर्दिनीम्
    ॥ १॥ ॐ हूं क्षूं हूं ॐ नमो भगवति दंष्ट्रणि भीमवक्त्रे महोग्ररूपे हिलि हिलि रक्तनेत्रे किलि किलि महानिस्वने
    कुलु ॐ निर्मांसे कट कट गोनसाभरणे चिलि चिलि शवमालाधारिणि द्रावय
meaning: {}
