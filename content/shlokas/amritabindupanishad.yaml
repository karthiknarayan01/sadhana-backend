id: amritabindupanishad
category: upanishad
name:
  english: amritabindupanishad
  devanagari: अमृतबिन्दूपनिषद्
content:
  english: amritabindupanishad om bhadram karnebhih shrinuyama devah bhadram pashyemakshabhiryajatrah
    | sthirairangaistushtuvamsastanubhirvyashema devahitam yadayuh | svasti na indro vriddhashravah svasti
    nah pusha vishvavedah | svasti nastarkshyo'rishtanemih svasti no brihaspatirdadhatu | om shantih shantih
    shantih | harih om || mano hi dvividham proktam shuddham cashuddhameva ca | ashuddham kamasamkalpam
    shuddham kamavivarjitam ||
  devanagari: अमृतबिन्दूपनिषद् ॐ भद्रं कर्णेभिः शृणुयाम देवाः भद्रं पश्येमाक्षभिर्यजत्राः । स्थिरैरङ्गैस्तुष्टुवांसस्तनूभिर्व्यशेम
    देवहितं यदायुः । स्वस्ति न इन्द्रो वृद्धश्रवाः स्वस्ति नः पूषा विश्ववेदाः । स्वस्ति नस्तार्क्ष्योऽरिष्टनेमिः
    स्वस्ति नो बृहस्पतिर्दधातु । ॐ शान्तिः शान्तिः शान्तिः । हरिः ॐ ॥ मनो हि द्विविधं प्रोक्तं शुद्धं
    चाशुद्धमेव च । अशुद्धं कामसंकल्पं शुद्धं कामविवर्जितम् ॥
meaning: {}
