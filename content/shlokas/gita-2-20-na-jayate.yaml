id: gita-2-20-na-jayate
category: gita_shloka
name:
  english: Na Jayate Mriyate Va Kadachit
  devanagari: न जायते म्रियते वा कदाचित्
content:
  english: >-
    na jayate mriyate va kadachin nayam bhutva bhavita va na bhuyah, ajo
    nityah shashvato 'yam purano na hanyate hanyamane sharire
  devanagari: >-
    न जायते म्रियते वा कदाचि न्नायं भूत्वा भविता वा न भूयः । अजो नित्यः
    शाश्वतोऽयं पुराणो न हन्यते हन्यमाने शरीरे ॥
meaning:
  english: >-
    The soul is never born, nor does it ever die; having come into being,
    it never ceases to be. Unborn, eternal, everlasting, ancient — it is
    not slain when the body is slain.
source_attribution:
  text_source: Bhagavad Gita, Chapter 2, Verse 20
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
