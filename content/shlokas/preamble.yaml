  devanagari: ॐ परब्रह्मावतरणाय । केशवाय । क्लेशनाशनाय । भूमिभारावतरणाय । भक्तार्थाखिलमानसाय । सर्वभक्तनिरोधात्मने
    । लीलानन्तनिरोधकृते । भूमिष्ठपरमानन्दाय । देवकीशुद्धिकारणाय । वसुदेवज्ञाननिष्ठसमजीवनवारकाय । सर्ववैराग्यकरणस्वलीलाधारशोधकाय
    । मायाज्ञापनकर्त्रे नमः । ७४० ॐ शेषसम्भारसम्भृतये नमः । भक्तक्लेशपरिज्ञात्रे । तन्निवारणत त्पराय ।
    आविष्टवसुदेवांशाय । देवकीगर्भभूषणाय । पूर्णतेजोमयाय । पूर्णाय । कंसाधृष्यप्रतापवते । विवेकज्ञानदात्रे
    । ब्रह्माद्यखिलसंस्तुताय । सत्याय । जगत्कल्पतरवे । नानारूपविमोहनाय । भक्तिमार्गप्रतिष्ठात्रे । विद्वन्मोहप्रवर्तकाय
    । मूलकालगुणद्रष्ट्रे । नयनानन्दभाजनाय । वसुदेवसुखाब्धये । देवकीनयनामृताय । पितृमातृस्तुताय नमः । ७६०
    ॐ पूर्वसर्ववृत्तान्तबोधकाय नमः । गोकुलागतिलीलाप्तवसुदेवकरस्थितये । सर्वेशत्वप्रकटनाय । मायाव्यत्ययकारकाय
    । ज्ञानमोहितदुष्टेशाय । प्रपञ्चास्मृतिकारणाय । यशोदानन्दनाय । नन्दभाग्यभूगोकुलोत्सवाय । नन्दप्रियाय
    । नन्दसूनवे । यशोदायाः स्तनन्धयाय । पूतनासुपयःपात्रे । मुग्धभावातिसुन्दराय । सुन्दरीहृदयानन्दाय ।
    गोपीमन्त्राभिमन्त्रिताय । गोपालाश्चर्यरसकृते । शकटासुरखण्डनाय । नन्दव्रजजनानन्दिने । नन्दभाग्यमहोदयाय
    । तृणावर्तवधोत्साहाय नमः । ७८० ॐ यशोदाज्ञानविग्रहाय नमः । बलभद्रप्रियाय । कृष्णाय । सङ्कर्षणसहायवते
    । रामानुजाय । वासुदेवाय । गोष्ठाङ्गणगतिप्रियाय । किङ्किणीरवभावज्ञाय । वत्सपुच्छावलम्बनाय । नवनीतप्रियाय
    । गोपीमोहसंसारनाशकाय । गोपबालकभावज्ञाय । चौर्यविद्याविशारदाय । मृत्स्नाभक्षणलीलास्यमाहात्म्यज्ञानदायकाय
    । धराद्रोणप्रीतिकर्त्रे । दधिभाण्डविभेदनाय । दामोदराय । भक्तवश्याय । यमलार्जुनभञ्जनाय । बृहद्वनमहाश्चर्याय
    नमः । ८०० ॐ वृन्दावनगतिप्रियाय नमः । वत्सघातिने । बालकेलये । बकासुरनिषूदनाय । अरण्यभोक्त्रे । बाललीलापरायणाय
    । प्रोत्साहजनकाय । अघासुरनिषूदनाय । व्यालमोक्षप्रदाय । पुष्टाय । ब्रह्ममोहप्रवर्धनाय । अनन्तमूर्तये
    । सर्वात्मने । जङ्गमस्थावराकृतये । ब्रह्ममोहनकर्त्रे । स्तुत्याय । आत्मने । सदाप्रियाय । पौगण्डलीलाभिरतये
    । गोचारणपरायणाय नमः । ८२० ॐ वृन्दावनलतागुल्मवृक्षरूपनिरूपकाय नमः । नादब्रह्मप्रकटनाय । वयःप्रतिकृतिनिःस्वनाय
    । बर्हिनृत्यानुकरणाय । गोपालानुकृतिस्वनाय । सदाचारप्रतिष्ठात्रे । बलश्रमनिराकृतये । तरुमूलकृताशेषतल्पशायिने
    । सखिस्तुताय । गोपालसेवितपदाय । श्रीलालितपदाम्बुजाय । गोपसम्प्रार्थितफलदाननाशितधेनुकाय । कालीयफणिमाणिक्यरञ्जितश्रीपदाम्बुजाय
    । दृष्टिसञ्जीविताशेषगोपगोगोपिकाप्रियाय । लीलासम्पीतदावाग्नये । प्रलम्बवधपण्डिताय । दावाग्न्यावृतगोपालदृष्ट्याऽऽच्छादनवह्निपाय
    । वर्षाशरद्विभूतिश्रिये । गोपीकामप्रबोधकाय । गोपीरत्नस्तुताशेषवेणुवाद्यविशारदाय नमः । ८४० ॐ कात्यायनीव्रतव्याजसर्वभावाश्रिताङ्गनाय
    नमः । सत्सङ्गतिस्तुतिव्याजस्तुतवृन्दावनाङ्घ्रिपाय । गोपक्षुच्छान्ति संव्याज विप्रभार्याप्रसादकृते
    । हेतुप्राप्तेन्द्रयागस्वकार्यगोसवबोधकाय नमः । शैलरूपकृताशेषरसभोगसुखावहाय । लीलागोवर्धनोद्धारपालितस्वव्रजप्रियाय
    । गोपस्वच्छन्दलीलार्थगर्गवाक्यार्थबोधकाय । इन्द्रधेनुस्तुतिप्राप्तगोविन्देन्द्राभिधानवते । व्रतादिधर्मसंसक्तनन्दक्लेशविनाशकाय
    । नन्दादिगोपमात्रेष्टवैकुण्ठगतिदायकाय । वेणुवादस्मरक्षोभमत्तगोपीविमुक्तिदाय । सर्वभावप्राप्तगोपीसुखसंवर्धनक्षमाय
    । गोपीगर्वप्रणाशार्थतिरोधानसुखप्रदाय । कृष्णभावव्याप्तविश्वगोपी भावितवेशधृशे । राधाविशेषसम्भोगप्राप्तदोषनिवारकाय
    । परमप्रीतिसङ्गीतसर्वाद्भुतमहागुणाय । मानापनोदनाक्रन्दगोपीदृष्टिमहोत्सवाय । गोपिकाव्याप्तसर्वाङ्गाय
    । स्त्रीसम्भाषविशारदाय । रासोत्सवमहासौख्यगोपीसम्भोगसागराय नमः । ८६० ॐ जलस्थलरतिव्याप्तगोपीदृष्ट्यभिपूजिताय
    नमः । शास्त्रानपेक्षकामैकमुक्तिद्वारविवर्धनाय । सुदर्शनमहासर्पग्रस्तनन्दविमोचकाय । गीतमोहितगोपीधृक्शङ्खचूडविनाशकाय
    । गुणसङ्गीतसन्तुष्टये । गोपीसंसारविस्मृतये । अरिष्टमथनाय । दैत्यबुद्धिव्यामोहकारकाय । केशिघातिने ।
    नारदेष्टाय । व्योमासुरविनाशकाय । अक्रूरभक्तिसंराद्धपादरेणुमहानिधये । रथावरोहशुद्धात्मने । गोपीमानसहारकाय
    । ह्रदसन्दर्शिताशेषवैकुण्ठाक्रूरसंस्तुताय । मथुरागमनोत्साहाय । मथुराभाग्यभाजनाय । मथुरानगरीशोभादर्शनोत्सुकमानसाय
    । दुष्टरञ्जकघातिने । वायकार्चितविग्रहाय नमः । ८८० ॐ वस्त्रमालासुशोभाङ्गाय नमः । कुब्जालेपनभूषिताय
    । कुब्जासुरूपकर्त्रे । कुब्जारतिवरप्रदाय । प्रसादरूपसन्तुष्टहरकोदण्डखण्डनाय । शकलाहतकंसाप्तधनूरक्षकसैनिकाय
    । जाग्रत्स्वप्नभयव्याप्तमृत्युलक्षणबोधकाय । मथुरामल्लाय । ओजस्विने । मल्लयुद्धविशारदाय । सद्यः कुवलयापीडघातिने
    । चाणूरमर्दनाय । लीलाहतमहामल्लाय । शलतोशलघातकाय । कंसान्तकाय । जितामित्राय । वसुदेवविमोचकाय । ज्ञाततत्त्वपितृज्ञानमोहनामृतवाङ्मयाय
    । उग्रसेन प्रतिष्ठात्रे । यादवाधिविनाशकाय नमः । ९०० ओं नन्दादिसान्त्वनकराय नमः । ब्रह्मचर्यव्रते स्थिताय
    । गुरुशुश्रूषणपराय । विद्यापारमितेश्वराय । सान्दीपनिमृतापत्यदात्रे । कालान्तकादिजिते । गोकुलाश्वासनपराय
    । यशोदानन्दपोषकाय । गोपिकाविरहव्याजमनोगतिरतिप्रदाय । समोद्भवभ्रमरवाचे । गोपिकामोहनाशकाय । कुब्जारतिप्रदाय
    । अक्रूरपवित्रीकृतभूगृहाय । पृथादुःखप्रणेत्रे । पाण्डवानां सुखप्रदाय । उत्तरार्धतः
