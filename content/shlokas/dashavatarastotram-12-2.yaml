id: dashavatarastotram-12-2
category: shataka
name:
  english: dashavatarastotram 12
  devanagari: दशावतारस्तोत्रम् १२
content:
  english: shridashavatarastotram yo nama purvamavatirtha raraksha vishvam phenavagadhacaladurmibhare'mburashau
    | kenahamasmi paravanaravindanetram minakritim madhunishudanamantarena || 1|| lokam bibharti shakalam
    kamatho bhavan yo nakam parena parame gagane vidiptah | sakam ramadimahishigatavandhanityaih shokam
    sa me haratu samsritijam mukundah || 2|| urvitaloddharanakrityapatishthabhava darvikarashanarathasya
    dhananjanabha | gurvi tritiyajaniradbhutakolarupa kurvita nah kushalamindusamanadamshtra || 3|| kayadhave
    paramaya kripaya prakopo maya maye kanakanamani danavendre | sayahnakala uditah sarasiruhakshah payannrisimhatanuracyuta
    esha bhaktan || 4|| garvakarena balinapahritam trilokim kharvakritistamapahritya tu vancayitva | svarvasavairiguruna
    prabhave'maranam durvaramastu bhavikaya dadaddharirvah || 5|| yo bhargavah svapitrisamharanotthakopah
    shobhaspadadvishatapancashakabahu panktim | svabhavikarghyaparashurnripamarjunakhyam | dhibhadisadgunanidhirhatavan
    sa patu || 6|| bhumavabhut suraganairdinarajavamshe yo'mananantagunarashibhirarthyamanah | dhiman
    hi gadhijamakhavanakrit samudha
  devanagari: श्रीदशावतारस्तोत्रम् यो नाम पूर्वमवतीर्थ ररक्ष विश्वं फेनावगाढचलदूर्मिभरेऽम्बुराशौ । केनाहमस्मि
    परवानरविन्दनेत्रं मीनाकृतिं मधुनिषूदनमन्तरेण ॥ १॥ लोकं बिभर्ति शकलं कमठो भवन् यो नाकं परेण परमे गगने
    विदीप्तः । साकं रमादिमहिषीगतवन्धनित्यैः शोकं स मे हरतु संसृतिजं मुकुन्दः ॥ २॥ उर्वीतलोद्धरणकृत्यपटिष्ठभावा
    दर्वीकराशनरथस्य धनाञ्जनाभा । गुर्वी तृतीयजनिरद्भुतकोलरूपा कुर्वीत नः कुशलमिन्दुसमानदंष्ट्रा ॥ ३॥ कायाधवे
    परमया कृपया प्रकोपो माया मये कनकनामनि दानवेन्द्रे । सायाह्नकाल उदितः सरसीरुहाक्षः पायान्नृसिंहतनुरच्युत
    एष भक्तान् ॥ ४॥ गर्वाकरेण बलिनापहृतां त्रिलोकीं खार्वाकृतिस्तमपहृत्य तु वञ्चयित्वा । स्वर्वासवैरिगुरुणा
    प्रभवेऽमराणां दुर्वारमस्तु भविकाय ददद्धरिर्वः ॥ ५॥ यो भार्गवः स्वपितृसंहरणोत्थकोपः शोभास्पदद्विशतपञ्चशकबाहु
    पङ्क्तिम् । स्वाभाविकार्घ्यपरशुर्नृपमर्जुनाख्यम् । धीभादिसद्गुणनिधिर्हतवान् स पातु ॥ ६॥ भूमावभूत्
    सुरगणैर्दिनराजवंशे योऽमाननन्तगुणराशिभिरर्थ्यमानः । धीमान् हि गाधिजमखावनकृत् समूढ
