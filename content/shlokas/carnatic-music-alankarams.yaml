    | ma || ri ga ma ri ga ri ga | ma | pa || ga ma pa ga ma ga ma | pa | da || ma pa da ma pa ma pa |
    da | ni || pa da ni pa da pa da | ni | sa || ni da pa ni da ni da | pa | ma || da pa ma da pa da pa
    | ma | ga || pa ma ga pa ma pa ma | ga | ri || ma ga ri ma ga ma ga | ri | sa tisra jati triputa talam
    kala sa ri ga | sa ri | ga ma || ri ga ma | ri ga | ma pa || ga ma pa | ga ma | pa da || ma pa da
    | ma pa | da ni || pa da ni | pa da | ni sa ni | da pa || ni da pa | ni da | pa ma || da pa ma | da
    pa | ma ga || pa ma ga | pa ma | ga ri || ma ga ri | ma ga | ri sa || caturasra jati eka talam sa
    ri ga ma || ri ga ma pa || ga ma pa da || ma pa da ni || pa da ni sa ni da pa || ni da pa ma || da
    pa ma ga || pa ma ga ri || ma ga ri sa || sankirna jati eka talam ga ri sa || vikalpah sa ri
