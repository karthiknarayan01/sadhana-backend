id: advaitopanishat
category: upanishad
name:
  english: advaitopanishat
  devanagari: अद्वैतोपनिषत्
content:
  english: sattvarajastamogunarahitam tattvam ceti | yatha yogi vayunirodhanam uktacaranagururachinoti
    kilbisham | sarvadivyadehamadhye paramatma prakashitah vinirmuktabhavasagarah svarge devamadhye uttamasvalpasya
    buddhiprakashah asminmadhye mayamoham parityajet | prakashamadhye maya karoti | tailamadhye yatha
    yatha makshika ekadehimadhye brahma dashadha rupam vicarati | cakshuhpranamanobuddhipancendriyani
    pancatattvani tatha ghataghatamadhye bahucandro'pi drishyate prakashitah sarvalokamadhye brahmano
    rupam vicarati tatha ghataghatamadhye bahucandro'pi drishyate | advaitam kathitam yena purusho'mudho
    bhavati | devasuramunimanushyanam adhah urdhvam caturdisham | bhuvarnayudevadavyadehiterasakaro drishyate
    rasakarakaramadhye bhavati nirakarah akara
  devanagari: सत्त्वरजस्तमोगुणरहितं तत्त्वं चेति । यथा योगी वायुनिरोधनं उक्ताचरणगुरुराछिनोति किल्बिषम्
    । सर्वदिव्यदेहमध्ये परमात्मा प्रकाशितः विनिर्मुक्तभवसागरः स्वर्गे देवमध्ये उत्तमस्वल्पस्य बुद्धिप्रकाशः
    अस्मिन्मध्ये मायामोहं परित्यजेत् । प्रकाशमध्ये माया करोति । तैलमध्ये यथा यथा मक्षिका एकदेहिमध्ये ब्रह्म
    दशधा रूपं विचरति । चक्षुःप्राणमनोबुद्धिपञ्चेन्द्रियाणि पञ्चतत्त्वानि तथा घटघटमध्ये बहुचन्द्रोऽपि दृश्यते
    प्रकाशितः सर्वलोकमध्ये ब्रह्मणो रूपं विचरति तथा घटघटमध्ये बहुचन्द्रोऽपि दृश्यते । अद्वैतं कथितं येन
    पुरुषोऽमूढो भवति । देवासुरमुनिमनुष्याणां अधः ऊर्ध्वं चतुर्दिशम् । भुवर्णायुदेवादाव्यदेहितेरसकारो दृश्यते
    रसकाराकारमध्ये भवति निराकारः अकार
