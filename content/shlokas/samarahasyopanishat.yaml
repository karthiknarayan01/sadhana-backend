id: samarahasyopanishat
category: upanishad
name:
  english: samarahasyopanishat
  devanagari: सामरहस्योपनिषत्
content:
  english: ringaravatyam yojitatmane namo namah | bhogadrashte bhogasambhavaya namo namah | nidrasambhavitavipralambhasukhasamanubhavatiratkritarasikanandatmane
    namo namah | atyantapravinarasasukharasikashiromanibhogabhavukatmane namo namah | sarvakridarasapurine
    namo namah | prithivyam yatra suratanandabhogastadbhogavirbhavantaryamine namo namah | prithivya yadanandarupam
    tattadanandadayine namo namah | prithivyamatikamamanoratham siddham vasiddham sundaram subhagam teshameva
    namo namah | evam stutastada vasubhih svanandavirbhavam dadavatiprito rudro'yam | vasunam pravaro'yam
    nando'bhavat | dharanamni stri yashodasta | brihadvasushreshthah kirtidevya saha vrishabhanurabhavat
    | nikunjadevya rasikanandena saha yatranando'bhavat | nandopanandabhadrashvakritavadugrabhangodadhisamantatirocishmatkatyeyamatyanagharocishmadushnisharashmivasusujaya
    anye ca shatasho vasava sadhanasiddhah evasata | tesham strishu shriyashoda sa ca satya asta | rasikanandashiromanirvrindavaneshvarya
    saha sankridamano'bhavat | atirupalavanyalavaka sukshmasvarupenainam bhajamanaya nandarupam dattavan
    | te gopa gopyah | te parasparamekaprana evasata | te gopa ekaprana ekarupina ekabhava abhavan | yesham
    purushottama anandah | anyashca gopyo nanabhajanabhavamavishkritya bhajananande bhajanam kurvanti
    | atitaram sneho'bhavat | sa lakshmirnarayanamuvacedam | atyanando'yam lokah | yasmin loke kevalarasanidhirmohanena
    rupena kridamakarot | sa vrindavaneshvari kotyanandarupa yatra balakelikridam vyadadhat | tesham sthanani
    kidrigvidhani | grihani kidrigvidhani | vada sarvamanandavirbhavena | bhajananandah sukham shriradharasikamohanamevam
    kridamatanot | sa hovaca lakshmim | nandasya griham sarvasamriddhyanandavadhi manimayamadhidaivikena
    rupena svaprakashamakarot | padmaragamayah kudyah | suvarnajambunadaprakara vithayo virajamana bhavanti
    | yatra vrishabhanugriham nandagrihadyojanayitam | tasmat sthanat dvadasha shrenayo'titaram laghukomalamanaya
    evasan | tasu shrenishvanekasho lataprataninya evasan | suvarnayuthikapravalairmaninarangaprarohairanandakridasthanamanuracitam
    bhavati | tatredam sanketasthanam | aho lakshmi kim varnyate caturyojanayitam | nandavrishabhanorgrihat
    dvadasha shrenayo virajamana sanketasthaladuparitah | teshu sthaneshu madhyasthita anekasho vividhalatapravara
    abhiyanti | muktalatagrathita maninam tejasa pradyotita abhyetyatitaram | sahasranikunja kadambalata
    sugandhasamvalitatitaram vistirnabhyeti subhaga kadambamanjari | haritapitanilashvetashubhrah kadambashca
    paragoddhritaparidhayah suvasita asan | tadgandhalolupabhramarah samsiddhah sadhanasiddha anekashah
    komalakalam yasho gayamana santi | kokilapikashukah samsiddhah sadhanasiddha anekakomalakalam gayamana
    santi | rupalavanyayutah hamsamayuradayo'nekasho rucira bhavanti | te tasmin sthane rasikanande'timohanarupe
    nityam sankridamana bhavanti | vrindavaneshvarinityakridapradhanam bhavati rasasakhinam samuhena dashasahasranam
    sametanam vrishabhanorgriham | vrishabhanupuram purnanandayutam premanandayutam sukhasantatiyutam
    | sarvah samriddhayo dvare tishthanti | ashtamahasiddhayo dvare dvare tishthanti | atitaram sukhasampattih
    svarupena susevate | ye ye vidyasadharmanah subhagah suratakalakamanidralajjapremasuratotkanthadayaste
    virajamana bhavanti | adhitatsthanam nikunje madhye sugandhashitala manayo grishmadishu ritushu sevyarupah
    kvacit sugandhaparijatah kecidvrikshashcampakah sadapushpitah sada sukomalaih patrairvirajante sugandhah
    | kecidvrikshah pakvaphalasugandharasayukta virajamana asate | kecillataprakirnah atitaram sugandhayutah
    | amodagandhalubdha bhramara muda gayanti | kashcidgopyastatra majjantya asate | kashcidgopyastasyam
    vastralankaranairbhushyacakruh | kashcidgopyah premasakta radharasikanandabhyam bhojanam cakruh |
    kashidgopyo dolam tabhyam saha dolayitva gayamana asan | muda kashcidgopyastaccitrashalayam svani
    svani rupani pashyanti hrishyanti ratrau divanavaratam | gopyo bhavashritastadbalalilam gayamana bhajanam
    cakruh | apyasaktah premabhajanarupa anandam vindante | tato gopastatha rasikanande magna atyantapremabhajanam
    kurvate | ye premabhajane nimagnaste tam lilamapadyanta | nityalilabhajananando'yam raso'nirvacaniyah
    | nandayashodavrishabhanusatyadayo ye bhaktaste bhajananandam nityamanubhavantyatitaram | bhuyo bhuyah
    sukhasaushthavamabhavat | evam gopa gopyastanmayatam prapnuvanti | tasam matribhavam prapanna gopyo
    bhajananande bhajanameva kurvana asan | tasam griha dishtadyanadisukhasamriddhisampattayo bhavantyanandasukhasamriddhisiddhayah
    | nanabhajanayogyanyupakaranani tadarthe sampaditani bhavanti | gopagopikadinam samriddhisukham tasya
    bhajanarthameva bhavati | atitaram sukharthameva yogyatapadyate | anantasukhasampattitaya nikunjadevyah
    svaveshena sukhakotyanandam prapnuvanti | abhiyanti ca sukhasamyogyatam | prithivyam bharate kshetre
    anandamayo lokah svasrishtililarthe svayameva prakatitah | tasmin vrajaloke sarva eva lilah santi
    | ye gopa gopyaste adhidaivikim lilamatitaram samsiddha anubhavanti | sa lakshmiruvacedam | rahasya
    iha vrajamandale yani prithaksthanani tani bruhi | ekavimshatiyojana bhumiranandamayyevasti | yamunaya
    dakshinakulato mahasthanam pancayojanayatam viharasthanamatitaram sukshmam nityavihararahasyakelikalavirbhavabhavitam
    | tasmin sthane ye vrikshah grihani nikunja anyani viharasthanani tanyadhidaivikanyasan | yo vamshivato'yam
    sakshacchivo'yam | yo bhandiravatah sa eva devendra asit | tatra sthita ye pakshinaste sadhanasiddha
    asan | te nirantaram tabhyamasan | ye tatra manushya adhidaivikarupa evasan te vrindavaneshvarisamanugrihitasmada
    tam lilam darshayanti tadanugrahatah | yasamajnatva jnatva va yasmin kasmin bhave bhavo bhavetta bhavena
    tam lilam prapnuvanti | yatra kutrapi sthito'pi tadvrindavanodbhava mrittikam bhakshayet | sa tava
    tam lilam prapnoti | tatsthanodbhavanam vrikshanam pushpamalam ye kanthe dharayanti te sarvakrityam
    vidhuya tam lilam prapnuvanti | sada tam lilam gayamanastam lilam prapta eva santi | yaih pratikshanam
    vrindavanam smaryate na kritarthatam prapnuvantyatitaram | asyamadhidaiviki lilam praptastam lilam
    gayanti dhyayanti | snehasakta ye tasmin sthale nivasanti tai purvam tatsrishtyutpanna eva santi nanyatra
    | tasmin vrindavane govardhano'yam parvatah pancayojanayatah | trini yojananyacchidritasaptasha
  devanagari: ृङ्गारवत्यां योजितात्मने नमो नमः । भोगद्रष्टे भोगसम्भवाय नमो नमः । निद्रासम्भावितविप्रलम्भसुखसमनुभवतिरत्कृतरसिकानन्दात्मने
    नमो नमः । अत्यन्तप्रवीणरससुखरसिकशिरोमणिभोगभावुकात्मने नमो नमः । सर्वक्रीडारसपूरिणे नमो नमः । पृथिव्यां
    यत्र सुरतानन्दभोगास्तद्भोगाविर्भावान्तर्यामिणे नमो नमः । पृथिव्या यदानन्दरूपं तत्तदानन्ददायिने नमो
    नमः । पृथिव्यामतिकाममनोरथं सिद्धं वासिद्धं सुन्दरं सुभगं तेषामेव नमो नमः । एवं स्तुतस्तदा वसुभिः स्वानन्दाविर्भावं
    ददावतिप्रीतो रुद्रोऽयम् । वसूनां प्रवरोऽयं नन्दोऽभवत् । धरानाम्नी स्त्री यशोदास्त । बृहद्वसुश्रेष्ठः
    कीर्तिदेव्या सह वृषभानुरभवत् । निकुञ्जदेव्या रसिकानन्देन सह यत्रानन्दोऽभवत् । नन्दोपनन्दभद्राश्वकृतवदुग्रभङ्गोदधिसामन्तातिरोचिष्मत्कात्येयमत्यनघरोचिष्मदुष्णीषरश्मिवसुसुजया
    अन्ये च शतशो वसव साधनसिद्धाः एवासत । तेषां स्त्रीषु श्रीयशोदा सा च सत्या आस्त । रसिकानन्दशिरोमणिर्वृन्दावनेश्वर्या
    सह सङ्क्रीडमानोऽभवत् । अतिरूपलावण्यलवक सूक्ष्मस्वरूपेणैनं भजमानाय नन्दरूपं दत्तवान् । ते गोपा गोप्यः
    । ते परस्परमेकप्राणा एवासत । ते गोपा एकप्राणा एकरूपिण एकभावा अभवन् । येषां पुरुषोत्तम आनन्दः । अन्याश्च
    गोप्यो नानाभजनभावमाविष्कृत्य भजनानन्दे भजनं कुर्वन्ति । अतितरां स्नेहोऽभवत् । सा लक्ष्मीर्नारायणमुवाचेदम्
    । अत्यानन्दोऽयं लोकः । यस्मिन् लोके केवलरसनिधिर्मोहनेन रूपेण क्रीडामकरोत् । सा वृन्दावनेश्वरी कोट्यानन्दरूपा
    यत्र बालकेलिक्रीडां व्यदधात् । तेषां स्थानानि कीदृग्विधानि । गृहाणि कीदृग्विधानि । वद सर्वमानन्दाविर्भावेन
    । भजनानन्दः सुखं श्रीराधारसिकमोहनमेवं क्रीडामातनोत् । स होवाच लक्ष्मीम् । नन्दस्य गृहं सर्वसमृद्ध्यानन्दावधि
    मणिमयमाधिदैविकेन रूपेण स्वप्रकाशमकरोत् । पद्मरागमयः कुड्यः । सुवर्णजाम्बूनदप्राकारा वीथयो विराजमाना
    भवन्ति । यत्र वृषभानुगृहं नन्दगृहाद्योजनायितम् । तस्मात् स्थानात् द्वादश श्रेणयोऽतितरां लघुकोमलमणय
    एवासन् । तासु श्रेणिष्वनेकशो लताप्रतानिन्य एवासन् । सुवर्णयूथिकाप्रवालैर्मणीनारङ्गप्ररोहैरानन्दक्रीडास्थानमनुरचितं
    भवति । तत्रेदं सङ्केतस्थानम् । अहो लक्ष्मि किं वर्ण्यते चतुर्योजनायितम् । नन्दवृषभानोर्गृहात् द्वादश
    श्रेणयो विराजमाना सङ्केतस्थलादुपरितः । तेषु स्थानेषु मध्यस्थिता अनेकशो विविधलताप्रावारा अभियन्ति ।
    मुक्तालताग्रथिता मणीनां तेजसा प्रद्योतिता अभ्येत्यतितराम् । सहस्रनिकुञ्जा कदम्बलता सुगन्धसंवलितातितरां
    विस्तीर्णाभ्येति सुभगा कदम्बमञ्जरी । हरितपीतनीलश्वेतशुभ्राः कदम्बाश्च परागोद्धृतपरिधयः सुवासिता आसन्
    । तद्गन्धलोलुपभ्रमराः संसिद्धाः साधनसिद्धा अनेकशः कोमलकलं यशो गायमाना सन्ति । कोकिलपिकशुकाः संसिद्धाः
    साधनसिद्धा अनेककोमलकलं गायमाना सन्ति । रूपलावण्ययुताः हंसमयूरादयोऽनेकशो रुचिरा भवन्ति । ते तस्मिन्
    स्थाने रसिकानन्देऽतिमोहनरूपे नित्यं सङ्क्रीडमाना भवन्ति । वृन्दावनेश्वरीनित्यक्रीडाप्रधानं भवति राससखीनां
    समूहेन दशसहस्राणां समेतानां वृषभानोर्गृहम् । वृषभानुपुरं पूर्णानन्दयुतं प्रेमानन्दयुतं सुखसन्ततियुतम्
    । सर्वाः समृद्धयो द्वारे तिष्ठन्ति । अष्टमहासिद्धयो द्वारे द्वारे तिष्ठन्ति । अतितरां सुखसम्पत्तिः
    स्वरूपेण सुसेवते । ये ये विद्यासधर्माणः सुभगाः सुरतकलाकामनिद्रालज्जाप्रेमसुरतोत्कण्ठादयस्ते विराजमाना
    भवन्ति । अधितत्स्थानं निकुञ्जे मध्ये सुगन्धशीतला मणयो ग्रीष्मादिषु ऋतुषु सेव्यरूपाः क्वचित् सुगन्धपारिजाताः
    केचिद्वृक्षाश्चम्पकाः सदापुष्पिताः सदा सुकोमलैः पत्रैर्विराजन्ते सुगन्धाः । केचिद्वृक्षाः पक्वफलसुगन्धरसयुक्ता
    विराजमाना आसते । केचिल्लताप्रकीर्णाः अतितरां सुगन्धयुताः । आमोदगन्धलुब्धा भ्रमरा मुदा गायन्ति । काश्चिद्गोप्यस्तत्र
    मज्जन्त्य आसते । काश्चिद्गोप्यस्तस्यां वस्त्रालङ्करणैर्भूष्याचक्रुः । काश्चिद्गोप्यः प्रेमासक्ता राधारसिकानन्दाभ्यां
    भोजनं चक्रुः । काशिद्गोप्यो दोलां ताभ्यां सह दोलयित्वा गायमाना आसन् । मुदा काश्चिद्गोप्यस्तच्चित्रशालायां
    स्वानि स्वानि रूपाणि पश्यन्ति हृष्यन्ति रात्रौ दिवानवरतम् । गोप्यो भावाश्रितास्तद्बाललीलां गायमाना
    भजनं चक्रुः । अप्यासक्ताः प्रेमभजनरूपा आनन्दं विन्दन्ते । ततो गोपास्तथा रसिकानन्दे मग्ना अत्यन्तप्रेमभजनं
    कुर्वते । ये प्रेमभजने निमग्नास्ते तां लीलामापद्यन्त । नित्यलीलाभजनानन्दोऽयं रसोऽनिर्वचनीयः । नन्दयशोदावृषभानुसत्यादयो
    ये भक्तास्ते भजनानन्दं नित्यमनुभवन्त्यतितराम् । भूयो भूयः सुखसौष्ठवमभवत् । एवं गोपा गोप्यस्तन्मयतां
    प्राप्नुवन्ति । तासां मातृभावं प्रपन्ना गोप्यो भजनानन्दे भजनमेव कुर्वाणा आसन् । तासां गृहा दिष्टद्यानादिसुखसमृद्धिसम्पत्तयो
    भवन्त्यानन्दसुखसमृद्धिसिद्धयः । नानाभजनयोग्यान्युपकरणानि तदर्थे सम्पादितानि भवन्ति । गोपगोपिकादीनां
    समृद्धिसुखं तस्य भजनार्थमेव भवति । अतितरां सुखार्थमेव योग्यतापद्यते । अनन्तसुखसम्पत्तितया निकुञ्जदेव्याः
    स्वावेशेन सुखकोट्यानन्दं प्राप्नुवन्ति । अभियन्ति च सुखसंयोग्यताम् । पृथिव्यां भारते क्षेत्रे आनन्दमयो
    लोकः स्वसृष्टिलीलार्थे स्वयमेव प्रकटितः । तस्मिन् व्रजलोके सर्वा एव लीलाः सन्ति । ये गोपा गोप्यस्ते
    आधिदैविकीं लीलामतितरां संसिद्धा अनुभवन्ति । सा लक्ष्मीरुवाचेदम् । रहस्य इह व्रजमण्डले यानि पृथक्स्थानानि
    तानि ब्रूहि । एकविंशतियोजना भूमिरानन्दमय्येवास्ति । यमुनाया दक्षिणकूलतो महास्थानं पञ्चयोजनायतं विहारस्थानमतितरां
    सूक्ष्मं नित्यविहाररहस्यकेलिकलाविर्भावभावितम् । तस्मिन् स्थाने ये वृक्षाः गृहाणि निकुञ्जा अन्यानि
    विहारस्थानानि तान्याधिदैविकान्यासन् । यो वंशीवटोऽयं साक्षाच्छिवोऽयम् । यो भण्डीरवटः स एव देवेन्द्र
    आसीत् । तत्र स्थिता ये पक्षिणस्ते साधनसिद्धा आसन् । ते निरन्तरं ताभ्यामासन् । ये तत्र मनुष्या आधिदैविकरूपा
    एवासन् ते वृन्दावनेश्वरीसमनुगृहीतास्मदा तां लीलां दर्शयन्ति तदनुग्रहतः । यासामज्ञात्वा ज्ञात्वा वा
    यस्मिन् कस्मिन् भावे भावो भवेत्ता भावेन तां लीलां प्राप्नुवन्ति । यत्र कुत्रापि स्थितोऽपि तद्वृन्दावनोद्भवा
    मृत्तिकां भक्षयेत् । स तव तां लीलां प्राप्नोति । तत्स्थानोद्भवानां वृक्षाणां पुष्पमालां ये कण्ठे धारयन्ति
    ते सर्वकृत्यं विधूय तां लीलां प्राप्नुवन्ति । सदा तां लीलां गायमानास्तां लीलां प्राप्ता एव सन्ति ।
    यैः प्रतिक्षणं वृन्दावनं स्मर्यते न कृतार्थतां प्राप्नुवन्त्यतितराम् । अस्यामाधिदैविकी लीलां प्राप्तास्तां
    लीलां गायन्ति ध्यायन्ति । स्नेहासक्ता ये तस्मिन् स्थले निवसन्ति तै पूर्वं तत्सृष्ट्युत्पन्ना एव सन्ति
    नान्यत्र । तस्मिन् वृन्दावने गोवर्धनोऽयं पर्वतः पञ्चयोजनायतः । त्रीणि योजनान्यच्छिद्रितसप्तश
