id: navagrahapidaharastotram-2
category: stotram
name:
  english: navagrahapidaharastotram 2
  devanagari: नवग्रहपीडाहरस्तोत्रम् २
content:
  english: brihaspatih sadakalamishanarcanatatparah || 7|| so'pi me shantacittena paramena samahitah |
    grahapidam vinirjitya karotu vijayam sada || 8|| himakundendutulyabhah suradaityendrapujitah | shukrah
    shivarcanarato grahapidam vyapohatu || 9|| bhinnanjanacayacchayah saraktanayanadyutih | shanaishcarah
    shivebhakto grahapidam vyapohatu || 10|| nilanjananibhah shriman saihikeyo mahabalah | shivapujaparo
    rahugrahapida vyapohatu || 11|| dhumrakaro grahah keturaishanyam dishi samsthitah | vartulo'tiva vistirnalocanaishca
    vibhishanah || 12|| palashadhumrasankasho grahapida'pakarakah | ghoradamshtrakaralashca karotu vijayam
    mama || 13|| khadgakhetakahastashca varenyo varadah shubhah | shivabhaktashca'grajanma grahapidam
    vyapohatu || 14|| ete graha mahatmano mahesharcanabhavitah | shantim kurvantu me hrishtah sadakalam
    hitaishinah || 15|| || iti navagrahapidaharastotram
  devanagari: बृहस्पतिः सदाकालमीशानार्चनतत्परः ॥ ७॥ सोऽपि मे शान्तचित्तेन परमेण समाहितः । ग्रहपीडां विनिर्जित्य
    करोतु विजयं सदा ॥ ८॥ हिमकुन्देन्दुतुल्याभः सुरदैत्येन्द्रपूजितः । शुक्रः शिवार्चनरतो ग्रहपीडां व्यपोहतु
    ॥ ९॥ भिन्नाञ्जनचयच्छायः सरक्तनयनद्युतिः । शनैश्चरः शिवेभक्तो ग्रहपीडां व्यपोहतु ॥ १०॥ नीलाञ्जननिभः
    श्रीमान् सैहिकेयो महाबलः । शिवपूजापरो राहुग्रहपीडा व्यपोहतु ॥ ११॥ धूम्राकारो ग्रहः केतुरैशान्यां दिशि
    संस्थितः । वर्तुलोऽतीव विस्तीर्णलोचनैश्च विभीषणः ॥ १२॥ पलाशधूम्रसङ्काशो ग्रहपीडाऽपकारकः । घोरदंष्ट्राकरालश्च
    करोतु विजयं मम ॥ १३॥ खड्गखेटकहस्तश्च वरेण्यो वरदः शुभः । शिवभक्तश्चाऽग्रजन्मा ग्रहपीडां व्यपोहतु ॥
    १४॥ एते ग्रहा महात्मानो महेशार्चनभाविताः । शान्तिं कुर्वन्तु मे हृष्टाः सदाकालं हितैषिणः ॥ १५॥ ॥ इति
    नवग्रहपीडाहरस्तोत्रं
meaning: {}
