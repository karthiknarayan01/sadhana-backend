id: sare-jahan-se-accha
category: stotram
name:
  english: Sare Jahan Se Accha
content:
  english: sare jahasè accha hindustan hamara ham bul bule hai is ye gul sita hamara|| parabat vo sab
    se uncha ham man ka vo santari hamara ba hamara|| godime khel na hindi hai ham vatan hai hindustan
    hamara||
  devanagari: सारे जहासॆ अच्छा हिन्दुस्तान् हमारा हं बुल् बुले है इस् ये गुल् सिता हमारा॥ परबत् वो सब्
    से ऊञ्छा हम् मान् का वो सन्तरी हमारा बा हमारा॥ गोदिमे खेल् ना हिन्दी है हं वतन् है हिन्दुस्तान् हमारा॥
