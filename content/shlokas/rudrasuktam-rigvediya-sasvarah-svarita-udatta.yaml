id: rudrasuktam-rigvediya-sasvarah-svarita-udatta
category: sukta
name:
  english: rudrasuktam rigvediya (sasvarah svarita udatta)
  devanagari: रुद्रसूक्तम् ऋग्वेदीय (सस्वरः स्वरित उदात्त)
content:
  english: 12|| om shanti̱h shanti̱h shanti̭h || || harih om || nihsvarah || om shrigurubhyo namah ||
    || harih om || kadrudraya pracetase miḻhushtamaya tavyase | vocema shamtamam hride || 1
  devanagari: १२॥ ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑ ॥ ॥ हरिः ॐ ॥ निःस्वरः ॥ ॐ श्रीगुरुभ्यो नमः ॥ ॥ हरिः ॐ ॥
    कद्रुद्राय प्रचेतसे मीळ्हुष्टमाय तव्यसे । वोचेम शंतमं हृदे ॥ १
meaning: {}
