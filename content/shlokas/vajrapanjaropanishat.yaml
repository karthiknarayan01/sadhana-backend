id: vajrapanjaropanishat
category: upanishad
name:
  english: vajrapanjaropanishat
  devanagari: वज्रपन्जरोपनिषत्
content:
  english: nabhyadijanvantam | om hrim shrim pashu hum phat svaha janvadipadaparyantam | om hrim sphura
    sphura prasphura prasphurarupa tata tata cata cata pracata pracata kaha kaha vama vama bandhaya bandhaya
    ghataya ghataya hum phat svaha hatyaghorena shirasi | om vaishnavyai namo hridaye | punah aghorena
    prishthe | punah sudarshanena janvadinabhyantam | punah pashupatena padadijanvantam | hsauh a am ksham
    shauh | om hrim klim kshraum shrim || ugram viram mahavipnum jvalantam sarvatomukham | nrisimham bhishanam
    bhadram mrityumrityum namamyaham || shrim kshraum shrim hrim om iti dakshinabahau | om ksham om namo
    bhagavate narasimhaya jvalamaline tikshnadamshtragninetraya sarvarakshoghnaya sarvajvaravinashaya
    sarvabhutavinashaya daha daha paca paca raksha raksha hum phat svaha iti vamabahau | uttishtha purusha
    haritapingaḻa lohitaksha dehi me dapaya svaha | om hrim dum uttishtha purushi kim svapishi bhayam
    me samupasthitam | yadi shakyamashakyam va te bhagavati shamaya shamaya svaha || mrityostulyam trilokim
    grasitumatirasannissrita kim nu jihva kim va krishnanghripadmasritibhirarunita vishnupadyah padavyah
    | praptah sandhyah smarareh svayamuta nutibhistisra ityuhyamanah devairdevyastrishulakshatamahishajusho
    raktadhara jayanti || iti badabanaladurgamrityostulyavanadurgabhih sarvangamuddhuḻayet | tatah sheshabhasmani
    jalam nikshipya tripundradharanam kuryat | eta eva mahavidya vibhuterabhidharane | kathitah parameshani
    satam purvataraghahah || vajrapanjaranamnaiva yah kuryadbhasmadharanam | sa sarvabhayanirmuktah sakshacchivamayo
    bhavet | putani tani shrimantrapavitre yani bhasmani || dagdhakamangavibhutitraipundritani kathitani
    lalatapatte lopayanti daivalikhitani duraksharani ||
  devanagari: नाभ्यादिजान्वन्तम् । ॐ ह्रीं श्रीं पशु हुं फट् स्वाहा जान्वादिपादपर्यन्तम् । ॐ ह्रीं स्फुर
    स्फुर प्रस्फुर प्रस्फुररूप तट तट चट चट प्रचट प्रचट कह कह वम वम बन्धय बन्धय घातय घातय हुं फट् स्वाहा
    हत्यघोरेण शिरसि । ॐ वैष्णव्यै नमो हृदये । पुनः अघोरेण पृष्ठे । पुनः सुदर्शनेन जान्वादिनाभ्यन्तम् ।
    पुनः पाशुपतेन पादादिजान्वन्तम् । ह्सौः अ अं क्षं शौः । ॐ ह्रीं क्लीं क्ष्रौं श्रीं ॥ उग्रं वीरं महाविप्णुं
    ज्वलन्तं सर्वतोमुखम् । नृसिंहं भीषणं भद्रं मृत्युमृत्युं नमाम्यहम् ॥ श्रीं क्ष्रौं श्रीं ह्रीं ॐ इति
    दक्षिणबाहौ । ॐ क्षां ॐ नमो भगवते नारसिंहाय ज्वालामालिने तीक्ष्णदंष्ट्राग्निनेत्राय सर्वरक्षोघ्नाय
    सर्वज्वरविनाशाय सर्वभूतविनाशाय दह दह पच पच रक्ष रक्ष हुं फट् स्वाहा इति वामबाहौ । उत्तिष्ठ पुरुष हरितपिङ्गळ
    लोहिताक्ष देहि मे दापय स्वाहा । ॐ ह्रीं दुं उत्तिष्ठ पुरुषि किं स्वपिषि भयं मे समुपस्थितम् । यदि शक्यमशक्यं
    वा ते भगवति शमय शमय स्वाहा ॥ मृत्योस्तुल्यं त्रिलोकीं ग्रसितुमतिरसान्निस्सृता किं नु जिह्वा किं वा
    कृष्णाङ्घ्रिपद्मसृतिभिररुणिता विष्णुपद्याः पदव्यः । प्राप्ताः सन्ध्याः स्मरारेः स्वयमुत नुतिभिस्तिस्र
    इत्यूह्यमानाः देवैर्देव्यास्त्रिशूलक्षतमहिषजुषो रक्तधारा जयन्ति ॥ इति बडबानलदुर्गामृत्योस्तुल्यवनदुर्गाभिः
    सर्वाङ्गमुद्धूळयेत् । ततः शेषभस्मनि जलं निक्षिप्य त्रिपुण्ड्रधारणं कुर्यात् । एता एव महाविद्या विभूतेरभिधारणे
    । कथिताः परमेशानि सतां पूर्वतराघहाः ॥ वज्रपञ्जरनाम्नैव यः कुर्याद्भस्मधारणम् । स सर्वभयनिर्मुक्तः
    साक्षाच्छिवमयो भवेत् । पूतानि तानि श्रीमन्त्रपवित्रे यानि भस्मनि ॥ दग्धकामाङ्गविभूतित्रैपुण्ड्रितानि
    कथितानि ललाटपट्टे लोपयन्ति दैवलिखितानि दुरक्षराणि ॥
