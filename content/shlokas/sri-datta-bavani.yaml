id: sri-datta-bavani
category: stotram
name:
  english: Sri Datta Bavani
content:
  english: shri ranga avadhuta svami viracita shri dattabhavani jaya yogishvara datta dayala | tu ja eka
    jagamam pratipala || || atryanasuya kari nimitta | pragatyo jagakarana nishcita || || brahma'hariharano
    avatara | sharanagatano taranahara || || antaryami satacitasukha | bahara sadguru dvibhuja sumukh
    || || jholi annapurna karamahya | shanti kamandala kara sohaya || || kyaya caturbhuja shadabhuja sara
    | anantabahu tu nirdhara || || avyo sharane bala ajana | utha digambara calya prana || || suni arjuna
    kero sada | rijhyo purve tu sakshata || || didhi riddhi siddhi apara | ante mukti mahapada sara ||
    || kidho aje kema vilamba | tujavina mujane na alamba || || vishnusharma dvija taryo ema | jamyo shraddhmam
    dekhi prema || || jambhadaityathi trasya deva | kidhi mhera te tyam tatakheva || || vistari maya ditisuta
    | indra kare hanabyo turta || || evi lila ka i ka i sarva | kidhi varnave ko te sharva || || dodyo
    ayu sutane kama | kidho ene te nishkama || || bodhya yadune parashurama | sadhyadeva prahlada akama
    || || evi tari kripa agadha | kema sune na maro sada || || doda anta na dekha ananta | ma kara adhavaca
    shishuno anta || || joi dvija stri kero sneha | thayo putra tu nisandeha || || smartrigami kalikala
    kripala | taryo dhobi cheka gamara || || peta pidathi taryo vipra | brahmana shetha ugaryo kshipra
    || || kare kema na maro vhara | jo ani gama ekaja vara || || shushka kashthane amnya patra | thayo
    kema udasina atra || || jarjara vandhya keram svapna | karya saphala te sutana kritsna || || kari
    dura brahmanano kodha | kidha purana ena koda || || vandhya bhaimsa dujhavi deva | haryu daridrya
    te tatakheva || || jhalara khayi rijhayo ema | didho suvarna ghata saprema || || brahmana strino mrita
    bharatara | kidho sanjivana te nirdhara || || pishaca pida kidhi dura | vipraputra uthadyo shura ||
    || hari vipra maja antyaja hatha | raksho bhakti trivikrama tata || || nimesha matre tantuka eka |
    pahocyado shri shaila dekha || || eki sathe atha svarupa | dhari deva bahurupa arupa || || santoshya
    nija bhakta sujata | api paracao sakshata || || yavanarajani tali pida | jatapatani tane na cida ||
    || ramakrishnarupe te ema | kidhi lilao ki tema || || tarya patthara ganika vyadha | pashupankhipana
    tujane sadha || || adhama odharana taru nama | gata sare na sha sha kama || || adhi vyadhi upadhi
    sarva | tale smaranamatrathi sharva || || mutha cota na lage jana | pame nara smarane nirvana || ||
    dakana shakana bhemsasura | bhuta pishaco janda asura || || nase muthi dine turta | datta dhuna sambhalata
    murta || || kari dhupa gaye je ema | dattabavani a saprema || || sudhare tena banne loka | rahe na
    tene kyamye shoka || || dasi siddhi teni thaya | duhkha daridrya tena jaya || || bavana guruvare nita
    nema | kare patha bavana saprema || || yathavakashe nitya niyama | tene kadhi na dande yama || ||
    aneka rupe eja abhanga | bhajata nade na maya ranga || || sahasra name nami eka | datta digambara
    asanga cheka || || vandu tujane varamvara | veda shvasa tara nirdhara || || thake varnavatam jyam
    shesha | kona ranka hum bahukrita vesha || || anubhava triptino udgara | suni hamshe te khashe mara
    || || tapasi tattvamasi e deva | bolo jaya jaya shri gurudeva || || || avadhuta cintana shri gurudeva
    datta ||
  devanagari: श्री रङ्ग अवधूत स्वामि विरचित श्री दत्तभवानी जय योगीश्वर दत्त दयाल । तु ज एक जगमां प्रतिपाल
    ॥ ॥ अत्र्यनसूया करी निमित्त । प्रगट्यो जगकारण निश्चित ॥ ॥ ब्रह्माऽहरिहरनो अवतार । शरणागतनो तारणहार
    ॥ ॥ अन्तर्यामि सतचितसुख । बहार सद्गुरु द्विभुज सुमुख् ॥ ॥ झोली अन्नपुर्णा करमाह्य । शान्ति कमन्डल
    कर सोहाय ॥ ॥ क्याय चतुर्भुज षडभुज सार । अनन्तबाहु तु निर्धार ॥ ॥ आव्यो शरणे बाल अजाण । उठ दिगम्बर
    चाल्या प्राण ॥ ॥ सुणी अर्जुण केरो साद । रिझ्यो पुर्वे तु साक्शात ॥ ॥ दिधी रिद्धि सिद्धि अपार । अन्ते
    मुक्ति महापद सार ॥ ॥ किधो आजे केम विलम्ब । तुजविन मुजने ना आलम्ब ॥ ॥ विष्णुशर्म द्विज तार्यो एम ।
    जम्यो श्राद्ध्मां देखि प्रेम ॥ ॥ जम्भदैत्यथी त्रास्या देव । किधि म्हेर ते त्यां ततखेव ॥ ॥ विस्तारी
    माया दितिसुत । इन्द्र करे हणाब्यो तुर्त ॥ ॥ एवी लीला क इ क इ सर्व । किधी वर्णवे को ते शर्व ॥ ॥ दोड्यो
    आयु सुतने काम । किधो एने ते निष्काम ॥ ॥ बोध्या यदुने परशुराम । साध्यदेव प्रह्लाद अकाम ॥ ॥ एवी तारी
    कृपा अगाध । केम सुने ना मारो साद ॥ ॥ दोड अन्त ना देख अनन्त । मा कर अधवच शिशुनो अन्त ॥ ॥ जोइ द्विज
    स्त्री केरो स्नेह । थयो पुत्र तु निसन्देह ॥ ॥ स्मर्तृगामि कलिकाल कृपाल । तार्यो धोबि छेक गमार ॥ ॥
    पेट पिडथी तार्यो विप्र । ब्राह्मण शेठ उगार्यो क्षिप्र ॥ ॥ करे केम ना मारो व्हार । जो आणि गम एकज वार
    ॥ ॥ शुष्क काष्ठणे आंण्या पत्र । थयो केम उदासिन अत्र ॥ ॥ जर्जर वन्ध्या केरां स्वप्न । कर्या सफल ते
    सुतना कृत्स्ण ॥ ॥ करि दुर ब्राह्मणनो कोढ । किधा पुरण एना कोड ॥ ॥ वन्ध्या भैंस दुझवी देव । हर्यु दारिद्र्य
    ते ततखेव ॥ ॥ झालर खायि रिझयो एम । दिधो सुवर्ण घट सप्रेम ॥ ॥ ब्राह्मण स्त्रिणो मृत भरतार । किधो सञ्जीवन
    ते निर्धार ॥ ॥ पिशाच पिडा किधी दूर । विप्रपुत्र उठाड्यो शुर ॥ ॥ हरि विप्र मज अन्त्यज हाथ । रक्षो भक्ति
    त्रिविक्रम तात ॥ ॥ निमेष मात्रे तन्तुक एक । पहोच्याडो श्री शैल देख ॥ ॥ एकि साथे आठ स्वरूप । धरि देव
    बहुरूप अरूप ॥ ॥ सन्तोष्या निज भक्त सुजात । आपि परचाओ साक्षात ॥ ॥ यवनराजनि टाली पीड । जातपातनि तने
    न चीड ॥ ॥ रामकृष्णरुपे ते एम । किधि लिलाओ की तेम ॥ ॥ तार्या पत्थर गणिका व्याध । पशुपङ्खिपण तुजने साध
    ॥ ॥ अधम ओधारण तारु नाम । गात सरे न शा शा काम ॥ ॥ आधि व्याधि उपाधि सर्व । टले स्मरणमात्रथी शर्व ॥ ॥
    मुठ चोट ना लागे जाण । पामे नर स्मरणे निर्वाण ॥ ॥ डाकण शाकण भेंसासुर । भुत पिशाचो जन्द असुर ॥ ॥ नासे
    मुठी दीने तुर्त । दत्त धुन साम्भालता मुर्त ॥ ॥ करी धूप गाये जे एम । दत्तबावनि आ सप्रेम ॥ ॥ सुधरे तेणा
    बन्ने लोक । रहे न तेने क्यांये शोक ॥ ॥ दासि सिद्धि तेनि थाय । दुःख दारिद्र्य तेना जाय ॥ ॥ बावन गुरुवारे
    नित नेम । करे पाठ बावन सप्रेम ॥ ॥ यथावकाशे नित्य नियम । तेणे कधि ना दण्डे यम ॥ ॥ अनेक रुपे एज अभङ्ग
    । भजता नडे न माया रङ्ग ॥ ॥ सहस्र नामे नामि एक । दत्त दिगम्बर असङ्ग छेक ॥ ॥ वन्दु तुजने वारंवार । वेद
    श्वास तारा निर्धार ॥ ॥ थाके वर्णवतां ज्यां शेष । कोण राङ्क हुं बहुकृत वेष ॥ ॥ अनुभव तृप्तिनो उद्गार
    । सुणि हंशे ते खाशे मार ॥ ॥ तपसि तत्त्वमसि ए देव । बोलो जय जय श्री गुरुदेव ॥ ॥ ॥ अवधूत चिन्तन श्री
    गुरुदेव दत्त ॥
