id: devaihkritam04durgastotram-13
category: stotram
name:
  english: devaihkritam04durgastotram 13
  devanagari: देवैःकृतं०४दुर्गास्तोत्रम् १३
content:
  english: devaih kritam 4 durgastotram 13 deva ucuh | devi prapannartihare prasida prasida matarjagato'khilasya
    | prasida vishveshvari pahi vishvam tvamishvari devi caracarasya || 2|| adharabhuta jagatastvameka
    mahisvarupena yatah sthitasi | apam svarupasthitaya tvayaitadapyayate kritstramalanghyavirye || 3||
    tvam vaishnavi shaktiranantavirya vishvasya bijam paramasi maya | sammohitam devi samastamettvam vai
    prasanna bhuvi muktihetuh || 4|| vidyah samastastava devi bhedah striyah samastah sakala jagatsu |
    tvayaikaya puritamambayaitat ka te stutih stavyapara paroktih || 5|| sarvabhuta yada devi svargamuktipradayini
    | tvam stuta stutaye ka va bhavantu paramoktayah || 6|| sarvasya buddhirupena janasya hridi samsthite
    | svargapavargade devi narayani namo'stu te || 7|| kalakashthadirupena parinamapradayini | vishvasyoparatau
    shakte narayani namo'stu te || 8|| sarvamangalamangalye shive sarvarthasadhike | sharanye tryambake
    gauri narayani namo'stu te || 9|| srishtisthitivinashanam shaktibhute sanatani | gunashraye gunamaye
    narayani namo'stu te || 10|| sharanagatadinartaparitranaparayane | sarvasyartihare devi narayani namo'stu
    te || 11|| hamsayuktavimanasthe brahmanirupadharini | kaushambhahksharike devi narayani namo'stu te
    || 12|| trishulacandrahidhare mahavrishabhavahini | maheshvarisvarupena narayani namo'stu te || 13||
    mayurakukkutavrite mahashaktidhare'naghe | kaumarirupasamsthane narayani namo'stu te || 14|| shankhacakragadasharngagrihitaparamayudhe
    | prasida vaishnavirupe narayani namo'stu te || 15|| grihitogramahacakre damshtroddhritavasundhare
    | varaharupini shive narayani namo'stu te || 16|| nrisimharupenogrena hantum daityan kritodyame |
    trailokyatranasahite narayani namo'stu te || 17|| kiritini mahavajre sahasranayanojjvale | vritrapranahare
    caindri narayani namo'stu te || 18|| shivadutisvarupena hatadaityamahabale | ghorarupe maharave narayani
    namo'stu te || 19|| damshtrakaralavadane shiromalavibhushane | camunde mundamathane narayani namo'stu
    te || 20|| lakshmi lajje mahavidye shraddhe pushte svadhe dhruve | maharatre mahamaye narayani namo'stu
    te || 21|| medhe sarasvati vare bhuti babhravi tamasi | niyate tvam prasideshe narayani namo'stu te
    || 22|| sarvatah panipadante sarvato'kshishiromukhe | sarvatah shravanaghrane narayani namo'stu te
    || 23|| sarvasvarupe sarveshe sarvashaktisamanvite | bhayebhyastrahi no devi durge devi namo'stu te
    || 24|| etatte vadanam saumyam locanatrayabhushitam | patu nah sarvabhitibhyah katyayani namo'stu
    te || 25|| jvalakaralamatyugramasheshasurasudanam | trishulam patu no bhiterbhadrakali namo'stute
    || 26|| hinasti daityatejamsi svanenapurya ya jagat | sa ghanta patu no devi papebhyo nah sutaniva
    || 27|| asurasrigvasapankacarcitaste karojjvalah | shubhaya khadgo bhavatu candike tvam nata vayam
    || 28|| roganasheshanapahamsi tushta rushta tu kaman sakalanabhishtan | tvamashritanam na vipannaranam
    tvamashrita hyashrayatam prayanti || 29|| etatkritam yatkadanam tvayadya dharmadvisham devi mahasuranam
    | rupairanekairbahudha'tmamurtim kritvambike tatprakaroti kanya || 30|| vidyasu shastreshu vivekadipeshvadyeshu
    vakyeshu ca ka tvadanya | mamatvagarte'timahandhakare vibhramayatyetadativa vishvam || 31|| rakshamsi
    yatrogravishashca naga yatrarayo dasyubalani yatra | davanalo yatra tathabdhimadhye tatra sthita tvam
    paripasi vishvam || 32|| vishveshvari tvam paripasi vishvam vishvatmika dharayasiti vishvam | vishveshavandya
    bhavati bhavanti vishvashraya ye tvayi bhaktinamrah || 33|| devi prasida paripalaya no'ribhiternityam
    yathasuravadhadadhunaiva sadyah | papani sarvajagatam prashamam nayashu utpatapakajanitamshca mahopasargan
    || 34|| pranatanam prasida tvam devi vishvartiharini | trailokyavasinamidye lokanam varada bhava ||
    35|| iti markandeyapurane ekanavatitamadhyayantargatam devaih kritam durgastotram samaptam | markandeyapurana
    | adhyaya 88|| 91
  devanagari: देवैः कृतं ४ दुर्गास्तोत्रम् १३ देवा ऊचुः । देवि प्रपन्नार्तिहरे प्रसीद प्रसीद मातर्जगतोऽखिलस्य
    । प्रसीद विश्वेश्वरि पाहि विश्वं त्वमीश्वरी देवि चराचरस्य ॥ २॥ आधारभूता जगतस्त्वमेका महीस्वरूपेण यतः
    स्थितासि । अपां स्वरूपस्थितया त्वयैतदाप्यायते कृत्स्त्रमलङ्घ्यवीर्ये ॥ ३॥ त्वं वैष्णवी शक्तिरनन्तवीर्या
    विश्वस्य बीजं परमासि माया । सम्मोहितं देवि समस्तमेत्त्वं वै प्रसन्ना भुवि मुक्तिहेतुः ॥ ४॥ विद्याः
    समस्तास्तव देवि भेदाः स्त्रियः समस्ताः सकला जगत्सु । त्वयैकया पूरितमम्बयैतत् का ते स्तुतिः स्तव्यपरा
    परोक्तिः ॥ ५॥ सर्वभूता यदा देवी स्वर्गमुक्तिप्रदायिनी । त्वं स्तुता स्तुतये का वा भवन्तु परमोक्तयः
    ॥ ६॥ सर्वस्य बुद्धिरूपेण जनस्य हृदि संस्थिते । स्वर्गापवर्गदे देवि नारायणि नमोऽस्तु ते ॥ ७॥ कलाकाष्ठादिरूपेण
    परिणामप्रदायिनी । विश्वस्योपरतौ शक्ते नारायणि नमोऽस्तु ते ॥ ८॥ सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थसाधिके
    । शरण्ये त्र्यम्बके गौरि नारायणि नमोऽस्तु ते ॥ ९॥ सृष्टिस्थितिविनाशानां शक्तिभूते सनातनि । गुणाश्रये
    गुणमये नारायणि नमोऽस्तु ते ॥ १०॥ शरणागतदीनार्तपरित्राणपरायणे । सर्वस्यार्तिहरे देवि नारायणि नमोऽस्तु
    ते ॥ ११॥ हंसयुक्तविमानस्थे ब्रह्माणीरूपधारिणि । कौशाम्भःक्षरिके देवि नारायणि नमोऽस्तु ते ॥ १२॥ त्रिशूलचन्द्राहिधरे
    महावृषभवाहिनि । माहेश्वरीस्वरूपेण नारायणि नमोऽस्तु ते ॥ १३॥ मयूरकुक्कुटवृते महाशक्तिधरेऽनघे । कौमारीरूपसंस्थाने
    नारायणि नमोऽस्तु ते ॥ १४॥ शङ्खचक्रगदाशार्ङ्गगृहीतपरमायुधे । प्रसीद वैष्णवीरूपे नारायणि नमोऽस्तु ते
    ॥ १५॥ गृहीतोग्रमहाचक्रे दंष्ट्रोद्धृतवसुन्धरे । वराहरूपिणि शिवे नारायणि नमोऽस्तु ते ॥ १६॥ नृसिंहरूपेणोग्रेण
    हन्तुं दैत्यान् कृतोद्यमे । त्रैलोक्यत्राणसहिते नारायणि नमोऽस्तु ते ॥ १७॥ किरीटिनि महावज्रे सहस्रनयनोज्ज्वले
    । वृत्रप्राणहरे चैन्द्रि नारायणि नमोऽस्तु ते ॥ १८॥ शिवदूतीस्वरूपेण हतदैत्यमहाबले । घोररूपे महारावे
    नारायणि नमोऽस्तु ते ॥ १९॥ दंष्ट्राकरालवदने शिरोमालाविभूषणे । चामुण्डे मुण्डमथने नारायणि नमोऽस्तु ते
    ॥ २०॥ लक्ष्मि लज्जे महाविद्ये श्रद्धे पुष्टे स्वधे ध्रुवे । महारात्रे महामाये नारायणि नमोऽस्तु ते
    ॥ २१॥ मेधे सरस्वति वरे भूति बाभ्रवि तामसि । नियते त्वं प्रसीदेशे नारायणि नमोऽस्तु ते ॥ २२॥ सर्वतः
    पाणिपादान्ते सर्वतोऽक्षिशिरोमुखे । सर्वतः श्रवणघ्राणे नारायणि नमोऽस्तु ते ॥ २३॥ सर्वस्वरूपे सर्वेशे
    सर्वशक्तिसमन्विते । भयेभ्यस्त्राहि नो देवि दुर्गे देवि नमोऽस्तु ते ॥ २४॥ एतत्ते वदनं सौम्यं लोचनत्रयभूषितम्
    । पातु नः सर्वभीतिभ्यः कात्यायनि नमोऽस्तु ते ॥ २५॥ ज्वालाकरालमत्युग्रमशेषासुरसूदनम् । त्रिशूलं पातु
    नो भीतेर्भद्रकालि नमोऽस्तुते ॥ २६॥ हिनस्ति दैत्यतेजांसि स्वनेनापूर्य या जगत् । सा घण्टा पातु नो देवि
    पापेभ्यो नः सुतानिव ॥ २७॥ असुरासृग्वसापङ्कचर्चितस्ते करोज्ज्वलः । शुभाय खड्गो भवतु चण्डिके त्वां नता
    वयम् ॥ २८॥ रोगानशेषानपहंसि तुष्टा रुष्टा तु कामान् सकलानभीष्टान् । त्वामाश्रितानां न विपन्नराणां त्वामाश्रिता
    ह्याश्रयतां प्रयान्ति ॥ २९॥ एतत्कृतं यत्कदनं त्वयाद्य धर्मद्विषां देवि महासुराणाम् । रूपैरनेकैर्बहुधाऽत्ममूर्तिं
    कृत्वाम्बिके तत्प्रकरोति कान्या ॥ ३०॥ विद्यासु शास्त्रेषु विवेकदीपेष्वाद्येषु वाक्येषु च का त्वदन्या
    । ममत्वगर्तेऽतिमहान्धकारे विभ्रामयत्येतदतीव विश्वम् ॥ ३१॥ रक्षांसि यत्रोग्रविषाश्च नागा यत्रारयो दस्युबलानि
    यत्र । दावानलो यत्र तथाब्धिमध्ये तत्र स्थिता त्वं परिपासि विश्वम् ॥ ३२॥ विश्वेश्वरि त्वं परिपासि विश्वं
    विश्वात्मिका धारयसीति विश्वम् । विश्वेशवन्द्या भवती भवन्ति विश्वाश्रया ये त्वयि भक्तिनम्राः ॥ ३३॥
    देवि प्रसीद परिपालय नोऽरिभीतेर्नित्यं यथासुरवधादधुनैव सद्यः । पापानि सर्वजगतां प्रशमं नयाशु उत्पातपाकजनितांश्च
    महोपसर्गान् ॥ ३४॥ प्रणतानां प्रसीद त्वं देवि विश्वार्तिहारिणी । त्रैलोक्यवासिनामीड्ये लोकानां वरदा
    भव ॥ ३५॥ इति मार्कण्डेयपुराणे एकनवतितमाध्यायान्तर्गतं देवैः कृतं दुर्गास्तोत्रं समाप्तम् । मार्कण्डेयपुराण
    । अध्याय ८८॥ ९१
