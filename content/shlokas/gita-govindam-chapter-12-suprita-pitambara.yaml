id: gita-govindam-chapter-12-suprita-pitambara
category: stotram
name:
  english: Gita Govindam Chapter 12 - Suprita Pitambara
content:
  english: '|| dvadashah sargah || || supritapitambarah || gatavati sakhivrinde''mandatrapabharanirbhara
    smaraparavashakutasphitasmitasnapitadharam | sarasamanasam drishtva radham muhurnavapallava prasavashayane
    nikshiptakshimuvaca harah || || kisalayashayanatale kuru kamini carananalinavinivesham | tava padapallavavairiparabhavamidamanubhavatu
    suvesham || kshanamadhuna narayanamanugatamanusara radhike || || karakamalena karomi caranamahamagamitasi
    viduram | kshanamupakuru shayanopari mamiva nupuramanugatishuram || || vadanasudhanidhigalitamamritamiva
    racaya vacanamanukulam | virahamivapanayami payodhararodhakamurasi dukulam || || priyaparirambhanarabhasavalitamiva
    pulakitamatiduravapam | madurasi kucakalasham viniveshaya shoshaya manasijatapam || || adharasudharasamupanaya
    bhavini jivaya mritamiva dasam | tvayi vinihitamanasam virahanaladagdhavapushamavilasam || || shashimukhi
    mukharaya manirashanagunamanugunakanthanidanam | shrutiyugale pikarutavikale mama shamaya ciradavasadam
    || || mamativiphalarusha vikalikritamavalokitamadhunedam | militalajjitamiva nayanam tava virama visrija
    ratikhedam || || shrijayadevabhanitamidamanupadanigaditamadhuripumodam | janayatu rasikajaneshu manoramatirasabhavavinodam
    || || maranke ratikelisankularanarambhe taya sahasa prayam kantajayaya kincidupari prarambhi yatsambhramat
    | nishpanda jaghanasthali shithilata dorvallirutkampitam vaksho militamakshi paurusharasah strinam
    kutah sidhyati || || atha kantam ratiklantamapi mandanavanchaya | nijagada nirabadha radha svadhinabhartrika
    || || kuru yadunandana candanashishiratarena karena payodhare | mrigamadapatrakamatra manobhavamangalakalashasahodare
    | nijagada sa yadunandane kridati hridayanandane || || alikulaganjanamanjanakam ratinayakasayakamocane
    | tvadadharacumbanalambitakajjalamujjvalaya priya locane || || nayanakurangatarangavikasanirasakare
    shrutimandale | manasijapashavilasadhare shubhavesha niveshaya kundale || || bhramaracayam racahayantamupari
    ruciram suciram mama sammukhe | jitakamale vimale parikarmaya narmajanakamalakam mukhe || || mrigamadarasavalitam
    lalitam kuru tilakamalikarajanikare | vihitakalankakalam kamalanana vishramitashramashikare || ||
    mama rucire cikure kuru manada manasajadhvajacamare | ratigalite lalite kusumani shikhandishikhandakadamare
    || || sarasaghane jaghane mama shambaradaranavaranakandare | manirashanavasanabharanani shubhashaya
    vasaya sundare || || shrijayadevavacasi rucire hridayam sadayam kuru mandane | haricaranasmaranamritakritakalikalushabhavajvarakhandane
    || || racaya kucayoh patram citram kurushva kapolayo rghataya jaghane kancimanca sraja kabaribharam
    | kalaya valayashrenim panau pade kuru nupura viti nigatitah pritah pitambaro''pi tathakarot || ||
    yadgandhgarvakalasu kaushalamanudhyanam ca yadvaishnavam yacchringaravivekatatvamapi yatkavyeshu lilayitam
    | tatsarvam jayadevapanditakaveh krishnaikatanatmanah sanandah parishodhayantu sudhiyah shrigitagovindatah
    || || shribhojadevaprabhavasya ramadevisutashrijayadevakasya | parasharadipriyavargakanthe shrigitagovindakavitvamastu
    || || || iti shrijayadevakritau gitagovinde supritapitambaro nama dvadashah sargah || || iti gitagovindam
    samaptam ||'
  devanagari: ॥ द्वादशः सर्गः ॥ ॥ सुप्रीतपीताम्बरः ॥ गतवति सखीवृन्देऽमन्दत्रपाभरनिर्भर स्मरपरवशाकूतस्फीतस्मितस्नपिताधरम्
    । सरसमनसं दृष्ट्वा राधां मुहुर्नवपल्लव प्रसवशयने निक्षिप्ताक्षीमुवाच हरः ॥ ॥ किसलयशयनतले कुरु कामिनि
    चरणनलिनविनिवेशम् । तव पदपल्लववैरिपराभवमिदमनुभवतु सुवेशम् ॥ क्षणमधुना नारायणमनुगतमनुसर राधिके ॥ ॥ करकमलेन
    करोमि चरणमहमागमितासि विदूरम् । क्षणमुपकुरु शयनोपरि मामिव नूपुरमनुगतिशूरम् ॥ ॥ वदनसुधानिधिगलितममृतमिव
    रचय वचनमनुकूलम् । विरहमिवापनयामि पयोधररोधकमुरसि दुकूलम् ॥ ॥ प्रियपरिरम्भणरभसवलितमिव पुलकितमतिदुरवापम्
    । मदुरसि कुचकलशं विनिवेशय शोषय मनसिजतापम् ॥ ॥ अधरसुधारसमुपनय भाविनि जीवय मृतमिव दासम् । त्वयि विनिहितमनसं
    विरहानलदग्धवपुषमविलासम् ॥ ॥ शशिमुखि मुखरय मणिरशनागुणमनुगुणकण्ठनिदानम् । श्रुतियुगले पिकरुतविकले मम
    शमय चिरादवसादम् ॥ ॥ मामतिविफलरुषा विकलीकृतमवलोकितमधुनेदम् । मीलितलज्जितमिव नयनं तव विरम विसृज रतिखेदम्
    ॥ ॥ श्रीजयदेवभणितमिदमनुपदनिगदितमधुरिपुमोदम् । जनयतु रसिकजनेषु मनोरमतिरसभावविनोदम् ॥ ॥ मारङ्के रतिकेलिसङ्कुलरणारम्भे
    तया साहस प्रायं कान्तजयाय किञ्चिदुपरि प्रारम्भि यत्सम्भ्रमात् । निष्पन्दा जघनस्थली शिथिलता दोर्वल्लिरुत्कम्पितं
    वक्षो मीलितमक्षि पौरुषरसः स्त्रीणां कुतः सिध्यति ॥ ॥ अथ कान्तं रतिक्लान्तमपि मण्डनवाञ्छया । निजगाद
    निराबाधा राधा स्वाधीनभर्तृका ॥ ॥ कुरु यदुनन्दन चन्दनशिशिरतरेण करेण पयोधरे । मृगमदपत्रकमत्र मनोभवमङ्गलकलशसहोदरे
    । निजगाद सा यदुनन्दने क्रीडति हृदयानन्दने ॥ ॥ अलिकुलगञ्जनमञ्जनकं रतिनायकसायकमोचने । त्वदधरचुम्बनलम्बितकज्जलमुज्ज्वलय
    प्रिय लोचने ॥ ॥ नयनकुरङ्गतरङ्गविकासनिरासकरे श्रुतिमण्डले । मनसिजपाशविलासधरे शुभवेश निवेशय कुण्डले
    ॥ ॥ भ्रमरचयं रचहयन्तमुपरि रुचिरं सुचिरं मम सम्मुखे । जितकमले विमले परिकर्मय नर्मजनकमलकं मुखे ॥ ॥ मृगमदरसवलितं
    ललितं कुरु तिलकमलिकरजनीकरे । विहितकलङ्ककलं कमलानन विश्रमितश्रमशीकरे ॥ ॥ मम रुचिरे चिकुरे कुरु मानद
    मानसजध्वजचामरे । रतिगलिते ललिते कुसुमानि शिखण्डिशिखण्डकडामरे ॥ ॥ सरसघने जघने मम शम्बरदारणवारणकन्दरे
    । मणिरशनावसनाभरणानि शुभाशय वासय सुन्दरे ॥ ॥ श्रीजयदेववचसि रुचिरे हृदयं सदयं कुरु मण्डने । हरिचरणस्मरणामृतकृतकलिकलुषभवज्वरखण्डने
    ॥ ॥ रचय कुचयोः पत्रं चित्रं कुरुष्व कपोलयो र्घटय जघने काञ्चीमञ्च स्रजा कबरीभरम् । कलय वलयश्रेणीं पाणौ
    पदे कुरु नूपुरा विति निगतितः प्रीतः पीताम्बरोऽपि तथाकरोत् ॥ ॥ यद्गान्ध्गर्वकलासु कौशलमनुध्यानं च यद्वैष्णवं
    यच्छृङ्गारविवेकतत्वमपि यत्काव्येषु लीलायितम् । तत्सर्वं जयदेवपण्डितकवेः कृष्णैकतानात्मनः सानन्दाः
    परिशोधयन्तु सुधियः श्रीगीतगोविन्दतः ॥ ॥ श्रीभोजदेवप्रभवस्य रामादेवीसुतश्रीजयदेवकस्य । पराशरादिप्रियवर्गकण्ठे
    श्रीगीतगोविन्दकवित्वमस्तु ॥ ॥ ॥ इति श्रीजयदेवकृतौ गीतगोविन्दे सुप्रीतपीताम्बरो नाम द्वादशः सर्गः ॥
    ॥ इति गीतगोविन्दं समाप्तम् ॥
