    सिलि सेविन्तुरु कान्तलन् भुवि जनुल् श्री कालहस्तीश्वरा ॥ जलकम्बुल् रसमुल् प्रसूनमुलु वाचाबन्धमुल्
    वाद्यमु ल्कलशब्धध्वनु लञ्चिताम्बर मलङ्कारम्बु दीप्तु ल्मॆऱुं गुलु नैवेद्यमु माधुरी महिमगा गॊल्तुन्निनुन्
    भक्तिरं जिल दिव्यार्चन गूर्चि नेर्चिन क्रियन् श्री कालहस्तीश्वरा ॥ एलील न्नुतियिम्पवच्चु नुपमोत्प्रेक्षाध्वनिव्यङ्ग्यश
    ब्धालङ्कारविशेषभाषल कलभ्यम्बैन नीरूपमुं जालु गवित्वमुल्निलुचुने सत्यम्बु वर्णिञ्चुचो ची लज्जिम्परुगाक
    मादृशकवुल् श्री कालहस्तीश्वरा बॆट्टॆदं गुडुवरा पापन्न रा यन्न ले लेलॆम्मन्न नरण्टिपण्ड्लु गॊनि तेलेकुन्न
    नेनॊल्लनं टे लालिम्परे तल्लिदण्ड्रुलपु डट्ले तॆच्चि वात्सल्य ल क्ष्मीलीलावचनम्बुलं गुडुपरा श्री कालहस्तीश्वरा
    ॥ कललञ्चुन् शकुनम्बुलञ्चु ग्रहयोगं बञ्चु सामुद्रिकं बु लटञ्चुं दॆवुलञ्चु दिष्ट्मनुचुन् भूतम्बुलञ्चु
    न्विषा दुलटञ्चु न्निमिषार्ध जीवनमुलञ्चुं ब्रीति बुट्टिञ्चि यी सिलुगुल् प्राणुलकॆन्नि चेसितिवया श्री
    कालहस्तीश्वरा दं गुसुमप्रसाद मलिकस्थानम्बुपै भूतियुन् गलसीमम्बुन दण्ड नासिकतुदन् गन्धप्रसारम्बु लो
    पल नैवेद्यमु डाभक्तुण्डु नीकॆप्पुडुं जॆलिकाडै विहरिञ्चु रौप्यगिरिपै श्री कालहस्तीश्वरा ॥ आलुं बिड्डलु
    मित्रुलुन् हितुलु निष्टर्धम्बु लीनेर्तुरे वेल न्वारि भजिम्प जालिपड काविर्भूत मोदम्बुनं गालम्बॆल्ल
    सुखम्बु नीकु नि क भक्तश्रेणि रक्षिम्पके श्रीलॆव्वारिकि गूडम्बॆट्टॆदवया श्री कालहस्तीश्वरा ॥ सुलभुल्मूर्खु
    लनुत्तमोत्तमुल राजुल्गल्गियेवेल न न्नलन्तलबॆट्टिन नी पदाब्धमुल बायञ्जाल नेमिच्चिनं गलधौताचल मेलु टम्बुनिधिलो
    गापुण्डु टब्जम्बु पै जॆलुवॊप्पुन् सुखियिम्प गाञ्चुट सुमी श्री कालहस्तीश्वरा ॥ कलधौताद्रियु नस्थिमालिकयु
    गोगन्धर्वमुन् बुन्कयुं बुलितोलु न्भसितम्बु बुट्लकै तॊलि नेवारलतोड बुट्टक कलादुल्गल्गॆ मेलय्यॆना सिलुवुलूरमुचेसिकॊं
    टॆऱिङ्गिये श्री कालहस्तीश्वरा ॥ श्रुतुलभ्यासमुचेसि शास्त्रगरिमल् शोधिञ्चि तत्त्वम्बुलन् मति नूहिञ्चि
    शरीर मस्थिरमु ब्रह्मम्बॆन्न सत्यम्बु गां चिति मञ्चुन् सभलन् वृधावचनमु ल्चॆप्पङ्गने कानि नि र्जितचित्तस्थिर
    सौख्यमुल् दॆलियरो श्री कालहस्तीश्वरा ॥ गति नीवञ्चु भजिञ्चुवार लपवर्गं बॊन्दगानेल सं ततमुं गूटिकिनै
    चरिम्प विनलेदा यायु रन्नं प्रय च्छति यञ्चुन्मॊऱवॆट्टगा श्रुतुलु संसारान्धकाराभि दू षितदुर्मार्गुल्
    गान गानम्बडवो श्री कालहस्तीश्वरा ॥ रतिरा जुद्धति मीऱ नॊक्कपरि गोराजाश्वुनि न्नॊत्त डादर्पकु वेग नॊत्त
    गवयं बाम्बोतुनुं दा बोराडङ्गनुन्न युन्नडिमि ले गल्वोलॆ शोकानल स्थितिपालै मॊऱपॆट्टुनन् मनुपवे श्री
    कालहस्तीश्वरा ॥ अन्ता संशयमे शरीरघटनम्बन्ता विचारम्बॆ लो नन्ता दुःखपरम्परानिवितमॆ मेनन्ता भयभ्रान्तमे
    यन्तानन्तशरीरशोषणमॆ दुर्व्यापारमे देहिकिन् जिन्तन् निन्नु दलञ्चि पॊन्दरु नरुल् श्री कालहस्तीश्वरा
    जालुञ्जालु रतिराजद्वारसौख्यम्बुलन् शान्तिन् बॊन्दिति जालु बहुराजद्वारसौख्यम्बुलन् शान्तिं बॊन्दॆद
    जूपु ब्रह्मपदराजद्वारसौख्यम्बु नि श्चिन्तन् शान्तु ड नौदु नी करुणचे श्री कालहस्तीश्वरा जेयनॊल्लनि
    व्रतस्थुल्वोलॆ वेसम्बुतो बुत्री पुत्र कलत्र रक्षण कलाबुध्धिन् नृपाला धमन् बात्रं बञ्चु भजिम्प बोदु
    रितियुन् भाष्यम्बॆ यिव्वारिचा रित्रं बॆन्न डु मॆच्च नॆञ्च मदिलो श्री कालहस्तीश्वरा ॥ अकलङ्कस्थिति
    निल्पि नाड मनु घण्टा रावमुन् बिन्दुदी पकलाश्रेणि विवेकसाधनमुलॊप्पन् बूनि यानन्दता रकदुर्गाटविलो मनोमृगमुगर्वस्फूर्ति
    वारिञ्चुवा रिकि गा वीडु भवोग्रबन्धलतिकल् श्री कालहस्तीश्वरा ॥ ऒकयर्धम्बु निन्नु ने नडुग बॊ म्मु कवित्वम्बुलु
    नाकु जॆन्दनिवि येमो यण्टिवा नादुजि ह्वकु नैसर्गिक कृत्य मिन्तिय सुमी प्रार्धिञ्चुटे कादु को रिकल न्निन्नुनुगान
    नाकु वशमा श्री कालहस्तीश्वरा ॥ शुकमुल् किंशुकपुष्पमुल् गनि फलस्तोमं बटञ्चुन्समु त्सुकतं देर बोवु नच्चट
    महा दुःखम्बु सिद्धिञ्चु ब्रापुलगु शास्त्रम्बु ल्विलोकिञ्चुवा रिकि नित्यत्वमनीष दूरमगु जू श्री कालहस्तीश्वरा
    ॥ ऒकरिं जम्पि पदस्थुलै ब्रतुक दामॊक्कॊक्क रूहिन्तुरे लॊकॊ तामॆन्न बोवो सम्पदल् पुत्रमि त्रकलत्रादुलतोड
    नित्य सुखमन्दं गन्दुरो युन्नवा रिकि लेदो मृति यॆन्न डुं गटकट श्री कालहस्तीश्वरा डेनीचालयम्बुल जॊरं
    डेकार्पण्यपु माटलाड नरुगं डॆव्वारितो वेषमुल् गैकोडे मतमुल् भजिम्प डिलनेकष्टप्रकारम्बुलन् जीकाकै चॆडिपो
    दु जीवनदशन् श्री कालहस्तीश्वरा ॥ ज्ञातुल् द्रोहम्बु वाण्ड्रु सेयुकपटेर्यादि क्रियादोषमुल् मातण्ड्रान
    सहिम्परादु प्रतिकर्मम्बिञ्चुके जेयगा बोते दोसमु गान मानि यतिनै पो गोरिनन् सर्वदा चेतःक्रोधमु मान दॆट्लु
    नडुतुन् श्री कालहस्तीश्वरा ॥ चदुवुल् नेर्चिन पण्डिताधमुलु स्वेच्छाभाषणक्रीडलन् वदरन् संशयभीकराटवुलं
    द्रोवलप्पि वर्तिम्प गा मदनक्रोधकिरातुलन्दु किनं जॆदरुं जित्तमु चित्तगिम्प गदवे श्री कालहस्तीश्वरा
    त देण्टिदि मनॊ रोगस्थुण्डै देहि ता पूतम्बु ली देहमुल् मूसिन्देण्टिदि मू तलेण्टिवि सदामूढत्वमे कानि
    ता जेसिन्देण्टिदि चेन्तले टिवि वृधा श्री कालहस्तीश्वरा ॥ श्री शैलेशु भजिन्तुनो यभवुङ्गाञ्ची नाधु सेविन्तुनो
    काशीवल्लभु गॊल्वम्बोदुनॊ महा कालेशु बूजिन्तुनो नाशीलं बणुवैन मेरु वनुचुन् रक्षिम्पवे नी कृपा श्री
    शृङ्गारविलासहासमुलचे श्री कालहस्तीश्वरा ॥ अयवारै चरियिम्पवच्चु भोजतीर्धम्बुलन् दयतो गॊम्मनवच्चु सेवकुनि
    यर्धप्राणदेहादुल न्नियु ना सॊम्मनवच्चु गानि सिरुलन्निन्दिञ्चि निन्नात्मनि ष्क्रियतं गान गरादु पण्डितुलकुन्
    श्री कालहस्तीश्वरा बॊडिगामर्धिञ्चिरो विक्रमा जम्पिरो कपटलक्ष्मी मोहमुं बासिरो यायुर्दयभुजङ्गमृत्युवु
    ननायासम्बुनन् गॆल्चिरो श्रेयोदायक् लौदु रॆट्टु लितरुल् श्री कालहस्तीश्वरा दनूसङ्घर्षणास्वादमॊं द विनिर्मिञ्चॆद
    वेल जन्तुवुल नेतत्क्रीडले पातक व्यवहारम्बलु सेयुनेमिटिकि मायाविद्यचे ब्रॊद्दुपु च्चि विनोदिम्प ग दीन
    नेमि फलमो श्री कालहस्तीश्वरा ॥ वॆनुकं जेसिन घोरदुर्दशलु भाविम्पङ्ग रो तय्यॆडुन् वॆनुकन् मुन्दट वच्चु
    दुर्मरणमुल् वीक्षिम्प भीतय्यॆडुन् ननु ने जूडग नाविधुललञ्चियुन् नाके भयं बय्यॆडुं जॆनकुञ्जी गालमुनकुन्
    श्री कालहस्तीश्वरा ॥ परिशीलिञ्चिति मन्त्रतन्त्रमुलु चॆप्प न्विण्टि साङ्ख्यादियो ग रहस्यम्बुलु वेद
    शास्त्रमुलु वक्काणिञ्चितिन् शङ्कवो दरयं गुम्मडिकायलोनि यवगिञ्जन्तैन नम्मिच्ञ्चि सु स्थिरविज्ञानमु
    त्रोव गदवे श्री कालहस्तीश्वरा ॥ मॊदलं जेसिनवारि धर्ममुलु निर्मूलम्बुगा जेसि दु र्मदुलै यिप्पुडु वारॆ
    धर्ममु लॊनर्पं दम्मु दैवम्बु न व्वडॆ रानुन्न दुरात्मुलॆल्ल दमत्रोवं बोवरे एल चे सॆदरो मी दु दलञ्चिचूड
    कधमुल् श्री कालहस्तीश्वरा ॥ कासन्तैन सुखं बॊनर्चुनॊ मनःकामम्बु लीडेर्चुनो वीसम्बैननु वॆण्टवच्चुनॊ
    जगद्विख्याति गाविञ्चुनो दोसम्बु ल्बॆड बॊपुनो वलसिनन्दोड्तो मिमुं जूपुनो छी संसारदुराश येलुदुपवो श्री
    कालहस्तीश्वरा टिञ्चुक कूड तक्कुवगुने नोर्वङ्गले डॆण्डको पक नीडन्वॆदकुं जलिं जडिचि कुम्पट्लॆत्तुको
    जूचु वा नकु निण्डिण्ड्लुनु दूऱु नीतनुवु दीनन्वच्चु सौख्यम्बु रो सि कडासिम्परुगाक मर्त्वुलकट श्री कालहस्तीश्वरा
    ॥ केदारादिसमस्ततीर्धमुलु कोर्मिञ्जूड टिकिन् गाडा मुङ्गिलि वारणासि कडुपे कैलासशैलम्बु मी पादध्यानमु
    सम्भविञ्चुनपुडे भाविम्प नज्ञानल क्ष्मीदारिद्र्युलु गारॆ लोकु लकटा बराङ्गनाजनपर द्रव्यम्बुलन् म्रुच्चिलं
    ग महोद्योगमु सेयनॆम्मनमुदॊङ्गं बट्टि वैराग्यपा शमुलं जुट्टि बिगिमञ्चि नीदुचरण स्तम्भञ्जुनं गट्टिवै
    चि मुदं बॆप्पुडु जेय गडवे श्री कालहस्तीश्वरा ॥ वेधं दिट्टगरादुगानि भुविलो विद्वांसुलञ्जेय ने ला धीचातुरि
    जेसिन गुलामापाटने पोक क्षु द्बाधादुल् गलिगिम्पनेल यदि कृत्यम्बैन दुर्मार्गुलं जी ॥ पुडमि न्निन्नॊक
    बिल्वपत्रमुनने बूजिञ्चि पुण्यम्बुनुं बडयन्नेरक पॆक्कुदैवमुलकुं बप्पुल् प्रसादम्बुलं गुडुमुल् दोसॆलु
    सारॆसत्तुलडुकुल् गुग्गिल्लुनुं बेट्टुचुं जॆडि यॆन्दुं गॊऱगाकपोदु रकटा ॥ वित्तज्ञानमु पादु चित्तमु
    भवावेशम्बु रक्षाम्बुवुल् मत्तत्वम्बु तदङ्कुरं ऐनृतमुल् माऱाकु लत्यन्तदु द्वृत्तुल् पुव्वुलु बण्ड्लु
    मन्मधमुखा विर्भूतदोषम्बुलुं जित्ताध्युन्नतनिम्बभूजमुनकुन् श्री कालहस्तीश्वरा गाप्यमु चॆप्पुचुन्न यत
    डुन्नीपद्यमुल् व्रासियि म्मा पाठम्मॊनरिन्तुनन्न यत डुन् मञ्जुप्रबन्धम्बु नि ष्टापूर्तिं बठियिञ्चुचुन्न
    यत डुन् सद्बान्धवुल् गाक ची ची पृष्ठागतबान्धवम्बु निजमा द्रोलि रिपुलन् जङ्किञ्चि याकाङ्क्षलन् दम्पुल्वॆट्टि
    कलङ्कमु ल्नऱकि बन्धक्लेशदोषम्बुलं जिम्पुल्सेसि वयोविलासमुलु सङ्क्षेपिञ्चि भूतम्बुलं जॆम्पल्वेयक निन्नु
    गाननगुना श्री कालहस्तीश्वरा ॥ राजश्रेणिकि दासुलै सिरुल गोरं जेरङ्गा सौख्यमो यी जन्मम्बु तरिम्प जेयगल
    मिम्मे प्रॊद्दु सेविञ्चु नि र्व्याजाचारमु सौख्यमो तॆलियलेरौ मानवु ल्पापरा जीजातातिमदान्धबुद्धु लगुचुन्
    श्री कालहस्तीश्वरा ॥ निन्नं जूडरॊ मॊन्न जूडरो जनुल् नित्यम्बु जावङ्ग ना पन्नु ल्गन्ननिधान मय्यॆडि
    धनभ्रान्तिन् विसर्जिम्पले कुन्ना रॆन्न डु निन्नु गण्डु रिक मर्त्वुल् गॊल्वरेमो निनुन् विन्नं बोवक
    यन्यदैवरतुलन् श्री कालहस्तीश्वरा गुतोलुदुप्पटमु बुव्वाकालकूतम्बु चे गिन्ने ब्रह्मकपाल मुग्रमगु भोगे
    कण्ठहारम्बु मेल् निन्नीलागुन नुण्टयुं दॆलिसियुन् नीपादपद्मम्बु चे र्चॆन् नारयणु दा श्री कालहस्तीश्वरा
    जञ्चुकिजनव्रातम्बु दण्डम्मुलन् दोरन्त्स्थलि बग्गनं बॊडुचुचुन् दुर्भाषलाड न्मऱिन् वारिं ब्रार्धनचेसि
    राजुलकु सेवल्सेय बोरुल क्ष्मीराज्यम्बुनु गोरि नीमरिजनुल् श्री कालहस्तीश्वरा ॥ ऊरूरं जनुलॆल्ल बिक्ष
    मिदरोयुन्दं गुहल्गल्गवो चीरानीकमु वीधुलं दॊरुकरो शीतामृतस्वच्छवाः पूरं बेरुल बाऱदो तपसुलम्ब्रोवङ्ग
    नीवोपवो चेरं बोवुदुरेल रागुल जनुल् श्री कालहस्तीश्वरा ॥ दय जूडुण्डनि गॊन्दऱाडुदुरु नित्यम्बुन् निनुं
    गॊल्चुचुन् नियमं बॆन्तो फलम्बु नन्तियॆकदा नीवीय पिण्डॆन्तो अं तियका निप्पटियुं दलम्पननु बुद्धिं जूड
    नेलब्बुनि ष्क्रियतन् निन्नु भजिम्प किष्टसुखमुल् श्री कालहस्तीश्वरा दारकमुग नात्माभ्रवीधिन्महा कारोकारमकारयुक्तमगु
    नोङ्काराभिधानम्बु चॆ न्नारुन् विश्व मनङ्ग दन्महिमचे नानादबिन्दुल् सुख श्री रञ्जिल्ल गडङ्गु नीवदॆ सुमी
    श्री कालहस्तीश्वरा ॥ नीभक्तु ल्मदिवेल भङ्गुल निनुन्सेविम्बुचुन् वेड गा लोभम्बेटिकि वारि कोर्कुलु कृपलुत्वम्बुनं
    दीर्मरा दा भव्यम्बु दलञ्चि चूडु परमार्धं बिच्चि पॊम्मन्न नी श्री भाण्डरमुलो गॊऱन्तपडुना श्री कालहस्तीश्वरा
    ॥ मॊदलन्भक्तुलकिच्चिना बुट्टु घनमौ मोहम्बु लोभम्बु न न्नदि सत्यम्बु कृपं दलम्प नॊकवुण्यात्मुण्डु निन्नात्म
    गॊ ल्चि दिनम्बुन् मॊऱवॆट्ट ॥ कालद्वारकवाटबन्धनमु दुष्काल्प्रमाणक्रिया लोलाजालकचित्रगुप्तमुखव ल्मीकोग्रजिह्वाद्भुत
    व्यलव्यालविरोधि मृत्युमुखदंष्ट्रा हार्य वज्रम्बु दि क्चेलालङ्कृत नीदुनाम मरयन् श्री कालहस्तीश्वरा
    ॥ पदिवेललैननु लोककण्टकुलचे ब्राप्रिञ्चु सौख्यम्बु ना मदिकिं बथ्यमु गादु सर्वमुनकुन् मध्यस्थु डै सत्यदा
    नदयादुल् गल राजु नाकॊस गु मेनव्वानि नी यट्लचू चि दिनम्बुन् मुदमॊन्दुदुन् गडपटन् श्री कालहस्तीश्वरा
    बॆण्ड्लामुबिड्डल् हित व्रातम्बुन् बलविम्प जन्तुवुलकुन् वालायमैयुण्डङ्गा जेतोवीधि नरुण्डु निन्गॊलुव
    डो श्री कालहस्तीश्वरा ॥ जातुल् सॆप्पुट सेवसेयुट मृषल् सन्धिञ्चु टन्यायवि ख्यातिं बॊन्दुट कॊण्डॆका
    डवुट हिंसारम्भकुण्डौट मि ध्यातात्पर्यमुलाडुटन्नियु बरद्रव्यम्बुनाशिञ्चि यी श्री ता नॆन्नियुगम्बु लुण्ड
    गलदो श्री कालहस्तीश्वरा ॥ चॆडुगुल् कॊन्दऱु कूडि चेयङ्गम्बनुल् चीकट्लु दूऱङ्ग मा ल्पडितिं गान ग्रहिम्परानि
    निनु नॊल्लञ्जाल बॊम्मञ्चु निल् वॆलन्द्रोचिन जूरुपट्टुकॊनि ने व्रेलाडुदुं गोर्कि गो रॆडि यर्धम्बुलु
    नाकु नेल यिडवो श्री कालहस्तीश्वरा ॥ भसितोद्धूलनधूसराङ्गुलु जटाभारोत्तमाङ्गुल् तपो व्यसनमुल् साधितपञ्चवर्णरसमुल्
    वैराग्यवन्तुल् नितां तसुखस्वान्तुलु सत्यभाषणलु नुद्यद्रत्नरुद्राक्षरा जिसमेतुल् तुदनॆव्वरैन गॊलुतुन्
    श्री कालहस्तीश्वरा ॥ जलजश्री गल मञ्चिनील्लु गलवाचत्रातिलो बापुरे पनिल्लुगलदावेसालुगा नक्कटा नलि ना
    रॆण्डु गुणम्बु लॆञ्चि मदिलो नन्नेमि रोयङ्ग नी चॆलुवम्बैन गुणम्बु लॆञ्चुकॊनवे श्री कालहस्तीश्वरा ॥
    गडियल् रॆण्टिकॊ मू टिको गडियको कादेनि ने ग मीकायम्बु लीभूमिपै बडगा नुन्नवि धर्ममार्गमॊकटिं बाटिम्प
    री मानवुल् चॆडुगुल् नीपदभक्तियुं दॆलियरो श्री कालहस्तीश्वरा ॥ क्षितिलो दॊड्डतुरङ्गसामजमु लेचित्रम्मु
    लान्दोलिका ततु ले लॆक्क विलासिनीजनसुवस्रव्रात भूषाकला पतनूजादिक मेमिदुर्लभमु नी पादम्मु लर्चिञ्चुचो
    जितपङ्केरुहपादपद्मयुगला श्री कालहस्तीश्वरा ॥ सलिलम्मुल् जुखुकप्रमाण मॊक पुष्मम्मुन् भवन्मौलि नि श्चलबक्तिप्रपत्तिचे
    नरु डौ निल गङ्गाजलचन्द्रखण्डमुल दानिन्दुं दुदिं गाञ्चु नी चॆलुवं बन्तयु नी महत्त्व मिदिगा श्री कालहस्तीश्वरा
    दामॆ चूड सुखमैतादात्म्यमुन् गूर्प गा विमलम्मुल् कमलाभमुल् जितलसद्विद्युल्लतालास्यमुल् सुमनोबाणजयप्रदम्मुलनुचुन्
    जूचुन् जनम्बूनिहा रिमृगाक्षीनिवहम्मुकन्नुगवलन् श्री कालहस्तीश्वरा ॥ पटवद्रज्जुभुजङ्गवद्रजतवि भ्रान्तिस्फुरच्छुक्तिव
    द्घटवच्चन्द्रशिलाजपाकुसुमरु क्साङ्गत्यवत्तञ्चुवा क्पटिमल् नेर्तुरु चित्सुखं बनुभविम्पन् लेक दुर्मेधनुल्
    चिटुकन्नं दलपोय जूतु रधमुल् श्री कालहस्तीश्वरा ॥ निनु निन्दिञ्चिन दक्षुपै दॆगवॊ वाणीनाधु शासिम्पवो
    चनुना नी पादपद्मसेवकुल दुच्छं बाडु दुर्मार्गुलं बॆनुपन् नीकुनु नीदुभक्तततिकिन् भेदम्बु गानङ्ग व च्चॆनॊ
    लेकुण्डिन नूऱकुण्डगलवा श्री कालहस्तीश्वरा ॥ करिदैत्युन् बॊरिगॊन्न शूलमु क स्तम्बु गादो रती श्वरुनिन्
    गाल्चिन फाललोचनशिखा वर्गम्बु चल्लाऱॆनो परनिन्दापरुलन् वधिम्प विदियुन् भाष्यम्बॆ वारेमि चे सिरि नीकुन्
    बरमोपकार मरयन् श्री कालहस्तीश्वरा ॥ दुरमुन् दुर्गमु रायबारमु मऱिन् दॊङ्गर्ममुन् वैद्यमुन् नरनाधाश्रय
    मोडबेरमुनु बॆन्मन्त्रम्बु सिद्धिञ्चिनन् अरयन् दॊड्डफलम्बु गल्गुनदिगा काकार्यमे तप्पिनन् सिरियुं बोवुनु
    ब्राणहानियु नगुन् श्री कालहस्तीश्वरा ॥ तनयुं गाञ्चि धनम्बु निञ्चि दिविजस्थानम्बु गट्टिञ्चि वि प्रुन
    कुद्वाहमु जेसि सत्कृतिकि बात्रुण्डै तटाकम्बु ने र्पुन द्रव्विञ्चि वनम्बु वॆट्टि मननी पोलेडु नीसेव
    डु पोवु लोकमुनकुन् श्री कालहस्तीश्वरा ड् वच्चॆन् मिम्मुलं जूड डे मेटि कवित्ववैखरिनि सद्यःकाव्यनिर्मात
    तत् प्रतिभ ल्मञ्चिनि तिट्टुपद्यमुलु चॆप्पुं दात डैनन् ममुं ग्रितमे चूचॆनु बॊम्मटञ्चु रधमुल् श्री कालहस्तीश्वरा
    ॥ नीकुं गानि कवित्व मॆव्वरिकि नेनीनञ्चु मीदॆत्तितिन् जेकॊण्टिन् बिरुदम्बु कङ्कणमु मुञ्जे गट्टितिं
    बट्टितिन् लोकुल् मॆच्च व्रतम्बु नातनुवु कीलुल् नेर्पुलुं गावु छी छी कालम्बुलरीति दप्पॆडु जुमी श्री
    कालहस्तीश्वरा ॥ निच्चल् निन्नु भजिञ्चि चिन्मयमहा निर्वाणपीठम्बु पै रच्चल्सेयक यार्जवम्बु कुजन व्रातम्बुचे
    ग्राङ्गि भू भृच्चण्डालुर गोपिम्मन् बुधुं डार्तु डै चिच्चारं जमु रॆल्ल जल्लुकॊनुनो श्री कालहस्तीश्वरा
    ॥ दन्तम्बु ल्पडनप्पुडे तनुवुनन्दारूढि युन्नप्पुडे कान्तासङ्घमु रोयनप्पुडे जरक्रान्तम्बु गानप्पुडे
    विन्तल्मेन जरिञ्चनप्पुडॆ कुरुल्वॆल्लॆल्ल गानप्पुडे चिन्तिम्पन्वलॆ नीपदाम्बुजमुलन् श्री कालहस्तीश्वरा
