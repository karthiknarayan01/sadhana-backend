id: shandilyakritamgurustotram
category: stotram
name:
  english: shandilyakritamgurustotram
  devanagari: शाण्डिल्यकृतंगुरुस्तोत्रम्
content:
  english: shandilyakritam gurustotram shrishandilya uvaca | shastrantare'pi yatproktam carecchastranusaratah
    | mahatam samayashcapi pramanam vedasammitam || 1|| atha stotram pravakshyami guroh svatmasvarupinah
    | yena bhaktipathe divyah prasidhyati paratmani || 2|| yah shripuranapurushasya mukharavindat sambhutabhaktipathamavirabhutpranetum
    | sakshatkaroti sakalam sakalatmalilam tam shrimadaryacaranam sharanam bhajema || 3|| yasyanghripankajayuge'mbujavajracapa
  devanagari: शाण्डिल्यकृतं गुरुस्तोत्रम् श्रीशाण्डिल्य उवाच । शास्त्रान्तरेऽपि यत्प्रोक्तं चरेच्छास्त्रानुसारतः
    । महतां समयश्चापि प्रमाणं वेदसम्मितम् ॥ १॥ अथ स्तोत्रं प्रवक्ष्यामि गुरोः स्वात्मस्वरूपिणः । येन भक्तिपथे
    दिव्यः प्रसिध्यति परात्मनि ॥ २॥ यः श्रीपुराणपुरुषस्य मुखारविन्दात् सम्भूतभक्तिपथमाविरभूत्प्रणेतुम्
    । साक्षात्करोति सकलां सकलात्मलीलां तं श्रीमदार्यचरणं शरणं भजेम ॥ ३॥ यस्याङ्घ्रिपङ्कजयुगेऽम्बुजवज्रचाप
meaning: {}
