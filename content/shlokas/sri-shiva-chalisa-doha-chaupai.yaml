id: sri-shiva-chalisa-doha-chaupai
category: stotram
name:
  english: Sri Shiva Chalisa (Doha-Chaupai)
content:
  english: doha jai ganesha girijasuvana | mangalamula sujana || kahatayodhyadasatuma | de u abhayavaradana
    || caupayi jai girijapati dinadayala | sadakarata santana pratipala || bhala candra masohatanike |
    kananakundala nagaphanike || angagaura shira ganga bahaye | mundamala tana charalagaye || vastra khala
    baghambara so hai | chabi kodekhi nagamunimohai || maina matukihavai dulari | vama anga so hata cha
    bi nyari || kara trishula sohata cha bi bhari | karata sada shatru na kshayakari || nandiganesha sohaita
    ha kai se | sagaramadhya kamalahai jai se || kartika shyama aura ganaravu | ya chabikau kahi jata
    na kavu || devana jabahi jaya pukara | tabahidukhaprabhu apaninara || kiya upadrava tarakabhari |
    devana sabamili tum hi juhari || turata shadanana apa pathayavu | lavanimesha maha mari girayavu ||
    apajalandhara asura samhara | su yasha tum hara vidita samsara || tripurasura sana yuddhama ca i |
    sa bahi kripa kara lina baca i || kiya tapahi bhagirathabhari | purava pratijna tasu purari || danina
    maha tuma samatovunahi | nevakastuti karata sadahi || vedanama mahima tavaga i | akadha anadi bhedana
    hi pa i || pragati udathi mathana me jvala | jaratasurasura bhaye nihala || kinhadaya taha kari saha
    i | nilakantha tavanama ka ha i || pujana ramacandra jabakinha | jitake lanka vibhishana dinha ||
    sahasa kamalame horahedhari | kinha pariksha ta bahi purari || ekakamala prabhurakhèvu jo i | kamalanayana
    pujana caha so i || kathinabhakti dekhi prabhu shankara | bhaye prasannadiyo icchitivara || jaya jaya
    jaya ananta avinasi | karatakripa sabake ghatavasi || dushtasakala nitamohi satavai | bhramata rahemèhicaina
    na anai || trahi trahimai nadhapukaro | yahi avasaramohi ana ubaro || vaitrishula shatruna komaro
    | sankata nemohi ani ubaro || matapita bhrata sabako i | sankatame puchata nahiko i || svami ekahai
    ashatumhari | aya harahu abasankata bhari || dhana niradhanako deta sadahi | jo ko i bambevophala
    pahi || stutikèhividhi karau tumhari | kshamahanatha abacuka hamari || shankaraho sankatake nashana
    | vighna vinashana mangala karana || yogi yati munidhyana laga | vaisharada narada shishanavavai ||
    namo namo jai namah shivaya | surabrahmadika para na payè || jo yaha patha ka rai manala i | tapara
    hotahai shambhu saha i || riniya jo ko i hoadhikari | pathaka rai so pavana hari || putrahonakara
    icchakoi | nishcaya shiva prashadatèhiho i || pandita trayodashi kolavai | dhyanapurva ka ra vai ||
    trayodashi vrata karaihamesha | tana nahi takerahai kalesha || dhupadipa naivedya cadhavai | shankara
    sanmukha pathasunavai || janma janmake papavasavai | antavasa shivapurame palai || doha nita nema
    karipratahi pathakalau calisa tumameri manakamana purna hu jagadesha || magakara chathi hemanta ritu
    samvat caumsatha jana stuti calisa shiva ji purna kena kalyana || namah parvati patayenamah
  devanagari: दोहा जै गणेश गिरिजासुवन । मङ्गलमूल सुजान ॥ कहातायोध्यादासतुम । दे उ अभयवरदान ॥ चौपायि जै
    गिरिजापति दीनदयाल । सदाकरत सन्तन प्रतिपाल ॥ भाल चन्द्र मासोहतनीके । काननकुण्डल नागफनीके ॥ अङ्गगौर
    शिर गङ्ग बहाये । मुण्डमाल तन छारलगाये ॥ वस्त्र खाल बाघम्बर सो है । छबि कोदेखि नागमुनिमोहै ॥ मैना मातुकिहवै
    दुलारी । वाम अङ्ग सो हत छ बि न्यारी ॥ कर त्रिशूल सोहत छ बि भारी । करत सदा शत्रु न क्षयकारि ॥ नन्दिगणेश
    सोहैत ह कै से । सागरमध्य कमलहै जै से ॥ कार्तीक श्याम और गणरावु । या छबिकौ कहि जात न कावु ॥ देवन जबहि
    जाय पुकारा । तबहिदुखप्रभु आपनिनारा ॥ किया उपद्रव तारकभारी । देवन सबमिलि तुम् हि जुहारी ॥ तुरत षडानन
    आप पठायवु । लवनिमेष मह मारि गिरायवु ॥ आपजलन्धर असुर संहारा । सु यश तुं हार विदित संसारा ॥ त्रिपुरासुर
    सन युद्धम चा ई । स बहि कृपा कर लीन बचा ई ॥ किया तपहि भगीरथभारी । पुरव प्रतिज्ञा तासु पुरारी ॥ दानिन
    मह तुम समतोवुनही । नेवकस्तुति करत सदाहि ॥ वेदनाम महिमा तवगा ई । अकध अनादि भेदन हि पा ई ॥ प्रगटी उदथि
    मथन मे ज्वाला । जरतसुरासुर भये निहाला ॥ कीन्हदया तह करी सहा ई । नीलकण्ठ तवनाम क हा ई ॥ पूजन रामचन्द्र
    जबकिन्ह । जीतके लङ्क विभीषण दीन्ह ॥ सहस कमलमे होरहेधारी । कीन्ह परीक्षा त बहि पुरारी ॥ एककमल प्रभुराखॆवु
    जो ई । कमलनयन पूजन चह सो ई ॥ कठिनभक्ति देखी प्रभु शङ्कर । भये प्रसन्नदियो इच्छितिवर ॥ जय जय जय अनन्त
    अविनासी । करतकृपा सबके घटवासी ॥ दुष्टसकल नितमोहि सतावै । भ्रमत रहेमॆहिचैन न आनै ॥ त्राहि त्राहिमै
    नाधपुकारो । याहि अवसरमोहि आन उबारो ॥ वैत्रिशूल शत्रुन कोमारो । सङ्कट नेमोहि आनि उबारो ॥ मातपिता भ्राता
    सबको ई । सङ्कटमे पूछत नहिको ई ॥ स्वामि एकहै आशतुम्हारी । आय हरहु अबसङ्कट भारी ॥ धन निरधनको देत सदाहि
    । जो को ई बाम्बेवोफल पाही ॥ स्तुतिकॆहिविधि करौ तुम्हारी । क्षमहनाथ अबचूक हमारी ॥ शङ्करहो सङ्कटके नाशन
    । विघ्न विनाशन मङ्गल कारन ॥ योगी यति मुनिध्यान लगा । वैशारद नारद शीशनवावै ॥ नमो नमो जै नमः शिवाय ।
    सुरब्रह्मादिक पार न पायॆ ॥ जो यह पाठ क रै मनला ई । तापर होतहै शम्भु सहा ई ॥ ऋनिया जो को ई होअधिकारी
    । पाठक रै सो पावन हारी ॥ पुत्रहोनकर इच्छाकोई । निश्चय शिव प्रशादतॆहिहो ई ॥ पण्डित त्रयोदशी कोलावै
    । ध्यानपूर्व क रा वै ॥ त्रयोदशी व्रत करैहमेशा । तन नहि ताकेरहै कलेशा ॥ धूपदीप नैवेद्य चढावै । शङ्कर
    सन्मुख पाठसुनावै ॥ जन्म जन्मके पापवसावै । अन्तवास शिवपुरमे पालै ॥ दोहा नित नेम करिप्रातहि पाठकलौ चालीस
    तुममेरी मनकामना पूर्ण हु जगदेश ॥ मगकर छठि हेमन्त ऋतु संवत् चौंसठ जान स्तुति चालीसा शिव जि पूर्ण केन
    कल्यान ॥ नमः पार्वती पतयेनमः
