id: gayatrikavacam-2-alabhyam-kavacasahita-catushpadagayatri
category: kavacha
name:
  english: gayatrikavacam 2 alabhyam (kavacasahita catushpadagayatri)
  devanagari: गायत्रीकवचम् २ अलभ्यम् (कवचसहिता चतुष्पादगायत्री)
content:
  english: suvah om ta om patu me rupam brahmanam karanam param | om tsa om brahmarasam patu me sada mama
    | om vi om patu me gandham sada shishirasamyutam | om tu om patu me sparsham sharirasya karanam param
    | om rva om patu me shabdam shabdavigrahakaranam | om re om patu me nityam sada tattvasharirakam |
    om nyam om patu me aksham sarvatattvaikakaranam | om bha om patu me shrotram shabdashravanaikakaranam
    | om rgo om patu me ghranam gandhotpadanakaranam | om de om patu me casyam sabhayam shabdarupinim
    | om va om patu me bahuyugalam ca karmakaranam | om sya om patu me lingam shatdalayutam | om dhi om
    patu me nityam prakriti shabdakaranam | om ma om patu me nityam namo brahmasvarupinim | om hi om patu
    me buddhim parabrahmamayam sada | om dhi om patu me nityamahankaram yatha tatha | om yo om patu me
    nityam jalam sarvatra sarvada | om yo om patu me nityam jalam sarvatra sarvada | om nah om patu me
    nityam tejahpunjo yatha tatha | om pra om patu me nityamanilam kayakaranam | om co om patu me nityamakasham
    shivasannibham | om da om patu me jihvam japayajnasya karanam | om yat om patu me nityam shivam jnanamayam
    sada | om tattvani patu me nityam
  devanagari: सुवः ॐ त ॐ पातु मे रूपं ब्राह्मणं कारणं परम् । ॐ त्स ॐ ब्रह्मरसं पातु मे सदा मम । ॐ वि ॐ
    पातु मे गन्धं सदा शिशिरसंयुतम् । ॐ तु ॐ पातु मे स्पर्शं शरीरस्य कारणं परम् । ॐ र्व ॐ पातु मे शब्दं
    शब्दविग्रहकारणम् । ॐ रे ॐ पातु मे नित्यं सदा तत्त्वशरीरकम् । ॐ ण्यं ॐ पातु मे अक्षं सर्वतत्त्वैककारणम्
    । ॐ भ ॐ पातु मे श्रोत्रं शब्दश्रवणैककारणम् । ॐ र्गो ॐ पातु मे घ्राणं गन्धोत्पादानकारणम् । ॐ दे ॐ पातु
    मे चास्यं सभायां शब्दरूपिणीम् । ॐ व ॐ पातु मे बाहुयुगलं च कर्मकारणम् । ॐ स्य ॐ पातु मे लिङ्गं षट्दलयुतम्
    । ॐ धी ॐ पातु मे नित्यं प्रकृति शब्दकारणम् । ॐ म ॐ पातु मे नित्यं नमो ब्रह्मस्वरूपिणीम् । ॐ हि ॐ पातु
    मे बुद्धिं परब्रह्ममयं सदा । ॐ धि ॐ पातु मे नित्यमहङ्कारं यथा तथा । ॐ यो ॐ पातु मे नित्यं जलं सर्वत्र
    सर्वदा । ॐ यो ॐ पातु मे नित्यं जलं सर्वत्र सर्वदा । ॐ नः ॐ पातु मे नित्यं तेजःपुञ्जो यथा तथा । ॐ प्र
    ॐ पातु मे नित्यमनिलं कायकारणम् । ॐ चो ॐ पातु मे नित्यमाकाशं शिवसन्निभम् । ॐ द ॐ पातु मे जिह्वां जपयज्ञस्य
    कारणम् । ॐ यात् ॐ पातु मे नित्यं शिवं ज्ञानमयं सदा । ॐ तत्त्वानि पातु मे नित्यं
