id: bagalamukhishatruvinashakakavacam
category: kavacha
name:
  english: bagalamukhishatruvinashakakavacam
  devanagari: बगलामुखीशत्रुविनाशककवचम्
content:
  english: rinu devi pravakshyami kavacam paramadbhutam | yasya smaranamatrena ripoh stambho bhavet kshanat
    || 2|| kavacasya ca deveshi mahamayaprabhavatah | panktih chandah samuddishtam devata bagalamukhi
    || 3|| dharmarthakamamoksheshu viniyogah prakirtitah | omkaro me shirah patu hrinkaro vadane'vatu
    || 4|| bagalamukhi doryugmam kanthe sarvada'vatu | dushtanam patu hridayam vacam mukham tatah padam
    || 5|| udare sarvada patu stambhayeti sada mama | jihvam kilaya me matarbagala sarvasada'vatu || 6||
    buddhim vinashaya padau tu hlim om me digvidikshu ca | svaha me sarvada patu sarvatra sarvasandhishu
    || 7|| iti te kathitam devi kavacam paramadbhutam | yasya smaranamatrena sarvasthambho bhavet kshanat
    || 8|| yad dhritva vividha daitya vasavena hatah pura | yasya prasadat siddho'ham harih sattvagunanvitah
    || 9|| vedha srishtim vitanute kamah sarvajagajjayi | likhitva dharayedyastu kanthe va dakshine bhuje
    || 10|| shatkarmasiddhistasyashu mama tulyo bhaveddhruvam | ajnatva kavacam devi tasya mantro na sidhyati
    || 11|| iti shribagalamukhishatruvinashakam kavacam samaptam |
  devanagari: ृणु देवि प्रवक्ष्यामि कवचं परमाद्भुतम् । यस्य स्मरणमात्रेण रिपोः स्तम्भो भवेत् क्षणात् ॥
    २॥ कवचस्य च देवेशि महामायाप्रभावतः । पङ्क्तिः छन्दः समुद्दिष्टं देवता बगलामुखी ॥ ३॥ धर्मार्थकाममोक्षेषु
    विनियोगः प्रकीर्तितः । ॐकारो मे शिरः पातु ह्रीङ्कारो वदनेऽवतु ॥ ४॥ बगलामुखी दोर्युग्मं कण्ठे सर्वदाऽवतु
    । दुष्टानां पातु हृदयं वाचं मुखं ततः पदम् ॥ ५॥ उदरे सर्वदा पातु स्तम्भयेति सदा मम । जिह्वां कीलय मे
    मातर्बगला सर्वसदाऽवतु ॥ ६॥ बुद्धिं विनाशय पादौ तु ह्लीं ॐ मे दिग्विदिक्षु च । स्वाहा मे सर्वदा पातु
    सर्वत्र सर्वसन्धिषु ॥ ७॥ इति ते कथितं देवि कवचं परमाद्भुतम् । यस्य स्मरणमात्रेण सर्वस्थम्भो भवेत्
    क्षणात् ॥ ८॥ यद् धृत्वा विविधा दैत्या वासवेन हताः पुरा । यस्य प्रसादात् सिद्धोऽहं हरिः सत्त्वगुणान्वितः
    ॥ ९॥ वेधा सृष्टिं वितनुते कामः सर्वजगज्जयी । लिखित्वा धारयेद्यस्तु कण्ठे वा दक्षिणे भुजे ॥ १०॥ षट्कर्मसिद्धीस्तस्याशु
    मम तुल्यो भवेद्ध्रुवम् । अज्ञात्वा कवचं देवि तस्य मन्त्रो न सिध्यति ॥ ११॥ इति श्रीबगलामुखीशत्रुविनाशकं
    कवचं समाप्तम् ।
