id: kyts-5-6-hirnyavarnaah-suchayah-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 5.6 Hirnyavarnaah Suchayah - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mpancamakande shashthah prashnah shri gurubhyo namah
    | harih om || hiranyavarna shshucayah pavaka yasu jatah kashyapo yasvindrah | agnim ndadhire virupasta
    na apa syona bhavantu || yasagm raja varuno yati maddhye satyanrite avapashyan jananam | madhushcuta
    shshucayo yah pavakasta na apa syona bhavantu || yasa ndeva divi krinvanti bhaksham ya~ antarikshe
    bahudha bhavanti | yah prithivi syona bhavantu || shivena ma cakshusha pashyata shshivaya tanuvopa
    sprishata tvaca mme | sarvagm agnigm raphsushado huve vo mayi varco balamojo ni dhatta || yadada mprayatiraha
    vanadatahate | tasmada nadyo nama stha ta vo namani sindhavah || ya tpreshita varunena ta shshibhagm
    samavalgata | dapo anu sthana || apakamagg syandamana avivarata vo hika dvarnama vo hitam || eko devo
    apyatishtha thsyandamana yatha vasham | udanishu mucyate || apo bhadra ghritamidapa asuragni shomau
    bibhratyapa i ttah | tivro raso madhuprica pranena saha varcasa gann || adi tpashyamyuta va shrinomya
    ma ghosho gacchati vanna asam | manye bhejano amritasya tar hi hiranyavarna atripam ya~da vah || apo
    hi shtha mayo bhuvasta na urje dadhatana | mahe ranaya cakshase || yo vah shivatamo rasastasya bhajayateha
    nah | ushatiriva matarah || tasma ara ngamama vo yasya kshayaya jinvatha | apo janayatha ca nah ||
    divi shraya svantarikshe yatasva prithivya sa samasi brahmavarcasaya tva || ngrihnatyetadvava rajasuyam
    'gnirvarunasavo rajasuya 'tho ubhaveva lokavabhi jayati yashca rajasuyenejanasya yashca 'gnicita apo
    bhavantyapo va agnerbhratrivya yadapo 'gneradhastadupa dadhati bhratrivyabhibhutyai bhavatyatmana
    para 'sya bhratrivyo bhavatyamritam bhratrivyo bhavatyamrita ''rtimarcchati sarvamayureti yasyaita
    upadhiyante ya u caina evam nbhavati yasyaita upadhiyante ya u caina evam ve~da dvadasha bhavanti
    dvadasha masa annamava rundhe patrani bhavanti patre va annamadyate sayo nyevannamava rundha a dvadasha
    mattyatho patranna chidyate yasyaita upadhiyante ya u caina evam ve~da kumbhashca kumbhishca mithunani
    bhavanti mithunasya praja tyai pra prajaya pashubhi rjayate yasyaita upadhiyante ya u 'rpayati yadapa
    upadadhati shucamevasya shamayati na ''rtimarcchatyaddhvaryurna yajamana shshamyanti praja yatraita
    upadhiyante 'pam va~ etani hridayani yadeta apo yadeta apa upadadhati divyabhirevaina bhavati yo va
    etasamayatana nbhavati kalpate 'sma anusitamupa dadhatyetadva asamayatanamesha kliptirya evam 'smai
    dvadvammanya upa dadhati catasro maddhye dhritya annam tkhalu vai sakshadannam ncarumupa dadhati saksha
    'sma annamava rundhe 'sma annamava rundhe maddhyata upa dadhati maddhyata evasma anna haspatyo bhavati
    brahma vai devana rbrahmanaivasma annamava rundhe brahmavarcasamasi brahmavarcasaya tvetyaha tejasvi
    brahmavarcasi bhavati yasyaisha upadhiyate ya u cainamevam saptacatvarigmshacca bhuteshtaka upa dadhatyatra
    tra vai mrityurjayate yatrayatraiva mrityurjayate tata evainamava yajate tasmadagnici thsarvamayureti
    sarve hyasya mrityavo 've bhicaritavai pratyagena sstrinute suyate va esha yo ncinute devasuvametani
    havigmshi bhavantyetavanto vai devanagm savasta eva npra yacchanti ta enagm suvante savo 'gnirvarunasavo
    rajasuya mbrahmasavashcityo devasya tva savituh prasava ityaha savitriprasuta evaina mbrahmana devatabhirabhi
    shincatyanna syannasyabhi shincatyanna tpratyancamabhi shincati purastaddhi pratici namannamadyate
    shir shato hyannamadyata a mukha ndadhatyagnestva samra jyenabhi shincamityahaisha va agne ssavastenaivainamabhi
    shincati brihaspate jyenabhishincamityaha brahma vai devana mbrihaspatirbrahmanaivainamabhi shincatindrasya
    tva samra mityahendriyamevasmi dvai rajasuyasya rupam ncinuta ubhaveva lokavabhi jayati yashca rajasuyenejanasya
    yashca gnicita indrasya sushuvanasya dashadhendriyam tramanya yajetendriyameva viryagm sabhrintya
    dashtacatvarigmshacca ssajurusha arunibhi ssurya etashena sajoshavashvina dagmsobhi shvanara idabhirghritena
    svaha sam va~thsaro va abdo masa ayava usha aruni surya etasha ime ashvina sam shvanarah pashava ida
    pashavo ghritagm sam 'nu pra jayante sam va~thsarenaivasmai pashu nprajanayati darbhastambe juhoti
    ya ddarbhastasmin juhoti praiva jayate 'nnado bhavati yasyaiva njuhvatyeta vai devata agneh purasta
    dbhagasta eva prinatyatho cakshurevagneh purasta tprati dadhatyanandho bhavati ya evam ''po va idamagre
    salilamasi thsa prajapatih pushkaraparne vato bhuto ttasminnagnimacinuta tadiyamabhava ttato vai sa
    pratyatishthadya ndakshinata upadadha thsa dakshinah paksho thsa dakshina digya thsa pratici digyamuttarata
    upadadha thsodici digyamuparishta ntrindantyabhi sharkaragm sarva va iyam nnaddhyasate ya evam ncinute
    pratyeva tishthatyabhi disho jayatyagneyo vai bra dbrahmanaya sarvasu dikshvardhukagg svameva ta mbhritva
    dvitiye sam 'bhijita yajeta yadashtakapalo bhavatyashtakshara gayatrya mpratassavanameva tena dadhara
    gayatri nchando yadekadashakapalo bhavatyekadashakshara trishtugaindra mmaddhyandinagm savana mmaddhyandinameva
    savana ntena dadhara trishtubha ddvadashakapalo bhavati ddvadashakapalo bhavati dvadashakshara jagati
    vaishvadeva ntritiyasavanameva tena dadhara jagati haspatyashcarurbhavati brahma vai devana mbrihaspatirbrahmaiva
    tena dadhara ya shnavastrikapalo bhavati yajno vai vishnuryajnameva tena dadhara ya 'ntarikshameva
    tena sprinoti ya 'mumeva tena lokagg vai~ para atnarah kakshivagm aushijo vitahavya shshrayasastrasadasyuh
    paurukuthsyah prajakama acinvata tato vai te sahasragm sahasra mputranavindanta prathate prajaya pashubhista
    mmatramapnoti ya dadhara trishtubha prajapatiragnimacinuta sa kshurapavirbhutva ndeva bibhyato nopa
    nte chandobhiratmana mbrahma vai chandagmsi brahmana eta shni upanahavupa muncate chandobhireva 'gnimupa
    caratyatmano 'higmsayai devanidhirva esha ni dhiyate yadagni ranye va vai nidhimaguptam vi~ndanti
    na va prati pra janatyukhama kramatyatmanamevadhipa nkurute guptya atho khalvahurna rityukha yadakramennir
    ritya atmanamapi daddhya ''kramya purushashirshamupa dadhati guptya atho yatha bruyadetanme gopayeti
    tadrigeva ta tprajapatirva atharva 'gnireva daddhyannatharvanastasyeshtaka asthanyetagm ha vava tad
    rishirabhyanuvacendro dadhico asthabhiriti yadishtakabhiragni ncinoti satmanamevagni ncinute satmamushmin
    ~loke bhavati ya evam va~ etadagneryaccitya atma vai shvanaro yaccite vai njuhoti sharirameva saggskritya
    'bhyarohati shariram ncinute yaccite vai njuhoti sharirameva saggskritya ''tmana ttasya nava dyanti
    jivanneva devanapyeti vaishvanaryarca purishamupa dadhatiyam shvanarastasyaisha citirya tpurishamagnimeva
    vai ncinuta esha va agneh priya tanurya shvanarah priyamevasya tanuvamava rundhe || agnervai dikshaya
    deva virajamapnuva dvirajamapnoti shad dvirajamapnoti dasha ratri dvirajamapnoti dvadasha ratri dvirajamapnoti
    trayodasha ratri dvirajamapnoti pancadasha ratri tpancadasha va ardhamasasya ratrayo dvirajamapnoti
    saptadasha ratri ddvadasha masah pancartava dvirajamapnoti caturvigmshatigm ratri ccaturvigmshatirardhamasa
    dvirajamapnoti trigmshatagm ratri ttrigmshadakshara vira dvirajamapnoti masa dvirajamapnoti caturo
    maso di 'bibharuste prithivima ''dityaste divama nchandastato vai te vyavrita ddvadasha maso bhritva
    ncinvita dvadasha masa 'gnishcityastasya horatranishtaka apteshtakamena vyavritameva gacchati shraishthyagm
    samanana trigmshatagm ratri suvargaya va esha lokaya ciyate yadagnistam dyajamano hiyeta prithivima
    mprano ma ma hasidantarikshama mpraja ma ma hasi 'kramishagm suvaraganmetyahaisha va agneranvarohastenaivaina
    manvarohati suvargasya lokasya samashtyai ya tpapiyasyasya ''tmanah praja sya mminoti jyayagmsameva
    yajnakratumupaiti nasya ''tmanah papiyasi praja bhavati sahasra ssahasrasammito va ayam lo~ka imameva
    lokamabhi jayati dvishahasra ncinvano dvishahasram mantarikshamevabhi jayati trishahasra trishahasro
    va asau strishahasro va asau loko 'mumeva lokamabhi jayati janudaghna ncinvano gayatriyaivemam lo~kamabhyarohati
    nabhidaghna ncinvita dvitiya ncinvanastrishtubhaiva mabhyarohati grivadaghna ncinvano jagatyaivamun
    ~lokamabhyarohati nagni ncitva ramamupeyadayonau reto dhasyamiti na dvitiya dreto va etanni dhatte
    yadagni ncinute yadupeya dretasa vyriddhyeta 'tho khalvahura prajasya dretassicavupadadhati te eva
    yajamanasya reto bibhritastasma 'skandaya trini vava retagmsi pita putrah pautro ttisra upa dadhati
    retasa va~va prathama retassig vagva iya prano va antariksha mpashyanti na pranamasau tritiya cakshurva
    asau tasma ncopa dadhati manasa maddhyamamesham prananamishto yajno bhrigubhirashirda vasubhistasya
    ta ishtasya vitasya dravineha bhakshiyetyaha stutashastre evaitena duhe pita matarishva 'cchidra pada
    dha acchidra ushijah pada ssomo vishvavinneta nesha dbrihaspatirukthamadani shagmsishadityahaitadva
    agneruktha ntenaivainamanu shagmsati || ssyuratho yatha sava tpratyavarohati tadrigeva tadasandi sadayati
    garbhana ndhritya aprapadayatho savamevaina nkaroti garbho va esha yadukhyo yonih shikyam thshadudyamagm
    shikya mbhavati shodha vihito vai purusha atma ca shirashca catvaryanga mbibharti prajapatirva esha
    yadagnistasyokha colukhala nca stanau tavasya praja upa jivanti yadukha ncopadadhati tabhyameva yajamano
    va~thsaro va esha yadagnistasya tredhavihita ishtakah prajapatya vai 'sya prajapatya yadukhya mbibharti
    prajapatya eva tadupa dhatte ya thsamidha adadhati vaishnava vai vanaspatayo vaishnavireva tadupa
    dhatte yadishtakabhiragni vai~ vishvakarma vaishvakarmanireva tadupa dhatte tasma strivridagniriti
    tam ya~jamana eva cinvita yadasyanya shcinuyadya ndakshinabhirna radhayedagnimasya vrinjita yo ndakshinabhi
    radhayedagnimeva ta va~santenaivasya purvardhamacinuta grishmena dakshina va~rshabhih pucchagm sharadottara
    mpakshagm hemantena maddhya mbrahmana va asya ta rvardhamacinuta kshatrena dakshina mpakshamashaya
    maddhyam ncinuta ritubhirevaina 'tho etadeva sarvamava rundhe shrinvantyena rundhe shrinvantyena ncikyanamattyannagm
    rocata iyam va~va prathama citiroshadhayo vanaspatayah purishamantariksha ndvitiya vayagmsi purishamasau
    tritiya nakshatrani purisham ya~jnashcaturthi dakshina purisham ya~jamanah pancami praja purisham
    tpancacitikashcetavya etadeva sarvagg sprinoti ya trivriddhyagnirya strivriddhyagnirya dyajamanah
    pratishthityai panca citayo bhavanti panktah purusha atmanameva sprinoti panca citayo bhavanti pancabhih
    purishairabhyuhati dasha sa ksharo vai purusho yavaneva purushastagg dvirajyevannadye prati tishthati
    sam va~thsaro vai shashthi citir ritavah purishagm shat citayo bhavanti shat purishani dvadasha sa
    mpadyante dvadasha masa va~thsara eva prati tishthati || rohito dhumrarohitah karkandhurohitaste prajapatya
    babhrurarunababhru shshukababhruste raudra shshyetah shyetaksha shshyetagrivaste pitridevatya stisrah
    krishna vasha varunyastisra ssauryo maitrabar haspatya dhumralalamastuparah || prishniste marutah
    phalgurlohitorni balakshi ta ssarasvatyah prishati sthulaprishati kshudraprishati ta vai shshyama
    vashah paushniyastisro rohinirvasha maitriya aindrabar haspatya arunalalamastuparah || ssamanta shitibahusta
    ai shshitirandhro 'nyatashshitirandhra ssamantashitirandhraste mai ssarvashuddhavalo manivalasta a
    parameshthine somapaushna shshyamalalamastuparah || shitibahuh pancavigmshatih unnata rishabho vamanasta
    ai shshitikakucchitiprishtha shshitipacchityoshthah shitibhrusta ai ndravaishnavastisra shvakarmanyastisro
    dhatre prishodara ai shshyetalalamastuparah || unnatah pancavigmshatih karnastrayo yama ssaumyastrayah
    shvitinga agnaye yavishthaya trayo nakulastisro rohinistryavyasta vasuna 'runa dityauhyasta rudranagm
    somaindra babhrulalamastuparah || shunthastrayo vaishnava adhilodhakarnastrayo vishnava urukramaya
    laphsudinastrayo vishnava urugayaya pancavistisra adityana 'ngirasamaindravaishnava gauralalamastuparah
    || indraya rajne trayah shitiprishtha indraya shshitikakuda indraya svarajne traya dastisrasturyauhyah
    saddhyana ntisrah pashthauhyo vishvesha ndevanamagnendrah krishnalalamastuparah || adityai trayo rohitaita
    indranyai trayah krishnaitah kuhvai 'runaitastisro dhenavo rakayai trayo 'nadvahah sinivalya a gnavaishnava
    rohitalalamastuparah || saumyastrayah pishanga ssomaya rajne trayah sarangah parjanya nabhorupastisro
    'ja malha indranyai tisro meshya aditya dyavaprithivya malanga varunastrayah krishnalalama varunaya
    rajne trayo rohitalalama varunaya rishadase trayo shshilpastrayo vaishvadevastrayah prishnaya ssarvadevatya
    aindrasura shshyetalalamastuparah || mojodabhyamushtara mbaladabhyagm siravahavavi dve dhenu bhaumi
    digbhyo vadabe dve dhenu bhaumi vairaji purushi dve dhenu bhaumi vayava arohanavahavanadvahau varuni
    krishne vashe aradyau divyavrishabhau parimarau || ekadasha pratargavyah pashava a labhyante chagalah
    kalmashah kikidivirvidigayaste tvashtra ssaurirnava shveta vasha anubandhya bhavantyagneya ai shvinaste
    vishalayupa a labhyante || pishangastrayo vasanta ssarangastrayo graishmah prishantastrayo var shikah
    prishnayastrayah sharadah prishnisaktha strayo haimantika avaliptastrayah shaishira va~thsaraya nivakshasah
    || rohitah krishna dhumralalamah prishnih shyama arunalalamah ssiddhma dhatre paushna karna babhrulalamah
    indraya krishnalalama adityai rohita lalamah ravagnervai dikshaya || harih om || || krishna yajurvediya
    taittiriya samhitaya mpancamakande shashthah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्पञ्चमकाण्डे षष्ठः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ हिर॑ण्यवर्णा॒ श्शुच॑यः पाव॒का यासु॑ जा॒तः क॒श्यपो॒ यास्विन्द्रः॑ । अ॒ग्निं न्दधि॒रे विरू॑पा॒स्ता
    न॒ आप॒ स्यो॒ना भ॑वन्तु ॥ यासा॒ग्ं॒ राजा॒ वरु॑णो॒ याति॒ मद्ध्ये॑ सत्यानृ॒ते अ॑व॒पश्य॒न् जना॑नाम् ।
    म॒धु॒श्चुत॒ श्शुच॑यो॒ याः पा॑व॒कास्ता न॒ आप॒ स्यो॒ना भ॑वन्तु ॥ यासा न्दे॒वा दि॒वि कृ॒ण्वन्ति॑ भ॒क्षं
    याँ अ॒न्तरि॑क्षे बहु॒धा भव॑न्ति । याः पृ॑थि॒वी स्यो॒ना भ॑वन्तु ॥ शि॒वेन॑ मा॒ चक्षु॑षा पश्यता श्शि॒वया॑
    त॒नुवोप॑ स्पृशत॒ त्वच॑ म्मे । सर्वाग्ं॑ अ॒ग्नीग्ं र॑फ्सु॒षदो॑ हुवे वो॒ मयि॒ वर्चो॒ बल॒मोजो॒ नि ध॑त्त
    ॥ यद॒द म्प्रय॒तीरहा॒ वन॑दताह॒ते । तस्मा॒दा न॒द्यो॑ नाम॑ स्थ॒ ता वो॒ नामा॑नि सिन्धवः ॥ य त्प्रेषि॑ता॒
    वरु॑णेन॒ ता श्शीभग्ं॑ स॒मव॑ल्गत । दापो॒ अनु॑ स्थन ॥ अ॒प॒का॒मग्ग् स्यन्द॑माना॒ अवी॑वरत वो॒ हिक द्वार्णाम॑
    वो हि॒तम् ॥ एको॑ दे॒वो अप्य॑तिष्ठ॒ थ्स्यन्द॑माना यथा व॒शम् । उदा॑निषु मु॑च्यते ॥ आपो॑ भ॒द्रा घृ॒तमिदाप॑
    आसुर॒ग्नी षोमौ॑ बिभ्र॒त्याप॒ इ त्ताः । ती॒व्रो रसो॑ मधु॒पृचा॑ प्रा॒णेन॑ स॒ह वर्च॑सा गन्न् ॥ आदि त्प॑श्याम्यु॒त
    वा॑ शृणो॒म्या मा॒ घोषो॑ गच्छति॒ वान्न॑ आसाम् । मन्ये॑ भेजा॒नो अ॒मृत॑स्य॒ तर् हि॒ हिर॑ण्यवर्णा॒ अतृ॑पं
    यँ॒दा वः॑ ॥ आपो॒ हि ष्ठा म॑यो॒ भुव॒स्ता न॑ ऊ॒र्जे द॑धातन । म॒हे रणा॑य॒ चक्ष॑से ॥ यो वः॑ शि॒वत॑मो॒
    रस॒स्तस्य॑ भाजयते॒ह नः॑ । उ॒श॒तीरि॑व मा॒तरः॑ ॥ तस्मा॒ अर॑ ङ्गमाम वो॒ यस्य॒ क्षया॑य॒ जिन्व॑थ । आपो॑
    ज॒नय॑था च नः ॥ दि॒वि श्र॑य स्वा॒न्तरि॑क्षे यतस्व पृथि॒व्या स सम॑सि ब्रह्मवर्च॒साय॑ त्वा ॥ न्गृह्णात्ये॒तद्वाव
    रा॑ज॒सूयं॒ ऽग्निर्व॑रुणस॒वो रा॑ज॒सूय॑ ऽथो॑ उ॒भावे॒व लो॒काव॒भि ज॑यति॒ यश्च॑ राज॒सूये॑नेजा॒नस्य॒ यश्चा
    ऽग्नि॒चित॒ आपो॑ भव॒न्त्यापो॒ वा अ॒ग्नेर्भ्रातृ॑व्या॒ यद॒पो ऽग्नेर॒धस्ता॑दुप॒ दधा॑ति॒ भ्रातृ॑व्याभिभूत्यै॒
    भव॑त्या॒त्मना॒ परा ऽस्य॒ भ्रातृ॑व्यो भवत्य॒मृतं॒ भ्रातृ॑व्यो भवत्य॒मृत ऽऽर्ति॒मार्च्छ॑ति॒ सर्व॒मायु॑रेति॒
    यस्यै॒ता उ॑पधी॒यन्ते॒ य उ॑ चैना ए॒वं न्भ॑वति॒ यस्यै॒ता उ॑पधी॒यन्ते॒ य उ॑ चैना ए॒वं वेँद॒ द्वाद॑श भवन्ति॒
    द्वाद॑श॒ मासा अन्न॒मव॑ रुन्धे॒ पात्रा॑णि भवन्ति॒ पात्रे॒ वा अन्न॑मद्यते॒ सयो न्ये॒वान्न॒मव॑ रुन्ध॒
