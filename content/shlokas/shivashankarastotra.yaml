id: shivashankarastotra
category: stotram
name:
  english: shivashankarastotra
  devanagari: शिवशन्करस्तोत्र
content:
  english: atidurnaya catulendriya ripu sancaya dalite pavi karkasha katu jalpita khalagarhana calite
    | shivaya saha mamacetasi shashishekhara nivasan shivashankara shivashankara hara me hara duritam
    || 13|| bhavabhanjana suraranjana khalavancana purahan danujantaka madanantaka ravijantaka bhagavan
    | girijavara karunakara parameshvara bhayahan shivashankara shivashankara hara me hara duritam ||
    14|| shakrashasana kratushasana caturashrama vishaye kali vigrahabhavadurgraharipudurbala samaye |
    dvija kshatriya vanitashishudara kampita hridaye shivashankara shivashankara hara me hara duritam
    || 15|| bhava sambhava vividhamaya paripidita vapusham dayitatmaja mamatabhara kalushikrita hridayam
    | kuru mam nija caranarcana niratam bhava satatam shivashankara shivashankara hara me hara duritam
    || 16||
  devanagari: अतिदुर्नय चटुलेन्द्रिय रिपु सञ्चय दलिते पवि कर्कश कटु जल्पित खलगर्हण चलिते । शिवया सह ममचेतसि
    शशिशेखर निवसन् शिवशङ्कर शिवशङ्कर हर मे हर दुरितम् ॥ १३॥ भवभञ्जन सुररञ्जन खलवञ्चन पुरहन् दनुजान्तक
    मदनान्तक रविजान्तक भगवन् । गिरिजावर करुणाकर परमेश्वर भयहन् शिवशङ्कर शिवशङ्कर हर मे हर दुरितम् ॥ १४॥
    शक्रशासन क्रतुशासन चतुराश्रम विषये कलि विग्रहभवदुर्ग्रहरिपुदुर्बल समये । द्विज क्षत्रिय वनिताशिशुदर
    कम्पित हृदये शिवशङ्कर शिवशङ्कर हर मे हर दुरितम् ॥ १५॥ भव सम्भव विविधामय परिपीडित वपुषं दयितात्मज ममताभर
    कलुषीकृत हृदयम् । कुरु मां निज चरणार्चन निरतं भव सततम् शिवशङ्कर शिवशङ्कर हर मे हर दुरितम् ॥ १६॥
