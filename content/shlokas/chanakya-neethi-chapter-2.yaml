id: chanakya-neethi-chapter-2
category: stotram
name:
  english: Chanakya Neethi - Chapter 2
content:
  english: anritam sahasam maya murkhatvamatilobhita | ashaucatvam nirdayatvam strinam doshah svabhavajah
    || || bhojyam bhojanashaktishca ratishaktirvarangana | vibhavo danashaktishca nalpasya tapasah phalam
    || || yasya putro vashibhuto bharya chandanugamini | vibhave yashca santushtastasya svarga ihaiva
    hi || || te putra ye piturbhaktah sa pita yastu poshakah | tanmitram yatra vishvasah sa bharya yatra
    nirvritih || || parokshe karyahantaram pratyakshe priyavadinam | varjayettadrisham mitram vishakumbham
    payomukham || || na vishvasetkumitre ca mitre capi na vishvaset | kadacitkupitam mitram sarvam guhyam
    prakashayet || || manasa cintitam karyam vaca naiva prakashayet | mantrena rakshayedgudham karye capi
    niyojayet || || kashtam ca khalu murkhatvam kashtam ca khalu yauvanam | kashtatkashtataram caiva paragehanivasanam
    || || shaile shaile ca manikyam mauktikam na gaje gaje | sadhavo na hi sarvatra candanam na vane vane
    || || putrashca vividhaih shilairniyojyah satatam budhaih | nitijnah shilasampanna bhavanti kulapujitah
    || || mata shatruh pita vairi yabhyam bala na pathitah | sabhamadhye na shobhante hamsamadhye bako
    yatha || || lalanadbahavo doshastadane bahavo gunah | tasmatputram ca shishyam ca tadayenna tu lalayet
    || || shlokena va tadardhena tadardhardhaksharena va | abandhyam divasam kuryaddanadhyayanakarmabhih
    || || kantaviyogah svajanapamanam rinasya shesham kunripasya seva | daridryabhavadvimukham ca mitram
    vinagnina panca dahanti kayam || || naditire ca ye vrikshah parageheshu kamini | mantrahinashca rajanah
    shighram nashyantyasamshayam || || balam vidya ca vipranam rajnam sainyam balam tatha | balam vittam
    ca vaishyanam shudranam paricaryakam || || nirdhanam purusham veshya praja bhagnam nripam tyajet |
    khaga vitaphalam vriksham bhuktva cabhyagato griham || || grihitva dakshinam viprastyajanti yajamanakam
    | praptavidya gurum shishya dagdharanyam mrigastatha || || duracari duradrishtirduravasi ca durjanah
    | yanmaitri kriyate pumbhirnarah shighram vinashyati || || samane shobhate pritih rajni seva ca shobhate
    | vanijyam vyavahareshu divya stri shobhate grihe ||
  devanagari: अनृतं साहसं माया मूर्खत्वमतिलोभिता । अशौचत्वं निर्दयत्वं स्त्रीणां दोषाः स्वभावजाः ॥ ॥ भोज्यं
    भोजनशक्तिश्च रतिशक्तिर्वराङ्गना । विभवो दानशक्तिश्च नाल्पस्य तपसः फलम् ॥ ॥ यस्य पुत्रो वशीभूतो भार्या
    छन्दानुगामिनी । विभवे यश्च सन्तुष्टस्तस्य स्वर्ग इहैव हि ॥ ॥ ते पुत्रा ये पितुर्भक्ताः स पिता यस्तु
    पोषकः । तन्मित्रं यत्र विश्वासः सा भार्या यत्र निर्वृतिः ॥ ॥ परोक्षे कार्यहन्तारं प्रत्यक्षे प्रियवादिनम्
    । वर्जयेत्तादृशं मित्रं विषकुम्भं पयोमुखम् ॥ ॥ न विश्वसेत्कुमित्रे च मित्रे चापि न विश्वसेत् । कदाचित्कुपितं
    मित्रं सर्वं गुह्यं प्रकाशयेत् ॥ ॥ मनसा चिन्तितं कार्यं वाचा नैव प्रकाशयेत् । मन्त्रेण रक्षयेद्गूढं
    कार्ये चापि नियोजयेत् ॥ ॥ कष्टं च खलु मूर्खत्वं कष्टं च खलु यौवनम् । कष्टात्कष्टतरं चैव परगेहनिवासनम्
    ॥ ॥ शैले शैले च माणिक्यं मौक्तिकं न गजे गजे । साधवो न हि सर्वत्र चन्दनं न वने वने ॥ ॥ पुत्राश्च विविधैः
    शीलैर्नियोज्याः सततं बुधैः । नीतिज्ञाः शीलसम्पन्ना भवन्ति कुलपूजिताः ॥ ॥ माता शत्रुः पिता वैरी याभ्यां
    बाला न पाठिताः । सभामध्ये न शोभन्ते हंसमध्ये बको यथा ॥ ॥ लालनाद्बहवो दोषास्ताडने बहवो गुणाः । तस्मात्पुत्रं
    च शिष्यं च ताडयेन्न तु लालयेत् ॥ ॥ श्लोकेन वा तदर्धेन तदर्धार्धाक्षरेण वा । अबन्ध्यं दिवसं कुर्याद्दानाध्ययनकर्मभिः
    ॥ ॥ कान्तावियोगः स्वजनापमानं ऋणस्य शेषं कुनृपस्य सेवा । दारिद्र्यभावाद्विमुखं च मित्रं विनाग्निना
    पञ्च दहन्ति कायम् ॥ ॥ नदीतीरे च ये वृक्षाः परगेहेषु कामिनी । मन्त्रहीनाश्च राजानः शीघ्रं नश्यन्त्यसंशयम्
    ॥ ॥ बलं विद्या च विप्राणां राज्ञां सैन्यं बलं तथा । बलं वित्तं च वैश्यानां शूद्राणां पारिचर्यकम् ॥
    ॥ निर्धनं पुरुषं वेश्या प्रजा भग्नं नृपं त्यजेत् । खगा वीतफलं वृक्षं भुक्त्वा चाभ्यागतो गृहम् ॥ ॥
    गृहीत्वा दक्षिणां विप्रास्त्यजन्ति यजमानकम् । प्राप्तविद्या गुरुं शिष्या दग्धारण्यं मृगास्तथा ॥ ॥
    दुराचारी दुरादृष्टिर्दुरावासी च दुर्जनः । यन्मैत्री क्रियते पुम्भिर्नरः शीघ्रं विनश्यति ॥ ॥ समाने
    शोभते प्रीतिः राज्ञि सेवा च शोभते । वाणिज्यं व्यवहारेषु दिव्या स्त्री शोभते गृहे ॥
