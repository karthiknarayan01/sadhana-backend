    ॐ सत्यपराय नमः । ॐ सत्यधर्मानुषङ्गकाय नमः । ॐ नारायणकृपाव्यूहतेजश्चक्राय नमः । ॐ सुदर्शनाय नमः । परब्रह्मणे
    नमः । ॥ श्री सुदर्शनाष्टोत्तरशतनामावलिः सम्पूर्णा ॥
