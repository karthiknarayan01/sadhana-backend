id: sarasvatistotra
category: stotram
name:
  english: sarasvatistotra
  devanagari: सरस्वतिस्तोत्र
content:
  english: sakalagamabhashitabhinnapadam | paripuritavishvamanekabhavam tava naumi sarasvati padayugam
    || 5|| paripurnamanorathadhamanidhim paramarthavicaravivekavidhim | surayoshitasevitapadatalam tava
    naumi sarasvati padayugam || 6|| suramaulimanidyutishubhrakaram vishayadimahabhayavarnaharam | nijakantivilomitacandrashivam
  devanagari: सकलागमभाषितभिन्नपदम् । परिपूरितविश्वमनेकभवं तव नौमि सरस्वति पादयुगम् ॥ ५॥ परिपूर्णमनोरथधामनिधिं
    परमार्थविचारविवेकविधिम् । सुरयोषितसेवितपादतलं तव नौमि सरस्वति पादयुगम् ॥ ६॥ सुरमौलिमणिद्युतिशुभ्रकरं
    विषयादिमहाभयवर्णहरम् । निजकान्तिविलोमितचन्द्रशिवं
meaning: {}
