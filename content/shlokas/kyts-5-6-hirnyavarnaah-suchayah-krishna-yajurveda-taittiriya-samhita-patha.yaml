    पि॒शङ्गा॒ स्सोमा॑य॒ राज्ञे॒ त्रयः॑ सा॒रङ्गाः पार्ज॒न्या नभो॑रूपास्ति॒स्रो॑ ऽजा म॒ल्॒हा इ॑न्द्रा॒ण्यै
