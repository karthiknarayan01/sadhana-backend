id: shivaproktamganeshastotram
category: stotram
name:
  english: shivaproktamganeshastotram
  devanagari: शिवप्रोक्तंगणेशस्तोत्रम्
content:
  english: 50|| rishinam devatanam ca nayakatvam prakashitam || 51|| iti stutah surairagre pujyase tvam
    bhavatmaja | tvamaradhya ganadhyakshamibhavaktrasamaprabham || 52|| dhruvam ca nishcalam shantam paritam
    vijayashriya | karyartham raktakusumai raktacandanavaribhih || 53|| raktambaradharo bhutva caturthyamarcayettu
    yah | ekakalam dvikalam va niyato niyatashanah || 54|| rajanam rajaputram va rajamantrinameva ca |
    rajyam va sarvavighnesho vashikuryatsarashtrakam || 55|| yatphalam sarvatirtheshu sarvayajneshu yatphalam
    | sa tatphalamavapnoti smritva devam vinayakam || 56|| vishamam na bhavettasya na sa gacchetparabhavam
    | na ca vighnam bhavettasya jano jatismaro bhavet || 57|| ya idam pathati stotram shadbhirmasairvaram
    labhet | samvatsarena siddhim ca labhate natra samshayah || 58|| prasadaddarshanam yati tasya someshvarah
    prabhuh | kapardakaramudaram yato'sya samudahritam | tato'sya nama janihi kapardditi mahatmanah ||
    59|| iti shriskandapurane prabhasakhande prabhasakshetramahatmye ashtatrimshadhyayantargatam shivaproktam
    ganeshastotram samaptam | skandapurana | prabhasakhanda | adhyaya 38
  devanagari: ५०॥ ऋषीणां देवतानां च नायकत्वं प्रकाशितम् ॥ ५१॥ इति स्तुतः सुरैरग्रे पूज्यसे त्वं भवात्मज
    । त्वामाराध्य गणाध्यक्षमिभवक्त्रसमप्रभम् ॥ ५२॥ ध्रुवं च निश्चलं शान्तं परीतं विजयश्रिया । कार्यार्थं
    रक्तकुसुमै रक्तचन्दनवारिभिः ॥ ५३॥ रक्ताम्बरधरो भूत्वा चतुर्थ्यामर्चयेत्तु यः । एककालं द्विकालं वा
    नियतो नियताशनः ॥ ५४॥ राजानं राजपुत्रं वा राजमन्त्रिणमेव च । राज्यं वा सर्वविघ्नेशो वशीकुर्यात्सराष्ट्रकम्
    ॥ ५५॥ यत्फलं सर्वतीर्थेषु सर्वयज्ञेषु यत्फलम् । स तत्फलमवाप्नोति स्मृत्वा देवं विनायकम् ॥ ५६॥ विषमं
    न भवेत्तस्य न स गच्छेत्पराभवम् । न च विघ्नं भवेत्तस्य जनो जातिस्मरो भवेत् ॥ ५७॥ य इदं पठति स्तोत्रं
    षड्भिर्मासैर्वरं लभेत् । संवत्सरेण सिद्धिं च लभते नात्र संशयः ॥ ५८॥ प्रसादाद्दर्शनं याति तस्य सोमेश्वरः
    प्रभुः । कपर्दाकारमुदरं यतोऽस्य समुदाहृतम् । ततोऽस्य नाम जानीहि कपर्द्दीति महात्मनः ॥ ५९॥ इति श्रीस्कन्दपुराणे
    प्रभासखण्डे प्रभासक्षेत्रमाहात्म्ये अष्टत्रिंशाध्यायान्तर्गतं शिवप्रोक्तं गणेशस्तोत्रं समाप्तम् ।
    स्कन्दपुराण । प्रभासखण्ड । अध्याय ३८
