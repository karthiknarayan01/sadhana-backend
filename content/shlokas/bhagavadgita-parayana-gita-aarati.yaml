id: bhagavadgita-parayana-gita-aarati
category: stotram
name:
  english: Bhagavadgita Parayana - Gita Aarati
content:
  english: gite | hari hiya kamala viharini sundara supunite || om jaya bhagavad gite || karma sukarma
    prakashini kamasaktihara | tattvajnana vikashini vidya brahma para || om jaya bhagavad gite || nishcala
    bhakti vidhayini nirmala malahari | sharana rahasya pradayini saba vidhi sukhakari || om jaya bhagavad
    gite || raga dvesha vidarini karini moda sada| bhava bhaya harini tarini paramanandaprada || om jaya
    bhagavad vinashini nashini tama rajani | daivi sadguna dayini hari rasika sajani || om jaya bhagavad
    gite || samata tyaga sikhavani harimukha ki vani | sakala shastra ki svamini shrutiyom ki rani ||
    om jaya bhagavad sudha barasavani matu kripa kijai | haripada prema pradayini apano kara lijai ||
    om jaya bhagavad gite || om jaya bhagavadgite mayya jaya bhagavad gite| hari hiya kamala viharini
    sundara supunite || om jaya bhagavad
  devanagari: गीते । हरि हिय कमल विहारिणि सुन्दर सुपुनीते ॥ ॐ जय भगवद् गीते ॥ कर्म सुकर्म प्रकाशिनि कामासक्तिहरा
    । तत्त्वज्ञान विकाशिनि विद्या ब्रह्म परा ॥ ॐ जय भगवद् गीते ॥ निश्चल भक्ति विधायिनि निर्मल मलहारी ।
    शरण रहस्य प्रदायिनि सब विधि सुखकारी ॥ ॐ जय भगवद् गीते ॥ राग द्वेष विदारिणि कारिणि मोद सदा। भव भय हारिणि
    तारिणि परमानन्दप्रदा ॥ ॐ जय भगवद् विनाशिनि नाशिनि तम रजनी । दैवी सद्गुण दायिनि हरि रसिका सजनी ॥ ॐ
    जय भगवद् गीते ॥ समता त्याग सिखावनि हरिमुख की वाणी । सकल शास्त्र की स्वामिनि श्रुतियों की रानी ॥ ॐ
    जय भगवद् सुधा बरसावनि मातु कृपा कीजै । हरिपद प्रेम प्रदायिनि अपनो कर लीजै ॥ ॐ जय भगवद् गीते ॥ ॐ जय
    भगवद्गीते मय्या जय भगवद् गीते। हरि हिय कमल विहारिणि सुन्दर सुपुनीते ॥ ॐ जय भगवद्
