id: devi-mahatmyam-durga-saptasati-chapter-12
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 12
content:
  english: phalashrutirnama dvadasho'dhyayah || dhyanam vidhyuddhama samaprabham mrigapati skandha sthitam
    bhishanam| kanyabhih karavala kheta vilasaddastabhi rasevitam hastaishcakra gadhasi kheta vishikham
    gunam tarjanim vibhrana manalatmikam shishidharam durgam trinetram bhaje devyuvaca|| || ebhih stavaishca
    ma nityam stoshyate yah samahitah| tasyaham sakalam badham nashayishyamya samshayam || || madhukaitabhanasham
    ca mahishasuraghatanam| kirtiyishyanti ye ta dvadvadham shumbhanishumbhayoh || || ashtamyam ca caturdhashyam
    navamyam caikacetasah| shroshyanti caiva ye bhaktya mama mahatmyamuttamam || || na tesham dushkritam
    kincid dushkritottha na capadah| bhavishyati na daridryam na cai veshtaviyojanam || || shatrubhyo
    na bhayam tasya dasyuto va na rajatah| na shastranalato yaughat kadacit sambhavishyati || || tasmanmamaitanmahatmyam
    pathitavyam samahitaih| shrotavyam ca sada bhaktya param svastyayanam hi tat || || upa sargana sheshamstu
    mahamari samudbhavan| tatha trividha mutpatam mahatmyam shamayenmama || || yatraita tpathyate samyannityamayatane
    mama| sada na tadvimokshyami sannidhyam tatra mesthitam || || bali pradane pujayamagni karye mahotsave|
    sarvam mamaitanmahatmyam uccaryam shravyamevaca || || janatajanata vapi bali pujam tatha kritam| pratikshishyamyaham
    pritya vahni homam tatha kritam || || sharatkale mahapuja kriyate yaca varshiki| tasyam mamaitanmahatmyam
    shrutva bhaktisamanvitah || || sarvabadhavinirmukto dhanadhanyasamanvitah| manushyo matprasadena bhavishyati
    na samshayah|| || shrutva mamaitanmahatmyam tatha cotpattayah shubhah| parakramam ca yuddheshu jayate
    nirbhayah puman|| || ripavah sankshayam yanti kalyanam copapadhyate| nandate ca kulam pumsam mahatmyam
    mamashrinvatam|| || shantikarmani sarvatra tatha duhsvapnadarshane| grahapidasu cograsu mahatmyam
    shrinuyanmama|| || upasargah shamam yanti grahapidashca darunah duhsvapnam ca nribhirdrishtam susvapnamupajayate||
    || balagrahabhibhutanam balanam shantikarakam| sanghatabhede ca nrinam maitrikaranamuttamam|| || durvrittanamasheshanam
    balahanikaram param| rakshobhutapishacanam pathanadeva nashanam|| || sarvam mamaitanmahatmyam mama
    sannidhikarakam| pashupushparghyadhupaishca gandhadipaistathottamaih|| || vipranam bhojanairhomaih
    pròkshaniyairaharnisham| anyaishca vividhairbhogaih pradanairvatsarena ya|| || pritirme kriyate sasmin
    sakriduccarite shrute| shrutam harati papani tatharogyam prayacchati|| || raksham karoti bhutebhyo
    janmanam kirtinam mama| yuddeshu caritam yanme dushta daitya nibarhanam|| || tasminchrite vairikritam
    bhayam pumsam na jayate| yushmabhih stutayo yashca yashca brahmarshibhih kritah|| || brahmana ca kritastastu
    prayacchantu shubham matim| aranye prantare vapi davagni parivaritah|| || dasyubhirva vritah shunye
    grihito vapi shatribhih| simhavyaghranuyato va vaneva vana hastibhih|| || rajna kruddena cajnapto
    vadhyo banda gato'piva| aghurnito va vatena sthitah pote maharnave|| || patatsu capi shastreshu sangrame
    bhrishadarune| sarvabadhashu ghorasu vedanabhyardito'piva|| || smaran mamaitaccaritam naro mucyeta
    sankatat| mama prabhavatsimhadya dasyavo vairina statha|| || duradeva palayante smaratashcaritam mama||
    || ityuktva sa bhagavati candika candavikrama| pashyatam sarva devanam tatraivantaradhiyata|| || te'pi
    deva niratankah svadhikaranyatha pura| yajnabhagabhujah sarve cakrurvi nihatarayah|| || daityashca
    devya nihate shumbhe devaripa'u yudhi jagadvidhvamsake tasmin mahogre'tula vikrame|| || nishumbhe
    ca mahavirye sheshah patalamayayuh|| || evam bhagavati devi sa nityapi punah punah| sambhuya kurute
    bhupa jagatah paripalanam|| || tayaitanmohyate vishvam saiva vishvam prasuyate| sayacita ca vijnanam
    tushta riddhim prayacchati|| || vyaptam tayaitatsakalam brahmandam manujeshvara| mahadevya mahakali
    mahamari svarupaya|| || saiva kale mahamari saiva srishtirbhavatyaja| sthitim karoti bhutanam saiva
    kale sanatani|| || bhavakale nrinam saiva lakshmirvriddhiprada grihe| saivabhave tatha lakshmi rvinashayopajayate||
    || stuta sampujita pushpairgandhadhupadibhistatha| dadati vittam putramshca matim dharme gatim shubham||
    || || iti shri markandeya purane savarnike manvantare devi mahatmye phalashrutirnama dvadasho'dhyaya
    samaptam || ahuti om klim jayanti sangayai sashaktikayai saparivarayai savahanayai varapradhayai vaishnavi
    devyai ahahutim samarpayami namah svaha ||
  devanagari: फलश्रुतिर्नाम द्वादशोऽध्यायः ॥ ध्यानं विध्युद्धाम समप्रभां मृगपति स्कन्ध स्थितां भीषणां।
    कन्याभिः करवाल खेट विलसद्दस्ताभि रासेवितां हस्तैश्चक्र गधासि खेट विशिखां गुणं तर्जनीं विभ्राण मनलात्मिकां
    शिशिधरां दुर्गां त्रिनेत्रां भजे देव्युवाच॥ ॥ एभिः स्तवैश्च मा नित्यं स्तोष्यते यः समाहितः। तस्याहं
    सकलां बाधां नाशयिष्याम्य संशयम् ॥ ॥ मधुकैटभनाशं च महिषासुरघातनम्। कीर्तियिष्यन्ति ये त द्वद्वधं शुम्भनिशुम्भयोः
    ॥ ॥ अष्टम्यां च चतुर्धश्यां नवम्यां चैकचेतसः। श्रोष्यन्ति चैव ये भक्त्या मम माहात्म्यमुत्तमम् ॥ ॥
    न तेषां दुष्कृतं किञ्चिद् दुष्कृतोत्था न चापदः। भविष्यति न दारिद्र्यं न चै वेष्टवियोजनम् ॥ ॥ शत्रुभ्यो
    न भयं तस्य दस्युतो वा न राजतः। न शस्त्रानलतो यौघात् कदाचित् सम्भविष्यति ॥ ॥ तस्मान्ममैतन्माहत्म्यं
    पठितव्यं समाहितैः। श्रोतव्यं च सदा भक्त्या परं स्वस्त्ययनं हि तत् ॥ ॥ उप सर्गान शेषांस्तु महामारी
    समुद्भवान्। तथा त्रिविध मुत्पातं माहात्म्यं शमयेन्मम ॥ ॥ यत्रैत त्पठ्यते सम्यङ्नित्यमायतने मम। सदा
    न तद्विमोक्ष्यामि सान्निध्यं तत्र मेस्थितम् ॥ ॥ बलि प्रदाने पूजायामग्नि कार्ये महोत्सवे। सर्वं ममैतन्माहात्म्यं
    उच्चार्यं श्राव्यमेवच ॥ ॥ जानताजानता वापि बलि पूजां तथा कृताम्। प्रतीक्षिष्याम्यहं प्रीत्या वह्नि
    होमं तथा कृतम् ॥ ॥ शरत्काले महापूजा क्रियते याच वार्षिकी। तस्यां ममैतन्माहात्म्यं श्रुत्वा भक्तिसमन्वितः
    ॥ ॥ सर्वबाधाविनिर्मुक्तो धनधान्यसमन्वितः। मनुष्यो मत्प्रसादेन भविष्यति न संशयः॥ ॥ श्रुत्वा ममैतन्माहात्म्यं
    तथा चोत्पत्तयः शुभाः। पराक्रमं च युद्धेषु जायते निर्भयः पुमान्॥ ॥ रिपवः सङ्क्षयं यान्ति कल्याणां चोपपध्यते।
    नन्दते च कुलं पुंसां महात्म्यं ममशृण्वताम्॥ ॥ शान्तिकर्माणि सर्वत्र तथा दुःस्वप्नदर्शने। ग्रहपीडासु
    चोग्रासु महात्म्यं शृणुयान्मम॥ ॥ उपसर्गाः शमं यान्ति ग्रहपीडाश्च दारुणाः दुःस्वप्नं च नृभिर्दृष्टं
    सुस्वप्नमुपजायते॥ ॥ बालग्रहाभिभूतानं बालानां शान्तिकारकम्। सङ्घातभेदे च नृणां मैत्रीकरणमुत्तमम्॥ ॥
    दुर्वृत्तानामशेषाणां बलहानिकरं परम्। रक्षोभूतपिशाचानां पठनादेव नाशनम्॥ ॥ सर्वं ममैतन्माहात्म्यं मम
    सन्निधिकारकम्। पशुपुष्पार्घ्यधूपैश्च गन्धदीपैस्तथोत्तमैः॥ ॥ विप्राणां भोजनैर्होमैः प्रॊक्षणीयैरहर्निशम्।
    अन्यैश्च विविधैर्भोगैः प्रदानैर्वत्सरेण या॥ ॥ प्रीतिर्मे क्रियते सास्मिन् सकृदुच्चरिते श्रुते। श्रुतं
    हरति पापानि तथारोग्यं प्रयच्छति॥ ॥ रक्षां करोति भूतेभ्यो जन्मनां कीर्तिनं मम। युद्देषु चरितं यन्मे
    दुष्ट दैत्य निबर्हणम्॥ ॥ तस्मिञ्छृते वैरिकृतं भयं पुंसां न जायते। युष्माभिः स्तुतयो याश्च याश्च ब्रह्मर्षिभिः
    कृताः॥ ॥ ब्रह्मणा च कृतास्तास्तु प्रयच्छन्तु शुभां मतिम्। अरण्ये प्रान्तरे वापि दावाग्नि परिवारितः॥
    ॥ दस्युभिर्वा वृतः शून्ये गृहीतो वापि शतृभिः। सिंहव्याघ्रानुयातो वा वनेवा वन हस्तिभिः॥ ॥ राज्ञा क्रुद्देन
    चाज्ञप्तो वध्यो बन्द गतोऽपिवा। आघूर्णितो वा वातेन स्थितः पोते महार्णवे॥ ॥ पतत्सु चापि शस्त्रेषु सङ्ग्रामे
    भृशदारुणे। सर्वाबाधाशु घोरासु वेदनाभ्यर्दितोऽपिवा॥ ॥ स्मरन् ममैतच्चरितं नरो मुच्येत सङ्कटात्। मम प्रभावात्सिंहाद्या
    दस्यवो वैरिण स्तथा॥ ॥ दूरादेव पलायन्ते स्मरतश्चरितं मम॥ ॥ इत्युक्त्वा सा भगवती चण्डिका चण्डविक्रमा।
    पश्यतां सर्व देवानां तत्रैवान्तरधीयत॥ ॥ तेऽपि देवा निरातङ्काः स्वाधिकारान्यथा पुरा। यज्ञभागभुजः सर्वे
    चक्रुर्वि निहतारयः॥ ॥ दैत्याश्च देव्या निहते शुम्भे देवरिपऽउ युधि जगद्विध्वंसके तस्मिन् महोग्रेऽतुल
    विक्रमे॥ ॥ निशुम्भे च महावीर्ये शेषाः पातालमाययुः॥ ॥ एवं भगवती देवी सा नित्यापि पुनः पुनः। सम्भूय
    कुरुते भूप जगतः परिपालनम्॥ ॥ तयैतन्मोह्यते विश्वं सैव विश्वं प्रसूयते। सायाचिता च विज्ञानं तुष्टा
    ऋद्धिं प्रयच्छति॥ ॥ व्याप्तं तयैतत्सकलं ब्रह्माण्डं मनुजेश्वर। महादेव्या महाकाली महामारी स्वरूपया॥
    ॥ सैव काले महामारी सैव सृष्तिर्भवत्यजा। स्थितिं करोति भूतानां सैव काले सनातनी॥ ॥ भवकाले नृणां सैव
    लक्ष्मीर्वृद्धिप्रदा गृहे। सैवाभावे तथा लक्ष्मी र्विनाशायोपजायते॥ ॥ स्तुता सम्पूजिता पुष्पैर्गन्धधूपादिभिस्तथा।
    ददाति वित्तं पुत्रांश्च मतिं धर्मे गतिं शुभां॥ ॥ ॥ इति श्री मार्कण्डेय पुराणे सावर्निके मन्वन्तरे
    देवी महत्म्ये फलश्रुतिर्नाम द्वादशोऽध्याय समाप्तम् ॥ आहुति ॐ क्लीं जयन्ती साङ्गायै सशक्तिकायै सपरिवारायै
    सवाहनायै वरप्रधायै वैष्णवी देव्यै अहाहुतिं समर्पयामि नमः स्वाहा ॥
