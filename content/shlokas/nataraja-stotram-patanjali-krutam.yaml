id: nataraja-stotram-patanjali-krutam
category: stotram
name:
  english: Nataraja Stotram (Patanjali Krutam)
content:
  english: atha caranashringarahita shri nataraja stotram sadancita mudancita nikuncita padam jhalajhalam
    calita manju katakam | patanjali driganjana macancalapadam janana bhanjana karam | kadambarucimambaravasam
    paramamambuda kadamba kavidambaka galam cidambudhi manim budha hridambuja ravim para cidambara natam
    hridi bhaja || mantarahitam virincisurasamhatipurandhara vicintitapadam tarunacandramakutam | param
    pada vikhanditayamam bhasita manditatanum madanavancana param cirantanamamum pranavasancitanidhim
    para cidambara natam hridi bhaja || || avantamakhilam jagadabhanga gunatungamamatam dhritavidhum surasarit
    taranga nikurumba dhriti lampata jatam shamanadambhasuharam bhavaharam | shivam dashadigantara vijrimbhitakaram
    karalasanmrigashishum pashupatim haram shashidhananjayapatanganayanam para cidambara natam hridi bhaja
    || || anantanavaratnavilasatkatakakinkinijhalam jhalajhalam jhalaravam mukundavidhi hastagatamaddala
    layadhvanidhimiddhimita nartana padam | shakuntaratha barhiratha nandimukha bhringiritisanghanikatam
    bhayaharam sananda sanaka pramukha vandita padam para cidambara natam hridi bhaja || || anantamahasam
    tridashavandya caranam muni hridantara vasantamamalam kabandha viyadindvavani gandhavaha vahnimakha
    bandhuravimanju vapusham | anantavibhavam trijagadantara manim trinayanam tripura khandana param sananda
    muni vandita padam sakarunam para cidambara natam hridi bhaja || || acintyamalivrinda ruci bandhuragalam
    kurita kunda nikurumba dhavalam mukunda sura vrinda bala hantri krita vandana lasantamahikundala dharam
    | akampamanukampita ratim sujana mangalanidhim gajaharam pashupatim dhananjaya nutam pranata ranjanaparam
    para cidambara natam hridi bhaja || || param suravaram puraharam pashupatim janita dantimukha shanmukhamamum
    mridam kanaka pingala jatam sanaka pankaja ravim sumanasam himarucim | asanghamanasam jaladhi janmagaralam
    kavalayanta matulam gunanidhim sananda varadam shamitamindu vadanam para cidambara natam hridi bhaja
    || || ajam kshitiratham bhujagapungavagunam kanaka shringi dhanusham karalasat kuranga prithu tanka
    parashum rucira kunkuma rucim damarukam ca dadhatam | mukunda vishikham namadavandhya phaladam nigama
    vrinda turagam nirupamam sa candikamamum jhatiti samhritapuram para cidambara natam hridi bhaja ||
    || anangaparipanthinamajam kshiti dhurandharamalam karunayantamakhilam jvalantamanalam dadhatamantakaripum
    satatamindra suravanditapadam | udancadaravindakula bandhushata bimbaruci samhati sugandhi vapusham
    patanjali nutam pranava panjara shukam para cidambara natam hridi bhaja || || iti stavamamum bhujagapungava
    kritam pratidinam pathati yah kritamukhah sadah prabhupada dvitayadarshanapadam sulalitam carana shringa
    rahitam | sarah prabhava sambhava haritpati haripramukha divyanuta shankarapadam sa gacchati param
    na tu janurjalanidhim paramaduhkhajanakam duritadam || || iti shri patanjalimuni pranitam caranashringarahita
    nataraja stotram sampurnam ||
  devanagari: अथ चरणशृङ्गरहित श्री नटराज स्तोत्रं सदञ्चित मुदञ्चित निकुञ्चित पदं झलझलं चलित मञ्जु कटकम्
    । पतञ्जलि दृगञ्जन मचञ्चलपदं जनन भञ्जन करम् । कदम्बरुचिमम्बरवसं परममम्बुद कदम्ब कविडम्बक गलम् चिदम्बुधि
    मणिं बुध हृदम्बुज रविं पर चिदम्बर नटं हृदि भज ॥ मन्तरहितं विरिञ्चिसुरसंहतिपुरन्धर विचिन्तितपदं तरुणचन्द्रमकुटम्
    । परं पद विखण्डितयमं भसित मण्डिततनुं मदनवञ्चन परं चिरन्तनममुं प्रणवसञ्चितनिधिं पर चिदम्बर नटं हृदि
    भज ॥ ॥ अवन्तमखिलं जगदभङ्ग गुणतुङ्गममतं धृतविधुं सुरसरित् तरङ्ग निकुरुम्ब धृति लम्पट जटं शमनदम्भसुहरं
    भवहरम् । शिवं दशदिगन्तर विजृम्भितकरं करलसन्मृगशिशुं पशुपतिं हरं शशिधनञ्जयपतङ्गनयनं पर चिदम्बर नटं
    हृदि भज ॥ ॥ अनन्तनवरत्नविलसत्कटककिङ्किणिझलं झलझलं झलरवं मुकुन्दविधि हस्तगतमद्दल लयध्वनिधिमिद्धिमित
    नर्तन पदम् । शकुन्तरथ बर्हिरथ नन्दिमुख भृङ्गिरिटिसङ्घनिकटं भयहरम् सनन्द सनक प्रमुख वन्दित पदं पर चिदम्बर
    नटं हृदि भज ॥ ॥ अनन्तमहसं त्रिदशवन्द्य चरणं मुनि हृदन्तर वसन्तममलम् कबन्ध वियदिन्द्ववनि गन्धवह वह्निमख
    बन्धुरविमञ्जु वपुषम् । अनन्तविभवं त्रिजगदन्तर मणिं त्रिनयनं त्रिपुर खण्डन परम् सनन्द मुनि वन्दित पदं
    सकरुणं पर चिदम्बर नटं हृदि भज ॥ ॥ अचिन्त्यमलिवृन्द रुचि बन्धुरगलं कुरित कुन्द निकुरुम्ब धवलम् मुकुन्द
    सुर वृन्द बल हन्तृ कृत वन्दन लसन्तमहिकुण्डल धरम् । अकम्पमनुकम्पित रतिं सुजन मङ्गलनिधिं गजहरं पशुपतिम्
    धनञ्जय नुतं प्रणत रञ्जनपरं पर चिदम्बर नटं हृदि भज ॥ ॥ परं सुरवरं पुरहरं पशुपतिं जनित दन्तिमुख षण्मुखममुं
    मृडं कनक पिङ्गल जटं सनक पङ्कज रविं सुमनसं हिमरुचिम् । असङ्घमनसं जलधि जन्मगरलं कवलयन्त मतुलं गुणनिधिम्
    सनन्द वरदं शमितमिन्दु वदनं पर चिदम्बर नटं हृदि भज ॥ ॥ अजं क्षितिरथं भुजगपुङ्गवगुणं कनक शृङ्गि धनुषं
    करलसत् कुरङ्ग पृथु टङ्क परशुं रुचिर कुङ्कुम रुचिं डमरुकं च दधतम् । मुकुन्द विशिखं नमदवन्ध्य फलदं निगम
    वृन्द तुरगं निरुपमं स चण्डिकममुं झटिति संहृतपुरं पर चिदम्बर नटं हृदि भज ॥ ॥ अनङ्गपरिपन्थिनमजं क्षिति
    धुरन्धरमलं करुणयन्तमखिलं ज्वलन्तमनलं दधतमन्तकरिपुं सततमिन्द्र सुरवन्दितपदम् । उदञ्चदरविन्दकुल बन्धुशत
    बिम्बरुचि संहति सुगन्धि वपुषं पतञ्जलि नुतं प्रणव पञ्जर शुकं पर चिदम्बर नटं हृदि भज ॥ ॥ इति स्तवममुं
    भुजगपुङ्गव कृतं प्रतिदिनं पठति यः कृतमुखः सदः प्रभुपद द्वितयदर्शनपदं सुललितं चरण शृङ्ग रहितम् । सरः
    प्रभव सम्भव हरित्पति हरिप्रमुख दिव्यनुत शङ्करपदं स गच्छति परं न तु जनुर्जलनिधिं परमदुःखजनकं दुरितदम्
    ॥ ॥ इति श्री पतञ्जलिमुनि प्रणीतं चरणशृङ्गरहित नटराज स्तोत्रं सम्पूर्णम् ॥
