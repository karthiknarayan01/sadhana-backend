id: yudhishthirakritam1shrikrishnastotram
category: stotram
name:
  english: yudhishthirakritam1shrikrishnastotram
  devanagari: युधिष्ठिरकृतं१श्रीकृष्णस्तोत्रम्
content:
  english: yudhishthirakritam 1 shrikrishnastotram na tesham dushkaram kincittrishu lokeshu vidyate |
    sarvalokagururyesham tvam natho madhusudana || 5|| tava prasadadgovinda vayam jeshyamahe ripun | yatha
    purvam prasadatte danavanpakashasanah || 6|| prithivivijayo vapi trailokyavijayo'pi va | dhruvo hi
    tesham varshneya yesham tushto'si madhava || 7|| na tesham vidyate papam sangrame va parajayah | tridasheshvaranathastvam
    yesham tushto'si madhava || 8|| tvatprasadaddhrishikesha shakrah suraganeshvarah | trailokyavijayam
    shrimanpraptavan ranamurdhani || 9|| tava caiva prasadena tridashastridasheshvara | amaratvam gatah
    krishna lokamshcashnuvate'kshayan || 10|| tvatprasadasamutthena vikramenarisudana | sureshatvam gatah
    shakro hatva daityansahasrashah || 11|| tvatprasadaddhrishikesha jagatsthavarajangamam | svavartmani
    sthitam vira japahomeshu vartate || 12|| ekarnavamidam purvam sarvamasittamomayam | tvatprasadatprakashatvam
    jagatpraptam narottama || 13|| srashtaram sarvalokanam paramatmanamacyutam | ye prapanna hrishikesham
    na te muhyanti karhicit || 14|| anadinidhanam devam lokakartaramavyayam | tvam bhakta ye hrishikesha
    durganyatitaranti te || 15|| param puranam purusham purananam param ca yat | prapadyatastam paramam
    para bhutirvidhiyate || 16|| yo'gata caturo vedanyashca vedeshu giyate | tam prapadya mahatmanam bhutimapnotyanuttamam
    || 17|| dhananjayasakha yashca dhananjayahitashca yah | tam dhananjayagoptaram prapadya sukhamedhate
    || 18|| iti mahabharate dronaparvani 124 adhyayantargatam yudhishthirakritam shrikrishnastotram sampurnam
    | mahabharata | dronaparva | adhyaya 124
  devanagari: युधिष्ठिरकृतं १ श्रीकृष्णस्तोत्रम् न तेषां दुष्करं किञ्चित्त्रिषु लोकेषु विद्यते । सर्वलोकगुरुर्येषां
    त्वं नाथो मधुसूदन ॥ ५॥ तव प्रसादाद्गोविन्द वयं जेष्यामहे रिपून् । यथा पूर्वं प्रसादात्ते दानवान्पाकशासनः
    ॥ ६॥ पृथिवीविजयो वापि त्रैलोक्यविजयोऽपि वा । ध्रुवो हि तेषां वार्ष्णेय येषां तुष्टोऽसि माधव ॥ ७॥ न
    तेषां विद्यते पापं सङ्ग्रामे वा पराजयः । त्रिदशेश्वरनाथस्त्वं येषां तुष्टोऽसि माधव ॥ ८॥ त्वत्प्रसादाद्धृषीकेश
    शक्रः सुरगणेश्वरः । त्रैलोक्यविजयं श्रीमान्प्राप्तवान् रणमूर्धनि ॥ ९॥ तव चैव प्रसादेन त्रिदशास्त्रिदशेश्वर
    । अमरत्वं गताः कृष्ण लोकांश्चाश्नुवतेऽक्षयान् ॥ १०॥ त्वत्प्रसादसमुत्थेन विक्रमेणारिसूदन । सुरेशत्वं
    गतः शक्रो हत्वा दैत्यान्सहस्रशः ॥ ११॥ त्वत्प्रसादाद्धृषीकेश जगत्स्थावरजङ्गमम् । स्ववर्त्मनि स्थितं
    वीर जपहोमेषु वर्तते ॥ १२॥ एकार्णवमिदं पूर्वं सर्वमासीत्तमोमयम् । त्वत्प्रसादात्प्रकाशत्वं जगत्प्राप्तं
    नरोत्तम ॥ १३॥ स्रष्टारं सर्वलोकानां परमात्मानमच्युतम् । ये प्रपन्ना हृषीकेशं न ते मुह्यन्ति कर्हिचित्
    ॥ १४॥ अनादिनिधनं देवं लोककर्तारमव्ययम् । त्वां भक्ता ये हृषीकेश दुर्गाण्यतितरन्ति ते ॥ १५॥ परं पुराणं
    पुरुषं पुराणानां परं च यत् । प्रपद्यतस्तं परमं परा भूतिर्विधीयते ॥ १६॥ योऽगात चतुरो वेदान्यश्च वेदेषु
    गीयते । तं प्रपद्य महात्मानं भूतिमाप्नोत्यनुत्तमाम् ॥ १७॥ धनञ्जयसखा यश्च धनञ्जयहितश्च यः । तं धनञ्जयगोप्तारं
    प्रपद्य सुखमेधते ॥ १८॥ इति महाभारते द्रोणपर्वणि १२४ अध्यायान्तर्गतं युधिष्ठिरकृतं श्रीकृष्णस्तोत्रं
    सम्पूर्णम् । महाभारत । द्रोणपर्व । अध्याय १२४
