id: aryeshastavah
category: shataka
name:
  english: aryeshastavah
  devanagari: आर्येशस्तवः
content:
  english: nibham | divyam shrutiyugamide drigabjavishrantimandapam mrida te || 68|| manjulamandanakundalakundalipatividitamardavatishayam
    | sphatikamanimukurabham kapolaphalakam karotu kushalam te || 69|| atulapadaviniveshyam tvanunayasamaye
    shivaparamrishyam | dhyatrihridaikasprishyam tava cubukam bhati divyadrigdrishyam || 70|| smitashishuhamsottamsam
    locanalolambasambhritollasam | shyamalakalagalanalam vande tava deva vadanakokanadam || 71|| hara
    hasitannkurahirairavatadadharoshthapadmaragabhyam | khacitam shakramanibhyam kaninikabhyam ca tava
    mukham mukurau || 72|| mama tu hridaliranapetasprihah svapidamapisha mocayitum | tava mukhasarasijasushamamarandalaharim
    punah punarlihati || 73|| tam matiranugacchati me vagapi shambho sativa bhartaram tesham preshakabhutah
    phaladata ca tvameva bhavasi vibho || 74|| sarasijasamavishamadrisham shekharashishujatijatayuvasadrisham
    | amalam tava bhava tadrishamananamide mridetarasadrisham || 75|| hara darahasitajyotsnasuhitashivadrikcakoravarabhithunam
    | mukhavidhumakalankam te manasaharino'yamarurukshati me || 76|| amritakaro'pyakalankam sarasijamapi
    candrasannidhervikacam | ananamapratibimbam darpanamapi deva dipyate hara te || 77|| atredrigudbhutirucam
    satridrigudbhutirucamapisha tava | sumayakaramapi manasa vismayakaramasyamukuramikshe'ham || 78||
    shashapashumadhupalibhyam shiva samsargat kalankite abje | svacchadvijatatisangat smitakirtimatah
    katham mukhasya same || 79|| sphuradahiharaviralah samastabhuvanabhayaya bhritagaralah | sukhayatu
    tava sharva galah svakalimakrantabhujashiroyugalah || 80|| ajagavaparashudharau namadabhitivaradanaparadrishvanau
    | kritabhuvanavanahananau karau varau te shubhankarau bhavatam || 81|| galarucikritatatamalam girapadam
    te svakantitulitatamalam | karkashakucaparamalankritasavyamurah punatu shiva paramalam || 82|| ghavanatarakalimajharya
    rajati dhareva romarajiste | ralakambudarapurtergalita haranabhigahvare patita || 83|| dhrithuturavarakrittivritam
    pracuramanikhacitasarpasutradhritam | rakalaye ruciratvabhritam katitatamishana manasi te nibhritam
    || 84|| hara tava girivarakanyakarasarasijasaukumaryasaravidau | uru karikaracaru haratamacirena duritabharam
    me || 85|| caranasaroruhanale cintakacittadhvadhavane javane | anaghe hara tava janghe aghasanghatam
    mamashu ghatayatam || 86|| pranatamaravaramauliprasunamakarandasambhritam shiva te | caranasaroruhayugalam
    cumbati mama cittacancariko'yam || 87|| bhava tava padayoryugalam bhavatah kaivalyakalpabhumiruhah
    | kisalayayugamiva mridulam mulatalankuritamullasatyarunam || 8|| pranatamanorathadoham prasrimarashonatarakiranasandoham
    | pranamami shamitamoham padamisha tava prasadakamo'ham || 89|| dharmavapuh shatakotirdharamarditapanktikanthabhujanijakoti
    | patu padam suramakutipakarishilalivasarajivakuti || 90|| pati na parashivakamalam paramapahritasmaranmanaskamalam
    | praptabhavapadakamalam prapannamashu tvadiyapadakamalam || 91|| tava kritamanghriparagairbhajatam
    bhavasindhushoshanadhyayanam | utkatanatanasrastadumapate te kapardabandhat kim || 92|| mardavamukhyagaram
    makhabhunmakutasumasaurabhodgaram | padamuru natanodaram patu tavanvishyadadibhudaram || 93|| pallavadattanikaram
    pracandanatanastakalyahankaram | hritanatahridayavikaram haracaranam naumi nirajakaram || 94|| ahitativihitakalapam
    mahitam vapurisha sahitashailasutam | nijahitanihitakataksham suhitayami staumi hitadoshabharam ||
    95|| tridashadayarasabharitam trinatasumerutvacitranijacaritam | tripuraharam meduritam trilocanam
    dhama haratu me duritam || 96|| girivaravasati sadaram galabilanigrihitakshveda
  devanagari: निभम् । दिव्यं श्रुतियुगमीडे दृगब्जविश्रान्तिमण्डपं मृड ते ॥ ६८॥ मञ्जुलमण्डनकुण्डलकुण्डलिपतिविदितमार्दवातिशयम्
    । स्फाटिकमणिमुकुराभं कपोलफलकं करोतु कुशलं ते ॥ ६९॥ अतुलापदविनिवेश्यं त्वनुनयसमये शिवापरामृश्यम् ।
    ध्यातृहृदैकस्पृश्यं तव चुबुकं भाति दिव्यदृग्दृश्यम् ॥ ७०॥ स्मितशिशुहंसोत्तंसं लोचनलोलम्बसम्भृतोल्लासम्
    । श्यामलकलगलनालं वन्दे तव देव वदनकोकनदम् ॥ ७१॥ हर हसिताङ्ङ्कुरहीरैरवतादधरोष्ठपद्मरागाभ्याम् । खचितं
    शक्रमणिभ्यां कनीनिकाभ्यां च तव मुखं मुकुरौ ॥ ७२॥ मम तु हृदलिरनपेतस्पृहः स्वपीडामपीश मोचयितुम् । तव
    मुखसरसिजसुषमामरन्दलहरीं पुनः पुनर्लिहति ॥ ७३॥ तं मतिरनुगच्छति मे वागपि शम्भो सतीव भर्तारं तेषां प्रेषकभूतः
    फलदाता च त्वमेव भवसि विभो ॥ ७४॥ सरसिजसमविषमदृशं शेखरशिशुजातिजातयुवसदृशम् । अमलं तव भव तादृशमाननमीडे
    मृडेतरासदृशम् ॥ ७५॥ हर दरहसितज्योत्स्नासुहितशिवादृक्चकोरवरभिथुनम् । मुखविधुमकलङ्कं ते मानसहरिणोऽयमारुरुक्षति
    मे ॥ ७६॥ अमृतकरोऽप्यकलङ्कं सरसिजमपि चन्द्रसन्निधेर्विकचम् । आननमप्रतिबिम्बं दर्पणमपि देव दीप्यते हर
    ते ॥ ७७॥ अत्रेदृगुद्भूतिरुचं सत्रिदृगुद्भूतिरुचमपीश तव । सुमयकरमपि मनसा विस्मयकरमास्यमुकुरमीक्षेऽहम्
    ॥ ७८॥ शशपशुमधुपालिभ्यां शिव संसर्गात् कलङ्किते अब्जे । स्वच्छद्विजततिसङ्गात् स्मितकीर्तिमतः कथं मुखस्य
    समे ॥ ७९॥ स्फुरदहिहाराविरलः समस्तभुवनाभयाय भृतगरलः । सुखयतु तव शर्व गलः स्वकालिमाक्रान्तभुजशिरोयुगलः
    ॥ ८०॥ अजगवपरशुधरौ नमदभीतिवरदानपारदृश्वानौ । कृतभुवनावनहननौ करौ वरौ ते शुभङ्करौ भवताम् ॥ ८१॥ गलरुचिकृतततमालं
    गीरपदं ते स्वकान्तितुलिततमालम् । कर्कशकुचपरमालङ्कृतसव्यमुरः पुनातु शिव परमालम् ॥ ८२॥ घवनतरकालिमझर्या
    राजति धारेव रोमराजिस्ते । रालकम्बूदरपूर्तेर्गलिता हरनाभिगह्वरे पतिता ॥ ८३॥ धृथुतूरवरकृत्तिवृतं प्रचुरमणीखचितसर्पसूत्रधृतम्
    । रकलये रुचिरत्वभृतं कटितटमीशान मनसि ते निभृतम् ॥ ८४॥ हर तव गिरिवरकन्याकरसरसिजसौकुमार्यसारविदौ । ऊरू
    करिकरचारू हरतामचिरेण दुरितभारं मे ॥ ८५॥ चरणसरोरुहनाले चिन्तकचित्ताध्वधावने जवने । अनघे हर तव जङ्घे
    अघसङ्घातं ममाशु घातयताम् ॥ ८६॥ प्रणतामरवरमौलिप्रसूनमकरन्दसम्भृतं शिव ते । चरणसरोरुहयुगलं चुम्बति मम
    चित्तचञ्चरीकोऽयम् ॥ ८७॥ भव तव पदयोर्युगलं भवतः कैवल्यकल्पभूमिरुहः । किसलययुगमिव मृदुलं मूलतलाङ्कुरितमुल्लसत्यरुणम्
    ॥ ८॥ प्रणतमनोरथदोहं प्रसृमरशोणतरकिरणसन्दोहम् । प्रणमामि शमितमोहं पदमीश तव प्रसादकामोऽहम् ॥ ८९॥ धर्मवपुः
    शतकोटिर्धरमर्दितपङ्क्तिकण्ठभुजनिजकोटि । पातु पदं सुरमकुटीपाकारिशिलालिवासराजीवकुटी ॥ ९०॥ पाति न परशिवकमलं
    परमापहृतस्मरन्मनस्कमलम् । प्राप्तभवापदकमलं प्रपन्नमाशु त्वदीयपदकमलम् ॥ ९१॥ तव कृतमङ्घ्रिपरागैर्भजतां
    भवसिन्धुशोषणाध्ययनम् । उत्कटनटनस्रस्तादुमापते ते कपर्दबन्धात् किम् ॥ ९२॥ मार्दवमुख्यागारं मखभुङ्मकुटसुमसौरभोद्गारम्
    । पदमुरु नटनोदारं पातु तवान्विष्यदादिभूदारम् ॥ ९३॥ पल्लवदत्तनिकारं प्रचण्डनटनास्तकाल्यहङ्कारम् । हृतनतहृदयविकारं
    हरचरणं नौमि नीरजाकारम् ॥ ९४॥ अहिततिविहितकलापं महितं वपुरीश सहितशैलसुतम् । निजहितनिहितकटाक्षं सुहितयमि
    स्तौमि हितदोषभरम् ॥ ९५॥ त्रिदशदयारसभरितं त्रिणतसुमेरुत्वचित्रनिजचरितम् । त्रिपुरहरं मेदुरितं त्रिलोचनं
    धाम हरतु मे दुरितम् ॥ ९६॥ गिरिवरवसति सदारं गलबिलनिगृहीतक्ष्वेड
