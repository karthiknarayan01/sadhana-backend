id: purushasuktashuklayajurvediya-2
category: veda
name:
  english: purushasuktashuklayajurvediya
  devanagari: पुरुषसूक्तशुक्लयजुर्वेदीय
content:
  english: sarvam yadbhutam yacca bhavyam | utamritatvasyeshano yadannenatirohati || 2|| etavanasya mahimato
    jyaya~shca purushah | pado'sya vishva bhutani tripadasyamritam divi || 3|| tripadurdhva udaitpurushah
    pado'syehabhavat punah | tato vishvan vyakramatsashananashane abhi || 4|| tato viradajayata virajo
    adhi purushah | sa jato atyaricyata pashcadbhumimatho purah || 5|| tasmadyajnat sarvahutah sambhritam
    prishadajyam | pashu~sta~shcakre vayavyanaranya gramyashca ye || 6|| tasmadyajnat sarvahutah ricah
    samani jajnire | chanda
  devanagari: सर्वं यद्भूतं यच्च भाव्यम् । उतामृतत्वस्येशानो यदन्नेनातिरोहति ॥ २॥ एतावानस्य महिमातो ज्यायाँश्च
    पूरुषः । पादोऽस्य विश्वा भूतानि त्रिपादस्यामृतं दिवि ॥ ३॥ त्रिपादूर्ध्व उदैत्पुरुषः पादोऽस्येहाभवत्
    पुनः । ततो विष्वङ् व्यक्रामत्साशनानशने अभि ॥ ४॥ ततो विराडजायत विराजो अधि पूरुषः । स जातो अत्यरिच्यत
    पश्चाद्भूमिमथो पुरः ॥ ५॥ तस्माद्यज्ञात् सर्वहुतः सम्भृतं पृषदाज्यम् । पशूँस्ताँश्चक्रे वायव्यानारण्या
    ग्राम्याश्च ये ॥ ६॥ तस्माद्यज्ञात् सर्वहुतः ऋचः सामानि जज्ञिरे । छन्दा
