id: ashtavakra-gita-chapter-2
category: stotram
name:
  english: Ashtavakra Gita Chapter 2
content:
  english: janaka uvaca || aho niranjanah shanto bodho'ham prakriteh parah | etavantamaham kalam mohenaiva
    vidambitah || || yatha prakashayamyeko dehamenam tatha jagat | ato mama jagatsarvamathava na ca kincana
    || || sa shariramaho vishvam parityajya mayadhuna | kutashcit kaushalad eva paramatma vilokyate ||
    || yatha na toyato bhinnastarangah phenabudbudah | atmano na tatha bhinnam vishvamatmavinirgatam ||
    || tantumatro bhaved eva pato yadvad vicaritah | atmatanmatramevedam tadvad vishvam vicaritam || ||
    yathaivekshurase klripta tena vyaptaiva sharkara | tatha vishvam mayi klriptam maya vyaptam nirantaram
    || || atmajnanajjagadbhati atmajnananna bhasate | rajjvajnanadahirbhati tajjnanad bhasate na hi ||
    || prakasho me nijam rupam natirikto'smyaham tatah | yada prakashate vishvam tadaham bhasa eva hi
    || || aho vikalpitam vishvamajnananmayi bhasate | rupyam shuktau phani rajjau vari suryakare yatha
    || || matto vinirgatam vishvam mayyeva layameshyati | mridi kumbho jale vicih kanake katakam yatha
    || || aho aham namo mahyam vinasho yasya nasti me | brahmadistambaparyantam jagannashe'pi tishthatah
    || || aho aham namo mahyameko'ham dehavanapi | kvacinna ganta naganta vyapya vishvamavasthitah ||
    || aho aham namo mahyam daksho nastiha matsamah | asamsprishya sharirena yena vishvam ciram dhritam
    || || aho aham namo mahyam yasya me nasti kincana | athava yasya me sarvam yad vanmanasagocaram ||
    || jnanam jneyam tatha jnata tritayam nasti vastavam | ajnanad bhati yatredam so'hamasmi niranjanah
    || || dvaitamulamaho duhkham nanyattasya'sti bheshajam | drishyametan mrisha sarvameko'ham cidrasomalah
    || || bodhamatro'hamajnanad upadhih kalpito maya | evam vimrishato nityam nirvikalpe sthitirmama ||
    || na me bandho'sti moksho va bhrantih shanta nirashraya | aho mayi sthitam vishvam vastuto na mayi
    sthitam || || sashariramidam vishvam na kinciditi nishcitam | shuddhacinmatra atma ca tatkasmin kalpanadhuna
    || || shariram svarganarakau bandhamokshau bhayam tatha | kalpanamatramevaitat kim me karyam cidatmanah
    || || aho janasamuhe'pi na dvaitam pashyato mama | aranyamiva samvrittam kva ratim karavanyaham ||
    || naham deho na me deho jivo nahamaham hi cit | ayameva hi me bandha asidya jivite spriha || || aho
    bhuvanakallolairvicitrairdrak samutthitam | mayyanantamahambhodhau cittavate samudyate || || mayyanantamahambhodhau
    cittavate prashamyati | abhagyajjivavanijo jagatpoto vinashvarah || || mayyanantamahambhodhavashcaryam
    jivavicayah | udyanti ghnanti khelanti pravishanti svabhavatah ||
  devanagari: जनक उवाच ॥ अहो निरञ्जनः शान्तो बोधोऽहं प्रकृतेः परः । एतावन्तमहं कालं मोहेनैव विडम्बितः
    ॥ ॥ यथा प्रकाशयाम्येको देहमेनं तथा जगत् । अतो मम जगत्सर्वमथवा न च किञ्चन ॥ ॥ स शरीरमहो विश्वं परित्यज्य
    मयाधुना । कुतश्चित् कौशलाद् एव परमात्मा विलोक्यते ॥ ॥ यथा न तोयतो भिन्नास्तरङ्गाः फेनबुद्बुदाः । आत्मनो
    न तथा भिन्नं विश्वमात्मविनिर्गतम् ॥ ॥ तन्तुमात्रो भवेद् एव पटो यद्वद् विचारितः । आत्मतन्मात्रमेवेदं
    तद्वद् विश्वं विचारितम् ॥ ॥ यथैवेक्षुरसे क्लृप्ता तेन व्याप्तैव शर्करा । तथा विश्वं मयि क्लृप्तं मया
    व्याप्तं निरन्तरम् ॥ ॥ आत्माज्ञानाज्जगद्भाति आत्मज्ञानान्न भासते । रज्ज्वज्ञानादहिर्भाति तज्ज्ञानाद्
    भासते न हि ॥ ॥ प्रकाशो मे निजं रूपं नातिरिक्तोऽस्म्यहं ततः । यदा प्रकाशते विश्वं तदाहं भास एव हि ॥
    ॥ अहो विकल्पितं विश्वमज्ञानान्मयि भासते । रूप्यं शुक्तौ फणी रज्जौ वारि सूर्यकरे यथा ॥ ॥ मत्तो विनिर्गतं
    विश्वं मय्येव लयमेष्यति । मृदि कुम्भो जले वीचिः कनके कटकं यथा ॥ ॥ अहो अहं नमो मह्यं विनाशो यस्य नास्ति
    मे । ब्रह्मादिस्तम्बपर्यन्तं जगन्नाशेऽपि तिष्ठतः ॥ ॥ अहो अहं नमो मह्यमेकोऽहं देहवानपि । क्वचिन्न गन्ता
    नागन्ता व्याप्य विश्वमवस्थितः ॥ ॥ अहो अहं नमो मह्यं दक्षो नास्तीह मत्समः । असंस्पृश्य शरीरेण येन विश्वं
    चिरं धृतम् ॥ ॥ अहो अहं नमो मह्यं यस्य मे नास्ति किञ्चन । अथवा यस्य मे सर्वं यद् वाङ्मनसगोचरम् ॥ ॥
    ज्ञानं ज्ञेयं तथा ज्ञाता त्रितयं नास्ति वास्तवम् । अज्ञानाद् भाति यत्रेदं सोऽहमस्मि निरञ्जनः ॥ ॥ द्वैतमूलमहो
    दुःखं नान्यत्तस्याऽस्ति भेषजम् । दृश्यमेतन् मृषा सर्वमेकोऽहं चिद्रसोमलः ॥ ॥ बोधमात्रोऽहमज्ञानाद् उपाधिः
    कल्पितो मया । एवं विमृशतो नित्यं निर्विकल्पे स्थितिर्मम ॥ ॥ न मे बन्धोऽस्ति मोक्षो वा भ्रान्तिः शान्ता
    निराश्रया । अहो मयि स्थितं विश्वं वस्तुतो न मयि स्थितम् ॥ ॥ सशरीरमिदं विश्वं न किञ्चिदिति निश्चितम्
    । शुद्धचिन्मात्र आत्मा च तत्कस्मिन् कल्पनाधुना ॥ ॥ शरीरं स्वर्गनरकौ बन्धमोक्षौ भयं तथा । कल्पनामात्रमेवैतत्
    किं मे कार्यं चिदात्मनः ॥ ॥ अहो जनसमूहेऽपि न द्वैतं पश्यतो मम । अरण्यमिव संवृत्तं क्व रतिं करवाण्यहम्
    ॥ ॥ नाहं देहो न मे देहो जीवो नाहमहं हि चित् । अयमेव हि मे बन्ध आसीद्या जीविते स्पृहा ॥ ॥ अहो भुवनकल्लोलैर्विचित्रैर्द्राक्
    समुत्थितम् । मय्यनन्तमहाम्भोधौ चित्तवाते समुद्यते ॥ ॥ मय्यनन्तमहाम्भोधौ चित्तवाते प्रशाम्यति । अभाग्याज्जीववणिजो
    जगत्पोतो विनश्वरः ॥ ॥ मय्यनन्तमहाम्भोधावाश्चर्यं जीववीचयः । उद्यन्ति घ्नन्ति खेलन्ति प्रविशन्ति स्वभावतः
    ॥
