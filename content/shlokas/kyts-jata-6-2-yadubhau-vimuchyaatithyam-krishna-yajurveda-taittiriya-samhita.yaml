    चर्म॒ त्व चर्मोध॒ ऊध॒ श्चर्म॒ चर्मोधः॑ । ऊधो॑ ऽधि॒षव॑णे अधि॒षव॑णे॒ ऊध॒ ऊधो॑ ऽधि॒षव॑णे । स्स्तना॑ अधि॒षव॑णे
    अधि॒षव॑णे॒ स्तनाः स्तना॑ उपर॒वा उ॑पर॒वा उ॒प॒र॒वा ग्रावा॑णो॒ ग्रावा॑ण उपर॒वा उ॑पर॒वा ग्रावा॑णः । ग्रावा॑णो
    व॒थ्सा व॒थ्सा ग्रावा॑णो॒ ग्रावा॑णो व॒थ्साः । व॒थ्सा ऋ॒त्विज॑ ऋ॒त्विजो॑ व॒थ्सा व॒थ्सा ऋ॒त्विजः॑ । ऋ॒त्विजो॑
