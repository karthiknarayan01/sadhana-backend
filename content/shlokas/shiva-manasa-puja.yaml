id: shiva-manasa-puja
category: stotram
name:
  english: Shiva Manasa Puja
  devanagari: शिवमानसपूजा सार्था (शङ्कराचार्यविरचिता)
content:
  english: ratnaih kalpitamasanam himajalaih snanam ca divyambaram nanaratnavibhushitam mrigamadamodankitam
    candanam | jaticampakabilvapatraracitam pushpam ca dhupam tatha dipam deva dayanidhe pashupate hritkalpitam
    grihyatam || 1|| sauvarne navaratnakhandaracite patre ghritam payasam bhakshyam pancavidham payodadhiyutam
    rambhaphalam panakam | shakanamayutam jalam rucikaram karpurakhandojjvalam tambulam manasa maya viracitam
    bhaktya prabho svikuru || 2|| chatram camarayoryugam vyajanakam cadarshakam nirmalam vinabherimridangakahalakala
    gitam ca nrityam tatha | sashtangam pranatih stutirbahuvidha hyetatsamastam maya sankalpena samarpitam
    tava vibho pujam grihana prabho || 3|| atma tvam girija matih sahacarah pranah shariram griham puja
    te vishayopabhogaracana nidra samadhisthitih | sancarah padayoh pradakshinavidhih stotrani sarva giro
    yadyatkarma karomi tattadakhilam shambho tavaradhanam || 4|| karacaranakritam vakkayajam karmajam
    va | shravananayanajam va manasam vaparadham | vihitamavihitam va sarvametatkshamasva | jaya jaya
    karunabdhe shrimahadevashambho || 5|| || iti shrimacchankaracaryaviracita shivamanasapuja samapta
    || O ocean of mercy, O master of bound creatures, i have imagined a throne divine robes adorned vith
    many jevels, sandalvud paste mikshed bilva leaves, rare incense, and a shining flame| svit vater scented
    vith camphor, and betel leaf--- i have prepared all these in my mind vith devotion| O ḻord, please
    accept them| 2 a canopy, tvo yak-tail vhisks, a fan and a spotless mirror, a vina, kettledrums, a
    mridang and a great drum, songs and dancing, full prostrations, O almighty ḻord, accept this, my vorship
    of ẏou| 4 ẏou are my shelf; parvati is my reason| my five pranas are ẏour state of samadhi| Wherever
    i valk i am valking around ẏou, O benevolent ḻord! 4 Whatever sins i have committed vith my hands,
    fit, voice, body, actions, ears, eyes, or mind, vhether prohibited by the scriptures or not, please
    forgive them all| hail! hail! O ocean of compassion! O great ġod! O benevolent ḻord! 5
  devanagari: रत्नैः कल्पितमासनं हिमजलैः स्नानं च दिव्याम्बरं नानारत्नविभूषितं मृगमदामोदाङ्कितं चन्दनम्
    । जातीचम्पकबिल्वपत्ररचितं पुष्पं च धूपं तथा दीपं देव दयानिधे पशुपते हृत्कल्पितं गृह्यताम् ॥ १॥ सौवर्णे
    नवरत्नखण्डरचिते पात्रे घृतं पायसं भक्ष्यं पञ्चविधं पयोदधियुतं रम्भाफलं पानकम् । शाकानामयुतं जलं रुचिकरं
    कर्पूरखण्डोज्ज्वलं ताम्बूलं मनसा मया विरचितं भक्त्या प्रभो स्वीकुरु ॥ २॥ छत्रं चामरयोर्युगं व्यजनकं
    चादर्शकं निर्मलं वीणाभेरिमृदङ्गकाहलकला गीतं च नृत्यं तथा । साष्टाङ्गं प्रणतिः स्तुतिर्बहुविधा ह्येतत्समस्तं
    मया सङ्कल्पेन समर्पितं तव विभो पूजां गृहाण प्रभो ॥ ३॥ आत्मा त्वं गिरिजा मतिः सहचराः प्राणाः शरीरं
    गृहं पूजा ते विषयोपभोगरचना निद्रा समाधिस्थितिः । सञ्चारः पदयोः प्रदक्षिणविधिः स्तोत्राणि सर्वा गिरो
    यद्यत्कर्म करोमि तत्तदखिलं शम्भो तवाराधनम् ॥ ४॥ करचरणकृतं वाक्कायजं कर्मजं वा । श्रवणनयनजं वा मानसं
    वापराधम् । विहितमविहितं वा सर्वमेतत्क्षमस्व । जय जय करुणाब्धे श्रीमहादेवशम्भो ॥ ५॥ ॥ इति श्रीमच्छङ्कराचार्यविरचिता
    शिवमानसपूजा समाप्ता ॥ O ओचेअन् ओफ़् मेर्च्य्, O मस्तेर् ओफ़् बोउन्द् च्रेअतुरेस्, ई हवे इमगिनेद् अ थ्रोने
    दिविने रोबेस् अदोर्नेद् विथ् मन्य् जेवेल्स्, सन्दल्वूद् पस्ते मिक्षेद् बिल्व लेअवेस्, ररे इन्चेन्से,
    अन्द् अ शिनिन्ग् फ़्लमे। स्वीत् वतेर् स्चेन्तेद् विथ् चम्फोर्, अन्द् बेतेल् लेअफ़्--- ई हवे प्रेपरेद्
    अल्ल् थेसे इन् म्य् मिन्द् विथ् देवोतिओन्। O ळोर्द्, प्लेअसे अच्चेप्त् थेम्। २ आ चनोप्य्, त्वो यक्-तैल्
    व्हिस्क्स्, अ फ़न् अन्द् अ स्पोत्लेस्स् मिर्रोर्, अ वीणा, केत्त्लेद्रुम्स्, अ म्रिदन्ग् अन्द् अ ग्रेअत्
    द्रुम्, सोन्ग्स् अन्द् दन्चिन्ग्, फ़ुल्ल् प्रोस्त्रतिओन्स्, O अल्मिघ्त्य् ळोर्द्, अच्चेप्त् थिस्, म्य्
    वोर्शिप् ओफ़् य़ोउ। ४ य़ोउ अरे म्य् षेल्फ़्; पार्वती इस् म्य् रेअसोन्। ंय् फ़िवे प्राणास् अरे य़ोउर् स्तते
    ओफ़् समाधी। Wहेरेवेर् ई वल्क् ई अम् वल्किन्ग् अरोउन्द् य़ोउ, O बेनेवोलेन्त् ळोर्द्! ४ Wहतेवेर् सिन्स्
    ई हवे चोम्मित्तेद् विथ् म्य् हन्द्स्, फ़ीत्, वोइचे, बोद्य्, अच्तिओन्स्, एअर्स्, एयेस्, ओर् मिन्द्,
    व्हेथेर् प्रोहिबितेद् ब्य् थे स्च्रिप्तुरेस् ओर् नोत्, प्लेअसे फ़ोर्गिवे थेम् अल्ल्। ःऐल्! ःऐल्! O
    ओचेअन् ओफ़् चोम्पस्सिओन्! O ग्रेअत् ग़ोद्! O बेनेवोलेन्त् ळोर्द्! ५
