id: indradyumnakritamvishnustotram
category: stotram
name:
  english: indradyumnakritamvishnustotram
  devanagari: इन्द्रद्युम्नकृतंविष्णुस्तोत्रम्
content:
  english: indradyumnakritam vishnustotram indradyumna uvaca | yajneshacyuta govinda madhavananta keshava
    | krishna vishno hrishikesha tubhyam vishvatmane namah || 1|| namo'stu te puranaya haraye vishvamurtaye
    | sargasthitivinashanam hetave'nantashaktaye || 2|| nirgunaya namastubhyam nishkalayamalatmane | purushaya
    namastestu vishvarupaya te namah || 3|| namaste vasudevaya vishnave vishvayonaye | adimadhyantahinaya
    jnanagamyaya te namah || 4|| namaste nirvikaraya nishprapancaya te namah | bhedabhedavihinaya namo'stvanandarupine
    || 5|| namastaraya shantaya namo'pratihatatmane | anantamurtaye tubhyamamurtaya namo namah || 6||
    namaste paramarthaya mayatitaya te namah | namaste parameshaya brahmane paramatmane || 7|| namo'stu
    te susukshmaya mahadevaya te namah | namah shivaya shuddhaya namaste parameshthine || 8|| tvayaiva
    srishtamakhilam tvameva parama gatih | tvam pita sarvabhutanam tvam mata purushottama || 9|| tvamaksharam
    param dhama cinmatram vyoma nishkalam | sarvasyadharamavyaktamanantam tamasah param || 10|| prapashyanti
    paratmanam jnanadipena kevalam | prapadye bhavato rupam tadvishnoh paramam padam || 11|| evam stuvantam
    bhagavan bhutatma bhutabhavanah | ubhabhyamatha hastabhyam pasparsha prahasanniva || 12|| sprishtamatro
    bhagavata vishnuna munipungavah | yathavatparamam tattvam jnatavamstatprasadatah || 13|| iti kurmapurane
    purvabhage prathamadhyayantargatam indradyumnakritam vishanustotram samaptam | kurmapurane purvabhage
    1
  devanagari: इन्द्रद्युम्नकृतं विष्णुस्तोत्रम् इन्द्रद्युम्न उवाच । यज्ञेशाच्युत गोविन्द माधवानन्त केशव
    । कृष्ण विष्णो हृषीकेश तुभ्यं विश्वात्मने नमः ॥ १॥ नमोऽस्तु ते पुराणाय हरये विश्वमूर्तये । सर्गस्थितिविनाशानां
    हेतवेऽनन्तशक्तये ॥ २॥ निर्गुणाय नमस्तुभ्यं निष्कलायामलात्मने । पुरुषाय नमस्तेस्तु विश्वरूपाय ते नमः
    ॥ ३॥ नमस्ते वासुदेवाय विष्णवे विश्वयोनये । आदिमध्यान्तहीनाय ज्ञानगम्याय ते नमः ॥ ४॥ नमस्ते निर्विकाराय
    निष्प्रपञ्चाय ते नमः । भेदाभेदविहीनाय नमोऽस्त्वानन्दरूपिणे ॥ ५॥ नमस्ताराय शान्ताय नमोऽप्रतिहतात्मने
    । अनन्तमूर्तये तुभ्यममूर्ताय नमो नमः ॥ ६॥ नमस्ते परमार्थाय मायातीताय ते नमः । नमस्ते परमेशाय ब्रह्मणे
    परमात्मने ॥ ७॥ नमोऽस्तु ते सुसूक्ष्माय महादेवाय ते नमः । नमः शिवाय शुद्धाय नमस्ते परमेष्ठिने ॥ ८॥
    त्वयैव सृष्टमखिलं त्वमेव परमा गतिः । त्वं पिता सर्वभूतानां त्वं माता पुरुषोत्तम ॥ ९॥ त्वमक्षरं परं
    धाम चिन्मात्रं व्योम निष्कलम् । सर्वस्याधारमव्यक्तमनन्तं तमसः परम् ॥ १०॥ प्रपश्यन्ति परात्मानं ज्ञानदीपेन
    केवलम् । प्रपद्ये भवतो रूपं तद्विष्णोः परमं पदम् ॥ ११॥ एवं स्तुवन्तं भगवान् भूतात्मा भूतभावनः । उभाभ्यामथ
    हस्ताभ्यां पस्पर्श प्रहसन्निव ॥ १२॥ स्पृष्टमात्रो भगवता विष्णुना मुनिपुङ्गवः । यथावत्परमं तत्त्वं
    ज्ञातवांस्तत्प्रसादतः ॥ १३॥ इति कूर्मपुराणे पूर्वभागे प्रथमाध्यायान्तर्गतं इन्द्रद्युम्नकृतं विषणुस्तोत्रं
    समाप्तम् । कूर्मपुराणे पूर्वभागे १
