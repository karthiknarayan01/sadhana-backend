id: ramanujashtottarashatanamastotram
category: stotram
name:
  english: ramanujashtottarashatanamastotram
  devanagari: रामानुजाष्टोत्तरशतनामस्तोत्रम्
content:
  english: ramanujashtottarashatanamastotram om shrimate ramanujaya namah || om ramanujah pushkaraksho
    yatindrah karunakarah | kantimatyatmajah shrima~llilamanushavigrahah || 1|| sarvashastrarthatattvajnah
    sarvajnah sajjanapriyah | haritagotratilakah shribhutapurapalakah || 2|| anagho bhaktamandarah keshavanandavardhanah
    | kancipurnapriyasakhah pranatartivinashakah || 3|| punyasankirtanah punyobrahmarakshasamocakah |
    yadavapaditaparthavrikshacchedakutharakah || 4|| amogho lakshmanamunih sharadashokanashakah | nirantarajanajnanavimocanavicakshanah
    || 5|| vedantadvayasarajno varadambupradayakah | parabhiprayatattvajno yamunangulimocakah || 6|| devarajakripalabdhashadvakyarthamahodadhih
    | purnaryalabdhasanmantrah shauripadabjashatpadah || 7|| tridandadhari brahmajno brahmadhyanaparayanah
    | rangeshakainkaryarato vibhutidvayanayakah || 8|| goshthipurnakripalabdhamantrarajaprakashakah |
    vararanganukampattadravidamnayaparagah || 9|| maladhagayasujnata dravidamnayatattvadhih | catussaptatishishyadhyah
    pancacaryapadashrayah || 10|| prapitavishatirthambhah prakatikritavaibhavah | pranatartiharacaryadattabhikshaikabhojanah
    || 11|| pavitrikritakuresha bhagineyatridandakah | kureshadasarathyadicaramarthapradayakah || 12||
    rangeshavenkateshadiprakatikritavaibhavah | devarajarcanarato mukamuktipradayakah || 13|| yajnamurtipratishthata
    mannatho dharanidharah | varadacaryesadbhakto yajneshartivinashakah || 14|| anantabhishtaphalado viththaleshaprapujitah
    | shrishailapurnakarunalabdharamayanarthakah || 15|| prapattidharmaikarato govindaryapriyanujah |
    vyasasutrarthatattvajno bodhayanamatanugah || 16|| shribhashyadimahagranthakarakah kalinashanah |
    advaitamatavicchetta vishishtadvaitaparagah || 17|| kuranganagaripurnamantraratnopadeshakah | vinashitakhilamatashsheshikritaramapatih
    || 18|| putrikritashatharatishshathajidrinamocakah | bhashadattahayagrivo bhashyakaro mahayashah ||
    19|| pavitrikritabhubhagah kurmanathaprakashakah | shrivenkatacaladhishashankhacakrapradayakah ||
    20|| shrivenkateshashvashurah shriramasakhadeshikah | kripamatraprasannaryo gopikamokshadayakah ||
    21|| samicinaryasacchishyasatkrito vaishnavapriyah | krimikanthanripadhvamsi sarvamantramahodadhih
    || 22|| angikritandhrapurnaryassalagramapratishthitah | shribhaktagramapurnadhya vishnuvardhanarakshakah
    || 23||
  devanagari: रामानुजाष्टोत्तरशतनामस्तोत्रम् ॐ श्रीमते रामानुजाय नमः ॥ ॐ रामानुजः पुष्कराक्षो यतीन्द्रः
    करुणाकरः । कान्तिमत्यात्मजः श्रीमाँल्लीलामानुषविग्रहः ॥ १॥ सर्वशास्त्रार्थतत्त्वज्ञः सर्वज्ञः सज्जनप्रियः
    । हारीतगोत्रतिलकः श्रीभूतपुरपालकः ॥ २॥ अनघो भक्तमन्दारः केशवानन्दवर्धनः । काञ्चीपूर्णप्रियसखः प्रणतार्तिविनाशकः
    ॥ ३॥ पुण्यसङ्कीर्तनः पुण्योब्रह्मराक्षसमोचकः । यादवापादितापार्थवृक्षच्छेदकुठारकः ॥ ४॥ अमोघो लक्ष्मणमुनिः
    शारदाशोकनाशकः । निरन्तरजनाज्ञानविमोचनविचक्षणः ॥ ५॥ वेदान्तद्वयसारज्ञो वरदाम्बुप्रदायकः । पराभिप्रायतत्त्वज्ञो
    यामुनाङ्गुलिमोचकः ॥ ६॥ देवराजकृपालब्धषड्वाक्यार्थमहोदधिः । पूर्णार्यलब्धसन्मन्त्रः शौरिपादाब्जषट्पदः
    ॥ ७॥ त्रिदण्डधारी ब्रह्मज्ञो ब्रह्मध्यानपरायणः । रङ्गेशकैङ्कर्यरतो विभूतिद्वयनायकः ॥ ८॥ गोष्ठीपूर्णकृपालब्धमन्त्रराजप्रकाशकः
    । वररङ्गानुकम्पात्तद्राविडाम्नायपारगः ॥ ९॥ मालाधगयसुज्ञात द्राविडाम्नायतत्त्वधीः । चतुस्सप्ततिशिष्याढ्यः
    पञ्चाचार्यपदाश्रयः ॥ १०॥ प्रपीतविषतीर्थाम्भः प्रकटीकृतवैभवः । प्रणतार्तिहराचार्यदत्तभिक्षैकभोजनः ॥
    ११॥ पवित्रीकृतकूरेश भागिनेयत्रिदण्डकः । कूरेशदासरथ्यादिचरमार्थप्रदायकः ॥ १२॥ रङ्गेशवेङ्कटेशादिप्रकटीकृतवैभवः
    । देवराजार्चनरतो मूकमुक्तिप्रदायकः ॥ १३॥ यज्ञमूर्तिप्रतिष्ठाता मन्नाथो धरणीधरः । वरदाचार्येसद्भक्तो
    यज्ञेशार्तिविनाशकः ॥ १४॥ अनन्ताभीष्टफलदो विठ्ठलेशप्रपूजितः । श्रीशैलपूर्णकरुणालब्धरामायणार्थकः ॥ १५॥
    प्रपत्तिधर्मैकरतो गोविन्दार्यप्रियानुजः । व्याससूत्रार्थतत्त्वज्ञो बोधायनमतानुगः ॥ १६॥ श्रीभाष्यादिमहाग्रन्थकारकः
    कलिनाशनः । अद्वैतमतविच्छेत्ता विशिष्टाद्वैतपारगः ॥ १७॥ कुरङ्गनगरीपूर्णमन्त्ररत्नोपदेशकः । विनाशिताखिलमतश्शेषीकृतरमापतिः
    ॥ १८॥ पुत्रीकृतशठारातिश्शठजिदृणमोचकः । भाषादत्तहयग्रीवो भाष्यकारो महायशाः ॥ १९॥ पवित्रीकृतभूभागः कूर्मनाथप्रकाशकः
    । श्रीवेङ्कटाचलाधीशशङ्खचक्रप्रदायकः ॥ २०॥ श्रीवेङ्कटेशश्वशुरः श्रीरमासखदेशिकः । कृपामात्रप्रसन्नार्यो
    गोपिकामोक्षदायकः ॥ २१॥ समीचीनार्यसच्छिष्यसत्कृतो वैष्णवप्रियः । कृमिकण्ठनृपध्वंसी सर्वमन्त्रमहोदधिः
    ॥ २२॥ अङ्गीकृतान्ध्रपूर्णार्यस्सालग्रामप्रतिष्ठितः । श्रीभक्तग्रामपूर्णाढ्य विष्णुवर्धनरक्षकः ॥ २३॥
