id: sree-bhu-varaha-stotram
category: stotram
name:
  english: Sree Bhu Varaha Stotram
content:
  english: rishaya ucu | jitam jitam te'jita yajnabhavana trayim tanum svam paridhunvate namah | yadromagarteshu
    nililyuradhvarah tasmai namah karanasukaraya te || || rupam tavaitannanu dushkritatmanam durdarshanam
    deva yadadhvaratmakam | chandamsi yasya tvaci barhiroma ssvajyam drishi tvanghrishu caturhotram ||
    || sruktunda asitsruva isha nasayo ridodare camasah karnarandhre | prashitramasye grasane grahastu
    te yaccarvanante bhagavannagnihotram || || dikshanujanmopasadah shirodharam tvam prayaniyo dayaniya
    damshtrah | jihva pravargyastava shirshakam kratoh sabhyavasathyam citayo'savo hi te || || somastu
    retah savananyavasthitih samsthavibhedastava deva dhatavah | satrani sarvani sharirasandhi stvam sarvayajnakraturishtibandhanah
    || || namo namaste'khilayantradevata dravyaya sarvakratave kriyatmane | vairagya bhaktyatmajaya'nubhavita
    jnanaya vidyagurave namò namah || || damshtragrakotya bhagavamstvaya dhrita virajate bhudhara bhussabhudhara
    | yatha vanannissarato data dhrita matangajendrasya sa patrapadmini || || trayimayam rupamidam ca
    saukaram bhumandale natha tada dhritena te | cakasti shringodhaghanena bhuyasa kulacalendrasya yathaiva
    vibhramah || || samsthapayainam jagatam satasthusham lokaya patnimasi mataram pita | vidhema casyai
    namasa saha tvaya yasyam svatejo'gnimivaranavadhah || || kah shraddhadhitanyatamastava prabho rasam
    gataya bhuva udvibarhanam | na vismayo'sau tvayi vishvavismaye yo mayayedam sasrije'ti vismayam ||
    || vidhunvata vedamayam nijam vapu rjanastapah satyanivasino vayam | satashikhoddhuta shivambubindubhi
    rvimrijyamana bhrishamisha pavitah || || sa vai bata bhrashtamatistavaishate yah karmanam paramaparakarmanah
    | yadyogamaya guna yoga mohitam vishvam samastam bhagavan vidhehi sham || || iti shrimadbhagavate
    mahapurane tritiyaskandhe shri varaha pradurbhavonama trayodashodhyayah |
  devanagari: ऋषय ऊचु । जितं जितं तेऽजित यज्ञभावना त्रयीं तनूं स्वां परिधुन्वते नमः । यद्रोमगर्तेषु निलिल्युरध्वराः
    तस्मै नमः कारणसूकराय ते ॥ ॥ रूपं तवैतन्ननु दुष्कृतात्मनां दुर्दर्शनं देव यदध्वरात्मकम् । छन्दांसि
    यस्य त्वचि बर्हिरोम स्स्वाज्यं दृशि त्वङ्घ्रिषु चातुर्होत्रम् ॥ ॥ स्रुक्तुण्ड आसीत्स्रुव ईश नासयो
    रिडोदरे चमसाः कर्णरन्ध्रे । प्राशित्रमास्ये ग्रसने ग्रहास्तु ते यच्चर्वणन्ते भगवन्नग्निहोत्रम् ॥ ॥
    दीक्षानुजन्मोपसदः शिरोधरं त्वं प्रायणीयो दयनीय दंष्ट्रः । जिह्वा प्रवर्ग्यस्तव शीर्षकं क्रतोः सभ्यावसथ्यं
    चितयोऽसवो हि ते ॥ ॥ सोमस्तु रेतः सवनान्यवस्थितिः संस्थाविभेदास्तव देव धातवः । सत्राणि सर्वाणि शरीरसन्धि
    स्त्वं सर्वयज्ञक्रतुरिष्टिबन्धनः ॥ ॥ नमो नमस्तेऽखिलयन्त्रदेवता द्रव्याय सर्वक्रतवे क्रियात्मने । वैराग्य
    भक्त्यात्मजयाऽनुभावित ज्ञानाय विद्यागुरवे नमॊ नमः ॥ ॥ दंष्ट्राग्रकोट्या भगवंस्त्वया धृता विराजते भूधर
    भूस्सभूधरा । यथा वनान्निस्सरतो दता धृता मतङ्गजेन्द्रस्य स पत्रपद्मिनी ॥ ॥ त्रयीमयं रूपमिदं च सौकरं
    भूमण्डले नाथ तदा धृतेन ते । चकास्ति शृङ्गोढघनेन भूयसा कुलाचलेन्द्रस्य यथैव विभ्रमः ॥ ॥ संस्थापयैनां
    जगतां सतस्थुषां लोकाय पत्नीमसि मातरं पिता । विधेम चास्यै नमसा सह त्वया यस्यां स्वतेजोऽग्निमिवारणावधाः
    ॥ ॥ कः श्रद्धधीतान्यतमस्तव प्रभो रसां गताया भुव उद्विबर्हणम् । न विस्मयोऽसौ त्वयि विश्वविस्मये यो
    माययेदं ससृजेऽति विस्मयम् ॥ ॥ विधुन्वता वेदमयं निजं वपु र्जनस्तपः सत्यनिवासिनो वयम् । सटाशिखोद्धूत
    शिवाम्बुबिन्दुभि र्विमृज्यमाना भृशमीश पाविताः ॥ ॥ स वै बत भ्रष्टमतिस्तवैषते यः कर्मणां पारमपारकर्मणः
    । यद्योगमाया गुण योग मोहितं विश्वं समस्तं भगवन् विधेहि शम् ॥ ॥ इति श्रीमद्भागवते महापुराणे तृतीयस्कन्धे
    श्री वराह प्रादुर्भावोनाम त्रयोदशोध्यायः ।
