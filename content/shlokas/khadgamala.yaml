id: khadgamala
category: stotram
name:
  english: khadgamala
  devanagari: खद्गमल
content:
  english: namaste namaste namaste namah | phalashrutih esha vidya mahasiddhidayini smritimatratah | agnivatamahakshobhe
    rajarashtrasya viplave || lunthane taskarabhaye sangrame salilaplave | samudrayanavikshobhe bhutapretadike
    bhaye || apasmarajvaravyadhimrityukshamadije bhaye | shakini putanayaksharakshahkushmandaje bhaye
    || mitrabhede grahabhaye vyasaneshvabhicarike | anyeshvapi ca dosheshu malamantram smarennarah ||
    sarvopadravanirmuktassakshacchivamayobhavet | apatkale nityapujam vistaratkartumarabhet || ekavaram
    japadhyanam sarvapujaphalam labhet | navavarnadevinam lalitaya mahaujasah || ekatra gananarupo vedavedangagocarah
    | sarvagamarahasyarthah smaranatpapanashini || lalitaya maheshanya mala vidya mahiyasi | naravashyam
    narendranam vashyam narivashankaram || animadigunaishvaryam ranjanam papabhanjanam | tattadavaranasthayi
    devatavrindamantrakam || malamantram param guhyam param dhamaprakirtitam | shaktimala pancadha syacchivamala
    ca tadrishi || tasmadgopyataradgopyam rahasyam bhuktimuktidam || iti shrivamakeshvaratantre umamaheshvarasamvade
    devikhadgamalastotraratnam samaptam |
  devanagari: नमस्ते नमस्ते नमस्ते नमः । फलश्रुतिः एषा विद्या महासिद्धिदायिनी स्मृतिमात्रतः । अग्निवातमहाक्षोभे
    राजाराष्ट्रस्य विप्लवे ॥ लुण्ठने तस्करभये सङ्ग्रामे सलिलप्लवे । समुद्रयानविक्षोभे भूतप्रेतादिके भये
    ॥ अपस्मारज्वरव्याधिमृत्युक्षामादिजे भये । शाकिनी पूतनायक्षरक्षःकूष्माण्डजे भये ॥ मित्रभेदे ग्रहभये
    व्यसनेष्वाभिचारिके । अन्येष्वपि च दोषेषु मालामन्त्रं स्मरेन्नरः ॥ सर्वोपद्रवनिर्मुक्तस्साक्षाच्छिवमयोभवेत्
    । आपत्काले नित्यपूजां विस्तारात्कर्तुमारभेत् ॥ एकवारं जपध्यानं सर्वपूजाफलं लभेत् । नवावर्णदेवीनां
    ललिताया महौजसः ॥ एकत्र गणनारूपो वेदवेदाङ्गगोचरः । सर्वागमरहस्यार्थः स्मरणात्पापनाशिनी ॥ ललिताया महेशान्या
    माला विद्या महीयसि । नरवश्यं नरेन्द्राणां वश्यं नारीवशङ्करम् ॥ अणिमादिगुणैश्वर्यं रञ्जनं पापभञ्जनम्
    । तत्तदावरणस्थायि देवतावृन्दमन्त्रकम् ॥ मालामन्त्रं परं गुह्यां परं धामप्रकीर्तितम् । शक्तिमाला पञ्चधा
    स्याच्छिवमाला च तादृशी ॥ तस्माद्गोप्यतराद्गोप्यं रहस्यं भुक्तिमुक्तिदम् ॥ इति श्रीवामकेश्वरतन्त्रे
    उमामहेश्वरसंवादे देवीखड्गमालास्तोत्ररत्नं समाप्तम् ।
