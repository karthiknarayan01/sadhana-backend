id: padmanabhakhyadvijakritamshrinivasastotram
category: stotram
name:
  english: padmanabhakhyadvijakritamshrinivasastotram
  devanagari: पद्मनाभाख्यद्विजकृतंश्रीनिवासस्तोत्रम्
content:
  english: padmanabhakhyadvijakritam shrinivasastotram evam vai dvadashe varshe tushtah krishnanarayanah
    | pratyakshatamagattasya shriradhakamalapatih || 21|| drishtva krishnam shrinivasam stotum samupacakrame
    | gopalakrishnarupaya kambhareyaya vishnave || 22|| namah sheshadrivasaya venkateshaya te namah |
    narayanadrivasaya shrinivasaya te namah || 23|| bhaktipriyaya lakshmishapadminishaya te namah | iti
    shrilakshminarayaniyasamhitayam prathame kritayugasantane 404
  devanagari: पद्मनाभाख्यद्विजकृतं श्रीनिवासस्तोत्रम् एवं वै द्वादशे वर्षे तुष्टः कृष्णनरायणः । प्रत्यक्षतामगात्तस्य
    श्रीराधाकमलापतिः ॥ २१॥ दृष्ट्वा कृष्णं श्रीनिवासं स्तोतुं समुपचक्रमे । गोपालकृष्णरूपाय काम्भरेयाय
    विष्णवे ॥ २२॥ नमः शेषाद्रिवासाय वेङ्कटेशाय ते नमः । नारायणाद्रिवासाय श्रीनिवासाय ते नमः ॥ २३॥ भक्तिप्रियाय
    लक्ष्मीशपद्मिनीशाय ते नमः । इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने ४०४
meaning: {}
