id: ucchishtaganapatisahasranamastotram-2
category: sahasranama
name:
  english: ucchishtaganapatisahasranamastotram 2
  devanagari: उच्छिष्टगणपतिसहस्रनामस्तोत्रम् २
content:
  english: shucivratah || 29|| sharanyah shaunakah shurah shabdadambhi jatorukah | darakah shikhivaheshtah
    sitah shankaravallabhah || 30|| shankaro nirbhayo nityo layakrillasyatatparah | luto lilarasollasi
    vilasi vibhramo bhramah || 31|| bhramanah shashibhritsuryah shanirdharaninandanah | budho vibudhasevyashca
    budharajo balandharah || 32|| jivo jivaprado jeta stutyo nityo ratipriyah | kavih kavyarthakushalo
    janarakshanatatparah || 33|| jananandapradata ca janakahladakarakah | gaccho ganapatirgacchanayako
    gacchagarvaha || 34|| gaccharajo'tha gacchesho gaccharajanamaskritah | gacchapriyo gacchagururgacchatrakridyamaturah
    || 35|| gacchaprabhurgacchacaro gacchapriyakritodyamah | gacchagitaguno garto maryadapratipalakah
    || 36|| girvanagamasarashca nabho girvanadevata | sampattisadanakarah sampattisukhadayakah || 37||
    sampattisukhakarta ca sampattisubhagananah | sampattishubhado nityam sampattishca tapodhanah || 38||
    rucako mecakastushtah prabhustomaraghatakah | dandi candamshuravyaktah kamandaludharo'naghah || 39||
    kami karmaratah kalakolah kranditadiktatah | bhramako jatipujyashca jadyaha jadasudanah || 40|| jalandharo
    jagaddhasi hasakridgahano guhah | havishmanhavyavahaksho hatako hatakangadah || 41|| sumerurhimavanhota
    haraputro halankapah | halapriyo hrida shantah kantahridayaposhanah ||| 42|| shoshanah kleshaha krurah
    kuberah kavitakritih | kubero dhimayo dhata dhyeyo dhimandayanidhih || 43|| davishtho damano hrishto
    data trata sitasamah | nirgato naigamo gamyo nirjayo jatilo'jarah || 44|| janajivo jitaratirjagadvyapi
    jaganmayah | camikaranibho nabhyo nalinayatalocanah || 45|| rocanamocako mantri mantrakotisamashritah
    | pancabhutatmakah pancasayakah pancavaktrakah || 46|| pancamah pashcimah purvah purnah kirnalakah
    kunih | kathorahridayagrivo'lankrito lalitashayah || 47|| lolacitto brihannaso masapaksharturupavan
    | dhruvo drutagatirbandho dharmavankimpriyo nalah || 48|| agastyagrastabhuvano bhuvanaikamalapahah
    | sagarah svargatih svakshah sanandah sadhupujitah || 49|| satipatih samarasah sanakah saralah sarah
    | surapriyo vasumatirvasavo vasupujitah || 50|| vittado vittanathashca dhaninam dhanadayakah | rajivanayanah
    smarta smritiha krittikambarah || 51|| ashvino'shvimukhah shubhro bharano bharanipriyah | krittikasanakah
    kolo rohini rohinopamah || 52|| kratavoshtorimandi ca rohinimohinibhritah | mrigarajo mrigashiro madhavo
    madhuradhvanih || 53|| ardranalo mahabuddhirmahoragavibhushanah | bhrukshepadantavibhavo bhrukaralah
    punarnavah || 54|| punardevah punarjeta punarjivah punarvasuh | timirastimiketushca timivasaraghatanah
    || 55|| tishyastuladharo jrimbho vishleshashleshadanarat | manavo madhavo magho vacalo maghava yamah
    || 56|| magho maghapriyo megho mahashundo mahabhujah | purvaphalgunikah pritah phalguruttaraphalgunah
    || 57|| phenilo brahmado brahma saptatantusamashrayah | ghonahastashcaturhasto hastivaktro halayudhah
    || 58|| citrambaro'rcitapadah svastidah svastivigrahah | vishakhashikhisevyashca shikhidhvajasahodarah
    || 59|| anurenukaraskaro rururenu sutinarah | anuradhapriyo radhah shrimanchuklah shucismitah || 60||
    jyeshthah shreshtharcitapado mulam trijagato guruh | shucih purvottarashadhashcottarashadha ishvarah
    || 61|| shravyo'bhijidanantatma shravashceshtitadanavah | shravanah sravanah shrota dhani dhanyo dhanapradah
    || 62|| dhanecchukah sadativrah shitakumbhah sharaddyutih | purvabhadrapadabhadrashcottarabhadrapaditah
    || 63|| renukastanayo ramo revatiramano rami | ashvayukkartikeyeshto margashirsho mrigottamah || 64||
    paushaishvaryah phalgunatma vasantashcitrako madhuh | rajyado'bhijidatmiyastareshastarakadyutih ||
    65|| pratitah prorjitah pritah paramah paramo hitah | paraha pancabhuh pancavayupujyah paro mahah
    || 66|| puranagamavidyogi mahisho rasabho'gragah | graho mesho vrisho mando manmatho mithunakritih
    || 67|| kalpabhritkantakatako dipo markateshaprabhuh | karkato ghrinikukkuto vanajo hamsayohasah ||
    68|| simhasimhasano bhushyo muhurmushakavahanah | kanyakalavatiputro kanyapritah kulodvahah || 69||
    atulyarupo baladastulyabhrittulyasakshikah | alishcapadharo dhanvi kacchapo makaro manih || 70|| kumbhabhritkalashah
    kubji minamamsasutarpitah | rashitaragrahamayastithirupo jagadvibhuh || 71|| pratapi pratipatpreyo
    dvitiyadvaitanishcitah | trirupashca tritiyagnistrayirupastrayitanuh || 72|| caturthivallabho devo
    paragah pancamishvarah | shadrasasvadako jatah shashthi shashthikavatsalah || 73|| saptarnavagatih
    sarah saptamishvararohitah | ashtaminandano'nanto navamibhaktibhavitah || 74|| dashadikapatipujyashca
    dashamidruhino drutah | ekadashatmaganapo dvadashiyugacarcitah || 75|| trayodashamanistutyashcaturdashasvarapriyah
    | caturdashendrasamstutyah purnimanandavigrahah || 76|| darshadarshau darshagashca vanaprastho maheshvarah
    | maurvi madhuravagmulam murtimanmeghavahanah || 77|| mahagajo jitakrodho jitashatrurjayashrayah |
    raudro rudrapriyo rudro rudraputro'ghanashanah || 78|| bhavapriyo bhavanishto bharabhridbhutabhavanah
    | gandharvakushalah kuntho vaikuntho'bhishtasevitah || 79|| vritraha vighnaha sirah samastaduritapaha
    | manjuro marjaro matto durgaputro duralasah || 80|| anantacitsudhadharo viraviryaikasadhakah | bhasvanmukutamanikyah
    kujatkinkinijalakah || 81|| shundadhari tundacalah kundali mundamalakah | padmakshah padmahastashca
    padmanabhasamarcitah || 82|| uditarunadantasyo malabhushanabhushitah | narado varano lolashravanah
    shurpakarnakah || 83|| brihadullasanasadhyo vyaptatrailokyamandalah | ratnamandalasinah krishanurupashilakah
    || 84|| brihatkarnashcalodbhutavayuvijitadikpatah | brihadasyaravakranto bhimabrahmandabhandakah ||
    85|| brihatpadasamakrantah saptapataladipitah | brihaddantakritatyugrarananandarasalasah || 86|| brihaddhastadhritasheshayudhanarjitadanavah
    | sphuratsinduravadanah sphurattejo'gnilocanah || 87|| uddipitamanisphurjannupuradhvaninaditah | calatoyapravahadhyo
    nadijalakanakarah || 88|| bhramatkunjarasanghatavanditanghrishiroruhah | brahmacyutamaharudrapurahsarasurarcitah
    || 89|| asheshasheshaprabhritivyalajalopasevitah | garjatpancananaravaprasaditadharatalah || 90||
    hahahuhugatatyugrasvaravibhrantamanasah | pancashadvarnabijadhayo mantri mantritavigrahah || 91||
    vedantashastrapiyushadharaplavitabhutalah | shankhadhvanisamakrantapataladinabhastalah || 92|| cintamanirmahamallo
    ballahasto balih kavih | kritatretayugollasabhasamanajagattrayah || 93|| dvaparah paralokaikah karmadhvantasudhakarah
    | sudhasiktavapurvyaso brahmandadikabahukah || 94|| akaradikshakarantavarnapanktisamujjvalah | akarakaramodgitatananadaninaditah
    || 95|| ikarekaramantradhyo malabharanalalasah | ukarokaramoharirghoranagopavitakah || 96|| rivarnankita
    rikarapadmalayasamujjavalah | lrikarayutalikarashankhapurnadigantarah || 97|| ekaraikaragirijastanapanavicakshanah
    | okaraukaravishvadikritasrishtikramalasah || 98|| amovarnavalivyaptapadadishirshamandalah | karnatalakritatyuccairvayuvijitanirjarah
    || 99|| khageshadhvajaratnankah kiritarunapadakah | garvitasheshagandharvvagitatatparashrotrikah ||
    100|| ghanavahanavagishapurahsarasurarcitah | navarnamritavaradhyasomamanaikadantakah || 101|| candrakunkumajambalaliptasinduravigrahah
    | chatracamararatnadhyamukutalankritananah || 102|| jataddhamahanarghamanipanktivirajitah | jhankarimadhupavratagananadavinaditah
    || 103|| navarnakritasamharadaityasrikparnamudgarah | takarashca phalasvadi vepitasheshamurdhajah
    || 104|| tamrasindurapujadhyo lalataphalakacchavih | thakaradhanapanktyadhyah santoshitadvijavrajah
    || 105|| dayamritahridambhojadhritanrailokyamandalah | dhanadadimahayakshasamsevitapadambujah || 106||
    namitasheshadevaughakiritamaniranjitah | paravargapavargadibhogacchedanadakshakah || 107|| phanicakrasamakarantamallamandalamanditah
    | baddhabhruyugabhimograsamtarjitasurasurah || 108|| bhavanihridayanandavarddhanaikanishakarah | madirakalashapritah
    karalaikakarambujah || 109|| yajnantarayasanghatasajjikritavarayudhah | ratnakarasutakrantakantikirtivivardhanah
    || 110|| lambodaramahabhimavapurdipkritasurah | varunadidigishanamarcitarcanacarcitah || 111|| shankaraikapriyah
    premanayananandavarddhanah | shodashasvaratalapagitaganavicakshanah || 112|| samadurgasarinnathastaranarkodupoharah
    | brahmavaikunthabrahmajnasamrakshitatanucarah || 113|| tarankamantravarnaikavigrahojjvalavigrahah
    | akaradikshakarantavidyabhushitavigrahah || 114|| om shrivinayako om hrim vighnadhyaksho ganadhipah
    | herambo modakaharo vakratundo vidhih smritah || 115|| vedantagito vidyarthisiddhamantrah shadaksharah
    | ganesho varado devo dvadashaksharamantritah || 116|| saptakotimahamantramantritasheshavigrahah |
    gangeyo ganasevyaksha om shridvaimaturah shivah || 117|| om hrim shrim klim glaum gam devo mahaganapatih
    prabhuh | idam namasahasram te mahaganapateh smritam || 118|| guhyam gopyatamam siddham sarvatantreshu
    gopitam | sarvamantramayam divyam sarvamantravinayakam || 119|| grahataramayam rashivarnapanktisamanvitam
    | sarvavidyamayam brahmasadhanam sadhakapriyam || 120|| ganeshasya ca sarvasvam rahasyam tridivaukasam
    | yatheshtaphaladam loke manorathaprapuranam || 121|| ashtasiddhimayam shreshtham sadhakanam jayapradam
    | vinarcanam bina homam vina nyasam vina japam || 122|| animadyashtasiddhinam sadhanam smritimatratah
    | caturthyamardharatre tu pathenmantri catushpathe || 123|| likhedbhurje mahadevi punyam namasahasrakam
    | dharayettam caturdashyam madhyahne murdhni va bhuje || 124|| yoshidvamakare caiva purusho dakshine
    bhuje | stambhayedapi brahmanam mohayedapi shankaram || 125|| vashayedapi trailokyam marayedakhilanripun
    | uccatayecca girvanam shamayecca dhananjayam || 126|| vandhya putram labhecchighram nirdhano dhanamapnuyat
    | trivaram yah pathedratrau ganeshasya purah shive || 127|| naktam shaktiyuto devi bhuktva bhoganyathepsitan
    | pratyakshavaradam pashyedganesham sadhakottamah || 128|| parahne pathyate namnam sahasram bhaktipurvakam
    | tasya vittadivibhavo darayuhsampadah sada || 129|| rane rajabhaye dyute pathennamasahasrakam | sarvatra
    jayamapnoti ganeshasya prasadatah || 130|| itidam punyasarvasvam mantranamasahasrakam | mahaganapateh
    punyam gopaniyam svayonivat || 131|| || iti shrirudrayamalatantre ucchishtaganeshasahasranamastotram
    samaptam ||
  devanagari: शुचिव्रतः ॥ २९॥ शरण्यः शौनकः शूरः शब्ददम्भी जटोरुकः । दारकः शिखिवाहेष्टः सितः शङ्करवल्लभः
    ॥ ३०॥ शङ्करो निर्भयो नित्यो लयकृल्लास्यतत्परः । लूतो लीलारसोल्लासी विलासी विभ्रमो भ्रमः ॥ ३१॥ भ्रमणः
    शशिभृत्सूर्यः शनिर्धरणिनन्दनः । बुधो विबुधसेव्यश्च बुधराजो बलन्धरः ॥ ३२॥ जीवो जीवप्रदो जेता स्तुत्यो
    नित्यो रतिप्रियः । कविः काव्यार्थकुशलो जनरक्षणतत्परः ॥ ३३॥ जनानन्दप्रदाता च जनकाह्लादकारकः । गच्छो
    गणपतिर्गच्छनायको गच्छगर्वहा ॥ ३४॥ गच्छराजोऽथ गच्छेशो गच्छराजनमस्कृतः । गच्छप्रियो गच्छगुरुर्गच्छत्राकृद्यमातुरः
    ॥ ३५॥ गच्छप्रभुर्गच्छचरो गच्छप्रियकृतोद्यमः । गच्छगीतगुणो गर्तो मर्यादाप्रतिपालकः ॥ ३६॥ गीर्वाणागमसारश्च
    नभो गीर्वाणदेवता । सम्पत्तिसदनाकारः सम्पत्तिसुखदायकः ॥ ३७॥ सम्पत्तिसुखकर्ता च सम्पत्तिसुभगाननः । सम्पत्तिशुभदो
    नित्यं सम्पत्तिश्च तपोधनः ॥ ३८॥ रुचको मेचकस्तुष्टः प्रभुस्तोमरघातकः । दण्डी चण्डांशुरव्यक्तः कमण्डलुधरोऽनघः
    ॥ ३९॥ कामी कर्मरतः कालकोलः क्रन्दितदिक्तटः । भ्रामको जातिपूज्यश्च जाड्यहा जडसूदनः ॥ ४०॥ जालन्धरो जगद्धासी
    हासकृद्गहनो गुहः । हविष्मान्हव्यवाहाक्षो हाटको हाटकाङ्गदः ॥ ४१॥ सुमेरुर्हिमवान्होता हरपुत्रो हलाङ्कपः
    । हालाप्रियो हृदा शान्तः कान्ताहृदयपोषणः ॥। ४२॥ शोषणः क्लेशहा क्रूरः कुबेरः कविताकृतिः । कुबेरो धीमयो
    धाता ध्येयो धीमान्दयानिधिः ॥ ४३॥ दविष्ठो दमनो हृष्टो दाता त्राता सितासमः । निर्गतो नैगमो गम्यो निर्जयो
    जटिलोऽजरः ॥ ४४॥ जनजीवो जितारातिर्जगद्व्यापी जगन्मयः । चामीकरनिभो नाभ्यो नलिनायतलोचनः ॥ ४५॥ रोचनामोचको
    मन्त्री मन्त्रकोटिसमाश्रितः । पञ्चभूतात्मकः पञ्चसायकः पञ्चवक्त्रकः ॥ ४६॥ पञ्चमः पश्चिमः पूर्वः पूर्णः
    कीर्णालकः कुणिः । कठोरहृदयग्रीवोऽलङ्कृतो ललिताशयः ॥ ४७॥ लोलचित्तो बृहन्नासो मासपक्षर्तुरूपवान् । ध्रुवो
    द्रुतगतिर्बन्धो धर्मवान्किंप्रियो नलः ॥ ४८॥ अगस्त्यग्रस्तभुवनो भुवनैकमलापहः । सागरः स्वर्गतिः स्वक्षः
    सानन्दः साधुपूजितः ॥ ४९॥ सतीपतिः समरसः सनकः सरलः सरः । सुरप्रियो वसुमतिर्वासवो वसुपूजितः ॥ ५०॥ वित्तदो
    वित्तनाथश्च धनिनां धनदायकः । राजीवनयनः स्मर्ता स्मृतिहा कृत्तिकाम्बरः ॥ ५१॥ अश्विनोऽश्विमुखः शुभ्रो
    भरणो भरणीप्रियः । कृत्तिकासनकः कोलो रोहिणी रोहिणोपमः ॥ ५२॥ क्रतवोष्टोरिमन्दी च रोहिणीमोहिनीभृतः ।
    मृगराजो मृगशिरो माधवो मधुरध्वनिः ॥ ५३॥ आर्द्रानलो महाबुद्धिर्महोरगविभूषणः । भ्रूक्षेपदन्तविभवो भ्रूकरालः
    पुनर्नवः ॥ ५४॥ पुनर्देवः पुनर्जेता पुनर्जीवः पुनर्वसुः । तिमिरस्तिमिकेतुश्च तिमिवासरघातनः ॥ ५५॥ तिष्यस्तुलाधरो
    जृम्भो विश्लेषाश्लेषदानराट् । मानवो माधवो माघो वाचालो मघवा यमः ॥ ५६॥ मघो मघाप्रियो मेघो महाशुण्डो
    महाभुजः । पूर्वाफाल्गुनिकः प्रीतः फल्गुरुत्तरफाल्गुनः ॥ ५७॥ फेनिलो ब्रह्मदो ब्रह्मा सप्ततन्तुसमाश्रयः
    । घोणाहस्तश्चतुर्हस्तो हस्तिवक्त्रो हलायुधः ॥ ५८॥ चित्राम्बरोऽर्चितपदः स्वस्तिदः स्वस्तिविग्रहः ।
    विशाखाशिखिसेव्यश्च शिखिध्वजसहोदरः ॥ ५९॥ अणूरेणूकरस्कारो रूरूरेणू सुतीनरः । अनूराधाप्रियो राधः श्रीमाञ्छुक्लः
    शुचिस्मितः ॥ ६०॥ ज्येष्ठः श्रेष्ठार्चितपदो मूलं त्रिजगतो गुरुः । शुचिः पूर्वोत्तराषाढश्चोत्तराषाढ
    ईश्वरः ॥ ६१॥ श्रव्योऽभिजिदनन्तात्मा श्रवश्चेष्टितदानवः । श्रावणः स्रावणः श्रोता धनी धन्यो धनप्रदः
    ॥ ६२॥ धनेच्छुकः सदातीव्रः शीतकुम्भः शरद्द्युतिः । पूर्वाभाद्रपदाभाद्रश्चोत्तराभाद्रपादितः ॥ ६३॥ रेणुकस्तनयो
    रामो रेवतीरमणो रमी । अश्वयुक्कार्तिकेयेष्टो मार्गशीर्षो मृगोत्तमः ॥ ६४॥ पौषैश्वर्यः फाल्गुनात्मा वसन्तश्चित्रको
    मधुः । राज्यदोऽभिजिदात्मीयस्तारेशस्तारकद्युतिः ॥ ६५॥ प्रतीतः प्रोर्जितः प्रीतः परमः परमो हितः । परहा
    पञ्चभूः पञ्चवायुपूज्यः परो महः ॥ ६६॥ पुराणागमविद्योगी महिषो रासभोऽग्रगः । ग्रहो मेषो वृषो मन्दो मन्मथो
    मिथुनाकृतिः ॥ ६७॥ कल्पभृत्कण्टकटको दीपो मर्कटेशप्रभुः । कर्कटो घृणिकुक्कूटो वनजो हंसयोहसः ॥ ६८॥ सिंहसिंहासनो
    भूष्यो मुहुर्मूषकवाहनः । कन्याकलावतीपुत्रो कन्याप्रीतः कुलोद्वहः ॥ ६९॥ अतुल्यरूपो बलदस्तुल्यभृत्तुल्यसाक्षिकः
    । अलिश्चापधरो धन्वी कच्छपो मकरो मणिः ॥ ७०॥ कुम्भभृत्कलशः कुब्जी मीनमांससुतर्पितः । राशिताराग्रहमयस्तिथिरूपो
    जगद्विभुः ॥ ७१॥ प्रतापी प्रतिपत्प्रेयो द्वितीयाद्वैतनिश्चितः । त्रिरुपश्च तृतीयाग्निस्त्रयीरूपस्त्रयीतनुः
    ॥ ७२॥ चतुर्थीवल्लभो देवो परागः पञ्चमीश्वरः । षड्रसास्वादको जातः षष्ठी षष्ठीकवत्सलः ॥ ७३॥ सप्तार्णवगतिः
    सारः सप्तमीश्वररोहितः । अष्टमीनन्दनोऽनन्तो नवमीभक्तिभावितः ॥ ७४॥ दशदिकपतिपूज्यश्च दशमीद्रुहिणो द्रुतः
    । एकादशात्मगणपो द्वादशीयुगचर्चितः ॥ ७५॥ त्रयोदशमणिस्तुत्यश्चतुर्दशस्वरप्रियः । चतुर्दशेन्द्रसंस्तुत्यः
    पूर्णिमानन्दविग्रहः ॥ ७६॥ दर्शादर्शौ दर्शगश्च वानप्रस्थो महेश्वरः । मौर्वी मधुरवाग्मूलं मूर्तिमान्मेघवाहनः
    ॥ ७७॥ महागजो जितक्रोधो जितशत्रुर्जयाश्रयः । रौद्रो रुद्रप्रियो रुद्रो रुद्रपुत्रोऽघनाशनः ॥ ७८॥ भवप्रियो
    भवानीष्टो भारभृद्भूतभावनः । गन्धर्वकुशलः कुण्ठो वैकुण्ठोऽभीष्टसेवितः ॥ ७९॥ वृत्रहा विघ्नहा सीरः समस्तदुरितापहा
    । मञ्जुरो मार्जरो मत्तो दुर्गापुत्रो दुरालसः ॥ ८०॥ अनन्तचित्सुधाधारो वीरवीर्यैकसाधकः । भास्वन्मुकुटमाणिक्यः
    कूजत्किङ्किणिजालकः ॥ ८१॥ शुण्डाधारी तुण्डचलः कुण्डली मुण्डमालकः । पद्माक्षः पद्महस्तश्च पद्मनाभसमर्चितः
    ॥ ८२॥ उदितारुणदन्तास्यो मालाभूषणभूषितः । नारदो वारणो लोलश्रवणः शूर्पकर्णकः ॥ ८३॥ बृहदुल्लासनासाढ्यो
    व्याप्तत्रैलोक्यमण्डलः । रत्नमण्डलासीनः कृशानुरूपशीलकः ॥ ८४॥ बृहत्कर्णाश्चलोद्भूतवायुवीजितदिक्पटः
    । बृहदास्यरवाक्रान्तो भीमब्रह्माण्डभाण्डकः ॥ ८५॥ बृहत्पादसमाक्रान्तः सप्तपातालदीपितः । बृहद्दन्तकृतात्युग्ररणानन्दरसालसः
    ॥ ८६॥ बृहद्धस्तधृताशेषायुधनर्जितदानवः । स्फुरत्सिन्दूरवदनः स्फुरत्तेजोऽग्निलोचनः ॥ ८७॥ उद्दीपितमणिस्फूर्जन्नूपुरध्वनिनादितः
    । चलतोयप्रवाहाढ्यो नदीजलकणाकरः ॥ ८८॥ भ्रमत्कुञ्जरसङ्घातवन्दिताङ्घ्रिशिरोरुहः । ब्रह्माच्युतमहारुद्रपुरःसरसुरार्चितः
    ॥ ८९॥ अशेषशेषप्रभृतिव्यालजालोपसेवितः । गर्जत्पञ्चाननारावप्रसादितधरातलः ॥ ९०॥ हाहाहूहूगतात्युग्रस्वरविभ्रान्तमानसः
    । पञ्चाशद्वर्णबीजाढयो मन्त्री मन्त्रितविग्रहः ॥ ९१॥ वेदान्तशास्त्रपीयूषधाराप्लावितभूतलः । शङ्खध्वनिसमाक्रान्तपातालादिनभस्तलः
    ॥ ९२॥ चिन्तामणिर्महामल्लो बल्लहस्तो बलिः कविः । कृतत्रेतायुगोल्लासभासमानजगत्त्रयः ॥ ९३॥ द्वापरः परलोकैकः
    कर्मध्वान्तसुधाकरः । सुधासिक्तवपुर्व्यासो ब्रह्माण्डादिकबाहुकः ॥ ९४॥ अकारादिक्षकारान्तवर्णपङ्क्तिसमुज्ज्वलः
    । अकाराकारमोद्गीतताननादनिनादितः ॥ ९५॥ इकारेकारमन्त्राढ्यो मालाभरणलालसः । उकारोकारमोहारिर्घोरनागोपवीतकः
    ॥ ९६॥ ऋवर्णाङ्कित ॠकारपद्मालयसमुज्जवलः । लृकारयुतॡकारशङ्खपूर्णदिगन्तरः ॥ ९७॥ एकारैकारगिरिजास्तनपानविचक्षणः
    । ओकारौकारविश्वादिकृतसृष्टिक्रमालसः ॥ ९८॥ अंओवर्णावलीव्याप्तपादादिशीर्षमण्डलः । कर्णतालकृतात्युच्चैर्वायुवीजितनिर्जरः
    ॥ ९९॥ खगेशध्वजरत्नाङ्कः किरीटारुणपादकः । गर्विताशेषगन्धर्व्वगीततत्परश्रोतृकः ॥ १००॥ घनवाहनवागीशपुरःसरसुरार्चितः
    । ङवर्णामृतवाराढ्यसोममानैकदन्तकः ॥ १०१॥ चन्द्रकुङ्कुमजम्बाललिप्तसिन्दूरविग्रहः । छत्रचामररत्नाढ्यमुकुटालङ्कृताननः
    ॥ १०२॥ जटाद्धमहानर्घमणिपङ्क्तिविराजितः । झङ्कारिमधुपव्रातगाननादविनादितः ॥ १०३॥ ञवर्णकृतसंहारदैत्यासृक्पर्णमुद्गरः
    । टकारश्च फलास्वादी वेपिताशेषमूर्धजः ॥ १०४॥ ताम्रसिन्दूरपूजाढ्यो ललाटफलकच्छविः । थकारधनपङ्क्त्याढ्यः
    सन्तोषितद्विजव्रजः ॥ १०५॥ दयामृतहृदम्भोजधृतन्रैलोक्यमण्डलः । धनदादिमहायक्षसंसेवितपदाम्बुजः ॥ १०६॥
    नमिताशेषदेवौघकिरीटमणिरञ्जितः । परवर्गापवर्गादिभोगच्छेदनदक्षकः ॥ १०७॥ फणिचक्रसमाकरान्तमल्लमण्डलमण्डितः
    । बद्धभ्रूयुगभीमोग्रसंतर्जितसुरासुरः ॥ १०८॥ भवानीहृदयानन्दवर्द्धनैकनिशाकरः । मदिराकलशप्रीतः करालैककराम्बुजः
    ॥ १०९॥ यज्ञान्तरायसङ्घातसज्जीकृतवरायुधः । रत्नाकरसुताक्रान्तकान्तिकीर्तिविवर्धनः ॥ ११०॥ लम्बोदरमहाभीमवपुर्दीप्कृतासुरः
    । वरुणादिदिगीशानामर्चितार्चनचर्चितः ॥ १११॥ शङ्करैकप्रियः प्रेमनयनानन्दवर्द्धनः । षोडशस्वरतालापगीतगानविचक्षणः
    ॥ ११२॥ समदुर्गसरिन्नाथस्तारणार्कोडुपोहरः । ब्रह्मवैकुण्ठब्रह्मज्ञसंरक्षिततनूचरः ॥ ११३॥ ताराङ्कमन्त्रवर्णैकविग्रहोज्ज्वलविग्रहः
    । अकारादिक्षकारान्तविद्याभूषितविग्रहः ॥ ११४॥ ॐ श्रीविनायको ॐ ह्रीं विघ्नाध्यक्षो गणाधिपः । हेरम्बो
    मोदकाहारो वक्रतुण्डो विधिः स्मृतः ॥ ११५॥ वेदान्तगीतो विद्यार्थिसिद्धमन्त्रः षडक्षरः । गणेशो वरदो देवो
    द्वादशाक्षरमन्त्रितः ॥ ११६॥ सप्तकोटिमहामन्त्रमन्त्रिताशेषविग्रहः । गाङ्गेयो गणसेव्यक्ष ॐ श्रीद्वैमातुरः
    शिवः ॥ ११७॥ ॐ ह्रीं श्रीं क्लीं ग्लौं गं देवो महागणपतिः प्रभुः । इदं नामसहस्रं ते महागणपतेः स्मृतम्
    ॥ ११८॥ गुह्यं गोप्यतमं सिद्धं सर्वतन्त्रेषु गोपितम् । सर्वमन्त्रमयं दिव्यं सर्वमन्त्रविनायकम् ॥ ११९॥
    ग्रहतारामयं राशिवर्णपङ्क्तिसमन्वितम् । सर्वविद्यामयं ब्रह्मसाधनं साधकप्रियम् ॥ १२०॥ गणेशस्य च सर्वस्वं
    रहस्यं त्रिदिवौकसाम् । यथेष्टफलदं लोके मनोरथप्रपूरणम् ॥ १२१॥ अष्टसिद्धिमयं श्रेष्ठं साधकानां जयप्रदम्
    । विनार्चनं बिना होमं विना न्यासं विना जपम् ॥ १२२॥ अणिमाद्यष्टसिद्धीनां साधनं स्मृतिमात्रतः । चतुर्थ्यामर्धरात्रे
    तु पठेन्मन्त्री चतुष्पथे ॥ १२३॥ लिखेद्भूर्जे महादेवि पुण्यं नामसहस्रकम् । धारयेत्तं चतुर्दश्यां मध्याह्ने
    मूर्ध्नि वा भुजे ॥ १२४॥ योषिद्वामकरे चैव पुरुषो दक्षिणे भुजे । स्तम्भयेदपि ब्रह्माणं मोहयेदपि शङ्करम्
    ॥ १२५॥ वशयेदपि त्रैलोक्यं मारयेदखिलान्रिपून् । उच्चाटयेच्च गीर्वाणं शमयेच्च धनञ्जयम् ॥ १२६॥ वन्ध्या
    पुत्रं लभेच्छीघ्रं निर्धनो धनमाप्नुयात् । त्रिवारं यः पठेद्रात्रौ गणेशस्य पुरः शिवे ॥ १२७॥ नक्तं शक्तियुतो
    देवि भुक्त्वा भोगान्यथेप्सितान् । प्रत्यक्षवरदं पश्येद्गणेशं साधकोत्तमः ॥ १२८॥ पराह्णे पठ्यते नाम्नां
    सहस्रं भक्तिपूर्वकम् । तस्य वित्तादिविभवो दारायुःसम्पदः सदा ॥ १२९॥ रणे राजभये द्यूते पठेन्नामसहस्रकम्
    । सर्वत्र जयमाप्नोति गणेशस्य प्रसादतः ॥ १३०॥ इतीदं पुण्यसर्वस्वं मन्त्रनामसहस्रकम् । महागणपतेः पुण्यं
    गोपनीयं स्वयोनिवत् ॥ १३१॥ ॥ इति श्रीरुद्रयामलतन्त्रे उच्छिष्टगणेशसहस्रनामस्तोत्रं समाप्तम् ॥
