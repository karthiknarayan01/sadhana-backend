id: ekashlokirama-3
category: stotram
name:
  english: ekashlokirama 3
  devanagari: एकश्लोकिराम ३
content:
  english: ekashloki ramayanam 3 janmadau kraturakshanam munipateh sthanordhanurbhanjanam vaidehigrahanam
    pitushca vacanadghoratavigahanam | kodandagrahanam kharadimathanam mayamrigacchedanam baddhabdhikramanam
    dashasyanidhanam caitaddhi ramayanam || iti ekashloki ramayanam
  devanagari: एकश्लोकि रामायणम् ३ जन्मादौ क्रतुरक्षणं मुनिपतेः स्थाणोर्धनुर्भञ्जनं वैदेहीग्रहणं पितुश्च
    वचनाद्घोराटवीगाहनम् । कोदण्डग्रहणं खरादिमथनं मायामृगच्छेदनं बद्धाब्धिक्रमणं दशास्यनिधनं चैतद्धि रामायणम्
    ॥ इति एकश्लोकि रामायणं
meaning: {}
