    | om tamraya namah | 10 || om arunaya namah | om babhrave namah | om nilakanthaya namah | om ghantahastaya
    namah | om shambhave namah | om rudraya namah | om amoghaviryaya namah | om sarvadaya namah | om pinakine
    namah | om jatukarnaya namah | 20 || om somaya namah | om bhavaya namah | om bhavahetave namah | om
    ugraya namah | om ghorarupaya namah | om vamadevaya namah | om mundine namah | om khagamaya namah
    | om shamaya namah | om sannagordhvavilasine namah | 30 || om asannajanapalaya namah | om nilagrivaya
    namah | om vedhase namah | om amoghabalaviryaya namah | om shatavartaya namah | om ragine namah |
    om hiranyavaraviryaya namah | om rasendravaravijine namah | om dhvajine namah | om garjamanaya namah
    | 40 || om hunkaraya namah | om urutejase namah | om tigmayudhaya namah | om yodhaya namah | om rathadhipataye
    namah | om bilmine namah | om bilvapujyaya namah | om prasannaya namah | om kapaline namah | om bhikshave
    namah | 50 || om yakshapujyaya namah | om tryakshaya namah | om pramathaya namah | om ushnishine namah
    | om makutine namah | om gadahastaya namah | om vajrine namah | om khadgakhetakaraya namah | om bhishagvaryaya
    namah | om bhargaya namah | 60 || om sahamanaya namah | om yugavartaya namah | om bhavine namah |
    om jvalajjvalaya namah | om tushtaya namah | om hrishtapushaya namah | om dhrishnave namah | om gunapriyaya
    namah | om gadyaya namah | om parnashadyaya namah | 70 || om vaidyute namah | om jataya namah | om
    sadyojataya namah | om pavine namah | om varshate namah | om grasate namah | om avarshyaya namah |
    om arvataya namah | om katyaya namah | om prapathyaya namah | 80 || om vastupaya namah | om garadine
    namah | om balapramathanaya namah | om sarvabhutadamaya namah | om kalanashaya namah | om bhalanetraya
    namah | om dantine namah | om hanahanaya namah | om punyaya namah | om punyavasaya namah | 90 || om
    purushaya namah | om puranaya namah | om rishaye namah | om vedamurtaye namah | om annadhipataye namah
    | om sarvesham pataye namah | om vitihotraya namah | om patraya namah | om sutramne namah | om bhudharaya
    namah | 100 || om parameshaya namah | om bhidyaya namah | om akhidyaya namah | om suraya namah | om
    brahmakandharamalaya namah | om vamanagadharaya namah | om vishnuraktaprapanaya namah | om narasihmaharaya
    namah | 108 || || iti shivarahasyavyutpannam kartikamasakrite shivashatashtanamavalih sampurna ||
