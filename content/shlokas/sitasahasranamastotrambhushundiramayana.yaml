id: sitasahasranamastotrambhushundiramayana
category: stotram
name:
  english: sitasahasranamastotrambhushundiramayana
  devanagari: सीतासहस्रनामस्तोत्रम्भुशुण्डीरामायण
content:
  english: ya shriretasya sahaja sita nityangasangino | bhavitri janakasyaiva kule sarvangasundari ||
    1|| tasyashca namasahasram kathayishyami bhupate | yatha ramastathaiveyam mahalakshmih sanatani ||
    2|| nanayoh sammato bhedah shastrakotishatairapi | asyaiva nityaramano bahunamasvarupatah || 3|| tasyastu
    namasahasram yathavadupadharaya | am sahajanandini sita janaki radhika ratih || 4|| rukmini kamala
    kanta kantih kamalalocana | kishori ramalalana kamuki karunanidhih || 5|| kandarpavaddhini vira varunalayavasino
    | ashokavanamadhyastha mahashokavinashini || 6|| campakangi taditkantirjahnavi janakatmaja | janaki
    jayada japya jayini jaitrapalika || 7|| parama paramananda punimamritasagara | sudhasutih sudharashmih
    sudhadipitavigraha || 8|| susmita susmitamukhi taraka sukhadekshana | rakshani citrakutastha vrindavanamaheshvari
    || 9|| kandarpakotijanani kotibrahmandanayika | sharanya sharada shrishca sharatkalavinodini || 10||
    hamsi kshirabdhivasatirvasuki sthavarangana | varangasanasamsthana priyabhogavisharada || 11|| vasishthavishvavasini
    vishvapatni gunodaya | gauri campakagatra ca dipadyota prabhavati || 12|| ratnamalavibhusha ca divyagopalakanyaka
    | satyabhamaratih prita mitra cittavinodini || 13|| sumitra caiva kaushalya kaikeyikulavarddhini |
    kulina kelini daksha dakshakanya dayavati || 14|| parvati shailakulaja vamshadhvajapatirucih | rucira
    rucirapanga purnarupa kalavati || 15|| kotibrahmandalakshmisha sthanadatri sthitih sati | amrita modini
    moda ratnacalaviharini || 16|| nandabhanusuta dhira vamshiravavinodini | vijaya vijini vidya vidyadanaparayana
    || 17|| mandasmita mandagatirmadana madanatura | vrimhini vrihati varya varaniya varangana || 18||
    ramapriya ramarupa rasanrityavisharada | gandharvika gitaramya sangitarasavarddhini || 19|| talada
    talavakshoja talabhedanasundari | sarayutirasantushta yamunatatasamsthita || 20|| svamini svaminirata
    kausumbhavasanavrita | malini tungavakshoja phalini phalamalini || 21|| vaiduryaharasubhaga muktaharamanohara
    | kirativeshasamsthana gunjamanivibhushana || 22|| vibhutida vibha vina vinanadavinodini | priyangukalikapanga
    kataksha gatitoshita || 23|| ramanuraganilaya ratnapankajamalini | vibhava vinayastha ca madhura patisevita
    || 24|| shatrughnavaradatri ca ravanapranamocini |
  devanagari: या श्रीरेतस्य सहजा सीता नित्याङ्गसङ्गिनो । भवित्री जनकस्यैव कुले सर्वाङ्गसुन्दरी ॥ १॥ तस्याश्च
    नामसाहस्रं कथयिष्यामि भूपते । यथा रामस्तथैवेयं महालक्ष्मीः सनातनी ॥ २॥ नानयोः संमतो भेदः शास्त्रकोटिशतैरपि
    । अस्यैव नित्यरमणो बहुनामस्वरूपतः ॥ ३॥ तस्यास्तु नामसाहस्रं यथावदुपधारय । अं सहजानन्दिनी सीता जानकी
    राधिका रतिः ॥ ४॥ रुक्मिणी कमला कान्ता कान्तिः कमललोचना । किशोरी रामललना कामुकी करुणानिधिः ॥ ५॥ कन्दर्पवद्धिनी
    वीरा वरुणालयवासिनो । अशोकवनमध्यस्था महाशोकविनाशिनी ॥ ६॥ चम्पकाङ्गी तडित्कान्तिर्जाह्नवी जनकात्मजा
    । जानकी जयदा जप्या जयिनी जैत्रपालिका ॥ ७॥ परमा परमानन्दा पूणिमामृतसागरा । सूधासूतिः सुधारश्मिः सुधादीपितविग्रहा
    ॥ ८॥ सुस्मिता सुस्मितमुखी तारका सुखदेक्षणा । रक्षणी चित्रकूटस्था वृन्दावनमहेश्वरी ॥ ९॥ कन्दर्पकोटिजननी
    कोटिब्रह्माण्डनायिका । शरण्या शारदा श्रीश्च शरत्कालविनोदिनी ॥ १०॥ हंसी क्षीराब्धिवसतिर्वासुकी स्थावराङ्गना
    । वराङ्गासनसंस्थाना प्रियभोगविशारदा ॥ ११॥ वसिष्ठविश्ववसिनी विश्वपत्नी गुणोदया । गौरी चम्पकगात्रा च
    दीपद्योता प्रभावती ॥ १२॥ रत्नमालाविभूषा च दिव्यगोपालकन्यका । सत्यभामारतिः प्रीता मित्रा चित्तविनोदिनी
    ॥ १३॥ सुमित्रा चैव कौशल्या कैकेयीकुलवर्द्धिनी । कुलीना केलिनी दक्षा दक्षकन्या दयावती ॥ १४॥ पार्वती
    शैलकुलजा वंशध्वजपटीरुचिः । रुचिरा रुचिरापाङ्गा पूर्णरूपा कलावती ॥ १५॥ कोटिब्रह्माण्डलक्ष्मीशा स्थानदात्री
    स्थितिः सती । अमृता मोदिनी मोदा रत्नाचलविहारिणी ॥ १६॥ नन्दभानुसुता धीरा वंशीरवविनोदिनी । विजया वीजिनी
    विद्या विद्यादानपरायणा ॥ १७॥ मन्दस्मिता मन्दगतिर्मदना मदनातुरा । वृंहिणी वृहती वर्या वरणीया वराङ्गना
    ॥ १८॥ रामप्रिया रमारूपा रासनृत्यविशारदा । गान्धर्विका गीतरम्या सङ्गीतरसवर्द्धिनी ॥ १९॥ तालदा तालवक्षोजा
    तालभेदनसुन्दरी । सरयूतीरसन्तुष्टा यमुनातटसंस्थिता ॥ २०॥ स्वामिनी स्वामिनिरता कौसुम्भवसनावृता । मालिनी
    तुङ्गवक्षोजा फलिनी फलमालिनी ॥ २१॥ वैडूर्यहारसुभगा मुक्ताहारमनोहरा । किरातीवेशसंस्थाना गुञ्जामणिविभूषणा
    ॥ २२॥ विभूतिदा विभा वीणा वीणानादविनोदिनी । प्रियङ्गुकलिकापाङ्गा कटाक्षा गतितोषिता ॥ २३॥ रामानुरागनिलया
    रत्नपङ्कजमालिनी । विभावा विनयस्था च मधुरा पतिसेविता ॥ २४॥ शत्रुघ्नवरदात्री च रावणप्राणमोचिनी ।
