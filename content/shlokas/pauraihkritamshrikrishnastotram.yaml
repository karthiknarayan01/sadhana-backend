id: pauraihkritamshrikrishnastotram
category: stotram
name:
  english: pauraihkritamshrikrishnastotram
  devanagari: पौरैःकृतंश्रीकृष्णस्तोत्रम्
content:
  english: pauraih kritam shrikrishnastotram hareraradhananyuccaih pratisaudham padepade | tasya rajye
    samabhavanmahabhaganidheh shive || 12|| govrindagopagopalagopijanamanohara | gadapane gunatita gunadhya
    garudadhvaja || 13|| keshihankaitabharate kamsare kamalapate || 14|| krishna keshava kanjaksha kinashabhayanashana
    | purushottama papare pundarikavilocana || 15|| pitakausheyavasana padmanabha paratpara | janarddana
    jagannatha jahnavijalajanmabhuh || 16|| janminam janmaharana janjapukaughanashana | shrivatsavakshah
    shrikantha shrikara shreyasannidhe || 17|| shriranga sharngakodanda shaure shitamshulocana | daityare
    danavarate damodara durantaka || 18|| devakihridayananda dandashukeshvareshaya | vishno vaikunthanilaya
    banare vishtarashravah || 19|| vishvaksena vibho vira vanamalinbalipriya | trivikrama trilokesha cakrapane
    caturbhuja || 2
  devanagari: पौरैः कृतं श्रीकृष्णस्तोत्रम् हरेराराधनान्युच्चैः प्रतिसौधं पदेपदे । तस्य राज्ये समभवन्महाभागनिधेः
    शिवे ॥ १२॥ गोवृन्दगोपगोपालगोपीजनमनोहर । गदापाणे गुणातीत गुणाढ्य गरुडध्वज ॥ १३॥ केशिहन्कैटभाराते कंसारे
    कमलापते ॥ १४॥ कृष्ण केशव कञ्जाक्ष कीनाशभयनाशन । पुरुषोत्तम पापारे पुण्डरीकविलोचन ॥ १५॥ पीतकौशेयवसन
    पद्मनाभ परात्पर । जनार्द्दन जगन्नाथ जाह्नवीजलजन्मभूः ॥ १६॥ जन्मिनां जन्महरण जञ्जपूकौघनाशन । श्रीवत्सवक्षः
    श्रीकण्ठ श्रीकर श्रेयसान्निधे ॥ १७॥ श्रीरङ्ग शार्ङ्गकोदण्ड शौरे शीतांशुलोचन । दैत्यारे दानवाराते दामोदर
    दुरन्तक ॥ १८॥ देवकीहृदयानन्द दन्दशूकेश्वरेशय । विष्णो वैकुण्ठनिलय बाणारे विष्टरश्रवः ॥ १९॥ विष्वक्सेन
    विभो वीर वनमालिन्बलिप्रिय । त्रिविक्रम त्रिलोकेश चक्रपाणे चतुर्भुज ॥ २
meaning: {}
