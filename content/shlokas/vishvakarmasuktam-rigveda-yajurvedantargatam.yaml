id: vishvakarmasuktam-rigveda-yajurvedantargatam
category: sukta
name:
  english: vishvakarmasuktam (rigveda-yajurvedantargatam)
  devanagari: विश्वकर्मासूक्तम् (ऋग्वेद-यजुर्वेदान्तर्गतम्)
content:
  english: 82 cakshushah pita manasa hi dhiro ghritamene ajanannannamane | yadedanta adadrihanta purva
    adiddyavaprithivi aprathetam || 1|| vishvakarma vimana advihaya dhata vidhata paramota samdrik | teshamishtani
    samisha madanti yatra saptarishinpara ekamahuh || 2|| yo nah pita janita yo vidhata dhamani veda bhuvanani
    vishva | yo devanam namadha eka eva tam samprashnam bhuvana yantyanya || 3|| ta ayajanta dravinam
    samasma rishayah purve jaritaro na bhuna | asurte surte rajasi nishatte ye bhutani samakrinvannimani
    || 4|| paro diva para ena prithivya paro devebhirasurairyadasti | kam svidgarbham prathamam dadhra
    apo yatra devah samapashyanta vishve || 5|| tamidgarbham prathamam dadhra apo yatra devah samagacchanta
    vishve | ajasya nabhavadhyekamarpitam yasminvishvani bhuvanani tasthuh || 6|| na tam vidatha ya ima
    jajananyadyushmakamantaram babhuva | niharena pravrita jalpya casutripa ukthashasashcaranti || 7||
    yajurveda ke 17vem adhyaya mem usaka 24vam mahatvapurna mantra vishvakarman havisha vardhanena trataramindramakrinoravadhyam
    | tasmai vishah samanamanta daivirayamugro vihavyo yathasat || 24|| he vishva ke racayita parameshvara
  devanagari: ८२ चक्षुषः पिता मनसा हि धीरो घृतमेने अजनन्नन्नमाने । यदेदन्ता अददृहन्त पूर्व आदिद्द्यावापृथिवी
    अप्रथेताम् ॥ १॥ विश्वकर्मा विमना आद्विहाया धाता विधाता परमोत संदृक् । तेषामिष्टानि समिषा मदन्ति यत्रा
    सप्तऋषीन्पर एकमाहुः ॥ २॥ यो नः पिता जनिता यो विधाता धामानि वेद भुवनानि विश्वा । यो देवानां नामधा एक
    एव तं सम्प्रश्नं भुवना यन्त्यन्या ॥ ३॥ त आयजन्त द्रविणं समस्मा ऋषयः पूर्वे जरितारो न भूना । असूर्ते
    सूर्ते रजसि निषत्ते ये भूतानि समकृण्वन्निमानि ॥ ४॥ परो दिवा पर एना पृथिव्या परो देवेभिरसुरैर्यदस्ति
    । कं स्विद्गर्भं प्रथमं दध्र आपो यत्र देवाः समपश्यन्त विश्वे ॥ ५॥ तमिद्गर्भं प्रथमं दध्र आपो यत्र
    देवाः समगच्छन्त विश्वे । अजस्य नाभावध्येकमर्पितं यस्मिन्विश्वानि भुवनानि तस्थुः ॥ ६॥ न तं विदाथ य
    इमा जजानान्यद्युष्माकमन्तरं बभूव । नीहारेण प्रावृता जल्प्या चासुतृप उक्थशासश्चरन्ति ॥ ७॥ यजुर्वेद
    के १७वें अध्याय में उसका २४वां महत्वपूर्ण मन्त्र विश्वकर्मन् हविषा वर्धनेन त्रातारमिन्द्रमकृणोरवध्यम्
    । तस्मै विशः समनमन्त दैवीरयमुग्रो विहव्यो यथासत् ॥ २४॥ हे विश्व के रचयिता परमेश्वर
