id: gauraganoddeshadipika
category: stotram
name:
  english: gauraganoddeshadipika
  devanagari: गौरगणोद्देशदीपिका
content:
  english: nityanandavadhuto maha iti mahitam hanta sankarshano yah iti ca ||61|| yada shrivishvarupo'yam
    tirobhutah sanatanah | nityanandavadhutena militvapi tada sthitah ||62|| tato'vadhuto bhagavanbalatma
    bhavansada vaishnavavargamadhye | jajvala tigmamshusahasrateja iti bruvanme janako nanarta ||63||
    svamshena sheshena ya esha shayya vishnoshca krishnasya ca vasabhusha | svangasya bhushavalayadirupair
    lilakhyaya vedanigudhalilam ||64|| shrivarunirevatavamshasambhave tasya priye dve vasudha ca jahnavi
    | shrisuryadasasya mahatmanah sute kakudmirupasya ca saryatejasah ||65|| kecitshrivasudhadevim kalavapi
    vivrinvate | anangamanjarim kecijjahnavim ca pracakshate | ubhayam tu samicinam purvanyayatsatam matam
    ||66|| sankarshanasya yo vyuhah payobdhishayinamakah | sa eva viracandro'bhuccaitanyabhinnavigrahah
    ||67|| amum pravishatam karyatsajahau nishatholmukau | minaketanaramadirvyuhah sankarshano'parah ||68||
    vishnupadodbhava ganga yasitsa nija namatah | nityanandatmaja jata madhavah shantanurnripah ||69||
    vyuhastritiyah pradyumnah priyanarmasakho'bhavata| cakre lilasahayam yo radhamadhavayorvraje | shricaitanyadvaitatanuh
    sa eva raghunandanah ||70|| vyuhasturyo'niruddho yo sa vakreshvarapanditah | krishnaveshajanrityena
    prabhoh sukhamajijanata||71|| sahasragayakanmahyam dehi tvam karunamaya | iti caitanyapade yah uvaca
    madhuram vacah ||72|| svaprakashavibhedena shashirekha tamavishata| avirbhavo gauraharernakulabrahmacarini
    ||73|| aveshashca tatha jneyo mishre pradyumnasamjnake | acaryo bhagavankhanjah kala gaurasya kathyate
    ||74|| gopinathacaryanamna brahma jneyo jagatpatih | navavyuhe tu ganito yastantre tantravedibhih
    ||75|| vraje avesharupatvadvyuho yo'pi sadashivah | sa evadvaitagosvami caitanyabhinnavigrahah ||76||
    yashca gopaladehah sanvraje krishnasya sannidhau | nanarta shrishivatantre bhairavasya vaco yatha
    ||77|| ekada karttike masi dipayatra mahotsave | saramah sahagopalah krishno nrityati yatnavana||78||
    nirikshya madgururdevo gopabhavabhilashavana| priyena nartitumarabdhashcakrabhramanalilaya ||79||
    shrikrishnasya prasadena dvividho'bhutsadashivah | ekastatra shivah sakshadanyo gopalavigrahah ||80||
    mahadevasya mitram yah kuvero guhyakeshvarah | kuverapanditah so'dya janako'sya vidambarah ||81||
    pura kuverah kailase siddhasadhyanishevite | jajapa paramam mantram shaivam shrishivavallabhah ||82||
    tato dayalurbhagavanvaram vrinviti so'bravita| tada kuvero varayamasa tvam me suto bhava ||83|| prarthitastena
    devesho varadesho sadashivah | janmanyantare putrah prapsyami putratam tava ||84|| iti prapya varam
    kashtam kiyantam kalamasthitah | karyadishavashatso'dyadvaitasya janako'bhavata||85|| yogamaya bhagavati
    grihini tasya sampratam | sitarupenavatirna shrinamna tatprakashatah ||86|| tasya putro'cyutanandah
    krishnacaitanyavallabhah | shrimatpanditagosvamishishyah priya iti shrutam ||87|| yah karttikeyah
    pragasiditi jalpanti kecana | kecidahu rasavido'cyutanamni tu gopika || ubhayam tu samicinam dvayorekatra
    sangatata| karttikeyah krishnamishrastatsamyaditi kecana ||88|| nandini jangali jneya jaya ca vijaya
    kramata||89|| shrivasapandito dhimanyah pura narado munih | parvatakhyo munivaro ya asinnaradapriyah
    | sa ramapanditah shrimanstatkanishthasahodarah ||90|| murari gupto hanumanangadah shripurandarah
    | yah shrisugrivanamasidgovindananda eva sah ||91|| vibhishano yah pragasidramacandrapuri smritah
    | uvacato gauraharirnaitadramasya karanam || jatila radhikashvashruh karyato'vishadeva tam | ato mahaprabhurbhikshasankocadi
    tato'karota||92|| ricikasya muneh putro namna brahma mahatapah | prahladena samam jato haridasakhyako'pi
    sana||93|| murariguptacaranaishcaitanyacaritamrite | ukto munisutah pratastulasipatramaharana||94||
    adhautamabhishaptastam pita yavanatam gatah | sa eva haridasah sanjatah parama bhaktimana||95|| vrindavane
    yah pragasannanimadyashtasiddhayah | ta evashtau bhaktarupa bhuta gaude ca te yatha ||96|| anatashca
    sukhanando govindo raghunathakah | krishnanandah keshavashca shridamodararaghavau | puryupadhikramajjneya
    animadyashtasiddhayah ||97|| jayanteyah sthita urdhvaretasah samadarshinah | navabhagavatah purvam
    shribhagavatasamhitah ||98|| pratyucurjanakam te'dya bhutva sannyasinah sada | prabhuna gauraharina
    viharanti sma te yatha ||99|| shrinrisimhanandatirthah shrisatyanandabharati | shrinrisimhacidanandajagannatha
    hi tirthakah ||100|| tirthabhidho vasudevah shriramah purushottamah | garudakhyavadhutashca shrigopendrakhya
    ashramah ||101|| loke ye nidhayah khyatah padmashankhadayo nava | atraiva nidhiratnakhyagarbhajatah
    prabhoh priyah ||102|| shrishrinidhishca shrigarbhah kaviratnah sudhanidhih | vidyanidhirgunanidhi
    ratnabahurdvijagranih | shrimanacaryaratnashca shriratnakara panditah ||103|| nilambarascakravarti
    gaurasya bhavijanma yata| sabhayam kathayamasa tenasau garga ucyate ||104|| shrishacya janakatvena
    sumukho ballavo matah | patalaya vraje khyata jneya tasya sadharmini ||105|| purananamarthavetta shridevanandapanditah
    | purasinnandaparishatpandito bhagurirmunih ||106|| kashinatho lokanathah shrinatho ramanathakah |
    catvaro'mi jnanibhaktah sanakadya na samshayah ||107|| caturshvapyeshu shabdeshu nathashabdasya kirtanata|
    catuhsanavadevatra caturnatha udiritah ||108|| vedavyaso ya evasiddaso vrindavano'dhuna | sakha yah
    kusumapidah karyatastam samavishata||109|| bhatto vallabha namabhucchuko dvaipayanatmajah ||110||
    acaryah shrijagannatho gangadasah prabhupriyah | asinnidhuvane pragyo durvasa gopikapriyah ||111||
    candrashekhara acaryashcandro jneyo vicakshanaih | shrimanuddhavadaso'pi candraveshavatarakah ||112||
    atashcaitanya harina kathito'yam nishapatih | shrimadvishveshvaracaryo yah pragasiddivakarah ||113||
    vishvakarma pura yo'bhudadya bhaskarathakkurah | bhikshako vanamali yah sudamasiddvijo pura | dhanam
    prapya prabhoh sange duhkham matvabhramadyatah ||114|| vaikunthe dvarapalau yau jayadyavijayantakau
    | tavadya jatau svecchatah shrijagannathamadhavau ||115|| pundarikakshakumudau khyatau vaikunthamandale
    | govindagarudakhyau tau jatau gaude prabhoh priyau ||116|| garudah panditah so'dya garudo yah pura
    shrutah | pura yo'kruranamasitsa gopinathasimhakah | iti kecitprabhashante'krurah keshavabharati ||117||
    puri paramanando ya asiduddhavah pura || indradyumno maharajo jagannatharcakah pura | jatah prataparudrah
    sansama indrena so'dhuna ||118|| bhattacaryah sarvabhaumah purasidgishpatirdivi ||119|| priyanarmasakha
    kashcidarjunah pandavo'rjunah | militva samabhudramanandarayah prabhoh priyah ||120|| ato radhakrishnabhaktiprematattvadikam
    kriti | ramanando gauracandram pratyavarnayadanvaham ||121|| lalitetyahureke yattadekenanumanyante
    | bhavanandam prati praha gauro yattvam prithapatih ||122|| gopyarjuniyaya sardhamekibhayapi pandavah
    | arjuno yadrayaramananda ityahuruttamah ||123|| arjuniyabhavatturnamarjuno'pi ca pandavah | iti padmottarakhande
    vyaktameva virajate | tasmadetattrayam ramanandarayamahashayah ||124|| vraje bhaktah samasena kathyante'tha
    yatha matih ||125|| pura shridamanamasidabhiramo'dhuna mahana| dvatrimshata janaireva bahyam kashthamuvaha
    yah ||126|| pura sudamanamasidadya sundarathakkurah | vasudamasakha yashca panditah shridhananjayah
    ||127|| subalo yah priyashreshthah sa gauridasapanditah | kamalakarapippalainamnasidyo mahabalah ||128||
    subahuryo vraje gopo datta uddharanakhyakah | maheshapanditah shrimanmahabahurvraje sakha ||129||
    stokakrishnah sakha pragyo dasah shripurushottamah ||130|| sadashivasuto namna nagarah purushottamah
    | vaidyavamshodbhavo namna dama yo ballavo vraje ||131|| namnarjunah sakha pragyo dasah sa parameshvarah
    | kalah shrikrishnadasah sa yo lavangah sakha vraje ||132|| kholavecataya khyatah panditah shridharo
    dvijah | asidvraje hasyakari yo namna kusumasavah ||133|| balaramasakha kashcitprabalo gopabalakah
    | asidvraje pura yo'dya sa halayudhathakkurah ||134|| varuthapah sakha namna krishnacandrasya yo vraje
    | asitsa eva gaurangavallabho rudrapanditah ||135|| gandharvo yo vraje gopah kumudanandapanditah ||136||
    pura vrindavane cetau sthitau bhringarabhangurau | shrikashishvara govindau tau jatau prabhusevakau
    ||137|| vrindavane sthitau pragyau bhrityau raktakapatrakau | gaurangasevakavadya haridasabrihacchishu
    ||138|| payodavaridau pragyau nirasamskarakarinau | tavadya bhrityau ramayirnandayishceti vishrutau
    ||139|| vraje sthitau gayakau yau madhukanthamadhuvratau | mukundavasudevau tau dattau gaurangagayakau
    ||140|| natashcandramukhah pragyah sa karo makaradhvajah ||141|| purasidyo vraje namna mridangi shrisudhakarah
    | sa shrishankaraghosho'dya damphavadyavisharadah ||142|| asidvraje candrahaso nartako rasakovidah
    | so'yam nrityavinodi shrijagadishakhyapanditah ||143|| venum ca muralim yo'dhannamna maladharo vraje
    | so'dhuna vanamalakhyah pandito gauravallabhah ||144|| vrindavane yau vikhyatau shukau dakshavicakshanau
    | tavadya jatau majjyeshthau caitanyaramadasakau ||145|| adhuna ballavivarga ye ye bhutah prabhupriyah
    | te ta eva prakashyante yathamati yathashrutam ||146|| shriradha premarupa ya pura vrindavaneshvari
    | sa shrigadadharo gauravallabhah panditakhyakah ||147|| nirnitah shrisvarupairyo vrajalakshmitaya
    yatha ||148|| pura vrindavane lakshmih shyamasundaravallabha | sadya gaurapremalakshmih shrigadadharapanditah
    ||149|| radhamanugata yattallalitapyanuradhika | atah pravishadesha tam gauracandrodaye yatha ||150||
    iyamapi lalitaiva radhikali na khalu gadadhara esha bhusurendrah | harirayamathava svayaiva shaktya
    tirtayamabhutsa sakhi ca radhika ca ||151||
  devanagari: नित्यानन्दावधूतो मह इति महितं हन्त सङ्कर्षणो यः इति च ॥६१॥ यदा श्रीविश्वरूपोऽयं तिरोभूतः
    सनातनः । नित्यानन्दावधूतेन मिलित्वापि तदा स्थितः ॥६२॥ ततोऽवधूतो भगवान्बलात्मा भवान्सदा वैष्णववर्गमध्ये
    । जज्वाल तिग्मांशुसहस्रतेजा इति ब्रुवन्मे जनको ननर्त ॥६३॥ स्वांशेन शेषेण य एष शय्या विष्णोश्च कृष्णस्य
    च वासभूषा । स्वाङ्गस्य भूषावलयादिरूपैर् लीलाख्यया वेदनिगूढलीलाम् ॥६४॥ श्रीवारुणीरेवतवंशसम्भवे तस्य
    प्रिये द्वे वसुधा च जाह्नवी । श्रीसूर्यदासस्य महात्मनः सुते ककुद्मीरूपस्य च सार्यतेजसः ॥६५॥ केचित्श्रीवसुधादेवीं
    कलावपि विवृण्वते । अनङ्गमञ्जरीं केचिज्जाह्नवीं च प्रचक्षते । उभयं तु समीचीनं पूर्वन्यायात्सतां मतम्
    ॥६६॥ सङ्कर्षणस्य यो व्यूहः पयोब्धिशायिनामकः । स एव वीरचन्द्रोऽभूच्चैतन्याभिन्नविग्रहः ॥६७॥ अमुं प्राविशतां
    कार्यात्सजहौ निषठोल्मुकौ । मीनकेतनरामादिर्व्यूहः सङ्कर्षणोऽपरः ॥६८॥ विष्णुपादोद्भवा गङ्गा यासीत्सा
    निज नामतः । नित्यानन्दात्मजा जाता माधवः शन्तनुर्नृपः ॥६९॥ व्यूहस्तृतीयः प्रद्युम्नः प्रियनर्मसखोऽभवत।
    चक्रे लीलासहायं यो राधामाधवयोर्व्रजे । श्रीचैतन्याद्वैततनुः स एव रघुनन्दनः ॥७०॥ व्यूहस्तूर्योऽनिरुद्धो
    यो स वक्रेश्वरपण्डितः । कृष्णावेशजनृत्येन प्रभोः सुखमजीजनत॥७१॥ सहस्रगायकान्मह्यं देहि त्वं करुणामय
    । इति चैतन्यपदे यः उवाच मधुरं वचः ॥७२॥ स्वप्रकाशाविभेदेन शशिरेखा तमाविशत। आविर्भावो गौरहरेर्नकुलब्रह्मचारिणि
    ॥७३॥ आवेशश्च तथा ज्ञेयो मिश्रे प्रद्युम्नसंज्ञके । आचार्यो भगवान्खञ्जः कला गौरस्य कथ्यते ॥७४॥ गोपीनाथाचार्यनाम्ना
    ब्रह्मा ज्ञेयो जगत्पतिः । नवव्यूहे तु गणितो यस्तन्त्रे तन्त्रवेदिभिः ॥७५॥ व्रजे आवेशरूपत्वाद्व्यूहो
    योऽपि सदाशिवः । स एवाद्वैतगोस्वामी चैतन्याभिन्नविग्रहः ॥७६॥ यश्च गोपालदेहः सन्व्रजे कृष्णस्य सन्निधौ
    । ननर्त श्रीशिवतन्त्रे भैरवस्य वचो यथा ॥७७॥ एकदा कार्त्तिके मासि दीपयात्रा महोत्सवे । सरामः सहगोपालः
    कृष्णो नृत्यति यत्नवान॥७८॥ निरीक्ष्य मद्गुरुर्देवो गोपभावाभिलाषवान। प्रियेण नर्तितुमारब्धश्चक्रभ्रमणलीलया
    ॥७९॥ श्रीकृष्णस्य प्रसादेन द्विविधोऽभूत्सदाशिवः । एकस्तत्र शिवः साक्षादन्यो गोपालविग्रहः ॥८०॥ महादेवस्य
    मित्रं यः कुवेरो गुह्यकेश्वरः । कुवेरपण्डितः सोऽद्य जनकोऽस्य विदाम्बरः ॥८१॥ पुरा कुवेरः कैलासे सिद्धसाध्यनिषेविते
    । जजाप परमं मन्त्रं शैवं श्रीशिववल्लभः ॥८२॥ ततो दयालुर्भगवान्वरं वृण्विति सोऽब्रवीत। तदा कुवेरो वरयामास
    त्वं मे सुतो भव ॥८३॥ प्रार्थितस्तेन देवेशो वरदेशो सदाशिवः । जन्मन्यन्तरे पुत्रः प्राप्स्यामि पुत्रतां
    तव ॥८४॥ इति प्राप्य वरं कष्टं कियन्तं कालमास्थितः । कार्यादीशवशात्सोऽद्याद्वैतस्य जनकोऽभवत॥८५॥ योगमाया
    भगवती गृहिणी तस्य साम्प्रतम् । सीतारूपेणावतीर्णा श्रीनाम्ना तत्प्रकाशतः ॥८६॥ तस्य पुत्रोऽच्युतानन्दः
    कृष्णचैतन्यवल्लभः । श्रीमत्पण्डितगोस्वामिशिष्यः प्रिय इति श्रुतम् ॥८७॥ यः कार्त्तिकेयः प्रागासीदिति
    जल्पन्ति केचन । केचिदाहू रसविदोऽच्युतनाम्नी तु गोपिका ॥ उभयं तु समीचीनं द्वयोरेकत्र सङ्गतात। कार्त्तिकेयः
    कृष्णमिश्रस्तत्साम्यादिति केचन ॥८८॥ नन्दिनी जङ्गली ज्ञेया जया च विजया क्रमात॥८९॥ श्रीवासपण्डितो धीमान्यः
    पुरा नारदो मुनिः । पर्वताख्यो मुनिवरो य आसीन्नारदप्रियः । स रामपण्डितः श्रीमान्स्तत्कनिष्ठसहोदरः ॥९०॥
    मुरारि गुप्तो हनुमानङ्गदः श्रीपुरन्दरः । यः श्रीसुग्रीवनामासीद्गोविन्दानन्द एव सः ॥९१॥ विभीषणो यः
    प्रागासीद्रामचन्द्रपुरी स्मृतः । उवाचातो गौरहरिर्नैतद्रामस्य कारणम् ॥ जटिला राधिकाश्वश्रूः कार्यतोऽविशदेव
    तम् । अतो महाप्रभुर्भिक्षासङ्कोचादि ततोऽकरोत॥९२॥ ऋचीकस्य मुनेः पुत्रो नाम्ना ब्रह्मा महातपाः । प्रह्लादेन
    समं जातो हरिदासाख्यकोऽपि सन॥९३॥ मुरारिगुप्तचरणैश्चैतन्यचरितामृते । उक्तो मुनिसुतः प्रातस्तुलसीपात्रमाहरन॥९४॥
    अधौतमभिषप्तस्तं पिता यावनतां गतः । स एव हरिदासः सन्जातः परम भक्तिमान॥९५॥ वृन्दावने यः प्रागासन्नणिमाद्यष्टसिद्धयः
    । त एवाष्टौ भक्तरूपा भूता गौडे च ते यथा ॥९६॥ अनतश्च सुखानन्दो गोविन्दो रघुनाथकः । कृष्णानन्दः केशवश्च
    श्रीदामोदरराघवौ । पुर्युपाधिक्रमाज्ज्ञेया अणिमाद्यष्टसिद्धयः ॥९७॥ जायन्तेयाः स्थिता ऊर्ध्वरेतसः समदर्शिनः
    । नवभागवताः पूर्वं श्रीभागवतसंहिताः ॥९८॥ प्रत्यूचुर्जनकं तेऽद्य भूत्वा सन्न्यासिनः सदा । प्रभुना गौरहरिणा
    विहरन्ति स्म ते यथा ॥९९॥ श्रीनृसिंहानन्दतीर्थः श्रीसत्यानन्दभारती । श्रीनृसिंहचिदानन्दजगन्नाथा हि
    तीर्थकाः ॥१००॥ तीर्थाभिधो वासुदेवः श्रीरामः पुरुषोत्तमः । गरुडाख्यावधूतश्च श्रीगोपेन्द्राख्य आश्रमः
    ॥१०१॥ लोके ये निधयः ख्याताः पद्मशङ्खादयो नव । अत्रैव निधिरत्नाख्यगर्भजाताः प्रभोः प्रियाः ॥१०२॥ श्रीश्रीनिधिश्च
    श्रीगर्भः कविरत्नः सुधानिधिः । विद्यानिधिर्गुणनिधी रत्नबाहुर्द्विजाग्रणीः । श्रीमानाचार्यरत्नश्च श्रीरत्नाकर
    पण्डितः ॥१०३॥ नीलाम्बरस्चक्रवर्ती गौरस्य भाविजन्म यत। सभायां कथायमास तेनासौ गर्ग उच्यते ॥१०४॥ श्रीशच्या
    जनकत्वेन सुमुखो बल्लवो मतः । पतलाया व्रजे ख्याता ज्ञेया तस्य सधर्मिणी ॥१०५॥ पुराणानामर्थवेत्ता श्रीदेवानन्दपण्डितः
    । पुरासीन्नन्दपरिषत्पण्डितो भागुरिर्मुनिः ॥१०६॥ काशीनाथो लोकनाथः श्रीनाथो रामनाथकः । चत्वारोऽमी ज्ञानीभक्ताः
    सनकाद्या न संशयः ॥१०७॥ चतुर्ष्वप्येषु शब्देषु नाथशब्दस्य कीर्तनात। चतुःसनवदेवात्र चतुर्नाथा उदीरितः
    ॥१०८॥ वेदव्यासो य एवासीद्दासो वृन्दावनोऽधुना । सखा यः कुसुमापीडः कार्यतस्तं समाविशत॥१०९॥ भट्टो वल्लभ
    नामाभूच्छुको द्वैपायनात्मजः ॥११०॥ आचार्यः श्रीजगन्नाथो गङ्गादासः प्रभुप्रियः । आसीन्निधुवने प्राग्यो
    दुर्वासा गोपिकाप्रियः ॥१११॥ चन्द्रशेखर आचार्यश्चन्द्रो ज्ञेयो विचक्षणैः । श्रीमानुद्धवदासोऽपि चन्द्रावेशावतारकः
    ॥११२॥ अतश्चैतन्य हरिणा कथितोऽयं निशापतिः । श्रीमद्विश्वेश्वराचार्यो यः प्रागासीद्दिवाकरः ॥११३॥ विश्वकर्मा
    पुरा योऽभूदद्य भास्करठक्कुरः । भिक्षको वनमाली यः सुदामासीद्द्विजो पुरा । धनं प्राप्य प्रभोः सङ्गे
    दुःखं मत्वाभ्रमद्यतः ॥११४॥ वैकुण्ठे द्वारपालौ यौ जयाद्यविजयान्तकौ । तावद्य जातौ स्वेच्छातः श्रीजगन्नाथमाधवौ
    ॥११५॥ पुण्डरीकाक्षकुमुदौ ख्यातौ वैकुण्ठमण्डले । गोविन्दगरुडाख्यौ तौ जातौ गौडे प्रभोः प्रियौ ॥११६॥
    गरुडः पण्डितः सोऽद्य गरुडो यः पुरा श्रुतः । पुरा योऽक्रूरनामासीत्स गोपीनाथसिंहकः । इति केचित्प्रभाषन्तेऽक्रूरः
    केशवभारती ॥११७॥ पुरी परमानन्दो य आसीदुद्धवः पुरा ॥ इन्द्रद्युम्नो महाराजो जगन्नाथार्चकः पुरा । जातः
    प्रतापरुद्रः सन्सम इन्द्रेण सोऽधुना ॥११८॥ भट्टाचार्यः सार्वभौमः पुरासीद्गीष्पतिर्दिवि ॥११९॥ प्रियनर्मसखा
    कश्चिदर्जुनः पाण्डवोऽर्जुनः । मिलित्वा समभूद्रामानन्दरायः प्रभोः प्रियः ॥१२०॥ अतो राधाकृष्णभक्तिप्रेमतत्त्वादिकं
    कृती । रामानन्दो गौरचन्द्रं प्रत्यवर्णयदन्वहम् ॥१२१॥ ललितेत्याहुरेके यत्तदेकेनानुमन्यन्ते । भवानन्दं
    प्रति प्राह गौरो यत्त्वं पृथापतिः ॥१२२॥ गोप्यार्जुनीयया सार्धमेकीभायापि पाण्डवः । अर्जुनो यद्रायरामानन्द
    इत्याहुरुत्तमाः ॥१२३॥ अर्जुनीयाभवत्तूर्णमर्जुनोऽपि च पाण्डवः । इति पाद्मोत्तरखण्डे व्यक्तमेव विराजते
    । तस्मादेतत्त्रयं रामानन्दरायमहाशयः ॥१२४॥ व्रजे भक्ताः समासेन कथ्यन्तेऽथ यथा मतिः ॥१२५॥ पुरा श्रीदामनामासीदभिरामोऽधुना
    महान। द्वात्रिंशता जनैरेव बाह्यं काष्ठमुवाह यः ॥१२६॥ पुरा सुदामनामासीदद्य सुन्दरठक्कुरः । वसुदामसखा
    यश्च पण्डितः श्रीधनञ्जयः ॥१२७॥ सुबलो यः प्रियश्रेष्ठः स गौरीदासपण्डितः । कमलाकरपिप्पलाइनाम्नासीद्यो
    महाबलः ॥१२८॥ सुबाहुर्यो व्रजे गोपो दत्त उद्धारणाख्यकः । महेशपण्डितः श्रीमन्महाबाहुर्व्रजे सखा ॥१२९॥
    स्तोककृष्णः सखा प्राग्यो दासः श्रीपुरुषोत्तमः ॥१३०॥ सदाशिवसुतो नाम्ना नागरः पुरुषोत्तमः । वैद्यवंशोद्भवो
    नाम्ना दामा यो बल्लवो व्रजे ॥१३१॥ नाम्नार्जुनः सखा प्राग्यो दासः स परमेश्वरः । कालः श्रीकृष्णदासः
    स यो लवङ्गः सखा व्रजे ॥१३२॥ खोलावेचतया ख्यातः पण्डितः श्रीधरो द्विजः । आसीद्व्रजे हास्यकारी यो नाम्ना
    कुसुमासवः ॥१३३॥ बलरामसखा कश्चित्प्रबलो गोपबालकः । आसीद्व्रजे पुरा योऽद्य स हलायुधठक्कुरः ॥१३४॥ वरूथपः
    सखा नाम्ना कृष्णचन्द्रस्य यो व्रजे । आसीत्स एव गौराङ्गवल्लभो रुद्रपण्डितः ॥१३५॥ गन्धर्वो यो व्रजे
    गोपः कुमुदानन्दपण्डितः ॥१३६॥ पुरा वृन्दावने चेटौ स्थितौ भृङ्गरभङ्गुरौ । श्रीकाशीश्वर गोविन्दौ तौ जातौ
    प्रभुसेवकौ ॥१३७॥ वृन्दावने स्थितौ प्राग्यौ भृत्यौ रक्तकपत्रकौ । गौराङ्गसेवकावद्य हरिदासबृहच्छिशू ॥१३८॥
    पयोदवारिदौ प्राग्यौ नीरसंस्कारकारिणौ । तावद्य भृत्यौ रामयिर्नन्दयिश्चेति विश्रुतौ ॥१३९॥ व्रजे स्थितौ
    गायकौ यौ मधुकण्ठमधुव्रतौ । मुकुन्दवासुदेवौ तौ दत्तौ गौराङ्गगायकौ ॥१४०॥ नटश्चन्द्रमुखः प्राग्यः स कारो
    मकरध्वजः ॥१४१॥ पुरासीद्यो व्रजे नाम्ना मृदङ्गी श्रीसुधाकरः । स श्रीशङ्करघोषोऽद्य दम्फवाद्यविशारदः
    ॥१४२॥ आसीद्व्रजे चन्द्रहासो नर्तको रसकोविदः । सोऽयं नृत्यविनोदी श्रीजगदीशाख्यपण्डितः ॥१४३॥ वेणुं च
    मुरलीं योऽधन्नाम्ना मालाधरो व्रजे । सोऽधुना वनमालाख्यः पण्डितो गौरवल्लभः ॥१४४॥ वृन्दावने यौ विख्यातौ
    शुकौ दक्षविचक्षणौ । तावद्य जातौ मज्ज्येष्ठौ चैतन्यरामदासकौ ॥१४५॥ अधुना बल्लवीवर्गा ये ये भूताः प्रभुप्रियाः
    । ते त एव प्रकाश्यन्ते यथामति यथाश्रुतम् ॥१४६॥ श्रीराधा प्रेमरूपा या पुरा वृन्दावनेश्वरी । सा श्रीगदाधरो
    गौरवल्लभः पण्डिताख्यकः ॥१४७॥ निर्णीतः श्रीस्वरूपैर्यो व्रजलक्ष्मीतया यथा ॥१४८॥ पुरा वृन्दावने लक्ष्मीः
    श्यामसुन्दरवल्लभा । साद्य गौरप्रेमलक्ष्मीः श्रीगदाधरपण्डितः ॥१४९॥ राधामनुगता यत्तल्ललिताप्यनुराधिका
    । अतः प्राविशदेषा तं गौरचन्द्रोदये यथा ॥१५०॥ इयमपि ललितैव राधिकाली न खलु गदाधर एष भूसुरेन्द्रः । हरिरयमथवा
    स्वयैव शक्त्या तिर्तयमभूत्सा सखी च राधिका च ॥१५१॥
