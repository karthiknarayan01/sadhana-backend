id: yajnavalkya
category: upanishad
name:
  english: yajnavalkya
  devanagari: यज्नवल्क्य
content:
  english: rinkhalaya nityamalamastu mama striya || 13|| yasya stri tasya bhogeccha nistrikasya kva bhogabhuh
    | striyam tyaktva jagattyaktam jagattyaktva sukhi bhavet || 14|| alabhyamanastanayah pitarau kleshayecciram
    | labdho hi garbhapatena prasavena ca badhate || 15|| jatasya graharogadi kumarasya ca dhurtata |
    upanite'pyavidyatvamanudvahashca pandite || 16|| yunashca paradaradi daridryam ca kutumbinah | putraduhkhasya
    nastyanto dhani cenmriyate tada || 17|| na panipadacapalo na netracapalo yatih | na ca vakcapalashcaiva
    brahmabhuto jitendriyah || 18|| ripau baddhe svadehe ca samaikatmyam prapashyatah | vivekinah kutah
    kopah svadehavayaveshviva || 19|| apakarini kopashcetkope kopah katham na te | dharmarthakamamokshanam
    prasahya paripanthini || 20|| namo'stu mama kopaya svashrayajvaline bhrisham | kopasya mama vairagyadayine
    doshabodhine || 21|| yatra supta jana nityam prabuddhastatra samyami | prabuddha yatra te vidvansushuptim
    yati yogirat || 22|| cidihastiti cinmatramidam cinmayameva ca | cittvam cidahamete ca lokashciditi
    bhavaya || 23|| yatinam tadupadeyam parahamsyam param padam | natah parataram kincidvidyate munipungavah
    || 24|| ityupanishat || om purnamadah purnamidam purnatpurnamudacyate | purnasya purnamadaya purnamevavashishyate
    || om shantih shantih shantih || harih om tatsat || iti yajnavalkyopanishatsamapta ||
  devanagari: ृङ्खलया नित्यमलमस्तु मम स्त्रिया ॥ १३॥ यस्य स्त्री तस्य भोगेच्छा निस्त्रीकस्य क्व भोगभूः
    । स्त्रियं त्यक्त्वा जगत्त्यक्तं जगत्त्यक्त्वा सुखी भवेत् ॥ १४॥ अलभ्यमानस्तनयः पितरौ क्लेशयेच्चिरम्
    । लब्धो हि गर्भपातेन प्रसवेन च बाधते ॥ १५॥ जातस्य ग्रहरोगादि कुमारस्य च धूर्तता । उपनीतेऽप्यविद्यत्वमनुद्वाहश्च
    पण्डिते ॥ १६॥ यूनश्च परदारादि दारिद्र्यं च कुटुम्बिनः । पुत्रदुःखस्य नास्त्यन्तो धनी चेन्म्रियते तदा
    ॥ १७॥ न पाणिपादचपलो न नेत्रचपलो यतिः । न च वाक्चपलश्चैव ब्रह्मभूतो जितेन्द्रियः ॥ १८॥ रिपौ बद्धे स्वदेहे
    च समैकात्म्यं प्रपश्यतः । विवेकिनः कुतः कोपः स्वदेहावयवेष्विव ॥ १९॥ अपकारिणि कोपश्चेत्कोपे कोपः कथं
    न ते । धर्मार्थकाममोक्षाणां प्रसह्य परिपन्थिनि ॥ २०॥ नमोऽस्तु मम कोपाय स्वाश्रयज्वालिने भृशम् । कोपस्य
    मम वैराग्यदायिने दोषबोधिने ॥ २१॥ यत्र सुप्ता जना नित्यं प्रबुद्धस्तत्र संयमी । प्रबुद्धा यत्र ते विद्वान्सुषुप्तिं
    याति योगिराट् ॥ २२॥ चिदिहास्तीति चिन्मात्रमिदं चिन्मयमेव च । चित्त्वं चिदहमेते च लोकाश्चिदिति भावय
    ॥ २३॥ यतीनां तदुपादेयं पारहंस्यं परं पदम् । नातः परतरं किञ्चिद्विद्यते मुनिपुङ्गवः ॥ २४॥ इत्युपनिषत्
    ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥ ॐ शान्तिः शान्तिः
    शान्तिः ॥ हरिः ॐ तत्सत् ॥ इति याज्ञवल्क्योपनिषत्समाप्ता ॥
