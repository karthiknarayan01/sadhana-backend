id: devaihkritam22shivastotram
category: stotram
name:
  english: devaihkritam22shivastotram
  devanagari: देवैःकृतं२२शिवस्तोत्रम्
content:
  english: 48|| iti shriskandapurane nagarakhande prathamadhyayantargatam devaih kritam shivastotram samaptam
    | skandapurana | nagarakhanda | adhyaya 1
  devanagari: ४८॥ इति श्रीस्कन्दपुराणे नागरखण्डे प्रथमाध्यायान्तर्गतं देवैः कृतं शिवस्तोत्रं समाप्तम्
    । स्कन्दपुराण । नागरखण्ड । अध्याय १
