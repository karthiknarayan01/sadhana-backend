id: kyts-jata-5-6-hirnyavarnaah-suchayah-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 5.6 Hirnyavarnaah Suchayah - Krishna Yajurveda Taittiriya Samhita
content:
  english: shshucayo hiranyavarna hiranyavarna hiranyavarna iti hiranya shucayah pavakah pavaka pavaka
    yasu yasu pavakah pavaka yasu | yasu jato jato yasu yasu jatah | jatah kashyapah kashyapo jato jatah
    kashyapah | kashyapo yasu yasu kashyapah kashyapo yasu | yasvindra indro yasu yasvindrah | indra itindrah
    | ya~ ya agni magnim ndadhire dadhire garbha dadhire virupa virupa dadhire dadhire virupah | virupa
    sta sta virupa virupa stah | ta no na sta sta nah | na apa apo no na apah | syona bhavantu bhavantu
    syona bhavantviti bhavantu | yasagm raja raja yasam raja varuno varuno raja raja varunah | varuno
    yati yati varuno varuno yati | yati maddhye maddhye yati yati maddhye maddhye satyanrite satyanrite
    maddhye maddhye satyanrite | satyanrite avapashya thsatyanrite satyanrite avapashyann | satyanrite
    iti satya nnavapashyan jananam | jananamiti jananam | shshucayo madhushcuto madhushcuta madhushcuta
    iti madhu yah pavakah pavaka ya yah pavakah | pavaka sta stah pavakah pavaka stah | ta no na sta sta
    nah | na apa apo no na apah | syona bhavantu bhavantu syona bhavantviti bhavantu | ndeva deva yasam
    deva divi divi deva deva divi | divi krinvanti krinvanti divi divi krinvanti | nkrinvanti krinvanti
    bhaksham | ya antarikshe antarikshe ya ya antarikshe | antarikshe bahudha bahudha 'ntarikshe antarikshe
    bahudha | bahudha bhavanti bhavanti bahudha bahudha bhavanti | bhavantviti bhavanti | ya~ yah prithivim
    | mpayasa payasa prithivi ntyundanti payasa payasondanti | ntyundanti shukrah | || ta no na sta sta
    nah | na apa apo no na apah | syona bhavantu bhavantu syona bhavantviti bhavantu | shivena ma ma shivena
    shivena ma | ma cakshusha cakshusha ma ma cakshusha | cakshusha pashyata pashyata cakshusha cakshusha
    pashyata | pashya tapa apah pashyata pashya tapah | shshivaya shivaya ''pa apa shivaya tanuva tanuva
    shivaya shivaya tanuva tanuvopopa tanuva tanuvopa | upa sprishata sprishato popa sprishata | ntvacagg
    sprishata sprishata tvaca sarvagm agnigm ragni nthsarvagm agnin | agnigm raphsushado aphsushado agnigm
    ragnigm raphsushadah | aphsushado huve huve aphsushado aphsushado huve | aphsushada ityaphsu huve
    vo vo huve huve vah | vo mayi mayi vo vo mayi | mayi varco varco mayi mayi varcah | ojo ni nyoja ojo
    ni | ni dhatta dhatta ni ni dhatta | ssamprayati rado 'da samprayati raha vahau samprayati samprayatiriti
    sam aha vanadata nadataha vaha vanadata | anadata hate hate 'nadata nadata hate | a nadyo nadya a
    nadyah | nadyo nama nama nadyo nadyo nama | nama stha stha nama nama stha | stha ta ta stha stha ta
    | ta vo va sta ta vah | vo namani namani vo vo namani | ssindhavo namani namani sindhavah | sindhava
    iti sindhavah | tpreshitah preshita ya preshita varunena varunena preshitah preshita varunena | varunena
    ta sta varunena varunena tah | shibhagm samavalgata samavalgata shibhagm shibhagm samavalgata | apno
    dindra indra apno dapno dindrah | indro vo va indra indro vah | tasma dapa apa stasma apo anvan vapa
    apo anu | anu sthana sthanan vanu sthana | ssyandamana apakama mapakamagg syandamana avivarata vivarata
    syandamana ssyandamana avivarata | avivarata vo vo 'vivarata vivarata vah | indro vo va indra indro
    vah | shaktibhiriti shakti nama vo vo nama nama vah | eko devo deva eka eko devah | devo apyapi devo
    devo api | apya tishtha datishtha dapya pyatishthat | ssyandamana atishtha datishtha ssyandamana yathavasham
    | udanishu ranishu rudu danishuh | rmahi ranishu ranishu ttasmadi titi tasma udaka mucyata ucyata
    udaka mudaka mucyate | ucyata ityucyate | apo bhadra bhadra apa apo bhadrah | mbhadra bhadra ghritam
    | idapa apa idi dapah | apa asu rasu rapa apa asuh | asu ragnishoma vagnishoma vasu rasura gnishomau
    agnishomau bibhrati bibhra tyagnishoma vagnishomau bibhrati | agnishomavityagni bibhra tyapa apo bibhrati
    bibhra tyapah | apa ididapa apa it | tivro raso rasa stivra stivro rasah | mmadhupricagm raso raso
    madhuprica madhuprica marangamo arangamo madhuprica mmadhuprica marangamah | arangama a 'rangamo arangama
    a | ma pranena pranena ma ma pranena | pranena saha saha pranena pranena saha | saha varcasa varcasa
    saha saha varcasa | varcasa varcasa gann | tpashyami pashyamidi pashya myutota pashyami pashya myuta
    | va shrinomi shrinomi va va shrinomi | shrinomya shrinomi shrinomya | ma ghosho ghosho ma ma ghoshah
    | ghosho gacchati gacchati ghosho ghosho gacchati | gacchati vag vag gacchati gacchati vak | manye
    bhejano bhejano manye manye bhejanah | bhejano amritasya mritasya bhejano bhejano amritasya | hyamritasya
    mritasya tar hi hiranyavarna hiranyavarna star hiranyavarna atripa matripagm hiranyavarna hiranyavarna
    atripam | hiranyavarna iti hiranya ya~da yada 'tripa matripam yada vo vo yada yada vah | apo hi hyapa
    apo hi | hi shtha stha hi hi shtha | stha mayobhuvo mayobhuva sstha stha mayobhuvah | mayobhuva sta
    sta mayobhuvo mayobhuva stah | ta no na sta sta nah | na urja urje no na urje | urje dadhatana dadhatanorja
    urje dadhatana | dadhataneti dadhatana | mahe ranaya ranaya mahe mahe ranaya | ranaya cakshase cakshase
    ranaya ranaya cakshase | cakshasa iti cakshase | yo vo vo yo yo vah | shivatamo raso rasah shivatama
    rasa stasya tasya raso rasa stasya | tasya bhajayata bhajayata tasya tasya bhajayata | bhajaya teheha
    bhajayata bhajayateha | iha no na ihe ha nah | ushati rive voshati rushati riva | iva mataro matara
    iveva matarah | matara iti matarah | ngamama gamama ra mara gamama vo vo gamama gamama vah | vo yasya
    yasya vo vo yasya | yasya kshayaya kshayaya yasya yasya kshayaya | kshayaya jinvatha jinvatha kshayaya
    kshayaya jinvatha | jinvatheti jinvatha | apo janayatha janayathapa apo janayatha | janayatha ca ca
    janayatha janayatha ca | ca no nashca ca nah | divi shrayasva shrayasva divi divi shrayasva | shrayasva
    ntarikshe antarikshe shrayasva shrayasva ntarikshe | antarikshe yatasva yatasva ntarikshe antarikshe
    yatasva | yatasva prithivya prithivya yatasva yatasva prithivya | mprithivya prithivya sam | bhava
    brahmavarcasa mbhava bhava brahmavarcasam | brahmavarcasa masyasi brahmavarcasa mbrahmavarcasa masi
    | brahmavarcasamiti brahma asi brahmavarcasaya brahmavarcasaya syasi brahmavarcasaya | brahmavarcasaya
    tva tva brahmavarcasaya brahmavarcasaya tva | brahmavarcasayeti brahma ngrihnati grihnati graha grihna
    tyeta deta dgrihnati grihna tyetat | vava rajasuyagm rajasuyam drajasuyagm rajasuyam ete graha graha
    eta ete grahah rvarunasavo varunasavo varunasavo rajasuyagm rajasuyam va~runasavo varunasavo rajasuya
    varunasava iti varuna 'gnisavo rajasuyagm rajasuya magnisavah | agnisava shcitya shcityo 'gnisava
    shcityah | agnisava ityagni ncitya shcitya stabhya tabhya mevaiva tabhya eva suyate suyata evaiva
    suyate | suyate 'tho atho suyate suyate 'tho atho ubha vubha vatho atho ubhau | ubha vevai vobha vubha
    veva | eva lokau loka vevaiva lokau | loka vabhyabhi lokau loka vabhi | abhi jayati jaya tyabhyabhi
    jayati | jayati yo yo jayati jayati yah | ca rajasuyena rajasuyena ca ca rajasuyena | rajasuye nejana
    syejanasya rajasuyena rajasuye nejanasya | ijanasya yo ya ijanasye janasya yah | 'gnicitashca cagnicitah
    | agnicita ityagni ntyapa apo bhavanti | ntyapa apo bhavanti bhava apo vai va apa apo vai | rbhratrivya
    bhratrivya agne ragne dbhratrivya bhratrivya yat | agne radhasta dadhasta dagne ragne radhasta tyadhasta
    dadhasta dupadadhati | upadadhati bhratrivyabhibhutyai bhratrivyabhibhutya upadadha tyupadadhati bhratrivyabhibhutyai
    | bhratrivyabhibhutyai bhavati bhavati bhratrivyabhibhutyai bhratrivyabhibhutyai bhavati | bhratrivyabhibhutya
    iti bhratrivya bhava tyatmana ''tmana bhavati bhava tyatmana atmana para para ''tmana ''tmana para
    asya bhratrivyo bhratrivyo 'syasya bhratrivyah | bhratrivyo bhavati bhavati bhratrivyo bhratrivyo
    bhavati | bhava tyamrita mamrita vai~ va amrita mamritam va apa apo vai va apah | ttasma dapa apa
    stasma tasma dadbhi radbhi stasma adbhi ravatanta mavatanta madbhi radbhi ravatantam | avatanta mabhyabhya
    vatanta mavatanta mabhi | abhi shincanti sinca ntyabhyabhi shincanti | sincanti na na sincanti sincanti
    na | arti ma ''rti marti ma | arccha tyriccha tyarcchati | ricchati sarvagm sarva mriccha tyricchati
    sarva ssarvagm sarva mayuh | ayu retye tyayu rayu reti | yasyaita eta yasya yasyaitah | eta upadhiyanta
    upadhiyanta eta eta upadhiyante upadhiyante yo ya upadhiyanta upadhiyante yah | upadhiyanta ityupa
    caina enashca cainah | ena eva meva mena ena evam | va apa apo vai va apah | apah pashavah pashava
    apa apah pashavah | pashava apa apah pashavah pashava apah | apo 'nna manna mapa apo 'nna mpashavah
    pashavo 'nna manna 'nnadah pashavah pashavo 'nnadah pashuman | bhavati yasya yasya bhavati bhavati
    yasya | yasyaita eta yasya yasyaitah | eta upadhiyanta upadhiyanta eta eta upadhiyante upadhiyante
    yo ya upadhiyanta upadhiyante yah | upadhiyanta ityupa caina enashca cainah | ena eva meva mena ena
    evam | veda dvadasha dvadasha veda veda dvadasha | dvadasha bhavanti bhavanti dvadasha dvadasha bhavanti
    | bhavanti dvadasha dvadasha bhavanti bhavanti dvadasha | dvadasha masa masa dvadasha dvadasha masah
    va~thsare naivaiva sam evasma asma evai vasmai asma anna manna masma asma anna anna mava vanna manna
    mava | ava rundhe rundhe 'vava rundhe | rundhe patrani patrani rundhe rundhe patrani | patrani bhavanti
    bhavanti patrani patrani bhavanti | bhavanti patre patre bhavanti bhavanti patre patre vai vai patre
    patre vai | anna madyate 'dyate 'nna manna madyate | adyate sayoni sayo nyadyate 'dyate sayoni | nyevaiva
    sayoni sayo evanna manna mevai vanna anna mava vanna manna mava | ava rundhe rundhe 'vava rundhe |
    rundha a rundhe rundha a | ddvadashada dvadashat | purusha danna manna anna mattya ttyanna manna matti
    | attyatho atho attya ttyatho tpatra datho atho patra na chidyate chidyate na na chidyate | chidyate
    yasya yasya chidyate chidyate yasya | yasyaita eta yasya yasyaitah | eta upadhiyanta upadhiyanta eta
    eta upadhiyante upadhiyante yo ya upadhiyanta upadhiyante yah | upadhiyanta ityupa caina enashca cainah
    | ena eva meva mena ena evam | veda kumbhah kumbha veda veda kumbhah | kumbhashca ca kumbhah kumbhashca
    | ca kumbhih kumbhishca ca kumbhih | kumbhishca ca kumbhih kumbhishca | ca mithunani mithunani ca
    ca mithunani | mithunani bhavanti bhavanti mithunani mithunani bhavanti | bhavanti mithunasya mithunasya
    bhavanti bhavanti mithunasya | tyai mithunasya mithunasya praja prajaya pra pra prajaya prajaya pashubhih
    pashubhih prajaya rmithunaih pashubhih pashubhi rjayate jayate mithunai jayate yasya yasya jayate
    jayate yasya | yasyaita eta yasya yasyaitah | eta upadhiyanta upadhiyanta eta eta upadhiyante upadhiyante
    yo ya upadhiyanta upadhiyante yah | upadhiyanta ityupa caina enashca cainah | ena eva meva mena ena
    evam | veda shuk chug veda veda shuk | shug vai vai shuk chug vai | 'ddhvaryu maddhvaryugm sa so ya~jamana
    maddhvaryu maddhvaryum mprajah praja yajamanam shshuca shuca prajah praja shuca 'rpaya tyarpayati
    shuca shuca 'rpayati | dyadarpaya tyarpayati yat | tyapo 'pa upadadhati | upadadhati shucagm shuca
    mupadadha shuca mevaiva shucagm shuca meva | asya shamayati shamayatya syasya shamayati | shamayati
    na na shamayati shamayati na | arti ma ''rti marti ma | arccha tyriccha tyarcchati | riccha tyaddhvaryu
    raddhvaryur riccha tyriccha tyaddhvaryuh | rna naddhvaryu raddhvaryu na yajamano yajamano na na yajamanah
    | shshamyanti shamyanti yajamano yajamana shamyanti prajah praja shshamyanti shamyanti prajah | praja
    yatra yatra prajah praja yatra | yatraita eta yatra yatraitah | eta upadhiyanta upadhiyanta eta eta
    upadhiyante upadhiyante 'pa mapa mupadhiyanta upadhiyante 'pam | upadhiyanta ityupa va eta nyetani
    vai va etani | etani hridayani hridaya nyeta nyetani hridayani | dyaddhridayani hridayani yat | eta
    apa apa eta eta apah | eta apo 'pa eta eta apah | tyapo 'pa upadadhati | upadadhati divyabhi rdivyabhi
    rupadadha tyupadadhati divyabhih | divyabhi revaiva divyabhi evaina ena evai vainah sagm srijati srijati
    sagm sagm srijati | shukah parjanyah parjanyo var parjanyo bhavati bhavati parjanyah parjanyo bhavati
    | || bhavati yo yo bhavati bhavati yah | va etasa metasam etasa mayatana mayatana metasa metasa mayatanam
    | nklripti mayatana mayatana ve~da veda klripti veda yatanava nayatanavan veda veda yatanavan | nbhavati
    bhava tyayatanava nayatanava ayatanavanityayatana bhavati kalpate kalpate bhavati bhavati kalpate
    | kalpate 'sma asmai kalpate kalpate 'smai | asma anusita manusita masma asma anusitam | anusita mupopa
    nusita manusita mupa | upa dadhati dadha tyupopa dadhati | ddadhati dadha tyetat | asa mayatana mayatana
    masa masa mayatanam | ayatana meshaisha ''yatana mayatana mesha | esha klriptih klripti reshaisha
    klriptih | ryo yah klriptih klripti vedayatanava nayatanavan veda vedayatanavan | nbhavati bhava tyayatanava
    nayatanava ayatanavanityayatana bhavati kalpate kalpate bhavati bhavati kalpate | kalpate 'sma asmai
    kalpate kalpate 'smai | ndvandva masma asmai dvandvam | dvandva manya anya dvandva ndvandva manyah
    | anya upopa nya anya upa | upa dadhati dadha tyupopa dadhati | dadhati catasra shcatasro dadhati
    dadhati catasrah | catasro maddhye maddhye catasra shcatasro maddhye maddhye dhrityai dhrityai maddhye
    maddhye dhrityai ndhrityai dhritya anna va ishtaka ishtaka vai va ishtakah | ishtaka etade tadishtaka
    ishtaka etat | khalu vai vai khalu khalu vai | saksha danna mannagm saksha esha caru shcaru resha
    esha caruh | ncaru mupadadhati | tyupadadhati sakshat | saksha devaiva saksha evasma asma evai vasmai
    asma anna manna masma asma anna anna mava vanna manna mava | ava rundhe rundhe 'vava rundhe | rundhe
    maddhyato maddhyato rundhe rundhe maddhyatah | maddhyata upopa maddhyato maddhyata upa | upa dadhati
    dadha tyupopa dadhati | dadhati maddhyato maddhyato dadhati dadhati maddhyatah | maddhyata evaiva
    maddhyato maddhyata eva | evasma asma evai vasmai asma anna manna masma asma anna ndadhati dadha tyanna
    manna ddadhati dadhati tasma nmaddhyato maddhya tastasma maddhyato 'nna manna mmaddhyato maddhyato
    'nna anna madyate 'dyate 'nna manna madyate | adyate barhaspatyo bar barhaspatyo bhavati bhavati bar
    bhavati brahma brahma bhavati bhavati brahma | brahma vai vai brahma brahma vai | rbrahmana brahmana
    brihaspati brahmanai vaiva brahmana brahmanaiva | evasma asma evai vasmai asma anna manna masma asma
    anna anna mava vanna manna mava | ava rundhe rundhe 'vava rundhe | rundhe brahmavarcasa mbrahmavarcasagm
    rundhe rundhe brahmavarcasam | brahmavarcasa masyasi brahmavarcasa mbrahmavarcasa masi | brahmavarcasamiti
    brahma asi brahmavarcasaya brahmavarcasaya syasi brahmavarcasaya | brahmavarcasaya tva tva brahmavarcasaya
    brahmavarcasaya tva | brahmavarcasayeti brahma tvetiti tva tveti | ityahahe tityaha | aha tejasvi
    teja svyahaha tejasvi | tejasvi brahmavarcasi brahmavarcasi tejasvi tejasvi brahmavarcasi | brahmavarcasi
    bhavati bhavati brahmavarcasi brahmavarcasi bhavati | brahmavarcasiti brahma bhavati yasya yasya bhavati
    bhavati yasya | yasyaisha esha yasya yasyaishah | esha upadhiyata upadhiyata esha esha upadhiyate
    upadhiyate yo ya upadhiyata upadhiyate yah | ena meva meva mena mena mevam | bhuteshtaka upopa bhuteshtaka
    bhuteshtaka upa | bhuteshtaka iti bhuta upa dadhati dadha tyupopa dadhati | dadha tyatratra tra tra
    dadhati dadha tyatra tra vai va atratra tra rjayate jayate mrityu jayate yatrayatra yatrayatra jayate
    jayate yatrayatra | yatrayatrai vaiva yatrayatra yatrayatraiva | yatrayatreti yatra rmrityu revaiva
    mrityuh | rjayate jayate mrityu jayate tata stato jayate jayate tatah | tata evaiva tata stata eva
    | evaina mena mevai vaina ena mava vaina mena mava | ava yajate yajate 'vava yajate | tasma dagnici
    dagnici ttasma dagnicit | thsarvagm sarva magnici dagnici ssarvagm sarva mayuh | ayu retye tyayu rayu
    reti | eti sarve sarva etyeti sarve sarve hi hi sarve sarve hi | hyasyasya hi hyasya | asya mrityavo
    mrityavo 'syasya mrityavah | shta mrityavo mrityavo 've tasma dagnici dagnici ttasma dagnicit | nna
    nagnici dagnici nabhicaritava abhicaritavai na nabhicaritavai | abhicaritavai pratya kpratyaga bhicaritava
    abhicaritavai pratyak | abhicaritava ityabhi ena mabhicaro 'bhicara ena mena mabhicarah | sstrinute
    strinute 'bhicaro 'bhicara strinute suyate suyate strinute strinute suyate suyate vai vai suyate suyate
    vai | va esha esha vai va eshah | esha yo ya esha esha yah | ncinute cinute devasuvam | devasuva meta
    nyetani devasuva ndevasuva metani | etani havigmshi havi gg shyeta nyetani havigmshi | havigmshi bhavanti
    bhavanti havigmshi havigmshi bhavanti | ntyetavanta etavanto bhavanti bhava etavanto vai va etavanta
    etavanto vai | ndevanagm savah | evasma asma evai vasmai nthsava nasma asmai savan | pra yacchanti
    yacchanti pra pra yacchanti | yacchanti te te yacchanti yacchanti te | enagm suvante suvanta ena menagm
    suvante | ssuvante suvante savah | rvarunasavo varunasavo varunasavo rajasuyagm rajasuyam va~runasavo
    varunasavo rajasuya varunasava iti varuna mbrahmasavo brahmasavo rajasuyagm rajasuya brahmasava shcitya
    shcityo brahmasavo brahmasava shcityah | brahmasava iti brahma cityo devasya devasya citya shcityo
    devasya | devasya tva tva devasya devasya tva | savituh prasave prasave savitu ssavituh prasave |
    prasava ititi prasave prasava iti | ityahahe tityaha | ssavitriprasuta ahaha savitriprasutah | savitriprasuta
    evaiva savitriprasuta ssavitriprasuta eva | savitriprasuta iti savitri evaina mena mevai vaina mbrahmana
    brahmanaina mena rbrahmana brahmana devatabhih | devatabhi rabhyabhi devatabhi abhi shincati sinca
    tyabhyabhi shincati | sinca tyannasyannasya nnasyannasya sincati sinca tyannasyannasya | annasyannasya
    bhyabhyannasyannasya nnasyannasyabhi | annasyannasyetyannasya abhi shincati sinca tyabhyabhi shincati
    | sinca tyannasyannasya nnasyannasya sincati sinca tyannasyannasya | annasyannasya varuddhya avaruddhya
    annasyannasya nnasyannasya varuddhyai | annasyannasyetyannasya avaruddhyai purasta tpurasta davaruddhya
    avaruddhyai purasta pratyanca mabhyabhi pratyanca mpratyanca mabhi | abhi shincati sinca tyabhyabhi
    shincati | thsincati sincati purasta purasta ddhi hi purasta mpraticinagm hi hi praticina praticina
    manna manna anna madyate 'dyate 'nna manna madyate 'dyate 'dyate shir abhi shincati sinca tyabhyabhi
    shincati | sincati shirshata ssincati sincati shir shirshato hi hi shir hyanna mannagm hi hyanna anna
    madyate 'dyate 'nna manna madyate adyata a 'dyate 'dyata a | mukha danvavasravaya tyanvavasravayati
    mukha nmukha danvavasravayati | anvavasravayati mukhato mukhato 'nvavasravaya tyanvavasravayati mukhatah
    | anvavasravayatityanu mukhata evaiva mukhato mukhata eva | evasma asma evaiva smai asma annadya mannadya
    masma asma annadya ndadhati dadha tyannadya mannadya dadha tyagne ragne rdadhati dadha tyagneh | tva
    'gne ragne stva jyena tva tva samra jyena bhyabhi samra abhi shincami sinca myabhyabhi shincami |
    sincamititi sincami sincamiti | ityahahe tityaha | ahaisha esha aha haishah | esha vai va esha esha
