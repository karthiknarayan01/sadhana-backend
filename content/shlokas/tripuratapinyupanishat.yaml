id: tripuratapinyupanishat
category: upanishad
name:
  english: tripuratapinyupanishat
  devanagari: त्रिपुरातापिन्युपनिषत्
content:
  english: sastanubhih || vyashema devahitam yadayuh || svasti na indro vriddhashravah || svasti nah pusha
    vishvavedah || svasti nastarkshyo arishtanemih || svasti no brihaspatirdadhatu || om shantih shantih
    shantih || harih om || athaitasminnantare bhagavanprajapatyam vaishnavam vilayakaranam rupamashritya
    tripurabhidha bhagavatityevamadishaktya bhurbhuvah svastrini svargabhupatalani tripurani haramayatmakena
    hinkarena hrillekhakhya bhagavati trikutavasane nilaye vilaye dhamni mahasa ghorena prapnoti | saiveyam
    bhagavati tripureti vyapathyate | tatsaviturvarenyam bhargo devasya dhimahi | dhiyo yo nah pracodayat
    paro rajase savadom | jatavedase sunavama somamaratiyato nidahati veda | sa nah parshadati durgani
    vishva naveva sindhum duritatyagnih | tryambakam yajamahe sugandhim pushtivardhanam | urvarukamiva
    bandhananmrityormukshiya mamritat | shatakshari parama vidya trayimayi sashtarna tripura parameshvari
    | adyani catvari padani parabrahmavikasini | dvitiyani shaktyakhyani | tritiyani shaivani | tatra
    loka vedah shastrani puranani dharmani vai cikitsitani jyotimshi shivashaktiyogadityevam ghatana vyapathyate
    | athaitasya param gahvaram vyakhyasyamo mahamanusamudbhavam taditi | brahma shashvatam | paro bhagavannirlakshano
    niranjano nirupadhiradhirahito devah | unmilate pashyati vikasate caitanyabhavam kamayata iti | sa
    eko devah shivarupi drishyatvena vikasate yatishu yajneshu yogishu kamayate | kamam jayate sa esha
    niranjano'kamatvenojjrimbhate | akacatatapayashansrijate | tasmadishvarah kamo'bhidhiyate | tatparibhashaya
    kamah kakaram vyapnoti | kama evedam tattaditi kakaro grihyate | bhasmattatpadartha iti ya evam veda
    | saviturvarenyamiti shun praniprasave savita praninah sute prasute shaktim | sute tripura shaktiradyeyam
    tripura parameshvari mahakundalini devi | jatavedasamandalam yo'dhite sarvam vyapyate | trikonashaktirekarena
    mahabhagena prasute | tasmadekara eva grihyate | varenyam shreshtham bhajaniyamaksharam namaskaryam
    | tasmadvarenyamekaraksharam grihyata iti ya evam veda | bhargo devasya dhimahityevam vyakhyasyamah
    | dhakaro dharana | dhiyaiva dharyate bhagavanparameshvarah | bhargo devo madhyavarti turiyamaksharam
    sakshatturiyam sarvam sarvantarbhutam | turiyaksharamikaram padanam madhyavartityevam vyakhyatam bhargorupam
    vyacakshate | tasmadbhargo devasya dhimahityevamikaraksharam grihyate | mahityasya vyakhyanam mahattvam
    jadatvam kathinyam vidyate yasminnakshateretanmahi lakarah param dhama | kathinyadhyam sasagaram saparvatam
    sa saptadvipam sakananamujjvaladrupam mandalamevoktam lakarena | prithvi devi mahityanena vyacakshate
    | dhiyo yo nah pracodayat | paramatma sadashiva adibhutah parah | sthanubhutena lakarena jyotirlingamatmanam
    dhiyo buddhayah pare vastuni dhyaneccharahitam nirvikalpake pracodayatprerayedityuccaranarahitam cetasaiva
    cintayitva bhavayediti | paro rajase savadomiti tadavasane param jyotiramalam hridi daivatam caitanyam
    cillingam hridayagaravasini hrillekhetyadina spashtam vagbhavakutam pancaksharam pancabhutajanakam
    pancakalamayam vyapathyata iti | ya evam veda | atha tu param kamakalabhutam kamakutamahuh | tatsaviturvarenyamityadidvatrimshadaksharim
    pathitva taditi paramatma sadashivo'kasharam vimalam nirupadhitadatnyapratipadanena hakaraksharam
    shivarupam niraksharamaksharam vyalikhyata iti | tatparagavyavrittimadaya shaktim darshayati | tatsavituriti
    purvenadhvana suryadhashcandrikam vyalikhya muladibrahmarandhragam saksharamadvitiyamacakshata ityaha
    bhagavantam devam shivashaktyatmakamevoditam | shivo'yam paramam devam shaktiresha tu jivajja | suryacandramasoryogaddhamsastatatpadamucyate
    || 1|| tasmadujjrimbhate kamah kamatkamah parah shivah | karno'yam kamadevo'yam varenyam bharga ucyate
    || 2|| tatsaviturvarenyam bhargo devah kshiram secaniyamaksharam samadhughnamaksharam paramatmajivatmanoryogattaditi
    spashtamaksharam tritiyam ha iti tadeva sadashiva eva nishkalmasha adyo devo'ntyamaksharam vyakriyate
    | paramam padam dhiti dharanam vidyate jadatvadharanam mahiti lakarah shivadhastattu lakararthah spashtamantyamaksharam
    paramam caitanyam dhiyo yo nah pracodayatparo rajase savadomityevam kutam kamakalalayam shadadhvaparivartako
    vaishnavam paramam dhamaiti bhagavamshcaitasmadya evam veda | athaitasmadaparam tritiyam shaktikutam
    pratipadyate | dvatrimshadaksharya gayatrya tatsaviturvarenyam tasmadatmana akasha akashadvayuh sphurati
    tadadhinam varenyam samudiyamanam saviturva yogyo jivatmaparamatmasamudbhavastam prakashashaktirupam
    jivaksharam spashtamapadyate | bhargo devasya dhityanenadhararupashivatmaksharam ganyate | mahityadinashesham
    kamyam ramaniyam drishyam shaktikutam spashtikritamiti | evam pancadashaksharam traipuram yo'dhite
    sa sarvankamanavapnoti | sa sarvamllokanjayati | sa sarva vaco vijrimbhayati | sa rudratvam prapnoti
    | sa vaishnavam dhama bhittva param brahma prapnoti | ya evam veda | ityadyam vidyamabhidhayaitasyah
    shaktikutam shaktishivadyam lopamudreyam | dvitiye dhamani purvenaiva manuna binduhina shaktibhutahrillekha
    krodhamuninadhishthita | tritiye dhamani purvasya eva vidyaya yadvagbhavakutam tenaiva manavim candrim
    kauberim vidyamacakshate | madanadhah shivam vagbhavam | tadurdhvam kamakalamayam | shaktyurdhvam
    shaktimiti manavi vidya | caturthe dhamani shivashaktyakhyamanyattritiyam ceyam candri vidya | pancame
    dhamani dhyeyeyam candri kamadhah shivadyakama | saiva kauberi shashthe dhamani vyacakshata iti |
    ya evam veda | hitvekaram turiyasvaram sarvadau suryacandramaskena kameshvaryevagastyasamjna | saptame
    dhamani tritiyametasya eva purvoktayah kamadyam dvidhadhah kam madanakaladyam shaktibijam vagbhavadyam
    tayorardhavashiraskam kritva nandividyeyam | ashtame dhamani vagbhavamagastyam vagarthakalamayam kamakalabhidham
    sakalamayashaktih prabhakari vidyeyam | navame dhamani punaragastyam vagbhavam shaktimanmathashivashaktimanmathorvimayakamakalalayam
    candrasuryanangadhurjatimahimalayam tritiyam shanmukhiyam vidya | dashame dhamani vidyaprakashitaya
    bhuya evagastyavidyam pathitva bhuya evemamantyamayam paramashivavidyeyamekadashe dhamani bhuya evagastyam
    pathitva etasya eva vagbhavam yaddhanajam kamakalalayam ca tatsahajam kritva lopamudrayah shaktikutarajam
    pathitva vaishnavi vidya dvadashe dhamani vyacakshata iti | ya evam veda | tanhovaca | bhagavansarve
    yuyam shrutva purvam kamakhyam turiyarupam turiyatitam sarvotkatam sarvamantrasanagatam pithopapithadevataparivritam
    sakalakalavyapinim devatam samodam saparagam sahridayam samritam sakalam sendriyam sadoditam param
    vidyam spashtikritva hridaye nidhaya vijnayanilayam gamayitva trikutam tripuram paramam mayam shreshtham
    param vaishnavim samnidhaya hridayakamalakarnikayam param bhagavatim lakshmim mayam sadoditam mahavashyakarim
    madanonmadanakarinim dhanurbanadharinim vagvijrimbhinim candramandalamadhyavartinim candrakalam saptadashim
    mahanityopasthitam pashankushamanojna panipallavam samudyadarkanibham trinetram vicintya devim mahalakshmim
    sarvalakshmimayim sarvalakshanasampannam hridaye caitanyarupinim niranjanam trikutakhyam smitamukhim
    sundarim mahamayam sarvasubhagam mahakundalinim tripithamadhyavartinimakathadishripithe param bhairavim
    citkalam mahatripuram devim dhyayenmahadhyana yogeneyamevam vedeti mahopanishat || iti prathamopanishat
    || 1|| athato jatavedase sunavama somamityadi pathitva traipuri vyaktirlakshyate | jatavedasa ityekarcasuktasyadyamadhyamavasaneshu
    tatra sthaneshu vilinam bijasagararupam vyacakshvetyrishaya ucuh | tanhovaca bhagavanjatavedase sunavama
    somam tadatyamravanim vilomena pathitva prathamasyadyam tadevam dirgham dvitiyasyadyam sunavama somamityanena
    kaulam vamam shreshtham somam mahasaubhagyamacakshate | sa sarvasampattibhutam prathamam nivrittikaranam
    dvitiyam sthitikaranam tritiyam sargakaranamityanena karashuddhim kritva tripuravidyam spashtikritva
    jatavedase sunavama somamityadi pathitva mahavidyeshvari vidyamacakshate tripureshvarim jatavedasa
    iti | jate adyakshare matrikayah shirasi baindavamamritarupinim kundalinim trikonarupinim ceti vakyarthah
    | evam prathamasyadyam vagbhavam | dvitiyam kamakalalayam | jata ityanena paramatmano jrimbhanam |
    jata ityadina paramatma shiva ucyate | jatamatrena kami kamayate kamamityadina purnam vyacakshate
    | tadeva sunavama gotrarudham madhyavartinamritamadhyenarnena mantrarnanspashtikritva | gotreti namagotrayamityadina
    spashtam kamakalalayam shesham vamamityadina | purvenadhvana vidyeyam sarvarakshakari vyacakshate
    | evametena vidyam tripureshim spashtikritva jatavedasa ityadina jato deva eka ishvarah paramo jyotirmantrato
    veti turiyam varam dattva bindupurnajyotihsthanam kritva prathamasyadyam dvitiyam ca tritiyam ca sarvarakshakarisambandham
    kritva vidyamatmasanarupinim spashtikritva jatavedase sunavama somamityadi pathitva rakshakarim vidyam
    smritvadyantayordhamnoh shaktishivarupinim viniyojya sa iti shaktyatmakam varnam somamiti shaivatmakam
    dhama janiyat | yo janite sa subhago bhavati | evametam cakrasanagatam tripuravasinim sadoditam shivashaktyatmikamaveditam
    jatavedah shiva iti seti shaktyatmaksharamiti shivadishaktyantaralabhutam trikutadicarinim suryacandranamaskam
    mantrasanagatam tripuram mahalakshmim sadoditam spashtikritva jatavedase sunavama somamityadi pathitva
    purvam sadatmasanarupam vidyam smritva veda ityadina vishvahasamtatodayabaindavamupari vinyasya siddhasanastham
    tripuram malinim vidyam spashtikritva jatavedase sunavama somamityadi pathitva tripuram sundarim shritva
    kale akshare vicintya murtibhutam murtirupinim sarvavidyeshvarim tripuram vidyam spashtikritva jatavedasa
    ityadi pathitva tripuram lakshmim shritvagnim nidahati saiveyamagnyanane jvalatiti vicintya trijyotishamishvarim
    tripuramambam vidyam spashtikuryat | 2
  devanagari: सस्तनूभिः ॥ व्यशेम देवहितं यदायुः ॥ स्वस्ति न इन्द्रो वृद्धश्रवाः ॥ स्वस्ति नः पूषा विश्ववेदाः
    ॥ स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः ॥ स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः
    ॐ ॥ अथैतस्मिन्नन्तरे भगवान्प्राजापत्यं वैष्णवं विलयकारणं रूपमाश्रित्य त्रिपुराभिधा भगवतीत्येवमादिशक्त्या
    भूर्भुवः स्वस्त्रीणि स्वर्गभूपातालानि त्रिपुराणि हरमायात्मकेन हीङ्कारेण हृल्लेखाख्या भगवती त्रिकूटावसाने
    निलये विलये धाम्नि महसा घोरेण प्राप्नोति । सैवेयं भगवती त्रिपुरेति व्यापठ्यते । तत्सवितुर्वरेण्यं
    भर्गो देवस्य धीमहि । धियो यो नः प्रचोदयात् परो रजसे सावदोम् । जातवेदसे सुनवाम सोममरातीयतो निदहाति
    वेद । स नः पर्षदति दुर्गाणि विश्वा नावेव सिन्धुं दुरितात्यग्निः । त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम्
    । उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय मामृतात् । शताक्षरी परमा विद्या त्रयीमयी साष्टार्णा त्रिपुरा
    परमेश्वरी । आद्यानि चत्वारि पदानि परब्रह्मविकासीनि । द्वितीयानि शक्त्याख्यानि । तृतीयानि शैवानि ।
    तत्र लोका वेदाः शास्त्राणि पुराणानि धर्माणि वै चिकित्सितानि ज्योतींषि शिवशक्तियोगादित्येवं घटना व्यापठ्यते
    । अथैतस्य परं गह्वरं व्याख्यास्यामो महामनुसमुद्भवं तदिति । ब्रह्म शाश्वतम् । परो भगवान्निर्लक्षणो
    निरञ्जनो निरुपाधिराधिरहितो देवः । उन्मीलते पश्यति विकासते चैतन्यभावं कामयत इति । स एको देवः शिवरूपी
    दृश्यत्वेन विकासते यतिषु यज्ञेषु योगिषु कामयते । कामं जायते स एष निरञ्जनोऽकामत्वेनोज्जृम्भते । अकचटतपयशान्सृजते
    । तस्मादीश्वरः कामोऽभिधीयते । तत्परिभाषया कामः ककारं व्याप्नोति । काम एवेदं तत्तदिति ककारो गृह्यते
    । भस्मात्तत्पदार्थ इति य एवं वेद । सवितुर्वरेण्यमिति षूङ् प्राणिप्रसवे सविता प्राणिनः सूते प्रसूते
    शक्तिम् । सूते त्रिपुरा शक्तिराद्येयं त्रिपुरा परमेश्वरी महाकुण्डलिनी देवी । जातवेदसमण्डलं योऽधीते
    सर्वं व्याप्यते । त्रिकोणशक्तिरेकारेण महाभागेन प्रसूते । तस्मादेकार एव गृह्यते । वरेण्यं श्रेष्ठं
    भजनीयमक्षरं नमस्कार्यम् । तस्माद्वरेण्यमेकाराक्षरं गृह्यत इति य एवं वेद । भर्गो देवस्य धीमहीत्येवं
    व्याख्यास्यामः । धकारो धारणा । धियैव धार्यते भगवान्परमेश्वरः । भर्गो देवो मध्यवर्ति तुरीयमक्षरं साक्षात्तुरीयं
    सर्वं सर्वान्तर्भूतम् । तुरीयाक्षरमीकारं पदानां मध्यवर्तीत्येवं व्याख्यातं भर्गोरूपं व्याचक्षते ।
    तस्माद्भर्गो देवस्य धीमहीत्येवमीकाराक्षरं गृह्यते । महीत्यस्य व्याख्यानं महत्त्वं जडत्वं काठिन्यं
    विद्यते यस्मिन्नक्षतेरेतन्महि लकारः परं धाम । काठिन्याढ्यं ससागरं सपर्वतं स सप्तद्वीपं सकाननमुज्ज्वलद्रूपं
    मण्डलमेवोक्तं लकारेण । पृथ्वी देवी महीत्यनेन व्याचक्षते । धियो यो नः प्रचोदयात् । परमात्मा सदाशिव
    आदिभूतः परः । स्थाणुभूतेन लकारेण ज्योतिर्लिङ्गमात्मानं धियो बुद्धयः परे वस्तुनि ध्यानेच्च्हारहितं
    निर्विकल्पके प्रचोदयात्प्रेरयेदित्युच्चारणरहितं चेतसैव चिन्तयित्वा भावयेदिति । परो रजसे सावदोमिति
    तदवसाने परं ज्योतिरमलं हृदि दैवतं चैतन्यं चिल्लिङ्गं हृदयागारवासिनी हृल्लेखेत्यादिना स्पष्टं वाग्भवकूटं
    पञ्चाक्षरं पञ्चभूतजनकं पञ्चकलामयं व्यापठ्यत इति । य एवं वेद । अथ तु परं कामकलाभूतं कामकूटमाहुः । तत्सवितुर्वरेण्यमित्यादिद्वात्रिंशदक्षरीं
    पठित्वा तदिति परमात्मा सदाशिवोऽकशरं विमलं निरुपाधितादात्न्यप्रतिपादनेन हकाराक्षरं शिवरूपं निरक्षरमक्षरं
    व्यालिख्यत इति । तत्परागव्यावृत्तिमादाय शक्तिं दर्शयति । तत्सवितुरिति पूर्वेणाध्वना सूर्याधश्चन्द्रिकां
    व्यालिख्य मूलादिब्रह्मरन्ध्रगं साक्षरमद्वितीयमाचक्षत इत्याह भगवन्तं देवं शिवशक्त्यात्मकमेवोदितम् ।
    शिवोऽयं परमं देवं शक्तिरेषा तु जीवज्जा । सूर्याचन्द्रमसोर्योगाद्धंसस्ततत्पदमुच्यते ॥ १॥ तस्मादुज्जृम्भते
    कामः कामात्कामः परः शिवः । कार्णोऽयं कामदेवोऽयं वरेण्यं भर्ग उच्यते ॥ २॥ तत्सवितुर्वरेण्यं भर्गो देवः
    क्षीरं सेचनीयमक्षरं समधुघ्नमक्षरं परमात्मजीवात्मनोर्योगात्तदिति स्पष्टमक्षरं तृतीयं ह इति तदेव सदाशिव
    एव निष्कल्मष आद्यो देवोऽन्त्यमक्षरं व्याक्रियते । परमं पदं धीति धारणं विद्यते जडत्वधारणं महीति लकारः
    शिवाधस्तात्तु लकारार्थः स्पष्टमन्त्यमक्षरं परमं चैतन्यं धियो यो नः प्रचोदयात्परो रजसे सावदोमित्येवं
    कूटं कामकलालयं षडध्वपरिवर्तको वैष्णवं परमं धामैति भगवांश्चैतस्माद्य एवं वेद । अथैतस्मादपरं तृतीयं
    शक्तिकूटं प्रतिपद्यते । द्वात्रिंशदक्षर्या गायत्र्या तत्सवितुर्वरेण्यं तस्मादात्मन आकाश आकाशाद्वायुः
    स्फुरति तदधीनं वरेण्यं समुदीयमानं सवितुर्वा योग्यो जीवात्मपरमात्मसमुद्भवस्तं प्रकाशशक्तिरूपं जीवाक्षरं
    स्पष्टमापद्यते । भर्गो देवस्य धीत्यनेनाधाररूपशिवात्माक्षरं गण्यते । महीत्यादिनाशेषं काम्यं रमणीयं
    दृश्यं शक्तिकूटं स्पष्टीकृतमिति । एवं पञ्चदशाक्षरं त्रैपुरं योऽधीते स सर्वान्कामानवाप्नोति । स सर्वांल्लोकाञ्जयति
    । स सर्वा वाचो विजृम्भयति । स रुद्रत्वं प्राप्नोति । स वैष्णवं धाम भित्त्वा परं ब्रह्म प्राप्नोति
    । य एवं वेद । इत्याद्यां विद्यामभिधायैतस्याः शक्तिकूटं शक्तिशिवाद्यं लोपामुद्रेयम् । द्वितीये धामनि
    पूर्वेणैव मनुना बिन्दुहीना शक्तिभूतहृल्लेखा क्रोधमुनिनाधिष्ठिता । तृतीये धामनि पूर्वस्या एव विद्याया
    यद्वाग्भवकूटं तेनैव मानवीं चान्द्रीं कौबेरीं विद्यामाचक्षते । मदनाधः शिवं वाग्भवम् । तदूर्ध्वं कामकलामयम्
    । शक्त्यूर्ध्वं शक्तिमिति मानवी विद्या । चतुर्थे धामनि शिवशक्त्याख्यमन्यत्तृतीयं चेयं चान्द्री विद्या
    । पञ्चमे धामनि ध्येयेयं चान्द्री कामाधः शिवाद्यकामा । सैव कौबेरि षष्ठे धामनि व्याचक्षत इति । य एवं
    वेद । हित्वेकारं तुरीयस्वरं सर्वादौ सूर्याचन्द्रमस्केन कामेश्वर्येवागस्त्यसंज्ञा । सप्तमे धामनि तृतीयमेतस्या
    एव पूर्वोक्तायाः कामाद्यं द्विधाधः कं मदनकलाद्यं शक्तिबीजं वाग्भवाद्यं तयोरर्धावशिरस्कं कृत्वा नन्दिविद्येयम्
    । अष्टमे धामनि वाग्भवमागस्त्यं वागर्थकलामयं कामकलाभिधं सकलमायाशक्तिः प्रभाकरी विद्येयम् । नवमे धामनि
    पुनरागस्त्यं वाग्भवं शक्तिमन्मथशिवशक्तिमन्मथोर्वीमायाकामकलालयं चन्द्रसूर्यानङ्गधूर्जटिमहिमालयं तृतीयं
    षण्मुखीयं विद्या । दशमे धामनि विद्याप्रकाशितया भूय एवागस्त्यविद्यां पठित्वा भूय एवेमामन्त्यमायां परमशिवविद्येयमेकादशे
    धामनि भूय एवागस्त्यं पठित्वा एतस्या एव वाग्भवं यद्धनजं कामकलालयं च तत्सहजं कृत्वा लोपामुद्रायाः शक्तिकूटराजं
    पठित्वा वैष्णवी विद्या द्वादशे धामनि व्याचक्षत इति । य एवं वेद । तान्होवाच । भगवान्सर्वे यूयं श्रुत्वा
    पूर्वां कामाख्यां तुरीयरूपां तुरीयातीतां सर्वोत्कटां सर्वमन्त्रासनगतां पीठोपपीठदेवतापरिवृतां सकलकलाव्यापिनीं
    देवतां सामोदां सपरागां सहृदयां सामृतां सकलां सेन्द्रियां सदोदितां परां विद्यां स्पष्टीकृत्वा हृदये
    निधाय विज्ञायानिलयं गमयित्वा त्रिकूटां त्रिपुरां परमां मायां श्रेष्ठां परां वैष्णवीं संनिधाय हृदयकमलकर्णिकायां
    परां भगवतीं लक्ष्मीं मायां सदोदितां महावश्यकरीं मदनोन्मादनकारिणीं धनुर्बाणधारिणीं वाग्विजृम्भिणीं
    चन्द्रमण्डलमध्यवर्तिनीं चन्द्रकलां सप्तदशीं महानित्योपस्थितां पाशाङ्कुशमनोज्ञ पाणिपल्लवां समुद्यदर्कनिभां
    त्रिनेत्रां विचिन्त्य देवीं महालक्ष्मीं सर्वलक्ष्मीमयीं सर्वलक्षणसंपन्नां हृदये चैतन्यरूपिणीं निरञ्जनां
    त्रिकूटाख्यां स्मितमुखीं सुन्दरीं महामायां सर्वसुभगां महाकुण्डलिनीं त्रिपीठमध्यवर्तिनीमकथादिश्रीपीठे
    परां भैरवीं चित्कलां महात्रिपुरां देवीं ध्यायेन्महाध्यान योगेनेयमेवं वेदेति महोपनिषत् ॥ इति प्रथमोपनिषत्
    ॥ १॥ अथातो जातवेदसे सुनवाम सोममित्यादि पठित्वा त्रैपुरी व्यक्तिर्लक्ष्यते । जातवेदस इत्येकर्चसूक्तस्याद्यमध्यमावसानेषु
    तत्र स्थानेषु विलीनं बीजसागररूपं व्याचक्ष्वेत्यृषय ऊचुः । तान्होवाच भगवाञ्जातवेदसे सुनवाम सोमं तदत्यम्रवाणीं
    विलोमेन पठित्वा प्रथमस्याद्यं तदेवं दीर्घं द्वितीयस्याद्यं सुनवाम सोममित्यनेन कौलं वामं श्रेष्ठं सोमं
    महासौभाग्यमाचक्षते । स सर्वसंपत्तिभूतं प्रथमं निवृत्तिकारणं द्वितीयं स्थितिकारणं तृतीयं सर्गकारणमित्यनेन
    करशुद्धिं कृत्वा त्रिपुराविद्यां स्पष्टीकृत्वा जातवेदसे सुनवाम सोममित्यादि पठित्वा महाविद्येश्वरी
    विद्यामाचक्षते त्रिपुरेश्वरीं जातवेदस इति । जाते आद्यक्षरे मातृकायाः शिरसि बैन्दवममृतरूपिणीं कुण्डलिनीं
    त्रिकोणरूपिणीं चेति वाक्यार्थः । एवं प्रथमस्याद्यं वाग्भवम् । द्वितीयं कामकलालयम् । जात इत्यनेन परमात्मनो
    जृम्भणम् । जात इत्यादिना परमात्मा शिव उच्यते । जातमात्रेण कामी कामयते काममित्यादिना पूर्णं व्याचक्षते
    । तदेव सुनवाम गोत्रारूढं मध्यवर्तिनामृतमध्येनार्णेन मन्त्रार्णान्स्पष्टीकृत्वा । गोत्रेति नामगोत्रायामित्यादिना
    स्पष्टं कामकलालयं शेषं वाममित्यादिना । पूर्वेणाध्वना विद्येयं सर्वरक्षाकरी व्याचक्षते । एवमेतेन विद्यां
    त्रिपुरेशीं स्पष्टीकृत्वा जातवेदस इत्यादिना जातो देव एक ईश्वरः परमो ज्योतिर्मन्त्रतो वेति तुरीयं वरं
    दत्त्वा बिन्दुपूर्णज्योतिःस्थानं कृत्वा प्रथमस्याद्यं द्वितीयं च तृतीयं च सर्वरक्षाकरीसंबन्धं कृत्वा
    विद्यामात्मासनरूपिणीं स्पष्टीकृत्वा जातवेदसे सुनवाम सोममित्यादि पठित्वा रक्षाकरीं विद्यां स्मृत्वाद्यन्तयोर्धाम्नोः
    शक्तिशिवरूपिणीं विनियोज्य स इति शक्त्यात्मकं वर्णं सोममिति शैवात्मकं धाम जानीयात् । यो जानीते स सुभगो
    भवति । एवमेतां चक्रासनगतां त्रिपुरवासिनीं सदोदितां शिवशक्त्यात्मिकमवेदितां जातवेदाः शिव इति सेति शक्त्यात्माक्षरमिति
    शिवादिशक्त्यन्तरालभूतां त्रिकूटादिचारिणीं सूर्याचन्द्रनमस्कां मन्त्रासनगतां त्रिपुरं महालक्ष्मीं सदोदितां
    स्पष्टीकृत्वा जातवेदसे सुनवाम सोममित्यादि पठित्वा पूर्वं सदात्मासनरूपां विद्यां स्मृत्वा वेद इत्यादिना
    विश्वाहसंततोदयबैन्दवमुपरि विन्यस्य सिद्धासनस्थां त्रिपुरां मालिनीं विद्यां स्पष्टीकृत्वा जातवेदसे
    सुनवाम सोममित्यादि पठित्वा त्रिपुरां सुन्दरीं श्रित्वा कले अक्षरे विचिन्त्य मूर्तिभूतां मूर्तिरूपिणीं
    सर्वविद्येश्वरीं त्रिपुरां विद्यां स्पष्टीकृत्वा जातवेदस इत्यादि पठित्वा त्रिपुरां लक्ष्मीं श्रित्वाग्निं
    निदहाति सैवेयमग्न्यानने ज्वलतीति विचिन्त्य त्रिज्योतिषमीश्वरीं त्रिपुरामम्बां विद्यां स्पष्टीकुर्यात्
    । २
