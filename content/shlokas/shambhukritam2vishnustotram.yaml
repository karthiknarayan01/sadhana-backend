id: shambhukritam2vishnustotram
category: stotram
name:
  english: shambhukritam2vishnustotram
  devanagari: शम्भुकृतं२विष्णुस्तोत्रम्
content:
  english: 30|| shantaya dharmanidhaye kshetrajnayamritatmane | shishyayogapratishthaya namo jivaikahetave
    | ghoraya mayavidhaye sahasrashirase namah || 31|| yoganidratmane nabhipadmodbhutajagatsrije | namah
    salilarupaya karanaya jagatsthiteh || 32|| karyameyaya baline jivaya paramatmane | goptre pranaya
    bhutanam namo vishvaya vedhase || 33|| driptaya simhavapushe daityasamharakarine | viryayanantamanase
    jagadbhavabhrite namah || 34|| samsarakaranajnanamahasantamasacchide | acintyadhamne guhyaya rudrayatyudvije
    namah || 35|| shantaya shantakallolakaivalyapadadayine | sarvabhavatiriktaya namah sarvamayatmane
    || 36|| indivaradalashyamam sphurjatkinjalkavibhramam | bibhranam kaustubham vishnum naumi netrarasayanam
    || 37|| iti shriskandapurane vaishnavakhande ayodhyamahatmye shashthadhyayantargatam shambhukritam
    vishnustotram samaptam | skandapurana | vaishnavakhanda | ayodhyakhanda | adhyaya 6
  devanagari: ३०॥ शान्ताय धर्मनिधये क्षेत्रज्ञायामृतात्मने । शिष्ययोगप्रतिष्ठाय नमो जीवैकहेतवे । घोराय
    मायाविधये सहस्रशिरसे नमः ॥ ३१॥ योगनिद्रात्मने नाभिपद्मोद्भूतजगत्सृजे । नमः सलिलरूपाय कारणाय जगत्स्थितेः
    ॥ ३२॥ कार्यमेयाय बलिने जीवाय परमात्मने । गोप्त्रे प्राणाय भूतानां नमो विश्वाय वेधसे ॥ ३३॥ दृप्ताय
    सिंहवपुषे दैत्यसंहारकारिणे । वीर्यायानन्तमनसे जगद्भावभृते नमः ॥ ३४॥ संसारकारणाज्ञानमहासन्तमसच्छिदे
    । अचिन्त्यधाम्ने गुह्याय रुद्रायात्युद्विजे नमः ॥ ३५॥ शान्ताय शान्तकल्लोलकैवल्यपददायिने । सर्वभावातिरिक्ताय
    नमः सर्वमयात्मने ॥ ३६॥ इन्दीवरदलश्यामं स्फूर्जत्किञ्जल्कविभ्रमम् । बिभ्राणं कौस्तुभं विष्णुं नौमि
    नेत्ररसायनम् ॥ ३७॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे अयोध्यामाहात्म्ये षष्ठाध्यायान्तर्गतं शम्भुकृतं
    विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । अयोध्याखण्ड । अध्याय ६
meaning: {}
