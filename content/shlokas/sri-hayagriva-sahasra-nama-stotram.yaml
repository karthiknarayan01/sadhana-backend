    दक्षिणपाणियुग्मविलसद्बोधाङ्कचक्रायुधः । वामोदग्रकरे दरं तदितरेणाश्लिष्य दोष्णा रमां हस्ताग्रे धृतपुस्तकस्स
    दयतां हंसो हिरण्यच्छदः ॥ ॥ अथ सहस्रनामस्तोत्रप्रारम्भः । ॐ श्रीं हंसो हमै मों क्लीं श्रीश्श्रियश्श्रीविभूषणः
    । परोरजाः परं ब्रह्म भूर्भुवस्सुवरादिमः ॥ ॥ भास्वान्भगश्च भगवान्स्वस्तिस्वाहा नमस्स्वधा । श्रौषड्वौषढलं
    हुं फट् हुं ह्रीं क्रों ह्लौं यथा तथा ॥ ॥ कर्कग्रीवः कलानाथः कामदः करुणाकरः । कमलाध्युषितोत्सङ्गः
    क्षये कालीवशानुगः ॥ ॥ निषच्छोपनिषच्चाथ नीचैरुच्चैस्समं सह । शश्वद्युगपदह्वाय शनैरेको बहुध्रुवः ॥ ॥
    भूतभृद्भूरिदस्साक्षी भूतादिः पुण्यकीर्तनः । भूमा भूमिरधोन्नद्धः पुरुहूतः पुरुष्टुतः ॥ ॥ प्रफुल्लपुण्डरीकाक्षः
    परमेष्ठी प्रभावनः । प्रभुर्भगःसतां बन्धुर्भयध्वंसी भवापनः ॥ ॥ उद्यन्नुरुशयाहुं कृदुरुगाय उरुक्रमः
    । उदारस्त्रियुगस्त्र्यात्मा निदानं नलयो हरिः ॥ ॥ हिरण्यगर्भो हेमाङ्गो हिरण्यश्मश्रुरीशिता । हिरण्यकेशो
    हिमहा हेमवासा हितैषणः ॥ ॥ आदित्यमण्डलान्तस्थो मोदमानस्समूहनः । सर्वात्मा जगदाधारस्सन्निधिस्सारवान्स्वभूः
    ॥ ॥ गोपतिर्गोहितो गोमी केशवः किन्नरेश्वरः । मायी मायाविकृतिकृन्महेशानो महामहाः ॥ ॥ ममा मिमी मुमू मृमॄं
    म्लुम्लूं मेमैं तथैव च । मोमौं बिन्दुर्विसर्गश्च ह्रस्वोदीर्घः प्लुतस्स्वरः ॥ ॥ उदात्तश्चानुदात्तश्च
    स्वरितः प्रचयस्तथा । कं खं गं घं ंअं च चं छं जं झं ञं टं ठमेव च ॥ ॥ डं ढं णं तं थं च दं च धं नं पं
    फं बमेव च भं मं यं रं लं च वं च शं षं सं हं लमेव च ॥ ॥ क्षं यमों व्यञ्जनो जिह्वामूलीयोऽर्धविसर्गवान्
    । उपध्मानीय इति च संयुक्ताक्षर एव च ॥ ॥ पदं क्रिया कारकश्च निपातो गतिरव्ययः । सन्निधिर्योग्यताऽकाङ्क्षा
    परस्परसमन्वयः ॥ ॥ वाक्यं पद्यं सम्प्रदायो भावश्शब्दार्थलालितः । व्यञ्जना लक्षणा शक्तिः पाको रीतिरलङ्कृतिः
    ॥ ॥ शय्या फ्रौढध्वनिस्तद्वत्काव्यं सर्गः क्रिया रुचिः । नानारूपप्रबन्धश्च यशः पुण्यं महद्धनम् ॥ ॥
    व्यवहारपरिज्ञानं शिवेतरपरिक्षयः । सदः परमनिर्वाणं प्रियपथ्योपदेशकः ॥ ॥ संस्कारः प्रतिभा शिक्षा ग्रहणं
    धारणं श्रमः । आसुतास्वादिमा चित्रं विस्तारश्चित्रसंविधिः ॥ ॥ पुराणमितिहासश्च स्मृतिसूत्रं च संहिता
    । आचार आत्मना तुष्टिराचार्याज्ञानतिक्रमः ॥ ॥ श्रीमान्श्रीगीःश्रियः कान्तश्श्रीनिधिश्श्रीनिकेतनः ।
    श्रेयान्हयाननश्रीदश्श्रीमयश्श्रितवत्सलः ॥ ॥ हंसश्शुचिषदादित्यो वसुश्चन्द्रोऽन्तरिक्षसत् । होता च वेदिषद्योनिरतिथिर्द्रोणसद्धविः
    ॥ ॥ नृषन्मृत्युश्च वरसदमृतं चर्तसद्वृषः । व्योमसद्विविधस्कोटशब्दार्थव्यङ्ग्यवैभवः ॥ ॥ अब्जा रसस्वादुतमो
    गोजा गेयो मनोहरः । ऋतजास्सकलं भद्रमद्रिजास्थैर्यमुत्तमम् ॥ ॥ ऋतं समज्ञात्वनृतं बृहत्सूक्ष्मवशानुगः
    । सत्यं ज्ञानमनन्तं यत्तत्सद्ब्रह्ममयोऽच्युतः ॥ ॥ अग्रेभवन्नगो नित्यः परमः पुरुषोत्तमः । योगनिद्रापरस्स्वामी
    निध्यानवरनिर्वृनः ॥ ॥ रसो रस्यो रसयिता रसवान् रसिकप्रियः । आनन्दो नन्दयन्सर्वानानन्दी हयकन्धरः ॥ ॥
    कालः काल्यश्च कालात्मा कालाभ्युत्थितजागरः । कलासाचिव्यकृत्कान्ताकथितव्याधिकार्यकः ॥ ॥ दृन्न्यञ्चनोदञ्चनोद्यल्लयसर्गो
    लघुक्रियः । विद्यासहायो वागीशो मातृकामण्डलीकुतः ॥ ॥ हिरण्यं हंसमिथुनमीशानश्शक्तिमान् जयी । ग्रहमेथी
    गुणी श्रीभूनीलालीलैकलालस ॥ ॥ अङ्केनोदूह्य वाग्देवीमाचार्यकमुपाश्रयः । वेदवेदान्तशास्त्रार्थतत्त्वव्याख्यानतत्परः
    ॥ ॥ ल्हौं ह्लं हं हं हयो हं सूं हंसां हंसीं हसूं हसौम् । हसूं हं हरिणो हारी हरिकेशो हरेडितः ॥ ॥ सनातनो
    निर्बीजस्सन्नव्यक्तो हृदयेशयः । अक्षरः क्षरजीवेशः क्षमी क्षयकरोऽच्युतः ॥ ॥ कर्ताकारयिताऽकार्यं कारणं
    प्रकृतिः कृतिः । क्षयक्षयमनामार्थो विष्णुर्जिष्णुर्जगन्मयः ॥ ॥ सङ्कुचन्विकचन्स्थाणुनिर्विकारो निरामयः
    । शुद्धो बुद्धः प्रबुद्धश्च स्निग्धो मुग्धस्समुद्धतः ॥ ॥ सङ्कल्पदो बहुभवत्सर्वात्मा सर्वनामभृत् ।
    सहस्रशीर्षस्सर्वज्ञस्सहस्राक्षस्सहस्रपात् ॥ ॥ व्यक्तोविराट्स्वराट्सम्राड्विष्वग्रूपवपुर्विधुः । मायावी
    परमानन्दो मान्यो मायातिगो महान् ॥ ॥ वटपत्रशयो बालो ललन्नाम्नायसूचकः । मुखन्यस्तकरग्रस्तपादाग्रपटलः
    प्रभुः ॥ ॥ नैद्रीहासाश्वसम्भूतज्ञाज्ञसात्विकतामसः । महार्णवाम्बुपर्यङ्कः पद्मनाभः परात्परः ॥ ॥ ब्रह्मभूर्ब्रह्मभयहृद्धरिरोमुपदेशकृत्
    । मधुकैटभनिर्माता मत्तब्रह्ममदापहः ॥ ॥ वेधोविलासवागानिर्दयासारो मृषार्थदः । नारायणास्त्रनिर्मातामधुकैटभमर्दनः
    ॥ ॥ वेदकर्ता वेदभर्ता वेदहर्ता विदांवरः । पुङ्खानुपुङ्खहेषाढ्यः पूर्णषाड्गुण्यविग्रहः ॥ ॥ लालामृतकणव्याजवान्तनिर्दोषवर्णकः
    । उल्लोलस्वानधीरोद्यदुच्चैर्हलहलध्वनिः ॥ ॥ कर्णादारभ्य कल्क्यात्मा कविः क्षीरार्णवोपमः । शङ्ख चक्रगदी
    खड्गी शार्ङ्गी निर्भयमुद्रकः ॥ ॥ चिन्मुद्राचिह्नितो हस्ततलविन्यस्तपुस्तकः । विद्यानाम्नीं श्रियं शिष्यां
    वेदयन्निजवैभवम् ॥ ॥ अष्टार्ण्यम्योऽष्टभुजोव्यष्टिसृष्टिकरः पिता । अष्टैश्वर्यप्रदोहृष्यदष्टमूर्तिपितृस्तुतः
    ॥ ॥ अनीतवेदपुरुषो विधिवेदोपदेशकृत् । वेदवेदाङ्गवेदान्तपुराणस्मृतिमूर्तिमान् ॥ ॥ सर्वकर्मसमाराध्यस्सर्ववेदमयो
    विभुः । सर्वार्थतत्त्वव्याख्याता चतुष्षष्टिकलाधिपः ॥ ॥ शुभयुक्सुमुखश्शुद्धस्सुरूपस्सुगतस्सुधीः । सुव्रतिस्संहृतिश्शूरस्सुतपाः
    सुष्टुतिस्सुहृत् ॥ ॥ सुन्दरस्सुभगस्सौम्यस्सुखदस्सुहृदां प्रियः । सुचरित्रस्सुखतरश्शुद्धसत्वप्रदायकः
    ॥ ॥ रजस्तमोहरो वीरोविश्वरक्षाधुरन्धरः । नरनारायणाकृत्या गुरुशिष्यत्वमास्थितः ॥ ॥ परावरात्मा प्रबलः
    पावनः पापनाशनः । दयाघनः क्षमासारो वात्सल्यैकविभूषणः ॥ ॥ आदिकूर्मो जगद्भर्ता महापोत्री महीधरः । स्तद्भित्स्वामी
    हरिर्यक्षो हिरण्यरिपुरैच्छिकः ॥ ॥ प्रह्लादपालकस्सर्वभयहर्ता प्रियंवदः । श्रीमुखालोकनस्रंसत्क्रौञ्चकः
    कुहकाञ्चनः ॥ ॥ छत्री कमण्डलुधरो वामनो वदतां वरः । पिशुनात्मा शनोदृष्टिलोपनो बलिमर्दनः ॥ ॥ उरुक्तमो
    बलिशिरोन्यस्ताङ्घ्रिर्बलिमर्दनः । जामदग्न्यः परशुभृत्कृत्तक्षत्त्रकुलोत्तमः ॥ ॥ रामोऽभिरामश्शान्तात्मा
    हरकोदण्डखण्डनः । शरणागतसन्त्राता सर्वायोध्यकमुक्तिदः ॥ ॥ सङ्कर्षणोमदोदग्रो बलवान्मुसलायुधः । कृष्णाक्लेशहरः
    कृष्णो महाव्यसनशान्तिदः ॥ ॥ अङ्गारितोत्तरागर्भप्राणदः पार्थसारथिः । गीताचार्यो धराभारहारी षट्पुरमर्दनः
    ॥ ॥ कल्की विष्णुयशस्सूनुः कलिकालुष्यनाशनः । साधुदुष्कृत्परित्राणविनाशविहितोदयः ॥ ॥ वैकुण्ठे परमे तिष्ठन्
    सुकुमारयुवाकृतिः । विश्वोदयस्थितिध्वंससङ्कल्पेन स्वयं प्रभुः ॥ ॥ मदनानां च मदनो मणिकोटीरमानितः । मन्दारमालिकापीडो
    मणिकुण्डलमण्डितः ॥ ॥ सुस्निग्धनीलकुटिलकुन्तलः कोमलाकृतिः । सुललाटस्स्तुतिलकस्सुभ्रूकस्सुकपोलकः ॥ ॥
    सिद्धासदसदालोकसुधास्यन्दीरदच्छदः । तारकाकोरकाकारविनिर्मितरदच्छदः ॥ ॥ सुधावर्तिपरिस्फूर्तिशोभमानरदच्छदः
    । विष्टब्धोविपुलग्रीवोनिभृतोच्चैश्श्रवस्थितिः ॥ ॥ समावृत्तावदातोरुमुक्ताप्रालम्बभूषणः । रत्नाङ्गदी
    वज्रनिष्की नीलरत्नाङ्ककङ्कणः ॥ ॥ हरिन्मणिगणाबद्धशृङ्खलाकङ्कणोर्मिकः । सितोपवीतसंश्लिष्यत्पद्माक्षमणिमालिकः
    ॥ ॥ श्रीचूर्णवद्द्वादशोर्ध्वपुण्ड्ररेखापरिष्कृतः । पट्टतन्तुग्रथनवत्पवित्रनरशोभितः ॥ ॥ पीनवक्षामहास्कन्धो
    विपुलोरुकटीतटः । कौस्तुभी वनमाली च कान्त्याचन्द्रायुतोपमः ॥ ॥ मन्दारमालिकामोदी मञ्जुवागमलच्छविः ।
    दिव्यगन्धो दिव्यरसो दिव्यतेजा दिवस्पतिः ॥ ॥ वाचालो वाक्पतिर्वक्ता व्याख्याता वादिनां प्रियः । भक्तहृन्मधुरो
    वादिजिह्वाभद्राननस्थितिः ॥ ॥ स्मृतिसन्निहितस्स्निग्धस्सिद्धिदसिद्धिसन्नुतः । मूलकन्दोमुकुन्दोग्लौस्स्वयम्भूशम्भुरैन्दवः
    ॥ ॥ इष्टो मनुर्यमः कालकाल्यः कम्बुकलानिधिः । कल्यः कामयिता भीमः कातर्यहरणः कृतिः ॥ ॥ सम्प्रियः पक्कणस्तर्कचर्चानिर्धारणादयः
    । व्यतिरेको विवेकश्च प्रवेकः प्रक्रमः क्रमः ॥ ॥ प्रमाण प्रतिभूः प्राज्ञः प्रज्ञापत्थ्याचधारणः । विधिर्विधाता
    व्यवधिरुद्भवः प्रभवस्थितिः ॥ ॥ विषयस्संशयः पूर्वः पक्षः कक्ष्योपपादकः । राद्धान्तो विहितो न्यायफलनिष्पत्तिरुद्भवः
    ॥ ॥ नानारूपाणि तन्त्राणि व्यवहार्यो व्यवस्थितिः । सर्वसाधारणो देवस्साध्वसाधुहिते रतः ॥ ॥ सन्धा सनातनो
    धर्मो धर्मैरर्च्या महात्मभिः । छन्दोमयस्त्रिधामात्मा स्वच्छन्दश्छान्दसेडितः ॥ ॥ यज्ञो यज्ञात्मको यष्टा
    यज्ञाङ्गोऽपघनोहविः । समिदाज्यं पुरोडाशश्शाला स्थाली स्रुवस्स्रुचा ॥ ॥ प्राग्वंशो देवयजनः परिधिश्च
    परिस्तरः । वेदिर्विहरणं त्रेता पशुः पाशश्च संस्कृतिः ॥ ॥ विधिर्मन्त्रोऽर्थवादश्च द्रव्यमङ्गं च दैवतम्
    । स्तोत्रं शस्त्रं साम गीतिरुद्गीथस्सर्वसाधनम् ॥ ॥ याज्या पुरोनुकाव्या च सामिधेनी समूहनम् । प्रयोक्तारः
    प्रयोगश्च प्रपञ्चः प्राशुभा श्रमः ॥ ॥ श्रद्धा प्रध्वंसना तुष्टिः पुष्टिः पुण्यं प्रतिर्भवः । सदस्सदस्यसम्पातः
    प्रश्नः प्रतिवचस्थितिः ॥ ॥ प्रायश्चित्तं परिष्कारो धृतिर्निर्वहणं फलम् । नियोगो भावना भाव्यं हिरण्यं
    दक्षिणा नुतिः ॥ ॥ आशीरभ्युपपत्तिश्च तृप्तिस्स्वं शर्म केवलम । पुण्यक्षयः पुनः पातभयं शिक्षाशुगर्दनः
    ॥ ॥ कार्पण्यं यातनां चिन्ता निर्वेदश्च विहस्तता । देहभृत्कर्मसम्पातः किञ्चित्कर्मानुकूलकः ॥ ॥ अहेतुकतया
    प्रेम साम्मुख्यं चाप्यनुग्रहः । शुचिश्श्रीमत्कुलजनो नेता सत्त्वाभिमानवान् ॥ ॥ अन्तरायहरः पित्रोरदुष्टाहारदायकः
    । शुद्धाहारानुरूपाङ्गपरिणामविधायकः ॥ ॥ स्रावपातादिविपदां परिहर्ता परायणः । शिरःपाण्यादिसन्धाता क्षेमकृत्प्राणदः
    प्रभु ॥ ॥ अनिर्घृणश्चाविषमश्शक्तित्रितयदायकः । स्वेच्छाप्रसङ्गसम्पत्तिव्याजहर्षविशेषवान् ॥ ॥ संवित्सन्धायकस्सर्वजन्मक्लेशस्मृतिप्रदः
    । विवकेशोकवैराग्यभवभीतिविधायकः ॥ ॥ गर्भस्याप्यनुकूलादिनासान्ताध्यवसायदः । शुभवैजननोपेतसदनेहोजनिप्रदः
    ॥ ॥ उत्तमायुःप्रदो ब्रह्मनिष्ठानुग्रहकारकः । स्वदासजननिस्तीर्णतद्वंशजपरम्परः ॥ ॥ श्रीवैष्णवोत्पादकृतस्वस्तिकावनिमण्डलः
    । अधर्वणोक्तैकशतमृत्युदूरक्रियापरः ॥ ॥ दयाद्यष्टगुणाधाता तत्तत्संस्कृतिसाधकः । मेधाविधाता श्रद्धाकृत्
    सौस्थ्यदो जामिताहरः ॥ ॥ विघ्ननुद्विजयी धाता देशकालानुकूल्यकृत् । विनेता सत्पथानेता दोषहृच्छुभदस्सखा
    ॥ ॥ ह्रीदो भीदो रुचिकरो विश्वो विश्वहिते रतः । प्रमादहृत्प्राप्तकारी प्रद्युम्नो बलवत्तरः ॥ ॥ साङ्गवेदसमायोक्ता
    सर्वशास्त्रार्थवित्तिदः । ब्रह्मचर्यान्तरायघ्नः प्रियकृद्धितकृत्परः ॥ ॥ चित्तशुद्धिप्रदश्छिन्नाक्षचापल्यः
    क्षमावहः । इन्द्रियार्थारतिच्छेत्ता विद्यैकव्यसनावहः ॥ ॥ आत्मानुकूल्यरुचिकृदखिलार्तिविनाशकः । तितीर्षुहृत्त्वरावेदी
    गुरुसद्भक्तितेजसः ॥ ॥ गुरुसम्बन्धघटको गुरुविश्वासवर्धनः । गुरूपासनसन्धाता गुरुप्रेमप्रवर्धनः ॥ ॥ आचार्याभिमतैर्योक्ता
    पञ्चसंस्कृतिभावनः । गुरूक्तवृत्तिनैश्चल्यसन्धाताऽवहितस्थितिः ॥ ॥ आपन्नाखिलरक्षार्थमाचार्यकमुपाश्रितः
    । शास्त्रपाणिप्रदानेन भवमग्नान्समुद्धरन् ॥ ॥ पाञ्चकालिकधर्मेषु नैश्चल्यं प्रतिपादयन् । स्वदासाराधनाद्यर्थशुद्धद्रव्यप्रदायकः
    ॥ ॥ न्यासविद्याविनिर्वोढा न्यस्तात्मभररक्षकः । स्वकैङ्कर्यैकरुचिदस्स्वदास्यप्रेमवर्धनः ॥ ॥ आचार्यार्थाखिलद्रव्यसम्भृत्यर्पणरोचकः
    । आचार्यस्य स्वसच्छिष्योज्जीवनैकरुचिप्रदः ॥ ॥ आगत्ययोजयनासहितैककृतिजागरः । ब्रह्मविद्यासमास्वादसुहितः
    कृतिसंस्कृतिः ॥ ॥ सत्कारे विषधीदाता तरुण्यां शवबुद्धिदः । सभाम्प्रत्याययन्व्यालीं सर्वत्र समबुद्धिदः
    ॥ ॥ सम्भाविताशेषदोषहृत्पुनर्न्यासरोचकः । महाविश्वाससन्धाता स्थैर्यदाता मदापहः ॥ ॥ नादव्याख्यास्वसिद्धान्तरक्षाहेतुस्वमन्त्रदः
    । स्वमन्त्रजपसंसिद्धिजङ्घालकवितोदयः ॥ ॥ अदुष्टगुणवत्काव्यबन्धव्यामुग्धचेतनः । व्यङ्ग्यप्रधानरसवद्गद्यपद्यादिनिर्मितिः
    ॥ ॥ स्वभक्तस्तुतिसन्तुष्टो भूयोभक्तिप्रदायकः । सात्विकत्यागसम्पन्नसत्कर्मकृदतिप्रियः ॥ ॥ निरन्तरानुस्मरणनिजदासैवादास्यकृत्
    । निष्कामवत्सलो नैच्यभावनेषु विनिर्विशन् ॥ ॥ सर्वभूतभवद्भावं सम्पश्यत्सुसदास्थितः । करणत्रयसारूप्यकल्याणपतिसादरः
    ॥ ॥ कदा कदेति कैङ्कर्यकामिनां शेषिताम्भजन । परव्यूहादिनिर्दोषशुभाश्रयपरिग्रहः ॥ ॥ चन्द्रमण्डलमध्यस्य
    श्वेताम्भोरुहविष्टरः । ज्योत्स्नायमानाङ्गरुचिनिर्धूतान्तर्बहिस्तमाः ॥ ॥ भाव्यो भावयिता भद्रं पारिजातवनालयः
    । क्षीराब्धिमध्यमद्वीपपालकः प्रपितामहः ॥ ॥ निरन्तरनमोवाकशुद्धयाजिहदाश्रयः । मुक्तिदश्वेतमृद्रूपश्वेतद्वीपविभावनः
    ॥ ॥ गरुडाहारितश्वेतमृत्पूतयदुभूधरः । भद्राश्ववर्षनिलयो भयहारी शुभाश्रयः ॥ ॥ भद्रश्रीवत्सहाराढ्यः पञ्चरात्रप्रवर्तकः
    । भक्तात्मभावभवनो हार्दोऽङ्गुष्ठप्रमाणवान् ॥ ॥ स्वदाससत्कृताकृत्ये तन्मित्रारिषु योजयन् । प्राणानुत्क्रामयन्नूरीकृतप्रारब्धलोपनः
    ॥ ॥ लध्व्यैव शिक्षयापापमशेषमपि निर्णुदन् । त्रिस्थूणक्षोभतो भूतसूक्ष्म्यैस्सूक्ष्मवपुस्सृजन् ॥ ॥ निरङ्कुशकृपापूरो
    नित्यकल्याणकारकः । मूर्धन्यनाड्या स्वान्दासान्ब्रह्मरन्ध्रादुदञ्चयन् ॥ ॥ उपासनपरान्सर्वान् प्रारब्धमनुभावयन्
    । सर्वप्रारब्धदेहान्तेऽप्यन्तिमस्मरणं दिशन् ॥ ॥ प्रपेयुषां भेजुषां च यमदृष्टिमभावयन् । दिव्यदेहप्रदस्सूर्यं
    द्वारयन्मोक्षमेयुषाम् ॥ ॥ आतिवाहिकसत्कारानध्वन्यापाद्य मानयन् । सार्वान्क्रतुभुजश्शश्वत्प्राभृतानि
    प्रदापयन् ॥ ॥ दुरन्तमायाकान्तारं द्रुतं योगेन् लङ्घयन् । स्फायत्सुदर्शविविधवीथ्यन्तेनाध्वना नयन् ॥
    ॥ सीमान्तसिन्धुविरजां योगेनोत्तारयन्वशी । अमानवस्य देवस्य करं शिरसि धारयन् ॥ ॥ अनादिवासनां धून्वन्
    वैकुण्ठाप्त्या सलोकयन् । अहेयमङ्गलोदारतनुदानात्सरूपयन ॥ ॥ सूरिजुष्टं सुखैकान्तं परमं पदमापयन् । अरारण्यामृताम्भोधी
    दर्शयन् श्रमनाशनः ॥ ॥ दिव्योद्यानसरोवापीसरिन्मणिनगान्नयन । ऐरम्मदामृतसरोगमयन्सूपबृंहणः ॥ ॥ अश्वत्थं
    सोमसवनं प्रापयन्विष्टरश्रवाः । दिव्याप्सरस्समानीतब्रह्मालङ्कारदायकः ॥ ॥ दिव्यवासोऽञ्जनक्षौममाल्यैस्स्वान्बहुमानयन्
    । स्वीयामयोध्यां नगरीं सादरं सम्प्रवेशयन् ॥ ॥ दासान्दिव्यरसालोकगन्धांसलशरीरयन् । स्वदासान्सूरिवर्गेण
    सस्नेहं बहुमानयन् ॥ ॥ सूरिसेवोदितानन्दनैच्यान्स्वानतिशाययन् । वाचयन्स्वां नमोवीप्सां कुर्वन्प्रह्वान्कृताञ्जलीन्
    ॥ ॥ प्राकारगोपुरारामप्रासादेभ्यः प्रणामयन् । इन्द्रप्रजापतिद्वारपालसम्मानमापयन् ॥ ॥ मालिकाञ्चन्महाराजवीथीमध्यं
    निवासयन् । श्रीवैकुण्ठपुरन्ध्रीभिर्नानासत्कारकारकः ॥ ॥ दिव्यं विमानं गमयन् ब्रह्मकान्त्याभिपूरयन्
    । महानन्दात्मकश्रीमन्मणिमण्डपमापयन् ॥ ॥ हृष्यत्कुमुदचण्डाद्यैर्विष्वक्सेनान्तिकं नयन् । सेनेशचोदितास्थाननायको
    हेतिनायकः ॥ ॥ प्रापयन्दिव्यमास्थानं वैनतेयं प्रणामयन् । श्रीमत्सुन्दरसूरीन्द्रदिव्यपङ्क्तिं प्रणामयन्
    ॥ ॥ भास्वरासनपर्यङ्कप्रापणेन कृतार्थयन् । पर्यङ्कविद्यासंसिद्धसर्ववैभवसङ्गतः ॥ ॥ स्वात्मानमेव श्रीकान्तं
    सादरं भूरि दर्शयन् । शेषतैकरतिं शेषं शय्यात्मानं प्रणामयन् ॥ ॥ अनन्ताक्षिद्विसाहस्रसादरालोकपात्रयन्
    । अकुमारयुवाकारं श्रीकान्तं सम्प्रणामयन् ॥ ॥ अतटानन्दतो हेतो रञ्चयन्किलिकिञ्चितम् । दासानत्युत्थितमुहुःकृतिसृष्टिप्रसन्नहृत्
    ॥ ॥ श्रीयां प्रापस्वयं तातं जीवं पुत्रं प्रहर्षयन् । मज्जयन् स्वमुखाम्भोधौ स्वकां कीर्तिरुचिं दिशन्
    ॥ ॥ दयार्द्रगङ्गावलनाकृतह्लादैः कृतार्थयन् । पर्यङ्कारोहणप्रह्वं समं लक्ष्म्योपपादयन् ॥ ॥ कस्त्वमित्यनुयुञ्जानो
    दासोऽस्मीत्युक्तिविस्मितः । अपृथक्त्वप्रकारोऽस्मि वाचास्वाश्रितवद्भवन् ॥ ॥ विदुषां तत्क्रतुनयाद्धयास्यवपुषाभवन्
    । वासुदेवात्मना भूयो भवन्वैकुण्ठनायकः ॥ ॥ यथा तथैव स्वं रूपं जगन्मोहनमूर्तिमान् । द्विमूर्ती बहुमूर्तीश्च
    आत्मनश्च प्रकाशयन् ॥ ॥ युगपत्सकलं साक्षात्स्वतः कर्तुं समर्थयन् । कवीनामादिशन्नित्यं मुक्तानामादिमः
    कविः ॥ ॥ षडर्णमनुनिष्ठानां श्वेतद्वीपस्थितिं दिशन् । द्वादशाक्षरनिष्ठानां लोकं सान्तानिकं दिशन् ॥
    ॥ अष्टाक्षरैकनिष्ठानां कार्यं वैकुण्ठमर्पयन् । शरणागतिनिष्ठानां साक्षाद्वैकुण्ठमर्पयन् ॥ ॥ स्वमन्त्रराजनिष्ठानां
    स्वस्मार्दातेशयं दिशन् । श्रिया गाढोपगूढात्मा भूतधात्रीरुचिं दिशन् ॥ ॥ नीलाविभूतिव्यामुग्धो महाश्वेताश्वमस्तकः
    । त्र्यक्षस्त्रिपुरसंहारी रुद्रस्स्कन्दो विनायकः ॥ ॥ अजो विरिञ्चो द्रुहिणो व्याप्तमूर्तिरमूर्तिकः
    । असङ्गोऽनन्यधीसङ्गविहङ्गोवैरिभङ्गदः ॥ ॥ स्वामी स्वं स्वेन सन्तुप्यन् शक्रस्सर्वाधिकस्यदः । स्वयञ्ज्योतिस्स्वयंवैद्यश्शूरश्शूरकुलोद्भवः
    ॥ ॥ वासवो वसुरण्योग्निर्वासुदेवस्सुहृद्वसुः । भूतो भावी भवन्भव्यो विष्णुस्थानस्सनातनः ॥ ॥ नित्यानुभावो
    नेदीयान्दवीयान्दुर्विभावनः । सनत्कुमारस्सन्धाता सुगन्धिस्सुखदर्शनः ॥ ॥ तीर्थं तितिक्षुस्तीर्थाङ्घ्रिस्तीर्थस्वादुशुभश्शुचिः
    । तीर्थवद्दीधितिस्तिग्मतेजास्तीव्रमनामयः ॥ ॥ ईशाद्युपनिषद्वेद्यः पञ्चोपनिषदात्मकः । ईडन्तःस्थोऽपि
    दूरस्थः कल्याणतमरूपवान् ॥ ॥ प्राणानां प्राणनः पूर्णज्ञानैरपि सुदुर्ग्रहः । नाचिकेतोपासनार्च्यस्त्रिमात्रप्रणवोदितः
    ॥ ॥ भूतयोनिश्च सर्वज्ञोऽक्षरोऽक्षरपरात्परः । अकारादिपदज्ञेयव्यूहतारार्थपूरुषः ॥ ॥ मनोमयामृतो नन्दमयो
    दहररूपदृत् । न्यासविद्यावेद्यरूपः आदित्यान्तर्हिरण्मयः ॥ ॥ इदन्द्र आत्मोद्गीथादि प्रतीको पासनान्वयी
    । मधुविद्योपासनीयो गायत्रीध्यानगोचरः ॥ ॥ दिव्यकौक्षेयसज्ज्योतिः शाण्डिल्योपास्तिवीक्षितः । संवर्गविद्यावेद्यात्मा
    तत् षोडशकलं परम् ॥ ॥ उपकोसलविद्येक्ष्यः पञ्चाग्न्यात्मशरीरकः । वैश्वानरः सदखेभूमा च जगत्कर्माऽदिपूरुषः
    ॥ ॥ मूर्तामूर्तब्रह्म सर्वप्रेष्ठोऽन्यप्रियताकरः । सर्वान्तरश्चापरोक्षश्चान्तर्याम्यमृतोऽनघः ॥ ॥ अहर्नामादित्यरूपश्चाहन्नामाक्षिसंश्रितः
    । सतुर्यगायत्र्यर्थश्च यथोपास्त्याप्यसद्वपुः ॥ ॥ चन्द्रादिसायुज्यपूर्वमोक्षदन्यासगोचरः । न्यासनाश्यानभ्युपेतप्रारब्धांशो
    महादयः ॥ ॥ अवताररहस्यादिज्ञानिप्रारब्धनाशनः । स्वेन स्वार्थं परेणापि कृते न्यासे फलप्रदः ॥ ॥ असाहसोऽनपायश्रीस्सहायस्स
    श्रियै वसन् । श्रीमान्नारायणो वासुदेवोऽव्याद्विष्णुरुत्तमः ॥ ॥ ॥ ओम् ॥ इतीदं परमं गुह्यं सर्वपापप्रणाशनम्
    । वागीशनामसाहस्रं वत्स तेऽभिहितं मया ॥ ॥ य इदं शृणुयाद्भक्त्या श्रावयेद्वा स्वयं पठत् । नासौ प्राप्नोति
    दुरितमिहामुत्र च किञ्चन ॥ ॥ तदिदं प्रजपन् स्वामी विद्याधीशो हयाननः । क्षत्रियश्चेन्महारुद्रो विक्रमाक्रान्तसर्वभूः
    ॥ ॥ महोदारो महाकीर्तिर्महितो विजयी भवेत् । ऊरुजश्चेदुरुयशोधनधान्यसमृद्धिमान् ॥ ॥ अशेषभोगसम्भूतो धनाधिपसमो
    भवेत् । शृणुयादेव वृषलस्स्वयं विप्रात्सुपूजितात् ॥ ॥ महिमानमवाप्नोति महितैश्वर्यभाजनम् । श्रीमतो हयशीर्षस्य
    नाम्नां साहस्रमुत्तमम् ॥ ॥ शृण्वन्पठन्नपि नरस्सर्वान्कामानवाप्नुयात् । धर्मार्थकामसन्तानभाग्यारोग्योत्तमायुषाम्
    ॥ ॥ प्रापणे परमो हेतुः स्तवराजोऽयमद्भुतः । हयग्रीवे परा भक्तिमुद्वहन् य इमं पठेत् ॥ ॥ त्रिसन्ध्यं
    नियतश्शुद्धस्सोऽपवर्गाय कल्पते । त्रिः पठन्नामसाहस्रं प्रत्यहं वागधीशितुः ॥ ॥ महतीं कीर्तिमाप्नोति
    निस्सीमां प्रेयसीं प्रियाम् । वीर्यं बलं पतित्वं च मेधाश्रद्धावलोन्नतीः ॥ ॥ सारस्वतसमृद्धिं च भव्यान्भोग्यान्नतान्सुतान्
    । अभिरूपां वधूं साध्वीं सुहृदश्च हितैषिणः ॥ ॥ ब्रह्मविद्याप्रवचनैः कालक्षेपं च सन्ततम् । हयग्रीवपदाम्भोज
    सलिलस्यानुकूलतः ॥ ॥ लभेत निर्मलं शान्तो हंसोपासनतत्परः । श्रीमत्परमहंसस्य चित्तोल्लासनसद्विधौ ॥ ॥
    इदं तु नाम्नां साहस्रमिष्टसाधनमुत्तमम् । पापी पापाद्विमुक्तस्स्याद्रोगी रोगाद्विमुच्यते ॥ ॥ बद्धो
    बन्धाद्विमुच्येत भीते भीतिर्विमुच्यते । मुक्तो दरिद्रो दारिद्र्याद्भवेत्पूर्णमनोरथः ॥ ॥ आपन्न आपदा
    मुक्तो भवत्येव न संशयः । हंसार्चनपरो नित्यं हंसार्चनपरायणः ॥ ॥ निर्धूतकल्मषो नित्यं ब्रह्मसायुज्यमाप्नुयात्
    । ये भक्त्या परमे हंसे श्रिया मिथुनिताङ्गिते ॥ ॥ जन्मव्याधिजरानाशभयभाजो न ते जनाः । आचार्यात्तदिदं
    स्तोत्रमधिगत्य पठेन्नरः ॥ ॥ तस्येदं कल्पते सिद्ध्यै नान्यथा वत्स काश्यप । आचार्यं लक्षणैर्युक्तमन्यं
    वाऽत्मविदुत्तमम् ॥ ॥ वृत्वाचार्यं सदा भक्त्या सिद्ध्यै तदिदमश्नुयात् । स याति परमां विद्यां शकुनिब्रह्महर्षणीम्
    ॥ ॥ हयास्यनामसाहस्रस्तुतिरंहोविनाशिनी । परमो हंस एवादौ प्रणवं ब्रह्मणे दिशत् ॥ ॥ उपादिशत्ततो वेदान्
    श्रीमान हयशिरो हरिः । तेनासौ स्तवराजो हि हंसाख्यहयगोचरः ॥ ॥ विद्यासाम्राज्यसम्पत्तिमोक्षैकफलसाधनम्
    । सर्ववित्स्वात्मभावेन परमं पदमाप्नुयात् ॥ ॥ न तत्र संशयः कश्चिन्निपुणं परिपश्यति । तथापि स्वात्मनि
    प्रेमसिन्धुसन्धुक्षणक्षमः ॥ इतीदं नामसाहस्रं सङ्गृहीतं तथोत्तरम् । एवं सङ्गृह्य देवेन हयग्रीवेण पालनम्
    ॥ ॥ स्तोत्ररत्नमिदं दत्तं मह्यं तत् कथितं तव । हंसनामसहस्रस्य वैभवं परमाद्भुतम् ॥ ॥ वक्तुं यथावत्कश्शक्तो
    वर्षकोटिशतैरपि । हयास्यः परमो हंसो हरिर्नारायणोऽव्ययः ॥ ॥ कारणं शरणं मृत्युरमृतं चाखिलात्मनाम् । सत्यं
    सत्यं पुनस्सत्यं ध्येयो नारायणो हरिः ॥ ॥ समानमधिकं वेदान्न दैवं केशवात्परम् । तत्त्वं विज्ञातुकामानां
    प्रमाणैस्सर्वतोमुखैः ॥ ॥ तत्त्वं स परमो हंस एक एव जनार्दनः । इदं रहस्यं परमं महापातकनाशनम् ॥ ॥ न चाशुश्रूषवे
    वाच्यं नाभक्ताय कदाचन । नाप्यन्यदेवतायापि न वाच्यं नास्तिकाय च ॥ ॥ अधीत्यैतद्गुरुमुखादन्वहं यः पठेन्नरः
    । तद्वंश्या अपि सर्वे स्युस्सम्पत्सारस्वतोन्नताः ॥ ॥ इति हयवदनाननारविन्दान्मधुलहरीव निरर्गला गलन्ती
    । जगति दशशतीतदीयनाम्नां जयति जडानपि गीर्षु योजयन्ती ॥ ॥ ॥ इति श्रीहयग्रीवसहस्रनामस्तोत्रं सम्पूर्णम्
    ॥
