id: tripurabhairavisahasranamastotra
category: stotram
name:
  english: tripurabhairavisahasranamastotra
  devanagari: त्रिपुरभैरवीसहस्रनामस्तोत्र
content:
  english: shritripurabhairavisahasranamastotram atha shritripurabhairavisahasranamastotram mahakalabhairava
    uvaca atha vakshye maheshani devya namasahasrakam | yatprasadanmahadevi caturvargaphalallabhet ||
    1 || sarvarogaprashamanam sarvamrityuvinashanam | sarvasiddhikaram stotrannatah paratah stavah ||
    2 || natah paratara vidya tirtthannatah param smritam | yasyam sarvam samutpannayyasyamadyapi tishthati
    || 3 || kshayameshyati tatsarvam layakale maheshvari | namami tripurandevimbhairavim bhayamocinim
    | sarvasiddhikarim sakshanmahapatakanashinim || 4 || asya shritripurabhairavisahasranamastotrasya
    bhagavan rishih| panktishchandah| adya shaktih| bhagavati tripurabhairavi devata | sarvakamartthasiddhyartthe
    jape viniyogah || om tripura parameshani yogasiddhinivasini | sarvamantramayi devi sarvasiddhipravarttini
    || sarvadharamayi devi sarvasampatprada shubha | yogini yogamata ca yogasiddhipravarttini || yogidhyeya
    yogamayi yogayoganivasini | hela lila tatha krida kalarupapravarttini || kalamata kalaratrih kali
    kamalavasini | kamala kantirupa ca kamarajeshvari kriya || katuh kapatakesha ca kapata kulatakritih
    | kumuda carccika kantih kalaratripriya sada || ghorakara ghoratara dharmadharmaprada matih | ghanta
    gharggharada ghanta ghantanadapriya sada || sukshma sukshmatara sthula atisthula sada matih | atisatya
    satyavati satyasanketavasini || kshama bhima tatha'bhima bhimanadapravarttini | bhramarupa bhayahara
    bhayada bhayanashini || shmashanavasini devi shmashanalayavasini | shavasana shavahara shavadeha shivashiva
    || kanthadeshashavahara shavakankanadharini | dantura sudati satya satyasanketavasini || satyadeha
    satyahara satyavadinivasini | satyalaya satyasanga satyasangarakarini || asanga sangarahita susanga
    sangamohini | mayamatirmahamaya mahamakhavilasini || galadrudhiradhara ca mukhadvayanivasini | satyayasa
    satyasanga satyasangatikarini || asanga sanganirata susanga sangavasini | sadasatya mahasatya mamsapasha
    sumamsaka || mamsahara mamsadhara mamsashi mamsabhakshaka | raktapana raktarucira rakta raktavallabha
    || raktahara raktapriya raktanindakanashini | raktapanapriya bala raktadesha suraktika || svayambhukusumastha
    ca svayambhukusumotsuka | svayambhukusumahara svayambhunindakasana || svayambhupushpakaprita svayambhupushpasambhava
    | svayambhupushpaharadhya svayambhunindakantaka || kundagolavilasi ca kundagolasadamatih | kundagolapriyakari
    kundagolasamudbhava || shukratmika shukrakara sushukra ca sushuktika | shukrapujakapujya ca shukranindakanindaka
    || raktamalya raktapushpa raktapushpakapushpaka | raktacandanasiktangi raktacandananindaka || matsya
    matsyapriya manya matsyabhaksha mahodaya | matsyahara matsyakama matsyanindakanashini || kekarakshi
    tatha krura krurasainyavinashini | krurangi kulishangi ca cakrangi cakrasambhava || cakradeha cakrahara
    cakrakankalavasini | nimnanabhi bhitihara bhayada bhayaharika || bhayaprada bhayabhita abhima bhimanadini
    | sundari shobhana satya kshemya kshemakari tatha || sindurancitasindura sindurasadrishakritih | raktaranjitanasa
    ca sunasa nimnanasika || kharva lambodari dirggha dirgghaghona mahakuca | kutila cancala candi candanadapracandika
    || aticanda mahacanda shricandacandavegini | candali candika candashabdarupa ca cancala || campa campavati
    costa tikshna tikshnapriya kshatih | jalada jayada yoga jagadanandakarini || jagadvandya jaganmata
    jagati jagatakshama | janya jayajanetri ca jayini jayada tatha || janani ca jagaddhatri jayakhya jayarupini
    | jaganmata jaganmanya jayashrirjjayakarini || jayini jayamata ca jaya ca vijaya tatha | khadgini
    khadgarupa ca sukhadga khadgadharini || khadgarupa khadgakara khadgini khadgavallabha | khadgada khadgabhava
    ca khadgadehasamudbhava || khadga khadgadhara khela khadgini khadgamandini | shankhini capini devi
    vajrini shulini matih || balini bhindipali ca pashi ca ankushi shari | dhanushi cataki carma danti
    ca karnanaliki || musali halarupa ca tuniraganavasini | tunalaya tunahara tunasambhavarupini || sutuni
    tunakheda ca tunangi tunavallabha | nanastradharini devi nanashastrasamudbhava || laksha lakshahara
    labha sulabha labhanashini | labhahara labhakara labhini labharupini || dharitri dhanada dhanya dhanyarupa
    dhara dhanuh | dhurashabda dhuramanya dharangi dhananashini || dhanaha dhanalabha ca dhanalabhya mahadhanuh
    | ashanta shantirupa ca shvasamarganivasini || gagana ganasevya ca ganangavagavallabha | ganada ganaha
    gamya gamanagamasundari || gamyada gananashi ca gadaha gadavarddhini | sthairya ca sthairyanasha ca
    sthairyantakarani kula || datri kartri priya prema priyada priyavarddhini | priyaha priyabhavya ca
    priyapremanghripatanuh || priyaja priyabhavya ca priyastha bhavanasthita | susthira sthirarupa ca
    sthirada sthairyabarhini || cancala capala cola capalanganivasini | gauri kali tatha chinna maya manya
    harapriya || sundari tripura bhavya tripureshvaravasini | tripuranashini devi tripurapranaharini ||
    bhairavi bhairavastha ca bhairavasya priya tanuh | bhavangi bhairavakara bhairavapriyavallabha ||
    kalada kalaratrishca kama katyayani kriya | kriyada kriyaha klaibya priyapranakriya tatha || krinkari
    kamala lakshmih shaktih svaha vibhuh prabhuh | prakritih purushashcaiva purushapurushakritih || paramah
    purushashcaiva maya narayani matih | brahmi maheshvari caiva kaumari vaishnavi tatha || varahi caiva
    camunda indrani haravallabha | bharggi maheshvari krishna katyayanyapi putana || rakshasi dakini citra
    vicitra vibhrama tatha | hakini rakini bhita gamdharva gamdhavahini || kekari kotarakshi ca nirmamsalukamamsika
    | lalajjihva sujihva ca balada baladayini || candra candraprabha candri candrakamtishu tatpara | amrita
    manada pusha tushtih pushti ratirdhritih || shashini candrika kamtirjjyotsna shrih pritirangada |
    purna purnamrita kalpalatika kalpadanada || sukalpa kalpahasta ca kalpavrikshakari hanuh | kalpakhya
    kalpabhavya ca kalpanandakavandita || sucimukhi pretamukhi ulkamukhi mahasukhi | ugramukhi ca sumukhi
    kakasya vikatanana || krikalasya ca sandhyasya mukulisha ramakritih | nanamukhi ca nanasya nanarupapradharini
    || vishvarcya vishvamata ca vishvakhya vishvabhavini | surya suryaprabha shobha suryamandalasamsthita
    || suryakamtih suryakara suryakhya suryabhavana | tapini tapini dhumra maricirjjvalini rucih || surada
    bhogada vishva bodhini dharini kshama | yugada yogaha yogya yogyaha yogavarddhini || vahnimandalasamstha
    ca vahnimandalamadhyaga | vahnimandalarupa ca vahnimandalasanjnaka || vahniteja vahniraga vahnida
    vahninashini | vahnikriya vahnibhuja kala vahnau sthita sada || dhumrarcita cojjvalini tatha ca visphulingini
    | shulini ca surupa ca kapila havyavahini || nanatejasvini devi parabrahmakutumbini | jyotirbrahmamayi
    devi prabrahmasvarupini || paramatma para punya punyada punyavarddhini | punyada punyanamni ca punyagamdha
    priyatanuh || punyadeha punyakara punyanindakanindaka | punyakalakara punya supunya punyamalika ||
    punyakhela punyakeli punyanamasama pura | punyasevya punyakhelya puranapunyavallabha || purusha purushaprana
    purushatmasvarupini | purushangi ca purushi purushasya kala sada || supushpa pushpakaprana pushpaha
    pushpavallabha | pushpapriya pushpahara pushpavandakavandaka || pushpaha pushpamala ca pushpanindakanashini
    | nakshatrapranahantri ca nakshatralakshavandaka || lakshyamalya lakshahara laksha lakshasvarupini
    | nakshatrani sunakshatra nakshatraha mahodaya || mahamalya mahamanya mahati matripujita | mahamahakaniya
    ca mahakaleshvari maha || mahasya vandaniya ca mahashabdanivasini | mahashankheshvari mina matsyagamdha
    mahodari || lambodari ca lamboshthi lambanimnatanudari | lamboshthi lambanasa ca lambaghona lalatsuka
    || atilamba mahalamba sulamba lambavahini | lambarha lambashaktishca lambastha lambapurvika || caturghanta
    mahaghanta ghantanadapriya sada | vadyapriya vadyarata suvadya vadyanashini || rama rama subala ca
    ramaniyasvabhavini | suramya ramyada rambha rambhoru ramavallabha || kamapriya kamakara kamangi ramani
    ratih | ratipriya rati rati ratisevya ratipriya || surabhih surabhi shobha dikshobha'shubhanashini
    | sushobha ca mahashobha'tishobha pretatapini || lobhini ca mahalobha sulobha lobhavarddhini | lobhangi
    lobhavandya ca lobhahi lobhabhasaka || lobhapriya mahalobha lobhanindakanindaka | lobhangavasini gamdhavigamdha
    gamdhanashini || gamdhangi gamdhapushta ca sugamdha premagamdhika | durgamdha putigamdha ca vigamdha
    atigamdhika || padmantika padmavaha padmapriyapriyankari | padmanindakaninda ca padmasantoshavahana
    || raktotpalavara devi raktotpalapriya sada | raktotpalasugamdha ca raktotpalanivasini || raktotpalagrahamala
    raktotpalamanohara | raktotpalasunetra ca raktotpalasvarupadhrik || vaishnavi vishnupujya ca vaishnavanganivasini
    | vishnupujakapujya ca vaishnave samsthita tanuh || narayanasya dehastha narayanamanohara | narayanasvarupa
    ca narayanamanahsthita || narayanangasambhuta narayanapriyatanuh | nari narayaniganya narayanagrihapriya
    || harapujya harashreshtha harasya vallabha kshama | samhari haradehastha harapujanatatpara || haradehasamudbhuta
    harangavasinikuhuh | harapujakapujya ca haravandakatatpara || haradehasamutpanna harakridasadagatih
    | suganasangarahita asangasanganashini || nirjana vijana durga durgakleshanivarini | durgadehantaka
    durgarupini durgatasthika || pretakara pretapriya pretadehasamudbhava | pretangavasini preta pretadehavimarddaka
    || dakini yogini kalaratrih kalapriya sada | kalaratrihara kala krishnadeha mahatanuh || krishnangi
    kutilangi ca vajrangi vajrarupadhrik | nanadehadhara dhanya shatcakrakramavasini || muladharanivasi
    ca muladharasthita sada | vayurupa maharupa vayumarganivasini || vayuyukta vayukara vayupurakapuraka
    | vayurupadhara devi sushumnamargagamini || dehastha deharupa ca dehadhyeya sudehika | nadirupa mahirupa
    nadisthananivasini || ingala pingala caiva sushumnamadhyavasini | sadashivapriyakari mulaprakritirupadhrik
    || amriteshi mahashali sha
  devanagari: श्रीत्रिपुरभैरवीसहस्रनामस्तोत्रम् अथ श्रीत्रिपुरभैरवीसहस्रनामस्तोत्रम् महाकालभैरव उवाच अथ
    वक्ष्ये महेशानि देव्या नामसहस्रकम् । यत्प्रसादान्महादेवि चतुर्वर्गफलल्लभेत् ॥ १ ॥ सर्वरोगप्रशमनं सर्वमृत्युविनाशनम्
    । सर्वसिद्धिकरं स्तोत्रन्नातः परतः स्तवः ॥ २ ॥ नातः परतरा विद्या तीर्त्थन्नातः परं स्मृतम् । यस्यां
    सर्वं समुत्पन्नय्यस्यामद्यापि तिष्ठति ॥ ३ ॥ क्षयमेष्यति तत्सर्वं लयकाले महेश्वरि । नमामि त्रिपुरान्देवीम्भैरवीं
    भयमोचिनीम् । सर्वसिद्धिकरीं साक्षान्महापातकनाशिनीम् ॥ ४ ॥ अस्य श्रीत्रिपुरभैरवीसहस्रनामस्तोत्रस्य
    भगवान् ऋषिः। पङ्क्तिश्छन्दः। आद्या शक्तिः। भगवती त्रिपुरभैरवी देवता । सर्वकामार्त्थसिद्ध्यर्त्थे जपे
    विनियोगः ॥ ॐ त्रिपुरा परमेशानी योगसिद्धिनिवासिनी । सर्वमन्त्रमयी देवी सर्वसिद्धिप्रवर्त्तिनी ॥ सर्वाधारमयी
    देवी सर्वसम्पत्प्रदा शुभा । योगिनी योगमाता च योगसिद्धिप्रवर्त्तिनी ॥ योगिध्येया योगमयी योगयोगनिवासिनी
    । हेला लीला तथा क्रीडा कालरूपप्रवर्त्तिनी ॥ कालमाता कालरात्रिः काली कामलवासिनी । कमला कान्तिरूपा च
    कामराजेश्वरी क्रिया ॥ कटुः कपटकेशा च कपटा कुलटाकृतिः । कुमुदा चर्च्चिका कान्तिः कालरात्रिप्रिया सदा
    ॥ घोराकारा घोरतरा धर्माधर्मप्रदा मतिः । घण्टा घर्ग्घरदा घण्टा घण्टानादप्रिया सदा ॥ सूक्ष्मा सूक्ष्मतरा
    स्थूला अतिस्थूला सदा मतिः । अतिसत्या सत्यवती सत्यसङ्केतवासिनी ॥ क्षमा भीमा तथाऽभीमा भीमनादप्रवर्त्तिनी
    । भ्रमरूपा भयहरा भयदा भयनाशिनी ॥ श्मशानवासिनी देवी श्मशानालयवासिनी । शवासना शवाहारा शवदेहा शिवाशिवा
    ॥ कण्ठदेशशवाहारा शवकङ्कणधारिणी । दन्तुरा सुदती सत्या सत्यसङ्केतवासिनी ॥ सत्यदेहा सत्यहारा सत्यवादिनिवासिनी
    । सत्यालया सत्यसङ्गा सत्यसङ्गरकारिणी ॥ असङ्गा साङ्गरहिता सुसङ्गा सङ्गमोहिनी । मायामतिर्महामाया महामखविलासिनी
    ॥ गलद्रुधिरधारा च मुखद्वयनिवासिनी । सत्यायासा सत्यसङ्गा सत्यसङ्गतिकारिणी ॥ असङ्गा सङ्गनिरता सुसङ्गा
    सङ्गवासिनी । सदासत्या महासत्या मांसपाशा सुमांसका ॥ मांसाहारा मांसधरा मांसाशी मांसभक्षका । रक्तपाना
    रक्तरुचिरा रक्ता रक्तवल्लभा ॥ रक्ताहारा रक्तप्रिया रक्तनिन्दकनाशिनी । रक्तपानप्रिया बाला रक्तदेशा
    सुरक्तिका ॥ स्वयंभूकुसुमस्था च स्वयंभूकुसुमोत्सुका । स्वयंभूकुसुमाहारा स्वयंभूनिन्दकासना ॥ स्वयंभूपुष्पकप्रीता
    स्वयंभूपुष्पसम्भवा । स्वयंभूपुष्पहाराढ्या स्वयंभूनिन्दकान्तका ॥ कुण्डगोलविलासी च कुण्डगोलसदामतिः ।
    कुण्डगोलप्रियकरी कुण्डगोलसमुद्भवा ॥ शुक्रात्मिका शुक्रकरा सुशुक्रा च सुशुक्तिका । शुक्रपूजकपूज्या
    च शुक्रनिन्दकनिन्दका ॥ रक्तमाल्या रक्तपुष्पा रक्तपुष्पकपुष्पका । रक्तचन्दनसिक्ताङ्गी रक्तचन्दननिन्दका
    ॥ मत्स्या मत्स्यप्रिया मान्या मत्स्यभक्षा महोदया । मत्स्याहारा मत्स्यकामा मत्स्यनिन्दकनाशिनी ॥ केकराक्षी
    तथा क्रूरा क्रूरसैन्यविनाशिनी । क्रूराङ्गी कुलिशाङ्गी च चक्राङ्गी चक्रसम्भवा ॥ चक्रदेहा चक्रहारा चक्रकङ्कालवासिनी
    । निम्ननाभी भीतिहरा भयदा भयहारिका ॥ भयप्रदा भयभीता अभीमा भीमनादिनी । सुन्दरी शोभना सत्या क्षेम्या
    क्षेमकरी तथा ॥ सिन्दूराञ्चितसिन्दूरा सिन्दूरसदृशाकृतिः । रक्तारञ्जितनासा च सुनासा निम्ननासिका ॥ खर्वा
    लम्बोदरी दीर्ग्घा दीर्ग्घघोणा महाकुचा । कुटिला चञ्चला चण्डी चण्डनादप्रचण्डिका ॥ अतिचण्डा महाचण्डा
    श्रीचण्डाचण्डवेगिनी । चाण्डाली चण्डिका चण्डशब्दरूपा च चञ्चला ॥ चम्पा चम्पावती चोस्ता तीक्ष्णा तीक्ष्णप्रिया
    क्षतिः । जलदा जयदा योगा जगदानन्दकारिणी ॥ जगद्वन्द्या जगन्माता जगती जगतक्षमा । जन्या जयजनेत्री च जयिनी
    जयदा तथा ॥ जननी च जगद्धात्री जयाख्या जयरूपिणी । जगन्माता जगन्मान्या जयश्रीर्ज्जयकारिणी ॥ जयिनी जयमाता
    च जया च विजया तथा । खड्गिनी खड्गरूपा च सुखड्गा खड्गधारिणी ॥ खड्गरूपा खड्गकरा खड्गिनी खड्गवल्लभा ।
    खड्गदा खड्गभावा च खड्गदेहसमुद्भवा ॥ खड्गा खड्गधरा खेला खड्गिनी खड्गमण्डिनी । शङ्खिनी चापिनी देवी वज्रिणी
    शुलिनी मतिः ॥ बलिनी भिन्दिपाली च पाशी च अङ्कुशी शरी । धनुषी चटकी चर्मा दन्ती च कर्णनालिकी ॥ मुसली
    हलरूपा च तूणीरगणवासिनी । तूणालया तूणहरा तूणसम्भवरूपिणी ॥ सुतूणी तूणखेदा च तूणाङ्गी तूणवल्लभा । नानास्त्रधारिणी
    देवी नानाशस्त्रसमुद्भवा ॥ लाक्षा लक्षहरा लाभा सुलाभा लाभनाशिनी । लाभहारा लाभकरा लाभिनी लाभरूपिणी ॥
    धरित्री धनदा धान्या धन्यरूपा धरा धनुः । धुरशब्दा धुरामान्या धराङ्गी धननाशिनी ॥ धनहा धनलाभा च धनलभ्या
    महाधनुः । अशान्ता शान्तिरूपा च श्वासमार्गनिवासिनी ॥ गगणा गणसेव्या च गणाङ्गावागवल्लभा । गणदा गणहा गम्या
    गमनागमसुन्दरी ॥ गम्यदा गणनाशी च गदहा गदवर्द्धिनी । स्थैर्या च स्थैर्यनाशा च स्थैर्यान्तकरणी कुला ॥
    दात्री कर्त्री प्रिया प्रेमा प्रियदा प्रियवर्द्धिनी । प्रियहा प्रियभव्या च प्रियप्रेमाङ्घ्रिपातनुः
    ॥ प्रियजा प्रियभव्या च प्रियस्था भवनस्थिता । सुस्थिरा स्थिररूपा च स्थिरदा स्थैर्यबर्हिणी ॥ चञ्चला
    चपला चोला चपलाङ्गनिवासिनी । गौरी काली तथा छिन्ना माया मान्या हरप्रिया ॥ सुन्दरी त्रिपुरा भव्या त्रिपुरेश्वरवासिनी
    । त्रिपुरनाशिनी देवी त्रिपुरप्राणहारिणी ॥ भैरवी भैरवस्था च भैरवस्य प्रिया तनुः । भवाङ्गी भैरवाकारा
    भैरवप्रियवल्लभा ॥ कालदा कालरात्रिश्च कामा कात्यायनी क्रिया । क्रियदा क्रियहा क्लैब्या प्रियप्राणक्रिया
    तथा ॥ क्रीङ्कारी कमला लक्ष्मीः शक्तिः स्वाहा विभुः प्रभुः । प्रकृतिः पुरुषश्चैव पुरुषापुरुषाकृतिः
    ॥ परमः पुरुषश्चैव माया नारायणी मतिः । ब्राह्मी माहेश्वरी चैव कौमारी वैष्णवी तथा ॥ वाराही चैव चामुण्डा
    इन्द्राणी हरवल्लभा । भर्ग्गी माहेश्वरी कृष्णा कात्यायन्यपि पूतना ॥ राक्षसी डाकिनी चित्रा विचित्रा
    विभ्रमा तथा । हाकिनी राकिनी भीता गंधर्वा गंधवाहिनी ॥ केकरी कोटराक्षी च निर्मांसालूकमांसिका । ललज्जिह्वा
    सुजिह्वा च बालदा बालदायिनी ॥ चन्द्रा चन्द्रप्रभा चान्द्री चन्द्रकांतिषु तत्परा । अमृता मानदा पूषा
    तुष्टिः पुष्टी रतिर्धृतिः ॥ शशिनी चन्द्रिका कांतिर्ज्ज्योत्स्ना श्रीः प्रीतिरङ्गदा । पूर्णा पूर्णामृता
    कल्पलतिका कल्पदानदा ॥ सुकल्पा कल्पहस्ता च कल्पवृक्षकरी हनुः । कल्पाख्या कल्पभव्या च कल्पानन्दकवन्दिता
    ॥ सूचीमुखी प्रेतमुखी उल्कामुखी महासुखी । उग्रमुखी च सुमुखी काकास्या विकटानना ॥ कृकलास्या च सन्ध्यास्या
    मुकुलीशा रमाकृतिः । नानामुखी च नानास्या नानारूपप्रधारिणी ॥ विश्वार्च्या विश्वमाता च विश्वाख्या विश्वभाविनी
    । सूर्या सूर्यप्रभा शोभा सूर्यमण्डलसंस्थिता ॥ सूर्यकांतिः सूर्यकरा सूर्याख्या सूर्यभावना । तपिनी तापिनी
    धूम्रा मरीचिर्ज्ज्वालिनी रुचिः ॥ सुरदा भोगदा विश्वा बोधिनी धारिणी क्षमा । युगदा योगहा योग्या योग्यहा
    योगवर्द्धिनी ॥ वह्निमण्डलसंस्था च वह्निमण्डलमध्यगा । वह्निमण्डलरूपा च वह्निमण्डलसञ्ज्ञका ॥ वह्नितेजा
    वह्निरागा वह्निदा वह्निनाशिनी । वह्निक्रिया वह्निभुजा कला वह्नौ स्थिता सदा ॥ धूम्रार्चिता चोज्ज्वलिनी
    तथा च विस्फुलिङ्गिनी । शूलिनी च सुरूपा च कपिला हव्यवाहिनी ॥ नानातेजस्विनी देवी परब्रह्मकुटुम्बिनी
    । ज्योतिर्ब्रह्ममयी देवी प्रब्रह्मस्वरूपिणी ॥ परमात्मा परा पुण्या पुण्यदा पुण्यवर्द्धिनी । पुण्यदा
    पुण्यनाम्नी च पुण्यगंधा प्रियातनुः ॥ पुण्यदेहा पुण्यकरा पुण्यनिन्दकनिन्दका । पुण्यकालकरा पुण्या सुपुण्या
    पुण्यमालिका ॥ पुण्यखेला पुण्यकेली पुण्यनामसमा पुरा । पुण्यसेव्या पुण्यखेल्या पुराणपुण्यवल्लभा ॥ पुरुषा
    पुरुषप्राणा पुरुषात्मस्वरूपिणी । पुरुषाङ्गी च पुरुषी पुरुषस्य कला सदा ॥ सुपुष्पा पुष्पकप्राणा पुष्पहा
    पुष्पवल्लभा । पुष्पप्रिया पुष्पहारा पुष्पवन्दकवन्दका ॥ पुष्पहा पुष्पमाला च पुष्पनिन्दकनाशिनी । नक्षत्रप्राणहन्त्री
    च नक्षत्रालक्षवन्दका ॥ लक्ष्यमाल्या लक्षहारा लक्षा लक्षस्वरूपिणी । नक्षत्राणी सुनक्षत्रा नक्षत्राहा
    महोदया ॥ महामाल्या महामान्या महती मातृपूजिता । महामहाकनीया च महाकालेश्वरी महा ॥ महास्या वन्दनीया च
    महाशब्दनिवासिनी । महाशङ्खेश्वरी मीना मत्स्यगंधा महोदरी ॥ लम्बोदरी च लम्बोष्ठी लम्बनिम्नतनूदरी । लम्बोष्ठी
    लम्बनासा च लम्बघोणा ललत्सुका ॥ अतिलम्बा महालम्बा सुलम्बा लम्बवाहिनी । लम्बार्हा लम्बशक्तिश्च लम्बस्था
    लम्बपूर्विका ॥ चतुर्घण्टा महाघण्टा घण्टानादप्रिया सदा । वाद्यप्रिया वाद्यरता सुवाद्या वाद्यनाशिनी
    ॥ रमा रामा सुबाला च रमणीयस्वभाविनी । सुरम्या रम्यदा रम्भा रम्भोरू रामवल्लभा ॥ कामप्रिया कामकरा कामाङ्गी
    रमणी रतिः । रतिप्रिया रति रती रतिसेव्या रतिप्रिया ॥ सुरभिः सुरभी शोभा दिक्षोभाऽशुभनाशिनी । सुशोभा
    च महाशोभाऽतिशोभा प्रेततापिनी ॥ लोभिनी च महालोभा सुलोभा लोभवर्द्धिनी । लोभाङ्गी लोभवन्द्या च लोभाही
    लोभभासका ॥ लोभप्रिया महालोभा लोभनिन्दकनिन्दका । लोभाङ्गवासिनी गंधविगंधा गंधनाशिनी ॥ गंधाङ्गी गंधपुष्टा
    च सुगंधा प्रेमगंधिका । दुर्गंधा पूतिगंधा च विगंधा अतिगंधिका ॥ पद्मान्तिका पद्मवहा पद्मप्रियप्रियङ्करी
    । पद्मनिन्दकनिन्दा च पद्मसन्तोषवाहना ॥ रक्तोत्पलवरा देवी रक्तोत्पलप्रिया सदा । रक्तोत्पलसुगंधा च रक्तोत्पलनिवासिनी
    ॥ रक्तोत्पलग्रहामाला रक्तोत्पलमनोहरा । रक्तोत्पलसुनेत्रा च रक्तोत्पलस्वरूपधृक् ॥ वैष्णवी विष्णुपूज्या
    च वैष्णवाङ्गनिवासिनी । विष्णुपूजकपूज्या च वैष्णवे संस्थिता तनुः ॥ नारायणस्य देहस्था नारायणमनोहरा ।
    नारायणस्वरूपा च नारायणमनःस्थिता ॥ नारायणाङ्गसम्भूता नारायणप्रियातनुः । नारी नारायणीगण्या नारायणगृहप्रिया
    ॥ हरपूज्या हरश्रेष्ठा हरस्य वल्लभा क्षमा । संहारी हरदेहस्था हरपूजनतत्परा ॥ हरदेहसमुद्भूता हराङ्गवासिनीकुहूः
    । हरपूजकपूज्या च हरवन्दकतत्परा ॥ हरदेहसमुत्पन्ना हरक्रीडासदागतिः । सुगणासङ्गरहिता असङ्गासङ्गनाशिनी
    ॥ निर्जना विजना दुर्गा दुर्गक्लेशनिवारिणी । दुर्गदेहान्तका दुर्गारूपिणी दुर्गतस्थिका ॥ प्रेतकरा प्रेतप्रिया
    प्रेतदेहसमुद्भवा । प्रेताङ्गवासिनी प्रेता प्रेतदेहविमर्द्दका ॥ डाकिनी योगिनी कालरात्रिः कालप्रिया
    सदा । कालरात्रिहरा काला कृष्णदेहा महातनुः ॥ कृष्णाङ्गी कुटिलाङ्गी च वज्राङ्गी वज्ररूपधृक् । नानादेहधरा
    धन्या षट्चक्रक्रमवासिनी ॥ मूलाधारनिवासी च मूलाधारस्थिता सदा । वायुरूपा महारूपा वायुमार्गनिवासिनी ॥
    वायुयुक्ता वायुकरा वायुपूरकपूरका । वायुरूपधरा देवी सुषुम्नामार्गगामिनी ॥ देहस्था देहरूपा च देहध्येया
    सुदेहिका । नाडीरूपा महीरूपा नाडीस्थाननिवासिनी ॥ इङ्गला पिङ्गला चैव सुषुम्नामध्यवासिनी । सदाशिवप्रियकरी
    मूलप्रकृतिरूपधृक् ॥ अमृतेशी महाशाली श
