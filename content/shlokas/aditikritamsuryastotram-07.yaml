id: aditikritamsuryastotram-07
category: stotram
name:
  english: aditikritamsuryastotram 07
  devanagari: अदितिकृतंसूर्यस्तोत्रम् ०७
content:
  english: aditikritam suryastotram 7 aditiruvaca | jayasva divyambujakoshacaura jayasva samsarataroh
    kuthara | jayasva papendhanajatavedastamaughasamrodha namo namaste || 33|| namo'stu te bhaskara divyamurte
    trailokyalakshmitilakaya te namah | tvam karanam sarvacaracarasya natho'si mam palaya vishvamurte
    || 34|| tvaya jagannatha jaganmayena nathena shakro nijarajyahanim | avaptavan shatruparabhavam ca
    tato bhavantam sharanam prapanna || 35|| iti vamanapurane shatsaptatitamadhyayantargatam aditikritam
    suryastotram samaptam | vamanapurana | adhyaya 76
  devanagari: अदितिकृतं सूर्यस्तोत्रम् ७ अदितिरुवाच । जयस्व दिव्याम्बुजकोशचौर जयस्व संसारतरोः कुठार ।
    जयस्व पापेन्धनजातवेदस्तमौघसंरोध नमो नमस्ते ॥ ३३॥ नमोऽस्तु ते भास्कर दिव्यमूर्ते त्रैलोक्यलक्ष्मीतिलकाय
    ते नमः । त्वं कारणं सर्वचराचरस्य नाथोऽसि मां पालय विश्वमूर्ते ॥ ३४॥ त्वया जगन्नाथ जगन्मयेन नाथेन शक्रो
    निजराज्यहानिम् । अवाप्तवान् शत्रुपराभवं च ततो भवन्तं शरणं प्रपन्ना ॥ ३५॥ इति वामनपुराणे षट्सप्ततितमाध्यायान्तर्गतं
    अदितिकृतं सूर्यस्तोत्रं समाप्तम् । वामनपुराण । अध्याय ७६
meaning: {}
