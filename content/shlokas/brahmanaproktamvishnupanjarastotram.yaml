id: brahmanaproktamvishnupanjarastotram
category: stotram
name:
  english: brahmanaproktamvishnupanjarastotram
  devanagari: ब्राह्मणप्रोक्तंविष्णुपन्जरस्तोत्रम्
content:
  english: brahmanaproktam vishnupanjarastotram brahmana uvaca | vishnuh pracyam stitashcakri vishnurdakshinato
    gadi | praticyam sharngadhrigvishnurvishnuh khadgi mamottare || 9|| hrishikesho vikoneshu tacchidreshu
    janardanah | krodarupi harirbhumau narasimho'mbare mama || 10|| kshurantamamalam cakram bhramatvetatsudarshanam
    | asyamshumala dushprekshya hantum pretanishacaran || 11|| gada ceyam sahasrarcirudvaman pavako yatha
    | rakshobhutapishacanam dakininam ca shatani || 12|| sharngavisphurjitam caiva vasudevasya madripun
    | tiryanmanushyakushmandapretadin hantvasheshatah || 13|| khadgadharajvalajjyotsna nirdhuta ye mamahitah
    | te yantu saumyatam sadyo garudeneva pannagah || 14|| ye kushmandastatha yaksha daitya ye ca nishacarah
    | preta vinayakah krura manushya jrimbhakah khagah || 15|| simhadayo ye pashavo dandashukashca pannagah
    | sarve bhavantu me saumya vishnucakraravahatah || 16|| cittavrittihara ye ca ye janah smritiharakah
    | balaujasam ca hartarashchayavidhvamsakashca ye || 17|| ye copabhogahartaro ye ca lakshananashakah
    | kushmandaste pranashyantu vishnucakraravahatah || 18|| buddhisvasthyam manahsvasthyam svasthyamaindriyakam
    tatha | mamastu devadevasya vasudevasya kirtanat || 19|| prishthe purastadatha dakshinottare vikonatashcastu
    janardano harih | tamidyamishanamanantamacyutam janardanam pranipatito na sidati || 20|| yatha param
    brahma haristatha param jagatsvarupashca sa eva keshavah | ritena tenacyutanamakirtanatpranashametu
    trividham mamashubham || 21|| ityasavatmarakshartham kritva vai vishnupanjaram | samsthito'savapi
    bali rakshasah samupadravat || 22|| iti vamanapurane shadashititamadhyayantargatam brahmanaproktam
    vishnupanjarastotram samaptam | vamanapurana | adhyaya 86
  devanagari: ब्राह्मणप्रोक्तं विष्णुपञ्जरस्तोत्रम् ब्राह्मण उवाच । विष्णुः प्राच्यां स्तितश्चक्री विष्णुर्दक्षिणतो
    गदी । प्रतीच्यां शार्ङ्गधृग्विष्णुर्विष्णुः खड्गी ममोत्तरे ॥ ९॥ हृषीकेशो विकोणेषु तच्छिद्रेषु जनार्दनः
    । क्रोडरूपी हरिर्भूमौ नारसिंहोऽम्बरे मम ॥ १०॥ क्षुरान्तममलं चक्रं भ्रमत्वेतत्सुदर्शनम् । अस्यांशुमाला
    दुष्प्रेक्ष्या हन्तुं प्रेतनिशाचरान् ॥ ११॥ गदा चेयं सहस्रार्चिरुद्वमन् पावको यथा । रक्षोभूतपिशाचानां
    डाकिनीनां च शातनी ॥ १२॥ शार्ङ्गविस्फूर्जितं चैव वासुदेवस्य मद्रिपून् । तिर्यङ्मनुष्यकूष्माण्डप्रेतादीन्
    हन्त्वशेषतः ॥ १३॥ खड्गधाराज्वलज्ज्योत्स्ना निर्धूता ये ममाहिताः । ते यान्तु सौम्यतां सद्यो गरुडेनेव
    पन्नगाः ॥ १४॥ ये कूष्माण्डास्तथा यक्षा दैत्या ये च निशाचराः । प्रेता विनायकाः क्रूरा मनुष्या जृम्भकाः
    खगाः ॥ १५॥ सिंहादयो ये पशवो दन्दशूकाश्च पन्नगाः । सर्वे भवन्तु मे सौम्या विष्णुचक्ररवाहताः ॥ १६॥ चित्तवृत्तिहरा
    ये च ये जनाः स्मृतिहारकाः । बलौजसां च हर्तारश्छायाविध्वंसकाश्च ये ॥ १७॥ ये चोपभोगहर्तारो ये च लक्षणनाशकाः
    । कूष्माण्डास्ते प्रणश्यन्तु विष्णुचक्ररवाहताः ॥ १८॥ बुद्धिस्वास्थ्यं मनःस्वास्थ्यं स्वास्थ्यमैन्द्रियकं
    तथा । ममास्तु देवदेवस्य वासुदेवस्य कीर्तनात् ॥ १९॥ पृष्ठे पुरस्तादथ दक्षिणोत्तरे विकोणतश्चास्तु जनार्दनो
    हरिः । तमीड्यमीशानमनन्तमच्युतं जनार्दनं प्रणिपतितो न सीदति ॥ २०॥ यथा परं ब्रह्म हरिस्तथा परं जगत्स्वरूपश्च
    स एव केशवः । ऋतेन तेनाच्युतनामकीर्तनात्प्रणाशमेतु त्रिविधं ममाशुभम् ॥ २१॥ इत्यसावात्मरक्षार्थं कृत्वा
    वै विष्णुपञ्जरम् । संस्थितोऽसावपि बली राक्षसः समुपाद्रवत् ॥ २२॥ इति वामनपुराणे षडशीतितमाध्यायान्तर्गतं
    ब्राह्मणप्रोक्तं विष्णुपञ्जरस्तोत्रं समाप्तम् । वामनपुराण । अध्याय ८६
