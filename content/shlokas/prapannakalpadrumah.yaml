id: prapannakalpadrumah
category: shataka
name:
  english: prapannakalpadrumah
  devanagari: प्रपन्नकल्पद्रुमः
content:
  english: bhaya ke agamana ko hastamudra se dura karate hue bhagavan shri ramaji sarvada vijayi rahem
    || 100|| stotram pavitram raghupungavasya premna'sakridvapi sakritpathedyah saddhama dhamadhigatah
    sa tasya punarna samsarapatham prayati || 101|| isa pavitra strota ko yadi koi eka bara bhi prema
    se par̤ha lega to vaha paramapavitra tejavale bhagavaddhama mem prapta hokara punah samsara mem na
    ayega || 101|| || iti shri paramahamsaparivrajaka jagadaguru ramanandacaryaih svami shribhagavadacarya
    maharajaih 1984 tame vikramasamvatsare pranitah prapannakalpadrumah samaptah ||
  devanagari: भय के आगमन को हस्तमुद्रा से दूर करते हुए भगवान् श्री रामजी सर्वदा विजयी रहें ॥ १००॥ स्तोत्रं
    पवित्रं रघुपुङ्गवस्य प्रेम्णाऽसकृद्वापि सकृत्पठेद्यः सद्धाम धामाधिगतः स तस्य पुनर्न संसारपथं प्रयाति
    ॥ १०१॥ इस पवित्र स्त्रोत को यदि कोई एक बार भी प्रेम से पढ़ लेगा तो वह परमपवित्र तेजवाले भगवद्धाम में
    प्राप्त होकर पुनः संसार में न आयेगा ॥ १०१॥ ॥ इति श्री परमहंसपरिव्राजक जगदगुरु रामानन्दाचार्यैः स्वामि
    श्रीभगवदाचार्य महाराजैः १९८४ तमे विक्रमसम्वत्सरे प्रणीतः प्रपन्नकल्पद्रुमः समाप्तः ॥
