id: mahakalabhairavakavacam-2
category: kavacha
name:
  english: mahakalabhairavakavacam 2
  devanagari: महाकालभैरवकवचम् २
content:
  english: udijimutasankasham mahakalam trilocanam | kapalakhatvangadharam varabhayakaram sada || shulatomarahastancabhayadam
    sadhakeshtadam | prasa pattisa hastam vai mahakalam smaramyaham || kurcayugmam shirah patu mahakalomamavatu
    | mahakalaprasidetidvayam mevyallalatakam || 1|| mayadvayam bhruvaupatu sadashivomamavatu | thadvayammevatannetre
    nilakanthovatatsada || 2|| sarvamantram shrutimevyatkapardi sarvatovatu | taram me patu gandau ca
    trilocanovatanmama || 3|| mayayutashcame nasam devovyat tripurantakah | lakshmi mukhantathaushtau
    me payadandhakanashakrit || 4|| vagbijam mohanam payad hatakeshvarabhairavah | hrijjabijam kandharantu
    payatkalantakah sada || 5|| shaktibijam galampatu devah kamantako mama | mahakalabhairavayetyetatskandau
    mamavatu || 6|| prishthasthale sadavyanme bhutanayaka bhairavah | shmashanasthoh patu nakhanmamanguli
    samanvitam || 7|| stanau digambarah patu vakshah pashupatirmama | kukshim patu mahakalo shuli prishtham
    mamavatu || 8|| shishnamme shankarah patu guhyam guhyeshavallabhah | jvalatpavakamadhyasthah katim
    patu sada mama || 9|| urumevyadbhasmashayi jagarthakashca januni | janghemevyatkalarudro gulphau jatadharovatu
    || 10|| padaumevyanmahatejah shulakhadgadharovyayah | padadi murdhaparyantam patu kalagnibhairavah
    || 11|| shirasah padaparyantam sadyojato mamavatu | rakshahinam namahinam vapuh patu sadashivah ||
    12|| purvevalavikarano dakshine kalashasanah | pashcime parvatinathoshcuttaremam manonmanah || 13||
    aishanyamishvarah payadagneyamagnilocanah | nairrityam shambhuravyanmam vayavyam vayuvahanah || 14||
    urdhvam balapramathanah patale parameshvarah | dashadikshu sada patu mahakalotibhishanah || 15|| rane
    rajakule dyute vishame pranasamshaye | payatkalo maharudro devadevo maheshvarah || 16|| prabhate patumam
    brahma madhyahne bhairavovatu | sayam sarveshvarah patu nishayam nityacetanah || 17|| ardharatre mahadevo
    nishantesu mahodayah | sarvada sarvatha patu mahakalah mahaprabhuh || 18|| itidam kavacam divyam trishu
    lokeshu durlabham | punyam punyapradam divyam mahakaladhidaivatam || 19|| sarvamantramayam guhyam
    sarvatantreshu gopitam | sarvasaramayam devi sarvakamaphalapradam || 20|| ya imam pathenmantri kavacam
    vacayettatha | tasya haste mahadevi tryambakasyashtasiddhayah || 21|| rane dhritvacaredyuddham hatvashatrunjayam
    labhet | dhanam hritva jayam devi saprapsyati sukhi punah || 22|| mahabhaye maharoge mahamari bhaye
    tatha | durbhikshe shatru sanghate pathetkavacamadarat || 23|| sarvam tatprashamayati mahakalaprasadatah
    | putrarthi labhate putratvidya mapnoti sadhakah || 24|| dhanamputramsukhamlakshmimarogyam sarvasampadah
    | prapnoti sadhakah sadyodevi satyam na samshayah || 25|| itidam kavacam divyam mahakalasya sarvada
    | gopyam siddhipradam guhyam gopaniya svayonivat || 26|| ashantaya ca kruraya shathaya dikshitaya
    ca | nihshraddhayapi dhurtaya na datavyam kadacana || 27|| nadadyatparashishyebhyoh putrebhyo'pi visheshatah
    | rahasyam mama sarvasvam gopyam guptataram kalau || 28|| skandasyapi mayanoktam tavoktam bhavanavashat
    | durjanadrakshaniya ca pathaniya maharnisham || 29|| shrotavyam sadhakamukhadrakshaniyam svaputravat
    | ityesha patalo divyo varnitokhilasiddhikrit || 30|| palaniyah prayatnena rakshitavyah sadashive
    | samsararnava magnanamupayah paramah smritah || 31|| bhaktihina aputraya na datavyam kadacana | iti
    shrivishvanathasaroddharetantre uttarakhande mantrapradipikayam shrikameshvararahasye shadamnayanirnaye
    shrimahakalapancange shrimahakalabhairava mantragarbhakavacam samaptam ||
  devanagari: उदिजीमूतसङ्काशं महाकालं त्रिलोचनम् । कपालखट्वाङ्गधरं वराभयकरं सदा ॥ शूलतोमरहस्तञ्चाभयदं
    साधकेष्टदम् । प्रास पट्टिस हस्तं वै महाकालं स्मराम्यहम् ॥ कूर्चयुग्मं शिरः पातु महाकालोममावतु । महाकालप्रसीदेतिद्वयं
    मेव्याल्ललाटकम् ॥ १॥ मायाद्वयं भ्रुवौपातु सदाशिवोममावतु । ठद्वयम्मेवतान्नेत्रे नीलकण्ठोवतात्सदा ॥
    २॥ सर्वमन्त्रं श्रुतीमेव्यात्कपर्दी सर्वतोवतु । तारं मे पातु गण्डौ च त्रिलोचनोवतान्मम ॥ ३॥ मायायुतश्चमे
    नासां देवोव्यात् त्रिपुरान्तकः । लक्ष्मी मुखन्तथौष्टौ मे पायादन्धकनाशकृत् ॥ ४॥ वाग्बीजं मोहनं पायाद्
    हाटकेश्वरभैरवः । हृज्जबीजं कन्धरन्तु पायात्कालान्तकः सदा ॥ ५॥ शक्तिबीजं गलम्पातु देवः कामान्तको मम
    । महाकालभैरवायेत्येतत्स्कन्दौ ममावतु ॥ ६॥ पृष्ठस्थले सदाव्यान्मे भूतनायक भैरवः । श्मशानस्थोः पातु
    नखान्ममाङ्गुलि समन्विताम् ॥ ७॥ स्तनौ दिगम्बरः पातु वक्षः पशुपतिर्मम । कुक्षिं पातु महाकालो शूली पृष्ठं
    ममावतु ॥ ८॥ शिश्नम्मे शङ्करः पातु गुह्यं गुह्येशवल्लभः । ज्वलत्पावकमध्यस्थः कटिं पातु सदा मम ॥ ९॥
    ऊरूमेव्याद्भस्मशायी जागर्थकश्च जानुनि । जङ्घेमेव्यात्कालरुद्रो गुल्फौ जटाधरोवतु ॥ १०॥ पादौमेव्यान्महातेजः
    शूलखड्गधरोव्ययः । पादादि मूर्धपर्यन्तं पातु कालाग्निभैरवः ॥ ११॥ शिरसः पादपर्यन्तं सद्योजातो ममावतु
    । रक्षाहीनं नामहीनं वपुः पातु सदाशिवः ॥ १२॥ पूर्वेवलविकरणो दक्षिणे कालशासनः । पश्चिमे पार्वतीनाथोश्चुत्तरेमां
    मनोन्मनः ॥ १३॥ ऐशान्यामीश्वरः पायादाग्नेयामग्निलोचनः । नैरृत्यां शम्भुरव्यान्मां वायव्यां वायुवाहनः
    ॥ १४॥ ऊर्ध्वं बलप्रमथनः पाताले परमेश्वरः । दशदिक्षु सदा पातु महाकालोतिभीषणः ॥ १५॥ रणे राजकुले द्यूते
    विषमे प्राणसंशये । पायात्कालो महारुद्रो देवदेवो महेश्वरः ॥ १६॥ प्रभाते पातुमां ब्रह्मा मध्याह्ने भैरवोवतु
    । सायं सर्वेश्वरः पातु निशायां नित्यचेतनः ॥ १७॥ अर्धरात्रे महादेवो निशान्तेसु महोदयः । सर्वदा सर्वथा
    पातु महाकालः महाप्रभुः ॥ १८॥ इतीदं कवचं दिव्यं त्रिषु लोकेषु दुर्लभम् । पुण्यं पुण्यप्रदं दिव्यं महाकालाधिदैवतम्
    ॥ १९॥ सर्वमन्त्रमयं गुह्यं सर्वतन्त्रेषु गोपितम् । सर्वसारमयं देवि सर्वकामफलप्रदम् ॥ २०॥ य इमं पठेन्मन्त्री
    कवचं वाचयेत्तथा । तस्य हस्ते महादेवि त्र्यम्बकस्याष्टसिद्धयः ॥ २१॥ रणे धृत्वाचरेद्युद्धं हत्वाशत्रुञ्जयं
    लभेत् । धनं हृत्वा जयं देवि सप्राप्स्यति सुखी पुनः ॥ २२॥ महाभये महारोगे महामारी भये तथा । दुर्भिक्षे
    शत्रु सङ्घाते पठेत्कवचमादरात् ॥ २३॥ सर्वं तत्प्रशमयाति महाकालप्रसादतः । पुत्रार्थी लभते पुत्रात्विद्या
    माप्नोति साधकः ॥ २४॥ धनम्पुत्रांसुखंलक्ष्मीमारोग्यं सर्वसम्पदः । प्राप्नोति साधकः सद्योदेवि सत्यं
    न संशयः ॥ २५॥ इतीदं कवचं दिव्यं महाकालस्य सर्वदा । गोप्यं सिद्धिप्रदं गुह्यं गोपनीय स्वयोनिवत् ॥ २६॥
    अशान्ताय च क्रूराय शठाया दीक्षिताय च । निःश्रद्धायापि धूर्ताय न दातव्यं कदाचन ॥ २७॥ नदद्यात्परशिष्येभ्योः
    पुत्रेभ्योऽपि विशेषतः । रहस्यं मम सर्वस्वं गोप्यं गुप्ततरं कलौ ॥ २८॥ स्कन्दस्यापि मयानोक्तं तवोक्तं
    भावनावशात् । दुर्जनाद्रक्षणीय च पठनीय महर्निशम् ॥ २९॥ श्रोतव्यं साधकमुखाद्रक्षणीयं स्वपुत्रवत् । इत्येष
    पटलो दिव्यो वर्णितोखिलसिद्धिकृत् ॥ ३०॥ पालनीयः प्रयत्नेन रक्षितव्यः सदाशिवे । संसारार्णव मग्नानामुपायः
    परमः स्मृतः ॥ ३१॥ भक्तिहीना अपुत्राय न दातव्यं कदाचन । इति श्रीविश्वनाथसारोद्धारेतन्त्रे उत्तरखण्डे
    मन्त्रप्रदीपिकायां श्रीकामेश्वररहस्ये षडाम्नायनिर्णये श्रीमहाकालपङ्चाङ्गे श्रीमहाकालभैरव मन्त्रगर्भकवचं
    समाप्तम् ॥
