id: udakashanti
category: veda
name:
  english: udakashanti
  devanagari: उदकशान्ति
content:
  english: hah prataryagne prataranna ayuh || || sarpahutih || samici namasi pracidiktasyaste'gniradhipatirasito
    rakshita yashcadipatiryashca gopta tabhyam namastau no mridayatam te yam dvishmo yashca no dveshti
    tam vam jambhe dadhami | ojasvini namasi dakshina diktasyasta indro'dhipatih pridaku rakshita yashcadipatiryashca
    gopta tabhyam namastau no mridayatam te yam dvishmo yashca no dveshti tam vam jambhe dadhami | praci
    namasi pratici diktasyaste somo'dhipatih svajo rakshita yashcadipatiryashca gopta tabhyam namastau
    no mridayatam te yam dvishmo yashca no dveshti tam vam jambhe dadhami | avasthava namasyudici diktasyaste
    varuno'dhipatistarashca raji rakshita yashcadipatiryashca gopta tabhyam namastau no mridayatam te
    yam dvishmo yashca no dveshti tam vam jambhe dadhami | adhipatni namasi brihati diktasyaste brihaspatiradhipatih
    shvitro rakshita yashcadipatiryashca gopta tabhyam namastau no mridayatam te yam dvishmo yashca no
    dveshti tam vam jambhe dadhami | vashini namasiyam diktasyaste yamo'dhipatih kalmashagrivo rakshita
    yashcadipatiryashca gopta tabhyam namastau no mridayatam te yam dvishmo yashca no dveshti tam vam
    jambhe dadhami || || gandharvahutih || hetayo namastha tesham vah puro griha agnirva ishavah salilo
    vatanamam tebhyo vo namasteno mridayata te yam dvishmo yashca no dveshti tam vo jambhe dadhami | nilimpa
    namastha tesham vo dakshina griha pitaro vaishavah sagaro vatanamam tebhyo vo namasteno mridayata
    te yam dvishmo yashca no dveshti tam vo jambhe dadhami | vajrino namastha tesham vah pashcadgriha
    svapnova ishavo gahvaro vatanamam tebhyo vo namasteno mridayata te yam dvishmo yashca no dveshti tam
    vo jambhe dadhami | avasthavano namastha tesham va uttaradgriha apova ishavah samudro vatanamam tebhyo
    vo namasteno mridayata te yam dvishmo yashca no dveshti tam vo jambhe dadhami | adhipatayo namastha
    tesham va upari griha varsham va ishavo'vasvan vatanamam tebhyo vo namasteno mridayata te yam dvishmo
    yashca no dveshti tam vo jambhe dadhami | kravya namastha parthivatesham va iha griha annam va ishavo'nimisho
    vatanamam tebhyo vo namasteno mridayata te yam dvishmo yashca no dveshti tam vo jambhe dadhami | ||
    ajyani || shatayudhaya shataviryaya shatotaye'bhimatishahe | shatam yo nah sharado ajitanindro neshadati
    duritani vishva|| ye catvarah pathayo devayana amtara dyavaprithivi viyanti | tesham yo ajyani majiti
    mahavattasmai no devah paridatteha sarve|| grishmo hemanta utano vasantah sharadvarshah suvitanno
    astu | teshamrituna
  devanagari: हः प्रातार्यग्ने प्रतरान्न आयुः ॥ ॥ सर्पाहुतीः ॥ समीची नामासि प्राचीदिक्तस्यास्तेऽग्निरधिपतिरसितो
    रक्षिता यश्चादिपतिर्यश्च गोप्ता ताभ्यां नमस्तौ नो मृडयतां ते यं द्विष्मो यश्च नो द्वेष्टि तं वां जंभे
    दधामि । ओजस्विनी नामासि दक्षिणा दिक्तस्यास्त इन्द्रोऽधिपतिः पृदाकू रक्षिता यश्चादिपतिर्यश्च गोप्ता
    ताभ्यां नमस्तौ नो मृडयतां ते यं द्विष्मो यश्च नो द्वेष्टि तं वां जंभे दधामि । प्राची नामासि प्रतीची
    दिक्तस्यास्ते सोमोऽधिपतिः स्वजो रक्षिता यश्चादिपतिर्यश्च गोप्ता ताभ्यां नमस्तौ नो मृडयतां ते यं द्विष्मो
    यश्च नो द्वेष्टि तं वां जंभे दधामि । अवस्थावा नामास्युदीची दिक्तस्यास्ते वरुणोऽधिपतिस्तरश्च राजी रक्षिता
    यश्चादिपतिर्यश्च गोप्ता ताभ्यां नमस्तौ नो मृडयतां ते यं द्विष्मो यश्च नो द्वेष्टि तं वां जंभे दधामि
    । अधिपत्नी नामासि बृहती दिक्तस्यास्ते बृहस्पतिरधिपतिः श्वित्रो रक्षिता यश्चादिपतिर्यश्च गोप्ता ताभ्यां
    नमस्तौ नो मृडयतां ते यं द्विष्मो यश्च नो द्वेष्टि तं वां जंभे दधामि । वशिनी नामासीयं दिक्तस्यास्ते
    यमोऽधिपतिः कल्माषग्रीवो रक्षिता यश्चादिपतिर्यश्च गोप्ता ताभ्यां नमस्तौ नो मृडयतां ते यं द्विष्मो यश्च
    नो द्वेष्टि तं वां जंभे दधामि ॥ ॥ गन्धर्वाहुतीः ॥ हेतयो नामस्थ तेषां वः पुरो गृहा अग्निर्व इषवः सलिलो
    वातनामं तेभ्यो वो नमस्तेनो मृडयत ते यं द्विष्मो यश्च नो द्वेष्टि तं वो जंभे दधमि । निलिम्पा नामस्थ
    तेषां वो दक्षिणा गृहा पितरो वैषवः सगरो वातनामं तेभ्यो वो नमस्तेनो मृडयत ते यं द्विष्मो यश्च नो द्वेष्टि
    तं वो जंभे दधमि । वज्रिणो नामस्थ तेषां वः पश्चाद्गृहा स्वप्नोव इषवो गह्वरो वातनामं तेभ्यो वो नमस्तेनो
    मृडयत ते यं द्विष्मो यश्च नो द्वेष्टि तं वो जंभे दधमि । अवस्थावानो नामस्थ तेषां व उत्तरद्गृहा आपोव
    इषवः समुद्रो वातनामं तेभ्यो वो नमस्तेनो मृडयत ते यं द्विष्मो यश्च नो द्वेष्टि तं वो जंभे दधमि । अधिपतयो
    नामस्थ तेषां व उपरि गृहा वर्षं व इषवोऽवस्वान् वातनामं तेभ्यो वो नमस्तेनो मृडयत ते यं द्विष्मो यश्च
    नो द्वेष्टि तं वो जंभे दधमि । क्रव्या नामस्थ पार्थिवातेषां व इह गृहा अन्नं व इषवोऽनिमिषो वातनामं तेभ्यो
    वो नमस्तेनो मृडयत ते यं द्विष्मो यश्च नो द्वेष्टि तं वो जंभे दधमि । ॥ अज्यानि ॥ शतायुधाय शतवीर्याय
    शतोतयेऽभिमातिषाहे । शतं यो नः शरदो अजीतानिन्द्रो नेषदति दुरितानि विश्वा॥ ये चत्वारः पथयो देवयाना अंतरा
    द्यावापृथिवी वियन्ति । तेषां यो अज्यानि मजीति माहवात्तस्मै नो देवाः परिदत्तेह सर्वे॥ ग्रीष्मो हेमन्त
    उतनो वसन्तः शरद्वर्षाः सुवितन्नो अस्तु । तेषामृतूना
