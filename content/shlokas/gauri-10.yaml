id: gauri-10
category: stotram
name:
  english: gauri 10
  devanagari: गौरि १०
content:
  english: gauridashakam athava gauri stutih || shrih || lilalabdhasthapitaluptakhilalokam lokatitairyogibhirantashciramrigyam
    | baladityashrenisamanadyutipunjam gaurimamambamamburuhakshimahamide || 1|| pratyaharadhyanasamadhisthitibhajam
    nityam citte nirvritikashtham kalayantim | satyajnananandamayim tam tanurupam gaurimambamamburuhakshimahamide
    || 2|| candrapidananditamandasmitavaktram candrapidalamkritanilalakabharam | indropendradyarcitapadambujayugmam
    gaurimambamamburuhakshimahamide || 3|| adikshantamaksharamurtya vilasantim bhute bhute bhutakadambaprasavitrim
    | shabdabrahmanandamayim tam tatidabham gaurimambamamburuhakshimahamide || 4|| muladharadutthitavithya
    vidhirandhram sauram candram vyapya viharajvalitangim | yeyam sukshmatsukshmatanustam sukharupam gaurimambamamburuhakshimahamide
    || 5|| nityah shuddho nishkala eko jagadishah sakshi yasyah sargavidhau samharane ca | vishvatranakridanalolam
    shivapatnim gaurimambamamburuhakshimahamide || 6|| yasyah kukshau linamakhandam jagadandam bhuyo bhuyah
    pradurabhudutthitameva | patya sardham tam rajatadrau viharantim gaurimambamamburuhakshimahamide ||
    7|| yasyamotam protamashesham manimala
  devanagari: गौरीदशकम् अथवा गौरी स्तुतिः ॥ श्रीः ॥ लीलालब्धस्थापितलुप्ताखिललोकां लोकातीतैर्योगिभिरन्तश्चिरमृग्याम्
    । बालादित्यश्रेणिसमानद्युतिपुञ्जां गौरीममम्बामम्बुरुहाक्षीमहमीडे ॥ १॥ प्रत्याहारध्यानसमाधिस्थितिभाजां
    नित्यं चित्ते निर्वृतिकाष्ठां कलयन्तीम् । सत्यज्ञानानन्दमयीं तां तनुरूपां गौरीमम्बामम्बुरुहाक्षीमहमीडे
    ॥ २॥ चन्द्रापीडानन्दितमन्दस्मितवक्त्रां चन्द्रापीडालंकृतनीलालकभाराम् । इन्द्रोपेन्द्राद्यर्चितपादाम्बुजयुग्मां
    गौरीमम्बामम्बुरुहाक्षीमहमीडे ॥ ३॥ आदिक्षान्तामक्षरमूर्त्या विलसन्तीं भूते भूते भूतकदम्बप्रसवित्रीम्
    । शब्दब्रह्मानन्दमयीं तां तटिदाभां गौरीमम्बामम्बुरुहाक्षीमहमीडे ॥ ४॥ मूलाधारादुत्थितवीथ्या विधिरन्ध्रं
    सौरं चान्द्रं व्याप्य विहारज्वलिताङ्गीम् । येयं सूक्ष्मात्सूक्ष्मतनुस्तां सुखरूपां गौरीमम्बामम्बुरुहाक्षीमहमीडे
    ॥ ५॥ नित्यः शुद्धो निष्कल एको जगदीशः साक्षी यस्याः सर्गविधौ संहरणे च । विश्वत्राणक्रीडनलोलां शिवपत्नीं
    गौरीमम्बामम्बुरुहाक्षीमहमीडे ॥ ६॥ यस्याः कुक्षौ लीनमखण्डं जगदण्डं भूयो भूयः प्रादुरभूदुत्थितमेव ।
    पत्या सार्धं तां रजताद्रौ विहरन्तीं गौरीमम्बामम्बुरुहाक्षीमहमीडे ॥ ७॥ यस्यामोतं प्रोतमशेषं मणिमाला
