id: durgasahasranamastotramrudrayamala
category: stotram
name:
  english: durgasahasranamastotramrudrayamala
  devanagari: दुर्गासहस्रनामस्तोत्रम्रुद्रयामल
content:
  english: rurusharevarevatiramani rama || 44|| riddhihasta siddhihasta annapurna maheshvari | annarupa
    jagajjyotih samastasuraghatini || 45|| garudigaganalamba lambamanakacapriya | pitambara pitapushpa
    putana gitavallabha || 46|| balaka jagadantaca jara jayavaraprada | pritih kathoravadana karalaradana
    rasa || 47|| jihvahastaca bagala pranaya vinayaprada | kiri karalavapushi shemushi makshika mashi
    || 48|| uttirnatarnika tikshna shlakshna kameshvari shiva | shivapatni sarojakshi padmahasta sarasvati
    || 49|| kamalakshi kamalaja karavalaviharini | kavipujya kavigatih kavirupa kavipriya || 50|| kadali
    kadalirupa kadalivanavasini | kalaprita kalahada kalaha kalahatura || 51|| kasturimrigasamsthaca kasturimrigarupini
    | kathora karamalaca kathorakucadharini || 52|| yajnamata yajnabhoktri yajneshi yajnasambhava | yajnasiddhih
    kriyasiddhiryajnangi yajnarakshika || 53|| vaishnavi vishnurupa ca vishnumatrisvarupini | vishnumaya
    vishalakshi vishalanayanojjvala || 54|| shivamata shivakhyaca shivada shivarupini | gayatri caiva
    savitri brahmani brahmarupini || 55|| durgastha durgarupaca durga durgatinashini | maheshvarica sarvadha
    sharvani sarvamangala || 56|| suryakotisahasrabha candrakotinibhanana | samudrakotigambhira vayukotimahabala
    || 57|| somasuryagnimadhyastha manimandalavasini | dvadasharasarojasthasuryamandalavasini || 58||
    akalankashashankabha shodasharanivasini | hritpadmanilaya'bhima mahabhairavanadini || 59|| varnadhya
    varnarahita pancashadvarnabhedini | bhavani bhutida bhutirbhutidatri ca bhairavi || 60|| bhairavacaranirata
    bhutabhairavasevita | kameshvari kamarupa kamatapavimocini || 61|| ganeshajanani deviganeshavaradayini
    | gatida gatiha gita gautami gurusevita || 62|| dinaduhkhahara dinatapanirmulakarini | dayashila dayasara
    dayasagarasamsthita || 63|| nrityapriya nrityarata nartaki nartakapriya | narayani narendrastha naramundasthimalini
    || 64|| bhairavi bhairavaradhya bhima bhimavaraprada | bhuvana bhuvanaradhya bhavani bhutivardhini
    || 65|| mahishasurahantri ca raktabijavinashini | dhanurbanadhara nitya dhumralocananashini || 66||
    kulina kulamargastha kulamargaprakashini | pancashadvarnabijadhya pancashanmundamalika || 67|| shadangayuvatipujya
    shadangarupavarjita | kalamata kalaratrih kali kamalavasini || 68|| kamala kantirupaca kamarajeshvari
    kriya | maya matirmahamaya bhayada bhayaharika || 69|| nari narayani ganya narayanagrihapriya | madirapanasantushta
    madiramodadharini || 70|| tathya pathya kriti rathya rathastha vitatasvara | mahati ragini bhargi
    shucihasa harishvari || 71|| haridratnamshulasita lakshminayakasundari | ambalika'mba deveshi anagha'gnishikha
    shrutih || 72|| alasa'lpagatishcantya'nanta'nantaguna'shraya | adya cadityasankasha adityakulasundari
    || 73|| atmarupa''dhishamaniadimaya''didevata | indraprasurinadyotirinagnishashilocana || 74|| indravarajasamstutya
    ilacekshurasapriya | ishvari ishavanita isha keshavavallabha || 75|| uma urvi urubhuja uttunga cokshavahana
    | uttanka cottama dhyeya ullasacorugarvini || 76|| ushmauna ca gurvangi urdhvakshi urdhvamastaka |
    riddhirrica rivarneshi rinahartri ricantaki || 77|| ridhija caruvastraca rinivasa mahalaya | lrikara
    lrikkura lina lrikara varadharini || 78|| enankamukuta ceha carucandrakala kala | aikaragatiraishvaryadayini
    caishvarigatih || 79|| onkara bijarupa ca autriki vetradharini | ambika lampika pampa ah svarodgararupini
    || 80|| kalica bhadrakali ca kalika kalavallabha | kadambanilaya kantha
  devanagari: रूरुषारेवारेवतीरमणी रमा ॥ ४४॥ ऋद्धिहस्ता सिद्धिहस्ता अन्नपूर्णा महेश्वरी । अन्नरूपा जगज्ज्योतिः
    समस्तासुरघातिनी ॥ ४५॥ गारुडीगगनालम्बा लम्बमानकचप्रिया । पीताम्बरा पीतपुष्पा पूतना गीतवल्लभा ॥ ४६॥
    बलाका जगदन्ताच जरा जयवरप्रदा । प्रीतिः कठोरवदना करालरदना रसा ॥ ४७॥ जिह्वाहस्ताच बगला प्रणया विनयप्रदा
    । किरी करालवपुषी शेमुषी मक्षिका मषी ॥ ४८॥ उत्तीर्णातर्णिका तीक्ष्णा श्लक्ष्णा कामेश्वरी शिवा । शिवपत्नी
    सरोजाक्षी पद्महस्ता सरस्वती ॥ ४९॥ कमलाक्षी कमलजा करवालविहारिणी । कविपूज्या कविगतिः कविरूपा कविप्रिया
    ॥ ५०॥ कदली कदलीरूपा कदलीवनवासिनी । कलप्रीता कलहदा कलहा कलहातुरा ॥ ५१॥ कस्तूरीमृगसंस्थाच कस्तूरीमृगरूपिणी
    । कठोरा करमालाच कठोरकुचधारिणी ॥ ५२॥ यज्ञमाता यज्ञभोक्त्री यज्ञेशी यज्ञसम्भवा । यज्ञसिद्धिः क्रियासिद्धिर्यज्ञाङ्गी
    यज्ञरक्षिका ॥ ५३॥ वैष्णवी विष्णुरूपा च विष्णुमातृस्वरूपिणी । विष्णुमाया विशालाक्षी विशालनयनोज्ज्वला
    ॥ ५४॥ शिवमाता शिवाख्याच शिवदा शिवरूपिणी । गायत्री चैव सावित्री ब्रह्माणी ब्रह्मरूपिणी ॥ ५५॥ दुर्गस्था
    दुर्गरूपाच दुर्गा दुर्गतिनाशिनी । माहेश्वरीच सर्वाधा शर्वाणी सर्वमङ्गला ॥ ५६॥ सूर्यकोटिसहस्राभा चन्द्रकोटिनिभानना
    । समुद्रकोटिगम्भीरा वायुकोटिमहाबला ॥ ५७॥ सोमसूर्याग्निमध्यस्था मणिमण्डलवासिनी । द्वादशारसरोजस्थासूर्यमण्डलवासिनी
    ॥ ५८॥ अकलङ्कशशाङ्काभा षोडशारनिवासिनी । हृत्पद्मनिलयाऽभीमा महाभैरवनादिनी ॥ ५९॥ वर्णाढ्या वर्णरहिता
    पञ्चाशद्वर्णभेदिनी । भवानी भूतिदा भूतिर्भूतिदात्री च भैरवी ॥ ६०॥ भैरवाचारनिरता भूतभैरवसेविता । कामेश्वरी
    कामरूपा कामतापविमोचिनी ॥ ६१॥ गणेशजननी देवीगणेशवरदायिनी । गतिदा गतिहा गीता गौतमी गुरुसेविता ॥ ६२॥ दीनदुःखहरा
    दीनतापनिर्मूलकारिणी । दयाशीला दयासारा दयासागरसंस्थिता ॥ ६३॥ नृत्यप्रिया नृत्यरता नर्तकी नर्तकप्रिया
    । नारायणी नरेन्द्रस्था नरमुण्डास्थिमालिनी ॥ ६४॥ भैरवी भैरवाराध्या भीमा भीमवरप्रदा । भुवना भुवनाराध्या
    भवानी भूतिवर्धिनी ॥ ६५॥ महिषासुरहन्त्री च रक्तबीजविनाशिनी । धनुर्बाणधरा नित्या धूम्रलोचननाशिनी ॥ ६६॥
    कुलीना कुलमार्गस्था कुलमार्गप्रकाशिनी । पञ्चाशद्वर्णबीजाढ्या पञ्चाशन्मुण्डमालिका ॥ ६७॥ षडङ्गयुवतीपूज्या
    षडङ्गरूपवर्जिता । कालमाता कालरात्रिः काली कमलवासिनी ॥ ६८॥ कमला कान्तिरूपाच कामराजेश्वरी क्रिया । माया
    मतिर्महामाया भयदा भयहारिका ॥ ६९॥ नारी नारायणी गण्या नारायणगृहप्रिया । मदिरापानसन्तुष्टा मदिरामोदधारिणी
    ॥ ७०॥ तथ्या पथ्या कृती रथ्या रथस्था विततस्वरा । महती रागिणी भार्गी शुचिहासा हरीश्वरी ॥ ७१॥ हरिद्रत्नांशुलसिता
    लक्ष्मीनायकसुन्दरी । अम्बालिकाऽम्बा देवेशी अनघाऽग्निशिखा श्रुतिः ॥ ७२॥ अलसाऽल्पगतिश्चान्त्याऽनन्ताऽनन्तगुणाऽश्रया
    । आद्या चादित्यसङ्काशा आदित्यकुलसुन्दरी ॥ ७३॥ आत्मरूपाऽऽधिशमनीआदिमायाऽऽदिदेवता । इन्द्रप्रसूरिनद्योतिरिनाग्निशशिलोचना
    ॥ ७४॥ इन्द्रावरजसंस्तुत्या इलाचेक्षुरसप्रिया । ईश्वरी ईशवनिता ईशा केशववल्लभा ॥ ७५॥ उमा उर्वी उरुभुजा
    उत्तुङ्गा चोक्षवाहना । उत्तङ्का चोत्तमा ध्येया उल्लासाचोरुगर्विणी ॥ ७६॥ उष्माऊणा च गुर्वङ्गी ऊर्ध्वाक्षी
    ऊर्ध्वमस्तका । ऋद्धिरृचा ऋवर्णेशी ऋणहर्त्री ऋचान्तकी ॥ ७७॥ ॠढिजा चारुवस्त्राच ॠणिवासा महालया । लृकारा
    लृक्कुरा लीना लृकारा वरधारिणी ॥ ७८॥ एणाङ्कमुकुटा चेहा चारुचन्द्रकला कला । ऐकारगतिरैश्वर्यदायिनी चैश्वरीगतिः
    ॥ ७९॥ ओङ्कारा बीजरूपा च औत्रिकी वेत्रधारिणी । अम्बिका लम्पिका पम्पा अः स्वरोद्गाररूपिणी ॥ ८०॥ कालीच
    भद्रकाली च कालिका कालवल्लभा । कदम्बनिलया कन्था
