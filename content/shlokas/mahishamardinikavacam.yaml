id: mahishamardinikavacam
category: kavacha
name:
  english: mahishamardinikavacam
  devanagari: महिषमर्दिनीकवचम्
content:
  english: dakinyah patu satatam siddhah patu sada mama || 14|| sarvatra sarvada patu devi mahishamardini
    | iti te kavacam divyam kathitam sarvakamadam || 15|| yatra tatra na vaktavyam gopitavyam prayattatah
    | gopitam sarvatantreshu vishvasare prakashitam || 16|| sarvatra sulabha vidya kavacam durlabham mahat
    || shathaya bhaktihinaya nindakaya maheshvari || 17|| nyunange hyatiriktange krure mithyatibhashini
    | na stavam darshayeddivyam kavacam suradurlabham || 18|| yatra tatra na vaktavyam shankarena ca bhashitam
    | dattva tebhyo maheshani nashyanti siddhayah kramat || 19|| mantrah paranmukha yanti shapam dattva
    sudarunam | ashubham ca bhavettasya tasmadyatnena gopayet || 20|| gorocana kukumena bhurjapatre maheshvari
    | likhitva shubhayogena brahmaindre vaidhritau tatha || 21|| ayushmatsiddhiyoge ca balave kaulavepi
    va | vanije shravanayam ca revatyam va punarvasau || 22|| uttaratrayayogeshu tatha purvatrayeshu ca
    | ashvinyam va'tha rohinyam tritiya
  devanagari: डाकिन्याः पातु सततं सिद्धाः पातु सदा मम ॥ १४॥ सर्वत्र सर्वदा पातु देवी महिषमर्दिनी । इति
    ते कवचं दिव्यं कथितं सर्वकामदम् ॥ १५॥ यत्र तत्र न वक्तव्यं गोपितव्यं प्रयत्ततः । गोपितं सर्वतन्त्रेषु
    विश्वसारे प्रकाशितम् ॥ १६॥ सर्वत्र सुलभा विद्या कवचं दुर्लभं महत् ॥ शठाय भक्तिहीनाय निन्दकाय महेश्वरि
    ॥ १७॥ न्यूनाङ्गे ह्यतिरिक्ताङ्गे क्रूरे मिथ्यातिभाषिणि । न स्तवं दर्शयेद्दिव्यं कवचं सुरदुर्लभम् ॥
    १८॥ यत्र तत्र न वक्तव्यं शङ्करेण च भाषितम् । दत्त्वा तेभ्यो महेशानि नश्यन्ति सिद्धयः क्रमात् ॥ १९॥
    मन्त्राः पराङ्मुखा यान्ति शापं दत्त्वा सुदारुणम् । अशुभं च भवेत्तस्य तस्माद्यत्नेन गोपयेत् ॥ २०॥ गोरोचना
    कुकुमेन भूर्जपत्रे महेश्वरि । लिखित्वा शुभयोगेन ब्राह्मैन्द्रे वैधृतौ तथा ॥ २१॥ आयुष्मत्सिद्धियोगे
    च बालवे कौलवेपि वा । वाणिजे श्रवणायां च रेवत्यां वा पुनर्वसौ ॥ २२॥ उत्तरात्रययोगेषु तथा पूर्वात्रयेषु
    च । अश्विन्यां वाऽथ रोहिण्यां तृतीया
