id: bhishmastuti
category: stotram
name:
  english: bhishmastuti
  devanagari: भीष्मस्तुति
content:
  english: iti matirupakalpita vitrishna bhagavati satvata pungave vibhumni | svasukhamupagate kvacidvihartum
    prakritimupeyushi yadbhavapravahah || 32|| tribhuvanakamanam tamalavarnam ravikaragauravarambaram
    dadhane | vapuralakakulavritananabjam vijayasakhe ratirastu me'navadya || 33|| yudhi turagarajovidhumravishvakkacalulitashramavaryalamkritasye
    | mama nishitasharairvibhidyamanatvaci vilasatkavace'stu krishna atma || 34|| sapadi sakhivaco nishamya
    madhye nijaparayorbalayo ratham niveshya | sthitavati parasainikayurakshna hritavati partha sakhe
    ratirmamastu || 35|| vyavahita prithanamukham nirikshya svajanavadhadvimukhasya doshabuddhya| kumatimaharadatmavidyaya
    yashcaranaratih paramasya tasya me'stu || 36|| svanigamamapahaya matpratijna mritamadhikartumavapluto
    rathasthah | dhritarathacarano'bhyayaccalatguh haririva hantumibham gatottariyah || 37|| shitavishikhahatovishirnadamshah
    kshatajaparipluta atatayino me | prasabhamabhisasara madvadhartham sa bhavatu me bhagavan gatirmukundah
    || 38|| vijayarathakutumba attatotre dhritahayarashmini tacchriyekshaniye| bhagavati ratirastu me
    mumurshoh yamiha nirikshya hatah gatah sarupam || 39|| lalita gati vilasa valguhasa pranaya nirikshana
    kalpitorumanah | kritamanukritavatya unmadandhah prakritimagan kila yasya gopavadhvah || 40|| munigananripavaryasamkule'ntah
    sadasi yudhishthirarajasuya esham | arhanamupapeda ikshaniyo mama drishi gocara esha aviratma || 41||
    tamimamahamajam sharirabhajam hridihridi dhishtitamatmakalpitanam | pratidrishamiva naikadha'rkamekam
    samadhigato'smi vidhutabhedamohah || 42|| shri suta uvaca
  devanagari: इति मतिरुपकल्पिता वितृष्णा भगवति सात्वत पुङ्गवे विभूम्नि । स्वसुखमुपगते क्वचिद्विहर्तुं
    प्रकृतिमुपेयुषि यद्भवप्रवाहः ॥ ३२॥ त्रिभुवनकमनं तमालवर्णं रविकरगौरवराम्बरं दधाने । वपुरलककुलावृताननाब्जं
    विजयसखे रतिरस्तु मेऽनवद्या ॥ ३३॥ युधि तुरगरजोविधूम्रविष्वक्कचलुलितश्रमवार्यलंकृतास्ये । मम निशितशरैर्विभिद्यमानत्वचि
    विलसत्कवचेऽस्तु कृष्ण आत्मा ॥ ३४॥ सपदि सखिवचो निशम्य मध्ये निजपरयोर्बलयो रथं निवेश्य । स्थितवति परसैनिकायुरक्ष्णा
    हृतवति पार्थ सखे रतिर्ममास्तु ॥ ३५॥ व्यवहित पृथनामुखं निरीक्ष्य स्वजनवधाद्विमुखस्य दोषबुद्ध्या। कुमतिमहरदात्मविद्यया
    यश्चरणरतिः परमस्य तस्य मेऽस्तु ॥ ३६॥ स्वनिगममपहाय मत्प्रतिज्ञा मृतमधिकर्तुमवप्लुतो रथस्थः । धृतरथचरणोऽभ्ययाच्चलत्गुः
    हरिरिव हन्तुमिभं गतोत्तरीयः ॥ ३७॥ शितविशिखहतोविशीर्णदंशः क्षतजपरिप्लुत आततायिनो मे । प्रसभमभिससार
    मद्वधार्थं स भवतु मे भगवान् गतिर्मुकुन्दः ॥ ३८॥ विजयरथकुटुम्ब आत्ततोत्रे धृतहयरश्मिनि तच्छ्रियेक्षणीये।
    भगवति रतिरस्तु मे मुमूर्षोः यमिह निरीक्ष्य हताः गताः सरूपम् ॥ ३९॥ ललित गति विलास वल्गुहास प्रणय निरीक्षण
    कल्पितोरुमानाः । कृतमनुकृतवत्य उन्मदान्धाः प्रकृतिमगन् किल यस्य गोपवध्वः ॥ ४०॥ मुनिगणनृपवर्यसंकुलेऽन्तः
    सदसि युधिष्ठिरराजसूय एषाम् । अर्हणमुपपेद ईक्षणीयो मम दृशि गोचर एष आविरात्मा ॥ ४१॥ तमिममहमजं शरीरभाजां
    हृदिहृदि धिष्टितमात्मकल्पितानाम् । प्रतिदृशमिव नैकधाऽर्कमेकं समधिगतोऽस्मि विधूतभेदमोहः ॥ ४२॥ श्री
    सूत उवाच
