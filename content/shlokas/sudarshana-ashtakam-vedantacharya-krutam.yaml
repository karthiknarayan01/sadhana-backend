id: sudarshana-ashtakam-vedantacharya-krutam
category: stotram
name:
  english: Sudarshana Ashtakam (Vedantacharya Krutam)
content:
  english: pratibhatashrenibhishana varagunastomabhushana janibhayasthanatarana jagadavasthanakarana |
    nikhiladushkarmakarshana nigamasaddharmadarshana jaya jaya shrisudarshana jaya jaya shrisudarshana
    || || shubhajagadrupamandana surajanatrasakhandana shatamakhabrahmavandita shatapathabrahmanandita
    | prathitavidvatsapakshita bhajadahirbudhnyalakshita jaya jaya shrisudarshana jaya jaya shrisudarshana
    || || nijapadapritasadgana nirupathisphitashadguna nigamanirvyudhavaibhava nijaparavyuhavaibhava |
    harihayadveshidarana harapuraploshakarana jaya jaya shrisudarshana jaya jaya shrisudarshana || ||
    sphutatatijjalapinjara prithutarajvalapanjara parigatapratnavigraha parimitaprajnadurgraha | praharanagramamandita
    parijanatranapandita jaya jaya shrisudarshana jaya jaya shrisudarshana || || bhuvananetastrayimaya
    savanatejastrayimaya niravadhisvaducinmaya nikhilashaktejaganmaya | amitavishvakriyamaya shamitavishvagbhayamaya
    jaya jaya shrisudarshana jaya jaya shrisudarshana || || mahitasampatsadakshara vihitasampatshadakshara
    shadaracakrapratishthita sakalatattvapratishthita | vividhasankalpakalpaka vibudhasankalpakalpaka
    jaya jaya shrisudarshana jaya jaya shrisudarshana || || pratimukhalidhabandhura prithumahahetidantura
    vikatamalaparishkrita vividhamayabahishkrita | sthiramahayantrayantrita dridhadayatantrayantrita jaya
    jaya shrisudarshana jaya jaya shrisudarshana || || danujavistarakartana danujavidyavikartana janitamisravikartana
    bhajadavidyanikartana | amaradrishtasvavikrama samarajushtabhramikrama jaya jaya shrisudarshana jaya
    jaya shrisudarshana || || dvicatushkamidam prabhutasaram pathatam venkatanayakapranitam | vishame'pi
    manorathah pradhavan na vihanyeta rathangadhuryaguptah || || iti shri vedantacaryasya kritishu sudarshanashtakam
    |
  devanagari: प्रतिभटश्रेणिभीषण वरगुणस्तोमभूषण जनिभयस्थानतारण जगदवस्थानकारण । निखिलदुष्कर्मकर्शन निगमसद्धर्मदर्शन
    जय जय श्रीसुदर्शन जय जय श्रीसुदर्शन ॥ ॥ शुभजगद्रूपमण्डन सुरजनत्रासखण्डन शतमखब्रह्मवन्दित शतपथब्रह्मनन्दित
    । प्रथितविद्वत्सपक्षित भजदहिर्बुध्न्यलक्षित जय जय श्रीसुदर्शन जय जय श्रीसुदर्शन ॥ ॥ निजपदप्रीतसद्गण
    निरुपथिस्फीतषड्गुण निगमनिर्व्यूढवैभव निजपरव्यूहवैभव । हरिहयद्वेषिदारण हरपुरप्लोषकारण जय जय श्रीसुदर्शन
    जय जय श्रीसुदर्शन ॥ ॥ स्फुटतटिज्जालपिञ्जर पृथुतरज्वालपञ्जर परिगतप्रत्नविग्रह परिमितप्रज्ञदुर्ग्रह
    । प्रहरणग्राममण्डित परिजनत्राणपण्डित जय जय श्रीसुदर्शन जय जय श्रीसुदर्शन ॥ ॥ भुवननेतस्त्रयीमय सवनतेजस्त्रयीमय
    निरवधिस्वादुचिन्मय निखिलशक्तेजगन्मय । अमितविश्वक्रियामय शमितविश्वग्भयामय जय जय श्रीसुदर्शन जय जय श्रीसुदर्शन
    ॥ ॥ महितसम्पत्सदक्षर विहितसम्पत्षडक्षर षडरचक्रप्रतिष्ठित सकलतत्त्वप्रतिष्ठित । विविधसङ्कल्पकल्पक विबुधसङ्कल्पकल्पक
    जय जय श्रीसुदर्शन जय जय श्रीसुदर्शन ॥ ॥ प्रतिमुखालीढबन्धुर पृथुमहाहेतिदन्तुर विकटमालापरिष्कृत विविधमायाबहिष्कृत
    । स्थिरमहायन्त्रयन्त्रित दृढदयातन्त्रयन्त्रित जय जय श्रीसुदर्शन जय जय श्रीसुदर्शन ॥ ॥ दनुजविस्तारकर्तन
    दनुजविद्याविकर्तन जनितमिस्राविकर्तन भजदविद्यानिकर्तन । अमरदृष्टस्वविक्रम समरजुष्टभ्रमिक्रम जय जय श्रीसुदर्शन
    जय जय श्रीसुदर्शन ॥ ॥ द्विचतुष्कमिदं प्रभूतसारं पठतां वेङ्कटनायकप्रणीतम् । विषमेऽपि मनोरथः प्रधावन्
    न विहन्येत रथाङ्गधुर्यगुप्तः ॥ ॥ इति श्री वेदान्ताचार्यस्य कृतिषु सुदर्शनाष्टकम् ।
