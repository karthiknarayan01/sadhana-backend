id: angaraka-kavacham-angaraka-kavacham
category: stotram
name:
  english: Angaraka Kavacham (Angaraka Kavacham)
content:
  english: asya shri angaraka kavacasya bhauma prityarthe jape viniyogah || dhyanam raktambaro raktavapuh
    kiriti caturbhujo meshagamo gadabhrit | dharasutah shaktidharashca shuli sada mama syadvaradah prashantah
    || atha angaraka kavacam angarakah shiro rakshet mukham vai dharanisutah | shravau raktambarah patu
    netre me raktalocanah || || nasam shaktidharah patu mukham me raktalocanah | bhujau me raktamali ca
    hastau shaktidharastatha || || vakshah patu varangashca hridayam patu rohitah | katim me graharajashca
    mukham caiva dharasutah || || janujanghe kujah patu padau bhaktapriyah sada | sarvanyanyani cangani
    rakshenme meshavahanah || || phalashrutih ya idam kavacam divyam sarvashatrunivaranam | bhutapretapishacanam
    nashanam sarvasiddhidam || sarvarogaharam caiva sarvasampatpradam shubham | bhuktimuktipradam nrinam
    sarvasaubhagyavardhanam || rogabandhavimoksham ca satyametanna samshayah || || iti shri markandeyapurane
    angaraka kavacam sampurnam ||
  devanagari: अस्य श्री अङ्गारक कवचस्य भौम प्रीत्यर्थे जपे विनियोगः ॥ ध्यानम् रक्ताम्बरो रक्तवपुः किरीटी
    चतुर्भुजो मेषगमो गदाभृत् । धरासुतः शक्तिधरश्च शूली सदा मम स्याद्वरदः प्रशान्तः ॥ अथ अङ्गारक कवचम्
    अङ्गारकः शिरो रक्षेत् मुखं वै धरणीसुतः । श्रवौ रक्तम्बरः पातु नेत्रे मे रक्तलोचनः ॥ ॥ नासां शक्तिधरः
    पातु मुखं मे रक्तलोचनः । भुजौ मे रक्तमाली च हस्तौ शक्तिधरस्तथा ॥ ॥ वक्षः पातु वराङ्गश्च हृदयं पातु
    रोहितः । कटिं मे ग्रहराजश्च मुखं चैव धरासुतः ॥ ॥ जानुजङ्घे कुजः पातु पादौ भक्तप्रियः सदा । सर्वाण्यन्यानि
    चाङ्गानि रक्षेन्मे मेषवाहनः ॥ ॥ फलश्रुतिः य इदं कवचं दिव्यं सर्वशत्रुनिवारणम् । भूतप्रेतपिशाचानां
    नाशनं सर्वसिद्धिदम् ॥ सर्वरोगहरं चैव सर्वसम्पत्प्रदं शुभम् । भुक्तिमुक्तिप्रदं नॄणां सर्वसौभाग्यवर्धनम्
    ॥ रोगबन्धविमोक्षं च सत्यमेतन्न संशयः ॥ ॥ इति श्री मार्कण्डेयपुराणे अङ्गारक कवचं सम्पूर्णम् ॥
