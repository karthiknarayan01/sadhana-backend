id: vaishampayanaproktamnarayanastotram
category: stotram
name:
  english: vaishampayanaproktamnarayanastotram
  devanagari: वैशम्पायनप्रोक्तंनारायणस्तोत्रम्
content:
  english: vaishampayanaproktam narayanastotram sa hi paramagururbhuvanapatirdharanidharah shamaniyamanidhih
    | shrutivinayanidhirdvijaparamahitastava bhavatu gatirhariramarahitah || 13|| tapasam nidhih sumahatam
    mahato yashasashca bhajanamarishtakaha | ekantinam sharanado'bhayado gatido'stu vah sa makhabhagaharah
    || 14|| trigunatigashcatushpancadharah purteshtayoshca phalabhagaharah | vidadhati nityamajito'tibalo
    gatimatmagam sukritinamrishinam || 15|| tam lokasakshinamajam purusham ravivarnamishvaragatim bahushah
    | pranamadhvamekamatayo yatayah salilodbhavo'pi tamrishim pranatah || 16|| sa hi lokayoniramritasya
    padam sukshmam puranamacalam paramam | tatsankhyayogibhirudaradhritam buddhya yatatmabhirviditam satatam
    || 17|| iti mahabharate shantiparvani 334 adhyayantargatam vaishampayanaproktam narayanastotram sampurnam
    | mahabharata | shantiparva | adhyaya 334
  devanagari: वैशम्पायनप्रोक्तं नारायणस्तोत्रम् स हि परमगुरुर्भुवनपतिर्धरणिधरः शमनियमनिधिः । श्रुतिविनयनिधिर्द्विजपरमहितस्तव
    भवतु गतिर्हरिरमरहितः ॥ १३॥ तपसां निधिः सुमहतां महतो यशसश्च भाजनमरिष्टकहा । एकान्तिनां शरणदोऽभयदो गतिदोऽस्तु
    वः स मखभागहरः ॥ १४॥ त्रिगुणातिगश्चतुष्पञ्चधरः पूर्तेष्टयोश्च फलभागहरः । विदधाति नित्यमजितोऽतिबलो गतिमात्मगां
    सुकृतिनामृषीणाम् ॥ १५॥ तं लोकसाक्षिणमजं पुरुषं रविवर्णमीश्वरगतिं बहुशः । प्रणमध्वमेकमतयो यतयः सलिलोद्भवोऽपि
    तमृषिं प्रणतः ॥ १६॥ स हि लोकयोनिरमृतस्य पदं सूक्ष्मं पुराणमचलं परमम् । तत्साङ्ख्ययोगिभिरुदारधृतं बुद्ध्या
    यतात्मभिर्विदितं सततम् ॥ १७॥ इति महाभारते शान्तिपर्वणि ३३४ अध्यायान्तर्गतं वैशम्पायनप्रोक्तं नारायणस्तोत्रं
    सम्पूर्णम् । महाभारत । शान्तिपर्व । अध्याय ३३४
