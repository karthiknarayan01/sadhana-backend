id: vidura-neethi-udyoga-parvam-chapter-36
category: stotram
name:
  english: Vidura Neethi - Udyoga Parvam Chapter 36
content:
  english: '|| iti shrimahabharate udyogaparvani prajagaraparvani vidurahitavakye shattrimsho''dhyayah
    || vidura uvaca | atraivodaharantimamitihasam puratanam | atreyasya ca samvadam sadhyanam ceti nah
    shrutam || || carantam hamsarupena maharshim samshitavratam | sadhya deva mahaprajnam paryapricchanta
    vai pura || || sadhya ucuh | sadhya deva vaymasmo maharshe drishtva bhavantam na shaknumo''numatum
    | shrutena dhiro buddhimamstvam mato nah kavyam vacam vaktumarhasyudaram || || hamsa uvaca | etatkaryamamarah
    samshrutam me dhritih shamah satyadharmanuvrittih | granthim viniya hridayasya sarvam priyapriye catmavasham
    nayita || || akrushyamano nakroshenmanyureva titikshitah | akroshtaram nirdahati sukritam casya vindati
    || || nakroshi syannavamani parasya mitradrohi nota nicopasevi | na catimani na ca hinavritto ruksham
    vacam rushatim varjayita || || marmanyasthini hridayam tathasun ghora vaco nirdahantiha pumsam | tasmadvacam
    rushatim ruksharupam dharmaramo nityasho varjayita || || arum turam parusham rukshavacam vakkantakairvitudantam
    manushyan | vidyadalakshmikatamam jananam mukhe nibaddham nirritim vahantam || || parashcedenamadhividhyeta
    banair bhrisham sutikshnairanalarka diptaih | viricyamano''pyatiricyamano vidyatkavih sukritam me
    dadhati || || yadi santam sevate yadyasantam tapasvinam yadi va stenameva | vaso yatha ranga vasham
    prayati tatha sa tesham vashamabhyupaiti || || vadam tu yo na pravadenna vadayed yo nahatah pratihanyanna
    ghatayet | yo hantukamasya na papamicchet tasmai devah sprihayantyagataya || || avyahritam vyahritacchreya
    ahuh satyam vadedvyahritam taddvitiyam | priyamvadedvyahritam tattritiyam dharmyam vadedvyahritam
    taccaturtham || || yadrishaih samvivadate yadrishamsh copasevate | yadrigicchecca bhavitum tadrigbhavati
    purushah || || yato yato nivartate tatastato vimucyate | nivartanaddhi sarvato na vetti duhkhamanvapi
    || || na jiyate nota jigishate''nyan na vairakkriccapratighatakash ca | ninda prashamsasu samasvabhavo
    na shocate hrishyati naiva cayam || || bhavamicchati sarvasya nabhave kurute matim | satyavadi mridurdanto
    yah sa uttamapurushah || || nanarthakam santvayati pratijnaya dadati ca | raddhaparaddhe janati yah
    sa madhyamapurushah || || duhshasanastupahanta na shasta navartate manyuvashatkritaghnah | na kasya
    cinmitramatho duratma kalashcaita adhamasyeha pumsah || || na shraddadhati kalyanam parebhyo''pyatmashankitah
    | nirakaroti mitrani yo vai so''dhama purushah || || uttamaneva seveta prapte kale tu madhyaman |
    adhamamstu na seveta ya icchecchreya atmanah || || prapnoti vai vittamasadbalena nityotthanatprajnaya
    paurushena | na tveva samyaglabhate prashamsam na vrittamapnoti mahakulanam || || dhritarashtra uvaca
    | mahakulanam sprihayanti deva dharmarthavriddhashca bahushrutash ca | pricchami tvam vidura prashnametam
    bhavanti vai kani mahakulani || || vidura uvaca | tamo damo brahmavittvam vitanah punya vivahah satatanna
    danam | yeshvevaite saptaguna bhavanti samyagvrittastani mahakulani || || yesham na vrittam vyathate
    na yonir vrittaprasadena caranti dharmam | ye kirtimicchanti kule vishishtam tyaktanritastani mahakulani
    || || anijyayavivahairshca vedasyotsadanena ca | kulanyakulatam yanti dharmasyatikramena ca || ||
    deva dravyavinashena brahma svaharanena ca | kulanyakulatam yanti brahmanatikramena ca || || brahmananam
    paribhavatparivadacca bharata | kulanyakulatam yanti nyasapaharanena ca || || kulani samupetani gobhih
    purushato''shvatah | kulasankhyam na gacchanti yani hinani vrittatah || || vrittatastvavihinani kulanyalpadhananyapi
    | kulasankhyam tu gacchanti karshanti ca mayadyashah || || ma nah kule vairakritkash cidastu rajamatyo
    ma parasvapahari | mitradrohi naikritiko''nriti va purvashi va pitridevatithibhyah || || yashca no
    brahmanam hanyadyashca no brahmanandvishet | na nah sa samitim gacchedyashca no nirvapetkrishim ||
    || trinani bhumirudakam vakcaturthi ca sunrita | satametani geheshu nocchidyante kada cana || || shraddhaya
    paraya rajannupanitani satkritim | pravrittani mahaprajna dharminam punyakarmanam || || sukshmo''pi
    bharam nripate syandano vai shakto vodhum na tathanye mahijah | evam yukta bharasaha bhavanti mahakulina
    na tathanye manushyah || || na tanmitram yasya kopadbibheti yadva mitram shankitenopacaryam | yasminmitre
    pitarivashvasita tadvai mitram sangatanitarani || || yadi cedapyasambandho mitrabhavena vartate |
    sa eva bandhustanmitram sa gatistatparayanam || || calacittasya vai pumso vriddhananupasevatah | pariplavamaternityamadhruvo
    mitra sangrahah || || calacittamanatmanamindriyanam vashanugam | arthah samativartante hamsah shushkam
    saro yatha || || akasmadeva kupyanti prasidantyanimittatah | shilametadasadhunamabhram pariplavam
    yatha || || satkritashca kritarthashca mitranam na bhavanti ye | tanmritanapi kravyadah kritaghnannopabhunjate
    || || arthayedeva mitrani sati vasati va dhane | nanarthayanvijanati mitranam saraphalgutam || ||
    santapadbhrashyate rupam santapadbhrashyate balam | santapadbhrashyate jnanam santapadvyadhimricchati
    || || anavapyam ca shokena shariram copatapyate | amitrashca prahrishyanti ma sma shoke manah krithah
    || || punarnaro mriyate jayate ca punarnaro hiyate vardhate punah | punarnaro yacati yacyate ca punarnarah
    shocati shocyate punah || || sukham ca duhkham ca bhavabhavau ca labhalabhau maranam jivitam ca |
    paryayashah sarvamiha sprishanti tasmaddhiro naiva hrishyenna shocet || || calani himani shadindriyani
    tesham yadyadvartate yatra yatra | tatastatah sravate buddhirasya chidroda kumbhadiva nityamambhah
    || || dhritarashtra uvaca | tanurucchah shikhi raja mithyopacarito maya | mandanam mama putranam yuddhenantam
    karishyati || || nityodvignamidam sarvam nityodvignamidam manah | yattatpadamanudvignam tanme vada
    mahamate || || vidura uvaca | nanyatra vidya tapasornanyatrendriya nigrahat | nanyatra lobhasantyagacchantim
    pashyama te''nagha || || buddhya bhayam pranudati tapasa vindate mahat | gurushushrushaya jnanam shantim
    tyagena vindati || || anashrita danapunyam veda punyamanashritah | ragadveshavinirmukta vicarantiha
    mokshinah || || svadhitasya suyuddhasya sukritasya ca karmanah | tapasashca sutaptasya tasyante sukhamedhate
    || || svastirnani shayanani prapanna na vai bhinna jatu nidram labhante | na strishu rajanratimapnuvanti
    na magadhaih stuyamana na sutaih || || na vai bhinna jatu caranti dharmam na vai sukham prapnuvantiha
    bhinnah | na vai bhinna gauravam manayanti na vai bhinnah prashamam rocayanti || || na vai tesham
    svadate pathyamuktam yogakshemam kalpate nota tesham | bhinnanam vai manujendra parayanam na vidyate
    kim cidanyadvinashat || || sambhavyam goshu sampannam sambhavyam brahmane tapah | sambhavyam strishu
    capalyam sambhavyam jnatito bhayam || || tantavo''pyayata nityam tantavo bahulah samah | bahunbahutvadayasansahantityupama
    satam || || dhumayante vyapetani jvalanti sahitani ca | dhritarashtrolmukaniva jnatayo bharatarshabha
    || || brahmaneshu ca ye shurah strishu jnatishu goshu ca | vrintadiva phalam pakvam dhritarashtra
    patanti te || || mahanapyekajo vriksho balavansupratishthitah | prasahya eva vatena shakha skandham
    vimarditum || || atha ye sahita vrikshah sanghashah supratishthitah | te hi shighratamanvatansahante''nyonyasamshrayat
    || || evam manushyamapyekam gunairapi samanvitam | shakyam dvishanto manyante vayurdrumamivaukajam
    || || anyonyasamupashtambhadanyonyapashrayena ca | jnatayah sampravardhante sarasivotpalanyuta ||
    || avadhya brahmana gavo striyo balashca jnatayah | yesham cannani bhunjita ye ca syuh sharanagatah
    || || na manushye gunah kashcidanyo dhanavatam api | anaturatvadbhadram te mritakalpa hi roginah ||
    || avyadhijam katukam shirsha rogam papanubandham parusham tikshnamugram | satam peyam yanna pibantyasanto
    manyum maharaja piba prashamya || || rogardita na phalanyadriyante na vai labhante vishayeshu tattvam
    | duhkhopeta rogino nityameva na budhyante dhanabhoganna saukhyam || || pura hyukto nakarostvam vaco
    me dyute jitam draupadim prekshya rajan | duryodhanam varayetyakshavatyam kitavatvam pandita varjayanti
    || || na tadbalam yanmriduna virudhyate mishro dharmastarasa sevitavyah | pradhvamsini krurasamahita
    shrir mridupraudha gacchati putrapautran || || dhartarashtrah pandavanpalayantu pandoh sutastava putramshca
    pantu | ekarimitrah kuravo hyekamantra jivantu rajansukhinah samriddhah || || medhibhutah kauravanam
    tvamadya tvayyadhinam kuru kulamajamidha | parthanbalanvanavasa prataptan gopayasva svam yashastata
    rakshan || || sandhatsva tvam kauravanpanduputrair ma te''ntaram ripavah prarthayantu | satye sthitaste
    naradeva sarve duryodhanam sthapaya tvam narendra || || || iti shrimahabharate udyogaparvani prajagaraparvani
    vidurahitavakye shattrimsho''dhyayah ||'
  devanagari: ॥ इति श्रीमहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरहितवाक्ये षट्त्रिंशोऽध्यायः ॥ विदुर उवाच
    । अत्रैवोदाहरन्तीममितिहासं पुरातनम् । आत्रेयस्य च संवादं साध्यानां चेति नः श्रुतम् ॥ ॥ चरन्तं हंसरूपेण
    महर्षिं संशितव्रतम् । साध्या देवा महाप्राज्ञं पर्यपृच्छन्त वै पुरा ॥ ॥ साध्या ऊचुः । साध्या देवा वय्मस्मो
    महर्षे दृष्ट्वा भवन्तं न शक्नुमोऽनुमातुम् । श्रुतेन धीरो बुद्धिमांस्त्वं मतो नः काव्यां वाचं वक्तुमर्हस्युदाराम्
    ॥ ॥ हंस उवाच । एतत्कार्यममराः संश्रुतं मे धृतिः शमः सत्यधर्मानुवृत्तिः । ग्रन्थिं विनीय हृदयस्य सर्वं
    प्रियाप्रिये चात्मवशं नयीत ॥ ॥ आक्रुश्यमानो नाक्रोशेन्मन्युरेव तितिक्षितः । आक्रोष्टारं निर्दहति सुकृतं
    चास्य विन्दति ॥ ॥ नाक्रोशी स्यान्नावमानी परस्य मित्रद्रोही नोत नीचोपसेवी । न चातिमानी न च हीनवृत्तो
    रूक्षां वाचं रुशतीं वर्जयीत ॥ ॥ मर्माण्यस्थीनि हृदयं तथासून् घोरा वाचो निर्दहन्तीह पुंसाम् । तस्माद्वाचं
    रुशतीं रूक्षरूपां धर्मारामो नित्यशो वर्जयीत ॥ ॥ अरुं तुरं परुषं रूक्षवाचं वाक्कण्टकैर्वितुदन्तं मनुष्यान्
    । विद्यादलक्ष्मीकतमं जनानां मुखे निबद्धां निरृतिं वहन्तम् ॥ ॥ परश्चेदेनमधिविध्येत बाणैर् भृशं सुतीक्ष्णैरनलार्क
    दीप्तैः । विरिच्यमानोऽप्यतिरिच्यमानो विद्यात्कविः सुकृतं मे दधाति ॥ ॥ यदि सन्तं सेवते यद्यसन्तं तपस्विनं
    यदि वा स्तेनमेव । वासो यथा रङ्ग वशं प्रयाति तथा स तेषां वशमभ्युपैति ॥ ॥ वादं तु यो न प्रवदेन्न वादयेद्
    यो नाहतः प्रतिहन्यान्न घातयेत् । यो हन्तुकामस्य न पापमिच्छेत् तस्मै देवाः स्पृहयन्त्यागताय ॥ ॥ अव्याहृतं
    व्याहृताच्छ्रेय आहुः सत्यं वदेद्व्याहृतं तद्द्वितीयम् । प्रियंवदेद्व्याहृतं तत्तृतीयं धर्म्यं वदेद्व्याहृतं
    तच्चतुर्थम् ॥ ॥ यादृशैः संविवदते यादृशांश् चोपसेवते । यादृगिच्छेच्च भवितुं तादृग्भवति पूरुषः ॥ ॥ यतो
    यतो निवर्तते ततस्ततो विमुच्यते । निवर्तनाद्धि सर्वतो न वेत्ति दुःखमण्वपि ॥ ॥ न जीयते नोत जिगीषतेऽन्यान्
    न वैरक्कृच्चाप्रतिघातकश् च । निन्दा प्रशंसासु समस्वभावो न शोचते हृष्यति नैव चायम् ॥ ॥ भावमिच्छति सर्वस्य
    नाभावे कुरुते मतिम् । सत्यवादी मृदुर्दान्तो यः स उत्तमपूरुषः ॥ ॥ नानर्थकं सान्त्वयति प्रतिज्ञाय ददाति
    च । राद्धापराद्धे जानाति यः स मध्यमपूरुषः ॥ ॥ दुःशासनस्तूपहन्ता न शास्ता नावर्तते मन्युवशात्कृतघ्नः
    । न कस्य चिन्मित्रमथो दुरात्मा कलाश्चैता अधमस्येह पुंसः ॥ ॥ न श्रद्दधाति कल्याणं परेभ्योऽप्यात्मशङ्कितः
    । निराकरोति मित्राणि यो वै सोऽधम पूरुषः ॥ ॥ उत्तमानेव सेवेत प्राप्ते काले तु मध्यमान् । अधमांस्तु
    न सेवेत य इच्छेच्छ्रेय आत्मनः ॥ ॥ प्राप्नोति वै वित्तमसद्बलेन नित्योत्थानात्प्रज्ञया पौरुषेण । न त्वेव
    सम्यग्लभते प्रशंसां न वृत्तमाप्नोति महाकुलानाम् ॥ ॥ धृतराष्ट्र उवाच । महाकुलानां स्पृहयन्ति देवा धर्मार्थवृद्धाश्च
    बहुश्रुताश् च । पृच्छामि त्वां विदुर प्रश्नमेतं भवन्ति वै कानि महाकुलानि ॥ ॥ विदुर उवाच । तमो दमो
    ब्रह्मवित्त्वं वितानाः पुण्या विवाहाः सततान्न दानम् । येष्वेवैते सप्तगुणा भवन्ति सम्यग्वृत्तास्तानि
    महाकुलानि ॥ ॥ येषां न वृत्तं व्यथते न योनिर् वृत्तप्रसादेन चरन्ति धर्मम् । ये कीर्तिमिच्छन्ति कुले
    विशिष्टां त्यक्तानृतास्तानि महाकुलानि ॥ ॥ अनिज्ययाविवाहैर्श्च वेदस्योत्सादनेन च । कुलान्यकुलतां यान्ति
    धर्मस्यातिक्रमेण च ॥ ॥ देव द्रव्यविनाशेन ब्रह्म स्वहरणेन च । कुलान्यकुलतां यान्ति ब्राह्मणातिक्रमेण
    च ॥ ॥ ब्राह्मणानां परिभवात्परिवादाच्च भारत । कुलान्यकुलतां यान्ति न्यासापहरणेन च ॥ ॥ कुलानि समुपेतानि
    गोभिः पुरुषतोऽश्वतः । कुलसङ्ख्यां न गच्छन्ति यानि हीनानि वृत्ततः ॥ ॥ वृत्ततस्त्वविहीनानि कुलान्यल्पधनान्यपि
    । कुलसङ्ख्यां तु गच्छन्ति कर्षन्ति च मयद्यशः ॥ ॥ मा नः कुले वैरकृत्कश् चिदस्तु राजामात्यो मा परस्वापहारी
    । मित्रद्रोही नैकृतिकोऽनृती वा पूर्वाशी वा पितृदेवातिथिभ्यः ॥ ॥ यश्च नो ब्राह्मणं हन्याद्यश्च नो ब्राह्मणान्द्विषेत्
    । न नः स समितिं गच्छेद्यश्च नो निर्वपेत्कृषिम् ॥ ॥ तृणानि भूमिरुदकं वाक्चतुर्थी च सूनृता । सतामेतानि
    गेहेषु नोच्छिद्यन्ते कदा चन ॥ ॥ श्रद्धया परया राजन्नुपनीतानि सत्कृतिम् । प्रवृत्तानि महाप्राज्ञ धर्मिणां
    पुण्यकर्मणाम् ॥ ॥ सूक्ष्मोऽपि भारं नृपते स्यन्दनो वै शक्तो वोढुं न तथान्ये महीजाः । एवं युक्ता भारसहा
    भवन्ति महाकुलीना न तथान्ये मनुष्याः ॥ ॥ न तन्मित्रं यस्य कोपाद्बिभेति यद्वा मित्रं शङ्कितेनोपचर्यम्
    । यस्मिन्मित्रे पितरीवाश्वसीत तद्वै मित्रं सङ्गतानीतराणि ॥ ॥ यदि चेदप्यसम्बन्धो मित्रभावेन वर्तते
    । स एव बन्धुस्तन्मित्रं सा गतिस्तत्परायणम् ॥ ॥ चलचित्तस्य वै पुंसो वृद्धाननुपसेवतः । पारिप्लवमतेर्नित्यमध्रुवो
    मित्र सङ्ग्रहः ॥ ॥ चलचित्तमनात्मानमिन्द्रियाणां वशानुगम् । अर्थाः समतिवर्तन्ते हंसाः शुष्कं सरो यथा
    ॥ ॥ अकस्मादेव कुप्यन्ति प्रसीदन्त्यनिमित्ततः । शीलमेतदसाधूनामभ्रं पारिप्लवं यथा ॥ ॥ सत्कृताश्च कृतार्थाश्च
    मित्राणां न भवन्ति ये । तान्मृतानपि क्रव्यादाः कृतघ्नान्नोपभुञ्जते ॥ ॥ अर्थयेदेव मित्राणि सति वासति
    वा धने । नानर्थयन्विजानाति मित्राणां सारफल्गुताम् ॥ ॥ सन्तापाद्भ्रश्यते रूपं सन्तापाद्भ्रश्यते बलम्
    । सन्तापाद्भ्रश्यते ज्ञानं सन्तापाद्व्याधिमृच्छति ॥ ॥ अनवाप्यं च शोकेन शरीरं चोपतप्यते । अमित्राश्च
    प्रहृष्यन्ति मा स्म शोके मनः कृथाः ॥ ॥ पुनर्नरो म्रियते जायते च पुनर्नरो हीयते वर्धते पुनः । पुनर्नरो
    याचति याच्यते च पुनर्नरः शोचति शोच्यते पुनः ॥ ॥ सुखं च दुःखं च भवाभवौ च लाभालाभौ मरणं जीवितं च । पर्यायशः
    सर्वमिह स्पृशन्ति तस्माद्धीरो नैव हृष्येन्न शोचेत् ॥ ॥ चलानि हीमानि षडिन्द्रियाणि तेषां यद्यद्वर्तते
    यत्र यत्र । ततस्ततः स्रवते बुद्धिरस्य छिद्रोद कुम्भादिव नित्यमम्भः ॥ ॥ धृतराष्ट्र उवाच । तनुरुच्छः
    शिखी राजा मिथ्योपचरितो मया । मन्दानां मम पुत्राणां युद्धेनान्तं करिष्यति ॥ ॥ नित्योद्विग्नमिदं सर्वं
    नित्योद्विग्नमिदं मनः । यत्तत्पदमनुद्विग्नं तन्मे वद महामते ॥ ॥ विदुर उवाच । नान्यत्र विद्या तपसोर्नान्यत्रेन्द्रिय
    निग्रहात् । नान्यत्र लोभसन्त्यागाच्छान्तिं पश्याम तेऽनघ ॥ ॥ बुद्ध्या भयं प्रणुदति तपसा विन्दते महत्
    । गुरुशुश्रूषया ज्ञानं शान्तिं त्यागेन विन्दति ॥ ॥ अनाश्रिता दानपुण्यं वेद पुण्यमनाश्रिताः । रागद्वेषविनिर्मुक्ता
    विचरन्तीह मोक्षिणः ॥ ॥ स्वधीतस्य सुयुद्धस्य सुकृतस्य च कर्मणः । तपसश्च सुतप्तस्य तस्यान्ते सुखमेधते
    ॥ ॥ स्वास्तीर्णानि शयनानि प्रपन्ना न वै भिन्ना जातु निद्रां लभन्ते । न स्त्रीषु राजन्रतिमाप्नुवन्ति
    न मागधैः स्तूयमाना न सूतैः ॥ ॥ न वै भिन्ना जातु चरन्ति धर्मं न वै सुखं प्राप्नुवन्तीह भिन्नाः । न
    वै भिन्ना गौरवं मानयन्ति न वै भिन्नाः प्रशमं रोचयन्ति ॥ ॥ न वै तेषां स्वदते पथ्यमुक्तं योगक्षेमं कल्पते
    नोत तेषाम् । भिन्नानां वै मनुजेन्द्र परायणं न विद्यते किं चिदन्यद्विनाशात् ॥ ॥ सम्भाव्यं गोषु सम्पन्नं
    सम्भाव्यं ब्राह्मणे तपः । सम्भाव्यं स्त्रीषु चापल्यं सम्भाव्यं ज्ञातितो भयम् ॥ ॥ तन्तवोऽप्यायता नित्यं
    तन्तवो बहुलाः समाः । बहून्बहुत्वादायासान्सहन्तीत्युपमा सताम् ॥ ॥ धूमायन्ते व्यपेतानि ज्वलन्ति सहितानि
    च । धृतराष्ट्रोल्मुकानीव ज्ञातयो भरतर्षभ ॥ ॥ ब्राह्मणेषु च ये शूराः स्त्रीषु ज्ञातिषु गोषु च । वृन्तादिव
    फलं पक्वं धृतराष्ट्र पतन्ति ते ॥ ॥ महानप्येकजो वृक्षो बलवान्सुप्रतिष्ठितः । प्रसह्य एव वातेन शाखा
    स्कन्धं विमर्दितुम् ॥ ॥ अथ ये सहिता वृक्षाः सङ्घशः सुप्रतिष्ठिताः । ते हि शीघ्रतमान्वातान्सहन्तेऽन्योन्यसंश्रयात्
    ॥ ॥ एवं मनुष्यमप्येकं गुणैरपि समन्वितम् । शक्यं द्विषन्तो मन्यन्ते वायुर्द्रुममिवौकजम् ॥ ॥ अन्योन्यसमुपष्टम्भादन्योन्यापाश्रयेण
    च । ज्ञातयः सम्प्रवर्धन्ते सरसीवोत्पलान्युत ॥ ॥ अवध्या ब्राह्मणा गावो स्त्रियो बालाश्च ज्ञातयः । येषां
    चान्नानि भुञ्जीत ये च स्युः शरणागताः ॥ ॥ न मनुष्ये गुणः कश्चिदन्यो धनवतां अपि । अनातुरत्वाद्भद्रं
    ते मृतकल्पा हि रोगिणः ॥ ॥ अव्याधिजं कटुकं शीर्ष रोगं पापानुबन्धं परुषं तीक्ष्णमुग्रम् । सतां पेयं
    यन्न पिबन्त्यसन्तो मन्युं महाराज पिब प्रशाम्य ॥ ॥ रोगार्दिता न फलान्याद्रियन्ते न वै लभन्ते विषयेषु
    तत्त्वम् । दुःखोपेता रोगिणो नित्यमेव न बुध्यन्ते धनभोगान्न सौख्यम् ॥ ॥ पुरा ह्युक्तो नाकरोस्त्वं वचो
    मे द्यूते जितां द्रौपदीं प्रेक्ष्य राजन् । दुर्योधनं वारयेत्यक्षवत्यां कितवत्वं पण्डिता वर्जयन्ति
    ॥ ॥ न तद्बलं यन्मृदुना विरुध्यते मिश्रो धर्मस्तरसा सेवितव्यः । प्रध्वंसिनी क्रूरसमाहिता श्रीर् मृदुप्रौढा
    गच्छति पुत्रपौत्रान् ॥ ॥ धार्तराष्ट्राः पाण्डवान्पालयन्तु पाण्डोः सुतास्तव पुत्रांश्च पान्तु । एकारिमित्राः
    कुरवो ह्येकमन्त्रा जीवन्तु राजन्सुखिनः समृद्धाः ॥ ॥ मेढीभूतः कौरवाणां त्वमद्य त्वय्याधीनं कुरु कुलमाजमीढ
    । पार्थान्बालान्वनवास प्रतप्तान् गोपायस्व स्वं यशस्तात रक्षन् ॥ ॥ सन्धत्स्व त्वं कौरवान्पाण्डुपुत्रैर्
    मा तेऽन्तरं रिपवः प्रार्थयन्तु । सत्ये स्थितास्ते नरदेव सर्वे दुर्योधनं स्थापय त्वं नरेन्द्र ॥ ॥ ॥
    इति श्रीमहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरहितवाक्ये षट्त्रिंशोऽध्यायः ॥
