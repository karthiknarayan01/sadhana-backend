id: tripura-sundari-ashtakam-stotram
category: stotram
name:
  english: Tripura Sundari Ashtakam (Stotram)
content:
  english: kadambavanacarinim munikadambakadambinim nitambajitabhudharam suranitambinisevitam | navamburuhalocanamabhinavambudashyamalam
    trilocanakutumbinim tripurasundarimashraye || || kadambavanavasinim kanakavallakidharinim maharhamaniharinim
    mukhasamullasadvarunim | dayavibhavakarinim vishadarocanacarinim trilocanakutumbinim tripurasundarimashraye
    || || kadambavanashalaya kucabharollasanmalaya kucopamitashailaya gurukripalasadvelaya | madarunakapolaya
    madhuragitavacalaya kayapi ghananilaya kavacita vayam lilaya || || kadambavanamadhyagam kanakamandalopasthitam
    shadamburuhavasinim satatasiddhasaudaminim | vidambitajaparucim vikacacandracudamanim trilocanakutumbinim
    tripurasundarimashraye || || kucancitavipancikam kutilakuntalalankritam kusheshayanivasinim kutilacittavidveshinim
    | madarunavilocanam manasijarisammohinim matangamunikanyakam madhurabhashinimashraye || || smaretprathamapushpinim
    rudhirabindunilambaram grihitamadhupatrikam madavighurnanetrancalam | ghanastanabharonnatam galitaculikam
    shyamalam trilocanakutumbinim tripurasundarimashraye || || sakunkumavilepanamalakacumbikasturikam
    samandahasitekshanam sasharacapapashankusham | asheshajanamohinimarunamalyabhushambaram japakusumabhasuram
    japavidhau smaramyambikam || || purandarapurandhrikacikurabandhasairandhrikam pitamahapativratapatupatiracarcaratam
    | mukundaramanimanilasadalankriyakarinim bhajami bhuvanambikam suravadhutikacetikam || || iti shrimatparamahamsaparivrajakacaryasya
    shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah kritau tripurasundaryashtakam |
  devanagari: कदम्बवनचारिणीं मुनिकदम्बकादम्बिनीं नितम्बजितभूधरां सुरनितम्बिनीसेविताम् । नवाम्बुरुहलोचनामभिनवाम्बुदश्यामलां
    त्रिलोचनकुटुम्बिनीं त्रिपुरसुन्दरीमाश्रये ॥ ॥ कदम्बवनवासिनीं कनकवल्लकीधारिणीं महार्हमणिहारिणीं मुखसमुल्लसद्वारुणीम्
    । दयाविभवकारिणीं विशदरोचनाचारिणीं त्रिलोचनकुटुम्बिनीं त्रिपुरसुन्दरीमाश्रये ॥ ॥ कदम्बवनशालया कुचभरोल्लसन्मालया
    कुचोपमितशैलया गुरुकृपालसद्वेलया । मदारुणकपोलया मधुरगीतवाचालया कयापि घननीलया कवचिता वयं लीलया ॥ ॥ कदम्बवनमध्यगां
    कनकमण्डलोपस्थितां षडम्बुरुहवासिनीं सततसिद्धसौदामिनीम् । विडम्बितजपारुचिं विकचचन्द्रचूडामणिं त्रिलोचनकुटुम्बिनीं
    त्रिपुरसुन्दरीमाश्रये ॥ ॥ कुचाञ्चितविपञ्चिकां कुटिलकुन्तलालङ्कृतां कुशेशयनिवासिनीं कुटिलचित्तविद्वेषिणीम्
    । मदारुणविलोचनां मनसिजारिसम्मोहिनीं मतङ्गमुनिकन्यकां मधुरभाषिणीमाश्रये ॥ ॥ स्मरेत्प्रथमपुष्पिणीं रुधिरबिन्दुनीलाम्बरां
    गृहीतमधुपात्रिकां मदविघूर्णनेत्राञ्चलाम् । घनस्तनभरोन्नतां गलितचूलिकां श्यामलां त्रिलोचनकुटुम्बिनीं
    त्रिपुरसुन्दरीमाश्रये ॥ ॥ सकुङ्कुमविलेपनामलकचुम्बिकस्तूरिकां समन्दहसितेक्षणां सशरचापपाशाङ्कुशाम् ।
    अशेषजनमोहिनीमरुणमाल्यभूषाम्बरां जपाकुसुमभासुरां जपविधौ स्मराम्यम्बिकाम् ॥ ॥ पुरन्दरपुरन्ध्रिकाचिकुरबन्धसैरन्ध्रिकां
    पितामहपतिव्रतापटुपटीरचर्चारताम् । मुकुन्दरमणीमणीलसदलङ्क्रियाकारिणीं भजामि भुवनाम्बिकां सुरवधूटिकाचेटिकाम्
    ॥ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ त्रिपुरसुन्दर्यष्टकम्
    ।
