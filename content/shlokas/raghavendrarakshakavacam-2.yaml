id: raghavendrarakshakavacam-2
category: raksha
name:
  english: raghavendrarakshakavacam
  devanagari: राघवेन्द्ररक्षाकवचम्
content:
  english: shriraghavendrarakshakavacam atha shriraghavendraryarakshakavacamadbhutam | vakshyami damshito
    yena kshemavan vijayi bhavet || 1|| gururajapremaputrah tatprasadapuraskritah | krishnavadhutanama'ham
    tasya sannidhikarakam || 2|| chandah trishtup samakhyatam devata gururat smritah | mantranyasah prakartavyo
    dhyanam vakshyami sadguroh || 3|| karadhritalagudham dhritakshamalam daravivritekshanamambujasanastham
    | daracaladadharam gurum dadhanam varamabhayapranateshtadam smarami || 4|| om purve'tra mam rakshatu
    raghavendro mam dakshine'vyadghanapapahanta | avyatpraticyamabhayapradata patuttarasyam dishi shantikarta
    || 5|| agneyabhage'vatu divyatejah nairityabhage'vatu dushtahanta | vayuvyabhage'vatu vajrakayo mamishabhage'vatu
    siddhidata || 6|| payat shikham me shritaramapadah payat shiro me shashishitavrittih | bhalam mamavyadduradrishtaharta
    bhruvau mamavyadbhavatapaharta || 7|| kurcam mamavyat kulashilashali netre mamavyannayanapradata |
    karnau mamavyadbadhiratvahari gandau mamavyadgaradoshahari || 8|| oshthadharau me'vatu kashtahari
    nasam sada me'vatu nadakari | jihvam sada rakshatu vakpradata dantan sada rakshatu bhakshyadata ||
    9|| payat sada me cibukam yatishah | payat sada me vadanam vratishah | kantham nu kanthiravabhaktavaryah
    skandhau mamavyaddhritapushpamalah || 10|| bhujau mamavyadiha bahudata karau mamavyadvaradanashurah
    | hastangulin me manujapako'vyat vaksho mamavyadghanasamshayacchit || 11|| kukshim mamavyadayamamayaghnah
    parshve mamavyadbhavabhitiharta | sahayyakarta mama patu prishtham katim sada me kanakambaro'vyat
    || 12|| mehamayaghno'vatu me tu guhyam uru sada me'vatu vegashilah | maunavrati me'vatu januni ca
    janghe mamavyajjavanatvadayi || 13|| gulbhau mamavyadgunavarnaniyah padau mamavyatparapiditarih |
    yadyanmamangam na mayoktamatra tattatsamastam ca dayaluravyat || 14|| pitrimshca patnimshca sutamshca
    bandhun pautradikanme sutavatsalo'vyat | vyaghra'hibhallukavarahadanti lulayasimhamshca srigala coran
    || 15|| hatva ca dushtan krimivrishcikanda
  devanagari: श्रीराघवेन्द्ररक्षाकवचम् अथ श्रीराघवेन्द्रार्यरक्षाकवचमद्भुतम् । वक्ष्यामि दंशितो येन क्षेमवान्
    विजयी भवेत् ॥ १॥ गुरुराजप्रेमपुत्रः तत्प्रसादपुरस्कृतः । कृष्णावधूतनामाऽहं तस्य सन्निधिकारकम् ॥ २॥
    छन्दः त्रिष्टुप् समाख्यातं देवता गुरुराट् स्मृतः । मन्त्रन्यासः प्रकर्तव्यो ध्यानं वक्ष्यामि सद्गुरोः
    ॥ ३॥ करधृतलगुढं धृताक्षमालं दरविवृतेक्षणमम्बुजासनस्थम् । दरचलदधरं गुरुं दधानं वरमभयप्रणतेष्टदं स्मरामि
    ॥ ४॥ ॐ पूर्वेऽत्र मां रक्षतु राघवेन्द्रो मां दक्षिणेऽव्याद्घनपापहन्ता । अव्यात्प्रतीच्यामभयप्रदाता
    पातूत्तरस्यां दिशि शान्तिकर्ता ॥ ५॥ आग्नेयभागेऽवतु दिव्यतेजाः नैऋत्यभागेऽवतु दुष्टहन्ता । वायुव्यभागेऽवतु
    वज्रकायो मामीशभागेऽवतु सिद्धिदाता ॥ ६॥ पायात् शिखां मे श्रितरामपादः पायात् शिरो मे शशिशीतवृत्तिः ।
    भालं ममाव्याद्दुरदृष्टहर्ता भ्रुवौ ममाव्याद्भवतापहर्ता ॥ ७॥ कूर्चं ममाव्यात् कुलशीलशाली नेत्रे ममाव्यान्नयनप्रदाता
    । कर्णौ ममाव्याद्बधिरत्वहारी गण्डौ ममाव्याद्गरदोषहारी ॥ ८॥ ओष्ठाधरौ मेऽवतु कष्टहारी नासां सदा मेऽवतु
    नादकारी । जिह्वां सदा रक्षतु वाक्प्रदाता दन्तान् सदा रक्षतु भक्ष्यदाता ॥ ९॥ पायात् सदा मे चिबुकं यतीशः
    । पायात् सदा मे वदनं व्रतीशः । कण्ठं नु कण्ठीरवभक्तवर्यः स्कन्धौ ममाव्याद्धृतपुष्पमालः ॥ १०॥ भुजौ
    ममाव्यादिह बाहुदाता करौ ममाव्याद्वरदानशूरः । हस्ताङ्गुलीन् मे मनुजापकोऽव्यात् वक्षो ममाव्याद्घनसंशयच्छित्
    ॥ ११॥ कुक्षिं ममाव्यादयमामयघ्नः पार्श्वे ममाव्याद्भवभीतिहर्ता । साहाय्यकर्ता मम पातु पृष्ठं कटिं सदा
    मे कनकाम्बरोऽव्यात् ॥ १२॥ मेहामयघ्नोऽवतु मे तु गुह्यं ऊरू सदा मेऽवतु वेगशीलः । मौनव्रती मेऽवतु जानुनी
    च जङ्घे ममाव्याज्जवनत्वदायी ॥ १३॥ गुल्भौ ममाव्याद्गुणवर्णनीयः पादौ ममाव्यात्परपीडितारिः । यद्यन्ममाङ्गं
    न मयोक्तमत्र तत्तत्समस्तं च दयालुरव्यात् ॥ १४॥ पितॄंश्च पत्नींश्च सुतांश्च बन्धून् पौत्रादिकान्मे
    सुतवत्सलोऽव्यात् । व्याघ्राऽहिभल्लूकवराहदन्ती लुलायसिंहांश्च सृगाल चोरान् ॥ १५॥ हत्वा च दुष्टान् कृमिवृश्चिकाण्ड
