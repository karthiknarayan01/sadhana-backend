id: sri-krishna-sahasra-nama-stotram
category: stotram
name:
  english: Sri Krishna Sahasra Nama Stotram
  devanagari: स्तोत्रम्
content:
  english: om shri krishnaya paramatmane namah | dhyanam - anantanamakam krishnam kripavarsham kriparnavam
    | bhaktya namasahasrena stotumicchami sarvada || 1|| shri krishnacandra! sarvesha! stravyarupa! stutipriya
    | venugopala! radhesha! stotum tvam dehi me varam || 2|| premarpitamanobuddhim, dehi me karunanidhe!
    | nilasundararupasya, dehi me divyadarshanam || 3|| atha shrikrishnasahasranamastotram prarabhyate
    | harih om - om radhikesham jagannatham mohanam vanamalinam | nandasunum mahavishnum mukundam madhusudanam
    || 1|| devakinandanam shyamam vasudevam jaganmayam | yashodatanayam krishnam kundaladvayabhushanam
    || 2|| ambujaksham kripapurnam venuvadanasundaram | nilavarnam ghanashyamam navaniradasannibham ||
    3|| vishalaphalam sumukham sundaradyutipuritam | shyamasundaragopalam lilamanushavigraham || 4|| gopinatham
    cittacoram suryakotisamaprabham | raseshvaram rasalolam rasamandalavarttinam || 5|| gopimandalamad|hdhyastham
    nrittakelirasapradam | karunyamritanetram ca mahaniyagunanvitam || 6|| sundarangam carurupamindivaranibhananam
    | nilaprabham kambukantham kaustubhadyutishobhitam || 7|| nilavarnakapolabham kasturitilakanvitam
    | candanaliptagatram ca vakshahsthalasushobhanam || 8|| maninimanadam shridam vanyamalavibhushitam
    | rasaramyam komalangam premalilaparam jitam || 9|| kamadarpaharam kantam venuganavisharadam | kamadam
    kamajanakam kamavarjitamanasam || 10|| pitambaradharam saumyamanandarasavardhakam | rupalavanyasaram
    ca venuvadanatatparam || 11|| komalanghrisarojabham shinjannupurasundaram | bhaktahridpadmanilayam
    sarvamangalakarakam || 12|| nrittakelirasanandam gopicitrapramodakam | sarvangasundaram nilam vikasanmukhapankajam
    || 13|| carunetram caruvarnam carucandrananaprabham | candavalisupujyam ca nrittamandalamad|hdhyagam
    || 14|| venujushtamukhambhojam ramaniyananaprabham | atyantakomalam shyamasundaram rupamohanam ||
    15|| manjirashinjitam nadam nanarasavivardhakam | rangarangavisheshabham vividhasvaranadanam || 16||
    vishalaksham vishvavandyam venunadarasapriyam | manjiracaranam bhavyam maninupurashinjitam || 17||
    ambhoruhasamanabham sarvasaundaryasaradam | shyamalangaprabhapurnam divyakomalavigraham || 18|| madhurapremasaram
    ca krishnakhyam jagadishvaram | radhesham radhikavandyam gopikapremavardhakam || 19|| vrindaranyaviharam
    ca yamunapulineshvaram | govrindacarinam gopam gopabalasamavritam || 20|| lilanaram kelisaktam karunarasavatsalam
    | kunjanukunjasukridam padavinyasashobhitam || 21|| vanamalashobhitangam divyagatraprabhojjvalam |
    divyagandhanuliptam ca shrivatsankitavakshasam || 22|| ganalolam rasonmattam navanitarasapriyam |
    gopimanasacoram ca divyashobhatibhasuram || 23|| divyanrittarasollasam kamamohanasundaram | kutilalakabarhabham
    ratnakinkinibhushitam || 24|| saundaryodayasukshmangam susmeravadanambujam | alivrindakarshanam ca
    vanamalavibhushitam || 25|| atulapremasaram shri radhikapremasagaram | natanakritiramyam ca divyapremarasamritam
    || 26|| sujatam supriyam sukshmam manomandiravasinam | svayamnjyotihshyamavarnam sharadendunibhananam
    || 27|| caracara jagannatham jagadvandyam jagadgurum | pranatakleshanasham ca bhaktamanasaranjanam
    || 28|| radheshvaram rasakridam kalavenusukucitam | karindrapujitam mulam kariviravarapradam || 29||
    jitakamam jitakrodham kalikanmashanashanam | ramanujam hrishikesham venugopalasundaram || 30|| phanarttidam
    balakrishnam phanidarpavinashakam | gandharvapsarasam pujyam suravrindanishevitam || 31|| kaladinatham
    sampurnam sangitarasalolupam | vrajanarisamakrishtam manikankanabhushitam || 32|| nandagopasadanandam
    yashodanandasagaram | sarvalokaikavandyam ca nityanirmalamanusham || 33|| candrananam caruhasam carucandanacarcitam
    | bhaktapriyam bhaktapujyam bhaktigamyam bhayapaham || 34|| saccinmayam satsvarupam sarvasangavivarjitam
    | sarvarambhanidanam cidanandamritapuritam || 35|| liladhritagirishreshtham indradarpaharam shamam
    | abalavrindasampujyam suradhenusupujitam || 36|| sarvabhishtapradataram kaliyahivimardakam | gitakirttivishesham
    ca nilavarnavarananam || 37|| satyavratam saccaritam saccidanandavigraham | govrindanucaram pujyam
    gopabalagragaminam || 38|| sucarunatanam ramyam sarvasaram sukhodayam | ulukhalanibaddham ca sarvabandhavimocakam
    || 39|| pushpasaundaryalolam ca pushpagandhanusevitam | rajivacaranam nanavanarajinishevitam || 40||
    nistulam nirmamam shantam niralambam nirashayam | anandabdhim dayasindhum varenyam varadam vibhum
    || 41|| vrindavaneshvaram shreshtham premanandavivarshanam | nityamuktasvarupam ca nityanandavarapadam
    || 42|| akhileshamameyam ca satyam tribhuvaneshvaram | cidakashasthitam sarvacittagudhanivasinam ||
    43|| padmapatravishalaksham barhalankritakuntalam | sundarabhruvilasam ca bimbadharasumohanam || 44||
    dhritavenum ganaramyam nrittasundaramanusham | svararupam nadarupam shabdabrahmamritam sukham || 45||
    nanaratnalankritangam sundaralakasamvritam | gopanaricittacoram krishnam gopalasundaram || 46|| punyagandhatidivyangam
    divyabhaparipuritam | lambamalavilasitam vandaniyamamanusham || 47|| paranandam parasevyam padmakesarasundaram
    | sarojadalanetrabham vanditam vanacarinam || 48|| purusham shashvatam sukshmam nigudham purushottamam
    | hridayastham guhavasam sarvabhutaniketanam || 49|| sarvabhutantaratmanam naram narayanam param |
    sarvabhutadhivasam ca sarvabhutahridisthitam || 50|| acyutanandagovindam krishnam gopalavigraham |
    divyanandam nijanandam gopimanasamohanam || 51|| yashodanandanam jishnum devakigarbhasambhavam | shyamakomalagopalam
    vasudevapriyatmajam || 52|| gopagopisadasevyam yamunapulinecaram | gopanarijanapreshtham cancalekshanasundaram
    || 53|| divyajyotihsvarupam cidanandarasarupinam | atmanandam paranandam cidekarasapuritam || 54||
    premanandam sukhanandam karunarasasagaram | pavitram paramanandam shyamalabhaprapuritam || 55|| radhapremasudhasaram
    premamadhuryavarshanam | natyanarttanahridyam ca natanakritisundaram || 56|| karavenuravanandam padapamsusumangalam
    | sucarucaranam karnapiyushasvaranadanam || 57|| nilaprabhapurnagatram niladyuti samavritam | nilambudaghanashyamam
    premasvadanalolupam || 58|| premamanasasampujyam manomandiravasinam | bhaktirupam bhaktasevyam bhaktamanasapujitam
    || 59|| gokuleshvarasarvesham goparajakumarakam | dhenuvrindanugamanam vrajagopalabalakam || 60||
    janmamrityuvinirmuktam nanalilavatarakam | yashodanandaputrakhyam narajanmavinodakam || 61|| matripremapayahpritam
    radhikapremalolupam | kridantam nandagehastham balagopalavigraham || 62|| putanaghatakam sarvajivacittaprashamakam
    | balakridasamasaktam yashodapriyavatsalam || 63|| govatsavrindanucaram govrindanveshanotsukam | venuganarasollasam
    gopakanyaprasadakam || 64|| vanamalalankritangam ratnakankanabhushitam | tamalasundarashyamam karavenusushobhanam
    || 65|| phanindramardanakridam sahasraphanamardakam | phanaratnadyutivyaptapadapankajashobhitam ||
    66|| nrittalilavisheshabham kaliyarttivinashakam | sugitakirttisampujyam punyashravanakirttanam ||
    67|| gopalakhyam daityakalam shakatasurabhanjanam | govardhanacaloddharam gopagovrindasaukhyadam ||
    68|| yashodanandadataram nitantasukhadayakam | shridharam shrimukhambhojam radhamadhavasundaram ||
    69|| trinavarttamatikrantam yamalarjunabhanjanam | damodaram damabaddham vrajanarijanapriyam || 70||
    niranjanam nityashuddham nityanandasukhaspadam | narayanamanadyantam nirapeksham nijashritam || 71||
    kritananavataram ca lilagopalavigraham | nanayonisamasinam brahmayonimayonijam || 72|| goparajam narashreshtham
    nrittagopalasundaram | venugopalabalam ca nandagokulanayakam || 73|| angalavanyasampurnam yashodapritibhajanam
    | radhapremarasanandam pronmukham hladinipriyam || 74|| candanaliptanilangam mahoraskam sumalinam
    | gopikapremasaubhagyam premacoram sukhashrayam || 75|| aparamahimanam ca projjvalam mulakaranam |
    abhishtavaradataramaprameyamagocaram || 76|| kinkinijalavitangam pitakausheyavasasam | nilavarnavisheshabham
    tatidvarnambaraprabham || 77|| kaustubhadyutisamvyaptam karnabharanabhushitam | nilasphatikatulyabham
    purnacandraprabhananam || 78|| alolakundaladvandvam acchasphatikanirmalam | jaganmohanalavanyam kritapunyavarapradam
    || 79|| atindriyamanovacam nikhilam cetasamparam | caracaratmakam vyaktam sarvajivasamashrayam ||
    80|| nityajnanam nirupamam gitadharmaprabodhakam | samsarasagarottaram karunarasasagaram || 81|| vanyabhojyarasanandam
    gopabalakanayakam | khagavrindasamakarsham mallikakusumapriyam || 82|| nanalatakrishtacittam pushpasaundaryalalasam
    | vrikshamulasukhasinam shitalachayayavritam || 83|| phalamadhuryalolam ca sarvakarmaphalapradam |
    dhenukasurasamharam talapakvaphalashanam || 84|| mallaviravijetaram mallavidyavisharadam | kamsamuktipradataram
    hastiviraprapidanam || 85|| satyadharmaparitranam marttyadharmaprabodhakam | coragraganyagopalam papacoram
    kripakaram || 86|| antarbahihsthitam vishvam sthulasukshmam ca karanam | vyaktavyaktasvarupam ca paramatmaprakashakam
    || 87|| keshavam kamalanatham sukesham keshisudanam | nityanirmuktamekam ca nistulam niratikramam
    || 88|| girirajadharam balam devendramakhabhanjanam | varshadharaprashamanam premadharavivarshanam
    || 89|| kamadhenupayassiktam govindam girigocaram | hritadarpendrasampujyam gokulapritivardhanam ||
    90|| brahmandakotigarbhastham mridbhakshakamanamayam | mukhantahsthatribhuvanam yashodadbhutadarshshanam
    || 91|| sanatanam nityasatyamamaram suranayakam | niravadyam nishprapancam prapancam nikhileshvaram
    || 92|| yadushreshtham ramanatham krishnam pranadhikapriyam | radhanandam sadanandam balagopam yaduttamam
    || 93|| partthivam prithivinatham mridulam partthasarathim | bakarimaghasamharam brahmadevanamaskritam
    || 94|| balavesham vatsarupam dhenurupam shishum priyam | kritananaruparamyam brahmamohanivaranam
    || 95|| daivasampattidataram mucukundaprasadakam | asuraghnam shishtapalam susmritam shokanashanam
    || 96|| gajendrasamstutam stavyam hastihastaprapujitam | adimulam sarvamulam nirmulam vishvamulakam
    || 97|| akruravaradam pujyam vaikunthanilayam shrutam | jalantarnilayam carudarshshanam sukhadarshshanam
    || 98|| premonmukhamanahpreshtham premapiyushasagaram | radhikapremarajyam ca premanandavidhayakam
    || 99|| krishnacandram yadavendram yadurajakumarakam | yamunatirasancaram jalakridaratam caram ||
    100|| gopikaramanam rajam rasikam rasikeshvaram | rasikonmattam rasollasam tulasidamashobhitam ||
    101|| (rasonmattam) karnanandam rasanandam sarvendriyasukhapradam | manovakkarmajetaram cittagam cittaranjanam
    || 102|| animittam tullyahinam cidbhavam bhavanashanam | amoghamamarashreshtham krishnam nistulavikramam
    || 103|| daivasampadvidhataram varahadisvarupinam | matsyarupam kurmarupam bhargavam bharatagrajam
    || 104|| halayudham balaramam varunimadavihvalam | yamunakarshanam viram supritirasavardhanam || 105||
    asurashreshthasamharam nrisimham bhayaharinam | harim prahladavaradam sarvalokasukhavaham || 106||
    krishnam kapatagopalam kamaniyam varananam | sukumaram susmitabham sundaram sukalevaram || 107|| nadantam
    bindurupam ca gunarupam kalatmakam | adirupam kalarupam caturvagatmakam svaram || 108|| venuganam
    ramyanadam klinkaram vaikhariravam | kalapurnam kalatitam onkaraninadam kalam || 109|| adinatham bijarupam
    gitamritakalamritam | svaramritam shabdasaram bhavarupam kripamritam || 110|| sugunam kalasankalpam
    gunatitam gunotbhavam | sadasatsarvarupam ca shabdabrahmadikam bhavam || 111|| haiyangavashanasaktam
    mishtannasukhalolupam | susvadurasalolam ca gopikapremabhajanam || 112|| balakelirasonmattam navakelirasapriyam
    | acalam nishcalam shuddham capalam cancalam calam || 113|| cidakasham cidadityam citprasannam cidatmakam
    | cittakasham citprakasham cijjyotishcetanamritam || 114|| gopikapremakamam ca radhikahridayeshvaram
    | nityakamam nikamam ca kamasankalpavarjitam || 115|| jivamritam kripalum ca saumyarupam dayaparam
    | shantidam shantashilam ca shaminam karunakaram || 116|| venusanjushtaramyangam adharamritashobhanam
    | tulasidalamalabham nupuradvayabhushanam || 117|| paranjyotih parandhama paramanum paratparam | aniyamsam
    mahiyamsam sthulasukshmadimulakam || 118|| karmad|hdhyaksham karmahinam karmatitamakarmakam | sakarmakam
    nishkriyam ca karmagam karmamocakam || 119|| sajjanabhishtadam shishtam dhenukasuramardanam | vrajabalam
    pritirupam krishnamatmasakham gurum || 120|| pralambavadhakamam ca balaramanujam balam | putanapranahartaram
    halayudhagadayudham || 121|| manobuddhindriyapranam prajnanam paramam phalam | jnanadam jnanagamyam
    ca vijnananandamandalam || 122|| shrikrishnam jagadad|hdhyaksham radhikapranavallabham | sarvendriyapranadharmam
    sarvagam sarvakarshanam || 123|| sushilam rajagopalam shitalam shyamalaprabham | dhritavadyam shabdasaram
    gayakam kirttidayakam || 124|| govardhanadrisancaram trinanveshanatatparam | govatsananudhavantam
    godhanam goparigraham || 125|| markkataplavanodyuktam balakam kelilalasam | tamalanilam sushyamam
    karunyadrutamanasam || 126|| amoghadarshshanam pritam paripavanakirttidam | rasam saram sarvasaram
    rasasarasudhamayam || 127|| mayurasamanrittam ca barhabhavritakuntalam | hamsanrittam hamsagatim kokilaravakujitam
    || 128|| padmanabham padmanetram padmabham padmajarcitam | nilapadmasamanabham padapadmasupujitam
    || 129|| divyangam divyanatanam divyapremapraharshanam | divyabhapuritangam ca divyabhavaniveshanam
    || 130|| kritakrityam karmahetum sakshinam karmanishkritim | sannikarsham viduram ca kutastham kapatakritim
    || 131|| satvayonim sangahinam sadhupujyam sumanasam | satvashuddham satyarupam satvakaram sadashubham
    || 132|| shrikrishnam gokulapreshtham vrindaranyanivasinam | vanyajivisamakrishtam markkatadyanukarinam
    || 133|| kokilananukujantam shabdaghosharasapriyam | kridonmattam carunrittamadyantam naranayakam
    || 134|| lilakritim sunritam ca sakalam sannutam shivam | hemanginipriyam natham nirvairam padmamalinam
    || 135|| manikantham hamsarupam vaikuntham pakshivahanam | hamsadhirudham lakshmisham jayam ca vijayam
    shuci || 136|| sudarshanam yogipujyam yogesham ca yugeshvaram | yogeshvaram yogagamyam krishnam yogeshvareshvaram
    || 137|| adimad|hdhyantasamvyaptam kalantam yugasambhavam | yogamargapranetaram sukritam brahmacarinam
    || 138|| kamakotivijetaramanakadundubhipriyam | premasutranibaddham ca bhavabandhavimocakam || 139||
    gitacaryam kalarupam vishvarupapradarshshakam | jnanavijnanarupam ca madhurapremabhashanam || 140||
    riturajam vasantabham sharadvandyam pravarshanam | grishmavegam ca hemantam shishiram shishusannibham
    || 141|| mayurakukkutasakham meghagarjanaghoshanam | meghanadam meghanibham mayurapriyakarinam ||
    142|| kalindisalilonmajjam keyuradyairalankritam | hastatadanasukridam gopakanyaprapujitam || 143||
    kattyayaninutam kirttim kattyayanyarcitam shriyam | ishtadevam pujaniyam prartthitam ca patim prabhum
    || 144|| kanyarcitam kamavaramakamam kamanashanam | sammohanam varishtam ca kaminikamadam jitam ||
    145|| jitamoham kamarupam mohiniveshadharinam | jitadaityam devadutam devakaryasurakshakam || 146||
    premamritam cidamritam jnanamritavivarshanam | nirmoham nispriham yuktam nirasaktam nijashayam ||
    147|| bhutam bhutadikam bhavyam nirdosham doshavarjitam | niriham nandaputram ca yashodanandavardhanam
    || 148|| bhavonmukham bhavatitam bhavishyantam bhavashritam | bhavamohavinirmuktam nirbhavam bhavarupinam
    || 149|| taijasam jyotiradityam prakasham tejasampatim | jyotirmukham ca cijjyotirbhaskaram ravimandalam
    || 150|| candraprabham meghanilamanantakiranodbhavam | divyakasham nilajalamanilam nilavarshanam ||
    151|| nilarnavam nilanilam sunilam nilasundaram | nilam ca nilasarvangam nilarambham sunilakam ||
    152|| kamarim kamavegam ca sarvakamavaram smaram | kamsarim kalakalam ca kamsasaubhagyapurakam ||
    153|| dvarakadhipatim shrisham rukminisahitam shriyam | jagadisham partthasakham satyabhamaratam patim
    || 154|| sarvalokakutumbastham premasamrajyanayakam | shodashastrisahasresham maninimanasapriyam ||
    155|| payodhivasinam krishnam payancoram payonidhim | radhapremapayahpritam premapayasalolupam ||
    156|| pranavam pranavavantahstham nadabindukaladikam | nadantahstham nadasukshmam bindum nadasumangalam
    || 157|| onkaram svarasampushtam klinnadam svarasamyutam | svararagasudhasevyam vaikhariravakujanam
    || 158|| bhavayuktam bhavavegam bhavapurnam bhavacchidam | bhavojjvalam bhavarupam bhavavegavimocakam
    || 159|| bhavottaram bhagavatam bhavamoksham bhavetaram | bhavopetam bhavantahstham bhajaniyam paranmukham
    || 160|| anishtamishtam sampushtam susvaram kalakujanam | rasakridasamasaktam gopikapreshthanayakam
    || 161|| prajnanam supradhanam ca prakatam purusheshvaram | virajaskam satvapurnam manonilayamadbhutam
    || 162|| vacamagocaram vyaktanajanim janmanashanam | marttyam mrityuvihinam ca nrirupam yadavotbhavam
    || 163|| aranyavasam yogendramabhivandyam sudarshanam | atmabhidham shrutistutyam kutastham kutapurusham
    || 164|| digvilasam daivikam ca devakaryavarapradam | upendram hridayantahstham vamanam danavarcitam
    || 165|| balidarpaharam hrasvam yajnavatasamagatam | tripadam bhuvanavyaptam vipram kapatabhashinam
    || 166|| tripadakrantabhuvanam vikramam ca trivikramam | ahammamadihantaram vatuvamanarupinam || 167||
    brahma brahmamayam vishnum brahmakhyam jagadishvaram | shivam shivakaram shuddham markkandeyavarapradam
    || 168|| mayatitam mayinam ca mayashritamamayakam | nityamuktasvabhavam ca mayagunavivarjitam || 169||
    mayagunam nimayam ca mayesham trigunatmakam | trimurttim trigunodbhutam mayasangavimocakam || 170||
    anandam ca pramodam ca mangalam sarvamangalam | sukshmadisukshmam prakatam sukshmatattvam ca sukshmagam
    || 171|| shrikrishnacandram shrinatham radhapremadhikapriyam | shrivatsankam shriniketam vrajanarivimohanam
    || 172|| shyamalam komalam vande, yadunatham yaduttamam | sundaram venugopalam cinmayam sumanoharam
    || 173|| hridayastham sada vande, vande premapayonidhim | krishnam vande priyatmanam, vande radheshasundaram
    || 174|| iti svami ishvaranandasarasvati viracitam shri shrikrishnasahasranamastotram sampurnam ||
    mangalam venugopala! mangalam purushottama | mangalam carusarvanga! mangalam hridayeshvara ||
  devanagari: ॐ श्री कृष्णाय परमात्मने नमः । ध्यानं - अनन्तनामकं कृष्णं कृपावर्षं कृपार्णवम् । भक्त्या
    नामसहस्रेण स्तोतुमिच्छामि सर्वदा ॥ १॥ श्री कृष्णचन्द्र! सर्वेश! स्त्रव्यरूप! स्तुतिप्रिय । वेणुगोपाल!
    राधेश! स्तोतुं त्वां देहि मे वरम् ॥ २॥ प्रेमार्पितमनोबुद्धिं, देहि मे करुणानिधे! । नीलसुन्दररूपस्य,
    देहि मे दिव्यदर्शनम् ॥ ३॥ अथ श्रीकृष्णसहस्रनामस्तोत्रं प्रारभ्यते । हरिः ॐ - ॐ राधिकेशं जगन्नाथं मोहनं
    वनमालिनम् । नन्दसूनुं महाविष्णुं मुकुन्दं मधुसूदनम् ॥ १॥ देवकीनन्दनं श्यामं वासुदेवं जगन्मयम् । यशोदातनयं
    कृष्णं कुण्डलद्वयभूषणम् ॥ २॥ अम्बुजाक्षं कृपापूर्णं वेणुवादनसुन्दरम् । नीलवर्णं घनश्यामं नवनीरदसन्निभम्
    ॥ ३॥ विशालफालं सुमुखं सुन्दरद्युतिपूरितम् । श्यामसुन्दरगोपालं लीलामानुषविग्रहम् ॥ ४॥ गोपीनाथं चित्तचोरं
    सूर्यकोटिसमप्रभम् । रासेश्वरं रासलोलं रासमण्डलवर्त्तिनम् ॥ ५॥ गोपिमण्डलमद्।ह्ध्यस्थं नृत्तकेलिरसप्रदम्
    । कारुण्यामृतनेत्रं च महनीयगुणान्वितम् ॥ ६॥ सुन्दराङ्गं चारुरूपमिन्दीवरनिभाननम् । नीलप्रभं कम्बुकण्ठं
    कौस्तुभद्युतिशोभितम् ॥ ७॥ नीलवर्णकपोलाभं कस्तूरीतिलकान्वितम् । चन्दनालिप्तगात्रं च वक्षःस्थलसुशोभनम्
    ॥ ८॥ मानिनीमानदं श्रीदं वन्यमालाविभूषितम् । रासरम्यं कोमलाङ्गं प्रेमलीलापरं जितम् ॥ ९॥ कामदर्पहरं
    कान्तं वेणुगानविशारदम् । कामदं कामजनकं कामवर्जितमानसम् ॥ १०॥ पीताम्बरधरं सौम्यमानन्दरसवर्धकम् । रूपलावण्यसारं
    च वेणुवादनतत्परम् ॥ ११॥ कोमलाङ्घ्रिसरोजाभं शिञ्जन्नूपुरसुन्दरम् । भक्तहृद्पद्मनिलयं सर्वमङ्गलकारकम्
    ॥ १२॥ नृत्तकेलिरसानन्दं गोपीचित्रप्रमोदकम् । सर्वाङ्गसुन्दरं नीलं विकसन्मुखपङ्कजम् ॥ १३॥ चारुनेत्रं
    चारुवर्णं चारुचन्द्राननप्रभम् । चन्दावलीसुपूज्यं च नृत्तमण्डलमद्।ह्ध्यगम् ॥ १४॥ वेणुजूष्टमुखाम्भोजं
    रमणीयाननप्रभम् । अत्यन्तकोमलं श्यामसुन्दरं रूपमोहनम् ॥ १५॥ मञ्जीरशिञ्जितं नादं नानारसविवर्धकम् । रङ्गरङ्गविशेषाभं
    विविधस्वरनादनम् ॥ १६॥ विशालाक्षं विश्ववन्द्यं वेणुनादरसप्रियम् । मञ्जीरचरणं भव्यं मणिनूपुरशिञ्जितम्
    ॥ १७॥ अम्भोरुहसमानाभं सर्वसौन्दर्यसारदम् । श्यामलाङ्गप्रभापूर्णं दिव्यकोमलविग्रहम् ॥ १८॥ मधुरप्रेमसारं
    च कृष्णाख्यं जगदीश्वरम् । राधेशं राधिकावन्द्यं गोपिकाप्रेमवर्धकम् ॥ १९॥ वृन्दारण्यविहारं च यमुनापुलिनेश्वरम्
    । गोवृन्दचारिणं गोपं गोपबालसमावृतम् ॥ २०॥ लीलानरं केलिसक्तं करुणारसवत्सलम् । कुञ्जानुकुञ्जसुक्रीडं
    पादविन्यासशोभितम् ॥ २१॥ वनमालाशोभिताङ्गं दिव्यगात्रप्रभोज्ज्वलम् । दिव्यगन्धानुलिप्तं च श्रीवत्साङ्कितवक्षसम्
    ॥ २२॥ गानलोलं रसोन्मत्तं नवनीतरसप्रियम् । गोपीमानसचोरं च दिव्यशोभातिभासुरम् ॥ २३॥ दिव्यनृत्तरसोल्लासं
    काममोहनसुन्दरम् । कुटिलालकबर्हाभं रत्नकिङ्किणिभूषितम् ॥ २४॥ सौन्दर्योदयसूक्ष्माङ्गं सुस्मेरवदनाम्बुजम्
    । अलिवृन्दाकर्षणं च वनमालाविभूषितम् ॥ २५॥ अतुलप्रेमसारं श्री राधिकाप्रेमसागरम् । नटनाकृतिरम्यं च दिव्यप्रेमरसामृतम्
    ॥ २६॥ सुजातं सुप्रियं सूक्ष्मं मनोमन्दिरवासिनम् । स्वयंञ्ज्योतिःश्यामवर्णं शारदेन्दुनिभाननम् ॥ २७॥
    चराचर जगन्नाथं जगद्वन्द्यं जगद्गुरुम् । प्रणतक्लेशनाशं च भक्तमानसरञ्जनम् ॥ २८॥ राधेश्वरं रसक्रीडं
    कलवेणुसुकूचितम् । करीन्द्रपूजितं मूलं करिवीरवरप्रदम् ॥ २९॥ जितकामं जितक्रोधं कलिकन्मषनाशनम् । रामानुजं
    हृषीकेशं वेणुगोपालसुन्दरम् ॥ ३०॥ फणार्त्तिदं बालकृष्णं फणिदर्पविनाशकम् । गन्धर्वाप्सरसां पूज्यं सुरवृन्दनिषेवितम्
    ॥ ३१॥ कलादिनाथं सम्पूर्णं सङ्गीतरसलोलुपम् । व्रजनारीसमाकृष्टं मणिकङ्कणभूषितम् ॥ ३२॥ नन्दगोपसदानन्दं
    यशोदानन्दसागरम् । सर्वलोकैकवन्द्यं च नित्यनिर्मलमानुषम् ॥ ३३॥ चन्द्राननं चारुहासं चारुचन्दनचर्चितम्
    । भक्तप्रियं भक्तपूज्यं भक्तिगम्यं भयापहम् ॥ ३४॥ सच्चिन्मयं सत्स्वरूपं सर्वसङ्गविवर्जितम् । सर्वारम्भनिदानं
    चिदानन्दामृतपूरितम् ॥ ३५॥ लीलाधृतगिरिश्रेष्ठं इन्द्रदर्पहरं शमम् । आबालवृन्दसम्पूज्यं सुरधेनुसुपूजितम्
    ॥ ३६॥ सर्वाभीष्टप्रदातारं कालियाहिविमर्दकम् । गीतकीर्त्तिविशेषं च नीलवर्णवराननम् ॥ ३७॥ सत्यव्रतं सच्चरितं
    सच्चिदानन्दविग्रहम् । गोवृन्दानुचरं पूज्यं गोपबालाग्रगामिनम् ॥ ३८॥ सुचारुनटनं रम्यं सर्वसारं सुखोदयम्
    । उलूखलनिबद्धं च सर्वबन्धविमोचकम् ॥ ३९॥ पुष्पसौन्दर्यलोलं च पुष्पगन्धानुसेवितम् । राजीवचरणं नानावनराजिनिषेवितम्
    ॥ ४०॥ निस्तुलं निर्ममं शान्तं निरालम्बं निराशयम् । आनन्दाब्धिं दयासिन्धुं वरेण्यं वरदं विभुम् ॥ ४१॥
    वृन्दावनेश्वरं श्रेष्ठं प्रेमानन्दविवर्षणम् । नित्यमुक्तस्वरूपं च नित्यानन्दवरपदम् ॥ ४२॥ अखिलेशममेयं
    च सत्यं त्रिभुवनेश्वरम् । चिदाकाशस्थितं सर्वचित्तगूढनिवासिनम् ॥ ४३॥ पद्मपत्रविशालाक्षं बर्हालङ्कृतकुन्तलम्
    । सुन्दरभ्रूविलासं च बिम्बाधरसुमोहनम् ॥ ४४॥ धृतवेणुं गानरम्यं नृत्तसुन्दरमानुषम् । स्वररूपं नादरूपं
    शब्दब्रह्मामृतं सुखम् ॥ ४५॥ नानारत्नालङ्कृताङ्गं सुन्दरालकसंवृतम् । गोपनारीचित्तचोरं कृष्णं गोपालसुन्दरम्
    ॥ ४६॥ पुण्यगन्धातिदिव्याङ्गं दिव्याभापरिपूरितम् । लम्बमालाविलसितं वन्दनीयममानुषम् ॥ ४७॥ परानन्दं परासेव्यं
    पद्मकेसरसुन्दरम् । सरोजदलनेत्राभं वन्दितं वनचारिणम् ॥ ४८॥ पुरुषं शाश्वतं सूक्ष्मं निगूढं पुरुषोत्तमम्
    । हृदयस्थं गुहावासं सर्वभूतनिकेतनम् ॥ ४९॥ सर्वभूतान्तरात्मानं नरं नारायणं परम् । सर्वभूताधिवासं च
    सर्वभूतहृदिस्थितम् ॥ ५०॥ अच्युतानन्दगोविन्दं कृष्णं गोपालविग्रहम् । दिव्यानन्दं निजानन्दं गोपीमानसमोहनम्
    ॥ ५१॥ यशोदानन्दनं जिष्णुं देवकीगर्भसम्भवम् । श्यामकोमलगोपालं वसुदेवप्रियात्मजम् ॥ ५२॥ गोपगोपीसदासेव्यं
    यमुनापुलिनेचरम् । गोपनारीजनप्रेष्ठं चञ्चलेक्षणसुन्दरम् ॥ ५३॥ दिव्यज्योतिःस्वरूपं चिदानन्दरसरूपिणम्
    । आत्मानन्दं परानन्दं चिदेकरसपूरितम् ॥ ५४॥ प्रेमानन्दं सुखानन्दं करुणारससागरम् । पवित्रं परमानन्दं
    श्यामलाभाप्रपूरितम् ॥ ५५॥ राधाप्रेमसुधासारं प्रेममाधुर्यवर्षणम् । नाट्यनर्त्तनहृद्यं च नटनाकृतिसुन्दरम्
    ॥ ५६॥ करवेणुरवानन्दं पादपांसुसुमङ्गलम् । सुचारुचरणं कर्णपीयूषस्वरनादनम् ॥ ५७॥ नीलप्रभापूर्णगात्रं
    नीलद्युति समावृतम् । नीलाम्बुदघनश्यामं प्रेमास्वादनलोलुपम् ॥ ५८॥ प्रेममानससम्पूज्यं मनोमन्दिरवासिनम्
    । भक्तिरूपं भक्तसेव्यं भक्तमानसपूजितम् ॥ ५९॥ गोकुलेश्वरसर्वेशं गोपराजकुमारकम् । धेनुवृन्दानुगमनं व्रजगोपालबालकम्
    ॥ ६०॥ जन्ममृत्युविनिर्मुक्तं नानालीलावतारकम् । यशोदानन्दपुत्राख्यं नरजन्मविनोदकम् ॥ ६१॥ मातृप्रेमपयःप्रीतं
    राधिकाप्रेमलोलुपम् । क्रीडन्तं नन्दगेहस्थं बालगोपालविग्रहम् ॥ ६२॥ पूतनाघातकं सर्वजीवचित्तप्रशामकम्
    । बालक्रीडासमासक्तं यशोदाप्रियवत्सलम् ॥ ६३॥ गोवत्सवृन्दानुचरं गोवृन्दान्वेषणोत्सुकम् । वेणुगानरसोल्लासं
    गोपकन्याप्रसादकम् ॥ ६४॥ वनमालालङ्कृताङ्गं रत्नकङ्कणभूषितम् । तमालसुन्दरश्यामं करवेणुसुशोभनम् ॥ ६५॥
    फणीन्द्रमर्दनाक्रीडं सहस्रफणमर्दकम् । फणरत्नद्युतिव्याप्तपादपङ्कजशोभितम् ॥ ६६॥ नृत्तलीलाविशेषाभं कालियार्त्तिविनाशकम्
    । सुगीतकीर्त्तिसम्पूज्यं पुण्यश्रवणकीर्त्तनम् ॥ ६७॥ गोपालाख्यं दैत्यकालं शकटासुरभञ्जनम् । गोवर्धनाचलोद्धारं
    गोपगोवृन्दसौख्यदम् ॥ ६८॥ यशोदानन्ददातारं नितान्तसुखदायकम् । श्रीधरं श्रीमुखाम्भोजं राधामाधवसुन्दरम्
    ॥ ६९॥ तृणावर्त्तमतिक्रान्तं यमलार्जुनभञ्जनम् । दामोदरं दामबद्धं व्रजनारीजनप्रियम् ॥ ७०॥ निरञ्जनं नित्यशुद्धं
    नित्यानन्दसुखास्पदम् । नारायणमनाद्यन्तं निरपेक्षं निजाश्रितम् ॥ ७१॥ कृतनानावतारं च लीलागोपालविग्रहम्
    । नानायोनिसमासीनं ब्रह्मयोनिमयोनिजम् ॥ ७२॥ गोपराजं नरश्रेष्ठं नृत्तगोपालसुन्दरम् । वेणुगोपालबालं च
    नन्दगोकुलनायकम् ॥ ७३॥ अङ्गलावण्यसम्पूर्णं यशोदाप्रीतिभाजनम् । राधाप्रेमरसानन्दं प्रोन्मुखं ह्लादिनीप्रियम्
    ॥ ७४॥ चन्दनालिप्तनीलाङ्गं महोरस्कं सुमालिनम् । गोपिकाप्रेमसौभाग्यं प्रेमचोरं सुखाश्रयम् ॥ ७५॥ अपारमहिमानं
    च प्रोज्ज्वलं मूलकारणम् । अभीष्टवरदातारमप्रमेयमगोचरम् ॥ ७६॥ किङ्किणीजालवीताङ्गं पीतकौशेयवाससम् । नीलवर्णविशेषाभं
    तटिद्वर्णाम्बरप्रभम् ॥ ७७॥ कौस्तुभद्युतिसंव्याप्तं कर्णाभरणभूषितम् । नीलस्फटिकतुल्याभं पूर्णचन्द्रप्रभाननम्
    ॥ ७८॥ आलोलकुण्डलद्वन्द्वं अच्छस्फटिकनिर्मलम् । जगन्मोहनलावण्यं कृतपुण्यवरप्रदम् ॥ ७९॥ अतीन्द्रियमनोवाचं
    निखिलं चेतसाम्परम् । चराचरात्मकं व्यक्तं सर्वजीवसमाश्रयम् ॥ ८०॥ नित्यज्ञानं निरुपमं गीताधर्मप्रबोधकम्
    । संसारसागरोत्तारं करुणारससागरम् ॥ ८१॥ वन्यभोज्यरसानन्दं गोपबालकनायकम् । खगवृन्दसमाकर्षं मल्लिकाकुसुमप्रियम्
    ॥ ८२॥ नानालताकृष्टचित्तं पुष्पसौन्दर्यलालसम् । वृक्षमूलसुखासीनं शीतलछाययावृतम् ॥ ८३॥ फलमाधुर्यलोलं
    च सर्वकर्मफलप्रदम् । धेनुकासुरसंहारं तालपक्वफलाशनम् ॥ ८४॥ मल्लवीरविजेतारं मल्लविद्याविशारदम् । कंसमुक्तिप्रदातारं
    हस्तिवीरप्रपीडनम् ॥ ८५॥ सत्यधर्मपरित्राणं मर्त्त्यधर्मप्रबोधकम् । चोराग्रगण्यगोपालं पापचोरं कृपाकरम्
    ॥ ८६॥ अन्तर्बहिःस्थितं विश्वं स्थूलसूक्ष्मं च कारणम् । व्यक्ताव्यक्तस्वरूपं च परमात्मप्रकाशकम् ॥ ८७॥
    केशवं कमलानाथं सुकेशं केशिसूदनम् । नित्यनिर्मुक्तमेकं च निस्तुलं निरतिक्रमम् ॥ ८८॥ गिरिराजधरं बालं
    देवेन्द्रमखभञ्जनम् । वर्षधाराप्रशमनं प्रेमधाराविवर्षणम् ॥ ८९॥ कामधेनुपयस्सिक्तं गोविन्दं गिरिगोचरम्
    । हृतदर्पेन्द्रसम्पूज्यं गोकुलप्रीतिवर्धनम् ॥ ९०॥ ब्रह्माण्डकोटिगर्भस्थं मृद्भक्षकमनामयम् । मुखान्तःस्थत्रिभुवनं
    यशोदाद्भुतदर्श्शनम् ॥ ९१॥ सनातनं नित्यसत्यममरं सुरनायकम् । निरवद्यं निष्प्रपञ्चं प्रपञ्चं निखिलेश्वरम्
    ॥ ९२॥ यदुश्रेष्ठं रमानाथं कृष्णं प्राणाधिकप्रियम् । राधानन्दं सदानन्दं बालगोपं यदूत्तमम् ॥ ९३॥ पार्त्थिवं
    पृथिवीनाथं मृदुलं पार्त्थसारथिम् । बकारिमघसंहारं ब्रह्मदेवनमस्कृतम् ॥ ९४॥ बालवेषं वत्सरूपं धेनुरूपं
    शिशुं प्रियम् । कृतनानारूपरम्यं ब्रह्ममोहनिवारणम् ॥ ९५॥ दैवसम्पत्तिदातारं मुचुकुन्दप्रसादकम् । असुरघ्नं
    शिष्टपालं सुस्मृतं शोकनाशनम् ॥ ९६॥ गजेन्द्रसंस्तुतं स्तव्यं हस्तिहस्तप्रपूजितम् । आदिमूलं सर्वमूलं
    निर्मूलं विश्वमूलकम् ॥ ९७॥ अक्रूरवरदं पूज्यं वैकुण्ठनिलयं श्रुतम् । जलान्तर्निलयं चारुदर्श्शनं सुखदर्श्शनम्
    ॥ ९८॥ प्रेमोन्मुखमनःप्रेष्ठं प्रेमपीयूषसागरम् । राधिकाप्रेमराज्यं च प्रेमानन्दविधायकम् ॥ ९९॥ कृष्णचन्द्रं
    यादवेन्द्रं यदुराजकुमारकम् । यमुनातीरसञ्चारं जलक्रीडारतं चरम् ॥ १००॥ गोपिकारमणं राजं रसिकं रसिकेश्वरम्
    । रसिकोन्मत्तं रसोल्लासं तुलसीदामशोभितम् ॥ १०१॥ (रसोन्मत्तं) कर्णानन्दं रसानन्दं सर्वेन्द्रियसुखप्रदम्
    । मनोवाक्कर्मजेतारं चित्तगं चित्तरञ्जनम् ॥ १०२॥ अनिमित्तं तुल्ल्यहीनं चिद्भवं भवनाशनम् । अमोघममरश्रेष्ठं
    कृष्णं निस्तुलविक्रमम् ॥ १०३॥ दैवसम्पद्विधातारं वराहादिस्वरूपिणम् । मत्स्यरूपं कूर्मरूपं भार्गवं भरताग्रजम्
    ॥ १०४॥ हलायुधं बालरामं वारुणीमदविह्वलम् । यमुनाकर्षणं वीरं सुप्रीतिरसवर्धनम् ॥ १०५॥ असुरश्रेष्ठसंहारं
    नृसिंहं भयहारिणम् । हरिं प्रह्लादवरदं सर्वलोकसुखावहम् ॥ १०६॥ कृष्णं कपटगोपालं कमनीयं वराननम् । सुकुमारं
    सुस्मिताभं सुन्दरं सुकलेवरम् ॥ १०७॥ नादान्तं बिन्दुरूपं च गुणरूपं कलात्मकम् । आदिरूपं कलारूपं चतुर्वगात्मकं
    स्वरम् ॥ १०८॥ वेणुगानं रम्यनादं क्लीङ्कारं वैखरीरवम् । कलापूर्णं कलातीतं ओङ्कारनिनदं कलम् ॥ १०९॥ आदिनाथं
    बीजरूपं गीतामृतकलामृतम् । स्वरामृतं शब्दसारं भावरूपं कृपामृतम् ॥ ११०॥ सुगुणं कालसङ्कल्पं गुणातीतं
    गुणोत्भवम् । सदसत्सर्वरूपं च शब्दब्रह्मादिकं भवम् ॥ १११॥ हैयङ्गवाशनासक्तं मिष्टान्नसुखलोलुपम् । सुस्वादुरसलोलं
    च गोपिकाप्रेमभाजनम् ॥ ११२॥ बालकेलिरसोन्मत्तं नवकेलिरसप्रियम् । अचलं निश्चलं शुद्धं चपलं चञ्चलं चलम्
    ॥ ११३॥ चिदाकाशं चिदादित्यं चित्प्रसन्नं चिदात्मकम् । चित्ताकाशं चित्प्रकाशं चिज्ज्योतिश्चेतनामृतम्
    ॥ ११४॥ गोपिकाप्रेमकामं च राधिकाहृदयेश्वरम् । नित्यकामं निकामं च कामसङ्कल्पवर्जितम् ॥ ११५॥ जीवामृतं
    कृपालुं च सौम्यरूपं दयापरम् । शान्तिदं शान्तशीलं च शमिनं करुणाकरम् ॥ ११६॥ वेणुसञ्जुष्टरम्याङ्गं अधरामृतशोभनम्
    । तुलसीदलमालाभं नूपुरद्वयभूषणम् ॥ ११७॥ परञ्ज्योतिः परन्धाम परमाणुं परात्परम् । अणीयांसं महीयांसं स्थूलसूक्ष्मादिमूलकम्
    ॥ ११८॥ कर्माद्।ह्ध्यक्षं कर्महीनं कर्मातीतमकर्मकम् । सकर्मकं निष्क्रियं च कर्मगं कर्ममोचकम् ॥ ११९॥
    सज्जनाभीष्टदं शिष्टं धेनुकासुरमर्दनम् । व्रजबालं प्रीतिरूपं कृष्णमात्मसखं गुरुम् ॥ १२०॥ प्रलम्बवधकामं
    च बलरामानुजं बलम् । पूतनाप्राणहर्तारं हलायुधगदायुधम् ॥ १२१॥ मनोबुद्धीन्द्रियप्राणं प्रज्ञानं परमं
    फलम् । ज्ञानदं ज्ञानगम्यं च विज्ञानानन्दमण्डलम् ॥ १२२॥ श्रीकृष्णं जगदद्।ह्ध्यक्षं राधिकाप्राणवल्लभम्
    । सर्वेन्द्रियप्राणधर्मं सर्वगं सर्वकर्षणम् ॥ १२३॥ सुशीलं राजगोपालं शीतलं श्यामलप्रभम् । धृतवाद्यं
    शब्दसारं गायकं कीर्त्तिदायकम् ॥ १२४॥ गोवर्धनाद्रिसञ्चारं तृणान्वेषणतत्परम् । गोवत्साननुधावन्तं गोधनं
    गोपरिग्रहम् ॥ १२५॥ मर्क्कटप्लवनोद्युक्तं बालकं केलिलालसम् । तमालनीलं सुश्यामं कारुण्यद्रुतमानसम् ॥
    १२६॥ अमोघदर्श्शनं प्रीतं परिपावनकीर्त्तिदम् । रसं सारं सर्वसारं रससारसुधामयम् ॥ १२७॥ मयूरसमनृत्तं
    च बर्हाभावृतकुन्तलम् । हंसनृत्तं हंसगतिं कोकिलारवकूजितम् ॥ १२८॥ पद्मनाभं पद्मनेत्रं पद्माभं पद्मजार्चितम्
    । नीलपद्मसमानाभं पादपद्मसुपूजितम् ॥ १२९॥ दिव्याङ्गं दिव्यनटनं दिव्यप्रेमप्रहर्षणम् । दिव्याभापूरिताङ्गं
    च दिव्यभावनिवेशनम् ॥ १३०॥ कृतकृत्यं कर्महेतुं साक्षिणं कर्मनिष्कृतिम् । सन्निकर्षं विदूरं च कूटस्थं
    कपटाकृतिम् ॥ १३१॥ सत्वयोनिं सङ्गहीनं साधुपूज्यं सुमानसम् । सत्वशुद्धं सत्यरूपं सत्वाकारं सदाशुभम्
    ॥ १३२॥ श्रीकृष्णं गोकुलप्रेष्ठं वृन्दारण्यनिवासिनम् । वन्यजीविसमाकृष्टं मर्क्कटाद्यनुकारिणम् ॥ १३३॥
    कोकिलाननुकूजन्तं शब्दघोषरसप्रियम् । क्रीडोन्मत्तं चारुनृत्तमाद्यन्तं नरनायकम् ॥ १३४॥ लीलाकृतिं सुनृतं
    च सकलं सन्नुतं शिवम् । हेमाङ्गिनीप्रियं नाथं निर्वैरं पद्ममालिनम् ॥ १३५॥ मणिकण्ठं हंसरूपं वैकुण्ठं
    पक्षिवाहनम् । हंसाधिरूढं लक्ष्मीशं जयं च विजयं शुचि ॥ १३६॥ सुदर्शनं योगिपूज्यं योगेशं च युगेश्वरम्
    । योगेश्वरं योगगम्यं कृष्णं योगेश्वरेश्वरम् ॥ १३७॥ आदिमद्।ह्ध्यान्तसंव्याप्तं कालान्तं युगसम्भवम्
    । योगमार्गप्रणेतारं सुकृतं ब्रह्मचारिणम् ॥ १३८॥ कामकोटिविजेतारमानकदुन्दुभिप्रियम् । प्रेमसूत्रनिबद्धं
    च भवबन्धविमोचकम् ॥ १३९॥ गीताचार्यं कालरूपं विश्वरूपप्रदर्श्शकम् । ज्ञानविज्ञानरूपं च मधुरप्रेमभाषणम्
    ॥ १४०॥ ऋतुराजं वसन्ताभं शरद्वन्द्यं प्रवर्षणम् । ग्रीष्मवेगं च हेमन्तं शिशिरं शिशुसन्निभम् ॥ १४१॥
    मयूरकुक्कुटसखं मेघगर्जनघोषणम् । मेघनादं मेघनिभं मयूरप्रियकारिणम् ॥ १४२॥ कालिन्दीसलिलोन्मज्जं केयूराद्यैरलङ्कृतम्
    । हस्तताडनसुक्रीडं गोपकन्याप्रपूजितम् ॥ १४३॥ कात्त्यायनीनुतं कीर्त्तिं कात्त्यायन्यर्चितं श्रियम्
    । इष्टदेवं पूजनीयं प्रार्त्थितं च पतिं प्रभुम् ॥ १४४॥ कन्यार्चितं कामवरमकामं कामनाशनम् । सम्मोहनं
    वरिष्टं च कामिनीकामदं जितम् ॥ १४५॥ जितमोहं कामरूपं मोहिनीवेषधारिणम् । जितदैत्यं देवदूतं देवकार्यसुरक्षकम्
    ॥ १४६॥ प्रेमामृतं चिदमृतं ज्ञानामृतविवर्षणम् । निर्मोहं निस्पृहं युक्तं निरासक्तं निजाशयम् ॥ १४७॥
    भूतं भूतादिकं भव्यं निर्दोषं दोषवर्जितम् । निरीहं नन्दपुत्रं च यशोदानन्दवर्धनम् ॥ १४८॥ भवोन्मुखं भवातीतं
    भविष्यन्तं भवाश्रितम् । भवमोहविनिर्मुक्तं निर्भवं भवरूपिणम् ॥ १४९॥ तैजसं ज्योतिरादित्यं प्रकाशं तेजसाम्पतिम्
    । ज्योतिर्मुखं च चिज्ज्योतिर्भास्करं रविमण्डलम् ॥ १५०॥ चन्द्रप्रभं मेघनीलमनन्तकिरणोद्भवम् । दिव्याकाशं
    नीलजालमानीलं नीलवर्षणम् ॥ १५१॥ नीलार्णवं नीलनीलं सुनीलं नीलसुन्दरम् । नीलं च नीलसर्वाङ्गं नीलारम्भं
    सुनीलकम् ॥ १५२॥ कामारिं कामवेगं च सर्वकामवरं स्मरम् । कंसारिं कालकालं च कंससौभाग्यपूरकम् ॥ १५३॥ द्वारकाधिपतिं
    श्रीशं रुक्मिणीसहितं श्रियम् । जगदीशं पार्त्थसखं सत्यभामारतं पतिम् ॥ १५४॥ सर्वलोककुटुम्बस्थं प्रेमसाम्राज्यनायकम्
    । षोडशस्त्रीसहस्रेशं मानिनीमानसप्रियम् ॥ १५५॥ पयोधिवासिनं कृष्णं पयञ्चोरं पयोनिधिम् । राधाप्रेमपयःप्रीतं
    प्रेमपायसलोलुपम् ॥ १५६॥ प्रणवं प्रणवावन्तःस्थं नादबिन्दुकलादिकम् । नादान्तःस्थं नादसूक्ष्मं बिन्दुं
    नादसुमङ्गलम् ॥ १५७॥ ओङ्कारं स्वरसम्पुष्टं क्लीन्नादं स्वरसंयुतम् । स्वररागसुधासेव्यं वैखरीरवकूजनम्
    ॥ १५८॥ भावयुक्तं भाववेगं भावपूर्णं भवच्छिदम् । भावोज्ज्वलं भावरूपं भववेगविमोचकम् ॥ १५९॥ भवोत्तारं
    भगवतं भवमोक्षं भवेतरम् । भवोपेतं भवान्तःस्थं भजनीयं पराङ्मुखम् ॥ १६०॥ अनिष्टमिष्टं सम्पुष्टं सुस्वरं
    कलकूजनम् । रासक्रीडासमासक्तं गोपिकाप्रेष्ठनायकम् ॥ १६१॥ प्रज्ञानं सुप्रधानं च प्रकटं पुरुषेश्वरम्
    । विरजस्कं सत्वपूर्णं मनोनिलयमद्भुतम् ॥ १६२॥ वाचामगोचरं व्यक्तनजनिं जन्मनाशनम् । मर्त्त्यं मृत्युविहीनं
    च नृरूपं यादवोत्भवम् ॥ १६३॥ अरण्यवासं योगेन्द्रमभिवन्द्यं सुदर्शनम् । आत्माभिधं श्रुतिस्तुत्यं कूटस्थं
    कूटपूरुषम् ॥ १६४॥ दिग्विलासं दैविकं च देवकार्यवरप्रदम् । उपेन्द्रं हृदयान्तःस्थं वामनं दानवार्चितम्
    ॥ १६५॥ बलिदर्पहरं ह्रस्वं यज्ञवाटसमागतम् । त्रिपदं भुवनव्याप्तं विप्रं कपटभाषिणम् ॥ १६६॥ त्रिपदाक्रान्तभुवनं
    विक्रमं च त्रिविक्रमम् । अहम्ममादिहन्तारं वटुवामनरूपिणम् ॥ १६७॥ ब्रह्म ब्रह्ममयं विष्णुं ब्रह्माख्यं
    जगदीश्वरम् । शिवं शिवकरं शुद्धं मार्क्काण्डेयवरप्रदम् ॥ १६८॥ मायातीतं मायिनं च मायाश्रितममायकम् ।
    नित्यमुक्तस्वभावं च मायागुणविवर्जितम् ॥ १६९॥ मायागुणं निमायं च मायेशं त्रिगुणात्मकम् । त्रिमूर्त्तिं
    त्रिगुणोद्भूतं मायासङ्गविमोचकम् ॥ १७०॥ आनन्दं च प्रमोदं च मङ्गलं सर्वमङ्गलम् । सूक्ष्मादिसूक्ष्मं
    प्रकटं सूक्ष्मतत्त्वं च सूक्ष्मगम् ॥ १७१॥ श्रीकृष्णचन्द्रं श्रीनाथं राधाप्रेमाधिकप्रियम् । श्रीवत्साङ्कं
    श्रीनिकेतं व्रजनारीविमोहनम् ॥ १७२॥ श्यामलं कोमलं वन्दे, यदुनाथं यदूत्तमम् । सुन्दरं वेणुगोपालं चिन्मयं
    सुमनोहरम् ॥ १७३॥ हृदयस्थं सदा वन्दे, वन्दे प्रेमपयोनिधिम् । कृष्णं वन्दे प्रियात्मानं, वन्दे राधेशसुन्दरम्
    ॥ १७४॥ इति स्वामि ईश्वरानन्दसरस्वती विरचितं श्री श्रीकृष्णसहस्रनामस्तोत्रं सम्पूर्णम् ॥ मङ्गलं वेणुगोपाल!
    मङ्गलं पुरुषोत्तम । मङ्गलं चारुसर्वाङ्ग! मङ्गलं हृदयेश्वर ॥
