id: balamantrasiddhistavah
category: mantra
name:
  english: balamantrasiddhistavah
  devanagari: बालामन्त्रसिद्धिस्तवः
content:
  english: shribalamantrasiddhistavah brahmirupadhare devi brahmatma brahmapalika | vidyamantradikam sarvam
    siddhim dehi pareshvari || 1|| maheshvari mahamaya mananda mohaharini | mantrasiddhiphalam dehi mahamantrarnaveshvari
    || 2|| guhyeshvari gunatita guhyatattvarthadayini | gunatrayatmika devi mantrasiddhim dadasva mam
    || 3|| narayani ca nakeshi nrimundamalini para | nananana nakuleshi mantrasiddhim pradehi me || 4||
    ghrishticakra maharaudri ghanopamavivarnaka | ghoraghoratara ghora mantrasiddhiprada bhava || 5||
    shakrani sarvadaityaghni sahasralocani shubha | sarvarishtavinirmukta sa devi mantrasiddhida || 6||
    camundarupadeveshi calajjihva bhayanaka | catushpitheshvari dehi mantrasiddhim sada mama || 7|| lakshmilavanyavarna
    ca rakta raktamahapriya | lambakesha ratnabhusha mantrasiddhim sada dada || 8|| bala virarcita vidya
    vishalanayananana | vibhutida vishnumata mantrasiddhim prayaccha me || 9|| phalashrutih | mantrasiddhistavam
    punyam mahamokshaphalapradam | mahamohaharam sakshat satyam mantrasya siddhidam || 10|| iti mahakalasamhitayam
    shribalamantrasiddhistavah sampurnah |
  devanagari: श्रीबालामन्त्रसिद्धिस्तवः ब्राह्मीरूपधरे देवि ब्रह्मात्मा ब्रह्मपालिका । विद्यामन्त्रादिकं
    सर्वं सिद्धिं देहि परेश्वरि ॥ १॥ महेश्वरी महामाया मानन्दा मोहहारिणी । मन्त्रसिद्धिफलं देहि महामन्त्रार्णवेश्वरि
    ॥ २॥ गुह्येश्वरी गुणातीता गुह्यतत्त्वार्थदायिनी । गुणत्रयात्मिका देवी मन्त्रसिद्धिं ददस्व माम् ॥ ३॥
    नारायणी च नाकेशी नृमुण्डमालिनी परा । नानानना नाकुलेशी मन्त्रसिद्धिं प्रदेहि मे ॥ ४॥ घृष्टिचक्रा महारौद्री
    घनोपमविवर्णका । घोरघोरतरा घोरा मन्त्रसिद्धिप्रदा भव ॥ ५॥ शक्राणी सर्वदैत्यघ्नी सहस्रलोचनी शुभा । सर्वारिष्टविनिर्मुक्ता
    सा देवी मन्त्रसिद्धिदा ॥ ६॥ चामुण्डारूपदेवेशी चलज्जिह्वा भयानका । चतुष्पीठेश्वरी देहि मन्त्रसिद्धिं
    सदा मम ॥ ७॥ लक्ष्मीलावण्यवर्णा च रक्ता रक्तमहाप्रिया । लम्बकेशा रत्नभूषा मन्त्रसिद्धिं सदा दद ॥ ८॥
    बाला वीरार्चिता विद्या विशालनयनानना । विभूतिदा विष्णुमाता मन्त्रसिद्धिं प्रयच्छ मे ॥ ९॥ फलश्रुतिः
    । मन्त्रसिद्धिस्तवं पुण्यं महामोक्षफलप्रदम् । महामोहहरं साक्षात् सत्यं मन्त्रस्य सिद्धिदम् ॥ १०॥ इति
    महाकालसंहितायां श्रीबालामन्त्रसिद्धिस्तवः सम्पूर्णः ।
