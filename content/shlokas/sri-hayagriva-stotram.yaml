id: sri-hayagriva-stotram
category: stotram
name:
  english: Sri Hayagriva Stotram
content:
  english: jnananandamayam devam nirmalasphatikakritim adharam sarvavidyanam hayagrivamupasmahe || ||
    svatassiddham shuddhasphatikamanibhu bhritpratibhatam sudhasadhricibhirdyutibhiravadatatribhuvanam
    anantaistrayyantairanuvihita heshahalahalam hatasheshavadyam hayavadanamidemahimahah || || samaharassamnam
    pratipadamricam dhama yajusham layah pratyuhanam laharivitatirbodhajaladheh kathadarpakshubhyatkathakakulakolahalabhavam
    haratvantardhvantam hayavadanaheshahalahalah || || praci sandhya kacidantarnishayah prajnadrishte
    ranjanashrirapurva vaktri vedan bhatu me vajivaktra vagishakhya vasudevasya murtih || || vishuddhavijnanaghanasvarupam
    vijnanavishrananabaddhadiksham dayanidhim dehabhritam sharanyam devam hayagrivamaham prapadye || ||
    apaurusheyairapi vakprapancaih adyapi te bhutimadrishtaparam stuvannaham mugdha iti tvayaiva karunyato
    natha katakshaniyah || || dakshinyaramya girishasya murtih devi sarojasanadharmapatni vyasadayo'pi
    vyapadeshyavacah sphuranti sarve tava shaktileshaih || || mando'bhavishyanniyatam virincah vacam nidhervanchitabhagadheyah
    daityapanitan dayayaina bhuyo'pi adhyapayishyo nigamannacettvam || || vitarkadolam vyavadhuya sattve
    brihaspatim vartayase yatastvam tenaiva deva tridesheshvarana asprishtadolayitamadhirajyam || || agnau
    samiddharcishi saptatantoh atasthivanmantramayam shariram akhandasarairhavisham pradanaih apyayanam
    vyomasadam vidhatse || || yanmula midrikpratibhatattvam ya mulamamnayamahadrumanam tattvena jananti
    vishuddhasattvah tvamaksharamaksharamatrikam tvam || || avyakritadvyakritavanasi tvam namani rupani
    ca yani purvam shamsanti tesham caramam pratishtham vagishvara tvam tvadupajnavacah || || mugdhendunishyandavilobhaniyam
    murtim tavanandasudhaprasutim vipashcitashcetasi bhavayante velamudaramiva dugdha sindhoh || || manogatam
    pashyati yassada tvam manishinam manasarajahamsam svayampurobhavavivadabhajah kinkurvate tasya giro
    yatharham || || api kshanardham kalayanti ye tvam aplavayantam vishadairmayukhaih vacam pravahairanivaritaiste
    mandakinim mandayitum kshamante || || svaminbhavaddyanasudhabhishekat vahanti dhanyah pulakanubandam
    alakshite kvapi nirudha mulam angveshvi vanandathumankurantam || || svaminpratica hridayena dhanyah
    tvaddhyanacandrodayavardhamanam amantamanandapayodhimantah payobhi rakshnam parivahayanti || || svairanubhavas
    tvadadhinabhavah samriddhaviryastvadanugrahena vipashcitonatha taranti mayam vaiharikim mohanapinchikam
    te || || prannirmitanam tapasam vipakah pratyagranishshreyasasampado me samedhishiram stava padapadme
    sankalpacintamanayah pranamah || || viluptamurdhanyalipikramana surendracudapadalalitanam tvadanghri
    rajivarajahkananam bhuyanprasado mayi natha bhuyat || || parisphurannupuracitrabhanu prakashanirdhutatamonushanga
    padadvayim te paricinmahe'ntah prabodharajivavibhatasandhyam || || tvatkinkaralankaranocitanam tvayaiva
    kalpantarapalitanam manjupranadam maninupuram te manjushikam vedagiram pratimah || || sancintayami
    pratibhadashasthan sandhukshayantam samayapradipan vijnanakalpadrumapallavabham vyakhyanamudramadhuram
    karam te || || citte karomi sphuritakshamalam savyetaram natha karam tvadiyam jnanamritodancanalampatanam
    lilaghatiyantramiva''shritanam || || prabodhasindhorarunaih prakashaih pravalasanghatamivodvahantam
    vibhavaye deva sa pustakam te vamam karam dakshinamashritanam || || tamam sibhittvavishadairmayukhaih
    samprinayantam vidushashcakoran nishamaye tvam navapundarike sharadghanecandramiva sphurantam || ||
    dishantu me deva sada tvadiyah dayataranganucarah katakshah shrotreshu pumsamamritanksharantim sarasvatim
    samshritakamadhenum || || visheshavitparishadeshu natha vidagdhagoshthi samaranganeshu jigishato me
    kavitarkikendran jihvagrasimhasanamabhyupeyah || || tvam cintayan tvanmayatam prapannah tvamudgrinan
    shabdamayena dhamna svaminsamajeshu samedhishiya svacchandavadahavabaddhashurah || || nanavidhanamagatih
    kalanam na capi tirtheshu kritavatarah dhruvam tava'nadha parigrahayah nava navam patramaham dayayah
    || || akampaniyanyapanitibhedaih alankrishiran hridayam madiyam shanka kalanka pagamojjvalani tattvani
    samyanci tava prasadat || || vyakhyamudram karasarasijaih pustakam shankhacakre bhibhradbhinna sphatikarucire
    pundarike nishannah | amlanashriramritavishadairamshubhih plavayanmam avirbhuyadanaghamahimamanase
    vagadhishah || || vagarthasiddhihetohpathata hayagrivasamstutim bhaktya kavitarkikakesarina venkatanathena
    viracitametam ||
  devanagari: ज्ञानानन्दमयं देवं निर्मलस्फटिकाकृतिं आधारं सर्वविद्यानां हयग्रीवमुपास्महे ॥ ॥ स्वतस्सिद्धं
    शुद्धस्फटिकमणिभू भृत्प्रतिभटं सुधासध्रीचीभिर्द्युतिभिरवदातत्रिभुवनं अनन्तैस्त्रय्यन्तैरनुविहित हेषाहलहलं
    हताशेषावद्यं हयवदनमीडेमहिमहः ॥ ॥ समाहारस्साम्नां प्रतिपदमृचां धाम यजुषां लयः प्रत्यूहानां लहरिविततिर्बोधजलधेः
    कथादर्पक्षुभ्यत्कथककुलकोलाहलभवं हरत्वन्तर्ध्वान्तं हयवदनहेषाहलहलः ॥ ॥ प्राची सन्ध्या काचिदन्तर्निशायाः
    प्रज्ञादृष्टे रञ्जनश्रीरपूर्वा वक्त्री वेदान् भातु मे वाजिवक्त्रा वागीशाख्या वासुदेवस्य मूर्तिः ॥
    ॥ विशुद्धविज्ञानघनस्वरूपं विज्ञानविश्राणनबद्धदीक्षं दयानिधिं देहभृतां शरण्यं देवं हयग्रीवमहं प्रपद्ये
    ॥ ॥ अपौरुषेयैरपि वाक्प्रपञ्चैः अद्यापि ते भूतिमदृष्टपारां स्तुवन्नहं मुग्ध इति त्वयैव कारुण्यतो नाथ
    कटाक्षणीयः ॥ ॥ दाक्षिण्यरम्या गिरिशस्य मूर्तिः देवी सरोजासनधर्मपत्नी व्यासादयोऽपि व्यपदेश्यवाचः स्फुरन्ति
    सर्वे तव शक्तिलेशैः ॥ ॥ मन्दोऽभविष्यन्नियतं विरिञ्चः वाचां निधेर्वाञ्छितभागधेयः दैत्यापनीतान् दययैन
    भूयोऽपि अध्यापयिष्यो निगमान्नचेत्त्वम् ॥ ॥ वितर्कडोलां व्यवधूय सत्त्वे बृहस्पतिं वर्तयसे यतस्त्वं
    तेनैव देव त्रिदेशेश्वराणा अस्पृष्टडोलायितमाधिराज्यम् ॥ ॥ अग्नौ समिद्धार्चिषि सप्ततन्तोः आतस्थिवान्मन्त्रमयं
    शरीरं अखण्डसारैर्हविषां प्रदानैः आप्यायनं व्योमसदां विधत्से ॥ ॥ यन्मूल मीदृक्प्रतिभातत्त्वं या मूलमाम्नायमहाद्रुमाणां
    तत्त्वेन जानन्ति विशुद्धसत्त्वाः त्वामक्षरामक्षरमातृकां त्वाम् ॥ ॥ अव्याकृताद्व्याकृतवानसि त्वं नामानि
    रूपाणि च यानि पूर्वं शंसन्ति तेषां चरमां प्रतिष्ठां वागीश्वर त्वां त्वदुपज्ञवाचः ॥ ॥ मुग्धेन्दुनिष्यन्दविलोभनीयां
    मूर्तिं तवानन्दसुधाप्रसूतिं विपश्चितश्चेतसि भावयन्ते वेलामुदारामिव दुग्ध सिन्धोः ॥ ॥ मनोगतं पश्यति
    यस्सदा त्वां मनीषिणां मानसराजहंसं स्वयम्पुरोभावविवादभाजः किङ्कुर्वते तस्य गिरो यथार्हम् ॥ ॥ अपि क्षणार्धं
    कलयन्ति ये त्वां आप्लावयन्तं विशदैर्मयूखैः वाचां प्रवाहैरनिवारितैस्ते मन्दाकिनीं मन्दयितुं क्षमन्ते
    ॥ ॥ स्वामिन्भवद्द्यानसुधाभिषेकात् वहन्ति धन्याः पुलकानुबन्दं अलक्षिते क्वापि निरूढ मूलं अङ्ग्वेष्वि
    वानन्दथुमङ्कुरन्तम् ॥ ॥ स्वामिन्प्रतीचा हृदयेन धन्याः त्वद्ध्यानचन्द्रोदयवर्धमानं अमान्तमानन्दपयोधिमन्तः
    पयोभि रक्ष्णां परिवाहयन्ति ॥ ॥ स्वैरानुभावास् त्वदधीनभावाः समृद्धवीर्यास्त्वदनुग्रहेण विपश्चितोनाथ
    तरन्ति मायां वैहारिकीं मोहनपिञ्छिकां ते ॥ ॥ प्राङ्निर्मितानां तपसां विपाकाः प्रत्यग्रनिश्श्रेयससम्पदो
    मे समेधिषीरं स्तव पादपद्मे सङ्कल्पचिन्तामणयः प्रणामाः ॥ ॥ विलुप्तमूर्धन्यलिपिक्रमाणा सुरेन्द्रचूडापदलालितानां
    त्वदङ्घ्रि राजीवरजःकणानां भूयान्प्रसादो मयि नाथ भूयात् ॥ ॥ परिस्फुरन्नूपुरचित्रभानु प्रकाशनिर्धूततमोनुषङ्गा
    पदद्वयीं ते परिचिन्महेऽन्तः प्रबोधराजीवविभातसन्ध्याम् ॥ ॥ त्वत्किङ्करालङ्करणोचितानां त्वयैव कल्पान्तरपालितानां
    मञ्जुप्रणादं मणिनूपुरं ते मञ्जूषिकां वेदगिरां प्रतीमः ॥ ॥ सञ्चिन्तयामि प्रतिभादशास्थान् सन्धुक्षयन्तं
    समयप्रदीपान् विज्ञानकल्पद्रुमपल्लवाभं व्याख्यानमुद्रामधुरं करं ते ॥ ॥ चित्ते करोमि स्फुरिताक्षमालं
    सव्येतरं नाथ करं त्वदीयं ज्ञानामृतोदञ्चनलम्पटानां लीलाघटीयन्त्रमिवाऽऽश्रितानाम् ॥ ॥ प्रबोधसिन्धोररुणैः
    प्रकाशैः प्रवालसङ्घातमिवोद्वहन्तं विभावये देव स पुस्तकं ते वामं करं दक्षिणमाश्रितानाम् ॥ ॥ तमां सिभित्त्वाविशदैर्मयूखैः
    सम्प्रीणयन्तं विदुषश्चकोरान् निशामये त्वां नवपुण्डरीके शरद्घनेचन्द्रमिव स्फुरन्तम् ॥ ॥ दिशन्तु मे
    देव सदा त्वदीयाः दयातरङ्गानुचराः कटाक्षाः श्रोत्रेषु पुंसाममृतङ्क्षरन्तीं सरस्वतीं संश्रितकामधेनुम्
    ॥ ॥ विशेषवित्पारिषदेषु नाथ विदग्धगोष्ठी समराङ्गणेषु जिगीषतो मे कवितार्किकेन्द्रान् जिह्वाग्रसिंहासनमभ्युपेयाः
    ॥ ॥ त्वां चिन्तयन् त्वन्मयतां प्रपन्नः त्वामुद्गृणन् शब्दमयेन धाम्ना स्वामिन्समाजेषु समेधिषीय स्वच्छन्दवादाहवबद्धशूरः
    ॥ ॥ नानाविधानामगतिः कलानां न चापि तीर्थेषु कृतावतारः ध्रुवं तवाऽनाध परिग्रहायाः नव नवं पात्रमहं दयायाः
    ॥ ॥ अकम्पनीयान्यपनीतिभेदैः अलङ्कृषीरन् हृदयं मदीयम् शङ्का कलङ्का पगमोज्ज्वलानि तत्त्वानि सम्यञ्चि
    तव प्रसादात् ॥ ॥ व्याख्यामुद्रां करसरसिजैः पुस्तकं शङ्खचक्रे भिभ्रद्भिन्न स्फटिकरुचिरे पुण्डरीके निषण्णः
    । अम्लानश्रीरमृतविशदैरंशुभिः प्लावयन्मां आविर्भूयादनघमहिमामानसे वागधीशः ॥ ॥ वागर्थसिद्धिहेतोःपठत हयग्रीवसंस्तुतिं
    भक्त्या कवितार्किककेसरिणा वेङ्कटनाथेन विरचितामेताम् ॥
