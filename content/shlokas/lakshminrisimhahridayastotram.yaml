id: lakshminrisimhahridayastotram
category: hridaya
name:
  english: lakshminrisimhahridayastotram
  devanagari: लक्ष्मीनृसिम्हहृदयस्तोत्रम्
content:
  english: ritiproktam yah pashyati sa pashyati || 2|| nrisimhadeva jayante lokah sthavarajangamah | nrisimhenaiva
    jivanti nrisimhe pravishanti ca || 3|| nrisimho vishvamutpadya pravishya tadanantaram | rajabhikshusvarupena
    nrisimhasya smaranti ye || 4|| nrisimhat paramam nasti nrisimham kuladaivatam | nrisimhabhakta ye
    loke te jnaninamitiritah || 5|| virakta dayaya yuktah sarvabhutasamekshanah | nyasta samsara yogena
    nrisimham prapnuvanti te || 6|| mahatmyam yasya sarve api vadanti nigamagamah | nrisimhah sarvajagatam
    karta bhokta na caparah || 7|| nrisimho jagatam hetuh bahiryaya avalambanah | mayaya veditatma ca
    sudarshanasamaksharah || 8|| vasudevo mayatito narayanasamaprabha | nirmalo nirahankaro nirmalyo yo
    niranjanah || 9|| sarvesham capi bhutanam hridayambhojavasakah | atishreshthah sadanando nirvikaro
    mahamatih || 10|| caracarasvarupi ca caracaraniyamakah | sarveshvarah sarvakarta sarvatma sarvagocarah
    || 11|| nrisimha eva yah sakshat pratyagatma na samshayah | kecinmudha vadantyevamavataramanishvaram
    || 12|| nrisimha paramatmanam sarvabhutanivasinam | tasya darshanamatrena suryasyalokavadbhavet ||
    13|| sarvam nrisimha eveti sangrahatma sudurlabhah | narasimhah param daivam narasimho jagadguruh
    || 14|| nrisimheti nrisimheti prabhate ye pathanti ca | tesham prasanno bhagavan moksham samyak prayacchati
    || 15|| omkarebhyashca putatma omkaraika prabodhitah | omkaro mantrarajashca loke mokshapradayakah
    || 16|| nrisimhabhakta ye loke nirbhaya nirvikarakah | tesham darshanamatrena sarvapapaih pramucyate
    || 17|| sakaro jivavaci syadikarah parameshvarah | hakarakarayoraikyam mahavakyam tato bhavet || 18||
    omkaraja pretamuktih kashyam maranam tatha | nrisimha smaranadeva muktirbhavati nanyatha || 19|| tasmatsarvaprayatnena
    mantrarajamiti dhruvam | sarvesham capi vedanam devatanam tathaiva ca || 20|| sarvesham capi shastranam
    tatparyam nriharau harau | shriramatapaniyasya gopalasyapi tapinah || 21|| nrisimhatapaniyasya kalam
    narhati shodashim | shriman mantramaharaja nrisimhasya prasadatah || 22|| shrinrisimho namastubhyam
    shrinrisimhah prasida me | nrisimho bhagavanmata shrinrisimhah pita mama || 23|| nrisimho mama putrashca
    narakattrayate yatah | sarvadevatmako yashca nrisimhah parikirtitah || 24|| ashvamedhasahasrani va
    japeya shatani ca | kashi rameshvaradini phalanyapi nishamya ca || 25|| yavatphalam samapnoti tavadapnoti
    mantratah | shannavatyashca karani yavati triptirishyate || 26|| pitrinam tavati pritih mantrarajasya
    jayate | aputrasya gatirnasti iti smritya yadiritam || 27|| tattu lakshminrisimhasya bhaktimatravagocaram
    | sarvani tarkamimamsa shastrani parihaya vai || 28|| nrisimha smaranalloke tarakam bhavatarakam |
    apara bhavavarabdhau satatam patatam nrinam || 29|| nrisimha mantrarajo'yam naviko bhashyate budhaih
    | yamapashena baddhanam pangum vai tishthatam nrinam || 30|| nrisimha mantrarajo'yam rishayah parikirtitah
    | bhavasarpena damshtranam vivekagata cetasam || 31|| nrisimha mantrarajo'yam garudomantra ucyate
    | ajnanatamasam nrinamandhavadbhrantacakshusham || 32|| nrisimhamantrarajo'yam prayasam parikirtitah
    | tapatrayagni dagdhanam chaya samshrayamicchatam || 33|| nrisimhamantrarajashca bhaktamanasapanjaram
    | nrisimho bhaskaro bhutva prakashayati mandiram || 34|| vedantavana madhyastha harini mriga ishyate
    | nrisimha nilameghasya sandarshana visheshatah || 35|| mayura bhaktimantashca nrityanti pritipurvakam
    | anyatra nirgata vala mataram parilokaya || 36|| yatha yatha hi tushyante nrisimhasyavalokanat |
    shriman nrisimha padabjam natvaranga praveshita || 37|| madiya buddhivanita nati nrityati sundari
    | shriman nrisimha padabja madhupitva madonmadah || 38|| madiya buddhimalokya mudha nindanti madhavam
    | shriman nrisimhapadabjarenum vidhisubhakshanam || 40|| madiyacittahamso'yam manovashyam na yati
    me | shrinrisimhah pita mahyam mata ca narakesari || 41|| vartate tabhuvau nityam rauvaham pariyami
    vai | satyam satyam punah satyam nrisimhah sharanam mama || 42|| ahobhagyam ahobhagyam narasimho gatirmama
    | shriman nrisimha padabja dvandvam me hridaye sada || 43|| vartatam vartatam nityam dridhabhaktim
    prayaccha me | nrisimha tushto bhakto'yam bhuktim muktim prayacchati || 44|| nrisimhahridayam yastu
    pathennityam samahitah | nrisimhatvam samapnoti nrisimhah samprasidati || 45|| trisandhyam yah pathennityam
    mandavare visheshatah | rajadvare sabhasthane sarvatra vijayi bhavet || 46|| yam yam cintayate kamam
    tam tam prapnoti nishcitam | iha loke shubhan kaman paratra ca parangitam || 47|| || iti bhavishyottarapurane
    prahladakathitam shrilakshminrisimhahridayastotram sampurnam ||
  devanagari: ृतिप्रोक्तं यः पश्यति स पश्यति ॥ २॥ नृसिंहदेव जायन्ते लोकाः स्थावरजङ्गमाः । नृसिंहेनैव जीवन्ति
    नृसिंहे प्रविशन्ति च ॥ ३॥ नृसिंहो विश्वमुत्पाद्य प्रविश्य तदनन्तरम् । राजभिक्षुस्वरूपेण नृसिंहस्य
    स्मरन्ति ये ॥ ४॥ नृसिंहात् परमं नास्ति नृसिंहं कुलदैवतम् । नृसिंहभक्ता ये लोके ते ज्ञानिनमितीरिताः
    ॥ ५॥ विरक्ता दयया युक्ताः सर्वभूतसमेक्षणाः । न्यस्त संसार योगेन नृसिंहं प्राप्नुवन्ति ते ॥ ६॥ माहात्म्यं
    यस्य सर्वे अपि वदन्ति निगमागमाः । नृसिंहः सर्वजगतां कर्ता भोक्ता न चापरः ॥ ७॥ नृसिंहो जगतां हेतुः
    बहिर्याया अवलम्बनः । मायया वेदितात्मा च सुदर्शनसमाक्षरः ॥ ८॥ वासुदेवो मयातीतो नारायणसमप्रभ । निर्मलो
    निरहङ्कारो निर्माल्यो यो निरञ्जनः ॥ ९॥ सर्वेशां चापि भूतानां हृदयाम्भोजवासकः । अतिश्रेष्ठः सदानन्दो
    निर्विकारो महामतिः ॥ १०॥ चराचरस्वरूपी च चराचरनियामकः । सर्वेश्वरः सर्वकर्ता सर्वात्मा सर्वगोचरः ॥
    ११॥ नृसिंह एव यः साक्षात् प्रत्यगात्मा न संशयः । केचिन्मूढा वदन्त्येवमवतारमनीश्वरम् ॥ १२॥ नृसिंह परमात्मानं
    सर्वभूतनिवासिनम् । तस्य दर्शनमात्रेण सूर्यस्यालोकवद्भवेत् ॥ १३॥ सर्वं नृसिंह एवेति सङ्ग्रहात्मा सुदुर्लभः
    । नारसिंहः परं दैवं नारसिंहो जगद्गुरुः ॥ १४॥ नृसिंहेति नृसिंहेति प्रभाते ये पठन्ति च । तेषां प्रसन्नो
    भगवान् मोक्षं सम्यक् प्रयच्छति ॥ १५॥ ॐकारेभ्यश्च पूतात्मा ॐकारैक प्रबोधितः । ॐकारो मन्त्रराजश्च लोके
    मोक्षप्रदायकः ॥ १६॥ नृसिंहभक्ता ये लोके निर्भया निर्विकारकाः । तेशां दर्शनमात्रेण सर्वपापैः प्रमुच्यते
    ॥ १७॥ सकारो जीववाची स्यादिकारः परमेश्वरः । हकाराकारयोरैक्यं महावाक्यं ततो भवेत् ॥ १८॥ ॐकारजा प्रेतमुक्तिः
    काश्यां मरणं तथा । नृसिंह स्मरणादेव मुक्तिर्भवति नान्यथा ॥ १९॥ तस्मात्सर्वप्रयत्नेन मन्त्रराजमिति
    ध्रुवम् । सर्वेषां चापि वेदानां देवतानां तथैव च ॥ २०॥ सर्वेषां चापि शास्त्राणां तात्पर्यं नृहरौ हरौ
    । श्रीरामतापनीयस्य गोपालस्यापि तापिनः ॥ २१॥ नृसिंहतापनीयस्य कलां नार्हति शोडशीम् । श्रीमन् मन्त्रमहाराज
    नृसिंहस्य प्रसादतः ॥ २२॥ श्रीनृसिंहो नमस्तुभ्यं श्रीनृसिंहः प्रसीद मे । नृसिंहो भगवान्माता श्रीनृसिंहः
    पिता मम ॥ २३॥ नृसिंहो मम पुत्रश्च नरकात्त्रायते यतः । सर्वदेवात्मको यश्च नृसिंहः परिकीर्तितः ॥ २४॥
    अश्वमेधसहस्राणि वा जपेय शतानि च । काशी रामेश्वरादीनि फलान्यपि निशम्य च ॥ २५॥ यावत्फलं समाप्नोति तावदाप्नोति
    मन्त्रतः । शण्णवत्यश्च करणी यावती तृप्तिरिष्यते ॥ २६॥ पितॄणां तावती प्रीतिः मन्त्रराजस्य जायते । अपुत्रस्य
    गतिर्नास्ति इति स्मृत्या यदीरितम् ॥ २७॥ तत्तु लक्ष्मीनृसिंहस्य भक्तिमात्रावगोचरम् । सर्वाणि तर्कमीमांसा
    शास्त्राणि परिहाय वै ॥ २८॥ नृसिंह स्मरणाल्लोके तारकं भवतारकम् । अपार भववाराब्धौ सततं पततां नृणाम्
    ॥ २९॥ नृसिंह मन्त्रराजोऽयं नाविको भाष्यते बुधैः । यमपाशेन बद्धानां पङ्गुं वै तिष्ठतां नृणाम् ॥ ३०॥
    नृसिंह मन्त्रराजोऽयं ऋषयः परिकीर्तितः । भवसर्पेण दंष्ट्राणां विवेकगत चेतसाम् ॥ ३१॥ नृसिंह मन्त्रराजोऽयं
    गारुडोमन्त्र उच्यते । अज्ञानतमसां नृणामन्धवद्भ्रान्तचक्षुषाम् ॥ ३२॥ नृसिंहमन्त्रराजोऽयं प्रयासं परिकीर्तितः
    । तापत्रयाग्नि दग्धानां छाया संश्रयमिच्छताम् ॥ ३३॥ नृसिंहमन्त्रराजश्च भक्तमानसपञ्जरम् । नृसिंहो भास्करो
    भूत्वा प्रकाशयति मन्दिरम् ॥ ३४॥ वेदान्तवन मध्यस्था हरिणी मृग इष्यते । नृसिंह नीलमेघस्य सन्दर्शन विशेषतः
    ॥ ३५॥ मयूरा भक्तिमन्तश्च नृत्यन्ति प्रीतिपूर्वकम् । अन्यत्र निर्गता वाला मातरं परिलोकय ॥ ३६॥ यथा यथा
    हि तुष्यन्ते नृसिंहस्यावलोकनात् । श्रीमन् नृसिंह पादाब्जं नत्वारङ्ग प्रवेशिता ॥ ३७॥ मदीय बुद्धिवनिता
    नटी नृत्यति सुन्दरी । श्रीमन् नृसिंह पादाब्ज मधुपीत्वा मदोन्मदः ॥ ३८॥ मदीया बुद्धिमालोक्य मूढा निन्दन्ति
    माधवम् । श्रीमन् नृसिंहपादाब्जरेणुं विधिसुभक्षणम् ॥ ४०॥ मदीयचित्तहंसोऽयं मनोवश्यं न याति मे । श्रीनृसिंहः
    पिता मह्यं माता च नरकेसरी ॥ ४१॥ वर्तते ताभुवौ नित्यं रौवहं परियामि वै । सत्यं सत्यं पुनः सत्यं नृसिंहः
    शरणं मम ॥ ४२॥ अहोभाग्यं अहोभाग्यं नारसिंहो गतिर्मम । श्रीमन् नृसिंह पादाब्ज द्वन्द्वं मे हृदये सदा
    ॥ ४३॥ वर्ततां वर्ततां नित्यं दृढभक्तिं प्रयच्छ मे । नृसिंह तुष्टो भक्तोऽयं भुक्तिं मुक्तिं प्रयच्छति
    ॥ ४४॥ नृसिंहहृदयं यस्तु पठेन्नित्यं समाहितः । नृसिंहत्वं समाप्नोति नृसिंहः संप्रसीदति ॥ ४५॥ त्रिसन्ध्यं
    यः पठेन्नित्यं मन्दवारे विषेशतः । राजद्वारे सभास्थाने सर्वत्र विजयी भवेत् ॥ ४६॥ यं यं चिन्तयते कामं
    तं तं प्राप्नोति निश्चितम् । इह लोके शुभान् कामान् परत्र च पराङ्गितम् ॥ ४७॥ ॥ इति भविष्योत्तरपुराणे
    प्रह्लादकथितं श्रीलक्ष्मीनृसिंहहृदयस्तोत्रं सम्पूर्णम् ॥
