id: renukastotramagamarahasye
category: stotram
name:
  english: renukastotramagamarahasye
  devanagari: रेणुकास्तोत्रमागमरहस्ये
content:
  english: om hrinkararupini devi renuka sukhadayini | klinkararupini shraddha siddhisaubhagyadayini ||
    vagbhava kamarupa ca kamakallolamalini | shadbija ca tribija ca navabija na va nava || navabhairavapujya
    ca navami nava vallabha | namastasyai namastasyai renukayai namo namah || caitanyarupini vidya nirguna
    gunaparaga | namastasyai namastasyai renukayai namo namah || prapancarahita prithvi lakshanatitavigraha
    | namastasyai namastasyai renukayai namo namah || ya kamadhenuh sakalarthadatri sarveshvari sarvabhayapahantri
    | ya saccidanandakari jananam sa renuka patu nirantaram mam || ya ramamata ramaniyarupa ramadhavadyairabhipujitandhrih
    | nityotsava nirjaravandita ca sa renuka patu nirantaram mam || ya kalaratrih kalikalmashaghni kalyanashailamalavasavasa
    | yogeshvararadhitapadapadma sa renuka patu nirantaram mam || ya bhargapatni bhavarogahantri bhakteshvari
    bhaktajanabhinandini | bhavya bhavani bhavapujita ya sa renuka patu nirantaram mam || ya ekala'nekashariradharini
    divyambara divyasuratvapujita | shiva'para sarvasukhaikabhumida sa renuka patu nirantaram mam || namaste
    ramamatre te namah kalyanadayini | namah sakalasanghatryai renukayai namo'stu te || brahmarupe namaste'stu
    namaste shivarupini | vishnurupe namaste'stu renukayai namo'stu te || sarvashaktyai namaste'stu sarvavyapini
    sarvada | sarvarthasadhike nityam renukayai namo'stu te || namo namaste bhairavyai bhavabhitinivarini
    | bhavanyai bhaktavashyayai renukayai namo'stu te || vishvadhare vishvamaye vishveshvaravilasini |
    vishvambhari vishalakshi renukayai namo'stu te || kamale kamalavase kamalodbhavapujite | kamade kamavarade
    renukayai namo'stu te || vishvabije viratayai virajambaradharini | yantreshvari mahamaye renukayai
    namo'stu te || nikhilanigamagite shambhuvamankasamsthe sharanajanasutare taramantradirudhe | suravaramunivaryaih
    pujite patrahaste paramasukhasukhabdhe renuke tvam prasida || bhairava uvaca renukastotrametatte kathitam
    bhuvaneshvari | sarvakamapradam nrinam sarvarishtavinashakrit || sarvabhishtakaram divyam pathaniyam
    prayatnatah | ityagamarahasye vai bhairavena samiritam || iti shryagamarahasye bhairavaproktam renukastotram
    sampurnam || atha shrirenukamantrah asya shrirenukamantrasya shrirudra rishih shrirenukadevi devata
    virat chandah klim bijam shrirenukadevi shaktih klim kilakam mamabhishtasiddhaye jape viniyogah ||
    dhyanam praphullaharakeyurakundaladi virajitam | prasannavadanam shantam shridevim renukam bhaje ||
    mantrah 1| klim klim klim renukadevyai namah | 2| klim klim klim svaha | 3| klim renukayai svaha |
    dhyanam lolalyalilasatpraphullasumano jalollasatkanane bhilliveshamanangavegajanakam dhritva calanti
    shanaih | lolapangatarangarangasudrisha sammohayanti shivam cancaccancalanupuradhvaniyuta varvarti
    sarvarthada || || iti ||
  devanagari: ॐ ह्रीङ्काररूपिणी देवी रेणुका सुखदायिनी । क्लीङ्काररूपिणी श्रद्धा सिद्धिसौभाग्यदायिनी ॥
    वाग्भवा कामरूपा च कामकल्लोलमालिनी । षड्बीजा च त्रिबीजा च नवबीजा न वा नवा ॥ नवभैरवपूज्या च नवमी नव
    वल्लभा । नमस्तस्यै नमस्तस्यै रेणुकायै नमो नमः ॥ चैतन्यरूपिणी विद्या निर्गुणा गुणपारगा । नमस्तस्यै
    नमस्तस्यै रेणुकायै नमो नमः ॥ प्रपञ्चरहिता पृथ्वी लक्षणातीतविग्रहा । नमस्तस्यै नमस्तस्यै रेणुकायै नमो
    नमः ॥ या कामधेनुः सकलार्थदात्री सर्वेश्वरी सर्वभयापहन्त्री । या सच्चिदानन्दकरी जनानां सा रेणुका पातु
    निरन्तरं माम् ॥ या राममाता रमणीयरूपा रमाधवाद्यैरभिपूजितान्ध्रिः । नित्योत्सवा निर्जरवन्दिता च सा रेणुका
    पातु निरन्तरं माम् ॥ या कालरात्रिः कलिकल्मषघ्नी कल्याणशैलामलवासवासा । योगेश्वराराधितपादपद्मा सा रेणुका
    पातु निरन्तरं माम् ॥ या भर्गपत्नी भवरोगहन्त्री भक्तेश्वरी भक्तजनाभिनन्दिनी । भव्या भवानी भवपूजिता
    या सा रेणुका पातु निरन्तरं माम् ॥ या एकलाऽनेकशरीरधारिणी दिव्याम्बरा दिव्यसुरत्वपूजिता । शिवाऽपरा सर्वसुखैकभूमिदा
    सा रेणुका पातु निरन्तरं माम् ॥ नमस्ते राममात्रे ते नमः कल्याणदायिनी । नमः सकलसङ्घात्र्यै रेणुकायै
    नमोऽस्तु ते ॥ ब्रह्मरूपे नमस्तेऽस्तु नमस्ते शिवरूपिणी । विष्नुरूपे नमस्तेऽस्तु रेणुकायै नमोऽस्तु ते
    ॥ सर्वशक्त्यै नमस्तेऽस्तु सर्वव्यापिणि सर्वदा । सर्वार्थसाधिके नित्यं रेणुकायै नमोऽस्तु ते ॥ नमो नमस्ते
    भैरव्यै भवभीतिनिवारिणी । भवान्यै भक्तवश्यायै रेणुकायै नमोऽस्तु ते ॥ विश्वाधारे विश्वमये विश्वेश्वरविलासिनी
    । विश्वम्भरि विशालाक्षि रेणुकायै नमोऽस्तु ते ॥ कमले कमलावासे कमलोद्भवपूजिते । कामदे कामवरदे रेणुकायै
    नमोऽस्तु ते ॥ विश्वबीजे विराटायै विरजाम्बरधारिणि । यन्त्रेश्वरि महामाये रेणुकायै नमोऽस्तु ते ॥ निखिलनिगमगीते
    शम्भुवामाङ्कसंस्थे शरणजनसुतारे तारमन्त्रादिरूढे । सुरवरमुनिवर्यैः पूजिते पात्रहस्ते परमसुखसुखाब्धे
    रेणुके त्वं प्रसीद ॥ भैरव उवाच रेणुकास्तोत्रमेतत्ते कथितं भुवनेश्वरि । सर्वकामप्रदं नॄणां सर्वारिष्टविनाशकृत्
    ॥ सर्वाभीष्टकरं दिव्यं पठनीयं प्रयत्नतः । इत्यागमरहस्ये वै भैरवेण समीरितम् ॥ इति श्र्यागमरहस्ये भैरवप्रोक्तं
    रेणुकस्तोत्रं सम्पूर्णम् ॥ अथ श्रीरेणुकामन्त्रः अस्य श्रीरेणुकामन्त्रस्य श्रीरुद्र ऋषिः श्रीरेणुकादेवी
    देवता विराट् छन्दः क्लीं बीजं श्रीरेणुकादेवी शक्तिः क्लीं कीलकं ममाभीष्टसिद्धये जपे विनियोगः ॥ ध्यानम्
    प्रफुल्लहारकेयूरकुण्डलादि विराजिताम् । प्रसन्नवदनां शान्तां श्रीदेवीं रेणुकां भजे ॥ मन्त्रः १। क्लीं
    क्लीं क्लीं रेणुकादेव्यै नमः । २। क्लीं क्लीं क्लीं स्वाहा । ३। क्लीं रेणुकायै स्वाहा । ध्यानम् लोलल्यालिलसत्प्रफुल्लसुमनो
    जालोल्लसत्कानने भिल्लीवेषमनङ्गवेगजनकं धृत्वा चलन्ती शनैः । लोलापाङ्गतरङ्गरङ्गसुदृशा सम्मोहयन्ती शिवं
    चञ्चच्चञ्चलनूपुरध्वनियुता वर्वर्ति सर्वार्थदा ॥ ॥ इति ॥
