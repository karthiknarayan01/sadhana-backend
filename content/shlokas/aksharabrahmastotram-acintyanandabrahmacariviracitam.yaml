id: aksharabrahmastotram-acintyanandabrahmacariviracitam
category: stotram
name:
  english: aksharabrahmastotram (acintyanandabrahmacariviracitam)
  devanagari: अक्षरब्रह्मस्तोत्रम् (अचिन्त्यानन्दब्रह्मचारीविरचितम्)
content:
  english: baddhacarano yato naiti preshthat kvacidapi prithagbhavamajitah | yatha shabdadartho nijavimalacittadapi
    viyat gunatitanandam munivaramaham naumi satatam || 5|| sthito maturgarbhe harimaviratam yo'ksharaparam
    cidanandakaram lalitavasanalankritidharam | apashyatpunyaksham vidhumiva cakorah shucirucim gunatitanandam
    munivaramaham naumi satatam || 6|| anakrishtatma yo bhuvanavishayai
  devanagari: बद्धचरणो यतो नैति प्रेष्ठात् क्वचिदपि पृथग्भावमजितः । यथा शब्दादर्थो निजविमलचित्तादपि वियत्
    गुणातीतानन्दं मुनिवरमहं नौमि सततम् ॥ ५॥ स्थितो मातुर्गर्भे हरिमविरतं योऽक्षरपरं चिदानन्दाकारं ललितवसनालङ्कृतिधरम्
    । अपश्यत्पुण्याक्षं विधुमिव चकोरः शुचिरुचिं गुणातीतानन्दं मुनिवरमहं नौमि सततम् ॥ ६॥ अनाकृष्टात्मा
    यो भुवनविषयै
meaning: {}
