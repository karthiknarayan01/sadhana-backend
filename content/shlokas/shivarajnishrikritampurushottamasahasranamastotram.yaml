id: shivarajnishrikritampurushottamasahasranamastotram
category: stotram
name:
  english: shivarajnishrikritampurushottamasahasranamastotram
  devanagari: शिवराज्नीश्रीकृतंपुरुषोत्तमसहस्रनामस्तोत्रम्
content:
  english: shivarajnishrikritam purushottamasahasranamastotram shrishivarajnishriruvaca | triptaham purvarupani
    jnatva kantamukhanmama | praneshaya namaste'stu pururupaya sharngine || 24|| raudriramaninathashridyunarayana
    te namah | mairavidhritiyunmerunarayanaya te namah || 25|| saurishataniyavishnunarayanaya te namah
    | candrikaumudishadevanarayanaya te namah || 26|| bhuyasidakshinashrishayantrayana te namah | vaishnavishrisha
    te brahmanarayana namo'stu ca || 27|| devavithishrisha adityanarayana te namah | anantishrisha te
    garutmannarayana te namah || 28|| arshipadmesha te arshanarayanaya te namah | jyotsnashrishvara te
    prajnanarayana namo'stu te || 29|| shardulikashrisha viranarayanaya te namah | sarobhadrashrisha bhadranarayanaya
    te namah || 30|| sarvabhadrashrisha harinarayana namo'stu te | svatantrashripate bijanarayana namo'stu
    te || 31|| jayalakshmipate varanarayana namo'stu te | sudarshanishrisha stripunnarayana namo'stu te
    || 32|| jalanarayanishrisha jalanrayana te namah | svadhajashrisha te shilanarayana namo namah ||
    33|| pundarikashrisha vardhinarayana namo'stu te | makshikishrisha te caturmukhanarayana namah ||
    34|| kripavatishrisha kripanarayana namo'stu te | ratnanarayanishrisha tirthanrayana te namah || 35||
    bhaktishrikanta te jivanarayana namo namah | ardhashrishvara te'rdhashripatinarayana namah || 36||
    ardhordhvashrishvara te'rdhapitrinarayana namah | pippalashripate plakshanarayana ca te namah || 37||
    pithikashrisha te shalapumstvanarayana namah | vatashrikanta te shyamanarayana namo namah || 38||
    rajarajnishrisha rajanarayana ca te namah | naishthikishrisha te brahmacarinrayana te namah || 39||
    shivanarayanishrisha shivanrayana te namah | stanakishripate svarnanarayana ca te namah || 40|| svaminishripate
    svaminarayana ca te namah | nirvanishrisha savananarayana ca te namah || 41|| sadhvinarayanisha te
    sadhunarayana namah | kumbhikashrisha te bhaktanarayana namo namah || 42|| medhavatishrisha te ca
    medhanarayana namah | parthivishrisha te vahninarayana namo namah || 43|| rasanarayanishrisha rasanrayana
    te namah | sudhakshinishrisha cakranarayana namo'stu te || 44|| vijayashripate satyanarayana ca te
    namah | hiranyashripate hiranyanarayana te namah || 45|| naishkincanishrisha nairanjaninrayana te
    namah | kalyanishripate punyanarayana ca te namah || 46|| rukmavatishrisha brihadbrahmanarayana namah
    | suvidyashripate gurunarayana ca te namah || 47|| acaryanishrisha acaryanarayana te namah | vaidyutishrisha
    te vidyunnarayana namo namah || 48|| madhavishripate madhunarayana ca te namah | dhenumatishrisha
    nathanarayana namo'stu te || 49|| vishvishrisha vibhunarayana te ca namo namah | muktishrisha te mokshanarayana
    namo namah || 50|| shivarajnishrisha krishnanarayanaya te namah | lakshminathashripate te kamalakanta
    te namah || 51|| padmapate ramakanta narayanisha te namah | indirakanta ca hiranmayipranapate nama
    || 52|| mahalakshmipate krishnapate ishvarisha namah | harinikanta parameshvaripate ca te namah ||
    53|| dravyapate ca purushottamipate ca te namah | vaishnavisha ca sampadrupadhisha ca te namah ||
    54|| bhagavatisha ca haridasishvara ca te namah | haripriyesha vaikunthikesha brahmisha te namah ||
    55|| samriddhishvara shalagramikanta ca te namah | dhanatrayodashikanta cakrininatha te namah || 56||
    padminisvamine bindvipataye te namo namah | abdhijeshaya ca svarnarupinikanta te namah || 57|| goshakridvasinisvamin
    brahmahritsthesha te namah | dhaneshvarishvara ritambharaya te namo namah || 58|| plakshavaseshvarishaya
    mayeshaya ca te namah | matrikeshvara ca'mayeshvara satisha te namah || 59|| svamininatha te brahmashaktikanta
    ca te namah | atmatmikesha'ntaratmikesha ramesha te namah || 60|| sattvaprakarshinikanta pancalesha
    ca te namah | cancadrupeshvarashrivatsesha aindrisha te namah || 61|| jayantisha ca te mandalatmikeshvara
    te namah | sarvatobhadrikasvamin padmashilesha te namah || 62|| aksharisha ca prajnesha shrangarikesha
    te namah | bhagyarupesha siddhisha'vatarinipate namah || 63|| shantanatha paresham'sheshvara kalesha
    te namah | vibhavishvara bhumnisha dhaminikanta te namah || 64|| arcasvamin jananisha karinivara te
    namah | devishvarishvarishvara muktanikapate namah || 65|| praposhikesha ca parabrahmapatnipate namah
    | anadinipate mama pate vrindapate namah || 66|| tulasikanta te capi bhargavipataye namah | anadishrikrishnanarayanapatnisha
    te namah || 67|| annadinipate vaibhaveshvarishaya te namah | sampattisha ca vasudevishvara ca te namah
    || 68|| karshnisvamin hamsikesha manikikanta te namah | padmavatipate radhapate gopipate namah ||
    69|| parshadanipate padmalayapate ca te namah | ajanubahavishaya yantrikishaya te namah || 70|| saurashtrishaya
    te cajanabhishvaraya te namah | devikapataye shashthimanasapataye namah || 71|| dipavalisvamine te
    talajapataye namah | kamadhenavikantaya arjantisvamine namah || 72|| krodhanasvamine te ca gahvarasvamine
    namah | sucikantaya ca vanadevishvaraya te namah || 73|| damanisvamine kankatalinathaya te namah |
    pitrikanyasvamine te dasishvaraya te namah || 74|| rasatalisvamine te vasantipataye namah | salamalishvara
    matrikeshvaraya ca te namah || 75|| svastikinatha nageshishvaraya te namo namah | shavadinisvamine
    te aindrajalisha te namah || 76|| sarasvatisvamine te vidyakantaya te namah | lakshmanipataye bhugarbhiyanathaya
    te namah || 77|| nadikapataye vaishvavasavipataye namah | jummasemlisvamine te santapanisha te namah
    || 78|| sauratisvamine mahabaleshvarisha te namah | ailaviladhisha dakshajavangarisha te namah ||
    79|| aushnalayinatha prajakiyeshvara namo'stu te | paitrinathaya te sevikeshvaraya ca te namah ||
    80|| pracinipataye nripipataye te namo namah | paishangipataye santaraninathaya te namah || 81|| shaibishvaraya
    te tharkutasthishvaraya te namah | vairajarisvamine te shaktyakshinisha te namah || 82|| pishacinishvara
    kalimashinathaya te namah | auralaketavisvamin krathakisha ca te namah || 83|| parthavirajikeshaya
    caushtralishaya te namah | hankaripataye jayakashthalipataye namah || 84|| tiranipataye calvinarishaya
    ca te namah | vardhikapataye'nathanathaya te namo namah || 85|| rajaputrishvara prakirnikakantesha
    te namah | alpaketavikantaya jayakarshnishvaraya ca || 86|| parishanisvamine te caindurayisha te namah
    | maudrandipataye gandatmajanathaya te namah || 87|| lainornisvamine barhaccharishvaraya te namah
    | balalinisvamine te varasaimhisha te namah || 88|| rayagamalikakanta stokahomisha te namah | phainatantavinathaya
    kashthayanisha te namah || 89|| kolakishaya ca dainamanishaya ca te namah | rayakinnatikasvamin rayakotishvarisha
    te || 90|| ranajitisvamine te vakakshikesha te namah | marishipataye baleshvarishvaraya te namah ||
    91|| lambarisvamine rayanavarkipataye namah | hundishasvamine kupeshikadhipataye namah || 92|| kalimandisvamine
    te jeleshipataye namah | paravarisvamine te kotishvarisha te namah || 93|| satishikasvamine te karkashinisha
    te namah | andajarisha te balyarajasipataye namah || 94|| saumanikapataye te gavakshipataye namah
    | paranvrittisha sumanishvarinatha ca te namah || 95|| aishanapanipataye rayapanibhrite namah | mangalapataye'mritapataye
    te namo namah || 96|| premadipataye rajnipataye te namo namah | kauberipataye capi mahendripataye
    namah || 97|| yamishvaraya ca namo vayavishaya te namah | vaishvakarmisvamine te varkshinathaya te
    namah || 98|| raudrishaya ca te vahniputrishvaraya te namah | shravanisvamine te khanijinathaya vai
    namah || 99|| samvatsarisvamine te gopikeshaya te namah | pracinipataye te ca pishangipataye namah
    || 100|| rashiyanisvamine te romayanisha te namah | parashipataye te ca dhaivaripataye namah || 101||
    kinnarisvamine'marikantaya te namo namah | gaurishaya parishaya''briktishaya ca te namah || 102||
    haritishaya patalishvaraya te namo namah | svarginishaya'psarahkantaya te ca namo namah || 103|| brahmasarahpataye
    te gayikapataye namah | vidyunmanisvamine te kushaleshaya te namah || 104|| bhaumishvaraya ca tubhyam
    danavishaya te namah | shaktinathaya ca kashirajnishaya namo namah || 105|| dhenupalisvamine te sakhishvaraya
    te namah | rajarajeshvarishaya lileshvaraya te namah || 106|| vibhutishaya ca divyasiddhishvaraya
    te namah | ashanapataye vishvapataye te namo namah || 107|| shridharaya bhagavatisvamine te namo namah
    | mahamayadhipataye prakritishaya te namah || 108|| nyasinipataye sadhvipataye te namo namah | pativratasvamine
    te dikshadhipataye namah || 109|| prapattipataye radheshaya priyabhrite namah | vairajishaya ca bhutishvaraya
    te namo namah || 110|| srishtishaya vinashtishaya pushtishaya te namah | giteshvaraya upanishadishvaraya
    te namah || 111|| shrutishvaraya ca paravidyeshvaraya te namah | gayatrishaya namaste sharadeshaya
    te namah || 112|| shabdishaya namastubhyamekadashisha te namah | dvadashishaya ca namo jayantishaya
    te namah || 113|| bhavaneshaya ca muktishaya tubhyam namo namah | sevanathaya te caradhanakantaya
    te namah || 114|| ganganathaya ca mokshapurinathaya te namah | sankhyayoginishvaraya naishthakipataye
    namah || 115|| tyaginipataye caryadhishaya ca te namah | yoginipataye vitaranishaya te namah || 116||
    nagavallisvamine te pugishvaraya te namah | ratinathaya surabhisvamine te namo namah || 117|| nirvrittishaya
    sandhya'dhipataye te namo namah | mohinishaya ca vidyadhrishaya te namo namah || 118|| kimpurushisvamine
    te krishishvaraya te namah | abishvaraya ca mridishvaraya te namo namah || 119|| bhupataye lalitasvamine
    te ca namo namah | kunkumavapisha samhitanathaya namo namah || 120|| gurvishvaraya ca mudrikeshvaraya
    ca te namah | aranishaya ca kashishvaraya te namo namah || 121|| tapasvinisvamine te sairandhrishaya
    te namah | dhatrishaya ca namo nagarishaya te namah || 122|| parivrajikakantaya''ryasurinishvaraya
    ca | rameshaya tatha rameshaya te ca namo namah || 123|| stutishaya''rartikeshaya pujeshaya te namah
    | ambikeshaya ca nabhovanishvaraya te namah || 124|| buddhishvaraya ca stanashrishvaraya ca te namah
    | pratimashripataye'vyakteshaya ca te namah || 125|| rasadhipataye sudhapataye te namo namah | punyadhipataye
    mishtapataye te namo namah || 126|| pakinishaya dhanyadhipataye te namo namah | ajnanathaya ca mumukshapataye
    ca te namah || 127|| virajeshaya ca candrakaleshaya ca te namah | sushilapataye kadambamaleshaya te
    namah || 128|| parijata'dhipataye kalikapataye namah | durganathaya cadhipataye te namo namah || 129||
    nandinishaya ca pattanganeshaya ca te namah | sarayusvamine sattvatishaya te namo namah || 130|| saketapataye
    sudakshinadhipataye namah | karishinisvamine te harinipataye namah || 131|| dharanisvamine lilasvamine
    te namo namah | satyanathaya pancalipataye te namo namah || 132|| pradipapataye bhagirathikantaya
    te namah | kanakasvamine cairavatinathaya te namah || 133|| sarojinisvamine te kantakantaya te namah
    | gomatipataye revasvamine te namo namah || 134|| vishalakshisvamine te svarnarekhesha te namah |
    revatisvamine riksvamine te ca namo namah || 135|| vaikunthapataye brahmasatikantaya te namah | ishavasyasvamine
    te smritikantaya te namah || 136|| kanyakantaya ca bhadrakantaya te namo namah | ojasvatisvamine te
    sattakantaya te namah || 137|| vishnugarbhadhipataye vairajnipataye namah | devishvaraya ca pradhanasvamine
    namo namah || 138|| varanipataye golokishvaraya te namah | badarishaya ca shvetanathaya te namo namah
    || 139|| pavanipataye ca'vyakritikantaya te namah | dhatrishaya ca jyotsnasvamine te namo namah ||
    140|| viryakantaya mahatinathaya te namo namah | oshadhipataye'japataye te ca namo namah || 141||
    vishvambharasvamine te cannapurnabhrite namah | vibhavarisvamine te dakshinapataye namah || 142||
    ahutishaya ca sanatanishvaraya te namah | anjanishaya ca gandakishvaraya ca te namah || 143|| te siteshaya
    shabaripataye pingalabhrite | preyasipataye capi shreyasipataye namah || 144|| malavatisvamine te
    dvarikeshaya te namah | simhavatisvamine te trisprishasvamine namah || 145|| pakshavardhininathayonmilanisvamine
    namah | utpattisvamine mokshadakantaya ca te namah || 146|| saphalasvamine putrapradanathaya te namah
    | shattilasvamine jayasvamine te namo namah || 147|| vijayasvamine camalakinathaya te namah | papamocaninathaya
    kamadeshaya te namah || 148|| varuthinisvamine te mohinisvamine namah | aparasvamine te ca nirjalasvamine
    namah || 149|| yoginisvamine te ca shayanisvamine namah | kamikasvamine te ca putradasvamine namah
    || 150|| ajanathaya padmanathayendirabhrite namah | pashankushadhinathaya ramanathaya te namah ||
    151|| prabodhinishvaraya'pi kamaleshaya te namah | dhamadeshaya ca kapileshaya te namo namah || 152||
    shalabheshaya ca candrabhageshaya ca te namah | kumudvatisvamine te nityanathaya te namah || 153||
    candrakantaya padmakshisvamine te namo namah | kantimatisvamine te hrishikeshaya te namah || 154||
    aparajitanathaya padmavatisha te namah | sunandasvamine dhipataye te ca namo namah || 155|| nandanathaya
    ca trayisvamine te namo namah | kshemankarisvamine te sundaripataye namah || 156|| subhagasvamine
    sulakshananathaya te namah | kurminathaya ca matsyinathaya te namo namah || 157|| ashvinisvamine hamsisvamine
    te namo namah | saubhagyasundarishaya kalkinisvamine namah || 158|| duhkhahashrisvamine te vanjulisvamine
    namah | ratrishvaraya namo'dhaveshvaraya namo namah || 159|| kshirodatanayeshaya ghantikapataye namah
    | nirajanadhinathaya ghatikasvamine namah || 160|| vasumatyadhinathaya ritambharabhrite namah | radhyasapataye
    divyarunanathaya te namah || 161|| vamrinathaya ca jyoshtrinathaya te namo namah | sudughasvamine
    kaidarikanathaya te namah || 162|| jalandharisvamine te shankhacudibhrite namah | malatisvamine barbarikanathaya
    te namah || 163|| vedavatisvamine te padminisvamine namah | vrindavanisvamine te kamvatisvamine namah
    | pivarisvamine marupatninathaya te namah || 164|| tirthavallisvamine te tirthashrisvamine namah |
    tilottamasvamine te rupavatibhrite namah || 165|| vedamatrivaraya'pi gayatripataye namah | sarameshaya
    ca paippaladishvaraya te namah || 166|| upaleshaya dharanijeshaya te namo namah | dhareshaya namastubhyam
    matulishaya te namah || 167|| pingalishaya ca mrigishaya te ca namo namah | gaurasvarupinishaya nitishvaraya
    te namah || 168|| buddhishvaraya ca namah sakriyeshaya te namah | tushtishaya namastubhyam kamaneshaya
    te namah || 169|| vedikeshaya ca namashcajyahutibhrite namah | patnishaladhipataye citinathaya te
    namah || 170|| idhmanathaya ca nama udgitipataye namah | dhritishaya namo velasvamine ca namo namah
    || 171|| dhumornapataye te ca kashthadhishaya te namah | vadhunathaya ca latanathaya te namo namah
    || 172|| nadinathaya ca namah patakapataye namah | bhoginipataye namo rasikapataye namah || 173||
    cidanandisvamine te mrityulakshmibhrite namah | sushrutipataye vijayantishvaraya te namah || 174||
    sukanyapataye namashcalasapataye namah | shrichayasvamine citralekhanathaya te namah || 175|| navarangadhipataye
    kimshukisvamine namah | kalpalatadhinathaya bakulapataye namah || 176|| citravatisvamine te carupadmabhrite
    namah | suvarnamukharishaya malavatibhrite namah || 177|| viradhipataye prabhavatinathaya te namah
    | shrimatisvamine panyasvamine te namo namah || 178|| nagalakshmisvamine te jyotishmatibhrite namah
    | udyoginisvamine te purnanathaya te namah || 179|| siddheshvarisvamine te kritikantaya te namah |
    kavitasvamine granthivaratmane namo namah || 180|| talikasvamine capi sangitisvamine namah | praharinipataye
    te maninisvamine namah || 181|| jaratkarvisvamine te svastinathaya te namah | kshamanathaya ca namah
    pratishthapataye namah || 182|| lajjanathaya ca namah pipasapataye namah | dahikasvamine shraddhasvamine
    te namo namah || 183|| maithiliyuthanathaya kaushalasvamine namah | nikunjakantanathaya shayyakantaya
    te namah || 184|| purandhrikulakantaya kiratisvamine namah | pulindisvamine simhaladvipastribhrite
    namah || 185|| daishikisvamine namo vidaishikibhrite namah | kratukanakinathaya'jitapatstribhrite
    namah || 186|| shrilokadripriyeshaya devateshaya te namah | samudrikasvamine te parthivisvamine namah
    || 187|| urvashivratanathaya sutalisvamine namah | triveniprananathaya shabarishaya te namah || 188||
    pampavaraya ca rajeshvarishaya ca te namah | lambananadhinathaya cajamukhishvaraya ca || 189|| kanyakumarikeshaya
    gopakanyabhrite namah | raivatisvamine namo gau lisvamine namah || 190|| jivantipataye lavanyavatipataye
    namah | maliniprananathaya kubjikasvamine namah || 191|| yavanisvamine mrigavatinathaya te namah |
    kantimatisvamine te jaradgaurishvaraya ca || 192|| sumitrasvamine sutanathaya te namo namah | vindhyavalisvamine
    te paunyanaidheyikabhrite || 193|| vardhinisvamine vaishvavasavishaya te namah | kuladevisvamine te
    raseshvaribhrite namah || 194|| rajavatisvamine simantinishaya te namah | samavatisvamine te canartisharadabhrite
    || 195|| mahanandasvamine bandulanathaya te namah | manoramadhinathaya shucishmatibhrite namah ||
    196|| arcishmatisvamine sushilaviprabhrite namah | kalavatisvamine te lilavatibhrite namah || 197||
    ratnavalisvamine te shashilekhabhrite namah | anangalekhapataye citralekhabhrite namah || 198|| divyarshisvamine
    capi surasasvamine namah | varshabhvisvamine paravatinathaya te namah || 199|| prabhavatisvamine te
    narmadasvamine namah | rohinishaya kumudakantaya te namo namah || 200|| puruhutapataye ca sharmavatibhrite
    namah | sudhamnisvamine te ca madhavi svamine namah || 201|| kundadantisvamine te kadambamalikabhrite
    | shandilisvamine madhuvidyabhrite ca te namah || 202|| ashvamukhisvamine te gajamukhishvaraya ca
    | ambeshvaraya ca vriddheshvaraya te namo namah || 203|| kunkumavapinathaya hingalajishvaraya ca |
    kamakshisvamine te ca minakshishaya te namah || 204|| damayantisvamine te bhadrikasvamine namah |
    pritikarnotpaleshaya dirdhikeshaya te namah || 205|| phalavatisvamine te ramanathaya te namah | gobhilasvamine
    gopasutanathaya te namah || 206|| udumburisvamine te'shtashashtisvamine namah | ratnavatisvamine te
    shubhakshisvamine namah || 207|| devalilasvamine te devanadishvaraya ca | bahucaradhinathaya hingulajabhrite
    namah || 208|| brahmamohininathaya'nuvrittisvamine namah | vishalapataye paravidyadhipataye namah
    || 209|| devatapataye cityakutisvaminnamo'stu te | purinathaya kamaleshvarishaya namo namah || 210||
    pracinathaya ca rishitoyanathaya te namah | gautamishaya ca vapushmatishaya ca te namah || 211|| manikarnadhinathaya
    shrimatrisvamine namah | namah parthadhipataye mahishmatibhrite namah || 212|| bhillikasvamine tubhyam
    saurashtrishibhrite namah | vyaghrishaya namastubhyam cillinathaya te namah || 213|| tithinathayabhicarinishvaraya
    ca te namah | nishadisvamine vyalisvamine te namo namah || 214|| caturbhujadhinathaya harshasiddhibhrite
    namah | sarikapataye vishvarupanathaya te namah || 215|| sha
  devanagari: शिवराज्ञीश्रीकृतं पुरुषोत्तमसहस्रनामस्तोत्रम् श्रीशिवराज्ञीश्रीरुवाच । तृप्ताहं पूर्वरूपाणि
    ज्ञात्वा कान्तमुखान्मम । प्राणेशाय नमस्तेऽस्तु पुरुरूपाय शार्ङ्गिणे ॥ २४॥ रौद्रीरमणीनाथश्रीद्युनारायण
    ते नमः । मैरवीधृतियुङ्मेरुनारायणाय ते नमः ॥ २५॥ सौरीशातनीयविष्णुनारायणाय ते नमः । चान्द्रीकौमुदीशदेवनारायणाय
    ते नमः ॥ २६॥ भूयसीदक्षिणाश्रीशयन्त्रयण ते नमः । वैष्णवीश्रीश ते ब्रह्मनारायण नमोऽस्तु च ॥ २७॥ देववीथीश्रीश
    आदित्यनरायण ते नमः । आनन्तीश्रीश ते गरुत्मन्नारायण ते नमः ॥ २८॥ आर्षीपद्मेश ते आर्षनारायणाय ते नमः
    । ज्योत्स्नाश्रीश्वर ते प्राज्ञनारायण नमोऽस्तु ते ॥ २९॥ शार्दूलिकाश्रीश वीरनारायणाय ते नमः । सरोभद्राश्रीश
    भद्रनारायणाय ते नमः ॥ ३०॥ सर्वभद्राश्रीश हरिनारायण नमोऽस्तु ते । स्वतन्त्राश्रीपते बीजनारायण नमोऽस्तु
    ते ॥ ३१॥ जयालक्ष्मीपते वरनारायण नमोऽस्तु ते । सुदर्शनीश्रीश स्त्रीपुन्नारायण नमोऽस्तु ते ॥ ३२॥ जलनारायणीश्रीश
    जलन्रयण ते नमः । स्वधाजश्रीश ते शीलनारायण नमो नमः ॥ ३३॥ पुण्डरीकश्रीश वार्धिनारायण नमोऽस्तु ते । माक्षिकीश्रीश
    ते चतुर्मुखनारायण नमः ॥ ३४॥ कृपावतीश्रीश कृपनारायण नमोऽस्तु ते । रत्ननारायणीश्रीश तीर्थन्रयण ते नमः
    ॥ ३५॥ भक्तिश्रीकान्त ते जीवनारायण नमो नमः । अर्धश्रीश्वर तेऽर्धश्रीपतिनारायण नमः ॥ ३६॥ अर्धोर्ध्वश्रीश्वर
    तेऽर्धपितृनारायण नमः । पिप्पलश्रीपते प्लक्षनारायण च ते नमः ॥ ३७॥ पीठिकाश्रीश ते शालपुंस्त्वनारायण
    नमः । वटश्रीकान्त ते श्यामनारायण नमो नमः ॥ ३८॥ राजराज्ञीश्रीश राजनारायण च ते नमः । नैष्ठिकीश्रीश ते
    ब्रह्मचारिन्रयण ते नमः ॥ ३९॥ शिवनारायणीश्रीश शिवन्रयण ते नमः । स्तनकीश्रीपते स्वर्णनारायण च ते नमः
    ॥ ४०॥ स्वामिनीश्रीपते स्वामिनारायण च ते नमः । निर्वाणीश्रीश सावननारायण च ते नमः ॥ ४१॥ साध्वीनारायणीश
    ते साधुनारायण नमः । कुम्भिकाश्रीश ते भक्तनारायण नमो नमः ॥ ४२॥ मेधावतीश्रीश ते च मेधानारायण नमः । पार्थिवीश्रीश
    ते वह्निनारायण नमो नमः ॥ ४३॥ रसनारायणीश्रीश रसन्रयण ते नमः । सुधाक्षिणीश्रीश चक्रनारायण नमोऽस्तु ते
    ॥ ४४॥ विजयाश्रीपते सत्यनारायण च ते नमः । हिरण्याश्रीपते हिरण्यनारायण ते नमः ॥ ४५॥ नैष्किञ्चनीश्रीश
    नैरञ्जनिन्रयण ते नमः । कल्याणीश्रीपते पुण्यनारायण च ते नमः ॥ ४६॥ रूक्मवतीश्रीश बृहद्ब्रह्मनारायण नमः
    । सुविद्याश्रीपते गुरुनारायण च ते नमः ॥ ४७॥ आचार्याणीश्रीश आचार्यनारायण ते नमः । वैद्युतीश्रीश ते
    विद्युन्नारायण नमो नमः ॥ ४८॥ माधवीश्रीपते मधुनारायण च ते नमः । धेनुमतीश्रीश नाथनारायण नमोऽस्तु ते
    ॥ ४९॥ विश्वीश्रीश विभुनारायण ते च नमो नमः । मुक्तिश्रीश ते मोक्षनारायण नमो नमः ॥ ५०॥ शिवराज्ञीश्रीश
    कृष्णनारायणाय ते नमः । लक्ष्मीनाथश्रीपते ते कमलाकान्त ते नमः ॥ ५१॥ पद्मापते रमाकान्त नारायणीश ते नमः
    । इन्दिराकान्त च हिरण्मयीप्राणपते नम ॥ ५२॥ महालक्ष्मीपते कृष्णापते ईश्वरीश नमः । हरिणीकान्त परमेश्वरीपते
    च ते नमः ॥ ५३॥ द्रव्यापते च पुरुषोत्तमीपते च ते नमः । वैष्णवीश च सम्पद्रूपाधीश च ते नमः ॥ ५४॥ भगवतीश
    च हरिदासीश्वर च ते नमः । हरिप्रियेश वैकुण्ठिकेश ब्राह्मीश ते नमः ॥ ५५॥ समृद्धीश्वर शालग्रामीकान्त
    च ते नमः । धनत्रयोदशीकान्त चक्रिणीनाथ ते नमः ॥ ५६॥ पद्मिनीस्वामिने बिन्द्वीपतये ते नमो नमः । अब्धिजेशाय
    च स्वर्णरूपिणीकान्त ते नमः ॥ ५७॥ गोशकृद्वासिनीस्वामिन् ब्रह्महृत्स्थेश ते नमः । धनेश्वरीश्वर ऋतम्भराय
    ते नमो नमः ॥ ५८॥ प्लक्षवासेश्वरीशाय मायेशाय च ते नमः । मातृकेश्वर चाऽमायेश्वर सतीश ते नमः ॥ ५९॥ स्वामिनीनाथ
    ते ब्रह्मशक्तिकान्त च ते नमः । आत्मात्मिकेशाऽन्तरात्मिकेश रमेश ते नमः ॥ ६०॥ सत्त्वप्रकर्षिणीकान्त
    पञ्चलेश च ते नमः । चञ्चद्रूपेश्वरश्रीवत्सेश ऐन्द्रीश ते नमः ॥ ६१॥ जयन्तीश च ते मण्डलात्मिकेश्वर ते
    नमः । सर्वतोभद्रिकास्वामिन् पद्मशिलेश ते नमः ॥ ६२॥ आक्षरीश च प्रज्ञेश श्राङ्गारिकेश ते नमः । भाग्यरूपेश
    सिद्धीशाऽवतारिणीपते नमः ॥ ६३॥ शान्तानाथ परेशांऽशेश्वर कलेश ते नमः । विभवीश्वर भूम्नीश धामिनीकान्त
    ते नमः ॥ ६४॥ अर्चास्वामिन् जननीश कारिणीवर ते नमः । देवीश्वरीश्वरीश्वर मुक्तानिकापते नमः ॥ ६५॥ प्रपोषिकेश
    च परब्रह्मपत्नीपते नमः । अनादिनीपते मम पते वृन्दापते नमः ॥ ६६॥ तुलसीकान्त ते चापि भार्गवीपतये नमः
    । अनादिश्रीकृष्णनारायणपत्नीश ते नमः ॥ ६७॥ अन्नादिनीपते वैभवेश्वरीशाय ते नमः । सम्पत्तीश च वासुदेवीश्वर
    च ते नमः ॥ ६८॥ कार्ष्णीस्वामिन् हंसिकेश माणिकीकान्त ते नमः । पद्मावतीपते राधापते गोपीपते नमः ॥ ६९॥
    पार्षदानीपते पद्मालयापते च ते नमः । आजानुबाहवीशाय यान्त्रिकीशाय ते नमः ॥ ७०॥ सौराष्ट्रीशाय ते चाजनाभीश्वराय
    ते नमः । देविकापतये षष्ठीमनसापतये नमः ॥ ७१॥ दीपावलीस्वामिने ते तलाजापतये नमः । कामधेनवीकान्ताय आर्जन्तीस्वामिने
    नमः ॥ ७२॥ क्रोधनास्वामिने ते च गह्वरास्वामिने नमः । सूचीकान्ताय च वनदेवीश्वराय ते नमः ॥ ७३॥ दामनीस्वामिने
    कङ्कातालीनाथाय ते नमः । पितृकन्यास्वामिने ते दासीश्वराय ते नमः ॥ ७४॥ रासातलीस्वामिने ते वासन्तीपतये
    नमः । सालमालीश्वर मातृकेश्वराय च ते नमः ॥ ७५॥ स्वास्तिकीनाथ नागेशीश्वराय ते नमो नमः । शावदीनीस्वामिने
    ते ऐन्द्रजालीश ते नमः ॥ ७६॥ सरस्वतीस्वामिने ते विद्याकान्ताय ते नमः । लक्ष्मणीपतये भूगर्भीयानाथाय
    ते नमः ॥ ७७॥ नाडिकापतये वैश्वावासवीपतये नमः । जुम्मासेम्लीस्वामिने ते सान्तपनीश ते नमः ॥ ७८॥ सौरतीस्वामिने
    महाबालेश्वरीश ते नमः । ऐलवीलाधीश दाक्षजवङ्गरीश ते नमः ॥ ७९॥ औष्णालयीनाथ प्राजाकीयेश्वर नमोऽस्तु ते
    । पैत्रीनाथाय ते सेविकेश्वराय च ते नमः ॥ ८०॥ प्राचीनीपतये नृपीपतये ते नमो नमः । पैशङ्गीपतये सान्तारणीनाथाय
    ते नमः ॥ ८१॥ शैबीश्वराय ते थार्कूटस्थीश्वराय ते नमः । वैरजारीस्वामिने ते शाक्त्यक्षिणीश ते नमः ॥ ८२॥
    पिशाचिनीश्वर कालिमाशीनाथाय ते नमः । औरलकेतवीस्वामिन् क्राथकीश च ते नमः ॥ ८३॥ पार्थवीराजिकेशाय चौष्ट्रालीशाय
    ते नमः । हङ्कारीपतये जयकाष्ठलीपतये नमः ॥ ८४॥ तीराणीपतये चाल्वीनारीशाय च ते नमः । वार्धिकापतयेऽनाथानाथाय
    ते नमो नमः ॥ ८५॥ राजपुत्रीश्वर प्रकीर्णिकाकान्तेश ते नमः । आल्पकेतवीकान्ताय जयकार्ष्णीश्वराय च ॥ ८६॥
    पारीशानीस्वामिने ते चैन्दुरायीश ते नमः । मौद्राण्डीपतये गण्डात्मजानाथाय ते नमः ॥ ८७॥ लैनोर्णीस्वामिने
    बार्हच्छरीश्वराय ते नमः । बाललीनीस्वामिने ते वारसैंहीश ते नमः ॥ ८८॥ रायगामलिकाकान्त स्तोकहोमीश ते
    नमः । फैनतान्तवीनाथाय काष्ठयानीश ते नमः ॥ ८९॥ कोलकीशाय च दैनमानीशाय च ते नमः । रायकिन्नटिकास्वामिन्
    रायकोटीश्वरीश ते ॥ ९०॥ राणजितीस्वामिने ते वाकक्षिकेश ते नमः । मारीशीपतये बालेश्वरीश्वराय ते नमः ॥
    ९१॥ लाम्बरीस्वामिने रायनवार्कीपतये नमः । हुण्डिशास्वामिने कूपेशिकाधिपतये नमः ॥ ९२॥ कालीमाण्डीस्वामिने
    ते जेलेशीपतये नमः । पारावारीस्वामिने ते कोटिश्वरीश ते नमः ॥ ९३॥ सातीशिकास्वामिने ते कार्कशिनीश ते
    नमः । आण्डजारीश ते बाल्यराजसीपतये नमः ॥ ९४॥ सौमनिकापतये ते गावाक्षीपतये नमः । पाराङ्वृत्तीश सुमणीश्वरीनाथ
    च ते नमः ॥ ९५॥ ऐशानपानीपतये रायपानीभृते नमः । मङ्गलापतयेऽमृतापतये ते नमो नमः ॥ ९६॥ प्रेमादिपतये राज्ञीपतये
    ते नमो नमः । कौबेरीपतये चापि माहेन्द्रीपतये नमः ॥ ९७॥ यमीश्वराय च नमो वायवीशाय ते नमः । वैश्वकर्मीस्वामिने
    ते वार्क्षीनाथाय ते नमः ॥ ९८॥ रौद्रीशाय च ते वह्निपुत्रीश्वराय ते नमः । श्रावणीस्वामिने ते खानिजीनाथाय
    वै नमः ॥ ९९॥ सांवत्सरीस्वामिने ते गोपिकेशाय ते नमः । प्राचीनीपतये ते च पिशङ्गीपतये नमः ॥ १००॥ राशियानीस्वामिने
    ते रोमायनीश ते नमः । पारशीपतये ते च धैवरीपतये नमः ॥ १०१॥ किन्नरीस्वामिनेऽमरीकान्ताय ते नमो नमः । गौरीशाय
    परीशायाऽऽब्रिक्तीशाय च ते नमः ॥ १०२॥ हारितीशाय पातालीश्वराय ते नमो नमः । स्वार्गिणीशायाऽप्सरःकान्ताय
    ते च नमो नमः ॥ १०३॥ ब्रह्मसरःपतये ते गायिकापतये नमः । विद्युन्मणिस्वामिने ते कुशलेशाय ते नमः ॥ १०४॥
    भौमीश्वराय च तुभ्यं दानवीशाय ते नमः । शक्तिनाथाय च कशीराज्ञीशाय नमो नमः ॥ १०५॥ धेनुपालीस्वामिने ते
    सखीश्वराय ते नमः । राजराजेश्वरीशाय लीलेश्वराय ते नमः ॥ १०६॥ विभूतीशाय च दिव्यसिद्धीश्वराय ते नमः ।
    अशनापतये विश्वापतये ते नमो नमः ॥ १०७॥ श्रीधराय भगवतीस्वामिने ते नमो नमः । महामायाधिपतये प्रकृतीशाय
    ते नमः ॥ १०८॥ न्यासिनीपतये साध्वीपतये ते नमो नमः । पतिव्रतास्वामिने ते दीक्षाधिपतये नमः ॥ १०९॥ प्रपत्तिपतये
    राधेशाय प्रियाभृते नमः । वैराजीशाय च भूतीश्वराय ते नमो नमः ॥ ११०॥ सृष्टीशाय विनष्टीशाय पुष्टीशाय ते
    नमः । गीतेश्वराय उपनिषदीश्वराय ते नमः ॥ १११॥ श्रुतीश्वराय च पराविद्येश्वराय ते नमः । गायत्रीशाय नमस्ते
    शारदेशाय ते नमः ॥ ११२॥ शाब्दीशाय नमस्तुभ्यमेकादशीश ते नमः । द्वादशीशाय च नमो जयन्तीशाय ते नमः ॥ ११३॥
    भावनेशाय च मुक्तीशाय तुभ्यं नमो नमः । सेवानाथाय ते चाराधनाकान्ताय ते नमः ॥ ११४॥ गङ्गानाथाय च मोक्षपुरीनाथाय
    ते नमः । साङ्ख्ययोगिनीश्वराय नैष्ठकीपतये नमः ॥ ११५॥ त्यागिनीपतये चार्याधीशाय च ते नमः । योगिनीपतये
    वीतराणीशाय ते नमः ॥ ११६॥ नागवल्लीस्वामिने ते पूगीश्वराय ते नमः । रतिनाथाय सुरभिस्वामिने ते नमो नमः
    ॥ ११७॥ निर्वृत्तीशाय सन्ध्याऽधिपतये ते नमो नमः । मोहिनीशाय च विद्याध्रीशाय ते नमो नमः ॥ ११८॥ किम्पुरुषीस्वामिने
    ते कृषीश्वराय ते नमः । आबीश्वराय च मृदीश्वराय ते नमो नमः ॥ ११९॥ भूपतये ललितास्वामिने ते च नमो नमः
    । कुङ्कुमवापीश संहितानाथाय नमो नमः ॥ १२०॥ गुर्वीश्वराय च मुद्रिकेश्वराय च ते नमः । अरणीशाय च काशीश्वराय
    ते नमो नमः ॥ १२१॥ तपस्विनीस्वामिने ते सैरन्ध्रीशाय ते नमः । धात्रीशाय च नमो नागरीशाय ते नमः ॥ १२२॥
    परिव्राजिकाकान्तायाऽऽर्यसूरिणीश्वराय च । रमेशाय तथा रामेशाय ते च नमो नमः ॥ १२३॥ स्तुतीशायाऽऽरार्तिकेशाय
    पूजेशाय ते नमः । अम्बिकेशाय च नभोवाणीश्वराय ते नमः ॥ १२४॥ बुद्धीश्वराय च स्तनश्रीश्वराय च ते नमः ।
    प्रतिमाश्रीपतयेऽव्यक्तेशाय च ते नमः ॥ १२५॥ रसाधिपतये सुधापतये ते नमो नमः । पुण्याधिपतये मिष्टापतये
    ते नमो नमः ॥ १२६॥ पाकिनीशाय धान्याधिपतये ते नमो नमः । आज्ञानाथाय च मुमुक्षापतये च ते नमः ॥ १२७॥ विरजेशाय
    च चन्द्रकालेशाय च ते नमः । सुशीलापतये कदम्बमालेशाय ते नमः ॥ १२८॥ पारिजाताऽधिपतये कालिकापतये नमः ।
    दुर्गानाथाय चाधिपतये ते नमो नमः ॥ १२९॥ नन्दिनीशाय च पट्टाङ्गनेशाय च ते नमः । सरयूस्वामिने सात्त्वतीशाय
    ते नमो नमः ॥ १३०॥ साकेतापतये सुदक्षिणाधिपतये नमः । करीषिणीस्वामिने ते हरिणीपतये नमः ॥ १३१॥ धरणीस्वामिने
    लीलास्वामिने ते नमो नमः । सत्यानाथाय पाञ्चालीपतये ते नमो नमः ॥ १३२॥ प्रदीपापतये भागिरथीकान्ताय ते
    नमः । कनकास्वामिने चैरावतीनाथाय ते नमः ॥ १३३॥ सरोजिनीस्वामिने ते कान्ताकान्ताय ते नमः । गोमतीपतये
    रेवास्वामिने ते नमो नमः ॥ १३४॥ विशालाक्षीस्वामिने ते स्वर्णरेखेश ते नमः । रेवतीस्वामिने ऋक्स्वामिने
    ते च नमो नमः ॥ १३५॥ वैकुण्ठापतये ब्रह्मसतीकान्ताय ते नमः । ईशावास्यास्वामिने ते स्मृतिकान्ताय ते नमः
    ॥ १३६॥ कन्याकान्ताय च भद्राकान्ताय ते नमो नमः । ओजस्वतीस्वामिने ते सत्ताकान्ताय ते नमः ॥ १३७॥ विष्णुगर्भाधिपतये
    वैराज्ञीपतये नमः । देवीश्वराय च प्रधानास्वामिने नमो नमः ॥ १३८॥ वरणीपतये गोलोकीश्वराय ते नमः । बदरीशाय
    च श्वेतानाथाय ते नमो नमः ॥ १३९॥ पावनीपतये चाऽव्याकृतिकान्ताय ते नमः । धात्रीशाय च ज्योत्स्नास्वामिने
    ते नमो नमः ॥ १४०॥ वीर्याकान्ताय महतीनाथाय ते नमो नमः । ओषधिपतयेऽजापतये ते च नमो नमः ॥ १४१॥ विश्वम्भरास्वामिने
    ते चान्नपूर्णाभृते नमः । विभावरीस्वामिने ते दक्षिणापतये नमः ॥ १४२॥ आहुतीशाय च सनातनीश्वराय ते नमः
    । अञ्जनीशाय च गण्डकीश्वराय च ते नमः ॥ १४३॥ ते सीतेशाय शबरीपतये पिङ्गलाभृते । प्रेयसीपतये चापि श्रेयसीपतये
    नमः ॥ १४४॥ मालावतीस्वामिने ते द्वारिकेशाय ते नमः । सिंहवतीस्वामिने ते त्रिस्पृशास्वामिने नमः ॥ १४५॥
    पक्षवर्धिनीनाथायोन्मिलनीस्वामिने नमः । उत्पत्तिस्वामिने मोक्षदाकान्ताय च ते नमः ॥ १४६॥ सफलास्वामिने
    पुत्रप्रदानाथाय ते नमः । षट्तिलास्वामिने जयास्वामिने ते नमो नमः ॥ १४७॥ विजयास्वामिने चामलकीनाथाय ते
    नमः । पापमोचनीनाथाय कामदेशाय ते नमः ॥ १४८॥ वरूथिनीस्वामिने ते मोहिनीस्वामिने नमः । अपरास्वामिने ते
    च निर्जलास्वामिने नमः ॥ १४९॥ योगिनीस्वामिने ते च शयनीस्वामिने नमः । कामिकास्वामिने ते च पुत्रदास्वामिने
    नमः ॥ १५०॥ अजानाथाय पद्मानाथायेन्दिराभृते नमः । पाशाङ्कुशाधिनाथाय रमानाथाय ते नमः ॥ १५१॥ प्रबोधिनीश्वरायाऽपि
    कमलेशाय ते नमः । धामदेशाय च कपिलेशाय ते नमो नमः ॥ १५२॥ शलभेशाय च चन्द्रभागेशाय च ते नमः । कुमुद्वतीस्वामिने
    ते नित्यानाथाय ते नमः ॥ १५३॥ चन्द्रकान्ताय पद्माक्षीस्वामिने ते नमो नमः । कान्तिमतीस्वामिने ते हृषीकेशाय
    ते नमः ॥ १५४॥ अपराजितानाथाय पद्मावतीश ते नमः । सुनन्दास्वामिने धीपतये ते च नमो नमः ॥ १५५॥ नन्दानाथाय
    च त्रयीस्वामिने ते नमो नमः । क्षेमङ्करीस्वामिने ते सुन्दरीपतये नमः ॥ १५६॥ सुभगास्वामिने सुलक्षणानाथाय
    ते नमः । कूर्मीनाथाय च मत्स्यीनाथाय ते नमो नमः ॥ १५७॥ अश्विनीस्वामिने हंसीस्वामिने ते नमो नमः । सौभाग्यसुन्दरीशाय
    कल्किनीस्वामिने नमः ॥ १५८॥ दुःखहाश्रीस्वामिने ते वञ्जुलीस्वामिने नमः । रात्रीश्वराय नमोऽधवेश्वराय
    नमो नमः ॥ १५९॥ क्षीरोदतनयेशाय घण्टिकापतये नमः । नीराजनाधिनाथाय घटिकास्वामिने नमः ॥ १६०॥ वसुमत्यधिनाथाय
    ऋतम्भराभृते नमः । राध्यासापतये दिव्यारुणानाथाय ते नमः ॥ १६१॥ वम्रीनाथाय च ज्योष्ट्रीनाथाय ते नमो नमः
    । सुदुघास्वामिने कैदारिकानाथाय ते नमः ॥ १६२॥ जालन्धरीस्वामिने ते शङ्खचूडीभृते नमः । मालतीस्वामिने
    बर्बरिकानाथाय ते नमः ॥ १६३॥ वेदवतीस्वामिने ते पद्मिनीस्वामिने नमः । वृन्दावनीस्वामिने ते कंवतीस्वामिने
    नमः । पीवरीस्वामिने मरुपत्नीनाथाय ते नमः ॥ १६४॥ तीर्थवल्लीस्वामिने ते तीर्थश्रीस्वामिने नमः । तिलोत्तमास्वामिने
    ते रूपवतीभृते नमः ॥ १६५॥ वेदमातृवरायाऽपि गायत्रीपतये नमः । सरमेशाय च पैप्पलादीश्वराय ते नमः ॥ १६६॥
    उपलेशाय धरणिजेशाय ते नमो नमः । धरेशाय नमस्तुभ्यं माटुलीशाय ते नमः ॥ १६७॥ पिङ्गलीशाय च मृगीशाय ते च
    नमो नमः । गौरस्वरूपिणीशाय नीतीश्वराय ते नमः ॥ १६८॥ बुद्धीश्वराय च नमः सक्रियेशाय ते नमः । तुष्टीशाय
    नमस्तुभ्यं कामनेशाय ते नमः ॥ १६९॥ वेदिकेशाय च नमश्चाज्याहुतिभृते नमः । पत्नीशालाधिपतये चितिनाथाय ते
    नमः ॥ १७०॥ इध्मानाथाय च नम उद्गीतिपतये नमः । धृतीशाय नमो वेलास्वामिने च नमो नमः ॥ १७१॥ धूमोर्णापतये
    ते च काष्ठाधीशाय ते नमः । वधूनाथाय च लतानाथाय ते नमो नमः ॥ १७२॥ नदीनाथाय च नमः पताकापतये नमः । भोगिनीपतये
    नमो रसिकापतये नमः ॥ १७३॥ चिदानन्दीस्वामिने ते मृत्युलक्ष्मीभृते नमः । सुश्रुतिपतये विजयन्तीश्वराय
    ते नमः ॥ १७४॥ सुकन्यापतये नमश्चालसापतये नमः । श्रीछायास्वामिने चित्रलेखानाथाय ते नमः ॥ १७५॥ नवरङ्गाधिपतये
    किंशुकीस्वामिने नमः । कल्पलताधिनाथाय बकुलापतये नमः ॥ १७६॥ चित्रवतीस्वामिने ते चारुपद्माभृते नमः ।
    सुवर्णमुखरीशाय मालावतीभृते नमः ॥ १७७॥ वीराधिपतये प्रभावतीनाथाय ते नमः । श्रीमतीस्वामिने पण्यास्वामिने
    ते नमो नमः ॥ १७८॥ नागलक्ष्मीस्वामिने ते ज्योतिष्मतीभृते नमः । उद्योगिनीस्वामिने ते पूर्णानाथाय ते
    नमः ॥ १७९॥ सिद्धेश्वरीस्वामिने ते कृतिकान्ताय ते नमः । कवितास्वामिने ग्रन्थिवरात्मने नमो नमः ॥ १८०॥
    तालिकास्वामिने चापि सङ्गीतिस्वामिने नमः । प्रहारिणीपतये ते मानिनीस्वामिने नमः ॥ १८१॥ जरत्कार्वीस्वामिने
    ते स्वस्तिनाथाय ते नमः । क्षमानाथाय च नमः प्रतिष्ठापतये नमः ॥ १८२॥ लज्जानाथाय च नमः पिपासापतये नमः
    । दाहिकास्वामिने श्रद्धास्वामिने ते नमो नमः ॥ १८३॥ मैथिलीयूथनाथाय कौशलास्वामिने नमः । निकुञ्जकान्तानाथाय
    शय्याकान्ताय ते नमः ॥ १८४॥ पुरन्ध्रीकुलकान्ताय किरातीस्वामिने नमः । पुलिन्दीस्वामिने सिंहलद्वीपस्त्रीभृते
    नमः ॥ १८५॥ दैशिकीस्वामिने नमो विदैशिकीभृते नमः । क्रतुकानकीनाथायाऽजितपत्स्त्रीभृते नमः ॥ १८६॥ श्रीलोकाद्रिप्रियेशाय
    देवतेशाय ते नमः । सामुद्रिकास्वामिने ते पार्थिवीस्वामिने नमः ॥ १८७॥ उर्वशीव्रातनाथाय सुतलीस्वामिने
    नमः । त्रिवेणीप्राणनाथाय शबरीशाय ते नमः ॥ १८८॥ पम्पावराय च राजेश्वरीशाय च ते नमः । लम्बाननाधिनाथाय
    चाजामुखीश्वराय च ॥ १८९॥ कन्याकुमारिकेशाय गोपकन्याभृते नमः । रैवतीस्वामिने नमो गौ लीस्वामिने नमः ॥
    १९०॥ जीवन्तीपतये लावण्यवतीपतये नमः । मालिनीप्राणनाथाय कुब्जिकास्वामिने नमः ॥ १९१॥ यवनीस्वामिने मृगावतीनाथाय
    ते नमः । कान्तिमतीस्वामिने ते जरद्गौरीश्वराय च ॥ १९२॥ सुमित्रास्वामिने सुतानाथाय ते नमो नमः । विन्ध्यावलीस्वामिने
    ते पौण्यनैधेयिकाभृते ॥ १९३॥ वर्धिनीस्वामिने वैश्वावसवीशाय ते नमः । कुलादेवीस्वामिने ते रासेश्वरीभृते
    नमः ॥ १९४॥ राजवतीस्वामिने सीमन्तिनीशाय ते नमः । सामवतीस्वामिने ते चानर्तीशारदाभृते ॥ १९५॥ महानन्दास्वामिने
    बन्दुलानाथाय ते नमः । मनोरमाधिनाथाय शुचिष्मतीभृते नमः ॥ १९६॥ अर्चिष्मतीस्वामिने सुशीलाविप्राभृते नमः
    । कलावतीस्वामिने ते लीलावतीभृते नमः ॥ १९७॥ रत्नावलीस्वामिने ते शशिलेखाभृते नमः । अनङ्गलेखापतये चित्रलेखाभृते
    नमः ॥ १९८॥ दिव्यार्षीस्वामिने चापि सुरसास्वामिने नमः । वर्षाभ्वीस्वामिने पारावतीनाथाय ते नमः ॥ १९९॥
    प्रभावतीस्वामिने ते नर्मदास्वामिने नमः । रोहिणीशाय कुमुदाकान्ताय ते नमो नमः ॥ २००॥ पुरुहूतापतये च
    शर्मवतीभृते नमः । सुधाम्नीस्वामिने ते च माधवी स्वामिने नमः ॥ २०१॥ कुन्ददन्तीस्वामिने ते कदम्बमालिकाभृते
    । शाण्डिलीस्वामिने मधुविद्याभृते च ते नमः ॥ २०२॥ अश्वमुखीस्वामिने ते गजमुखीश्वराय च । अम्बेश्वराय
    च वृद्धेश्वराय ते नमो नमः ॥ २०३॥ कुङ्कुमवापीनाथाय हिङ्गलाजीश्वराय च । कामाक्षीस्वामिने ते च मीनाक्षीशाय
    ते नमः ॥ २०४॥ दमयन्तीस्वामिने ते भद्रिकास्वामिने नमः । प्रीतिकर्णोत्पलेशाय दीर्धिकेशाय ते नमः ॥ २०५॥
    फलवतीस्वामिने ते रमानाथाय ते नमः । गोभिलास्वामिने गोपसुतानाथाय ते नमः ॥ २०६॥ उदुम्बुरीस्वामिने तेऽष्टषष्टिस्वामिने
    नमः । रत्नवतीस्वामिने ते शुभाक्षीस्वामिने नमः ॥ २०७॥ देवलीलास्वामिने ते देवनदीश्वराय च । बहुचराधिनाथाय
    हिङ्गुलाजाभृते नमः ॥ २०८॥ ब्रह्ममोहिनीनाथायाऽनुवृत्तिस्वामिने नमः । विशालापतये पराविद्याधिपतये नमः
    ॥ २०९॥ देवतापतये चित्याकुतिस्वामिन्नमोऽस्तु ते । पुरीनाथाय कमलेश्वरीशाय नमो नमः ॥ २१०॥ प्राचीनाथाय
    च ऋषितोयानाथाय ते नमः । गौतमीशाय च वपुष्मतीशाय च ते नमः ॥ २११॥ मणिकर्णाधिनाथाय श्रीमातृस्वामिने नमः
    । नमः पार्थाधिपतये माहिष्मतीभृते नमः ॥ २१२॥ भिल्लिकास्वामिने तुभ्यं सौराष्ट्रीशीभृते नमः । व्याघ्रीशाय
    नमस्तुभ्यं चिल्लीनाथाय ते नमः ॥ २१३॥ तिथिनाथायाभिचारिणीश्वराय च ते नमः । निषादीस्वामिने व्यालीस्वामिने
    ते नमो नमः ॥ २१४॥ चतुर्भुजाधिनाथाय हर्षसिद्धिभृते नमः । सारिकापतये विश्वरूपानाथाय ते नमः ॥ २१५॥ श
