id: manyusuktam-2
category: veda
name:
  english: manyusuktam
  devanagari: मन्युसूक्तम्
content:
  english: 07 om shanti̱h shanti̱h shanti̭h | harih om | svararahitam | yaste manyo'vidhadvajra sayaka
    saha ojah pushyati vishvamanushak | sahyama dasamaryam tvaya yuja sahaskritena sahasa sahasvata ||
    10
  devanagari: ०७ ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑ । हरिः ॐ । स्वररहितम् । यस्ते मन्योऽविधद्वज्र सायक सह ओजः
    पुष्यति विश्वमानुषक् । साह्याम दासमार्यं त्वया युजा सहस्कृतेन सहसा सहस्वता ॥ १०
meaning: {}
