id: devaihkritam15shivastotram
category: stotram
name:
  english: devaihkritam15shivastotram
  devanagari: देवैःकृतं१५शिवस्तोत्रम्
content:
  english: devaih kritam 15 shivastotram deva ucuh | brahmavishnvindracandradisurah sarve maharshayah
    | ditijadyah samprasutastvattassarve maheshvara || 24|| brahmavishnumahendrashca suryadyanasuransuram
    | tvam vai srijasi pasyatsi tvameva sakaleshvarah || 25|| yato harasi samsaram hara ityucyate budhaih
    | nigrihito hariryasmaddhara ityucyate budhaih || 26|| yato bibharshi sakalam vibhajya tanumashtadha
    | ato'smanpahi bhagavan suradanairabhipsitaih || 27|| tvam mahapurushah shambhuh sarveshassuranayakah
    | nihsvatma nirvikaratma parabrahma satam gatih || 28|| dinabandhurdaya sindhu'radbhuto'tiparatmadrik
    | prajno viradvibhussatyah saccidanandalakshanah || 29|| iti shivapurane shatarudrasamhitayam dvadashadhyayantargatam
    devaih kritam shivastotram samaptam | shivapurana | shatarudrasamhita | adhyaya 12
  devanagari: देवैः कृतं १५ शिवस्तोत्रम् देवा ऊचुः । ब्रह्मविष्ण्विन्द्रचन्द्रादिसुराः सर्वे महर्षयः ।
    दितिजाद्याः सम्प्रसूतास्त्वत्तस्सर्वे महेश्वर ॥ २४॥ ब्रह्मविष्णुमहेन्द्राश्च सूर्याद्यानसुरान्सुराम्
    । त्वं वै सृजसि पास्यत्सि त्वमेव सकलेश्वरः ॥ २५॥ यतो हरसि संसारं हर इत्युच्यते बुधैः । निगृहीतो हरिर्यस्माद्धर
    इत्युच्यते बुधैः ॥ २६॥ यतो बिभर्षि सकलं विभज्य तनुमष्टधा । अतोऽस्मान्पाहि भगवन् सुरादानैरभीप्सितैः
    ॥ २७॥ त्वं महापुरुषः शम्भुः सर्वेशस्सुरनायकः । निःस्वात्मा निर्विकारात्मा परब्रह्म सतां गतिः ॥ २८॥
    दीनबन्धुर्दया सिन्धुऽरद्भुतोऽतिपरात्मदृक् । प्राज्ञो विराड्विभुस्सत्यः सच्चिदानन्दलक्षणः ॥ २९॥ इति
    शिवपुराणे शतरुद्रसंहितायां द्वादशाध्ययान्तर्गतं देवैः कृतं शिवस्तोत्रं समाप्तम् । शिवपुराण । शतरुद्रसंहिता
    । अध्याय १२
