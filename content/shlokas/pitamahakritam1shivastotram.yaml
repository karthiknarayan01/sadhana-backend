id: pitamahakritam1shivastotram
category: stotram
name:
  english: pitamahakritam1shivastotram
  devanagari: पितामहकृतं१शिवस्तोत्रम्
content:
  english: pitamahakritam 1 shivastotram pitamaha uvaca | namaste bhagavan rudra bhaskaramitatejase |
    namo bhavaya devaya rasayambumayaya te || 29|| sharvaya kshitirupaya sada surabhine namah | ishaya
    vayave tubhyam samsparshaya namo namah || 30|| pashunam pataye caiva pavakayatitejase | bhimaya vyomarupaya
    shabdamatraya te namah || 31|| mahadevaya somaya amritaya namo'stu te | ugraya yajamanaya namaste
    karmayogine || 32|| yah pathecchrinuyadvapi paitamahamimam stavam | rudraya kathitam vipranchravayedva
    samahitah || 33|| ashtamurtestu sayujyam varshadekadavapnuyat | iti shrilingamahapurane purvabhage
    ekacatvarimshadhyayantargatam pitamahakritam shivastotram samaptam | lingapurana | purvabhaga | adhyaya
    41
  devanagari: पितामहकृतं १ शिवस्तोत्रम् पितामह उवाच । नमस्ते भगवन् रुद्र भास्करामिततेजसे । नमो भवाय देवाय
    रसायाम्बुमयाय ते ॥ २९॥ शर्वाय क्षितिरूपाय सदा सुरभिणे नमः । ईशाय वायवे तुभ्यं संस्पर्शाय नमो नमः ॥
    ३०॥ पशूनां पतये चैव पावकायातितेजसे । भीमाय व्योमरूपाय शब्दमात्राय ते नमः ॥ ३१॥ महादेवाय सोमाय अमृताय
    नमोऽस्तु ते । उग्राय यजमानाय नमस्ते कर्मयोगिने ॥ ३२॥ यः पठेच्छृणुयाद्वापि पैतामहमिमं स्तवम् । रुद्राय
    कथितं विप्राञ्छ्रावयेद्वा समाहितः ॥ ३३॥ अष्टमूर्तेस्तु सायुज्यं वर्षादेकादवाप्नुयात् । इति श्रीलिङ्गमहापुराणे
    पूर्वभागे एकचत्वारिंशाध्यायान्तर्गतं पितामहकृतं शिवस्तोत्रं समाप्तम् । लिङ्गपुराण । पूर्वभाग । अध्याय
    ४१
