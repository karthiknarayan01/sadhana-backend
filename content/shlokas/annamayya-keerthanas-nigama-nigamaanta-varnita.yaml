id: annamayya-keerthanas-nigama-nigamaanta-varnita
category: stotram
name:
  english: Annamayya Keerthanas Nigama Nigamaanta Varnita
content:
  english: nigamanigamantavarnita manohara rupa nagarajadharuda shrinarayana || dipincu vairagyadivya
    saukhyam biyya nopakara nannu nòdabarapucu | paipainè samsarabandhamula gattevu napaluku cèlluna narayana
    || cikakupadina na cittashantamu seya lekaka nivu bahulila nannu | kakusesèdavu bahukarmala baduvaru
    nakòladivarala narayana || vivividha nirbandhamula vèdaladroyaka nannu bhavasagaramula nadabada jetura
    | divijendravandya shri tiruvenkatadrisha navanita cora shrinarayana ||
  devanagari: निगमनिगमान्तवर्णित मनोहर रूप नगराजधरुड श्रीनारयणा ॥ दीपिञ्चु वैराग्यदिव्य सौख्यं बिय्य नोपकरा
    नन्नु नॊडबरपुचु । पैपैनॆ संसारबन्धमुल गट्टेवु नापलुकु चॆल्लुना नारायणा ॥ चिकाकुपडिन ना चित्तशान्तमु
    सेय लेकका नीवु बहुलील नन्नु । काकुसेसॆदवु बहुकर्मल बडुवारु नाकॊलदिवारला नारायणा ॥ विविविध निर्बन्धमुल
    वॆडलद्रोयक नन्नु भवसागरमुल नडबड जेतुरा । दिविजेन्द्रवन्द्य श्री तिरुवेङ्कटाद्रीश नवनीत चोर श्रीनारायणा
    ॥
