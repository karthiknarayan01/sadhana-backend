id: hanumanmahamantrastotram
category: stotram
name:
  english: hanumanmahamantrastotram
  devanagari: हनुमन्महामन्त्रस्तोत्रम्
content:
  english: jaya kape balava~stvam jaya kape balava~stvam | suranaramunijanavanditapatkaja hanuma~stvam
    || 72|| praudhapratapa pavanasuta tribhuvanajayakarin | asuraripumadaganjana bhayasankataharin | jaya0||
    73|| bhutapishacavikatagrahapida te japanat | hanumadgarjitashravanannashyati tharakampat | jaya0||
    74|| raghuvarasahayollanghya sagaramatidirgham | sitashodhanamaptva lankam prajvalayat | jaya0|| 75||
    ramacaranaratidayaka sharanagatatratah | purnanandita hanuman vancchitaphaladatah | jayah || 76||
    purnahutim dishet pariharam ca karayettatha | vipran sadhun satirbhaktan bhojayeddakshinam dishet
    || 77|| nityam sampujayeddevam sa nashayedanishtakam | dhvajadidarshanam kuryatpathenmantram nirantaram
    || 78|| sinduratailarkapushpamala dhyatva'rpayet sada | bhuktirmuktirbhaveccapi lakshmi manushyatam
    vrajet || 79|| iti shrilakshminarayaniyasamhitayah dvaparayugasantanatmakasya tritiyakhande 150
  devanagari: जय कपे बलवँस्त्वं जय कपे बलवँस्त्वम् । सुरनरमुनिजनवन्दितपत्कज हनुमँस्त्वम् ॥ ७२॥ प्रौढप्रताप
    पवनसुत त्रिभुवनजयकारिन् । असुररिपुमदगञ्जन भयसङ्कटहारिन् । जय०॥ ७३॥ भूतपिशाचविकटग्रहपीडा ते जपनात्
    । हनुमद्गर्जितश्रवणान्नश्यति थरकम्पात् । जय०॥ ७४॥ रघुवरसहायोल्लङ्घ्य सागरमतिदीर्घम् । सीताशोधनमाप्त्वा
    लङ्कां प्राज्वालयत् । जय०॥ ७५॥ रामचरणरतिदायक शरणागतत्रातः । पूर्णानन्दित हनुमन् वाञ्च्छितफलदातः ।
    जयः ॥ ७६॥ पूर्णाहुतिं दिशेत् परिहारं च कारयेत्तथा । विप्रान् साधून् सतीर्भक्तान् भोजयेद्दक्षिणां दिशेत्
    ॥ ७७॥ नित्यं सम्पूजयेद्देवं स नाशयेदनिष्टकम् । ध्वजादिदर्शनं कुर्यात्पठेन्मन्त्रं निरन्तरम् ॥ ७८॥
    सिन्दूरतैलार्कपुष्पमाला ध्यात्वाऽर्पयेत् सदा । भुक्तिर्मुक्तिर्भवेच्चापि लक्ष्मि मनुष्यतां व्रजेत्
    ॥ ७९॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः द्वापरयुगसन्तानात्मकस्य तृतीयखण्डे १५०
meaning: {}
