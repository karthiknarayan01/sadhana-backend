id: hanuman-chalisa
category: stotram
name:
  english: Hanuman Chalisa
  devanagari: हनुमान् चालीसा
content:
  english: shriguru carana saroja raja buddhihina tanu janike bala buddhi vidya dehu mohim jaya hanumana
    jnana guna sagara jaya kapisha tihu~ loka ujagara rama duta atulita bala dhama anjaniputra pavanasuta
    nama mahavira vikrama bajarangi kumati nivara sumati ke sangi kancana barana viraja suvesa kanana
    kundala kuncita kesha hatha vajra au dhvaja virajai ka~dhe mu~ja janeu sajai sankara suvana kesarinandana
    teja pratapa maha jaga vandana vidyavana guni ati catura rama kaja karibe ko atura prabhu caritra
    sunibe ko rasiya rama lakhana sita mana basiya sukshma rupa dhari siyahim dikhava vikata rupa dhari
    lanka jarava bhima rupa dhari asura sa~hare ramacandra ke kaja sa~vare laya sajivana lakhana jiyaye
    shriraghuvira harashi ura laye raghupati kinhi bahuta badai tuma mama priya bharata sama bhai sahasa
    vadana tumharo yasha gavaim asa kahi shripati kantha lagavaim sanakadika brahmadi munisha narada sharada
    sahita ahisha yama kubera dikpala jaha~ te kavi kovida kahi sake kaha~ te tuma upakara sugrivahim
    kinha rama milaya raja pada dinha tumharo mantra vibhishana mana lankeshvara bhaye saba jaga jana
    yuga sahasra yojana para bhanu lilyo tahi madhura phala janu prabhu mudrika meli mukha mahim jaladhi
    la~ghi gaye acaraja nahim durgama kaja jagata ke jete sugama anugraha tumhare tete rama duare tuma
    rakhavare hota na ajna bina paisare saba sukha lahai tumhari sarana tuma rakshaka kahu ko dara na
    tinom loka ha~ka tem ka~pai bhuta pishaca nikata nahim avai mahavira jaba nama sunavai nashai roga
    harai saba pira japata nirantara hanumata vira sankata se hanumana chudavai mana krama vacana dhyana
    jo lavai saba para rama tapasvi raja tina ke kaja sakala tuma saja aura manoratha jo koi lavai dasu
    amita jivana phala pavai carom yuga pratapa tumhara hai prasiddha jagata ujiyara sadhu santa ke tuma
    rakhavare asura nikandana rama dulare ashta siddhi nava nidhi ke data asa bara dina janaki mata rama
    rasayana tumhare pasa sada raho raghupati ke dasa tumhare bhajana rama ko pavai janma janma ke dukha
    bisaravai anta kala raghupati pura jai jaha~ janmi haribhakta kahai aura devata citta na dharai hanumata
    sei sarva sukha karai sankata katai mitai saba pira jo sumirai hanumata balavira jai jai jai hanumana
    gosaim kripa karahu guru deva ki naim yaha shata para patha kara koi chutahi bamdi maha sukha hoi
    yo yaha paढ़ai hanuman calisa hoya siddhi sakhi gaurisa tulasidasa sada hari cera kijai natha hridaya
    ma~ha dera
  devanagari: श्रीगुरु चरन सरोज रज बुद्धिहीन तनु जानिके बल बुद्धि विद्या देहु मोहिं जय हनुमान ज्ञान गुण
    सागर जय कपीश तिहुँ लोक उजागर राम दूत अतुलित बल धामा अञ्जनिपुत्र पवनसुत नामा महावीर विक्रम बजरङ्गी
    कुमति निवार सुमति के सङ्गी कञ्चन बरन विराज सुवेसा कानन कुण्डल कुञ्चित केशा हाथ वज्र औ ध्वजा विराजै
    काँधे मूँज जनेऊ साजै सङ्कर सुवन केसरीनन्दन तेज प्रताप महा जग वन्दन विद्यावान गुणी अति चातुर राम काज
    करिबे को आतुर प्रभु चरित्र सुनिबे को रसिया राम लखन सीता मन बसिया सूक्ष्म रूप धरि सियहिं दिखावा विकट
    रूप धरि लङ्क जरावा भीम रूप धरि असुर सँहारे रामचन्द्र के काज सँवारे लाय सजीवन लखन जियाये श्रीरघुवीर
    हरषि उर लाये रघुपति कीन्ही बहुत बडाई तुम मम प्रिय भरत सम भाई सहस वदन तुम्हरो यश गावैं अस कहि श्रीपति
    कण्ठ लगावैं सनकादिक ब्रह्मादि मुनीशा नारद शारद सहित अहीशा यम कुबेर दिक्पाल जहाँ ते कवि कोविद कहि सके
    कहाँ ते तुम उपकार सुग्रीवहिं कीन्हा राम मिलाय राज पद दीन्हा तुम्हरो मन्त्र विभीषण माना लङ्केश्वर भये
    सब जग जाना युग सहस्र योजन पर भानू लील्यो ताहि मधुर फल जानू प्रभु मुद्रिका मेलि मुख माहीं जलधि लाँघि
    गये अचरज नाहीं दुर्गम काज जगत के जेते सुगम अनुग्रह तुम्हरे तेते राम दुआरे तुम रखवारे होत न आज्ञा बिन
    पैसारे सब सुख लहै तुम्हारी सरना तुम रक्षक काहू को डर ना तीनों लोक हाँक तें काँपै भूत पिशाच निकट नहिं
    आवै महावीर जब नाम सुनावै नाशै रोग हरै सब पीरा जपत निरन्तर हनुमत वीरा सङ्कट से हनुमान छुडावै मन क्रम
    वचन ध्यान जो लावै सब पर राम तपस्वी राजा तिन के काज सकल तुम साजा और मनोरथ जो कोई लावै दासु अमित जीवन
    फल पावै चारों युग प्रताप तुम्हारा है प्रसिद्ध जगत उजियारा साधु सन्त के तुम रखवारे असुर निकन्दन राम
    दुलारे अष्ट सिद्धि नव निधि के दाता अस बर दीन जानकी माता राम रसायन तुम्हरे पासा सदा रहो रघुपति के दासा
    तुम्हरे भजन राम को पावै जन्म जन्म के दुख बिसरावै अन्त काल रघुपति पुर जाई जहाँ जन्मि हरिभक्त कहाई और
    देवता चित्त न धरई हनुमत सेई सर्व सुख करई सङ्कट कटै मिटै सब पीरा जो सुमिरै हनुमत बलवीरा जै जै जै हनुमान
    गोसाईं कृपा करहु गुरु देव की नाईं यह शत पार पाठ कर कोई छूटहि बंदि महा सुख होई यो यह पढ़ै हनुमान् चलीसा
    होय सिद्धि साखी गौरीसा तुलसीदास सदा हरि चेरा कीजै नाथ हृदय मँह डेरा
