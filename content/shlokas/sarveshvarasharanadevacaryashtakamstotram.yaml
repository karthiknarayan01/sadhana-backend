id: sarveshvarasharanadevacaryashtakamstotram
category: stotram
name:
  english: sarveshvarasharanadevacaryashtakamstotram
  devanagari: सर्वेश्वरशरणदेवाचार्याष्टकंस्तोत्रम्
content:
  english: yukta urdhvapundra tilaka dharana kiye hue hai | kamalasadrisha divya netrom se ati shobhayamana
    shrisarveshvarasharanadevacaryaji maharaja ko punah punah sashraddha baddhapani anantakoti pranama
    arpita hai || 3|| vrindavaneshapadakanjamanojnabhringam radhapadambujasugandharasavatriptam | girvanagihprakathane
    paramapravinam sarveshvarasya sharanam pranamami devam || 4|| vrindavananavanikunjavihari yugalakishora
    shyamashyama shri radhakrishna bhagavan ke shricaranakamalom ke manjula madhukara svarupa | parabhaktipradayini
    sarveshvari shriradhikaji ke shriyugalacaranaravindom ki parama divya sugandharasa se atyanta ahladita
    aura devavani samskrita pravacanopadeshamrita varshana mem paramakausalasampanna shrisarveshvarasharanadevacaryaji
    maharaja ke vimala padapadmom mem pranati purvaka abhivandana || 4|| nimbarkadevasharanagragurum sharanyam
    nimbarkapithabhuvi nityasushobhamanam | acaryarupajayapattanarajamanam sarveshvarasya sharanam pranamami
    devam || 5|| jo shrinimbarkacaryapithadhishvara shrinimbarkasharanadevacarya ji maharaja ke shrimadguruvarenya
    haim jo parama sharanya hai | a0 bha0 jagadguru nimbarkacaryapitha mem evam rajasthana mem avasthita
    atishaya prakhyata ati ramaniya jayapura mahanagara mem bhi virajamana rahe haim una paramacarya pravara
    shrisarveshvarasharanadevacaryaji maharaja ko sabhakti ananta sashtanga pranama karate haim || 5||
    nimbarkatirthajalapanakaram gunajnam shrikrishnabhaktirasavaridhigahamanam | nimbarkakirtanakaram
    dvija
  devanagari: युक्त ऊर्ध्वपुण्ड्र तिलक धारण किये हुए है । कमलसदृश दिव्य नेत्रों से अति शोभायमान श्रीसर्वेश्वरशरणदेवाचार्यजी
    महाराज को पुनः पुनः सश्रद्ध बद्धपाणि अनन्तकोटि प्रणाम अर्पित है ॥ ३॥ वृन्दावनेशपदकञ्जमनोज्ञभृङ्गं
    राधापदाम्बुजसुगन्धरसावतृप्तम् । गीर्वाणगीःप्रकथने परमप्रवीणं सर्वेश्वरस्य शरणं प्रणमामि देवम् ॥ ४॥
    वृन्दावननवनिकुञ्जविहारी युगलकिशोर श्यामाश्याम श्री राधाकृष्ण भगवान् के श्रीचरणकमलों के मञ्जुल मधुकर
    स्वरूप । पराभक्तिप्रदायिनी सर्वेश्वरी श्रीराधिकाजी के श्रीयुगलचरणारविन्दों की परम दिव्य सुगन्धरस से
    अत्यन्त आह्लादित और देववाणी संस्कृत प्रवचनोपदेशामृत वर्षण में परमकौसलसम्पन्न श्रीसर्वेश्वरशरणदेवाचार्यजी
    महाराज के विमल पादपद्मों में प्रणति पूर्वक अभिवन्दना ॥ ४॥ निम्बार्कदेवशरणाग्रगुरुं शरण्यं निम्बार्कपीठभुवि
    नित्यसुशोभमानम् । आचार्यरूपजयपत्तनराजमानं सर्वेश्वरस्य शरणं प्रणमामि देवम् ॥ ५॥ जो श्रीनिम्बार्काचार्यपीठाधीश्वर
    श्रीनिम्बार्कशरणदेवाचार्य जी महाराज के श्रीमद्गुरुवरेण्य हैं जो परम शरण्य है । अ० भा० जगद्गुरु निम्बार्काचार्यपीठ
    में एवं राजस्थान में अवस्थित अतिशय प्रख्यात अति रमणीय जयपुर महानगर में भी विराजमान रहे हैं उन परमाचार्य
    प्रवर श्रीसर्वेश्वरशरणदेवाचार्यजी महाराज को सभक्ति अनन्त साष्टाङ्ग प्रणाम करते हैं ॥ ५॥ निम्बार्कतीर्थजलपानकरं
    गुणज्ञं श्रीकृष्णभक्तिरसवारिधिगाहमानम् । निम्बार्ककीर्तनकरं द्विज
