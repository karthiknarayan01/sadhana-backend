id: brahmakritam09vishnustotram
category: stotram
name:
  english: brahmakritam09vishnustotram
  devanagari: ब्रह्मकृतं०९विष्णुस्तोत्रम्
content:
  english: brahmakritam 9 vishnustotram brahmovaca | avikriyam satyamanantamadyam guhashayam nishkalamapratarkyam
    | mano'grayanam vacasaniruktam namamahe devavaram varenyam || 26|| vipashcitam pranamanodhiyatmanamarthendriyabhasamanidramavranam
    | chayatapau yatra na gridhrapakshau tamaksharam kham triyugam vrajamahe || 27|| ajasya cakram tvajayeryamanam
    manomayam pancadasharamashu | trinabhi vidyuccalamashtanemi yadakshamahustamritam prapadye || 28||
    ya ekavarnam tamasah param tadalokamavyaktamanantaparam | asam cakaropasuparnamenamupasate yogarathena
    dhirah || 29|| na yasya kashcatititarti mayam yaya jano muhyati veda nartham | tam nirjitatma''tmagunam
    paresham namama bhuteshu samam carantam || 30|| ime vayam yatpriyayaiva tanva sattvena srishta bahirantaravih
    | gatim na sukshmamrishayashca vidmahe kuto'suradya itarapradhanah || 31|| padau mahiyam svakritaiva
    yasya caturvidho yatra hi bhutasargah | sa vai mahapurusha atmatantrah prasidatam brahma mahavibhutih
    || 32|| ambhastu yadreta udaraviryam sidhyanti jivantyuta vardhamanah | lokastrayo'thakhilalokapalah
    prasidatam brahma mahavibhutih || 33|| somam mano yasya samamananti divaukasam vai balamandha ayuh
    | isho naganam prajanah prajanam prasidatam nah sa mahavibhutih || 34|| agnirmukham yasya tu jataveda
    jatah kriyakandanimittajanma | antahsamudre'nupacan svadhatun prasidatam nah sa mahavibhutih || 35||
    yaccakshurasittaranirdevayanam trayimayo brahmana esha dhishnyam | dvaram ca mukteramritam ca mrityuh
    prasidatam nah sa mahavibhutih || 36|| pranadabhudyasya caracaranam pranah saho balamojashca vayuh
    | anvasma samrajamivanuga vayam prasidatam nah sa mahavibhutih || 37|| shrotraddisho yasya hridashca
    khani prajajnire kham purushasya nabhyah | pranendriyatmasushariraketam prasidatam nah sa mahavibhutih
    || 38|| balanmahendrastridashah prasadanmanyorgirisho dhishanadvirincah | khebhyashca chandamsyrishayo
    medhratah kah prasidatam nah sa mahavibhutih || 39|| shrirvakshasah pitarashchayaya''san dharmah stanaditarah
    prishthato'bhut | dyauryasya shirshno'psaraso viharatprasidatam nah sa mahavibhutih || 40|| vipro
    mukham brahma ca yasya guhyam rajanya asidbhujayorbalam ca | urvorvido'jo'nghriravedashudrau prasidatam
    nah sa mahavibhutih || 41|| lobho'dharatpritiruparyabhuddyutirnastah pashavyah sparshena kamah | bhruvoryamah
    pakshmabhavastu kalah prasidatam nah sa mahavibhutih || 42|| dravyam vayah karma gunan vishesham yadyogamayavihitan
    vadanti | yaddurvibhavyam prabudhapabadham prasidatam nah sa mahavibhutih || 43|| namo'stu tasma upashantashaktaye
    svarajyalabhapratipuritatmane | guneshu mayaraciteshu vrittibhirna sajjamanaya nabhasvadutaye || 44||
    sa tvam no darshayatmanamasmatkaranagocaram | prapannanam didrikshunam sasmitam te mukhambujam ||
    45|| taistaih svecchadhritai rupaih kale kale svayam vibho | karma durvishaham yanno bhagavamstatkaroti
    hi || 46|| kleshabhuryalpasarani karmani viphalani va | dehinam vishayartanam na tathaivarpitam tvayi
    || 47|| navamah karmakalpo'pi viphalayeshvararpitah | kalpate purushasyaisha sa hyatma dayito hitah
    || 48|| yatha hi skandhashakhanam tarormulavasecanam | evamaradhanam vishnoh sarveshamatmanashca hi
    || 49|| namastubhyamanantaya durvitarkyatmakarmane | nirgunaya guneshaya sattvasthaya ca sampratam
    || 50|| iti shrimadbhagavatamahapurane ashtamaskandhe pancamadhyayantargatam brahmakritam vishnustotram
    samaptam | bhagavatapurana | adhyaya 8
  devanagari: ब्रह्मकृतं ९ विष्णुस्तोत्रम् ब्रह्मोवाच । अविक्रियं सत्यमनन्तमाद्यं गुहाशयं निष्कलमप्रतर्क्यम्
    । मनोऽग्रयानं वचसानिरुक्तं नमामहे देववरं वरेण्यम् ॥ २६॥ विपश्चितं प्राणमनोधियात्मनामर्थेन्द्रियाभासमनिद्रमव्रणम्
    । छायातपौ यत्र न गृध्रपक्षौ तमक्षरं खं त्रियुगं व्रजामहे ॥ २७॥ अजस्य चक्रं त्वजयेर्यमाणं मनोमयं पञ्चदशारमाशु
    । त्रिनाभि विद्युच्चलमष्टनेमि यदक्षमाहुस्तमृतं प्रपद्ये ॥ २८॥ य एकवर्णं तमसः परं तदलोकमव्यक्तमनन्तपारम्
    । आसां चकारोपसुपर्णमेनमुपासते योगरथेन धीराः ॥ २९॥ न यस्य कश्चातितितर्ति मायां यया जनो मुह्यति वेद
    नार्थम् । तं निर्जितात्माऽऽत्मगुणं परेशं नमाम भूतेषु समं चरन्तम् ॥ ३०॥ इमे वयं यत्प्रिययैव तन्वा सत्त्वेन
    सृष्टा बहिरन्तराविः । गतिं न सूक्ष्मामृषयश्च विद्महे कुतोऽसुराद्या इतरप्रधानाः ॥ ३१॥ पादौ महीयं स्वकृतैव
    यस्य चतुर्विधो यत्र हि भूतसर्गः । स वै महापूरुष आत्मतन्त्रः प्रसीदतां ब्रह्म महाविभूतिः ॥ ३२॥ अम्भस्तु
    यद्रेत उदारवीर्यं सिध्यन्ति जीवन्त्युत वर्धमानाः । लोकास्त्रयोऽथाखिललोकपालाः प्रसीदतां ब्रह्म महाविभूतिः
    ॥ ३३॥ सोमं मनो यस्य समामनन्ति दिवौकसां वै बलमन्ध आयुः । ईशो नगानां प्रजनः प्रजानां प्रसीदतां नः स
    महाविभूतिः ॥ ३४॥ अग्निर्मुखं यस्य तु जातवेदा जातः क्रियाकाण्डनिमित्तजन्मा । अन्तःसमुद्रेऽनुपचन् स्वधातून्
    प्रसीदतां नः स महाविभूतिः ॥ ३५॥ यच्चक्षुरासीत्तरणिर्देवयानं त्रयीमयो ब्रह्मण एष धिष्ण्यम् । द्वारं
    च मुक्तेरमृतं च मृत्युः प्रसीदतां नः स महाविभूतिः ॥ ३६॥ प्राणादभूद्यस्य चराचराणां प्राणः सहो बलमोजश्च
    वायुः । अन्वास्म संराजमिवानुगा वयं प्रसीदतां नः स महाविभूतिः ॥ ३७॥ श्रोत्राद्दिशो यस्य हृदश्च खानि
    प्रजज्ञिरे खं पुरुषस्य नाभ्याः । प्राणेन्द्रियात्मासुशरीरकेतं प्रसीदतां नः स महाविभूतिः ॥ ३८॥ बलान्महेन्द्रस्त्रिदशाः
    प्रसादान्मन्योर्गिरीशो धिषणाद्विरिञ्चः । खेभ्यश्च छन्दांस्यृषयो मेढ्रतः कः प्रसीदतां नः स महाविभूतिः
    ॥ ३९॥ श्रीर्वक्षसः पितरश्छाययाऽऽसन् धर्मः स्तनादितरः पृष्ठतोऽभूत् । द्यौर्यस्य शीर्ष्णोऽप्सरसो विहारात्प्रसीदतां
    नः स महाविभूतिः ॥ ४०॥ विप्रो मुखं ब्रह्म च यस्य गुह्यं राजन्य आसीद्भुजयोर्बलं च । ऊर्वोर्विडोऽजोऽङ्घ्रिरवेदशूद्रौ
    प्रसीदतां नः स महाविभूतिः ॥ ४१॥ लोभोऽधरात्प्रीतिरुपर्यभूद्द्युतिर्नस्तः पशव्यः स्पर्शेन कामः । भ्रुवोर्यमः
    पक्ष्मभवस्तु कालः प्रसीदतां नः स महाविभूतिः ॥ ४२॥ द्रव्यं वयः कर्म गुणान् विशेषं यद्योगमायाविहितान्
    वदन्ति । यद्दुर्विभाव्यं प्रबुधापबाधं प्रसीदतां नः स महाविभूतिः ॥ ४३॥ नमोऽस्तु तस्मा उपशान्तशक्तये
    स्वाराज्यलाभप्रतिपूरितात्मने । गुणेषु मायारचितेषु वृत्तिभिर्न सज्जमानाय नभस्वदूतये ॥ ४४॥ स त्वं नो
    दर्शयात्मानमस्मत्करणगोचरम् । प्रपन्नानां दिदृक्षूणां सस्मितं ते मुखाम्बुजम् ॥ ४५॥ तैस्तैः स्वेच्छाधृतै
    रूपैः काले काले स्वयं विभो । कर्म दुर्विषहं यन्नो भगवांस्तत्करोति हि ॥ ४६॥ क्लेशभूर्यल्पसाराणि कर्माणि
    विफलानि वा । देहिनां विषयार्तानां न तथैवार्पितं त्वयि ॥ ४७॥ नावमः कर्मकल्पोऽपि विफलायेश्वरार्पितः
    । कल्पते पुरुषस्यैष स ह्यात्मा दयितो हितः ॥ ४८॥ यथा हि स्कन्धशाखानां तरोर्मूलावसेचनम् । एवमाराधनं
    विष्णोः सर्वेषामात्मनश्च हि ॥ ४९॥ नमस्तुभ्यमनन्ताय दुर्वितर्क्यात्मकर्मणे । निर्गुणाय गुणेशाय सत्त्वस्थाय
    च साम्प्रतम् ॥ ५०॥ इति श्रीमद्भागवतमहापुराणे अष्टमस्कन्धे पञ्चमाध्यायान्तर्गतं ब्रह्मकृतं विष्णुस्तोत्रं
    समाप्तम् । भागवतपुराण । अध्याय ८
