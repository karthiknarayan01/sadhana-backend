id: chanakya-neethi-chapter-5
category: stotram
name:
  english: Chanakya Neethi - Chapter 5
content:
  english: gururagnirdvijatinam varnanam brahmano guruh | patireva guruh strinam sarvasyabhyagato guruh
    || || yatha caturbhih kanakam parikshyate nigharshanacchedanatapatadanaih | tatha caturbhih purushah
    parikshyate tyagena shilena gunena karmana || || tavadbhayeshu bhetavyam yavadbhayamanagatam | agatam
    tu bhayam vikshya prahartavyamashankaya || || ekodarasamudbhuta ekanakshatrajatakah | na bhavanti
    samah shile yatha badarakantakah || || nihspriho nadhikari syan nakamo mandanapriyah | navidagdhah
    priyam bruyatspashtavakta na vancakah || || murkhanam pandita dveshya adhananam mahadhanah | parangana
    kulastrinam subhaganam ca durbhagah || || alasyopagata vidya parahastagatam dhanam | alpabijam hatam
    kshetram hatam sainyamanayakam || || abhyasaddharyate vidya kulam shilena dharyate | gunena jnayate
    tvaryah kopo netrena gamyate || || vittena rakshyate dharmo vidya yogena rakshyate | mriduna rakshyate
    bhupah satstriya rakshyate griham || || anyatha vedashastrani jnanapandityamanyatha | anyatha tatpadam
    shantam lokah klishyanti cahnyatha || || daridryanashanam danam shilam durgatinashanam | ajnananashini
    prajna bhavana bhayanashini || || nasti kamasamo vyadhirnasti mohasamo ripuh | nasti kopasamo vahnirnasti
    jnanatparam sukham || || janmamrityu hi yatyeko bhunaktyekah shubhashubham | narakeshu patatyeka eko
    yati param gatim || || trinam brahmavidah svargastrinam shurasya jivitam | jitashasya trinam nari
    nihsprihasya trinam jagat || || vidya mitram pravase ca bharya mitram griheshu ca | vyadhitasyaushadham
    mitram dharmo mitram mritasya ca || || vritha vrishtih samudreshu vritha triptasya bhojanam | vritha
    danam samarthasya vritha dipo divapi ca || || nasti meghasamam toyam nasti catmasamam balam | nasti
    cakshuhsamam tejo nasti dhanyasamam priyam || || adhana dhanamicchanti vacam caiva catushpadah | manavah
    svargamicchanti mokshamicchanti devatah || || satyena dharyate prithvi satyena tapate ravih | satyena
    vati vayushca sarvam satye pratishthitam || || cala lakshmishcalah pranashcale jivitamandire | calacale
    ca samsare dharma eko hi nishcalah || || naranam napito dhurtah pakshinam caiva vayasah | catushpadam
    shrigalastu strinam dhurta ca malini || || janita copaneta ca yastu vidyam prayacchati | annadata
    bhayatrata pancaite pitarah smritah || || rajapatni guroh patni mitrapatni tathaiva ca | patnimata
    svamata ca pancaita matarah smritah ||
  devanagari: गुरुरग्निर्द्विजातीनां वर्णानां ब्राह्मणो गुरुः । पतिरेव गुरुः स्त्रीणां सर्वस्याभ्यागतो
    गुरुः ॥ ॥ यथा चतुर्भिः कनकं परीक्ष्यते निघर्षणच्छेदनतापताडनैः । तथा चतुर्भिः पुरुषः परीक्ष्यते त्यागेन
    शीलेन गुणेन कर्मणा ॥ ॥ तावद्भयेषु भेतव्यं यावद्भयमनागतम् । आगतं तु भयं वीक्ष्य प्रहर्तव्यमशङ्कया ॥
    ॥ एकोदरसमुद्भूता एकनक्षत्रजातकाः । न भवन्ति समाः शीले यथा बदरकण्टकाः ॥ ॥ निःस्पृहो नाधिकारी स्यान्
    नाकामो मण्डनप्रियः । नाविदग्धः प्रियं ब्रूयात्स्पष्टवक्ता न वञ्चकः ॥ ॥ मूर्खाणां पण्डिता द्वेष्या
    अधनानां महाधनाः । पराङ्गना कुलस्त्रीणां सुभगानां च दुर्भगाः ॥ ॥ आलस्योपगता विद्या परहस्तगतं धनम् ।
    अल्पबीजं हतं क्षेत्रं हतं सैन्यमनायकम् ॥ ॥ अभ्यासाद्धार्यते विद्या कुलं शीलेन धार्यते । गुणेन ज्ञायते
    त्वार्यः कोपो नेत्रेण गम्यते ॥ ॥ वित्तेन रक्ष्यते धर्मो विद्या योगेन रक्ष्यते । मृदुना रक्ष्यते भूपः
    सत्स्त्रिया रक्ष्यते गृहम् ॥ ॥ अन्यथा वेदशास्त्राणि ज्ञानपाण्डित्यमन्यथा । अन्यथा तत्पदं शान्तं लोकाः
    क्लिश्यन्ति चाह्न्यथा ॥ ॥ दारिद्र्यनाशनं दानं शीलं दुर्गतिनाशनम् । अज्ञाननाशिनी प्रज्ञा भावना भयनाशिनी
    ॥ ॥ नास्ति कामसमो व्याधिर्नास्ति मोहसमो रिपुः । नास्ति कोपसमो वह्निर्नास्ति ज्ञानात्परं सुखम् ॥ ॥
    जन्ममृत्यू हि यात्येको भुनक्त्येकः शुभाशुभम् । नरकेषु पतत्येक एको याति परां गतिम् ॥ ॥ तृणं ब्रह्मविदः
    स्वर्गस्तृणं शूरस्य जीवितम् । जिताशस्य तृणं नारी निःस्पृहस्य तृणं जगत् ॥ ॥ विद्या मित्रं प्रवासे च
    भार्या मित्रं गृहेषु च । व्याधितस्यौषधं मित्रं धर्मो मित्रं मृतस्य च ॥ ॥ वृथा वृष्टिः समुद्रेषु वृथा
    तृप्तस्य भोजनम् । वृथा दानं समर्थस्य वृथा दीपो दिवापि च ॥ ॥ नास्ति मेघसमं तोयं नास्ति चात्मसमं बलम्
    । नास्ति चक्षुःसमं तेजो नास्ति धान्यसमं प्रियम् ॥ ॥ अधना धनमिच्छन्ति वाचं चैव चतुष्पदाः । मानवाः स्वर्गमिच्छन्ति
    मोक्षमिच्छन्ति देवताः ॥ ॥ सत्येन धार्यते पृथ्वी सत्येन तपते रविः । सत्येन वाति वायुश्च सर्वं सत्ये
    प्रतिष्ठितम् ॥ ॥ चला लक्ष्मीश्चलाः प्राणाश्चले जीवितमन्दिरे । चलाचले च संसारे धर्म एको हि निश्चलः
    ॥ ॥ नराणां नापितो धूर्तः पक्षिणां चैव वायसः । चतुष्पादं शृगालस्तु स्त्रीणां धूर्ता च मालिनी ॥ ॥ जनिता
    चोपनेता च यस्तु विद्यां प्रयच्छति । अन्नदाता भयत्राता पञ्चैते पितरः स्मृताः ॥ ॥ राजपत्नी गुरोः पत्नी
    मित्रपत्नी तथैव च । पत्नीमाता स्वमाता च पञ्चैता मातरः स्मृताः ॥
