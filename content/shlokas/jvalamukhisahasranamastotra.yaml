id: jvalamukhisahasranamastotra
category: sahasranama
name:
  english: jvalamukhisahasranamastotra
  devanagari: ज्वालामुखीसहस्रनामस्तोत्र
content:
  english: om kilakam pathe viniyogah | || anganyasah || bhairavarishaye namah shirasi | anushtupchandase
    namo mukhe | shrijvalamukhidevatayai namo hridi | hrim bijaya namo nabhau | shrim shaktaye namo guhye
    | om kilakaya namah padayoh | viniyogaya namah sarvangeshu | om hyamiti shad dirghayuktamayaya karashadangani
    vidhaya dhyayet || || dhyanam || udyaccandramaricisannibhamukhimekadasharabjagam pashambhojavarabhayan
    karatalaih sambibhratim sadarat | agnindvarkavilocanam shashikalacudam trivargojjvalam pretastham
    jvaladagnimandalashikham jvalamukhim naumyaham || om hrim jvalamukhi jaitri shrinjyotsna jayada jaya
    | audumbara mahanila shukralupta shaci shrutih || 1|| smayada smayahartri ca smarashatrupriyankari
    | manada mohini matta maya bala balandhara || 2|| bhagarupa bhagavasa bhirunda bhayaghatini | bhitirbhayanakasya
    ca bhruh subhruh sukhini sati || 3|| shulini shulahasta ca shulivamangavasini | shashankajanani shita
    shitala sharika shiva || 4|| srucika madhumanmanya trivargaphaladayini | treta trilocana durga durgama
    durgatirgatih || 5|| puta plutirvimarsha ca srishtikartri sukhavaha | sukhada sarvamadhyastha lokamata
    maheshvari || 6|| lokeshta varada stutya stutirdrutagatirnutih | nayada nayanetra ca navagrahanishevita
    || 7|| amba varuthini virajanani virasundari | virasurvaruni varta vara'bhayakara vadhuh || 8|| vaniratalaga
    vamya vamacaraphalaprada | vira shauryakari shanta shardulatvak ca sharvari || 9|| shalabhi shastramaryada
    shivada shambarantaka | shambararipriya shambhukanta shashinibhanana || 10|| shastrayudhadhara shantirjyotirdiptirjagatpriya
    | jagati jitvara jari marjari pashupalini
  devanagari: ॐ कीलकं पाठे विनियोगः । ॥ अङ्गन्यासः ॥ भैरवऋषये नमः शिरसि । अनुष्टुप्छन्दसे नमो मुखे । श्रीज्वालामुखीदेवतायै
    नमो हृदि । ह्रीं बीजाय नमो नाभौ । श्रीं शक्तये नमो गुह्ये । ॐ कीलकाय नमः पादयोः । विनियोगाय नमः सर्वाङ्गेषु
    । ॐ ह्यामिति षड् दीर्घयुक्तमायया करषडङ्गानि विधाय ध्यायेत् ॥ ॥ ध्यानम् ॥ उद्यच्चन्द्रमरीचिसन्निभमुखीमेकादशाराब्जगां
    पाशाम्भोजवराभयान् करतलैः सम्बिभ्रतीं सादरात् । अग्नीन्द्वर्कविलोचनां शशिकलाचूडां त्रिवर्गोज्ज्वलां
    प्रेतस्थां ज्वलदग्निमण्डलशिखां ज्वालामुखीं नौम्यहम् ॥ ॐ ह्रीं ज्वालामुखी जैत्री श्रीञ्ज्योत्स्ना जयदा
    जया । औदुम्बरा महानीला शुक्रलुप्ता शची श्रुतिः ॥ १॥ स्मयदा स्मयहर्त्री च स्मरशत्रुप्रियङ्करी । मानदा
    मोहिनी मत्ता माया बाला बलन्धरा ॥ २॥ भगरूपा भगावासा भीरुण्डा भयघातिनी । भीतिर्भयानकास्या च भ्रूः सुभ्रूः
    सुखिनी सती ॥ ३॥ शूलिनी शूलहस्ता च शूलिवामाङ्गवासिनी । शशाङ्कजननी शीता शीतला शारिका शिवा ॥ ४॥ स्रुचिका
    मधुमन्मान्या त्रिवर्गफलदायिनी । त्रेता त्रिलोचना दुर्गा दुर्गमा दुर्गतिर्गतिः ॥ ५॥ पूता प्लुतिर्विमर्शा
    च सृष्टिकर्त्री सुखावहा । सुखदा सर्वमध्यस्था लोकमाता महेश्वरी ॥ ६॥ लोकेष्टा वरदा स्तुत्या स्तुतिर्द्रुतगतिर्नुतिः
    । नयदा नयनेत्रा च नवग्रहनिषेविता ॥ ७॥ अम्बा वरूथिनी वीरजननी वीरसुन्दरी । वीरसूर्वारुणी वार्ता वराऽभयकरा
    वधूः ॥ ८॥ वानीरतलगा वाम्या वामाचारफलप्रदा । वीरा शौर्यकरी शान्ता शार्दूलत्वक् च शर्वरी ॥ ९॥ शलभी शास्त्रमर्यादा
    शिवदा शम्बरान्तका । शम्बरारिप्रिया शम्भुकान्ता शशिनिभानना ॥ १०॥ शस्त्रायुधधरा शान्तिर्ज्योतिर्दीप्तिर्जगत्प्रिया
    । जगती जित्वरा जारी मार्जारी पशुपालिनी
