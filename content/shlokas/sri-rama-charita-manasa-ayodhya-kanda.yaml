    bidhi hari hara maya barai bhari| sau na bharata mati saki nihari || so mati mohi kahata karu bhori|
    candini kara ki candakara cori || bharata hridaya~ siya rama nivasu| taha~ ki timira jaha~ tarani
    prakasu || asa kahi sarada gi bidhi loka| bibudha bikala nisi manahu~ koka || do sura svarathi malina
    mana kinha kumantra kuthatu || raci prapanca maya prabala bhaya bhrama arati ucatu || || kari kucali
    socata suraraju| bharata hatha sabu kaju akaju || ge janaku raghunatha samipa| sanamane saba rabikula
    dipa || samaya samaja dharama abirodha| bole taba raghubamsa purodha || janaka bharata sambadu sunai|
    bharata kahauti kahi suhai || tata rama jasa ayasu dehu| so sabu karai mora mata ehu || suni raghunatha
    jori juga pani| bole satya sarala mridu bani || bidyamana apuni mithilesu| mora kahaba saba bha~ti
    bhadesu || raura raya rajayasu hoi| rauri sapatha sahi sira soi || do rama sapatha suni muni janaku
    sakuce sabha sameta| sakala bilokata bharata mukhu bani na utaru deta || || sabha sakuca basa bharata
    nihari| ramabandhu dhari dhiraju bhari || kusamu dekhi sanehu sa~bhara| barhata bindhi jimi ghataja
    nivara || soka kanakalocana mati choni| hari bimala guna gana jagajoni || bharata bibeka baraha~ bisala|
    anayasa udhari tehi kala || kari pranamu saba kaha~ kara jore| ramu rau gura sadhu nihore || chamaba
    aju ati anucita mora| kahu~ badana mridu bacana kathora || hiya~ sumiri sarada suhai| manasa tem mukha
    pankaja ai || bimala bibeka dharama naya sali| bharata bharati manju marali || do nirakhi bibeka bilocananhi
    sithila saneha~ samaju| kari pranamu bole bharatu sumiri siya raghuraju || || prabhu pitu matu suhrada
    gura svami| pujya parama hita atamrajami || sarala susahibu sila nidhanu| pranatapala sarbagya sujanu
    || samaratha saranagata hitakari| gunagahaku avaguna agha hari || svami gosa~ihi sarisa gosai| mohi
    samana maim sai~ dohai || prabhu pitu bacana moha basa peli| ayu~ iha~ samaju sakeli || jaga bhala
    poca u~ca aru nicu| amia amarapada mahuru micu || rama rajai meta mana mahim| dekha suna katahu~ kau
    nahim || so maim saba bidhi kinhi dhithai| prabhu mani saneha sevakai || do kripa~ bhalai apani natha
    kinha bhala mora| dushana bhe bhushana sarisa sujasu caru cahu ora || || rauri riti subani baraai|
    jagata bidita nigamagama gai || kura kutila khala kumati kalanki| nica nisila nirisa nisanki || teu
    suni sarana samuhem ae| sakrita pranamu kihem apanae || dekhi dosha kabahu~ na ura ane| suni guna
    sadhu samaja bakhane || ko sahiba sevakahi nevaji| apu samaja saja saba saji || nija karatuti na samujhia
    sapanem| sevaka sakuca socu ura apanem || so gosai~ nahi dusara kopi| bhuja uthai kahu~ pana ropi
    || pasu nacata suka patha prabina| guna gati nata pathaka adhina || do yom sudhari sanamani jana kie
    sadhu siramora| ko kripala binu palihai biridavali barajora || || soka saneha~ ki bala subhae~| ayu~
    lai rajayasu bae~ || tabahu~ kripala heri nija ora| sabahi bha~ti bhala maneu mora || dekheu~ paya
    sumangala mula| janeu~ svami sahaja anukula || baraem samaja bilokeu~ bhagu| baraim cuka sahiba anuragu
    || kripa anugraha angu aghai| kinhi kripanidhi saba adhikai || rakha mora dulara gosaim| apanem sila
    subhaya~ bhalaim || natha nipata maim kinhi dhithai| svami samaja sakoca bihai || abinaya binaya jatharuci
    bani| chamihi deu ati arati jani || do suhrada sujana susahibahi bahuta kahaba barai khori| ayasu
    deia deva aba sabi sudhari mori || || prabhu pada paduma paraga dohai| satya sukrita sukha siva~ suhai
    || so kari kahu~ hie apane ki| ruci jagata sovata sapane ki || sahaja saneha~ svami sevakai| svaratha
    chala phala cari bihai || agya sama na susahiba seva| so prasadu jana pavai deva || asa kahi prema
    bibasa bhe bhari| pulaka sarira bilocana bari || prabhu pada kamala gahe akulai| samu sanehu na so
    kahi jai || kripasindhu sanamani subani| baithae samipa gahi pani || bharata binaya suni dekhi subh
    | sithila saneha~ sabha raghur raghurau sithila saneha~ sadhu samaja muni mithila dhani| mana mahu~
    sarahata bharata bhayapa bhagati ki mahima ghani || bharatahi prasamsata bibudha barashata sumana
    manasa malina se| tulasi bikala saba loga suni sakuce nisagama nalina se || so dekhi dukhari dina
    duhu samaja nara nari saba| maghava maha malina mue mari mangala cahata || || kapata kucali siva~
    suraraju| para akaja priya apana kaju || kaka samana pakaripu riti| chali malina katahu~ na pratiti
    || prathama kumata kari kapatu sa~kela| so ucatu saba kem sira mela || suramaya~ saba loga bimohe|
    rama prema atisaya na bichohe || bhaya ucata basa mana thira nahim| chana bana ruci chana sadana sohahim
    || dubidha manogati praja dukhari| sarita sindhu sangama janu bari || ducita katahu~ paritoshu na
    lahahim| eka eka sana maramu na kahahim || lakhi hiya~ ha~si kaha kripanidhanu| sarisa svana maghavana
    jubanu || do bharatu janaku munijana saciva sadhu saceta bihai| lagi devamaya sabahi jathajogu janu
    pai || || kripasindhu lakhi loga dukhare| nija saneha~ surapati chala bhare || sabha rau gura mahisura
    mantri| bharata bhagati saba kai mati jantri || ramahi citavata citra likhe se| sakucata bolata bacana
    sikhe se || bharata priti nati binaya baraai| sunata sukhada baranata kathinai || jasu biloki bhagati
    lavalesu| prema magana munigana mithilesu || mahima tasu kahai kimi tulasi| bhagati subhaya~ sumati
    hiya~ hulasi || apu choti mahima barai jani| kabikula kani mani sakucani || kahi na sakati guna ruci
    adhikai| mati gati bala bacana ki nai || do bharata bimala jasu bimala bidhu sumati cakorakumari|
    udita bimala jana hridaya nabha ekataka rahi nihari || || bharata subhau na sugama nigamahu~| laghu
    mati capalata kabi chamahu~ || kahata sunata sati bhau bharata ko| siya rama pada hoi na rata ko ||
    sumirata bharatahi premu rama ko| jehi na sulabha tehi sarisa bama ko || dekhi dayala dasa sabahi
    ki| rama sujana jani jana ji ki || dharama dhurina dhira naya nagara| satya saneha sila sukha sagara
    || desu kala lakhi samu samaju| niti priti palaka raghuraju || bole bacana bani sarabasu se| hita
    parinama sunata sasi rasu se || tata bharata tumha dharama dhurina| loka beda bida prema prabina ||
    do karama bacana manasa bimala tumha samana tumha tata| gura samaja laghu bandhu guna kusamaya~ kimi
    kahi jata || || janahu tata tarani kula riti| satyasandha pitu kirati priti || samu samaju laja gurujana
    ki| udasina hita anahita mana ki || tumhahi bidita sabahi kara karamu| apana mora parama hita dharamu
    || mohi saba bha~ti bharosa tumhara| tadapi kahu~ avasara anusara || tata tata binu bata hamari| kevala
    gurukula kripa~ sa~bhari || nataru praja parijana parivaru| hamahi sahita sabu hota khuaru || jaum
    binu avasara athava~ dinesu| jaga kehi kahahu na hoi kalesu || tasa utapatu tata bidhi kinha| muni
    mithilesa rakhi sabu linha || do raja kaja saba laja pati dharama dharani dhana dhama| gura prabhau
    palihi sabahi bhala hoihi parinama || || sahita samaja tumhara hamara| ghara bana gura prasada rakhavara
    || matu pita gura svami nidesu| sakala dharama dharanidhara sesu || so tumha karahu karavahu mohu|
    tata taranikula palaka hohu || sadhaka eka sakala sidhi deni| kirati sugati bhutimaya beni || so bicari
    sahi sankatu bhari| karahu praja parivaru sukhari || ba~ti bipati sabahim mohi bhai| tumhahi avadhi
    bhari barai kathinai || jani tumhahi mridu kahu~ kathora| kusamaya~ tata na anucita mora || hohim
    kuthaya~ subandhu suhae| oraiahim hatha asanihu ke ghae || do sevaka kara pada nayana se mukha so
    sahibu hoi| tulasi priti ki riti suni sukabi sarahahim soi || || sabha sakala suni raghubara bani|
    prema payodhi amia janu sani || sithila samaja saneha samadhi| dekhi dasa cupa sarada sadhi || bharatahi
    bhayu parama santoshu| sanamukha svami bimukha dukha doshu || mukha prasanna mana mita bishadu| bha
    janu gu~gehi gira prasadu || kinha saprema pranamu bahori| bole pani pankaruha jori || natha bhayu
    sukhu satha ge ko| laheu~ lahu jaga janamu bhe ko || aba kripala jasa ayasu hoi| karaum sisa dhari
    sadara soi || so avalamba deva mohi dei| avadhi paru pavaum jehi sei || do deva deva abhisheka hita
    gura anusasanu pai| aneu~ saba tiratha salilu tehi kaha~ kaha rajai || || eku manorathu bara mana
    mahim| sabhaya~ sakoca jata kahi nahim || kahahu tata prabhu ayasu pai| bole bani saneha suhai ||
    citrakuta suci thala tiratha bana| khaga mriga sara sari nirjhara girigana || prabhu pada ankita avani
    biseshi| ayasu hoi ta avaum dekhi || avasi atri ayasu sira dharahu| tata bigatabhaya kanana carahu
    || muni prasada banu mangala data| pavana parama suhavana bhrata || rishinayaku jaha~ ayasu dehim|
    rakhehu tiratha jalu thala tehim || suni prabhu bacana bharata sukha pava| muni pada kamala mudita
    siru nava || do bharata rama sambadu suni sakala sumangala mula| sura svarathi sarahi kula barashata
    surataru phula || || dhanya bharata jaya rama gosaim| kahata deva harashata bariai| muni mithilesa
    sabha~ saba kahu| bharata bacana suni bhayu uchahu || bharata rama guna grama sanehu| pulaki prasamsata
    rau bidehu || sevaka svami subhau suhavana| nemu pemu ati pavana pavana || mati anusara sarahana lage|
    saciva sabhasada saba anurage || suni suni rama bharata sambadu| duhu samaja hiya~ harashu bishadu
    || rama matu dukhu sukhu sama jani| kahi guna rama prabodhim rani || eka kahahim raghubira baraai|
    eka sarahata bharata bhalai || do atri kaheu taba bharata sana saila samipa sukupa| rakhia tiratha
    toya taha~ pavana amia anupa || || bharata atri anusasana pai| jala bhajana saba die calai || sanuja
    apu atri muni sadhu| sahita ge jaha~ kupa agadhu || pavana patha punyathala rakha| pramudita prema
    atri asa bhasha || tata anadi siddha thala ehu| lopeu kala bidita nahim kehu || taba sevakanha sarasa
    thalu dekha| kinha sujala hita kupa bisesha || bidhi basa bhayu bisva upakaru| sugama agama ati dharama
    bicaru || bharatakupa aba kahihahim loga| ati pavana tiratha jala joga || prema sanema nimajjata prani|
    hoihahim bimala karama mana bani || do kahata kupa mahima sakala ge jaha~ raghurau| atri sunayu raghubarahi
    tiratha punya prabhau || || kahata dharama itihasa sapriti| bhayu bhoru nisi so sukha biti || nitya
    nibahi bharata dau bhai| rama atri gura ayasu pai || sahita samaja saja saba sadem| cale rama bana
    atana payadem || komala carana calata binu panahim| bhi mridu bhumi sakuci mana manahim || kusa kantaka
    ka~karim kuraim| katuka kathora kubastu duraim || mahi manjula mridu maraga kinhe| bahata samira tribidha
    sukha linhe || sumana barashi sura ghana kari chahim| bitapa phuli phali trina mridutahim || mriga
    biloki khaga boli subani| sevahim sakala rama priya jani || do sulabha siddhi saba prakritahu rama
    kahata jamuhata| rama prana priya bharata kahu~ yaha na hoi barai bata || || ehi bidhi bharatu phirata
    bana mahim| nemu premu lakhi muni sakucahim || punya jalashraya bhumi bibhaga| khaga mriga taru trina
    giri bana baga || caru bicitra pabitra biseshi| bujhata bharatu dibya saba dekhi || suni mana mudita
    kahata rishir | hetu nama guna punya prabh || katahu~ nimajjana katahu~ pranama| katahu~ bilokata
    mana abhirama || katahu~ baithi muni ayasu pai| sumirata siya sahita dau bhai || dekhi subhau sanehu
    suseva| dehim asisa mudita banadeva || phirahim ge~ dinu pahara arhaai| prabhu pada kamala bilokahim
    ai || do dekhe thala tiratha sakala bharata pa~ca dina majha| kahata sunata hari hara sujasu gayu
    divasu bhi sa~jha || || bhora nhai sabu jura samaju| bharata bhumisura terahuti raju || bhala dina
    aju jani mana mahim| ramu kripala kahata sakucahim || gura nripa bharata sabha avaloki| sakuci rama
    phiri avani biloki || sila sarahi sabha saba soci| kahu~ na rama sama svami sa~koci || bharata sujana
    rama rukha dekhi| uthi saprema dhari dhira biseshi || kari dandavata kahata kara jori| rakhim natha
    sakala ruci mori || mohi lagi saheu sabahim santapu| bahuta bha~ti dukhu pava apu || aba gosai~ mohi
    deu rajai| sevaum avadha avadhi bhari jai || do jehim upaya puni paya janu dekhai dinadayala| so sikha
    deia avadhi lagi kosalapala kripala || || purajana parijana praja gosai| saba suci sarasa saneha~
    sagai || raura badi bhala bhava dukha dahu| prabhu binu badi parama pada lahu || svami sujanu jani
    saba hi ki| ruci lalasa rahani jana ji ki || pranatapalu palihi saba kahu| deu duhu disi ora nibahu
    || asa mohi saba bidhi bhuri bharoso| kie~ bicaru na socu kharo so || arati mora natha kara chohu|
    duhu~ mili kinha dhithu hathi mohu || yaha bara doshu duri kari svami| taji sakoca sikhia anugami
    || bharata binaya suni sabahim prasamsi| khira nira bibarana gati hamsi || do dinabandhu suni bandhu
    ke bacana dina chalahina| desa kala avasara sarisa bole ramu prabina || || tata tumhari mori parijana
    ki| cinta gurahi nripahi ghara bana ki || mathe para gura muni mithilesu| hamahi tumhahi sapanehu~
    na kalesu || mora tumhara parama purusharathu| svarathu sujasu dharamu paramarathu || pitu ayasu palihim
    duhu bhai| loka beda bhala bhupa bhalai || gura pitu matu svami sikha palem| calehu~ kumaga paga parahim
    na khalem || asa bicari saba soca bihai| palahu avadha avadhi bhari jai || desu kosu parijana parivaru|
    gura pada rajahim laga charubharu || tumha muni matu saciva sikha mani| palehu puhumi praja rajadhani
    || do mukhia mukhu so cahiai khana pana kahu~ eka| pali poshi sakala a~ga tulasi sahita bibeka ||
    || rajadharama sarabasu etanoi| jimi mana maha~ manoratha goi || bandhu prabodhu kinha bahu bha~ti|
    binu adhara mana toshu na sa~ti || bharata sila gura saciva samaju| sakuca saneha bibasa raghuraju
    || prabhu kari kripa pa~varim dinhim| sadara bharata sisa dhari linhim || caranapitha karunanidhana
    ke| janu juga jamika praja prana ke || samputa bharata saneha ratana ke| akhara juga juna jiva jatana
    ke || kula kapata kara kusala karama ke| bimala nayana seva sudharama ke || bharata mudita avalamba
    lahe tem| asa sukha jasa siya ramu rahe tem || do mageu bida pranamu kari rama lie ura lai| loga ucate
    amarapati kutila kuavasaru pai || || so kucali saba kaha~ bhi niki| avadhi asa sama jivani ji ki ||
    nataru lakhana siya sama biyoga| hahari marata saba loga kuroga || ramakripa~ avareba sudhari| bibudha
    dhari bhi gunada gohari || bhentata bhuja bhari bhai bharata so| rama prema rasu kahi na parata so
    || tana mana bacana umaga anuraga| dhira dhurandhara dhiraju tyaga || barija locana mocata bari| dekhi
    dasa sura sabha dukhari || munigana gura dhura dhira janaka se| gyana anala mana kasem kanaka se ||
    je biranci niralepa upae| paduma patra jimi jaga jala jae || do teu biloki raghubara bharata priti
    anupa apara| bhe magana mana tana bacana sahita biraga bicara || || jaha~ janaka gura mati bhori|
    prakrita priti kahata barai khori || baranata raghubara bharata biyogu| suni kathora kabi janihi logu
    || so sakoca rasu akatha subani| samu sanehu sumiri sakucani || bhenti bharata raghubara samujhae|
    puni ripudavanu harashi hiya~ lae || sevaka saciva bharata rukha pai| nija nija kaja lage saba jai
    || suni daruna dukhu duhu~ samaja| lage calana ke sajana saja || prabhu pada paduma bandi dau bhai|
    cale sisa dhari rama rajai || muni tapasa banadeva nihori| saba sanamani bahori bahori || do lakhanahi
    bhenti pranamu kari sira dhari siya pada dhuri| cale saprema asisa suni sakala sumangala muri || ||
    sanuja rama nripahi sira nai| kinhi bahuta bidhi binaya baraai || deva daya basa bara dukhu payu|
    sahita samaja kananahim ayu || pura pagu dharia dei asisa| kinha dhira dhari gavanu mahisa || muni
    mahideva sadhu sanamane| bida kie hari hara sama jane || sasu samipa ge dau bhai| phire bandi paga
    asisha pai || kausika bamadeva jabali| purajana parijana saciva sucali || jatha jogu kari binaya pranama|
    bida kie saba sanuja rama || nari purusha laghu madhya baraere| saba sanamani kripanidhi phere ||
    do bharata matu pada bandi prabhu suci saneha~ mili bhenti| bida kinha saji palaki sakuca soca saba
    meti || || parijana matu pitahi mili sita| phiri pranapriya prema punita || kari pranamu bhenti saba
    sasu| priti kahata kabi hiya~ na hulasu || suni sikha abhimata asisha pai| rahi siya duhu priti samai
    || raghupati patu palakim magaim| kari prabodhu saba matu carhaai || bara bara hili mili duhu bhai|
    sama saneha~ janani pahu~cai || saji baji gaja bahana nana| bharata bhupa dala kinha payana || hridaya~
    ramu siya lakhana sameta| cale jahim saba loga aceta || basaha baji gaja pasu hiya~ harem| cale jahim
    parabasa mana marem || do gura guratiya pada bandi prabhu sita lakhana sameta| phire harasha bisamaya
    sahita ae parana niketa || || bida kinha sanamani nishadu| caleu hridaya~ bara biraha bishadu || kola
    kirata bhilla banacari| phere phire johari johari || prabhu siya lakhana baithi bata chahim| priya
    parijana biyoga bilakhahim || bharata saneha subhau subani| priya anuja sana kahata bakhani || priti
    pratiti bacana mana karani| shrimukha rama prema basa barani || tehi avasara khaga mriga jala mina|
    citrakuta cara acara malina || bibudha biloki dasa raghubara ki| barashi sumana kahi gati ghara ghara
    ki || prabhu pranamu kari dinha bharoso| cale mudita mana dara na kharo so || do sanuja siya sameta
    prabhu rajata parana kutira| bhagati gyanu bairagya janu sohata dharem sarira || || muni mahisura
    gura bharata bhualu| rama biraha~ sabu saju bihalu || prabhu guna grama ganata mana mahim| saba cupacapa
    cale maga jahim || jamuna utari para sabu bhayu| so basaru binu bhojana gayu || utari devasari dusara
    basu| ramasakha~ saba kinha supasu || si utari gomatim nahae| cauthem divasa avadhapura ae| janaku
    rahe pura basara cari| raja kaja saba saja sa~bhari || saumpi saciva gura bharatahi raju| terahuti
    cale saji sabu saju || nagara nari nara gura sikha mani| base sukhena rama rajadhani || do rama darasa
    lagi loga saba karata nema upabasa| taji taji bhushana bhoga sukha jiata avadhi kim asa || || saciva
    susevaka bharata prabodhe| nija nija kaja pai pai sikha odhe || puni sikha dinha boli laghu bhai|
    saumpi sakala matu sevakai || bhusura boli bharata kara jore| kari pranama baya binaya nihore || u~ca
    nica karaju bhala pocu| ayasu deba na karaba sa~kocu || parijana purajana praja bolae| samadhanu kari
    subasa basae || sanuja ge gura geha~ bahori| kari dandavata kahata kara jori || ayasu hoi ta rahaum
    sanema| bole muni tana pulaki sapema || samujhava kahaba karaba tumha joi| dharama saru jaga hoihi
    soi || do suni sikha pai asisa barai ganaka boli dinu sadhi| singhasana prabhu paduka baithare nirupadhi
    || || rama matu gura pada siru nai| prabhu pada pitha rajayasu pai || nandigava~ kari parana kutira|
    kinha nivasu dharama dhura dhira || jatajuta sira munipata dhari| mahi khani kusa sa~thari sa~vari
    || asana basana basana brata nema| karata kathina rishidharama saprema || bhushana basana bhoga sukha
    bhuri| mana tana bacana taje tina turi || avadha raju sura raju sihai| dasaratha dhanu suni dhanadu
    lajai || tehim pura basata bharata binu raga| cancarika jimi campaka baga || rama bilasu rama anuragi|
    tajata bamana jimi jana barabhagi || do rama pema bhajana bharatu barae na ehim karatuti| cataka hamsa
    sarahiata tenka bibeka bibhuti || || deha dinahu~ dina dubari hoi| ghati teju balu mukhachabi soi
    || nita nava rama prema panu pina| barhata dharama dalu manu na malina || jimi jalu nighatata sarada
    prakase| bilasata betasa banaja bikase || sama dama sanjama niyama upasa| nakhata bharata hiya bimala
    akasa || dhruva bisvasa avadhi raka si| svami surati surabithi bikasi || rama pema bidhu acala adosha|
    sahita samaja soha nita cokha || bharata rahani samujhani karatuti| bhagati birati guna bimala bibhuti
    || baranata sakala sukaci sakucahim| sesa ganesa gira gamu nahim || do nita pujata prabhu pa~vari
    priti na hridaya~ samati || magi magi ayasu karata raja kaja bahu bha~ti || || pulaka gata hiya~ siya
    raghubiru| jiha namu japa locana niru || lakhana rama siya kanana basahim| bharatu bhavana basi tapa
    tanu kasahim || dau disi samujhi kahata sabu logu| saba bidhi bharata sarahana jogu || suni brata
    nema sadhu sakucahim| dekhi dasa muniraja lajahim || parama punita bharata acaranu| madhura manju
    muda mangala karanu || harana kathina kali kalusha kalesu| mahamoha nisi dalana dinesu || papa punja
    kunjara mrigaraju| samana sakala santapa samaju| jana ranjana bhanjana bhava bharu| rama saneha sudhakara
    saru || cham siya rama prema piyusha purana hota janamu na bharata ko| muni mana agama jama niyama
    sama dama bishama brata acarata ko || dukha daha darida dambha dushana sujasa misa apaharata ko| kalikala
    tulasi se sathanhi hathi rama sanamukha karata ko || so bharata carita kari nemu tulasi jo sadara
    sunahim| siya rama pada pemu avasi hoi bhava rasa birati || ikkisava~ vishrama iti shrimadramacaritamanase
    sakalakalikalushavidhvamsane dvitiyah sopanah samaptah|
  devanagari: श्रीगणेशायनमः श्रीजानकीवल्लभो विजयते श्रीरामचरितमानस द्वितीय सोपान यस्याङ्के च विभाति भूधरसुता
    देवापगा मस्तके भाले बालविधुर्गले च गरलं यस्योरसि व्यालराट्। सोऽयं भूतिविभूषणः सुरवरः सर्वाधिपः सर्वदा
    शर्वः सर्वगतः शिवः शशिनिभः श्रीशङ्करः पातु माम् ॥ ॥ प्रसन्नतां या न गताभिषेकतस्तथा न मम्ले वनवासदुःखतः।
    मुखाम्बुजश्री रघुनन्दनस्य मे सदास्तु सा मञ्जुलमङ्गलप्रदा ॥ ॥ नीलाम्बुजश्यामलकोमलाङ्गं सीतासमारोपितवामभागम्।
    पाणौ महासायकचारुचापं नमामि रामं रघुवंशनाथम् ॥ श्रीगुरु चरन सरोज रज निज मनु मुकुरु सुधारि। बरनुँ रघुबर
    बिमल जसु जो दायकु फल चारि ॥ जब तें रामु ब्याहि घर आए। नित नव मङ्गल मोद बधाए ॥ भुवन चारिदस भूधर भारी।
    सुकृत मेघ बरषहि सुख बारी ॥ रिधि सिधि सम्पति नदीं सुहाई। उमगि अवध अम्बुधि कहुँ आई ॥ मनिगन पुर नर नारि
    सुजाती। सुचि अमोल सुन्दर सब भाँती ॥ कहि न जाइ कछु नगर बिभूती। जनु एतनिअ बिरञ्चि करतूती ॥ सब बिधि सब
    पुर लोग सुखारी। रामचन्द मुख चन्दु निहारी ॥ मुदित मातु सब सखीं सहेली। फलित बिलोकि मनोरथ बेली ॥ राम
    रूपु गुनसीलु सुभ् । प्रमुदित होइ देखि सुनि र् सब कें उर अभिलाषु अस कहहिं मनाइ महेसु। आप अछत जुबराज
    पद रामहि देउ नरेसु ॥ ॥ एक समय सब सहित समाजा। राजसभाँ रघुराजु बिराजा ॥ सकल सुकृत मूरति नरनाहू। राम
    सुजसु सुनि अतिहि उछाहू ॥ नृप सब रहहिं कृपा अभिलाषें। लोकप करहिं प्रीति रुख राखेम् ॥ तिभुवन तीनि काल
    जग माहीं। भूरि भाग दसरथ सम नाहीम् ॥ मङ्गलमूल रामु सुत जासू। जो कछु कहिज थोर सबु तासू ॥ रायँ सुभायँ
    मुकुरु कर लीन्हा। बदनु बिलोकि मुकुट सम कीन्हा ॥ श्रवन समीप भे सित केसा। मनहुँ जरठपनु अस उपदेसा ॥ नृप
    जुबराज राम कहुँ देहू। जीवन जनम लाहु किन लेहू ॥ दो यह बिचारु उर आनि नृप सुदिनु सुअवसरु पाइ। प्रेम पुलकि
    तन मुदित मन गुरहि सुनायु जाइ ॥ ॥ कहि भुआलु सुनिअ मुनिनायक। भे राम सब बिधि सब लायक ॥ सेवक सचिव सकल
    पुरबासी। जे हमारे अरि मित्र उदासी ॥ सबहि रामु प्रिय जेहि बिधि मोही। प्रभु असीस जनु तनु धरि सोही ॥
    बिप्र सहित परिवार गोसाईं। करहिं छोहु सब रौरिहि नाई ॥ जे गुर चरन रेनु सिर धरहीं। ते जनु सकल बिभव बस
    करहीम् ॥ मोहि सम यहु अनुभयु न दूजें। सबु पायुँ रज पावनि पूजेम् ॥ अब अभिलाषु एकु मन मोरें। पूजहि नाथ
    अनुग्रह तोरेम् ॥ मुनि प्रसन्न लखि सहज सनेहू। कहेउ नरेस रजायसु देहू ॥ दो राजन राउर नामु जसु सब अभिमत
    दातार। फल अनुगामी महिप मनि मन अभिलाषु तुम्हार ॥ ॥ सब बिधि गुरु प्रसन्न जियँ जानी। बोलेउ राउ रहँसि
    मृदु बानी ॥ नाथ रामु करिअहिं जुबराजू। कहिअ कृपा करि करिअ समाजू ॥ मोहि अछत यहु होइ उछाहू। लहहिं लोग
    सब लोचन लाहू ॥ प्रभु प्रसाद सिव सबि निबाहीं। यह लालसा एक मन माहीम् ॥ पुनि न सोच तनु रहु कि ज् । जेहिं
    न होइ पाछें पछित् ॥ सुनि मुनि दसरथ बचन सुहाए। मङ्गल मोद मूल मन भाए ॥ सुनु नृप जासु बिमुख पछिताहीं।
    जासु भजन बिनु जरनि न जाहीम् ॥ भयु तुम्हार तनय सोइ स्वामी। रामु पुनीत प्रेम अनुगामी ॥ दो बेगि बिलम्बु
    न करिअ नृप साजिअ सबुइ समाजु। सुदिन सुमङ्गलु तबहिं जब रामु होहिं जुबराजु ॥ ॥ मुदित महिपति मन्दिर आए।
    सेवक सचिव सुमन्त्रु बोलाए ॥ कहि जयजीव सीस तिन्ह नाए। भूप सुमङ्गल बचन सुनाए ॥ जौं पाँचहि मत लागै नीका।
    करहु हरषि हियँ रामहि टीका ॥ मन्त्री मुदित सुनत प्रिय बानी। अभिमत बिरवँ परेउ जनु पानी ॥ बिनती सचिव
    करहि कर जोरी। जिअहु जगतपति बरिस करोरी ॥ जग मङ्गल भल काजु बिचारा। बेगिअ नाथ न लाइअ बारा ॥ नृपहि मोदु
    सुनि सचिव सुभाषा। बढ़त बौण्ड़ जनु लही सुसाखा ॥ दो कहेउ भूप मुनिराज कर जोइ जोइ आयसु होइ। राम राज अभिषेक
    हित बेगि करहु सोइ सोइ ॥ ॥ हरषि मुनीस कहेउ मृदु बानी। आनहु सकल सुतीरथ पानी ॥ औषध मूल फूल फल पाना। कहे
    नाम गनि मङ्गल नाना ॥ चामर चरम बसन बहु भाँती। रोम पाट पट अगनित जाती ॥ मनिगन मङ्गल बस्तु अनेका। जो जग
    जोगु भूप अभिषेका ॥ बेद बिदित कहि सकल बिधाना। कहेउ रचहु पुर बिबिध बिताना ॥ सफल रसाल पूगफल केरा। रोपहु
    बीथिन्ह पुर चहुँ फेरा ॥ रचहु मञ्जु मनि चौकें चारू। कहहु बनावन बेगि बजारू ॥ पूजहु गनपति गुर कुलदेवा।
    सब बिधि करहु भूमिसुर सेवा ॥ दो ध्वज पताक तोरन कलस सजहु तुरग रथ नाग। सिर धरि मुनिबर बचन सबु निज निज
    काजहिं लाग ॥ ॥ जो मुनीस जेहि आयसु दीन्हा। सो तेहिं काजु प्रथम जनु कीन्हा ॥ बिप्र साधु सुर पूजत राजा।
    करत राम हित मङ्गल काजा ॥ सुनत राम अभिषेक सुहावा। बाज गहागह अवध बधावा ॥ राम सीय तन सगुन जनाए। फरकहिं
    मङ्गल अङ्ग सुहाए ॥ पुलकि सप्रेम परसपर कहहीं। भरत आगमनु सूचक अहहीम् ॥ भे बहुत दिन अति अवसेरी। सगुन
    प्रतीति भेण्ट प्रिय केरी ॥ भरत सरिस प्रिय को जग माहीं। इहि सगुन फलु दूसर नाहीम् ॥ रामहि बन्धु सोच
    दिन राती। अण्डन्हि कमठ ह्रदु जेहि भाँती ॥ दो एहि अवसर मङ्गलु परम सुनि रहँसेउ रनिवासु। सोभत लखि बिधु
    बढ़त जनु बारिधि बीचि बिलासु ॥ ॥ प्रथम जाइ जिन्ह बचन सुनाए। भूषन बसन भूरि तिन्ह पाए ॥ प्रेम पुलकि तन
    मन अनुरागीं। मङ्गल कलस सजन सब लागीम् ॥ चौकें चारु सुमित्राँ पुरी। मनिमय बिबिध भाँति अति रुरी ॥ आनँद
    मगन राम महतारी। दिए दान बहु बिप्र हँकारी ॥ पूजीं ग्रामदेबि सुर नागा। कहेउ बहोरि देन बलिभागा ॥ जेहि
    बिधि होइ राम कल्यानू। देहु दया करि सो बरदानू ॥ गावहिं मङ्गल कोकिलबयनीं। बिधुबदनीं मृगसावकनयनीम् ॥
    दो राम राज अभिषेकु सुनि हियँ हरषे नर नारि। लगे सुमङ्गल सजन सब बिधि अनुकूल बिचारि ॥ ॥ तब नरनाहँ बसिष्ठु
    बोलाए। रामधाम सिख देन पठाए ॥ गुर आगमनु सुनत रघुनाथा। द्वार आइ पद नायु माथा ॥ सादर अरघ देइ घर आने।
    सोरह भाँति पूजि सनमाने ॥ गहे चरन सिय सहित बहोरी। बोले रामु कमल कर जोरी ॥ सेवक सदन स्वामि आगमनू। मङ्गल
    मूल अमङ्गल दमनू ॥ तदपि उचित जनु बोलि सप्रीती। पठिअ काज नाथ असि नीती ॥ प्रभुता तजि प्रभु कीन्ह सनेहू।
    भयु पुनीत आजु यहु गेहू ॥ आयसु होइ सो करौं गोसाई। सेवक लहि स्वामि सेवकाई ॥ दो सुनि सनेह साने बचन मुनि
    रघुबरहि प्रसंस। राम कस न तुम्ह कहहु अस हंस बंस अवतंस ॥ ॥ बरनि राम गुन सीलु सुभ् । बोले प्रेम पुलकि
    मुनिर् ॥ भूप सजेउ अभिषेक समाजू। चाहत देन तुम्हहि जुबराजू ॥ राम करहु सब सञ्जम आजू। जौं बिधि कुसल निबाहै
    काजू ॥ गुरु सिख देइ राय पहिं गयु। राम हृदयँ अस बिसमु भयू ॥ जनमे एक सङ्ग सब भाई। भोजन सयन केलि लरिकाई
    ॥ करनबेध उपबीत बिआहा। सङ्ग सङ्ग सब भे उछाहा ॥ बिमल बंस यहु अनुचित एकू। बन्धु बिहाइ बड़एहि अभिषेकू
    ॥ प्रभु सप्रेम पछितानि सुहाई। हरु भगत मन कै कुटिलाई ॥ दो तेहि अवसर आए लखन मगन प्रेम आनन्द। सनमाने
    प्रिय बचन कहि रघुकुल कैरव चन्द ॥ ॥ बाजहिं बाजने बिबिध बिधाना। पुर प्रमोदु नहिं जाइ बखाना ॥ भरत आगमनु
    सकल मनावहिं। आवहुँ बेगि नयन फलु पावहिम् ॥ हाट बाट घर गलीं अथाई। कहहिं परसपर लोग लोगाई ॥ कालि लगन भलि
    केतिक बारा। पूजिहि बिधि अभिलाषु हमारा ॥ कनक सिङ्घासन सीय समेता। बैठहिं रामु होइ चित चेता ॥ सकल कहहिं
    कब होइहि काली। बिघन मनावहिं देव कुचाली ॥ तिन्हहि सोहाइ न अवध बधावा। चोरहि चन्दिनि राति न भावा ॥ सारद
    बोलि बिनय सुर करहीं। बारहिं बार पाय लै परहीम् ॥ दो बिपति हमारि बिलोकि बड़इ मातु करिअ सोइ आजु। रामु
    जाहिं बन राजु तजि होइ सकल सुरकाजु ॥ ॥ सुनि सुर बिनय ठाढ़इ पछिताती। भिउँ सरोज बिपिन हिमराती ॥ देखि
    देव पुनि कहहिं निहोरी। मातु तोहि नहिं थोरिउ खोरी ॥ बिसमय हरष रहित रघुर् । तुम्ह जानहु सब राम प्रभ्
    ॥ जीव करम बस सुख दुख भागी। जाइअ अवध देव हित लागी ॥ बार बार गहि चरन सँकोचौ। चली बिचारि बिबुध मति पोची
    ॥ ऊँच निवासु नीचि करतूती। देखि न सकहिं पराइ बिभूती ॥ आगिल काजु बिचारि बहोरी। करहहिं चाह कुसल कबि मोरी
    ॥ हरषि हृदयँ दसरथ पुर आई। जनु ग्रह दसा दुसह दुखदाई ॥ दो नामु मन्थरा मन्दमति चेरी कैकेइ केरि। अजस पेटारी
    ताहि करि गी गिरा मति फेरि ॥ ॥ दीख मन्थरा नगरु बनावा। मञ्जुल मङ्गल बाज बधावा ॥ पूछेसि लोगन्ह काह उछाहू।
    राम तिलकु सुनि भा उर दाहू ॥ करि बिचारु कुबुद्धि कुजाती। होइ अकाजु कवनि बिधि राती ॥ देखि लागि मधु कुटिल
    किराती। जिमि गवँ तकि लेउँ केहि भाँती ॥ भरत मातु पहिं गि बिलखानी। का अनमनि हसि कह हँसि रानी ॥ ऊतरु
    देइ न लेइ उसासू। नारि चरित करि ढारि आँसू ॥ हँसि कह रानि गालु बड़ तोरें। दीन्ह लखन सिख अस मन मोरेम्
