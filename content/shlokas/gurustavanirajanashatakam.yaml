id: gurustavanirajanashatakam
category: shataka
name:
  english: gurustavanirajanashatakam
  devanagari: गुरुस्तवनीराजनशतकम्
content:
  english: ritam tu agrahyam maya yogaprashikshakah mam ma vismaratu gitasudhakarah mama doshan dahatu
    || 2|| 24 guruvarya mayi sthairyam pravardhaya guruvarya mayi sthairyam pravardhaya guruvara karpanyadosham
    nivaraya || pallavi|| shraddhanvitah bandhat pramucyate dvandvamaya jivane tvamupasevate aham tu khinnamanaskah
    bhavashushkah bhogepi vancitah yogepi vancitah || 1|| dhyeyarahityam kadapi na priyah jneyashunyattvam
    sada me apriyah ato tvamashrayami gitasudhashraya arjava gunam datva mam palaya || 2|| 25 gurudeva
    tava tapobalam prasadaya gurudeva tava tapobalam prasadaya gurubhaktipushpam svikuru kripalaya ||
    pallavi|| moda pramoda pramada vishadadi bhavaveshebhyo aprabuddho'smi jivasamskarana shastrajno'si
    tvam advitiya samudaya hitarato'si tvam || 1|| svayankritaparadhah mamaiva sujnanabhiksham dehi gurudeva
    samshritavatsala shishyagana paripala samshaya nivaraka gitasudhalola || 2|| 26 guru tava dhyanam
    sarvakalushaharam guru tava dhyanam sarvakalushaharam guruguna ganam madhuratimadhuram || pallavi||
    rishisampradaya paramparavana rishiveshanatakadura nirguna nirbhaya nirbhava karunantaranga nirmama
    niranjana he muktasanga || 1|| parandhamasadana paratattvasana parabrahmarupa parama pavitra paramanasa
    shastravetta tripta parabhaktavarenya gitasudhasharanya || 2|| 27 gunagambhira yogadhurandhara gunagambhira
    yogadhurandhara guruvara karunyasagara || pallavi|| pranava nadanusandhana nirata pramanadi pancavritti
    rahita sarvatmabhavana sadhakaparikshana sharanagata pralobhana nivarana || 1|| sarva deshakala premapurna
    sarva purushartha saphalya karana mahashakta he mahavirakta mahabhakta gitasudharakta || 2|| 28 gurudeva
    tvaya katham sampraptam gurudeva tvaya katham sampraptam gahanatama cidrupam paratattvam || pallavi||
    janmajanmantare paripakvo'si lokasangrahartham janmamidam tavaiva sadhanarambham mamedanim kim tu
    tava janma mamoddharakam || 1|| tava divya karmamidam sadhakaprerakam tava tapophalam atmabalavardhakam
    dhanika pita svayarjita sampaddatva putram dhanikam pashyativa gitasudhakara || 2|| 29 gurupitha diptim
    prasaraya gurupitha diptim prasaraya gurushakti vittam prayaccha kripaya || pallavi|| he jivanmukta
    saphalajanmartham dhyanayoge mam gamaya tvaraya he samacitta sadridhagatra amanaska yoge gamaya cinmaya
    || 1|| gunatito'si na nishkriyah dvandvatito'si dayapurnah akartaro'pi lokasangrahakarta abhoktaro'pi
    sevatripta || 2|| 30 gurunatha tvaya vina ko data gurunatha tvaya vina ko data gunanatha tvaya vina
    ko trata || pallavi|| jnanambudhi talasthita ratnah shreyo pathe tvaya viniyuktah sarvakala geya shishyottama
    dhyeya pratahsmaraniya avismaraniya || 1|| kimasti guro goptam he paripurna adrishyam drishyam agrahyam
    grahyam apraptam praptam he siddhipurna sarvadaraniya gitasudhapriya || 2|| 31 gurudeva varayoganushasaka
    gurudeva varayoganushasaka guruvarya pahi mam shishyoddharaka || pallavi|| nityapravartita karmacakre
    niketanarahita kalacakre anuvartayeti prabodhasi anubhava gamye mam niyojayasi || 1|| pratidinamaham
    avasthacakre vashah ajivaparyantam vikaracakre vashah tvaddarshita rajayoge tishthami gitasudhapreraka
    nato'smi shrito'smi || 2|| 32 gururakshito'smi janmantarapunyena gururakshito'smi janmantarapunyena
    gurushikshito'smi yogivarenyena || pallavi|| shatashatanubhava katuvishayavalaye sadhanollasam praptam
    gurukripalaye sudushkara mano nigrahamarmam samprita guruna bodhitamanukshanam || 1|| prarabdha karmani
    avartiniva tiryaggamane tu mama shvasabandhah shishyavatsalyamahapurena guruna poshito'smi gitasudhanutena
    || 2|| 33 gunamanidhara tvam tattvabhaskara gunamanidhara tvam tattvabhaskara gurudeva dhivara jnanamakutadhara
    || pallavi|| sankalpamatrena icchashaktighana nishcayamatrena jnanashaktighana calanamatrena kriyashaktighana
    apratima mahateja yogashaktidhana || 1|| tapovrata dharmavrata satyapathagami yogavrata sushruta tvam
    samyami lokahitakaryam vishve prasiddhah gitasudhavana gurukulabaddhah || 2|| 34 gurudeva pancavishayaparanmukha
    gurudeva pancavishayaparanmukha gurunatha pancasharaparajita || pallavi|| sarva naranam citte samskarah
    sarva vayavasthe suprakatitah avidyapaha sattvika karta asima prabhava shuddhasattvastha || 1|| vyashtibhavarahita
    he shantiduta vishvasampujita pavanacarita sadhakahridaya sannihita sarvashrita gitasudhanuta || 2||
    35 guruvara tava praptiraprapta praptih guruvara tava praptiraprapta praptih gurudeva mama tu karmana
    praptih || pallavi|| antaratama shodhanam kritva tvam tejasvi tvam ojasvi shamadamoparati sadhane
    naya shreyopriyam mamajeyabhaya || 1|| janmajanmantare anuttirno'ham jara vyadhipide punarapi dhritihinah
    anyatha sharanam nastiti prarthana mamava kripaya gitasudhavana || 2|| 36 guruvarena vina ko'sti sucaritah
    guruvarena vina ko'sti sucaritah gurukulavasena vina ko sushikshitah || pallavi|| nabhahsprisham tasya
    vatsalyashikharah nirajadalamambuvat nirliptah devaprityartham karmakshetrasthah kartum bhoktum siddhah
    na nibaddhah || 1|| bahumukha dharma pravartako'pi svadharmagami samrakshakah sadhanashailiranjanah
    niranjanah saddarshanaparah gitasudhavanah || 37 guruvara ekada mamabhimukho bhava guruvara ekada
    mamabhimukho bhava gurubhaktisagara patitapavano bhava || pallavi|| sadhakaloka sakshisvarupa sarvabhuta
    karunyarupa yajna tapo dana karmapreraka sadbhakti sacchaktidayako bhava || 1|| jnanaghana langhayasi
    pangum shailam tapodhana karoshi mukam vacalam jijnasu poshaka vijnanadarshaka sujnanadayaka gitasudhabhimukha
    || 2|| 38 gurusamipye cakshurunmilanam gurusamipye cakshurunmilanam gurumargagamane satyadarshanam
    || pallavi|| nistraigunyah yogishaganyah nindastutisamah jnanivarenyah nirlepayoge karmavimuktah nirbhavah
    guruh jalajapatramivajale || 1|| gitasudharatah svartharahitah nirdhutakalushah devadutah bhavavishleshana
    visharadah shastrarthakovidah guruvara varadah || 2|| 39 guruvarya hitakara tava shishyo'ham guruvarya
    hitakara tava shishyo'ham guruvarishta tava prashishyo'ham || pallavi|| tvameva sarvasvam mamaradhya
    tvayyaiva so'ham vishvavedya aprabuddha pralapa vilapa madhye maunavrata diksham datva palaya || 1||
    sampujita bhakta samashrita sambhavita nityajagarita jitakama jitakrodha jitantahkarana jitanidra
    jitendriya gitasudhavana || 2|| 40 gurudeva tava satya jnanayajne gurudeva tava satya jnanayajne guruvara
    tava tattvadarshanamanupamam || pallavi|| dravyayajnam tu bahujanashritam bahukriya kalapa puritam
    bahulayasam bahuvastumayam bahumukha samarthya balamayam || 1|| gurubrahma tavaiva antarmukhayajne
    | aklishtasadhanam sulabhasuyojanam adhikatarashantih vinashtabhrantih gitasudhajyotih yogatantra
    krantih || 2|| 41 gururnarayanah narayano guruh gururnarayanah narayano guruh gururtatparayanah gururkalpataruh
    || pallavi|| vishnuhridaya sthita vishvagurupithe virajati madguruh tripundralalatah mama vishnusmarane
    gurusmaranam mama gurusmarane mahavishnu dhyanam || 1|| sujnanasimhasanarudhah vijnanatatparah svanubhave
    gadhah navavidha bhakti rasapane mattah gitasudhasaktah mantrashaktivettah || 2|| 42 gurusannidhanah
    kripasagarah gurusannidhanah kripasagarah guruyogadanah karyagarah || pallavi|| sancara manasa svadhyaya
    gagane sarvabhauma gurorvacanam sha
  devanagari: ृतं तु अग्राह्यं मया योगप्रशिक्षकः मां मा विस्मरतु गीतसुधाकरः मम दोषान् दहतु ॥ २॥ २४ गुरुवर्य
    मयि स्थैर्यं प्रवर्धय गुरुवर्य मयि स्थैर्यं प्रवर्धय गुरुवर कार्पण्यदोषं निवारय ॥ पल्लवि॥ श्रद्धान्वितः
    बन्धात् प्रमुच्यते द्वन्द्वमय जीवने त्वामुपसेवते अहं तु खिन्नमनस्कः भावशुष्कः भोगेपि वञ्चितः योगेपि
    वञ्चितः ॥ १॥ ध्येयराहित्यं कदापि न प्रियः ज्ञेयशून्यत्त्वं सदा मे अप्रियः अतो त्वामाश्रयामि गीतसुधाश्रय
    आर्जव गुणं दत्वा मां पालय ॥ २॥ २५ गुरुदेव तव तपोबलं प्रसादय गुरुदेव तव तपोबलं प्रसादय गुरुभक्तिपुष्पं
    स्वीकुरु कृपालय ॥ पल्लवि॥ मोद प्रमोद प्रमाद विषादादि भावावेशेभ्यो अप्रबुद्धोऽस्मि जीवसंस्करण शास्त्रज्ञोऽसि
    त्वं अद्वितीय समुदाय हितरतोऽसि त्वम् ॥ १॥ स्वयङ्कृतापराधाः ममैव सुज्ञानभिक्षां देहि गुरुदेव संश्रितवत्सल
    शिष्यगण परिपाल संशय निवारक गीतसुधालोल ॥ २॥ २६ गुरु तव ध्यानं सर्वकलुषहरम् गुरु तव ध्यानं सर्वकलुषहरं
    गुरुगुण गानं मधुरातिमधुरम् ॥ पल्लवि॥ ऋषिसंप्रदाय परम्परावन ऋषिवेषनाटकदूर निर्गुण निर्भय निर्भव करुणान्तरङ्ग
    निर्मम निरञ्जन हे मुक्तसङ्ग ॥ १॥ परन्धामसदन परतत्त्वासन परब्रह्मरूप परम पवित्र परामानस शास्त्रवेत्त
    तृप्त पराभक्तवरेण्य गीतसुधाशरण्य ॥ २॥ २७ गुणगम्भीर योगधुरन्धर गुणगम्भीर योगधुरन्धर गुरुवर कारुण्यसागर
    ॥ पल्लवि॥ प्रणव नादानुसन्धान निरत प्रमाणादि पञ्चवृत्ति रहित सर्वात्मभावन साधकपरीक्षण शरणागत प्रलोभन
    निवारण ॥ १॥ सर्व देशकाल प्रेमपूर्ण सर्व पुरुषार्थ साफल्य कारण महाशक्त हे महाविरक्त महाभक्त गीतसुधारक्त
    ॥ २॥ २८ गुरुदेव त्वया कथं संप्राप्तम् गुरुदेव त्वया कथं संप्राप्तं गहनतम चिद्रूपं परतत्त्वम् ॥ पल्लवि॥
    जन्मजन्मान्तरे परिपक्वोऽसि लोकसङ्ग्रहार्थं जन्ममिदं तवैव साधनारम्भं ममेदानीं किं तु तव जन्म ममोद्धारकम्
    ॥ १॥ तव दिव्य कर्ममिदं साधकप्रेरकं तव तपोफलं आत्मबलवर्धकं धनिक पिता स्वयार्जित सम्पद्दत्वा पुत्रं
    धनिकं पश्यतीव गीतसुधाकर ॥ २॥ २९ गुरुपीठ दीप्तिं प्रसारय गुरुपीठ दीप्तिं प्रसारय गुरुशक्ति वित्तं प्रयच्छ
    कृपया ॥ पल्लवि॥ हे जीवन्मुक्त सफलजन्मार्थं ध्यानयोगे मां गमय त्वरया हे समचित्त सदृढगात्र अमनस्क योगे
    गमय चिन्मय ॥ १॥ गुणातीतोऽसि न निष्क्रियः द्वन्द्वातीतोऽसि दयापूर्णः अकर्तारोऽपि लोकसङ्ग्रहकर्ता अभोक्तारोऽपि
    सेवातृप्त ॥ २॥ ३० गुरुनाथ त्वया विना को दाता गुरुनाथ त्वया विना को दाता गुणनाथ त्वया विना को त्राता
    ॥ पल्लवि॥ ज्ञानाम्बुधि तलस्थित रत्नाः श्रेयो पथे त्वया विनियुक्ताः सर्वकाल गेय शिष्योत्तम ध्येय प्रातःस्मरणीय
    अविस्मरणीय ॥ १॥ किमस्ति गुरो गोप्तं हे परिपूर्ण अदृश्यं दृश्यं अग्राह्यं ग्राह्यं अप्राप्तं प्राप्तं
    हे सिद्धिपूर्ण सर्वदरणीय गीतसुधाप्रिय ॥ २॥ ३१ गुरुदेव वरयोगानुशासक गुरुदेव वरयोगानुशासक गुरुवर्य पाहि
    मां शिष्योद्धारक ॥ पल्लवि॥ नित्यप्रवर्तित कर्मचक्रे निकेतनरहित कालचक्रे अनुवर्तयेति प्रबोधसि अनुभव
    गम्ये मां नियोजयसि ॥ १॥ प्रतिदिनमहं अवस्थाचक्रे वशः आजीवपर्यन्तं विकारचक्रे वशः त्वद्दर्शित राजयोगे
    तिष्ठामि गीतसुधाप्रेरक नतोऽस्मि श्रितोऽस्मि ॥ २॥ ३२ गुरुरक्षितोऽस्मि जन्मान्तरपुण्येन गुरुरक्षितोऽस्मि
    जन्मान्तरपुण्येन गुरुशिक्षितोऽस्मि योगिवरेण्येन ॥ पल्लवि॥ शतशतानुभव कटुविषयवलये साधनोल्लासं प्राप्तं
    गुरुकृपालये सुदुष्कर मनो निग्रहमर्मं संप्रीत गुरुणा बोधितमनुक्षणम् ॥ १॥ प्रारब्ध कर्माणी आवर्तिनीव
    तिर्यग्गमने तु मम श्वासबन्धः शिष्यवात्सल्यमहापूरेण गुरुणा पोषितोऽस्मि गीतसुधानुतेन ॥ २॥ ३३ गुणमणिधर
    त्वं तत्त्वभास्कर गुणमणिधर त्वं तत्त्वभास्कर गुरुदेव धीवर ज्ञानमकुटधर ॥ पल्लवि॥ सङ्कल्पमात्रेण इच्छाशक्तिघन
    निश्चयमात्रेण ज्ञानशक्तिघन चलनमात्रेण क्रियाशक्तिघन अप्रतिम महातेज योगशक्तिधन ॥ १॥ तपोव्रत धर्मव्रत
    सत्यपथगामी योगव्रत सुश्रुत त्वं संयमी लोकहितकार्यं विश्वे प्रसिद्धः गीतसुधावन गुरुकुलबद्धः ॥ २॥ ३४
    गुरुदेव पञ्चविषयपराङ्मुख गुरुदेव पञ्चविषयपराङ्मुख गुरुनाथ पञ्चशरापराजित ॥ पल्लवि॥ सर्व नराणां चित्ते
    संस्काराः सर्व वयावस्थे सुप्रकटिताः अविद्यापह सात्त्विक कर्ता असीम प्रभाव शुद्धसत्त्वस्थ ॥ १॥ व्यष्टिभावरहित
    हे शान्तिदूत विश्वसम्पूजित पावनचरित साधकहृदय सन्निहित सर्वाश्रित गीतसुधानुत ॥ २॥ ३५ गुरुवर तव प्राप्तिरप्राप्त
    प्राप्तिः गुरुवर तव प्राप्तिरप्राप्त प्राप्तिः गुरुदेव मम तु कर्मणा प्राप्तिः ॥ पल्लवि॥ अन्तरतम शोधनं
    कृत्वा त्वं तेजस्वी त्वं ओजस्वी शमदमोपरति साधने नय श्रेयोप्रियं मामजेयाभय ॥ १॥ जन्मजन्मान्तरे अनुत्तीर्णोऽहं
    जरा व्यधिपीडे पुनरपि धृतिहीनः अन्यथा शरणं नास्तीति प्रार्थना मामव कृपया गीतसुधावन ॥ २॥ ३६ गुरुवरेण
    विना कोऽस्ति सुचरितः गुरुवरेण विना कोऽस्ति सुचरितः गुरुकुलवासेन विना को सुशिक्षितः ॥ पल्लवि॥ नभःस्पृशं
    तस्य वात्सल्यशिखरः नीरजदलमम्बुवत् निर्लिप्तः देवप्रीत्यर्थं कर्मक्षेत्रस्थः कर्तुं भोक्तुं सिद्धः
    न निबद्धः ॥ १॥ बहुमुख धर्म प्रवर्तकोऽपि स्वधर्मगामी संरक्षकः साधनाशैलिरञ्जनः निरञ्जनः सद्दर्शनपरः
    गीतसुधावनः ॥ ३७ गुरुवर एकदा ममाभिमुखो भव गुरुवर एकदा ममाभिमुखो भव गुरुभक्तिसागर पतितपावनो भव ॥ पल्लवि॥
    साधकलोक साक्षिस्वरूप सर्वभूत कारुण्यरूप यज्ञ तपो दान कर्मप्रेरक सद्भक्ति सच्छक्तिदायको भव ॥ १॥ ज्ञानघन
    लङ्घयसि पङ्गुं शैलं तपोधन करोषि मूकं वाचालं जिज्ञासु पोषक विज्ञानदर्शक सुज्ञानदायक गीतसुधाभिमुख ॥
    २॥ ३८ गुरुसामीप्ये चक्षुरुन्मीलनम् गुरुसामीप्ये चक्षुरुन्मीलनं गुरुमार्गगमने सत्यदर्शनम् ॥ पल्लवि॥
    निस्त्रैगुण्यः योगीशगण्यः निन्दास्तुतिसमः ज्ञानिवरेण्यः निर्लेपयोगे कर्मविमुक्तः निर्भवः गुरुः जलजपत्रमिवजले
    ॥ १॥ गीतसुधारतः स्वार्थरहितः निर्धूतकलुषः देवदूतः भावविश्लेषण विशारदः शास्त्रार्थकोविदः गुरुवर वरदः
    ॥ २॥ ३९ गुरुवर्य हितकर तव शिष्योऽहम् गुरुवर्य हितकर तव शिष्योऽहं गुरुवरिष्ट तव प्रशिष्योऽहम् ॥ पल्लवि॥
    त्वमेव सर्वस्वं ममाराध्य त्वय्यैव सोऽहं विश्ववेद्य अप्रबुद्ध प्रलाप विलाप मध्ये मौनव्रत दीक्षां दत्वा
    पालय ॥ १॥ सम्पूजित भक्त समाश्रित सम्भावित नित्यजागरित जितकाम जितक्रोध जितान्तःकरण जितनिद्र जितेन्द्रिय
    गीतसुधावन ॥ २॥ ४० गुरुदेव तव सत्य ज्ञानयज्ञे गुरुदेव तव सत्य ज्ञानयज्ञे गुरुवर तव तत्त्वदर्शनमनुपमम्
    ॥ पल्लवि॥ द्रव्ययज्ञं तु बहुजनाश्रितं बहुक्रिया कलाप पूरितं बहुलायासं बहुवस्तुमयं बहुमुख सामर्थ्य
    बलमयम् ॥ १॥ गुरुब्रह्म तवैव अन्तर्मुखयज्ञे । अक्लिष्टसाधनं सुलभसुयोजनं अधिकतरशान्तिः विनष्टभ्रान्तिः
    गीतसुधाज्योतिः योगतन्त्र क्रान्तिः ॥ २॥ ४१ गुरुर्नारायणः नारायणो गुरुः गुरुर्नारायणः नारायणो गुरुः
    गुरुर्तत्परायणः गुरुर्कल्पतरुः ॥ पल्लवि॥ विष्णुहृदय स्थित विश्वगुरुपीठे विराजति मद्गुरुः त्रिपुण्ड्रललाटः
    मम विष्णुस्मरणे गुरुस्मरणं मम गुरुस्मरणे महाविष्णु ध्यानम् ॥ १॥ सुज्ञानसिंहासनारूढः विज्ञानतत्परः
    स्वानुभवे गाढः नवविध भक्ति रसपाने मत्तः गीतसुधासक्तः मन्त्रशक्तिवेत्तः ॥ २॥ ४२ गुरुसन्निधानः कृपासागरः
    गुरुसन्निधानः कृपासागरः गुरुयोगदानः कार्यागारः ॥ पल्लवि॥ सञ्चर मानस स्वाध्याय गगने सार्वभौम गुरोर्वचनं
    श
