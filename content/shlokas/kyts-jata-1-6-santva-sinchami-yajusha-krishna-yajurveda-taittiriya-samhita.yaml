    अ॒भ्यव॑र्तन्ता॒ भ्यव॑र्त॒न्ते न्द्रे॑षिता॒ इन्द्रे॑षिता अ॒भ्यव॑र्तन्त । इन्द्रे॑षिता॒ इतीन्द्र॑ अ॒भ्यव॑र्तन्त॒
    दस्यू॒ न्दस्यू॑ न॒भ्यव॑र्तन्ता॒ भ्यव॑र्तन्त॒ दस्यून्॑ । अ॒भ्यव॑र्त॒न्तेत्य॑भि दस्यू॒निति॒ दस्यून्॑
