id: phanindrakshmabh-itstotram
category: stotram
name:
  english: phanindrakshmabhṟitstotram
  devanagari: फणीन्द्रक्ष्माभ्ऱित्स्तोत्रम्
content:
  english: svairasvadapramadaviharatkokilalapagarbhaih | sandracchayaissarasakusumaissaurabhakrishtabhringaih
    sarvairvrikshaissatataphalitairyah sada sambhritashrih || 4|| svaih padyardhyaprabhriti dadatah syandamanairmarandaih
    bhavyamodaih pavanagalitairarcayantah prasunaih | vrintodvantaih parinataphalairnityaklriptopaharah
    dhanya vriksha
  devanagari: स्वैरास्वादप्रमदविहरत्कोकिलालापगर्भैः । सान्द्रच्छायैस्सरसकुसुमैस्सौरभाकृष्टभृङ्गैः सर्वैर्वृक्षैस्सततफलितैर्यः
    सदा सम्भृतश्रीः ॥ ४॥ स्वैः पाद्यार्ध्यप्रभृति ददतः स्यन्दमानैर्मरन्दैः भव्यामोदैः पवनगलितैरर्चयन्तः
    प्रसूनैः । वृन्तोद्वान्तैः परिणतफलैर्नित्यक्लृप्तोपहाराः धन्या वृक्षा
meaning: {}
