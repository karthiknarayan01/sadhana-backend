id: devaihkritam16shivastotram
category: stotram
name:
  english: devaihkritam16shivastotram
  devanagari: देवैःकृतं१६शिवस्तोत्रम्
content:
  english: devaih kritam 16 shivastotram deva ucuh | tvameva devakhilalokakarta pata ca harta parameshvaro'si
    || 20|| kavishnurudrakhyasvarupabhedai rajastamassattvadhritatmamurte || 20|| sarvamurte namaste'stu
    vishvabhavana pavana || 21|| amurte bhaktahetorhi grihitakritisaukhyada || 21|| candro'gado hi devesha
    kripatastava shankara || 22|| nimajjananmritah prapa sukham mihirajajalih || 22|| simantini hatadhava
    tava pujanatah prabho || 23|| saubhagyamatulam prapa somavaravratatsutan || 23|| shrikaraya dadau
    devah sviyam padamanuttamam || 24|| sudarshanamarakshastvam nripamandalabhititah || 24|| meduram tarayamasa
    sadaram ca ghrinanidhih || 25|| sharadam vidhavam cakre sadhavam kriyaya bhavan || 25|| bhadrayusho
    vipattim ca vicchidya tvamadah sukham || 26|| saumini bhavabandhadvai mukta'bhuttava sevanat || 26||
    vishnuruvaca | tvam shambho kaharishashca rajassattvatamogunaih || 27|| karta pata tatha harta jananugrahakankshaya
    || 27|| sarvagarvapahari ca sarvatejovilasakah || 28|| sarvavidyadigudhashca sarvanugrahakarakah ||
    28|| tvattah sarvam ca tvam sarvam tvayi sarvam girishvara || 29|| trahi trahi punastrahi kripam kuru
    mamopari || 29|| athasminnantare brahma pranipatya kritanjalih || 30|| evam tvavasaram prapya vyajnapayata
    shuline || 30|| brahmovaca | jaya deva mahadeva pranatartivibhanjana || 31|| idrisheshvaparadheshu
    ko'nyastvattah prasidati || 31|| labdhamano bhavishyanti ye pura nihita mridhe || 32|| pratyapattirna
    kasya syatprasanne parameshvare || 32|| yadidam devadevanam kritamantushu dushanam || 33|| tadidam
    bhushanam manye ta angikaragauravat || 33|| iti shivapurane vayaviyasamhitayam purvakhande trayovimshadhyayantargatam
    devaih kritam shivastotram samaptam | shivapurana | vayaviyasamhita | purvabhaga 1 | adhyaya 23
  devanagari: देवैः कृतं १६ शिवस्तोत्रम् देवा ऊचुः । त्वमेव देवाखिललोककर्ता पाता च हर्ता परमेश्वरोऽसि
    ॥ २०॥ कविष्णुरुद्राख्यस्वरूपभेदै रजस्तमस्सत्त्वधृतात्ममूर्ते ॥ २०॥ सर्वमूर्ते नमस्तेऽस्तु विश्वभावन
    पावन ॥ २१॥ अमूर्ते भक्तहेतोर्हि गृहीताकृतिसौख्यद ॥ २१॥ चन्द्रोऽगदो हि देवेश कृपातस्तव शङ्कर ॥ २२॥
    निमज्जनान्मृतः प्राप सुखं मिहिरजाजलिः ॥ २२॥ सीमन्तिनी हतधवा तव पूजनतः प्रभो ॥ २३॥ सौभाग्यमतुलं प्राप
    सोमवारव्रतात्सुतान् ॥ २३॥ श्रीकराय ददौ देवः स्वीयं पदमनुत्तमम् ॥ २४॥ सुदर्शनमरक्षस्त्वं नृपमण्डलभीतितः
    ॥ २४॥ मेदुरं तारयामास सदारं च घृणानिधिः ॥ २५॥ शारदां विधवां चक्रे सधवां क्रियया भवान् ॥ २५॥ भद्रायुषो
    विपत्तिं च विच्छिद्य त्वमदाः सुखम् ॥ २६॥ सौमिनी भवबन्धाद्वै मुक्ताऽभूत्तव सेवनात् ॥ २६॥ विष्णुरुवाच
    । त्वं शम्भो कहरीशाश्च रजस्सत्त्वतमोगुणैः ॥ २७॥ कर्ता पाता तथा हर्ता जनानुग्रहकाङ्क्षया ॥ २७॥ सर्वगर्वापहारी
    च सर्वतेजोविलासकः ॥ २८॥ सर्वविद्यादिगूढश्च सर्वानुग्रहकारकः ॥ २८॥ त्वत्तः सर्वं च त्वं सर्वं त्वयि
    सर्वं गिरीश्वर ॥ २९॥ त्राहि त्राहि पुनस्त्राहि कृपां कुरु ममोपरि ॥ २९॥ अथास्मिन्नन्तरे ब्रह्मा प्रणिपत्य
    कृताञ्जलिः ॥ ३०॥ एवं त्ववसरं प्राप्य व्यज्ञापयत शूलिने ॥ ३०॥ ब्रह्मोवाच । जय देव महादेव प्रणतार्तिविभञ्जन
    ॥ ३१॥ ईदृशेष्वपराधेषु कोऽन्यस्त्वत्तः प्रसीदति ॥ ३१॥ लब्धमानो भविष्यन्ति ये पुरा निहिता मृधे ॥ ३२॥
    प्रत्यापत्तिर्न कस्य स्यात्प्रसन्ने परमेश्वरे ॥ ३२॥ यदिदं देवदेवानां कृतमन्तुषु दूषणम् ॥ ३३॥ तदिदं
    भूषणं मन्ये त अङ्गीकारगौरवात् ॥ ३३॥ इति शिवपुराणे वायवीयसंहितायां पूर्वखण्डे त्रयोविंशाध्यायान्तर्गतं
    देवैः कृतं शिवस्तोत्रं समाप्तम् । शिवपुराण । वायवीयसंहिता । पूर्वभाग १ । अध्याय २३
