id: patanjali-yoga-sutras-1-samadhi-pada
category: stotram
name:
  english: Patanjali Yoga Sutras - 1 (Samadhi Pada)
content:
  english: atha samadhipadah | atha yoganushasanam || || yogashcittavritti nirodhah || || tada drashtuh
    svarupe'vasthanam || || vritti sarupyamitaratra || || vrittayah pancatayyah klishta'klishtah || ||
    pramana viparyaya vikalpa nidra smritayah || || pratyakshanumanagamah pramanani || || viparyayo mithyajnanamatadrupa
    pratishtham || || shabdajnananupati vastushunyo vikalpah || || abhava pratyayalambana vrittirnidra
    || || anubhuta vishayasampramoshah smritih || || abhyasa vairagyabhyam tannirodhah || || tatra sthitau
    yatno'bhyasah || || sa tu dirghakala nairantarya satkarasevito dridhabhumih || || drishtanushravika
    vishaya vitrishnasya vashikarasanjna vairagyam || || tatparam purushakhyate || vitarka vicaranandasmitarupanugamat
    samprajnatah || || viramapratyayabhyasapurvah samskarashesho'nyah || || bhavapratyayo videhaprakritilayanam
    || || shraddha virya smriti samadhiprajna purvaka itaresham || || tivrasamveganamasannah || || mridumadhyadhimatratvattato'pi
    visheshah || || ishvarapranidhanadva || || klesha karma vipakashayairaparamrishtah purushavishesha
    ishvarah || || tatra niratishayam sarvajnabijam || || sa eshah purveshamapi guruh kalenanavacchedat
    || || tasya vacakah pranavah || || tajjapastadarthabhavanam || || tatah pratyakcetanadhigamo'pyantarayabhavashca
    || || vyadhi styana samshaya pramadalasyavirati bhranti darshanalabdhabhumikatvanavasthitatvani cittavikshepaste'ntarayah
    || || duhkha daurmanasyangamejayatva shvasaprashvasa vikshepasahabhuvah || || tatpratishedharthamekatattvabhyasah
    || || maitri karuna muditopekshanam sukha duhkha punyapunya vishayanam bhavanatashcittaprasadanam
    || || pracchardana vidharanabhyam va pranasya || || vishayavati va pravrittirutpanna manasah sthiti
    nibandhini || || vishoka va jyotishmati || || vitaraga vishayam va cittam || || svapna nidra jnanalambanam
    va || || yathabhimatadhyanadva || || paramanu parama mahattvanto'sya vashikarah || || kshinavritterabhijatasyeva
    manergrahitrigrahana grahyeshu tatstha tadanjanata samapattih || || tatra shabdartha jnana vikalpaih
    sankirna savitarka samapattih || || smriti parishuddhau svarupa shunyevartha matranirbhasa nirvitarka
    || || etayaiva savicara nirvicara ca sukshmavishaya vyakhyata || || sukshma vishayatvam calingaparyavasanam
    || || ta eva sabijah samadhih || || nirvicara vaisharadye'dhyatmaprasadah || || ritambhara tatra prajna
    || || shrutanumana prajnabhyamanyavishaya vishesharthatvat || || tajjah samskaro'nyasamskara pratibandhi
    || || tasyapi nirodhe sarvanirodhannirbijassamadhih || || iti patanjalayogadarshane samadhipado nama
    prathamah padah |
  devanagari: अथ समाधिपादः । अथ योगानुशासनम् ॥ ॥ योगश्चित्तवृत्ति निरोधः ॥ ॥ तदा द्रष्टुः स्वरूपेऽवस्थानम्
    ॥ ॥ वृत्ति सारूप्यमितरत्र ॥ ॥ वृत्तयः पञ्चतय्यः क्लिष्टाऽक्लिष्टाः ॥ ॥ प्रमाण विपर्यय विकल्प निद्रा
    स्मृतयः ॥ ॥ प्रत्यक्षानुमानागमाः प्रमाणानि ॥ ॥ विपर्ययो मिथ्याज्ञानमतद्रूप प्रतिष्ठम् ॥ ॥ शब्दज्ञानानुपाती
    वस्तुशून्यो विकल्पः ॥ ॥ अभाव प्रत्ययालम्बना वृत्तिर्निद्रा ॥ ॥ अनुभूत विषयासम्प्रमोषः स्मृतिः ॥ ॥
    अभ्यास वैराग्याभ्यां तन्निरोधः ॥ ॥ तत्र स्थितौ यत्नोऽभ्यासः ॥ ॥ स तु दीर्घकाल नैरन्तर्य सत्कारासेवितो
    दृढभूमिः ॥ ॥ दृष्टानुश्रविक विषय वितृष्णस्य वशीकारसञ्ज्ञा वैराग्यम् ॥ ॥ तत्परं पुरुषख्याते ॥ वितर्क
    विचारानन्दास्मितारूपानुगमात् सम्प्रज्ञातः ॥ ॥ विरामप्रत्ययाभ्यासपूर्वः संस्कारशेषोऽन्यः ॥ ॥ भवप्रत्ययो
    विदेहप्रकृतिलयानाम् ॥ ॥ श्रद्धा वीर्य स्मृति समाधिप्रज्ञा पूर्वक इतरेषाम् ॥ ॥ तीव्रसंवेगानामासन्नः
    ॥ ॥ मृदुमध्याधिमात्रत्वात्ततोऽपि विशेषः ॥ ॥ ईश्वरप्रणिधानाद्वा ॥ ॥ क्लेश कर्म विपाकाशयैरपरामृष्टः
    पुरुषविशेष ईश्वरः ॥ ॥ तत्र निरतिशयं सर्वज्ञबीजम् ॥ ॥ स एषः पूर्वेषामपि गुरुः कालेनानवच्छेदात् ॥ ॥
    तस्य वाचकः प्रणवः ॥ ॥ तज्जपस्तदर्थभावनम् ॥ ॥ ततः प्रत्यक्चेतनाधिगमोऽप्यन्तरायाभावश्च ॥ ॥ व्याधि स्त्यान
    संशय प्रमादालस्याविरति भ्रान्ति दर्शनालब्धभूमिकत्वानवस्थितत्वानि चित्तविक्षेपास्तेऽन्तरायाः ॥ ॥ दुःख
    दौर्मनस्याङ्गमेजयत्व श्वासप्रश्वासा विक्षेपसहभुवः ॥ ॥ तत्प्रतिषेधार्थमेकतत्त्वाभ्यासः ॥ ॥ मैत्री करुणा
    मुदितोपेक्षाणां सुख दुःख पुण्यापुण्य विषयाणां भावनातश्चित्तप्रसादनम् ॥ ॥ प्रच्छर्दन विधारणाभ्यां वा
    प्राणस्य ॥ ॥ विषयवती वा प्रवृत्तिरुत्पन्ना मनसः स्थिति निबन्धिनी ॥ ॥ विशोका वा ज्योतिष्मती ॥ ॥ वीतराग
    विषयं वा चित्तम् ॥ ॥ स्वप्न निद्रा ज्ञानालम्बनं वा ॥ ॥ यथाभिमतध्यानाद्वा ॥ ॥ परमाणु परम महत्त्वान्तोऽस्य
    वशीकारः ॥ ॥ क्षीणवृत्तेरभिजातस्येव मणेर्ग्रहीतृग्रहण ग्राह्येषु तत्स्थ तदञ्जनता समापत्तिः ॥ ॥ तत्र
    शब्दार्थ ज्ञान विकल्पैः सङ्कीर्णा सवितर्का समापत्तिः ॥ ॥ स्मृति परिशुद्धौ स्वरूप शून्येवार्थ मात्रनिर्भासा
    निर्वितर्का ॥ ॥ एतयैव सविचारा निर्विचारा च सूक्ष्मविषया व्याख्याता ॥ ॥ सूक्ष्म विषयत्वं चालिङ्गपर्यवसानम्
    ॥ ॥ ता एव सबीजः समाधिः ॥ ॥ निर्विचार वैशाराद्येऽध्यात्मप्रसादः ॥ ॥ ऋतम्भरा तत्र प्रज्ञा ॥ ॥ श्रुतानुमान
    प्रज्ञाभ्यामन्यविषया विशेषार्थत्वात् ॥ ॥ तज्जः संस्कारोऽन्यसंस्कार प्रतिबन्धी ॥ ॥ तस्यापि निरोधे सर्वनिरोधान्निर्बीजस्समाधिः
    ॥ ॥ इति पातञ्जलयोगदर्शने समाधिपादो नाम प्रथमः पादः ।
