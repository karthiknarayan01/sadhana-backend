id: bri
category: upanishad
name:
  english: bri
  devanagari: ब्रि
content:
  english: om na̱ va̱ are pa̱tyuh ka̱maya pa̱tih priyo̱ bhavati atma̱nastu̱ ka̱maya pa̱tih priyo̱ bhavati
    | na̱ va̱ are jaya̱yai ka̱maya jaya̱ priya̱ bhavati atma̱nastu̱ ka̱maya jaya̱ priya̱ bhavati | na̱
    va̱ are putra̱nam ka̱maya putra̱h priya̱ bhavanti atma̱nastu̱ ka̱maya putra̱h priya̱ bhavanti | na̱
    va̱ are vitta̱sya ka̱maya vitta̱m priya̱m bhavati atma̱nastu̱ ka̱maya vitta̱m priya̱m bhavati | na̱
    va̱ are bra̱hmanah ka̱maya bra̱hma priya̱m bhavati atma̱nastu̱ ka̱maya bra̱hma priya̱m bhavati | na̱
    va̱ are kshatra̱sya ka̱maya kshatra̱m priya̱m bhavati atma̱nastu̱ ka̱maya kshatra̱m priya̱m bhavati
    | na̱ va̱ are loka̱nam ka̱maya loka̱h priya̱ bhavanti atma̱nastu̱ ka̱maya loka̱h priya̱ bhavanti |
    na̱ va̱ are deva̱nam ka̱maya deva̱h priya̱ bhavanti atma̱nastu̱ ka̱maya deva̱h priya̱ bhavanti | na̱
    va̱ are bhuta̱nam ka̱maya bhuta̱ni priya̱ni bhavanti atma̱nastu̱ ka̱maya bhuta̱ni priya̱ni bhavanti
    | na̱ va̱ are sa̱rvasya ka̱maya sa̱rvam priya̱m bhavati atma̱nastu̱ ka̱maya sa̱rvam priya̱m bhavati
    | atma̱ va̱ are drashta̱vyah shrota̱vyo manta̱vyo nididhyasita̱vyo | mai̱treyi atma̱no va̱ are da̱rshanena
    shra̱vanena matya̱ vijna̱neneda̱
  devanagari: ॐ न॒ वा॒ अरे प॒त्युः का॒माय प॒तिः प्रियो॒ भवति आत्म॒नस्तु॒ का॒माय प॒तिः प्रियो॒ भवति । न॒
    वा॒ अरे जाया॒यै का॒माय जाया॒ प्रिया॒ भवति आत्म॒नस्तु॒ का॒माय जाया॒ प्रिया॒ भवति । न॒ वा॒ अरे पुत्रा॒णां
    का॒माय पुत्राः॒ प्रिया॒ भवन्ति आत्म॒नस्तु॒ का॒माय पुत्राः॒ प्रिया॒ भवन्ति । न॒ वा॒ अरे वित्त॒स्य का॒माय
    वित्तं॒ प्रियं॒ भवति आत्म॒नस्तु॒ का॒माय वित्तं॒ प्रियं॒ भवति । न॒ वा॒ अरे ब्र॒ह्मणः का॒माय ब्र॒ह्म
    प्रियं॒ भवति आत्म॒नस्तु॒ का॒माय ब्र॒ह्म प्रियं॒ भवति । न॒ वा॒ अरे क्षत्र॒स्य का॒माय क्षत्रं॒ प्रियं॒
    भवति आत्म॒नस्तु॒ का॒माय क्षत्रं॒ प्रियं॒ भवति । न॒ वा॒ अरे लोका॒नां का॒माय लोकाः॒ प्रिया॒ भवन्ति आत्म॒नस्तु॒
    का॒माय लोकाः॒ प्रिया॒ भवन्ति । न॒ वा॒ अरे देवा॒नां का॒माय देवाः॒ प्रिया॒ भवन्ति आत्म॒नस्तु॒ का॒माय
    देवाः॒ प्रिया॒ भवन्ति । न॒ वा॒ अरे भूता॒नां का॒माय भूता॒नि प्रिया॒णि भवन्ति आत्म॒नस्तु॒ का॒माय भूता॒नि
    प्रिया॒णि भवन्ति । न॒ वा॒ अरे स॒र्वस्य का॒माय स॒र्वं प्रियं॒ भवति आत्म॒नस्तु॒ का॒माय स॒र्वं प्रियं॒
    भवति । आत्मा॒ वा॒ अरे द्रष्ट॒व्यः श्रोत॒व्यो मन्त॒व्यो निदिध्यासित॒व्यो । मै॒त्रेयि आत्म॒नो वा॒ अरे
    द॒र्शनेन श्र॒वणेन मत्या॒ विज्ञा॒नेनेद॒
