id: nagapatnibhihkritam2shrikrishnastotram
category: stotram
name:
  english: nagapatnibhihkritam2shrikrishnastotram
  devanagari: नागपत्नीभिःकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: 52|| iti vishnupurane pancamabhage saptamadhyayantargatam nagaratnibhih kritam shrikrishnastotram
    samaptam | vishnupurana | bhaga 5| adhyaya 7
  devanagari: ५२॥ इति विष्णुपुराणे पञ्चमभागे सप्तमाध्यायान्तर्गतं नागरत्नीभिः कृतं श्रीकृष्णस्तोत्रं समाप्तम्
    । विष्णुपुराण । भाग ५। अध्याय ७
