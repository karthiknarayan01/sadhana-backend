    namah | | om kamakarshanarupayai namah | om kamapithanivasinyai namah | om kankinyai namah | om kakinyai
    namah | om kridayai namah | om kutsitayai namah | om kalahapriyayai namah | om kundagolodbhavapranayai
    namah | om kaushikyai namah | om kirtivardhinyai namah | | om kumbhastanyai namah | om katakshayai
    namah | om kavyayai namah | om kokanadapriyayai namah | om kantaravasinyai namah | om kantyai namah
    | om kathinayai namah | om krishnavallabhayai namah | iti kakaradi shri kali ashtottarashatanamavalih
