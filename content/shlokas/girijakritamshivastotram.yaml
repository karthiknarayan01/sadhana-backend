id: girijakritamshivastotram
category: stotram
name:
  english: girijakritamshivastotram
  devanagari: गिरिजाकृतंशिवस्तोत्रम्
content:
  english: girijakritam shivastotram namaste devadevaya mahadevaya mauline | jagaddhatre savitre ca shankaraya
    shivaya ca || 71|| kapardine'jayadaya brahmagarbhaya te namah | hiranyaretase tubhyam nilagrivaya
    te namah || 72|| namo brahmanya devaya sitabhutidharaya ca | pancavaktraya rupaya nirupaya namo namah
    || 73|| sahasrakshaya shubhraya namaste krittivasase | andhakasuramokshaya pashunam pataye namah ||
    74|| vipravahnimukhagraya haraya ca bhavaya ca | shankaraya maheshaya ishvaraya namo namah || 76||
    amurtabrahmarupaya murttanam bhavanaya ca | namah shivaya cograya haraya ca bhavaya ca || 76|| namah
    krishnaya sharvaya tripurantakaharine | aghoraya namaste'stu namaste purushaya te || 77|| sadyojataya
    tubhyam bho vamadevaya te namah | ishanaya namastubhyam pancasyaya kapaline || 78|| virupakshaya bhavaya
    bhaganetranipatine | pushadantanipataya mahayajnanipatine || 79|| mrigavyadhaya dharmaya kalacakraya
    cakrine | mahapurushapujyaya gananam pataye namah || 80|| gangadharaya mridine bhavanipriyakarine
    | jagadanandadatre ca brahmarupaya te namah || 91|| gunatitaya gunine sukshmaya gurave'pi ca | namo
    mahasvarupaya bhasmano janmakarine || 82|| vairagyarupine nityam yogacaryaya vai namah | mayoktamapriyam
    deva smarasamharakaraka || 83|| kshantumarhasi vishvesha shirasa tvam prasadaye | shapanugraha evaisha
    kritaste vai na samshayah || 84|| mamaparadhajo manyurna karyo bhavata'nagha | evam prasaditah shambhurhrishtatma
    tridashaih saha || 85|| tirnavrataparanandanirbharah praha tamumam | ya imam matstutim bhaktya pathishyati
    tavodgatam | tasya ceshtaviyogashca na bhavishyati parvati || 86|| janmatrayadhanairyuktah sarvavyadhivivarjitah
    | bhuktveha vividhanbhoganante yasyati matpuram || 87|| ityuktva tam mahesho'pi svamangam pradadau
    tatah | vaishnavam vamabhagam sa pratijagraha parvati || 88|| iti shriskandapurane nagarakhande caturipancashattamadhika
  devanagari: गिरिजाकृतं शिवस्तोत्रम् नमस्ते देवदेवाय महादेवाय मौलिने । जगद्धात्रे सवित्रे च शङ्कराय शिवाय
    च ॥ ७१॥ कपर्दिनेऽजयादाय ब्रह्मगर्भाय ते नमः । हिरण्यरेतसे तुभ्यं नीलग्रीवाय ते नमः ॥ ७२॥ नमो ब्रह्मण्य
    देवाय सितभूतिधराय च । पञ्चवक्त्राय रूपाय नीरूपाय नमो नमः ॥ ७३॥ सहस्राक्षाय शुभ्राय नमस्ते कृत्तिवाससे
    । अन्धकासुरमोक्षाय पशूनां पतये नमः ॥ ७४॥ विप्रवह्निमुखाग्राय हराय च भवाय च । शङ्कराय महेशाय ईश्वराय
    नमो नमः ॥ ७६॥ अमूर्तब्रह्मरूपाय मूर्त्तानां भावनाय च । नमः शिवाय चोग्राय हराय च भवाय च ॥ ७६॥ नमः कृष्णाय
    शर्वाय त्रिपुरान्तकहारिणे । अघोराय नमस्तेऽस्तु नमस्ते पुरुषाय ते ॥ ७७॥ सद्योजाताय तुभ्यं भो वामदेवाय
    ते नमः । ईशानाय नमस्तुभ्यं पञ्चास्याय कपालिने ॥ ७८॥ विरूपाक्षाय भावाय भगनेत्रनिपातिने । पूषदन्तनिपाताय
    महायज्ञनिपातिने ॥ ७९॥ मृगव्याधाय धर्माय कालचक्राय चक्रिणे । महापुरुषपूज्याय गणानां पतये नमः ॥ ८०॥
    गङ्गाधराय मृडिने भवानीप्रियकारिणे । जगदानन्ददात्रे च ब्रह्मरूपाय ते नमः ॥ ९१॥ गुणातीताय गुणिने सूक्ष्माय
    गुरवेऽपि च । नमो महास्वरूपाय भस्मनो जन्मकारिणे ॥ ८२॥ वैराग्यरूपिणे नित्यं योगाचार्याय वै नमः । मयोक्तमप्रियं
    देव स्मरसंहारकारक ॥ ८३॥ क्षन्तुमर्हसि विश्वेश शिरसा त्वां प्रसादये । शापानुग्रह एवैष कृतस्ते वै न
    संशयः ॥ ८४॥ ममापराधजो मन्युर्न कार्यो भवताऽनघ । एवं प्रसादितः शम्भुर्हृष्टात्मा त्रिदशैः सह ॥ ८५॥
    तीर्णव्रतपरानन्दनिर्भरः प्राह तामुमाम् । य इमां मत्स्तुतिं भक्त्या पठिष्यति तवोद्गताम् । तस्य चेष्टवियोगश्च
    न भविष्यति पार्वति ॥ ८६॥ जन्मत्रयधनैर्युक्तः सर्वव्याधिविवर्जितः । भुक्त्वेह विविधान्भोगानन्ते यास्यति
    मत्पुरम् ॥ ८७॥ इत्युक्त्वा तां महेशोऽपि स्वमङ्गं प्रददौ ततः । वैष्णवं वामभागं सा प्रतिजग्राह पार्वती
    ॥ ८८॥ इति श्रीस्कन्दपुराणे नागरखण्डे चतुऋपञ्चाशत्तमाधिक
