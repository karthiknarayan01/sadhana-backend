id: narayaniyam-dashaka-99
category: stotram
name:
  english: Narayaniyam Dashaka 99
content:
  english: vishnorviryani ko va kathayatu dharaneh kashca renunmimite yasyaivanghritrayena trijagadabhimitam
    modate purnasampat yosau vishvani dhatte priyamiha paramam dhama tasyabhiyayam tvadbhakta yatra madyantyamritarasamarandasya
    yatra pravahah || || adyayasheshakartre pratinimishanavinaya bhartre vibhute rbhaktatma vishnave yah
    pradishati haviradini yajnarcanadau | krishnadyam janma yo va mahadiha mahato varnayetso'yameva pritah
    purno yashobhistvaritamabhisaret prapyamante padam te || || he stotarah kavindrastamiha khalu yatha
    cetayadhve tathaiva vyaktam vedasya saram pranuvata jananopattalilakathabhih | janantashcasya namanyakhilasukhakaraniti
    sankirtayadhvam he vishno kirtanadyaistava khalu mahatastattvabodham bhajeyam || || vishnoh karmani
    sampashyata manasi sada yaih sa dharmanabadhnad yanindrasyaisha bhrityah priyasakha iva ca vyatanot
    kshemakari | vikshante yogasiddhah parapadamanisham yasya samyakprakasham viprendra jagarukah kritabahunutayo
    yacca nirbhasayante || || no jato jayamano'pi ca samadhigatastvanmahimno'vasanam deva shreyamsi vidvan
    pratimuhurapi te nama shamsami vishno | tam tvam samstaumi nanavidhanutivacanairasya lokatrayasya
    pyurdhvam vibhrajamane viracitavasatim tatra vaikunthaloke || || apah srishtyadijanyah prathamamayi
    vibho garbhadeshe dadhustvam yatra tvayyeva jiva jalashayana hare sangata aikyamapan | tasyajasya
    prabho te vinihitamabhavat padmamekam hi nabhau dikpatram yat kilahuh kanakadharanibhrit karnikam
    lokarupam || || he loka vishnuretadbhuvanamajanayattanna janitha yuyam yushmakam hyantarastham kimapi
    tadaparam vidyate vishnurupam | niharaprakhyamayaparivritamanaso mohita namarupaih pranaprityekatriptashcaratha
    makhapara hanta neccha mukunde || || murdhnamakshnam padanam vahasi khalu sahasrani sampurya vishvam
    tatprotkramyapi tishthan parimitavivare bhasi cittantare'pi | bhutam bhavyam ca sarvam parapurusha
    bhavan kinca dehendriyadi shvavishto'pyudgatatvadamritasukharasam canubhunkshe tvameva || || yattu
    trailokyarupam dadhadapi ca tato nirgato'nantashuddha jnanatma vartase tvam tava khalu mahima so'pi
    tavan kimanyat | stokaste bhaga evakhilabhuvanataya drishyate tryamshakalpam bhuyishtham sandramodatmakamupari
    tato bhati tasmai namaste || || avyaktam te svarupam duradhigamatamam tattu shuddhaikasattvam vyaktam
    capyetadeva sphutamamritarasambhodhikallolatulyam | sarvotkrishtamabhishtam tadiha gunarasenaiva cittam
    harantim murtim te samshraye'ham pavanapurapate pahi mam krishna rogat ||
  devanagari: विष्णोर्वीर्याणि को वा कथयतु धरणेः कश्च रेणून्मिमीते यस्यैवाङ्घ्रित्रयेण त्रिजगदभिमितं मोदते
    पूर्णसम्पत् योसौ विश्वानि धत्ते प्रियमिह परमं धाम तस्याभियायां त्वद्भक्ता यत्र माद्यन्त्यमृतरसमरन्दस्य
    यत्र प्रवाहः ॥ ॥ आद्यायाशेषकर्त्रे प्रतिनिमिषनवीनाय भर्त्रे विभूते र्भक्तात्मा विष्णवे यः प्रदिशति
    हविरादीनि यज्ञार्चनादौ । कृष्णाद्यं जन्म यो वा महदिह महतो वर्णयेत्सोऽयमेव प्रीतः पूर्णो यशोभिस्त्वरितमभिसरेत्
    प्राप्यमन्ते पदं ते ॥ ॥ हे स्तोतारः कवीन्द्रास्तमिह खलु यथा चेतयध्वे तथैव व्यक्तं वेदस्य सारं प्रणुवत
    जननोपात्तलीलाकथाभिः । जानन्तश्चास्य नामान्यखिलसुखकराणीति सङ्कीर्तयध्वं हे विष्णो कीर्तनाद्यैस्तव खलु
    महतस्तत्त्वबोधं भजेयम् ॥ ॥ विष्णोः कर्माणि सम्पश्यत मनसि सदा यैः स धर्मानबध्नाद् यानीन्द्रस्यैष भृत्यः
    प्रियसख इव च व्यातनोत् क्षेमकारी । वीक्षन्ते योगसिद्धाः परपदमनिशं यस्य सम्यक्प्रकाशं विप्रेन्द्रा
    जागरूकाः कृतबहुनुतयो यच्च निर्भासयन्ते ॥ ॥ नो जातो जायमानोऽपि च समधिगतस्त्वन्महिम्नोऽवसानं देव श्रेयांसि
    विद्वान् प्रतिमुहुरपि ते नाम शंसामि विष्णो । तं त्वां संस्तौमि नानाविधनुतिवचनैरस्य लोकत्रयस्या प्यूर्ध्वं
    विभ्राजमाने विरचितवसतिं तत्र वैकुण्ठलोके ॥ ॥ आपः सृष्ट्यादिजन्याः प्रथममयि विभो गर्भदेशे दधुस्त्वां
    यत्र त्वय्येव जीवा जलशयन हरे सङ्गता ऐक्यमापन् । तस्याजस्य प्रभो ते विनिहितमभवत् पद्ममेकं हि नाभौ दिक्पत्रं
    यत् किलाहुः कनकधरणिभृत् कर्णिकं लोकरूपम् ॥ ॥ हे लोका विष्णुरेतद्भुवनमजनयत्तन्न जानीथ यूयं युष्माकं
    ह्यन्तरस्थं किमपि तदपरं विद्यते विष्णुरूपम् । नीहारप्रख्यमायापरिवृतमनसो मोहिता नामरूपैः प्राणप्रीत्येकतृप्ताश्चरथ
    मखपरा हन्त नेच्छा मुकुन्दे ॥ ॥ मूर्ध्नामक्ष्णां पदानां वहसि खलु सहस्राणि सम्पूर्य विश्वं तत्प्रोत्क्रम्यापि
    तिष्ठन् परिमितविवरे भासि चित्तान्तरेऽपि । भूतं भव्यं च सर्वं परपुरुष भवान् किञ्च देहेन्द्रियादि ष्वाविष्टोऽप्युद्गतत्वादमृतसुखरसं
    चानुभुङ्क्षे त्वमेव ॥ ॥ यत्तु त्रैलोक्यरूपं दधदपि च ततो निर्गतोऽनन्तशुद्ध ज्ञानात्मा वर्तसे त्वं तव
    खलु महिमा सोऽपि तावान् किमन्यत् । स्तोकस्ते भाग एवाखिलभुवनतया दृश्यते त्र्यंशकल्पं भूयिष्ठं सान्द्रमोदात्मकमुपरि
    ततो भाति तस्मै नमस्ते ॥ ॥ अव्यक्तं ते स्वरूपं दुरधिगमतमं तत्तु शुद्धैकसत्त्वं व्यक्तं चाप्येतदेव स्फुटममृतरसाम्भोधिकल्लोलतुल्यम्
    । सर्वोत्कृष्टामभीष्टां तदिह गुणरसेनैव चित्तं हरन्तीं मूर्तिं ते संश्रयेऽहं पवनपुरपते पाहि मां कृष्ण
    रोगात् ॥
