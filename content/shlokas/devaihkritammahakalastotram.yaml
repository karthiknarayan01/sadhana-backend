id: devaihkritammahakalastotram
category: stotram
name:
  english: devaihkritammahakalastotram
  devanagari: देवैःकृतंमहाकालस्तोत्रम्
content:
  english: mahakalavane prapta yatraste lingamuttamam | tushtuvuh paraya bhaktya drishtva devam manoramam
    || 24|| namaste'stu maheshaya namo'nantaya maline | namastaijasamurttaya namah saundaryashaline ||
    25|| namo yogaya vedaya namah pingajataya te | anantajnanadehaya nama ishvaramurttaye || 26|| namah
    shubhrattahasaya namaste'stu shikhandine | shankaraya namaste'stu namaste'stu pinakine || 27|| namo'ntakaya
    bhavyaya tryambakayastu te namah | namaste bahurupaya namaste'cintyamurttaye || 28|| namo yogashariraya
    namaste sarva sarvada | nashtam deva jagatsarvamanavrishtya prapiditam || 29|| suvrishtya devadevesha
    pahi nah sharanagatan || iti shriskandapurane avantyakhande caturashitilingamahatmye trayovimshadhyayantargatam
    devaih kritam mahakalastotram samaptam | skandapurana | avantyakhanda | caturashitikhanda | adhyaya
    23
  devanagari: महाकालवने प्राप्ता यत्रास्ते लिङ्गमुत्तमम् । तुष्टुवुः परया भक्त्या दृष्ट्वा देवं मनोरमम्
    ॥ २४॥ नमस्तेऽस्तु महेशाय नमोऽनन्ताय मालिने । नमस्तैजसमूर्त्ताय नमः सौन्दर्यशालिने ॥ २५॥ नमो योगाय
    वेदाय नमः पिङ्गजटाय ते । अनन्तज्ञानदेहाय नम ईश्वरमूर्त्तये ॥ २६॥ नमः शुभ्राट्टहासाय नमस्तेऽस्तु शिखण्डिने
    । शङ्कराय नमस्तेऽस्तु नमस्तेऽस्तु पिनाकिने ॥ २७॥ नमोऽन्तकाय भव्याय त्र्यम्बकायास्तु ते नमः । नमस्ते
    बहुरूपाय नमस्तेऽचिन्त्यमूर्त्तये ॥ २८॥ नमो योगशरीराय नमस्ते सर्व सर्वदा । नष्टं देव जगत्सर्वमनावृष्ट्या
    प्रपीडितम् ॥ २९॥ सुवृष्ट्या देवदेवेश पाहि नः शरणागतान् ॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे चतुरशीतिलिङ्गमाहात्म्ये
    त्रयोविंशाध्यायान्तर्गतं देवैः कृतं महाकालस्तोत्रं समाप्तम् । स्कन्दपुराण । आवन्त्यखण्ड । चतुरशीतिखण्ड
    । अध्याय २३
