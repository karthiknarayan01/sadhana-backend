id: shivtand-meaning
category: stotram
name:
  english: shivtand meaning
  devanagari: शिव्टाण्ड् मेअनिन्ग्
content:
  english: namami parvatipatim namami jahnavipatim namami bhaktavatsalam namami bhalalocanam | namami
    candrashekharam namami duhkhamocanam tadiyapadapankajam smaramyaham nateshvaram || 16||
  devanagari: नमामि पार्वतीपतिं नमामि जाह्नवीपतिं नमामि भक्तवत्सलं नमामि भाललोचनम् । नमामि चन्द्रशेखरं
    नमामि दुःखमोचनं तदीयपादपङ्कजं स्मराम्यहं नटेश्वरम् ॥ १६॥
meaning: {}
