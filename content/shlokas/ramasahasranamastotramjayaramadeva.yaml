id: ramasahasranamastotramjayaramadeva
category: sahasranama
name:
  english: ramasahasranamastotramjayaramadeva
  devanagari: रामसहस्रनामस्तोत्रम्जयरामदेव
content:
  english: ghanam cintaniyam ca candrakotinibhananam | citrakutapatim vande caitanyam cittakarshanam ||
    58|| viradhavadhakartaram sharabhanga gatipradam | vishveshanayakam vande vishvanatakavaibhavam ||
    59|| sutikshnahridayesham ca premakashavibhakaram | premamurtim param divyam vande premalataphalam
    || 60|| premarnavam paratmanam premaratnaparikshakam | pritikantam param kantam vande pushkaralocanam
    || 61|| agastyanandadataram divyangam devasundaram | kodandamanditam vande bhaktanamartibhanjanam
    || 62|| yogindrajnanadipam ca sakaram nirgunashrayam | murarim mokshadam vande nirliptam diptatejasam
    || 63|| tattvatparam param tattvam dandakaranyapavanam | griddharajapriyam vande dinesham dinavatsalam
    || 64|| sitasukham sukhasinam sumitranandanagrajam | pramodadam pramapunjam vande pancavatisthitam
    || 65|| rupayauvanasampannam rakshasicittamohanam | shuddham sattvannidhim vande nitishastravisharadam
    || 66|| vidusham vedanishnatam purvam karanakaranam | nishkalankam kripalinam vande yuktaphalapradam
    || 67|| anupam shrivaram shuram durgamam diptalocanam | trishirahtrasanam vande khararim dushanarikam
    || 68|| mahadhiram mahaviram priyapremanuranjitam | janakim hridi dharttaram vande mayamaharnavam
    || 69|| anarthanashanam sartham samartham rakshasantakam | prerakam paramacintyam vande pakhandakhandanam
    || 70|| adhokshajam dharadhisham lokalilavicakshanam | mrigayakushalam vande mayamaricamardanam ||
    71|| natyashilam kriyashilam sushilam lokalocanam | karunyakomalam vande vaidehivirahakulam || 72||
    nirvikaram narakaram nirakaram niramayam | nirbhayam nirbharanandam vande nissimavaibhavam || 73||
    nishkriyam nilayam neyam gudham gaurishavanditam | anuttamam mahamargam vande sarvavimohanam || 74||
    rasavantam rasanantam vaidehigunagayakam | dhyanamugdham priyadhinam vande mayamanoharam || 75|| satyasandham
    smaratitam sitanveshanatatparam | maheshvasam mahagopyam vande premaprapuritam || 76|| dayalum ca
    dayamulam bhaktankam karunarnavam | manjumuktipradam vande jatayordhamadayakam || 77|| brihanniyamam
    brahmanyam kabandhavadhapanditam | vande vikramashalinam kridagaram kritagamam || 78|| shabarisharvarinatham
    shabarisnehasincitam | premapushpamilindam ca vande premaphalashinam || 79|| bhaktavasamanavasam bhavam
    bhaktaikasanginam | dasadarshanadataram vande brahmarshidurlabham || 80|| dinesham dinabandhum ca
    dinanatham dayamayam | devarshibodhadataram vande dasanurakshakam || 81|| prakasham paramakasham pampasaundaryadarshakam
    | sugrivasukhadataram vande gambhiradarshanam || 82|| shashvatam shantibhoktaram hrishikesham hridisthitam
    | vijnanavigraham vande vishvakanjavikashakam || 83|| anjaninandananandam nirvikalpam kalabhritam
    | narayanam naram vande nidhanam munirupinam || 84|| sugrivasuhridam sundam suradhisham shishiprabham
    | svalokamavyayalokam vande sarvashaye sthitam || 85|| nirvyalikam pratikam ca saptatalavibhedakam
    | ksheptaram dundubherasthinam vande satyaparakramam || 86|| agadham paramaradhyam balivaranadaranam
    | bhaktapalam jagatpalam vande darpavimardanam || 87|| garvadhnam garimagaram gotitam jnanadayakam
    | gopatim gogatim vande govindam gatisattamam || 88|| taraprabodhakartaram taradhipanibhananam | sugrivarajyadataram
    vande satyabhritam varam || 89|| pravarshane vasantam ca lakshmane tattvabhashinam | bhaktanbhajantamabhrantam
    vande shrismaranakulam || 90|| murtimantanuragam ca parokshe pritipalakam | ekantapreminam vande bhaktaraksharthacintitam
    || 91|| sitanveshanavyagram ca plavagadhipashikshakam | tejassamanvitam vande sarvajnam sarvabodhadam
    || 92|| ashokam shokanirvanam vanaranikadarshakam | mudrikadayinam vande vayuputrabalapradam || 93||
    kamadam kalpanatitam mahakalpam kaladharam | sampatipakshadataram vande sagarataranam || 94|| ashokavanikamadhye
    sitadhyane virajitam | acintyam cintyasaundaryam vande shaktishvaripriyam || 95|| vikramam canjaneyasya
    sambhavam svapnadarshanam | lankeshakleshadataram vande lankavinashanam || 96|| kritajnam hanumatpreshtham
    dantam shantavilocanam | jagatpranam jananandam vande yogindrapavanam || 97|| maharathim mahabahum
    durdarsham daityamardanam | kodandasphalayantam ca vande lankabhayankaram || 98|| keshavanditapadabjam
    kapinam nrityadarshakam | kapinam nayananandam vande saulabhyasundaram || 99|| sarvasrishtisrijantam
    ca srishtikananamalinam | kaushaleshakumaram ca vande diptakalevaram || 100|| akaranakripagaram sharanyam
    pranapalakam | vibhishanasya vishramam vande lankapradayakam || 101|| sindhushoshanashilam ca sindhudarpavimardanam
    | nirmalam nirmamam vande sagarenabhivanditam || 102|| sagare setukartaram sarvayuddhavisharadam |
    sarvadevadhidevam ca vande shankarasamstutam || 103|| suvelashikhararudham sugrivena sushobhitam |
    saumitrisevitam vande vayuputrena satkritam || 104|| dhanvinam lokajetaram sitadarshanakankshinam
    | bhayaya bhayadam vande bhaktamohandhabhanjanam || 105|| amoghastram bhavavasam bhaktavakparipalakam
    | ikshvakunandanam vande rakshasanikanashanam || 106|| durjayam dushkramam durgam durdharsham sudurasadam
    | mahadivyam mahadityam vande yuddhabhayankaram || 107|| kumbhakarnanihantaram jatamukutamanditam
    | durdharam daityakalam ca vande daityanikandanam || 108|| lankeshasya kritantam ca lankeshashirakrintanam
    | lankadhvamsakaram vande bhimam shastrabhritam varam || 109|| raghavesham rathasinam rakshasaghaughanashanam
    | divyayudhadharam vande nirdvandvam khalakhandanam || 110|| ghanarupam ghananandam ghanashyamam ghanadyutim
    | ghanalokam ghanacchandam vande ghorartinashanam || 111|| dashagrivanihantaram mayankam mayayadbhutam
    | anadinidhanam dhanyam vande ravanadaranam || 112|| kalakalam mahakalam kalatitam kalanidhim | kaivalyanilayam
    vande shrikantam sharngadharinam || 113|| anantam gunagambhiram svacchandam garvasudanam | sahasavadanam
    daivam vande devanamaskritam || 114|| jnananandam ciranandam purnanandam mahaplavam | mokshatirtham
    mahatirtham vande ravanataranam || 115|| daityanamantakam vande daityantahkaranapriyam | sudarshanam
    sudhahasam devesham nityasundaram || 116|| rsvatantram svatantram ca sitapritiparikshakam | sitavratam
    sadadhinam vande sitasushobhitam || 117|| kalpavriksham kalamulam sarvalokamanoharam | hanumaddhridayahladam
    vande gandharvavanditam || 118|| vibhishanabhishektaram kapikautukadarshakam | bhaktya grahyam sadananyam
    vande lilavinodinam || 119|| vratino bharatabhraturdarshanotsukamanasam | pushpake bhrajamanam ca
    vande durlabhadarshanam || 120|| padmanamam sumeghamam nirajabham nirankusham | hanumatpreshakam vande
    munindranandasagaram || 121|| aprameyam munidhyeyam sattvastham simhagaminam | tumalam sankulam vande
    vismayotphullalocanam || 122|| vimodam vimadam vedam kandam candramivoditam | vashishthayanamantam
    ca vande dharmashikhamanim || 123|| tapomayam tapomurtim tapasvibhratridarshakam | tamoharam trikavasam
    vande premashrulocanam || 124|| sarojasakumaram ca sarvamatrabhilalitam | prinayantam sakhinvande
    sarvamatyaprajapriyam || 125|| cakravartisudhakirtim cakravartinripeshvaram | ayodhyadhipatim vande
    rajyasimhasane sthitam || 126|| ramaniyam rasasaktam kishorikantiranjitam | sha
  devanagari: घनं चिन्तनीयं च चन्द्रकोटिनिभाननम् । चित्रकूटपतिं वन्दे चैतन्यं चित्तकर्षणम् ॥ ५८॥ विराधवधकर्तारं
    शरभङ्ग गतिप्रदम् । विश्वेशनायकं वन्दे विश्वनाटकवैभवम् ॥ ५९॥ सुतीक्ष्णहृदयेशं च प्रेमाकाशविभाकरम् ।
    प्रेममूर्तिं परं दिव्यं वन्दे प्रेमलताफलम् ॥ ६०॥ प्रेमार्णवं परात्मानं प्रेमरत्नपरीक्षकम् । प्रीतिकान्तं
    परं कान्तं वन्दे पुष्करलोचनम् ॥ ६१॥ अगस्त्यानन्ददातारं दिव्याङ्गं देवसुन्दरम् । कोदण्डमण्डितं वन्दे
    भक्तानामार्तिभञ्जनम् ॥ ६२॥ योगीन्द्रज्ञानदीपं च साकारं निर्गुणाश्रयम् । मुरारिं मोक्षदं वन्दे निर्लिप्तं
    दीप्ततेजसम् ॥ ६३॥ तत्त्वात्परं परं तत्त्वं दण्डकारण्यपावनम् । गृद्धराजप्रियं वन्दे दीनेशं दीनवत्सलम्
    ॥ ६४॥ सीतासुखं सुखासीनं सुमित्रानन्दनाग्रजम् । प्रमोददं प्रमापुञ्जं वन्दे पञ्चवटीस्थितम् ॥ ६५॥ रूपयौवनसम्पन्नं
    राक्षसीचित्तमोहनम् । शुद्धं सत्त्वन्निधिं वन्दे नीतिशास्त्रविशारदम् ॥ ६६॥ विदुषं वेदनिष्णातं पूर्वं
    कारणकारणम् । निष्कलङ्कं कृपालीनं वन्दे युक्तफलप्रदम् ॥ ६७॥ अनूपं श्रीवरं शूरं दुर्गमं दीप्तलोचनम्
    । त्रिशिरःत्रासनं वन्दे खरारिं दूषणारिकम् ॥ ६८॥ महाधीरं महावीरं प्रियाप्रेमानुरञ्जितम् । जानकीं हृदि
    धर्त्तारं वन्दे मायामहार्णवम् ॥ ६९॥ अनर्थनाशनं सार्थं समर्थं राक्षसान्तकम् । प्रेरकं परमाचिन्त्यं
    वन्दे पाखण्डखण्डनम् ॥ ७०॥ अधोक्षजं धराधीशं लोकलीलाविचक्षणम् । मृगयाकुशलं वन्दे मायामारीचमर्दनम् ॥
    ७१॥ नाट्यशीलं क्रियाशीलं सुशीलं लोकलोचनम् । कारुण्यकोमलं वन्दे वैदेहीविरहाकुलम् ॥ ७२॥ निर्विकारं नराकारं
    निराकारं निरामयम् । निर्भयं निर्भरानन्दं वन्दे निस्सीमवैभवम् ॥ ७३॥ निष्क्रियं निलयं नेयं गूढं गौरीशवन्दितम्
    । अनुत्तमं महामार्गं वन्दे सर्वविमोहनम् ॥ ७४॥ रसवन्तं रसानन्तं वैदेहीगुणगायकम् । ध्यानमुग्धं प्रियाधीनं
    वन्दे मायामनोहरम् ॥ ७५॥ सत्यसन्धं स्मरातीतं सीतान्वेषणतत्परम् । महेष्वासं महागोप्यं वन्दे प्रेमप्रपूरितम्
    ॥ ७६॥ दयालुं च दयामूलं भक्ताङ्कं करुणार्णवम् । मञ्जुमुक्तिप्रदं वन्दे जटायोर्धामदायकम् ॥ ७७॥ बृहन्नियमं
    ब्रह्मण्यं कबन्धवधपण्डितम् । वन्दे विक्रमशालीनं क्रीडागारं कृतागमम् ॥ ७८॥ शबरीशर्वरीनाथं शबरीस्नेहसिञ्चितम्
    । प्रेमपुष्पमिलिन्दं च वन्दे प्रेमफलाशिनम् ॥ ७९॥ भक्तावासमनावासं भावं भक्तैकसङ्गिनम् । दासदर्शनदातारं
    वन्दे ब्रह्मर्षिदुर्लभम् ॥ ८०॥ दिनेशं दीनबन्धुं च दीननाथं दयामयम् । देवर्षिबोधदातारं वन्दे दासानुरक्षकम्
    ॥ ८१॥ प्रकाशं परमाकाशं पम्पासौन्दर्यदर्शकम् । सुग्रीवसुखदातारं वन्दे गम्भीरदर्शनम् ॥ ८२॥ शाश्वतं शान्तिभोक्तारं
    हृषीकेशं हृदिस्थितम् । विज्ञानविग्रहं वन्दे विश्वकञ्जविकाशकम् ॥ ८३॥ अञ्जनीनन्दनानन्दं निर्विकल्पं
    कलाभृतम् । नारायणं नरं वन्दे निधानं मुनिरूपिणम् ॥ ८४॥ सुग्रीवसुहृदं सुन्दं सुराधीशं शिशिप्रभम् । स्वालोकमव्ययालोकं
    वन्दे सर्वाशये स्थितम् ॥ ८५॥ निर्व्यलीकं प्रतीकं च सप्ततालविभेदकम् । क्षेप्तारं दुन्दुभेरस्थीनं वन्दे
    सत्यपराक्रमम् ॥ ८६॥ अगाधं परमाराध्यं बालिवारणदारणम् । भक्तपालं जगत्पालं वन्दे दर्पविमर्दनम् ॥ ८७॥
    गर्वध्नं गरिमागारं गोतीतं ज्ञानदायकम् । गोपतिं गोगतिं वन्दे गोविन्दं गतिसत्तमम् ॥ ८८॥ तारप्रबोधकर्तारं
    ताराधिपनिभाननम् । सुग्रीवराज्यदातारं वन्दे सत्यभृतां वरम् ॥ ८९॥ प्रवर्षणे वसन्तं च लक्ष्मणे तत्त्वभाषिणम्
    । भक्तान्भजन्तमभ्रान्तं वन्दे श्रीस्मरणाकुलम् ॥ ९०॥ मूर्तिमन्तानुरागं च परोक्षे प्रीतिपालकम् । एकान्तप्रेमिणं
    वन्दे भक्तरक्षार्थचिन्तितम् ॥ ९१॥ सीतान्वेषणव्यग्रं च प्लवगाधिपशिक्षकम् । तेजस्समन्वितं वन्दे सर्वज्ञं
    सर्वबोधदम् ॥ ९२॥ अशोकं शोकनिर्वाणं वानरानीकदर्शकम् । मुद्रिकादायिनं वन्दे वायुपुत्रबलप्रदम् ॥ ९३॥
    कामदं कल्पनातीतं महाकल्पं कलाधरम् । सम्पातिपक्षदातारं वन्दे सागरतारणम् ॥ ९४॥ अशोकवनिकामध्ये सीताध्याने
    विराजितम् । अचिन्त्यं चिन्त्यसौन्दर्यं वन्दे शक्तीश्वरीप्रियम् ॥ ९५॥ विक्रमं चाञ्जनेयस्य सम्भवं स्वप्नदर्शनम्
    । लङ्केशक्लेशदातारं वन्दे लङ्काविनाशनम् ॥ ९६॥ कृतज्ञं हनुमत्प्रेष्ठं दान्तं शान्तविलोचनम् । जगत्प्राणं
    जनानन्दं वन्दे योगीन्द्रपावनम् ॥ ९७॥ महारथिं महाबाहुं दुर्दर्शं दैत्यमर्दनम् । कोदण्डस्फालयन्तं च
    वन्दे लङ्काभयङ्करम् ॥ ९८॥ केशवन्दितपादाब्जं कपीनां नृत्यदर्शकम् । कपीनां नयनानन्दं वन्दे सौलभ्यसुन्दरम्
    ॥ ९९॥ सर्वसृष्टिसृजन्तं च सृष्टिकाननमालिनम् । कौशलेशकुमारं च वन्दे दीप्तकलेवरम् ॥ १००॥ अकारणकृपागारं
    शरण्यं प्रणपालकम् । विभीषणस्य विश्रामं वन्दे लङ्काप्रदायकम् ॥ १०१॥ सिन्धुशोषणशीलं च सिन्धुदर्पविमर्दनम्
    । निर्मलं निर्ममं वन्दे सागरेणाभिवन्दितम् ॥ १०२॥ सागरे सेतुकर्तारं सर्वयुद्धविशारदम् । सर्वदेवाधिदेवं
    च वन्दे शङ्करसंस्तुतम् ॥ १०३॥ सुवेलशिखरारूढं सुग्रीवेण सुशोभितम् । सौमित्रिसेवितं वन्दे वायुपुत्रेण
    सत्कृतम् ॥ १०४॥ धन्विनं लोकजेतारं सीतादर्शनकाङ्क्षिणम् । भयाय भयदं वन्दे भक्तमोहान्धभञ्जनम् ॥ १०५॥
    अमोघास्त्रं भवावासं भक्तवाक्परिपालकम् । इक्ष्वाकुनन्दनं वन्दे राक्षसानीकनाशनम् ॥ १०६॥ दुर्जयं दुष्क्रमं
    दुर्गं दुर्धर्षं सुदुरासदम् । महादिव्यं महादित्यं वन्दे युद्धभयङ्करम् ॥ १०७॥ कुम्भकर्णनिहन्तारं जटामुकुटमण्डितम्
    । दुर्धरं दैत्यकालं च वन्दे दैत्यनिकन्दनम् ॥ १०८॥ लङ्केशस्य कृतान्तं च लङ्केशशिरकृन्तनम् । लङ्काध्वंसकरं
    वन्दे भीमं शस्त्रभृतां वरम् ॥ १०९॥ राघवेशं रथासीनं राक्षसाघौघनाशनम् । दिव्यायुधधरं वन्दे निर्द्वन्द्वं
    खलखण्डनम् ॥ ११०॥ घनरूपं घनानन्दं घनश्यामं घनद्युतिम् । घनालोकं घनच्छन्दं वन्दे घोरार्तिनाशनम् ॥ १११॥
    दशग्रीवनिहन्तारं मायाङ्कं माययाद्भुतम् । अनादिनिधनं धन्यं वन्दे रावणदारणम् ॥ ११२॥ कालकालं महाकालं
    कालातीतं कलानिधिम् । कैवल्यनिलयं वन्दे श्रीकान्तं शार्ङ्गधारिणम् ॥ ११३॥ अनन्तं गुणगम्भीरं स्वच्छन्दं
    गर्वसूदनम् । सहासवदनं दैवं वन्दे देवनमस्कृतम् ॥ ११४॥ ज्ञानानन्दं चिरानन्दं पूर्णानन्दं महाप्लवम् ।
    मोक्षतीर्थं महातीर्थं वन्दे रावणतारणम् ॥ ११५॥ दैत्यानामन्तकं वन्दे दैत्यान्तःकरणप्रियम् । सुदर्शनं
    सुधाहासं देवेशं नित्यसुन्दरम् ॥ ११६॥ र्स्वतन्त्रं स्वतन्त्रं च सीताप्रीतिपरीक्षकम् । सीताव्रतं सदाधीनं
    वन्दे सीतासुशोभितम् ॥ ११७॥ कल्पवृक्षं कलामूलं सर्वलोकमनोहरम् । हनुमद्धृदयाह्लादं वन्दे गन्धर्ववन्दितम्
    ॥ ११८॥ विभीषणाभिषेक्तारं कपिकौतुकदर्शकम् । भक्त्या ग्राह्यं सदानन्यं वन्दे लीलाविनोदिनम् ॥ ११९॥ व्रतिनो
    भरतभ्रातुर्दर्शनोत्सुकमानसम् । पुष्पके भ्राजमानं च वन्दे दुर्लभदर्शनम् ॥ १२०॥ पद्मनामं सुमेघामं नीरजाभं
    निरङ्कुशम् । हनुमत्प्रेषकं वन्दे मुनीन्द्रानन्दसागरम् ॥ १२१॥ अप्रमेयं मुनिध्येयं सत्त्वस्थं सिंहगामिनम्
    । तुमलं सङ्कुलं वन्दे विस्मयोत्फुल्ललोचनम् ॥ १२२॥ विमोदं विमदं वेदं कन्दं चन्द्रमिवोदितम् । वशिष्ठायनमन्तं
    च वन्दे धर्मशिखामणिम् ॥ १२३॥ तपोमयं तपोमूर्तिं तपस्विभ्रातृदर्शकम् । तमोहरं त्रिकावासं वन्दे प्रेमाश्रुलोचनम्
    ॥ १२४॥ सरोजसकुमारं च सर्वमात्रभिलालितम् । प्रीणयन्तं सखीन्वन्दे सर्वामात्यप्रजाप्रियम् ॥ १२५॥ चक्रवर्तिसुधाकीर्तिं
    चक्रवर्तिनृपेश्वरम् । अयोध्याधिपतिं वन्दे राज्यसिंहासने स्थितम् ॥ १२६॥ रमणीयं रसासक्तं किशोरीकान्तिरञ्जितम्
    । श
