id: nilasarasvatistotra
category: stotram
name:
  english: nilasarasvatistotra
  devanagari: नीलसरस्वतीस्तोत्र
content:
  english: indradidivishad vrinda tare taradhinathasye trahi mam sharanagatam || 8|| || atha phalashrutih
    || ashtamyam ca caturdashyam navamyam yah pathennarah | caikacetasah shanmasaih siddhimapnoti na'tra
    karya vicarana || 1|| moksharthi labhate moksham dhanarthi dhanamapnuyat | vidyarthi labhate vidyam
    tarkavyakaranadikam || 2|| idam stotram pathedyastu satatam shraddhayanvitah | sadhanam labhate narah
    | tasya shatruh kshayam yati mahaprajna ca jayate || 3|| pidayam vapi sangrame japye dane tatha bhaye
    | ya idam pathati stotram shubham tasya na samshayah || 4|| stotrenanena deveshi stutva devim sureshvarim
    | sarvakamamavapnoti sarvavidyanidhirbhavet || 5|| sarvan kamanavapnoti iti te kathitam divyam stotram
    sarasvatapradam | asmatparataram nasti stotram tantre maheshvari || 6|| || iti brihannilatantre dvitiyapatale
    tarininilasarasvatistotram samaptam ||
  devanagari: इन्द्रादिदिविषद् वृन्द तारे ताराधिनाथास्ये त्राहि मां शरणागतम् ॥ ८॥ ॥ अथ फलश्रुतिः ॥ अष्टम्यां
    च चतुर्दश्यां नवम्यां यः पठेन्नरः । चैकचेतसः षण्मासैः सिद्धिमाप्नोति नाऽत्र कार्या विचारणा ॥ १॥ मोक्षार्थी
    लभते मोक्षं धनार्थी धनमाप्नुयात् । विद्यार्थी लभते विद्यां तर्कव्याकरणादिकाम् ॥ २॥ इदं स्तोत्रं पठेद्यस्तु
    सततं श्रद्धयान्वितः । सधनं लभते नरः । तस्य शत्रुः क्षयं याति महाप्रज्ञा च जायते ॥ ३॥ पीडायां वापि
    सङ्ग्रामे जप्ये दाने तथा भये । य इदं पठति स्तोत्रं शुभं तस्य न संशयः ॥ ४॥ स्तोत्रेणानेन देवेशि स्तुत्वा
    देवीं सुरेश्वरीम् । सर्वकाममवाप्नोति सर्वविद्यानिधिर्भवेत् ॥ ५॥ सर्वान् कामानवाप्नोति इति ते कथितं
    दिव्यं स्तोत्रं सारस्वतप्रदम् । अस्मात्परतरं नास्ति स्तोत्रं तन्त्रे महेश्वरी ॥ ६॥ ॥ इति बृहन्निलतन्त्रे
    द्वितीयपटले तारिणीनीलसरस्वतीस्तोत्रं समाप्तम् ॥
