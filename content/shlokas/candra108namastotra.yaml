id: candra108namastotra
category: stotram
name:
  english: candra108namastotra
  devanagari: चन्द्र१०८नामस्तोत्र
content:
  english: om shra~ shrim shraum sah candraya namah || shriman shashadharashcandro taradhisho nishakarah
    | sudhanidhih sadaradhyah satpatih sadhupujitah || 1|| jitendriyo jagadyonih jyotishcakrapravartakah
    | vikartananujo viro vishvesho vidushampatih || 2|| doshakaro dushtadurah pushtiman shishtapalakah
    | ashtamurtipriyo'nanta kashtadarukutharakah || 3|| svaprakashah prakashatma dyucaro devabhojanah
    | kaḻadharah kalahetuh kamakritkamadayakah || 4|| mrityusamharako'martyo nityanushthanadayakah | kshapakarah
    kshinapapah kshayavriddhisamanvitah || 5|| jaivatrikah shuci shubhro jayi jayaphalapradah | sudhamayassurasvami
    bhaktanamishtadayakah || 6|| bhuktido muktido bhadro bhaktadaridryabhanjakah |
  devanagari: ॐ श्राँ श्रीं श्रौं सः चन्द्राय नमः ॥ श्रीमान् शशधरश्चन्द्रो ताराधीशो निशाकरः । सुधानिधिः
    सदाराध्यः सत्पतिः साधुपूजितः ॥ १॥ जितेन्द्रियो जगद्योनिः ज्योतिश्चक्रप्रवर्तकः । विकर्तनानुजो वीरो
    विश्वेशो विदुषाम्पतिः ॥ २॥ दोषाकरो दुष्टदूरः पुष्टिमान् शिष्टपालकः । अष्टमूर्तिप्रियोऽनन्त कष्टदारुकुठारकः
    ॥ ३॥ स्वप्रकाशः प्रकाशात्मा द्युचरो देवभोजनः । कळाधरः कालहेतुः कामकृत्कामदायकः ॥ ४॥ मृत्युसंहारकोऽमर्त्यो
    नित्यानुष्ठानदायकः । क्षपाकरः क्षीणपापः क्षयवृद्धिसमन्वितः ॥ ५॥ जैवातृकः शुची शुभ्रो जयी जयफलप्रदः
    । सुधामयस्सुरस्वामी भक्तानामिष्टदायकः ॥ ६॥ भुक्तिदो मुक्तिदो भद्रो भक्तदारिद्र्यभञ्जकः ।
