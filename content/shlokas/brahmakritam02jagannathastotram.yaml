id: brahmakritam02jagannathastotram
category: stotram
name:
  english: brahmakritam02jagannathastotram
  devanagari: ब्रह्मकृतं०२जगन्नाथस्तोत्रम्
content:
  english: brahmakritam 2 jagannathastotram uparyupari santanavrishtishutpatitasu ca | jaya krishna jagannatha
    jaya sarva'ghanashana || 86|| jaya liladarutano jaya vanchaphalaprada | jaya samsarasammagnaliloddhara
    jayavyaya || 87|| jayanukampapathodhe jaya dinaparayana | jayacyuta jayananta jayeshana namo'stu te
    || 88|| iti shriskandapurane vaishnavakhande purushottamajagannathamahatmye saptavimshadhyayantargatam
    brahmakritam jagannathastotram samaptam | skandapurana | vaishnavakhanda | purushottamakhanda | adhyaya
    27
  devanagari: ब्रह्मकृतं २ जगन्नाथस्तोत्रम् उपर्युपरि सन्तानवृष्टिषूत्पतितासु च । जय कृष्ण जगन्नाथ जय
    सर्वाऽघनाशन ॥ ८६॥ जय लीलादारुतनो जय वाञ्छाफलप्रद । जय संसारसम्मग्नलीलोद्धार जयाव्यय ॥ ८७॥ जयानुकम्पापाथोधे
    जय दीनपरायण । जयाच्युत जयानन्त जयेशान नमोऽस्तु ते ॥ ८८॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे पुरुषोत्तमजगन्नाथमाहात्म्ये
    सप्तविंशाध्यायान्तर्गतं ब्रह्मकृतं जगन्नाथस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । पुरुषोत्तमखण्ड
    । अध्याय २७
meaning: {}
