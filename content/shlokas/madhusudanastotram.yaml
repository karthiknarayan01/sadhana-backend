id: madhusudanastotram
category: stotram
name:
  english: madhusudanastotram
  devanagari: मधुसूदनस्तोत्रम्
content:
  english: shrimadhusudanastotram sharanam bhava karunam mayi kuru dinadayalo karunarasavarunalaya karirajakripalo
    | adhuna khalu vidhina mayi sudhiya suraphalitam madhusudana madhusudana hara mamakaduritam || 1||
    ghrinimandalamanikundalagamandapashayana animadisugunabhushana manimandapasadana | vinatasutaghanavahana
    munimanasabhavana madhusudana madhusudana hara mamakaduritam || 2|| karanupuradhara sundara karashobhitavalaya
    surabhusurabhayavaraka dharanidhara kripaya | tvaraya hara bhavamishvara suravanditavirya madhusudana
    madhusudana hara mamakaduritam || 3|| harishikara
  devanagari: श्रीमधुसूदनस्तोत्रम् शरणं भव करुणां मयि कुरु दीनदयालो करुणारसवरुणालय करिराजकृपालो । अधुना
    खलु विधिना मयि सुधिया सुरफलितं मधुसूदन मधुसूदन हर मामकदुरितम् ॥ १॥ घृणिमण्डलमणिकुण्डलगमण्डपशयन अणिमादिसुगुणभूषण
    मणिमण्डपसदन । विनतासुतघनवाहन मुनिमानसभवन मधुसूदन मधुसूदन हर मामकदुरितम् ॥ २॥ करनूपुरधर सुन्दर करशोभितवलय
    सुरभूसुरभयवारक धरणीधर कृपया । त्वरया हर भवमीश्वर सुरवन्दितवीर्य मधुसूदन मधुसूदन हर मामकदुरितम् ॥ ३॥
    हरिशीकर
