id: kyta-6-pitrumedha-mantrah-krishna-yajurveda-taittiriya-aranyaka-patha-pareyuvamsam-pravatah
category: stotram
name:
  english: KYTA 6 Pitrumedha Mantrah - Krishna Yajurveda Taittiriya Aranyaka Patha - Pareyuvamsam Pravatah
content:
  english: krishna yajurvediya taittiriya aranyake shashthah prapathakah shri gurubhyo namah | harih om
    || anuvakam mpravato mahiranu bahubhyah panthamanapaspashanam | vaivasvatagm sangamana njananam ~yamagm
    rajanagm havisha duvasyata || ida nnvagannapaitaduha yadihabibhah pura | ishtapurtamanu sampashya
    dakshinam ~yatha te datta mbahudha vi bandhushu || imau yunajmi te vahni asunithaya vodhave m ~yamasya
    sadanagm sukrita ncapi gacchatat || pusha tvetashcyavayatu pravidva rbhuvanasya gopah | sa tvaitebhyah
    paridada 'gnirdevebhyah suvidatre bhyah || pushema asha anuveda sarva sso asmagm abhayatamena neshat
    | svastida aghrini 'prayucchanpura etu pravidvan || rvishvayuh paripasati tva pusha tva patu prapathe
    purasta t | yatrasate sukrito yatra te yayustatra tva deva ssavita dadhatu || bhuvanasya pata idagm
    havih || agnaye rayimate svaha || purushasya sayavaryapedaghani mrijmahe | yatha no atra naparah pura
    jarasa ayati || purushasya sayavari vi te pranamasi srasam | sharirena mahimihi svadhayehi pitrinupa
    prajaya 'smanihavaha || maiva mmagsta priye ndevi sati pitrilokam ~yadaishi | vishvavara nabhasa sam
    vya~yantyubhau no lokau payasa nnari patilokam ~vrinana nipadyata upa tva martya preta mpuranamanu
    palayanti tasyai shva naryabhi jivalokamitasumetamupashesha ehi | hastagrabhasya didhishostvameta
    tpatyurjanitvamabhi sambabhuva || suvarnagm hastadadadana mritasya shriyai brahmane tejase balaya
    | atraiva tvamiha vayagm susheva vishva sspridho abhimatirjayema || dhanur hastadadadana mritasya
    shriyai kshatrayaujase balaya | atraiva tvamiha vayagm susheva vishva sspridho abhimatirjayema | manigm
    hastadadadana mritasya shriyai vishe pushtyai balaya | atraiva tvamiha vayagm susheva vishva sspridho
    abhimatirjayema || hvarah priyo devanamuta somyana m | esha yashcamaso devapanastasmi ndeva amrita
    madayantam || agnervarma pari gobhirvyayasva samprornushva medasa pivasa ca | nettva dhrishnur paryankhayatai
    || mainamagne vidaho ma ncikshipo ma shariram | yada shrita tpitribhyah || shritam ~yada karasi jatavedo
    tpitribhyah | yada gacchatyasunitimetamatha devana m ~vashanirbhavati || surya rgacchatu vatamatma
    dya nca dharmana | apo va gaccha yadi tatra te hitamoshadhishu pratitishtha shariraih || ajo bhagastapasa
    ta nte shocistapatu ta nte arcih | yaste shivastanuvo jatavedastabhi rvahemagm sukritam ~yatra lokah
    || ayam ~vai tvamasmadadhi tvametadayam ~vai tadasya yonirasi | vaishvanarah putrah pitre lokakri
    jjatavedo vahemagm sukritam ~yatra lokah || ya etasya patho goptarastebhya ssvaha ya etasya patho
    rakshitarastebhya ssvaha ya etasya patho 'bhirakshitarastebhya 'pakhyatre svaha 'bhilalapate svaha
    'gnaye karmakrite svaha yamatra nadhimastasmai svaha thsishvidano murdhanam ~va tatapate tvaya | divo
    vishvasma thsimaghayata urushyah || asmattvamadhi jato mpunah | agnaye vaishvanaraya suvargaya lokaya
    svaha pra ketuna brihata bha rvishvani vrishabho roraviti | divashcidantadupa mamudanadapamupasthe
    mahisho vavardha || idanta eka ntritiyena jyotisha sam ve~shanastanuvai caruredhi priyo devana ||
    nake suparnamupa ya tpatantagm hrida venanto abhyacakshata tva | hiranyapaksham ~varunasya dutam ~yamasya
    yonau shakuna mbhuranyum || atidrava sarameyau shvanau caturakshau shabalau sadhuna patha | atha pitrin
    thsuvidatragm apihi yamena ye sadhamada mmadanti || yau te shvanau yama rakshitarau caturakshau pathirakshi
    nricakshasa | tabhyagm raja vulumbalau yamasya dutau carato vashagm anu | tavasmabhya ndrishaye suryaya
    punarda ttavasumadyeha bhadram || soma eke bhyah pavate ghritameka upasate | yebhyo madhu pradhavati
    tag shcidevapigacchatat || ye yuddhyante pradhaneshu shuraso ye tanutyajah | ye va sahasradakshinastag
    shcidevapigacchatat || tapasa ye anadhrishya stapasa ye suvargatah | tapo ye cakrire maha shcidevapigacchatat
    || ashmanvati revati muttishthata pratarata sakhayah | atra jahama ye asannasheva vayamabhi vajanuttarema
    || || yadvai devasya savituh pavitragm sahasradharam ~vitatamantarikshe | yenapunadindramana mpunami
    || ya rashtra tpannadapa yanti shakha abhimrita nripatimicchamanah | dhatusta ssarvah pavanena putah
    prajaya rayya varcasa sagmsrijatha || udvaya ntamasaspari pashyanto jyotiruttaram | deva ndevatra
    suryamaganma jyotiruttamam || dhata punatu savita punatu | agnestejasa suryasya varcasa || nte agnimamanthama
    vrishabhayeva paktave | ima ntagm shamayamasi kshirena codakena ca || yantvamagne samadahastvamu nirvapaya
    punah | kyamburatra jayata mpakadurva vyalkasha || shitike shitikavati hladuke hladukavati | mandukya
    susangamayemagg svagnigm shamaya || sha shshamu te santvanukyah nte samudriya apa shshamu te santu
    var stanuve shamu te santu kupyah || ava srija punaragne pitribhyo yasta ahutashcarati svadhabhih
    | ayurvasana upa yatu sheshagm sangacchata ntanuva jatavedah || sangacchasva pitribhi ssamishtapurtena
    parame vyomann | yatra bhumyai vrinase tatra gaccha tatra tva deva ssavita dadhatu || yatte krishna
    shshakuna atutoda pipila ssarpa uta va shvapadah | agnishta nkrinotu somashca yo bra hmanamavivesha
    || uttishthata stanuvagm sambharasva meha gatramavaha ma shariram | yatra bhumyai vrinase tatra gaccha
    tatra tva deva ssavita dadhatu || ida ntritiyena jyotisha sam stanuvai caruredhi priyo devana || uttishtha
    prehi pradravaukah krinushva parame vyomann | yamena tvam ~yamya sam nnakamadhi rohemam || ashmanvati
    revati ssagm rabhaddhva muttishthata pratarata sakhayah | atra jahama ye asannasheva shshivan vayamabhi
    vajanuttarema || yadvai devasya savituh pavitragm sahasradharam ~vitatamantarikshe | yenapunadindramanarta
    mpunami || ya rashtra tpannadapa yanti shakha abhimrita nripatimicchamanah | dhatusta ssarvah pavanena
    putah prajaya rayya varcasa sagmsrijatha || ya rashtra tpannadapa yanti shakha abhimrita nripatimicchamanah
    | dhatusta ssarvah pavanena putah prajaya rayya varcasa sagmsrijatha || dhata punatu savita punatu
    | agnestejasa suryasya varcasa || asmattvamadhi jato ntvadadhijayatam | agnaye vaishvanaraya suvargaya
    lokaya svaha ryamo haveha prayatabhirakta | asidatagm suprayateha barhishyurjaya jatyai mama shatruhatyai
    || yame iva yatamane yadaita nmanusha devayantah | asidatagg svamu lokam ~vidane svasasthe bhavatamindave
    nah || yamaya somagm sunuta yamaya juhuta havih | yamagm ha yajno gacchatyagniduto arankritah || yamaya
    ghritavaddhavirjuhota pra ca tishthata | sa no deveshvayama ddirghamayuh pra jivase || yamaya madhumattamagm
    rajne havya nnama rishibhyah purvajebhyah purve bhyah pathikridbhyah || 'sya kaushthya jagatah parthivasyaika
    idvashi | yama mbhangyashravo gaya yo raja ngaya bhangyashravo yo raja 'naparoddhyah | yenapo nadyo
    dhanvani yena dyauh prithivi dridha || hiranyakakshyan nayashshaphan | ashva nanashyato danam ~yamo
    raja 'bhitishthati || yamo dadhara prithivim njagat | yamaya sarvamitrasthe ya dvayurakshitam || yatha
    panca yatha shad yatha panca dashar shayah | yamam ~yo vidyathsa bruyadyathaika rishirvijanate ||
    || trikadrukebhih patati shadurvi dbrihat | gayatri trishtupchandagmsi sarva ta yama ahita || aharaharnayamano
    gamashva njagat | vaivasvato na tripyati pancabhirmanavairyamah || vaivasvate vivicyante yame rajani
    te janah | ye ceha satyenecchante ya u canritavadinah || te rajanniha vivicyante 'tha yanti tvamupa
    | devag shca ye namasyanti brahmanag shcapacityati || yasmin vrikshe supalashe devai ssapimbate yamah
    | atra no vishpatih pita purana anuvenati || vaishvanare havirida muthsagm shatadharametam | tasminnesha
    pitara tpinvamane || draphsashcaskanda prithivimanu dyamimanca yonimanu yashca purvah | tritiyam ~yonimanu
    sancaranta njuhomyanu sapta hotrah || imagm samudragm shatadharamuthsam ~vyacyamana njanayagne ma
    higmsih parame vyomann || apeta vita vi ca sarpatato ye 'tra stha purana ye ca nutanah | ahobhiradbhi
    rvyaktam ~yamo dada tvavasanamasmai || savitaitani sharirani prithivyai maturupastha adadhe | tebhi
    nkrishatu langalam | shunam ~varatra baddhyantagm shuna mudingaya shunasira shunamasmasu dhattam ||
    shunasiravimam ~vacam ~ya ddivi cakrathuh payah | tenema mupasincatam || site vandamahe tva 'rvaci
    subhage bhava | yatha na ssubhaga sasi yatha na ssuphala sasi || savitaitani sharirani prithivyai
    maturupastha adadhe | tebhiradite sha mbhava || vimucyaddhva maghniya devayana atarishma tamasasparamasya
    | jyotirapama suvaraganma || || pra vata vanti patayanti vidyuta udoshadhirjihate pinvate suvah |
    ira vishvasmai bhuvanaya jayate ya tparjanyah prithivigm retasa 'vati || yatha yamaya harmya npancamanavah
    | evam ~vapami harmyam ~yatha 'sama jivaloke bhurayah || citah stha paricita urdhvacitah shrayaddhva
    ssadayatu taya devataya || a pyayasva samètu te vishvatah soma vrishniyam | bhava vajasya sangathe
    || sa nte payagmsi samu yantu vaja nyabhimatishahah | apyayamano amritaya soma divi shravagsyuttamani
    dhishva || utte tabhnomi prithivi ntvatparimam ~loka nnidadhanmo ahagm risham | etag mpitaro dharayantu
    te ssadanatte minotu || upasarpa matara mprithivigm susheva m | urnamrada yuvati rdakshinavatyesha
    tva patu nir || ucchmancasva prithivi ma vibadhitha 'smai bhava supavancana | mata putram ~yatha sica
    mbhumi vrinu || ucchmancamana prithivi hi tishthasi sahasrammita upa hi shrayantam | te grihaso madhushcuto
    vishvaha rdhana harinirarjuni ssantu dhenavah | tilavathsa urjamasmai duhana vishvaha santvanapasphurantih
    || || esha te yamasadane svadha nidhiyate grihe | akshitirnama te asau || ida mpitribhyah prabharema
    barhi rdevebhyo jivanta uttara mbharema | tattvamarohaso meghyo bhavam ~yamena tvam ~yamya sam vi~danah
    || ma tva vrikshau sambadhishta mma mata prithivi tvam | pitrin hi yatra gacchasyedhasam ~yamarajye
    || ma tva vrikshau sambadhetha mma mata prithivi mahi | vaivasvatagm hi gacchasi yamarajye virajasi
    || nala nnalaplavo bhutva santara pratarottara || || savitaitani sharirani prithivyai maturupastha
    adadhe | tebhyah prithivi sha mbhava || shaddhota surya rgacchatu vatamatma dya nca dharmana | apo
    va gaccha yadi tatra te hitamoshadhishu pratitishtha shariraih || para mmrityo anu parehi pantham
    ~yaste sva itaro devayana t | cakshushmate shrinvate te bravimi ma nah prajagm ririsho mota viran
    || sham ~vata shshamu te santvoshadhih | kalpanta mme dishah shagmah || prithivyastva loke sadayamyamushya
    sharmasi pitaro devata | prajapatistva sadayatu taya devataya || antarikshasya tva divastva disha
    ntva nakasya tva prishthe braddhnasya tva vishtape sadayamyamushya sharmasi pitaro devata | prajapatistva
    sadayatu taya devataya || nghritavagshcarureha sidatuttabhnuva ndyamutopari | yonikritah pathikritah
    saparyata ye devana nghritabhaga iha stha | esha te yamasadane svadha nidhiyate grihe kshara tagm
    rakshasva ta nte pari dadami tasya | prajapatistva sadayatu taya devataya || apupava shcarureha sidatuttabhnuvan
    ndyamutopari | yonikritah pathikritah saparyata ye devanagm shritabhagah kshirabhaga dadhibhaga madhubhaga
    iha stha | esha te yamasadane svadha nidhiyate grihe 'sau | shatakshara sahasra 'cyutakshara tagm
    rakshasva ta nte paridadami tasya | prajapatistva sadayatu taya devataya || karomi yaste dhanah parikiramyatra
    | taste yamah pitribhih sam 'tra dhenuh kamadughah karotu || tvamarjunaushadhina brahmana idviduh
    | tasa ntva maddhyadadade carubhyo apidhatave || durvanag stambamaharaita 'nu vi rohatu || kashanag
    stambamahara rakshasamapahatyai | ya etasyai dishah parabhavannaghayavo yatha te nabhava npunah ||
    darbhanag stambamahara pitrinamoshadhi mpriyam | anvasyai mula njivadanu kandamatho phala mprinatho
    sida shiva tvam | indragni tva brihaspatirasmin yonavasishadann || ta asya sudadohasa ssomagg shrinanti
    prishnayah | janma vi~shastrishva rocane divah || sham ~vata shshamu te santvoshadhih | kalpanta 'paramartimarama
    kancana | tatha tadashvibhya mmitrena varunena ca || varano varayadida ndevo vanaspatih | artyai nir
    cca vanaspatih || vidhritirasi vidharayasmadagha dveshagmsi shami shamayasmadagha dveshagmsi yava
    yavayasmadagha dveshagmsi || prithivi ngaccha disho gaccha suvargaccha suvargaccha disho gaccha diva
    ngacchapo va gaccha yadi tatra te hitamoshadhishu pratitishtha shariraih || loka mprinatho sida shiva
    tvam | indragni tva brihaspatirasmin yonavasishadann || ta asya sudadohasa ssomagg shrinanti prishnayah
    | janma vi~shastrishva rocane divah || ashmanvati revati ssagm rabhaddhva muttishthata pratarata sakhayah
    | atra jahama ye asannasheva shshivan vayamabhi vajanuttarema || yadvai devasya savituh pavitragm
    sahasradharam ~vitatamantarikshe | yenapunadindramanarta mpunami || dhata ya rashtra tpannadapa yanti
    shakha abhimrita nripatimicchamanah | dhatusta ssarvah pavanena putah prajaya rayya varcasa sagmsrijatha
    || ngrinana anupurvam ~yatamana yatishta | iha tvashta sujanima suratno dirghamayuh karatu jivase
    vah || yatha mbhavanti yathartava ritubhi ryanti klriptah | yatha na purvamaparo jaha tyeva dhatarayugmshi
    kalpayaisham || na hi te agne tanuvai ncakara martyah | kapi mpunarjarayu gauriva | apa na shshoshucadaghamagne
    shushuddhya rayim | apa na manvarabhamahe svastaye | sa na indra iva devebhyo vahnih sapamrano bhava
    || || ime jiva vimritairavava nno adya | pranjo 'gama nritaye hasaya draghiya ayuh pratara ndadhanah
    || mrityoh padam ~yopayanto yadaima draghiya ayuh pratara ndadhanah | apyayamanah prajaya dhanena
    shuddhah puta bhavatha yajniyasah || ima ndadhami ma no nu gadaparo ardhametam | shata njivantu sharadah
    purucistiro mrityu ndadmahe parvatena || ima nariravidhava ssupatniranjanena sarpisha sammrishantam
    | anashravo anamiva ssusheva arohantu janayo yonimagre njatagm himavataspari | tenamritasya mulenarati
    rjambhayamasi || yatha tva thsyoshadhe prithivya adhi | evamima udbhindantu kirtya yashasa brahmavarcasena
    || ajo 'syajasmadagha dveshagmsi yavo 'si yavayasmadagha dveshagmsi || jambhayamasi trini ca shshoshucadaghamagne
    shushuddhya rayim | apa na shshoshucadagham || sukshetriya sugatuya vasuya ca yajamahe | apa na shshoshucadagham
    || pra ya mprasmakasashca surayah | apa na shshoshucadagham || prayadagne ssahasvato vishvato yanti
    surayah | apa na shshoshucadagham || prayatte agne surayo jayemahi pra te vayam | apa na || tvagm
    hi vishvatomukha vishvatah paribhurasi | apa na shshoshucadagham || dvisho no vishvatomukhati naveva
    paraya | apa na shshoshucadagham || sa na shshoshucadagham || apah pravanadiva yati thsyandatamagham
    | apa na shshoshucadagham || udvana thsyandatamagham | apa na shshoshucadagham || anandaya pramodaya
    punaragag svangrihan | apa na shshoshucadagham || na vai tatra pramiyate gaurashvah purushah pashuh
    | yatreda mbrahma kriyate paridhirjivanaya kamapa na mpariniyamanam | andhena ya tamasa pravrita nnarishtyai
    || mayaita mbhriyamana devi sati pitrilokam ~yadaishi | vishvavara nabhasa sam vya~yantyubhau no lokau
    payasa ''vrinihi || rayishthamagni mmadhumantamurminamurjah santa ntva payasopa sagmsadema | sagm
    rayya samu varcasa sacasva na || ye jiva ye ca mrita ye jata ye ca jantyah | tebhyo ghritasya dharayitu
    mmadhudhara vyundati || mata rudrana nduhita vasunag svasa mritasya nabhih | pranuvoca ncikitushe
    janaya ma gamanagamaditim ~vadhishta || pibatudaka nbhuvanasyabhyava vrithsva jo bhago 'yam ~vai catushcatvarigmshat
    | ya etasya tva tpanca | praketunedante nake suparnam ~yau te ye yuddhyante tapasa ssagmrabhaddhvamashtavigmshatih
    | ya nte yatta uttishthata idanta uttishtha prehyashman mpancavigmshatih | ayatu trigmshat | vaishvanare
    tasmi ndraphsa imamapetahobhi ryujyantamaghniya adite param ~va a pyayasva saptavigmshatih | utte
    grihe 'khashitistebhyah prithivya antarikshasya dvatrigmshat | apupavanasau dasha shata dasha | etaste
    te disha ssarva idamashman vigmshatih | orohata tanuvai ncakara punarmrityave ma no nu ga ddadmaha
    ima narih pari trayovigmshatih | apa na ssukshetriya pra yadbha ndishthah pra yadagneh pra yatte agne
    tvagm hi dvisha ssindhumapah pravanadu dvanadanandaya na vai tatra yatreda ncaturvigmshatih | apashyamavrinihi
    dvadasha dvadasha | tvetaste saptavigmshatih || harih om || || krishna yajurvediya taittiriya aranyake
    shashthah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय आरण्यके षष्ठः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ अनुवाकं
    म्प्र॒वतो॑ म॒हीरनु॑ ब॒हुभ्यः॒ पन्था॑मनपस्पशा॒नम् । वै॒व॒स्व॒तग्ं स॒ङ्गम॑न॒ ञ्जना॑नाम् ँय॒मग्ं राजा॑नग्ं
    ह॒विषा॑ दुवस्यत ॥ इ॒द न्न्वाग॒न्नपै॒तदू॑ह॒ यदि॒हाबि॑भः पु॒रा । इ॒ष्टा॒पू॒र्तमनु॒ सम्प॑श्य॒ दक्षि॑णा॒म्
    ँयथा॑ ते द॒त्त म्ब॑हु॒धा वि ब॑न्धुषु ॥ इ॒मौ यु॑नज्मि ते व॒ह्नी असु॑नीथाय वो॒ढवे म् ँय॒मस्य॒ साद॑नग्ं
    सु॒कृता॒ ञ्चापि॑ गच्छतात् ॥ पू॒षा त्वे॒तश्च्या॑वयतु॒ प्रवि॒द्वा र्भुव॑नस्य गो॒पाः । स त्वै॒तेभ्यः॒
    परि॑ददा ऽग्निर्दे॒वेभ्यः॑ सुवि॒दत्रे भ्यः ॥ पू॒षेमा आशा॒ अनु॑वेद॒ सर्वा॒ स्सो अ॒स्माग्ं अभ॑यतमेन नेषत्
    । स्व॒स्ति॒दा अघृ॑णि॒ ऽप्र॑युच्छन्पु॒र ए॑तु॒ प्रवि॒द्वान् ॥ र्वि॒श्वायुः॒ परि॑पासति त्वा पू॒षा त्वा॑
    पातु॒ प्रप॑थे पु॒रस्ता त् । यत्रास॑ते सु॒कृतो॒ यत्र॒ ते य॒युस्तत्र॑ त्वा दे॒व स्स॑वि॒ता द॑धातु ॥ भुव॑नस्य
    पत इ॒दग्ं ह॒विः ॥ अ॒ग्नये॑ रयि॒मते॒ स्वाहा ॥ पुरु॑षस्य सयाव॒र्यपेद॒घानि॑ मृज्महे । यथा॑ नो॒ अत्र॒
    नाप॑रः पु॒रा ज॒रस॒ आय॑ति ॥ पुरु॑षस्य सयावरि॒ वि ते प्रा॒णम॑सि स्रसम् । शरी॑रेण म॒हीमिहि॑ स्व॒धयेहि॑
