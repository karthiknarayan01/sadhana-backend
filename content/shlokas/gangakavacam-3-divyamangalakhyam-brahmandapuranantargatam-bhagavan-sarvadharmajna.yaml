id: gangakavacam-3-divyamangalakhyam-brahmandapuranantargatam-bhagavan-sarvadharmajna
category: kavacha
name:
  english: gangakavacam 3 divyamangalakhyam (brahmandapuranantargatam, bhagavan sarvadharmajna)
  devanagari: गङ्गाकवचम् ३ दिव्यमङ्गलाख्यम् (ब्रह्माण्डापुराणान्तर्गतम्, भगवन् सर्वधर्मज्ञ)
content:
  english: gangajalam mama || 25|| krikotikam kalmashaghni skandhayoh suranimnaga | kaurmi patu bhujadvandvam
    panyoh phalakamishvari || 26|| karangulih patu candri nakhanakashacandrika | suryamandalaga patu kaksham
    sagaratarini || 27|| vakshahsthalam patu nityam devi me'lakanandika | hridayam patu cakshumem sita
    patudaram mama || 28|| parshvayoh parvatadrava stanau someshvari tatha | jagaduddharini nabhim prishtam
    makaravahana || 29|| vishnushaktih katim patu sphicau patu dayambudhih | vishnu padabjasambhuta guhyam
    me parirakshatu || 30|| kripakomalagatri sa muladharam mamavatu | svadhishthanam patu nityam papadatha
    davanala || 31|| payanme manipuram sa shantanoh sukhavardhini | anahatam sada payad bhagirathanishevita
    || 32|| vishuddhacakram me patu vashishthopasitambika | ajnacakram mama pritya vishvamitrarcita'vatu
    || 33|| brahmarandhram sada patu sravatpiyushamandiram | svayambhulingini lingam kundali paradevata
    || 34|| patitoddharini patu jatharam shankarapriya | jatalankarini shambhoruruyugmam mamavatu || 35||
    janu mridani me patu janghe patu jagatprasuh | lavanyashevadhih patu gulpho gaganamekhala || 36||
    matsyakakshapahamsalirajita patu padayoh | padamngulih patu nityam nishreni samanohare || 37|| rasasrinmamsamedamsi
    patu me bhavatarini | manobuddhimahantam me patu narayani sada || 38|| ayuh kalyanada patu vayo rakshatu
    vaishnavi | bharyam vriddhikari patu putran vamshakari mama || 39|| griham rakshatu lakshmi mem patu
    kshetram shivapriya | dharmakartri yashah patu dharmam patu manahsvini || 40|| kulam kuleshi me patu
    sadgatim patu sadgatih | jale sthale'nale'ranye patale ranasankate || 41|| durge grihe jagannatha
    patu sarvanadishvari | agratah patu gangordhvam patu ganga ca parshvayoh || 42|| gangaiva prishthatah
    patu tathadhah patu me vapuh | itidam kavacam divyam gangayah paramadbhutam || 43|| rishayah kathitam
    sakshanmahapatakanashanam | ekakalam dvikalam va trikalam yah sada pathet || 44|| gangayah shravayedvapi
    tasya papam pranashyati | vardhante sampadah sarvah sampadyante manorathah || 45|| jayate siddhayo'shtau
    ca nashyanti vipadah kshanat | kushthat pramucyate kushthi vyadhibhyashcapi mucyate || 46|| nirmalam
    syanmanastasya vishuddham sphatikopamam | yasya yasya ca devasya kriyate pujanam japah || 47|| tasya
    tasya prasadam sa gangadevi prayacchati | patakanamanekanam prayashcittam cikirshuna || 48|| pathaniyam
    tu gangayah kavacam patakapaham | gangamahatmyavinmantri ganga
  devanagari: गङ्गाजलं मम ॥ २५॥ कृकोटिकां कल्मषघ्नी स्कन्धयोः सुरनिम्नगा । कौर्मी पातु भुजद्वन्द्वं पाण्योः
    फलकमीश्वरी ॥ २६॥ कराङ्गुलीः पातु चान्द्री नखानाकाशचन्द्रिका । सूर्यमण्डलगा पातु कक्षां सागरतारिणी
    ॥ २७॥ वक्षःस्थलं पातु नित्यं देवी मेऽलकनन्दिका । हृदयं पातु चक्षुमें सीता पातूदरं मम ॥ २८॥ पार्श्वयोः
    पर्वतद्रावा स्तनौ सोमेश्वरी तथा । जगदुद्धारिणी नाभिं पृष्टं मकरवाहना ॥ २९॥ विष्णुशक्तिः कटिं पातु
    स्फिचौ पातु दयाम्बुधिः । विष्णु पादाब्जसम्भूता गुह्यं मे परिरक्षतु ॥ ३०॥ कृपाकोमलगात्री सा मूलाधारं
    ममावतु । स्वाधिष्ठानं पातु नित्यं पापादथ दवानला ॥ ३१॥ पायान्मे मणिपूरं सा शान्तनोः सुखवर्धिनी । अनाहतं
    सदा पायाद् भगीरथनिषेविता ॥ ३२॥ विशुद्धचक्रं मे पातु वशिष्ठोपासिताम्बिका । आज्ञाचक्रं मम प्रीत्या विश्वामित्रार्चिताऽवतु
    ॥ ३३॥ ब्रह्मरन्ध्रं सदा पातु स्रवत्पीयूषमन्दिरम् । स्वयम्भूलिङ्गिनी लिङ्गं कुण्डली परदेवता ॥ ३४॥ पतितोद्धारिणी
    पातु जठरं शङ्करप्रिया । जटालङ्कारिणी शम्भोरुरूयुग्मं ममावतु ॥ ३५॥ जानू मृडानी मे पातु जङ्घे पातु जगत्प्रसूः
    । लावण्यशेवधिः पातु गुल्फो गगनमेखला ॥ ३६॥ मत्स्यकक्षपहंसालिराजिता पातु पादयोः । पादांङ्गुलीः पातु
    नित्यं निश्रेणी समनोहरे ॥ ३७॥ रसासृङ्मांसमेदांसि पातु मे भवतारिणी । मनोबुद्धिमहन्तां मे पातु नारायणी
    सदा ॥ ३८॥ आयुः कल्याणदा पातु वयो रक्षतु वैष्णवी । भार्यां वृद्धिकरी पातु पुत्रान् वंशकरी मम ॥ ३९॥
    गृहं रक्षतु लक्ष्मी में पातु क्षेत्रं शिवप्रिया । धर्मकर्त्री यशः पातु धर्मं पातु मनःस्विनी ॥ ४०॥
    कुलं कुलेशी मे पातु सद्गतिं पातु सद्गतिः । जले स्थलेऽनलेऽरण्ये पाताले रणसङ्कटे ॥ ४१॥ दुर्गे गृहे जगन्नाथा
    पातु सर्वनदीश्वरी । अग्रतः पातु गङ्गोर्ध्वं पातु गङ्गा च पार्श्वयोः ॥ ४२॥ गङ्गैव पृष्ठतः पातु तथाधः
    पातु मे वपुः । इतीदं कवचं दिव्यं गङ्गायाः परमाद्भुतम् ॥ ४३॥ ऋषयः कथितं साक्षान्महापातकनाशनम् । एककालं
    द्विकालं वा त्रिकालं यः सदा पठेत् ॥ ४४॥ गङ्गायाः श्रावयेद्वापि तस्य पापं प्रणश्यति । वर्धन्ते सम्पदः
    सर्वाः सम्पद्यन्ते मनोरथाः ॥ ४५॥ जायते सिद्धयोऽष्टौ च नश्यन्ति विपदः क्षणात् । कुष्ठात् प्रमुच्यते
    कुष्ठी व्याधिभ्यश्चापि मुच्यते ॥ ४६॥ निर्मलं स्यान्मनस्तस्य विशुद्धं स्फटिकोपमम् । यस्य यस्य च देवस्य
    क्रियते पूजनं जपः ॥ ४७॥ तस्य तस्य प्रसादं सा गङ्गादेवी प्रयच्छति । पातकानामनेकानां प्रायश्चित्तं चिकीर्षुणा
    ॥ ४८॥ पठनीयं तु गङ्गायाः कवचं पातकापहम् । गङ्गामाहात्म्यविण्मन्त्री गङ्गा
