id: gururatnatrayastotram
category: stotram
name:
  english: gururatnatrayastotram
  devanagari: गुरुरत्नत्रयस्तोत्रम्
content:
  english: gururatnatrayastotram om namoratnatrayaya | atha buddharatnastotram | trishnajihvamasadvikalpashirasam
    pradveshacancatphalam kamakrodhavitarkadarshanamatho ragapracandekshanam | mohasyam svasharirakotishatacintatigam
    darunam prajnamantrabalena yah shamitavan buddhaya tasmai namah || 1|| buddham prabuddham varadharmarajam
    shantam vishuddham samakirtidam tam | gunakaram sattvamunindrarajam shrimanmahabodhimaham namami ||
    2|| iti buddharatnastotram | atha dharmaratnastotram | yo jatyadikaduhkhataptamahasam cakshuh satam
    praninam yastraidhatukapanjaradaharahah sattvan samakarshati | atranam ca jagatsamuddharati yah sankleshaduhkharnavat
    sambuddhamshca punashcyutacca mahate dharmaya tasmai namah || 3|| ya sarvajnataya nayatyupashamam
    shantaishinah shravakan ya margajnataya jagaddhitakrita lokarthasampadika | sarvakaramidam vadanti
    munayo vishvasya ya sangata tasyai shravakabodhisattvaganino buddhasya matre namah || 4|| iti dharmaratnastotram
    | atha sangharatnastotram | catvarah pratyutpannaga bhavasukhe susvadavidveshina
  devanagari: गुरुरत्नत्रयस्तोत्रम् ॐ नमोरत्नत्रयाय । अथ बुद्धरत्नस्तोत्रम् । तृष्णाजिह्वमसद्विकल्पशिरसं
    प्रद्वेषचञ्चत्फलं कामक्रोधवितर्कदर्शनमथो रागप्रचण्डेक्षणम् । मोहास्यं स्वशरीरकोटिशतचिन्तातिगं दारुणं
    प्रज्ञामन्त्रबलेन यः शमितवान् बुद्धाय तस्मै नमः ॥ १॥ बुद्धं प्रबुद्धं वरधर्मराजं शान्तं विशुद्धं समकीर्तिदं
    तम् । गुणाकरं सत्त्वमुनीन्द्रराजं श्रीमन्महाबोधिमहं नमामि ॥ २॥ इति बुद्धरत्नस्तोत्रम् । अथ धर्मरत्नस्तोत्रम्
    । यो जात्यादिकदुःखतप्तमहसां चक्षुः सतां प्राणिनां यस्त्रैधातुकपञ्जरादहरहः सत्त्वान् समाकर्षति । अत्राणं
    च जगत्समुद्धरति यः सङ्क्लेशदुःखार्णवात् सम्बुद्धांश्च पुनश्च्युताच्च महते धर्माय तस्मै नमः ॥ ३॥ या
    सर्वज्ञतया नयत्युपशमं शान्तैषिणः श्रावकान् या मार्गज्ञतया जगद्धितकृता लोकार्थसम्पादिका । सर्वाकारमिदं
    वदन्ति मुनयो विश्वस्य या सङ्गता तस्यै श्रावकबोधिसत्त्वगणिनो बुद्धस्य मात्रे नमः ॥ ४॥ इति धर्मरत्नस्तोत्रम्
    । अथ सङ्घरत्नस्तोत्रम् । चत्वारः प्रत्युत्पन्नगा भवसुखे सुस्वादविद्वेषिण
meaning: {}
