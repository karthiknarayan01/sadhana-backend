id: devi-6
category: stotram
name:
  english: devi 6
  devanagari: देवी ६
content:
  english: shridevishatkam athava matangishatkam shriganeshaya namah | amba shashibimbavadane kambugrive
    kathorakucakumbhe | ambarasamanamadhye shambararipuvairidevi mam pahi || 1|| kundamukulagradantam
    kunkumapankena liptakucabharam | anilaniladehamambamakhilandanayakim vande || 2|| sarigamapadhanisatantam
    vinasankrantacaruhastam tam | shantam mridulasvantam kucabharatantam namami shivakantam || 3|| aratatataghatikajutitaditatalikapalatatankam
    | vinavadanavelakampitashirasam namami matangim || 4|| vinarasanushangam vikacamadamodamadhuribhringam
    | karunapuritarangam kalaye matangakanyakapangam || 5|| dayamanadirghanayanam deshikarupena darshitabhyudayam
    | vamakucanihitavinam varadam sangita matrikam vande || 6|| manikyavina mupalalayantim madalasam manjulavagvilasam
    | mahendraniladyutikomalangim matangakanyam manasa smarami || 7|| || iti shrikalikapurane devishatkam
    athava matangishatkam samaptam ||
  devanagari: श्रीदेवीषट्कं अथवा मातङ्गीषट्कम् श्रीगणेशाय नमः । अम्ब शशिबिम्बवदने कम्बुग्रीवे कठोरकुचकुम्भे
    । अम्बरसमानमध्ये शम्बररिपुवैरिदेवि मां पाहि ॥ १॥ कुन्दमुकुलाग्रदन्तां कुङ्कुमपङ्केन लिप्तकुचभाराम्
    । आनीलनीलदेहामम्बामखिलाण्डनायकीं वन्दे ॥ २॥ सरिगमपधनिसतान्तां वीणासङ्क्रान्तचारुहस्तां ताम् । शान्तां
    मृदुलस्वान्तां कुचभरतान्तां नमामि शिवकान्ताम् ॥ ३॥ अरटतटघटिकजूटीताडिततालीकपालताटङ्काम् । वीणावादनवेलाकम्पितशिरसं
    नमामि मातङ्गीम् ॥ ४॥ वीणारसानुषङ्गं विकचमदामोदमाधुरीभृङ्गम् । करुणापूरितरङ्गं कलये मातङ्गकन्यकापाङ्गम्
    ॥ ५॥ दयमानदीर्घनयनां देशिकरूपेण दर्शिताभ्युदयाम् । वामकुचनिहितवीणां वरदां सङ्गीत मातृकां वन्दे ॥ ६॥
    माणिक्यवीणा मुपलालयन्तीं मदालसां मञ्जुलवाग्विलासाम् । महेन्द्रनीलद्युतिकोमलाङ्गीं मातङ्गकन्यां मनसा
    स्मरामि ॥ ७॥ ॥ इति श्रीकालिकापुराणे देवीषट्कं अथवा मातङ्गीषट्कं समाप्तम् ॥
