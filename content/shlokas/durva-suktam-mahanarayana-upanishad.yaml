id: durva-suktam-mahanarayana-upanishad
category: stotram
name:
  english: Durva Suktam (Mahanarayana Upanishad)
content:
  english: sahasraparama devi shatamula shatankura | sarvagm haratu me papa ndurva duhsvapna nashani |
    kanda tprarohanti parushah parushah pari | eva no durve pratanu sahasrena shatena ca | ya shatena
    pratanoshi sahasrena virohasi | tasya ste devishtake vidhema havisha vayam | ashvakrante rathakrante
    vishnukra nte vasundhara | shirasa dharayishyami rakshasva ma
  devanagari: स॒ह॒स्र॒पर॑मा दे॒वी॒ श॒तमू॑ला श॒ताङ्कु॑रा । सर्वग्ं॑ हरतु॑ मे पा॒प॒ न्दू॒र्वा दुः॑स्वप्न॒
    नाश॑नी । काण्डा त्प्र॒रोह॑न्ती॒ परु॑षः परुषः॒ परि॑ । ए॒वा नो॑ दूर्वे॒ प्रत॑नु स॒हस्रे॑ण श॒तेन॑ च ।
    या श॒तेन॑ प्रत॒नोषि॑ स॒हस्रे॑ण वि॒रोह॑सि । तस्या स्ते देवीष्टके वि॒धेम॑ ह॒विषा॑ व॒यम् । अश्व॑क्रा॒न्ते
    र॑थक्रा॒न्ते॒ वि॒ष्णुक्रा न्ते व॒सुन्ध॑रा । शिरसा॑ धार॑यिष्या॒मि॒ र॒क्ष॒स्व मा
