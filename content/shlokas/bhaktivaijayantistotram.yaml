id: bhaktivaijayantistotram
category: stotram
name:
  english: bhaktivaijayantistotram
  devanagari: भक्तिवैजयन्तीस्तोत्रम्
content:
  english: duram kevalacitprakashamatulam jnatva shruteh shekhare | vyaktam vistritapundarikanayanam vamshininadapriyam
    vrindaranyavinodavancanaparam samsevyatam muktaye || 7|| ardrantahkaranam gunairbhagavatastyaktanyamargabhramam
    romancairvipulaih samavritatanum harshashrupurnakshanam | anandodayamodamanamanisham shrikrishnanamamritaih
    muktih santanute svayamvaravidhim drishtva svayam vaishnavam || 8|| dhigjihvam pishunasya krittamusalipucchopamam
    vihvalam dustarkopalatadanairbhagavato bhakterdvishanam mrisha | kaivalyagamakartarim kalipatinirmanakale
    turim marmodbhedanasucikam nijahateh samsucikam sucikam || 9|| bhedo'yam yada nama jivaparayoh svabhaviko
    vartate yadvaupadhika eva murtipadaviparyantamatra dhruvah | tatraivam sati sevyasevakabhida siddha
    prasiddha shrutau nishkamo nijamuktaye paramupasiteti vakyaih sphutam || 10|| eke shodashashatpadarthavishayajnanam
    samacakshate kamaiveti vicarayanti katicidyogam ca kecijjaguh | pumso'tha prakriteshca jivaparayorjnanam
    pare menire sarvam klriptamidam gunairbhagavato bhaktih param muktaye || 11|| ya kacit parikalpita
    khalakatha tamagapyajatabhramah pakayatibhayankaraya virasakaraya labdhashramah | nakadhishapateraparaparamanandaptimandakinim
    shakasvadaparah sudhamiva sudha necchanti bhaktim budhah || 12|| kam kah sevata ityudirayati yo'bhede
    sa kankah svayam | ka ka bhaktiritirayanti bahu ye kaka varaka hi te | brahmaham vishame'tra me kritashame
    kim me bhavedishvarah sevyo'saviti samlapannurugalah so'yam khalashchagalah || 13|| svadhyayadhyayane
    tathopanishadam jate'ksharanam grahe vijnate shravane ca jivaparayoraikye vimuktekshanah | shrikrishnam
    bhajamana eva bahudha sankirtanadyaih sada satyam jnanamanantamekamakhilam tadbrahma sampadyate ||
    14|| etaih shodashabhih padarthanicayairjnartairvimuktih katham jalpamstatra phalam parasya vijayah
    syattena kim va tatah | jnanam ceta parameshvarasya tadidam bhaktyarthamevocitam siddhanteshvidamucire
    sphutataram pramanikastarkikah || 15|| dravyadau vidite padarthanivahe kaivalyasiddhih katham paninyadivivecanadiva
    sukham jnata bhavet prakriya | shabdasyapyanumanabhavabhajanam bauddhasya pantha na kim tasmadishamupasitum
    shrutamidam dravyadicintaphalam || 16|| brute shodashashatpadarthakalanat ka va vimuktim shrutih kim
    va samsmaranam puranavacanam nyayo'pi kastadrishah | tarko vedavicaranaya ghatite'nugrahakah kevalam
    tasyai tatpratipakshata yadi tada siddha na kim bauddhata || 17|| bhedo'yam ghatakumbhayoh samucitam
    pratyakshato grihyate shrutya kevalameva jivaparayoh kaivalyamudbhavyate | bhedabhedavivecane prabhavati
    pratyakshayovaspade tasyagocarake katham prasaratu bhrante'pi tulyodayam || 18|| bhedam lokanitam
    vadishyati katham pashcadabhedashrutih bhita lokamiterbhavidhyati punah svarthipacare katham | badham
    laukikamanatah kathamiyam gacchedathapaurushi | yadyesha purashodita sa purushah kim tvadrisho'nyadrishah
    || 19|| yasmin sarvamidam vibhati nihitam yasmat punarjayate yasminneva layam prayati sakalam karmapi
    yatpritaye | sarvam karmaphalam vimuktipadavi yasya prasadadbhavet yacchavasapratima shrutih sa bhagavan
    kaishcit katham neshyate || 20|| droham shriparameshvare viddhate ye laukikaih kalpanaih vedantairupagiyamanacarite
    nyayaishca samsavite | te vyartham pashumaranaikarasikah sanmargasandushakah
  devanagari: दूरं केवलचित्प्रकाशमतुलं ज्ञात्वा श्रुतेः शेखरे । व्यक्तं विस्तृतपुण्डरीकनयनं वंशीनिनादप्रियं
    वृन्दारण्यविनोदवञ्चनपरं संसेव्यतां मुक्तये ॥ ७॥ आर्द्रान्तःकरणं गुणैर्भगवतस्त्यक्तान्यमार्गभ्रमं रोमाञ्चैर्विपुलैः
    समावृततनुं हर्षाश्रुपूर्णक्षणम् । आनन्दोदयमोदमानमनिशं श्रीकृष्णनामामृतैः मुक्तिः सन्तनुते स्वयंवरविधिं
    दृष्ट्वा स्वयं वैष्णवम् ॥ ८॥ धिग्जिह्वां पिशुनस्य कृत्तमुसलीपुच्छोपमं विह्वलां दुस्तर्कोपलताडनैर्भगवतो
    भक्तेर्द्विषाणां मृषा । कैवल्यागमकर्तरीं कलिपटीनिर्माणकाले तुरीं मर्मोद्भेदनसूचिकां निजहतेः संसूचिकां
    सूचिकाम् ॥ ९॥ भेदोऽयं याद नाम जीवपरयोः स्वाभाविको वर्तते यद्वौपाधिक एव मूर्तिपदवीपर्यन्तमत्र ध्रुवः
    । तत्रैवं सति सेव्यसेवकभिदा सिद्धा प्रसिद्धा श्रुतौ निष्कामो निजमुक्तये परमुपासीतेति वाक्यैः स्फुटम्
    ॥ १०॥ एके षोडशषट्पदार्थविषयज्ञानं समाचक्षते कमैवेति विचारयन्ति कतिचिद्योगं च केचिज्जगुः । पुंसोऽथ
    प्रकृतेश्च जीवपरयोर्ज्ञानं परे मेनिरे सर्वं क्लृप्तमिदं गुणैर्भगवतो भक्तिः परं मुक्तये ॥ ११॥ या काचित्
    परिकल्पिता खलकथा तामागप्यजातभ्रमाः पाकायातिभयङ्कराय विरसाकाराय लब्धाश्रमाः । नाकाधीशपतेरपारपरमानन्दाप्तिमन्दाकिनीं
    शाकास्वादपराः सुधामिव सुधा नेच्छन्ति भक्तिं बुधाः ॥ १२॥ कं कः सेवत इत्युदीरयति योऽभेदे स कङ्कः स्वयम्
    । का का भक्तिरितीरयन्ति बहु ये काका वराका हि ते । ब्रह्माहं विषमेऽत्र मे कृतशमे किं मे भवेदीश्वरः
    सेव्योऽसाविति संलपन्नुरुगलः सोऽयं खलश्छागलः ॥ १३॥ स्वाध्यायाध्ययने तथोपनिषदां जातेऽक्षराणां ग्रहे
    विज्ञाते श्रवणे च जीवपरयोरैक्ये विमुक्तेक्षणः । श्रीकृष्णं भजमान एव बहुधा सङ्कीर्तनाद्यैः सदा सत्यं
    ज्ञानमनन्तमेकमखिलं तद्ब्रह्म सम्पद्यते ॥ १४॥ एतैः षोडशभिः पदार्थनिचयैर्ज्ञार्तैर्विमुक्तिः कथं जल्पंस्तत्र
    फलं परस्य विजयः स्यात्तेन किं वा ततः । ज्ञानं चेत परमेश्वरस्य तदिदं भक्त्यर्थमेवोचितं सिद्धान्तेष्विदमूचिरे
    स्फुटतरं प्रामाणिकास्तार्किकाः ॥ १५॥ द्रव्यादौ विदिते पदार्थनिवहे कैवल्यसिद्धिः कथं पाणिन्यादिविवेचनादिव
    सुखं ज्ञाता भवेत् प्रक्रिया । शब्दस्याप्यनुमानभावभजनं बौद्धस्य पन्था न किं तस्मादीशमुपासितुं श्रुतमिदं
    द्रव्यादिचिन्ताफलम् ॥ १६॥ ब्रूते षोडशषट्पदार्थकलनात् का वा विमुक्तिं श्रुतिः किं वा संस्मरणं पुराणवचनं
    न्यायोऽपि कस्तादृशः । तर्को वेदविचारणाय घटितेऽनुग्राहकः केवलं तस्यै तत्प्रतिपक्षता यदि तदा सिद्धा
    न किं बौद्धता ॥ १७॥ भेदोऽयं घटकुम्भयोः समुचितं प्रत्यक्षतो गृह्यते श्रुत्या केवलमेव जीवपरयोः कैवल्यमुद्भाव्यते
    । भेदाभेदविवेचने प्रभवति प्रत्यक्षयोवास्पदे तस्यागोचरके कथं प्रसरतु भ्रान्तेऽपि तुल्योदयम् ॥ १८॥ भेदं
    लोकनितं वदिष्यति कथं पश्चादभेदश्रुतिः भीता लोकमितेर्भविध्यति पुनः स्वार्थीपचारे कथम् । बाधं लौकिकमानतः
    कथमियं गच्छेदथापौरुषी । यद्येषा पुरषोदिता स पुरुषः किं त्वादृशोऽन्यादृशः ॥ १९॥ यस्मिन् सर्वमिदं विभाति
    निहितं यस्मात् पुनर्जायते यस्मिन्नेव लयं प्रयाति सकलं कर्मापि यत्प्रीतये । सर्वं कर्मफलं विमुक्तिपदवी
    यस्य प्रसादाद्भवेत् यच्छवासप्रतिमा श्रुतिः स भगवान् कैश्चित् कथं नेष्यते ॥ २०॥ द्रोहं श्रीपरमेश्वरे
    विद्धते ये लौकिकैः कल्पनैः वेदान्तैरुपगीयमानचरिते न्यायैश्च संसविते । ते व्यर्थं पशुमारणैकरसिकाः सन्मार्गसन्दूषकाः
