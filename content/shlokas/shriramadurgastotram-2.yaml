id: shriramadurgastotram-2
category: kavacha
name:
  english: shriramadurgastotram 2
  devanagari: श्रीरामदुर्गस्तोत्रम् २
content:
  english: shri sitarama prityarthe pathe viniyogah || atha rishyadi nyasah | om vishvamitrarishaye namah
    shirasi | anushtupchandase namah mukhe | shriramo devatayai namah hridi | ram bijaya namah guhye |
    namah shaktaye namah padayoh | ramayeti kilakaya namah nabhau | om hum phat svaha iti digbandhah ||
    atha karanyasah | ram angushthabhyam namah | ram tarjanibhyam namah | mam madhyamabhyam namah | yam
    anamikabhyam namah | nam kanishthikabhyam namah | mah karatalakaraprishthabhyam namah || atha hridayadi
    nyasah | ram hridayaya namah | ram shirase svaha | mam shikhayai vashat | yam kavacaya hum | nam netrabhyam
    vaushat | mah astraya phat | shriramadurgam pathed bhaktya sarvopadrava nashanam || om shriramo rakshenmam
    pracyam rakshedyamyatu lakshmanah | praticyam bharato rakshedudicyam shatrumardanah || 1|| aishanyam
    janaki rakshedagneyam ravinandanah | bibhishanastu nairrityam vayavyam vayunandanah || 2|| urdhvam
    rakshenmahavishnurmadhyam patu nrikeshari | adhastu vamanah patu sarvatah patu keshavah || 3|| sarvada
    kapisenadyah sarvamarkatanayakah | caturdvaram sada raksheccaturbhih kapipungavaih || 4|| shriramakhyam
    mahadurgam vishvamitrakritam shubham | yah smared bhayakale tu sarvashatruvinashanam || 5||
  devanagari: श्री सीताराम प्रीत्यर्थे पाठे विनियोगः ॥ अथ ऋष्यादि न्यासः । ॐ विश्वमित्रऋषये नमः शिरसि
    । अनुष्टुप्छन्दसे नमः मुखे । श्रीरामो देवतायै नमः हृदि । रां बीजाय नमः गुह्ये । नमः शक्तये नमः पादयोः
    । रामायेति कीलकाय नमः नाभौ । ॐ हुं फट् स्वाहा इति दिग्बन्धः ॥ अथ करन्यासः । रां अङ्गुष्ठाभ्यां नमः
    । रां तर्जनीभ्यां नमः । मां मध्यमाभ्यां नमः । यं अनामिकाभ्यां नमः । नं कनिष्ठिकाभ्यां नमः । मः करतलकरपृष्ठाभ्यां
    नमः ॥ अथ हृदयादि न्यासः । रां हृदयाय नमः । रां शिरसे स्वाहा । मां शिखायै वषट् । यं कवचाय हुं । नं
    नेत्राभ्यां वौषट् । मः अस्त्राय फट् । श्रीरामदुर्गं पठेद् भक्त्या सर्वोपद्रव नाशनम् ॥ ॐ श्रीरामो रक्षेन्मां
    प्राच्यां रक्षेद्याम्यातु लक्ष्मणः । प्रतीच्यां भरतो रक्षेदुदीच्यां शत्रुमर्दनः ॥ १॥ ऐशान्यां जानकी
    रक्षेदाग्नेयां रविनन्दनः । बिभीषणस्तु नैरृत्यां वायव्यां वायुनन्दनः ॥ २॥ ऊर्ध्वं रक्षेन्महाविष्णुर्मध्यं
    पातु नृकेशरी । अधस्तु वामनः पातु सर्वतः पातु केशवः ॥ ३॥ सर्वदा कपिसेनाद्याः सर्वमर्कटनायकाः । चतुर्द्वारं
    सदा रक्षेच्चतुर्भिः कपिपुङ्गवैः ॥ ४॥ श्रीरामाख्यं महादुर्गं विश्वामित्रकृतं शुभम् । यः स्मरेद् भयकाले
    तु सर्वशत्रुविनाशनम् ॥ ५॥
