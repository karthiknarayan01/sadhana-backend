id: annamayya-keerthanas-deva-devam-bhaje
category: stotram
name:
  english: Annamayya Keerthanas Deva Devam Bhaje
content:
  english: adi pallavi deva devam bhaje divyaprabhavam | ravanasuravairi ranapungavam || rajavarashekharam
    ravikulasudhakaram ajanubahu nilabhrakayam | rajari kodanda raja dikshagurum rajivalocanam ramacandram
    || deva devam bhaje divyaprabhavam nilajimuta sannibhashariram ghana vishalavaksham vimala jalajanabham
    | talahinagaharam dharmasamsthapanam bhulalanadhipam bhogishayanam || deva devam bhaje divyaprabhavam
    pankajasanavinuta paramanarayanam shankararjita janaka capadalanam | lanka vishoshanam lalitavibhishanam
    vènkatesham sadhu vibudha vinutam || deva devam bhaje divyaprabhavam
  devanagari: आदि पल्लवि देव देवं भजे दिव्यप्रभावं । रावणासुरवैरि रणपुङ्गवं ॥ राजवरशेखरं रविकुलसुधाकरं
    आजानुबाहु नीलाभ्रकायं । राजारि कोदण्ड राज दीक्षागुरुं राजीवलोचनं रामचन्द्रं ॥ देव देवं भजे दिव्यप्रभावं
    नीलजीमूत सन्निभशरीरं घन विशालवक्षं विमल जलजनाभं । तालाहिनगहरं धर्मसंस्थापनं भूललनाधिपं भोगिशयनं ॥
    देव देवं भजे दिव्यप्रभावं पङ्कजासनविनुत परमनारायणं शङ्करार्जित जनक चापदलनं । लङ्का विशोषणं लालितविभीषणं
    वॆङ्कटेशं साधु विबुध विनुतं ॥ देव देवं भजे दिव्यप्रभावं
