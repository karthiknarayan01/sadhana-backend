id: narmadashtakam
category: stotram
name:
  english: narmadashtakam
  devanagari: नर्मदाष्टकम्
content:
  english: sabindusindhususkhalattarangabhangaranjitam dvishatsupapajatajatakarivarisamyutam| kritantadutakalabhutabhitiharivarmade
    tvadiyapadapankajam namami devi narmade||1|| tvadambulinadinaminadivyasampradayakam kalaumalaughabharaharisarvatirthanayakam|
    sumacchakacchanakracakracakravakasharmade tvadiyapadapankajam namami devi narmade||2|| mahagabhiranirapurapapadhutabhutalam
    namatsamastapatakaridaritapadacalam| jagallaye mahabhaye mrikandusunuharmyade tvadiyapadapankajam
    namami devi narmade||3|| gatam tadaiva me bhayam tvadambu vikshitam yada mrikandusunushaunakasurarisevisarvada|
    punarbhavabdhijanmajam bhavabdhiduhkhavarmade tvadiyapadapankajam namami devi narmade||4|| alakshalakshakinnaramarasuradipujitam
    sulakshaniratiradhirapakshilakshakujitam| vasishthashishtapippaladakardamadisharmade tvadiyapadapankajam
    namami devi narmade||5|| sanatkumaranaciketakashyapatrishatpadaih dhritam svakiyamanaseshu naradadishatpadaih|
    ravindurantidevadevarajakarmasharmade tvadiyapadapankajam namami devi narmade||6|| alakshalakshalakshapapalakshasarasayudham
    tatastu jivajantutantu bhuktimuktidayakam| virincivishnushamkarasvakiyadhamavarmade tvadiyapadapankajam
    namami devi narmade||7|| aho'mritam svanam shrutam maheshakeshajatate kiratasutavadabeshu pandite
    shathe nate| durantapapatapaharisarvajantusharmade tvadiyapadapankajam namami devi narmade||8|| idam
    tu narmadashtakam trikalameva ye sada pathanti te nirantaram na yanti durgatim kada| sulabhyadehadurlabham
    maheshadhamagauravam punarbhava nara na vai vilokayanti rauravam||9|| iti shrimad adyashamkaracaryaviracitam
    narmadashtakam sampurnam
  devanagari: सबिन्दुसिन्धुसुस्खलत्तरङ्गभङ्गरञ्जितं द्विषत्सुपापजातजातकारिवारिसंयुतम्। कृतान्तदूतकालभूतभीतिहारिवर्मदे
    त्वदीयपादपङ्कजं नमामि देवि नर्मदे॥१॥ त्वदम्बुलीनदीनमीनदिव्यसम्प्रदायकं कलौमलौघभारहारिसर्वतीर्थनायकम्।
    सुमच्छकच्छनक्रचक्रचक्रवाकशर्मदे त्वदीयपादपङ्कजं नमामि देवि नर्मदे॥२॥ महागभीरनीरपूरपापधूतभूतलं नमत्समस्तपातकारिदारितापदाचलम्।
    जगल्लये महाभये मृकण्डुसूनुहर्म्यदे त्वदीयपादपङ्कजं नमामि देवि नर्मदे॥३॥ गतं तदैव मे भयं त्वदम्बु वीक्षितं
    यदा मृकण्डुसूनुशौनकासुरारिसेविसर्वदा। पुनर्भवाब्धिजन्मजं भवाब्धिदुःखवर्मदे त्वदीयपादपङ्कजं नमामि देवि
    नर्मदे॥४॥ अलक्षलक्षकिन्नरामरासुरादिपूजितं सुलक्षनीरतीरधीरपक्षिलक्षकूजितम्। वसिष्ठशिष्टपिप्पलादकर्दमादिशर्मदे
    त्वदीयपादपङ्कजं नमामि देवि नर्मदे॥५॥ सनत्कुमारनाचिकेतकश्यपात्रिषट्पदैः धृतं स्वकीयमानसेषु नारदादिषट्पदैः।
    रवीन्दुरन्तिदेवदेवराजकर्मशर्मदे त्वदीयपादपङ्कजं नमामि देवि नर्मदे॥६॥ अलक्षलक्षलक्षपापलक्षसारसायुधं
    ततस्तु जीवजन्तुतन्तु भुक्तिमुक्तिदायकम्। विरिञ्चिविष्णुशंकरस्वकीयधामवर्मदे त्वदीयपादपङ्कजं नमामि देवि
    नर्मदे॥७॥ अहोऽमृतं स्वनं श्रुतं महेशकेशजातटे किरातसूतवाडबेषु पण्डिते शठे नटे। दुरन्तपापतापहारिसर्वजन्तुशर्मदे
    त्वदीयपादपङ्कजं नमामि देवि नर्मदे॥८॥ इदं तु नर्मदाष्टकं त्रिकालमेव ये सदा पठन्ति ते निरन्तरं न यान्ति
    दुर्गतिं कदा। सुलभ्यदेहदुर्लभं महेशधामगौरवं पुनर्भवा नरा न वै विलोकयन्ति रौरवम्॥९॥ इति श्रीमद् आद्यशंकराचार्यविरचितं
    नर्मदाष्टकं सम्पूर्णम्
