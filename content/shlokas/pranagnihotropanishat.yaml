id: pranagnihotropanishat
category: upanishad
name:
  english: pranagnihotropanishat
  devanagari: प्राणाग्निहोत्रोपनिषत्
content:
  english: upanishad pranagnihotropanishat sharirayajnasamshuddhacittasamjatabodhatah | munayo yatpadam
    yanti tadramapadamashraye || om saha navavatu || saha nau bhunaktu || saha viryam karavavahai || tejasvinavadhitamastu
    ma vidvishavahai || om shantih shantih shantih || harih om || athatah sarvopanishatsaram samsarajnanatita
    mantrasuktam sharirayajnam vyakhyasyamah | yasminneva purushah sharire vinapyagnihotrena vinapi samkhyayogena
    samsaravimuktirbhavatiti | svena vidhinannam bhumau nikshipya ya oshadhih somarajniriti tisribhirannapata
    iti dvabhya manumantrayate | ya oshadhayah somarajnirbahvih shatavicakshanah | brihaspatiprasutasta
    no muncatvamhasah || 1|| yah phalinirya aphala apushpa yashca pushpinih | brihaspatiprasutasta no
    muncatvamhasah || 2|| jivala nagharisham mate badhnamoshadhim | yatayayu rupaharadapa rakshamsi catayat
    || 3|| annapate'nnasya no vehyanamivasya shushminah | prapradataram tarisha urjam no dhehi dvipade
    catushpade || 4|| yadannamagnirbahudha viraddhi rudraih prajagdham yadi va pishacaih | sarvam tadishano
    abhayam krinotu shivamishanaya svaha || 5|| antashcarasi bhuteshu guhayam vishvatomukhah | tvam yajnastvam
    brahma tvam rudrastavam vishnustvam vashatkara apo jyoti raso'mritam brahma bhurbhuvah suvaromnamah
    | apah punantu prithivim prithivi puta punatu mam | punantu brahmanaspatirbrahmaputa punatu mam |
    yaducchishtamabhojyam yadva dushcaritam mama | sarvam punantu mamapo'satam ca pratigraham svaha |
    amritamasya mritopastaranamasyamritam prane juhomyamashishyanto'si | pranaya svaha | apanaya svaha
    | vyanaya svaha | udanaya svaha | samanaya svaha | iti kanishthikangulyangushthena ca prane juhoti
    | anamikayapane | madhyamaya vyane | sarvabhirudane | pradeshinya samane | tushnimekamekarishau juhoti
    | dve ahavaniye | ekam dakshinagnau | ekam garhapatye | ekam sarvaprayashcittiye || athapidhanamasyamritatvayopasprishya
    punaradaya punarupasprishet | sa te prana va''po grihitva hridayamanvalabhya japet | prano agnih paramatma
    pancavayubhiravritah | abhayam sarvabhutebhyo na me bhitih kadacana || 1|| iti prathamah khandah ||
    1|| vishvo'si vaishvanaro vishvarupam tvaya dharyate jayamanam | vishvam tvahutathah sarva yatra brahma'mrito'si
    | mahanavo'yam purusho yo'ngushthagre pratishthitah | tamadbhih parishincami so'syante amritaya ca
    | anavityesha bahyatma dhyayetagnihotram johomiti | sarveshameva sunurbhavati | asya yajnaparivrita
    ahutirhomayati | svasharire yajnam parivartayamiti | catvaro'gnayaste kimbhagadheyah | tatrasuryo'gnirnama
    suryamandalakritih sahasrarashmi parivrita ekarishirbhutva murdhani tishthati | yasmadukto darshanagnirnama
    caturakritirahavaniyo bhutva mukhe tishthati | sharirognirnama jarapranuda haviravaskandati | ardhacandrakriti
    rdakshinagnirbhutva hridaye tishthati tatra koshthagniriti | koshthagnirnamashitapitalidhakhaditani
    samyagvyashtyam shrapayitva garhapatyo bhutva nabhyam tishthati | prayashcittayastvadhastattiryak
    tisro himamshuprabhabhih prajananakarma || iti dvitiyah khandah || 2|| asya sharirayajnasya yuparashanashobhitasya
    ko yajamanah | ka patni | ke ritvijah | ke sadasyah | kani yajnapatrani | kani havimshi | ka vedih
    | kottaravedih | ko dronakalashah | ko rathah | kah pashuh | ko'dhvaryuh | ko hota | ko brahmanacchamsi
    | kah pratiprasthata | kah prastota | ko maitravarunah | ka udgata | ka dharapota | ke darbhah | kah
    sruvah | kajyasthali | kavagharau | kavajyabhagau | ke'tra yajah | ke anuyajah | keda | kah suktavakah
    | kah shamyorvakah | ka himsa | ke patnisamyajah | ko yupah | ka rashana | ka ishtayah | ka dakshina
    | kimavabhritamiti || iti tritiyah khandah || 3|| asya sharirayajnasya yuparashanashobhitasyatma yajamanah
    | buddhih patni | veda mahartvijah | ahankaro'dhvaryuh | cittam hota | prano brahmanacchamsi | apanah
    pratiprasthata | vyanah prastota | udana udgata | samano maitravarunah | shariram vedih | nasikottaravedih
    | murdha dronakalashah | pado rathah | dakshinahastah sruvah | savyahasta ajyasthali | shrotre agharau
    | cakshushi ajyabhagau | griva dharapota | tanmatrani sadasyah | mahabhutani prayajah | bhutani guna
    anuyajah | jihveda | dantoshthau suktavakah | taluh shamyorvakah | smritirdaya kshantirahimsa patnisamyajah
    | onkaro yupah | asha rashana | mano rathah | kamah pashuh | kesha darbhah | buddhindriyani yajnapatrani
    | karmendriyani havimshi | ahimsa ishtayah | tyago dakshina | avabhritam maranat | sarva hyasmindevatah
    sharire'dhisamahitah | varanasyam mrito vapi idam va brahma yah pathet | ekena janmana janturmoksham
    ca prapnuyaditi moksham ca prapnuyadityupanishat || 3|| om saha navavatu || saha nau bhunaktu || saha
    viryam karavavahai || tejasvinavadhitamastu ma vidvishavahai || om shantih shantih shantih || harih
    om tatsat || iti pranagnihotropanishatsamapta || adhikadhyayanaya
  devanagari: उपनिषद् प्राणाग्निहोत्रोपनिषत् शरीरयज्ञसंशुद्धचित्तसंजातबोधतः । मुनयो यत्पदं यान्ति तद्रामपदमाश्रये
    ॥ ॐ सह नाववतु ॥ सह नौ भुनक्तु ॥ सह वीर्यं करवावहै ॥ तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ हरिः ॐ ॥ अथातः सर्वोपनिषत्सारं संसारज्ञानातीत मन्त्रसूक्तं शारीरयज्ञं व्याख्यास्यामः
    । यस्मिन्नेव पुरुषः शरीरे विनाप्यग्निहोत्रेण विनापि सांख्ययोगेन संसारविमुक्तिर्भवतीति । स्वेन विधिनान्नं
    भूमौ निक्षिप्य या ओषधीः सोमराज्ञीरिति तिसृभिरन्नपत इति द्वाभ्या मनुमन्त्रयते । या ओषधयः सोमराज्ञीर्बह्वीः
    शतविचक्षणाः । बृहस्पतिप्रसूतास्ता नो मुञ्चत्वंहसः ॥ १॥ याः फलिनीर्या अफला अपुष्पा याश्च पुष्पिणीः
    । बृहस्पतिप्रसूतास्ता नो मुञ्चत्वंहसः ॥ २॥ जीवला नघारिषां माते बध्नामोषधिम् । यातयायु रुपाहरादप रक्षांसि
    चातयात् ॥ ३॥ अन्नपतेऽन्नस्य नो वेह्यनमीवस्य शुष्मिणः । प्रप्रदातारं तारिष ऊर्जं नो धेहि द्विपदे चतुष्पदे
    ॥ ४॥ यदन्नमग्निर्बहुधा विराद्धि रुद्रैः प्रजग्धं यदि वा पिशाचैः । सर्वं तदीशानो अभयं कृणोतु शिवमीशानाय
    स्वाहा ॥ ५॥ अन्तश्चरसि भूतेषु गुहायां विश्वतोमुखः । त्वं यज्ञस्त्वं ब्रह्मा त्वं रुद्रस्तवं विष्णुस्त्वं
    वषट्कार आपो ज्योती रसोऽमृतं ब्रह्म भूर्भुवः सुवरोंनमः । आपः पुनन्तु पृथिवीं पृथिवी पूता पुनातु माम्
    । पुनन्तु ब्रह्मणस्पतिर्ब्रह्मपूता पुनातु माम् । यदुच्छिष्टमभोज्यं यद्वा दुश्चरितं मम । सर्वं पुनन्तु
    मामापोऽसतां च प्रतिग्रहं स्वाहा । अमृतमस्य मृतोपस्तरणमस्यमृतं प्राणे जुहोम्यमाशिष्यान्तोऽसि । प्राणाय
    स्वाहा । अपानाय स्वाहा । व्यानाय स्वाहा । उदानाय स्वाहा । समानाय स्वाहा । इति कनिष्ठिकाङ्गुल्याङ्गुष्ठेन
    च प्राणे जुहोति । अनामिकयापाने । मध्यमया व्याने । सर्वाभिरुदाने । प्रदेशिन्या समाने । तूष्णीमेकामेकऋषौ
    जुहोति । द्वे आहवनीये । एकां दक्षिणाग्नौ । एकां गार्हपत्ये । एकां सर्वप्रायश्चित्तीये ॥ अथापिधानमस्यमृतत्वायोपस्पृश्य
    पुनरादाय पुनरुपस्पृशेत् । स ते प्राणा वाऽऽपो गृहीत्वा हृदयमन्वालभ्य जपेत् । प्राणो अग्निः परमात्मा
    पञ्चवायुभिरावृतः । अभयं सर्वभूतेभ्यो न मे भीतिः कदाचन ॥ १॥ इति प्रथमः खण्डः ॥ १॥ विश्वोऽसि वैश्वानरो
    विश्वरूपं त्वया धार्यते जायमानम् । विश्वं त्वाहुतथः सर्वा यत्र ब्रह्माऽमृतोऽसि । महानवोऽयं पुरुषो
    योऽङ्गुष्ठाग्रे प्रतिष्ठितः । तमद्भिः परिषिञ्चामि सोऽस्यान्ते अमृताय च । अनावित्येष बाह्यात्मा ध्यायेताग्निहोत्रं
    जोहोमीति । सर्वेषामेव सूनुर्भवति । अस्य यज्ञपरिवृता आहुतीर्होमयति । स्वशरीरे यज्ञं परिवर्तयामीति ।
    चत्वारोऽग्नयस्ते किंभागधेयाः । तत्रसूर्योऽग्निर्नाम सूर्यमण्डलाकृतिः सहस्ररश्मि परिवृत एकऋषिर्भूत्वा
    मूर्धनि तिष्ठति । यस्मादुक्तो दर्शनाग्निर्नाम चतुराकृतिराहवनीयो भूत्वा मुखे तिष्ठति । शारीरोग्निर्नाम
    जराप्रणुदा हविरवस्कन्दति । अर्धचन्द्राकृति र्दक्षिणाग्निर्भूत्वा हृदये तिष्ठति तत्र कोष्ठाग्निरिति
    । कोष्ठाग्निर्नामाशितपीतलीढखादितानि सम्यग्व्यष्ट्यां श्रपयित्वा गार्हपत्यो भूत्वा नाभ्यां तिष्ठति
    । प्रायश्चित्तयस्त्वधस्तात्तिर्यक् तिस्रो हिमांशुप्रभाभिः प्रजननकर्मा ॥ इति द्वितीयः खण्डः ॥ २॥ अस्य
    शरीरयज्ञस्य यूपरशनाशोभितस्य को यजमानः । का पत्नी । के ऋत्विजः । के सदस्याः । कानि यज्ञपात्राणि । कानि
    हवींषि । का वेदिः । कोत्तरवेदिः । को द्रोणकलशः । को रथः । कः पशुः । कोऽध्वर्युः । को होता । को ब्राह्मणाच्च्हंसी
    । कः प्रतिप्रस्थाता । कः प्रस्तोता । को मैत्रावरुणः । क उद्गाता । का धारापोता । के दर्भाः । कः स्रुवः
    । काज्यस्थाली । कावाघारौ । कावाज्यभागौ । केऽत्र याजाः । के अनुयाजाः । केडा । कः सूक्तवाकः । कः शंयोर्वाकः
    । का हिंसा । के पत्नीसंयाजाः । को यूपः । का रशना । का इष्टयः । का दक्षिणा । किमवभृतमिति ॥ इति तृतीयः
    खण्डः ॥ ३॥ अस्य शारीरयज्ञस्य यूपरशनाशोभितस्यात्मा यजमानः । बुद्धिः पत्नी । वेदा महर्त्विजः । अहङ्कारोऽध्वर्युः
    । चित्तं होता । प्राणो ब्राह्मणच्छंसी । अपानः प्रतिप्रस्थाता । व्यानः प्रस्तोता । उदान उद्गाता । समानो
    मैत्रवरुणः । शरीरं वेदिः । नासिकोत्तरवेदिः । मूर्धा द्रोणकलशः । पादो रथः । दक्षिणहस्तः स्रुवः । सव्यहस्त
    आज्यस्थाली । श्रोत्रे आघारौ । चक्षुषी आज्यभागौ । ग्रीवा धारापोता । तन्मात्राणि सदस्याः । महाभूतानि
    प्रयाजाः । भूतानि गुणा अनुयाजाः । जिह्वेडा । दन्तोष्ठौ सूक्तवाकः । तालुः शंयोर्वाकः । स्मृतिर्दया
    क्षान्तिरहिंसा पत्नीसंयाजाः । ओङ्कारो यूपः । आशा रशना । मनो रथः । कामः पशुः । केशा दर्भाः । बुद्धीन्द्रियाणि
    यज्ञपात्राणि । कर्मेन्द्रियाणि हवींषि । अहिंसा इष्टयः । त्यागो दक्षिणा । अवभृतं मरणात् । सर्वा ह्यस्मिन्देवताः
    शरीरेऽधिसमाहिताः । वाराणस्यां मृतो वापि इदं वा ब्रह्म यः पठेत् । एकेन जन्मना जन्तुर्मोक्षं च प्राप्नुयादिति
    मोक्षं च प्राप्नुयादित्युपनिषत् ॥ ३॥ ॐ सह नाववतु ॥ सह नौ भुनक्तु ॥ सह वीर्यं करवावहै ॥ तेजस्विनावधीतमस्तु
    मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ तत्सत् ॥ इति प्राणाग्निहोत्रोपनिषत्समाप्ता ॥ अधिकाध्ययनाय
