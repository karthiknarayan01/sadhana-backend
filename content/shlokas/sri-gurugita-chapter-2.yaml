id: sri-gurugita-chapter-2
category: stotram
name:
  english: Sri Gurugita Chapter 2
content:
  english: atha dvitiyo'dhyayah || dhyanam shrunu mahadevi sarvanandapradayakam | sarvasaukhyakaram caiva
    bhuktimuktipradayakam || || shrimatparam brahma gurum smarami shrimatparam brahma gurum bhajami |
    shrimatparam brahma gurum vadami shrimatparam brahma gurum namami || || brahmanandam paramasukhadam
    kevalam jnanamurtim dvandvatitam gaganasadrisham tattvamasyadilakshyam | ekam nityam vimalamacalam
    sarvadhisakshibhutam bhavatitam trigunarahitam sadgurum tam namami || || hridambuje karnikamadhyasamsthe
    simhasane samsthitadivyamurtim | dhyayedgurum candrakalaprakasham saccitsukhabhishtavaram dadhanam
    || || shvetambaram shvetavilepapushpam muktavibhusham muditam dvinetram | vamankapithasthitadivyashaktim
    mandasmitam purnakripanidhanam || || anandamanandakaram prasannam jnanasvarupam nijabhavayuktam |
    yogindramidyam bhavarogavaidyam shrimadgurum nityamaham namami || || vande gurunam caranaravindam
    sandarshitasvatmasukhavabodhe | janasya ye jangalikayamane samsarahalahalamohashantyai || || yasmin
    srishtisthitidhvamsanigrahanugrahatmakam | krityam pancavidham shashvat bhasate tam gurum bhajet ||
    || padabje sarvasamsaradavakalanalam svake | brahmarandhre sthitambhojamadhyastham candramandalam
    || || akathaditrirekhabje sahasradalamandale | hamsaparshvatrikone ca smarettanmadhyagam gurum ||
    || nityam shuddham nirabhasam nirakaram niranjanam | nityabodham cidanandam gurum brahma namamyaham
    || || sakalabhuvanasrishtih kalpitasheshasrishtih nikhilanigamadrishtih satpadarthaikasrishtih | atadganaparameshtih
    satpadarthaikadrishtih bhavagunaparameshtirmokshamargaikadrishtih || || sakalabhuvanarangasthapanastambhayashtih
    sakarunarasavrishtistattvamalasamashtih | sakalasamayasrishtissaccidanandadrishtih nivasatu mayi nityam
    shrigurordivyadrishtih || || na guroradhikam na guroradhikam na guroradhikam na guroradhikam | shivashasanatah
    shivashasanatah shivashasanatah shivashasanatah || || idameva shivam idameva shivam idameva shivam
    idameva shivam | harishasanato harishasanato harishasanato harishasanatah || || viditam viditam viditam
    viditam vijanam vijanam vijanam vijanam | vidhishasanato vidhishasanato vidhishasanato vidhishasanatah
    || || evamvidham gurum dhyatva jnanamutpadyate svayam | tada gurupadeshena mukto'hamiti bhavayet ||
    || gurupadishtamargena manashshuddhim tu karayet | anityam khandayetsarvam yatkincidatmagocaram ||
    || jneyam sarvam pratitam ca jnanam ca mana ucyate | jnanam jneyam samam kuryannanyah pantha dvitiyakah
    || || kimatra bahunoktena shastrakotishatairapi | durlabha cittavishrantih vina gurukripam param ||
    || karunakhadgapatena chitva pashashtakam shishoh | samyaganandajanakah sadguruh so'bhidhiyate ||
    || evam shrutva mahadevi gurunindam karoti yah | sa yati narakan ghoran yavaccandradivakarau || ||
    yavatkalpantako dehastavaddevi gurum smaret | gurulopo na kartavyah svacchando yadi va bhavet || ||
    hunkarena na vaktavyam prajnashishyaih kadacana | guroragra na vaktavyamasatyam tu kadacana || ||
    gurum tvankritya hunkritya gurusannidhyabhashanah | aranye nirjale deshe sambhaved brahmarakshasah
    || || advaitam bhavayennityam sarvavasthasu sarvada | kadacidapi no kuryadadvaitam gurusannidhau ||
    || drishyavismritiparyantam kuryad gurupadarcanam | tadrishasyaiva kaivalyam na ca tadvyatirekinah
    || || api sampurnatattvajno gurutyagi bhavedyada | bhavatyeva hi tasyantakale vikshepamutkatam ||
    || gurukaryam na langheta naprishtva karyamacaret | na hyuttishtheddishe'natva gurusadbhavashobhitah
    || || gurau sati svayam devi paresham tu kadacana | upadesham na vai kuryat tatha cedrakshaso bhavet
    || || na gurorashrame kuryat dushpanam parisarpanam | diksha vyakhya prabhutvadi gurorajnam na karayet
    || || nopashrayam ca paryakam na ca padaprasaranam | nangabhogadikam kuryanna lilamaparamapi || ||
    gurunam sadasadva'pi yaduktam tanna langhayet | kurvannajnam diva ratrau dasavannivasedguro || ||
    adattam na gurordravyamupabhunjita karhicit | datte ca rankavadgrahyam prano'pyetena labhyate || ||
    padukasanashayyadi guruna yadabhishtitam | namaskurvita tatsarvam padabhyam na sprishet kvacit ||
    || gacchatah prishthato gacchet gurucchayam na langhayet | nolbanam dharayedvesham nalankaramstatolbanan
    || || gurunindakaram drishtva dhavayedatha vasayet | sthanam va tatparityajyam jihvacchedakshamo yadi
    || || nocchishtam kasyaciddeyam gurorajnam na ca tyajet | kritsnamucchishtamadaya haviriva bhakshayetsvayam
    || || na'nritam na'priyam caiva na garvam na'pi va bahu | na niyogaparam bruyat gurorajnam vibhavayet
    || || prabho devakuleshanam svamin rajan kuleshvara | iti sambodhanairbhito gurubhavena sarvada ||
    || munibhih pannagairvapi surairva shapito yadi | kalamrityubhayadvapi guruh santrati parvati || ||
    ashakta hi suradyashca hyashaktah munayastatha | gurushapopapannasya rakshanaya ca kutracit || ||
    mantrarajamidam devi gururityaksharadvayam | smritivedapurananam sarameva na samshayah || || satkaramanapujartham
    dandakashayadharanah | sa sannyasi na vaktavyah sannyasi jnanatatparah || || vijananti mahavakyam
    guroshcarana sevaya | te vai sannyasinah prokta itare veshadharinah || nityam brahma nirakaram nirgunam
    bodhayetparam | bhasayan brahmabhavam ca dipo dipantaram yatha || nityam brahma nirakaram nirgunam
    satyaciddhanam | yah sakshatkurute loke gurutvam tasya shobhate || || guruprasadatah svatmanyatmaramanirikshanat
    | samata muktimargena svatmajnanam pravartate || || abrahmastambaparyantam paramatmasvarupakam | sthavaram
    jangamam caiva pranamami jaganmayam || || vande'ham saccidanandam bhavatitam jagadgurum | nityam purnam
    nirakaram nirgunam svatmasamsthitam || || paratparataram dhyayennityamanandakarakam | hridayakashamadhyastham
    shuddhasphatikasannibham || || sphatike sphatikam rupam darpane darpano yatha | tatha''tmani cidakaramanandam
    so'hamityuta || || angushthamatram purusham dhyayecca cinmayam hridi | tatra sphurati yo bhavah shrinu
    tatkathayami te || || ajo'hamamaro'ham ca anadinidhano hyaham | avikarashcidanando hyaniyanmahato
    mahan || || apurvamaparam nityam svayanjyotirniramayam | virajam paramakasham dhruvamanandamavyayam
    || || agocaram tatha'gamyam namarupavivarjitam | nishshabdam tu vijaniyatsvabhavadbrahma parvati ||
    || yatha gandhasvabhavatvam karpurakusumadishu | shitoshnatvasvabhavatvam tatha brahmani shashvatam
    || || yatha nijasvabhavena kundale katakadayah | suvarnatvena tishthanti tatha'ham brahma shashvatam
    || || svayam tathavidho bhutva sthatavyam yatra kutra cit | kito bhringa iva dhyanadyatha bhavati
    tadrishah || || gurudhyanam tatha kritva svayam brahmamayo bhavet | pinde pade tatha rupe muktaste
    natra samshayah || || shriparvati uvaca | pindam kim tu mahadeva padam kim samudahritam | rupatitam
    ca rupam kim etadakhyahi shankara || || shrimahadeva uvaca | pindam kundalini shaktih padam hamsamudahritam
    | rupam binduriti jneyam rupatitam niranjanam || || pinde muktah pade mukta rupe mukta varanane |
    rupatite tu ye muktaste mukta na'tra samshayah || || gururdhyanenaiva nityam dehi brahmamayo bhavet
    | sthitashca yatra kutra'pi mukto'sau na'tra samshayah || || jnanam vairagyamaishvaryam yashashrih
    svamudahritam | shadgunaishvaryayukto hi bhagavan shriguruh priye || || gurushshivo gururdevo gururbandhuh
    sharirinam | gururatma gururjivo guroranyanna vidyate || || ekaki nissprihah shantashcinta'suyadivarjitah
    | balyabhavena yo bhati brahmajnani sa ucyate || || na sukham vedashastreshu na sukham mantrayantrake
    | guroh prasadadanyatra sukham nasti mahitale || || carvakavaishnavamate sukham prabhakare na hi |
    guroh padantike yadvatsukham vedantasammatam || || na tatsukham surendrasya na sukham cakravartinam
    | yatsukham vitaragasya munerekantavasinah || || nityam brahmarasam pitva tripto yah paramatmani |
    indram ca manyate tuccham nripanam tatra ka katha || || yatah paramakaivalyam gurumargena vai bhavet
    | gurubhaktiratah karya sarvada mokshakankshibhih || || eka eva'dvitiyo'ham guruvakyena nishcitah
    | evamabhyasyata nityam na sevyam vai vanantaram || || abhyasannimishenaiva samadhimadhigacchati |
    ajanmajanitam papam tat || kimavahanamavyakte vyapake kim visarjanam | amurte ca katham puja katham
    dhyanam niramaye || || gururvishnuh sattvamayo rajasashcaturananah | tamaso rudrarupena srijatyavati
    hanti ca || || svayam brahmamayo bhutva tatparam cavalokayet | paratparataram nanyat sarvagam tanniramayam
    || || tasyavalokanam prapya sarvasangavivarjitah | ekaki nissprihah shantah sthatavyam tatprasadatah
    || || labdham va'tha na labdham va svalpam va bahulam tatha | nishkamenaiva bhoktavyam sada santushtamanasah
    || || sarvajnapadamityahurdehi sarvamayo bhuvi | sada''nandah sada shanto ramate yatra kutra cit ||
    || yatraiva tishthate so'pi sa deshah punyabhajanah | muktasya lakshanam devi tava'gre kathitam maya
    || || upadeshastvayam devi gurumargena muktidah | gurubhaktih tatha'tyanta kartavya vai manishibhih
    || || nityayuktashrayah sarvavedakritsarvavedakrit | svaparajnanadata ca tam vande gurumishvaram ||
    || yadyapyadhita nigamah shadanga agamah priye | adhyatmadini shastrani jnanam nasti gurum vina ||
    || shivapujarato va'pi vishnupujarato'thava | gurutattvavihinashcettatsarvam vyarthameva hi || ||
    shivasvarupamajnatva shivapuja krita yadi | sa puja namamatram syaccitradipa iva priye || || sarvam
    syatsaphalam karma gurudikshaprabhavatah | gurulabhatsarvalabho guruhinastu balishah || || guruhinah
    pashuh kitah patango vaktumarhati | shivarupam svarupam ca na janati yatassvayam || || tasmatsarvaprayatnena
    sarvasangavivarjitah | vihaya shastrajalani gurumeva samashrayet || || nirastasarvasandeho ekikritya
    sudarshanam | rahasyam yo darshayati bhajami gurumishvaram || || jnanahino gurustyajyo mithyavadi
    vidambakah | svavishrantim na janati parashantim karoti kim || || shilayah kim param jnanam shilasanghapratarane
    | svayam tartum na janati param nistarayet katham || || na vandaniyaste kashtam darshanadbhrantikarakah
    | varjayettan gurun dure dhirasya tu samashrayet || || pashandinah paparatah nastika bhedabuddhayah
    | strilampata duracarah kritaghna bakavrittayah || || karmabhrashtah kshamanashta nindyatarkaishca
    vadinah | kaminah krodhinashcaiva himsrashcandah shathastatha || || jnanalupta na kartavya mahapapastatha
    priye | ebhyo bhinno guruh sevyah ekabhaktya vicarya ca || || shishyadanyatra deveshi na vadedyasya
    kasyacit | naranam ca phalapraptau bhaktireva hi karanam || || gudho dridhashca pritashca maunena
    susamahitah | sakritkamagato va'pi pancadha gururiritah || || sarvam gurumukhallabdham saphalam papanashanam
    | yadyadatmahitam vastu tattaddravyam na vancayet || || gurudevarpanam vastu tena tushto'smi suvrate
    | shriguroh padukam mudram mulamantram ca gopayet || || nata'smi te natha padaravindam buddhindriyapranamanovacobhih
    | yaccintyate bhavita atmayuktau mumukshibhih karmamayopashantaye || || anena yadbhavetkaryam tadvadami
    tava priye | lokopakarakam devi laukikam tu vivarjayet || || laukikaddharmato yati jnanahino bhavarnave
    | jnanabhave ca yatsarvam karma nishkarma shamyati || || imam tu bhaktibhavena pathedvai shrinuyadapi
    | likhitva yatpradanena tatsarvam phalamashnute || || gurugitamimam devi hridi nityam vibhavaya |
    mahavyadhigatairduhkhaih sarvada prajapenmuda || || gurugitaksharaikaikam mantrarajamidam priye |
    anye ca vividhah mantrah kalam narhanti shodashim || || ananta phalamapnoti gurugita japena tu | sarvapapahara
    devi sarvadaridryanashini || || akalamrityuhara caiva sarvasankatanashini | yaksharakshasabhutadicoravyaghravighatini
    || || sarvopadravakushthadidushtadoshanivarini | yatphalam gurusannidhyattatphalam pathanadbhavet
    || || mahavyadhihara sarvavibhuteh siddhida bhavet | athava mohane vashye svayameva japetsada || ||
    kushadurvasane devi hyasane shubhrakambale | upavishya tato devi japedekagramanasah || || shuklam
    sarvatra vai proktam vashye raktasanam priye | padmasane japennityam shantivashyakaram param || ||
    vastrasane ca daridryam pashane rogasambhavah | medinyam duhkhamapnoti kashthe bhavati nishphalam
    || || krishnajine jnanasiddhih mokshashrirvyaghracarmani | kushasane jnanasiddhih sarvasiddhistu kambale
    || || agneyyam karshanam caiva vayavyam shatrunashanam | nairrityam darshanam caiva ishanyam jnanameva
    ca || || udanmukhah shantijapye vashye purvamukhastatha | yamye tu maranam proktam pashcime ca dhanagamah
    || || mohanam sarvabhutanam bandhamokshakaram param | devarajapriyakaram rajanam vashamanayet || ||
    mukhastambhakaram caiva gunanam ca vivardhanam | dushkarmanashanam caiva tatha satkarmasiddhidam ||
    || asiddham sadhayetkaryam navagrahabhayapaham | duhsvapnanashanam caiva susvapnaphaladayakam || ||
    mohashantikaram caiva bandhamokshakaram param | svarupajnananilayam gitashastramidam shive || || yam
    yam cintayate kamam tam tam prapnoti nishcayam | nityam saubhagyadam punyam tapatrayakulapaham ||
    || sarvashantikaram nityam tatha vandhya suputradam | avaidhavyakaram strinam saubhagyasya vivardhanam
    || || ayurarogyamaishvaryam putrapautravivardhanam | nishkamajapi vidhava pathenmokshamavapnuyat ||
    || avaidhavyam sakama tu labhate canyajanmani | sarvaduhkhamayam vighnam nashayettapaharakam || ||
    sarvapapaprashamanam dharmakamarthamokshadam | yam yam cintayate kamam tam tam prapnoti nishcitam
    || || kamyanam kamadhenurvai kalpate kalpapadapah | cintamanishcintitasya sarvamangalakarakam || ||
    likhitva pujayedyastu mokshashriyamavapnuyat | gurubhaktirvisheshena jayate hridi sarvada || || japanti
    shaktah saurashca ganapatyashca vaishnavah | shaivah pashupatah sarve satyam satyam na samshayah ||
    || iti shriskandapurane uttarakhande umamaheshvara samvade shri gurugitayam dvitiyo'dhyayah ||
  devanagari: अथ द्वितीयोऽध्यायः ॥ ध्यानं श्रुणु महादेवि सर्वानन्दप्रदायकम् । सर्वसौख्यकरं चैव भुक्तिमुक्तिप्रदायकम्
    ॥ ॥ श्रीमत्परं ब्रह्म गुरुं स्मरामि श्रीमत्परं ब्रह्म गुरुं भजामि । श्रीमत्परं ब्रह्म गुरुं वदामि
    श्रीमत्परं ब्रह्म गुरुं नमामि ॥ ॥ ब्रह्मानन्दं परमसुखदं केवलं ज्ञानमूर्तिं द्वन्द्वातीतं गगनसदृशं
    तत्त्वमस्यादिलक्ष्यम् । एकं नित्यं विमलमचलं सर्वधीसाक्षिभूतं भावातीतं त्रिगुणरहितं सद्गुरुं तं नमामि
    ॥ ॥ हृदम्बुजे कर्णिकमध्यसंस्थे सिंहासने संस्थितदिव्यमूर्तिम् । ध्यायेद्गुरुं चन्द्रकलाप्रकाशं सच्चित्सुखाभीष्टवरं
    दधानम् ॥ ॥ श्वेताम्बरं श्वेतविलेपपुष्पं मुक्ताविभूषं मुदितं द्विनेत्रम् । वामाङ्कपीठस्थितदिव्यशक्तिं
    मन्दस्मितं पूर्णकृपानिधानम् ॥ ॥ आनन्दमानन्दकरं प्रसन्नं ज्ञानस्वरूपं निजभावयुक्तम् । योगीन्द्रमीड्यं
    भवरोगवैद्यं श्रीमद्गुरुं नित्यमहं नमामि ॥ ॥ वन्दे गुरूणां चरणारविन्दं सन्दर्शितस्वात्मसुखावबोधे ।
    जनस्य ये जाङ्गलिकायमाने संसारहालाहलमोहशान्त्यै ॥ ॥ यस्मिन् सृष्टिस्थितिध्वंसनिग्रहानुग्रहात्मकम् ।
    कृत्यं पञ्चविधं शश्वत् भासते तं गुरुं भजेत् ॥ ॥ पादाब्जे सर्वसंसारदावकालानलं स्वके । ब्रह्मरन्ध्रे
    स्थिताम्भोजमध्यस्थं चन्द्रमण्डलम् ॥ ॥ अकथादित्रिरेखाब्जे सहस्रदलमण्डले । हंसपार्श्वत्रिकोणे च स्मरेत्तन्मध्यगं
    गुरुम् ॥ ॥ नित्यं शुद्धं निराभासं निराकारं निरञ्जनम् । नित्यबोधं चिदानन्दं गुरुं ब्रह्म नमाम्यहम्
    ॥ ॥ सकलभुवनसृष्टिः कल्पिताशेषसृष्टिः निखिलनिगमदृष्टिः सत्पदार्थैकसृष्टिः । अतद्गणपरमेष्टिः सत्पदार्थैकदृष्टिः
    भवगुणपरमेष्टिर्मोक्षमार्गैकदृष्टिः ॥ ॥ सकलभुवनरङ्गस्थापनास्तम्भयष्टिः सकरुणरसवृष्टिस्तत्त्वमालासमष्टिः
    । सकलसमयसृष्टिस्सच्चिदानन्ददृष्टिः निवसतु मयि नित्यं श्रीगुरोर्दिव्यदृष्टिः ॥ ॥ न गुरोरधिकं न गुरोरधिकं
    न गुरोरधिकं न गुरोरधिकम् । शिवशासनतः शिवशासनतः शिवशासनतः शिवशासनतः ॥ ॥ इदमेव शिवं इदमेव शिवं इदमेव
    शिवं इदमेव शिवम् । हरिशासनतो हरिशासनतो हरिशासनतो हरिशासनतः ॥ ॥ विदितं विदितं विदितं विदितं विजनं विजनं
    विजनं विजनम् । विधिशासनतो विधिशासनतो विधिशासनतो विधिशासनतः ॥ ॥ एवंविधं गुरुं ध्यात्वा ज्ञानमुत्पद्यते
    स्वयम् । तदा गुरूपदेशेन मुक्तोऽहमिति भावयेत् ॥ ॥ गुरूपदिष्टमार्गेण मनश्शुद्धिं तु कारयेत् । अनित्यं
    खण्डयेत्सर्वं यत्किञ्चिदात्मगोचरम् ॥ ॥ ज्ञेयं सर्वं प्रतीतं च ज्ञानं च मन उच्यते । ज्ञानं ज्ञेयं समं
    कुर्यान्नान्यः पन्था द्वितीयकः ॥ ॥ किमत्र बहुनोक्तेन शास्त्रकोटिशतैरपि । दुर्लभा चित्तविश्रान्तिः
    विना गुरुकृपां पराम् ॥ ॥ करुणाखड्गपातेन छित्वा पाशाष्टकं शिशोः । सम्यगानन्दजनकः सद्गुरुः सोऽभिधीयते
    ॥ ॥ एवं श्रुत्वा महादेवि गुरुनिन्दां करोति यः । स याति नरकान् घोरान् यावच्चन्द्रदिवाकरौ ॥ ॥ यावत्कल्पान्तको
    देहस्तावद्देवि गुरुं स्मरेत् । गुरुलोपो न कर्तव्यः स्वच्छन्दो यदि वा भवेत् ॥ ॥ हुङ्कारेण न वक्तव्यं
    प्राज्ञशिष्यैः कदाचन । गुरोरग्र न वक्तव्यमसत्यं तु कदाचन ॥ ॥ गुरुं त्वङ्कृत्य हुङ्कृत्य गुरुसान्निध्यभाषणः
    । अरण्ये निर्जले देशे सम्भवेद् ब्रह्मराक्षसः ॥ ॥ अद्वैतं भावयेन्नित्यं सर्वावस्थासु सर्वदा । कदाचिदपि
    नो कुर्यादद्वैतं गुरुसन्निधौ ॥ ॥ दृश्यविस्मृतिपर्यन्तं कुर्याद् गुरुपदार्चनम् । तादृशस्यैव कैवल्यं
    न च तद्व्यतिरेकिणः ॥ ॥ अपि सम्पूर्णतत्त्वज्ञो गुरुत्यागी भवेद्यदा । भवत्येव हि तस्यान्तकाले विक्षेपमुत्कटम्
    ॥ ॥ गुरुकार्यं न लङ्घेत नापृष्ट्वा कार्यमाचरेत् । न ह्युत्तिष्ठेद्दिशेऽनत्वा गुरुसद्भावशोभितः ॥ ॥
    गुरौ सति स्वयं देवि परेषां तु कदाचन । उपदेशं न वै कुर्यात् तथा चेद्राक्षसो भवेत् ॥ ॥ न गुरोराश्रमे
    कुर्यात् दुष्पानं परिसर्पणम् । दीक्षा व्याख्या प्रभुत्वादि गुरोराज्ञां न कारयेत् ॥ ॥ नोपाश्रयं च पर्यकं
    न च पादप्रसारणम् । नाङ्गभोगादिकं कुर्यान्न लीलामपरामपि ॥ ॥ गुरूणां सदसद्वाऽपि यदुक्तं तन्न लङ्घयेत्
    । कुर्वन्नाज्ञां दिवा रात्रौ दासवन्निवसेद्गुरो ॥ ॥ अदत्तं न गुरोर्द्रव्यमुपभुञ्जीत कर्हिचित् । दत्ते
    च रङ्कवद्ग्राह्यं प्राणोऽप्येतेन लभ्यते ॥ ॥ पादुकासनशय्यादि गुरुणा यदभीष्टितम् । नमस्कुर्वीत तत्सर्वं
    पादाभ्यां न स्पृशेत् क्वचित् ॥ ॥ गच्छतः पृष्ठतो गच्छेत् गुरुच्छायां न लङ्घयेत् । नोल्बणं धारयेद्वेषं
    नालङ्कारांस्ततोल्बणान् ॥ ॥ गुरुनिन्दाकरं दृष्ट्वा धावयेदथ वासयेत् । स्थानं वा तत्परित्याज्यं जिह्वाच्छेदाक्षमो
    यदि ॥ ॥ नोच्छिष्टं कस्यचिद्देयं गुरोराज्ञां न च त्यजेत् । कृत्स्नमुच्छिष्टमादाय हविरिव भक्षयेत्स्वयम्
    ॥ ॥ नाऽनृतं नाऽप्रियं चैव न गर्वं नाऽपि वा बहु । न नियोगपरं ब्रूयात् गुरोराज्ञां विभावयेत् ॥ ॥ प्रभो
    देवकुलेशानां स्वामिन् राजन् कुलेश्वर । इति सम्बोधनैर्भीतो गुरुभावेन सर्वदा ॥ ॥ मुनिभिः पन्नगैर्वापि
    सुरैर्वा शापितो यदि । कालमृत्युभयाद्वापि गुरुः सन्त्राति पार्वति ॥ ॥ अशक्ता हि सुराद्याश्च ह्यशक्ताः
    मुनयस्तथा । गुरुशापोपपन्नस्य रक्षणाय च कुत्रचित् ॥ ॥ मन्त्रराजमिदं देवि गुरुरित्यक्षरद्वयम् । स्मृतिवेदपुराणानां
    सारमेव न संशयः ॥ ॥ सत्कारमानपूजार्थं दण्डकाषयधारणः । स सन्न्यासी न वक्तव्यः सन्न्यासी ज्ञानतत्परः
    ॥ ॥ विजानन्ति महावाक्यं गुरोश्चरण सेवया । ते वै सन्न्यासिनः प्रोक्ता इतरे वेषधारिणः ॥ नित्यं ब्रह्म
    निराकारं निर्गुणं बोधयेत्परम् । भासयन् ब्रह्मभावं च दीपो दीपान्तरं यथा ॥ नित्यं ब्रह्म निराकारं निर्गुणं
    सत्यचिद्धनम् । यः साक्षात्कुरुते लोके गुरुत्वं तस्य शोभते ॥ ॥ गुरुप्रसादतः स्वात्मन्यात्मारामनिरीक्षणात्
    । समता मुक्तिमार्गेण स्वात्मज्ञानं प्रवर्तते ॥ ॥ आब्रह्मस्तम्बपर्यन्तं परमात्मस्वरूपकम् । स्थावरं
    जङ्गमं चैव प्रणमामि जगन्मयम् ॥ ॥ वन्देऽहं सच्चिदानन्दं भावातीतं जगद्गुरुम् । नित्यं पूर्णं निराकारं
    निर्गुणं स्वात्मसंस्थितम् ॥ ॥ परात्परतरं ध्यायेन्नित्यमानन्दकारकम् । हृदयाकाशमध्यस्थं शुद्धस्फटिकसन्निभम्
    ॥ ॥ स्फाटिके स्फाटिकं रूपं दर्पणे दर्पणो यथा । तथाऽऽत्मनि चिदाकारमानन्दं सोऽहमित्युत ॥ ॥ अङ्गुष्ठमात्रं
    पुरुषं ध्यायेच्च चिन्मयं हृदि । तत्र स्फुरति यो भावः शृणु तत्कथयामि ते ॥ ॥ अजोऽहममरोऽहं च अनादिनिधनो
    ह्यहम् । अविकारश्चिदानन्दो ह्यणीयान्महतो महान् ॥ ॥ अपूर्वमपरं नित्यं स्वयञ्ज्योतिर्निरामयम् । विरजं
    परमाकाशं ध्रुवमानन्दमव्ययम् ॥ ॥ अगोचरं तथाऽगम्यं नामरूपविवर्जितम् । निश्शब्दं तु विजानीयात्स्वभावाद्ब्रह्म
    पार्वति ॥ ॥ यथा गन्धस्वभावत्वं कर्पूरकुसुमादिषु । शीतोष्णत्वस्वभावत्वं तथा ब्रह्मणि शाश्वतम् ॥ ॥ यथा
    निजस्वभावेन कुण्डले कटकादयः । सुवर्णत्वेन तिष्ठन्ति तथाऽहं ब्रह्म शाश्वतम् ॥ ॥ स्वयं तथाविधो भूत्वा
    स्थातव्यं यत्र कुत्र चित् । कीटो भृङ्ग इव ध्यानाद्यथा भवति तादृशः ॥ ॥ गुरुध्यानं तथा कृत्वा स्वयं
    ब्रह्ममयो भवेत् । पिण्डे पदे तथा रूपे मुक्तास्ते नात्र संशयः ॥ ॥ श्रीपार्वती उवाच । पिण्डं किं तु
    महादेव पदं किं समुदाहृतम् । रूपातीतं च रूपं किं एतदाख्याहि शङ्कर ॥ ॥ श्रीमहादेव उवाच । पिण्डं कुण्डलिनी
    शक्तिः पदं हंसमुदाहृतम् । रूपं बिन्दुरिति ज्ञेयं रूपातीतं निरञ्जनम् ॥ ॥ पिण्डे मुक्ताः पदे मुक्ता
    रूपे मुक्ता वरानने । रूपातीते तु ये मुक्तास्ते मुक्ता नाऽत्र संशयः ॥ ॥ गुरुर्ध्यानेनैव नित्यं देही
    ब्रह्ममयो भवेत् । स्थितश्च यत्र कुत्राऽपि मुक्तोऽसौ नाऽत्र संशयः ॥ ॥ ज्ञानं वैराग्यमैश्वर्यं यशश्रीः
    स्वमुदाहृतम् । षड्गुणैश्वर्ययुक्तो हि भगवान् श्रीगुरुः प्रिये ॥ ॥ गुरुश्शिवो गुरुर्देवो गुरुर्बन्धुः
    शरीरिणाम् । गुरुरात्मा गुरुर्जीवो गुरोरन्यन्न विद्यते ॥ ॥ एकाकी निस्स्पृहः शान्तश्चिन्ताऽसूयादिवर्जितः
    । बाल्यभावेन यो भाति ब्रह्मज्ञानी स उच्यते ॥ ॥ न सुखं वेदशास्त्रेषु न सुखं मन्त्रयन्त्रके । गुरोः
    प्रसादादन्यत्र सुखं नास्ति महीतले ॥ ॥ चार्वाकवैष्णवमते सुखं प्राभाकरे न हि । गुरोः पादान्तिके यद्वत्सुखं
    वेदान्तसम्मतम् ॥ ॥ न तत्सुखं सुरेन्द्रस्य न सुखं चक्रवर्तिनाम् । यत्सुखं वीतरागस्य मुनेरेकान्तवासिनः
    ॥ ॥ नित्यं ब्रह्मरसं पीत्वा तृप्तो यः परमात्मनि । इन्द्रं च मन्यते तुच्छं नृपाणां तत्र का कथा ॥ ॥
    यतः परमकैवल्यं गुरुमार्गेण वै भवेत् । गुरुभक्तिरतः कार्या सर्वदा मोक्षकाङ्क्षिभिः ॥ ॥ एक एवाऽद्वितीयोऽहं
    गुरुवाक्येन निश्चितः । एवमभ्यस्यता नित्यं न सेव्यं वै वनान्तरम् ॥ ॥ अभ्यासान्निमिषेणैव समाधिमधिगच्छति
    । आजन्मजनितं पापं तत् ॥ किमावाहनमव्यक्ते व्यापके किं विसर्जनम् । अमूर्ते च कथं पूजा कथं ध्यानं निरामये
    ॥ ॥ गुरुर्विष्णुः सत्त्वमयो राजसश्चतुराननः । तामसो रुद्ररूपेण सृजत्यवति हन्ति च ॥ ॥ स्वयं ब्रह्ममयो
    भूत्वा तत्परं चावलोकयेत् । परात्परतरं नान्यत् सर्वगं तन्निरामयम् ॥ ॥ तस्यावलोकनं प्राप्य सर्वसङ्गविवर्जितः
    । एकाकी निस्स्पृहः शान्तः स्थातव्यं तत्प्रसादतः ॥ ॥ लब्धं वाऽथ न लब्धं वा स्वल्पं वा बहुलं तथा । निष्कामेनैव
    भोक्तव्यं सदा सन्तुष्टमानसः ॥ ॥ सर्वज्ञपदमित्याहुर्देही सर्वमयो भुवि । सदाऽऽनन्दः सदा शान्तो रमते
    यत्र कुत्र चित् ॥ ॥ यत्रैव तिष्ठते सोऽपि स देशः पुण्यभाजनः । मुक्तस्य लक्षणं देवि तवाऽग्रे कथितं मया
    ॥ ॥ उपदेशस्त्वयं देवि गुरुमार्गेण मुक्तिदः । गुरुभक्तिः तथाऽत्यन्ता कर्तव्या वै मनीषिभिः ॥ ॥ नित्ययुक्ताश्रयः
    सर्ववेदकृत्सर्ववेदकृत् । स्वपरज्ञानदाता च तं वन्दे गुरुमीश्वरम् ॥ ॥ यद्यप्यधीता निगमाः षडङ्गा आगमाः
    प्रिये । अध्यात्मादीनि शास्त्राणि ज्ञानं नास्ति गुरुं विना ॥ ॥ शिवपूजारतो वाऽपि विष्णुपूजारतोऽथवा
    । गुरुतत्त्वविहीनश्चेत्तत्सर्वं व्यर्थमेव हि ॥ ॥ शिवस्वरूपमज्ञात्वा शिवपूजा कृता यदि । सा पूजा नाममात्रं
    स्याच्चित्रदीप इव प्रिये ॥ ॥ सर्वं स्यात्सफलं कर्म गुरुदीक्षाप्रभावतः । गुरुलाभात्सर्वलाभो गुरुहीनस्तु
    बालिशः ॥ ॥ गुरुहीनः पशुः कीटः पतङ्गो वक्तुमर्हति । शिवरूपं स्वरूपं च न जानाति यतस्स्वयम् ॥ ॥ तस्मात्सर्वप्रयत्नेन
    सर्वसङ्गविवर्जितः । विहाय शास्त्रजालानि गुरुमेव समाश्रयेत् ॥ ॥ निरस्तसर्वसन्देहो एकीकृत्य सुदर्शनम्
    । रहस्यं यो दर्शयति भजामि गुरुमीश्वरम् ॥ ॥ ज्ञानहीनो गुरुस्त्याज्यो मिथ्यावादी विडम्बकः । स्वविश्रान्तिं
    न जानाति परशान्तिं करोति किम् ॥ ॥ शिलायाः किं परं ज्ञानं शिलासङ्घप्रतारणे । स्वयं तर्तुं न जानाति
    परं निस्तारयेत् कथम् ॥ ॥ न वन्दनीयास्ते कष्टं दर्शनाद्भ्रान्तिकारकाः । वर्जयेत्तान् गुरून् दूरे धीरस्य
    तु समाश्रयेत् ॥ ॥ पाषण्डिनः पापरताः नास्तिका भेदबुद्धयः । स्त्रीलम्पटा दुराचाराः कृतघ्ना बकवृत्तयः
    ॥ ॥ कर्मभ्रष्टाः क्षमानष्टा निन्द्यतर्कैश्च वादिनः । कामिनः क्रोधिनश्चैव हिंस्राश्चण्डाः शठास्तथा
    ॥ ॥ ज्ञानलुप्ता न कर्तव्या महापापास्तथा प्रिये । एभ्यो भिन्नो गुरुः सेव्यः एकभक्त्या विचार्य च ॥ ॥
    शिष्यादन्यत्र देवेशि न वदेद्यस्य कस्यचित् । नराणां च फलप्राप्तौ भक्तिरेव हि कारणम् ॥ ॥ गूढो दृढश्च
    प्रीतश्च मौनेन सुसमाहितः । सकृत्कामगतो वाऽपि पञ्चधा गुरुरीरितः ॥ ॥ सर्वं गुरुमुखाल्लब्धं सफलं पापनाशनम्
    । यद्यदात्महितं वस्तु तत्तद्द्रव्यं न वञ्चयेत् ॥ ॥ गुरुदेवार्पणं वस्तु तेन तुष्टोऽस्मि सुव्रते । श्रीगुरोः
    पादुकां मुद्रां मूलमन्त्रं च गोपयेत् ॥ ॥ नताऽस्मि ते नाथ पदारविन्दं बुद्धीन्द्रियप्राणमनोवचोभिः ।
    यच्चिन्त्यते भावित आत्मयुक्तौ मुमुक्षिभिः कर्ममयोपशान्तये ॥ ॥ अनेन यद्भवेत्कार्यं तद्वदामि तव प्रिये
    । लोकोपकारकं देवि लौकिकं तु विवर्जयेत् ॥ ॥ लौकिकाद्धर्मतो याति ज्ञानहीनो भवार्णवे । ज्ञानभावे च यत्सर्वं
    कर्म निष्कर्म शाम्यति ॥ ॥ इमां तु भक्तिभावेन पठेद्वै शृणुयादपि । लिखित्वा यत्प्रदानेन तत्सर्वं फलमश्नुते
    ॥ ॥ गुरुगीतामिमां देवि हृदि नित्यं विभावय । महाव्याधिगतैर्दुःखैः सर्वदा प्रजपेन्मुदा ॥ ॥ गुरुगीताक्षरैकैकं
    मन्त्रराजमिदं प्रिये । अन्ये च विविधाः मन्त्राः कलां नार्हन्ति षोडशीम् ॥ ॥ अनन्त फलमाप्नोति गुरुगीता
    जपेन तु । सर्वपापहरा देवि सर्वदारिद्र्यनाशिनी ॥ ॥ अकालमृत्युहरा चैव सर्वसङ्कटनाशिनी । यक्षराक्षसभूतादिचोरव्याघ्रविघातिनी
    ॥ ॥ सर्वोपद्रवकुष्ठादिदुष्टदोषनिवारिणी । यत्फलं गुरुसान्निध्यात्तत्फलं पठनाद्भवेत् ॥ ॥ महाव्याधिहरा
    सर्वविभूतेः सिद्धिदा भवेत् । अथवा मोहने वश्ये स्वयमेव जपेत्सदा ॥ ॥ कुशदूर्वासने देवि ह्यासने शुभ्रकम्बले
    । उपविश्य ततो देवि जपेदेकाग्रमानसः ॥ ॥ शुक्लं सर्वत्र वै प्रोक्तं वश्ये रक्तासनं प्रिये । पद्मासने
    जपेन्नित्यं शान्तिवश्यकरं परम् ॥ ॥ वस्त्रासने च दारिद्र्यं पाषाणे रोगसम्भवः । मेदिन्यां दुःखमाप्नोति
    काष्ठे भवति निष्फलम् ॥ ॥ कृष्णाजिने ज्ञानसिद्धिः मोक्षश्रीर्व्याघ्रचर्मणि । कुशासने ज्ञानसिद्धिः सर्वसिद्धिस्तु
    कम्बले ॥ ॥ आग्नेय्यां कर्षणं चैव वायव्यां शत्रुनाशनम् । नैरृत्यां दर्शनं चैव ईशान्यां ज्ञानमेव च ॥
    ॥ उदङ्मुखः शान्तिजाप्ये वश्ये पूर्वमुखस्तथा । याम्ये तु मारणं प्रोक्तं पश्चिमे च धनागमः ॥ ॥ मोहनं
    सर्वभूतानां बन्धमोक्षकरं परम् । देवराजप्रियकरं राजानं वशमानयेत् ॥ ॥ मुखस्तम्भकरं चैव गुणानां च विवर्धनम्
    । दुष्कर्मनाशनं चैव तथा सत्कर्मसिद्धिदम् ॥ ॥ असिद्धं साधयेत्कार्यं नवग्रहभयापहम् । दुःस्वप्ननाशनं
    चैव सुस्वप्नफलदायकम् ॥ ॥ मोहशान्तिकरं चैव बन्धमोक्षकरं परम् । स्वरूपज्ञाननिलयं गीताशास्त्रमिदं शिवे
    ॥ ॥ यं यं चिन्तयते कामं तं तं प्राप्नोति निश्चयम् । नित्यं सौभाग्यदं पुण्यं तापत्रयकुलापहम् ॥ ॥ सर्वशान्तिकरं
    नित्यं तथा वन्ध्या सुपुत्रदम् । अवैधव्यकरं स्त्रीणां सौभाग्यस्य विवर्धनम् ॥ ॥ आयुरारोग्यमैश्वर्यं
    पुत्रपौत्रविवर्धनम् । निष्कामजापी विधवा पठेन्मोक्षमवाप्नुयात् ॥ ॥ अवैधव्यं सकामा तु लभते चान्यजन्मनि
    । सर्वदुःखमयं विघ्नं नाशयेत्तापहारकम् ॥ ॥ सर्वपापप्रशमनं धर्मकामार्थमोक्षदम् । यं यं चिन्तयते कामं
    तं तं प्राप्नोति निश्चितम् ॥ ॥ काम्यानां कामधेनुर्वै कल्पते कल्पपादपः । चिन्तामणिश्चिन्तितस्य सर्वमङ्गलकारकम्
    ॥ ॥ लिखित्वा पूजयेद्यस्तु मोक्षश्रियमवाप्नुयात् । गुरूभक्तिर्विशेषेण जायते हृदि सर्वदा ॥ ॥ जपन्ति
    शाक्ताः सौराश्च गाणपत्याश्च वैष्णवाः । शैवाः पाशुपताः सर्वे सत्यं सत्यं न संशयः ॥ ॥ इति श्रीस्कन्दपुराणे
    उत्तरखण्डे उमामहेश्वर संवादे श्री गुरुगीतायां द्वितीयोऽध्यायः ॥
