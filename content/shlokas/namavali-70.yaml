id: namavali-70
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: shrisubrahmanyashodashanamavalih shriguha evam subrahmanya shodashanamavalih | jnanashaktidharaya
    namah | skandaya | devasenapataye | subrahmanyaya | gajarudhaya | sharakananasambhavaya | kartikeyaya
    | kumaraya | shanmukhaya | tarakantakaya | senanye | brahmashastre | vallikalyana sundaraya | balaya
    | krauncabhettre | shikhivahanaya namah | iti shrisubrahmanyashodashanamavalih samapta |
  devanagari: श्रीसुब्रह्मण्यषोडशनामावलिः श्रीगुह एवं सुब्रह्मण्य षोडशनामावलिः । ज्ञानशक्तिधराय नमः ।
    स्कन्दाय । देवसेनापतये । सुब्रह्मण्याय । गजारूढाय । शरकाननसम्भवाय । कार्तिकेयाय । कुमाराय । षण्मुखाय
    । तारकान्तकाय । सेनान्ये । ब्रह्मशास्त्रे । वल्लीकल्याण सुन्दराय । बालाय । क्रौञ्चभेत्त्रे । शिखिवाहनाय
    नमः । इति श्रीसुब्रह्मण्यषोडशनामावलिः समाप्ता ।
meaning: {}
