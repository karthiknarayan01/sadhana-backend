id: tyagaraja-keerthanas-brova-bharama
category: stotram
name:
  english: Tyagaraja Keerthanas Brova Bharama
content:
  english: deshadi pallavi brova bharama raghu rama bhuvanamèlla nevai nannòkani anupallavi shri vasudeva
    anda kotla kukshini uncukoleda kalashambudhilo dayato amarulakai adi gaka gopikalakai kòndalètta leda
    karunakara tyagarajuni brova bharama raghu rama bhuvanamèlla nevai
  devanagari: देशादि पल्लवि ब्रोव भारमा रघु राम भुवनमॆल्ल नेवै नन्नॊकनि अनुपल्लवि श्री वासुदेव अण्ड कोट्ल
    कुक्षिनि उञ्चुकोलेदा कलशाम्बुधिलो दयतो अमरुलकै अदि गाक गोपिकलकै कॊण्डलॆत्त लेदा करुणाकर त्यागराजुनि
    ब्रोव भारमा रघु राम भुवनमॆल्ल नेवै
