id: ekashlokistotramshridharasvami
category: stotram
name:
  english: ekashlokistotramshridharasvami
  devanagari: एकश्लोकीस्तोत्रम्श्रीधरस्वामी
content:
  english: ekashlokistotram advaita sukhavigrahe kathamakam cinmatrarupe jadam namna vyashti samashtito'pi
    janimadrupena karyatmakam | sphurtirnapi vibhatyaham yadi tu kastasmin parashcaparah sarvajnah parameshvaro'pi
    ca tatha kishcijnajivo bhavet || 1|| || iti shrimat paramahamsaparivrajakacarya sadguru bhagavana
    shridharasvamimaharajaviracitam ekashlokistotram sampurnam ||
  devanagari: एकश्लोकीस्तोत्रम् अद्वैत सुखविग्रहे कथमकं चिन्मात्ररूपे जडं नाम्ना व्यष्टि समष्टितोऽपि जनिमद्रूपेण
    कार्यात्मकम् । स्फूर्तिर्नापि विभात्यहं यदि तु कस्तस्मिन् परश्चापरः सर्वज्ञः परमेश्वरोऽपि च तथा किश्चिज्ञजीवो
    भवेत् ॥ १॥ ॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरू भगवान श्रीधरस्वामीमहाराजविरचितं एकश्लोकीस्तोत्रं
    सम्पूर्णम् ॥
meaning: {}
