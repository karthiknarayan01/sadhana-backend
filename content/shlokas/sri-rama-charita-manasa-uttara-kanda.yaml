    कर द्वारा। पाइ न जेहिं परलोक सँवारा ॥ दो सो परत्र दुख पावि सिर धुनि धुनि पछिताइ। कालहि कर्महि ईस्वरहि
    मिथ्या दोष लगाइ ॥ ॥ एहि तन कर फल बिषय न भाई। स्वर्गु स्वल्प अन्त दुखदाई ॥ नर तनु पाइ बिषयँ मन देहीं।
    पलटि सुधा ते सठ बिष लेहीम् ॥ ताहि कबहुँ भल कहि न कोई। गुञ्जा ग्रहि परस मनि खोई ॥ आकर चारि लच्छ चौरासी।
    जोनि भ्रमत यह जिव अबिनासी ॥ फिरत सदा माया कर प्रेरा। काल कर्म सुभाव गुन घेरा ॥ कबहुँक करि करुना नर
    देही। देत ईस बिनु हेतु सनेही ॥ नर तनु भव बारिधि कहुँ बेरो। सन्मुख मरुत अनुग्रह मेरो ॥ करनधार सदगुर
    दृढ़ नावा। दुर्लभ साज सुलभ करि पावा ॥ दो जो न तरै भव सागर नर समाज अस पाइ। सो कृत निन्दक मन्दमति आत्माहन
    गति जाइ ॥ ॥ जौं परलोक इहाँ सुख चहहू। सुनि मम बचन ह्रृदयँ दृढ़ गहहू ॥ सुलभ सुखद मारग यह भाई। भगति मोरि
    पुरान श्रुति गाई ॥ ग्यान अगम प्रत्यूह अनेका। साधन कठिन न मन कहुँ टेका ॥ करत कष्ट बहु पावि कोऊ। भक्ति
    हीन मोहि प्रिय नहिं सोऊ ॥ भक्ति सुतन्त्र सकल सुख खानी। बिनु सतसङ्ग न पावहिं प्रानी ॥ पुन्य पुञ्ज बिनु
    मिलहिं न सन्ता। सतसङ्गति संसृति कर अन्ता ॥ पुन्य एक जग महुँ नहिं दूजा। मन क्रम बचन बिप्र पद पूजा ॥
    सानुकूल तेहि पर मुनि देवा। जो तजि कपटु करि द्विज सेवा ॥ दो औरु एक गुपुत मत सबहि कहुँ कर जोरि। सङ्कर
    भजन बिना नर भगति न पावि मोरि ॥ ॥ कहहु भगति पथ कवन प्रयासा। जोग न मख जप तप उपवासा ॥ सरल सुभाव न मन
    कुटिलाई। जथा लाभ सन्तोष सदाई ॥ मोर दास कहाइ नर आसा। करि तौ कहहु कहा बिस्वासा ॥ बहुत कहुँ का कथा बढ़आई।
    एहि आचरन बस्य मैं भाई ॥ बैर न बिग्रह आस न त्रासा। सुखमय ताहि सदा सब आसा ॥ अनारम्भ अनिकेत अमानी। अनघ
    अरोष दच्छ बिग्यानी ॥ प्रीति सदा सज्जन संसर्गा। तृन सम बिषय स्वर्ग अपबर्गा ॥ भगति पच्छ हठ नहिं सठताई।
    दुष्ट तर्क सब दूरि बहाई ॥ दो मम गुन ग्राम नाम रत गत ममता मद मोह। ता कर सुख सोइ जानि परानन्द सन्दोह
    ॥ ॥ सुनत सुधासम बचन राम के। गहे सबनि पद कृपाधाम के ॥ जननि जनक गुर बन्धु हमारे। कृपा निधान प्रान ते
    प्यारे ॥ तनु धनु धाम राम हितकारी। सब बिधि तुम्ह प्रनतारति हारी ॥ असि सिख तुम्ह बिनु देइ न कोऊ। मातु
    पिता स्वारथ रत ओऊ ॥ हेतु रहित जग जुग उपकारी। तुम्ह तुम्हार सेवक असुरारी ॥ स्वारथ मीत सकल जग माहीं।
    सपनेहुँ प्रभु परमारथ नाहीम् ॥ सबके बचन प्रेम रस साने। सुनि रघुनाथ हृदयँ हरषाने ॥ निज निज गृह गे आयसु
    पाई। बरनत प्रभु बतकही सुहाई ॥ दो उमा अवधबासी नर नारि कृतारथ रूप। ब्रह्म सच्चिदानन्द घन रघुनायक जहँ
    भूप ॥ ॥ एक बार बसिष्ट मुनि आए। जहाँ राम सुखधाम सुहाए ॥ अति आदर रघुनायक कीन्हा। पद पखारि पादोदक लीन्हा
    ॥ राम सुनहु मुनि कह कर जोरी। कृपासिन्धु बिनती कछु मोरी ॥ देखि देखि आचरन तुम्हारा। होत मोह मम हृदयँ
    अपारा ॥ महिमा अमित बेद नहिं जाना। मैं केहि भाँति कहुँ भगवाना ॥ उपरोहित्य कर्म अति मन्दा। बेद पुरान
    सुमृति कर निन्दा ॥ जब न लेउँ मैं तब बिधि मोही। कहा लाभ आगें सुत तोही ॥ परमातमा ब्रह्म नर रूपा। होइहि
    रघुकुल भूषन भूपा ॥ दो तब मैं हृदयँ बिचारा जोग जग्य ब्रत दान। जा कहुँ करिअ सो पैहुँ धर्म न एहि सम आन
    ॥ ॥ जप तप नियम जोग निज धर्मा। श्रुति सम्भव नाना सुभ कर्मा ॥ ग्यान दया दम तीरथ मज्जन। जहँ लगि धर्म
    कहत श्रुति सज्जन ॥ आगम निगम पुरान अनेका। पढ़ए सुने कर फल प्रभु एका ॥ तब पद पङ्कज प्रीति निरन्तर। सब
    साधन कर यह फल सुन्दर ॥ छूटि मल कि मलहि के धोएँ। घृत कि पाव कोइ बारि बिलोएँ ॥ प्रेम भगति जल बिनु रघुराई।
    अभिअन्तर मल कबहुँ न जाई ॥ सोइ सर्बग्य तग्य सोइ पण्डित। सोइ गुन गृह बिग्यान अखण्डित ॥ दच्छ सकल लच्छन
    जुत सोई। जाकें पद सरोज रति होई ॥ दो नाथ एक बर मागुँ राम कृपा करि देहु। जन्म जन्म प्रभु पद कमल कबहुँ
    घटै जनि नेहु ॥ ॥ अस कहि मुनि बसिष्ट गृह आए। कृपासिन्धु के मन अति भाए ॥ हनूमान भरतादिक भ्राता। सङ्ग
    लिए सेवक सुखदाता ॥ पुनि कृपाल पुर बाहेर गे। गज रथ तुरग मगावत भे ॥ देखि कृपा करि सकल सराहे। दिए उचित
    जिन्ह जिन्ह तेइ चाहे ॥ हरन सकल श्रम प्रभु श्रम पाई। गे जहाँ सीतल अवँराई ॥ भरत दीन्ह निज बसन डसाई।
    बैठे प्रभु सेवहिं सब भाई ॥ मारुतसुत तब मारूत करी। पुलक बपुष लोचन जल भरी ॥ हनूमान सम नहिं बड़भागी।
    नहिं कौ राम चरन अनुरागी ॥ गिरिजा जासु प्रीति सेवकाई। बार बार प्रभु निज मुख गाई ॥ दो तेहिं अवसर मुनि
    नारद आए करतल बीन। गावन लगे राम कल कीरति सदा नबीन ॥ ॥ मामवलोकय पङ्कज लोचन। कृपा बिलोकनि सोच बिमोचन
    ॥ नील तामरस स्याम काम अरि। हृदय कञ्ज मकरन्द मधुप हरि ॥ जातुधान बरूथ बल भञ्जन। मुनि सज्जन रञ्जन अघ
    गञ्जन ॥ भूसुर ससि नव बृन्द बलाहक। असरन सरन दीन जन गाहक ॥ भुज बल बिपुल भार महि खण्डित। खर दूषन बिराध
    बध पण्डित ॥ रावनारि सुखरूप भूपबर। जय दसरथ कुल कुमुद सुधाकर ॥ सुजस पुरान बिदित निगमागम। गावत सुर मुनि
    सन्त समागम ॥ कारुनीक ब्यलीक मद खण्डन। सब बिधि कुसल कोसला मण्डन ॥ कलि मल मथन नाम ममताहन। तुलसीदास प्रभु
    पाहि प्रनत जन ॥ दो प्रेम सहित मुनि नारद बरनि राम गुन ग्राम। सोभासिन्धु हृदयँ धरि गे जहाँ बिधि धाम
    ॥ ॥ गिरिजा सुनहु बिसद यह कथा। मैं सब कही मोरि मति जथा ॥ राम चरित सत कोटि अपारा। श्रुति सारदा न बरनै
    पारा ॥ राम अनन्त अनन्त गुनानी। जन्म कर्म अनन्त नामानी ॥ जल सीकर महि रज गनि जाहीं। रघुपति चरित न बरनि
    सिराहीम् ॥ बिमल कथा हरि पद दायनी। भगति होइ सुनि अनपायनी ॥ उमा कहिउँ सब कथा सुहाई। जो भुसुण्डि खगपतिहि
    सुनाई ॥ कछुक राम गुन कहेउँ बखानी। अब का कहौं सो कहहु भवानी ॥ सुनि सुभ कथा उमा हरषानी। बोली अति बिनीत
    मृदु बानी ॥ धन्य धन्य मैं धन्य पुरारी। सुनेउँ राम गुन भव भय हारी ॥ दो तुम्हरी कृपाँ कृपायतन अब कृतकृत्य
    न मोह। जानेउँ राम प्रताप प्रभु चिदानन्द सन्दोह ॥ ॥ नाथ तवानन ससि स्रवत कथा सुधा रघुबीर। श्रवन पुटन्हि
    मन पान करि नहिं अघात मतिधीर ॥ ॥ राम चरित जे सुनत अघाहीं। रस बिसेष जाना तिन्ह नाहीम् ॥ जीवनमुक्त महामुनि
    जेऊ। हरि गुन सुनहीं निरन्तर तेऊ ॥ भव सागर चह पार जो पावा। राम कथा ता कहँ दृढ़ नावा ॥ बिषिन्ह कहँ पुनि
    हरि गुन ग्रामा। श्रवन सुखद अरु मन अभिरामा ॥ श्रवनवन्त अस को जग माहीं। जाहि न रघुपति चरित सोहाहीम्
    ॥ ते जड़ जीव निजात्मक घाती। जिन्हहि न रघुपति कथा सोहाती ॥ हरिचरित्र मानस तुम्ह गावा। सुनि मैं नाथ
    अमिति सुख पावा ॥ तुम्ह जो कही यह कथा सुहाई। कागभसुण्डि गरुड़ प्रति गाई ॥ दो बिरति ग्यान बिग्यान दृढ़
    राम चरन अति नेह। बायस तन रघुपति भगति मोहि परम सन्देह ॥ ॥ नर सहस्र महँ सुनहु पुरारी। कौ एक होइ धर्म
    ब्रतधारी ॥ धर्मसील कोटिक महँ कोई। बिषय बिमुख बिराग रत होई ॥ कोटि बिरक्त मध्य श्रुति कही। सम्यक ग्यान
    सकृत कौ लही ॥ ग्यानवन्त कोटिक महँ कोऊ। जीवनमुक्त सकृत जग सोऊ ॥ तिन्ह सहस्र महुँ सब सुख खानी। दुर्लभ
    ब्रह्मलीन बिग्यानी ॥ धर्मसील बिरक्त अरु ग्यानी। जीवनमुक्त ब्रह्मपर प्रानी ॥ सब ते सो दुर्लभ सुरराया।
    राम भगति रत गत मद माया ॥ सो हरिभगति काग किमि पाई। बिस्वनाथ मोहि कहहु बुझाई ॥ दो राम परायन ग्यान रत
    गुनागार मति धीर। नाथ कहहु केहि कारन पायु काक सरीर ॥ ॥ यह प्रभु चरित पवित्र सुहावा। कहहु कृपाल काग
    कहँ पावा ॥ तुम्ह केहि भाँति सुना मदनारी। कहहु मोहि अति कौतुक भारी ॥ गरुड़ महाग्यानी गुन रासी। हरि
    सेवक अति निकट निवासी ॥ तेहिं केहि हेतु काग सन जाई। सुनी कथा मुनि निकर बिहाई ॥ कहहु कवन बिधि भा सम्बादा।
    दौ हरिभगत काग उरगादा ॥ गौरि गिरा सुनि सरल सुहाई। बोले सिव सादर सुख पाई ॥ धन्य सती पावन मति तोरी। रघुपति
    चरन प्रीति नहिं थोरी ॥ सुनहु परम पुनीत इतिहासा। जो सुनि सकल लोक भ्रम नासा ॥ उपजि राम चरन बिस्वासा।
    भव निधि तर नर बिनहिं प्रयासा ॥ दो ऐसिअ प्रस्न बिहङ्गपति कीन्ह काग सन जाइ। सो सब सादर कहिहुँ सुनहु
    उमा मन लाइ ॥ ॥ मैं जिमि कथा सुनी भव मोचनि। सो प्रसङ्ग सुनु सुमुखि सुलोचनि ॥ प्रथम दच्छ गृह तव अवतारा।
    सती नाम तब रहा तुम्हारा ॥ दच्छ जग्य तब भा अपमाना। तुम्ह अति क्रोध तजे तब प्राना ॥ मम अनुचरन्ह कीन्ह
    मख भङ्गा। जानहु तुम्ह सो सकल प्रसङ्गा ॥ तब अति सोच भयु मन मोरें। दुखी भयुँ बियोग प्रिय तोरेम् ॥ सुन्दर
    बन गिरि सरित तड़आगा। कौतुक देखत फिरुँ बेरागा ॥ गिरि सुमेर उत्तर दिसि दूरी। नील सैल एक सुन्दर भूरी
    ॥ तासु कनकमय सिखर सुहाए। चारि चारु मोरे मन भाए ॥ तिन्ह पर एक एक बिटप बिसाला। बट पीपर पाकरी रसाला ॥
    सैलोपरि सर सुन्दर सोहा। मनि सोपान देखि मन मोहा ॥ दो सीतल अमल मधुर जल जलज बिपुल बहुरङ्ग। कूजत कल रव
    हंस गन गुञ्जत मजुंल भृङ्ग ॥ ॥ तेहिं गिरि रुचिर बसि खग सोई। तासु नास कल्पान्त न होई ॥ माया कृत गुन
    दोष अनेका। मोह मनोज आदि अबिबेका ॥ रहे ब्यापि समस्त जग माहीं। तेहि गिरि निकट कबहुँ नहिं जाहीम् ॥ तहँ
    बसि हरिहि भजि जिमि कागा। सो सुनु उमा सहित अनुरागा ॥ पीपर तरु तर ध्यान सो धरी। जाप जग्य पाकरि तर करी
    ॥ आँब छाहँ कर मानस पूजा। तजि हरि भजनु काजु नहिं दूजा ॥ बर तर कह हरि कथा प्रसङ्गा। आवहिं सुनहिं अनेक
    बिहङ्गा ॥ राम चरित बिचीत्र बिधि नाना। प्रेम सहित कर सादर गाना ॥ सुनहिं सकल मति बिमल मराला। बसहिं निरन्तर
    जे तेहिं ताला ॥ जब मैं जाइ सो कौतुक देखा। उर उपजा आनन्द बिसेषा ॥ दो तब कछु काल मराल तनु धरि तहँ कीन्ह
    निवास। सादर सुनि रघुपति गुन पुनि आयुँ कैलास ॥ ॥ गिरिजा कहेउँ सो सब इतिहासा। मैं जेहि समय गयुँ खग पासा
    ॥ अब सो कथा सुनहु जेही हेतू। गयु काग पहिं खग कुल केतू ॥ जब रघुनाथ कीन्हि रन क्रीड़आ। समुझत चरित होति
    मोहि ब्रीड़आ ॥ इन्द्रजीत कर आपु बँधायो। तब नारद मुनि गरुड़ पठायो ॥ बन्धन काटि गयो उरगादा। उपजा हृदयँ
    प्रचण्ड बिषादा ॥ प्रभु बन्धन समुझत बहु भाँती। करत बिचार उरग आराती ॥ ब्यापक ब्रह्म बिरज बागीसा। माया
    मोह पार परमीसा ॥ सो अवतार सुनेउँ जग माहीं। देखेउँ सो प्रभाव कछु नाहीम् ॥ दो भव बन्धन ते छूटहिं नर
    जपि जा कर नाम। खर्च निसाचर बाँधेउ नागपास सोइ राम ॥ ॥ नाना भाँति मनहि समुझावा। प्रगट न ग्यान हृदयँ
    भ्रम छावा ॥ खेद खिन्न मन तर्क बढ़आई। भयु मोहबस तुम्हरिहिं नाई ॥ ब्याकुल गयु देवरिषि पाहीं। कहेसि जो
    संसय निज मन माहीम् ॥ सुनि नारदहि लागि अति दाया। सुनु खग प्रबल राम कै माया ॥ जो ग्यानिन्ह कर चित अपहरी।
    बरिआई बिमोह मन करी ॥ जेहिं बहु बार नचावा मोही। सोइ ब्यापी बिहङ्गपति तोही ॥ महामोह उपजा उर तोरें। मिटिहि
    न बेगि कहें खग मोरेम् ॥ चतुरानन पहिं जाहु खगेसा। सोइ करेहु जेहि होइ निदेसा ॥ दो अस कहि चले देवरिषि
    करत राम गुन गान। हरि माया बल बरनत पुनि पुनि परम सुजान ॥ ॥ तब खगपति बिरञ्चि पहिं गयू। निज सन्देह सुनावत
    भयू ॥ सुनि बिरञ्चि रामहि सिरु नावा। समुझि प्रताप प्रेम अति छावा ॥ मन महुँ करि बिचार बिधाता। माया बस
    कबि कोबिद ग्याता ॥ हरि माया कर अमिति प्रभावा। बिपुल बार जेहिं मोहि नचावा ॥ अग जगमय जग मम उपराजा। नहिं
    आचरज मोह खगराजा ॥ तब बोले बिधि गिरा सुहाई। जान महेस राम प्रभुताई ॥ बैनतेय सङ्कर पहिं जाहू। तात अनत
    पूछहु जनि काहू ॥ तहँ होइहि तव संसय हानी। चलेउ बिहङ्ग सुनत बिधि बानी ॥ दो परमातुर बिहङ्गपति आयु तब
    मो पास। जात रहेउँ कुबेर गृह रहिहु उमा कैलास ॥ ॥ तेहिं मम पद सादर सिरु नावा। पुनि आपन सन्देह सुनावा
    ॥ सुनि ता करि बिनती मृदु बानी। परेम सहित मैं कहेउँ भवानी ॥ मिलेहु गरुड़ मारग महँ मोही। कवन भाँति समुझावौं
    तोही ॥ तबहि होइ सब संसय भङ्गा। जब बहु काल करिअ सतसङ्गा ॥ सुनिअ तहाँ हरि कथा सुहाई। नाना भाँति मुनिन्ह
    जो गाई ॥ जेहि महुँ आदि मध्य अवसाना। प्रभु प्रतिपाद्य राम भगवाना ॥ नित हरि कथा होत जहँ भाई। पठवुँ तहाँ
    सुनहि तुम्ह जाई ॥ जाइहि सुनत सकल सन्देहा। राम चरन होइहि अति नेहा ॥ दो बिनु सतसङ्ग न हरि कथा तेहि बिनु
    मोह न भाग। मोह गेँ बिनु राम पद होइ न दृढ़ अनुराग ॥ ॥ मिलहिं न रघुपति बिनु अनुरागा। किएँ जोग तप ग्यान
    बिरागा ॥ उत्तर दिसि सुन्दर गिरि नीला। तहँ रह काकभुसुण्डि सुसीला ॥ राम भगति पथ परम प्रबीना। ग्यानी
    गुन गृह बहु कालीना ॥ राम कथा सो कहि निरन्तर। सादर सुनहिं बिबिध बिहङ्गबर ॥ जाइ सुनहु तहँ हरि गुन भूरी।
    होइहि मोह जनित दुख दूरी ॥ मैं जब तेहि सब कहा बुझाई। चलेउ हरषि मम पद सिरु नाई ॥ ताते उमा न मैं समुझावा।
    रघुपति कृपाँ मरमु मैं पावा ॥ होइहि कीन्ह कबहुँ अभिमाना। सो खौवै चह कृपानिधाना ॥ कछु तेहि ते पुनि मैं
    नहिं राखा। समुझि खग खगही कै भाषा ॥ प्रभु माया बलवन्त भवानी। जाहि न मोह कवन अस ग्यानी ॥ दो ग्यानि भगत
    सिरोमनि त्रिभुवनपति कर जान। ताहि मोह माया नर पावँर करहिं गुमान ॥ अट्ठाईसवाँ विश्राम सिव बिरञ्चि कहुँ
    मोहि को है बपुरा आन। अस जियँ जानि भजहिं मुनि माया पति भगवान ॥ ॥ गयु गरुड़ जहँ बसि भुसुण्डा। मति अकुण्ठ
    हरि भगति अखण्डा ॥ देखि सैल प्रसन्न मन भयू। माया मोह सोच सब गयू ॥ करि तड़आग मज्जन जलपाना। बट तर गयु
    हृदयँ हरषाना ॥ बृद्ध बृद्ध बिहङ्ग तहँ आए। सुनै राम के चरित सुहाए ॥ कथा अरम्भ करै सोइ चाहा। तेही समय
    गयु खगनाहा ॥ आवत देखि सकल खगराजा। हरषेउ बायस सहित समाजा ॥ अति आदर खगपति कर कीन्हा। स्वागत पूछि सुआसन
    दीन्हा ॥ करि पूजा समेत अनुरागा। मधुर बचन तब बोलेउ कागा ॥ दो नाथ कृतारथ भयुँ मैं तव दरसन खगराज। आयसु
    देहु सो करौं अब प्रभु आयहु केहि काज ॥ ॥ सदा कृतारथ रूप तुम्ह कह मृदु बचन खगेस। जेहि कै अस्तुति सादर
    निज मुख कीन्हि महेस ॥ ॥ सुनहु तात जेहि कारन आयुँ। सो सब भयु दरस तव पायुँ ॥ देखि परम पावन तव आश्रम।
    गयु मोह संसय नाना भ्रम ॥ अब श्रीराम कथा अति पावनि। सदा सुखद दुख पुञ्ज नसावनि ॥ सादर तात सुनावहु मोही।
    बार बार बिनवुँ प्रभु तोही ॥ सुनत गरुड़ कै गिरा बिनीता। सरल सुप्रेम सुखद सुपुनीता ॥ भयु तासु मन परम
    उछाहा। लाग कहै रघुपति गुन गाहा ॥ प्रथमहिं अति अनुराग भवानी। रामचरित सर कहेसि बखानी ॥ पुनि नारद कर
    मोह अपारा। कहेसि बहुरि रावन अवतारा ॥ प्रभु अवतार कथा पुनि गाई। तब सिसु चरित कहेसि मन लाई ॥ दो बालचरित
    कहिं बिबिध बिधि मन महँ परम उछाह। रिषि आगवन कहेसि पुनि श्री रघुबीर बिबाह ॥ ॥ बहुरि राम अभिषेक प्रसङ्गा।
    पुनि नृप बचन राज रस भङ्गा ॥ पुरबासिंह कर बिरह बिषादा। कहेसि राम लछिमन सम्बादा ॥ बिपिन गवन केवट अनुरागा।
    सुरसरि उतरि निवास प्रयागा ॥ बालमीक प्रभु मिलन बखाना। चित्रकूट जिमि बसे भगवाना ॥ सचिवागवन नगर नृप मरना।
    भरतागवन प्रेम बहु बरना ॥ करि नृप क्रिया सङ्ग पुरबासी। भरत गे जहँ प्रभु सुख रासी ॥ पुनि रघुपति बहु
    बिधि समुझाए। लै पादुका अवधपुर आए ॥ भरत रहनि सुरपति सुत करनी। प्रभु अरु अत्रि भेण्ट पुनि बरनी ॥ दो
    कहि बिराध बध जेहि बिधि देह तजी सरभङ्ग ॥ बरनि सुतीछन प्रीति पुनि प्रभु अगस्ति सतसङ्ग ॥ ॥ कहि दण्डक
    बन पावनताई। गीध मित्री पुनि तेहिं गाई ॥ पुनि प्रभु पञ्चवटीं कृत बासा। भञ्जी सकल मुनिन्ह की त्रासा
    ॥ पुनि लछिमन उपदेस अनूपा। सूपनखा जिमि कीन्हि कुरूपा ॥ खर दूषन बध बहुरि बखाना। जिमि सब मरमु दसानन जाना
    ॥ दसकन्धर मारीच बतकहीं। जेहि बिधि भी सो सब तेहिं कही ॥ पुनि माया सीता कर हरना। श्रीरघुबीर बिरह कछु
    बरना ॥ पुनि प्रभु गीध क्रिया जिमि कीन्ही। बधि कबन्ध सबरिहि गति दीन्ही ॥ बहुरि बिरह बरनत रघुबीरा। जेहि
    बिधि गे सरोबर तीरा ॥ दो प्रभु नारद सम्बाद कहि मारुति मिलन प्रसङ्ग। पुनि सुग्रीव मिताई बालि प्रान कर
    भङ्ग ॥ ॥ कपिहि तिलक करि प्रभु कृत सैल प्रबरषन बास। बरनन बर्षा सरद अरु राम रोष कपि त्रास ॥ ॥ जेहि बिधि
    कपिपति कीस पठाए। सीता खोज सकल दिसि धाए ॥ बिबर प्रबेस कीन्ह जेहि भाँती। कपिन्ह बहोरि मिला सम्पाती ॥
    सुनि सब कथा समीरकुमारा। नाघत भयु पयोधि अपारा ॥ लङ्काँ कपि प्रबेस जिमि कीन्हा। पुनि सीतहि धीरजु जिमि
    दीन्हा ॥ बन उजारि रावनहि प्रबोधी। पुर दहि नाघेउ बहुरि पयोधी ॥ आए कपि सब जहँ रघुराई। बैदेही कि कुसल
    सुनाई ॥ सेन समेति जथा रघुबीरा। उतरे जाइ बारिनिधि तीरा ॥ मिला बिभीषन जेहि बिधि आई। सागर निग्रह कथा
    सुनाई ॥ दो सेतु बाँधि कपि सेन जिमि उतरी सागर पार। गयु बसीठी बीरबर जेहि बिधि बालिकुमार ॥ ॥ निसिचर कीस
    लराई बरनिसि बिबिध प्रकार। कुम्भकरन घननाद कर बल पौरुष सङ्घार ॥ ॥ निसिचर निकर मरन बिधि नाना। रघुपति
    रावन समर बखाना ॥ रावन बध मन्दोदरि सोका। राज बिभीषण देव असोका ॥ सीता रघुपति मिलन बहोरी। सुरन्ह कीन्ह
    अस्तुति कर जोरी ॥ पुनि पुष्पक चढ़इ कपिन्ह समेता। अवध चले प्रभु कृपा निकेता ॥ जेहि बिधि राम नगर निज
    आए। बायस बिसद चरित सब गाए ॥ कहेसि बहोरि राम अभिषैका। पुर बरनत नृपनीति अनेका ॥ कथा समस्त भुसुण्ड बखानी।
    जो मैं तुम्ह सन कही भवानी ॥ सुनि सब राम कथा खगनाहा। कहत बचन मन परम उछाहा ॥ सो गयु मोर सन्देह सुनेउँ
    सकल रघुपति चरित। भयु राम पद नेह तव प्रसाद बायस तिलक ॥ ॥ मोहि भयु अति मोह प्रभु बन्धन रन महुँ निरखि।
    चिदानन्द सन्दोह राम बिकल कारन कवन। ॥ देखि चरित अति नर अनुसारी। भयु हृदयँ मम संसय भारी ॥ सोइ भ्रम अब
    हित करि मैं माना। कीन्ह अनुग्रह कृपानिधाना ॥ जो अति आतप ब्याकुल होई। तरु छाया सुख जानि सोई ॥ जौं नहिं
    होत मोह अति मोही। मिलतेउँ तात कवन बिधि तोही ॥ सुनतेउँ किमि हरि कथा सुहाई। अति बिचित्र बहु बिधि तुम्ह
    गाई ॥ निगमागम पुरान मत एहा। कहहिं सिद्ध मुनि नहिं सन्देहा ॥ सन्त बिसुद्ध मिलहिं परि तेही। चितवहिं
    राम कृपा करि जेही ॥ राम कृपाँ तव दरसन भयू। तव प्रसाद सब संसय गयू ॥ दो सुनि बिहङ्गपति बानी सहित बिनय
    अनुराग। पुलक गात लोचन सजल मन हरषेउ अति काग ॥ ॥ श्रोता सुमति सुसील सुचि कथा रसिक हरि दास। पाइ उमा अति
    गोप्यमपि सज्जन करहिं प्रकास ॥ ॥ बोलेउ काकभसुण्ड बहोरी। नभग नाथ पर प्रीति न थोरी ॥ सब बिधि नाथ पूज्य
    तुम्ह मेरे। कृपापात्र रघुनायक केरे ॥ तुम्हहि न संसय मोह न माया। मो पर नाथ कीन्ह तुम्ह दाया ॥ पठि मोह
    मिस खगपति तोही। रघुपति दीन्हि बड़आई मोही ॥ तुम्ह निज मोह कही खग साईं। सो नहिं कछु आचरज गोसाईम् ॥ नारद
    भव बिरञ्चि सनकादी। जे मुनिनायक आतमबादी ॥ मोह न अन्ध कीन्ह केहि केही। को जग काम नचाव न जेही ॥ तृस्नाँ
    केहि न कीन्ह बौराहा। केहि कर हृदय क्रोध नहिं दाहा ॥ दो ग्यानी तापस सूर कबि कोबिद गुन आगार। केहि कै
    लौभ बिडम्बना कीन्हि न एहिं संसार ॥ ॥ श्री मद बक्र न कीन्ह केहि प्रभुता बधिर न काहि। मृगलोचनि के नैन
    सर को अस लाग न जाहि ॥ ॥ गुन कृत सन्यपात नहिं केही। कौ न मान मद तजेउ निबेही ॥ जोबन ज्वर केहि नहिं बलकावा।
    ममता केहि कर जस न नसावा ॥ मच्छर काहि कलङ्क न लावा। काहि न सोक समीर डोलावा ॥ चिन्ता साँपिनि को नहिं
    खाया। को जग जाहि न ब्यापी माया ॥ कीट मनोरथ दारु सरीरा। जेहि न लाग घुन को अस धीरा ॥ सुत बित लोक ईषना
    तीनी। केहि के मति इन्ह कृत न मलीनी ॥ यह सब माया कर परिवारा। प्रबल अमिति को बरनै पारा ॥ सिव चतुरानन
    जाहि डेराहीं। अपर जीव केहि लेखे माहीम् ॥ दो ब्यापि रहेउ संसार महुँ माया कटक प्रचण्ड ॥ सेनापति कामादि
    भट दम्भ कपट पाषण्ड ॥ ॥ सो दासी रघुबीर कै समुझें मिथ्या सोपि। छूट न राम कृपा बिनु नाथ कहुँ पद रोऽपि
    ॥ ॥ जो माया सब जगहि नचावा। जासु चरित लखि काहुँ न पावा ॥ सोइ प्रभु भ्रू बिलास खगराजा। नाच नटी इव सहित
    समाजा ॥ सोइ सच्चिदानन्द घन रामा। अज बिग्यान रूपो बल धामा ॥ ब्यापक ब्याप्य अखण्ड अनन्ता। अखिल अमोघसक्ति
    भगवन्ता ॥ अगुन अदभ्र गिरा गोतीता। सबदरसी अनवद्य अजीता ॥ निर्मम निराकार निरमोहा। नित्य निरञ्जन सुख
    सन्दोहा ॥ प्रकृति पार प्रभु सब उर बासी। ब्रह्म निरीह बिरज अबिनासी ॥ इहाँ मोह कर कारन नाहीं। रबि सन्मुख
    तम कबहुँ कि जाहीम् ॥ दो भगत हेतु भगवान प्रभु राम धरेउ तनु भूप। किए चरित पावन परम प्राकृत नर अनुरूप
    ॥ ॥ जथा अनेक बेष धरि नृत्य करि नट कोइ। सोइ सोइ भाव देखावि आपुन होइ न सोइ ॥ ॥ असि रघुपति लीला उरगारी।
    दनुज बिमोहनि जन सुखकारी ॥ जे मति मलिन बिषयबस कामी। प्रभु मोह धरहिं इमि स्वामी ॥ नयन दोष जा कहँ जब
    होई। पीत बरन ससि कहुँ कह सोई ॥ जब जेहि दिसि भ्रम होइ खगेसा। सो कह पच्छिम उयु दिनेसा ॥ नौकारूढ़ चलत
    जग देखा। अचल मोह बस आपुहि लेखा ॥ बालक भ्रमहिं न भ्रमहिं गृहादीं। कहहिं परस्पर मिथ्याबादी ॥ हरि बिषिक
    अस मोह बिहङ्गा। सपनेहुँ नहिं अग्यान प्रसङ्गा ॥ मायाबस मतिमन्द अभागी। हृदयँ जमनिका बहुबिधि लागी ॥ ते
    सठ हठ बस संसय करहीं। निज अग्यान राम पर धरहीम् ॥ दो काम क्रोध मद लोभ रत गृहासक्त दुखरूप। ते किमि जानहिं
    रघुपतिहि मूढ़ परे तम कूप ॥ ॥ निर्गुन रूप सुलभ अति सगुन जान नहिं कोइ। सुगम अगम नाना चरित सुनि मुनि
    मन भ्रम होइ ॥ ॥ सुनु खगेस रघुपति प्रभुताई। कहुँ जथामति कथा सुहाई ॥ जेहि बिधि मोह भयु प्रभु मोही। सौ
    सब कथा सुनावुँ तोही ॥ राम कृपा भाजन तुम्ह ताता। हरि गुन प्रीति मोहि सुखदाता ॥ ताते नहिं कछु तुम्हहिं
    दुरावुँ। परम रहस्य मनोहर गावुँ ॥ सुनहु राम कर सहज सुभ् । जन अभिमान न राखहिं क् ॥ संसृत मूल सूलप्रद
    नाना। सकल सोक दायक अभिमाना ॥ ताते करहिं कृपानिधि दूरी। सेवक पर ममता अति भूरी ॥ जिमि सिसु तन ब्रन होइ
    गोसाई। मातु चिराव कठिन की नाईम् ॥ दो जदपि प्रथम दुख पावि रोवि बाल अधीर। ब्याधि नास हित जननी गनति न
    सो सिसु पीर ॥ ॥ तिमि रघुपति निज दासकर हरहिं मान हित लागि। तुलसिदास ऐसे प्रभुहि कस न भजहु भ्रम त्यागि
    ॥ ॥ राम कृपा आपनि जड़ताई। कहुँ खगेस सुनहु मन लाई ॥ जब जब राम मनुज तनु धरहीं। भक्त हेतु लील बहु करहीम्
