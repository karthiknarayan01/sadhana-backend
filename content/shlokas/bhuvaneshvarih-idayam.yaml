id: bhuvaneshvarih-idayam
category: hridaya
name:
  english: bhuvaneshvarihṟidayam
  devanagari: भुवनेश्वरीह्ऱिदयम्
content:
  english: yadajnaya yo jagadadyashesham bibharti samhanti bhavastadante bhajamahe shribhuvaneshvarim
    tam || 5|| jagajjananandakarim jayakhyam yashasvinim yantrasuyajnayonim | jitamitamitrakritaprapancam
    bhajamahe shribhuvaneshvarim tam || 6|| harau prasupte bhuvanatrayante avatarannabhijapadmajanma |
    vidhistato'ndhe vidadhara yatpadam bhajamahe shribhuvaneshvarim tam || 7|| na vidyate kvapi tu janma
    yasya na va sthitih santatikiha yasyah | na va nirodhe'khilakarma yasya bhajamahe shribhuvaneshvarim
    tam || 8|| katakshamokshacaranogravitta niveshitarna karunardracitta | subhaktaye eti samipsitam ya
    bhajamahe shribhuvaneshvarim tam || 9|| yato jagajjanma babhuva yonestadeva madhye pratipati ya va
    | tadatti yante'khilamugrakali bhajamahe shribhuvaneshvarim tam || 10|| sushuptikale janamadhyayantya
    yaya janah svapnamavaiti kincit | prabuddhyate jagrati jiva esha bhajamahe shribhuvaneshvarim tam
    || 11|| dayasphuratkorakatakshalabhannaikatra yasyah pralabhanti siddhah | kavitvamishitvamapi svatantra
    bhajamahe shribhuvaneshvarim tam || 12|| lasanmukhambhoruhamutsphurantam hridi pranidhyaya dishi sphurantah
    | yasyah kripardram pravikashayanti bhajamahe shribhuvaneshvarim tam || 13|| yadanuraganugatalicitrashcirantanapremapariplutangah
    | sunirbhayah santi pramudya yasyah bhajamahe shribhuvaneshvarim tam || 14|| harirvirancirhara ishitarah
    puro'vatishthanti prapannabhangah | yasyah samicchanti sadanukulyam bhajamahe shribhuvaneshvarim tam
    || 15|| manum yadiyam haramagnisamstham tatashca vamashruticandrasaktam | japanti ye syurhi suvanditaste
    bhajamahe shribhuvaneshvarim tam || 16|| prasidatu premarasardracitta sada hi sa shribhuvaneshvavari
    me | kripakatakshena kuberakalpa bhavanti yasyah padabhaktibhajah || 17|| muda supathyam bhuvaneshvariyam
    sada satam stotramidam susevyam | sukhapradam syatkalikalmashaghnam susha
  devanagari: यदाज्ञया यो जगदाद्यशेषं बिभर्ति संहन्ति भवस्तदन्ते भजामहे श्रीभुवनेश्वरीं ताम् ॥ ५॥ जगज्जनानन्दकरीं
    जयाख्यां यशस्विनीं यन्त्रसुयज्ञयोनिम् । जितामितामित्रकृतप्रपञ्चां भजामहे श्रीभुवनेश्वरीं ताम् ॥ ६॥
    हरौ प्रसुप्ते भुवनत्रयान्ते अवातरन्नाभिजपद्मजन्मा । विधिस्ततोऽन्धे विदधार यत्पदं भजामहे श्रीभुवनेश्वरीं
    ताम् ॥ ७॥ न विद्यते क्वापि तु जन्म यस्या न वा स्थितिः सान्ततिकीह यस्याः । न वा निरोधेऽखिलकर्म यस्या
    भजामहे श्रीभुवनेश्वरीं ताम् ॥ ८॥ कटाक्षमोक्षाचरणोग्रवित्ता निवेशितार्णा करुणार्द्रचित्ता । सुभक्तये
    एति समीप्सितं या भजामहे श्रीभुवनेश्वरीं ताम् ॥ ९॥ यतो जगज्जन्म बभूव योनेस्तदेव मध्ये प्रतिपाति या
    वा । तदत्ति यान्तेऽखिलमुग्रकाली भजामहे श्रीभुवनेश्वरीं ताम् ॥ १०॥ सुषुप्तिकाले जनमध्ययन्त्या यया जनः
    स्वप्नमवैति किञ्चित् । प्रबुद्ध्यते जाग्रति जीव एष भजामहे श्रीभुवनेश्वरीं ताम् ॥ ११॥ दयास्फुरत्कोरकटाक्षलाभान्नैकत्र
    यस्याः प्रलभन्ति सिद्धाः । कवित्वमीशित्वमपि स्वतन्त्रा भजामहे श्रीभुवनेश्वरीं ताम् ॥ १२॥ लसन्मुखाम्भोरुहमुत्स्फुरन्तं
    हृदि प्रणिध्याय दिशि स्फुरन्तः । यस्याः कृपार्द्रं प्रविकाशयन्ति भजामहे श्रीभुवनेश्वरीं ताम् ॥ १३॥
    यदानुरागानुगतालिचित्राश्चिरन्तनप्रेमपरिप्लुताङ्गाः । सुनिर्भयाः सन्ति प्रमुद्य यस्याः भजामहे श्रीभुवनेश्वरीं
    ताम् ॥ १४॥ हरिर्विरञ्चिर्हर ईशितारः पुरोऽवतिष्ठन्ति प्रपन्नभङ्गाः । यस्याः समिच्छन्ति सदानुकूल्यं
    भजामहे श्रीभुवनेश्वरीं ताम् ॥ १५॥ मनुं यदीयं हरमग्निसंस्थं ततश्च वामश्रुतिचन्द्रसक्तम् । जपन्ति ये
    स्युर्हि सुवन्दितास्ते भजामहे श्रीभुवनेश्वरीं ताम् ॥ १६॥ प्रसीदतु प्रेमरसार्द्रचित्ता सदा हि सा श्रीभुवनेश्ववरी
    मे । कृपाकटाक्षेण कुबेरकल्पा भवन्ति यस्याः पदभक्तिभाजः ॥ १७॥ मुदा सुपाठ्यं भुवनेश्वरीयं सदा सतां स्तोत्रमिदं
    सुसेव्यम् । सुखप्रदं स्यात्कलिकल्मषघ्नं सुश
