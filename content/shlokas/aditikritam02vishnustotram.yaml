id: aditikritam02vishnustotram
category: stotram
name:
  english: aditikritam02vishnustotram
  devanagari: अदितिकृतं०२विष्णुस्तोत्रम्
content:
  english: aditikritam 2 vishnustotram aditiruvaca | tatah prita jaganmata dhataram jagatam harim | tushtavaditiravyagra
    kritva tatpravanam manah || 5
  devanagari: अदितिकृतं २ विष्णुस्तोत्रम् अदितिरुवाच । ततः प्रीता जगन्माता धातारं जगतां हरिम् । तुष्टावादितिरव्यग्रा
    कृत्वा तत्प्रवणं मनः ॥ ५
meaning: {}
