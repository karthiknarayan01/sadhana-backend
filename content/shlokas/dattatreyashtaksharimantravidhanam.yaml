id: dattatreyashtaksharimantravidhanam
category: mantra
name:
  english: dattatreyashtaksharimantravidhanam
  devanagari: दत्तात्रेयाष्टाक्षरीमन्त्रविधानम्
content:
  english: om asya shridattatreyashtaksharimantrasya bhagavan sadashiva rishih | gayatri chandah | shridattatreya
    devata | jape viniyogah || rishyadinyasah | bhagavate sadashivarishaye namah shirasi | gayatrichandase
    namah mukhe | shridattatreyadevatayai namah hridi | jape viniyogaya namah sarvange || bijakaranyasah
    | om dram angushthabhyam namah | om drim tarjanibhyam svaha | om drum madhyamabhyam vashat | om draim
    anamikabhyam hum | om draum kanishthikabhyam vaushat | om drah karatalakaraprishthabhyam phat || bijashadanganyasah
    | om dram hridayaya namah | om drim shirase svaha | om drum shikhayai vashat | om draim kavacaya hum
    | om draum netratrayaya vaushat | om drah astraya phat || ashtakshara
  devanagari: ॐ अस्य श्रीदत्तात्रेयाष्टाक्षरीमन्त्रस्य भगवान् सदाशिव ऋषिः । गायत्री छन्दः । श्रीदत्तात्रेय
    देवता । जपे विनियोगः ॥ ऋष्यादिन्यासः । भगवते सदाशिवऋषये नमः शिरसि । गायत्रीछन्दसे नमः मुखे । श्रीदत्तात्रेयदेवतायै
    नमः हृदि । जपे विनियोगाय नमः सर्वाङ्गे ॥ बीजकरन्यासः । ॐ द्रां अङ्गुष्ठाभ्यां नमः । ॐ द्रीं तर्जनीभ्यां
    स्वाहा । ॐ द्रूं मध्यमाभ्यां वषट् । ॐ द्रैं अनामिकाभ्यां हुम् । ॐ द्रौं कनिष्ठिकाभ्यां वौषट् । ॐ द्रः
    करतलकरपृष्ठाभ्यां फट् ॥ बीजषडङ्गन्यासः । ॐ द्रां हृदयाय नमः । ॐ द्रीं शिरसे स्वाहा । ॐ द्रूं शिखायै
    वषट् । ॐ द्रैं कवचाय हुम् । ॐ द्रौं नेत्रत्रयाय वौषट् । ॐ द्रः अस्त्राय फट् ॥ अष्टाक्षर
