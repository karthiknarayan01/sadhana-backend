id: padmavatikavacam
category: kavacha
name:
  english: padmavatikavacam
  devanagari: पद्मावतीकवचम्
content:
  english: padmavatikavacam shriganeshaya namah | shribhairava uvaca | adhuna kavacam divyam mantragarbham
    varabhayam | vakshye parvati bhaktate vajrapanjarakabhidham || 1|| guhyam ca paramam guhyam sarvasvam
    me rahasyakam | sarvamantramayam tattvam devi padmavati priyam || 2|| vinajnanena siddhih syatkavacendrena
    parvati | mantrasyasya mahadevya nakhyeyam yatrakutracit || 3|| asya dharanamatrena bhairavo'ham shivo'smyaham
    | vishnurnarayano loke brahmaloka pitamahah || 4|| indro divaspatirdevi gururvagishatangatah | shukro
    daityagururdevi yah pathedshravayedapi || 5|| dharayenmurdhni va bahau sabhavedbhogamokshabhak | kavacasyasya
    deveshi sadashiva rishirudhatah || 6|| trishtupa chanda itikhyatam devi padmavati smrita | ramabijam
    parashaktih kamah kilakamishvari || 7|| bhogapavarga sidhyartham dharayeviniyogakah | om asya shripadmavativajrapanjarakavacasya
    shrisadashivarishih trishtupachandah shrisarvajneshvarasahita shripadmavatidevata shrim bijam hrim
    shaktih klim kilakam shribhogapavargasiddhyartham kavacepathedharane viniyogah || om hrim shrim me
    shirah patu rajyalakshmih shivapriya | klim blum phat patu netre mahalakshmirharipriya || 8|| om aim
    klim me shruti patu siddhalakshmi shivasana | dayavati patu nasam patu satyavati mukham || 9|| kantham
    yashovati patu skandhaupatvamaravati | prabhavati bhujau patu payadvanavati karau || 10|| vakshah
    kriyavati patu stanau patumaravati | kukshim me kamala patu nabhim me vimalavatu || 11|| parshvaumamavritanmala
    vishalakshim katim mama | prishtham kapalini patu lingam me'vatu malini || 12|| harini patu me medhre
    gudam halacatanmama | mamoru balika patu janu me komalavatu || 13|| balamamavatajjanghe gulphau sevyadbalakini
    | padau me shakini patu lakini nakharanmama || 14|| padadimurdhaparyantam dakini patu mevapuh | shirasah
    padaparyantam khecari sakalam vapuh || 15|| purve mam patu brahmani vahnau narayani ca mam | pashcime
    patu mam nityam mangalakhyaparajita || 16|| vayavye patu kaumari varahicottare'vatu | aishanyam narasimhi
    mam patu sarvatra sarvada || 17|| asitangah prabhatevyanmadhyahne rurubhairavah | nishante'vatusonmattah
    sarvadamam kapalakah || 18|| ratrirdinam bhishaneshah samharah sarvato'vatu | sarvatah sarvada satyam
    rane rajabhayadishu || 19|| patu mam sakalatram ca devi padmavati para | indrome kamalam patu patu
    vahni bhayaccamam || 20|| dharmarajo'vatadvarmam rakshobhitishunindatih | varunah salila patu kalpantapavananmarut
    || 21|| dhanam dhanapatih payadaishvarya parameshvarah | urdhvam brahma sada payadadhonarayano'vatuh
    || 22|| sarvatah sakalam sevyatsavajneshvarabhairavah | om om om vam vam om vishadvishadharatpadmavati
    patumam || 23|| hrim hrim hrim ha ha ha hsauh hayagajantrasatparapatu mam | shrim shrim shrim sha
    sha sha shashankamukutah sarvajnanatho'vatu || 24|| klim klim klim kalipavatoripubhayannagendrabhunayaki
    | itidam kavacam divyam vajrapanjarakabhidham | sarvamantramayam siddham sarvadevimayam param || 25||
    sarva sammohanam varma sarvasa paripurakam | dhanadam kirtidam devi sarvasarasvatapradam || 26|| sarvapujarahasyam
    ca sarvayajnaphalapradam | sarvaishvaryapradam tattvam sarvamantrarahasyakam || 27|| yah pathetpathayedvapi
    sha
  devanagari: पद्मावतीकवचम् श्रीगणेशाय नमः । श्रीभैरव उवाच । अधुना कवचं दिव्यं मन्त्रगर्भं वराभयम् । वक्ष्ये
    पार्वति भक्ताते वज्रपञ्जरकाभिधम् ॥ १॥ गुह्यं च परमं गुह्यं सर्वस्वं मे रहस्यकम् । सर्वमन्त्रमयं तत्त्वं
    देवी पद्मावती प्रियम् ॥ २॥ विनाज्ञानेन सिद्धिः स्यात्कवचेन्द्रेण पार्वति । मन्त्रस्यास्य महादेव्या
    नाख्येयं यत्रकुत्रचित् ॥ ३॥ अस्य धारणमात्रेण भैरवोऽहं शिवोऽस्म्यहम् । विष्णुर्नारायणो लोके ब्रह्मलोक
    पितामहः ॥ ४॥ इन्द्रो दिवस्पतिर्देवि गुरुर्वागीशताङ्गतः । शुक्रो दैत्यगुरुर्देवि यः पठेद्श्रावयेदपि
    ॥ ५॥ धारयेन्मूर्ध्नि वा बाहौ सभवेद्भोगमोक्षभाक् । कवचस्यास्य देवेशि सदाशिव ऋषिरुढतः ॥ ६॥ त्रिष्टुप
    छन्द इतिख्यातं देवी पद्मावती स्मृता । रमाबीजं पराशक्तिः कामः कीलकमीश्वरि ॥ ७॥ भोगापवर्ग सिध्यर्थं
    धारयेविनियोगकः । ॐ अस्य श्रीपद्मावतीवज्रपञ्जरकवचस्य श्रीसदाशिवऋषिः त्रिष्टुपछन्दः श्रीसर्वज्ञेश्वरसहिता
    श्रीपद्मावतीदेवता श्रीं बीजं ह्रीं शक्तिः क्लीं कीलकं श्रीभोगापवर्गसिद्ध्यर्थं कवचेपाठेधारणे विनियोगः
    ॥ ॐ ह्रीं श्रीं मे शिरः पातु राज्यलक्ष्मीः शिवप्रिया । क्लीं ब्लूं फट् पातु नेत्रे महालक्ष्मीर्हरिप्रिया
    ॥ ८॥ ॐ ऐं क्लीं मे श्रुती पातु सिद्धलक्ष्मी शिवासना । दयावती पातु नासां पातु सत्यवती मुखम् ॥ ९॥ कण्ठं
    यशोवती पातु स्कन्धौपात्वमरावती । प्रभावती भुजौ पातु पायाद्वनवती करौ ॥ १०॥ वक्षः क्रियावती पातु स्तनौ
    पातुमरावती । कुक्षिं मे कमला पातु नाभिं मे विमलावतु ॥ ११॥ पार्श्वौममावृतान्माला विशालाक्षीं कटिं मम
    । पृष्ठं कपालिनी पातु लिङ्गं मेऽवतु मालिनी ॥ १२॥ हारिणी पातु मे मेढ्रे गुदं हालाचतान्मम । ममोरू बालिका
    पातु जानू मे कोमलावतु ॥ १३॥ बलाममावताज्जङ्घे गुल्फौ सेव्याद्बलाकिनी । पादौ मे शाकिनी पातु लाकिनी नखरान्मम
    ॥ १४॥ पादादिमूर्धपर्यन्तं डाकिनी पातु मेवपुः । शिरसः पादपर्यन्तं खेचरी सकलं वपुः ॥ १५॥ पूर्वे मां
    पातु ब्रह्माणी वह्नौ नारायणी च माम् । पश्चिमे पातु मां नित्यं मङ्गलाख्यापराजिता ॥ १६॥ वायव्ये पातु
    कौमारी वाराहीचोत्तरेऽवतु । ऐशान्यां नारसिंही मां पातु सर्वत्र सर्वदा ॥ १७॥ असिताङ्गः प्रभातेव्यान्मध्याह्ने
    रुरुभैरवः । निशान्तेऽवतुसोन्मत्तः सर्वदामां कपालकः ॥ १८॥ रात्रिर्दिनं भीषणेशः संहारः सर्वतोऽवतु ।
    सर्वतः सर्वदा सत्यं रणे राजभयादिषु ॥ १९॥ पातु मां सकलत्रं च देवी पद्मावती परा । इन्द्रोमे कमलां पातु
    पातु वह्नि भयाच्चमाम् ॥ २०॥ धर्मराजोऽवताद्वर्मं रक्षोभीतिषुनिन्दतिः । वरुणः सलिला पातु कल्पान्तपवनान्मरुत्
    ॥ २१॥ धनं धनपतिः पायादैश्वर्य परमेश्वरः । ऊर्ध्वं ब्रह्मा सदा पायादधोनारायणोऽवतुः ॥ २२॥ सर्वतः सकलं
    सेव्यात्सवज्ञेश्वरभैरवः । ॐ ॐ ॐ वं वं ॐ विषाद्विषधरात्पद्मावती पातुमाम् ॥ २३॥ ह्रीं ह्रीं ह्रीं ह
    ह हा ह्सौः हयगजन्त्रासात्परापातु माम् । श्रीं श्रीं श्रीं श श शा शशाङ्कमुकुटः सर्वज्ञनाथोऽवतु ॥ २४॥
    क्लीं क्लीं क्लीं कलिपावतोरिपुभयान्नागेन्द्रभूनायकी । इतीदं कवचं दिव्यं वज्रपञ्जरकाभिधम् । सर्वमन्त्रमयं
    सिद्धं सर्वदेवीमयं परम् ॥ २५॥ सर्व सम्मोहनं वर्म सर्वासा परिपूरकम् । धनदं कीर्तिदं देवि सर्वसारस्वतप्रदम्
    ॥ २६॥ सर्वपूजारहस्यं च सर्वयज्ञफलप्रदम् । सर्वैश्वर्यप्रदं तत्त्वं सर्वमन्त्ररहस्यकम् ॥ २७॥ यः पठेत्पाठयेद्वापि
    श
