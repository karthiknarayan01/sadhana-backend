id: kubera-ashtottara-sata-namavali
category: stotram
name:
  english: Kubera Ashtottara Sata Namavali
  devanagari: कुबेराष्टोत्तरशतनामावलिः
content:
  english: kuberashtottarashatanamavalih mahalakshminivasabhuve namah shankhakhyanidhinathaya namah makarakhyanidhipriyaya
    namah sukacchapakhyanidhishaya namah mukundanidhinayakaya namah kundakhyanidhinathaya namah lakshmisamrajyadayakaya
    namah citralekhamanahpriyaya namah saumyadikeshvaraya namah sarvapunyajaneshvaraya namah lankapraktananayakaya
    namah ishanadakshaparshvasthaya namah vayuvamasamashrayaya namah dharmasammukhasamsthitaya namah ashtalakshmyashritalayaya
    namah koshalakshmisamashritaya namah dhanalakshminityavasaya namah dhanyalakshminivasabhuve namah
    ashtalakshmisadavasaya namah gajalakshmisthiralayaya namah rajyalakshmijanmagehaya namah dhairyalakshmikripashrayaya
    namah akhandaishvaryasamyuktaya namah nirupadhikavasabhuve namah sharvanikarunapatraya namah gandharvakulasamsevyaya
    namah saugandhikusumapriyaya namah nidhipithasamashrayaya namah mahameruttarasthaya namah maharshiganasamstutaya
    namah shurpanakhajyeshthaya namah rajayogasamayuktaya namah kuberashtottarashatanamavalih sampurna||
  devanagari: कुबेराष्टोत्तरशतनामावलिः महालक्ष्मीनिवासभुवे नमः शङ्खाख्यनिधिनाथाय नमः मकराख्यनिधिप्रियाय
    नमः सुकच्छपाख्यनिधीशाय नमः मुकुन्दनिधिनायकाय नमः कुन्दाख्यनिधिनाथाय नमः लक्ष्मीसाम्राज्यदायकाय नमः
    चित्रलेखामनःप्रियाय नमः सौम्यादिकेश्वराय नमः सर्वपुण्यजनेश्वराय नमः लङ्काप्राक्तननायकाय नमः ईशानदक्षपार्श्वस्थाय
    नमः वायुवामसमाश्रयाय नमः धर्मसम्मुखसंस्थिताय नमः अष्टलक्ष्म्याश्रितालयाय नमः कोषलक्ष्मीसमाश्रिताय
    नमः धनलक्ष्मीनित्यवासाय नमः धान्यलक्ष्मीनिवासभुवे नमः अष्टलक्ष्मीसदावासाय नमः गजलक्ष्मीस्थिरालयाय
    नमः राज्यलक्ष्मीजन्मगेहाय नमः धैर्यलक्ष्मीकृपाश्रयाय नमः अखण्डैश्वर्यसंयुक्ताय नमः निरूपाधिकवासभुवे
    नमः शर्वाणीकरुणापात्राय नमः गन्धर्वकुलसंसेव्याय नमः सौगन्धिकुसुमप्रियाय नमः निधिपीठसमाश्रयाय नमः महामेरूत्तरस्थाय
    नमः महर्षिगणसंस्तुताय नमः शूर्पणखाज्येष्ठाय नमः राजयोगसमायुक्ताय नमः कुबेराष्टोत्तरशतनामावलिः सम्पूर्णा॥
