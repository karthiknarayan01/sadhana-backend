    मुनिबर गति देखि। सुखी भे निज हृदयँ बिसेषी ॥ अस्तुति करहिं सकल मुनि बृन्दा। जयति प्रनत हित करुना कन्दा
    ॥ पुनि रघुनाथ चले बन आगे। मुनिबर बृन्द बिपुल सँग लागे ॥ अस्थि समूह देखि रघुराया। पूछी मुनिन्ह लागि
    अति दाया ॥ जानतहुँ पूछिअ कस स्वामी। सबदरसी तुम्ह अन्तरजामी ॥ निसिचर निकर सकल मुनि खाए। सुनि रघुबीर
    नयन जल छाए ॥ दो निसिचर हीन करुँ महि भुज उठाइ पन कीन्ह। सकल मुनिन्ह के आश्रमन्हि जाइ जाइ सुख दीन्ह
    ॥ ॥ मुनि अगस्ति कर सिष्य सुजाना। नाम सुतीछन रति भगवाना ॥ मन क्रम बचन राम पद सेवक। सपनेहुँ आन भरोस
    न देवक ॥ प्रभु आगवनु श्रवन सुनि पावा। करत मनोरथ आतुर धावा ॥ हे बिधि दीनबन्धु रघुराया। मो से सठ पर
    करिहहिं दाया ॥ सहित अनुज मोहि राम गोसाई। मिलिहहिं निज सेवक की नाई ॥ मोरे जियँ भरोस दृढ़ नाहीं। भगति
    बिरति न ग्यान मन माहीम् ॥ नहिं सतसङ्ग जोग जप जागा। नहिं दृढ़ चरन कमल अनुरागा ॥ एक बानि करुनानिधान
    की। सो प्रिय जाकें गति न आन की ॥ होइहैं सुफल आजु मम लोचन। देखि बदन पङ्कज भव मोचन ॥ निर्भर प्रेम मगन
    मुनि ग्यानी। कहि न जाइ सो दसा भवानी ॥ दिसि अरु बिदिसि पन्थ नहिं सूझा। को मैं चलेउँ कहाँ नहिं बूझा
    ॥ कबहुँक फिरि पाछें पुनि जाई। कबहुँक नृत्य करि गुन गाई ॥ अबिरल प्रेम भगति मुनि पाई। प्रभु देखैं तरु
    ओट लुकाई ॥ अतिसय प्रीति देखि रघुबीरा। प्रगटे हृदयँ हरन भव भीरा ॥ मुनि मग माझ अचल होइ बैसा। पुलक सरीर
    पनस फल जैसा ॥ तब रघुनाथ निकट चलि आए। देखि दसा निज जन मन भाए ॥ मुनिहि राम बहु भाँति जगावा। जाग न ध्यानजनित
    सुख पावा ॥ भूप रूप तब राम दुरावा। हृदयँ चतुर्भुज रूप देखावा ॥ मुनि अकुलाइ उठा तब कैसें। बिकल हीन मनि
    फनि बर जैसेम् ॥ आगें देखि राम तन स्यामा। सीता अनुज सहित सुख धामा ॥ परेउ लकुट इव चरनन्हि लागी। प्रेम
    मगन मुनिबर बड़भागी ॥ भुज बिसाल गहि लिए उठाई। परम प्रीति राखे उर लाई ॥ मुनिहि मिलत अस सोह कृपाला। कनक
    तरुहि जनु भेण्ट तमाला ॥ राम बदनु बिलोक मुनि ठाढ़आ। मानहुँ चित्र माझ लिखि काढ़आ ॥ दो तब मुनि हृदयँ
    धीर धीर गहि पद बारहिं बार। निज आश्रम प्रभु आनि करि पूजा बिबिध प्रकार ॥ ॥ कह मुनि प्रभु सुनु बिनती
    मोरी। अस्तुति करौं कवन बिधि तोरी ॥ महिमा अमित मोरि मति थोरी। रबि सन्मुख खद्योत अँजोरी ॥ श्याम तामरस
    दाम शरीरं। जटा मुकुट परिधन मुनिचीरम् ॥ पाणि चाप शर कटि तूणीरं। नौमि निरन्तर श्रीरघुवीरम् ॥ मोह विपिन
    घन दहन कृशानुः। सन्त सरोरुह कानन भानुः ॥ निशिचर करि वरूथ मृगराजः। त्रातु सदा नो भव खग बाजः ॥ अरुण
    नयन राजीव सुवेशं। सीता नयन चकोर निशेशम् ॥ हर ह्रदि मानस बाल मरालं। नौमि राम उर बाहु विशालम् ॥ संशय
    सर्प ग्रसन उरगादः। शमन सुकर्कश तर्क विषादः ॥ भव भञ्जन रञ्जन सुर यूथः। त्रातु सदा नो कृपा वरूथः ॥ निर्गुण
    सगुण विषम सम रूपं। ज्ञान गिरा गोतीतमनूपम् ॥ अमलमखिलमनवद्यमपारं। नौमि राम भञ्जन महि भारम् ॥ भक्त कल्पपादप
    आरामः। तर्जन क्रोध लोभ मद कामः ॥ अति नागर भव सागर सेतुः। त्रातु सदा दिनकर कुल केतुः ॥ अतुलित भुज प्रताप
    बल धामः। कलि मल विपुल विभञ्जन नामः ॥ धर्म वर्म नर्मद गुण ग्रामः। सन्तत शं तनोतु मम रामः ॥ जदपि बिरज
    ब्यापक अबिनासी। सब के हृदयँ निरन्तर बासी ॥ तदपि अनुज श्री सहित खरारी। बसतु मनसि मम काननचारी ॥ जे जानहिं
    ते जानहुँ स्वामी। सगुन अगुन उर अन्तरजामी ॥ जो कोसल पति राजिव नयना। करु सो राम हृदय मम अयना। अस अभिमान
    जाइ जनि भोरे। मैं सेवक रघुपति पति मोरे ॥ सुनि मुनि बचन राम मन भाए। बहुरि हरषि मुनिबर उर लाए ॥ परम
    प्रसन्न जानु मुनि मोही। जो बर मागहु देउ सो तोही ॥ मुनि कह मै बर कबहुँ न जाचा। समुझि न परि झूठ का साचा
    ॥ तुम्हहि नीक लागै रघुराई। सो मोहि देहु दास सुखदाई ॥ अबिरल भगति बिरति बिग्याना। होहु सकल गुन ग्यान
    निधाना ॥ प्रभु जो दीन्ह सो बरु मैं पावा। अब सो देहु मोहि जो भावा ॥ दो अनुज जानकी सहित प्रभु चाप बान
    धर राम। मम हिय गगन इन्दु इव बसहु सदा निहकाम ॥ ॥ एवमस्तु करि रमानिवासा। हरषि चले कुभञ्ज रिषि पासा ॥
    बहुत दिवस गुर दरसन पाएँ। भे मोहि एहिं आश्रम आएँ ॥ अब प्रभु सङ्ग जाउँ गुर पाहीं। तुम्ह कहँ नाथ निहोरा
    नाहीम् ॥ देखि कृपानिधि मुनि चतुराई। लिए सङ्ग बिहसै द्वौ भाई ॥ पन्थ कहत निज भगति अनूपा। मुनि आश्रम
    पहुँचे सुरभूपा ॥ तुरत सुतीछन गुर पहिं गयू। करि दण्डवत कहत अस भयू ॥ नाथ कौसलाधीस कुमारा। आए मिलन जगत
    आधारा ॥ राम अनुज समेत बैदेही। निसि दिनु देव जपत हहु जेही ॥ सुनत अगस्ति तुरत उठि धाए। हरि बिलोकि लोचन
    जल छाए ॥ मुनि पद कमल परे द्वौ भाई। रिषि अति प्रीति लिए उर लाई ॥ सादर कुसल पूछि मुनि ग्यानी। आसन बर
    बैठारे आनी ॥ पुनि करि बहु प्रकार प्रभु पूजा। मोहि सम भाग्यवन्त नहिं दूजा ॥ जहँ लगि रहे अपर मुनि बृन्दा।
    हरषे सब बिलोकि सुखकन्दा ॥ दो मुनि समूह महँ बैठे सन्मुख सब की ओर। सरद इन्दु तन चितवत मानहुँ निकर चकोर
    ॥ ॥ तब रघुबीर कहा मुनि पाहीं। तुम्ह सन प्रभु दुराव कछु नाही ॥ तुम्ह जानहु जेहि कारन आयुँ। ताते तात
    न कहि समुझायुँ ॥ अब सो मन्त्र देहु प्रभु मोही। जेहि प्रकार मारौं मुनिद्रोही ॥ मुनि मुसकाने सुनि प्रभु
    बानी। पूछेहु नाथ मोहि का जानी ॥ तुम्हरेइँ भजन प्रभाव अघारी। जानुँ महिमा कछुक तुम्हारी ॥ ऊमरि तरु बिसाल
    तव माया। फल ब्रह्माण्ड अनेक निकाया ॥ जीव चराचर जन्तु समाना। भीतर बसहि न जानहिं आना ॥ ते फल भच्छक कठिन
    कराला। तव भयँ डरत सदा सौ काला ॥ ते तुम्ह सकल लोकपति साईं। पूँछेहु मोहि मनुज की नाईम् ॥ यह बर मागुँ
    कृपानिकेता। बसहु हृदयँ श्री अनुज समेता ॥ अबिरल भगति बिरति सतसङ्गा। चरन सरोरुह प्रीति अभङ्गा ॥ जद्यपि
    ब्रह्म अखण्ड अनन्ता। अनुभव गम्य भजहिं जेहि सन्ता ॥ अस तव रूप बखानुँ जानुँ। फिरि फिरि सगुन ब्रह्म रति
    मानुँ ॥ सन्तत दासन्ह देहु बड़आई। तातें मोहि पूँछेहु रघुराई ॥ है प्रभु परम मनोहर ठ् ँ। पावन पञ्चबटी
    तेहि न् ँ ॥ दण्डक बन पुनीत प्रभु करहू। उग्र साप मुनिबर कर हरहू ॥ बास करहु तहँ रघुकुल राया। कीजे सकल
    मुनिन्ह पर दाया ॥ चले राम मुनि आयसु पाई। तुरतहिं पञ्चबटी निअराई ॥ दो गीधराज सैं भैण्ट भि बहु बिधि
    प्रीति बढ़आइ ॥ गोदावरी निकट प्रभु रहे परन गृह छाइ ॥ ॥ जब ते राम कीन्ह तहँ बासा। सुखी भे मुनि बीती
    त्रासा ॥ गिरि बन नदीं ताल छबि छाए। दिन दिन प्रति अति हौहिं सुहाए ॥ खग मृग बृन्द अनन्दित रहहीं। मधुप
    मधुर गञ्जत छबि लहहीम् ॥ सो बन बरनि न सक अहिराजा। जहाँ प्रगट रघुबीर बिराजा ॥ एक बार प्रभु सुख आसीना।
    लछिमन बचन कहे छलहीना ॥ सुर नर मुनि सचराचर साईं। मैं पूछुँ निज प्रभु की नाई ॥ मोहि समुझाइ कहहु सोइ
    देवा। सब तजि करौं चरन रज सेवा ॥ कहहु ग्यान बिराग अरु माया। कहहु सो भगति करहु जेहिं दाया ॥ दो ईस्वर
    जीव भेद प्रभु सकल कहौ समुझाइ ॥ जातें होइ चरन रति सोक मोह भ्रम जाइ ॥ ॥ थोरेहि महँ सब कहुँ बुझाई। सुनहु
    तात मति मन चित लाई ॥ मैं अरु मोर तोर तैं माया। जेहिं बस कीन्हे जीव निकाया ॥ गो गोचर जहँ लगि मन जाई।
    सो सब माया जानेहु भाई ॥ तेहि कर भेद सुनहु तुम्ह सोऊ। बिद्या अपर अबिद्या दोऊ ॥ एक दुष्ट अतिसय दुखरूपा।
    जा बस जीव परा भवकूपा ॥ एक रचि जग गुन बस जाकें। प्रभु प्रेरित नहिं निज बल ताकेम् ॥ ग्यान मान जहँ एकु
    नाहीं। देख ब्रह्म समान सब माही ॥ कहिअ तात सो परम बिरागी। तृन सम सिद्धि तीनि गुन त्यागी ॥ दो माया ईस
    न आपु कहुँ जान कहिअ सो जीव। बन्ध मोच्छ प्रद सर्बपर माया प्रेरक सीव ॥ ॥ धर्म तें बिरति जोग तें ग्याना।
    ग्यान मोच्छप्रद बेद बखाना ॥ जातें बेगि द्रवुँ मैं भाई। सो मम भगति भगत सुखदाई ॥ सो सुतन्त्र अवलम्ब
    न आना। तेहि आधीन ग्यान बिग्याना ॥ भगति तात अनुपम सुखमूला। मिलि जो सन्त होइँ अनुकूला ॥ भगति कि साधन
    कहुँ बखानी। सुगम पन्थ मोहि पावहिं प्रानी ॥ प्रथमहिं बिप्र चरन अति प्रीती। निज निज कर्म निरत श्रुति
    रीती ॥ एहि कर फल पुनि बिषय बिरागा। तब मम धर्म उपज अनुरागा ॥ श्रवनादिक नव भक्ति दृढ़आहीं। मम लीला रति
    अति मन माहीम् ॥ सन्त चरन पङ्कज अति प्रेमा। मन क्रम बचन भजन दृढ़ नेमा ॥ गुरु पितु मातु बन्धु पति देवा।
    सब मोहि कहँ जाने दृढ़ सेवा ॥ मम गुन गावत पुलक सरीरा। गदगद गिरा नयन बह नीरा ॥ काम आदि मद दम्भ न जाकें।
    तात निरन्तर बस मैं ताकेम् ॥ दो बचन कर्म मन मोरि गति भजनु करहिं निःकाम ॥ तिन्ह के हृदय कमल महुँ करुँ
    सदा बिश्राम ॥ ॥ भगति जोग सुनि अति सुख पावा। लछिमन प्रभु चरनन्हि सिरु नावा ॥ एहि बिधि गे कछुक दिन बीती।
    कहत बिराग ग्यान गुन नीती ॥ सूपनखा रावन कै बहिनी। दुष्ट हृदय दारुन जस अहिनी ॥ पञ्चबटी सो गि एक बारा।
    देखि बिकल भि जुगल कुमारा ॥ भ्राता पिता पुत्र उरगारी। पुरुष मनोहर निरखत नारी ॥ होइ बिकल सक मनहि न रोकी।
    जिमि रबिमनि द्रव रबिहि बिलोकी ॥ रुचिर रुप धरि प्रभु पहिं जाई। बोली बचन बहुत मुसुकाई ॥ तुम्ह सम पुरुष
    न मो सम नारी। यह सँजोग बिधि रचा बिचारी ॥ मम अनुरूप पुरुष जग माहीं। देखेउँ खोजि लोक तिहु नाहीम् ॥ ताते
    अब लगि रहिउँ कुमारी। मनु माना कछु तुम्हहि निहारी ॥ सीतहि चिति कही प्रभु बाता। अहि कुआर मोर लघु भ्राता
    ॥ गि लछिमन रिपु भगिनी जानी। प्रभु बिलोकि बोले मृदु बानी ॥ सुन्दरि सुनु मैं उन्ह कर दासा। पराधीन नहिं
    तोर सुपासा ॥ प्रभु समर्थ कोसलपुर राजा। जो कछु करहिं उनहि सब छाजा ॥ सेवक सुख चह मान भिखारी। ब्यसनी
