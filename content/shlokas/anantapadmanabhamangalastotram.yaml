id: anantapadmanabhamangalastotram
category: stotram
name:
  english: anantapadmanabhamangalastotram
  devanagari: अनन्तपद्मनाभमङ्गलस्तोत्रम्
content:
  english: shrianantapadmanabhamangalastotram shriyahkantaya kalyananidhaye nidhaye'rthinam | shri sheshashayine'nantapadmanabhaya
    mangalam || 1|| syanandurapuribhagyabhavyarupaya vishnave | anandasindhave'nantapadmanabhaya mangalam
    || 2|| hemakutavimanantah bhrajamanaya harine | harilakshmisametaya padmanabhaya mangalam || 3|| shrivaikunthaviraktaya
    shankhatirthambudheh tate | ramaya ramamanaya padmanabhaya mangalam || 4|| ashesha cidacidvastusheshine
    sheshashayine | asheshadayine'nantapadmanabhaya mangalam || 5|| yatpadam paramam sevyam sada pashyanti
    surayah | senapatimukhastasmai padmanabhaya mangalam || 6|| cuturmukheshvaramukhaih putrapautradishaline
    | samastaparivaraya padmanabhaya mangalam || 7|| divakarayatishanayogihritpadmabhanave | parasmai
    brahmane'nantapadmanabhaya mangalam || 8|| parankushaprabandhoktiprathitaya paramatmane | purnaya
    mahate'nantapadmanabhaya mangalam || 9|| vancibhupashiroratnarashminirajitanghraye | vanchitakhiladayastu
    padmanabhaya mangalam || 10|| sarvavayavasaundarya sauvarnasushama jushe | sada sammohanayastu padmanabhaya
    mangalam || 11|| yogeshvaraya krishnaya narasimhaya yogine | yogamudrabhiramaya padmanabhaya mangalam
    || 12|| anantapuranathaya nirantaradayamuce | anantapadmanabhaya nityashrih nityamangalam || 13||
    iti shrianantapadmanabhamangalastotram sampurnam |
  devanagari: श्रीअनन्तपद्मनाभमङ्गलस्तोत्रम् श्रियःकान्ताय कल्याणनिधये निधयेऽर्थिनाम् । श्री शेषशायिनेऽनन्तपद्मनाभाय
    मङ्गलम् ॥ १॥ स्यानन्दूरपुरीभाग्यभव्यरूपाय विष्णवे । आनन्दसिन्धवेऽनन्तपद्मनाभाय मङ्गलम् ॥ २॥ हेमकूटविमानान्तः
    भ्राजमानाय हारिणे । हरिलक्ष्मीसमेताय पद्मनाभाय मङ्गलम् ॥ ३॥ श्रीवैकुण्ठविरक्ताय शङ्खतीर्थाम्बुधेः
    तटे । रमया रममाणाय पद्मनाभाय मङ्गलम् ॥ ४॥ अशेष चिदचिद्वस्तुशेषिणे शेषशायिने । अशेषदायिनेऽनन्तपद्मनाभाय
    मङ्गलम् ॥ ५॥ यत्पदं परमं सेव्यं सदा पश्यन्ति सूरयः । सेनापतिमुखास्तस्मै पद्मनाभाय मङ्गलम् ॥ ६॥ चुतुर्मुखेश्वरमुखैः
    पुत्रपौत्रादिशालिने । समस्तपरिवाराय पद्मनाभाय मङ्गलम् ॥ ७॥ दिवाकरयतीशानयोगिहृत्पद्मभानवे । परस्मै
    ब्रह्मणेऽनन्तपद्मनाभाय मङ्गलम् ॥ ८॥ पराङ्कुशप्रबन्धोक्तिप्रथिताय परमात्मने । पूर्णाय महतेऽनन्तपद्मनाभाय
    मङ्गलम् ॥ ९॥ वञ्चिभूपशिरोरत्नरश्मिनीराजिताङ्घ्रये । वाञ्छिताखिलदायास्तु पद्मनाभाय मङ्गलम् ॥ १०॥ सर्वावयवसौन्दर्य
    सौवर्णसुषमा जुषे । सदा सम्मोहनायास्तु पद्मनाभाय मङ्गलम् ॥ ११॥ योगेश्वराय कृष्णाय नरसिंहाय योगिने ।
    योगमुद्राभिरामाय पद्मनाभाय मङ्गलम् ॥ १२॥ अनन्तपुरनाथाय निरन्तरदयामुचे । अनन्तपद्मनाभाय नित्यश्रीः
    नित्यमङ्गलम् ॥ १३॥ इति श्रीअनन्तपद्मनाभमङ्गलस्तोत्रं सम्पूर्णम् ।
