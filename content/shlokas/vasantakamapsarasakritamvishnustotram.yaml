id: vasantakamapsarasakritamvishnustotram
category: stotram
name:
  english: vasantakamapsarasakritamvishnustotram
  devanagari: वसन्तकामाप्सरसकृतंविष्णुस्तोत्रम्
content:
  english: vasantakamapsarasakritam vishnustotram vasantakamapsarasa ucuh | pashyama nadim tava deva nantam
    na madhyamavyakritarupaparam | parayanam tvam jagatamanantam natah sma narayanamatmabhutam || 16||
    mahinabhovayujalagnayastvam shabdadirupastu paraparatman | tvatto bhavatyacyuta sarvametadbhedadirupo'si
    vibho tvamatman || 17|| drashtasi rupasya parasya vetta shrota ca shabdasya hare tvamekah | srashta
    bhavan sarvagato'khilasya ghrata ca gandhasya prithakshariri || 18|| sureshu sarveshu na so'sti kashcinmanushyalokeshu
    na so'sti kashcit | pashvadivargeshu na so'sti kashcidyo namshabhutastava devadeva || 19|| brahmambudhindupramukhani
    saumya shakradirupani tavottamani | samudrarupam tava dhairyavatsu tejah svarupeshu ravistathagnih
    || 20|| kshamadhaneshu kshitirupamagryam shighreshu shighro balavatsu vayuh | manushyarupam tava rajavesho
    mudheshu sarveshvara padapo'si || 21|| sarvanayeshvacyuta danavastvam sanatsujatashca vivekavatsu
    | rasasvarupena jalasthito'si gandhasvarupam bhavato dharitryam || 22|| drishyasvarupashca hutashanastvam
    sparshasvarupam bhavatah samire | shabdadikam te nabhasi svarupam mantavyarupo manasi prabho tvam
    || 23|| bodhasvarupashca matau tvamekah sarvatra sarveshvara sarvabhuta | pashyami te nabhisarojamadhye
    brahmanamisham ca haram bhrikutyam || 24|| tavashvinau karnagatau samastastavasthita bahushu lokapalah
    | ghrano'nilo netragatau ravindu jihva ca te natha sarasvatiyam || 25|| padau dharitri jatharam samastamllokan
    hrishikesha vilokayamah | janghe vayam padatalangulishu pishacayakshoragasiddhasanghah || 26|| pumstve
    prajanam patiroshthayugme pratishthitaste kratavah samastah | sarve vayam te dashaneshu deva damshtrasu
    deva hyabhavamshca dantah || 27|| romanyasheshastava devasangha vidyadhara natha tavanghrirekhah |
    sangah samastastava deva vedah samasthitah sandhishu bahubhutah || 28|| varahabhutam dharanidharaste
    nrisimharupam ca sada karalam | pashyama te vajishirastathoccaistrivikrame yacca tadaprameyam || 29||
    ami samudrastava deva dehe maurvalayah shailadharastathami | imashca gangapramukhah sravantyo dvipanyasheshani
    vanadideshah || 30|| stuvanti ceme munayastavesha dehe sthitastvanmahimanamagryam | tvamishitaram
    jagatamanantam yajanti yajnaih kila yajnino'mi || 31|| tvatto hi saumyam jagatiha kincittvatto na
    raudram ca samastamurte | tvatto na shitam ca na keshavoshnam sarvasvarupatishayi tvameva || 32||
    prasida sarveshvara sarvabhuta sanatanatma parameshvaresha | tvanmayaya mohitamanasabhiryatte'paraddham
    tadidam kshamasva || 33|| kim vaparaddham tava devadeva yanmayaya no hridayam tavapi | mayabhishankipranatartihantarmano
    hi no vihvalatamupaiti || 34|| na te'paraddham yadi te'paraddhamasmabhirunmargavivartinibhih | tatkshamyatam
    srishtikritastavaiva devaparadhah srijato vivekam || 35|| namo namaste govinda narayana janardana
    | tvannamasmaranatpapamashesham nah pranashyatu || 36|| namo'nanta namastubhyam vishvatmanvishvabhavana
    | tvannamasmaranatpapamashesham nah pranashyatu || 37|| varenya yajnapurusha prajapalana vamana |
    tvannamasmaranatpapamashesham nah pranashyatu || 38|| namo'stu te'bjanabhaya prajapatikrite hara |
    tvannamasmaranatpapamashesham nah pranashyatu || 39|| samsararnavapotaya namastubhyamadhokshaja |
    tvannamasmaranatpapamashesham nah pranashyatu || 40|| namah parasmai shrishaya vasudevaya vedhase
    | svecchaya gunayuktaya sargasthityantakarine || 41|| upasamhara vishvatman rupametatsanatanam | vardhamanam
    na no drashtum samartham cakshurishvara || 42|| pralayagnisahasrasya sama diptistavacyuta | pramanena
    disho bhumirgaganam ca samavritam || 43|| na vidmah kutra vartamo bhavannathopalakshyate | sarvam
    jagadihaikastham pinditam lakshayamahe || 44|| kim varnayamo rupam te kim pramanamidam hare | mahatmyam
    kim nu te deva yajjihvaya na gocare || 45|| vaktaro vayutenapi buddhinamayutayutaih | gunanirvarnanam
    natha kartum tava na shakyate || 46|| tadetaddarshitam rupam prasadah paramah kritah | chandato jagatamisha
    tadetadupasamhara || 47|| iti shriskandapurane avantyakhande revakhande trinavatyadhika
  devanagari: वसन्तकामाप्सरसकृतं विष्णुस्तोत्रम् वसन्तकामाप्सरस ऊचुः । पश्याम नादिं तव देव नान्तं न मध्यमव्याकृतरूपपारम्
    । परायणं त्वां जगतामनन्तं नताः स्म नारायणमात्मभूतम् ॥ १६॥ महीनभोवायुजलाग्नयस्त्वं शब्दादिरूपस्तु परापरात्मन्
    । त्वत्तो भवत्यच्युत सर्वमेतद्भेदादिरूपोऽसि विभो त्वमात्मन् ॥ १७॥ द्रष्टासि रूपस्य परस्य वेत्ता श्रोता
    च शब्दस्य हरे त्वमेकः । स्रष्टा भवान् सर्वगतोऽखिलस्य घ्राता च गन्धस्य पृथक्शरीरी ॥ १८॥ सुरेषु सर्वेषु
    न सोऽस्ति कश्चिन्मनुष्यलोकेषु न सोऽस्ति कश्चित् । पश्वादिवर्गेषु न सोऽस्ति कश्चिद्यो नांशभूतस्तव देवदेव
    ॥ १९॥ ब्रह्माम्बुधीन्दुप्रमुखानि सौम्य शक्रादिरूपाणि तवोत्तमानि । समुद्ररूपं तव धैर्यवत्सु तेजः स्वरूपेषु
    रविस्तथाग्निः ॥ २०॥ क्षमाधनेषु क्षितिरूपमग्र्यं शीघ्रेषु शीघ्रो बलवत्सु वायुः । मनुष्यरूपं तव राजवेषो
    मूढेषु सर्वेश्वर पादपोऽसि ॥ २१॥ सर्वानयेष्वच्युत दानवस्त्वं सनत्सुजातश्च विवेकवत्सु । रसस्वरूपेण जलस्थितोऽसि
    गन्धस्वरूपं भवतो धरित्र्याम् ॥ २२॥ दृश्यस्वरूपश्च हुताशनस्त्वं स्पर्शस्वरूपं भवतः समीरे । शब्दादिकं
    ते नभसि स्वरूपं मन्तव्यरूपो मनसि प्रभो त्वम् ॥ २३॥ बोधस्वरूपश्च मतौ त्वमेकः सर्वत्र सर्वेश्वर सर्वभूत
    । पश्यामि ते नाभिसरोजमध्ये ब्रह्माणमीशं च हरं भृकुट्याम् ॥ २४॥ तवाश्विनौ कर्णगतौ समस्तास्तवास्थिता
    बाहुषु लोकपालाः । घ्राणोऽनिलो नेत्रगतौ रवीन्दु जिह्वा च ते नाथ सरस्वतीयम् ॥ २५॥ पादौ धरित्री जठरं
    समस्तांल्लोकान् हृषीकेश विलोकयामः । जङ्घे वयं पादतलाङ्गुलीषु पिशाचयक्षोरगसिद्धसङ्घाः ॥ २६॥ पुंस्त्वे
    प्रजानां पतिरोष्ठयुग्मे प्रतिष्ठितास्ते क्रतवः समस्ताः । सर्वे वयं ते दशनेषु देव दंष्ट्रासु देवा ह्यभवंश्च
    दन्ताः ॥ २७॥ रोमाण्यशेषास्तव देवसङ्घा विद्याधरा नाथ तवाङ्घ्रिरेखाः । साङ्गाः समस्तास्तव देव वेदाः
    समास्थिताः सन्धिषु बाहुभूताः ॥ २८॥ वराहभूतं धरणीधरस्ते नृसिंहरूपं च सदा करालम् । पश्याम ते वाजिशिरस्तथोच्चैस्त्रिविक्रमे
    यच्च तदाप्रमेयम् ॥ २९॥ अमी समुद्रास्तव देव देहे मौर्वालयः शैलधरास्तथामी । इमाश्च गङ्गाप्रमुखाः स्रवन्त्यो
    द्वीपाण्यशेषाणि वनादिदेशाः ॥ ३०॥ स्तुवन्ति चेमे मुनयस्तवेश देहे स्थितास्त्वन्महिमानमग्र्यम् । त्वामीशितारं
    जगतामनन्तं यजन्ति यज्ञैः किल यज्ञिनोऽमी ॥ ३१॥ त्वत्तो हि सौम्यं जगतीह किञ्चित्त्वत्तो न रौद्रं च समस्तमूर्ते
    । त्वत्तो न शीतं च न केशवोष्णं सर्वस्वरूपातिशयी त्वमेव ॥ ३२॥ प्रसीद सर्वेश्वर सर्वभूत सनातनात्मा परमेश्वरेश
    । त्वन्मायया मोहितमानसाभिर्यत्तेऽपराद्धं तदिदं क्षमस्व ॥ ३३॥ किं वापराद्धं तव देवदेव यन्मायया नो हृदयं
    तवापि । मायाभिशङ्किप्रणतार्तिहन्तर्मनो हि नो विह्वलतामुपैति ॥ ३४॥ न तेऽपराद्धं यदि तेऽपराद्धमस्माभिरुन्मार्गविवर्तिनीभिः
    । तत्क्षम्यतां सृष्टिकृतस्तवैव देवापराधः सृजतो विवेकम् ॥ ३५॥ नमो नमस्ते गोविन्द नारायण जनार्दन । त्वन्नामस्मरणात्पापमशेषं
    नः प्रणश्यतु ॥ ३६॥ नमोऽनन्त नमस्तुभ्यं विश्वात्मन्विश्वभावन । त्वन्नामस्मरणात्पापमशेषं नः प्रणश्यतु
    ॥ ३७॥ वरेण्य यज्ञपुरुष प्रजापालन वामन । त्वन्नामस्मरणात्पापमशेषं नः प्रणश्यतु ॥ ३८॥ नमोऽस्तु तेऽब्जनाभाय
    प्रजापतिकृते हर । त्वन्नामस्मरणात्पापमशेषं नः प्रणश्यतु ॥ ३९॥ संसारार्णवपोताय नमस्तुभ्यमधोक्षज । त्वन्नामस्मरणात्पापमशेषं
    नः प्रणश्यतु ॥ ४०॥ नमः परस्मै श्रीशाय वासुदेवाय वेधसे । स्वेच्छया गुणयुक्ताय सर्गस्थित्यन्तकारिणे
    ॥ ४१॥ उपसंहर विश्वात्मन् रूपमेतत्सनातनम् । वर्धमानं न नो द्रष्टुं समर्थं चक्षुरीश्वर ॥ ४२॥ प्रलयाग्निसहस्रस्य
    समा दीप्तिस्तवाच्युत । प्रमाणेन दिशो भूमिर्गगनं च समावृतम् ॥ ४३॥ न विद्मः कुत्र वर्तामो भवान्नाथोपलक्ष्यते
    । सर्वं जगदिहैकस्थं पिण्डितं लक्षयामहे ॥ ४४॥ किं वर्णयामो रूपं ते किं प्रमाणमिदं हरे । माहात्म्यं
    किं नु ते देव यज्जिह्वाया न गोचरे ॥ ४५॥ वक्तारो वायुतेनापि बुद्धीनामयुतायुतैः । गुणनिर्वर्णनं नाथ
    कर्तुं तव न शक्यते ॥ ४६॥ तदेतद्दर्शितं रूपं प्रसादः परमः कृतः । छन्दतो जगतामीश तदेतदुपसंहर ॥ ४७॥ इति
    श्रीस्कन्दपुराणे आवन्त्यखण्डे रेवाखण्डे त्रिनवत्यधिक
