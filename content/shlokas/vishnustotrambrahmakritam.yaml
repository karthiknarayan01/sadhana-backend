id: vishnustotrambrahmakritam
category: stotram
name:
  english: vishnustotrambrahmakritam
  devanagari: विष्णुस्तोत्रंब्रह्मकृतम्
content:
  english: brahmakritam vishnustotram tatah pranamya deveshamajamartiharam harim | pitamahah prahvatanurvakyametaduvaca
    ha || 23|| jnatam svarupamajnatasvarupa bhagavamstava | maya na yadvagvishaye tatrastham cakhilam
    jagat || 24|| dhanyo'smyanugrihito'smi svarupam yanmaya tava | bhagavanjnatamajnatamanantaja namo'stu
    te || 25|| yadi prasadam deva tvam prakaroshi mamaparam | paramam cavatareshu yadrupam tadvadasva
    me || 26|| keshu keshu maya jneyah sthaneshu tvamadhokshaja | sambhutayo mamacakshva ya bhavishyanti
    te bhuvi || 27|| devaloke nriloke va patale khe'nyato'pi va | sambhutayo yastu bhavankarishyati vadasva
    tah || 28|| tvam karta sarvabhutanam samharta ceshvareshvarah tavapi karta nanyo'sti svecchaya kridate
    bhavan | aham vedmi bhavantam hi na tavanyo'sti vedita || 29|| iti vishnudharmeshu shatshashtitamo'dhyayantargatam
    brahmakritam vishnustotram sampurnam |
  devanagari: ब्रह्मकृतं विष्णुस्तोत्रम् ततः प्रणम्य देवेशमजमार्तिहरं हरिम् । पितामहः प्रह्वतनुर्वाक्यमेतदुवाच
    ह ॥ २३॥ ज्ञातं स्वरूपमज्ञातस्वरूप भगवंस्तव । मया न यद्वाग्विषये तत्रस्थं चाखिलं जगत् ॥ २४॥ धन्योऽस्म्यनुगृहीतोऽस्मि
    स्वरूपं यन्मया तव । भगवञ्ज्ञातमज्ञातमनन्ताज नमोऽस्तु ते ॥ २५॥ यदि प्रसादं देव त्वं प्रकरोषि ममापरम्
    । परमं चावतारेषु यद्रूपं तद्वदस्व मे ॥ २६॥ केषु केषु मया ज्ञेयः स्थानेषु त्वमधोक्षज । सम्भूतयो ममाचक्ष्व
    या भविष्यन्ति ते भुवि ॥ २७॥ देवलोके नृलोके वा पाताले खेऽन्यतोऽपि वा । सम्भूतयो यास्तु भवान्करिष्यति
    वदस्व ताः ॥ २८॥ त्वं कर्ता सर्वभूतानां संहर्ता चेश्वरेश्वरः तवापि कर्ता नान्योऽस्ति स्वेच्छया क्रीडते
    भवान् । अहं वेद्मि भवन्तं हि न तवान्योऽस्ति वेदिता ॥ २९॥ इति विष्णुधर्मेषु षट्षष्टितमोऽध्यायान्तर्गतं
    ब्रह्मकृतं विष्णुस्तोत्रं सम्पूर्णम् ।
