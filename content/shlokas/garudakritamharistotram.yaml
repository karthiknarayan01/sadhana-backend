id: garudakritamharistotram
category: stotram
name:
  english: garudakritamharistotram
  devanagari: गरुडकृतंहरिस्तोत्रम्
content:
  english: garudakritam haristotram garudo'tiprasannah san drishtva nanama dandavat | pulakam'kitasarvangastushtava
    ca kritanjalih || 11|| jaya trilokajivanam pranarupa prabho hare | aghanashakagirvanavanditacaranambuja
    || 12|| suraridhvamsasamarthya surasuranamaskrita | svabhaktahridgatamohadhvamsakrit te namonamah
    || 13|| tapatrayaprashantikriccaranobha namo'stu te | jagajjanmasthitidhvamsakaryakrittrisvarupaka
    || 14|| bhaktamanasasadgamya shastravedadirupita | surasurapravanditapadapadma namo'stu te || 15||
    ashtaishvaryasamayukta vanamalavirajita | kanjanetra tilapushpanasika'lakta pattala || 16|| sthalapadmapatratulyakaradvaya
    namo'stu te | bhaktahritkritanityasa divyagunagananvita || 17|| avita''tmajana dharmamurte hare namo'stu
    te | divyaishvaryasamajushta pahi mam parameshvara || 18|| ekah sannapi sarvatra'nantarupadhara prabho
    | bhaktakaryakrite drak cayasi natha namo'stu te || 19|| kva'ham pakshi tamovyaptah kva tvam sattvamayah
    prabhuh | kripa te darshane hetuh kripalo'stu ca te namah || 20|| saparadhasya lokasya raksham karoshi
    sarvatha | hitakrit sukhakriccaiva gunashraya namo'stu te || 21|| yajnabhuk vishvasampushtikrit trahi
    mam janeshvara | kanyambarani nitva ca kadambavrikshamasthita || 22|| premabhaktisamalabhya dasaikakaruna'va
    mam | vishvaduhkhaprashamana me dasyam dehi keshava || 23|| evam stuto harih sakshadgarudena mahatmana
    | samajuhava gangam ca pujartham svasya tatra vai || 24|| iti shrilakshminarayaniyasamhitayam prathame
    kritayugasantane 207
  devanagari: गरुडकृतं हरिस्तोत्रम् गरुडोऽतिप्रसन्नः सन् दृष्ट्वा ननाम दण्डवत् । पुलकांऽकितसर्वाङ्गस्तुष्टाव
    च कृताञ्जलिः ॥ ११॥ जय त्रिलोकजीवानां प्राणरूप प्रभो हरे । अघनाशकगीर्वाणवन्दितचरणाम्बुज ॥ १२॥ सुरारिध्वंससामर्थ्य
    सुरासुरनमस्कृत । स्वभक्तहृद्गतमोहध्वंसकृत् ते नमोनमः ॥ १३॥ तापत्रयप्रशान्तिकृच्चरणोभ नमोऽस्तु ते ।
    जगज्जन्मस्थितिध्वंसकार्यकृत्त्रिस्वरूपक ॥ १४॥ भक्तमानससद्गम्य शास्त्रवेदादिरूपित । सुरासुरप्रवन्दितपादपद्म
    नमोऽस्तु ते ॥ १५॥ अष्टैश्वर्यसमायुक्त वनमालाविराजित । कञ्जनेत्र तिलपुष्पनासिकाऽलक्त पत्तल ॥ १६॥ स्थलपद्मपत्रतुल्यकरद्वय
    नमोऽस्तु ते । भक्तहृत्कृतनित्यास दिव्यगुणगणान्वित ॥ १७॥ अविताऽऽत्मजन धर्ममूर्ते हरे नमोऽस्तु ते ।
    दिव्यैश्वर्यसमजुष्ट पाहि मां परमेश्वर ॥ १८॥ एकः सन्नपि सर्वत्राऽनन्तरूपधर प्रभो । भक्तकार्यकृते द्राक्
    चायासि नाथ नमोऽस्तु ते ॥ १९॥ क्वाऽहं पक्षी तमोव्याप्तः क्व त्वं सत्त्वमयः प्रभुः । कृपा ते दर्शने
    हेतुः कृपालोऽस्तु च ते नमः ॥ २०॥ सापराधस्य लोकस्य रक्षां करोषि सर्वथा । हितकृत् सुखकृच्चैव गुणाश्रय
    नमोऽस्तु ते ॥ २१॥ यज्ञभुक् विश्वसम्पुष्टिकृत् त्राहि मां जनेश्वर । कन्याम्बराणि नीत्वा च कदम्बवृक्षमास्थित
    ॥ २२॥ प्रेमभक्तिसमालभ्य दासैककरुणाऽव माम् । विश्वदुःखप्रशमन मे दास्यं देहि केशव ॥ २३॥ एवं स्तुतो हरिः
    साक्षाद्गरुडेन महात्मना । समाजुहाव गङ्गां च पूजार्थं स्वस्य तत्र वै ॥ २४॥ इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतयुगसन्ताने २०७
