id: mahaganapatipancavaranastotram
category: stotram
name:
  english: mahaganapatipancavaranastotram
  devanagari: महागणपतिपन्चावरणस्तोत्रं
content:
  english: srishtisthitivinashanam vishvasyasyaikakaranam | mahaganapatim vande pancavaranasamyutam ||
    1|| kridasaktaganadhisha karashikarapuritam | aikshavambhonidhim vande tarangakulasankulam || 2||
    tasya madhye dvipavaryam naumi ratnashilatalam | sevagatamaradhisha daityasiddhasamakulam || 3|| parijatakasantana
    mandaraharicandanan | sakalpavrikshan tatrasthan samshriteshtavarapradan || 4|| palashapallavaphala
    prasunartuvaravrajaih | yugapatsevyamanasya mahatah kalpashakhinah || 5|| tesham jvalanmarakata pravalakamanivrajat
    | adhastatkaumudibalatapabhyam sankulasthalim || 6|| ratnavedim yajetpurnakumbhadipopashobhitam |
    lasadvitanasamyuktam catuhstambhavirajitam || 7|| muktapravalashobhadhyam nanaratnaishca shobhitam
    | tatra dharmadisimhasya catushpadasamanvitam || 8|| pujayami vibhoh pithamadharmadyupashobhitam |
    tanmadhye lipisamyuktam dalashtakamanoharam || 9|| shatkonacakramadhyastham trikonankitakarnikam |
    vrittabhuvalayopetam vilasatkesaranvitam || 10|| sarvashaktyakhyakamalam pujayamyasanatmakam | tivra
    ca jvalini nanda bhogada kamarupini || 11|| ugra tejovati satya navami vighnanashini | kinjalkakarnikasina
    yastah shonangavasasah || 12|| vande varabhayakarah pithashaktirganeshituh | trikonakarnikayam tu
    sukhasinam surarcitam || 13|| japakusumasankasham diptiranjitadinmukham | gajananam jagadvandyam tundilam
    candrashekharam || 14|| ekadantam trinayanam nagayajnopavitinam | raktamalyambaradharam raktagandhanulepanam
    || 15|| phanamanilasadbhoga bhogibhushanabhushitam | vamananghrikarambhojam dashadordandamanditam
    || 16|| ramavishnvadimithuna hetyalankritavigraham | dakshavamakaragreshu bijapuram gadam dhanuh ||
    17|| aikshavam trishikham cakram kamalam pashamutpalam | kalamagram svaradanam pushkare kalasham shubham
    || 18|| dadhanam kalashasthani nanaratnani sarvada | vitarantam svabhaktebhyo'bhitahsamsritidharaya
    || 19|| gandasthalagaladdana gandhalubdhanmuhurmuhuh | nivarayantam madhupan karnatalanaghattanaih
    || 20|| mahaganapatim vande varadam shaktisamyutam | vamanke gananathasya sukhasinam shucismitam ||
    21|| karena patimalingya dakshinenetarena tu | bibhratim phullakamalam kripavistritavikshanam || 22||
    divyamalyambaralepam divyabharanabhushitam | sadhakabhishtasarvartha siddhidanaikatatparam || 23||
    gaurangim gananathasya shaktim bhaktya'bhivadaye | agre bilvatarormule divyasimhasanasthitau || 24||
    vidyunnilambudanibhau dvicaturbahushalinau | padmadvayagadakhadgashankhacakrayudhanvitau || 25|| shvetapitambaradharau
    divyalepanabhushitau | ramarameshau samstaumi ganeshabhimukhasthitau || 26|| ganeshadakshine bhage
    vatavrikshasthale sthitau | tryakshau simhasanasinau surasuranishevitau || 27|| hatakasphatikaprakhyau
    prithagbahucatushtayau | pashankushavarabhiti dvayashulaparashvadhau || 28|| divyamalambaralepa bhushanavindushekharau
    | ganeshabhimukhasinau naumyumavrishabhadhvajau || 29|| ganeshottarabhagasthau bodhivrikshasthale
    sthitau | divyasimhasanarudhau hemavidrumasannibhau || 30|| divyamalyambaralepabhushanau dvidvibahukau
    | utpaladvayapundrekshu capapushpasharayudhau || 31|| ganeshabhimukhasinau prastaumi ratimanmathau
    | ganeshavama bhagasthau priyangudrumamulagau || 32|| nilotpaladyutinibhau divyasimhasanashritau |
    shukavrihyagracakrodyadgadabhitivaranvitau || 33|| shvetapitambarau divyamalyalepanabhushitau | ganeshabhimukhasinau
    dvicaturbahushalinau || 34|| adharabhutau bhutanam bhuvarahau samashraye | shatkonasthanagamoda pramodonmukhadurmukhan
    || 35|| avighnam vighnakartaram ganeshabhimukhasthitan | shonangan shubhramalyamshca trinetran bhogibhushanan
    || 36|| pashankushavarabhiti hastanardhendushekharan | riddhyadishaktisahitan gajavaktran samashraye
    || 37|| riddhissamridvishca tatha kantishca madanavati | madadrava dravini ca shadamodadishaktayah
    || 38|| yastashcamikaranibhah samphullambujadharinih | divyabharanamalyanulepanamshukabhushanah ||
    39|| atmeshankasthitah saumyah siddhidah sharanam bhaje | ganeshobhayaparshvasthau muktamanikyasannibhau
    || 40|| sada dhanani varshantau svashaktibhyam samanvitau | vasudharavasumatibhyam shraye shankhakhyapadmakau
    || 41|| vahnisharaksho vayvagra prishtheshvangani shadvibhoh | hridadini prasannani nanavarnakritini
    ca || 42|| ganeshabhimukhasthani natimudrani samshraye | divyamshukalepamalyah prithagvarnananakritih
    || 43|| svahetivahanopetah staumi brahmyadimatrikah | pragadidikpatin svasvahetivahanasamyutan | nanavarnakritin
    saumyanindradin sharanam bhaje || 44|| catushcatvarimshatpariganitapadyairviracitam ganeshastotram
    yah pathati niyatatma sa labhate | dhanam dhanyam putran jananripavashitvam pashucayam cirayussadvidyam
    vipulatarakirtim shivapadam || 45|| catushcatvarimshatpariganitametatpratidinam japedashtadravyairganapatisamaradhanaparah
    | catushcatvarimshaddivasamiti japtva sa labhate sakricchranishtarthanapi japadineshveva sulabhan
    || 46|| narikelakadaliphalalajanmodakanprithukasaktutilekshun | sannivedya paritarpya ganesham kirtayetstavamimam
    pumarthadam || 47|| yadaksharapadabhrashtam matrahinam tu yadbhavet | tatsarvam vallabhayukto ganeshah
    kshantumarhati || 48|| iti shrimahashaivatantrantargatam mahaganapatipancavaranastotram sampurnam
    |
  devanagari: सृष्टिस्थितिविनाशानां विश्वस्यास्यैककारणम् । महागणपतिं वन्दे पञ्चावरणसंयुतम् ॥ १॥ क्रीडासक्तगणाधीश
    करशीकरपूरितम् । ऐक्षवाम्भोनिधिं वन्दे तरङ्गकुलसङ्कुलम् ॥ २॥ तस्य मध्ये द्वीपवर्यं नौमि रत्नशिलातलम्
    । सेवागतामराधीश दैत्यसिद्धसमाकुलम् ॥ ३॥ पारिजातकसन्तान मन्दारहरिचन्दनान् । सकल्पवृक्षान् तत्रस्थान्
    संश्रितेष्टवरप्रदान् ॥ ४॥ पलाशपल्लवफल प्रसूनर्तुवरव्रजैः । युगपत्सेव्यमानस्य महतः कल्पशाखिनः ॥ ५॥
    तेषां ज्वलन्मरकत प्रवालकमणिव्रजात् । अधस्तात्कौमुदीबालातपाभ्यां सङ्कुलस्थलीम् ॥ ६॥ रत्नवेदीं यजेत्पूर्णकुम्भदीपोपशोभिताम्
    । लसद्वितानसंयुक्तां चतुःस्तम्भविराजिताम् ॥ ७॥ मुक्ताप्रवालशोभाढ्यां नानारत्नैश्च शोभिताम् । तत्र
    धर्मादिसिंहास्य चतुष्पादसमन्वितम् ॥ ८॥ पूजयामि विभोः पीठमधर्माद्युपशोभितम् । तन्मध्ये लिपिसंयुक्तं
    दलाष्टकमनोहरम् ॥ ९॥ षट्कोणचक्रमध्यस्थं त्रिकोणाङ्कितकर्णिकम् । वृत्तभूवलयोपेतं विलसत्केसरान्वितम्
    ॥ १०॥ सर्वशक्त्याख्यकमलं पूजयाम्यासनात्मकम् । तीव्रा च ज्वालिनी नन्दा भोगदा कामरूपिणी ॥ ११॥ उग्रा
    तेजोवती सत्या नवमी विघ्ननाशिनी । किञ्जल्ककर्णिकासीना यास्ताः शोणाङ्गवाससः ॥ १२॥ वन्दे वराभयकराः पीठशक्तीर्गणेशितुः
    । त्रिकोणकर्णिकायां तु सुखासीनं सुरार्चितम् ॥ १३॥ जपाकुसुमसङ्काशं दीप्तिरञ्जितदिङ्मुखम् । गजाननं जगद्वन्द्यं
    तुन्दिलं चन्द्रशेखरम् ॥ १४॥ एकदन्तं त्रिणयनं नागयज्ञोपवीतिनम् । रक्तमाल्याम्बरधरं रक्तगन्धानुलेपनम्
    ॥ १५॥ फणामणिलसद्भोग भोगिभूषणभूषितम् । वामनाङ्घ्रिकराम्भोजं दशदोर्दण्डमण्डितम् ॥ १६॥ रमाविष्ण्वादिमिथुन
    हेत्यलङ्कृतविग्रहम् । दक्षवामकराग्रेषु बीजापूरं गदां धनुः ॥ १७॥ ऐक्षवं त्रिशिखं चक्रं कमलं पाशमुत्पलम्
    । कलमाग्रं स्वरदनं पुष्करे कलशं शुभम् ॥ १८॥ दधानं कलशस्थानि नानारत्नानि सर्वदा । वितरन्तं स्वभक्तेभ्योऽभितःसंसृतिधारया
    ॥ १९॥ गण्डस्थलगलद्दान गन्धलुब्धान्मुहुर्मुहुः । निवारयन्तं मधुपान् कर्णतालनघट्टनैः ॥ २०॥ महागणपतिं
    वन्दे वरदं शक्तिसंयुतम् । वामाङ्के गणनाथस्य सुखासीनां शुचिस्मिताम् ॥ २१॥ करेण पतिमालिङ्ग्य दक्षिणेनेतरेण
    तु । बिभ्रतीं फुल्लकमलं कृपाविस्तृतवीक्षणाम् ॥ २२॥ दिव्यमाल्याम्बरालेपां दिव्याभरणभूषिताम् । साधकाभीष्टसर्वार्थ
    सिद्धिदानैकतत्पराम् ॥ २३॥ गौराङ्गीं गणनाथस्य शक्तिं भक्त्याऽभिवादये । अग्रे बिल्वतरोर्मूले दिव्यसिंहासनस्थितौ
    ॥ २४॥ विद्युन्नीलाम्बुदनिभौ द्विचतुर्बाहुशालिनौ । पद्मद्वयगदाखड्गशङ्खचक्रायुधान्वितौ ॥ २५॥ श्वेतपीताम्बरधरौ
    दिव्यालेपनभूषितौ । रमारमेशौ संस्तौमि गणेशाभिमुखस्थितौ ॥ २६॥ गणेशदक्षिणे भागे वटवृक्षस्थले स्थितौ ।
    त्र्यक्षौ सिंहासनासीनौ सुरासुरनिषेवितौ ॥ २७॥ हाटकस्फटिकप्रख्यौ पृथग्बाहुचतुष्टयौ । पाशाङ्कुशवराभीति
    द्वयशूलपरश्वधौ ॥ २८॥ दिव्यमालाम्बरालेप भूषणाविन्दुशेखरौ । गणेशाभिमुखासीनौ नौम्युमावृषभध्वजौ ॥ २९॥
    गणेशोत्तरभागस्थौ बोधिवृक्षस्थले स्थितौ । दिव्यसिंहासनारूढौ हेमविद्रुमसन्निभौ ॥ ३०॥ दिव्यमाल्याम्बरालेपभूषणौ
    द्विद्विबाहुकौ । उत्पलद्वयपुण्ड्रेक्षु चापपुष्पशरायुधौ ॥ ३१॥ गणेशाभिमुखासीनौ प्रस्तौमि रतिमन्मथौ ।
    गणेशवाम भागस्थौ प्रियङ्गुद्रुममूलगौ ॥ ३२॥ नीलोत्पलद्युतिनिभौ दिव्यसिंहासनाश्रितौ । शुकव्रीह्यग्रचक्रोद्यद्गदाभीतिवरान्वितौ
    ॥ ३३॥ श्वेतपीताम्बरौ दिव्यमाल्यालेपनभूषितौ । गणेशाभिमुखासीनौ द्विचतुर्बाहुशालिनौ ॥ ३४॥ आधारभूतौ भूतानां
    भूवराहौ समाश्रये । षट्कोणस्थानगामोद प्रमोदोन्मुखदुर्मुखान् ॥ ३५॥ अविघ्नं विघ्नकर्तारं गणेशाभिमुखस्थितान्
    । शोणाङ्गान् शुभ्रमाल्यांश्च त्रिणेत्रान् भोगिभूषणान् ॥ ३६॥ पाशाङ्कुशवराभीति हस्तानर्धेन्दुशेखरान्
    । ऋद्ध्यादिशक्तिसहितान् गजवक्त्रान् समाश्रये ॥ ३७॥ ऋद्धिस्समृद्विश्च तथा कान्तिश्च मदनावती । मदद्रवा
    द्राविणी च षडामोदादिशक्तयः ॥ ३८॥ यास्ताश्चामीकरनिभाः सम्फुल्लाम्बुजधारिणीः । दिव्याभरणमाल्यानुलेपनांशुकभूषणाः
    ॥ ३९॥ आत्मेशाङ्कस्थिताः सौम्याः सिद्धिदाः शरणं भजे । गणेशोभयपार्श्वस्थौ मुक्तामाणिक्यसन्निभौ ॥ ४०॥
    सदा धनानि वर्षन्तौ स्वशक्तिभ्यां समन्वितौ । वसुधारावसुमतीभ्यां श्रये शङ्खाख्यपद्मकौ ॥ ४१॥ वह्नीशरक्षो
    वाय्वग्र पृष्ठेष्वङ्गानि षड्विभोः । हृदादीनि प्रसन्नानि नानावर्णाकृतीनि च ॥ ४२॥ गणेशाभिमुखस्थानि नतिमुद्राणि
    संश्रये । दिव्यांशुकालेपमाल्याः पृथग्वर्णाननाकृतीः ॥ ४३॥ स्वहेतिवाहनोपेताः स्तौमि ब्राह्म्यादिमातृकाः
    । प्रागादिदिक्पतीन् स्वस्वहेतिवाहनसंयुतान् । नानावर्णाकृतीन् सौम्यानिन्द्रादीन् शरणं भजे ॥ ४४॥ चतुश्चत्वारिंशत्परिगणितपद्यैर्विरचितं
    गणेशस्तोत्रं यः पठति नियतात्मा स लभते । धनं धान्यं पुत्रान् जननृपवशित्वं पशुचयं चिरायुस्सद्विद्यां
    विपुलतरकीर्तिं शिवपदम् ॥ ४५॥ चतुश्चत्वारिंशत्परिगणितमेतत्प्रतिदिनं जपेदष्टद्रव्यैर्गणपतिसमाराधनपरः
    । चतुश्चत्वारिंशद्दिवसमिति जप्त्वा स लभते सकृच्छ्रानिष्टार्थानपि जपदिनेष्वेव सुलभान् ॥ ४६॥ नारिकेलकदलीफललाजान्मोदकान्पृथुकसक्तुतिलेक्षून्
    । सन्निवेद्य परितर्प्य गणेशं कीर्तयेत्स्तवमिमं पुमर्थदम् ॥ ४७॥ यदक्षरपदभ्रष्टं मात्राहीनं तु यद्भवेत्
    । तत्सर्वं वल्लभायुक्तो गणेशः क्षन्तुमर्हति ॥ ४८॥ इति श्रीमहाशैवतन्त्रान्तर्गतं महागणपतिपञ्चावरणस्तोत्रं
    सम्पूर्णम् ।
