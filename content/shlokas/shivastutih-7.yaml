id: shivastutih-7
category: stotram
name:
  english: shivastutih
  devanagari: शिवस्तुतिः
content:
  english: dhara hara shankara divyadehadhamne || 65|| jaya jaya turagarivahapujya jaya jaya tripuraraye
    haraya dhritasomaya varaya te namo'stu || 66|| hara hara bhagavan pinakapane garadhara shankara carudehamurte
    || 67|| purahara bhavahara shivatara sukhakara | purahara shambhohara gangadhara samba rudrapahi ||
    68|| shashvatprasida parameshvara pancavaktra rudra trinetra shashikhandakalalalama | vishvadhikantakahara
    pramathesha shambho pahi prapannajanatam sunatam mahesha || 69|| asamakusumayudhatatabanapane hara
    bhimamara pujyapadapadma | shruti vajivarangaheshagitakirte prasabham shankara pahimam dayakshna ||
    70|| evam stavam prayunjita tasmin masi maheshvari | brahmanandapayedgauram savatsam godvayam shive
    || 71|| dakshinadibhirabhyarcya masante bhoktumarhasi | nityam naktashano bhakto mukta eva bhaveddhruvam
    || 72|| ashvayujyam ca paurnamyam homah karyo visheshatah | dinanathan bhojayitva svayam bhunjita
    bandhubhih || 73|| ashvayujyam purnimayamashvinyamannavaribhih || 74|| sayamabhyarcayan lingam sthiram
    va carameva va | tavadannakanabdantam shivaloke mahiyate || 75|| evam yah kurute masi so'shvamedhayutam
    labhet | so'tyarkarajasamrajadvimanena savamshakam || 76|| yati matsadanam devi ganaindrairanumoditah
    || 77|| || iti shivarahasyantargate ishvaraproktamashvayujamasakrite shivastutih sampurna ||
  devanagari: धर हर शङ्कर दिव्यदेहधाम्ने ॥ ६५॥ जय जय तुरगारिवाहपूज्य जय जय त्रिपुरारये हराय धृतसोमाय वराय
    ते नमोऽस्तु ॥ ६६॥ हर हर भगवन् पिनाकपाणे गरधर शङ्कर चारुदेहमूर्ते ॥ ६७॥ पुरहर भवहर शिवतर सुखकर । पुरहर
    शम्भोहर गङ्गाधर साम्ब रुद्रपाहि ॥ ६८॥ शश्वत्प्रसीद परमेश्वर पञ्चवक्त्र रुद्र त्रिणेत्र शशिखण्डकलाललाम
    । विश्वाधिकान्तकहर प्रमथेश शम्भो पाहि प्रपन्नजनतां सुनतां महेश ॥ ६९॥ असमकुसुमायुधतातबाणपाणे हर भीमामर
    पूज्यपादपद्म । श्रुति वाजिवराङ्गहेषगीतकीर्ते प्रसभं शङ्कर पाहिमां दयाक्ष्णा ॥ ७०॥ एवं स्तवं प्रयुञ्जीत
    तस्मिन् मासि महेश्वरि । ब्राह्मणान्दापयेद्गौरं सवत्सं गोद्वयं शिवे ॥ ७१॥ दक्षिणादिभिरभ्यर्च्य मासान्ते
    भोक्तुमर्हसि । नित्यं नक्तशनो भक्तो मुक्त एव भवेद्ध्रुवम् ॥ ७२॥ आश्वयुज्यां च पौर्णम्यां होमः कार्यो
    विशेषतः । दीनानाथान् भोजयित्वा स्वयं भुञ्जीत बन्धुभिः ॥ ७३॥ आश्वयुज्यां पूर्णिमायामश्विन्यामन्नवारिभिः
    ॥ ७४॥ सायमभ्यर्चयन् लिङ्गं स्थिरं वा चरमेव वा । तावदन्नकणाब्दान्तं शिवलोके महीयते ॥ ७५॥ एवं यः कुरुते
    मासि सोऽश्वमेधायुतं लभेत् । सोऽत्यर्कराजसंराजद्विमानेन सवंशकम् ॥ ७६॥ याति मत्सदनं देवि गणैन्द्रैरनुमोदितः
    ॥ ७७॥ ॥ इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तमश्वायुजमासकृते शिवस्तुतिः सम्पूर्णा ॥
