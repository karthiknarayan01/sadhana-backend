id: dharmaproktamshivastotram
category: stotram
name:
  english: dharmaproktamshivastotram
  devanagari: धर्मप्रोक्तंशिवस्तोत्रम्
content:
  english: 100|| vishno nrisimha madhusudana cakrapane gauripate girisha shankara candracuda | narayanasuranibarhana
    sharngapane tyajya bhataya iti santatamamananti || 101|| mrityunjayogravishamekshana kamashatro shrikanta
    pitavasanambudanila shaure | ishana krittivasana tridashaikanatha tyajya bhataya iti santatamamananti
    || 102|| lakshmipate madhuripo purushottamadya shrikantha digvasana shanta pinakapane | anandakanda
    dharanidhara padmanabha tyajya bhataya iti santatamamanati || 103|| sarveshvara tripurasudana deva
    deva brahmanyadevagarudadhvaja shankhapane | tryakshoragabharana balamrigankamaule tyajya bhataya
    iti santatamamananti || 104|| shrirama raghava rameshvara ravanare bhutesha manmatharipo pramathadhinatha
    | canuramardana hrishikapate murare tyajya bhataya iti santatamamanati || 105|| shulingirisha rajanishakalavatamsa
    kamsapranashana sanatana keshinasha | bharga trinetra bhava bhutapate purare tyajya bhataya iti santatamamananti
    || 106|| gopipate yadupate vasudevasuno karpuragaura vrishabhadhvaja bhalanetra | govardhanoddharana
    dharmadhurina gopa tyajya bhataya iti santatamamananti || 107|| sthano trilocana pinakadhara smarare
    krishnaniruddha kamalakara kalmashare | vishveshvara tripathagardrajatakalapa tyajya bhataya iti santatamamananti
    || 108|| ashtottaradhikashatena sucarunamnam sandarbhitam lalitaratnakadambakena | sannayakam dridhagunam
    dvijakanthagam yah kuryadimam srajamaho sa yamam na pashyet || 109|| ittham dvijendra nijabhrityaganansadaiva
    samshikshayedavanigansa hi dharmarajah | anye'pi ye hariharankadhara dharayam te duratah punaraho
    parivarjaniyah || 1
  devanagari: १००॥ विष्णो नृसिंह मधुसूदन चक्रपाणे गौरीपते गिरिश शङ्कर चन्द्रचूड । नारायणासुरनिबर्हण शार्ङ्गपाणे
    त्याज्या भटाय इति सन्ततमामनन्ति ॥ १०१॥ मृत्युञ्जयोग्रविषमेक्षण कामशत्रो श्रीकान्त पीतवसनाम्बुदनील
    शौरे । ईशान कृत्तिवसन त्रिदशैकनाथ त्याज्या भटाय इति सन्ततमामनन्ति ॥ १०२॥ लक्ष्मीपते मधुरिपो पुरुषोत्तमाद्य
    श्रीकण्ठ दिग्वसन शान्त पिनाकपाणे । आनन्दकन्द धरणीधर पद्मनाभ त्याज्या भटाय इति सन्ततमामनति ॥ १०३॥ सर्वेश्वर
    त्रिपुरसूदन देव देव ब्रह्मण्यदेवगरुडध्वज शङ्खपाणे । त्र्यक्षोरगाभरण बालमृगाङ्कमौले त्यज्या भटाय इति
    सन्ततमामनन्ति ॥ १०४॥ श्रीराम राघव रमेश्वर रावणारे भूतेश मन्मथरिपो प्रमथाधिनाथ । चाणूरमर्दन हृषीकपते
    मुरारे त्याज्या भटाय इति सन्ततमामनति ॥ १०५॥ शूलिन्गिरीश रजनीशकलावतंस कंसप्रणाशन सनातन केशिनाश । भर्ग
    त्रिनेत्र भव भूतपते पुरारे त्याज्या भटाय इति सन्ततमामनन्ति ॥ १०६॥ गोपीपते यदुपते वसुदेवसूनो कर्पूरगौर
    वृषभध्वज भालनेत्र । गोवर्धनोद्धरण धर्मधुरीण गोप त्याज्या भटाय इति सन्ततमामनन्ति ॥ १०७॥ स्थाणो त्रिलोचन
    पिनाकधर स्मरारे कृष्णानिरुद्ध कमलाकर कल्मषारे । विश्वेश्वर त्रिपथगार्द्रजटाकलाप त्याज्या भटाय इति
    सन्ततमामनन्ति ॥ १०८॥ अष्टोत्तराधिकशतेन सुचारुनाम्नां सन्दर्भितां ललितरत्नकदम्बकेन । सन्नायकां दृढगुणां
    द्विजकण्ठगां यः कुर्यादिमां स्रजमहो स यमं न पश्येत् ॥ १०९॥ इत्थं द्विजेन्द्र निजभृत्यगणान्सदैव संशिक्षयेदवनिगान्स
    हि धर्मराजः । अन्येऽपि ये हरिहराङ्कधरा धरायां ते दूरतः पुनरहो परिवर्जनीयाः ॥ १
