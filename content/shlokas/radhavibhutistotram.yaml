id: radhavibhutistotram
category: stotram
name:
  english: radhavibhutistotram
  devanagari: राधाविभूतिस्तोत्रम्
content:
  english: radhavibhutistotram jyotirupa nirakara bhaktanugrahavigraha | bhaktanam rucivaicitryannanamurttishca
    bibhrati || 78|| mahalakshmishca vaikunthe bharati ca satam prasuh | punyakshetre bharate ca sati
    tvam parvati tatha || 79|| tulasi punyarupa ca ganga bhuvanapavani | brahmaloke ca savitri kalaya
    tvam vasundhara || 80|| goloke radhika tvam ca sarvagopalakeshvari | tvaya vina'ham nirjivo hyashaktah
    sarva karmasu || 81|| shivah shaktastvaya shaktya shavakarastvaya vina | vedakarta svayam brahma vedamatra
    tvaya saha || 82|| narayanastvaya lakshmya jagatpata jagatpatih | phalam dadati yajnashca tvaya dakshinaya
    saha || 83|| bibhartti srishtim sheshashca tvam kritva mastake bhuvam | bibhartti gangarupam tvam
    murdhni gangadharah shivah || 84|| shaktimacca jagatsarvam shavarupam tvaya vina | vakta sarvastvaya
    vanya suto mukastvaya vina || 89|| yatha mrida ghatam karttum kulalah shaktimansada | srishtim srashtum
    tatha'ham ca prakritya ca tvaya saha || 86|| tvaya vina jadashcaham sarvatra ca na shaktiman | sarvashaktisvarupa
    tvam tvamagaccha mamantikam || 87|| vahnau tvam dahikashaktirnagnishshaktastvaya vina | shobhasvarupa
    candre tvam tvam vina na sa sundarah || 88|| prabharupa hi surye tvam tvam vina na sa bhanuman | na
    kamah kaminibandhustvaya ratya vina priye || 89|| ityevam stavanam kritva tam samprapa jagatprabhuh
    | deva babhuvuh sashrikah sabharyah shaktisamyutah || 90|| sastrikam ca jagatsarvam samabhucchailakanyake
    | gopipurnashca goloko hyabhavattatprasadatah || 91|| raja jagama golokamiti stutva haripriyam | shrikrishnena
    kritam stotram radhaya yah pathennarah || 92|| krishnabhaktim ca taddasyam sam prapnoti na samshayah
    | strivicchede yah sha
  devanagari: राधाविभूतिस्तोत्रम् ज्योतीरूपा निराकारा भक्तानुग्रहविग्रहा । भक्तानां रुचिवैचित्र्यान्नानामूर्त्तीश्च
    बिभ्रती ॥ ७८॥ महालक्ष्मीश्च वैकुण्ठे भारती च सतां प्रसूः । पुण्यक्षेत्रे भारते च सती त्वं पार्वती
    तथा ॥ ७९॥ तुलसी पुण्यरूपा च गङ्गा भुवनपावनी । ब्रह्मलोके च सावित्री कलया त्वं वसुन्धरा ॥ ८०॥ गोलोके
    राधिका त्वं च सर्वगोपालकेश्वरी । त्वया विनाऽहं निर्जीवो ह्यशक्तः सर्व कर्मसु ॥ ८१॥ शिवः शक्तस्त्वया
    शक्त्या शवाकारस्त्वया विना । वेदकर्ता स्वयं ब्रह्मा वेदमात्रा त्वया सह ॥ ८२॥ नारायणस्त्वया लक्ष्म्या
    जगत्पाता जगत्पतिः । फलं ददाति यज्ञश्च त्वया दक्षिणया सह ॥ ८३॥ बिभर्त्ति सृष्टिं शेषश्च त्वां कृत्वा
    मस्तके भुवम् । बिभर्त्ति गङ्गारूपां त्वां मूर्ध्नि गङ्गाधरः शिवः ॥ ८४॥ शक्तिमच्च जगत्सर्वं शवरूपं
    त्वया विना । वक्ता सर्वस्त्वया वाण्या सूतो मूकस्त्वया विना ॥ ८९॥ यथा मृदा घटं कर्त्तुं कुलालः शक्तिमान्सदा
    । सृष्टिं स्रष्टुं तथाऽहं च प्रकृत्या च त्वया सह ॥ ८६॥ त्वया विना जडश्चाहं सर्वत्र च न शक्तिमान् ।
    सर्वशक्तिस्वरूपा त्वं त्वमागच्छ ममान्तिकम् ॥ ८७॥ वह्नौ त्वं दाहिकाशक्तिर्नाग्निश्शक्तस्त्वया विना
    । शोभास्वरूपा चन्द्रे त्वं त्वां विना न स सुन्दरः ॥ ८८॥ प्रभारूपा हि सूर्ये त्वं त्वां विना न स भानुमान्
    । न कामः कामिनीबन्धुस्त्वया रत्या विना प्रिये ॥ ८९॥ इत्येवं स्तवनं कृत्वा तां सम्प्राप जगत्प्रभुः
    । देवा बभूवुः सश्रीकाः सभार्याः शक्तिसंयुताः ॥ ९०॥ सस्त्रीकं च जगत्सर्वं समभूच्छैलकन्यके । गोपीपूर्णश्च
    गोलोको ह्यभवत्तत्प्रसादतः ॥ ९१॥ राजा जगाम गोलोकमिति स्तुत्वा हरिप्रियाम् । श्रीकृष्णेन कृतं स्तोत्रं
    राधाया यः पठेन्नरः ॥ ९२॥ कृष्णभक्तिं च तद्दास्यं सं प्राप्नोति न संशयः । स्त्रीविच्छेदे यः श
