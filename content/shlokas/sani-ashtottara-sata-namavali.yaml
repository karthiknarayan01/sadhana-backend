id: sani-ashtottara-sata-namavali
category: stotram
name:
  english: Sani Ashtottara Sata Namavali
content:
  english: om shanaishcaraya namah | om shantaya namah | om sarvabhishtapradayine namah | om sharanyaya
    namah | om varenyaya namah | om sarveshaya namah | om saumyaya namah | om suravandyaya namah | om
    suralokaviharine namah | om sukhasanopavishtaya namah || || om sundaraya namah | om ghanaya namah
    | om ghanarupaya namah | om ghanabharanadharine namah | om ghanasaravilepaya namah | om khadyotaya
    namah | om mandaya namah | om mandaceshtaya namah | om mahaniyagunatmane namah | om martyapavanapadaya
    namah || || om maheshaya namah | om chayaputraya namah | om sharvaya namah | om sharatuniradharine
    namah | om carasthirasvabhavaya namah | om cancalaya namah | om nilavarnaya namah | om nityaya namah
    | om nilanjananibhaya namah | om nilambaravibhushaya namah || || om nishcalaya namah | om vedyaya
    namah | om vidhirupaya namah | om virodhadharabhumaye namah | om bhedaspadasvabhavaya namah | om vajradehaya
    namah | om vairagyadaya namah | om viraya namah | om vitarogabhayaya namah | om vipatparampareshaya
    namah || || om vishvavandyaya namah | om gridhnavahaya namah | om gudhaya namah | om kurmangaya namah
    | om kurupine namah | om kutsitaya namah | om gunadhyaya namah | om gocaraya namah | om avidyamulanashaya
    namah | om vidya'vidyasvarupine namah || || om ayushyakaranaya namah | om apaduddhartre namah | om
    vishnubhaktaya namah | om vashine namah | om vividhagamavedine namah | om vidhistutyaya namah | om
    vandyaya namah | om virupakshaya namah | om varishthaya namah | om garishthaya namah || || om vajrankushadharaya
    namah | om varadabhayahastaya namah | om vamanaya namah | om jyeshthapatnisametaya namah | om shreshthaya
    namah | om mitabhashine namah | om kashtaughanashakaya namah | om pushtidaya namah | om stutyaya namah
    | om stotragamyaya namah || || om bhaktivashyaya namah | om bhanave namah | om bhanuputraya namah
    | om bhavyaya namah | om pavanaya namah | om dhanurmandalasamsthaya namah | om dhanadaya namah | om
    dhanushmate namah | om tanuprakashadehaya namah | om tamasaya namah || || om asheshajanavandyaya namah
    | om visheshaphaladayine namah | om vashikritajaneshaya namah | om pashunam pataye namah | om khecaraya
    namah | om khageshaya namah | om ghananilambaraya namah | om kathinyamanasaya namah | om aryaganastutyaya
    namah | om nilacchatraya namah || || om nityaya namah | om nirgunaya namah | om gunatmane namah |
    om niramayaya namah | om nindyaya namah | om vandaniyaya namah | om dhiraya namah | om divyadehaya
    namah | om dinartiharanaya namah | om dainyanashakaraya namah || || om aryajanaganyaya namah | om
    kruraya namah | om kruraceshtaya namah | om kamakrodhakaraya namah | om kalatraputrashatrutvakaranaya
    namah | om pariposhitabhaktaya namah | om parabhitiharaya namah | om bhaktasanghamano'bhishtaphaladaya
    namah ||
  devanagari: ॐ शनैश्चराय नमः । ॐ शान्ताय नमः । ॐ सर्वाभीष्टप्रदायिने नमः । ॐ शरण्याय नमः । ॐ वरेण्याय
    नमः । ॐ सर्वेशाय नमः । ॐ सौम्याय नमः । ॐ सुरवन्द्याय नमः । ॐ सुरलोकविहारिणे नमः । ॐ सुखासनोपविष्टाय
    नमः ॥ ॥ ॐ सुन्दराय नमः । ॐ घनाय नमः । ॐ घनरूपाय नमः । ॐ घनाभरणधारिणे नमः । ॐ घनसारविलेपाय नमः । ॐ
    खद्योताय नमः । ॐ मन्दाय नमः । ॐ मन्दचेष्टाय नमः । ॐ महनीयगुणात्मने नमः । ॐ मर्त्यपावनपदाय नमः ॥ ॥
    ॐ महेशाय नमः । ॐ छायापुत्राय नमः । ॐ शर्वाय नमः । ॐ शरतूणीरधारिणे नमः । ॐ चरस्थिरस्वभावाय नमः । ॐ
