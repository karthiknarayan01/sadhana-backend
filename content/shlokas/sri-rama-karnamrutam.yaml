    bhayaturadinabandho papambudhau patitamuddhara mamanatham || mindukotinibhananam | kandarpakotilavanyam
    vande'ham raghunandanam || iti shribodhendrasarasvati krita shriramakarnamritam ||
  devanagari: मङ्गलश्लोकाः मङ्गलं भगवान्विष्णुर्मङ्गलं मधुसूदनः । मङ्गलं पुण्डरीकाक्षो मङ्गलं गरुडध्वजः
    ॥ मङ्गलं कोसलेन्द्राय महनीयगुणाब्धये । चक्रवर्तितनूजाय सार्वभौमाय मङ्गलम् ॥ वेदवेदान्तवेद्याय मेघश्यामलमूर्तये
    । पुंसां मोहनरूपाय पुण्यश्लोकाय मङ्गलम् ॥ विश्वामित्रान्तरङ्गाय मिथिलानगरीपतेः । भाग्यानां परिपाकाय
    भव्यरूपाय मङ्गलम् ॥ पितृभक्ताय सततं भ्रातृभिः सह सीतया । नन्दिताखिललोकाय रामचन्द्राय मङ्गलम् ॥ त्यक्तसाकेतवासाय
    चित्रकूटविहारिणे । सेव्याय सर्वयमिनां धीरोदात्ताय मङ्गलम् ॥ सौमित्रिणा च जानक्या चापबाणासिधारिणा ।
    संसेव्याय सदा भक्त्या सानुजायास्तु मङ्गलम् ॥ दण्डकारण्यवासाय खण्डितामरशत्रवे । गृध्रराजाय भक्ताय मुक्तिदायास्तु
    मङ्गलम् ॥ सादरं शबरीदत्तफलमूलाभिलाषिणे । सौलभ्यपरिपूर्णाय सत्त्वोद्युक्ताय मङ्गलम् ॥ हनूमत्समवेताय
    हरीशाभीष्टदायिने । वालिप्रमथनायास्तु महाधीराय मङ्गलम् ॥ श्रीमते रघुवीराय सेतुलङ्घितसिन्धवे । जितराक्षसराजाय
    रणधीराय मङ्गलम् ॥ आसाद्य नगरीं दिव्यामभिषिक्ताय सीतया । राजाधिराजराजाय रामभद्राय मङ्गलम् ॥ विभीषणकृते
    प्रीत्या विश्वाभीष्टप्रदायिने । जानकीप्राणनाथाय सदा रामाय मङ्गलम् ॥ श्रीरामं त्रिजगद्गुरुं सुरवरं
    सीतामनोनायकं श्यामाङ्गं शशिकोटिपूर्णवदनं चञ्चत्कलाकौस्तुभम् । सौम्यं सत्यगुणोत्तमं सुसरयूतीरे वसन्तं
    प्रभुं त्रातारं सकलार्थसिद्धिसहितं वन्दे रघूणां पतिम् ॥ श्रीराघवं दशरथात्मजमप्रमेयं सीतापतिं रघुवरान्वयरत्नदीपम्
    । आजानुबाहुमरविन्ददलायताक्षं रामं निशाचरविनाशकरं नमामि ॥ श्रीरामचन्द्र करुणाकर राघवेन्द्र राजेन्द्रचन्द्र
    रघुवंशसमुद्रचन्द्र । सुग्रीवनेत्रयुगलोत्पल पूर्णचन्द्र सीतामनःकुमुदचन्द्र नमो नमस्ते ॥ सीतामनोमानसराजहंस
    संसारसन्तापहर क्षमावन् । श्रीराम दैत्यान्तक शान्तरूप श्रीतारकब्रह्म नमो नमस्ते ॥ विष्णो राघव वासुदेव
    नृहरे देवौघचूडामणे । संसारार्णवकर्णधारक हरे कृष्णाय तुभ्यं नमः ॥ सुग्रीवादिसमस्तवानरवरैस्संसेव्यमानं
    सदा । विश्वामित्रपराशरादिमुनिभिस्संस्तूयमानं भजे ॥ रामं चन्दनशीतलं क्षितिसुतामोहाकरं श्रीकरं वैदेहीनयनारविन्दमिहिरं
    सम्पूर्णचन्द्राननम् । राजानं करुणासमेतनयनं सीतामनोनन्दनं सीतादर्पणचारुगण्डललितं वन्दे सदा राघवम् ॥
    जानाति राम तव नामरुचिं महेशो जानाति गौतमसती चरणप्रभावम् । जानाति दोर्बलपराक्रममीशचापो जानात्यमोघपटुबाणगतिं
    पयोधिः ॥ माता रामो मत्पिता रामचन्द्रो भ्राता रामो मत्सखा राघवेशः । सर्वस्वं मे रामचन्द्रो दायालु र्नान्यं
    दैवं नैव जाने न जाने ॥ विमलकमलनेत्रं विस्फुरन्नीलगात्रं तपनकुलपवित्रं दानवध्वन्तमित्रम् । भुवनशुभचरित्रं
    भूमिपुत्रीकलत्रं दशरथवरपुत्रं नौमि रामाख्यमित्रम् ॥ मार्गे मार्गे शाखिनां रत्नवेदी वेद्यां वेद्यां
    किन्नरीबृन्दगीतम् । गीते गीते मञ्जुलालापगोष्ठी गोष्ठ्यां गोष्ठ्यां त्वत्कथा रामचन्द्र ॥ वृक्षे वृक्षे
    वीक्षिताः पक्षिसङ्घाः सङ्घे सङ्घे मञ्जुलामोदवाक्यम् । वाक्ये वाक्ये मञ्जुलालापगोष्ठी गोष्ठ्यां गोष्ठ्यां
    त्वत्कथा रामचन्द्र ॥ दुरिततिमिरचन्द्रो दुष्टकञ्जातचन्द्रः सुरकुवलयचन्द्रस्सूर्यवंशाब्धिचन्द्रः । स्वजननिवहचन्द्रश्शत्रुराजीवचन्द्रः
    प्रणतकुमुदचन्द्रः पातु मां रामचन्द्रः ॥ कल्याणदं कौशिकयज्ञपालं कलानिधिं काञ्चनशैलधीरम् । कञ्जातनेत्रं
    करुणासमुद्रं काकुत्स्थरामं कलयामि चित्ते ॥ राजीवायतलोचनं रघुवरं नीलोत्पलश्यामलं मन्दाराञ्चितमण्डपे
    सुललिते सौवर्णके पुष्पके । आस्थाने नवरत्नराजिखचिते सिंहासने संस्थितं सीतालक्ष्मणलोकपालसहितं वन्दे
    मुनीन्द्रास्पदम् ॥ ध्याये रामं सुधांशुं नतसकलभवारण्यतापप्रहारम् । श्यामं शान्तं सुरेन्द्रं सुरमुनिविनुतं
    कोटिसूर्यप्रकाशम् । सीतासौमित्रिसेव्यं सुरनरसुगमं दिव्यसिंहासनस्थम् । सायाह्ने रामचन्द्रं स्मितरुचिरमुखं
    सर्वदा मे प्रसन्नम् ॥ इन्द्रनीलमणिसन्निभदेहं वन्दनीयमसकृन्मुनिबृन्दैः । लम्बमानतुलसीवनमालं चिन्तयामि
    सततं रघुवीरम् ॥ सम्पूर्णचन्द्रवदनं सरसीरुहाक्षं माणिक्यकुण्डलधरं मुकुटाभिरामम् । चाम्पेयगौरवसनं शरचापहस्तं
    श्रीरामचन्द्रमनिशं मनसा स्मरामि ॥ मातुः पार्श्वे चरन्तं मणिमयशयने मञ्जुभूषाञ्चिताङ्गम् । मन्दं मन्दं
    पिबन्तं मुकुलितनयनं स्तन्यमन्यस्तनाग्रम् । अङ्गुल्याग्रैः स्पृशन्तं सुखपरवशया सस्मितालिङ्गिताङ्गम्
    । गाढं गाढं जनन्या कलयतु हृदयं मामकं रामबालम् ॥ रामाभिरामं नयनाभिरामं वाचाभिरामं वदनाभिरामम् । सर्वाभिरामं
    च सदाभिरामं वन्दे सदा दाशरथिं च रामम् ॥ राशब्दोच्चारमात्रेण मुखान्निर्याति पातकाः । पुनः प्रवेशभीत्या
    च मकारस्तु कवाटवत् ॥ अनर्घमाणिक्यविराजमान श्रीपादुकालङ्कृतशोभनाभ्याम् । अशेषबृन्दारकवन्दिताभ्यां नमो
    नमो रामपदाम्बुजाभ्याम् ॥ चलत्कनककुण्डलोल्लसितदिव्यगण्डस्थलं चराचरजगन्मयं चरणपद्मगङ्गाश्रयम् । चतुर्विधफलप्रदं
    चरमपीठमध्यस्थितं चिदंशमखिलास्पदं दशरथात्मजं चिन्तये ॥ सनन्दनमुनिप्रियं सकलवर्णवेदात्मकं समस्तनिगमागमस्फुरिततत्त्वसिंहासनम्
    । सहस्रनयनाब्जजाद्यमरबृन्दसंसेवितं समष्टिपुरवल्लभं दशरथात्मजं चिन्तये ॥ जाग्रत्स्वप्नसुषुप्ति कालविलसत्तत्त्वात्मचिन्मात्रकं
    चैतन्यात्मकमाधिपापरहितं भूम्यादितन्मात्रकम् । शाम्भव्यादिसमस्तयोगकुलकं साङ्ख्यादितत्त्वात्परं शब्दावाच्यमहं
    नमामि सततं व्युत्पत्तिनाशात्परम् ॥ इक्ष्वाकुवंशार्णवजातरत्नं सीताङ्गनायौवनभाग्यरत्नम् । वैकुण्ठरत्नं
    मम भाग्यरत्नं श्रीरामरत्नं शिरसा नमामि ॥ इक्ष्वाकुनन्दनं सुग्रीवपूजितं त्रैलोक्यरक्षकं सत्यसन्धं सदा
    । राघवं रघुपतिं राजीवलोचनं रामचन्द्रं भजे राघवेशं भजे ॥ भक्तप्रियं भक्तसमाधिगम्यं चिन्ताहरं चिन्तितकामधेनुम्
    । सूर्येन्दुकोटिद्युतिभास्वरं तं रामं भजे राघवरामचन्द्रम् ॥ श्रीरामं जनकक्षितीश्वरसुतावक्त्राम्बुजाहारिणं
    श्रीमद्भानुकुलाब्धिकौस्तुभमणिं श्रीरत्नवक्षस्स्थलम् । श्रीकण्ठाद्यमरौघरत्नमकुटालङ्कारपादाम्बुजं श्रीवत्सोज्ज्वलमिन्द्रनीलसदृशं
    श्रीरामचन्द्रं भजे ॥ रामचन्द्र चरिताकथामृतं लक्ष्मणाग्रजगुणानुकीर्तनम् । राघवेश तव पादसेवनं सम्भवन्तु
    मम जन्मजन्मनि ॥ रव्यक्ततत्त्वनिकरप्रणवाधिरूढः । सीतासमेतमनुजेन हृदन्तराले प्राणप्रयाणसमये मम सन्निधत्ते
    ॥ रामो मत्कुलदैवतं सकरुणं रामं भजे सादरं रामेणाखिलघोरपापनिहती रामाय तस्मै नमः । रामान्नास्ति जगत्रयैकसुलभो
    रामस्य दासोऽस्म्यहं रामे प्रीतिरतीव मे कुलगुरो श्रीराम रक्षस्व माम् ॥ वैदेहीसहितं सुरद्रुमतले हैमे
    महामण्टपे । मध्येपुष्पकमासने मणिमये वीरासने संस्थितम् । अग्रे वाचयति प्रभञ्जनसुते तत्त्वं मुनिभ्यः
    परम् । व्याख्यान्तं भरतादिभिः परिवृतं रामं भजे श्यामलम् ॥ वामे भूमिसुता पुरस्तु हनुमान्पश्चात्सुमित्रासुत
    श्शत्रुघ्नो भरतश्च पार्श्वदलयोर्वाय्वादिकोणेष्वपि । सुग्रीवश्च विभीषणश्च युवराट् तारासुतो जाम्बवान्
    मध्ये नीलसरोजकोमलरुचिं रामं भजे श्यामलम् ॥ केयूराङ्गदकङ्कणैर्मणिगणैर्वैरोचमानं सदा राकापर्वणिचन्द्रकोटिसदृशं
    छत्रेण वैराजितम् । हेमस्तम्भसहस्रषोडशयुते मध्ये महामण्डपे देवेशं भरतादिभिः परिवृतं रामं भजे श्यामलम्
    ॥ साकेते शरदिन्दुकुन्दधवले सौघे महामण्टपे । पर्यस्तागरुधूपधूमपटले कर्पूरदीपोज्ज्वले । सुग्रीवाङ्गदवायुपुत्रसहितं
    सौमित्रिणा सेवितं लीलामानुषविग्रहं रघुपतिं रामं भजे श्यामलम् ॥ शान्तं शारदचन्द्रकोटिसदृशं चन्द्राभिरामाननं
    चन्द्रार्काग्निविकासिकुण्डलधरं चन्द्रावतंसस्तुतम् । वीणापुस्तकसाक्षसूत्रविलसद्व्याख्यानमुद्राकरं देवेशं
    भरतादिभिः परिवृतं रामं भजे श्यामलम् ॥ रामं राक्षसमर्दनं रघुपतिं शक्रारिविध्वंसिनं सुग्रीवेप्सितराज्यदं
    सुरपतेः पुत्रान्तकं शार् ङ्गिणम् । भक्तानामभयप्रदं भयहरं पापौघविध्वंसिनं सीतासेवितपादपद्मयुगलं रामं
    भजे श्यामलम् ॥ कन्दर्पायुतकोटिकोटितुलितं कालाम्बुदश्यामलं कम्बुग्रीवमुदारकौस्तुभधरं कर्णावतंसोत्पलम्
    । कस्तूरीतिलकोज्ज्वलं स्मितमुखं चिन्मुद्रयालङ्कृतं सीतालक्ष्मणवायुपुत्रसहितं सिंहासनस्थं भजे ॥ साकेते
    नवरत्नपङ्क्तिखचिते चित्रध्वजालङ्कृते वासे स्वर्णमये दलाष्टललिते पद्मे विमानोत्तमे । आसीनं भरतादिसोदरजनैः
    शाखामृगैः किन्नरैः दिक्पालैर्मुनिपुङ्गवैर्नृपगणैस्संसेव्यमानं भजे ॥ कस्तूरीघनसारकुङ्कुमलसच्छ्रीचन्दनालङ्कृतं
    कन्दर्पाधिकसुन्दरं घननिभं काकुत्स्थवंशध्वजम् । कल्याणाम्भरवेष्टितं कमलया युक्तं कलावल्लभं कल्याणाचलकार्मुकप्रियसखं
    कल्याणरामं भजे ॥ मुक्तेर्मूलं मुनिवरहृदानन्दकन्दं मुकुन्दं कूटस्थाख्यं सकलवरदं सर्वचैतन्यरूपम् । नादातीतं
    कमलनिलयं नादनादान्ततत्त्वं नादातीतं प्रकृतिरहितं रामचन्द्रं भजेऽहम् ॥ ताराकारं निखिलनिलयं तत्त्वमस्यादिलक्ष्यं
    शब्दावाच्यं त्रिगुणरहितं व्योममङ्गुष्ठमात्रम् । निर्वाणाख्यं सगुणमगुणव्योमरन्ध्रान्तरस्थं सौषुम्नान्तः
    प्रणवसहितं रामचन्द्रं भजेऽहम् ॥ निजानन्दाकारं निगमतुरगाराधितपदं परब्रह्मानन्दं परमपदगं पापहरणम् ।
    कृपापारावारं परमपुरुषं पद्मनिलयं भजे रामं श्यामं प्रकृतिरहितं निर्गुणमहम् ॥ साकेते नगरे समस्तमहिमाधारे
    जगन्मोहने रत्नस्तम्भसहस्रमण्टपमहासिंहासने साम्बुजे । विश्वामित्रवसिष्ठगौतमशुकव्यासादिभिर्मौनिभिः ध्येयं
    लक्ष्मणलोकपालसहितं सीतासमेतं भजे ॥ रामं श्यामाभिरामं रविशशिनयनं कोटिसूर्यप्रकाशं दिव्यं दिव्यास्त्रपाणिं
    शरमुखशरधिं चारुकोडण्डहस्तम् । कालं कालाग्निरुद्रं रिपुकुलदहनं विघ्नविच्छेददक्षं भीमं भीमाट्टहासं सकलभयहरं
    रामचन्द्रं भजेऽहम् ॥ श्रीरामं भुवनैकसुन्दरतनुं धाराधरश्यामलं राजीवायतलोचनं रघुवरं राकेन्दुबिम्बाननम्
    । कोदण्डादिनिजायुधाश्रितभुजैर्भ्रान्तं विदेहात्मजा धीशं भक्तजनावनं रघुवरं श्रीरामचन्द्रं भजे ॥ श्रीवत्साङ्कमुदारकौस्तुभलसत्पीताम्बरालङ्कृतं
    नानारत्नविराजमानमकुटं नीलाम्बुदश्यामलम् । कस्तूरीघनसारचर्चिततनुं मन्दारमालाधरं कन्दर्पायुतसुन्दरं
    रघुपतिं सीतासमेतं भजे ॥ सदानन्ददेवे सहस्रारपद्मे गलच्चन्द्रपीयूषधारामृतान्ते । स्थितं राममूर्तिं निषेवे
    निषेवे ऽन्यदैवं न सेवे न सेवे न सेवे ॥ सुधाभासितद्वीपमध्ये विमाने सुपर्वालिवृक्षोज्ज्वले शेषतल्पे
    । निषण्णं रमाङ्कं निषेवे निषेवे ऽन्यदैवं न सेवे न सेवे न सेवे ॥ चिदंशं समानन्दमानन्दकन्दं सुषुम्नाख्यरन्ध्रान्तराले
    च हंसम् । सचक्रं सशङ्खं सपीताम्बराङ्कं परञ्चान्यदैवं न जाने न जाने ॥ चतुर्वेदकूटोल्लसत्कारणाख्यं स्फुरद्दिव्यवैमानिके
    भोगितल्पे । परन्धाममूर्तिं निषण्णं निषेवे निषेवेऽन्यदैवं न सेवे न सेवे ॥ सिंहासनस्थं सुरसेवितव्यं
    रत्नाङ्कितालङ्कृतपादपद्मम् । सीतासमेतं शशिसूर्यनेत्रं रामं भजे राघव रामचन्द्रम् ॥ रामं पुराणपुरुषं
    रमणीयवेषं राजाधिराजमकुटार्चितपादपीठम् । सीतापतिं सुनयनं जगदेकवीरं श्रीरामचन्द्रमनिशं कलयामि चित्ते
    ॥ परानन्दवस्तुस्वरूपादिसाक्षिं परब्रह्मगम्यं परञ्ज्योतिमूर्तिम् । पराशक्तिमित्राऽप्रियाराधिताङ्घ्रिं
    परन्धामरूपं भजे रामचन्द्रम् ॥ मन्दस्मितं कुण्डलगण्डभागं पीताम्बरं भूषणभूषिताङ्गम् । नीलोत्पलाङ्गं
    भुवनैकमित्रं रामं भजे राघव रामचन्द्रम् ॥ अचिन्त्यमव्यक्तमनन्तरूप मद्वैतमानन्दमनादिगम्यम् । पुण्यस्वरूपं
    पुरुषोत्तमाख्यं रामं भजे राघव रामचन्द्रम् ॥ पद्मासनस्थं सुरसेवितव्यं पद्मालयानन्दकटाक्षवीक्ष्यम् ।
    गन्धर्वविद्याधरगीयमानं रामं भजे राघव रामचन्द्रम् ॥ अनन्तकीर्तिं वरदं प्रसन्नं पद्मासनं सेवकपारिजातम्
    । राजाधिराजं रघुवीरकेतुं रामं भजे राघव रामचन्द्रम् ॥ सुग्रीवमित्रं सुजनानुरूपं लङ्काहरं राक्षसवंशनाशम्
    । वेदाश्रयाङ्गं विपुलायताक्षं रामं भजे राघव रामचन्द्रम् ॥ सकृत्प्रणतरक्षायां साक्षी यस्य विभीषणः ।
    सापराधप्रतीकारः स श्रीरामो गतिर्मम ॥ फलमूलाशिनौ दान्तौ तापसौ धर्मचारिणौ । रक्षःकुलविहन्तारौ भ्रातरौ
    रामलक्ष्मणौ ॥ तरुणौ रूपसम्पन्नौ सुकुमारौ महाबलौ । पुण्डरीक विशालाक्षौ चीरकृष्णाजिनाम्बरौ ॥ कौसल्यानयनेन्दुं
    दशरथमुखारविन्दमार्ताण्डम् । सीतामानसहंसं रामं राजीवलोचनं वन्दे ॥ भर्जनं भवबीजानां मार्जनं सुखसम्पदाम्
    । तर्जनं यमदूतानां रामरामेति कीर्तनम् ॥ न जाने जानकी जाने राम त्वन्नामवैभवम् । सर्वेशो भगवान् शम्भुर्वाल्मीकिर्वेत्ति
    वा नवा ॥ करतलधृतचापं कालमेघस्वरूपं सरसिजदलनेत्रं चारुहासं सुगात्रम् । विचिनुतवनवासं विक्रमोदग्रवेषं
    प्रणमत रघुनाथं जानकीप्राणनाथम् ॥ विद्युत्स्फुरन्मकरकुण्डलदीप्तचारु गण्डस्थलं मणिकिरीटविराजमानम् ।
    पीताम्बरं जलदनीलमुदारकान्तिं श्रीरामचन्द्रमनिशं कलयामि चित्ते ॥ रत्नोल्लसज्ज्वलितकुण्डलगण्डभागं कस्तूरिकातिलकशोभितफालभागम्
    । कर्णान्तदीर्घनयनं करुणाकटाक्षं श्रीरामचन्द्र मुखमात्मनि सन्निधत्तम् ॥ वैदेहीसहितं च लक्ष्मणयुतं
    कैकेयिपुत्रान्वितं सुग्रीवं च विभीषणानिलसुतौ नीलं नलं साङ्गदम् । विश्वामित्रवसिष्ठगौतमभरद्वाजादिकान्
    मानयन् रामो मारुतिसेवितः स्मरतु मां साम्राज्यसिंहासने ॥ सकलगुणनिधानं योगिभिस्स्तूयमानं भजितसुरविमानं
    रक्षितेन्द्रादिमानम् । महितवृषभयानं सीतया शोभमानं स्मरतु हृदयभानुं ब्रह्मरामाभिरामम् ॥ त्रिदशकुमुदचन्द्रो
    दानवाम्भोजचन्द्रो दुरिततिमिरचन्द्रो योगिनां ज्ञानचन्द्रः । प्रणतनयनचन्द्रो मैथिलीनेत्रचन्द्रो दशमुखरिपुचन्द्रः
    पातु मां रामचन्द्रः ॥ यन्नामैव सहस्रनामसदृशं यन्नाम वेदैस्समं यन्नामाङ्कितवाक्य मासुरबलस्त्रीगर्भविच्छेदनम्
    । यन्नाम श्वपचार्यभेदरहितं मुक्तिप्रदानोज्ज्वलं तन्नामाऽलघुरामरामरमणं श्रीरामनामामृतम् ॥ राजीवनेत्र
    रघुपुङ्गव रामभद्र राकेन्दुबिम्बसदृशानन नीलगात्र । रामाऽभिराम रघुवंशसमुद्भव त्वं श्रीरामचन्द्र मम देहि
    करावलम्बम् ॥ माणिक्यमञ्जीरपदारविन्दं रामार्कसम्फुल्लमुखारविन्दम् । भक्ताभयप्रापिकरारविन्दां देवीं
    भजे राघववल्लभां ताम् ॥ जयतु विजयकारी जानकीमोदकारी तपनकुलविहारी दण्डकारण्यचारी । दशवदनकुठारी दैत्यविच्छेदकारी
    मणिमकुटकधारी चण्डकोदण्डधारी ॥ रामः पिता रघव एव माता रामस्सुबन्धुश्च सखा हितश्च । रामो गुरुर्मे परमं
    च दैवं रामं विना नाऽन्यमहं स्मरामि ॥ श्रीराम मे त्वं हि पिता च माता श्रीराम मे त्वं हि सुहृच्च बन्धुः
    । श्रीराम मे त्वं हि गुरुश्च गोष्ठी श्रीराम मे त्वं हि समस्तमेव ॥ रामचन्द्रचरितामृतपानं सोमपानशतकोटिसमानम्
    । सोमपानशतकोटिभिरीया ज्जन्म नैति रघुनायकनाम्ना ॥ राम राम दयासिन्धो रावणारे जगत्पते । त्वत्पादकमलासक्ति
    र्भवेज्जन्मनि जन्मनि ॥ श्रीरामचन्द्रेति दयापरेति भक्तप्रियेति भवबन्धनमोचनेति । नाथेति नागशयनेति सदा
    स्तुवन्तं मां पाहि भीतमनिशं कृपणं कृपालो ॥ अयोध्यानाथ राजेन्द्र सीताकान्त जगत्पते । श्रीराम पुण्डरीकाक्ष
    रामचन्द्र नमोऽस्तु ते ॥ हे राम हे रमण हे जगदेकवीर हे नाथ हे रघुपते करुणालवाल । हे जानकीरमण हे जगदेकबन्धो
    मां पाहि दीनमनिशं कृपणं कृतघ्नम् ॥ जानाति राम तव तत्त्वगतिं हनूमान् । जानाति राम तव सख्यगतिं कपीशः
    । जानाति राम तव युद्धगतिं दशास्यो । जानाति राम धनदानुज एव सत्यम् ॥ सेव्यं श्रीराममन्त्रं श्रवणशुभकरं
    श्रेष्ठसुज्ञानिमन्त्रं स्तव्यं श्रीराममन्त्रं नरकदुरितदुर्वारनिर्घातमन्त्रम् । भव्यं श्रीराममन्त्रं
    भजतु भजतु संसारनिस्तारमन्त्रं दिव्यं श्रीराममन्त्रं दिवि भुवि विलसन्मोक्षरक्षैकमन्त्रम् ॥ निखिलनिलयमन्त्रं
    नित्यतत्त्वाख्यमन्त्रं भवकुलहरमन्त्रं भूमिजाप्राणमन्त्रम् । पवनजनुतमन्त्रं पार्वतीमोक्षमन्त्रं पशुपतिनिजमन्त्रं
    पातु मां राममन्त्रम् ॥ प्रणवनिलयमन्त्रं प्राणनिर्वाणमन्त्रं प्रकृतिपुरुषमन्त्रं ब्रह्मरुद्रेन्द्रमन्त्रम्
    । प्रकटदुरितरागद्वेषनिर्णाशमन्त्रं रघुपतिनिजमन्त्रं रामरामेतिमन्त्रम् ॥ दशरथसुतमन्त्रं दैत्यसंहारमन्त्रं
    विबुधविनुतमन्त्रं विश्वविख्यातमन्त्रम् । मुनिगणनुतमन्त्रं मुक्तिमार्गैकमन्त्रं रघुपतिनिजमन्त्रं रामरामेतिमन्त्रम्
    ॥ संसारसागरभयापहविश्वमन्त्रं साक्षान्मुमुक्षुजनसेवितसिद्धमन्त्रम् । सारङ्गहस्तमुखहस्तनिवासमन्त्रं
    कैवल्यमन्त्रमनिशं भज राममन्त्रम् ॥ जयतु जयतु मन्त्रं जन्मसाफल्यमन्त्रं जननमरणभेदक्लेशविच्छेदमन्त्रम्
    । सकलनिगममन्त्रं सर्वशास्त्रैकमन्त्रं रघुपतिनिजमन्त्रं रामरामेतिमन्त्रम् ॥ जगति विशदमन्त्रं जानकीप्राणमन्त्रं
    विबुधविनुतमन्त्रं विश्वविख्यातमन्त्रम् । दशरथसुतमन्त्रं दैत्यसंहारमन्त्रं रघुपतिनिजमन्त्रं रामरामेतिमन्त्रम्
    ॥ ब्रह्मादियोगिमुनिपूजितसिद्धमन्त्रं दारिद्र्यदुःखभवरोगविनाशमन्त्रम् । संसारसागरसमुत्तरणैकमन्त्रं
    वन्दे महाभयहरं रघुराममन्त्रम् ॥ शत्रुच्छेदैकमन्त्रं सरसमुपनिषद्वाक्यसम्पूज्यमन्त्रं संसारोत्तारमन्त्रं
    समुचितसमये सङ्गनिर्याणमन्त्रम् । सर्वैश्वर्यैकमन्त्रं व्यसनभुजगसन्दष्टसन्त्राणमन्त्रं जिह्वे श्रीराममन्त्रं
    जप जप सफलं जन्मसाफल्यमन्त्रम् ॥ नित्यं श्रीराममन्त्रं निरुपममधिकं नीतिसुज्ञानमन्त्रं सत्यं श्रीराममन्त्रं
    सदमलहृदये सर्वदारोग्यमन्त्रम् । स्तुत्यं श्रीराममन्त्रं सुललितसुमनस्सौख्यसौभाग्यमन्त्रं पठ्यं श्रीराममन्त्रं
    पवनजवरदं पातु मां राममन्त्रम् ॥ व्यामोहप्रशमौषधं मुनिमनोवृत्तिप्रवृत्त्यौषधं दैत्योन्मूलकरौषधं भवभयप्रध्वंसनैकौषधम्
    । भक्तानन्दकरौषधं त्रिभुवने सञ्जीवनैकौषधं श्रेयः प्राप्तिकरौषधं पिब मनः श्रीरामनामौषधम् ॥ सकलभुवनरत्नं
    सर्वशास्त्रार्थरत्नं समरविजयरत्नं सच्चिदानन्दरत्नम् । दशमुखहररत्नं दानवारातिरत्नं रघुकुलनृपरत्नं पातु
    मां रामरत्नम् ॥ सकलभुवनरत्नं सच्चिदानन्दरत्नं सकलहृदयरत्नं सूर्यबिम्बान्तरत्नम् । विमलसुकृतरत्नं वेदवेदान्तरत्नं
    पुरहरजपरत्नं पातु मां रामरत्नम् ॥ निगमशिखररत्नं निर्मलानन्दरत्नं निरुपमगुणरत्नं नादनादान्तरत्नम् ।
    दशरथकुलरत्नं द्वादशान्तस्स्थरत्नं पशुपतिजपरत्नं पातु मां रामरत्नम् ॥ शतमखसुतरत्नं षोडशान्तस्स्थरत्नं
    मुनिजनजपरत्नं मुख्यवैकुण्ठरत्नम् । निरुपमगुणरत्नं नीरजान्तस्स्थरत्नं परमपदविरत्नं पातु मां रामरत्नम्
    ॥ सकलसुकृतरत्नं सत्यवाक्यार्थरत्नं शमदमगुणरत्नं शाश्वतानन्दरत्नम् । प्रणयनिलयरत्नं प्रस्फुटद्योतिरत्नं
    परमपदविरत्नं पातु मां रामरत्नम् ॥ निगमशिखररत्नं नित्यमाशास्यरत्नं जननुतनृपरत्नं जानकीरूपरत्नम् । भुवनवलयरत्नं
    भूभुजामेकरत्नं रघुकुलवररत्नं पातु मां रामरत्नम् ॥ विशालनेत्रं परिपूर्णगात्रं सीताकलत्रं सुरवैरिजैत्रम्
    । कारुण्यपात्रं जगतः पवित्रं श्रीरामरत्नं प्रणतोऽस्मि नित्यम् ॥ हे गोपालक हे दयाजलनिधे हे सद्गुणाम्भोनिधे
    हे दैत्यान्तक हे विभीषणदयापरीण हे भूपते । हे वैदेहसुतामनोजविहृते हे कोटिमाराकृते हे नव्याम्बुजनेत्र
    पालय परं जानामि न त्वां विना ॥ यस्य किञ्चिदपि नो हरणीयं कर्म किञ्चिदपि नो चरणीयम् । रामनाम च सदा स्मरणीयं
    लीलया भवजलं तरणीयम् ॥ दशरथसुतमीशं दण्डकारण्यवासं शतमखमणिनीलं जानकीप्राणलोलम् । सकलभुवनमोहं सन्नुताम्भोददेहं
    बहुलनुतसमुद्रं भावये रामभद्रम् ॥ विशालनेत्रं परिपूर्णगात्रं सीताकलत्रं सुरवैरिजैत्रम् । जगत्पवित्रं
    परमात्मतन्त्रं श्रीरामचन्द्रं प्रणमामि चित्ते ॥ जय जय रघुराम श्रीमुखाम्भोजभानो जय जय रघुवीर श्रीमदम्भोजनेत्र
    । जय जय रघुनाथ श्रीकराभ्यर्चिताङ्घ्रि जय जय रघुवर्य श्रीश कारुण्यसिन्धो ॥ मन्दारमूले मणिपीठसंस्थं
    सुधाप्लुतं दिव्यविराट्स्वरूपम् । सबिन्दुनादान्तकलान्ततुर्य मूर्तिं भजेऽहं रघुवंशरत्नम् ॥ नादं नादविनीलचित्तपवनं
    नादान्तत्त्वप्रियं नामाकारविवर्जितं नवघनश्यामाङ्गनादप्रियम् । नादाम्भोजमरन्दमत्तविलसद्भृङ्गं मदान्तस्स्थितं
    नादान्तधृवमण्डलाब्जरुचिरं रामं भजे तारकम् ॥ नानाभूतहृदब्जपद्मनिलयं नामोज्ज्वलाभूषणम् । नामस्तोत्रपवित्रितत्रिभुवनं
    नारायणाष्टाक्षरम् । नादान्तेन्दुगलत्सुधाप्लुततनुं नानात्मचिन्मात्रकम् । नानाकोटियुगान्तभानुसदृशं रामं
    भजे तारकम् ॥ वेद्यं वेदगुरुं विरिञ्चिजनकं वेदान्तमूर्तिं स्फुर द्वेदं वेदकलापमूलमहिमाधारान्तकन्दाङ्कुरम्
    । वेदशृङ्गसमानशेषशयनं वेदान्तवेद्यात्मकं वेदाराधितपादपङ्कजमहं रामं भजे तारकम् ॥ मज्जीवं मदनुग्रहं
    मदधिपं मद्भावनं मत्सुखं मत्तातं मम सद्गुरुं मम वरं मोहान्धविच्छेदनम् । मत्पुण्यं मदनेकबान्धवजनं मज्जीवनं
    मन्निधिं मत्सिद्धिं मम सर्वकर्मसुकृतं रामं भजे तारकम् ॥ नित्यं नीरजलोचनं निरुपमं नीवारशूकोपमं निर्भेदानुभवं
    निरन्तरगुणं नीलाङ्गरागोज्ज्वलम् । निष्पापं निगमागमार्चितपदं नित्यात्मकं निर्मलं निष्पुण्यं निखिलं
    निरञ्जनपदं रामं भजे तारकम् ॥ ध्याये त्वां हृदयाम्बुजे रघुपतिं विज्ञानदीपाङ्कुरं हंसोहंसपरम्परादिमहिमाधारं
    जगन्मोहनम् । हस्ताम्भोजगदाब्जचक्रमतुलं पीताम्बरं कौस्तुभं श्रीवत्सं पुरुषोत्तमं मणिनिभं रामं भजे तारकम्
    ॥ सत्यज्ञानमनन्तमच्युतमजं चाव्याकृतं तत्परं कूटस्थादिसमस्तसाक्षिमनघं साक्षाद्विराट्तत्त्वदम् । वेद्यं
    विश्वमयं स्वलीनभुवनस्वाराज्यसौख्यप्रदं पूर्णं पूर्णतरं पुराणपुरुषं रामं भजे तारकम् ॥ रामं राक्षसवंशनाशनकरं
    राकेन्दुबिम्बाननं रक्षोरिं रघुवंशवर्धनकरं रक्ताधरं राघवम् । राधायात्मनिवासिनं रविनिभं रम्यं रमानायकं
    रन्ध्रान्तर्गतशेषशायिनमहं रामं भजे तारकम् ॥ ओतप्रोतसमस्तवस्तुनिचयं ओङ्कारबीजाक्षरं ओङ्कारप्रकृतिं
    षडक्षरहितं ओङ्कारकन्दाङ्कुरम् । ओङ्कारस्फुटभूर्भुवस्सुपरितं ओघत्रयाराधितम् ओङ्कारोज्ज्वलसिंहपीठनिलयं
    रामं भजे तारकम् ॥ साकेते नगरे समस्तसुखदे हर्म्येऽब्जकोटिद्युते नक्षत्रग्रहपङ्क्तिलग्नशिखरे चान्तर्यपङ्केरुहे
    । वाल्मीकात्रिपराशरादिमुनिभिस्संसेव्यमानं स्थितं सीतालङ्कृतवामभागमनिशं रामं भजे तारकम् ॥ वैकुण्ठे
    नगरे सुरद्रुमतले चानन्दवप्रान्तरे नानारत्नविनिर्मितस्फुटपटुप्राकारसंवेष्टिते । सौधेन्दूपलशेषतल्पललिते
    नीलोत्पलच्छादिते पर्यङ्के शयनं रमादिसहितं रामं भजे तारकम् ॥ वन्दे राममनादिपूरुषमजं वन्दे रमानायकं
    वन्दे हारिकिरीटकुण्डलधरं वन्दे सुनीलद्युतिम् । वन्दे चापकलम्बकोज्ज्वलकरं वन्दे जगन्मङ्गलं वन्दे पङ्क्तिरथात्मजं
    मम गुरुं वन्दे सदा राघवम् ॥ वन्दे शौनकगौतमाद्यभिनुतं वन्दे घनश्यामलं वन्दे तारकपीठमध्यनिलयं वन्दे
    जगन्नायकम् । वन्दे भक्तजनौघदेविवटपं वन्दे धनुर्वल्लभं वन्दे तत्त्वमसीतिवाक्यजनकं वन्दे सदा राघवम्
    ॥ वन्दे सूर्यशशाङ्कलोचनयुगं वन्दे जगत्पावनं वन्दे पत्रसहस्रपद्मनिलयं वन्दे पुरारिप्रियम् । वन्दे राक्षसवंशनाशनकरं
    वन्दे सुधाशीतलं वन्दे देवकपीन्द्रकोटिविनुतं वन्दे सदा राघवम् ॥ वन्दे सागरगर्वभङ्गविशिखं वन्दे जगज्जीवनं
    वन्दे कौशिकयागरक्षणकरं वन्दे गुरुणां गुरुम् । वन्दे बाणशरासनोज्ज्वलकरं वन्दे जटावल्कलं वन्दे लक्ष्मणभूमिजान्वितमहं
    वन्दे सदा राघवम् ॥ वन्दे पाण्डरपुण्डरीकनयनं वन्देऽब्जबिम्बाननं वन्दे कम्बुगलं कराब्जयुगलं वन्दे ललाटोज्ज्वलम्
    । वन्दे पीतदुकूलमम्बुदनिभं वन्दे जगन्मोहनं वन्दे कारणमानुषोज्ज्वलतनुं वन्दे सदा राघवम् ॥ वन्दे नीलसरोजकोमलरुचिं
    वन्दे जगद्वन्दितं वन्दे सूर्यकुलाब्धिकौस्तुभमणिं वन्दे सुराराधितम् । वन्दे पातकपञ्चकप्रहरणं वन्दे
    जगत्कारणं वन्दे विंशतिपञ्चतत्त्वरहितं वन्दे सदा राघवम् ॥ वन्दे साधकवर्गकल्पकतरुं वन्दे त्रिमूर्त्यात्मकं
    वन्दे नादलयान्तरस्थलगतं वन्दे त्रिवर्गात्मकम् । वन्दे रागविहीनचित्तसुलभं वन्दे सभानायकं वन्दे पूर्णदयामृतार्णवमहं
    वन्दे सदा राघवम् ॥ वन्दे सात्त्विकतत्त्वमुद्रिततनुं वन्दे सुधादायकं वन्दे चारुचतुर्भुजं मणिनिभं वन्दे
    षडब्जस्थितम् । वन्दे ब्रह्मपिपीलिकादिनिलयं वन्दे विराट्विग्रहं वन्दे पन्नगतल्पशायिनमहं वन्दे सदा राघवम्
    ॥ सिंहासनस्थं मुनिसिद्धसेव्यं रक्तोत्पलालङ्कृतपादपद्मम् । सीतासमेतं शशिसूर्यनेत्रं रामं भजे राघवरामचन्द्रम्
    ॥ श्रीरामभद्राश्रितसद्गुरूणां पादारविन्दं भजतां नराणाम् । आरोग्यमैश्वर्यमनन्तकीर्ति रन्ते च विष्णोः
    पदमस्ति सत्यम् ॥ दशरथवरपुत्रं जानकीसत्कलत्रं दशमुखहरदक्षं पद्मपत्रायताक्षम् । करधृतशरचापं चारुमुक्ताकलापं
    रघुकुलनृवरेण्यं राममीडे शरण्यम् ॥ दशमुखगजसिंहं दैत्यगर्वातिरंहं कदनभयदहस्तं तारकब्रह्म शस्तम् । मणिखचितकिरीटं
    मञ्जुलालापवाटं दशरथकुलचन्द्रं रामचन्द्रं भजेऽहम् ॥ रामं रक्तसरोरुहाक्षममलं लङ्काधिनाथान्तकं कौसल्यानयनोत्सुकं
    रघुवरं नागेन्द्रतल्पस्थितम् । वैदेहीकुचकुम्भकुङ्कुमरजोलङ्कारहारं हरिं मायामानुषविग्रहं रघुपतिं सीतासमेतं
    भजे ॥ रामं राक्षसमर्दनं रघुवरं दैतेयभिध्वंसिनं सुग्रीवेप्सितराज्यदं सुरपतेर्भीत्यन्तकं शार् ङ्गिणम्
    । भक्तानामभयप्रदं भयहरं पापौघविध्वंसिनं सामीरिस्तुतपादपद्मयुगलं सीतासमेतं भजे ॥ यत्पादाम्बुजरेणुना
    मुनिसती मुक्तिङ्गता यन्महः पुण्यं पातकनाशनं त्रिजगतां भाति स्मृतं पावनम् । स्मृत्वा राघवमप्रमेयममलं
    पूर्णेन्दुमन्दस्मितं तं रामं सरसीरुहाक्षममलं सीतासमेतं भजे ॥ विलसन्माणिक्यहस्ताम्बुजं चञ्चत्कङ्कणहारनूपुर
    लसत्केयूरहारान्वितम् । दिव्यश्रीमणिकुण्डलोज्ज्वल महाभूषासहस्रान्वितं वीरश्रीरघुपुङ्गवं गुणनिधिं सीतासमेतं
    भजे ॥ मध्यस्थं नवनीतकोमलरुचिं नीलोत्पलश्यामलम् । कन्दर्पायुतकोटिसुन्दरतनुं पूर्णेन्दुबिम्बाननं कौसल्याकुलभूषणं
    रघुपतिं सीतासमेतं भजे ॥ दिव्यारण्ययतीन्द्रनामनगरे मध्ये महामण्टपे स्वर्णस्तम्भसहस्रषोडशयुते मन्दारमूलाश्रिते
    । नानारत्नविचित्रनिर्मलमहासिंहासने संस्थितं सीतालक्ष्मणसेवितं रघुपतिं सीतासमेतं भजे ॥ कस्तूरीतिलकं
    कपीन्द्रहरणं कारुण्यवारान्निधिं क्षीराम्भोधिसुतामुखाब्जमधुपं कल्याणसम्पन्निधिम् । कौसल्यानयनोत्सुकं
    कपिवरत्राणं महापौरुषं कौमारप्रियमर्ककोटिसदृशं सीतासमेतं भजे ॥ विद्युत्कोटिदिवाकरद्युतिनिभं श्रीकौस्तुभालङ्कृतं
    योगीन्द्रैस्सनकादिभिः परिवृतं कैलासनाथप्रियम् । मुक्तारत्नकिरीटकुण्डलधरं ग्रैवेयहारान्वितं वैदेहीकुचसन्निवासमनिशं
    सीतासमेतं भजे ॥ मेघश्यामलमम्बुजातनयनं विस्तीर्णवक्षस्स्थलं बाहुद्वन्द्वविराजितं सुवदनं शोणाङ्घ्रिपङ्केरुहम्
    । नानारत्नविचित्रभूषणयुतं कोदण्डबाणाङ्कितं त्रैलोक्याऽप्रतिमानसुन्दरतनुं सीतासमेतं भजे ॥ वैदेहीयुतवामभागमतुलं
    वन्दारुमन्दारकं वन्दे प्रस्तुतकीर्तिवासिततरुच्छायानुकारिप्रभम् । वैदेहीकुचकुङ्कुमाङ्कितमहोरस्कं महाभूषणं
    वेदान्तैरुपगीयमानमसकृत्सीतासमेतं भजे ॥ देवानां हितकारणेन भुवने धृत्वाऽवतारं ध्रुवं रामं कौशिकयज्ञविघ्नदलनं
    तत्ताटकासंहरम् । नित्यं गौतमपत्निशापदलनश्रीपादरेणुं शुभं शम्भोरुत्कटचापखण्डनमहासत्वं भजे राघवम् ॥
    श्रीरामं नवरत्नकुण्डलधरं श्रीरामरक्षामणिं श्रीरामं च सहस्रभानुसदृशं श्रीरामचन्द्रोदयम् । श्रीरामं
    श्रुतकीर्तिमाकरमहं श्रीराममुक्तिप्रदं श्रीरामं रघुनन्दनं भयहरं श्रीरामचन्द्रं भजे ॥ राममिन्दीवरश्यामं
    राजीवायतलोचनम् । ज्याघोषनिर्जितारातिं जानकीरमणं भजे ॥ दीर्घबाहुमरविन्दलोचनं दीनवत्सलमनाथरक्षकम् ।
    दीक्षितं सकललोकरक्षणे दैवतं दशरथात्मजं भजे ॥ प्रातस्स्मरामि रघुनाथमुखारविन्दं मन्दस्मितं मधुरभाषि
    विशालफालम् । कर्णावलम्बिचलकुण्डलगण्डभागं कर्णान्तदीर्घनयनं नयनाभिरामम् ॥ प्रातर्भजामि रघुनाथकरारविन्दं
    रक्षोगणाय भयदं वरदं निजेभ्यः । यद्राजसंसदि विभिद्य महेशचापं सीताकरग्रहणमङ्गलमाप सद्यः ॥ प्रातर्नमामि
    रघुनाथपदारविन्दं पद्माङ्कुशादिशुभरेखशुभावहं च । योगीन्द्रमानसमधुव्रतसेव्यमानं शापापहं सपदि गौतमधर्मपत्न्याः
    ॥ प्रातर्वदामि वचसा रघुनाथनाम वाग्दोषहारि सकलं कलुषं निहन्तृ । यत्पार्वती स्वपतिना सह भोक्तुकामा प्रीत्या
    सहस्रहरिनामसमं जजाप ॥ प्रातः श्रये श्रुतिनुतं रघुनाथमूर्तिं नीलाम्बुदोत्पलसितेतररत्ननीलाम् । आमुक्तमौक्तिकविशेषविभूषणाढ्यां
    ध्येयां समस्तमुनिभिर्निजभृत्यमुख्यैः ॥ रघुकुलवरनाथो जानकीप्राणनाथः पितृवचनविधाता कीशराज्यप्रदाता ।
    प्रतिनिशिचरनाशः प्राप्तराज्यप्रवेशो विहितभुवनरक्षः पातु पद्मायताक्षः ॥ कुवलयदलनीलः पीतवासाः स्मितास्यो
    विविधरुचिरभूषाभूषितो दिव्यमूर्तिः । दशरथकुलनाथो जानकीप्राणनाथो निवसतु मम चित्ते सर्वदा रामचन्द्रः
    ॥ जयतु जयतु रामो जानकीवल्लभोऽयं जयतु जयतु रामश्चन्द्रचूडार्चिताङ्घ्रिः । जयतु जयतु वाणीनाथनाथः परात्मा
    जयतु जयतु रामोऽनाथनाथः कृपालुः ॥ वदतु वदतु वाणी रामरामेति नित्यं जयतु जयतु चित्तं रामपादारविन्दम्
    । नमतु नमतु देहं सन्ततं रामचन्द्रं न भवतु मम पापं जन्मजन्मान्तरेषु ॥ आनन्दरूपं वरदं प्रसन्नं सिंहेक्षणं
    सेवकपारिजातम् । नीलोत्पलाङ्गं भुवनैकमित्रं रामं भजे राघवरामचन्द्रम् ॥ लङ्काविरामं रणरङ्गभीमं राजीवनेत्रं
    रघुवंशमित्रम् । कारुण्यमूर्तिं करुणाप्रपूर्तिं श्रीरामचन्द्रं शरणं प्रपद्ये ॥ सुग्रीवमित्रं परमं पवित्रं
    सीताकलत्रं नवहेमसूत्रम् । कारुण्यपात्रं शतपत्रनेत्रं श्रीरामचन्द्रं शिरसा नमामि ॥ श्रीराघवेति रमणेति
    रघूद्वहेति रामेति रावणहरेति रमाधवेति । साकेतनाथसुमुखेति च सुव्रतेति वाणी सदा वदतु राम हरे हरेति ॥
    श्रीरामनामामृतमन्त्रबीजं सञ्जीवनं चेन्मनसि प्रतिष्ठम् । हालाहलं वा प्रलयानलं वा मृत्योर्मुखं वा वितथीकरोति
    ॥ किं योगशास्त्रैः किमशेषविद्या किं यागगङ्गादिविशेषतीर्थैः । किं ब्रह्मचर्याश्रमसञ्चरेण भक्तिर्नचेत्ते
    रघुवंशकीर्त्याम् ॥ इदं शरीरं श्लथसन्धिजर्झरं पतत्यवश्यं परिणामपेशलम् । किमौषथं पृच्छसि मूढ दुर्मते
    निरामयं रामकथामृतं पिब ॥ हे रामभद्राश्रय हे कृपालो हे भक्तलोकैकशरण्यमूर्ते । पुनीहि मां त्वच्चरणारविन्दं
    जगत्पवित्रं शरणं ममाऽस्तु ॥ नीलाभ्रदेह निखिलेश जगन्निवास राजीवनेत्र रमणीयगुणाभिराम । श्रीदाम दैत्यकुलमर्दन
    रामचन्द्र त्वत्पादपद्ममनिशं कलयामि चित्ते ॥ श्रीरामचन्द्र करुणाकर दीनबन्धो सीतासमेत भरताग्रज राघवेश
    । पापार्तिभञ्जन भयातुरदीनबन्धो पापाम्बुधौ पतितमुद्धर मामनाथम् ॥ मिन्दुकोटिनिभाननम् । कन्दर्पकोटिलावण्यं
    वन्देऽहं रघुनन्दनम् ॥ इति श्रीबोधेन्द्रसरस्वती कृत श्रीरामकर्णामृतम् ॥
