id: amritabindu-krishnayajurvedokta
category: upanishad
name:
  english: amritabindu (krishnayajurvedokta)
  devanagari: अमृतबिन्दु (कृष्णयजुर्वेदोक्त)
content:
  english: amritabindu om saha navavatu saha nau bhunaktu saha viryam karavavahai | tejasvinavadhitamastu
    ma vidvishavahai || om shantih shantih shantih | harih om || mano hi dvividham proktam shuddham cashuddhameva
    ca | ashuddham kamasamkalpam shuddham kamavivarjitam || 1|| mana eva manushyanam karanam bandhamokshayoh
    | bandhaya vishayasaktam muktyai nirvishayam smritam || 2|| yato nirvishayasyasya manaso muktirishyate
    | ato nirvishayam nityam manah karyam mumukshuna || 3|| nirastavishayasangam samniruddham mano hridi
    | yada''yatyatmano bhavam tada tatparamam padam || 4|| tavadeva niroddhavyam yavadhridi gatam kshayam
    | etajjnanam ca dhyanam ca shesho nyayashca vistarah || 5|| naiva cintyam na cacintyam na cintyam
    cintyameva ca | pakshapatavinirmuktam brahma sampadyate tada || 6|| svarena samdhayedyogamasvaram
    bhavayetparam | asvarenanubhavena nabhavo bhava ishyate || 7|| tadeva nishkalam brahma nirvikalpam
    niranjanam | tadbrahmahamiti jnatva brahma sampadyate dhruvam || 8|| nirvikalpamanantam ca hetudrishtantavarjitam
    | aprameyamanadim ca yajjnatva mucyate budhah || 9|| na nirodho na cotpattirna baddho na ca sadhakah
    | na mumukshurna vai mukta ityesha paramarthata || 10||
  devanagari: अमृतबिन्दु ॐ सह नाववतु सह नौ भुनक्तु सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै
    ॥ ॐ शान्तिः शान्तिः शान्तिः । हरिः ॐ ॥ मनो हि द्विविधं प्रोक्तं शुद्धं चाशुद्धमेव च । अशुद्धं कामसंकल्पं
    शुद्धं कामविवर्जितम् ॥ १॥ मन एव मनुष्याणां कारणं बन्धमोक्षयोः । बन्धाय विषयासक्तं मुक्त्यै निर्विषयं
    स्मृतम् ॥ २॥ यतो निर्विषयस्यास्य मनसो मुक्तिरिष्यते । अतो निर्विषयं नित्यं मनः कार्यं मुमुक्षुणा ॥
    ३॥ निरस्तविषयासङ्गं संनिरुद्धं मनो हृदि । यदाऽऽयात्यात्मनो भावं तदा तत्परमं पदम् ॥ ४॥ तावदेव निरोद्धव्यं
    यावधृदि गतं क्षयम् । एतज्ज्ञानं च ध्यानं च शेषो न्यायश्च विस्तरः ॥ ५॥ नैव चिन्त्यं न चाचिन्त्यं न
    चिन्त्यं चिन्त्यमेव च । पक्षपातविनिर्मुक्तं ब्रह्म सम्पद्यते तदा ॥ ६॥ स्वरेण संधयेद्योगमस्वरं भावयेत्परम्
    । अस्वरेणानुभावेन नाभावो भाव इष्यते ॥ ७॥ तदेव निष्कलं ब्रह्म निर्विकल्पं निरञ्जनम् । तद्ब्रह्माहमिति
    ज्ञात्वा ब्रह्म सम्पद्यते ध्रुवम् ॥ ८॥ निर्विकल्पमनन्तं च हेतुदृष्टान्तवर्जितम् । अप्रमेयमनादिं च
    यज्ज्ञात्वा मुच्यते बुधः ॥ ९॥ न निरोधो न चोत्पत्तिर्न बद्धो न च साधकः । न मुमुक्षुर्न वै मुक्त इत्येषा
    परमार्थता ॥ १०॥
