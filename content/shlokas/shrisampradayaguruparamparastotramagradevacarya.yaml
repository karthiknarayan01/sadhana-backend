id: shrisampradayaguruparamparastotramagradevacarya
category: stotram
name:
  english: shrisampradayaguruparamparastotramagradevacarya
  devanagari: श्रीसम्प्रदायगुरुपरम्परास्तोत्रमग्रदेवाचार्य
content:
  english: paradhamni sthito ramahpundarikayatekshanah | sevaya paraya jushto janakyai tarakam dadau ||
    5|| shriyah shrirapi lokanam dukhoddharanahetave | hanumate dadau mantram sada ramanghrisevine ||
    6|| tatastu brahmana prapto muhyamanena mayaya | kalpantare tu ramo vai brahmane dattavanimam || 7||
    mantrarajajapam kritva dhata nirmatritam gatah | trayisaramimam dhaturvasishtho labdhavan param ||
    8|| parasharo vasishthacca sarvasamskarasamyutam | mantrarajam param labdhva kritakrityo babhuva ha
    || 9|| parasharasya satputro vyasah satyavatisutah | pituh shadaksharam labdhva cakre vedopabrimhanam
    || 10|| vyaso'pi bahushishyeshu manvanah shubhayogyatam | paramahamsavaryyaya shukadevaya dattavan
    || 11|| shukadevakripapatro brahmacaryavratesthitah | narottamastu tacchishyo nirvanapadavim gatah
    || 12|| sa capi paramacaryo gangadharaya suraye | mantranam paramam tattvam ramamantram pradattavan
    || 13|| gangadharat sadacaryastato rameshvaro yatih | dvaranandastato labdhva parabrahmarato'bhavat
    || 14|| devanandastu tacchishyah shyamanandastato'grahit | tatsevaya shrutanandashcidanandastato'bhavat
    || 15|| purnanandastato labdhva shriyanandaya dattavan | haryanando mahayogi shriyanandanghrisevakah
    || 16|| haryanandasya shishyo hi raghavanandadeshikah | yasya vai shishyatam prapto ramanandah svayam
    hari || 17|| tasmad guruvarallabdhva devanamapi durlabham | pradattubhyamahantata guhyam tarakasamjnakam
    || 18|| evam parampara saumya prokta shrisampradayinam | mantrarajasya cakhyatirbhumyamevamavatarat
    || 19|| shriagradasa uvaca
  devanagari: परधाम्नि स्थितो रामःपुण्डरीकायतेक्षणः । सेवया परया जुष्टो जानक्यै तारकं ददौ ॥ ५॥ श्रियः
    श्रीरपि लोकानां दुखोद्धरणहेतवे । हनूमते ददौ मन्त्रं सदा रामाङ्घ्रिसेविने ॥ ६॥ ततस्तु ब्रह्मणा प्राप्तो
    मुह्यमानेन मायया । कल्पान्तरे तु रामो वै ब्रह्मणे दत्तवानिमम् ॥ ७॥ मन्त्रराजजपं कृत्वा धाता निर्मातृतां
    गतः । त्रयीसारमिमं धातुर्वसिष्ठो लब्धवान् परम् ॥ ८॥ पराशरो वसिष्ठाच्च सर्वसंस्कारसंयुतम् । मन्त्रराजं
    परं लब्ध्वा कृतकृत्यो बभूव ह ॥ ९॥ पराशरस्य सत्पुत्रो व्यासः सत्यवतीसुतः । पितुः षडक्षरं लब्ध्वा चक्रे
    वेदोपबृंहणम् ॥ १०॥ व्यासोऽपि बहुशिष्येषु मन्वानः शुभयोग्यताम् । परमहंसवर्य्याय शुकदेवाय दत्तवान् ॥
    ११॥ शुकदेवकृपापात्रो ब्रह्मचर्यव्रतेस्थितः । नरोत्तमस्तु तच्छिष्यो निर्वाणपदवीं गतः ॥ १२॥ स चापि परमाचार्यो
    गङ्गाधराय सूरये । मन्त्राणां परमं तत्त्वं राममन्त्रं प्रदत्तवान् ॥ १३॥ गङ्गाधरात् सदाचार्यस्ततो रामेश्वरो
    यतिः । द्वारानन्दस्ततो लब्ध्वा परब्रह्मरतोऽभवत् ॥ १४॥ देवानन्दस्तु तच्छिष्यः श्यामानन्दस्ततोऽग्रहीत्
    । तत्सेवया श्रुतानन्दश्चिदानन्दस्ततोऽभवत् ॥ १५॥ पूर्णानन्दस्ततो लब्ध्वा श्रियानन्दाय दत्तवान् । हर्यानन्दो
    महायोगी श्रियानन्दाङ्घ्रिसेवकः ॥ १६॥ हर्यानन्दस्य शिष्यो हि राघवानन्ददेशिकः । यस्य वै शिष्यतां प्राप्तो
    रामानन्दः स्वयं हरि ॥ १७॥ तस्माद् गुरुवारल्लब्ध्वा देवानामपि दुर्लभम् । प्रादात्तुभ्यमहन्तात गुह्यं
    तारकसंज्ञकम् ॥ १८॥ एवं परम्परा सौम्य प्रोक्ता श्रीसम्प्रदायिनाम् । मन्त्रराजस्य चाख्यातिर्भूम्यामेवमवातरत्
    ॥ १९॥ श्रीअग्रदास उवाच
