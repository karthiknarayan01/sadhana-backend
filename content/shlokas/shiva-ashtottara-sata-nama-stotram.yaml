id: shiva-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Shiva Ashtottara Sata Nama Stotram
  devanagari: शिवाष्टोत्तरशतनामस्तोत्रम् १ (शिवरहस्यान्तर्गतम् शिवो महेश्वरश्शम्भुः)
content:
  english: 'parvatyuvaca - sharirardhamaham shambhoryena prapsyami keshava | tadidanim samacakshva stotram
    shighraphalapradam || narayana uvaca | asti guhyatamam gauri namnamashtottaram shatam | shambhoraham
    pravakshyami pathatam shighrakamadam || om asya shrishivashtottarashatadivyanamastotramalamantrasya
    narayanarishih | anushtupchandah | shrisadashivah paramatma devata | gauri uma shaktih | shrisambasadashivaprityarthe
    jape viniyogah || atha dhyanam - shantakaram shikharishayanam nilakantham suresham vishvadharam sphatikasadrisham
    shubhravarnam shubhangam | gaurikantam tritayanayanam yogibhirdhyanagamyam vande shambhum bhavabhayaharam
    sarvalokaikanatham || dhavalavapushamindormandale samnivishtam bhujagavalayaharam bhasmadigdhangamisham
    | harinaparashupanim carucandrardhamaulim hridayakamalamadhye santatam cinmayami || shrivishnuruvaca
    | om shivo maheshvarashshambhuh pinaki shashishekharah | vamadevo virupakshah kapardi nilalohitah
    || 1|| shankarashshulapanishca khatvangi vishnuvallabhah | shipivishto''mbikanathah shrikantho bhaktavatsalah
    || 2|| bhavashsharvastrilokeshashshitikanthashshivapriyah | ugrah kapali kamarirandhakasurasudanah
    || 3|| gangadharo lalatakshah kalakalah kripanidhih | bhimah parashuhastashca mrigapanirjatadharah
    || 4|| kailasavasi kavaci kathorastripurantakah | vrishanko vrishabharudho bhasmoddhulitavigrahah
    || 5|| samapriyassvaramayastrayimurtiranishvarah | sarvajnah paramatma ca somasuryagnilocanah || 6||
    haviryajnamayassomah pancavaktrassadashivah | vishveshvaro virabhadro gananathah prajapatih || 7||
    hiranyareta durdharshah girisho girisho''naghah | bhujangabhushano bhargo giridhanva giripriyah ||
    8|| krittivasa puraratirbhagavan pramathadhipah | mrityunjayassukshmatanurjagadvyapi jagadguruh ||
    9|| vyomakesho mahasenajanakashcaruvikramah | rudro bhutapatih sthanurahirbudhnyo digambarah || 10||
    ashtamurtiranekatma sattvikashshuddhavigrahah | shashvatah khandaparashurajah pashavimocakah || 11||
    mridah pashupatirdevo mahadevo''vyayo harih | (mahadevo''vyayah prabhuh) pushadantabhidavyagro dakshadhvaraharo
    harah || 12|| bhaganetrabhidavyakto sahasrakshassahasrapat | apavargaprado''nantastarakah parameshvarah
    || 13|| || iti shivarahasyantargate vishnuproktam shivashtottarashatanamastotram sampurnam || - ||
    shrishivarahasyam | ugrakhyah saptamamshah | adhyayah 13 | 203-215 || - || shrishivarahasyam | ugrakhyah
    saptamamshah | adhyayah 13 | 203-215 || phalashrutih | etadashtottaram namnam shatamamnayasammitam
    | (vishnuna kathitam purvam parvatya ishtasiddhaye |) shankarasya priya gauri japtva shambhuprasadadam
    || 1|| traikalyamanvaham devi varshamekam prayatnatah | avapa sa sharirardham prasadacchulapaninah
    || 2|| yastrisandhyam pathennityam namnamashtottaram shatam | shatarudratriravritya yatphalam labhate
    narah || 3|| tatphalam prapnuyannityamekavrittya nasamshayah | sakridva namabhih pujya kulakotim samuddharet
    || 4|| bilvapatraih prashastaishca pushpaishca tulasidalaih | tilakshatairyajedyastu jivanmukto na
    samshayah || 5|| namnamesham pashupaterekamevapavargadam | anyesham cavashishtana phalam vaktum na
    shakyate || 6|| iti shrishivashtottarashatadivyanamamritastotram sampurnam || notes:'
  devanagari: 'पार्वत्युवाच - शरीरार्धमहं शम्भोर्येन प्राप्स्यामि केशव । तदिदानीं समाचक्ष्व स्तोत्रं शीघ्रफलप्रदम्
    ॥ नारायण उवाच । अस्ति गुह्यतमं गौरि नाम्नामष्टोत्तरं शतम् । शम्भोरहं प्रवक्ष्यामि पठतां शीघ्रकामदम्
    ॥ ॐ अस्य श्रीशिवाष्टोत्तरशतदिव्यनामस्तोत्रमालामन्त्रस्य नारायणऋषिः । अनुष्टुप्छन्दः । श्रीसदाशिवः
    परमात्मा देवता । गौरी उमा शक्तिः । श्रीसाम्बसदाशिवप्रीत्यर्थे जपे विनियोगः ॥ अथ ध्यानम् - शान्ताकारं
    शिखरिशयनं नीलकण्ठं सुरेशं विश्वधारं स्फटिकसदृशं शुभ्रवर्णं शुभाङ्गम् । गौरीकान्तं त्रितयनयनं योगिभिर्ध्यानगम्यं
    वन्दे शम्भुं भवभयहरं सर्वलोकैकनाथम् ॥ धवलवपुषमिन्दोर्मण्डले संनिविष्टं भुजगवलयहारं भस्मदिग्धाङ्गमीशम्
    । हरिणपरशुपाणिं चारुचन्द्रार्धमौलिं हृदयकमलमध्ये सन्ततं चिन्मयामि ॥ श्रीविष्णुरुवाच । ॐ शिवो महेश्वरश्शम्भुः
    पिनाकी शशिशेखरः । वामदेवो विरूपाक्षः कपर्दी नीललोहितः ॥ १॥ शङ्करश्शूलपाणिश्च खट्वाङ्गी विष्णुवल्लभः
    । शिपिविष्टोऽम्बिकानाथः श्रीकण्ठो भक्तवत्सलः ॥ २॥ भवश्शर्वस्त्रिलोकेशश्शितिकण्ठश्शिवाप्रियः । उग्रः
    कपाली कामारिरन्धकासुरसूदनः ॥ ३॥ गङ्गाधरो ललाटाक्षः कालकालः कृपानिधिः । भीमः परशुहस्तश्च मृगपाणिर्जटाधरः
    ॥ ४॥ कैलासवासी कवची कठोरस्त्रिपुरान्तकः । वृषाङ्को वृषभारूढो भस्मोद्धूलितविग्रहः ॥ ५॥ सामप्रियस्स्वरमयस्त्रयीमूर्तिरनीश्वरः
    । सर्वज्ञः परमात्मा च सोमसूर्याग्निलोचनः ॥ ६॥ हविर्यज्ञमयस्सोमः पञ्चवक्त्रस्सदाशिवः । विश्वेश्वरो
    वीरभद्रो गणनाथः प्रजापतिः ॥ ७॥ हिरण्यरेता दुर्धर्षः गिरीशो गिरिशोऽनघः । भुजङ्गभूषणो भर्गो गिरिधन्वा
    गिरिप्रियः ॥ ८॥ कृत्तिवासा पुरारातिर्भगवान् प्रमथाधिपः । मृत्युञ्जयस्सूक्ष्मतनुर्जगद्व्यापी जगद्गुरुः
    ॥ ९॥ व्योमकेशो महासेनजनकश्चारुविक्रमः । रुद्रो भूतपतिः स्थाणुरहिर्बुध्न्यो दिगम्बरः ॥ १०॥ अष्टमूर्तिरनेकात्मा
    सात्त्विकश्शुद्धविग्रहः । शाश्वतः खण्डपरशुरजः पाशविमोचकः ॥ ११॥ मृडः पशुपतिर्देवो महादेवोऽव्ययो हरिः
    । (महादेवोऽव्ययः प्रभुः) पूषादन्तभिदव्यग्रो दक्षाध्वरहरो हरः ॥ १२॥ भगनेत्रभिदव्यक्तो सहस्राक्षस्सहस्रपात्
    । अपवर्गप्रदोऽनन्तस्तारकः परमेश्वरः ॥ १३॥ ॥ इति शिवरहस्यान्तर्गते विष्णुप्रोक्तं शिवाष्टोत्तरशतनामस्तोत्रं
    सम्पूर्णम् ॥ - ॥ श्रीशिवरहस्यम् । उग्राख्यः सप्तमांशः । अध्यायः १३ । २०३-२१५ ॥ - ॥ श्रीशिवरहस्यम्
    । उग्राख्यः सप्तमांशः । अध्यायः १३ । २०३-२१५ ॥ फलश्रुतिः । एतदष्टोत्तरं नाम्नां शतमाम्नायसंमितम् ।
    (विष्णुना कथितं पूर्वं पार्वत्या इष्टसिद्धये ।) शङ्करस्य प्रिया गौरी जप्त्वा शम्भुप्रसाददम् ॥ १॥ त्रैकाल्यमन्वहं
    देवी वर्षमेकं प्रयत्नतः । अवाप सा शरीरार्धं प्रसादाच्छूलपाणिनः ॥ २॥ यस्त्रिसन्ध्यं पठेन्नित्यं नाम्नामष्टोत्तरं
    शतम् । शतरुद्रत्रिरावृत्या यत्फलं लभते नरः ॥ ३॥ तत्फलं प्राप्नुयान्नित्यमेकावृत्त्या नसंशयः । सकृद्वा
    नामभिः पूज्य कुलकोटिं समुद्धरेत् ॥ ४॥ बिल्वपत्रैः प्रशस्तैश्च पुष्पैश्च तुलसीदलैः । तिलाक्षतैर्यजेद्यस्तु
    जीवन्मुक्तो न संशयः ॥ ५॥ नाम्नामेषां पशुपतेरेकमेवापवर्गदम् । अन्येषां चावशिष्टाना फलं वक्तुं न शक्यते
    ॥ ६॥ इति श्रीशिवाष्टोत्तरशतदिव्यनामामृतस्तोत्रं सम्पूर्णम् ॥ णोतेस्:'
