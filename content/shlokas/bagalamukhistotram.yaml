id: bagalamukhistotram
category: stotram
name:
  english: bagalamukhistotram
  devanagari: बगलामुखीस्तोत्रम्
content:
  english: mukhistotram shriganeshaya namah | calatkanakakundalollasitacarugandasthalim lasatkanakacampakadyutimadindubimbananam
    | gadahatavipakshakam kalitalolajihvamcalam smarami bagalamukhim vimukhavanmanasstambhinim || 1||
    piyushodadhimadhyacaruviladraktotpale mandape satsimhasanamaulipatitaripum pretasanadhyasinim | svarnabham
    karapiditarirasanam bhramyadgadam vibhratimittham dhyayati yanti tasya sahasa sadyo'tha sarvapadah
    || 2|| devi tvaccaranambujarcanakrite yah pitapushpanjalinbhaktya vamakare nidhaya ca manum mantri
    manojnaksharam | pithadhyanaparo'tha kumbhakavashadbijam smaretparthivam tasyamitramukhasya vaci hridaye
    jadyam bhavettatkshanat || 3|| vadi mukati rankati kshitipatirvaishvanarah shitati krodhi shamyati
    durjanah sujanati kshipranugah khanjati | garvi kharvati sarvavicca jadati tvanmantrina yantritah
    shrirnitye bagalamukhi pratidinam kalyani tubhyam namah || 4|| mantrastavadalam vipakshadalane stotram
    pavitram ca te yantram vadiniyantranam trijagatam jaitram ca citram ca te | matah shribagaleti nama
    lalitam yasyasti jantormukhe tvannamagrahanena samsadi mukhe stambho bhavedvadinam || 5|| dushtastambhanamugravighnashamanam
    daridryavidravanam bhubhritsandamanam calanmrigadrisham cetahsamakarshanam | saubhagyaikaniketanam
    samadrishah karunyapurnekshanam mrityormaranamavirastu purato matastvadiyam vapuh || 6|| matarbhanjaya
    madvipakshavadanam jihvam ca sankilaya brahmim mudraya daityadevadhishanamugram gatim stambhaya |
    shatrumshcurnaya devi tikshnagadaya gaurangi pitambare vighnaugham bagale hara pranamatam karunyapurnekshane
    || 7|| matarbhairavi bhadrakali vijaye varahi vishvashraye shrividye samaye maheshi bagale kameshi
    vame rame | matangi tripure paratparatare svargapavargaprade daso'ham sharanagatah karunaya vishveshvari
    trahi mam || 8|| samrambhe caurasanghe praharanasamaye bandhane vyadhimadhye vidyavade vivade prakupitanripatau
    divyakale nishayam | vashye va stambhane va ripuvadhasamaye nirjane va vane va gacchamstishthamstrikalam
    yadi pathati shivam prapnuyadashu dhirah || 9|| tvam vidya parama trilokajanani vighnaughasamchedini
    yoshitkarshanakarini janamanahsammohasandayini | stambhotsaranakarini pashumanahsammohasandayini jihvakilanabhairavi
    vijayate brahmadimantro yatha || 10|| vidya lakshmirnityasaubhagyamayuh putraih pautraih sarvasamrajyasiddhih
    | mano bhogo vashyamarogyasaukhyam praptam tattadbhutale'sminnarena || 11|| tvatkrite japasannaham
    gaditam parameshvari | dushtanam nigraharthaya tadgrihana namo'stu te || 12|| pitambaram ca dvibhujam
    trinetram gatrakomalam | shilamudgarahastam ca smare tam bagalamukhim || 13|| brahmastramiti vikhyatam
    trishu lokeshu vishrutam | gurubhaktaya datavyam na deyam yasya kasyacit || 14|| nityam stotramidam
    pavitramiha yo devyah pathatyadaraddhritva yantramidam tathaiva samare bahau kare va gale | rajano'pyarayo
    madandhakarinah sarpa mrigendradikaste vai yanti vimohita ripugana lakshmih sthira siddhayah || 15||
    || iti shrirudrayamale tantre shribagalamukhistotram samaptam ||
  devanagari: मुखीस्तोत्रम् श्रीगणेशाय नमः । चलत्कनककुण्डलोल्लसितचारुगण्डस्थलीं लसत्कनकचम्पकद्युतिमदिन्दुबिम्बाननाम्
    । गदाहतविपक्षकां कलितलोलजिह्वांचलां स्मरामि बगलामुखीं विमुखवाङ्मनस्स्तम्भिनीम् ॥ १॥ पीयूषोदधिमध्यचारुविलद्रक्तोत्पले
    मण्डपे सत्सिंहासनमौलिपातितरिपुं प्रेतासनाध्यासिनीम् । स्वर्णाभां करपीडितारिरसनां भ्राम्यद्गदां विभ्रतीमित्थं
    ध्यायति यान्ति तस्य सहसा सद्योऽथ सर्वापदः ॥ २॥ देवि त्वच्चरणाम्बुजार्चनकृते यः पीतपुष्पाञ्जलीन्भक्त्या
    वामकरे निधाय च मनुं मन्त्री मनोज्ञाक्षरम् । पीठध्यानपरोऽथ कुम्भकवशाद्बीजं स्मरेत्पार्थिवं तस्यामित्रमुखस्य
    वाचि हृदये जाड्यं भवेत्तत्क्षणात् ॥ ३॥ वादी मूकति रङ्कति क्षितिपतिर्वैश्वानरः शीतति क्रोधी शाम्यति
    दुर्जनः सुजनति क्षिप्रानुगः खञ्जति । गर्वी खर्वति सर्वविच्च जडति त्वन्मन्त्रिणा यन्त्रितः श्रीर्नित्ये
    बगलामुखि प्रतिदिनं कल्याणि तुभ्यं नमः ॥ ४॥ मन्त्रस्तावदलं विपक्षदलने स्तोत्रं पवित्रं च ते यन्त्रं
    वादिनियन्त्रणं त्रिजगतां जैत्रं च चित्रं च ते । मातः श्रीबगलेति नाम ललितं यस्यास्ति जन्तोर्मुखे त्वन्नामग्रहणेन
    संसदि मुखे स्तम्भो भवेद्वादिनाम् ॥ ५॥ दुष्टस्तम्भनमुग्रविघ्नशमनं दारिद्र्यविद्रावणं भूभृत्सन्दमनं
    चलन्मृगदृशां चेतःसमाकर्षणम् । सौभाग्यैकनिकेतनं समदृशः कारुण्यपूर्णेक्षणम् मृत्योर्मारणमाविरस्तु पुरतो
    मातस्त्वदीयं वपुः ॥ ६॥ मातर्भञ्जय मद्विपक्षवदनं जिह्वां च सङ्कीलय ब्राह्मीं मुद्रय दैत्यदेवधिषणामुग्रां
    गतिं स्तंभय । शत्रूंश्चूर्णय देवि तीक्ष्णगदया गौराङ्गि पीताम्बरे विघ्नौघं बगले हर प्रणमतां कारुण्यपूर्णेक्षणे
    ॥ ७॥ मातर्भैरवि भद्रकालि विजये वाराहि विश्वाश्रये श्रीविद्ये समये महेशि बगले कामेशि वामे रमे । मातङ्गि
    त्रिपुरे परात्परतरे स्वर्गापवर्गप्रदे दासोऽहं शरणागतः करुणया विश्वेश्वरि त्राहि माम् ॥ ८॥ संरम्भे
    चौरसङ्घे प्रहरणसमये बन्धने व्याधिमध्ये विद्यावादे विवादे प्रकुपितनृपतौ दिव्यकाले निशायाम् । वश्ये
    वा स्तम्भने वा रिपुवधसमये निर्जने वा वने वा गच्छंस्तिष्ठंस्त्रिकालं यदि पठति शिवं प्राप्नुयादाशु धीरः
    ॥ ९॥ त्वं विद्या परमा त्रिलोकजननी विघ्नौघसंछेदिनी योषित्कर्षणकारिणी जनमनःसम्मोहसन्दायिनी । स्तम्भोत्सारणकारिणी
    पशुमनःसम्मोहसन्दायिनी जिह्वाकीलनभैरवी विजयते ब्रह्मादिमन्त्रो यथा ॥ १०॥ विद्या लक्ष्मीर्नित्यसौभाग्यमायुः
    पुत्रैः पौत्रैः सर्वसाम्राज्यसिद्धिः । मानो भोगो वश्यमारोग्यसौख्यं प्राप्तं तत्तद्भूतलेऽस्मिन्नरेण
    ॥ ११॥ त्वत्कृते जपसन्नाहं गदितं परमेश्वरि । दुष्टानां निग्रहार्थाय तद्गृहाण नमोऽस्तु ते ॥ १२॥ पीताम्बरां
    च द्विभुजां त्रिनेत्रां गात्रकोमलाम् । शिलामुद्गरहस्तां च स्मरे तां बगलामुखीम् ॥ १३॥ ब्रह्मास्त्रमिति
    विख्यातं त्रिषु लोकेषु विश्रुतम् । गुरुभक्ताय दातव्यं न देयं यस्य कस्यचित् ॥ १४॥ नित्यं स्तोत्रमिदं
    पवित्रमिह यो देव्याः पठत्यादराद्धृत्वा यन्त्रमिदं तथैव समरे बाहौ करे वा गले । राजानोऽप्यरयो मदान्धकरिणः
    सर्पा मृगेन्द्रादिकास्ते वै यान्ति विमोहिता रिपुगणा लक्ष्मीः स्थिरा सिद्धयः ॥ १५॥ ॥ इति श्रीरुद्रयामले
    तन्त्रे श्रीबगलामुखीस्तोत्रं समाप्तम् ॥
