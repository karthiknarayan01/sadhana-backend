id: brahmavishnukritam2shivastotram
category: stotram
name:
  english: brahmavishnukritam2shivastotram
  devanagari: ब्रह्मविष्णुकृतं२शिवस्तोत्रम्
content:
  english: 30|| tena nissaritah shambho pidyamanah samantatah | hritadhikarastridasha vicaranti mahitale
    || 31|| tvam vina na sa vadhyashca sarvesham tridivaukasam | tam ghataya maheshana lokanam sukhamavaha
    || 32|| tvameva nirgunassatyo'nanto'nantaparakramah | sagunashca sanniveshah prakriteh purushatparah
    || 33|| rajasa srishtisamaye tvam brahma srishtikritprabho | sattvena palane vishnustribhuvavanakarakah
    || 34|| tamasa pralaye rudro jagatsamharakarakah | nistraigunye shivakhyatasturyo jyotihsvarupakah
    || 35|| tvam dikshaya ca goloke tvam gavam paripalakah | tvadgoshalamadhyagashca krishnah kridatyaharnisham
    || 36|| tvam sarvakaranam svami vidhi vishnvishvarah param | nirvikari sada sakshi paramatma pareshvarah
    || 37|| dinanathasahayi ca dinanam pratipalakah | dinabandhustrilokeshashsharanagatavatsalah || 38||
    asmanuddhara gaurisha prasida parameshvara | tvadadhina vayam natha yathecchasi tatha kuru || 39||
    iti shivapurane rudrasamhitayam yuddhakhande trimshadhyayantargatam brahma
  devanagari: ३०॥ तेन निस्सारिताः शम्भो पीड्यमानाः समन्ततः । हृताधिकारस्त्रिदशा विचरन्ति महीतले ॥ ३१॥
    त्वां विना न स वध्यश्च सर्वेषां त्रिदिवौकसाम् । तं घातय महेशान लोकानां सुखमावह ॥ ३२॥ त्वमेव निर्गुणस्सत्योऽनन्तोऽनन्तपराक्रमः
    । सगुणश्च सन्निवेशः प्रकृतेः पुरुषात्परः ॥ ३३॥ रजसा सृष्टिसमये त्वं ब्रह्मा सृष्टिकृत्प्रभो । सत्त्वेन
    पालने विष्णुस्त्रिभुवावनकारकः ॥ ३४॥ तमसा प्रलये रुद्रो जगत्संहारकारकः । निस्त्रैगुण्ये शिवाख्यातस्तुर्यो
    ज्योतिःस्वरूपकः ॥ ३५॥ त्वं दीक्षया च गोलोके त्वं गवां परिपालकः । त्वद्गोशालामध्यगश्च कृष्णः क्रीडत्यहर्निशम्
    ॥ ३६॥ त्वं सर्वकारणं स्वामी विधि विष्ण्वीश्वरः परम् । निर्विकारी सदा साक्षी परमात्मा परेश्वरः ॥ ३७॥
    दीनानाथसहायी च दीनानां प्रतिपालकः । दीनबन्धुस्त्रिलोकेशश्शरणागतवत्सलः ॥ ३८॥ अस्मानुद्धर गौरीश प्रसीद
    परमेश्वर । त्वदधीना वयं नाथ यथेच्छसि तथा कुरु ॥ ३९॥ इति शिवपुराणे रुद्रसंहितायां युद्धखण्डे त्रिंशाध्यायान्तर्गतं
    ब्रह्म
