id: sarvasara
category: upanishad
name:
  english: sarvasara
  devanagari: सर्वसर
content:
  english: matrasvabhavam param brahmetyucyate | maya nama anadirantavati pramanapramanasadharana na sati
    nasati na sadasati svayamadhika vikararahita nirupyamana satitaralakshanashunya sa mayetyucyate |
    ajnanam tucchapyasati kalatraye'pi pamaranam vastavi ca sattvabuddhirlaukikanamidamitthamityanirvacaniya
    vaktum na shakyate | naham bhavamyaham devo nendriyani dashaiva tu | na buddhirna manah shashvannahankarastathaiva
    ca || 1|| aprano hyamanah shubhro buddhyadinam hi sarvada | sakshyaham sarvada nityashcinmatro'ham
    na samshayah || 2|| naham karta naiva bhokta prakriteh sakshirupakah | matsannidhyatpravartante dehadya
    ajada iva || 3|| sthanurnityah sadanandah shuddho jnanamayo'malah | atmaham sarvabhutanam vibhuh sakshi
    na samshayah || 4|| brahmaivaham sarvavedantavedyam naham vedyam vyomavatadirupam | rupam naham nama
    naham na karma brahmaivaham saccidanandarupam || 5|| naham deho janmamrityu kuto me naham pranah kshutpipase
    kuto me | naham cetah shokamohau kuto me naham karta bandhamokshau kuto ma ityupanishat || om saha
    navavatu || saha nau bhunaktu || saha viryam karavavahai || tejasvinavadhitamastu ma vidvishavahai
    || om shantih shantih shantih ||
  devanagari: मात्रस्वभावं परं ब्रह्मेत्युच्यते । माया नाम अनादिरन्तवती प्रमाणाप्रमाणसाधारणा न सती नासती
    न सदसती स्वयमधिका विकाररहिता निरूप्यमाणा सतीतरलक्षणशून्या सा मायेत्युच्यते । अज्ञानं तुच्छाप्यसती
    कालत्रयेऽपि पामराणां वास्तवी च सत्त्वबुद्धिर्लौकिकानामिदमित्थमित्यनिर्वचनीया वक्तुं न शक्यते । नाहं
    भवाम्यहं देवो नेन्द्रियाणि दशैव तु । न बुद्धिर्न मनः शश्वन्नाहङ्कारस्तथैव च ॥ १॥ अप्राणो ह्यमनाः शुभ्रो
    बुद्ध्यादीनां हि सर्वदा । साक्ष्यहं सर्वदा नित्यश्चिन्मात्रोऽहं न संशयः ॥ २॥ नाहं कर्ता नैव भोक्ता
    प्रकृतेः साक्षिरूपकः । मत्सान्निध्यात्प्रवर्तन्ते देहाद्या अजडा इव ॥ ३॥ स्थाणुर्नित्यः सदानन्दः शुद्धो
    ज्ञानमयोऽमलः । आत्माहं सर्वभूतानां विभुः साक्षी न संशयः ॥ ४॥ ब्रह्मैवाहं सर्ववेदान्तवेद्यं नाहं वेद्यं
    व्योमवातादिरूपम् । रूपं नाहं नाम नाहं न कर्म ब्रह्मैवाहं सच्चिदानन्दरूपम् ॥ ५॥ नाहं देहो जन्ममृत्यु
    कुतो मे नाहं प्राणः क्षुत्पिपासे कुतो मे । नाहं चेतः शोकमोहौ कुतो मे नाहं कर्ता बन्धमोक्षौ कुतो म
    इत्युपनिषत् ॥ ॐ सह नाववतु ॥ सह नौ भुनक्तु ॥ सह वीर्यं करवावहै ॥ तेजस्विनावधीतमस्तु मा विद्विषावहै
    ॥ ॐ शान्तिः शान्तिः शान्तिः ॥
