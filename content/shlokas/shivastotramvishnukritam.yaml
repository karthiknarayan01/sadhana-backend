id: shivastotramvishnukritam
category: stotram
name:
  english: shivastotramvishnukritam
  devanagari: शिवस्तोत्रम्विष्णुकृतं
content:
  english: adharmabahulam kritva tripuram munipungavah | mahadevamanuprapya sharanam sarvadehinam || 51||
    tushtava stotravaryena bhagavantam sanatanam | dandavatmanipatyaha jale sthitva samahitah || 52||
    namah sarvatmane tubhyam shankarayartiharine | rudraya nilakanthaya kadrudraya pracetase || 53|| gatistvam
    sarvada'smakam nanyadevarimardana | tvamadistvamanadistvamanantashcakshayah prabhuh || 54|| prakritih
    purushah sakshaddrashta harta jagadguruh | trata neta jagatyasminndvijadindvijavatsalah || 55|| varado
    vanmayo vacyo vacyavacakavarjitah | dhyeyo muktyarthamishano yogibhiryogavittamaih || 56|| hritpundarikasushire
    yoginam samsthitam sada | vadanti surayah santam parabrahmasvarupinam || 57|| bhavantam tattvamityahustejorashim
    paratparam | paramatmanamityahurasminjagati yadvibho || 58|| drishtam shrutam sthitam sarva jayamanam
    jagadguro | anoralpataram pahumahato'pi mahattaram || 59|| sarvatahpanipadantam sarvato'kshishiromukham
    || mahadevamanirdeshyam sarvajnam tvamanamayam || 60|| vishvarupam virupaksham sadashivamanuttamam
    | kotibhaskarasankasham kotishitamshusannibham || 61|| kotikalagnisankasham shadvimshatmakamishvaram
    | pravartakam jagatyasminprakriteh prapitamaham || 62|| vadanti varadam devam sarvavasam svayambhuvam
    | shrutayah shrutisaram tvam shrutisaravidashca ye || 63|| adrishtamasmabhiranekamurte dvidha kritam
    yadbhavata nu loke | tadeva daityasurabhusurashca devasurah sthavarajanganmashca || 64|| pahi nanya
    gatih shambho vinihatyasurankshanat | mayaya mohitah sarve daityaste parameshvara || 65|| yatha tarangah
    shapharisamuha yudhyanti
  devanagari: अधर्मबहुलं कृत्वा त्रिपुरं मुनिपुङ्गवाः । महादेवमनुप्राप्य शरणं सर्वदेहिनाम् ॥ ५१॥ तुष्टाव
    स्तोत्रवर्येण भगवन्तं सनातनम् । दण्डवत्मणिपत्याह जले स्थित्वा समाहितः ॥ ५२॥ नमः सर्वात्मने तुभ्यं
    शङ्करायार्तिहारिणे । रुद्राय नीलकण्ठाय कद्रुद्राय प्रचेतसे ॥ ५३॥ गतिस्त्वं सर्वदाऽस्माकं नान्यदेवारिमर्दन
    । त्वमादिस्त्वमनादिस्त्वमनन्तश्चाक्षयः प्रभुः ॥ ५४॥ प्रकृतिः पुरुषः साक्षाद्द्रष्टा हर्ता जगद्गुरुः
    । त्राता नेता जगत्यस्मिन्न्द्विजादीन्द्विजवत्सलः ॥ ५५॥ वरदो वाङ्मयो वाच्यो वाच्यवाचकवर्जितः । ध्येयो
    मुक्त्यर्थमीशानो योगिभिर्योगवित्तमैः ॥ ५६॥ हृत्पुण्डरीकसुषिरे योगिनां संस्थितं सदा । वदन्ति सूरयः
    सन्तं परब्रह्मस्वरूपिणम् ॥ ५७॥ भवन्तं तत्त्वमित्याहुस्तेजोराशिं परात्परम् । परमात्मानमित्याहुरस्मिञ्जगति
    यद्विभो ॥ ५८॥ दृष्टं श्रुतं स्थितं सर्व जायमानं जगद्गुरो । अणोरल्पतरं पाहुमहतोऽपि महत्तरम् ॥ ५९॥ सर्वतःपाणिपादान्तं
    सर्वतोऽक्षिशिरोमुखम् ॥ महादेवमनिर्देश्यं सर्वज्ञं त्वामनामयम् ॥ ६०॥ विश्वरूपं विरूपाक्षं सदाशिवमनुत्तमम्
    । कोटिभास्करसङ्काशं कोटिशीतांशुसन्निभम् ॥ ६१॥ कोटिकालाग्निसङ्काशं षड्विंशात्मकमीश्वरम् । प्रवर्तकं
    जगत्यस्मिन्प्रकृतेः प्रपितामहम् ॥ ६२॥ वदन्ति वरदं देवं सर्वावासं स्वयम्भुवम् । श्रुतयः श्रुतिसारं
    त्वां श्रुतिसारविदश्च ये ॥ ६३॥ अदृष्टमस्माभिरनेकमूर्ते द्विधा कृतं यद्भवता नु लोके । तदेव दैत्यासुरभूसुराश्च
    देवासुराः स्थावरजङ्गन्माश्च ॥ ६४॥ पाहि नान्या गतिः शम्भो विनिहत्यासुरान्क्षणात् । मायया मोहिताः सर्वे
    दैत्यास्ते परमेश्वर ॥ ६५॥ यथा तरङ्गाः शफरीसमूहा युध्यन्ति
