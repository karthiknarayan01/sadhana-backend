    सुमन॒स्यमा॑नो व॒यग्ग् स्स॒पत्नान्॑ ॥ च॒तु॒श्च॒त्वा॒रि॒ग्ं॒श स्स्तोमो॒ वर्चो॒ द्रवि॑णग्ं षोड॒श स्स्तोम॒
    ओजो॒ द्रवि॑ण म्पृथि॒व्याः पुरी॑षम॒ स्यफ्सो॒ नाम॑ । एव॒ श्छन्दो॒ वरि॑व॒ श्छन्दः॑ श॒भूं श्छन्दः॑ परि॒भू
    श्छन्द॑ आ॒च्छच्छन्दो॒ मन॒ श्छन्दो॒ व्यच॒ श्छन्द॒ स्सिन्धु॒ श्छन्दः॑ समु॒द्र यँच्छन्दो॑ वि॒यच्छन्दो॑
    बृ॒हच्छन्दो॑ रथन्त॒र ञ्छन्दो॑ निका॒य श्छन्दो॑ विव॒ध श्छन्दो॒ गिर॒ श्छन्दो॒ भ्रज॒ श्छन्दः॑ स॒ष्टु प्छन्दः॑
    क॒कुच्छन्द॑ स्त्रिक॒कुच्छन्दः॑ का॒व्य प॒दप॑ङ्क्ति॒ श्छन्दो॒ प॒दप॑ङ्क्ति॒ श्छन्दो॒ ऽक्षर॑पङ्क्ति॒ श्छन्दो॑
    विष्टा॒रप॑ङ्क्ति॒ श्छन्दः॑ क्षु॒रो भृज्वा॒ञ्छन्दः॑ प्र॒च्छच्छन्दः॑ प॒क्ष श्छन्द॒ एव॒ श्छन्दो॒ वरि॑व॒
    श्छन्दो॒ वय॒ श्छन्दो॑ वय॒स्कृच्छन्दो॑ विशा॒ल ञ्छन्दो॒ विष्प॑र्धा॒ श्छन्द॑ श्छ॒दि श्छन्दो॑ दूरोह॒ण
    स्त्रय॑स्त्रिग्ंशच्च अ॒ग्निर्वृ॒त्राणि॑ जङ्घन द्द्रविण॒स्युर्वि॑प॒न्यया श्शु॒क्र आहु॑तः ॥ त्वग्ं सो॑मासि॒
    सत्प॑ति॒स्त्वग्ं राजो॒त वृ॑त्र॒हा । त्व म्भ॒द्रो अ॑सि॒ क्रतुः॑ ॥ भ॒द्रा ते॑ अग्ने स्वनीक स॒दृङ्ग्घो॒रस्य॑
    स॒तो विषु॑णस्य॒ चारुः॑ । न य त्ते॑ शो॒चिस्तम॑सा॒ वर॑न्त॒ न ध्व॒स्मान॑स्त॒नुवि॒ रेप॒ आ धुः॑ ॥ भ॒द्र
    न्ते॑ अग्ने सहसि॒न्ननी॑कमुपा॒क आ रो॑चते॒ सूर्य॑स्य । द्दृ॒शे द॑दृशे नक्त॒या चि॒दरू ऽनी॑केन सुवि॒दत्रो॑
    अ॒स्मे यष्टा॑ दे॒वाग्ं आय॑जिष्ठ स्स्व॒स्ति । अद॑ब्धो गो॒पा उ॒त नः॑ पर॒स्पा अग्ने द्दि॑दीहि ॥ स्व॒स्ति
    नो॑ दि॒वो अ॑ग्ने पृथि॒व्या वि॒श्वायु॑र्धेहि य॒जथा॑य देव । य थ्सी॒महि॑ दिविजात॒ प्रश॑स्त॒ न्तद॒स्मासु॒
    द्रवि॑ण न्धेहि चि॒त्रम् ॥ यथा॑ होत॒र्मनु॑षो दे॒वता॑ता य॒ज्ञेभिः॑ सूनो सहसो॒ यजा॑सि । ए॒वा नो॑ अ॒द्य
    स॑म॒ना स॑मा॒नानु॒ शन्न॑ग्न उश॒तो य॑क्षि दे॒वान् ॥ अ॒ग्निमी॑डे पु॒रोहि॑तं यँ॒ज्ञस्य॑ दे॒वमृ॒त्विज म्
    । होता॑रग्ं रत्न॒धात॑मम् ॥ वृषा॑ सोम द्यु॒माग्ं अ॑सि॒ वृषा॑ देव॒ वृष॑व्रतः । वृषा॒ धर्मा॑णि दधिषे
    ॥ सान्त॑पना इ॒दग्ं ह॒विर्मरु॑त॒स्तज्जु॑जुष्टन । यु॒ष्माको॒ती रि॑शादसः ॥ यो नो॒ मर्तो॑ वसवो दुर् जिघाग्ं॑सात्
    । द्रु॒हः पाश॒ म्प्रति॒ स मु॑चीष्ट॒ तपि॑ष्ठेन॒ तप॑सा हन्तना॒ तम् ॥ सं॒ वँ॒थ्स॒रीणा॑ म॒रुतः॑ स्व॒र्का
    उ॑रु॒क्षया॒ स्सग॑णा॒ मानु॑षेषु । ते न्प्र मु॑ञ्च॒न्त्वग्ंह॑स स्सान्तप॒ना म॑दि॒रा मा॑दयि॒ष्णवः॑ ॥ पि॒प्री॒हि
    दे॒वाग्ं उ॑श॒तो य॑विष्ठ वि॒द्वाग्ं ऋ॒तूग्ंर् ऋ॑तुपते यजे॒ह । ये दैव्या॑ ऋ॒त्विज॒स्तेभि॑रग्ने॒ त्वग्ं
    होतॄ॑णाम॒स्याय॑जिष्ठः ॥ अग्ने॒ यद॒द्य वि॒शो अ॑द्ध्वरस्य होतः॒ पाव॑क शो॒चे॒ वेष्ट्वग्ं हि शोचे॒ वेष्ट्वग्ं
    हि यज्वा । ऋ॒ता य॑जासि महि॒ना वि यद्भूर् ह॒व्या व॑ह यविष्ठ॒ या ते॑ अ॒द्य ॥ अ॒ग्निना॑ र॒यि त्पोष॑मे॒व
    दि॒वेदि॑वे । य॒शसं॑ वीँ॒रव॑त्तमम् ॥ ग॒य॒स्फानो॑ अमीव॒हा व॑सु॒वि त्पु॑ष्टि॒वर्ध॑नः । सु॒मि॒त्र स्सो॑म
    नो भव ॥ गृह॑मेधास॒ आ ग॑त॒ मरु॑तो॒ मा ऽप॑ भूतन । प्र॒मु॒ञ्चन्तो॑ नो॒ अग्ंह॑सः ॥ पू॒र्वीभि॒र्॒हि द॑दाशि॒म
    श॒रद्भि॑र्मरुतो व॒यम् । महो॑भि षणी॒नाम् ॥ प्रबु॒द्ध्निया॑ ईरते वो॒ महाग्ं॑सि॒ प्रणामा॑नि प्रयज्यवस्तिरद्ध्वम्
    । स॒ह॒स्रिय॒ म्मरुतो जुषद्ध्वम् ॥ उप॒ यमेति॑ युव॒ति । उप॒ स्वैन॑म॒रम॑तिर्व सू॒युः ॥ इ॒मो अ॑ग्ने वी॒तत॑मानि
    ह॒व्या ऽज॑स्रो वक्षि दे॒वता॑ति॒मच्छ॑ । प्रति॑ न ईग्ं सुर॒भीणि॑ वियन्तु ॥ क्री॒डं श्शर्धो॒ मारु॑तमन॒र्वाणग्ं॑
    रथे॒शुभ कण्वा॑ अ॒भि प्र गा॑यत ॥ अत्या॑सो॒ न ये म॒रुत॒ स्स्वञ्चो॑ यक्ष॒दृशो॒ न शु॒भय॑न्त॒ मर्याः श्शिश॑वो॒
    न शु॒भ्रा व॒थ्सासो॒ न प्र॑क्री॒डिनः॑ पयो॒धाः ॥ प्रैषा॒मज्मे॑षु विथु॒रेव॑ रेजते॒ भूमि॒र्यामे॑षु॒ यद्ध॑
    यु॒ञ्जते॑ शु॒भे । ते क्री॒डयो॒ धुन॑यो॒ भ्राज॑दृष्टय म्प॑नयन्त॒ धूत॑यः ॥ उ॒प॒ह्व॒रेषु॒ यदचि॑द्ध्वं
    त्प॒था । श्चोत॑न्ति॒ कोशा॒ उप॑ वो॒ रथे॒ष्वा घृ॒तमु॑क्षता॒ मधु॑वर्ण॒मर्च॑ते ॥ अ॒ग्निम॑ग्नि॒ग्ं॒ हवी॑मभि॒
    स्सदा॑ हवन्त वि॒श्पति म्पुरुप्रि॒यम् ॥ तग्ं हि शश्व॑न्त॒ ईड॑ते स्रु॒चा दे॒व । अ॒ग्निग्ं ह॒व्याय॒ वोढ॑वे
    ॥ इन्द्रा श्श्ञथ॑द्वृ॒त्र मिन्द्रं॑ वोँ वि॒श्वत॒स्परीन्द्र॒ ह॒विषा॑ वावृधा॒नो विश्व॑कर्मन् ॥ हरिः॑
