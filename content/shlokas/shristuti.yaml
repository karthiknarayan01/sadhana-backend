id: shristuti
category: stotram
name:
  english: shristuti
  devanagari: श्रीस्तुति
content:
  english: shristutih shrikanakadharalakshmistavarajah shriganeshaya namah | shrimate ramanujaya namah
    | shrimanvenkatanatharyah kavitarkikakesari | vedantacaryavaryo sannidhattam sada hridi || ishanam
    jagato'sya venkatapatervishnoh para preyasim tvadvakshasthalanityavasarasikam tatkshantisamvardvitim
    | padmalankritapanipallavayutam padmasanastham shriyam vatsalyadigunojjvalam bhagavati vande jaganmataram
    || manatitaprathitavibhavam mangalam mangalanam vakshahpitham madhuvijayino bhushayantim svakantya
    | pratyakshanushravikamahimaprarthininam prajanam shreyomurtim shriyamasharanastvam sharanyam prapadye
    || 1|| avirbhavah kalashajaladhavadhvare va'pi yasyah sthanam yasyah sarasijavanam vishnuvakshahsthalam
    va | bhuma yasya bhuvanamakhilam devi divyam padam va stokaprajnairanavadhiguna stuyase sa katham
    tvam || 2|| stotavyatvam dishati bhavati dehibhih stuyamana tameva tvamanitaragatih stotumashamsamanah
    | siddharambhah sakalabhuvanashlaghaniyo bhaveyam sevapeksha tava caranayoh shreyase kasya na syat
    || 3|| yatsankalpadbhavati kamale yatra dehinyamisham janmasthemapralayaracana jangamajangamanam |
    tatkalyanam kimapi yaminamekalakshyam samadhau purnam tejah sphurati bhavatipadalaksharasankam ||
    4|| nishpratyuhapranayaghatitam devi nityanapayam vishnustvam cetyanavadhigunam dvandvamanyonyalakshyam
    | sheshashcittam vimalamanasam maulayashca shrutinam sampadyante viharanavidhau yasya shayyavisheshah
    || 5|| uddeshyatvam janani bhajatorujjhitopadhigandham pratyagrupe havishi yuvayorekasheshitvayogat
    | padme patyustava ca nigamairnityamanvishyamano navacchedam bhajati mahima nartayana manasam nah
    || 6|| pashyantishu shrutishu paritah surivrindena sardham madhyekritya trigunaphalakam nirmitasthanabhedam
    | vishvadhishapranayini sada vibhramadyutavrittau brahmeshadya dadhati yuvayorakshasharapracaram ||
    7|| asyeshana tvamasi jagatah samshrayanti mukundam lakshmih padma jaladhitanaya vishnupatnindireti
    | yannamani shrutiparipananyevamavartayanto navartante duritapavanaprerite janmacakre || 8|| tvamevahuh
    katicidapare tvatpriyam lokanatham kim tairantahkalahamalinaih kinciduttirya magnaih | tvatsamprityai
    viharati harau sammukhinam shrutinam bhavarudhau bhagavati yuvam dampati daivatam nah || 9|| apannartiprashamanavidhau
    baddhadikshasya vishnoracakhyustvam priyasahacarimaikamatyopapannam | pradurbhavairapi samatanuh pradhvamanviyase
    tvam durotkshiptairiva madhurata dugdharashestarange || 10|| dhatte shobham harimarakate tavaki murtiradya
    tanvi tumgastanabharanata taptajambunadabha | yasyam gacchantyudayavilayairnityamanandasindha
  devanagari: श्रीस्तुतिः श्रीकनकधारालक्ष्मीस्तवराजः श्रीगणेशाय नमः । श्रीमते रामानुजाय नमः । श्रीमान्वेङ्कटनाथार्यः
    कवितार्किककेसरी । वेदान्ताचार्यवर्यो सन्निधत्तां सदा हृदि ॥ ईशानां जगतोऽस्य वेङ्कटपतेर्विष्णोः पर
    प्रेयसीं त्वद्वक्षस्थलनित्यवासरसिकां तत्क्षान्तिसंवर्द्वितीम् । पद्मालङ्कृतपाणिपल्लवयुतां पद्मासनस्थां
    श्रियं वात्सल्यादिगुणोज्ज्वलां भगवती वन्दे जगन्मातरम् ॥ मानातीतप्रथितविभवां मङ्गलं मङ्गलानां वक्षःपीठं
    मधुविजयिनो भूषयन्तीं स्वकान्त्या । प्रत्यक्षानुश्रविकमहिमप्रार्थिनीनां प्रजानां श्रेयोमूर्तिं श्रियमशरणस्त्वां
    शरण्यां प्रपद्ये ॥ १॥ आविर्भावः कलशजलधावध्वरे वाऽपि यस्याः स्थानं यस्याः सरसिजवनं विष्णुवक्षःस्थलं
    वा । भूमा यस्या भुवनमखिलं देवि दिव्यं पदं वा स्तोकप्रज्ञैरनवधिगुणा स्तूयसे सा कथं त्वम् ॥ २॥ स्तोतव्यत्वं
    दिशति भवती देहिभिः स्तूयमाना तामेव त्वामनितरगतिः स्तोतुमाशंसमानः । सिद्धारम्भः सकलभुवनश्लाघनीयो भवेयं
    सेवापेक्षा तव चरणयोः श्रेयसे कस्य न स्यात् ॥ ३॥ यत्सङ्कल्पाद्भवति कमले यत्र देहिन्यमीषां जन्मस्थेमप्रलयरचना
    जङ्गमाजङ्गमानाम् । तत्कल्याणं किमपि यमिनामेकलक्ष्यं समाधौ पूर्णं तेजः स्फुरति भवतीपादलाक्षारसाङ्कम्
    ॥ ४॥ निष्प्रत्यूहप्रणयघटितं देवि नित्यानपायं विष्णुस्त्वं चेत्यनवधिगुणं द्वन्द्वमन्योन्यलक्ष्यम् ।
    शेषश्चित्तं विमलमनसां मौलयश्च श्रुतीनां सम्पद्यन्ते विहरणविधौ यस्य शय्याविशेषाः ॥ ५॥ उद्देश्यत्वं
    जननि भजतोरूज्झितोपाधिगन्धं प्रत्यग्रूपे हविषि युवयोरेकशेषित्वयोगात् । पद्मे पत्युस्तव च निगमैर्नित्यमन्विष्यमाणो
    नावच्छेदं भजति महिमा नर्तयन मानसं नः ॥ ६॥ पश्यन्तीषु श्रुतिषु परितः सूरिवृन्देन सार्धं मध्येकृत्य
    त्रिगुणफलकं निर्मितस्थानभेदम् । विश्वाधीशप्रणयिनी सदा विभ्रमद्यूतवृत्तौ ब्रह्मेशाद्या दधति युवयोरक्षशारप्रचारम्
    ॥ ७॥ अस्येशाना त्वमसि जगतः संश्रयन्ती मुकुन्दं लक्ष्मीः पद्मा जलधितनया विष्णुपत्नीन्दिरेति । यन्नामानि
    श्रुतिपरिपणान्येवमावर्तयन्तो नावर्तन्ते दुरितपवनप्रेरिते जन्मचक्रे ॥ ८॥ त्वामेवाहुः कतिचिदपरे त्वत्प्रियं
    लोकनाथं किं तैरन्तःकलहमलिनैः किञ्चिदुत्तीर्य मग्नैः । त्वत्सम्प्रीत्यै विहरति हरौ सम्मुखीनां श्रुतीनां
    भावारूढौ भगवति युवां दम्पती दैवतं नः ॥ ९॥ आपन्नार्तिप्रशमनविधौ बद्धदीक्षस्य विष्णोराचख्युस्त्वां प्रियसहचरीमैकमत्योपपन्नाम्
    । प्रादुर्भावैरपि समतनुः प्राध्वमन्वीयसे त्वं दूरोत्क्षिप्तैरिव मधुरता दुग्धराशेस्तरङ्गे ॥ १०॥ धत्ते
    शोभां हरिमरकते तावकी मूर्तिराद्या तन्वी तुंगस्तनभरनता तप्तजाम्बूनदाभा । यस्यां गच्छन्त्युदयविलयैर्नित्यमानन्दसिन्धा
