content:
  english: mayamalava gaula janyaraga tisra jati triputa talam angah kannada pallavi hariya karunadolada
    bhagyava hari samarpane madi badukiro caranam kereya niranu kerege calli varava padèdava rante kaniro
    shri purandhara viththala raya carana kamalavanòdi badukiro | da pa | ma pa || da da pa | ma ma |
    pa | ra nu || ke re ge | cal | da pa | ma pa || da da pa | ma ga | ri sa || va ra va | pa dè | da
    va || ram | ni ro || pallavi sa ri ri | sa ri | sa ri || da da pa | ma ga | ri sa || ha ri ya | ka
    ru | na do || la | da pa || da da pa | ma ga | ri sa || ha ri sa | ma di | ba du | ki ro || sa ri
    ri | sa ri | sa ri || da da pa | ma ga | ri sa || ha ri ya | ka ru | na do || la | da pa | ma pa ||
    da da pa | ma ma | pa | dha ra || vi ththa la | ra | da pa | ma pa || da da pa | ma ga | ri sa ||
    ca ra na | ka ma | la va || no di | ba du | ki ro || pallavi sa ri ri | sa ri | sa ri || da da pa
    | ma ga | ri sa || ha ri ya | ka ru | na do || la | da pa || da da pa | ma ga | ri sa || ha ri sa
    | ma di | ba du | ki ro || sa ri ri | sa ri | sa ri || da da pa | ma ga | ri sa || ha ri ya | ka ru
    | na do || la
