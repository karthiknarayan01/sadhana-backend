id: pitambararatnavalistotram
category: stotram
name:
  english: pitambararatnavalistotram
  devanagari: पीताम्बररत्नावलीस्तोत्रम्
content:
  english: devi jagatpalikam || 35|| haste bhati gada sadarttishamani ratnavali tvadbhuje pade nupuramishamaulimanibhirnirajitam
    rajate | tatankam shravane kucopari sada kasturikalepanam kashmiradravamangaragamadhikam pitacchavim
    tanvate || 36|| omkaradvayasamputena putita vidyagame samsthita shatcakraksharabijasararacitam shattrimshadarnatmikam
    | ye jananti japanti santatamabhidhyayanti gayanti va te vandya vibudhaishcaranti bhuvane siddharcitah
    siddhaye || 37|| svahashaktirupasane tava rishih shrinarado devata nitya shribagalamukhi nigadita
    chando bhavet trishtubham | bijam tu sthiramayaya viracitam nanavidhastambhane proktam padmabhuva'khilaptiviniyogo'pyacyutakarata
    || 38|| hridyam sarvasureshvaraishca rishibhirdushprapyamevadbhutam stotram gopyatamam svabhagyavashatah
    praptam pathishyanti ye | suktya devagurum dhanena ghanadam jitva ciranjivitam shanmasat sukhasagare
    shivasamakridam karishyanti te || 39|| devi svapnagata svayaiva likhitam mahyam dadavadbhutam divyastram
    puratah pathasva vimalam sinduravarnaih karaih | romancankitaharshamapya lulitairangaih pathantam
    nara
  devanagari: देवी जगत्पालिकाम् ॥ ३५॥ हस्ते भाति गदा सदार्त्तिशमनी रत्नावली त्वद्भुजे पादे नूपुरमीशमौलिमणिभिर्नीराजितं
    राजते । ताटङ्कं श्रवणे कुचोपरि सदा कस्तुरिकालेपनं काश्मीरद्रवमङ्गरागमधिकां पीतच्छविं तन्वते ॥ ३६॥
    ॐकारद्वयसम्पुटेन पुटिता विद्यागमे संस्थिता षट्चक्राक्षरबीजसाररचितां षट्त्रिंशदर्णात्मिकाम् । ये जानन्ति
    जपन्ति सन्ततमभिध्यायन्ति गायन्ति वा ते वन्द्या विबुधैश्चरन्ति भुवने सिद्धार्चिताः सिद्धये ॥ ३७॥ स्वाहाशक्तिरुपासने
    तव ऋषिः श्रीनारदो देवता नित्या श्रीबगलामुखी निगदिता छन्दो भवेत् त्रिष्टुभम् । बीजं तु स्थिरमायया विरचितं
    नानाविधस्तम्भने प्रोक्तं पद्मभुवाऽखिलाप्तिविनियोगोऽप्यच्युताकारता ॥ ३८॥ हृद्यं सर्वसुरेश्वरैश्च ऋषिभिर्दुष्प्राप्यमेवाद्भुतं
    स्तोत्रं गोप्यतमं स्वभाग्यवशतः प्राप्तं पठिष्यन्ति ये । सूक्त्या देवगुरुं धनेन घनदं जित्वा चिरञ्जीवितां
    षण्मासात् सुखसागरे शिवसमाक्रीडां करिष्यन्ति ते ॥ ३९॥ देवी स्वप्नगता स्वयैव लिखितं मह्यं ददावद्भुतं
    दिव्यास्त्रं पुरतः पठस्व विमलं सिन्दूरवर्णैः करैः । रोमाञ्चाङ्कितहर्षमाप्य लुलितैरङ्गैः पठन्तं नर
