    मदन मद मोचन। कामु जारि रति कहुँ बरु दीन्हा। कृपासिन्धु यह अति भल कीन्हा ॥ सासति करि पुनि करहिं पस्
    । नाथ प्रभुन्ह कर सहज सुभ् ॥ पारबतीं तपु कीन्ह अपारा। करहु तासु अब अङ्गीकारा ॥ सुनि बिधि बिनय समुझि
    प्रभु बानी। ऐसेइ हौ कहा सुखु मानी ॥ तब देवन्ह दुन्दुभीं बजाईं। बरषि सुमन जय जय सुर साई ॥ अवसरु जानि
