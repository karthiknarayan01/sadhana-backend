id: ashtamukhagandabherundanrisimhamulamahamantrah
category: mantra
name:
  english: ashtamukhagandabherundanrisimhamulamahamantrah
  devanagari: अष्टमुखगण्डभेरुण्डनृसिंहमूलमहामन्त्रः
content:
  english: grahabrahmarakshasagrahadakini grahashakini grahavetala grahagandharva grahadanava grahapasmara
    grahakshudragraha jvaragraha rogagraha ratigraha chayagraha apamrityugraha yamadutagraha sarvagraha
    mahamayagraha asadhyagrahanam kha~ kha~ bhedaya bhedaya bam bam badhaya badhaya shoshaya shoshaya
    ram ram dahaya dahaya ksham ksham kshobhaya kshobhaya khrem khrem khadaya khadaya sram sram tapaya
    tapaya hraum hraum trota troya vram vram bhramaya bhramaya lim lim lotaya lotaya dram dram motaya
    motaya gam gam gulum gulum chrim chrim dilu dilu hrum hrum turu turu mrim mrim muru muru tram tram
    heli heli shraum shraum mili mili vam vam vajrapakshadyataya ghataya curnaya curnaya phrem phrem vajranakhena
    krintaya krintaya kham kham khadgena khandaya khandaya khem khem maraya maraya ashtamukha gandabherundamahanrisimha
    mahadhira mahavira mahashura mahamaya sam sam sarvadushtagrahanam pidam hana hana phat phat bhutani
    phat phat pishacan phat phat sarva grahan phat phat mahadyotam aghoram duritapaham | ayushkaram mrityuharam
    angarogadinashanam || ekavartanamatrena avesham tasya siddhayet || bhasmasparshamatrena sarvagrahabhayam
    haret || iti shri gandabherundanrisimhastotram samaptam || iti ashtamukhagandabherunda nrisimhamulamahamantrah
    sampurnah |
  devanagari: ग्रहब्रह्मराक्षसग्रहडाकिनी ग्रहशाकिनी ग्रहवेताल ग्रहगान्धर्व ग्रहदानव ग्रहापस्मार ग्रहक्षुद्रग्रह
    ज्वरग्रह रोगग्रह रतिग्रह छायाग्रह अपमृत्युग्रह यमदूतग्रह सर्वग्रह महामायाग्रह असाध्यग्रहाणां खँ खँ
    भेदय भेदय बां बां बाधय बाधय शोषय शोषय रं रं दाहय दाहय क्षां क्षां क्षोभय क्षोभय ख्रें ख्रें खादय खादय
    स्रां स्रां तापय तापय ह्रौं ह्रौं त्रोट त्रोय व्रां व्रां भ्रामय भ्रामय ऌं ऌं लोटय लोटय द्रां द्रां
    मोटय मोटय गं गं गुलुं गुलुं छ्रीं छ्रीं दिलु दिलु ह्रुं ह्रुं तुरू तुरू म्रीं म्रीं मुरू मुरू त्रां
    त्रां हेलि हेलि श्रौं श्रौं मिलि मिलि वं वं वज्रपक्षद्यातय घातय चूर्णय चूर्णय फ्रें फ्रें वज्रनखेन
    कृन्तय कृन्तय खं खं खड्गेन खण्डय खण्डय खें खें मारय मारय अष्टमुख गण्डभेरुण्डमहनृसिंह महाधीर महावीर
    महाशूर महामाय सं सं सर्वदुष्टग्रहाणां पीडां हन हन फट् फट् भूतानि फट् फट् पिशाचान् फट् फट् सर्व ग्रहान्
    फट् फट् महाद्योतं अघोरं दुरितापहम् । आयुष्करं मृत्युहरं अङ्गरोगादिनाशनम् ॥ एकावर्तनमात्रेण आवेशं तस्य
    सिद्धयेत् ॥ भस्मस्पर्शमात्रेण सर्वग्रहभयं हरेत् ॥ इति श्री गण्डभेरुण्डनृसिंहस्तोत्रं समाप्तम् ॥ इति
    अष्टमुखगण्डभेरुण्ड नृसिंहमूलमहामन्त्रः सम्पूर्णः ।
