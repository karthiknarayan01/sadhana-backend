id: vishnu-shodasha-nama-stotram
category: stotram
name:
  english: Vishnu Shodasha Nama Stotram
content:
  english: aushadhe cintayedvishnum bhojane ca janardanam | shayane padmanabham ca vivahe ca prajapatim
    || || yuddhe cakradharam devam pravase ca trivikramam | narayanam tanutyage shridharam priyasangame
    || || dussvapne smara govindam sankate madhusudanam | kanane narasimham ca pavake jalashayinam ||
    || jalamadhye varaham ca parvate raghunandanam | gamane vamanam caiva sarvakaleshu madhavam || ||
    shodashaitani namani pratarutthaya yah pathet | sarvapapavinirmukto vishnuloke mahiyate ||
  devanagari: औषधे चिन्तयेद्विष्णुं भोजने च जनार्दनम् । शयने पद्मनाभं च विवाहे च प्रजापतिम् ॥ ॥ युद्धे
    चक्रधरं देवं प्रवासे च त्रिविक्रमम् । नारायणं तनुत्यागे श्रीधरं प्रियसङ्गमे ॥ ॥ दुस्स्वप्ने स्मर गोविन्दं
    सङ्कटे मधुसूदनम् । कानने नारसिंहं च पावके जलशायिनम् ॥ ॥ जलमध्ये वराहं च पर्वते रघुनन्दनम् । गमने वामनं
    चैव सर्वकालेषु माधवम् ॥ ॥ षोडशैतानि नामानि प्रातरूत्थाय यः पठेत् । सर्वपापविनिर्मुक्तो विष्णुलोके
    महीयते ॥
