    ॥ ॥ त्रि॒पादू॒र्ध्व उदै॒त्पुरु॑षः॒ पादो॑ ऽस्ये॒हाभ॑व॒त्पुनः॑ । ततो॒ विष्व॒ङ् व्य॒क्रामत्साशनानश॒ने
