id: dattatreyashadaksharimantravidhanam
category: mantra
name:
  english: dattatreyashadaksharimantravidhanam
  devanagari: दत्तात्रेयषडक्षरीमन्त्रविधानम्
content:
  english: om asya shridattatreyashadaksharimantrasya bhagavan sadashiva rishih | gayatri chandah | shridattatreya
    devata | jape viniyogah || rishyadinyasah | bhagavate sadashivarishaye namah shirasi | gayatrichandase
    namah mukhe | shridattatreyadevatayai namah hridi | jape viniyogaya namah sarvange || karanyasah |
    om angushthabhyam namah | shrim tarjanibhyam svaha | hrim madhyamabhyam vashat | krom anamikabhyam
    hum | glaum kanishthikabhyam vaushat | dram karatalakaraprishthabhyam phat || shadanganyasah | om
    hridayaya namah | shrim shirase svaha | hrim shikhayai vashat | krom kavacaya hum | glaum netratrayaya
    vaushat | dram astraya phat || dhyanam
  devanagari: ॐ अस्य श्रीदत्तात्रेयषडक्षरीमन्त्रस्य भगवान् सदाशिव ऋषिः । गायत्री छन्दः । श्रीदत्तात्रेय
    देवता । जपे विनियोगः ॥ ऋष्यादिन्यासः । भगवते सदाशिवऋषये नमः शिरसि । गायत्रीछन्दसे नमः मुखे । श्रीदत्तात्रेयदेवतायै
    नमः हृदि । जपे विनियोगाय नमः सर्वाङ्गे ॥ करन्यासः । ॐ अङ्गुष्ठाभ्यां नमः । श्रीं तर्जनीभ्यां स्वाहा
    । ह्रीं मध्यमाभ्यां वषट् । क्रों अनामिकाभ्यां हुम् । ग्लौं कनिष्ठिकाभ्यां वौषट् । द्रां करतलकरपृष्ठाभ्यां
    फट् ॥ षडङ्गन्यासः । ॐ हृदयाय नमः । श्रीं शिरसे स्वाहा । ह्रीं शिखायै वषट् । क्रों कवचाय हुम् । ग्लौं
    नेत्रत्रयाय वौषट् । द्रां अस्त्राय फट् ॥ ध्यानम्
