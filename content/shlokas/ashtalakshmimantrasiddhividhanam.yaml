id: ashtalakshmimantrasiddhividhanam
category: mantra
name:
  english: ashtalakshmimantrasiddhividhanam
  devanagari: अष्टलक्ष्मीमन्त्रसिद्धिविधानम्
content:
  english: shrimahalakshmiprasadena ashtaishvaryapraptidvara manovakkayasiddhyarthe jape viniyogah ||
    karanyasah shrim hrim shrim kamale shrim hrim shrim angushthabhyam namah | shrim hrim shrim kamalalaye
    shrim hrim shrim tarjanibhyam nama || shrim hrim shrim prasida shrim hrim shrim madhyamabhyam namah
    | shrim hrim shrim prasida shrim hrim shrim anamikabhyam namah | shrim hrim shrim mahalakshmyai shrim
    hrim shrim kanishthikabhyam namah | shrim hrim shrim namah shrim hrim shrim karatalakaraprishthabhyam
    namah || hridayadi nyasah shrim hrim shrim kamale shrim hrim shrim hridayaya namah | shrim hrim shrim
    kamalalaye shrim hrim shrim shirase svaha | shrim hrim shrim prasida shrim hrim shrim shikhayai vashat
    | shrim hrim shrim prasida shrim hrim shrim kavacaya hum | shrim hrim shrim mahalakshmyai shrim hrim
    shrim netratrayaya vaushat | shrim hrim shrim namah shrim hrim shrim astraya phat | bhurbhuvassuvaromiti
    digbandhah || dhyanam
  devanagari: श्रीमहालक्ष्मीप्रसादेन अष्टैश्वर्यप्राप्तिद्वारा मनोवाक्कायसिद्ध्यर्थे जपे विनियोगः ॥ करन्यासः
    श्रीं ह्रीं श्रीं कमले श्रीं ह्रीं श्रीं अङ्गुष्ठाभ्यां नमः । श्रीं ह्रीं श्रीं कमलालये श्रीं ह्रीं
    श्रीं तर्जनीभ्यां नम ॥ श्रीं ह्रीं श्रीं प्रसीद श्रीं ह्रीं श्रीं मध्यमाभ्यां नमः । श्रीं ह्रीं श्रीं
    प्रसीद श्रीं ह्रीं श्रीं अनामिकाभ्यां नमः । श्रीं ह्रीं श्रीं महालक्ष्म्यै श्रीं ह्रीं श्रीं कनिष्ठिकाभ्यां
    नमः । श्रीं ह्रीं श्रीं नमः श्रीं ह्रीं श्रीं करतलकरपृष्ठाभ्यां नमः ॥ हृदयादि न्यासः श्रीं ह्रीं श्रीं
    कमले श्रीं ह्रीं श्रीं हृदयाय नमः । श्रीं ह्रीं श्रीं कमलालये श्रीं ह्रीं श्रीं शिरसे स्वाहा । श्रीं
    ह्रीं श्रीं प्रसीद श्रीं ह्रीं श्रीं शिखायै वषट् । श्रीं ह्रीं श्रीं प्रसीद श्रीं ह्रीं श्रीं कवचाय
    हुम् । श्रीं ह्रीं श्रीं महालक्ष्म्यै श्रीं ह्रीं श्रीं नेत्रत्रयाय वौषट् । श्रीं ह्रीं श्रीं नमः
    श्रीं ह्रीं श्रीं अस्त्राय फट् । भूर्भुवस्सुवरोमिति दिग्बन्धः ॥ ध्यानम्
meaning: {}
