id: krishna-stuti-brahma-kruta-bhagavata-purana
category: stotram
name:
  english: Krishna Stuti (Brahma Kruta Bhagavata Purana)
content:
  english: brahmovaca | naumidya te'bhravapushe tadidambaraya gunjavatamsaparipicchalasanmukhaya | vanyasraje
    kavalavetravishanavenu lakshmashriye mridupade pashupangajaya || || asyapi deva vapusho madanugrahasya
    svecchamayasya na tu bhutamayasya ko'pi | neshemahi tvavasitum manasantarena sakshattavaiva kimutatmasukhanubhuteh
    || || jnane prayasamudapasya namanta eva jivanti sanmukharitam bhavadiyavartam | sthane sthitah shrutigatam
    tanuvammanobhih ye prayasho'jita jito'pyasi taistrilokyam || || shreyahsrutim bhaktimudasya te vibho
    klishyanti ye kevalabodhalabdhaye | teshamasau kleshala eva shishyate nanyadyatha sthulatushavaghatinam
    || || pureha bhuman bahavo'pi yoginastvadarpiteha nijakarmalabdhaya | vibudhya bhaktyaiva kathopanitaya
    prapedire'njo'cyuta te gatim param || || tathapi bhuman mahima'gunasya te viboddhumarhatyamalantaratmabhih
    | avikriyatsvanubhavadarupato hyananyabodhyatmataya na canyatha || || gunatmanaste'pi gunan vimatum
    hitavatirnasya ka ishire'sya | kalena yairva vimitah sukalpairbhupamsavah khe mihika dyubhasah ||
    || tatte'nukampam susamikshamano bhunjana evatmakritam vipakam | hridvagvapurbhirvidadhannamaste jiveta
    yo muktipade sa dayabhak || || pashyesha me'naryamananta adye paratmani tvayyapi mayimayini | mayam
    vitatyekshitumatmavaibhavam hyaham kiyanaicchamivarciragnau || || atah kshamasvacyuta me rajobhuvo
    hyajanatastvatprithagishamaninah | ajavalepandhatamo'ndhacakshusha esho'nukampyo mayi nathavaniti
    || || kvaham tamomahadahankhacaragnivarbhusamveshtitandaghatasaptavitastakayah | kvedrigvidhaviganitandaparanucaryavatadhvaromavivarasya
    ca te mahitvam || || utkshepanam garbhagatasya padayoh kim kalpate maturadho'kshajagase | kimasti
    nastivyapadeshabhushitam tavasti kuksheh kiyadapyanantah || || jagattrayantodadhisamplavode narayanasyodaranabhinalat
    | vinirgato'jastviti vanna vai mrisha kim tvishvaratvanna vinirgato'smi | narayanastvam na hi sarvadehinamatmasyadhishakhilalokasakshi
    | narayano'ngam narabhujalayanattaccapi satyam na tavaiva maya || || taccejjalastham tava sajjagadvapuh
    kim me na drishtam bhagavamstadaiva | kim va sudrishtam hridi me tadaiva kim no sapadyeva punarvyadarshi
    || || atraiva mayadamanavatare hyasya prapancasya bahih sphutasya | kritsnasya cantarjathare jananya
    mayatvameva prakatikritam te || || yasya kukshavidam sarvam satmam bhati yatha tatha | tattvayyapiha
    tatsarvam kimidam mayaya vina || || adyaiva tvadrite'sya kim mama na te mayatvamadarshitam eko'si
    prathamam tato vrajasuhridvatsah samasta api | tavanto'si caturbhujastadakhilaih sakam mayopasita
    stavantyeva jagantyabhustadamitam brahmadvayam shishyate || || ajanatam tvatpadavimanatmanyatma'tmana
    bhasi vitatya mayam | srishtavivaham jagato vidhana iva tvamesho'nta iva trinetrah || || sureshvrishishvisha
    tathaiva nrishvapi tiryakshu yadahsvapi te'janasya | janmasatam durmadanigrahaya prabho vidhatah sadanugrahaya
    ca || || ko vetti bhuman bhagavan paratman yogeshvarotirbhavatastrilokyam | kva va katham va kati
    va kadeti vistarayan kridasi yogamayam || || tasmadidam jagadasheshamasatsvarupam svapnabhamastadhishanam
    puruduhkhaduhkham | tvayyeva nityasukhabodhatanavanante mayata udyadapi yatsadivavabhati || || ekastvamatma
    purushah puranah satyah svayanjyotirananta adyah | nityo'ksharo'jasrasukho niranjanah purno'dvayo
    mukta upadhito'mritah || || evamvidham tvam sakalatmanamapi svatmanamatma'tmataya vicakshate | gurvarkalabdhopanishatsucakshusha
    ye te tarantiva bhavanritambudhim || || atmanamevatmataya'vijanatam tenaiva jatam nikhilam prapancitam
    | jnanena bhuyo'pi ca tatpraliyate rajjvamaherbhogabhavabhavau yatha || || ajnanasanjnau bhavabandhamokshau
    dvau nama nanyau sta ritajnabhavat | ajasracitya'tmani kevale pare vicaryamane taranavivahani || ||
    tvamatmanam param matva paramatmanameva ca | atma punarbahirmrigya aho'jnajanata'jnata || || antarbhave'nanta
    bhavantameva hyatattyajanto mrigayanti santah | asantamapyantyahimantarena santam gunam tam kimu yanti
    santah || || athapi te deva padambujadvayaprasadaleshanugrihita eva hi | janati tattvam bhagavan mahimno
    na canya eko'pi ciram vicinvan || || tadastu me natha sa bhuribhago bhave'tra vanyatra tu va tirashcam
    | yenahameko'pi bhavajjananam bhutva nisheve tava padapallavam || || aho'tidhanya vrajagoramanyah
    stanyamritam pitamativa te muda | yasam vibho vatsataratmajatmana yattriptaye'dyapi na calamadhvarah
    || || aho bhagyamaho bhagyam nandagopavrajaukasam | yanmitram paramanandam purnam brahma sanatanam
    || || esham tu bhagyamahima'cyuta tavadasta mekadashaiva hi vayam bata bhuribhagah | etaddhrishikacashakairasakritpibamah
    sharvadayo'nghryudajamadhvamritasavam te || || tadbhuribhagyamiha janma kimapyatavyam yadgokule'pi
    katamanghrirajo'bhishekam | yajjivitam tu nikhilam bhagavan mukunda stvadyapi yatpadarajah shrutimrigyameva
    || || esham ghoshanivasinamuta bhavan kim deva rateti nah ceto vishvaphalatphalam tvadaparam kutrapyayan
    muhyati | sadveshadiva putana'pi sakula tvameva devapita yaddhamarthasuhritpriyatmatanayapranashayastvatkrite
    || || tavadragadayah stenastavatkaragriham griham | tavanmoho'nghrinigado yavatkrishna na te janah
    || || prapancam nishprapanco'pi vidambayasi bhutale | prapannajanatanandasandoham prathitum prabho
    || || jananta eva janantu kim bahuktya na me prabho | manaso vapusho vaco vaibhavam tava gocarah ||
    || anujanihi mam krishna sarvam tvam vetsi sarvadrik | tvameva jagatam natho jagadetattavarpitam ||
    || shrikrishna vrishnikulapushkarajoshadayin kshmanirjaradvijapashudadhivriddhikarin | uddharmasharvarahara
    kshitirakshasadhrug akalpamarkamarhan bhagavan namaste || || iti shrimadbhagavatamahapurane dashamaskandhe
    purvardhe caturdashadhyayantargatam brahmakritam shrikrishnastutih samapta | bhagavatapurana
  devanagari: ब्रह्मोवाच । नौमीड्य तेऽभ्रवपुषे तडिदम्बराय गुञ्जावतंसपरिपिच्छलसन्मुखाय । वन्यस्रजे कवलवेत्रविषाणवेणु
    लक्ष्मश्रिये मृदुपदे पशुपाङ्गजाय ॥ ॥ अस्यापि देव वपुषो मदनुग्रहस्य स्वेच्छामयस्य न तु भूतमयस्य कोऽपि
    । नेशेमहि त्ववसितुं मनसान्तरेण साक्षात्तवैव किमुतात्मसुखानुभूतेः ॥ ॥ ज्ञाने प्रयासमुदपास्य नमन्त एव
    जीवन्ति सन्मुखरितां भवदीयवार्ताम् । स्थाने स्थिताः श्रुतिगतां तनुवाम्मनोभिः ये प्रायशोऽजित जितोऽप्यसि
    तैस्त्रिलोक्याम् ॥ ॥ श्रेयःस्रुतिं भक्तिमुदस्य ते विभो क्लिश्यन्ति ये केवलबोधलब्धये । तेषामसौ क्लेशल
    एव शिष्यते नान्यद्यथा स्थूलतुषावघातिनाम् ॥ ॥ पुरेह भूमन् बहवोऽपि योगिनस्त्वदर्पितेहा निजकर्मलब्धया
    । विबुध्य भक्त्यैव कथोपनीतया प्रपेदिरेऽञ्जोऽच्युत ते गतिं पराम् ॥ ॥ तथापि भूमन् महिमाऽगुणस्य ते विबोद्धुमर्हत्यमलान्तरात्मभिः
    । अविक्रियात्स्वानुभवादरूपतो ह्यनन्यबोध्यात्मतया न चान्यथा ॥ ॥ गुणात्मनस्तेऽपि गुणान् विमातुं हितावतीर्णस्य
    क ईशिरेऽस्य । कालेन यैर्वा विमिताः सुकल्पैर्भूपांसवः खे मिहिका द्युभासः ॥ ॥ तत्तेऽनुकम्पां सुसमीक्षमाणो
    भुञ्जान एवात्मकृतं विपाकम् । हृद्वाग्वपुर्भिर्विदधन्नमस्ते जीवेत यो मुक्तिपदे स दायभाक् ॥ ॥ पश्येश
    मेऽनार्यमनन्त आद्ये परात्मनि त्वय्यपि मायिमायिनि । मायां वितत्येक्षितुमात्मवैभवं ह्यहं कियानैच्छमिवार्चिरग्नौ
    ॥ ॥ अतः क्षमस्वाच्युत मे रजोभुवो ह्यजानतस्त्वत्पृथगीशमानिनः । अजावलेपान्धतमोऽन्धचक्षुष एषोऽनुकम्प्यो
    मयि नाथवानिति ॥ ॥ क्वाहं तमोमहदहङ्खचराग्निवार्भूसंवेष्टिताण्डघटसप्तवितस्तकायः । क्वेदृग्विधाविगणिताण्डपराणुचर्यावाताध्वरोमविवरस्य
    च ते महित्वम् ॥ ॥ उत्क्षेपणं गर्भगतस्य पादयोः किं कल्पते मातुरधोऽक्षजागसे । किमस्ति नास्तिव्यपदेशभूषितं
    तवास्ति कुक्षेः कियदप्यनन्तः ॥ ॥ जगत्त्रयान्तोदधिसम्प्लवोदे नारायणस्योदरनाभिनालात् । विनिर्गतोऽजस्त्विति
    वान्न वै मृषा किं त्वीश्वरत्वान्न विनिर्गतोऽस्मि । नारायणस्त्वं न हि सर्वदेहिनामात्मास्यधीशाखिललोकसाक्षी
    । नारायणोऽङ्गं नरभूजलायनात्तच्चापि सत्यं न तवैव माया ॥ ॥ तच्चेज्जलस्थं तव सज्जगद्वपुः किं मे न दृष्टं
    भगवंस्तदैव । किं वा सुदृष्टं हृदि मे तदैव किं नो सपद्येव पुनर्व्यदर्शि ॥ ॥ अत्रैव मायादमनावतारे ह्यस्य
    प्रपञ्चस्य बहिः स्फुटस्य । कृत्स्नस्य चान्तर्जठरे जनन्या मायात्वमेव प्रकटीकृतं ते ॥ ॥ यस्य कुक्षाविदं
    सर्वं सात्मं भाति यथा तथा । तत्त्वय्यपीह तत्सर्वं किमिदं मायया विना ॥ ॥ अद्यैव त्वदृतेऽस्य किं मम
    न ते मायात्वमादर्शितं एकोऽसि प्रथमं ततो व्रजसुहृद्वत्साः समस्ता अपि । तावन्तोऽसि चतुर्भुजास्तदखिलैः
    साकं मयोपासिता स्तावन्त्येव जगन्त्यभूस्तदमितं ब्रह्माद्वयं शिष्यते ॥ ॥ अजानतां त्वत्पदवीमनात्मन्यात्माऽत्मना
    भासि वितत्य मायाम् । सृष्टाविवाहं जगतो विधान इव त्वमेषोऽन्त इव त्रिनेत्रः ॥ ॥ सुरेष्वृषिष्वीश तथैव
    नृष्वपि तिर्यक्षु यादःस्वपि तेऽजनस्य । जन्मासतां दुर्मदनिग्रहाय प्रभो विधातः सदनुग्रहाय च ॥ ॥ को वेत्ति
    भूमन् भगवन् परात्मन् योगेश्वरोतीर्भवतस्त्रिलोक्याम् । क्व वा कथं वा कति वा कदेति विस्तारयन् क्रीडसि
    योगमायाम् ॥ ॥ तस्मादिदं जगदशेषमसत्स्वरूपं स्वप्नाभमस्तधिषणं पुरुदुःखदुःखम् । त्वय्येव नित्यसुखबोधतनावनन्ते
    मायात उद्यदपि यत्सदिवावभाति ॥ ॥ एकस्त्वमात्मा पुरुषः पुराणः सत्यः स्वयञ्ज्योतिरनन्त आद्यः । नित्योऽक्षरोऽजस्रसुखो
    निरञ्जनः पूर्णोऽद्वयो मुक्त उपाधितोऽमृतः ॥ ॥ एवंविधं त्वां सकलात्मनामपि स्वात्मानमात्माऽत्मतया विचक्षते
    । गुर्वर्कलब्धोपनिषत्सुचक्षुषा ये ते तरन्तीव भवानृताम्बुधिम् ॥ ॥ आत्मानमेवात्मतयाऽविजानतां तेनैव जातं
    निखिलं प्रपञ्चितम् । ज्ञानेन भूयोऽपि च तत्प्रलीयते रज्ज्वामहेर्भोगभवाभवौ यथा ॥ ॥ अज्ञानसञ्ज्ञौ भवबन्धमोक्षौ
    द्वौ नाम नान्यौ स्त ऋतज्ञभावात् । अजस्रचित्याऽत्मनि केवले परे विचार्यमाणे तरणाविवाहनी ॥ ॥ त्वामात्मानं
    परं मत्वा परमात्मानमेव च । आत्मा पुनर्बहिर्मृग्य अहोऽज्ञजनताऽज्ञता ॥ ॥ अन्तर्भवेऽनन्त भवन्तमेव ह्यतत्त्यजन्तो
    मृगयन्ति सन्तः । असन्तमप्यन्त्यहिमन्तरेण सन्तं गुणं तं किमु यन्ति सन्तः ॥ ॥ अथापि ते देव पदाम्बुजद्वयप्रसादलेशानुगृहीत
    एव हि । जानाति तत्त्वं भगवन् महिम्नो न चान्य एकोऽपि चिरं विचिन्वन् ॥ ॥ तदस्तु मे नाथ स भूरिभागो भवेऽत्र
    वान्यत्र तु वा तिरश्चाम् । येनाहमेकोऽपि भवज्जनानां भूत्वा निषेवे तव पादपल्लवम् ॥ ॥ अहोऽतिधन्या व्रजगोरमण्यः
    स्तन्यामृतं पीतमतीव ते मुदा । यासां विभो वत्सतरात्मजात्मना यत्तृप्तयेऽद्यापि न चालमध्वराः ॥ ॥ अहो
    भाग्यमहो भाग्यं नन्दगोपव्रजौकसाम् । यन्मित्रं परमानन्दं पूर्णं ब्रह्म सनातनम् ॥ ॥ एषां तु भाग्यमहिमाऽच्युत
    तावदास्ता मेकादशैव हि वयं बत भूरिभागाः । एतद्धृषीकचषकैरसकृत्पिबामः शर्वादयोऽङ्घ्र्युदजमध्वमृतासवं
    ते ॥ ॥ तद्भूरिभाग्यमिह जन्म किमप्यटव्यां यद्गोकुलेऽपि कतमाङ्घ्रिरजोऽभिषेकम् । यज्जीवितं तु निखिलं
    भगवान् मुकुन्द स्त्वद्यापि यत्पदरजः श्रुतिमृग्यमेव ॥ ॥ एषां घोषनिवासिनामुत भवान् किं देव रातेति नः
    चेतो विश्वफलात्फलं त्वदपरं कुत्राप्ययन् मुह्यति । सद्वेषादिव पूतनाऽपि सकुला त्वामेव देवापिता यद्धामार्थसुहृत्प्रियात्मतनयप्राणाशयास्त्वत्कृते
    ॥ ॥ तावद्रागादयः स्तेनास्तावत्कारागृहं गृहम् । तावन्मोहोऽङ्घ्रिनिगडो यावत्कृष्ण न ते जनाः ॥ ॥ प्रपञ्चं
    निष्प्रपञ्चोऽपि विडम्बयसि भूतले । प्रपन्नजनतानन्दसन्दोहं प्रथितुं प्रभो ॥ ॥ जानन्त एव जानन्तु किं
    बहूक्त्या न मे प्रभो । मनसो वपुषो वाचो वैभवं तव गोचरः ॥ ॥ अनुजानीहि मां कृष्ण सर्वं त्वं वेत्सि सर्वदृक्
    । त्वमेव जगतां नाथो जगदेतत्तवार्पितम् ॥ ॥ श्रीकृष्ण वृष्णिकुलपुष्करजोषदायिन् क्ष्मानिर्जरद्विजपशूदधिवृद्धिकारिन्
    । उद्धर्मशार्वरहर क्षितिराक्षसध्रुग् आकल्पमार्कमर्हन् भगवन् नमस्ते ॥ ॥ इति श्रीमद्भागवतमहापुराणे दशमस्कन्धे
    पूर्वार्धे चतुर्दशाध्यायान्तर्गतं ब्रह्मकृतं श्रीकृष्णस्तुतिः समाप्ता । भागवतपुराण
