id: raghavendrahridayam
category: hridaya
name:
  english: raghavendrahridayam
  devanagari: राघवेन्द्रहृदयम्
content:
  english: shriraghavendrahridayam narayanam mahalakshmim bhargavam raghunayakam | krishnam vyasam hanumantam
    bhimam madhvam gurunapi || 1|| vyasam natva'vadhuto'ham vakshyami hridayam guroh | nanachandah susarvarthadayakam
    papanashakam || 2|| dhyayami shriraghavendraryarupam bhuloke'smin sarvasaubhagyahetum | bhaktatranayaiva
    baddhadaram me citte nityam samvasatvishtadaivam || 3|| pura prahladanama'bhut hiranyakashipoh sutah
    | yadartham shrimahavishnurnrikanthiravatam gatah || 4|| samhatah prahatashceti tasyastam paricarinau
    | tretayam ramasevartham vibhishanataya'jani || 5|| tatrapi carau tau jatau sandhikashca prasandhikah
    | dvapare'pi samam tabhyam samavishtashca vayuna || 6|| bhubharakshapane vishnorangatamaptumeva sah
    | pratipaputratamapya bahlikeshvabhavatpatih || 7|| kalau gopalakrishnarca pujayai vyasamaskari |
    bhutva nirjitya durvadan madhvashastram prakashayat || 8|| brahmamanasapujayamavirbhutam hridambujat
    | shriramaryam ca sitarcyam prapujayishureshakah || 9|| shriraghavendratirthakhyo'vatirya yatirupatah
    | vivritya madhvashastrasya lokopakritimatanot || 10|| appannacarya krishnakhyau tatrapi dvijarupatah
    | samhatahatau jatau shishyau tasya priyau sada || 11|| punashca satyasandhakhyo mathantaranivasinim
    | anarcitam ca sitayah pratimamarcayadyatih || 12|| vishvaksenahishaputravatarah shadime matah | tasya
    shriraghavendraguroh kamyarthadayinah || 13|| appannacaryaracitam stotram sarveshtasadhakam | etadvina
    guroh puja stotrancashtakshari japah || 14|| seva ca vyarthatameti na prasado gurorbhavet | adau sakridva
    tatpathadanyatsiddhyati shighratah || 15|| sarveshvapi ca shishyeshu appannacarya eva sah | guroratipriyo
    yasmat stutistena samadritah || 16|| appanacaryasamproktam mulam mala ca varma ca | yathayogam yathakalam
    tattaduktarthasiddhidam || 17|| shriraghavendrayatinam ipsitarthapradayinam | upasate yatha bhaktya
    tatha phalamavapnuyat || 18|| sevaya paramahamsanamaihika'mushtikam bhavet | jnanam bhaktim ca vairagyam
    bhuktim muktim ca vindati || 19|| ityadi vakyat paramahamsadhishamimam gurum | seveta sarvatha martyah
    svarupoddharakaranam || 20|| stuvita bahubhih stotraih prarthayita yathepsitam | shriraghavendram
    shritaparijatam sitaraghuttamsapadabjacittam | kashayavastram kamaniyavesham kamyarthadataramatitadosham
    || 21|| jayatu jayatu raja rajarajadipujyo jayatu jayatu ramye ranjitanekalokah | jayatu jayatu bhogi
    bhaktabhagyapradata jayatu jayatu bhuma bhuri bhuri pradata || 22|| jayatu jayatu bandhurbandhanacchedakari
    jayatu jayatu mitram militanekavairi | jayatu jayatu mata manyamanyo mahatma jayatu jayatu tatastapaharta
    nitantam || 23|| guro tava padambujam bhavapayodhinaukayitam mahajanaparamparabhajanagocaram bhutidam
    | bhajami bhajatam nrinam bahugadaughavidhvamsakam sukhapradamaharnisham sukhasukhena samsiddhidam
    || 24|| mano vasatu padayorbhavatu me vacaste stutau tvadikshanavidhau drisha bhavatu te'rcanayam
    karau | shruti tava gunashrutau bhavatu mastakam te natau pradakshinavidhau pade guruvarashraye te
    pade || 25|| vittashaya jagati vittadi sampadatimattanimanupacaran nyattadirasmyahamanuttanalunthadapacittavivekamatiman
    | mattangana kathinavrittanubandhikucadattadharashca tamimam shriraghavendra dayaya''radupaihi mama
    dhirashu yaccha sumatim || 26|| tava sevaratan kamshcit bhaktan preshaya mam prati | tesham manoratham
    tata maya putrena puraya || 27|| athava karunasindho mayi sannihitah sada | putrasya mama vakyena
    sarvasarveshtado bhava || 28|| yenakenapyupayena dune duryashasa bhuvi | mahatmyam mayi vinyasya kuru
    mam lokapujitam || 29|| yuktayuktamajanano yace tvam balavadguro | data trata dayalustvam yathecchasi
    tatha kuru || 30|| sarvajnaya svatantraya bhaktakleshavinashine | udaracetase kim te vade madbharavahine
    || 31|| apadamauliparyantam gurunamakritim smaret | tena vighnah pranashyanti siddhyanti ca manorathah
    || 32|| iti shri gururajasya hridayam tadanujnaya | krishnavadhuta kathitam guruvakyanusaratah | sampadya
    siddhasankalpe bhaktim muktim ca vindati || 33|| pathanacchravanadvapi gurusannidhyakaranam | kimatrabahuna
    sarvam gururajaprasadatah || 34|| modam me dishatu guruh sa raghavendro dinanam sharanamudaracittavrittih
    | bhaktanam harigururupadarshakastvam supremna mayi mama tata sannidhehi || 35|| iti shrimatkrishnavadhutapanditakritau
    shriraghavendratantre pratyakshasiddhide shriraghavendrahridayam nama tritiyah patalah |
  devanagari: श्रीराघवेन्द्रहृदयम् नारायणं महालक्ष्मीं भार्गवं रघुनायकम् । कृष्णं व्यासं हनूमन्तं भीमं
    मध्वं गुरूनपि ॥ १॥ व्यासं नत्वाऽवधूतोऽहं वक्ष्यामि हृदयं गुरोः । नानाछन्दः सुसर्वार्थदायकं पापनाशकम्
    ॥ २॥ ध्यायामि श्रीराघवेन्द्रार्यरूपं भूलोकेऽस्मिन् सर्वसौभाग्यहेतुम् । भक्तत्राणायैव बद्धादरं मे चित्ते
    नित्यं संवसत्विष्टदैवम् ॥ ३॥ पुरा प्रह्लादनामाऽभूत् हिरण्यकशिपोः सुतः । यदर्थं श्रीमहाविष्णुर्नृकण्ठीरवतां
    गतः ॥ ४॥ संहतः प्रहतश्चेति तस्यास्तां परिचारिणौ । त्रेतायां रामसेवार्थं विभीषणतयाऽजनि ॥ ५॥ तत्रापि
    चारौ तौ जातौ सन्धिकश्च प्रसन्धिकः । द्वापरेऽपि समं ताभ्यां समाविष्टश्च वायुना ॥ ६॥ भूभारक्षपणे विष्णोरङ्गतामाप्तुमेव
    सः । प्रतीपपुत्रतामाप्य बाह्लीकेष्वभवत्पतिः ॥ ७॥ कलौ गोपालकृष्णार्चा पूजायै व्यासमस्करी । भूत्वा निर्जित्य
    दुर्वादान् मध्वशास्त्रं प्रकाशयत् ॥ ८॥ ब्रह्ममानसपूजायामाविर्भूतां हृदम्बुजात् । श्रीरामार्यं च सीतार्च्यां
    प्रपूजयिषुरेषकः ॥ ९॥ श्रीराघवेन्द्रतीर्थाख्योऽवतीर्य यतिरूपतः । विवृत्या मध्वशास्त्रस्य लोकोपकृतिमातनोत्
    ॥ १०॥ अप्पण्णाचार्य कृष्णाख्यौ तत्रापि द्विजरूपतः । संहताहतौ जातौ शिष्यौ तस्य प्रियौ सदा ॥ ११॥ पुनश्च
    सत्यसन्धाख्यो मठान्तरनिवासिनीम् । अनर्चितां च सीतायाः प्रतिमामार्चयद्यतिः ॥ १२॥ विष्वक्सेनाहीशपुत्रावताराः
    षडिमे मताः । तस्य श्रीराघवेन्द्रगुरोः काम्यार्थदायिनः ॥ १३॥ अप्पण्णाचार्यरचितं स्तोत्रं सर्वेष्टसाधकम्
    । एतद्विना गुरोः पूजा स्तोत्रञ्चाष्टाक्षरी जपः ॥ १४॥ सेवा च व्यर्थतामेति न प्रसादो गुरोर्भवेत् । आदौ
    सकृद्वा तत्पाठादन्यत्सिद्ध्यति शीघ्रतः ॥ १५॥ सर्वेष्वपि च शिष्येषु अप्पण्णाचार्य एव सः । गुरोरतिप्रियो
    यस्मात् स्तुतिस्तेन समादृताः ॥ १६॥ अप्पणाचार्यसम्प्रोक्तं मूलं माला च वर्म च । यथायोगं यथाकालं तत्तदुक्तार्थसिद्धिदम्
    ॥ १७॥ श्रीराघवेन्द्रयतिनं ईप्सितार्थप्रदायिनम् । उपासते यथा भक्त्या तथा फलमवाप्नुयात् ॥ १८॥ सेवया
    परमहंसानामैहिकाऽमुष्टिकं भवेत् । ज्ञानं भक्तिं च वैराग्यं भुक्तिं मुक्तिं च विन्दति ॥ १९॥ इत्यादि
    वाक्यात् परमहंसाधीशमिमं गुरुम् । सेवेत सर्वथा मर्त्यः स्वरूपोद्धारकारणम् ॥ २०॥ स्तुवीत बहुभिः स्तोत्रैः
    प्रार्थयीत यथेप्सितम् । श्रीराघवेन्द्रं श्रितपारिजातं सीतारघूत्तंसपदाब्जचित्तम् । काषायवस्त्रं कमनीयवेषं
    काम्यार्थदातारमतीतदोषम् ॥ २१॥ जयतु जयतु राजा राजराजादिपूज्यो जयतु जयतु रम्ये रञ्जितानेकलोकः । जयतु
    जयतु भोगी भक्तभाग्यप्रदाता जयतु जयतु भूमा भूरि भूरि प्रदाता ॥ २२॥ जयतु जयतु बन्धुर्बन्धनच्छेदकारी
    जयतु जयतु मित्रं मीलितानेकवैरी । जयतु जयतु माता मान्यमान्यो महात्मा जयतु जयतु तातस्तापहर्ता नितान्तम्
    ॥ २३॥ गुरो तव पदाम्बुजं भवपयोधिनौकायितं महाजनपरम्पराभजनगोचरं भूतिदम् । भजामि भजतां नृणां बहुगदौघविध्वंसकं
    सुखप्रदमहर्निशं सुखसुखेन संसिद्धिदम् ॥ २४॥ मनो वसतु पादयोर्भवतु मे वचस्ते स्तुतौ त्वदीक्षणविधौ दृशा
    भवतु तेऽर्चनायां करौ । श्रुती तव गुणश्रुतौ भवतु मस्तकं ते नतौ प्रदक्षिणविधौ पदे गुरुवराश्रये ते पदे
    ॥ २५॥ वित्ताशया जगति वित्तादि सम्पदतिमत्तानिमानुपचरन् न्यात्तादिरस्म्यहमनुत्तानलुण्ठदपचित्ताविवेकमतिमान्
    । मत्ताङ्गना कठिनवृत्तानुबन्धिकुचदत्ताधरश्च तमिमं श्रीराघवेन्द्र दययाऽऽरादुपैहि मम धीराशु यच्छ सुमतिम्
    ॥ २६॥ तव सेवारतान् कांश्चित् भक्तान् प्रेषया मां प्रति । तेषां मनोरथं तात मया पुत्रेण पूरय ॥ २७॥ अथवा
    करुणासिन्धो मयि सन्निहितः सदा । पुत्रस्य मम वाक्येन सर्वसर्वेष्टदो भव ॥ २८॥ येनकेनाप्युपायेन दूने
    दुर्यशसा भुवि । माहात्म्यं मयि विन्यस्य कुरु मां लोकपूजितम् ॥ २९॥ युक्तायुक्तमजानानो याचे त्वां बालवद्गुरो
    । दाता त्राता दयालुस्त्वं यथेच्छसि तथा कुरु ॥ ३०॥ सर्वज्ञाय स्वतन्त्राय भक्तक्लेशविनाशिने । उदारचेतसे
    किं ते वदे मद्भारवाहिने ॥ ३१॥ आपादमौलिपर्यन्तं गुरूणामाकृतिं स्मरेत् । तेन विघ्नाः प्रणश्यन्ति सिद्ध्यन्ति
    च मनोरथाः ॥ ३२॥ इति श्री गुरुराजस्य हृदयं तदनुज्ञया । कृष्णावधूत कथितं गुरुवाक्यानुसारतः । सम्पाद्य
    सिद्धसङ्कल्पे भक्तिं मुक्तिं च विन्दति ॥ ३३॥ पठनाच्छ्रवणाद्वापि गुरुसान्निध्यकारणम् । किमत्रबहुना
    सर्वं गुरुराजप्रसादतः ॥ ३४॥ मोदं मे दिशतु गुरुः स राघवेन्द्रो दीनानां शरणमुदारचित्तवृत्तिः । भक्तानां
    हरिगुरुरूपदर्शकस्त्वं सुप्रेम्णा मयि मम तात सन्निधेहि ॥ ३५॥ इति श्रीमत्कृष्णावधूतपण्डितकृतौ श्रीराघवेन्द्रतन्त्रे
    प्रत्यक्षसिद्धिदे श्रीराघवेन्द्रहृदयं नाम तृतीयः पटलः ।
