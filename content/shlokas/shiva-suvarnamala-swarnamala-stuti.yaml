id: shiva-suvarnamala-swarnamala-stuti
category: stotram
name:
  english: Shiva Suvarnamala (Swarnamala) Stuti
content:
  english: atha kathamapi madrasanam tvadgunaleshairvishodhayami vibho | samba sadashiva shambho shankara
    sharanam me tava caranayugam || || akhandalamadakhandanapandita tandupriya candisha vibho | samba
    sadashiva shambho shankara sharanam me tava caranayugam || || ibhacarmambara shambararipuvapurapaharanojjvalanayana
    vibho | samba sadashiva shambho shankara sharanam me tava caranayugam || || isha girisha naresha paresha
    mahesha bileshayabhushana bho | samba sadashiva shambho shankara sharanam me tava caranayugam || ||
    umaya divyasumangalavigrahayalingitavamanga vibho | samba sadashiva shambho shankara sharanam me tava
    caranayugam || || urikuru mamajnamanatham durikuru me duritam bho | samba sadashiva shambho shankara
    sharanam me tava caranayugam || || rishivaramanasahamsa caracarajananasthitilayakarana bho | samba
    sadashiva shambho shankara sharanam me tava caranayugam || || rikshadhishakirita mahoksharudha vidhritarudraksha
    vibho | samba sadashiva shambho shankara sharanam me tava caranayugam || || luvarnadvandvamavrintasukusumamivanghrau
    tavarpayami vibho | samba sadashiva shambho shankara sharanam me tava caranayugam || || ekam saditi
    shrutya tvameva sadasityupasmahe mrida bho | samba sadashiva shambho shankara sharanam me tava caranayugam
    || || aikyam nijabhaktebhyo vitarasi vishvambharo'tra sakshi bho | samba sadashiva shambho shankara
    sharanam me tava caranayugam || || omiti tava nirdeshtri mayasmakam mridopakartri bho | samba sadashiva
    shambho shankara sharanam me tava caranayugam || || audasyam sphutayati vishayeshu digambarata ca
    tavaiva vibho | samba sadashiva shambho shankara sharanam me tava caranayugam || || antahkaranavishuddhim
    bhaktim ca tvayi satim pradehi vibho | samba sadashiva shambho shankara sharanam me tava caranayugam
    || || astopadhisamastavyastai rupairjaganmayo'si vibho | samba sadashiva shambho shankara sharanam
    me tava caranayugam || || karunavarunalaya mayi dasa udasastavocito na hi bho | samba sadashiva shambho
    shankara sharanam me tava caranayugam || || khalasahavasam vighataya ghataya satameva sangamanisham
    bho | samba sadashiva shambho shankara sharanam me tava caranayugam || || garalam jagadupakritaye
    gilitam bhavata samo'sti ko'tra vibho | samba sadashiva shambho shankara sharanam me tava caranayugam
    || || ghanasaragauragatra pracurajatajutabaddhaganga vibho | samba sadashiva shambho shankara sharanam
    me tava caranayugam || || jnaptih sarvasharireshvakhandita ya vibhati sa tvam bho | samba sadashiva
    shambho shankara sharanam me tava caranayugam || || capalam mama hridayakapim vishayadrucaram dridham
    badhana vibho | samba sadashiva shambho shankara sharanam me tava caranayugam || || chaya sthanorapi
    tava tapam namatam haratyaho shiva bho | samba sadashiva shambho shankara sharanam me tava caranayugam
    || || jaya kailasanivasa pramathaganadhisha bhusurarcita bho | samba sadashiva shambho shankara sharanam
    me tava caranayugam || || jhanutakajhankinujhanutatkitataka shabdairnatasi mahanata bho | samba sadashiva
    shambho shankara sharanam me tava caranayugam || || jnanam vikshepavritirahitam kuru me gurustvameva
    vibho | samba sadashiva shambho shankara sharanam me tava caranayugam || || tankarastava dhanusho
    dalayati hridayam dvishamashaniriva bho | samba sadashiva shambho shankara sharanam me tava caranayugam
    || || thakritiriva tava maya bahirantah shunyarupini khalu bho | samba sadashiva shambho shankara
    sharanam me tava caranayugam || || dambaramamburuhamapi dalayatyanagham tvadanghriyugalam bho | samba
    sadashiva shambho shankara sharanam me tava caranayugam || || dhakkakshasutrashuladruhinakarotisamullasatkara
    bho | samba sadashiva shambho shankara sharanam me tava caranayugam || || nakaragarbhini cecchubhada
    te sharagatirnrinamiha bho | samba sadashiva shambho shankara sharanam me tava caranayugam || || tava
    manvatisanjapatah sadyastarati naro hi bhavabdhim bho | samba sadashiva shambho shankara sharanam
    me tava caranayugam || || thutkarastasya mukhe bhuyatte nama nasti yasya vibho | samba sadashiva shambho
    shankara sharanam me tava caranayugam || || dayaniyashca dayaluh ko'sti madanyastvadanya iha vada
    bho | samba sadashiva shambho shankara sharanam me tava caranayugam || || dharmasthapanadaksha tryaksha
    guro dakshayajnashikshaka bho | samba sadashiva shambho shankara sharanam me tava caranayugam || ||
    nanu tadito'si dhanusha lubdhadhiya tvam pura narena vibho | samba sadashiva shambho shankara sharanam
    me tava caranayugam || || parimatum tava murtim nalamajastatparatparo'si vibho | samba sadashiva shambho
    shankara sharanam me tava caranayugam || || phalamiha nritaya janushastvatpadaseva sanatanesha vibho
    | samba sadashiva shambho shankara sharanam me tava caranayugam || || balamarogyam cayustvadgunarucitam
    ciram pradehi vibho | samba sadashiva shambho shankara sharanam me tava caranayugam || || bhagavanbharga
    bhayapaha bhutapate bhutibhushitanga vibho | samba sadashiva shambho shankara sharanam me tava caranayugam
    || || mahima tava na hi mati shrutishu himanidharatmajadhava bho | samba sadashiva shambho shankara
    sharanam me tava caranayugam || || yamaniyamadibhirangairyamino hridaye bhajanti sa tvam bho | samba
    sadashiva shambho shankara sharanam me tava caranayugam || || rajjavahiriva shuktau rajatamiva tvayi
    jaganti bhanti vibho | samba sadashiva shambho shankara sharanam me tava caranayugam || || labdhva
    bhavatprasadaccakram vidhuravati lokamakhilam bho | samba sadashiva shambho shankara sharanam me tava
    caranayugam || || vasudhataddharatacchayarathamaurvishara parakritasura bho | samba sadashiva shambho
    shankara sharanam me tava caranayugam || || sharva deva sarvottama sarvada durvrittagarvaharana vibho
    | samba sadashiva shambho shankara sharanam me tava caranayugam || || shadripushadurmishadvikarahara
    sanmukha shanmukhajanaka vibho | samba sadashiva shambho shankara sharanam me tava caranayugam ||
    || satyam jnanamanantam brahmetyetallakshanalakshita bho | samba sadashiva shambho shankara sharanam
    me tava caranayugam || || hahahuhumukhasuragayakagitapadanapadya vibho | samba sadashiva shambho shankara
    sharanam me tava caranayugam || || ladirna hi prayogastadantamiha mangalam sadastu vibho | samba sadashiva
    shambho shankara sharanam me tava caranayugam || || kshanamiva divasanneshyati tvatpadasevakshanotsukah
    shiva bho | samba sadashiva shambho shankara sharanam me tava caranayugam || || iti shrimatparamahamsaparivrajakacaryasya
    shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah kritau suvarnamala stutih sampurna
    ||
  devanagari: अथ कथमपि मद्रासनां त्वद्गुणलेशैर्विशोधयामि विभो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम्
    ॥ ॥ आखण्डलमदखण्डनपण्डित तण्डुप्रिय चण्डीश विभो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥
    इभचर्माम्बर शम्बररिपुवपुरपहरणोज्ज्वलनयन विभो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ ईश
    गिरीश नरेश परेश महेश बिलेशयभूषण भो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ उमया दिव्यसुमङ्गलविग्रहयालिङ्गितवामाङ्ग
    विभो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ ऊरीकुरु मामज्ञमनाथं दूरीकुरु मे दुरितं भो
    । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ ऋषिवरमानसहंस चराचरजननस्थितिलयकारण भो । साम्ब सदाशिव
    शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ ॠक्षाधीशकिरीट महोक्षारूढ विधृतरुद्राक्ष विभो । साम्ब सदाशिव शम्भो
    शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ लुवर्णद्वन्द्वमवृन्तसुकुसुममिवाङ्घ्रौ तवार्पयामि विभो । साम्ब सदाशिव
    शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ एकं सदिति श्रुत्या त्वमेव सदसीत्युपास्महे मृड भो । साम्ब सदाशिव
    शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ ऐक्यं निजभक्तेभ्यो वितरसि विश्वम्भरोऽत्र साक्षी भो । साम्ब सदाशिव
    शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ ओमिति तव निर्देष्ट्री मायास्माकं मृडोपकर्त्री भो । साम्ब सदाशिव
    शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ औदास्यं स्फुटयति विषयेषु दिगम्बरता च तवैव विभो । साम्ब सदाशिव
    शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ अन्तःकरणविशुद्धिं भक्तिं च त्वयि सतीं प्रदेहि विभो । साम्ब सदाशिव
    शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ अस्तोपाधिसमस्तव्यस्तै रूपैर्जगन्मयोऽसि विभो । साम्ब सदाशिव शम्भो
    शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ करुणावरुणालय मयि दास उदासस्तवोचितो न हि भो । साम्ब सदाशिव शम्भो शङ्कर
    शरणं मे तव चरणयुगम् ॥ ॥ खलसहवासं विघटय घटय सतामेव सङ्गमनिशं भो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे
    तव चरणयुगम् ॥ ॥ गरलं जगदुपकृतये गिलितं भवता समोऽस्ति कोऽत्र विभो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे
    तव चरणयुगम् ॥ ॥ घनसारगौरगात्र प्रचुरजटाजूटबद्धगङ्ग विभो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम्
    ॥ ॥ ज्ञप्तिः सर्वशरीरेष्वखण्डिता या विभाति सा त्वं भो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम्
    ॥ ॥ चपलं मम हृदयकपिं विषयद्रुचरं दृढं बधान विभो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥
    छाया स्थाणोरपि तव तापं नमतां हरत्यहो शिव भो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ जय
    कैलासनिवास प्रमथगणाधीश भूसुरार्चित भो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ झणुतकझङ्किणुझणुतत्किटतक
    शब्दैर्नटसि महानट भो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ ज्ञानं विक्षेपावृतिरहितं कुरु
    मे गुरुस्त्वमेव विभो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ टङ्कारस्तव धनुषो दलयति हृदयं
    द्विषामशनिरिव भो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ ठाकृतिरिव तव माया बहिरन्तः शून्यरूपिणी
    खलु भो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ डम्बरमम्बुरुहामपि दलयत्यनघं त्वदङ्घ्रियुगलं
    भो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ ढक्काक्षसूत्रशूलद्रुहिणकरोटीसमुल्लसत्कर भो ।
    साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ णाकारगर्भिणी चेच्छुभदा ते शरगतिर्नृणामिह भो । साम्ब
    सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ तव मन्वतिसञ्जपतः सद्यस्तरति नरो हि भवाब्धिं भो । साम्ब
    सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ थूत्कारस्तस्य मुखे भूयात्ते नाम नास्ति यस्य विभो । साम्ब
    सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ दयनीयश्च दयालुः कोऽस्ति मदन्यस्त्वदन्य इह वद भो । साम्ब
    सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ धर्मस्थापनदक्ष त्र्यक्ष गुरो दक्षयज्ञशिक्षक भो । साम्ब
    सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ ननु ताडितोऽसि धनुषा लुब्धधिया त्वं पुरा नरेण विभो । साम्ब
    सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ परिमातुं तव मूर्तिं नालमजस्तत्परात्परोऽसि विभो । साम्ब
    सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ फलमिह नृतया जनुषस्त्वत्पदसेवा सनातनेश विभो । साम्ब सदाशिव
    शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ बलमारोग्यं चायुस्त्वद्गुणरुचितां चिरं प्रदेहि विभो । साम्ब सदाशिव
    शम्भो शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ भगवन्भर्ग भयापह भूतपते भूतिभूषिताङ्ग विभो । साम्ब सदाशिव शम्भो
    शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ महिमा तव न हि माति श्रुतिषु हिमानीधरात्मजाधव भो । साम्ब सदाशिव शम्भो
    शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ यमनियमादिभिरङ्गैर्यमिनो हृदये भजन्ति स त्वं भो । साम्ब सदाशिव शम्भो
    शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ रज्जावहिरिव शुक्तौ रजतमिव त्वयि जगन्ति भान्ति विभो । साम्ब सदाशिव शम्भो
    शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ लब्ध्वा भवत्प्रसादाच्चक्रं विधुरवति लोकमखिलं भो । साम्ब सदाशिव शम्भो
    शङ्कर शरणं मे तव चरणयुगम् ॥ ॥ वसुधातद्धरतच्छयरथमौर्वीशर पराकृतासुर भो । साम्ब सदाशिव शम्भो शङ्कर शरणं
    मे तव चरणयुगम् ॥ ॥ शर्व देव सर्वोत्तम सर्वद दुर्वृत्तगर्वहरण विभो । साम्ब सदाशिव शम्भो शङ्कर शरणं
    मे तव चरणयुगम् ॥ ॥ षड्रिपुषडूर्मिषड्विकारहर सन्मुख षण्मुखजनक विभो । साम्ब सदाशिव शम्भो शङ्कर शरणं
    मे तव चरणयुगम् ॥ ॥ सत्यं ज्ञानमनन्तं ब्रह्मेत्येतल्लक्षणलक्षित भो । साम्ब सदाशिव शम्भो शङ्कर शरणं
    मे तव चरणयुगम् ॥ ॥ हाहाहूहूमुखसुरगायकगीतापदानपद्य विभो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम्
    ॥ ॥ लादिर्न हि प्रयोगस्तदन्तमिह मङ्गलं सदास्तु विभो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम्
    ॥ ॥ क्षणमिव दिवसान्नेष्यति त्वत्पदसेवाक्षणोत्सुकः शिव भो । साम्ब सदाशिव शम्भो शङ्कर शरणं मे तव चरणयुगम्
    ॥ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ सुवर्णमाला
    स्तुतिः सम्पूर्णा ॥
