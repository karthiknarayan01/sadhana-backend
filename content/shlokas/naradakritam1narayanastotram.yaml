id: naradakritam1narayanastotram
category: stotram
name:
  english: naradakritam1narayanastotram
  devanagari: नारदकृतं१नारायणस्तोत्रम्
content:
  english: padashirogriva vishvahastanasarasanatvakkeshalomalinga sarvalokatmaka sarvalokasukhavaha sarvalokopakaraka
    sarvalokanamaskrita lilavilasitakotipadmodbhava rudrendramarudashvisadhyasiddhaganapranatasheshasurasuratribhuvanaguro
    na kasyapi jnanagocara namaste namaste || 26|| iti shriskandapurane vaishnavakhande purushottamajagannathamahatmye
    vimshadhyayantargatam naradakritam narayanastotram samaptam | skandapurana | vaishnavakhanda | purushottamakhanda
    | adhyaya 20
  devanagari: पादशिरोग्रीव विश्वहस्तनासारसनात्वक्केशलोमलिङ्ग सर्वलोकात्मक सर्वलोकसुखावह सर्वलोकोपकारक
    सर्वलोकनमस्कृत लीलाविलसितकोटिपद्मोद्भव रुद्रेन्द्रमरुदश्विसाध्यसिद्धगणप्रणताशेषसुरासुरत्रिभुवनगुरो
    न कस्यापि ज्ञानगोचर नमस्ते नमस्ते ॥ २६॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे पुरुषोत्तमजगन्नाथमाहात्म्ये
    विंशाध्यायान्तर्गतं नारदकृतं नारायणस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । पुरुषोत्तमखण्ड ।
    अध्याय २०
meaning: {}
