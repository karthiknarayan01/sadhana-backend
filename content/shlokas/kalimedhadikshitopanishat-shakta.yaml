id: kalimedhadikshitopanishat-shakta
category: upanishad
name:
  english: kalimedhadikshitopanishat (shakta)
  devanagari: कालीमेधादीक्षितोपनिषत् (शाक्त)
content:
  english: kalimedhadikshitopanishat athaha vai devanam patnim bhajate | tasyopasako'nyam gacchan om athainam
    medhadikshitarupinim bhavayet | sa shivo bhavet | sa kalirupo bhavet | so'yam medhasparshamanikalim
    dikshayet | tatashcintamanikalim dikshayet | tatah siddhakalyadhikari bhavet | tato vidyarajnim japet
    | tatah kamakalakalim pararupinim japet | tatashcaranadiksharupinim hamsakalim yajet | raktashuklamishranirvanarupinim
    yajet | sarvanirvanadikshito bhavet | tatah shambhavadikshito bhavet | guhyakalyadhishthito bhavet
    | shivo bhavet | sa pararupo bhavet | parat pararupo bhavet | parat paratitarupo bhavet | citpararupo
    bhavet | citparat pararupo bhavet | citparat paratitarupo bhavet | brahmavishnurudreshvarasadashivamahakalacitparambarupo
    bhavet | sa brahmatvam gacchati | medhadiksham labhet | medhadikshatah para diksha na vidyata ityaha
    bhagavan shivah | sparshavidyaya dehashuddhirbhavet | tatashcintamanividyadhikari vidyarajnim labhet
    | vidyarajyadhikari tu shodham japet | turyashodhadhikari kamakalam japet | kamakaladhikari caranarupinim
    japet | hamsadikshito bhavet | caranadhikari shatchambhavasampanno bhavet | guhyakalyadhishthito bhavet
    | tato medham caret | jivako hi bhungatvam gacchati | bhurangibhutva shat cakrani nirbhindyat | tatah
    paragabhugbhavet | parakayapraveshavana vayassthairyam caret | kamarupatvam gacchati | shashtisiddhishvaro
    bhavediti shivaproktam veda ||
  devanagari: कालीमेधादीक्षितोपनिषत् अथाह वै देवानां पत्नीं भजते । तस्योपासकोऽन्यां गच्छन् ॐ अथैनां मेधादीक्षितरूपिणीं
    भावयेत् । स शिवो भवेत् । स कालीरूपो भवेत् । सोऽयं मेधास्पर्शमणिकालीं दीक्षयेत् । ततश्चिन्तामणिकालीं
    दीक्षयेत् । ततः सिद्धकाल्यधिकारी भवेत् । ततो विद्याराज्ञीं जपेत् । ततः कामकलाकालीं परारूपिणीं जपेत्
    । ततश्चरणदीक्षारूपिणीं हंसकालीं यजेत् । रक्तशुक्लमिश्रनिर्वाणरूपिणीं यजेत् । सर्वनिर्वाणदीक्षितो भवेत्
    । ततः शाम्भवादीक्षितो भवेत् । गुह्यकाल्यधिष्ठितो भवेत् । शिवो भवेत् । स परारूपो भवेत् । परात् पररूपो
    भवेत् । परात् परातीतरूपो भवेत् । चित्परारूपो भवेत् । चित्परात् परारूपो भवेत् । चित्परात् परातीतरूपो
    भवेत् । ब्रह्मविष्णुरुद्रेश्वरसदाशिवमहाकालचित्पराम्बारूपो भवेत् । स ब्रह्मत्वं गच्छति । मेधादीक्षां
    लभेत् । मेधादीक्षातः परा दीक्षा न विद्यत इत्याह भगवान् शिवः । स्पर्शविद्यया देहशुद्धिर्भवेत् । ततश्चिन्तामाणिविद्याधिकारी
    विद्याराज्ञीं लभेत् । विद्याराज्यधिकारी तु षोढां जपेत् । तुर्याषोढाधिकारी कामकलां जपेत् । कामकलाधिकारी
    चरणरूपिणीं जपेत् । हंसदीक्षितो भवेत् । चरणाधिकारी षट्छाम्भवसम्पन्नो भवेत् । गुह्यकाल्यधिष्ठितो भवेत्
    । ततो मेधां चरेत् । जीवको हि भूङ्गत्वं गच्छति । भूरङ्गीभूत्वा षट् चक्राणि निर्भिन्द्यात् । ततः परागभुग्भवेत्
    । परकायप्रवेशवान वयस्स्थैर्यं चरेत् । कामरूपत्वं गच्छति । षष्टिसिद्धीश्वरो भवेदिति शिवप्रोक्तं वेद
    ॥
