id: shivastutih-10
category: stotram
name:
  english: shivastutih
  devanagari: शिवस्तुतिः
content:
  english: stavamenam prayunjita paushye pushtipradam shive | dadyadgomithunam raktam savatsam dakshinanvitam
    || 90|| shambhavebhyastatha homam kuryatparvani bhojanam | brahmanairbandhavairdevi bhunjitaiva sa
    vagyatah || 91|| rajatena vimanena yatyante mama sannidhim | yastvetacchrinuyannityam so'pi tatphalamapnuyat
    || 92|| || iti shivarahasyantargate ishvaraproktam paushyamasakrite shivastutih sampurna ||
  devanagari: स्तवमेनं प्रयुञ्जीत पौष्ये पुष्टिप्रदं शिवे । दद्याद्गोमिथुनं रक्तं सवत्सं दक्षिणान्वितम्
    ॥ ९०॥ शाम्भवेभ्यस्तथा होमं कुर्यात्पर्वणि भोजनम् । ब्राह्मणैर्बान्धवैर्देवि भुञ्जीतैव स वाग्यतः ॥
    ९१॥ राजतेन विमानेन यात्यन्ते मम सन्निधिम् । यस्त्वेतच्छृणुयान्नित्यं सोऽपि तत्फलमाप्नुयात् ॥ ९२॥ ॥
    इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तं पौष्यमासकृते शिवस्तुतिः सम्पूर्णा ॥
meaning: {}
