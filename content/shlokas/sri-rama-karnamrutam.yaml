id: sri-rama-karnamrutam
category: stotram
name:
  english: Sri Rama Karnamrutam
content:
  english: mangalashlokah mangalam bhagavanvishnurmangalam madhusudanah | mangalam pundarikaksho mangalam
    garudadhvajah || mangalam kosalendraya mahaniyagunabdhaye | cakravartitanujaya sarvabhaumaya mangalam
    || vedavedantavedyaya meghashyamalamurtaye | pumsam mohanarupaya punyashlokaya mangalam || vishvamitrantarangaya
    mithilanagaripateh | bhagyanam paripakaya bhavyarupaya mangalam || pitribhaktaya satatam bhratribhih
    saha sitaya | nanditakhilalokaya ramacandraya mangalam || tyaktasaketavasaya citrakutaviharine | sevyaya
    sarvayaminam dhirodattaya mangalam || saumitrina ca janakya capabanasidharina | samsevyaya sada bhaktya
    sanujayastu mangalam || dandakaranyavasaya khanditamarashatrave | gridhrarajaya bhaktaya muktidayastu
    mangalam || sadaram shabaridattaphalamulabhilashine | saulabhyaparipurnaya sattvodyuktaya mangalam
    || hanumatsamavetaya harishabhishtadayine | valipramathanayastu mahadhiraya mangalam || shrimate raghuviraya
    setulanghitasindhave | jitarakshasarajaya ranadhiraya mangalam || asadya nagarim divyamabhishiktaya
    sitaya | rajadhirajarajaya ramabhadraya mangalam || vibhishanakrite pritya vishvabhishtapradayine
    | janakiprananathaya sada ramaya mangalam || shriramam trijagadgurum suravaram sitamanonayakam shyamangam
    shashikotipurnavadanam cancatkalakaustubham | saumyam satyagunottamam susarayutire vasantam prabhum
    trataram sakalarthasiddhisahitam vande raghunam patim || shriraghavam dasharathatmajamaprameyam sitapatim
    raghuvaranvayaratnadipam | ajanubahumaravindadalayataksham ramam nishacaravinashakaram namami || shriramacandra
    karunakara raghavendra rajendracandra raghuvamshasamudracandra | sugrivanetrayugalotpala purnacandra
    sitamanahkumudacandra namo namaste || sitamanomanasarajahamsa samsarasantapahara kshamavan | shrirama
    daityantaka shantarupa shritarakabrahma namo namaste || vishno raghava vasudeva nrihare devaughacudamane
    | samsararnavakarnadharaka hare krishnaya tubhyam namah || sugrivadisamastavanaravaraissamsevyamanam
    sada | vishvamitraparasharadimunibhissamstuyamanam bhaje || ramam candanashitalam kshitisutamohakaram
    shrikaram vaidehinayanaravindamihiram sampurnacandrananam | rajanam karunasametanayanam sitamanonandanam
    sitadarpanacarugandalalitam vande sada raghavam || janati rama tava namarucim mahesho janati gautamasati
    caranaprabhavam | janati dorbalaparakramamishacapo janatyamoghapatubanagatim payodhih || mata ramo
    matpita ramacandro bhrata ramo matsakha raghaveshah | sarvasvam me ramacandro dayalu rnanyam daivam
    naiva jane na jane || vimalakamalanetram visphurannilagatram tapanakulapavitram danavadhvantamitram
    | bhuvanashubhacaritram bhumiputrikalatram dasharathavaraputram naumi ramakhyamitram || marge marge
    shakhinam ratnavedi vedyam vedyam kinnaribrindagitam | gite gite manjulalapagoshthi goshthyam goshthyam
    tvatkatha ramacandra || vrikshe vrikshe vikshitah pakshisanghah sanghe sanghe manjulamodavakyam |
    vakye vakye manjulalapagoshthi goshthyam goshthyam tvatkatha ramacandra || duritatimiracandro dushtakanjatacandrah
    surakuvalayacandrassuryavamshabdhicandrah | svajananivahacandrashshatrurajivacandrah pranatakumudacandrah
    patu mam ramacandrah || kalyanadam kaushikayajnapalam kalanidhim kancanashailadhiram | kanjatanetram
    karunasamudram kakutstharamam kalayami citte || rajivayatalocanam raghuvaram nilotpalashyamalam mandarancitamandape
    sulalite sauvarnake pushpake | asthane navaratnarajikhacite simhasane samsthitam sitalakshmanalokapalasahitam
    vande munindraspadam || dhyaye ramam sudhamshum natasakalabhavaranyatapapraharam | shyamam shantam
    surendram suramunivinutam kotisuryaprakasham | sitasaumitrisevyam suranarasugamam divyasimhasanastham
    | sayahne ramacandram smitaruciramukham sarvada me prasannam || indranilamanisannibhadeham vandaniyamasakrinmunibrindaih
    | lambamanatulasivanamalam cintayami satatam raghuviram || sampurnacandravadanam sarasiruhaksham manikyakundaladharam
    mukutabhiramam | campeyagauravasanam sharacapahastam shriramacandramanisham manasa smarami || matuh
    parshve carantam manimayashayane manjubhushancitangam | mandam mandam pibantam mukulitanayanam stanyamanyastanagram
    | angulyagraih sprishantam sukhaparavashaya sasmitalingitangam | gadham gadham jananya kalayatu hridayam
    mamakam ramabalam || ramabhiramam nayanabhiramam vacabhiramam vadanabhiramam | sarvabhiramam ca sadabhiramam
    vande sada dasharathim ca ramam || rashabdoccaramatrena mukhanniryati patakah | punah praveshabhitya
    ca makarastu kavatavat || anarghamanikyavirajamana shripadukalankritashobhanabhyam | asheshabrindarakavanditabhyam
    namo namo ramapadambujabhyam || calatkanakakundalollasitadivyagandasthalam caracarajaganmayam caranapadmagangashrayam
    | caturvidhaphalapradam caramapithamadhyasthitam cidamshamakhilaspadam dasharathatmajam cintaye ||
    sanandanamunipriyam sakalavarnavedatmakam samastanigamagamasphuritatattvasimhasanam | sahasranayanabjajadyamarabrindasamsevitam
    samashtipuravallabham dasharathatmajam cintaye || jagratsvapnasushupti kalavilasattattvatmacinmatrakam
    caitanyatmakamadhipaparahitam bhumyaditanmatrakam | shambhavyadisamastayogakulakam sankhyaditattvatparam
    shabdavacyamaham namami satatam vyutpattinashatparam || ikshvakuvamsharnavajataratnam sitanganayauvanabhagyaratnam
    | vaikuntharatnam mama bhagyaratnam shriramaratnam shirasa namami || ikshvakunandanam sugrivapujitam
    trailokyarakshakam satyasandham sada | raghavam raghupatim rajivalocanam ramacandram bhaje raghavesham
    bhaje || bhaktapriyam bhaktasamadhigamyam cintaharam cintitakamadhenum | suryendukotidyutibhasvaram
    tam ramam bhaje raghavaramacandram || shriramam janakakshitishvarasutavaktrambujaharinam shrimadbhanukulabdhikaustubhamanim
    shriratnavakshassthalam | shrikanthadyamaraugharatnamakutalankarapadambujam shrivatsojjvalamindranilasadrisham
    shriramacandram bhaje || ramacandra caritakathamritam lakshmanagrajagunanukirtanam | raghavesha tava
    padasevanam sambhavantu mama janmajanmani || ravyaktatattvanikarapranavadhirudhah | sitasametamanujena
    hridantarale pranaprayanasamaye mama sannidhatte || ramo matkuladaivatam sakarunam ramam bhaje sadaram
    ramenakhilaghorapapanihati ramaya tasmai namah | ramannasti jagatrayaikasulabho ramasya daso'smyaham
    rame pritirativa me kulaguro shrirama rakshasva mam || vaidehisahitam suradrumatale haime mahamantape
    | madhyepushpakamasane manimaye virasane samsthitam | agre vacayati prabhanjanasute tattvam munibhyah
    param | vyakhyantam bharatadibhih parivritam ramam bhaje shyamalam || vame bhumisuta purastu hanumanpashcatsumitrasuta
    shshatrughno bharatashca parshvadalayorvayvadikoneshvapi | sugrivashca vibhishanashca yuvarat tarasuto
    jambavan madhye nilasarojakomalarucim ramam bhaje shyamalam || keyurangadakankanairmaniganairvairocamanam
    sada rakaparvanicandrakotisadrisham chatrena vairajitam | hemastambhasahasrashodashayute madhye mahamandape
    devesham bharatadibhih parivritam ramam bhaje shyamalam || sakete sharadindukundadhavale saughe mahamantape
    | paryastagarudhupadhumapatale karpuradipojjvale | sugrivangadavayuputrasahitam saumitrina sevitam
    lilamanushavigraham raghupatim ramam bhaje shyamalam || shantam sharadacandrakotisadrisham candrabhiramananam
    candrarkagnivikasikundaladharam candravatamsastutam | vinapustakasakshasutravilasadvyakhyanamudrakaram
    devesham bharatadibhih parivritam ramam bhaje shyamalam || ramam rakshasamardanam raghupatim shakrarividhvamsinam
    sugrivepsitarajyadam surapateh putrantakam shar nginam | bhaktanamabhayapradam bhayaharam papaughavidhvamsinam
    sitasevitapadapadmayugalam ramam bhaje shyamalam || kandarpayutakotikotitulitam kalambudashyamalam
    kambugrivamudarakaustubhadharam karnavatamsotpalam | kasturitilakojjvalam smitamukham cinmudrayalankritam
    sitalakshmanavayuputrasahitam simhasanastham bhaje || sakete navaratnapanktikhacite citradhvajalankrite
    vase svarnamaye dalashtalalite padme vimanottame | asinam bharatadisodarajanaih shakhamrigaih kinnaraih
    dikpalairmunipungavairnripaganaissamsevyamanam bhaje || kasturighanasarakunkumalasacchricandanalankritam
    kandarpadhikasundaram ghananibham kakutsthavamshadhvajam | kalyanambharaveshtitam kamalaya yuktam
    kalavallabham kalyanacalakarmukapriyasakham kalyanaramam bhaje || muktermulam munivarahridanandakandam
    mukundam kutasthakhyam sakalavaradam sarvacaitanyarupam | nadatitam kamalanilayam nadanadantatattvam
    nadatitam prakritirahitam ramacandram bhaje'ham || tarakaram nikhilanilayam tattvamasyadilakshyam
    shabdavacyam trigunarahitam vyomamangushthamatram | nirvanakhyam sagunamagunavyomarandhrantarastham
    saushumnantah pranavasahitam ramacandram bhaje'ham || nijanandakaram nigamaturagaradhitapadam parabrahmanandam
    paramapadagam papaharanam | kripaparavaram paramapurusham padmanilayam bhaje ramam shyamam prakritirahitam
    nirgunamaham || sakete nagare samastamahimadhare jaganmohane ratnastambhasahasramantapamahasimhasane
    sambuje | vishvamitravasishthagautamashukavyasadibhirmaunibhih dhyeyam lakshmanalokapalasahitam sitasametam
    bhaje || ramam shyamabhiramam ravishashinayanam kotisuryaprakasham divyam divyastrapanim sharamukhasharadhim
    carukodandahastam | kalam kalagnirudram ripukuladahanam vighnavicchedadaksham bhimam bhimattahasam
    sakalabhayaharam ramacandram bhaje'ham || shriramam bhuvanaikasundaratanum dharadharashyamalam rajivayatalocanam
    raghuvaram rakendubimbananam | kodandadinijayudhashritabhujairbhrantam videhatmaja dhisham bhaktajanavanam
    raghuvaram shriramacandram bhaje || shrivatsankamudarakaustubhalasatpitambaralankritam nanaratnavirajamanamakutam
    nilambudashyamalam | kasturighanasaracarcitatanum mandaramaladharam kandarpayutasundaram raghupatim
    sitasametam bhaje || sadanandadeve sahasrarapadme galaccandrapiyushadharamritante | sthitam ramamurtim
    nisheve nisheve 'nyadaivam na seve na seve na seve || sudhabhasitadvipamadhye vimane suparvalivrikshojjvale
    sheshatalpe | nishannam ramankam nisheve nisheve 'nyadaivam na seve na seve na seve || cidamsham samanandamanandakandam
    sushumnakhyarandhrantarale ca hamsam | sacakram sashankham sapitambarankam parancanyadaivam na jane
    na jane || caturvedakutollasatkaranakhyam sphuraddivyavaimanike bhogitalpe | parandhamamurtim nishannam
    nisheve nisheve'nyadaivam na seve na seve || simhasanastham surasevitavyam ratnankitalankritapadapadmam
    | sitasametam shashisuryanetram ramam bhaje raghava ramacandram || ramam puranapurusham ramaniyavesham
    rajadhirajamakutarcitapadapitham | sitapatim sunayanam jagadekaviram shriramacandramanisham kalayami
    citte || paranandavastusvarupadisakshim parabrahmagamyam paranjyotimurtim | parashaktimitra'priyaradhitanghrim
    parandhamarupam bhaje ramacandram || mandasmitam kundalagandabhagam pitambaram bhushanabhushitangam
    | nilotpalangam bhuvanaikamitram ramam bhaje raghava ramacandram || acintyamavyaktamanantarupa madvaitamanandamanadigamyam
    | punyasvarupam purushottamakhyam ramam bhaje raghava ramacandram || padmasanastham surasevitavyam
    padmalayanandakatakshavikshyam | gandharvavidyadharagiyamanam ramam bhaje raghava ramacandram || anantakirtim
    varadam prasannam padmasanam sevakaparijatam | rajadhirajam raghuviraketum ramam bhaje raghava ramacandram
    || sugrivamitram sujananurupam lankaharam rakshasavamshanasham | vedashrayangam vipulayataksham ramam
    bhaje raghava ramacandram || sakritpranatarakshayam sakshi yasya vibhishanah | saparadhapratikarah
    sa shriramo gatirmama || phalamulashinau dantau tapasau dharmacarinau | rakshahkulavihantarau bhratarau
    ramalakshmanau || tarunau rupasampannau sukumarau mahabalau | pundarika vishalakshau cirakrishnajinambarau
    || kausalyanayanendum dasharathamukharavindamartandam | sitamanasahamsam ramam rajivalocanam vande
    || bharjanam bhavabijanam marjanam sukhasampadam | tarjanam yamadutanam ramarameti kirtanam || na
    jane janaki jane rama tvannamavaibhavam | sarvesho bhagavan shambhurvalmikirvetti va nava || karataladhritacapam
    kalameghasvarupam sarasijadalanetram caruhasam sugatram | vicinutavanavasam vikramodagravesham pranamata
    raghunatham janakiprananatham || vidyutsphuranmakarakundaladiptacaru gandasthalam manikiritavirajamanam
    | pitambaram jaladanilamudarakantim shriramacandramanisham kalayami citte || ratnollasajjvalitakundalagandabhagam
    kasturikatilakashobhitaphalabhagam | karnantadirghanayanam karunakataksham shriramacandra mukhamatmani
    sannidhattam || vaidehisahitam ca lakshmanayutam kaikeyiputranvitam sugrivam ca vibhishananilasutau
    nilam nalam sangadam | vishvamitravasishthagautamabharadvajadikan manayan ramo marutisevitah smaratu
    mam samrajyasimhasane || sakalagunanidhanam yogibhisstuyamanam bhajitasuravimanam rakshitendradimanam
    | mahitavrishabhayanam sitaya shobhamanam smaratu hridayabhanum brahmaramabhiramam || tridashakumudacandro
    danavambhojacandro duritatimiracandro yoginam jnanacandrah | pranatanayanacandro maithilinetracandro
    dashamukharipucandrah patu mam ramacandrah || yannamaiva sahasranamasadrisham yannama vedaissamam
    yannamankitavakya masurabalastrigarbhavicchedanam | yannama shvapacaryabhedarahitam muktipradanojjvalam
    tannama'laghuramaramaramanam shriramanamamritam || rajivanetra raghupungava ramabhadra rakendubimbasadrishanana
    nilagatra | rama'bhirama raghuvamshasamudbhava tvam shriramacandra mama dehi karavalambam || manikyamanjirapadaravindam
    ramarkasamphullamukharavindam | bhaktabhayaprapikararavindam devim bhaje raghavavallabham tam || jayatu
    vijayakari janakimodakari tapanakulavihari dandakaranyacari | dashavadanakuthari daityavicchedakari
    manimakutakadhari candakodandadhari || ramah pita raghava eva mata ramassubandhushca sakha hitashca
    | ramo gururme paramam ca daivam ramam vina na'nyamaham smarami || shrirama me tvam hi pita ca mata
    shrirama me tvam hi suhricca bandhuh | shrirama me tvam hi gurushca goshthi shrirama me tvam hi samastameva
    || ramacandracaritamritapanam somapanashatakotisamanam | somapanashatakotibhiriya jjanma naiti raghunayakanamna
    || rama rama dayasindho ravanare jagatpate | tvatpadakamalasakti rbhavejjanmani janmani || shriramacandreti
    dayapareti bhaktapriyeti bhavabandhanamocaneti | natheti nagashayaneti sada stuvantam mam pahi bhitamanisham
    kripanam kripalo || ayodhyanatha rajendra sitakanta jagatpate | shrirama pundarikaksha ramacandra
    namo'stu te || he rama he ramana he jagadekavira he natha he raghupate karunalavala | he janakiramana
    he jagadekabandho mam pahi dinamanisham kripanam kritaghnam || janati rama tava tattvagatim hanuman
    | janati rama tava sakhyagatim kapishah | janati rama tava yuddhagatim dashasyo | janati rama dhanadanuja
    eva satyam || sevyam shriramamantram shravanashubhakaram shreshthasujnanimantram stavyam shriramamantram
    narakaduritadurvaranirghatamantram | bhavyam shriramamantram bhajatu bhajatu samsaranistaramantram
    divyam shriramamantram divi bhuvi vilasanmoksharakshaikamantram || nikhilanilayamantram nityatattvakhyamantram
    bhavakulaharamantram bhumijapranamantram | pavanajanutamantram parvatimokshamantram pashupatinijamantram
    patu mam ramamantram || pranavanilayamantram prananirvanamantram prakritipurushamantram brahmarudrendramantram
    | prakataduritaragadveshanirnashamantram raghupatinijamantram ramarametimantram || dasharathasutamantram
    daityasamharamantram vibudhavinutamantram vishvavikhyatamantram | munigananutamantram muktimargaikamantram
    raghupatinijamantram ramarametimantram || samsarasagarabhayapahavishvamantram sakshanmumukshujanasevitasiddhamantram
    | sarangahastamukhahastanivasamantram kaivalyamantramanisham bhaja ramamantram || jayatu jayatu mantram
    janmasaphalyamantram jananamaranabhedakleshavicchedamantram | sakalanigamamantram sarvashastraikamantram
    raghupatinijamantram ramarametimantram || jagati vishadamantram janakipranamantram vibudhavinutamantram
    vishvavikhyatamantram | dasharathasutamantram daityasamharamantram raghupatinijamantram ramarametimantram
    || brahmadiyogimunipujitasiddhamantram daridryaduhkhabhavarogavinashamantram | samsarasagarasamuttaranaikamantram
    vande mahabhayaharam raghuramamantram || shatrucchedaikamantram sarasamupanishadvakyasampujyamantram
    samsarottaramantram samucitasamaye sanganiryanamantram | sarvaishvaryaikamantram vyasanabhujagasandashtasantranamantram
    jihve shriramamantram japa japa saphalam janmasaphalyamantram || nityam shriramamantram nirupamamadhikam
    nitisujnanamantram satyam shriramamantram sadamalahridaye sarvadarogyamantram | stutyam shriramamantram
    sulalitasumanassaukhyasaubhagyamantram pathyam shriramamantram pavanajavaradam patu mam ramamantram
    || vyamohaprashamaushadham munimanovrittipravrittyaushadham daityonmulakaraushadham bhavabhayapradhvamsanaikaushadham
    | bhaktanandakaraushadham tribhuvane sanjivanaikaushadham shreyah praptikaraushadham piba manah shriramanamaushadham
    || sakalabhuvanaratnam sarvashastrartharatnam samaravijayaratnam saccidanandaratnam | dashamukhahararatnam
    danavaratiratnam raghukulanriparatnam patu mam ramaratnam || sakalabhuvanaratnam saccidanandaratnam
    sakalahridayaratnam suryabimbantaratnam | vimalasukritaratnam vedavedantaratnam puraharajaparatnam
    patu mam ramaratnam || nigamashikhararatnam nirmalanandaratnam nirupamagunaratnam nadanadantaratnam
    | dasharathakularatnam dvadashantasstharatnam pashupatijaparatnam patu mam ramaratnam || shatamakhasutaratnam
    shodashantasstharatnam munijanajaparatnam mukhyavaikuntharatnam | nirupamagunaratnam nirajantasstharatnam
    paramapadaviratnam patu mam ramaratnam || sakalasukritaratnam satyavakyartharatnam shamadamagunaratnam
    shashvatanandaratnam | pranayanilayaratnam prasphutadyotiratnam paramapadaviratnam patu mam ramaratnam
    || nigamashikhararatnam nityamashasyaratnam jananutanriparatnam janakiruparatnam | bhuvanavalayaratnam
    bhubhujamekaratnam raghukulavararatnam patu mam ramaratnam || vishalanetram paripurnagatram sitakalatram
    suravairijaitram | karunyapatram jagatah pavitram shriramaratnam pranato'smi nityam || he gopalaka
    he dayajalanidhe he sadgunambhonidhe he daityantaka he vibhishanadayaparina he bhupate | he vaidehasutamanojavihrite
    he kotimarakrite he navyambujanetra palaya param janami na tvam vina || yasya kincidapi no haraniyam
    karma kincidapi no caraniyam | ramanama ca sada smaraniyam lilaya bhavajalam taraniyam || dasharathasutamisham
    dandakaranyavasam shatamakhamaninilam janakipranalolam | sakalabhuvanamoham sannutambhodadeham bahulanutasamudram
    bhavaye ramabhadram || vishalanetram paripurnagatram sitakalatram suravairijaitram | jagatpavitram
    paramatmatantram shriramacandram pranamami citte || jaya jaya raghurama shrimukhambhojabhano jaya
    jaya raghuvira shrimadambhojanetra | jaya jaya raghunatha shrikarabhyarcitanghri jaya jaya raghuvarya
    shrisha karunyasindho || mandaramule manipithasamstham sudhaplutam divyaviratsvarupam | sabindunadantakalantaturya
    murtim bhaje'ham raghuvamsharatnam || nadam nadavinilacittapavanam nadantattvapriyam namakaravivarjitam
    navaghanashyamanganadapriyam | nadambhojamarandamattavilasadbhringam madantassthitam nadantadhrivamandalabjaruciram
    ramam bhaje tarakam || nanabhutahridabjapadmanilayam namojjvalabhushanam | namastotrapavitritatribhuvanam
    narayanashtaksharam | nadantendugalatsudhaplutatanum nanatmacinmatrakam | nanakotiyugantabhanusadrisham
    ramam bhaje tarakam || vedyam vedagurum virincijanakam vedantamurtim sphura dvedam vedakalapamulamahimadharantakandankuram
    | vedashringasamanasheshashayanam vedantavedyatmakam vedaradhitapadapankajamaham ramam bhaje tarakam
    || majjivam madanugraham madadhipam madbhavanam matsukham mattatam mama sadgurum mama varam mohandhavicchedanam
    | matpunyam madanekabandhavajanam majjivanam mannidhim matsiddhim mama sarvakarmasukritam ramam bhaje
    tarakam || nityam nirajalocanam nirupamam nivarashukopamam nirbhedanubhavam nirantaragunam nilangaragojjvalam
    | nishpapam nigamagamarcitapadam nityatmakam nirmalam nishpunyam nikhilam niranjanapadam ramam bhaje
