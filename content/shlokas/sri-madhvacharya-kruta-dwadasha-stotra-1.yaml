id: sri-madhvacharya-kruta-dwadasha-stotra-1
category: stotram
name:
  english: Sri Madhvacharya Kruta Dwadasha Stotra - 1
content:
  english: '|| dvadasha stotrani|| atha prathamastotram vande vandyam sadanandam vasudevam niranjanam
    | indirapatimadyadi varadesha varapradam || || namami nikhiladhisha kiritaghrishtapithavat | hrittamah
    shamane''rkabham shripateh padapankajam || || jambunadambaradharam nitambam cintyamishituh | svarnamanjirasamvitam
    arudham jagadambaya || || udaram cintyam ishasya tanutve''pi akhilambharam | valitrayankitam nityam
    arudham shriyaikaya || || smaraniyamuro vishnoh indiravasamuttamaih | var indiravasamishituh indiravasamuttamam
    anantam antavadiva bhujayorantarangatam || || shankhacakragadapadmadharashcintya harerbhujah | pinavritta
    jagadraksha kevalodyogino''nisham || || santatam cintayetkantham bhasvatkaustubhabhasakam | vaikunthasyakhila
    veda udgiryante''nisham yatah || || smareta yamininatha sahasramitakantimat | bhavatapapanodidyam
    shripateh mukhapankajam || || purnananyasukhodbhasim andasmitamadhishituh | govindasya sada cintyam
    nityanandapadapradam || || smarami bhavasantapa hanidamritasagaram | purnanandasya ramasya sanuragavalokanam
    || || dhyayedajasramishasya padmajadipratikshitam | bhrubhangam parameshthyadi padadayi vimuktidam
    || || santatam cintaye''nantam antakale | naivodapuh grinanto''ntam yadgunanam ajadayah || || iti
    shrimadanandatirthabhagavatpadacarya viracitam dvadashastotreshu prathamastotram sampurnam'
  devanagari: ॥ द्वादश स्तोत्राणि॥ अथ प्रथमस्तोत्रम् वन्दे वन्द्यं सदानन्दं वासुदेवं निरञ्जनम् । इन्दिरापतिमाद्यादि
    वरदेश वरप्रदम् ॥ ॥ नमामि निखिलाधीश किरीटाघृष्टपीठवत् । हृत्तमः शमनेऽर्काभं श्रीपतेः पादपङ्कजम् ॥ ॥
    जाम्बूनदाम्बराधारं नितम्बं चिन्त्यमीशितुः । स्वर्णमञ्जीरसंवीतं आरूढं जगदम्बया ॥ ॥ उदरं चिन्त्यं ईशस्य
    तनुत्वेऽपि अखिलम्भरम् । वलित्रयाङ्कितं नित्यं आरूढं श्रियैकया ॥ ॥ स्मरणीयमुरो विष्णोः इन्दिरावासमुत्तमैः
    । वर् इन्दिरावासमीशितुः इन्दिरावासमुत्तमम् अनन्तं अन्तवदिव भुजयोरन्तरङ्गतम् ॥ ॥ शङ्खचक्रगदापद्मधराश्चिन्त्या
    हरेर्भुजाः । पीनवृत्ता जगद्रक्षा केवलोद्योगिनोऽनिशम् ॥ ॥ सन्ततं चिन्तयेत्कण्ठं भास्वत्कौस्तुभभासकम्
    । वैकुण्ठस्याखिला वेदा उद्गीर्यन्तेऽनिशं यतः ॥ ॥ स्मरेत यामिनीनाथ सहस्रामितकान्तिमत् । भवतापापनोदीड्यं
    श्रीपतेः मुखपङ्कजम् ॥ ॥ पूर्णानन्यसुखोद्भासिं अन्दस्मितमधीशितुः । गोविन्दस्य सदा चिन्त्यं नित्यानन्दपदप्रदम्
    ॥ ॥ स्मरामि भवसन्ताप हानिदामृतसागरम् । पूर्णानन्दस्य रामस्य सानुरागावलोकनम् ॥ ॥ ध्यायेदजस्रमीशस्य
    पद्मजादिप्रतीक्षितम् । भ्रूभङ्गं पारमेष्ठ्यादि पददायि विमुक्तिदम् ॥ ॥ सन्ततं चिन्तयेऽनन्तं अन्तकाले
    । नैवोदापुः गृणन्तोऽन्तं यद्गुणानां अजादयः ॥ ॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य विरचितं द्वादशस्तोत्रेषु
    प्रथमस्तोत्रं सम्पूर्णम्
