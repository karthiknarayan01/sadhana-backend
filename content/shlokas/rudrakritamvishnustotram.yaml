id: rudrakritamvishnustotram
category: stotram
name:
  english: rudrakritamvishnustotram
  devanagari: रुद्रकृतंविष्णुस्तोत्रम्
content:
  english: rudrakritam vishnustotram rudra uvaca | namo'stvanantaya vishuddhacetase saruparupaya sahasrabahave
    | sahasrarashmipravaraya vedhase vishaladehaya vishuddhakarmine || 17|| samastavishvartiharaya shambhave
    sahasrasuryanilatigmatejase | samastavidyavidhritaya cakrine samastagirvananute sada'nagha || 18||
    anadidevacyuta sheshashekhara prabho vibho bhutapate maheshvara | marutpate sarvapate jagatpate bhuvah
    pate bhuvanapate sada namah || 19|| jalesha narayana vishvashankara kshitisha vishveshvara vishvalocana
    | shashankasuryacyuta vira vishvagapratarkyamurtte'mritamurtiravyayah || 20|| jvaladdhutasharciviruddhamandala
    prapahi narayana vishvatomukha | namo'stu devarttiharamritavyaya prapahi mam sharanagatam sadacyuta
    || 21|| vaktranyanekani vibho tavaham pashyami madhyasthagatam puranam | brahmanamisham jagatam prasutim
    namo'stu tubhyam tu pitamahaya || 22|| samsaracakrabhramanairanekaih kvacidbhavan devavaradideva |
    sanmargibhirjnanavishuddhasattvairupasyase kim pralapamyaham tvam || 23|| ekam bhavantam prakriteh
    parastadyo vettyasau sarvavidadiboddha | guna na teshu prasabham vibhedya vishalamurtirhi susukshmarupah
    || 24|| nirvakyo nirmano vigatendriyo'si karmabhavanno vigataikakarma | samsaravamstvam hi na tadrisho'si
    punah katham devavarasi vedyah || 25|| murtamurtam tvatulam labhyate te param vapurdeva vishuddhabhavaih
    | samsaravicchittikarairyajadbhirato'vasiyeta caturbhujastvam || 26|| param na jananti yato vapuste
    devadayo'pyadbhutakaranam tat | ato'vataroktatanum puranamaradhayeyuh kamalasanadyah || 27|| na te
    vapurvishvasrigabjayonirekantato veda mahanubhavah | param tvaham vedmi kavim puranam bhavantamadyam
    tapasa vishuddhah || 28|| padmasano me janakah prasiddhashcaitat prasutavasakritpuranaih | sambodhyate
    natha na madvidho'pi vidurbhavantam tapasa vihinah || 29|| brahmadibhistatpravarairabodhyam tvam deva
    murkhah svamanantanatya | prabodhamicchanti na teshu buddhirudarakirttishvapi vedahinah || 30|| janmantarairvedavidam
    vivekabuddhirbhavennatha tava prasadat | tvallabdhalabhasya na manushatvam na devagandharvagatih shivam
    syat || 31|| tvam vishnurupo'si bhavan susukshmah sthulo'si cedam kritakrityatayah | sthulah susukshmah
    sulabho'si deva tvadvahyavrittya narake patanti || 32|| kimucyate va bhavati sthite'smin khatmyenduvahnyarkamahimarudbhih
    | tattvaih satoyaih samarupadharinyatmasvarupe vitatasvabhave || 33|| iti stutim me bhagavannananta
    jushasva bhaktasya visheshatashca | srishtim srijasveti tavoditasya sarvajnatam dehi namo'stu vishno
    || 34|| caturmukho yo yadi kotivaktro bhavennarah kvapi vishuddhacetah | sa te gunanamayutairanekairvadettada
    devavara prasida || 35|| samadhiyuktasya vishuddhabuddhestvadbhavabhavaikamano'nugasya | sada hridistho'si
    bhavannamaste na sarvagasyasti prithagvyavastha || 36|| iti prakasham kritametadisha stavam maya sarvagatam
    vibuddhva | samsaracakrakramamanayuktya bhitam punihyacyuta kevalatvam || 37|| iti varahapurane trissaptatitamadhyayantargatam
    rudrakritam vishnustotram samaptam | varahapurana | adhyaya 73
  devanagari: रुद्रकृतं विष्णुस्तोत्रम् रुद्र उवाच । नमोऽस्त्वनन्ताय विशुद्धचेतसे सरूपरूपाय सहस्रबाहवे
    । सहस्ररश्मिप्रवराय वेधसे विशालदेहाय विशुद्धकर्मिणे ॥ १७॥ समस्तविश्वार्तिहराय शम्भवे सहस्रसूर्यानिलतिग्मतेजसे
    । समस्तविद्याविधृताय चक्रिणे समस्तगीर्वाणनुते सदाऽनघ ॥ १८॥ अनादिदेवाच्युत शेषशेखर प्रभो विभो भूतपते
    महेश्वर । मरुत्पते सर्वपते जगत्पते भुवः पते भुवनपते सदा नमः ॥ १९॥ जलेश नारायण विश्वशङ्कर क्षितीश विश्वेश्वर
    विश्वलोचन । शशाङ्कसूर्याच्युत वीर विश्वगाप्रतर्क्यमूर्त्तेऽमृतमूर्तिरव्ययः ॥ २०॥ ज्वलद्धुताशार्चिविरुद्धमण्डल
    प्रपाहि नारायण विश्वतोमुख । नमोऽस्तु देवार्त्तिहरामृताव्यय प्रपाहि मां शरणगतं सदाच्युत ॥ २१॥ वक्त्राण्यनेकानि
    विभो तवाहं पश्यामि मध्यस्थगतं पुराणम् । ब्रह्माणमीशं जगतां प्रसूतिं नमोऽस्तु तुभ्यं तु पितामहाय ॥
    २२॥ संसारचक्रभ्रमणैरनेकैः क्वचिद्भवान् देववरादिदेव । सन्मार्गिभिर्ज्ञानविशुद्धसत्त्वैरुपास्यसे किं
    प्रलपाम्यहं त्वाम् ॥ २३॥ एकं भवन्तं प्रकृतेः परस्ताद्यो वेत्त्यसौ सर्वविदादिबोद्धा । गुणा न तेषु प्रसभं
    विभेद्या विशालमूर्तिर्हि सुसूक्ष्मरूपः ॥ २४॥ निर्वाक्यो निर्मनो विगतेन्द्रियोऽसि कर्माभवान्नो विगतैककर्मा
    । संसारवांस्त्वं हि न तादृशोऽसि पुनः कथं देववरासि वेद्यः ॥ २५॥ मूर्तामूर्तं त्वतुलं लभ्यते ते परं
    वपुर्देव विशुद्धभावैः । संसारविच्छित्तिकरैर्यजद्भिरतोऽवसीयेत चतुर्भुजस्त्वम् ॥ २६॥ परं न जानन्ति यतो
    वपुस्ते देवादयोऽप्यद्भुतकारणं तत् । अतोऽवतारोक्ततनुं पुराणमाराधयेयुः कमलासनाद्याः ॥ २७॥ न ते वपुर्विश्वसृगब्जयोनिरेकान्ततो
    वेद महानुभावः । परं त्वहं वेद्मि कविं पुराणं भवन्तमाद्यं तपसा विशुद्धः ॥ २८॥ पद्मासनो मे जनकः प्रसिद्धश्चैतत्
    प्रसूतावसकृत्पुराणैः । सम्बोध्यते नाथ न मद्विधोऽपि विदुर्भवन्तं तपसा विहीनाः ॥ २९॥ ब्रह्मादिभिस्तत्प्रवरैरबोध्यं
    त्वां देव मूर्खाः स्वमनन्तनत्या । प्रबोधमिच्छन्ति न तेषु बुद्धिरुदारकीर्त्तिष्वपि वेदहीनाः ॥ ३०॥ जन्मान्तरैर्वेदविदां
    विवेकबुद्धिर्भवेन्नाथ तव प्रसादात् । त्वल्लब्धलाभस्य न मानुषत्वं न देवगन्धर्वगतिः शिवं स्यात् ॥ ३१॥
    त्वं विष्णुरूपोऽसि भवान् सुसूक्ष्मः स्थूलोऽसि चेदं कृतकृत्यतायाः । स्थूलः सुसूक्ष्मः सुलभोऽसि देव
    त्वद्वाह्यवृत्त्या नरके पतन्ति ॥ ३२॥ किमुच्यते वा भवति स्थितेऽस्मिन् खात्म्येन्दुवह्न्यर्कमहीमरुद्भिः
    । तत्त्वैः सतोयैः समरूपधारिण्यात्मस्वरूपे विततस्वभावे ॥ ३३॥ इति स्तुतिं मे भगवन्ननन्त जुषस्व भक्तस्य
    विशेषतश्च । सृष्टिं सृजस्वेति तवोदितस्य सर्वज्ञतां देहि नमोऽस्तु विष्णो ॥ ३४॥ चतुर्मुखो यो यदि कोटिवक्त्रो
    भवेन्नरः क्वापि विशुद्धचेताः । स ते गुणानामयुतैरनेकैर्वदेत्तदा देववर प्रसीद ॥ ३५॥ समाधियुक्तस्य विशुद्धबुद्धेस्त्वद्भावभावैकमनोऽनुगस्य
    । सदा हृदिस्थोऽसि भवान्नमस्ते न सर्वगस्यास्ति पृथग्व्यवस्था ॥ ३६॥ इति प्रकाशं कृतमेतदीश स्तवं मया
    सर्वगतं विबुद्ध्वा । संसारचक्रक्रममाणयुक्त्या भीतं पुनीह्यच्युत केवलत्वम् ॥ ३७॥ इति वराहपुराणे त्रिस्सप्ततितमाध्यायान्तर्गतं
    रुद्रकृतं विष्णुस्तोत्रं समाप्तम् । वराहपुराण । अध्याय ७३
