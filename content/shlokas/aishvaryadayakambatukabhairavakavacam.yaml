id: aishvaryadayakambatukabhairavakavacam
category: kavacha
name:
  english: aishvaryadayakambatukabhairavakavacam
  devanagari: ऐश्वर्यदायकंबटुकभैरवकवचम्
content:
  english: shiro me bhairavah patu bhalam puranishudanah | drishau patu trinetri me shravanam nilakanthakah
    || 1|| digvasa me patu kantham nasikabhagakanyabhak | oshthau tripuradhati me jihvam patu kapaladhrik
    || 2|| dantan patu kratudhvamsi cibukam bhutavasakah | kapali patu me grivam skandhau patu gajantakah
    || 3|| bhujau me patu kaumaro hridayam kshetrapalakah | abhirurme stanau patu vakshah patu maheshvarah
    || 4|| kukshau me patu samhartta nabhim me shanmukhapriyah | bhutanathah katim patu guhyam patu jatadharah
    || 5|| uru patu vrisharudho januni bhutabhavanah | shamashanavasi me patu patu sarvangamishvarah ||
    6|| || iti aishvaryadayakam batukabhairavakavacam sampurnam ||
  devanagari: शिरो मे भैरवः पातु भालं पुरनिषूदनः । दृशौ पातु त्रिनेत्री मे श्रवणं नीलकण्ठकः ॥ १॥ दिग्वासा
    मे पातु कण्ठं नासिकाभगकन्यभाक् । ओष्ठौ त्रिपुरधाती मे जिह्वां पातु कपालधृक् ॥ २॥ दन्तान् पातु क्रतुध्वंसी
    चिबुकं भूतवासकः । कपाली पातु मे ग्रीवां स्कन्धौ पातु गजान्तकः ॥ ३॥ भुजौ मे पातु कौमारो हृदयं क्षेत्रपालकः
    । अभीरुर्मे स्तनौ पातु वक्षः पातु महेश्वरः ॥ ४॥ कुक्षौ मे पातु संहर्त्ता नाभिं मे षण्मुखप्रियः । भूतनाथः
    कटिं पातु गुह्यं पातु जटाधरः ॥ ५॥ ऊरू पातु वृषारूढो जानुनी भूतभावनः । शमशानवासी मे पातु पातु सर्वाङ्गमीश्वरः
    ॥ ६॥ ॥ इति ऐश्वर्यदायकं बटुकभैरवकवचं सम्पूर्णम् ॥
