id: prithukritamvishnustotram
category: stotram
name:
  english: prithukritamvishnustotram
  devanagari: पृथुकृतंविष्णुस्तोत्रम्
content:
  english: rna syatkritatvaccaranaikatanayoh || 27|| jagajjananyam jagadisha vaishasam syadeva yatkarmani
    nah samihitam | karoshi phalgvapyuru dinavatsalah sva eva dhishnye'bhiratasya kim taya || 28|| bhajantyatha
    tvamata eva sadhavah vyudastamayagunavibhramodayam | bhavatpadanusmaranadrite satam nimittamanyadbhagavan
    na vidmahe || 29|| manye giram te jagatam vimohinim varam vrinishveti bhajantamattha yat | vaca nu
    tantya yadi te jano'sitah katham punah karma karoti mohitah || 30|| tvanmayayaddha jana isha khandito
    yadanyadashasta ritatmano'budhah | yatha caredbalahitam pita svayam tatha tvamevarhasi nah samihitum
    || 31|| iti shrimadbhagavatamahapurane caturthaskandhe vimshadhyayantargatam prithukritam vishnustotram
    samaptam | bhagavatapurana | adhyaya 4
  devanagari: र्न स्यात्कृतत्वच्चरणैकतानयोः ॥ २७॥ जगज्जनन्यां जगदीश वैशसं स्यादेव यत्कर्मणि नः समीहितम्
    । करोषि फल्ग्वप्युरु दीनवत्सलः स्व एव धिष्ण्येऽभिरतस्य किं तया ॥ २८॥ भजन्त्यथ त्वामत एव साधवः व्युदस्तमायागुणविभ्रमोदयम्
    । भवत्पदानुस्मरणादृते सतां निमित्तमन्यद्भगवन् न विद्महे ॥ २९॥ मन्ये गिरं ते जगतां विमोहिनीं वरं वृणीष्वेति
    भजन्तमात्थ यत् । वाचा नु तन्त्या यदि ते जनोऽसितः कथं पुनः कर्म करोति मोहितः ॥ ३०॥ त्वन्माययाद्धा जन
    ईश खण्डितो यदन्यदाशास्त ऋतात्मनोऽबुधः । यथा चरेद्बालहितं पिता स्वयं तथा त्वमेवार्हसि नः समीहितुम्
    ॥ ३१॥ इति श्रीमद्भागवतमहापुराणे चतुर्थस्कन्धे विंशाध्यायान्तर्गतं पृथुकृतं विष्णुस्तोत्रं समाप्तम्
    । भागवतपुराण । अध्याय ४
