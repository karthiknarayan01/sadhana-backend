id: sudarshanacakrakavacam-6
category: kavacha
name:
  english: sudarshanacakrakavacam 6
  devanagari: सुदर्शनचक्रकवचम् ६
content:
  english: sarvabhutebhyo bhayam nashaya nashaya | shirashulakshishula karnashula kanthashula hridayashula
    bahushula kukshishula katishula angashula lingashula yonishula sarvangashula vatashula pittashula
    shleshmashula adi sarvashulan nirmulaya nirmulaya | danava daitya kamini vetala brahmarakshasa chayagrahadi
    sarvagrahan chindhi chindhi bhindhi bhindhi | bhasmikuru bhasmikuru | paramantran parayantran paratantran
    chedaya chedaya | hram phat | hrum phat svaha || om namo bhagavate mahagarudadhvajaya etaddhi sarvajvarabhayam
    cakrena chindhi | bhindhi bhindhi | shankhacakragadapadmaih sarvabhayam hana hana | nashaya nashaya
    mam raksha | sarvarakshakavacamajnapaya | hrum phat svaha || om namo bhagavate sudarshanamantrarajaya
    gandharvayaksharakshasabhayam chindhi chindhi | vidaraya vidaraya | paramanntran grasaya grasaya |
    parayantratantrani dushtacetakakarana mahamarivetalabhutapreta pishacadin bhakshaya bhakshaya | acakraya
    vicakraya sucakraya asurantakacakraya sarvalokarakshanacakraya sudarshanacakrayastrarajaya hum phat
    svaha || om namo bhagavate mahasudarshanacakraya jvaladityarupaya sarvato mam raksha raksha | mahabalaya
    jvalaparivartin kshraum sarvagrahan hana hana hum phat svaha || om namo bhagavate astrarajaya kshraum
    drim nrisimhaya kshraum devadanava daityapujitaya pradipta kotyadityasahasrasamatejase karaladamshtrayudhaya
    vikirnakesarasataya kshubhitamahavargabheridundubhinirghoshaya sarvamantroccaranahridayaya pahi pahi
    bhagavan narasimha purushavara parabrahmasanatana shighram daha daha | paca paca | matha matha | ghoshaya
    ghoshaya nikrintaya nikrintaya | tavatsamagata patalebhyah phat asurebhyah | phat jinvajatibhyah phat
    mantrajatibhyah phat sarvan mantran bhakshaya bhakshaya | narasimhavishno sarvapatalebhyah sarvapapagrahebhyopadravebhyah
    sarvamantrabhidbhya raksha raksha | am am hrim kshraum hum phat svaha || om namo bhagavate mahavira
    aghora narasimha mahabalamahaparakramaya madanahantre aghorakalantaka shakini dakini marimahamaribhuta
    pretapishacarakshamsi antarikshayakshini jalayakshinisthalayakshini yaksharakshasagandharva brahmarakshasavetalayamaduta
    mantragrahadi sarvashularupadikan durasthan samipasthan bhutabhavishyavartamanadivacaran madhyacaran
    ratricaran jalasthan sthalasthan balagrahan putanasphotanagrahan udarasthan grahan sarvan nashaya
    nashaya daha daha hana hana paca paca mardaya mardaya khadaya khadaya kshobhaya kshobhaya trotaya
    trotaya chindhi chindhi bhindhi bhindhi bhedaya bhedaya grasaya grasayam trasaya trasaya jribhasva
    jribhasva nuda nuda suda suda mohaya mohaya prasabhavaya prasabhavaya shoshaya shoshaya aghoranarasimha
    aghoramurte agorabhairava mahavirahanumanta sarvasattvan bandhaya bandhaya tam hum phat svaha || om
    namo bhagavate aghoranarasimha tribhuvanadhishvara mahabhimaparakrama vidhabhuta pretapishacashakinidakini
    yaksharakshasayamadutabrahmarakshasakalabhairavakalpantananayakshinikapalikagrahan mardaya mardaya
    bandhaya bandhaya bhakshaya bhakshaya maraya maraya chedaya chedaya matha matha khadaya khadaya kshobhaya
    kshobhaya stambhaya stambhaya parakritamantrayantratantracentakaputalikadikan vidhvamsaya vidhvamsaya
    nashaya nashaya tah tah tah tah hum phat svaha || om namo bhagavate ramaduta mahabhayanivaraka bhutapretapishacadi
    grahan brahmarakshasadi grahan nashaya nashaya | mahabhimaparakramaya kritamantrayantratantracetakaputalikadin
    durasthan paradeshasthan grahasthitan savyadhisthitan bahirbhumisthitan upaveshasthitan amurtasthan
    sutrakritan vastrakritan annakritan kashthakritan varmakritan pashanakritan romakritan keshakritanmrittikadikrittikadikritan
    jivavisheshakritan aushadhadisulabhakritan jivavisheshaghatakaran kabandhakaran pidakaran jalasthan
    antarikshasthan vrikshavalannamanan nagarasthitan rudrabhumisthan nanakararupakaran nanadaivatavikaran
    nanabalibhakshakan sharirasthadahashokakarakan vayusamjnakan shulasamjnakan gatichedakarakan raktashoshakan
    mamsabhakshakan kundalakritakarakan tikshnashulakarakan ekangaharakan kapishulakarakan yantrapracchedakarakan
    parasparagrahacamukaran nanavarnan sarvacetakan namasamanagatan tadbhayavedanan nashaya nashaya bandhaya
    bandhaya khadaya khadaya grasaya grasaya shoshaya shoshaya mathaya mathaya chedaya chedaya bhedaya
    bhedaya bhishaya bhishaya mardaya mardaya sevasva sevasva ghataya ghataya shastrakidhadhalikiranamudataya
    mudataya acarena trasaya trasaya mocaya mocaya tan sarvantruda nada sadaskarthena bhasmikuru kuru
    bho ramadattavikshyam tha tha tha tha hum phat svaha || om namo bhagavate aghoreshvara mahabhayanivaranaya
    aghoramurtaye aghora bhairavaya parakrita mantrayantrapatantrakritacetakam bandhaya vastracetakaputalika
    cetaka putanadina hana hana bhindhi bhindhi chindhi chindhi uccataya uccataya catakabandhakeshacatakakarma
    catakavastra catakamrittika catakagomaya cataka anna cetakacetashulan nashaya nashaya paradeshasthita
    cetakan nashaya nashaya samipasthacetakan nashaya nashaya grahasthita cetakan nashaya nashaya nakan
    nanakritikaramarakacetakan shighram nashaya nashaya chedaya chedaya khadaya khadaya nanabalidana bhakshaka
    chedakacetakan udghataya udghataya nanachedakarakacetakan bhasmikuru kuru hram hram hram hrum hrum
    hrum phat svaha || om namo bhagavate mahagarudaya etyehi aveshaya aveshaya dushtarakshasan chindhi
    chindhi mahagarudastraya dushtajvarabhutapretapishacabrahmarakshasadikritam vyatham chindhi chindhi
    mahagarudaya bandha bandha hum phat svaha || iti sudarshanasamhitayam sudarshanakavacam sampurnam
    |
  devanagari: सर्वभूतेभ्यो भयं नाशय नाशय । शिरशूलाक्षिशूल कर्णशूल कण्ठशूल हृदयशूल बाहुशूल कुक्षिशूल कटिशूल
    अङ्गशूल लिङ्गशूल योनिशूल सर्वाङ्गशूल वातशूल पित्तशूल श्लेष्मशूल आदि सर्वशूलान् निर्मूलय निर्मूलय ।
    दानव दैत्य कामिनी वेताल ब्रह्मराक्षस छायाग्रहादि सर्वग्रहान् छिन्धि छिन्धि भिन्धि भिन्धि । भस्मीकुरु
    भस्मीकुरु । परमन्त्रान् परयन्त्रान् परतन्त्रान् छेदय छेदय । ह्रां फट् । ह्रुं फट् स्वाहा ॥ ॐ नमो भगवते
    महागरुडध्वजाय एतद्धि सर्वज्वरभयं चक्रेण छिन्धि । भिन्धि भिन्धि । शङ्खचक्रगदापद्मैः सर्वभयं हन हन ।
    नाशय नाशय मां रक्ष । सर्वरक्षाकवचमाज्ञापय । ह्रुं फट् स्वाहा ॥ ॐ नमो भगवते सुदर्शनमन्त्रराजाय गन्धर्वयक्षराक्षसभयं
    छिन्धि छिन्धि । विदारय विदारय । परमन्न्त्रान् ग्रासय ग्रासय । परयन्त्रतन्त्राणि दुष्टचेटककरण महामारीवेतालभूतप्रेत
    पिशाचादीन् भक्षय भक्षय । आचक्राय विचक्राय सुचक्राय असुरान्तकचक्राय सर्वलोकरक्षणचक्राय सुदर्शनचक्रायास्त्रराजाय
    हुं फट् स्वाहा ॥ ॐ नमो भगवते महासुदर्शनचक्राय ज्वालादित्यरूपाय सर्वतो मां रक्ष रक्ष । महाबलाय ज्वालापरिवर्तिन्
    क्ष्रौं सर्वग्रहान् हन हन हुं फट् स्वाहा ॥ ॐ नमो भगवते अस्त्रराजाय क्ष्रौं द्रीं नृसिंहाय क्ष्रौं
    देवदानव दैत्यपूजिताय प्रदीप्त कोट्यादित्यसहस्रसमतेजसे करालदंष्ट्रायुधाय विकीर्णकेसरसटाय क्षुभितमहावर्गभेरीदुन्दुभिनिर्घोषाय
    सर्वमन्त्रोच्चारणहृदयाय पाहि पाहि भगवन् नरसिंह पुरुषवर परब्रह्मसनातन शीघ्रं दह दह । पच पच । मथ मथ
    । घोषय घोषय निकृन्तय निकृन्तय । तावत्समागत पातालेभ्यः फट् असुरेभ्यः । फट् जिन्वजातिभ्यः फट् मन्त्रजातिभ्यः
    फट् सर्वान् मन्त्रान् भक्षय भक्षय । नरसिंहविष्णो सर्वपातालेभ्यः सर्वपापग्रहेभ्योपद्रवेभ्यः सर्वमन्त्रभिद्भ्य
    रक्ष रक्ष । अं आं ह्रीं क्ष्रौं हुं फट् स्वाहा ॥ ॐ नमो भगवते महावीर अघोर नारसिंह महाबलमहापराक्रमाय
    मदनहन्त्रे अघोरकालान्तक शाकिनी डाकिनी मारिमहामारिभूत प्रेतपिशाचरक्षांसि अन्तरिक्षयक्षिणी जलयक्षिणीस्थलयाक्षिणी
    यक्षराक्षसगन्धर्व ब्रह्मराक्षसवेतालयमदूत मन्त्रग्रहादि सर्वशूलरूपादिकान् दूरस्थान् समीपस्थान् भूतभविष्यवर्तमानदिवाचरान्
    मध्याचरान् रात्रिचरान् जलस्थान् स्थलस्थान् बालग्रहान् पूतनास्फोटनग्रहान् उदरस्थान् ग्रहान् सर्वान्
    नाशय नाशय दह दह हन हन पच पच मर्दय मर्दय खादय खादय क्षोभय क्षोभय त्रोटय त्रोटय छिन्धि छिन्धि भिन्धि
    भिन्धि भेदय भेदय ग्रासय ग्रासयं त्रासय त्रासय जृभस्व जृभस्व नुद नुद सुद सुद मोहय मोहय प्रसभावय प्रसभावय
    शोषय शोषय अघोरनारसिंह अघोरमूर्ते अगोरभैरव महावीरहनुमन्त सर्वसत्त्वान् बन्धय बन्धय टं हुं फट् स्वाहा
    ॥ ॐ नमो भगवते अघोरनारसिंह त्रिभुवनाधीश्वर महाभीमपराक्रम विधाभूत प्रेतपिशाचशाकिनीडाकिनी यक्षराक्षसयमदूतब्रह्मराक्षसकालभैरवकल्पान्तनानायक्षिणीकापालिकग्रहान्
    मर्दय मर्दय बन्धय बन्धय भक्षय भक्षय मारय मारय छेदय छेदय मथ मथ खादय खादय क्षोभय क्षोभय स्तम्भय स्तम्भय
    परकृतमन्त्रयन्त्रतन्त्रचेण्टकपुतलिकादिकान् विध्वंसय विध्वंसय नाशय नाशय टः टः टः टः हुं फट् स्वाहा
    ॥ ॐ नमो भगवते रामदूत महाभयनिवारक भूतप्रेतपिशाचादि ग्रहान् ब्रह्मराक्षसादि ग्रहान् नाशय नाशय । महाभीमपराक्रमाय
    कृतमन्त्रयन्त्रतन्त्रचेटकपुतलिकादीन् दूरस्थान् परदेशस्थान् ग्रहस्थितान् सव्याधिस्थितान् बहिर्भूमिस्थितान्
    उपवेशस्थितान् अमूर्तस्थान् सूत्रकृतान् वस्त्रकृतान् अन्नकृतान् काष्ठकृतान् वर्मकृतान् पाषाणकृतान्
    रोमकृतान् केशकृतान्मृत्तिकादिकृत्तिकादिकृतान् जीवविशेषकृतान् औषधादिसुलभकृतान् जीवविशेषघटाकारान् कबन्धाकारान्
    पीडाकारान् जलस्थान् अन्तरिक्षस्थान् वृक्षावलन्नमानान् नगरस्थितान् रुद्रभूमिस्थान् नानाकाररूपाकारान्
    नानादैवतविकारान् नानाबलिभक्षकान् शरीरस्थदाहशोककारकान् वायुसंज्ञकान् शूलसंज्ञकान् गतिछेदकारकान् रक्तशोषकान्
    मांसभक्षकान् कुण्डलाकृतकारकान् तीक्ष्णशूलकारकान् एकाङ्गहारकान् कपिशूलकारकान् यन्त्रप्रच्छेदकारकान्
    परस्परग्रहचमूकारान् नानावर्णान् सर्वचेतकान् नामसमानगतान् तद्भयवेदनान् नाशय नाशय बन्धय बन्धय खादय खादय
    ग्रासय ग्रासय शोषय शोषय मथय मथय छेदय छेदय भेदय भेदय भीषय भीषय मर्दय मर्दय सेवस्व सेवस्व घातय घातय
    शस्त्रकीधाढलीकीरणमुदाटय मुदाटय अचरेण त्रासय त्रासय मोचय मोचय तान् सर्वान्त्रुद नद सदस्कर्थेन भस्मीकुरु
    कुरु भो रामदत्तवीक्ष्यं ठ ठ ठ ठ हुं फट् स्वाहा ॥ ॐ नमो भगवते अघोरेश्वर महाभयनिवारणाय अघोरमूर्तये अघोर
    भैरवाय परकृत मन्त्रयन्त्रपतन्त्रकृतचेतकं बन्धय वस्त्रचेटकपुतलिका चेटक पुतनादीन हन हन भिन्धि भिन्धि
    छिन्धि छिन्धि उच्चाटय उच्चाटय चटकबन्धकेशचटककर्म चटकवस्त्र चटकमृत्तिका चटकगोमय चटक अन्न चेटकचेटशूलान्
    नाशय नाशय परदेशस्थित चेटकान् नाशय नाशय समीपस्थचेटकान् नाशय नाशय ग्रहस्थित चेटकान् नाशय नाशय नाकान्
    नानाकृतिकारमारकचेटकान् शीघ्रं नाशय नाशय छेदय छेदय खादय खादय नानाबलिदान भक्षक छेदकचेटकान् उद्घाटय उद्घाटय
    नानाछेदकारकचेटकान् भस्मीकुरु कुरु ह्रां ह्रां ह्रां ह्रुं ह्रुं ह्रुं फट् स्वाहा ॥ ॐ नमो भगवते महागरुडाय
    एत्येहि आवेशय आवेशय दुष्टराक्षसान् छिन्धि छिन्धि महागरुडास्त्राय दुष्टज्वरभूतप्रेतपिशाचब्रह्मराक्षसादिकृतां
    व्यथां छिन्धि छिन्धि महागरुडाय बन्ध बन्ध हुं फट् स्वाहा ॥ इति सुदर्शनसंहितायां सुदर्शनकवचं सम्पूर्णम्
    ।
