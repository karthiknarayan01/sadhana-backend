id: samkashtamocanastotram-2
category: stotram
name:
  english: samkashtamocanastotram 2
  devanagari: संकष्टमोचनस्तोत्रम् २
content:
  english: siddhivriddhim | sammodakapriya upaiti param praharsham ramayanashravanatah pathatam sharanyah
    || 4|| shribharatapravarayuddharathoddhatashrih parthaikaketanakaralavishalamurtih | uccairghanaghanaghatavikatattahasah
    shrikrishnapakshabharanah sharanam mama'stu || 5|| janghalajangha upamatividuravego mushtipraharaparimurcchitarakshasendrah
    | shriramakirtitaparakramanoddhavashrih prakampanirvibhurudancatu bhutaye nah || 6|| sitartidaranapatuh
    prabalah pratapi shriraghavendraparirambhavaraprasadah | varnishvarah savidhishikshitakalanemih pancanano'panayatam
    vipado'dhidesham || 7|| udyadbhanusahasrasannibhatanuh pitambaralankritah projjvalanaladipyamananayano
    nishpishtarakshoganah | samvartodyatavaridoddhataravahproccairgadavibhramah shriman marutanamdanah
    pratidinam dhyeyo vipadbhanjanah || 8|| rakshahpishacabhayanashanamamayadhi proccairjvarapaharanam
    hananam ripunam | sampattiputrakaranam vijayapradanam sankashtamocanavibhoh stavanam naranam || 9||
    daridryaduhkhadahanam shamanam vivade kalyanasadhanamamangalavaranaya | dampatyadirghasukhasarvamanorathaptim
    shrimaruteh stavashatavritiratanoti || 10|| stotram ya etadanuvasaramaptakamah shrimarutim samanucintya
    pathet sudhirah | tasmai prasadasumukho varavanarendrah sakshatkrito bhavati shashvatikah sahayah
    || 11|| sankashtamocanastotram shankaracaryabhikshuna | maheshvarena racitam maruteshcarane'rpitam
    || 12|| iti kashipithadhishvara jagadgurushankaracaryasvami shrimaheshvaranandasarasvativiracitam
    shrisankashtamocanastotram sampurnam |
  devanagari: सिद्धिवृद्धिम् । संमोदकप्रिय उपैति परं प्रहर्षं रामायणश्रवणतः पठतां शरण्यः ॥ ४॥ श्रीभारतप्रवरयुद्धरथोद्धतश्रीः
    पार्थैककेतनकरालविशालमूर्तिः । उच्चैर्घनाघनघटाविकटाट्टहासः श्रीकृष्णपक्षभरणः शरणं ममाऽस्तु ॥ ५॥ जङ्घालजङ्घ
    उपमातिविदूरवेगो मुष्टिप्रहारपरिमूर्च्छितराक्षसेन्द्रः । श्रीरामकीर्तितपराक्रमणोद्धवश्रीः प्राकम्पनिर्विभुरुदञ्चतु
    भूतये नः ॥ ६॥ सीतार्तिदारणपटुः प्रबलः प्रतापी श्रीराघवेन्द्रपरिरम्भवरप्रसादः । वर्णीश्वरः सविधिशिक्षितकालनेमिः
    पञ्चाननोऽपनयतां विपदोऽधिदेशम् ॥ ७॥ उद्यद्भानुसहस्रसन्निभतनुः पीताम्बरालङ्कृतः प्रोज्ज्वालानलदीप्यमाननयनो
    निष्पिष्टरक्षोगणः । संवर्तोद्यतवारिदोद्धतरवःप्रोच्चैर्गदाविभ्रमः श्रीमान् मारुतनंदनः प्रतिदिनं ध्येयो
    विपद्भञ्जनः ॥ ८॥ रक्षःपिशाचभयनाशनमामयाधि प्रोच्चैर्ज्वरापहरणं हननं रिपूणाम् । सम्पत्तिपुत्रकरणं विजयप्रदानं
    सङ्कष्टमोचनविभोः स्तवनं नराणाम् ॥ ९॥ दारिद्र्यदुःखदहनं शमनं विवादे कल्याणसाधनममङ्गलवारणाय । दाम्पत्यदीर्घसुखसर्वमनोरथाप्तिं
    श्रीमारुतेः स्तवशतावृतिरातनोति ॥ १०॥ स्तोत्रं य एतदनुवासरमाप्तकामः श्रीमारुतिं समनुचिन्त्य पठेत् सुधीरः
    । तस्मै प्रसादसुमुखो वरवानरेन्द्रः साक्षात्कृतो भवति शाश्वतिकः सहायः ॥ ११॥ सङ्कष्टमोचनस्तोत्रं शङ्कराचार्यभिक्षुणा
    । महेश्वरेण रचितं मारुतेश्चरणेऽर्पितम् ॥ १२॥ इति काशीपीठाधीश्वर जगद्गुरुशङ्कराचार्यस्वामि श्रीमहेश्वरानन्दसरस्वतीविरचितं
    श्रीसङ्कष्टमोचनस्तोत्रं सम्पूर्णम् ।
