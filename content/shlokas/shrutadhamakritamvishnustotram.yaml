id: shrutadhamakritamvishnustotram
category: stotram
name:
  english: shrutadhamakritamvishnustotram
  devanagari: श्रुतधामाकृतंविष्णुस्तोत्रम्
content:
  english: shrutadhamakritam vishnustotram om namassatyasankalpavikalpollasitatmane | nirgunaya gunavishtakarmane
    brahmane namah || 70|| satyam jnanamanantam yaddhama namadivarjitam | omityupahitakaramahankaramupasmahe
    || 71|| yato vaco nivartante manasaprapya madhavam | hridyantam param pashye bhadrasyavaptaye harim
    || 72|| hrishikam jagatam sakshat shrutayo yat prashamsire | tamadipaurusham tejah prapadye vyomalakshanam
    || 73|| alakshyamakshnam guninam brahmadinam yadaishvaram | mahah prapadye nirmayam yatparam paramam
    harih || 74|| yamanvishya mahastattvamagamantagiram tatih | taddhama kamayaikantakalikalmashanashanam
    || 75|| anoraniyamadyantamadhyaviplavavarjitam | ahamaradhaye citte mayajalavimuktaye || 76|| devadevam
    mahadevam harimabhyudayeshvaram | pashyami paratattvartham nirmuktasheshakalmasham || 77|| bhagavan
    paritushto'smi mayalasyapradarshanat | aho vibhutivistaro lilavaishishyalakshanah || 78|| punati lokan
    gangeva darshanatkirtanadapi | itah param na shocami yenaham tvatprasadatah || 79|| tatha kuru dayam
    mahyam tvamaham sharanam gatah | iti tamraparnimahatmye 61
  devanagari: श्रुतधामाकृतं विष्णुस्तोत्रम् ॐ नमस्सत्यसङ्कल्पविकल्पोल्लासितात्मने । निर्गुणाय गुणाविष्टकर्मणे
    ब्रह्मणे नमः ॥ ७०॥ सत्यं ज्ञानमनन्तं यद्धाम नामादिवर्जितम् । ओमित्युपहिताकारमहङ्कारमुपास्महे ॥ ७१॥
    यतो वाचो निवर्तन्ते मनसाप्राप्य माधवम् । हृद्यन्तं परं पश्ये भद्रस्यावाप्तये हरिम् ॥ ७२॥ हृषीकं जगतां
    साक्षात् श्रुतयो यत् प्रशंसिरे । तमादिपौरुषं तेजः प्रपद्ये व्योमलक्षणम् ॥ ७३॥ अलक्ष्यमक्ष्णां गुणिनां
    ब्रह्मादीनां यदैश्वरम् । महः प्रपद्ये निर्मायं यत्परं परमं हरिः ॥ ७४॥ यमन्विष्य महस्तत्त्वमागमान्तगिरां
    ततिः । तद्धाम कामयैकान्तकलिकल्मषनाशनम् ॥ ७५॥ अणोरणीयमाद्यन्तमध्यविप्लववर्जितम् । अहमाराधये चित्ते
    मायाजालविमुक्तये ॥ ७६॥ देवदेवं महादेवं हरिमभ्युदयेश्वरम् । पश्यामि परतत्त्वार्थं निर्मुक्ताशेषकल्मषम्
    ॥ ७७॥ भगवन् परितुष्टोऽस्मि मायालास्यप्रदर्शनात् । अहो विभूतिविस्तारो लीलावैशिष्यलक्षणः ॥ ७८॥ पुनाति
    लोकान् गङ्गेव दर्शनात्कीर्तनादपि । इतः परं न शोचामि येनाहं त्वत्प्रसादतः ॥ ७९॥ तथा कुरु दयां मह्यं
    त्वामहं शरणं गतः । इति ताम्रपर्णीमाहात्म्ये ६१
