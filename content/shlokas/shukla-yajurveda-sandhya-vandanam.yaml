id: shukla-yajurveda-sandhya-vandanam
category: stotram
name:
  english: Shukla Yajurveda Sandhya Vandanam
content:
  english: katyayana sutranusaram shri gurubhyo namah | harih om || || guru prarthana || om ve~davigraham
    | yajnavalkya njishnum harihara prabhum || jitendriya njitakrodham sadadhyanaparayanam | anandanilayam
    va~nde yogananda munishvaram || eva ndvadasha namani trisandhya yah pathennarah | yogishvara prasadena
    vidyava nbhavet || om shri yajnavalkya gurubhyo namah | kanvakatyayanadi mahar shibhyo namah || gururbrahma
    gururvishnuh gururdevo maheshvarah | gurussaksha tparabrahma tasmai shri gurave namah || gurave sarvalokana
    mbhishaje bhavaroginam | nidhaye sarvavidyana ndakshinamurtaye namah || || manasa snanam || apavitrah
    pavitro va sarvavastha 'pi va | yassmaretpundarikaksham sa bahyabhyantarashshucih || pundarikaksha
    pundarikaksha pundarikakshaya namah || govindeti sadasnana ngovindeti sada japah | govindeti sada
    dhyanam sada govinda kirtanam || || acamanam || om shri krishnaya namah || bhumi prarthana || prithivityasya
    mprithvi tvaya dhrita loka devi tvam vi~shnuna dhrita | tva nkuru casanam | || pranayamam || pranavasya
    parabrahma rishih daivi gayatri chandah | saptanam gayatryushnik anushtup brihati panktih trishtubjagatyashchandamsi
    | tatsaviturityasya vishvamitra rishih gayatri chandah | shiromantrasya prajapati rishih yajushchandah
    | pranayame viniyogah | o ntatsaviturvarenya mbhargo devasya dhimahi | dhiyo yo nah pracodayat ||
    om apo jyoti rasomrita mbrahma bhurbhuvassvarom | || sankalpam || mama upatta samasta duritakshaya
    dvara shriparameshvaramuddishya shriparameshvara prityartham shubhe shobhane muhurte shri mahavishnorajnaya
    pravartamanasya adya brahmanah dvitiya pararthe shvetavaraha kalpe vaivasvata manvantare kaliyuge
    prathamapade jambudvipe bharatavar she bharatakhande merordakshina digbhage shrishailasya nadyoh madhya
    pradeshe mangala grihe asmin vartamana vyavaharika candramanena svasti shri nguna visheshana vishishtayam
    shubhatithau shriman namadheyasya mama dharmapatni sametasya shri parameshvara prityartha mmama shrauta
    smarta nitya karmanushthana yogyata phalasiddhyartha sayam sandhyam upasishye || || marjanamu || gange
    ca yamune krishne godavari sarasvati | narmade sindhu kaveri jale nkuru || apohishtheti tisrinam marjane
    viniyogah | om apo hishtha mayobhuvah | nta na urje dadhatana | mmaheranaya cakshase | yo~ vashshivatamo
    rasah | ntasya bhajayate ha nah | om ushatiriva matarah | ntasma arangamamavah | ya~sya kshayaya jinvatha
    | om apo janayatha ca nah | suryashceti mantrasya upanishadyajnavalkya rishih udaka prashane viniyogah
    | om suryashca ma manyushca manyupatayashca manyukritebhyah | papebhyo rakshantam | yadratrya papamakar
    sham | manasa vaca hastabhyam | padbhyamudarena shishna | ratristadavalumpatu | yatkinca durita mmamamritayonau
    | surye jyotishi juhomi svaha | apah punantviti mantrasya udaka prashane viniyogah | apah punantu
    prithivi mprithivi puta punatu mam | punantu brahmanaspatirbrahmaputa punatu mam || yaducchishtamabho
    nca yadva dushcarita nca pratigrahagm svaha agnishceti mantrasya yajnavalkya upanishadrishih udaka
    prashane viniyogah | agnishca ma manyushca manyupatayashca manyukritebhyah | papebhyo rakshantam |
    yadahna papamakar sham | manasa vaca hastabhyam | padbhyamudarena shishna | ahastadavalumpatu | yatkinca
    durita mmamamritayonau | satye jyotishi juhomi svaha | || punarmarjanam || acamya mbhurbhuvassvah
    | tatsaviturvarenya mbhargo devasya dhimahi | dhiyo yo nah pracodayat || apo hishtha mayobhuvasta
    na urje dadhatana | maheranaya cakshase | yo vashshivatamo rasastasya bhajayate ha nah | ushatiriva
    matarah | tasma arangamamavo yasya kshayaya jinvatha | apo janayatha ca nah | || aghamar shanam ||
    drupada divetyasya mantrasya ndrupada diva muncatu | drupada divenmumucanah | svinna ssnatvi maladiva
    | puta m | apah shundhantu mainasah | shatrukshayartha marjanam || sumitrana ityasya mantrasya shatrukshayarthe
    viniyogah | om sumitra na apa oshadhaya ssantu | durmitrastasmai bhuyasuh | yo 'smandveshti | ya papakshayartha
    marjanam || idamapa ityasya mantrasya duritakshayartha marjane viniyogah | om idamapah pravahata yatki
    mmayi | yadvahamabhidudroha yadva shepa utanritam || || arghyapradanamu || acamya nguna visheshana
    vishishtayam shubhatithau kalatikramanadosha nivrityartha mprayashcittarghya purvaka sayam sandhyanga
    arghyapradana nkarishye || bhurbhuvassvariti mahavyahritinam parameshthi prajapati rishih gayatryushnik
    anushtupchandamsi | tatsaviturityasya arghyapradane viniyogah | o mbhurbhuvassvah | o ntatsaviturvarenyam
    | bhargo devasya dhimahi | dhiyo yo nah pracodayat || shri padmini usha saujna chaya sameta shri suryanarayana
    parabrahmane namah | idamarghyam samarpayami | ushasta ityasya mantrasya prayashcittarghya pradane
    viniyogah | om ushastaccitramabharasmabhyam nca dhamahe || shri padmini usha saujna chaya sameta shri
    suryanarayana parabrahmane namah | idamarghyam samarpayami | o ntatsaviturvarenyam | bhargo devasya
    dhimahi | dhiyo yonah pracodayat || akrishnenetyasya mantrasya prayashcittarghya pradane viniyogah
    || om akrishnena rajasa vartamano niveshayannamrita mmartyanca | hiranyayena savita rathena ''devo
    yatibhuvanani pashyan || shri padmini usha saujna chaya sameta shri suryanarayana parabrahmane namah
    | idamarghyam samarpayami | o ntatsaviturvarenyam | bhargo devasya dhimahi | dhiyo yonah pracodayat
    || aratrityasya mantrasya kashipa bharadvaja duhita rishih prayashcitarghya pradane viniyogah | om
    aratri parthivagm rajah pitura prayi dhamabhih | diva si brihati vitishthasa atvesham va~rtate tamah
    || shri padmini usha saujna chaya sameta shri suryanarayana parabrahmane namah | idamarghyam samarpayami
    | o ntatsaviturvarenyam | bhargo devasya dhimahi | dhiyo yonah pracodayat || || bhupradakshina ||
    asavadita ityasya mantrasya bhu pradakshine viniyoga | asavadityo brahma || || sandhya tarpanam ||
    ssandhya tarpane viniyogah | o mbhuh purushastripyatam om rigvedastripyatam o mmandalastripyatam om
    hiranyagarbharupi tripyatam om atma tripyatam o ngayatri tripyatam om ve~damata tripyatam om sankriti
    tripyatam om sandhya tripyatam o nkumari tripyatam o mbrahmi tripyatam om ushastripyatam o nnirmriji
    tripyatam om sarvarthasiddhikari tripyatam om sarvamantradhipatistripyatam o mbhurbhavassvah purushastripyatam
    madhyahnika sandhya tarpane viniyogah | o mbhuvah purushastripyatam om ya~jurvedastripyatam o mmandalastripyatam
    om rudrarupi tripyatam om anantaratma tripyatam om savitri tripyatam om ve~damata tripyatam om sankriti
    tripyatam om sandhya tripyatam om yu~vati tripyatam om raudri tripyatam om ushastripyatam o nnirmriji
    tripyatam om sarvarthasiddhikari tripyatam om sarvamantradhipatistripyatam o mbhurbhuvassvah purushastripyatam
    vishnurdevata jagati chandah sayam sandhya tarpane viniyogah | ogg svah purushastripyatam om samavedastripyatam
    o mmandalastripyatam om vi~shnurupi tripyatam o mparamatma tripyatam om sarasvati tripyatam om ve~damata
    tripyatam om sankriti tripyatam om sandhya tripyatam om vai~shnavi tripyatam om ushastripyatam o nnirmriji
    tripyatam om sarvarthasiddhikari tripyatam om sarvamantradhipatistripyatam o mbhurbhuvassvah purusha
    stripyatam || suryopasthanamu || udutya mityasyah gayatri chandah | citra suryopasthane viniyogah
    || om udutya va~hanti ketavah| drishe vishvaya suryam || o ndevanamudagadanika ncakshurmitrasya varunasyagneh
    | apradyava prithivi antarikshag surya atma jagadastasthushashca || mmitrasyetyadi caturnam gayatri
    brihatyanushtup dhritayashchandamsi suryopasthane viniyogah | o shani dritovo devasyasanasi dyumna
    ncitra sravastamam || o ndevastva savitodvapatu supanissvajgurissu bahurutashaktya | avyathamana prithivya
    mashadisha aprina || om utthaya brihati bhavo duttishthadhruvatvam | mitraitanta ukha mparidadamyabhitya
    esha mabhedi || om va~savastva chrindantu gayatrena chandasajgirasva drudrastva chrindantu traishtubhena
    chandasajgirasvat | adityastva chrindantu jagatena chandasajgirasva dvishvetva devavaishvanara achrindantvanushtubhena
    chandasajgirasvat || udvayamudityamitidvayo prathamasyanushtupchandah dvitiyasya gayatri chandah suryopasthane
    viniyogah || om udvaya ntamasasparisvah pashyanta uttaram | deva ndevatra surya maganma jyotiruttamam
    || om udutya va~hanti ketavah | drishe vishvaya suryam || o ndevanamudagadanika ncakshurmitrasya varunasyagneh
    | apradyava prithivi antarikshag surya atma jagadastasthushashca || o ntaccakshurdevahita mpurastacchukra
    muccarat | pashyema sharadashshata njivema sharadashshatag shrinuyama sharadashshatam || mme varuna
    tatvayamityanayoshshunashshepha rishih gayatri trishtubhau chandasi suryopasdhane viniyogah || om
    ima mme varuna shrudhihavamadya ca mrilaya | tvamavasyuracake || o ntatvayami brahmana vandamanastadashaste
    yajamano havirbhih | ahelamano varune habodhyurushagm sa ma na ayuh pramoshih || || gayatri || acamya
    || ugrabhutapishacaste ityete bhumi bharakah | bhutanamavirodhena brahma karma samarabhe || purvokta
    eva nguna visheshana vishishtayam shubhatithau yatha shakti pratah sayam sandhyanga gayatri mantra
    japa nkarishye || gayatryavahanam | om ojo 'si balamasi bhrajo ndhamanamasi vishvamasi vishvayu ssarvamasi
    sarvayurabhibhurom | gayatrimavahayami | savitrimavahayami | sarasvatimavahayami | chandar shinavahayami
    | shriyamavahayami || gayatrya gayatri chando vishvamitra rishi ssavita devata agnirmukha mbrahmashirah
    vishnur hridayagm rudrashshikha prithivi yonih pranapanavyanodana samanassaprana shshvetavarna sankhyayana
    sagotra gayatri caturvig mshatyakshara tripada shatkukshih pancashir shopanayane viniyogah || ayatvityanuvakasya
    gayatryavahane viniyogah || om ayatu varada devi akshara mbrahma sammitam | gayatri mbrahma jushasva
    nah | tejo gayatryavahane viniyogah || o 'si shukramamritamayushpa ayurmepahi | devasyatva savituh
    prasave 'shvinorbahubhya mpushno hastabhyamadadhe || prarthana || gayatryasyekapadi dvipadi tripadi
    catushpadya padasi na hi padyase | namaste turiyaya dar shataya padaya parorajasesavado ma prapat
    | avahaniyagnirupasthana pratassavane rigvede viniyogah | madhyahnika savane yajurvede viniyogah |
    dakshinagnirupasthana sayamsavane samavede viniyogah | agaccha varade devi jape me sannidhau bhava
    | gayanta ntrayase yasmadgayatri tvamudahrita || nyasam || o mbhuvariti janghayoh | ogg m svariti
    janvoh | o ntapa iti mukhe | ogg m satyamiti shirasi | o ntatsaviturvarenyam anamikabhya mbhargo devasya
    dhimahi kanishthikabhya ndhiyo yo nah pracodaya mbhuh hridayaya namah | o shshirase svaha | ogm sva
    mbhargo devasya dhimahi netratrayaya vaushat | o ndhiyo yo nah pracodayat astraya phat | o mbhurbhavassvaromiti
    digbandhah | gayatri dhyanam || muktavidrumahemaniladhavala cchayairmukhaistrikshanaih | yuktamindunibaddharatnamakuta
    ntattvartha varnatmikam || gayatrim 'ravindayugalam hastairvahanti mbhaje || lamityadi pancapuja ||
    la mprithivitattvatmikayai gayatri devatayai namah | gandha mparikalpayami || ham akashatattvatmikayai
    gayatri devatayai namah | pushpa va~yutattvatmikayai gayatri devatayai namah | dhupa va~hnitattvatmikayai
    gayatri devatayai namah | dipa mparikalpayami || vam amritatattvatmikayai gayatri devatayai namah
    | naivedya mparikalpayami || sam sarvatattvatmikayai gayatri devatayainamah | sarvopacara nparikalpayami||
    pranavasya parabrahma rishih daivi gayatri chandah | bhurbhuvassvariti mahavyahritina mparameshthi
    prajapati rishih gayatryushniganushtu pchandamsi | gayatrya vishvamitra rishih gayatri chandah | gayatri
    mudralu || sumukham samputa ncaiva vyapikanjalika nca grathitam sammukhonmukham || pralamba ncaiva
    matsyah kurmo varahakam | simhakranta ntatha || gayatri mantram || o mbhurbhuvassvah | tatsaviturvarenya
    mbhargo devasya dhimahi | dhiyo yo nah pracodayat || || mantra japavasanam || purvokta eva nguna visheshana
    vishishtayam shubha tithau gayatri japopasamhara nkarishye | asya shri gayatri mahamantrasya mama
    japopasamhare viniyogah | o mbhuvariti janghayoh | ogg m svariti janvoh | o ntapa iti mukhe | ogg
    m satyamiti shirasi | o ntatsaviturvarenyam anamikabhya mbhargo devasya dhimahi kanishthikabhya ndhiyo
    yo nah pracodaya mbhuh hridayaya namah | o shshirase svaha | ogm sva mbhargo devasya dhimahi netratrayaya
    vaushat | o ndhiyo yo nah pracodayat astraya phat | bhurbhuvassvaromiti digvimokah | uttara mudralu
    || surabhih jnana cakre ca yonih kurmo nniryana mudra cetyashtamudrah prakirtitah | || gayatri tarpanam
    || purvokta eva nguna visheshana vishishthayam shubha tithau savitripriti yogaya gayatri tarpanamaha
    nkarishye | rishirvyasa ssamuddishto brahmadaiva tamucyate | chando gayatraka ncaiva viniyogastu tarpane
    || o mbhuh purusha rigvedastripyatam o mbhuvah purusha yajurvedastripyatam ogg m svah purusha samavedastripyatam
    o mmahah purusha atharvanavedastripyatam o njanah purusha itihasapuranastripyatam o ntapah purusha
    sarvagamastripyatam om satya mpurusha satyalokastripyatam o ssvah purusha mandalantargatastripyatam
    o mbhurekapada gayatri tripyatam o mbhuvah dvipada gayatri tripyatam og m svah tripada gayatri tripyatam
    o shcatushpada gayatri tripyatam om ushastripyatam o ngayatri tripyatam om savitri tripyatam om sarasvati
    tripyatam om ve~damata tripyatam o mprithivi tripyatam o nkaushiki tripyatam om sankriti tripyatam
    om sarvaparajita tripyatam om sahasramurtistripyatam om anandamurtistripyatam | || dinnamaskarah ||
    o mpracyai dishe namah | indraya namah | om agneyai dishe namah | agnaye namah | o ndakshinayai dishe
    namah | yamaya namah | o rityai dishe namah | nir mpraticyai dishe namah | varunaya namah | om va~yuvyai
    dishe namah | vayave namah | om udicyai dishe namah | kuberaya namah | om ishanyai dishe namah | ishvaraya
    namah | om urdhvayai dishe namah | brahmane namah | om adharayai dishe namah | anantaya namah | om
    sandhyayai namah o ngayatryai namah om savitryai namah om sarasvatyai namah om sarvebhyo devatabhyo
    namah o ndevebhyo namah | om rishibhyo namah o nnamo namah iti | || udvasanam || uttametyanuvakasya
    udvasane viniyogah || om uttame shikhare devi bhumya mparvatamurdhani | brahmanebhyo 'bhyanujnata
    gaccha devi yatha sukham || ||japa nivedanam || deva gatu vida ityasya mantrasya japanivedane viniyogah||
    o ndevagatu vidogatu mitvagatu mita | manasaspata ima ndeva yajnagg svaha vatethah || pratassandhyanga
    bhutena gayatryastu japena ca | sa 'shtena shata sankhyena brahma me priyatam ravih || madhyahna sandhyangatvena
    gayatrya japitena ca | yatha sankhyena japena rudro me priyatam ravih || sayam sandhyanga bhutena
    gayatryastu japena ca | sa 'shtena shata sankhyena brahma me priyatam ravih || || pravara || pravaralu
    cu shshukla yajurvedantargata kanva shakhadhyayi katyayana sutrah mbho abhivadaye || samarpanam |
    asatyalokatpatala dalokalokaparvatat | ye santi brahmanadevastebhyo nitya nnamo namah || vishnupatnisamudbhute
    shankhavarne mahitale | anekaratnasampanne bhumidevi namo 'stu te || samudravasane devi parvatastanamandale
    | vishnupatni namastubhya
  devanagari: कात्यायन सूत्रानुसारम् श्री गुरुभ्यो नमः । हरिः ओम् ॥ ॥ गुरु प्रार्थन ॥ ॐ वेँदविग्रहम् ।
    याज्ञवल्क्य ञ्जिष्णुं हरिहर प्रभुम् ॥ जितेन्द्रिय ञ्जितक्रोधं सदाध्यानपरायणम् । आनन्दनिलयं वँन्दे
    योगानन्द मुनीश्वरम् ॥ एव न्द्वादश नामानि त्रिसन्ध्या यः पठेन्नरः । योगीश्वर प्रसादेन विद्यावा न्भवेत्
    ॥ ॐ श्री याज्ञवल्क्य गुरुभ्यो नमः । कण्वकात्यायनादि महर् षिभ्यो नमः ॥ गुरुर्ब्रह्म गुरुर्विष्णुः गुरुर्देवो
    महेश्वरः । गुरुस्साक्षा त्परब्रह्म तस्मै श्री गुरवे नमः ॥ गुरवे सर्वलोकाना म्भिषजे भवरोगिणाम् । निधये
    सर्वविद्याना न्दक्षिणामूर्तये नमः ॥ ॥ मानस स्नानम् ॥ अपवित्रः पवित्रो वा सर्वावस्था ऽपि वा । यस्स्मरेत्पुण्डरीकाक्षं
    स बाह्याभ्यन्तरश्शुचिः ॥ पुण्डरीकाक्ष पुण्डरीकाक्ष पुण्डरीकाक्षाय नमः ॥ गोविन्देति सदास्नान ङ्गोविन्देति
    सदा जपः । गोविन्देति सदा ध्यानं सदा गोविन्द कीर्तनम् ॥ ॥ आचमनम् ॥ ॐ श्री कृष्णाय नमः ॥ भूमि प्रार्थन
    ॥ पृथिवीत्यस्य म्पृथ्वी त्वया धृता लोका देवि त्वं विँष्णुना धृता । त्व ङ्कुरु चासनम् । ॥ प्राणायामम्
    ॥ प्रणवस्य परब्रह्म ऋषिः दैवी गायत्री छन्दः । सप्तानां गायत्र्युष्णिक् अनुष्टुप् बृहती पङ्क्तिः त्रिष्टुब्जगत्यश्छन्दांसि
    । तत्सवितुरित्यस्य विश्वामित्र ऋषिः गायत्री छन्दः । शिरोमन्त्रस्य प्रजापति ऋषिः यजुश्छन्दः । प्राणायामे
    विनियोगः । ओ न्तत्स॑वि॒तुर्वरे॑ण्य॒ म्भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो नः॑ प्रचो॒दया॑त् ॥ ॐ आपो॒ ज्योती॒
    रसो॒मृत॒ म्ब्रह्म॒ भूर्भुव॒स्स्व॒रोम् । ॥ सङ्कल्पम् ॥ मम उपात्त समस्त दुरितक्षय द्वारा श्रीपरमेश्वरमुद्दिश्य
    श्रीपरमेश्वर प्रीत्यर्थं शुभे शोभने मुहूर्ते श्री महाविष्णोराज्ञया प्रवर्तमानस्य अद्य ब्रह्मणः द्वितीय
    परार्थे श्वेतवराह कल्पे वैवस्वत मन्वन्तरे कलियुगे प्रथमपादे जम्बूद्वीपे भारतवर् षे भरतखण्डे मेरोर्दक्षिण
