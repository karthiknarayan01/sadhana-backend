id: muktipurasthadevistotram
category: stotram
name:
  english: muktipurasthadevistotram
  devanagari: मुक्तिपुरस्थदेवीस्तोत्रम्
content:
  english: rinavanyaham vihatum nikhilartim lasitangi muktigehe || 32|| natamohatamopahe nijanam hitade
    he hatadevavairidehe | atishobhitagatri muktigehe sadayam mamavalokayanuvelam || 33|| cikuradipadantamamba
    cetomukurantah satatam didrikshumanam | agarajasute shive tvamapannikaranmamava muktigehasamsthe ||
    34|| manmatharidayite dayanidhe sanmanahkumudavrindacandrika | kalmashavalimume harashu me cinmayi
    tvamayi muktigehage || 35|| mukti mandiragate tmaje bhaktalokakamaniyavigrahe | muktidayini bhavani
    dehi me bhaktimeva tatra padapadmayoh || 36|| mrityutapaharanamritam nrinamatyudaramayi te padambujam
    | nrityatadiha madiyamanase nityada janani muktigehage || 37|| bhuvanamangaladipasamujjvale bhavavashanaladagdhamamam
    janam | tava kripamritavrishtibhiranjasa bhavati jivaya muktipurasthite || 38|| gadasamuhamapohitamamba
    ta padasarojarajonicaya muda | vitara muktiniketagate javaditaradadya na me sharanam shive || 39||
    duritavaridhisantaranaya te caritakirtanapotamupashritam | sphuritamuktiniketanasangate tvaritamenamume
    paripahi mam || 40|| malayajalasitam shubhadam tvisham nilayamamba tavananapankajam | sulalitam niyatam
    hridi bhavaye vilasite varamuktiniketane || 41|| janimrityuvinashini padajusham munisattamasannutasaccarite
    | manasah sthitirastu mamaviratam janani tvayi muktiniketagate || 42|| urarikritabhaktajane shivada
    girirajasute mama gari shive kuru rogavinashanamashu shive gururagini muktiniketagate || 43|| varamalyasamujjvalamuktipure
    suramanavamanitapadayuge | haramanasamanasamadhihare hara mamakamamayamashu shive || 44|| ibhagamini
    kamini kamaripoh shubhadayini danavanashini mam | paripahi kripamritavarinidhe parameshvari muktiniketagate
    || 45|| udararupe hitadanashile padaravinde paracinmaye te | muda ramenankadharanurakte sada rame
    muktipuradhinathe || 46|| saragayoste padayormahajana niragasah santi paragasevaya | sarogamenam paripahi
    mam shive suragavanmuktipure virajite || 47|| sukhavaham nityamaghapaham shubham mukhambujam devi
    padambujanca te | sukheshu duhkheshu madiyamanase cakastu muktisthalasamsthite shive || 48|| prasida
    vishveshi rameshamaye prasida shashvat parameshajaye | prasida bhaktapriyadanashile prasida muktisthalavasalole
    || 49|| namo'stu karunyapayonidhe te namo'stu tarunyamanohare te | namo'stu mrityunjayavallabhe te
    namo'stu muktisthalasangate te || 50|| namo namah parvatakanyakayai namo namah sharvavarapriyayai
    | namo namo muktisukhapradayai namo namo muktipurasthitayai || 51|| matah stavam pathati mangaladam
    ya etam pratah prabuddhaya bhavatimanucintya nityam | pritah sa muktipuravasini bhaktiyukto yati kshanena
    tava padasarojameva || 52||
  devanagari: ृणवान्यहं विहातुं निखिलार्तिं लसिताङ्गि मुक्तिगेहे ॥ ३२॥ नतमोहतमोपहे निजानां हितदे हे हतदेववैरिदेहे
    । अतिशोभितगात्रि मुक्तिगेहे सदयं मामवलोकयानुवेलम् ॥ ३३॥ चिकुरादिपदान्तमम्ब चेतोमुकुरान्तः सततं दिदृक्षुमनम्
    । अगराजसुते शिवे त्वमापन्निकरान्मामव मुक्तिगेहसंस्थे ॥ ३४॥ मन्मथारिदयिते दयानिधे सन्मनःकुमुदवृन्दचन्द्रिका
    । कल्मषावलिमुमे हराशु मे चिन्मयि त्वमयि मुक्तिगेहगे ॥ ३५॥ मुक्ति मन्दिरगते त्मजे भक्तलोककमनीयविग्रहे
    । मुक्तिदायिनि भवानि देहि मे भक्तिमेव तत्र पादपद्मयोः ॥ ३६॥ मृत्युतापहरणामृतं नृणामत्युदारमयि ते पदाम्बुजम्
    । नृत्यतादिह मदीयमानसे नित्यदा जननि मुक्तिगेहगे ॥ ३७॥ भुवनमङ्गलदीपसमुज्ज्वले भवावषानलदग्धाममं जनम्
    । तव कृपामृतवृष्टिभिरञ्जसा भवति जीवय मुक्तिपुरस्थिते ॥ ३८॥ गदसमूहमपोहितमम्ब त पदसरोजरजोनिचय मुदा ।
    वितर मुक्तिनिकेतगते जवादितरदद्य न मे शरणं शिवे ॥ ३९॥ दुरितवारिधिसन्तरणाय ते चरितकीर्तनपोतमुपाश्रितम्
    । स्फुरितमुक्तिनिकेतनसङ्गते त्वरितमेनमुमे परिपाहि माम् ॥ ४०॥ मलयजालसितं शुभदं त्विषां निलयमम्ब तवाननपङ्कजम्
    । सुललितं नियतं हृदि भावये विलसिते वरमुक्तिनिकेतने ॥ ४१॥ जनिमृत्युविनाशिनि पादजुषां मुनिसत्तमसन्नुतसच्चरिते
    । मनसः स्थितिरस्तु ममाविरतं जननि त्वयि मुक्तिनिकेतगते ॥ ४२॥ उररीकृतभक्तजने शिवद गिरिराजसुते मम गारि
    शिवे कुरु रोगविनाशनमाशु शिवे गुरुरागिणि मुक्तिनिकेतगते ॥ ४३॥ वरमाल्यसमुज्ज्वलमुक्तिपुरे सुरमानवमानितपादयुगे
    । हरमानसमानसमाधिहरे हर मामकमामयमाशु शिवे ॥ ४४॥ इभगामिनि कामिनि कामरिपोः शुभदायिनि दानवनाशिनि माम्
    । परिपाहि कृपामृतवारिनिधे परमेश्वरि मुक्तिनिकेतगते ॥ ४५॥ उदाररूपे हितदानशीले पदारविन्दे परचिन्मये
    ते । मुदा रमेणाङ्कधरानुरक्ते सदा रमे मुक्तिपुराधिनाथे ॥ ४६॥ सरागयोस्ते पदयोर्महाजना निरागसः सन्ति
    परागसेवया । सरोगमेनं परिपाहि मां शिवे सुरागवन्मुक्तिपुरे विराजिते ॥ ४७॥ सुखावहं नित्यमघापहं शुभं मुखाम्बुजं
    देवि पदाम्बुजञ्च ते । सुखेषु दुःखेषु मदीयमानसे चकास्तु मुक्तिस्थलसंस्थिते शिवे ॥ ४८॥ प्रसीद विश्वेशि
    रमेशमाये प्रसीद शश्वत् परमेशजाये । प्रसीद भक्तप्रियदानशीले प्रसीद मुक्तिस्थलवासलोले ॥ ४९॥ नमोऽस्तु
    कारुण्यपयोनिधे ते नमोऽस्तु तारुण्यमनोहरे ते । नमोऽस्तु मृत्युञ्जयवल्लभे ते नमोऽस्तु मुक्तिस्थलसङ्गते
    ते ॥ ५०॥ नमो नमः पर्वतकन्यकायै नमो नमः शर्ववरप्रियायै । नमो नमो मुक्तिसुखप्रदायै नमो नमो मुक्तिपुरस्थितायै
    ॥ ५१॥ मातः स्तवं पठति मङ्गलदं य एतं प्रातः प्रबुद्धय भवतीमनुचिन्त्य नित्यम् । प्रीतः स मुक्तिपुरवासिनि
    भक्तियुक्तो याति क्षणेन तव पादसरोजमेव ॥ ५२॥
