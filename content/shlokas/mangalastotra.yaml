id: mangalastotra
category: stotram
name:
  english: mangalastotra
  devanagari: मन्गलस्तोत्र
content:
  english: rinamocakamangalastotram shriganeshaya namah|| mangalo bhumiputrashca rinaharta dhanapradah
    | sthirasano mahakayah sarvakarmavirodhakah || 1|| lohito lohitakshashca samaganam kripakarah | dharatmajah
    kujo bhaumo bhutido bhuminandanah || 2|| angarako yamashcaiva sarvarogapaharakah | vrishteh karta'paharta
    ca sarvakamaphalapradah || 3|| etani kujanamani nityam yah shraddhaya pathet | rinam na jayate tasya
    dhanam shighramavapnuyat || 4|| dharanigarbhasambhutam vidyutkantisamaprabham | kumaram shaktihastam
    ca mangalam pranamamyaham || 5|| stotramangarakasyaitatpathaniyam sada nribhih | na tesham bhaumaja
    pida svalpapi bhavati kvacit || 6|| angaraka mahabhaga bhagavanbhaktavatsala | tvam namami mamasheshamrinamashu
    vinashaya || 7|| rinarogadidaridryam ye canye hyapamrityavah | bhayakleshamanastapa nashyantu mama
    sarvada || 8|| ativakra duraradhya bhogamukta jitatmanah | tushto dadasi samrajyam rushto harasi tatkshanat
    || 9|| virincishakravishnunam manushyanam tu ka katha | tena tvam sarvasattvena graharajo mahabalah
    || 10|| putrandehi dhanam dehi tvamasmi sharanam gatah | rinadaridryaduhkhena shatrunam ca bhayattatah
    || 11|| ebhirdvadashabhih shlokairyah stauti ca dharasutam | mahatim shriyamapnoti hyaparo dhanado
    yuva || 12|| iti shriskandapurane bhargavaproktam rinamocakamangalastotram sampurnam |
  devanagari: ऋणमोचकमङ्गलस्तोत्रम् श्रीगणेशाय नमः॥ मङ्गलो भूमिपुत्रश्च ऋणहर्ता धनप्रदः । स्थिरासनो महाकायः
    सर्वकर्माविरोधकः ॥ १॥ लोहितो लोहिताक्षश्च सामगानां कृपाकरः । धरात्मजः कुजो भौमो भूतिदो भूमिनन्दनः
    ॥ २॥ अङ्गारको यमश्चैव सर्वरोगापहारकः । वृष्टेः कर्ताऽपहर्ता च सर्वकामफलप्रदः ॥ ३॥ एतानि कुजनामानि
    नित्यं यः श्रद्धया पठेत् । ऋणं न जायते तस्य धनं शीघ्रमवाप्नुयात् ॥ ४॥ धरणीगर्भसम्भूतं विद्युत्कान्तिसमप्रभम्
    । कुमारं शक्तिहस्तं च मङ्गलं प्रणमाम्यहम् ॥ ५॥ स्तोत्रमङ्गारकस्यैतत्पठनीयं सदा नृभिः । न तेषां भौमजा
    पीडा स्वल्पापि भवति क्वचित् ॥ ६॥ अङ्गारक महाभाग भगवन्भक्तवत्सल । त्वां नमामि ममाशेषमृणमाशु विनाशय
    ॥ ७॥ ऋणरोगादिदारिद्र्यं ये चान्ये ह्यपमृत्यवः । भयक्लेशमनस्तापा नश्यन्तु मम सर्वदा ॥ ८॥ अतिवक्र दुराराध्य
    भोगमुक्त जितात्मनः । तुष्टो ददासि साम्राज्यं रुष्टो हरसि तत्क्षणात् ॥ ९॥ विरिञ्चिशक्रविष्णूनां मनुष्याणां
    तु का कथा । तेन त्वं सर्वसत्त्वेन ग्रहराजो महाबलः ॥ १०॥ पुत्रान्देहि धनं देहि त्वामस्मि शरणं गतः ।
    ऋणदारिद्र्यदुःखेन शत्रूणां च भयात्ततः ॥ ११॥ एभिर्द्वादशभिः श्लोकैर्यः स्तौति च धरासुतम् । महतीं श्रियमाप्नोति
    ह्यपरो धनदो युवा ॥ १२॥ इति श्रीस्कन्दपुराणे भार्गवप्रोक्तं ऋणमोचकमङ्गलस्तोत्रं सम्पूर्णम् ।
