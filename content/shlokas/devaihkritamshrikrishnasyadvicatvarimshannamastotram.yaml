id: devaihkritamshrikrishnasyadvicatvarimshannamastotram
category: stotram
name:
  english: devaihkritamshrikrishnasyadvicatvarimshannamastotram
  devanagari: देवैःकृतंश्रीकृष्णस्यद्विचत्वारिंशन्नामस्तोत्रम्
content:
  english: devaih kritam shrikrishnasya dvicatvarimshannamastotram deva ucuh | jagadyonirayonistvamananto'vyaya
    eva ca | jyotihsvarupo hyanaghah saguno nirguno mahan || 54|| bhaktanurodhatsakaro nirakaro nirankushah
    | nirvyuho nikhiladharo nihshanko nirupadravah || 55|| nirupadhishca nirlipto niriho nidhanantakah
    | svatmaramah purnakamo'nimisho nitya eva ca || 56|| svecchamayah sarvahetuh sarvah sarvagunashrayah
    | sukhado duhkhado durgo durjanantaka eva ca || 57|| subhago durbhago vagmi duraradhyo duratyayah
    | vedahetushca vedashca vedango vedavidvibhuh || 58|| ityevamuktva devashca pranemushca muhurmuhuh
    | harshashrulocanah sarve vavrishuh kusumani ca || 59|| dvicatvarimshannamani pratarutthaya yah pathet
    | dridham bhaktim harerdasyam labhate vanchitam phalam || 7
  devanagari: देवैः कृतं श्रीकृष्णस्य द्विचत्वारिंशन्नामस्तोत्रम् देवा ऊचुः । जगद्योनिरयोनिस्त्वमनन्तोऽव्यय
    एव च । ज्योतिःस्वरूपो ह्यनघः सगुणो निर्गुणो महान् ॥ ५४॥ भक्तानुरोधात्साकारो निराकारो निरङ्कुशः । निर्व्यूहो
    निखिलाधारो निःशङ्को निरुपद्रवः ॥ ५५॥ निरुपाधिश्च निर्लिप्तो निरीहो निधनान्तकः । स्वात्मारामः पूर्णकामोऽनिमिषो
    नित्य एव च ॥ ५६॥ स्वेच्छामयः सर्वहेतुः सर्वः सर्वगुणाश्रयः । सुखदो दुःखदो दुर्गो दुर्जनान्तक एव च
    ॥ ५७॥ सुभगो दुर्भगो वाग्मी दुराराध्यो दुरत्ययः । वेदहेतुश्च वेदाश्च वेदाङ्गो वेदविद्विभुः ॥ ५८॥ इत्येवमुक्त्वा
    देवाश्च प्रणेमुश्च मुहुर्मुहुः । हर्षाश्रुलोचनाः सर्वे ववृषुः कुसुमानि च ॥ ५९॥ द्विचत्वारिंशन्नामानि
    प्रातरुत्थाय यः पठेत् । दृढां भक्तिं हरेर्दास्यं लभते वाञ्छितं फलम् ॥ ७
meaning: {}
