id: narasimhavatikavarnanam
category: stotram
name:
  english: narasimhavatikavarnanam
  devanagari: नरसिंहवाटिकावर्णनम्
content:
  english: lalanamandalakramanamanda manda iva sthita ata evaikaikagrahamanditam grahamandalam sphitabhyasuyam
    svasthamapyasvasthamivalakshyate || 16|| sarthako nakaloko'yam nakavartah parasya tu | nakasamjnaiva
    yatraste spardhasuyatyayadikam || 17|| yatra smarasmeranarah sura iva pritah sthitah sevitakamitamritah
    || sangitayukte sudhiyah svaya striyah sadhvyo'pi sacchilajitamritanganah || yatrayamatma sukhasaccidatma
    sandrishyate'ja shatasuryatejah | sattvapradhane hridi savadhane brahmeva bhikshoh shrutibhistitikshoh
    || 19|| devo'marah sahasrakshah parito nirjarairvritah | trilokarcitapadabjo maghavevaparo'styayam
    || 20|| dharmarajo dandadharah samavarti yameshvarah | sarvada jnatadevatma jayatyatraparo yamah ||
    21|| pashyansatyanrite karmayantritanam nrinam sphutam | narayano'yam jayati praceta iva patradhrik
    || 22|| manushyadharma devo'pi shridah punyajaneshvarah | rajarajo jayatyatra naravaha ivaparah ||
    23|| malakamandaludharo vibhurvedaparayanah | sadanando gatacchando brahmevatra tapasthitah || 24||
    narayana ivasheshasetuheturayam harih | vishvarupo hatakhalah sada bhaktamatanugah || 25|| mrityunjayo'mritamayah
    shankarastripurantakah | sarvajno jitakamo'yam vashi shambhurivaparah || 26|| srishtvatmedam pravishyantarmayaya
    kridatiha sah | padabhyameva pati svanprajnanabrahmavacakah || 27|| padapatvam svarthasiddhyai drumanamitare
    viduh | padapatvam svarthasiddhyai satpaternetare viduh || 28||
  devanagari: ललनामण्डलाक्रमणमन्दा मन्दा इव स्थिता अत एवैकैकग्रहमण्डितं ग्रहमण्डलं स्फीताभ्यसूयं स्वस्थमप्यस्वस्थमिवालक्ष्यते
    ॥ १६॥ सार्थको नाकलोकोऽयं नाकवार्तः परस्य तु । नाकसंज्ञैव यत्रास्ते स्पर्धासूयात्ययादिकम् ॥ १७॥ यत्र
    स्मरस्मेरनराः सुरा इव प्रीताः स्थिताः सेवितकामितामृताः ॥ सङ्गीतयुक्ते सुधियः स्वया स्त्रियः साध्व्योऽपि
    सच्छीलजितामृताङ्गनाः ॥ यत्रायमात्मा सुखसच्चिदात्मा सन्दृश्यतेऽज शतसूर्यतेजाः । सत्त्वप्रधाने हृदि
    सावधाने ब्रह्मेव भिक्षोः श्रुतिभिस्तितिक्षोः ॥ १९॥ देवोऽमरः सहस्राक्षः परितो निर्जरैर्वृतः । त्रिलोकार्चितपादाब्जो
    मघवेवापरोऽस्त्ययम् ॥ २०॥ धर्मराजो दण्डधरः समवर्ती यमेश्वरः । सर्वदा ज्ञातदेवात्मा जयत्यत्रापरो यमः
    ॥ २१॥ पश्यन्सत्यानृते कर्मयन्त्रितानां नृणां स्फुटम् । नारायणोऽयं जयति प्रचेता इव पात्रधृक् ॥ २२॥
    मनुष्यधर्मा देवोऽपि श्रीदः पुण्यजनेश्वरः । राजराजो जयत्यत्र नरवाह इवापरः ॥ २३॥ मालाकमण्डलुधरो विभुर्वेदपरायणः
    । सदानन्दो गतच्छन्दो ब्रह्मेवात्र तपस्थितः ॥ २४॥ नारायण इवाशेषसेतुहेतुरयं हरिः । विश्वरूपो हतखलः सदा
    भक्तमतानुगः ॥ २५॥ मृत्युञ्जयोऽमृतमयः शङ्करस्त्रिपुरान्तकः । सर्वज्ञो जितकामोऽयं वशी शम्भुरिवापरः ॥
    २६॥ सृष्ट्वात्मेदं प्रविश्यान्तर्मायया क्रीडतीह सः । पदाभ्यामेव पाति स्वान्प्रज्ञानब्रह्मवाचकः ॥ २७॥
    पादपत्वं स्वार्थसिद्ध्यै द्रुमाणामितरे विदुः । पादपत्वं स्वर्थसिद्ध्यै सत्पतेर्नेतरे विदुः ॥ २८॥
