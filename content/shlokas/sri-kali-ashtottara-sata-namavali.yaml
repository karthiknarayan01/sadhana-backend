    namah | om kaminyai namah | | om kamaniyasvabhavinyai namah | om kulinayai namah | om kulakartryai
    namah | om kulavartmaprakashinyai namah | om kasturirasanilayai namah | om kamyayai namah | om kamasvarupinyai
    namah | om kakaravarnanilayayai namah | om kamadhenave namah | om karalikayai namah | | om kulakantayai
    namah | om karalasyayai namah | om kamartayai namah | om kalavatyai namah | om krishodaryai namah
    | om kamakhyayai namah | om kaumaryai namah | om kulapalinyai namah | om kulajayai namah | om kulakanyayai
    namah | | om kulahayai namah | om kulapujitayai namah | om kameshvaryai namah | om kamakantayai namah
