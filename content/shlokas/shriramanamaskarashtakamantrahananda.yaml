id: shriramanamaskarashtakamantrahananda
category: mantra
name:
  english: shriramanamaskarashtakamantrahananda
  devanagari: श्रीरामनमस्काराष्टकमन्त्राःआनन्द
content:
  english: shrirama namaskarashtakamantrah om namo bhagavate shriramaya paramatmane | sarvabhutantarasthaya
    sasitaya namo namah || 1|| om namo bhagavate shrirama ramacandraya vedhase | sarvavedantavedyaya sasitaya
    namo namah || 2|| om namo bhagavate shrivishnave paramatmane | paratparaya ramaya sasitaya namo namah
    || 3|| om namo bhagavate shriraghunathaya sharngine | cinmayanandarupaya sasitaya namo namah || 4||
    om namo bhagavate shrirama shrikrishnaya cakrine | vishuddhajnanadehaya sasitaya namo namah || 5||
    om namo bhagavate shrivasudevaya vishnave | purnanandaikarupaya sasitaya namo namah || 6|| om namo
    bhagavate shrirama ramabhadraya vedhase | sarvalokasharanyaya sasitaya namo namah || 7|| om namo bhagavate
    shriramayamitatejase | brahmanandaikarupaya sasitaya namo namah || 8|| iti shriananrashrirama namaskarashtakamantrah
    |
  devanagari: श्रीराम नमस्काराष्टकमन्त्राः ॐ नमो भगवते श्रीरामाय परमात्मने । सर्वभूतान्तरस्थाय ससीताय
    नमो नमः ॥ १॥ ॐ नमो भगवते श्रीराम रामचन्द्राय वेधसे । सर्ववेदान्तवेद्याय ससीताय नमो नमः ॥ २॥ ॐ नमो
    भगवते श्रीविष्णवे परमात्मने । परात्पराय रामाय ससीताय नमो नमः ॥ ३॥ ॐ नमो भगवते श्रीरघुनाथाय शार्ङ्गिणे
    । चिन्मयानन्दरूपाय ससीताय नमो नमः ॥ ४॥ ॐ नमो भगवते श्रीराम श्रीकृष्णाय चक्रिणे । विशुद्धज्ञानदेहाय
    ससीताय नमो नमः ॥ ५॥ ॐ नमो भगवते श्रीवासुदेवाय विष्णवे । पूर्णानन्दैकरूपाय ससीताय नमो नमः ॥ ६॥ ॐ नमो
    भगवते श्रीराम रामभद्राय वेधसे । सर्वलोकशरण्याय ससीताय नमो नमः ॥ ७॥ ॐ नमो भगवते श्रीरामायामिततेजसे
    । ब्रह्मानन्दैकरूपाय ससीताय नमो नमः ॥ ८॥ इति श्रीआनन्रश्रीराम नमस्काराष्टकमन्त्राः ।
