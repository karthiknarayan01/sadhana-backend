id: vishnu-stuti-kardama-rishi-kruta
category: stotram
name:
  english: Vishnu Stuti (Kardama Rishi Kruta)
content:
  english: rishiruvaca | jushtam batadyakhilasattvarasheh samsidahdhyamakshnostava darshanannah | yaddarshanam
    janmabhiridya sadbhi rashasate yogino rudhayogah || || ye mayaya te hatamedhasastva tpadaravindam
    bhavasindhupotam | upasate kamalavaya tesham rasisha kamanniraye'pi ye syuh || || tatha sa caham parivodhukamah
    samanashilam grihamedhadhenum | upeyivan mulamasheshamulam durashayah kamadughanghripasya || || prajapateste
    vacasadhisha tantya lokah kilayam kamahato'nubaddhah | aham ca lokanugato vahami balim ca shuklanimishaya
    tubhyam || || lokamshca lokanugatan pashumshca hitva shritaste caranatapatram | parasparam tvadgunavadasidhu
    piyushaniryapitadehadharmah || || na te'jarakshabhramirayuresham trayodasharam trishatam shashtiparva
    | shannemyanantacchadi yattrinabhi karalasroto jagadacchidya dhavat || || ekah svayam san jagatah
    sisrikshaya dvitiyaya'tmannadhiyogamayaya | srijasyadah pasi punargrasishyase yathornanabhirbhagavan
    svashaktibhih || || naitadbatadhisha padam tavepsitam yanmayaya nastanushe bhutasukshmam | anugrahayastvapi
    yarhi mayaya lasattulasya tanuva vilakshitah || || tam tvanubhutyoparatakriyartham svamayaya vartitalokatantram
    | namamyabhikshnam namaniyapada sarojamalpiyasi kamavarsham || || iti shrimadbhagavatamahapurane tritiyaskandhe
    ekavimshadhyayantargatam kardamarshikritam vishnustotram samaptam | bhagavatapurana
  devanagari: ऋषिरुवाच । जुष्टं बताद्याखिलसत्त्वराशेः सांसिदःध्यमक्ष्णोस्तव दर्शनान्नः । यद्दर्शनं जन्मभिरीड्य
    सद्भि राशासते योगिनो रूढयोगाः ॥ ॥ ये मायया ते हतमेधसस्त्व त्पादारविन्दं भवसिन्धुपोतम् । उपासते कामलवाय
    तेषां रासीश कामान्निरयेऽपि ये स्युः ॥ ॥ तथा स चाहं परिवोढुकामः समानशीलां गृहमेधधेनुम् । उपेयिवान्
    मूलमशेषमूलं दुराशयः कामदुघाङ्घ्रिपस्य ॥ ॥ प्रजापतेस्ते वचसाधीश तन्त्या लोकः किलायं कामहतोऽनुबद्धः
    । अहं च लोकानुगतो वहामि बलिं च शुक्लानिमिषाय तुभ्यम् ॥ ॥ लोकांश्च लोकानुगतान् पशूंश्च हित्वा श्रितास्ते
    चरणातपत्रम् । परस्परं त्वद्गुणवादसीधु पीयूषनिर्यापितदेहधर्माः ॥ ॥ न तेऽजराक्षभ्रमिरायुरेषां त्रयोदशारं
    त्रिशतं षष्टिपर्व । षण्नेम्यनन्तच्छदि यत्त्रिणाभि करालस्रोतो जगदाच्छिद्य धावत् ॥ ॥ एकः स्वयं सन् जगतः
    सिसृक्षया द्वितीययाऽत्मन्नधियोगमायया । सृजस्यदः पासि पुनर्ग्रसिष्यसे यथोर्णनाभिर्भगवन् स्वशक्तिभिः
    ॥ ॥ नैतद्बताधीश पदं तवेप्सितं यन्मायया नस्तनुषे भूतसूक्ष्मम् । अनुग्रहायास्त्वपि यर्हि मायया लसत्तुलस्या
    तनुवा विलक्षितः ॥ ॥ तं त्वानुभूत्योपरतक्रियार्थं स्वमायया वर्तितलोकतन्त्रम् । नमाम्यभीक्ष्णं नमनीयपाद
    सरोजमल्पीयसि कामवर्षम् ॥ ॥ इति श्रीमद्भागवतमहापुराणे तृतीयस्कन्धे एकविंशाध्यायान्तर्गतं कर्दमर्षिकृतं
    विष्णुस्तोत्रं समाप्तम् । भागवतपुराण
