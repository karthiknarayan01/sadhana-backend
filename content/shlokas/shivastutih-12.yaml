id: shivastutih-12
category: stotram
name:
  english: shivastutih
  devanagari: शिवस्तुतिः
content:
  english: stavametam prayunjita phalagune masi sattame | hrittamonashakam devi punyamayushyavardhanam
    || 48|| ekavaram trivaram va pujayedindushekharam | sarveshvapi ca maseshu dadyadgomithunam sitam
    || 49|| sadakshinam savatsam ca satambulamumapateh | pritaye shaivavaryebhyo dapayecchivapujakah ||
    50|| masi tasmin shive purnaparvanyeva samahitah | madhukambalamishaya kritva papaih pramucyate ||
    51|| ghritakambalammaghena vaishakhe dadhikambalam | kritva papaih pramucyeta shivasyatipriyo bhavet
    || 52|| madhukambalakam kuryat phalgune papahari tat | 53
  devanagari: स्तवमेतं प्रयुञ्जीत फालगुने मासि सत्तमे । हृत्तमोनाशकं देवि पुण्यमायुष्यवर्धनम् ॥ ४८॥ एकवारं
    त्रिवारं वा पूजयेदिन्दुशेखरम् । सर्वेष्वपि च मासेषु दद्याद्गोमिथुनं सितम् ॥ ४९॥ सदक्षिणं सवत्सं च
    सताम्बूलमुमापतेः । प्रीतये शैववर्येभ्यो दापयेच्छिवपूजकः ॥ ५०॥ मासि तस्मिन् शिवे पूर्णपर्वण्येव समाहितः
    । मधुकम्बलमीशाय कृत्वा पापैः प्रमुच्यते ॥ ५१॥ घृतकम्बलम्माघेन वैशाखे दधिकम्बलम् । कृत्वा पापैः प्रमुच्येत
    शिवस्यतिप्रियो भवेत् ॥ ५२॥ मधुकम्बलकं कुर्यात् फाल्गुने पापहारि तत् । ५३
