id: sri-datta-mala-mantra
category: stotram
name:
  english: Sri Datta Mala Mantra
content:
  english: shri ganeshaya namah | parvatyuvaca malamantram mama bruhi priyayasmadaham tava | ishvara uvaca
    shrinu devi pravakshyami malamantramanuttamam || om namo bhagavate dattatreyaya smaranamatrasantushtaya
    mahabhayanivaranaya mahajnanapradaya balonmattapishacaveshaya anasuyanandavardhanaya atriputraya kraum
    asadhyakarshanaya klim jagatrayavashikaranaya shrim mahasampatpradaya glaum bhumandaladhipatyapradaya
    hum vidveshaya vidveshaya thah thah stambhaya stambhaya namah sampannaya sampannaya paramantraparayantraparatantrani
    chindhi chindhi grahannivaraya nivaraya vyadhin vinashaya vinashaya daridryam vidravaya vidravaya
    om namo mahasiddhaya svaha | iti dattatreyopanishadi shridattamala mantrah sampurnah |
  devanagari: श्री गणेशाय नमः । पार्वत्युवाच मालामन्त्रं मम ब्रूहि प्रियायस्मादहं तव । ईश्वर उवाच शृणु
    देवि प्रवक्ष्यामि मालामन्त्रमनुत्तमम् ॥ ॐ नमो भगवते दत्तात्रेयाय स्मरणमात्रसन्तुष्टाय महाभयनिवारणाय
    महाज्ञानप्रदाय बालोन्मत्तपिशाचवेषाय अनसूयानन्दवर्धनाय अत्रिपुत्राय क्रौं असाध्याकर्षणाय क्लीं जगत्रयवशीकरणाय
    श्रीं महासम्पत्प्रदाय ग्लौं भूमण्डलाधिपत्यप्रदाय हुं विद्वेषय विद्वेषय ठः ठः स्तम्भय स्तम्भय नमः सम्पन्नय
    सम्पन्नय परमन्त्रपरयन्त्रपरतन्त्राणि छिन्धि छिन्धि ग्रहान्निवारय निवारय व्याधीन् विनाशय विनाशय दारिद्र्यं
    विद्रावय विद्रावय ॐ नमो महासिद्धाय स्वाहा । इति दत्तात्रेयोपनिशदी श्रीदत्तमाला मन्त्रः सम्पूर्णः ।
