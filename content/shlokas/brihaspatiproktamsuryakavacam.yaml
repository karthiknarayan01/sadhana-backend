id: brihaspatiproktamsuryakavacam
category: kavacha
name:
  english: brihaspatiproktamsuryakavacam
  devanagari: बृहस्पतिप्रोक्तंसूर्यकवचम्
content:
  english: rinu pravakshyami kavacam paramadbhutam | yaddhritva munayah puta jivanmuktashca bharate ||
    19|| kavacam bibhrato vyadhirna bhiya yati sannidhim | yatha drishtva vainateyam palayante bhujangamah
    || 20|| shuddhaya gurubhaktaya svashishyaya prakashayet | khalaya parashishyaya dattva mrityumavapnuyat
    || 21|| jagadvilakshanasyasya kavacasya prajapatih | rishishchandashca gayatri devo dinakarah svayam
    | vyadhipranashe saundarye viniyogah prakirttitah || 22|| sadyorogaharam saram sarvapapapranashanam
    | om klim hrim shrim shrisuryaya svaha me patu mastakam || 23|| ashtadashaksharo mantrah kapalam me
    sada'vatu | om hrim hrim shrim shrim suryaya svaha me patu nasikam || 24|| cakshurme patu suryashca
    tarakam ca vikartanah | bhaskaro me'dharam patu dantandinakarah sada || 25|| pracandah patu gandam
    me martandah karnameva ca | mihirashca sada skandhe janghe pusha sada'vatu || 26|| vakshah patu ravih
    shashvannabhim suryah svayam sada | kankalam me sada patu sarvadevanamaskritah || 27|| karau patu
    sada bradhnah patu padau prabhakarah | vibhakaro me sarvangam patu santatamishvarah || 28|| iti te
    kathitam vatsa kavacam sumanoharam | jagadvilakshanam nama trijagatsu sudurlabham || 29|| pura dattam
    ca manave pulastyena tu pushkare | maya dattam ca tubhyam tadyasmai kasmai na dehi bhoh || 30|| vyadhito
    mucyase tvam ca kavacasya prasadatah | bhavanarogi shrimamshca bhavishyati na samshayah || 31|| lakshavarshahavishyena
    yatphalam labhate narah | tatphalam labhate nunam kavacasyasya dharanat || 32|| idam kavacamajnatva
    yo mudho bhaskaram yajet | dashalakshaprajapto'pi mantrasiddhirna jayate || 33|| iti shribrahmavaivartapurane
    ganapatikhande ekonavimsha
  devanagari: ृणु प्रवक्ष्यामि कवचं परमाद्भुतम् । यद्धृत्वा मुनयः पूता जीवन्मुक्ताश्च भारते ॥ १९॥ कवचं
    बिभ्रतो व्याधिर्न भिया याति सन्निधिम् । यथा दृष्ट्वा वैनतेयं पलायन्ते भुजङ्गमाः ॥ २०॥ शुद्धाय गुरुभक्ताय
    स्वशिष्याय प्रकाशयेत् । खलाय परशिष्याय दत्त्वा मृत्युमवाप्नुयात् ॥ २१॥ जगद्विलक्षणस्यास्य कवचस्य प्रजापतिः
    । ऋषिश्छन्दश्च गायत्री देवो दिनकरः स्वयम् । व्याधिप्रणाशे सौन्दर्ये विनियोगः प्रकीर्त्तितः ॥ २२॥ सद्योरोगहरं
    सारं सर्वपापप्रणाशनम् । ॐ क्लीं ह्रीं श्रीं श्रीसूर्याय स्वाहा मे पातु मस्तकम् ॥ २३॥ अष्टादशाक्षरो
    मन्त्रः कपालं मे सदाऽवतु । ॐ ह्रीं ह्रीं श्रीं श्रीं सूर्याय स्वाहा मे पातु नासिकाम् ॥ २४॥ चक्षुर्मे
    पातु सूर्यश्च तारकां च विकर्तनः । भास्करो मेऽधरं पातु दन्तान्दिनकरः सदा ॥ २५॥ प्रचण्डः पातु गण्डं
    मे मार्तण्डः कर्णमेव च । मिहिरश्च सदा स्कन्धे जङ्घे पूषा सदाऽवतु ॥ २६॥ वक्षः पातु रविः शश्वन्नाभिं
    सूर्यः स्वयं सदा । कङ्कालं मे सदा पातु सर्वदेवनमस्कृतः ॥ २७॥ करौ पातु सदा ब्रध्नः पातु पादौ प्रभाकरः
    । विभाकरो मे सर्वाङ्गं पातु सन्ततमीश्वरः ॥ २८॥ इति ते कथितं वत्स कवचं सुमनोहरम् । जगद्विलक्षणं नाम
    त्रिजगत्सु सुदुर्लभम् ॥ २९॥ पुरा दत्तं च मनवे पुलस्त्येन तु पुष्करे । मया दत्तं च तुभ्यं तद्यस्मै
    कस्मै न देहि भोः ॥ ३०॥ व्याधितो मुच्यसे त्वं च कवचस्य प्रसादतः । भवानरोगी श्रीमांश्च भविष्यति न संशयः
    ॥ ३१॥ लक्षवर्षहविष्येण यत्फलं लभते नरः । तत्फलं लभते नूनं कवचस्यास्य धारणात् ॥ ३२॥ इदं कवचमज्ञात्वा
    यो मूढो भास्करं यजेत् । दशलक्षप्रजप्तोऽपि मन्त्रसिद्धिर्न जायते ॥ ३३॥ इति श्रीब्रह्मवैवर्तपुराणे गणपतिखण्डे
    एकोनविंशा
