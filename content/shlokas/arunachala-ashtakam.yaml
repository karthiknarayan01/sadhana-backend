id: arunachala-ashtakam
category: stotram
name:
  english: Arunachala Ashtakam
content:
  english: darshanadabhrasadasi jananatkamalalaye | kashyam tu marananmuktih smaranadarunacale || || karunapuritapangam
    sharanagatavatsalam | tarunendujatamaulim smaranadarunacalam || || samastajagadadharam saccidanandavigraham
    | sahasrarathasopetam smaranadarunacalam || || kancanapratimabhasam vanchitarthaphalapradam | mam
    ca raksha suradhyaksham smaranadarunacalam || || baddhacandrajatajutamardhanarikalebaram | vardhamanadayambhodhim
    smaranadarunacalam || || kancanapratimabhasam suryakotisamaprabham | baddhavyaghrapuridhyanam smaranadarunacalam
    || || shikshayakhiladevari bhakshitakshvelakandharam | rakshayakhilabhaktanam smaranadarunacalam ||
    || ashtabhutisamayuktamishtakamaphalapradam | shishtabhaktisamayuktan smaranadarunacalam || || vinayakasuradhyaksham
    vishnubrahmendrasevitam | vimalarunapadabjam smaranadarunacalam || || mandaramallikajatikundacampakapankajaih
    | indradipujitam devim smaranadarunacalam || || sampatkaram parvatisham suryacandragnilocanam | mandasmitamukhambhojam
    smaranadarunacalam || || iti shriarunacalashtakam ||
  devanagari: दर्शनादभ्रसदसि जननात्कमलालये । काश्यां तु मरणान्मुक्तिः स्मरणादरुणाचले ॥ ॥ करुणापूरितापाङ्गं
    शरणागतवत्सलम् । तरुणेन्दुजटामौलिं स्मरणादरुणाचलम् ॥ ॥ समस्तजगदाधारं सच्चिदानन्दविग्रहम् । सहस्ररथसोपेतं
    स्मरणादरुणाचलम् ॥ ॥ काञ्चनप्रतिमाभासं वाञ्छितार्थफलप्रदम् । मां च रक्ष सुराध्यक्षं स्मरणादरुणाचलम्
    ॥ ॥ बद्धचन्द्रजटाजूटमर्धनारीकलेबरम् । वर्धमानदयाम्भोधिं स्मरणादरुणाचलम् ॥ ॥ काञ्चनप्रतिमाभासं सूर्यकोटिसमप्रभम्
    । बद्धव्याघ्रपुरीध्यानं स्मरणादरुणाचलम् ॥ ॥ शिक्षयाखिलदेवारि भक्षितक्ष्वेलकन्धरम् । रक्षयाखिलभक्तानां
    स्मरणादरुणाचलम् ॥ ॥ अष्टभूतिसमायुक्तमिष्टकामफलप्रदम् । शिष्टभक्तिसमायुक्तान् स्मरणादरुणाचलम् ॥ ॥ विनायकसुराध्यक्षं
    विष्णुब्रह्मेन्द्रसेवितम् । विमलारुणपादाब्जं स्मरणादरुणाचलम् ॥ ॥ मन्दारमल्लिकाजातिकुन्दचम्पकपङ्कजैः
    । इन्द्रादिपूजितां देवीं स्मरणादरुणाचलम् ॥ ॥ सम्पत्करं पार्वतीशं सूर्यचन्द्राग्निलोचनम् । मन्दस्मितमुखाम्भोजं
    स्मरणादरुणाचलम् ॥ ॥ इति श्रीअरुणाचलाष्टकम् ॥
