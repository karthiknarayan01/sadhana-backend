id: mahaprajnaparamitahridayamahamantravidhanam-2
category: hridaya
name:
  english: mahaprajnaparamitahridayamahamantravidhanam
  devanagari: महाप्रज्नापारमिताहृदयमहामन्त्रविधानम्
content:
  english: sarvasattvahitartham ca jape viniyogah || rishyadinyasah | aryavalokiteshvararishaye namah
    shirasi | anushtupchandase namah mukhe | shrimahaprajnaparamitadevatayai namah hridi | bodhibijaya
    namah nabhau | karunashaktaye namah guhye | shunyatakilakaya namah padayoh | viniyogaya namah sarvange
    || karanyasah | gate angushthabhyam namah | gate tarjanibhyam svaha | paragate madhyamabhyam vashat
    | parasangate anamikabhyam hum | bodhi kanishthikabhyam vaushat | svaha karatalakaraprishthabhyam
    phat || shadanganyasah | gate hridayaya namah | gate shirase svaha | paragate shikhayai vashat | parasangate
    kavacaya hum | bodhi netratrayaya vaushat | svaha astraya phat || bodhisattvanyasah | dhim manjushribodhisattvaya
    namah hridi | hrim avalokiteshvaraya namah shirasi | trim maitreyaya namah dakshinabahau | shrim kshitigarbhaya
    namah vamabahau | hum vajrapanaye namah nabhau | aim samantabhadraya namah sarvange || dakininyasah
    | hum jnanadakinyai namah | tram vajradakinyai namah | hrim padmadakinyai namah | krim karmadakinyai
    namah | phat samayadakinyai namah || prajnanyasah | dhim prajnayai namah | dhih mahaprajnayai namah
    | aim vijnanaprajnayai namah | hrim shunyaprajnayai namah | shrim bodhiprajnayai namah || paramitanyasah
    | dam danaparamitayai namah | shim shilaparamitayai namah | ksham kshantiparamitayai namah | vim viryaparamitayai
    namah | dhyam dhyanaparamitayai namah | dhim prajnaparamitayai namah || shunyatanyasah | ham shunyatayai
    namah | kham mahashunyatayai namah | ksham sarvadharmashunyatayai namah | ah anutpadashunyatayai namah
    || devinnyasah | aim taryai namah | hrim prajnaparamitayai namah | shrim pandaravasinyai namah | krim
    kurukullayai namah | hum vajrayoginyai namah || bhairavanyasah | hum jnanabhairavaya namah | phat
    shunyabhairavaya namah | hrim vajrabhairavaya namah | kshaum mahakalabhairavaya namah || avalokiteshvaranyasah
    | hrih avalokiteshvaraya namah hridi | padmam shirasi | karuna netrayoh | mahakaruna sarvange || matrikanyasah
    | am am im im um um rim rim lim lim em aim om aum ah shirasi | kam kham gam gham nam dakshine | cam
    cham jam jham nam vame | tam tham dam dham nam hridi | tam tham dam dham nam nabhau | pam pham bam
    bham mam guhye | yam ram lam vam sham sham sam ham ksham sarvange || mahavidyanyasah | krim kalyai
    namah | hrim bhuvaneshvaryai namah | shrim shodashyai namah | hum tarayai namah | aim matangyai namah
    | dhim prajnaparamitayai namah || cakranyasah | lam muladhare | vam svadhishthane | ram manipure |
    yam anahate | ham vishuddhau | om ajnacakre | dhih sahasrare || pithanyasah | bodhagaya pithaya namah
    | saranathapithaya namah | nalandapithaya namah | gridhrakutapithaya namah | potalapithaya namah ||
    angadevatanyasah | hridayadevyai namah | shirodevyai namah | shikhadevyai namah | kavacadevyai namah
    | netradevyai namah | astradevyai namah || dhyanam | shvetaravinde virajamanam candraprabham shantimayim
    prasannam | pustakshasutrabhayadanahastam dhyayetprajnam vishvahitaikadaksham || avalokiteshvarasannishannam
    bodhisattvaih sevitapadapadmam | shunyasvabhavam karunaikamurtim vande mahaprajnaparamitam shivam
    || mantrah
  devanagari: सर्वसत्त्वहितार्थं च जपे विनियोगः ॥ ऋष्यादिन्यासः । आर्यावलोकितेश्वरऋषये नमः शिरसि । अनुष्टुप्छन्दसे
    नमः मुखे । श्रीमहाप्रज्ञापारमितादेवतायै नमः हृदि । बोधिबीजाय नमः नाभौ । करुणाशक्तये नमः गुह्ये । शून्यताकीलकाय
    नमः पादयोः । विनियोगाय नमः सर्वाङ्गे ॥ करन्यासः । गते अङ्गुष्ठाभ्यां नमः । गते तर्जनीभ्यां स्वाहा
    । पारगते मध्यमाभ्यां वषट् । पारसङ्गते अनामिकाभ्यां हुम् । बोधि कनिष्ठिकाभ्यां वौषट् । स्वाहा करतलकरपृष्ठाभ्यां
    फट् ॥ षडङ्गन्यासः । गते हृदयाय नमः । गते शिरसे स्वाहा । पारगते शिखायै वषट् । पारसङ्गते कवचाय हुम्
    । बोधि नेत्रत्रयाय वौषट् । स्वाहा अस्त्राय फट् ॥ बोधिसत्त्वन्यासः । धीं मञ्जुश्रीबोधिसत्त्वाय नमः
    हृदि । ह्रीं अवलोकितेश्वराय नमः शिरसि । त्रीं मैत्रेयाय नमः दक्षिणबाहौ । श्रीं क्षितिगर्भाय नमः वामबाहौ
    । हूं वज्रपाणये नमः नाभौ । ऐं समन्तभद्राय नमः सर्वाङ्गे ॥ डाकिनीन्यासः । हूं ज्ञानडाकिन्यै नमः । त्रां
    वज्रडाकिन्यै नमः । ह्रीं पद्मडाकिन्यै नमः । क्रीं कर्मडाकिन्यै नमः । फट् समयडाकिन्यै नमः ॥ प्रज्ञान्यासः
    । धीं प्रज्ञायै नमः । धीः महाप्रज्ञायै नमः । ऐं विज्ञानप्रज्ञायै नमः । ह्रीं शून्यप्रज्ञायै नमः ।
    श्रीं बोधिप्रज्ञायै नमः ॥ पारमितान्यासः । दां दानपारमितायै नमः । शीं शीलपारमितायै नमः । क्षां क्षान्तिपारमितायै
    नमः । वीं वीर्यपारमितायै नमः । ध्यां ध्यानपारमितायै नमः । धीं प्रज्ञापारमितायै नमः ॥ शून्यतान्यासः
    । हं शून्यतायै नमः । खं महाशून्यतायै नमः । क्षं सर्वधर्मशून्यतायै नमः । अः अनुत्पादशून्यतायै नमः ॥
    देवीन्न्यासः । ऐं तार्यै नमः । ह्रीं प्रज्ञापारमितायै नमः । श्रीं पाण्डरवासिन्यै नमः । क्रीं कुरुकुल्लायै
    नमः । हूं वज्रयोगिन्यै नमः ॥ भैरवन्यासः । हूं ज्ञानभैरवाय नमः । फट् शून्यभैरवाय नमः । ह्रीं वज्रभैरवाय
    नमः । क्षौं महाकालभैरवाय नमः ॥ अवलोकितेश्वरन्यासः । ह्रीः अवलोकितेश्वराय नमः हृदि । पद्मं शिरसि ।
    करुणा नेत्रयोः । महाकरुणा सर्वाङ्गे ॥ मातृकान्यासः । अं आं इं ईं उं ऊं ऋं ॠं ऌं ॡं एं ऐं ओं औं अः
    शिरसि । कं खं गं घं ङं दक्षिणे । चं छं जं झं ञं वामे । टं ठं डं ढं णं हृदि । तं थं दं धं नं नाभौ ।
    पं फं बं भं मं गुह्ये । यं रं लं वं शं षं सं हं क्षं सर्वाङ्गे ॥ महाविद्यान्यासः । क्रीं काल्यै नमः
    । ह्रीं भुवनेश्वर्यै नमः । श्रीं षोडश्यै नमः । हूं तारायै नमः । ऐं मातङ्ग्यै नमः । धीं प्रज्ञापारमितायै
    नमः ॥ चक्रन्यासः । लं मूलाधारे । वं स्वाधिष्ठाने । रं मणिपूरे । यं अनाहते । हं विशुद्धौ । ॐ आज्ञाचक्रे
    । धीः सहस्रारे ॥ पीठन्यासः । बोधगया पीठाय नमः । सारनाथपीठाय नमः । नालन्दापीठाय नमः । गृध्रकूटपीठाय
    नमः । पोतलपीठाय नमः ॥ अङ्गदेवतान्यासः । हृदयदेव्यै नमः । शिरोदेव्यै नमः । शिखादेव्यै नमः । कवचदेव्यै
    नमः । नेत्रदेव्यै नमः । अस्त्रदेव्यै नमः ॥ ध्यानम् । श्वेतारविन्दे विराजमानां चन्द्रप्रभां शान्तिमयीं
    प्रसन्नाम् । पुस्ताक्षसूत्राभयदानहस्तां ध्यायेत्प्रज्ञां विश्वहितैकदक्षाम् ॥ अवलोकितेश्वरसन्निषण्णां
    बोधिसत्त्वैः सेवितपादपद्माम् । शून्यस्वभावां करुणैकमूर्तिं वन्दे महाप्रज्ञापारमितां शिवाम् ॥ मन्त्रः
