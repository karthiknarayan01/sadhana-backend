id: annamayya-keerthanas-antaryami-alasiti
category: stotram
name:
  english: Annamayya Keerthanas Antaryami Alasiti
content:
  english: adi pallavi antaryami alasiti sòlasiti | intata ni sharanidè jòccitini || korina korkulu koyani
    katlu tiravu nivavi tèncaka | bharapu baggalu papa punyamulu nerupula bonivu nivu vaddanaka || antaryami
    alasiti sòlasiti | intata ni sharanidè jòccitini || janula sangamula jakka rogamulu vinu viduvavu
    nivu vidipincaka | vinayapu dainyamu viduvani karmamu canadadi nivitu shantaparacaka || caranam madilo
    cintalu mailalu manugulu vadalavu nivavi vaddanaka | èdutanè shri vènkateshvara nivadè adana gacitivi
    attittanaka || antaryami alasiti sòlasiti | intata ni sharanidè jòccitini ||
  devanagari: आदि पल्लवि अन्तर्यामि अलसिति सॊलसिति । इन्तट नी शरणिदॆ जॊच्चितिनि ॥ कोरिन कोर्कुलु कोयनि
    कट्लु तीरवु नीववि तॆञ्चक । भारपु बग्गालु पाप पुण्यमुलु नेरुपुल बोनीवु नीवु वद्दनक ॥ अन्तर्यामि अलसिति
    सॊलसिति । इन्तट नी शरणिदॆ जॊच्चितिनि ॥ जनुल सङ्गमुल जक्क रोगमुलु विनु विडुववु नीवु विडिपिञ्चक । विनयपु
    दैन्यमु विडुवनि कर्ममु चनददि नीविटु शान्तपरचक ॥ चरणं मदिलो चिन्तलु मैललु मणुगुलु वदलवु नीववि वद्दनक
    । ऎदुटनॆ श्री वॆङ्कटेश्वर नीवदॆ अदन गाचितिवि अट्टिट्टनक ॥ अन्तर्यामि अलसिति सॊलसिति । इन्तट नी शरणिदॆ
    जॊच्चितिनि ॥
