id: kalamrityujayastotram
category: stotram
name:
  english: kalamrityujayastotram
  devanagari: कालमृत्युजयस्तोत्रम्
content:
  english: rinu caksharamaniki || 3|| garudo mama bhakto vai samasino'bhavadgrihe | japan malam mama dhyayan
    manmurtim divyarupinim || 4|| prishtastada janakena kashyapena suto nijah | katham putra mahabhakta
    yogin mrityurnivartate || 5|| kena rupena mrityurvai samayati haratyapi | katham nihsparshanam tasya
    dehinastviha caryate || 6|| shrutva pakshi ca pitaram samuvaca vadami tat | bhaktya nivartate mrityurashrayatparamatmanah
    || 7|| dandi shastradharo bhikshurnagnadih kaladutakah | samayati varshma dhritva taddamshena na jivati
    || 8|| citavalmikashailadau kupe ca vivare taroh | damshe damshtratrayam lagnam dashto dehi na jivati
    || 9|| shashthyam ca karkate meshe mula''shleshamaghadishu | kakshashronigale sandhau shankhakarnodaradishu
    || 10|| vaktre bahau ca grivayam prishthe dashto na shripati | shesho'rkah phanipashcandrastakshako
    bhauma iritah || 11|| karkoto jno guruh padmo mahapadmastu bhargavah | shankhah shanaishcaro rahuh
    kulikashceti te grahah || 12|| tattadgraheshu tajjatisarpadashto na jivati | padam'gushthah pratipadah
    syat padaprishthau dvitiyaka || 13|| gulphau nu vai tritiya syajjanuni ca caturthika | lingam bhagam
    pancamiti nabhih shashthistithirmata || 14|| hridayam saptami prokta stanau cashtamikadinam | kanthastu
    navami prokta dashami nasikaputau || 15|| netre caikadashi bodhya karnau dvadashika mata | bhruvau
    trayodashirupe shankhashcaturdashi mata || 16|| mastakam pancadashika tattithau tatsthale dashet |
    tada kalakavalena dashto dehi na jivati || 17|| pumso dakshinabhage tu narya vame tvidam matam | etadrishakshane
    dashta na jivanti kadacana || 18|| kintu
  devanagari: ृणु चाक्षरमाणिकि ॥ ३॥ गरुडो मम भक्तो वै समासीनोऽभवद्गृहे । जपन् मालां मम ध्यायन् मन्मूर्तिं
    दिव्यरूपिणीम् ॥ ४॥ पृष्टस्तदा जनकेन कश्यपेन सुतो निजः । कथं पुत्र महाभक्त योगिन् मृत्युर्निवर्तते
    ॥ ५॥ केन रूपेण मृत्युर्वै समायाति हरत्यपि । कथं निःस्पर्शनं तस्य देहिनस्त्विह चर्यते ॥ ६॥ श्रुत्वा
    पक्षी च पितरं समुवाच वदामि तत् । भक्त्या निवर्तते मृत्युराश्रयात्परमात्मनः ॥ ७॥ दण्डी शस्त्रधरो भिक्षुर्नग्नादिः
    कालदूतकः । समायाति वर्ष्म धृत्वा तद्दंशेन न जीवति ॥ ८॥ चितावल्मीकशैलादौ कूपे च विवरे तरोः । दंशे दंष्ट्रात्रयं
    लग्नं दष्टो देही न जीवति ॥ ९॥ षष्ठ्यां च कर्कटे मेषे मूलाऽऽश्लेषामघादिषु । कक्षाश्रोणिगले सन्धौ शङ्खकर्णोदरादिषु
    ॥ १०॥ वक्त्रे बाहौ च ग्रीवायां पृष्ठे दष्टो न श्रीपति । शेषोऽर्कः फणिपश्चन्द्रस्तक्षको भौम ईरितः ॥
    ११॥ कर्कोटो ज्ञो गुरुः पद्मो महापद्मस्तु भार्गवः । शङ्खः शनैश्चरो राहुः कुलिकश्चेति ते ग्रहाः ॥ १२॥
    तत्तद्ग्रहेषु तज्जातिसर्पदष्टो न जीवति । पादांऽगुष्ठः प्रतिपदः स्यात् पादपृष्ठौ द्वितीयका ॥ १३॥ गुल्फौ
    नु वै तृतीया स्याज्जानुनी च चतुर्थिका । लिङ्गं भगं पञ्चमीति नाभिः षष्ठीस्तिथिर्मता ॥ १४॥ हृदयं सप्तमी
    प्रोक्ता स्तनौ चाष्टमिकादिनम् । कण्ठस्तु नवमी प्रोक्ता दशमी नासिकापुटौ ॥ १५॥ नेत्रे चैकादशी बोध्या
    कर्णौ द्वादशिका मता । भ्रुवौ त्रयोदशीरूपे शङ्खश्चतुर्दशी मता ॥ १६॥ मस्तकं पञ्चदशिका तत्तिथौ तत्स्थले
    दशेत् । तदा कालकवलेन दष्टो देही न जीवति ॥ १७॥ पुंसो दक्षिणभागे तु नार्या वामे त्विदं मतम् । एतादृशक्षणे
    दष्टा न जीवन्ति कदाचन ॥ १८॥ किन्तु
