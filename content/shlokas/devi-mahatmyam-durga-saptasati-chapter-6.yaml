id: devi-mahatmyam-durga-saptasati-chapter-6
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 6
content:
  english: shumbhanishumbhasenanidhumralocanavadho nama shashto dhyayah || dhyanam nagadhishvara vishtram
    phani phanottamsoru ratnavali bhasvad deha latam nibha'u netrayodbhasitam | mala kumbha kapala niraja
    karam candra ardha cudhambaram sarveshvara bhairavanga nilayam padmavaticintaye || rishiruvaca ||
    || ityakarnya vaco devyah sa duto'marshapuritah | samacashta samagamya daityarajaya vistarat || ||
    tasya dutasya tadvakyamakarnyasurarat tatah | sa krodhah praha daityanamadhipam dhumralocanam || ||
    he dhumralocanashu tvam svasainya parivaritah| tamanaya balladdushtam keshakarshana vihvalam || ||
    tatparitranadah kashcidyadi vottishthate h| sa hantavyo'marovapi yaksho gandharva eva va || || tenajnaptastatah
    shighram sa daityo dhumralocanah| vritah shashtya sahasranam asuranandrutamyamau || || na drishtva
    tam tato devim tuhinacala samsthitam| jagadoccaih prayahiti mulam shumbanishumbhayoh || || na cetprityadya
    bhavati madbhartaramupaishyati tato balannayamyesha keshakarshanavihvalam || || daityeshvarena prahito
    balavanbalasamvritah| balannayasi mamevam tatah kim te karomyaham || || ityuktah so'bhyadhavattam
    asuro dhumralocanah| hunkarenaiva tam bhasma sa cakarambika tada|| || atha kruddham mahasainyam asuranam
    tathambika| vavarsha sayukaistikshnaistatha shaktiparashvadhaih || || tato dhutasatah kopatkritva
    nadam subhairavam| papatasura senayam simho devyah svavahanah || || kamshcitkarapraharena daityanasyena
    caparan| akrantya cadharenyan jaghana sa mahasuran || || keshancitpatayamasa nakhaih koshthani kesari|
    tatha talapraharena shiramsi kritavan prithak || || vicchinnabahushirasah kritastena tathapare| papauca
    rudhiram koshthadanyesham dhutakesarah || || kshanena tadbalam sarvam kshayam nitam mahatmana| tena
    kesarina devya vahanenatikopina || || shrutva tamasuram devya nihatam dhumralocanam| balam ca kshayitam
    kritsnam devi kesarina tatah|| || cukopa daityadhipatih shumbhah prasphuritadharah| ajnapayamasa ca
    tau candamundau mahasurau || || hecanda he munda balairbahubhih parivaritau tatra gacchata gatva ca
    sa samaniyatam laghu || || kesheshvakrishya baddhva va yadi vah samshayo yudhi| tadashesha yudhaih
    sarvair asurairvinihanyatam || || tasyam hatayam dushtayam simhe ca vinipatite| shighramagamyatam
    badva grihitvatamathambikam || || || svasti shri markandeya purane savarnikemanvantare devi mahatmye
    shumbhanishumbhasenanidhumralocanavadho nama shashto dhyayah || ahuti om klim jayanti sangayai sashaktikayai
    saparivarayai savahanayai mahahutim samarpayami namah svaha ||
  devanagari: शुम्भनिशुम्भसेनानीधूम्रलोचनवधो नाम षष्टो ध्यायः ॥ ध्यानं नगाधीश्वर विष्त्रां फणि फणोत्तंसोरु
    रत्नावली भास्वद् देह लतां निभऽउ नेत्रयोद्भासिताम् । माला कुम्भ कपाल नीरज करां चन्द्रा अर्ध चूढाम्बरां
    सर्वेश्वर भैरवाङ्ग निलयां पद्मावतीचिन्तये ॥ ऋषिरुवाच ॥ ॥ इत्याकर्ण्य वचो देव्याः स दूतोऽमर्षपूरितः
    । समाचष्ट समागम्य दैत्यराजाय विस्तरात् ॥ ॥ तस्य दूतस्य तद्वाक्यमाकर्ण्यासुरराट् ततः । स क्रोधः प्राह
    दैत्यानामधिपं धूम्रलोचनम् ॥ ॥ हे धूम्रलोचनाशु त्वं स्वसैन्य परिवारितः। तामानय बल्लाद्दुष्टां केशाकर्षण
    विह्वलाम् ॥ ॥ तत्परित्राणदः कश्चिद्यदि वोत्तिष्ठते ः। स हन्तव्योऽमरोवापि यक्षो गन्धर्व एव वा ॥ ॥ तेनाज्ञप्तस्ततः
    शीघ्रं स दैत्यो धूम्रलोचनः। वृतः षष्ट्या सहस्राणां असुराणान्द्रुतंयमौ ॥ ॥ न दृष्ट्वा तां ततो देवीं
    तुहिनाचल संस्थितां। जगादोच्चैः प्रयाहीति मूलं शुम्बनिशुम्भयोः ॥ ॥ न चेत्प्रीत्याद्य भवती मद्भर्तारमुपैष्यति
    ततो बलान्नयाम्येष केशाकर्षणविह्वलाम् ॥ ॥ दैत्येश्वरेण प्रहितो बलवान्बलसंवृतः। बलान्नयसि मामेवं ततः
    किं ते करोम्यहम् ॥ ॥ इत्युक्तः सोऽभ्यधावत्तां असुरो धूम्रलोचनः। हूङ्कारेणैव तं भस्म सा चकाराम्बिका
    तदा॥ ॥ अथ क्रुद्धं महासैन्यं असुराणां तथाम्बिका। ववर्ष सायुकैस्तीक्ष्णैस्तथा शक्तिपरश्वधैः ॥ ॥ ततो
    धुतसटः कोपात्कृत्वा नादं सुभैरवम्। पपातासुर सेनायां सिंहो देव्याः स्ववाहनः ॥ ॥ कांश्चित्करप्रहारेण
    दैत्यानास्येन चापारान्। आक्रान्त्या चाधरेण्यान् जघान स महासुरान् ॥ ॥ केषाञ्चित्पाटयामास नखैः कोष्ठानि
    केसरी। तथा तलप्रहारेण शिरांसि कृतवान् पृथक् ॥ ॥ विच्छिन्नबाहुशिरसः कृतास्तेन तथापरे। पपौच रुधिरं कोष्ठादन्येषां
    धुतकेसरः ॥ ॥ क्षणेन तद्बलं सर्वं क्षयं नीतं महात्मना। तेन केसरिणा देव्या वाहनेनातिकोपिना ॥ ॥ श्रुत्वा
    तमसुरं देव्या निहतं धूम्रलोचनम्। बलं च क्षयितं कृत्स्नं देवी केसरिणा ततः॥ ॥ चुकोप दैत्याधिपतिः शुम्भः
    प्रस्फुरिताधरः। आज्ञापयामास च तौ चण्डमुण्डौ महासुरौ ॥ ॥ हेचण्ड हे मुण्ड बलैर्बहुभिः परिवारितौ तत्र
    गच्छत गत्वा च सा समानीयतां लघु ॥ ॥ केशेष्वाकृष्य बद्ध्वा वा यदि वः संशयो युधि। तदाशेषा युधैः सर्वैर्
    असुरैर्विनिहन्यतां ॥ ॥ तस्यां हतायां दुष्टायां सिंहे च विनिपातिते। शीघ्रमागम्यतां बद्वा गृहीत्वातामथाम्बिकाम्
    ॥ ॥ ॥ स्वस्ति श्री मार्कण्डेय पुराणे सावर्निकेमन्वन्तरे देवि महत्म्ये शुम्भनिशुम्भसेनानीधूम्रलोचनवधो
    नाम षष्टो ध्यायः ॥ आहुति ॐ क्लीं जयन्ती साङ्गायै सशक्तिकायै सपरिवारायै सवाहनायै महाहुतिं समर्पयामि
    नमः स्वाहा ॥
