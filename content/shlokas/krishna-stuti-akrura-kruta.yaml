id: krishna-stuti-akrura-kruta
category: stotram
name:
  english: Krishna Stuti (Akrura Kruta)
content:
  english: drishtva tasmin jale devam vismayam paramam yayau | tushtavatha yadushreshtho harim sarvagamishvaram
    || || akrura uvaca | kalatmane namastubhyamanadinidhanaya ca | avyaktaya namastubhyamavikaraya te
    namah || || bhutabhartre namastubhyam bhutavyaghra namo namah | namaste sarvabhutanam niyantre paramatmane
    || || vikarayavikaraya pratyakshapurushaya ca | gunabhartre namastubhyam niyamaya namo namah || ||
    deshakaladinirbhedarahitaya paratmane | anantaya namastubhyamacyutaya namo namah || || govindaya namastubhyam
    trayinathaya sharngine | narayanaya vishvaya vasudevaya te namah || || vishnave pururupaya shashvataya
    namo namah | padmanetraya nityaya shankhacakradharaya ca || || udyatkotiraviprakhya bhushanancitavarcase
    | haraye sarvalokanamishvaraya namo namah || || savitre sarvajagatam bijaya paramatmane | sankarshanaya
    krishnaya pradyumnaya namo namah || || aniruddhaya dhatre ca vidhatre vishvayonaye | sahasramurttaye
    tubhyam bahumurddhanghribahave || || sahasranamne nityaya purushaya namo namah | namaste nagaparyankashayine
    saumyarupine || || keshavaya namastubhyam pitavastradharaya ca | lakshmighanakucashleshavimardojjvalavarcase
    | shridharaya namastubhyam shrishayanantarupine || || ishvara uvaca | snanakale pathedyastu devam
    dhyayansanatanam | imam stavam naro bhaktya mahadbhirmucyate hyaghaih || || sarvatirthaphalam prapya
    vishnusayujyamapnuyat | evamantarjale devam stutva bhagavatottamah || || arcayamasa sa jalaih kusumaishca
    sugandhibhih | kritakrityastadakruro nirgatya yamunajalat || || || iti shripadmapurane uttarakhande
    pancacatvarimshadhikadvishatatamadhyayantargatam akrurakrita shrikrishnastutih samapta ||
  devanagari: दृष्ट्वा तस्मिन् जले देवं विस्मयं परमं ययौ । तुष्टावाथ यदुश्रेष्ठो हरिं सर्वगमीश्वरम् ॥
    ॥ अक्रूर उवाच । कालात्मने नमस्तुभ्यमनादिनिधनाय च । अव्यक्ताय नमस्तुभ्यमविकाराय ते नमः ॥ ॥ भूतभर्त्रे
    नमस्तुभ्यं भूतव्याघ्र नमो नमः । नमस्ते सर्वभूतानां नियन्त्रे परमात्मने ॥ ॥ विकारायाविकाराय प्रत्यक्षपुरुषाय
    च । गुणभर्त्रे नमस्तुभ्यं नियमाय नमो नमः ॥ ॥ देशकालादिनिर्भेदरहिताय परात्मने । अनन्ताय नमस्तुभ्यमच्युताय
    नमो नमः ॥ ॥ गोविन्दाय नमस्तुभ्यं त्रयीनाथाय शार्ङ्गिणे । नारायणाय विश्वाय वासुदेवाय ते नमः ॥ ॥ विष्णवे
    पुरुरूपाय शाश्वताय नमो नमः । पद्मनेत्राय नित्याय शङ्खचक्रधराय च ॥ ॥ उद्यत्कोटिरविप्रख्य भूषणाञ्चितवर्चसे
    । हरये सर्वलोकानामीश्वराय नमो नमः ॥ ॥ सवित्रे सर्वजगतां बीजाय परमात्मने । सङ्कर्षणाय कृष्णाय प्रद्युम्नाय
    नमो नमः ॥ ॥ अनिरुद्धाय धात्रे च विधात्रे विश्वयोनये । सहस्रमूर्त्तये तुभ्यं बहुमूर्द्धाङ्घ्रिबाहवे
    ॥ ॥ सहस्रनाम्ने नित्याय पुरुषाय नमो नमः । नमस्ते नागपर्यङ्कशायिने सौम्यरूपिणे ॥ ॥ केशवाय नमस्तुभ्यं
    पीतवस्त्रधराय च । लक्ष्मीघनकुचाश्लेषविमर्दोज्ज्वलवर्चसे । श्रीधराय नमस्तुभ्यं श्रीशायानन्तरूपिणे ॥
    ॥ ईश्वर उवाच । स्नानकाले पठेद्यस्तु देवं ध्यायन्सनातनम् । इमं स्तवं नरो भक्त्या महद्भिर्मुच्यते ह्यघैः
    ॥ ॥ सर्वतीर्थफलं प्राप्य विष्णुसायुज्यमाप्नुयात् । एवमन्तर्जले देवं स्तुत्वा भागवतोत्तमः ॥ ॥ अर्चयामास
    स जलैः कुसुमैश्च सुगन्धिभिः । कृतकृत्यस्तदाक्रूरो निर्गत्य यमुनाजलात् ॥ ॥ ॥ इति श्रीपद्मपुराणे उत्तरखण्डे
    पञ्चचत्वारिंशाधिकद्विशततमाध्यायान्तर्गतं अक्रूरकृता श्रीकृष्णस्तुतिः समाप्ता ॥
