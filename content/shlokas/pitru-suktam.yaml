id: pitru-suktam
category: stotram
name:
  english: Pitru Suktam
  devanagari: पितृसूक्तम् (ऋग्वेद संहिता १०।१५।१-१४)
content:
  english: rigvedantargatam pancadashasuktam ((1-14) caturdasharcasya suktasya yamayanah shata rishih
    | pitaro devatah | (1-10, 12-14) prathamadidasharcam dvadashyaditricasya ca trishtup, (11) ekadashyashca
    jagati chandasi ||) rishih - shankho yamayanah | devata - pitarah | chandah - 1,2,7,12,13,14 virattrishtup;
    3,9,10 trishtup; 4,8 padanicrittrishtup; 5 arcibhuriktrishtup, 6 nicrittrishtup; 11 nicrijjagati |
    svarah - 1-10, 12-14 dhavatah; 11 nishadah udiratamavara utparasa unmadhyamah pitarah somyasah | asum
    ya iyuravrika ritajnaste no'vantu pitaro haveshu || 10|015|01 idam pitribhyo namo astvadya ye purvaso
    ya uparasa iyuh | ye parthive rajasya nishatta ye va nunam suvrijanasu vikshu || 10|015|02 aham pitrinsuvidatra~
    avitsi napatam ca vikramanam ca vishnoh | barhishado ye svadhaya sutasya bhajanta pitvasta ihagamishthah
    || 10|015|03 barhishadah pitara utya1rvagima vo havya cakrima jushadhvam | ta a gatavasa shamtamenatha
    nah sham yorarapo dadhata || 10|015|04 upahutah pitarah somyaso barhishyeshu nidhishu priyeshu | ta
    a gamantu ta iha shruvantvadhi bruvantu te'vantvasman || 10|015|05 acya janu dakshinato nishadyemam
    yajnamabhi grinita vishve | ma himsishta pitarah kena cinno yadva agah purushata karama || 10|015|06
    asinaso aruninamupasthe rayim dhatta dashushe martyaya | putrebhyah pitarastasya vasvah pra yacchata
    ta ihorjam dadhata || 10|015|07 ye nah purve pitarah somyaso'nuhire somapitham vasishthah | tebhiryamah
    samrarano havimshyushannushadbhih pratikamamattu || 10|015|08 ye tatrishurdevatra jehamana hotravidah
    stomatashtaso arkaih | agne yahi suvidatrebhirarvansatyaih kavyaih pitribhirgharmasadbhih || 10|015|09
    ye satyaso havirado havishpa indrena devaih saratham dadhanah | agne yahi sahasram devavandaih paraih
    purvaih pitribhirgharmasadbhih || 10|015|10 agnishvattah pitara eha gacchata sadahsadah sadata supranitayah
    | atta havimshi prayatani barhishyatha rayim sarvaviram dadhatana || 10|015|11 tvamagna iḻito jatavedo'vaddhavyani
    surabhini kritvi | pradah pitribhyah svadhaya te akshannaddhi tvam deva prayata havimshi || 10|015|12
    ye ceha pitaro ye ca neha ya~shca vidma ya~ u ca na pravidma | tvam vettha yati te jatavedah svadhabhiryajnam
    sukritam jushasva || 10|015|13 ye agnidagdha ye anagnidagdha madhye divah svadhaya madayante | tebhih
    svaraḻasunitimetam yathavasham tanvam kalpayasva || 10|015|14 ||nisvarah || pitrisuktam
  devanagari: ऋग्वेदान्तर्गतम् पञ्चदशसूक्तम् ((१-१४) चतुर्दशर्चस्य सूक्तस्य यामायनः शत ऋषिः । पितरो देवताः
    । (१-१०, १२-१४) प्रथमादिदशर्चाम् द्वादश्यादितृचस्य च त्रिष्टुप्, (११) एकादश्याश्च जगती छन्दसी ॥) ऋषिः
    - शङ्खो यामायनः । देवता - पितरः । छन्दः - १,२,७,१२,१३,१४ विराट्त्रिष्टुप्; ३,९,१० त्रिष्टुप्; ४,८
    पादनिचृत्त्रिष्टुप्; ५ आर्चीभुरिक्त्रिष्टुप्, ६ निचृत्त्रिष्टुप्; ११ निचृज्जगती । स्वरः - १-१०, १२-१४
    धवतः; ११ निषादः उदीरतामवर उत्परास उन्मध्यमाः पितरः सोम्यासः । असुं य ईयुरवृका ऋतज्ञास्ते नोऽवन्तु
    पितरो हवेषु ॥ १०।०१५।०१ इदं पितृभ्यो नमो अस्त्वद्य ये पूर्वासो य उपरास ईयुः । ये पार्थिवे रजस्या निषत्ता
    ये वा नूनं सुवृजनासु विक्षु ॥ १०।०१५।०२ आहं पितॄन्सुविदत्राँ अवित्सि नपातं च विक्रमणं च विष्णोः ।
    बर्हिषदो ये स्वधया सुतस्य भजन्त पित्वस्त इहागमिष्ठाः ॥ १०।०१५।०३ बर्हिषदः पितर ऊत्य१र्वागिमा वो हव्या
    चकृमा जुषध्वम् । त आ गतावसा शंतमेनाथा नः शं योररपो दधात ॥ १०।०१५।०४ उपहूताः पितरः सोम्यासो बर्हिष्येषु
    निधिषु प्रियेषु । त आ गमन्तु त इह श्रुवन्त्वधि ब्रुवन्तु तेऽवन्त्वस्मान् ॥ १०।०१५।०५ आच्या जानु दक्षिणतो
    निषद्येमं यज्ञमभि गृणीत विश्वे । मा हिंसिष्ट पितरः केन चिन्नो यद्व आगः पुरुषता कराम ॥ १०।०१५।०६ आसीनासो
    अरुणीनामुपस्थे रयिं धत्त दाशुषे मर्त्याय । पुत्रेभ्यः पितरस्तस्य वस्वः प्र यच्छत त इहोर्जं दधात ॥
    १०।०१५।०७ ये नः पूर्वे पितरः सोम्यासोऽनूहिरे सोमपीथं वसिष्ठाः । तेभिर्यमः संरराणो हवींष्युशन्नुशद्भिः
    प्रतिकाममत्तु ॥ १०।०१५।०८ ये तातृषुर्देवत्रा जेहमाना होत्राविदः स्तोमतष्टासो अर्कैः । आग्ने याहि सुविदत्रेभिरर्वाङ्सत्यैः
    कव्यैः पितृभिर्घर्मसद्भिः ॥ १०।०१५।०९ ये सत्यासो हविरदो हविष्पा इन्द्रेण देवैः सरथं दधानाः । आग्ने
    याहि सहस्रं देववन्दैः परैः पूर्वैः पितृभिर्घर्मसद्भिः ॥ १०।०१५।१० अग्निष्वात्ताः पितर एह गच्छत सदःसदः
    सदत सुप्रणीतयः । अत्ता हवींषि प्रयतानि बर्हिष्यथा रयिं सर्ववीरं दधातन ॥ १०।०१५।११ त्वमग्न ईळितो जातवेदोऽवाड्ढव्यानि
    सुरभीणि कृत्वी । प्रादाः पितृभ्यः स्वधया ते अक्षन्नद्धि त्वं देव प्रयता हवींषि ॥ १०।०१५।१२ ये चेह
    पितरो ये च नेह याँश्च विद्म याँ उ च न प्रविद्म । त्वं वेत्थ यति ते जातवेदः स्वधाभिर्यज्ञं सुकृतं जुषस्व
    ॥ १०।०१५।१३ ये अग्निदग्धा ये अनग्निदग्धा मध्ये दिवः स्वधया मादयन्ते । तेभिः स्वराळसुनीतिमेतां यथावशं
    तन्वं कल्पयस्व ॥ १०।०१५।१४ ॥निस्वरः ॥ पितृसूक्तं
