id: dvaparayugemartyaihkriyamanamshrikrishnastotram
category: stotram
name:
  english: dvaparayugemartyaihkriyamanamshrikrishnastotram
  devanagari: द्वापरयुगेमर्त्यैःक्रियमाणंश्रीकृष्णस्तोत्रम्
content:
  english: dvaparayuge martyaih kriyamanam shrikrishnastotram namaste vasudevaya namah sankarshanaya ca
    | pradyumnayaniruddhaya tubhyam bhagavate namah || 29|| narayanaya rishaye purushaya mahatmane | vishveshvaraya
    vishvaya sarvabhutatmane namah || 30|| iti shrimadbhagavatamahapurane ekadashaskandhe pancamadhyayantargatam
    dvaparayuge martyaih kriyamanam shrikrishnastotram samaptam | bhagavatapurana | adhyaya 11
  devanagari: द्वापरयुगे मर्त्यैः क्रियमाणं श्रीकृष्णस्तोत्रम् नमस्ते वासुदेवाय नमः सङ्कर्षणाय च । प्रद्युम्नायानिरुद्धाय
    तुभ्यं भगवते नमः ॥ २९॥ नारायणाय ऋषये पुरुषाय महात्मने । विश्वेश्वराय विश्वाय सर्वभूतात्मने नमः ॥ ३०॥
    इति श्रीमद्भागवतमहापुराणे एकादशस्कन्धे पञ्चमाध्यायान्तर्गतं द्वापरयुगे मर्त्यैः क्रियमाणं श्रीकृष्णस्तोत्रं
    समाप्तम् । भागवतपुराण । अध्याय ११
meaning: {}
