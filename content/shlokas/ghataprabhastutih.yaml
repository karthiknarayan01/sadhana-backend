id: ghataprabhastutih
category: stotram
name:
  english: ghataprabhastutih
  devanagari: घटप्रभास्तुतिः
content:
  english: 80 ghataprabhambu me kuryat sadyo hemaghataprabham | upalabdhi yato bhumna upalabdhirbhavishyati
    || 1|| iti shrivasudevanandasarasvativiracita ghataprabhastutih samapta |
  devanagari: ८० घटप्रभाम्बु मे कुर्यात् सद्यो हेमघटप्रभाम् । उपलब्धि यतो भूम्न उपलब्धिर्भविष्यति ॥ १॥
    इति श्रीवासुदेवानन्दसरस्वतीविरचिता घटप्रभास्तुतिः समाप्ता ।
meaning: {}
