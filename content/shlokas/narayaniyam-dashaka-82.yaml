id: narayaniyam-dashaka-82
category: stotram
name:
  english: Narayaniyam Dashaka 82
content:
  english: pradyumno raukmineyah sa khalu tava kala shambarenahritastam hatva ratya sahapto nijapuramaharadrukmikanyam
    ca dhanyam | tatputro'thaniruddho gunanidhiravahadrocanam rukmipautrim tatrodvahe gatastvam nyavadhi
    musalina rukmyapi dyutavairat || || banasya sa balisutasya sahasrabaho rmaheshvarasya mahita duhita
    kilosha | tvatpautramenamaniruddhamadrishtapurvam svapne'nubhuya bhagavan virahatura'bhut || || yoginyativa
    kushala khalu citralekha tasyah sakhi vilikhati tarunanasheshan | tatraniruddhamushaya viditam nishaya
    maneshta yogabalato bhavato niketat || || kanyapure dayitaya sukhamaramantam cainam kathancana babandhushi
    sharvabandhau | shrinaradoktatadudantadurantaroshai stvam tasya shonitapuram yadubhirnyarundhah ||
    || puripalashshailapriyaduhitrinatho'sya bhagavan samam bhutavratairyadubalamashankam nirurudhe |
    mahaprano bano jhatiti yuyudhanenayuyudhe guhah pradyumnena tvamapi purahantra jaghatishe || || niruddhasheshastre
    mumuhushi tavastrena girishe druta bhuta bhitah pramathakulavirah pramathitah | paraskandt skandah
    kusumasharabanaishca sacivah sa kumbhando bhandam navamiva balenashu bibhide || || capanam pancashatya
    prasabhamupagate chinnacape'tha bane vyarthe yate sameto jvarapatirashanairajvari tvajjvarena | jnani
    stutva'tha datva tava caritajusham vijvaram sa jvaro'gat prayo'ntarjnanavanto'pi ca bahutamasa raudraceshta
    hi raudrah || || banam nanayudhogram punarabhipatitam darpadoshadvitanvan nirlunasheshadosham sapadi
    bubudhusha shankarenopagitah | tadvaca shishtabahudvitayamubhayato nirbhayam tatpriyam tam muktva
    taddattamano nijapuramagamah saniruddhah sahoshah || || muhustavacchakram varunamajayo nandaharane
    yamam balanitau davadahanapane'nilasakham | vidhim vatsasteye girishamiha banasya samare vibho vishvotkarshi
    tadayamavataro jayati te || || dvijarusha krikalasavapurdharam nriganripam tridivalayamapayan | nijajane
    dvijabhaktimanuttamamupadishan pavaneshvar pahi mam ||
  devanagari: प्रद्युम्नो रौक्मिणेयः स खलु तव कला शम्बरेणाहृतस्तं हत्वा रत्या सहाप्तो निजपुरमहरद्रुक्मिकन्यां
    च धन्याम् । तत्पुत्रोऽथानिरुद्धो गुणनिधिरवहद्रोचनां रुक्मिपौत्रीं तत्रोद्वाहे गतस्त्वं न्यवधि मुसलिना
    रुक्म्यपि द्यूतवैरात् ॥ ॥ बाणस्य सा बलिसुतस्य सहस्रबाहो र्माहेश्वरस्य महिता दुहिता किलोषा । त्वत्पौत्रमेनमनिरुद्धमदृष्टपूर्वं
    स्वप्नेऽनुभूय भगवन् विरहातुराऽभूत् ॥ ॥ योगिन्यतीव कुशला खलु चित्रलेखा तस्याः सखी विलिखती तरुणानशेषान्
    । तत्रानिरुद्धमुषया विदितं निशाया मानेष्ट योगबलतो भवतो निकेतात् ॥ ॥ कन्यापुरे दयितया सुखमारमन्तं चैनं
    कथञ्चन बबन्धुषि शर्वबन्धौ । श्रीनारदोक्ततदुदन्तदुरन्तरोषै स्त्वं तस्य शोणितपुरं यदुभिर्न्यरुन्धाः
    ॥ ॥ पुरीपालश्शैलप्रियदुहितृनाथोऽस्य भगवान् समं भूतव्रातैर्यदुबलमशङ्कं निरुरुधे । महाप्राणो बाणो झटिति
    युयुधानेनयुयुधे गुहः प्रद्युम्नेन त्वमपि पुरहन्त्रा जघटिषे ॥ ॥ निरुद्धाशेषास्त्रे मुमुहुषि तवास्त्रेण
    गिरिशे द्रुता भूता भीताः प्रमथकुलवीराः प्रमथिताः । परास्कन्द्त् स्कन्दः कुसुमशरबाणैश्च सचिवः स कुम्भाण्डो
    भाण्डं नवमिव बलेनाशु बिभिदे ॥ ॥ चापानां पञ्चशत्या प्रसभमुपगते छिन्नचापेऽथ बाणे व्यर्थे याते समेतो
    ज्वरपतिरशनैरज्वरि त्वज्ज्वरेण । ज्ञानी स्तुत्वाऽथ दत्वा तव चरितजुषां विज्वरं स ज्वरोऽगात् प्रायोऽन्तर्ज्ञानवन्तोऽपि
    च बहुतमसा रौद्रचेष्टा हि रौद्राः ॥ ॥ बाणं नानायुधोग्रं पुनरभिपतितं दर्पदोषाद्वितन्वन् निर्लूनाशेषदोषं
    सपदि बुबुधुषा शङ्करेणोपगीतः । तद्वाचा शिष्टबाहुद्वितयमुभयतो निर्भयं तत्प्रियं तं मुक्त्वा तद्दत्तमानो
    निजपुरमगमः सानिरुद्धः सहोषः ॥ ॥ मुहुस्तावच्छक्रं वरुणमजयो नन्दहरणे यमं बालानीतौ दवदहनपानेऽनिलसखम्
    । विधिं वत्सस्तेये गिरिशमिह बाणस्य समरे विभो विश्वोत्कर्षी तदयमवतारो जयति ते ॥ ॥ द्विजरुषा कृकलासवपुर्धरं
    नृगनृपं त्रिदिवालयमापयन् । निजजने द्विजभक्तिमनुत्तमामुपदिशन् पवनेश्वर् पाहि माम् ॥
