id: hayagrivapujastotram
category: stotram
name:
  english: hayagrivapujastotram
  devanagari: हयग्रीवपूजास्तोत्रम्
content:
  english: dhyatvarcayedvishnum mulamantrena shankara || 14|| tatashcavahayedrudra devata asanasya yah
    | om hayagrivasanasya agacchata ca devatah || 15|| avahya mandale tastu pujayetsvastikadike | dvare
    dhaturvidhatushca puja karya vrishadhvaja || 16|| samastaparivaraya acyutaya nama iti | asya madhye'rcanam
    karyam dvare ganganca pujayet || 17|| yamunam ca mahadevim shankhapadmanidhi tatha | garudam pujayedagre
    madhye shaktinca pujayet || 18|| adharakhyam mahadeva tatah kurmam samarcayet | anantam prithivim
    pashcaddharmajnanau tato'cayet | vairagyamatha caishvaryamagneyadishu pujayet || 19|| adharmajnanavairagyanaishvaryadimstu
    purvatah | sattvam rajastamashcaiva madhyadeshe'tha pujayet || 20|| kandam nalam ca padmam ca madhye
    caiva prapujayet | arkasomagnisamjnanam mandalanam hi pujanam | madhyadeshe prakartavyamiti rudra
    prakirtitam || 21|| vimalotkarshini jnana kriyayoge vrishadhvaja | prahvi satya tatheshananugrahah
    shaktayo hyamuh || 22|| purvadishu ca patreshu pujyashca vimaladayah | anugraha karnikayam pujya shreyo'rthibhirnaraih
    || 23|| pranavadyairnamo'ntaishca caturthyantaishca namabhih | mantrairebhirmahadeva asanam paripujayet
    || 24|| snanagandhapradanena pushpadhupapradanatah | dipanaivedyadanena asanasyarcanam shubham ||
    25|| kartavyam vidhinanena iti te hara kirtitam | tatashcavahayeddevam hayagrivam sureshvaram || 26||
    vamanasaputenaiva agacchantam vicintayet | agacchatah prayogena mulamantrena shankara || 27|| avahanam
    prakartavyam devadevasya shankhinah | avahya mandale tasya nyasam kuryadatandritah || 28|| nyasam
    kritva ca tatrastham cintayetparameshvaram | hayagrivam mahadevam surasuranamaskritam || 29|| indradilokapalaishca
    samyutam vishnumavyayam | dhyatva pradarshayenmudrah shankhacakradikah shubhah || 30|| padyarghyacamaniyani
    tato dadyacca vishnave | snapayecca tato devam padmanabhamanamayam || 31|| devam samsthapya vidhivadvastram
    dadyadvrishadhvaja | tato hyacamanam dadyadupavitam tatah shubham || 32|| tatashca mandale rudram
    dhyayeddevam pareshvaram | dhyatva padyadikam bhuyo dadyaddevaya shankara || 33|| dadyadbhairavadevaya
    mulamantrena shankara | om ksham hridayaya namah anena hridayam yajet || 34|| om kshim shirase namashca
    shirasah pujanam bhavet | om kshum shikhayai namashca shikhametena pujayet || 35|| om kshaim kavacaya
    namah kavacam paripujayet | om kshaum netraya namashca netram canena pujayet || 36|| om kshah astraya
    nama ityastram canena pujayet | hridayam ca shirashcaiva shikham ca kavacam tatha || 37|| purvadishu
    pradesheshu hyetastu paripujayet | koneshvastram yajedrudra netram madhye prapujayet || 38|| pujayetparamam
    devim lakshmim lakshmipradam shubham | shankham padmam tatha cakram gadam purvadito'rcayet || 39||
    khadgam ca musalam pashamankusham sasharam dhanuh | pujayetpurvato rudra ebhirmantraih svanamakaih
    || 40|| shrivatsam kaustubham malam tatha pitambaram shubham | pujayetpurvato rudra shankhacakragadadharam
    || 41|| brahmanam naradam siddham gurum paragurum tatha | guroshca paduke tadvatparamasya gurostatha
    || 42|| indram savahanam catha parivarayutam tatha | agnim yamam nirritim ca varunam vayumeva ca ||
    43|| somamishananagamshca brahmanam paripujayet | purvadi cordhvaparyantam pujayedvrishabhadhvaja
    || 44|| vajram shaktim tatha dandam khadgam pasham dhvajam gadam | trishulam cakrapadme ca ayudhanyatha
    pujayet || 45|| vishvaksenam tato devamaishanyam dishi pujayet | ebhirmantrairnamo'ntaishca pranavadyairvrishadhvaja
    || 46|| puja karya mahadeva hyanantasya vrishadhvaja | devasya mulamantrena puja karya vrishadhvaja
    || gandham pushpam tatha dhupam dipam naivedyameva ca || 47|| pradakshinam namaskaram japyam tasmai
    samarpayet | stuvita canaya stutya pranavadyairvrishadhvaja || 48|| atha stotram om namo hayashirase
    vidyadhyakshaya vai namah | namo vidyasvarupaya vidyadatre namonamah || 49|| namah shantaya devaya
    trigunayatmane namah | surasuranihantre ca sarvadushtavinashine || 50|| sarvalokadhipataye brahmarupaya
    vai namah | namashceshvaravandyaya shankhacakradharaya ca || 51|| nama adyaya dantaya sarvasattvahitaya
    ca | trigunayagunayaiva brahmavishnusvarupine || kartre hartre sureshaya sarvagaya namonamah || 52||
    ityevam samstavam kritva devadevam vicintayet | hritpadme vimale rudra shankhacakragadadharam || 53||
    suryakotipratikasham sarvavayavasundaram | hayagrivam maheshesham paramatmanamavyayam || 54|| iti
    te kathita puja hayagrivasya shankara | yah pathetparaya bhaktya sa gacchetparamam padam || 55|| iti
    shrigarude mahapurane purvakhande prathamamshakhye acarakande hayagrivapujavidhirnama catustrimsho'dhyayah
    ||
  devanagari: ध्यात्वार्चयेद्विष्णुं मूलमन्त्रेण शङ्कर ॥ १४॥ ततश्चावाहयेद्रुद्र देवता आसनस्य याः । ॐ हयग्रीवासनस्य
    आगच्छत च देवताः ॥ १५॥ आवाह्य मण्डले तास्तु पूजयेत्स्वस्तिकादिके । द्वारे धातुर्विधातुश्च पूजा कार्या
    वृषध्वज ॥ १६॥ समस्तपरिवाराय अच्युताय नम इति । अस्य मध्येऽर्चनं कार्यं द्वारे गङ्गाञ्च पूजयेत् ॥ १७॥
    यमुनां च महादेवीं शङ्खपद्मनिधी तथा । गरुडं पूजयेदग्रे मध्ये शक्तिञ्च पूजयेत् ॥ १८॥ आधाराख्यां महादेव
    ततः कूर्मं समर्चयेत् । अनन्तं पृथिवीं पश्चाद्धर्मज्ञानौ ततोऽचयेत् । वैराग्यमथ चैश्वर्यमाग्नेयादिषु
    पूजयेत् ॥ १९॥ अधर्माज्ञानावैराग्यानैश्वर्यादींस्तु पूर्वतः । सत्त्वं रजस्तमश्चैव मध्यदेशेऽथ पूजयेत्
    ॥ २०॥ कन्दं नालं च पद्मं च मध्ये चैव प्रपूजयेत् । अर्कसोमाग्निसंज्ञानां मण्डलानां हि पूजनम् । मध्यदेशे
    प्रकर्तव्यमिति रुद्र प्रकीर्तितम् ॥ २१॥ विमलोत्कर्षिणी ज्ञाना क्रियायोगे वृषध्वज । प्रह्वी सत्या तथेशानानुग्रहाः
    शक्तयो ह्यमूः ॥ २२॥ पूर्वादिषु च पत्रेषु पूज्याश्च विमलादयः । अनुग्रहा कर्णिकायां पूज्या श्रेयोऽर्थिभिर्नरैः
    ॥ २३॥ प्रणवाद्यैर्नमोऽन्तैश्च चतुर्थ्यन्तैश्च नामभिः । मन्त्रैरेभिर्महादेव आसनं परिपूजयेत् ॥ २४॥ स्नानगन्धप्रदानेन
    पुष्पधूपप्रदानतः । दीपनैवेद्यदानेन आसनस्यार्चनं शुभम् ॥ २५॥ कर्तव्यं विधिनानेन इति ते हर कीर्तितम्
    । ततश्चावाहयेद्देवं हयग्रीवं सुरेश्वरम् ॥ २६॥ वामनासापुटेनैव आगच्छन्तं विचिन्तयेत् । आगच्छतः प्रयोगेण
    मूलमन्त्रेण शङ्कर ॥ २७॥ आवाहनं प्रकर्तव्यं देवदेवस्य शङ्खिनः । आवाह्य मण्डले तस्य न्यासं कुर्यादतन्द्रितः
    ॥ २८॥ न्यासं कृत्वा च तत्रस्थं चिन्तयेत्परमेश्वरम् । हयग्रीवं महादेवं सुरासुरनमस्कृतम् ॥ २९॥ इन्द्रादिलोकपालैश्च
    संयुतं विष्णुमव्ययम् । ध्यात्वा प्रदर्शयेन्मुद्राः शङ्खचक्रादिकाः शुभाः ॥ ३०॥ पाद्यार्घ्याचमनीयानि
    ततो दद्याच्च विष्णवे । स्नापयेच्च ततो देवं पद्मनाभमनामयम् ॥ ३१॥ देवं संस्थाप्य विधिवद्वस्त्रं दद्याद्वृषध्वज
    । ततो ह्याचमनं दद्यादुपवीतं ततः शुभम् ॥ ३२॥ ततश्च मण्डले रुद्रं ध्यायेद्देवं परेश्वरम् । ध्यात्वा
    पाद्यादिकं भूयो दद्याद्देवाय शङ्कर ॥ ३३॥ दद्याद्भैरवदेवाय मूलमन्त्रेण शङ्कर । ॐ क्षां हृदयाय नमः अनेन
    हृदयं यजेत् ॥ ३४॥ ॐ क्षीं शिरसे नमश्च शिरसः पूजनं भवेत् । ॐ क्षूं शिखायै नमश्च शिखामेतेन पूजयेत् ॥
    ३५॥ ॐ क्षैं कवचाय नमः कवचं परिपूजयेत् । ॐ क्षौं नेत्राय नमश्च नेत्रं चानेन पूजयेत् ॥ ३६॥ ॐ क्षः अस्त्राय
    नम इत्यस्त्रं चानेन पूजयेत् । हृदयं च शिरश्चैव शिखां च कवचं तथा ॥ ३७॥ पूर्वादिषु प्रदेशेषु ह्येतास्तु
    परिपूजयेत् । कोणेष्वस्त्रं यजेद्रुद्र नेत्रं मध्ये प्रपूजयेत् ॥ ३८॥ पूजयेत्परमां देवीं लक्ष्मीं लक्ष्मीप्रदां
    शुभाम् । शङ्खं पद्मं तथा चक्रं गदां पूर्वादितोऽर्चयेत् ॥ ३९॥ खड्गं च मुसलं पाशमङ्कुशं सशरं धनुः ।
    पूजयेत्पूर्वतो रुद्र एभिर्मन्त्रैः स्वनामकैः ॥ ४०॥ श्रीवत्सं कौस्तुभं मालां तथा पीताम्बरं शुभम् ।
    पूजयेत्पूर्वतो रुद्र शङ्खचक्रगदाधरम् ॥ ४१॥ ब्रह्माणं नारदं सिद्धं गुरुं परगुरुं तथा । गुरोश्च पादुके
    तद्वत्परमस्य गुरोस्तथा ॥ ४२॥ इन्द्रं सवाहनं चाथ परिवारयुतं तथा । अग्निं यमं निरृतिं च वरुणं वायुमेव
    च ॥ ४३॥ सोममीशाननागांश्च ब्रह्माणं परिपूजयेत् । पूर्वादि चोर्ध्वपर्यन्तं पूजयेद्वृषभध्वज ॥ ४४॥ वज्रं
    शक्तिं तथा दण्डं खड्गं पाशं ध्वजं गदाम् । त्रिशूलं चक्रपद्मे च आयुधान्यथ पूजयेत् ॥ ४५॥ विष्वक्सेनं
    ततो देवमैशान्यां दिशि पूजयेत् । एभिर्मन्त्रैर्नमोऽन्तैश्च प्रणवाद्यैर्वृषध्वज ॥ ४६॥ पूजा कार्या महादेव
    ह्यनन्तस्य वृषध्वज । देवस्य मूलमन्त्रेण पूजा कार्या वृषध्वज ॥ गन्धं पुष्पं तथा धूपं दीपं नैवेद्यमेव
    च ॥ ४७॥ प्रदक्षिणं नमस्कारं जप्यं तस्मै समर्पयेत् । स्तुवीत चानया स्तुत्या प्रणवाद्यैर्वृषध्वज ॥ ४८॥
    अथ स्तोत्रं ॐ नमो हयशिरसे विद्याध्यक्षाय वै नमः । नमो विद्यास्वरूपाय विद्यादात्रे नमोनमः ॥ ४९॥ नमः
    शान्ताय देवाय त्रिगुणायात्मने नमः । सुरासुरनिहन्त्रे च सर्वदुष्टविनाशिने ॥ ५०॥ सर्वलोकाधिपतये ब्रह्मरूपाय
    वै नमः । नमश्चेश्वरवन्द्याय शङ्खचक्रधारय च ॥ ५१॥ नम आद्याय दान्ताय सर्वसत्त्वहिताय च । त्रिगुणायागुणायैव
    ब्रह्मविष्णुस्वरूपिणे ॥ कर्त्रे हर्त्रे सुरेशाय सर्वगाय नमोनमः ॥ ५२॥ इत्येवं संस्तवं कृत्वा देवदेवं
    विचिन्तयेत् । हृत्पद्मे विमले रुद्र शङ्खचक्रगदाधरम् ॥ ५३॥ सूर्यकोटिप्रतीकाशं सर्वावयवसुन्दरम् । हयग्रीवं
    महेशेशं परमात्मानमव्ययम् ॥ ५४॥ इति ते कथिता पूजा हयग्रीवस्य शङ्कर । यः पठेत्परया भक्त्या स गच्छेत्परमं
    पदम् ॥ ५५॥ इति श्रीगारुडे महापुराणे पूर्वखण्डे प्रथमांशाख्ये आचारकाण्डे हयग्रीवपूजाविधिर्नाम चतुस्त्रिंशोऽध्यायः
    ॥
