id: ramakrishnavandanastotram
category: stotram
name:
  english: ramakrishnavandanastotram
  devanagari: रामकृष्णवन्दनास्तोत्रम्
content:
  english: shriramakrishnavandanastotram jagajjatam tyaktam himagirisuta padakamale shariradyah prana
    valaya iva yenarpanamitah | trivargoyacchraddhavimala gurubhaktyahi sulabho numo ramakrishnam suranutapadam
    bhedarahitam || 1|| svayam tyaktam proktam hridayakarashakhollikhanatah pura ramat krishnah samabhavadananyo
    na hi parah | idanimayantam nayanavishayatvam janibhritam pravishto dehe'sminniti kanakakamatigataya
    || 2|| yadadvaitam shantam satatamaghamayavirahitam cidanandam shuddham prakritisahitam premavashagam
    | tvamevavirbhutah karanavishaye durlabhataro jagajjivaih krir̤anmahadamitaviryo rasatamah || 3||
    tvameva shriramo madhuripuharirgopatanayah svayambhutashcadyah paramapurusho natha ramana | vivadam
    dharmanam shamayitumanashcinmayavapuh prasanno lokanam prakatitamakarshih punariha || 4|| tvadiyanghridvandvaksharitamakarandam
    pratidisham sada payam payam kalitabhavabhitim prashamayan | bhajan samyanandam vimalahridayo yati
    paramam jananam sangho'yam nikhilabhuvi shantim muhuraho || 5|| samadhavanandam punarativishuddham
    harikatha
  devanagari: श्रीरामकृष्णवन्दनास्तोत्रम् जगज्जातं त्यक्तं हिमगिरिसुता पादकमले शरीराद्याः प्राणा वलय इव
    येनार्पणमिताः । त्रिवर्गोयच्छ्रद्धाविमल गुरुभक्त्याहि सुलभो नुमो रामकृष्णं सुरनुतपदं भेदरहितम् ॥ १॥
    स्वयं त्यक्तं प्रोक्तं हृदयकरशाखोल्लिखनतः पुरा रामात् कृष्णः समभवदनन्यो न हि परः । इदानीमायान्तं नयनविषयत्वं
    जनिभृतां प्रविष्टो देहेऽस्मिन्निति कनककामातिगतया ॥ २॥ यदद्वैतं शान्तं सततमघमायाविरहितं चिदानन्दं शुद्धं
    प्रकृतिसहितं प्रेमवशगम् । त्वमेवाविर्भूतः करणविषये दुर्लभतरो जगज्जीवैः क्रीड़न्महदमितवीर्यो रसतमः
    ॥ ३॥ त्वमेव श्रीरामो मधुरिपुहरिर्गोपतनयः स्वयम्भूतश्चाद्यः परमपुरुषो नाथ रमण । विवादं धर्माणां शमयितुमनाश्चिन्मयवपुः
    प्रसन्नो लोकानां प्रकटितमकार्षीः पुनरिह ॥ ४॥ त्वदीयाङ्घ्रिद्वन्द्वक्षरितमकरन्दं प्रतिदिशं सदा पायं
    पायं कलितभवभीतिं प्रशमयन् । भजन् साम्यानन्दं विमलहृदयो याति परमां जनानां सङ्घोऽयं निखिलभुवि शान्तिं
    मुहुरहो ॥ ५॥ समाधावानन्दं पुनरतिविशुद्धं हरिकथा
meaning: {}
