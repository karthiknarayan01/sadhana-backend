id: angirasakritamshivastotram
category: stotram
name:
  english: angirasakritamshivastotram
  devanagari: आन्गीरसकृतंशिवस्तोत्रम्
content:
  english: angirasakritam shivastotram angirasa uvaca | jaya shankara shanta shashankaruce rucirarthada
    sarvada sarvashuce | shucidatta grihita mahopahrite hritabhaktajanoddhatatapatate || 1|| tatasarvahridambara
    varadanate natavrijinamahavana dahakrite | kritavividhacaritratano sutano tanuvishikhavishoshanadhairyanidhe
    || 2|| nidhanadivivarjitakritanatikritkritivihitamanorathapannagabhrit | nagabhartrisutarpitavamavapuh
    svavapuhparipuritasarvajagat || 3|| trijaganmayarupa virupa sudrigdrigudancanakuncana kritahutabhuk
    | bhavabhutapate pramathaikapate patiteshvapi dattakaraprasrite || 4|| prasutakhilabhutalasamvaranapranavadhvanisaudhasudhamshudhara
    | vararajakumarikaya paraya paritah paritushta nato'smi shiva || 5|| shivadeva girisha mahesha vibho
    vibhavaprada girisha shiveshamrida | mridayodupatidhra jagattritayam kritayantranabhaktivighatakritam
    || 6|| na kritanta ta esha bibhemi hara praharashu mahaghamamoghamate | na matantaramanyadavaini shivam
    shivapadanateh pranato'smi tatah || 7|| vitate'tra jagatyakhile'ghaharam hara toshanameva param gunavan
    | gunahinamahinamahavalayam pralayantakamisha nato'smi tatah || 8|| iti shriskadapurane kashikhande
    purvarddhe saptadashadhyayantargatam angirasakritam shivastotram samaptam | skandapurana | kashikhanda
    | purvakhanda 1 | adhyaya 17
  devanagari: आङ्गीरसकृतं शिवस्तोत्रम् आङ्गिरस उवाच । जय शङ्कर शान्त शशाङ्करुचे रुचिरार्थद सर्वद सर्वशुचे
    । शुचिदत्त गृहीत महोपहृते हृतभक्तजनोद्धततापतते ॥ १॥ ततसर्वहृदम्बर वरदनते नतवृजिनमहावन दाहकृते । कृतविविधचरित्रतनो
    सुतनो तनुविशिखविशोषणधैर्यनिधे ॥ २॥ निधनादिविवर्जितकृतनतिकृत्कृतिविहितमनोरथपन्नगभृत् । नगभर्तृसुतार्पितवामवपुः
    स्ववपुःपरिपूरितसर्वजगत् ॥ ३॥ त्रिजगन्मयरूप विरूप सुदृग्दृगुदञ्चनकुञ्चन कृतहुतभुक् । भवभूतपते प्रमथैकपते
    पतितेष्वपि दत्तकरप्रसृते ॥ ४॥ प्रसूताखिलभूतलसंवरणप्रणवध्वनिसौधसुधांशुधर । वरराजकुमारिकया परया परितः
    परितुष्ट नतोऽस्मि शिव ॥ ५॥ शिवदेव गिरीश महेश विभो विभवप्रद गिरिश शिवेशमृड । मृडयोडुपतिध्र जगत्त्रितयं
    कृतयन्त्रणभक्तिविघातकृताम् ॥ ६॥ न कृतान्त त एष बिभेमि हर प्रहराशु महाघममोघमते । न मतान्तरमन्यदवैनि
    शिवं शिवपादनतेः प्रणतोऽस्मि ततः ॥ ७॥ विततेऽत्र जगत्यखिलेऽघहरं हर तोषणमेव परं गुणवन् । गुणहीनमहीनमहावलयं
    प्रलयान्तकमीश नतोऽस्मि ततः ॥ ८॥ इति श्रीस्कादपुराणे काशीखण्डे पूर्वार्द्धे सप्तदशाध्यायान्तर्गतं आङ्गीरसकृतं
    शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । काशीखण्ड । पूर्वखण्ड १ । अध्याय १७
