id: panchamukha-hanuman-kavacham
category: stotram
name:
  english: Panchamukha Hanuman Kavacham
content:
  english: '|| pancamukha hanumatkavacam || asya shri pancamukhahanumanmantrasya brahma rishih gayatrichandah
    pancamukhavirat hanuman devata hrim bijam shrim shaktih kraum kilakam krum kavacam kraim astraya phat
    iti digbandhah | shri garuda uvaca | atha dhyanam pravakshyami shrinu sarvangasundari | yatkritam
    devadevena dhyanam hanumatah priyam || || pancavaktram mahabhimam tripancanayanairyutam | bahubhirdashabhiryuktam
    sarvakamarthasiddhidam || || purvam tu vanaram vaktram kotisuryasamaprabham | damshtrakaralavadanam
    bhrikutikutilekshanam || || asyaiva dakshinam vaktram narasimham mahadbhutam | atyugratejovapusham
    bhishanam bhayanashanam || || pashcimam garudam vaktram vakratundam mahabalam | sarvanagaprashamanam
    vishabhutadikrintanam || || uttaram saukaram vaktram krishnam diptam nabhopamam | patalasimhavetalajvararogadikrintanam
    || || urdhvam hayananam ghoram danavantakaram param | yena vaktrena viprendra tarakakhyam mahasuram
    || || jaghana sharanam tatsyatsarvashatruharam param | dhyatva pancamukham rudram hanumantam dayanidhim
    || || khadgam trishulam khatvangam pashamankushaparvatam | mushtim kaumodakim vriksham dharayantam
    kamandalum || || bhindipalam jnanamudram dashabhirmunipungavam | etanyayudhajalani dharayantam bhajamyaham
    || || pretasanopavishtam tam sarvabharanabhushitam | divyamalyambaradharam divyagandhanulepanam |
    sarvashcaryamayam devam hanumadvishvatomukham || || pancasyamacyutamanekavicitravarna vaktram shashankashikharam
    kapirajavaryam | pitambaradimukutairupashobhitangam pingakshamadyamanisham manasa smarami || || markatesham
    mahotsaham sarvashatruharam param | shatrum samhara mam raksha shrimannapadamuddhara || || harimarkata
    markata mantramidam parilikhyati likhyati vamatale | yadi nashyati nashyati shatrukulam yadi muncati
    muncati vamalata || || om harimarkataya svaha | om namo bhagavate pancavadanaya purvakapimukhaya sakalashatrusamharakaya
    svaha | om namo bhagavate pancavadanaya dakshinamukhaya karalavadanaya narasimhaya sakalabhutapramathanaya
    svaha | om namo bhagavate pancavadanaya pashcimamukhaya garudananaya sakalavishaharaya svaha | om
    namo bhagavate pancavadanaya uttaramukhaya adivarahaya sakalasampatkaraya svaha | om namo bhagavate
    pancavadanaya urdhvamukhaya hayagrivaya sakalajanavashankaraya svaha | om asya shri pancamukhahanumanmantrasya
    shriramacandra rishih anushtupchandah pancamukhavirahanuman devata hanuman iti bijam vayuputra iti
    shaktih anjanisuta iti kilakam shriramadutahanumatprasadasiddhyarthe jape viniyogah | iti rishyadikam
    vinyaset | atha karanyasah | om anjanisutaya angushthabhyam namah | om rudramurtaye tarjanibhyam namah
    | om vayuputraya madhyamabhyam namah | om agnigarbhaya anamikabhyam namah | om ramadutaya kanishthikabhyam
    namah | om pancamukhahanumate karatalakaraprishthabhyam namah | atha anganyasah | om anjanisutaya
    hridayaya namah | om rudramurtaye shirase svaha | om vayuputraya shikhayai vashat | om agnigarbhaya
    kavacaya hum | om ramadutaya netratrayaya vaushat | om pancamukhahanumate astraya phat | pancamukhahanumate
    svaha iti digbandhah | atha dhyanam | vande vanaranarasimhakhagaratkrodashvavaktranvitam divyalankaranam
    tripancanayanam dedipyamanam ruca | hastabjairasikhetapustakasudhakumbhankushadrim halam khatvangam
    phanibhuruham dashabhujam sarvarivirapaham | atha mantrah | om shriramadutaya anjaneyaya vayuputraya
    mahabalaparakramaya sitaduhkhanivaranaya lankadahanakaranaya mahabalapracandaya phalgunasakhaya kolahalasakalabrahmandavishvarupaya
    saptasamudranirlanghanaya pingalanayanaya amitavikramaya suryabimbaphalasevanaya dushtanivaranaya
    drishtiniralankritaya sanjivinisanjivitangada lakshmanamahakapisainyapranadaya dashakanthavidhvamsanaya
    rameshtaya mahaphalgunasakhaya sitasahitaramavarapradaya shatprayogagamapancamukhavirahanumanmantrajape
    viniyogah | om harimarkatamarkataya bambambambambam vaushat svaha | om harimarkatamarkataya phamphamphamphampham
    phat svaha | om harimarkatamarkataya khenkhenkhenkhenkhem maranaya svaha | om harimarkatamarkataya
    lumlumlumlumlum akarshitasakalasampatkaraya svaha | om harimarkatamarkataya dhandhandhandhandham shatrustambhanaya
    svaha | om tantantantantam kurmamurtaye pancamukhavirahanumate parayantra paratantroccatanaya svaha
    | om kankhanganghamnam canchanjanjhamnam tanthandandhamnam tanthandandhannam pamphambambhammam yamramlamvam
    shamshamsamham lanksham svaha | iti digbandhah | om purvakapimukhaya pancamukhahanumate tantantantantam
    sakalashatrusamharanaya svaha | om dakshinamukhaya pancamukhahanumate karalavadanaya narasimhaya om
    hram hrim hrum hraim hraum hrah sakalabhutapretadamanaya svaha | om pashcimamukhaya garudananaya pancamukhahanumate
    mammammammammam sakalavishaharaya svaha | om uttaramukhaya adivarahaya lamlamlamlamlam nrisimhaya
    nilakanthamurtaye pancamukhahanumate svaha | om urdhvamukhaya hayagrivaya rumrumrumrumrum rudramurtaye
    sakalaprayojananirvahakaya svaha | om anjanisutaya vayuputraya mahabalaya sitashokanivaranaya shriramacandrakripapadukaya
    mahaviryapramathanaya brahmandanathaya kamadaya pancamukhavirahanumate svaha | bhutapretapishacabrahmarakshasa
    shakinidakinyantarikshagraha parayantra paratantroccatanaya svaha | sakalaprayojananirvahakaya pancamukhavirahanumate
    shriramacandravaraprasadaya janjanjanjanjam svaha | idam kavacam pathitva tu mahakavacam pathennarah
    | ekavaram japet stotram sarvashatrunivaranam || || dvivaram tu pathennityam putrapautrapravardhanam
    | trivaram ca pathennityam sarvasampatkaram shubham || || caturvaram pathennityam sarvaroganivaranam
    | pancavaram pathennityam sarvalokavashankaram || || shadvaram ca pathennityam sarvadevavashankaram
    | saptavaram pathennityam sarvasaubhagyadayakam || || ashtavaram pathennityamishtakamarthasiddhidam
    | navavaram pathennityam rajabhogamavapnuyat || || dashavaram pathennityam trailokyajnanadarshanam
    | rudravrittim pathennityam sarvasiddhirbhaveddhrivam || || nirbalo rogayuktashca mahavyadhyadipiditah
    | kavacasmaranenaiva mahabalamavapnuyat || || iti sudarshanasamhitayam shriramacandrasitaproktam shri
    pancamukhahanumatkavacam |'
  devanagari: ॥ पञ्चमुख हनुमत्कवचम् ॥ अस्य श्री पञ्चमुखहनुमन्मन्त्रस्य ब्रह्मा ऋषिः गायत्रीछन्दः पञ्चमुखविराट्
    हनुमान् देवता ह्रीं बीजं श्रीं शक्तिः क्रौं कीलकं क्रूं कवचं क्रैं अस्त्राय फट् इति दिग्बन्धः । श्री
    गरुड उवाच । अथ ध्यानं प्रवक्ष्यामि शृणु सर्वाङ्गसुन्दरि । यत्कृतं देवदेवेन ध्यानं हनुमतः प्रियम् ॥
    ॥ पञ्चवक्त्रं महाभीमं त्रिपञ्चनयनैर्युतम् । बाहुभिर्दशभिर्युक्तं सर्वकामार्थसिद्धिदम् ॥ ॥ पूर्वं तु
    वानरं वक्त्रं कोटिसूर्यसमप्रभम् । दंष्ट्राकरालवदनं भृकुटीकुटिलेक्षणम् ॥ ॥ अस्यैव दक्षिणं वक्त्रं नारसिंहं
    महाद्भुतम् । अत्युग्रतेजोवपुषं भीषणं भयनाशनम् ॥ ॥ पश्चिमं गारुडं वक्त्रं वक्रतुण्डं महाबलम् । सर्वनागप्रशमनं
    विषभूतादिकृन्तनम् ॥ ॥ उत्तरं सौकरं वक्त्रं कृष्णं दीप्तं नभोपमम् । पातालसिंहवेतालज्वररोगादिकृन्तनम्
    ॥ ॥ ऊर्ध्वं हयाननं घोरं दानवान्तकरं परम् । येन वक्त्रेण विप्रेन्द्र तारकाख्यं महासुरम् ॥ ॥ जघान शरणं
    तत्स्यात्सर्वशत्रुहरं परम् । ध्यात्वा पञ्चमुखं रुद्रं हनूमन्तं दयानिधिम् ॥ ॥ खड्गं त्रिशूलं खट्वाङ्गं
    पाशमङ्कुशपर्वतम् । मुष्टिं कौमोदकीं वृक्षं धारयन्तं कमण्डलुम् ॥ ॥ भिन्दिपालं ज्ञानमुद्रां दशभिर्मुनिपुङ्गवम्
    । एतान्यायुधजालानि धारयन्तं भजाम्यहम् ॥ ॥ प्रेतासनोपविष्टं तं सर्वाभरणभूषितम् । दिव्यमाल्याम्बरधरं
    दिव्यगन्धानुलेपनम् । सर्वाश्चर्यमयं देवं हनुमद्विश्वतोमुखम् ॥ ॥ पञ्चास्यमच्युतमनेकविचित्रवर्ण वक्त्रं
    शशाङ्कशिखरं कपिराजवर्यम् । पीताम्बरादिमुकुटैरुपशोभिताङ्गं पिङ्गाक्षमाद्यमनिशं मनसा स्मरामि ॥ ॥ मर्कटेशं
    महोत्साहं सर्वशत्रुहरं परम् । शत्रुं संहर मां रक्ष श्रीमन्नापदमुद्धर ॥ ॥ हरिमर्कट मर्कट मन्त्रमिदं
    परिलिख्यति लिख्यति वामतले । यदि नश्यति नश्यति शत्रुकुलं यदि मुञ्चति मुञ्चति वामलता ॥ ॥ ॐ हरिमर्कटाय
    स्वाहा । ॐ नमो भगवते पञ्चवदनाय पूर्वकपिमुखाय सकलशत्रुसंहारकाय स्वाहा । ॐ नमो भगवते पञ्चवदनाय दक्षिणमुखाय
    करालवदनाय नरसिंहाय सकलभूतप्रमथनाय स्वाहा । ॐ नमो भगवते पञ्चवदनाय पश्चिममुखाय गरुडाननाय सकलविषहराय
    स्वाहा । ॐ नमो भगवते पञ्चवदनाय उत्तरमुखाय आदिवराहाय सकलसम्पत्कराय स्वाहा । ॐ नमो भगवते पञ्चवदनाय ऊर्ध्वमुखाय
    हयग्रीवाय सकलजनवशङ्कराय स्वाहा । ॐ अस्य श्री पञ्चमुखहनुमन्मन्त्रस्य श्रीरामचन्द्र ऋषिः अनुष्टुप्छन्दः
    पञ्चमुखवीरहनुमान् देवता हनुमान् इति बीजं वायुपुत्र इति शक्तिः अञ्जनीसुत इति कीलकं श्रीरामदूतहनुमत्प्रसादसिद्ध्यर्थे
    जपे विनियोगः । इति ऋष्यादिकं विन्यसेत् । अथ करन्यासः । ॐ अञ्जनीसुताय अङ्गुष्ठाभ्यां नमः । ॐ रुद्रमूर्तये
    तर्जनीभ्यां नमः । ॐ वायुपुत्राय मध्यमाभ्यां नमः । ॐ अग्निगर्भाय अनामिकाभ्यां नमः । ॐ रामदूताय कनिष्ठिकाभ्यां
    नमः । ॐ पञ्चमुखहनुमते करतलकरपृष्ठाभ्यां नमः । अथ अङ्गन्यासः । ॐ अञ्जनीसुताय हृदयाय नमः । ॐ रुद्रमूर्तये
    शिरसे स्वाहा । ॐ वायुपुत्राय शिखायै वषट् । ॐ अग्निगर्भाय कवचाय हुम् । ॐ रामदूताय नेत्रत्रयाय वौषट्
    । ॐ पञ्चमुखहनुमते अस्त्राय फट् । पञ्चमुखहनुमते स्वाहा इति दिग्बन्धः । अथ ध्यानम् । वन्दे वानरनारसिंहखगराट्क्रोडाश्ववक्त्रान्वितं
    दिव्यालङ्करणं त्रिपञ्चनयनं देदीप्यमानं रुचा । हस्ताब्जैरसिखेटपुस्तकसुधाकुम्भाङ्कुशाद्रिं हलं खट्वाङ्गं
    फणिभूरुहं दशभुजं सर्वारिवीरापहम् । अथ मन्त्रः । ॐ श्रीरामदूताय आञ्जनेयाय वायुपुत्राय महाबलपराक्रमाय
    सीतादुःखनिवारणाय लङ्कादहनकारणाय महाबलप्रचण्डाय फाल्गुनसखाय कोलाहलसकलब्रह्माण्डविश्वरूपाय सप्तसमुद्रनिर्लङ्घनाय
    पिङ्गलनयनाय अमितविक्रमाय सूर्यबिम्बफलसेवनाय दुष्टनिवारणाय दृष्टिनिरालङ्कृताय सञ्जीविनीसञ्जीविताङ्गद
    लक्ष्मणमहाकपिसैन्यप्राणदाय दशकण्ठविध्वंसनाय रामेष्टाय महाफाल्गुनसखाय सीतासहितरामवरप्रदाय षट्प्रयोगागमपञ्चमुखवीरहनुमन्मन्त्रजपे
    विनियोगः । ॐ हरिमर्कटमर्कटाय बम्बम्बम्बम्बं वौषट् स्वाहा । ॐ हरिमर्कटमर्कटाय फम्फम्फम्फम्फं फट् स्वाहा
    । ॐ हरिमर्कटमर्कटाय खेङ्खेङ्खेङ्खेङ्खें मारणाय स्वाहा । ॐ हरिमर्कटमर्कटाय लुंलुंलुंलुंलुं आकर्षितसकलसम्पत्कराय
    स्वाहा । ॐ हरिमर्कटमर्कटाय धन्धन्धन्धन्धं शत्रुस्तम्भनाय स्वाहा । ॐ टण्टण्टण्टण्टं कूर्ममूर्तये पञ्चमुखवीरहनुमते
    परयन्त्र परतन्त्रोच्चाटनाय स्वाहा । ॐ कङ्खङ्गङ्घंङं चञ्छञ्जञ्झंञं टण्ठण्डण्ढंणं तन्थन्दन्धन्नं पम्फम्बम्भम्मं
    यंरंलंवं शंषंसंहं लङ्क्षं स्वाहा । इति दिग्बन्धः । ॐ पूर्वकपिमुखाय पञ्चमुखहनुमते टण्टण्टण्टण्टं सकलशत्रुसंहरणाय
    स्वाहा । ॐ दक्षिणमुखाय पञ्चमुखहनुमते करालवदनाय नरसिंहाय ॐ ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः सकलभूतप्रेतदमनाय
    स्वाहा । ॐ पश्चिममुखाय गरुडाननाय पञ्चमुखहनुमते मम्मम्मम्मम्मं सकलविषहराय स्वाहा । ॐ उत्तरमुखाय आदिवराहाय
    लंलंलंलंलं नृसिंहाय नीलकण्ठमूर्तये पञ्चमुखहनुमते स्वाहा । ॐ ऊर्ध्वमुखाय हयग्रीवाय रुंरुंरुंरुंरुं
    रुद्रमूर्तये सकलप्रयोजननिर्वाहकाय स्वाहा । ॐ अञ्जनीसुताय वायुपुत्राय महाबलाय सीताशोकनिवारणाय श्रीरामचन्द्रकृपापादुकाय
    महावीर्यप्रमथनाय ब्रह्माण्डनाथाय कामदाय पञ्चमुखवीरहनुमते स्वाहा । भूतप्रेतपिशाचब्रह्मराक्षस शाकिनीडाकिन्यन्तरिक्षग्रह
    परयन्त्र परतन्त्रोच्चटनाय स्वाहा । सकलप्रयोजननिर्वाहकाय पञ्चमुखवीरहनुमते श्रीरामचन्द्रवरप्रसादाय जञ्जञ्जञ्जञ्जं
    स्वाहा । इदं कवचं पठित्वा तु महाकवचं पठेन्नरः । एकवारं जपेत् स्तोत्रं सर्वशत्रुनिवारणम् ॥ ॥ द्विवारं
    तु पठेन्नित्यं पुत्रपौत्रप्रवर्धनम् । त्रिवारं च पठेन्नित्यं सर्वसम्पत्करं शुभम् ॥ ॥ चतुर्वारं पठेन्नित्यं
    सर्वरोगनिवारणम् । पञ्चवारं पठेन्नित्यं सर्वलोकवशङ्करम् ॥ ॥ षड्वारं च पठेन्नित्यं सर्वदेववशङ्करम् ।
    सप्तवारं पठेन्नित्यं सर्वसौभाग्यदायकम् ॥ ॥ अष्टवारं पठेन्नित्यमिष्टकामार्थसिद्धिदम् । नववारं पठेन्नित्यं
    राजभोगमवाप्नुयात् ॥ ॥ दशवारं पठेन्नित्यं त्रैलोक्यज्ञानदर्शनम् । रुद्रावृत्तिं पठेन्नित्यं सर्वसिद्धिर्भवेद्धृवम्
    ॥ ॥ निर्बलो रोगयुक्तश्च महाव्याध्यादिपीडितः । कवचस्मरणेनैव महाबलमवाप्नुयात् ॥ ॥ इति सुदर्शनसंहितायां
    श्रीरामचन्द्रसीताप्रोक्तं श्री पञ्चमुखहनुमत्कवचम् ।
