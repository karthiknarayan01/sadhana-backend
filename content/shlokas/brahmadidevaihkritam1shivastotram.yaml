id: brahmadidevaihkritam1shivastotram
category: stotram
name:
  english: brahmadidevaihkritam1shivastotram
  devanagari: ब्रह्मादिदेवैःकृतं१शिवस्तोत्रम्
content:
  english: 49|| iti shivapurane vayaviyasamhitayam purvakhande trayovimshadhyayantargatam brahmadidevaih
    kritam shivastotram samaptam | shivapurana | vayaviyasamhita | purvabhaga | adhyaya 23
  devanagari: ४९॥ इति शिवपुराणे वायवीयसंहितायां पूर्वखण्डे त्रयोविंशाध्यायान्तर्गतं ब्रह्मादिदेवैः कृतं
    शिवस्तोत्रं समाप्तम् । शिवपुराण । वायवीयसंहिता । पूर्वभाग । अध्याय २३
meaning: {}
