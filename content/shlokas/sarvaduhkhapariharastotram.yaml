id: sarvaduhkhapariharastotram
category: stotram
name:
  english: sarvaduhkhapariharastotram
  devanagari: सर्वदुःखपरिहारस्तोत्रम्
content:
  english: sarvaduhkhapariharakam nrisimhastotram shriganeshaya namah | shrilakshminrisimhaya namah |
    narayanam namaskritya naram caiva narottamam | devim sarasvatim caiva tato jayamudirayet || 1|| taptahatakakeshanta
    jvalatpavakalocana | vajradhikanakhasparsha divyasimha namo'stu te || 2|| pantu vo narasimhasya nakhalangakotayah
    | hiranyakashiporvakshah kshetrasrikkardamarunah || 3|| himavadvasinah sarve munayo vedaparagah |
    trikalajna mahatmano naimisharanyavasinah || 4|| ye'rbudaranyaniratah pushkararanyavasinah | mahendradrirata
    ye ca ye hi vindhyadrivasinah || 5|| dharmaranyarata ye ca dandakaranyavasinah | shrishailanirata
    ye ca kurukshetranivasinah || 6|| kaumaraparvate ye ca ye ca pampanivasinah | ete canye ca bahavah
    sashishyah munayo'malah || 7|| sutamabhyarcya tatraiva sthitavanmunayo gatah | ityetatsarvamakhyatam
    puranam narasimhakam || 8|| pathatam sha
  devanagari: सर्वदुःखपरिहारकं नृसिंहस्तोत्रम् श्रीगणेशाय नमः । श्रीलक्ष्मीनृसिंहाय नमः । नारायणं नमस्कृत्य
    नरं चैव नरोत्तमम् । देवीं सरस्वतीं चैव ततो जयमुदीरयेत् ॥ १॥ तप्तहाटककेशान्त ज्वलत्पावकलोचन । वज्राधिकनखस्पर्श
    दिव्यसिंह नमोऽस्तु ते ॥ २॥ पान्तु वो नरसिंहस्य नखलाङ्गकोटयः । हिरण्यकशिपोर्वक्षः क्षेत्रासृक्कर्दमारुणः
    ॥ ३॥ हिमवद्वासिनः सर्वे मुनयो वेदपारगाः । त्रिकालज्ञा महात्मानो नैमिषारण्यवासिनः ॥ ४॥ येऽर्बुदारण्यनिरताः
    पुष्करारण्यवासिनः । महेन्द्राद्रिरता ये च ये हि विन्ध्याद्रिवासिनः ॥ ५॥ धर्मारण्यरता ये च दण्डकारण्यवासिनः
    । श्रीशैलनिरता ये च कुरुक्षेत्रनिवासिनः ॥ ६॥ कौमारपर्वते ये च ये च पम्पानिवासिनः । एते चान्ये च बहवः
    सशिष्याः मुनयोऽमलाः ॥ ७॥ सूतमभ्यर्च्य तत्रैव स्थितवान्मुनयो गताः । इत्येतत्सर्वमाख्यातं पुराणं नारसिंहकम्
    ॥ ८॥ पठतां श
