id: aditikritam04vishnustotram
category: stotram
name:
  english: aditikritam04vishnustotram
  devanagari: अदितिकृतं०४विष्णुस्तोत्रम्
content:
  english: aditikritam 4 vishnustotram aditiruvaca | yajnesha yajnapurushacyuta tirthapada tirthashravah
    shravanamangalanamadheya | apannalokavrijinopashamodayadya sham nah kridhisha bhagavannasi dinanathah
    || 8|| vishvaya vishvabhavanasthitisamyamaya svairam grihitapurushaktigunaya bhumne | svasthaya shashvadupabrimhitapurnabodha
  devanagari: अदितिकृतं ४ विष्णुस्तोत्रम् अदितिरुवाच । यज्ञेश यज्ञपुरुषाच्युत तीर्थपाद तीर्थश्रवः श्रवणमङ्गलनामधेय
    । आपन्नलोकवृजिनोपशमोदयाद्य शं नः कृधीश भगवन्नसि दीननाथः ॥ ८॥ विश्वाय विश्वभवनस्थितिसंयमाय स्वैरं गृहीतपुरुशक्तिगुणाय
    भूम्ने । स्वस्थाय शश्वदुपबृंहितपूर्णबोध
meaning: {}
