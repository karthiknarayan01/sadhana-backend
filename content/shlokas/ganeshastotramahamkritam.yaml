id: ganeshastotramahamkritam
category: stotram
name:
  english: ganeshastotramahamkritam
  devanagari: गणेशस्तोत्रमहंकृतं
content:
  english: ahamkritam shriganeshastotram || shriganeshaya namah || ahamuvaca | namaste gananathaya herambaya
    paratmane | sarvebhyo varadatre te varadaya namo namah || 1|| brahmasu brahmanathaya nijeshu svasvarupine
    | sankhyaya te parata utthanastheshu namo namah || 2|| jnaneshu bodharupaya so'handehishu te namah
    | deheshu bindurupaya vighneshaya namo namah || 3|| srashtrishu brahmadevaya vishnave palakeshu te
    | samhartrishu shivayaivaikadantaya namo namah || 4|| prakashakeshu suryaya mohakeshu ca shaktaye
    | deveshu devarajaya vinayakaya te namah || 5|| agnaye te dahakeshu yamaya nitidharinam | rakshahsu
    nairritayaiva shurpakarnaya te namah || 6|| vayave balayukteshu nidhishu dhanapaya te | rudreshu kalarupaya
    namo lambodaraya vai || 7|| prajapatishu dakshaya nageshe shesharupine | anantavibhavayaiva kim te
    staumi namo namah || 8|| yam stotum na samarthashca vedadya yogino'malah | tam kim stavimi vighneshamalpabuddhipradharakah
    || 9|| dhanyo'ham kritakrityo'ham saphalo me bhavah pita | mata kulam tatha jnanam tvadanghriyugadarshanat
    || 10|| evamuktva ganeshanam prananama mahasurah | harshena mahata yuktastamuvaca gajananah || 11||
  devanagari: अहंकृतं श्रीगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ अहमुवाच । नमस्ते गणनाथाय हेरम्बाय परात्मने
    । सर्वेभ्यो वरदात्रे ते वरदाय नमो नमः ॥ १॥ ब्रह्मसु ब्रह्मनाथाय निजेषु स्वस्वरूपिणे । साङ्ख्याय ते
    परत उत्थानस्थेषु नमो नमः ॥ २॥ ज्ञानेषु बोधरूपाय सोऽहन्देहिषु ते नमः । देहेषु बिन्दुरूपाय विघ्नेशाय
    नमो नमः ॥ ३॥ स्रष्टृषु ब्रह्मदेवाय विष्णवे पालकेषु ते । संहर्तृषु शिवायैवैकदन्ताय नमो नमः ॥ ४॥ प्रकाशकेषु
    सूर्याय मोहकेषु च शक्तये । देवेषु देवराजाय विनायकाय ते नमः ॥ ५॥ अग्नये ते दाहकेषु यमाय नीतिधारिणाम्
    । रक्षःसु नैरृतायैव शूर्पकर्णाय ते नमः ॥ ६॥ वायवे बलयुक्तेषु निधिषु धनपाय ते । रुद्रेषु कालरूपाय नमो
    लम्बोदराय वै ॥ ७॥ प्रजापतिषु दक्षाय नागेशे शेषरूपिणे । अनन्तविभवायैव किं ते स्तौमि नमो नमः ॥ ८॥ यं
    स्तोतुं न समर्थाश्च वेदाद्या योगिनोऽमलाः । तं किं स्तवीमि विघ्नेशमल्पबुद्धिप्रधारकः ॥ ९॥ धन्योऽहं
    कृतकृत्योऽहं सफलो मे भवः पिता । माता कुलं तथा ज्ञानं त्वदङ्घ्रियुगदर्शनात् ॥ १०॥ एवमुक्त्वा गणेशानं
    प्रणनाम महासुरः । हर्षेण महता युक्तस्तमुवाच गजाननः ॥ ११॥
