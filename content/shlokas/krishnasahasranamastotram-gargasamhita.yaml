id: krishnasahasranamastotram-gargasamhita
category: stotram
name:
  english: krishnasahasranamastotram (gargasamhita)
  devanagari: कृष्णसहस्रनामस्तोत्रम् (गर्गसंहिता)
content:
  english: mahamokshadah prajarakshako gopikagiyamanah kakudmipranashaprayasah surejyah || 46|| kalih
    krodhakritkamsamantropadeshta tathakruramantropadeshi surarthah | bali keshiha pushpavarsho'malashristatha
    naradaddarshito vyomahanta || 47|| tathakrurasevaparah sarvadarshi vraje gopikamohadah kulavarti |
    satiradhikabodhadah svapnakarta vilasi mahamohanashi svabodhah || 48|| vraje shapatastyaktaradhasakasho
    mahamohadavagnidagdhapatishca | sakhibandhananmohitakrura aratsakhikankanaistaditakrurarakshi || 49||
    rathastho vraje radhaya krishnacandrah sugupto gami gopakaishcarulilah | jale'krurasandarshito divyarupo
    didrikshuh purimohinicittamohi || 50|| tatha rangakarapranashi suvastrahsraji vayakapritikrinmalipujyah
    | mahakirtidashcapi kubjavinodi sphuraccandakodandarugnapracandah || 51|| bhatartipradah kamsaduhsvapnakari
    mahamallaveshah karindraprahari | mahamatyaha rangabhumipraveshi rasadhyo yashahsprigbali vakpatushrih
    || 52|| mahamallaha yuddhakritstrivaco'rthi dharanayakah kamsahanta yaduhprak | sada pujito hyugrasenaprasiddho
    dhararajyado yadavairmanditangah || 53|| guroh putrado brahmavidbrahmapathi mahashankhaha dandadhrikpujya
    eva | vraje hyuddhavapreshito gopamohi yashodaghrini gopikajnanadeshi || 54|| sada snehakritkubjaya
    pujitangastathakruragehangami mantravetta | tatha pandavapreshitakrura eva sukhi sarvadarshi nripanandakari
    || 55|| mahakshauhiniha jarasandhamani nripo dvarakakarako mokshakarta | rani sarvabhaumastuto jnanadata
    jarasandhasankalpakriddhavadanghrih || 56|| nagadutpataddvarikamadhyavarti tatha revatibhushanastalacihnah
    | yadu rukminiharakashcaidyavedyastatha rukmirupapranashi sukhashi || 57|| anantashca marashca karshnishca
    kamo manojastatha shambarari ratishah | rathi manmatho minaketuh shari ca smaro darpako manaha pancabanah
    || 58|| priyah satyabhamapatiryadavesho'tha satrajitapremapurah prahasah | maharatnado jambavadyuddhakari
    mahacakradhrikkhadgadhrigramasandhih || 59|| viharasthitah pandavapremakari kalindangajamohanah khandavarthi
    | sakha phalgunapritikrinnagrakarta tatha mitravindapatih kridanarthi || 60|| nripapremakridgojitah
    saptarupo'tha satyapatih paribarhi yatheshtah | nripaih samvritashcapi bhadrapatistu vilasi madhormaninisho
    janeshah || 61|| shunasiramohavritah satsabharyah satarkshyo murarih purisanghabhetta | suvirahshirahkhandano
    daityanashi shari bhaumaha candavegah pravirah || 62|| dharasamstutah kundalacchatraharta maharatnayug
    rajakanyabhiramah | shacipujitah shakrajinmanaharta tatha parijatapahari rameshah || 63|| grihi camaraih
    shobhito bhishmakanyapatirhasyakrinmaninimanakari | tatha rukminivakpatuh premagehah satimohanah kamadevaparashrih
    || 64|| sudeshnah sucarustatha carudeshno'parashcarudeho bali caruguptah | suti bhadracarustatha carucandro
    vicarushca caru rathi putrarupah || 65|| subhanuh prabhanustatha candrabhanurbrihadbhanurevashtabhanushca
    sambah | sumitrah kratushcitraketustu viro'shvaseno vrishashcitragushcandrabimbah || 66|| vishankurvasushca
    shruto bhadra ekah subahurvrishah purnamasastu somah | varah shantireva praghosho'tha simho balo hyurdhvagovardhanonnada
    eva || 67|| mahasho vrikah pavano vahnimitrah kshudhirharshakashcanilo'mitrajicca | subhadro jayah
    satyako vama ayuryaduh kotishah putrapautraprasiddhah || 68|| hali dandadhrigrukmiha caniruddhastatha
    rajabhirhasyago dyutakarta | madhurbrahmasurbanaputripatishca mahasundarah kamaputro balishah || 69||
    mahadaityasangramakridyadaveshah puribhanjano bhutasantrasakari | mridhi rudrajidrudramohi mridharthi
    tatha skandajitkupakarnaprahari || 70|| dhanurbhanjano banamanaprahari jvarotpattikritsamstutastu
    jvarena | bhujacchedakridbanasantrasakarta mridaprastuto yuddhakridbhumibharta || 71|| nrigam muktido
    jnanado yadavanam rathastho vrajapremapo gopamukhyah | mahasundarikriditah pushpamali kalindangajabhedanah
    sirapanih || 72|| mahadambhiha paundramanapraharo shirashchedakah kashirajapranashi | mahakshauhinidhvamsakriccakrahastah
    puridipako rakshasinashakarta || 73|| ananto mahidhrah phani vanararih sphuradgauravarno mahapadmanetrah
    | kurugramatiryaggato gauravarthah stutah kauravaih paribarhi sasambah || 74|| mahavaibhavi dvarakesho
    hyanekashcalannaradah shriprabhadarshakastu | maharshistuto brahmadevah puranah sada shodashastrisahasrasthitashca
    || 75|||| grihi lokarakshaparo lokaritih prabhurhyugrasenavrito durgayuktah | tatha rajadutastuto
    bandhabhetta sthito naradaprastutah pandavarthi || 76|| nripairmantrakrit hyuddhavapritipurno vritah
    putrapautraih kurugramaganta | ghrini dharmarajastuto bhimayuktah paranandado mantrakriddharmajena
    || 77|| dishajidbali rajasuyarthakari jarasandhaha bhimasenasvarupah | tatha viprarupo gadayuddhakarta
    kripalurmahabandhanacchedakari || 78|| nripaih samstuto hyagato dharmageham dvijaih samvrito yajnasambharakarta
    | janaih pujitashcaidyadurvakkshamashca mahamohado'reh shirashcchedakari || 79|| mahayajnashobhakarashcakravarti
    nripanandakari vihari suhari | sabhasamvrito manahritkauravasya tatha shalvasamharako yanahanta ||
    80|| sabhojashca vrishnirmadhuhshuraseno dasharho yadurhyandhako lokajicca | dyumanmanaha varmadhrigdivyashastri
    svabodhah sada rakshako daityahanta || 81|| tatha dantavaktrapranashi gadadhrigjagattirthayatrakarah
    padmaharah | kushi sutahanta kripakritsmritisho'malo balvalangaprabhakhandakari || 82|| tatha bhimaduryodhanajnanadataparo
    rohinisaukhyado revatishah | mahadanakridvipradaridryaha ca sada premayuk shrisudamnah sahayah ||
    83|| tatha bhargavakshetraganta saramo'tha suryoparagashrutah sarvadarshi | mahasenaya casthitah snanayukto
    mahadanakrinmitrasammelanarthi || 84|| tatha pandavapritidah kuntijarthi vishalakshamohapradah shantidashca
    | vate radhikaradhano gopikabhih sakhikotibhi radhikaprananathah || 85|| sakhimohadavagniha vaibhaveshah
    sphuratkotikandarpalilavisheshah | sakhiradhikaduhkhanashi vilasi sakhimadhyagah shapaha madhavishah
    || 86|| shatam varshavikshepahrinnandaputrastatha nandavakshogatah shitalangah | yashodashucah snanakrikdduhkhahanta
    sadagopikanetralagno vrajeshah || 87|| stuto devakirohinibhyam surendro raho gopikajnanado manadashca
    | tatha samstutah pattarajnibhiraraddhani lakshmanaprananathah sada hi || 88|| tribhih shodashastrisahasrastutangah
    shuko vyasadevah sumantuh sitashca | bharadvajako gautamo hyasurih sadvasishthah shatananda adyah
    saramah || 89|| munih parvato narado dhaumya indro'sito'trirvibhandah pracetah kripashca | kumarah
    sanandastatha yajnavalkyah ribhurhyangira devalah shrimrikandah || 90|| marici kratushcaurvako lomashashca
    pulastyo bhrigurbrahmarato vasishthah | narashcapi narayano datta eva tatha paninih pingalo bhashyakarah
    || 91|| sakatyayano viprapatanjalishcatha gargo gururgishpatirgautamishah | munirjajalih kashyapo
    galavashca dvijah saubharishcarshyashringashca kanvah || 92|| dvitashcaikatashcapi jatudbhavashca
    ghanah kardamasyatmajah kardamashca | tatha bhargavah kautsakashcarunastu shucih pippalado mrikandasya
    putrah || 93|| sapailahstatha jaiminih satsumanturvaro gangalah sphotagehah phaladah | sada pujito
    brahmanah sarvarupi munisho mahamohanasho'marah prak || 94|| munishastutah shaurivijnanadata mahayajnakriccabhritasnanapujyah
    | sada dakshinado nripaih paribarhi vrajanandado dvarikagehadarshi || 95|| mahajnanado devakiputradashcasuraih
    pujito hindrasenadritashca | sada phalgunapritikrit satsubhadravivahe dvipashvaprado manayanah ||
    96|| bhuvam darshako maithilena prayukto dvijenashu rajnasthito brahmanaishca | kriti maithile lokavedopadeshi
    sadavedavakyaih stutah sheshashayi || 97|| parikshavrito brahmanaishcamareshu bhriguprarthito daityaha
    cesharakshi | sakha carjunasyapi manaprahari tatha vipraputraprado dhamaganta || 98|| viharasthito
    madhavibhih kalango mahamohadavagnidagdhabhiramah | yadurhyugraseno nripo'krura eva tatha coddhavah
    shurasenashca shurah || 99|| hridikashca satrajitashcaprameyo gadah saranah satyakirdevabhagah | tatha
    manasah sanjayah shyamakashca vriko vatsako devako bhadrasenah || 100|| nripo'jatashatrurjayo madriputro'tha
    bhimah kripo buddhicakshushca panduh | tatha shantanurdevabahlika evatha bhurishravashcitraviryo vicitrah
    || 101|| shalashcapi duryodhanah karna eva subhadrasuto vishnuratah prasiddhah | sajanmejayah pandavah
    kauravashca tatha sarvateja harih sarvarupi || 102|| vrajam hyagato radhaya purnadevo varo rasalilaparo
    divyarupi | rathastho navadvipakhandapradarshi mahamanado gopajo vishvarupah || 103|| sanandashca
    nando vrisho vallabheshah sudamarjunah saubalastoka eva | sakrishno shukah sadvishalarshabhakhyah
    sutejasvikah krishnamitro varuthah || 104|| kushesho vaneshastu vrindavaneshastatha mathureshadhipo
    gokuleshah | sada gogano gopatirgopikesho'tha govardhano gopatih kanyakeshah || 105|| anadistu catma
    harih purushashca paro nirguno jyotirupo nirihah | sada nirvikarah prapancat parashca sasatyastu purnah
    pareshastu sukshmah || 106|| samatya
  devanagari: महामोक्षदः प्रजारक्षको गोपिकागीयमानः ककुद्मिप्रणाशप्रयासः सुरेज्यः ॥ ४६॥ कलिः क्रोधकृत्कंसमन्त्रोपदेष्टा
    तथाक्रूरमन्त्रोपदेशी सुरार्थः । बली केशिहा पुष्पवर्षोऽमलश्रीस्तथा नारदाद्दर्शितो व्योमहन्ता ॥ ४७॥
    तथाक्रूरसेवापरः सर्वदर्शी व्रजे गोपिकामोहदः कूलवर्ती । सतीराधिकाबोधदः स्वप्नकर्ता विलासी महामोहनाशी
    स्वबोधः ॥ ४८॥ व्रजे शापतस्त्यक्तराधासकाशो महामोहदावाग्निदग्धापतिश्च । सखीबन्धनान्मोहिताक्रूर आरात्सखीकङ्कणैस्ताडिताक्रूररक्षी
    ॥ ४९॥ रथस्थो व्रजे राधया कृष्णचन्द्रः सुगुप्तो गमी गोपकैश्चारुलीलः । जलेऽक्रूरसन्दर्शितो दिव्यरूपो
    दिदृक्षुः पुरीमोहिनीचित्तमोही ॥ ५०॥ तथा रङ्गकारप्रणाशी सुवस्त्रःस्रजी वायकप्रीतिकृन्मालिपूज्यः । महाकीर्तिदश्चापि
    कुब्जाविनोदी स्फुरच्चण्डकोदण्डरुग्णप्रचण्डः ॥ ५१॥ भटार्तिप्रदः कंसदुःस्वप्नकारी महामल्लवेषः करीन्द्रप्रहारी
    । महामात्यहा रङ्गभूमिप्रवेशी रसाढ्यो यशःस्पृग्बली वाक्पटुश्रीः ॥ ५२॥ महामल्लहा युद्धकृत्स्त्रीवचोऽर्थी
    धरानायकः कंसहन्ता यदुःप्राक् । सदा पूजितो ह्युग्रसेनप्रसिद्धो धराराज्यदो यादवैर्मण्डिताङ्गः ॥ ५३॥
    गुरोः पुत्रदो ब्रह्मविद्ब्रह्मपाठी महाशङ्खहा दण्डधृक्पूज्य एव । व्रजे ह्युद्धवप्रेषितो गोपमोही यशोदाघृणी
    गोपिकाज्ञानदेशी ॥ ५४॥ सदा स्नेहकृत्कुब्जया पूजिताङ्गस्तथाक्रूरगेहङ्गमी मन्त्रवेत्ता । तथा पाण्डवप्रेषिताक्रूर
    एव सुखी सर्वदर्शी नृपानन्दकारी ॥ ५५॥ महाक्षौहिणीहा जरासन्धमानी नृपो द्वारकाकारको मोक्षकर्ता । रणी
    सार्वभौमस्तुतो ज्ञानदाता जरासन्धसङ्कल्पकृद्धावदङ्घ्रिः ॥ ५६॥ नगादुत्पतद्द्वारिकामध्यवर्ती तथा रेवतीभूषणस्तालचिह्नः
    । यदू रुक्मिणीहारकश्चैद्यवेद्यस्तथा रुक्मिरूपप्रणाशी सुखाशी ॥ ५७॥ अनन्तश्च मारश्च कार्ष्णिश्च कामो
    मनोजस्तथा शम्बरारी रतीशः । रथी मन्मथो मीनकेतुः शरी च स्मरो दर्पको मानहा पञ्चबाणः ॥ ५८॥ प्रियः सत्यभामापतिर्यादवेशोऽथ
    सत्राजितप्रेमपूरः प्रहासः । महारत्नदो जाम्बवद्युद्धकारी महाचक्रधृक्खड्गधृग्रामसन्धिः ॥ ५९॥ विहारस्थितः
    पाण्डवप्रेमकारी कलिन्दाङ्गजामोहनः खाण्डवार्थी । सखा फाल्गुनप्रीतिकृन्नग्रकर्ता तथा मित्रविन्दापतिः
    क्रीडनार्थी ॥ ६०॥ नृपप्रेमकृद्गोजितः सप्तरूपोऽथ सत्यापतिः पारिबर्ही यथेष्टः । नृपैः संवृतश्चापि भद्रापतिस्तु
    विलासी मधोर्मानिनीशो जनेशः ॥ ६१॥ शुनासीरमोहावृतः सत्सभार्यः सतार्क्ष्यो मुरारिः पुरीसङ्घभेत्ता । सुवीरःशिरःखण्डनो
    दैत्यनाशी शरी भौमहा चण्डवेगः प्रवीरः ॥ ६२॥ धरासंस्तुतः कुण्डलच्छत्रहर्ता महारत्नयुग् राजकन्याभिरामः
    । शचीपूजितः शक्रजिन्मानहर्ता तथा पारिजातापहारी रमेशः ॥ ६३॥ गृही चामरैः शोभितो भीष्मकन्यापतिर्हास्यकृन्मानिनीमानकारी
    । तथा रुक्मिणीवाक्पटुः प्रेमगेहः सतीमोहनः कामदेवापरश्रीः ॥ ६४॥ सुदेष्णः सुचारुस्तथा चारुदेष्णोऽपरश्चारुदेहो
    बली चारुगुप्तः । सुती भद्रचारुस्तथा चारुचन्द्रो विचारुश्च चारू रथी पुत्ररूपः ॥ ६५॥ सुभानुः प्रभानुस्तथा
    चन्द्रभानुर्बृहद्भानुरेवाष्टभानुश्च साम्बः । सुमित्रः क्रतुश्चित्रकेतुस्तु वीरोऽश्वसेनो वृषश्चित्रगुश्चन्द्रबिम्बः
    ॥ ६६॥ विशङ्कुर्वसुश्च श्रुतो भद्र एकः सुबाहुर्वृषः पूर्णमासस्तु सोमः । वरः शान्तिरेव प्रघोषोऽथ सिंहो
    बलो ह्यूर्ध्वगोवर्धनोन्नाद एव ॥ ६७॥ महाशो वृकः पावनो वह्निमित्रः क्षुधिर्हर्षकश्चानिलोऽमित्रजिच्च
    । सुभद्रो जयः सत्यको वाम आयुर्यदुः कोटिशः पुत्रपौत्रप्रसिद्धः ॥ ६८॥ हली दण्डधृग्रुक्मिहा चानिरुद्धस्तथा
    राजभिर्हास्यगो द्यूतकर्ता । मधुर्ब्रह्मसूर्बाणपुत्रीपतिश्च महासुन्दरः कामपुत्रो बलीशः ॥ ६९॥ महादैत्यसङ्ग्रामकृद्यादवेशः
    पुरीभञ्जनो भूतसन्त्रासकारी । मृधी रुद्रजिद्रुद्रमोही मृधार्थी तथा स्कन्दजित्कूपकर्णप्रहारी ॥ ७०॥ धनुर्भञ्जनो
    बाणमानप्रहारी ज्वरोत्पत्तिकृत्संस्तुतस्तु ज्वरेण । भुजाच्छेदकृद्बाणसन्त्रासकर्ता मृडप्रस्तुतो युद्धकृद्भूमिभर्ता
    ॥ ७१॥ नृगं मुक्तिदो ज्ञानदो यादवानां रथस्थो व्रजप्रेमपो गोपमुख्यः । महासुन्दरीक्रीडितः पुष्पमाली कलिन्दाङ्गजाभेदनः
    सीरपाणिः ॥ ७२॥ महादम्भिहा पौण्ड्रमानप्रहारो शिरश्छेदकः काशिराजप्रणाशी । महाक्षौहिणीध्वंसकृच्चक्रहस्तः
    पुरीदीपको राक्षसीनाशकर्ता ॥ ७३॥ अनन्तो महीध्रः फणी वानरारिः स्फुरद्गौरवर्णो महापद्मनेत्रः । कुरुग्रामतिर्यग्गतो
    गौरवार्थः स्तुतः कौरवैः पारिबर्ही ससाम्बः ॥ ७४॥ महावैभवी द्वारकेशो ह्यनेकश्चलन्नारदः श्रीप्रभादर्शकस्तु
    । महर्षिस्तुतो ब्रह्मदेवः पुराणः सदा षोडशस्त्रीसहस्रस्थितश्च ॥ ७५॥॥ गृही लोकरक्षापरो लोकरीतिः प्रभुर्ह्युग्रसेनावृतो
    दुर्गयुक्तः । तथा राजदूतस्तुतो बन्धभेत्ता स्थितो नारदप्रस्तुतः पाण्डवार्थी ॥ ७६॥ नृपैर्मन्त्रकृत्
    ह्युद्धवप्रीतिपूर्णो वृतः पुत्रपौत्रैः कुरुग्रामगन्ता । घृणी धर्मराजस्तुतो भीमयुक्तः परानन्ददो मन्त्रकृद्धर्मजेन
    ॥ ७७॥ दिशाजिद्बली राजसूयार्थकारी जरासन्धहा भीमसेनस्वरूपः । तथा विप्ररूपो गदायुद्धकर्ता कृपालुर्महाबन्धनच्छेदकारी
    ॥ ७८॥ नृपैः संस्तुतो ह्यागतो धर्मगेहं द्विजैः संवृतो यज्ञसम्भारकर्ता । जनैः पूजितश्चैद्यदुर्वाक्क्षमश्च
    महामोहदोऽरेः शिरश्च्छेदकारी ॥ ७९॥ महायज्ञशोभाकरश्चक्रवर्ती नृपानन्दकारी विहारी सुहारी । सभासंवृतो
    मानहृत्कौरवस्य तथा शाल्वसंहारको यानहन्ता ॥ ८०॥ सभोजश्च वृष्णिर्मधुःशूरसेनो दशार्हो यदुर्ह्यन्धको लोकजिच्च
    । द्युमन्मानहा वर्मधृग्दिव्यशस्त्री स्वबोधः सदा रक्षको दैत्यहन्ता ॥ ८१॥ तथा दन्तवक्त्रप्रणाशी गदाधृग्जगत्तीर्थयात्राकरः
    पद्महारः । कुशी सूतहन्ता कृपाकृत्स्मृतीशोऽमलो बल्वलाङ्गप्रभाखण्डकारी ॥ ८२॥ तथा भीमदुर्योधनज्ञानदातापरो
    रोहिणीसौख्यदो रेवतीशः । महादानकृद्विप्रदारिद्र्यहा च सदा प्रेमयुक् श्रीसुदाम्नः सहायः ॥ ८३॥ तथा भार्गवक्षेत्रगन्ता
    सरामोऽथ सूर्योपरागश्रुतः सर्वदर्शी । महासेनया चास्थितः स्नानयुक्तो महादानकृन्मित्रसम्मेलनार्थी ॥ ८४॥
    तथा पाण्डवप्रीतिदः कुन्तिजार्थी विशालाक्षमोहप्रदः शान्तिदश्च । वटे राधिकाराधनो गोपिकाभिः सखीकोटिभी
    राधिकाप्राणनाथः ॥ ८५॥ सखीमोहदावाग्निहा वैभवेशः स्फुरत्कोटिकन्दर्पलीलाविशेषः । सखीराधिकादुःखनाशी विलासी
    सखीमध्यगः शापहा माधवीशः ॥ ८६॥ शतं वर्षविक्षेपहृन्नन्दपुत्रस्तथा नन्दवक्षोगतः शीतलाङ्गः । यशोदाशुचः
    स्नानकृक्द्दुःखहन्ता सदागोपिकानेत्रलग्नो व्रजेशः ॥ ८७॥ स्तुतो देवकीरोहिणीभ्यां सुरेन्द्रो रहो गोपिकाज्ञानदो
    मानदश्च । तथा संस्तुतः पट्टराज्ञीभिराराद्धनी लक्ष्मणाप्राणनाथः सदा हि ॥ ८८॥ त्रिभिः षोडशस्त्रीसहस्रस्तुताङ्गः
    शुको व्यासदेवः सुमन्तुः सितश्च । भरद्वाजको गौतमो ह्यासुरिः सद्वसिष्ठः शतानन्द आद्यः सरामः ॥ ८९॥ मुनिः
    पर्वतो नारदो धौम्य इन्द्रोऽसितोऽत्रिर्विभाण्डः प्रचेताः कृपश्च । कुमारः सनन्दस्तथा याज्ञवल्क्यः ऋभुर्ह्यङ्गिरा
    देवलः श्रीमृकण्डः ॥ ९०॥ मरीची क्रतुश्चौर्वको लोमशश्च पुलस्त्यो भृगुर्ब्रह्मरातो वसिष्ठः । नरश्चापि
    नारायणो दत्त एव तथा पाणिनिः पिङ्गलो भाष्यकारः ॥ ९१॥ सकात्यायनो विप्रपातञ्जलिश्चाथ गर्गो गुरुर्गीष्पतिर्गौतमीशः
    । मुनिर्जाजलिः कश्यपो गालवश्च द्विजः सौभरिश्चर्ष्यशृङ्गश्च कण्वः ॥ ९२॥ द्वितश्चैकतश्चापि जातूद्भवश्च
    घनः कर्दमस्यात्मजः कर्दमश्च । तथा भार्गवः कौत्सकश्चारुणस्तु शुचिः पिप्पलादो मृकण्डस्य पुत्रः ॥ ९३॥
    सपैलःस्तथा जैमिनिः सत्सुमन्तुर्वरो गाङ्गलः स्फोटगेहः फलादः । सदा पूजितो ब्राह्मणः सर्वरूपी मुनीशो
    महामोहनाशोऽमरः प्राक् ॥ ९४॥ मुनीशस्तुतः शौरिविज्ञानदाता महायज्ञकृच्चाभृतस्नानपूज्यः । सदा दक्षिणादो
    नृपैः पारिबर्ही व्रजानन्ददो द्वारिकागेहदर्शी ॥ ९५॥ महाज्ञानदो देवकीपुत्रदश्चासुरैः पूजितो हीन्द्रसेनादृतश्च
    । सदा फाल्गुनप्रीतिकृत् सत्सुभद्राविवाहे द्विपाश्वप्रदो मानयानः ॥ ९६॥ भुवं दर्शको मैथिलेन प्रयुक्तो
    द्विजेनाशु राज्ञास्थितो ब्राह्मणैश्च । कृती मैथिले लोकवेदोपदेशी सदावेदवाक्यैः स्तुतः शेषशायी ॥ ९७॥
    परीक्षावृतो ब्राह्मणैश्चामरेषु भृगुप्रार्थितो दैत्यहा चेशरक्षी । सखा चार्जुनस्यापि मानप्रहारी तथा
    विप्रपुत्रप्रदो धामगन्ता ॥ ९८॥ विहारस्थितो माधवीभिः कलाङ्गो महामोहदावाग्निदग्धाभिरामः । यदुर्ह्युग्रसेनो
    नृपोऽक्रूर एव तथा चोद्धवः शूरसेनश्च शूरः ॥ ९९॥ हृदीकश्च सत्राजितश्चाप्रमेयो गदः सारणः सात्यकिर्देवभागः
    । तथा मानसः सञ्जयः श्यामकश्च वृको वत्सको देवको भद्रसेनः ॥ १००॥ नृपोऽजातशत्रुर्जयो माद्रिपुत्रोऽथ भीमः
    कृपो बुद्धिचक्षुश्च पाण्डुः । तथा शन्तनुर्देवबाह्लीक एवाथ भूरिश्रवाश्चित्रवीर्यो विचित्रः ॥ १०१॥ शलश्चापि
    दुर्योधनः कर्ण एव सुभद्रासुतो विष्णुरातः प्रसिद्धः । सजन्मेजयः पाण्डवः कौरवश्च तथा सर्वतेजा हरिः सर्वरूपी
    ॥ १०२॥ व्रजं ह्यागतो राधया पूर्णदेवो वरो रासलीलापरो दिव्यरूपी । रथस्थो नवद्वीपखण्डप्रदर्शी महामानदो
    गोपजो विश्वरूपः ॥ १०३॥ सनन्दश्च नन्दो वृषो वल्लभेशः सुदामार्जुनः सौबलस्तोक एव । सकृष्णो शुकः सद्विशालर्षभाख्यः
    सुतेजस्विकः कृष्णमित्रो वरूथः ॥ १०४॥ कुशेशो वनेशस्तु वृन्दावनेशस्तथा मथुरेशाधिपो गोकुलेशः । सदा गोगणो
    गोपतिर्गोपिकेशोऽथ गोवर्धनो गोपतिः कन्यकेशः ॥ १०५॥ अनादिस्तु चात्मा हरिः पूरुषश्च परो निर्गुणो ज्योतिरूपो
    निरीहः । सदा निर्विकारः प्रपञ्चात् परश्च ससत्यस्तु पूर्णः परेशस्तु सूक्ष्मः ॥ १०६॥ समत्य
