id: agastyadimunibhihkritamramanathastotram
category: stotram
name:
  english: agastyadimunibhihkritamramanathastotram
  devanagari: अगस्त्यादिमुनिभिःकृतंरामनाथस्तोत्रम्
content:
  english: agastyadi munibhih kritam ramanathastotram agastya uvaca | adideva mahadeva vishveshvara shivavyaya
    | ramanathambikanatha prasida vrisha bhadhvaja || 61|| aparadhasahasram me kshamasva vidhushekhara
    | mamahamiti putradavahantam mama mocaya || 62|| sutikshna uvaca | kshetrani ratnani dhanani dara
    mitrani vastrani gavashvaputrah | naivopakaraya hi ramanatha mahyam prayaccha tvamato viraktim ||
    63|| vishvamitra uvaca | shrutani shastranyapi nishphalani trayyapyadhita viphalaiva nunam | tvayishvare
    cenna bhaveddhi bhaktih shriramanathe shiva manushasya || 64|| galava uvaca | danani yajna niyamastapamsi
    gangaditirtheshu nimajjanani | rameshvaram tvam na namanti ye tu vyarthani teshamiti nishcayo'tra
    || 65|| vasishtha uvaca | kritvapi papanyakhilani lokastvametya rameshvara bhaktiyuktah | nameta cettani
    layam vrajeyuryathandhakaro ravitejasa'ddha || 66|| atriruvaca | drishtva tu rameshvaramekadapi sprishtva
    namaskritya bhavantamisham | punarna garbham sa narah prayayatkim tvadvayam te labhatam svarupam ||
    67|| angira uvaca | yo ramanatham manujo bhavantamupetya bandhunpranamansmareta | santarayettanapi
    sarvapapatkimadbhutam tasya kritarthatayam || 68|| gautama uvaca | shriramanatheshvara gudhametadrahasyabhutam
    paramam vishokam | tvatpadamulam bhajatam nrinam ye sevam prakurvanti hi te'pi dhanyah || 69|| shatananda
    uvaca | vedantavijnanarahasyavidbhirvijneyametaddhi mumukshubhistu | shastrani sarvani vihaya deva
    tvatsevanam yadraghuviranatha || 1
  devanagari: अगस्त्यादि मुनिभिः कृतं रामनाथस्तोत्रम् अगस्त्य उवाच । आदिदेव महादेव विश्वेश्वर शिवाव्यय
    । रामनाथाम्बिकानाथ प्रसीद वृष भध्वज ॥ ६१॥ अपराधसहस्रं मे क्षमस्व विधुशेखर । ममाहमिति पुत्रादावहन्तां
    मम मोचय ॥ ६२॥ सुतीक्ष्ण उवाच । क्षेत्राणि रत्नानि धनानि दारा मित्राणि वस्त्राणि गवाश्वपुत्राः । नैवोपकाराय
    हि रामनाथ मह्यं प्रयच्छ त्वमतो विरक्तिम् ॥ ६३॥ विश्वामित्र उवाच । श्रुतानि शास्त्राण्यपि निष्फलानि
    त्रय्यप्यधीता विफलैव नूनम् । त्वयीश्वरे चेन्न भवेद्धि भक्तिः श्रीरामनाथे शिव मानुषस्य ॥ ६४॥ गालव उवाच
    । दानानि यज्ञा नियमास्तपांसि गङ्गादितीर्थेषु निमज्जनानि । रामेश्वरं त्वां न नमन्ति ये तु व्यर्थानि
    तेषामिति निश्चयोऽत्र ॥ ६५॥ वसिष्ठ उवाच । कृत्वापि पापान्यखिलानि लोकस्त्वामेत्य रामेश्वर भक्तियुक्तः
    । नमेत चेत्तानि लयं व्रजेयुर्यथान्धकारो रवितेजसाऽद्धा ॥ ६६॥ अत्रिरुवाच । दृष्ट्वा तु रामेश्वरमेकदापि
    स्पृष्ट्वा नमस्कृत्य भवन्तमीशम् । पुनर्न गर्भं स नरः प्रयायात्किं त्वद्वयं ते लभतं स्वरूपम् ॥ ६७॥
    अङ्गिरा उवाच । यो रामनाथं मनुजो भवन्तमुपेत्य बन्धून्प्रणमन्स्मरेत । सन्तारयेत्तानपि सर्वपापात्किमद्भुतं
    तस्य कृतार्थतायाम् ॥ ६८॥ गौतम उवाच । श्रीरामनाथेश्वर गूढमेतद्रहस्यभूतं परमं विशोकम् । त्वत्पादमूलं
    भजतां नृणां ये सेवां प्रकुर्वन्ति हि तेऽपि धन्याः ॥ ६९॥ शतानन्द उवाच । वेदान्तविज्ञानरहस्यविद्भिर्विज्ञेयमेतद्धि
    मुमुक्षुभिस्तु । शास्त्राणि सर्वाणि विहाय देव त्वत्सेवनं यद्रघुवीरनाथ ॥ १
