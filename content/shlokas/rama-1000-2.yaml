id: rama-1000-2
category: sahasranama
name:
  english: rama 1000
  devanagari: रम १०००
content:
  english: vijnanahetum vimalayataksham prajnanarupam svasukhaikahetum | shriramacandram harimadidevam
    paratparam ramamaham bhajami || tattvasvarupam purusham puranam svatejasa puritavishvamekam | rajadhirajam
    ravimandalastham vishveshvaram ramamaham bhajami | lamityadipancapujah | om ramah shriman mahavishnurjishnurdevahitavahah
    | tattvatma tarakam brahma shashvatah sarvasiddhidah || rajivalocanah shriman shriramo raghupungavah
    | ramabhadrah sadacaro rajendro janakipatih || 1|| agraganyo varenyashca varadah parameshvarah | janardano
    jitamitrah pararthaikaprayojanah || 2|| vishvamitrapriyo dantah shatrujicchatrutapanah | sarvajnah
    sarvadevadih sharanyo valimardanah || 3|| jnanabhavyo'paricchedyo vagmi satyavratah shucih | jnanagamyo
    dridhaprajnah kharadhvamsi pratapavan || 4|| dyutimanatmavan viro jitakrodho'rimardanah | vishvarupo
    vishalakshah prabhuh parivridho dridhah || 5|| ishah khadgadharah shriman kausaleyo'nasuyakah | vipulamso
    mahoraskah parameshthi parayanah || 6|| satyavratah satyasandho guruh paramadharmikah | lokajno lokavandyashca
    lokatma lokakritparah || 7|| anadirbhagavan sevyo jitamayo raghudvahah | ramo dayakaro dakshah sarvajnah
    sarvapavanah || 8|| brahmanyo nitiman gopta sarvadevamayo harih | sundarah pitavasashca sutrakarah
    puratanah || 9|| saumyo maharshih kodandi sarvajnah sarvakovidah | kavih sugrivavaradah sarvapunyadhikapradah
    || 10|| bhavyo jitarishadvargo mahodaro'ghanashanah | sukirtiradipurushah kantah punyakritagamah ||
    11|| akalmashashcaturbahuh sarvavaso durasadah | smitabhashi nivrittatma smritiman viryavan prabhuh
    || 12|| dhiro danto ghanashyamah sarvayudhavisharadah | adhyatmayoganilayah sumana lakshmanagrajah
    || 13|| sarvatirthamayah shurah sarvayajnaphalapradah | yajnasvarupi yajnesho jaramaranavarjitah ||
    14|| varnashramakaro varni shatrujit purushottamah | vibhishanapratishthata paramatma paratparah ||
    15|| pramanabhuto durjneyah purnah parapuranjayah | anantadrishtiranando dhanurvedo dhanurdharah ||
    16|| gunakaro gunashreshthah saccidanandavigrahah | abhivandyo mahakayo vishvakarma visharadah ||
    17|| vinitatma vitaragastapasvisho janeshvarah | kalyanaprakritih kalpah sarveshah sarvakamadah ||
    18|| akshayah purushah sakshi keshavah purushottamah | lokadhyaksho mahamayo vibhishanavarapradah
    || 19|| anandavigraho jyotirhanumatprabhuravyayah | bhrajishnuh sahano bhokta satyavadi bahushrutah
    || 20|| sukhadah karanam karta bhavabandhavimocanah | devacudamanirneta brahmanyo brahmavardhanah
    || 21|| samsarottarako ramah sarvaduhkhavimokshakrit | vidvattamo vishvakarta vishvaharta ca vishvakrit
    || 22|| nityo niyatakalyanah sitashokavinashakrit | kakutsthah pundarikaksho vishvamitrabhayapahah
    || 23|| maricamathano ramo viradhavadhapanditah | duhsvapnanashano ramyah kiriti tridashadhipah ||
    24|| mahadhanurmahakayo bhimo bhimaparakramah | tattvasvarupi tattvajnastattvavadi suvikramah || 25||
    bhutatma bhutakritsvami kalajnani mahapatuh | anirvinno gunagrahi nishkalankah kalankaha || 26|| svabhavabhadrah
    shatrughnah keshavah sthanurishvarah | bhutadih shambhuradityah sthavishthah shashvato dhruvah ||
    27|| kavaci kundali cakri khadgi bhaktajanapriyah | amrityurjanmarahitah sarvajitsarvagocarah || 28||
    anuttamo'prameyatma sarvadirgunasagarah | samah samatma samago jatamukutamanditah || 29|| ajeyah sarvabhutatma
    vishvakseno mahatapah | lokadhyaksho mahabahuramrito vedavittamah || 30|| sahishnuh sadgatih shasta
    vishvayonirmahadyutih | atindra urjitah pramshurupendro vamano bali || 31|| dhanurvedo vidhata ca
    brahma vishnushca shankarah | hamso maricirgovindo ratnagarbho mahamatih || 32|| vyaso vacaspatih
    sarvadarpitasuramardanah | janakivallabhah pujyah prakatah pritivardhanah || 33|| sambhavo'tindriyo
    vedyo'nirdesho jambavatprabhuh | madano mathano vyapi vishvarupo niranjanah || 34|| narayano'granih
    sadhurjatayupritivardhanah | naikarupo jagannathah surakaryahitah svabhuh || 35|| jitakrodho jitaratih
    plavagadhiparajyadah | vasudah subhujo naikamayo bhavyapramodanah || 36|| candamshuh siddhidah kalpah
    sharanagatavatsalah | agado rogaharta ca mantrajno mantrabhavanah || 37|| saumitrivatsalo dhuryo vyaktavyaktasvarupadhrik
    | vasishtho gramanih shrimananukulah priyamvadah || 38|| atulah sattviko dhirah sharasanavisharadah
    | jyeshthah sarvagunopetah shaktimamstatakantakah || 39|| vaikunthah praninam pranah kamathah kamalapatih
    | govardhanadharo matsyarupah karunyasagarah || 40|| kumbhakarnaprabhetta ca gopigopalasamvritah |
    mayavi vyapako vyapi rainukeyabalapahah || 41|| pinakamathano vandyah samartho garudadhvajah | lokatrayashrayo
    lokacarito bharatagrajah || 42|| shridharah sadgatirlokasakshi narayano budhah | manovegi manorupi
    purnah purushapungavah || 43|| yadushreshtho yadupatirbhutavasah suvikramah | tejodharo dharadharashcaturmurtirmahanidhih
    || 44|| canuramardano divyah shanto bharatavanditah | shabdatigo gabhiratma komalangah prajagarah
    || 45|| lokagarbhah sheshashayi kshirabdhinilayo'malah | atmayoniradinatma sahasrakshah sahasrapat
    || 46|| amritamshurmahagarbho nivrittavishayasprihah | trikalajno munih sakshi vihayasagatih kriti
    || 47|| parjanyah kumudo bhutavasah kamalalocanah | shrivatsavakshah shrivaso viraha lakshmanagrajah
    || 48|| lokabhiramo lokarimardanah sevakapriyah | sanatanatamo meghashyamalo rakshasantakrit || 49||
    divyayudhadharah shrimanaprameyo jitendriyah | bhudevavandyo janakapriyakritprapitamahah || 50|| uttamah
    sattvikah satyah satyasandhastrivikramah | suvratah sulabhah sukshmah sughoshah sukhadah sudhih ||
    51|| damodaro'cyutah sharngi vamano madhuradhipah | devakinandanah shaurih shurah kaitabhamardanah
    || 52|| saptatalaprabhetta ca mitravamshapravardhanah | kalasvarupi kalatmakalah kalyanadahkavih |
    samvatsara rituh paksho hyayanam divaso yugah || 53|| stavyo vivikto nirlepah sarvavyapi nirakulah
    | anadinidhanah sarvalokapujyo niramayah || 54|| raso rasajnah sarajno lokasaro rasatmakah | sarvaduhkhatigo
    vidyarashih paramagocarah || 55|| shesho vishesho vigatakalmasho raghunayakah | varnashreshtho varnavahyo
    varnyo varnyagunojjvalah || 56|| karmasakshyamarashreshtho devadevah sukhapradah | devadhidevo devarshirdevasuranamaskritah
    || 57|| sarvadevamayashcakri sharngapani raghuttamah | mano buddhirahankarah prakritih purusho'vyayah
    || 58|| ahalyapavanah svami pitribhakto varapradah | nyayo nyayi nayi shrimannayo nagadharo dhruvah
    || 59|| lakshmivishvambharabharta devendro balimardanah | vanarimardano yajvanuttamo munisevitah ||
    60|| devagranih shivadhyanatatparah paramah parah | samageyah priyo'krurah punyakirtih sulocanah ||
    61|| punyah punyadhikah purvah purnah purayita ravih | jatilah kalmashadhvantaprabhanjanavibhavasuh
    || 62|| avyaktalakshano'vyakto dashasyadvipakesari | kalanidhih kalanatho kamalanandavardhanah ||
    63|| jayi jitarih sarvadih shamano bhavabhanjanah | alankarishnuracalo rocishnurvikramottamah || 64||
    ashuh shabdapatih shabdagocaro ranjano raghuh | nihshabdah pranavo mali sthulah sukshmo vilakshanah
    || 65|| atmayonirayonishca saptajihvah sahasrapat | sanatanatamah sragvi peshalo javinam varah ||
    66|| shaktimanshankhabhrinnathah gadapadmarathangabhrit | niriho nirvikalpashca cidrupo vitasadhvasah
    || 67|| shatananah sahasrakshah shatamurtirdhanaprabhah | hritpundarikashayanah kathino drava eva
    ca || 68|| ugro grahapatih shriman samartho'narthanashanah | adharmashatru rakshoghnah puruhutah purushtutah
    || 69|| brahmagarbho brihadgarbho dharmadhenurdhanagamah | hiranyagarbho jyotishman sulalatah suvikramah
    || 70|| shivapujaratah shriman bhavanipriyakridvashi | naro narayanah shyamah kapardi nilalohitah
    || 71|| rudrah pashupatih sthanurvishvamitro dvijeshvarah | matamaho matarishva virinco vishtarashravah
    || 72|| akshobhyah sarvabhutanam candah satyaparakramah | valakhilyo mahakalpah kalpavrikshah kaladharah
    || 73|| nidaghastapano'moghah shlakshnah parabalapahrit | kabandhamathano divyah kambugrivashivapriyah
    || 74|| shankho'nilah sunishpannah sulabhah shishiratmakah | asamsrishto'tithih shurah pramathi papanashakrit
    || 75|| vasushravah kavyavahah pratapto vishvabhojanah | ramo nilotpalashyamo jnanaskandho mahadyutih
    || 76|| pavitrapadah paparirmanipuro nabhogatih | uttarano dushkritiha durdharsho duhsaho'bhayah ||
    77|| amritesho'mritavapurdharmi dharmah kripakarah | bhargo vivasvanadityo yogacaryo divaspatih ||
    78|| udarakirtirudyogi vanmayah sadasanmayah | nakshatramali nakeshah svadhishthanah shadashrayah
    || 79|| caturvargaphalo varni shaktitrayaphalam nidhih | nidhanagarbho nirvyajo girisho vyalamardanah
    || 80|| shrivallabhah shivarambhah shantirbhadrah samanjasah | bhushayo bhutikridbhutirbhushano bhutavahanah
    || 81|| akayo bhaktakayasthah kalajnani mahavatuh | pararthavrittiracalo viviktah shrutisagarah ||
    82|| svabhavabhadro madhyasthah samsarabhayanashanah | vedyo vaidyo viyadgopta sarvamaramunishvarah
    || 83|| surendrah karanam karma karmakritkarmyadhokshajah | dhyeyo dhuryo dharadhishah samkalpah sharvaripatih
    || 84|| paramarthagururvriddhah shucirashritavatsalah | vishnurjishnurvibhurvandyo yajnesho yajnapalakah
    || 85|| prabhavishnurgrasishnushca lokatma lokabhavanah | keshavah keshiha kavyah kavih karanakaranam
    || 86|| kalakarta kalashesho vasudevah purushtutah | adikarta varahashca madhavo madhusudanah || 87||
    narayano naro hamso vishvakseno janardanah | vishvakarta mahayajno jyotishman purushottamah || 88||
    vaikunthah pundarikakshah krishnah suryah surarcitah | narasimho mahabhimo vakradamshtro nakhayudhah
    || 89|| adidevo jagatkarta yogisho garudadhvajah | govindo gopatirgopta bhupatirbhuvaneshvarah ||
    90|| padmanabho hrishikesho dhata damodarah prabhuh | trivikramastrilokesho brahmeshah pritivardhanah
    || 91|| vamano dushtadamano govindo gopavallabhah | bhaktapriyo'cyutah satyah satyakirtirdhritih smritih
    || 92|| karunyam karuno vyasah papaha shantivardhanah | samnyasi shastratattvajno mandaradriniketanah
    || 93|| badarinilayah shantastapasvi vaidyutaprabhah | bhutavaso guhavasah shrinivasah shriyah patih
    || 94|| tapovaso mudavasah satyavasah sanatanah | purushah pushkarah punyah pushkaraksho maheshvarah
    || 95|| purnamurtih puranajnah punyadah pritivardhanah | shankhi cakri gadi sharngi langali musali
    hali || 96|| kiriti kundali hari mekhali kavaci dhvaji | yoddha jeta mahaviryah shatrujicchatrutapanah
    || 97|| shasta shastrakarah shastram shankarah shankarastutah | sarathih sattvikah svami samavedapriyah
    samah || 98|| pavanah samhatah shaktih sampurnangah samriddhiman | svargadah kamadah shridah kirtido'kirtinashanah
    || 99|| mokshadah pundarikakshah kshirabdhikritaketanah | sarvatma sarvalokeshah prerakah papanashanah
    || 100|| sarvavyapi jagannathah sarvalokamaheshvarah | sargasthityantakriddevah sarvalokasukhavahah
    || 101|| akshayyah shashvato'nantah kshayavriddhivivarjitah | nirlepo nirgunah sukshmo nirvikaro niranjanah
    || 102|| sarvopadhivinirmuktah sattamatravyavasthitah | adhikari vibhurnityah paramatma sanatanah
    || 103|| acalo nirmalo vyapi nityatripto nirashrayah | shyamo yuva lohitaksho diptasyo mitabhashanah
    || 104|| ajanubahuh sumukhah simhaskandho mahabhujah | satyavan gunasampannah svayantejah sudiptiman
    || 105|| kalatma bhagavan kalah kalacakrapravartakah | narayanah paranjyotih paramatma sanatanah ||
    106|| vishvasrid vishvagopta ca vishvabhokta ca shashvatah | vishveshvaro vishvamurtirvishvatma vishvabhavanah
    || 107|| sarvabhutasuhricchantah sarvabhutanukampanah | sarveshvareshvarah sarvah shrimanashritavatsalah
    || 108|| sarvagah sarvabhuteshah sarvabhutashayasthitah | abhyantarasthastamasashchetta narayanah
    parah || 109|| anadinidhanah srashta prajapatipatirharih | narasimho hrishikeshah sarvatma sarvadrigvashi
    || 110|| jagatastasthushashcaiva prabhurneta sanatanah | karta dhata vidhata ca sarvesham prabhurishvarah
    || 111|| sahasramurtirvishvatma vishnurvishvadrigavyayah | puranapurushah srashta sahasrakshah sahasrapat
    || 112|| tattvam narayano vishnurvasudevah sanatanah | paramatma param brahma saccidanandavigrahah
    || 113|| paranjyotih parandhamah parakashah paratparah | acyutah purushah krishnah shashvatah shiva
    ishvarah || 114|| nityah sarvagatah sthanurugrah sakshi prajapatih | hiranyagarbhah savita lokakrillokabhridvibhuh
    || 115|| ramah shriman mahavishnurjishnurdevahitavahah | tattvatma tarakam brahma shashvatah sarvasiddhidah
    || 116|| akaravacyo bhagavan shrirbhu lilapatih puman | sarvalokeshvarah shriman sarvajnah sarvatomukhah
    || 117|| svami sushilah sulabhah sarvajnah sarvashaktiman | nityah sampurnakamashca naisargikasuhritsukhi
    || 118|| kripapiyushajaladhih sharanyah sarvadehinam | shrimannarayanah svami jagatam patirishvarah
    || 119|| shrishah sharanyo bhutanam samshritabhishtadayakah | anantah shripati ramo gunabhrinnirguno
    mahan || 120|| || iti shriramasahasranamastotram sampurnam ||
  devanagari: विज्ञानहेतुं विमलायताक्षं प्रज्ञानरूपं स्वसुखैकहेतुम् । श्रीरामचन्द्रं हरिमादिदेवं परात्परं
    राममहं भजामि ॥ तत्त्वस्वरूपं पुरुषं पुराणं स्वतेजसा पूरितविश्वमेकम् । राजाधिराजं रविमण्डलस्थं विश्वेश्वरं
    राममहं भजामि । लमित्यादिपञ्चपूजाः । ॐ रामः श्रीमान् महाविष्णुर्जिष्णुर्देवहितावहः । तत्त्वात्मा तारकं
    ब्रह्म शाश्वतः सर्वसिद्धिदः ॥ राजीवलोचनः श्रीमान् श्रीरामो रघुपुङ्गवः । रामभद्रः सदाचारो राजेन्द्रो
    जानकीपतिः ॥ १॥ अग्रगण्यो वरेण्यश्च वरदः परमेश्वरः । जनार्दनो जितामित्रः परार्थैकप्रयोजनः ॥ २॥ विश्वामित्रप्रियो
    दान्तः शत्रुजिच्छत्रुतापनः । सर्वज्ञः सर्वदेवादिः शरण्यो वालिमर्दनः ॥ ३॥ ज्ञानभाव्योऽपरिच्छेद्यो वाग्मी
    सत्यव्रतः शुचिः । ज्ञानगम्यो दृढप्रज्ञः खरध्वंसी प्रतापवान् ॥ ४॥ द्युतिमानात्मवान् वीरो जितक्रोधोऽरिमर्दनः
    । विश्वरूपो विशालाक्षः प्रभुः परिवृढो दृढः ॥ ५॥ ईशः खड्गधरः श्रीमान् कौसलेयोऽनसूयकः । विपुलांसो महोरस्कः
    परमेष्ठी परायणः ॥ ६॥ सत्यव्रतः सत्यसन्धो गुरुः परमधार्मिकः । लोकज्ञो लोकवन्द्यश्च लोकात्मा लोककृत्परः
    ॥ ७॥ अनादिर्भगवान् सेव्यो जितमायो रघूद्वहः । रामो दयाकरो दक्षः सर्वज्ञः सर्वपावनः ॥ ८॥ ब्रह्मण्यो
    नीतिमान् गोप्ता सर्वदेवमयो हरिः । सुन्दरः पीतवासाश्च सूत्रकारः पुरातनः ॥ ९॥ सौम्यो महर्षिः कोदण्डी
    सर्वज्ञः सर्वकोविदः । कविः सुग्रीववरदः सर्वपुण्याधिकप्रदः ॥ १०॥ भव्यो जितारिषड्वर्गो महोदारोऽघनाशनः
    । सुकीर्तिरादिपुरुषः कान्तः पुण्यकृतागमः ॥ ११॥ अकल्मषश्चतुर्बाहुः सर्वावासो दुरासदः । स्मितभाषी निवृत्तात्मा
    स्मृतिमान् वीर्यवान् प्रभुः ॥ १२॥ धीरो दान्तो घनश्यामः सर्वायुधविशारदः । अध्यात्मयोगनिलयः सुमना लक्ष्मणाग्रजः
    ॥ १३॥ सर्वतीर्थमयः शूरः सर्वयज्ञफलप्रदः । यज्ञस्वरूपी यज्ञेशो जरामरणवर्जितः ॥ १४॥ वर्णाश्रमकरो वर्णी
    शत्रुजित् पुरुषोत्तमः । विभीषणप्रतिष्ठाता परमात्मा परात्परः ॥ १५॥ प्रमाणभूतो दुर्ज्ञेयः पूर्णः परपुरञ्जयः
    । अनन्तदृष्टिरानन्दो धनुर्वेदो धनुर्धरः ॥ १६॥ गुणाकरो गुणश्रेष्ठः सच्चिदानन्दविग्रहः । अभिवन्द्यो
    महाकायो विश्वकर्मा विशारदः ॥ १७॥ विनीतात्मा वीतरागस्तपस्वीशो जनेश्वरः । कल्याणप्रकृतिः कल्पः सर्वेशः
    सर्वकामदः ॥ १८॥ अक्षयः पुरुषः साक्षी केशवः पुरुषोत्तमः । लोकाध्यक्षो महामायो विभीषणवरप्रदः ॥ १९॥ आनन्दविग्रहो
    ज्योतिर्हनुमत्प्रभुरव्ययः । भ्राजिष्णुः सहनो भोक्ता सत्यवादी बहुश्रुतः ॥ २०॥ सुखदः कारणं कर्ता भवबन्धविमोचनः
    । देवचूडामणिर्नेता ब्रह्मण्यो ब्रह्मवर्धनः ॥ २१॥ संसारोत्तारको रामः सर्वदुःखविमोक्षकृत् । विद्वत्तमो
    विश्वकर्ता विश्वहर्ता च विश्वकृत् ॥ २२॥ नित्यो नियतकल्याणः सीताशोकविनाशकृत् । काकुत्स्थः पुण्डरीकाक्षो
    विश्वामित्रभयापहः ॥ २३॥ मारीचमथनो रामो विराधवधपण्डितः । दुःस्वप्ननाशनो रम्यः किरीटी त्रिदशाधिपः ॥
    २४॥ महाधनुर्महाकायो भीमो भीमपराक्रमः । तत्त्वस्वरूपी तत्त्वज्ञस्तत्त्ववादी सुविक्रमः ॥ २५॥ भूतात्मा
    भूतकृत्स्वामी कालज्ञानी महापटुः । अनिर्विण्णो गुणग्राही निष्कलङ्कः कलङ्कहा ॥ २६॥ स्वभावभद्रः शत्रुघ्नः
    केशवः स्थाणुरीश्वरः । भूतादिः शम्भुरादित्यः स्थविष्ठः शाश्वतो ध्रुवः ॥ २७॥ कवची कुण्डली चक्री खड्गी
    भक्तजनप्रियः । अमृत्युर्जन्मरहितः सर्वजित्सर्वगोचरः ॥ २८॥ अनुत्तमोऽप्रमेयात्मा सर्वादिर्गुणसागरः ।
    समः समात्मा समगो जटामुकुटमण्डितः ॥ २९॥ अजेयः सर्वभूतात्मा विष्वक्सेनो महातपाः । लोकाध्यक्षो महाबाहुरमृतो
    वेदवित्तमः ॥ ३०॥ सहिष्णुः सद्गतिः शास्ता विश्वयोनिर्महाद्युतिः । अतीन्द्र ऊर्जितः प्रांशुरुपेन्द्रो
    वामनो बली ॥ ३१॥ धनुर्वेदो विधाता च ब्रह्मा विष्णुश्च शङ्करः । हंसो मरीचिर्गोविन्दो रत्नगर्भो महामतिः
    ॥ ३२॥ व्यासो वाचस्पतिः सर्वदर्पितासुरमर्दनः । जानकीवल्लभः पूज्यः प्रकटः प्रीतिवर्धनः ॥ ३३॥ सम्भवोऽतीन्द्रियो
    वेद्योऽनिर्देशो जाम्बवत्प्रभुः । मदनो मथनो व्यापी विश्वरूपो निरञ्जनः ॥ ३४॥ नारायणोऽग्रणीः साधुर्जटायुप्रीतिवर्धनः
    । नैकरूपो जगन्नाथः सुरकार्यहितः स्वभूः ॥ ३५॥ जितक्रोधो जितारातिः प्लवगाधिपराज्यदः । वसुदः सुभुजो नैकमायो
    भव्यप्रमोदनः ॥ ३६॥ चण्डांशुः सिद्धिदः कल्पः शरणागतवत्सलः । अगदो रोगहर्ता च मन्त्रज्ञो मन्त्रभावनः
    ॥ ३७॥ सौमित्रिवत्सलो धुर्यो व्यक्ताव्यक्तस्वरूपधृक् । वसिष्ठो ग्रामणीः श्रीमाननुकूलः प्रियंवदः ॥ ३८॥
    अतुलः सात्त्विको धीरः शरासनविशारदः । ज्येष्ठः सर्वगुणोपेतः शक्तिमांस्ताटकान्तकः ॥ ३९॥ वैकुण्ठः प्राणिनां
    प्राणः कमठः कमलापतिः । गोवर्धनधरो मत्स्यरूपः कारुण्यसागरः ॥ ४०॥ कुम्भकर्णप्रभेत्ता च गोपीगोपालसंवृतः
    । मायावी व्यापको व्यापी रैणुकेयबलापहः ॥ ४१॥ पिनाकमथनो वन्द्यः समर्थो गरुडध्वजः । लोकत्रयाश्रयो लोकचरितो
    भरताग्रजः ॥ ४२॥ श्रीधरः सद्गतिर्लोकसाक्षी नारायणो बुधः । मनोवेगी मनोरूपी पूर्णः पुरुषपुङ्गवः ॥ ४३॥
    यदुश्रेष्ठो यदुपतिर्भूतावासः सुविक्रमः । तेजोधरो धराधारश्चतुर्मूर्तिर्महानिधिः ॥ ४४॥ चाणूरमर्दनो दिव्यः
    शान्तो भरतवन्दितः । शब्दातिगो गभीरात्मा कोमलाङ्गः प्रजागरः ॥ ४५॥ लोकगर्भः शेषशायी क्षीराब्धिनिलयोऽमलः
    । आत्मयोनिरदीनात्मा सहस्राक्षः सहस्रपात् ॥ ४६॥ अमृतांशुर्महागर्भो निवृत्तविषयस्पृहः । त्रिकालज्ञो
    मुनिः साक्षी विहायसगतिः कृती ॥ ४७॥ पर्जन्यः कुमुदो भूतावासः कमललोचनः । श्रीवत्सवक्षाः श्रीवासो वीरहा
    लक्ष्मणाग्रजः ॥ ४८॥ लोकाभिरामो लोकारिमर्दनः सेवकप्रियः । सनातनतमो मेघश्यामलो राक्षसान्तकृत् ॥ ४९॥
    दिव्यायुधधरः श्रीमानप्रमेयो जितेन्द्रियः । भूदेववन्द्यो जनकप्रियकृत्प्रपितामहः ॥ ५०॥ उत्तमः सात्त्विकः
    सत्यः सत्यसन्धस्त्रिविक्रमः । सुव्रतः सुलभः सूक्ष्मः सुघोषः सुखदः सुधीः ॥ ५१॥ दामोदरोऽच्युतः शार्ङ्गी
    वामनो मधुराधिपः । देवकीनन्दनः शौरिः शूरः कैटभमर्दनः ॥ ५२॥ सप्ततालप्रभेत्ता च मित्रवंशप्रवर्धनः । कालस्वरूपी
    कालात्माकालः कल्याणदःकविः । संवत्सर ऋतुः पक्षो ह्ययनं दिवसो युगः ॥ ५३॥ स्तव्यो विविक्तो निर्लेपः सर्वव्यापी
    निराकुलः । अनादिनिधनः सर्वलोकपूज्यो निरामयः ॥ ५४॥ रसो रसज्ञः सारज्ञो लोकसारो रसात्मकः । सर्वदुःखातिगो
    विद्याराशिः परमगोचरः ॥ ५५॥ शेषो विशेषो विगतकल्मषो रघुनायकः । वर्णश्रेष्ठो वर्णवाह्यो वर्ण्यो वर्ण्यगुणोज्ज्वलः
    ॥ ५६॥ कर्मसाक्ष्यमरश्रेष्ठो देवदेवः सुखप्रदः । देवाधिदेवो देवर्षिर्देवासुरनमस्कृतः ॥ ५७॥ सर्वदेवमयश्चक्री
    शार्ङ्गपाणी रघूत्तमः । मनो बुद्धिरहङ्कारः प्रकृतिः पुरुषोऽव्ययः ॥ ५८॥ अहल्यापावनः स्वामी पितृभक्तो
    वरप्रदः । न्यायो न्यायी नयी श्रीमान्नयो नगधरो ध्रुवः ॥ ५९॥ लक्ष्मीविश्वम्भराभर्ता देवेन्द्रो बलिमर्दनः
    । वाणारिमर्दनो यज्वानुत्तमो मुनिसेवितः ॥ ६०॥ देवाग्रणीः शिवध्यानतत्परः परमः परः । सामगेयः प्रियोऽक्रूरः
    पुण्यकीर्तिः सुलोचनः ॥ ६१॥ पुण्यः पुण्याधिकः पूर्वः पूर्णः पूरयिता रविः । जटिलः कल्मषध्वान्तप्रभञ्जनविभावसुः
    ॥ ६२॥ अव्यक्तलक्षणोऽव्यक्तो दशास्यद्विपकेसरी । कलानिधिः कलानाथो कमलानन्दवर्धनः ॥ ६३॥ जयी जितारिः सर्वादिः
    शमनो भवभञ्जनः । अलङ्करिष्णुरचलो रोचिष्णुर्विक्रमोत्तमः ॥ ६४॥ आशुः शब्दपतिः शब्दागोचरो रञ्जनो रघुः
    । निःशब्दः प्रणवो माली स्थूलः सूक्ष्मो विलक्षणः ॥ ६५॥ आत्मयोनिरयोनिश्च सप्तजिह्वः सहस्रपात् । सनातनतमः
    स्रग्वी पेशलो जविनां वरः ॥ ६६॥ शक्तिमाञ्शङ्खभृन्नाथः गदापद्मरथाङ्गभृत् । निरीहो निर्विकल्पश्च चिद्रूपो
    वीतसाध्वसः ॥ ६७॥ शताननः सहस्राक्षः शतमूर्तिर्धनप्रभः । हृत्पुण्डरीकशयनः कठिनो द्रव एव च ॥ ६८॥ उग्रो
    ग्रहपतिः श्रीमान् समर्थोऽनर्थनाशनः । अधर्मशत्रू रक्षोघ्नः पुरुहूतः पुरुष्टुतः ॥ ६९॥ ब्रह्मगर्भो बृहद्गर्भो
    धर्मधेनुर्धनागमः । हिरण्यगर्भो ज्योतिष्मान् सुललाटः सुविक्रमः ॥ ७०॥ शिवपूजारतः श्रीमान् भवानीप्रियकृद्वशी
    । नरो नारायणः श्यामः कपर्दी नीललोहितः ॥ ७१॥ रुद्रः पशुपतिः स्थाणुर्विश्वामित्रो द्विजेश्वरः । मातामहो
    मातरिश्वा विरिञ्चो विष्टरश्रवाः ॥ ७२॥ अक्षोभ्यः सर्वभूतानां चण्डः सत्यपराक्रमः । वालखिल्यो महाकल्पः
    कल्पवृक्षः कलाधरः ॥ ७३॥ निदाघस्तपनोऽमोघः श्लक्ष्णः परबलापहृत् । कबन्धमथनो दिव्यः कम्बुग्रीवशिवप्रियः
    ॥ ७४॥ शङ्खोऽनिलः सुनिष्पन्नः सुलभः शिशिरात्मकः । असंसृष्टोऽतिथिः शूरः प्रमाथी पापनाशकृत् ॥ ७५॥ वसुश्रवाः
    कव्यवाहः प्रतप्तो विश्वभोजनः । रामो नीलोत्पलश्यामो ज्ञानस्कन्धो महाद्युतिः ॥ ७६॥ पवित्रपादः पापारिर्मणिपूरो
    नभोगतिः । उत्तारणो दुष्कृतिहा दुर्धर्षो दुःसहोऽभयः ॥ ७७॥ अमृतेशोऽमृतवपुर्धर्मी धर्मः कृपाकरः । भर्गो
    विवस्वानादित्यो योगाचार्यो दिवस्पतिः ॥ ७८॥ उदारकीर्तिरुद्योगी वाङ्मयः सदसन्मयः । नक्षत्रमाली नाकेशः
    स्वाधिष्ठानः षडाश्रयः ॥ ७९॥ चतुर्वर्गफलो वर्णी शक्तित्रयफलं निधिः । निधानगर्भो निर्व्याजो गिरीशो व्यालमर्दनः
    ॥ ८०॥ श्रीवल्लभः शिवारम्भः शान्तिर्भद्रः समञ्जसः । भूशयो भूतिकृद्भूतिर्भूषणो भूतवाहनः ॥ ८१॥ अकायो
    भक्तकायस्थः कालज्ञानी महावटुः । परार्थवृत्तिरचलो विविक्तः श्रुतिसागरः ॥ ८२॥ स्वभावभद्रो मध्यस्थः संसारभयनाशनः
    । वेद्यो वैद्यो वियद्गोप्ता सर्वामरमुनीश्वरः ॥ ८३॥ सुरेन्द्रः करणं कर्म कर्मकृत्कर्म्यधोक्षजः । ध्येयो
    धुर्यो धराधीशः संकल्पः शर्वरीपतिः ॥ ८४॥ परमार्थगुरुर्वृद्धः शुचिराश्रितवत्सलः । विष्णुर्जिष्णुर्विभुर्वन्द्यो
    यज्ञेशो यज्ञपालकः ॥ ८५॥ प्रभविष्णुर्ग्रसिष्णुश्च लोकात्मा लोकभावनः । केशवः केशिहा काव्यः कविः कारणकारणम्
    ॥ ८६॥ कालकर्ता कालशेषो वासुदेवः पुरुष्टुतः । आदिकर्ता वराहश्च माधवो मधुसूदनः ॥ ८७॥ नारायणो नरो हंसो
    विष्वक्सेनो जनार्दनः । विश्वकर्ता महायज्ञो ज्योतिष्मान् पुरुषोत्तमः ॥ ८८॥ वैकुण्ठः पुण्डरीकाक्षः कृष्णः
    सूर्यः सुरार्चितः । नारसिंहो महाभीमो वक्रदंष्ट्रो नखायुधः ॥ ८९॥ आदिदेवो जगत्कर्ता योगीशो गरुडध्वजः
    । गोविन्दो गोपतिर्गोप्ता भूपतिर्भुवनेश्वरः ॥ ९०॥ पद्मनाभो हृषीकेशो धाता दामोदरः प्रभुः । त्रिविक्रमस्त्रिलोकेशो
    ब्रह्मेशः प्रीतिवर्धनः ॥ ९१॥ वामनो दुष्टदमनो गोविन्दो गोपवल्लभः । भक्तप्रियोऽच्युतः सत्यः सत्यकीर्तिर्धृतिः
    स्मृतिः ॥ ९२॥ कारुण्यं करुणो व्यासः पापहा शान्तिवर्धनः । संन्यासी शास्त्रतत्त्वज्ञो मन्दराद्रिनिकेतनः
    ॥ ९३॥ बदरीनिलयः शान्तस्तपस्वी वैद्युतप्रभः । भूतावासो गुहावासः श्रीनिवासः श्रियः पतिः ॥ ९४॥ तपोवासो
    मुदावासः सत्यवासः सनातनः । पुरुषः पुष्करः पुण्यः पुष्कराक्षो महेश्वरः ॥ ९५॥ पूर्णमूर्तिः पुराणज्ञः
    पुण्यदः प्रीतिवर्धनः । शङ्खी चक्री गदी शार्ङ्गी लाङ्गली मुसली हली ॥ ९६॥ किरीटी कुण्डली हारी मेखली
    कवची ध्वजी । योद्धा जेता महावीर्यः शत्रुजिच्छत्रुतापनः ॥ ९७॥ शास्ता शास्त्रकरः शास्त्रं शङ्करः शङ्करस्तुतः
    । सारथिः सात्त्विकः स्वामी सामवेदप्रियः समः ॥ ९८॥ पवनः संहतः शक्तिः सम्पूर्णाङ्गः समृद्धिमान् । स्वर्गदः
    कामदः श्रीदः कीर्तिदोऽकीर्तिनाशनः ॥ ९९॥ मोक्षदः पुण्डरीकाक्षः क्षीराब्धिकृतकेतनः । सर्वात्मा सर्वलोकेशः
    प्रेरकः पापनाशनः ॥ १००॥ सर्वव्यापी जगन्नाथः सर्वलोकमहेश्वरः । सर्गस्थित्यन्तकृद्देवः सर्वलोकसुखावहः
    ॥ १०१॥ अक्षय्यः शाश्वतोऽनन्तः क्षयवृद्धिविवर्जितः । निर्लेपो निर्गुणः सूक्ष्मो निर्विकारो निरञ्जनः
    ॥ १०२॥ सर्वोपाधिविनिर्मुक्तः सत्तामात्रव्यवस्थितः । अधिकारी विभुर्नित्यः परमात्मा सनातनः ॥ १०३॥ अचलो
    निर्मलो व्यापी नित्यतृप्तो निराश्रयः । श्यामो युवा लोहिताक्षो दीप्तास्यो मितभाषणः ॥ १०४॥ आजानुबाहुः
    सुमुखः सिंहस्कन्धो महाभुजः । सत्यवान् गुणसम्पन्नः स्वयन्तेजाः सुदीप्तिमान् ॥ १०५॥ कालात्मा भगवान्
    कालः कालचक्रप्रवर्तकः । नारायणः परञ्ज्योतिः परमात्मा सनातनः ॥ १०६॥ विश्वसृड् विश्वगोप्ता च विश्वभोक्ता
    च शाश्वतः । विश्वेश्वरो विश्वमूर्तिर्विश्वात्मा विश्वभावनः ॥ १०७॥ सर्वभूतसुहृच्छान्तः सर्वभूतानुकम्पनः
    । सर्वेश्वरेश्वरः सर्वः श्रीमानाश्रितवत्सलः ॥ १०८॥ सर्वगः सर्वभूतेशः सर्वभूताशयस्थितः । अभ्यन्तरस्थस्तमसश्छेत्ता
    नारायणः परः ॥ १०९॥ अनादिनिधनः स्रष्टा प्रजापतिपतिर्हरिः । नरसिंहो हृषीकेशः सर्वात्मा सर्वदृग्वशी ॥
    ११०॥ जगतस्तस्थुषश्चैव प्रभुर्नेता सनातनः । कर्ता धाता विधाता च सर्वेषां प्रभुरीश्वरः ॥ १११॥ सहस्रमूर्तिर्विश्वात्मा
    विष्णुर्विश्वदृगव्ययः । पुराणपुरुषः स्रष्टा सहस्राक्षः सहस्रपात् ॥ ११२॥ तत्त्वं नारायणो विष्णुर्वासुदेवः
    सनातनः । परमात्मा परं ब्रह्म सच्चिदानन्दविग्रहः ॥ ११३॥ परञ्ज्योतिः परन्धामः पराकाशः परात्परः । अच्युतः
    पुरुषः कृष्णः शाश्वतः शिव ईश्वरः ॥ ११४॥ नित्यः सर्वगतः स्थाणुरुग्रः साक्षी प्रजापतिः । हिरण्यगर्भः
    सविता लोककृल्लोकभृद्विभुः ॥ ११५॥ रामः श्रीमान् महाविष्णुर्जिष्णुर्देवहितावहः । तत्त्वात्मा तारकं ब्रह्म
    शाश्वतः सर्वसिद्धिदः ॥ ११६॥ अकारवाच्यो भगवान् श्रीर्भू लीलापतिः पुमान् । सर्वलोकेश्वरः श्रीमान् सर्वज्ञः
    सर्वतोमुखः ॥ ११७॥ स्वामी सुशीलः सुलभः सर्वज्ञः सर्वशक्तिमान् । नित्यः सम्पूर्णकामश्च नैसर्गिकसुहृत्सुखी
    ॥ ११८॥ कृपापीयूषजलधिः शरण्यः सर्वदेहिनाम् । श्रीमान्नारायणः स्वामी जगतां पतिरीश्वरः ॥ ११९॥ श्रीशः
    शरण्यो भूतानां संश्रिताभीष्टदायकः । अनन्तः श्रीपती रामो गुणभृन्निर्गुणो महान् ॥ १२०॥ ॥ इति श्रीरामसहस्रनामस्तोत्रं
    सम्पूर्णम् ॥
