id: shriramadurgastotram
category: kavacha
name:
  english: shriramadurgastotram
  devanagari: श्रीरामदुर्गस्तोत्रम्
content:
  english: shriramadurgastotram || atha shriramadurgastotram || om asya shriramadurgastotramantrasya kaushikarishiranushtupchandah
    shriramo devata ram bijam namah shakti | ramaya kilakam shriramaprasadasiddhidvara mama sarvato rakshapurvakananaprayogasidhyarthe
    shriramadurgamantrasya pathe viniyogah | om aim klim hrim rim com hrim rim com hrim shrim am kraum
    om namobhagavate ramaya mama sarvabhishtam sadhaya sadhaya phat svaha || om aim hrim klim shrim om
    ramaya namah || om namo bhagavate ramaya mama pracyam jvala jvala prajvala prajvala nirdhanam sadhanam
    sadhaya sadhaya mam raksha raksha sarvadushtebhyo hum phat svaha || 1|| om aim hrim klim om lam lakshmanaya
    namah || om namo bhagavate lakshmanaya mama yamyam jvala jvala prajvala prajvala mam raksha raksha
    sarvadushtebhyo hum phat svaha || 2|| om aim hrim klim shrim om bham bharataya namah | om namo bhagavate
    bharataya mama praticyam jvala jvala prajvala prajvala nirdhanam sadhanam sadhaya sadhaya mam raksha
    raksha sarvadushtebhyo hum phat svaha || 3|| om aim hrim klim shrim om sham shatrughnaya namah | om
    namo bhagavate shatrughnaya mama udicyam jvala jvala prajvala prajvala nirdhanam sadhanam sadhaya
    sadhaya mam raksha raksha sarvadushtebhyo hum phat svaha || 4|| om aim hrim klim shrim om janakyai
    namah | om namo bhagavate me aishanyam jvala jvala prajvala prajvala nirdhanam sadhanam sadhaya sadhaya
    mam raksha raksha sarvadushtebhyo hum phat svaha || 5|| aim hrim klim shrim om sum sugrivaya namah
    | om namo bhagavate sugrivaya mamagneyyam jvala jvala prajvala prajvala nirdhanam sadhanam sadhaya
    sadhaya mam raksha raksha sarvadushtebhyo hum phat svaha || 6|| om aim hrim klim shrim om vim vibhishanaya
    namah | om namo bhagavate vibhishanaya mama nairrityam jvala jvala prajvala prajvala nirdhanam sadhanam
    sadhaya sadhaya mam raksha raksha sarvadushtebhyo hum phat svaha || 7|| om aim hrim klim shrim om
    vam vayusutaya namah | om namo bhagavate vayusutaya mama vayavyam jvala jvala prajvala prajvala nirdhanam
    sadhanam sadhaya sadhaya mam raksha raksha sarvadushtebhyo hum phat svaha || 8|| om aim hrim klim
    shrim om mam mahaviravishnave namah | om namo bhagavate mahavishnave mama urdhvam jvala jvala prajvala
    prajvala nirdhanam sadhanam sadhaya sadhaya mam raksha raksha sarvadushtebhyo hum phat svaha || 9||
    om aim hrim klim shrim om nrim nrisimhaya namah | om namo bhagavate nrisimhaya mama madhye jvala jvala
    prajvala prajvala nirdhanam sadhanam sadhaya sadhaya mam raksha raksha sarvadushtebhyo hum phat svaha
    || 10|| om aim hrim klim shrim om vam vamanaya namah | om namo bhagavate vamanaya mama adho jvala
    jvala prajvala prajvala nirdhanam sadhanam sadhaya sadhaya mam raksha raksha sarvadushtebhyo hum phat
    svaha || 11|| om aim hrim klim om kam keshavaya namah | om namobhagavate keshavaya mama sarvatah jvala
    jvala prajvala prajvala nirdhanam sadhanam sadhaya sadhaya mam raksha raksha sarvadushtebhyo hum phat
    svaha || 12|| om aim hrim klim shrim om mam markatanayakaya namah | om namo bhagavate markatanayakaya
    mama sarvada jvala jvala prajvala prajvala nirdhanam sadhanam sadhaya sadhaya mam raksha raksha sarvadushtebhyo
    hum phat svaha || 13|| om aim hrim klim shrim om kam kapinathaya kapipungavaya namah | om namo bhagavate
    kapipungavaya mama caturdvaram sada jvala jvala prajvala prajvala nirdhanam sadhanam sadhaya sadhaya
    mam raksha raksha sarvadushtebhyo hum phat svaha || 14|| om aim hrim klim shrim ram rim com hrim shrim
    am kraum om aim hrim klim shrim om namo bhagavate ramaya sarvabhishtam sadhaya sadhaya hum phat svaha
    || 15|| iti shriramadurgastotram sampurnam ||
  devanagari: श्रीरामदुर्गस्तोत्रम् ॥ अथ श्रीरामदुर्गस्तोत्रम् ॥ ॐ अस्य श्रीरामदुर्गस्तोत्रमन्त्रस्य कौशिकऋषिरनुष्टुप्छन्दः
    श्रीरामो देवता रां बीजं नमः शक्ति । रामाय कीलकम् श्रीरामप्रसादसिद्धिद्वारा मम सर्वतो रक्षापूर्वकनानाप्रयोगसिध्यर्थे
    श्रीरामदुर्गमन्त्रस्य पाठे विनियोगः । ॐ ऐं क्लीं ह्रीं रीं चों ह्रीं रीं चों ह्रीं श्रीं आं क्रौं
    ॐ नमोभगवते रामाय मम सर्वाभीष्टं साधय साधय फट् स्वाहा ॥ ॐ ऐं ह्रीं क्लीं श्रीं ॐ रामाय नमः ॥ ॐ नमो
    भगवते रामाय मम प्राच्यां ज्वल ज्वल प्रज्वल प्रज्वल निर्धनं सधनं साधय साधय मां रक्ष रक्ष सर्वदुष्टेभ्यो
    हूं फट् स्वाहा ॥ १॥ ॐ ऐं ह्रीं क्लीं ॐ लं लक्ष्मणाय नमः ॥ ॐ नमो भगवते लक्ष्मणाय मम याम्यां ज्वल ज्वल
    प्रज्वल प्रज्वल मां रक्ष रक्ष सर्वदुष्टेभ्यो हूं फट् स्वाहा ॥ २॥ ॐ ऐं ह्रीं क्लीं श्रीं ॐ भं भरताय
    नमः । ॐ नमो भगवते भरताय मम प्रतीच्यां ज्वल ज्वल प्रज्वल प्रज्वल निर्धनं सधनं साधय साधय मां रक्ष रक्ष
    सर्वदुष्टेभ्यो हूं फट् स्वाहा ॥ ३॥ ॐ ऐं ह्रीं क्लीं श्रीं ॐ शं शत्रुघ्नाय नमः । ॐ नमो भगवते शत्रुघ्नाय
    मम उदीच्यां ज्वल ज्वल प्रज्वल प्रज्वल निर्धनं सधनं साधय साधय मां रक्ष रक्ष सर्वदुष्टेभ्यो हूं फट्
    स्वाहा ॥ ४॥ ॐ ऐं ह्रीं क्लीं श्रीं ॐ जानक्यै नमः । ॐ नमो भगवते मे ऐशान्यां ज्वल ज्वल प्रज्वल प्रज्वल
    निर्धनं सधनं साधय साधय मां रक्ष रक्ष सर्वदुष्टेभ्यो हूं फट् स्वाहा ॥ ५॥ ऐं ह्रीं क्लीं श्रीं ॐ सुं
    सुग्रीवाय नमः । ॐ नमो भगवते सुग्रीवाय ममाग्नेय्यां ज्वल ज्वल प्रज्वल प्रज्वल निर्धनं सधनं साधय साधय
    मां रक्ष रक्ष सर्वदुष्टेभ्यो हूं फट् स्वाहा ॥ ६॥ ॐ ऐं ह्रीं क्लीं श्रीं ॐ विं विभीषणाय नमः । ॐ नमो
    भगवते विभीषणाय मम नैरृत्यां ज्वल ज्वल प्रज्वल प्रज्वल निर्धनं सधनं साधय साधय मां रक्ष रक्ष सर्वदुष्टेभ्यो
    हूं फट् स्वाहा ॥ ७॥ ॐ ऐं ह्रीं क्लीं श्रीं ॐ वं वायुसुताय नमः । ॐ नमो भगवते वायुसुताय मम वायव्यां
    ज्वल ज्वल प्रज्वल प्रज्वल निर्धनं सधनं साधय साधय मां रक्ष रक्ष सर्वदुष्टेभ्यो हूं फट् स्वाहा ॥ ८॥
    ॐ ऐं ह्रीं क्लीं श्रीं ॐ मं महावीरविष्णवे नमः । ॐ नमो भगवते महाविष्णवे मम ऊर्ध्वं ज्वल ज्वल प्रज्वल
    प्रज्वल निर्धनं सधनं साधय साधय मां रक्ष रक्ष सर्वदुष्टेभ्यो हूं फट् स्वाहा ॥ ९॥ ॐ ऐं ह्रीं क्लीं श्रीं
    ॐ नृं नृसिंहाय नमः । ॐ नमो भगवते नृसिंहाय मम मध्ये ज्वल ज्वल प्रज्वल प्रज्वल निर्धनं सधनं साधय साधय
    मां रक्ष रक्ष सर्वदुष्टेभ्यो हूं फट् स्वाहा ॥ १०॥ ॐ ऐं ह्रीं क्लीं श्रीं ॐ वं वामनाय नमः । ॐ नमो भगवते
    वामनाय मम अधो ज्वल ज्वल प्रज्वल प्रज्वल निर्धनं सधनं साधय साधय मां रक्ष रक्ष सर्वदुष्टेभ्यो हूं फट्
    स्वाहा ॥ ११॥ ॐ ऐं ह्रीं क्लीं ॐ कं केशवाय नमः । ॐ नमोभगवते केशवाय मम सर्वतः ज्वल ज्वल प्रज्वल प्रज्वल
    निर्धनं सधनं साधय साधय मां रक्ष रक्ष सर्वदुष्टेभ्यो हूं फट् स्वाहा ॥ १२॥ ॐ ऐं ह्रीं क्लीं श्रीं ॐ
    मं मर्कटनायकाय नमः । ॐ नमो भगवते मर्कटनायकाय मम सर्वदा ज्वल ज्वल प्रज्वल प्रज्वल निर्धनं सधनं साधय
    साधय मां रक्ष रक्ष सर्वदुष्टेभ्यो हूं फट् स्वाहा ॥ १३॥ ॐ ऐं ह्रीं क्लीं श्रीं ॐ कं कपिनाथाय कपिपुङ्गवाय
    नमः । ॐ नमो भगवते कपिपुङ्गवाय मम चतुर्द्वारं सदा ज्वल ज्वल प्रज्वल प्रज्वल निर्धनं सधनं साधय साधय
    मां रक्ष रक्ष सर्वदुष्टेभ्यो हूं फट् स्वाहा ॥ १४॥ ॐ ऐं ह्रीं क्लीं श्रीं रां रीं चों ह्रीं श्रीं आं
    क्रौं ॐ ऐं ह्रीं क्लीं श्रीं ॐ नमो भगवते रामाय सर्वाभीष्टं साधय साधय हूं फट् स्वाहा ॥ १५॥ इति श्रीरामदुर्गस्तोत्रं
    सम्पूर्णम् ॥
