id: rajarajeshvarimantramat-ikastava
category: stotram
name:
  english: rajarajeshvarimantramatṟikastava
  devanagari: राजराजेश्वरीमन्त्रमात्ऱिकास्तव
content:
  english: lokalokitalokakamajananim lokashrayankasthitam shricakrapriyabindutarpanaparam shrirajarajeshvarim
    || 10|| hrimkarashritashankarapriyatanum shriyogapitheshvarim mangalyayutapankajabhanayanam mangalyasiddhipradam
    | tarunyena visheshitangasumahalavanyasamshobhitam shricakrapriyabindutarpanaparam shrirajarajeshvarim
    || 11|| sarvajnanakalavatim sakarunam sarveshvarim sarvagam satyam sarvamayim sahasradalajam sattvarnavopasthitam
    | sangasangavivarjitam sukhakarim balarkakotiprabham shricakrapriyabindutarpanaparam shrirajarajeshvarim
    || 12|| kadikshantasuvarnabindusutanum sarvangasamshobhitam nanavarnavicitracitracaritam caturyacintamanim
    | cittanandavidhayinim sucapalam kutatrayakarinim shricakrapriyabindutarpanaparam shrirajarajeshvarim
    || 13|| lakshmishanavidhindracandramakutadyashtangapithashritam suryendvagnimayaikapithanilayam tristham
    trikoneshvarim | goptrim garvanigarvitam gaganagam gangaganeshapriyam shricakrapriyabindutarpanaparam
    shrirajarajeshvarim || 14|| hrimkutatrayarupinim samayinim samsarinim hamsinim vamacaraparayanim sukulajam
    bijavatim mudrinim |
  devanagari: लोकालोकितलोककामजननीं लोकाश्रयाङ्कस्थितां श्रीचक्रप्रियबिन्दुतर्पणपरां श्रीराजराजेश्वरीम्
    ॥ १०॥ ह्रींकाराश्रितशङ्करप्रियतनुं श्रीयोगपीठेश्वरीं माङ्गल्यायुतपङ्कजाभनयनां माङ्गल्यसिद्धिप्रदाम्
    । तारुण्येन विशेषिताङ्गसुमहालावण्यसंशोभितां श्रीचक्रप्रियबिन्दुतर्पणपरां श्रीराजराजेश्वरीम् ॥ ११॥
    सर्वज्ञानकलावतीं सकरुणां सर्वेश्वरीं सर्वगां सत्यां सर्वमयीं सहस्रदलजां सत्त्वार्णवोपस्थिताम् । सङ्गासङ्गविवर्जितां
    सुखकरीं बालार्ककोटिप्रभां श्रीचक्रप्रियबिन्दुतर्पणपरां श्रीराजराजेश्वरीम् ॥ १२॥ कादिक्षान्तसुवर्णबिन्दुसुतनुं
    सर्वाङ्गसंशोभितां नानावर्णविचित्रचित्रचरितां चातुर्यचिन्तामणिम् । चित्तानन्दविधायिनीं सुचपलां कूटत्रयाकारिणीं
    श्रीचक्रप्रियबिन्दुतर्पणपरां श्रीराजराजेश्वरीम् ॥ १३॥ लक्ष्मीशानविधीन्द्रचन्द्रमकुटाद्यष्टाङ्गपीठाश्रितां
    सूर्येन्द्वग्निमयैकपीठनिलयां त्रिस्थां त्रिकोणेश्वरीम् । गोप्त्रीं गर्वनिगर्वितां गगनगां गङ्गागणेशप्रियां
    श्रीचक्रप्रियबिन्दुतर्पणपरां श्रीराजराजेश्वरीम् ॥ १४॥ ह्रींकूटत्रयरूपिणीं समयिनीं संसारिणीं हंसिनीं
    वामाचारपरायणीं सुकुलजां बीजावतीं मुद्रिणीम् ।
