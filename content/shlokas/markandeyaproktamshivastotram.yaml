id: markandeyaproktamshivastotram
category: stotram
name:
  english: markandeyaproktamshivastotram
  devanagari: मार्कण्डेयप्रोक्तंशिवस्तोत्रम्
content:
  english: markandeyaproktam shivastotram sadyojataya devaya vamadevaya vai namah | bhave bhave namastubhyam
    bhaktigamyaya te namah || 37|| bhurbhuvaya namastubhyam ramajyeshthaya vai namah | namaste bhadrakalaya
    kalirupaya vai namah || 38|| acintyavyaktarupaya mahadevaya dhamane | vidmahe devadevaya tanno rudra
    namo namah || 39|| jagatsrishtivinashanam karanaya namo namah | iti shriskandapurane avantyakhande
    revakhande tritiya
  devanagari: मार्कण्डेयप्रोक्तं शिवस्तोत्रम् सद्योजाताय देवाय वामदेवाय वै नमः । भवे भवे नमस्तुभ्यं भक्तिगम्याय
    ते नमः ॥ ३७॥ भूर्भुवाय नमस्तुभ्यं रामज्येष्ठाय वै नमः । नमस्ते भद्रकालाय कलिरूपाय वै नमः ॥ ३८॥ अचिन्त्याव्यक्तरूपाय
    महादेवाय धामने । विद्महे देवदेवाय तन्नो रुद्र नमो नमः ॥ ३९॥ जगत्सृष्टिविनाशानां कारणाय नमो नमः । इति
    श्रीस्कन्दपुराणे आवन्त्यखण्डे रेवाखण्डे तृतीया
meaning: {}
