id: janakajaprapattisarastotramkhojidevacarya
category: stotram
name:
  english: janakajaprapattisarastotramkhojidevacarya
  devanagari: जनकजाप्रपत्तिसारस्तोत्रंखोजीदेवाचार्य
content:
  english: shrijanakajaprapattisarastotram na vagvapurbuddhibhireva kasyacit kadapi himsa'stu sharirino
    vritha | bhavatpadambhoruhacintanam vina na capayatvambujavikshane kshanah || 1|| hasantu nindantu
    vadantu durvaco jana niyukta hridayasthitena vai | kenapi devena yadashritam sada na samsthitim svam
    prajahatu me manah || 2|| ninda bhayam me'stu tatha na jatucid yatheha nindyacarananmamorasi | paropakaraya
    sada'stu me matirna capakaraya kadapi kasyacit || 3|| na kruradrishtirmama satsu bhuyannirikshnyamano'sya
    sakopanetraih | masevatastanavipakabuddhaya sadhun mado me hridayam vrinotu || 4|| apatrapuja na ca
    patrahelanam tiraskriya napyaparadhyatam satam | adandyadando'stu na me kritaghnatamayi kriya kapi
    videhanandini || 5|| yoshitsu sarvasu ca matribuddhistatha'stu me svasrimatih prarudha | baleshu sarveshu
    ca bandhubuddhirma nicabuddhih satatam mamastu || 6|| vishvasaghato na tatha kadaryata nabhakshyapeyashanapanamastu
    me | na shastrasamvarjitakarmasu spriha kadapi bhuyanmahite mahiyasam || 7|| sahishnuta kshantiramandashemushi
    vatsalyata'vyajakripa vinamrata | udarata hi mriduta sushilata na jatu caita hridayam tyajantu me
    || 8|| madashrita kleshayata na santu vai visheshato bhagavata upekshaya | nabhyagatah kruragira drisharditah
    samucchvasantu smayadushitatmanah || 9|| rite tvaducchishtamathanyavastushu syad bhogabuddhirna kadapi
    mamaki | tvadarthamevakhilaceshtitam hi me bhaktaparadho na kadapi mam sprishet || 10|| ratih pravrittau
    viratirnivrittau sango'satam nastu satamasangah | sarveshu sarvasvanuragadrishtirma doshadrishtirmama
    karhicit syat || 11|| svabhrityasamposhanasaktacetasa nopekshitah santu maya tvadashritah | lobhad
    bhayad va nijadharmavarjita kriya'stu no ka'pi tavanukampaya || 12|| svapnopamam manushametya janma
    svarvasimrigyam kshanabhanguranca | vairam na kuryam tava tushtikamah kenapyaham shrinimivamshabhushe
    || 13|| nyayalayam te kshamatapradhanam nyayapradhanam na vadanti santah | kshantipradhana matirastu
    tasman nyayapradhana na mama kshamabdhe || 14|| bhayam na me syaccaratah svadharmam kaladapi praptavivekadrishteh
    | mattastatha tanna pipilikanam saubhagyametat kripaya prayaccha || 15|| svashikshayaivadridhayan
    svadharmam samashritan bhagavate pradhane | anekasamsarika bhogasaktam na kankshitam janma ciraya
    loke || 16|| tvaddhamavasastava kirtiganam tvannamasankirttanameva nityam | ambashubhotsangaviharashile
    tvadrupasancintanamastu mahyam || 17|| anyanyadevarcanavandanasmritistava prapattih shravananuragita
    | svapne'pi bhuyadiha bhaktikantakam nananyata pathaparayanasya me || 18|| pujyanuvandya paribhavaniya
    jneyanugeya samupasaniya | shreyah param kankshibhiratmanishthaistvameva hitva'khilakarmajalam ||
    19|| sa me pita sa janani sa bandhuh sakha sa data sa patirguruh sah | kripalutopekshitasarvadoshah
    sevasahayo ya ihastvanihah || 20|| paramalalanaih palyate tvaya nirayakarmakrinmadrisho janah | karunaya
    yaya hetuhinaya kuru na mam taya sevayojjhitam || 21|| vinaya eva me'yam hi sanjalih sunayanankabhushe
    prasidatam | anudinam tavocchishtajivato vanaruhakshi no cettu ka gatih || 22|| iti shrikhojidevacaryaviracitam
    shrijanakajaprapattisarastotram sampurnam |
  devanagari: श्रीजनकजाप्रपत्तिसारस्तोत्रम् न वाग्वपुर्बुद्धिभिरेव कस्यचित् कदापि हिंसाऽस्तु शरीरिणो वृथा
    । भवत्पदाम्भोरुहचिन्तनं विना न चापयात्वम्बुजवीक्षणे क्षणः ॥ १॥ हसन्तु निन्दन्तु वदन्तु दुर्वचो जना
    नियुक्ता हृदयस्थितेन वै । केनापि देवेन यदाश्रितं सदा न संस्थितिं स्वां प्रजहातु मे मनः ॥ २॥ निन्दा
    भयं मेऽस्तु तथा न जातुचिद् यथेह निन्द्याचरणान्ममोरसि । परोपकाराय सदाऽस्तु मे मतिर्न चापकाराय कदापि
    कस्यचित् ॥ ३॥ न क्रूरदृष्टिर्मम सत्सु भूयान्निरीक्ष्ण्यमाणोऽस्य सकोपनेत्रैः । मासेवतस्तानविपकबुद्धया
    साधून् मदो मे हृदयं वृणोतु ॥ ४॥ अपात्रपूजा न च पात्रहेलनं तिरस्क्रिया नाप्यपराध्यतां सताम् । अदण्ड्यदण्डोऽस्तु
    न मे कृतघ्नतामयी क्रिया कापि विदेहनन्दिनि ॥ ५॥ योषित्सु सर्वासु च मातृबुद्धिस्तथाऽस्तु मे स्वसृमतिः
    प्ररूढा । बालेषु सर्वेषु च बन्धुबुद्धिर्मा नीचबुद्धिः सततं ममास्तु ॥ ६॥ विश्वासघातो न तथा कदर्यता
    नाभक्ष्यपेयाशनपानमस्तु मे । न शास्त्रसंवर्जितकर्मसु स्पृहा कदापि भूयान्महिते महीयसाम् ॥ ७॥ सहिष्णुता
    क्षान्तिरमन्दशेमुषी वात्सल्यताऽव्याजकृपा विनम्रता । उदारता ही मृदुता सुशीलता न जातु चैता हृदयं त्यजन्तु
    मे ॥ ८॥ मदाश्रिता क्लेशयता न सन्तु वै विशेषतो भागवता उपेक्षया । नाभ्यागताः क्रूरगिरा दृशार्दिताः समुच्छ्वसन्तु
    स्मयदूषितात्मनः ॥ ९॥ ऋते त्वदुच्छिष्टमथान्यवस्तुषु स्याद् भोगबुद्धिर्न कदापि मामकी । त्वदर्थमेवाखिलचेष्टितं
    हि मे भक्तापराधो न कदापि मां स्पृशेत् ॥ १०॥ रतिः प्रवृत्तौ विरतिर्निवृत्तौ सङ्गोऽसतां नास्तु सतामसङ्गः
    । सर्वेषु सर्वास्वनुरागदृष्टिर्मा दोषदृष्टिर्मम कर्हिचित् स्यात् ॥ ११॥ स्वभृत्यसम्पोषणसक्तचेतसा नोपेक्षिताः
    सन्तु मया त्वदाश्रिताः । लोभाद् भयाद् वा निजधर्मवर्जिता क्रियाऽस्तु नो काऽपि तवानुकम्पया ॥ १२॥ स्वप्नोपमं
    मानुषमेत्य जन्म स्वर्वासिमृग्यं क्षणभङ्गुरञ्च । वैरं न कुर्यां तव तुष्टिकामः केनाप्यहं श्रीनिमिवंशभूषे
    ॥ १३॥ न्यायालयं ते क्षमताप्रधानं न्यायप्रधानं न वदन्ति सन्तः । क्षान्तिप्रधाना मतिरस्तु तस्मान् न्यायप्रधाना
    न मम क्षमाब्धे ॥ १४॥ भयं न मे स्याच्चरतः स्वधर्मं कालादपि प्राप्तविवेकदृष्टेः । मत्तस्तथा तन्न पिपीलिकानां
    सौभाग्यमेतत् कृपया प्रयच्छ ॥ १५॥ स्वशिक्षयैवादृढयन् स्वधर्मं समाश्रितान् भागवते प्रधाने । अनेकसांसारिक
    भोगसक्तं न काङ्क्षितं जन्म चिराय लोके ॥ १६॥ त्वद्धामवासस्तव कीर्तिगानं त्वन्नामसङ्कीर्त्तनमेव नित्यम्
    । अम्बाशुभोत्सङ्गविहारशीले त्वद्रूपसञ्चिन्तनमस्तु मह्यम् ॥ १७॥ अन्यान्यदेवार्चनवन्दनस्मृतिस्तव प्रपत्तिः
    श्रवणानुरागिता । स्वप्नेऽपि भूयादिह भक्तिकण्टकं नानन्यता पाठपरायणस्य मे ॥ १८॥ पूज्यानुवन्द्या परिभावनीया
    ज्ञेयानुगेया समुपासनीया । श्रेयः परं काङ्क्षिभिरात्मनिष्ठैस्त्वामेव हित्वाऽखिलकर्मजालम् ॥ १९॥ स मे
    पिता सा जननी स बन्धुः सखा स दाता स पतिर्गुरुः सः । कृपालुतोपेक्षितसर्वदोषः सेवासहायो य इहास्त्वनीहः
    ॥ २०॥ परमलालनैः पाल्यते त्वया निरयकर्मकृन्मादृशो जनः । करुणया यया हेतुहीनया कुरु न मां तया सेवयोज्झितम्
    ॥ २१॥ विनय एव मेऽयं हि साञ्जलिः सुनयनाङ्कभूषे प्रसीदताम् । अनुदिनं तवोच्छिष्टजीवतो वनरुहाक्षि नो चेत्तु
    का गतिः ॥ २२॥ इति श्रीखोजीदेवाचार्यविरचितं श्रीजनकजाप्रपत्तिसारस्तोत्रं सम्पूर्णम् ।
