id: shrirenukastotram
category: stotram
name:
  english: shrirenukastotram
  devanagari: श्रीरेणुकास्तोत्रम्
content:
  english: aimdryadivamditapade varade'bhishtakamade|| kamadevarcite'namte renuke'mba namo'stu te||1||
    ekavire nijadhare rucire sajjanadare|| udare renusamjate renuke'mba namo'stu te||2|| karunarasasampurne
    nayane susmitanane|| shobhane pahi nobhite renuke'mba namo'stu te||3|| viramatarmahadevi tvadanya
    kapara bhuvi|| tarini durgato'namte renuke'mba namo'stu te||4|| ramamatarmahamaye jamadagnipriye'bhaye||
    vijaye vedavinute renuke'mba namo'stu te||5|| yairarcite tava pade te dhanyah parame pade|| nihitaste
    suranute renuke'mba namo'stu te||6|| na tvadanya gatirdevi parama khalu shambhavi|| bhuktimuktiprade
    shamte renuke'mba namo'stu te||7|| mah keshaveshvarashcapi srishtisthityamtakarinah|| prasadadeva
    te'namte renuke'mba namo'stu te||8|| jagadamba namo'stu renuke paripahishvari nah subhavuke|| jayalabhayashahprade
    mude stutireshastu tavakhilarthade||9|| navahanam narcanapaddhatim te jane na bhaktim tvayi me bhavamtake||
    athapi mam tvam kuladevi bhaktakulodbhavam pahyapi carthasaktam||10|| matapuranivasinyah shridevyah
    stotramuttamam|| yah pathetprayato bhaktya sarvankamansa apnuyat||11||
  devanagari: ऐंद्र्यादिवंदितपदे वरदेऽभीष्टकामदे।। कामदेवार्चितेऽनंते रेणुकेऽम्ब नमोऽस्तु ते।।१।। एकवीरे
    निजाधारे रुचिरे सज्जनादरे।। उदारे रेणुसंजाते रेणुकेऽम्ब नमोऽस्तु ते।।२।। करुणारससंपूर्णे नयने सुस्मितानने।।
    शोभने पाहि नोभीते रेणुकेऽम्ब नमोऽस्तु ते।।३।। वीरमातर्महादेवि त्वदन्या कापरा भुवि।। तारिणी दुर्गतोऽनंते
    रेणुकेऽम्ब नमोऽस्तु ते।।४।। राममातर्महामाये जमदग्निप्रियेऽभये।। विजये वेदविनुते रेणुकेऽम्ब नमोऽस्तु
    ते।।५।। यैरर्चिते तव पदे ते धन्याः परमे पदे।। निहितास्ते सुरनुते रेणुकेऽम्ब नमोऽस्तु ते।।६।। न त्वदन्या
    गतिर्देवि परमा खलु शांभवी।। भुक्तिमुक्तिप्रदे शांते रेणुकेऽम्ब नमोऽस्तु ते।।७।। मः केशवेश्वराश्चापि
    सृष्टिस्थित्यंतकारिणः।। प्रसादादेव तेऽनंते रेणुकेऽम्ब नमोऽस्तु ते।।८।। जगदंब नमोऽस्तु रेणुके परिपाहीश्वरि
    नः सुभावुके।। जयलाभयशःप्रदे मुदे स्तुतिरेषास्तु तवाखिलार्थदे।।९।। नावाहनं नार्चनपद्धतिं ते जाने न
    भक्तिं त्वयि मे भवांतके।। अथापि मां त्वं कुलदेवि भक्तकुलोद्भवं पाह्यपि चार्थसक्तम्।।१०।। मातापुरनिवासिन्याः
    श्रीदेव्याः स्तोत्रमुत्तमम्।। यः पठेत्प्रयतो भक्त्या सर्वान्कामान्स आप्नुयात्।।११।।
