id: yadagirilakshmin-isimhastotra
category: stotram
name:
  english: yadagirilakshminṟisimhastotra
  devanagari: यादगिरिलक्ष्मिन्ऱिसिम्हस्तोत्र
content:
  english: bhaje shrinrisimham nrisimham bhaje yadashaileshamisham || 8|| namejnanamatyamtiko bhaktibhavah
    namesadhucaryatvamevasi sarvam itivapivishvasa aishah tvadiyah tvadiyopyaham sarvamevam tvadiyam ||
    9|| tvadiyesamaste madiyatvabhavat ciratsambhritat mohitonathasatyam idanim tu lakshmishasevavisheshat
    nirastam hi me mohajatam samastam || 10|| ajanatamayanatha
  devanagari: भजे श्रीनृसिंहम् नृसिंहम् भजे यादशैलेशमीशम् ॥ ८॥ नमेज्ञानमात्यंतिको भक्तिभावः नमेसाधुचर्यात्वमेवासि
    सर्वम् इतीवापिविश्वास ऐषः त्वदीयः त्वदीयोप्यहम् सर्वमेवम् त्वदीयम् ॥ ९॥ त्वदीयेसमस्ते मदीयत्वभावात्
    चिरात्संभृतात् मोहितोनाथसत्यम् इदानीम् तु लक्ष्मीशसेवाविशेषात् निरस्तम् हि मे मोहजातम् समस्तम् ॥ १०॥
    अजानतामयानाथ
meaning: {}
