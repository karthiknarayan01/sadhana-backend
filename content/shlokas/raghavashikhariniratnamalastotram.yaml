id: raghavashikhariniratnamalastotram
category: shataka
name:
  english: raghavashikhariniratnamalastotram
  devanagari: राघवशिखरिणीरत्नमालास्तोत्रम्
content:
  english: yadiyajanakya harinamadaliptestanatate | prakashanterekha navajaladalekhasmaraghana tapasyadhyabjam
    tadraghukulavarenyasya mrigaye || 59|| jalakridacakre kamathapatirabdhavahipatih sukham shishyeshashranta
    shamatulamavapurharidibhah | dhrite yatpadabhyamakhiladharanimandalabhare madakshidvandam shripadakishalayam
    te mrigayate || 60|| na yajjnatva jneyam kimapi nigame no rasamayam na yaddhyatvadhyeyam kimapi hridayenyatsukhamayam
    | na yatpraptva prapyam kimapi paramam kvapi mrigaye tadevahalyadushkritavidalanam padanalinam ||
    61|| amubhyam netrabhyamaparimitaharshashrutaralam bhujabhyamapyabhyam bahulakutukotkirnapulakam |
    parirabhyodgadham saphalayitumetajanimaham rajah putahalye caranakamale eva mrigane || 62|| trayi
    rajivakshi cikuranikarakarajaladhih sphuratsimantakrityupamitamahasetujaladhih | ahalyadehalankaranapatavasadyutidharah
    paragam yantvasman bhavatimirakupakshayakritah || 63|| kada va kotindudyutibharanirasodyamadharah
    ahalyagham millasthalalalitamallisumanasah | nakhadyutyadhuta'parimitamanodhvantanicayah samagravagraham
    mama kavalayeyurnayanayoh || 64|| visrijyayodhyayadvanabhuvi cacaropalacayaih kushaih kasairvidhyadadhikataradarunyamabhavat
    | dravantam yanmayaharinamanududrava mrigaye tadanghridvandam shrikucayugaparishvaktamasakrit || 65||
    gajah simha vyaghra mrigashashavaraha vanacara mayurah kadambapikakavalakhakrauncakurarah | tathanye
    dhanya yaih shamitanayanavagrahamaho
  devanagari: यदीयाजानक्या हरिणमदलिप्तेस्तनतटे । प्रकाशन्तेरेखा नवजलदलेखास्मरघना तपस्याध्यब्जं तद्रघुकुलवरेण्यस्य
    मृगये ॥ ५९॥ जलक्रीडाचक्रे कमठपतिरब्धावहिपतिः सुखं शिश्येशश्रान्ता शामतुलमवापुर्हरिदिभाः । धृते यत्पादाभ्यामखिलधरणीमण्डलभरे
    मदक्षिद्वन्दं श्रीपदकिशलयं ते मृगयते ॥ ६०॥ न यज्ज्ञात्वा ज्ञेयं किमपि निगमे नो रसमयं न यद्ध्यात्वाध्येयं
    किमपि हृदयेन्यत्सुखमयम् । न यत्प्राप्त्वा प्राप्यं किमपि परमं क्वापि मृगये तदेवाहल्यादुष्कृतविदलनं
    पादनलिनम् ॥ ६१॥ अमूभ्यां नेत्राभ्यामपरिमितहर्षाश्रुतरलं भुजाभ्यामप्याभ्यां बहुलकुतुकोत्कीर्णपुलकम्
    । परिरभ्योद्गाढं सफलयितुमेताजनिमहं रजः पूताहल्ये चरणकमले एव मृगणे ॥ ६२॥ त्रयी राजीवाक्षी चिकुरनिकराकारजलधिः
    स्फुरत्सीमान्ताकृत्युपमितमहासेतुजलधिः । अहल्यादेहालङ्करणपटवासद्युतिधराः परागां यान्त्वास्मान् भवतिमिरकूपक्षयकृतः
    ॥ ६३॥ कदा वा कोटीन्दुद्युतिभरनिरासोद्यमधराः अहल्याघं मिल्लस्थलललितमल्लीसुमनसः । नखद्युत्याधूताऽपरिमितमनोध्वान्तनिचयः
    समग्रावग्राहं मम कवलयेयुर्नयनयोः ॥ ६४॥ विसृज्यायोध्यायद्वनभुवि चचारोपलचयैः कुशैः कासैर्विध्यदधिकतरदारुण्यमभवत्
    । द्रवन्तं यन्मायाहरिणमनुदुद्राव मृगये तदङ्घ्रिद्वन्दं श्रीकुचयुगपरिष्वक्तमसकृत् ॥ ६५॥ गजाः सिंहा
    व्याघ्रा मृगशशवराहा वनचरा मयूराः कादम्बापिककवलखक्रौञ्चकुरराः । तथान्ये धन्या यैः शमितनयनावग्रहमहो
