id: subrahmanyashodashanamastotram-3
category: stotram
name:
  english: subrahmanyashodashanamastotram 3
  devanagari: सुब्रह्मण्यषोडशनामस्तोत्रम् ३
content:
  english: shrisubrahmanyashodashanamastotram senaniragnibhuh skandastarakarirgunapriyah | shanmaturo
    bahuleyah krittikapriyaputrakah || 1|| mayuravahanah shriman kumarah krauncadaranah | vishakhah parvatiputrah
    subrahmanyo guhastatha || 2|| shodashaitani namani sha
  devanagari: श्रीसुब्रह्मण्यषोडशनामस्तोत्रम् सेनानीरग्निभूः स्कन्दस्तारकारिर्गुणप्रियः । षाण्मातुरो बाहुलेयः
    कृत्तिकाप्रियपुत्रकः ॥ १॥ मयूरवाहनः श्रीमान् कुमारः क्रौञ्चदारणः । विशाखः पार्वतीपुत्रः सुब्रह्मण्यो
    गुहस्तथा ॥ २॥ षोडशैतानि नामानि श
meaning: {}
