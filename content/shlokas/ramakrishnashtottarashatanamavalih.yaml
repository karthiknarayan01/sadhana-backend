id: ramakrishnashtottarashatanamavalih
category: stotram
name:
  english: ramakrishnashtottarashatanamavalih
  devanagari: रामकृष्णाष्टोत्तरशतनामावलिः
content:
  english: namne namah | shri dulaletyuktaya namah | shri ramakrishnaya namah | shri niranjanaya namah
    | shri nirgunaya namah | shri gunedhyaya namah | shri gunajite namah | shri prabhave namah | shri
    devaya namah | 10 shri naravaraya namah | shri nararupadharaya namah | shri shivaya namah | shri bhavavaidyaya
    namah | shri dinabandhave namah | shri bhavabhedakaraya namah | shri acalaya namah | shri goshpadikrita
  devanagari: नाम्ने नमः । श्री दुलालेत्युक्ताय नमः । श्री रामकृष्णाय नमः । श्री निरञ्जनाय नमः । श्री
    निर्गुणाय नमः । श्री गुणेढ्याय नमः । श्री गुणजिते नमः । श्री प्रभवे नमः । श्री देवाय नमः । १० श्री
    नरवराय नमः । श्री नररूपधराय नमः । श्री शिवाय नमः । श्री भववैद्याय नमः । श्री दीनबन्धवे नमः । श्री
    भवभेदकराय नमः । श्री अचलाय नमः । श्री गोष्पदीकृत
meaning: {}
