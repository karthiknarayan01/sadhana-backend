id: ganeshagayatri
category: stotram
name:
  english: ganeshagayatri
  devanagari: गनेशगायत्रि
content:
  english: shriganesha gayatri om lambodaraya vidmahe mahodaraya dhimahi | tanno dantih pracodayat ||
  devanagari: श्रीगणेश गायत्री ॐ लम्बोदराय विद्महे महोदराय धीमहि । तन्नो दन्तिः प्रचोदयात् ॥
meaning: {}
