id: shrilalitah-idayastotram
category: hridaya
name:
  english: shrilalitahṟidayastotram
  devanagari: श्रीललिताह्ऱिदयस्तोत्रम्
content:
  english: '| tatankayugalandevi lalite dharayamyaham || 87|| athadyam bhushanam kanthe mahacintakamuttamam
    | padakante kalpayami mahapadakamuttamam || 88|| muktavalim kalpayami caikavali samanvitam | channavirancakeyurayugalanam
    catushtayam || 89|| valayavalimalanim cormikavalimishvari | kancidamakatisutramsaubhagyabharanam ca
    te || 90|| tripure padakatakam kalpaye ratnanupuram | padanguliyakantubhyam pashamekam karetava ||
    91|| anye karenkusham devi pundrekshudhanusham tava | aparepushpabananca shrimanmanikyapaduke || 92||
    tadavarana deveshi mahamancadirohanam | kameshvarankaparyankamupaveshanamuttamam || 93|| sudhaya purnnacashakam
    tatastat panamuttamam | karppuravitikantubhyam kalpayami namah shive || 94|| anandollasavilasaddhamsam
    te kalpayamyaham | mangalaratrikamvande chatram te kalpayamyaham || 95|| camaram yugalam devidarppanam
    kalpayamyaham | talavrintankalpayamigandhapushpakshatairapi || 96|| dhupam dipashcanaivedyam kalpayami
    shivapriye | athahambaindave cakre sarvanandamayatmake || 97|| ratnasimhasane ramye samasinam shivapriyam
    | udyadbhanusahasrabhanjapapushpasamaprabham || 98|| navaratnaprabhayuktamakutena virajitam | candrarekhasamopetankasturitilakankitam
    || 99|| kamakodandasaundaryanirjjitabhrulatayutam | anjanancitanetrantupadmapatranibheshanam || 100||
    manikundalasamyukta karnnadvayavirajitam | tambulapuritamukhimsusmitasyavirajitam || 101|| adyabhushanasamyuktam
    hemacintakasamyutam | padakenasamopetam mahapadakasamyutam || 102|| muktaphalasamopetamekavalisamanvitam
    | kausubhangadasamyuktacaturbahusamanvitam || 103|| ashtagandhasamopetam shricandanavirajitam | hemakumbhopamaprakhyastanadvandavirajitam
    || 104|| raktavastraparidhanam raktakancukasamyutam | sukshmaromavaliyuktatanumaddhyavirajitam ||
    105|| muktamanikyakhacita kanciyutanitambanim | sadashivanakasthabrihanmahajaghanamandalam || 106||
    kadalistambhasamrajadurudvayavirajitam | kapalikantisankashajanghayugalashobhitam || 107|| grudhagulphadveyopetam
    raktapadasamanvitam | brahmavishnumaheshadikiritasphurjjitanghrikam || 108|| kantya virajitapadam
    bhaktatrana parayanam | ikshukarmukapushpeshupashankushadharamshubham || 109|| samvitsvarupinim vande
    dhyayami parameshvarim | pradarshayamyathashivedashamudrah phalapradah || 110|| tvam tarppayami tripure
    tridhana parvvati | agnaumaheshadigbhage nairritryam marute tatha || 111|| indrashavaruni bhage shadanganyarccaye
    kramat | adyankameshvarim vande namami bhagamalinim || 112|| nityaklinnam namasyami bherundam pranamamyaham
    | vahnivasannamasyami mahavidyeshvarim bhaje || 113|| shivadutim namasyami tvaritam kula sundarim
    | nityannilapatakanca vijayam sarvamangalam || 114|| jvalamalanca citranca mahanityam ca samstuve
    | prakashanandanathakhyamparashaktinamamyaham || 115|| shukladevim namasyami pranamami kuleshvarim
    | parashivanandanathakhyamparashakti namamyaham || 116|| kauleshvaranandanatham naumi kameshvarim
    sada | bhoganandannamasyami siddhaughanca varanane || 117|| klinnanandam namasyami samayanandamevaca
    | sahajanandanathancapranamami muhurmuhu || 118|| manavaugham namasyami gagananandagapyaham | vishvanandannamasyami
    vimalanandamevaca || 119|| madananandanathanca bhuvananandarupinim | lilanandannamasyami svatmanandam
    maheshvari || 120|| pranamamipriyanandam sarvakamaphalapradam | parameshtigurumvande paramangurumashraye
    || 121|| shrigurum pranamasyami murddhni brahmabileshvarim | shrimadanandanathakhyashriguropadukam
    tatha || 122|| atha prathamike devi caturashre kuleshvari | animamlakhimam vande mahimam pranamamyaham
    || 123|| ishitvasiddhim kalaye vashitvam pranamamyaham | prakamyasiddhimbhuktinca icchapraprtimaham
    bhaje || 124|| sarvakamapradam sarvakamasiddhimaham bhaje | maddhyamecaturashreham brahmim maheshvarim
    bhaje || 125|| kaumarim vaishnavim vande varahim pranamamyaham | mahendrimapicamundammahalakshmimaham
    bhaje || 126|| tritiye caturashre tu sarvasamkshobhinim bhaje | sarvavidrapinimmudram sarvakarshinikam
    bhaje || 127|| mudram vashankarim vande sarvonmadinikam bhaje | bhajemahankusham mudram khecarim pranamamyaham
    || 128|| bijamudram yonimudram bhaje sarvatrikhandinim | trailokyamohanancakram namami lalite tava
    || 129|| namami yoginim tatra prakhatakhyamabhishtadam | sudharnnavasanamvande tatra te parameshvari
    || 130|| cakreshvari maham vande tripuram pranamamyaham | sarvasamkshobhinimmudram tatoham kalaye
    shive || 131|| athaham shodashadale kamakarshinikam bhaje | buddhyakarshinikam vande''hankarakarshinim
    bhaje || 132|| shabdakarshinikam vande sparshakarshinikam bhaje | rupakarshinikamvande rasakarshinikam
    bhaje || 133|| gandhakarshinikam vande cittakarshinikam bhaje | dhairyakarshinikamvande smrityakarshinikam
    bhaje || 134|| namakarshinikam vande bijakarshinikam bhaje | atmakarshinikamvande amritakarshinikam
    bhaje || 135|| sharirakarshinikam vande nityam shriparameshvari | sarvashapurakamvande kalpayeham
    taveshvari || 136|| guptakhyam yoginim vande mataram guptapujyatam | potambujasanantatra namami lalite
    tava || 137|| tripureshim namasyami bhajamishtartthasiddhidam | sarvavidravinimudrantatraham te vicantaye
    || 138|| sive tavashtapatrehamanangakusumam bhaje | anangamekhalamvande anangamadanam bhaje || 139||
    namoham pranasyami anangamadanaturam | anangarekhankalaye bhajenangam ca veginim || 140|| anangakushavande''hamanangamalinim
    bhaje | tatrahampranasyami devya asanamuttamam || 141|| namami jagatishanim tatra tripurasundarim
    | sarvakarshinikammudram tatraha kalpayamite || 142|| bhuvanashraye tava shive sarvasamkshobhinim
    bhaje | sarvavidravinimvande sarvakarshinikam bhaje || 143|| sarvahladinim vande sarvasammohinim bhaje
    | sakalastambhinim vande kalaye sarvajrimbhinim || 144|| vashankarim namasyami sarvarajninikam bhaje
    | sakalonmadinim vande bhaje sarvarthasadhake || 145|| sampattipurikam vande sarvamantramayim bhaje
    | bhajamyevatatashshaktim sarvadvandvakshyankarim || 146|| tatraham kalaye cakram sarvasaubhagyadayakam
    | namamijagatam dhatrim sampradayakhyayoginim || 147|| namami parameshanim mahatripuravasinim | kalayehantava
    shive mudram sarvashankarim || 148|| bahirddashare te devi sarvasiddhipradam bhaje | sarvasampatpradam
    vande sarvapriyankarim bhaje || 149|| namamyaham tato devim sarvamangalakarinim | sarvakamapradamvande
    sarvaduhkhavimocinim || 150|| sarvamrityuprashamanim sarvavighnanivarinim | sarvangasundarimvande
    sarvasaubhagyadayinim || 151|| sarvartthasadhakam cakram tatraham ne vicintaye | tatrahante namasyami
    kulottirnakhya yoginim || 152|| sarvamantrasanam vande tripurashriyamashraye | kalayamitato mudram
    sarvonmadana karinim || 153|| antarddashare te devi sarvajnam pranamamyaham | sarvashaktinnamasyami
    sarvaishvaryapradam bhaje || 154|| sarvajnanamayim vande sarvavyadhivinashinim | sarvadharasvarupancasarvapapaharambhaje
    || 155|| sarvanandamayim vande sarvarakshasvarupinim | pranamamimahadevim sarvepsita phalapradam ||
    156|| sarvarakshakaram cakram sundarim kalaye sada | nigarbhayonimvande tatraham pranamamyaham ||
    157|| saddhyasiddhasanam vande bhaje tripuramalinim | kalayamitato devim mudram sarvamahankusham ||
    158|| ashtare vashinim vande maha kameshvarim bhaje | modinimvimalamvande arunajayinim bhaje || 159||
    sarveshvarim namasyami kaulinim pranamamyaham | sarvarogaharancakram tatraham kalaye sada || 160||
    namami tripura siddhim bhaje mudram ca khecarim | mahatrikonavatbahucaturashre kuleshvari || 161||
    namami jrimbhanabanam sarvasammohinim bhaje | pashancapam bhaje nityam bhaje stambhanamankusham ||
    162|| trikoneham jagaddhatrim mahakameshvarim bhaje | mahavajreshvarimvande mahashribhagamalinim ||
    163|| mahashrisundarim vande sarvakamaphalapradam | sarvasiddhipradancakram tavadevi namamyaham ||
    164|| namamyatirahasyakhyam yoginim tavakamadam | tripurambannamasyami bijamudramahambhaje || 165||
    mulamantrena lalite talbindau pujayamyaham | sarvanandamayancakram tavadevi bhajamyaham || 166|| param
    pararahasyakhyam yoginim tatrakamadam | mahacakreshvarimvande yonimudramaham bhaje || 167|| dhupadipadikam
    sarvamarppitam kalpayamyaham | tvalpritayemahamudram darshayami tatashshive || 168|| shalyannam madhusamyuktam
    payasapupa samyuktam | ghritasupasamayuktandadhikshirasamanvitam || 169|| sarvabhakshyasamayuktam
    bahushakasamanvitam | nikshipyakancane patre naivedyam kalpayami te || 170|| sankalpabinduna cakram
    kucau bindudvayena ca | yonishcasapararddhena kritva shrilalite tava || 171|| etat kamakala rupam
    bhaktanam sarvakamadam | sarvasaubhagyadamvande tatra tripurasundarim || 172|| vamabhage maheshani
    vrittam ca caturasrakam | kritvagandhakshatadyaishcapyarccayami maheshvarim || 173|| vagdavadyam namasyami
    tatra vyapakamandalam | jalayuktenapanau ca shuddhamudra samanvitam || 174|| tatra mantrena dasyami
    devi te balimuttamam | namastedevadeveshi nama strailokyavandite || 175|| namashshivavarankasthe namastripurasundari
    | pradakshinanamaskaramanenaham karomi te || 176|| tata sankalpamantranam samajam parameshvari | prajapamimahavidyam
    tvat prityartthamaham shive || 177|| tava vidyam prajaptvatha naumi tvam parameshvari | mahadevimaheshani
    mahashivamaye priye || 178|| mahanitye mahasiddhe tvamaham sharanam shive | jayatvantripure devi lalite
    parameshvari || 179|| sadashiva priyankari pahimam karunanidhe | jaganmatarjjagadrupejagadishvaravallabhe
    || 180|| jaganmayi jagat stutye gauri tvamahamashraye | anadyesarvalokanamadye bhakteshtadayini ||
    181|| girirajendratanaye namastipurasundari | jayarinjayadeveshibrahmamatarmaheshvari || 182|| vishnumataramadyante
    haramatassureshvari | brahmyadimatrisamstutye sarvabharana samyukte || 183|| jyotirmayi maharupe pahimam
    tripure sada | lakshmivanyadisam pujye brahmavishnushivapriya || 184|| bhajami tava padabjam devi
    tripurasundari | tvalprityarthamyatah kancicchaktim vaipujayamyaham || 185|| tatashca ketanam shaktim
    tarpayami maheshvari | tathapitvam bhajamstosham cidagnau ca dadamyaham || 186|| tvalprityarthyam
    mahadevi mamabhishtarttha siddhaye | baddhvatvam khaicarimudram kshamasvodvasayamyaham || 187|| tishthame
    hridayenityam tripure parameshvari | jagadambamaharajni mahashakti shivapriye || 188|| hriccakre tishtame
    nityam mahatripurasundari | etattripurasundarya hridayam sarvakamadam || 189|| maharahasyam satatam
    durllabham daivatairapi | sakshatsadashivenoktam guhyat guhyamanuttamam || 190|| yah patet shraddhaya
    nityam sha'
  devanagari: । ताटङ्कयुगलन्देवि ललिते धारयाम्यहम् ॥ ८७॥ अथाद्यां भूषणं कण्ठे महाचिन्ताकमुत्तमम् । पदकन्ते
    कल्पयामि महापदकमुत्तमम् ॥ ८८॥ मुक्तावलीं कल्पयामि चैकावलि समन्विताम् । छन्नवीरञ्चकेयूरयुगलानां चतुष्टयम्
    ॥ ८९॥ वलयावलिमालानीं चोर्मिकावलिमीश्वरि । काञ्चीदामकटीसूत्रंसौभग्याभरणं च ते ॥ ९०॥ त्रिपुरे पादकटकं
    कल्पये रत्ननूपुरम् । पादाङ्गुलीयकन्तुभ्यं पाशमेकं करेतव ॥ ९१॥ अन्ये करेङ्कुशं देवि पूण्ड्रेक्षुधनुषं
    तव । अपरेपुष्पबाणञ्च श्रीमन्माणिक्यपादुके ॥ ९२॥ तदावरण देवेशि महामञ्चादिरोहणम् । कामेश्वराङ्कपर्यङ्कमुपवेशनमुत्तमम्
    ॥ ९३॥ सुधया पूर्ण्णचषकं ततस्तत् पानमुत्तमम् । कर्प्पूरवीटिकान्तुभ्यं कल्पयामि नमः शिवे ॥ ९४॥ आनन्दोल्लासविलसद्धंसं
    ते कल्पयाम्यहम् । मङ्गलारात्रिकंवन्दे छत्रं ते कल्पयाम्यहम् ॥ ९५॥ चामरं यूगलं देविदर्प्पणं कल्पयाम्यहम्
    । तालव्रिन्तङ्कल्पयामिगन्धपुष्पाक्षतैरपि ॥ ९६॥ धूपं दीपश्चनैवेद्यं कल्पयामि शिवप्रिये । अथाहम्बैन्दवे
    चक्रे सर्वानन्दमयात्मके ॥ ९७॥ रत्नसिंहासने रम्ये समासीनां शिवप्रियाम् । उद्यद्भानुसहस्राभाञ्जपापुष्पसमप्रभाम्
    ॥ ९८॥ नवरत्नप्रभायुक्तमकुटेन विराजिताम् । चन्द्ररेखासमोपेताङ्कस्तूरितिलकाङ्किताम् ॥ ९९॥ कामकोदण्डसौन्दर्यनिर्ज्जितभ्रूलतायुताम्
    । अञ्जनाञ्चितनेत्रान्तुपद्मपत्रनिभेषणाम् ॥ १००॥ मणिकुण्डलसम्युक्त कर्ण्णद्वयविराजिताम् । ताम्बूलपूरितमुखींसुस्मितास्यविराजिताम्
    ॥ १०१॥ आद्यभूषणसम्युक्तां हेमचिन्ताकसंयुताम् । पदकेनसमोपेतां महापदकसंयुताम् ॥ १०२॥ मुक्ताफलसमोपेतामेकावलिसमन्विताम्
    । कौसुभाङ्गदसंयुक्तचतुर्बाहुसमन्विताम् ॥ १०३॥ अष्टगन्धसमोपेतां श्रीचन्दनविराजिताम् । हेमकुम्भोपमप्रख्यस्तनद्वन्दविराजिताम्
    ॥ १०४॥ रक्तवस्त्रपरीधानां रक्तकञ्चुकसंयुताम् । सूक्ष्मरोमावलियुक्ततनुमद्ध्यविराजिताम् ॥ १०५॥ मुक्तामाणिक्यखचित
    काञ्चीयुतनितम्बनीम् । सदाशिवाङकस्थबृहन्महाजघनमण्डलाम् ॥ १०६॥ कदलिस्तम्भसंराजदूरुद्वयविराजिताम् । कपालीकान्तिसङ्काशजङ्घायुगलशोभिताम्
    ॥ १०७॥ ग्रूढगुल्फद्वेयोपेतां रक्तपादसमन्विताम् । ब्रह्मविष्णुमहेशादिकिरीटस्फूर्ज्जिताङ्घ्रिकाम् ॥
    १०८॥ कान्त्या विराजितपदां भक्तत्राण परायणाम् । इक्षुकार्मुकपुष्पेषुपाशाङ्कुशधरांशुभाम् ॥ १०९॥ संवित्स्वरूपिणीं
    वन्दे ध्यायामि परमेश्वरीम् । प्रदर्शयाम्यथशिवेदशामुद्राः फलप्रदाः ॥ ११०॥ त्वां तर्प्पयामि त्रिपुरे
    त्रिधना पार्व्वति । अग्नौमहेशदिग्भागे नैरृत्र्यां मारुते तथा ॥ १११॥ इन्द्राशावारुणी भागे षडङ्गान्यर्च्चये
    क्रमात् । आद्याङ्कामेश्वरीं वन्दे नमामि भगमालिनीम् ॥ ११२॥ नित्यक्लिन्नां नमस्यामि भेरुण्डां प्रणमाम्यहम्
    । वह्निवासान्नमस्यामि महाविद्येश्वरीं भजे ॥ ११३॥ शिवदूतिं नमस्यामि त्वरितां कुल सुन्दरीम् । नित्यान्नीलपताकाञ्च
    विजयां सर्वमङ्गलाम् ॥ ११४॥ ज्वालामालाञ्च चित्राञ्च महानित्यां च संस्तुवे । प्रकाशानन्दनाथाख्याम्पराशक्तिनमाम्यहम्
    ॥ ११५॥ शुक्लदेवीं नमस्यामि प्रणमामि कुलेश्वरीम् । परशिवानन्दनाथाख्याम्पराशक्ति नमाम्यहम् ॥ ११६॥ कौलेश्वरानन्दनाथं
    नौमि कामेश्वरीं सदा । भोगानन्दन्नमस्यामि सिद्धौघञ्च वरानने ॥ ११७॥ क्लिन्नानन्दं नमस्यामि समयानन्दमेवच
    । सहजानन्दनाथञ्चप्रणमामि मुहुर्मुहु ॥ ११८॥ मानवौघं नमस्यामि गगनानन्दगप्यहम् । विश्वानन्दन्नमस्यामि
    विमलानन्दमेवच ॥ ११९॥ मदनानन्दनाथञ्च भुवनानन्दरूपिणीम् । लीलानन्दन्नमस्यामि स्वात्मानन्दं महेश्वरि
    ॥ १२०॥ प्रणमामिप्रियानन्दं सर्वकामफलप्रदम् । परमेष्टिगुरुंवन्दे परमङ्गुरुमाश्रये ॥ १२१॥ श्रीगुरुं
    प्रणमस्यामि मूर्द्ध्नि ब्रह्मबिलेश्वरीम् । श्रीमदानन्दनाथाख्यश्रिगुरोपादुकां तथा ॥ १२२॥ अथ प्राथमिके
    देवि चतुरश्रे कुलेश्वरि । अणिमांलखिमां वन्दे महिमां प्रणमाम्यहम् ॥ १२३॥ ईशित्वसिद्धिं कलये वशित्वं
    प्रणमाम्यहम् । प्राकाम्यसिद्धिम्भुक्तिञ्च इच्छाप्राप्र्तिमहं भजे ॥ १२४॥ सर्वकामप्रदां सर्वकामसिद्धिमहं
    भजे । मद्ध्यमेचतुरश्रेहं ब्राह्मीं माहेश्वरीं भजे ॥ १२५॥ कौमारीं वैष्णवीं वन्दे वाराहीं प्रणमाम्यहम्
    । माहेन्द्रीमपिचामुण्डाम्महालक्ष्मीमहं भजे ॥ १२६॥ तृतीये चतुरश्रे तु सर्वसंक्षोभिणीं भजे । सर्वविद्रापिणीम्मुद्रां
    सर्वाकर्षिणिकां भजे ॥ १२७॥ मुद्रां वशङ्करीं वन्दे सर्वोन्मादिनिकां भजे । भजेमहाङ्कुशां मुद्रां खेचरीं
    प्रणमाम्यहम् ॥ १२८॥ बीजामुद्रां योनिमुद्रां भजे सर्वत्रिखण्डिनीम् । त्रैलोक्यमोहनञ्चक्रं नमामि ललिते
    तव ॥ १२९॥ नमामि योगिनीं तत्र प्रखटाख्यामभीष्टदाम् । सुधार्ण्णवासनंवन्दे तत्र ते परमेश्वरि ॥ १३०॥ चक्रेश्वरि
    महं वन्दे त्रिपुरां प्रणमाम्यहम् । सर्वसंक्षोभिणीम्मुद्रां ततोहं कलये शिवे ॥ १३१॥ अथाहं षोडशदले कामाकर्षिणिकां
    भजे । बुद्ध्याकर्षिणिकां वन्देऽहङ्काराकर्षिणीं भजे ॥ १३२॥ शब्दाकर्षिणिकां वन्दे स्पर्शाकर्षिणिकां
    भजे । रूपाकर्षिणिकांवन्दे रसाकर्षिणिकां भजे ॥ १३३॥ गन्धाकर्षिणिकां वन्दे चित्ताकर्षिणिकां भजे । धैर्याकर्षिणिकांवन्दे
    स्मृत्याकर्षिणिकां भजे ॥ १३४॥ नामाकर्षिणिकां वन्दे बीजाकर्षिणिकां भजे । आत्माकर्षिणिकांवन्दे अमृताकर्षिणिकां
    भजे ॥ १३५॥ शरीराकर्षिणिकां वन्दे नित्यां श्रीपरमेश्वरि । सर्वाशापूरकंवन्दे कल्पयेहं तवेश्वरि ॥ १३६॥
    गुप्ताख्यां योगिनीं वन्दे मातरं गुप्तपूज्यताम् । पोताम्बुजासनन्तत्र नमामि ललिते तव ॥ १३७॥ त्रिपुरेशीं
    नमस्यामि भजामिष्टार्त्थसिद्धिदाम् । सर्वविद्राविणिमुद्रान्तत्राहं ते विचन्तये ॥ १३८॥ सिवे तवाष्टपत्रेहमनङ्गकुसुमां
    भजे । अनङ्गमेखलांवन्दे अनङ्गमदनां भजे ॥ १३९॥ नमोहं प्रणस्यामि अनङ्गमदनातुराम् । अनङ्गरेखाङ्कलये भजेनङ्गां
    च वेगिनीम् ॥ १४०॥ अनङ्गाकुशवन्देऽहमनङ्गमालिनीं भजे । तत्राहम्प्रणस्यामि देव्या आसनमुत्तमम् ॥ १४१॥
    नमामि जगतीशानीं तत्र त्रिपुरसुन्दरीम् । सर्वाकर्षिणिकाम्मुद्रां तत्राह कल्पयामिते ॥ १४२॥ भुवनाश्रये
    तव शिवे सर्वसंक्षोभिणीं भजे । सर्वविद्राविणींवन्दे सर्वकर्षिणिकां भजे ॥ १४३॥ सर्वह्लादिनीं वन्दे सर्वसम्मोहिनीं
    भजे । सकलस्तम्भिनीं वन्दे कलये सर्वजृम्भिणीम् ॥ १४४॥ वशङ्करीं नमस्यामि सर्वरज्ञिनिकां भजे । सकलोन्मदिनीं
    वन्दे भजे सर्वार्थसाधके ॥ १४५॥ सम्पत्तिपुरिकां वन्दे सर्वमन्त्रमयीं भजे । भजाम्येवततश्शक्तिं सर्वद्वन्द्वक्ष्यङ्करीम्
    ॥ १४६॥ तत्राहं कलये चक्रं सर्वसौभाग्यदायकम् । नमामिजगतां धात्रीं सम्प्रदायाख्ययोगिनिम् ॥ १४७॥ नमामि
    परमेशानीं महात्रिपुरवासिनिम् । कलयेहन्तव शिवे मुद्रां सर्वशङ्करीम् ॥ १४८॥ बहिर्द्दशारे ते देवि सर्वसिद्धिप्रदां
    भजे । सर्वसम्पत्प्रदां वन्दे सर्वप्रियङ्करीं भजे ॥ १४९॥ नमाम्यहं ततो देवीं सर्वमङ्गलकारिणीम् । सर्वकामप्रदांवन्दे
    सर्वदुःखविमोचिनिम् ॥ १५०॥ सर्वमृत्युप्रशमनीं सर्वविघ्ननिवारिणीम् । सर्वाङ्गसुन्दरींवन्दे सर्वसौभाग्यदायिनीम्
    ॥ १५१॥ सर्वार्त्थसाधकं चक्रं तत्राहं ने विचिन्तये । तत्राहन्ते नमस्यामि कुलोत्तीर्णाख्य योगिनीम् ॥
    १५२॥ सर्वमन्त्रसनं वन्दे त्रिपुराश्रियमाश्रये । कलयामिततो मुद्रां सर्वोन्मादन कारिणीम् ॥ १५३॥ अन्तर्द्दशारे
    ते देवि सर्वज्ञां प्रणमाम्यहम् । सर्वशक्तिन्नमस्यामि सर्वैश्वर्यप्रदां भजे ॥ १५४॥ सर्वज्ञानमयीं वन्दे
    सर्वव्याधिविनाशिनीम् । सर्वाधारस्वरूपाञ्चसर्वपापहराम्भजे ॥ १५५॥ सर्वानन्दमयिं वन्दे सर्वरक्षास्वरूपिणीम्
    । प्रणमामिमहादेवीं सर्वेप्सित फलप्रदाम् ॥ १५६॥ सर्वरक्षाकरं चक्रं सुन्दरीं कलये सदा । निगर्भयोनींवन्दे
    तत्राहं प्रणमाम्यहम् ॥ १५७॥ साद्ध्यसिद्धासनं वन्दे भजे त्रिपुरमालिनीम् । कलयामिततो देवीं मुद्रां सर्वमहाङ्कुशाम्
    ॥ १५८॥ अष्टारे वशिनीं वन्दे महा कामेश्वरीं भजे । मोदिनींविमलांवन्दे अरुणाजयिनीं भजे ॥ १५९॥ सर्वेश्वरीं
    नमस्यामि कौलिनीं प्रणमाम्यहम् । सर्वरोगहरञ्चक्रं तत्राहं कलये सदा ॥ १६०॥ नमामि त्रिपुरा सिद्धिं भजे
    मुद्रां च खेचरीम् । महात्रिकोणवत्बाहुचतुरश्रे कुलेश्वरि ॥ १६१॥ नमामि जृम्भणाबाणं सर्वसम्मोहिनीं भजे
    । पाशञ्चापं भजे नित्यं भजे स्तम्भनमङ्कुशम् ॥ १६२॥ त्रिकोणेहं जगद्धात्रीं महाकामेश्वरीं भजे । महावज्रेश्वरींवन्दे
    महाश्रीभगमालिनीम् ॥ १६३॥ महाश्रीसुन्दरीं वन्दे सर्वकामफलप्रदाम् । सर्वसिद्धिप्रदञ्चक्रं तवदेवि नमाम्यहम्
    ॥ १६४॥ नमाम्यतिरहस्याख्यां योगिनीं तवकामदाम् । त्रिपुराम्बान्नमस्यामि बीजामुद्रामहाम्भजे ॥ १६५॥ मूलमन्त्रेण
    ललिते तल्बिन्दौ पूजयाम्यहम् । सर्वानन्दमयञ्चक्रं तवदेवि भजाम्यहम् ॥ १६६॥ परां पररहस्याख्यां योगिनीं
    तत्रकामदाम् । महाचक्रेश्वरींवन्दे योनिमुद्रामहं भजे ॥ १६७॥ धूपदीपादिकं सर्वमर्प्पितं कल्पयाम्यहम्
    । त्वल्प्रीतयेमहामुद्रां दर्शयामि ततश्शिवे ॥ १६८॥ शाल्यन्नं मधुसम्युक्तं पायसापूप सम्युक्तम् । घृतसूपसमायुक्तन्दधिक्षीरसमन्वितम्
    ॥ १६९॥ सर्वभक्ष्यसमायुक्तं बहुशाकसमन्वितम् । निक्षिप्यकाञ्चने पात्रे नैवेद्यं कल्पयामि ते ॥ १७०॥ सङ्कल्पबिन्दुना
    चक्रं कुचौ बिन्दुद्वयेन च । योनिश्चसपरार्द्धेन कृत्वा श्रीललिते तव ॥ १७१॥ एतत् कामकला रूपं भक्तानां
    सर्वकामदम् । सर्वसौभाग्यदंवन्दे तत्र त्रिपुरसुन्दरीम् ॥ १७२॥ वामभागे महेशानि वृत्तं च चतुरस्रकम् ।
    कृत्वागन्धाक्षताद्यैश्चाप्यर्च्चयामि महेश्वरीम् ॥ १७३॥ वाग्दवाद्यं नमस्यामि तत्र व्यापकमण्डलम् । जलयुक्तेनपाणौ
    च शुद्धमुद्रा समन्वितम् ॥ १७४॥ तत्र मन्त्रेण दास्यामि देवि ते बलिमुत्तमम् । नमस्तेदेवदेवेशि नम स्त्रैलोक्यवन्दिते
    ॥ १७५॥ नमश्शिववराङ्कस्थे नमस्त्रीपुरसुन्दरि । प्रदक्षिणनमस्कारमनेनाहं करोमि ते ॥ १७६॥ तत सङ्कल्पमन्त्राणां
    समाजं परमेश्वरि । प्रजपामिमहाविद्यां त्वत् प्रीत्यर्त्थमहं शिवे ॥ १७७॥ तव विद्यां प्रजप्त्वाथ नौमि
    त्वां परमेश्वरि । महादेविमहेशानि महाशिवमये प्रिये ॥ १७८॥ महानित्ये महासिद्धे त्वामहं शरणं शिवे । जयत्वन्त्रिपुरे
    देवि ललिते परमेश्वरि ॥ १७९॥ सदाशिव प्रियङ्करि पाहिमां करुणानिधे । जगन्मातर्ज्जगद्रूपेजगदीश्वरवल्लभे
    ॥ १८०॥ जगन्मयि जगत् स्तुत्ये गौरि त्वामहमाश्रये । अनाद्येसर्वलोकानामाद्ये भक्तेष्टदायिनि ॥ १८१॥ गिरिराजेन्द्रतनये
    नमस्तीपुरसुन्दरि । जयारीञ्जयदेवेशिब्रह्ममातर्महेश्वरि ॥ १८२॥ विष्णुमातरमाद्यन्ते हरमातस्सुरेश्वरि
    । ब्रह्म्यादिमातृसंस्तुत्ये सर्वाभरण सम्युक्ते ॥ १८३॥ ज्योतिर्मयि महारूपे पाहिमां त्रिपुरे सदा । लक्ष्मीवाण्यादिसं
    पूज्ये ब्रह्मविष्णुशिवप्रिय ॥ १८४॥ भजामि तव पादाब्जं देवि त्रिपुरसुन्दरि । त्वल्प्रीत्यर्थंयतः काञ्चीच्छक्तिं
    वैपूजयाम्यहम् ॥ १८५॥ ततश्च केतनां शक्तिं तर्पयामि महेश्वरि । तथापित्वां भजंस्तोषं चिदग्नौ च ददाम्यहम्
    ॥ १८६॥ त्वल्प्रीत्यर्थ्यं महादेवि ममाभीष्टार्त्थ सिद्धये । बद्ध्वात्वां खैचरीमुद्रां क्षमस्वोद्वासयाम्यहम्
    ॥ १८७॥ तिष्ठमे हृदयेनित्यं त्रिपुरे परमेश्वरि । जगदम्बमहाराज्ञि महाशक्ति शिवप्रिये ॥ १८८॥ हृच्चक्रे
    तिष्तमे नित्यं महात्रिपुरसुन्दरि । एतत्त्रिपुरसुन्दर्या हृदयं सर्वकामदम् ॥ १८९॥ महारहस्यं सततं दुर्ल्लभं
    दैवतैरपि । साक्षात्सदाशिवेनोक्तं गुह्यात् गुह्यमनुत्तमम् ॥ १९०॥ यः पतेत् श्रद्धया नित्यं श
