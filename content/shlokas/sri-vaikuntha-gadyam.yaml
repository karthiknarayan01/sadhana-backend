id: sri-vaikuntha-gadyam
category: stotram
name:
  english: Sri Vaikuntha Gadyam
content:
  english: yamunaryasudhambhodhimavagahya yathamati | adaya bhaktiyogakhyam ratnam sandarshayamyaham ||
    svadhina trividhacetanacetanasvarupasthiti pravrittibhedam klesha karmadyasheshadoshasamsprishtam
    svabhavikanavadhikatishaya jnanabalaishvaryaviryashaktitejah prabhrityasankhyeya kalyanagunaganaugha
    maharnavam svamitvena suhritvena gurutvena ca parigrihya aikantikatyantika tatpadambujadvaya paricaryaikamanorathah
    tatpraptaye ca tatpadambujadvaya prapatteranyanna me kalpakotisahasrenapi sadhanamastiti manvanah
    tasyaiva bhagavato narayanasya akhilasattvadayaikasagarasya analocita gunagunakhanda jananukulamaryada
    shilavatah svabhavikanavadhikatishaya gunavattaya devatiryanmanushyadyakhilajana hridayanandanasya
    ashritavatsalyaikajaladheh bhaktajanasamshleshaikabhogasya nityajnanakriyaishvaryadi bhogasamagrisamriddhasya
    shrimaccaranaravindayugalam ananyatmasanjivanena tadgatasarvabhavena sharanamanuvrajet | tatashca
    pratyahamatmojjivanayaivamanusmaret | caturdashabhuvanatmakam andam dashagunitottaram ca avaranasaptakam
    vartamane paramavyomashabdabhidheye brahmadinam vanmanasa'gocare shrimati vaikunthe divyaloke sanakavidhishivadibhirapi
    acintyasvabhavaishvaryaih nityasiddhairanantairbhagavadanukulyaika bhogairdivyapurushaih mahatmabhih
    apurite idrishasvabhavamiti paricchettumayogye divyavaranashatasahasravrite divyakalpakatarupashobhite
    divyodyana shatasahasrakotibhiravrite atipramane divyayatane kasmimshcidvicitra divyaratnamaya divyasthanamandape
    divyaratnastambha shatasahasrakotibhirupashobhite divyananaratnakritasthala vicitrite divyalankaralankrite
    paritah patitaih patamanaih padapasthaishca nanagandhavarnairdivyapushpaih shobhamanairdivyapushpopavanairupashobhite
    sankirnaparijatadi kalpadrumopashobhitaih asankirnaishca kaishcidantassthapushparatnadinirmita divyalilamandapa
    shatasahasropashobhitaih sarvada'nubhuyamanairapyapurvavadashcaryamavahadbhih kridashaila shatasahasrairalankritaih
    kaishcinnarayanadivyalila'sadharanaih kaishcitpadmavanalaya divyalila'sadharanaih sadharanaishca kaishcit
    shukasharikamayurakokiladibhih komalakujitairakulaih divyodyana shatasahasrairavrite manimuktapravala
    kritasopanaih atiramaniyadarshanaih atimanoharamadhurasvaraih akulaih antastha muktamaya divyakridasthanopashobhitaih
    divyasaugandhikavapishatasahasraih divyarajahamsavalivirajitairavrite nirastatishayanandaikarasataya
    canantyacca pravishtanunmadayadbhih kridoddeshairvirajite tatra tatra krita divyapushpaparyankopashobhite
    nanapushpasavasvada mattabhringavalibhih udgiyamana divyagandharvenapurite candanagarukarpura divyapushpavagahi
    mandanilasevyamane madhye pushpasancaya vicitrite mahati divyayogaparyanke anantabhogini shrimadvaikunthaishvaryadi
    divyalokam atmakantya vishvamapyayayantya shesha sheshashanadi sarvaparijanam bhagavatastattadavasthocita
    paricaryayam ajnapayantya shilarupaguna vilasadibhih atmanurupaya shriya sahasinam pratyagronmilita
    sarasijasadrisha nayanayugalam svacchanilajimutasankasham svaya prabhaya'tinirmalaya atishitalaya
    atikomalaya svacchamanikyabhaya kritsnam jagadbhasayantam acintyadivyadbhuta nityayauvana svabhavalavanyamayamritasagaram
    atisaukumaryadi ishat prasvinnavadalakshyamana lalataphalaka divyalakavalivirajitam prabuddhamugdhambuja
    carulocanam udagrapinamsa vilambikundalalakavali bandhura kambukandharam sotpala karnabhushanashlathalakabandha
    vimardashamsibhih caturbhirajanuvilambibhirbhujairvirajitam atikomala divyarekhalankritatamrakaratalam
    divyanguliyakavirajitam atikomala divyanakhavalivirajitam atiraktangulibhiralankritam tatkshanonmilita
    pundarika sadrishacaranayugalam atimanohara kiritamakuta cudavatamsa makarakundala graiveyaka hara
    keyura kataka shrivatsa kaustubha muktadamodarabandhana pitambara kanciguna nupuradibhiratyanta sukhasparshaih
    divyagandhairbhushanairbhushitam shrimatya vaijayantya vanamalaya virajitam shankhacakragada'si sharngadi
    divyayudhaih sevyamanam svasankalpamatravaklupta jagajjanmasthitidhvamsadike shrimati vishvaksene
    nyasta samastatmaishvaryam vainateyadibhih svabhavato nirasta samasta samsarika svabhavaih bhagavatparicaryakarana
    yogyairbhagavatparicaryaikabhogai rnityasiddhairanantaih yatha yogam sevyamanam atmabhogena ananusamhitaparadikala
    divyamala komalavalokanena vishvamahladayantam ishadunmilita mukhambujodaravinirgatena divyananaravinda
    shobhajananena divyagambhiryaudarya saundarya madhuryadyanavadhika gunaganavibhushitena atimanohara
    divyabhavagarbhena divyalila''lapamritena akhilajana hridayantaranyapurayantam bhagavantam narayanam
    dhyanayogena drishtva tato bhagavato nityasvamyamatmano nityadasyam ca yathavasthitamanusandhaya kada'ham
    bhagavantam narayanam mama sarvam sakshatkaravani cakshusha | kada'ham bhagavatpadambujadvayam shirasa
    sangrahishyami | kada'ham bhagavatpadambujadvaya paricarya''shaya nirastasamastetara bhogashah apagata
    samasta samsarikasvabhavah tatpadambujadvayam pravekshyami | kada'ham bhagavatpadambujadvaya paricaryakaranayogya
    stadekabhogastatpadau paricarishyami | kada mam bhagavan svakiyaya atishitalaya drisha avalokya snigdhagambhiramadhuraya
    gira paricaryayam ajnapayishyati iti bhagavatparicaryayamasham vardhayitva tayaiva'shaya tatprasadopabrimhitaya
    bhagavantamupetya duradeva bhagavantam sheshabhoge shriya sahasinam vainateyadibhih sevyamanam samastaparivaraya
    shrimate narayanaya namah iti pranamya utthayotthaya punah punah pranamya atyanta sadhvasavinayavanato
    bhutva bhagavatparishadagananayakairdvarapalaih kripaya snehagarbhaya drisha'valokitah samyagabhivanditaistaistairevanumato
    bhagavantamupetya shrimata mulamantrena mamaikantikatyantika paricaryakaranaya parigrihnishva iti
    yacamanah pranamyatmanam bhagavate nivedayet | tato bhagavata svayamevatmasanjivanena amaryadashilavata
    atipremanvitena avalokanenavalokya sarvadesha sarvakala sarvavasthocitatyantasheshabhavaya svikrito'nujnatashca
    atyantasadhvasavinayavanatah kinkurvanah kritanjaliputo bhagavantamupasita | tatashcanubhuyamana bhavavisheshah
    niratishayapritya'nyatkincitkartum drashtum smartumashaktah punarapi sheshabhavameva yacamano bhagavantamevavicchinnasrotorupenavalokanena
    avalokayannasita | tato bhagavata svayamevatmasanjivanenavalokanenavalokya sasmitamahuya samastakleshapaham
    niratishayasukhavahamatmiyam shrimatpadaravindayugalam shirasi kritam dhyatva amritasagarantarnimagnasarvavayavah
    sukhamasita | lakshmipateryatipateshca dayaikadhamnoh yo'sau pura samajanishta jagaddhitartham | prapyam
    prakashayatu nah paramam rahasyam samvada esha sharanagati mantrasarah || iti shribhagavadramanujaviracite
    shrivaikunthagadyam |
  devanagari: यामुनार्यसुधाम्भोधिमवगाह्य यथामति । आदाय भक्तियोगाख्यं रत्नं सन्दर्शयाम्यहम् ॥ स्वाधीन त्रिविधचेतनाचेतनस्वरूपस्थिति
    प्रवृत्तिभेदं क्लेश कर्माद्यशेषदोषासंस्पृष्टं स्वाभाविकानवधिकातिशय ज्ञानबलैश्वर्यवीर्यशक्तितेजः प्रभृत्यसङ्ख्येय
    कल्याणगुणगणौघ महार्णवं स्वामित्वेन सुहृत्वेन गुरुत्वेन च परिगृह्य ऐकान्तिकात्यन्तिक तत्पादाम्बुजद्वय
    परिचर्यैकमनोरथः तत्प्राप्तये च तत्पादाम्बुजद्वय प्रपत्तेरन्यन्न मे कल्पकोटिसहस्रेणापि साधनमस्तीति
    मन्वानः तस्यैव भगवतो नारायणस्य अखिलसत्त्वदयैकसागरस्य अनालोचित गुणगुणाखण्ड जनानुकूलामर्याद शीलवतः स्वाभाविकानवधिकातिशय
    गुणवत्तया देवतिर्यङ्मनुष्याद्यखिलजन हृदयानन्दनस्य आश्रितवात्सल्यैकजलधेः भक्तजनसंश्लेषैकभोगस्य नित्यज्ञानक्रियैश्वर्यादि
    भोगसामग्रीसमृद्धस्य श्रीमच्चरणारविन्दयुगलं अनन्यात्मसञ्जीवनेन तद्गतसर्वभावेन शरणमनुव्रजेत् । ततश्च
    प्रत्यहमात्मोज्जीवनायैवमनुस्मरेत् । चतुर्दशभुवनात्मकं अण्डं दशगुणितोत्तरं च आवरणसप्तकं वर्तमाने परमव्योमशब्दाभिधेये
    ब्रह्मादीनां वाङ्मनसाऽगोचरे श्रीमति वैकुण्ठे दिव्यलोके सनकविधिशिवादिभिरपि अचिन्त्यस्वभावैश्वर्यैः
    नित्यसिद्धैरनन्तैर्भगवदानुकूल्यैक भोगैर्दिव्यपुरुषैः महात्मभिः आपूरिते ईदृशस्वभावमिति परिच्छेत्तुमयोग्ये
    दिव्यावरणशतसहस्रावृते दिव्यकल्पकतरूपशोभिते दिव्योद्यान शतसहस्रकोटिभिरावृते अतिप्रमाणे दिव्यायतने कस्मिंश्चिद्विचित्र
    दिव्यरत्नमय दिव्यास्थानमण्डपे दिव्यरत्नस्तम्भ शतसहस्रकोटिभिरुपशोभिते दिव्यनानारत्नकृतस्थल विचित्रिते
    दिव्यालङ्कारालङ्कृते परितः पतितैः पतमानैः पादपस्थैश्च नानागन्धवर्णैर्दिव्यपुष्पैः शोभमानैर्दिव्यपुष्पोपवनैरुपशोभिते
    सङ्कीर्णपारिजातादि कल्पद्रुमोपशोभितैः असङ्कीर्णैश्च कैश्चिदन्तस्स्थपुष्परत्नादिनिर्मित दिव्यलीलामण्डप
    शतसहस्रोपशोभितैः सर्वदाऽनुभूयमानैरप्यपूर्ववदाश्चर्यमावहद्भिः क्रीडाशैल शतसहस्रैरलङ्कृतैः कैश्चिन्नारायणदिव्यलीलाऽसाधारणैः
    कैश्चित्पद्मवनालया दिव्यलीलाऽसाधारणैः साधारणैश्च कैश्चित् शुकशारिकामयूरकोकिलादिभिः कोमलकूजितैराकुलैः
    दिव्योद्यान शतसहस्रैरावृते मणिमुक्ताप्रवाल कृतसोपानैः अतिरमणीयदर्शनैः अतिमनोहरमधुरस्वरैः आकुलैः अन्तस्थ
    मुक्तामय दिव्यक्रीडास्थानोपशोभितैः दिव्यसौगन्धिकवापीशतसहस्रैः दिव्यराजहंसावलीविराजितैरावृते निरस्तातिशयानन्दैकरसतया
    चानन्त्याच्च प्रविष्टानुन्मादयद्भिः क्रीडोद्देशैर्विराजिते तत्र तत्र कृत दिव्यपुष्पपर्यङ्कोपशोभिते
    नानापुष्पासवास्वाद मत्तभृङ्गावलीभिः उद्गीयमान दिव्यगान्धर्वेणापूरिते चन्दनागरुकर्पूर दिव्यपुष्पावगाहि
    मन्दानिलासेव्यमाने मध्ये पुष्पसञ्चय विचित्रिते महति दिव्ययोगपर्यङ्के अनन्तभोगिनि श्रीमद्वैकुण्ठैश्वर्यादि
    दिव्यलोकं आत्मकान्त्या विश्वमाप्याययन्त्या शेष शेषाशनादि सर्वपरिजनं भगवतस्तत्तदवस्थोचित परिचर्यायां
    आज्ञापयन्त्या शीलरूपगुण विलासादिभिः आत्मानुरूपया श्रिया सहासीनं प्रत्यग्रोन्मीलित सरसिजसदृश नयनयुगलं
    स्वच्छनीलजीमूतसङ्काशं स्वया प्रभयाऽतिनिर्मलया अतिशीतलया अतिकोमलया स्वच्छमाणिक्याभया कृत्स्नं जगद्भासयन्तं
    अचिन्त्यदिव्याद्भुत नित्ययौवन स्वभावलावण्यमयामृतसागरं अतिसौकुमार्यादि ईषत् प्रस्विन्नवदालक्ष्यमाण
    ललाटफलक दिव्यालकावलीविराजितं प्रबुद्धमुग्धाम्बुज चारुलोचनं उदग्रपीनांस विलम्बिकुण्डलालकावली बन्धुर
    कम्बुकन्धरं सोत्पल कर्णभूषणश्लथालकाबन्ध विमर्दशंसिभिः चतुर्भिराजानुविलम्बिभिर्भुजैर्विराजितं अतिकोमल
    दिव्यरेखालङ्कृताताम्रकरतलं दिव्याङ्गुलीयकविराजितं अतिकोमल दिव्यनखावलीविराजितं अतिरक्ताङ्गुलीभिरलङ्कृतं
    तत्क्षणोन्मीलित पुण्डरीक सदृशचरणयुगलं अतिमनोहर किरीटमकुट चूडावतंस मकरकुण्डल ग्रैवेयक हार केयूर कटक
    श्रीवत्स कौस्तुभ मुक्तादामोदरबन्धन पीताम्बर काञ्चीगुण नूपुरादिभिरत्यन्त सुखस्पर्शैः दिव्यगन्धैर्भूषणैर्भूषितं
    श्रीमत्या वैजयन्त्या वनमालया विराजितं शङ्खचक्रगदाऽसि शार्ङ्गादि दिव्यायुधैः सेव्यमानं स्वसङ्कल्पमात्रावक्लुप्त
    जगज्जन्मस्थितिध्वंसादिके श्रीमति विष्वक्सेने न्यस्त समस्तात्मैश्वर्यं वैनतेयादिभिः स्वभावतो निरस्त
    समस्त सांसारिक स्वभावैः भगवत्परिचर्याकरण योग्यैर्भगवत्परिचर्यैकभोगै र्नित्यसिद्धैरनन्तैः यथा योगं
    सेव्यमानं आत्मभोगेन अननुसंहितपरादिकाल दिव्यामल कोमलावलोकनेन विश्वमाह्लादयन्तं ईषदुन्मीलित मुखाम्बुजोदरविनिर्गतेन
    दिव्याननारविन्द शोभाजननेन दिव्यगाम्भीर्यौदार्य सौन्दर्य माधुर्याद्यनवधिक गुणगणविभूषितेन अतिमनोहर दिव्यभावगर्भेण
    दिव्यलीलाऽऽलापामृतेन अखिलजन हृदयान्तराण्यापूरयन्तं भगवन्तं नारायणं ध्यानयोगेन दृष्ट्वा ततो भगवतो नित्यस्वाम्यमात्मनो
    नित्यदास्यं च यथावस्थितमनुसन्धाय कदाऽहं भगवन्तं नारायणं मम सर्वं साक्षात्करवाणि चक्षुषा । कदाऽहं भगवत्पादाम्बुजद्वयं
    शिरसा सङ्ग्रहीष्यामि । कदाऽहं भगवत्पादाम्बुजद्वय परिचर्याऽऽशया निरस्तसमस्तेतर भोगाशः अपगत समस्त सांसारिकस्वभावः
    तत्पादाम्बुजद्वयं प्रवेक्ष्यामि । कदाऽहं भगवत्पादाम्बुजद्वय परिचर्याकरणयोग्य स्तदेकभोगस्तत्पादौ परिचरिष्यामि
    । कदा मां भगवान् स्वकीयया अतिशीतलया दृशा अवलोक्य स्निग्धगम्भीरमधुरया गिरा परिचर्यायां आज्ञापयिष्यति
    इति भगवत्परिचर्यायामाशां वर्धयित्वा तयैवाऽशया तत्प्रसादोपबृंहितया भगवन्तमुपेत्य दूरादेव भगवन्तं शेषभोगे
    श्रिया सहासीनं वैनतेयादिभिः सेव्यमानं समस्तपरिवाराय श्रीमते नारायणाय नमः इति प्रणम्य उत्थायोत्थाय
    पुनः पुनः प्रणम्य अत्यन्त साध्वसविनयावनतो भूत्वा भगवत्पारिषदगणनायकैर्द्वारपालैः कृपया स्नेहगर्भया
    दृशाऽवलोकितः सम्यगभिवन्दितैस्तैस्तैरेवानुमतो भगवन्तमुपेत्य श्रीमता मूलमन्त्रेण मामैकान्तिकात्यन्तिक
    परिचर्याकरणाय परिगृह्णीष्व इति याचमानः प्रणम्यात्मानं भगवते निवेदयेत् । ततो भगवता स्वयमेवात्मसञ्जीवनेन
    अमर्यादशीलवता अतिप्रेमान्वितेन अवलोकनेनावलोक्य सर्वदेश सर्वकाल सर्वावस्थोचितात्यन्तशेषभावाय स्वीकृतोऽनुज्ञातश्च
    अत्यन्तसाध्वसविनयावनतः किङ्कुर्वाणः कृताञ्जलिपुटो भगवन्तमुपासीत । ततश्चानुभूयमान भावविशेषः निरतिशयप्रीत्याऽन्यत्किञ्चित्कर्तुं
    द्रष्टुं स्मर्तुमशक्तः पुनरपि शेषभावमेव याचमानो भगवन्तमेवाविच्छिन्नस्रोतोरूपेणावलोकनेन अवलोकयन्नासीत
    । ततो भगवता स्वयमेवात्मसञ्जीवनेनावलोकनेनावलोक्य सस्मितमाहूय समस्तक्लेशापहं निरतिशयसुखावहमात्मीयं श्रीमत्पादारविन्दयुगलं
    शिरसि कृतं ध्यात्वा अमृतसागरान्तर्निमग्नसर्वावयवः सुखमासीत । लक्ष्मीपतेर्यतिपतेश्च दयैकधाम्नोः योऽसौ
    पुरा समजनिष्ट जगद्धितार्थम् । प्राप्यं प्रकाशयतु नः परमं रहस्यं संवाद एष शरणागति मन्त्रसारः ॥ इति
    श्रीभगवद्रामानुजविरचिते श्रीवैकुण्ठगद्यम् ।
