id: mahishasurakritamdevistotram
category: stotram
name:
  english: mahishasurakritamdevistotram
  devanagari: महिषासुरकृतंदेवीस्तोत्रम्
content:
  english: danava uvaca | jaya devi jayacintye jaya sarvasureshvari | jaya sarvagate devi jaya sarvajanapriye
    || 58|| jaya kamaprade nityam jaya trailokyasundari | jaya trailokya raksharthamudyate hyakutobhaye
    || 59|| jaya devi kritanande jaya daityavinashini | jaya kleshacchide kante jayabhaktavimohade ||
    60|| tvam srishtistvam vara devi tvam lakshmistvam sarasvati | tvam svaha tvam svadha tushtih pushtirmedha
    dhritih kshama || 61|| tasmatkuru prasadam me pranan raksha dayam kuru | pranatasya sudinasya hinasya
    ca visheshatah || 62|| aham durvasasa shapto hiranyakshasuto bali | mahishatvam samanitastvaya devi
    vimokshitah || 63|| tasmaddarpah pramukto'dya maya danavasambhavah | kinkaratvam prayasyami sampratam
    te sureshvari || 64|| jaya sarvagate devi sarvadushtavinashini || 65|| iti shriskandapurane nagarakhande
    ekavimshadhikashatatamadhyayantargatam mahishasurakritam devistotram samaptam | skandapurana | nagarakhanda
    | adhyaya 121
  devanagari: दानव उवाच । जय देवि जयाचिन्त्ये जय सर्वसुरेश्वरि । जय सर्वगते देवि जय सर्वजनप्रिये ॥ ५८॥
    जय कामप्रदे नित्यं जय त्रैलोक्यसुन्दरि । जय त्रैलोक्य रक्षार्थमुद्यते ह्यकुतोभये ॥ ५९॥ जय देवि कृतानन्दे
    जय दैत्यविनाशिनि । जय क्लेशच्छिदे कान्ते जयाभक्तविमोहदे ॥ ६०॥ त्वं सृष्टिस्त्वं वरा देवी त्वं लक्ष्मीस्त्वं
    सरस्वती । त्वं स्वाहा त्वं स्वधा तुष्टिः पुष्टिर्मेधा धृतिः क्षमा ॥ ६१॥ तस्मात्कुरु प्रसादं मे प्राणान्
    रक्ष दयां कुरु । प्रणतस्य सुदीनस्य हीनस्य च विशेषतः ॥ ६२॥ अहं दुर्वाससा शप्तो हिरण्याक्षसुतो बली ।
    महिषत्वं समानीतस्त्वया देवी विमोक्षितः ॥ ६३॥ तस्माद्दर्पः प्रमुक्तोऽद्य मया दानवसम्भवः । किङ्करत्वं
    प्रयास्यामि साम्प्रतं ते सुरेश्वरि ॥ ६४॥ जय सर्वगते देवि सर्वदुष्टविनाशिनि ॥ ६५॥ इति श्रीस्कन्दपुराणे
    नागरखण्डे एकविंशाधिकशततमाध्यायान्तर्गतं महिषासुरकृतं देवीस्तोत्रं समाप्तम् । स्कन्दपुराण । नागरखण्ड
    । अध्याय १२१
