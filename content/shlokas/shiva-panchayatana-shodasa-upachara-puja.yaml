  devanagari: पूर्वाङ्ग पूजा शुचिः अपवित्रः पवित्रो वा सर्वावस्था त्पुण्डरीकाक्षं स बाह्याभ्यन्तर श्शुचिः
    ॥ पुण्डरीकाक्ष पुण्डरीकाक्ष पुण्डरीकाक्षाय नमः ॥ प्रार्थना शुक्लाम्बरधरं ञ्चतुर्भुजम् । प्रसन्नवदन
    थ्सर्वविघ्नोपशान्तये ॥ अगजानन पद्मार्क ङ्गजाननमहर्निशम् । अनेकद म्भक्तानां एकदन्तमुपास्महे ॥ दे॒वीं
    वाँच॑मजनयन्त दे॒वास्तां विँ॒श्वरू॑पाः प॒शवो॑ वदन्ति । सा नो॑ म॒न्द्रेष॒मूर्ज॒ न्दुहा॑ना धे॒नुर्वाग॒स्मानुप॒
    सुष्टु॒तैतु॑ ॥ य श्शिवो नाम रूपाभ्यां याँ देवी सर्वमङ्गला । तयो स्संस्मरणान्नित्यं सर्वदा जय मङ्गलम्
    ॥ तदेव लग्नं सुदिन न्तदेव लक्ष्मीपते ते ऽङ्घ्रियुगं स्मरामि ॥ गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो
    महेश्वरः । गुरु त्परब्रह्म तस्मै श्रीगुरवे नमः ॥ लाभस्तेषा म्पराभवः । एषामिन्दीवरश्यामो हृदयस्थो जनार्दनः
    ॥ सर्वमङ्गल माङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरी नारायणि नमो ऽस्तु ते ॥ श्रीलक्ष्मीनारायणाभ्या
    न्नमः । उमामहेश्वराभ्या न्नमः । वाणीहिरण्यगर्भाभ्या न्नमः । शचीपुरन्दराभ्या न्नमः । अरुन्धतीवसिष्ठाभ्या
    न्नमः । श्रीसीतारामाभ्या न्नमः । मातापितृभ्यो नमः । सर्वेभ्यो महाजनेभ्यो नमः । कर्पूर गौर ङ्करुणावतारं
    संसारसार म्भुजगेन्द्र हारम् । सदा रमन्तं हृदयारविन्दे भव न्नमामि ॥ वागर्थाविव सम्पृक्तौ वागर्थ प्रतिपत्तये
    । जगतः पितरौ वन्दे पार्वती परमेश्वरौ ॥ वन्दे महेशं सुरसिद्धसेवितं देवाङ्गना गीत सुनृत्य तुष्टम् ।
    पर्यङ्कगं शैलसुतासमेतं कल्पद्रुमारण्यगत म्प्रसन्नम् ॥ आपाताल वान्तामृतैः । अस्तोकाप्लुत च्चिवम् ॥
    ब्रह्माण्ड व्याप्तदेहा भसित हिमरुचा भासमाना भुजङ्गैः कण्ठे कालाः कपर्दाः कलित श्चण्ड कोदण्ड हस्ताः
    । त्र्यक्षा रुद्राक्षमालाः प्रकटितविभवा श्शाम्भवा मूर्तिभेदाः रुद्रा प्रकटितविभवा नः प्रयच्चन्तु सौख्यम्
    ॥ दीपाराधनम् दीपस्त्व म्प्रभुरव्ययः । सौभाग्य न्देहि पुत्रांश्च सर्वान्कामांश्च देहि मे ॥ भो दीप देवि
    रूपस्त्व ङ्कर्मसाक्षी ह्यविघ्नकृत् । यावत्पूजा ङ्करिष्यामि तावत्त्वं सुस्थिरो भव ॥ दीपाराधन मुहूर्त
    ऽस्तु ॥ पूजार्थे हरिद्रा कुङ्कुम विलेपन न्नारायणाय स्वाहा । ओ न्त्रिविक्रमाय नमः । ॐ वाँमनाय नमः ।
    ॐ श्रीधराय नमः । ॐ हृषीकेशाय नमः । ओ न्दामोदराय नमः । ॐ सङ्कर् म्प्रद्युम्नाय नमः । ॐ अनिरुद्धाय नमः
    । ओ म्पुरुषोत्तमाय नमः । ॐ अधोक्षजाय नमः । ओ न्नारसिंहाय नमः । ॐ अच्युताय नमः । ओ ञ्जनार्दनाय नमः
    । ॐ उपेन्द्राय नमः । ॐ हरये नमः । ॐ श्रीकृष्णाय नमः । भूतोच्चाटनम् उत्तिष्ठन्तु भूतपिशाचाः य एते भूमि
    भारकाः । एतेषामविरोधेन ब्रह्मकर्म समारभे ॥ अपसर्पन्तु ते भूता ये भूता भूमिसंस्थिताः । ये भूता विघ्नकर्तारस्ते
    गच्छन्तु शिवा ऽज्ञया ॥ प्राणायामम् ओ म्भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो नः॑ प्रचो॒दया त् ॥ ओमापो॒
    ज्योती॒ रसो॒ म्ब्रह्म॒ भूर्भुव॒स्सुव॒रोम् ॥ सङ्कल्पम् ममोपात्त समस्त दुरितक्षयद्वारा श्री परमेश्वर
    प्रीत्यर्थम् शुभे शोभने मुहूर्ते आद्यब्रह्मणः द्वितीय परार्धे श्वेतवराह कल्पे वैवस्वत मन्वन्तरे अष्टाविंशति
    तमे कलियुगे प्रथमे पादे जम्बूद्वीपे भारतवर् षे भरतखण्डे मेरोः दक्षिणे पार् श्वे शकाब्दे अस्मिन् वर्तमाने
    व्यवहारिके प्रभवादि षष्ठ्या ङ्गुण सकल विशेषण विशिष्टायां अस्यां शुभतिथौ ममोपात्त समस्त दुरितक्षयद्वारा
    श्री परमेश्वर प्रीत्यर्थं जातयाः मम धर्मपत्न्याश्च आवयो ऐश्वर्याणां अभिवृद्ध्यर्थम् चतुर्विध फलपुरुषार्थ
    सिद्ध्यर्थम् सर्वारिष्ट शान्त्यर्थम् सर्वाभीष्ट सिद्ध्यर्थम् सपरिवार सोमास्कन्द परमेश्वर चरणारविन्दयोः
    अचञ्चल यावच्छक्ति परिवार सहित रुद्रविधानेन ध्यान अर्च्चनादि सहित साम्बशिव पूजा निर्विघ्न पूजा परिसमाप्त्यर्थं
    आदौ श्रीमहागणपति पूजा श्री महागणपति पूजा ॥ तदङ्ग कलशाराधन ङ्करिष्ये । कलशाराधनम् कलशे गन्ध पुष्पाक्षतैरभ्यर्च्य
