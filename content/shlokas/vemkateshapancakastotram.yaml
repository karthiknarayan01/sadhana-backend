id: vemkateshapancakastotram
category: stotram
name:
  english: vemkateshapancakastotram
  devanagari: वेंकटेशपन्चकस्तोत्रम्
content:
  english: shrivenkateshapancakastotram shridharadhinayakam shritapavargadayakam shrigirishamitramambujekshanam
    vicakshanam | shrinivasamadidevamaksharam paratparam nagarangirishvaram namami venkateshvaram || 1||
    upendramindushekhararavindajamarendra vrindarakadisevyamanapadapankajadvayam | candrasuryalocanam
    mahendranilasannibham nagarangirishvaram namami venkateshvaram || 2|| nandagopanandanam sanandanadivanditam
    kundakutmalagradantamindiramanoharam | nandakaravindashankhacakrasharngasadhanam nagarangirishvaram
    namami venkateshvaram || 3|| nagarajapalanam bhoginathashayinam nagavairigaminam nagarishatrusudanam
    | nagabhushanarcitam sudarshanadyudayudham nagarangirishvaram namami venkateshvaram || 4|| tarahirakshirashara
  devanagari: श्रीवेङ्कटेशपञ्चकस्तोत्रम् श्रीधराधिनायकं श्रितापवर्गदायकं श्रीगिरीशमित्रमम्बुजेक्षणं विचक्षणम्
    । श्रीनिवासमादिदेवमक्षरं परात्परं नागराङ्गिरीश्वरं नमामि वेङ्कटेश्वरम् ॥ १॥ उपेन्द्रमिन्दुशेखरारविन्दजामरेन्द्र
    वृन्दारकादिसेव्यमानपादपङ्कजद्वयम् । चन्द्रसूर्यलोचनं महेन्द्रनीलसन्निभम् नागराङ्गिरीश्वरं नमामि वेङ्कटेश्वरम्
    ॥ २॥ नन्दगोपनन्दनं सनन्दनादिवन्दितं कुन्दकुट्मलाग्रदन्तमिन्दिरामनोहरम् । नन्दकारविन्दशङ्खचक्रशार्ङ्गसाधनं
    नागराङ्गिरीश्वरं नमामि वेङ्कटेश्वरम् ॥ ३॥ नागराजपालनं भोगिनाथशायिनं नागवैरिगामिनं नगारिशत्रुसूदनम्
    । नागभूषणार्चितं सुदर्शनाद्युदायुधं नागराङ्गिरीश्वरं नमामि वेङ्कटेश्वरम् ॥ ४॥ तारहीरक्षीरशार
