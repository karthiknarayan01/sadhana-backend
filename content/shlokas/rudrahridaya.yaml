id: rudrahridaya
category: upanishad
name:
  english: rudrahridaya
  devanagari: रुद्रह्रिदय
content:
  english: rudrahridayopanishat yadbrahma rudrahridayamahavidyaprakashitam | tadbrahmamatravasthanapadavimadhuna
    bhaje || om saha navavatu || saha nau bhunaktu || saha viryam karavavahai || tejasvinavadhitamastu
    ma vidvishavahai || om shantih shantih shantih || harih om || hridayam kundali bhasmarudrakshaganadarshanam
    | tarasaram mahavakyam pancabrahmagnihotrakam || 1|| pranamya shirasa padau shuko vyasamuvaca ha |
    ko devah sarvadeveshu kasmindevashca sarvashah || 2|| kasya shushrushanannityam prita deva bhavanti
    me | tasya tadvacanam shrutva pratyuvaca pita shukam || 3|| sarvadevatmako rudrah sarve devah shivatmakah
    | rudrasya dakshine parshve ravirbrahma trayo'gnayah || 4|| vamaparshve uma devi vishnuh somo'pi te
    trayah | ya uma sa svayam vishnuryo vishnuh sa hi candramah || 5|| ye namasyanti govindam te namasyanti
    shankaram | ye'rcayanti harim bhaktya te'rcayanti vrishadhvajam || 6|| ye dvishanti virupaksham te
    dvishanti janardanam | ye rudram nabhijananti te na jananti keshavam || 7|| rudratpravartate bijam
    bijayonirjanardanah | yo rudrah sa svayam brahma yo brahma sa hutashanah || 8|| brahmavishnumayo rudra
    agnishomatkam jagat | pumlingam sarvamishanam strilingam bhagavatyuma || 9|| umarudratmikah sarvah
    grajah sthavarajangamah | vyaktam sarvamumarupamavyaktam tu maheshvaram || 10|| uma shankarayogo yah
    sa yogo vishnurucyate | yastu tasmai namaskaram kuryadbhaktisamanvitah || 11|| atmanam paramatmanamantaratmanameva
    ca | jnatva trividhamatmanam paramatmanamashrayet || 12|| antaratma bhavedbrahma paramatma maheshvarah
    | sarveshameva bhutanam vishnuratma sanatanah || 13|| asya trailokyavrikshasya bhumau vitapashakhinah
    | agram madhyam tatha mulam vishnubrahmamaheshvarah || 14|| karyam vishnuh kriya brahma karanam tu
    maheshvarah | prayojanartham rudrena murtireka tridha krita || 15|| dharmo rudro jagadvishnuh sarvajnanam
    pitamahah | shrirudra rudra rudreti yastam bruyadvicakshanah || 16|| kirtanatsarvadevasya sarvapapaih
    pramucyate | rudro nara uma nari tasmai tasyai namo namah || 17|| rudro brahma uma vani tasmai tasyai
    namo namah | rudro vishnuruma lakshmistasmai tasyai namo namah || 18|| rudrah surya uma chaya tasmai
    tasyai namo namah | rudrah soma uma tara tasmai tasyai namo namah || 19|| rudro diva uma ratristasmai
    tasyai namo namah | rudro yajna uma vedistasmai tasyai namo namah || 20|| rudro vahniruma svaha tasmai
    tasyai namo namah | rudro veda uma shastam tasmai tasyai namo namah || 21|| rudro vriksha uma valli
    tasmai tasyai namo namah | rudro gandha uma pushpam tasmai tasyai namo namah || 22|| rudro'rtha aksharah
    soma tasmai tasyai namo namah | rudro lingamuma pitham tasmai tasyai namo namah || 23|| sarvadevatmakam
    rudram namaskuryatprithakprithak | ebhirmantrapadaireva namasyamishaparvati || 24|| yatra yatra bhavetsardhamimam
    mantramudirayet | brahmaha jalamadhye tu sarvapapaih pramucyate || 25|| sarvadhishthanamadvandvam
    param brahma sanatanam | saccidanandarupam tadavanmanasagocaram || 26|| tasminsuvidite sarvam vijnatam
    syadidam shuka | tadatmakatvatsarvasya tasmadbhinnam nahi kvacit || 27|| dve vidye veditavye hi para
    caivapara ca te | tatrapara tu vidyaisha rigvedo yajureva ca || 28|| samavedastathatharvavedah shiksha
    munishvara | kalpo vyakaranam caiva niruktam chanda eva ca || 29|| jyotisham ca yatha natmavishaya
    api buddhayah | athaisha parama vidya yayatma paramaksharam || 30|| yattadadreshyamagrahyamagotram
    rupavarjitam | acakshuhshrotramatyartham tadapanipadam tatha || 31|| nityam vibhum sarvagatam susukshmam
    ca tadavyayam | tadbhutayonim pashyanti dhira atmanamatmani || 32|| yah sarvajnah sarvavidyo yasya
    jnanamayam tapah | tasmadatrannarupena jayate jagadavalih || 33|| satyavadbhati tatsarvam rajjusarpavadasthitam
    | tadetadaksharam satyam tadvijnaya vimucyate || 34|| jnanenaiva hi samsaravinasho naiva karmana |
    shrotriyam brahmanishtham svagurum gacchedyathavidhi || 35|| gurustasmai param vidyam dadyadbrahmatmabodhinim
    | guhayam nihitam sakshadaksharam veda cennarah || 36|| chitva'vidyamahagranthim shivam gacchetsanatanam
    | tadetadamritam satyam tadboddhavyam mumukshibhih || 37|| dhanustaram sharo hyatma brahma tallakshyamucyate
    | apramattena veddhavyam sharavattanmayo bhavet || 38|| lakshyam sarvagatam caiva sharah sarvagato
    mukhah | veddha sarvagatashcaiva shivalakshyam na samshayah || 39|| na tatra candrarkavapuh prakashate
    na vanti vatah sakala devatashca | sa esha devah kritabhavabhutah svayam vishuddho virajah prakashate
    || 40|| dvau suparnau sharire'sminjiveshakshyau saha sthitau | tayorjivah phalam bhunkte karmano na
    maheshvarah || 41|| kevalam sakshirupena vina bhogam maheshvarah | prakashate svayam bhedah kalpito
    mayaya tayoh || 42|| ghatakashamathakashau yathakashaprabhedatah | kalpitau paramau jivashivarupena
    kalpitau || 43|| tattvatashca shivah sakshaccijjivashca svatah sada | ciccidakarato bhinna na bhinna
    cittvahanitah || 44|| citashcinna cidakaradbhidyate jadarupatah | bhidyate cejjado bhedashcideka sarvada
    khalu || 45|| tarkatashca pramanacca cidekatvavyavasthiteh | cidekatvaparijnane na shocati na muhyati
    || 46|| advaitam paramanandam shivam yati tu kaivalam || 47|| adhishthanam samastasya jagatah satyacidghanam
    | ahamasmiti nishcitya vitashoko bhavenmunih || 48|| svasharire svayam jyotihsvarupam sarvasakshinam
    | kshinadoshah prapashyanti netare mayayavritah || 49|| evam rupaparijnanam yasyasti parayoginah |
    kutracidgamanam nasti tasya purnasvarupinah || 50|| akashamekam sampurnam kutracinnaiva gacchati |
    tadvatsvatmaparijnani kutracinnaiva gacchati || 51|| sa yo ha vai tatparamam brahma yo veda vai munih
    | brahmaiva bhavati svasthah saccidananda matrikah || 52|| ityupanishat || om saha navavatu || saha
    nau bhunaktu || saha viryam karavavahai || tejasvinavadhitamastu ma vidvishavahai || om shantih shantih
    shantih || iti rudrahridayopanishatsamapta ||
  devanagari: रुद्रहृदयोपनिषत् यद्ब्रह्म रुद्रहृदयमहाविद्याप्रकाशितम् । तद्ब्रह्ममात्रावस्थानपदवीमधुना
    भजे ॥ ॐ सह नाववतु ॥ सह नौ भुनक्तु ॥ सह वीर्यं करवावहै ॥ तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ हरिः ॐ ॥ हृदयं कुण्डली भस्मरुद्राक्षगणदर्शनम् । तारसारं महावाक्यं पञ्चब्रह्माग्निहोत्रकम्
    ॥ १॥ प्रणम्य शिरसा पादौ शुको व्यासमुवाच ह । को देवः सर्वदेवेषु कस्मिन्देवाश्च सर्वशः ॥ २॥ कस्य शुश्रूषणान्नित्यं
    प्रीता देवा भवन्ति मे । तस्य तद्वचनं श्रुत्वा प्रत्युवाच पिता शुकम् ॥ ३॥ सर्वदेवात्मको रुद्रः सर्वे
    देवाः शिवात्मकाः । रुद्रस्य दक्षिणे पार्श्वे रविर्ब्रह्मा त्रयोऽग्नयः ॥ ४॥ वामपार्श्वे उमा देवी विष्णुः
    सोमोऽपि ते त्रयः । या उमा सा स्वयं विष्णुर्यो विष्णुः स हि चन्द्रमाः ॥ ५॥ ये नमस्यन्ति गोविन्दं ते
    नमस्यन्ति शङ्करम् । येऽर्चयन्ति हरिं भक्त्या तेऽर्चयन्ति वृषध्वजम् ॥ ६॥ ये द्विषन्ति विरूपाक्षं ते
    द्विषन्ति जनार्दनम् । ये रुद्रं नाभिजानन्ति ते न जानन्ति केशवम् ॥ ७॥ रुद्रात्प्रवर्तते बीजं बीजयोनिर्जनार्दनः
    । यो रुद्रः स स्वयं ब्रह्मा यो ब्रह्मा स हुताशनः ॥ ८॥ ब्रह्मविष्णुमयो रुद्र अग्नीषोमात्कं जगत् । पुंलिङ्गं
    सर्वमीशानं स्त्रीलिङ्गं भगवत्युमा ॥ ९॥ उमारुद्रात्मिकाः सर्वाः ग्रजाः स्थावरजङ्गमाः । व्यक्तं सर्वमुमारूपमव्यक्तं
    तु महेश्वरम् ॥ १०॥ उमा शङ्करयोगो यः स योगो विष्णुरुच्यते । यस्तु तस्मै नमस्कारं कुर्याद्भक्तिसमन्वितः
    ॥ ११॥ आत्मानं परमात्मानमन्तरात्मानमेव च । ज्ञात्वा त्रिविधमात्मानं परमात्मानमाश्रयेत् ॥ १२॥ अन्तरात्मा
    भवेद्ब्रह्मा परमात्मा महेश्वरः । सर्वेषामेव भूतानां विष्णुरात्मा सनातनः ॥ १३॥ अस्य त्रैलोक्यवृक्षस्य
    भूमौ विटपशाखिनः । अग्रं मध्यं तथा मूलं विष्णुब्रह्ममहेश्वराः ॥ १४॥ कार्यं विष्णुः क्रिया ब्रह्मा कारणं
    तु महेश्वरः । प्रयोजनार्थं रुद्रेण मूर्तिरेका त्रिधा कृता ॥ १५॥ धर्मो रुद्रो जगद्विष्णुः सर्वज्ञानं
    पितामहः । श्रीरुद्र रुद्र रुद्रेति यस्तं ब्रूयाद्विचक्षणः ॥ १६॥ कीर्तनात्सर्वदेवस्य सर्वपापैः प्रमुच्यते
    । रुद्रो नर उमा नारी तस्मै तस्यै नमो नमः ॥ १७॥ रुद्रो ब्रह्मा उमा वाणी तस्मै तस्यै नमो नमः । रुद्रो
    विष्णुरुमा लक्ष्मीस्तस्मै तस्यै नमो नमः ॥ १८॥ रुद्रः सूर्य उमा छाया तस्मै तस्यै नमो नमः । रुद्रः सोम
    उमा तारा तस्मै तस्यै नमो नमः ॥ १९॥ रुद्रो दिवा उमा रात्रिस्तस्मै तस्यै नमो नमः । रुद्रो यज्ञ उमा वेदिस्तस्मै
    तस्यै नमो नमः ॥ २०॥ रुद्रो वह्निरुमा स्वाहा तस्मै तस्यै नमो नमः । रुद्रो वेद उमा शास्तं तस्मै तस्यै
    नमो नमः ॥ २१॥ रुद्रो वृक्ष उमा वल्ली तस्मै तस्यै नमो नमः । रुद्रो गन्ध उमा पुष्पं तस्मै तस्यै नमो
    नमः ॥ २२॥ रुद्रोऽर्थ अक्षरः सोमा तस्मै तस्यै नमो नमः । रुद्रो लिङ्गमुमा पीठं तस्मै तस्यै नमो नमः ॥
    २३॥ सर्वदेवात्मकं रुद्रं नमस्कुर्यात्पृथक्पृथक् । एभिर्मन्त्रपदैरेव नमस्यामीशपार्वती ॥ २४॥ यत्र यत्र
    भवेत्सार्धमिमं मन्त्रमुदीरयेत् । ब्रह्महा जलमध्ये तु सर्वपापैः प्रमुच्यते ॥ २५॥ सर्वाधिष्ठानमद्वन्द्वं
    परं ब्रह्म सनातनम् । सच्चिदानन्दरूपं तदवाङ्मनसगोचरम् ॥ २६॥ तस्मिन्सुविदिते सर्वं विज्ञातं स्यादिदं
    शुक । तदात्मकत्वात्सर्वस्य तस्माद्भिन्नं नहि क्वचित् ॥ २७॥ द्वे विद्ये वेदितव्ये हि परा चैवापरा च
    ते । तत्रापरा तु विद्यैषा ऋग्वेदो यजुरेव च ॥ २८॥ सामवेदस्तथाथर्ववेदः शिक्षा मुनीश्वर । कल्पो व्याकरणं
    चैव निरुक्तं छन्द एव च ॥ २९॥ ज्योतिषं च यथा नात्मविषया अपि बुद्धयः । अथैषा परमा विद्या ययात्मा परमाक्षरम्
    ॥ ३०॥ यत्तदद्रेश्यमग्राह्यमगोत्रं रूपवर्जितम् । अचक्षुःश्रोत्रमत्यर्थं तदपाणिपदं तथा ॥ ३१॥ नित्यं
    विभुं सर्वगतं सुसूक्ष्मं च तदव्ययम् । तद्भूतयोनिं पश्यन्ति धीरा आत्मानमात्मनि ॥ ३२॥ यः सर्वज्ञः सर्वविद्यो
    यस्य ज्ञानमयं तपः । तस्मादत्रान्नरूपेण जायते जगदावलिः ॥ ३३॥ सत्यवद्भाति तत्सर्वं रज्जुसर्पवदास्थितम्
    । तदेतदक्षरं सत्यं तद्विज्ञाय विमुच्यते ॥ ३४॥ ज्ञानेनैव हि संसारविनाशो नैव कर्मणा । श्रोत्रियं ब्रह्मनिष्ठं
    स्वगुरुं गच्छेद्यथाविधि ॥ ३५॥ गुरुस्तस्मै परां विद्यां दद्याद्ब्रह्मात्मबोधिनीम् । गुहायां निहितं
    साक्षादक्षरं वेद चेन्नरः ॥ ३६॥ छित्वाऽविद्यामहाग्रन्थिं शिवं गच्छेत्सनातनम् । तदेतदमृतं सत्यं तद्बोद्धव्यं
    मुमुक्षिभिः ॥ ३७॥ धनुस्तारं शरो ह्यात्मा ब्रह्म तल्लक्ष्यमुच्यते । अप्रमत्तेन वेद्धव्यं शरवत्तन्मयो
    भवेत् ॥ ३८॥ लक्ष्यं सर्वगतं चैव शरः सर्वगतो मुखः । वेद्धा सर्वगतश्चैव शिवलक्ष्यं न संशयः ॥ ३९॥ न तत्र
    चन्द्रार्कवपुः प्रकाशते न वान्ति वाताः सकला देवताश्च । स एष देवः कृतभावभूतः स्वयं विशुद्धो विरजः प्रकाशते
    ॥ ४०॥ द्वौ सुपर्णौ शरीरेऽस्मिञ्जीवेशाक्ष्यौ सह स्थितौ । तयोर्जीवः फलं भुङ्क्ते कर्मणो न महेश्वरः ॥
    ४१॥ केवलं साक्षिरूपेण विना भोगं महेश्वरः । प्रकाशते स्वयं भेदः कल्पितो मायया तयोः ॥ ४२॥ घटाकाशमठाकाशौ
    यथाकाशप्रभेदतः । कल्पितौ परमौ जीवशिवरूपेण कल्पितौ ॥ ४३॥ तत्त्वतश्च शिवः साक्षाच्चिज्जीवश्च स्वतः सदा
    । चिच्चिदाकारतो भिन्ना न भिन्ना चित्त्वहानितः ॥ ४४॥ चितश्चिन्न चिदाकारद्भिद्यते जडरूपतः । भिद्यते
    चेज्जडो भेदश्चिदेका सर्वदा खलु ॥ ४५॥ तर्कतश्च प्रमाणाच्च चिदेकत्वव्यवस्थितेः । चिदेकत्वपरिज्ञाने न
    शोचति न मुह्यति ॥ ४६॥ अद्वैतं परमानन्दं शिवं याति तु कैवलम् ॥ ४७॥ अधिष्ठानं समस्तस्य जगतः सत्यचिद्घनम्
    । अहमस्मीति निश्चित्य वीतशोको भवेन्मुनिः ॥ ४८॥ स्वशरीरे स्वयं ज्योतिःस्वरूपं सर्वसाक्षिणम् । क्षीणदोषाः
    प्रपश्यन्ति नेतरे माययावृताः ॥ ४९॥ एवं रूपपरिज्ञानं यस्यास्ति परयोगिनः । कुत्रचिद्गमनं नास्ति तस्य
    पूर्णस्वरूपिणः ॥ ५०॥ आकाशमेकं सम्पूर्णं कुत्रचिन्नैव गच्छति । तद्वत्स्वात्मपरिज्ञानी कुत्रचिन्नैव
    गच्छति ॥ ५१॥ स यो ह वै तत्परमं ब्रह्म यो वेद वै मुनिः । ब्रह्मैव भवति स्वस्थः सच्चिदानन्द मातृकः ॥
    ५२॥ इत्युपनिषत् ॥ ॐ सह नाववतु ॥ सह नौ भुनक्तु ॥ सह वीर्यं करवावहै ॥ तेजस्विनावधीतमस्तु मा विद्विषावहै
    ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ इति रुद्रहृदयोपनिषत्समाप्ता ॥
