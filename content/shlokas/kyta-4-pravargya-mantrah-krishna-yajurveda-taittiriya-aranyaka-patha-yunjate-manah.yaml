id: kyta-4-pravargya-mantrah-krishna-yajurveda-taittiriya-aranyaka-patha-yunjate-manah
category: stotram
name:
  english: KYTA 4 Pravargya Mantrah - Krishna Yajurveda Taittiriya Aranyaka Patha - Yunjate Manah
content:
  english: krishna yajurvediya taittiriya aranyake caturthah prapathakah pravargya mantrah o shri gurubhyo
    namah | harih om || anuvakam namo vace ya codita ya canudita tasyai vace namo namo vace namo vacaspataye
    nama rishibhyo mantrakridbhyo mantrapatibhyo ma mamrishayo mantrakrito mantrapatayah paradurma nmantrakrito
    mantrapati va~camudyasagm shivamadasta shsharma prithivi sharma vishvamida njagat | sharma candrashca
    suryashca sharma brahmaprajapati || bhutam va~dishye tejo vadishye yasho vadishye tapo vadishye brahma
    vadishye satyam va~dishye tasma ahamida mme prajayai pashuna mpranapanau mrityorma pata mpranapanau
    ma ma hasishta mmadhu manishye madhu janishye madhu vakshyami madhu vadishyami madhumati ndevebhyo
    vacamudyasagm shushrushenya mma deva avantu shobhayai pitaro 'numadantu || om shanti yunjate mana
    uta yunjate dhiyah | vipra viprasya brihato vipashcitah | vi hotra dadhe vayunavideka it | mahi devasya
    savituh parishtutih || devasya tva savituh prasave | ashvino bhyamadade || abhrirasi narirasi | addhvarakri
    ddevebhyah | uttishtha brahmanaspate || || devayantastvemahe | upa prayantu marutah sudanavah | indra
    prashurbhava saca || praitu brahmanaspatih | pra devyetu sunrita | accha virannarya mpanktiradhasam
    | deva yajnannayantu nah || devi dyavaprithivi anu me magmsatham | riddhyasamadya | makhasya shirah
    || || makhaya tva | makhasya tva shir shne || iyatyagra asih | riddhyasamadya | makhasya shirah |
    makhaya tva | makhasya tva shir rvamrirasya bhutasya prathamaja ritavarih || riddhyasamadya | makhasya
    shirah || || makhaya tva | makhasya tva shir shne || indrasyaujo 'si | riddhyasamadya | makhasya shirah
    | makhaya tva | makhasya tva shir shne || agnija asi prajapate retah | riddhyasamadya | makhasya shirah
    || || makhaya tva | makhasya tva shir ndhehi | mano dhehi vaca ndhehi mayi dhehi || madhu tva madhula
    karotu | makhasya shiro || yajnasya pade sthah | gayatrena tva chandasa karomi | traishtubhena tva
    chandasa karomi | jagatena tva chandasa karomi || makhasya rasna 'si | aditiste bilangrihnatu | panktena
    chandasa | suryasya harasa shraya | makho riddhyasamadya makhasya shirah iyati devirindrasyaujo 'syagnija
    asyayurdhehi prana vrishno ashvasya nishpadasi | varunastva dhritavrata adhupayatu | mitravarunayor
    dhruvena dharmana || arcishe tva | jyotishe tva | tapase tva || abhima m | mitro babhuva saprathah
    | uta shravasa prithivim || shanidhritah | shravo devasya sanasim | dyumnancitrashravastamam || siddhyai
    tva | devastva savitodvapatu | supani ssvangurih | subahuruta shaktya || apadyamanah prithivyam |
    asha disha a prina | uttishtha briha || urdhvastishtha dhruvastvam || suryasya tva cakshusha tva |
    sukshityai tva bhutyai tva || idamahamamumamushyayanam rbrahmavarcasena paryuhami | gayatrena tva
    chandasa ''cchrinadmi | traishtubhena tva chandasa ''cchrinadmi | jagatena tva chandasa ''cchrinadmi
    | chrinattu tva vak | chrinattu tvork | chrinattu tva havih | chrindhi vaca m | chrindhi havih ||
    deva purashcara saghyasantva || npravargyena pracarishyamah | hota rgharmamabhishtuhi | agnidrauhinau
    purodashavadhishraya | pratiprasthatarvihara | prastota ssamani gaya || yajuryuktagm samabhiraktakhantva
    | vishvai mmarudbhih | dakshinabhih pratata mparayishnum | stubho vahantu sumanasyamanam | sa no rucandhehyahriniyamanah
    | bhurbhuvassuvah | omindravantah pracarata || ahriniyamano dve ca npracarishyamah | hota rgharmamabhishtuhi
    || yamaya tva makhaya tva | suryasya harase tva || pranaya svaha vyanaya svaha 'panaya svaha | cakshushe
    svaha shrotraya svaha | manase svaha vace sarasvatyai svaha | dakshaya svaha kratave svaha | ojase
    svaha balaya svaha || devastva savita maddhva ntapasastrayasva | arcirasi shocirasi jyotirasi tapo
    'si | sagmsidasva mahagm asi | shocasva devavitamah | vi dhumamagne arusha mmiyeddhya | srija prashasta
    dar shatam || anjanti ya mprathayanto na viprah | vapavantannagnina tapantah | piturna putra upasi
    preshthah | a gharmo agnimritayannasadit || || anadhrishya purasta t | agneradhipatye | ayurme dah
    | putravati dakshinatah | indrasyadhipatye | praja mme dah | sushada pashcat | devasya savituradhipatye
    | prana mme dah | ashrutiruttaratah || || mitravarunayoradhipatye | shrotra mme dah | vidhritiruparishtat
    | brihaspateradhipatye | brahma me dah mme dah | tejo me dha varco me dhah | yasho me dha stapo me
    dhah | mano me dhah || manorashva 'si bhuriputra | vishva bhyo ma nashtrabhyah pahi || || supasada
    me bhuya ma ma higmsih || tapo shvagne antaragm amitran | tapashagmsamararushah parasya | tapa vaso
    cikitano acittan | vi te tishthantamajara ayasah || citah stha paricitah | svaha marudbhih parishrayasva
    | ma asi | prama asi | pratima asi || || samma asi | vima asi | unma asi | antarikshasyantardhirasi
    || divantapasastrayasva | abhi ryadato na unam | apyayaya harivo vardhamanah | yada stotribhyo mahi
    gotra rujasi | bhuyishthabhajo adha te syama || shukrante anya dyajatante anyat || || vishurupe ahani
    dyaurivasi | vishva hi maya avasi svadhavah | bhadra te pushanniha ratirastu || ar shi sayakani dhanva
    | ar mabbhuvam | na va ojiyo rudra tvadasti || gayatramasi | traishtubhamasi | jagatamasi | madhu
    madhu madhu || dasha pracirdasha bhasi dakshina | dasha praticirdasha bhasyudicih | dashordhva bhasi
    sumanasyamanah | sa no rucandhehyahriniyamanah || agnishtva vasubhih purasta drocayatu gayatrena chandasa
    | sa ma rucito rocaya || indrastva rudrai rdakshinato rocayatu traishtubhena chandasa | sa ma rucito
    rocaya | varunastva drocayatu jagatena chandasa | sa ma rucito rocaya || || dyutanastva maruto marudbhiruttarato
    rocayatvanushtubhena chandasa | sa ma rucito rocaya | brihaspatistva vishvai drocayatu panktena chandasa
    | sa ma rucito rocaya || rocitastva ndeva gharma deveshvasi | rocishiyaha mmanushyeshu || samra d
    gharma rucitastvam eveshvayushmag stejasvi brahmavarcasyasi | rucito stejasvi brahmavarcasi bhuyasam
    || rugasi | ruca || mayi ruk || dasha purasta drocase | dasha dakshina | dasha pratyamm | dashodann
    | dashordhvo bhasi sumanasyamanah | sa nah samradishamurja ndhehi | vaji vajine pavasva | rocito gharmo
    ruciya || apashyangopamanipadyamanam | a ca para ca pathibhishcarantam | sa saddhrici ssa vishucirvasanah
    | a varivarti bhuvaneshvantah || atra pravih | madhu maddhvi mmadhu madhucibhyam | anu va ndevavitaye
    || samagniragnina gata | sa ndevena savitra | sagm suryena rocate || || svaha samagnistapasa gata
    | sa ndevena savitra | sagm suryenarocishta || dharta divo vibhasi rajasah | prithivya dharta | urorantarikshasya
    dharta | dharta devo devana m | amartyastapojah || hride tva manase tva | dive tva suryaya tva ||
    maddhvarankridhi | divi deveshu hotra yaccha || vishvasa mpate | vishvasya bhuvanaspate | vishvasya
    manasaspate | vishvasya vacasaspate | vishvasya tapasaspate | vishvasya brahmanaspate | devashrustvandeva
    gharma deva va~camasme niyaccha devayuva m || pita matinam || patih prajana m || matih kavinam ||
    sandevo devena savitra 'yatishta | sagm suryenarukta || ayurdastvamasmabhya ngharma varcoda asi ||
    pita no 'si pita no bodha || ayurdhastanudhah payodhah | varcoda varivoda dravinodah || || antarikshapra
    urorvariyan | ashimahi tva ma ma higmsih || tvamagne grihapati rvishamasi | vishvasa mpurbhiryavishtha
    pahyagmhasah | sameddharagm shatagm himah ndravinagm hardivanam | ihaiva ratayah santu || tvashtimati
    te sapeya | sureta reto dadhana | viram vi~deya tava sandrishi | ma 'hagm rayasposhena vi yosham ||
    devasya tva savituh prasave | ashvino bhyama dade || adityai rasna 'si | ida ehi | adita ehi | sarasvatyehi
    | asavehi | asavehi | asavehi || || aditya ushnishamasi | vayurasyaidah | pusha tvopavasrijatu | ashvibhya
    mpra dapaya | yaste stanah shashayo yo mayobhuh | yena vishva pushyasi varyani | yo ratnadha vasuvidya
    ssudatrah | sarasvati tamiha dhatave 'kah || usra gharmagm shigmsha | usra gharma || gharmaya shigmsha
    | brihaspatistvopasidatu | danava sstha peravah | vishvagvrito lohitena | ashvibhya mpinvasva | sarasvatyai
    pinvasva | pushne pinvasva | brihaspataye pinvasva | indraya pinvasva | indraya pinvasva || 'si |
    jagatamasi | sahorjo bhagenopa mehi | indra mpata vasavo yajata vat | svaha tva suryasya rashmaye
    vrishtivanaye juhomi | madhu havirasi | suryasya tapastapa | dyavaprithivibhya ntva parigrihnami ||
    || antarikshena tvopayacchami | devana ntva pitrinamanumato bhartugm shakeyam | tejo 'nuprehi | divisprimma
    ma higmsih | antarikshasprimma ma higmsih | prithivisprimma ma higmsih | suvarasi suvarme yaccha |
    divam ya~ccha divo ma pahi || samudraya tva vataya svaha | salilaya tva vataya svaha | anadhrishyaya
    tva vataya svaha | apratidhrishyaya tva vataya svaha tva vataya svaha | duvasvate tva vataya svaha
    | shimidvate tva vataya svaha tva vasumate svaha | somaya tva rudravate svaha ''dityavate svaha ||
    brihaspataye tva vishvade | savitre tvarbhumate vibhumate prabhumate vajavate svaha 'ngirasvate pitrimate
    svaha || vishva asha dakshinasat | vishva ndevanayadiha | svahakritasya gharmasya | madhoh pibatamashvina
    | svaha 'gnaye yajniyaya | sham ya~jurbhih || ashvina gharma mpatagm hardivanam || rutibhih | anu
    va ndyavaprithivi magmsatam | svahendraya || svahendravat | gharmamapatamashvina hardivanam | aha
    rdivabhirutibhih | anu va ndyavaprithivi amagmsatam | ta ya~tha vat | namo dive | namah prithivyai
    || ya~jnam | yajnamima | divangaccha | antarikshangaccha | prithivingaccha | panca pradisho gaccha
    | deva adityavate svaha ishe pipihi | urje pipihi | brahmane pipihi | kshatraya pipihi | adbhyah pipihi
    | oshadhibhyah pipihi | vanaspatibhyah pipihi | dyavaprithivibhya mpipihi | subhutaya pipihi | brahmavarcasaya
    pipihi || || yajamanaya pipihi | mahyanjyaishthyaya pipihi || tvishyai tva | dyumnaya tva | indriyaya
    tva bhutyai nyasme | brahmani dharaya | kshatrani dharaya | vishandharaya | nettva vatah skandaya
    || amushya tva prane sadayami | amuna saha nirarthangaccha | yo ndveshti | yanca vaya ndvishmah ||
    pushne sharase svaha | dyavaprithivibhyag svaha | pitribhyo gharmapebhya || rudraya rudraho rjyotih
    ketuna jushatam | sujyoti rjyotishag svaha | ratrirjyotih ketuna jushatam | sujyoti rjyotishag svaha
    'hno ratriyai ma pahi | esha te agne samit | taya samiddhyasva | ayurme dah | varcasa ma 'njih | apiparo
    ma ratriya ahno ma pahi || || esha te agne samit | taya samiddhyasva | ayurme dah | varcasa ma | hutagm
    havih | madhu havih | indratame 'si ma ma higmsih | ashyama te devagharma | madhumato vajavatah pitumatah
    | angirasvata ssvadhavinah | ashimahi tva ma ma higmsih || svaha tva suryasya rashmibhyah | svaha
    tva nakshatrebhyah || brahmavarcasaya pipihi gharma ya te divi shuk | ya gayatre chandasi | ya bra
    hmane | ya havirdhane | tanta etenavayaje svaha 'ntarikshe shuk | ya traishtubhe chandasi | ya rajanye
    ddhre | tanta etenavayaje svaha || gharma ya te prithivyagm shuk | ya jagate chandasi | ya vaishye
    | ya sadasi | tanta etenavayaje svaha || agnishca havyavahano bhavata ndashushe mayah || anvidanumate
    tva mmanyasai shancanah kridhi | kratve dakshaya no hinu prana ayugmshi tarishah || divastva paraspayah
    | antarikshasya tanuvah pahi | prithivyastva dharmana || || vayamanukramama suvitaya navyase || brahmanastva
    paraspayah | kshatrasya tanuvah pahi | vishastva dharmana | vayamanukramama suvitaya navyase || pranasya
    tva paraspayai | cakshushastanuvah pahi | shrotrasya tva dharmana | vayamanukramama suvitaya navyase
    || valgurasi sham rjanadhayah || shanca vakshi pari ca vakshi | catuh sraktirnabhir ritasya | sado
    vishvayu | apa dvesho apa hvarah | anyadvratasya sashcima | gharmaita tpurisham | tena vardhasva ca
    ca pyayasva | vardhishimahi ca vayam | a ca pyasishimahi || rnamasi divyo gandharvah | tasya te padvaddhavirdhana
    m | agniraddhyakshah | rudro 'dhipatih || samahamayusha | sa mpayasa | sangaupatyena | sagm rayasposhena
    || ndveshti | yanca vaya ndvishmah || acikradadvrisha harih | maha shatah | sagm suryena rocate ||
    cidasi samudrayonih | indu rdakshah shyena ritava shshakuno bhuranyuh | mahan || namaste astu ma ma
    higmsih || vishvavasugm soma gandharvam | apo dadrishushih | tadritena vyayann | tadanvavai t | indro
    rarahana asam | pari suryasya paridhigm rapashyat || vishvavasurabhi tanno grinatu | divyo gandharvo
    rajaso vimanah | yadva gha satyamuta yanna vidma || || dhiyo hinvano dhiya inno avyat || sasnimavindaccarane
    nadina dduro ashmavrajanam | prasa ngandharvo amritani vocat | indro daksha ndeva gharma devo devanupagah
    | idamaha mmanushyo manushyan | somapithanu mehi | saha prajaya saha rayasposhena || sumitra na apa
    oshadhaya || durmitrastasmai bhuyasuh | yo ndveshti | yanca vaya ndvishmah || udvaya ntamasaspari
    pashyanto jyotiruttaram | deva ndevatra suryamaganma jyotiruttamam || udu tya va~hanti ketavah | drishe
    vishvaya surya ncakshu rmitrasya varunasya 'gneh || imamu shu tyamasmabhyagm sanim | gayatrannaviyagmsam
    | agne deveshu pravocah || ddhre tanta etenavayaje svaha ndevatra | jyotirbha asi vanaspatinamoshadhinagm
    rasah | vajina ndyauh prithivim | askanrishabho yuva gah | skannema vishva bhuvana | skanno yajnah
    prajanayatu || askanajani prajani | a skannajjayate vrisha dvidyudapatat | tanta etenava yaje svaha
    | ya dakshinatah | ya pashcat | yottaratah | yoparishta dvidyudapatat | tanta etenava yaje svaha vyanaya
    svaha 'panaya svaha | cakshushe svaha shrotraya svaha | manase svaha vace sarasvatyai svaha pushne
    svaha pushne sharase svaha | pushne prapatthyaya svaha pushne narandhishaya svaha 'nghrinaye svaha
    pushne narunaya svaha | pushne saketaya svaha dbhanurnarta bibharti | bhara mprithivi na bhuma | pra
    shukraitu devi manisha | asma thsutashto ratho na vaji | arcanta eke mahi sama manvata | tena suryamadharayann
    | tena suryamarocayann | gharma shshirastadayamagnih | purishamasi sampriya mprajaya pashubhirbhuvat
    | prajapatistva sadayatu | taya devataya 'ngirasva yaste agna ardra yonayo yah kulayinih | ye te agna
    indavo ya u nabhayah | yaste agne tanuva urjo nama | tabhistvamubhayibhi vi~danah | prajabhiragne
    dravineha sida | prajapatistva sadayatu | taya devataya agnirasi vaishvanaro 'si | idavathsaro 'si
    | tasya te vasanta shshirah | grishmo dakshinah pakshah | varshah puccha m | sharaduttarah pakshah
    | hemanto maddhya m | purvapakshashcitayah | aparapakshah purisham | ahoratranishtakah | tasya te
    masa shcardhamasashca kalpantam | ritavaste kalpantam | sam va~thsaraste kalpatam | ahoratrani te
    kalpantam | eti preti viti samityuditi | prajapatistva sadayatu | taya devataya bhurbhuvassuvah |
    urdhva u shuna utaye | urdhvo nah pahyagmhasah || vidhundadranagm samane bahunam | yuvanagm santa
    mpalito jagara | devasya pashya kavya 'dya mamara | sa hya ssamana || yadrite cidabhishrishah | pura
    jartribhya atridah | sandhata sandhi mmaghava purovasuh || || nishkarta vihruta mpunah || punarurja
    ni vartasva punaragna isha ''yusha | punarnah pahi vishvatah || saha rayya ni vartasvagne pinvasva
    dharaya | vishvaphsniya vishvataspari || ma no gharma vyathito vivyatho nah | ma nah paramadharamma
    rajo | ma rudriyaso abhigurvridhanah || ma nah kratubhir hiditebhirasman | dvisha sunite ma paradah
    | ma no rudro nir | ma dyavaprithivi hidishatam || || upa no mitravarunavihavatam | anvadi ddhyathamiha
    nah sakhaya | adityana hetih | ugra shatapa shtha gha visha parino vrinaktu || ima mme varuna shrudhi
    havamadya ca mridaya | tvamavasyura cake || tattva yami brahmana vandamana ste yajamano havirbhih
    | ahedamano varuneha boddhyurushagmsa ma na ayuh pramoshih || tva nno agne varunasya vidva 'va yasi
    sishthah | yajishtho vahni tama shshoshucano vishva dveshagmsi pramumugdhyasmat || sa tvanno ange
    'vamo bhavoti nedishtho asya ushaso vyushtau | ava yakshva no varunagm rarano vihi mridikagm suhavo
    na edhi || tvamagne aya 'si | aya sanmanasa hitah | aya sanahavyamuhishe | aya no dhehi bheshajam
    | ishto agnirahutah | svahakritah pipartu nah | svaga devebhya ida ntamasaspari pashyanto jyotiruttaram
    | deva ndevatra suryamaganma jyotiruttamam || udu tya va~hanti ketavah | drishe vishvaya surya ncakshu
    rmitrasya varunasya 'gneh || vayah suparna upasedurindra m | priyamedha rishayo nadhamanah | apa dhvantamu
    rnuhi purdhi cakshuh | mumugdhyasma nnidhayeva baddhan || hidishatagm suparnah bhurbhuvassuvah | mayi
    tyadindriya mmahat | mayi daksho mayi kratuh | mayi dhayi suvirya m | trishuggharmo vibhatu me | aku
    tya manasa saha | viraja jyotisha saha | yajnena payasa saha | brahmana tejasa saha | kshatrena yashasa
    saha | satyena tapasa saha | tasya dohamashimahi | tasya sumnamashimahi | tasya bhakshamashimahi |
    tasya ta indrena pitasya madhumatah | upahutasyopahuto bhakshayami || yaste agne ghorastanuvah | kshucca
    trishna ca | asnukcanahutishca | ashanaya ca pipasa ca | sedishcamatishca | etaste agne ghorastanuvah
    | tabhiramungaccha | yo ndveshti | yanca vaya snikca snihitishca snihitishca | ushna ca shita ca |
    ugra ca bhima ca | sadamni sediranira | etaste agne ghorastanuvah | tabhiramungaccha | yo ndveshti
    | yanca vaya dhunishca dhvantashca dhvanashca dhvanayaggshca | nilimpashca vilimpashca vikshipah ||
    ugrashca dhunishca dhvantashca dhvanashca dhvanayaggshca | sahasahvag shca sahamanashca sahasvag shca
    | etya pretya vikshipah || ahoratre tvodirayatam | ardhamasastvodi stva shrapayantu | ritavastva pacantu
    | sam va~thsarastva hantvasau || djahi | chindhi bhindhi handhi kat | iti vacah krurani || thspashayasva
    | svapantamindra pashumantamiccha | vajrenamu 'sya prahara bhojanebhyah || agne agnina sam va~dasva
    | mrityo mrityuna sam va~dasva | namaste astu bhagavah || sakritte agne namah | dviste namah | triste
    namah | catuste namah | pancakritvaste namah | dashakritvaste namah | shatakritvaste namah | asahasrakritvaste
    namah | aparimitakritvaste namah | namaste astu ma ma higmsih || triste namah sapta ca nmukho rudhirenavyaktah
    | yamasya duta dvidhavasi | griddhrah suparnah kunapannishevase | yamasya dutah prahito bhavasya cobhayoh
    dvrikaso bhutva | vag de vyabhirayasi | dvishanta mmrityo mrityave naya | sa artya yadishito yadi
    va svakami | bhayedako vadati vacametam | tamindragni brahmana sam vi~danau | shivamasmabhya hanu
    | ma sma dakshinato vadah | yadi dakshinato vada itthaduluka apaptat | hiranyaksho ayomukhah | rakshasanduta
    agatah | tamito nashayagne || dbhutanyanvavishya | daivim va~dasi | dvishato nah paravada | ta nmrityo
    mrityave naya | ta artya ''rtimarcchantu | agnina prasarya sakthyau patasi | savyamakshi nipepi ca
    | meha kasyacanamamat || atrina tva krime hanmi | kanvena jamadagnina | vishvavaso rbrahmana hatah
    | kriminagm raja kshudrah | atho krishna atho shvetah | atho ashatika hatah | shvetabhih saha sarve
    hatah || aharavadya | shritasya havisho yatha ya~masya jambhayoh | adadhami tatha hi tat | khanphanmrasi
    || brahmana tva shapami | brahmanastva shapathena shapami | ghorena tva bhrigunancakshusha prekshe
    | raudrena tvangirasa mmanasa dhyayami | aghasya tva dharaya viddhyami | adharo ma uttuda shimijavari
    | talpeje talpa uttuda | girigm ranu praveshaya | maricirupa sannuda | yavaditah purastadudayati suryah
