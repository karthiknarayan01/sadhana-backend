id: gita-govindam-chapter-7-nagara-narayana
category: stotram
name:
  english: Gita Govindam Chapter 7 - Nagara Narayana
content:
  english: '|| saptamah sargah || || nagaranarayanah || atrantare ca kulatakulavartmapata sanjatapataka
    iva sphutalanchanashrih | vrindavanantaramadipayadamshujalai rdiksundarivadanacandanabindurinduh ||
    || prasarati shashadharabimbe vihitavilambe ca madhave vidhura | viracitavividhavilapam sa paritapam
    cakaroccaih || || kathitasamaye''pi harirahaha na yayau vanam | mama viphalamidamamalarupamapi yauvanam
    || yami he kamiha sharanam sakhijanavacanavancita || || yadanugamanaya nishi gahanamapi shilitam |
    tena mama hridayamidamasamasharakilitam || || mama maranameva varamativitathaketana | kimiha vishahami
    virahanalacetana || || mamahaha vidhurayati madhuramadhuyamini | kapi harimanubhavati kritasukritakamini
    || || ahaha kalayami valayadimanibhushanam | harivirahadahanavahanena bahudushanam || || kusumasukumaratanumatanusharalilaya
    | sragapi hridi hanti mamativishamashilaya || || ahamiha nivasami naganitavanavetasa | smarati madhusudano
    mamapi na cetasa || || haricaranasharanajayadevakavibharati | vasatu hridi yuvatiriva komalakalavati
    || || tatkim kamapi kaminimabhisritah kim va kalakelibhi rbaddho bandhubhirandhakarini vanopante kimu
    bhramyati | kantah klantamana managapi pathi prasthatumevakshamah sanketikritamanjuvanjulalatakunje''pi
    yannagatah || || athagatam madhavamantarena sakhimiyam vikshya vishadamukam | vishankmana ramitam
    kayapi janardanam drishtavadetadaha || || smarasamarocitaviracitavesha | galitakusumadaravilulitakesha
    || kapi madhuripuna vilasati yuvatiradhikaguna || || hariparirambhanavalitavikara | kucakalashopari
    taralitahara || || vicaladalakalalitananacandra | tadadharapanarabhasakritatandra || || cancalakundaladalitakapola
    | mukharitarasanajaghanagalitalola || || dayitavilokitalajjitahasita | bahuvidhakujitaratirasarasita
    || || vipulapulakaprithuvepathubhanga | shvasitanimilitavikasadananga || || shramajalakanabharasubhagasharira
    | paripatitorasi ratiranadhira || || shrijayadevabhanitahariramitam | kalikalusham janayatu parishamitam
    || || virahapandumurarimukhambuja dyutiriyam tirayannapi cetanam | vidhurativa tanoti manobhuvah sahridaye
    hridaye madanavyatham || || samuditamadane ramanivadane cumbanavalitadhare | mrigamadatilakam likhati
    sapulakam mrigamiva rajanikare || ramate yamunapulinavane vijayi murariradhuna || || ghanacayarucire
    racayati cikure taralitatarunanane | kurabakakusumam capalasushamam ratipatimrigakanane || || ghatayati
    sughane kucayugagagane mrigamadarucirushite | manisaramamalam tarakapatalam nakhapadashashibhushite
    || || jitabisashakale mridubhujayugale karatalanalinidale | marakatavalayam madhukaranicayam vitarati
    himashitale || || ratigrihajaghane vipulapaghane manasijakanakasane | manimayarasanam toranahasanam
    vikirati kritavasane || || caranakisalaye kamalanilaye nakhamaniganapujite | bahirapavaranam yavakabharanam
    janayati hridi yojite || || ramayati sadrisham kamapi subhrisham khalahaladharasodare | kimaphalamavasam
    ciramiha virasam vada sakhi vitapodare || || iha rasabhanane kritaharigunane madhuripupadasevake |
    kaliyugacaritam na vasatu duritam kavinripajayadevake || || nayatah sakhi nirdayo yadi shathastvam
    duti kim duyase svacchandam bahuvallabhah sa ramate kim tatra te dushanam | pashyadya priyasamgamaya
    dayitasyakrishyamanam ganai rutkanthartibharadiva sphutadidam cetah svayam yasyati || || anilataralakuvalayanayanena
    | tapati na sa kisalayashayanena || sakhi ya ramita vanamalina || || vikasitasarasijalalitamukhena
    | sphutati na sa manasijavishikhena || || amritamadhuramridutaravacanena | jvalati na sa malayajapavanena
    || || sthalajalaruharucikaracaranena | luthati na sa himakarakiranena || || sajalajaladasamudayarucirena
    | dalati na sa hridi ciravirahena || || kanakanikasharucishucivasanena | shvasati na sa parijanahasanena
    || || sakalabhuvanajanavaratarunena | vahati na sa rujamatikarunena || || shrijayadevabhanitavacanena
    | pravishatu harirapi hridayamanena || || manobhavanandana candananila prasida re dakshina munca vamatam
    | kshanam jagatprana vidhaya madhavam puro mama pranaharo bhavishyasi || || ripuriva sakhisamvaso''yam
    shikhiva himanilo vishamiva sudharashmiryasmindunoti manogate | hridayamadaye tasminnevam punarvalate
    balat kuvalayadrisham vamah kamo nikamanirankushah || || badham vidhehi malayanila pancabana pranangrihana
    na griham punarashrayishye | kim te kritantabhagini kshamaya tarangai rangani sinca mama shamyatu
    dehadahah || || pratarnilanicolamacyutamurassamvitapitambaram radhayashkitam vilokya hasati svairam
    sakhimandale | vridacancalamancalam nayanayoradhaya radhanane svadusmeramukho''yamastu jagadanandaya
    nandatmajah|| kasmimshcana pathantare idam padyam vidyate || iti gitagovinde vipralabdhavarnane naganarayano
    nama saptamah sargah ||'
  devanagari: ॥ सप्तमः सर्गः ॥ ॥ नागरनारायणः ॥ अत्रान्तरे च कुलटाकुलवर्त्मपात सञ्जातपातक इव स्फुटलाञ्छनश्रीः
    । वृन्दावनान्तरमदीपयदंशुजालै र्दिक्सुन्दरीवदनचन्दनबिन्दुरिन्दुः ॥ ॥ प्रसरति शशधरबिम्बे विहितविलम्बे
    च माधवे विधुरा । विरचितविविधविलापं सा परितापं चकारोच्चैः ॥ ॥ कथितसमयेऽपि हरिरहह न ययौ वनम् । मम विफलमिदममलरूपमपि
    यौवनम् ॥ यामि हे कमिह शरणं सखीजनवचनवञ्चिता ॥ ॥ यदनुगमनाय निशि गहनमपि शीलितम् । तेन मम हृदयमिदमसमशरकीलितम्
    ॥ ॥ मम मरणमेव वरमतिवितथकेतना । किमिह विषहामि विरहानलचेतना ॥ ॥ मामहह विधुरयति मधुरमधुयामिनी । कापि
    हरिमनुभवति कृतसुकृतकामिनी ॥ ॥ अहह कलयामि वलयादिमणीभूषणम् । हरिविरहदहनवहनेन बहुदूषणम् ॥ ॥ कुसुमसुकुमारतनुमतनुशरलीलया
    । स्रगपि हृदि हन्ति मामतिविषमशीलया ॥ ॥ अहमिह निवसामि नगणितवनवेतसा । स्मरति मधुसूदनो मामपि न चेतसा
    ॥ ॥ हरिचरणशरणजयदेवकविभारती । वसतु हृदि युवतिरिव कोमलकलावती ॥ ॥ तत्किं कामपि कामिनीमभिसृतः किं वा कलाकेलिभि
    र्बद्धो बन्धुभिरन्धकारिणि वनोपान्ते किमु भ्राम्यति । कान्तः क्लान्तमना मनागपि पथि प्रस्थातुमेवाक्षमः
    सङ्केतीकृतमञ्जुवञ्जुललताकुञ्जेऽपि यन्नागतः ॥ ॥ अथागतां माधवमन्तरेण सखीमियं वीक्ष्य विषादमूकाम् । विशङ्क्माना
    रमितं कयापि जनार्दनं दृष्टवदेतदाह ॥ ॥ स्मरसमरोचितविरचितवेशा । गलितकुसुमदरविलुलितकेशा ॥ कापि मधुरिपुणा
    विलसति युवतिरधिकगुणा ॥ ॥ हरिपरिरम्भणवलितविकारा । कुचकलशोपरि तरलितहारा ॥ ॥ विचलदलकललिताननचन्द्रा ।
    तदधरपानरभसकृततन्द्रा ॥ ॥ चञ्चलकुण्डलदलितकपोला । मुखरितरसनजघनगलितलोला ॥ ॥ दयितविलोकितलज्जितहसिता ।
    बहुविधकूजितरतिरसरसिता ॥ ॥ विपुलपुलकपृथुवेपथुभङ्गा । श्वसितनिमीलितविकसदनङ्गा ॥ ॥ श्रमजलकणभरसुभगशरीरा
    । परिपतितोरसि रतिरणधीरा ॥ ॥ श्रीजयदेवभणितहरिरमितम् । कलिकलुषं जनयतु परिशमितम् ॥ ॥ विरहपाण्डुमुरारिमुखाम्बुज
    द्युतिरियं तिरयन्नपि चेतनाम् । विधुरतीव तनोति मनोभुवः सहृदये हृदये मदनव्यथाम् ॥ ॥ समुदितमदने रमणीवदने
    चुम्बनवलिताधरे । मृगमदतिलकं लिखति सपुलकं मृगमिव रजनीकरे ॥ रमते यमुनापुलिनवने विजयी मुरारिरधुना ॥ ॥
    घनचयरुचिरे रचयति चिकुरे तरलिततरुणानने । कुरबककुसुमं चपलासुषमं रतिपतिमृगकानने ॥ ॥ घटयति सुघने कुचयुगगगने
    मृगमदरुचिरूषिते । मणिसरममलं तारकपटलं नखपदशशिभूषिते ॥ ॥ जितबिसशकले मृदुभुजयुगले करतलनलिनीदले । मरकतवलयं
    मधुकरनिचयं वितरति हिमशीतले ॥ ॥ रतिगृहजघने विपुलापघने मनसिजकनकासने । मणिमयरसनं तोरणहसनं विकिरति कृतवासने
    ॥ ॥ चरणकिसलये कमलानिलये नखमणिगणपूजिते । बहिरपवरणं यावकभरणं जनयति हृदि योजिते ॥ ॥ रमयति सदृशं कामपि
    सुभृशं खलहलधरसोदरे । किमफलमवसं चिरमिह विरसं वद सखि विटपोदरे ॥ ॥ इह रसभणने कृतहरिगुणने मधुरिपुपदसेवके
    । कलियुगचरितं न वसतु दुरितं कविनृपजयदेवके ॥ ॥ नायातः सखि निर्दयो यदि शठस्त्वं दूति किं दूयसे स्वच्छन्दं
    बहुवल्लभः स रमते किं तत्र ते दूषणम् । पश्याद्य प्रियसम्गमाय दयितस्याकृष्यमाणं गणै रुत्कण्ठार्तिभरादिव
    स्फुटदिदं चेतः स्वयं यास्यति ॥ ॥ अनिलतरलकुवलयनयनेन । तपति न सा किसलयशयनेन ॥ सखि या रमिता वनमालिना
    ॥ ॥ विकसितसरसिजललितमुखेन । स्फुटति न सा मनसिजविशिखेन ॥ ॥ अमृतमधुरमृदुतरवचनेन । ज्वलति न सा मलयजपवनेन
    ॥ ॥ स्थलजलरुहरुचिकरचरणेन । लुठति न सा हिमकरकिरणेन ॥ ॥ सजलजलदसमुदयरुचिरेण । दलति न सा हृदि चिरविरहेण
    ॥ ॥ कनकनिकषरुचिशुचिवसनेन । श्वसति न सा परिजनहसनेन ॥ ॥ सकलभुवनजनवरतरुणेन । वहति न सा रुजमतिकरुणेन ॥
    ॥ श्रीजयदेवभणितवचनेन । प्रविशतु हरिरपि हृदयमनेन ॥ ॥ मनोभवानन्दन चन्दनानिल प्रसीद रे दक्षिण मुञ्च वामताम्
    । क्षणं जगत्प्राण विधाय माधवं पुरो मम प्राणहरो भविष्यसि ॥ ॥ रिपुरिव सखीसंवासोऽयं शिखीव हिमानिलो विषमिव
    सुधारश्मिर्यस्मिन्दुनोति मनोगते । हृदयमदये तस्मिन्नेवं पुनर्वलते बलात् कुवलयदृशां वामः कामो निकामनिरङ्कुशः
    ॥ ॥ बाधां विधेहि मलयानिल पञ्चबाण प्राणान्गृहाण न गृहं पुनराश्रयिष्ये । किं ते कृतान्तभगिनि क्षमया
    तरङ्गै रङ्गानि सिञ्च मम शाम्यतु देहदाहः ॥ ॥ प्रातर्नीलनिचोलमच्युतमुरस्संवीतपीताम्बरम् रधायाश्कितं
    विलोक्य हसति स्वैरं सखीमण्डले । व्रीडाचञ्चलमञ्चलं नयनयोराधाय राधानने स्वादुस्मेरमुखोऽयमस्तु जगदानन्दाय
    नन्दात्मजः॥ कस्मिंश्चन पाठान्तरे इदं पद्यं विद्यते ॥ इति गीतगोविन्दे विप्रलब्धावर्णने नागनारायणो नाम
    सप्तमः सर्गः ॥
