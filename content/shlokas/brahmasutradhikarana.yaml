id: brahmasutradhikarana
category: sutra
name:
  english: brahmasutradhikarana
  devanagari: ब्रह्मसूत्राधिकरण
content:
  english: 420 adhikarana 101 sarvavedantapratyayadhikaranam || sutra 360 sarvavedantapratyayam codanadyavisheshat
    | 361 bhedanneti cennaikasyamapi | 362 svadhyayasya tathatvena hi samacare'dhikaracca savavacca tanniyamah
    | 363 darshayati ca || adhikarana 102 upasamharadhikaranam |sutra 364 upasamharo'rthabhedadvidhisheshavat
    samane ca || adhikarana 103 anyathatvadhikaranam || sutra 365 anyathatvam shabdaditi cennavisheshat
    | 366 na va prakaranabhedat parovariyastvadivat | 367 samjnatashcettaduktamasti tu tadapi || adhikarana
    104 vyaptyadhikaranam || sutra 368 vyapteshca samanjasam || adhikarana 105 sarvabhedadhikaranam ||
    sutra 369 sarvabhedadanyatreme || adhikarana 106 anandadyadhikaranam || sutra 370 anandadayah pradhanasya
    | 371 priyashirastvadyapraptirupacayapacayau hi bhede | 372 itare tvarthasamanyat || adhikarana 107
    adhyanadhikaranam |sutra 373 adhyanaya prayojanabhavat 374 atmashabdacca || adhikarana 108 atmagrihityadhikaranam
    || sutra 375 atmagrihitiritaravaduttarat | 376 anvayaditi cetsyadavadharanat || adhikarana 109 karyakhyanadhikaranam
    || sutra 377 karyakhyanadapurvam || adhikarana 110 samanadhikaranam || sutra 378 samana evam cabhedat
    || adhikarana 111 sambandhadhikaranam || sutra 379 sambandhadevamanyatrapi | 380 na va visheshat |
    381 darshayati ca || adhikarana 112 sambhrityadhikaranam || sutra 382 sambhritidyuvyaptyapi catah
    || adhikarana 113 purushavidyadhikaranam || sutra 383 purushavidyayamiva cetareshamanamnanat || adhikarana
    114 vedhadyadhikaranam || sutra 384 vedhadyarthabhedat | adhikarana 115 hanyadhikaranam || sutra 385
    hanau tupayanashabdasheshatvat kushacchandastutyupaganavattaduktam || adhikarana 116 samparayadhikaranam
    || sutra 386 samparaye tartavyabhavattatha hyanye | 387 chandata ubhayavirodhat || adhikarana 117
    gaterarthavattvadhikaranam || sutra 388 gaterarthavattvamubhayatha'nyatha hi virodhah | 389 upapannastallakshanarthopalabdherlokavat
    || adhikarana 118 aniyamadhikaranam || sutra 390 aniyamah sarvasamavirodhah shabdanumanabhyam || adhikarana
    119 yavadadhikaradhikaranam || sutra 391 yavadadhikaramavasthitiradhikarikanam || adhikarana 120 aksharadhiyadhikaranam
    || sutra 392 aksharadhiyam tvavarodhah samanyatadbhavabhyamaupasadavattaduktam || adhikarana 121 iyadadhikaranam
    || sutra 393 iyadamananat || adhikarana 122 antaratvadhikaranam || sutra 394 antara bhutagramavatsvatmanah
    | 395 anyatha bhedanupapattiriti cennopadeshantaravat || adhikarana 123 vyatiharadhikaranam || sutra
    396 vyatiharo vishimshanti hitaravat || adhikarana 124 satyadyadhikaranam || sutra 397 saiva hi satyadayah
    || adhikarana 125 kamadyadhikaranam || sutra 398 kamaditaratra tatra cayatanadibhyah || adhikarana
    126 adaradhikaranam || sutra 399 adaradalopah | 400 upasthite'stadvacanat || adhikarana 127 tannirdharanadhikaranam
    || sutra 401 tannirdharananiyamastaddrishteh prithagdhyapratibandhah phalam || adhikarana 128 pradanadhikaranam
    || sutra 402 pradanavadeva taduktam || adhikarana 129 lingabhuyastvadhikaranam || sutra 403 lingabhuyastvat
    taddhi baliyastadapi | 404 purvavikalpah prakaranat syat kriyamanasavat | 405 atideshacca | 406 vidyaiva
    tu nirdharanat | 407 darshanacca | 408 shrutyadibaliyastvacca na badhah | 409 anubandhadibhyah prajnantaraprithaktvavaddrishtashca
    taduktam | 410 na samanyadapyupalabdhermrityuvanna hi lokapattih | 411 parena ca shabdasya tadvidhyam
    bhuyastvattvanubandhah || adhikarana 130 aikatmyadhikaranam || sutra 412 eka atmanah sharire bhavat
    | 413 vyatirekastadbhavabhavitvanna tupalabdhivat || adhikarana 131 angavabaddhadhikaranam || sutra
    414 angavabaddhastu na shakhasu hi prativedam | 415 mantradivadva'virodhah || adhikarana 132 bhumajyayastvadhikaranam
    || sutra 416 bhumnah kratuvajjyayastvam tatha ca darshayati || adhikarana 133 shabdadibhedadhikaranam
    || sutra 417 nana shabdadibhedat || adhikarana 134 vikalpadhikaranam || sutra 418 vikalpo'vishishtaphalatvat
    || adhikarana 135 kamyadhikaranam || sutra 419 kamyastu yathakamam samucciyeranna va purvahetvabhavat
    || adhikarana 136 yathashrayabhavadhikaranam || sutra 420 angeshu yathashrayabhavah | 421 shishteshca
    | 422 samaharat | 423 gunasadharanyashruteshca | 424 na va tatsahabhavashruteh | 425 darshanacca ||
    adhyaya 3 pada 4 adhikarana 137
  devanagari: ४२० अधिकरण १०१ सर्ववेदान्तप्रत्ययाधिकरणम् ॥ सूत्र ३६० सर्ववेदान्तप्रत्ययं चोदनाद्यविशेषात्
    । ३६१ भेदान्नेति चेन्नैकस्यामपि । ३६२ स्वाध्यायस्य तथात्वेन हि समाचारेऽधिकाराच्च सववच्च तन्नियमः ।
    ३६३ दर्शयति च ॥ अधिकरण १०२ उपसंहाराधिकरणम् ।सूत्र ३६४ उपसंहारोऽर्थाभेदाद्विधिशेषवत् समाने च ॥ अधिकरण
    १०३ अन्यथात्वाधिकरणम् ॥ सूत्र ३६५ अन्यथात्वं शब्दादिति चेन्नाविशेषात् । ३६६ न वा प्रकरणभेदात् परोवरीयस्त्वादिवत्
    । ३६७ संज्ञातश्चेत्तदुक्तमस्ति तु तदपि ॥ अधिकरण १०४ व्याप्त्यधिकरणम् ॥ सूत्र ३६८ व्याप्तेश्च समञ्जसम्
    ॥ अधिकरण १०५ सर्वभेदाधिकरणम् ॥ सूत्र ३६९ सर्वाभेदादन्यत्रेमे ॥ अधिकरण १०६ आनन्दाद्यधिकरणम् ॥ सूत्र
    ३७० आनन्दादयः प्रधानस्य । ३७१ प्रियशिरस्त्वाद्यप्राप्तिरुपचयापचयौ हि भेदे । ३७२ इतरे त्वर्थसामान्यात्
    ॥ अधिकरण १०७ आध्यानाधिकरणम् ।सूत्र ३७३ आध्यानाय प्रयोजनाभावात् ३७४ आत्मशब्दाच्च ॥ अधिकरण १०८ आत्मगृहित्यधिकरणम्
    ॥ सूत्र ३७५ आत्मगृहीतिरितरवदुत्तरात् । ३७६ अन्वयादिति चेत्स्यादवधारणात् ॥ अधिकरण १०९ कार्याख्यानाधिकरणम्
    ॥ सूत्र ३७७ कार्याख्यानादपूर्वम् ॥ अधिकरण ११० समानाधिकरणम् ॥ सूत्र ३७८ समान एवं चाभेदात् ॥ अधिकरण
    १११ सम्बन्धाधिकरणम् ॥ सूत्र ३७९ सम्बन्धादेवमन्यत्रापि । ३८० न वा विशेषात् । ३८१ दर्शयति च ॥ अधिकरण
    ११२ सम्भृत्यधिकरणम् ॥ सूत्र ३८२ सम्भृतिद्युव्याप्त्यपि चातः ॥ अधिकरण ११३ पुरुषविद्याधिकरणम् ॥ सूत्र
    ३८३ पुरुषविद्यायामिव चेतरेषामनाम्नानात् ॥ अधिकरण ११४ वेधाद्यधिकरणम् ॥ सूत्र ३८४ वेधाद्यर्थभेदात् ।
    अधिकरण ११५ हान्यधिकरणम् ॥ सूत्र ३८५ हानौ तूपायनशब्दशेषत्वात् कुशाच्छन्दस्तुत्युपगानवत्तदुक्तम् ॥ अधिकरण
    ११६ साम्परायाधिकरणम् ॥ सूत्र ३८६ साम्पराये तर्तव्याभावात्तथा ह्यन्ये । ३८७ छन्दत उभयाविरोधात् ॥ अधिकरण
    ११७ गतेरर्थवत्त्वाधिकरणम् ॥ सूत्र ३८८ गतेरर्थवत्त्वमुभयथाऽन्यथा हि विरोधः । ३८९ उपपन्नस्तल्लक्षणार्थोपलब्धेर्लोकवत्
    ॥ अधिकरण ११८ अनियमाधिकरणम् ॥ सूत्र ३९० अनियमः सर्वासामविरोधः शब्दानुमानाभ्याम् ॥ अधिकरण ११९ यावदधिकाराधिकरणम्
    ॥ सूत्र ३९१ यावदधिकारमवस्थितिराधिकारिकाणाम् ॥ अधिकरण १२० अक्षरधियाधिकरणम् ॥ सूत्र ३९२ अक्षरधियां त्ववरोधः
    सामान्यतद्भावाभ्यामौपसदवत्तदुक्तम् ॥ अधिकरण १२१ इयदधिकरणम् ॥ सूत्र ३९३ इयदामननात् ॥ अधिकरण १२२ अन्तरत्वाधिकरणम्
    ॥ सूत्र ३९४ अन्तरा भूतग्रामवत्स्वात्मनः । ३९५ अन्यथा भेदानुपपत्तिरिति चेन्नोपदेशान्तरवत् ॥ अधिकरण
    १२३ व्यतिहाराधिकरणम् ॥ सूत्र ३९६ व्यतिहारो विशिंषन्ति हीतरवत् ॥ अधिकरण १२४ सत्याद्यधिकरणम् ॥ सूत्र
    ३९७ सैव हि सत्यादयः ॥ अधिकरण १२५ कामाद्यधिकरणम् ॥ सूत्र ३९८ कामादीतरत्र तत्र चायतनादिभ्यः ॥ अधिकरण
    १२६ आदराधिकरणम् ॥ सूत्र ३९९ आदरादलोपः । ४०० उपस्थितेऽस्तद्वचनात् ॥ अधिकरण १२७ तन्निर्धारणाधिकरणम्
    ॥ सूत्र ४०१ तन्निर्धारणानियमस्तद्दृष्टेः पृथग्ध्यप्रतिबन्धः फलम् ॥ अधिकरण १२८ प्रदानाधिकरणम् ॥ सूत्र
    ४०२ प्रदानवदेव तदुक्तम् ॥ अधिकरण १२९ लिङ्गभुयस्त्वाधिकरणम् ॥ सूत्र ४०३ लिङ्गभूयस्त्वात् तद्धि बलीयस्तदपि
    । ४०४ पूर्वविकल्पः प्रकरणात् स्यात् क्रियामानसवत् । ४०५ अतिदेशाच्च । ४०६ विद्यैव तु निर्धारणात् ।
    ४०७ दर्शनाच्च । ४०८ श्रुत्यादिबलीयस्त्वाच्च न बाधः । ४०९ अनुबन्धादिभ्यः प्रज्ञान्तरपृथक्त्ववद्दृष्टश्च
    तदुक्तम् । ४१० न सामान्यादप्युपलब्धेर्मृत्युवन्न हि लोकापत्तिः । ४११ परेण च शब्दस्य ताद्विध्यं भूयस्त्वात्त्वनुबन्धः
    ॥ अधिकरण १३० ऐकात्म्याधिकरणम् ॥ सूत्र ४१२ एक आत्मनः शरीरे भावात् । ४१३ व्यतिरेकस्तद्भावाभावित्वान्न
    तूपलब्धिवत् ॥ अधिकरण १३१ अङ्गावबद्धाधिकरणम् ॥ सूत्र ४१४ अङ्गावबद्धास्तु न शाखासु हि प्रतिवेदम् । ४१५
    मन्त्रादिवद्वाऽविरोधः ॥ अधिकरण १३२ भूमज्ययस्त्वाधिकरणम् ॥ सूत्र ४१६ भूम्नः क्रतुवज्ज्यायस्त्वं तथा
    च दर्शयति ॥ अधिकरण १३३ शब्दादिभेदाधिकरणम् ॥ सूत्र ४१७ नाना शब्दादिभेदात् ॥ अधिकरण १३४ विकल्पाधिकरणम्
    ॥ सूत्र ४१८ विकल्पोऽविशिष्टफलत्वात् ॥ अधिकरण १३५ काम्याधिकरणम् ॥ सूत्र ४१९ काम्यास्तु यथाकामं समुच्चीयेरन्न
    वा पूर्वहेत्वभावात् ॥ अधिकरण १३६ यथाश्रयभावाधिकरणम् ॥ सूत्र ४२० अङ्गेषु यथाश्रयभावः । ४२१ शिष्टेश्च
    । ४२२ समाहारात् । ४२३ गुणसाधारण्यश्रुतेश्च । ४२४ न वा तत्सहभावाश्रुतेः । ४२५ दर्शनाच्च ॥ अध्याय ३
    पाद ४ अधिकरण १३७
