content:
  english: ekashlokinavagrahastotram 2 brahma muraristripurantakari bhanuh shashi bhumisuto budhashca
    | gurashca shukrah shani
  devanagari: एकश्लोकीनवग्रहस्तोत्रम् २ ब्रह्मा मुरारिस्त्रिपुरान्तकारी भानुः शशी भूमिसुतो बुधश्च । गुरश्च
    शुक्रः शनि
