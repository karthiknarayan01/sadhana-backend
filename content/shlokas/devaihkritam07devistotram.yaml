id: devaihkritam07devistotram
category: stotram
name:
  english: devaihkritam07devistotram
  devanagari: देवैःकृतं०७देवीस्तोत्रम्
content:
  english: ktatha ko'pi vedadidevasvarupe | tvamevasi sarveshu shaktisvarupa prajasrishtisamharakale sadaiva
    || 26|| smritistvam dhritistvam tvamevasi buddhirjara pushtitushti dhritih kantishanti | suvidya sulakshmirgatih
    kirtimedhe tvamevasi vishvasya bijam puranam || 27|| yada yaih svarupaih karoshiha karyam suranam
    ca tebhyo namamo'dya shantyai | kshama yoganidra daya tvam vivaksha sthita sarvabhuteshu shastaih
    svarupaih || 28|| kritam karyamadau tvaya yatsuranam hato'sau maharirmadandho hayarih | daya te sada
    sarvadeveshu devi prasiddha puraneshu vedeshu gita || 29|| kimatrasti citram yadamba sutam svam muda
    palayetposhayetsamyageva | yatastvam janitri suranam sahaya kurushvaikacittena karyam samagram ||
    30|| na va te gunanamiyattam svarupam vayam devi janimahe vishvavandye | kripapatramityeva matva tathasman
    bhayebhyah sada pahi patum samarthe || 31|| vina banapatairvina mushtighatairvina shulakhadgairvina
    shaktidandaih | ripunhantumevasi shakta vinoda
  devanagari: क्तथा कोऽपि वेदादिदेवस्वरूपे । त्वमेवासि सर्वेषु शक्तिस्वरूपा प्रजासृष्टिसंहारकाले सदैव
    ॥ २६॥ स्मृतिस्त्वं धृतिस्त्वं त्वमेवासि बुद्धिर्जरा पुष्टितुष्टी धृतिः कान्तिशान्ती । सुविद्या सुलक्ष्मीर्गतिः
    कीर्तिमेधे त्वमेवासि विश्वस्य बीजं पुराणम् ॥ २७॥ यदा यैः स्वरूपैः करोषीह कार्यं सुराणां च तेभ्यो नमामोऽद्य
    शान्त्यै । क्षमा योगनिद्रा दया त्वं विवक्षा स्थिता सर्वभूतेषु शस्तैः स्वरूपैः ॥ २८॥ कृतं कार्यमादौ
    त्वया यत्सुराणां हतोऽसौ महारिर्मदान्धो हयारिः । दया ते सदा सर्वदेवेषु देवि प्रसिद्धा पुराणेषु वेदेषु
    गीता ॥ २९॥ किमत्रास्ति चित्रं यदम्बा सुतं स्वं मुदा पालयेत्पोषयेत्सम्यगेव । यतस्त्वं जनित्री सुराणां
    सहाया कुरुष्वैकचित्तेन कार्यं समग्रम् ॥ ३०॥ न वा ते गुणानामियत्तां स्वरूपं वयं देवि जानीमहे विश्ववन्द्ये
    । कृपापात्रमित्येव मत्वा तथास्मान् भयेभ्यः सदा पाहि पातुं समर्थे ॥ ३१॥ विना बाणपातैर्विना मुष्टिघातैर्विना
    शूलखड्गैर्विना शक्तिदण्डैः । रिपून्हन्तुमेवासि शक्ता विनोदा
meaning: {}
