id: navanaganamastotram
category: stotram
name:
  english: navanaganamastotram
  devanagari: नवनागनामस्तोत्रम्
content:
  english: navanaganamastotram shriganeshaya namah | anantam vasukim shesham padmanabham ca kambalam |
    shankhapalam dhritarashtram takshakam kaliyam tatha || 1|| etani navanamani naganam ca mahatmanam
    | sayankale pathennityam pratahkale visheshatah || 2|| tasya vishabhayam nasti sarvatra vijayi bhavet
    || 3|| || iti shrinavanaganamastotram sampurnam ||
  devanagari: नवनागनामस्तोत्रम् श्रीगणेशाय नमः । अनन्तं वासुकिं शेषं पद्मनाभं च कम्बलम् । शङ्खपालं धृतराष्ट्रं
    तक्षकं कालियं तथा ॥ १॥ एतानि नवनामानि नागानां च महात्मनाम् । सायङ्काले पठेन्नित्यं प्रातःकाले विशेषतः
    ॥ २॥ तस्य विषभयं नास्ति सर्वत्र विजयी भवेत् ॥ ३॥ ॥ इति श्रीनवनागनामस्तोत्रं सम्पूर्णम् ॥
meaning: {}
