id: saptashati
category: sukta
name:
  english: saptashati
  devanagari: सप्तशति
content:
  english: shrijagadambaprityarthe jape viniyogah | om namashcandikayai | markandeya uvaca | om yadguhyam
    paramam loke sarvarakshakaram nrinam | yanna kasyacidakhyatam tanme bruhi pitamaha || 1|| brahmovaca
    | asti guhyatamam vipra sarvabhutopakarakam | devyastu kavacam punyam tacchrinushva mahamune || 2||
    prathamam shailaputriti dvitiyam brahmacarini | tritiyam candraghanteti kushmandeti caturthakam ||
    3|| pancamam skandamateti shashtham katyayani tatha | saptamam kalaratrishca mahagauriti cashtamam
    || 4|| navamam siddhidatri ca navadurgah prakirtitah | uktanyetani namani brahmanaiva mahatmana ||
    5|| agnina dahyamanastu shatrumadhyagata rane | vishame durgame caiva bhayartah sharanam gatah ||
    6| na tesham jayate kincidashubham ranasankate | apadam na ca pashyanti shokaduhkhabhayankarim ||
    7|| yaistu bhaktya smrita nityam tesham vriddhih prajayate | ye tvam smaranti deveshi rakshasi tanna
    samshayah || 8|| pretasamstha tu camunda varahi mahishasana | aindri gajasamarudha vaishnavi garudasana
    || 9|| narasimhi mahavirya shivaduti mahabala | maheshvari vrisharudha kaumari shikhivahana || 10||
    lakshmih padmasana devi padmahasta haripriya | shvetarupadhara devi ishvari vrishavahana || 11|| brahmi
    hamsasamarudha sarvabharanabhushita | ityeta matarah sarvah sarvayogasamanvitah || 12|| nanabharanashobhadhya
    nanaratnopashobhitah | shraishthaishca mauktikaih sarva divyaharapralambibhih || 13|| indranilairmahanilaih
    padmaragaih sushobhanaih | drishyante rathamarudha devyah krodhasamakulah || 14|| shankham cakram
    gadam shaktim halam ca musalayudham | khetakam tomaram caiva parashum pashameva ca || 15|| kuntayudham
    trishulam ca sharngamayudhamuttamam | daityanam dehanashaya bhaktanamabhayaya ca || 16|| dharayantyayudhanittham
    devanam ca hitaya vai | namaste'stu maharaudre mahaghoraparakrame || 17|| mahabale mahotsahe mahabhayavinashini
    | trahi mam devi dushprekshye shatrunam bhayavardhini || 18|| pracyam rakshatu mamaindri agneyyamagnidevata
    | dakshine'vatu varahi nairrityam khadgadharini || 19|| praticyam varuni rakshedvayavyam mrigavahini
    | udicyam patu kauberi ishanyam shuladharini || 20|| urdhvam brahmani me rakshedadhastadvaishnavi
    tatha | evam dasha disho raksheccamunda shavavahana || 21|| jaya mamagratah patu vijaya patu prishthatah
    | ajita vamaparshve tu dakshine caparajita || 22|| shikham me dyotini raksheduma murdhni vyavasthita
    | maladhari lalate ca bhruvau rakshedyashasvini || 23|| netrayoshcitranetra ca yamaghanta tu parshvake
    | trinetra ca trishulena bhruvormadhye ca candika || 24|| shankhini cakshushormadhye shrotrayordvaravasini
    | kapolau kalika rakshet karnamule tu shankari || 25|| nasikayam sugandha ca uttaroshthe ca carcika
    | adhare camritabala jihvayam ca sarasvati || 26|| dantan rakshatu kaumari kanthadeshe tu candika
    | ghantikam citraghanta ca mahamaya ca taluke || 27|| kamakshi cibukam rakshedvacam me sarvamangala
    | grivayam bhadrakali ca prishthavamshe dhanurdhari || 28|| nilagriva bahih kanthe nalikam nalakubari
    | skandhayoh khadgini rakshed bahu me vajradharini || 29|| hastayordandini rakshedambika cangulishu
    ca | nakhanchuleshvari rakshet kukshau rakshennareshvari || 30|| stanau rakshenmahadevi manahshokavinashini
    | hridaye lalita devi udare shuladharini || 31|| nabhau ca kamini rakshed guhyam guhyeshvari tatha
    | medhram rakshatu durgandha payum me guhyavahini || 32|| katyam bhagavati raksheduru me meghavahana
    | janghe mahabala rakshet janu madhavanayika || 33|| gulphayornarasimhi ca padaprishthe tu kaushiki
    | padangulih shridhari ca talam patalavasini || 34|| nakhan damshtrakarali ca keshamshcaivordhvakeshini
    | romakupeshu kaumari tvacam yogishvari tatha || 35|| raktamajjavasamamsanyasthimedamsi parvati |
    antrani kalaratrishca pittam ca mukuteshvari || 36|| padmavati padmakoshe kaphe cudamanistatha | jvalamukhi
    nakhajvalamabhedya sarvasandhishu || 37|| shukram brahmani me rakshecchayam chatreshvari tatha | ahankaram
    mano buddhim rakshenme dharmadharini || 38|| pranapanau tatha vyanamudanam ca samanakam | vajrahasta
    ca me rakshet pranan kalyanashobhana || 39|| rase rupe ca gandhe ca shabde sparshe ca yogini | sattvam
    rajastamashcaiva rakshennarayani sada || 40|| ayu rakshatu varahi dharmam rakshatu parvati | yashah
    kirtim ca lakshmim ca sada rakshatu vaishnavi || 41|| gotramindrani me rakshet pashun rakshecca candika
    | putran rakshenmahalakshmirbharyam rakshatu bhairavi || 42|| dhaneshvari dhanam rakshet kaumari kanyakam
    tatha | panthanam supatha rakshenmargam kshemankari tatha || 43|| rajadvare mahalakshmirvijaya satata
    sthita | rakshahinam tu yat sthanam varjitam kavacena tu || 44|| tatsarvam raksha me devi jayanti
    papanashini | sarvarakshakaram punyam kavacam sarvada japet || 45|| idam rahasyam viprarshe bhaktya
    tava mayoditam | padamekam na gacchet tu yadicchecchubhamatmanah || 46|| kavacenavrito nityam yatra
    yatraiva gacchati | tatra tatrarthalabhashva vijayah sarvakalikah || 47|| yam yam cintayate kamam
    tam tam prapnoti nishcitam | paramaishvaryamatulam prapsyate bhutale puman || 48|| nirbhayo jayate
    martyah sangrameshvaparajitah | trailokye tu bhavetpujyah kavacenavritah puman || 49|| idam tu devyah
    kavacam devanamapi durlabham | yah pathetprayato nityam trisandhyam shraddhayanvitah || 50|| daivikala
    bhavettasya trailokye caparajitah | jivedvarshashatam sagramapamrityuvivarjitah || 51|| nashyanti
    vyadhayah sarve lutavisphotakadayah | sthavaram jangamam caiva kritrimam caiva yadvisham || 52|| abhicarani
    sarvani mantrayantrani bhutale | bhucarah khecarashcaiva kulajashcaupadeshikah || 53|| sahaja kulaja
    mala dakini shakini tatha | antarikshacara ghora dakinyashca maharavah || 54|| grahabhutapishacashca
    yakshagandharvarakshasah | brahmarakshasavetalah kushmanda bhairavadayah || 55|| nashyanti darshanattasya
    kavacenavrito hi yah | manonnatirbhavedrajnastejovriddhih para bhavet || 56|| yashovriddhirbhavet
    pumsam kirtivriddhishca jayate | tasmat japet sada bhaktah kavacam kamadam mune || 57|| japet saptashatim
    candim kritva tu kavacam pura | nirvighnena bhavet siddhishcandijapasamudbhava || 58|| yavadbhumandalam
    dhatte sashailavanakananam | tavattishthati medinyam santatih putrapautriki || 59|| dehante paramam
    sthanam surairapi sudurlabham | prapnoti purusho nityam mahamayaprasadatah || 60|| tatra gacchati
    gatvasau punashcagamanam nahi | labhate paramam sthanam shivena samatam vrajet || 61|| || iti shrimarkandeyapurane
    hariharabrahmaviracitam devikavacam samaptam || || devi mahatmyam ||
  devanagari: श्रीजगदम्बाप्रीत्यर्थे जपे विनियोगः । ॐ नमश्चण्डिकायै । मार्कण्डेय उवाच । ॐ यद्गुह्यं परमं
    लोके सर्वरक्षाकरं नृणाम् । यन्न कस्यचिदाख्यातं तन्मे ब्रूहि पितामह ॥ १॥ ब्रह्मोवाच । अस्ति गुह्यतमं
    विप्र सर्वभूतोपकारकम् । देव्यास्तु कवचं पुण्यं तच्छृणुष्व महामुने ॥ २॥ प्रथमं शैलपुत्रीति द्वितीयं
    ब्रह्मचारिणी । तृतीयं चन्द्रघण्टेति कूष्माण्डेति चतुर्थकम् ॥ ३॥ पञ्चमं स्कन्दमातेति षष्ठं कात्यायनी
    तथा । सप्तमं कालरात्रिश्च महागौरीति चाष्टमम् ॥ ४॥ नवमं सिद्धिदात्री च नवदुर्गाः प्रकीर्तिताः । उक्तान्येतानि
    नामानि ब्रह्मणैव महात्मना ॥ ५॥ अग्निना दह्यमानास्तु शत्रुमध्यगता रणे । विषमे दुर्गमे चैव भयार्ताः
    शरणं गताः ॥ ६। न तेषां जायते किञ्चिदशुभं रणसङ्कटे । आपदं न च पश्यन्ति शोकदुःखभयङ्करीम् ॥ ७॥ यैस्तु
    भक्त्या स्मृता नित्यं तेषां वृद्धिः प्रजायते । ये त्वां स्मरन्ति देवेशि रक्षसि तान्न संशयः ॥ ८॥ प्रेतसंस्था
    तु चामुण्डा वाराही महिषासना । ऐन्द्री गजसमारूढा वैष्णवी गरुडासना ॥ ९॥ नारसिंही महावीर्या शिवदूती महाबला
    । माहेश्वरी वृषारूढा कौमारी शिखिवाहना ॥ १०॥ लक्ष्मीः पद्मासना देवी पद्महस्ता हरिप्रिया । श्वेतरूपधरा
    देवी ईश्वरी वृषवाहना ॥ ११॥ ब्राह्मी हंससमारूढा सर्वाभरणभूषिता । इत्येता मातरः सर्वाः सर्वयोगसमन्विताः
    ॥ १२॥ नानाभरणशोभाढ्या नानारत्नोपशोभिताः । श्रैष्ठैश्च मौक्तिकैः सर्वा दिव्यहारप्रलम्बिभिः ॥ १३॥ इन्द्रनीलैर्महानीलैः
    पद्मरागैः सुशोभनैः । दृश्यन्ते रथमारूढा देव्यः क्रोधसमाकुलाः ॥ १४॥ शङ्खं चक्रं गदां शक्तिं हलं च मुसलायुधम्
    । खेटकं तोमरं चैव परशुं पाशमेव च ॥ १५॥ कुन्तायुधं त्रिशूलं च शार्ङ्गमायुधमुत्तमम् । दैत्यानां देहनाशाय
    भक्तानामभयाय च ॥ १६॥ धारयन्त्यायुधानीत्थं देवानां च हिताय वै । नमस्तेऽस्तु महारौद्रे महाघोरपराक्रमे
    ॥ १७॥ महाबले महोत्साहे महाभयविनाशिनि । त्राहि मां देवि दुष्प्रेक्ष्ये शत्रूणां भयवर्धिनि ॥ १८॥ प्राच्यां
    रक्षतु मामैन्द्री आग्नेय्यामग्निदेवता । दक्षिणेऽवतु वाराही नैरृत्यां खड्गधारिणी ॥ १९॥ प्रतीच्यां वारुणी
    रक्षेद्वायव्यां मृगवाहिनी । उदीच्यां पातु कौबेरी ईशान्यां शूलधारिणी ॥ २०॥ ऊर्ध्वं ब्रह्माणी मे रक्षेदधस्ताद्वैष्णवी
    तथा । एवं दश दिशो रक्षेच्चामुण्डा शववाहना ॥ २१॥ जया मामग्रतः पातु विजया पातु पृष्ठतः । अजिता वामपार्श्वे
    तु दक्षिणे चापराजिता ॥ २२॥ शिखां मे द्योतिनी रक्षेदुमा मूर्ध्नि व्यवस्थिता । मालाधरी ललाटे च भ्रुवौ
    रक्षेद्यशस्विनी ॥ २३॥ नेत्रयोश्चित्रनेत्रा च यमघण्टा तु पार्श्वके । त्रिनेत्रा च त्रिशूलेन भ्रुवोर्मध्ये
    च चण्डिका ॥ २४॥ शङ्खिनी चक्षुषोर्मध्ये श्रोत्रयोर्द्वारवासिनी । कपोलौ कालिका रक्षेत् कर्णमूले तु शङ्करी
    ॥ २५॥ नासिकायां सुगन्धा च उत्तरोष्ठे च चर्चिका । अधरे चामृताबाला जिह्वायां च सरस्वती ॥ २६॥ दन्तान्
    रक्षतु कौमारी कण्ठदेशे तु चण्डिका । घण्टिकां चित्रघण्टा च महामाया च तालुके ॥ २७॥ कामाक्षी चिबुकं रक्षेद्वाचं
    मे सर्वमङ्गला । ग्रीवायां भद्रकाली च पृष्ठवंशे धनुर्धरी ॥ २८॥ नीलग्रीवा बहिः कण्ठे नलिकां नलकूबरी
    । स्कन्धयोः खड्गिनी रक्षेद् बाहू मे वज्रधारिणी ॥ २९॥ हस्तयोर्दण्डिनी रक्षेदम्बिका चाङ्गुलीषु च । नखाञ्छूलेश्वरी
    रक्षेत् कुक्षौ रक्षेन्नरेश्वरी ॥ ३०॥ स्तनौ रक्षेन्महादेवी मनःशोकविनाशिनी । हृदये ललिता देवी उदरे शूलधारिणी
    ॥ ३१॥ नाभौ च कामिनी रक्षेद् गुह्यं गुह्येश्वरी तथा । मेढ्रं रक्षतु दुर्गन्धा पायुं मे गुह्यवाहिनी
    ॥ ३२॥ कट्यां भगवती रक्षेदूरू मे मेघवाहना । जङ्घे महाबला रक्षेत् जानू माधवनायिका ॥ ३३॥ गुल्फयोर्नारसिंही
    च पादपृष्ठे तु कौशिकी । पादाङ्गुलीः श्रीधरी च तलं पातालवासिनी ॥ ३४॥ नखान् दंष्ट्रकराली च केशांश्चैवोर्ध्वकेशिनी
    । रोमकूपेषु कौमारी त्वचं योगीश्वरी तथा ॥ ३५॥ रक्तमज्जावसामांसान्यस्थिमेदांसि पार्वती । अन्त्राणि कालरात्रिश्च
    पित्तं च मुकुटेश्वरी ॥ ३६॥ पद्मावती पद्मकोशे कफे चूडामणिस्तथा । ज्वालामुखी नखज्वालामभेद्या सर्वसन्धिषु
    ॥ ३७॥ शुक्रं ब्रह्माणी मे रक्षेच्छायां छत्रेश्वरी तथा । अहङ्कारं मनो बुद्धिं रक्षेन्मे धर्मधारिणी
    ॥ ३८॥ प्राणापानौ तथा व्यानमुदानं च समानकम् । वज्रहस्ता च मे रक्षेत् प्राणान् कल्याणशोभना ॥ ३९॥ रसे
    रूपे च गन्धे च शब्दे स्पर्शे च योगिनी । सत्त्वं रजस्तमश्चैव रक्षेन्नारायणी सदा ॥ ४०॥ आयू रक्षतु वाराही
    धर्मं रक्षतु पार्वती । यशः कीर्तिं च लक्ष्मीं च सदा रक्षतु वैष्णवी ॥ ४१॥ गोत्रमिन्द्राणी मे रक्षेत्
    पशून् रक्षेच्च चण्डिका । पुत्रान् रक्षेन्महालक्ष्मीर्भार्यां रक्षतु भैरवी ॥ ४२॥ धनेश्वरी धनं रक्षेत्
    कौमारी कन्यकां तथा । पन्थानं सुपथा रक्षेन्मार्गं क्षेमङ्करी तथा ॥ ४३॥ राजद्वारे महालक्ष्मीर्विजया
    सतत स्थिता । रक्षाहीनं तु यत् स्थानं वर्जितं कवचेन तु ॥ ४४॥ तत्सर्वं रक्ष मे देवि जयन्ती पापनाशिनी
    । सर्वरक्षाकरं पुण्यं कवचं सर्वदा जपेत् ॥ ४५॥ इदं रहस्यं विप्रर्षे भक्त्या तव मयोदितम् । पादमेकं न
    गच्छेत् तु यदीच्छेच्छुभमात्मनः ॥ ४६॥ कवचेनावृतो नित्यं यत्र यत्रैव गच्छति । तत्र तत्रार्थलाभश्व विजयः
    सार्वकालिकः ॥ ४७॥ यं यं चिन्तयते कामं तं तं प्राप्नोति निश्चितम् । परमैश्वर्यमतुलं प्राप्स्यते भूतले
    पुमान् ॥ ४८॥ निर्भयो जायते मर्त्यः सङ्ग्रामेष्वपराजितः । त्रैलोक्ये तु भवेत्पूज्यः कवचेनावृतः पुमान्
    ॥ ४९॥ इदं तु देव्याः कवचं देवानामपि दुर्लभम् । यः पठेत्प्रयतो नित्यं त्रिसन्ध्यं श्रद्धयान्वितः ॥
    ५०॥ दैवीकला भवेत्तस्य त्रैलोक्ये चापराजितः । जीवेद्वर्षशतं साग्रमपमृत्युविवर्जितः ॥ ५१॥ नश्यन्ति व्याधयः
    सर्वे लूताविस्फोटकादयः । स्थावरं जङ्गमं चैव कृत्रिमं चैव यद्विषम् ॥ ५२॥ अभिचाराणि सर्वाणि मन्त्रयन्त्राणि
    भूतले । भूचराः खेचराश्चैव कुलजाश्चौपदेशिकाः ॥ ५३॥ सहजा कुलजा माला डाकिनी शाकिनी तथा । अन्तरिक्षचरा
    घोरा डाकिन्यश्च महारवाः ॥ ५४॥ ग्रहभूतपिशाचाश्च यक्षगन्धर्वराक्षसाः । ब्रह्मराक्षसवेतालाः कूष्माण्डा
    भैरवादयः ॥ ५५॥ नश्यन्ति दर्शनात्तस्य कवचेनावृतो हि यः । मानोन्नतिर्भवेद्राज्ञस्तेजोवृद्धिः परा भवेत्
    ॥ ५६॥ यशोवृद्धिर्भवेत् पुंसां कीर्तिवृद्धिश्च जायते । तस्मात् जपेत् सदा भक्तः कवचं कामदं मुने ॥ ५७॥
    जपेत् सप्तशतीं चण्डीं कृत्वा तु कवचं पुरा । निर्विघ्नेन भवेत् सिद्धिश्चण्डीजपसमुद्भवा ॥ ५८॥ यावद्भूमण्डलं
    धत्ते सशैलवनकाननम् । तावत्तिष्ठति मेदिन्यां सन्ततिः पुत्रपौत्रिकी ॥ ५९॥ देहान्ते परमं स्थानं सुरैरपि
    सुदुर्लभम् । प्राप्नोति पुरुषो नित्यं महामायाप्रसादतः ॥ ६०॥ तत्र गच्छति गत्वासौ पुनश्चागमनं नहि ।
    लभते परमं स्थानं शिवेन समतां व्रजेत् ॥ ६१॥ ॥ इति श्रीमार्कण्डेयपुराणे हरिहरब्रह्मविरचितं देवीकवचं
    समाप्तम् ॥ ॥ देवी माहात्म्यम् ॥
