id: ramamattebhastotram
category: stotram
name:
  english: ramamattebhastotram
  devanagari: राममत्तेभस्तोत्रम्
content:
  english: ramamattebhastotram shrikamuko nikhilanakalayairvipulashokakulairabhinato rekharathangavarashankhancitah
    kapatashakhamrigaih saha suraih | yo gamupetya bahuveganvitah kalitayagat svayam dasharathat shlaghashatairdivishadogharpitaih
    sajalameghakritih samajani || 1|| vaca munestadanu vacalitajyadhanuracamyajivanamishun tucchatmanam
    svatanuducchayasantamasasanchaditantaranisham | ajanapavanasarojayamanapadabhaja kanena rajasah kashtam
    striya jhatiti nishtankitam vidadhadishtam ca yo'dita muneh || 2|| kunthanyashaktishitikanthashugasanamaram
    thatkritam bhanjayan vridasmarasphurananidayitam ca janakredapateratmajam | rudhanuragakamududhamupetya
    pathi mudhashayam pratighaya shonakshamapyatha bhrigunamadhishamaparinavalepamatanot || 3|| tatajya
    tadanu sitanvito bhuvanapata sametya vipinam yatharthyavedimuninatharthato vimatamadhaya pancavatikam
    | godavariviganadanubandhabahumodavahadhivasan krodhadaram vipulayodhadharam vishamamedhadharam kharamahan
    || 4|| nanamukhoktibahumanagatam jhatiti linayusham ca harinam apadya yatuhritabhupatmajavirahatapaturo
    vanabhuvi | shephalikamilitarephadhikarakhyaravarephayitadhikadhritih kshibashayam tadnu cabaghitoshnakarashabarthamindratanayam
    || 5||
  devanagari: राममत्तेभस्तोत्रम् श्रीकामुको निखिलनाकालयैर्विपुलशोकाकुलैरभिनतो रेखारथाङ्गवरशङ्खाञ्चितः
    कपटशाखामृगैः सह सुरैः । यो गामुपेत्य बहुवेगान्वितः कलितयागात् स्वयं दशरथात् श्लाघाशतैर्दिविषदोघार्पितैः
    सजलमेघाकृतिः समजनि ॥ १॥ वाचा मुनेस्तदनु वाचालितज्यधनुराचाम्यजीवनमिषून् तुच्छात्मनां स्वतनुदुच्छायसन्तमससञ्छादितान्तरनिशाम्
    । आजानपावनसरोजायमानपदभाजा कणेन रजसः कष्टं स्त्रिया झटिति निष्टङ्कितं विदधदिष्टं च योऽदित मुनेः ॥ २॥
    कुण्ठान्यशक्तिशितिकण्ठाशुगासनमरं ठात्कृतं भञ्जयन् व्रीडास्मरस्फुरणनीडायितां च जनक्रेडापतेरात्मजाम्
    । रूढानुरागकमुदूढामुपेत्य पथि मूढाशयं प्रतिघया शोणाक्षमप्यथ भृगूणामधीशमपरीणावलेपमतनोत् ॥ ३॥ ताताज्या
    तदनु सीतान्वितो भुवनपाता समेत्य विपिनं यथार्थ्यवेदिमुनिनाथार्थतो विमतमाधाय पञ्चवटिकाम् । गोदावरीविगनादानुबन्धबहुमोदावहाधिवसन्
    क्रोधादरं विपुलयोधाधरं विषममेधाधरं खरमहन् ॥ ४॥ नानामुखोक्तिबहुमानागतं झटिति लीनायुषं च हरिणं आपाद्य
    यातुहृतभूपात्मजाविरहतापातुरो वनभुवि । शेफालिकामिलितरेफाधिकारख्यरवरेफायिताधिकधृतिः क्षीबाशयं तद्नु
    चाबघितोष्णकरशाबार्थमिन्द्रतनयम् ॥ ५॥
