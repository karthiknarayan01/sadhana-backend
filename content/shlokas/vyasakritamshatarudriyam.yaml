id: vyasakritamshatarudriyam
category: stotram
name:
  english: vyasakritamshatarudriyam
  devanagari: व्यासकृतंशतरुद्रीयं
content:
  english: sa vai rudrah sa ca shivah so'gnih sharvah sa sarvavit | sa cendrashcaiva vayushca so'shvinau
    sa ca vidyutah || 1|| sa bhavah sa ca parjanyo mahadevah sa canaghah | sa candramah sa ceshanah sa
    suryo varunashca sah || 2|| sa kalah so'ntako mrityuh sa yamo ratryahani ca | masardhamasa ritavah
    sandhye samvatsarashca sah || 3|| sa ca dhata vidhata ca vishvatma vishvakarmakrit | sarvasam devatanam
    ca dharayatyavapurvapuh || 4|| sarvairdevaih stuto devah saikadha bahudha ca sah | shatadha sahasradha
    caiva tatha shatasahasradha || 5|| idrishah sa mahadevo bhuyashca bhagavanajah | na hi sarve maya
    shakya vaktum bhagavato gunah || 6|| sarvairgrahairgrihitanvai sarvapapasamanvitan | sa mocayati supritah
    sharanyah sharanagatan || 7|| ayurarogyamaishvaryam vittam kamamshca pushkalan | sa dadati manushyebhyah
    sa caivakshipate punah || 8|| sendradishu ca deveshu tasya caishvaryamucyate | sa caiva vyahrite loke
    manushyanam shubhashubhe || 9|| aishvaryaccaiva kamanamishvarah punarucyate | maheshvarashca bhutanam
    mahatamishvarashca sah || 10|| bahubhirbahudha rupairvishvam vyapnoti vai jagat | asya devasya yadvaktram
    samudre tadatishthata || 11|| esha caiva shmashaneshu devo vasati nityashah | yajantyenam janastatra
    virasthana itishvaram || 12|| asya diptani rupani ghorani ca bahuni ca | loke yanyasya kurvanti manushyah
    pravadanti ca || 13|| namadheyani lokeshu bahunyatra yatharthavat | nirucyante mahattvacca vibhutvatkarmabhistatha
    || 14|| vede casya samamnatam shatarudriyamuttamam | namna canantarudreti upasthanam mahatmanah ||
    15|| sa kamanam prabhurdevo ye divya ye ca manushah | sa vibhuh sa prabhurdevo vishvam vyapnuvate
    mahat || 16|| jyeshtham bhutam vadantyenam brahmana munayastatha | prathamo hyesha devanam mukhadasyanalo'bhavat
    || 17|| sarvatha yatpashunpati taishca yadramate punah | teshamadhipatiryacca tasmatpashupatih smritah
    || 18|| nityena brahmacaryena lingamasya yada sthitam | mahayanti ca lokashca maheshvara iti smritah
    || 19|| rishayashcaiva devashca gandharvapsarasastatha | lingamasyarcayanti sma taccapyurdhvam samasthitam
    || 20|| pujyamane tatastasminmodate sa maheshvarah | sukhi pritashca bhavati prahrishtashcaiva shankarah
    || 21|| yadasya bahudha rupam bhutabhavyabhavatsthitam | sthavaram jangamam caiva bahurupastatah smritah
    || 22|| ekaksho jajvalannaste sarvato'kshimayo'pi va | krodhadyashcavishallokamstasmaccharva iti smritah
    || 23|| dhumram rupam ca yattasya dhurjatistena ucyate | vishve devashca yattasminvishvarupastatah
    smritah || 24|| tisro deviryada caiva bhajate bhuvaneshvarah | dyamapah prithivim caiva tryambakashca
    tatah smritah || 25|| samedhayati yannityam sarvarthansarvakarmasu | shivamicchanmanushyanam tasmadesha
    shivah smritah || 26|| sahasraksho'yutaksho va sarvato'kshimayo'pi va | yacca vishvam mahatpati mahadevastatah
    smritah || 27|| dahatyurdhvam sthito yacca pranotpattisthitashca yat | sthitalingashca yannityam tasmatsthanuriti
    smritah || 28|| vishamasthah sharireshu samashca praninamiha | sa vayurvishamastheshu pranapanasharirishu
    || 29|| pujayedvigraham yastu lingam vapi samarcayet | lingam pujayita nityam mahatim shriyamashnute
    || 30|| urubhyamardhamagneyam somardham ca shiva tanuh | atmano'rdham ca tasyagnih somo'rdham punarucyate
    || 31|| taijasi mahati dipta devebhyashca shiva tanuh | bhasvati manusheshvasya tanurghoragnirucyate
    || 32|| brahmacaryam caratyesha shiva yasya tanustaya | yasya ghoratara murtih sarvanatti tayeshvarah
    || 33|| yannirdahati yattikshno yadugro yatpratapavan | mamsashonitamajjado yattato rudra ucyate ||
    34|| esha devo mahadevo yo'sau partha tavagratah | sangrame shatravannighnamstvaya drishtah pinakadhrik
    || 35|| esha vai bhagavandevah sangrame yati te'gratah | yena dattani te'strani yaistvaya danava hatah
    || 36|| dhanyam yashasyamayushyam punyam vedaishca samjnitam | devadevasya te partha vyakhyatam shatarudriyam
    || 37|| sarvarthasadhakam punyam sarvakilbishanashanam | sarvapapaprashamanam sarvaduhkhabhayapaham
    || 38|| caturvidhamidam stotram yah sha
  devanagari: स वै रुद्रः स च शिवः सोऽग्निः शर्वः स सर्ववित् । स चेन्द्रश्चैव वायुश्च सोऽश्विनौ स च विद्युतः
    ॥ १॥ स भवः स च पर्जन्यो महादेवः स चानघः । स चन्द्रमाः स चेशानः स सूर्यो वरुणश्च सः ॥ २॥ स कालः सोऽन्तको
    मृत्युः स यमो रात्र्यहानि च । मासार्धमासा ऋतवः सन्ध्ये संवत्सरश्च सः ॥ ३॥ स च धाता विधाता च विश्वात्मा
    विश्वकर्मकृत् । सर्वासां देवतानां च धारयत्यवपुर्वपुः ॥ ४॥ सर्वैर्देवैः स्तुतो देवः सैकधा बहुधा च सः
    । शतधा सहस्रधा चैव तथा शतसहस्रधा ॥ ५॥ ईदृशः स महादेवो भूयश्च भगवानजः । न हि सर्वे मया शक्या वक्तुं
    भगवतो गुणाः ॥ ६॥ सर्वैर्ग्रहैर्गृहीतान्वै सर्वपापसमन्वितान् । स मोचयति सुप्रीतः शरण्यः शरणागतान् ॥
    ७॥ आयुरारोग्यमैश्वर्यं वित्तं कामांश्च पुष्कलान् । स ददाति मनुष्येभ्यः स चैवाक्षिपते पुनः ॥ ८॥ सेन्द्रादिषु
    च देवेषु तस्य चैश्वर्यमुच्यते । स चैव व्याहृते लोके मनुष्याणां शुभाशुभे ॥ ९॥ ऐश्वर्याच्चैव कामानामीश्वरः
    पुनरुच्यते । महेश्वरश्च भूतानां महतामीश्वरश्च सः ॥ १०॥ बहुभिर्बहुधा रूपैर्विश्वं व्याप्नोति वै जगत्
    । अस्य देवस्य यद्वक्त्रं समुद्रे तदतिष्ठत ॥ ११॥ एष चैव श्मशानेषु देवो वसति नित्यशः । यजन्त्येनं जनास्तत्र
    वीरस्थान इतीश्वरम् ॥ १२॥ अस्य दीप्तानि रूपाणि घोराणि च बहूनि च । लोके यान्यस्य कुर्वन्ति मनुष्याः
    प्रवदन्ति च ॥ १३॥ नामधेयानि लोकेषु बहून्यत्र यथार्थवत् । निरुच्यन्ते महत्त्वाच्च विभुत्वात्कर्मभिस्तथा
    ॥ १४॥ वेदे चास्य समाम्नातं शतरुद्रीयमुत्तमम् । नाम्ना चानन्तरुद्रेति उपस्थानं महात्मनः ॥ १५॥ स कामानां
    प्रभुर्देवो ये दिव्या ये च मानुषाः । स विभुः स प्रभुर्देवो विश्वं व्याप्नुवते महत् ॥ १६॥ ज्येष्ठं
    भूतं वदन्त्येनं ब्राह्मणा मुनयस्तथा । प्रथमो ह्येष देवानां मुखादस्यानलोऽभवत् ॥ १७॥ सर्वथा यत्पशून्पाति
    तैश्च यद्रमते पुनः । तेषामधिपतिर्यच्च तस्मात्पशुपतिः स्मृतः ॥ १८॥ नित्येन ब्रह्मचर्येण लिङ्गमस्य यदा
    स्थितम् । महयन्ति च लोकाश्च महेश्वर इति स्मृतः ॥ १९॥ ऋषयश्चैव देवाश्च गन्धर्वाप्सरसस्तथा । लिङ्गमस्यार्चयन्ति
    स्म तच्चाप्यूर्ध्वं समास्थितम् ॥ २०॥ पूज्यमाने ततस्तस्मिन्मोदते स महेश्वरः । सुखी प्रीतश्च भवति प्रहृष्टश्चैव
    शङ्करः ॥ २१॥ यदस्य बहुधा रूपं भूतभव्यभवत्स्थितम् । स्थावरं जङ्गमं चैव बहुरूपस्ततः स्मृतः ॥ २२॥ एकाक्षो
    जाज्वलन्नास्ते सर्वतोऽक्षिमयोऽपि वा । क्रोधाद्यश्चाविशल्लोकांस्तस्माच्छर्व इति स्मृतः ॥ २३॥ धूम्रं
    रूपं च यत्तस्य धूर्जटिस्तेन उच्यते । विश्वे देवाश्च यत्तस्मिन्विश्वरूपस्ततः स्मृतः ॥ २४॥ तिस्रो देवीर्यदा
    चैव भजते भुवनेश्वरः । द्यामपः पृथिवीं चैव त्र्यम्बकश्च ततः स्मृतः ॥ २५॥ समेधयति यन्नित्यं सर्वार्थान्सर्वकर्मसु
    । शिवमिच्छन्मनुष्याणां तस्मादेष शिवः स्मृतः ॥ २६॥ सहस्राक्षोऽयुताक्षो वा सर्वतोऽक्षिमयोऽपि वा । यच्च
    विश्वं महत्पाति महादेवस्ततः स्मृतः ॥ २७॥ दहत्यूर्ध्वं स्थितो यच्च प्राणोत्पत्तिस्थितश्च यत् । स्थितलिङ्गश्च
    यन्नित्यं तस्मात्स्थाणुरिति स्मृतः ॥ २८॥ विषमस्थः शरीरेषु समश्च प्राणिनामिह । स वायुर्विषमस्थेषु प्राणापानशरीरिषु
    ॥ २९॥ पूजयेद्विग्रहं यस्तु लिङ्गं वापि समर्चयेत् । लिङ्गं पूजयिता नित्यं महतीं श्रियमश्नुते ॥ ३०॥
    ऊरुभ्यामर्धमाग्नेयं सोमार्धं च शिवा तनुः । आत्मनोऽर्धं च तस्याग्निः सोमोऽर्धं पुनरुच्यते ॥ ३१॥ तैजसी
    महती दीप्ता देवेभ्यश्च शिवा तनुः । भास्वती मानुषेष्वस्य तनुर्घोराग्निरुच्यते ॥ ३२॥ ब्रह्मचर्यं चरत्येष
    शिवा यास्य तनुस्तया । यास्य घोरतरा मूर्तिः सर्वानत्ति तयेश्वरः ॥ ३३॥ यन्निर्दहति यत्तीक्ष्णो यदुग्रो
    यत्प्रतापवान् । मांसशोणितमज्जादो यत्ततो रुद्र उच्यते ॥ ३४॥ एष देवो महादेवो योऽसौ पार्थ तवाग्रतः ।
    सङ्ग्रामे शात्रवान्निघ्नंस्त्वया दृष्टः पिनाकधृक् ॥ ३५॥ एष वै भगवान्देवः सङ्ग्रामे याति तेऽग्रतः ।
    येन दत्तानि तेऽस्त्राणि यैस्त्वया दानवा हताः ॥ ३६॥ धन्यं यशस्यमायुष्यं पुण्यं वेदैश्च संज्ञितम् ।
    देवदेवस्य ते पार्थ व्याख्यातं शतरुद्रियम् ॥ ३७॥ सर्वार्थसाधकं पुण्यं सर्वकिल्बिषनाशनम् । सर्वपापप्रशमनं
    सर्वदुःखभयापहम् ॥ ३८॥ चतुर्विधमिदं स्तोत्रं यः श
