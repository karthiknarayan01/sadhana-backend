id: devaihkritam08vishnustotram
category: stotram
name:
  english: devaihkritam08vishnustotram
  devanagari: देवैःकृतं०८विष्णुस्तोत्रम्
content:
  english: devaih kritam 8 vishnustotram namo matsyakurmadinanasvarupaih sadabhaktakaryodyataya'rtihantre
    | vidhatradisargasthitidhvamsakartre gadashankhapadmarihastaya te'stu || 2|| rama vallabhaya'suranam
    nihantre bhujangariyanaya pitambaraya | makhadikriyapakakartre vikartre sharanyaya tasmai natah smo
    natah smah || 3|| namo daityasantapita martyaduhkhacaladhvamsadambholaye vishnave te | bhujangeshatalpeshayayarkacandradvinetraya
    tasmai natah smo natah smah || 4|| iti shriskandapurane vaishnavakhande kartikamasamahatmye shodashadhyayantargatam
    devaih kritam vishnustotram samaptam | skandapurana | vaishnavakhanda | kartikakhanda | adhyaya 16
  devanagari: देवैः कृतं ८ विष्णुस्तोत्रम् नमो मत्स्यकूर्मादिनानास्वरूपैः सदाभक्तकार्योद्यतायाऽर्तिहन्त्रे
    । विधात्रादिसर्गस्थितिध्वंसकर्त्रे गदाशङ्खपद्मारिहस्ताय तेऽस्तु ॥ २॥ रमा वल्लभायाऽसुराणां निहन्त्रे
    भुजङ्गारियानाय पीताम्बराय । मखादिक्रियापाककर्त्रे विकर्त्रे शरण्याय तस्मै नताः स्मो नताः स्मः ॥ ३॥
    नमो दैत्यसन्तापिता मर्त्यदुःखाचलध्वंसदम्भोलये विष्णवे ते । भुजङ्गेशतल्पेशयायार्कचन्द्रद्विनेत्राय
    तस्मै नताः स्मो नताः स्मः ॥ ४॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे कार्तिकमासमाहात्म्ये षोडशाध्यायान्तर्गतं
    देवैः कृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । कार्तिकखण्ड । अध्याय १६
meaning: {}
