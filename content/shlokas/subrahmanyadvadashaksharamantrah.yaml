id: subrahmanyadvadashaksharamantrah
category: mantra
name:
  english: subrahmanyadvadashaksharamantrah
  devanagari: सुब्रह्मण्यद्वादशाक्षरमन्त्रः
content:
  english: hrim asya shrisubrahmanyadvadashaksharamahamantrasya amritakarshanadakshinamurtih rishih |
    jagaticchandah | shriprasannajnanasubrahmanyo devata | hrim bijam | hsaum shaktih | klim kilakam |
    shriprasannajnanasubrahmanyaprasadasiddhyarthe jape viniyogah | rishyadinyasah
  devanagari: ह्रीं अस्य श्रीसुब्रह्मण्यद्वादशाक्षरमहामन्त्रस्य अमृताकर्षणदक्षिणामूर्तिः ऋषिः । जगतीच्छान्दः
    । श्रीप्रसन्नज्ञानसुब्रह्मण्यो देवता । ह्रीं बीजम् । ह्सौं शक्तिः । क्लीं कीलकम् । श्रीप्रसन्नज्ञानसुब्रह्मण्यप्रसादसिद्ध्यर्थे
    जपे विनियोगः । ऋष्यादिन्यासः
meaning: {}
