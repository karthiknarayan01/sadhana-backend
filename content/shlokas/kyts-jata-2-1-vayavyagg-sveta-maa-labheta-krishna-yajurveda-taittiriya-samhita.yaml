id: kyts-jata-2-1-vayavyagg-sveta-maa-labheta-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 2.1 Vayavyagg Sveta Maa Labheta - Krishna Yajurveda Taittiriya Samhita
content:
  english: vayavyagg shvetagg va~yavyagg shvetam | shveta ma shvetagg a labheta labheta labheta | labheta
    bhutikamo bhutikamo labheta labheta bhutikamah | rbhutikamo bhutikamo vayuh | bhutikama iti bhuti
    vai kshepishtha kshepishtha vai vai kshepishtha | kshepishtha devata devata kshepishtha kshepishtha
    devata ndevata devata vayum | eva svena svenai vaiva svena | svena bhagadheyena bhagadheyena svena
    svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa dhavati
    | dhavati sa sa dhavati dhavati sah | evaina mena mevai vaina ngamayati gamayati bhuti gamayati bhavati
    bhavati gamayati gamayati bhavati | bhavatye vaiva bhavati bhavatyeva | eva tikshipra 'ti kshipraivaiva
    tikshipra | atikshipra devata devata 'tikshipra 'tikshipra devata deva tetiti devata devateti | ityahu
    rahu riti tyahuh | saina menagm sa saina ena mishva reshva raina mena mishvara | ishvara pradahah
    pradaha ishva reshvara pradahah | pradaha ititi pradahah pradaha iti | ityeta meta miti tyetam | eta
    mevaivaita meta meva | eva santagm santa mevaiva santa va~yave vayave santagm santam vayave niyutvate
    niyutvate vayave vayave niyutvate | niyutvata a niyutvate niyutvata a | a labheta labheta labheta
    | nniyu llabheta labheta niyut | va asyasya vai va asya | rdhriti rasyasya dhritih | dhrita evaiva
    dhrito dhrita eva | etya pradahaya pradahayai tyetya pradahaya | apradahaya bhavati bhava tyapradahaya
    pradahaya bhavati | bhavatyevaiva bhavati bhavatyeva | eva vayave vayava evaiva vayave vayave niyutvate
    niyutvate vayave vayave niyutvate | niyutvata a niyutvate niyutvata a | a labheta labheta labheta
    | labheta gramakamo gramakamo labheta labheta gramakamah | rgramakamo gramakamo vayuh | gramakama
    iti grama va ima ima vai va imah | imah prajah praja ima imah prajah | praja nasyota nasyotah prajah
    praja nasyotah | nasyota neniyate neniyate nasyota nasyota neniyate | nneniyate neniyate vayum | nniyutvanta
    mevaiva niyutvantam | niyutvantagg svena svena niyutvanta nniyutvantagg svena | niyutvantamiti ni
    svena bhagadheyena bhagadheyena svena svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa
    | upa dhavati dhava tyupopa dhavati | dhavati sa sa dhavati dhavati sah | evasma asma evaivasmai asmai
    prajah praja asma asmai prajah | praja nasyota nasyotah prajah praja nasyotah | nasyota ni ni nasyota
    nasyota ni | ni yacchati yacchati ni ni yacchati | yacchati grami grami yacchati yacchati grami |
    gramyevaiva grami gramyeva | eva bhavati bhava tyevaiva bhavati | bhavati niyutvate niyutvate bhavati
    bhavati niyutvate | niyutvate bhavati bhavati niyutvate niyutvate bhavati | bhavati dhruva dhruva
    bhavati bhavati dhruvah | dhruva evaiva dhruva dhruva eva | evasma asma evaivasmai asma anapaga anapaga
    asma asma anapagah | anapagah karoti karo tyanapaga anapagah karoti | karoti vayave vayave karoti
    karoti vayave vayave niyutvate niyutvate vayave vayave niyutvate | niyutvata a niyutvate niyutvata
    a | a labheta labheta labheta | labheta prajakamah prajakamo labheta labheta prajakamah | prajakamah
    pranah pranah prajakamah prajakamah pranah | prajakama iti praja prano vai vai pranah prano vai |
    vayu rapano 'pano vayu nniyu dapano 'pano niyut | tpranapanau pranapanau niyu pranapanau khalu khalu
    pranapanau pranapanau khalu | pranapanaviti prana khalu vai vai khalu khalu vai | va eta syaitasya
    vai va etasya | prajaya eta syaitasya prajayah prajaya apapa prajayah apa kramatah kramato 'papa kramatah
    | kramato yo yah kramatah kramato yah | na vindate vindate na na vindate vi~ndate vindate vayum |
    nniyutvanta mevaiva niyutvantam | niyutvantagg svena svena niyutvanta nniyutvantagg svena | niyutvantamiti
    ni svena bhagadheyena bhagadheyena svena svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa
    | upa dhavati dhava tyupopa dhavati | dhavati sa sa dhavati dhavati sah | evasma asma evaivasmai asmai
    pranapanabhya mpranapanabhya masma asmai pranapanabhya pranapanabhyamiti prana pra janayati janayati
    pra pra janayati | janayati vindate vindate janayati janayati vindate vayave niyutvate niyutvate vayave
    vayave niyutvate | niyutvata a niyutvate niyutvata a | a labheta labheta labheta | labheta jyogamayavi
    jyogamayavi labheta labheta jyogamayavi | jyogamayavi pranah prano jyogamayavi jyogamayavi pranah
    | jyogamayaviti jyok prano vai vai pranah prano vai | vayu rapano 'pano vayu nniyu dapano 'pano niyut
    | tpranapanau pranapanau niyu pranapanau khalu khalu pranapanau pranapanau khalu | pranapanaviti prana
    khalu vai vai khalu khalu vai | va etasma detasma etasma dapa paitasma detasma dapa | apa kramatah
    kramato 'papa kramatah | kramato yasya yasya kramatah kramato yasya | yasya jyog jyog yasya yasya
    jyok | jyogamaya tyamayati jyog jyogamayati | va~yu mamaya tyamayati vayum | nniyutvanta mevaiva niyutvantam
    | niyutvantagg svena svena niyutvanta nniyutvantagg svena | niyutvantamiti ni svena bhagadheyena bhagadheyena
    svena svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa
    dhavati | || dhavati sa sa dhavati dhavati sah | nnevai vasminn | npranapanau pranapana vasmi pranapanau
    dadhati dadhati pranapanau pranapanau dadhati | pranapanaviti prana dadha tyutota dadhati dadhatyuta
    | uta yadi yadyutota yadi | rbhavati bhavati tasu ritasu bhavati jivati jivati bhavati bhavati jivati
    | jiva tyevaiva jivati jiva tyeva | eva prajapatih prajapati revaiva prajapatih | rvai vai prajapatih
    prajapati prajapatiriti praja ida meka eka ida mida mekah | eka asi dasi deka eka asit | so 'kamayata
    kamayata sa so 'kamayata | akamayata prajah praja akamayata kamayata prajah | nprajah prajah pashun
    | nthsrijeya srijeya pashu srijeye titi srijeya srijeye ti | iti sa sa ititi sah | va~pa matmana atmano
    vapam | udakkhida dakkhida dudu dakkhidat | nta makkhida dakkhida agnau pra pragna vagnau pra | pragrihna
    dagrihna tpra pragrihnat | ttata stato 'grihna dagrihna tato 'jo 'ja stata stato 'jah | aja stupara
    stuparo svayai devatayai devatayai svayai svayai devatayai | devataya a devatayai devataya a | a 'labhata
    labhata 'labhata | alabhata tata stato 'labhata labhata tatah | tato vai vai tata stato vai | nprajah
    prajah pashun | pashu nasrijata srijata pashu asrijata yo yo 'srijata srijata yah | yah prajakamah
    prajakamo yo yah prajakamah | prajakamah pashukamah pashukamah prajakamah prajakamah pashukamah |
    prajakama iti praja tpashukamah pashukama sa eta metagm sa sa etam | mprajapatya meta meta prajapatya
    maja maja mprajapatya majam | prajapatyamiti praja a labheta labheta labheta | mprajapatim ~labheta
    labheta prajapatim | prajapati mevaiva prajapati prajapatimiti praja eva svena svenaivaiva svena |
    svena bhagadheyena bhagadheyena svena svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa
    | upa dhavati dhava tyupopa dhavati | dhavati sa sa dhavati dhavati sah | evasma asma evaivasmai mpraja
    masma asmai prajam | pra janayati janayati pra pra janayati | dyaj janayati janayati yat | shshmashruna
    stat | purushanagm rupagm rupa mpurushanagm rupam | ttupara stuparo ya ttupara stupara stat | tadashvana
    mashvana dyadashvana mashvanam anyatodannityanyatah avya ive vavya avya iva | shshapha ive va shaphah
    | ajana metavanta etavanto 'jana majana metavantah | etavanto vai va etavanta etavanto vai | vai gramya
    gramya vai vai gramyah | gramyah pashavah pashavo gramya gramyah pashavah | npashavah pashava stan
    | nrupena rupena tag rupenaivaiva rupena rupenaiva | ava rundhe rundhe 'vava rundhe | rundhe somapaushnagm
    somapaushnagm rundhe rundhe somapaushnam | ntraitagm somapaushnagm somapaushna somapaushnamiti soma
    a labheta labheta labheta | labheta pashukamah pashukamo labheta labheta pashukamah | pashukamo dvau
    dvau pashukamah pashukamo dvau | dvau vai vai dvau dvau vai | va ajaya ajayai vai va ajayai ajayai
    stanau stana vajaya ajayai stanau stanau nana nana stanau stanau nana nanaivaiva nana nanaiva | eva
    dvau dva vevaiva dvau | dva vabhyabhi dvau dva vabhi | abhi jayete jayete abhyabhi jayete | jayete
    urja murja njayete jayete urja jayete iti jayete | mpushti murja murja ntritiya stritiyah pushti tritiyah
    somapushanau somapushanau tritiya stritiyah somapushanau somapushana vevaiva somapushanau somapushana
    veva | somapushanaviti soma eva svena svenai vaiva svena | svena bhagadheyena bhagadheyena svena svena
    bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa dhavati |
    dhavati tau tau dhavati dhavati tau | ta vevaiva tau ta veva | evasma asma evaivasmai npashu nasma
    asmai pashun | pra janayato janayatah pra pra janayatah | vai retodha retodha vai vai retodhah | retodhah
    pusha pusha retodha retodhah pusha | mpusha pusha pashunam | mprajanayita prajanayita pashuna ssomah
    prajanayita prajanayita somah | prajanayiteti pra evasma asma evaivasmai 'sma asmai retah | reto dadhati
    dadhati reto reto dadhati | dadhati pusha pusha dadhati dadhati pusha | npusha pusha pashun | pra
    janayati janayati pra pra janayati | janaya tyaudumbara audumbaro janayati janaya tyaudumbarah | audumbaro
    yupo yupa audumbara audumbaro yupah | yupo bhavati bhavati yupo yupo bhavati | bhava tyurgurg bhavati
    bhava tyurk | urg vai va urgurg vai | va udumbara udumbaro vai va udumbarah | udumbara urgurgudumbara
    udumbara urk | kpashavah pashava urgur pashava urjorja pashavah pashava urja | evasma asma evaivasmai
    asma urja murja masma asma urja npashu nurja murja ava rundhe rundhe 'vava rundhe | rundha iti rundhe
    | || prajapatih prajah prajah prajapatih prajapatih prajah | prajapatiriti praja praja asrijata srijata
    prajah praja asrijata | asrijata tasta asrijata srijata tah | ssrishta asma dasma srishtah paracih
    paraci ssrishtah paracih | nparacih paraci rayann | ta anvanu ta sta anu | tah punah puna sta stah
    punah | puna rayacata yacata punah puna rayacata | ayacata tasta ayacata yacata tah | ta asma asmai
    tasta asmai | asmai na nasma asmai na | tpunah puna radadat | vri~nishva vrinishva varam vrinishva
    thatha vrinishva vrinishvatha | atha me me 'thatha me | rdehi dehi punah puna dehititi dehi dehiti
    | ntasa mititi tasa a 'labhata labhata 'labhata | alabhata sa so 'labhata labhata sah | krishna ekashitipa
    dekashitipa tkrishnah krishna ekashitipat | ekashitipa dabhava dabhava dekashitipa dekashitipa dabhavat
    | yo varunagrihito varunagrihito yo yo varunagrihitah | dvarunagrihito varunagrihita varunagrihita
    iti varuna sa eta metagm sa sa etam | krishna mekashitipada mekashitipada nkrishna mekashitipadam
    | ekashitipada maikashitipada mekashitipada ma | a labheta labheta labheta | va~runam ~labheta labheta
    varunam | varuna mevaiva varunam eva svena svenai vaiva svena | svena bhagadheyena bhagadheyena svena
    svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa dhavati
    | dhavati sa sa dhavati dhavati sah | evaina mena mevai vaina dvarunapashadena menam nmuncati muncati
    varunapasha varunapashaditi varuna muncati krishnah krishno muncati muncati krishnah | krishna ekashitipa
    dekashitipa tkrishnah krishna ekashitipat | dbhavati bhava tyekashitipa dekashitipa bhavati varuno
    varuno bhavati bhavati varunah | varuno hi hi varuno varuno hi | hyesha esha hi hyeshah | esha devataya
    devatayaisha esha devataya | devataya samriddhyai samriddhyai devataya devataya samriddhyai | samriddhyai
    suvarbhanu ssamriddhyai samriddhyai suvarbhanuh | samriddhya iti sam suvarbhanu rasura asura ssuvarbhanu
    rasurah | suvarbhanuriti suvah ssuryagm surya masura asura ntamasa tamasa suryagm surya tamasa 'viddhya
    daviddhya ttamasa tamasa 'viddhyat | ttasmai tasma aviddhya daviddhya tasmai deva deva stasmai tasmai
    devah | devah prayashcitti ndeva devah prayashcittim | prayashcitti maiccha mprayashcitti maicchann
    | ntamastamo 'paghnann | sa krishna krishna sa sa krishna | krishna 'viravih krishna krishna 'vih
    | avi rabhava dabhava davi ravi rabhavat | dvitiyagm sa sa dvitiya ndvitiyagm sa | sa phalguni phalguni
    sa sa phalguni | tphalguni phalguni yat | tritiyagm sa sa tritiya sa balakshi balakshi sa sa balakshi
    | dbalakshi balakshi yat | yadaddhyastha daddhyastha addhyastha dapakrinta nnaddhyastha daddhyastha
    dapakrintann | addhyasthadityadhi apakrintannityapa rvasha vasha 'vi ravi te deva deva ste te devah
    | ndeva deva abruvann | ayagm sagm sa maya mayagm sam | tkasmai kasma abhu dabhu nkasmai kasma imam
    | a laphsyamahe laphsyamaha a laphsyamahe | laphsyamaha ititi laphsyamahe laphsyamaha iti | atha vai
    va athatha vai | alpa prithivi prithivyalpa 'lpa prithivi | tprithivi prithivyasi asi dajata ajata
    asi dasi dajatah | ajata oshadhaya oshadhayo 'jata ajata oshadhayah | nta moshadhaya oshadhaya stam
    | vasha madityebhya adityebhyo vasham va~sha madityebhyah | adityebhyah kamaya kamaya dityebhya adityebhyah
    kamaya | kamaya kamaya kamaya | a 'labhanta labhanta 'labhanta | alabhanta tata stato 'labhanta labhanta
    tatah | tato vai vai tata stato vai | va aprathata prathata vai va aprathata | aprathata prithivi
    prithi vyaprathata prathata prithivi | prithi vyajayanta jayanta prithivi prithi vyajayanta | ajaya
    ntaushadhaya oshadhayo 'jayanta jaya ntaushadhayah | oshadhayo yo ya oshadhaya oshadhayo yah | yah
    kamayeta kamayeta yo yah kamayeta | kamayeta pratheya pratheya kamayeta kamayeta pratheya | pratheya
    pashubhih pashubhih pratheya pratheya pashubhih | pashubhih pra pra pashubhih pashubhih pra | prajaya
    pra pra prajaya prajaya jayeya jayeya prajaya jayeye titi jayeya jayeye ti | iti sa sa ititi sah |
    sa eta metagm sa sa etam | eta mavi mavi meta meta mavi vasha madityebhya adityebhyo vasham va~sha
    madityebhyah | adityebhyah kamaya kamayadityebhya adityebhyah kamaya | kamaya kamaya kamaya | || a
    labheta labheta labheta | labhetaditya nadityan ~labheta labhetadityan | aditya nevaivaditya naditya
    neva | kamagg svena svena kama nkamagg svena | svena bhagadheyena bhagadheyena svena svena bhagadheyena
    | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa dhavati | dhavati te te
    dhavati dhavati te | evaina mena mevai vaina mprathayanti prathayantyena mena prathayanti pashubhih
    pashubhih prathayanti prathayanti pashubhih | pashubhih pra pra pashubhih pashubhih pra | prajaya
    pra pra prajaya prajaya janayanti janayanti prajaya janaya ntyasa vasau janayanti janaya ntyasau |
    asa vaditya adityo 'sa vasa vadityah | adityo na naditya adityo na | vyarocata rocata vi vyarocata
    | arocata tasmai tasma arocata rocata tasmai tasmai deva deva stasmai tasmai devah | devah prayashcitti
    ndeva devah prayashcittim | prayashcitti maiccha mprayashcitti maicchann | ntasmai tasma aiccha tasma
    eta eta stasmai tasma etah | eta malha malha eta eta malhah | malha a malha malha a | a 'labhanta
    labhanta 'labhanta | alabha ntagneyi ma gneyi malabhanta labhanta gneyim | krishnagrivigm sagmhitagm
    sagmhita nkrishnagrivigm sagmhitam | krishnagrivimiti krishna sagmhita maindri maindrigm sagmhitagm
    sagmhita maindrim | shveta maindri maindrig tabhi revaiva tabhi stabhi reva | nnevaivasminn | nrucagm
    ruca masmi ruca madadhu radadhu rucagm ruca madadhuh | yo brahmavarcasakamo brahmavarcasakamo yo yo
    brahmavarcasakamah | brahmavarcasakama dbrahmavarcasakamo brahmavarcasakama brahmavarcasakama iti
    brahmavarcasa ttasmai tasmai sya tasma eta eta stasmai tasma etah | eta malha malha eta eta malhah
    | malha a malha malha a | a labheta labheta labheta | gneyim ~labheta labhetagneyim | || krishnagrivigm
    sagmhitagm sagmhita nkrishnagrivigm sagmhitam | krishnagrivimiti krishna sagmhita maindri maindrigm
    sagmhitagm sagmhita maindrim | shveta maindri maindrig barhaspatya meta eta bar eta evaivaita eta
    eva | eva devata devata evaiva devatah ssvena svena devata devata svena bhagadheyena bhagadheyena
    svena svena bhagadheyena | bhagadheyenopopa bhagadheyena bhagadheyenopa | upa dhavati dhava tyupopa
    dhavati | dhavati ta sta dhavati dhavati tah | ta evaiva ta sta eva | nnevaivasminn | mbrahmavarcasa
    masmi ndadhati dadhati brahmavarcasa brahmavarcasamiti brahma dadhati brahmavarcasi brahmavarcasi
    dadhati dadhati brahmavarcasi | brahmavarca syevaiva brahmavarcasi brahmavarca syeva | brahmavarcasiti
    brahma eva bhavati bhava tyevaiva bhavati | bhavati vasanta vasanta bhavati bhavati vasanta krishnagrivi
    ma krishnagrivi nkrishnagrivi ma | krishnagrivimiti krishna a labheta labheta labheta | labheta grishme
    grishme labheta labheta grishme | grishme maddhyandine maddhyandine grishme grishme maddhyandine |
    maddhyandine sagmhitagm sagmhita mmaddhyandine maddhyandine sagmhitam | sagmhita maindri maindrigm
    sagmhitagm sagmhita maindrim | aindrigm sharadi sharadyaindri maindrigm sharadi | sharadyaparahne
    'parahne sharadi sharadyaparahne | aparahne shvetag shveta maparahne 'parahne shvetam | ntrini trini
    bar trini vai vai trini trini vai | va adityasya dityasya vai va adityasya | adityasya tejagmsi tejagsya
    dityasya dityasya tejagmsi | tejagmsi vasanta vasanta tejagmsi tejagmsi vasanta rgrishme grishme pratah
    prata grishme maddhyandine maddhyandine grishme grishme maddhyandine | maddhyandine sharadi sharadi
    maddhyandine maddhyandine sharadi | sharadyaparahne 'parahne sharadi sharadyaparahne | aparahne yavanti
    yava ntyaparahne 'parahne yavanti | yavantyevaiva yavanti yavantyeva | eva tejagmsi tejag syevaiva
    tejagmsi | tejagmsi tani tani tejagmsi tejagmsi tani | ta nyevaiva tani tanyeva | evava vaivai vava
    | || ava rundhe rundhe 'vava rundhe | va~thsaragm rundhe rundhe sam mparyalabhyante paryalabhyante
    sam va~thsarah paryalabhyante paryalabhyante sam paryalabhyanta iti pari vai brahmavarcasasya brahmavarcasasya
    vai vai brahmavarcasasya | brahmavarcasasya pradata pradata brahmavarcasasya brahmavarcasasya pradata
    | brahmavarcasasyeti brahma va~thsarah pradata pradata sam evasma asma evaivasmai asmai brahmavarcasa
    mbrahmavarcasa masma asmai brahmavarcasam | mpra pra brahmavarcasa brahmavarcasamiti brahma pra yacchati
    yacchati pra pra yacchati | yacchati brahmavarcasi brahmavarcasi yacchati yacchati brahmavarcasi |
    brahmavarca syevaiva brahmavarcasi brahmavarca syeva | brahmavarcasiti brahma eva bhavati bhava tyevaiva
    bhavati | bhavati garbhinayo garbhinayo bhavati bhavati garbhinayah | garbhinayo bhavanti bhavanti
    garbhinayo garbhinayo bhavanti | bhavantindriya mindriya mbhavanti bhavantindriyam | vai~ va indriya
    mindriyam vai garbho garbho vai vai garbhah | garbha indriya mindriya ngarbho garbha indriyam | indriya
    mevaive ndriya mindriya meva | nnevaivasminn | ndadhati dadhatyasmi dadhati sarasvatigm sarasvati
    ndadhati dadhati sarasvatim | mmeshigm sarasvatigm sarasvati a labheta labheta labheta | labheta yo
    yo labheta labheta yah | ishvaro vaco vaca i rvaco vaco vaditoh | vag vai vai vag vag vai | vai sarasvati
    sarasvati vai vai sarasvati | sarasvati sarasvatigm sarasvatigm sarasvati sarasvati sarasvatim | sarasvati
    mevaiva sarasvatigm sarasvati meva | eva svena svenaivaiva svena | svena bhagadheyena bhagadheyena
