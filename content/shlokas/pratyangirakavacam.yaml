id: pratyangirakavacam
category: kavacha
name:
  english: pratyangirakavacam
  devanagari: प्रत्यन्गिराकवचम्
content:
  english: om shrisarvarthasadhakakavacasya shiva rishih | virat chandah | shrimatpratyangira devata |
    aim bijam | hrim shaktih | shrim kilakam shrisadashivadevata prityarthe pathe viniyogah || om pranavam
    me shirah patu vagbhavam ca lalatakam | hrim patu dakshanetram me lakshmirvama sureshvari || 1|| pratyangira
    dakshakarna vame kameshvari tatha | lakshmih pranam sada patu vadanam patu keshavah || 2|| gauri tu
    rasanam patu kantham patu maheshvarah | skandhadesham ratih patu bhujau tu makaradhvajah || 3|| shankhanidhih
    karau patu vakshah padmanidhistatha | brahmi madhyam sada patu nabhim patu maheshvari || 4|| kaumari
    prishthadesham tu guhyam rakshatu vaishnavi | varahi ca katimpatu caindri patu padadvayam || 5|| bharyam
    rakshatu camunda lakshmi rakshatu putrakan | indrah purve sada patu agneyyam agnidevata || 6|| yamye
    yamah sada patu nairrityam nirritistatha | pashcime varunah patu vayavyam vayudevata || 7|| saumyam
    somah sada patu caishanyamishvaro vibhuh | urdhvam prajapatih patu hyadhashca'nantadevata || 8|| rajadvare
    shmashane tu aranye prantare tatha | jale sthale ca'ntarikshe shatrunam nigrahe tatha || 9|| etabhih
    sahita devi caturbija maheshvari | pratyangira mahashaktih sarvatra mam sada'vatu || 10|| phalashrutih
    | iti te kathitam devi saratsaram paratparam | sarvarthasadhanam nama kavacam paramadbhutam || 1||
    asya'pi pathanatsadyah kubero'pi dhaneshvarah | indradyah sakala devah dharanatpathanadyatah || 2||
    sarvasiddhishvaro santah sarvaishvaryamavapnuyuh | pritimanye'nyatah kritva kamala nishcala grihe
    || 3|| vani ca nivasedvaktre satyam satyam na samshayah | yo dharayati punyatma sarvarthasadhanabhidham
    || 4|| kavacam paramam punyam so'pi punyavatam varah | sarvaishvaryayuto bhutva trailokyavijayi bhavet
    || 5|| purusho dakshine bahau nari vamabhuje tatha | bahuputravati bhuyadvandhya'pi labhate sutam
    || 6|| brahmastradini shastrani naiva krintanti tattanum | etatkavacamajnatva yo japetparameshvarim
    || 7|| daridryam paramam prapya so'ciranmrityumapnuyat || shri rudrayamala tantre pancangakhande pratyangirayah
    sarvarthasadhanam namakam kavacam paripurnam ||
  devanagari: ॐ श्रीसर्वार्थसाधककवचस्य शिव ऋषिः । विराट् छन्दः । श्रीमत्प्रत्यङ्गिरा देवता । ऐं बीजम्
    । ह्रीं शक्तिः । श्रीं कीलकं श्रीसदाशिवदेवता प्रीत्यर्थे पाठे विनियोगः ॥ ॐ प्रणवं मे शिरः पातु वाग्भवं
    च ललाटकम् । ह्रीं पातु दक्षनेत्रं मे लक्ष्मीर्वाम सुरेश्वरी ॥ १॥ प्रत्यङ्गिरा दक्षकर्ण वामे कामेश्वरी
    तथा । लक्ष्मीः प्राणं सदा पातु वदनं पातु केशवः ॥ २॥ गौरी तु रसनां पातु कण्ठं पातु महेश्वरः । स्कन्धदेशं
    रतिः पातु भुजौ तु मकरध्वजः ॥ ३॥ शङ्खनिधिः करौ पातु वक्षः पद्मनिधिस्तथा । ब्राह्मी मध्यं सदा पातु नाभिं
    पातु महेश्वरी ॥ ४॥ कौमारी पृष्ठदेशं तु गुह्यं रक्षतु वैष्णवी । वाराही च कटिम्पातु चैन्द्री पातु पदद्वयम्
    ॥ ५॥ भार्यां रक्षतु चामुण्डा लक्ष्मी रक्षतु पुत्रकान् । इन्द्रः पूर्वे सदा पातु आग्नेय्यां अग्निदेवता
    ॥ ६॥ याम्ये यमः सदा पातु नैरृत्यां निरृतिस्तथा । पश्चिमे वरुणः पातु वायव्यां वायुदेवता ॥ ७॥ सौम्यां
    सोमः सदा पातु चैशान्यामीश्वरो विभुः । ऊर्ध्वं प्रजापतिः पातु ह्यधश्चाऽनन्तदेवता ॥ ८॥ राजद्वारे श्मशाने
    तु अरण्ये प्रान्तरे तथा । जले स्थले चाऽन्तरिक्षे शत्रूणां निग्रहे तथा ॥ ९॥ एताभिः सहिता देवी चतुर्बीजा
    महेश्वरी । प्रत्यङ्गिरा महाशक्तिः सर्वत्र मां सदाऽवतु ॥ १०॥ फलश्रुतिः । इति ते कथितं देवि सारात्सारं
    परात्परम् । सर्वार्थसाधनं नाम कवचं परमाद्भुतम् ॥ १॥ अस्याऽपि पठनात्सद्यः कुबेरोऽपि धनेश्वरः । इन्द्राद्याः
    सकला देवाः धारणात्पठनाद्यतः ॥ २॥ सर्वसिद्धीश्वरो सन्तः सर्वैश्वर्यमवाप्नुयुः । प्रीतिमन्येऽन्यतः कृत्वा
    कमला निश्चला गृहे ॥ ३॥ वाणी च निवसेद्वक्त्रे सत्यं सत्यं न संशयः । यो धारयति पुण्यात्मा सर्वार्थसाधनाभिधम्
    ॥ ४॥ कवचं परमं पुण्यं सोऽपि पुण्यवतां वरः । सर्वैश्वर्ययुतो भूत्वा त्रैलोक्यविजयी भवेत् ॥ ५॥ पुरुषो
    दक्षिणे बाहौ नारी वामभुजे तथा । बहुपुत्रवती भूयाद्वन्ध्याऽपि लभते सुतम् ॥ ६॥ ब्रह्मास्त्रादीनि शस्त्राणि
    नैव कृन्तन्ति तत्तनुम् । एतत्कवचमज्ञात्वा यो जपेत्परमेश्वरीम् ॥ ७॥ दारिद्र्यं परमं प्राप्य सोऽचिरान्मृत्युमाप्नुयात्
    ॥ श्री रुद्रयामल तन्त्रे पञ्चाङ्गखण्डे प्रत्यङ्गिरायाः सर्वार्थसाधनं नामकं कवचं परिपूर्णम् ॥
