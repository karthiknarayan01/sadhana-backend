id: vedavyasaproktamdvadashanamaganapatistotram
category: stotram
name:
  english: vedavyasaproktamdvadashanamaganapatistotram
  devanagari: वेदव्यासप्रोक्तंद्वादशनामगणपतिस्तोत्रम्
content:
  english: om namo ganapataye mantra esha udahritah || 28|| ganapatirvighnarajo lambatundo gajananah |
    dvaimaturashca heramba ekadanto ganadhipah || 29|| vinayakashcarukarnah pashupalo bhavatmajah | dvadashaitani
    namani pratarutthaya yah pathet || 30|| vishvam tasya bhavedvashyam na ca vighnam bhavetkvacit mahapretashshamam
    yanti pidyate vyadhibhirna ca sarvapapadvinirmukto hyakshayam svargamashnute || 31|| iti shripadmapurane
    srishtikhande trishashtitamadhyayantargatam dvadashanamaganapatistotram samaptam | mahaganapatidvadashanamastotram
    padmapurana | srishtikhanda | adhyaya 63
  devanagari: ॐ नमो गणपतये मन्त्र एष उदाहृतः ॥ २८॥ गणपतिर्विघ्नराजो लम्बतुण्डो गजाननः । द्वैमातुरश्च हेरम्ब
    एकदन्तो गणाधिपः ॥ २९॥ विनायकश्चारुकर्णः पशुपालो भवात्मजः । द्वादशैतानि नामानि प्रातरुत्थाय यः पठेत्
    ॥ ३०॥ विश्वं तस्य भवेद्वश्यं न च विघ्नं भवेत्क्वचित् महाप्रेताश्शमं यान्ति पीड्यते व्याधिभिर्न च सर्वपापाद्विनिर्मुक्तो
    ह्यक्षयं स्वर्गमश्नुते ॥ ३१॥ इति श्रीपाद्मपुराणे सृष्टिखण्डे त्रिषष्टितमाध्यायान्तर्गतं द्वादशनामगणपतिस्तोत्रं
    समाप्तम् । महागणपतिद्वादशनामस्तोत्रम् पद्मपुराण । सृष्टिखण्ड । अध्याय ६३
