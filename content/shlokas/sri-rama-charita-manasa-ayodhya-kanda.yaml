    सब जागबलिक कहि राखा। देबि न होइ मुधा मुनि भाषा ॥ दो अस कहि पग परि पेम अति सिय हित बिनय सुनाइ ॥ सिय
    समेत सियमातु तब चली सुआयसु पाइ ॥ ॥ प्रिय परिजनहि मिली बैदेही। जो जेहि जोगु भाँति तेहि तेही ॥ तापस
