id: kytb-1-2-gavamayana-brahmanam-krishna-yajurveda-taittiriya-brahmana-patha-uddhanyamana-masya
category: stotram
name:
  english: KYTB 1.2 Gavamayana Brahmanam - Krishna Yajurveda Taittiriya Brahmana Patha - Uddhanyamana
    Masya
content:
  english: krishna yajurvediya taittiriya brahmane prathamashtake dvitiyah prapathakah shri gurubhyo namah
    | harih om || anuvakam adhanamantrah purvaprapathakasheshabhutah uddhanyamana masya ameddhyam | apa
    papmanam ya~jamanasya hantu | shiva nah santu pradishashcatasrah | sha nno mata prithivi tokasata
    || sha nno devirabhishtaye | apo bhavantu pitaye yo~rabhi sravantu nah || vaishvanarasya rupam | prithivya
    ndivo yadadah prithivyah | sajanjnane rodasi sambabhuvatuh | usha n krishnamavatu krishnamushah magamishthah
    || utih kurvano ya tprithivimacarah | guhakara tte nyaktamiha sabhamrantah | shata njivema sharadah
    purucih || nguhasu | shrotra nta urvyabadhira bhavamah || prajapati srishtana m | kshudhopahatyai
    suvita nno astu | upaprabhinnamisha mprajabhyah | suda ngrihebhyo rasamabharami || yasya rupa mavindat
    | guha pravishtagm sarirasya maddhye mabharantah | achambatkaramasyam jjagatah pratishtham | ta tpushkarasyayatanaddhi
    jatam | parna mprithivyah prathanagm harami || yabhiradrigmhajjagatah pratishtham | urvimimam vi~shvajanasya
    bhartrim | ta nah shiva || agne retashcandragm hiranyam | adbhya thsabhamrannuttarato nidhaya || ntareyam
    || ashvo rupa nkritva yadashvatthe 'tishthah | sam ndevebhyo nilaya | tatte nyaktamiha sabhamrantah
    | shata ssavirah || urjah prithivya addhyutthito 'si | vanaspate shataval sho viroha | tvaya vayamishamurja
    mmadantah | rayasposhena samisha madema || gayatriya hriyamanasya yatte ssomaparnaddhi jatah | tato
    harami somapithasyava ssushrava vai shruto 'si | tato mamavishatu brahmavarcasam | ta thsabhamragg
    stadavarundhiya sakshat || yaya te srishtasyagneh | hetimashamaya tprajapatih | tamimama pradahaya
    || || shamigm shantyai haramyaham || yatte srishtasya yatah | vikankata rchajjatavedah | taya bhasa
    sammitah | uru nno lokamanu prabhahi || yatte tantasya hridayamacchindan jatavedah | maruto 'dbhistamayitva
    | etatte tadashane ssambharami | satma agne sahridayo bhaveha || citriyadashvattha thsambhrita brihatyah
    || sstha | prajapatina yajnamukhena sammitah | tisras trivridbhi ddhi jatam | agne stanum ya~jniyagm
    sambharami | shantayonigm shamigarbham | agnaye prajanayitave shshamigarbhah | aruroha tve saca nte
    harami brahmana || jatavedah | yatha sharira mbhuteshu nyaktam | sa sambhrita ssida shivah prajabhyah
    | uru nno lokamanuneshi vidvan || pra vedhase kavaye meddhyaya | vaco vandaru vrishabhaya vrishne
    ntanno astu | ava devan yaje hedyan || samidha rbodhayatatithim | a havya juhotana || upa tva 'gne
    havishmatih | ghritaci ryantu haryata | jushasva samidho mama || ta ntva samidbhirangirah | ghritena
    vardhayamasi | brihacchoca yavishthya || samiddhyamanah prathamo nu dharmah | samaktubhirajyate vishvavarah
    || || shocishkesho ghritanirnik pavakah | suyajno agni ryajathaya devan || ghritapratiko ghritayoniragnih
    | ghritai ssamiddho ghritamasyanna m | ghritaprushastva sarito vahanti | ghrita thsuyaja yakshi devan
    || ayurda agne havisho jushanah | ghrita pratiko ghritayoniredhi | ghrita mpitva madhucaru gavya m
    | piteva putramabhi rakshatadimam || || tvamagne samidhanam ya~vishtha | deva duta ncakshurdadhire
    codayanvati || tvamagne pradiva ahuta nghritena | sumnayavah sushamidha samidhire | sa vavridhana
    oshadhibhirukshitah | urujrayagmsi parthiva vitishthase || ghrita pratikam mmitranna samidhana rinjate
    || || indhano akro vidatheshu didyat | shukravarnamudu no yagmsate dhiya m || praja agne sam shca
    pashubhih saha | rashtranyasma adhehi | yanyasa ssave || mahi vishpatni sadane ritasya | arvaci eta
    ndharune rayinam | antarvatni janya njatavedasam | addhvarana ndashatagm shakvari gna ayusha varcasa
    saha | jyog jivanta uttaramuttaragm sama || ritviyavati stho agniretasau | garbha njanayishyathah
    | te ma tpratah prajanishyethe | te ma prajate prajanayishyathah || rbrahmavarcasena suvarge loke
    || anrita thsatyamupaimi | manusha ya~cchami || shalkairagnimindhanah | ubhau lokau sanemaham | ubhayo
    riddhva | ati mrityu ntaramyaham || jatavedo bhuvanasya retah | iha sinca tapaso yajjanishyate ||
    agnimashvatthadadhi havyavaha ritviyah | yato jato arocathah | ta njanannagna aroha | atha no vardhaya
    rayim || apeta vita vi ca sarpatatah | ye 'tra stha purana ye ca nutanah | adadidam mprithivyah |
    akrannima mpitaro lokamasmai || syagneh purishamasi || sajnannamasi kamadharanam | mayi te kamadharana
    vah ~srijami hridayani | sagm srishta mmano astu vah | sagm srishtah prano astu vah || sam ya~ vah
    priyastanuvah | sampriya hridayani vah | atma vo astu sampriyah | sampriya ndyavaprithivi | kalpantamapa
    oshadhih | kalpantamagnayah prithak | mama jyaishthyaya savratah || ye ssamanasah | antara dyavaprithivi
    | vasantikavritu abhi kalpamanah | indramiva deva abhi sam vi~shantu || divastva viryena | prithivyai
    || antarikshasya poshena | sarvapashu mmartyasah | asremana vi~dujambham | dasha svasaro agruvah samicih
    | pumagmsa njatamabhi sagmrabhantam || prajapatestva pranenabhi pranimi | pushnah poshena mahya m
    | dirghayutvaya shatasharadaya | shatagm sharadbhya ayushe varcase || || jivatvai punyaya || aha ntvadasmi
    madasi tvametat | mamasi yonistava yonirasmi | mamaiva sanvaha havyanyagne | putrah pitre lokakri
    jjatavedah || prane tva 'mritamadadhami | annadamannadyaya | goptara || sugarhapatyo vidahannaratih
    | ushasa || agne sapatnagm apa badhamanah | rayasposha masmasu dhehi || ima u mamupatishthantu rayah
    | abhih prajabhiriha sam va~seya | iho ida tishthatu vishvarupi | maddhye vaso rdidihi jatavedah ||
    ojase balaya tvodyacche | vrishane shushmayayushe varcase | sapatnaturasi vritratuh | yaste deveshu
    mahima suvargah || || yasta atma pashushu pravishtah | pushtirya te manushyeshu paprathe | taya no
    agne jushamana ehi || divah prithivyah paryantarikshat | vata tpashubhyo addhyoshadhibhyah | yatrayatra
    jataveda mbabhutha | tato no agne jushamana ehi || pracimanu pradisha mprehi vidvan | agneragne puro
    agni rbhaveha | vishva asha didyano vi bhahi || nno dhehi dvipade catushpade || anvagnirushasa makhyat
    | anvahani prathamo jatavedah | anu suryasya purutra ca rashmin | anu dyavaprithivi atatana || vikramasva
    mahagm asi | vedisha nmanushebhyah | trishu lokeshu jagrihi || yadida ndivo yadadah prithivyah | sam
    prishthe sidatu jatavedah | shabhumh prajabhya 'mrita adadhami | annadamannadyaya | goptara | yatte
    shukra shukram va~rcah shukra tanuh | shukra rajasram | tena me didihi tena tva ''gne brahmana | anashe
    vyanashe sarvamayu mme gopaya | amritatvaya jivase nca | amrite satye pratishthitam || atharva pitu
    mme gopaya | rasamannamihayushe | adabdhayo nme gopaya | dvipado ye catushpadah || || ashtashaphashca
    ya ihagne | ye caikashapha ashugah || sapratha sabha mme gopaya | ye ca sabhya ssabhasadah | tanindriyavatah
    kuru | sarvamayu rupasatam || ahebuddhniya mantra mme gopaya | yamrishayastraivida viduh | rica ssamani
    yajugmshi | sa hi shriramrita satam || || catuh shikhanda yuvati | ghritapratika bhuvanasya maddhye
    | marmrijyamana mahate saubhagaya | mahya ndhukshva yajamanaya kaman || ihaiva santatra sato vo agnayah
    | pranena vaca manasa bibharmi | tiro ma santamayurma prahasit | jyotisha vo vaishvanare nopatishthe
    || pancadha vyakramat | virat thsrishta prajapateh | urdhva drohini | yoniragneh pratishthitih ||
    shvavartini catvaryahani cocyante navaitanyahani bhavanti | nava vai suvarga lokah | yadetanyaha nyupayanti
    | navasveva ta thsuvargeshu lokeshu satrinah pratitishthanto yanti || agnishtomah parah samanah karya
    ityahuh | agnishtomasaminta ssuvargo loka iti | dvadasha gnishtomasya stotrani | dvadasha masa m |
    ukthya eva saptadashah parah samanah karyah || pashavo va ukthani | pashunamava ruddhyai || vishvajidabhijita
    vagnishtomau || ukthya ssaptadashah parah samanah | te sagg stuta virajamabhi sampadyante | dve carcavati
    ricyete | ekaya gauratiriktah | ekaya ''yurunah | suvargo vai loko jyotih | urg virat || || suvargameva
    tena lokamabhi jayanti || ya tparagm rathantaram | ta ncaturthe | shakvara mpancame | raivatagm shashthe
    | tadu prishthebhyo nayanti || satannaya ete graha grihyante || parah samasu | imanevaitai thsantanvanti
    || mithuna ete graha grihyante | atigrahyah parah samasu | mithunameva tai ryajamana avarundhate ||
    briha dvai suvargo lokah | brihataiva suvargam ya~nti || trayastrigmshi nama sama | maddhyandine pavamane
    bhavati || || trayastrigmshadvai devatah | devata evavarundhate || ye va itah para mupa yanti | na
    haina nte svasti samashnuvate | atha ye 'rvancamupa yanti | te hainagg svasti samashnuvate | etadva
    amuto 'rvancamupa yanti | yadevam | yo ha khalu vava prajapatih | sa u vevendrah | tadu devebhyo nayanti
    || 'tigrahyavisheshah santatirva ete grahah tparah samanah | vishuvan m | yatha shalayai pakshasi
    | evagm sam va~thsarasya pakshasi | yadetena grihyerann | vishuci sam va~thsarasya pakshasi vyavasragm
    seyatam | artimarccheyuh | yadete grihyante | yatha shalayai pakshasi maddhyamam va~gmshamabhi samayacchati
    || va~thsarasya pakshasi divakirtyamabhi santanvanti | nartimarcchanti || ekavigmsha maharbhavati
    | shukragra graha grihyante | pratyuttabdhyai sayatvaya || saurya etadahah pashuralabhyate | sauryo
    'tigrahyo grihyate | ahareva rupena samardhayanti | atho ahna evaisha balir grahya grihyante || pranah
    | asavaditya m | shirshanneva prajana npranah || indro vritragm hatva | asura nparabhavya | sa ima~lloka
    nabhyajayat | tasyasau loko vi~shvakarma bhutva || suvargasya lokasya bhijityai || pra va ete | adityashshvo
    grihyate | iyam va~ aditih | asyameva pratitishthanti || anyo nyo grihyete | vishva nyevanyena karmani
    kurvana yanti | asyamanyena prati tishthanti || tava nyo grihyete || tavubhau saha mahavrate grihyete
    | yajnasyaivanta rlokayoh prati tishthanti || arkyamuktha mbhavati | annadyasya tyatigrahya grihyante
    nyo grihyete panca ca tasminneva dine divakirtyanamani samani ekavigmsha esha bhavati | etena vai
    deva ekavigmshena | adityamita uttamagm suvargam marohayann | sa va esha ita ekavigmshah | tasya dashavastadahani
    | dasha parasta t | sa va esha virajyubhayatah pratishthitah | viraji hi va esha ubhayatah pratishthitah
    | tasmadantaremau lokau yann | sarveshu suvargeshu loke || deva va adityasya suvargasya lokasya |
    paraco 'tipadadabibhayuh | ta nchandobhiradrigm handhrityai | deva va adityasya suvargasya lokasya
    | avaco mpancabhi rashmibhi rudavayann | tasmadekavigmshe 'ha npanca divakirtyani kriyante | rashmayo
    vai divakirtyani || ye gayatre | te gayatrishuttarayoh pavamanayoh || || mahadivakirtyagm hotuh prishtham
    | vikarna mbrahmasamam | bhaso 'gnishtomah || athaitani parani | parairvai deva adityagm suvargam
    lo~kamaparayann | yadaparayann | ta mparatvam | parayantyena ve~da | athaitani sparani | sparairvai
    deva adityagm suvargam lo~kamasparayann | yadasparayann | ta sparatvam | sparayantyenagg sparani |
    ya evam pashavah vaishnavadya nava apratishtham va~ ete gacchanti | yeshagm sam 'tha | ekadashinyapyate
    malabhante | yajno vai vishnuh | yajnamevalabhante pratishthityai | aindragna malabhante | indragni
    vai devana mayatayamanau | ye eva devate ayatayamni | te evalabhante || malabhante | devata evava
    rundhate | dyavaprithivya malabhante | dyavaprithivyoreva prati tishthanti | vayavyam va~thsamalabhante
    | vayurevaibhyo yatha ddevata avarundhe | adityamavim va~ aditih | asyameva prati tishthanti | maitravaruni
    || mitrenaiva yajnasya svishtagm shamayanti | varunena durishtam | prajapatya mmahavrata alabhante
    | prajapatyo 'tigrahyo grihyate | ahareva rupena samardhayanti | atho ahna evaisha balir hriyate |
    agneyamalabhante prati prajna tyai || ajapetvan va ete purvairmasaira varundhate | yadete gavyah pashava
    alabhyante malabherann | apriya ddvaudvau pashu samasyeyuh | kaniya ayuh kurvirann | yadete brahmanavantah
    pashava alabhyante mabhyatiricyate | na kaniya ayuh kurvate || maitravarunimalabhante mahavratam prajapatih
    praja ssrishtva vritto ndeva bhutanagm rasa ntejah sabhrintya | tenainamabhishajyann | mahanavavartiti
    | ta nmahavratasya mahavratatvam | maha nmahavratasya mahavratatvam | mahato vratamiti | ta nmahavratasya
    mahavratatvam || pancavigmsha va~thsare 'dhiprajayata | tadanna mabhavat || maddhyatah kriyate | maddhyato
    hyannamashita ndhinoti | atho maddhyata eva prajanamurgdhiyate || atha yadva idamantatah kriyate |
    tasmadudante praja ssamedhante | antatah kriyate prajananayaiva || trivricchiro bhavati || || tredha
    vihitagm hi shirah | loma chavirasthi || paraca stuvanti | tasma thsadrigeva | na medyato 'nu medyati
    | na krishyato 'nu krishyati || pancadasho 'nyah paksho bhavati | saptadasho nyataramardhamabhi paryavartante
    | anyatarato hi ta || pancavigmsha atma bhavati | tasma nmaddhyatah pashavo varishthah || ekavigmsha
    m | dvipadasu stuvanti pratishthityai || sarvena saha stuvanti | sarvena hya ''tmanvi | sahotpatanti
    || ekaika mucchigmshanti | atmann hyangani baddhani || na va etena sarvah purushah || || yadita ito
    lomani dato nakhan | parimadah kriyante | tanyeva tena pratyupyante || audumbarastalpo bhavati | urgva
    annamudumbarah | urja evannadyasya varuddhyai || yasya talpasadya manabhijitagg syat | sa devanagm
    samyakshe | talpasadya mabhijayaniti talpama dgayet | talpasadya mabhijitagg syat | sa devanagm samyakshe
    | talpasadya mma parajeshiti talpa dgayet | na talpasadya mparajayate || plenkhe shagmsati | maho
    vai plenkhah | mahasa evannadyasya varuddhyai || devasura ya~tta asann | ta aditye vyayacchanta |
    ta || brahmanashca shudrashca carmakarte vyayacchete | daivyo vai varno brahmanah | asaryah shudrah
    | ime nnityanyataro bruyat | ima udvasikarina ime durbhuta makrannityanyatarah | yadevaishagm sukritam
    ya~ raddhih | tadanyataro 'bhishrinati | yadevaisha 'pahanti | brahmana njayati | amumevaditya vaishvadevamalabhante
    pancashat || harih om || || krishna yajurvediya taittiriya brahmane prathamashtake dvidiyah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे प्रथमाष्टके द्वितीयः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ अनुवाकं आधानमन्त्राः पूर्वप्रपाठकशेषभूताः उ॒द्ध॒न्यमा॑न म॒स्या अ॑मे॒द्ध्यम् । अप॑ पा॒प्मानं॒
    यँज॑मानस्य हन्तु । शि॒वा नः॑ सन्तु प्र॒दिश॒श्चत॑स्रः । श न्नो॑ मा॒ता पृ॑थि॒वी तोक॑साता ॥ श न्नो॑ दे॒वीर॒भिष्ट॑ये
    । आपो॑ भवन्तु पी॒तये योँर॒भि स्र॑वन्तु नः ॥ वै॒श्वा॒न॒रस्य॑ रू॒पम् । पृ॒थि॒व्या न्दि॒वो यद॒दः पृ॑थि॒व्याः
    । स॒ज॒ञ्ज्ञा॒ने रोद॑सी सम्बभू॒वतुः॑ । ऊषा न् कृ॒ष्णम॑वतु कृ॒ष्णमूषाः माग॑मिष्ठाः ॥ ऊ॒तीः कु॑र्वा॒णो
    य त्पृ॑थि॒वीमच॑रः । गु॒हा॒कार॑ त्ते॒ न्य॑क्तमि॒ह स॒भंर॑न्तः । श॒त ञ्जी॑वेम श॒रदः॑ पुरू॒चीः ॥ ङ्गुहा॑सु
    । श्रोत्र॑ न्त उ॒र्व्यब॑धिरा भवामः ॥ प्र॒जाप॑ति सृष्टाना म् । क्षु॒धोप॑हत्यै सुवि॒त न्नो॑ अस्तु ।
    उप॒प्रभि॑न्न॒मिष॒ म्प्र॒जाभ्यः॑ । सूद॑ ङ्गृ॒हेभ्यो॒ रस॒माभ॑रामि ॥ यस्य॑ रू॒प मवि॑न्दत् । गुहा॒ प्रवि॑ष्टाग्ं
    सरि॒रस्य॒ मद्ध्ये मा॒भर॑न्तः । अछ॑म्बट्कारम॒स्यां ज्जग॑तः प्रति॒ष्ठाम् । त त्पुष्क॑रस्या॒यत॑ना॒द्धि
    जा॒तम् । प॒र्ण म्पृ॑थि॒व्याः प्रथ॑नग्ं हरामि ॥ याभि॒रदृग्ं॑ह॒ज्जग॑तः प्रति॒ष्ठाम् । उ॒र्वीमि॒मां विँ॑श्वज॒नस्य॑
    भ॒र्त्रीम् । ता नः॑ शि॒वा ॥ अ॒ग्ने रेत॑श्च॒न्द्रग्ं हिर॑ण्यम् । अ॒द्भ्य थ्स॒भंर॑न्नुत्तर॒तो नि॒धाय॑
    ॥ न्तरेयम् ॥ अश्वो॑ रू॒प ङ्कृ॒त्वा यद॑श्व॒त्थे ऽति॑ष्ठः । सं॒ न्दे॒वेभ्यो॑ नि॒लाय॑ । तत्ते॒ न्य॑क्तमि॒ह
    स॒भंर॑न्तः । श॒त स्सवी॑राः ॥ ऊ॒र्जः पृ॑थि॒व्या अद्ध्युत्थि॑तो ऽसि । वन॑स्पते श॒तव॑ल् शो॒ विरो॑ह ।
    त्वया॑ व॒यमिष॒मूर्ज॒ म्मद॑न्तः । रा॒यस्पोषे॑ण॒ समि॒षा म॑देम ॥ गा॒य॒त्रि॒या ह्रि॒यमा॑णस्य॒ यत्ते स्सो॑मप॒र्णाद्धि
    जा॒तः । ततो॑ हरामि सोमपी॒थस्याव॑ स्सु॒श्रवा॒ वै श्रु॒तो॑ ऽसि । ततो॒ मामावि॑शतु ब्रह्मवर्च॒सम् । त
    थ्स॒भंर॒ग्ग्॒ स्तदव॑रुन्धीय सा॒क्षात् ॥ यया॑ ते सृ॒ष्टस्या॒ग्नेः । हे॒तिमश॑मय त्प्र॒जाप॑तिः । तामि॒माम
    प्र॑दाहाय ॥ ॥ श॒मीग्ं शान्त्यै॑ हराम्य॒हम् ॥ यत्ते॑ सृ॒ष्टस्य॑ य॒तः । विक॑ङ्कत॒ र्छज्जातवेदः । तया॑
