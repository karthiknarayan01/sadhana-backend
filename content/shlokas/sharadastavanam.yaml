id: sharadastavanam
category: stotram
name:
  english: sharadastavanam
  devanagari: शारदास्तवनम्
content:
  english: ringadripithadhipaih | adyapi sthirabhaktibhavabharitaih shrimadbhiraradhitam vidyatirthayatishvarairabhinavetyakhyati
    purvaih sada || 3|| shrinatha tridashadhinatha girijanathadi devarcite taranabhasanatha carumakute
    nathanyadevo'sti me | matastvam na vina parastribhuvane poto bhavambhonidheh tratavyohamaparaghoradurita
    vratabdhimagnashcirat || 4|| vipraste vedamantraih tavapadayugapankejalagnamtarangah jhankarairvibhramanto
    navasumamadhupanapramattashca bhringah | vriksheshudgiyamanairbahuvidhaninadaih kujitaiste vihangah
    ghoshairvai suprabhatam tava janani pathantyatra tungatarangah || 5|| dhanyaste bhuvi ye vasanti vimale
    sha
  devanagari: ृङ्गाद्रिपीठाधिपैः । अद्यापि स्थिरभक्तिभावभरितैः श्रीमद्भिराराधिताम् विद्यातीर्थयतीश्वरैरभिनवेत्याख्याति
    पूर्वैः सदा ॥ ३॥ श्रीनाथ त्रिदशाधिनाथ गिरिजानाथादि देवार्चिते तारानाभसनाथ चारुमकुटे नाथान्यदेवोऽस्ति
    मे । मातस्त्वां न विना परस्त्रिभुवने पोतो भवाम्भोनिधेः त्रातव्योहमपारघोरदुरित व्राताब्धिमग्नश्चिरात्
    ॥ ४॥ विप्रास्ते वेदमन्त्रैः तवपदयुगपङ्केजलग्नांतरङ्गाः झङ्कारैर्विभ्रमन्तो नवसुममधुपानप्रमत्ताश्च
    भृङ्गाः । वृक्षेषूद्गीयमानैर्बहुविधनिनदैः कूजितैस्ते विहङ्गाः घोषैर्वै सुप्रभातं तव जननि पठन्त्यत्र
    तुङ्गातरङ्गाः ॥ ५॥ धन्यास्ते भुवि ये वसन्ति विमले श
meaning: {}
