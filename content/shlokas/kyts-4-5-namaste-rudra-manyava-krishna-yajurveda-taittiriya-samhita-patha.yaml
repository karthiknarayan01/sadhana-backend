    आव्या॒धिनी॑ना॒ म्पत॑ये॒ नमो॒ नमः॑ ककु॒भाय॑ निष॒ङ्गिणे म्पत॑ये॒ नमो॒ नमो॑ निष॒ङ्गिण॑ इषुधि॒मते॒ तस्क॑राणा॒
    म्पत॑ये॒ नमो॒ नमो॒ वञ्च॑ते परि॒वञ्च॑ते स्तायू॒ना म्पत॑ये॒ नमो॒ नमो॑ निचे॒रवे॑ परिच॒रायार॑ण्याना॒ म्पत॑ये॒
    नमो॒ नमः॑ सृका॒विभ्यो॒ जिघाग्ं॑सद्भ्यो मुष्ण॒ता म्पत॑ये॒ नमो॒ नमो॑ ऽसि॒मद्भ्यो॒ नक्त॒ ञ्चर॑द्भ्यः
    प्रकृ॒न्ताना॒ म्पत॑ये॒ नमो॒ नम॑ उष्णी॒षिणे॑ गिरिच॒राय॑ कुलु॒ञ्चाना॒ इषु॑मद्भ्यो धन्वा॒विभ्य॑श्च वो॒
