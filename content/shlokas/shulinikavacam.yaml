id: shulinikavacam
category: kavacha
name:
  english: shulinikavacam
  devanagari: शूलिनीकवचम्
content:
  english: bhayankari || 5|| indrani patu me karnau indranatha hanu mama | grivaparshvam mahashaktih grivam
    me parameshvari || 6|| karali dakshinaskandham vaishnavi patu vamakam | shiveshi dakshadormulam shivaduti
    ca vamakam || 7|| acyuta dakshadordandam ananta patu vamakam | dakshakurparamishani trishuli patu
    vamakam || 8|| jvalamukhi prakoshtham me patu bhadra ca vamakam | bhairavi manibandham me vamam patu
    maheshvari || 9|| karaprishtham tu varahi vikatangi tu vamakam | aghora dakshinangushtham ghorarupa
    tu tarjanim || 10|| madhyamam raktakeshi ca'namikam tu mahabala | maya kanishthikam patu parvani vishanashini
    || 11|| nakhani me karalasya vamangushtham mahodari | tarjanim raktacamundi meghanada tu madhyamam
    || 12|| anamikam raudramukhi kali patu kanishthikam | parvani kalaratrirme narasihmi nakhani me ||
    13|| jatila dakshina kaksham vamakaksham payasvini | vaksho jvalamukhi patu hridayam krishnapingala
    || 14|| narayani stanadvandvam rudrani mastakagrakam | jatharam bhadrakali me candika udaram tatha
    || 15|| taddakshinamananta me tadvamah brahmavadini | savitri patu nabhim me gayatri me katidvayam
    || 16|| tvarita patu me guhyam prishthabhagam shatanana | yogeshvari gudam patu jaghanam lokamohini
    || 17|| uruyugmam vasumatim candamunda tu januni | janghe katyayani patu gulphe mahishamardini ||
    18|| shakambharim padaprishthe gauri padangulirmama | sukshma padatalam patu padaparshvam dhananjaya
    || 19|| sarvangam patu me pushtih sarvasandim madapriya | jvalini romakupani vasudhara tvacam mama
    || 20|| vasudha carma me patu rudhiram madanavati | tivra mamsadvayam patu bhedo me vighnanashini
    || 21|| mamasthi bhogada patu majjam patu paratpara | pancabhutam ratihpatu shuklam me kamarupini
    || 22|| muladharamuma patu svadhishthanam cidankura | amrita manipuram me'nahatam kamalekshana ||
    23|| vishuddhi patu me nada
  devanagari: भयङ्करी ॥ ५॥ इन्द्राणी पातु मे कर्णौ इन्द्रनाथा हनू मम । ग्रीवापार्श्वं महाशक्तिः ग्रीवां
    मे परमेश्वरी ॥ ६॥ कराली दक्षिणस्कन्धं वैष्णवी पातु वामकम् । शिवेशी दक्षदोर्मूलं शिवदूती च वामकम् ॥
    ७॥ अच्युता दक्षदोर्दण्डं अनन्ता पातु वामकम् । दक्षकूर्परमीशानी त्रिशूली पातु वामकम् ॥ ८॥ ज्वालामुखी
    प्रकोष्ठं मे पातु भद्रा च वामकम् । भैरवी मणिबन्धं मे वामं पातु महेश्वरी ॥ ९॥ करपृष्ठं तु वाराही विकटाङ्गी
    तु वामकम् । अघोरा दक्षिणाङ्गुष्ठं घोररूपा तु तर्जनीम् ॥ १०॥ मध्यमां रक्तकेशी चाऽनामिकां तु महाबला
    । माया कनिष्ठिकां पातु पर्वाणि विषनाशिनी ॥ ११॥ नखानि मे करालास्या वामाङ्गुष्ठं महोदरी । तर्जनीं रक्तचामुण्डी
    मेघनादा तु मध्यमाम् ॥ १२॥ अनामिकां रौद्रमुखी काली पातु कनिष्ठिकाम् । पर्वाणि कालरात्रिर्मे नारसिह्मी
    नखानि मे ॥ १३॥ जटिला दक्षिण कक्षं वामकक्षं पयस्विनी । वक्षो ज्वालामुखी पातु हृदयं कृष्णपिङ्गला ॥ १४॥
    नारायणी स्तनद्वन्द्वं रुद्राणी मस्तकाग्रकम् । जठरं भद्रकाली मे चण्डिका उदरं तथा ॥ १५॥ तद्दक्षिणमनन्ता
    मे तद्वामः ब्रह्मवादिनी । सावित्री पातु नाभिं मे गायत्री मे कटिद्वयम् ॥ १६॥ त्वरिता पातु मे गुह्यं
    पृष्ठभागं शतानना । योगेश्वरी गुदं पातु जघनं लोकमोहिनी ॥ १७॥ ऊरुयुग्मं वसुमतीं चण्डमुण्डा तु जानुनी
    । जङ्घे कात्यायनी पातु गुल्फे महिषमर्दिनी ॥ १८॥ शाकम्भरीं पादपृष्ठे गौरी पादाङ्गुलीर्मम । सूक्ष्मा
    पादतलं पातु पादपार्ष्वं धनञ्जया ॥ १९॥ सर्वाङ्गं पातु मे पुष्टिः सर्वसन्दिं मदप्रिया । ज्वालिनी रोमकूपाणि
    वसुधारा त्वचं मम ॥ २०॥ वसुधा चर्म मे पातु रुधिरं मदनावती । तीव्रा मांसद्वयं पातु भेदो मे विघ्ननाशिनी
    ॥ २१॥ ममास्थि भोगदा पातु मज्जां पातु परात्परा । पञ्चभूतं रतिःपातु शुक्लं मे कामरूपिणी ॥ २२॥ मूलाधारमुमा
    पातु स्वाधिष्ठानं चिदङ्कुरा । अमृता मणिपूरं मेऽनाहतं कमलेक्षणा ॥ २३॥ विशुद्धि पातु मे नादा
