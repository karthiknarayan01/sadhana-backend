id: vel-maaral-tamil
category: stotram
name:
  english: Vel Maaral (Tamil)
content:
  english: vallimalai sri caccitananta cuvamikal tòkuttaruliya arulum òruttanmalai viruttanèna ulattiluṟai
    karuttanmayil natattukukan vele pinvarum òvvoratiyin mutivilum ènṟa itattil meṟkanta mulu atiyaiyum
    kuṟaventum paruttamulai cirittitai vèluttanakai karittakulal civattital maṟaccirimi vilikkunikar akum
    arulum òruttanmalai viruttanèna ulattiluṟai karuttanmayil natattukukan vele ariya tiruppukalai uraittavarai
    atuttapakai arit èṟiya urikkièlum aṟattainilai kanum tarukkinaman murukkavarin èrukkumati tarittamuti
    pataittaviṟal pataittiṟai kalaṟkunikar akum panaikkaimuka patakkarata matattavala kajakkatavul patat
    ni kalattumulai tèṟikkavaram akum avunar ètirttarana kalattilvèku kuṟaittalaikal cirit èyiri katittuvili
    vilit òruvar kètukkitar ninaikkinavar kulattaimutal aṟakkalaiyum ènak talattilula kanattòkuti kalippinuna
    valaippa èna malarkkamala karattinmunai vitirkkavalai paluttamutu tamilppalakai irukkumòru kavippulavan
    icaik uruki varaikkukaiyai itittuvali kanum ticaikkiriyai mutaṟkulican arittaciṟai mulaitta èna mukattinitai
    paṟakkaṟa vicait cutarppariti òlippanila mati òlippalai atakkutalal òlippòlir òlippirapai vicum tanittuvali
    natakkumèna itattumòru valattumiru puṟattumaru alutu muṟaippatutal òlit utira ninattacaikal pucikkarul
    nerum tiraikkatalai utaittuniṟai punaṟkatitu kutit utiram niṟaittuvilai yatum maka patikkumviti tanakku
    narar tamakkumurim itukkanvinai catum calattuvarum arakkarutal kòluttuvalar pèruttakutar civattatòtai
    ènaccikaiyil viruppamòtu cutum maka patikkumviti tanakku narar tamakkumurim itukkanvinai catum calattuvarum
    arakkarutal kòluttuvalar pèruttakutar civattatòtai ènaccikaiyil viruppamòtu cutum alutu muṟaippatutal
    òlit utira ninattacaikal pucikkarul nerum tiraikkatalai utaittuniṟai punaṟkatitu kutit utiram niṟaittuvilai
    yatum cutarppariti òlippanila mati òlippalai atakkutalal òlippòlir òlippirapai vicum tanittuvali natakkumèna
    itattumòru valattumiru puṟattumaru paluttamutu tamilppalakai irukkumòru kavippulavan icaik uruki varaikkukaiyai
    itittuvali kanum ticaikkiriyai mutaṟkulican arittaciṟai mulaitta èna mukattinitai paṟakkaṟa vicait
    òruvar kètukkitar ninaikkinavar kulattaimutal aṟakkalaiyum ènak talattilula kanattòkuti kalippinuna
    valaippa èna malarkkamala karattinmunai vitirkkavalai panaikkaimuka patakkarata matattavala kajakkatavul
    patat ni kalattumulai tèṟikkavaram akum avunar ètirttarana kalattilvèku kuṟaittalaikal cirit èyiri
    katittuvili vilit ariya tiruppukalai uraittavarai atuttapakai arit èṟiya urikkièlum aṟattainilai kanum
    tarukkinaman murukkavarin èrukkumati tarittamuti pataittaviṟal pataittiṟai kalaṟkunikar akum paruttamulai
    cirittitai vèluttanakai karittakulal civattital maṟaccirimi vilikkunikar akum arulum òruttanmalai
    viruttanèna ulattiluṟai karuttanmayil natattukukan vele tarukkinaman murukkavarin èrukkumati tarittamuti
    pataittaviṟal pataittiṟai kalaṟkunikar akum ariya tiruppukalai uraittavarai atuttapakai arit èṟiya
    urikkièlum aṟattainilai kanum arulum òruttanmalai viruttanèna ulattiluṟai karuttanmayil natattukukan
    vele paruttamulai cirittitai vèluttanakai karittakulal civattital maṟaccirimi vilikkunikar akum talattilula
    kanattòkuti kalippinuna valaippa èna malarkkamala karattinmunai vitirkkavalai òruvar kètukkitar ninaikkinavar
    kulattaimutal aṟakkalaiyum ènak avunar ètirttarana kalattilvèku kuṟaittalaikal cirit èyiri katittuvili
    vilit panaikkaimuka patakkarata matattavala kajakkatavul patat ni kalattumulai tèṟikkavaram akum tanittuvali
    natakkumèna itattumòru valattumiru puṟattumaru cutarppariti òlippanila mati òlippalai atakkutalal
    òlippòlir òlippirapai vicum ticaikkiriyai mutaṟkulican arittaciṟai mulaitta èna mukattinitai paṟakkaṟa
    vicait paluttamutu tamilppalakai irukkumòru kavippulavan icaik uruki varaikkukaiyai itittuvali kanum
    calattuvarum arakkarutal kòluttuvalar pèruttakutar civattatòtai ènaccikaiyil viruppamòtu cutum maka
    patikkumviti tanakku narar tamakkumurim itukkanvinai catum tiraikkatalai utaittuniṟai punaṟkatitu
    kutit utiram niṟaittuvilai yatum alutu muṟaippatutal òlit utira ninattacaikal pucikkarul nerum tiraikkatalai
    utaittuniṟai punaṟkatitu kutit utiram niṟaittuvilai yatum alutu muṟaippatutal òlit utira ninattacaikal
    pucikkarul nerum calattuvarum arakkarutal kòluttuvalar pèruttakutar civattatòtai ènaccikaiyil viruppamòtu
    cutum maka patikkumviti tanakku narar tamakkumurim itukkanvinai catum ticaikkiriyai mutaṟkulican arittaciṟai
    mulaitta èna mukattinitai paṟakkaṟa vicait paluttamutu tamilppalakai irukkumòru kavippulavan icaik
    uruki varaikkukaiyai itittuvali kanum tanittuvali natakkumèna itattumòru valattumiru puṟattumaru cutarppariti
    òlippanila mati òlippalai atakkutalal òlippòlir òlippirapai vicum avunar ètirttarana kalattilvèku
    kuṟaittalaikal cirit èyiri katittuvili vilit panaikkaimuka patakkarata matattavala kajakkatavul patat
    ni kalattumulai tèṟikkavaram akum talattilula kanattòkuti kalippinuna valaippa èna malarkkamala karattinmunai
    vitirkkavalai òruvar kètukkitar ninaikkinavar kulattaimutal aṟakkalaiyum ènak arulum òruttanmalai
    viruttanèna ulattiluṟai karuttanmayil natattukukan vele paruttamulai cirittitai vèluttanakai karittakulal
    civattital maṟaccirimi vilikkunikar akum tarukkinaman murukkavarin èrukkumati tarittamuti pataittaviṟal
    pataittiṟai kalaṟkunikar akum ariya tiruppukalai uraittavarai atuttapakai arit èṟiya urikkièlum aṟattainilai
    kanum arulum òruttanmalai viruttanèna ulattiluṟai karuttanmayil natattukukan vele mutivilum inta atiyai
    terani yittup puram èrit tanmakan cènkaiyilveṟ kurani yittanu vakik kirauncan kulaintarakkar nerani
    yittu valainta katakam nèlintu curp perani kèttatu teventra lokam pilaittatuve viravel taraivel vinnor
    ciṟai mitta tiravel cèvvel tirukkaivel vari kulittavel kòrravel curmarpum kunrim tòlaittavel unte
    tunai
  devanagari: वल्लिमलै स्री चच्चितानन्त चुवामिकल् तॊकुत्तरुलिय अरुलुम् ऒरुत्तन्मलै विरुत्तनॆन उलत्तिलुऱै
    करुत्तन्मयिल् नटत्तुकुकन् वेले पिन्वरुम् ऒव्वोरटियिन् मुटिविलुम् ऎन्ऱ इटत्तिल् मेऱ्कण्ट मुऴु अटियैयुं
    कूऱवेण्टुम् परुत्तमुलै चिऋत्तिटै वॆलुत्तनकै कऋत्तकुऴल् चिवत्तितऴ् मऱच्चिऋमि विऴिक्कुनिकर् आकुम् अरुलुम्
    ऒरुत्तन्मलै विरुत्तनॆन उलत्तिलुऱै करुत्तन्मयिल् नटत्तुकुकन् वेले अरिय तिरुप्पुकऴै उरैत्तवरै अटुत्तपकै
    अऋत् ऎऱिय उऋक्किऎऴुं अऱत्तैनिलै काणुम् तरुक्किनमन् मुरुक्कवरिन् ऎरुक्कुमति तरित्तमुटि पटैत्तविऱल्
    पटैत्तिऱै कऴऱ्कुनिकर् आकुम् पनैक्कैमुक पटक्करट मतत्तवल कजक्कटवुल् पतत् नि कलत्तुमुलै तॆऱिक्कवरं आकुम्
    अवुणर् ऎतिर्त्तरण कलत्तिल्वॆकु कुऱैत्तलैकल् चिरित् ऎयिऋ कटित्तुविऴि विऴित् ऒरुवर् कॆटुक्किटर् निनैक्किनवर्
    कुलत्तैमुतल् अऱक्कलैयुम् ऎनक् तलत्तिलुल कणत्तॊकुति कलिप्पिनुण वऴैप्प ऎन मलर्क्कमल करत्तिन्मुनै वितिर्क्कवलै
    पऴुत्तमुतु तमिऴ्प्पलकै इरुक्कुमॊरु कविप्पुलवन् इचैक् उरुकि वरैक्कुकैयै इटित्तुवऴि काणुम् तिचैक्किरियै
    मुतऱ्कुलिचन् अऋत्तचिऱै मुलैत्त ऎन मुकट्टिनिटै पऱक्कऱ विचैत् चुटर्प्परिति ऒलिप्पनिल मति ऒलिप्पलै अटक्कुतऴल्
    ऒलिप्पॊलिर् ऒलिप्पिरपै वीचुम् तनित्तुवऴि नटक्कुमॆन इटत्तुमॊरु वलत्तुमिरु पुऱत्तुमरु अऴुतु मुऱैप्पटुतल्
    ऒऴित् उतिर निणत्तचैकल् पुचिक्करुल् नेरुम् तिरैक्कटलै उटैत्तुनिऱै पुनऱ्कटितु कुटित् उतिरं निऱैत्तुविलै
    याटुम् मक पतिक्कुम्विति तनक्कु नरर् तमक्कुमुऋम् इटुक्कण्विनै चाटुम् चलत्तुवरुं अरक्करुटल् कॊऴुत्तुवलर्
    पॆरुत्तकुटर् चिवत्ततॊटै ऎनच्चिकैयिल् विरुप्पमॊटु चूटुम् मक पतिक्कुम्विति तनक्कु नरर् तमक्कुमुऋम् इटुक्कण्विनै
    चाटुम् चलत्तुवरुं अरक्करुटल् कॊऴुत्तुवलर् पॆरुत्तकुटर् चिवत्ततॊटै ऎनच्चिकैयिल् विरुप्पमॊटु चूटुम्
    अऴुतु मुऱैप्पटुतल् ऒऴित् उतिर निणत्तचैकल् पुचिक्करुल् नेरुम् तिरैक्कटलै उटैत्तुनिऱै पुनऱ्कटितु कुटित्
    उतिरं निऱैत्तुविलै याटुम् चुटर्प्परिति ऒलिप्पनिल मति ऒलिप्पलै अटक्कुतऴल् ऒलिप्पॊलिर् ऒलिप्पिरपै वीचुम्
    तनित्तुवऴि नटक्कुमॆन इटत्तुमॊरु वलत्तुमिरु पुऱत्तुमरु पऴुत्तमुतु तमिऴ्प्पलकै इरुक्कुमॊरु कविप्पुलवन्
    इचैक् उरुकि वरैक्कुकैयै इटित्तुवऴि काणुम् तिचैक्किरियै मुतऱ्कुलिचन् अऋत्तचिऱै मुलैत्त ऎन मुकट्टिनिटै
    पऱक्कऱ विचैत् ऒरुवर् कॆटुक्किटर् निनैक्किनवर् कुलत्तैमुतल् अऱक्कलैयुम् ऎनक् तलत्तिलुल कणत्तॊकुति कलिप्पिनुण
    वऴैप्प ऎन मलर्क्कमल करत्तिन्मुनै वितिर्क्कवलै पनैक्कैमुक पटक्करट मतत्तवल कजक्कटवुल् पतत् नि कलत्तुमुलै
    तॆऱिक्कवरं आकुम् अवुणर् ऎतिर्त्तरण कलत्तिल्वॆकु कुऱैत्तलैकल् चिरित् ऎयिऋ कटित्तुविऴि विऴित् अरिय तिरुप्पुकऴै
    उरैत्तवरै अटुत्तपकै अऋत् ऎऱिय उऋक्किऎऴुं अऱत्तैनिलै काणुम् तरुक्किनमन् मुरुक्कवरिन् ऎरुक्कुमति तरित्तमुटि
    पटैत्तविऱल् पटैत्तिऱै कऴऱ्कुनिकर् आकुम् परुत्तमुलै चिऋत्तिटै वॆलुत्तनकै कऋत्तकुऴल् चिवत्तितऴ् मऱच्चिऋमि
    विऴिक्कुनिकर् आकुम् अरुलुम् ऒरुत्तन्मलै विरुत्तनॆन उलत्तिलुऱै करुत्तन्मयिल् नटत्तुकुकन् वेले तरुक्किनमन्
    मुरुक्कवरिन् ऎरुक्कुमति तरित्तमुटि पटैत्तविऱल् पटैत्तिऱै कऴऱ्कुनिकर् आकुम् अरिय तिरुप्पुकऴै उरैत्तवरै
    अटुत्तपकै अऋत् ऎऱिय उऋक्किऎऴुं अऱत्तैनिलै काणुम् अरुलुम् ऒरुत्तन्मलै विरुत्तनॆन उलत्तिलुऱै करुत्तन्मयिल्
    नटत्तुकुकन् वेले परुत्तमुलै चिऋत्तिटै वॆलुत्तनकै कऋत्तकुऴल् चिवत्तितऴ् मऱच्चिऋमि विऴिक्कुनिकर् आकुम्
    तलत्तिलुल कणत्तॊकुति कलिप्पिनुण वऴैप्प ऎन मलर्क्कमल करत्तिन्मुनै वितिर्क्कवलै ऒरुवर् कॆटुक्किटर् निनैक्किनवर्
    कुलत्तैमुतल् अऱक्कलैयुम् ऎनक् अवुणर् ऎतिर्त्तरण कलत्तिल्वॆकु कुऱैत्तलैकल् चिरित् ऎयिऋ कटित्तुविऴि
    विऴित् पनैक्कैमुक पटक्करट मतत्तवल कजक्कटवुल् पतत् नि कलत्तुमुलै तॆऱिक्कवरं आकुम् तनित्तुवऴि नटक्कुमॆन
    इटत्तुमॊरु वलत्तुमिरु पुऱत्तुमरु चुटर्प्परिति ऒलिप्पनिल मति ऒलिप्पलै अटक्कुतऴल् ऒलिप्पॊलिर् ऒलिप्पिरपै
    वीचुम् तिचैक्किरियै मुतऱ्कुलिचन् अऋत्तचिऱै मुलैत्त ऎन मुकट्टिनिटै पऱक्कऱ विचैत् पऴुत्तमुतु तमिऴ्प्पलकै
    इरुक्कुमॊरु कविप्पुलवन् इचैक् उरुकि वरैक्कुकैयै इटित्तुवऴि काणुम् चलत्तुवरुं अरक्करुटल् कॊऴुत्तुवलर्
