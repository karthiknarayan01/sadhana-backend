id: kedarasahasranamastotram-brahmandapuranantargatam
category: sahasranama
name:
  english: kedarasahasranamastotram (brahmandapuranantargatam)
  devanagari: केदारसहस्रनामस्तोत्रम् (ब्रह्माण्डपुराणान्तर्गतम्)
content:
  english: mantrarajo mantrarupo mantrapunyaphalapradah | gurumandalarupastho gurumandalakaranah || 10||
    tithimandalarupashca vriddhikshayavivarjitah | tithirupastithipritastithilavanyasundarah || 11|| prathamah
    prathamakaro dvitiyah shaktisamyutah | gunatrayatritiyo'sau yugarupashcaturthakah || 12|| pancabhutatmasakshisha
    ritushadgunabhavanah | saptadhatusvarupo'sau ashtamashcashtasiddhidah || 13|| navanatho navamyastho
    dashadigrupadharakah | rudra ekadashakaro dvadashadityadipagah || 14|| sarvasiddhistrayodashyo manurupacaturdashah
    | purnarupastripancasthah tripancatitamanasah || 15|| rakaro brahmarupashca vakaro vishnuravyayah
    | lakarashshivarupo'sau shrinathah prakritishvarah || 16|| akaradikshakarantavarnasankaramantragah
    | vyanjano vyanjanatito visargah svarabhushanah || 17|| anantah cavyayastvadya adishaktirvarapradah
    | ananda adyasamsthana adyakaranalakshanah || 18|| karta karayita karyah karyakaranabhavagah | kalanathah
    kalatitah kavyanatakabodhakah || 19|| kalahanta kalasadhyah kalavaktripravartakah | kalagni rudrasandiptah
    kalantakabhayankarah || 20|| khadgishah khadganathashcah khadgashaktiparayanah | garvaghno daityasamharta
    gamagamavivarjitah || 21|| ghanashyamo ghananando ghanadharapravartakah | ghanakarta ghanatrata ghanabijasamriddhidah
    || 22|| onkarabijasadhyashca nadavarnanasangakah | catvarakavarnarupah caturashramanishcayah || 23||
    chandahsarashchandahkarta chandaso 'nvayadharakah | chatrasimhasanadhisho bhaktacchatrasamriddhiman
    || 24|| japo japapriyo japyo japasiddhipradayakah | japasankhya japakarah sarvamantrajapapriyah ||
    25|| jhasharupadharo devo jhashavriddhivivardhakah | yamashasanakarta ca yamapujyo dhanadhipah ||
    26|| tankayudhah shivaprito thakaralangalashrayah | damarupritidamaryah tantradamarasthapakah || 27||
    dhakaradhavaladhyanah pashupashavimocakah | navarnajapasupritah tantravigrahavigrahah || 28|| sthagitacittacittastho
    dayarupo dayakarah | dhanado dhananathashca dhanadhanyapradayakah || 29|| nararupo narashreshtho narottamo
    naradhipah | narasamsthanakarta ca narah sarvatravyapakah || 30|| nado nadapriyo nadyo nadabrahmandapurakah
    | nadajnanarato nityanadantapadadayakah || 31|| palarupah palatitah palaksharavilakshanah | padasankhyaksharo
    varnah sankhyasanketakarakah || 32|| phaladah phaladata ca phalakarta phalapriyah | phalashrayah phalatitah
    phalamuktiniranjanah || 33|| balarupo balaprito balashrayo nirashrayah | balanando balagramo balisho
    balanayakah || 34|| bhavishyajno bhayatrata bhayakarta bhayariha | bhavanarupadhyanastho bhavarthaphaladayakah
    || 35|| manahstho manumadhyastho manomayavivarjitah | manahsantapaharta ca munimanasamohanah || 36||
    manahkalpitakalpasthah kalpanapuranalayah | manahsankalpasankalpo manahsankalpapurakah || 37|| manahsvacchandakarta
    ca chandamanasatoshakah | manaso manasakshistho manasollasakaranah || 38|| manatitah svayammanyo bhaktamanasasamshrayah
    | manahkamadivacamsho manobuddhivivarjitah || 39|| yashasvi ca yashahkarta yakshesho yakshanayakah
    | yashomargo yashahprapto yashomargasudipakah || 40|| rakarashcagnibijastho ravalakhyanakirtanah |
    ratnaprabho ratnadipto ratnasuravadhotsavah || 41|| ratinatho ratiprito ratilavanyasundarah | ramapriyakaro
    ramyo ramasamyamahotsavah || 42|| ratnacalanivasastho ratnabhushanabhushanah | ratnesho ratnadata
    ca ratnavikramavigrahah || 43|| layayogo layadhyeyo layasadhanasadhakah | layalayajito labhyo labdhavanchapravartakah
    || 44|| vardhamano vriddharupo vriddhabhaktipriyottamah | vanastho vanarupastho vanakridaparayanah
    || 45|| vayotito vayastripto varuno varunalayah | varshakalo varsharupo varshanto varshanakramah ||
    46|| shaktirupah shaktidata sarvashaktipatih prabhuh | shaktinathah shaktijitah shaktah shakterupasakah
    || 47|| shanmasayanakarta ca vishuvadivibhavakah | ritukarta rituprita ritushadvigrahashrayah || 48||
    sarvatrasarvadapujyo sarvapujakarakshakah | sarvasaubhagyanityastho nityarcanaratashrayah || 49||
    sadacararato nityo nityashrayo nirashrayah | sarvavarnamayo varno varnadharmaparayanah || 50|| sarvajnah
    sarvagah sarvah sarvajit sarvanayakah | sarvantarah sarvavyapi sarvakarmapravartakah || 51|| sarvarthasadhakah
    sadhyah siddhisadhanasadhakah | sadhanopayadata ca sadhanashrayadayakah || 52|| hayasanasamarudho
    hayanatho hayadhipah | havirbhokta havihprito havyavahanahavyakrit || 53|| lakaravarnabhedastho laghurupo
    laghukriyah | sthularupah sthulakaryah sthulasthulavishalagah || 54|| kshamarupo dayasindhuh kshamalakshanadayakah
    | kshamakarah kshamanathah kshamapuritalocanah || 55|| kshamacintanapritasthah kshamasadhanasadhakah
    | kshamavadbhiratipritah kshamasancaranonmukhah || 56|| onkaramulamantrastho matrikarnavasambhavah
    | matrikavyapitabrahma matrikasiddhidayakah || 57|| shatcakrabhedakarta ca shatcakrashrayasamshrayah
    | shatcakramatrikavyaptah shatcakravarnalakshanah || 58|| muladharanivasashca ganeshah siddhidayakah
    | svadhishthane brahmarupah prajasrijanakaranah || 59|| manipure mahavishnuh icchashaktisamanvitah
    | anahate mahadevo dravyashaktisamahitah || 60|| jivarupo vishuddhastho pranashaktisukhashrayah |
    hamsarno gururuposau hamsamantrarthamantragah || 61|| sahasrare sahasrakshah shirshapadasahasravan
    | sahasrayudhahastashca varnasahasrakarnikah || 62|| saccinmayasamadhistho bindurupasukhashrayah |
    sarvalakshanasampannah sarvatrasarvatomukhah || 63|| sarvajapriticitto'sau sarvajnanapriyottamah |
    sarvasamsthanadevasthah sarvashaktisamanvitah || 64|| sarveshvarah sarvakaryah karyakaranavarjitah
    | jyotirmayo jagatsakshi jyotirvijjyotirashrayah || 65|| jyotirlayo jyotirmurtih jyotihkarta jaganmayah
    | lingacinhitasarvango lingarcanapriyottamah || 66|| ekakalo dvikalashca trikalah sarvakalikah | kalakarta
    kalanemi kalasankhyagnidipakah || 67|| upasakapriyopasya upasakapriyankarah | mahakalo maharupo mahashuro
    mahotsavah || 68|| mahabhago mahavego mahayogo mahanidhih | mahanirvanarupasthah cittanirvanadarshakah
    || 69|| mahabodho mahayoddho svastrapratyastravarshakah | mahayagahavirbhokta mahakarmaphalapradah
    || 70|| brahmajno brahmarupashca brahmanyo brahmanottamah | brahmakarmakriyasaktah karmabrahmasvarupakah
    || 71|| kshetrajnah kshetrapalashca kshetrakirtanavardhanah | kshatradharmapravinashca khyatikarta
    kshayatigah || 72|| vishvarupo vishvakarta vishvasaphaladayakah | munidhyeyo munitrata munimanasahamsakah
    || 73|| icchajnanakriyatita icchajnanakriyashrayah | vanchakalpalatarupah kalpanavanchitapradah ||
    74|| kalpavrikshah kalpanathah kalpanakaramanasah | kalpakarta kalpasakshi mahakalpapravartakah ||
    75|| samagayanasupritah samavedapravartakah | vedasaro vedagamyo vedavedangaparagah || 76|| vedantabhashyarupastho
    vedantapritidayakah | bhashyalakshanavedantah siddhantah sarvadarshakah || 77|| shastrarthah shastrakarta
    ca shastramargapravartakah | shastrashasanapraptisthah shastradharajaganmayah || 78|| anandarupanityasthah
    prakashanandarupakah | akhandanandadata ca purnanandasvarupavan || 79|| niradharo nirakaro nirmalo
    nirmalashrayah | nirguno nirgunatito nishkamo nirupadravah || 80|| nityamukto nirvikaro nishprapanco
    nirashrayah | nityashuddho nityasadhyo nityanandavarapradah || 81|| nishkarano nishkalanko nirupadhirnirishvarah
    | nirmado madahanta ca nishcinto nirahankritih || 82|| nirmoho mohanashashca nirmamo mamataharah |
    nishpapah papanashashca nishkrodhah krodhanashakah || 83|| nihsamshayah samshayaghno nirlobho lobhanashakah
    | nirbhavo bhavanashashca nirvikalpo vikalpahrit || 84|| nirbhedo bhedahanta ca nirnasho mrityunashakah
    | nindadveshatitakarta nindadveshapaharakah || 85|| gopalo gomatiprito godhanadhipa ishvarah | gosakshi
    gopravarta ca gorakshako guhashrayah || 86|| grahanakshatratarasthah tarakajyotirdayakah | taranashrayarupasthah
    taranashrayadayakah || 87|| tarakah tarakasvami taranastaranapriyah | ekataro dvitarashca tritaro
    mantrakashrayah || 88|| ekarupa ekanatho bahurupasvarupavan | lokasakshi trilokeshah trigunatitamurtiman
    || 89|| yajnapriyo yajnakarta yajamanasvarupavan | yajurvedo yajuhsakshi yajurvedahavihpriyah || 90||
    balatarunyarupastho vriddharupapradarshakah | avasthatrayabhutastho avasthatrayavarjitah || 11|| vakcatvarakanirmano
    vacatitaprakashavan | vacyavacakabhavartho vakyarthapriyamanasah || 12|| mahavakyapramanastho mahavakyarthabodhakah
    | arthasakshyartharupashca jyotirupah prakashavan || 93|| jitaharo jitakrodho jitamanasamanasah |
    paramanuh pramanasthah kotibrahmandanayakah || 94|| shrikrishno dvarakanatho gopikabhogadayakah |
    kamsarih putanahanta samsarashramanashakah || 95|| mukundo muktidata ca mukto muktajanashrayah | mucukundavaraprito
    daityasamharakarakah || 96|| nadasakto nadakarta venuvadanatatparah | gopikamanahsamharta gopabalakanayakah
    || 97|| govardhanadharo guptabhavanaguptasamjnakah | bhavanapuranashreshtho bhavabhavavivarjitah ||
    98|| naranarayano vishnuh karyakaranarupavan | karyasakshi karyarupi karyakaryapravartakah || 99||
    pannagah pannagadhishah pannagasanavigrahah | pancashadvarnapithastho pancaksharajapapriyah || 100||
    svaravikritikarta ca svaratitah svayamvibhuh | svargatah svargaterdata niyanta niyatashrayah || 101||
    bhumirupo bhumikarta bhudharo bhudharashrayah | bhutanatho bhutakarta bhutasamharakarakah | bhutavaso
    bhupatishca bhutabhadrapradayakah || 102|| bhavishyajno bhayatrata bhavado bhavaharakah | varado varadata
    ca varaprito varapradah || 103|| kutasthah kutarupasthah trikuto mantravigrahah | mantrartho mantragamyashca
    mantramsho mantrabhagakah || 104|| siddhimantrah siddhidata japasiddhisvabhagakah | namatito namarupo
    namarupagunashrayah || 105|| gunakarta gunatrata gunitito gunariha | gunaprapto gunadhisho gunanirgunakarakah
    || 106|| akaramatrirupastha akaratitabhavanah | paramaishvaryadata ca paramapritidayakah || 107||
    paramah paramanandah paranandaparayanah | vaikunthapitharupastho vaikuntho vishnuvigrahah || 108||
    kailasavasi kailasah shivarupah shivapradah | jatajutabhushitango bhasmadhusarabhushanah || 109||
    digvilaso digvibhago digantaranivasakah | dhyanakarta dhyanamurtih dharanadharanapriyah || 110|| tattvasthastattvarupasthah
    tattvatito'titattvavit | tattvasamyastattvagamyah tattvarthastattvadarshakah || 111|| tattvasarastattvamargah
    tattvantastattvavigrahah | tattveshvarastattvanathah tattvadastattvakaranah || 112|| darshanatitagodrishyo
    drishyatito'tidarshakah | darshano darshanatito bhavanakararupadhrik || 113|| maniparvatasamsthano
    manibhushanabhushanah | maniprito manisrashta manistho manirupakah || 114||
  devanagari: मन्त्रराजो मन्त्ररूपो मन्त्रपुण्यफलप्रदः । गुरुमण्डलरूपस्थो गुरुमण्डलकारणः ॥ १०॥ तिथिमण्डलरूपश्च
    वृद्धिक्षयविवर्जितः । तिथिरूपस्तिथिप्रीतस्तिथिलावण्यसुन्दरः ॥ ११॥ प्रथमः प्रथमाकारो द्वितीयः शक्तिसंयुतः
    । गुणत्रयतृतीयोऽसौ युगरूपश्चतुर्थकः ॥ १२॥ पञ्चभूतात्मसाक्षीश ऋतुषड्गुणभावनः । सप्तधातुस्वरूपोऽसौ अष्टमश्चाष्टसिद्धिदः
    ॥ १३॥ नवनाथो नवम्यस्थो दशदिग्रूपधारकः । रुद्र एकादशाकारो द्वादशादित्यदीपगः ॥ १४॥ सर्वसिद्धिस्त्रयोदश्यो
    मनुरूपचतुर्दशः । पूर्णरूपस्त्रिपञ्चस्थः त्रिपञ्चातीतमानसः ॥ १५॥ रकारो ब्रह्मरूपश्च वकारो विष्णुरव्ययः
    । लकारश्शिवरूपोऽसौ श्रीनाथः प्रकृतीश्वरः ॥ १६॥ अकारादिक्षकारान्तवर्णसङ्करमन्त्रगः । व्यञ्जनो व्यञ्जनातीतो
    विसर्गः स्वरभूषणः ॥ १७॥ अनन्तः चाव्ययस्त्वाद्य आदिशक्तिर्वरप्रदः । आनन्द आद्यसंस्थान आद्यकारणलक्षणः
    ॥ १८॥ कर्ता कारयिता कार्यः कार्यकारणभावगः । कलानाथः कलातीतः काव्यनाटकबोधकः ॥ १९॥ कालहन्ता कालसाध्यः
    कालवक्तृप्रवर्तकः । कालाग्नी रुद्रसन्दीप्तः कालान्तकभयङ्करः ॥ २०॥ खड्गीशः खड्गनाथश्चः खड्गशक्तिपरायणः
    । गर्वघ्नो दैत्यसंहर्ता गमागमविवर्जितः ॥ २१॥ घनश्यामो घनानन्दो घनधाराप्रवर्तकः । घनकर्ता घनत्राता
    घनबीजसमृद्धिदः ॥ २२॥ ओङ्कारबीजसाध्यश्च नादवर्णनसाङ्गकः । चत्वारकवर्णरूपः चतुराश्रमनिश्चयः ॥ २३॥ छन्दःसारश्छन्दःकर्ता
    छन्दसो ऽन्वयधारकः । छत्रसिंहासनाधीशो भक्तच्छत्रसमृद्धिमान् ॥ २४॥ जपो जपप्रियो जाप्यो जपसिद्धिप्रदायकः
    । जपसङ्ख्या जपाकारः सर्वमन्त्रजपप्रियः ॥ २५॥ झषरूपधरो देवो झषवृद्धिविवर्धकः । यमशासनकर्ता च यमपूज्यो
    धनाधिपः ॥ २६॥ टङ्कायुधः शिवप्रीतो ठकारलाङ्गलाश्रयः । डमरुप्रीतिडामर्यः तन्त्रडामरस्थापकः ॥ २७॥ ढकारढवलाध्यानः
    पशुपाशविमोचकः । नवार्णजपसुप्रीतः तन्त्रविग्रहविग्रहः ॥ २८॥ स्थगितचित्तचित्तस्थो दयारूपो दयाकरः । धनदो
    धननाथश्च धनधान्यप्रदायकः ॥ २९॥ नररूपो नरश्रेष्ठो नरोत्तमो नराधिपः । नरसंस्थानकर्ता च नरः सर्वत्रव्यापकः
    ॥ ३०॥ नादो नादप्रियो नाद्यो नादब्रह्माण्डपूरकः । नादज्ञानरतो नित्यनादान्तपददायकः ॥ ३१॥ पलरूपः पलातीतः
    पलक्षारविलक्षणः । पदसङ्ख्याक्षरो वर्णः सङ्ख्यासङ्केतकारकः ॥ ३२॥ फलदः फलदाता च फलकर्ता फलप्रियः । फलाश्रयः
    फलातीतः फलमुक्तिनिरञ्जनः ॥ ३३॥ बलरूपो बलप्रीतो बलाश्रयो निराश्रयः । बलानन्दो बलग्रामो बलिशो बलनायकः
    ॥ ३४॥ भविष्यज्ञो भयत्राता भयकर्ता भयारिहा । भावनारूपध्यानस्थो भावार्थफलदायकः ॥ ३५॥ मनःस्थो मनुमध्यस्थो
    मनोमायाविवर्जितः । मनःसन्तापहर्ता च मुनिमानसमोहनः ॥ ३६॥ मनःकल्पितकल्पस्थः कल्पनापूरणालयः । मनःसङ्कल्पसङ्कल्पो
    मनःसङ्कल्पपूरकः ॥ ३७॥ मनःस्वच्छन्दकर्ता च छन्दमानसतोषकः । मानसो मानसाक्षिस्थो मानसोल्लासकारणः ॥ ३८॥
    मानातीतः स्वयम्मान्यो भक्तमानससंश्रयः । मनःकामादिवाचांशो मनोबुद्धिविवर्जितः ॥ ३९॥ यशस्वी च यशःकर्ता
    यक्षेशो यक्षनायकः । यशोमार्गो यशःप्राप्तो यशोमार्गसुदीपकः ॥ ४०॥ रकारश्चाग्निबीजस्थो रवलाख्यानकीर्तनः
    । रत्नप्रभो रत्नदीप्तो रत्नासुरवधोत्सवः ॥ ४१॥ रतिनाथो रतिप्रीतो रतिलावण्यसुन्दरः । रमाप्रियकरो रम्यो
    रमासाम्यमहोत्सवः ॥ ४२॥ रत्नाचलनिवासस्थो रत्नभूषणभूषणः । रत्नेशो रत्नदाता च रत्नविक्रमविग्रहः ॥ ४३॥
    लययोगो लयध्येयो लयसाधनसाधकः । लयालयजितो लभ्यो लब्धवाञ्छाप्रवर्तकः ॥ ४४॥ वर्धमानो वृद्धरूपो वृद्धभक्तिप्रियोत्तमः
    । वनस्थो वनरूपस्थो वनक्रीडापरायणः ॥ ४५॥ वयोतीतो वयस्तृप्तो वरुणो वरुणालयः । वर्षाकालो वर्षरूपो वर्षान्तो
    वर्षणक्रमः ॥ ४६॥ शक्तिरूपः शक्तिदाता सर्वशक्तिपतिः प्रभुः । शक्तिनाथः शक्तिजितः शक्तः शक्तेरुपासकः
    ॥ ४७॥ षण्मासायनकर्ता च विषुवादिविभावकः । ऋतुकर्ता ऋतुप्रीत ऋतुषड्विग्रहाश्रयः ॥ ४८॥ सर्वत्रसर्वदापूज्यो
    सर्वपूजकरक्षकः । सर्वसौभाग्यनित्यस्थो नित्यार्चनरताश्रयः ॥ ४९॥ सदाचाररतो नित्यो नित्याश्रयो निराश्रयः
    । सर्ववर्णमयो वर्णो वर्णधर्मपरायणः ॥ ५०॥ सर्वज्ञः सर्वगः सर्वः सर्वजित् सर्वनायकः । सर्वान्तरः सर्वव्यापी
    सर्वकर्मप्रवर्तकः ॥ ५१॥ सर्वार्थसाधकः साध्यः सिद्धिसाधनसाधकः । साधनोपायदाता च साधनाश्रयदायकः ॥ ५२॥
    हयासनसमारूढो हयनाथो हयाधिपः । हविर्भोक्ता हविःप्रीतो हव्यवाहनहव्यकृत् ॥ ५३॥ लकारवर्णभेदस्थो लघुरूपो
    लघुक्रियः । स्थूलरूपः स्थूलकार्यः स्थूलास्थूलविशालगः ॥ ५४॥ क्षमारूपो दयासिन्धुः क्षमालक्षणदायकः ।
    क्षमाकारः क्षमानाथः क्षमापूरितलोचनः ॥ ५५॥ क्षमाचिन्तनप्रीतस्थः क्षमासाधनसाधकः । क्षमावद्भिरतिप्रीतः
    क्षमासञ्चरणोन्मुखः ॥ ५६॥ ओङ्कारमूलमन्त्रस्थो मातृकार्णवसम्भवः । मातृकाव्यापितब्रह्म मातृकासिद्धिदायकः
    ॥ ५७॥ षट्चक्रभेदकर्ता च षट्चक्राश्रयसंश्रयः । षट्चक्रमातृकाव्याप्तः षट्चक्रवर्णलक्षणः ॥ ५८॥ मूलाधारनिवासश्च
    गणेशः सिद्धिदायकः । स्वाधिष्ठाने ब्रह्मरूपः प्रजासृजनकारणः ॥ ५९॥ मणिपूरे महाविष्णुः इच्छाशक्तिसमन्वितः
    । अनाहते महादेवो द्रव्यशक्तिसमाहितः ॥ ६०॥ जीवरूपो विशुद्धस्थो प्राणशक्तिसुखाश्रयः । हंसार्णो गुरुरूपोसौ
    हंसमन्त्रार्थमन्त्रगः ॥ ६१॥ सहस्रारे सहस्राक्षः शीर्षपादसहस्रवान् । सहस्रायुधहस्तश्च वर्णसाहस्रकर्णिकः
    ॥ ६२॥ सच्चिन्मयसमाधिस्थो बिन्दुरूपसुखाश्रयः । सर्वलक्षणसम्पन्नः सर्वत्रसर्वतोमुखः ॥ ६३॥ सर्वजप्रीतिचित्तोऽसौ
    सर्वज्ञानप्रियोत्तमः । सर्वसंस्थानदेवस्थः सर्वशक्तिसमन्वितः ॥ ६४॥ सर्वेश्वरः सर्वकार्यः कार्यकारणवर्जितः
    । ज्योतिर्मयो जगत्साक्षी ज्योतिर्विज्ज्योतिराश्रयः ॥ ६५॥ ज्योतिर्लयो ज्योतिर्मूर्तिः ज्योतिःकर्ता
    जगन्मयः । लिङ्गचिन्हितसर्वाङ्गो लिङ्गार्चनप्रियोत्तमः ॥ ६६॥ एककालो द्विकालश्च त्रिकालः सार्वकालिकः
    । कालकर्ता कालनेमी कालसङ्ख्याग्निदीपकः ॥ ६७॥ उपासकप्रियोपास्य उपासकप्रियङ्करः । महाकालो महारूपो महाशूरो
    महोत्सवः ॥ ६८॥ महाभागो महावेगो महायोगो महानिधिः । महानिर्वाणरूपस्थः चित्तनिर्वाणदर्शकः ॥ ६९॥ महाबोधो
    महायोद्धो स्वास्त्रप्रत्यस्त्रवर्षकः । महायागहविर्भोक्ता महाकर्मफलप्रदः ॥ ७०॥ ब्रह्मज्ञो ब्रह्मरूपश्च
    ब्रह्मण्यो ब्राह्मणोत्तमः । ब्रह्मकर्मक्रियासक्तः कर्मब्रह्मस्वरूपकः ॥ ७१॥ क्षेत्रज्ञः क्षेत्रपालश्च
    क्षेत्रकीर्तनवर्धनः । क्षात्रधर्मप्रवीणश्च ख्यातिकर्ता क्षयातिगः ॥ ७२॥ विश्वरूपो विश्वकर्ता विश्वासफलदायकः
    । मुनिध्येयो मुनित्राता मुनिमानसहंसकः ॥ ७३॥ इच्छाज्ञानक्रियातीत इच्छाज्ञानक्रियाश्रयः । वाञ्छाकल्पलतारूपः
    कल्पनावाञ्छितप्रदः ॥ ७४॥ कल्पवृक्षः कल्पनाथः कल्पनाकारमानसः । कल्पकर्ता कल्पसाक्षी महाकल्पप्रवर्तकः
    ॥ ७५॥ सामगायनसुप्रीतः सामवेदप्रवर्तकः । वेदसारो वेदगम्यो वेदवेदाङ्गपारगः ॥ ७६॥ वेदान्तभाष्यरूपस्थो
    वेदान्तप्रीतिदायकः । भाष्यलक्षणवेदान्तः सिद्धान्तः सर्वदर्शकः ॥ ७७॥ शास्त्रार्थः शास्त्रकर्ता च शास्त्रमार्गप्रवर्तकः
    । शास्त्रशासनप्राप्तिस्थः शास्त्राधारजगन्मयः ॥ ७८॥ आनन्दरूपनित्यस्थः प्रकाशानन्दरूपकः । अखण्डानन्ददाता
    च पूर्णानन्दस्वरूपवान् ॥ ७९॥ निराधारो निराकारो निर्मलो निर्मलाश्रयः । निर्गुणो निर्गुणातीतो निष्कामो
    निरुपद्रवः ॥ ८०॥ नित्यमुक्तो निर्विकारो निष्प्रपञ्चो निराश्रयः । नित्यशुद्धो नित्यसाध्यो नित्यानन्दवरप्रदः
    ॥ ८१॥ निष्कारणो निष्कलङ्को निरुपाधिर्निरीश्वरः । निर्मदो मदहन्ता च निश्चिन्तो निरहङ्कृतिः ॥ ८२॥ निर्मोहो
    मोहनाशश्च निर्ममो ममताहरः । निष्पापः पापनाशश्च निष्क्रोधः क्रोधनाशकः ॥ ८३॥ निःसंशयः संशयघ्नो निर्लोभो
    लोभनाशकः । निर्भावो भावनाशश्च निर्विकल्पो विकल्पहृत् ॥ ८४॥ निर्भेदो भेदहन्ता च निर्नाशो मृत्युनाशकः
    । निन्दाद्वेषातीतकर्ता निन्दाद्वेषापहारकः ॥ ८५॥ गोपालो गोमतिप्रीतो गोधनाधिप ईश्वरः । गोसाक्षी गोप्रवर्ता
    च गोरक्षको गुहाश्रयः ॥ ८६॥ ग्रहनक्षत्रतारस्थः तारकज्योतिर्दायकः । तारणाश्रयरूपस्थः तारणाश्रयदायकः
    ॥ ८७॥ तारकः तारकस्वामी तारणस्तारणप्रियः । एकतारो द्वितारश्च त्रितारो मन्त्रकाश्रयः ॥ ८८॥ एकरूप एकनाथो
    बहुरूपस्वरूपवान् । लोकसाक्षी त्रिलोकेशः त्रिगुणातीतमूर्तिमान् ॥ ८९॥ यज्ञप्रियो यज्ञकर्ता यजमानस्वरूपवान्
    । यजुर्वेदो यजुःसाक्षी यजुर्वेदहविःप्रियः ॥ ९०॥ बालतारुण्यरूपस्थो वृद्धरूपप्रदर्शकः । अवस्थात्रयभूतस्थो
    अवस्थात्रयवर्जितः ॥ ११॥ वाक्चत्वारकनिर्माणो वाचातीतप्रकाशवान् । वाच्यवाचकभावार्थो वाक्यार्थप्रियमानसः
    ॥ १२॥ महावाक्यप्रमाणस्थो महावाक्यार्थबोधकः । अर्थसाक्ष्यर्थरूपश्च ज्योतीरूपः प्रकाशवान् ॥ ९३॥ जिताहारो
    जितक्रोधो जितमानसमानसः । परमाणुः प्रमाणस्थः कोटिब्रह्माण्डनायकः ॥ ९४॥ श्रीकृष्णो द्वारकानाथो गोपिकाभोगदायकः
    । कंसारिः पूतनाहन्ता संसारश्रमनाशकः ॥ ९५॥ मुकुन्दो मुक्तिदाता च मुक्तो मुक्तजनाश्रयः । मुचुकुन्दवरप्रीतो
    दैत्यसंहारकारकः ॥ ९६॥ नादासक्तो नादकर्ता वेणुवादनतत्परः । गोपिकामनःसंहर्ता गोपबालकनायकः ॥ ९७॥ गोवर्धनधरो
    गुप्तभावनागुप्तसंज्ञकः । भावनापूरणश्रेष्ठो भावाभावविवर्जितः ॥ ९८॥ नरनारायणो विष्णुः कार्यकारणरूपवान्
    । कार्यसाक्षी कार्यरूपी कार्याकार्यप्रवर्तकः ॥ ९९॥ पन्नगः पन्नगाधीशः पन्नगासनविग्रहः । पञ्चाशद्वर्णपीठस्थो
    पञ्चाक्षरजपप्रियः ॥ १००॥ स्वरविकृतिकर्ता च स्वरातीतः स्वयंविभुः । स्वर्गतः स्वर्गतेर्दाता नियन्ता
    नियताश्रयः ॥ १०१॥ भूमिरूपो भूमिकर्ता भूधरो भूधराश्रयः । भूतनाथो भूतकर्ता भूतसंहारकारकः । भूतावासो
    भूपतिश्च भूतभद्रप्रदायकः ॥ १०२॥ भविष्यज्ञो भयत्राता भवदो भवहारकः । वरदो वरदाता च वरप्रीतो वरप्रदः
    ॥ १०३॥ कूटस्थः कूटरूपस्थः त्रिकूटो मन्त्रविग्रहः । मन्त्रार्थो मन्त्रगम्यश्च मन्त्रांशो मन्त्रभागकः
    ॥ १०४॥ सिद्धिमन्त्रः सिद्धिदाता जपसिद्धिस्वभागकः । नामातीतो नामरूपो नामरूपगुणाश्रयः ॥ १०५॥ गुणकर्ता
    गुणत्राता गुणीतीतो गुणारिहा । गुणप्राप्तो गुणाधीशो गुणनिर्गुणकारकः ॥ १०६॥ अकारमातृरूपस्थ अकारातीतभावनः
    । परमैश्वर्यदाता च परमप्रीतिदायकः ॥ १०७॥ परमः परमानन्दः परानन्दपरायणः । वैकुण्ठपीठरूपस्थो वैकुण्ठो
    विष्णुविग्रहः ॥ १०८॥ कैलासवासी कैलासः शिवरूपः शिवप्रदः । जटाजूटाभूषिताङ्गो भस्मधूसरभूषणः ॥ १०९॥ दिग्विलासो
    दिग्विभागो दिगन्तरनिवासकः । ध्यानकर्ता ध्यानमूर्तिः धारणाधारणप्रियः ॥ ११०॥ तत्त्वस्थस्तत्त्वरूपस्थः
    तत्त्वातीतोऽतितत्त्ववित् । तत्त्वसाम्यस्तत्त्वगम्यः तत्त्वार्थस्तत्त्वदर्शकः ॥ १११॥ तत्त्वसारस्तत्त्वमार्गः
    तत्त्वान्तस्तत्त्वविग्रहः । तत्त्वेश्वरस्तत्त्वनाथः तत्त्वदस्तत्त्वकारणः ॥ ११२॥ दर्शनातीतगोदृश्यो
    दृश्यातीतोऽतिदर्शकः । दर्शनो दर्शनातीतो भावनाकाररूपधृक् ॥ ११३॥ मणिपर्वतसंस्थानो मणिभूषणभूषणः । मणिप्रीतो
    मणिस्रष्टा मणिस्थो मणिरूपकः ॥ ११४॥
