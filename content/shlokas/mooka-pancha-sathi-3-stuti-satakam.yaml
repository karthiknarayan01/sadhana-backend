id: mooka-pancha-sathi-3-stuti-satakam
category: stotram
name:
  english: Mooka Pancha Sathi 3 - Stuti Satakam
content:
  english: pandityam parameshvari stutividhau naivashrayante giram vairincanyapi gumphanani vigaladgarvani
    sharvani te | stotum tvam pariphullanilanalinashyamakshi kamakshi mam vacalikurute tathapi nitaram
    tvatpadasevadarah || || tapinchastabakatvishe tanubhritam daridryamudradvishe samsarakhyatamomushe
    purariporvamankasimajushe | kampatiramupeyushe kavayatam jihvakutim jagmushe vishvatranapushe namo'stu
    satatam tasmai paranjyotishe || || ye sandhyarunayanti shankarajatakantaracanrarbhakam sinduranti
    ca ye purandaravadhusimantasimantare | punya m ye paripakkayanti bhajatam kancipure mamami payasuh
    parameshvarapranayinipadodbhavah pamsavah || || kamadambarapuraya shashiruca kamrasmitanam tvisha
    kamareranuragasindhumadhikam kallolitam tanvati | kamakshiti samastasajjananuta kalyanadatri nrinam
    karunyakulamanasa bhagavati kampatate jrimbhate || || kamakshinaparakramaprakatanam sambhavayanti
    drisha shyama kshirasahodarasmitaruciprakshalitashantara | kamakshijanamaulibhushanamanirvacam para
    devata kamakshiti vibhati kapi karuna kampatatinyastate || || shyama kacana candrika tribhuvane punyatmanamanane
    simashunyakavitvavarshajanani ya kapi kadambini | mararatimanovimohanavidhau kacitattamahkandali kamakshyah
    karunakatakshalahari kamaya me kalpatam || || praudhadhvantakadambake kumudinipunyankuram darshayan
    jyotsnasangamane'pi kokamithunam mishram samudbhavayan | kalindilaharidasham prakatayankamram nabhasyadbhutam
    kashcinnetramahotsavo vijayate kancipure shulinah || || tandrahinatamalanilasushamaistarunyalilagrihaih
    taranathakishoralanchitakacaistamraravindekshanaih | matah samshrayatam mano manasijapragalbhyanadindhamaih
    kampatiracarairghanastanabharaih punyankaraih shankaraih || || nityam nishcalatamupetya marutam rakshavidhim
    pushnati tejassancayapatavena kirananushnadyutermushnati | kancimadhyagatapi diptijanani vishvantare
    jrimbhate kaciccitramaho smritapi tamasam nirvapika dipika || || kantaih kesharucam cayairbhramaritam
    mandasmitaih pushpitam kantya pallavitam padamburuhayornetratvisha patritam | kampatiravanantaram
    vidadhati kalyanajanmasthali kancimadhyamahamanirvijayate kacitkripakandali || || rakacandrasamanakantivadana
    nakadhirajastuta mukanamapi kurvati suradhaninikashavagvaibhavam | shrikancinagarivihararasika shokapahantri
    satam eka punyaparampara pashupaterakarini rajate || || jata shitalashailatah sukritinam drishya param
    dehinam lokanam kshanamatrasamsmaranatah santapavicchedini | ashcaryam bahu khelanam vitanute naishcalyamabibhrati
    kampayastatasimni kapi tatini karunyapathomayi || || aikyam yena viracyate haratanau dambhavapumbhavuke
    rekha yatkacasimni shekharadasham naishakari gahate | aunnatyam muhureti yena sa mahanmenasakhah sanuman
    kampatiraviharina sasharanastenaiva dhamna vayam || || akshnoshca stanayoh shriya shravanayorbahvoshca
    mulam sprishan uttamsena mukhena ca pratidinam druhyanpayojanmane | madhuryena giram gatena mriduna
    hamsanganam hrepayan kancisimni cakasti ko'pi kavitasantanabijankurah || || khandam candramasam vatamsamanisham
    kancipure khelanam kalayashchavitaskarim tanurucim karnajape locane | tarunyoshmanakhampacam stanabharam
    janghasprisham kuntalam bhagyam deshikasancitam mama kada sampadayedambike || || tanvanam nijakelisaudhasaranim
    naisargikinam giram kedaram kavimallasuktilaharisasyashriyam shashvatam | amhovancanacuncu kincana
    bhaje kancipurimandanam paryayacchavi pakashasanamaneh paushpeshavam paurusham || || aloke mukhapankaje
    ca dadhati saudhakarim caturim cudalankriyamanapankajavanivairagamaprakriya | mugdhasmeramukhi ghansatanatatimurcchalamadhyancita
    kancisimani kamini vijayate kacijjaganmohini || || yasminnamba bhavatkataksharajani mande'pi mandasmita
    jyotsnasamsnapita bhavatyabhimukhi tam pratyaho dehinam | drakshamakshikamadhurimadabharavridakari
    vaikhari kamakshi svayamatanotyabhisritim vamekshaneva kshanam || || kalindijalakantayah smitarucisvarvahinipathasi
    praudhadhvantarucah sphutadharamaholauhityasandhyodaye | manikyopalakundalamshushikhini vyamishradhumashriyah
    kalyanaikabhuvah katakshasushamah kamakshi rajanti te || || kalakalaranatkanci kancivibhushanamalika
    kacabharalasaccandra candravatamsasadharmini | kavikulagirah shravamshravam milatpulakankura viracitashirahkampa
    kampatate parishobhate || || sarasavacasam vici nicibhavanmadhumadhuri bharitabhuvana kirtirmurtirmanobhavajitvari
    | janani manaso yogyam bhogyam nrinam tava jayate kathamiva vina kancibhushe katakshatarangitam ||
    || bhramaritasaritkulo nilotpalaprabhaya''bhaya natajanatamahkhandi tundirasimni vijrimbhate | acalatapasamekah
    pakah prasunasharasana pratibhatamanohari narikulaikashikhamanih || || madhuravacaso mandasmera matangajagaminah
    tarunimajushastapicchabhastamahparipanthinah | kucabharanatah kuryurbhadram kurangavilocanah kalitakarunah
    kancibhajah kapalimahotsavah || || kamalasushamakshyarohe vicakshanavikshanah kumudasukritakridacudalakuntalabandhurah
    | rucirarucibhistapicchashriprapancanacuncavah puravijayinah kampatire sphuranti manorathah || ||
    kalitaratayah kancililavidhau kavimandali vacanalaharivasantinam vasantavibhutayah | kushalavidhaye
    bhuyasurme kurangavilocanah kusumavishikharaterakshnam kutuhalavibhramah || || kabalitatamaskandastundiramandalamandanah
    sarasijavanisantananamaruntudashekharah | nayanasaranernediyamsah kada nu bhavanti me tarunajaladashyamah
    shambhostapahphalavibhramah || || acaramamishum dinam minadhvajasya mukhashriya sarasijabhuvo yanam
    mlanam gatena ca manjuna | tridashasadasamannam khinnam gira ca vitanvati tilakayati sa kampatiram
    trilocanasundari || || janani bhuvane cankramye'ham kiyantamanehasam kupurushakarabhrashtairdushtairdhanairudarambharih
    | tarunakarune tandrashunye tarangaya locane namati mayi te kincitkancipurimanidipike || || munijanamanahpetiratnam
    sphuratkarunanati viharanakalageham kancipurimanibhushanam | jagati mahato mohavyadhernrinam paramaushadham
    puraharadrisham saphalyam me purah parijrimbhatam || || munijanamodhamne dhamne vacomayajahnavi himagiritatapragbharayaksharaya
    paratmane | viharanajushe kancideshe maheshvaralocana tritayasarasakridasaudhanganaya namo namah ||
    || marakatarucam pratyadesham maheshvaracakshusham amritalaharipuram param bhavakhyapayonidheh | sucaritaphalam
    kancibhajo janasya pacelimam himashikharino vamshasyaikam vatamsamupasmahe || || pranamanadinarambhe
    kampanadisakhi tavake sarasakavitonmeshah pusha satam samudancitah | pratibhatamahapraudhaprodyatkavitvakumudvatim
    nayati tarasa nidramudram nageshvarakanyake || || shamitajadimarambha kampatatinikatecari nihataduritastoma
    somardhamudritakuntala | phalitasumanovancha pancayudhi paradevata saphalayatu me netre gotreshvarapriyanandini
    || || mama tu dhishana pidya jadyatireka katham tvaya kumudasushamamaitripatrivatamsitakuntalam |
    jagati shamitastambham kampanadinilayamasau shriyati hi galattandra candravatamsasadharminim || ||
    parimalaparipakodrekam payomuci kancane shikharini punardbaidhibhavam shashinyarunatapam | api ca
    janayankamborlakshmimanambuni ko'pyasau kusumadhanushah kancideshe cakasti parakramah || || puradamayiturvamotsangasthalena
    rasajnaya sarasakavitabhaja kancipurodarasimaya | tataparisarairniharadrervacobhirakritrimaih kimiva
    na tulamasmacceto maheshvari gahate || || nayanayugalimasmakinam kada nu phalegrahim vidadhati gatau
    vyakurvana gajendracamatkriyam | maratakaruco maheshana ghanastananamritah sukritavibhavah prancah
    kancivatamsadhurandharah || || manasijayashahparamparyam marandajharisuvam kavikulagiram kandam kampanaditatamandanam
    | madhuralalitam matkam cakshurmanishimanoharam puravijayinah sarvasvam tatpuraskurute kada || ||
    shithilitatamolilam nilaravindavilocanam dahanavilasatphalam shrikamakotimupasmahe | karadhritasacchulam
    kalaricittaharam param manasijakripalilam lolalakamalikekshanam || || kalalilashala kavikulavacahkairavavani
    sharajjyotsnadhara shashadharashishushlaghyamukuti | punite nah kampapulinatatasauhardatarala kada
    cakshurmargam kanakagiridhanushkamahishi || || namah stannamrebhyah stanagarimagarvena guruna dadhanebhyashcudabharanamamritasyandi
    shishiram | sada vastavebhyah suvidhabhuvi kampakhyasarite yashovyaparebhyah sukritavibhavebhyo ratipateh
    || || asuyanti kacinmarakataruco nakimukuti kadambam cumbanti carananakhacandramshupatalaih | tamomudram
    vidravayatu mama kancirnilayana harotsangashrimanmanigrihamahadipakalika || || anadyanta kacitsujananayananandajanani
    nirundhana kantim nijarucivilasairjalamucam | smararestaralyam manasi janayanti svayamaho galatkampa
    shampa parilasati kampaparisare || || sudhadindirashrih smitarucishu tundiravishayam parishkurvanasau
    parihasitanilotpalarucih | stanabhyamanamra stabakayatu me kankshitatarum drishamaishaninam sukritaphalapandityagarima
    || || kripadharadroni kripanadhishananam pranamatam nihantri santapam nigamamukutottamsakalika | para
    kancililaparicayavati parvatasuta giram nivi devi girishaparatantra vijayate || || kavitvashrikandah
    sukritaparipati himagireh vidhatri vishvesham vishamasharaviradhvajapati | sakhi kampanadyah padahasitapathojayugali
    purano payannah puramathanasamrajyapadavi || || daridrana madhye daradalitatapicchasushamah stanabhogakkantastarunaharinankankitakacah
    | haradhina nanavibudhamukuticumbitapadah kada kampatire kathaya viharamo girisute || || varivartu
    sthema tvayi mama giram devi manaso narinartu praudha vadanakamale vakyalahari | caricartu prajnajanani
    jadimanah parajane sarisartu svairam janani mayi kamakshi karuna || || kshanatte kamakshi bhramarasushamashikshanaguruh
    katakshavyakshepo mama bhavatu mokshaya vipadam | narinartu svairam vacanalahari nirjarapuri saridvicinicikaranapaturasye
    mama sada || || purastanme bhuyahprashamanaparah stanmama rujam pracaraste kampatatavihritisampadini
    drishoh | imam yacnamurikuru sapadi durikuru tamah paripakam matkam sapadi budhalokam ca naya mam
    || || udancanti kancinagaranilaye tvatkarunaya samriddha vagdhati parihasitamadhvi kavayatam | upadatte
    marapratibhatajatajutamukuti kutirollasinyah shatamakhatatinya jayapatim || || shriyam vidyam dadyajjanani
    namatam kirtimamitam suputran pradatte tava jhatiti kamakshi karuna | trilokyamadhikyam tripuraparipanthipranayini
    pranamastvatpade shamitadurite kim na kurute || || manahstambham stambham gamayadupakampam pranamatam
    sada lolam nilam cikurajitalolambanikaram | giram duram smeram dhritashashikishoram pashupateh drisham
    yogyam bhogyam tuhinagiribhagyam vijayate || || ghanashyamankamantakamahishi kamakshi madhuran drisham
    patanetanamritajalashitananupaman | bhavotpate bhite mayi vitara nathe dridhabhava nmanashshoke muke
    himagiripatake karunaya || || natanam mandanam bhavanigalabandhakuladhiyam mahandhyam rundhanamabhilashitasantanalatikam
    | carantim kampayastatabhuvi savitrim trijagatam smaramastam nityam smaramathanajivatukalikam || ||
    para vidya hridyashritamadanavidya marakata prabhanila lilaparavashitashulayudhamanah | tamahpuram
    duram carananatapaurandarapuri mrigakshi kamakshi kamalataralakshi nayatu me || || ahantakhya matkam
    kabalayati ha hanta harini hathatsamvidrupam haramahishi sasyankuramasau | katakshavyakshepaprakataharipashanapatalaih
    imamuccairuccataya jhatiti kamakshi kripaya || || budhe va muke va tava patati yasminkshanamasau katakshah
    kamakshi prakatajadimakshodapatima | kathankaram nasmai karamukulacudalamukuta namovakam bruyurnamuciparipanthiprabhritayah
    || || praticim pashyamah prakatarucinivarakamani prabhasadhricinam pradalitashadadharakamalam | carantim
    saushumne pathi parapadendupravigala tsudhardram kamakshim parinataparanjyotirudayam || || jambharatiprabhritimukutih
    padayoh pithayanti gumphanvacam kavijanakritansvairamaramayanti | shampalakshmim maniganarucapatalaih
    prapayanti kampatire kaviparishadam jrimbhate bhagyasima || || candrapidam caturavadanam cancalapangalilam
    kundasmeram kucabharanatam kuntaloddhutabhringam | mararatermadanashikhinam mamsalam dipayantim kamakshim
    tam kavikulagiram kalpavallimupase || || kalambhodaprakarasushamam kantibhistirjayanti kalyananamudayasaranih
    kalpavalli kavinam | kandarpareh priyasahacari kalmashanam nihantri kancidesham tilakayati sa kapi
    karunyasima || || urikurvannurasijatate caturim bhudharanam pathojanam nayanayugale paripanthyam vitanvan
    | kampatire viharati ruca moghayanmeghashailim kokadvesham shirasi kalayanko'pi vidyavisheshah ||
    || kancililaparicayavati kapi tapicchalakshmih jadyaranye hutavahashikha janmabhumih kripayah | makandashrirmadhurakavitacaturi
    kokilanam marge bhuyanmama nayanayormanmathi kapi vidya || || seturmatarmaratakamayo bhaktibhajam
    bhavabdhau lilalola kuvalayamayi manmathi vaijayanti | kancibhusha pashupatidrisham kapi kalanjanali
    matkam duhkham shithilayatu te manjulapangamala || || vyavrinvanah kuvalayadalaprakriyavairamudram
    vyakurvana manasijamaharajasamrajyalakshmim | kancililavihritirasike kankshitam nah kriyasuh bandhacchede
    tava niyaminam baddhadikshah katakshah || || kalambhode shashiruci dalam kaitakam darshayanti madhyesaudamini
    madhuliham malikam rajayanti | hamsaravam vikacakamale manjumullasayanti kampatire vilasati nava kapi
    karunyalakshmih || || citram citram nijamridutaya bhartsayanpallavalim pumsam kamanbhuvi ca niyatam
    purayanpunyabhajam | jatah shailanna tu jalanidheh svairasancarashilah kancibhusha kalayatu shivam
    ko'pi cintamanirme || || tamrambhojam jaladanikate tatra bandhukapushpam tasminmallikusumasushamam
    tatra vinaninadam | vyavrinvana sukritalahari kapi kancinagaryam aishani sa kalayatitaramaindrajalam
    vilasam || || aharamsham tridashasadasamashraye catakanam akashoparyapi ca kalayannalayam tungamesham
    | kampatire viharatitaram kamadhenuh kavinam mandasmero madananigamaprakriyasampradayah || || ardribhutairaviralakripairattalilavilasaih
    asthapurnairadhikacapalairancitambhojashilpaih | kantairlakshmilalitabhavanaih kantikaivalyasaraih
    kashmalyam nah kabalayatu sa kamakoti katakshaih || || adhunvantyai taralanayanairangajim vaijayantim
    anandinyai nijapadajushamattakancipurayai | asmakinam hridayamakhilairagamanam prapancaih aradhyayai
    sprihayatitaramadimayai jananyai || || duram vacam tridashasadasam duhkhasindhostaritram mohakshvelakshitiruhavane
    kruradharam kutharam | kampatirapranayi kavibhirvarnitodyaccaritram shantyai seve sakalavipadam shankaram
    tatkalatram || || khandikritya prakritikutilam kalmasham pratibhashri shundiratvam nijapadajusham
    shunyatandram dishanti | tundirakhyai mahati vishaye svarnavrishtipradatri candi devi kalayati ratim
    candracudalacude || || yena khyato bhavati sa grihi purusho merudhanva yaddrikkone madananigamaprabhavam
    bobhaviti | yatprityaiva trijagadadhipo jrimbhate kimpacanah kampatire sa jayati mahankashcidojovisheshah
    || || dhanya dhanya gatiriha giram devi kamakshi yanme nindyam bhindyatsapadi jadatam kalmashadunmishantim
    | sadhvi madhvirasamadhuratabhanjini manjuritih vaniveni jhatiti vrinutatsvardhunispardhini mam ||
    || yasya vati hridayakamalam kausumi yogabhajam yasyah pithi satatashishira shikarairmakarandaih |
    yasyah peti shrutiparicalanmauliratnasya kanci sa me somabharanamahishi sadhayetkankshitani || ||
    eka mata sakalajagatamiyushi dhyanamudram ekamradhishvaracaranayorekatanam samindhe | tatankodyanmaniganaruca
    tamrakarnapradesha tarunyashristabakitatanustapasi kapi bala || || dantadantiprakatanakari dantibhirmandayanaih
    mandaranam madaparinatim mathnati mandahasaih | ankurabhyam manasijatarorankitorah kucabhya mantahkanci
    sphurati jagatamadima kapi mata || || triyambakakutumbinim tripurasundarimindiram pulindapatisundarim
    tripurabhairavim bharatim | matangakulanayikam mahishamardanim matrikam bhananti vibudhottama vihritimeva
    kamakshi te || || mahamunimanonati mahitaramyakampatati kutirakaviharini kutilabodhasamharini | sada
    bhavatu kamini sakaladehinam svamini kripatishayakinkari mama vibhutaye shankari || || jadah prakritinirdhana
    janavilocanaruntuda nara janani vikshanam kshanamavapya kamakshi te | vacassu madhumadhurim prakatayanti
    paurandari vibhutishu vidambanam vapushi manmathim prakriyam || || ghansatanatatasphutasphuritakanculicancali
    kritatripurashasana sujanashilitopasana | drishoh saranimashnute mama kada nu kancipure para paramayoginam
    manasi citkula pushkala || || kavindrahridayecari parigrihitakancipuri nirudhakarunajhari nikhilalokarakshakari
    | manahpathadaviyasi madanashasanapreyasi mahagunagariyasi mama drisho'stu nediyasi || || dhanena
    na ramamahe khalajananna sevamahe na capalamayamahe bhavabhayanna duyamahe | sthiram tanumahetaram
    manasi kim ca kancirata smarantakakutumbinicaranapallavopasanam || || surah parijana vapurmanasijaya
    vairayate trivishtapanitambinikucatati ca keligirih | girah surabhayo vayastarunima daridrasya va
    katakshasaranau kshanam nipatitasya kamakshi te || || pavitraya jagattrayivibudhabodhajivatubhih puratrayavimardinah
    pulakakanculidayibhih | bhavakshayavicakshanairvyasanamokshanairvikshanaih niraksharashiromanim karunayaiva
    kamakshi mam || || kada kalitakhelanah karunayaiva kancipure kalayamukulatvishah shubhakadambapurnankurah
    | payodharabharalasah kavijaneshu te bandhurah pacelimakriparasa paripatanti marge drishoh || || ashodhyamacalodbhavam
    hridayanandanam dehinam anarghamadhikanci tatkimapi ratnamuddyotate | anena samalankrita jayati shankarankasthali
    kadasya mama manasam vrajati petikavibhramam || || paramritajharipluta jayati nityamantashcari bhuvamapi
    bahishcari paramasamvidekatmika | mahadbhiraparokshita satatameva kancipure mamanvahamahammatirmanasi
    bhatu maheshvari || || tamovipinadhavinam satatameva kancipure vihararasika para paramasamvidurviruhe
    | katakshanigalairdridham hridayadushtadantavalam ciram nayatu mamakam tripuravairisimantini || ||
    tvameva sati candika tvamasi devi camundika tvameva paramatrika tvamapi yoginirupini | tvameva kila
    shambhavi tvamasi kamakoti jaya tvameva vijaya tvayi trijagadamba kim brumahe || || pare janani parvati
    pranatapalini pratibha pradatri parameshvari trijagadashrite shashvate | triyambakakutumbini tripadasangini
    trikshane trishaktimayi vikshanam mayi nidhehi kamakshi te || || manomadhukarotsavam vidadhati manishajusham
    svayamprabhavavaikharivipinavithikalambini | aho shishirita kripamadhurasena kampatate caracaravidhayini
    calati kapi cinmanjari || || kalavati kalabhrito mukutasimni lilavati sprihavati maheshvare bhuvanamohane
    bhasvati | prabhavati rame sada mahitarupashobhavati tvaravati pare satam gurukripambudharavati ||
    || tvayaiva jagadambaya bhuvanamandalam suyate tvayaiva karunardraya tadapi rakshanam niyate | tvayaiva
    kharakopaya nayanapavake huyate tvayaiva kila nityaya jagati santatam sthiyate || || caracarajaganmayim
    sakalahrinmayim cinmayim gunatrayamayim jagattrayamayim tridhamamayim | paraparamayim sada dashadisham
    nishaharmayim param satatasanmayim manasi cinmayim shilaye || || jaya jagadambike harakutumbini vaktraruca
    jitasharadambuje ghanavidambini kesharuca | paramavalambanam kuru sada pararupadhare mama gatasamvido
    jadimadambaratandavinah || || bhuvanajanani bhushabhutacandre namaste kalushashamani kampatiragehe
    namaste | nikhilanigamavedye nityarupe namaste parashivamayi pashacchedahaste namaste || || kvanatkanci
    kancipuramanivipancilayajhari shirahkampa kampavasatiranukampajalanidhih | ghanashyama shyama kathinakucasima
    manasi me mrigakshi kamakshi haranatanasakshi viharatat || || samaravijayakoti sadhakanandadhati mridugunaparipeti
    mukhyakadambavati | muninutaparipati mohitajandakoti paramashivavadhuti patu mam kamakoti || || imam
    paravarapradam prakritipeshalam pavanam paraparacidakritiprakatanapradipayitam | stavam pathati nityada
    manasi bhavayannambikam japairalamalam makhairadhikadehasamshoshanaih || || || iti stutishatakam sampurnam
    ||
  devanagari: पाण्डित्यं परमेश्वरि स्तुतिविधौ नैवाश्रयन्ते गिरां वैरिञ्चान्यपि गुम्फनानि विगलद्गर्वाणि
    शर्वाणि ते । स्तोतुं त्वां परिफुल्लनीलनलिनश्यामाक्षि कामाक्षि मां वाचालीकुरुते तथापि नितरां त्वत्पादसेवादरः
    ॥ ॥ तापिञ्छस्तबकत्विषे तनुभृतां दारिद्र्यमुद्राद्विषे संसाराख्यतमोमुषे पुररिपोर्वामाङ्कसीमाजुषे ।
    कम्पातीरमुपेयुषे कवयतां जिह्वाकुटीं जग्मुषे विश्वत्राणपुषे नमोऽस्तु सततं तस्मै परञ्ज्योतिषे ॥ ॥ ये
    सन्ध्यारुणयन्ति शङ्करजटाकान्तारचन्रार्भकं सिन्दूरन्ति च ये पुरन्दरवधूसीमन्तसीमान्तरे । पुण्य ं ये
    परिपक्कयन्ति भजतां काञ्चीपुरे माममी पायासुः परमेश्वरप्रणयिनीपादोद्भवाः पांसवः ॥ ॥ कामाडम्बरपूरया शशिरुचा
    कम्रस्मितानां त्विषा कामारेरनुरागसिन्धुमधिकं कल्लोलितं तन्वती । कामाक्षीति समस्तसज्जननुता कल्याणदात्री
    नृणां कारुण्याकुलमानसा भगवती कम्पातटे जृम्भते ॥ ॥ कामाक्षीणपराक्रमप्रकटनं सम्भावयन्ती दृशा श्यामा
    क्षीरसहोदरस्मितरुचिप्रक्षालिताशान्तरा । कामाक्षीजनमौलिभूषणमणिर्वाचां परा देवता कामाक्षीति विभाति कापि
    करुणा कम्पातटिन्यास्तटे ॥ ॥ श्यामा काचन चन्द्रिका त्रिभुवने पुण्यात्मनामानने सीमाशून्यकवित्ववर्षजननी
    या कापि कादम्बिनी । मारारातिमनोविमोहनविधौ काचितत्तमःकन्दली कामाक्ष्याः करुणाकटाक्षलहरी कामाय मे कल्पताम्
    ॥ ॥ प्रौढध्वान्तकदम्बके कुमुदिनीपुण्याङ्कुरं दर्शयन् ज्योत्स्नासङ्गमनेऽपि कोकमिथुनं मिश्रं समुद्भावयन्
    । कालिन्दीलहरीदशां प्रकटयन्कम्रां नभस्यद्भुतां कश्चिन्नेत्रमहोत्सवो विजयते काञ्चीपुरे शूलिनः ॥ ॥ तन्द्राहीनतमालनीलसुषमैस्तारुण्यलीलागृहैः
    तारानाथकिशोरलाञ्छितकचैस्ताम्रारविन्देक्षणैः । मातः संश्रयतां मनो मनसिजप्रागल्भ्यनाडिन्धमैः कम्पातीरचरैर्घनस्तनभरैः
    पुण्याङ्करैः शाङ्करैः ॥ ॥ नित्यं निश्चलतामुपेत्य मरुतां रक्षाविधिं पुष्णती तेजस्सञ्चयपाटवेन किरणानुष्णद्युतेर्मुष्णती
    । काञ्चीमध्यगतापि दीप्तिजननी विश्वान्तरे जृम्भते काचिच्चित्रमहो स्मृतापि तमसां निर्वापिका दीपिका ॥
    ॥ कान्तैः केशरुचां चयैर्भ्रमरितं मन्दस्मितैः पुष्पितं कान्त्या पल्लवितं पदाम्बुरुहयोर्नेत्रत्विषा
    पत्रितम् । कम्पातीरवनान्तरं विदधती कल्याणजन्मस्थली काञ्चीमध्यमहामणिर्विजयते काचित्कृपाकन्दली ॥ ॥ राकाचन्द्रसमानकान्तिवदना
    नाकाधिराजस्तुता मूकानामपि कुर्वती सुरधनीनीकाशवाग्वैभवम् । श्रीकाञ्चीनगरीविहाररसिका शोकापहन्त्री सताम्
    एका पुण्यपरम्परा पशुपतेराकारिणी राजते ॥ ॥ जाता शीतलशैलतः सुकृतिनां दृश्या परं देहिनां लोकानां क्षणमात्रसंस्मरणतः
    सन्तापविच्छेदिनी । आश्चर्यं बहु खेलनं वितनुते नैश्चल्यमाबिभ्रती कम्पायास्तटसीम्नि कापि तटिनी कारुण्यपाथोमयी
    ॥ ॥ ऐक्यं येन विरच्यते हरतनौ दम्भावपुम्भावुके रेखा यत्कचसीम्नि शेखरदशां नैशाकरी गाहते । औन्नत्यं मुहुरेति
    येन स महान्मेनासखः सानुमान् कम्पातीरविहारिणा सशरणास्तेनैव धाम्ना वयम् ॥ ॥ अक्ष्णोश्च स्तनयोः श्रिया
    श्रवणयोर्बाह्वोश्च मूलं स्पृशन् उत्तंसेन मुखेन च प्रतिदिनं द्रुह्यन्पयोजन्मने । माधुर्येण गिरां गतेन
    मृदुना हंसाङ्गनां ह्रेपयन् काञ्चीसीम्नि चकास्ति कोऽपि कवितासन्तानबीजाङ्कुरः ॥ ॥ खण्डं चान्द्रमसं वतंसमनिशं
    काञ्चीपुरे खेलनं कालायश्छवितस्करीं तनुरुचिं कर्णजपे लोचने । तारुण्योष्मनखम्पचं स्तनभरं जङ्घास्पृशं
    कुन्तलं भाग्यं देशिकसञ्चितं मम कदा सम्पादयेदम्बिके ॥ ॥ तन्वानं निजकेलिसौधसरणिं नैसर्गिकीणां गिरां
    केदारं कविमल्लसूक्तिलहरीसस्यश्रियां शाश्वतम् । अंहोवञ्चनचुञ्चु किञ्चन भजे काञ्चीपुरीमण्डनं पर्यायच्छवि
    पाकशासनमणेः पौष्पेषवं पौरुषम् ॥ ॥ आलोके मुखपङ्कजे च दधती सौधाकरीं चातुरीं चूडालङ्क्रियमाणपङ्कजवनीवैरागमप्रक्रिया
    । मुग्धस्मेरमुखी घन्सतनतटीमूर्च्छालमध्याञ्चिता काञ्चीसीमनि कामिनी विजयते काचिज्जगन्मोहिनी ॥ ॥ यस्मिन्नम्ब
    भवत्कटाक्षरजनी मन्देऽपि मन्दस्मित ज्योत्स्नासंस्नपिता भवत्यभिमुखी तं प्रत्यहो देहिनम् । द्रक्षामाक्षिकमाधुरीमदभरव्रीडाकरी
    वैखरी कामाक्षि स्वयमातनोत्यभिसृतिं वामेक्षणेव क्षणम् ॥ ॥ कालिन्दीजलकान्तयः स्मितरुचिस्वर्वाहिनीपाथसि
    प्रौढध्वान्तरुचः स्फुटाधरमहोलौहित्यसन्ध्योदये । मणिक्योपलकुण्डलांशुशिखिनि व्यामिश्रधूमश्रियः कल्याणैकभुवः
    कटाक्षसुषमाः कामाक्षि राजन्ति ते ॥ ॥ कलकलरणत्काञ्ची काञ्चीविभूषणमालिका कचभरलसच्चन्द्रा चन्द्रावतंससधर्मिणी
    । कविकुलगिरः श्रावंश्रावं मिलत्पुलकाङ्कुरा विरचितशिरःकम्पा कम्पातटे परिशोभते ॥ ॥ सरसवचसां वीची नीचीभवन्मधुमाधुरी
    भरितभुवना कीर्तिर्मूर्तिर्मनोभवजित्वरी । जननि मनसो योग्यं भोग्यं नृणां तव जायते कथमिव विना काञ्चीभूषे
    कटाक्षतरङ्गितम् ॥ ॥ भ्रमरितसरित्कूलो नीलोत्पलप्रभयाऽऽभया नतजनतमःखण्डी तुण्डीरसीम्नि विजृम्भते । अचलतपसामेकः
    पाकः प्रसूनशरासन प्रतिभटमनोहारी नारीकुलैकशिखामणिः ॥ ॥ मधुरवचसो मन्दस्मेरा मतङ्गजगामिनः तरुणिमजुषस्तापिच्छाभास्तमःपरिपन्थिनः
    । कुचभरनताः कुर्युर्भद्रं कुरङ्गविलोचनाः कलितकरुणाः काञ्चीभाजः कपालिमहोत्सवाः ॥ ॥ कमलसुषमाक्ष्यारोहे
    विचक्षणवीक्षणाः कुमुदसुकृतक्रीडाचूडालकुन्तलबन्धुराः । रुचिररुचिभिस्तापिच्छश्रीप्रपञ्चनचुञ्चवः पुरविजयिनः
    कम्पातीरे स्फुरन्ति मनोरथाः ॥ ॥ कलितरतयः काञ्चीलीलाविधौ कविमण्डली वचनलहरीवासन्तीनां वसन्तविभूतयः ।
    कुशलविधये भूयासुर्मे कुरङ्गविलोचनाः कुसुमविशिखारातेरक्ष्णां कुतूहलविभ्रमाः ॥ ॥ कबलिततमस्काण्डास्तुण्डीरमण्डलमण्डनाः
    सरसिजवनीसन्तानानामरुन्तुदशेखराः । नयनसरणेर्नेदीयंसः कदा नु भवन्ति मे तरुणजलदश्यामाः शम्भोस्तपःफलविभ्रमाः
    ॥ ॥ अचरममिषुं दीनं मीनध्वजस्य मुखश्रिया सरसिजभुवो यानं म्लानं गतेन च मञ्जुना । त्रिदशसदसामन्नं खिन्नं
    गिरा च वितन्वती तिलकयति सा कम्पातीरं त्रिलोचनसुन्दरी ॥ ॥ जननि भुवने चङ्क्रम्येऽहं कियन्तमनेहसं कुपुरुषकरभ्रष्टैर्दुष्टैर्धनैरुदरम्भरिः
    । तरुणकरुणे तन्द्राशून्ये तरङ्गय लोचने नमति मयि ते किञ्चित्काञ्चीपुरीमणिदीपिके ॥ ॥ मुनिजनमनःपेटीरत्नं
    स्फुरत्करुणानटी विहरणकलागेहं काञ्चीपुरीमणिभूषणम् । जगति महतो मोहव्याधेर्नृणां परमौषधं पुरहरदृशां साफल्यं
    मे पुरः परिजृम्भताम् ॥ ॥ मुनिजनमोधाम्ने धाम्ने वचोमयजाह्नवी हिमगिरितटप्राग्भारायाक्षराय परात्मने ।
    विहरणजुषे काञ्चीदेशे महेश्वरलोचन त्रितयसरसक्रीडासौधाङ्गणाय नमो नमः ॥ ॥ मरकतरुचां प्रत्यादेशं महेश्वरचक्षुषाम्
    अमृतलहरीपूरं पारं भवाख्यपयोनिधेः । सुचरितफलं काञ्चीभाजो जनस्य पचेलिमं हिमशिखरिणो वंशस्यैकं वतंसमुपास्महे
    ॥ ॥ प्रणमनदिनारम्भे कम्पानदीसखि तावके सरसकवितोन्मेषः पूषा सतां समुदञ्चितः । प्रतिभटमहाप्रौढप्रोद्यत्कवित्वकुमुद्वतीं
    नयति तरसा निद्रामुद्रां नगेश्वरकन्यके ॥ ॥ शमितजडिमारम्भा कम्पातटीनिकटेचरी निहतदुरितस्तोमा सोमार्धमुद्रितकुन्तला
    । फलितसुमनोवाञ्छा पाञ्चायुधी परदेवता सफलयतु मे नेत्रे गोत्रेश्वरप्रियनन्दिनी ॥ ॥ मम तु धिषणा पीड्या
    जाड्यातिरेक कथं त्वया कुमुदसुषमामैत्रीपात्रीवतंसितकुन्तलाम् । जगति शमितस्तम्भां कम्पानदीनिलयामसौ श्रियति
    हि गलत्तन्द्रा चन्द्रावतंससधर्मिणीम् ॥ ॥ परिमलपरीपाकोद्रेकं पयोमुचि काञ्चने शिखरिणि पुनर्द्बैधीभावं
    शशिन्यरुणातपम् । अपि च जनयन्कम्बोर्लक्ष्मीमनम्बुनि कोऽप्यसौ कुसुमधनुषः काञ्चीदेशे चकास्ति पराक्रमः
    ॥ ॥ पुरदमयितुर्वामोत्सङ्गस्थलेन रसज्ञया सरसकविताभाजा काञ्चीपुरोदरसीमया । तटपरिसरैर्नीहाराद्रेर्वचोभिरकृत्रिमैः
    किमिव न तुलामस्मच्चेतो महेश्वरि गाहते ॥ ॥ नयनयुगलीमास्माकीनां कदा नु फलेग्रहीं विदधति गतौ व्याकुर्वाणा
    गजेन्द्रचमत्क्रियाम् । मरतकरुचो माहेशाना घनस्तननम्रिताः सुकृतविभवाः प्राञ्चः काञ्चीवतंसधुरन्धराः ॥
    ॥ मनसिजयशःपारम्पर्यं मरन्दझरीसुवां कविकुलगिरां कन्दं कम्पानदीतटमण्डनम् । मधुरललितं मत्कं चक्षुर्मनीषिमनोहरं
    पुरविजयिनः सर्वस्वं तत्पुरस्कुरुते कदा ॥ ॥ शिथिलिततमोलीलां नीलारविन्दविलोचनां दहनविलसत्फालां श्रीकामकोटिमुपास्महे
    । करधृतसच्छूलां कालारिचित्तहरां परां मनसिजकृपालीलां लोलालकामलिकेक्षणाम् ॥ ॥ कलालीलाशाला कविकुलवचःकैरववनी
    शरज्ज्योत्स्नाधारा शशधरशिशुश्लाघ्यमुकुटी । पुनीते नः कम्पापुलिनतटसौहार्दतरला कदा चक्षुर्मार्गं कनकगिरिधानुष्कमहिषी
    ॥ ॥ नमः स्तान्नम्रेभ्यः स्तनगरिमगर्वेण गुरुणा दधानेभ्यश्चूडाभरणममृतस्यन्दि शिशिरम् । सदा वास्तवेभ्यः
    सुविधभुवि कम्पाख्यसरिते यशोव्यापारेभ्यः सुकृतविभवेभ्यो रतिपतेः ॥ ॥ असूयन्ती काचिन्मरकतरुचो नाकिमुकुटी
    कदम्बं चुम्बन्ती चरणनखचन्द्रांशुपटलैः । तमोमुद्रां विद्रावयतु मम काञ्चीर्निलयना हरोत्सङ्गश्रीमन्मणिगृहमहादीपकलिका
    ॥ ॥ अनाद्यन्ता काचित्सुजननयनानन्दजननी निरुन्धाना कान्तिं निजरुचिविलासैर्जलमुचाम् । स्मरारेस्तारल्यं
    मनसि जनयन्ती स्वयमहो गलत्कम्पा शम्पा परिलसति कम्पापरिसरे ॥ ॥ सुधाडिण्डीरश्रीः स्मितरुचिषु तुण्डीरविषयं
    परिष्कुर्वाणासौ परिहसितनीलोत्पलरुचिः । स्तनाभ्यामानम्रा स्तबकयतु मे काङ्क्षिततरुं दृशामैशानीनां सुकृतफलपाण्डित्यगरिमा
    ॥ ॥ कृपाधाराद्रोणी कृपणधिषणानां प्रणमतां निहन्त्री सन्तापं निगममुकुटोत्तंसकलिका । परा काञ्चीलीलापरिचयवती
    पर्वतसुता गिरां नीवी देवी गिरिशपरतन्त्रा विजयते ॥ ॥ कवित्वश्रीकन्दः सुकृतपरिपाटी हिमगिरेः विधात्री
    विश्वेषां विषमशरवीरध्वजपटी । सखी कम्पानद्याः पदहसितपाथोजयुगली पुराणो पायान्नः पुरमथनसाम्राज्यपदवी
    ॥ ॥ दरिद्राणा मध्ये दरदलिततापिच्छसुषमाः स्तनाभोगक्कान्तास्तरुणहरिणाङ्काङ्कितकचाः । हराधीना नानाविबुधमुकुटीचुम्बितपदाः
    कदा कम्पातीरे कथय विहरामो गिरिसुते ॥ ॥ वरीवर्तु स्थेमा त्वयि मम गिरां देवि मनसो नरीनर्तु प्रौढा वदनकमले
    वाक्यलहरी । चरीचर्तु प्रज्ञाजननि जडिमानः परजने सरीसर्तु स्वैरं जननि मयि कामाक्षि करुणा ॥ ॥ क्षणात्ते
    कामाक्षि भ्रमरसुषमाशिक्षणगुरुः कटाक्षव्याक्षेपो मम भवतु मोक्षाय विपदाम् । नरीनर्तु स्वैरं वचनलहरी
    निर्जरपुरी सरिद्वीचीनीचीकरणपटुरास्ये मम सदा ॥ ॥ पुरस्तान्मे भूयःप्रशमनपरः स्तान्मम रुजां प्रचारस्ते
    कम्पातटविहृतिसम्पादिनि दृशोः । इमां याच्ञामूरीकुरु सपदि दूरीकुरु तमः परीपाकं मत्कं सपदि बुधलोकं च
    नय माम् ॥ ॥ उदञ्चन्ती काञ्चीनगरनिलये त्वत्करुणया समृद्धा वाग्धाटी परिहसितमाध्वी कवयताम् । उपादत्ते
    मारप्रतिभटजटाजूटमुकुटी कुटीरोल्लासिन्याः शतमखतटिन्या जयपटीम् ॥ ॥ श्रियं विद्यां दद्याज्जननि नमतां
    कीर्तिममितां सुपुत्रान् प्रादत्ते तव झटिति कामाक्षि करुणा । त्रिलोक्यामाधिक्यं त्रिपुरपरिपन्थिप्रणयिनि
    प्रणामस्त्वत्पादे शमितदुरिते किं न कुरुते ॥ ॥ मनःस्तम्भं स्तम्भं गमयदुपकम्पं प्रणमतां सदा लोलं नीलं
    चिकुरजितलोलम्बनिकरम् । गिरां दूरं स्मेरं धृतशशिकिशोरं पशुपतेः दृशां योग्यं भोग्यं तुहिनगिरिभाग्यं
    विजयते ॥ ॥ घनश्यामान्कामान्तकमहिषि कामाक्षि मधुरान् दृशां पातानेतानमृतजलशीताननुपमान् । भवोत्पाते भीते
    मयि वितर नाथे दृढभव न्मनश्शोके मूके हिमगिरिपताके करुणया ॥ ॥ नतानां मन्दानां भवनिगलबन्धाकुलधियां महान्ध्यां
    रुन्धानामभिलषितसन्तानलतिकाम् । चरन्तीं कम्पायास्तटभुवि सवित्रीं त्रिजगतां स्मरामस्तां नित्यं स्मरमथनजीवातुकलिकाम्
    ॥ ॥ परा विद्या हृद्याश्रितमदनविद्या मरकत प्रभानीला लीलापरवशितशूलायुधमनाः । तमःपूरं दूरं चरणनतपौरन्दरपुरी
    मृगाक्षी कामाक्षी कमलतरलाक्षी नयतु मे ॥ ॥ अहन्ताख्या मत्कं कबलयति हा हन्त हरिणी हठात्संविद्रूपं हरमहिषि
    सस्याङ्कुरमसौ । कटाक्षव्याक्षेपप्रकटहरिपाषाणपटलैः इमामुच्चैरुच्चाटय झटिति कामाक्षि कृपया ॥ ॥ बुधे
    वा मूके वा तव पतति यस्मिन्क्षणमसौ कटाक्षः कामाक्षि प्रकटजडिमक्षोदपटिमा । कथङ्कारं नास्मै करमुकुलचूडालमुकुटा
    नमोवाकं ब्रूयुर्नमुचिपरिपन्थिप्रभृतयः ॥ ॥ प्रतीचीं पश्यामः प्रकटरुचिनीवारकमणि प्रभासध्रीचीनां प्रदलितषडाधारकमलाम्
    । चरन्तीं सौषुम्ने पथि परपदेन्दुप्रविगल त्सुधार्द्रां कामाक्षीं परिणतपरञ्ज्योतिरुदयाम् ॥ ॥ जम्भारातिप्रभृतिमुकुटीः
    पादयोः पीठयन्ती गुम्फान्वाचां कविजनकृतान्स्वैरमारामयन्ती । शम्पालक्ष्मीं मणिगणरुचापाटलैः प्रापयन्ती
    कम्पातीरे कविपरिषदां जृम्भते भाग्यसीमा ॥ ॥ चन्द्रापीडां चतुरवदनां चञ्चलापाङ्गलीलां कुन्दस्मेरां कुचभरनतां
    कुन्तलोद्धूतभृङ्गाम् । मारारातेर्मदनशिखिनं मांसलं दीपयन्तीं कामाक्षीं तां कविकुलगिरां कल्पवल्लीमुपासे
    ॥ ॥ कालाम्भोदप्रकरसुषमां कान्तिभिस्तिर्जयन्ती कल्याणानामुदयसरणिः कल्पवल्ली कवीनाम् । कन्दर्पारेः प्रियसहचरी
    कल्मषाणां निहन्त्री काञ्चीदेशं तिलकयति सा कापि कारुण्यसीमा ॥ ॥ ऊरीकुर्वन्नुरसिजतटे चातुरीं भूधराणां
    पाथोजानां नयनयुगले परिपन्थ्यं वितन्वन् । कम्पातीरे विहरति रुचा मोघयन्मेघशैलीं कोकद्वेषं शिरसि कलयन्कोऽपि
    विद्याविशेषः ॥ ॥ काञ्चीलीलापरिचयवती कापि तापिच्छलक्ष्मीः जाड्यारण्ये हुतवहशिखा जन्मभूमिः कृपायाः ।
    माकन्दश्रीर्मधुरकविताचातुरी कोकिलानां मार्गे भूयान्मम नयनयोर्मान्मथी कापि विद्या ॥ ॥ सेतुर्मातर्मरतकमयो
    भक्तिभाजां भवाब्धौ लीलालोला कुवलयमयी मान्मथी वैजयन्ती । काञ्चीभूषा पशुपतिदृशां कापि कालाञ्जनाली मत्कं
    दुःखं शिथिलयतु ते मञ्जुलापाङ्गमाला ॥ ॥ व्यावृण्वानाः कुवलयदलप्रक्रियावैरमुद्रां व्याकुर्वाणा मनसिजमहाराजसाम्राज्यलक्ष्मीम्
    । काञ्चीलीलाविहृतिरसिके काङ्क्षितं नः क्रियासुः बन्धच्छेदे तव नियमिनां बद्धदीक्षाः कटाक्षाः ॥ ॥ कालाम्भोदे
    शशिरुचि दलं कैतकं दर्शयन्ती मध्येसौदामिनि मधुलिहां मालिकां राजयन्ती । हंसारावं विकचकमले मञ्जुमुल्लासयन्ती
    कम्पातीरे विलसति नवा कापि कारुण्यलक्ष्मीः ॥ ॥ चित्रं चित्रं निजमृदुतया भर्त्सयन्पल्लवालीं पुंसां कामान्भुवि
    च नियतं पूरयन्पुण्यभाजाम् । जातः शैलान्न तु जलनिधेः स्वैरसञ्चारशीलः काञ्चीभूषा कलयतु शिवं कोऽपि चिन्तामणिर्मे
    ॥ ॥ ताम्राम्भोजं जलदनिकटे तत्र बन्धूकपुष्पं तस्मिन्मल्लीकुसुमसुषमां तत्र वीणानिनादम् । व्यावृन्वाना
    सुकृतलहरी कापि काञ्चिनगर्याम् ऐशानी सा कलयतितरामैन्द्रजालं विलासम् ॥ ॥ आहारांशं त्रिदशसदसामाश्रये
    चातकानाम् आकाशोपर्यपि च कलयन्नालयं तुङ्गमेषाम् । कम्पातीरे विहरतितरां कामधेनुः कवीनां मन्दस्मेरो मदननिगमप्रक्रियासम्प्रदायः
    ॥ ॥ आर्द्रीभूतैरविरलकृपैरात्तलीलाविलासैः आस्थापूर्णैरधिकचपलैरञ्चिताम्भोजशिल्पैः । कान्तैर्लक्ष्मीललितभवनैः
    कान्तिकैवल्यसारैः काश्मल्यं नः कबलयतु सा कामकोटी कटाक्षैः ॥ ॥ आधून्वन्त्यै तरलनयनैराङ्गजीं वैजयन्तीम्
    आनन्दिन्यै निजपदजुषामात्तकाञ्चीपुरायै । आस्माकीनं हृदयमखिलैरागमानां प्रपञ्चैः आराध्यायै स्पृहयतितरामदिमायै
    जनन्यै ॥ ॥ दूरं वाचां त्रिदशसदसां दुःखसिन्धोस्तरित्रं मोहक्ष्वेलक्षितिरुहवने क्रूरधारं कुठारम् । कम्पातीरप्रणयि
    कविभिर्वर्णितोद्यच्चरित्रं शान्त्यै सेवे सकलविपदां शाङ्करं तत्कलत्रम् ॥ ॥ खण्डीकृत्य प्रकृतिकुटिलं
    कल्मषं प्रातिभश्री शुण्डीरत्वं निजपदजुषां शून्यतन्द्रं दिशन्ती । तुण्डीराख्यै महति विषये स्वर्णवृष्टिप्रदात्री
    चण्डी देवी कलयति रतिं चन्द्रचूडालचूडे ॥ ॥ येन ख्यातो भवति स गृही पूरुषो मेरुधन्वा यद्दृक्कोणे मदननिगमप्राभवं
    बोभवीति । यत्प्रीत्यैव त्रिजगदधिपो जृम्भते किम्पचानः कम्पातीरे स जयति महान्कश्चिदोजोविशेषः ॥ ॥ धन्या
    धन्या गतिरिह गिरां देवि कामाक्षि यन्मे निन्द्यां भिन्द्यात्सपदि जडतां कल्मषादुन्मिषन्तीम् । साध्वी
    माध्वीरसमधुरताभञ्जिनी मञ्जुरीतिः वाणीवेणी झटिति वृणुतात्स्वर्धुनीस्पर्धिनी माम् ॥ ॥ यस्या वाटी हृदयकमलं
    कौसुमी योगभाजां यस्याः पीठी सततशिशिरा शीकरैर्माकरन्दैः । यस्याः पेटी श्रुतिपरिचलन्मौलिरत्नस्य काञ्ची
    सा मे सोमाभरणमहिषी साधयेत्काङ्क्षितानि ॥ ॥ एका माता सकलजगतामीयुषी ध्यानमुद्राम् एकाम्राधीश्वरचरणयोरेकतानां
    समिन्धे । ताटङ्कोद्यन्मणिगणरुचा ताम्रकर्णप्रदेशा तारुण्यश्रीस्तबकिततनुस्तापसी कापि बाला ॥ ॥ दन्तादन्तिप्रकटनकरी
    दन्तिभिर्मन्दयानैः मन्दाराणां मदपरिणतिं मथ्नती मन्दहासैः । अङ्कूराभ्यां मनसिजतरोरङ्कितोराः कुचाभ्या
    मन्तःकाञ्चि स्फुरति जगतामादिमा कापि माता ॥ ॥ त्रियम्बककुटुम्बिनीं त्रिपुरसुन्दरीमिन्दिरां पुलिन्दपतिसुन्दरीं
    त्रिपुरभैरवीं भारतीम् । मतङ्गकुलनायिकां महिषमर्दनीं मातृकां भणन्ति विबुधोत्तमा विहृतिमेव कामाक्षि
    ते ॥ ॥ महामुनिमनोनटी महितरम्यकम्पातटी कुटीरकविहारिणी कुटिलबोधसंहारिणी । सदा भवतु कामिनी सकलदेहिनां
    स्वामिनी कृपातिशयकिङ्करी मम विभूतये शाङ्करी ॥ ॥ जडाः प्रकृतिनिर्धना जनविलोचनारुन्तुदा नरा जननि वीक्षणं
    क्षणमवाप्य कामाक्षि ते । वचस्सु मधुमाधुरीं प्रकटयन्ति पौरन्दरी विभूतिषु विडम्बनां वपुषि मान्मथीं प्रक्रियाम्
    ॥ ॥ घन्सतनतटस्फुटस्फुरितकञ्चुलीचञ्चली कृतत्रिपुरशासना सुजनशीलितोपासना । दृशोः सरणिमश्नुते मम कदा नु
    काञ्चीपुरे परा परमयोगिनां मनसि चित्कुला पुष्कला ॥ ॥ कवीन्द्रहृदयेचरी परिगृहीतकाञ्चीपुरी निरूढकरुणाझरी
    निखिललोकरक्षाकरी । मनःपथदवीयसी मदनशासनप्रेयसी महागुणगरीयसी मम दृशोऽस्तु नेदीयसी ॥ ॥ धनेन न रमामहे
    खलजनान्न सेवामहे न चापलमयामहे भवभयान्न दूयामहे । स्थिरां तनुमहेतरां मनसि किं च काञ्चीरत स्मरान्तककुटुम्बिनीचरणपल्लवोपासनाम्
    ॥ ॥ सुराः परिजना वपुर्मनसिजाय वैरायते त्रिविष्टपनितम्बिनीकुचतटी च केलीगिरिः । गिरः सुरभयो वयस्तरुणिमा
    दरिद्रस्य वा कटाक्षसरणौ क्षणं निपतितस्य कामाक्षि ते ॥ ॥ पवित्रय जगत्त्रयीविबुधबोधजीवातुभिः पुरत्रयविमर्दिनः
    पुलककञ्चुलीदायिभिः । भवक्षयविचक्षणैर्व्यसनमोक्षणैर्वीक्षणैः निरक्षरशिरोमणिं करुणयैव कामाक्षि माम्
    ॥ ॥ कदा कलितखेलनाः करुणयैव काञ्चीपुरे कलायमुकुलत्विषः शुभकदम्बपूर्णाङ्कुराः । पयोधरभरालसाः कविजनेषु
    ते बन्धुराः पचेलिमकृपारसा परिपतन्ति मार्गे दृशोः ॥ ॥ अशोध्यमचलोद्भवं हृदयनन्दनं देहिनाम् अनर्घमधिकाञ्चि
    तत्किमपि रत्नमुद्द्योतते । अनेन समलङ्कृता जयति शङ्कराङ्कस्थली कदास्य मम मानसं व्रजति पेटिकाविभ्रमम्
    ॥ ॥ परामृतझरीप्लुता जयति नित्यमन्तश्चरी भुवामपि बहिश्चरी परमसंविदेकात्मिका । महद्भिरपरोक्षिता सततमेव
    काञ्चीपुरे ममान्वहमहम्मतिर्मनसि भातु माहेश्वरी ॥ ॥ तमोविपिनधाविनं सततमेव काञ्चीपुरे विहाररसिका परा
    परमसंविदुर्वीरुहे । कटाक्षनिगलैर्दृढं हृदयदुष्टदन्तावलं चिरं नयतु मामकं त्रिपुरवैरिसीमन्तिनी ॥ ॥ त्वमेव
    सति चण्डिका त्वमसि देवि चामुण्डिका त्वमेव परमातृका त्वमपि योगिनीरूपिणी । त्वमेव किल शाम्भवी त्वमसि
    कामकोटी जया त्वमेव विजया त्वयि त्रिजगदम्ब किं ब्रूमहे ॥ ॥ परे जननि पार्वति प्रणतपालिनि प्रातिभ प्रदात्रि
    परमेश्वरि त्रिजगदाश्रिते शाश्वते । त्रियम्बककुटुम्बिनि त्रिपदसङ्गिनि त्रीक्षणे त्रिशक्तिमयि वीक्षणं
    मयि निधेहि कामाक्षि ते ॥ ॥ मनोमधुकरोत्सवं विदधती मनीषाजुषां स्वयम्प्रभववैखरीविपिनवीथिकालम्बिनी । अहो
    शिशिरिता कृपामधुरसेन कम्पातटे चराचरविधायिनी चलति कापि चिन्मञ्जरी ॥ ॥ कलावति कलाभृतो मुकुटसीम्नि लीलावति
    स्पृहावति महेश्वरे भुवनमोहने भास्वति । प्रभावति रमे सदा महितरूपशोभावति त्वरावति परे सतां गुरुकृपाम्बुधारावति
    ॥ ॥ त्वयैव जगदम्बया भुवनमण्डलं सूयते त्वयैव करुणार्द्रया तदपि रक्षणं नीयते । त्वयैव खरकोपया नयनपावके
    हूयते त्वयैव किल नित्यया जगति सन्ततं स्थीयते ॥ ॥ चराचरजगन्मयीं सकलहृन्मयीं चिन्मयीं गुणत्रयमयीं जगत्त्रयमयीं
    त्रिधामामयीम् । परापरमयीं सदा दशदिशां निशाहर्मयीं परां सततसन्मयीं मनसि चिन्मयीं शीलये ॥ ॥ जय जगदम्बिके
    हरकुटुम्बिनि वक्त्ररुचा जितशरदम्बुजे घनविडम्बिनि केशरुचा । परमवलम्बनं कुरु सदा पररूपधरे मम गतसंविदो
    जडिमडम्बरताण्डविनः ॥ ॥ भुवनजननि भूषाभूतचन्द्रे नमस्ते कलुषशमनि कम्पातीरगेहे नमस्ते । निखिलनिगमवेद्ये
    नित्यरूपे नमस्ते परशिवमयि पाशच्छेदहस्ते नमस्ते ॥ ॥ क्वणत्काञ्ची काञ्चीपुरमणिविपञ्चीलयझरी शिरःकम्पा
    कम्पावसतिरनुकम्पाजलनिधिः । घनश्यामा श्यामा कठिनकुचसीमा मनसि मे मृगाक्षी कामाक्षी हरनटनसाक्षी विहरतात्
    ॥ ॥ समरविजयकोटी साधकानन्दधाटी मृदुगुणपरिपेटी मुख्यकादम्बवाटी । मुनिनुतपरिपाटी मोहिताजाण्डकोटी परमशिववधूटी
    पातु मां कामकोटी ॥ ॥ इमं परवरप्रदं प्रकृतिपेशलं पावनं परापरचिदाकृतिप्रकटनप्रदीपायितम् । स्तवं पठति
    नित्यदा मनसि भावयन्नम्बिकां जपैरलमलं मखैरधिकदेहसंशोषणैः ॥ ॥ ॥ इति स्तुतिशतकं सम्पूर्णम् ॥
