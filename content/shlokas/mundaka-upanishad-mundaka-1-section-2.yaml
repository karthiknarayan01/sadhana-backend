id: mundaka-upanishad-mundaka-1-section-2
category: stotram
name:
  english: Mundaka Upanishad - Mundaka 1, Section 2
content:
  english: '|| prathamamundake dvitiyah khandah || tadeta mmantreshu karmani kavayo yanyapashyamstani
    tretaya mbahudha santatani | tanyacaratha niyatam satyakama esha vah pantha || yada lelayate hyarci
    ssamiddhe havyavahane | tada ''''hutih pratipadayet || || yasyagnihotramadar macaturmasyamanagrayanamatithivarjita
    nca | ahutamavaishvadevamavidhina huta masaptamamstasya lokan hinasti || || kali karali ca manojava
    ca sulohita ya ca sudhumravarna | sphulingini vishvaruci ca devi lelayamana iti sapta jihvah || ||
    eteshu yashcarate bhrajamaneshu yathakalam cahutayo hyadadayann | ta ssuryasya rashmayo yatra devana
    ssuvarcasah suryasya rashmibhiryajamanam ''rcayantya esha vah punya ssukrito brahmalokah || || plava
    hyete adridha yajnarupa ashtadashoktamavaram ye~shu karma | etacchreyo ye ''bhinandanti mudha jaramrityu
    nte punarevapi yanti || || avidyayamantare vartamanah svaya mmanyamanah | janghanyamanah pariyanti
    mudha andhenaiva niyamana yathandhah || mbahudha vartamana vayam kritartha ityabhimanyanti balah |
    ya tkarmino na pravedayanti ragat tenaturah kshinalokashcyavante || mmanyamana varishtham nanyacchreyo
    vedayante pramudhah | nakasya prishthe te sukrite ''nubhutvemam lokam hinataram || tapasshraddhe ye
    hyupavasantyaranye shanta vidvamso bhaikshyacarya ncarantah | suryadvarena te virajah prayanti yatramrita
    ssa purusho hyavyayatma || || parikshya lokan karmacita nbrahmano nirvedamayannastyakritah kritena
    | tadvijnanartham sa gurumevabhigacchet samitpani || tasmai sa vidvanupasannaya samyak prashantacittaya
    shamanvitaya | yenakshara ntattvato brahmavidyam || || || iti mundakopanishadi prathamamundake dvitiyah
    khandah ||'
  devanagari: ॥ प्रथममुण्डके द्वितीयः खण्डः ॥ तदेत म्मन्त्रेषु कर्माणि कवयो यान्यपश्यंस्तानि त्रेताया
    म्बहुधा सन्ततानि । तान्याचरथ नियतं सत्यकामा एष वः पन्था ॥ यदा लेलायते ह्यर्चि स्समिद्धे हव्यवाहने
    । तदा ऽऽहुतीः प्रतिपादयेत् ॥ ॥ यस्याग्निहोत्रमदर् मचातुर्मास्यमनाग्रयणमतिथिवर्जित ञ्च । अहुतमवैश्वदेवमविधिना
    हुत मासप्तमांस्तस्य लोकान् हिनस्ति ॥ ॥ काली कराली च मनोजवा च सुलोहिता या च सुधूम्रवर्णा । स्फुलिङ्गिनी
    विश्वरुची च देवी लेलायमाना इति सप्त जिह्वाः ॥ ॥ एतेषु यश्चरते भ्राजमानेषु यथाकालं चाहुतयो ह्याददायन्न्
    । त स्सूर्यस्य रश्मयो यत्र देवाना स्सुवर्चसः सूर्यस्य रश्मिभिर्यजमानं ऽर्चयन्त्य एष वः पुण्य स्सुकृतो
    ब्रह्मलोकः ॥ ॥ प्लवा ह्येते अदृढा यज्ञरूपा अष्टादशोक्तमवरं येँषु कर्म । एतच्छ्रेयो ये ऽभिनन्दन्ति
    मूढा जरामृत्यु न्ते पुनरेवापि यन्ति ॥ ॥ अविद्यायामन्तरे वर्तमानाः स्वय म्मन्यमानाः । जङ्घन्यमानाः
    परियन्ति मूढा अन्धेनैव नीयमाना यथान्धाः ॥ म्बहुधा वर्तमाना वयं कृतार्था इत्यभिमन्यन्ति बालाः । य त्कर्मिणो
    न प्रवेदयन्ति रागात् तेनातुराः क्षीणलोकाश्च्यवन्ते ॥ म्मन्यमाना वरिष्ठं नान्यच्छ्रेयो वेदयन्ते प्रमूढाः
    । नाकस्य पृष्ठे ते सुकृते ऽनुभूत्वेमं लोकं हीनतरं ॥ तपस्श्रद्धे ये ह्युपवसन्त्यरण्ये शान्ता विद्वांसो
    भैक्ष्यचर्या ञ्चरन्तः । सूर्यद्वारेण ते विरजाः प्रयान्ति यत्रामृत स्स पुरुषो ह्यव्ययात्मा ॥ ॥ परीक्ष्य
    लोकान् कर्मचिता न्ब्राह्मणो निर्वेदमायान्नास्त्यकृतः कृतेन । तद्विज्ञानार्थं स गुरुमेवाभिगच्छेत् समित्पाणि
    ॥ तस्मै स विद्वानुपसन्नाय सम्यक् प्रशान्तचित्ताय शमान्विताय । येनाक्षर न्तत्त्वतो ब्रह्मविद्याम् ॥
    ॥ ॥ इति मुण्डकोपनिषदि प्रथममुण्डके द्वितीयः खण्डः ॥
