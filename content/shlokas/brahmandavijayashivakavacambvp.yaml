id: brahmandavijayashivakavacambvp
category: kavacha
name:
  english: brahmandavijayashivakavacamBVP
  devanagari: ब्रह्माण्डविजयशिवकवचम्BVP
content:
  english: rinu viprendra shankarasya mahatmanah | brahmanda vijayam nama sarva'vayava rakshanam || 2||
    pura durvasasa dattam matsyasya rajaya dhimate | datva shadaksharam mantram sarva papa pranashanam
    || 3|| sthite ca kavace dehe nasti mrityushca jivinam | astreshastrejalevahnau siddhishcennasti samshayah
    || 4|| yaddhritva pathanat banah shivatvam prapalilaya | babhuva shivatulyashca yaddhritva nandikeshvarah
    || 5|| virashreshtho virabhadro sambo'bhud dharanadyatah | trailokya vijayi raja hiranyakashipuh svayam
    || 6|| hiranyakshashca vijayi ca'bhavad dharanaddhi sah | yaddhritva pathanat siddho durvasa vishva
    pujitah || 7|| jaigishavyo mahayogi pathanad dharanadyatah | yaddhritva vamadevashca devalah pavanah
    svayam || 8|| agastyashca pulastyashca'bhavat vishvapujitah || 9|| || shrishivakavacam || om namah
    shivayeti ca mastakam me sada'vatu | om namah shivayeti ca svaha bhalam sada'vatu || 1|| om hrim shrim
    klim shivayeti svaha netre sada'vatu | om hrim klim hum shivayeti namo me patu nasikam || 2|| om namah
    shivaya shantaya svaha kantham sada'vatu | om hrim shrim hum samsara kartre svaha karnau sadavatu
    || 3|| om hrim shrim pancavaktraya svaha dantam sadavatu | om hrim maheshaya svaha ca'dharam patu
    me sada || 4|| om hrim shrim klim trinetraya svaha keshan sada'vatu | om hrim aim mahadevaya svaha
    vakshah sada'vatu || 5|| om hrim shrim klim me rudraya svaha nabhim sada'vatu | om hrim aim shrim
    shrim ishvaraya svaha prishtham sada'vatu || 6|| om hrim klim mritunjayaya svaha bhruvau sada'vatu
    | om hrim shrim klim ishanaya svaha parshvam sada'vatu || 7|| om hrim ishvaraya svaha codaram patu
    me sada | om shrim hrim mrityunjayaya svaha bahu sada'vatu || 8|| om hrim shrim klim ishvaraya svaha
    patu karau mama | om maheshvaraya rudraya nitambam patu me sada || 9|| om hrim shrim bhutanathaya
    svaha padau sada'vatu | om sarveshvaraya sharvaya svaha padau sada'vatu || 10|| pracyam mam patu bhuteshah
    agneyyam patu shankarah | dakshine patu mam rudro nairrityam sthanureva ca || 11|| pashcime khandaparashurvayavyam
    candrashekharah | uttare girishah patu caishanyam ishvarah svayam || 12|| urdhve mridah sada patu
    ca'dho mrityunjayah svayam | jale sthale ca'ntarikshe svapne jagarane sada || 13|| pinaki patu mam
    pritya bhaktam vai bhaktavatsalah || 14|| || phalashrutih || iti te kathitam vatsa kavacam parama'dbhutam
    || 15|| dasha laksha japenaiva siddhirbhavati nishcitam | yadi syat siddha kavaco rudra tulyo bhaved
    dhruvam || 16|| tava snehan maya''khyatam pravaktavyam na kasyacit | kavacam kanva shakhoktam atigopyam
    sudurlabham || 17|| ashvamedha sahasrani rajasuya shatani ca | sarvani kavacasyasya phalam narhanti
    shodashim || 18|| kavacasya prasadena jivanmukto bhavennarah | sarvajnah sarvasiddhesho manoyayi bhaved
    dhruvam || 19|| idam kavacam ajnatva bhavet yah shankaraprabhum | shatalaksham prajapto'pi na mantrah
    siddhidayakah || 20|| || iti shribrahmavaivarte purane ganapatikhande brahmandavijayi nama shrishankarakavacastotram
    sampurnam || brahmandavijaya shrishivakavacam brahmavaivartapurana | ganapatikhanda | adhyaya 35
  devanagari: ृणु विप्रेन्द्र शङ्करस्य महात्मनः । ब्रह्माण्ड विजयं नाम सर्वाऽवयव रक्षणम् ॥ २॥ पुरा दुर्वाससा
    दत्तं मत्स्यस्य राजाय धीमते । दत्वा षडक्षरं मन्त्रं सर्व पाप प्रणाशनम् ॥ ३॥ स्थिते च कवचे देहे नास्ति
    मृत्युश्च जीविनाम् । अस्त्रेशस्त्रेजलेवह्नौ सिद्धिश्चेन्नास्ति संशयः ॥ ४॥ यद्धृत्वा पठनात् बाणः शिवत्वं
    प्रापलीलया । बभूव शिवतुल्यश्च यद्धृत्वा नन्दिकेश्वरः ॥ ५॥ वीरश्रेष्ठो वीरभद्रो साम्बोऽभूद् धारणाद्यतः
    । त्रैलोक्य विजयी राजा हिरण्यकशिपुः स्वयम् ॥ ६॥ हिरण्याक्षश्च विजयी चाऽभवद् धारणाद्धि सः । यद्धृत्वा
    पठनात् सिद्धो दुर्वासा विश्व पूजितः ॥ ७॥ जैगीषव्यो महायोगी पठनाद् धारणाद्यतः । यद्धृत्वा वामदेवश्च
    देवलः पवनः स्वयम् ॥ ८॥ अगस्त्यश्च पुलस्त्यश्चाऽभवत् विश्वपूजितः ॥ ९॥ ॥ श्रीशिवकवचम् ॥ ॐ नमः शिवायेति
    च मस्तकं मे सदाऽवतु । ॐ नमः शिवायेति च स्वाहा भालं सदाऽवतु ॥ १॥ ॐ ह्रीं श्रीं क्लीं शिवायेति स्वाहा
    नेत्रे सदाऽवतु । ॐ ह्रीं क्लीं हूं शिवायेति नमो मे पातु नासिकाम् ॥ २॥ ॐ नमः शिवाय शान्ताय स्वाहा कण्ठं
    सदाऽवतु । ॐ ह्रीं श्रीं हूं संसार कर्त्रे स्वाहा कर्णौ सदावतु ॥ ३॥ ॐ ह्रीं श्रीं पञ्चवक्त्राय स्वाहा
    दन्तं सदावतु । ॐ ह्रीं महेशाय स्वाहा चाऽधरं पातु मे सदा ॥ ४॥ ॐ ह्रीं श्रीं क्लीं त्रिनेत्राय स्वाहा
    केशान् सदाऽवतु । ॐ ह्रीं ऐं महादेवाय स्वाहा वक्षः सदाऽवतु ॥ ५॥ ॐ ह्रीं श्रीं क्लीं मे रुद्राय स्वाहा
    नाभिं सदाऽवतु । ॐ ह्रीं ऐं श्रीं श्रीं ईश्वराय स्वाहा पृष्ठं सदाऽवतु ॥ ६॥ ॐ ह्रीं क्लीं मृतुञ्जयाय
    स्वाहा भ्रुवौ सदाऽवतु । ॐ ह्रीं श्रीं क्लीं ईशानाय स्वाहा पार्श्वं सदाऽवतु ॥ ७॥ ॐ ह्रीं ईश्वराय स्वाहा
    चोदरं पातु मे सदा । ॐ श्रीं ह्रीं मृत्युञ्जयाय स्वाहा बाहू सदाऽवतु ॥ ८॥ ॐ ह्रीं श्रीं क्लीं ईश्वराय
    स्वाहा पातु करौ मम । ॐ महेश्वराय रुद्राय नितम्बं पातु मे सदा ॥ ९॥ ॐ ह्रीं श्रीं भूतनाथाय स्वाहा पादौ
    सदाऽवतु । ॐ सर्वेश्वराय शर्वाय स्वाहा पादौ सदाऽवतु ॥ १०॥ प्राच्यां मां पातु भूतेशः आग्नेय्यां पातु
    शङ्करः । दक्षिणे पातु मां रुद्रो नैरृत्यां स्थाणुरेव च ॥ ११॥ पश्चिमे खण्डपरशुर्वायव्यां चन्द्रशेखरः
    । उत्तरे गिरिशः पातु चैशान्यां ईश्वरः स्वयम् ॥ १२॥ ऊर्ध्वे मृडः सदा पातु चाऽधो मृत्युञ्जयः स्वयम्
    । जले स्थले चाऽन्तरिक्षे स्वप्ने जागरणे सदा ॥ १३॥ पिनाकी पातु मां प्रीत्या भक्तं वै भक्तवत्सलः ॥ १४॥
    ॥ फलश्रुतिः ॥ इति ते कथितं वत्स कवचं परमाऽद्भुतम् ॥ १५॥ दश लक्ष जपेनैव सिद्धिर्भवति निश्चितम् । यदि
    स्यात् सिद्ध कवचो रुद्र तुल्यो भवेद् ध्रुवम् ॥ १६॥ तव स्नेहान् मयाऽऽख्यातं प्रवक्तव्यं न कस्यचित्
    । कवचं काण्व शाखोक्तं अतिगोप्यं सुदुर्लभम् ॥ १७॥ अश्वमेध सहस्राणि राजसूय शतानि च । सर्वाणि कवचस्यास्य
    फलं नार्हन्ति षोडशीम् ॥ १८॥ कवचस्य प्रसादेन जीवन्मुक्तो भवेन्नरः । सर्वज्ञः सर्वसिद्धेशो मनोयायी भवेद्
    ध्रुवम् ॥ १९॥ इदं कवचं अज्ञात्वा भवेत् यः शङ्करप्रभुम् । शतलक्षं प्रजप्तोऽपि न मन्त्रः सिद्धिदायकः
    ॥ २०॥ ॥ इति श्रीब्रह्मवैवर्ते पुराणे गणपतिखण्डे ब्रह्माण्डविजयी नाम श्रीशङ्करकवचस्तोत्रं सम्पूर्णम्
    ॥ ब्रह्माण्डविजय श्रीशिवकवचम् ब्रह्मवैवर्तपुराण । गणपतिखण्ड । अध्याय ३५
