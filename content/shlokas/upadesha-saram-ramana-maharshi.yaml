id: upadesha-saram-ramana-maharshi
category: stotram
name:
  english: Upadesha Saram (Ramana Maharshi)
content:
  english: karturajnaya prapyate phalam | karma kim param karma tajjadam || || kritimahodadhau patanakaranam
    | phalamashashvatam gatinirodhakam || || ishvararpitam necchaya kritam | cittashodhakam muktisadhakam
    || || kayavanmanah karyamuttamam | pujanam japashcintanam kramat || || jagata ishadhi yuktasevanam
    | ashtamurtibhriddevapujanam || || uttamastavaduccamandatah | cittajam japadhyanamuttamam || || ajyadharaya
    srotasa samam | saralacintanam viralatah param || || bhedabhavanat so'hamityasau | bhavana'bhida pavani
    mata || || bhavashunyasadbhavasusthitih | bhavanabaladbhaktiruttama || || hritsthale manah svasthata
    kriya | bhaktiyogabodhashca nishcitam || || vayurodhanalliyate manah | jalapakshivadrodhasadhanam
    || || cittavayavashcitkriyayutah | shakhayordvayi shaktimulaka || || layavinashane ubhayarodhane |
    layagatam punarbhavati no mritam || || pranabandhanallinamanasam | ekacintanannashametyadah || ||
    nashtamanasotkrishtayoginah | krityamasti kim svasthitim yatah || || drishyavaritam cittamatmanah
    | cittvadarshanam tattvadarshanam || || manasam tu kim margane krite | naiva manasam marga arjavat
    || || vrittayastvaham vrittimashritah | vrittayo mano viddhyaham manah || || ahamayam kuto bhavati
    cinvatah | ayi patatyaham nijavicaranam || || ahami nashabhajyahamahantaya | sphurati hritsvayam paramapurnasat
    || || idamaham pada'bhikhyamanvaham | ahamilinake'pyalayasattaya || || vigrahendriyapranadhitamah
    | nahamekasattajjadam hyasat || || sattvabhasika citkvavetara | sattaya hi ciccittaya hyaham || ||
    ishajivayorveshadhibhida | satsvabhavato vastu kevalam || || veshahanatah svatmadarshanam | ishadarshanam
    svatmarupatah || || atmasamsthitih svatmadarshanam | atmanirdvayadatmanishthata || || jnanavarjita'jnanahinacit
    | jnanamasti kim jnatumantaram || || kim svarupamityatmadarshane | avyaya'bhava''purnacitsukham ||
    || bandhamuktyatitam param sukham | vindatiha jivastu daivikah || || ahamapetakam nijavibhanakam |
    mahadidantapo ramanavagiyam ||
  devanagari: कर्तुराज्ञया प्राप्यते फलम् । कर्म किं परं कर्म तज्जडम् ॥ ॥ कृतिमहोदधौ पतनकारणम् । फलमशाश्वतं
    गतिनिरोधकम् ॥ ॥ ईश्वरार्पितं नेच्छया कृतम् । चित्तशोधकं मुक्तिसाधकम् ॥ ॥ कायवाङ्मनः कार्यमुत्तमम्
    । पूजनं जपश्चिन्तनं क्रमात् ॥ ॥ जगत ईशधी युक्तसेवनम् । अष्टमूर्तिभृद्देवपूजनम् ॥ ॥ उत्तमस्तवादुच्चमन्दतः
    । चित्तजं जपध्यानमुत्तमम् ॥ ॥ आज्यधारया स्रोतसा समम् । सरलचिन्तनं विरलतः परम् ॥ ॥ भेदभावनात् सोऽहमित्यसौ
    । भावनाऽभिदा पावनी मता ॥ ॥ भावशून्यसद्भावसुस्थितिः । भावनाबलाद्भक्तिरुत्तमा ॥ ॥ हृत्स्थले मनः स्वस्थता
    क्रिया । भक्तियोगबोधाश्च निश्चितम् ॥ ॥ वायुरोधनाल्लीयते मनः । जालपक्षिवद्रोधसाधनम् ॥ ॥ चित्तवायवश्चित्क्रियायुताः
    । शाखयोर्द्वयी शक्तिमूलका ॥ ॥ लयविनाशने उभयरोधने । लयगतं पुनर्भवति नो मृतम् ॥ ॥ प्राणबन्धनाल्लीनमानसम्
    । एकचिन्तनान्नाशमेत्यदः ॥ ॥ नष्टमानसोत्कृष्टयोगिनः । कृत्यमस्ति किं स्वस्थितिं यतः ॥ ॥ दृश्यवारितं
    चित्तमात्मनः । चित्त्वदर्शनं तत्त्वदर्शनम् ॥ ॥ मानसं तु किं मार्गणे कृते । नैव मानसं मार्ग आर्जवात्
    ॥ ॥ वृत्तयस्त्वहं वृत्तिमाश्रिताः । वृत्तयो मनो विद्ध्यहं मनः ॥ ॥ अहमयं कुतो भवति चिन्वतः । अयि पतत्यहं
    निजविचारणम् ॥ ॥ अहमि नाशभाज्यहमहन्तया । स्फुरति हृत्स्वयं परमपूर्णसत् ॥ ॥ इदमहं पदाऽभिख्यमन्वहम् ।
    अहमिलीनकेऽप्यलयसत्तया ॥ ॥ विग्रहेन्द्रियप्राणधीतमः । नाहमेकसत्तज्जडं ह्यसत् ॥ ॥ सत्त्वभासिका चित्क्ववेतरा
    । सत्तया हि चिच्चित्तया ह्यहम् ॥ ॥ ईशजीवयोर्वेषधीभिदा । सत्स्वभावतो वस्तु केवलम् ॥ ॥ वेषहानतः स्वात्मदर्शनम्
    । ईशदर्शनं स्वात्मरूपतः ॥ ॥ आत्मसंस्थितिः स्वात्मदर्शनम् । आत्मनिर्द्वयादात्मनिष्ठता ॥ ॥ ज्ञानवर्जिताऽज्ञानहीनचित्
    । ज्ञानमस्ति किं ज्ञातुमन्तरम् ॥ ॥ किं स्वरूपमित्यात्मदर्शने । अव्ययाऽभवाऽऽपूर्णचित्सुखम् ॥ ॥ बन्धमुक्त्यतीतं
    परं सुखम् । विन्दतीह जीवस्तु दैविकः ॥ ॥ अहमपेतकं निजविभानकम् । महदिदन्तपो रमनवागियम् ॥
