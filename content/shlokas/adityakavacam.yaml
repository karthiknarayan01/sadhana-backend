id: adityakavacam
category: kavacha
name:
  english: adityakavacam
  devanagari: आदित्यकवचम्
content:
  english: jagaticchandasi | ghriniriti bijam | surya iti shaktih | aditya iti kilakam | shrisuryanarayanaprityarthe
    jape viniyogah | dhyanam udayacalamagatya vedarupamanamayam | tushtava paraya bhaktya valakhilyadibhirvritam
    || 1|| devasuraissada vandyam grahaishca pariveshtitam | dhyayan stuvan pathan nama yassuryakavacam
    sada || 2|| ghrinih patu shirodesham suryah phalam ca patu me | adityo locane patu shruti patu prabhakarah
    || 3|| ghranam patu sada bhanuh arkah patu mukham tatha | jihvam patu jagannathah kantham patu vibhavasuh
    || 4|| skandhau grahapatih patu bhujau patu prabhakarah | ahaskarah patu hastau hridayam patu bhanuman
    || 5|| madhyam ca patu saptashvo nabhim patu nabhomanih | dvadashatma katim patu savita patu srikkini
    || 6|| uru patu surashreshtho januni patu bhaskarah | janghe patu ca martando galam patu tvishampatih
    || 7|| padau bradhnassada patu mitro'pi sakalam vapuh | vedatrayatmaka svamin narayana jagatpate |
    ayatayamam tam kancidvedarupah prabhakarah || 8|| stotrenanena santushto valakhilyadibhirvritah |
    sakshadvedamayo devo ratharudhassamagatah || 9|| tam drishtva sahasotthaya dandavatpranaman bhuvi
    | kritanjaliputo bhutva suryasyagre sthitastada || 10|| vedamurtirmahabhago jnanadrishtirvicarya ca
    | brahmana sthapitam purvam yatayamavivarjitam || 11|| sattvapradhanam shuklakhyam vedarupamanamayam
    | shabdabrahmamayam vedam satkarmabrahmavacakam || 12|| munimadhyapayamasa prathamam savita svayam
    | tena prathamadattena vedena parameshvarah || 13|| yajnavalkyo munishreshthah kritakrityo'bhavattada
    | rigadisakalan vedan jnatavan suryasannidhau || 14|| idam proktam mahapunyam pavitram papanashanam
    | yah pathecchrinuyadvapi sarvapapaih pramucyate | vedarthajnanasampannassuryalokamavapnuyat || 15||
    iti skandapurane gaurikhande adityakavacam samaptam |
  devanagari: जगतीच्छन्दसी । घृणिरिति बीजम् । सूर्य इति शक्तिः । आदित्य इति कीलकम् । श्रीसूर्यनारायणप्रीत्यर्थे
    जपे विनियोगः । ध्यानं उदयाचलमागत्य वेदरूपमनामयम् । तुष्टाव परया भक्त्या वालखिल्यादिभिर्वृतम् ॥ १॥
    देवासुरैस्सदा वन्द्यं ग्रहैश्च परिवेष्टितम् । ध्यायन् स्तुवन् पठन् नाम यस्सूर्यकवचं सदा ॥ २॥ घृणिः
    पातु शिरोदेशं सूर्यः फालं च पातु मे । आदित्यो लोचने पातु श्रुती पातु प्रभाकरः ॥ ३॥ घ्राणं पातु सदा
    भानुः अर्कः पातु मुखं तथा । जिह्वां पातु जगन्नाथः कण्ठं पातु विभावसुः ॥ ४॥ स्कन्धौ ग्रहपतिः पातु भुजौ
    पातु प्रभाकरः । अहस्करः पातु हस्तौ हृदयं पातु भानुमान् ॥ ५॥ मध्यं च पातु सप्ताश्वो नाभिं पातु नभोमणिः
    । द्वादशात्मा कटिं पातु सविता पातु सृक्किणी ॥ ६॥ ऊरू पातु सुरश्रेष्ठो जानुनी पातु भास्करः । जङ्घे
    पातु च मार्ताण्डो गलं पातु त्विषाम्पतिः ॥ ७॥ पादौ ब्रध्नस्सदा पातु मित्रोऽपि सकलं वपुः । वेदत्रयात्मक
    स्वामिन् नारायण जगत्पते । अयातयामं तं कञ्चिद्वेदरूपः प्रभाकरः ॥ ८॥ स्तोत्रेणानेन सन्तुष्टो वालखिल्यादिभिर्वृतः
    । साक्षाद्वेदमयो देवो रथारूढस्समागतः ॥ ९॥ तं दृष्ट्वा सहसोत्थाय दण्डवत्प्रणमन् भुवि । कृताञ्जलिपुटो
    भूत्वा सूर्यस्याग्रे स्थितस्तदा ॥ १०॥ वेदमूर्तिर्महाभागो ज्ञानदृष्टिर्विचार्य च । ब्रह्मणा स्थापितं
    पूर्वं यातयामविवर्जितम् ॥ ११॥ सत्त्वप्रधानं शुक्लाख्यं वेदरूपमनामयम् । शब्दब्रह्ममयं वेदं सत्कर्मब्रह्मवाचकम्
    ॥ १२॥ मुनिमध्यापयामास प्रथमं सविता स्वयम् । तेन प्रथमदत्तेन वेदेन परमेश्वरः ॥ १३॥ याज्ञवल्क्यो मुनिश्रेष्ठः
    कृतकृत्योऽभवत्तदा । ऋगादिसकलान् वेदान् ज्ञातवान् सूर्यसन्निधौ ॥ १४॥ इदं प्रोक्तं महापुण्यं पवित्रं
    पापनाशनम् । यः पठेच्छृणुयाद्वापि सर्वपापैः प्रमुच्यते । वेदार्थज्ञानसम्पन्नस्सूर्यलोकमावप्नुयात् ॥
    १५॥ इति स्कान्दपुराणे गौरीखण्डे आदित्यकवचं समाप्तम् ।
