id: hariharaputrasahasranamabhishekamantram-2
category: sahasranama
name:
  english: hariharaputrasahasranamabhishekamantram
  devanagari: हरिहरपुत्रसहस्रनामाभिषेकमन्त्रम्
content:
  english: karmani me shudhyantam | jyotiraham viraja vipapma bhuyasagm svaha || 7|| devasya tva savituh
    prasave ashvinorbahubhyam pushno hastabhyam ashvino bheshajyena tejase brahmavarcasayabhishincami
    || 8|| devasya tva savituh prasave ashvinorbahubhyam pushno hastabhyam sarasvatyai bheshajyena viryayannadyayabhishincami
    || 9|| devasya tva savituh prasave ashvinorbahubhyam pushno hastabhyam indrasyendriyena shriyai yashase
    balayabhishincami || 10|| iti shrihariharaputrasahasranamabhishekamantram sampurnam |
  devanagari: कर्माणि मे शुध्यन्ताम् । ज्योतिरहं विरजा विपाप्मा भूयासग्ं स्वाहा ॥ ७॥ देवस्य त्वा सवितुः
    प्रसवे अश्विनोर्बाहुभ्यां पूष्णो हस्ताभ्यां अश्विनो भेषज्येन तेजसे ब्रह्मवर्चसायाभिषिञ्चामि ॥ ८॥ देवस्य
    त्वा सवितुः प्रसवे अश्विनोर्बाहुभ्यां पूष्णो हस्ताभ्यां सरस्वत्यै भेषज्येन वीर्यायान्नाद्यायाभिषिञ्चामि
    ॥ ९॥ देवस्य त्वा सवितुः प्रसवे अश्विनोर्बाहुभ्यां पूष्णो हस्ताभ्यां इन्द्रस्येन्द्रियेण श्रियै यशसे
    बलायाभिषिञ्चामि ॥ १०॥ इति श्रीहरिहरपुत्रसहस्रनामाभिषेकमन्त्रं सम्पूर्णम् ।
