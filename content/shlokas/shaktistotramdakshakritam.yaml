id: shaktistotramdakshakritam
category: stotram
name:
  english: shaktistotramdakshakritam
  devanagari: शक्तिस्तोत्रम्दक्षकृतं
content:
  english: dakshakritam shaktistotram || shriganeshaya namah || daksha uvaca | tatastam prananamatha tushtava
    prakritanjalih | namaste shaktirupayai mayamohasvarupini || 27|| jagaddhatryai namastubhyam jaganmatarnamo
    namah | sarvesham pranadatryai te sarvarupini te namah || 28|| anadyai cadibhutayai parvatyai te namo
    namah | gayatrika shrisavitrirupayai te namo namah || 29|| prakrityai purushakhyayai namarupaprakashini
    | nirgunayai gunanam vai dharikayai namo namah || 30|| prasida bhava me putri dakshayani namo namah
    | tatastam parvati praha bhaktam dakshaprajapatim || 31||
  devanagari: दक्षकृतं शक्तिस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ दक्ष उवाच । ततस्तां प्रणनामाथ तुष्टाव प्रकृताञ्जलिः
    । नमस्ते शक्तिरूपायै मायामोहस्वरूपिणि ॥ २७॥ जगद्धात्र्यै नमस्तुभ्यं जगन्मातर्नमो नमः । सर्वेषां प्राणदात्र्यै
    ते सर्वरूपिणि ते नमः ॥ २८॥ अनाद्यै चादिभूतायै पार्वत्यै ते नमो नमः । गायत्रिका श्रीसावित्रीरूपायै
    ते नमो नमः ॥ २९॥ प्रकृत्यै पुरुषाख्यायै नामरूपप्रकाशिनि । निर्गुणायै गुणानां वै धारिकायै नमो नमः ॥
    ३०॥ प्रसीद भव मे पुत्री दाक्षायणि नमो नमः । ततस्तं पार्वती प्राह भक्तं दक्षप्रजापतिम् ॥ ३१॥
