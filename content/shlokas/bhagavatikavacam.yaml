id: bhagavatikavacam
category: kavacha
name:
  english: bhagavatikavacam
  devanagari: भगवतिकवचम्
content:
  english: rinkhale hana hana om bhaksha bhaksha om are raktam piba kapalena raktakshi raktapate bhasmangi
    bhasmaliptasharire vajrayudhe vajraprakaranicite om purvam disham bandha bandha om dakshinam disham
    bandha bandha om pashcimam disham bandha bandha om uttaram disham bandha bandha om nagan bandha bandha
    nagapatnirbandha bandha om asuran bandha bandha om yaksharakshasapishacan bandha bandha pretabhutagandharvadi
    ye kecidupadravastebhyo raksha raksha om urdhvam raksha raksha adho raksha raksha kshurikam bandha
    bandha om jvalamahabale ghati ghati om moti moti satavali vajrangi vajraprakare hu~ phat hrim hrum
    shrim phat hrim hrah phrum phrem phrah sarvagrahebhyah sarvavyadhibhyah sarvadushtopadravebhyah hrim
    amivebhyo raksha raksha grahabhuta jvaradishu sarvakarmashu yojayet || ityagneyam bhagavatikavacam
    sampurnam ||
  devanagari: ृङ्खले हन हन ॐ भक्ष भक्ष ॐ अरे रक्तं पिब कपालेन रक्ताक्षि रक्तपटे भस्माङ्गि भस्मलिप्तशरीरे
    वज्रायुधे वज्रप्राकारनिचिते ॐ पूर्वां दिशं बन्ध बन्ध ॐ दक्षिणां दिशं बन्ध बन्ध ॐ पश्चिमां दिशं बन्ध
    बन्ध ॐ उत्तरां दिशं बन्ध बन्ध ॐ नागान् बन्ध बन्ध नागपत्नीर्बन्ध बन्ध ॐ असुरान् बन्ध बन्ध ॐ यक्षराक्षसपिशाचान्
    बन्ध बन्ध प्रेतभूतगन्धर्वादि ये केचिदुपद्रवास्तेभ्यो रक्ष रक्ष ॐ ऊर्ध्वं रक्ष रक्ष अधो रक्ष रक्ष क्षुरिकं
    बन्ध बन्ध ॐ ज्वलमहाबले घटि घटि ॐ मोटि मोटि सटावलि वज्राङ्गि वज्रप्राकारे हुँ फट् ह्रीं ह्रूं श्रीं
    फट् ह्रीं ह्रः फ्रूं फ्रें फ्रः सर्वग्रहेभ्यः सर्वव्याधिभ्यः सर्वदुष्टोपद्रवेभ्यः ह्रीं आमीवेभ्यो
    रक्ष रक्ष ग्रहभूत ज्वरादिषु सर्वकर्मषु योजयेत् ॥ इत्याग्नेयं भगवतीकवचं सम्पूर्णम् ॥
