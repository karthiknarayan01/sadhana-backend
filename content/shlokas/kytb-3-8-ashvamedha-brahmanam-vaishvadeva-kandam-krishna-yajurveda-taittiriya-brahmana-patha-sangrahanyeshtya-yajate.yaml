id: kytb-3-8-ashvamedha-brahmanam-vaishvadeva-kandam-krishna-yajurveda-taittiriya-brahmana-patha-sangrahanyeshtya-yajate
category: stotram
name:
  english: KYTB 3.8 Ashvamedha Brahmanam Vaishvadeva Kandam - Krishna Yajurveda Taittiriya Brahmana Patha
    - Sangrahanyeshtya Yajate
content:
  english: krishna yajurvediya taittiriya brahmane tritiyashtake ashtamah prapathakah shri gurubhyo namah
    | harih om || sangrahanyeshtyadayah yajamanasamskarah sagramhanyeshtya yajate | ima njanatagm sangahnaniti
    || dvadasharatni rashana bhavati | dvadasha masa va~thsarameva varundhe | maunji bhavati | urgvai
    munjah | urjame va varundhe || citra nakshatra ssamriddhyai || punyanama devayajana maddhyavasyati
    | punyameva tena kirtimabhijayati || apadati nritvijah samavahantya subrahmanyayah | suvargasya lokasya
    samashtyai || keshashmashru vapate | nakhani nikrintate | dato dhavate | snati | ahatam va~sah paridhatte
    | papmano ya~tvopavasati | suvargasya lokasya guptyai njagarayanta asate | suvargasya lokasya samashtyai
    || brahmaudanabhidhanam catushtayya apo bhavanti | catushshapho va ashvah prajapatya ssamriddhyai
    || ta digbhya ssamabhrita bhavanti | dikshu va apah | annam va~ apah | adbhyo va anna njayate | yadevadbhyo
    njayate | tadavarundhe || tasu brahmaudana mpacati | reta eva taddadhati || || catushsharavo bhavati
    | dikshveva pratitishthati || ubhayato rukmau bhavatah | ubhayata evasmin ndadhati | uddharati shritatvaya
    | sarpishva nbhavati meddhyatvaya | catvara ar sheyah prashnanti | dishameva jyotishi juhoti | catvari
    hiranyani dadati | dishamava jyotigshya varundhe || mucchishyate | tasmin nnyunatti | prajapatirva
    odanah | reta ajya nnyunatti | prajapatimeva retasa samardhayati || darbhamayi rashana bhavati | bahu
    va esha kucaro 'meddhyamupagacchati | yadashvah | pavitram || yaddarbhamayi rashana bhavati | punatyevaina
    malabhate || ashvasya va alabdhasya mahimoda kramat | sa mahartvijah pravishat | tanmahartvija mmahartviktvam
    | yanmahartvijah prashnanti | mahimana taddadhati || ashvasya va alabdhasya reta udakramat | tathsuvarnagm
    hiranya mabhavat | yathsuvarnagm hiranya ndadati | reta eva taddadhati || odane dadati | reto va odanah
    | reto hiranyam | retasaivasmi 'shvabandhanam yo vai brahmane devebhyah prajapataye mbaddhnati | a
    devata bhyo vrishcyate | papiyanbhavati | yah pratiprocya | na devata bhya avrishcyate | vasiyanbhavati
    || yadaha | brahmannashva thsyami devebhyah prajapataye tena raddhyasamiti | brahma vai brahma | brahmana
    eva devebhyah prajapataye pratiprocyashva bhya avrishcyate | vasiya nbhavati || devasya tva savituh
    prasava iti rashana mityaha | ashvinau hi devana va~ etadyajnasya | yadayajushkena kriyate tyadhi
    vadati yajushkrityai | yajnasya samriddhyai || || tadahuh | dvadasharatni rashana kartavya riti |
    rishabho va esha ritunam | yathsam va~thsarah | tasya trayodasho maso vishtapa m | rishabha esha yajnana
    m | yadashvamedhah | yatha va rishabhasya vishtapa m | evametasya vishtapa m | trayodashamaratnigm
    rashanaya shabhasya vishtapagm sagg skaroti | tadrigeva tat || purva ayushi vidatheshu kavyetyaha
    | ayurevasmi ndadhati || taya deva rityaha | bhutimevopavartate || ritasya samana thsaramarapantityaha
    | satyam va~ ritam | satyenaivaina mritenarabhate || abhidha asityaha || dashvamedhayaji sarvani bhutanyabhi
    bhavati | bhuvana masityaha | bhumana 'sityaha | yantaramevaina 'sityaha | dhartaramevaina vai~shvanare
    juhoti | saprathasamityaha || mpashubhih prathayati | svahakrita ityaha | homa evasyashah | prithivya
    mityaha | asyamevaina mpratishthapayati | yanta radyanta 'si dharuna ityaha | rupamevasyai vya~cashte
    | krishyai tva kshemaya tva rayyai tva poshaya tvetyaha | ashishamevaitamasha ste || svaga tva devebhya
    ityaha | devebhya evainagg svaga karoti | svaha tva prajapataya ityaha | prajapatyo va ashvah | yasya
    eva devataya alabhyata | tayaivainagm samardhayati || devebhya ityaha panca ca 'vagahanam yah pituranujayah
    putrah | sa purasta nnayati | yo maturanujayah putrah | sa pashcannayati | vishvancamevasma vi~vrihatah
    || yo arvanta njighagmsati tamabhyamiti varuna iti shvana mprasauti | paro martah para rakshasya prahanti
    | shveva vai papma bhratrivyah | papmana mevasya bhratrivyagm hanti || saiddhraka || karma karmaivasmai
    sadhayati || pauggshcaleyo hanti | puggshcalvam nnyadadhuh | shucaivasya shucagm hanti || papma va
    etami 'shvamedhena yajata iti | ashvasyadhaspadamupa syati | vajri va ashvah prajapatyah | vajrenaiva
    papmana mavakramati || dakshina mapaplavayati || aishika uduho bhavati | ayurva ishikah ndadhati ||
    vetasashakhopasambaddha bhavati | aphsu yonirva ashvah | aphsujo vetasah | svadevainam yo~nernirmimite
    || purasta mabhyuduhati | purasta nca vritrahanniti brahma yajamanasya hasta ngrihnati | brahmakshatre
    eva sandadhati | abhi kratve ndra bhuradha jmannitya mmahartvijam catvara ritvija ssamukshanti | abhya
    evaina ncatasribhyo digbhyo 'bhisamirayanti || shatena rajaputrai ssahaddhvaryuh | purasta nprokshati
    | anenashvena meddhyeneshtva | ayagm raja vritram va~ddhyaditi | rajyam va~ addhvaryuh | kshatragm
    rajaputrah | rajyenai || dakshinata udantishtha nprokshati | anenashvena meddhyeneshtva | ayagm raja
    vai~ brahma | balamarajograh | balanai ndadhati || shatena sutagramanibhih saha hota nprokshati |
    anenashvena meddhyeneshtva | ayagm raja || bahugvai bahvashvayai bahvajavikayai | bahuvrihiyavayai
    bahumashatilayai | bahuhiranyayai bahuhastikayai | bahudasapurushayai rayimatyai pushtimatyai | bahurayasposhayai
    raja 'stviti | bhuma vai hota | bhuma sutagramanyah | bhumnaivasmi ndadhati || shatena kshatta sangrahitribhih
    sahodgata | uttarato dakshina tishtha || anenashvena meddhye neshtva | ayagm raja sarvamayuretviti
    | ayurva udgata | ayuh kshatta sangrahitarah | ayushai rdadhati || shatagm shata mbhavanti | shatayuh
    purusha shshatendriyah | ayushyevendriye pratitishthati || catu shshata bhavanti | catasro dishah
    | dikshveva pratitishthati || mbindunamabhimantranam yatha vai havisho grihitasya skandati | evam
    va~ etadashvasya skandati | yanniktamana muthsrijanti | yathstokya anvaha | sarvahuta skandaya | askannagm
    hi tat | yaddhutasya skandati || sahasra manvaha | sahasra sammita ssuvargo lokah | suvargasya lokasya
    || yatparimita anubruyat | parimitamavarundhita | aparimita anvaha | aparimita ssuvargo lokah | suvargasya
    lokasya samashtyai || stokya juhoti | ya eva var shya apah | ta avarundhe || asya || asyamevainah
    pratishthapayati || uvaca ha prajapatih | stokyasu va ahamashvamedhagm sagg sthapayami | tena tata
    sthitena caramiti || agnaye svahetyaha | agnaya evaina njuhoti || somaya svahetyaha | somayaivaina
    njuhoti | savitre svahetyaha | savitra evaina || sarasvatyai svahetyaha | sarasvatya evaina njuhoti
    | pushne svahetyaha | pushna evaina njuhoti | brihaspataye svahetyaha | brihaspataya evaina mmodaya
    svahetyaha | adbhya evaina njuhoti | vayave svahetyaha | vayava evaina || mitraya svahetyaha | mitrayaivaina
    njuhoti | varunaya svahetyaha | varunayaivaina njuhoti || etabhya evaina bhyo juhoti || dasha dasha
    sapanda kshara virat | annam vannadyamavarundhe || pra va esho ccyavate | yah paracirahuti rjuhoti
    | punah punarabhyavarta njuhoti | asminneva loke pratitishthati || etagm ha vava so skandaya | askannagm
    hi tat | yadyajnasya sagg sthitasya skandati || athadhvaryuprokshanam prajapataye tva jushta mprokshamiti
    purasta nprokshati | prajapatirvai devana mannado viryavan | annadya mevasmin virya ndadhati | tasmadashvah
    pashuna mannado viryavattamah || indragnibhya ntveti dakshinatah | indragni vai devanamojishthau balishthau
    | oja evasmi ndadhati | tasmadashvah pashunamojishtho balishthah || vayave tveti pashcat | vayurvai
    devanamashu || javamevasmindadhati | tasmadashvah pashunamashu ssarasaritamah || vishve bhyastva devebhya
    ityuttaratah | vishve vai deva devanam ya~shasvitamah | yasha evasmindadhati | tasmadashvah pashunam
    ya~shasvitamah || devebhya t | deva vai devana mapacitatamah | apaciti ndadhati | tasmadashvah pashuna
    bhyastva devebhya ityuparishtat | sarve vai devastvishimanto harasvinah | tvishime haro dadhati |
    tasmadashvah pashuna ntvishiman harasvitamah || dive tva 'ntarikshaya tva prithivyai tvetyaha | ebhya
    evainam lo~kebhyah prokshati || sate tva shadhibhyastva vishve bhyastva bhutebhya ityaha | tasmadashvamedhayajinagm
    sarvani bhutanyupa jivanti || brahmavadino vadanti | yatprajapatyo 'shvah | atha kasmadena manyabhyo
    devatabhyo 'pi prokshatiti | ashve vai sarva devata anvayattah | tam bhyastva bhutebhya iti prakshati
    | devata evasmi nnanvayatayati | tasmadashve sarva devata anvayattah || ashvacaritanamashvarupana
    nca homah yatha vai havisho grihitasya skandati | evam va~ etadashvasya skandati | yatprokshita muthsrijanti
    | yadashva caritani juhoti | sarvahuta skandaya | askannagm hi tat | yaddhutasya skandati || inkaraya
    svahe nkritaya svahetyaha | etani va ashvacaritani | caritairevainagm samardhayati || || tadahuh |
    anahutayo va ashvacaritani | naita hotavya iti | atho khalvahuh | hotavya eva | atra vavaivam vi~dvanashvamedhagm
    sagg caritani juhoti | tasma ddhotavya iti || bahirdha va enametadayatana ddadhati | bhratrivyamasmai
    janayati || rjuhoti | savitriya ishtyah thsvishta kritah | ahavaniye 'shvacaritani juhoti | ayatana
    evasyahuti rjuhoti | nasmai bhratrivya njanayati || tadahuh | yajnamukhe yajnamukhe hotavyah | yajnasya
    klriptyai | suvargasya lokasya nukhyatya iti || atho khalvahuh || || yadyajnamukhe yajnamukhe juhuyat
    | pashubhi vya~drdhayet | ava suvargalloka nthsyaditi | sakrideva hotavyah rvyadrdhayati | abhi suvargam
    nbhavati || ashtacatvarigmshatamashva rupani juhoti | ashtacatvarigmshadakshara jagati | jagato ssamriddhyai
    || ekamatirikta njuhoti | tasmadekah prajasvadrdhukah || ashvasya namnamabhivacanam uthsargashca vibhurmatra
    prabhuh pitretyaha | iyam vai~ mata | asau pita | abhyamevaina mparidadati || ashvo 'sityaha | shastyevainametat
    | tasma cchishtah praja jayante || atyo 'sityaha | tasmadashva shshraishthyamapnoti | ya evam 'si
    saptirasi vajyasityaha | rupamevasyaitanmahimanam vya~cashte || yayurnama 'sityaha | etadva ashvasya
    priya nnamadheyenabhivadati | tasmadapyamitrau sagantya | namna ceddhvayete | mitrameva bhavatah ||
    'nvihityaha | adityanevaina ngamayati || agnaye svaha svahe ndragnibhyamiti purvahoma njuhoti | puva
    eva dvishanta matikramati || bhurasi bhuve tva bhavyaya tva bhavishyate tvetyuthsrijati sarvatvaya
    || deva ashapala eta mmedhaya prokshita ngopayatetyaha | shatam vai~ talpya rajaputra deva ashapalah
    | tebhya evaina mparidadati || ishvaro va ashvah pramuktah para ssvaheha ramatih svaheti catrishu
    pathsu juhoti || || eta va ashvasya bandhanam | tabhirevaina mbaddhnati | tasmadashvah pramukto bandhana
    magacchati | tasmadashvah pramukto bandhana nna jahati || rashtram va~ ashvamedhah | rashtre khalu
    va ete vyayacchante | ye mmeddhyagm rakshanti | tesham ngacchanti | rashtradeva te rashtra ngacchanti
    | atha ya udrica || rashtradeva te vyavacchidyante | para va esha sicyate | yo 'shvamedhena yajate
    | yadamitra ashvam vi~nderann | hanyeta sya yajnah | catushshata rakshanti | yajnasyaghataya || athanya
    maniya proksheyuh | saiva tatah prayashcittih || ntatra vaishvadevahomah prajapati rakamayatashvamedhena
    yajeyeti | sa tapo 'tapyata | tasya tepanasya | saptatmano devata udakramann | sa diksha 'bhavat |
    sa etani vaishvadevanyapashyat | tanya juhot | tairvai sa dikshamavarundha | yadvai shva devani juhoti
    | dikshameva || sapta juhoti | sapta hi ta devata udakramann || anvaha njuhoti | anvahameva dikshamavarundhe
    || trini vaishvadevani juhoti | catvaryau dgrahanani | sapta sampadyante | sapta vai shira pranah
    | prana diksha | pranaireva pranandikshamavarundhe || vai~shvadevani juhoti | ekavigmshatirvai devalokah
    | dvadasha masah pancartavah | traya ime lokah | asavaditya ekavigmshah || esha suvargo lokah | taddaivya
    nkshattram | sa shrih | tadbraddhnasya vishtapa || trigmshatamaudgrahanani juhoti | trigmshadakshara
    virat | annam vi~rat | virajaivannadyamavarundhe || tredha vibhajya devata njuhoti | tryavrito vai
    devah | tryavrita ime lokah | esham tpranah kramanti || mpracaranti | sapta vai shir pranah | prana
    diksha | pranaireva pranandikshamavarundhe || purnahuti rnahutih | sarvamevapnoti | atho iyam rnahutih
    | asyameva pratitishthati || vaishvadevahomamantravyakhyanam prajapati masrijata | tagm srishta nna
    kincanodayacchat | tam vodayacchann | yadvai shvadevani juhoti | yajnasyodyatyai || svaha ''dhimadhitaya
    svaha | svaha manah prajapataye svaha | kaya svaha kasmai svaha katamasmai svaheti prajapatye mukhye
    bhavatah | prajapati ndevatabhirudyacchate || 'dityai sumridikayai svahetyaha | iyam va~ aditih |
    asya evaina mpratishthayodyacchate || sarasvatyai svaha sarasvatyai brihatyai svaha sarasvatyai pavakayai
    svahetyaha | vagvai sarasvati | vacaivainamudyacchate || pushne svaha pushne prapathyaya svaha pushne
    narandhishaya svahetyaha | pashavo vai pusha | pashubhirevaina mudyacchate || tvashtre svaha tvashtra
    turipaya svaha tvashtre pururupaya svahetyaha | tvashta vai pashuna mmithunanagm rupakrit | rupameva
    pashushu dadhati | atho rupairevaina mudyacchate || vishnave svaha vishnave nikhuryapaya svaha vishnave
    nibhuyapaya svahetyaha | yajno vai vishnuh | yajnayaivaina mudyacchate || purnahuti njuhoti | pratyuttabdhyai
    sayatvaya || pururupaya svahetyahashtau ca ashvasancaranavathsare pratidina ndevayajanadeshe kartavyamishtitrayamabhidhiyate
    savitra mpratarnirvapati | ashtakshara gayatri | gayatra mpratassavanam | pratassavana devaina 'dhi
    nirmimite | atho pratassavanameva tena nchandah || savitre prasavitra ekadasha mmaddhyandine | ekadashakshara
    trishtup | traishtubha mmaddhyandinagm savanam | maddhyandina devainagm savanattrishtubhah || atho
    maddhyandinameva savana pnoti | trishtubha nchandah || savitra asavitre dvadasha maparahne | dvadashakshara
    jagati | jagata ntritiya savanam | tritiya savanadevaina 'dhi nirmimite | atho tritiya savanameva
    tena nchandah || ishvaro va ashvah pramuktah para ssvaheti catasra ahuti || catasro dishah | digbhirevaina
    mparigrihnati || ashvattho vrajo bhavati | prajapati rdevebhyo nilayata | ashvo rupa matishthat |
    tadashvatthasya shvatthatvam | yadashvattho vrajo bhavati | sva evainam yo~nau pratishthapayati ||
    trishtubha shchandaso va~thsaradrdhvamukhyasyagrerupasthanam a brahma nbrahmano brahmavarcasi jayata
    mityaha | brahmana eva brahmavarcasa hmano brahmavarcasya jayata || a nrashtre rajanya ishavyah shuro
    maharatho jayata mityaha | rajanya eva shaurya tpura rajanya ishavyah shuro maharatho 'jayata || dogdhri
    dhenurityaha | dhenvameva payo dadhati | tasma tpura dogdhri dhenurajayata | vodha || anaduhyeva virya
    'nadvanajayata | ashu ssaptirityaha | ashva eva java 'jayata | puradhimryoshetyaha | yoshityeva rupa
    ndadhati | tasmathstri yuvatih priya bhavuka || jishnu ratheshtha ityaha | a ha vai tatra jishnu ratheshtha
    jayate || || yatraitena yajnena yajante || sabheyo yuvetyaha | yo vai pu rvavayasi | sa sabheyo yuva
    | tasmadyuva puma npriyo bhavukah || a 'sya yajamanasya viro jayata mityaha | a ha vai tatra yajamanasya
    viro jayate | yatraitena yajnena yajante || nikamenikame nah parjanyo var shatvityaha | nikamenikame
    ha vai tatra parjanyo var shati | yatraitena yajnena yajante || phalinyo na oshadhayah pacyanta mityaha
    | phalinyo ha vai tatraushadhayah pacyante | yatraitena yajnena yajante | yogakshemo nah kalpata mityaha
    | kalpate ha vai tatra prajabhyo yogakshemah | yatraitena yajnena yajante || triratrarupasyashvamedhasya
    prathamadinaratrau prajapati rdevebhyo yajnan vyadishat | sa atma nnashvamedhamadhatta | ta ndeva
    abruvann | esha vava yajnah | yadashvamedhah | apyeva no 'trastviti | tebhya etanannahoma nprayacchat
    | tanajuhot | tairvai sa devana prinat | yadanna || devaneva tairyajamanah prinati || ajyena juhoti
    | agnerva etadrupam | yadajya m | yadajyena juhoti | agnimeva tatprinati || madhuna juhoti | mahatyai
    va etaddevatayai rupam | yanmadhu | yanmadhuna juhoti || || mahatimeva taddevata mprinati | tandulai
    rjuhoti | vasunam va~ etadrupam | yattandulah | yattandulai rjuhoti | vasuneva tatprinati | prithukai
    va~ etadrupam | yatprithukah | yatprithukai || rudraneva tatprinati | lajairjuhoti | adityanam va~
    etadrupam | yallajah | yallajai rjuhoti | adityaneva tatprinati | karambai rjuhoti | vishvesham va~
    etaddevanagm rupam | yatkarambah || vishvaneva taddeva nprinati | dhanabhi rjuhoti | nakshatranam
    va~ etadrupam | yaddhanah | yaddhanabhi rjuhoti | nakshatranyeva tatprinati | saktubhi rjuhoti | prajapaterva
    etadrupam | yathsaktavah | yathsaktubhi || prajapatimeva tatprinati | masusyai rjuhoti | sarvasam
    va~ etaddevatanagm rupam | yanmasusyani | yanmasusyai rjuhoti | sarva eva taddevatah prinati | priyangutandulai
    rjuhoti | priyanga ha vai namaite | etairvai deva ashvasyangani samadadhuh | yatpriyangutandulai rjuhoti
    | ashvasyaivangani sandadhati || dashannani juhoti | dasha kshara virat | virat priyangutandulairjuhoti
    catvari ca annahomanajyenagnermadhuna tandulaih prithukairlajaih karambai ssaktubhirmasusyaih rdashannani
    dvadasha tatprakaravishesha prajapati rashvamedhamasrijata | tagm srishtagm rakshagsya jighagmsann
    | sa eta nprajapatirnaktagm homana pashyat | tana juhot | tairvai sa yajna drakshagsyapahann | yannaktagm
    homanjuhoti | yajnadeva tairyajamano rakshagsyapahanti || ajyena juhoti | vajro va ajya m | vajrenaiva
    yajna drakshagsyapahanti || || ajyasya pratipada nkaroti | prano va ajya m | mukhata evasya prana
    ndadhati || annahoma njuhoti | shariravadevavarundhe || vyatyasa njuhoti | ubhayasya varuddhyai ||
    nakta njuhoti | rakshasamapahatyai || ajyena m | ubhayata evasya prana ccoparishtacca || ekasmai svahetyaha
    | asminneva loke pratitishthati | dvabhyag svahetyaha | amushminneva loke pratitishthati | ubhayoreva
    lokayah pratitishthati | asmigg mushmiggshca || shataya svahetyaha | shatayurvai purusha ryah | ayureva
    viryamavarundhe | sahasraya svahetyaha | ayurvai sahasra varundhe || sarvasmai svahetyaha | aparimitameva
    varundhe || shataya svahetyaha sapta ca vivaranametayoh prajapatim 'shvamedhena yajata iti | atho
    ahuh | sarvani bhutaniti || ekasmai svahetyaha | prajapatirva ekah | tamevapnoti || ekasmai svaha
    dvabhyag svahetyabhi rjuhoti | abhipurvameva savargam lo~kameti || ekottara || ekavadeva suvargam
    njuhoti | suvargasya lokasya santatyai || shataya svahetyaha | shatayurvai purusha ryah | ayureva
    viryamavarundhe | sahasraya svahetyaha | ayurvai sahasra m | ayureva varundhe || ayutaya svaha niyutaya
    svaha prayutaya svahetyaha || || traya ime lokah | imaneva lokanavarundhe || arbudaya svahetyaha |
    vagva arbudam | vacameva varundhe || nyarbudaya svahetyaha | yo vai vaco bhuma | tannyarbudam | vaca
    eva bhumanamavarundhe || samudraya svahetyaha || || samudramevapnoti | maddhyaya svahetyaha | maddhyamevapnoti
    | antaya svahetyaha | antame vapnoti | paradrdhaya svahetyaha | paradrdhamevapnoti || ushase svaha
    vyushtyai svahetyaha | ratrirva ushah | aharvyushtih | ahoratre evavarundhe | atho ahoratrayoreva
    pratitishthati || ta yadubhayirdiva va naktam va~ juhuyat | ahoratre mohayet | ushase svaha vyushtyai
    svahodeshyate svaho dyate svahetyanudite juhoti | uditaya svaha suvargaya svaha lokaya svahetyudite
    juhoti | ahoratrayo prayutaya svahetyaha samudraya svahetyahaha saptamakandagatannahomanuvaka vyakhyayante
    vibhurmatra prabhuh pitretyashva namani juhoti | ubhayorevainam ngamayati || ayanaya svaha prayanaya
    svahetyu ddravanjuhoti | sarvamevaina maskannagm suvargam ngamayati || agnaye svaha somaya svaheti
    purvahama njuhoti | purva eva dvishanta matikramati || prithivyai svaha 'ntarikshaya svahetyaha |
    yatha yajurevaitat || agnaye svaha somaya svaheti purvadiksha juhoti | purva eva dvishanta || prithivyai
    svaha 'ntarikshaya svahetye njuhoti | ekavigmshatirvai devalokah | dvadasha masah pancartavah | traya
    ime lokah | asavaditya ekavigmshah | esha suvargo lokah | suvargasya lokasya samashtyai || bhuvo devana
    diksha juhoti | ritune vasmai kalpayati || agnaye svaha vayave svaheti juhotya rjuhoti | suvargasya
    lokasyaptyai mbhavishyaditi parya rjuhoti | suvargasya lokasya parya ptyai || a me griha bhavantvityabhu
    rjuhoti | suvargasya lokasya bhu tyai || agnina tapo rjuhoti | suvargasya lokasyanubhutyai || svaha
    ''dhimadhitaya svaheti samastani vaishvadevani juhoti | samastameva dvishanta bhyag svahetyangahoma
    njuhoti | ange ange vai purushasya papmopashlishtah | angadanga devaina mpapmanastena muncati || anjyetaya
    svaha krishnaya svaha shvetaya svahetya shvarupani juhoti | rupairevainagm samadrdhayati || oshadhibhya
    ssvahetyoshadhi homanjuhoti | dvayyo va oshadhayah | pushpe ngrihnanti | mule 'nyah | ta evobhayiravarundhe
    || homanjuhoti | aranyasyannadyasyavaruddhyai || meshastva pacatai vyani juhoti | prana vai deva apa
    vyah | prananevavarundhe || kupya ssvahetyapagm homa njuhoti | aphsu va apah | annam va~ apah | adbhyo
    va anna njayate | yadevadbhyo njayate | tadavarundhe || purvadiksha juhoti purva eva dvishanta mbhratrivyamatikrama
    saptamakandagatannahomanuvaka vyakhyayante ambhagmsi juhoti | ayam 'mbhagmsi | tasya vasavo 'dhipatayah
    | agnirjyotih | yadambhagmsi juhoti | imameva lokamavarundhe | vasunagm sayujya njyotiravarundhe ||
    nabhagmsi juhoti | antariksham || tasya rudra adhipatayah | vayurjyotih | yannabhagmsi juhoti | antarikshameva
    varundhe | rudranagm sayujya njyotiravarundhe | mahagmsi juhoti | asau vai loko mahagmsi | tasyaditya
    adhipatayah| suryo jyotih || || yanmahagmsi juhoti | amumeva lokamavarundhe | adityanagm sayujya njyotiravarundhe
    || namo rajna namo varunayeti yavyani juhoti | annadyasyavaruddhyai || mayobhurvato abhi vatusra iti
    gavyani juhoti | pashunamavaruddhyai || pranaya svaha vyanaya svaheti santati homanjuhoti | suvargasya
    lokasya santatyai || 'sitaya svaheti pramukti rjuhoti | suvargasya lokasya pramuktyai || prithivyai
    svaha 'ntarikshaya svahetyaha | yatha yajurevaitat || dattvate svaha 'dantakaya svaheti sharira homanjuhoti
    | pitrilokameva tairyajamano 'varundhe || kastva yunakti sa tva yunaktviti paridhin yunakti | ime
    vai lokah paridhayah | imanevasmai lokan yunakti | suvargasya lokasya samashtyai || tmada iti mahimanau
    juhoti | suvargo vai loko mahah | suvargameva tabhyam 'varundhe || a brahma nbrahmano brahmavacar
    si jayatamiti samastani brahmavarcasani juhoti | brahmavarcasameva tairyajamano 'varundhe || jajni
    bijamiti juhotya nantarityai || agnaye samanama tprithivyai samanamaditi sannati homanjuhoti | suvargasya
    lokasya sannatyai || bhutaya svaha bhavishyate svaheti bhutabhavyau homau juhoti | ayam || asau bhavishyat
    | anayoreva lokayoh pratitishthati | sarvasyaptyai | sarvasyavaruddhyai || yadakrandah prathama njayamana
    ityashvastomiya njuhoti | sarvasyaptyai ve~da || yajnagm rakshagsya jighagmsann | sa eta rnaktagm
    homanapashyat | tanajuhot | tairvai sa yajnadrakshagsyapahann | yannaktagm homanjuhoti | yajnadeva
    tairyajamano rakshagsyapahanti || ushase svaha vyushtyai svahetyantato juhoti | suvargasya lokasya
    samashtyai || aupasathyadine yupaprayogah ekayupo vaikadashini va | anyesham yu~pa bhavanti | ekavishinya
    shvamedhasya | suvargasya lokasya vo va khadiro va palasho va yu~pa bhavanti | rajjudala ekavigmshatya
    ratnirashvamedhasya | suvargasya lokasya samashtyai || nanyesha ntejanya avadyanti | avadyantyashvasya
    || || papma vai tejani | papmano 'pahatyai || plakshashakhayamanyesha mpashunamavadyanti | vetasa
    mashvasya | aphsuyonirva ashvah | aphsujo vetasah | sva evasya yonava vadyati || yupeshu gramya yunjanti
    | arokeshva ranyandharayanti | pashunam vya~vrittyai || a gramya ~labhante | praranyan thsrijanti
    | papmano vyavrittya trini ca yupanam sthanadayah rajjudala mminoti | bhrunahatyaya apahatyai || pautudravavabhito
    bhavatah | punyasya gandhasyavaruddhyai | bhrunahatya dapahatya | punyena gandhenobhayatah parigrihnati
    || shadbail va bhavanti | brahmavarcasasya varuddhyai || shatkhadirah | tejaso || shatpalashah | somapithasya
    varuddhyai || ekavigmshati ssampadyante | ekavigmshatirvai devalokah | dvadasha masah pancartavah
    | traya ime lokah | asavaditya ekavigmshah | esha suvargo lokah | suvargasya lokasya samashtyai ||
    shata shshatendriyah | ayushyevendriye pratitishthati || sarvam va~ ashvameddhyapnoti | aparimita
    bhavanti | aparimitasya varuddhyai || brahmavadino vadanti | kasma thsatyat | dakshinato mpashunamavadyanti
    | uttarato 'shvasyeti | varuno va ashvah || || esha vai varunasya dik | svayamevasya dishyavadyati
    | yaditaresha mpashunamavadyati | shatadevatya ntenavarundhe || cite yonirva ashvah | aphsujo vetasah
    | sva evainam yo~nau pratishthapayati || purasta ncinoti | pashcatpracina thsamyancau dadhati || ashva
    ngomrigamiti sarvahuta etanjuhoti | esham mabhijityai || atmana 'bhijuhoti | satmanamevainagm satanu
    'mushmin ~lake bhavati | ya evam ve~da | atho vasoreva dhara ntenavarundhe || iluvardaya svaha balivardaya
    svahetyaha | sam va~thsaro va iluvardah | parivathsaro balivardah | sam va~thsaradeva parivathsaradayura
    varundhe | ayurevasmin medhayaji jarasa visrasa miluvarda shcatvari ca cetavyagnayadervisheshah ekavigmsho
    'gnirbhavati | ekavigmsha sstomah | ekavigmshatiryupah || yatha va ashva varr sphurerann | evametathstoma
    sphurante | yadekavigmshah | te yathsamriccherann | hanyeta sya yajnah || dvadasha evagni ssyadityahuh
    | dvadasha 'gnirbhavati | dvadasha masa va~thsarenaivasma annamavarundhe || yaddasha yupa bhavanti
    | dasha kshara virat | annam vi~rat | virajaivannadya mavarundhe | ya ekadashah | stana evasyai sah
    || ntena || tadahuh | yaddvadasho sstoma ekadasha yupah | yatha sthurina yayat | tadriktat || ekavigmsha
    evagnih syadityahuh | ekavigmsha sstomah | ekavigmshatiryupah | yatha prashtibhiryati | tadrigeva
    tat || || yo va ashvamedhe tisrah kakubho veda | kakuddha rajna mbhavati | ekavigmsho 'gnirbhavati
    | ekavigmsha sstomah | ekavigmshatiryupah | eta va ashvamadhe tisrah kakubhah | ya evam ve~da | kakuddha
    rajna mbhavati || yo va ashvamedhe trini shirshani veda | shiro ha rajna mbhavati | ekavigmsho 'gnirbhavati
    | ekavigmsha sstomah | ekavigmshatiryupah | etani va ashvamedhe trini shira ve~da | shiro ha rajna
    ukthyakhye dvitiye 'hani bahishpavamane ashvasyodratritvam deva va ashvamedhe pavamane | suvargam
    nna prajanann | tamashvah prajanat | yadashvamadhe 'shvena meddhyenodanco bahishpavamanagm sarpanti
    | suvargasya lokasya prajna tyai | na vai manushyah suvargam lo~kamanjasa veda | ashvo vai suvargam
    lo~kamanjasa veda || yadudga 'nyena patha pratipadaye mudgithaya vrinite | yatha 'njasa nayati | evamevainamashvah
    suvargam lo~kamanjasa nayati || pucchamanvarabhante | suvargasya lokasya samashtyai || hi nkaroti
    | samaivakah | hi nkaroti | udgitha evasya sah || || vadaba upa rundhanti | mithunatvaya praja tyai
    | atho yathopagatara upagayanti | tadrigeva tat || udagasidashvo meddhya ityaha | prajapatyo va ashvah
    | prajapati rudgithah | udgithamevavarundhe | atho rikhsamayoreva pratitishthati || hiranyenopakaroti
    | jyotirvai hiranyam | jyotireva mukhato dadhati | yajamane ca prajasu ca | atho hiranyajyotireva
    yajamana upakaroti catvari ca ashve paryagnyaprayantana nniyojanam purusho vai yajnah | yajnah prajapatih
    | yadashve pashunniyunjanti | yajnadeva tadyajna mprayunkte || ashva ngomrigam | tanagnishtha alabhate
    | senamukhameva tathsagg mbhavukam || agneya | purvagnimeva ta thsthapayanti || paushnamanvanca maharanti
    || aindrapaushna muparishtat | aindro vai rajanyo mpusha | annadyenaivaina mubhayatah parigrihnati
    | tasma nnado bhavukah || agneyau krishnagrivau bahuvoh | bahuvoreva virya drajanyo bahubali bhavukah
    || tvashtrau lomashasakthau sakthyoh | sakthyoreva virya drajanya urubali bhavukah || shitiprishthau
    bar haspatyau prishthe | brahmavarcasa mevoparishtaddhatte | atho kavace evaite abhitah paryuhate
    | tasma drajanyah sannaddho virya nkaroti || dhatre prishodara t | pratishthamevaita nkurute | atho
    iyam vai~ dhata | asyameva pratitishthati || saurya nkurute | tasmaduthsedha mbhaye praja abhisagg
    prajapatirakamayatashvamedhena prajapatirna kinca na prajapati rakshagmsi purusha strayovigmshatih
    pranapanavevasmin || harih om || || krishna yajurvediya taittiriya brahmane tritiyashtake ashtamah
    prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे तृतीयाष्टके अष्टमः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ साङ्ग्रहण्येष्ट्यादयः याजमानसंस्काराः सा॒ग्रं॒ह॒ण्येष्ट्या॑ यजते । इ॒मा ञ्ज॒नता॒ग्ं॒ सङ्ग॑ह्णा॒नीति॑
    ॥ द्वाद॑शारत्नी रश॒ना भ॑वति । द्वाद॑श॒ मासा वँ॒थ्स॒रमे॒वा व॑रुन्धे । मौ॒ञ्जी भ॑वति । ऊर्ग्वै मुञ्जाः
    । ऊर्ज॑मे॒ वा व॑रुन्धे ॥ चि॒त्रा नक्ष॑त्र स्समृ॑द्ध्यै ॥ पुण्य॑नाम देव॒यज॑न म॒द्ध्यव॑स्यति । पुण्या॑मे॒व
    तेन॑ की॒र्तिम॒भिज॑यति ॥ अप॑दाती नृ॒त्विजः॑ स॒माव॑ह॒न्त्या सु॑ब्रह्म॒ण्यायाः । सु॒व॒र्गस्य॑ लो॒कस्य॒
    सम॑ष्ट्यै ॥ के॒श॒श्म॒श्रु व॑पते । न॒खानि॒ निकृ॑न्तते । द॒तो धा॑वते । स्नाति॑ । अह॑तं॒ वाँसः॒ परि॑धत्ते
