id: kyts-7-4-bruhaspati-rakaamayata-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 7.4 Bruhaspati Rakaamayata - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitayam saptamakande caturthah prashnah shri gurubhyo namah
    | harih om || brihaspatirakamayata shranme deva dadhira mpurodhamiti sa eta ncaturvigmshatiratra ttenayajata
    tato vai tasmai shraddeva adadhatagaccha shcaturvigmshatiratra bhyo manushya dadhate gacchanti purodha
    njyotirgaurayuriti tryaha bhavantiyam va~va jyotirantariksha rimaneva lokanabhyarohantyabhi purva
    ntryaha bhavantyabhipurvameva suvargam lo~kamabhyarohantyasatram ya~cchandoma bhavanti tena satra
    ndevata eva prishthairava rundhate pashunchandomairojo vai virya mprishthani pashavah chandoma ojasyeva
    virye pashushu prati tishthanti briha va~va rathantaramasau brihadabhyameva yantyatho anayoreva prati
    tishthantyete vai yajnasya njasayani sruti tabhyameva suvargam ya~nti caturvigmshatiratro bhavati
    caturvigmshatirardhamasa va~thsara eva suvarge loke prati tishthantyatho caturvigmshatyakshara gayatri
    gayatri brahmavarcasa ngayatriyaiva brahmavarcasamava rundhate 'tiratravabhito bhavato brahmavarcasasya
    parigrihityai || yatha vai manushya eva mapahatya daivigm sagmsada ncaturvigmshatiratra ntenayajanta
    tato vai te mapahatya daivigm sagmsadamagacchan shcaturvigmshatiratra 'vartimeva papmana ratiratro
    bhavati suvargasya lokasyanukhyatyai prishthyah shadaho bhavati sha mmasa ardhamasa ritavah pravishya
    daivigm sagmsadamagacchan shcaturvigmshatiratramasate sam va~thsarameva pravishya vasyasigm sagmsada
    ngacchanti trayastrayastrigmsha avasta dbhavanti trayastrayastrigmshah parasta ttrayastrigmshairevobhayato
    'varti mpapmanamapahatya daivigm sagmsada gacchanti prishthani hi gacchanti prishthani hi daivi sagmsajjami
    va eta ttrayastrayastrigmsha anvanco maddhye 'nirukto bhavati tenaja myurdhvani prishthani bhavantyurdhva
    shchandoma ubhabhyagm rupabhyagm suvargam ya~cchandoma bhavanti tena satra ndevata eva prishthairava
    rundhate pashunchandomairojo vai virya shchandoma ojasyeva virye pashushu prati tishthanti trayastrayastrigmsha
    avasta dbhavanti trayastrayastrigmshah parastanmaddhye prishthanyuro vai trayastrigmsha atma prishthanyatmana
    eva ta va~va rathantaramasau brihadabhyameva yantyatho anayoreva prati tishthantyete vai yajnasya
    njasayani sruti tabhyameva nco va ete suvargam lo~kamabhyarohanti ye paracinani prishthanyupayanti
    pratyam shadaho bhavati pratyavarudhya atho pratishthitya ubhayo ttishthanti trivrito 'dhi trivritamupa
    yanti stomanagm sampattyai prabhavaya jyotiragnishtomo bhavatyayam 'smadeva tena kshayanna yanti caturvigmshatiratro
    bhavati caturvigmshatirardhamasa va~thsara eva suvarge loke prati tishthantyatho caturvigmshatyakshara
    gayatri gayatri brahmavarcasa ngayatriyaiva brahmavarcasamava rundhate 'tiratravabhito bhavato brahmavarcasasya
    parigrihityai || riksha va iyamalomaka rvanaspatibhih pra jayeyeti saitastrigmshatagm ratrirapashya
    ttato va iyamoshadhibhi rvanaspatibhih prajayata ye prajakamah pashukama ssyusta eta asira npraiva
    jayante prajaya pashubhiriyam 'nnadyamava 'rundhaushadhi ntenavardhata sa jemana vi~dvagmsa eta asate
    virajameva 'nnadyamava rundhate vardhante prajaya pashubhirjemana ngacchanti jyotiratiratro bhavati
    suvargasya lokasyanukhyatyai prishthyah shadaho bhavati sha shshat prishthani prishthairevartunanva
    rohantyritubhih sam prati tishthanti trayastrigmsha ttrayastrigmshamupa yanti yajnasya santatya atho
    prajapatirvai trayastrigmshah prajapatimeva ''rabhante pratishthityai trinavo bhavati vijitya ekavigmsho
    bhavati pratishthitya atho rucameva ndadhate trivridagnishtu dbhavati papmanameva tena nirdahante
    'tho tejo vai trivri ndadhate pancadasha indrastomo bhavatindriya rundhate saptadasho bhavatyannadyasya
    rundhate saptadasho bhavatyannadyasya varuddhya atho praiva tena jayanta ekavigmsho bhavati pratishthitya
    atho rucameva ndadhate caturvigmsho bhavati aturvigmshatirardhamasa va~thsara eva suvarge loke prati
    tishthantyatho esha vai vishuvan vishuvanto bhavanti ya evam vi~dvagmsa eta asate caturvigmsha tprishthanyupa
    yanti sam va~thsara eva pratishthaya devata abhyarohanti trayastrigmsha ttrayastrigmshamupa yanti
    trayastrigmshadvai devata devata sveva prati tishthanti trinavo bhavatime vai lokastrinava eshveva
    lokeshu prati tishthanti dvavekavigmshau bhavatah pratishthitya atho rucameva ndadhate bahavah shodashino
    bhavanti tasma dbahavah prajasu vrishano yadete stoma vyatishakta bhavanti tasmadiya vyatishajyante
    prajaya pashubhirya evam vi~dvagmsa eta asate 'klipta va ete suvargam ya~ntyuccavacan hi stomanupayanti
    yadeta urdhvah klipta sstoma bhavanti klipta eva suvargam ya~ntyubhayorebhyo lokayoh kalpate trigmshadetastrigmshadakshara
    viradannam dvirajaivannadyamava rundhate 'tiratravabhito bhavato 'nnadyasya parigrihityai || ndeva
    yenayena chandasa 'nu prayunjata tena na nta eta dvatrigmshatagm ratrirapashya ndvatrigmshadakshara
    'nushtuga nushtubhah prajapati ssvenaiva chandasa prajapati maptva 'bhyaruhya suvargam vi~dvagmsa
    eta asate dvatrigmshadeta dvatrigmshadakshara 'nushtuga nushtubhah prajapati ssvenaiva chandasa prajapatimaptva
    shriya hi manushyasya suvargo loko dvatrigmshadeta dvatrigmshadakshara phsarvameva vacamapnuvanti
    sarve vaco vaditaro bhavanti sarve hi shriya ngacchanti jyotirgaurayuriti tryaha bhavantiyam va~va
    jyotirantariksha ngaurasavayurimaneva lokanabhyarohantyabhipurva ntryaha bhavantyabhipurvameva suvargam
    lo~kamabhyarohanti briha va~va rathantaramasau brihadabhyameva yantyatho anayoreva prati tishthantyete
    vai yajnasya njasayani sruti tabhyameva suvargam nco va ete suvargam lo~kamabhyarohanti ye paracastryahanupayanti
    pratya ntryaho bhavati pratyavarudhya atho pratishthitya ubhayo ttishthanti dvatrigmshadetastasam
    ttrigmshadakshara viradannam 'nnadyamava rundhate ye dve ahoratre eva te ubhabhyagm rupabhyagm suvargam
    ya~ntyatiratravabhito bhavatah parigrihityai || dve vava devasatre dvadashahashcaiva trayastrigmshadahashca
    ya evam vi~dvagmsastrayastrigmshadahamasate sakshadeva devata abhyarohanti yatha khalu vai shreyanabhyarudhah
    kamayate tatha karoti yadyavaviddhyati papiya nbhavati yadi navaviddhyati sadrim vi~dvagmsastrayastrigm
    shadahamasate vi papmana bhratrivyena '' vartante 'harbhajo va eta deva agra a harekastabhirvaite
    prabahugardhnuvan vi~dvagmsastrayastrigmshadahamasate sarva eva prabahugriddhnuvanti sarve gramaniya
    mprapnuvanti pancaha bhavanti panca va ritavah sam va~thsara ritushveva sam va~thsare prati tishthantyatho
    panca kshara panktih pankto yajno yajnamevava rundhate trinya shvinani bhavanti traya ime loka e shveva
    lokeshu prati tishthantyatho trini vai yajnasye ndriyani tanyevava rundhate vishvaji dbhavatyannadyasya
    varuddhyai sarvaprishtho bhavati sarvasyabhijityai vagvai dvadashaho ya ddvadashahamupa yantyaptameva
    vacamupa yanti tasma dvaca vadamo 'vantaram ~vai dasharatrena prajapatih praja asrijata ya ddasharatro
    bhavati praja eva ta ssrijanta etagm ha va udanka ssatrasyardhimuvaca ya ddasharatro bhavati satrasyardhya
    atho yadeva purveshvahassu viloma kriyate tasyaivaisha shantidrvyanika va eta ratrayo yajamana vishvaji
    thsahatiratrena purva shshodasha saha tiratrenottara vi~dvagmsastrayastrigmshadahamasata aisha ndvyanika
    praja jayate 'tiratravabhito bhavatah parigrihityai || aditya akamayanta suvargam lo~kamiyameti te
    suvargam nna prajananna suvargam nta etagm shattrigmshadratra ntenayajanta tato vai te suvargam vi~dvagmsah
    shattrigmsha dratramasate suvargameva loka mpra jananti suvargam bhavati jyotireva purasta ddadhate
    suvargasya lokasyanukhyatyai shadaha bhavanti sha dva ritava ritushveva prati tishthanti catvaro bhavanti
    catasro disho dikshveva prati tishthantyasatram ya~cchandoma bhavanti tena satra ndevata eva prishthairava
    rundhate pashunchandomairojo vai virya mprishthani pashavah chandoma ojasyeva virye pashushu prati
    tishthanti shat dratro bhavati shattrigmshadakshara brihati bar hatah pashavo brihatyaiva pashunava
    rundhate brihati chandasag svara vi~dvagmsah shattrigmsha dratramasate suvargameva lokam ya~ntyatiratravabhito
    bhavata ssuvargasya lokasya parigrihityai || 'kamayata vindeya prajamabhi sadasa nbhaveyamiti sa etamekasma
    ttenayajata tato vai so 'vindata prajamabhi saudasanabhavadya evam vi~dvagmsa ekasma nnapancashamasate
    vindante prajamabhi bhratrivya nbhavanti trayastrivrito 'gnishtoma bhavanti vajrasyaiva mukhagm sagg
    shyanti dasha pancadasha bhavanti pancadasho vajro vajrameva bhratrivyebhyah pra haranti shodashima
    rbhavati vajra eva virya ndadhati dvadasha saptadasha bhavantyannadyasya varuddhya atho praiva tairjayante
    prishthyah shadaho bhavati shadva ritava shshat prishthani prishthairevartunanvarohantyritribhih sam
    va~thsara eva prati tishthanti dvadashaikavigmsha bhavanti pratishthitya atho rucameva dadhate bahavah
    shodashino ndadhate bahavah shodashino bhavanti vijityai shada shvinani bhavanti shadva ritava ritushveva
    prati tishthantyunatirikta va eta ratraya unasta dyadekasyai na pancashada rashtacatvarigmshata unacca
    khalu va atiriktacca prajapatih prajayata ye prajakamah pashukama ssyusta eta asira npraiva jayante
    prajaya pashubhirvairajo va esha yajno yadekasma vi~dvagmsa ekasma nnapancashamasate virajameva gacchantyannada
    bhavantyati ratravabhito bhavato 'nnadyasya parigrihityai || va~thsaraya dikshishyamana ekashtakaya
    ndiksherannesha vai sam va~thsarasya patni yadekashtakaitasyam va~ esha etagm ratrim va~sati sakshadeva
    sam va~thsaramarabhya dikshanta artam kshante ya ekashtakaya ndikshante 'ntanamanavritu bhavato vyastam
    kshante ya ekashtakaya 'ntanamanavritu bhavatah phalguni purnamase di purnamaso mukhata eva sam va~thsaramarabhya
    dikshante tasyaikaiva nirya ya thsampadyate citrapurnamase di va~thsarasya yaccitrapurnamaso mukhata
    eva sam va~thsaramarabhya dikshante tasya na ka cana nirya bhavati caturahe purasta mpadyate tenaikashtaka
    purvapakshe sutya mpurvapakshe sutya sa mpadyate purvapaksha ttishthanti tanuttishthata oshadhayo
    vanaspatayo ttishthanti tan kalyani kirtiranu thsurime yajamana iti tadanu sarve raddhnuvanti || cchabantkurvanti
    tesham ya~nti ye satramupayantyabhindhata eva dikshabhiratmanagg shrapayanta upasadbhi lo~mava dyanti
    dvabhya ndvabhyamasthi dvabhya mmajjanamatmadakshinam vai~ satramatmanameva dakshina ya~nti shikhamanu
    pra vapanta riddhya atho raghiyagmsa brahmavadino vadantyatiratrah paramo yajnakratuna mprathamamupa
    yantityetadva agnishtoma mprathamamupa yantyathokthyamatha shodashina dyajnakratunupetya tanalabhya
    parigrihya somamevaita tpibanta asate jyotishtoma mprathamamupa yanti jyotishtomo vai stomana stuta
    virajamabhi sa mpadyante dve carcavati ricyete ekaya gauratirikta ekaya ssuvargo vai loko jyotirurg
    thsuvargameva tena lokam ndiva bhavati rathantara rbrahmavadinah kena tadajamiti saubhara ntritiyasavane
    brahmasama ttanmaddhyato dadhati vidhrityai tenajami || mprathamamupa yantyasminneva tena loke prati
    tishthanti goshtoma ndvitiyamupa yantyantariksha eva tena prati tishthantyayushtoma ntritiyamupa yantyamushminneva
    tena loke prati tishthantiyam va~va jyotirantariksha nupayantyeshveva tallokeshu satrinah prati tishthanto
    yanti te sagg abhi sampadyante dve mabhi sampadyante dve carcavati ricyete ekaya gauratirikta ekaya
    ssuvargo vai loko jyotirurg mevava rundhate te na kshudha ''rtimarcchantyakshodhuka bhavanti kshu
    thsabandha iva hi satrino 'gnishtomavabhitah pradhi tavukthya maddhye nabhya shadahena yanti devacakrameva
    samarohantyarishtyai te svasti samashnuvate shadahena yanti shadva ritava ritushveva prati tishthantyubhayato
    jyotisha yantyubhayata eva suvarge loke pratitishthanto yanti dvau shadahau bhavatastani dvadashahani
    sa mpadyante dvadasho vai purusho dve sakthyau dvau bahu atma ca shirashca catvaryangani stanau tpurushamanu
    paryavartante trayah shadaha bhavanti tanyashtadashahani sa mpadyante navanyani navanyani nava vai
    purushe pranasta tpranananu paryavartante catvarah shadaha bhavanti tani caturvigmshatirahani sa mpadyante
    caturvigmshatirardhamasa va~thsaramanu paryavartante 'pratishthita va~thsara iti khalu va ahurvar
    npratishthaya ityetavadvai sam va~thsarasya brahmanam ya~vanmaso masima syeva pratitishthanto yanti
    || meshastva pacatairavatu lohitagriva shshalmalirvriddhya parno brahmana plaksho medhena nyagrodhashcamasairudubamra
    urja gayatri chandobhistrivri ntva nidhipatigm havamahe vaso mama || ssvaha vaishantibhya ssvaha syandamanabhya
    ssvaha nadeyibhya ssvaha saindhavibhya ssvaha samudriya ssvaha vahantibhya ssvaha parivahantibhya
    ssvaha sarvasmai svaha njighagmsati tamabhyamiti varunah || paro martah para mbabhuva sanibhya a |
    arativa cidadrivo 'nu nau shura magmsatai bhadra indrasya ratayah || abhi kratve ndra bhuradha jmanna
    te vivyammahimanagm rajagmsi | svena hi vritragm shavasa jaghantha na shatrurantam namo rajne namo
    varunaya namo 'shvaya namah prajapataye namo 'dhipataye 'dhipatirasyadhipati mma kurvadhipatiraha
    ndhehi mayi dhehyupakritaya svaha ''labdhaya svaha hutaya svaha ekanna trigmshat mayobhurvato abhi
    vatusra urjasvatiroshadhira rishantam | pivasvatirjivadhanyah pibantvavasaya padvate rudra mrida ||
    ya ssarupa virupa ekarupa yasamagnirishtya namani veda | ya angirasastapaseha cakrustabhyah parjanya
    mahi sharma yaccha || ya deveshu tanuvamairayanta yasagm somo vishva rupani veda | ta asmabhya mpayasa
    pinvamanah prajavatirindra goshthe ririhi || prajapatirmahyameta rarano vishvai rdevaih pitribhih
    sam ssatirupa no goshthama mprajaya sagm sadema || iha dhriti ssvaha mahimu shu tpurvacittih kigg
    dbrihadvayah | kigg tpilippila || dyaurasi tpurvacittirashva asi dbrihadvayah | ratrirasi tpishangila
    'virasi ssvidekaki carati ka u svijjayate punah | kigg sviddhimasya bheshaja mmahat || surya ekaki
    carati candrama jayate punah | agnir mmahat || pricchami tva paramanta mprithivyah pricchami tva bhuvanasya
    nabhi m | pricchami tva vrishno ashvasya retah pricchami vacah paramam vyo~ma || vedimahuh paramanta
    mprithivya yajnamahu rbhuvanasya nabhi m | somamahurvrishno ashvasya reto brahmaiva vacah paramam
    surya ekaki carati abem abamlyambike na ma nayati kashcana | sasastyashvakah || subhage kampilavasini
    suvarge loke sa mprornvatham | a 'hamajani garbhadhama tvamajasi garbhadham || tau saha caturah pada
    mpra sarayavahai || vrisha vagm retodha reto dadhatu hyanjimudanjimanvaja | ya njivabhojano ya asa
    mbiladhavanah | priya sstrinamapicyah || ya asa nkrishne lakshmani sardigridi mparavadhit || abem
    abamlyambike na ma yabhati kashcana | sasastyashvakah || urdhva sya maddhyamedhatagm shite vate punanniva
    || abem abamlyambike na ma yabhati kashcana | sasastyashvakah || yaddharini yavamatti na mpashu manyate
    | shudra yadaryajara na poshaya dhanayati || abem abamlyambike na ma yabhati kashcana | sasastyashvakah
    || iyam ya~ka shakuntika ''halamiti sarpati | ahata ngabhe paso ni jalguliti dhanika || abem abamlyambike
    na ma yabhati kashcana | sasastyashvakah || mata ca te pita ca te pra sulamiti te pita gabhe mushtimatagmsayat
    || dadhikrav njishnorashvasya vajinah | surabhi no mukha kara tprana ayugmshi tarishat || apo hi shtha
    mayobhuvasta na urje dadhatana | maheranaya cakshase || yo vah shivatamo rasastasya bhajayateha nah
    | ushatiriva matarah || tasma ara ngamama vo yasya kshayaya jinvatha | apo janayatha ca nah || ssuvarvasavastva
    'njantu gayatrena chandasa rudrastva 'njantu traishtubhena chandasa 'njantu jagatena chandasa ya dvato
    apo agamadindrasya tanuva mpriyam | etagg stotaretena patha punarashvama vartayasi nah || laji | yavyayai
    gavyaya eta ddeva annamattaitadannamaddhi prajapate || yunjanti braddhna mpari tasthushah | rocante
    rocana divi || yunjantyasya kamya hari vipakshasa rathe | shona dhrishnu nrivahasa || ketu nkrinvannaketave
    pesho marya apeshase | samushadbhirajayathah || vyanaya svaha 'panaya svaha snavabhya ssvaha santanebhya
    ssvaha parisantanebhya ssvaha sharirebhya ssvaha yajnaya svaha dakshinabhya ssvaha suvargaya svaha
    lokaya svaha sarvasmai svaha sitaya svaha 'sitaya svaha 'bhihitaya svaha 'nabhihitaya svaha yuktaya
    svaha 'yuktaya svaha suyuktaya svaho dyuktaya svaha vimuktaya svaha pramuktaya svaha vancate svaha
    parivancate svaha sam va~ncate svaha 'nuvancate svaho dvancate svaha yate svaha dhavate svaha tishthate
    svaha sarvasmai svaha prajapatiryenayena aditya akamayanta suvargam || harih om || || krishna yajurvediya
    taittiriya samhitayam saptamakande caturthah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां सप्तमकाण्डे चतुर्थः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ बृह॒स्पति॑रकामयत॒ श्रन्मे॑ दे॒वा दधी॑र॒ म्पुरो॒धामिति॒ स ए॒त ञ्च॑तुर्विग्ंशतिरा॒त्र त्तेना॑यजत॒
    ततो॒ वै तस्मै॒ श्रद्दे॒वा अद॑ध॒ताग॑च्छ श्चतुर्विग्ंशतिरा॒त्र भ्यो मनु॒ष्या॑ दधते॒ गच्छ॑न्ति पुरो॒धा
    ञ्ज्योति॒र्गौरायु॒रिति॑ त्र्य॒हा भ॑वन्ती॒यं वाँव ज्योति॑र॒न्तरि॑क्ष॒ रि॒माने॒व लो॒कान॒भ्यारो॑हन्त्यभि
    पू॒र्व न्त्र्य॒हा भ॑वन्त्यभिपू॒र्वमे॒व सु॑व॒र्गं लोँ॒कम॒भ्यारो॑ह॒न्त्यस॑त्रं॒ यँच्छ॑न्दो॒मा भव॑न्ति॒
    तेन॑ स॒त्र न्दे॒वता॑ ए॒व पृ॒ष्ठैरव॑ रुन्धते प॒शूञ्छ॑न्दो॒मैरोजो॒ वै वी॒र्य॑ म्पृ॒ष्ठानि॑ प॒शवः॑ छन्दो॒मा
    ओज॑स्ये॒व वी॒र्ये॑ प॒शुषु॒ प्रति॑ तिष्ठन्ति बृह वाँव र॑थन्त॒रम॒सौ बृ॒हदा॒भ्यामे॒व य॒न्त्यथो॑ अ॒नयो॑रे॒व
    प्रति॑ तिष्ठन्त्ये॒ते वै य॒ज्ञस्या ञ्ज॒साय॑नी स्रु॒ती ताभ्या॑मे॒व सु॑व॒र्गं यँ॑न्ति चतुर्विग्ंशतिरा॒त्रो
    भ॑वति॒ चतु॑र्विग्ंशतिरर्धमा॒सा वँथ्स॒र ए॒व सु॑व॒र्गे लो॒के प्रति॑ तिष्ठ॒न्त्यथो॒ चतु॑र्विग्ंशत्यक्षरा
