id: nashtadravyapraptisukta-2
category: veda
name:
  english: nashtadravyapraptisukta
  devanagari: नष्टद्रव्यप्राप्तिसूक्त
content:
  english: nashta dravya prapti suktam sam pṷshanvi̱dusha̭ naya̱ yo anja̭sanu̱shasa̭ti | ya e̱vedamiti̱
    brava̭t || 6
  devanagari: नष्ट द्रव्य प्राप्ति सूक्तम् सं पू॑षन्वि॒दुषा॑ नय॒ यो अञ्ज॑सानु॒शास॑ति । य ए॒वेदमिति॒ ब्रव॑त्
    ॥ ६
meaning: {}
