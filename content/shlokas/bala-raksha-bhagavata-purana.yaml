id: bala-raksha-bhagavata-purana
category: stotram
name:
  english: Bala Raksha (Bhagavata Purana)
  devanagari: बालरक्षा (गोपीकृता)
content:
  english: shri ganeshaya namah | avyadajo'nghri manimamstava janvathoru yajno'cyutah katitatam jatharam
    hayasyah | hritkeshavastvadura isha inastu kantham vishnurbhujam mukhamurukrama ishvarah kam || 1||
    cakryagratah sahagado harirastu pashcat tvatparshvayordhanurasi madhuhajanashca | koneshu shankha
    urugaya uparyupendras tarkshyah kshitau haladharah purushah samantat || 2|| indriyani hrishikeshah
    pranannarayano'vatu | shvetadvipapatishcittam mano yogeshvaro'vatu || 3|| prishnigarbhastu te buddhimatmanam
    bhagavanparah | var garbhashca te kridantam patu govindah shayanam patu madhavah || 4|| var keshavah
    vrajantamavyadvaikuntha asinam tvam shriyah patih | bhunjanam yajnabhukpatu sarvagrahabhayankarah
    || 5|| dakinyo yatudhanyashca kushmanda ye'rbhakagrahah | bhutapretapishacashca yaksharakshovinayakah
    || 6|| kotara revati jyeshtha putana matrikadayah | unmada ye hyapasmara dehapranendriyadruhah ||
    7|| svapnadrishta mahotpata vriddhabalagrahashca ye | sarve nashyantu te vishnornamagrahanabhiravah
    || 8|| || iti shrimadbhagavate dashamaskandhe gopikritabalaraksha samapta || Bhagavatapurana 10|06|21-29
  devanagari: श्री गणेशाय नमः । अव्यादजोऽङ्घ्रि मणिमांस्तव जान्वथोरू यज्ञोऽच्युतः कटितटं जठरं हयास्यः
    । हृत्केशवस्त्वदुर ईश इनस्तु कण्ठं विष्णुर्भुजं मुखमुरुक्रम ईश्वरः कम् ॥ १॥ चक्र्यग्रतः सहगदो हरिरस्तु
    पश्चात् त्वत्पार्श्वयोर्धनुरसी मधुहाजनश्च । कोणेषु शङ्ख उरुगाय उपर्युपेन्द्रस् तार्क्ष्यः क्षितौ हलधरः
    पुरुषः समन्तात् ॥ २॥ इन्द्रियाणि हृषीकेशः प्राणान्नारायणोऽवतु । श्वेतद्वीपपतिश्चित्तं मनो योगेश्वरोऽवतु
    ॥ ३॥ पृश्निगर्भस्तु ते बुद्धिमात्मानं भगवान्परः । वर् गर्भश्च ते क्रीडन्तं पातु गोविन्दः शयानं पातु
    माधवः ॥ ४॥ वर् केशवः व्रजन्तमव्याद्वैकुण्ठ आसीनं त्वां श्रियः पतिः । भुञ्जानं यज्ञभुक्पातु सर्वग्रहभयङ्करः
    ॥ ५॥ डाकिन्यो यातुधान्यश्च कुष्माण्डा येऽर्भकग्रहाः । भूतप्रेतपिशाचाश्च यक्षरक्षोविनायकाः ॥ ६॥ कोटरा
    रेवती ज्येष्ठा पूतना मातृकादयः । उन्मादा ये ह्यपस्मारा देहप्राणेन्द्रियद्रुहः ॥ ७॥ स्वप्नदृष्टा महोत्पाता
    वृद्धबालग्रहाश्च ये । सर्वे नश्यन्तु ते विष्णोर्नामग्रहणभीरवः ॥ ८॥ ॥ इति श्रीमद्भागवते दशमस्कन्धे
    गोपीकृतबालरक्षा समाप्ता ॥ Bहगवतपुरन १०।०६।२१-२९
