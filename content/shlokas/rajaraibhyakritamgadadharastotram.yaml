id: rajaraibhyakritamgadadharastotram
category: stotram
name:
  english: rajaraibhyakritamgadadharastotram
  devanagari: राजारैभ्यकृतंगदाधरस्तोत्रम्
content:
  english: raja raibhyakritam gadadharastotram raibhya uvaca | gadadharam vibudhajanairabhishtutam dhritakshamam
    kshudhitajanarttinashanam | shivam vishalasurasainyamardanam namamyaham hatasakalashubham smritau
    || 29|| puranapurvam purusham purushtutam puratanam vimalamalam nrinam gatim | trivikramam dhritadharanim
    balorjitam gadadharam rahasi namami keshavam || 30|| sushuddhabhavam vibhavairupavritam shriya''vritam
    vigatamalam vicakshanam | kshitishvarairapagatakilbishaih stutam gadadharam pranamati yah sukham vaset
    || 31|| surasurairarccitapadapankajam keyuraharangadamaulidharinam | abdhau shayanam ca rathangapaninam
    gadadharam pranamati yah sukham vaset || 32|| sitam krite tretayuge'runam vibhum tatha tritiye pitavarnamacyutam
    | kalau ghanalipratimam maheshvaram gadadharam pranamati yah sukham vaset || 33|| bijodbhavo yah srijate
    caturmukhastathaiva narayanarupato jagat | prapalayedrudravapustathantakridgadadharo jayatu shadarddhamurtiman
    || 34|| sattvam rajashcaiva tamogunastrayastveteshu nanyasya samudbhavah kila | sa caika eva trividho
    gadadharo dadhatu dhairyam mama dharmamokshayoh || 35|| samsaratoyarnavaduhkhatantubhirviyoganakrakramanaih
    subhishanaih | majjantamuccaih sutaram mahaplave gadadharo mamudadhatu potavat || 36|| svayam trimurtih
    svamivatmana''tmani svashaktitashcandamidam sasarjja ha | tasminjalotthasanamaryatejasam sasarjja
    yastam pranato'smi bhudharam || 37|| matsyadinamani jagatsu kevalam suradisamrakshanato vrishakapih
    | mukhyasvarupena samantato vibhurgadadharo me vidadhatu sadgatim || 38|| iti varahapurane saptamadhyayantargatam
    raja raibhyakritam gadadharastotram samaptam | varahapurana | adhyaya 7
  devanagari: राजा रैभ्यकृतं गदाधरस्तोत्रम् रैभ्य उवाच । गदाधरं विबुधजनैरभिष्टुतं धृतक्षमं क्षुधितजनार्त्तिनाशनम्
    । शिवं विशालासुरसैन्यमर्दनं नमाम्यहं हतसकलाशुभं स्मृतौ ॥ २९॥ पुराणपूर्वं पुरुषं पुरुष्टुतं पुरातनं
    विमलमलं नृणां गतिम् । त्रिविक्रमं धृतधरणिं बलोर्जितं गदाधरं रहसि नमामि केशवम् ॥ ३०॥ सुशुद्धभावं विभवैरुपावृतं
    श्रियाऽऽवृतं विगतमलं विचक्षणम् । क्षितीश्वरैरपगतकिल्बिषैः स्तुतं गदाधरं प्रणमति यः सुखं वसेत् ॥ ३१॥
    सुरासुरैरर्च्चितपादपङ्कजं केयूरहाराङ्गदमौलिधारिणम् । अब्धौ शयानं च रथाङ्गपाणिनं गदाधरं प्रणमति यः
    सुखं वसेत् ॥ ३२॥ सितं कृते त्रेतायुगेऽरुणं विभुं तथा तृतीये पीतवर्णमच्युतम् । कलौ घनालिप्रतिमं महेश्वरं
    गदाधरं प्रणमति यः सुखं वसेत् ॥ ३३॥ बीजोद्भवो यः सृजते चतुर्मुखस्तथैव नारायणरूपतो जगत् । प्रपालयेद्रुद्रवपुस्तथान्तकृद्गदाधरो
    जयतु षडर्द्धमूर्तिमान् ॥ ३४॥ सत्त्वं रजश्चैव तमोगुणास्त्रयस्त्वेतेषु नान्यस्य समुद्भवः किल । स चैक
    एव त्रिविधो गदाधरो दधातु धैर्यं मम धर्ममोक्षयोः ॥ ३५॥ संसारतोयार्णवदुःखतन्तुभिर्वियोगनक्रक्रमणैः सुभीषणैः
    । मज्जन्तमुच्चैः सुतरां महाप्लवे गदाधरो मामुदधातु पोतवत् ॥ ३६॥ स्वयं त्रिमूर्तिः स्वमिवात्मनाऽऽत्मनि
    स्वशक्तितश्चाण्डमिदं ससर्ज्ज ह । तस्मिञ्जलोत्थासनमार्यतेजसं ससर्ज्ज यस्तं प्रणतोऽस्मि भूधरम् ॥ ३७॥
    मत्स्यादिनामानि जगत्सु केवलं सुरादिसंरक्षणतो वृषाकपिः । मुख्यस्वरूपेण समन्ततो विभुर्गदाधरो मे विदधातु
    सद्गतिम् ॥ ३८॥ इति वराहपुराणे सप्तमाध्यायान्तर्गतं राजा रैभ्यकृतं गदाधरस्तोत्रं समाप्तम् । वराहपुराण
    । अध्याय ७
