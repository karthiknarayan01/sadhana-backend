id: devadibhihkritamgangadinadistotram
category: stotram
name:
  english: devadibhihkritamgangadinadistotram
  devanagari: देवादिभिःकृतंगन्गादिनदीस्तोत्रम्
content:
  english: 70|| bahujanmakalankankam drishtva ya dehinam bhuvi | karoshi kshalanam devi sa tvam trailokyasamsthita
    || 71|| asam ca sangamo yastu sa prayago budhaih smritah | atragatya tu yushmabhih sthapitah snapito'dhuna
    || 72|| so'dya prabhriti devo'yam prayageshvarasamjnakah | trishu lokeshu vikhyatah smaranatpapanashanah
    || 73|| atragatya prapashyanti ye prayageshvaram tatah | te kritartha bhavishyanti sarvapatakavarjitah
    || 74|| kulam ca taritam tesham paitrikam matrikam tatha | gangayastriyugam punyam caturvargaphalapradam
    | jayate natra sandehah prayageshvaradarshanat || 75|| gangayam ca prayage ca devadaruvane shubhe
    | naimishe pushkare caiva shrishaile ca tripushkare || 76|| tryambake dhautapape ca mahendre bhairave
    tatha | gokarne ca suvarnakhye revakapilasangame || 77|| etesham darshanenaiva ya siddhirdvadashabdika
    | sa labhya masamatrena prayageshvaradarshanat || 78|| ye pashyanti caturddashyamashtamyam ca visheshatah
    | bhaktya ca niyamam kritva prayageshvarasamjnakam || 79|| na tesham punaravrittih kalpakotishatairapi
    | bhogadam mokshadam lingam bhavishyati mahitale || 2
  devanagari: ७०॥ बहुजन्मकलङ्काङ्कं दृष्ट्वा या देहिनां भुवि । करोषि क्षालनं देवि सा त्वं त्रैलोक्यसंस्थिता
    ॥ ७१॥ आसां च सङ्गमो यस्तु स प्रयागो बुधैः स्मृतः । अत्रागत्य तु युष्माभिः स्थापितः स्नापितोऽधुना ॥
    ७२॥ सोऽद्य प्रभृति देवोऽयं प्रयागेश्वरसंज्ञकः । त्रिषु लोकेषु विख्यातः स्मरणात्पापनाशनः ॥ ७३॥ अत्रागत्य
    प्रपश्यन्ति ये प्रयागेश्वरं ततः । ते कृतार्था भविष्यन्ति सर्वपातकवर्जिताः ॥ ७४॥ कुलं च तारितं तेषां
    पैतृकं मातृकं तथा । गङ्गायास्त्रियुगं पुण्यं चतुर्वर्गफलप्रदम् । जायते नात्र सन्देहः प्रयागेश्वरदर्शनात्
    ॥ ७५॥ गङ्गायां च प्रयागे च देवदारुवने शुभे । नैमिषे पुष्करे चैव श्रीशैले च त्रिपुष्करे ॥ ७६॥ त्र्यम्बके
    धौतपापे च महेन्द्रे भैरवे तथा । गोकर्णे च सुवर्णाख्ये रेवाकपिलसङ्गमे ॥ ७७॥ एतेषां दर्शनेनैव या सिद्धिर्द्वादशाब्दिका
    । सा लभ्या मासमात्रेण प्रयागेश्वरदर्शनात् ॥ ७८॥ ये पश्यन्ति चतुर्द्दश्यामष्टम्यां च विशेषतः । भक्त्या
    च नियमं कृत्वा प्रयागेश्वरसंज्ञकम् ॥ ७९॥ न तेषां पुनरावृत्तिः कल्पकोटिशतैरपि । भोगदं मोक्षदं लिङ्गं
    भविष्यति महीतले ॥ २
