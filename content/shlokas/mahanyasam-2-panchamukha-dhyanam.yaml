id: mahanyasam-2-panchamukha-dhyanam
category: stotram
name:
  english: Mahanyasam - 2. Panchamukha Dhyanam
content:
  english: nnam || tatpurushaya vidmahe mahadevaya dhimahi | tanno rudrah pracodaya va~rtagni tatitpradipta
    kanaka prasparthi tejomayam | gambhiradhvani samavedajanaka ntamradharam sundaram | ardhendudyuti
    lolapingala jatabharaprabaddhoragam | vande siddha surasurendranamita nnamo bhagavate rudraya || o
    nnam || purva mukhaya namah || aghore bhyo ghoraghoratarebhyah || sarve bhyo namaste astu rudrarupebhyah
    || kalabhrabhramaranjanadyutinibham vya~vritta pingekshanam karnodbhasita bhogimastaka maniprodgirna
    damshtrankuram | sarpaprota kapala shukti shakala vyakirna sacchekharam vande dakshinamishvarasya
    kutila bhrubhanga raudra nnamo bhagavate rudraya || o mmam || dakshina mukhaya namah || sadyo jata
    mprapadyami sadyo jataya vai namo namah | bhave bhave nati bhave bhavasva mam | bhavo dbhavaya namah
    || praleyacalamindukunda dhavala ngokshiraphenaprabham bhasmabhyaktamananga deha dahana jvalavali
    locanam | brahmendradi marudganaisputipadai rabhyarcitam nkalankarahitam sthanormukha nnamo bhagavate
    rudraya || om shim || pashcima mukhaya namah || vamadevaya namo jyeshthaya namah shreshthaya namo
    rudraya namah kalaya namah kalavikaranaya namo balavikaranaya namo balaya namo balapramathanaya nama
    ssarvabhutadamanaya namo manonmanaya namah || gaura nkunkuma pankilam stilakam vya~pandu gandasthalam
    bhruvikshepa kataksha lasatsamsakta karnotphalam | snigdha nkritam vande purna shashanka mandalanibham
    va~ktram harasyottaram || o nnamo bhagavate rudraya || om va~m || uttara mukhaya namah || ishana rbrahmano
    'dhipati rbrahma shivo me astu sadashivom || vyaktavyakta gunetara mparataram shattrimshatattvatmakam
    tasmaduttama tattvamaksharamida ndhyeyam sada yogibhih | onkaradi samasta mantrajanakam sukshmadi
    sukshma mpancamamishvarasya vadana vya~pti tejomayam || o nnamo bhagavate rudraya || om va~m || urdhva
    mukhaya namah || dinnamaskarah purve pashupatih patu | dakshine patu shankarah | pashcime patu vishveshah
    | nilakanthastadottare || ishanya mpatu me sharvah | agneya mparvatipatih | nairitya mpatu me rudrah
    | vayavya nnilalohitah || urdhve trilocanah patu | adharaya mmaheshvarah | etabhyo dasha digbhyastu
    | sarvatah patu shankarah || na rudro rudramarcaye 'bhishekavidhi vyakhyasyamah |
  devanagari: न्नम् ॥ तत्पुरु॒षाय वि॒द्महे॑ महादे॒वाय॑ धीमहि । तन्नो॑ रुद्रः प्रचोदया वँर्ताग्नि तटित्प्रदीप्त
    कनक प्रस्पर्थि तेजोमयम् । गम्भीरध्वनि सामवेदजनक न्ताम्राधरं सुन्दरम् । अर्धेन्दुद्युति लोलपिङ्गल जटाभारप्रबद्धोरगम्
    । वन्दे सिद्ध सुरासुरेन्द्रनमित न्नमो भगवते॑ रुद्रा॒य ॥ ओ न्नम् ॥ पूर्व मुखाय॒ नमः ॥ अ॒घोरे भ्यो॒
    घोर॒घोर॑तरेभ्यः ॥ सर्वे भ्यो॒ नम॑स्ते अस्तु रु॒द्ररू॑पेभ्यः ॥ कालाभ्रभ्रमराञ्जनद्युतिनिभं व्याँवृत्त
    पिङ्गेक्षणम् कर्णोद्भासित भोगिमस्तक मणिप्रोद्गीर्ण दंष्ट्राङ्कुरम् । सर्पप्रोत कपाल शुक्ति शकल व्याकीर्ण
    सच्छेखरम् वन्दे दक्षिणमीश्वरस्य कुटिल भ्रूभङ्ग रौद्र न्नमो भगवते॑ रुद्रा॒य ॥ ओ म्मम् ॥ दक्षिण मुखाय॒
    नमः ॥ स॒द्यो जा॒त म्प्र॑पद्या॒मि॒ स॒द्यो जा॒ताय॒ वै नमो॒ नमः॑ । भ॒वे भ॑वे॒ नाति॑ भवे भवस्व॒ माम् ।
    भ॒वो द्भ॑वाय॒ नमः॑ ॥ प्रालेयाचलमिन्दुकुन्द धवल ङ्गोक्षीरफेनप्रभम् भस्माभ्यक्तमनङ्ग देह दहन ज्वालावली
    लोचनम् । ब्रह्मेन्द्रादि मरुद्गणैस्पुतिपदै रभ्यर्चितं ङ्कलङ्करहितं स्थाणोर्मुख न्नमो भगवते॑ रुद्रा॒य
    ॥ ॐ शिम् ॥ पश्चिम मुखाय॒ नमः ॥ वा॒म॒दे॒वाय॒ नमो ज्ये॒ष्ठाय॒ नमः॑ श्रे॒ष्ठाय॒ नमो॑ रु॒द्राय॒ नमः॒ काला॑य॒
    नमः॒ कल॑विकरणाय॒ नमो॒ बल॑विकरणाय॒ नमो॒ बला॑य॒ नमो॒ बल॑प्रमथनाय॒ नम॒ स्सर्व॑भूतदमनाय॒ नमो॑ म॒नोन्म॑नाय॒
    नमः॑ ॥ गौर ङ्कुङ्कुम पङ्किलं स्तिलकं व्याँपाण्डु गण्डस्थलम् भ्रूविक्षेप कटाक्ष लसत्संसक्त कर्णोत्फलम्
    । स्निग्ध ङ्कृतम् वन्दे पूर्ण शशाङ्क मण्डलनिभं वँक्त्रं हरस्योत्तरम् ॥ ओ न्नमो भगवते॑ रुद्रा॒य ॥ ॐ
    वाँम् ॥ उत्तर मुखाय॒ नमः ॥ ईशान र्ब्रह्म॒णो ऽधि॑पति॒ र्ब्रह्मा॑ शि॒वो मे॑ अस्तु सदाशि॒वोम् ॥ व्यक्ताव्यक्त
    गुणेतर म्परतरं षट्त्रिंशतत्त्वात्मकम् तस्मादुत्तम तत्त्वमक्षरमिद न्ध्येयं सदा योगिभिः । ओङ्कारादि
    समस्त मन्त्रजनकं सूक्ष्मादि सूक्ष्म म्पञ्चममीश्वरस्य वदन व्याँप्ति तेजोमयम् ॥ ओ न्नमो भगवते॑ रुद्रा॒य
    ॥ ॐ वाँम् ॥ ऊर्ध्व मुखाय॒ नमः ॥ दिङ्नमस्कारः पूर्वे पशुपतिः पातु । दक्षिणे पातु शङ्करः । पश्चिमे पातु
    विश्वेशः । नीलकण्ठस्तदोत्तरे ॥ ईशान्या म्पातु मे शर्वः । आग्नेया म्पार्वतीपतिः । नैऋत्या म्पातु मे
    रुद्रः । वायव्या न्नीललोहितः ॥ ऊर्ध्वे त्रिलोचनः पातु । अधराया म्महेश्वरः । एताभ्यो दश दिग्भ्यस्तु
    । सर्वतः पातु शङ्करः ॥ ना रुद्रो रुद्रमर्चये ऽभिषेकविधि व्याख्यास्यामः ।
