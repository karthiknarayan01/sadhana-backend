id: brahmadyaihkritamvarahastotram-03
category: stotram
name:
  english: brahmadyaihkritamvarahastotram 03
  devanagari: ब्रह्माद्यैःकृतंवराहस्तोत्रम् ०३
content:
  english: brahmadyaih kritam varahastotram 3 aniya vasudham devimankasthamakarodbahih | tatastushtavadevesham
    devadevah pitamahah || 10|| shakradyaih sahito bhutva harshagadgadaya gira || brahmovaca | shashvataya
    varahaya damshtrine dandine namah || 11|| narayanaya sarvaya brahmane paramatmane | kartre dhartre
    dharayastu hartre devarinam svayam | kartre netre surendranam shastre ca sakalasya ca || 12|| tvamashtamurtistvamanantamurtistvamadidevastvamanantaveditah
    | tvaya kritam sarvamidam prasida suresha lokesha varaha vishno || 13|| tathaikadamshtragramukhagrakotibhagaikabhagardhatamena
    vishno | hatah kshanatkamadadaityamukhyah svadamshtrakotya saha putrabhrityaih || 14|| tvayoddhrita
    deva dhara dhareshadharadharakara dhritagradamshtre | dharadharaih sarvajanaih samudraih surasuraih
    sevitacandravaktra || 15|| tvayaiva devesha vibho kritashca jayah suranamasureshvanam | aho pradattastu
    varah prasida vagdevata varijasambhavaya || 16|| tava romni sakalamareshvara nayanadvaye shashiravi
    padadvaye | nihita rasatalagata vasundhara tava prishthatah sakalatarakadayah || 17|| jagatam hitaya
    bhavata vasundhara bhagavan rasatalasaputam gata tada | abaloddhrita ca bhagavamstvayaiva sakalam
    tvayaiva hi dhritam jagadguro || 18|| iti vakpatirbahuvidhaistavarcanaih pranipatya vishnumamaraih
    prajapatih | vividhanvaran harimukhattu labdhavan harinabhivarijadehabhritsvayam || 19|| iti shrilingamahapurane
    purvabhage caturnavatitamadhyayantargatam brahmadyaih kritam varahastotram samaptam | lingapurana
    | purvabhaga | adhyaya 94
  devanagari: ब्रह्माद्यैः कृतं वराहस्तोत्रम् ३ आनीय वसुधां देवीमङ्कस्थामकरोद्बहिः । ततस्तुष्टावदेवेशं
    देवदेवः पितामहः ॥ १०॥ शक्राद्यैः सहितो भूत्वा हर्षगद्गदया गिरा ॥ ब्रह्मोवाच । शाश्वताय वराहाय दंष्ट्रिणे
    दण्डिने नमः ॥ ११॥ नारायणाय सर्वाय ब्रह्मणे परमात्मने । कर्त्रे धर्त्रे धरायास्तु हर्त्रे देवारिणां
    स्वयम् । कर्त्रे नेत्रे सुरेन्द्राणां शास्त्रे च सकलस्य च ॥ १२॥ त्वमष्टमूर्तिस्त्वमनन्तमूर्तिस्त्वमादिदेवस्त्वमनन्तवेदितः
    । त्वया कृतं सर्वमिदं प्रसीद सुरेश लोकेश वराह विष्णो ॥ १३॥ तथैकदंष्ट्राग्रमुखाग्रकोटिभागैकभागार्धतमेन
    विष्णो । हताः क्षणात्कामददैत्यमुख्याः स्वदंष्ट्रकोट्या सह पुत्रभृत्यैः ॥ १४॥ त्वयोद्धृता देव धरा धरेशधराधराकार
    धृताग्रदंष्ट्रे । धराधरैः सर्वजनैः समुद्रैः सुरासुरैः सेवितचन्द्रवक्त्र ॥ १५॥ त्वयैव देवेश विभो कृतश्च
    जयः सुराणामसुरेश्वणाम् । अहो प्रदत्तस्तु वरः प्रसीद वाग्देवता वारिजसम्भवाय ॥ १६॥ तव रोम्णि सकलामरेश्वरा
    नयनद्वये शशिरवी पदद्वये । निहिता रसातलगता वसुन्धरा तव पृष्ठतः सकलतारकादयः ॥ १७॥ जगतां हिताय भवता वसुन्धरा
    भगवन् रसातलसपुटं गता तदा । अबलोद्धृता च भगवंस्त्वयैव सकलं त्वयैव हि धृतं जगद्गुरो ॥ १८॥ इति वाक्पतिर्बहुविधैस्तवार्चनैः
    प्रणिपत्य विष्णुममरैः प्रजापतिः । विविधान्वरान् हरिमुखात्तु लब्धवान् हरिनाभिवारिजदेहभृत्स्वयम् ॥ १९॥
    इति श्रीलिङ्गमहापुराणे पूर्वभागे चतुर्नवतितमाध्यायान्तर्गतं ब्रह्माद्यैः कृतं वराहस्तोत्रं समाप्तम्
    । लिङ्गपुराण । पूर्वभाग । अध्याय ९४
