id: vyasaproktamnarmadastotram
category: stotram
name:
  english: vyasaproktamnarmadastotram
  devanagari: व्यासप्रोक्तंनर्मदास्तोत्रम्
content:
  english: vyasaproktam narmadastotram jaya bhagavati devi namo varade jaya papavinashini bahuphalade
    | jaya shumbhanishumbhakapaladhare pranamami tu devanarartihare || 103|| jaya candradivakaranetradhare
    jaya pavakabhushitavaktravare | jaya bhairavadehanilinapare jaya andhakaraktavishoshakare || 104||
    jaya mahishavimardini shulakare jaya lokasamastakapapahare | jaya devi pitamaharamanate jaya bhaskarashakrashiro'vanate
    || 105|| jaya shanmukhasayudha ishanute jaya sagaragamini shambhunute | jaya duhkhadaridravinashakare
    jaya putrakalatravivriddhikare || 106|| jaya devi samastashariradhare jaya nakavidarshini duhkhahare
    | jaya vyadhivinashini mokshakare jaya vanchitadayini siddhavare || 107|| etadvyasakritam stotram
    yah pathecchivasannidhau | grihe va shuddhabhavena kamakrodhavivarjitah || 108|| tasya vyaso bhavetpritah
    pritashca vrishavahanah | prita syannarmada devi sarvapapakshayankari || 109|| na te yanti yamalokam
    yaih stuta bhuvi narmada | pitamaho'pi muhyeta devi tvadgunakirtanat || 110|| vakpatirnaiva te vaktum
    svarupam veda narmade | katham gunanaham devi tvadiyamjnatumutsahe || 111|| iti shriskandapurane avantyakhande
    revakhande saptanavatitama
  devanagari: व्यासप्रोक्तं नर्मदास्तोत्रम् जय भगवति देवि नमो वरदे जय पापविनाशिनी बहुफलदे । जय शुम्भनिशुम्भकपालधरे
    प्रणमामि तु देवनरार्तिहरे ॥ १०३॥ जय चन्द्रदिवाकरनेत्रधरे जय पावकभूषितवक्त्रवरे । जय भैरवदेहनिलीनपरे
    जय अन्धकरक्तविशोषकरे ॥ १०४॥ जय महिषविमर्दिनि शूलकरे जय लोकसमस्तकपापहरे । जय देवि पितामहरामनते जय भास्करशक्रशिरोऽवनते
    ॥ १०५॥ जय षण्मुखसायुध ईशनुते जय सागरगामिनि शम्भुनुते । जय दुःखदरिद्रविनाशकरे जय पुत्रकलत्रविवृद्धिकरे
    ॥ १०६॥ जय देवि समस्तशरीरधरे जय नाकविदर्शिनि दुःखहरे । जय व्याधिविनाशिनि मोक्षकरे जय वाञ्छितदायिनि
    सिद्धवरे ॥ १०७॥ एतद्व्यासकृतं स्तोत्रं यः पठेच्छिवसन्निधौ । गृहे वा शुद्धभावेन कामक्रोधविवर्जितः ॥
    १०८॥ तस्य व्यासो भवेत्प्रीतः प्रीतश्च वृषवाहनः । प्रीता स्यान्नर्मदा देवी सर्वपापक्षयङ्करी ॥ १०९॥
    न ते यान्ति यमालोकं यैः स्तुता भुवि नर्मदा । पितामहोऽपि मुह्येत देवि त्वद्गुणकीर्तनात् ॥ ११०॥ वाक्पतिर्नैव
    ते वक्तुं स्वरूपं वेद नर्मदे । कथं गुणानहं देवि त्वदीयांज्ञातुमुत्सहे ॥ १११॥ इति श्रीस्कन्दपुराणे
    आवन्त्यखण्डे रेवाखण्डे सप्तनवतितमा
