id: ashtadashashaktipithastotram-2
category: stotram
name:
  english: ashtadashashaktipithastotram
  devanagari: अष्टादशशक्तिपीठस्तोत्रम्
content:
  english: '|| ashtadashashaktipithastotram || lankayam shankari devi kamakshi kancikapure | pradyumne
    shrinkhaladevi camundi krauncapattane || alampure jogulamba shrishaile bhramarambika | kolhapure mahalakshmi
    mahurye ekavirika || ujjayinyam mahakali pithikyam puruhutika | odhyayam girijadevi manikya dakshavatake
    || harikshetre kamarupa prayage madhaveshvari | jvalayam vaishnavi devi gaya mangalyagaurika || varanasyam
    vishalakshi kashmireshu sarasvati | ashtadasha supithani yoginamapi durlabham || sayankale pathennityam
    sarvashatruvinashanam | sarvarogaharam divyam sarvasampatkaram shubham || iti ashtadashashaktipithastutih
    |'
  devanagari: ॥ अष्टादशशक्तिपीठस्तोत्रम् ॥ लङ्कायां शाङ्करी देवी कामाक्षी काञ्चिकापुरे । प्रद्युम्ने शृङ्खलादेवी
    चामुण्डी क्रौञ्चपट्टणे ॥ अलम्पुरे जोगुलाम्बा श्रीशैले भ्रमराम्बिका । कोल्हापुरे महालक्ष्मी माहूर्ये
    एकवीरिका ॥ उज्जयिन्यां महाकाली पीठिक्यां पुरुहूतिका । ओढ्यायां गिरिजादेवी माणिक्या दक्षवाटके ॥ हरिक्षेत्रे
    कामरूपा प्रयागे माधवेश्वरी । ज्वालायां वैष्णवी देवी गया माङ्गल्यगौरिका ॥ वारणस्यां विशालाक्षी काश्मीरेषु
    सरस्वती । अष्टादश सुपीठानि योगिनामपि दुर्लभम् ॥ सायङ्काले पठेन्नित्यं सर्वशत्रुविनाशनम् । सर्वरोगहरं
    दिव्यं सर्वसम्पत्करं शुभम् ॥ इति अष्टादशशक्तिपीठस्तुतिः ।
