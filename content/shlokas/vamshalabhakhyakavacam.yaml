id: vamshalabhakhyakavacam
category: kavacha
name:
  english: vamshalabhakhyakavacam
  devanagari: वंशलाभाख्यकवचम्
content:
  english: jivitatanayapraptaye viniyogah | parvati me shirah patu vaktram patu maheshvari | bhavani nayane
    patu bhruvau shankarasundari || 1|| madhye patu maheshani nitambam suravandita | uru gauri sada patu
    kaushiki januyugmakam || 2|| bahu dvau sumukhi patu paniyugmam subhavini | padau brahmamayi patu shravane
    bhuvaneshvari || 3|| nasike lalita patu kantham tripurasundari | rudrani hridayam patu stanadvandvam
    maheshvari || 4|| apadamastakam patu sarvangam sarvamangala | iti te kathitam vipra kavacam devapujitam
    || 5|| pathitva dharayitva ca akshayam tanayam labhet | dhyanamasyah pravakshyami yatha dhyatva pathennarah
    || 6|| sahasradityasankasham sarvabharanabhushitam | trinetram panivinyastapashankushavarabhayam ||
    7|| || shribhairavatantre shivanaradasamvade vamshalabhakhyakavacam sampurna ||
  devanagari: जीविततनयप्राप्तये विनियोगः । पार्वती मे शिरः पातु वक्त्रं पातु महेश्वरी । भवानी नयने पातु
    भ्रुवौ शङ्करसुन्दरी ॥ १॥ मध्ये पातु महेशानी नितम्बं सुरवन्दिता । ऊरू गौरी सदा पातु कौषिकी जानुयुग्मकम्
    ॥ २॥ बाहु द्वौ सुमुखी पातु पाणियुग्मं सुभाविनी । पादौ ब्रह्ममयी पातु श्रवणे भुवनेश्वरी ॥ ३॥ नासिके
    ललिता पातु कण्ठं त्रिपुरसुन्दरी । रुद्राणी हृदयं पातु स्तनद्वन्द्वं महेश्वरी ॥ ४॥ आपादमस्तकं पातु
    सर्वाङ्गं सर्वमङ्गला । इति ते कथितं विप्र कवचं देवपूजितम् ॥ ५॥ पठित्वा धारयित्वा च अक्षयं तनयं लभेत्
    । ध्यानमस्याः प्रवक्ष्यामि यथा ध्यात्वा पठेन्नरः ॥ ६॥ सहस्रादित्यसङ्काशां सर्वाभरणभूषिताम् । त्रिनेत्रां
    पाणिविन्यस्तपाशाङ्कुशवराभयाम् ॥ ७॥ ॥ श्रीभैरवतन्त्रे शिवनारदसंवादे वंशलाभाख्यकवचं सम्पूर्ण ॥
