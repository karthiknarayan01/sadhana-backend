    hohim janai || bharatu niti rata sadhu sujana| prabhu pada prema sakala jagu jana || teu aju rama
    padu pai| cale dharama marajada metai || kutila kubandha kuavasaru taki| jani rama banavasa ekaki
    || kari kumantru mana saji samaju| ae karai akantaka raju || koti prakara kalapi kutalai| ae dala
    batori dau bhai || jaum jiya~ hoti na kapata kucali| kehi sohati ratha baji gajali || bharatahi dosu
