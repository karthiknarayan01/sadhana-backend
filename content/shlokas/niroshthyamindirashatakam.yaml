id: niroshthyamindirashatakam
category: shataka
name:
  english: niroshthyamindirashatakam
  devanagari: निरोष्ठ्यमिन्दिराशतकम्
content:
  english: '|| 52|| krishnena yena dayitakankshitadanadarena naktilat | shakhi sannyastah kila dharatale
    sa shriya lasati range || 53|| kaliyanaganiyanta kalashanadishanakanyaka neta | kale kale janayati
    nah shrirakhilarthidainyaharidrisha || 54|| ashritarakshanadhira dhiraradhya ca sadganadhara | dharakalita
    shreyah sa rajati sagarendratanaya nah || 55|| dhiragraganyadasharathatanayeritashatasahasrasharanikaraih
    | dalita rakshasasenasankhyeya janani sa hi lanka ca || 56|| caidyadya daiteya nihatah kalena tena
    krishnena | tena jagatya janani shreyah santanalatikaya hi taya || 57|| harina tena nriharina kalena
    tatha hiranyakastena | kantenakali kalitahladah sa ca tanayadainyaharidrisha || 58|| shriyah shriyaradhitaya
    sakalashca kalastatha | rasa ca sarasasara lalana lalitakriyah || 59|| sharkarakshiradisadrigrasa
    ca sarala ca gih | tanayadyashca ye''nindyastanyante dharanitale || 60|| taya hi hitadayinya sitayadritajataya
    | dhyanarhaya sanathaste dayahridayaya janah || 61|| dharadharadharah krishnah kalinditatakelikah
    | nakinathanatanghrishca yasya neta ca giyate || 62|| ashtadinnayakaradhya nashtarajyadidayini | srishtisthityadhinetri
    sa sashtanganatirakshini || 63|| sadarhanadilasita sannadanadidayini | satsanghatranajanita sa sita
    sarasasana || 64|| shantaradhitaya kale tantayaranyacaratah | kantaya hi hareh kale santaka na narah
    kritah || 65|| adarena kalitarcanashca yastasya tasya nagari gariyasi | sagarendratanayadrisha shriyah
    sadarena kalidrishtiharini || 66|| srishtisthitilayaderyah karta natha itiritah | sa shrih sahacari
    tasya khyata sitadina sada || 67|| sa dharaniyacarita tathagatanirasina | natharhakelirjayati gadha
    shrenikrididita || 68|| jaradihanida sendhe dharadharaganedita | nirakritartirjanani karakalitasarasa
    || 69|| sirakrishtasthale jata dhiraradhyasya nayika | sararthakriddayasara narayanasahasana || 70||
    taranathadritasyaisha saradhisadganarcita | ya rakshane dhritadaya sarakshetradidayini || 71|| nijanathashastradalitaricaya
    janakadhirajatanaya janani | kalitashriya hi nijaya hi drisha janatahitaya kila rangatale || 72||
    rangatalakalitakelih sajjanarakshadarena kalyani | nijakarakisalayakalitanantashayanghrishca rajate
    janani || 73|| kalashasagarakanyakaya taya jagati sajjanarakshanadikshitah | kalitarangagrihe hariredhate
    karakritadarashankharathangakah || 74|| dishi dishi dhanadhara daityajinnityadarah kritanatijanadhiraradhita
    jatasara | kalitagaganacara kashate ratnahara nirasitajaninara satkritanandasara || 75|| dhanatarashashihara
    shreyasah sa hi dhara dinakarashashinetra rakshitanekayatra | nirasitakalikala nathakrishnarhalila
    kanati kanakacela dinarakshaikashila || 76|| anadinidhiresha nah shreyase jayashalini | kanjalaya
    krishnadara janani kaliharini || 77|| cirakalarcita dhanyairdharanitanaya hi nah | kankshitani dadatyesha
    kanjayatadrishah shriya || 78|| nalikininathajanayakena yadarthina kinnarageyakirtya | lanka hata
    sa shararashidagdha sa janaki rakshitasadgana hi || 79|| sarangakshi sarasijakara sagarendrasya kanya
    sarasaradhigatadhishanaih sannata sannatangi | sita khyata sadayahridaya sadara sadhayanti saisha
    shreyah sakalajagatisadgatirdarshayanti || 80|| kalyani sa kalashajaladheh kanyaka kleshahantri kale
    kale kritanatihita kankshitadhikyadatri | kantarantah kalitacarana kinnarigitakirtih krishnakrishta
    kanakasaritah saikate kantakelih || 81|| rasakridarasikadayita rangagehantarastha rajashrenilalitashirasam
    ratnanirajitanghrih | rajatyesha lalitanagarirajadhanyadidatri rakacandradritajaladhija rajate rajatejah
    || 82|| jananinirikshita ye te sarasijanetrarakshitah kalitah | tannah shreyah shrenijayaditataye
    sada lasati || 83|| kalitagah shatanicaye jane nate te dayasarah | kritarakshanaghati syaditi nishcityadarena
    janani janah || 84|| ya shitakiranasahaja sa nastranaya kalitadiksha hi nirasitakritantakinkaradrishtaya
    ete janah kale || 85|| kalayati jalanidhikanya gangasahyadrijaditatasanga | shreyah sakalarthihita
    yasyashcaranasthalani kalitani || 86|| jnanaghana sa janani kandalayati sarasarasashreyah | candanalataya
    kanakajalatayaradadarat kritike || 87|| dayaya shitalahridaya sarasahasta ca lasati janani nah | rakshitasatsangharannakiganarcyanghrisarasija
    kale || 88|| rakshitarasikaganaisha kisalayacarana hi jayati janani nah | kiraganakalyagiriha sakale
    shastrarthasancaye lasita || 89|| adritasatsatkara nathahitanatharakshanaikadrisha | kalayati naijadrisha
    kila nah shreyah kalinirasakritaghati || 90|| janani kalankarahitanana ghanashrih sada lasati range
    | rasaghananijasyasarasijagiresha satyasandhana || 91|| kekanade kanakakadalikandanilantarale kanjakshi
    sa kanakasaritah keligehantarastha | kantakridakalitahridaya rakshane dattakelih kalharashrikarakisalaya
    kajjalaktayatakshi || 92|| candrakalacandanarasaghanasaradyaih sadriggira janani | janayati rakshadayinyesha
    kanjakshahridyanijakalanah || 93|| jitasarangakshi sa ya rangakshidita ca rangatale | kalayati danani
    hi nah kale kale ca krishnajaladena || 94|| anjanadrishakelya yadritacitta sanatani | niranjanajanairesharadhita
    hi ciraya sa || 95|| nakeshanagarikantalalyanaijanghrisarasa | janani candrasahaja sa rangaditate
    sthira || 96|| rajati harihridaye sa kalitatrana kritagasi jane hi | yallilarasaghatyakrishtakridindhe
    sa rangeshah || 97|| atishayitanaijadana sa shriranandakandalashrirhi | janani rakshitadharani nirasitadehiti
    giriharyedya || 98|| natakakshitadanakalakalitadritageyakirtikalika sa | rajati rangeshagrihe sanatani
    sannidhih shrirhi || 99|| nirasitadharasanganijaksharagrathitaya hyanaya harinayika | jayati sa dhritaharshanasantatih
    kritadhanadirihadritasadgana || 100|| iti niroshthayapadairlalitamimam stutimudaramatih kritakautukah
    | jayati krishnakavih kamalapadambujayuge kalayan saphalakriyah || 101|| iti krishnakavipranitam niroshtayamindirashatakam
    sampurnam | stotrasamuccayah 2'
  devanagari: ॥ ५२॥ कृष्णेन येन दयिताकाङ्क्षितदानादरेण नाक्तिलात् । शाखी सान्न्यस्तः किल धरातले स श्रिया
    लसति रङ्गे ॥ ५३॥ कालियनागनियन्ता कलशनदीशानकन्यका नेता । काले काले जनयति नः श्रीरखिलार्थिदैन्यहारिदृशा
    ॥ ५४॥ आश्रितरक्षणधीरा धीराराध्या च सद्गणाधारा । धाराकलित श्रेयः सा राजति सागरेन्द्रतनया नः ॥ ५५॥ धीराग्रगण्यदशरथतनयेरितशतसहस्रशरनिकरैः
    । दलिता राक्षससेनासङ्ख्येया जननि सा हि लङ्का च ॥ ५६॥ चैद्याद्या दैतेया निहताः कालेन तेन कृष्णेन ।
    तेन जगत्या जननि श्रेयः सन्तानलतिकया हि तया ॥ ५७॥ हरिणा तेन नृहरिणा कालेन तथा हिरण्यकस्तेन । कान्तेनाकलि
    कलिताह्लादः स च तनयदैन्यहारिदृशा ॥ ५८॥ श्रियः श्रियाराधितया सकलाश्च कलास्तथा । रसा च सारसासारा ललना
    ललितक्रियाः ॥ ५९॥ शर्कराक्षीरादिसदृग्रसा च सरला च गीः । तनयाद्याश्च येऽनिन्द्यास्तन्यन्ते धरणीतले
    ॥ ६०॥ तया हि हितदायिन्या सीतयादृतजातया । ध्यानार्हया सनाथास्ते दयाहृदयया जनाः ॥ ६१॥ धराधरधरः कृष्णः
    कालिन्दीतटकेलिकः । नाकिनाथनताङ्घ्रिश्च यस्या नेता च गीयते ॥ ६२॥ अष्टदिङ्नायकाराध्या नष्टराज्यादिदायिनी
    । सृष्टिस्थित्यधिनेत्री सा साष्टाङ्गनतिरक्षिणी ॥ ६३॥ सदर्हणादिलसिता सान्नदानादिदायिनी । सत्सङ्घत्राणजनिता
    सा सीता सारसासना ॥ ६४॥ शान्ताराधितया काले तान्तयारण्यचारतः । कान्तया हि हरेः काले सान्तका न नराः कृताः
    ॥ ६५॥ आदरेण कलितार्चनश्च यस्तस्य तस्य नगरी गरीयसी । सागरेन्द्रतनयादृशा श्रियः सादरेण कलिदृष्टिहारिणी
    ॥ ६६॥ सृष्टिस्थितिलयादेर्यः कर्ता नाथ इतीरितः । सा श्रीः सहचरी तस्य ख्याता सीतादिना सदा ॥ ६७॥ सा धारणीयचरिता
    ताथागतनिरासिना । नाथार्हकेलिर्जयति गाधा श्रेणीकृदीडिता ॥ ६८॥ जरादिहानिदा सेन्धे धराधरगणेडिता । निराकृतार्तिर्जननी
    कराकलितसारसा ॥ ६९॥ सीराकृष्टस्थले जाता धीराराध्यस्य नायिका । सारार्थकृद्दयासारा नारायणसहासना ॥ ७०॥
    तारनाथादृतास्यैषा सारधीसद्गणार्चिता । या रक्षणे धृतदया सारक्षेत्रादिदायिनी ॥ ७१॥ निजनाथशस्त्रदलितारिचया
    जनकाधिराजतनया जननी । कलितश्रिया हि निजया हि दृशा जनताहिताय किल रङ्गतले ॥ ७२॥ रङ्गतलकलितकेलिः सज्जनरक्षादरेण
    कल्याणी । निजकरकिसलयकलितानन्तशयाङ्घ्रिश्च राजते जननी ॥ ७३॥ कलशसागरकन्यकया तया जगति सज्जनरक्षणदीक्षितः
    । कलितरङ्गगृहे हरिरेधते करकृतादरशङ्खरथाङ्गकः ॥ ७४॥ दिशि दिशि धनधारा दैत्यजिन्नित्यदाराः कृतनतिजनधीराराधिता
    जातसारा । कलितगगनचारा काशते रत्नहारा निरसितजनिनारा सत्कृतानन्दसारा ॥ ७५॥ धनतरशशिहारा श्रेयसः सा हि
    धारा दिनकरशशिनेत्रा रक्षितानेकयात्रा । निरसितकलिकाला नाथकृष्णार्हलीला कनति कनकचेला दीनरक्षैकशीला ॥
    ७६॥ अनादिनिधिरेषा नः श्रेयसे जयशालिनी । कञ्जालया कृष्णदारा जननी कलिहारिणी ॥ ७७॥ चिरकालार्चिता धन्यैर्धरणीतनया
    हि नः । काङ्क्षितानि ददात्येषा कञ्जायतदृशः श्रिया ॥ ७८॥ नालीकिनीनाथजनायकेन यदर्थिना किन्नरगेयकीर्त्या
    । लङ्का हता सा शरराशिदग्धा सा जानकी रक्षितसद्गणा हि ॥ ७९॥ सारङ्गाक्षी सरसिजकरा सागरेन्द्रस्य कन्या
    सारासाराधिगतधिषणैः सन्नता सन्नताङ्गी । सीता ख्याता सदयहृदया सादरा साधयन्ती सैषा श्रेयः सकलजगतीसद्गतीर्दर्शयन्ती
    ॥ ८०॥ कल्याणी सा कलशजलधेः कन्यका क्लेशहन्त्री काले काले कृतनतिहिता काङ्क्षिताधिक्यदात्री । कान्तारान्तः
    कलितचरणा किन्नरीगीतकीर्तिः कृष्णाकृष्टा कनकसरितः सैकते कान्तकेलिः ॥ ८१॥ रासक्रीडारसिकदयिता रङ्गगेहान्तरस्था
    राजश्रेणीललितशिरसां रत्ननीराजिताङ्घ्रिः । राजत्येषा ललितनगरीराजधान्यादिदात्री राकाचन्द्रादृतजलधिजा
    राजते राजतेजाः ॥ ८२॥ जननीनिरीक्षिता ये ते सरसिजनेत्ररक्षिताः कलिताः । तन्नः श्रेयः श्रेणीजयादिततये
    सदा लसति ॥ ८३॥ कलितागः शतनिचये जने नते ते दयासारः । कृतरक्षणघाटी स्यादिति निश्चित्यादरेण जननि जनाः
    ॥ ८४॥ या शीतकिरणसहजा सा नस्त्राणाय कलितदीक्षा हि निरसितकृतान्तकिङ्करदृष्टय एते जनाः काले ॥ ८५॥ कलयति
    जलनिधिकन्या गङ्गासह्याद्रिजादितटसङ्गा । श्रेयः सकलार्थिहिता यस्याश्चरणस्थलानि कलितानि ॥ ८६॥ ज्ञानघना
    सा जननी कन्दलयति सारसारसश्रेयः । चन्दनलतया कनकजलतयारादादरात् कृतिके ॥ ८७॥ दयया शीतलहृदया सारसहस्ता
    च लसति जननी नः । रक्षितसत्सङ्घारान्नाकिगणार्च्याङ्घ्रिसरसिजा काले ॥ ८८॥ रक्षितरसिकगणैषा किसलयचरणा
    हि जयति जननी नः । कीरगणकल्यगीरिह सकले शास्त्रार्थसञ्चये लसिता ॥ ८९॥ आदृतसत्सत्कारा नाथहितानाथरक्षणैकदृशा
    । कलयति नैजदृशा किल नः श्रेयः कलिनिरासकृतघाटी ॥ ९०॥ जननी कलङ्करहितानना घनश्रीः सदा लसति रङ्गे । रसघननिजास्यसरसिजगीरेषा
    सत्यसन्धाना ॥ ९१॥ केकानादे कनककदलीकाण्डनीलान्तराले कञ्जाक्षी सा कनकसरितः केलिगेहान्तरस्था । कान्तक्रीडाकलितहृदया
    रक्षणे दत्तकेलिः कल्हारश्रीकरकिसलया कज्जलाक्तायताक्षी ॥ ९२॥ चन्द्रकलाचन्दनरसघनसाराद्यैः सदृग्गिरा
    जननी । जनयति रक्षादायिन्येषा कञ्जाक्षहृद्यनिजकलनाः ॥ ९३॥ जितसारङ्गाक्षी सा या रङ्गाक्षीडिता च रङ्गतले
    । कलयति दानानि हि नः काले काले च कृष्णजलदेन ॥ ९४॥ अञ्जनाद्रीशकेल्या यादृतचित्ता सनातनी । निरञ्जनजनैरेषाराधिता
    हि चिराय सा ॥ ९५॥ नाकेशनगरीकान्तालाल्यनैजाङ्घ्रिसारसा । जननी चन्द्रसहजा सा रङ्गादितटे स्थिरा ॥ ९६॥
    राजति हरिहृदये सा कलितत्राणा कृतागसि जने हि । यल्लीलारसघाट्याकृष्टकृदिन्धे स रङ्गेशः ॥ ९७॥ अतिशयितनैजदाना
    सा श्रीरानन्दकन्दलश्रीर्हि । जननी रक्षितधरणी निरसितदेहीति गीरिहार्येड्या ॥ ९८॥ नतकाक्षितदानकलाकलितादृतगेयकीर्तिकलिका
    सा । राजति रङ्गेशगृहे सनातनी सन्निधिः श्रीर्हि ॥ ९९॥ निरसिताधरसङ्गनिजाक्षरग्रथितया ह्यनया हरिनायिका
    । जयति सा धृतहर्षणसन्ततिः कृतधनादिरिहादृतसद्गणा ॥ १००॥ इति निरोष्ठयपदैर्ललितामिमां स्तुतिमुदारमतिः
    कृतकौतुकः । जयति कृष्णकविः कमलापदाम्बुजयुगे कलयन् सफलक्रियः ॥ १०१॥ इति कृष्णकविप्रणीतं निरोष्टयमिन्दिराशतकं
    सम्पूर्णम् । स्तोत्रसमुच्चयः २
