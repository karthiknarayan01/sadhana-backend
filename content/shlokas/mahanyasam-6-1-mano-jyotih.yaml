id: mahanyasam-6-1-mano-jyotih
category: stotram
name:
  english: Mahanyasam - 6.1. Mano Jyotih
content:
  english: mano jyoti rjushata ndadhatu | ya ishta ushaso nimrucashca tassandadhami havisha ghritena |
    m | yahva iva pravaya mujjihanah prabhanavah sisrate nakamaccha | agni rmurdha divah kakutpatih prithivya
    ayam | apagm retagmsi jinvati | mritaya jatamagnim | kavigm samraja marmani te varmabhishcha dayami
    somastva raja 'mrite nabhivastam | uro rvariyo varivaste astu jayanta ntva manumadantu devah | jataveda
    yadi va pavako 'si | vaishvanaro yadi va vaidyuto mprajabhyo yajamanaya lokam | urja ndada dabhyava
    vrithsva ||
  devanagari: मनो॒ ज्योति॑ र्जुषता॒ न्द॑धातु । या इ॒ष्टा उ॒षसो॑ नि॒म्रुच॑श्च॒ तास्सन्द॑धामि ह॒विषा॑ घृ॒तेन॑
    । म् । य॒ह्वा इ॑व॒ प्रव॒या मु॒ज्जिहा॑नाः॒ प्रभा॒नवः॑ सिस्रते॒ नाक॒मच्छ॑ । अ॒ग्नि र्मू॒र्धा दि॒वः क॒कुत्पतिः॑
    पृथि॒व्या अ॒यम् । अ॒पाग्ं रेताग्ं॑सि जिन्वति । मृ॒ताय॑ जा॒तम॒ग्निम् । क॒विग्ं स॒म्राज॒ मर्मा॑णि ते॒
    वर्म॑भिश्छा दयामि॒ सोम॑स्त्वा॒ राजा॒ ऽमृ॑ते ना॒भिव॑स्ताम् । उ॒रो र्वरी॑यो॒ वरि॑वस्ते अस्तु॒ ज॑यन्त॒
    न्त्वा मनु॑मदन्तु दे॒वाः । जा॒तवे॑दा॒ यदि॑ वा पाव॒को ऽसि॑ । वै॒श्वा॒न॒रो यदि॑ वा वैद्यु॒तो म्प्र॒जाभ्यो॒
    यज॑मानाय लो॒कम् । ऊर्ज॒ न्दद॑ द॒भ्याव॑ वृथ्स्व ॥
