id: shiva-bhujanga-stotram
category: stotram
name:
  english: Shiva Bhujanga Stotram
content:
  english: galaddanagandam miladbhringashandam calaccarushundam jagattranashaundam | kanaddantakandam
    vipadbhangacandam shivapremapindam bhaje vakratundam || || anadyantamadyam param tattvamartham cidakaramekam
    turiyam tvameyam | haribrahmamrigyam parabrahmarupam manovagatitam mahahshaivamide || || svashaktyadi
    shaktyanta simhasanastham manohari sarvangaratnorubhusham | jatahindugangasthishamyakamaulim parashaktimitram
    namah pancavaktram || || shiveshanatatpurushaghoravamadibhih pancabhirhrinmukhaih shadbhirangaih |
    anaupamya shattrimshatam tattvavidyamatitam param tvam katham vetti ko va || || pravalapravahaprabhashonamardham
    marutvanmani shrimahah shyamamardham | gunasyutametadvapuh shaivamantah smarami smarapattisampattihetoh
    || || svasevasamayatadevasurendra namanmaulimandaramalabhishiktam | namasyami shambho padambhoruham
    te bhavambhodhipotam bhavani vibhavyam || || jagannatha mannatha gaurisanatha prapannanukampinvipannartiharin
    | mahahstomamurte samastaikabandho namaste namaste punaste namo'stu || || virupaksha vishvesha vishvadideva
    trayi mula shambho shiva tryambaka tvam | prasida smara trahi pashyavamuktyai kshamam prapnuhi tryaksha
    mam raksha modat || || mahadeva devesha devadideva smarare purare yamare hareti | bruvanah smarishyami
    bhaktya linè bhavantam tato me dayashila deva prasida || || tvadanyah sharanyah prapannasya neti prasida
    smaranneva hanyastu dainyam | na cette bhavedbhaktavatsalyahanistato me dayalo sada sannidhehi ||
    || ayam danakalastvaham danapatram bhavaneva data tvadanyam na yace | bhavadbhaktimeva sthiram dehi
    mahyam kripashila shambho kritartho'smi tasmat || || pashum vetsi cenmam tamevadhirudhah kalankiti
    va murdhni dhatse tameva | dvijihvah punah so'pi te kanthabhusha tvadangikritah sharva sarve'pi dhanyah
    || || na shaknomi kartum paradrohalesham katham priyase tvam na jane girisha | tathahi prasanno'si
    kasyapi kantasutadrohino va pitridrohino va || || stutim dhyanamarcam yathavadvidhatum bhajannapyajananmaheshavalambe
    | trasantam sutam tratumagre mrikandoryamaprananirvapanam tvatpadabjam || || shiro drishti hridroga
    shula pramehajvararsho jarayakshmahikkavishartan | tvamadyo bhishagbheshajam bhasma shambho tvamullaghayasmanvapurlaghavaya
    || || daridro'smyabhadro'smi bhagno'smi duye vishanno'smi sanno'smi khinno'smi caham | bhavanpraninamantaratmasi
    shambho mamadhim na vetsi prabho raksha mam tvam || || tvadakshnoh katakshah patettryaksha yatra kshanam
    kshma ca lakshmih svayam tam vrinate | kiritasphuraccamaracchatramalakalacigajakshaumabhushavisheshaih
    || || bhavanyai bhavayapi matre ca pitre mridanyai mridayapyaghaghnyai makhaghne | shivangyai shivangaya
    kurmah shivayai shivayambikayai namastryambakaya || || bhavadgauravam mallaghutvam viditva prabho
    raksha karunyadrishtyanugam mam | shivatmanubhavastutavakshamo'ham svashaktya kritam me || yada karnarandhram
    vrajetkalavahadvishatkanthaghanta ghanatkaranadah | vrishadhishamaruhya devaupavahyantada vatsa ma
    bhiriti prinaya tvam || || yada darunabhashana bhishana me bhavishyantyupante kritantasya dutah |
    tada manmanastvatpadambhoruhastham katham nishcalam syannamaste'stu shambho || || yada durnivaravyatho'ham
    shayano luthannihshvasannihsritavyaktavanih | tada jahnukanyajalalankritam te jatamandalam manmanomandire
    syat || || yada putramitradayo matsakashe rudantyasya ha kidrishiyam dasheti | tada devadevesha gaurisha
    shambho namaste shivayetyajasram bravani || || yada pashyatam mamasau vetti nasmanayam shvasa eveti
    vaco bhaveyuh | tada bhutibhusham bhujangavanaddham purare bhavantam sphutam bhavayeyam || || yada
    yatanadehasandehavahi bhavedatmadehe na moho mahanme | tada kashashitamshusankashamisha smarare vapuste
    namaste smarami || || yadaparamacchayamasthanamadbhirjanairva vihinam gamishyami margam | tada tam
    nirundhankritantasya margam mahadeva mahyam manojnam prayaccha || || yada rauravadi smaranneva bhitya
    vrajamyatra moham mahadeva ghoram | tada mamaho natha kastarayishyatyanatham paradhinamardhendumaule
    || || yada shvetapatrayatalanghyashakteh kritantadbhayam bhaktivatsalyabhavat | tada pahi mam parvativallabhanyam
    na pashyami patarametadrisham me || || idanimidanim mritirme bhavitrityaho santatam cintaya pidito'smi
    | katham nama ma bhunmritau bhitiresha namaste gatinam gate nilakantha || || amaryadamevahamabalavriddham
    harantam kritantam samikshyasmi bhitah | mritau tavakanghryabjadivyaprasadadbhavanipate nirbhayo'ham
    bhavani || || jarajanmagarbhadhivasadiduhkhanyasahyani jahyam jagannatha deva | bhavantam vina me
    gatirnaiva shambho dayalo na jagarti kim va daya te || || shivayeti shabdo namahpurva esha smaranmuktikrinmrityuha
    tattvavaci | maheshana ma ganmanasto vacastah sada mahyametatpradanam prayaccha || || tvamapyamba
    mam pashya shitamshumaulipriye bheshajam tvam bhavavyadhishantau bahukleshabhajam padambhojapote bhavabdhau
    nimagnam nayasvadya param || || anudyallalatakshi vahni prarohairavamasphuraccaruvamorushobhaih |
    anangabhramadbhogibhushavisheshairacandrardhacudairalam daivatairnah || || akanthekalankadanangebhujangadapanaukapaladaphale'nalakshat
    | amaulaushashankadavamekalatradaham devamanyam na manye na manye || || mahadeva shambho girisha trishulimstvadiyam
    samastam vibhatiti yasmat | shivadanyatha daivatam nabhijane shivo'ham shivo'ham shivo'ham shivo'ham
    || || yato'jayatedam prapancam vicitram sthitim yati yasminyadekantamante | sa karmadihinah svayanjyotiratma
    shivo'ham shivo'ham shivo'ham shivo'ham || || kirite nishesho lalate hutasho bhuje bhogirajo gale
    kalima ca | tanau kamini yasya tattulyadevam na jane na jane na jane na jane || || anena stavenadaradambikesham
    param bhaktimasadya yam ye namanti | mritau nirbhayaste janastam bhajante hridambhojamadhye sadasinamisham
    || || bhujangapriyakalpa shambho mayaivam bhujangaprayatena vrittena klriptam | narah stotrametatpathitvorubhaktya
    suputrayurarogyamaishvaryameti ||
  devanagari: गलद्दानगण्डं मिलद्भृङ्गषण्डं चलच्चारुशुण्डं जगत्त्राणशौण्डम् । कनद्दन्तकाण्डं विपद्भङ्गचण्डं
    शिवप्रेमपिण्डं भजे वक्रतुण्डम् ॥ ॥ अनाद्यन्तमाद्यं परं तत्त्वमर्थं चिदाकारमेकं तुरीयं त्वमेयम् । हरिब्रह्ममृग्यं
    परब्रह्मरूपं मनोवागतीतं महःशैवमीडे ॥ ॥ स्वशक्त्यादि शक्त्यन्त सिंहासनस्थं मनोहारि सर्वाङ्गरत्नोरुभूषम्
    । जटाहीन्दुगङ्गास्थिशम्याकमौलिं पराशक्तिमित्रं नमः पञ्चवक्त्रम् ॥ ॥ शिवेशानतत्पूरुषाघोरवामादिभिः पञ्चभिर्हृन्मुखैः
    षड्भिरङ्गैः । अनौपम्य षट्त्रिंशतं तत्त्वविद्यामतीतं परं त्वां कथं वेत्ति को वा ॥ ॥ प्रवालप्रवाहप्रभाशोणमर्धं
    मरुत्वन्मणि श्रीमहः श्याममर्धम् । गुणस्यूतमेतद्वपुः शैवमन्तः स्मरामि स्मरापत्तिसम्पत्तिहेतोः ॥ ॥ स्वसेवासमायातदेवासुरेन्द्रा
    नमन्मौलिमन्दारमालाभिषिक्तम् । नमस्यामि शम्भो पदाम्भोरुहं ते भवाम्भोधिपोतं भवानी विभाव्यम् ॥ ॥ जगन्नाथ
    मन्नाथ गौरीसनाथ प्रपन्नानुकम्पिन्विपन्नार्तिहारिन् । महःस्तोममूर्ते समस्तैकबन्धो नमस्ते नमस्ते पुनस्ते
    नमोऽस्तु ॥ ॥ विरूपाक्ष विश्वेश विश्वादिदेव त्रयी मूल शम्भो शिव त्र्यम्बक त्वम् । प्रसीद स्मर त्राहि
    पश्यावमुक्त्यै क्षमां प्राप्नुहि त्र्यक्ष मां रक्ष मोदात् ॥ ॥ महादेव देवेश देवादिदेव स्मरारे पुरारे
    यमारे हरेति । ब्रुवाणः स्मरिष्यामि भक्त्या लिनॆ भवन्तं ततो मे दयाशील देव प्रसीद ॥ ॥ त्वदन्यः शरण्यः
    प्रपन्नस्य नेति प्रसीद स्मरन्नेव हन्यास्तु दैन्यम् । न चेत्ते भवेद्भक्तवात्सल्यहानिस्ततो मे दयालो
    सदा सन्निधेहि ॥ ॥ अयं दानकालस्त्वहं दानपात्रं भवानेव दाता त्वदन्यं न याचे । भवद्भक्तिमेव स्थिरां देहि
    मह्यं कृपाशील शम्भो कृतार्थोऽस्मि तस्मात् ॥ ॥ पशुं वेत्सि चेन्मां तमेवाधिरूढः कलङ्कीति वा मूर्ध्नि
    धत्से तमेव । द्विजिह्वः पुनः सोऽपि ते कण्ठभूषा त्वदङ्गीकृताः शर्व सर्वेऽपि धन्याः ॥ ॥ न शक्नोमि कर्तुं
    परद्रोहलेशं कथं प्रीयसे त्वं न जाने गिरीश । तथाहि प्रसन्नोऽसि कस्यापि कान्तासुतद्रोहिणो वा पितृद्रोहिणो
    वा ॥ ॥ स्तुतिं ध्यानमर्चां यथावद्विधातुं भजन्नप्यजानन्महेशावलम्बे । त्रसन्तं सुतं त्रातुमग्रे मृकण्डोर्यमप्राणनिर्वापणं
    त्वत्पदाब्जम् ॥ ॥ शिरो दृष्टि हृद्रोग शूल प्रमेहज्वरार्शो जरायक्ष्महिक्काविषार्तान् । त्वमाद्यो भिषग्भेषजं
    भस्म शम्भो त्वमुल्लाघयास्मान्वपुर्लाघवाय ॥ ॥ दरिद्रोऽस्म्यभद्रोऽस्मि भग्नोऽस्मि दूये विषण्णोऽस्मि
    सन्नोऽस्मि खिन्नोऽस्मि चाहम् । भवान्प्राणिनामन्तरात्मासि शम्भो ममाधिं न वेत्सि प्रभो रक्ष मां त्वम्
    ॥ ॥ त्वदक्ष्णोः कटाक्षः पतेत्त्र्यक्ष यत्र क्षणं क्ष्मा च लक्ष्मीः स्वयं तं वृणाते । किरीटस्फुरच्चामरच्छत्रमालाकलाचीगजक्षौमभूषाविशेषैः
    ॥ ॥ भवान्यै भवायापि मात्रे च पित्रे मृडान्यै मृडायाप्यघघ्न्यै मखघ्ने । शिवाङ्ग्यै शिवाङ्गाय कुर्मः
    शिवायै शिवायाम्बिकायै नमस्त्र्यम्बकाय ॥ ॥ भवद्गौरवं मल्लघुत्वं विदित्वा प्रभो रक्ष कारुण्यदृष्ट्यानुगं
    माम् । शिवात्मानुभावस्तुतावक्षमोऽहं स्वशक्त्या कृतं मे ॥ यदा कर्णरन्ध्रं व्रजेत्कालवाहद्विषत्कण्ठघण्टा
    घणात्कारनादः । वृषाधीशमारुह्य देवौपवाह्यन्तदा वत्स मा भीरिति प्रीणय त्वम् ॥ ॥ यदा दारुणाभाषणा भीषणा
    मे भविष्यन्त्युपान्ते कृतान्तस्य दूताः । तदा मन्मनस्त्वत्पदाम्भोरुहस्थं कथं निश्चलं स्यान्नमस्तेऽस्तु
    शम्भो ॥ ॥ यदा दुर्निवारव्यथोऽहं शयानो लुठन्निःश्वसन्निःसृताव्यक्तवाणिः । तदा जह्नुकन्याजलालङ्कृतं
    ते जटामण्डलं मन्मनोमन्दिरे स्यात् ॥ ॥ यदा पुत्रमित्रादयो मत्सकाशे रुदन्त्यस्य हा कीदृशीयं दशेति ।
    तदा देवदेवेश गौरीश शम्भो नमस्ते शिवायेत्यजस्रं ब्रवाणि ॥ ॥ यदा पश्यतां मामसौ वेत्ति नास्मानयं श्वास
    एवेति वाचो भवेयुः । तदा भूतिभूषं भुजङ्गावनद्धं पुरारे भवन्तं स्फुटं भावयेयम् ॥ ॥ यदा यातनादेहसन्देहवाही
    भवेदात्मदेहे न मोहो महान्मे । तदा काशशीतांशुसङ्काशमीश स्मरारे वपुस्ते नमस्ते स्मरामि ॥ ॥ यदापारमच्छायमस्थानमद्भिर्जनैर्वा
    विहीनं गमिष्यामि मार्गम् । तदा तं निरुन्धङ्कृतान्तस्य मार्गं महादेव मह्यं मनोज्ञं प्रयच्छ ॥ ॥ यदा
    रौरवादि स्मरन्नेव भीत्या व्रजाम्यत्र मोहं महादेव घोरम् । तदा मामहो नाथ कस्तारयिष्यत्यनाथं पराधीनमर्धेन्दुमौले
    ॥ ॥ यदा श्वेतपत्रायतालङ्घ्यशक्तेः कृतान्ताद्भयं भक्तिवात्सल्यभावात् । तदा पाहि मां पार्वतीवल्लभान्यं
    न पश्यामि पातारमेतादृशं मे ॥ ॥ इदानीमिदानीं मृतिर्मे भवित्रीत्यहो सन्ततं चिन्तया पीडितोऽस्मि । कथं
    नाम मा भून्मृतौ भीतिरेषा नमस्ते गतीनां गते नीलकण्ठ ॥ ॥ अमर्यादमेवाहमाबालवृद्धं हरन्तं कृतान्तं समीक्ष्यास्मि
    भीतः । मृतौ तावकाङ्घ्र्यब्जदिव्यप्रसादाद्भवानीपते निर्भयोऽहं भवानि ॥ ॥ जराजन्मगर्भाधिवासादिदुःखान्यसह्यानि
    जह्यां जगन्नाथ देव । भवन्तं विना मे गतिर्नैव शम्भो दयालो न जागर्ति किं वा दया ते ॥ ॥ शिवायेति शब्दो
    नमःपूर्व एष स्मरन्मुक्तिकृन्मृत्युहा तत्त्ववाची । महेशान मा गान्मनस्तो वचस्तः सदा मह्यमेतत्प्रदानं
    प्रयच्छ ॥ ॥ त्वमप्यम्ब मां पश्य शीतांशुमौलिप्रिये भेषजं त्वं भवव्याधिशान्तौ बहुक्लेशभाजं पदाम्भोजपोते
    भवाब्धौ निमग्नं नयस्वाद्य पारम् ॥ ॥ अनुद्यल्ललाटाक्षि वह्नि प्ररोहैरवामस्फुरच्चारुवामोरुशोभैः । अनङ्गभ्रमद्भोगिभूषाविशेषैरचन्द्रार्धचूडैरलं
    दैवतैर्नः ॥ ॥ अकण्ठेकलङ्कादनङ्गेभुजङ्गादपाणौकपालादफालेऽनलाक्षात् । अमौलौशशाङ्कादवामेकलत्रादहं देवमन्यं
    न मन्ये न मन्ये ॥ ॥ महादेव शम्भो गिरीश त्रिशूलिंस्त्वदीयं समस्तं विभातीति यस्मात् । शिवादन्यथा दैवतं
    नाभिजाने शिवोऽहं शिवोऽहं शिवोऽहं शिवोऽहम् ॥ ॥ यतोऽजायतेदं प्रपञ्चं विचित्रं स्थितिं याति यस्मिन्यदेकान्तमन्ते
    । स कर्मादिहीनः स्वयञ्ज्योतिरात्मा शिवोऽहं शिवोऽहं शिवोऽहं शिवोऽहम् ॥ ॥ किरीटे निशेशो ललाटे हुताशो
    भुजे भोगिराजो गले कालिमा च । तनौ कामिनी यस्य तत्तुल्यदेवं न जाने न जाने न जाने न जाने ॥ ॥ अनेन स्तवेनादरादम्बिकेशं
    परां भक्तिमासाद्य यं ये नमन्ति । मृतौ निर्भयास्ते जनास्तं भजन्ते हृदम्भोजमध्ये सदासीनमीशम् ॥ ॥ भुजङ्गप्रियाकल्प
    शम्भो मयैवं भुजङ्गप्रयातेन वृत्तेन क्लृप्तम् । नरः स्तोत्रमेतत्पठित्वोरुभक्त्या सुपुत्रायुरारोग्यमैश्वर्यमेति
    ॥
