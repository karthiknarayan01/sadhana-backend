id: taittiriyaaranyaka
category: veda
name:
  english: taittiriyaaranyaka
  devanagari: तैत्तिरीयआरण्यक
content:
  english: ̭sa bha̱vati | yuva syathsadhuyṷva'dhya̱yakah | ashishtho dridhishtho̭ bali̱shthah | tasyeyam
    prithivi sarva vittasya̭ purna̱ syat | sa eko manusha̭ ana̱ndah | te ye shatam manusha̭ ana̱ndah |
    sa eko manushyagandharvana̭mana̱ndah | shrotriyasya cakama̭hata̱sya | te ye shatam manushyagandharvana̭mana̱ndah
    | sa eko devagandharvana̭mana̱ndah | shrotriyasya cakama̭hata̱sya | te ye shatam devagandharvana̭mana̱ndah
    | sa ekah pitrinam ciralokalokana̭mana̱ndah | shrotriyasya cakama̭hata̱sya | te ye shatam pitrinam
    ciralokalokana̭mana̱ndah | sa eka ajanajanam devana̭mana̱ndah | shrotriyasya cakama̭hata̱sya | te
    ye shatamajanajanam devana̭mana̱ndah | sa ekah karmadevanam devana̭mana̱ndah | ye karmana devana̭piya̱nti
    | shrotriyasya cakama̭hata̱sya | te ye shatam karmadevanam devana̭mana̱ndah | sa eko devana̭mana̱ndah
    | shrotriyasya cakama̭hata̱sya | te ye shatam devana̭mana̱ndah | sa eka indra̭sya''na̱ndah || shrotriyasya
    cakama̭hata̱sya | te ye shatamindra̭sya''na̱ndah | sa eko brihaspatḙrana̱ndah | shrotriyasya cakama̭hata̱sya
    | te ye shatam brihaspatḙrana̱ndah | sa ekah prajapatḙrana̱ndah | shrotriyasya cakama̭hata̱sya |
    te ye shatam prajapatḙrana̱ndah | sa eko brahmana̭ ana̱ndah | shrotriyasya cakama̭hata̱sya | sa yashca̭yam
    pu̱rushe | yashcasa̭vadi̱tye | sa eka̭h | sa ya̭ eva̱mvit | asmallo̭katpre̱tya | etamannamayamatmanamupa̭samkra̱mati
    | etam pranamayamatmanamupa̭samkra̱mati | etam manomayamatmanamupa̭samkra̱mati | etam vijnanamayamatmanamupa̭samkra̱mati
    | etamanandamayamatmanamupa̭samkra̱mati | tadapyesha shlo̭ko bha̱vati || 0| 8| 8| 8|| 9 yato̱ vaco̱
    niva̭rtante | apra
  devanagari: ॑सा भ॒वति । युवा स्याथ्साधुयु॑वाऽध्या॒यकः । आशिष्ठो दृढिष्ठो॑ बलि॒ष्ठः । तस्येयं पृथिवी
    सर्वा वित्तस्य॑ पूर्णा॒ स्यात् । स एको मानुष॑ आन॒न्दः । ते ये शतं मानुषा॑ आन॒न्दाः । स एको मनुष्यगन्धर्वाणा॑मान॒न्दः
    । श्रोत्रियस्य चाकाम॑हत॒स्य । ते ये शतं मनुष्यगन्धर्वाणा॑मान॒न्दाः । स एको देवगन्धर्वाणा॑मान॒न्दः
    । श्रोत्रियस्य चाकाम॑हत॒स्य । ते ये शतं देवगन्धर्वाणा॑मान॒न्दाः । स एकः पितृणां चिरलोकलोकाना॑मान॒न्दः
    । श्रोत्रियस्य चाकाम॑हत॒स्य । ते ये शतं पितृणां चिरलोकलोकाना॑मान॒न्दाः । स एक आजानजानां देवाना॑मान॒न्दः
    । श्रोत्रियस्य चाकाम॑हत॒स्य । ते ये शतमाजानजानां देवाना॑मान॒न्दाः । स एकः कर्मदेवानां देवाना॑मान॒न्दः
    । ये कर्मणा देवान॑पिय॒न्ति । श्रोत्रियस्य चाकाम॑हत॒स्य । ते ये शतं कर्मदेवानां देवाना॑मान॒न्दाः ।
    स एको देवाना॑मान॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य । ते ये शतं देवाना॑मान॒न्दाः । स एक इन्द्र॑स्याऽऽन॒न्दः
    ॥ श्रोत्रियस्य चाकाम॑हत॒स्य । ते ये शतमिन्द्र॑स्याऽऽन॒न्दाः । स एको बृहस्पते॑रान॒न्दः । श्रोत्रियस्य
    चाकाम॑हत॒स्य । ते ये शतं बृहस्पते॑रान॒न्दाः । स एकः प्रजापते॑रान॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य
    । ते ये शतं प्रजापते॑रान॒न्दाः । स एको ब्रह्मण॑ आन॒न्दः । श्रोत्रियस्य चाकाम॑हत॒स्य । स यश्चा॑यं पु॒रुषे
    । यश्चासा॑वादि॒त्ये । स एकः॑ । स य॑ एवं॒वित् । अस्माल्लो॑कात्प्रे॒त्य । एतमन्नमयमात्मानमुप॑संक्रा॒मति
    । एतं प्राणमयमात्मानमुप॑संक्रा॒मति । एतं मनोमयमात्मानमुप॑संक्रा॒मति । एतं विज्ञानमयमात्मानमुप॑संक्रा॒मति
    । एतमानन्दमयमात्मानमुप॑संक्रा॒मति । तदप्येष श्लो॑को भ॒वति ॥ ०। ८। ८। ८॥ ९ यतो॒ वाचो॒ निव॑र्तन्ते ।
    अप्रा
