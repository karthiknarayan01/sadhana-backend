id: shivastava
category: stotram
name:
  english: shivastava
  devanagari: शिवस्तव
content:
  english: rvayureva ca | akasham tvam param shunyam sakalam nishkalam tatha || 4|| ashucirva shucirvapi
    sarvakamagato'pi va | cintayeddevamishanam sa bahyabhyantarah shucih || 5|| namaste devadevesha tvatprasadadvadamyaham
    | vakye hine'tirikte va mam kshamasva surottama || 6|| namaste devadevesha ishana varadacyuta | mama
    siddhim bhuyashca
  devanagari: र्वायुरेव च । आकाशं त्वं परं शून्यं सकलं निष्कलं तथा ॥ ४॥ अशुचिर्वा शुचिर्वापि सर्वकामगतोऽपि
    वा । चिन्तयेद्देवमीशानं स बाह्याभ्यन्तरः शुचिः ॥ ५॥ नमस्ते देवदेवेश त्वत्प्रसादाद्वदाम्यहम् । वाक्ये
    हीनेऽतिरिक्ते वा मां क्षमस्व सुरोत्तम ॥ ६॥ नमस्ते देवदेवेश ईशान वरदाच्युत । मम सिद्धिं भूयश्च
meaning: {}
