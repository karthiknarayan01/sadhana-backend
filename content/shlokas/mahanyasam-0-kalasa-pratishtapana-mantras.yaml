id: mahanyasam-0-kalasa-pratishtapana-mantras
category: stotram
name:
  english: Mahanyasam - 0. Kalasa Pratishtapana Mantras
content:
  english: ssuruco vena avah | sa budhniya upama asya vishtha masatashca vivah | nake suparna mupaya tpatantagm
    hrida venanto abhyacaksha tatva | hiranyapaksham ya~masya yonau shakuna mbhuranyum | apyayasva sametu
    te vishvatah soma vrishniyam | bhava vajasya sangathe | yo rudro agnau yo aphsu ya oshadhishu yo rudro
    vishva bhuvana ''vivesha tasmai rudraya namo astu | vi~shnu rvicakrame tredha nidadhe padam | samudhamasya
    pagm sure | indram ngirah | rathitamagm rathinam va~janagm satpati m | apo va idamgm sarvam vi~shva
    bhutanyapah prana va apah pashava apo ssamradapo viradapa shchandagshyapo jyotigshyapo yajugshyapa
    ssarva devata apo bhurbhuvassuvarapa om | apah pranayati | shraddha va apah | shraddhamevarabhya praniya
    pracarati | apah pranayati | yajno va apah | yajnamevarabhya praniya pracarati | apah pranayati |
    vajro va apah | vajrameva bhratrivyebhyah prahritya praniya pracarati | apah pranayati | apo vai rakshoghnih
    | rakshasamapahatyai | apah pranayati | apo vai devana ndhama | devanameva priya ndhama praniya pracarati
    | apah pranayati | apo vai sarva devatah | devata evarabhya praniya pracarati | apah pranayati | apo
    vai shantah | shantabhirevasya shucagm shamayati | devo vah savito cchidrena pavitrena vasossuryasya
    rashmibhih || kurcagrai rrakshasa nghoran chindhi karmavighatinah | tvamarpayami kumbhe nkuru karmani
    | vriksharaja samudbhuta shshakhayah pallavatva cah | yushman kumbheshvarpayami sarvapapapanuttaye
    | nalikera samudbhuta trinetra hara sammita | shikhaya duritam sarva nca me nuda | sa hi ratnani dashushe
    suvati savita bhagah | ta tatva yami brahmana vandamana ste yajamano havirbhih | ahedamano varuneha
    boddhyurushagmsa ma na ayuh pramoshih || o mbhurbhuvassuvarom | asmin kumbhe varunamavahayami | varunasya
    idamasanam | varunaya namah | sakalaradhanai ssvarcitam | ratnasimhasanam samarpayami | padyam samarpayami
    | arghyam samarpayami | acamaniyam samarpayami | madhuparkkam samarpayami | snanam samarpayami | snananantaram
    acamaniyam samarpayami | vastrottariyam samarpayami | upavitam samarpayami | gandha ndharayami | akshatan
    samarpayami | pushpani samarpayami | va~runaya namah | nanavidha parimala patra pushpani samarpayami
    | dhupam aghrapayami | dipa shayami | dhupadipanantaram acamaniyam samarpayami | o mbhurbhuvassuvah
    | tathsaviturvare mbhargo devasya dhimahi | dhiyo yona pracodaya t | deva savitah prasuvah | satya
    ntvartena parishincami | ntva satyena parishincami mbhavatu | amritopastaranamasi | o mpranaya svaha
    | om apanaya svaha | om vya~naya svaha | om udanaya svaha | om samanaya svaha | o mbrahmane svaha
    | kadaliphala nnivedayami | maddhyemaddhye amritapaniyam samarpayami | amritapidhanamasi | naivedyanantaram
    acamaniyam samarpayami | tambulam samarpayami | karpura nirajana shayami | nirajananantaram acamaniyam
    samarpayami | mantra pushpam samarpayami | suvarna pushpam samarpayami | samastopacaran samarpayami
    ||
  devanagari: स्सु॒रुचो॑ वे॒न आ॑वः । स बु॒ध्निया॑ उप॒मा अ॑स्य वि॒ष्ठा मस॑तश्च॒ विवः॑ । नाके॑ सुप॒र्ण मुप॒य
    त्पत॑न्तग्ं हृ॒दा वेन॑न्तो अ॒भ्यच॑क्ष तत्वा । हिर॑ण्यपक्षं॒ यँ॒मस्य॒ योनौ॑ शकु॒न म्भु॑र॒ण्युम् । आप्या॑यस्व॒
    समे॑तु ते वि॒श्वतः॑ सोम॒ वृष्णि॑यम् । भवा॒ वाज॑स्य सङ्ग॒थे । यो रु॒द्रो अ॒ग्नौ यो अ॒फ्सु य ओष॑धीषु॒
    यो रु॒द्रो विश्वा॒ भुव॑ना ऽऽवि॒वेश॒ तस्मै॑ रु॒द्राय॒ नमो॑ अस्तु । विँष्णु॒ र्विच॑क्रमे त्रे॒धा निद॑धे
    प॒दम् । समू॑ढमस्य पाग्ं सु॒रे । इन्द्रं॒ ङ्गिरः॑ । र॒थीत॑मग्ं रथी॒नां वाँजा॑ना॒ग्ं॒ सत्प॑ति॒ म् ।
    आपो॒ वा इ॒दंग्ं सर्वं॒ विँश्वा॑ भू॒तान्यापः॑ प्रा॒णा वा आपः॑ प॒शव॒ आपो स्स॒म्राडापो॑ वि॒राडाप॑ श्छन्दा॒ग्॒श्यापो॒
    ज्योती॒ग्॒ष्यापो॒ यजू॒ग्॒ष्याप॑ स्सर्वा॑ दे॒वता॒ आपो॒ भूर्भुव॒स्सुव॒राप॒ ओम् । अ॒पः प्रण॑यति । श्र॒द्धा
    वा आपः॑ । श्र॒द्धामे॒वारभ्य॑ प्र॒णीय॒ प्रच॑रति । अ॒पः प्रण॑यति । य॒ज्ञो वा आपः॑ । य॒ज्ञमे॒वारभ्य॑
    प्र॒णीय॒ प्रच॑रति । अ॒पः प्रण॑यति । वज्रो॒ वा आपः॑ । वज्र॑मे॒व भ्रातृ॑व्येभ्यः प्र॒हृत्य॑ प्र॒णीय॒
    प्रच॑रति । अ॒पः प्रण॑यति । आपो॒ वै र॑क्षो॒घ्नीः । रक्ष॑सा॒मप॑हत्यै । अ॒पः प्रण॑यति । आपो॒ वै दे॒वाना
    न्धाम॑ । दे॒वाना॑मे॒व प्रि॒य न्धाम॑ प्र॒णीय॒ प्रच॑रति । अ॒पः प्रण॑यति । आपो॒ वै सर्वा॑ दे॒वताः । दे॒वता॑
    ए॒वारभ्य॑ प्र॒णीय॒ प्रच॑रति । अ॒पः प्रण॑यति । आपो॒ वै शा॒न्ताः । शा॒न्ताभि॑रे॒वास्य॒ शुचग्ं॑ शमयति
    । दे॒वो वः॑ सवि॒तो च्छि॑द्रेण प॒वित्रे॑ण॒ वसो॒स्सूर्य॑स्य र॒श्मिभिः॑ ॥ कूर्चाग्रै र्राक्षसा न्घोरान्
    छिन्धि कर्मविघातिनः । त्वामर्पयामि कुम्भे ङ्कुरु कर्मणि । वृक्षराज समुद्भूता श्शाखायाः पल्लवत्व चः
    । युष्मान् कुम्भेष्वर्पयामि सर्वपापापनुत्तये । नालिकेर समुद्भूत त्रिनेत्र हर सम्मित । शिखया दुरितं
    सर्व ञ्च मे नुद । स॒ हि रत्ना॑नि दा॒शुषे॑ सु॒वाति॑ सवि॒ता भगः॑ । त तत्वा॑ यामि॒ ब्रह्म॑णा॒ वन्द॑मान॒
    स्ते॒ यज॑मानो ह॒विर्भिः॑ । अहे॑डमानो वरुणे॒ह बो॒द्ध्युरु॑शग्ंस॒ मा न॒ आयुः॒ प्रमो॑षीः ॥ ओ म्भूर्भुव॒स्सुव॒रोम्
    । अस्मिन् कुम्भे वरुणमावाहयामि । वरुणस्य इदमासनम् । वरुणाय नमः । सकलाराधनै स्स्वर्चितम् । रत्नसिंहासनं
    समर्पयामि । पाद्यं समर्पयामि । अर्घ्यं समर्पयामि । आचमनीयं समर्पयामि । मधुपर्क्कं समर्पयामि । स्नानं
    समर्पयामि । स्नानानन्तरं आचमनीयं समर्पयामि । वस्त्रोत्तरीयं समर्पयामि । उपवीतं समर्पयामि । गन्धा न्धारयामि
    । अक्षतान् समर्पयामि । पुष्पाणि समर्पयामि । वँरुणाय नमः । नानाविध परिमल पत्र पुष्पाणि समर्पयामि ।
    धूपं आघ्रापयामि । दीप शयामि । धूपदीपानन्तरं आचमनीयं समर्पयामि । ओ म्भूर्भुवस्सुवः । तथ्स॑वि॒तुर्वरे
    म्भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ योन॑ प्रचो॒दया त् । देव सवितः प्रसुवः । सत्य न्त्वर्तेन परिषिञ्चामि
    । न्त्वा सत्येन परिषिञ्चामि म्भवतु । अमृतोपस्तरणमसि । ओ म्प्राणाय स्वाहा । ॐ अपानाय स्वाहा । ॐ व्याँनाय
    स्वाहा । ॐ उदानाय स्वाहा । ॐ समानाय स्वाहा । ओ म्ब्रह्मणे स्वाहा । कदलीफल न्निवेदयामि । मद्ध्येमद्ध्ये
    अमृतपानीयं समर्पयामि । अमृतापिधानमसि । नैवेद्यानन्तरं आचमनीयं समर्पयामि । ताम्बूलं समर्पयामि । कर्पूर
    नीराजन शयामि । नीराजनानन्तरं आचमनीयं समर्पयामि । मन्त्र पुष्पं समर्पयामि । सुवर्ण पुष्पं समर्पयामि
    । समस्तोपचारान् समर्पयामि ॥
