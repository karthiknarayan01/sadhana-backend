id: brahmakritam07vishnustotram
category: stotram
name:
  english: brahmakritam07vishnustotram
  devanagari: ब्रह्मकृतं०७विष्णुस्तोत्रम्
content:
  english: rna vamadevah kimutapare surah | tanmayaya mohitabuddhayastvidam vinirmitam catmasamam vicakshmahe
    || 36|| yasyavatarakarmani gayanti hyasmadadayah | na yam vidanti tattvena tasmai bhagavate namah
    || 37|| sa esha adyah purushah kalpe kalpe srijatyajah | atma''tmanyatmana''tmanam samyacchati ca
    pati ca || 38|| vishuddham kevalam jnanam pratyak samyagavasthitam | satyam purnamanadyantam nirgunam
    nityamadvayam || 39|| rishe vidanti munayah prashantatmendriyashayah | yada tadevasattarkaistirodhiyeta
    viplutam || 40|| adyo'vatarah purushah parasya kalah svabhavah sadasanmanashca | dravyam vikaro guna
    indriyani virat svarat sthasnu carishnu bhumnah || 41|| aham bhavo yajna ime prajesha dakshadayo ye
    bhavadadayashca | svarlokapalah khagalokapala nrilokapalastalalokapalah || 42|| gandharvavidyadharacaranesha
    ye yaksharakshoraganaganathah | ye va rishinamrishabhah pitrinam daityendrasiddheshvaradanavendrah
    | anye ca ye pretapishacabhuta
  devanagari: र्न वामदेवः किमुतापरे सुराः । तन्मायया मोहितबुद्धयस्त्विदं विनिर्मितं चात्मसमं विचक्ष्महे
    ॥ ३६॥ यस्यावतारकर्माणि गायन्ति ह्यस्मदादयः । न यं विदन्ति तत्त्वेन तस्मै भगवते नमः ॥ ३७॥ स एष आद्यः
    पुरुषः कल्पे कल्पे सृजत्यजः । आत्माऽऽत्मन्यात्मनाऽऽत्मानं संयच्छति च पाति च ॥ ३८॥ विशुद्धं केवलं ज्ञानं
    प्रत्यक् सम्यगवस्थितम् । सत्यं पूर्णमनाद्यन्तं निर्गुणं नित्यमद्वयम् ॥ ३९॥ ऋषे विदन्ति मुनयः प्रशान्तात्मेन्द्रियाशयाः
    । यदा तदेवासत्तर्कैस्तिरोधीयेत विप्लुतम् ॥ ४०॥ आद्योऽवतारः पुरुषः परस्य कालः स्वभावः सदसन्मनश्च ।
    द्रव्यं विकारो गुण इन्द्रियाणि विराट् स्वराट् स्थास्नु चरिष्णु भूम्नः ॥ ४१॥ अहं भवो यज्ञ इमे प्रजेशा
    दक्षादयो ये भवदादयश्च । स्वर्लोकपालाः खगलोकपाला नृलोकपालास्तललोकपालाः ॥ ४२॥ गन्धर्वविद्याधरचारणेशा
    ये यक्षरक्षोरगनागनाथाः । ये वा ऋषीणामृषभाः पितॄणां दैत्येन्द्रसिद्धेश्वरदानवेन्द्राः । अन्ये च ये
    प्रेतपिशाचभूत
meaning: {}
