id: devaihkritamshrikrishnacaitanyastotram
category: stotram
name:
  english: devaihkritamshrikrishnacaitanyastotram
  devanagari: देवैःकृतंश्रीकृष्णचैतन्यस्तोत्रम्
content:
  english: devaih kritam shrikrishnacaitanyastotram deva ucuh | kulishadhvajapadmagadankushabham caranam
    tava natha mahabharanam | ramanam munibhirvidhishambhuyutam pranamama vayam bhavabhitiharam || 27||
    daracakragadambujamanadharah surashatrukathorashariraharah | sacaracaralokabharashcapalah khalanashakarassurakaryakarah
    || 28|| namaste shacinandananandakarinmahapapasantapadurlapaharin | surarinnihatyashu lokadhidharinsvabhaktyaghajatangakotipraharin
    || 29|| tvayaham svarupena satyam prapalya tvaya yajnarupena vedah prarakshyah | sa vai yajnarupo
    bhava~llokadhari shacinandanah shakrasharmaprasaktah || 30|| anarpitacaro ciratkarunayavatirnah kalau
    samarpayitumunnatojvalarasam svabhaktishriyam | hareh punarasundaradyutikadambasandipitah sada sphuratu
    no hridayakandare shacinandanah || 31|| visarjati naranbhavankarunaya prapalya kshitau nivedayitumudbhavah
    paratparam svakiyam padam | kalau ditijasambhavadhivyathabdhisuramagnagan samuddhara mahaprabho krishnacaitanya
    shacisuta || 32|| madhuryairmadhubhissugandhavadanah svarnambujanam vanam karunyamritanirjharairupacitah
    satpremahemacalah | bhaktambhodharadharini vijayini nishkampasaptavali devo nah kuladaivatam vijayate
    caitanyakrishno harih || 33|| devaratijanairadharmajanitaissapiditeyam mahi sankucyashu kalau kalevaramidam
    bijaya ha vartate | tvannamnaiva surarayo vidalitah patalagah pidita mleccha dharmaparah sureshanamanastasmai
    namo vyapine || 34|| iti bhavishyapurane pratisargaparvani caturthakhande dashamadhyayantargam devaih
    kritam shrikrishnacaitanyastotram samaptam | bhavishyapurana | pratisargaparva | caturthakhanda |
    adhyaya 10
  devanagari: देवैः कृतं श्रीकृष्णचैतन्यस्तोत्रम् देवा ऊचुः । कुलिशध्वजपद्मगदाङ्कुशाभं चरणं तव नाथ महाभरणम्
    । रमणं मुनिभिर्विधिशम्भुयुतं प्रणमाम वयं भवभीतिहरम् ॥ २७॥ दरचक्रगदाम्बुजमानधरः सुरशत्रुकठोरशरीरहरः
    । सचराचरलोकभरश्चपलः खलनाशकरस्सुरकार्यकरः ॥ २८॥ नमस्ते शचीनन्दनानन्दकारिन्महापापसन्तापदुर्लापहारिन्
    । सुरारीन्निहत्याशु लोकाधिधारिन्स्वभक्त्याघजाताङ्गकोटिप्रहारिन् ॥ २९॥ त्वयाहं स्वरूपेण सत्यं प्रपाल्य
    त्वया यज्ञरूपेण वेदः प्ररक्ष्यः । स वै यज्ञरूपो भवाँल्लोकधारी शचीनन्दनः शक्रशर्मप्रसक्तः ॥ ३०॥ अनर्पितचरो
    चिरात्करुणयावतीर्णः कलौ समर्पयितुमुन्नतोज्वलरसां स्वभक्तिश्रियम् । हरेः पुनरसुन्दरद्युतिकदम्बसन्दीपितः
    सदा स्फुरतु नो हृदयकन्दरे शचीनन्दनः ॥ ३१॥ विसर्जति नरान्भवान्करुणया प्रपाल्य क्षितौ निवेदयितुमुद्भवः
    परात्परं स्वकीयं पदम् । कलौ दितिजसम्भवाधिव्यथाब्धिसुरमग्नगान् समुद्धर महाप्रभो कृष्णचैतन्य शचीसुत
    ॥ ३२॥ माधुर्यैर्मधुभिस्सुगन्धवदनः स्वर्णाम्बुजानां वनं कारुण्यामृतनिर्झरैरुपचितः सत्प्रेमहेमाचलः ।
    भक्ताम्भोधरधारिणी विजयिनी निष्कम्पसप्तावली देवो नः कुलदैवतं विजयते चैतन्यकृष्णो हरिः ॥ ३३॥ देवारातिजनैरधर्मजनितैस्सपीडितेयं
    मही सङ्कुच्याशु कलौ कलेवरमिदं बीजाय हा वर्तते । त्वन्नाम्नैव सुरारयो विदलिताः पातालगाः पीडिता म्लेच्छा
    धर्मपराः सुरेशनमनास्तस्मै नमो व्यापिने ॥ ३४॥ इति भविष्यपुराणे प्रतिसर्गपर्वणि चतुर्थखण्डे दशमाध्यायान्तर्गं
    देवैः कृतं श्रीकृष्णचैतन्यस्तोत्रं समाप्तम् । भविष्यपुराण । प्रतिसर्गपर्व । चतुर्थखण्ड । अध्याय १०
