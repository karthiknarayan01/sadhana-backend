id: yogeshvarikavacam
category: kavacha
name:
  english: yogeshvarikavacam
  devanagari: योगेश्वरीकवचम्
content:
  english: khadgapatram ca musalam langalam ca bibharti sa | akhyata raktacamunda devi yogeshvari tatha
    || iti dhyatva pancopacaraih sampujya kavacam pathet | atha kavacam | shiro me shankari patu murdhni
    narayani tatha | aim bija bhaladeshetu hrim bijam dakshanetrake || 1|| shrim bijam vamanetre ca dakshashrotre
    parasmrita | vamashrotre narasimhi nasamulanca khadgini || 2|| nasikam manini patu mukham me'vatu
    cambika | kapolau bhutasamhari cubukam bhramari tatha || 3|| kantham me candika patu hridayam vindhyavasini
    | udare girija patu nabhim meva'tu bhogini || 4|| shumbhini prishthadeshe ca skandhayoh shuladharini
    | hastayoryogini rakshetkambukanthyangulistatha || 5|| katyam ca sundari rakshedguhyam guhyeshvari
    tatha | kubjika patu me medhram patu desheca shambhavi || 6|| bhadrakali patu corvo janvorme'vatu
    kalika | janghe patu mahabhima gulphayorvatushulini || 7|| padayoh shridhari rakshetsarvange yogini
    vatu | raktamajjavasamamsanyasthimedamsi bhairavi || 8|| camunda caiva varahi kaumari vaishnavi tatha
    | maheshvari ca sarvadya jayashrirmangala tatha || 9|| rakshantu svayudhairdikshu mam vidikshu yatha
    tatha | itidam kavacam divyam pathanatsarvasiddhidam || 10|| smaranatkavacasyasya jayah sarvatra jayate
    | rajadvare smashane ca bhutapretabhicarake || 11|| bandhane ca mahaduhkhe japecchatrusamagame | prayogancabhicaram
    ca yo narah kartumicchati || 12|| ayutacca bhavetsiddhih pathanatkavacasya tu | sarvatra labhate kirtih
    shrimanbhavati dharmikah || 13|| bhurjapatre likhitva tu kavacam yastu dharayet | mantrasiddhimavapnoti
    yogeshvaryah prasadatah || 14|| putravandhanavanchrimannanavidyanidhirbhavet | brahmastradini shastrani
    nashyanti pathanacca vai || 15|| idam kavacamajnatva yoginim labhate na ca | shatalakshaprajaptvapi
    tasya vidya na siddhyati || 16|| iti shrirudrayamale bahurupashtakaprastave ishvaraparvatisamvade
    yogeshvarikavacam sampurnam || atha mula mantrah
  devanagari: खड्गपात्रं च मुसलं लाङ्गलं च बिभर्ति सा । आख्याता रक्तचामुण्डा देवी योगेश्वरी तथा ॥ इति
    ध्यात्वा पञ्चोपचारैः सम्पूज्य कवचं पठेत् । अथ कवचम् । शिरो मे शाङ्करी पातु मूर्ध्नि नारायणी तथा ।
    ऐं बीजा भालदेशेतु ह्रीं बीजं दक्षनेत्रके ॥ १॥ श्रीं बीजं वामनेत्रे च दक्षश्रोत्रे परास्मृता । वामश्रोत्रे
    नारसिंही नासामूलञ्च खड्गिनी ॥ २॥ नासिकां मानिनी पातु मुखं मेऽवतु चाम्बिका । कपोलौ भूतसंहारी चुबुकं
    भ्रामरी तथा ॥ ३॥ कण्ठं मे चण्डिका पातु हृदयं विन्ध्यवासिनी । उदरे गिरिजा पातु नाभिं मेवऽतु भोगिनी
    ॥ ४॥ शुम्भिनी पृष्ठदेशे च स्कन्धयोः शूलधारिणी । हस्तयोर्योगिनी रक्षेत्कम्बुकण्ठ्यङ्गुलीस्तथा ॥ ५॥
    कट्यां च सुन्दरी रक्षेद्गुह्यं गुह्येश्वरी तथा । कुब्जिका पातु मे मेढ्रं पातु देशेच शाम्भवी ॥ ६॥ भद्रकाली
    पातु चोर्वो जान्वोर्मेऽवतु कालिका । जङ्घे पातु महाभीमा गुल्फयोर्वतुशूलिनी ॥ ७॥ पादयोः श्रीधरी रक्षेत्सर्वाङ्गे
    योगिनी वतु । रक्तमज्जावसामांसान्यस्थिमेदांसि भैरवी ॥ ८॥ चामुण्डा चैव वाराही कौमारी वैष्णवी तथा । माहेश्वरी
    च सर्वाद्या जयश्रीर्मङ्गला तथा ॥ ९॥ रक्षन्तु स्वायुधैर्दिक्षु मां विदिक्षु यथा तथा । इतीदं कवचं दिव्यं
    पठनात्सर्वसिद्धिदम् ॥ १०॥ स्मरणात्कवचस्यास्य जयः सर्वत्र जायते । राजद्वारे स्मशाने च भूतप्रेताभिचारके
    ॥ ११॥ बन्धने च महादुःखे जपेच्छत्रुसमागमे । प्रयोगञ्चाभिचारं च यो नरः कर्तुमिच्छति ॥ १२॥ अयुताच्च भवेत्सिद्धिः
    पठनात्कवचस्य तु । सर्वत्र लभते कीर्तिः श्रीमान्भवति धार्मिकः ॥ १३॥ भूर्जपत्रे लिखित्वा तु कवचं यस्तु
    धारयेत् । मन्त्रसिद्धिमवाप्नोती योगेश्वर्याः प्रसादतः ॥ १४॥ पुत्रवान्धनवान्छ्रीमान्नानाविद्यानिधिर्भवेत्
    । ब्रह्मास्त्रादीनि शस्त्राणि नश्यन्ति पठनाच्च वै ॥ १५॥ इदं कवचमज्ञात्वा योगिनीं लभते न च । शतलक्षप्रजप्त्वापि
    तस्य विद्या न सिद्ध्यति ॥ १६॥ इति श्रीरुद्रयामले बहुरूपाष्टकप्रस्तावे ईश्वरपार्वतीसंवादे योगेश्वरीकवचं
    सम्पूर्णम् ॥ अथ मूल मन्त्रः
