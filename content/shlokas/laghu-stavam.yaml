id: laghu-stavam
category: stotram
name:
  english: Laghu Stavam
content:
  english: aindrasyeva sharasanasya dadhati madhyelalatam prabham shauklim kantimanushnagoriva shirasyatanvati
    sarvatah | eshasau tripura hridi dyutirivoshnamshoh sadahah sthitat chindyannah sahasa padaistribhiragham
    jyotirmayi vanmayi || || ya matra trapusilatatanulasattantutthitispardhini vagbije prathame sthita
    tava sada tam manmahe te vayam | shaktih kundaliniti vishvajananavyaparabaddhodyamah jnatvettham na
    punah sprishanti jananigarbhe'rbhakatvam narah || || drishtva sambhramakari vastu sahasa ai ai iti
    vyahritam yenakutavashadapiha varade bindum vinapyaksharam | tasyapi dhruvameva devi tarasa jate tavanugrahe
    vacahsuktisudharasadravamuco niryanti vaktrambujat || || yannitye tava kamarajamaparam mantraksharam
    nishkalam tatsarasvatamityavaiti viralah kashcidbudhashcedbhuvi | akhyanam pratiparva satyatapaso
    yatkirtayanto dvijah prarambhe pranavaspadapranayitam nitvoccaranti sphutam || || yatsadyo vacasam
    pravrittikarane drishtaprabhavam budhaih tartiyam tadaham namami manasa tvadbijaminduprabham | astyaurvo'pi
    sarasvatimanugato jadyambuvicchittaye goshabdo giri vartate saniyatam yogam vina siddhidah || || ekaikam
    tava devi bijamanagham savyanjanavyanjanam kutastham yadi va prithak kramagatam yadva sthitam vyutkramat
    | yam yam kamamapekshya yena vidhina kenapi va cintitam japtam va saphalikaroti satatam tam tam samastam
    nrinam || || vame pustakadharinimabhayadam sakshasrajam dakshine bhaktebhyo varadanapeshalakaram karpurakundojjvalam
    | ujjrimbhambujapatrakantinayanasnigdhaprabhalokinim ye tvamamba na shilayanti manasa tesham kavitvam
    kutah || || ye tvam pandurapundarikapatalaspashtabhiramaprabham sincantimamritadravairiva shiro dhyayanti
    murdhni sthitam | ashranta vikatasphutaksharapada niryati vaktrambujat tesham bharati bharati surasaritkallolalolormivat
    || || ye sinduraparagapinjapihitam tvattejasadyamimam urvim capi vilinayavakarasaprastaramagnamiva
    | pashyanti kshanamapyananyamanasasteshamanangajvara klantasrastakurangashabakadrisho vashya bhavanti
    sphutam || || cancatkancanakundalangadadharamabaddhakancisrajam ye tvam cetasi tadgate kshanamapi
    dhyayanti kritva sthiram | tesham veshmasu vibhramadaharahah spharibhavantyashciram madyatkunjarakarnatalataralah
    sthairyam bhajante shriyah || || arbhatya shashikhandamanditajatajutam nrimundasrajam bandhukaprasavarunambaradharam
    pretasanadhyasinim | tvam dhyayanti caturbhujam trinayanamapinatungastanim madhye nimnavalitrayankitatanum
    tvadrupasamvittaye || || jato'pyalpaparicchade kshitibhujam samanyamatre kule nihsheshavanicakravartipadavim
    labdhva prataponnatah | yadvidyadhara brindavanditapadah shrivatsarajo'bhavat devi tvaccaranambuja
    pranatijah so'yam prasadodayah || || candi tvaccaranambujarcanakrite bilvadilollunthana trutyatkantakakotibhih
    paricayam yesham na jagmuh karah | te dandankushacakracapakulishashrivatsamatsyankitaih jayante prithivibhujah
    kathamivambhojaprabhaih panibhih || || viprah kshonibhujo vishastaditare kshirajyamadhvasavaih | tvam
    devi tripure paraparamayim santarpya pujavidhau | yam yam prarthayate manah sthiradhiyam tesham ta
    eva dhruvam tam tam siddhimavapnuvanti tarasa vighnairavighnikritah || || shabdanam janani tvamatra
    bhuvane vagvadinityucyase tvattah keshavavasava prabhritayo'pyavirbhavanti sphutam | liyante khalu
    yatra kalpavirame brahmadayaste'pyami sa tvam kacidacintyarupamahima shaktih para giyase || || devanam
    tritayam trayi hutabhujam shaktitrayam trih svarah trailokyam tripadi tripushkaramatho tribrahma varnastrayah
    | yatkincijjagati tridha niyamitam vastu trivargadikam tatsarvam tripureti nama bhagavatyanveti te
    tattvatah || || lakshmim rajakule jayam ranabhuvi kshemankarimadhvani kravyadadvipasarpabhaji shabarim
    kantaradurge girau | bhutapretapishacajambukabhaye smritva mahabhairavim vyamohe tripuram taranti
    vipadastaram ca toyaplave || || maya kundalini kriya madhumati kali kalamalini matangi vijaya jaya
    bhagavati devi shiva shambhavi | shaktih shankaravallabha trinayana vagvadini bhairavi hrinkari tripura
    paraparamayi mata kumarityasi || || aipallavitaih parasparayutairdvitrikramadyaksharai kadyaih kshantagataih
    svaradibhiratha kshantaishca taih sasvaraih | namani tripure bhavanti khalu yanyatyantaguhyani te
    tebhyo bhairavapatni vimshatisahasrebhyah parebhyo namah || || boddhavya nipunam budhaih stutiriyam
    kritva manastadgatam bharatyastripuretyananyamanasa yatradyavritte sphutam | ekadvitripadakramena
    kathitastatpadasankhyaksharaih mantroddhara vidhirvisheshasahitah satsampradayanvitah || || savadyam
    niravadyamastu yadi va kim vanaya cintaya nunam stotramidam pathishyati jano yasyasti bhaktistvayi
    | sancintyapi laghutvamatmani dridham sanjayamanam hathat tvadbhaktya mukharikritena racitam yasmanmayapi
    dhrivam || || iti shrikalidasa viracita pancastavyam prathamah laghustavah |
  devanagari: ऐन्द्रस्येव शरासनस्य दधती मध्येललाटं प्रभां शौक्लीं कान्तिमनुष्णगोरिव शिरस्यातन्वती सर्वतः
    । एषासौ त्रिपुरा हृदि द्युतिरिवोष्णांशोः सदाहः स्थितात् छिन्द्यान्नः सहसा पदैस्त्रिभिरघं ज्योतिर्मयी
    वाङ्मयी ॥ ॥ या मात्रा त्रपुसीलतातनुलसत्तन्तूत्थितिस्पर्धिनी वाग्बीजे प्रथमे स्थिता तव सदा तां मन्महे
    ते वयम् । शक्तिः कुण्डलिनीति विश्वजननव्यापारबद्धोद्यमाः ज्ञात्वेत्थं न पुनः स्पृशन्ति जननीगर्भेऽर्भकत्वं
    नराः ॥ ॥ दृष्ट्वा सम्भ्रमकारि वस्तु सहसा ऐ ऐ इति व्याहृतं येनाकूतवशादपीह वरदे बिन्दुं विनाप्यक्षरम्
    । तस्यापि ध्रुवमेव देवि तरसा जाते तवानुग्रहे वाचःसूक्तिसुधारसद्रवमुचो निर्यान्ति वक्त्राम्बुजात् ॥
    ॥ यन्नित्ये तव कामराजमपरं मन्त्राक्षरं निष्कलं तत्सारस्वतमित्यवैति विरलः कश्चिद्बुधश्चेद्भुवि । आख्यानं
    प्रतिपर्व सत्यतपसो यत्कीर्तयन्तो द्विजाः प्रारम्भे प्रणवास्पदप्रणयितां नीत्वोच्चरन्ति स्फुटम् ॥ ॥
    यत्सद्यो वचसां प्रवृत्तिकरणे दृष्टप्रभावं बुधैः तार्तीयं तदहं नमामि मनसा त्वद्बीजमिन्दुप्रभम् । अस्त्यौर्वोऽपि
    सरस्वतीमनुगतो जाड्याम्बुविच्छित्तये गोशब्दो गिरि वर्तते सनियतं योगं विना सिद्धिदः ॥ ॥ एकैकं तव देवि
    बीजमनघं सव्यञ्जनाव्यञ्जनं कूटस्थं यदि वा पृथक् क्रमगतं यद्वा स्थितं व्युत्क्रमात् । यं यं काममपेक्ष्य
    येन विधिना केनापि वा चिन्तितं जप्तं वा सफलीकरोति सततं तं तं समस्तं नृणाम् ॥ ॥ वामे पुस्तकधारिणीमभयदां
    साक्षस्रजं दक्षिणे भक्तेभ्यो वरदानपेशलकरां कर्पूरकुन्दोज्ज्वलाम् । उज्जृम्भाम्बुजपत्रकान्तिनयनस्निग्धप्रभालोकिनीं
    ये त्वामम्ब न शीलयन्ति मनसा तेषां कवित्वं कुतः ॥ ॥ ये त्वां पाण्डुरपुण्डरीकपटलस्पष्टाभिरामप्रभां सिञ्चन्तीममृतद्रवैरिव
    शिरो ध्यायन्ति मूर्ध्नि स्थिताम् । अश्रान्ता विकटस्फुटाक्षरपदा निर्याति वक्त्राम्बुजात् तेषां भारति
    भारती सुरसरित्कल्लोललोलोर्मिवत् ॥ ॥ ये सिन्दूरपरागपिञ्जपिहितां त्वत्तेजसाद्यामिमां उर्वीं चापि विलीनयावकरसप्रस्तारमग्नामिव
    । पश्यन्ति क्षणमप्यनन्यमनसस्तेषामनङ्गज्वर क्लान्तस्रस्तकुरङ्गशाबकदृशो वश्या भवन्ति स्फुटम् ॥ ॥ चञ्चत्काञ्चनकुण्डलाङ्गदधरामाबद्धकाञ्चीस्रजं
    ये त्वां चेतसि तद्गते क्षणमपि ध्यायन्ति कृत्वा स्थिराम् । तेषां वेश्मसु विभ्रमादहरहः स्फारीभवन्त्यश्चिरं
    माद्यत्कुञ्जरकर्णतालतरलाः स्थैर्यं भजन्ते श्रियः ॥ ॥ आर्भट्या शशिखण्डमण्डितजटाजूटां नृमुण्डस्रजं बन्धूकप्रसवारुणाम्बरधरां
    प्रेतासनाध्यासिनीम् । त्वां ध्यायन्ति चतुर्भुजां त्रिनयनामापीनतुङ्गस्तनीं मध्ये निम्नवलित्रयाङ्किततनुं
    त्वद्रूपसंवित्तये ॥ ॥ जातोऽप्यल्पपरिच्छदे क्षितिभुजां सामान्यमात्रे कुले निःशेषावनिचक्रवर्तिपदवीं
    लब्ध्वा प्रतापोन्नतः । यद्विद्याधर बृन्दवन्दितपदः श्रीवत्सराजोऽभवत् देवि त्वच्चरणाम्बुज प्रणतिजः सोऽयं
    प्रसादोदयः ॥ ॥ चण्डि त्वच्चरणाम्बुजार्चनकृते बिल्वादिलोल्लुण्ठन त्रुट्यत्कण्टककोटिभिः परिचयं येषां
    न जग्मुः कराः । ते दण्डाङ्कुशचक्रचापकुलिशश्रीवत्समत्स्याङ्कितैः जायन्ते पृथिवीभुजः कथमिवाम्भोजप्रभैः
    पाणिभिः ॥ ॥ विप्राः क्षोणिभुजो विशस्तदितरे क्षीराज्यमध्वासवैः । त्वां देवि त्रिपुरे परापरमयीं सन्तर्प्य
    पूजाविधौ । यां यां प्रार्थयते मनः स्थिरधियां तेषां त एव ध्रुवं तां तां सिद्धिमवाप्नुवन्ति तरसा विघ्नैरविघ्नीकृताः
    ॥ ॥ शब्दानां जननी त्वमत्र भुवने वाग्वादिनीत्युच्यसे त्वत्तः केशववासव प्रभृतयोऽप्याविर्भवन्ति स्फुटम्
    । लीयन्ते खलु यत्र कल्पविरमे ब्रह्मादयस्तेऽप्यमी सा त्वं काचिदचिन्त्यरूपमहिमा शक्तिः परा गीयसे ॥ ॥
    देवानां त्रितयं त्रयी हुतभुजां शक्तित्रयं त्रिः स्वराः त्रैलोक्यं त्रिपदी त्रिपुष्करमथो त्रिब्रह्म
    वर्णास्त्रयः । यत्किञ्चिज्जगति त्रिधा नियमितं वस्तु त्रिवर्गादिकं तत्सर्वं त्रिपुरेति नाम भगवत्यन्वेति
    ते तत्त्वतः ॥ ॥ लक्ष्मीं राजकुले जयां रणभुवि क्षेमङ्करीमध्वनि क्रव्यादद्विपसर्पभाजि शबरीं कान्तारदुर्गे
    गिरौ । भूतप्रेतपिशाचजम्बुकभये स्मृत्वा महाभैरवीं व्यामोहे त्रिपुरां तरन्ति विपदस्तारां च तोयप्लवे
    ॥ ॥ माया कुण्डलिनी क्रिया मधुमती काली कलामालिनी मातङ्गी विजया जया भगवती देवी शिवा शाम्भवी । शक्तिः
    शङ्करवल्लभा त्रिनयना वाग्वादिनी भैरवी ह्रीङ्कारी त्रिपुरा परापरमयी माता कुमारीत्यसि ॥ ॥ आईपल्लवितैः
    परस्परयुतैर्द्वित्रिक्रमाद्यक्षरै काद्यैः क्षान्तगतैः स्वरादिभिरथ क्षान्तैश्च तैः सस्वरैः । नामानि
    त्रिपुरे भवन्ति खलु यान्यत्यन्तगुह्यानि ते तेभ्यो भैरवपत्नि विंशतिसहस्रेभ्यः परेभ्यो नमः ॥ ॥ बोद्धव्या
    निपुणं बुधैः स्तुतिरियं कृत्वा मनस्तद्गतं भारत्यास्त्रिपुरेत्यनन्यमनसा यत्राद्यवृत्ते स्फुटम् । एकद्वित्रिपदक्रमेण
    कथितस्तत्पादसङ्ख्याक्षरैः मन्त्रोद्धार विधिर्विशेषसहितः सत्सम्प्रदायान्वितः ॥ ॥ सावद्यं निरवद्यमस्तु
    यदि वा किं वानया चिन्तया नूनं स्तोत्रमिदं पठिष्यति जनो यस्यास्ति भक्तिस्त्वयि । सञ्चिन्त्यापि लघुत्वमात्मनि
    दृढं सञ्जायमानं हठात् त्वद्भक्त्या मुखरीकृतेन रचितं यस्मान्मयापि धृवम् ॥ ॥ इति श्रीकालिदास विरचित
    पञ्चस्तव्यां प्रथमः लघुस्तवः ।
