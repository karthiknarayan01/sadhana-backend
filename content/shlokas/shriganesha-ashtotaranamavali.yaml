id: shriganesha-ashtotaranamavali
category: stotram
name:
  english: shriganesha-ashtotaranamavali
  devanagari: श्रीगणेश-अष्टोतरनामावली
content:
  english: om akalmashaya namah | om agnigarbhaccide namah | om agranye namah | om ajaya namah | om adbhutamurtimate
    namah | om adhyakkshaya namah | om anekacitaya namah | om avyaktamurtaye namah | om avyayaya namah
    | om avyayaya namah | om ashritaya namah | om indrashripradaya namah | om ikshucapadhrite namah |
    om utpalakaraya namah | om ekadantaya namah | om kalikalmashanashanaya namah | om kantaya namah |
    om kamine namah | om kalaya namah | om kuladribhettre namah | om kritine namah | om kaivalyashukhadaya
    namah | om gajananaya namah | om ganeshvaraya namah | om gatine namah | om gunatitaya namah | om gauriputraya
    namah | om grahapataye namah | om cakrine namah | om candaya namah | om caturaya namah | om caturbahave
    namah | om caturmurtine namah | om candracudamanye namah | om jatilaya namah | om tushtaya namah |
    om dayayutaya namah | om dakshaya namah | om dantaya namah | om durvabilvapriyaya namah | om devaya
    namah | om dvijapriyaya namah | om dvaimatreeyaya namah | om dhiraya namah | om nagarajayajnopavitavate
    namah | om niranjanaya namah | om parasmai namah | om papaharine namah | om pashamkushadharaya namah
    | om putaya namah | om pramattadaityabhayataya namah | om prasannatmane namah | om bijapuraphalasaktaya
    namah | om buddhipriyaya namah | om brahmacarine namah | om brahmadveshavivarjitaya namah | om brahmaviduttamaya
    namah | om bhaktavanchitadayakaya namah | om bhaktavighnavinashanaya namah | om bhaktipriyaya namah
    | om mayine namah | om munistutyaya namah | om mushikavahanaya namah | om ramarcitaya namah | om lambodaraya
    namah | om varadaya namah | om vagishaya namah | om vanipradaya namah | om vighnarajaya namah | om
    vidhaye namah | om vinayakaya namah | om vibhudeshvaraya namah | om vitabhayaya namah | om shaktisamyutaya
    namah | om shantaya namah | om shashvataya namah | om shivaya namah | om shuddhaya namah | om shurpakarnaya
    namah | om shailendratanujotsangakelanotsukamanasaya namah | om shrikanthaya namah | om shrikaraya
    namah | om shridaya namah | om shriprataye namah | om saccidanandavigrahaya namah | om samastajagadadharaya
    namah | om samahitaya namah | om sarvatanayaya namah | om sarvaripriyaya namah | om sarvasiddhipradaya
    namah | om sarvasiddhipradayakaya namah | om sarvatmakaya namah | om samaghoshapriyaya namah | om
    siddharcitapadambujaya namah | om siddhidayakaya namah | om srishtikartre namah | om somasuryagnilocanaya
    namah | om saumyaya namah | om skandagrajaya namah | om stutiharshitaya namah | om sthulakanthaya
    namah | om sthulatundaya namah | om svayamkartre namah | om svayamsiddhaya namah | om svalavanyasutasarajitamanmathavigrahaya
    namah | om haraye namah | om hrishthaya namah | om jnanine namah | ||iti shri vinayaka ashtottarashata
    namavali sampurnam ||
  devanagari: ॐ अकल्मषाय नमः । ॐ अग्निगर्भच्चिदे नमः । ॐ अग्रण्ये नमः । ॐ अजाय नमः । ॐ अद्भुतमूर्तिमते
