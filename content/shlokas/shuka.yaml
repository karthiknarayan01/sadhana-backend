id: shuka
category: upanishad
name:
  english: shuka
  devanagari: शुक
content:
  english: shukarahasyopanishat prajnanadimahavakyarahasyadikalevaram | vikalevarakaivalyam tripadramamaham
    bhaje || om saha navavatu || saha nau bhunaktu || saha viryam karavavahai || tejasvinavadhitamastu
    ma vidvishavahai || om shantih shantih shantih || athato rahasyopanishadam vyakhyasyamo devarshayo
    brahmanam sampujya pranipatya papracchurbhagavannasmakam rahasyopanishadam bruhiti | so'bravit | pura
    vyaso mahatejah sarvavedataponidhih | pranipatya shivam sambam kritanjaliruvaca ha || 1|| shrivedavyasa
    uvaca | devadeva mahaprajna pashacchedadridhavrata | shukasya mama putrasya vedasamskarakarmani ||
    2|| brahmopadeshakalo'yamidanim samupasthitah | brahmopadeshah kartavyo bhavatadya jagadguro || 3||
    ishvara uvaca | mayopadishte kaivalye sakshadbrahmani shashvate | vihaya putro nirvedatprakasham yasyati
    svayam || 4|| shrivedavyasa uvaca | yatha tatha va bhavatu hyupanayanakarmani | upadishte mama sute
    brahmani tvatprasadatah || 5|| sarvajno bhavatu kshipram mama putro maheshvara | tava prasadasampanno
    labhenmuktim caturvidham || 6|| tacchritva vyasavacanam sarvadevarshisamsadi | upadeshtum sthitah
    shambhuh sambo divyasane muda || 7|| kritakrityah shukastatra samagatya subhaktiman | tasmatsa pranavam
    labdhva punarityabravicchivam || 8|| shrishuka uvaca | devadideva sarvajna saccidananda lakshana |
    umaramana bhutesha prasida karunanidhe || 9|| upadishtam parabrahma pranavantargatam param | tattvamasyadivakyanam
    prajnadinam visheshatah || 10|| shrotumicchami tattvena shadangani yathakramam | vaktavyani rahasyani
    kripayadya sadashiva || 11|| shrisadashiva uvaca | sadhu sadhu mahaprajna shuka jnananidhe mune |
    prashtavyam tu tvaya prishtam rahasyam vedagarbhitam || 12|| rahasyopanishannamna sashadangamihocyate
    | yasya vijnanamatrena mokshah sakshanna samshayah || 13|| angahinani vakyani gururnopadishetpunah
    | sashadanganyupadishenmahavakyani kritsnashah || 14|| caturnamapi vedanam yathopanishadah shirah
    | iyam rahasyopanishattathopanishadam shirah || 15|| rahasyopanishadbrahma dhyatam yena vipashcita
    | tirthairmantraih shrutairjapyaistasya kim punyahetubhih || 16|| vakyarthasya vicarena yadapnoti
    sharacchatam | ekavarajapenaiva rishyadidhyanatashca yat || 17|| om asya shrimahavakyamahamantrasya
    hamsa rishih | avyaktagayatri chandah | paramahamso devata | ham bijam | sah shaktih | so'ham kilakam
    | mama paramahamsaprityarthe mahavakyajape viniyogah | satyam jnanamanantam brahma angushthabhyam
    namah | nityanando brahma tarjanibhyam svaha | nityanandamayam brahma madhyamabhyam vashat | yo vai
    bhuma anamikabhyam hum | yo vai bhumadipatih kanishthikabhyam vaushat | ekamevadvitiyam brahma karatalakaraprishthabhyam
    phat || satyam jnanamanantam brahma hridayaya namah | nityanando brahma shirase svaha | nityanandamayam
    brahma shikhayai vashat | yo vai bhuma kavacaya hum | yo vai bhumadhipatih netratrayaya vaushat |
    ekamevadvitiyam brahma astraya phat | bhurbhuvahsuvaromiti digbandhah | dhyanam | nityanandam paramasukhadam
    kevalam jnanamurtim vishvatitam gaganasadrisham tattvamasyadilakshyam || ekam nityam vimalamacalam
    sarvadhisakshibhutam bhavatitam trigunarahitam sadgurum tam namami || 1|| atha mahavakyani catvari
    | yatha | om prajnanam brahma || 1|| om aham brahmasmi || 2|| om tattvamasi || 3|| om ayamatma brahma
    || 4|| tattvamasityabhedavacakamidam ye japanti te shivassayujyamuktibhajo bhavanti || tatpadamahamantrasya
    | paramahamsah rishih | avyaktagayatri chandah | paramahamso devata | ham bijam | sah shaktih | so'ham
    kilakam | mama sayujyamuktyarthe jape viniyogah | tatpurushaya angushthabhyam namah | ishanaya tarjanibhyam
    svaha | aghoraya madhyamabhyam vashat sadyojataya anamikabhyam hum | vamadevaya kanishthikabhyam vaushat
    | tatpurusheshanaghorasadyojatavamadevebhyo namah karatalakaraprishthabhyam phat | evam hridayadinyasah
    | bhurbhuvahsuvaromiti digbandhah || dhyanam | jnanam jneyam jnanagamyadititam shuddham buddham muktamapyavyayam
    ca | satyam jnanam saccidanandarupam dhyayedevam tanmahobhrajamanam || tvampada mahamantrasya vishnurrishih
    | gayatri chandah | paramatma devata | aim bijam | klim shaktih | sauh kilakam | mama muktyarthe jape
    viniyogah | vasudevaya angushthabhyam namah | sankarshanaya tarjanibhyam svaha | pradyumnaya madhyamabhyam
    vashat | aniruddhaya anamikabhyam hum | vasudevaya kanishthikabhyam vaushat | vasudevasankarshanapradyumnaniruddhebhyah
    karatalakaraprishthabhyam phat | evam hridayadinyasah | bhurbhuvahsuvaromiti digbandhah || dhyanam
    || jivatvam sarvabhutanam sarvatrakhandavigraham | cittahankarayantaram jivakhyam tvampadam bhaje
    | asipadamahamantrasya mana rishih | gayatri chandah | ardhanarishvaro devata | avyaktadirbijam |
    nrisimhah shaktih | paramatma kilakam | jivabrahmaikyarthe jape viniyogah | prithvidvyanukaya angushthabhyam
    namah | abdvyanukaya tarjanibhyam svaha | tejodvyanukaya madhyamabhyam vashat | vayudvyanukaya anamikabhyam
    hum | akashadvyanukaya kanishthikabhyam vaushat | prithivyaptejovayvakashadvyanukebhyah karatalakaraprishthabhyam
    phat | bhurbhuvahsuvaromiti digbandhah || dhyanam || jivo brahmeti vakyartham yavadasti manahsthitih
    | aikyam tattvam laye kurvandhyayedasipadam sada || evam mahavakyashadanganyuktani || atha rahasyopanishadvibhagasho
    vakyarthashlokah procyante || yenekshate sha
  devanagari: शुकरहस्योपनिषत् प्रज्ञानादिमहावाक्यरहस्यादिकलेवरम् । विकलेवरकैवल्यं त्रिपाद्राममहं भजे ॥
    ॐ सह नाववतु ॥ सह नौ भुनक्तु ॥ सह वीर्यं करवावहै ॥ तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः
    शान्तिः ॥ अथातो रहस्योपनिषदं व्याख्यास्यामो देवर्षयो ब्रह्माणं सम्पूज्य प्रणिपत्य पप्रच्छुर्भगवन्नस्माकं
    रहस्योपनिषदं ब्रूहीति । सोऽब्रवीत् । पुरा व्यासो महातेजाः सर्ववेदतपोनिधिः । प्रणिपत्य शिवं साम्बं
    कृताञ्जलिरुवाच ह ॥ १॥ श्रीवेदव्यास उवाच । देवदेव महाप्राज्ञ पाशच्छेददृढव्रत । शुकस्य मम पुत्रस्य वेदसंस्कारकर्मणि
    ॥ २॥ ब्रह्मोपदेशकालोऽयमिदानीं समुपस्थितः । ब्रह्मोपदेशः कर्तव्यो भवताद्य जगद्गुरो ॥ ३॥ ईश्वर उवाच
    । मयोपदिष्टे कैवल्ये साक्षाद्ब्रह्मणि शाश्वते । विहाय पुत्रो निर्वेदात्प्रकाशं यास्यति स्वयम् ॥ ४॥
    श्रीवेदव्यास उवाच । यथा तथा वा भवतु ह्युपनायनकर्मणि । उपदिष्टे मम सुते ब्रह्मणि त्वत्प्रसादतः ॥ ५॥
    सर्वज्ञो भवतु क्षिप्रं मम पुत्रो महेश्वर । तव प्रसादसम्पन्नो लभेन्मुक्तिं चतुर्विधाम् ॥ ६॥ तच्छृत्वा
    व्यासवचनं सर्वदेवर्षिसंसदि । उपदेष्टुं स्थितः शम्भुः साम्बो दिव्यासने मुदा ॥ ७॥ कृतकृत्यः शुकस्तत्र
    समागत्य सुभक्तिमान् । तस्मात्स प्रणवं लब्ध्वा पुनरित्यब्रवीच्छिवम् ॥ ८॥ श्रीशुक उवाच । देवादिदेव सर्वज्ञ
    सच्चिदानन्द लक्षण । उमारमण भूतेश प्रसीद करुणानिधे ॥ ९॥ उपदिष्टं परब्रह्म प्रणवान्तर्गतं परम् । तत्त्वमस्यादिवाक्यानां
    प्रज्ञादीनां विशेषतः ॥ १०॥ श्रोतुमिच्छामि तत्त्वेन षडङ्गानि यथाक्रमम् । वक्तव्यानि रहस्यानि कृपयाद्य
    सदाशिव ॥ ११॥ श्रीसदाशिव उवाच । साधु साधु महाप्राज्ञ शुक ज्ञाननिधे मुने । प्रष्टव्यं तु त्वया पृष्टं
    रहस्यं वेदगर्भितम् ॥ १२॥ रहस्योपनिषन्नाम्ना सषडङ्गमिहोच्यते । यस्य विज्ञानमात्रेण मोक्षः साक्षान्न
    संशयः ॥ १३॥ अङ्गहीनानि वाक्यानि गुरुर्नोपदिशेत्पुनः । सषडङ्गान्युपदिशेन्महावाक्यानि कृत्स्नशः ॥ १४॥
    चतुर्णामपि वेदानां यथोपनिषदः शिरः । इयं रहस्योपनिषत्तथोपनिषदां शिरः ॥ १५॥ रहस्योपनिषद्ब्रह्म ध्यातं
    येन विपश्चिता । तीर्थैर्मन्त्रैः श्रुतैर्जप्यैस्तस्य किं पुण्यहेतुभिः ॥ १६॥ वाक्यार्थस्य विचारेण यदाप्नोति
    शरच्छतम् । एकवारजपेनैव ऋष्यादिध्यानतश्च यत् ॥ १७॥ ॐ अस्य श्रीमहावाक्यमहामन्त्रस्य हंस ऋषिः । अव्यक्तगायत्री
    छन्दः । परमहंसो देवता । हं बीजम् । सः शक्तिः । सोऽहं कीलकम् । मम परमहंसप्रीत्यर्थे महावाक्यजपे विनियोगः
    । सत्यं ज्ञानमनन्तं ब्रह्म अङ्गुष्ठाभ्यां नमः । नित्यानन्दो ब्रह्म तर्जनीभ्यां स्वाहा । नित्यानन्दमयं
    ब्रह्म मध्यमाभ्यां वषट् । यो वै भूमा अनामिकाभ्यां हुम् । यो वै भूमादिपतिः कनिष्ठिकाभ्यां वौषट् । एकमेवाद्वितीयं
    ब्रह्म करतलकरपृष्ठाभ्यां फट् ॥ सत्यं ज्ञानमनन्तं ब्रह्म हृदयाय नमः । नित्यानन्दो ब्रह्म शिरसे स्वाहा
    । नित्यानन्दमयं ब्रह्म शिखायै वषट् । यो वै भूमा कवचाय हुम् । यो वै भूमाधिपतिः नेत्रत्रयाय वौषट् ।
    एकमेवाद्वितीयं ब्रह्म अस्त्राय फट् । भूर्भुवःसुवरोमिति दिग्बन्धः । ध्यानम् । नित्यानन्दं परमसुखदं
    केवलं ज्ञानमूर्तिं विश्वातीतं गगनसदृशं तत्त्वमस्यादिलक्ष्यम् ॥ एकं नित्यं विमलमचलं सर्वधीसाक्षिभूतं
    भावातीतं त्रिगुणरहितं सद्गुरुं तं नमामि ॥ १॥ अथ महावाक्यानि चत्वारि । यथा । ॐ प्रज्ञानं ब्रह्म ॥ १॥
    ॐ अहं ब्रह्मास्मि ॥ २॥ ॐ तत्त्वमसि ॥ ३॥ ॐ अयमात्मा ब्रह्म ॥ ४॥ तत्त्वमसीत्यभेदवाचकमिदं ये जपन्ति ते
    शिवस्सायुज्यमुक्तिभाजो भवन्ति ॥ तत्पदमहामन्त्रस्य । परमहंसः ऋषिः । अव्यक्तगायत्री छन्दः । परमहंसो
    देवता । हं बीजम् । सः शक्तिः । सोऽहं कीलकम् । मम सायुज्यमुक्त्यर्थे जपे विनियोगः । तत्पुरुषाय अङ्गुष्ठाभ्यां
    नमः । ईशानाय तर्जनीभ्यां स्वाहा । अघोराय मध्यमाभ्यां वषट् सद्योजाताय अनामिकाभ्यां हुम् । वामदेवाय
    कनिष्ठिकाभ्यां वौषट् । तत्पुरुषेशानाघोरसद्योजातवामदेवेभ्यो नमः करतलकरपृष्ठाभ्यां फट् । एवं हृदयादिन्यासः
    । भूर्भुवःसुवरोमिति दिग्बन्धः ॥ ध्यानम् । ज्ञानं ज्ञेयं ज्ञानगम्यादितीतं शुद्धं बुद्धं मुक्तमप्यव्ययं
    च । सत्यं ज्ञानं सच्चिदानन्दरूपं ध्यायेदेवं तन्महोभ्राजमानम् ॥ त्वंपद महामन्त्रस्य विष्णुरृषिः । गायत्री
    छन्दः । परमात्मा देवता । ऐं बीजम् । क्लीं शक्तिः । सौः कीलकम् । मम मुक्त्यर्थे जपे विनियोगः । वासुदेवाय
    अङ्गुष्ठाभ्यां नमः । सङ्कर्षणाय तर्जनीभ्यां स्वाहा । प्रद्युम्नाय मध्यमाभ्यां वषट् । अनिरुद्धाय अनामिकाभ्यां
    हुम् । वासुदेवाय कनिष्ठिकाभ्यां वौषट् । वासुदेवसङ्कर्षणप्रद्युम्नानिरुद्धेभ्यः करतलकरपृष्ठाभ्यां फट्
    । एवं हृदयादिन्यासः । भूर्भुवःसुवरोमिति दिग्बन्धः ॥ ध्यानम् ॥ जीवत्वं सर्वभूतानां सर्वत्राखण्डविग्रहम्
    । चित्ताहङ्कारयन्तारं जीवाख्यं त्वंपदं भजे । असिपदमहामन्त्रस्य मन ऋषिः । गायत्री छन्दः । अर्धनारीश्वरो
    देवता । अव्यक्तादिर्बीजम् । नृसिंहः शक्तिः । परमात्मा कीलकम् । जीवब्रह्मैक्यार्थे जपे विनियोगः । पृथ्वीद्व्यणुकाय
    अङ्गुष्ठाभ्यां नमः । अब्द्व्यणुकाय तर्जनीभ्यां स्वाहा । तेजोद्व्यणुकाय मध्यमाभ्यां वषट् । वायुद्व्यणुकाय
    अनामिकाभ्यं हुम् । आकाशद्व्यणुकाय कनिष्ठिकाभ्यां वौषट् । पृथिव्यप्तेजोवाय्वाकाशद्व्यणुकेभ्यः करतलकरपृष्ठाभ्यां
    फट् । भूर्भुवःसुवरोमिति दिग्बन्धः ॥ ध्यानम् ॥ जीवो ब्रह्मेति वाक्यार्थं यावदस्ति मनःस्थितिः । ऐक्यं
    तत्त्वं लये कुर्वन्ध्यायेदसिपदं सदा ॥ एवं महावाक्यषडङ्गान्युक्तानि ॥ अथ रहस्योपनिषद्विभागशो वाक्यार्थश्लोकाः
    प्रोच्यन्ते ॥ येनेक्षते श
