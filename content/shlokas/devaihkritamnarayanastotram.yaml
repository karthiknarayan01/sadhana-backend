id: devaihkritamnarayanastotram
category: stotram
name:
  english: devaihkritamnarayanastotram
  devanagari: देवैःकृतंनारायणस्तोत्रम्
content:
  english: devaih kritam narayanastotram tato duhkham param prapta udvigna lokapalinah | rishayo munayashcaiva
    brahmana nashtarakshanah || 38|| devashca pitarashcanye ye ye duhkhadashanvitah | te sarve kshiradhestire
    sharanam yayuracyutam || 39|| namah sharanyaya shantasvarupaya namo namah | duhkhavasaya daityamshalakshmisthitaya
    te namah || 40|| rakshakartre yatisanyasarthine haraye namah | parivartanivasaya parivartatmane namah
    || 41|| bahukalam svabhaktaya daityaya sarvabhaumakam | dattavan sampratam daityabhinnebhyo datumarhasi
    || 42|| suradivancchitam capi kripaya datumarhasi | paravartam kuru vishno tvasahyah samayo gatah
    || 43|| iti prarthya surah sarve kshirabdhyuttarabhutale | samadhau susthitashcanye japayajne vyavasthitah
    || 44|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane 136
  devanagari: देवैः कृतं नारायणस्तोत्रम् ततो दुःखं परं प्राप्ता उद्विग्ना लोकपालिनः । ऋषयो मुनयश्चैव ब्राह्मणा
    नष्टरक्षणाः ॥ ३८॥ देवाश्च पितरश्चान्ये ये ये दुःखदशान्विताः । ते सर्वे क्षीरधेस्तीरे शरणं ययुरच्युतम्
    ॥ ३९॥ नमः शरण्याय शान्तस्वरूपाय नमो नमः । दुःखावासाय दैत्यांशलक्ष्मीस्थिताय ते नमः ॥ ४०॥ रक्षाकर्त्रे
    यतिसन्यासार्थिने हरये नमः । परिवर्तनिवासाय परिवर्तात्मने नमः ॥ ४१॥ बहुकालं स्वभक्ताय दैत्याय सार्वभौमकम्
    । दत्तवान् साम्प्रतं दैत्यभिन्नेभ्यो दातुमर्हसि ॥ ४२॥ सुरादिवाञ्च्छितं चापि कृपया दातुमर्हसि । परावर्तं
    कुरु विष्णो त्वसह्यः समयो गतः ॥ ४३॥ इति प्रार्थ्य सुराः सर्वे क्षीराब्ध्युत्तरभूतले । समाधौ सुस्थिताश्चान्ये
    जपयज्ञे व्यवस्थिताः ॥ ४४॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने १३६
