id: ganeshastuti
category: stotram
name:
  english: ganeshastuti
  devanagari: गणेशस्तुति
content:
  english: shriganeshastuti vande gajendravadanam vamankarudhavallabhashlishtam | kunkumaragashonam kuvalayinijarakorakapidam
    || 1|| vighnandhakaramitram shankaraputram sarojadalanetram | sindurarunagatram sindhuravaktram namamyahoratram
    || 2|| galaddanagandam miladbhringashandam calaccarushundam jagattranashaundam | lasaddantakandam
    vipadbhangacandam shivapremapindam bhaje vakratundam || 3|| ganeshvaramupasmahe gajamukham kripasagaram
    surasuranamaskritam suravaram kumaragrajam | supashasrinimodakasphutitadantahastojjvalam shivodbhavamabhishtadam
    shritatatessusiddhipradam || 4|| vighnadhvantanivaranaikataranirvighnatavihavyavat vighnavyalakulapramattagarudo
    vighnebhapancananah | vighnottungagiriprabhedanapavirvighnabdhikumbhodbhavah vighnaghaughaghanapracandapavano
    vighneshvarah patu nah || 5||
  devanagari: श्रीगणेशस्तुती वन्दे गजेन्द्रवदनं वामाङ्कारूढवल्लभाश्लिष्टम् । कुङ्कुमरागशोणं कुवलयिनीजारकोरकापीडम्
    ॥ १॥ विघ्नान्धकारमित्रं शङ्करपुत्रं सरोजदलनेत्रम् । सिन्दूरारुणगात्रं सिन्धुरवक्त्रं नमाम्यहोरात्रम्
    ॥ २॥ गलद्दानगण्डं मिलद्भृङ्गषण्डं चलच्चारुशुण्डं जगत्त्राणशौण्डम् । लसद्दन्तकाण्डं विपद्भङ्गचण्डं
    शिवप्रेमपिण्डं भजे वक्रतुण्डम् ॥ ३॥ गणेश्वरमुपास्महे गजमुखं कृपासागरं सुरासुरनमस्कृतं सुरवरं कुमाराग्रजम्
    । सुपाशसृणिमोदकस्फुटितदन्तहस्तोज्ज्वलं शिवोद्भवमभीष्टदं श्रितततेस्सुसिद्धिप्रदम् ॥ ४॥ विघ्नध्वान्तनिवारणैकतरणिर्विघ्नाटवीहव्यवाट्
    विघ्नव्यालकुलप्रमत्तगरुडो विघ्नेभपञ्चाननः । विघ्नोत्तुङ्गगिरिप्रभेदनपविर्विघ्नाब्धिकुंभोद्भवः विघ्नाघौघघनप्रचण्डपवनो
    विघ्नेश्वरः पातु नः ॥ ५॥
