id: ramakritamramanathastotram
category: stotram
name:
  english: ramakritamramanathastotram
  devanagari: रामकृतंरामनाथस्तोत्रम्
content:
  english: shriramakritam ramanathastotram shrirama uvaca | namo mahatmane tubhyam mahamayaya shuline
    | svapadambujabhaktartiharine sarpaharine || 5|| namo devadhidevaya ramanathaya sakshine | namo vedantavedyaya
    yoginam tattvadayine || 6|| sarvada''nandapurnaya vishvanathaya shambhave | namo bhaktabhayacchedahetupadabjarenave
    || 7|| namaste'khilanathaya namah sakshatparatmane | namaste'dbhutaviryaya mahapatakanashine || 8||
    kalakalaya kalaya kalatitaya te namah | namo'vidyanihantre te namah papaharaya ca || 9|| namah samsarataptanam
    tapanashaikahetave | namo madbrahmahatyavinashine ca vishashine || 1
  devanagari: श्रीरामकृतं रामनाथस्तोत्रम् श्रीराम उवाच । नमो महात्मने तुभ्यं महामायाय शूलिने । स्वपदाम्बुजभक्तार्तिहारिणे
    सर्पहारिणे ॥ ५॥ नमो देवाधिदेवाय रामनाथाय साक्षिणे । नमो वेदान्तवेद्याय योगिनां तत्त्वदायिने ॥ ६॥ सर्वदाऽऽनन्दपूर्णाय
    विश्वनाथाय शम्भवे । नमो भक्तभयच्छेदहेतुपादाब्जरेणवे ॥ ७॥ नमस्तेऽखिलनाथाय नमः साक्षात्परात्मने । नमस्तेऽद्भुतवीर्याय
    महापातकनाशिने ॥ ८॥ कालकालाय कालाय कालातीताय ते नमः । नमोऽविद्यानिहन्त्रे ते नमः पापहराय च ॥ ९॥ नमः
    संसारतप्तानां तापनाशैकहेतवे । नमो मद्ब्रह्महत्याविनाशिने च विषाशिने ॥ १
meaning: {}
