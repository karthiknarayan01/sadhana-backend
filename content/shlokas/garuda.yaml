id: garuda
category: upanishad
name:
  english: garuda
  devanagari: गरुद
content:
  english: sastanubhih || vyashema devahitam yadayuh || svasti na indro vriddhashravah || svasti nah pusha
    vishvavedah || svasti nastarkshyo arishtanemih || svasti no brihaspatirdadhatu || om shantih shantih
    shantih || harih om || garudabrahmavidyam pravakshyami yam brahma vidyam naradaya provaca narado brihatsenaya
    brihatsena indraya indro bharadvajaya bharadvajo jivatkamebhyah shishyebhyah prayacchat | asyah shrimahagarudabrahmavidyaya
    brahma rishih | gayatri chandah | shribhagavanmahagarudo devata | shrimahagarudaprityarthe mama sakalavishavinashanarthe
    jape viniyogah | om namo bhagavate angushthabhyam namah | shri mahagarudaya tarjanibhyam svaha | pakshindraya
    madhyamabhyam vashat | shrivishnuvallabhaya anamikabhyam hum | trailokya paripujitaya kanishthikabhyam
    vaushat | ugrabhayankarakalanalarupaya karatalakaraprishthabhyam phat | evam hridayadinyasah | bhurbhuvah
    suvaromiti digbandhah | dhyanam | svastiko dakshinam padam vamapadam tu kuncitam | pranjalikritadoryugmam
    garudam harivallabham || 1|| ananto vamakatako yajnasutram tu vasukih | takshakah katisutram tu harah
    karkota ucyate || 2|| padmo dakshinakarne tu mahapadmastu vamake | shankhah shirahpradeshe tu gulikastu
    bhujantare || 3|| paundrakalikanagabhyam camarabhyam svijitam | elaputrakanagadyaih sevyamanam mudanvitam
    || 4|| kapilaksham garutmantam suvarnasadrishaprabham | dirghabahum brihatskandham nadabharanabhushitam
    || 5|| ajanutah suvarnabhamakatyostuhinaprabham | kunkumarunamakantham shatacandra nibhananam || 6||
    nilagranasikavaktram sumahaccarukundalam | damshtrakaralavadanam kiritamukutojjvalam || 7|| kunkumarunasarvangam
    kundendudhavalananam | vishnuvaha namastubhyam kshemam kuru sada mama || 8|| evam dhyayettrisandhyasu
    garudam nagabhushanam | visham nashayate shighram tularashimivanalah || 9|| omimom namo bhagavate
    shrimahagarudaya pakshindraya vishnuvallabhaya trailokyaparipujitaya ugrabhayamkarakalanalarupaya
    vajranakhaya vajratundaya vajradantaya vajradamshtraya vajrapucchaya vajrapakshalakshitashariraya
    omikehyehi shrimahagarudapratishasanasminnavishavisha dushtanam visham dushayadushaya sprishtanam
    nashayanashaya dandashukanam visham darayadaraya pralinam visham pranashayapranashaya sarvavisham
    nashayanashaya hanahana dahadaha pacapaca bhasmikurubhasmikuru hum phat svaha || candramandalasamkasha
    suryamandalamushtika | prithvimandalamudranga shrimahagarudaya visham harahara hum phat svaha || om
    kshipa svaha || omim sacarati sacarati tatkari matkari vishanam ca visharupini vishadushini vishashoshani
    vishanashini vishaharini hatam visham nashtam vishamantahpralinam visham pranashtam visham hatam te
    brahmana visham hatamindrasya vajrena svaha || om namo bhagavate mahagarudaya vishnuvahanaya trailokyaparipujitaya
    vajranakhavajratundaya vajrapakshalamkrita
  devanagari: सस्तनूभिः ॥ व्यशेम देवहितं यदायुः ॥ स्वस्ति न इन्द्रो वृद्धश्रवाः ॥ स्वस्ति नः पूषा विश्ववेदाः
    ॥ स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः ॥ स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः
    ॐ ॥ गारुडब्रह्मविद्यां प्रवक्ष्यामि यां ब्रह्मा विद्यां नारदाय प्रोवाच नारदो बृहत्सेनाय बृहत्सेन इन्द्राय
    इन्द्रो भरद्वाजाय भरद्वाजो जीवत्कामेभ्यः शिष्येभ्यः प्रायच्छत् । अस्याः श्रीमहागरुडब्रह्मविद्याया
    ब्रह्मा ऋषिः । गायत्री छन्दः । श्रीभगवान्महागरुडो देवता । श्रीमहागरुडप्रीत्यर्थे मम सकलविषविनाशनार्थे
    जपे विनियोगः । ॐ नमो भगवते अङ्गुष्ठाभ्यां नमः । श्री महागरुडाय तर्जनीभ्यां स्वाहा । पक्षीन्द्राय मध्यमाभ्यां
    वषट् । श्रीविष्णुवल्लभाय अनामिकाभ्यां हुम् । त्रैलोक्य परिपूजिताय कनिष्ठिकाभ्यां वौषट् । उग्रभयङ्करकालानलरूपाय
    करतलकरपृष्ठाभ्यां फट् । एवं हृदयादिन्यासः । भूर्भुवः सुवरोमिति दिग्बन्धः । ध्यानम् । स्वस्तिको दक्षिणं
    पादं वामपादं तु कुञ्चितम् । प्राञ्जलीकृतदोर्युग्मं गरुडं हरिवल्लभम् ॥ १॥ अनन्तो वामकटको यज्ञसूत्रं
    तु वासुकिः । तक्षकाः कटिसूत्रं तु हारः कार्कोट उच्यते ॥ २॥ पद्मो दक्षिणकर्णे तु महापद्मस्तु वामके
    । शङ्खः शिरःप्रदेशे तु गुलिकस्तु भुजान्तरे ॥ ३॥ पौण्ड्रकालिकनागाभ्यां चामराभ्यां स्वीजितम् । एलापुत्रकनागाद्यैः
    सेव्यमानं मुदान्वितम् ॥ ४॥ कपिलाक्षं गरुत्मन्तं सुवर्णसदृशप्रभम् । दीर्घबाहुं बृहत्स्कन्धं नादाभरणभूषितम्
    ॥ ५॥ आजानुतः सुवर्णाभमाकट्योस्तुहिनप्रभम् । कुङ्कुमारुणमाकण्ठं शतचन्द्र निभाननम् ॥ ६॥ नीलाग्रनासिकावक्त्रं
    सुमहच्चारुकुण्डलम् । दंष्ट्राकरालवदनं किरीटमुकुटोज्ज्वलम् ॥ ७॥ कुङ्कुमारुणसर्वाङ्गं कुन्देन्दुधवलाननम्
    । विष्णुवाह नमस्तुभ्यं क्षेमं कुरु सदा मम ॥ ८॥ एवं ध्यायेत्त्रिसन्ध्यासु गरुडं नागभूषणम् । विषं नाशयते
    शीघ्रं तूलरशिमिवानलः ॥ ९॥ ओमीमों नमो भगवते श्रीमहागरुडाय पक्षीन्द्राय विष्णुवल्लभाय त्रैलोक्यपरिपूजिताय
    उग्रभयंकरकालानलरूपाय वज्रनखाय वज्रतुण्डाय वज्रदन्ताय वज्रदंष्ट्राय वज्रपुच्छाय वज्रपक्षालक्षितशरीराय
    ओमीकेह्येहि श्रीमहागरुडाप्रतिशासनास्मिन्नाविशाविश दुष्टानां विषं दूषयदूषय स्पृष्टानां नाशयनाशय दन्दशूकानां
    विषं दारयदारय प्रलीनं विषं प्रणाशयप्रणाशय सर्वविषं नाशयनाशय हनहन दहदह पचपच भस्मीकुरुभस्मीकुरु हुं
    फट् स्वाहा ॥ चन्द्रमण्डलसंकाश सूर्यमण्डलमुष्टिक । पृथ्वीमण्डलमुद्राङ्ग श्रीमहागरुडाय विषं हरहर हुं
    फट् स्वाहा ॥ ॐ क्षिप स्वाहा ॥ ओमीं सचरति सचरति तत्कारी मत्कारी विषाणां च विषरूपिणी विषदूषिणी विषशोषणी
    विषनाशिनी विषहारिणी हतं विषं नष्टं विषमन्तःप्रलीनं विषं प्रनष्टं विषं हतं ते ब्रह्मणा विषं हतमिन्द्रस्य
    वज्रेण स्वाहा ॥ ॐ नमो भगवते महागरुडाय विष्णुवाहनाय त्रैलोक्यपरिपूजिताय वज्रनखवज्रतुण्डाय वज्रपक्षालंकृत
