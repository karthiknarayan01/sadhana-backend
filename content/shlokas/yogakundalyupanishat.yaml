id: yogakundalyupanishat
category: upanishad
name:
  english: yogakundalyupanishat
  devanagari: योगकुण्डल्युपनिषत्
content:
  english: athaham sampravakshyami vidyam khecarisamjnikam | yatha vijnanavanasya loke'sminnajaro'marah
    || 1|| mrityuvyadhijaragrasto drishtva vidyamimam mune | buddhim dridhataram kritva khecarim tu samabhyaset
    || 2|| jaramrityugadaghno yah khecarim vetti bhutale | granthatashcarthatashcaiva tadabhyasaprayogatah
    || 3|| tam mune sarvabhavena gurum matva samashrayet | durlabha khecari vidya tadabhyaso'pi durlabhah
    || 4|| abhyasam melanam caiva yugapannaiva sidhyati | abhyasamatranirata na vindante ha melanam ||
    5|| abhyasam labhate brahmanjanmajanmantare kvacit | melanam tu janmanam shatante'pi na labhyate ||
    6|| abhyasam bahujanmante kritva tadbhavasadhitam | melanam labhate kashcidyogi janmantare kvacit
    || 7|| yada tu melanam yogi labhate guruvaktratah | tada tatsiddhimapnoti yadukta shastrasantatau
    || 8|| granthatashcarthatashcaiva melanam labhate yada | tada shivatvamapnoti nirmuktah sarvasamsriteh
    || 9|| shastram vinapi samboddhum guravo'pi na shaknayuh | tasmatsudurlabhataram labhyam shastramidam
    mune || 10|| yavanna labhyate shastram tavadgam paryatedyatih | yada samlabhyate shastram tada siddhih
    kare sthita || 11|| na shastrena vina siddhirdrishta caiva jagattraye | tasmanmelanadataram shastradataramacyutam
    || 12|| tadabhyasapradataram shivam matva samashrayet | labdhva shastramidam mahyamanyesham na prakashayet
    || 13|| tasmatsarvaprayatnena gopaniyam vijanata | yatraste ca gururbrahmandivyayogapradayakah ||
    14|| tatra gatva ca tenoktavidyam samgrihya khecarim | tenoktah samyagabhyasam kuryadadavatandritah
    || 15|| anaya vidyaya yogi khecarisiddhibhagbhavet | khecarya khecarim yunjankhecaribijapuraya ||
    16|| khecaradhipatirbhutva khecareshu sada vaset | khecaravasatham vahnimambumandalabhushitam || 17||
    akhyatam khecaribijam tena yogah prasidhyati | somamshanavakam varnam pratilomena coddharet || 18||
    tasmattryamshakamakhyatamaksharam candrarupakam | tasmadapyashtamam varnam vilomena param mune ||
    19|| tatha tatparamam viddhi tadadirapi pancami | indoshca bahubhinne ca kuto'yam parikirtitah ||
    20|| gurupadeshalabhyam ca sarvayogaprasiddhidam | yattasya dehaja maya niruddhakaranashraya || 21||
    svapne'pi na labhettasya nityam dvadashajapyatah | ya imam panca lakshani japedapi suyantritah ||
    22|| tasya shrikhecarisiddhih svayameva pravartate | nashyanti sarvavighnani prasidanti ca devatah
    || 23|| valipalitanashashca bhavishyati na samshayah | evam labdhva mahavidyamabhyasam karayettatah
    || 24|| anyatha klishyate brahmanna siddhih khecaripathe | yadabhyasavidhau vidyam na labhedyah sudhamayim
    || 25|| tatah sammelakadau ca labdhva vidyam sada japet | nanyatha rahito brahmanna kimcitsiddhibhagbhavet
    || 26|| yadidam labhyate shastram tada vidyam samashrayet | tatastadoditam siddhimashu tam labhate
    munih || 27|| talumulam samutkrishya saptavasaramatmavit | svaguruktaprakarena malam sarvam vishodhayet
    || 28|| snuhipatranibham shastram sutikshnam snigdhanirmalam | samadaya tatastena romamatram samucchinet
    || 29|| hitva saindhavapathyabhyam curnitabhyam prakarshayet | punah saptadine prapte romamatram samucchinet
    || 30|| evam kramena shanmasam nityodyuktah samacaret | shanmasadrasanamulam sirabaddham pranashyati
    || 31|| atha vagishvaridhama shiro vastrena veshtayet | shanairutkarshayedyogi kalavelavidhanavit
    || 32|| punah shanmasamatrena nityam samgharshananmune | bhrumadhyavadhi capyeti tiryakkanabilavadhih
    || 33|| adhashca cubukam mulam prayati kramacarita | punah samvatsaranam tu tritiyadeva lilaya ||
    34|| keshantamurdhvam kramati tiryak shakhavadhirmune | adhastatkanthakupantam punarvarshatrayena
    tu || 35|| brahmarandhram samavritya tishthedeva na samshayah | tiryak culitalam yati adhah kanthabilavadhi
    || 36|| shanaih shanairmastakacca mahavajrakapatabhit | purvam bijayuta vidya hyakhyata yatidurlabha
    || 37|| tasyah shadangam kurvita taya shatsvarabhinnaya | kuryadevam karanyasam sarvasiddhyadihetave
    || 38|| shanairevam prakartavyamabhyasam yugapannahi | yugapadvartate yasya shariram vilayam vrajet
    || 39|| tasmacchanaih shanaih karyamabhyasam munipungava | yada ca bahyamargena jihva brahmabilam
    vrajet || 40|| tada brahmargalam brahmandurbhedyam tridashairapi | angulyagrena samghrishya jihvamatram
    niveshayet || 41|| evam varshatrayam kritva brahmadvaram pravishyati | brahmadvare pravishte tu samyanmathanamacaret
    || 42|| mathanena vina kecitsadhayanti vipashcitah | khecarimantrasiddhasya sidhyate mathanam vina
    || 43|| japam ca mathanam caiva kritva shighram phalam labhet | svarnajam raupyajam vapi lohajam va
    shalakikam || 44|| niyojya nasikarandhram dugdhasiktena tantuna | pranannirudhya hridaye sukhamasanamatmanah
    || 45|| shanaih sumathanam kuryadbhrumadhye nyasya cakshushi | shanmasam mathanavastha bhavenaiva
    prajayate || 46|| yatha sushuptirbalanam yatha bhavastatha bhavet | na sada mathanam shastam mase
    mase samacaret || 47|| sada rasanaya yogi margam na parisamkramet | evam dvadashavarshante samsiddhirbhavati
    dhruva || 48|| sharire sakalam vishvam pashyatyatmavibhedatah | brahmando'yam mahamargo rajadantordhvakundali
    || 49|| iti|| iti dvitiyo'dhyayah || 2||
  devanagari: अथाहं संप्रवक्ष्यामि विद्यां खेचरिसंज्ञिकाम् । यथा विज्ञानवानस्या लोकेऽस्मिन्नजरोऽमरः ॥
    १॥ मृत्युव्याधिजराग्रस्तो दृष्ट्वा विद्यामिमां मुने । बुद्धिं दृढतरां कृत्वा खेचरीं तु समभ्यसेत् ॥
    २॥ जरामृत्युगदघ्नो यः खेचरीं वेत्ति भूतले । ग्रन्थतश्चार्थतश्चैव तदभ्यासप्रयोगतः ॥ ३॥ तं मुने सर्वभावेन
    गुरुं मत्वा समाश्रयेत् । दुर्लभा खेचरी विद्या तदभ्यासोऽपि दुर्लभः ॥ ४॥ अभ्यासं मेलनं चैव युगपन्नैव
    सिध्यति । अभ्यासमात्रनिरता न विन्दन्ते ह मेलनम् ॥ ५॥ अभ्यासं लभते ब्रह्मञ्जन्मजन्मान्तरे क्वचित् ।
    मेलनं तु जन्मनां शतान्तेऽपि न लभ्यते ॥ ६॥ अभ्यासं बहुजन्मान्ते कृत्वा तद्भावसाधितम् । मेलनं लभते कश्चिद्योगी
    जन्मान्तरे क्वचित् ॥ ७॥ यदा तु मेलनं योगी लभते गुरुवक्त्रतः । तदा तत्सिद्धिमाप्नोति यदुक्ता शास्त्रसन्ततौ
    ॥ ८॥ ग्रन्थतश्चार्थतश्चैव मेलनं लभते यदा । तदा शिवत्वमाप्नोति निर्मुक्तः सर्वसंसृतेः ॥ ९॥ शास्त्रं
    विनापि संबोद्धुं गुरवोऽपि न शक्नयुः । तस्मात्सुदुर्लभतरं लभ्यं शास्त्रमिदं मुने ॥ १०॥ यावन्न लभ्यते
    शास्त्रं तावद्गां पर्यटेद्यतिः । यदा संलभ्यते शास्त्रं तदा सिद्धिः करे स्थिता ॥ ११॥ न शास्त्रेण विना
    सिद्धिर्दृष्टा चैव जगत्त्रये । तस्मान्मेलनदातारं शास्त्रदातारमच्युतम् ॥ १२॥ तदभ्यासप्रदातारं शिवं
    मत्वा समाश्रयेत् । लब्ध्वा शास्त्रमिदं मह्यमन्येषां न प्रकाशयेत् ॥ १३॥ तस्मात्सर्वप्रयत्नेन गोपनीयं
    विजानता । यत्रास्ते च गुरुर्ब्रह्मन्दिव्ययोगप्रदायकः ॥ १४॥ तत्र गत्वा च तेनोक्तविद्यां संगृह्य खेचरीम्
    । तेनोक्तः सम्यगभ्यासं कुर्यादादावतन्द्रितः ॥ १५॥ अनया विद्यया योगी खेचरीसिद्धिभाग्भवेत् । खेचर्या
    खेचरीं युञ्जन्खेचरीबीजपूरया ॥ १६॥ खेचराधिपतिर्भूत्वा खेचरेषु सदा वसेत् । खेचरावसथं वह्निमम्बुमण्डलभूषितम्
    ॥ १७॥ आख्यातं खेचरीबीजं तेन योगः प्रसिध्यति । सोमांशनवकं वर्णं प्रतिलोमेन चोद्धरेत् ॥ १८॥ तस्मात्त्र्यंशकमाख्यातमक्षरं
    चन्द्ररूपकम् । तस्मादप्यष्टमं वर्णं विलोमेन परं मुने ॥ १९॥ तथा तत्परमं विद्धि तदादिरपि पञ्चमी । इन्दोश्च
    बहुभिन्ने च कूटोऽयं परिकीर्तितः ॥ २०॥ गुरूपदेशलभ्यं च सर्वयोगप्रसिद्धिदम् । यत्तस्य देहजा माया निरुद्धकरणाश्रया
    ॥ २१॥ स्वप्नेऽपि न लभेत्तस्य नित्यं द्वादशजप्यतः । य इमां पञ्च लक्षाणि जपेदपि सुयन्त्रितः ॥ २२॥ तस्य
    श्रीखेचरीसिद्धिः स्वयमेव प्रवर्तते । नश्यन्ति सर्वविघ्नानि प्रसीदन्ति च देवताः ॥ २३॥ वलीपलितनाशश्च
    भविष्यति न संशयः । एवं लब्ध्वा महाविद्यामभ्यासं कारयेत्ततः ॥ २४॥ अन्यथा क्लिश्यते ब्रह्मन्न सिद्धिः
    खेचरीपथे । यदभ्यासविधौ विद्यां न लभेद्यः सुधामयीम् ॥ २५॥ ततः संमेलकादौ च लब्ध्वा विद्यां सदा जपेत्
    । नान्यथा रहितो ब्रह्मन्न किंचित्सिद्धिभाग्भवेत् ॥ २६॥ यदिदं लभ्यते शास्त्रं तदा विद्यां समाश्रयेत्
    । ततस्तदोदितां सिद्धिमाशु तां लभते मुनिः ॥ २७॥ तालुमूलं समुत्कृष्य सप्तवासरमात्मवित् । स्वगुरूक्तप्रकारेण
    मलं सर्वं विशोधयेत् ॥ २८॥ स्नुहिपत्रनिभं शस्त्रं सुतीक्ष्णं स्निग्धनिर्मलम् । समादाय ततस्तेन रोममात्रं
    समुच्च्हिनेत् ॥ २९॥ हित्वा सैन्धवपथ्याभ्यां चूर्णिताभ्यां प्रकर्षयेत् । पुनः सप्तदिने प्राप्ते रोममात्रं
    समुच्च्हिनेत् ॥ ३०॥ एवं क्रमेण षण्मासं नित्योद्युक्तः समाचरेत् । षण्मासाद्रसनामूलं सिराबद्धं प्रणश्यति
    ॥ ३१॥ अथ वागीश्वरीधाम शिरो वस्त्रेण वेष्टयेत् । शनैरुत्कर्षयेद्योगी कालवेलाविधानवित् ॥ ३२॥ पुनः षण्मासमात्रेण
    नित्यं संघर्षणान्मुने । भ्रूमध्यावधि चाप्येति तिर्यक्कणबिलावधिः ॥ ३३॥ अधश्च चुबुकं मूलं प्रयाति क्रमचारिता
    । पुनः संवत्सराणां तु तृतीयादेव लीलया ॥ ३४॥ केशान्तमूर्ध्वं क्रमति तिर्यक् शाखावधिर्मुने । अधस्तात्कण्ठकूपान्तं
    पुनर्वर्षत्रयेण तु ॥ ३५॥ ब्रह्मरन्ध्रं समावृत्य तिष्ठेदेव न संशयः । तिर्यक् चूलितलं याति अधः कण्ठबिलावधि
    ॥ ३६॥ शनैः शनैर्मस्तकाच्च महावज्रकपाटभित् । पूर्वं बीजयुता विद्या ह्याख्याता यतिदुर्लभा ॥ ३७॥ तस्याः
    षडङ्गं कुर्वीत तया षट्स्वरभिन्नया । कुर्यादेवं करन्यासं सर्वसिद्ध्यादिहेतवे ॥ ३८॥ शनैरेवं प्रकर्तव्यमभ्यासं
    युगपन्नहि । युगपद्वर्तते यस्य शरीरं विलयं व्रजेत् ॥ ३९॥ तस्माच्च्हनैः शनैः कार्यमभ्यासं मुनिपुङ्गव
    । यदा च बाह्यमार्गेण जिह्वा ब्रह्मबिलं व्रजेत् ॥ ४०॥ तदा ब्रह्मार्गलं ब्रह्मन्दुर्भेद्यं त्रिदशैरपि
    । अङ्गुल्यग्रेण संघृष्य जिह्वामात्रं निवेशयेत् ॥ ४१॥ एवं वर्षत्रयं कृत्वा ब्रह्मद्वारं प्रविश्यति
    । ब्रह्मद्वारे प्रविष्टे तु सम्यङ्मथनमाचरेत् ॥ ४२॥ मथनेन विना केचित्साधयन्ति विपश्चितः । खेचरीमन्त्रसिद्धस्य
    सिध्यते मथनं विना ॥ ४३॥ जपं च मथनं चैव कृत्वा शीघ्रं फलं लभेत् । स्वर्णजां रौप्यजां वापि लोहजां वा
    शलाकिकाम् ॥ ४४॥ नियोज्य नासिकारन्ध्रं दुग्धसिक्तेन तन्तुना । प्राणान्निरुध्य हृदये सुखमासनमात्मनः
    ॥ ४५॥ शनैः सुमथनं कुर्याद्भ्रूमध्ये न्यस्य चक्षुषी । षण्मासं मथनावस्था भावेनैव प्रजायते ॥ ४६॥ यथा
    सुषुप्तिर्बालानां यथा भावस्तथा भवेत् । न सदा मथनं शस्तं मासे मासे समाचरेत् ॥ ४७॥ सदा रसनया योगी मार्गं
    न परिसंक्रमेत् । एवं द्वादशवर्षान्ते संसिद्धिर्भवति ध्रुवा ॥ ४८॥ शरीरे सकलं विश्वं पश्यत्यात्माविभेदतः
    । ब्रह्माण्डोऽयं महामार्गो राजदन्तोर्ध्वकुण्डली ॥ ४९॥ इति॥ इति द्वितीयोऽध्यायः ॥ २॥
