id: paramakrishnagolokadarshanamahamantrah
category: mantra
name:
  english: paramakrishnagolokadarshanamahamantrah
  devanagari: परमकृष्णगोलोकदर्शनमहामन्त्रः
content:
  english: ante paramagolokapraptyartham jape viniyogah || || rishyadinyasah || paramagopalarishaye namah
    shirasi | jagatichandase namah mukhe | shriparamakrishnadevatayai namah hridi | hrim bijaya namah
    guhye | shrim shaktaye namah nabhau | klim kilakaya namah padayoh | golokadarshanasiddhyarthe viniyogaya
    namah sarvange || || karanyasah || om hrim angushthabhyam namah | om shrim tarjanibhyam svaha | om
    klim madhyamabhyam vashat | om glaum anamikabhyam hum | om krishnaya kanishthikabhyam vaushat | om
    paramakrishnaya karatalakaraprishthabhyam phat || || shadanganyasah || om hrim hridayaya namah | om
    shrim shirase svaha | om klim shikhayai vashat | om glaum kavacaya hum | om krishnaya netratrayaya
    vaushat | om paramakrishnaya astraya phat || || vyapakanyasah || om radhavallabhaya vyapakaya namah
    | om golokanathaya vyapakaya namah | om premamayaya vyapakaya namah | om rasasvarupine vyapakaya namah
    || || matrikanyasah || am am im im um um rim rim lim lim em aim om aum ah shirasi | kam kham gam gham
    nam dakshinabahau | cam cham jam jham nam vamabahau | tam tham dam dham nam dakshinapade | tam tham
    dam dham nam vamapade | pam pham bam bham mam udare | yam ram lam vam hridi | sham sham sam ham ksham
    sarvange || || varnanyasah || hrim lalate | shrim bhrumadhye | klim hridi | glaum nabhau | krim guhye
    | shnam padayoh | ram sarvange || || aksharanyasah || krim shirasi | shnam mukhe | ra kanthe | dha
    hridi | valla nabhau | bhaya katau | namah padayoh || || srishtinyasah || om vasudevaya srishtikartre
    namah hridi | om sankarshanaya namah shirasi | om pradyumnaya namah nabhau | om aniruddhaya namah
    sarvange || || sthitinyasah || om govindaya namah hridi | om gopalaya namah kanthe | om radharamanaya
    namah nabhau | om nandanandanaya namah sarvange || || pralayanyasah || om kalakrishnaya namah | om
    yogeshvaraya namah | om vishvasamharine namah | om paramadhamne namah || || dashavataranyasah || matsyaya
    shirasi | kurmaya kanthe | varahaya hridi | nrisimhaya bahvoh | vamanaya nabhau | parashuramaya katau
    | ramaya uru | balaramaya januni | buddhaya padayoh | kalkine sarvange || || ashtasakhinyasah || lalitayai
    hridi | vishakhayai shirasi | citrayai dakshine | campakalatayai vame | tungavidyayai nabhau | indulekhayai
    katau | rangadevyai uru | sudevyai padayoh || || shaktinyasah || hladinyai namah hridi | sandhinyai
    namah nabhau | samvittyai namah shirasi | premashaktyai namah sarvange | karunashaktyai namah netrayoh
    | lilashaktyai namah hastayoh | yogamayayai namah padayoh || || mahavidyanyasah || kalyai namah shirasi
    | tarayai namah mukhe | shodashyai namah hridi | bhuvaneshvaryai namah nabhau | bhairavyai namah guhye
    | chinnamastayai namah katau | dhumavatyai namah uru | bagalayai namah bahvoh | matangyai namah kanthe
    | kamalayai namah sarvange || || cakranyasah || gopalaya muladhare namah | damodaraya svadhishthane
    namah | madhavaya manipure namah | radharamanaya anahate namah | govindaya vishuddhau namah | shyamasundaraya
    ajnacakre namah | paramakrishnaya sahasrare namah || || dhyanam || radhankasamstham navanilamegham
    venum vahantam smitacaruvaktram | golokamadhye rasikendranatham dhyayetparam krishnamanantarupam ||
    kalpadrumanam nikare virajat ratnapradipojjvalamandapastham | gopiganaih sevitapadapadmam premamritabdhim
    sharanam prapadye || || shriparamakrishnagolokadarshanamahamantrah || om hrim shrim klim glaum krishna
    krishna paramakrishna golokanatha radhavallabha rasamritasindho darshaya darshaya prakataya prakataya
    avirbhavaya avirbhavaya premam dehi dehi bhaktim dehi dehi mocaya mocaya palaya palaya kshalaya kshalaya
    nashaya nashaya kshaya kshaya samshaya kshaya kshaya moham hara hara anandam puraya puraya radhasahitam
    golokam darshaya darshaya hum phat svaha || || iti shriparamakrishnagolokadarshanamahamantranyasaprakaranam
    ||
  devanagari: अन्ते परमगोलोकप्राप्त्यर्थं जपे विनियोगः ॥ ॥ ऋष्यादिन्यासः ॥ परमगोपालऋषये नमः शिरसि । जगतीछन्दसे
    नमः मुखे । श्रीपरमकृष्णदेवतायै नमः हृदि । ह्रीं बीजाय नमः गुह्ये । श्रीं शक्तये नमः नाभौ । क्लीं कीलकाय
    नमः पादयोः । गोलोकदर्शनसिद्ध्यर्थे विनियोगाय नमः सर्वाङ्गे ॥ ॥ करन्यासः ॥ ॐ ह्रीं अङ्गुष्ठाभ्यां नमः
    । ॐ श्रीं तर्जनीभ्यां स्वाहा । ॐ क्लीं मध्यमाभ्यां वषट् । ॐ ग्लौं अनामिकाभ्यां हुं । ॐ कृष्णाय कनिष्ठिकाभ्यां
    वौषट् । ॐ परमकृष्णाय करतलकरपृष्ठाभ्यां फट् ॥ ॥ षडङ्गन्यासः ॥ ॐ ह्रीं हृदयाय नमः । ॐ श्रीं शिरसे स्वाहा
    । ॐ क्लीं शिखायै वषट् । ॐ ग्लौं कवचाय हुं । ॐ कृष्णाय नेत्रत्रयाय वौषट् । ॐ परमकृष्णाय अस्त्राय फट्
    ॥ ॥ व्यापकन्यासः ॥ ॐ राधावल्लभाय व्यापकाय नमः । ॐ गोलोकनाथाय व्यापकाय नमः । ॐ प्रेममयाय व्यापकाय नमः
    । ॐ रसस्वरूपिणे व्यापकाय नमः ॥ ॥ मातृकान्यासः ॥ अं आं इं ईं उं ऊं ऋं ॠं ऌं ॡं एं ऐं ओं औं अः शिरसि
    । कं खं गं घं ङं दक्षिणबाहौ । चं छं जं झं ञं वामबाहौ । टं ठं डं ढं णं दक्षिणपादे । तं थं दं धं नं
    वामपादे । पं फं बं भं मं उदरे । यं रं लं वं हृदि । शं षं सं हं क्षं सर्वाङ्गे ॥ ॥ वर्णन्यासः ॥ ह्रीं
    ललाटे । श्रीं भ्रूमध्ये । क्लीं हृदि । ग्लौं नाभौ । कृं गुह्ये । ष्णं पादयोः । रां सर्वाङ्गे ॥ ॥ अक्षरन्यासः
    ॥ कृं शिरसि । ष्णं मुखे । रा कण्ठे । धा हृदि । वल्ल नाभौ । भाय कटौ । नमः पादयोः ॥ ॥ सृष्टिन्यासः ॥
    ॐ वासुदेवाय सृष्टिकर्त्रे नमः हृदि । ॐ सङ्कर्षणाय नमः शिरसि । ॐ प्रद्युम्नाय नमः नाभौ । ॐ अनिरुद्धाय
    नमः सर्वाङ्गे ॥ ॥ स्थितिन्यासः ॥ ॐ गोविन्दाय नमः हृदि । ॐ गोपालाय नमः कण्ठे । ॐ राधारमणाय नमः नाभौ
    । ॐ नन्दनन्दनाय नमः सर्वाङ्गे ॥ ॥ प्रलयन्यासः ॥ ॐ कालकृष्णाय नमः । ॐ योगेश्वराय नमः । ॐ विश्वसंहारिणे
    नमः । ॐ परमधाम्ने नमः ॥ ॥ दशावतारन्यासः ॥ मत्स्याय शिरसि । कूर्माय कण्ठे । वराहाय हृदि । नृसिंहाय
    बाह्वोः । वामनाय नाभौ । परशुरामाय कटौ । रामाय ऊरू । बलरामाय जानुनी । बुद्धाय पादयोः । कल्किने सर्वाङ्गे
    ॥ ॥ अष्टसखीन्यासः ॥ ललितायै हृदि । विशाखायै शिरसि । चित्रायै दक्षिणे । चम्पकलतायै वामे । तुङ्गविद्यायै
    नाभौ । इन्दुलेखायै कटौ । रङ्गदेव्यै ऊरू । सुदेव्यै पादयोः ॥ ॥ शक्तिन्यासः ॥ ह्लादिन्यै नमः हृदि ।
    सन्धिन्यै नमः नाभौ । संवित्त्यै नमः शिरसि । प्रेमशक्त्यै नमः सर्वाङ्गे । करुणाशक्त्यै नमः नेत्रयोः
    । लीलाशक्त्यै नमः हस्तयोः । योगमायायै नमः पादयोः ॥ ॥ महाविद्यान्यासः ॥ काल्यै नमः शिरसि । तारायै नमः
    मुखे । षोडश्यै नमः हृदि । भुवनेश्वर्यै नमः नाभौ । भैरव्यै नमः गुह्ये । छिन्नमस्तायै नमः कटौ । धूमावत्यै
    नमः ऊरू । बगलायै नमः बाह्वोः । मातङ्ग्यै नमः कण्ठे । कमलायै नमः सर्वाङ्गे ॥ ॥ चक्रन्यासः ॥ गोपालाय
    मूलाधारे नमः । दामोदराय स्वाधिष्ठाने नमः । माधवाय मणिपूरे नमः । राधारमणाय अनाहते नमः । गोविन्दाय विशुद्धौ
    नमः । श्यामसुन्दराय आज्ञाचक्रे नमः । परमकृष्णाय सहस्रारे नमः ॥ ॥ ध्यानम् ॥ राधाङ्कसंस्थं नवनीलमेघं
    वेणुं वहन्तं स्मितचारुवक्त्रम् । गोलोकमध्ये रसिकेन्द्रनाथं ध्यायेत्परं कृष्णमनन्तरूपम् ॥ कल्पद्रुमाणां
    निकरे विराजत् रत्नप्रदीपोज्ज्वलमण्डपस्थम् । गोपीगणैः सेवितपादपद्मं प्रेमामृताब्धिं शरणं प्रपद्ये ॥
    ॥ श्रीपरमकृष्णगोलोकदर्शनमहामन्त्रः ॥ ॐ ह्रीं श्रीं क्लीं ग्लौं कृष्ण कृष्ण परमकृष्ण गोलोकनाथ राधावल्लभ
    रसामृतसिन्धो दर्शय दर्शय प्रकटय प्रकटय आविर्भावय आविर्भावय प्रेमं देहि देहि भक्तिं देहि देहि मोचय
    मोचय पालय पालय क्षालय क्षालय नाशय नाशय क्षय क्षय संशय क्षय क्षय मोहं हर हर आनन्दं पूरय पूरय राधासहितं
    गोलोकं दर्शय दर्शय हूं फट् स्वाहा ॥ ॥ इति श्रीपरमकृष्णगोलोकदर्शनमहामन्त्रन्यासप्रकरणम् ॥
