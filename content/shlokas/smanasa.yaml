id: smanasa
category: stotram
name:
  english: smanasa
  devanagari: स्मानस
content:
  english: sartha shrishivamanasapuja ratnaih kalpitamasanam himajalaih snanam ca divyambaram nanaratnavibhushitam
    mrigamadamodankitam candanam | jaticampakabilvapatraracitam pushpam ca dhupam tatha dipam deva dayanidhe
    pashupate hritkalpitam grihyatam || 1|| sauvarne navaratnakhandaracite patre ghritam payasam bhakshyam
    pancavidham payodadhiyutam rambhaphalam panakam | shakanamayutam jalam rucikaram karpurakhandojjvalam
    tambulam manasa maya viracitam bhaktya prabho svikuru || 2|| chatram camarayoryugam vyajanakam cadarshakam
    nirmalam vinabherimridangakahalakala gitam ca nrityam tatha | sashtangam pranatih stutirbahuvidha
    hyetatsamastam maya sankalpena samarpitam tava vibho pujam grihana prabho || 3|| atma tvam girija
    matih sahacarah pranah shariram griham puja te vishayopabhogaracana nidra samadhisthitih | sancarah
    padayoh pradakshinavidhih stotrani sarva giro yadyatkarma karomi tattadakhilam shambho tavaradhanam
    || 4|| karacaranakritam vakkayajam karmajam va | shravananayanajam va manasam vaparadham | vihitamavihitam
    va sarvametatkshamasva | jaya jaya karunabdhe shrimahadevashambho || 5|| || iti shrimacchankaracaryaviracita
    shivamanasapuja samapta ||
  devanagari: सार्थ श्रीशिवमानसपूजा रत्नैः कल्पितमासनं हिमजलैः स्नानं च दिव्याम्बरं नानारत्नविभूषितं मृगमदामोदाङ्कितं
    चन्दनम् । जातीचम्पकबिल्वपत्ररचितं पुष्पं च धूपं तथा दीपं देव दयानिधे पशुपते हृत्कल्पितं गृह्यताम्
    ॥ १॥ सौवर्णे नवरत्नखण्डरचिते पात्रे घृतं पायसं भक्ष्यं पञ्चविधं पयोदधियुतं रम्भाफलं पानकम् । शाकानामयुतं
    जलं रुचिकरं कर्पूरखण्डोज्ज्वलं ताम्बूलं मनसा मया विरचितं भक्त्या प्रभो स्वीकुरु ॥ २॥ छत्रं चामरयोर्युगं
    व्यजनकं चादर्शकं निर्मलं वीणाभेरिमृदङ्गकाहलकला गीतं च नृत्यं तथा । साष्टाङ्गं प्रणतिः स्तुतिर्बहुविधा
    ह्येतत्समस्तं मया सङ्कल्पेन समर्पितं तव विभो पूजां गृहाण प्रभो ॥ ३॥ आत्मा त्वं गिरिजा मतिः सहचराः
    प्राणाः शरीरं गृहं पूजा ते विषयोपभोगरचना निद्रा समाधिस्थितिः । सञ्चारः पदयोः प्रदक्षिणविधिः स्तोत्राणि
    सर्वा गिरो यद्यत्कर्म करोमि तत्तदखिलं शम्भो तवाराधनम् ॥ ४॥ करचरणकृतं वाक्कायजं कर्मजं वा । श्रवणनयनजं
    वा मानसं वापराधम् । विहितमविहितं वा सर्वमेतत्क्षमस्व । जय जय करुणाब्धे श्रीमहादेवशम्भो ॥ ५॥ ॥ इति
    श्रीमच्छङ्कराचार्यविरचिता शिवमानसपूजा समाप्ता ॥
