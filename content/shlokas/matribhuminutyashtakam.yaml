id: matribhuminutyashtakam
category: stotram
name:
  english: matribhuminutyashtakam
  devanagari: मातृभूमिनुत्यष्टकम्
content:
  english: '|| iti pathantaram || shrivedah smritayashca shastranicayo mameva samsevitum rajantyatra suputadivyacaritanudbodhayantah
    sada | tasmacchokamaram vihaya nitaram sevadhvamaryah prajah'
  devanagari: ॥ इति पाठान्तरम् ॥ श्रीवेदाः स्मृतयश्च शास्त्रनिचयो मामेव संसेवितुं राजन्त्यत्र सुपूतदिव्यचरितानुद्बोधयन्तः
    सदा । तस्माच्छोकमरं विहाय नितरां सेवध्वमार्याः प्रजाः
meaning: {}
