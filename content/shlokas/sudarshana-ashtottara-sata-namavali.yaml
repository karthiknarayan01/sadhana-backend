    ॐ सर्वमयाय नमः । ५०। ॐ तमो-विध्वंसकाय नमः । ॐ रजस्सत्त्वतमोद्वर्तिने नमः । ॐ त्रिगुणात्मने नमः । ॐ
    त्रिलोकधृते नमः । ॐ हरिमायगुणोपेताय नमः । ५५। ॐ अव्ययाय नमः । ॐ अक्षस्वरूपभाजे नमः । ॐ परमात्मने नमः
    । ॐ परं ज्योतिषे नमः । ॐ पञ्चकृत्य-परायणाय नमः । ६०। ॐ ज्ञानशक्ति-बलैश्वर्य-वीर्य-तेजः- प्रभामयाय
    नमः । ॐ सदसत्-परमाय नमः । ॐ पूर्णाय नमः । ॐ वाङ्मयाय नमः । ॐ वरदाय नमः । ६५। ॐ अच्युताय नमः । ॐ जीवाय
