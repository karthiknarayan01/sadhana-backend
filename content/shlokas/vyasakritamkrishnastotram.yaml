id: vyasakritamkrishnastotram
category: stotram
name:
  english: vyasakritamkrishnastotram
  devanagari: व्यासकृतंकृष्णस्तोत्रम्
content:
  english: vyasakritam krishnastotram vyasa uvaca | namahparamashantaya nigamantahprabodhine | nityanandasvarupaya
    yogine brahmane namah || 69|| yo'sau vibhutibhih sarvamatmadehasamudbhavaih | avritya bahudha bhati
    bhushanairiva hatakah || 70|| namani yasya punyani japanto jantavah param | padam gacchanti kalyanam
    namastasmai mahatmane || 71|| om namo vasudevaya krishnaya paramatmane | bhaktapriyaya shantaya bhuktimuktipradayine
    || 72|| namo namah pankajalocanaya namo namah pankajabhushanaya | bhaktapriyayakhilalokadhamne namo
    namo nadanavambujaya || 73|| iti tamraparnimahatmye ashtatrimshadhyayantargatam vyasakritam krishnastotram
    sampurnam | tamraparnimahatmya | adhyaya 38
  devanagari: व्यासकृतं कृष्णस्तोत्रम् व्यास उवाच । नमःपरमशान्ताय निगमान्तःप्रबोधिने । नित्यानन्दस्वरूपाय
    योगिने ब्रह्मणे नमः ॥ ६९॥ योऽसौ विभूतिभिः सर्वमात्मदेहसमुद्भवैः । आवृत्य बहुधा भाति भूषणैरिव हाटकः
    ॥ ७०॥ नामानि यस्य पुण्यानि जपन्तो जन्तवः परम् । पदं गच्छन्ति कल्याणं नमस्तस्मै महात्मने ॥ ७१॥ ॐ नमो
    वासुदेवाय कृष्णाय परमात्मने । भक्तप्रियाय शान्ताय भुक्तिमुक्तिप्रदायिने ॥ ७२॥ नमो नमः पङ्कजलोचनाय
    नमो नमः पङ्कजभूषणाय । भक्तप्रियायाखिललोकधाम्ने नमो नमो नादनवाम्बुजाय ॥ ७३॥ इति ताम्रपर्णीमाहात्म्ये
    अष्टात्रिंशाध्यायान्तर्गतं व्यासकृतं कृष्णस्तोत्रं सम्पूर्णम् । ताम्रपर्णीमाहात्म्य । अध्याय ३८
