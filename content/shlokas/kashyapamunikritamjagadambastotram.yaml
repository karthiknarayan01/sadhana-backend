id: kashyapamunikritamjagadambastotram
category: stotram
name:
  english: kashyapamunikritamjagadambastotram
  devanagari: काश्यपमुनिकृतंजगदम्बास्तोत्रम्
content:
  english: kashyapamunikritam jagadambastotram kashyapa uvaca | matah shankaradayite mayi te karuna kuto
    nasti | bho'si tvam jagadamba jagatah kim mam bahirnayasi || 8|| devi tvam surahetordharmadrohinamashu
    hamsi matah | uttamasamskritabhasham tvam kuru mlecchamshca mohayeh shighram || 9|| amba tvam bahurupa
    hunkara ddhumralocanam hamsi | bhimam durgadaityam hatva jagatam sukham nayasi || 10|| dambham moham
    ghoram garvam hatva sada sukham sheshe | bodhaya matarjagato dushtannashtankuru tvam vai | tada prasanna
    sa devi bho munestasya manase || 11|| vasam kritva dadau jnanam mishradeshe munirgatah | iti bhavishyapurane
    pratisargaparvani prathamakhande shashthadhyayantargatam kashyapamunikritam jagadambastotram samaptam
    | bhavishyapurana | pratisargaparva | prathamakhanda | adhyaya 6
  devanagari: काश्यपमुनिकृतं जगदम्बास्तोत्रम् काश्यप उवाच । मातः शङ्करदयिते मयि ते करुणा कुतो नास्ति ।
    भोऽसि त्वं जगदम्बा जगतः किं मां बहिर्नयसि ॥ ८॥ देवि त्वं सुरहेतोर्धर्मद्रोहिणमाशु हंसि मातः । उत्तमसंस्कृतभाषां
    त्वं कुरु म्लेच्छांश्च मोहयेः शीघ्रम् ॥ ९॥ अम्ब त्वं बहुरूपा हुङ्कारा द्धूम्रलोचनं हंसि । भीमं दुर्गादैत्यं
    हत्वा जगतां सुखं नयसि ॥ १०॥ दम्भं मोहं घोरं गर्वं हत्वा सदा सुखं शेषे । बोधय मातर्जगतो दुष्टान्नष्टान्कुरु
    त्वं वै । तदा प्रसन्ना सा देवी भो मुनेस्तस्य मानसे ॥ ११॥ वासं कृत्वा ददौ ज्ञानं मिश्रदेशे मुनिर्गतः
    । इति भविष्यपुराणे प्रतिसर्गपर्वणि प्रथमखण्डे षष्ठाध्यायान्तर्गतं काश्यपमुनिकृतं जगदम्बास्तोत्रं समप्तम्
    । भविष्यपुराण । प्रतिसर्गपर्व । प्रथमखण्ड । अध्याय ६
