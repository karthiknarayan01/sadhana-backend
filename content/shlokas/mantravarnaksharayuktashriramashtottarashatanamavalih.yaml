id: mantravarnaksharayuktashriramashtottarashatanamavalih
category: mantra
name:
  english: mantravarnaksharayuktashriramashtottarashatanamavalih
  devanagari: मन्त्रवर्णाक्षरयुक्तश्रीरामाष्टोत्तरशतनामावलिः
content:
  english: ringararasasampurnamandalantassudhakaraya namah | shrikanthakarakodandaparikshitaparakramaya
    namah | shrimatsrishtyadi vividhakaryakaranamurtimate namah | shrivatsalanchanatyantamanibhushanabhushitaya
    namah | shribhunilalinganotthapulakankitavigrahaya namah | shrimadamlanatulasivanamalavirajitaya namah
    | shrisambadevahritpadmavikasanadivakaraya namah | shrikshiravardhiparyankaviharatyantabalakaya namah
    | shrimatsuraradhyapadayugapadmavirajitaya namah | shrikarakarakodandakandopetakarambujaya namah |
    shrijanakimukhambhojamandaniyaprabhakaraya namah | shrirajadhirajarajendraramaniyagunakaraya namah
    | ravanadivadhodyaktavijrimbhitaparakramaya namah || 20 rakendvarkagnivimalanetratrayavibhushitaya
    namah | ratrincaraughamattebhavinirbhedamrigeshvaraya namah | rajatsaudaminitulyadivyakodandamandanaya
    namah | ramamanojnavakshojadivyagandhasuvasitaya namah | rakshaseshvarasamsevyadivyashripadapankajaya
    namah | rakendukulasambhutaramaniprananayakaya namah | ratnanirmitabhushadhyacaranambujashobhitaya
    namah | ramajanamanoharidivyakandarpavigrahaya namah | raghavanvayasanjatanripashrenishiromanaye namah
    | rakashashisamakaravaktramandalamanditaya namah | ravanasurakasaracandabhanusharottamaya namah |
    ramavakshojakasturivasanasvadalolupaya namah | ranatsangitasampurnasahasrastambhamandapaya namah |
    ratnamancasthasaundaryavanitajanaveshtitaya namah | ranatkinkinisamshobhimandalikritakarmukaya namah
    | ratnaughakantivilasaddolakhelanashilanaya namah | manikyojjvalasandiptakundaladvayamanditaya namah
    | maninijanamadhyastha saundaryatishayashrayaya namah | mandasmitananambhojamohitanekatapasaya namah
    | mayamaricasamharakarananandavigrahaya namah || 40 makarakshadidussadhyadushtadarpapaharakaya namah
    | madyanmadhukaravratavilasatkeshasamvritaya namah | manobuddhindriyapranavagadinam vilakshanaya namah
    | manassankalpamatrena nirmitajandakotikaya namah | marutatmajasamsevyadivyashricaranambujaya namah
    | mayamanushaveshena mayikasurakhandanaya namah | martandakotijvalitamakarakarakundalaya namah | malatitulasimalyavasitakhilavigrahaya
    namah | marakotipratikashamahadadbhutadehabhrite namah | mahaniyadayaveshakalitapangalocanaya namah
    | makarandarasasvadamadhuryagunabhushanaya namah | mahadevasamaradhyamaninirmitapadukaya namah | mahamanikyakhacitakhandatunidhanurdharaya
    namah | mandarodbhutadugdhabdhibindupunjivibhushanaya namah | yakshakinnaragandharvastuyamanaparakramaya
    namah | yatnapurvajananandasandhanacaturodyamaya namah | yamadyashtangashiladiyamihritpadmagocaraya
    namah | yashodahridayanandasindhupurnasudhakaraya namah | yajnavalkyadi rishibhissamsevitapadadvayaya
    namah | yamalarjunapapaughapariharipadambujaya namah || 60 yakinikulasambhutapidajalapaharakaya namah
    | yadahpatipayahkshebhakaribanasharasanaya namah | yaminipadmininathakrita shrikarnakundalaya namah
    | yatudhanagranibhutavibhishanavarapradaya namah | yagapavakasanjatadraupadimanarakshakaya namah |
    yaksharakshahshikshanarthamudyadbhishanasayakaya namah | yamardhena dashagrivasainyanirmulanastravide
    namah | yajananandasandohamandasmitamukhambujaya namah | yamalagamavedaikastuyamanayashodhanaya namah
    | yakinisakinisthanashadadharambujashrayaya namah | yatindravrindasamsevyamanakhandaprabhakaraya namah
    | yathocitantaryagadipujaniyamaheshvaraya namah | nanavedadivedantaih prashamsitanijakritaye namah
    | naradadimunipremanandasandohavardhanaya namah | nagarajankaparyankashayisundaravigrahaya namah |
    nagarimanisankashadehakantivirajitaya namah | nagendraphanisopananrityalilavisharadaya namah | namadgirvanamukutamaniranjitapadukaya
    namah | nagendrabhushanaprematishayapranavallabhaya namah | nanaprasunavilasadvanamalavirajitaya namah
    || 80 navaratnavalishobhitapadatalamastakaya namah | navamalliprasunabhishobhamanashiroruhaya namah
    | nalinishankhacakrasigadasharngeshukhetadhrite namah | nadanusandhanaparivalokyanijakritaye namah
    | narasurasuravratakritapujopaharakaya namah | nakhakotiprabhajalavyaptabrahmandamandapaya namah |
    natashrikarasaundaryakarunapangavikshanaya namah | navadurvadalashyamasha
  devanagari: ृङ्गाररससम्पूर्णमण्डलान्तस्सुधाकराय नमः । श्रीकण्ठकरकोदण्डपरीक्षितपराक्रमाय नमः । श्रीमत्सृष्ट्यादि
    विविधकार्यकारणमूर्तिमते नमः । श्रीवत्सलाञ्छनात्यन्तमणिभूषणभूषिताय नमः । श्रीभूनीलालिङ्गनोत्थपुलकाङ्कितविग्रहाय
    नमः । श्रीमदम्लानतुलसीवनमालाविराजिताय नमः । श्रीसाम्बदेवहृत्पद्मविकासनदिवाकराय नमः । श्रीक्षीरवार्धिपर्यङ्कविहारात्यन्तबालकाय
    नमः । श्रीमत्सुराराध्यपादयुगपद्मविराजिताय नमः । श्रीकराकारकोदण्डकाण्डोपेतकराम्बुजाय नमः । श्रीजानकीमुखाम्भोजमण्डनीयप्रभाकराय
    नमः । श्रीराजाधिराजराजेन्द्ररमणीयगुणाकराय नमः । रावणादिवधोद्यक्तविजृम्भितपराक्रमाय नमः ॥ २० राकेन्द्वर्काग्निविमलनेत्रत्रयविभूषिताय
    नमः । रात्रिञ्चरौघमत्तेभविनिर्भेदमृगेश्वराय नमः । राजत्सौदामिनीतुल्यदिव्यकोदण्डमण्डनाय नमः । रमामनोज्ञवक्षोजदिव्यगन्धसुवासिताय
    नमः । राक्षसेश्वरसंसेव्यदिव्यश्रीपादपङ्कजाय नमः । राकेन्दुकुलसम्भूतरमणीप्राणनायकाय नमः । रत्ननिर्मितभूषाढ्यचरणाम्बुजशोभिताय
    नमः । रामाजनमनोहारिदिव्यकन्दर्पविग्रहाय नमः । राघवान्वयसञ्जातनृपश्रेणिशिरोमणये नमः । राकाशशिसमाकारवक्त्रमण्डलमण्डिताय
    नमः । रावणासुरकासारचण्डभानुशरोत्तमाय नमः । रमावक्षोजकस्तूरिवासनास्वादलोलुपाय नमः । रणत्सङ्गीतसम्पूर्णसहस्रस्तम्भमण्डपाय
    नमः । रत्नमञ्चस्थसौन्दर्यवनिताजनवेष्टिताय नमः । रणत्किङ्किणिसंशोभिमण्डलीकृतकार्मुकाय नमः । रत्नौघकान्तिविलसड्डोलाखेलनशीलनाय
    नमः । माणिक्योज्ज्वलसन्दीप्तकुण्डलद्वयमण्डिताय नमः । मानिनीजनमध्यस्थ सौन्दर्यातिशयाश्रयाय नमः । मन्दस्मिताननाम्भोजमोहितानेकतापसाय
    नमः । मायामारीचसंहारकारणानन्दविग्रहाय नमः ॥ ४० मकराक्षादिदुस्साध्यदुष्टदर्पापहारकाय नमः । माद्यन्मधुकरव्रातविलसत्केशसंवृताय
    नमः । मनोबुद्धीन्द्रियप्राणवागादीनां विलक्षणाय नमः । मनस्सङ्कल्पमात्रेण निर्मिताजाण्डकोटिकाय नमः ।
    मारुतात्मजसंसेव्यदिव्यश्रीचरणाम्बुजाय नमः । मायामानुषवेषेण मायिकासुरखण्डनाय नमः । मार्तण्डकोटिज्वलितमकराकारकुण्डलाय
    नमः । मालतीतुलसीमाल्यवासिताखिलविग्रहाय नमः । मारकोटिप्रतीकाशमहदद्भुतदेहभृते नमः । महनीयदयावेशकलितापाङ्गलोचनाय
    नमः । मकरन्दरसास्वादमाधुर्यगुणभूषणाय नमः । महादेवसमाराध्यमणिनिर्मितपादुकाय नमः । महामाणिक्यखचिताखण्डतूणीधनुर्धराय
    नमः । मन्दरोद्भूतदुग्धाब्धिबिन्दुपुञ्जिविभूषणाय नमः । यक्षकिन्नरगन्धर्वस्तूयमानपराक्रमाय नमः । यत्नपूर्वजनानन्दसन्धानचतुरोद्यमाय
    नमः । यमाद्यष्टाङ्गशीलादियमिहृत्पद्मगोचराय नमः । यशोदाहृदयानन्दसिन्धुपूर्णसुधाकराय नमः । याज्ञवल्क्यादि
    ऋषिभिस्संसेवितपदद्वयाय नमः । यमलार्जुनपापौघपरिहारिपदाम्बुजाय नमः ॥ ६० याकिनीकुलसम्भूतपीडाजालापहारकाय
    नमः । यादःपतिपयःक्षेभकारिबाणशरासनाय नमः । यामिनीपद्मिनीनाथकृत श्रीकर्णकुण्डलाय नमः । यातुधानाग्रणीभूतविभीषणवरप्रदाय
    नमः । यागपावकसञ्जातद्रौपदीमानरक्षकाय नमः । यक्षरक्षःशिक्षणार्थमुद्यद्भीषणसायकाय नमः । यामार्धेन दशग्रीवसैन्यनिर्मूलनास्त्रविदे
    नमः । यजनानन्दसन्दोहमन्दस्मितमुखाम्बुजाय नमः । यामलागमवेदैकस्तूयमानयशोधनाय नमः । याकिनीसाकिनीस्थानषडाधाराम्बुजाश्रयाय
    नमः । यतीन्द्रवृन्दसंसेव्यमानाखण्डप्रभाकराय नमः । यथोचितान्तर्यागादिपूजनीयमहेश्वराय नमः । नानावेदादिवेदान्तैः
    प्रशंसितनिजाकृतये नमः । नारदादिमुनिप्रेमानन्दसन्दोहवर्धनाय नमः । नागराजाङ्कपर्यङ्कशायिसुन्दरविग्रहाय
    नमः । नागारिमणिसङ्काशदेहकान्तिविराजिताय नमः । नागेन्द्रफणिसोपाननृत्यलीलाविशारदाय नमः । नमद्गीर्वाणमुकुटमणिरञ्जितपादुकाय
    नमः । नागेन्द्रभूषणप्रेमातिशयप्राणवल्लभाय नमः । नानाप्रसूनविलसद्वनमालाविराजिताय नमः ॥ ८० नवरत्नावलीशोभितापादतलमस्तकाय
    नमः । नवमल्लीप्रसूनाभिशोभमानशिरोरुहाय नमः । नलिनीशङ्खचक्रासिगदाशार्ङ्गेषुखेटधृते नमः । नादानुसन्धानपरीवलोक्यनिजाकृतये
    नमः । नरासुरसुरव्रातकृतपूजोपहारकाय नमः । नखकोटिप्रभाजालव्याप्तब्रह्माण्डमण्डपाय नमः । नतश्रीकरसौन्दर्यकरुणापाङ्गवीक्षणाय
    नमः । नवदूर्वादलश्यामश
