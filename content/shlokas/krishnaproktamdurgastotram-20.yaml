id: krishnaproktamdurgastotram-20
category: stotram
name:
  english: krishnaproktamdurgastotram 20
  devanagari: कृष्णप्रोक्तंदुर्गास्तोत्रम् २०
content:
  english: shrikrishnaproktam durgastotram 20 shrikrishna uvaca | tvameva sarvajanani mulaprakritirishvari
    | tvamevadya srishtividhau svecchaya trigunatmika || 7|| karyarthe saguna tvam ca vastuto nirguna
    svayam | parabrahmasvarupa tvam satya nitya sanatani || 8|| tejassvarupa parama bhaktanugravigraha
    | sarvasvarupa sarvesha sarvadhara paratpara || 9|| sarvabijasvarupa ca sarvapujya nirashraya | sarvajna
    sarvatobhadra sarvamangalamangala || 10|| sarvabuddhisvarupa ca sarvashaktisvarupini | sarvajnanaprada
    devi sarvajna sarvabhavini || 11|| tvam svaha devadane ca pitridane svadha svayam | dakshina sarvadane
    ca sarvashaktisvarupini || 12|| nidra tvam ca daya tvam ca trishna tvam catmanah priya | kshutkshantih
    shantirisha ca shantih srishtishca shashvati || 13|| shraddha pushtishca tandra ca lajja shobha daya
    tatha | satam sampatsvarupa shrirvipattirasatamiha || 14|| pritirupa punyavatam papinam kalahankura
    | shashvatkarmamayi shaktih sarvada sarvajivinam || 15|| devebhyah svapado datri dhaturdhatri kripamayi
    | hitaya sarvadevanam sarvasuravinashini || 16|| yoginidra yogarupa yogadatri ca yoginam | siddhisvarupa
    siddhanam siddhida siddhayogini || 17|| brahmani maheshvari ca vishnumaya ca vaishnavi | bhadrada
    bhadrakali ca sarvalokabhayankari || 18|| grame grame gramadevi grihadevi grihe grihe | satam kirttih
    pratishtha ca ninda tvamasatam sada || 19|| mahayuddhe mahamari dushtasamhararupini | rakshasvarupa
    shishtanam mateva hitakarini || 20|| vandya pujya stuta tvam ca brahmadinam ca sarvada | brahmanyarupa
    vipranam tapasya ca tapasvinam || 21|| vidya vidyavatam tvam ca buddhirbuddhimatam satam | medha smritisvarupa
    ca pratibha pratibhavatam || 22|| rajnam prataparupa ca visham vanijyarupini | srishtau srishtisvarupa
    tvam raksharupa ca palane || 23|| tatha'nte tvam mahamari vishve vishvaishca pujite | kalaratrirmaharatrirmoharatrishca
    mohini || 24|| duratyaya me maya tvam yaya sammohitam jagat | yaya mugdho hi vidvamshca mokshamargam
    na pashyati || 25|| ityatmana kritam stotram durgaya durganashanam | pujakale pathedyo hi siddhirbhavati
    vanchita || 26|| vandhya ca kakavandhya ca mritavatsa ca durbhaga | shrutva stotram varshamekam suputram
    labhate dhuvam || 27|| karagare mahaghore yo baddho dridhabandhane | shrutva stotram masamekam bandhananmucyate
    dhuvam || 28|| yakshmagrasto galatkushthi mahashuli mahajvari | shrutva stotram varshamekam sadyo
    rogatpramucyate || 29|| putrabhede prajabhede patnibhede ca durgatah | shrutva stotram masamekam labhate
    natra samshayah || 30|| rajadvare shmashane ca maharanye ranasthale | himsrajantusamipe ca shrutva
    stotram pramucyate || 31|| grihadahe ca davagnau dasyusainyasamanvite | stotrashravanamatrena labhate
    natra samshayah || 32|| mahadaridro murkhashca varsham stotram pathettu yah | vidyavandhanavamshcaiva
    sa bhavennatra samshayah || 33|| iti shribrahmavaivarte mahapurane dvitiye prakritikhande naradanarayanasamvade
    durgopakhyane durgastotram nama shatshashtitamo'dhyayah || 66|| brahmavaivartapurana | prakritikhanda
    | adhyaya 67pothi || 66
  devanagari: श्रीकृष्णप्रोक्तं दुर्गास्तोत्रम् २० श्रीकृष्ण उवाच । त्वमेव सर्वजननी मूलप्रकृतिरीश्वरी
    । त्वमेवाद्या सृष्टिविधौ स्वेच्छया त्रिगुणात्मिका ॥ ७॥ कार्यार्थे सगुणा त्वं च वस्तुतो निर्गुणा स्वयम्
    । परब्रह्मस्वरूपा त्वं सत्या नित्या सनातनी ॥ ८॥ तेजस्स्वरूपा परमा भक्तानुग्रविग्रहा । सर्वस्वरूपा
    सर्वेशा सर्वाधारा परात्परा ॥ ९॥ सर्वबीजस्वरूपा च सर्वपूज्या निराश्रया । सर्वज्ञा सर्वतोभद्रा सर्वमङ्गलमङ्गला
    ॥ १०॥ सर्वबुद्धिस्वरूपा च सर्वशक्तिस्वरूपिणी । सर्वज्ञानप्रदा देवी सर्वज्ञा सर्वभाविनी ॥ ११॥ त्वं
    स्वाहा देवदाने च पितृदाने स्वधा स्वयम् । दक्षिणा सर्वदाने च सर्वशक्तिस्वरूपिणी ॥ १२॥ निद्रा त्वं च
    दया त्वं च तृष्णा त्वं चात्मनः प्रिया । क्षुत्क्षान्तिः शान्तिरीशा च शान्तिः सृष्टिश्च शाश्वती ॥ १३॥
    श्रद्धा पुष्टिश्च तन्द्रा च लज्जा शोभा दया तथा । सतां सम्पत्स्वरूपा श्रीर्विपत्तिरसतामिह ॥ १४॥ प्रीतिरूपा
    पुण्यवतां पापिनां कलहाङ्कुरा । शश्वत्कर्ममयी शक्तिः सर्वदा सर्वजीविनाम् ॥ १५॥ देवेभ्यः स्वपदो दात्री
    धातुर्धात्री कृपामयी । हिताय सर्वदेवानां सर्वासुरविनाशिनी ॥ १६॥ योगिनिद्रा योगरूपा योगदात्री च योगिनाम्
    । सिद्धिस्वरूपा सिद्धानां सिद्धिदा सिद्धयोगिनी ॥ १७॥ ब्रह्माणी माहेश्वरी च विष्णुमाया च वैष्णवी ।
    भद्रदा भद्रकाली च सर्वलोकभयङ्करी ॥ १८॥ ग्रामे ग्रामे ग्रामदेवी गृहदेवी गृहे गृहे । सतां कीर्त्तिः
    प्रतिष्ठा च निन्दा त्वमसतां सदा ॥ १९॥ महायुद्धे महामारी दुष्टसंहाररूपिणी । रक्षास्वरूपा शिष्टानां
    मातेव हितकारिणी ॥ २०॥ वन्द्या पूज्या स्तुता त्वं च ब्रह्मादीनां च सर्वदा । ब्रह्मण्यरूपा विप्राणां
    तपस्या च तपस्विनाम् ॥ २१॥ विद्या विद्यावतां त्वं च बुद्धिर्बुद्धिमतां सताम् । मेधा स्मृतिस्वरूपा च
    प्रतिभा प्रतिभावताम् ॥ २२॥ राज्ञां प्रतापरूपा च विशां वाणिज्यरूपिणी । सृष्टौ सृष्टिस्वरूपा त्वं रक्षारूपा
    च पालने ॥ २३॥ तथाऽन्ते त्वं महामारी विश्वे विश्वैश्च पूजिते । कालरात्रिर्महारात्रिर्मोहरात्रिश्च मोहिनी
    ॥ २४॥ दुरत्यया मे माया त्वं यया सम्मोहितं जगत् । यया मुग्धो हि विद्वांश्च मोक्षमार्गं न पश्यति ॥ २५॥
    इत्यात्मना कृतं स्तोत्रं दुर्गाया दुर्गनाशनम् । पूजाकाले पठेद्यो हि सिद्धिर्भवति वाञ्छिता ॥ २६॥ वन्ध्या
    च काकवन्ध्या च मृतवत्सा च दुर्भगा । श्रुत्वा स्तोत्रं वर्षमेकं सुपुत्रं लभते धुवम् ॥ २७॥ कारागारे
    महाघोरे यो बद्धो दृढबन्धने । श्रुत्वा स्तोत्रं मासमेकं बन्धनान्मुच्यते धुवम् ॥ २८॥ यक्ष्मग्रस्तो गलत्कुष्ठी
    महाशूली महाज्वरी । श्रुत्वा स्तोत्रं वर्षमेकं सद्यो रोगात्प्रमुच्यते ॥ २९॥ पुत्रभेदे प्रजाभेदे पत्नीभेदे
    च दुर्गतः । श्रुत्वा स्तोत्रं मासमेकं लभते नात्र संशयः ॥ ३०॥ राजद्वारे श्मशाने च महारण्ये रणस्थले
    । हिंस्रजन्तुसमीपे च श्रुत्वा स्तोत्रं प्रमुच्यते ॥ ३१॥ गृहदाहे च दावाग्नौ दस्युसैन्यसमन्विते । स्तोत्रश्रवणमात्रेण
    लभते नात्र संशयः ॥ ३२॥ महादरिद्रो मूर्खश्च वर्षं स्तोत्रं पठेत्तु यः । विद्यावान्धनवांश्चैव स भवेन्नात्र
    संशयः ॥ ३३॥ इति श्रीब्रह्मवैवर्ते महापुराणे द्वितीये प्रकृतिखण्डे नारदनारायणसंवादे दुर्गोपाख्याने
    दुर्गास्तोत्रं नाम षट्षष्टितमोऽध्यायः ॥ ६६॥ ब्रह्मवैवर्तपुराण । प्रकृतिखण्ड । अध्याय ६७पोथी ॥ ६६
