id: divyamangaladhyanam
category: shataka
name:
  english: divyamangaladhyanam
  devanagari: दिव्यमन्गलाध्यानम्
content:
  english: ringaravihararasapeshalam || 43|| shadvidhaikyanusandhanaparaciddhamni samsthitam | shadambhoruhacakrantasphurjatsaudaminiprabham
    || 44|| shadvaktragajavaktrabhyam parshvayorupashobhitam | animadyavritamadyamanimadyashtasiddhidam
    || 45|| sakritsmaranamatrena virincadipadapradam | kalyanagunasampannam nityakalyanadayinim || 46||
    sarvamangaladam devim sarvamangalavigraham | anekajanmasamsiddhasukritaradhyapadukam || 47|| sarvalokaikajananim
    sarvalokaikanayikam | sacamarabhyam shrivagbhyam parshvayorupajivitam || 48|| mantrinidandininitividhanakarnanotsukam
    | kalacivitikacchatrabhringaradarshapadukam || 49|| manivinam shukam sharim talavrintam kamandalum
    | panapatram svarnavetram purnasvarnaghatadvayam || 50|| jayakahalikabherishankhadundubhimaddalam
    | divyani dhupapatrani tatha sauvarnadipikah || 51|| bibhratibhishca balannapurnatarabhiravritam |
    gayatrya caiva savitrya siddhalakshmyadishaktibhih || 52|| vagvadinya nakulya ca turangarudhaya''vritam
    | sampatkarya ca samrajyalakshmya ca kurukulyaya || 53|| padmavatya renukaya bhimavatya ca durgaya
    | nilakarnya mahakalya bhadrakalya ca bhadraya || 54|| gangadyabhissaridbhishca matribhishca susevitam
    | mahashododitasheshadevataganasevitam || 55|| ganeshagrahanakshatrayoginirashirupinim | pancashatpithamadhyastham
    pancashadvarnarupinim || 56|| navacakratmikam devim navacakradhidevatam | nityanandamayim nityam nityashodashikanvitam
    || 57|| odyanapithanilayam gurumandalamanditam | anekayoginivrindairanimadyairmahojjvalaih || 58||
    kotikotiprabhedaishca balarkadyutisannibhaih | catussamayadevibhi shadvidhairyoginiganaih || 59||
    shaddarshanadhidevaishca shadamnayadhidaivataih | caturayatanodbhasi ganesharkaharishvaraih || 60||
    navavaranadevibhirnnavadha yoginiganaih | sevitamarunanekakotikotyarkapatalam || 61|| anekakotibhishcaiva
    balarkayutasannibhaih | brahmanikotisahitairbrahmakotibhiravritam || 62|| namaparayanodyuktairllakshminarayanaih
    stutam | jvalanmanyubhiratyugraih shatarudriyasamjnitaih || 63|| rudranikotisahitai rudrakotibhiravritam
    | anekaghorasharabhairbadavanalabhairavaih || 64|| durgabhih kalikabhishca mahakalyaishca samvritam
    | makalibhishca ganapairvirabhadraishca vatukaih kshetrapalakaih || 65|| sukumaraih kumaraishca tatha
    hariharatmajaih | anekakotidikpalaishcandrarkavasukotibhih || 66|| sanakadyaishca yogindraih saptarshinanca
    kotibhih | naradadisurarshinam kotibhih parisevitam || 67|| apsaroyakshagandharvakinnarananca kotibhih
    | kotibhirguhyakananca savidyadharakotibhih || 68|| shankhapadmanidhinanca kotibhih parisevitam |
    bhairavibhairavanekakotikotibhiravritam || 69|| surasuranam kotinam kotibhih parisevitam | sarvamantramayim
    devim saccidanandarupinim || 70|| icchajnanakriyarupamicchakalitavigraham | paradivaikharirupam mahamayam
    paratparam || 71|| mahalakshmim mahadevim mahatripurasundarim | jagadahladajananim jagatsankalpavigraham
    || 72|| jagadujjivanodyuktam jagadranjanakarinim | rajarajeshvarankastham rajarajeshvarim shivam ||
    73|| evam dhyayetparashaktim hridi shricakrarupake | purvoktanyasashuddhatma satmabhedena bhavayet
    || 74|| antaryagrakramenaiva siddhadaivasamanvitah | raktambarasragalepo raktabhushanabhushitah ||
    75|| laksharunagrihe sthitva pujam kuryat samahitah | avahanadibhedaishca dashamudrah pradarshayet
    || 76|| saubhagyadandinimudram ripujihvagrayantrinim | shaktisancalanam kuryanmukhaveshtanamacaret
    || 77|| yathashakti japedvidvan shrividyam sarvasiddhidam | shaktanca tilakam kuryat shaktilakshanacihnitam
    || 78|| punah sauvarnaya caiva galordhvam vinyasedbudhah | vyapakante yonimudram mukhe kshiptvabhivadayet
    || 79|| samharanca tatah srishtim sthitinyasam samacaret | rishyadikanyasajalam shadanganyasamacaret
    || 80|| brahmarandhre nyasetpurvam manibandhadvaye tatha | lalate'namikam kritva trailokyasyapyaham
    prabhuh || 81|| gurupadishtamargena pranayamam samacaret | kramapujaparo mantri shricakrarcanapurvakam
    || 82|| bindubindudvayarudham hardayonisvarupakam | mahakamakalarupamatmanam bhavayetsudhih || 83||
    sampurnancintayedvidvan brahmarandhrarunaprabham | dravatsutashodasharnam sarvasaubhagyadam smaret
    || 84|| shodasharnamahamantram mantrarajottamottamam | sakritsmaranamatrena kotijanmaghanashanam ||
    85|| mahapatakakotinam marjanam smritimatratah | upavatakadaurbhagyashamanam bhuktimuktidam || 86||
    visharogadidaridryamrityusamharakarakam | saptakotimahamantraparayanaphalapradam || 87|| catuhsamudraparyantabhudanaphaladam
    shive
  devanagari: ृङ्गारविहाररसपेशलाम् ॥ ४३॥ षड्विधैक्यानुसन्धानपरचिद्धाम्नि संस्थिताम् । षडम्भोरुहचक्रान्तस्फूर्जत्सौदामिनीप्रभाम्
    ॥ ४४॥ षड्वक्त्रगजवक्त्राभ्यां पार्श्वयोरुपशोभिताम् । अणिमाद्यावृतामाद्यामणिमाद्यष्टसिद्धिदाम् ॥ ४५॥
    सकृत्स्मरणमात्रेण विरिञ्चादिपदप्रदाम् । कल्याणगुणसम्पन्नां नित्यकल्याणदायिनीम् ॥ ४६॥ सर्वमङ्गलदां
    देवीं सर्वमङ्गलविग्रहाम् । अनेकजन्मसंसिद्धसुकृताराध्यपादुकाम् ॥ ४७॥ सर्वलोकैकजननीं सर्वलोकैकनायिकाम्
    । सचामराभ्यां श्रीवाग्भ्यां पार्श्वयोरुपजीविताम् ॥ ४८॥ मन्त्रिणीदण्डिनीनीतिविधानाकर्णनोत्सुकाम् ।
    कलाचीवीटिकाच्छत्रभृङ्गारादर्शपादुकाम् ॥ ४९॥ मणिवीणां शुकं शारीं तालवृन्तं कमण्डलुम् । पानपत्रं स्वर्णवेत्रं
    पूर्णस्वर्णघटद्वयम् ॥ ५०॥ जयकाहलिकाभेरीशङ्खदुन्दुभिमद्दलाम् । दिव्यानि धूपपात्राणि तथा सौवर्णदीपिकाः
    ॥ ५१॥ बिभ्रतीभिश्च बालान्नपूर्णताराभिरावृताम् । गायत्र्या चैव सावित्र्या सिद्धलक्ष्म्यादिशक्तिभिः
    ॥ ५२॥ वाग्वादिन्या नकुल्या च तुरङ्गारूढयाऽऽवृताम् । सम्पत्कर्या च साम्राज्यलक्ष्म्या च कुरुकुल्यया
    ॥ ५३॥ पद्मवत्या रेणुकया भीमवत्या च दुर्गया । नीलकर्ण्या महाकाल्या भद्रकाल्या च भद्रया ॥ ५४॥ गङ्गाद्याभिस्सरिद्भिश्च
    मातृभिश्च सुसेविताम् । महाषोडोदिताशेषदेवतागणसेविताम् ॥ ५५॥ गणेशग्रहनक्षत्रयोगिनीराशिरूपिणीम् । पञ्चाशत्पीठमध्यस्थां
    पञ्चाशद्वर्णरूपिणीम् ॥ ५६॥ नवचक्रात्मिकां देवीं नवचक्राधिदेवताम् । नित्यानन्दमयीं नित्यां नित्यषोडशिकान्विताम्
    ॥ ५७॥ ओड्याणपीठनिलयां गुरुमण्डलमण्डिताम् । अनेकयोगिनीवृन्दैरणिमाद्यैर्महोज्ज्वलैः ॥ ५८॥ कोटिकोटिप्रभेदैश्च
    बालार्कद्युतिसन्निभैः । चतुस्समयदेवीभी षड्विधैर्योगिनीगणैः ॥ ५९॥ षड्दर्शनाधिदेवैश्च षडाम्नायाधिदैवतैः
    । चतुरायतनोद्भासि गणेशार्कहरीश्वरैः ॥ ६०॥ नवावरणदेवीभिर्न्नवधा योगिनीगणैः । सेवितामरुणानेककोटिकोट्यर्कपाटलाम्
    ॥ ६१॥ अनेककोटिभिश्चैव बालार्कायुतसन्निभैः । ब्रह्माणीकोटिसहितैर्ब्रह्मकोटिभिरावृताम् ॥ ६२॥ नामपारायणोद्युक्तैर्ल्लक्ष्मीनारायणैः
    स्तुताम् । ज्वलन्मन्युभिरत्युग्रैः शतरुद्रीयसंज्ञितैः ॥ ६३॥ रुद्राणीकोटिसहितै रुद्रकोटिभिरावृताम्
    । अनेकाघोरशरभैर्बडवानलभैरवैः ॥ ६४॥ दुर्गाभिः कालिकाभिश्च महाकाल्यैश्च संवृताम् । माकालीभिश्च गणपैर्वीरभद्रैश्च
    वटुकैः क्षेत्रपालकैः ॥ ६५॥ सुकुमारैः कुमारैश्च तथा हरिहरात्मजैः । अनेककोटिदिक्पालैश्चन्द्रार्कवसुकोटिभिः
    ॥ ६६॥ सनकाद्यैश्च योगीन्द्रैः सप्तर्षीणाञ्च कोटिभिः । नारदादिसुरर्षीणां कोटिभिः परिसेविताम् ॥ ६७॥
    अप्सरोयक्षगन्धर्वकिन्नराणाञ्च कोटिभिः । कोटिभिर्गुह्यकानाञ्च सविद्याधरकोटिभिः ॥ ६८॥ शङ्खपद्मनिधीनाञ्च
    कोटिभिः परिसेविताम् । भैरवीभैरवानेककोटिकोटिभिरावृताम् ॥ ६९॥ सुरासुराणां कोटीनां कोटिभिः परिसेविताम्
    । सर्वमन्त्रमयीं देवीं सच्चिदानन्दरूपिणीम् ॥ ७०॥ इच्छाज्ञानक्रियारूपामिच्छाकलितविग्रहाम् । परादिवैखरीरूपां
    महामायां परात्पराम् ॥ ७१॥ महालक्ष्मीं महादेवीं महात्रिपुरसुन्दरीम् । जगदाह्लादजननीं जगत्सङ्कल्पविग्रहाम्
    ॥ ७२॥ जगदुज्जीवनोद्युक्तां जगद्रञ्जनकारिणीम् । राजराजेश्वराङ्कस्थां राजराजेश्वरीं शिवाम् ॥ ७३॥ एवं
    ध्यायेत्पराशक्तिं हृदि श्रीचक्ररूपके । पूर्वोक्तन्यासशुद्धात्मा सात्माभेदेन भावयेत् ॥ ७४॥ अन्तर्याग्रक्रमेणैव
    सिद्धदैवसमन्वितः । रक्ताम्बरस्रगालेपो रक्तभूषणभूषितः ॥ ७५॥ लाक्षारुणगृहे स्थित्वा पूजां कुर्यात् समाहितः
    । आवाहनादिभेदैश्च दशमुद्राः प्रदर्शयेत् ॥ ७६॥ सौभाग्यदण्डिनीमुद्रां रिपुजिह्वाग्रयन्त्रिणीम् । शक्तिसञ्चलनं
    कुर्यन्मुखवेष्टनमाचरेत् ॥ ७७॥ यथाशक्ति जपेद्विद्वान् श्रीविद्यां सर्वसिद्धिदाम् । शाक्तञ्च तिलकं कुर्यात्
    शक्तिलक्षणचिह्नितम् ॥ ७८॥ पुनः सौवर्णया चैव गलोर्ध्वं विन्यसेद्बुधः । व्यापकान्ते योनिमुद्रां मुखे
    क्षिप्त्वाभिवादयेत् ॥ ७९॥ संहारञ्च ततः सृष्टिं स्थितिन्यासं समाचरेत् । ऋष्यादिकन्यासजालं षडङ्गन्यासमाचरेत्
    ॥ ८०॥ ब्रह्मरन्ध्रे न्यसेत्पूर्वं मणिबन्धद्वये तथा । ललटेऽनामिकां कृत्वा त्रैलोक्यस्याप्यहं प्रभुः
    ॥ ८१॥ गुरूपदिष्टमार्गेण प्राणायामं समाचरेत् । क्रमपूजापरो मन्त्री श्रीचक्रार्चनपूर्वकम् ॥ ८२॥ बिन्दुबिन्दुद्वयारूढं
    हार्दयोनिस्वरूपकम् । महाकामकलारूपमात्मानं भावयेत्सुधीः ॥ ८३॥ सम्पूर्णाञ्चिन्तयेद्विद्वान् ब्रह्मरन्ध्रारुणप्रभाम्
    । द्रवत्सुताषोडशार्णां सर्वसौभाग्यदां स्मरेत् ॥ ८४॥ षोडशार्णमहामन्त्रं मन्त्रराजोत्तमोत्तमम् । सकृत्स्मरणमात्रेण
    कोटिजन्माघनाशनम् ॥ ८५॥ महापातककोटीनां मार्जनं स्मृतिमात्रतः । उपवातकदौर्भाग्यशमनं भुक्तिमुक्तिदम्
    ॥ ८६॥ विषरोगादिदारिद्र्यमृत्युसंहारकारकम् । सप्तकोटिमहामन्त्रपारायणफलप्रदम् ॥ ८७॥ चतुःसमुद्रपर्यन्तभूदानफलदं
    शिवे
