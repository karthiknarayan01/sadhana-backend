id: shiva-mangalashtakam
category: stotram
name:
  english: Shiva Mangalashtakam
  devanagari: शिवमङ्गलाष्टकम् (भवाय चन्द्रचूडाय निर्गुणाय गुणात्मने)
content:
  english: bhavaya candracudaya nirgunaya gunatmane | kalakalaya rudraya nilagrivaya mangalam || 1|| vrisharudhaya
    bhimaya vyaghracarmambaraya ca | pashunam pataye tubhyam gaurikantaya mangalam || 2|| bhasmoddhulitadehaya
    vyalayajnopavitine | rudrakshamalabhushaya vyomakeshaya mangalam || 3|| suryacandragninetraya namah
    kailasavasine | saccidanandarupaya pramatheshaya mangalam || 4|| mrityumjayaya sambaya srishtisthityantakarine
    | tryambakaya sushantaya trilokeshaya mangalam || 5|| gamgadharaya somaya namo hariharatmane | ugraya
    tripuraghnaya vamadevaya mangalam || 6|| sadyojataya sharvaya divyajnanapradayine | ishanaya namastubhyam
    pancavaktraya mangalam || 7|| sadashivasvarupaya namastatpurushaya ca | aghorayaca ghoraya mahadevaya
    mangalam || 8|| mangalashtakametadvai shambhoryah kirtayeddine | tasya mrityubhayam nasti rogapidabhayam
    tatha || 9 || iti shrishivamangalashtakam sampurnam |
  devanagari: भवाय चन्द्रचूडाय निर्गुणाय गुणात्मने । कालकालाय रुद्राय नीलग्रीवाय मङ्गलम् ॥ १॥ वृषारूढाय
    भीमाय व्याघ्रचर्माम्बराय च । पशूनां पतये तुभ्यं गौरीकान्ताय मङ्गलम् ॥ २॥ भस्मोद्धूलितदेहाय व्यालयज्ञोपवीतिने
    । रुद्राक्षमालाभूषाय व्योमकेशाय मङ्गलम् ॥ ३॥ सूर्यचन्द्राग्निनेत्राय नमः कैलासवासिने । सच्चिदानन्दरूपाय
    प्रमथेशाय मङ्गलम् ॥ ४॥ मृत्युंजयाय सांबाय सृष्टिस्थित्यन्तकारिणे । त्र्यंबकाय सुशान्ताय त्रिलोकेशाय
    मङ्गलम् ॥ ५॥ गंगाधराय सोमाय नमो हरिहरात्मने । उग्राय त्रिपुरघ्नाय वामदेवाय मङ्गलम् ॥ ६॥ सद्योजाताय
    शर्वाय दिव्यज्ञानप्रदायिने । ईशानाय नमस्तुभ्यं पञ्चवक्त्राय मङ्गलम् ॥ ७॥ सदाशिवस्वरूपाय नमस्तत्पुरुषाय
    च । अघोरायच घोराय महादेवाय मङ्गलम् ॥ ८॥ मङ्गलाष्टकमेतद्वै शंभोर्यः कीर्तयेद्दिने । तस्य मृत्युभयं
    नास्ति रोगपीडाभयं तथा ॥ ९ ॥ इति श्रीशिवमङ्गलाष्टकं सम्पूर्णम् ।
