id: sarasvatistotrayajnavalkyabvp
category: stotram
name:
  english: sarasvatistotrayajnavalkyaBVP
  devanagari: सरस्वतीस्तोत्रयाज्नवल्क्यBVP
content:
  english: atha pancamo'dhyayah | narayana uvaca | vagdevatayah stavanam shruyatam sarvakamadam | mahamuniryajnavalkyo
    yena tushtava tam pura || 1|| gurushapacca sa munirhatavidyo babhuva ha | tada jagama duhkharto ravisthanam
    ca punyadam || 2|| samprapyatapasa suryam konarke drishtigocare | tushtava suryam shokena ruroda sa
    punah punah || 3|| suryastam pathayamasa vedavedangamishvarah | uvaca stuhi vagdevim bhaktya ca shrutihetave
    || 4|| tamityuktva dinanatho hyantardhanam jagama sah | munisnatva ca tushtava bhaktinamratmakandharah
    || 5|| yajnavalkya uvaca | kripam kuru jaganmatarmamevam hatatejasam | gurushapatsmritibhrashtam vidyahinam
    ca duhkhitam || 6|| jnanam dehi smritim dehi vidyam dehi devate | pratishtham kavitam dehi shaktam
    shishyaprabodhikam || 7|| granthanirmitishaktim ca sacchishyam supratishthitam | pratibham satsabhayam
    ca vicarakshamatam shubham || 8|| luptam sarvam daivavashannavam kuru punah punah | yatha'nkuram janayati
    bhagavanyogamayaya || 9|| brahmasvarupa parama jyotirupa sanatani | sarvavidyadhidevi ya tasyai vanyai
    namo namah || 10|| yaya vina jagatsarvam shashvajjivanmritam sada | jnanadhidevi ya tasyai sarasvatyai
    namo namah || 11|| yaya vina jagatsarvam mukamunmattavatsada | vagadhishthatridevi ya tasyai vanyai
    namo namah || 12|| himacandanakundendukumudambhojasamnibha | varnadhidevi ya tasyai caksharayai namo
    namah || 13|| visarga bindumatranam yadadhishthanameva ca | ittham tvam giyase sadbhirbharatyai te
    namo namah || 14|| yaya vina'tra samkhyakritsamkhyam kartum na shaknute | kala samkhyasvarupa ya tasyai
    devyai namo namah || 15|| vyakhyasvarupa ya devi vyakhyadhishthatridevata | bhramasiddhantarupa ya
    tasyai devyai namo namah || 16|| smritishaktirjnanashaktirbuddhishaktisvarupini | pratibhakalpanashaktirya
    ca tasyai namo namah || 17|| sanatkumaro brahmanam jnanam papraccha yatra vai | babhuva jadavatso'pi
    siddhantam kartumakshamah || 18|| tada''jagama bhagavanatma shrikrishna ishvarah | uvaca sa ca tam
    stauhi vanimiti prajapate || 19|| sa ca tushtava tam brahma ca''jnaya paramatmanah | cakara tatprasadena
    tada siddhantamuttamam || 20|| yadapyanantam papraccha jnanamekam vasundhara | babhuva mukavatso'pi
    siddhantam kartumakshamah || 21|| tada tvam ca sa tushtava santrastah kashyapajnaya | tatashcakara
    siddhantam nirmalam bhramabhanjanam || 22|| vyasah puranasutram samapricchadvalmikim yada |
  devanagari: अथ पञ्चमोऽध्यायः । नारायण उवाच । वाग्देवतायाः स्तवनं श्रूयतां सर्वकामदम् । महामुनिर्याज्ञवल्क्यो
    येन तुष्टाव तां पुरा ॥ १॥ गुरुशापाच्च स मुनिर्हतविद्यो बभूव ह । तदा जगाम दुह्खार्तो रविस्थानं च पुण्यदम्
    ॥ २॥ सम्प्राप्यतपसा सूर्यं कोणार्के दृष्टिगोचरे । तुष्टाव सूर्यं शोकेन रुरोद स पुनः पुनः ॥ ३॥ सूर्यास्तं
    पाठयामास वेदवेदाङ्गमीश्वरः । उवाच स्तुहि वाग्देवीं भक्त्या च श्रुतिहेतवे ॥ ४॥ तमित्युक्त्वा दीननाथो
    ह्यन्तर्धानं जगाम सः । मुनिस्नात्वा च तुष्टाव भक्तिनम्रात्मकन्धरः ॥ ५॥ याज्ञवल्क्य उवाच । कृपां कुरु
    जगन्मातर्मामेवं हततेजसम् । गुरुशापात्स्मृतिभ्रष्टं विद्याहीनं च दुःखितम् ॥ ६॥ ज्ञानं देहि स्मृतिं
    देहि विद्यां देहि देवते । प्रतिष्ठां कवितां देहि शाक्तं शिष्यप्रबोधिकाम् ॥ ७॥ ग्रन्थनिर्मितिशक्तिं
    च सच्छिष्यं सुप्रतिष्ठितम् । प्रतिभां सत्सभायां च विचारक्षमतां शुभाम् ॥ ८॥ लुप्तां सर्वां दैववशान्नवं
    कुरु पुनः पुनः । यथाऽङ्कुरं जनयति भगवान्योगमायया ॥ ९॥ ब्रह्मस्वरूपा परमा ज्योतिरूपा सनातनी । सर्वविद्याधिदेवी
    या तस्यै वाण्यै नमो नमः ॥ १०॥ यया विना जगत्सर्वं शश्वज्जीवन्मृतं सदा । ज्ञानाधिदेवी या तस्यै सरस्वत्यै
    नमो नमः ॥ ११॥ यया विना जगत्सर्वं मूकमुन्मत्तवत्सदा । वागधिष्ठातृदेवी या तस्यै वाण्यै नमो नमः ॥ १२॥
    हिमचन्दनकुन्देन्दुकुमुदाम्भोजसंनिभा । वर्णाधिदेवी या तस्यै चाक्षरायै नमो नमः ॥ १३॥ विसर्ग बिन्दुमात्राणां
    यदधिष्ठानमेव च । इत्थं त्वं गीयसे सद्भिर्भारत्यै ते नमो नमः ॥ १४॥ यया विनाऽत्र संख्याकृत्संख्यां कर्तुं
    न शक्नुते । काल संख्यास्वरूपा या तस्यै देव्यै नमो नमः ॥ १५॥ व्याख्यास्वरूपा या देवी व्याख्याधिष्ठातृदेवता
    । भ्रमसिद्धान्तरूपा या तस्यै देव्यै नमो नमः ॥ १६॥ स्मृतिशक्तिर्ज्ञानशक्तिर्बुद्धिशक्तिस्वरूपिणी ।
    प्रतिभाकल्पनाशक्तिर्या च तस्यै नमो नमः ॥ १७॥ सनत्कुमारो ब्रह्माणं ज्ञानं पप्रच्छ यत्र वै । बभूव जडवत्सोऽपि
    सिद्धान्तं कर्तुमक्षमः ॥ १८॥ तदाऽऽजगाम भगवानात्मा श्रीकृष्ण ईश्वरः । उवाच स च तं स्तौहि वाणीमिति प्रजापते
    ॥ १९॥ स च तुष्टाव तां ब्रह्मा चाऽऽज्ञया परमात्मनः । चकार तत्प्रसादेन तदा सिद्धान्तमुत्तमम् ॥ २०॥ यदाप्यनन्तं
    पप्रच्छ ज्ञानमेकं वसुन्धरा । बभूव मूकवत्सोऽपि सिद्धान्तं कर्तुमक्षमः ॥ २१॥ तदा त्वां च स तुष्टाव सन्त्रस्तः
    कश्यपाज्ञया । ततश्चकार सिद्धान्तं निर्मलं भ्रमभञ्जनम् ॥ २२॥ व्यासः पुराणसूत्रं समपृच्छद्वाल्मिकिं
    यदा ।
