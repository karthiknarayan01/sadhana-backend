id: annamayya-keerthanas-pidikita-talambraala
category: stotram
name:
  english: Annamayya Keerthanas Pidikita Talambraala
content:
  english: adi pallavi pidikita talambrala pèndli kuturu kònta | padamarali navvinè pèndli kuturu || perukala
    javaralè pèndli kuturu pèdda | perula mutyala meda pèndli kuturu | perantandla nadimi pèndli kuturu
    | vibhu perukuccu sigguvadi bèndli kuturu || pidikita talambrala pèndli kuturu kònta birudu pèndamu
    vèttè bèndli kuturu | nèra birudu magani kantè bèndli kuturu | piriduri nappude pèndli kuturu | pati
    bèrareci nidivo pèndli kuturu || pidikita talambrala pèndli kuturu kònta pèttène pèdda turumu pèndli
    kuturu | nedè pèttèdu ciralu gatti pèndli kuturu | gattiga venkatapati kaugitanu | pèttina nidhanamayina
    pèndli kuturu || pidikita talambrala pèndli kuturu kònta padamarali navvinè pèndli kuturu ||
  devanagari: आदि पल्लवि पिडिकिट तलम्ब्राल पॆण्ड्लि कूतुरु कॊन्त । पडमरलि नव्वीनॆ पॆण्ड्लि कूतुरु ॥ पेरुकल
    जवरालॆ पॆण्ड्लि कूतुरु पॆद्द । पेरुल मुत्याल मेड पॆण्ड्लि कूतुरु । पेरण्टाण्ड्ल नडिमि पॆण्ड्लि कूतुरु
    । विभु पेरुकुच्चु सिग्गुवडी बॆण्ड्लि कूतुरु ॥ पिडिकिट तलम्ब्राल पॆण्ड्लि कूतुरु कॊन्त बिरुदु पॆण्डमु
    वॆट्टॆ बॆण्ड्लि कूतुरु । नॆर बिरुदु मगनि कण्टॆ बॆण्ड्लि कूतुरु । पिरिदूरि नप्पुडे पॆण्ड्लि कूतुरू
    । पति बॆररेची निदिवो पॆण्ड्लि कूतुरु ॥ पिडिकिट तलम्ब्राल पॆण्ड्लि कूतुरु कॊन्त पॆट्टॆने पॆद्द तुरुमु
    पॆण्ड्लि कूतुरु । नेडॆ पॆट्टॆडु चीरलु गट्टि पॆण्ड्लि कूतुरु । गट्टिग वेङ्कटपति कौगिटनु । पॆट्टिन निधानमयिन
    पॆण्ड्लि कूतुरु ॥ पिडिकिट तलम्ब्राल पॆण्ड्लि कूतुरु कॊन्त पडमरलि नव्वीनॆ पॆण्ड्लि कूतुरु ॥
