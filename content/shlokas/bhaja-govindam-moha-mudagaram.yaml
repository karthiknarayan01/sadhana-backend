id: bhaja-govindam-moha-mudagaram
category: stotram
name:
  english: Bhaja Govindam (Moha Mudagaram)
content:
  english: bhaja govindam bhaja govindam govindam bhaja mudhamate | samprapte sannihite kale nahi nahi
    rakshati dukrinkarane || || bhaja govindam bhaja govindam mudha jahihi dhanagamatrishnam kuru sadbuddhim
    manasi vitrishnam | yallabhase nijakarmopattam vittam tena vinodaya cittam || || bhaja govindam bhaja
    govindam nabhidesham drishtva ma ga mohavesham | etanmamsavasadivikaram manasi vicintaya varam varam
    || || bhaja govindam bhaja govindam gatajalamatitaralam tadvajjivitamatishaya capalam | viddhi vyadhyabhimanagrastam
    lokam shokahatam ca samastam || || bhaja govindam bhaja govindam yavadvittoparjanasaktah tavannijaparivaro
    raktah | pashcajjivati jarjaradehe vartam ko'pi na pricchati gehe || || bhaja govindam bhaja govindam
    yavatpavano nivasati dehe tavatpricchati kushalam gehe | gatavati vayau dehapaye bharya bibhyati tasminkaye
    || || bhaja govindam bhaja govindam balastavatkridasaktah tarunastavattarunisaktah | vriddhastavaccintasaktah
    parame brahmani ko'pi na saktah || || bhaja govindam bhaja govindam ka te kanta kaste putrah samsaro'yamativa
    vicitrah | kasya tvam kah kuta ayatah tattvam cintaya tadiha bhratah || || bhaja govindam bhaja govindam
    satsangatve nissangatvam nissangatve nirmohatvam | nirmohatve nishcalatattvam nishcalatattve jivanmuktih
    || || bhaja govindam bhaja govindam vayasi gate kah kamavikarah shushke nire kah kasarah | kshine
    vitte kah parivarah jnate tattve kah samsarah || || bhaja govindam bhaja govindam garvam harati nimeshatkalah
    sarvam | mayamayamidamakhilam hitva brahmapadam tvam pravisha viditva || || bhaja govindam bhaja govindam
    dinayaminyau sayam pratah shishiravasantau punarayatah | kalah kridati gacchatyayuh tadapi na muncatyashavayuh
    || || bhaja govindam bhaja govindam ka te kanta dhanagatacinta vatula kim tava nasti niyanta | trijagati
    sajjanasangatireka bhavati bhavarnavatarane nauka || || bhaja govindam bhaja govindam manjarikabhirasheshah
    kathito vaiyakaranasyaishah | upadesho'bhudvidya nipunaih shrimacchankara || bhaja govindam bhaja
    govindam jatilo mundi lunchitakeshah kashayambara bahukritaveshah | pashyannapi ca na pashyati mudhah
    udaranimittam bahukritaveshah || || bhaja govindam bhaja govindam angam galitam palitam mundam dashanavihinam
    jatam tundam | vriddho yati grihitva dandam tadapi na muncatyashapindam || || bhaja govindam bhaja
    govindam agre vahnih prishthe bhanuh ratrau cubuka bhikshastarutalavasah tadapi na muncatyashapashah
    || || bhaja govindam bhaja govindam kurute gangasagaragamanam vrata paripalanamathava danam | jnanavihinah
    sarvamatena bhajati na muktim janmashatena || || bhaja govindam bhaja govindam nivasah shayya bhutalamajinam
    vasah | sarva bhogatyagah kasya sukham na karoti viragah || || bhaja govindam bhaja govindam yogarato
    va bhogarato va sangarato va sangavihinah | yasya brahmani ramate cittam nandati nandati nandatyeva
    || || bhaja govindam bhaja govindam bhagavadgita kincidadhita gangajala lavakanika pita | sakridapi
    yena murarisamarca kriyate tasya yamena na carca || || bhaja govindam bhaja govindam punarapi jananam
    punarapi maranam punarapi jananijathare shayanam | iha samsare bahudustare kripaya'pare pahi murare
    || || bhaja govindam bhaja govindam panthah | yogi yoganiyojita cittah ramate balonmattavadeva ||
    || bhaja govindam bhaja govindam kastvam ko'ham kuta ayatah ka me janani ko me tatah | iti paribhavaya
    sarvamasaram vishvam tyaktva svapnavicaram || || bhaja govindam bhaja govindam tvayi mayi canyatraiko
    vishnuh vyartham kupyasi mayyasahishnuh | bhava samacittah sarvatra tvam vanchasyaciradyadi vishnutvam
    || || bhaja govindam bhaja govindam shatrau mitre putre bandhau ma kuru yatnam vigrahasandhau | sarvasminnapi
    pashyatmanam sarvatrotsrija bhedajnanam || || bhaja govindam bhaja govindam kamam krodham lobham moham
    tyaktva''tmanam pashyati so'ham | atmajnanavihina mudhah te pacyante narakanigudhah || || bhaja govindam
    bhaja govindam namasahasram dhyeyam shripati rupamajasram | neyam sajjana sange cittam deyam dinajanaya
    ca vittam || || bhaja govindam bhaja govindam sukhatah kriyate kamabhogah pashcaddhanta sharire rogah
    | yadyapi loke maranam sharanam tadapi na muncati papacaranam || || bhaja govindam bhaja govindam
    arthamanartham bhavaya nityam nastitatah sukhaleshah satyam | putradapi dhanabhajam bhitih sarvatraisha
    vihita ritih || || bhaja govindam bhaja govindam pranayamam pratyaharam nityanitya vivekavicaram |
    japyasametasamadhividhanam kurvavadhanam mahadavadhanam || || bhaja govindam bhaja govindam nirbharabhaktah
    samsaradaciradbhava muktah | sendriyamanasa niyamadevam drakshyasi nijahridayastham devam || || bhaja
    govindam bhaja govindam mudhah kashcana vaiyakarano duhkrinkaranadhyayanadhurinah | shrimacchankara
    bhagavacchishyaih bodhita asicchodhita || bhaja govindam bhaja govindam bhaja govindam bhaja govindam
    govindam bhaja mudhamate | namasmaranadanyamupayam nahi pashyamo bhavatarane || || bhaja govindam
    bhaja govindam
  devanagari: भज गोविन्दं भज गोविन्दं गोविन्दं भज मूढमते । सम्प्राप्ते सन्निहिते काले नहि नहि रक्षति डुकृङ्करणे
    ॥ ॥ भज गोविन्दं भज गोविन्दं मूढ जहीहि धनागमतृष्णां कुरु सद्बुद्धिं मनसि वितृष्णाम् । यल्लभसे निजकर्मोपात्तं
    वित्तं तेन विनोदय चित्तम् ॥ ॥ भज गोविन्दं भज गोविन्दं नाभीदेशं दृष्ट्वा मा गा मोहावेशम् । एतन्मांसवसादिविकारं
    मनसि विचिन्तय वारं वारम् ॥ ॥ भज गोविन्दं भज गोविन्दं गतजलमतितरलं तद्वज्जीवितमतिशय चपलम् । विद्धि व्याध्यभिमानग्रस्तं
    लोकं शोकहतं च समस्तम् ॥ ॥ भज गोविन्दं भज गोविन्दं यावद्वित्तोपार्जनसक्तः तावन्निजपरिवारो रक्तः । पश्चाज्जीवति
    जर्जरदेहे वार्तां कोऽपि न पृच्छति गेहे ॥ ॥ भज गोविन्दं भज गोविन्दं यावत्पवनो निवसति देहे तावत्पृच्छति
    कुशलं गेहे । गतवति वायौ देहापाये भार्या बिभ्यति तस्मिन्काये ॥ ॥ भज गोविन्दं भज गोविन्दं बालस्तावत्क्रीडासक्तः
    तरुणस्तावत्तरुणीसक्तः । वृद्धस्तावच्चिन्तासक्तः परमे ब्रह्मणि कोऽपि न सक्तः ॥ ॥ भज गोविन्दं भज गोविन्दं
    का ते कान्ता कस्ते पुत्रः संसारोऽयमतीव विचित्रः । कस्य त्वं कः कुत आयातः तत्त्वं चिन्तय तदिह भ्रातः
    ॥ ॥ भज गोविन्दं भज गोविन्दं सत्सङ्गत्वे निस्सङ्गत्वं निस्सङ्गत्वे निर्मोहत्वम् । निर्मोहत्वे निश्चलतत्त्वं
    निश्चलतत्त्वे जीवन्मुक्तिः ॥ ॥ भज गोविन्दं भज गोविन्दं वयसि गते कः कामविकारः शुष्के नीरे कः कासारः
    । क्षीणे वित्ते कः परिवारः ज्ञाते तत्त्वे कः संसारः ॥ ॥ भज गोविन्दं भज गोविन्दं गर्वं हरति निमेषात्कालः
    सर्वम् । मायामयमिदमखिलं हित्वा ब्रह्मपदं त्वं प्रविश विदित्वा ॥ ॥ भज गोविन्दं भज गोविन्दं दिनयामिन्यौ
    सायं प्रातः शिशिरवसन्तौ पुनरायातः । कालः क्रीडति गच्छत्यायुः तदपि न मुञ्चत्याशावायुः ॥ ॥ भज गोविन्दं
    भज गोविन्दं का ते कान्ता धनगतचिन्ता वातुल किं तव नास्ति नियन्ता । त्रिजगति सज्जनसङ्गतिरेका भवति भवार्णवतरणे
    नौका ॥ ॥ भज गोविन्दं भज गोविन्दं मञ्जरिकाभिरशेषः कथितो वैयाकरणस्यैषः । उपदेशोऽभूद्विद्या निपुणैः श्रीमच्छङ्कर
    ॥ भज गोविन्दं भज गोविन्दं जटिलो मुण्डी लुञ्छितकेशः काषायाम्बर बहुकृतवेषः । पश्यन्नपि च न पश्यति मूढः
    उदरनिमित्तं बहुकृतवेषः ॥ ॥ भज गोविन्दं भज गोविन्दं अङ्गं गलितं पलितं मुण्डं दशनविहीनं जातं तुण्डम्
    । वृद्धो याति गृहीत्वा दण्डं तदपि न मुञ्चत्याशापिण्डम् ॥ ॥ भज गोविन्दं भज गोविन्दं अग्रे वह्निः पृष्ठे
    भानुः रात्रौ चुबुक भिक्षस्तरुतलवासः तदपि न मुञ्चत्याशापाशः ॥ ॥ भज गोविन्दं भज गोविन्दं कुरुते गङ्गासागरगमनं
    व्रत परिपालनमथवा दानम् । ज्ञानविहीनः सर्वमतेन भजति न मुक्तिं जन्मशतेन ॥ ॥ भज गोविन्दं भज गोविन्दं
    निवासः शय्या भूतलमजिनं वासः । सर्व भोगत्यागः कस्य सुखं न करोति विरागः ॥ ॥ भज गोविन्दं भज गोविन्दं
    योगरतो वा भोगरतो वा सङ्गरतो वा सङ्गविहीनः । यस्य ब्रह्मणि रमते चित्तं नन्दति नन्दति नन्दत्येव ॥ ॥
    भज गोविन्दं भज गोविन्दं भगवद्गीता किञ्चिदधीता गङ्गाजल लवकणिका पीता । सकृदपि येन मुरारिसमर्चा क्रियते
    तस्य यमेन न चर्चा ॥ ॥ भज गोविन्दं भज गोविन्दं पुनरपि जननं पुनरपि मरणं पुनरपि जननीजठरे शयनम् । इह संसारे
    बहुदुस्तारे कृपयाऽपारे पाहि मुरारे ॥ ॥ भज गोविन्दं भज गोविन्दं पन्थः । योगी योगनियोजित चित्तः रमते
    बालोन्मत्तवदेव ॥ ॥ भज गोविन्दं भज गोविन्दं कस्त्वं कोऽहं कुत आयातः का मे जननी को मे तातः । इति परिभावय
    सर्वमसारं विश्वं त्यक्त्वा स्वप्नविचारम् ॥ ॥ भज गोविन्दं भज गोविन्दं त्वयि मयि चान्यत्रैको विष्णुः
    व्यर्थं कुप्यसि मय्यसहिष्णुः । भव समचित्तः सर्वत्र त्वं वाञ्छस्यचिराद्यदि विष्णुत्वम् ॥ ॥ भज गोविन्दं
    भज गोविन्दं शत्रौ मित्रे पुत्रे बन्धौ मा कुरु यत्नं विग्रहसन्धौ । सर्वस्मिन्नपि पश्यात्मानं सर्वत्रोत्सृज
    भेदाज्ञानम् ॥ ॥ भज गोविन्दं भज गोविन्दं कामं क्रोधं लोभं मोहं त्यक्त्वाऽऽत्मानं पश्यति सोऽहम् । आत्मज्ञानविहीना
    मूढाः ते पच्यन्ते नरकनिगूढाः ॥ ॥ भज गोविन्दं भज गोविन्दं नामसहस्रं ध्येयं श्रीपति रूपमजस्रम् । नेयं
    सज्जन सङ्गे चित्तं देयं दीनजनाय च वित्तम् ॥ ॥ भज गोविन्दं भज गोविन्दं सुखतः क्रियते कामाभोगः पश्चाद्धन्त
    शरीरे रोगः । यद्यपि लोके मरणं शरणं तदपि न मुञ्चति पापाचरणम् ॥ ॥ भज गोविन्दं भज गोविन्दं अर्थमनर्थं
    भावय नित्यं नास्तिततः सुखलेशः सत्यम् । पुत्रादपि धनभाजां भीतिः सर्वत्रैषा विहिता रीतिः ॥ ॥ भज गोविन्दं
    भज गोविन्दं प्राणायामं प्रत्याहारं नित्यानित्य विवेकविचारम् । जाप्यसमेतसमाधिविधानं कुर्ववधानं महदवधानम्
    ॥ ॥ भज गोविन्दं भज गोविन्दं निर्भरभक्तः संसारादचिराद्भव मुक्तः । सेन्द्रियमानस नियमादेवं द्रक्ष्यसि
    निजहृदयस्थं देवम् ॥ ॥ भज गोविन्दं भज गोविन्दं मूढः कश्चन वैयाकरणो डुःकृङ्करणाध्ययनधुरीणः । श्रीमच्छङ्कर
    भगवच्छिष्यैः बोधित आसीच्छोधित ॥ भज गोविन्दं भज गोविन्दं भज गोविन्दं भज गोविन्दं गोविन्दं भज मूढमते
    । नामस्मरणादन्यमुपायं नहि पश्यामो भवतरणे ॥ ॥ भज गोविन्दं भज गोविन्दं
