id: kartaviryarjunamantrah-2
category: mantra
name:
  english: kartaviryarjunamantrah 2
  devanagari: कार्तवीर्यार्जुनमन्त्रः २
content:
  english: tkodandaissasharairudagravishikhairudyadvivasvatprabhuh | brahmandam paripurayantamakhilam
    gandasthalalodinah dyotatkundalamandito vijayate shrikartaviryah prabhuh || 1|| cakreshukhadgamusalakhyakutharapasha
    prasakhyacarmadhanushankhadharam svahastaih | dakshottaraih pratishatairarunambaradhyam madhyandinarkasadrisham
    smaratatighoram || 2|| raktambarakhyamatibhishanamekanatham nilambumbudabhagajaprishtagatam tvadanyaih
    | samveshtitam sakaladuhkhaharam vishishtam shishteshtadam sakaladuhkhanivaranaya || 3|| om namo bhagavate
    kartaviryarjuna
  devanagari: त्कोदण्डैस्सशरैरुदग्रविशिखैरुद्यद्विवस्वत्प्रभुः । ब्रह्माण्डं परिपूरयन्तमखिलं गण्डस्थलालोडिनः
    द्योतत्कुण्डलमण्डितो विजयते श्रीकार्तवीर्यः प्रभुः ॥ १॥ चक्रेषुखड्गमुसलाख्यकुठारपाश प्रासाख्यचर्मधनुशङ्खधरं
    स्वहस्तैः । दक्षोत्तरैः प्रतिशतैररुणाम्बराढ्यं मध्यन्दिनार्कसदृशं स्मरतातिघोरम् ॥ २॥ रक्ताम्बराख्यमतिभीषणमेकनाथं
    नीलाम्बुम्बुदाभगजपृष्टगतं त्वदन्यैः । संवेष्टितं सकलदुःखहरं विशिष्टं शिष्टेष्टदं सकलदुःखनिवारणाय ॥
    ३॥ ॐ नमो भगवते कार्तवीर्यार्जुन
