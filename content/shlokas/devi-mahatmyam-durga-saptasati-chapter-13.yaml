id: devi-mahatmyam-durga-saptasati-chapter-13
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 13
content:
  english: surathavaishyayorvarapradanam nama trayodasho'dhyayah || dhyanam om balarka mandalabhasam caturbahum
    trilocanam | pashankusha varabhitirdharayantim shivam bhaje || rishiruvaca || || etatte kathitam bhupa
    devimahatmyamuttamam | evamprabhava sa devi yayedam dharyate jagat || || vidya tathaiva kriyate bhagavadvishnumayaya
    | taya tvamesha vaishyashca tathaivanye vivekinah || || taya tvamesha vaishyashca tathaivanye vivekinah|
    mohyante mohitashcaiva mohameshyanti capare || || tamupaihi maharaja sharanam parameshvarim| aradhita
    saiva nrinam bhogasvargapavargada || || iti tasya vacah shritva surathah sa naradhipah| pranipatya
    mahabhagam tamrishim samshitavratam || || nirvinno'timamatvena rajyapaharenana ca| jagama sadyastapase
    saca vaishyo mahamune || || sandarshanarthamambhaya nadipulina masthitah| sa ca vaishyastapastepe
    devi suktam param japan || || tau tasmin puline devyah kritva murtim mahimayim| arhanam cakratustasyah
    pushpadhupagnitarpanaih || || niraharau yataharau tanmanaskau samahitau| dadatustau balincaiva nijagatrasrigukshitam
    || || evam samaradhayatostribhirvarshairyatatmanoh| paritushta jagaddhatri pratyaksham praha candika
    || || yatprarthyate tvaya bhupa tvaya ca kulanandana| mattastatprapyatam sarvam paritushta dadamite||
    || tato vavre nripo rajyamavibhramshyanyajanmani| atraivaca ca nijam rajyam hatashatrubalam balat||
    || so'pi vaishyastato jnanam vavre nirvinnamanasah| mametyahamiti prajnah sajgavicyuti karakam|| ||
    svalpairahobhir nripate svam rajyam prapsyate bhavan| hatva ripunaskhalitam tava tatra bhavishyati||
    || mritashca bhuyah samprapya janma devadvivasvatah| savarniko manurnama bhavanbhuvi bhavishyati||
    || vaishya varya tvaya yashca varo'smatto'bhivancitah| tam prayacchami samsiddhyai tava jnanam bhavishyati||
    || markandeya uvaca iti datva tayordevi yathakhilashitam varam| bhabhuvantarhita sadyo bhaktya tabhyamabhishtuta||
    || evam devya varam labdhva surathah kshatriyarshabhah| suryajjanma samasadya savarnirbhavita manuh||
    || iti datva tayordevi yathabhilashitam varam| babhuvantarhita sadhyo bhaktya tabhyamabhishtuta||
    || evam devya varam labdhva surathah kshatriyarshabhah| suryajjanma samasadya savarnirbhavita manuh||
    || |klim om| || jaya jaya shri markandeyapurane savarnike manvantare devimahatyme surathavaishya yorvara
    pradanam nama trayodashodhyayasamaptam || ||shri sapta shati devimahatmyam samaptam || | om tat sat
    | ahuti om klim jayanti sangayai sashaktikayai saparivarayai savahanayai shri mahatripurasundaryai
    mahahutim samarpayami namah svaha || om khadgini shulini ghòra gadini cakrini tatha shankhini capini
    bana bhushundiparighayudha | hridayaya namah | om shulena pahino devi pahi khadgena cambike| ghantasvanena
    nah pahi capajyanisvanena ca shirashesvaha | om pracyam raksha praticyam ca candike daksharakshine
    bhramare natma shulasya uttarasyam tatheshvari | shikhayai vashat | om sa'umyani yanirupani trailokye
    vicarantite yani catyanta ghorani tai rakshasmam statha bhuvam kavacaya hum | om khadga shula gada
    dini yani castani tembike karapallavasangini tairasma nraksha sarvatah netratrayaya vashat | om sarvasvarupe
    sarveshe sarva shakti samanvite bhayebhyastrahino devi durge devi namostute | karatala karaprishtabhyam
    namah | om bhurbhuva ssuvah iti digvimikah |
  devanagari: सुरथवैश्ययोर्वरप्रदानं नाम त्रयोदशोऽध्यायः ॥ ध्यानं ॐ बालार्क मण्डलाभासां चतुर्बाहुं त्रिलोचनाम्
    । पाशाङ्कुश वराभीतीर्धारयन्तीं शिवां भजे ॥ ऋषिरुवाच ॥ ॥ एतत्ते कथितं भूप देवीमाहात्म्यमुत्तमम् । एवम्प्रभावा
    सा देवी ययेदं धार्यते जगत् ॥ ॥ विद्या तथैव क्रियते भगवद्विष्णुमायया । तया त्वमेष वैश्यश्च तथैवान्ये
    विवेकिनः ॥ ॥ तया त्वमेष वैश्यश्च तथैवान्ये विवेकिनः। मोह्यन्ते मोहिताश्चैव मोहमेष्यन्ति चापरे ॥ ॥
    तामुपैहि महाराज शरणं परमेश्वरीं। आराधिता सैव नृणां भोगस्वर्गापवर्गदा ॥ ॥ इति तस्य वचः शृत्वा सुरथः
    स नराधिपः। प्रणिपत्य महाभागं तमृषिं संशितव्रतम् ॥ ॥ निर्विण्णोऽतिममत्वेन राज्यापहरेणन च। जगाम सद्यस्तपसे
    सच वैश्यो महामुने ॥ ॥ सन्दर्शनार्थमम्भाया नदीपुलिन मास्थितः। स च वैश्यस्तपस्तेपे देवी सूक्तं परं जपन्
    ॥ ॥ तौ तस्मिन् पुलिने देव्याः कृत्वा मूर्तिं महीमयीम्। अर्हणां चक्रतुस्तस्याः पुष्पधूपाग्नितर्पणैः
    ॥ ॥ निराहारौ यताहारौ तन्मनस्कौ समाहितौ। ददतुस्तौ बलिञ्चैव निजगात्रासृगुक्षितम् ॥ ॥ एवं समाराधयतोस्त्रिभिर्वर्षैर्यतात्मनोः।
    परितुष्टा जगद्धात्री प्रत्यक्षं प्राह चण्डिका ॥ ॥ यत्प्रार्थ्यते त्वया भूप त्वया च कुलनन्दन। मत्तस्तत्प्राप्यतां
    सर्वं परितुष्टा ददामिते॥ ॥ ततो वव्रे नृपो राज्यमविभ्रंश्यन्यजन्मनि। अत्रैवच च निजं राज्यं हतशत्रुबलं
    बलात्॥ ॥ सोऽपि वैश्यस्ततो ज्ञानं वव्रे निर्विण्णमानसः। ममेत्यहमिति प्राज्ञः सज्गविच्युति कारकम्॥ ॥
    स्वल्पैरहोभिर् नृपते स्वं राज्यं प्राप्स्यते भवान्। हत्वा रिपूनस्खलितं तव तत्र भविष्यति॥ ॥ मृतश्च
    भूयः सम्प्राप्य जन्म देवाद्विवस्वतः। सावर्णिको मनुर्नाम भवान्भुवि भविष्यति॥ ॥ वैश्य वर्य त्वया यश्च
    वरोऽस्मत्तोऽभिवाञ्चितः। तं प्रयच्छामि संसिद्ध्यै तव ज्ञानं भविष्यति॥ ॥ मार्कण्डेय उवाच इति दत्वा तयोर्देवी
    यथाखिलषितं वरं। भभूवान्तर्हिता सद्यो भक्त्या ताभ्यामभिष्टुता॥ ॥ एवं देव्या वरं लब्ध्वा सुरथः क्षत्रियर्षभः।
    सूर्याज्जन्म समासाद्य सावर्णिर्भविता मनुः॥ ॥ इति दत्वा तयोर्देवी यथभिलषितं वरम्। बभूवान्तर्हिता सध्यो
    भक्त्या ताभ्यामभिष्टुता॥ ॥ एवं देव्या वरं लब्ध्वा सुरथः क्षत्रियर्षभः। सूर्याज्जन्म समासाद्य सावर्णिर्भविता
    मनुः॥ ॥ ।क्लीं ॐ। ॥ जय जय श्री मार्कण्डेयपुराणे सावर्णिके मन्वन्तरे देवीमहत्य्मे सुरथवैश्य योर्वर
    प्रदानं नाम त्रयोदशोध्यायसमाप्तम् ॥ ॥श्री सप्त शती देवीमहत्म्यं समाप्तम् ॥ । ॐ तत् सत् । आहुति ॐ क्लीं
    जयन्ती साङ्गायै सशक्तिकायै सपरिवारायै सवाहनायै श्री महात्रिपुरसुन्दर्यै महाहुतिं समर्पयामि नमः स्वाहा
    ॥ ॐ खड्गिनी शूलिनी घॊरा गदिनी चक्रिणी तथा शङ्खिणी चापिनी बाणा भुशुण्डीपरिघायुधा । हृदयाय नमः । ॐ शूलेन
    पाहिनो देवि पाहि खड्गेन चाम्बिके। घण्टास्वनेन नः पाहि चापज्यानिस्वनेन च शिरशेस्वाहा । ॐ प्राच्यां
    रक्ष प्रतीच्यां च चण्डिके दक्षरक्षिणे भ्रामरे नात्म शुलस्य उत्तरस्यां तथेश्वरि । शिखायै वषट् । ॐ सऽउम्यानि
    यानिरूपाणि त्रैलोक्ये विचरन्तिते यानि चात्यन्त घोराणि तै रक्षास्मां स्तथा भुवं कवचाय हुम् । ॐ खड्ग
    शूल गदा दीनि यानि चास्ताणि तेम्बिके करपल्लवसङ्गीनि तैरस्मा न्रक्ष सर्वतः नेत्रत्रयाय वषट् । ॐ सर्वस्वरूपे
    सर्वेशे सर्व शक्ति समन्विते भयेभ्यस्त्राहिनो देवि दुर्गे देवि नमोस्तुते । करतल करपृष्टाभ्यां नमः ।
    ॐ भूर्भुव स्सुवः इति दिग्विमिकः ।
