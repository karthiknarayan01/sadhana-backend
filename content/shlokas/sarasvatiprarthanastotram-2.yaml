id: sarasvatiprarthanastotram-2
category: stotram
name:
  english: sarasvatiprarthanastotram 2
  devanagari: सरस्वतीप्रार्थनास्तोत्रम् २
content:
  english: shrisarasvatiprarthana tarunashakalamindorbibhrati shubhrakantih kucabharanamitangi sannishanna
    sitabje | nijakarakamalodyallekhanipustakashrih sakalavibhavasiddhyai patu vagdevata nah || tvadiye
    punyapadabje nato'ham sharade devi dayamayi tvaddayalesham shrito'ham sharade devi | kare te rajate
    mala maralo vahanam divyam tvadanke kacchapi vina pravina sharade devi || 1|| tvadange shobhate shubhram
    dukulam kasapushpabham sitaih pushpairalankaraih sitabha sharade devi | tusharakshirakundendusphatikaharavadatabha
    tvadiya varnyate kantih manojna sharade devi || 2|| tvadiya manjulam shobham na vaktum shaktimaccheshah
    mahimna varnayenmadrik katham tam sharade devi | kripaleshena te vacaspatirityalpaprajno'pi dayadrishtya
    nipalyo'ham vinitah sharade devi || 3|| pura te sannidhanena mamedam bharatam varsham pratishtham
    sthapayamasa jagatyam sharade devi | punastantrim gunakvanaih sutan nidranimagnah sva
  devanagari: श्रीसरस्वतीप्रार्थना तरुणशकलमिन्दोर्बिभ्रती शुभ्रकान्तिः कुचभरनमिताङ्गी सन्निषण्णा सिताब्जे
    । निजकरकमलोद्यल्लेखनीपुस्तकश्रीः सकलविभवसिद्ध्यै पातु वाग्देवता नः ॥ त्वदीये पुण्यपादाब्जे नतोऽहं
    शारदे देवि दयामयि त्वद्दयालेशं श्रितोऽहं शारदे देवि । करे ते राजते माला मरालो वाहनं दिव्यं त्वदङ्के
    कच्छपी वीणा प्रवीणा शारदे देवि ॥ १॥ त्वदङ्गे शोभते शुभ्रं दुकूलं कासपुष्पाभं सितैः पुष्पैरलङ्कारैः
    सिताभा शारदे देवि । तुषारक्षीरकुन्देन्दुस्फटिकहारावदाताभा त्वदीया वर्ण्यते कान्तिः मनोज्ञा शारदे देवि
    ॥ २॥ त्वदीया मञ्जुलां शोभां न वक्तुं शक्तिमच्छेषः महिम्ना वर्णयेन्मादृक् कथं तां शारदे देवि । कृपालेशेन
    ते वाचस्पतिरित्यल्पप्रज्ञोऽपि दयादृष्ट्या निपाल्योऽहं विनीतः शारदे देवि ॥ ३॥ पुरा ते सन्निधानेन ममेदं
    भारतं वर्षं प्रतिष्ठां स्थापयामास जगत्यां शारदे देवि । पुनस्तन्त्रीं गुणक्वाणैः सुतान् निद्रानिमग्नः
    स्वा
meaning: {}
