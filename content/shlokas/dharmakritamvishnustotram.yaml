id: dharmakritamvishnustotram
category: stotram
name:
  english: dharmakritamvishnustotram
  devanagari: धर्मकृतंविष्णुस्तोत्रम्
content:
  english: 10|| bhaktyarccitasupadaya namo'jadipriyaya te | shubhangaya sunetraya madhavaya namo namah
    || 11|| namo'ravindapadaya padmanabhaya vai namah | namah kshirabdhikallolasprishtagatraya sharngine
    || 12|| om namo yoganidraya yogarkshairbhavitatmane | tarkshyasanaya devaya govindaya namo namah ||
    13|| sukeshaya sunasaya sulalataya cakrine | suvastraya suvarnaya shridharaya namo namah || 14|| subahave
    namastubhyam carujanghaya te namah | suvasaya sudivyaya suvidyaya gadabhrite || 15|| keshavaya ca
    shantaya vamanaya namo namah | dharmapriyaya devaya namaste pitavasase || 16|| iti shriskandapurane
    vaishnavakhande ayodhyamahatmye caturthadhyayantargatam dharmakritam vishnustotram samaptam | skandapurana
    | vaishnavakhanda | ayodhyakhanda | adhyaya 4
  devanagari: १०॥ भक्त्यार्च्चितसुपादाय नमोऽजादिप्रियाय ते । शुभाङ्गाय सुनेत्राय माधवाय नमो नमः ॥ ११॥
    नमोऽरविन्दपादाय पद्मनाभाय वै नमः । नमः क्षीराब्धिकल्लोलस्पृष्टगात्राय शार्ङ्गिणे ॥ १२॥ ॐ नमो योगनिद्राय
    योगर्क्षैर्भावितात्मने । तार्क्ष्यासनाय देवाय गोविन्दाय नमो नमः ॥ १३॥ सुकेशाय सुनासाय सुललाटाय चक्रिणे
    । सुवस्त्राय सुवर्णाय श्रीधराय नमो नमः ॥ १४॥ सुबाहवे नमस्तुभ्यं चारुजङ्घाय ते नमः । सुवासाय सुदिव्याय
    सुविद्याय गदाभृते ॥ १५॥ केशवाय च शान्ताय वामनाय नमो नमः । धर्मप्रियाय देवाय नमस्ते पीतवाससे ॥ १६॥
    इति श्रीस्कन्दपुराणे वैष्णवखण्डे अयोध्यामाहात्म्ये चतुर्थाध्यायान्तर्गतं धर्मकृतं विष्णुस्तोत्रं समाप्तम्
    । स्कन्दपुराण । वैष्णवखण्ड । अयोध्याखण्ड । अध्याय ४
