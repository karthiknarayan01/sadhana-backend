id: jhillirastotram
category: stotram
name:
  english: jhillirastotram
  devanagari: झिल्लिरास्तोत्रम्
content:
  english: sambhava | namaste kalike matardharmarthakamamokshade || 41|| dalitanjanasankashe namaste bijarupini
    | kamarupe namastubhyam namo manmatharupini || 42|| kandarparupini matarnamastubhyam namo namah |
    u~kara rupini tubhyam namastubhyam namo namah || 43|| namaste shankarakare minaketusvarupini | mayarupi
    namastubhyam kamala rajarupini || 44|| kurcaraje namastubhyam namaste shrisvarupini | vahnijaya kharupe
    tvam namastubhyam namo namah || 45|| jhillira rupini tubhyam namastubhyam namo namah | shrutva krishnamukhat
    stotram yadaha kalika para || 46|| dhyatva mantra japitva ca stotra metattu yah pathet | tasmaitushta
    ca jhillira prasanna ca prasidati || 47|| jhillira mantravijnanam dhanam stotram vina tatha | yatkincit
    kriyate karma sarvam bhavati nishphalam || 48|| iti shrikalivilasatantre shrikrishnokta jhillirastotram
    namashtavimshatipatalah samaptah |
  devanagari: सम्भवा । नमस्ते कालिके मातर्धर्मार्थकाममोक्षदे ॥ ४१॥ दलिताञ्जनसङ्काशे नमस्ते बीजरूपिणि ।
    कामरूपे नमस्तुभ्यं नमो मन्मथरूपिणि ॥ ४२॥ कन्दर्परूपिणि मातर्नमस्तुभ्यं नमो नमः । ऊँकार रूपिणि तुभ्यं
    नमस्तुभ्यं नमो नमः ॥ ४३॥ नमस्ते शङ्कराकारे मीनकेतुस्वरूपिणि । मायारूपि नमस्तुभ्यं कमला राजरूपिणि ॥
    ४४॥ कूर्चराजे नमस्तुभ्यं नमस्ते श्रीस्वरूपिणि । वह्निजाया खरूपे त्वं नमस्तुभ्यं नमो नमः ॥ ४५॥ झिल्लिरा
    रूपिणि तुभ्यं नमस्तुभ्यं नमो नमः । श्रुत्वा कृष्णमुखात् स्तोत्रं यदाह कालिका परा ॥ ४६॥ ध्यात्वा मन्त्र
    जपित्वा च स्तोत्र मेतत्तु यः पठेत् । तस्मैतुष्टा च झिल्लीरा प्रसन्ना च प्रसीदति ॥ ४७॥ झिल्लीरा मन्त्रविज्ञानं
    धानं स्तोत्रं विना तथा । यत्किञ्चित् क्रियते कर्म सर्वं भवति निष्फलम् ॥ ४८॥ इति श्रीकालीविलासतन्त्रे
    श्रीकृष्णोक्त झिल्लिरास्तोत्रं नामाष्टाविंशतिपटलः समाप्तः ।
