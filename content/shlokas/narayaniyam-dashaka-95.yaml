id: narayaniyam-dashaka-95
category: stotram
name:
  english: Narayaniyam Dashaka 95
content:
  english: adau hairanyagarbhim tanumavikalajivatmikamasthitastvam jivatvam prapya mayagunaganakhacito
    vartase vishvayone | tatrodvriddhena sattvena tu gunayugalam bhaktibhavam gatena chitva sattvam ca
    hitva punaranupahito vartitahe tvameva || || sattvonmeshat kadacit khalu vishayarase doshabodhe'pi
    bhuman bhuyo'pyeshu pravrittissatamasi rajasi proddhate durnivara | cittam tavadgunashca grathitamiha
    mithastani sarvani roddhum turye tvayyekabhaktishsharanamiti bhavan hamsarupi nyagadit || || santi
    shreyamsi bhuyamsyapi rucibhidaya karminam nirmitani kshudranandashca santa bahuvidhagatayah krishna
    tebhyo bhaveyuh | tvam cacakhyatha sakhye nanu mahitatamam shreyasam bhaktimekam tvadbhaktyanandatulyah
    khalu vishayajusham sammadah kena va syat || || tvatbhaktya tushtabuddheh sukhamiha carato vicyutashasya
    cashah sarvah syuh saukhyamayyah salilakuharagasyeva toyaikamayyah | so'yam khalvindralokam kamalajabhavanam
    yogasiddhishca hridyah nakankshatyetadastam svayamanupatite mokshasaukhye'pyanihah || || tvadbhakto
    badhyamano'pi ca vishayarasairindriyashantiheto rbhaktyaivakramyamanaih punarapi khalu tairdurbalairnabhijayyah
    | saptarcirdipitarcirdahati kila yatha bhuridaruprapancam tvadbhaktyoghe tathaiva pradahati duritam
    durmadah kvendriyanam || || cittardribhavamuccairvapushi ca pulakam harshavashpam ca hitva cittam
    shuddhyetkatham va kimu bahutapasa vidyaya vitabhakteh | tvadgathasvadasiddhanjanasatatamarimrijyamano'yamatma
    cakshurvattattvasukshmam bhajati na tu tatha'bhyastaya tarkakotya|| || dhyanam te shilayeyam samatanusukhabaddhasano
    nasikagra nyastakshah purakadyairjitapavanapathashcittapadmam tvavancam| urdhvagram bhavayitva ravividhushikhinah
    samvicintyoparishtat tatrastham bhavaye tvam sajalajaladharashyamalam komalangam || || anilashlakshnakesham
    jvalitamakarasatkundalam mandahasa syandardram kaustubhashriparigatavanamaloruharabhiramam | shrivatsankam
    subahum mridulasadudaram kancanacchayacelam carusnigdhorumambhoruhalalitapadam bhavaye'ham bhavantam
    || || sarvangeshvanga rangatkutukamiti muhurdharayannisha cittam tatrapyekatra yunje vadanasarasije
    sundare mandahase tatralinam tu cetah paramasukhacidadvaitarupe vitanva nnanyanno cintayeyam muhuriti
    samuparudhayogo bhaveyam || || ittham tvaddhyanayoge sati punaranimadyashtasamsiddhayastah durashrutyadayo'pi
    hyahamahamikaya sampateyurmurare | tvatsampraptau vilambavahamakhilamidam nadriye kamaye'ham tvamevanandapurnam
    pavanapurapate pahi mam sarvatapat ||
  devanagari: आदौ हैरण्यगर्भीं तनुमविकलजीवात्मिकामास्थितस्त्वं जीवत्वं प्राप्य मायागुणगणखचितो वर्तसे विश्वयोने
    । तत्रोद्वृद्धेन सत्त्वेन तु गुणयुगलं भक्तिभावं गतेन छित्वा सत्त्वं च हित्वा पुनरनुपहितो वर्तिताहे
    त्वमेव ॥ ॥ सत्त्वोन्मेषात् कदाचित् खलु विषयरसे दोषबोधेऽपि भूमन् भूयोऽप्येषु प्रवृत्तिस्सतमसि रजसि
    प्रोद्धते दुर्निवारा । चित्तं तावद्गुणाश्च ग्रथितमिह मिथस्तानि सर्वाणि रोद्धुं तुर्ये त्वय्येकभक्तिश्शरणमिति
    भवान् हंसरूपी न्यगादीत् ॥ ॥ सन्ति श्रेयांसि भूयांस्यपि रुचिभिदया कर्मिणां निर्मितानि क्षुद्रानन्दाश्च
    सान्ता बहुविधगतयः कृष्ण तेभ्यो भवेयुः । त्वं चाचख्याथ सख्ये ननु महिततमां श्रेयसां भक्तिमेकां त्वद्भक्त्यानन्दतुल्यः
    खलु विषयजुषां सम्मदः केन वा स्यात् ॥ ॥ त्वत्भक्त्या तुष्टबुद्धेः सुखमिह चरतो विच्युताशस्य चाशाः सर्वाः
    स्युः सौख्यमय्यः सलिलकुहरगस्येव तोयैकमय्यः । सोऽयं खल्विन्द्रलोकं कमलजभवनं योगसिद्धीश्च हृद्याः नाकाङ्क्षत्येतदास्तां
    स्वयमनुपतिते मोक्षसौख्येऽप्यनीहः ॥ ॥ त्वद्भक्तो बाध्यमानोऽपि च विषयरसैरिन्द्रियाशान्तिहेतो र्भक्त्यैवाक्रम्यमाणैः
    पुनरपि खलु तैर्दुर्बलैर्नाभिजय्यः । सप्तार्चिर्दीपितार्चिर्दहति किल यथा भूरिदारुप्रपञ्चं त्वद्भक्त्योघे
    तथैव प्रदहति दुरितं दुर्मदः क्वेन्द्रियाणाम् ॥ ॥ चित्तार्द्रीभावमुच्चैर्वपुषि च पुलकं हर्षवाष्पं च
    हित्वा चित्तं शुद्ध्येत्कथं वा किमु बहुतपसा विद्यया वीतभक्तेः । त्वद्गाथास्वादसिद्धाञ्जनसततमरीमृज्यमानोऽयमात्मा
    चक्षुर्वत्तत्त्वसूक्ष्मं भजति न तु तथाऽभ्यस्तया तर्ककोट्या॥ ॥ ध्यानं ते शीलयेयं समतनुसुखबद्धासनो नासिकाग्र
    न्यस्ताक्षः पूरकाद्यैर्जितपवनपथश्चित्तपद्मं त्ववाञ्चम्। ऊर्ध्वाग्रं भावयित्वा रविविधुशिखिनः संविचिन्त्योपरिष्टात्
    तत्रस्थं भावये त्वां सजलजलधरश्यामलं कोमलाङ्गम् ॥ ॥ आनीलश्लक्ष्णकेशं ज्वलितमकरसत्कुण्डलं मन्दहास स्यन्दार्द्रं
    कौस्तुभश्रीपरिगतवनमालोरुहाराभिरामम् । श्रीवत्साङ्कं सुबाहुं मृदुलसदुदरं काञ्चनच्छायचेलं चारुस्निग्धोरुमम्भोरुहललितपदं
    भावयेऽहं भवन्तम् ॥ ॥ सर्वाङ्गेष्वङ्ग रङ्गत्कुतुकमिति मुहुर्धारयन्नीश चित्तं तत्राप्येकत्र युञ्जे वदनसरसिजे
    सुन्दरे मन्दहासे तत्रालीनं तु चेतः परमसुखचिदद्वैतरूपे वितन्व न्नन्यन्नो चिन्तयेयं मुहुरिति समुपारूढयोगो
    भवेयम् ॥ ॥ इत्थं त्वद्ध्यानयोगे सति पुनरणिमाद्यष्टसंसिद्धयस्ताः दूरश्रुत्यादयोऽपि ह्यहमहमिकया सम्पतेयुर्मुरारे
    । त्वत्सम्प्राप्तौ विलम्बावहमखिलमिदं नाद्रिये कामयेऽहं त्वामेवानन्दपूर्णं पवनपुरपते पाहि मां सर्वतापात्
    ॥
