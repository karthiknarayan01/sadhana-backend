id: prajapatibhihkritammahadevastotram
category: stotram
name:
  english: prajapatibhihkritammahadevastotram
  devanagari: प्रजापतिभिःकृतंमहादेवस्तोत्रम्
content:
  english: prajapatibhih kritam mahadevastotram prajapataya ucuh | devadeva mahadeva bhutatman bhutabhavana
    | trahi nah sharanapannamstrailokyadahanadvishat || 21|| tvamekah sarvajagata ishvaro bandhamokshayoh
    | tam tvamarcanti kushalah prapannartiharam gurum || 22|| gunamayya svashaktyasya sargasthityapyayan
    vibho | dhatse yada svadrigbhuman brahmavishnushivabhidham || 23|| tvam brahma paramam guhyam sadasadbhavabhavanah
    | nanashaktibhirabhatastvamatma jagadishvarah || 24|| tvam shabdayonirjagadadiratma pranendriyadravyagunasvabhavah
    | kalah kratuh satyamritam ca dharma
  devanagari: प्रजापतिभिः कृतं महादेवस्तोत्रम् प्रजापतय ऊचुः । देवदेव महादेव भूतात्मन् भूतभावन । त्राहि
    नः शरणापन्नांस्त्रैलोक्यदहनाद्विषात् ॥ २१॥ त्वमेकः सर्वजगत ईश्वरो बन्धमोक्षयोः । तं त्वामर्चन्ति कुशलाः
    प्रपन्नार्तिहरं गुरुम् ॥ २२॥ गुणमय्या स्वशक्त्यास्य सर्गस्थित्यप्ययान् विभो । धत्से यदा स्वदृग्भूमन्
    ब्रह्मविष्णुशिवाभिधाम् ॥ २३॥ त्वं ब्रह्म परमं गुह्यं सदसद्भावभावनः । नानाशक्तिभिराभातस्त्वमात्मा जगदीश्वरः
    ॥ २४॥ त्वं शब्दयोनिर्जगदादिरात्मा प्राणेन्द्रियद्रव्यगुणस्वभावः । कालः क्रतुः सत्यमृतं च धर्म
meaning: {}
