id: abhayadanashridharasvami
category: stotram
name:
  english: abhayadanashridharasvami
  devanagari: अभयदानश्रीधरस्वामी
content:
  english: abhayadanam abhayam sarvabhutebhyo matah sarvam pravartate || yam natva munayashcirepsitapadam
    gacchanti nirvighnatah yo vai sarvaganadhipah prabhuriti khyatah svayam nirgunah | tadbrahmaiva sanatanam
    vibhuraham jnatam ca yasmadatah sarvebhyo'pyabhayam tanomi kushalam brahmabhayam vai yatah || 1||
    vidyakhya parameshvari bhavati ya mukhya ca bhumaptaye brahmaikyam nijamulamanvayati yacchishtam padam
    praninam | tadbrahmaiva sanatanam vibhuraham jnatam ca yasmadatah sarvebhyo'pyabhayam tanomi kushalam
    brahmabhayam vai yatah || 2|| namna shridhara cinmayo dharati yo nityam ca mokshashriyam jivanam taranaya
    sadgururiti khyatah svayam shashvatah | tadbrahmaiva sanatanam vibhuraham jnatam ca yasmadatah sarvebhyo'pyabhayam
    tanomi kushalam brahmabhayam vai yatah || 3|| yatpraptam sanakadibhirmunibaraih praptam shukenapi
    yat yannityam hyurarikritam ca khalu ve brahmadibhirdaivataih | tadbrahmaiva sanatanam vibhuraham
    jnatam ca yasmadatah sarvebhyo'pyabhayam tanomi kushalam brahmabhayam vai yatah || 4|| onkara vyabhajacchrutirbahuvidha
    brute caturdhashtadha turyam shuddhamiti sphutam ca paramam shriramabhadrashca yat | tadbrahmaiva
    sanatanam vibhuraham jnatam ca yasmadatah sarvebhyo'pyabhayam tanomi kushalam brahmabhayam vai yatah
    || 5|| na stri naiva pumanakaya iti yo hyatma ca sarvantarah gotram yasya na linga masti na tatha
    varno na va hyashramah | tadbrahmaiva sanatanam vibhuraham jnatam ca yasmadatah sarvebhyo'pyabhayam
    tanomi kushalam brahmabhayam vai yatah || 6|| sarvatma shrutirapyaho vadati yajjnatva na shokah punah
    sarvopadhivivarjitam bhavati yacchantam padam nirgunam | tadbrahmaiva sanatanam vibhuraham jnatam
    ca yasmadatah sarvebhyo'pyabhayam tanomi kushalam brahmabhayam vai yatah || 7|| bhedabhedavibhedashunyamiti
    yannasti dvayam yasya vai sukshmatsukshmataram hyanurna mahato yadvai mahadvishrutam | tadbrahmaiva
    sanatanam vibhuraham jnatam ca yasmadatah sarvebhyo'pyabhayam tanomi kushalam brahmabhayam vai yatah
    || 8|| ajnanena vibhati duhkhamiti tannashaya bhogabhramah anando'si na bhogakarma tava bho vakyairmahadbhih
    sphutam | tadbrahmaiva sanatanam vibhuraham jnatam ca yasmadatah sarvebhyo'pyabhayam tanomi kushalam
    brahmabhayam vai yatah || 9|| pakshivapi pashuh pishaca manuja
  devanagari: अभयदानम् अभयं सर्वभूतेभ्यो मतः सर्वं प्रवर्तते ॥ यं नत्वा मुनयश्चिरेप्सितपदं गच्छन्ति निर्विघ्नतः
    यो वै सर्वगणाधिपः प्रभुरिति ख्यातः स्वयं निर्गुणः । तद्ब्रह्मैव सनातनं विभुरहं ज्ञातं च यस्मादतः सर्वेभ्योऽप्यभयं
    तनोमि कुशलं ब्रह्माभयं वै यतः ॥ १॥ विद्याख्या परमेश्वरी भवति या मुख्या च भूमाप्तये ब्रह्मैक्यं निजमूलमन्वयति
    यच्छिष्टं पदं प्राणिनाम् । तद्ब्रह्मैव सनातनं विभुरहं ज्ञातं च यस्मादतः सर्वेभ्योऽप्यभयं तनोमि कुशलं
    ब्रह्माभयं वै यतः ॥ २॥ नाम्ना श्रीधर चिन्मयो धरति यो नित्यं च मोक्षश्रियम् जीवानां तरणाय सद्गुरुरिति
    ख्यातः स्वयं शाश्वतः । तद्ब्रह्मैव सनातनं विभुरहं ज्ञातं च यस्मादतः सर्वेभ्योऽप्यभयं तनोमि कुशलं ब्रह्माभयं
    वै यतः ॥ ३॥ यत्प्राप्तं सनकादिभिर्मुनिबरैः प्राप्तं शुकेनापि यत् यन्नित्यं ह्युररीकृतं च खलु वे ब्रह्मादिभिर्दैवतैः
    । तद्ब्रह्मैव सनातनं विभुरहं ज्ञातं च यस्मादतः सर्वेभ्योऽप्यभयं तनोमि कुशलं ब्रह्माभयं वै यतः ॥ ४॥
    ओङ्कार व्यभजच्छ्रुतिर्बहुविधा ब्रूते चतुर्धाष्टधा तुर्यं शुद्धमिति स्फुटं च परमं श्रीरामभद्रश्च यत्
    । तद्ब्रह्मैव सनातनं विभुरहं ज्ञातं च यस्मादतः सर्वेभ्योऽप्यभयं तनोमि कुशलं ब्रह्माभयं वै यतः ॥ ५॥
    न स्त्री नैव पुमानकाय इति यो ह्यात्मा च सर्वान्तरः गोत्रं यस्य न लिङ्ग मस्ति न तथा वर्णो न वा ह्याश्रमः
    । तद्ब्रह्मैव सनातनं विभुरहं ज्ञातं च यस्मादतः सर्वेभ्योऽप्यभयं तनोमि कुशलं ब्रह्माभयं वै यतः ॥ ६॥
    सर्वात्मा श्रुतिरप्यहो वदति यज्ज्ञात्वा न शोकः पुनः सर्वोपाधिविवर्जितं भवति यच्छान्तं पदं निर्गुणम्
    । तद्ब्रह्मैव सनातनं विभुरहं ज्ञातं च यस्मादतः सर्वेभ्योऽप्यभयं तनोमि कुशलं ब्रह्माभयं वै यतः ॥ ७॥
    भेदाभेदविभेदशून्यमिति यन्नास्ति द्वयं यस्य वै सूक्ष्मात्सूक्ष्मतरं ह्यणुर्न महतो यद्वै महद्विश्रुतम्
    । तद्ब्रह्मैव सनातनं विभुरहं ज्ञातं च यस्मादतः सर्वेभ्योऽप्यभयं तनोमि कुशलं ब्रह्माभयं वै यतः ॥ ८॥
    अज्ञानेन विभाति दुःखमिति तन्नाशाय भोगभ्रमः आनन्दोऽसि न भोगकर्म तव भो वाक्यैर्महद्भिः स्फुटम् । तद्ब्रह्मैव
    सनातनं विभुरहं ज्ञातं च यस्मादतः सर्वेभ्योऽप्यभयं तनोमि कुशलं ब्रह्माभयं वै यतः ॥ ९॥ पक्षीवापि पशुः
    पिशाच मनुजा
