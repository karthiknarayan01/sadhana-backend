id: kamakhyakavacam-3
category: kavacha
name:
  english: kamakhyakavacam 3
  devanagari: कामाख्याकवचम् ३
content:
  english: rinu devi pravakshyami kavacam siddhidam shubham | kamakhyaya mahaguhyam sarvarakshakaram param
    || 1|| yasya smaranamatrena vighnajalam pranashyati | bhutapretapishacadya durato yanti sarvada ||
    2|| om kamakhya me shirah patu tripura lalitanana | bhruvormadhye tara patu netre nilasarasvati ||
    3|| karnau me bhairavi patu nasikam bagalamukhi | mukham matangini patu jihvam vagishvari sada ||
    4|| dantan me kamala patu cibukam candika shubha | kantham me tripureshani skandhau durga sadavatu
    || 5|| bahu me bhuvaneshi ca karau kamapradayini | angulih siddhida patu nakhan nitya'vatu prabha
    || 6|| vakshahsthalam mahalakshmih hridayam parameshvari | nabhim me yonirupa sa kukshim kameshvari
    tatha || 7|| katim me kamarupastha guhyam guhyeshvari tatha | uru me vishvamata ca januni jagadambika
    || 8|| janghe jayaprada patu gulphau me sarvamangala | padau padmalayapatu padangulyah shiva sada
    || 9|| purve mam patu kamakhya agneyyam vahnivallabha | dakshine kalika patu nairityam raktadantika
    || 10|| pashcime patu me tara vayavye bhuvaneshvari | uttare sharada patu aishanyam parameshvari ||
    11|| urdhve mam patu parama adhastad yonimandala | antarbodhasvarupa mam bahirmaya sadavatu || 12||
    jale sthale ca gagane svapne jagarane tatha | sangrame sankate ghore patu mam kamarupini || 13|| rajadvare
    shmashane ca vanadurge girau tatha | naditire mahaghore patu mam kamasundari || 14|| vidyayam patu
    me vidya dhane lakshmih sadavatu | bhaktau me bhavini patu mokshe mam paradevata || 15|| yonimudra
    mahashaktih kundali pararupini | cidakashe sada patu svaprakashasvarupini || 16|| na mantram na tapo
    danam na tirtham na ca sadhanam | samam bhavati deveshi kavacasyasya dharanat || 17|| bhurjapatre
    samalikhya raktasutrena veshtitam | dharayed bhaktibhavena sarvasiddhim labhennarah || 18|| pathedyah
    pratarutthaya shucirbhutva samahitah | tasya haste sada siddhih vaktre vani nivartate || 19|| kamakhya
    paramavidya kamakhya paramam tapah | kamakhya paramam brahma kamakhya sharanam mama || 20|| || iti
    shrikamakhyakavacam sampurnam ||
  devanagari: ृणु देवि प्रवक्ष्यामि कवचं सिद्धिदं शुभम् । कामाख्याया महागुह्यं सर्वरक्षाकरं परम् ॥ १॥
    यस्य स्मरणमात्रेण विघ्नजालं प्रणश्यति । भूतप्रेतपिशाचाद्या दूरतो यान्ति सर्वदा ॥ २॥ ॐ कामाख्या मे
    शिरः पातु त्रिपुरा ललितानना । भ्रुवोर्मध्ये तारा पातु नेत्रे नीलसरस्वती ॥ ३॥ कर्णौ मे भैरवी पातु नासिकां
    बगलामुखी । मुखं मातङ्गिनी पातु जिह्वां वागीश्वरी सदा ॥ ४॥ दन्तान् मे कमला पातु चिबुकं चण्डिका शुभा
    । कण्ठं मे त्रिपुरेशानी स्कन्धौ दुर्गा सदावतु ॥ ५॥ बाहू मे भुवनेशी च करौ कामप्रदायिनी । अङ्गुलीः सिद्धिदा
    पातु नखान् नित्याऽवतु प्रभा ॥ ६॥ वक्षःस्थलं महालक्ष्मीः हृदयं परमेश्वरी । नाभिं मे योनिरूपा सा कुक्षिं
    कामेश्वरी तथा ॥ ७॥ कटिं मे कामरूपस्था गुह्यं गुह्येश्वरी तथा । ऊरू मे विश्वमाता च जानुनी जगदम्बिका
    ॥ ८॥ जङ्घे जयप्रदा पातु गुल्फौ मे सर्वमङ्गला । पादौ पद्मालयापातु पादाङ्गुल्यः शिवा सदा ॥ ९॥ पूर्वे
    मां पातु कामाख्या आग्नेय्यां वह्निवल्लभा । दक्षिणे कालिका पातु नैऋत्यां रक्तदन्तिका ॥ १०॥ पश्चिमे
    पातु मे तारा वायव्ये भुवनेश्वरी । उत्तरे शारदा पातु ऐशान्यां परमेश्वरी ॥ ११॥ ऊर्ध्वे मां पातु परमा
    अधस्ताद् योनिमण्डला । अन्तर्बोधस्वरूपा मां बहिर्माया सदावतु ॥ १२॥ जले स्थले च गगने स्वप्ने जागरणे
    तथा । सङ्ग्रामे सङ्कटे घोरे पातु मां कामरूपिणी ॥ १३॥ राजद्वारे श्मशाने च वनदुर्गे गिरौ तथा । नदीतीरे
    महाघोरे पातु मां कामसुन्दरी ॥ १४॥ विद्यायां पातु मे विद्या धने लक्ष्मीः सदावतु । भक्तौ मे भाविनी पातु
    मोक्षे मां परदेवता ॥ १५॥ योनिमुद्रा महाशक्तिः कुण्डली पररूपिणी । चिदाकाशे सदा पातु स्वप्रकाशस्वरूपिणी
    ॥ १६॥ न मन्त्रं न तपो दानं न तीर्थं न च साधनम् । समं भवति देवेशि कवचस्यास्य धारणात् ॥ १७॥ भूर्जपत्रे
    समालिख्य रक्तसूत्रेण वेष्टितम् । धारयेद् भक्तिभावेन सर्वसिद्धिं लभेन्नरः ॥ १८॥ पठेद्यः प्रातरुत्थाय
    शुचिर्भूत्वा समाहितः । तस्य हस्ते सदा सिद्धिः वक्त्रे वाणी निवर्तते ॥ १९॥ कामाख्या परमाविद्या कामाख्या
    परमं तपः । कामाख्या परमं ब्रह्म कामाख्या शरणं मम ॥ २०॥ ॥ इति श्रीकामाख्याकवचं सम्पूर्णम् ॥
