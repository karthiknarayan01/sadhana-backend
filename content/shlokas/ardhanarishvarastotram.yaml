id: ardhanarishvarastotram
category: stotram
name:
  english: ardhanarishvarastotram
  devanagari: अर्धनारीश्वरस्तोत्रम्
content:
  english: ardhanarishvarastotram shamkarabhagavatah ardhanarishvarastotram shamkarabhagavatah || ardhanarishvarastotram
    || campeyagaurardhasharirakayai karpuragaurardhasharirakaya| dhammillakayai ca jatadharaya namah shivayai
    ca namah shivaya || 1 || kasturikakunkumacarcitayai citarajahpunjavicarcitaya| kritasmarayai vikritasmaraya
    namah shivayai ca namah shivaya || 2 || jhanatkvanatkankananupurayai padabjarajatphaninupuraya| hemangadayai
    bhujagangadaya namah shivayai ca namah shivaya || 3 || vishalanilotpalalocanayai vikasipankeruhalocanaya|
    samekshanayai vishamekshanaya namah shivayai ca namah shivaya || 4 || mandaramalakalitalakayai kapalamalankitakandharaya|
    divyambarayai ca digambaraya namah shivayai ca namah shivaya || 5 || ambhodharashyamalakuntalayai
    taditprabhatamrajatadharaya| nirishvarayai nikhileshvaraya namah shivayai ca namah shivaya || 6 ||
    prapancasrishtyunmukhalasyakayai samastasamharakatandavaya| jagajjananyai jagadekapitre namah shivayai
    ca namah shivaya || 7 || pradiptaratnojjvalakundalayai sphuranmahapannagabhushanaya| shivanvitayai
    ca shivanvitaya namah shivayai ca namah shivaya || 8 || etatpathedashtakamishtadam yo bhaktya sa manyo
    bhuvi dirghajivi| prapnoti saubhagyamanantakalam bhuyatsada tasya samastasiddhih || 9 || || iti shrimatparamahamsaparivrajakacaryasya
    shrigovindabhagavatpujyapadashishyasya shrimacchamkarabhagavatah kritau ardhanarishvarastotram sampurnam
    ||
  devanagari: अर्धनारीश्वरस्तोत्रम् शंकरभगवतः अर्धनारीश्वरस्तोत्रम् शंकरभगवतः ॥ अर्धनारीश्वरस्तोत्रम्
    ॥ चाम्पेयगौरार्धशरीरकायै कर्पूरगौरार्धशरीरकाय। धम्मिल्लकायै च जटाधराय नमः शिवायै च नमः शिवाय ॥ १ ॥
    कस्तूरिकाकुङ्कुमचर्चितायै चितारजःपुञ्जविचर्चिताय। कृतस्मरायै विकृतस्मराय नमः शिवायै च नमः शिवाय ॥
    २ ॥ झणत्क्वणत्कङ्कणनूपुरायै पादाब्जराजत्फणिनूपुराय। हेमाङ्गदायै भुजगाङ्गदाय नमः शिवायै च नमः शिवाय
    ॥ ३ ॥ विशालनीलोत्पललोचनायै विकासिपङ्केरुहलोचनाय। समेक्षणायै विषमेक्षणाय नमः शिवायै च नमः शिवाय ॥ ४
    ॥ मन्दारमालाकलितालकायै कपालमालाङ्कितकन्धराय। दिव्याम्बरायै च दिगम्बराय नमः शिवायै च नमः शिवाय ॥ ५
    ॥ अम्भोधरश्यामलकुन्तलायै तडित्प्रभाताम्रजटाधराय। निरीश्वरायै निखिलेश्वराय नमः शिवायै च नमः शिवाय ॥
    ६ ॥ प्रपञ्चसृष्ट्युन्मुखलास्यकायै समस्तसंहारकताण्डवाय। जगज्जनन्यै जगदेकपित्रे नमः शिवायै च नमः शिवाय
    ॥ ७ ॥ प्रदीप्तरत्नोज्ज्वलकुण्डलायै स्फुरन्महापन्नगभूषणाय। शिवान्वितायै च शिवान्विताय नमः शिवायै च
    नमः शिवाय ॥ ८ ॥ एतत्पठेदष्टकमिष्टदं यो भक्त्या स मान्यो भुवि दीर्घजीवी। प्राप्नोति सौभाग्यमनन्तकालं
    भूयात्सदा तस्य समस्तसिद्धिः ॥ ९ ॥ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य
    श्रीमच्छंकरभगवतः कृतौ अर्धनारीश्वरस्तोत्रम् सम्पूर्णम् ॥
