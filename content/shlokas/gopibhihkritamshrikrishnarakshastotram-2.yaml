id: gopibhihkritamshrikrishnarakshastotram-2
category: raksha
name:
  english: gopibhihkritamshrikrishnarakshastotram
  devanagari: गोपीभिःकृतंश्रीकृष्णरक्षास्तोत्रम्
content:
  english: starkshyah kshitau haladharah purushah samantat || 23|| indriyani hrishikeshah pranan narayano'vatu
    | shvetadvipapatishcittam mano yogeshvaro'vatu || 24|| prishnigarbhastu te buddhimatmanam bhagavan
    parah | kridantam patu govindah shayanam patu madhavah || 25|| vrajantamavyadvaikuntha asinam tvam
    shriyahpatih | bhunjanam yajnabhukpatu sarvagrahabhayankarah || 26|| dakinyo yatudhanyashca kushmanda
    ye'rbhakagrahah | bhutapretapishacashca yaksharakshovinayakah || 27|| kotara revati jyeshtha putana
    matrikadayah | unmada ye hyapasmara dehapranendriyadruhah || 28|| svapnadrishta mahotpata vriddhabalagrahashca
    ye | sarve nashyantu te vishnornamagrahanabhiravah || 29|| iti shrimadbhagavatamahapurane dashamaskandhe
    purvardhe tritiyadhyayantargatam gopibhih kritam shrikrishnarakshastotram samaptam | bhagavatapurana
    | adhyaya 10
  devanagari: स्तार्क्ष्यः क्षितौ हलधरः पुरुषः समन्तात् ॥ २३॥ इन्द्रियाणि हृषीकेशः प्राणान् नारायणोऽवतु
    । श्वेतद्वीपपतिश्चित्तं मनो योगेश्वरोऽवतु ॥ २४॥ पृश्निगर्भस्तु ते बुद्धिमात्मानं भगवान् परः । क्रीडन्तं
    पातु गोविन्दः शयानं पातु माधवः ॥ २५॥ व्रजन्तमव्याद्वैकुण्ठ आसीनं त्वां श्रियःपतिः । भुञ्जानं यज्ञभुक्पातु
    सर्वग्रहभयङ्करः ॥ २६॥ डाकिन्यो यातुधान्यश्च कूष्माण्डा येऽर्भकग्रहाः । भूतप्रेतपिशाचाश्च यक्षरक्षोविनायकाः
    ॥ २७॥ कोटरा रेवती ज्येष्ठा पूतना मातृकादयः । उन्मादा ये ह्यपस्मारा देहप्राणेन्द्रियद्रुहः ॥ २८॥ स्वप्नदृष्टा
    महोत्पाता वृद्धबालग्रहाश्च ये । सर्वे नश्यन्तु ते विष्णोर्नामग्रहणभीरवः ॥ २९॥ इति श्रीमद्भागवतमहापुराणे
    दशमस्कन्धे पूर्वार्धे तृतीयाध्यायान्तर्गतं गोपीभिः कृतं श्रीकृष्णरक्षास्तोत्रं समाप्तम् । भागवतपुराण
    । अध्याय १०
meaning: {}
