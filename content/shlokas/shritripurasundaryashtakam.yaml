id: shritripurasundaryashtakam
category: stotram
name:
  english: shritripurasundaryashtakam
  devanagari: श्रीत्रिपुरसुन्दर्यष्टकम्
content:
  english: tripurasundariashtakam kadambavanacarinim munikadambakadambinim nitambajita bhudharam suranitambinisevitam
    | navamburuhalocanamabhinavambudashyamalam trilocanakutumbinim tripurasundarimashraye ||1|| kadambavanavasinim
    kanakavallakidharinim mahaharmaniharinim mukhasamullasadvarunim | dayavibhavakarinim vishadalocanim
    carinim trilocanakutumbinim tripurasundarimashraye ||2|| kadambavanashalaya kucabharollasanmalaya
    kucopamitashailaya gurukripalasadvelaya | madarunakapolaya madhuragitavacalaya kaya'pi ghananilaya
    kavacita vayam lilaya ||3|| kadambavanamadhyagam kanakamandalopasthitam shadamburuhavasinim satatasiddhasaudaminim
    | vidambitajaparucim vikacacamdracudamanim trilocanakutumbinim tripurasundarimashraye ||4|| kucancitavipancikam
    kutilakuntalalamkritam kusheshayanivasinim kutilacittavidveshinim | madarunavilocanam manasijarisammohinim
    matangamunikanyakam madhurabhashinimashraye ||5|| smaraprathamapushpinim rudhirabindunilambaram grihitamadhupatrikam
    madavighunarnetrancalam | ghanastanabharonnatam galitaculikam shyamalam trilocanakutumbinim tripurasundarimashraye
    ||6|| sakunkumavilepanamalakacumbikasturikam samandahasitekshanam sasharacapapashankusham | asheshajanamohinimarunamalya
    bhushambaram japakusumabhasuram japavidhau smaramyambikam ||7|| puramdarapuramdhrikam cikurabandhasairamdhrikam
    pitamahapativratam patapatiracacarratam | mukundaramanimanilasadalamkriyakarinim bhajami bhuvanambikam
    suravadhutikacetikam ||8|| ||iti shrimad shamkaracaryaviracitam tripurasundariashtakam samaptam ||
  devanagari: त्रिपुरसुन्दरीअष्टकम् कदम्बवनचारिणीं मुनिकदम्बकादम्बिनीं नितम्बजित भूधरां सुरनितम्बिनीसेविताम्
    । नवाम्बुरुहलोचनामभिनवाम्बुदश्यामलां त्रिलोचनकुटुम्बिनीं त्रिपुरसुन्दरीमाश्रये ।।१।। कदम्बवनवासिनीं
    कनकवल्लकीधारिणीं महाहर्मणिहारिणीं मुखसमुल्लसद्वारुणीम् । दयाविभवकारिणीं विशदलोचनीं चारिणीं त्रिलोचनकुटुम्बिनीं
    त्रिपुरसुन्दरीमाश्रये ।।२।। कदम्बवनशालया कुचभरोल्लसन्मालया कुचोपमितशैलया गुरुकृपालसद्वेलया । मदारुणकपोलया
    मधुरगीतवाचालया कयाऽपि घननीलया कवचिता वयं लीलया ।।३।। कदम्बवनमध्यगां कनकमण्डलोपस्थितां षडम्बुरुहवासिनीं
    सततसिद्धसौदामिनीम् । विडम्बितजपारुचिं विकचचंद्रचूडामणिं त्रिलोचनकुटुम्बिनीं त्रिपुरसुन्दरीमाश्रये
    ।।४।। कुचाञ्चितविपञ्चिकां कुटिलकुन्तलालंकृतां कुशेशयनिवासिनीं कुटिलचित्तविद्वेषिणीम् । मदारुणविलोचनां
    मनसिजारिसंमोहिनीं मतङ्गमुनिकन्यकां मधुरभाषिणीमाश्रये ।।५।। स्मरप्रथमपुष्पिणीं रुधिरबिन्दुनीलाम्बरां
    गृहीतमधुपात्रिकां मदविघूणर्नेत्राञ्चलां । घनस्तनभरोन्नतां गलितचूलिकां श्यामलां त्रिलोचनकुटुंबिनीं
    त्रिपुरसुन्दरीमाश्रये ।।६।। सकुङ्कुमविलेपनामलकचुंबिकस्तूरिकां समन्दहसितेक्षणां सशरचापपाशाङ्कुशाम्
    । अशेषजनमोहिनीमरुणमाल्य भूषाम्बरां जपाकुसुमभासुरां जपविधौ स्मराम्यम्बिकाम् ।।७।। पुरंदरपुरंध्रिकां
    चिकुरबन्धसैरंध्रिकां पितामहपतिव्रतां पटपटीरचचार्रताम् । मुकुन्दरमणीमणीलसदलंक्रियाकारिणीं भजामि भुवनांबिकां
    सुरवधूटिकाचेटिकाम् ।।८।। ।।इति श्रीमद् शंकराचार्यविरचितं त्रिपुरसुन्दरीअष्टकं समाप्तं ।।
