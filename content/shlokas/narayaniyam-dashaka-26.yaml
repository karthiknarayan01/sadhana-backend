id: narayaniyam-dashaka-26
category: stotram
name:
  english: Narayaniyam Dashaka 26
content:
  english: indradyumnah pandyakhandadhiraja stvadbhaktatma candanadrau kadacit | tvat sevayam magnadhiraluloke
    naivagastyam praptamatithyakamam || || kumbhodbhutih sambhritakrodhabharah stabdhatma tvam hastibhuyam
    bhajeti | shaptva'thainam pratyagat so'pi lebhe hastindratvam tvatsmritivyaktidhanyam || || dagdhambhodhermadhyabhaji
    trikute kridanchaile yuthapo'yam vashabhih | sarvan jantunatyavartishta shaktya tvadbhaktanam kutra
    notkarshalabhah || || svena sthemna divyadeshatvashaktya so'yam khedanaprajanan kadacit | shailaprante
    gharmatantah sarasyam yuthaissardham tvatpranunno'bhireme || || huhustavaddevalasyapi shapat grahibhutastajjale
    bartamanah | jagrahainam hastinam padadeshe shantyartham hi shrantido'si svakanam || || tvatsevaya
    vaibhavat durnirodham yudhyantam tam vatsaranam sahasram | prapte kale tvatpadaikagryasidhyai nakrakrantam
    hastivaryam vyadhastvam || || artivyaktapraktanajnanabhaktih shundotkshiptaih pundarikaih samarcan
    | purvabhyastam nirvisheshatmanishtham stotram shreshtham so'nvagadit paratman || || shrutva stotram
    nirgunastham samastam brahmeshadyairnahamityaprayate | sarvatma tvam bhurikarunyavegat tarkshyarudhah
    prekshito'bhuh purastat || || hastindram tam hastapadmena dhritva cakrena tvam nakravaryam vyadarih
    | gandharve'smin muktashape sa hasti tvatsarupyam prapya dedipyate sma || || etadvrittam tvam ca mam
    ca prage yo gayetso'yam bhuyase shreyase syat | ityuktvainam tena sardham gatastvam dhishnyam vishno
    pahi vatalayesha ||
  devanagari: इन्द्रद्युम्नः पाण्ड्यखण्डाधिराज स्त्वद्भक्तात्मा चन्दनाद्रौ कदाचित् । त्वत् सेवायां मग्नधीरालुलोके
    नैवागस्त्यं प्राप्तमातिथ्यकामम् ॥ ॥ कुम्भोद्भूतिः सम्भृतक्रोधभारः स्तब्धात्मा त्वं हस्तिभूयं भजेति
    । शप्त्वाऽथैनं प्रत्यगात् सोऽपि लेभे हस्तीन्द्रत्वं त्वत्स्मृतिव्यक्तिधन्यम् ॥ ॥ दग्धाम्भोधेर्मध्यभाजि
    त्रिकूटे क्रीडञ्छैले यूथपोऽयं वशाभिः । सर्वान् जन्तूनत्यवर्तिष्ट शक्त्या त्वद्भक्तानां कुत्र नोत्कर्षलाभः
    ॥ ॥ स्वेन स्थेम्ना दिव्यदेशत्वशक्त्या सोऽयं खेदानप्रजानन् कदाचित् । शैलप्रान्ते घर्मतान्तः सरस्यां
    यूथैस्सार्धं त्वत्प्रणुन्नोऽभिरेमे ॥ ॥ हूहूस्तावद्देवलस्यापि शापात् ग्राहीभूतस्तज्जले बर्तमानः । जग्राहैनं
    हस्तिनं पाददेशे शान्त्यर्थं हि श्रान्तिदोऽसि स्वकानाम् ॥ ॥ त्वत्सेवाया वैभवात् दुर्निरोधं युध्यन्तं
    तं वत्सराणां सहस्रम् । प्राप्ते काले त्वत्पदैकाग्र्यसिध्यै नक्राक्रान्तं हस्तिवर्यं व्यधास्त्वम् ॥
    ॥ आर्तिव्यक्तप्राक्तनज्ञानभक्तिः शुण्डोत्क्षिप्तैः पुण्डरीकैः समर्चन् । पूर्वाभ्यस्तं निर्विशेषात्मनिष्ठं
    स्तोत्रं श्रेष्ठं सोऽन्वगादीत् परात्मन् ॥ ॥ श्रुत्वा स्तोत्रं निर्गुणस्थं समस्तं ब्रह्मेशाद्यैर्नाहमित्यप्रयाते
    । सर्वात्मा त्वं भूरिकारुण्यवेगात् तार्क्ष्यारूढः प्रेक्षितोऽभूः पुरस्तात् ॥ ॥ हस्तीन्द्रं तं हस्तपद्मेन
    धृत्वा चक्रेण त्वं नक्रवर्यं व्यदारीः । गन्धर्वेऽस्मिन् मुक्तशापे स हस्ती त्वत्सारूप्यं प्राप्य देदीप्यते
    स्म ॥ ॥ एतद्वृत्तं त्वां च मां च प्रगे यो गायेत्सोऽयं भूयसे श्रेयसे स्यात् । इत्युक्त्वैनं तेन सार्धं
    गतस्त्वं धिष्ण्यं विष्णो पाहि वातालयेश ॥
