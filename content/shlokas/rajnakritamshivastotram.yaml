id: rajnakritamshivastotram
category: stotram
name:
  english: rajnakritamshivastotram
  devanagari: राज्नाकृतंशिवस्तोत्रम्
content:
  english: nathah yatte kincidvrittamullasya shambhum | papanmukta yanti tajjyotiraisham pashapayam naumi
    natham pashunam || 63|| hetussakshi tanniyantapahanta jantorantarjivarupo ca bhuyah | ye'sprishyatma
    kathyate brahmavidbhih so'yam shambhuh patu nah karmabandhat || 64|| vishvatma yo vishvarupo niyanta
    kale kale yojayitva svavritya | kalakshepam kalpayatyesha nityam tasmai dhamne kalpaye cittamaddha
    || 65|| yuktya mantrairvedatattvarthadrishtaih buddhya shuddhya vagvilasadgurunam | anveshante yogino
    yatpadabjam tasminnasha bhuyasi me'stu nityam || 66|| nityam shuddham nirvikalpam puranam satyam sukshmam
    sarvasankalpahinam | shraddhamatram shambhumadyam vinodatsalankaram karayennilakantham || 67|| deva
    prasida parameshvara candramaule lilavisheshaparikalpitapancakritya | pashyan trikalabhavabhutapate
    dayalo mam pahi mohakuharadgahanatprapannam || 68|| iti tamraparnimahatmye 51
  devanagari: नाथाः यत्ते किञ्चिद्वृत्तमुल्लास्य शम्भुम् । पापान्मुक्ता यान्ति तज्ज्योतिरैशं पाशापायं
    नौमि नाथं पशूनाम् ॥ ६३॥ हेतुस्साक्षी तन्नियन्तापहन्ता जन्तोरन्तर्जीवरूपो च भूयः । येऽस्पृश्यात्मा
    कथ्यते ब्रह्मविद्भिः सोऽयं शम्भुः पातु नः कर्मबन्धात् ॥ ६४॥ विश्वात्मा यो विश्वरूपो नियन्ता काले काले
    योजयित्वा स्ववृत्या । कालक्षेपं कल्पयत्येष नित्यं तस्मै धाम्ने कल्पये चित्तमद्धा ॥ ६५॥ युक्त्या मन्त्रैर्वेदतत्त्वार्थदृष्टैः
    बुद्ध्या शुद्ध्या वाग्विलासाद्गुरूणाम् । अन्वेषन्ते योगिनो यत्पदाब्जं तस्मिन्नाशा भूयसी मेऽस्तु नित्यम्
    ॥ ६६॥ नित्यं शुद्धं निर्विकल्पं पुराणं सत्यं सूक्ष्मं सर्वसङ्कल्पहीनम् । श्रद्धामात्रं शम्भुमाद्यं
    विनोदात्सालङ्कारं कारयेन्नीलकण्ठम् ॥ ६७॥ देव प्रसीद परमेश्वर चन्द्रमौले लीलाविशेषपरिकल्पितपञ्चकृत्य
    । पश्यन् त्रिकालभवभूतपते दयालो मां पाहि मोहकुहराद्गहनात्प्रपन्नम् ॥ ६८॥ इति ताम्रपर्णीमाहात्म्ये ५१
