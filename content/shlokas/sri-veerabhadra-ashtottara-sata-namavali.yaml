id: sri-veerabhadra-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Veerabhadra Ashtottara Sata Namavali
content:
  english: om virabhadraya namah | om mahashuraya namah | om raudraya namah | om rudravatarakaya namah
    | om shyamangaya namah | om ugradamshtraya namah | om bhimanetraya namah | om jitendriyaya namah |
    om urdhvakeshaya namah | om bhutanathaya namah | om khadgahastaya namah | om trivikramaya namah |
    om vishvavyapine namah | om vishvanathaya namah | om vishnucakravibhanjanaya namah | om bhadrakalipataye
    namah | om bhadraya namah | om bhadrakshabharananvitaya namah | om bhanudantabhide namah | om ugraya
    namah | om bhagavate namah | om bhavagocaraya namah | om candamurtaye namah | om caturbahave namah
    om caturaya namah | om candrashekharaya namah | om satyapratijnaya namah | om sarvatmane namah | om
    sarvasakshine namah | om niramayaya namah | om nityanishthitapapaughaya namah | om nirvikalpaya namah
    | om niranjanaya namah | om bharatinasikacchadaya namah | om bhavarogamahabhishaje namah | om bhaktaikarakshakaya
    namah | om balavate namah | om bhasmoddhulitavigrahaya namah | om daksharaye namah | om dharmamurtaye
    namah | om daityasanghabhayankaraya namah | om patrahastaya namah | om pavakakshaya namah | om padmajakshadivanditaya
    namah | om makhantakaya namah | om mahatejase namah | om mahabhayanivaranaya namah | om mahaviraya
    namah om ganadhyakshaya namah | om mahaghoranrisimhajite namah | om nishvasamarutoddhutakulaparvatasancayaya
    namah | om dantanishpeshanaravamukharikritadiktataya namah | om padasanghattanodbhrantasheshashirshasahasrakaya
    namah | om bhanukotiprabhabhasvanmanikundalamanditaya namah | om sheshabhushaya namah | om carmavasase
    namah | om caruhastojjvalattanave namah | om upendrendrayamadidevanamangarakshakaya namah | om pattisaprasaparashugadadyayudhashobhitaya
    namah | om brahmadidevadushprekshyaprabhashumbhatkiritadhrite namah | om kushmandagrahabhetalamariganavibhanjanaya
    namah | om kridakandukitajandabhandakotivirajitaya namah | om sharanagatavaikunthabrahmendramararakshakaya
    namah | om yogindrahritpayojatamahabhaskaramandalaya namah | om sarvadevashiroratnasanghrishtamanipadukaya
    namah | om graiveyaharakeyurakancikatakabhushitaya namah | om vagatitaya namah | om dakshaharaya namah
    | om vahnijihvanikrintanaya namah | om sahasrabahave namah | om sarvajnaya namah | om saccidanandavigrahaya
    namah | om bhayahvayaya namah | om bhaktalokarati tikshnavilocanaya namah | om karunyakshaya namah
    | om ganadhyakshaya namah | om garvitasuradarpahrite namah | om sampatkaraya namah | om sadanandaya
    namah | om sarvabhishtaphalapradaya namah | om nupuralankritapadaya namah | om vyalayajnopavitakaya
    namah | om bhaganetraharaya namah | om dirghabahave namah | om bandhavimocakaya namah | om tejomayaya
    namah | om kavacaya namah | om bhrigushmashruvilumpakaya namah | om yajnapurushashirshaghnaya namah
    | om yajnaranyadavanalaya namah | om bhaktaikavatsalaya namah | om bhagavate namah | om sulabhaya
    namah | om shashvataya namah | om nidhaye namah | om sarvasiddhikaraya namah | om dantaya namah |
    om sakalagamashobhitaya namah | om bhuktimuktipradaya namah | om devaya namah | om sarvavyadhinivarakaya
    namah | om akalamrityusamhartre namah | om kalamrityubhayankaraya namah | om grahakarshananirbandhamaranoccatanapriyaya
    namah | om paratantravinirbandhaya namah | om paramatmane namah | om paratparaya namah | om svamantrayantratantraghaparipalanatatparaya
    namah | om pujakashreshthashighravarapradaya namah | iti shri virabhadrashtottarashatanamavalih |
  devanagari: ॐ वीरभद्राय नमः । ॐ महाशूराय नमः । ॐ रौद्राय नमः । ॐ रुद्रावतारकाय नमः । ॐ श्यामाङ्गाय नमः
    । ॐ उग्रदंष्ट्राय नमः । ॐ भीमनेत्राय नमः । ॐ जितेन्द्रियाय नमः । ॐ ऊर्ध्वकेशाय नमः । ॐ भूतनाथाय नमः
    । ॐ खड्गहस्ताय नमः । ॐ त्रिविक्रमाय नमः । ॐ विश्वव्यापिने नमः । ॐ विश्वनाथाय नमः । ॐ विष्णुचक्रविभञ्जनाय
    नमः । ॐ भद्रकालीपतये नमः । ॐ भद्राय नमः । ॐ भद्राक्षाभरणान्विताय नमः । ॐ भानुदन्तभिदे नमः । ॐ उग्राय
    नमः । ॐ भगवते नमः । ॐ भावगोचराय नमः । ॐ चण्डमूर्तये नमः । ॐ चतुर्बाहवे नमः ॐ चतुराय नमः । ॐ चन्द्रशेखराय
    नमः । ॐ सत्यप्रतिज्ञाय नमः । ॐ सर्वात्मने नमः । ॐ सर्वसाक्षिणे नमः । ॐ निरामयाय नमः । ॐ नित्यनिष्ठितपापौघाय
    नमः । ॐ निर्विकल्पाय नमः । ॐ निरञ्जनाय नमः । ॐ भारतीनासिकच्छादाय नमः । ॐ भवरोगमहाभिषजे नमः । ॐ भक्तैकरक्षकाय
    नमः । ॐ बलवते नमः । ॐ भस्मोद्धूलितविग्रहाय नमः । ॐ दक्षारये नमः । ॐ धर्ममूर्तये नमः । ॐ दैत्यसङ्घभयङ्कराय
    नमः । ॐ पात्रहस्ताय नमः । ॐ पावकाक्षाय नमः । ॐ पद्मजाक्षादिवन्दिताय नमः । ॐ मखान्तकाय नमः । ॐ महातेजसे
    नमः । ॐ महाभयनिवारणाय नमः । ॐ महावीराय नमः ॐ गणाध्यक्षाय नमः । ॐ महाघोरनृसिंहजिते नमः । ॐ निश्वासमारुतोद्धूतकुलपर्वतसञ्चयाय
    नमः । ॐ दन्तनिष्पेषणारावमुखरीकृतदिक्तटाय नमः । ॐ पादसङ्घट्टनोद्भ्रान्तशेषशीर्षसहस्रकाय नमः । ॐ भानुकोटिप्रभाभास्वन्मणिकुण्डलमण्डिताय
    नमः । ॐ शेषभूषाय नमः । ॐ चर्मवाससे नमः । ॐ चारुहस्तोज्ज्वलत्तनवे नमः । ॐ उपेन्द्रेन्द्रयमादिदेवानामङ्गरक्षकाय
    नमः । ॐ पट्टिसप्रासपरशुगदाद्यायुधशोभिताय नमः । ॐ ब्रह्मादिदेवदुष्प्रेक्ष्यप्रभाशुम्भत्किरीटधृते नमः
    । ॐ कूष्माण्डग्रहभेतालमारीगणविभञ्जनाय नमः । ॐ क्रीडाकन्दुकिताजाण्डभाण्डकोटीविराजिताय नमः । ॐ शरणागतवैकुण्ठब्रह्मेन्द्रामररक्षकाय
    नमः । ॐ योगीन्द्रहृत्पयोजातमहाभास्करमण्डलाय नमः । ॐ सर्वदेवशिरोरत्नसङ्घृष्टमणिपादुकाय नमः । ॐ ग्रैवेयहारकेयूरकाञ्चीकटकभूषिताय
    नमः । ॐ वागतीताय नमः । ॐ दक्षहराय नमः । ॐ वह्निजिह्वानिकृन्तनाय नमः । ॐ सहस्रबाहवे नमः । ॐ सर्वज्ञाय
    नमः । ॐ सच्चिदानन्दविग्रहाय नमः । ॐ भयाह्वयाय नमः । ॐ भक्तलोकाराति तीक्ष्णविलोचनाय नमः । ॐ कारुण्याक्षाय
    नमः । ॐ गणाध्यक्षाय नमः । ॐ गर्वितासुरदर्पहृते नमः । ॐ सम्पत्कराय नमः । ॐ सदानन्दाय नमः । ॐ सर्वाभीष्टफलप्रदाय
    नमः । ॐ नूपुरालङ्कृतपदाय नमः । ॐ व्यालयज्ञोपवीतकाय नमः । ॐ भगनेत्रहराय नमः । ॐ दीर्घबाहवे नमः । ॐ
    बन्धविमोचकाय नमः । ॐ तेजोमयाय नमः । ॐ कवचाय नमः । ॐ भृगुश्मश्रुविलुम्पकाय नमः । ॐ यज्ञपूरुषशीर्षघ्नाय
    नमः । ॐ यज्ञारण्यदवानलाय नमः । ॐ भक्तैकवत्सलाय नमः । ॐ भगवते नमः । ॐ सुलभाय नमः । ॐ शाश्वताय नमः ।
    ॐ निधये नमः । ॐ सर्वसिद्धिकराय नमः । ॐ दान्ताय नमः । ॐ सकलागमशोभिताय नमः । ॐ भुक्तिमुक्तिप्रदाय नमः
    । ॐ देवाय नमः । ॐ सर्वव्याधिनिवारकाय नमः । ॐ अकालमृत्युसंहर्त्रे नमः । ॐ कालमृत्युभयङ्कराय नमः । ॐ
    ग्रहाकर्षणनिर्बन्धमारणोच्चाटनप्रियाय नमः । ॐ परतन्त्रविनिर्बन्धाय नमः । ॐ परमात्मने नमः । ॐ परात्पराय
    नमः । ॐ स्वमन्त्रयन्त्रतन्त्राघपरिपालनतत्पराय नमः । ॐ पूजकश्रेष्ठशीघ्रवरप्रदाय नमः । इति श्री वीरभद्राष्टोत्तरशतनामावलिः
    ।
