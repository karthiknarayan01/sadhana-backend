id: ujjvalavemkatanathastotram
category: stotram
name:
  english: ujjvalavemkatanathastotram
  devanagari: उज्ज्वलवेंकटनाथस्तोत्रम्
content:
  english: shishudashashashalinimapi vitarato vara vitara sham mama || 8|| mamataya yaya''vila matirudayate
    mama sapadi tam hara karunaya yaya shubha mama vitara tamayi vrishagirishvara sadudayayayasamricchasi
    na daramapyarividalanadishu madudayayayasamipsasi na tu katham mama ripujayaya ca | mayi dayaya yasi
    kena tu na padatam nanu nigada tanmama mama vibho bho bhoginayakashayana me matamarijayam disha parama
    yaya ya daya tava niravadhim mayi jhatiti tamayi sumahima ma madhava kshatimupagamattava mama krite'nagha
    || 9|| ghatitapapaparadurbhatapataladurghatanidhanakarana ranadharararatpalayananijanidarshitabahubalayana
    daravarararavanashana madhuvinashana mama manodhana ripulayayayahi pahi na idamaram mama kalaya pavana
    | sutarasasasaradriktatiratishubha tava nipatatanmayi saharamo momottu santatamayi bhavanmayi vrishagiravapi
    pratidinam namnamyate mama mana upekshitatadaparam tvayi tadaripapapasanam kuru vrishagirishvara satatamujjvala
    || 10|| ujjvalavenkatanathastotram pathatam dhruva'rivijayashrih shrirangoktam lasati yadamritam sarajnahridayasarange
    || 11|| || iti ujjvalavenkatanathastotram sampurnam ||
  devanagari: शिशुदशाशाशालिनीमपि वितरतो वर वितर शं मम ॥ ८॥ ममतया यायाऽऽविला मतिरुदयते मम सपदि तां हर करुणया
    याया शुभा मम वितर तामयि वृषगिरीश्वर सदुदयायायासमृच्छसि न दरमप्यरिविदलनादिषु मदुदयायायासमीप्ससि न तु
    कथं मम रिपुजयाय च । मयि दयाया यासि केन तु न पदतां ननु निगद तन्मम मम विभो भो भोगिनायकशयन मे मतमरिजयं
    दिश परम याया या दया तव निरवधिं मयि झटिति तामयि सुमहिमा मा माधव क्षतिमुपगमत्तव मम कृतेऽनघ ॥ ९॥ घटितपापापारदुर्भटपटलदुर्घटनिधनकारण
    रणधरारारात्पलायननिजनिदर्शितबहुबलायन दरवरारारावनाशन मधुविनाशन मम मनोधन रिपुलयायायाहि पाहि न इदमरं मम
    कलय पावन । सुतरसासासारदृक्ततिरतिशुभा तव निपततान्मयि सहरमो मोमोत्तु सन्ततमयि भवान्मयि वृषगिरावपि प्रतिदिनं
    नंनम्यते मम मन उपेक्षिततदपरं त्वयि तदरिपापापासनं कुरु वृषगिरीश्वर सततमुज्ज्वल ॥ १०॥ उज्ज्वलवेङ्कटनाथस्तोत्रं
    पठतां ध्रुवाऽरिविजयश्रीः श्रीरङ्गोक्तं लसति यदमृतं सारज्ञहृदयसारङ्गे ॥ ११॥ ॥ इति उज्ज्वलवेङ्कटनाथस्तोत्रं
    संपूर्णम् ॥
