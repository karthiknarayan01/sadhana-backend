id: shastastutidashakam
category: stotram
name:
  english: shastastutidashakam
  devanagari: शास्तास्तुतिदशकम्
content:
  english: gandasthalam samuditananapundarikam | arnojanabhaharayoriva murtimantam punyatirekamiva bhutapatim
    namami || 4|| uddandacarubhujadandayugagrasamstham kodandabanamahitantamadantaviryam | udyatprabhapataladipramadabhrasaram
    nityam prabhapatimaham pranato bhavami || 5|| maleyapankasamalankritabhasamana
  devanagari: गण्डस्थलं समुदिताननपुण्डरीकम् । अर्णोजनाभहरयोरिव मूर्तिमन्तं पुण्यातिरेकमिव भूतपतिं नमामि
    ॥ ४॥ उद्दण्डचारुभुजदण्डयुगाग्रसंस्थं कोदण्डबाणमहितान्तमदान्तवीर्यम् । उद्यत्प्रभापटलदीप्रमदभ्रसारं
    नित्यं प्रभापतिमहं प्रणतो भवामि ॥ ५॥ मालेयपङ्कसमलङ्कृतभासमान
meaning: {}
