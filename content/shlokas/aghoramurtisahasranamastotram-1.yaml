id: aghoramurtisahasranamastotram-1
category: sahasranama
name:
  english: aghoramurtisahasranamastotram 1
  devanagari: अघोरमूर्तिसहस्रनामस्तोत्रम् १
content:
  english: dharmadharmo dharmagatirdhanavandhanavallabhah | dhanurdharo dhanurdhanyo dhiresho dhimayo
    dhritih || 61|| dhakaranto dharapalo dharanisho dharapriyah | dharadharo dhareshano narado narasorasah
    || 62|| saraso viraso nago nagayajnopavitavan | nutilabhyo nutishano nutitushto nutishvarah || 63||
    pivaranga parakarah parameshah paratparah | paravarah param punyam paramurtih param padam || 64||
    parogamyah parantejah paramrupah paropakrit | prithvipatih patih putih putatma putanayakah || 65||
    paragah paradrishva ca pavanah pavanatmajah | pranado'panadah panthah samanavyanado varam || 66||
    udanadah pranagatih praninam pranaharakah | pumsam patiyanparamah paramam sthanakah pavih || 67||
    ravih pitananah pitham pathinakritiratmavan | patri pitah pavitram ca pathanam pathanapriyah || 68||
    parvatishah parvateshah parveshah parvaghatanah | phani phanida ishanah phullahastah phanakritih ||
    69|| phaniharah phanimurtih phenatma phanivallabhah | bali balipriyo balo balalapi balandharah ||
    70|| balako balahastashca balibhugbalanashanah | balirajo balankari banahasto'rdhavarnabhrit || 71||
    bhadri bhadraprado bhasvanbhamayo bhramayonayah | bhavyo bhavapriyo bhanurbhanumanbhimanandakah ||
    72|| bhurido bhutanathashca bhutalam sutalam talam | bhayaha bhavanakarta bhavaha bhavaghatakah ||
    73|| bhavo vibhavado bhito bhutabhavyo bhavapriyah | bhavanisho bhageshtashca bhagapujanaposhanah
    || 74|| makuro manado mukto malino malanashanah | maraharta mahodhishca mahasvi mahatipriyah || 75||
    minaketurmahamaro maheshva madanantakah | mithunesho mahamoho mallo mallantako munih || 76|| maricih
    rucimanyogi manjulesho'maradhipah | mardano mohamardi ca medhavi medinipatih || 77|| mahipatih sahasraro
    mudito manaveshvarah | mauni maunapriyo masah pakshi madhava ishtavan || 78|| matsari mapatirmesho
    meshopaharatoshitah | manikyamandito mantri manipuranivasakah || 79|| mandamunmadarupashca menaki
    priyadarshanah | mahesho megharupashca makaramritadarshanah || 80|| yajjva yajnapriyo yajno yashasvi
    yajnabhugyuva | yodhapriyo yamapriyo yaminatho yamakshayah || 81|| yajniko yajnamanashca yajnamurtiryashodharah
    | ravih sunayano ratnarasiko ramashekharah || 82|| lavanyam lalaso luto lajjalurlalanapriyah | lambamurtivilambi
    ca lolajihvo lulundharah || 83|| vasudo vasumanvastuvagbhavo vatuko vatuh | vitipriyo vitanki ca vitapi
    vihagadhipah || 84|| vishvamodi vinayado vishvaprito vinayakah | vinantako vinamshako vaimaniko varapradah
    || 85|| shambhuh shacipatih sharasamado vakulapriyah | shitalah shitarupashca shavari pranato vashi
    || 86|| shitaluh shishirah shaityah shitarashmih sitamshuman | shiladah shilavan shali shalinah shashimandanah
    || 87|| shandah shantah shipivishtah shavarnojjvalarupavan | siddhasevyah sitanathah siddhikah siddhidayakah
    || 88|| sadhyo suralayah saumyah siddhibhuh siddhibhavanah | siddhantavallabhah smerah sitavaktrah
    sabhapatih || 89|| sarodhishah sarinnathah sitabhashcetanasamah | satyapah satyamurtishca sindhurajah
    sadashivah || 90|| sadeshah sadanasurih sevyamanah satangatih | satambhavyah sadanathah sarasvansamadarshanah
    || 91|| susantushtah saticetah satyavadi satiratah | sarvaradhyah sarvapatih samayi samayah svayam
    || 92|| svayambhuh svayamatmiyah svayambhavah samatmakah | suradhyakshah surapatih sarojasanasevakah
    || 93|| sarojakshanishevyashca sarojadalalocanah | sumatih kumatih stutyah suranayakanayakah || 94||
    sudhapriyah sudheshashca sudhamurtih sudhakarah | hirako hiravamshcaiva hetuh hatakamandanah || 95||
    hatakesho hathadharo haridratnavibhushanah | hitakriddhetubhutashca hasyado hasyavaktrakah || 96||
    haro harapriyo hari havishmallocano harih | havishmanhavibhugvadyo havyam havirbhujam varah || 97||
    hamsah paramahamsashca hamsinatho halayudhah | haridashvo haristutyo herambo lambitodarah || 98||
    kshamapatih kshamah kshantah kshuradharo'kshibhimakah | kshitinathah kshaneshtashca kshanavayuh kshavah
    kshatah || 99|| kshinashca kshanikah kshamah kshavarnamritapithakah | akaradi kshakaranta vidyamalavibhushanah
    || 100|| svara vyanjana bhushadhyo hrasva dirgha vibhushanah | om kshmrim mahabhairaveshi om shrim
    bhairavapurvakah || 101|| om hrim vatukabhavesho om hrim vatukabhairavah | om klim shmashanavasi ca
    om hrim shmashanabhairavah || 102|| maim bhadrakalikanathah klim om hrim kalikapatih | aim sauh klim
    tripureshano om hrim jvalamukhipatih || 103|| aim klim sah sharadanatho om hrim martandabhairavah
    | om hrim sumantusevyashca om shrim hrim mattabhairavah || 104|| om shrim unmattacittashca om shrim
    um ugrabhairavah | om shrim kathoradeshashca om shrim hrim kathorabhairavah || 105|| om shrim kamandhakadhvamsi
    om shrim kamandhabhairavah | om shrim ashtasvarashcaiva om shrim ashtakabhairavah || 106|| om shrim
    hrim ashtamurtishca om shrim cinmurtibhairavah | om hrim hatakavarnashca om hrim hatakabhairavah ||
    107|| om shrim shashanka vadanah om shrim shitalabhairavah | om shrim shivarutashcaiva om shrim sharukabhairavah
    || 108|| om shrim ahamsvarupashca om hrim shrimundabhairavah | om shrim manonmanashcaiva om shrim
    mangalabhairavah || 109|| om shrim buddhimayashcaiva om shrim bhaimbuddhabhairavah | om shrim aim
    klim nagamurtih om shrim hrim nagabhairavah || 110|| om shrim klim kurmamurtishca om shrim krikarabhairavah
    | om hrim shrim devadattashca om shrim klim dattabhairavah || 111|| om hrim dhananjayashcaiva om shrim
    dhanikabhairavah | om shrim hrim rasarupashca om shrim rasikabhairavah || 112|| om shrim sparsharupashca
    om shrim hrim sparshabhairavah | om shrim hrim klim svarupashca om shrim hrim rupabhairavah || 113||
    om shrim sattvamayashcaiva om shrim hrim sattvabhairavah | om shrim rajogunatma ca om shrim rajasabhairavah
    || 114|| om shrim tamomayashcaiva om shrim tamasabhairavah | om shrim dharmamayashcaiva om him vai
    dharmabhairavah || 115|| om shrim hrim madhyacaitanyo om shrim caitanyabhairavah | om shrim hrim kshitimurtishca
    om hrim kshatrikabhairavah || 116|| om shrim hrim jalamurtishca om hrim jalendrabhairavah | om shrim
    pavanamurtishca om hrim pithakabhairavah || 117|| om shrim hutashamurtishca om hrim halakhabhairavah
    | om shrim hrim somamurtishca om shrim hrim saumyabhairavah || 118|| om shrim hrim suryamurtishca
    om shrim saurendrabhairavah | om jum sah hamsarupashca ham sah jum om mrityanjayah | om catvarimshadadhiko
    om shrim aghorabhairavah || 119|| aghorebhyo'tha ghorebhyo ghoraghoratarebhyah | sarvatah sarvasarvebhyo
    namaste rudrarupebhyah || 120|| bhairavesho'bhayavaradata devajanapriyah | om shrim hrim klim kshmyum
    devi vai aghoradarshanah || 121|| om shrim saundaryavandevo om aghorakripanidhih | sahasranama iti
    namnam sahasram tu aghorasya jagatprabhuh || 122|| tava bhaktya mayakhyatam trishu lokeshu durlabham
    | aprakashyamadatavyam goptavyam sharajanmanah || 123|| balyam balapradam stutyam stavaniyam stavottamam
    | pathedva pathayennityam dhyayeccetasi nityashah || 124|| adrashtavyamadikshaya goptavyam pashusankate
    | natah parataram kincitsarvasvam nasti me hridi || 125|| punyadam punyamatmiyam sakalam nishkalam
    param | pathenmantri nishithe tu nagnah shrimuktakuntalah || 126|| anantam citsudhakaram devanamapi
    durlabham | shaktya yukto japennamnam sahasram bhaktipurvakam || 127|| tatkshanatsadhakah satyam jivanmukto
    bhavishyati | bhaume'rka shanivare tu shmashane sadhakah pathet || 128|| sadyastasya svayam devo varadastu
    bhavishyati | dashavarttam pathedratrau naditireshu dhairyavan || 129|| tasya haste sada santi tryambakasyashtasiddhayah
    | madhyahe shivaratrau ca nishithe vividhe pathet || 130|| indradayah suragana vashameshyanti nanyatha
    | gurau brahmamuhurte tu pathedbhaktya ca sadhakah || 131|| yavadindrah sabhamadhye tadagre mukavat
    bhavet | shukre nadya jale mantri pathennamnam sahasrakam || 132|| tadaprabhriti trailokyam mohameshyati
    nanyatha | bhaume vanantare mantri pathetsandhyanidhau tada || 133|| shatruh kalasamano'pi mrityumeshyati
    nanyatha | trisandhyodayakale tu pathetsadhakasattamah || 134|| rambhadyapsarasah sarva vashamayanti
    tatkshanat | bhaume madhyahnasamaye pathecca kupasannidhau || 135|| sadyo devi mahantam karipumuccatayeddhruvam
    | sadyastrivaram pathennamnam sahasramuttamam || 136|| ihaloke bhavedbhogi pare muktirbhavishyati
    | arkavare samalikhya bhurjatvaci ca sadhakah || 137|| kunkumalaktakasturi gorocana manahshilah |
    sarvadyairvasubhirmantri veshtayettamrarajjuna || 138|| dharayenmurdhni sadyastu labhetkamanyathepsitan
    | putrandaramshca lakshmim ca yasho dharmam dhanani ca || 139|| labhate natra samshayah satyametadvaco
    mama | vinanena mahadevi pathedyah kavacam shubham || 140|| tasya jivam dhanam putran daranbhakshanti
    rakshasah | vinanena japet vidyamaghorasya ca sadhakah || 141|| tasya koti japam vyartham satyametadvaco
    mama | bahunatra kimuktena sahasrakhyam stavottamam || 142|| yadgrihe va japedyastu shravayedva sha
  devanagari: धर्माधर्मो धर्मगतिर्धनवान्धनवल्लभः । धनुर्धरो धनुर्धन्यो धीरेशो धीमयो धृतिः ॥ ६१॥ धकारान्तो
    धरापालो धरणीशो धराप्रियः । धराधरो धरेशानो नारदो नारसोरसः ॥ ६२॥ सरसो विरसो नागो नागयज्ञोपवीतवान् ।
    नुतिलभ्यो नुतीशानो नुतितुष्टो नुतीश्वरः ॥ ६३॥ पीवराङ्ग पराकारः परमेशः परात्परः । पारावारः परं पुण्यं
    परामूर्तिः परं पदम् ॥ ६४॥ परोगम्यः परन्तेजः परंरूपः परोपकृत् । पृथ्वीपतिः पतिः पूतिः पूतात्मा पूतनायकः
    ॥ ६५॥ पारगः पारदृश्वा च पवनः पवनात्मजः । प्राणदोऽपानदः पान्थः समानव्यानदो वरम् ॥ ६६॥ उदानदः प्राणगतिः
    प्राणिनां प्राणहारकः । पुंसां पटीयान्परमः परमं स्थानकः पविः ॥ ६७॥ रविः पीताननः पीठं पाठीनाकृतिरात्मवान्
    । पत्री पीतः पवित्रं च पाठनं पाठनप्रियः ॥ ६८॥ पार्वतीशः पर्वतेशः पर्वेशः पर्वघातनः । फणी फणिद ईशानः
    फुल्लहस्तः फणाकृतिः ॥ ६९॥ फणिहारः फणिमूर्तिः फेनात्मा फणिवल्लभः । बली बलिप्रियो बालो बालालापी बलन्धरः
    ॥ ७०॥ बालको बलहस्तश्च बलिभुग्बालनाशनः । बलिराजो बलङ्कारी बाणहस्तोऽर्धवर्णभृत् ॥ ७१॥ भद्री भद्रप्रदो
    भास्वान्भामयो भ्रमयोनयः । भव्यो भावप्रियो भानुर्भानुमान्भीमनन्दकः ॥ ७२॥ भूरिदो भूतनाथश्च भूतलं सुतलं
    तलम् । भयहा भावनाकर्ता भवहा भवघातकः ॥ ७३॥ भवो विभवदो भीतो भूतभव्यो भवप्रियः । भवानीशो भगेष्टश्च भगपूजनपोषणः
    ॥ ७४॥ मकुरो मानदो मुक्तो मलिनो मलनाशनः । मारहर्ता महोधिश्च महस्वी महतीप्रियः ॥ ७५॥ मीनकेतुर्महामारो
    महेष्वा मदनान्तकः । मिथुनेशो महामोहो मल्लो मल्लान्तको मुनिः ॥ ७६॥ मरीचिः रुचिमान्योगी मञ्जुलेशोऽमराधिपः
    । मर्दनो मोहमर्दी च मेधावी मेदिनीपतिः ॥ ७७॥ महीपतिः सहस्रारो मुदितो मानवेश्वरः । मौनी मौनप्रियो मासः
    पक्षी माधव इष्टवान् ॥ ७८॥ मत्सरी मापतिर्मेषो मेषोपहारतोषितः । माणिक्यमण्डितो मन्त्री मणिपूरनिवासकः
    ॥ ७९॥ मन्दमुन्मदरूपश्च मेनकी प्रियदर्शनः । महेशो मेघरूपश्च मकरामृतदर्शनः ॥ ८०॥ यज्ज्वा यज्ञप्रियो
    यज्ञो यशस्वी यज्ञभुग्युवा । योधप्रियो यमप्रियो यामीनाथो यमक्षयः ॥ ८१॥ याज्ञिको यज्ञमानश्च यज्ञमूर्तिर्यशोधरः
    । रविः सुनयनो रत्नरसिको रामशेखरः ॥ ८२॥ लावण्यं लालसो लूतो लज्जालुर्ललनाप्रियः । लम्बमूर्तिविलम्बी
    च लोलजिह्वो लुलुन्धरः ॥ ८३॥ वसुदो वसुमान्वास्तुवाग्भवो वटुको वटुः । वीटीप्रियो विटङ्की च विटपी विहगाधिपः
    ॥ ८४॥ विश्वमोदी विनयदो विश्वप्रीतो विनायकः । विनान्तको विनांशको वैमानिको वरप्रदः ॥ ८५॥ शम्भुः शचीपतिः
    शारसमदो वकुलप्रियः । शीतलः शीतरूपश्च शावरी प्रणतो वशी ॥ ८६॥ शीतालुः शिशिरः शैत्यः शीतरश्मिः सितांशुमान्
    । शीलदः शीलवान् शाली शालीनः शशिमण्डनः ॥ ८७॥ शण्डः शण्टः शिपिविष्टः षवर्णोज्ज्वलरूपवान् । सिद्धसेव्यः
    सितानाथः सिद्धिकः सिद्धिदायकः ॥ ८८॥ साध्यो सुरालयः सौम्यः सिद्धिभूः सिद्धिभावनः । सिद्धान्तवल्लभः
    स्मेरः सितवक्त्रः सभापतिः ॥ ८९॥ सरोधीशः सरिन्नाथः सिताभश्चेतनासमः । सत्यपः सत्यमूर्तिश्च सिन्धुराजः
    सदाशिवः ॥ ९०॥ सदेशः सदनासूरिः सेव्यमानः सताङ्गतिः । सताम्भाव्यः सदानाथः सरस्वान्समदर्शनः ॥ ९१॥ सुसन्तुष्टः
    सतीचेतः सत्यवादी सतीरतः । सर्वाराध्यः सर्वपतिः समयी समयः स्वयम् ॥ ९२॥ स्वयम्भूः स्वयमात्मीयः स्वयम्भावः
    समात्मकः । सुराध्यक्षः सुरपतिः सरोजासनसेवकः ॥ ९३॥ सरोजाक्षनिषेव्यश्च सरोजदललोचनः । सुमतिः कुमतिः स्तुत्यः
    सुरनायकनायकः ॥ ९४॥ सुधाप्रियः सुधेशश्च सुधामूर्तिः सुधाकरः । हीरको हीरवांश्चैव हेतुः हाटकमण्डनः ॥
    ९५॥ हाटकेशो हठधरो हरिद्रत्नविभूषणः । हितकृद्धेतुभूतश्च हास्यदो हास्यवक्त्रकः ॥ ९६॥ हारो हारप्रियो
    हारी हविष्मल्लोचनो हरिः । हविष्मान्हविभुग्वाद्यो हव्यं हविर्भुजां वरः ॥ ९७॥ हंसः परमहंसश्च हंसीनाथो
    हलायुधः । हरिदश्वो हरिस्तुत्यो हेरम्बो लम्बितोदरः ॥ ९८॥ क्षमापतिः क्षमः क्षान्तः क्षुराधारोऽक्षिभीमकः
    । क्षितिनाथः क्षणेष्टश्च क्षणवायुः क्षवः क्षतः ॥ ९९॥ क्षीणश्च क्षणिकः क्षामः क्षवर्णामृतपीठकः । अकारादि
    क्षकारान्ता विद्यामालाविभूषणः ॥ १००॥ स्वर व्यञ्जन भूषाढ्यो ह्रस्व दीर्घ विभूषणः । ॐ क्ष्मृं महाभैरवेशी
    ॐ श्रीं भैरवपूर्वकः ॥ १०१॥ ॐ ह्रीं वटुकभावेशो ॐ ह्रीं वटुकभैरवः । ॐ क्लीं श्मशानवासी च ॐ ह्रीं श्मशानभैरवः
    ॥ १०२॥ मैं भद्रकालिकानाथः क्लीं ॐ ह्रीं कालिकापतिः । ऐं सौः क्लीं त्रिपुरेशानो ॐ ह्रीं ज्वालामुखीपतिः
    ॥ १०३॥ ऐं क्लीं सः शारदानाथो ॐ ह्रीं मार्तण्डभैरवः । ॐ ह्रीं सुमन्तुसेव्यश्च ॐ श्रीं ह्रीं मत्तभैरवः
    ॥ १०४॥ ॐ श्रीं उन्मत्तचित्तश्च ॐ श्रीं उं उग्रभैरवः । ॐ श्रीं कठोरदेशश्च ॐ श्रीं ह्रीं कठोरभैरवः ॥
    १०५॥ ॐ श्रीं कामान्धकध्वंसी ॐ श्रीं कामान्धभैरवः । ॐ श्रीं अष्टस्वरश्चैव ॐ श्रीं अष्टकभैरवः ॥ १०६॥
    ॐ श्रीं ह्रीं अष्टमूर्तिश्च ॐ श्रीं चिन्मूर्तिभैरवः । ॐ ह्रीं हाटकवर्णश्च ॐ ह्रीं हाटकभैरवः ॥ १०७॥
    ॐ श्रीं शशाङ्क वदनः ॐ श्रीं शीतलभैरवः । ॐ श्रीं शिवारुतश्चैव ॐ श्रीं शारूकभैरवः ॥ १०८॥ ॐ श्रीं अहंस्वरूपश्च
    ॐ ह्रीं श्रीमुण्डभैरवः । ॐ श्रीं मनोन्मनश्चैव ॐ श्रीं मङ्गलभैरवः ॥ १०९॥ ॐ श्रीं बुद्धिमयश्चैव ॐ श्रीं
    भैम्बुद्धभैरवः । ॐ श्रीं ऐं क्लीं नागमूर्तिः ॐ श्रीं ह्रीं नागभैरवः ॥ ११०॥ ॐ श्रीं क्लीं कूर्ममूर्तिश्च
    ॐ श्रीं कृकरभैरवः । ॐ ह्रीं श्रीं देवदत्तश्च ॐ श्रीं क्लीं दत्तभैरवः ॥ १११॥ ॐ ह्रीं धनञ्जयश्चैव ॐ
    श्रीं धनिकभैरवः । ॐ श्रीं ह्रीं रसरूपश्च ॐ श्रीं रसिकभैरवः ॥ ११२॥ ॐ श्रीं स्पर्शरूपश्च ॐ श्रीं ह्रीं
    स्पर्शभैरवः । ॐ श्रीं ह्रीं क्लीं स्वरूपश्च ॐ श्रीं ह्रीं रूपभैरवः ॥ ११३॥ ॐ श्रीं सत्त्वमयश्चैव ॐ
    श्रीं ह्रीं सत्त्वभैरवः । ॐ श्रीं रजोगुणात्मा च ॐ श्रीं राजसभैरवः ॥ ११४॥ ॐ श्रीं तमोमयश्चैव ॐ श्रीं
    तामसभैरवः । ॐ श्रीं धर्ममयश्चैव ॐ हीं वै धर्मभैरवः ॥ ११५॥ ॐ श्रीं ह्रीं मध्यचैतन्यो ॐ श्रीं चैतन्यभैरवः
    । ॐ श्रीं ह्रीं क्षितिमूर्तिश्च ॐ ह्रीं क्षात्रिकभैरवः ॥ ११६॥ ॐ श्रीं ह्रीं जलमूर्तिश्च ॐ ह्रीं जलेन्द्रभैरवः
    । ॐ श्रीं पवनमूर्तिश्च ॐ ह्रीं पीठकभैरवः ॥ ११७॥ ॐ श्रीं हुताशमूर्तिश्च ॐ ह्रीं हालाखभैरवः । ॐ श्रीं
    ह्रीं सोममूर्तिश्च ॐ श्रीं ह्रीं सौम्यभैरवः ॥ ११८॥ ॐ श्रीं ह्रीं सूर्यमूर्तिश्च ॐ श्रीं सौरेन्द्रभैरवः
    । ॐ जूं सः हंसरूपश्च हं सः जुं ॐ मृत्यञ्जयः । ॐ चत्वारिंशदधिको ॐ श्रीं अघोरभैरवः ॥ ११९॥ अघोरेभ्योऽथ
    घोरेभ्यो घोरघोरतरेभ्यः । सर्वतः सर्वसर्वेभ्यो नमस्ते रुद्ररूपेभ्यः ॥ १२०॥ भैरवेशोऽभयवरदाता देवजनप्रियः
    । ॐ श्रीं ह्रीं क्लीं क्ष्म्युं देवी वै अघोरदर्शनः ॥ १२१॥ ॐ श्रीं सौन्दर्यवान्देवो ॐ अघोरकृपानिधिः
    । सहस्रनाम इति नाम्नां सहस्रं तु अघोरस्य जगत्प्रभुः ॥ १२२॥ तव भक्त्या मयाख्यातं त्रिषु लोकेषु दुर्लभम्
    । अप्रकाश्यमदातव्यं गोप्तव्यं शरजन्मनः ॥ १२३॥ बल्यं बलप्रदं स्तुत्यं स्तवनीयं स्तवोत्तमम् । पठेद्वा
    पाठयेन्नित्यं ध्यायेच्चेतसि नित्यशः ॥ १२४॥ अद्रष्टव्यमदीक्षाय गोप्तव्यं पशुसङ्कटे । नातः परतरं किञ्चित्सर्वस्वं
    नास्ति मे हृदि ॥ १२५॥ पुण्यदं पुण्यमात्मीयं सकलं निष्कलं परम् । पठेन्मन्त्री निशीथे तु नग्नः श्रीमुक्तकुन्तलः
    ॥ १२६॥ अनन्तं चित्सुधाकारं देवानामपि दुर्लभम् । शक्त्या युक्तो जपेन्नाम्नां सहस्रं भक्तिपूर्वकम् ॥
    १२७॥ तत्क्षणात्साधकः सत्यं जीवन्मुक्तो भविष्यति । भौमेऽर्क शनिवारे तु श्मशाने साधकः पठेत् ॥ १२८॥ सद्यस्तस्य
    स्वयं देवो वरदस्तु भविष्यति । दशावर्त्तं पठेद्रात्रौ नदीतीरेषु धैर्यवान् ॥ १२९॥ तस्य हस्ते सदा सन्ति
    त्र्यम्बकस्याष्टसिद्धयः । मध्याहे शिवरात्रौ च निशीथे विविधे पठेत् ॥ १३०॥ इन्द्रादयः सुरगणा वशमेष्यन्ति
    नान्यथा । गुरौ ब्राह्ममुहूर्ते तु पठेद्भक्त्या च साधकः ॥ १३१॥ यावदिन्द्रः सभामध्ये तदग्रे मूकवत् भवेत्
    । शुक्रे नद्या जले मन्त्री पठेन्नाम्नां सहस्रकम् ॥ १३२॥ तदाप्रभृति त्रैलोक्यं मोहमेष्यति नान्यथा ।
    भौमे वनान्तरे मन्त्री पठेत्सन्ध्यानिधौ तदा ॥ १३३॥ शत्रुः कालसमानोऽपि मृत्युमेष्यति नान्यथा । त्रिसन्ध्योदयकाले
    तु पठेत्साधकसत्तमः ॥ १३४॥ रम्भाद्यप्सरसः सर्वा वशमायान्ति तत्क्षणात् । भौमे मध्याह्नसमये पठेच्च कूपसन्निधौ
    ॥ १३५॥ सद्यो देवि महान्तं कारिपुमुच्चाटयेद्ध्रुवम् । सद्यस्त्रिवारं पठेन्नाम्नां सहस्रमुत्तमम् ॥ १३६॥
    इहलोके भवेद्भोगी परे मुक्तिर्भविष्यति । अर्कवारे समालिख्य भूर्जत्वचि च साधकः ॥ १३७॥ कुङ्कुमालक्तकस्तूरी
    गोरोचन मनःशिलाः । सर्वाद्यैर्वसुभिर्मन्त्री वेष्टयेत्ताम्ररज्जुना ॥ १३८॥ धारयेन्मूर्ध्नि सद्यस्तु
    लभेत्कामान्यथेप्सितान् । पुत्रान्दारांश्च लक्ष्मीं च यशो धर्मं धनानि च ॥ १३९॥ लभते नात्र संशयः सत्यमेतद्वचो
    मम । विनानेन महादेवि पठेद्यः कवचं शुभम् ॥ १४०॥ तस्य जीवं धनं पुत्रान् दारान्भक्षन्ति राक्षसाः । विनानेन
    जपेत् विद्यामघोरस्य च साधकः ॥ १४१॥ तस्य कोटि जपं व्यर्थं सत्यमेतद्वचो मम । बहुनात्र किमुक्तेन सहस्राख्यं
    स्तवोत्तमम् ॥ १४२॥ यद्गृहे वा जपेद्यस्तु श्रावयेद्वा श
