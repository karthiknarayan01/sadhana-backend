id: saraswati-suktam-rigveda
category: stotram
name:
  english: Saraswati Suktam (Rigveda)
content:
  english: iyamadadadrabhasamrinacyuta va~dhryashvaya dashushe datrani tavisha sarasvati || bhirbisakha
    ivarujatsanu girina ntavishebhirurmibhih | paravataghnimavase suvriktibhissarasvati ma vivasema dhitibhih
    || || sarasvati devanido ni bar vi~shvasya brisayasya mayinah | uta kshitibhyo bhyo asravo vajinivati
    || devi sarasvati vaje vati | dhinamavitryavatu || devi sarasvatyupabrute dhane vi sarasvatyava vaje
    ssarasvati ghora hira nyavartanih | vritraghni vashti sushtutim || ananto ahrutastveshashcarishnura
    rnavah | amashcarati roruvat || || sa no vishva ati dvisha ranya ritavari | atannahe || uta nah priya
    priyasu saptasvasa sujushta | sarasvati stomya || apaprushi parthivanyuru rajo antariksham | sarasvati
    nidaspa tuh panca jata vardhaya || pra ya mahimna mahina su cekite dyumnebhiranya apasa mapastama
    | ratha iva brihati vibhvane cikitusha sarasvati || neshi vasyo mapa spharih payasa ma na a dhak |
    jushasva na tkshetranyaranani ganma || pra kshodasa dhayasa sasra esha sarasvati dharunamayasi puh
    | prababadhana rathye apo mahina sindhuranyah || cetatsarasvati nadinam shuci ryati giribhya a samudrat
    | rayashceta nti bhuvanasya bhure vridhe naryo yoshanasu vrisha shishu mmaghavadbhyo dadhati vi sataye
    ssarasvati jushanopa shravatsubhaga yajne asminn | mitajnubhirnamasyai riyana raya yuja ciduttara
    sakhibhyah || sarasvati jushasva | tava sharma na upa stheyama sharana || ayamu te sarasvati vasishtho
    dvara vritasya subhage vya vah | vardha shubhre stuvate ra m | sarasvatiminmahaya suvriktibhisstomai
    mahina shubhre andhasi adhikshiyanti puravah | sa no bodhyavitri marutsakha coda radho || bhadramidbhadra
    krinavatsarasvatyakavari cetati vajini vati | grinana jamadagnivatstuvana ca vasishthavat || || janiyanto
    nvagravah putriyantah sudanavah | sarasvantam havamahe || sarasva urmayo madhumanto ghritashcutah
    | tebhi || pipivamsam sarasvata shatah | bhakshimahi prajamisham tame devitame sarasvati | aprashasta
    iva smasi prashastimamba naskridhi || shi devyam | shunaho treshu matsva praja || ima brahma sarasvati
    jushasva vajinivati | ya te manma gritsamada ritavari priya deveshu juhvati || va~shtu dhiyavasuh
    || || codayitri sunrita nti sumatinam | yajna | dhiyo vishva vi ra havante sarasvatimadhvare tayama
    ne | sarasvatim sukrito ahvayanta sarasvati dashushe varya || sarasvati ya saratham ya~yatha svadhabhirdevi
    pitribhirmada nti | asadyasminbar hishi madayasvanamiva isha a dhe nte dakshina yajnamabhinakshamanah
    | sahasrarghamilo atra bhagam rayasposham divo brihatah parvatada sarasvati yajata ga ndevi jujushana
    ghritaci nno vacamushati shrinotu || sushtuti huve shrinotu na ssubhaga bodhatu tmana | sivyatvapah
    sucyacchidyamanaya dada rake sumatayah supeshaso yabhirdada upagahi sahasraposham subhage rara vali
    prithushtuke ya devanamasi svasa | jushasva havyamahuta ssinivalyai juhotana || || ya gungurya sinivali
    ya raka ya sarasvati | indranimahva utaye
  devanagari: इ॒यम्॑अददाद्रभ॒समृ॑ण॒च्युत॒ वँध्र्य॒श्वाय॑ दा॒शुषे दा॒त्राणि॑ तवि॒षा स॑रस्वति ॥ भिर्बिस॒खा
    इ॑वारुज॒त्सानु॑ गिरी॒णा न्त॑वि॒षेभि॑रू॒र्मिभिः॑ । पा॒रा॒व॒त॒घ्नीमव॑से सुवृ॒क्तिभि॑स्सर॑स्वती॒ मा वि॑वासेम
    धी॒तिभिः॑ ॥ ॥ सर॑स्वति देव॒निदो॒ नि ब॑र् विँश्व॑स्य॒ बृस॑यस्य मा॒यिनः॑ । उ॒त क्षि॒तिभ्यो॒ भ्यो अस्रवो
    वाजिनीवति ॥ दे॒वी सर॑स्वती॒ वाजे वती । धी॒नाम॑वि॒त्र्य॑वतु ॥ देवि सरस्वत्युपब्रू॒ते धने वि सरस्व॒त्यवा॒
    वाजे स्सर॑स्वती घो॒रा हिर ण्यवर्तनिः । वृ॒त्र॒घ्नी व॑ष्टि सुष्टु॒तिम् ॥ अन॒न्तो अह्रु॑तस्त्वे॒षश्च॑रि॒ष्णुर
    र्ण॒वः । अम॒श्चर॑ति॒ रोरु॑वत् ॥ ॥ सा नो॒ विश्वा॒ अति॒ द्विष॒ र॒न्या ऋ॒ताव॑री । अत॒न्नहे ॥ उ॒त नः॑
    प्रि॒या प्रि॒यासु॑ स॒प्तस्व॑सा॒ सुजु॑ष्टा । सर॑स्वती॒ स्तोम्या ॥ आ॒प॒प्रुषी॒ पार्थि॑वान्यु॒रु रजो
    अ॒न्तरि॑क्षम् । सर॑स्वती नि॒दस्पा तुः॒ पञ्च॑ जा॒ता व॒र्धय ॥ प्र या म॑हि॒म्ना म॒हिना सु॒ चेकि॑ते द्यु॒म्नेभि॑र॒न्या
    अ॒पसा म॒पस्त॑मा । रथ॑ इव बृह॒ती वि॒भ्वने चिकि॒तुषा॒ सर॑स्वती ॥ नेषि॒ वस्यो॒ माप॑ स्फरीः॒ पय॑सा॒ मा
    न॒ आ ध॑क् । जु॒षस्व॑ न त्क्षेत्रा॒ण्यर॑णानि गन्म ॥ प्र क्षोद॑सा॒ धाय॑सा सस्र ए॒षा सर॑स्वती ध॒रुण॒माय॑सी॒
    पूः । प्र॒बाब॑धाना र॒थ्ये अ॒पो म॑हि॒ना सिन्धु॑र॒न्याः ॥ चेत॒त्सर॑स्वती न॒दीनां॒ शुचि र्य॒ती गि॒रिभ्य॒
    आ स॑मु॒द्रात् । रा॒यश्चेत न्ती॒ भुव॑नस्य॒ भूरे वृधे॒ नर्यो॒ योष॑णासु॒ वृषा॒ शिशु म्म॒घव॑द्भ्यो दधाति॒
    वि सा॒तये स्सर॑स्वती जुषा॒णोप॑ श्रवत्सु॒भगा य॒ज्ञे अ॒स्मिन्न् । मि॒तज्ञु॑भिर्नम॒स्यै रिया॒ना रा॒या
    यु॒जा चि॒दुत्त॑रा॒ सखि॑भ्यः ॥ सरस्वति जुषस्व । तव॒ शर्म ना॒ उप॑ स्थेयाम शर॒ण ॥ अ॒यमु॑ ते सरस्वति॒
    वसि॑ष्ठो॒ द्वारा वृ॒तस्य॑ सुभगे॒ व्या वः । वर्ध॑ शुभ्रे स्तुव॒ते रा म् । सर॑स्वती॒मिन्म॑हया सुवृ॒क्तिभि॒स्स्तोमै
    महि॒ना शु॑भ्रे॒ अन्ध॑सी अधिक्षि॒यन्ति॑ पू॒रवः॑ । सा नो बोध्यवि॒त्री म॒रुत्स॑खा॒ चोद॒ राधो ॥ भ॒द्रमिद्भ॒द्रा
    कृ॑णव॒त्सर॑स्व॒त्यक॑वारी चेतति वा॒जिनी वती । गृ॒णा॒ना ज॑मदग्नि॒वत्स्तु॑वा॒ना च॑ वसिष्ठ॒वत् ॥ ॥ ज॒नी॒यन्तो॒
    न्वग्र॑वः पुत्री॒यन्तः॑ सु॒दान॑वः । सर॑स्वन्तं हवामहे ॥ सरस्व ऊ॒र्मयो॒ मधु॑मन्तो घृत॒श्चुतः॑ । तेभि
    ॥ पी॒पि॒वांसं॒ सर॑स्वत॒ शतः । भ॒क्षी॒महि॑ प्र॒जामिषम् तमे॒ देवि॑तमे॒ सर॑स्वति । अ॒प्र॒श॒स्ता इ॑व स्मसि॒
    प्रश॑स्तिमम्ब नस्कृधि ॥ षि दे॒व्याम् । शु॒नहो त्रेषु मत्स्व प्र॒जा ॥ इ॒मा ब्रह्म॑ सरस्वति जु॒षस्व॑
    वाजिनीवति । या ते॒ मन्म॑ गृत्सम॒दा ऋ॑तावरि प्रि॒या दे॒वेषु॒ जुह्व॑ति ॥ वँ॑ष्टु धि॒याव॑सुः ॥ ॥ चो॒द॒यि॒त्री
    सू॒नृता न्ती सुमती॒नाम् । य॒ज्ञ । धियो॒ विश्वा॒ वि रा हवन्ते॒ सर॑स्वतीमध्व॒रे ता॒यमा ने । सर॑स्वतीं
    सु॒कृतो अह्वयन्त॒ सर॑स्वती दा॒शुषे॒ वार्य ॥ सर॑स्वति॒ या स॒रथं यँ॒याथ॑ स्व॒धाभि॑र्देवि पि॒तृभि॒र्मद
    न्ती । आ॒सद्या॒स्मिन्ब॒र् हिषि॑ मादयस्वानमी॒वा इष॒ आ धे न्ते दक्षि॒णा य॒ज्ञम॑भि॒नक्ष॑माणाः । स॒ह॒स्रा॒र्घमि॒लो
    अत्र॑ भा॒गं रा॒यस्पोषं॒ दि॒वो बृ॑ह॒तः पर्व॑ता॒दा सर॑स्वती यज॒ता ग न्दे॒वी जु॑जुषा॒णा घृ॒ताची न्नो॒
    वाच॑मुश॒ती शृ॑णोतु ॥ सुष्टु॒ती हु॑वे शृ॒णोतु॑ न स्सु॒भगा॒ बोध॑तु॒ त्मना । सीव्य॒त्वपः॑ सू॒च्याच्छि॑द्यमानया॒
    ददा राके सुम॒तयः॑ सु॒पेश॑सो॒ याभि॒र्ददा उ॒पाग॑हि सहस्रपो॒षं सु॑भगे॒ ररा वालि॒ पृथु॑ष्टुके॒ या दे॒वाना॒मसि॒
    स्वसा । जु॒षस्व॑ ह॒व्यमाहु॑त स्सि॑नीवा॒ल्यै जु॑होतन ॥ ॥ या गु॒ङ्गूर्या सि॑नीवा॒ली या रा॒का या सर॑स्वती
    । इ॒न्द्रा॒णीम॑ह्व ऊ॒तये
