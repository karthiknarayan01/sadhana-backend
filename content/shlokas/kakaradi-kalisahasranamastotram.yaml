id: kakaradi-kalisahasranamastotram
category: sahasranama
name:
  english: kakaradi kalisahasranamastotram
  devanagari: ककारादि कालीसहस्रनामस्तोत्रम्
content:
  english: siddhaudhaih sevitam surasundarim || 49|| labheddeveshi masena tasya casana samhatih | hastatrayam
    bhavedurdhvam natra karya vicarana || 50|| helaya lilaya bhaktya kalim stauti narastu yah | brahmadimssatambhayeddevi
    maheshim mohayetkshanat || 51|| akarshayenmahavidyam dashapurvan triyamatah | kurvita vishnunirmmanam
    yamadinam tu maranam || 52|| dhruvamuccatayennunam srishtinutanatam narah | meshamahishamarjarakharacchaganaradikaih
    || 53|| khadgishukarakapotaishtittibhaih shashakaih palaih | shonitaih sasthimamsaishca karandairdugdhapayasaih
    || 54|| kadambarisindhumadyaih surarishtaishca sasavaih | yonikshalitatoyaishca yonilingamritairapi
    || 55|| svajatakusumaih pujya japante tarpayecchivam | sarvasamrajyanamna tu stutva natva svashaktitah
    || 56|| shaktya labhan pathet stotram kalirupo dinatrayat | dakshinakalika tasya gehe tishthati nanyatha
    || 57|| veshyalatagrihe gatva tasyashcumbanatatparah | tasya yonau mukham datva tadrasam vilihanjapet
    || 58|| tadante nama sahasram pathedbhaktiparayanah | kalikadarshanam tasya bhaveddevi triyamatah
    || 59|| nrityapatragrihe gatva makarapancakanvitah | prasunamance samsthapya shaktinyasaparayanah
    || 60|| patranam sadhanam kritva digvastram tam samacaret | sambhavya cakram tanmule tatra savaranam
    japet || 61|| shatam bhale shatam keshe shatam sinduramandale | shatatrayam kucadvandve shatam nabhau
    maheshvari || 62|| shatam yonau maheshani samyoge ca shatatrayam | japettatra maheshani tadante prapathetstavam
    || 63|| shatavadhano bhavati masamatrena sadhakah | matanginim samaniya kim va kapalinim shive ||
    64|| dantamala jape karya gale dharya nrimundaja | netrapadme yonicakram shakticakram svavaktrake
    || 65|| kritva japenmaheshani mundayantram prapujayet | mundasanasthito viro makarapancakanvitah ||
    66|| anyamalingaya prajapedanyam sancumbya vai pathet | anyam sampujayettatra tvanyam sammarddayan
    japet || 67|| anyayonau shivam datva punah purvavadacaret | avadhanasahasreshu shaktipatashateshu
    ca || 68|| raja bhavati deveshi masapancakayogatah | yavanishaktimaniya ganashaktiparayanam || 69||
    kulacaramatenaiva tasya yonim vikasayet | tatra pradaya jihvam tu japennamasahasrakam || 70|| nrikapale
    tatra dipam japetprajvalya yatnatah | mahakavivaro bhuyannatra karya vicarana || 71|| kamartam shaktimaniya
    yonau tu mulacakrakam | vilikhya parameshani tatra mantram likhecchive || 72|| tallihan prajapeddevi
    sarvashastrarthatatvavit | ashrutani ca shastrani vedadin pathayed dhruvam || 73|| vina nyasairvina
    pathairvinadhyanadibhih priye | caturvedadhipo bhutva trikalajnastrivarshatah || 74|| caturvidham
    ca pandityam tasya hastagatam kshanat | shivabalih pradatavyah sarvada shunyamandale || 75|| kalidhyanam
    mantrarcita nilasadhanameva ca | sahasranamapathashca kalinamaprakirtanam || 76|| bhaktasya karyametavadanyadabhyudayam
    viduh | virasadhanakam karma shivapuja balistatha || 77|| sinduratilako devi veshyalapo nirantaram
    | veshyagrihe nishacaro ratrau paryatanam tatha || 78|| shaktipuja yonidrishtih khadgahasto digambarah
    | muktakesho viraveshah kulamurtidharo narah || 79|| kalibhakto bhaveddevi nanyatha kshemamapnuyat
    | dugdhasvadi yonilehi samvidasavaghurnitah || 80|| veshyalatasamayoganmasatkalpalata svayam | veshyacakrasamayogatkalicakrasamah
    svayam || 81|| veshyadehasamayogat kalidehasamah svayam | veshyamadhyagatam viram kada pashyami sadhakam
    || 82|| evam vadati sa kali tasmadveshya vara mata | veshya kanya tatha pithajatibhedakulakramat ||
    83|| akulakramabhedena jnatva capi kumarikam | kumarim pujayedbhaktya japante bhavane priye || 84||
    pathennamasahasram yah kalidarshanabhag bhavet | bhaktya kumarim sampujya vaishyakula samudbhavam
    || 85|| vastra hemadibhistoshya yatnatstotram pathecchive | trailokya vijayi bhuyaddiva candraprakashakah
    || 86|| yadyaddattam kumaryai tu tadanantaphalam bhavet | kumaripujanaphalam maya vaktum na shakyate
    || 87|| cancalyadduritam kincitkshamyatamayamanjalih | eka cetpujita bala dvitiya pujita bhavet ||
    88|| kumaryah shaktayashcaiva sarvametacaracaram | shaktimaniya tadgatre nyasajalam pravinyaset ||
    89|| vamabhage ca samsthapya japennamasahasrakam | sarvasiddhishvaro bhuyannatra karyya vicarana ||
    90|| shmashanastho bhavetsvastho galitam cikuram caret | digambarah sahasram ca suryapushpam samanayet
    || 91|| svaviryena plutam kritva pratyekam prajapan hunet | pujya dhyatva mahabhaktya kshamapalo narah
    pathet || 92|| nakham kesham svaviryam ca yadyatsammarjanigatam | muktakesho dishavaso mulamantrapurahsarah
    || 93|| kujavare madhyaratre homam kritva shmashanake | pathennamasahasram yah prithvishakarshako
    bhavet || 94|| pushpayukte bhage devi samyoganandatatparah | punashcikuramasadya mulamantram japan
    shive || 95|| citavahnau madhyaratre viryamutsarya yatnatah | kalikam pujayettatra pathennama sahasrakam
    || 96|| prithvishakarshanam kuryannatra karya vicarana | kadali vanamasadya lakshamantram japennarah
    || 97|| madhumatya svayam devya sevyamanah smaropamah | shrimadhumatityuktva tatha sthavarajangaman
    || 98|| akarshinim samuccarya thamtham svaha samuccaret | trailokyakarshini vidya tasya haste sada
    bhavet || 99|| nadim purim ca ratnani hemastrishailabhuruhan | akarshayatyambunidhim sumerum ca digantatah
    || 100|| alabhyani ca vastuni duradbhumitaladapi | vrittantam ca surasthanadrahasye vidushamapi ||
    101|| rajnam ca kathayatyesha satyam satvaramadishet | dvitiyavarshapathena bhavetpadmavati shubha
    || 102|| om hrimpadmavati padam tatastrailokyanama ca | vartam ca kathaya dvandvam svahanto mantra
    iritah || 103|| brahmavishnvadikanam ca trailokye yadrishi bhavet | sarva vadati deveshi trikalajnah
    kavishshubhah || 104|| trivarsham sampathandevi labhedbhogavatim kalam | mahakalena drishto'pi citamadhyagato'pi
    va || 105|| tasya darshanamatrena ciranjivi naro bhavet | mritasanjivinityuktva mritamutthapaya dvayam
    || 106|| svahanto manurakhyato mritasanjivanatmakah | caturvarsham pathedyastu svapnasiddhistato bhavet
    || 107|| om hrim svapnavarahi kalisvapne kathayoccaret | amukasya'mukam dehi klim svahanto manurmatah
    || 108|| svapnasiddha caturvarshattasya svapne sada sthita | caturvarshasya pathena caturvedadhipo
    bhavet || 109|| taddhastajalasamyoganmurkhah kavyam karoti ca | tasya vakyaparicayanmurtirvindati
    kavyatam || 110|| mastake tu karam kritva vada vanimiti bruvan | sadhako vanchaya kuryattattathaiva
    bhavishyati || 111|| brahmandagolake yashca yah kashcijjagatitale | samastah siddhayo devi karamalakavatsada
    || 112|| sadhakasmritimatrena yavantyah santi siddhayah | svayamayanti purato japadinam tu ka katha
    || 113|| videshavartino bhutva vartante cetaka iva | amayam candrasandarshashcandragrahanameva ca
    || 114|| ashtamyam purnacandratvam candrasuryashtakam tatha | ashtadikshu tathashtau ca karotyeva
    maheshvari || 115|| anima khecaratvam ca caracarapurigatam | padukakhadgavetalayakshiniguhyakadayah
    || 116|| tilakoguptatadrishyam caracarakathanakam | mritasanjivinisiddhirgutika ca rasayanam || 117||
    uddinasiddhirdeveshi shashtisiddhishvaratvakam | tasya haste vaseddevi natra karya vicarana || 118||
    ketau va dundubhau vastre vitane veshtanegrihe | bhittau ca phalake devi lekhyam pujyam ca yatnatah
    || 119|| madhye cakram dashangoktam parito namalekhanam | taddharananmaheshani trailokyavijayi bhavet
    || 120|| eko hi shatasahasram nirjitya ca ranangane | punarayati ca sukham svagriham prati parvati
    || 121|| eko hi shatasandarshi lokanam bhavati dhruvam | kalasham sthapya yatnena namasahasrakam pathet
    || 122|| sekah karyo maheshani sarvapattinivarane | bhutapretagrahadinam rakshasam brahmarakshasam
    || 123|| vetalanam bhairavanam skandavainayakadikan | nashayet kshanamatrena natra karya vicarana
    || 124|| bhasmabhirmantritam kritva grahagrastam vilepayet | bhasmasamkshepanadeva sarvagrahavinashanam
    || 125|| navanitam cabhimantrya stribhyo dadyanmaheshvari | vandhya putrapradam devi natra karya vicarana
    || 126|| kanthe va vamabahau va yonau va dharanacchive | bahuputravati nari subhaga jayate dhruvam
    || 127|| purusho dakshinange tu dharayetsarvasiddhaye | balavankirtimana dhanyodharmikah sadhakah
    kriti || 128|| bahuputri rathanam ca gajanamadhipah sudhih | kaminikarshanodyuktah krim ca dakshinakalike
    || 129|| krim svaha prajapenmantramayutam namapathakah | akarshanam careddevi jalakhecarabhugatan
    || 130|| vashikaranakamo hi hu~ hu~ hrim hrim ca dakshine | kalike purvabijani purvavatprajapan pathet
    || 131|| urvashimapi vasayennatra karya vicarana | krim ca dakshinakalike svaha yuktam japennarah
    || 132|| pathennamasahasram tu trailokyam marayeddhruvam | sadbhaktaya pradatavya vidya rajni shubhe
    dine || 133|| sadvinitaya shantaya dantayatigunaya ca | bhaktaya jyeshthaputraya gurubhaktiparaya
    ca || 134|| vaishnavaya prashuddhaya shivabalirataya ca | veshyapujanayuktaya kumaripujakaya ca ||
    135|| durgabhaktaya raudraya mahakalaprajapine | advaitabhavayuktaya kalibhaktiparaya ca || 136||
    deyam sahasranamakhyam svayam kalya prakashitam | gurudaivatamantranam maheshasyapi parvati || 137||
    abhedena smarenmantram sa shivah sa ganadhipah | yo mantram bhavayenmantri sa shivo natra samshayah
    || 138|| sa shakto vaishnavassaurah sa evam purnadikshitah | ayogyaya na datavyam siddhirodhah prajayate
    || 139|| veshyastrinindakayatha surasamvitpranindake | suramukho manum smritva suracaryo bhavishyati
    || 140|| vagdevata ghore asaparaghare ca hu~ vadet | ghorarupe mahaghore mukhibhimapadam vadet ||
    141|| bhishanyamushyashashthyantam heturvamayuge shive | shivavahniyugastram hu~ hu~ kavacamanurbhavet
    || 142|| etasya smaranadeva dushtanam ca mukhe sura | avatirna bhavaddevi dushtanam bhadranashini
    || 143|| khalaya paratantraya paranindaparaya ca | bhrashtaya dushtasatvaya paravadarataya ca || 144||
    shivabhaktaya dushtaya paradararataya ca | na stotram darshayeddevi shivahatyakaro bhavet || 145||
    kalikanandahridayah kalikabhaktimanasah | kalibhakto bhavetso'yam dhanyarupah sa eva tu || 146|| kalau
    kali kalau kali kalau kali varaprada | kalau kali kalau kali kalau kali tu kevala || 147|| bilvapatrasahasrani
    karavirani vai tatha | pratinamna pujayeddhi tena kali varaprada || 148|| kamalanam sahasram tu pratinamna
    samarpayet | cakram sampujya deveshi kalikavaramapnuyat || 149|| mantrakshobhayuto naiva kalashasthajalena
    ca | namna prasecayeddevi sarvakshobhavinashakrit || 150|| tatha damanakam devi sahasramaharedvrati
    | sahasranamna sampujya kalivaramavapnuyat || 151|| cakram vilikhya dehastham dharayetkalikatanuh
    | kalyai niveditam yadyattadamsham bhakshayecchive || 152|| divyadehadharo bhutva kalidehe sthito
    bhavet | naivedyanindakan dushtan drishtva nrityanti bhairava || 153|| yoginyashca mahavira raktapanodyatah
    priye | mamsasthicarmanodyukta bhakshayanti na samshayah || 154|| tasmanna nindayeddevi manasa karmana
    gira | anyatha kurute yastu tasya nasho bhavishyati || 155|| kramadikshayutanam ca siddhirbhavati
    nanyatha | mantrakshobhashca va bhuyat kshinayurva bhaveddhruvam || 156|| putrahari striyohari rajyahari
    bhaveddhruvam | kramadikshayuto devi kramadrajyamavapnuyat || 157|| ekavaram patheddevi sarvapapavinashanam
    | dvivaram ca pathedyo hi vancham vindati nityashah || 158|| trivaram ca pathedyastu vagishasamatam
    vrajet | caturvaram patheddevi caturvarnadhipo bhavet || 159|| pancavaram patheddevi pancakamadhipo
    bhavet | shadvaram ca patheddevi shadaishvaryadhipo bhavet || 160|| saptavaram pathetsaptakamanam
    cintitam labhet | vasuvaram patheddevi digisho bhavati dhruvam || 161|| navavaram patheddevi navanathasamo
    bhavet | dashavaram kirttayedyo dasharhah khecareshvarah || 162|| vimshativaram kirtayedyah sarvaishvaryamayo
    bhavet | pancavimshativaraistu sarvacintavinashakah || 163|| pancashadvaramavartya pancabhuteshvaro
    bhavet | shatavaram kirttayedyah shatananasamanadhih || 164|| shatapancakamavartya rajarajeshvaro
    bhavet | sahasravartanaddevi lakshmiravrinute svayam || 165|| trisahasram samavartya trinetrasadrisho
    bhavet | panca sahasramavartya kamakoti vimohanah || 166|| dashasahasramavartya bhaveddashamukheshvarah
    | pancavimshatisahasrai ca caturvimshatisiddhidhrik || 167|| lakshavartanamatrena lakshmipatisamo
    bhavet | lakshatrayavarttanattu mahadevam vijeshyati || 168|| lakshapancakamavartya kalapancakasamyutah
    | dashalakshavarttanattu dashavidyaptiruttama || 169|| pancavimshatilakshaistu dashavidyeshvaro bhavet
    | pancashallakshamavritya mahakalasamo bhavet || 170|| kotimavarttayedyastu kalim pashyati cakshusha
    | varadanodyuktakaram mahakalasamanvitam || 171|| pratyaksham pashyati shive tasya deho bhaveddhruvam
    | shrividyakalikataratrishaktivijayi bhavet || 172|| vidherlipim ca sammarjya kinkaratvam visrijya
    ca | maharajyamavapnoti natra karya vicarana || 173|| trishaktivishaye devikramadiksha prakirtita
    | kramadikshayuto devi raja bhavati nishcitam || 174|| kramadikshavihinasya phalam purvamiheritam
    | kramadikshayuto devi shiva eva na caparah || 175|| kramadikshasamayuktah kalyuktasiddhibhagbhavet
    | kramadikshavihinasya siddhihanih pade pade || 176|| aho janmavatam madhye dhanyah kramayutah kalau
    | tatrapi dhanyo deveshi namasahasrapathakah || 177|| dashakalividyau devi stotrametatsada pathet
    | siddhim vindati deveshi natra karya vicarana || 178|| kaki kali mahavidya kalau kali ca siddhida
    | kalau kali ca siddha ca kalau kali varaprada || 179|| kalau kali sadhakasya darshanartham samudyata
    | kalau kali kevala syannatra karya vicarana || 180|| nanyavidya nanyavidya nanyavidya kalau bhavet
    | kalau kalim vihayatha yah kashcitsiddhikamukah || 181|| sa tu shaktim vina devi ratisambhogamicchati
    | kalau kalim vina devi yah kashcitsiddhimicchati || 182|| sa nilasadhanam tyaktva paribhramati sarvatah
    | kalau kali vihayatha yah kashcinmokshamicchati || 183|| gurudhyanam parityajya siddhimicchati sadhakah
    | kalau kali vihayatha yah kashcidrajyamicchati || 184|| sa bhojana parityajya bhikshuvrittimabhipsati
    | sa dhanyah sa ca vijnani sa eva surapujitah || 185|| sa dikshitah sukhi sadhuh satyavadi jitendriyah
    | sa vedavakta svadhyayi natra karya vicarana || 186|| shivarupam gurum dhyatva shivarupam gurum smaret
    | sadashivah sa eva syanatra karya vicarana || 187|| svasmin kalim tu sambhavya pujayejjagadambikam
    | trailokyavijayi bhuyannatra karyya vicarana || 188|| gopaniyam gopaniyam gopaniyam prayatnatah |
    rahasyatirahasyam ca rahasyatirahasyakam || 189|| shlokarddham padamatram va padadardham ca tadardhakam
    | namardham yah patheddevi na vandhyadivasam nyaset || 190|| pustakam pujayedbhaktya tvaritam phalasiddhaye
    | na ca maribhayam tatra na cagnirvayusambhavam || 191|| na bhutadibhayam tatra sarvatra sukhamedhate
    | kunkuma'laktakenaiva rocana'garuyogatah || 192|| bhurjapatre likhet pustam sarvakamarthasiddhaye
    | iti samkshepatah proktam kimanyacchrotumicchasi || 193|| iti gaditamashesham kalikavarnarupam |
    prapathati yadi bhaktya sarvasiddhishvarah syat || 194|| abhinavasukhakamah sarvavidyabhiramo bhavati
    sakalasiddhidhah sarvavirasamriddhih || 195|| || iti shrimadadinathamahakalaviracitayam mahakalasamhitayam
    kalakalisamvade sundarishaktidanakhyam kalisvarupa medhasamrajyapradam sahasranamastotram sampurnam
    ||
  devanagari: सिद्धौधैः सेवितां सुरसुन्दरीम् ॥ ४९॥ लभेद्देवेशि मासेन तस्य चासन संहतिः । हस्तत्रयं भवेदूर्ध्वं
    नात्र कार्या विचारणा ॥ ५०॥ हेलया लीलया भक्त्या कालीं स्तौति नरस्तु यः । ब्रह्मादींस्सतम्भयेद्देवि
    माहेशीं मोहयेत्क्षणात् ॥ ५१॥ आकर्षयेन्महाविद्यां दशपूर्वान् त्रियामतः । कुर्वीत विष्णुनिर्म्माणं यमादीनां
    तु मारणम् ॥ ५२॥ ध्रुवमुच्चाटयेन्नूनं सृष्टिनूतनतां नरः । मेषमाहिषमार्जारखरच्छागनरादिकैः ॥ ५३॥ खड्गिशूकरकापोतैष्टिट्टिभैः
    शशकैः पलैः । शोणितैः सास्थिमांसैश्च कारण्डैर्दुग्धपायसैः ॥ ५४॥ कादम्बरीसिन्धुमद्यैः सुरारिष्टैश्च
    सासवैः । योनिक्षालिततोयैश्च योनिलिङ्गामृतैरपि ॥ ५५॥ स्वजातकुसुमैः पूज्या जपान्ते तर्पयेच्छिवाम् ।
    सर्वसाम्राज्यनाम्ना तु स्तुत्वा नत्वा स्वशक्तितः ॥ ५६॥ शक्त्या लभन् पठेत् स्तोत्रं कालीरूपो दिनत्रयात्
    । दक्षिणाकालिका तस्य गेहे तिष्ठति नान्यथा ॥ ५७॥ वेश्यालतागृहे गत्वा तस्याश्चुम्बनतत्परः । तस्या योनौ
    मुखं दत्वा तद्रसं विलिहञ्जपेत् ॥ ५८॥ तदन्ते नाम साहस्रं पठेद्भक्तिपरायणः । कालिकादर्शनं तस्य भवेद्देवि
    त्रियामतः ॥ ५९॥ नृत्यपात्रगृहे गत्वा मकारपञ्चकान्वितः । प्रसूनमञ्चे संस्थाप्य शक्तिन्यासपरायणः ॥ ६०॥
    पात्राणां साधनं कृत्वा दिग्वस्त्रां तां समाचरेत् । सम्भाव्य चक्रं तन्मूले तत्र सावरणां जपेत् ॥ ६१॥
    शतं भाले शतं केशे शतं सिन्दूरमण्डले । शतत्रयं कुचद्वन्द्वे शतं नाभौ महेश्वरि ॥ ६२॥ शतं योनौ महेशानि
    संयोगे च शतत्रयम् । जपेत्तत्र महेशानि तदन्ते प्रपठेत्स्तवम् ॥ ६३॥ शतावधानो भवति मासमात्रेण साधकः ।
    मातङ्गिनीं समानीय किं वा कापालिनीं शिवे ॥ ६४॥ दन्तमाला जपे कार्या गले धार्या नृमुण्डजा । नेत्रपद्मे
    योनिचक्रं शक्तिचक्रं स्ववक्त्रके ॥ ६५॥ कृत्वा जपेन्महेशानि मुण्डयन्त्रं प्रपूजयेत् । मुण्डासनस्थितो
    वीरो मकारपञ्चकान्वितः ॥ ६६॥ अन्यामालिङ्गय प्रजपेदन्यां सञ्चुम्ब्य वै पठेत् । अन्यां सम्पूजयेत्तत्र
    त्वन्यां सम्मर्द्दयन् जपेत् ॥ ६७॥ अन्ययोनौ शिवं दत्वा पुनः पूर्ववदाचरेत् । अवधानसहस्रेषु शक्तिपातशतेषु
    च ॥ ६८॥ राजा भवति देवेशि मासपञ्चकयोगतः । यवनीशक्तिमानीय गानशक्तिपरायणम् ॥ ६९॥ कुलाचारमतेनैव तस्या
    योनिं विकासयेत् । तत्र प्रदाय जिह्वां तु जपेन्नामसहस्रकम् ॥ ७०॥ नृकपाले तत्र दीपं जपेत्प्रज्वाल्य
    यत्नतः । महाकविवरो भूयान्नात्र कार्या विचारणा ॥ ७१॥ कामार्तां शक्तिमानीय योनौ तु मूलचक्रकम् । विलिख्य
    परमेशानि तत्र मन्त्रं लिखेच्छिवे ॥ ७२॥ तल्लिहन् प्रजपेद्देवि सर्वशास्त्रार्थतत्ववित् । अश्रुतानि च
    शास्त्राणि वेदादीन् पाठयेद् ध्रुवम् ॥ ७३॥ विना न्यासैर्विना पाठैर्विनाध्यानादिभिः प्रिये । चतुर्वेदाधिपो
    भूत्वा त्रिकालज्ञस्त्रिवर्षतः ॥ ७४॥ चतुर्विधं च पाण्डित्यं तस्य हस्तगतं क्षणात् । शिवाबलिः प्रदातव्यः
    सर्वदा शून्यमण्डले ॥ ७५॥ कालीध्यानं मन्त्रर्चिता नीलसाधनमेव च । सहस्रनामपाठश्च कालीनामप्रकीर्तनम्
    ॥ ७६॥ भक्तस्य कार्यमेतावदन्यदभ्युदयं विदुः । वीरसाधनकं कर्म शिवापूजा बलिस्तथा ॥ ७७॥ सिन्दूरतिलको देवि
    वेश्यालापो निरन्तरम् । वेश्यागृहे निशाचारो रात्रौ पर्यटनं तथा ॥ ७८॥ शक्तिपूजा योनिदृष्टिः खड्गहस्तो
    दिगम्बरः । मुक्तकेशो वीरवेषः कुलमूर्तिधरो नरः ॥ ७९॥ कालीभक्तो भवेद्देवि नान्यथा क्षेममाप्नुयात् ।
    दुग्धास्वादी योनिलेही संविदासवघूर्णितः ॥ ८०॥ वेश्यालतासमायोगान्मासात्कल्पलता स्वयम् । वेश्याचक्रसमायोगात्कालीचक्रसमः
    स्वयम् ॥ ८१॥ वेश्यादेहसमायोगात् कालीदेहसमः स्वयम् । वेश्यामध्यगतं वीरं कदा पश्यामि साधकम् ॥ ८२॥ एवं
    वदति सा काली तस्माद्वेश्या वरा मता । वेश्या कन्या तथा पीठजातिभेदकुलक्रमात् ॥ ८३॥ अकुलक्रमभेदेन ज्ञात्वा
    चापि कुमारिकाम् । कुमारीं पूजयेद्भक्त्या जपान्ते भवने प्रिये ॥ ८४॥ पठेन्नामसहस्रं यः कालीदर्शनभाग्
    भवेत् । भक्त्या कुमारीं सम्पूज्य वैश्याकुल समुद्भवाम् ॥ ८५॥ वस्त्र हेमादिभिस्तोष्या यत्नात्स्तोत्रं
    पठेच्छिवे । त्रैलोक्य विजयी भूयाद्दिवा चन्द्रप्रकाशकः ॥ ८६॥ यद्यद्दत्तं कुमार्यै तु तदनन्तफलं भवेत्
    । कुमारीपूजनफलं मया वक्तुं न शक्यते ॥ ८७॥ चाञ्चल्याद्दुरितं किञ्चित्क्षम्यतामयमञ्जलिः । एका चेत्पूजिता
    बाला द्वितीया पूजिता भवेत् ॥ ८८॥ कुमार्यः शक्तयश्चैव सर्वमेतचराचरम् । शक्तिमानीय तद्गात्रे न्यासजालं
    प्रविन्यसेत् ॥ ८९॥ वामभागे च संस्थाप्य जपेन्नामसहस्रकम् । सर्वसिद्धीश्वरो भूयान्नात्र कार्य्या विचारणा
    ॥ ९०॥ श्मशानस्थो भवेत्स्वस्थो गलितं चिकुरं चरेत् । दिगम्बरः सहस्रं च सूर्यपुष्पं समानयेत् ॥ ९१॥ स्ववीर्येण
    प्लुतं कृत्वा प्रत्येकं प्रजपन् हुनेत् । पूज्य ध्यात्वा महाभक्त्या क्षमापालो नरः पठेत् ॥ ९२॥ नखं केशं
    स्ववीर्यं च यद्यत्सम्मार्जनीगतम् । मुक्तकेशो दिशावासो मूलमन्त्रपुरःसरः ॥ ९३॥ कुजवारे मध्यरात्रे होमं
    कृत्वा श्मशानके । पठेन्नामसहस्रं यः पृथ्वीशाकर्षको भवेत् ॥ ९४॥ पुष्पयुक्ते भगे देवि संयोगानन्दतत्परः
    । पुनश्चिकुरमासाद्य मूलमन्त्रं जपन् शिवे ॥ ९५॥ चितावह्नौ मध्यरात्रे वीर्यमुत्सार्य यत्नतः । कालिकां
    पूजयेत्तत्र पठेन्नाम सहस्रकम् ॥ ९६॥ पृथ्वीशाकर्षणं कुर्यान्नात्र कार्या विचारणा । कदली वनमासाद्य लक्षमन्त्रं
    जपेन्नरः ॥ ९७॥ मधुमत्या स्वयं देव्या सेव्यमानः स्मरोपमः । श्रीमधुमतीत्युक्त्वा तथा स्थावरजङ्गमान्
    ॥ ९८॥ आकर्षिणीं समुच्चार्य ठंठं स्वाहा समुच्चरेत् । त्रैलोक्याकर्षिणी विद्या तस्य हस्ते सदा भवेत्
    ॥ ९९॥ नदीं पुरीं च रत्नानि हेमस्त्रीशैलभूरुहान् । आकर्षयत्यम्बुनिधिं सुमेरुं च दिगन्ततः ॥ १००॥ अलभ्यानि
    च वस्तूनि दूराद्भूमितलादपि । वृत्तान्तं च सुरस्थानाद्रहस्ये विदुषामपि ॥ १०१॥ राज्ञां च कथयत्येषा सत्यं
    सत्वरमादिशेत् । द्वितीयवर्षपाठेन भवेत्पद्मावती शुभा ॥ १०२॥ ॐ ह्रींपद्मावति पदं ततस्त्रैलोक्यनाम च
    । वार्तां च कथय द्वन्द्वं स्वाहान्तो मन्त्र ईरितः ॥ १०३॥ ब्रह्मविष्ण्वादिकानां च त्रैलोक्ये यादृशी
    भवेत् । सर्व वदति देवेशी त्रिकालज्ञः कविश्शुभः ॥ १०४॥ त्रिवर्षं सम्पठन्देवि लभेद्भोगवतीं कलाम् । महाकालेन
    दृष्टोऽपि चितामध्यगतोऽपि वा ॥ १०५॥ तस्या दर्शनमात्रेण चिरञ्जीवी नरो भवेत् । मृतसञ्जीविनीत्युक्त्वा
    मृतमुत्थापय द्वयम् ॥ १०६॥ स्वाहान्तो मनुराख्यातो मृतसञ्जीवनात्मकः । चतुर्वर्षं पठेद्यस्तु स्वप्नसिद्धिस्ततो
    भवेत् ॥ १०७॥ ॐ ह्रीं स्वप्नवाराहि कालिस्वप्ने कथयोच्चरेत् । अमुकस्याऽमुकं देहि क्लीं स्वाहान्तो मनुर्मतः
    ॥ १०८॥ स्वप्नसिद्धा चतुर्वर्षात्तस्य स्वप्ने सदा स्थिता । चतुर्वर्षस्य पाठेन चतुर्वेदाधिपो भवेत् ॥
    १०९॥ तद्धस्तजलसंयोगान्मूर्खः काव्यं करोति च । तस्य वाक्यपरिचयान्मूर्तिर्विन्दति काव्यताम् ॥ ११०॥ मस्तके
    तु करं कृत्वा वद वाणीमिति ब्रुवन् । साधको वाञ्छया कुर्यात्तत्तथैव भविष्यति ॥ १११॥ ब्रह्माण्डगोलके
    याश्च याः काश्चिज्जगतीतले । समस्ताः सिद्धयो देवि करामलकवत्सदा ॥ ११२॥ साधकस्मृतिमात्रेण यावन्त्यः सन्ति
    सिद्धयः । स्वयमायान्ति पुरतो जपादीनां तु का कथा ॥ ११३॥ विदेशवर्तिनो भूत्वा वर्तन्ते चेटका इव । अमायां
    चन्द्रसन्दर्शश्चन्द्रग्रहणमेव च ॥ ११४॥ अष्टम्यां पूर्णचन्द्रत्वं चन्द्रसूर्याष्टकं तथा । अष्टदिक्षु
    तथाष्टौ च करोत्येव महेश्वरि ॥ ११५॥ अणिमा खेचरत्वं च चराचरपुरीगतम् । पादुकाखड्गवेतालयक्षिणीगुह्यकादयः
    ॥ ११६॥ तिलकोगुप्ततादृश्यं चराचरकथानकम् । मृतसञ्जीविनीसिद्धिर्गुटिका च रसायनम् ॥ ११७॥ उड्डीनसिद्धिर्देवेशि
    षष्टिसिद्धीश्वरत्वकम् । तस्य हस्ते वसेद्देवि नात्र कार्या विचारणा ॥ ११८॥ केतौ वा दुन्दुभौ वस्त्रे
    विताने वेष्टनेगृहे । भित्तौ च फलके देवि लेख्यं पूज्यं च यत्नतः ॥ ११९॥ मध्ये चक्रं दशाङ्गोक्तं परितो
    नामलेखनम् । तद्धारणान्महेशानि त्रैलोक्यविजयी भवेत् ॥ १२०॥ एको हि शतसाहस्रं निर्जित्य च रणाङ्गणे ।
    पुनरायाति च सुखं स्वगृहं प्रति पार्वती ॥ १२१॥ एको हि शतसन्दर्शी लोकानां भवति ध्रुवम् । कलशं स्थाप्य
    यत्नेन नामसाहस्रकं पठेत् ॥ १२२॥ सेकः कार्यो महेशानि सर्वापत्तिनिवारणे । भूतप्रेतग्रहादीनां राक्षसां
    ब्रह्मराक्षसाम् ॥ १२३॥ वेतालानां भैरवाणां स्कन्दवैनायकादिकान् । नाशयेत् क्षणमात्रेण नात्र कार्या विचारणा
    ॥ १२४॥ भस्मभिर्मन्त्रितं कृत्वा ग्रहग्रस्तं विलेपयेत् । भस्मसंक्षेपणादेव सर्वग्रहविनाशनम् ॥ १२५॥ नवनीतं
    चाभिमन्त्र्य स्त्रीभ्यो दद्यान्महेश्वरि । वन्ध्या पुत्रप्रदां देवि नात्र कार्या विचारणा ॥ १२६॥ कण्ठे
    वा वामबाहौ वा योनौ वा धारणाच्छिवे । बहुपुत्रवती नारी सुभगा जायते ध्रुवम् ॥ १२७॥ पुरुषो दक्षिणाङ्गे
    तु धारयेत्सर्वसिद्धये । बलवान्कीर्तिमान धन्योधार्मिकः साधकः कृती ॥ १२८॥ बहुपुत्री रथानां च गजानामधिपः
    सुधीः । कामिनीकर्षणोद्युक्तः क्रीं च दक्षिणकालिके ॥ १२९॥ क्रीं स्वाहा प्रजपेन्मन्त्रमयुतं नामपाठकः
    । आकर्षणं चरेद्देवि जलखेचरभूगतान् ॥ १३०॥ वशीकरणकामो हि हूँ हूँ ह्रीं ह्रीं च दक्षिणे । कालिके पूर्वबीजानि
    पूर्ववत्प्रजपन् पठेत् ॥ १३१॥ उर्वशीमपि वसयेन्नात्र कार्या विचारणा । क्रीं च दक्षिणकालिके स्वाहा युक्तं
    जपेन्नरः ॥ १३२॥ पठेन्नामसहस्रं तु त्रैलोक्यं मारयेद्ध्रुवम् । सद्भक्ताय प्रदातव्या विद्या राज्ञि शुभे
    दिने ॥ १३३॥ सद्विनीताय शान्ताय दान्तायातिगुणाय च । भक्ताय ज्येष्ठपुत्राय गुरुभक्तिपराय च ॥ १३४॥ वैष्णवाय
    प्रशुद्धाय शिवाबलिरताय च । वेश्यापूजनयुक्ताय कुमारीपूजकाय च ॥ १३५॥ दुर्गाभक्ताय रौद्राय महाकालप्रजापिने
    । अद्वैतभावयुक्ताय कालीभक्तिपराय च ॥ १३६॥ देयं सहस्रनामाख्यं स्वयं काल्या प्रकाशितम् । गुरुदैवतमन्त्राणां
    महेशस्यापि पार्वति ॥ १३७॥ अभेदेन स्मरेन्मन्त्रं स शिवः स गणाधिपः । यो मन्त्रं भावयेन्मन्त्री स शिवो
    नात्र संशयः ॥ १३८॥ स शाक्तो वैष्णवस्सौरः स एवं पूर्णदीक्षितः । अयोग्याय न दातव्यं सिद्धिरोधः प्रजायते
    ॥ १३९॥ वेश्यास्त्रीनिन्दकायाथ सुरासंवित्प्रनिन्दके । सुरामुखो मनुं स्मृत्वा सुराचार्यो भविष्यति ॥
    १४०॥ वाग्देवता घोरे आसापरघारे च हूँ वदेत् । घोररूपे महाघोरे मुखीभीमपदं वदेत् ॥ १४१॥ भीषण्यमुष्यषष्ठ्यन्तं
    हेतुर्वामयुगे शिवे । शिववह्नियुगास्त्रं हूँ हूँ कवचमनुर्भवेत् ॥ १४२॥ एतस्य स्मरणादेव दुष्टानां च मुखे
    सुरा । अवतीर्णा भवद्देवि दुष्टानां भद्रनाशिनी ॥ १४३॥ खलाय परतन्त्राय परनिन्दापराय च । भ्रष्टाय दुष्टसत्वाय
    परवादरताय च ॥ १४४॥ शिवाभक्ताय दुष्टाय परदाररताय च । न स्तोत्रं दर्शयेद्देवि शिवहत्याकरो भवेत् ॥ १४५॥
    कालिकानन्दहृदयः कालिकाभक्तिमानसः । कालीभक्तो भवेत्सोऽयं धन्यरूपः स एव तु ॥ १४६॥ कलौ काली कलौ काली
    कलौ काली वरप्रदा । कलौ काली कलौ काली कलौ काली तु केवला ॥ १४७॥ बिल्वपत्रसहस्राणि करवीराणि वै तथा ।
    प्रतिनाम्ना पूजयेद्धि तेन काली वरप्रदा ॥ १४८॥ कमलानां सहस्रं तु प्रतिनाम्ना समर्पयेत् । चक्रं सम्पूज्य
    देवेशि कालिकावरमाप्नुयात् ॥ १४९॥ मन्त्रक्षोभयुतो नैव कलशस्थजलेन च । नाम्ना प्रसेचयेद्देवि सर्वक्षोभविनाशकृत्
    ॥ १५०॥ तथा दमनकं देवि सहस्रमाहरेद्व्रती । सहस्रनाम्ना सम्पूज्य कालीवरमवाप्नुयात् ॥ १५१॥ चक्रं विलिख्य
    देहस्थं धारयेत्कालिकातनुः । काल्यै निवेदितं यद्यत्तदंशं भक्षयेच्छिवे ॥ १५२॥ दिव्यदेहधरो भूत्वा कालीदेहे
    स्थितो भवेत् । नैवेद्यनिन्दकान् दुष्टान् दृष्ट्वा नृत्यन्ति भैरवा ॥ १५३॥ योगिन्यश्च महावीरा रक्तपानोद्यताः
    प्रिये । मांसास्थिचर्मणोद्युक्ता भक्षयन्ति न संशयः ॥ १५४॥ तस्मान्न निन्दयेद्देवि मनसा कर्मणा गिरा
    । अन्यथा कुरुते यस्तु तस्य नाशो भविष्यति ॥ १५५॥ क्रमदीक्षायुतानां च सिद्धिर्भवति नान्यथा । मन्त्रक्षोभश्च
    वा भूयात् क्षीणायुर्वा भवेद्ध्रुवम् ॥ १५६॥ पुत्रहारी स्त्रियोहारी राज्यहारी भवेद्ध्रुवम् । क्रमदीक्षायुतो
    देवि क्रमाद्राज्यमवाप्नुयात् ॥ १५७॥ एकवारं पठेद्देवि सर्वपापविनाशनम् । द्विवारं च पठेद्यो हि वाञ्छां
    विन्दति नित्यशः ॥ १५८॥ त्रिवारं च पठेद्यस्तु वागीशसमतां व्रजेत् । चतुर्वारं पठेद्देवि चतुर्वर्णाधिपो
    भवेत् ॥ १५९॥ पञ्चवारं पठेद्देवि पञ्चकामाधिपो भवेत् । षड्वारं च पठेद्देवि षडैश्वर्याधिपो भवेत् ॥ १६०॥
    सप्तवारं पठेत्सप्तकामनां चिन्तितं लभेत् । वसुवारं पठेद्देवि दिगीशो भवति ध्रुवम् ॥ १६१॥ नववारं पठेद्देवि
    नवनाथसमो भवेत् । दशवारं कीर्त्तयेद्यो दशार्हः खेचरेश्वरः ॥ १६२॥ विंशतिवारं कीर्तयेद्यः सर्वैश्वर्यमयो
    भवेत् । पञ्चविंशतिवारैस्तु सर्वचिन्ताविनाशकः ॥ १६३॥ पञ्चाशद्वारमावर्त्य पञ्चभूतेश्वरो भवेत् । शतवारं
    कीर्त्तयेद्यः शताननसमानधीः ॥ १६४॥ शतपञ्चकमावर्त्य राजराजेश्वरो भवेत् । सहस्रावर्तनाद्देवि लक्ष्मीरावृणुते
    स्वयम् ॥ १६५॥ त्रिसहस्रं समावर्त्य त्रिनेत्रसदृशो भवेत् । पञ्च साहस्रमावर्त्य कामकोटि विमोहनः ॥ १६६॥
    दशसाहस्रमावर्त्य भवेद्दशमुखेश्वरः । पञ्चविंशतिसाहस्रै च चतुर्विंशतिसिद्धिधृक् ॥ १६७॥ लक्षावर्तनमात्रेण
    लक्ष्मीपतिसमो भवेत् । लक्षत्रयावर्त्तनात्तु महादेवं विजेष्यति ॥ १६८॥ लक्षपञ्चकमावर्त्य कलापञ्चकसंयुतः
    । दशलक्षावर्त्तनात्तु दशविद्याप्तिरुत्तमा ॥ १६९॥ पञ्चविंशतिलक्षैस्तु दशविद्येश्वरो भवेत् । पञ्चाशल्लक्षमावृत्य
    महाकालसमो भवेत् ॥ १७०॥ कोटिमावर्त्तयेद्यस्तु कालीं पश्यति चक्षुषा । वरदानोद्युक्तकरां महाकालसमन्विताम्
    ॥ १७१॥ प्रत्यक्षं पश्यति शिवे तस्या देहो भवेद्ध्रुवम् । श्रीविद्याकालिकातारात्रिशक्तिविजयी भवेत् ॥
    १७२॥ विधेर्लिपिं च सम्मार्ज्य किङ्करत्वं विसृज्य च । महाराज्यमवाप्नोति नात्र कार्या विचारणा ॥ १७३॥
    त्रिशक्तिविषये देविक्रमदीक्षा प्रकीर्तिता । क्रमदीक्षायुतो देवि राजा भवति निश्चितम् ॥ १७४॥ क्रमदीक्षाविहीनस्य
    फलं पूर्वमिहेरितम् । क्रमदीक्षायुतो देवि शिव एव न चापरः ॥ १७५॥ क्रमदीक्षासमायुक्तः काल्युक्तसिद्धिभाग्भवेत्
    । क्रमदीक्षाविहीनस्य सिद्धिहानिः पदे पदे ॥ १७६॥ अहो जन्मवतां मध्ये धन्यः क्रमयुतः कलौ । तत्रापि धन्यो
    देवेशि नामसाहस्रपाठकः ॥ १७७॥ दशकालीविद्यौ देवि स्तोत्रमेतत्सदा पठेत् । सिद्धिं विन्दति देवेशि नात्र
    कार्या विचारणा ॥ १७८॥ काकी काली महाविद्या कलौ काली च सिद्धिदा । कलौ काली च सिद्धा च कलौ काली वरप्रदा
    ॥ १७९॥ कलौ काली साधकस्य दर्शनार्थं समुद्यता । कलौ काली केवला स्यान्नात्र कार्या विचारणा ॥ १८०॥ नान्यविद्या
    नान्यविद्या नान्यविद्या कलौ भवेत् । कलौ कालीं विहायाथ यः कश्चित्सिद्धिकामुकः ॥ १८१॥ स तु शक्तिं विना
    देवि रतिसम्भोगमिच्छति । कलौ कालीं विना देवि यः कश्चित्सिद्धिमिच्छति ॥ १८२॥ स नीलसाधनं त्यक्त्वा परिभ्रमति
    सर्वतः । कलौ काली विहायाथ यः कश्चिन्मोक्षमिच्छति ॥ १८३॥ गुरुध्यानं परित्यज्य सिद्धिमिच्छति साधकः ।
    कलौ काली विहायाथ यः कश्चिद्राज्यमिच्छति ॥ १८४॥ स भोजन परित्यज्य भिक्षुवृत्तिमभीप्सति । स धन्यः स च
    विज्ञानी स एव सुरपूजितः ॥ १८५॥ स दीक्षितः सुखी साधुः सत्यवादी जितेन्द्रियः । स वेदवक्ता स्वाध्यायी
    नात्र कार्या विचारणा ॥ १८६॥ शिवरूपं गुरुं ध्यात्वा शिवरूपं गुरुं स्मरेत् । सदाशिवः स एव स्यानात्र
    कार्या विचारणा ॥ १८७॥ स्वस्मिन् कालीं तु सम्भाव्य पूजयेज्जगदम्बिकाम् । त्रैलोक्यविजयी भूयान्नात्र
    कार्य्या विचारणा ॥ १८८॥ गोपनीयं गोपनीयं गोपनीयं प्रयत्नतः । रहस्यातिरहस्यं च रहस्यातिरहस्यकम् ॥ १८९॥
    श्लोकार्द्धं पादमात्रं वा पादादर्धं च तदर्धकम् । नामार्धं यः पठेद्देवि न वन्ध्यदिवसं न्यसेत् ॥ १९०॥
    पुस्तकं पूजयेद्भक्त्या त्वरितं फलसिद्धये । न च मारीभयं तत्र न चाग्निर्वायुसम्भवम् ॥ १९१॥ न भूतादिभयं
    तत्र सर्वत्र सुखमेधते । कुङ्कुमाऽलक्तकेनैव रोचनाऽगरुयोगतः ॥ १९२॥ भूर्जपत्रे लिखेत् पुस्तं सर्वकामार्थसिद्धये
    । इति संक्षेपतः प्रोक्तं किमन्यच्छ्रोतुमिच्छसि ॥ १९३॥ इति गदितमशेषं कालिकावर्णरूपम् । प्रपठति यदि
    भक्त्या सर्वसिद्धीश्वरः स्यात् ॥ १९४॥ अभिनवसुखकामः सर्वविद्याभिरामो भवति सकलसिद्धिधः सर्ववीरासमृद्धिः
    ॥ १९५॥ ॥ इति श्रीमदादिनाथमहाकालविरचितायां महाकालसंहितायां कालकालीसंवादे सुन्दरीशक्तिदानाख्यं कालीस्वरूप
    मेधासाम्राज्यप्रदं सहस्रनामस्तोत्रं सम्पूर्णम् ॥
