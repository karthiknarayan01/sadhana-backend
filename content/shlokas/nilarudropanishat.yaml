id: nilarudropanishat
category: stotram
name:
  english: nilarudropanishat
  devanagari: नीलरुद्रोपनिषत्
content:
  english: hariruta | kalmashapucchamoshadhe jambhaya''shvarundhati || ya iti | yah shivah svajananbhaktanprati
    nilagrivah | yashca svajananbhaktanprati harirharitavarno bhaktavatsalo na bhavati | mahishasya hi
    tadrigrupam sambhavati | yadva nilagrivo rudro harirvipnushca bhavati | anena hariharayorekarupatokta
    | he oshadhe | arundhati rodharahite tam kalmashapuccham krishnapandurapuccham | ashu shighram jambhaya
    svaviryena viryavantam kurushe | aushadhinam pashubhyo balapradatvat | kalmasho rakshase krishne kalmashah
    krishnapandure iti vishvah | kedareshvarasya mahisharupatvatpucchavatta sambhavati | babhrushca babhrukarnashcanilagalashilah
    shivah | pashya sarvena nilashikhandena bhavena marutam pita || virupakshena babhruna vacam vadishyato
    hatah | sarvanilashikhandena vira karmani karmani || babhruh kvacidavayave pingalavarnah | babhrukarnah
    pingalavarnakarnah | nilagalashilah shiva ityatra nilagrivashca yah shiva iti patho yuktah | piteti
    | tritiyarthe prathama pitretyarthah | atha vacam vadishyatah pita dehimatrasya janako brahma yeneshvarena
    hatastam tvam pashyetyanvayah | he vira karmani karmani vihitanishiddharupe | imamasya prasham jahi
    yenedam vibhajamahe | namo bhavaya namah sharvaya namah kumaraya shatrave || namo nilashikhandaya
    namah sabhaprapadine || imamasya janasya | prasham pricchatiti prattam prasham pracchikam vacam |
    jahi vedavihitam nishiddhakarmavishayam samshayam nirakurvityarthah | yena karmanedam jagadvibhajamahe
    karmabhumibhogabhumirupena vibhaktam kurmahe | kumaraya kalanabhibhutaya skandarupaya va | shatrave
    samhartre | sabhaprapadine sabham prapadyate tacchila sabhaprapadi tasmai sabhyayetyarthah | yasya
    hari ashvatarau gardabhavabhitahsarau | tasmai nilashikhandaya namah sabhaprapadine namah sabhaprapadina
    iti || 3|| ityatharvavede nilarudropanishatsamapta || 18|| ashvatarau ishadunamashvatvam yayostavashvatarau
    gardabhadashvayam jatau | abhitahsaravabhitah sarata ityabhitahsarau gardabhau vartete | yatha purushottamakshetrasya
    nilamadhavo'dhishthataivam kedarakshetrasya nilarudrah | dviruktih samaptyartha || 3|| narayanena
    racita shrutimatropajivina | aspashtapadavakyanam nilarudrasya dipika || 1|| iti narayanaviracita
    nilarudropanishaddipika samapta || 24||
  devanagari: हरिरुत । कल्माषपुच्छमोषधे जम्भयाऽऽश्वरुन्धति ॥ य इति । यः शिवः स्वजनान्भक्तान्प्रति नीलग्रीवः
    । यश्च स्वजनान्भक्तान्प्रति हरिर्हरितवर्णो भक्तवत्सलो न भवति । महिषस्य हि तादृग्रूपं सम्भवति । यद्वा
    नीलग्रीवो रुद्रो हरिर्विप्णुश्च भवति । अनेन हरिहरयोरेकरूपतोक्ता । हे ओषधे । अरुन्धति रोधरहिते तं कल्माषपुच्छं
    कृष्णपाण्डुरपुच्छम् । आशु शीघ्रं जम्भय स्ववीर्येण वीर्यवन्तं कुरुषे । औषधीनां पशुभ्यो बलप्रदत्वात्
    । कल्माषो राक्षसे कृष्णे कल्माषः कृष्णपाण्डुरे इति विश्वः । केदारेश्वरस्य महिषरूपत्वात्पुच्छवत्ता
    सम्भवति । बभ्रुश्च बभ्रुकर्णश्चनीलागलशीलाः शिवः । पश्य सर्वेण नीलशिखण्डेन भवेन मरुतां पिता ॥ विरूपाक्षेण
    बभ्रुणा वाचं वदिष्यतो हतः । सर्वनीलशिखण्डेन वीर कर्मणि कर्मणि ॥ बभ्रुः क्वचिदवयवे पिङ्गलवर्णः । बभ्रुकर्णः
    पिङ्गलवर्णकर्णः । नीलागलशीलाः शिव इत्यत्र नीलग्रीवश्च यः शिव इति पाठो युक्तः । पितेति । तृतीयार्थे
    प्रथमा पित्रेत्यर्थः । अथ वाचं वदिष्यतः पिता देहिमात्रस्य जनको ब्रह्मा येनेश्वरेण हतस्तं त्वं पश्येत्यन्वयः
    । हे वीर कर्मणि कर्मणि विहितनिषिद्धरूपे । इमामस्य प्राशं जहि येनेदं विभजामहे । नमो भवाय नमः शर्वाय
    नमः कुमाराय शत्रवे ॥ नमो नीलशिखण्डाय नमः सभाप्रपादिने ॥ इमामस्य जनस्य । प्राशं पृच्छतीति प्राट्तां
    प्राशं प्रच्छिकां वाचम् । जहि वेदविहितं निषिद्धकर्मविषयं संशयं निराकुर्वित्यर्थः । येन कर्मणेदं जगद्विभजामहे
    कर्मभूमिभोगभूमिरूपेण विभक्तं कुर्महे । कुमाराय कालानभिभूताय स्कन्दरूपाय वा । शत्रवे संहर्त्रे । सभाप्रपादिने
    सभां प्रपद्यते तच्छील सभाप्रपादी तस्मै सभ्यायेत्यर्थः । यस्य हरी अश्वतरौ गर्दभावभितःसरौ । तस्मै नीलशिखण्डाय
    नमः सभाप्रपादिने नमः सभाप्रपादिन इति ॥ ३॥ इत्यथर्ववेदे नीलरुद्रोपनिषत्समाप्ता ॥ १८॥ अश्वतरौ ईषदूनमश्वत्वं
    ययोस्तावश्वतरौ गर्दभादश्वायां जातौ । अभितःसरावभितः सरत इत्यभितःसरौ गर्दभौ वर्तेते । यथा पुरुषोत्तमक्षेत्रस्य
    नीलमाधवोऽधिष्ठातैवं केदारक्षेत्रस्य नीलरुद्रः । द्विरुक्तिः समाप्त्यर्था ॥ ३॥ नारायणेन रचिता श्रुतिमात्रोपजीविना
    । अस्पष्टपदवाक्यानां नीलरुद्रस्य दीपिका ॥ १॥ इति नारायणविरचिता नीलरुद्रोपनिषद्दीपिका समाप्ता ॥ २४॥
