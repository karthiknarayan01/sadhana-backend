id: annamayya-keerthanas-pavanatmaja-o-ghanudaa
category: stotram
name:
  english: Annamayya Keerthanas Pavanatmaja O Ghanudaa
content:
  english: o pavanatmaja o ghanuda bapu bapanaga parigitiga | o hanumantuda udayacala ni rvahaka nija
    sarva prabala | dehamu mocina tèguvaku nituvalè sahasa mituvalè catitiga || o ravi grahana odanujantaka
    maruleka mati malasitiga | darunapu vinata tanayadulu garavimpa nitu kaligitiga || o dashamukha hara
    o venkatapati padasaroruha palakuda | i dehamuto innilokamulu nidehamèkka nilicitiga ||
  devanagari: ओ पवनात्मज ओ घनुडा बापु बापनगा परिगितिगा । ओ हनुमन्तुड उदयाचल नि र्वाहक निज सर्व प्रबला
    । देहमु मोचिन तॆगुवकु निटुवलॆ साहस मिटुवलॆ चाटितिगा ॥ ओ रवि ग्रहण ओदनुजान्तक मारुलेक मति मलसितिगा
    । दारुणपु विनता तनयादुलु गारविम्प निटु कलिगितिगा ॥ ओ दशमुख हर ओ वेङ्कटपति पादसरोरुह पालकुडा । ई देहमुतो
    इन्निलोकमुलु नीदेहमॆक्क निलिचितिगा ॥
