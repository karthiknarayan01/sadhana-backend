id: sri-rama-charita-manasa-sundara-kanda
category: stotram
name:
  english: Sri Rama Charita Manasa - Sundara Kanda
content:
  english: shrijanakivallabho vijayate shriramacaritamanasa pancama sopana shantam shashvatamaprameyamanagham
    nirvanashantipradam brahmashambhuphanindrasevyamanisham vedantavedyam vibhum | ramakhyam jagadishvaram
    suragurum mayamanushyam harim vande'ham karunakaram raghuvaram bhupalacuraamanim || || nanya spriha
    raghupate hridaye'smadiye satyam vadami ca bhavanakhilantaratma| bhaktim prayaccha raghupungava nirbharam
    me kamadidosharahitam kuru manasam ca || || atulitabaladhamam hemashailabhadeham danujavanakrishanum
    jnaninamagraganyam| sakalagunanidhanam vanaranamadhisham raghupatipriyabhaktam vatajatam namami ||
    || jamavanta ke bacana suhae| suni hanumanta hridaya ati bhae || taba lagi mohi parikhehu tumha bhai|
    sahi dukha kanda mula phala khai || jaba lagi avaum sitahi dekhi| hoihi kaju mohi harasha biseshi
    || yaha kahi nai sabanhi kahu~ matha| caleu harashi hiya~ dhari raghunatha || sindhu tira eka bhudhara
    sundara| kautuka kudi carhaeu ta upara || bara bara raghubira sa~bhari| tarakeu pavanatanaya bala
    bhari || jehim giri carana dei hanumanta| caleu so ga patala turanta || jimi amogha raghupati kara
    bana| ehi bha~ti caleu hanumana || jalanidhi raghupati duta bicari| taim mainaka hohi shramahari ||
    do hanumana tehi parasa kara puni kinha pranama| rama kaju kinhem binu mohi kaha~ bishrama || || jata
    pavanasuta devanha dekha| janaim kahu~ bala buddhi bisesha || surasa nama ahinha kai mata| pathinhi
    ai kahi tehim bata || aju suranha mohi dinha ahara| sunata bacana kaha pavanakumara || rama kaju kari
    phiri maim avaum| sita ki sudhi prabhuhi sunavaum || taba tava badana paithihu~ ai| satya kahu~ mohi
    jana de mai || kabanehu~ jatana dei nahim jana| grasasi na mohi kaheu hanumana || jojana bhari tehim
    badanu pasara| kapi tanu kinha duguna bistara || soraha jojana mukha tehim thayu| turata pavanasuta
    battisa bhayu || jasa jasa surasa badanu barhaava| tasu duna kapi rupa dekhava || sata jojana tehim
    anana kinha| ati laghu rupa pavanasuta linha || badana pithi puni bahera ava| maga bida tahi siru
    nava || mohi suranha jehi lagi pathava| budhi bala maramu tora mai pava || do rama kaju sabu karihahu
    tumha bala buddhi nidhana| asisha deha gi so harashi caleu hanumana || || nisicari eka sindhu mahu~
    rahi| kari maya nabhu ke khaga gahi || jiva jantu je gagana uraahim| jala biloki tinha kai parichahim
    || gahi chaha~ saka so na uraai| ehi bidhi sada gaganacara khai || soi chala hanumana kaha~ kinha|
    tasu kapatu kapi turatahim cinha || tahi mari marutasuta bira| baridhi para gayu matidhira || taha~
    jai dekhi bana sobha| gunjata cancarika madhu lobha || nana taru phala phula suhae| khaga mriga brinda
    dekhi mana bhae || saila bisala dekhi eka agem| ta para dhai cadheu bhaya tyagem || uma na kachu kapi
    kai adhikai| prabhu pratapa jo kalahi khai || giri para cadhi lanka tehim dekhi| kahi na jai ati durga
    biseshi || ati utanga jalanidhi cahu pasa| kanaka kota kara parama prakasa || cham kanaka kota bicitra
    mani krita sundarayatana ghana| cuhatta hatta subatta bithim caru pura bahu bidhi bana || gaja baji
    khaccara nikara padacara ratha baruthinha ko ganai || bahurupa nisicara jutha atibala sena baranata
    nahim banai || || bana baga upabana batika sara kupa bapim sohahim| nara naga sura gandharba kanya
    rupa muni mana mohahim || kahu~ mala deha bisala saila samana atibala garjahim| nana akharenha bhirahim
    bahu bidhi eka ekanha tarjahim || || kari jatana bhata kotinha bikata tana nagara cahu~ disi racchahim|
    kahu~ mahisha manashu dhenu khara aja khala nisacara bhacchahim || ehi lagi tulasidasa inha ki katha
    kachu eka hai kahi| raghubira sara tiratha sariranhi tyagi gati paihahim sahi || pura rakhavare dekhi
    bahu kapi mana kinha bicara| ati laghu rupa dharaum nisi nagara karaum pisara || || masaka samana
    rupa kapi dhari| lankahi caleu sumiri narahari || nama lankini eka nisicari| so kaha calesi mohi nindari
    || janehi nahim maramu satha mora| mora ahara jaha~ lagi cora || muthika eka maha kapi hani| rudhira
    bamata dharanim dhanamani || puni sambhari uthi so lanka| jori pani kara binaya samsaka || jaba ravanahi
    brahma bara dinha| calata biranci kaha mohi cinha || bikala hosi taim kapi kem mare| taba janesu nisicara
    sanghare || tata mora ati punya bahuta| dekheu~ nayana rama kara duta || do tata svarga apabarga sukha
    dharia tula eka anga| tula na tahi sakala mili jo sukha lava satasanga || || prabisi nagara kije saba
    kaja| hridaya~ rakhi kausalapura raja || garala sudha ripu karahim mitai| gopada sindhu anala sitalai
    || garura sumeru renu sama tahi| rama kripa kari citava jahi || ati laghu rupa dhareu hanumana| paitha
    nagara sumiri bhagavana || mandira mandira prati kari sodha| dekhe jaha~ taha~ aganita jodha || gayu
    dasanana mandira mahim| ati bicitra kahi jata so nahim || sayana kie dekha kapi tehi| mandira mahu~
    na dikhi baidehi || bhavana eka puni dikha suhava| hari mandira taha~ bhinna banava || do ramayudha
    ankita griha sobha barani na jai| nava tulasika brinda taha~ dekhi harashi kapirai || || lanka nisicara
    nikara nivasa| iha~ kaha~ sajjana kara basa || mana mahu~ taraka karai kapi laga| tehim samaya bibhishanu
    jaga || rama rama tehim sumirana kinha| hridaya~ harasha kapi sajjana cinha || ehi sana hathi karihu~
    pahicani| sadhu te hoi na karaja hani || bipra rupa dhari bacana sunae| sunata bibhishana uthi taha~
    ae || kari pranama pu~chi kusalai| bipra kahahu nija katha bujhai || ki tumha hari dasanha maha~ koi|
    morem hridaya priti ati hoi || ki tumha ramu dina anuragi| ayahu mohi karana barabhagi || do taba
    hanumanta kahi saba rama katha nija nama| sunata jugala tana pulaka mana magana sumiri guna grama
    || || sunahu pavanasuta rahani hamari| jimi dasananhi mahu~ jibha bicari || tata kabahu~ mohi jani
    anatha| karihahim kripa bhanukula natha || tamasa tanu kachu sadhana nahim| priti na pada saroja mana
    mahim || aba mohi bha bharosa hanumanta| binu harikripa milahim nahim santa || jau raghubira anugraha
    kinha| tau tumha mohi darasu hathi dinha || sunahu bibhishana prabhu kai riti| karahim sada sevaka
    para priti || kahahu kavana maim parama kulina| kapi cancala sabahim bidhi hina || prata lei jo nama
    hamara| tehi dina tahi na milai ahara || do asa maim adhama sakha sunu mohu para raghubira| kinhi
    kripa sumiri guna bhare bilocana nira || || janatahu~ asa svami bisari| phirahim te kahe na hohim
    dukhari || ehi bidhi kahata rama guna grama| pava anirbacya bishrama || puni saba katha bibhishana
    kahi| jehi bidhi janakasuta taha~ rahi || taba hanumanta kaha sunu bhrata| dekhi cahu~ janaki mata
    || juguti bibhishana sakala sunai| caleu pavanasuta bida karai || kari soi rupa gayu puni tahava~|
    bana asoka sita raha jahava~ || dekhi manahi mahu~ kinha pranama| baithehim biti jata nisi jama ||
    krisa tana sisa jata eka beni| japati hridaya~ raghupati guna shreni || do nija pada nayana die~ mana
    rama pada kamala lina| parama dukhi bha pavanasuta dekhi janaki dina || || taru pallava mahu~ raha
    lukai| kari bicara karaum ka bhai || tehi avasara ravanu taha~ ava| sanga nari bahu kie~ banava ||
    bahu bidhi khala sitahi samujhava| sama dana bhaya bheda dekhava || kaha ravanu sunu sumukhi sayani|
    mandodari adi saba rani || tava anucarim karu~ pana mora| eka bara biloku mama ora || trina dhari
    ota kahati baidehi| sumiri avadhapati parama sanehi || sunu dasamukha khadyota prakasa| kabahu~ ki
    nalini kari bikasa || asa mana samujhu kahati janaki| khala sudhi nahim raghubira bana ki || satha
    sune hari anehi mohi| adhama nilajja laja nahim tohi || do apuhi suni khadyota sama ramahi bhanu samana|
    parusha bacana suni karhai asi bola ati khisiana || || sita taim mama krita apamana| katihu~ tava
    sira kathina kripana || nahim ta sapadi manu mama bani| sumukhi hoti na ta jivana hani || syama saroja
    dama sama sundara| prabhu bhuja kari kara sama dasakandhara || so bhuja kantha ki tava asi ghora|
    sunu satha asa pravana pana mora || candrahasa haru mama paritapam| raghupati biraha anala sanjatam
    || sitala nisita bahasi bara dhara| kaha sita haru mama dukha bhara || sunata bacana puni marana dhava|
    mayatanaya~ kahi niti bujhava || kahesi sakala nisicarinha bolai| sitahi bahu bidhi trasahu jai ||
    masa divasa mahu~ kaha na mana| tau maim marabi karhai kripana || do bhavana gayu dasakandhara iha~
    pisacini brinda| sitahi trasa dekhavahi dharahim rupa bahu manda || || trijata nama racchasi eka|
    rama carana rati nipuna bibeka || sabanhau boli sunaesi sapana| sitahi sei karahu hita apana || sapanem
    banara lanka jari| jatudhana sena saba mari || khara arurha nagana dasasisa| mundita sira khandita
    bhuja bisa || ehi bidhi so dacchina disi jai| lanka manahu~ bibhishana pai || nagara phiri raghubira
    dohai| taba prabhu sita boli pathai || yaha sapana mem kahu~ pukari| hoihi satya ge~ dina cari ||
    tasu bacana suni te saba darim| janakasuta ke carananhi parim || do jaha~ taha~ gim sakala taba sita
    kara mana soca| masa divasa bitem mohi marihi nisicara poca || || trijata sana boli kara jori| matu
    bipati sangini taim mori || tajaum deha karu begi upai| dusahu birahu aba nahim sahi jai || ani katha
    racu cita banai| matu anala puni dehi lagai || satya karahi mama priti sayani| sunai ko shravana sula
    sama bani || sunata bacana pada gahi samujhaesi| prabhu pratapa bala sujasu sunaesi || nisi na anala
    mila sunu sukumari| asa kahi so nija bhavana sidhari || kaha sita bidhi bha pratikula| milahi na pavaka
    mitihi na sula || dekhiata pragata gagana angara| avani na avata eku tara || pavakamaya sasi stravata
    na agi| manahu~ mohi jani hatabhagi || sunahi binaya mama bitapa asoka| satya nama karu haru mama
    soka || nutana kisalaya anala samana| dehi agini jani karahi nidana || dekhi parama birahakula sita|
    so chana kapihi kalapa sama bita || so kapi kari hridaya~ bicara dinhi mudrika dari taba| janu asoka
    angara dinhi harashi uthi kara gaheu || || taba dekhi mudrika manohara| rama nama ankita ati sundara
    || cakita citava mudari pahicani| harasha bishada hridaya~ akulani || jiti ko saki ajaya raghurai|
    maya tem asi raci nahim jai || sita mana bicara kara nana| madhura bacana boleu hanumana || ramacandra
    guna baranaim laga| sunatahim sita kara dukha bhaga || lagim sunaim shravana mana lai| adihu tem saba
    katha sunai || shravanamrita jehim katha suhai| kahi so pragata hoti kina bhai || taba hanumanta nikata
    cali gayu| phiri bainthim mana bisamaya bhayu || rama duta maim matu janaki| satya sapatha karunanidhana
    ki || yaha mudrika matu maim ani| dinhi rama tumha kaha~ sahidani || nara banarahi sanga kahu kaisem|
    kahi katha bhi sangati jaisem || do kapi ke bacana saprema suni upaja mana bisvasa || jana mana krama
    bacana yaha kripasindhu kara dasa || || harijana jani priti ati garhai| sajala nayana pulakavali barhai
    || burata biraha jaladhi hanumana| bhayu tata mom kahu~ jalajana || aba kahu kusala jau~ balihari|
    anuja sahita sukha bhavana kharari || komalacita kripala raghurai| kapi kehi hetu dhari nithurai ||
    sahaja bani sevaka sukha dayaka| kabahu~ka surati karata raghunayaka || kabahu~ nayana mama sitala
    tata| hoihahi nirakhi syama mridu gata || bacanu na ava nayana bhare bari| ahaha natha haum nipata
    bisari || dekhi parama birahakula sita| bola kapi mridu bacana binita || matu kusala prabhu anuja
    sameta| tava dukha dukhi sukripa niketa || jani janani manahu jiya~ una| tumha te premu rama kem duna
    || do raghupati kara sandesu aba sunu janani dhari dhira| asa kahi kapi gada gada bhayu bhare bilocana
    nira || || kaheu rama biyoga tava sita| mo kahu~ sakala bhe biparita || nava taru kisalaya manahu~
    krisanu| kalanisa sama nisi sasi bhanu || kubalaya bipina kunta bana sarisa| barida tapata tela janu
    barisa || je hita rahe karata tei pira| uraga svasa sama tribidha samira || kahehu tem kachu dukha
    ghati hoi| kahi kahaum yaha jana na koi || tattva prema kara mama aru tora| janata priya eku manu
    mora || so manu sada rahata tohi pahim| janu priti rasu etenahi mahim || prabhu sandesu sunata baidehi|
    magana prema tana sudhi nahim tehi || kaha kapi hridaya~ dhira dharu mata| sumiru rama sevaka sukhadata
    || ura anahu raghupati prabhutai| suni mama bacana tajahu kadarai || do nisicara nikara patanga sama
    raghupati bana krisanu| janani hridaya~ dhira dharu jare nisacara janu || || jaum raghubira hoti sudhi
    pai| karate nahim bilambu raghurai || ramabana rabi ue~ janaki| tama barutha kaha~ jatudhana ki ||
    abahim matu maim jau~ lavai| prabhu ayasu nahim rama dohai || kachuka divasa janani dharu dhira| kapinha
    sahita aihahim raghubira || nisicara mari tohi lai jaihahim| tihu~ pura naradadi jasu gaihahim ||
    haim suta kapi saba tumhahi samana| jatudhana ati bhata balavana || morem hridaya parama sandeha|
    suni kapi pragata kinha nija deha || kanaka bhudharakara sarira| samara bhayankara atibala bira ||
    sita mana bharosa taba bhayu| puni laghu rupa pavanasuta layu || do sunu mata sakhamriga nahim bala
    buddhi bisala| prabhu pratapa tem garurahi khai parama laghu byala || || mana santosha sunata kapi
    bani| bhagati pratapa teja bala sani || asisha dinhi ramapriya jana| hohu tata bala sila nidhana ||
    ajara amara gunanidhi suta hohu| karahu~ bahuta raghunayaka chohu || karahu~ kripa prabhu asa suni
    kana| nirbhara prema magana hanumana || bara bara naesi pada sisa| bola bacana jori kara kisa || aba
    kritakritya bhayu~ maim mata| asisha tava amogha bikhyata || sunahu matu mohi atisaya bhukha| lagi
    dekhi sundara phala rukha || sunu suta karahim bipina rakhavari| parama subhata rajanicara bhari ||
    tinha kara bhaya mata mohi nahim| jaum tumha sukha manahu mana mahim || do dekhi buddhi bala nipuna
    kapi kaheu janakim jahu| raghupati carana hridaya~ dhari tata madhura phala khahu || || caleu nai
    siru paitheu baga| phala khaesi taru toraim laga || rahe taha~ bahu bhata rakhavare| kachu maresi
    kachu jai pukare || natha eka ava kapi bhari| tehim asoka batika ujari || khaesi phala aru bitapa
    upare| racchaka mardi mardi mahi dare || suni ravana pathe bhata nana| tinhahi dekhi garjeu hanumana
    || saba rajanicara kapi sanghare| ge pukarata kachu adhamare || puni pathayu tehim acchakumara| cala
    sanga lai subhata apara || avata dekhi bitapa gahi tarja| tahi nipati mahadhuni garja || do kachu
    maresi kachu mardesi kachu milesi dhari dhuri| kachu puni jai pukare prabhu markata bala bhuri ||
    || suni suta badha lankesa risana| pathesi meghanada balavana || marasi jani suta bandhesu tahi| dekhia
    kapihi kaha~ kara ahi || cala indrajita atulita jodha| bandhu nidhana suni upaja krodha || kapi dekha
    daruna bhata ava| katakatai garja aru dhava || ati bisala taru eka upara| biratha kinha lankesa kumara
    || rahe mahabhata take sanga| gahi gahi kapi mardi nija anga || tinhahi nipati tahi sana baja| bhire
    jugala manahu~ gajaraja| muthika mari carhaa taru jai| tahi eka chana murucha ai || uthi bahori kinhisi
    bahu maya| jiti na jai prabhanjana jaya || do brahma astra tehim sa~dha kapi mana kinha bicara| jaum
    na brahmasara manu~ mahima miti apara || || brahmabana kapi kahu~ tehi mara| paratihu~ bara kataku
    sanghara || tehi dekha kapi muruchita bhayu| nagapasa ba~dhesi lai gayu || jasu nama japi sunahu bhavani|
    bhava bandhana katahim nara gyani || tasu duta ki bandha taru ava| prabhu karaja lagi kapihim ba~dhava
    || kapi bandhana suni nisicara dhae| kautuka lagi sabha~ saba ae || dasamukha sabha dikhi kapi jai|
    kahi na jai kachu ati prabhutai || kara jorem sura disipa binita| bhrikuti bilokata sakala sabhita
    || dekhi pratapa na kapi mana sanka| jimi ahigana mahu~ garura asanka || do kapihi biloki dasanana
    bihasa kahi durbada| suta badha surati kinhi puni upaja hridaya~ bishada || || kaha lankesa kavana
    taim kisa| kehim ke bala ghalehi bana khisa || ki dhaum shravana sunehi nahim mohi| dekhu~ ati asanka
    satha tohi || mare nisicara kehim aparadha| kahu satha tohi na prana ki badha || suna ravana brahmanda
    nikaya| pai jasu bala biracita maya || jakem bala biranci hari isa| palata srijata harata dasasisa|
    ja bala sisa dharata sahasanana| andakosa sameta giri kanana || dhari jo bibidha deha suratrata| tumha
    te sathanha sikhavanu data| hara kodanda kathina jehi bhanja| tehi sameta nripa dala mada ganja ||
    khara dushana trisira aru bali| badhe sakala atulita balasali || do jake bala lavalesa tem jitehu
    caracara jhari| tasu duta maim ja kari hari anehu priya nari || || janu~ maim tumhari prabhutai| sahasabahu
    sana pari larai || samara bali sana kari jasu pava| suni kapi bacana bihasi biharava || khayu~ phala
    prabhu lagi bhu~kha| kapi subhava tem toreu~ rukha || saba kem deha parama priya svami| marahim mohi
    kumaraga gami || jinha mohi mara te maim mare| tehi para ba~dheu tanaya~ tumhare || mohi na kachu
    ba~dhe ki laja| kinha cahu~ nija prabhu kara kaja || binati karu~ jori kara ravana| sunahu mana taji
    mora sikhavana || dekhahu tumha nija kulahi bicari| bhrama taji bhajahu bhagata bhaya hari || jakem
    dara ati kala derai| jo sura asura caracara khai || tasom bayaru kabahu~ nahim kijai| more kahem janaki
    dijai || do pranatapala raghunayaka karuna sindhu kharari| ge~ sarana prabhu rakhihaim tava aparadha
    bisari || || rama carana pankaja ura dharahu| lanka acala raja tumha karahu || rishi pulista jasu
    bimala mamyaka| tehi sasi mahu~ jani hohu kalanka || rama nama binu gira na soha| dekhu bicari tyagi
    mada moha || basana hina nahim soha surari| saba bhushana bhushita bara nari || rama bimukha sampati
    prabhutai| jai rahi pai binu pai || sajala mula jinha saritanha nahim| barashi ge puni tabahim sukhahim
    || sunu dasakantha kahu~ pana ropi| bimukha rama trata nahim kopi || sankara sahasa bishnu aja tohi|
    sakahim na rakhi rama kara drohi || do mohamula bahu sula prada tyagahu tama abhimana| bhajahu rama
    raghunayaka kripa sindhu bhagavana || || jadapi kahi kapi ati hita bani| bhagati bibeka birati naya
    sani || bola bihasi maha abhimani| mila hamahi kapi gura bara gyani || mrityu nikata ai khala tohi|
    lagesi adhama sikhavana mohi || ulata hoihi kaha hanumana| matibhrama tora pragata maim jana || suni
    kapi bacana bahuta khisiana| begi na harahu~ murha kara prana || sunata nisacara marana dhae| sacivanha
    sahita bibhishanu ae| nai sisa kari binaya bahuta| niti birodha na maria duta || ana danda kachu karia
    gosa~i| sabahim kaha mantra bhala bhai || sunata bihasi bola dasakandhara| anga bhanga kari pathia
    bandara || do kapi kem mamata pu~cha para sabahi kahu~ samujhai| tela bori pata ba~dhi puni pavaka
    dehu lagai || || pu~chahina banara taha~ jaihi| taba satha nija nathahi li aihi || jinha kai kinhasi
    bahuta baraai| dekheu~ maim tinha kai prabhutai || bacana sunata kapi mana musukana| bhi sahaya sarada
    maim jana || jatudhana suni ravana bacana| lage racaim murha soi racana || raha na nagara basana ghrita
    tela| barhai pu~cha kinha kapi khela || kautuka kaha~ ae purabasi| marahim carana karahim bahu ha~si
    || bajahim dhola dehim saba tari| nagara pheri puni pu~cha prajari || pavaka jarata dekhi hanumanta|
    bhayu parama laghu rupa turanta || nibuki carhaeu kapi kanaka atarim| bhi sabhita nisacara narim ||
    do hari prerita tehi avasara cale maruta unacasa| attahasa kari garzaa kapi barhai laga akasa || ||
    deha bisala parama haruai| mandira tem mandira carha dhai || jari nagara bha loga bihala| jhapata
    lapata bahu koti karala || tata matu ha sunia pukara| ehi avasara ko hamahi ubara || hama jo kaha
    yaha kapi nahim hoi| banara rupa dharem sura koi || sadhu avagya kara phalu aisa| jari nagara anatha
    kara jaisa || jara nagaru nimisha eka mahim| eka bibhishana kara griha nahim || ta kara duta anala
    jehim sirija| jara na so tehi karana girija || ulati palati lanka saba jari| kudi para puni sindhu
    majhari || do pu~cha bujhai khoi shrama dhari laghu rupa bahori| janakasuta ke agem tharha bhayu kara
    jori || || matu mohi dije kachu cinha| jaisem raghunayaka mohi dinha || curaamani utari taba dayu|
    harasha sameta pavanasuta layu || kahehu tata asa mora pranama| saba prakara prabhu puranakama ||
    dina dayala biridu sambhari| harahu natha mama sankata bhari || tata sakrasuta katha sunaehu| bana
    pratapa prabhuhi samujhaehu || masa divasa mahu~ nathu na ava| tau puni mohi jiata nahim pava || kahu
    kapi kehi bidhi rakhaum prana| tumhahu tata kahata aba jana || tohi dekhi sitali bhi chati| puni mo
    kahu~ soi dinu so rati || do janakasutahi samujhai kari bahu bidhi dhiraju dinha| carana kamala siru
    nai kapi gavanu rama pahim kinha || || calata mahadhuni garjesi bhari| garbha stravahim suni nisicara
    nari || naghi sindhu ehi parahi ava| sabada kilakila kapinha sunava || harashe saba biloki hanumana|
    nutana janma kapinha taba jana || mukha prasanna tana teja biraja| kinhesi ramacandra kara kaja ||
    mile sakala ati bhe sukhari| talaphata mina pava jimi bari || cale harashi raghunayaka pasa| pu~chata
    kahata navala itihasa || taba madhubana bhitara saba ae| angada sammata madhu phala khae || rakhavare
    jaba barajana lage| mushti prahara hanata saba bhage || do jai pukare te saba bana ujara jubaraja|
    suni sugriva harasha kapi kari ae prabhu kaja || || jaum na hoti sita sudhi pai| madhubana ke phala
    sakahim ki khai || ehi bidhi mana bicara kara raja| ai ge kapi sahita samaja || ai sabanhi nava pada
    sisa| mileu sabanhi ati prema kapisa || pu~chi kusala kusala pada dekhi| rama kripa~ bha kaju biseshi
    || natha kaju kinheu hanumana| rakhe sakala kapinha ke prana || suni sugriva bahuri tehi mileu| kapinha
    sahita raghupati pahim caleu| rama kapinha jaba avata dekha| kie~ kaju mana harasha bisesha || phatika
    sila baithe dvau bhai| pare sakala kapi carananhi jai || do priti sahita saba bhete raghupati karuna
    punja| pu~chi kusala natha aba kusala dekhi pada kanja || || jamavanta kaha sunu raghuraya| ja para
    natha karahu tumha daya || tahi sada subha kusala nirantara| sura nara muni prasanna ta upara || soi
    biji bini guna sagara| tasu sujasu treloka ujagara || prabhu kim kripa bhayu sabu kaju| janma hamara
    suphala bha aju || natha pavanasuta kinhi jo karani| sahasahu~ mukha na jai so barani || pavanatanaya
    ke carita suhae| jamavanta raghupatihi sunae || sunata kripanidhi mana ati bhae| puni hanumana harashi
    hiya~ lae || kahahu tata kehi bha~ti janaki| rahati karati raccha svaprana ki || do nama paharu divasa
    nisi dhyana tumhara kapata| locana nija pada jantrita jahim prana kehim bata || || calata mohi curaamani
    dinhi| raghupati hridaya~ lai soi linhi || natha jugala locana bhari bari| bacana kahe kachu janakakumari
    || anuja sameta gahehu prabhu carana| dina bandhu pranatarati harana || mana krama bacana carana anuragi|
    kehi aparadha natha haum tyagi || avaguna eka mora maim mana| bichurata prana na kinha payana || natha
    so nayananhi ko aparadha| nisarata prana karihim hathi badha || biraha agini tanu tula samira| svasa
    jari chana mahim sarira || nayana stravahi jalu nija hita lagi| jaraim na pava deha birahagi| sita
    ke ati bipati bisala| binahim kahem bhali dinadayala || do nimisha nimisha karunanidhi jahim kalapa
    sama biti| begi caliya prabhu ania bhuja bala khala dala jiti || || suni sita dukha prabhu sukha ayana|
    bhari ae jala rajiva nayana || bacana ka~ya mana mama gati jahi| sapanehu~ bujhia bipati ki tahi ||
    kaha hanumanta bipati prabhu soi| jaba tava sumirana bhajana na hoi || ketika bata prabhu jatudhana
    ki| ripuhi jiti anibi janaki || sunu kapi tohi samana upakari| nahim kau sura nara muni tanudhari
    || prati upakara karaum ka tora| sanamukha hoi na sakata mana mora || sunu suta urina maim nahim|
    dekheu~ kari bicara mana mahim || puni puni kapihi citava suratrata| locana nira pulaka ati gata ||
    do suni prabhu bacana biloki mukha gata harashi hanumanta| carana pareu premakula trahi trahi bhagavanta
    || || bara bara prabhu cahi uthava| prema magana tehi uthaba na bhava || prabhu kara pankaja kapi
    kem sisa| sumiri so dasa magana gaurisa || savadhana mana kari puni sankara| lage kahana katha ati
    sundara || kapi uthai prabhu hridaya~ lagava| kara gahi parama nikata baithava || kahu kapi ravana
    palita lanka| kehi bidhi daheu durga ati banka || prabhu prasanna jana hanumana| bola bacana bigata
    abhimana || sakhamriga ke barai manusai| sakha tem sakha para jai || naghi sindhu hatakapura jara|
    nisicara gana bidhi bipina ujara| so saba tava pratapa raghurai| natha na kachu mori prabhutai ||
    do ta kahu~ prabhu kachu agama nahim ja para tumha anukula| taba prabhava~ baravanalahim jari saki
    khalu tula || || natha bhagati ati sukhadayani| dehu kripa kari anapayani || suni prabhu parama sarala
    kapi bani| evamastu taba kaheu bhavani || uma rama subhau jehim jana| tahi bhajanu taji bhava na ana
    || yaha samvada jasu ura ava| raghupati carana bhagati soi pava || suni prabhu bacana kahahim kapibrinda|
    jaya jaya jaya kripala sukhakanda || taba raghupati kapipatihi bolava| kaha calaim kara karahu banava
    || aba bilambu kehi karana kije| turata kapinha kahu~ ayasu dije || kautuka dekhi sumana bahu barashi|
    nabha tem bhavana cale sura harashi || do kapipati begi bolae ae juthapa jutha| nana barana atula
    bala banara bhalu barutha || || prabhu pada pankaja navahim sisa| garajahim bhalu mahabala kisa ||
    dekhi rama sakala kapi sena| citi kripa kari rajiva naina || rama kripa bala pai kapinda| bhe pacchajuta
    manahu~ girinda || harashi rama taba kinha payana| saguna bhe sundara subha nana || jasu sakala mangalamaya
    kiti| tasu payana saguna yaha niti || prabhu payana jana baidehim| pharaki bama a~ga janu kahi dehim
    || joi joi saguna janakihi hoi| asaguna bhayu ravanahi soi || cala kataku ko baranaim para| garjahi
    banara bhalu apara || nakha ayudha giri padapadhari| cale gagana mahi icchacari || keharinada bhalu
    kapi karahim| dagamagahim diggaja cikkarahim || cham cikkarahim diggaja dola mahi giri lola sagara
    kharabhare| mana harasha sabha gandharba sura muni naga kinnara dukha tare || katakatahim markata
    bikata bhata bahu koti kotinha dhavahim| jaya rama prabala pratapa kosalanatha guna gana gavahim ||
    || sahi saka na bhara udara ahipati bara barahim mohi| gaha dasana puni puni kamatha prishta kathora
    so kimi sohi || raghubira rucira prayana prasthiti jani parama suhavani| janu kamatha kharpara sarparaja
    so likhata abicala pavani || ehi bidhi jai kripanidhi utare sagara tira| jaha~ taha~ lage khana phala
    bhalu bipula kapi bira || || uha~ nisacara rahahim sasanka| jaba te jari gayu kapi lanka || nija nija
    griha~ saba karahim bicara| nahim nisicara kula kera ubara || jasu duta bala barani na jai| tehi ae~
    pura kavana bhalai || dutanhi sana suni purajana bani| mandodari adhika akulani || rahasi jori kara
    pati paga lagi| boli bacana niti rasa pagi || kanta karasha hari sana pariharahu| mora kaha ati hita
    hiya~ dharahu || samujhata jasu duta ki karani| stravahim garbha rajanicara dharani || tasu nari nija
    saciva bolai| pathavahu kanta jo cahahu bhalai || taba kula kamala bipina dukhadai| sita sita nisa
    sama ai || sunahu natha sita binu dinhem| hita na tumhara sambhu aja kinhem || do rama bana ahi gana
    sarisa nikara nisacara bheka| jaba lagi grasata na taba lagi jatanu karahu taji teka || || shravana
    suni satha ta kari bani| bihasa jagata bidita abhimani || sabhaya subhau nari kara saca| mangala mahu~
    bhaya mana ati kaca || jaum avi markata katakai| jiahim bicare nisicara khai || kampahim lokapa jaki
    trasa| tasu nari sabhita barai hasa || asa kahi bihasi tahi ura lai| caleu sabha~ mamata adhikai ||
    mandodari hridaya~ kara cinta| bhayu kanta para bidhi biparita || baitheu sabha~ khabari asi pai|
    sindhu para sena saba ai || bujhesi saciva ucita mata kahahu| te saba ha~se mashta kari rahahu ||
    jitehu surasura taba shrama nahim| nara banara kehi lekhe mahi || do saciva baida gura tini jaum priya
    bolahim bhaya asa| raja dharma tana tini kara hoi begihim nasa || || soi ravana kahu~ bani sahai|
    astuti karahim sunai sunai || avasara jani bibhishanu ava| bhrata carana sisu tehim nava || puni siru
    nai baitha nija asana| bola bacana pai anusasana || jau kripala pu~chihu mohi bata| mati anurupa kahu~
    hita tata || jo apana cahai kalyana| sujasu sumati subha gati sukha nana || so paranari lilara gosaim|
    taju cuthi ke canda ki nai || caudaha bhuvana eka pati hoi| bhutadroha tishti nahim soi || guna sagara
    nagara nara jou| alapa lobha bhala kahi na kou || do kama krodha mada lobha saba natha naraka ke pantha|
    saba parihari raghubirahi bhajahu bhajahim jehi santa || || tata rama nahim nara bhupala| bhuvanesvara
    kalahu kara kala || brahma anamaya aja bhagavanta| byapaka ajita anadi ananta || go dvija dhenu deva
    hitakari| kripasindhu manusha tanudhari || jana ranjana bhanjana khala brata| beda dharma racchaka
    sunu bhrata || tahi bayaru taji naia matha| pranatarati bhanjana raghunatha || dehu natha prabhu kahu~
    baidehi| bhajahu rama binu hetu sanehi || sarana ge~ prabhu tahu na tyaga| bisva droha krita agha
    jehi laga || jasu nama traya tapa nasavana| soi prabhu pragata samujhu jiya~ ravana || do bara bara
    pada lagu~ binaya karu~ dasasisa| parihari mana moha mada bhajahu kosaladhisa || || muni pulasti nija
    sishya sana kahi pathi yaha bata| turata so maim prabhu sana kahi pai suavasaru tata || || malyavanta
    ati saciva sayana| tasu bacana suni ati sukha mana || tata anuja tava niti bibhushana| so ura dharahu
    jo kahata bibhishana || ripu utakarasha kahata satha dou| duri na karahu iha~ hi kou || malyavanta
    griha gayu bahori| kahi bibhishanu puni kara jori || sumati kumati saba kem ura rahahim| natha purana
    nigama asa kahahim || jaha~ sumati taha~ sampati nana| jaha~ kumati taha~ bipati nidana || tava ura
    kumati basi biparita| hita anahita manahu ripu prita || kalarati nisicara kula keri| tehi sita para
    priti ghaneri || do tata carana gahi magu~ rakhahu mora dulara| sita dehu rama kahu~ ahita na hoi
    tumhara || || budha purana shruti sammata bani| kahi bibhishana niti bakhani || sunata dasanana utha
    risai| khala tohi nikata mutyu aba ai || jiasi sada satha mora jiava| ripu kara paccha murha tohi
    bhava || kahasi na khala asa ko jaga mahim| bhuja bala jahi jita maim nahi || mama pura basi tapasinha
    para priti| satha milu jai tinhahi kahu niti || asa kahi kinhesi carana prahara| anuja gahe pada barahim
    bara || uma santa ki ihi baraai| manda karata jo kari bhalai || tumha pitu sarisa bhalehim mohi mara|
    ramu bhajem hita natha tumhara || saciva sanga lai nabha patha gayu| sabahi sunai kahata asa bhayu
    || do ramu satyasankalpa prabhu sabha kalabasa tori| mai raghubira sarana aba jau~ dehu jani khori
    || || asa kahi cala bibhishanu jabahim| ayuhina bhe saba tabahim || sadhu avagya turata bhavani| kara
    kalyana akhila kai hani || ravana jabahim bibhishana tyaga| bhayu bibhava binu tabahim abhaga || caleu
    harashi raghunayaka pahim| karata manoratha bahu mana mahim || dekhihu~ jai carana jalajata| aruna
    mridula sevaka sukhadata || je pada parasi tari rishinari| dandaka kanana pavanakari || je pada janakasuta~
    ura lae| kapata kuranga sanga dhara dhae || hara ura sara saroja pada jei| ahobhagya mai dekhihu~
    tei || do jinha payanha ke padukanhi bharatu rahe mana lai| te pada aju bilokihu~ inha nayananhi aba
    jai || || ehi bidhi karata saprema bicara| ayu sapadi sindhu ehim para || kapinha bibhishanu avata
    dekha| jana kau ripu duta bisesha || tahi rakhi kapisa pahim ae| samacara saba tahi sunae || kaha
    sugriva sunahu raghurai| ava milana dasanana bhai || kaha prabhu sakha bujhiai kaha| kahi kapisa sunahu
    naranaha || jani na jai nisacara maya| kamarupa kehi karana aya || bheda hamara lena satha ava| rakhia
    ba~dhi mohi asa bhava || sakha niti tumha niki bicari| mama pana saranagata bhayahari || suni prabhu
    bacana harasha hanumana| saranagata bacchala bhagavana || do saranagata kahu~ je tajahim nija anahita
    anumani| te nara pava~ra papamaya tinhahi bilokata hani || || koti bipra badha lagahim jahu| ae~ sarana
    taju~ nahim tahu || sanamukha hoi jiva mohi jabahim| janma koti agha nasahim tabahim || papavanta
    kara sahaja subh | bhajanu mora tehi bhava na k || jaum pai dushtahridaya soi hoi| morem sanamukha
    ava ki soi || nirmala mana jana so mohi pava| mohi kapata chala chidra na bhava || bheda lena pathava
    dasasisa| tabahu~ na kachu bhaya hani kapisa || jaga mahu~ sakha nisacara jete| lachimanu hani nimisha
    mahu~ tete || jaum sabhita ava saranai| rakhihu~ tahi prana ki nai || do ubhaya bha~ti tehi anahu
    ha~si kaha kripaniketa| jaya kripala kahi cale angada hanu sameta || || sadara tehi agem kari banara|
    cale jaha~ raghupati karunakara || durihi te dekhe dvau bhrata| nayanananda dana ke data || bahuri
    rama chabidhama biloki| raheu thatuki ekataka pala roki || bhuja pralamba kanjaruna locana| syamala
    gata pranata bhaya mocana || singha kandha ayata ura soha| anana amita madana mana moha || nayana
    nira pulakita ati gata| mana dhari dhira kahi mridu bata || natha dasanana kara maim bhrata| nisicara
    bamsa janama suratrata || sahaja papapriya tamasa deha| jatha ulukahi tama para neha || do shravana
    sujasu suni ayu~ prabhu bhanjana bhava bhira| trahi trahi arati harana sarana sukhada raghubira ||
    || asa kahi karata dandavata dekha| turata uthe prabhu harasha bisesha || dina bacana suni prabhu
    mana bhava| bhuja bisala gahi hridaya~ lagava || anuja sahita mili dhiga baithari| bole bacana bhagata
    bhayahari || kahu lankesa sahita parivara| kusala kuthahara basa tumhara || khala mandalim basahu
    dinu rati| sakha dharama nibahi kehi bha~ti || maim janu~ tumhari saba riti| ati naya nipuna na bhava
    aniti || baru bhala basa naraka kara tata| dushta sanga jani dei bidhata || aba pada dekhi kusala
    raghuraya| jaum tumha kinha jani jana daya || do taba lagi kusala na jiva kahu~ sapanehu~ mana bishrama|
    jaba lagi bhajata na rama kahu~ soka dhama taji kama || || taba lagi hridaya~ basata khala nana| lobha
    moha macchara mada mana || jaba lagi ura na basata raghunatha| dharem capa sayaka kati bhatha || mamata
    taruna tami a~dhiari| raga dvesha uluka sukhakari || taba lagi basati jiva mana mahim| jaba lagi prabhu
    pratapa rabi nahim || aba maim kusala mite bhaya bhare| dekhi rama pada kamala tumhare || tumha kripala
    ja para anukula| tahi na byapa tribidha bhava sula || maim nisicara ati adhama subh | subha acaranu
    kinha nahim k || jasu rupa muni dhyana na ava| tehim prabhu harashi hridaya~ mohi lava || do ahobhagya
    mama amita ati rama kripa sukha punja| dekheu~ nayana biranci siba sebya jugala pada kanja || || sunahu
    sakha nija kahu~ subh | jana bhusundi sambhu girij || jaum nara hoi caracara drohi| ave sabhaya sarana
    taki mohi || taji mada moha kapata chala nana| karu~ sadya tehi sadhu samana || janani janaka bandhu
    suta dara| tanu dhanu bhavana suhrada parivara || saba kai mamata taga batori| mama pada manahi ba~dha
    bari dori || samadarasi iccha kachu nahim| harasha soka bhaya nahim mana mahim || asa sajjana mama
    ura basa kaisem| lobhi hridaya~ basi dhanu jaisem || tumha sarikhe santa priya morem| dharu~ deha
    nahim ana nihorem || do saguna upasaka parahita nirata niti drirha nema| te nara prana samana mama
    jinha kem dvija pada prema || || sunu lankesa sakala guna torem| tatem tumha atisaya priya morem ||
    rama bacana suni banara jutha| sakala kahahim jaya kripa barutha || sunata bibhishanu prabhu kai bani|
    nahim aghata shravanamrita jani || pada ambuja gahi barahim bara| hridaya~ samata na premu apara ||
    sunahu deva sacaracara svami| pranatapala ura antarajami || ura kachu prathama basana rahi| prabhu
    pada priti sarita so bahi || aba kripala nija bhagati pavani| dehu sada siva mana bhavani || evamastu
    kahi prabhu ranadhira| maga turata sindhu kara nira || jadapi sakha tava iccha nahim| mora darasu
    amogha jaga mahim || asa kahi rama tilaka tehi sara| sumana brishti nabha bhi apara || do ravana krodha
    anala nija svasa samira pracanda| jarata bibhishanu rakheu dinhehu raju akhanda || || jo sampati siva
    ravanahi dinhi die~ dasa matha| soi sampada bibhishanahi sakuci dinha raghunatha || || asa prabhu
    charai bhajahim je ana| te nara pasu binu pu~cha bishana || nija jana jani tahi apanava| prabhu subhava
    kapi kula mana bhava || puni sarbagya sarba ura basi| sarbarupa saba rahita udasi || bole bacana niti
    pratipalaka| karana manuja danuja kula ghalaka || sunu kapisa lankapati bira| kehi bidhi taria jaladhi
    gambhira || sankula makara uraga jhasha jati| ati agadha dustara saba bha~ti || kaha lankesa sunahu
    raghunayaka| koti sindhu soshaka tava sayaka || jadyapi tadapi niti asi gai| binaya karia sagara sana
    jai || do prabhu tumhara kulagura jaladhi kahihi upaya bicari| binu prayasa sagara tarihi sakala bhalu
    kapi dhari || || sakha kahi tumha niki upai| karia daiva jaum hoi sahai || mantra na yaha lachimana
    mana bhava| rama bacana suni ati dukha pava || natha daiva kara kavana bharosa| soshia sindhu karia
    mana rosa || kadara mana kahu~ eka adhara| daiva daiva alasi pukara || sunata bihasi bole raghubira|
    aisehim karaba dharahu mana dhira || asa kahi prabhu anujahi samujhai| sindhu samipa ge raghurai ||
    prathama pranama kinha siru nai| baithe puni tata darbha dasai || jabahim bibhishana prabhu pahim
    ae| pachem ravana duta pathae || do sakala carita tinha dekhe dharem kapata kapi deha| prabhu guna
    hridaya~ sarahahim saranagata para neha || || pragata bakhanahim rama subh | ati saprema ga bisari
    dur || ripu ke duta kapinha taba jane| sakala ba~dhi kapisa pahim ane || kaha sugriva sunahu saba
    banara| anga bhanga kari pathavahu nisicara || suni sugriva bacana kapi dhae| ba~dhi kataka cahu pasa
    phirae || bahu prakara marana kapi lage| dina pukarata tadapi na tyage || jo hamara hara nasa kana|
    tehi kosaladhisa kai ana || suni lachimana saba nikata bolae| daya lagi ha~si turata chodae || ravana
    kara dijahu yaha pati| lachimana bacana bacu kulaghati || do kahehu mukhagara murha sana mama sandesu
    udara| sita dei milehu na ta ava kala tumhara || || turata nai lachimana pada matha| cale duta baranata
    guna gatha || kahata rama jasu lanka~ ae| ravana carana sisa tinha nae || bihasi dasanana pu~chi bata|
    kahasi na suka apani kusalata || puni kahu khabari bibhishana keri| jahi mrityu ai ati neri || karata
    raja lanka satha tyagi| hoihi jaba kara kita abhagi || puni kahu bhalu kisa katakai| kathina kala
    prerita cali ai || jinha ke jivana kara rakhavara| bhayu mridula cita sindhu bicara || kahu tapasinha
    kai bata bahori| jinha ke hridaya~ trasa ati mori || do ki bhi bhenta ki phiri ge shravana sujasu
    suni mora| kahasi na ripu dala teja bala bahuta cakita cita tora || || natha kripa kari pu~chehu jaisem|
    manahu kaha krodha taji taisem || mila jai jaba anuja tumhara| jatahim rama tilaka tehi sara || ravana
    duta hamahi suni kana| kapinha ba~dhi dinhe dukha nana || shravana nasika katai lage| rama sapatha
    dinhe hama tyage || pu~chihu natha rama katakai| badana koti sata barani na jai || nana barana bhalu
    kapi dhari| bikatanana bisala bhayakari || jehim pura daheu hateu suta tora| sakala kapinha maha~
    tehi balu thora || amita nama bhata kathina karala| amita naga bala bipula bisala || do dvibida mayanda
    nila nala angada gada bikatasi| dadhimukha kehari nisatha satha jamavanta balarasi || || e kapi saba
    sugriva samana| inha sama kotinha gani ko nana || rama kripa~ atulita bala tinhahim| trina samana
    trelokahi ganahim || asa maim suna shravana dasakandhara| paduma atharaha juthapa bandara || natha
    kataka maha~ so kapi nahim| jo na tumhahi jitai rana mahim || parama krodha mijahim saba hatha| ayasu
    pai na dehim raghunatha || soshahim sindhu sahita jhasha byala| purahim na ta bhari kudhara bisala
    || mardi garda milavahim dasasisa| aisei bacana kahahim saba kisa || garjahim tarjahim sahaja asanka|
    manahu grasana cahata hahim lanka || do sahaja sura kapi bhalu saba puni sira para prabhu rama| ravana
    kala koti kahu jiti sakahim sangrama || || rama teja bala budhi bipulai| taba bhratahi pu~cheu naya
    nagara || tasu bacana suni sagara pahim| magata pantha kripa mana mahim || sunata bacana bihasa dasasisa|
    jaum asi mati sahaya krita kisa || sahaja bhiru kara bacana drirhaai| sagara sana thani macalai ||
    murha mrisha ka karasi baraai| ripu bala buddhi thaha maim pai || saciva sabhita bibhishana jakem|
    bijaya bibhuti kaha~ jaga takem || suni khala bacana duta risa barhai| samaya bicari patrika karhai
    || ramanuja dinhi yaha pati| natha bacai juraavahu chati || bihasi bama kara linhi ravana| saciva
    boli satha laga bacavana || do batanha manahi rijhai satha jani ghalasi kula khisa| rama birodha na
    ubarasi sarana bishnu aja isa || || ki taji mana anuja iva prabhu pada pankaja bhringa| hohi ki rama
    saranala khala kula sahita patanga || || sunata sabhaya mana mukha musukai| kahata dasanana sabahi
    sunai || bhumi para kara gahata akasa| laghu tapasa kara baga bilasa || kaha suka natha satya saba
    bani| samujhahu charai prakriti abhimani || sunahu bacana mama parihari krodha| natha rama sana tajahu
    birodha || ati komala raghubira subh | jadyapi akhila loka kara r || milata kripa tumha para prabhu
    karihi| ura aparadha na eku dharihi || janakasuta raghunathahi dije| etana kaha mora prabhu kije|
    jaba tehim kaha dena baidehi| carana prahara kinha satha tehi || nai carana siru cala so taha~| kripasindhu
    raghunayaka jaha~ || kari pranamu nija katha sunai| rama kripa~ apani gati pai || rishi agasti kim
    sapa bhavani| rachasa bhayu raha muni gyani || bandi rama pada barahim bara| muni nija ashrama kahu~
    pagu dhara || do binaya na manata jaladhi jara ge tina dina biti| bole rama sakopa taba bhaya binu
    hoi na priti || || lachimana bana sarasana anu| soshaum baridhi bisikha krisanu || satha sana binaya
    kutila sana priti| sahaja kripana sana sundara niti || mamata rata sana gyana kahani| ati lobhi sana
    birati bakhani || krodhihi sama kamihi hari katha| usara bija be~ phala jatha || asa kahi raghupati
    capa carhaava| yaha mata lachimana ke mana bhava || sanghaneu prabhu bisikha karala| uthi udadhi ura
    antara jvala || makara uraga jhasha gana akulane| jarata jantu jalanidhi jaba jane || kanaka thara
    bhari mani gana nana| bipra rupa ayu taji mana || do katehim pi kadari phari koti jatana kau sinca|
    binaya na mana khagesa sunu datehim pi nava nica || || sabhaya sindhu gahi pada prabhu kere| chamahu
    natha saba avaguna mere || gagana samira anala jala dharani| inha ki natha sahaja jara karani || tava
    prerita maya~ upajae| srishti hetu saba granthani gae || prabhu ayasu jehi kaha~ jasa ahi| so tehi
    bha~ti rahe sukha lahi || prabhu bhala kinhi mohi sikha dinhi| marajada puni tumhari kinhi || dhola
    gava~ra sudra pasu nari| sakala tarana ke adhikari || prabhu pratapa maim jaba sukhai| utarihi kataku
    na mori baraai || prabhu agya apela shruti gai| karaum so begi jau tumhahi sohai || do sunata binita
    bacana ati kaha kripala musukai| jehi bidhi utarai kapi kataku tata so kahahu upai || || natha nila
    nala kapi dvau bhai| larikai rishi asisha pai || tinha ke parasa kie~ giri bhare| tarihahim jaladhi
    pratapa tumhare || maim puni ura dhari prabhutai| karihu~ bala anumana sahai || ehi bidhi natha payodhi
    ba~dhaia| jehim yaha sujasu loka tihu~ gaia || ehi sara mama uttara tata basi| hatahu natha khala
    nara agha rasi || suni kripala sagara mana pira| turatahim hari rama ranadhira || dekhi rama bala
    paurusha bhari| harashi payonidhi bhayu sukhari || sakala carita kahi prabhuhi sunava| carana bandi
    pathodhi sidhava || cham nija bhavana gavaneu sindhu shriraghupatihi yaha mata bhayu| yaha carita
    kali malahara jathamati dasa tulasi gayu || sukha bhavana samsaya samana davana bishada raghupati
    guna gana || taji sakala asa bharosa gavahi sunahi santata satha mana || do sakala sumangala dayaka
    raghunayaka guna gana| sadara sunahim te tarahim bhava sindhu bina jalajana || caubisava~ vishrama
    iti shrimadramacaritamanase sakalakalikalushavidhvamsane pancamah sopanah samaptah |
  devanagari: श्रीजानकीवल्लभो विजयते श्रीरामचरितमानस पञ्चम सोपान शान्तं शाश्वतमप्रमेयमनघं निर्वाणशान्तिप्रदं
    ब्रह्माशम्भुफणीन्द्रसेव्यमनिशं वेदान्तवेद्यं विभुम् । रामाख्यं जगदीश्वरं सुरगुरुं मायामनुष्यं हरिं
    वन्देऽहं करुणाकरं रघुवरं भूपालचूड़आमणिम् ॥ ॥ नान्या स्पृहा रघुपते हृदयेऽस्मदीये सत्यं वदामि च भवानखिलान्तरात्मा।
    भक्तिं प्रयच्छ रघुपुङ्गव निर्भरां मे कामादिदोषरहितं कुरु मानसं च ॥ ॥ अतुलितबलधामं हेमशैलाभदेहं दनुजवनकृशानुं
    ज्ञानिनामग्रगण्यम्। सकलगुणनिधानं वानराणामधीशं रघुपतिप्रियभक्तं वातजातं नमामि ॥ ॥ जामवन्त के बचन सुहाए।
    सुनि हनुमन्त हृदय अति भाए ॥ तब लगि मोहि परिखेहु तुम्ह भाई। सहि दुख कन्द मूल फल खाई ॥ जब लगि आवौं सीतहि
    देखी। होइहि काजु मोहि हरष बिसेषी ॥ यह कहि नाइ सबन्हि कहुँ माथा। चलेउ हरषि हियँ धरि रघुनाथा ॥ सिन्धु
    तीर एक भूधर सुन्दर। कौतुक कूदि चढ़एउ ता ऊपर ॥ बार बार रघुबीर सँभारी। तरकेउ पवनतनय बल भारी ॥ जेहिं
    गिरि चरन देइ हनुमन्ता। चलेउ सो गा पाताल तुरन्ता ॥ जिमि अमोघ रघुपति कर बाना। एही भाँति चलेउ हनुमाना
    ॥ जलनिधि रघुपति दूत बिचारी। तैं मैनाक होहि श्रमहारी ॥ दो हनूमान तेहि परसा कर पुनि कीन्ह प्रनाम। राम
    काजु कीन्हें बिनु मोहि कहाँ बिश्राम ॥ ॥ जात पवनसुत देवन्ह देखा। जानैं कहुँ बल बुद्धि बिसेषा ॥ सुरसा
    नाम अहिन्ह कै माता। पठिन्हि आइ कही तेहिं बाता ॥ आजु सुरन्ह मोहि दीन्ह अहारा। सुनत बचन कह पवनकुमारा
    ॥ राम काजु करि फिरि मैं आवौं। सीता कि सुधि प्रभुहि सुनावौम् ॥ तब तव बदन पैठिहुँ आई। सत्य कहुँ मोहि
    जान दे माई ॥ कबनेहुँ जतन देइ नहिं जाना। ग्रससि न मोहि कहेउ हनुमाना ॥ जोजन भरि तेहिं बदनु पसारा। कपि
    तनु कीन्ह दुगुन बिस्तारा ॥ सोरह जोजन मुख तेहिं ठयू। तुरत पवनसुत बत्तिस भयू ॥ जस जस सुरसा बदनु बढ़आवा।
    तासु दून कपि रूप देखावा ॥ सत जोजन तेहिं आनन कीन्हा। अति लघु रूप पवनसुत लीन्हा ॥ बदन पिठि पुनि बाहेर
    आवा। मागा बिदा ताहि सिरु नावा ॥ मोहि सुरन्ह जेहि लागि पठावा। बुधि बल मरमु तोर मै पावा ॥ दो राम काजु
    सबु करिहहु तुम्ह बल बुद्धि निधान। आसिष देह गी सो हरषि चलेउ हनुमान ॥ ॥ निसिचरि एक सिन्धु महुँ रही।
    करि माया नभु के खग गही ॥ जीव जन्तु जे गगन उड़आहीं। जल बिलोकि तिन्ह कै परिछाहीम् ॥ गहि छाहँ सक सो न
    उड़आई। एहि बिधि सदा गगनचर खाई ॥ सोइ छल हनूमान कहँ कीन्हा। तासु कपटु कपि तुरतहिं चीन्हा ॥ ताहि मारि
    मारुतसुत बीरा। बारिधि पार गयु मतिधीरा ॥ तहाँ जाइ देखी बन सोभा। गुञ्जत चञ्चरीक मधु लोभा ॥ नाना तरु
    फल फूल सुहाए। खग मृग बृन्द देखि मन भाए ॥ सैल बिसाल देखि एक आगें। ता पर धाइ चढेउ भय त्यागेम् ॥ उमा
    न कछु कपि कै अधिकाई। प्रभु प्रताप जो कालहि खाई ॥ गिरि पर चढि लङ्का तेहिं देखी। कहि न जाइ अति दुर्ग
    बिसेषी ॥ अति उतङ्ग जलनिधि चहु पासा। कनक कोट कर परम प्रकासा ॥ छं कनक कोट बिचित्र मनि कृत सुन्दरायतना
    घना। चुहट्ट हट्ट सुबट्ट बीथीं चारु पुर बहु बिधि बना ॥ गज बाजि खच्चर निकर पदचर रथ बरूथिन्ह को गनै ॥
    बहुरूप निसिचर जूथ अतिबल सेन बरनत नहिं बनै ॥ ॥ बन बाग उपबन बाटिका सर कूप बापीं सोहहीं। नर नाग सुर गन्धर्ब
    कन्या रूप मुनि मन मोहहीम् ॥ कहुँ माल देह बिसाल सैल समान अतिबल गर्जहीं। नाना अखारेन्ह भिरहिं बहु बिधि
    एक एकन्ह तर्जहीम् ॥ ॥ करि जतन भट कोटिन्ह बिकट तन नगर चहुँ दिसि रच्छहीं। कहुँ महिष मानषु धेनु खर अज
    खल निसाचर भच्छहीम् ॥ एहि लागि तुलसीदास इन्ह की कथा कछु एक है कही। रघुबीर सर तीरथ सरीरन्हि त्यागि गति
    पैहहिं सही ॥ पुर रखवारे देखि बहु कपि मन कीन्ह बिचार। अति लघु रूप धरौं निसि नगर करौं पिसार ॥ ॥ मसक
    समान रूप कपि धरी। लङ्कहि चलेउ सुमिरि नरहरी ॥ नाम लङ्किनी एक निसिचरी। सो कह चलेसि मोहि निन्दरी ॥ जानेहि
    नहीं मरमु सठ मोरा। मोर अहार जहाँ लगि चोरा ॥ मुठिका एक महा कपि हनी। रुधिर बमत धरनीं ढनमनी ॥ पुनि सम्भारि
    उठि सो लङ्का। जोरि पानि कर बिनय संसका ॥ जब रावनहि ब्रह्म बर दीन्हा। चलत बिरञ्चि कहा मोहि चीन्हा ॥
    बिकल होसि तैं कपि कें मारे। तब जानेसु निसिचर सङ्घारे ॥ तात मोर अति पुन्य बहूता। देखेउँ नयन राम कर
    दूता ॥ दो तात स्वर्ग अपबर्ग सुख धरिअ तुला एक अङ्ग। तूल न ताहि सकल मिलि जो सुख लव सतसङ्ग ॥ ॥ प्रबिसि
    नगर कीजे सब काजा। हृदयँ राखि कौसलपुर राजा ॥ गरल सुधा रिपु करहिं मिताई। गोपद सिन्धु अनल सितलाई ॥ गरुड़
    सुमेरु रेनू सम ताही। राम कृपा करि चितवा जाही ॥ अति लघु रूप धरेउ हनुमाना। पैठा नगर सुमिरि भगवाना ॥
    मन्दिर मन्दिर प्रति करि सोधा। देखे जहँ तहँ अगनित जोधा ॥ गयु दसानन मन्दिर माहीं। अति बिचित्र कहि जात
    सो नाहीम् ॥ सयन किए देखा कपि तेही। मन्दिर महुँ न दीखि बैदेही ॥ भवन एक पुनि दीख सुहावा। हरि मन्दिर
    तहँ भिन्न बनावा ॥ दो रामायुध अङ्कित गृह सोभा बरनि न जाइ। नव तुलसिका बृन्द तहँ देखि हरषि कपिराइ ॥ ॥
    लङ्का निसिचर निकर निवासा। इहाँ कहाँ सज्जन कर बासा ॥ मन महुँ तरक करै कपि लागा। तेहीं समय बिभीषनु जागा
    ॥ राम राम तेहिं सुमिरन कीन्हा। हृदयँ हरष कपि सज्जन चीन्हा ॥ एहि सन हठि करिहुँ पहिचानी। साधु ते होइ
    न कारज हानी ॥ बिप्र रुप धरि बचन सुनाए। सुनत बिभीषण उठि तहँ आए ॥ करि प्रनाम पूँछी कुसलाई। बिप्र कहहु
    निज कथा बुझाई ॥ की तुम्ह हरि दासन्ह महँ कोई। मोरें हृदय प्रीति अति होई ॥ की तुम्ह रामु दीन अनुरागी।
    आयहु मोहि करन बड़भागी ॥ दो तब हनुमन्त कही सब राम कथा निज नाम। सुनत जुगल तन पुलक मन मगन सुमिरि गुन
    ग्राम ॥ ॥ सुनहु पवनसुत रहनि हमारी। जिमि दसनन्हि महुँ जीभ बिचारी ॥ तात कबहुँ मोहि जानि अनाथा। करिहहिं
    कृपा भानुकुल नाथा ॥ तामस तनु कछु साधन नाहीं। प्रीति न पद सरोज मन माहीम् ॥ अब मोहि भा भरोस हनुमन्ता।
    बिनु हरिकृपा मिलहिं नहिं सन्ता ॥ जौ रघुबीर अनुग्रह कीन्हा। तौ तुम्ह मोहि दरसु हठि दीन्हा ॥ सुनहु बिभीषन
    प्रभु कै रीती। करहिं सदा सेवक पर प्रीती ॥ कहहु कवन मैं परम कुलीना। कपि चञ्चल सबहीं बिधि हीना ॥ प्रात
    लेइ जो नाम हमारा। तेहि दिन ताहि न मिलै अहारा ॥ दो अस मैं अधम सखा सुनु मोहू पर रघुबीर। कीन्ही कृपा
    सुमिरि गुन भरे बिलोचन नीर ॥ ॥ जानतहूँ अस स्वामि बिसारी। फिरहिं ते काहे न होहिं दुखारी ॥ एहि बिधि कहत
    राम गुन ग्रामा। पावा अनिर्बाच्य बिश्रामा ॥ पुनि सब कथा बिभीषन कही। जेहि बिधि जनकसुता तहँ रही ॥ तब
    हनुमन्त कहा सुनु भ्राता। देखी चहुँ जानकी माता ॥ जुगुति बिभीषन सकल सुनाई। चलेउ पवनसुत बिदा कराई ॥ करि
    सोइ रूप गयु पुनि तहवाँ। बन असोक सीता रह जहवाँ ॥ देखि मनहि महुँ कीन्ह प्रनामा। बैठेहिं बीति जात निसि
    जामा ॥ कृस तन सीस जटा एक बेनी। जपति हृदयँ रघुपति गुन श्रेनी ॥ दो निज पद नयन दिएँ मन राम पद कमल लीन।
    परम दुखी भा पवनसुत देखि जानकी दीन ॥ ॥ तरु पल्लव महुँ रहा लुकाई। करि बिचार करौं का भाई ॥ तेहि अवसर
    रावनु तहँ आवा। सङ्ग नारि बहु किएँ बनावा ॥ बहु बिधि खल सीतहि समुझावा। साम दान भय भेद देखावा ॥ कह रावनु
    सुनु सुमुखि सयानी। मन्दोदरी आदि सब रानी ॥ तव अनुचरीं करुँ पन मोरा। एक बार बिलोकु मम ओरा ॥ तृन धरि
    ओट कहति बैदेही। सुमिरि अवधपति परम सनेही ॥ सुनु दसमुख खद्योत प्रकासा। कबहुँ कि नलिनी करि बिकासा ॥ अस
    मन समुझु कहति जानकी। खल सुधि नहिं रघुबीर बान की ॥ सठ सूने हरि आनेहि मोहि। अधम निलज्ज लाज नहिं तोही
    ॥ दो आपुहि सुनि खद्योत सम रामहि भानु समान। परुष बचन सुनि काढ़इ असि बोला अति खिसिआन ॥ ॥ सीता तैं मम
    कृत अपमाना। कटिहुँ तव सिर कठिन कृपाना ॥ नाहिं त सपदि मानु मम बानी। सुमुखि होति न त जीवन हानी ॥ स्याम
    सरोज दाम सम सुन्दर। प्रभु भुज करि कर सम दसकन्धर ॥ सो भुज कण्ठ कि तव असि घोरा। सुनु सठ अस प्रवान पन
    मोरा ॥ चन्द्रहास हरु मम परितापं। रघुपति बिरह अनल सञ्जातम् ॥ सीतल निसित बहसि बर धारा। कह सीता हरु मम
    दुख भारा ॥ सुनत बचन पुनि मारन धावा। मयतनयाँ कहि नीति बुझावा ॥ कहेसि सकल निसिचरिन्ह बोलाई। सीतहि बहु
    बिधि त्रासहु जाई ॥ मास दिवस महुँ कहा न माना। तौ मैं मारबि काढ़इ कृपाना ॥ दो भवन गयु दसकन्धर इहाँ पिसाचिनि
    बृन्द। सीतहि त्रास देखावहि धरहिं रूप बहु मन्द ॥ ॥ त्रिजटा नाम राच्छसी एका। राम चरन रति निपुन बिबेका
    ॥ सबन्हौ बोलि सुनाएसि सपना। सीतहि सेइ करहु हित अपना ॥ सपनें बानर लङ्का जारी। जातुधान सेना सब मारी
    ॥ खर आरूढ़ नगन दससीसा। मुण्डित सिर खण्डित भुज बीसा ॥ एहि बिधि सो दच्छिन दिसि जाई। लङ्का मनहुँ बिभीषन
    पाई ॥ नगर फिरी रघुबीर दोहाई। तब प्रभु सीता बोलि पठाई ॥ यह सपना में कहुँ पुकारी। होइहि सत्य गेँ दिन
    चारी ॥ तासु बचन सुनि ते सब डरीं। जनकसुता के चरनन्हि परीम् ॥ दो जहँ तहँ गीं सकल तब सीता कर मन सोच।
    मास दिवस बीतें मोहि मारिहि निसिचर पोच ॥ ॥ त्रिजटा सन बोली कर जोरी। मातु बिपति सङ्गिनि तैं मोरी ॥ तजौं
    देह करु बेगि उपाई। दुसहु बिरहु अब नहिं सहि जाई ॥ आनि काठ रचु चिता बनाई। मातु अनल पुनि देहि लगाई ॥
    सत्य करहि मम प्रीति सयानी। सुनै को श्रवन सूल सम बानी ॥ सुनत बचन पद गहि समुझाएसि। प्रभु प्रताप बल सुजसु
    सुनाएसि ॥ निसि न अनल मिल सुनु सुकुमारी। अस कहि सो निज भवन सिधारी ॥ कह सीता बिधि भा प्रतिकूला। मिलहि
    न पावक मिटिहि न सूला ॥ देखिअत प्रगट गगन अङ्गारा। अवनि न आवत एकु तारा ॥ पावकमय ससि स्त्रवत न आगी। मानहुँ
    मोहि जानि हतभागी ॥ सुनहि बिनय मम बिटप असोका। सत्य नाम करु हरु मम सोका ॥ नूतन किसलय अनल समाना। देहि
    अगिनि जनि करहि निदाना ॥ देखि परम बिरहाकुल सीता। सो छन कपिहि कलप सम बीता ॥ सो कपि करि हृदयँ बिचार दीन्हि
    मुद्रिका डारी तब। जनु असोक अङ्गार दीन्हि हरषि उठि कर गहेउ ॥ ॥ तब देखी मुद्रिका मनोहर। राम नाम अङ्कित
    अति सुन्दर ॥ चकित चितव मुदरी पहिचानी। हरष बिषाद हृदयँ अकुलानी ॥ जीति को सकि अजय रघुराई। माया तें असि
    रचि नहिं जाई ॥ सीता मन बिचार कर नाना। मधुर बचन बोलेउ हनुमाना ॥ रामचन्द्र गुन बरनैं लागा। सुनतहिं सीता
    कर दुख भागा ॥ लागीं सुनैं श्रवन मन लाई। आदिहु तें सब कथा सुनाई ॥ श्रवनामृत जेहिं कथा सुहाई। कहि सो
    प्रगट होति किन भाई ॥ तब हनुमन्त निकट चलि गयू। फिरि बैण्ठीं मन बिसमय भयू ॥ राम दूत मैं मातु जानकी।
    सत्य सपथ करुनानिधान की ॥ यह मुद्रिका मातु मैं आनी। दीन्हि राम तुम्ह कहँ सहिदानी ॥ नर बानरहि सङ्ग कहु
    कैसें। कहि कथा भि सङ्गति जैसेम् ॥ दो कपि के बचन सप्रेम सुनि उपजा मन बिस्वास ॥ जाना मन क्रम बचन यह
    कृपासिन्धु कर दास ॥ ॥ हरिजन जानि प्रीति अति गाढ़ई। सजल नयन पुलकावलि बाढ़ई ॥ बूड़त बिरह जलधि हनुमाना।
    भयु तात मों कहुँ जलजाना ॥ अब कहु कुसल जाउँ बलिहारी। अनुज सहित सुख भवन खरारी ॥ कोमलचित कृपाल रघुराई।
    कपि केहि हेतु धरी निठुराई ॥ सहज बानि सेवक सुख दायक। कबहुँक सुरति करत रघुनायक ॥ कबहुँ नयन मम सीतल ताता।
    होइहहि निरखि स्याम मृदु गाता ॥ बचनु न आव नयन भरे बारी। अहह नाथ हौं निपट बिसारी ॥ देखि परम बिरहाकुल
    सीता। बोला कपि मृदु बचन बिनीता ॥ मातु कुसल प्रभु अनुज समेता। तव दुख दुखी सुकृपा निकेता ॥ जनि जननी
    मानहु जियँ ऊना। तुम्ह ते प्रेमु राम कें दूना ॥ दो रघुपति कर सन्देसु अब सुनु जननी धरि धीर। अस कहि कपि
    गद गद भयु भरे बिलोचन नीर ॥ ॥ कहेउ राम बियोग तव सीता। मो कहुँ सकल भे बिपरीता ॥ नव तरु किसलय मनहुँ कृसानू।
    कालनिसा सम निसि ससि भानू ॥ कुबलय बिपिन कुन्त बन सरिसा। बारिद तपत तेल जनु बरिसा ॥ जे हित रहे करत तेइ
    पीरा। उरग स्वास सम त्रिबिध समीरा ॥ कहेहू तें कछु दुख घटि होई। काहि कहौं यह जान न कोई ॥ तत्त्व प्रेम
    कर मम अरु तोरा। जानत प्रिया एकु मनु मोरा ॥ सो मनु सदा रहत तोहि पाहीं। जानु प्रीति रसु एतेनहि माहीम्
    ॥ प्रभु सन्देसु सुनत बैदेही। मगन प्रेम तन सुधि नहिं तेही ॥ कह कपि हृदयँ धीर धरु माता। सुमिरु राम सेवक
    सुखदाता ॥ उर आनहु रघुपति प्रभुताई। सुनि मम बचन तजहु कदराई ॥ दो निसिचर निकर पतङ्ग सम रघुपति बान कृसानु।
    जननी हृदयँ धीर धरु जरे निसाचर जानु ॥ ॥ जौं रघुबीर होति सुधि पाई। करते नहिं बिलम्बु रघुराई ॥ रामबान
    रबि उएँ जानकी। तम बरूथ कहँ जातुधान की ॥ अबहिं मातु मैं जाउँ लवाई। प्रभु आयसु नहिं राम दोहाई ॥ कछुक
    दिवस जननी धरु धीरा। कपिन्ह सहित ऐहहिं रघुबीरा ॥ निसिचर मारि तोहि लै जैहहिं। तिहुँ पुर नारदादि जसु
    गैहहिम् ॥ हैं सुत कपि सब तुम्हहि समाना। जातुधान अति भट बलवाना ॥ मोरें हृदय परम सन्देहा। सुनि कपि प्रगट
    कीन्ह निज देहा ॥ कनक भूधराकार सरीरा। समर भयङ्कर अतिबल बीरा ॥ सीता मन भरोस तब भयू। पुनि लघु रूप पवनसुत
    लयू ॥ दो सुनु माता साखामृग नहिं बल बुद्धि बिसाल। प्रभु प्रताप तें गरुड़हि खाइ परम लघु ब्याल ॥ ॥ मन
    सन्तोष सुनत कपि बानी। भगति प्रताप तेज बल सानी ॥ आसिष दीन्हि रामप्रिय जाना। होहु तात बल सील निधाना
    ॥ अजर अमर गुननिधि सुत होहू। करहुँ बहुत रघुनायक छोहू ॥ करहुँ कृपा प्रभु अस सुनि काना। निर्भर प्रेम
    मगन हनुमाना ॥ बार बार नाएसि पद सीसा। बोला बचन जोरि कर कीसा ॥ अब कृतकृत्य भयुँ मैं माता। आसिष तव अमोघ
    बिख्याता ॥ सुनहु मातु मोहि अतिसय भूखा। लागि देखि सुन्दर फल रूखा ॥ सुनु सुत करहिं बिपिन रखवारी। परम
    सुभट रजनीचर भारी ॥ तिन्ह कर भय माता मोहि नाहीं। जौं तुम्ह सुख मानहु मन माहीम् ॥ दो देखि बुद्धि बल
    निपुन कपि कहेउ जानकीं जाहु। रघुपति चरन हृदयँ धरि तात मधुर फल खाहु ॥ ॥ चलेउ नाइ सिरु पैठेउ बागा। फल
    खाएसि तरु तोरैं लागा ॥ रहे तहाँ बहु भट रखवारे। कछु मारेसि कछु जाइ पुकारे ॥ नाथ एक आवा कपि भारी। तेहिं
    असोक बाटिका उजारी ॥ खाएसि फल अरु बिटप उपारे। रच्छक मर्दि मर्दि महि डारे ॥ सुनि रावन पठे भट नाना। तिन्हहि
    देखि गर्जेउ हनुमाना ॥ सब रजनीचर कपि सङ्घारे। गे पुकारत कछु अधमारे ॥ पुनि पठयु तेहिं अच्छकुमारा। चला
    सङ्ग लै सुभट अपारा ॥ आवत देखि बिटप गहि तर्जा। ताहि निपाति महाधुनि गर्जा ॥ दो कछु मारेसि कछु मर्देसि
    कछु मिलेसि धरि धूरि। कछु पुनि जाइ पुकारे प्रभु मर्कट बल भूरि ॥ ॥ सुनि सुत बध लङ्केस रिसाना। पठेसि
    मेघनाद बलवाना ॥ मारसि जनि सुत बान्धेसु ताही। देखिअ कपिहि कहाँ कर आही ॥ चला इन्द्रजित अतुलित जोधा।
    बन्धु निधन सुनि उपजा क्रोधा ॥ कपि देखा दारुन भट आवा। कटकटाइ गर्जा अरु धावा ॥ अति बिसाल तरु एक उपारा।
    बिरथ कीन्ह लङ्केस कुमारा ॥ रहे महाभट ताके सङ्गा। गहि गहि कपि मर्दि निज अङ्गा ॥ तिन्हहि निपाति ताहि
    सन बाजा। भिरे जुगल मानहुँ गजराजा। मुठिका मारि चढ़आ तरु जाई। ताहि एक छन मुरुछा आई ॥ उठि बहोरि कीन्हिसि
    बहु माया। जीति न जाइ प्रभञ्जन जाया ॥ दो ब्रह्म अस्त्र तेहिं साँधा कपि मन कीन्ह बिचार। जौं न ब्रह्मसर
    मानुँ महिमा मिटि अपार ॥ ॥ ब्रह्मबान कपि कहुँ तेहि मारा। परतिहुँ बार कटकु सङ्घारा ॥ तेहि देखा कपि मुरुछित
    भयू। नागपास बाँधेसि लै गयू ॥ जासु नाम जपि सुनहु भवानी। भव बन्धन काटहिं नर ग्यानी ॥ तासु दूत कि बन्ध
    तरु आवा। प्रभु कारज लगि कपिहिं बँधावा ॥ कपि बन्धन सुनि निसिचर धाए। कौतुक लागि सभाँ सब आए ॥ दसमुख सभा
    दीखि कपि जाई। कहि न जाइ कछु अति प्रभुताई ॥ कर जोरें सुर दिसिप बिनीता। भृकुटि बिलोकत सकल सभीता ॥ देखि
    प्रताप न कपि मन सङ्का। जिमि अहिगन महुँ गरुड़ असङ्का ॥ दो कपिहि बिलोकि दसानन बिहसा कहि दुर्बाद। सुत
    बध सुरति कीन्हि पुनि उपजा हृदयँ बिषाद ॥ ॥ कह लङ्केस कवन तैं कीसा। केहिं के बल घालेहि बन खीसा ॥ की
    धौं श्रवन सुनेहि नहिं मोही। देखुँ अति असङ्क सठ तोही ॥ मारे निसिचर केहिं अपराधा। कहु सठ तोहि न प्रान
    कि बाधा ॥ सुन रावन ब्रह्माण्ड निकाया। पाइ जासु बल बिरचित माया ॥ जाकें बल बिरञ्चि हरि ईसा। पालत सृजत
    हरत दससीसा। जा बल सीस धरत सहसानन। अण्डकोस समेत गिरि कानन ॥ धरि जो बिबिध देह सुरत्राता। तुम्ह ते सठन्ह
    सिखावनु दाता। हर कोदण्ड कठिन जेहि भञ्जा। तेहि समेत नृप दल मद गञ्जा ॥ खर दूषन त्रिसिरा अरु बाली। बधे
    सकल अतुलित बलसाली ॥ दो जाके बल लवलेस तें जितेहु चराचर झारि। तासु दूत मैं जा करि हरि आनेहु प्रिय नारि
