id: nasadiya-suktam-rigvediya-sartham
category: sukta
name:
  english: nasadiya suktam (rigvediya sartham)
  devanagari: नासदीय सूक्तम् (ऋग्वेदीय सार्थम्)
content:
  english: ti̱ra̱shcino̱ vita̭to ra̱shmirḙshama̱dhah svi̭da̱si3du̱pari̭ svidasi3t | re̱to̱dha a̭sanmahi̱mana̭
    asansva̱dha a̱vasta̱tpraya̭tih pa̱rasta̭t || 5||
  devanagari: ति॒र॒श्चीनो॒ वित॑तो र॒श्मिरे॑षाम॒धः स्वि॑दा॒सी३दु॒परि॑ स्विदासी३त् । रे॒तो॒धा आ॑सन्महि॒मान॑
    आसन्स्व॒धा अ॒वस्ता॒त्प्रय॑तिः प॒रस्ता॑त् ॥ ५॥
meaning: {}
