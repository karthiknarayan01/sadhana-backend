id: suryacandrabhyamkritamvishnustotram
category: stotram
name:
  english: suryacandrabhyamkritamvishnustotram
  devanagari: सूर्यचन्द्राभ्यांकृतंविष्णुस्तोत्रम्
content:
  english: suryacandrabhyam kritam vishnustotram drishtva tatra jagannatham shankhacakragadadharam | stutim
    tau cakraturdevau candrasuryau yashasvini || 17|| namo lokatrayadhyaksha svaprabhajitabhaskara | namo
    vishno namo jishno namaste kaitabhantaka || 18|| namah sarvakriyakartre jagattratre ca te namah |
    namashcakrayudhadhrishya namo danavaghatine || 19|| namah kramatrayakrantatrailokyantarhitodbhava
    | namah pracandadaityendrakulakala mahabala || 2
  devanagari: सूर्यचन्द्राभ्यां कृतं विष्णुस्तोत्रम् दृष्ट्वा तत्र जगन्नाथं शङ्खचक्रगदाधरम् । स्तुतिं
    तौ चक्रतुर्देवौ चन्द्रसूर्यौ यशस्विनि ॥ १७॥ नमो लोकत्रयाध्यक्ष स्वप्रभाजितभास्कर । नमो विष्णो नमो
    जिष्णो नमस्ते कैटभान्तक ॥ १८॥ नमः सर्वक्रियाकर्त्रे जगत्त्रात्रे च ते नमः । नमश्चक्रायुधाधृष्य नमो
    दानवघातिने ॥ १९॥ नमः क्रमत्रयाक्रान्तत्रैलोक्यान्तर्हितोद्भव । नमः प्रचण्डदैत्येन्द्रकुलकाल महाबल
    ॥ २
meaning: {}
