id: sarasvatirahasyopanishat
category: upanishad
name:
  english: sarasvatirahasyopanishat
  devanagari: सरस्वतीरहस्योपनिषत्
content:
  english: 3 || sa hovacashvalayanah | asya shrisarasvatidashashlokimahamantrasya | ahamashvalayana rishih
    | anushtup chandah | shrivagishvari devata | yadvagiti bijam | devim vacamiti shaktih | om prano deviti
    kilakam | viniyogastatprityarthe | shraddha medha prajna dharana vagdevata mahasarasvatityetairanganyasah
    || niharaharaghanasarasudhakarabham kalyanadam kanakacampakadamabhusham | uttungapinakucakumbhamanoharangim
    vanim namami manasa vacasa vibhutyai || 1 || om prano devityasya mantrasya bharadvaja rishih | gayatri
    chandah | shrisarasvati devata | pranavena bijashaktih kilakam | ishtarthe viniyogah | mantrena nyasah
    || ya vedantarthatattvaikasvarupa paramarthatah | namarupatmana vyakta sa mam patu sarasvati || om
  devanagari: ३ ॥ स होवाचाश्वलायनः । अस्य श्रीसरस्वतीदशश्लोकीमहामन्त्रस्य । अहमाश्वलायन ऋषिः । अनुष्टुप्
    छन्दः । श्रीवागीश्वरी देवता । यद्वागिति बीजम् । देवीं वाचमिति शक्तिः । ॐ प्रणो देवीति कीलकम् । विनियोगस्तत्प्रीत्यर्थे
    । श्रद्धा मेधा प्रज्ञा धारणा वाग्देवता महासरस्वतीत्येतैरङ्गन्यासः ॥ नीहारहारघनसारसुधाकराभां कल्याणदां
    कनकचम्पकदामभूषाम् । उत्तुङ्गपीनकुचकुम्भमनोहराङ्गीं वाणीं नमामि मनसा वचसा विभूत्यै ॥ १ ॥ ॐ प्रणो देवीत्यस्य
    मन्त्रस्य भरद्वाज ऋषिः । गायत्री छन्दः । श्रीसरस्वती देवता । प्रणवेन बीजशक्तिः कीलकम् । इष्टार्थे
    विनियोगः । मन्त्रेण न्यासः ॥ या वेदान्तार्थतत्त्वैकस्वरूपा परमार्थतः । नामरूपात्मना व्यक्ता सा मां
    पातु सरस्वति ॥ ॐ
