id: shukrakritam4shivastotram
category: stotram
name:
  english: shukrakritam4shivastotram
  devanagari: शुक्रकृतं४शिवस्तोत्रम्
content:
  english: shukrakritam 4 shivastotram namo'stu brahmarupaya bhaktecchapurakaya te | namah sadyahpratushtaya
    ciratushtaya te namah || 1|| namo'stu nityatriptaya digambaraya te namah | namo bhimaya rudraya mahadevaya
    te namah || 2|| nama ugraya pinakadharine shambhave namah | mrigavyadhaya yataye kirataya ca te namah
    || 3|| namastricakshushe candrabhalaya lingarupine | sadashivaya sharvaya bhaveshaya namo namah ||
    4|| saumyaya sakshine satisvamine te namo namah | nilakanthaya candaya sadyojataya shuline || 5||
    ishanaya pishangaya carmambaraya te namah | pashunam pataye tubhyam bhutanam pataye namah || 6|| namo'shtavarshmane
    krishnanarayanatmane namah | parvatipataye prabhasvamine te namo namah || 7|| namaste sarvatah sarvadikshu
    sarvatmasu prabho | phaladayanandakartre te sarvatra namo namah || 8|| iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 407
  devanagari: शुक्रकृतं ४ शिवस्तोत्रम् नमोऽस्तु ब्रह्मरूपाय भक्तेच्छापूरकाय ते । नमः सद्यःप्रतुष्टाय चिरतुष्टाय
    ते नमः ॥ १॥ नमोऽस्तु नित्यतृप्ताय दिगम्बराय ते नमः । नमो भीमाय रुद्राय महादेवाय ते नमः ॥ २॥ नम उग्राय
    पिनाकधारिणे शम्भवे नमः । मृगव्याधाय यतये किराताय च ते नमः ॥ ३॥ नमस्त्रिचक्षुषे चन्द्रभालाय लिङ्गरूपिणे
    । सदाशिवाय शर्वाय भवेशाय नमो नमः ॥ ४॥ सौम्याय साक्षिणे सतीस्वामिने ते नमो नमः । नीलकण्ठाय चण्डाय सद्योजाताय
    शूलिने ॥ ५॥ ईशानाय पिशङ्गाय चर्माम्बराय ते नमः । पशूनां पतये तुभ्यं भूतानां पतये नमः ॥ ६॥ नमोऽष्टवर्ष्मणे
    कृष्णनारायणात्मने नमः । पार्वतीपतये प्रभास्वामिने ते नमो नमः ॥ ७॥ नमस्ते सर्वतः सर्वदिक्षु सर्वात्मसु
    प्रभो । फलदायानन्दकर्त्रे ते सर्वत्र नमो नमः ॥ ८॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने
    ४०७
