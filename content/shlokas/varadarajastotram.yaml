id: varadarajastotram
category: stotram
name:
  english: varadarajastotram
  devanagari: वरदराजस्तोत्रम्
content:
  english: shrimadvaradarajendrah shrivatsankah shubhapradah | tundiramandalollasi tapatrayanivarakah
    || 1|| satyavratakshetravasi satyavajjanaposhakah | sargasthityupasamharakari sugunavaridhih || 2||
    harirhastagirishano hritapranatadushkritah | tattvarupatvashtrikritakancipuravarashritah || 3|| brahmarabdhashvamedhakhyamahamakhasupujitah
    | vedavedyo vegavativegabhitatmabhustutah || 4|| vishvaseturvegavatiseturvishvartiko'naghah | yathoktakarinamadhyo
    yajnabhridyajnarakshakah || 5|| brahmakundotpannadivyapunyakotivimanagah | vanipatyarpitahayavapasurabhiladharah
    || 6|| varadabhayahastabjo vanamalavirajitah | shankhacakralasatpanishsharanagatarakshakah || 7||
    imam stavam tu papaghnam purusharthapradayakam | pathatam sha
  devanagari: श्रीमद्वरदराजेन्द्रः श्रीवत्साङ्कः शुभप्रदः । तुण्डीरमण्डलोल्लासी तापत्रयनिवारकः ॥ १॥ सत्यव्रतक्षेत्रवासी
    सत्यवज्जनपोषकः । सर्गस्थित्युपसंहारकारी सुगुणवारिधिः ॥ २॥ हरिर्हस्तगिरीशानो हृतप्रणतदुष्कृतः । तत्त्वरूपत्वष्टृकृतकाञ्चीपुरवराश्रितः
    ॥ ३॥ ब्रह्मारब्धाश्वमेधाख्यमहामखसुपूजितः । वेदवेद्यो वेगवतीवेगभीतात्मभूस्तुतः ॥ ४॥ विश्वसेतुर्वेगवतीसेतुर्विश्वार्तिकोऽनघः
    । यथोक्तकारिनामाढ्यो यज्ञभृद्यज्ञरक्षकः ॥ ५॥ ब्रह्मकुण्डोत्पन्नदिव्यपुण्यकोटिविमानगः । वाणीपत्यर्पितहयवपासुरभिलाधरः
    ॥ ६॥ वरदाभयहस्ताब्जो वनमालाविराजितः । शङ्खचक्रलसत्पाणिश्शरणागतरक्षकः ॥ ७॥ इमं स्तवं तु पापघ्नं पुरुषार्थप्रदायकम्
    । पठतां श
