id: lakshmikavacam-2
category: kavacha
name:
  english: lakshmikavacam 2
  devanagari: लक्ष्मिकवचम् २
content:
  english: spharapangatarangamamba madhuram mugdham mukham bibhratim || 18|| atha kavacam | mahalakshmih
    shirah patu lalatam mama pankaja | karne rakshedrama patu nayane nalinalaya || 19|| nasikamavatadamba
    vacam vagrupini mama | dantanavatu jihvam shriradharoshtham haripriya || 20|| cubukam patu varada
    galam gandharvasevita | vakshah kukshim karau payum prishthamavyadrama svayam || 21|| katimurudvayam
    janu jagham patu rama mama | sarvangamindriyam pranan payadayasaharini || 22|| saptadhatun svayam
    capi raktam shukram mano mama | jnanam buddhim mahotsaham sarvam me patu pankaja || 23|| maya kritam
    ca yatkincittatsarvam patu sendira | mamayuravatat lakshmih bharyam putramshca putrika || 24|| mitrani
    patu satatamakhilani haripriya | patakam nashayet lakshmih maharishtam haredrama || 25|| mamarinashanarthaya
    mayamrityum jayedbalam | sarvabhishtam tu me dadyat patu mam kamalalaya|| 26|| phalashrutih | ya idam
    kavacam divyam ramatma prayatah pathet | sarvasiddhimavapnoti sarvaraksham tu shashvatim || 27|| dirghayushman
    bhavennityam sarvasaubhagyakalpakam | sarvajnah sarvadarshi ca sukhadashca shubhojjvalah || 28|| suputro
    gopatih shriman bhavishyati na samshayah | tadgrihe na bhavedbrahman daridryaduritadikam || 29|| nagnina
    dahyate geham na coradyaishca pidyate | bhutapretapishacadyah samtrasta yanti duratah || 30|| likhitva
    sthapayedyatra tatra siddhirbhavet dhruvam | napamrityumavapnoti dehante muktibhagbhavet || 31|| ayushyam
    paushtikam medhyam dhanyam duhsvapnanashanam | prajakaram pavitram ca durbhikshartivinashanam || 32||
    cittaprasadajananam mahamrityuprashantidam | maharogajvaraharam brahmahatyadishodhanam || 33|| mahadhanapradam
    caiva pathitavyam sukharthibhih | dhanarthi dhanamapnoti vivaharthi labhedvadhum || 34|| vidyarthi
    labhate vidyam putrarthi gunavatsutam | rajyarthi rajyamapnoti satyamuktam maya shuka || 35|| etaddevyahprasadena
    shukah kavacamaptavan | kavacanugrahenaiva sarvan kamanavapa sah || 36|| iti lakshmikavacam brahmastotram
    samaptam |
  devanagari: स्फारापाङ्गतरङ्गमम्ब मधुरं मुग्धं मुखं बिभ्रतीम् ॥ १८॥ अथ कवचम् । महालक्ष्मीः शिरः पातु
    ललाटं मम पङ्कजा । कर्णे रक्षेद्रमा पातु नयने नलिनालया ॥ १९॥ नासिकामवतादंबा वाचं वाग्रूपिणी मम । दन्तानवतु
    जिह्वां श्रीरधरोष्ठं हरिप्रिया ॥ २०॥ चुबुकं पातु वरदा गलं गन्धर्वसेविता । वक्षः कुक्षिं करौ पायूं
    पृष्ठमव्याद्रमा स्वयम् ॥ २१॥ कटिमूरुद्वयं जानु जघं पातु रमा मम । सर्वाङ्गमिन्द्रियं प्राणान् पायादायासहारिणी
    ॥ २२॥ सप्तधातून् स्वयं चापि रक्तं शुक्रं मनो मम । ज्ञानं बुद्धिं महोत्साहं सर्वं मे पातु पङ्कजा ॥
    २३॥ मया कृतं च यत्किञ्चित्तत्सर्वं पातु सेन्दिरा । ममायुरवतात् लक्ष्मीः भार्यां पुत्रांश्च पुत्रिका
    ॥ २४॥ मित्राणि पातु सततमखिलानि हरिप्रिया । पातकं नाशयेत् लक्ष्मीः महारिष्टं हरेद्रमा ॥ २५॥ ममारिनाशनार्थाय
    मायामृत्युं जयेद्बलम् । सर्वाभीष्टं तु मे दद्यात् पातु मां कमलालया॥ २६॥ फलश्रुतिः । य इदं कवचं दिव्यं
    रमात्मा प्रयतः पठेत् । सर्वसिद्धिमवाप्नोति सर्वरक्षां तु शाश्वतीम् ॥ २७॥ दीर्घायुष्मान् भवेन्नित्यं
    सर्वसौभाग्यकल्पकम् । सर्वज्ञः सर्वदर्शी च सुखदश्च शुभोज्ज्वलः ॥ २८॥ सुपुत्रो गोपतिः श्रीमान् भविष्यति
    न संशयः । तद्गृहे न भवेद्ब्रह्मन् दारिद्र्यदुरितादिकम् ॥ २९॥ नाग्निना दह्यते गेहं न चोराद्यैश्च पीड्यते
    । भूतप्रेतपिशाचाद्याः संत्रस्ता यान्ति दूरतः ॥ ३०॥ लिखित्वा स्थापयेद्यत्र तत्र सिद्धिर्भवेत् ध्रुवम्
    । नापमृत्युमवाप्नोति देहान्ते मुक्तिभाग्भवेत् ॥ ३१॥ आयुष्यं पौष्टिकं मेध्यं धान्यं दुःस्वप्ननाशनम्
    । प्रजाकरं पवित्रं च दुर्भिक्षर्तिविनाशनम् ॥ ३२॥ चित्तप्रसादजननं महामृत्युप्रशान्तिदम् । महारोगज्वरहरं
    ब्रह्महत्यादिशोधनम् ॥ ३३॥ महाधनप्रदं चैव पठितव्यं सुखार्थिभिः । धनार्थी धनमाप्नोति विवहार्थी लभेद्वधूम्
    ॥ ३४॥ विद्यार्थी लभते विद्यां पुत्रार्थी गुणवत्सुतम् । राज्यार्थी राज्यमाप्नोति सत्यमुक्तं मया शुक
    ॥ ३५॥ एतद्देव्याःप्रसादेन शुकः कवचमाप्तवान् । कवचानुग्रहेणैव सर्वान् कामानवाप सः ॥ ३६॥ इति लक्ष्मीकवचं
    ब्रह्मस्तोत्रं समाप्तम् ।
