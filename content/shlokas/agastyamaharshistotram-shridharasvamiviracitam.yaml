id: agastyamaharshistotram-shridharasvamiviracitam
category: stotram
name:
  english: agastyamaharshistotram (shridharasvamiviracitam)
  devanagari: अगस्त्यमहर्षिस्तोत्रम् (श्रीधरस्वामीविरचितम्)
content:
  english: jivoddharaparayana susarita kaverinamanikata yacchaktih sumahojvala sukhaghana rarajate kshmatale
    | vatapilvalarakshasavrishimunisvadhyayavidhvamsinaudhvastau yena tapobalattamanagham tam naumyagastyam
    gurum || 1|| siddhanamatishayishaktivibhavam samarthyamurtim gurum kandarpoddhatadushtadarpakarinucchardulakirtiprabham
    | dushtaranyavinashanaikabalabhriddavanalam shobhanam vande kumbhajamadgutam bhavabhayabhrantyarnavaposhanam
    || 2|| iti shrimat paramahamsaparivrajakacarya sadguru bhagavana shridharasvamimaharajaviracitam shri
    agastyamaharshistotram sampurnam |
  devanagari: जीवोद्धारपरायणा सुसरिता कावेरिनामाङिकता यच्छक्तिः सुमहोज्वला सुखघना राराजते क्ष्मातले ।
    वातापील्वलराक्षसावृषिमुनिस्वाध्यायविध्वंसिनौध्वस्तौ येन तपोबलात्तमनघं तं नौम्यगस्त्यं गुरुम् ॥ १॥
    सिद्धानामतिशायिशक्तिविभवं सामर्थ्यमूर्तिं गुरुं कन्दर्पोद्धतदुष्टदर्पकरिनुच्छार्दूलकीर्तिप्रभम् ।
    दुष्टारण्यविनाशनैकबलभृद्दावानलं शोभनं वन्दे कुम्भजमद्गुतं भवभयभ्रान्त्यर्णवापोशनम् ॥ २॥ इति श्रीमत्
    परमहंसपरिव्राजकाचार्य सद्गुरू भगवान श्रीधरस्वामीमहाराजविरचितं श्री अगस्त्यमहर्षिस्तोत्रं सम्पूर्णम्
    ।
meaning: {}
