id: shivashatakam-2
category: shataka
name:
  english: shivashatakam 2
  devanagari: शिवशतकम् २
content:
  english: gravno jagratkaragraistarunatrinaganaih shadvalorjasvalabham | gavo viksha kshudharta atikritiyatinam
    trishnayasmimshcarantah tasthuh susthastadaiva drutagalitapayahpuranirvyudhabhasah || 15|| astam gatyai
    padam tanmama bhrishavipado bhuripadasya shambhoh bhaktebhyah kim nu paunarbhavavibhavabharam sve
    samadaya samyak | tebhyo'paunarbhavarddhim vitarati nitaram tam yadetattathapi svabhedenaiva citram
    punarapi hi bhavam samlabhante param te || 16|| bharganghrestungabhavam vimrishata manasa durgame
    pushpavadbhayam yenarohiha yatnat sthirasudridhapadam tasya vaikunthadhama | hastaprapyam kilashtapadagiriramuna
    loshtavaddrishta aste tasyadhastat samastam jagadapi valate so'pi sarvopari syat || 17|| vande shambhoh
    pade te yamaniyamamahabhaskaraih shushkapanke nakshunne vairishatkaih savananiyamanashushmanoshmayamane
    | doshaughairdurashunye hridayaparisare parikankshishvaranam manye manye kimete cirapathikatayarunyatarunyapurne
    || 18|| candishasyanghrikundam dahatu madashubham yatra rukkandalibhih prajyairajyaih samiddhe'runamanikiranajvalajihvalashile
    | manjirodancinilopalakaralaharicaturibhumadhume yogi yogasruvenoddhatashadarimayirahutih sanjuhoti
    || 19|| kantapragbharabharisuramukutatatishvashmarashmicchatanam bhogabhogojjhitanam pramadayatu manah
    shrigirishasya padah | sattvodrikte vivikte sabalahariguhasadite yatra shadbhyah shatrubhyah santrasanti
    vishati yatimatih sarvato vitabhitih || 20|| samsararanyajanyajvalanakabalanottalatapakulanam nirvanaya
    kshamaya nigamavanakhidam kalpate'nalpatriptyai | asyam ye snanti santah sapadi virajasaste babhuh
    sa girisha shrimatpadagrajagrannakharakarajharinirbharam nah punatu || 21|| pumsam samsarajirnalayagatavishayakarashankaravarai
  devanagari: ग्राव्णो जाग्रत्कराग्रैस्तरुणतृणगणैः शाद्वलोर्जस्वलाभम् । गावो वीक्षा क्षुधार्ता अतिकृतियतिनां
    तृष्णयास्मिंश्चरन्तः तस्थुः सुस्थास्तदैव द्रुतगलितपयःपूरनिर्व्यूढभासः ॥ १५॥ आस्तां गत्यै पदं तन्मम
    भृशविपदो भूरिपादस्य शम्भोः भक्तेभ्यः किं नु पौनर्भवविभवभरं स्वे समादाय सम्यक् । तेभ्योऽपौनर्भवर्द्धिं
    वितरति नितरां तां यदेतत्तथापि स्वाभेदेनैव चित्रं पुनरपि हि भवं संलभन्ते परं ते ॥ १६॥ भर्गाङ्घ्रेस्तुङ्गभावं
    विमृशत मनसा दुर्गमे पुष्पवद्भयां येनारोहीह यत्नात् स्थिरसुदृढपदं तस्य वैकुण्ठधाम । हस्तप्राप्यं किलाष्टापदगिरिरमुना
    लोष्टवद्दृष्ट आस्ते तस्याधस्तात् समस्तं जगदपि वलते सोऽपि सर्वोपरि स्यात् ॥ १७॥ वन्दे शम्भोः पदे ते
    यमनियममहाभास्करैः शुष्कपङ्के नक्षुण्णे वैरिषट्कैः सवननियमनाशुष्मणोष्मायमाणे । दोषौघैर्दूरशून्ये हृदयपरिसरे
    पारिकाङ्क्षीश्वराणां मन्ये मान्ये किमेते चिरपथिकतयारुण्यतारुण्यपूर्णे ॥ १८॥ चण्डीशस्याङ्घ्रिकुण्डं
    दहतु मदशुभं यत्र रुक्कन्दलीभिः प्राज्यैराज्यैः समिद्धेऽरुणमणिकिरणज्वालजिह्वालशीले । मञ्जीरोदञ्चिनीलोपलकरलहरीचातुरीभूमधूमे
    योगी योगस्रुवेणोद्धतषडरिमयीराहुतीः सञ्जुहोति ॥ १९॥ कान्तप्राग्भारभारीसुरमुकुटतटीष्वश्मरश्मिच्छटानां
    भोगाभोगोज्झितानां प्रमदयतु मनः श्रीगिरीशस्य पादः । सत्त्वोद्रिक्ते विविक्ते सबलहरिगुहासादिते यत्र
    षड्भ्यः शत्रुभ्यः सन्त्रसन्ती विशति यतिमतिः सर्वतो वीतभीतिः ॥ २०॥ संसारारण्यजन्यज्वलनकबलनोत्तालतापाकुलानां
    निर्वाणाय क्षमाया निगमवनखिदां कल्पतेऽनल्पतृप्त्यै । अस्यां ये स्नान्ति सन्तः सपदि विरजसस्ते बभुः सा
    गिरीश श्रीमत्पादाग्रजाग्रन्नखरकरझरीनिर्भरं नः पुनातु ॥ २१॥ पुंसां संसारजीर्णालयगतविषयाकारशङ्कारवारै
