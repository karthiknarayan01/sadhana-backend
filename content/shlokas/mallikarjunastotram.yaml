id: mallikarjunastotram
category: stotram
name:
  english: mallikarjunastotram
  devanagari: मल्लिकार्जुनस्तोत्रम्
content:
  english: tpatiramaradhenunayakakakudvinyastahastambujah | niharacalakanyakavahanapadadvandvapadoruhah
    shrimatparvatamallikarjunamahadevah shivo me gatih || 3|| nirejasanamukhyanirjarashirahpracchannapadadvayah
    sarvajnatripurasurahitaganambhodaughajhanjhanilah | markandeyamahamunishvaranutaprakhyatacaritrakah
    shrimatparvatamallikarjunamahadevah shivo me gatih || 4|| sadbhaktavalimanasamburuhacancaccancariko
    mridah kridabandhurapanihritkamalapotah karnagokarnarat | cakri cakrasamastabhushanaganah kolasuradhvamsakah
    shrimatparvatamallikarjunamahadevah shivo me gatih || 5|| kalyanacalakarmukaprathitadugdhambhodhikanyamanah
    kanjatabhramarayamanavilasadgovindasanmarganah | dhatrisyandanabhasamananalinijata
  devanagari: त्पाटीरामरधेनुनायकककुद्विन्यस्तहस्ताम्बुजः । नीहाराचलकन्यकावहनपादद्वन्द्वपादोरुहः श्रीमत्पर्वतमल्लिकार्जुनमहादेवः
    शिवो मे गतिः ॥ ३॥ नीरेजासनमुख्यनिर्जरशिरःप्रच्छन्नपादद्वयः सर्वज्ञत्रिपुरासुराहितगणाम्भोदौघझञ्झानिलः
    । मार्कण्डेयमहामुनीश्वरनुतप्रख्यातचारित्रकः श्रीमत्पर्वतमल्लिकार्जुनमहादेवः शिवो मे गतिः ॥ ४॥ सद्भक्तावलिमानसाम्बुरुहचञ्चच्चञ्चरीको
    मृडः क्रीडाबन्धुरपाणिहृत्कमलपोतः कर्णगोकर्णराट् । चक्री चक्रसमस्तभूषणगणः कोलासुरध्वंसकः श्रीमत्पर्वतमल्लिकार्जुनमहादेवः
    शिवो मे गतिः ॥ ५॥ कल्याणाचलकार्मुकप्रथितदुग्धाम्भोधिकन्यामनः कञ्जातभ्रमरायमाणविलसद्गोविन्दसन्मार्गणः
    । धात्रीस्यन्दनभासमाननलिनीजात
