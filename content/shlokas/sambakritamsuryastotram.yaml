id: sambakritamsuryastotram
category: stotram
name:
  english: sambakritamsuryastotram
  devanagari: साम्बकृतंसूर्यस्तोत्रम्
content:
  english: sambakritam suryastotram samba uvaca | yadetanmandalam shuklam divyam hyajaramavyayam | yuktam
    manojavairashvairharitairbrahmavadibhih || 9|| adiresha hi bhutanamaditya iti samjnitah | trailokyacakshurevatra
    paramatma prajapatih || 10|| esha vai mandale hyasminpurusho dipyate mahan | esha vishnuracintyatma
    brahma caisha pitamahah || 11|| rudro mahendro varuna akasham prithivi jalam | vayuh shashankah parjanyo
    dhanadhyaksho vibhavasuh || 12|| ya esha mandale hyasmin purusho dipyate mahan | ekah sakshanmahadevo
    vritramandanibhah sada || 13|| kalo hyesha mahabahurnibodhotpattilakshanah | ya esha mandale hyasmimstejobhih
    purayanmahim || 14|| bhramyate hyavyavacchinno vatairyo'mritalakshanah | natah parataram kincittejasa
    vidyate kvacit || 15|| pushnati sarvabhutani esha eva sudhamritaih | antasthanmlecchajatiyamstiryagyonigatanapi
    || 16|| karunyatsarvabhutani pasi tvam ca vibhavaso | shvitrakushthyandhabadhiranpangumshcapi tatha
    vibho || 17|| prapannavatsalo deva kurute nirujo bhavan | cakramandalamagnamshca nirdhanalpayushastatha
    || 18|| pratyakshadarshi tvam deva samuddharasi lilaya | ka me shaktih stavaih stotumarto'ham rogapiditah
    || 19|| stuyase tvam sada devairbrahmavishnushivadibhih | mahendrasiddhagandharvairapsarobhih saguhyakaih
    || 20|| stutibhih kim pavitrairva tava deva samiritaih | yasya te rigyajuh samnam tritayam mandalasthitam
    || 21|| dhyaninam tvam param dhyanam mokshadvaram ca mokshinam | anantatejasakshobhyo hyacintyavyaktanishkalah
    || 22|| yadayam vyahritah kincitstotre'sminjagatah patih | artim bhaktim ca vijnaya tatsarvam jnatumarhasi
    || 23|| iti bhavishyapurane brahme parvani saptavimshadhikashatatamadhyayantargatam sambakritam suryastotram
    samaptam | bhavishyapurana | brahmaparva | adhyaya 127
  devanagari: साम्बकृतं सूर्यस्तोत्रम् साम्ब उवाच । यदेतन्मण्डलं शुक्लं दिव्यं ह्यजरमव्ययम् । युक्तं मनोजवैरश्वैर्हारीतैर्ब्रह्मवादिभिः
    ॥ ९॥ आदिरेष हि भूतानामादित्य इति संज्ञितः । त्रैलोक्यचक्षुरेवात्र परमात्मा प्रजापतिः ॥ १०॥ एष वै मण्डले
    ह्यस्मिन्पुरुषो दीप्यते महान् । एष विष्णुरचिन्त्यात्मा ब्रह्मा चैष पितामहः ॥ ११॥ रुद्रो महेन्द्रो
    वरुण आकाशं पृथिवी जलम् । वायुः शशाङ्कः पर्जन्यो धनाध्यक्षो विभावसुः ॥ १२॥ य एष मण्डले ह्यस्मिन् पुरुषो
    दीप्यते महान् । एकः साक्षान्महादेवो वृत्रमण्डनिभः सदा ॥ १३॥ कालो ह्येष महाबाहुर्निबोधोत्पत्तिलक्षणः
    । य एष मण्डले ह्यस्मिंस्तेजोभिः पूरयन्महीम् ॥ १४॥ भ्राम्यते ह्यव्यवच्छिन्नो वातैर्योऽमृतलक्षणः । नातः
    परतरं किञ्चित्तेजसा विद्यते क्वचित् ॥ १५॥ पुष्णाति सर्वभूतानि एष एव सुधामृतैः । अन्तस्थान्म्लेच्छजातीयांस्तिर्यग्योनिगतानपि
    ॥ १६॥ कारुण्यात्सर्वभूतानि पासि त्वं च विभावसो । श्वित्रकुष्ठ्यन्धबधिरान्पङ्गूंश्चापि तथा विभो ॥ १७॥
    प्रपन्नवत्सलो देव कुरुते नीरुजो भवान् । चक्रमण्डलमग्नांश्च निर्धनाल्पायुषस्तथा ॥ १८॥ प्रत्यक्षदर्शी
    त्वं देव समुद्धरसि लीलया । का मे शक्तिः स्तवैः स्तोतुमार्तोऽहं रोगपीडितः ॥ १९॥ स्तूयसे त्वं सदा देवैर्ब्रह्मविष्णुशिवादिभिः
    । महेन्द्रसिद्धगन्धर्वैरप्सरोभिः सगुह्यकैः ॥ २०॥ स्तुतिभिः किं पवित्रैर्वा तव देव समीरितैः । यस्य
    ते ऋग्यजुः साम्नां त्रितयं मण्डलस्थितम् ॥ २१॥ ध्यानिनां त्वं परं ध्यानं मोक्षद्वारं च मोक्षिणाम् ।
    अनन्ततेजसाक्षोभ्यो ह्यचिन्त्याव्यक्तनिष्कलः ॥ २२॥ यदयं व्याहृतः किञ्चित्स्तोत्रेऽस्मिञ्जगतः पतिः ।
    आर्तिं भक्तिं च विज्ञाय तत्सर्वं ज्ञातुमर्हसि ॥ २३॥ इति भविष्यपुराणे ब्राह्मे पर्वणि सप्तविंशाधिकशततमाध्यायान्तर्गतं
    साम्बकृतं सूर्यस्तोत्रं समाप्तम् । भविष्यपुराण । ब्राह्मपर्व । अध्याय १२७
