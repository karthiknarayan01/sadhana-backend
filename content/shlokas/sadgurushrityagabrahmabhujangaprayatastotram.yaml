id: sadgurushrityagabrahmabhujangaprayatastotram
category: stotram
name:
  english: sadgurushrityagabrahmabhujangaprayatastotram
  devanagari: सद्गुरुश्रीत्यागब्रह्मभुजन्गप्रयातस्तोत्रम्
content:
  english: sadgurushrityagabrahmabhujangaprayatastotram om | shriramajayam | | om sadgurushrityagarajasvamine
    namo namah | atha bhujangaprayatastotram | yatityagarajendrasangitagitam sada tena bhaktyabhisannutaramam
    | nutishreshthasatkirtisatkirtanaugham sadaramacandram sabhavyam bhajeham || 1|| bhaje tyagarajam
    yatindram bhajeham bhaje ramacandraikabhaktagraganyam | bhaje nadarajam suvargapavargam bhaje shankaram
    sadgurum tam bhajeham || 2|| parabrahmagunyasvarupapragitam parabrahmanairgunyatattvaprabodham | parabrahmalinam
    paratmanubhutam parabrahmarupam gurum tam bhajeham || 3|| parabrahmanadaprapujam sutejam pararthetisangitayogaprashamsam
    | sunadarcitanandatejassvarupam sunadasvarupam gurubrahmarupam || 4|| suragasvaranadasangitarupam
    sudhasarasaptasvaralasyaganam | sumadhuryavaniravahutaramam saragam bhajeham gurutyagarajam || 5||
    padambhojamanjirashinjatsunadam karambhoruhanadasattalabhedam | ranattumbaranadasa~llinakantham jhanatkaraghantasunadabhivarsham
    || 6|| sadahrinkaranusvarashrotralinam sadatmanubhutipravahe nimagnam | sadanamasankirtananandayogam
    sada sadgurutyagarajam bhajeham || 7|| sadaramarametinamapragitam sadanamasatsarapanapramadam | sadaragatalabhilinaprabhavam
    sada tam bhajeham madatmaprabodham || 8|| mukhashrikarajvalasajjnanatejam sudipratikarunyanetropasantvam
    | sumadhuryavacabhishangabhiramam mamoddharanam sadgurum tam bhajeham || 9|| sukharamamaramanamabhijapyam
    lasatkotikotishanamamshujihvam | urobhasabhasantaramasvarupam harismarakam sadgurum tam bhajeham ||
    10|| padashlishtabhaktasharanyam varenyam karalambanitanushaktopadesham | svaralinasangitavidyapravesham
    madalambanam sadgurum tam prapadye|| 11|| susaptasvaranandavidyatidaivam anuprasasuprasasambhasakavyam
    | rucisphurtisadbhaktikrityaughakaram sasangitarajam gurum tam bhajeham || 12|| sadaramasaddhyanasangitalolam
    samadhisthasangitavaggeyakaram | mahapunyagangabhivarshabhivacam mahantam gurum tam sadaham bhajeham
    || 13|| varadhyanagangamahasnanabhagyam kritisyandasatsarasangitabhogyam | sudhasyandasatkirtanagitavrindam
    madacaryavrindarakam tam bhajeham || 14|| susangitasamrajyacakradhipatyam lasadramacandrabhiramaptaganam
    | saharshatiromancananandageyam sabhavam bhaje sadgurutyagarajam || 15|| nadattarakashriramaramamantram
    lasatkirtanasaravedarthasaram | hitapreryamanopadeshaprasaram sada sadgurutyagarajam bhajeham || 16||
    paranandasaramamantropadesham sadanandasangitatattvopadesham | suranandagangasuganapravaham varanandakandam
    gurum tam bhajeham || 17|| bhavapohasangitagangapravaham sumangalyasangitasiddhipradanam | cirasthayisatkirtanabhasarupam
    madacaryavaryam sadaham bhajeham || 18|| cidabhasasajjnanasangitabodham satalasvaranandagambhiryaragam
    | salalityamadhuryashailigabhiram cidakashadipam bhaje sadgurum tam || 19|| sadaputasatyasvarupaprakasham
    tamogunyanidraribhasaprakasham | rajastamasapohasattvaprakasham bhaje sadgurum tam madantahprakasham
    || 20|| bhujangaprabhasaprabhatapragitam bhujangaprashayiprashantaprageyam | bhujangaprayatastutistomanatham
    bhaje sadgurutyagarajam bhajeham || 21|| bhujangaprayatapragitapramodam bhujangaprayatasvagitaprabhavam
    | bhujangaprayatapragatrisvalinam bhajeham madantah sulinam gurum tam || 22|| gurutyagarajendrabhaktipragitam
    varahladasangitasadmapranitam | supushpopaharam ca tathyopacaram guroranghripadme samarpyam subhadram
    || 23|| subhadram gurutyagarajaya gaya subhadram susangitapathodhicaya| subhadram gagangapravahaya
    haya subhadram sumangalyadatre subhadram || 24|| om shubhamastu |
  devanagari: सद्गुरुश्रीत्यागब्रह्मभुजङ्गप्रयातस्तोत्रम् ॐ । श्रीरामजयम् । । ॐ सद्गुरुश्रीत्यागराजस्वामिने
    नमो नमः । अथ भुजङ्गप्रयातस्तोत्रम् । यतित्यागराजेन्द्रसङ्गीतगीतं सदा तेन भक्त्याभिसन्नूतरामम् । नुतिश्रेष्ठसत्कीर्तिसत्कीर्तनौघं
    सदारामचन्द्रं सभव्यं भजेहम् ॥ १॥ भजे त्यागराजं यतीन्द्रं भजेहं भजे रामचन्द्रैकभक्ताग्रगण्यम् । भजे
    नादराजं सुवर्गापवर्गं भजे शङ्करं सद्गुरुं तं भजेहम् ॥ २॥ परब्रह्मगुण्यस्वरूपप्रगीतं परब्रह्मनैर्गुण्यतत्त्वप्रबोधम्
    । परब्रह्मलीनं परात्मानुभूतं परब्रह्मरूपं गुरुं तं भजेहम् ॥ ३॥ परब्रह्मनादप्रपूजं सुतेजं परार्थेतिसङ्गीतयोगप्रशंसम्
    । सुनादार्चितानन्दतेजस्स्वरूपं सुनादस्वरूपं गुरुब्रह्मरूपम् ॥ ४॥ सुरागस्वरानादसङ्गीतरूपं सुधासारसप्तस्वरालास्यगानम्
    । सुमाधुर्यवाणीरवाहूतरामं सरागं भजेहं गुरुत्यागराजम् ॥ ५॥ पदाम्भोजमञ्जीरशिञ्जत्सुनादं कराम्भोरुहानादसत्तालभेदम्
    । रणत्तुम्बरानादसँल्लीनकण्ठं झणत्कारघण्टासुनादाभिवर्षम् ॥ ६॥ सदाह्रीङ्करानुस्वरश्रोत्रलीनं सदात्मानुभूतिप्रवाहे
    निमग्नम् । सदानामसङ्कीर्तनानन्दयोगं सदा सद्गुरुत्यागराजं भजेहम् ॥ ७॥ सदारामरामेतिनामप्रगीतं सदानामसत्सारपानप्रमादम्
    । सदारागतालाभिलीनप्रभावं सदा तं भजेहं मदात्मप्रबोधम् ॥ ८॥ मुखश्रीकरज्वालसज्ज्ञानतेजं सुदीप्रातिकारुण्यनेत्रोपसान्त्वम्
    । सुमाधुर्यवाचाभिषङ्गाभिरामं ममोद्धारणं सद्गुरुं तं भजेहम् ॥ ९॥ सुखाराममारामनामाभिजप्यं लसत्कोटिकोटीशनामांशुजिह्वम्
    । उरोभासभासन्तरामस्वरूपं हरिस्मारकं सद्गुरुं तं भजेहम् ॥ १०॥ पदाश्लिष्टभक्ताशरण्यं वरेण्यं करालम्बनीतानुषक्तोपदेशम्
    । स्वरालीनसङ्गीतविद्याप्रवेशं मदालम्बनं सद्गुरुं तं प्रपद्ये॥ ११॥ सुसप्तस्वरानन्दविद्यातिदैवं अनुप्राससुप्राससम्भासकाव्यम्
    । रुचिस्फूर्तिसद्भक्तिकृत्यौघकारं ससङ्गीतराजं गुरुं तं भजेहम् ॥ १२॥ सदारामसद्ध्यानसङ्गीतलोलं समाधिस्थसङ्गीतवाग्गेयकारम्
    । महापुण्यगङ्गाभिवर्षाभिवाचं महान्तं गुरुं तं सदाहं भजेहम् ॥ १३॥ वरध्यानगङ्गामहास्नानभाग्यं कृतिस्यन्दसत्सारसङ्गीतभोग्यम्
    । सुधास्यन्दसत्कीर्तनागीतवृन्दं मदाचार्यवृन्दारकं तं भजेहम् ॥ १४॥ सुसङ्गीतसाम्राज्यचक्राधिपत्यं लसद्रामचन्द्राभिरामाप्तगानम्
    । सहर्षातिरोमाञ्चनानन्दगेयं सभावं भजे सद्गुरुत्यागराजम् ॥ १५॥ नदत्तारकश्रीरमाराममन्त्रं लसत्कीर्तनासारवेदार्थसारम्
    । हितप्रेर्यमाणोपदेशप्रसारं सदा सद्गुरुत्यागराजं भजेहम् ॥ १६॥ परानन्दसाराममन्त्रोपदेशं सदानन्दसङ्गीततत्त्वोपदेशम्
    । सुरानन्दगङ्गासुगानप्रवाहं वरानन्दकन्दं गुरुं तं भजेहम् ॥ १७॥ भवापोहसङ्गीतगङ्गाप्रवाहं सुमाङ्गल्यसङ्गीतसिद्धिप्रदानम्
    । चिरस्थायिसत्कीर्तनाभासरूपं मदाचार्यवर्यं सदाहं भजेहम् ॥ १८॥ चिदाभाससज्ज्ञानसङ्गीतबोधं सतालस्वरानन्दगाम्भीर्यरागम्
    । सलालित्यमाधुर्यशैलीगभीरं चिदाकाशदीपं भजे सद्गुरुं तम् ॥ १९॥ सदापूतसत्यस्वरूपप्रकाशं तमोगुण्यनिद्रारिभासप्रकाशम्
    । रजस्तामसापोहसत्त्वप्रकाशं भजे सद्गुरुं तं मदन्तःप्रकाशम् ॥ २०॥ भुजङ्गप्रभासप्रभातप्रगीतं भुजङ्गप्रशायिप्रशान्तप्रगेयम्
    । भुजङ्गप्रयातस्तुतिस्तोमनाथं भजे सद्गुरुत्यागराजं भजेहम् ॥ २१॥ भुजङ्गप्रयातप्रगीतप्रमोदं भुजङ्गप्रयातस्वगीतप्रभावम्
    । भुजङ्गप्रयातप्रगातृस्वलीनं भजेहं मदन्तः सुलीनं गुरुं तम् ॥ २२॥ गुरुत्यागराजेन्द्रभक्तिप्रगीतं वराह्लादसङ्गीतसद्मप्रणीतम्
    । सुपुष्पोपहारं च तथ्योपचारं गुरोरङ्घ्रिपद्मे समर्प्यं सुभद्रम् ॥ २३॥ सुभद्रं गुरुत्यागराजाय गाय सुभद्रं
    सुसङ्गीतपाथोधिचाय। सुभद्रं गगङ्गाप्रवाहाय हाय सुभद्रं सुमाङ्गल्यदात्रे सुभद्रम् ॥ २४॥ ॐ शुभमस्तु ।
