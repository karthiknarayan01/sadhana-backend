    गु दूरं बन्दकुण्डङ्ग ने ब्रणतुल् गणुतिम्पं बाडि लेकुण्डिनन् ऋणमा नानुति नीवु श्रीपतिवि नी के लप्पु
    करिनाथुण्डु जलग्रहग्रहण दुःखाक्रान्तु गृशानु भानुशततेजस्फूर्ति यैनट्टि मी करचक्रम्बुन नक्रकण्ठमु वॆस
    खण्डिञ्चि मिञ्चॆं दया परसद्भक्त भयानक प्रकर सत्प्राकट्य नारायणा दलञ्चॆ गजयूधेन्द्रुण्डु आपन्नु डै
    येभावम्बुन द्रौप दय्यॆड रमाधीशा यनॆ न्वायसं बेभावम्बुन नीशरण्य मनॆनो यी नी कृपादृष्टिचे नाभावम्बुन
    नीतलम्पु गलुग न्ना किम्मु नारायणा डु चेतिपुन्क विडिचॆ न्नीयिन्ति भिक्षम्बुन दनरॆ न्नीनामजप्यम्बुनन्
    नीप्रापु सेविञ्चिनन् नीलग्रीव मुखाब्जभास्कर कृपानित्यात्म नारायणा डु नीचमति पो तत्वज्ञ नारायणा निनु
    वर्णिम्पनि नीचबन्धमति दा निर्मग्नमूढात्मु सेविञ्चुचन्दम्बु ता नवलं बारिन भूतियन्दु वॆलय न्नाज्याहुतुल्
    पूनि वे ल्चिन चन्दम्बुन व्यर्थमै तनरु जू चिद्रूप नारायणा निनु वर्णिम्पनि जिह्व दा नीलाभ्रदेहाङ्गका
    निनु नालिम्पनि चॆव्लु दा नीरेजपत्रेक्षणा निनु निर्वाहकक्ष्मातला निनु जिन्तिम्पनि यात्म दा नीवे तल्लिवि
    नीवॆ तण्ड्रि वरय न्नीवे जगन्नाथु डौ नीवे निश्चलबान्धवुण्ड वरय न्नीवे मुनिस्तुत्यु डौ नीवे शङ्करमूलमन्त्र
    मरयन् नीवे दिक्कनुवारि वारलॆ कडु न्नीवारु नारायणा अपराधम्बुलु निन्नु नम्मि विनु मे नाजन्मपर्यन्तमु
    क नीवे दिक्कु नालोनिकि गपटं बिन्तयु लेक दण्डधरुकुं गट्टीक रक्षिम्पु मी कृपकुं बात्रु ड नय्य धर्मपुरि
    लक्ष्मीनाथ नारायणा चॆल्लं जेसिति पातकम्बुलु मदि बोवनि नम्मि पद्यशतमुन् चॆल्लम्बो ननु नम्मॆ वी डनि
    दयं जेपट्टि रक्षिम्पुमी तल्लिं दण्ड्रियु नीवु गाक यॊरुले तर्किम्प नारायणा नरसिं हाच्युत वासुदेव विकसन्नालीकपत्राक्ष
    भू धर गोविन्द मुकुन्द केशव जगत्त्रा ताहितल्पाम्बुजो दर दामोदर तार्क्ष्यवाहन महादैत्यारि वैकुण्ठमं
    दिर पीताम्बर भक्तवत्सल कृपन् कडकण्टं गडलेनि सम्पद लॊगिं गाविम्पु लक्ष्मीश पा ल्कडलिन् बन्नगशायिवै
    भुवनमुल् गल्पिञ्चु सत्पुत्रुनि जेसिन नाभिपङ्कज जगत्पुण्यात्म भागीरथी पडतिं गन्न पदारविन्दमुल ने भाविन्तु
    नारायणा मन्त्रसमस्तयज्ञफलमुल् पुण्यसुतीर्थसेवफलमुल् उपवासव्रतशीलकर्मफलमुल् ऒप्पार निन्नात्मलो नुपमिम्पं
    गलवारिके गलुगु वेयु न्नेल नारायणा जालु दुरितश्रेणि न्निवारिम्प गा नानन्दस्थिति गल्गु नञ्चु निगमार्थानेक
    मॆल्लप्पुडु जॆप्प नेनु विनि श्रीनारायणा यञ्चु नि न्ने ने नॆप्पुडु गॊल्तु ब्रोव गदॆ तण्ड्री नन्नु नारायणा
    कलिताघौघ विनाशकारि यगुचुं गैवल्यसन्धायियै नलि नॊप्पारॆडु मन्त्रराज मगु नीनामम्बु प्रेमम्बुन अलर न्नॆव्वनि
    वाक्कुनं बॊरयदो यन्नीचु देहम्बु दा वॆलय भूरुहकोटरं बदिय सू वेदात्म नारायणा रमणीयम्बुग नादिमम्बु नवतारम्बु
    भवद्दिव्यरू पमु नामामृतमु दलम्प दशकप्रा प्तय्यॆ गृष्णावता रमु सुज्ञानमु मोक्षमु शतान्ध्राख्य का व्यमु
    नर्पिञ्चिति मीपदाब्जमुलकु नी पाद निर्माल्यनि ष्ठामोदम्बु नॆऋङ्ग नीमं बॊप्प भजिम्प नीजपमु वर्णिम्प
    गृपं जेयवे श्री मिञ्च
