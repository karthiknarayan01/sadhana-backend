id: devi-navaratna
category: stotram
name:
  english: devi navaratna
  devanagari: देवी नवरत्न
content:
  english: tpundarikamukhabhedinim ca pracandabhanubhasamujjvalam | mandalenduparivahitamritataranginimarunarupinim
    mandalantamanidipikam manasi bhavayami paradevatam || 5|| bhuribharadharakundalindramanibaddhabhuvalayapithikam
    varirashimanimekhalavalayavahnimandalasharirinim | varisaravahakundalam gaganashekharim ca paramatmikam
    carucandraravilocanam manasi bhavayami paradevatam || 6|| varanananamayuravahamukhadahavaranapayodharam
    caranadisurasundaricikurashekarikritapadambujam | karanadhipatipancakaprakritikaranaprathamamatrikam
    varanantamukhaparanam manasi bhavayami paradevatam || 7|| agamapranavapithikamamalavarnamangalasharirinim
    agamavayavashobhinimakhilavedasarakritashekharim | mulamantramukhamandalam muditanadabindunavayauvanam
    matrikam tripurasundarim manasi bhavayami paradevatam || 8|| padmakantipadapanipallavapayodharananasaroruham
    padmaragamanimekhalavalayanivishobhitanitambinim | padmasambhavasadashivantamayapancaratnapadapithikam
    padminim pranavarupinim manasi bhavayami paradevatam || 9|| manikyakundalitamauktikavalikena mandasmitena
    vadanarunapankajena | kalantadirghamanimangalasutrakanthi mata vishalanayana mama sannidhattam ||
    10|| nityameva niyamena jalpatam bhuktimuktiphaladamabhishtadam | shamkarena racitam sada jape
  devanagari: त्पुण्डरीकमुखभेदिनीं च प्रचण्डभानुभासमुज्ज्वलाम् । मण्डलेन्दुपरिवाहितामृततरङ्गिणीमरुणरूपिणीं
    मण्डलान्तमणिदीपिकां मनसि भावयामि परदेवताम् ॥ ५॥ भूरिभारधरकुण्डलीन्द्रमणिबद्धभूवलयपीठिकां वारिराशिमणिमेखलावलयवह्निमण्डलशरीरिणीम्
    । वारिसारवहकुण्डलां गगनशेखरीं च परमात्मिकां चारुचन्द्ररविलोचनां मनसि भावयामि परदेवताम् ॥ ६॥ वारणाननमयूरवाहमुखदाहवारणपयोधरां
    चारणादिसुरसुन्दरीचिकुरशेकरीकृतपदाम्बुजाम् । कारणाधिपतिपञ्चकप्रकृतिकारणप्रथममातृकां वारणान्तमुखपारणां
    मनसि भावयामि परदेवताम् ॥ ७॥ आगमप्रणवपीठिकाममलवर्णमङ्गलशरीरिणीं आगमावयवशोभिनीमखिलवेदसारकृतशेखरीम् ।
    मूलमन्त्रमुखमण्डलां मुदितनादबिन्दुनवयौवनां मातृकां त्रिपुरसुन्दरीं मनसि भावयामि परदेवताम् ॥ ८॥ पद्मकान्तिपदपाणिपल्लवपयोधराननसरोरुहां
    पद्मरागमणिमेखलावलयनीविशोभितनितम्बिनीम् । पद्मसम्भवसदाशिवान्तमयपञ्चरत्नपदपीठिकां पद्मिनीं प्रणवरूपिणीं
    मनसि भावयामि परदेवताम् ॥ ९॥ माणिक्यकुण्डलितमौक्तिकवालिकेन मन्दस्मितेन वदनारुणपङ्कजेन । कालान्तदीर्घमणिमङ्गलसूत्रकण्ठी
    माता विशालनयना मम सन्निधत्ताम् ॥ १०॥ नित्यमेव नियमेन जल्पतां भुक्तिमुक्तिफलदामभीष्टदाम् । शंकरेण रचितां
    सदा जपे
