id: sri-rama-charita-manasa-bala-kanda
category: stotram
name:
  english: Sri Rama Charita Manasa - Bala Kanda
content:
  english: '|| shri ganeshaya namah || shrijanakivallabho vijayate shri ramacarita manasa prathama sopana
    varnanamarthasanghanam rasanam chandasamapi| mangalanam ca karttarau vande vanivinayakau || || bhavanishankarau
    vande shraddhavishvasarupinau| yabhyam vina na pashyanti siddhahsvantahsthamishvaram || || vande bodhamayam
    nityam gurum shankararupinam| yamashrito hi vakro''pi candrah sarvatra vandyate || || sitaramagunagramapunyaranyaviharinau|
    vande vishuddhavijnanau kabishvarakapishvarau || || udbhavasthitisamharakarinim kleshaharinim| sarvashreyaskarim
    sitam nato''ham ramavallabham || || yanmayavashavartim vishvamakhilam brahmadidevasura yatsatvadamrishaiva
    bhati sakalam rajjau yathaherbhramah| yatpadaplavamekameva hi bhavambhodhestitirshavatam vande''ham
    tamasheshakaranaparam ramakhyamisham harim || || nanapurananigamagamasammatam yad ramayane nigaditam
    kvacidanyato''pi| svantahsukhaya tulasi raghunathagatha bhashanibandhamatimanjulamatanoti || jo sumirata
    sidhi hoi gana nayaka karibara badana| karu anugraha soi buddhi rasi subha guna sadana || || muka
    hoi bacala pangu cadhi giribara gahana| jasu kripa~ so dayala dravu sakala kali mala dahana || ||
    nila saroruha syama taruna aruna barija nayana| karu so mama ura dhama sada chirasagara sayana ||
    || kunda indu sama deha uma ramana karuna ayana| jahi dina para neha karu kripa mardana mayana ||
    || bandu guru pada kanja kripa sindhu nararupa hari| mahamoha tama punja jasu bacana rabi kara nikara
    || || bandu guru pada paduma paraga| suruci subasa sarasa anuraga || amiya murimaya curana caru| samana
    sakala bhava ruja parivaru || sukriti sambhu tana bimala bibhuti| manjula mangala moda prasuti ||
    jana mana manju mukura mala harani| kie~ tilaka guna gana basa karani || shrigura pada nakha mani
    gana joti| sumirata dibya drrishti hiya~ hoti || dalana moha tama so saprakasu| barae bhaga ura avi
    jasu || ugharahim bimala bilocana hi ke| mitahim dosha dukha bhava rajani ke || sujhahim rama carita
    mani manika| guputa pragata jaha~ jo jehi khanika || do jatha suanjana anji driga sadhaka siddha sujana|
    kautuka dekhata saila bana bhutala bhuri nidhana || || guru pada raja mridu manjula anjana| nayana
    amia driga dosha bibhanjana || tehim kari bimala bibeka bilocana| baranu~ rama carita bhava mocana
    || bandu~ prathama mahisura carana| moha janita samsaya saba harana || sujana samaja sakala guna khani|
    karu~ pranama saprema subani || sadhu carita subha carita kapasu| nirasa bisada gunamaya phala jasu
    || jo sahi dukha parachidra durava| bandaniya jehim jaga jasa pava || muda mangalamaya santa samaju|
    jo jaga jangama tiratharaju || rama bhakti jaha~ surasari dhara| sarasi brahma bicara pracara || bidhi
    nishedhamaya kali mala harani| karama katha rabinandani barani || hari hara katha birajati beni| sunata
    sakala muda mangala deni || batu bisvasa acala nija dharama| tiratharaja samaja sukarama || sabahim
    sulabha saba dina saba desa| sevata sadara samana kalesa || akatha alaukika tirathar | dei sadya phala
    pragata prabh suni samujhahim jana mudita mana majjahim ati anuraga| lahahim cari phala achata tanu
    sadhu samaja prayaga || || majjana phala pekhia tatakala| kaka hohim pika baku marala || suni acaraja
    karai jani koi| satasangati mahima nahim goi || balamika narada ghatajoni| nija nija mukhani kahi
    nija honi || jalacara thalacara nabhacara nana| je jara cetana jiva jahana || mati kirati gati bhuti
    bhalai| jaba jehim jatana jaha~ jehim pai || so janaba satasanga prabh | lokahu~ beda na ana up ||
    binu satasanga bibeka na hoi| rama kripa binu sulabha na soi || satasangata muda mangala mula| soi
    phala sidhi saba sadhana phula || satha sudharahim satasangati pai| parasa parasa kudhata suhai ||
    bidhi basa sujana kusangata parahim| phani mani sama nija guna anusarahim || bidhi hari hara kabi
    kobida bani| kahata sadhu mahima sakucani || so mo sana kahi jata na kaisem| saka banika mani guna
    gana jaisem || do bandu~ santa samana cita hita anahita nahim koi| anjali gata subha sumana jimi sama
    sugandha kara doi || || santa sarala cita jagata hita jani subhau sanehu| balabinaya suni kari kripa
    rama carana rati dehu || || bahuri bandi khala gana satibhae~| je binu kaja dahinehu bae~ || para
    hita hani labha jinha kerem| ujarem harasha bishada baserem || hari hara jasa rakesa rahu se| para
    akaja bhata sahasabahu se || je para dosha lakhahim sahasakhi| para hita ghrita jinha ke mana makhi
    || teja krisanu rosha mahishesa| agha avaguna dhana dhani dhanesa || udaya keta sama hita sabahi ke|
    kumbhakarana sama sovata nike || para akaju lagi tanu pariharahim| jimi hima upala krishi dali garahim
    || bandu~ khala jasa sesha sarosha| sahasa badana barani para dosha || puni pranavu~ prithuraja samana|
    para agha suni sahasa dasa kana || bahuri sakra sama binavu~ tehi| santata suranika hita jehi || bacana
    bajra jehi sada piara| sahasa nayana para dosha nihara || do udasina ari mita hita sunata jarahim
    khala riti| jani pani juga jori jana binati kari sapriti || || maim apani disi kinha nihora| tinha
    nija ora na lauba bhora || bayasa paliahim ati anuraga| hohim niramisha kabahu~ ki kaga || bandu~
    santa asajjana carana| dukhaprada ubhaya bica kachu barana || bichurata eka prana hari lehim| milata
    eka dukha daruna dehim || upajahim eka sanga jaga mahim| jalaja jonka jimi guna bilagahim || sudha
    sura sama sadhu asadhu| janaka eka jaga jaladhi agadhu || bhala anabhala nija nija karatuti| lahata
    sujasa apaloka bibhuti || sudha sudhakara surasari sadhu| garala anala kalimala sari byadhu || guna
    avaguna janata saba koi| jo jehi bhava nika tehi soi || do bhalo bhalaihi pai lahi lahi nicaihi nicu|
    sudha sarahia amarata~ garala sarahia micu || || khala agha aguna sadhu guna gaha| ubhaya apara udadhi
    avagaha || tehi tem kachu guna dosha bakhane| sangraha tyaga na binu pahicane || bhaleu poca saba
    bidhi upajae| gani guna dosha beda bilagae || kahahim beda itihasa purana| bidhi prapancu guna avaguna
    sana || dukha sukha papa punya dina rati| sadhu asadhu sujati kujati || danava deva u~ca aru nicu|
    amia sujivanu mahuru micu || maya brahma jiva jagadisa| lacchi alacchi ranka avanisa || kasi maga
    surasari kramanasa| maru marava mahideva gavasa || saraga naraka anuraga biraga| nigamagama guna dosha
    bibhaga || do jara cetana guna doshamaya bisva kinha karatara| santa hamsa guna gahahim paya parihari
    bari bikara || || asa bibeka jaba dei bidhata| taba taji dosha gunahim manu rata || kala subhau karama
    bariai| bhaleu prakriti basa cuki bhalai || so sudhari harijana jimi lehim| dali dukha dosha bimala
    jasu dehim || khalu karahim bhala pai susangu| miti na malina subhau abhangu || lakhi subesha jaga
    bancaka jeu| besha pratapa pujiahim teu || udharahim anta na hoi nibahu| kalanemi jimi ravana rahu
    || kiehu~ kubesha sadhu sanamanu| jimi jaga jamavanta hanumanu || hani kusanga susangati lahu| lokahu~
    beda bidita saba kahu || gagana carhai raja pavana prasanga| kicahim mili nica jala sanga || sadhu
    asadhu sadana suka sarim| sumirahim rama dehim gani gari || dhuma kusangati karikha hoi| likhia purana
    manju masi soi || soi jala anala anila sanghata| hoi jalada jaga jivana data || do graha bheshaja
    jala pavana pata pai kujoga sujoga| hohi kubastu subastu jaga lakhahim sulacchana loga || || sama
    prakasa tama pakha duhu~ nama bheda bidhi kinha| sasi soshaka poshaka samujhi jaga jasa apajasa dinha
    || || jara cetana jaga jiva jata sakala ramamaya jani| bandu~ saba ke pada kamala sada jori juga pani
    || || deva danuja nara naga khaga preta pitara gandharba| bandu~ kinnara rajanicara kripa karahu aba
    sarba || || akara cari lakha caurasi| jati jiva jala thala nabha basi || siya ramamaya saba jaga jani|
    karu~ pranama jori juga pani || jani kripakara kinkara mohu| saba mili karahu charai chala chohu ||
    nija budhi bala bharosa mohi nahim| tatem binaya karu~ saba pahi || karana cahu~ raghupati guna gaha|
    laghu mati mori carita avagaha || sujha na eku anga up | mana mati ranka manoratha r || mati ati nica
    u~ci ruci achi| cahia amia jaga juri na chachi || chamihahim sajjana mori dhithai| sunihahim balabacana
    mana lai || jau balaka kaha totari bata| sunahim mudita mana pitu aru mata || ha~sihahi kura kutila
    kubicari| je para dushana bhushanadhari || nija kavita kehi laga na nika| sarasa hau athava ati phika
    || je para bhaniti sunata harashahi| te bara purusha bahuta jaga nahim || jaga bahu nara sara sari
    sama bhai| je nija barhai barhahim jala pai || sajjana sakrita sindhu sama koi| dekhi pura bidhu barhai
    joi || do bhaga chota abhilashu bara karu~ eka bisvasa| paihahim sukha suni sujana saba khala karahahim
    upahasa || || khala parihasa hoi hita mora| kaka kahahim kalakantha kathora || hamsahi baka dadura
    catakahi| ha~sahim malina khala bimala batakahi || kabita rasika na rama pada nehu| tinha kaha~ sukhada
    hasa rasa ehu || bhasha bhaniti bhori mati mori| ha~sibe joga ha~sem nahim khori || prabhu pada priti
    na samujhi niki| tinhahi katha suni lagahi phiki || hari hara pada rati mati na kutaraki| tinha kahu~
    madhura katha raghuvara ki || rama bhagati bhushita jiya~ jani| sunihahim sujana sarahi subani ||
    kabi na hau~ nahim bacana prabinu| sakala kala saba bidya hinu || akhara aratha alankriti nana| chanda
    prabandha aneka bidhana || bhava bheda rasa bheda apara| kabita dosha guna bibidha prakara || kabita
    bibeka eka nahim morem| satya kahu~ likhi kagada kore || do bhaniti mori saba guna rahita bisva bidita
    guna eka| so bicari sunihahim sumati jinha kem bimala biveka || || ehi maha~ raghupati nama udara|
    ati pavana purana shruti sara || mangala bhavana amangala hari| uma sahita jehi japata purari || bhaniti
    bicitra sukabi krita jou| rama nama binu soha na sou || bidhubadani saba bha~ti sa~vari| sona na basana
    bina bara nari || saba guna rahita kukabi krita bani| rama nama jasa ankita jani || sadara kahahim
    sunahim budha tahi| madhukara sarisa santa gunagrahi || jadapi kabita rasa eku nahi| rama pratapa
    prakata ehi mahim || soi bharosa morem mana ava| kehim na susanga badappanu pava || dhumu taji sahaja
    karuai| agaru prasanga sugandha basai || bhaniti bhadesa bastu bhali barani| rama katha jaga mangala
    karani || cham mangala karani kali mala harani tulasi katha raghunatha ki || gati kura kabita sarita
    ki jyom sarita pavana patha ki || prabhu sujasa sangati bhaniti bhali hoihi sujana mana bhavani ||
    bhava anga bhuti masana ki sumirata suhavani pavani || do priya lagihi ati sabahi mama bhaniti rama
    jasa sanga| daru bicaru ki kari kau bandia malaya prasanga || || syama surabhi paya bisada ati gunada
    karahim saba pana| gira gramya siya rama jasa gavahim sunahim sujana || || mani manika mukuta chabi
    jaisi| ahi giri gaja sira soha na taisi || nripa kirita taruni tanu pai| lahahim sakala sobha adhikai
    || taisehim sukabi kabita budha kahahim| upajahim anata anata chabi lahahim || bhagati hetu bidhi
    bhavana bihai| sumirata sarada avati dhai || rama carita sara binu anhavae~| so shrama jai na koti
    upae~ || kabi kobida asa hridaya~ bicari| gavahim hari jasa kali mala hari || kinhem prakrita jana
    guna gana| sira dhuni gira lagata pachitana || hridaya sindhu mati sipa samana| svati sarada kahahim
    sujana || jaum barashi bara bari bicaru| hohim kabita mukutamani caru || do juguti bedhi puni pohiahim
    ramacarita bara taga| pahirahim sajjana bimala ura sobha ati anuraga || || je janame kalikala karala|
    karataba bayasa besha marala || calata kupantha beda maga cha~rae| kapata kalevara kali mala bha~raem
    || bancaka bhagata kahai rama ke| kinkara kancana koha kama ke || tinha maha~ prathama rekha jaga
    mori| dhinga dharamadhvaja dhandhaka dhori || jaum apane avaguna saba kahu~| barhai katha para nahim
    lahu~ || tate maim ati alapa bakhane| thore mahu~ janihahim sayane || samujhi bibidhi bidhi binati
    mori| kau na katha suni deihi khori || etehu para karihahim je asanka| mohi te adhika te jara mati
    ranka || kabi na hau~ nahim catura kahavu~| mati anurupa rama guna gavu~ || kaha~ raghupati ke carita
    apara| kaha~ mati mori nirata samsara || jehim maruta giri meru uraahim| kahahu tula kehi lekhe mahim
    || samujhata amita rama prabhutai| karata katha mana ati kadarai || do sarada sesa mahesa bidhi agama
    nigama purana| neti neti kahi jasu guna karahim nirantara gana || || saba janata prabhu prabhuta soi|
    tadapi kahem binu raha na koi || taha~ beda asa karana rakha| bhajana prabhau bha~ti bahu bhasha ||
    eka aniha arupa anama| aja saccidananda para dhama || byapaka bisvarupa bhagavana| tehim dhari deha
    carita krita nana || so kevala bhagatana hita lagi| parama kripala pranata anuragi || jehi jana para
    mamata ati chohu| jehim karuna kari kinha na kohu || gi bahora gariba nevaju| sarala sabala sahiba
    raghuraju || budha baranahim hari jasa asa jani| karahi punita suphala nija bani || tehim bala maim
    raghupati guna gatha| kahihu~ nai rama pada matha || muninha prathama hari kirati gai| tehim maga
    calata sugama mohi bhai || do ati apara je sarita bara jaum nripa setu karahim| cadhi pipiliku parama
    laghu binu shrama parahi jahim || || ehi prakara bala manahi dekhai| karihu~ raghupati katha suhai
    || byasa adi kabi pungava nana| jinha sadara hari sujasa bakhana || carana kamala bandu~ tinha kere|
    puravahu~ sakala manoratha mere || kali ke kabinha karu~ paranama| jinha barane raghupati guna grama
    || je prakrita kabi parama sayane| bhasha~ jinha hari carita bakhane || bhe je ahahim je hoihahim
    agem| pranavu~ sabahim kapata saba tyagem || hohu prasanna dehu baradanu| sadhu samaja bhaniti sanamanu
    || jo prabandha budha nahim adarahim| so shrama badi bala kabi karahim || kirati bhaniti bhuti bhali
    soi| surasari sama saba kaha~ hita hoi || rama sukirati bhaniti bhadesa| asamanjasa asa mohi a~desa
    || tumhari kripa sulabha sau more| siani suhavani tata patore || do sarala kabita kirati bimala soi
    adarahim sujana| sahaja bayara bisarai ripu jo suni karahim bakhana || || so na hoi binu bimala mati
    mohi mati bala ati thora| karahu kripa hari jasa kahu~ puni puni karu~ nihora || || kabi kobida raghubara
    carita manasa manju marala| bala binaya suni suruci lakhi mopara hohu kripala || bandu~ muni pada
    kanju ramayana jehim niramayu| sakhara sukomala manju dosha rahita dushana sahita || || bandu~ cariu
    beda bhava baridhi bohita sarisa| jinhahi na sapanehu~ kheda baranata raghubara bisada jasu || ||
    bandu~ bidhi pada renu bhava sagara jehi kinha jaha~| santa sudha sasi dhenu pragate khala bisha baruni
    || bibudha bipra budha graha carana bandi kahu~ kara jori| hoi prasanna puravahu sakala manju manoratha
    mori || || puni bandu~ sarada surasarita| jugala punita manohara carita || majjana pana papa hara
    eka| kahata sunata eka hara abibeka || gura pitu matu mahesa bhavani| pranavu~ dinabandhu dina dani
    || sevaka svami sakha siya pi ke| hita nirupadhi saba bidhi tulasike || kali biloki jaga hita hara
    girija| sabara mantra jala jinha sirija || anamila akhara aratha na japu| pragata prabhau mahesa pratapu
    || so umesa mohi para anukula| karihim katha muda mangala mula || sumiri siva siva pai pas | baranu~
    ramacarita cita c || bhaniti mori siva kripa~ bibhati| sasi samaja mili manahu~ surati || je ehi kathahi
    saneha sameta| kahihahim sunihahim samujhi saceta || hoihahim rama carana anuragi| kali mala rahita
    sumangala bhagi || do sapanehu~ sacehu~ mohi para jaum hara gauri pasau| tau phura hau jo kaheu~ saba
    bhasha bhaniti prabhau || || bandu~ avadha puri ati pavani| saraju sari kali kalusha nasavani || pranavu~
    pura nara nari bahori| mamata jinha para prabhuhi na thori || siya nindaka agha ogha nasae| loka bisoka
    banai basae || bandu~ kausalya disi praci| kirati jasu sakala jaga maci || pragateu jaha~ raghupati
    sasi caru| bisva sukhada khala kamala tusaru || dasaratha rau sahita saba rani| sukrita sumangala
    murati mani || karu~ pranama karama mana bani| karahu kripa suta sevaka jani || jinhahi biraci bara
    bhayu bidhata| mahima avadhi rama pitu mata || so bandu~ avadha bhuala satya prema jehi rama pada|
    bichurata dinadayala priya tanu trina iva parihareu || || pranavu~ parijana sahita bidehu| jahi rama
    pada gurha sanehu || joga bhoga maha~ rakheu goi| rama bilokata pragateu soi || pranavu~ prathama
    bharata ke carana| jasu nema brata jai na barana || rama carana pankaja mana jasu| lubudha madhupa
    iva taji na pasu || bandu~ lachimana pada jalajata| sitala subhaga bhagata sukha data || raghupati
    kirati bimala pataka| danda samana bhayu jasa jaka || sesha sahasrasisa jaga karana| jo avatareu bhumi
    bhaya tarana || sada so sanukula raha mo para| kripasindhu saumitri gunakara || ripusudana pada kamala
    namami| sura susila bharata anugami || mahavira binavu~ hanumana| rama jasu jasa apa bakhana || so
    pranavu~ pavanakumara khala bana pavaka gyanadhana| jasu hridaya agara basahim rama sara capa dhara
    || || kapipati richa nisacara raja| angadadi je kisa samaja || bandu~ saba ke carana suhae| adhama
    sarira rama jinha pae || raghupati carana upasaka jete| khaga mriga sura nara asura samete || bandu~
    pada saroja saba kere| je binu kama rama ke cere || suka sanakadi bhagata muni narada| je munibara
    bigyana bisarada || pranavu~ sabahim dharani dhari sisa| karahu kripa jana jani munisa || janakasuta
    jaga janani janaki| atisaya priya karuna nidhana ki || take juga pada kamala manavu~| jasu kripa~
    niramala mati pavu~ || puni mana bacana karma raghunayaka| carana kamala bandu~ saba layaka || rajivanayana
    dharem dhanu sayaka| bhagata bipati bhanjana sukha dayaka || do gira aratha jala bici sama kahiata
    bhinna na bhinna| badu~ sita rama pada jinhahi parama priya khinna || || bandu~ nama rama raghuvara
    ko| hetu krisanu bhanu himakara ko || bidhi hari haramaya beda prana so| aguna anupama guna nidhana
    so || mahamantra joi japata mahesu| kasim mukuti hetu upadesu || mahima jasu jana ganarau| prathama
    pujiata nama prabh || jana adikabi nama pratapu| bhayu suddha kari ulata japu || sahasa nama sama
    suni siva bani| japi jei piya sanga bhavani || harashe hetu heri hara hi ko| kiya bhushana tiya bhushana
    ti ko || nama prabhau jana siva niko| kalakuta phalu dinha ami ko || do barasha ritu raghupati bhagati
    tulasi sali sudasa || rama nama bara barana juga savana bhadava masa || || akhara madhura manohara
    dou| barana bilocana jana jiya jou || sumirata sulabha sukhada saba kahu| loka lahu paraloka nibahu
    || kahata sunata sumirata suthi nike| rama lakhana sama priya tulasi ke || baranata barana priti bilagati|
    brahma jiva sama sahaja sa~ghati || nara narayana sarisa subhrata| jaga palaka biseshi jana trata
    || bhagati sutiya kala karana bibhushana| jaga hita hetu bimala bidhu pushana | svada tosha sama sugati
    sudha ke| kamatha sesha sama dhara basudha ke || jana mana manju kanja madhukara se| jiha jasomati
    hari haladhara se || do eku chatru eku mukutamani saba baranani para jau| tulasi raghubara nama ke
    barana birajata dau || || samujhata sarisa nama aru nami| priti parasapara prabhu anugami || nama
    rupa dui isa upadhi| akatha anadi susamujhi sadhi || ko bara chota kahata aparadhu| suni guna bheda
    samujhihahim sadhu || dekhiahim rupa nama adhina| rupa gyana nahim nama bihina || rupa bisesha nama
    binu janem| karatala gata na parahim pahicanem || sumiria nama rupa binu dekhem| avata hridaya~ saneha
    biseshem || nama rupa gati akatha kahani| samujhata sukhada na parati bakhani || aguna saguna bica
    nama susakhi| ubhaya prabodhaka catura dubhashi || do rama nama manidipa dharu jiha dehari dvara|
    tulasi bhitara baherahu~ jaum cahasi ujiara || || nama jiha~ japi jagahim jogi| birati biranci prapanca
    biyogi || brahmasukhahi anubhavahim anupa| akatha anamaya nama na rupa || jana cahahim gurha gati
    jeu| nama jiha~ japi janahim teu || sadhaka nama japahim laya lae~| hohim siddha animadika pae~ ||
    japahim namu jana arata bhari| mitahim kusankata hohim sukhari || rama bhagata jaga cari prakara|
    sukriti cariu anagha udara || cahu catura kahu~ nama adhara| gyani prabhuhi biseshi piara || cahu~
    juga cahu~ shruti na prabh | kali biseshi nahim ana up sakala kamana hina je rama bhagati rasa lina|
    nama suprema piyusha hada tinhahu~ kie mana mina || || aguna saguna dui brahma sarupa| akatha agadha
    anadi anupa || morem mata bara namu duhu tem| kie jehim juga nija basa nija butem || prorhai sujana
    jani janahim jana ki| kahu~ pratiti priti ruci mana ki || eku darugata dekhia eku| pavaka sama juga
    brahma bibeku || ubhaya agama juga sugama nama tem| kaheu~ namu bara brahma rama tem || byapaku eku
    brahma abinasi| sata cetana dhana ana~da rasi || asa prabhu hridaya~ achata abikari| sakala jiva jaga
    dina dukhari || nama nirupana nama jatana tem| sau pragatata jimi mola ratana tem || do niraguna tem
    ehi bha~ti bara nama prabhau apara| kahu~ namu bara rama tem nija bicara anusara || || rama bhagata
    hita nara tanu dhari| sahi sankata kie sadhu sukhari || namu saprema japata anayasa| bhagata hohim
    muda mangala basa || rama eka tapasa tiya tari| nama koti khala kumati sudhari || rishi hita rama
    suketusuta ki| sahita sena suta kinha bibaki || sahita dosha dukha dasa durasa| dali namu jimi rabi
    nisi nasa || bhanjeu rama apu bhava capu| bhava bhaya bhanjana nama pratapu || dandaka banu prabhu
    kinha suhavana| jana mana amita nama kie pavana || | nisicara nikara dale raghunandana| namu sakala
    kali kalusha nikandana || do sabari gidha susevakani sugati dinhi raghunatha| nama udhare amita khala
    beda bidita guna gatha || || rama sukantha bibhishana dou| rakhe sarana jana sabu kou || nama gariba
    aneka nevaje| loka beda bara birida biraje || rama bhalu kapi kataku batora| setu hetu shramu kinha
    na thora || namu leta bhavasindhu sukhahim| karahu bicaru sujana mana mahim || rama sakula rana ravanu
    mara| siya sahita nija pura pagu dhara || raja ramu avadha rajadhani| gavata guna sura muni bara bani
    || sevaka sumirata namu sapriti| binu shrama prabala moha dalu jiti || phirata saneha~ magana sukha
    apanem| nama prasada soca nahim sapanem || do brahma rama tem namu bara bara dayaka bara dani| ramacarita
    sata koti maha~ liya mahesa jiya~ jani || pahala vishrama nama prasada sambhu abinasi| saju amangala
    mangala rasi || suka sanakadi siddha muni jogi| nama prasada brahmasukha bhogi || narada janeu nama
    pratapu| jaga priya hari hari hara priya apu || namu japata prabhu kinha prasadu| bhagata siromani
    bhe prahaladu || dhruva~ sagalani japeu hari n ~| payu acala anupama th ~ || sumiri pavanasuta pavana
    namu| apane basa kari rakhe ramu || apatu ajamilu gaju ganik | bhe mukuta hari nama prabh || kahaum
    kaha~ lagi nama baraai| ramu na sakahim nama guna gai || do namu rama ko kalapataru kali kalyana nivasu|
    jo sumirata bhayo bha~ga tem tulasi tulasidasu || || cahu~ juga tini kala tihu~ loka| bhe nama japi
    jiva bisoka || beda purana santa mata ehu| sakala sukrita phala rama sanehu || dhyanu prathama juga
    makhabidhi dujem| dvapara paritoshata prabhu pujem || kali kevala mala mula malina| papa payonidhi
    jana jana mina || nama kamataru kala karala| sumirata samana sakala jaga jala || rama nama kali abhimata
    data| hita paraloka loka pitu mata || nahim kali karama na bhagati bibeku| rama nama avalambana eku
    || kalanemi kali kapata nidhanu| nama sumati samaratha hanumanu || do rama nama narakesari kanakakasipu
    kalikala| japaka jana prahalada jimi palihi dali surasala || || bhaya~ kubhaya~ anakha alasahu~| nama
    japata mangala disi dasahu~ || sumiri so nama rama guna gatha| karu~ nai raghunathahi matha || mori
    sudharihi so saba bha~ti| jasu kripa nahim kripa~ aghati || rama susvami kusevaku moso| nija disi
    daikhi dayanidhi poso || lokahu~ beda susahiba ritim| binaya sunata pahicanata priti || gani gariba
    gramanara nagara| pandita murha malina ujagara || sukabi kukabi nija mati anuhari| nripahi sarahata
    saba nara nari || sadhu sujana susila nripala| isa amsa bhava parama kripala || suni sanamanahim sabahi
    subani| bhaniti bhagati nati gati pahicani || yaha prakrita mahipala subh | jana siromani kosalar
    || rijhata rama saneha nisotem| ko jaga manda malinamati motem || do satha sevaka ki priti ruci rakhihahim
    rama kripalu| upala kie jalajana jehim saciva sumati kapi bhalu || || hauhu kahavata sabu kahata rama
    sahata upahasa| sahiba sitanatha so sevaka tulasidasa || || ati barai mori dhithai khori| suni agha
    narakahu~ naka sakori || samujhi sahama mohi apadara apanem| so sudhi rama kinhi nahim sapanem ||
    suni avaloki sucita cakha cahi| bhagati mori mati svami sarahi || kahata nasai hoi hiya~ niki| rijhata
    rama jani jana ji ki || rahati na prabhu cita cuka kie ki| karata surati saya bara hie ki || jehim
    agha badheu byadha jimi bali| phiri sukantha soi kinha kucali || soi karatuti bibhishana keri| sapanehu~
    so na rama hiya~ heri || te bharatahi bhentata sanamane| rajasabha~ raghubira bakhane || do prabhu
    taru tara kapi dara para te kie apu samana || tulasi kahu~ na rama se sahiba silanidhana || || rama
    nikaim ravari hai sabahi ko nika| jom yaha sa~ci hai sada tau niko tulasika || || ehi bidhi nija guna
    dosha kahi sabahi bahuri siru nai| baranu~ raghubara bisada jasu suni kali kalusha nasai || || jagabalika
    jo katha suhai| bharadvaja munibarahi sunai || kahihu~ soi sambada bakhani| sunahu~ sakala sajjana
    sukhu mani || sambhu kinha yaha carita suhava| bahuri kripa kari umahi sunava || soi siva kagabhusundihi
    dinha| rama bhagata adhikari cinha || tehi sana jagabalika puni pava| tinha puni bharadvaja prati
    gava || te shrota bakata samasila| sava~darasi janahim harilila || janahim tini kala nija gyana| karatala
    gata amalaka samana || auru je haribhagata sujana| kahahim sunahim samujhahim bidhi nana || do mai
    puni nija gura sana suni katha so sukarakheta| samujhi nahi tasi balapana taba ati raheu~ aceta ||
    || shrota bakata gyananidhi katha rama kai gurha| kimi samujhaum mai jiva jara kali mala grasita bimurha
    || tadapi kahi gura barahim bara| samujhi pari kachu mati anusara || bhashabaddha karabi maim soi|
    morem mana prabodha jehim hoi || jasa kachu budhi bibeka bala merem| tasa kahihu~ hiya~ hari ke prerem
    || nija sandeha moha bhrama harani| karu~ katha bhava sarita tarani || budha bishrama sakala jana
    ranjani| ramakatha kali kalusha bibhanjani || ramakatha kali pannaga bharani| puni bibeka pavaka kahu~
    arani || ramakatha kali kamada gai| sujana sajivani muri suhai || soi basudhatala sudha tarangini|
    bhaya bhanjani bhrama bheka bhuangini || asura sena sama naraka nikandini| sadhu bibudha kula hita
    girinandini || santa samaja payodhi rama si| bisva bhara bhara acala chama si || jama gana muha~ masi
    jaga jamuna si| jivana mukuti hetu janu kasi || ramahi priya pavani tulasi si| tulasidasa hita hiya~
    hulasi si || sivapraya mekala saila suta si| sakala siddhi sukha sampati rasi || sadaguna suragana
    amba aditi si| raghubara bhagati prema paramiti si || do rama katha mandakini citrakuta cita caru|
    tulasi subhaga saneha bana siya raghubira biharu || || rama carita cintamani caru| santa sumati tiya
    subhaga singaru || jaga mangala guna grama rama ke| dani mukuti dhana dharama dhama ke || sadagura
    gyana biraga joga ke| bibudha baida bhava bhima roga ke || janani janaka siya rama prema ke| bija
    sakala brata dharama nema ke || samana papa santapa soka ke| priya palaka paraloka loka ke || saciva
    subhata bhupati bicara ke| kumbhaja lobha udadhi apara ke || kama koha kalimala karigana ke| kehari
    savaka jana mana bana ke || atithi pujya priyatama purari ke| kamada ghana darida davari ke || mantra
    mahamani bishaya byala ke| metata kathina kuanka bhala ke || harana moha tama dinakara kara se| sevaka
    sali pala jaladhara se || abhimata dani devataru bara se| sevata sulabha sukhada hari hara se || sukabi
    sarada nabha mana udagana se| ramabhagata jana jivana dhana se || sakala sukrita phala bhuri bhoga
    se| jaga hita nirupadhi sadhu loga se || sevaka mana manasa marala se| pavaka ganga tamraga mala se
    || do kupatha kutaraka kucali kali kapata dambha pashanda| dahana rama guna grama jimi indhana anala
    pracanda || || ramacarita rakesa kara sarisa sukhada saba kahu| sajjana kumuda cakora cita hita biseshi
    bara lahu || || kinhi prasna jehi bha~ti bhavani| jehi bidhi sankara kaha bakhani || so saba hetu
    kahaba maim gai| kathaprabandha bicitra banai || jehi yaha katha suni nahim hoi| jani acaraju karaim
    suni soi || katha alaukika sunahim je gyani| nahim acaraju karahim asa jani || ramakatha kai miti
    jaga nahim| asi pratiti tinha ke mana mahim || nana bha~ti rama avatara| ramayana sata koti apara
    || kalapabheda haricarita suhae| bha~ti aneka munisanha gae || karia na samsaya asa ura ani| sunia
    katha sarada rati mani || do rama ananta ananta guna amita katha bistara| suni acaraju na manihahim
    jinha kem bimala bicara || || ehi bidhi saba samsaya kari duri| sira dhari gura pada pankaja dhuri
    || puni sabahi binavu~ kara jori| karata katha jehim laga na khori || sadara sivahi nai aba matha|
    baranu~ bisada rama guna gatha || sambata soraha sai ekatisa| karu~ katha hari pada dhari sisa ||
    naumi bhauma bara madhu masa| avadhapurim yaha carita prakasa || jehi dina rama janama shruti gavahim|
    tiratha sakala taha~ cali avahim || asura naga khaga nara muni deva| ai karahim raghunayaka seva ||
    janma mahotsava racahim sujana| karahim rama kala kirati gana || do majjahi sajjana brinda bahu pavana
    saraju nira| japahim rama dhari dhyana ura sundara syama sarira || || darasa parasa majjana aru pana|
    hari papa kaha beda purana || nadi punita amita mahima ati| kahi na saki sarada bimalamati || rama
    dhamada puri suhavani| loka samasta bidita ati pavani || cari khani jaga jiva apara| avadha taje tanu
    nahi samsara || saba bidhi puri manohara jani| sakala siddhiprada mangala khani || bimala katha kara
    kinha arambha| sunata nasahim kama mada dambha || ramacaritamanasa ehi nama| sunata shravana paia
    bishrama || mana kari vishaya anala bana jari| hoi sukhi jau ehim sara pari || ramacaritamanasa muni
    bhavana| biraceu sambhu suhavana pavana || tribidha dosha dukha darida davana| kali kucali kuli kalusha
    nasavana || raci mahesa nija manasa rakha| pai susamu siva sana bhasha || tatem ramacaritamanasa bara|
    dhareu nama hiya~ heri harashi hara || kahu~ katha soi sukhada suhai| sadara sunahu sujana mana lai
    || do jasa manasa jehi bidhi bhayu jaga pracara jehi hetu| aba soi kahu~ prasanga saba sumiri uma
    brishaketu || || sambhu prasada sumati hiya~ hulasi| ramacaritamanasa kabi tulasi || kari manohara
    mati anuhari| sujana sucita suni lehu sudhari || sumati bhumi thala hridaya agadhu| beda purana udadhi
    ghana sadhu || barashahim rama sujasa bara bari| madhura manohara mangalakari || lila saguna jo kahahim
    bakhani| soi svacchata kari mala hani || prema bhagati jo barani na jai| soi madhurata susitalatai
    || so jala sukrita sali hita hoi| rama bhagata jana jivana soi || medha mahi gata so jala pavana|
    sakili shravana maga caleu suhavana || bhareu sumanasa suthala thirana| sukhada sita ruci caru cirana
    || do suthi sundara sambada bara birace buddhi bicari| tei ehi pavana subhaga sara ghata manohara
    cari || || sapta prabandha subhaga sopana| gyana nayana nirakhata mana mana || raghupati mahima aguna
    abadha| baranaba soi bara bari agadha || rama siya jasa salila sudhasama| upama bici bilasa manorama
    || purini saghana caru caupai| juguti manju mani sipa suhai || chanda soratha sundara doha| soi bahuranga
    kamala kula soha || aratha anupa sumava subhasa| soi paraga makaranda subasa || sukrita punja manjula
    ali mala| gyana biraga bicara marala || dhuni avareba kabita guna jati| mina manohara te bahubha~ti
    || aratha dharama kamadika cari| kahaba gyana bigyana bicari || nava rasa japa tapa joga biraga| te
    saba jalacara caru taraaga || sukriti sadhu nama guna gana| te bicitra jala bihaga samana || santasabha
    cahu~ disi ava~rai| shraddha ritu basanta sama gai || bhagati nirupana bibidha bidhana| chama daya
    dama lata bitana || sama jama niyama phula phala gyana| hari pata rati rasa beda bakhana || auru katha
    aneka prasanga| tei suka pika bahubarana bihanga || do pulaka batika baga bana sukha subihanga biharu|
    mali sumana saneha jala sincata locana caru || || je gavahim yaha carita sa~bhare| tei ehi tala catura
    rakhavare || sada sunahim sadara nara nari| tei surabara manasa adhikari || ati khala je bishi baga
    kaga| ehim sara nikata na jahim abhaga || sambuka bheka sevara samana| iha~ na bishaya katha rasa
    nana || tehi karana avata hiya~ hare| kami kaka balaka bicare || avata ehim sara ati kathinai| rama
    kripa binu ai na jai || kathina kusanga kupantha karala| tinha ke bacana bagha hari byala || griha
    karaja nana janjala| te ati durgama saila bisala || bana bahu bishama moha mada mana| nadim kutarka
    bhayankara nana || do je shraddha sambala rahita nahi santanha kara satha| tinha kahu~ manasa agama
    ati jinhahi na priya raghunatha || || jaum kari kashta jai puni koi| jatahim ninda juraai hoi || jarata
    jara bishama ura laga| gehu~ na majjana pava abhaga || kari na jai sara majjana pana| phiri avi sameta
    abhimana || jaum bahori kau puchana ava| sara ninda kari tahi bujhava || sakala bighna byapahi nahim
    tehi| rama sukripa~ bilokahim jehi || soi sadara sara majjanu kari| maha ghora trayatapa na jari ||
    te nara yaha sara tajahim na k | jinha ke rama carana bhala bh || jo nahai caha ehim sara bhai| so
    satasanga karu mana lai || asa manasa manasa cakha cahi| bhi kabi buddhi bimala avagahi || bhayu hridaya~
    ananda uchahu| umageu prema pramoda prabahu || cali subhaga kabita sarita so| rama bimala jasa jala
    bharita so || saraju nama sumangala mula| loka beda mata manjula kula || nadi punita sumanasa nandini|
    kalimala trina taru mula nikandini || do shrota tribidha samaja pura grama nagara duhu~ kula| santasabha
    anupama avadha sakala sumangala mula || || ramabhagati surasaritahi jai| mili sukirati saraju suhai
    || sanuja rama samara jasu pavana| mileu mahanadu sona suhavana || juga bica bhagati devadhuni dhara|
    sohati sahita subirati bicara || tribidha tapa trasaka timuhani| rama sarupa sindhu samuhani || manasa
    mula mili surasarihi| sunata sujana mana pavana karihi || bica bica katha bicitra bibhaga| janu sari
    tira tira bana baga || uma mahesa bibaha barati| te jalacara aganita bahubha~ti || raghubara janama
    ananda badhai| bhava~ra taranga manoharatai || do balacarita cahu bandhu ke banaja bipula bahuranga|
    nripa rani parijana sukrita madhukara baribihanga || || siya svayambara katha suhai| sarita suhavani
