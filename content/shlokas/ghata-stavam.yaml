id: ghata-stavam
category: stotram
name:
  english: Ghata Stavam
content:
  english: anandamantharapurandaramuktamalyam maulau hathena nihitam mahishasurasya | padambujam bhavatu
    me vijayaya manju manjirashinjitamanoharamambikayah || || devi tryambakapatni parvati sati trailokyamatah
    shive sharvani tripure mridani varade rudrani katyayani | bhime bhairavi candi sharvarikale kalakshaye
    shulini tvatpadapranatanananyamanasah paryakulanpahi nah || || devi tvam sakrideva yah pranamati kshonibhritastam
    nama ntyajanmasphuradanghripithaviluthatkotirakoticchatah | yastvamarcati so'rcyate suraganairyah
    stauti sa stuyate yastvam dhyayati tam smarartividhura dhyayanti vamabhruvah || || unmatta iva sagraha
    iva vishavyasaktamurcha iva praptapraudhamada ivartivirahagrasta ivarta iva | ye dhyayanti hi shailarajatanayam
    dhanyasta evagratah tyaktopadhivivriddharagamanaso dhyayanti tansubhruvah || || dhyayanti ye kshanamapi
    tripure hridi tvam lavanyayauvanadhanairapi viprayuktah | te visphuranti lalitayatalocananam cittaikabhittilikhitapratimah
    pumamsah || || etam kim nu drisha pibamyuta vishamyasyangamangairnijaih kim va'mum nigaramyanena sahasa
    kim vaikatamashraye | yasyettham vivasho vikalpalalitakutena yoshijjanah kim tadyanna karoti devi
    hridaye yasya tvamavartase || || vishvavyapini yadvadishvara iti sthanavananyashrayah shabdah shaktiriti
    trilokajanani tvayyeva tathyasthitih | ittham satyapi shaknuvanti yadimah kshudra rujo badhitum tvadbhaktanapi
    na kshinoshi ca rusha taddevi citram mahat || || indormadhyagatam mrigankasadrishacchayam manoharinim
    pandutphullasaroruhasanagata snigdhapradipacchavim | varshantimamritam bhavani bhavatim dhyayanti
    ye dehinah te nirmuktarujo bhavanti ripavah projjhanti tanduratah || || purnendoh shakalairivatibahalaih
    piyushapurairiva kshirabdherlaharibharairiva sudhapankasya pindairiva | praleyairiva nirmitam tava
    vapurdhyayanti ye shraddhaya cittantarnihitartitapavipadaste sampadam bibhrati || || ye samsmaranti
    taralam sahasollasantim tvam granthipancakabhidam tarunarkashonam | ragarnave bahalaragini majjayantim
    kritsnam jagaddadhati cetasi tanmrigakshyah || || laksharasasnapitapankajatantutanvim antah smaratyanudinam
    bhavatim bhavani | yastam smarapratimamapratimasvarupah netrotpalairmrigadrisho bhrishamarcayanti
    || || stumastvam vacamavyaktam himakundendurocisham | kadambamalam bibhranamapadatalalambinim || ||
    murdhnindoh sitapankajasanagatam praleyapandutvisham varshantimamritam saroruhabhuvo vaktre'pi randhre'pi
    ca | acchinna ca manohara ca lalita catiprasannapi ca tvamevam smaratah smararidayite vaksarvato valgati
    || || dadatishtanbhogan kshapayati ripunhanti vipado dahatyadhinvyadhin shamayati sukhani pratanute
    | hathadantarduhkham dalayati pinashtishtaviraham sakriddhyata devi kimiva niravadyam na kurute ||
    || yastvam dhyayati vetti vindati japatyalokate cintaya tyanveti pratipadyate kalayati stautyashrayatyarcati
    | yashca tryambakavallabhe tava gunanakarnayatyadarat tasya shrirna grihadapaiti vijayastasyagrato
    dhavati || || kim kim duhkham danujadalini kshiyate na smritayam ka ka kirtih kulakamalini khyapyate
    na stutayam | ka ka siddhih suravaranute prapyate narcitayam kam kam yogam tvayi na cinute cittamalambitayam
    || || ye devi durdharakritantamukhantarasthah ye kali kalaghanapashanitantabaddhah | ye candi candagurukalmashasindhumagnah
    tanpasi mocayasi tarayasi smritaiva || || lakshmivashikaranacurnasahodarani tvatpadapankajarajamsi
    ciram jayanti | yani pranamamilitani nrinam lalate lumpanti daivalikhitani duraksharani || || re mudhah
    kimayam vrithaiva tapasa kayah pariklishyate yajnairva bahudakshinaih kimitare riktikriyante grihah
    | bhaktishcedavinashini bhagavatipadadvayi sevyatam unnidramburuhatapatrasubhaga lakshmih puro dhavati
    || || yace na kancana na kancana vancayami seve na kancana nirastasamastadainyah | shlakshnam vase
    madhuramadmi bhaje varastrih devi hridi sphurati me kulakamadhenuh || || namami yamininathalekhalankritakuntalam
    | bhavanim bhavasantapanirvapanasudhanadim || || iti shrikalidasa viracita pancastavyam tritiyah ghatastavah
    |
  devanagari: आनन्दमन्थरपुरन्दरमुक्तमाल्यं मौलौ हठेन निहितं महिषासुरस्य । पादाम्बुजं भवतु मे विजयाय मञ्जु
    मञ्जीरशिञ्जितमनोहरमम्बिकायाः ॥ ॥ देवि त्र्यम्बकपत्नि पार्वति सति त्रैलोक्यमातः शिवे शर्वाणि त्रिपुरे
    मृडानि वरदे रुद्राणि कात्यायनि । भीमे भैरवि चण्डि शर्वरिकले कालक्षये शूलिनि त्वत्पादप्रणताननन्यमनसः
    पर्याकुलान्पाहि नः ॥ ॥ देवि त्वां सकृदेव यः प्रणमति क्षोणीभृतस्तं नम न्त्याजन्मस्फुरदङ्घ्रिपीठविलुठत्कोटीरकोटिच्छटाः
    । यस्त्वामर्चति सोऽर्च्यते सुरगणैर्यः स्तौति स स्तूयते यस्त्वां ध्यायति तं स्मरार्तिविधुरा ध्यायन्ति
    वामभ्रुवः ॥ ॥ उन्मत्ता इव सग्रहा इव विषव्यासक्तमूर्छा इव प्राप्तप्रौढमदा इवार्तिविरहग्रस्ता इवार्ता
    इव । ये ध्यायन्ति हि शैलराजतनयां धन्यास्त एवाग्रतः त्यक्तोपाधिविवृद्धरागमनसो ध्यायन्ति तान्सुभ्रुवः
    ॥ ॥ ध्यायन्ति ये क्षणमपि त्रिपुरे हृदि त्वां लावण्ययौवनधनैरपि विप्रयुक्ताः । ते विस्फुरन्ति ललितायतलोचनानां
    चित्तैकभित्तिलिखितप्रतिमाः पुमांसः ॥ ॥ एतं किं नु दृशा पिबाम्युत विशाम्यस्याङ्गमङ्गैर्निजैः किं वाऽमुं
    निगराम्यनेन सहसा किं वैकतामाश्रये । यस्येत्थं विवशो विकल्पललिताकूतेन योषिज्जनः किं तद्यन्न करोति देवि
    हृदये यस्य त्वमावर्तसे ॥ ॥ विश्वव्यापिनि यद्वदीश्वर इति स्थाणावनन्याश्रयः शब्दः शक्तिरिति त्रिलोकजननि
    त्वय्येव तथ्यस्थितिः । इत्थं सत्यपि शक्नुवन्ति यदिमाः क्षुद्रा रुजो बाधितुं त्वद्भक्तानपि न क्षिणोषि
    च रुषा तद्देवि चित्रं महत् ॥ ॥ इन्दोर्मध्यगतां मृगाङ्कसदृशच्छायां मनोहारिणीं पाण्डूत्फुल्लसरोरुहासनगता
    स्निग्धप्रदीपच्छविम् । वर्षन्तीममृतं भवानि भवतीं ध्यायन्ति ये देहिनः ते निर्मुक्तरुजो भवन्ति रिपवः
    प्रोज्झन्ति तान्दूरतः ॥ ॥ पूर्णेन्दोः शकलैरिवातिबहलैः पीयूषपूरैरिव क्षीराब्धेर्लहरीभरैरिव सुधापङ्कस्य
    पिण्डैरिव । प्रालेयैरिव निर्मितं तव वपुर्ध्यायन्ति ये श्रद्धया चित्तान्तर्निहितार्तितापविपदस्ते सम्पदं
    बिभ्रति ॥ ॥ ये संस्मरन्ति तरलां सहसोल्लसन्तीं त्वां ग्रन्थिपञ्चकभिदं तरुणार्कशोणाम् । रागार्णवे बहलरागिणि
    मज्जयन्तीं कृत्स्नं जगद्दधति चेतसि तान्मृगाक्ष्यः ॥ ॥ लाक्षारसस्नपितपङ्कजतन्तुतन्वीं अन्तः स्मरत्यनुदिनं
    भवतीं भवानि । यस्तं स्मरप्रतिममप्रतिमस्वरूपाः नेत्रोत्पलैर्मृगदृशो भृशमर्चयन्ति ॥ ॥ स्तुमस्त्वां वाचमव्यक्तां
    हिमकुन्देन्दुरोचिषम् । कदम्बमालां बिभ्राणामापादतललम्बिनीम् ॥ ॥ मूर्ध्नीन्दोः सितपङ्कजासनगतां प्रालेयपाण्डुत्विषं
    वर्षन्तीममृतं सरोरुहभुवो वक्त्रेऽपि रन्ध्रेऽपि च । अच्छिन्ना च मनोहरा च ललिता चातिप्रसन्नापि च त्वामेवं
    स्मरतः स्मरारिदयिते वाक्सर्वतो वल्गति ॥ ॥ ददातीष्टान्भोगान् क्षपयति रिपून्हन्ति विपदो दहत्याधीन्व्याधीन्
    शमयति सुखानि प्रतनुते । हठादन्तर्दुःखं दलयति पिनष्टीष्टविरहं सकृद्ध्याता देवी किमिव निरवद्यं न कुरुते
    ॥ ॥ यस्त्वां ध्यायति वेत्ति विन्दति जपत्यालोकते चिन्तय त्यन्वेति प्रतिपद्यते कलयति स्तौत्याश्रयत्यर्चति
    । यश्च त्र्यम्बकवल्लभे तव गुणानाकर्णयत्यादरात् तस्य श्रीर्न गृहादपैति विजयस्तस्याग्रतो धावति ॥ ॥ किं
    किं दुःखं दनुजदलिनि क्षीयते न स्मृतायां का का कीर्तिः कुलकमलिनि ख्याप्यते न स्तुतायाम् । का का सिद्धिः
    सुरवरनुते प्राप्यते नार्चितायां कं कं योगं त्वयि न चिनुते चित्तमालम्बितायाम् ॥ ॥ ये देवि दुर्धरकृतान्तमुखान्तरस्थाः
    ये कालि कालघनपाशनितान्तबद्धाः । ये चण्डि चण्डगुरुकल्मषसिन्धुमग्नाः तान्पासि मोचयसि तारयसि स्मृतैव
    ॥ ॥ लक्ष्मीवशीकरणचूर्णसहोदराणि त्वत्पादपङ्कजरजांसि चिरं जयन्ति । यानि प्रणाममिलितानि नृणां ललाटे लुम्पन्ति
    दैवलिखितानि दुरक्षराणि ॥ ॥ रे मूढाः किमयं वृथैव तपसा कायः परिक्लिश्यते यज्ञैर्वा बहुदक्षिणैः किमितरे
    रिक्तीक्रियन्ते गृहाः । भक्तिश्चेदविनाशिनी भगवतीपादद्वयी सेव्यतां उन्निद्राम्बुरुहातपत्रसुभगा लक्ष्मीः
    पुरो धावति ॥ ॥ याचे न कञ्चन न कञ्चन वञ्चयामि सेवे न कञ्चन निरस्तसमस्तदैन्यः । श्लक्ष्णं वसे मधुरमद्मि
    भजे वरस्त्रीः देवी हृदि स्फुरति मे कुलकामधेनुः ॥ ॥ नमामि यामिनीनाथलेखालङ्कृतकुन्तलाम् । भवानीं भवसन्तापनिर्वापणसुधानदीम्
    ॥ ॥ इति श्रीकालिदास विरचित पञ्चस्तव्यां तृतीयः घटस्तवः ।
