id: ramakrishnastotram-7
category: stotram
name:
  english: ramakrishnastotram 7
  devanagari: रामकृष्णस्तोत्रम् ७
content:
  english: shriramakrishnastotram dinanathah sadanando bhrajamano svatejasa | kalidosha samakranta samuddharana
    vanchaya || 1|| mahashaktim samashritya tvamagato nijecchaya | namo'stu gurave tubhyam ramakrishna
    svarupine || 2|| yo ramah sa hi krishnastu tvayyabhedah pradrishyate | lokashiksha pradanarthamagatastvam
    mahitale || 3|| karunarnava bho deva
  devanagari: श्रीरामकृष्णस्तोत्रम् दीनानाथः सदानन्दो भ्राजमानो स्वतेजसा । कलिदोष समाक्रान्त समुद्धरण
    वाञ्छया ॥ १॥ महाशक्तिं समाश्रित्य त्वमागतो निजेच्छया । नमोऽस्तु गुरवे तुभ्यं रामकृष्ण स्वरूपिणे ॥
    २॥ यो रामः स हि कृष्णस्तु त्वय्यभेदः प्रदृश्यते । लोकशिक्षा प्रदानार्थमागतस्त्वं महीतले ॥ ३॥ करुणार्णव
    भो देव
meaning: {}
