id: vishnukritam9shivastotram
category: stotram
name:
  english: vishnukritam9shivastotram
  devanagari: विष्णुकृतं९शिवस्तोत्रम्
content:
  english: jaya tribhuvanadhisha jaya gangadhara prabho | jaya natha virupaksha jaya candrarddhashekhara
    || 1|| avyajamamitam shambho karunyam tava varddhate | yena nirdhutamakhilam bhakteshu jnanamahitam
    || 2|| palanam sarvavidyanam prapanam bhutisancayaih | puranam ca saputranam pitureva pravardhanam
    || 3|| shatanamapi murtinamekamapi navaih stavaih | stotum na shaknumeshana samavayastu kim punah
    || 4|| tvameva tvamalam vettum yadi va tvatprasadatah | bhramarah kitamakrishya svatmanam kim na canayet
    || 5|| devastvadamshasambhutiprabhavo na bhavanti kim | apyayasyagnikilasya dahe shaktirna kim bhavet
    || 6|| deshakalakriyayogadyathagnerbhedasambhavah | tatha vishayabhedena tvameko'pi vibhidyase ||
    7|| anugrahaparo deva murtim darshaya shankara | avayorakhiladhara nayananandadayinim || 8|| iti shriskandapurane
    maheshvarakhande arunacalamahatmye purvardhe dvitiyadhyayantargatam vishnukritam shivastotram samaptam
    | skandapurana | maheshvarakhanda | arunakhanda | purvakhanda | adhyaya 2
  devanagari: जय त्रिभुवनाधीश जय गङ्गाधर प्रभो । जय नाथ विरूपाक्ष जय चन्द्रार्द्धशेखर ॥ १॥ अव्याजममितं
    शम्भो कारुण्यं तव वर्द्धते । येन निर्धूतमखिलं भक्तेषु ज्ञानमाहितम् ॥ २॥ पालनं सर्वविद्यानां प्रापणं
    भूतिसञ्चयैः । पुराणं च सपुत्राणां पितुरेव प्रवर्धनम् ॥ ३॥ शतानामपि मूर्तीनामेकामपि नवैः स्तवैः । स्तोतुं
    न शक्नुमेशान समवायस्तु किं पुनः ॥ ४॥ त्वमेव त्वामलं वेत्तुं यदि वा त्वत्प्रसादतः । भ्रमरः कीटमाकृष्य
    स्वात्मानं किं न चानयेत् ॥ ५॥ देवास्त्वदंशसम्भूतिप्रभवो न भवन्ति किम् । अप्यायस्याग्निकीलस्य दाहे
    शक्तिर्न किं भवेत् ॥ ६॥ देशकालक्रियायोगाद्यथाग्नेर्भेदसम्भवः । तथा विषयभेदेन त्वमेकोऽपि विभिद्यसे
    ॥ ७॥ अनुग्रहपरो देव मूर्तिं दर्शय शङ्कर । आवयोरखिलाधार नयनानन्ददायिनीम् ॥ ८॥ इति श्रीस्कन्दपुराणे
    माहेश्वरखण्डे अरुणाचलमाहात्म्ये पूर्वार्धे द्वितीयाध्यायान्तर्गतं विष्णुकृतं शिवस्तोत्रं समाप्तम्
    । स्कन्दपुराण । माहेश्वरखण्ड । अरुणाखण्ड । पूर्वखण्ड । अध्याय २
