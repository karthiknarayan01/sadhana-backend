id: kumbhatakakritamshivastotram
category: stotram
name:
  english: kumbhatakakritamshivastotram
  devanagari: कुम्भाटककृतंशिवस्तोत्रम्
content:
  english: kumbhatakakritam shivastotram tushtava parameshanam dharmam dharmabhritam varah | kumbhataka
    uvaca | namo namaste lokanamadikartre mahatmane || 55|| dharmakaraya saraya shrutinamatmane namah
    | tvam bhajantastatha bhaktya stuvanti tvam surasurah || 56|| dhyayanti yoginah svante tvameva ca
    paratparam | tvatkripalokakanikalabhamatrena jantavah || 57|| jagatkshobhayitum kartum tratum patutaro
    bhavan | tvanmukhannirgata veda maryadam vyaktayanti te || 58|| teshu teshu ca vartante tvadajnagauravaya
    te | yesham tvam vimukho deva te vai sidanti sarvada || 59|| tvadalambanayogena siddhayo'shtau na
    samshayah | aihikamushmikau margau tvatsrishtau lokahetave || 60|| namah purvaya purvanam purushaya
    mahatmane | vrishaya vrisharupaya vedarupaya te namah || 61|| tvacchaktya dharyate sarvam tvallilakalanatmakam
    | tvam vishnustvam shivo brahma tvam mitro varuno yamah || 62|| tvam gunaistrigunabhikhyam bibharshi
    kalaya svaya | prasida devadevesha prasida parameshvara || 63|| namo namah karanakaranaya te kalavisheshaih
    kalitakhilatmane || 64|| prasida vishveshvara vishvamurte prasida devesha dayasudhanidhe | iti stutva
    sa kumbhato bhaktya paravasho muhuh | pranamamamakarottasmai dandavat purato vibhoh || 66|| iti tamraparnimahatmye
    48
  devanagari: कुम्भाटककृतं शिवस्तोत्रम् तुष्टाव परमेशानं धर्मं धर्मभृतां वरः । कुम्भाटक उवाच । नमो नमस्ते
    लोकानामादिकर्त्रे महात्मने ॥ ५५॥ धर्माकाराय साराय श्रुतीनामात्मने नमः । त्वां भजन्तस्तथा भक्त्या स्तुवन्ति
    त्वां सुरासुराः ॥ ५६॥ ध्यायन्ति योगिनः स्वान्ते त्वामेव च परात्परम् । त्वत्कृपालोककणिकालाभमात्रेण
    जन्तवः ॥ ५७॥ जगत्क्षोभयितुं कर्तुं त्रातुं पटुतरो भवान् । त्वन्मुखान्निर्गता वेदा मर्यादां व्यक्तयन्ति
    ते ॥ ५८॥ तेषु तेषु च वर्तन्ते त्वदाज्ञागौरवाय ते । येषां त्वं विमुखो देव ते वै सीदन्ति सर्वदा ॥ ५९॥
    त्वदालम्बनयोगेन सिद्धयोऽष्टौ न संशयः । ऐहिकामुष्मिकौ मार्गौ त्वत्सृष्टौ लोकहेतवे ॥ ६०॥ नमः पूर्वाय
    पूर्वाणां पुरुषाय महात्मने । वृषाय वृषरूपाय वेदरूपाय ते नमः ॥ ६१॥ त्वच्छक्त्या धार्यते सर्वं त्वल्लीलाकलनात्मकम्
    । त्वं विष्णुस्त्वं शिवो ब्रह्मा त्वं मित्रो वरुणो यमः ॥ ६२॥ त्वं गुणैस्त्रिगुणाभिख्यां बिभर्षि कलया
    स्वया । प्रसीद देवदेवेश प्रसीद परमेश्वर ॥ ६३॥ नमो नमः कारणकारणाय ते कलाविशेषैः कलिताखिलात्मने ॥ ६४॥
    प्रसीद विश्वेश्वर विश्वमूर्ते प्रसीद देवेश दयासुधानिधे । इति स्तुत्वा स कुम्भाटो भक्त्या परवशो मुहुः
    । प्रणामममकरोत्तस्मै दण्डवत् पुरतो विभोः ॥ ६६॥ इति ताम्रपर्णीमाहात्म्ये ४८
