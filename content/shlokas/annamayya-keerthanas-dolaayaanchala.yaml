id: annamayya-keerthanas-dolaayaanchala
category: stotram
name:
  english: Annamayya Keerthanas Dolaayaanchala
content:
  english: adi pallavi dolayam cala dolayam hare dolayam || minakurma varaha mrigapati danavare gunashaure
    dharanidhara marujanaka || dolayam cala dolayam hare dolayam || caranam vamana rama rama varakrishna
    avatara | shyamalanga ranga ranga samajavarada muraharana || dolayam cala dolayam hare dolayam ||
    caranam daruna budda kaliki dashavidha shirapane gosamane shri venkatagirikutanilaya || dolayam cala
    dolayam hare dolayam ||
  devanagari: आदि पल्लवि डोलायां चल डोलायां हरे डोलायां ॥ मीनकूर्म वराहा मृगपति दानवारे गुणशौरे धरणिधर
    मरुजनक ॥ डोलायां चल डोलायां हरे डोलायां ॥ चरणं वामन राम राम वरकृष्ण अवतारा । श्यामलाङ्गा रङ्ग रङ्गा
    सामजवरद मुरहरण ॥ डोलायां चल डोलायां हरे डोलायां ॥ चरणं दारुण बुद्द कलिकि दशविध शीरपाणे गोसमाणे श्री
    वेङ्कटगिरिकूटनिलय ॥ डोलायां चल डोलायां हरे डोलायां ॥
