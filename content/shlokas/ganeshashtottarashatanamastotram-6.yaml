id: ganeshashtottarashatanamastotram-6
category: stotram
name:
  english: ganeshashtottarashatanamastotram 6
  devanagari: गणेशाष्टोत्तरशतनामस्तोत्रम् ६
content:
  english: ikshusagaramadhyastho nijalokanivasakrit | svanandabhavanadhisho nijanandagrihasthitah || 1||
    cintamanimandapastho divyasimhasanashrayah | padmakinjalkasamvishtah svayanjyotissvarupavan || 2||
    tivrashirodhritapado jvalinimaulilalitah | nandananditapithashrih bhogadabhushitasanah || 3|| sakamadayinipithah
    sphuradugrasanashrayah | tejovatishiroratnam satyanityavatamsitah || 4|| savighnanashinipithah sarvashaktyambuje
    sthitah | jyotirmadhye sukhasinah tattvampadasuvigrahah || 5|| japakusumasankashah shundadandavirajitah
    | gajanano brahmamurddha jagaddehashshucismitah || 6|| kutilalakashobhadhyah somasuryagnilocanah |
    phalacandrashshurpakarno dantadvayavirajitah || 7|| stabakakarakumbhagro lamboshtho lambanasikah |
    hrasvanetratrayo lambakarno nibidamastakah || 8|| kambukantho brihadbahuh pinavakshah picandilah |
    nimnanabhishcaturbahuh sthuloruh pronnamatkatih || 9|| shlishtajanuh pinajanghah padmapadadvayanvitah
    | unnataprapado gudhagulphassamvritaparshnikah || 10|| raktavastradharah pitaraktavastrottariyakah
    | hematantusamudbhutabrahmasutratrayanvitah || 11|| bhanukotipratikasharatnamaulivirajitah | ratnakundalashobhadhyah
    shurpashrutivibhushanah || 12|| dantalankarasamyuktah phalapattavirajitah | cintamaniratnamayakeyurakatakanvitah
    || 13|| cintamanisuracitarajamudranguliyakah | cintamanikanthabhusho ratnaharasamanvitah || 14|| cintamanyagrasamyuktakatisutravirajitah
    | shinjanamanimanjiraratnapadukasamyutah || 15|| durvashamyarkamandarakusumaissuvirajitah | sarvabharanashobhadhyah
    sugandhatilakojjvalah || 16|| raktagandhaviliptango raktamandaramalikah | pashankushaparashunam dharakah
    padmadharakah || 17|| pushkarasthasvarnaghatipurnaratnabhivarshakah | smitavaktrassundarango mridumanjulabhashakah
    || 18|| shvetatapatrarucirah shvetacamaravijitah | mahasiddhimahabuddhishobhiparshvadvayanvitah ||
    19|| gakaramastakopeto nakarajatharanvitah | ishapadadvayayuto nirgunabrahmavaktrakah || 20|| sagunabrahmadehadhyo
    nijanandakalebarah | samashtivyashtisamjnadhyabrahmakumbhasthalanvitah || 21|| trayimayanetradharo
    mahakaranashundakah | bindukanthassankhyakarnah caturbrahmabhujanvitah || 22|| jivabrahmapadayutah
    so'hambrahmavishanavan | bhuktimuktirupacintamanibhushanabhushitah || 23|| ganeshvaro ganakrido gananatho
    ganadhipah | vakratundashcaikarado gajavaktro mahodarah || 24|| lambodaro dhumravarno vikato vighnanayakah
    | vinayako mahavakyalabhyayogasukhatmakah || 25|| idamashtottarashatam namnam ganakakirtitam | yah
    pathedbhaktibhavena bhuktim muktim labhennarah || 26|| yah pujayedanenaiva svanandeshagajananam |
    durvankuraishshamipatraih shvetarkakusumaishca va || 27|| mandarakusumairvapi pushpairanyaishshubhakshataih
    | samprapya vipulan bhoganante brahmapadam vrajet || 28|| iti shriganeshashtottarashatanamastotram
  devanagari: इक्षुसागरमध्यस्थो निजलोकनिवासकृत् । स्वानन्दभवनाधीशो निजानन्दगृहस्थितः ॥ १॥ चिन्तामणिमण्डपस्थो
    दिव्यसिंहासनाश्रयः । पद्मकिञ्जल्कसंविष्टः स्वयञ्ज्योतिस्स्वरूपवान् ॥ २॥ तीव्राशिरोधृतपदो ज्वालिनीमौलिलालितः
    । नन्दानन्दितपीठश्रीः भोगदाभूषितासनः ॥ ३॥ सकामदायिनीपीठः स्फुरदुग्रासनाश्रयः । तेजोवतीशिरोरत्नं सत्यानित्यावतंसितः
    ॥ ४॥ सविघ्ननाशिनीपीठः सर्वशक्त्यम्बुजे स्थितः । ज्योतिर्मध्ये सुखासीनः तत्त्वम्पदसुविग्रहः ॥ ५॥ जपाकुसुमसङ्काशः
    शुण्डादण्डविराजितः । गजाननो ब्रह्ममूर्द्धा जगद्देहश्शुचिस्मितः ॥ ६॥ कुटिलालकशोभाढ्यः सोमसूर्याग्निलोचनः
    । फालचन्द्रश्शूर्पकर्णो दन्तद्वयविराजितः ॥ ७॥ स्तबकाकारकुम्भाग्रो लम्बोष्ठो लम्बनासिकः । ह्रस्वनेत्रत्रयो
    लम्बकर्णो निबिडमस्तकः ॥ ८॥ कम्बुकण्ठो बृहद्बाहुः पीनवक्षाः पिचण्डिलः । निम्ननाभिश्चतुर्बाहुः स्थूलोरुः
    प्रोन्नमत्कटिः ॥ ९॥ श्लिष्टजानुः पीनजङ्घः पद्मपादद्वयान्वितः । उन्नतप्रपदो गूढगुल्फस्संवृतपार्ष्णिकः
    ॥ १०॥ रक्तवस्त्रधरः पीतरक्तवस्त्रोत्तरीयकः । हेमतन्तुसमुद्भूतब्रह्मसूत्रत्रयान्वितः ॥ ११॥ भानुकोटिप्रतीकाशरत्नमौलिविराजितः
    । रत्नकुण्डलशोभाढ्यः शूर्पश्रुतिविभूषणः ॥ १२॥ दन्तालङ्कारसंयुक्तः फालपट्टविराजितः । चिन्तामणीरत्नमयकेयूरकटकान्वितः
    ॥ १३॥ चिन्तामणीसुरचितराजमुद्राङ्गुलीयकः । चिन्तामणीकण्ठभूषो रत्नहारसमन्वितः ॥ १४॥ चिन्तामण्यग्रसंयुक्तकटिसूत्रविराजितः
    । शिञ्जानमणिमञ्जीररत्नपादुकसंयुतः ॥ १५॥ दूर्वाशम्यर्कमन्दारकुसुमैस्सुविराजितः । सर्वाभरणशोभाढ्यः सुगन्धतिलकोज्ज्वलः
    ॥ १६॥ रक्तगन्धविलिप्ताङ्गो रक्तमन्दारमालिकः । पाशाङ्कुशपरशूनां धारकः पद्मधारकः ॥ १७॥ पुष्करस्थस्वर्णघटीपूर्णरत्नाभिवर्षकः
    । स्मितवक्त्रस्सुन्दराङ्गो मृदुमञ्जुलभाषकः ॥ १८॥ श्वेतातपत्ररुचिरः श्वेतचामरवीजितः । महासिद्धिमहाबुद्धिशोभिपार्श्वद्वयान्वितः
    ॥ १९॥ गकारमस्तकोपेतो णकारजठरान्वितः । ईशपादद्वययुतो निर्गुणब्रह्मवक्त्रकः ॥ २०॥ सगुणब्रह्मदेहाढ्यो
    निजानन्दकलेबरः । समष्टिव्यष्टिसंज्ञाढ्यब्रह्मकुम्भस्थलान्वितः ॥ २१॥ त्रयीमयनेत्रधरो महाकारणशुण्डकः
    । बिन्दुकण्ठस्साङ्ख्यकर्णः चतुर्ब्रह्मभुजान्वितः ॥ २२॥ जीवब्रह्मपादयुतः सोऽहम्ब्रह्मविषाणवान् । भुक्तिमुक्तिरूपचिन्तामणिभूषणभूषितः
    ॥ २३॥ गणेश्वरो गणक्रीडो गणनाथो गणाधिपः । वक्रतुण्डश्चैकरदो गजवक्त्रो महोदरः ॥ २४॥ लम्बोदरो धूम्रवर्णो
    विकटो विघ्ननायकः । विनायको महावाक्यलभ्ययोगसुखात्मकः ॥ २५॥ इदमष्टोत्तरशतं नाम्नां गणककीर्तितम् । यः
    पठेद्भक्तिभावेन भुक्तिं मुक्तिं लभेन्नरः ॥ २६॥ यः पूजयेदनेनैव स्वानन्देशगजाननम् । दूर्वाङ्कुरैश्शमीपत्रैः
    श्वेतार्ककुसुमैश्च वा ॥ २७॥ मन्दारकुसुमैर्वापि पुष्पैरन्यैश्शुभाक्षतैः । सम्प्राप्य विपुलान् भोगानन्ते
    ब्रह्मपदं व्रजेत् ॥ २८॥ इति श्रीगणेशाष्टोत्तरशतनामस्तोत्रं
