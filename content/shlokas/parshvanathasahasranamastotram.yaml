id: parshvanathasahasranamastotram
category: sahasranama
name:
  english: parshvanathasahasranamastotram
  devanagari: पार्श्वनाथसहस्रनामस्तोत्रम्
content:
  english: dharmasarathirishvarah | dharmadhyaksho naradhisho dharmatma dharmadayakah || 5|| dharmavan
    dharmasenaniracintyo dhiradhirajah | dharmaghoshah prakashatma dharmi dharmaprarupakah || 6|| bahushruto
    bahubuddhirdharmarthi dharmavijjinah | devah sanatano'sango'nalpakantirmanoharah || 7|| shriman papaharo
    natho'nishvaro'bandhano'rajah | acintyatma'nagho viro'punarbhavo bhavojjhitah || 8|| svayambhuh shankaro
    bhushnuranuttaro jinottamah | vrishabhah saukhyado'svapno'nantajnani nararcitah || 9|| atmajno vishvavid
    bhavyo'nantadarshi jinadhipah | vishvavyapi jagatpalo vikrami viryavan parah || 10|| vishvabandhurameyatma
    vishveshvaro jagatpatih | vishveno vishvapo vidvan vishvanatho vibhuh prabhuh || 11|| arhat shatam
    || 100|| vitaragah prashantarirajaro vishvanayakah | vishvadbhuto nihsapatno vikashi vishvavishrutah
    || 1|| virakto vibudhaih sevyo vairangiko viragavan | pratikshyo vimalo dhiro vishvesho vitamatsarah
    || 2|| vikasvaro janashreshtho'rishtatatih shivankarah | vishvadrishva sadabhavi vishvago vishadashayah
    || 3|| vishishto vishvavikhyato vicakshano visharadah | vipakshavarjito'kamo vishved vishvaikavatsalah
    || 4|| vijayi janatabandhurvidyadata sadodayah | shantidah shasravicchambhuh shanto danto jitendriyah
    || 5|| varddhamano gatatankane vinayakojjhito'ksharah | alakshyo'bhishtado'kopo'nantajit vadatam varah
    || 6|| vimukto vishado'murto vijno vishala akshayah | amurtatma'vyayo dhiman tattvajno gatakalmushah
    || 7|| shantatma shashvato nityasrikalajnasrikalavit | trailokyapujito'vyakto vyaktavakyo vidam varah
    || 8|| sarvajnah satyavak siddhah somamurtih prakashakrit | siddhatma sarvadevesho'jayyo'meyarddhirasmarah
    || 9|| kshamayuktah kshamacancuh kshami sakshi puratanah | paramatma paratrata puranah paramadyutih
    || 10|| pavitrah paramanandah putavak parameshvarah | puto'jeyah paranjyotiraniho varado'rahah ||
    11|| vitaragashatam || 200|| tirthankarastatashlokastirtheshastirthamandanah | tattvamurttisankhyeyastirthakrit
    tirthanayakah || 1|| vitadambhah prasannatma tarakastirthalocanah | tirthendrastvagavan tyagi tattvavit
    tyaktasamsutih || 2|| tamoharta jitadveshastirthadhisho jagatpriyah | tirthapastirnasamsarastapahrit
    taralocanah || 3|| tattvatma jnanavit shreshtho jagannatho jagadvibhuh | jagajjaitro jagatkarta jagajjyeshtho
    jagadguru
  devanagari: धर्मसारथिरीश्वरः । धर्माध्यक्षो नराधीशो धर्मात्मा धर्मदायकः ॥ ५॥ धर्मवान् धर्मसेनानीरचिन्त्यो
    धीरधीरजः । धर्मघोषः प्रकाशात्मा धर्मी धर्मप्ररूपकः ॥ ६॥ बहुश्रुतो बहुबुद्धिर्धर्मार्थी धर्मविज्जिनः
    । देवः सनातनोऽसङ्गोऽनल्पकान्तिर्मनोहरः ॥ ७॥ श्रीमान् पापहरो नाथोऽनीश्वरोऽबन्धनोऽरजाः । अचिन्त्यात्माऽनघो
    वीरोऽपुनर्भवो भवोज्झितः ॥ ८॥ स्वयम्भूः शङ्करो भूष्णुरनुत्तरो जिनोत्तमः । वृषभः सौख्यदोऽस्वप्नोऽनन्तज्ञानी
    नरार्चितः ॥ ९॥ आत्मज्ञो विश्वविद् भव्योऽनन्तदर्शी जिनाधिपः । विश्वव्यापी जगत्पालो विक्रमी वीर्यवान्
    परः ॥ १०॥ विश्वबन्धुरमेयात्मा विश्वेश्वरो जगत्पतिः । विश्वेनो विश्वपो विद्वान् विश्वनाथो विभुः प्रभुः
    ॥ ११॥ अर्हत् शतम् ॥ १००॥ वीतरागः प्रशान्तारिरजरो विश्वनायकः । विश्वाद्भुतो निःसपत्नो विकाशी विश्वविश्रुतः
    ॥ १॥ विरक्तो विबुधैः सेव्यो वैरङ्गिको विरागवान् । प्रतीक्ष्यो विमलो धीरो विश्वेशो वीतमत्सरः ॥ २॥ विकस्वरो
    जनश्रेष्ठोऽरिष्टतातिः शिवङ्करः । विश्वदृश्वा सदाभावी विश्वगो विशदाशयः ॥ ३॥ विशिष्टो विश्वविख्यातो
    विचक्षणो विशारदः । विपक्षवर्जितोऽकामो विश्वेड् विश्वैकवत्सलः ॥ ४॥ विजयी जनताबन्धुर्विद्यादाता सदोदयः
    । शान्तिदः शास्रविच्छम्भुः शान्तो दान्तो जितेन्द्रियः ॥ ५॥ वर्द्धमानो गतातङ्कने विनायकोज्झितोऽक्षरः
    । अलक्ष्योऽभीष्टदोऽकोपोऽनन्तजित् वदतां वरः ॥ ६॥ विमुक्तो विशदोऽमूर्तो विज्ञो विशाल अक्षयः । अमूर्तात्माऽव्ययो
    धीमान् तत्त्वज्ञो गतकल्मुषः ॥ ७॥ शान्तात्मा शाश्वतो नित्यस्रिकालज्ञस्रिकालवित् । त्रैलोक्यपूजितोऽव्यक्तो
    व्यक्तवाक्यो विदां वरः ॥ ८॥ सर्वज्ञः सत्यवाक् सिद्धः सोममूर्तिः प्रकाशकृत् । सिद्धात्मा सर्वदेवेशोऽजय्योऽमेयर्द्धिरस्मरः
    ॥ ९॥ क्षमायुक्तः क्षमाचञ्चुः क्षमी साक्षी पुरातनः । परमात्मा परत्राता पुराणः परमद्युतिः ॥ १०॥ पवित्रः
    परमानन्दः पूतवाक् परमेश्वरः । पूतोऽजेयः परञ्ज्योतिरनीहो वरदोऽरहाः ॥ ११॥ वीतरागशतम् ॥ २००॥ तीर्थङ्करस्ततश्लोकस्तीर्थेशस्तीर्थमण्डनः
    । तत्त्वमूर्त्तिसङ्ख्येयस्तीर्थकृत् तीर्थनायकः ॥ १॥ वीतदम्भः प्रसन्नात्मा तारकस्तीर्थलोचनः । तीर्थेन्द्रस्त्वागवान्
    त्यागी तत्त्ववित् त्यक्तसंसूतिः ॥ २॥ तमोहर्ता जितद्वेषस्तीर्थाधीशो जगत्प्रियः । तीर्थपस्तीर्णसंसारस्तापहृत्
    तारलोचनः ॥ ३॥ तत्त्वात्मा ज्ञानवित् श्रेष्ठो जगन्नाथो जगद्विभुः । जगज्जैत्रो जगत्कर्ता जगज्ज्येष्ठो
    जगद्गुरु
