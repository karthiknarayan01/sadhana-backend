id: hanuman-chalisa
category: stotram
name:
  english: Hanuman Chalisa
content:
  english: doha shri guru carana saroja raja nijamana mukura sudhari | varanau raghuvara vimalayasha jo
    dayaka phalacari || buddhihina tanujanikai sumirau pavana kumara | bala buddhi vidya dehu mohi harahu
    kalesha vikara || dhyanam atulita baladhamam svarna shailabha deham | danuja vana krishanum jnanina
    magraganyam || sakala guna nidhanam vanarana madhisham | raghupati priya bhaktam vatajatam namami
    || goshpadikrita varashim mashakikrita rakshasam | ramayana mahamala ratnam vande nilatmajam || yatra
    yatra raghunatha kirtanam tatra tatra kritamastakanjalim | bhashpavari paripurna locanam marutim namata
    rakshasantakam || manojavam maruta tulyavegam | jitendriyam buddhimatam varishtham || vatatmajam vanarayutha
    mukhyam | shri rama dutam shirasa namami || caupai jaya hanumana jnana guna sagara | jaya kapisha
    tihu loka ujagara || || ramaduta atulita baladhama | anjani putra pavanasuta nama || || mahavira vikrama
    bajarangi | kumati nivara sumati ke sangi || || kancana varana viraja suvesha | kanana kundala kuncita
    kesha || || hathavajra au dhvaja virajai | kandhe munja janevu sajai || || shankara suvana kesari
    nandana | teja pratapa mahajaga vandana || || vidyavana guni ati catura | rama kaja karive ko atura
    || || prabhu caritra sunive ko rasiya | ramalakhana sita mana basiya || || sukshma rupadhari siyahi
    dikhava | vikata rupadhari lanka jalava || || bhima rupadhari asura samhare | ramacandra ke kaja samvare
    || || laya sanjivana lakhana jiyaye | shri raghuvira harashi uralaye || || raghupati kinhi bahuta
    badayi | tuma mama priya bharata sama bhayi || || sahasra vadana tumharo yashagavai | asa kahi shripati
    kantha lagavai || || sanakadika brahmadi munisha | narada sharada sahita ahisha || || yama kubera
    digapala jaham te | kavi kovida kahi sake kaham te || || tuma upakara sugrivahi kinha | rama milaya
    rajapada dinha || || tumharo mantra vibhishana mana | lankeshvara bhaye saba jaga jana || || yuga
    sahasra yojana para bhanu | lilyo tahi madhura phala janu || || prabhu mudrika meli mukha mahi | jaladhi
    langhi gaye acaraja nahi || || durgama kaja jagata ke jete | sugama anugraha tumhare tete || || rama
    duare tuma rakhavare | hota na ajna binu paisare || || saba sukha lahai tumhari sharana | tuma rakshaka
    kahu ko dara na || || apana teja samharo apai | tinom loka hanka te kampai || || bhuta pishaca nikata
    nahi avai | mahavira jaba nama sunavai || || nasai roga harai saba pira | japata nirantara hanumata
    vira || || sankata se hanumana chudavai | mana krama vacana dhyana jo lavai || || saba para rama tapasvi
    raja | tinake kaja sakala tuma saja || || aura manoratha jo koyi lavai | tasu amita jivana phala pavai
    || || caro yuga pratapa tumhara | hai parasiddha jagata ujiyara || || sadhu santa ke tuma rakhavare
    | asura nikandana rama dulare || || ashtasiddhi nava nidhi ke data | asa vara dinha janaki mata ||
    || rama rasayana tumhare pasa | sada raho raghupati ke dasa || tumhare bhajana ramako pavai | janma
    janma ke dukha bisaravai || || anta kala raghupati purajayi | jaham janma haribhakta kahayi || ||
    aura devata citta na dharayi | hanumata seyi sarva sukha karayi || tai mitai saba pira | jo sumirai
    hanumata bala vira || || jai jai jai hanumana gosayi | kripa karahu gurudeva ki nayi || || yaha shata
    vara patha kara koyi | chutahi bandi maha sukha hoyi || || jo yaha padai hanumana calisa | hoya siddhi
    sakhi gaurisha || || tulasidasa sada hari cera | kijai natha hridaya maha dera || || doha pavana tanaya
    sankata harana mangala murati rup | rama lakhana sita sahita hridaya basahu surabhup || siyavara ramacandraki
    jaya | pavanasuta hanumanaki jaya | bolo bhayi saba santanaki jaya |
  devanagari: दोहा श्री गुरु चरण सरोज रज निजमन मुकुर सुधारि । वरणौ रघुवर विमलयश जो दायक फलचारि ॥ बुद्धिहीन
    तनुजानिकै सुमिरौ पवन कुमार । बल बुद्धि विद्या देहु मोहि हरहु कलेश विकार ॥ ध्यानम् अतुलित बलधामं स्वर्ण
    शैलाभ देहम् । दनुज वन कृशानुं ज्ञानिना मग्रगण्यम् ॥ सकल गुण निधानं वानराणा मधीशम् । रघुपति प्रिय भक्तं
    वातजातं नमामि ॥ गोष्पदीकृत वाराशिं मशकीकृत राक्षसम् । रामायण महामाला रत्नं वन्दे निलात्मजम् ॥ यत्र
    यत्र रघुनाथ कीर्तनं तत्र तत्र कृतमस्तकाञ्जलिम् । भाष्पवारि परिपूर्ण लोचनं मारुतिं नमत राक्षसान्तकम्
    ॥ मनोजवं मारुत तुल्यवेगम् । जितेन्द्रियं बुद्धिमतां वरिष्ठम् ॥ वातात्मजं वानरयूथ मुख्यम् । श्री राम
    दूतं शिरसा नमामि ॥ चौपाई जय हनुमान ज्ञान गुण सागर । जय कपीश तिहु लोक उजागर ॥ ॥ रामदूत अतुलित बलधामा
    । अञ्जनि पुत्र पवनसुत नामा ॥ ॥ महावीर विक्रम बजरङ्गी । कुमति निवार सुमति के सङ्गी ॥ ॥ कञ्चन वरण विराज
    सुवेशा । कानन कुण्डल कुञ्चित केशा ॥ ॥ हाथवज्र औ ध्वजा विराजै । कान्धे मूञ्ज जनेवू साजै ॥ ॥ शङ्कर सुवन
    केसरी नन्दन । तेज प्रताप महाजग वन्दन ॥ ॥ विद्यावान गुणी अति चातुर । राम काज करिवे को आतुर ॥ ॥ प्रभु
    चरित्र सुनिवे को रसिया । रामलखन सीता मन बसिया ॥ ॥ सूक्ष्म रूपधरि सियहि दिखावा । विकट रूपधरि लङ्क जलावा
    ॥ ॥ भीम रूपधरि असुर संहारे । रामचन्द्र के काज संवारे ॥ ॥ लाय सञ्जीवन लखन जियाये । श्री रघुवीर हरषि
    उरलाये ॥ ॥ रघुपति कीन्ही बहुत बडायी । तुम मम प्रिय भरत सम भायी ॥ ॥ सहस्र वदन तुम्हरो यशगावै । अस कहि
    श्रीपति कण्ठ लगावै ॥ ॥ सनकादिक ब्रह्मादि मुनीशा । नारद शारद सहित अहीशा ॥ ॥ यम कुबेर दिगपाल जहां ते
    । कवि कोविद कहि सके कहां ते ॥ ॥ तुम उपकार सुग्रीवहि कीन्हा । राम मिलाय राजपद दीन्हा ॥ ॥ तुम्हरो मन्त्र
    विभीषण माना । लङ्केश्वर भये सब जग जाना ॥ ॥ युग सहस्र योजन पर भानू । लील्यो ताहि मधुर फल जानू ॥ ॥ प्रभु
    मुद्रिका मेलि मुख माही । जलधि लाङ्घि गये अचरज नाही ॥ ॥ दुर्गम काज जगत के जेते । सुगम अनुग्रह तुम्हरे
    तेते ॥ ॥ राम दुआरे तुम रखवारे । होत न आज्ञा बिनु पैसारे ॥ ॥ सब सुख लहै तुम्हारी शरणा । तुम रक्षक काहू
    को डर ना ॥ ॥ आपन तेज सम्हारो आपै । तीनों लोक हाङ्क ते काम्पै ॥ ॥ भूत पिशाच निकट नहि आवै । महवीर जब
    नाम सुनावै ॥ ॥ नासै रोग हरै सब पीरा । जपत निरन्तर हनुमत वीरा ॥ ॥ सङ्कट से हनुमान छुडावै । मन क्रम
    वचन ध्यान जो लावै ॥ ॥ सब पर राम तपस्वी राजा । तिनके काज सकल तुम साजा ॥ ॥ और मनोरथ जो कोयि लावै । तासु
    अमित जीवन फल पावै ॥ ॥ चारो युग प्रताप तुम्हारा । है परसिद्ध जगत उजियारा ॥ ॥ साधु सन्त के तुम रखवारे
    । असुर निकन्दन राम दुलारे ॥ ॥ अष्टसिद्धि नव निधि के दाता । अस वर दीन्ह जानकी माता ॥ ॥ राम रसायन तुम्हारे
    पासा । सदा रहो रघुपति के दासा ॥ तुम्हरे भजन रामको पावै । जन्म जन्म के दुख बिसरावै ॥ ॥ अन्त काल रघुपति
    पुरजायी । जहां जन्म हरिभक्त कहायी ॥ ॥ और देवता चित्त न धरयी । हनुमत सेयि सर्व सुख करयी ॥ टै मिटै सब
    पीरा । जो सुमिरै हनुमत बल वीरा ॥ ॥ जै जै जै हनुमान गोसायी । कृपा करहु गुरुदेव की नायी ॥ ॥ यह शत वार
    पाठ कर कोयी । छूटहि बन्दि महा सुख होयी ॥ ॥ जो यह पडै हनुमान चालीसा । होय सिद्धि साखी गौरीशा ॥ ॥ तुलसीदास
    सदा हरि चेरा । कीजै नाथ हृदय मह डेरा ॥ ॥ दोहा पवन तनय सङ्कट हरण मङ्गल मूरति रूप् । राम लखन सीता सहित
    हृदय बसहु सुरभूप् ॥ सियावर रामचन्द्रकी जय । पवनसुत हनुमानकी जय । बोलो भायी सब सन्तनकी जय ।
