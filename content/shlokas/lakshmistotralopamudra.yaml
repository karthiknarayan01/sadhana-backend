id: lakshmistotralopamudra
category: stotram
name:
  english: lakshmistotralopamudra
  devanagari: लक्ष्मीस्तोत्रलोपामुद्रा
content:
  english: shrilakshmistotram lopamudra || purva pithika || lopamudra shriyah padau dhritvananama sadaram
    | vavande stavanam cakre tava lakshmi sada sati || 1|| shrunu tat stavanam yena stavakah syurdhanashrayah
    | naikasampat samayuktah tvaya prasannayekshitah || 2|| || mulapatha shrilopamudra uvaca || matarnamami
    kamale padmayatasulocane | shrivishnuhritkamalasthe vishvamatarnamo'stu te || 1|| kshirasagarasatputri
    padmagarbhabhasundari | lakshmi prasida satatam vishvamatarnamo'stu te || 2|| mahendrasadane tvam
    shrih rukmini krishnabhamini | candre jyotsna prabha surye vishvamatarnamo'stu te || 3|| smitanane
    jagadhdatri sharanye sukhavarddhini | jatavedasi dahane vishvamatarnamo'stu te || 4|| brahmani tvam
    sarjana'si vishnau tvam poshika sada | shivau samharika shaktih vishvamatarnamo'stu te || 5|| tvaya
    shuragunivijna dhanyamanyakulinaka | kalashilakalapadhyai vishvamatarnamo'stu te || 6|| tvaya gajasturangashca
    strainastrirnam sarah sadah | devo griham kanah shreshtha vishvamatarnamo'stu te || 7|| tvaya pakshipashuh
    shayya ratnam prithvi naro vadhuh | shreshtha shudhda mahalakshmi vishvamatarnamo'stu te || 8|| lakshmi
    shri kamale padme rame padmodbhave sati | abdhije vishnupatni tvam prasida satatam priye || 9|| ||
    phala shrutih || iti stuta prasanna ca shriruvaca pativratam | lopamudre mune jane vam yata hrittapakaranam
    || 1|| sucetanam dunotyeva kashivishleshajo'nalah | yuvam varanasim prapya sidhdim prapyastha ipsitam
    || 2|| ye pathishyanti matstotram tapadaridryanashakam | ishtasampatpradam tesham jayasantatikarakam
    || 3|| mama sannidhyadam balagrahadivyadhinashanam | bhavishyati mama sarupyadipramokshanam tatha
    || 4|| || shrilakshminarayanasamhitayam shrilopamudrakrita shrilakshmistotram ||
  devanagari: श्रीलक्ष्मीस्तोत्रं लोपामुद्रा ॥ पूर्व पीठिका ॥ लोपामुद्रा श्रियाः पादौ धृत्वाननाम सादरम्
    । ववन्दे स्तवनं चक्रे तव लक्ष्मि सदा सती ॥ १॥ श्रुणु तत् स्तवनं येन स्तावकाः स्युर्धनाश्रयाः । नैकसम्पत्
    समायुक्ताः त्वया प्रसन्नयेक्षिताः ॥ २॥ ॥ मूलपाठ श्रीलोपामुद्रा उवाच ॥ मातर्नमामि कमले पद्मायतसुलोचने
    । श्रीविष्णुहृत्कमलस्थे विश्वमातर्नमोऽस्तु ते ॥ १॥ क्षीरसागरसत्पुत्रि पद्मगर्भाभसुन्दरि । लक्ष्मि
    प्रसीद सततं विश्वमातर्नमोऽस्तु ते ॥ २॥ महेन्द्रसदने त्वं श्रीः रुक्मिणि कृष्णभामिनि । चन्द्रे ज्योत्स्ना
    प्रभा सूर्ये विश्वमातर्नमोऽस्तु ते ॥ ३॥ स्मितानने जगध्दात्रि शरण्ये सुखवर्द्धिनि । जातवेदसि दहने विश्वमातर्नमोऽस्तु
    ते ॥ ४॥ ब्रह्माणि त्वं सर्जनाऽसि विष्णौ त्वं पोषिका सदा । शिवौ संहारिका शक्तिः विश्वमातर्नमोऽस्तु
    ते ॥ ५॥ त्वया शूरागुणीविज्ञा धन्यामान्याकुलीनका । कलाशीलकलापाढ्यै विश्वमातर्नमोऽस्तु ते ॥ ६॥ त्वया
    गजस्तुरङ्गश्च स्त्रैणस्तृर्णं सरः सदः । देवो गृहं कणः श्रेष्ठा विश्वमातर्नमोऽस्तु ते ॥ ७॥ त्वया पक्षीपशुः
    शय्या रत्नं पृथ्वी नरो वधूः । श्रेष्ठा शुध्दा महालक्ष्मि विश्वमातर्नमोऽस्तु ते ॥ ८॥ लक्ष्मि श्री कमले
    पद्मे रमे पद्मोद्भवे सति । अब्धिजे विष्णुपत्नि त्वं प्रसीद सततं प्रिये ॥ ९॥ ॥ फल श्रुतिः ॥ इति स्तुता
    प्रसन्ना च श्रीरुवाच पतिव्रताम् । लोपामुद्रे मुने जाने वां यत हृत्तापकारणम् ॥ १॥ सुचेतनं दुनोत्येव
    काशीविश्लेषजोऽनलः । युवां वाराणसीं प्राप्य सिध्दिं प्रप्यस्थ ईप्सिताम् ॥ २॥ ये पठिष्यन्ति मत्स्तोत्रं
    तापदारिद्र्यनाशकम् । इष्टसम्पत्प्रदं तेषां जयसन्ततिकारकम् ॥ ३॥ मम सान्निध्यदं बालग्रहादिव्यधिनाशनम्
    । भविष्यति मम सारुप्यादिप्रमोक्षणं तथा ॥ ४॥ ॥ श्रीलक्ष्मीनरायणसंहितायां श्रीलोपामुद्राकृत श्रीलक्ष्मीस्तोत्रम्
    ॥
