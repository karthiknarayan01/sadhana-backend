id: ashadhamasakriteshivashatashtanamastotrammasa-4
category: stotram
name:
  english: ashadhamasakriteshivashatashtanamastotrammasa 4
  devanagari: आषाढमासकृतेशिवशताष्टनामस्तोत्रम्मास ४
content:
  english: nama ijyaya pujyaya upajivyaya te namah | namah kshetraya vriddhaya vatsalaya namo namah ||
    55|| namo bhutaya bhavyaya namahsatyaya babhrave | namo vai padmavarnaya mrityughnaya ca mrityave
    || 56|| namo gaurashariraya shyamaya rohitaya ca | mahasandhyabhravarnaya carurupaya dhimate || 57||
    namah kamalahastaya vishvagrasaya shambhave | pramanaya sureshaya avadhyayamaraya ca || 58|| namo
    rupayarupyaya shashvatayakshataya ca | brihmane mahate caiva vibhrantaya kushaya ca || 59|| durgamaya
    maheshaya rodhaya kapilaya ca | apratarkyashariraya bilmine rasagaya ca || 60|| sikatyaya pravahyaya
    reshmiyaya namonamah | prasritaya puranaya vamadevaya dandine || 61|| sumedhase kulalaya namaste'stu
    shikhandine | citraya citravarmaya trinetraya trishuline || 62|| cekitanaya krishnaya suhitaya hitaya
    ca | namah kshantaya dantaya vajrasamhananaya ca || 63|| rakshoghnaya vishaghnaya shitikanthaya manyave
    | namah somaya rudraya sutamrayarunaya ca || 64|| bhargayograya bhimaya tigmayudhadharaya ca | sumodaya
    pramodaya madhupritaya te namah || 65|| pranaya pranaveshaya namaste'stu suvasase | bhishaje mahate
    caiva durgadhyakshaya lingine || 66|| naktancaraya muktaya bhaktapapaharaya ca | anamayaya sharvaya
    mahakalaya dhunvate || 67|| pancaksharapriyayatha mrigajinadharaya ca | ashadhaya viradhaya dutaya
    prahitaya ca || 68|| tamoghnaya himaghnaya kratave ritave namah | jyotsnajvalaya phalaya
  devanagari: नम इज्याय पूज्याय उपजीव्याय ते नमः । नमः क्षेत्राय वृद्धाय वत्सलाय नमो नमः ॥ ५५॥ नमो भूताय
    भव्याय नमःसत्याय बभ्रवे । नमो वै पद्मवर्णाय मृत्युघ्नाय च मृत्यवे ॥ ५६॥ नमो गौरशरीराय श्यामाय रोहिताय
    च । महासन्ध्याभ्रवर्णाय चारुरूपाय धीमते ॥ ५७॥ नमः कमलहस्ताय विश्वग्रासाय शम्भवे । प्रमाणाय सुरेशाय
    अवध्यायामराय च ॥ ५८॥ नमो रूपायारूप्याय शाश्वतायाक्षताय च । बृह्मणे महते चैव विभ्रान्ताय कुशाय च ॥
    ५९॥ दुर्गमाय महेशाय रोधाय कपिलाय च । अप्रतर्क्यशरीराय बिल्मिने रसगाय च ॥ ६०॥ सिकत्याय प्रवाह्याय रेश्मियाय
    नमोनमः । प्रसृताय पुराणाय वामदेवाय दण्डिने ॥ ६१॥ सुमेधसे कुलालाय नमस्तेऽस्तु शिखण्डिने । चित्राय चित्रवर्माय
    त्रिणेत्राय त्रिशूलिने ॥ ६२॥ चेकितानाय कृष्णाय सुहिताय हिताय च । नमः क्षान्ताय दान्ताय वज्रसंहननाय
    च ॥ ६३॥ रक्षोघ्नाय विषघ्नाय शितिकण्ठाय मन्यवे । नमः सोमाय रुद्राय सुताम्रायारुणाय च ॥ ६४॥ भर्गायोग्राय
    भीमाय तिग्मायुधधराय च । सुमोदाय प्रमोदाय मधुप्रीताय ते नमः ॥ ६५॥ प्राणाय प्रणवेशाय नमस्तेऽस्तु सुवाससे
    । भिषजे महते चैव दुर्गाध्यक्षाय लिङ्गिने ॥ ६६॥ नक्तञ्चराय मुक्ताय भक्तपापहराय च । अनामयाय शर्वाय महाकालाय
    धून्वते ॥ ६७॥ पञ्चाक्षरप्रियायाथ मृगाजिनधराय च । आषाढाय विराधाय दूताय प्रहिताय च ॥ ६८॥ तमोघ्नाय हिमघ्नाय
    क्रतवे ऋतवे नमः । ज्योत्स्नाज्वालाय फालाय
