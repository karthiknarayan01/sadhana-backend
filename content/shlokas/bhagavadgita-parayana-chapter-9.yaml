id: bhagavadgita-parayana-chapter-9
category: stotram
name:
  english: Bhagavadgita Parayana - Chapter 9
content:
  english: om shriparamatmane namah atha navamo'dhyayah rajavidyarajaguhyayogah shri bhagavanuvaca idam
    tu te guhyatamam pravakshyamyanasuyave | jnanam vijnanasahitam yajjnatva mokshyase'shubhat|| || rajavidya
    rajaguhyam pavitramidamuttamam | pratyakshavagamam dharmyam susukham kartumavyayam || || ashraddadhanah
    purushah dharmasyasya parantapa | aprapya mam nivartante mrityusamsaravartmani || || maya tatamidam
    sarvam jagadavyaktamurtina | matsthani sarvabhutani na caham teshvavasthitah || || na ca matsthani
    bhutani pashya me yogamaishvaram | bhutabhrinna ca bhutasthah mamatma bhutabhavanah || || yatha''kashasthito
    nityam vayuh sarvatrago mahan | tatha sarvani bhutani matsthanityupadharaya || || sarvabhutani kaunteya
    prakritim yanti mamikam | kalpakshaye punastani kalpadau visrijamyaham || || prakritim svamavashtabhya
    visrijami punah punah | bhutagramamimam kritsnam avasham prakritervashat || || na ca mam tani karmani
    nibadhnanti dhananjaya | udasinavadasinam asaktam teshu karmasu || || mayadhyakshena prakritih suyate
    sacaracaram | hetuna'nena kaunteya jagadviparivartate || || avajananti mam mudhah manushim tanumashritam
    | param bhavamajanantah mama bhutamaheshvaram || || moghasha moghakarmanah moghajnana vicetasah |
    rakshasimasurim caiva prakritim mohinim shritah || || mahatmanastu mam partha daivim prakritimashritah
    | bhajantyananyamanasah jnatva bhutadimavyayam || || satatam kirtayanto mam yatantashca dridhavratah
    | namasyantashca mam bhaktya nityayukta upasate || || jnanayajnena capyanye yajanto mamupasate | ekatvena
    prithaktvena bahudha vishvatomukham || || aham kraturaham yajnah svadhahamahamaushadham | mantro'hamahamevajyam
    ahamagniraham hutam || || pita'hamasya jagatah mata dhata pitamahah | vedyam pavitramonkarah riksama
    yajureva ca || || gatirbharta prabhuh sakshi nivasah sharanam suhrit | prabhavah pralayah sthanam
    nidhanam bijamavyayam || || tapamyahamaham varsham nigrihnamyutsrijami ca | amritam caiva mrityushca
    sadasaccahamarjuna || || traividya mam somapah putapapah yajnairishtva svargatim prarthayante | te
    punyamasadya surendralokam ashnanti divyandivi devabhogan || || te tam bhuktva svargalokam vishalam
    kshine punye martyalokam vishanti | evam trayidharmamanuprapannah gatagatam kamakama labhante || ||
    ananyashcintayanto mam ye janah paryupasate | tesham nityabhiyuktanam yogakshemam vahamyaham || ||
    ye'pyanyadevata bhaktah yajante shraddhayanvitah | te'pi mameva kaunteya yajantyavidhipurvakam ||
    || aham hi sarvayajnanam bhokta ca prabhureva ca | na tu mamabhijananti tattvenatashcyavanti te ||
    || yanti devavrata devan pitrinyanti pitrivratah | bhutani yanti bhutejyah yanti madyajino'pi mam
    || || patram pushpam phalam toyam yo me bhaktya prayacchati | tadaham bhaktyupahritam ashnami prayatatmanah
    || || yatkaroshi yadashnasi yajjuhoshi dadasi yat | yattapasyasi kaunteya tatkurushva madarpanam ||
    || shubhashubhaphalairevam mokshyase karmabandhanaih | sannyasayogayuktatma vimukto mamupaishyasi
    || || samo'ham sarvabhuteshu na me dveshyo'sti na priyah | ye bhajanti tu mam bhaktya mayi te teshu
    capyaham || || api cetsuduracarah bhajate mamananyabhak | sadhureva sa mantavyah samyagvyavasito hi
    sah || || kshipram bhavati dharmatma shashvacchantim nigacchati | kaunteya prati janihi na me bhaktah
    pranashyati || || mam hi partha vyapashritya ye'pi syuh papayonayah | striyo vaishyastatha shudrah
    te'pi yanti param gatim || || kim punarbrahmanah punyah bhakta rajarshayastatha | anityamasukham lokam
    imam prapya bhajasva mam || || manmana bhava madbhaktah madyaji mam namaskuru | mamevaishyasi yuktvaivam
    atmanam matparayanah || || || om tatsaditi shrimadbhagavadgitasu upanishatsu brahmavidyayam yogashastre
    shrikrishnarjunasamvade rajavidyarajaguhyayogo nama navamo'dhyayah ||
  devanagari: ॐ श्रीपरमात्मने नमः अथ नवमोऽध्यायः राजविद्याराजगुह्ययोगः श्री भगवानुवाच इदं तु ते गुह्यतमं
    प्रवक्ष्याम्यनसूयवे । ज्ञानं विज्ञानसहितं यज्ज्ञात्वा मोक्ष्यसेऽशुभात्॥ ॥ राजविद्या राजगुह्यं पवित्रमिदमुत्तमम्
    । प्रत्यक्षावगमं धर्म्यं सुसुखं कर्तुमव्ययम् ॥ ॥ अश्रद्दधानाः पुरुषाः धर्मस्यास्य परन्तप । अप्राप्य
    मां निवर्तन्ते मृत्युसंसारवर्त्मनि ॥ ॥ मया ततमिदं सर्वं जगदव्यक्तमूर्तिना । मत्स्थानि सर्वभूतानि न
    चाहं तेष्ववस्थितः ॥ ॥ न च मत्स्थानि भूतानि पश्य मे योगमैश्वरम् । भूतभृन्न च भूतस्थः ममात्मा भूतभावनः
    ॥ ॥ यथाऽऽकाशस्थितो नित्यं वायुः सर्वत्रगो महान् । तथा सर्वाणि भूतानि मत्स्थानीत्युपधारय ॥ ॥ सर्वभूतानि
    कौन्तेय प्रकृतिं यान्ति मामिकाम् । कल्पक्षये पुनस्तानि कल्पादौ विसृजाम्यहम् ॥ ॥ प्रकृतिं स्वामवष्टभ्य
    विसृजामि पुनः पुनः । भूतग्राममिमं कृत्स्नम् अवशं प्रकृतेर्वशात् ॥ ॥ न च मां तानि कर्माणि निबध्नन्ति
    धनञ्जय । उदासीनवदासीनम् असक्तं तेषु कर्मसु ॥ ॥ मयाध्यक्षेण प्रकृतिः सूयते सचराचरम् । हेतुनाऽनेन कौन्तेय
    जगद्विपरिवर्तते ॥ ॥ अवजानन्ति मां मूढाः मानुषीं तनुमाश्रितम् । परं भावमजानन्तः मम भूतमहेश्वरम् ॥ ॥
    मोघाशा मोघकर्माणः मोघज्ञाना विचेतसः । राक्षसीमासुरीं चैव प्रकृतिं मोहिनीं श्रिताः ॥ ॥ महात्मानस्तु
    मां पार्थ दैवीं प्रकृतिमाश्रिताः । भजन्त्यनन्यमनसः ज्ञात्वा भूतादिमव्ययम् ॥ ॥ सततं कीर्तयन्तो मां
    यतन्तश्च दृढव्रताः । नमस्यन्तश्च मां भक्त्या नित्ययुक्ता उपासते ॥ ॥ ज्ञानयज्ञेन चाप्यन्ये यजन्तो मामुपासते
    । एकत्वेन पृथक्त्वेन बहुधा विश्वतोमुखम् ॥ ॥ अहं क्रतुरहं यज्ञः स्वधाहमहमौषधम् । मन्त्रोऽहमहमेवाज्यम्
    अहमग्निरहं हुतम् ॥ ॥ पिताऽहमस्य जगतः माता धाता पितामहः । वेद्यं पवित्रमोङ्कारः ऋक्साम यजुरेव च ॥ ॥
    गतिर्भर्ता प्रभुः साक्षी निवासः शरणं सुहृत् । प्रभवः प्रलयः स्थानं निधानं बीजमव्ययम् ॥ ॥ तपाम्यहमहं
    वर्षं निगृह्णाम्युत्सृजामि च । अमृतं चैव मृत्युश्च सदसच्चाहमर्जुन ॥ ॥ त्रैविद्या मां सोमपाः पूतपापाः
    यज्ञैरिष्ट्वा स्वर्गतिं प्रार्थयन्ते । ते पुण्यमासाद्य सुरेन्द्रलोकम् अश्नन्ति दिव्यान्दिवि देवभोगान्
    ॥ ॥ ते तं भुक्त्वा स्वर्गलोकं विशालं क्षीणे पुण्ये मर्त्यलोकं विशन्ति । एवं त्रयीधर्ममनुप्रपन्नाः
    गतागतं कामकामा लभन्ते ॥ ॥ अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते । तेषां नित्याभियुक्तानां योगक्षेमं
    वहाम्यहम् ॥ ॥ येऽप्यन्यदेवता भक्ताः यजन्ते श्रद्धयान्विताः । तेऽपि मामेव कौन्तेय यजन्त्यविधिपूर्वकम्
    ॥ ॥ अहं हि सर्वयज्ञानां भोक्ता च प्रभुरेव च । न तु मामभिजानन्ति तत्त्वेनातश्च्यवन्ति ते ॥ ॥ यान्ति
    देवव्रता देवान् पितॄन्यान्ति पितृव्रताः । भूतानि यान्ति भूतेज्याः यान्ति मद्याजिनोऽपि माम् ॥ ॥ पत्रं
    पुष्पं फलं तोयं यो मे भक्त्या प्रयच्छति । तदहं भक्त्युपहृतम् अश्नामि प्रयतात्मनः ॥ ॥ यत्करोषि यदश्नासि
    यज्जुहोषि ददासि यत् । यत्तपस्यसि कौन्तेय तत्कुरुष्व मदर्पणम् ॥ ॥ शुभाशुभफलैरेवं मोक्ष्यसे कर्मबन्धनैः
    । सन्न्यासयोगयुक्तात्मा विमुक्तो मामुपैष्यसि ॥ ॥ समोऽहं सर्वभूतेषु न मे द्वेष्योऽस्ति न प्रियः । ये
    भजन्ति तु मां भक्त्या मयि ते तेषु चाप्यहम् ॥ ॥ अपि चेत्सुदुराचारः भजते मामनन्यभाक् । साधुरेव स मन्तव्यः
    सम्यग्व्यवसितो हि सः ॥ ॥ क्षिप्रं भवति धर्मात्मा शश्वच्छान्तिं निगच्छति । कौन्तेय प्रति जानीहि न मे
    भक्तः प्रणश्यति ॥ ॥ मां हि पार्थ व्यपाश्रित्य येऽपि स्युः पापयोनयः । स्त्रियो वैश्यास्तथा शूद्राः
    तेऽपि यान्ति परां गतिम् ॥ ॥ किं पुनर्ब्राह्मणाः पुण्याः भक्ता राजर्षयस्तथा । अनित्यमसुखं लोकम् इमं
    प्राप्य भजस्व माम् ॥ ॥ मन्मना भव मद्भक्तः मद्याजी मां नमस्कुरु । मामेवैष्यसि युक्त्वैवम् आत्मानं मत्परायणः
    ॥ ॥ ॥ ॐ तत्सदिति श्रीमद्भगवद्गीतासु उपनिषत्सु ब्रह्मविद्यायां योगशास्त्रे श्रीकृष्णार्जुनसंवादे राजविद्याराजगुह्ययोगो
    नाम नवमोऽध्यायः ॥
