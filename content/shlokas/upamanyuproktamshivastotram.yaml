id: upamanyuproktamshivastotram
category: stotram
name:
  english: upamanyuproktamshivastotram
  devanagari: उपमन्युप्रोक्तंशिवस्तोत्रम्
content:
  english: ringacaranau raktaprayavilocanah | pivaronnatasarvangassucarugamanojjvalah || 55|| prashastalakshanah
    shrimanprajvalanmanibhushanah | shivapriyah shivasaktah shivayordhvajavahanah || 56|| tatha taccarananyasapavitaparavigrahah
    | gorajapurushah shrimanchrimacchulavarayudhah | tayorajnam puraskritya sa me kamam prayacchatu ||
    57|| nandishvaro mahateja nagendratanayatmajah | sanarayanakairdevairnityamabhyarcya vanditah || 58||
    sharvasyantahpuradvari sardham parijanaih sthitah | sarveshvarasamaprakhyassarvasuravimardanah ||
    59|| sarvesham shivadharmanamadhyakshatve'bhishecitah | shivapriyashshivasaktashshrimacchulavarayudhah
    || 60|| shivashriteshu samsaktastvanuraktashca tairapi | satkritya shivayorajnam sa me kamam prayacchatu
    || 61|| mahakalo mahabahurmahadeva ivaparah | mahadevashritanam tu nityamevabhirakshatu || 62|| shivapriyah
    shivasaktashshivayorarcakassada | satkritya shivayorajnam sa me dishatu kankshitam || 63|| sarvashastrarthatattvajnah
    shasta vishnoh para tanuh | mahamohatmatanayo madhumamsasavapriyah | tayorajnam puraskritya sa me
    kamam prayacchatu || 64|| brahmani caiva maheshi kaumari vaishnavi tatha | varahi caiva mahendri camunda
    candavikrama || 65|| eta vai matarah sapta sarvalokasya matarah | prarthitam me prayacchantu parameshvarashasanat
    || 66|| mattamatangavadano gangomashankaratmajah | akashadeho digbahussomasuryagnilocanah || 67||
    airavatadibhirdivyairdiggajairnityamarcitah | shivajnanamadodbhinnastridashanamavighnakrit || 68||
    vighnakriccasuradinam vighneshah shivabhavitah | satkritya shivayorajnam sa me dishatu kankshitam
    || 69|| shanmukhashshivasambhutah shaktivajradharah prabhuh | agneshca tanayo devo hyaparnatanayah
    punah || 70|| gangayashca ganambayah krittikanam tathaiva ca | vishakhena ca shakhena naigameyena
    cavritah || 71|| indrajiccandrasenanistarakasurajittatha | shailanam merumukhyanam vedhakashca svatejasa
    || 72|| taptacamikaraprakhyah shatapatradalekshanah | kumarassukumaranam rupodaharanam mahat || 73||
    shivapriyah shivasaktah shivapadarcakassada | satkritya shivayorajnam sa me dishatu kankshitam ||
    74|| jyeshtha varishtha varada shivayoryajanerata | tayorajnam puraskritya sa me dishatu kankshitam
    || 75|| trailokyavandita sakshadulkakara ganambika | jagatsrishtivivriddhyartham brahmana'bhyarthita
    shivat || 76|| shivayah pravibhaktaya bhruvorantaranissritah | dakshayani sati mena tatha haimavati
    hyuma || 77|| kaushikyashcaiva janani bhadrakalyastathaiva ca | aparnayashca janani patalayastathaiva
    ca || 78|| shivarcanarata nityam rudrani rudravallabha | satkritya shivayorajnam sa me dishatu kankshitam
    || 79|| candah sarvaganeshanah shambhorvadanasambhavah | satkritya shivayorajnam sa me dishatu kankshitam
    || 80|| pingalo ganapah shrimanchivasaktah shivapriyah | ajnaya shivayoreva sa me kamam prayacchatu
    || 81|| bhringisho nama ganapah shivaradhanatatparah | prayacchatu sa me kamam patyurajnapurahsaram
    || 82|| virabhadro mahateja himakundendusannibhah | bhadrakalipriyo nityam matrinam cabhirakshita
    || 83|| yajnasya ca shiroharta dakshasya ca duratmanah | upendrendrayamadinam devanamangarakshakah
    || 84|| shivasyanucarah shrimanchivashasanapalakah | shivayoh shasanadeva sa me dishatu kankshitam
    || 85|| sarasvati maheshasya vaksarojasamudbhava | shivayoh pujane sakta sa me dishatu kankshitam
    || 86|| vishnorvakshahsthita lakshmih shivayoh pujane rata | shivayoh shasanadeva sa me dishatu kankshitam
    || 87|| mahamoti mahadevyah padapujaparayana | tasya eva niyogena sa me dishatu kankshitam || 88||
    kaushiki simhamarudha parvatyah parama suta | vishnornidramahamaya mahamahishamardini || 89|| nishumbhashumbhasamhatri
    madhumamsasavapriya | satkritya shasanam matussa me dishatu kankshitam || 90|| rudra rudrasamaprakhyah
    pramathah prathitaujasah | bhutakhyashca mahavirya mahadevasamaprabhah || 91|| nityamukta nirupama
    nirdvandva nirupaplavah | sashaktayassanucarassarvalokanamaskritah || 92|| sarveshameva lokanam srishtisamharanakshamah
    | parasparanuraktashca parasparamanuvratah || 93|| parasparamatisnigdhah parasparanamaskritah | shivapriyatama
    nityam shivalakshanalakshitah || 94|| saumyadharastatha mishrashcantaraladvayatmikah | virupashca
    surupashca nanarupadharastatha || 95|| satkritya shivayorajnam te me kamam dishantu vai | devya priyasakhivargo
    devilakshanalakshitah || 96|| sahito rudrakanyabhih shaktibhishcapyanekashah | tritiyavarane shambhorbhaktya
    nityam samarcitah || 97|| satkritya shivayorajnam sa me dishatu mangalam | divakaro maheshasya murtirdiptisumandalah
    || 98|| nirguno gunasankirnastathaiva gunakevalah | avikaratmakashcadya ekassamanyavikriyah || 99||
    asadharanakarma ca srishtisthitilayakramat | evam tridha caturdha ca vibhaktah pancadha punah || 100||
    caturthavarane shambhoh pujitashcanugaih saha | shivapriyah shivasaktah shivapadarcane ratah || 101||
    satkritya shivayorajnam sa me dishatu mangalam | divakarashadangani diptadyashcashtashaktayah || 102||
    adityo bhaskaro bhanu ravishcetyanupurvashah | arko brahma tatha rudro vishnushcadityamurtayah ||
    103|| vistarasutarabodhinyapyayinyaparah punah | usha prabha tatha prajna sandhya cetyapi shaktayah
    || 104|| somadiketuparyanta grahashca shivabhavitah | shivayorajnaya nunna mangalam pradishantu me
    || 105|| athava dvadashadityastatha dvadasha shaktayah | rishayo devagandharvah pannagapsarasam ganah
    || 106|| gramanyashca tatha yaksha rakshasashcasurastatha | saptasaptaganashcaite saptacchandomaya
    hayah || 107|| valakhilyadayashcaiva sarve shivapadarcakah | satkritya shivayorajnam mangalam pradishantu
    me || 108|| brahmatha devadevasya murtirbhumandaladhipah | catuhshashtigunaishvaryo buddhitattve pratishthitah
    || 109|| nirguno gunasamnkirnastathaiva gunakevalah | avikaratmako devastatassadharanah purah || 110||
    asadharanakarma ca srishtisthitilayakramat | bhuvam tridha caturdha ca vibhaktah pancadha punah ||
    111|| caturthavarane shambho pujitashca sahanugaih | shivapriyah shivasaktashshivapadarcane ratah
    || 112|| satkritya shivayorajnam sa me dishatu mangalam | hiranyagarbho lokesho viratkalashca purushah
    || 113|| sanatkumarah sanakah sanandashca sanatanah | prajanam patayashcaiva dakshadya brahmasunavah
    || 114|| ekadasha sapatnika dharmassankalpa eva ca | shivarcanaratashcaite shivabhaktiparayanah ||
    115|| shivajnavashagassarve dishantu mama mangalam | catvarashca tatha vedassetihasapuranakah || 116||
    dharmashastrani vidyabhirvaidikibhissamanvitah | parasparaviruddharthah shivaprakritipadakah || 117||
    satkritya shivayorajnam mangalam pradishantu me | atha rudro mahadevah shambhormurtirgariyasi || 118||
    vahneyamandaladhishah paurushaishvaryavanprabhuh | shivabhimanasampanno nirgunastrigunatmakah || 119||
    kevalam sattvikashcapi rajasashcaiva tamasah | avikararatah purvam tatastu samavikriyah || 120|| asadharanakarma
    ca srishtyadikaranatprithak | brahmano'pi shirashchetta janakastasya tatsutah || 121|| janakastanayashcapi
    vishnorapi niyamakah | bodhakashca tayornityamanugrahakarah prabhuh || 122|| andasyantarbahirvarti
    rudro lokadvayadhipah | shivapriyah shivasaktah shivapadarcane ratah || 123|| shivasyajnam puraskritya
    sa me dishatu mangalam | tasya brahma shadangani vidyeshantam tathashtakam || 124|| catvaro murtibhedashca
    shivapurvah shivarcakah | shivo bhavo harashcaiva mridashcaiva tathaparah | shivasyajnam puraskritya
    mangalam pradishantu me || 125|| atha vishnurmaheshasya shivasyaiva para tanuh | varitattvadhipah
    sakshadavyaktapadasamsthitah || 126|| nirgunassattvabahulastathaiva gunakevalah | avikarabhimani ca
    trisadharanavikriyah || 127|| asadharanakarma ca srishtyadikaranatprithak | dakshinangabhavenapi spardhamanah
    svayambhuva || 128|| adyena brahmana sakshatsrishtah srashta ca tasya tu | andasyantarbahirvarti vishnurlokadvayadhipah
    || 129|| asurantakarashcakri shakrasyapi tathanujah | pradurbhutashca dashadha bhrigushapacchaladiha
    || 130|| bhubharanigraharthaya svecchayavataratkshitau | aprameyabalo mayi mayaya mohayanjagat ||
    131|| murtim kritva mahavishnum sadavishnumathapi va | vaishnavaih pujito nityam murtitrayamayasane
    || 132|| shivapriyah shivasaktah shivapadarcane ratah | shivasyajnam puraskritya sa me dishatu mangalam
    || 133|| vasudevo'niruddhashca pradyumnashca tatah parah | sankarshanassamakhyatashcatasro murtayo
    hareh || 134|| matsyah kurmo varahashca narasimho'tha vamanah | ramatrayam tatha krishno vishnusturagavaktrakah
    || 135|| cakram narayanasyastram pancajanyam ca sharngakam | satkritya shivayorajnam mangalam pradishantu
    me || 136|| prabha sarasvati gauri lakshmishca shivabhavita | shivayoh shasanadeta mangalam pradishantu
    me || 137|| indro'gnishca yamashcaiva nirritirvarunastatha | vayuh somah kuberashca tatheshanastrishuladhrik
    || 138|| sarve shivarcanaratah shivasadbhavabhavitah | satkritya shivayorajnam mangalam pradishantu
    me || 139|| trishulamatha vajram ca tatha parashusayakau | khadgapashankushashcaiva pinakashcayudhottamah
    || 140|| divyayudhani devasya devyashcaitani nityashah | satkritya shivayorajnam raksham kurvantu
    me sada || 141|| vrisharupadharo devah saurabheyo mahabalah | vadavakhyanalaspardham pancagomatribhirvritah
    || 142|| vahanatvamanupraptastapasa parameshayoh | tayorajnam puraskritya sa me kamam prayacchatu
    || 143|| nanda sunanda surabhih sushila sumana tatha | pancagomatarastvetashshivaloke vyavasthitah
    || 144|| shivabhaktipara nityam shivarcanaparayanah | shivayoh shasanadeva dishantu mama vanchitam
    || 145|| kshetrapalo mahateja nilajimutasannibhah | damshtrakaralavadanah sphuradraktadharojjvalah
    || 146|| raktordhvamurdhajah shrimanbhrukutikutilekshanah | raktavrittatrinayanah shashipannagabhushanah
    || 147|| nagnastrishulapashasikapalodyatapanikah | bhairavo bhairavaih siddhairyoginibhishca samvritah
    || 148|| kshetre kshetre samasinah sthito yo rakshakassatam | shivapranamaparamah shivasadbhavabhavitah
    || 149|| shivashritanvisheshena rakshanputranivaurasan | satkritya shivayorajnam sa me dishatu mangalam
    || 150|| talajanghadayastasya prathamavarane'rcitah | satkritya shivayorajnam catvarah samavantu mam
    || 151|| bhairavadyashca ye canye samantattasya veshtitah | te'pi mamanugrihnantu shivashasanagauravat
    || 152|| naradadyashca munayo divya devaishca pujitah | sadhya nagashca ye deva janalokanivasinah
    || 153|| vinivrittadhikarashca maharlokanivasinah | saptarshayastathanye vai vaimanikagunaissaha ||
    154|| sarve shivarcanaratah shivajnavashavartinah | shivayorajnaya mahyam dishantu mama kankshitam
    || 155|| gandharvadyah pishacantashcatasro devayonayah | siddha vidyadharadyashca ye'pi canye nabhashcarah
    || 156|| asura rakshasashcaiva patalatalavasinah | anantadyashca nagendra vainateyadayo dvijah ||
    157|| kushmandah pretavetala graha bhutaganah pare | dakinyashcapi yoginyah shakinyashcapi tadrishah
    || 158|| kshetraramagrihadini tirthanyayatanani ca | dvipah samudra nadyashca nadashcanye saramsi
    ca || 159|| girayashca sumervadyah kananani samantatah | pashavah pakshino vrikshah krimikitadayo
    mrigah || 160|| bhuvananyapi sarvani bhuvananamadhishvarah | andanyavaranaissardham masashca dasha
    diggajah || 161|| varnah padani mantrashca tattvanyapi sahadhipaih | brahmandadharaka rudra rudrashcanye
    sashaktikah || 162|| yacca kincijjagatyasmindrishtam canumitam shrutam | sarve kamam prayacchantu
    shivayoreva shasanat || 163|| atha vidya para shaivi pashupashavimocini | pancarthasamjnita divya
    pashuvidyabahishkrita || 164|| shastram ca shivadharmakhyam dharmakhyam ca taduttaram | shaivakhyam
    shivadharmakhyam puranam shrutisammitam || 165|| shaivagamashca ye canye kamikadyashcaturvidhah |
    shivabhyamavisheshena satkrityeha samarcitah || 166|| tabhyameva samajnata mamabhipretasiddhaye |
    karmedamanumanyantam saphalam sadhvanushthitam || 167|| shvetadya nakulishantah sashishyashcapi deshikah
    | tatsantatiya guravo visheshadguravo mama || 168|| shaiva maheshvarashcaiva jnanakarmaparayanah |
    karmedamanumanyantam saphalam sadhvanushthitam || 169|| laukika brahmanassarve kshatriyashca vishah
    kramat | vedavedangatattvajnah sarvashastravisharadah || 170|| sankhya vaisheshikashcaiva yauga naiyayika
    narah | saura brahmastatha raudra vaishnavashcapare narah || 171|| shishtah sarve vishishtashca shivashasanayantritah
    | karmedamanumanyantam mamabhipretasadhakam || 172|| shaivah siddhantamargasthah shaivah pashupatastatha
    | shaiva mahavratadharah shaivah kapalikah pare || 173|| shivajnapalakah pujya mamapi shivashasanat
    | sarve mamanugrihnantu shamsantu saphalakriyam || 174|| dakshinajnananishthashca dakshinottaramargagah
    | avirodhena vartantam mantrashreyo'rthino mama || 175|| nastikashca shathashcaiva kritaghnashcaiva
    tamasah | pashandashcatipapashca vartantam durato mama || 176|| bahubhih kim stutairatra ye'pi ke'picidastikah
    | sarve mamanugrihnantu santah shamsantu mangalam || 177|| namashshivaya sambaya sasutayadihetave
    | pancavaranarupena prapancenavritaya te || 178|| ityuktva dandavadbhumau pranipatya shivam shivam
    | japetpancaksharim vidyamashtottarashatavaram || 179|| tathaiva shaktividyam ca japitva tatsamarpanam
    | kritva tam kshamayitvesham pujashesham samapayet || 180|| etatpunyatamam stotram shivayorhridayangamam
    | sarvabhishtapradam sakshadbhuktimuktyaikasadhanam || 181|| ya idam kirtayennityam sha
  devanagari: ृङ्गचरणौ रक्तप्रायविलोचनः । पीवरोन्नतसर्वाङ्गस्सुचारुगमनोज्ज्वलः ॥ ५५॥ प्रशस्तलक्षणः श्रीमान्प्रज्वलन्मणिभूषणः
    । शिवप्रियः शिवासक्तः शिवयोर्ध्वजवाहनः ॥ ५६॥ तथा तच्चरणन्यासपावितापरविग्रहः । गोराजपुरुषः श्रीमाञ्छ्रीमच्छूलवरायुधः
    । तयोराज्ञां पुरस्कृत्य स मे कामं प्रयच्छतु ॥ ५७॥ नन्दीश्वरो महातेजा नगेन्द्रतनयात्मजः । सनारायणकैर्देवैर्नित्यमभ्यर्च्य
    वन्दितः ॥ ५८॥ शर्वस्यान्तःपुरद्वारि सार्धं परिजनैः स्थितः । सर्वेश्वरसमप्रख्यस्सर्वासुरविमर्दनः ॥
    ५९॥ सर्वेषां शिवधर्माणामध्यक्षत्वेऽभिषेचितः । शिवप्रियश्शिवासक्तश्श्रीमच्छूलवरायुधः ॥ ६०॥ शिवाश्रितेषु
    संसक्तस्त्वनुरक्तश्च तैरपि । सत्कृत्य शिवयोराज्ञां स मे कामं प्रयच्छतु ॥ ६१॥ महाकालो महाबाहुर्महादेव
    इवापरः । महादेवाश्रितानां तु नित्यमेवाभिरक्षतु ॥ ६२॥ शिवप्रियः शिवासक्तश्शिवयोरर्चकस्सदा । सत्कृत्य
    शिवयोराज्ञां स मे दिशतु काङ्क्षितम् ॥ ६३॥ सर्वशास्त्रार्थतत्त्वज्ञः शास्ता विष्णोः परा तनुः । महामोहात्मतनयो
    मधुमांसासवप्रियः । तयोराज्ञां पुरस्कृत्य स मे कामं प्रयच्छतु ॥ ६४॥ ब्रह्माणी चैव माहेशी कौमारी वैष्णवी
    तथा । वाराही चैव माहेन्द्री चामुण्डा चण्डविक्रमा ॥ ६५॥ एता वै मातरः सप्त सर्वलोकस्य मातरः । प्रार्थितं
    मे प्रयच्छन्तु परमेश्वरशासनात् ॥ ६६॥ मत्तमातङ्गवदनो गङ्गोमाशङ्करात्मजः । आकाशदेहो दिग्बाहुस्सोमसूर्याग्निलोचनः
    ॥ ६७॥ ऐरावतादिभिर्दिव्यैर्दिग्गजैर्नित्यमर्चितः । शिवज्ञानमदोद्भिन्नस्त्रिदशानामविघ्नकृत् ॥ ६८॥ विघ्नकृच्चासुरादीनां
    विघ्नेशः शिवभावितः । सत्कृत्य शिवयोराज्ञां स मे दिशतु काङ्क्षितम् ॥ ६९॥ षण्मुखश्शिवसम्भूतः शक्तिवज्रधरः
    प्रभुः । अग्नेश्च तनयो देवो ह्यपर्णातनयः पुनः ॥ ७०॥ गङ्गायाश्च गणाम्बायाः कृत्तिकानां तथैव च । विशाखेन
    च शाखेन नैगमेयेन चावृतः ॥ ७१॥ इन्द्रजिच्चन्द्रसेनानीस्तारकासुरजित्तथा । शैलानां मेरुमुख्यानां वेधकश्च
    स्वतेजसा ॥ ७२॥ तप्तचामीकरप्रख्यः शतपत्रदलेक्षणः । कुमारस्सुकुमाराणां रूपोदाहरणं महत् ॥ ७३॥ शिवप्रियः
    शिवासक्तः शिवपादार्चकस्सदा । सत्कृत्य शिवयोराज्ञां स मे दिशतु काङ्क्षितम् ॥ ७४॥ ज्येष्ठा वरिष्ठा वरदा
    शिवयोर्यजनेरता । तयोराज्ञां पुरस्कृत्य सा मे दिशतु काङ्क्षितम् ॥ ७५॥ त्रैलोक्यवन्दिता साक्षादुल्काकारा
    गणाम्बिका । जगत्सृष्टिविवृद्ध्यर्थं ब्रह्मणाऽभ्यर्थिता शिवात् ॥ ७६॥ शिवायाः प्रविभक्ताया भ्रुवोरन्तरनिस्सृताः
    । दक्षायणी सती मेना तथा हैमवती ह्युमा ॥ ७७॥ कौशिक्याश्चैव जननी भद्रकाल्यास्तथैव च । अपर्णायाश्च जननी
    पाटलायास्तथैव च ॥ ७८॥ शिवार्चनरता नित्यं रुद्राणी रुद्रवल्लभा । सत्कृत्य शिवयोराज्ञां सा मे दिशतु
    काङ्क्षितम् ॥ ७९॥ चण्डः सर्वगणेशानः शम्भोर्वदनसम्भवः । सत्कृत्य शिवयोराज्ञां स मे दिशतु काङ्क्षितम्
    ॥ ८०॥ पिङ्गलो गणपः श्रीमाञ्छिवासक्तः शिवप्रियः । आज्ञया शिवयोरेव स मे कामं प्रयच्छतु ॥ ८१॥ भृङ्गीशो
    नाम गणपः शिवराधनतत्परः । प्रयच्छतु स मे कामं पत्युराज्ञापुरःसरम् ॥ ८२॥ वीरभद्रो महातेजा हिमकुन्देन्दुसन्निभः
    । भद्रकालीप्रियो नित्यं मातॄणां चाभिरक्षिता ॥ ८३॥ यज्ञस्य च शिरोहर्ता दक्षस्य च दुरात्मनः । उपेन्द्रेन्द्रयमादीनां
    देवानामङ्गरक्षकः ॥ ८४॥ शिवस्यानुचरः श्रीमाञ्छिवशासनपालकः । शिवयोः शासनादेव स मे दिशतु काङ्क्षितम्
    ॥ ८५॥ सरस्वती महेशस्य वाक्सरोजसमुद्भवा । शिवयोः पूजने सक्ता सा मे दिशतु काङ्क्षितम् ॥ ८६॥ विष्णोर्वक्षःस्थिता
    लक्ष्मीः शिवयोः पूजने रता । शिवयोः शासनादेव सा मे दिशतु काङ्क्षितम् ॥ ८७॥ महामोटी महादेव्याः पादपूजापरायणा
    । तस्या एव नियोगेन सा मे दिशतु काङ्क्षितम् ॥ ८८॥ कौशिकी सिंहमारूढा पार्वत्याः परमा सुता । विष्णोर्निद्रामहामाया
    महामहिषमर्दिनी ॥ ८९॥ निशुम्भशुम्भसंहत्री मधुमांसासवप्रिया । सत्कृत्य शासनं मातुस्सा मे दिशतु काङ्क्षितम्
    ॥ ९०॥ रुद्रा रुद्रसमप्रख्याः प्रमथाः प्रथितौजसः । भूताख्याश्च महावीर्या महादेवसमप्रभाः ॥ ९१॥ नित्यमुक्ता
    निरुपमा निर्द्वन्द्वा निरुपप्लवाः । सशक्तयस्सानुचरास्सर्वलोकनमस्कृताः ॥ ९२॥ सर्वेषामेव लोकानां सृष्टिसंहरणक्षमाः
    । परस्परानुरक्ताश्च परस्परमनुव्रताः ॥ ९३॥ परस्परमतिस्निग्धाः परस्परनमस्कृताः । शिवप्रियतमा नित्यं
    शिवलक्षणलक्षिताः ॥ ९४॥ सौम्याधारास्तथा मिश्राश्चान्तरालद्वयात्मिकाः । विरूपाश्च सुरूपाश्च नानारूपधरास्तथा
    ॥ ९५॥ सत्कृत्य शिवयोराज्ञां ते मे कामं दिशन्तु वै । देव्या प्रियसखीवर्गो देवीलक्षणलक्षितः ॥ ९६॥ सहितो
    रुद्रकन्याभिः शक्तिभिश्चाप्यनेकशः । तृतीयावरणे शम्भोर्भक्त्या नित्यं समर्चितः ॥ ९७॥ सत्कृत्य शिवयोराज्ञां
    स मे दिशतु मङ्गलम् । दिवाकरो महेशस्य मूर्तिर्दीप्तिसुमण्डलः ॥ ९८॥ निर्गुणो गुणसङ्कीर्णस्तथैव गुणकेवलः
    । अविकारात्मकश्चाद्य एकस्सामान्यविक्रियः ॥ ९९॥ असाधारणकर्मा च सृष्टिस्थितिलयक्रमात् । एवं त्रिधा चतुर्धा
    च विभक्ताः पञ्चधा पुनः ॥ १००॥ चतुर्थावरणे शम्भोः पूजितश्चानुगैः सह । शिवप्रियः शिवासक्तः शिवपादार्चने
    रतः ॥ १०१॥ सत्कृत्य शिवयोराज्ञां स मे दिशतु मङ्गलम् । दिवाकरषडङ्गानि दीप्ताद्याश्चाष्टशक्तयः ॥ १०२॥
    आदित्यो भास्करो भानू रविश्चेत्यनुपूर्वशः । अर्को ब्रह्मा तथा रुद्रो विष्णुश्चादित्यमूर्तयः ॥ १०३॥
    विस्तरासुतराबोधिन्याप्यायिन्यपराः पुनः । उषा प्रभा तथा प्रज्ञा सन्ध्या चेत्यपि शक्तयः ॥ १०४॥ सोमादिकेतुपर्यन्ता
    ग्रहाश्च शिवभाविताः । शिवयोराज्ञया नुन्ना मङ्गलं प्रदिशन्तु मे ॥ १०५॥ अथवा द्वादशादित्यास्तथा द्वादश
    शक्तयः । ऋषयो देवगन्धर्वाः पन्नगाप्सरसां गणाः ॥ १०६॥ ग्रामण्यश्च तथा यक्षा राक्षसाश्चासुरास्तथा ।
    सप्तसप्तगणाश्चैते सप्तच्छन्दोमया हयाः ॥ १०७॥ वालखिल्यादयश्चैव सर्वे शिवपदार्चकाः । सत्कृत्य शिवयोराज्ञां
    मङ्गलं प्रदिशन्तु मे ॥ १०८॥ ब्रह्माथ देवदेवस्य मूर्तिर्भूमण्डलाधिपः । चतुःषष्टिगुणैश्वर्यो बुद्धितत्त्वे
    प्रतिष्ठितः ॥ १०९॥ निर्गुणो गुणसंङ्कीर्णस्तथैव गुणकेवलः । अविकारात्मको देवस्ततस्साधारणः पुरः ॥ ११०॥
    असाधारणकर्मा च सृष्टिस्थितिलयक्रमात् । भुवं त्रिधा चतुर्धा च विभक्तः पञ्चधा पुनः ॥ १११॥ चतुर्थावरणे
    शम्भो पूजितश्च सहानुगैः । शिवप्रियः शिवासक्तश्शिवपादार्चने रतः ॥ ११२॥ सत्कृत्य शिवयोराज्ञां स मे दिशतु
    मङ्गलम् । हिरण्यगर्भो लोकेशो विराट्कालश्च पूरुषः ॥ ११३॥ सनत्कुमारः सनकः सनन्दश्च सनातनः । प्रजानां
    पतयश्चैव दक्षाद्या ब्रह्मसूनवः ॥ ११४॥ एकादश सपत्नीका धर्मस्सङ्कल्प एव च । शिवार्चनरताश्चैते शिवभक्तिपरायणाः
    ॥ ११५॥ शिवाज्ञावशगास्सर्वे दिशन्तु मम मङ्गलम् । चत्वारश्च तथा वेदास्सेतिहासपुराणकाः ॥ ११६॥ धर्मशास्त्राणि
    विद्याभिर्वैदिकीभिस्समन्विताः । परस्परविरुद्धार्थाः शिवप्रकृतिपादकाः ॥ ११७॥ सत्कृत्य शिवयोराज्ञां
    मङ्गलं प्रदिशन्तु मे । अथ रुद्रो महादेवः शम्भोर्मूर्तिर्गरीयसी ॥ ११८॥ वाह्नेयमण्डलाधीशः पौरुषैश्वर्यवान्प्रभुः
    । शिवाभिमानसम्पन्नो निर्गुणस्त्रिगुणात्मकः ॥ ११९॥ केवलं सात्त्विकश्चापि राजसश्चैव तामसः । अविकाररतः
    पूर्वं ततस्तु समविक्रियः ॥ १२०॥ असाधारणकर्मा च सृष्ट्यादिकरणात्पृथक् । ब्रह्मणोऽपि शिरश्छेत्ता जनकस्तस्य
    तत्सुतः ॥ १२१॥ जनकस्तनयश्चापि विष्णोरपि नियामकः । बोधकश्च तयोर्नित्यमनुग्रहकरः प्रभुः ॥ १२२॥ अण्डस्यान्तर्बहिर्वर्ती
    रुद्रो लोकद्वयाधिपः । शिवप्रियः शिवासक्तः शिवपादार्चने रतः ॥ १२३॥ शिवस्याज्ञां पुरस्कृत्य स मे दिशतु
    मङ्गलम् । तस्य ब्रह्म षडङ्गानि विद्येशान्तं तथाष्टकम् ॥ १२४॥ चत्वारो मूर्तिभेदाश्च शिवपूर्वाः शिवार्चकाः
    । शिवो भवो हरश्चैव मृडश्चैव तथापरः । शिवस्याज्ञां पुरस्कृत्य मङ्गलं प्रदिशन्तु मे ॥ १२५॥ अथ विष्णुर्महेशस्य
    शिवस्यैव परा तनुः । वारितत्त्वाधिपः साक्षादव्यक्तपदसंस्थितः ॥ १२६॥ निर्गुणस्सत्त्वबहुलस्तथैव गुणकेवलः
    । अविकाराभिमानी च त्रिसाधारणविक्रियः ॥ १२७॥ असाधारणकर्मा च सृष्ट्यादिकरणात्पृथक् । दक्षिणाङ्गभवेनापि
    स्पर्धमानः स्वयम्भुवा ॥ १२८॥ आद्येन ब्रह्मणा साक्षात्सृष्टः स्रष्टा च तस्य तु । अण्डस्यान्तर्बहिर्वर्ती
    विष्णुर्लोकद्वयाधिपः ॥ १२९॥ असुरान्तकरश्चक्री शक्रस्यापि तथानुजः । प्रादुर्भूतश्च दशधा भृगुशापच्छलादिह
    ॥ १३०॥ भूभारनिग्रहार्थाय स्वेच्छयावातरत्क्षितौ । अप्रमेयबलो मायी मायया मोहयञ्जगत् ॥ १३१॥ मूर्तिं कृत्वा
    महाविष्णुं सदाविष्णुमथापि वा । वैष्णवैः पूजितो नित्यं मूर्तित्रयमयासने ॥ १३२॥ शिवप्रियः शिवासक्तः
    शिवपादार्चने रतः । शिवस्याज्ञां पुरस्कृत्य स मे दिशतु मङ्गलम् ॥ १३३॥ वासुदेवोऽनिरुद्धश्च प्रद्युम्नश्च
    ततः परः । सङ्कर्षणस्समाख्याताश्चतस्रो मूर्तयो हरेः ॥ १३४॥ मत्स्यः कूर्मो वराहश्च नारसिंहोऽथ वामनः
    । रामत्रयं तथा कृष्णो विष्णुस्तुरगवक्त्रकः ॥ १३५॥ चक्रं नारायणस्यास्त्रं पाञ्चजन्यं च शार्ङ्गकम् ।
    सत्कृत्य शिवयोराज्ञां मङ्गलं प्रदिशन्तु मे ॥ १३६॥ प्रभा सरस्वती गौरी लक्ष्मीश्च शिवभाविता । शिवयोः
    शासनादेता मङ्गलं प्रदिशन्तु मे ॥ १३७॥ इन्द्रोऽग्निश्च यमश्चैव निरृतिर्वरुणस्तथा । वायुः सोमः कुबेरश्च
    तथेशानस्त्रिशूलधृक् ॥ १३८॥ सर्वे शिवार्चनरताः शिवसद्भावभाविताः । सत्कृत्य शिवयोराज्ञां मङ्गलं प्रदिशन्तु
    मे ॥ १३९॥ त्रिशूलमथ वज्रं च तथा परशुसायकौ । खड्गपाशाङ्कुशाश्चैव पिनाकश्चायुधोत्तमः ॥ १४०॥ दिव्यायुधानि
    देवस्य देव्याश्चैतानि नित्यशः । सत्कृत्य शिवयोराज्ञां रक्षां कुर्वन्तु मे सदा ॥ १४१॥ वृषरूपधरो देवः
    सौरभेयो महाबलः । वडवाख्यानलस्पर्धां पञ्चगोमातृभिर्वृतः ॥ १४२॥ वाहनत्वमनुप्राप्तस्तपसा परमेशयोः । तयोराज्ञां
    पुरस्कृत्य स मे कामं प्रयच्छतु ॥ १४३॥ नन्दा सुनन्दा सुरभिः सुशीला सुमना तथा । पञ्चगोमातरस्त्वेताश्शिवलोके
    व्यवस्थिताः ॥ १४४॥ शिवभक्तिपरा नित्यं शिवार्चनपरायणाः । शिवयोः शासनादेव दिशन्तु मम वाञ्छितम् ॥ १४५॥
    क्षेत्रपालो महातेजा नीलजीमूतसन्निभः । दंष्ट्राकरालवदनः स्फुरद्रक्ताधरोज्ज्वलः ॥ १४६॥ रक्तोर्ध्वमूर्धजः
    श्रीमान्भ्रुकुटीकुटिलेक्षणः । रक्तवृत्तत्रिनयनः शशिपन्नगभूषणः ॥ १४७॥ नग्नस्त्रिशूलपाशासिकपालोद्यतपाणिकः
    । भैरवो भैरवैः सिद्धैर्योगिनीभिश्च संवृतः ॥ १४८॥ क्षेत्रे क्षेत्रे समासीनः स्थितो यो रक्षकस्सताम्
    । शिवप्रणामपरमः शिवसद्भावभावितः ॥ १४९॥ शिवाश्रितान्विशेषेण रक्षन्पुत्रानिवौरसान् । सत्कृत्य शिवयोराज्ञां
    स मे दिशतु मङ्गलम् ॥ १५०॥ तालजङ्घादयस्तस्य प्रथमावरणेऽर्चिताः । सत्कृत्य शिवयोराज्ञां चत्वारः समवन्तु
    माम् ॥ १५१॥ भैरवाद्याश्च ये चान्ये समन्तात्तस्य वेष्टिताः । तेऽपि मामनुगृह्णन्तु शिवशासनगौरवात् ॥
    १५२॥ नारदाद्याश्च मुनयो दिव्या देवैश्च पूजिताः । साध्या नागाश्च ये देवा जनलोकनिवासिनः ॥ १५३॥ विनिवृत्ताधिकाराश्च
    महर्लोकनिवासिनः । सप्तर्षयस्तथान्ये वै वैमानिकगुणैस्सह ॥ १५४॥ सर्वे शिवार्चनरताः शिवाज्ञावशवर्तिनः
    । शिवयोराज्ञया मह्यं दिशन्तु मम काङ्क्षितम् ॥ १५५॥ गन्धर्वाद्याः पिशाचान्ताश्चतस्रो देवयोनयः । सिद्धा
    विद्याधराद्याश्च येऽपि चान्ये नभश्चराः ॥ १५६॥ असुरा राक्षसाश्चैव पातालतलवासिनः । अनन्ताद्याश्च नागेन्द्रा
    वैनतेयादयो द्विजाः ॥ १५७॥ कूष्माण्डाः प्रेतवेताला ग्रहा भूतगणाः परे । डाकिन्यश्चापि योगिन्यः शाकिन्यश्चापि
    तादृशाः ॥ १५८॥ क्षेत्रारामगृहादीनि तीर्थान्यायतनानि च । द्वीपाः समुद्रा नद्यश्च नदाश्चान्ये सरांसि
    च ॥ १५९॥ गिरयश्च सुमेर्वाद्याः काननानि समन्ततः । पशवः पक्षिणो वृक्षाः कृमिकीटादयो मृगाः ॥ १६०॥ भुवनान्यपि
    सर्वाणि भुवनानामधीश्वराः । अण्डान्यावरणैस्सार्धं मासाश्च दश दिग्गजाः ॥ १६१॥ वर्णाः पदानि मन्त्राश्च
    तत्त्वान्यपि सहाधिपैः । ब्रह्माण्डधारका रुद्रा रुद्राश्चान्ये सशक्तिकाः ॥ १६२॥ यच्च किञ्चिज्जगत्यस्मिन्दृष्टं
    चानुमितं श्रुतम् । सर्वे कामं प्रयच्छन्तु शिवयोरेव शासनात् ॥ १६३॥ अथ विद्या परा शैवी पशुपाशविमोचिनी
    । पञ्चार्थसंज्ञिता दिव्या पशुविद्याबहिष्कृता ॥ १६४॥ शास्त्रं च शिवधर्माख्यं धर्माख्यं च तदुत्तरम्
    । शैवाख्यं शिवधर्माख्यं पुराणं श्रुतिसम्मितम् ॥ १६५॥ शैवागमाश्च ये चान्ये कामिकाद्याश्चतुर्विधाः ।
    शिवाभ्यामविशेषेण सत्कृत्येह समर्चिताः ॥ १६६॥ ताभ्यामेव समाज्ञाता ममाभिप्रेतसिद्धये । कर्मेदमनुमन्यन्तां
    सफलं साध्वनुष्ठितम् ॥ १६७॥ श्वेताद्या नकुलीशान्ताः सशिष्याश्चापि देशिकाः । तत्सन्ततीया गुरवो विशेषाद्गुरवो
    मम ॥ १६८॥ शैवा माहेश्वराश्चैव ज्ञानकर्मपरायणाः । कर्मेदमनुमन्यन्तां सफलं साध्वनुष्ठितम् ॥ १६९॥ लौकिका
    ब्राह्मणास्सर्वे क्षत्रियाश्च विशः क्रमात् । वेदवेदाङ्गतत्त्वज्ञाः सर्वशास्त्रविशारदाः ॥ १७०॥ साङ्ख्या
    वैशेषिकाश्चैव यौगा नैयायिका नराः । सौरा ब्रह्मास्तथा रौद्रा वैष्णवाश्चापरे नराः ॥ १७१॥ शिष्टाः सर्वे
    विशिष्टाश्च शिवशासनयन्त्रिताः । कर्मेदमनुमन्यन्तां ममाभिप्रेतसाधकम् ॥ १७२॥ शैवाः सिद्धान्तमार्गस्थाः
    शैवाः पाशुपतास्तथा । शैवा महाव्रतधराः शैवाः कापालिकाः परे ॥ १७३॥ शिवाज्ञापालकाः पूज्या ममापि शिवशासनात्
    । सर्वे ममानुगृह्णन्तु शंसन्तु सफलक्रियाम् ॥ १७४॥ दक्षिणज्ञाननिष्ठाश्च दक्षिणोत्तरमार्गगाः । अविरोधेन
    वर्तन्तां मन्त्रश्रेयोऽर्थिनो मम ॥ १७५॥ नास्तिकाश्च शठाश्चैव कृतघ्नाश्चैव तामसाः । पाषण्डाश्चातिपापाश्च
    वर्तन्तां दूरतो मम ॥ १७६॥ बहुभिः किं स्तुतैरत्र येऽपि केऽपिचिदास्तिकाः । सर्वे मामनुगृह्णन्तु सन्तः
    शंसन्तु मङ्गलम् ॥ १७७॥ नमश्शिवाय साम्बाय ससुतायादिहेतवे । पञ्चावरणरूपेण प्रपञ्चेनावृताय ते ॥ १७८॥
    इत्युक्त्वा दण्डवद्भूमौ प्रणिपत्य शिवं शिवाम् । जपेत्पञ्चाक्षरीं विद्यामष्टोत्तरशतावराम् ॥ १७९॥ तथैव
    शक्तिविद्यां च जपित्वा तत्समर्पणम् । कृत्वा तं क्षमयित्वेशं पूजाशेषं समापयेत् ॥ १८०॥ एतत्पुण्यतमं
    स्तोत्रं शिवयोर्हृदयङ्गमम् । सर्वाभीष्टप्रदं साक्षाद्भुक्तिमुक्त्यैकसाधनम् ॥ १८१॥ य इदं कीर्तयेन्नित्यं
    श
