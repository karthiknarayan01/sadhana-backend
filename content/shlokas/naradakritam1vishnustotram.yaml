id: naradakritam1vishnustotram
category: stotram
name:
  english: naradakritam1vishnustotram
  devanagari: नारदकृतं१विष्णुस्तोत्रम्
content:
  english: ringam te prasthitah brahmanah sabham | ishtam marge'tha dadrishurgangam vishnupadim dvijah
    || 6|| tam nirikshya samudyuktah snatum sitajale'bhavan | etasminnantare tatra devarshirnarado munih
    || 7|| ajagama dvijashreshtha drishtva bhratrin svakagrajan | tan drishtva snatumudyuktan namaskritya
    kritanjalih || 8|| grinan namani sapremabhaktiyukto madhudvishah | naradovaca | narayanacyutananta
    vasudeva janardana || 9|| yajnesha yajnapurusha krishna vishno namo'stu te | padmaksha kamalakanta
    gangajanaka keshava | kshirodashayin devesha damodara namo'stu te || 10|| shrirama vishno nrisimha
    vamana pradyumna sankarshana vasudeva | ajaniruddhamalarunmurare tvam pahi nah sarvabhayadajasram
    || 11|| iti naradapurane purvabhage dvitiyadhyayantargatam vishnustotram samaptam | brihannaradiyapurana
    | purvabhaga | adhyaya 2
  devanagari: ृङ्गं ते प्रस्थिताः ब्रह्मणः सभाम् । इष्टां मार्गेऽथ ददृशुर्गङ्गां विष्णुपदीं द्विजाः ॥
    ६॥ तां निरीक्ष्य समुद्युक्ताः स्नातुं सीताजलेऽभवन् । एतस्मिन्नन्तरे तत्र देवर्षिर्नारदो मुनिः ॥ ७॥
    आजगाम द्विजश्रेष्ठा दृष्ट्वा भ्रातॄन् स्वकाग्रजान् । तान् दृष्ट्वा स्नातुमुद्युक्तान् नमस्कृत्य कृताञ्जलिः
    ॥ ८॥ गृणन् नामानि सप्रेमभक्तियुक्तो मधुद्विषः । नारदोवाच । नारायणाच्युतानन्त वासुदेव जनार्दन ॥ ९॥
    यज्ञेश यज्ञपुरुष कृष्ण विष्णो नमोऽस्तु ते । पद्माक्ष कमलाकान्त गङ्गाजनक केशव । क्षीरोदशायिन् देवेश
    दामोदर नमोऽस्तु ते ॥ १०॥ श्रीराम विष्णो नृसिंह वामन प्रद्युम्न सङ्कर्षण वासुदेव । अजानिरुद्धामलरुङ्मुरारे
    त्वं पाहि नः सर्वभयादजस्रम् ॥ ११॥ इति नारदपुराणे पूर्वभागे द्वितीयाध्यायान्तर्गतं विष्णुस्तोत्रं समाप्तम्
    । बृहन्नारदीयपुराण । पूर्वभाग । अध्याय २
