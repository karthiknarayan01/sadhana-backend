id: chinnamastakavac
category: kavacha
name:
  english: chinnamastakavac
  devanagari: छिन्नमस्ताकवच्
content:
  english: shrichinnamastakavacam shriganeshaya namah | devyuvaca | kathitashchinnamastaya ya ya vidya
    sugopitah | tvaya nathena jivesha shrutashcadhigata maya || 1|| idanim shrotumicchami kavacam sarvasucitam
    | trailokyavijayam nama kripaya kathyatam prabho || 2|| bhairava uvaca | shrunu vakshyami deveshi
    sarvadevanamaskrite | trailokyavijayam nama kavacam sarvamohanam || 3|| sarvavidyamayam sakshatsuratsurajayapradam
    | dharanatpathanadishastrailokyavijayi vibhuh || 4|| brahma narayano rudro dharanatpathanadyatah |
    karta pata ca samharta bhuvananam sureshvari || 5|| na deyam parashishyebhyo'bhaktebhyo'pi visheshatah
    | deyam shishyaya bhaktaya pranebhyo'pyadhikaya ca || 6|| devyashca chinnamastayah kavacasya ca bhairavah
    | rishistu syadvirat chando devata chinnamastaka || 7|| trailokyavijaye muktau viniyogah prakirtitah
    | humkaro me shirah patu chinnamasta balaprada || 8|| hram hrum aim tryakshari patu bhalam vaktram
    digambara | shrim hrim hrum aim drishau patu mundam kartridharapi sa || 9|| sa vidya pranavadyanta
    shrutiyugmam sada'vatu | vajravairocaniye hum phat svaha ca dhruvadika || 10|| ghranam patu chinnamasta
    mundakartrividharini | shrimayakurcavagbijairvajravairocaniyahrum || 11|| hum phat svaha mahavidya
    shodashi brahmarupini | svaparshve varnini casrigdharam payayati muda || 12|| vadanam sarvada patu
    chinnamasta svashaktika | mundakartridhara rakta sadhakabhishtadayini || 13|| varnini dakiniyukta
    sapi mamabhito'vatu | ramadya patu jihvam ca lajjadya patu kanthakam || 14|| kurcadya hridayam patu
    vagadya stanayugmakam | ramaya putita vidya parshvau patu sureshvari || 15|| mayaya putita patu nabhideshe
    digambara | kurcena putita devi prishthadeshe sada'vatu || 16|| vagbijaputita caisha madhyam patu
    sashaktika | ishvari kurcavagbijairvajravairocaniyahrum || 17|| humphat svaha mahavidya kotisuryyasamaprabha
    | chinnamasta sada payaduruyugmam sashaktika || 18|| hrim hrum varnini janum shrim hrim ca dakini
    padam | sarvavidyasthita nitya sarvangam me sada'vatu || 19|| pracyam payadekalinga yogini pavake'vatu
    | dakini dakshine patu shrimahabhairavi ca mam || 20|| nairrityam satatam patu bhairavi pashcime'vatu
    | indrakshi patu vayavye'sitangi patu cottare || 21|| samharini sada patu shivakone sakartrika | ityashtashaktayah
    pantu digvidikshu sakartrikah || 22|| krim krim krim patu sa purvam hrim hrim mam patu pavake | hrum
    hrum mam dakshine patu dakshine kalika'vatu || 23|| krim krim krim caiva nairrityam hrim hrim ca pashcime'vatu
    | hrum hrum patu marutkone svaha patu sadottare || 24|| mahakali khadgahasta rakshahkone sada'vatu
    | taro maya vadhuh kurcam phat karo'yam mahamanuh || 25|| khadgakartridhara tara cordhvadesham sada'vatu
    | hrim strim hum phat ca patale mam patu caikajata sati | tara tu sahita khe'vyanmahanilasarasvati
    || 26|| iti te kathitam devyah kavacam mantravigraham | yaddhritva pathananbhimah krodhakhyo bhairavah
    smritah || 27|| surasuramunindranam karta harta bhavetsvayam | yasyajnaya madhumati yati sa sadhakalayam
    || 28|| bhutinyadyashca dakinyo yakshinyadyashca khecarah | ajnam grihnamti tastasya kavacasya prasadatah
    || 29|| etadevam param brahmakavacam manmukhoditam | devimabhyarca gandhadyairmulenaiva pathetsakrit
    || 30|| samvatsarakritayastu pujayah phalamapnuyat | bhurje vilikhitam caitadgutikam kancanasthitam
    || 31|| dharayeddakshine bahau kanthe va yadi vanyatah | sarvaishvaryayuto bhutva trailokyam vashamanayet
    || 32|| tasya gehe vasellakshmirvani ca vadanambuje | brahmastradini shastrani tadgatre yanti saumyatam
    || 33|| idam kavacamajnatva yo bhajecchinnamastakam | so'pi shatrapraharena mrityumapnoti satvaram
    || 34|| || iti shribhairavatantre bhairavabhairavisamvade trailokyavijayam nama chinnamastakavacam
    sampurnam ||
  devanagari: श्रीछिन्नमस्ताकवचम् श्रीगणेशाय नमः । देव्युवाच । कथिताश्छिन्नमस्ताया या या विद्या सुगोपिताः
    । त्वया नाथेन जीवेश श्रुताश्चाधिगता मया ॥ १॥ इदानीं श्रोतुमिच्छामि कवचं सर्वसूचितम् । त्रैलोक्यविजयं
    नाम कृपया कथ्यतां प्रभो ॥ २॥ भैरव उवाच । श्रुणु वक्ष्यामि देवेशि सर्वदेवनमस्कृते । त्रैलोक्यविजयं
    नाम कवचं सर्वमोहनम् ॥ ३॥ सर्वविद्यामयं साक्षात्सुरात्सुरजयप्रदम् । धारणात्पठनादीशस्त्रैलोक्यविजयी
    विभुः ॥ ४॥ ब्रह्मा नारायणो रुद्रो धारणात्पठनाद्यतः । कर्ता पाता च संहर्ता भुवनानां सुरेश्वरि ॥ ५॥
    न देयं परशिष्येभ्योऽभक्तेभ्योऽपि विशेषतः । देयं शिष्याय भक्ताय प्राणेभ्योऽप्यधिकाय च ॥ ६॥ देव्याश्च
    छिन्नमस्तायाः कवचस्य च भैरवः । ऋषिस्तु स्याद्विराट् छन्दो देवता छिन्नमस्तका ॥ ७॥ त्रैलोक्यविजये मुक्तौ
    विनियोगः प्रकीर्तितः । हुंकारो मे शिरः पातु छिन्नमस्ता बलप्रदा ॥ ८॥ ह्रां ह्रूं ऐं त्र्यक्षरी पातु
    भालं वक्त्रं दिगम्बरा । श्रीं ह्रीं ह्रूं ऐं दृशौ पातु मुण्डं कर्त्रिधरापि सा ॥ ९॥ सा विद्या प्रणवाद्यन्ता
    श्रुतियुग्मं सदाऽवतु । वज्रवैरोचनीये हुं फट् स्वाहा च ध्रुवादिका ॥ १०॥ घ्राणं पातु छिन्नमस्ता मुण्डकर्त्रिविधारिणी
    । श्रीमायाकूर्चवाग्बीजैर्वज्रवैरोचनीयह्रूम् ॥ ११॥ हूं फट् स्वाहा महाविद्या षोडशी ब्रह्मरूपिणी । स्वपार्श्वे
    वर्णिनी चासृग्धारां पाययती मुदा ॥ १२॥ वदनं सर्वदा पातु छिन्नमस्ता स्वशक्तिका । मुण्डकर्त्रिधरा रक्ता
    साधकाभीष्टदायिनी ॥ १३॥ वर्णिनी डाकिनीयुक्ता सापि मामभितोऽवतु । रामाद्या पातु जिह्वां च लज्जाद्या पातु
    कण्ठकम् ॥ १४॥ कूर्चाद्या हृदयं पातु वागाद्या स्तनयुग्मकम् । रमया पुटिता विद्या पार्श्वौ पातु सुरेश्वरी
    ॥ १५॥ मायया पुटिता पातु नाभिदेशे दिगम्बरा । कूर्चेण पुटिता देवी पृष्ठदेशे सदाऽवतु ॥ १६॥ वाग्बीजपुटिता
    चैषा मध्यं पातु सशक्तिका । ईश्वरी कूर्चवाग्बीजैर्वज्रवैरोचनीयह्रूम् ॥ १७॥ हूंफट् स्वाहा महाविद्या
    कोटिसूर्य्यसमप्रभा । छिन्नमस्ता सदा पायादुरुयुग्मं सशक्तिका ॥ १८॥ ह्रीं ह्रूं वर्णिनी जानुं श्रीं
    ह्रीं च डाकिनी पदम् । सर्वविद्यास्थिता नित्या सर्वाङ्गं मे सदाऽवतु ॥ १९॥ प्राच्यां पायादेकलिङ्गा योगिनी
    पावकेऽवतु । डाकिनी दक्षिणे पातु श्रीमहाभैरवी च माम् ॥ २०॥ नैरृत्यां सततं पातु भैरवी पश्चिमेऽवतु ।
    इन्द्राक्षी पातु वायव्येऽसिताङ्गी पातु चोत्तरे ॥ २१॥ संहारिणी सदा पातु शिवकोणे सकर्त्रिका । इत्यष्टशक्तयः
    पान्तु दिग्विदिक्षु सकर्त्रिकाः ॥ २२॥ क्रीं क्रीं क्रीं पातु सा पूर्वं ह्रीं ह्रीं मां पातु पावके
    । ह्रूं ह्रूं मां दक्षिणे पातु दक्षिणे कालिकाऽवतु ॥ २३॥ क्रीं क्रीं क्रीं चैव नैरृत्यां ह्रीं ह्रीं
    च पश्चिमेऽवतु । ह्रूं ह्रूं पातु मरुत्कोणे स्वाहा पातु सदोत्तरे ॥ २४॥ महाकाली खड्गहस्ता रक्षःकोणे
    सदाऽवतु । तारो माया वधूः कूर्चं फट् कारोऽयं महामनुः ॥ २५॥ खड्गकर्त्रिधरा तारा चोर्ध्वदेशं सदाऽवतु
    । ह्रीं स्त्रीं हूं फट् च पाताले मां पातु चैकजटा सती । तारा तु सहिता खेऽव्यान्महानीलसरस्वती ॥ २६॥
    इति ते कथितं देव्याः कवचं मन्त्रविग्रहम् । यद्धृत्वा पठनान्भीमः क्रोधाख्यो भैरवः स्मृतः ॥ २७॥ सुरासुरमुनीन्द्राणां
    कर्ता हर्ता भवेत्स्वयम् । यस्याज्ञया मधुमती याति सा साधकालयम् ॥ २८॥ भूतिन्याद्याश्च डाकिन्यो यक्षिण्याद्याश्च
    खेचराः । आज्ञां गृह्णंति तास्तस्य कवचस्य प्रसादतः ॥ २९॥ एतदेवं परं ब्रह्मकवचं मन्मुखोदितम् । देवीमभ्यर्च
    गन्धाद्यैर्मूलेनैव पठेत्सकृत् ॥ ३०॥ संवत्सरकृतायास्तु पूजायाः फलमाप्नुयात् । भूर्जे विलिखितं चैतद्गुटिकां
    काञ्चनस्थिताम् ॥ ३१॥ धारयेद्दक्षिणे बाहौ कण्ठे वा यदि वान्यतः । सर्वैश्वर्ययुतो भूत्वा त्रैलोक्यं
    वशमानयेत् ॥ ३२॥ तस्य गेहे वसेल्लक्ष्मीर्वाणी च वदनाम्बुजे । ब्रह्मास्त्रादीनि शस्त्राणि तद्गात्रे
    यान्ति सौम्यताम् ॥ ३३॥ इदं कवचमज्ञात्वा यो भजेच्छिन्नमस्तकाम् । सोऽपि शत्रप्रहारेण मृत्युमाप्नोति
    सत्वरम् ॥ ३४॥ ॥ इति श्रीभैरवतन्त्रे भैरवभैरवीसंवादे त्रैलोक्यविजयं नाम छिन्नमस्ताकवचं सम्पूर्णम् ॥
