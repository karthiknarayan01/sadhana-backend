id: lunthakarditaihbalakabalikastribhihkritampurushottamastotram-10
category: stotram
name:
  english: lunthakarditaihbalakabalikastribhihkritampurushottamastotram 10
  devanagari: लुण्ठकार्दितैःबालकबालिकास्त्रीभिःकृतंपुरुषोत्तमस्तोत्रम् १०
content:
  english: rinu lakshmi balikashca balakashcapi vihvalah | astuvanmam svarakshartham yadaham shrutava~stada
    || 1|| divodasasutam divyadevim bhagyavihinakam | kashtadvimucya naijam yashcakre'kshare'nayacca tam
    || 2|| balakrishnah sa bhagavan nah prarakshatu sevikah | bhillibhillau tava sadhoryoganmoksham gatau
    pura || 3|| subahunripatirbharyasahitah sadhusamshrayat | tava pratapatah krishna mokshamargam yayau
    pura || 4|| ashokasundarim kanyam satishankaraputrikam | tvam raraksha pura krishna nah prarakshaya
    sevikah || 5|| vihundasya vinashartham narirupo'bhavah pura | kamodayah patistvam sa nah prarakshatu
    sevikah || 6|| shukamokshapradastvam nah praraksha nijabalikah | khasho namna vishnudaso ramani casya
    bhamini || 7|| lilavati ca tatkanya puroddhritastvaya prabho | ganikanam pura krishna papani tu tvaya
    vibho || 8|| kritva punyasvarupani punyajanan vyadhastada | ganika yoginishcapi kritava~stvam pura
    prabho || 9|| rakshanamnyah shvapacyastvam sumarasya tu yoshitah | muktidata'bhavah krishna nah sa
    rakshatu sevikah || 10|| kaushikam garudam cakre gayakam yah pura prabhuh | malavam nama vaishyam
    ca tatha'nyan ganakovidan || 11|| brahmalokam hyanayad yo nah sa rakshatu sevikah | harimishram brahmanam
    yo dadau moksham sa patu nah || 12|| cidambaramaharajnyai jishnupatnyai pura bhavan | gadam samarpya
    raksham ca'karodbhadrakarakshasat || 13|| prajashca jivinastasyah sa no rakshatu sevikah | raneshvaryah
    krita naija brahmapriya gadasutah || 14|| yena narayanenapi krishnah sa nah prarakshatu | raneshvarastatha
    muktah krita yena sa rakshatu || 15|| bindumatyah krito yena moksho yayatiyoshitah | sa harilunthakebhyashca'vanam
    karotu madhavah || 16|| parashucandrako yena narayanena taritah | so'yam kantagunah krishno rakshatu
    nijasevikah || 17|| sucandrikam gopapatnim gopalam tatpatim tatha | anayadyo'ksharam dhama sa krishno
    nah prarakshatu || 18|| hariprathamanoh patni brahmapatha'ksharam pratim | prapita yena harina sa
    krishno nah prarakshatu || 19|| gridhranam mokshanam yena kritam pura paratmana | balakrishno harikrishnah
    sa krishno nah prarakshatu || 20|| jivacandraya muktim yo dadau krishnah sa rakshatu | shatanandavinodinyoh
    putranam mokshanam kritam || 21|| yena shriharina krishnah sa eva nah prarakshatu | kashivaranganabhyo
    yo muktidah sa prarakshatu || 22|| vrishayanena cataka yadbalena prarakshita | balakrishno'nadikrishnah
    sa krishno nah prarakshatu || 23|| citraketoshca malatya rajnya muktih krita pura | yena shribalakrishnena
    krishno nah sa prarakshatu || 24|| shreshtha yena kritah santah sa nah krishnah prarakshatu | krishangakah
    krito yena krishanuh sa prarakshatu || 25|| bhangasvanah krito yena naro nari muhurmuhuh | sa eva
    bhagavan krishno rakshatvatra svasevikah || 16|| vipulam ca rucim devasharmanam yo raraksha ha | mokshado
    bhagavan krishno duhkhadasmat prarakshatu || 27|| gokarnakhye pura tirthe rishayo yena vasita | sa
    eva bhagavanasman lunthakebhyah prarakshatu || 28|| kuvalashvam tathottankam satyavratam ca galavam
    | shreyase kalpayamasa yah sa krishnah prarakshatu || 29|| yatpratapena ca pranadbrahmasadhuh pratapavan
    | samabhavat sa krishno no lunthakebhyah prarakshatu || 30|| kesharinisutashca''lambayano muktimapa
    vai | yatpratapena krishnah sa lunthakebhyah prarakshatu || 31|| gokarnasthan lakshasadhun ninye dhamaksharam
    tu yah | balakrishnam priyah kanto nah prarakshatu vallabhah || 32|| shabaro rakshaso yena mocito
    bhavabandhanat | gridhrashca shvapacashcapi sa krishno'vatu sevikah || 33|| khyatim shapaparam vikshya
    cakarta yastu tacchirah | sa nah krishno lunthakebhyah prarakshatu svasevikah || 34|| bharundah pushkaso
    yena taritah sa prarakshatu | vrishadarbhih krito yena muktah krishnah sa rakshatu || 35|| narashayastaskarastu
    mocito yena cakrina | dhanino mocita yena sa krishno'vatu sevikah || 36|| kundadharma'vita yena'vitashca
    janghalamakhah | balakrishno divyakantah kanyaka nah prarakshatu || 37|| yena shambhalavaro'pi prajaya
    saha mocitah | balahkrishno vallabho'tra prarakshatu svasevikah || 38|| devanikadivyavamshe balakrishno
    vyajayata | sa eva bhagavanatra prarakshatu svasevikah || 39|| namo'nadikrishnanarayanaya svamine
    namah | namah shrikambharalakshmigopalajanushe namah || 40|| dirghashilo vipravaryo mocito yamapashatah
    | yena shriharina so'yam prarakshatu svadasikah || 41|| brahmasati brahmani ya mocita paramatmana
    | so'yam no bhagavannathah prarakshatu svasevikah || 42|| kalandhara maharajni vaivartto nama bhupatih
    | mocitau yena krishnena sa krishno'vatu sevikah || 43|| romapadasya vai putro vrishagamo'pi vishnuna
    | mocito yena krishnena sa krishno'vatu sevikah || 44|| nagrabhangah pura cauro mocito yena vishnuna
    | balakrishnah krishnanarayano nah sa prarakshatu || 45|| bhandasuro hato lalitadvara yena cakrina
    | sa casmanatra krishnashrikrishno rakshatu sevikah || 46|| lalitamanasikanyah kotishah svikritah
    pura | yena shriparameshena sa krishno'vatu sevikah || 47|| lohangarasya vaishyasya mokshakrinnah
    prarakshatu | pivaryadya vrate yena purnakama nirupitah || 48|| so'yam krishno lunthakebhyo nah prarakshatu
    dasikah | vasishtha'gastyakau shapanmocitau yena sharngina || 49|| anadishrikrishnanarayano nah sa
    prarakshatu | parusho lubdhako yena mocito bharyaya saha || 50|| pushkaravahanasyapi mokshakrinnah
    prarakshatu | sarojini kumbhakartri satishvarikripanvita || 51|| padmini sa'bhavadyasya kripaya kamalasama
    | sa shrikrishnah prabhushcasman lunthakebhyah prarakshatu || 52|| dharmatapaso viprasya rakshanam
    kritava~stu yah | surathasya manutvam ca kritavan shripatistu yah || 53|| dhanavarma divam yena preshitah
    paramatmana | balishvarastatha rajye sthapito manave dvijah || 14|| anandavarni yena'pi sthapito manave
    tatha | rajye ghrineshikah shudrah sthapito yena manave || 55|| bhutishca tarito yena krishno rakshatu
    sevikah | asuro balako yenoddhrito'sya manayah kritah || 56|| bashkalirnashito yena vishnurnah samprarakshatu
    | gajanarayanenapi purukrisaro ghatitah || 57|| pralambo nashito yena matsyatmakena sharngina | bhimaratho
    ghatitashca kurmarupena yena vai || 58|| shantashatrurghatitashca hamsarupena yena hi | mahakalo nashitashca
    hayagrivena yena tu || 59|| hiranyakshavihanta sa krishno'vatu svasevikah | vamano'vatu krishnashca
    kalakakshavinashakrit || 60|| balishatrvasurahanta harirduhkham vyapohatu | dashagrivavihanta ca narirupo'vatu
    prabhuh || 61|| tarakaghno harirnapumsakarupo'pi rakshatu | tittibho vihato yena mayurarupina pura
    || 62|| shucishca ghatito yena cakrina nah sa rakshatu | sadhubhavayanarsheshca tatha shrimanasasya
    ca || 63|| cidanandasyapi mokshakrit krishno nah prarakshatu | sadvidyayanapatnim yah shrutiphalam
    hyamokshayat || 64|| alarkajananimoksham kritavan sa prarakshatu | muktisrotayanashcapi siddhiveshayanastatha
    || 65|| ayacitanjalibharya bhikshayanarishih patih | mukta yasya''shrayenaishah shrikrishno nah prarakshatu
    || 66|| mata nityashraya putrah keshi yena pramocitau | balakrishno maharajah sa nastvatra prarakshatu
    || 67|| mata tu carani putro vyaghrashca yena taritau | kutadevah pita sadhuh shyamashca yena taritau
    || 68|| uttamashcapi bhudevo devayanarishistatha | kashtat pramocitau yena krishno rakshatu sevika
    || 69|| yena viralako vaishyah sakutumbah samuddhritah | balakrishnah priyaprano lunthakebhyah prarakshatu
    || 70|| prithvidharo nripo madhuvinda rajni samuddhritau | tatha durvodhako dinashcoddhrito yena so'vatu
    || 71|| sagarah shudrakashcapi venapalabhidho nripah | hiruka shudrapatni ca rakshita yena so'vatu
    || 72|| vriknadevo bhavashurah shiladharma sati tatha | mocita yena krishnena so'yam rakshatu sevikah
    || 73|| manjulakesho bhudevah pashupateshaviprarat | bananganastatha shudro rakshita yena so'vatu
    || 74|| mritadanah santadaso dharmashalayanastatha | shankudharashcoddhritashca yena so'vatu sevikah
    || 75|| lunthakadhipatishcayam namna samantavikramah | lunthayatyatisarvasvam krishna ha krishna raksha
    nah || 76|| tava smo'tra tava smo'tra tvatsevikah prarakshaya | antaratman vyapakatman bhumannatra
    prarakshaya || 77|| balakashcapi vai krishnastavanam cakrire tatha | shrutva'ham sahasa tatra shatarupo'bhavam
    rame || 78|| ashvavara ushtravarah sashastra bhubhrito bhatah | pancashadvegato duradagata rakshanaya
    vai || 79|| uccairakroshamadadhyuh sajjashcaura bhavantviti | marayishyama eva'tra jayantam matriputrakah
    || 80|| evam nadan shravayanto sphotayanto hi dhushkritih | ushtra'shvadyaih kshanaddikshu dashasvavrittaya~shca
    tan || 81|| vartule cauraloka~stanavritya rajaparshadah | dharshayitum dandayitum tadayitum puro'gaman
    || 82|| tavatte roshamapanna jivanasham vihaya vai | dudruvurmadhyadeshacca dhushkritisphotakarinah
    || 83|| tada me parshadairlakshmi dhushkritayah sphotita drutam | yuddham parasparam jatam dhushkritigolikamayam
    || 84|| maya te golikayantrairviddhah sarve'tigarvitah | mritaste tatra pancashatsarve golyabhibheditah
    || 85|| tan sarvananayam svargam mama hastairmritanatah | mocitan bhaktavanijastato'ham samasantvayam
    || 86|| te sarve sharanam prapta nara naryashca balikah | balashca petushcarane mama sainyaparupinah
    || 87|| iti shrilakshminarayaniyasamhitayah dvaparayugasantanatmakasya tritiyakhande 191
  devanagari: ृणु लक्ष्मि बालिकाश्च बालकाश्चापि विह्वलाः । अस्तुवन्मां स्वरक्षार्थं यदहं श्रुतवाँस्तदा
    ॥ १॥ दिवोदाससुतां दिव्यादेवीं भाग्यविहीनकाम् । कष्टाद्विमुच्य नैजां यश्चक्रेऽक्षरेऽनयच्च ताम् ॥ २॥
    बालकृष्णः स भगवान् नः प्ररक्षतु सेविकाः । भिल्लीभिल्लौ तव साधोर्योगान्मोक्षं गतौ पुरा ॥ ३॥ सुबाहुनृपतिर्भार्यासहितः
    साधुसंश्रयात् । तव प्रतापतः कृष्ण मोक्षमार्गं ययौ पुरा ॥ ४॥ अशोकसुन्दरीं कन्यां सतीशङ्करपुत्रिकाम्
    । त्वं ररक्ष पुरा कृष्ण नः प्ररक्षय सेविकाः ॥ ५॥ विहुण्डस्य विनाशार्थं नारीरूपोऽभवः पुरा । कामोदायाः
    पतिस्त्वं स नः प्ररक्षतु सेविकाः ॥ ६॥ शुकमोक्षप्रदस्त्वं नः प्ररक्ष निजबालिकाः । खशो नाम्ना विष्णुदासो
    रामणी चास्य भामिनी ॥ ७॥ लीलावती च तत्कन्या पुरोद्धृतास्त्वया प्रभो । गणिकानां पुरा कृष्ण पापानि तु
    त्वया विभो ॥ ८॥ कृत्वा पुण्यस्वरूपाणि पुण्यजनान् व्यधास्तदा । गणिका योगिनीश्चापि कृतवाँस्त्वं पुरा
    प्रभो ॥ ९॥ रक्षानाम्न्याः श्वपच्यास्त्वं सुमरस्य तु योषितः । मुक्तिदाताऽभवः कृष्ण नः स रक्षतु सेविकाः
    ॥ १०॥ कौशिकं गरुडं चक्रे गायकं यः पुरा प्रभुः । मालवं नाम वैश्यं च तथाऽन्यान् गानकोविदान् ॥ ११॥ ब्रह्मलोकं
    ह्यनयद् यो नः स रक्षतु सेविकाः । हरिमिश्रं ब्राह्मणं यो ददौ मोक्षं स पातु नः ॥ १२॥ चिदम्बरामहाराज्ञ्यै
    जिष्णुपत्न्यै पुरा भवान् । गदां समर्प्य रक्षां चाऽकरोद्भद्रकराक्षसात् ॥ १३॥ प्रजाश्च जीविनास्तस्याः
    स नो रक्षतु सेविकाः । रणेश्वर्यः कृता नैजा ब्रह्मप्रिया गदासुताः ॥ १४॥ येन नारायणेनापि कृष्णः स नः
    प्ररक्षतु । रणेश्वरास्तथा मुक्ताः कृता येन स रक्षतु ॥ १५॥ बिन्दुमत्याः कृतो येन मोक्षो ययातियोषितः
    । स हरिलुण्ठकेभ्यश्चाऽवनं करोतु माधवः ॥ १६॥ परशुचन्द्रको येन नारायणेन तारितः । सोऽयं कान्तगुणः कृष्णो
    रक्षतु निजसेविकाः ॥ १७॥ सुचन्द्रिकां गोपपत्नीं गोपालं तत्पतिं तथा । अनयद्योऽक्षरं धाम स कृष्णो नः
    प्ररक्षतु ॥ १८॥ हरिप्रथमनोः पत्नी ब्रह्मपथाऽक्षरं प्रतिम् । प्रापिता येन हरिणा स कृष्णो नः प्ररक्षतु
    ॥ १९॥ गृध्राणां मोक्षणं येन कृतं पुरा परात्मना । बालकृष्णो हरिकृष्णः स कृष्णो नः प्ररक्षतु ॥ २०॥ जीवचन्द्राय
    मुक्तिं यो ददौ कृष्णः स रक्षतु । शतानन्दविनोदिन्योः पुत्राणां मोक्षणं कृतम् ॥ २१॥ येन श्रीहरिणा कृष्णः
    स एव नः प्ररक्षतु । काशीवाराङ्गनाभ्यो यो मुक्तिदः स प्ररक्षतु ॥ २२॥ वृषायनेन चटका यद्बलेन प्ररक्षिता
    । बालकृष्णोऽनादिकृष्णः स कृष्णो नः प्ररक्षतु ॥ २३॥ चित्रकेतोश्च मालत्या राज्ञ्या मुक्तिः कृता पुरा
    । येन श्रीबालकृष्णेन कृष्णो नः स प्ररक्षतु ॥ २४॥ श्रेष्ठा येन कृताः सन्तः स नः कृष्णः प्ररक्षतु ।
    कृशाङ्गकः कृतो येन कृशानुः स प्ररक्षतु ॥ २५॥ भङ्गास्वनः कृतो येन नरो नारी मुहुर्मुहुः । स एव भगवान्
    कृष्णो रक्षत्वत्र स्वसेविकाः ॥ १६॥ विपुलं च रुचिं देवशर्माणं यो ररक्ष ह । मोक्षदो भगवान् कृष्णो दुःखादस्मात्
    प्ररक्षतु ॥ २७॥ गोकर्णाख्ये पुरा तीर्थे ऋषयो येन वासिता । स एव भगवानस्मान् लुण्ठकेभ्यः प्ररक्षतु ॥
    २८॥ कुवलाश्वं तथोत्तङ्कं सत्यव्रतं च गालवम् । श्रेयसे कल्पयामास यः स कृष्णः प्ररक्षतु ॥ २९॥ यत्प्रतापेन
    च प्रणद्ब्रह्मसाधुः प्रतापवान् । समभवत् स कृष्णो नो लुण्ठकेभ्यः प्ररक्षतु ॥ ३०॥ केशरिणीसुतश्चाऽऽलम्बायनो
    मुक्तिमाप वै । यत्प्रतापेन कृष्णः स लुण्ठकेभ्यः प्ररक्षतु ॥ ३१॥ गोकर्णस्थान् लक्षसाधून् निन्ये धामाक्षरं
    तु यः । बालकृष्णं प्रियः कान्तो नः प्ररक्षतु वल्लभाः ॥ ३२॥ शबरो राक्षसो येन मोचितो भवबन्धनात् । गृध्रश्च
    श्वपचश्चापि स कृष्णोऽवतु सेविकाः ॥ ३३॥ ख्यातिं शापपरां वीक्ष्य चकर्त यस्तु तच्छिरः । स नः कृष्णो लुण्ठकेभ्यः
    प्ररक्षतु स्वसेविकाः ॥ ३४॥ भारुण्डः पुष्कसो येन तारितः स प्ररक्षतु । वृषादर्भिः कृतो येन मुक्तः कृष्णः
    स रक्षतु ॥ ३५॥ नरशायस्तस्करस्तु मोचितो येन चक्रिणा । धनिनो मोचिता येन स कृष्णोऽवतु सेविकाः ॥ ३६॥ कुन्दधर्माऽविता
    येनाऽवितश्च जाङ्घलामखः । बालकृष्णो दिव्यकान्तः कन्यका नः प्ररक्षतु ॥ ३७॥ येन शम्भलवारोऽपि प्रजया सह
    मोचितः । बालःकृष्णो वल्लभोऽत्र प्ररक्षतु स्वसेविकाः ॥ ३८॥ देवानीकदिव्यवंशे बालकृष्णो व्यजायत । स एव
    भगवानत्र प्ररक्षतु स्वसेविकाः ॥ ३९॥ नमोऽनादिकृष्णनारायणाय स्वामिने नमः । नमः श्रीकम्भरालक्ष्मीगोपालजनुषे
    नमः ॥ ४०॥ दीर्घशीलो विप्रवर्यो मोचितो यमपाशतः । येन श्रीहरिणा सोऽयं प्ररक्षतु स्वदासिकाः ॥ ४१॥ ब्रह्मसती
    ब्राह्मणी या मोचिता परमात्मना । सोऽयं नो भगवान्नाथः प्ररक्षतु स्वसेविकाः ॥ ४२॥ कालन्धरा महाराज्ञी
    वैवर्त्तो नाम भूपतिः । मोचितौ येन कृष्णेन स कृष्णोऽवतु सेविकाः ॥ ४३॥ रोमपादस्य वै पुत्रो वृषगमोऽपि
    विष्णुना । मोचितो येन कृष्णेन स कृष्णोऽवतु सेविकाः ॥ ४४॥ नग्रभङ्गः पुरा चौरो मोचितो येन विष्णुना ।
    बालकृष्णः कृष्णनारायणो नः स प्ररक्षतु ॥ ४५॥ भण्डासुरो हतो ललिताद्वारा येन चक्रिणा । स चास्मानत्र कृष्णश्रीकृष्णो
    रक्षतु सेविकाः ॥ ४६॥ ललितामानसीकन्याः कोटिशः स्वीकृताः पुरा । येन श्रीपरमेशेन स कृष्णोऽवतु सेविकाः
    ॥ ४७॥ लोहाङ्गारस्य वैश्यस्य मोक्षकृन्नः प्ररक्षतु । पीवर्याद्या व्रते येन पूर्णकामा निरूपिताः ॥ ४८॥
    सोऽयं कृष्णो लुण्ठकेभ्यो नः प्ररक्षतु दासिकाः । वसिष्ठाऽगस्त्यकौ शापान्मोचितौ येन शार्ङ्गिणा ॥ ४९॥
    अनादिश्रीकृष्णनारायणो नः स प्ररक्षतु । परुषो लुब्धको येन मोचितो भार्यया सह ॥ ५०॥ पुष्करवाहनस्यापि
    मोक्षकृन्नः प्ररक्षतु । सरोजिनी कुम्भकर्त्री सतीश्वरीकृपान्विता ॥ ५१॥ पद्मिनी साऽभवद्यस्य कृपया कमलासमा
    । स श्रीकृष्णः प्रभुश्चास्मान् लुण्ठकेभ्यः प्ररक्षतु ॥ ५२॥ धर्मतपसो विप्रस्य रक्षणं कृतवाँस्तु यः
    । सुरथस्य मनुत्वं च कृतवान् श्रीपतिस्तु यः ॥ ५३॥ धनवर्मा दिवं येन प्रेषितः परमात्मना । बलीश्वरस्तथा
    राज्ये स्थापितो मानवे द्विजः ॥ १४॥ आनन्दवर्णी येनाऽपि स्थापितो मानवे तथा । राज्ये घृणेषिकः शूद्रः
    स्थापितो येन मानवे ॥ ५५॥ भूतिश्च तरितो येन कृष्णो रक्षतु सेविकाः । असुरो बालको येनोद्धृतोऽस्य मणयः
    कृताः ॥ ५६॥ बाष्कलिर्नाशितो येन विष्णुर्नः सम्प्ररक्षतु । गजनारायणेनापि पुरुकृसरो घातितः ॥ ५७॥ प्रलम्बो
    नाशितो येन मत्स्यात्मकेन शार्ङ्गिणा । भीमरथो घातितश्च कूर्मरूपेण येन वै ॥ ५८॥ शान्तशत्रुर्घातितश्च
    हंसरूपेण येन हि । महाकालो नाशितश्च हयग्रीवेण येन तु ॥ ५९॥ हिरण्याक्षविहन्ता स कृष्णोऽवतु स्वसेविकाः
    । वामनोऽवतु कृष्णश्च कालकाक्षविनाशकृत् ॥ ६०॥ बलिशत्र्वसुरहन्ता हरिर्दुःखं व्यपोहतु । दशग्रीवविहन्ता
    च नारीरूपोऽवतु प्रभुः ॥ ६१॥ तारकघ्नो हरिर्नपुंसकरूपोऽपि रक्षतु । टिट्टिभो विहतो येन मायूररूपिणा पुरा
    ॥ ६२॥ शुचिश्च घातितो येन चक्रिणा नः स रक्षतु । साधुभावायनर्षेश्च तथा श्रीमानसस्य च ॥ ६३॥ चिदानन्दस्यापि
    मोक्षकृत् कृष्णो नः प्ररक्षतु । सद्विद्यायनपत्नीं यः श्रुतिफलां ह्यमोक्षयत् ॥ ६४॥ अलर्कजननीमोक्षं
    कृतवान् स प्ररक्षतु । मुक्तिस्रोतायनश्चापि सिद्धिवेषायनस्तथा ॥ ६५॥ अयाचिताञ्जलिभार्या भिक्षायनऋषिः
    पतिः । मुक्ता यस्याऽऽश्रयेणैषः श्रीकृष्णो नः प्ररक्षतु ॥ ६६॥ माता नित्याश्रया पुत्रः केशी येन प्रमोचितौ
    । बालकृष्णो महाराजः स नस्त्वत्र प्ररक्षतु ॥ ६७॥ माता तु चारणी पुत्रो व्याघ्रश्च येन तारितौ । कूटदेवः
    पिता साधुः श्यामश्च येन तारितौ ॥ ६८॥ उत्तमश्चापि भूदेवो देवायनऋषिस्तथा । कष्टात् प्रमोचितौ येन कृष्णो
    रक्षतु सेविका ॥ ६९॥ येन विरालको वैश्यः सकुटुम्बः समुद्धृतः । बालकृष्णः प्रियप्राणो लुण्ठकेभ्यः प्ररक्षतु
    ॥ ७०॥ पृथ्वीधरो नृपो मधुविन्दा राज्ञी समुद्धृतौ । तथा दुर्वोढको दीनश्चोद्धृतो येन सोऽवतु ॥ ७१॥ सागरः
    शूद्रकश्चापि वेनपालाभिधो नृपः । हीरुका शूद्रपत्नी च रक्षिता येन सोऽवतु ॥ ७२॥ वृक्णदेवो भावशूरः शीलधर्मा
    सती तथा । मोचिता येन कृष्णेन सोऽयं रक्षतु सेविकाः ॥ ७३॥ मञ्जुलकेशो भूदेवः पाशुपतेशविप्रराट् । बाणाङ्गणस्तथा
    शूद्रो रक्षिता येन सोऽवतु ॥ ७४॥ मृतादनः सन्तदासो धर्मशालायनस्तथा । शङ्कुधरश्चोद्धृताश्च येन सोऽवतु
    सेविकाः ॥ ७५॥ लुण्ठकाधिपतिश्चायं नाम्ना सामन्तविक्रमः । लुण्ठयत्यतिसर्वस्वं कृष्ण हा कृष्ण रक्ष नः
    ॥ ७६॥ तव स्मोऽत्र तव स्मोऽत्र त्वत्सेविकाः प्ररक्षय । अन्तरात्मन् व्यापकात्मन् भूमन्नत्र प्ररक्षय
    ॥ ७७॥ बालकाश्चापि वै कृष्णस्तवनं चक्रिरे तथा । श्रुत्वाऽहं सहसा तत्र शतरूपोऽभवं रमे ॥ ७८॥ अश्ववारा
    उष्ट्रवाराः सशस्त्रा भूभृतो भटाः । पञ्चाशद्वेगतो दूरादागता रक्षणाय वै ॥ ७९॥ उच्चैराक्रोशमादध्युः सज्जाश्चौरा
    भवन्त्विति । मारयिष्याम एवाऽत्र जायन्तां मातृपुत्रकाः ॥ ८०॥ एवं नादान् श्रावयन्तो स्फोटयन्तो हि धूष्कृतीः
    । उष्ट्राऽश्वाद्यैः क्षणाद्दिक्षु दशस्वावृत्तयँश्च तान् ॥ ८१॥ वर्तुले चौरलोकाँस्तानावृत्य राजपार्षदाः
    । धर्षयितुं दण्डयितुं ताडयितुं पुरोऽगमन् ॥ ८२॥ तावत्ते रोषमापन्ना जीवनाशां विहाय वै । दुद्रुवुर्मध्यदेशाच्च
    धूष्कृतीस्फोटकारिणः ॥ ८३॥ तदा मे पार्षदैर्लक्ष्मि धूष्कृतयः स्फोटिता द्रुतम् । युद्धं परस्परं जातं
    धूष्कृतीगोलिकामयम् ॥ ८४॥ मया ते गोलिकायन्त्रैर्विद्धाः सर्वेऽतिगर्विताः । मृतास्ते तत्र पञ्चाशत्सर्वे
    गोल्यभिभेदिताः ॥ ८५॥ तान् सर्वाननयं स्वर्गं मम हस्तैर्मृतानतः । मोचितान् भक्तवणिजस्ततोऽहं समसान्त्वयम्
    ॥ ८६॥ ते सर्वे शरणं प्राप्ता नरा नार्यश्च बालिकाः । बालाश्च पेतुश्चरणे मम सैन्यपरूपिणः ॥ ८७॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः
    द्वापरयुगसन्तानात्मकस्य तृतीयखण्डे १९१
