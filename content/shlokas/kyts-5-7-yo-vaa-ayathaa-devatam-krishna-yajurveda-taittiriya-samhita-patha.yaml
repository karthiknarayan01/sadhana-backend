id: kyts-5-7-yo-vaa-ayathaa-devatam-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 5.7 Yo Vaa Ayathaa Devatam - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mpancamakande saptamah prashnah upanuvakyavashishtakarmanirupanam
    o shri gurubhyo namah | harih om || yo va ayathadevatamagni bhyo vrishcyate papiya nbhavati yo yathadevata
    bhya a vrishcyate vasiya nbhavatyagneyya gayatriya prathama njagatya tritiyamanushtubha caturthi mpanktya
    pancamim bhya a vrishcyate vasiya nbhavatidayai va esha vibhaktih pashava ida pashubhirena ncinute
    yo vai prajapataye prati procyagni tyashvavabhitastishtheta shshveto dakshinastavalabhyeshtaka upa
    daddhyadetadvai prajapate rupa 'shvah sakshadeva prajapataye pratiprocyagni ''rtimarcchatyetadva ahno
    rupam 'shvo ratriyai krishna etadahno ya~dishtaka ratriyai purishamishtaka upadhasyanchveta tpurishamupadhasyan
    krishnamahoratrabhyamevaina ncinute hiranya patra ndadati madhavyo 'saniti saurya citravatya kshate
    citrameva bhavati maddhyandine 'shvamava ghrapayatyasau va aditya indra esha prajapatih prajapatyo
    'shvastameva sakshadriddhnoti || 'shtacatvarigmshacca m | asthuri no gar hapatyani santu tigmena no
    brahmana sagm shishadhi || pashavo va ete yadishtakashcitya ncityamrishabhamupa dadhati mithunamevasya
    ta dyajne karoti prajananaya tasma dyutheyutha rishabhah || sam va~thsarasya pratimam ntva ratryupasate
    | prajagm suvira nkritva vishvamayurvyashnavat || prajapatya nkriyate tadevaitayava rundha esha vai
    prajapateh kamadugha tayaiva yajamano nduhe yena deva jyotishordhva udayan yena ''ditya vasavo yena
    rudrah | yenangiraso mahimana manashustenaitu yajamana ssvasti || suvargaya va esha lokaya ciyate
    yadagniryena ciyate yadagniryena deva jyotishordhva udayannityukhyagm samindha ishtaka evaita upa
    dhatte vanaspatya ssuvargasya lokasya samashtyai shatayudhaya shatavi ryaya shatotaye 'bhimatishahe
    yo~ nah sharado ajitanindro neshadati duritani vishva || ye catvarah pathayo devayana antara dyavaprithivi
    viyanti | tesham || grishmo hemanta uta no vasanta ssuvitanno astu | teshamritunagm shata sharadana
    nnivata eshamabhaye syama || iduvathsaraya parivathsaraya sam thsaraya krinuta brihannamah | tesham
    va~yagm sumatau yajniyana ssyama || bhadranna ssamanaishta devastvaya 'vasena samashimahi tva | sa
    no mayo bhuh pito syonah || ajyanireta upa dadhatyeta vai devata aparajitasta eva pra vishati naiva
    jiyate brahmavadino vadanti yadardhamasa masa ritavah sam va~thsara oshadhih pacantyatha kasmadanyabhyo
    devata nnirupyata ityeta hi ta ddevata udajayan yadritubhyo nirvape nnirupyaita ahuti rjuhotyardhamasaneva
    masanritun mprinati na devata ssamanaishta deva ityaha hutadyaya yajamanasya 'si vartraghnastanupa
    nah pratispashah | yo nah purasta 'ghayurabhidasatyetagm so 'shmanamricchatu || devasura ndeva ishva
    ca vajrena capanudanta ya dvajrinirupadadhatishva caiva ta dvajrena ca yajamano bhratrivyanapa nudate
    dikshupa dadhati devapura evaitastanupanih paryuhate 'gnavishnu sajoshasema vardhantu vagimrah | dyumnairvajebhira
    gatam || brahmavadino vadanti yanna devatayai juhvatyatha ki ndevatya vasordharetyagni rvasustasyaisha
    dhara vishnu rvasustasyaisha dhara ''gnavaishnavyarca vasordhara njuhoti bhagadheyenaivainau samardhayatyatho
    eta nkaroti yatkama ena njuhoti tadevava rundhe rudro va esha yadagnistasyaite tanuvau ghora 'nya
    yacchatarudriya njuhoti yaivasya ghora tanusta njuhoti yaivasya shiva tanusta ntena prinati yo vai
    vasordharayai ve~da pratyeva tishthati yadajyamucchishyeta tasmi hmanashcatvarah pra 'shniyuresha
    va agnirvai hmana esha khalu va agneh priya tanurya shvanarah priyayamevaina mprati shthapayati catasro
    dhenurdadya ttabhireva yajamano njuhomi manasa ghritenetyahada ''hutirvaishvakarmani naina mbhratrivyo
    dabhnotyatho devata evava rundhe 'gne tamadyeti panktya juhoti panktya ''hutya yajnamukhama rabhate
    sapta te agne samidhah saptajihva ityaha hotra evava rundhe 'gnirdevebhyo micchamanastasma eta mprayacchannetadva
    agneragnihotrametar hi khalu va esha jato yar hi sarvashcito jatayaivasma annamapi dadhati sa ena
    mpritah prinati vasiya nbhavati brahmavadino vadanti yadesha gar ''havaniya ityasavaditya iti bruyadetasminhi
    sarva ncinute sakshadeva devata riddhnotyagne yashasvin yashase mamarpayendravati mapaciti miha mmurdha
    parameshthi suvarca ssamananamuttama shloko astu || bhadra mpashyanta upa seduragre tapo dikshamrishaya
    ssuvarvidah | tatah kshatra ntadasmai deva abhi sa nnamantu || dhata vidhata paramo kprajapatih parameshthi
    viraja shchandagmsi nivido ma ahuretasmai rashtramabhi sa nnamama || abhyavartaddhvamupa meta sakamayagm
    shasta 'dhipatirvo astu | asya vijnanamanu sagm rabhaddhvamima mpashcadanu jivatha sarve || rashtrabhrita
    eta upa dadhatyesha va agneshciti rashtrabhri ndadhati rashtrameva bhavati nasma yatha vai putro jato
    mriyata evam va~ esha mriyate yasyagnirukhya udvayati yannirmanthya dbhratrivyamasmai janaye thsa
    eva punah pariddhya rjanayati nasmai bhratrivya njanayati tamo va eta ngrihnati yasyagnirukhya udvayati
    mrityustamah krishnam va~sah krishna dhenurdakshina tamasai va tamo mrityumapa hate hiranya ndadati
    jyotirvai hiranya 'tho tejo vai hiranya ndhatte suvarna gharma ssvaha suvarna shukra ssvaha suvarna
    jyoti ssvaha suvarna surya ssvaha 'rko va esha yadagni 'shvamedho yadeta ahuti rjuhotyarka shvamedhayoreva
    jyotigmshi sa ndadhatyesha ha tva arkashvamedhi yasyaitadagnau kriyata apo va idamagre salilamasi
    mprajapatih prathama ttamupadhatta tadiyamabhava ''yaniti neha loko ttamupadhatta tadantarikshamabhava
    thsa yajnah prajapatimabravidupa tva ''yaniti neha loko ''yaniti kena mopaishyasiti dishyabhirityabravi
    tta upadhatta ta disho thsa parameshthi prajapatimabravidupa tva ''yaniti neha loko bravidupa vama
    'yaniti neha loko 'stityabrutagm sa eta ttamupadhatta tadasavabhava thsa adityah prajapati ''yaniti
    neha loko 'stityabrutagm sa parameshthinamabravidupa tva ''yaniti kena mopaishyasiti loka ttasmadayatayamni
    loka vadityastanrishayo 'bruvannupa va a 'yameti kena na upaishyatheti bhumnetyabruva ncinute bhuyaneva
    bhavatyabhiman ~lokanjayati vidurena ndeva atho etasameva devatanagm sayujya adityah prajapatimabravidupa
    tva vayo va agniryadagnici ttamevagnimadyada nnati pashurva esha yadagnir tpratyancamupacarati tasma
    tpramupacarya atmano 'si tejo me yaccha prithivim prithivyai ma pahi prithivyai ma pahi jyotirasi
    jyotirme yacchantariksham ya~cchantarikshanma pahi suvarasi suvarme yaccha divam ya~ccha divo ma pahityahaitabhirva
    ime loka vidhrita yadeta upadadha vi~dhrityai svayamatrinna upadhaya hiranyeshtaka upadadhatime vai
    loka ssvayamatrinna jyotirhiranyam thsvayamatrinna upadhaya hiranyeshtaka upadadhati hiranyeshtaka
    upadadhatima njyotishmatah kurute 'tho etabhirevasma ime lokah pra bha nti yaste agne surye ruca udyato
    divamatanvanti rashmibhih | tabhi ssarvabhi ruce janaya naskridhi || ya vo deva ssurye ruco goshvashveshu
    ya rucah | indra nno dhatta brihaspate || rucanno dhehi brahmaneshu rucagm brahmaneshu rucagm rajasu
    naskridhi | rucam vi~shyeshu shudreshu mayi dhehi ruca ruca m || dvedha va agni ncikyanasya yasha
    indriya va~ yadeta ahutirjuhotyatmanneva yasha indriya ndhatta ishvaro va esha artimartoryo ncinvannadhi
    kramati tattva yami brahmana vandamana iti varunyarca revaisha 'gnerguptiratmano havishkrito va esha
    yo ncinute yatha vai havi va~ esha skandati yo ncitva striyamupaiti maitravarunya ''mikshaya yajeta
    maitravarunata tyatmano 'skandaya yo va agnimritustham riturasmai kalpamana eti pratyeva tishthati
    sam va~thsaro va agnir grishmo dakshinah paksho varshah pucchagm sharaduttarah paksho hemanto maddhya
    mahoratranishtaka esha va agnir riturasmai kalpamana eti pratyeva tishthati prajapatirva eta njyaishthyakamo
    nyadhatta tato vai sa jyaishthyamagacchadya evam ncinute jyaishthyameva gacchati || thsvayamatrinna
    upadhaya thsamasusroddhrido va manaso va sambhrita ncakshusho va | tamanu prehi sukritasya lokam shayah
    prathamaja ye puranah || etagm sadhastha pari te dadami yamavaha njatavedah | anvaganta yajnapatirvo
    atra tagg sma janita parame vyomann || janitadena ssadhastha vida rupamasya | yadagaccha rishtapurte
    krinuta mpra yatagne patho devayana n krinuddhvam | asmin thsadhasthe addhyuttarasmin vishve deva
    yajamanashca sidata || prastarena paridhina sruca vedya ca barhisha nno vaha suvardeveshu gantave
    || yadishtam ssuvardeveshu no dadhat || yena sahasram gne sarvavedasam | tenemam nno vaha suvardeveshu
    gantave || yena gne dakshina yukta yajnam va~hantyritvijah | tenemam nno vaha suvardeveshu gantave
    || yena 'gne sukritah patha madhordhara nno vaha suvardeveshu gantave || yatra dhara anapeta madho
    rghritasya ca yah | tadagnirvai ssuvardeveshu no dadhat || dvayanashu stenemam nno vaha suvardeveshu
    gantave yaste agne samidho yani dhama ya jihva jatavedo yo arcih | ye te agne medayo ya indavastebhiratmana
    ncinuhi prajanann || uthsannayajno va esha yadagnih kim 'haitasya kriyate kim va~ na yadva addhvaryu
    ntaretyatmano vai tadantareti yaste agne samidho yani dhametyahaisha va agne ncitiragnireva tadagni
    ncinoti naddhvaryuratmano 'ntareti catasra ashah pracarantvagnaya ima nnayatu prajanann | ghrita mpinvannajaragm
    suvira dbhavatyahutinam || suvargaya va esha lokayopa dhiyate ya tkurmashcatasra ashah pra carantvagnaya
    ityaha disha evaitena pra janatima nnayatu prajanannityaha suvargasya lokasyabhini mityaha brahmana
    vai deva dbrahmanvatyopadadhati brahmanaiva ta lo~kameti prajapatirva esha yadagnistasya prajah pashava
    shchandagmsi rupagm sarvan varnanishtakana mpashun chandagsyava rundhe bhyo 'varuddhya cinute || mayi
    grihnamyagre agnigm rayasposhaya suprajastvaya suviryaya | mayi praja mmayi varco dadhamyarishta ssyama
    tanuva suvirah || yo no agnih pitaro hrithsvantaramartyo martyagm avivesha | tamatma npari grihnimahe
    vaya mma so asmagm avahaya para gat || yadaddhvaryuratmannagnima yajamanaya cinuyadagni tpashavah
    syurmayi grihnamyagre agnimityaha ''tmanneva svamagni 'pa kramanti brahmavadino vadanti yanmricca
    nmrida cadbhishca 'gnishciyata iti yadadbhi tyapo vai sarva devata devatabhirevainagm sagm srijati
    yanmrida cinotiyam ncinoti brahmavadino vadanti yanmrida cadbhishcagnishciyate 'tha kasmadagnirucyata
    iti yacchandobhi shcinotyagnayo vai chandagmsi tasmadagnirucyate nmrida cinoti tasmadagnirucyate hiranyeshtaka
    upa dadhati jyotirvai hiranya ndadhatyatho tejo vai hiranya ndhatte yo va agnigm sarvatomukha ncinute
    sarvasu prajasvannamatti sarva disho mpurastadupa dadhati trishtubha mpashcadanushtubhamuttaratah
    pankti mmaddhya esha va agni shcinute sarvasu prajasvannamatti sarva disho 'bhi jayatyatho dishyeva
    disha ''vartata tasmai vrishni 'vartata tasma rishabha 'vartata tasmai basta tpashushirshanyupadadhati
    sarvata evaina mavaruddhya cinuta eta vai pranabhrita shcakshushmatirishtaka ya tpashushirshanyupadadhati
    tabhireva yajamano 'mushmi~lloke pranityatho tabhirevasma ime lokah pra bha 'bhilipyopa dadhati meddhyatvaya
    pashurva esha yadagniranna mpashava e sha khalu va agnirya ntasya pashushirshanyupa daddhya tkaniya
    evasyanna nkamayeta samavadasyannagg syaditi maddhyatastasyopa daddhya 'nnagg syadityanteshu tasya
    vyuduhyopa daddhyadantata evasma annamava rundhe bhuyo mmandukan jambhyebhiradakam khadenorjagm sagm
    sudena shsharkarabhiravakamavakabhi shsharkaramuthsadena jihvamavakrandena talugm sarasvati madharenoshthena
    saduttarenantarena mprakashena bahyagg stanayitnu nnirbadhena suryagni cakshurbhyam vi~dyutau kananakabhyamashani
    nchaphairacchalabhih kapinjalan thsama kushthikabhirjava bhyamaditigm shir ngriddhrabhiryugamanatena
    citta npranaih prakashena tvaca mmashakan keshairindragg svapasa vahena brihaspatigm shakunisadena
    rathamushnihabhih || mitravarunau shroni bhyamindragni shikhandabhya mindrabrihaspati urubhyamindravishnu
    ashthivadbhyagm savitara mpucchena gandharvanchepena phsaraso mushkabhya indrasya krodo 'dityai pajasya
    mpuritata nabha udaryenendrani mplihna valmika nplashibhih samudramudarena vaishvanara pushno vanishthurandhahe
    ssthuraguda sarpa mprathama kikasa rudrana ndvitiya ''dityana ncaturthi saddhyana ndevanagm shashthi
    || ritimasthabhirindragg svapasa vahena rudrasya vicala sskandho 'horatrayo va~thsarasya shashthah
    || mbhayagm shitimabhya mprashasabhyagm suryacandramasau vrikya shyamashabalau matasnabhyam vyu~shtigm
    rupena nimruktimarupena || aharmagmsena ratri 'po yushena ghritagm rasena shyam ndivagm rupena nakshatrani
    pratirupena prithivi nchavyo pakritaya svaha ''labdhaya svaha hutaya svaha ssarasvatyai nipakshati
    va~thsarasya shashthi marutagm saptami brihaspaterashtami mitrasya navami varunasya dashamindrasyaikadashi
    vishvesha ndvadashi dyavaprithivyoh par rekanna trigmshat ssarasvato nipakshati stritiya nakshatrana
    ncaturthi savituh pancami rudrasya shashthi sarpanagm saptamyaryamno 'shtami tvashturnavami dhaturdashamindranya
    ekadashyadityai dvadashi dyavaprithivyoh par panthamanuvrigbhyagm santatigg npittena harimanam npapavatena
    kushmanchakabhi shshavartanuvaddhyena shuno vishasanena sarpan ~lohitagandhena vayagmsi pakvagandhena
    pipilikah prashadena || vi~danah | sa no naya sukritasya loka mprithivi sadhasthamatmantarikshagm
    samudro yoni ssuryaste cakshurvatah pranashcandrama shcardhamasashca parva ttenayajanta sa etam shyasyathava
    jighra vayuh pashurasi ttenayajanta sa etam shyami yadi navajighrasyadityah pashurasi ttenayajanta
    sa etam shyasi yadyavajighrasi || || harih om || || krishna yajurvediya taittiriya samhitaya mpancamakande
    saptamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्पञ्चमकाण्डे सप्तमः प्रश्नः उपानुवाक्यावशिष्टकर्मनिरूपणं
    ओ श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ यो वा अय॑थादेवतम॒ग्नि भ्यो वृश्च्यते॒ पापी॑या न्भवति॒ यो य॑थादेव॒त
    भ्य॒ आ वृ॑श्च्यते॒ वसी॑या न्भवत्याग्ने॒य्या गा॑यत्रि॒या प्र॑थ॒मा ञ्जग॑त्या तृ॒तीया॑मनु॒ष्टुभा॑ चतु॒र्थी
    म्प॒ङ्क्त्या प॑ञ्च॒मीं भ्य॒ आ वृ॑श्च्यते॒ वसी॑या न्भव॒तीडा॑यै॒ वा ए॒षा विभ॑क्तिः प॒शव॒ इडा॑ प॒शुभि॑रेन
    ञ्चिनुते॒ यो वै प्र॒जाप॑तये प्रति॒ प्रोच्या॒ग्नि त्यश्वा॑व॒भित॑स्तिष्ठेता श्श्वे॒तो दक्षि॑ण॒स्तावा॒लभ्येष्ट॑का॒
    उप॑ दद्ध्यादे॒तद्वै प्र॒जाप॑ते रू॒प ऽश्वः॑ सा॒क्षादे॒व प्र॒जाप॑तये प्रति॒प्रोच्या॒ग्नि ऽऽर्ति॒मार्च्छ॑त्ये॒तद्वा
    अह्नो॑ रू॒पं ऽश्वो॒ रात्रि॑यै कृ॒ष्ण ए॒तदह्नो॑ यँदिष्ट॑का॒ रात्रि॑यै॒ पुरी॑ष॒मिष्ट॑का उपधा॒स्यञ्छ्वे॒त
    त्पुरी॑षमुपधा॒स्यन् कृ॒ष्णम॑होरा॒त्राभ्या॑मे॒वैन॑ ञ्चिनुते हिरण्य पा॒त्र न्द॑दाति मध॒व्यो॑ ऽसा॒नीति॑
    सौ॒र्या चि॒त्रव॒त्या क्षते चि॒त्रमे॒व भ॑वति म॒द्ध्यन्दि॒ने ऽश्व॒मव॑ घ्रापयत्य॒सौ वा आ॑दि॒त्य इन्द्र॑
    ए॒ष प्र॒जाप॑तिः प्राजाप॒त्यो ऽश्व॒स्तमे॒व सा॒क्षादृ॑द्ध्नोति ॥ ऽष्टाच॑त्वारिग्ंशच्च म् । अ॒स्थू॒रि
    णो॒ गार् ह॑पत्यानि सन्तु ति॒ग्मेन॑ नो॒ ब्रह्म॑णा॒ सग्ं शि॑शाधि ॥ प॒शवो॒ वा ए॒ते यदिष्ट॑का॒श्चित्या
    ञ्चित्यामृष॒भमुप॑ दधाति मिथु॒नमे॒वास्य॒ त द्य॒ज्ञे क॑रोति प्र॒जन॑नाय॒ तस्मा द्यू॒थेयू॑थ ऋष॒भः ॥ सं॒
    वँ॒थ्स॒रस्य॑ प्रति॒मां न्त्वा॑ रात्र्यु॒पास॑ते । प्र॒जाग्ं सु॒वीरा ङ्कृ॒त्वा विश्व॒मायु॒र्व्य॑श्ञवत्
    ॥ प्रा॒जा॒प॒त्या ङ्क्रि॒यते॒ तदे॒वैतयाव॑ रुन्ध ए॒षा वै प्र॒जाप॑तेः काम॒दुघा॒ तयै॒व यज॑मानो॒ न्दु॑हे॒
    येन॑ दे॒वा ज्योति॑षो॒र्ध्वा उ॒दाय॒न्॒ येना॑ ऽऽदि॒त्या वस॑वो॒ येन॑ रु॒द्राः । येनाङ्गि॑रसो महि॒मान॑
    मान॒शुस्तेनै॑तु॒ यज॑मान स्स्व॒स्ति ॥ सु॒व॒र्गाय॒ वा ए॒ष लो॒काय॑ ची॒य॒ते॒ यद॒ग्निर्येन॑ चीयते॒ यद॒ग्निर्येन॑
    दे॒वा ज्योति॑षो॒र्ध्वा उ॒दाय॒न्नित्युख्य॒ग्ं॒ समि॑न्ध॒ इष्ट॑का ए॒वैता उप॑ धत्ते वानस्प॒त्या स्सु॑व॒र्गस्य॑
    लो॒कस्य॒ सम॑ष्ट्यै श॒तायु॑धाय श॒तवी र्याय श॒तोत॑ये ऽभिमाति॒षाहे योँ नः॑ श॒रदो॒ अजी॑ता॒निन्द्रो॑ नेष॒दति॑
