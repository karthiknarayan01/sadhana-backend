id: hanuman-chalisa-in-telugu-m-s-ramarao
category: stotram
name:
  english: Hanuman Chalisa in Telugu (M.S. Ramarao)
content:
  english: apadamapahartaram dataram sarvasampadam | lokabhiramam shriramam bhuyo bhuyo namamyaham ||
    hanumananjanasunuh vayuputro mahabalah rameshtah phalgunasakhah pingaksho amitavikramah | udadhikramanashcaiva
    sitashokavinashakah lakshmanapranadata ca dashagrivasyadarpaha | dvadashaitani namani kapindrasya
    mahatmanah svapakale pathennityam yatrakale visheshatah tasya mrityubhayam nasti sarvatra vijayibhavet
    || calisa shri hanumanu gurudevu caranamulu ihapara sadhaka sharanamulu | buddhihinatanu kaligina
    tanuvulu budbudamulani tèlupu satyamulu || jaya hanumanta jnanagunavandita jaya pandita trilokapujita
    ramaduta atulita baladhama anjaniputra pavanasutanama udayabhanuni madhura phalamani bhavana lila
    amritamunu grolina kancanavarna virajita vesha kundalamandita kuncita kesha || | shri hanumanu gurudevu
    caranamulu ihapara sadhaka sharanamulu | rama sugrivula maitrini gòlipi rajapadavi sugrivuna nilipi
    janakipati mudrika dodkòni jaladhi langhinci lanka jerukòni sukshma rupamuna sitanu juci vikata rupamuna
    lankanu galci bhima rupamuna asurula jampina rama karyamunu saphalamu jesina || shri hanumanu gurudevu
    caranamulu ihapara sadhaka sharanamulu || sita jadagani vaccina ninu gani shri raghuvirudu kaugita
    ninugòni sahasra ritula ninu gòniyadaga kagala karyamu nipai nidaga vanarasenato varidhi dati lankeshunito
    talapadi pori horuhoruna poru sagina asurasenala varusana gulcina | shri hanumanu gurudevu caranamulu
    ihapara sadhaka sharanamulu | lakshmana murchato ramudadalaga sanjivi dèccina pranapradata rama lakshmanula
    astradhatiki asuravirulu astaminciri tiruguleni shri ramabanamu jaripincènu ravana samharamu èdirileni
    a lankapuramuna elikaga vibhishanu jesina | shri hanumanu gurudevu caranamulu ihapara sadhaka sharanamulu
    | sitaramulu nagavula ganiri mullokala haratulandiri antuleni anandashruvule ayodhyapuri pòngipòralè
    sitaramula sundara mandiram shrikantupadam ni hridayam ramacarita karnamritagana ramanama rasamritapana
    | shri hanumanu gurudevu caranamulu ihapara sadhaka sharanamulu | durgamamagu e karyamaina sugamame
    yagu ni kripa jalina kalugu sukhamulu ninu sharananna tòlagu bhayamulu ni rakshana yunna rama dvarapu
    kaparivaina ni kattadi mira brahmadula tarama bhuta pishaca shakini dhakini bhayapadi paru ni nama
    japamu vini | shri hanumanu gurudevu caranamulu ihapara sadhaka sharanamulu | dhvajaviraja vajrasharira
    bhujabalateja gadadhara ishvaramsha sambhuta pavitra kesariputra pavanagatra sanakadulu brahmadi devatalu
    sharada narada adisheshulu yama kubera dikpaluru kavulu pulakitulairi ni kirti ganamula | shri hanumanu
    gurudevu caranamulu ihapara sadhaka sharanamulu | sodara bharata samana yani shri ramudu ènnika gònna
    hanuma sadhula palita indrudavanna asurula palita kaludavanna ashtasiddhi navanidhulaku dataga janakimata
    divincènuga rama rasamrita panamu jesina mrityunjayudavai vèlasina | shri hanumanu gurudevu caranamulu
    ihapara sadhaka sharanamulu | ni nama bhajana shrirama ranjana janma janmantara duhkhabhanjana èccatundina
    raghuvaradasu civaraku ramuni ceruta tèlusu itara cintanalu manasuna motalu sthiramuga maruti sevalu
    sukhamulu èndènduna shrirama kirtana andanduna hanumanu nartana | shri hanumanu gurudevu caranamulu
    ihapara sadhaka sharanamulu | shraddhaga dinini alakimpuma shubhamagu phalamulu kalugu suma bhakti
    miraga ganamu ceyaga mukti kalugu gaurishulu sakshiga tulasidasa hanumanu calisa tèluguna suluvuga
    naluguru padaga palikina sitaramuni palukuna doshamulunna mannimpumanna | shri hanumanu gurudevu caranamulu
    ihapara sadhaka sharanamulu | mangala harati gònu hanumanta sitaramalakshmana sameta | na antaratma
    nilumo ananta nive anta shri hanumanta || om shantih shantih shantih |
  devanagari: आपदामपहर्तारं दातारं सर्वसम्पदाम् । लोकाभिरामं श्रीरामं भूयो भूयो नमाम्यहम् ॥ हनुमानञ्जनासूनुः
    वायुपुत्रो महाबलः रामेष्टः फल्गुणसखः पिङ्गाक्षो अमितविक्रमः । उदधिक्रमणश्चैव सीताशोकविनाशकः लक्ष्मणप्राणदाता
    च दशग्रीवस्यदर्पहा । द्वादशैतानि नामानि कपीन्द्रस्य महात्मनः स्वापकाले पठेन्नित्यं यात्राकाले विशेषतः
    तस्य मृत्युभयं नास्ति सर्वत्र विजयीभवेत् ॥ चालीसा श्री हनुमानु गुरुदेवु चरणमुलु इहपर साधक शरणमुलु
    । बुद्धिहीनतनु कलिगिन तनुवुलु बुद्बुदमुलनि तॆलुपु सत्यमुलु ॥ जय हनुमन्त ज्ञानगुणवन्दित जय पण्डित त्रिलोकपूजित
    रामदूत अतुलित बलधाम अञ्जनीपुत्र पवनसुतनाम उदयभानुनि मधुर फलमनि भावन लील अमृतमुनु ग्रोलिन काञ्चनवर्ण
    विराजित वेष कुण्डलमण्डित कुञ्चित केश ॥ । श्री हनुमानु गुरुदेवु चरणमुलु इहपर साधक शरणमुलु । राम सुग्रीवुल
    मैत्रिनि गॊलिपि राजपदवि सुग्रीवुन निलिपि जानकीपति मुद्रिक दोड्कॊनि जलधि लङ्घिञ्चि लङ्क जेरुकॊनि सूक्ष्म
    रूपमुन सीतनु जूचि विकट रूपमुन लङ्कनु गाल्चि भीम रूपमुन असुरुल जम्पिन राम कार्यमुनु सफलमु जेसिन ॥ श्री
    हनुमानु गुरुदेवु चरणमुलु इहपर साधक शरणमुलु ॥ सीत जाडगनि वच्चिन निनु गनि श्री रघुवीरुडु कौगिट निनुगॊनि
    सहस्र रीतुल निनु गॊनियाडग कागल कार्यमु नीपै निडग वानरसेनतो वारिधि दाटि लङ्केशुनितो तलपडि पोरि होरुहोरुन
    पोरु सागिन असुरसेनल वरुसन गूल्चिन । श्री हनुमानु गुरुदेवु चरणमुलु इहपर साधक शरणमुलु । लक्ष्मण मूर्छतो
    रामुडडलग सञ्जीवि दॆच्चिन प्राणप्रदात राम लक्ष्मणुल अस्त्रधाटिकि असुरवीरुलु अस्तमिञ्चिरि तिरुगुलेनि
    श्री रामबाणमु जरिपिञ्चॆनु रावण संहारमु ऎदिरिलेनि आ लङ्कापुरमुन एलिकगा विभीषणु जेसिन । श्री हनुमानु
    गुरुदेवु चरणमुलु इहपर साधक शरणमुलु । सीतारामुलु नगवुल गनिरि मुल्लोकाल हारतुलन्दिरि अन्तुलेनि आनन्दाश्रुवुले
    अयोध्यापुरि पॊङ्गिपॊरलॆ सीतारामुल सुन्दर मन्दिरं श्रीकान्तुपदं नी हृदयं रामचरित कर्णामृतगान रामनाम
    रसामृतपान । श्री हनुमानु गुरुदेवु चरणमुलु इहपर साधक शरणमुलु । दुर्गममगु ए कार्यमैना सुगममे यगु नी
    कृप जालिन कलुगु सुखमुलु निनु शरणन्न तॊलगु भयमुलु नी रक्षण युन्न राम द्वारपु कापरिवैन नी कट्टडि मीर
    ब्रह्मादुल तरमा भूत पिशाच शाकिनि ढाकिनि भयपडि पारु नी नाम जपमु विनि । श्री हनुमानु गुरुदेवु चरणमुलु
    इहपर साधक शरणमुलु । ध्वजाविराजा वज्रशरीरा भुजबलतेजा गदाधरा ईश्वरांश सम्भूत पवित्रा केसरीपुत्र पावनगात्रा
    सनकादुलु ब्रह्मादि देवतलु शारद नारद आदिशेषुलु यम कुबेर दिक्पालुरु कवुलु पुलकितुलैरि नी कीर्ति गानमुल
    । श्री हनुमानु गुरुदेवु चरणमुलु इहपर साधक शरणमुलु । सोदर भरत समाना यनि श्री रामुडु ऎन्निक गॊन्न हनुमा
    साधुल पालिट इन्द्रुडवन्ना असुरुल पालिट कालुडवन्ना अष्टसिद्धि नवनिधुलकु दातग जानकीमात दीविञ्चॆनुगा
    राम रसामृत पानमु जेसिन मृत्युञ्जयुडवै वॆलसिन । श्री हनुमानु गुरुदेवु चरणमुलु इहपर साधक शरणमुलु । नी
    नाम भजन श्रीराम रञ्जन जन्म जन्मान्तर दुःखभञ्जन ऎच्चटुण्डिना रघुवरदासु चिवरकु रामुनि चेरुट तॆलुसु इतर
    चिन्तनलु मनसुन मोतलु स्थिरमुग मारुति सेवलु सुखमुलु ऎन्दॆन्दुन श्रीराम कीर्तन अन्दन्दुन हनुमानु नर्तन
    । श्री हनुमानु गुरुदेवु चरणमुलु इहपर साधक शरणमुलु । श्रद्धग दीनिनि आलकिम्पुमा शुभमगु फलमुलु कलुगु
    सुमा भक्ति मीरगा गानमु चेयग मुक्ति कलुगु गौरीशुलु साक्षिग तुलसिदास हनुमानु चालिसा तॆलुगुन सुलुवुग
    नलुगुरु पाडग पलिकिन सीतारामुनि पलुकुन दोषमुलुन्न मन्निम्पुमन्न । श्री हनुमानु गुरुदेवु चरणमुलु इहपर
    साधक शरणमुलु । मङ्गल हारति गॊनु हनुमन्ता सीतारामलक्ष्मण समेत । ना अन्तरात्म निलुमो अनन्ता नीवे अन्ता
    श्री हनुमन्ता ॥ ॐ शान्तिः शान्तिः शान्तिः ।
