id: dakshina-murthy-stotram
category: stotram
name:
  english: Dakshina Murthy Stotram
content:
  english: shantipathah om yo brahmanam vidadhati purvam yo vai vedamshca prahinoti tasmai | tam ha devamatmabuddhiprakasham
    mumukshurvai sharanamaham prapadye || dhyanam om maunavyakhya prakatita parabrahmatattvam yuvanam
    varshishthante vasadrishiganairavritam brahmanishthaih | acaryendram karakalita cinmudramanandamurtim
    svatmaramam muditavadanam dakshinamurtimide || || vatavitapisamipebhumibhage nishannam sakalamunijananam
    jnanadataramarat | tribhuvanagurumisham dakshinamurtidevam jananamaranaduhkhacchedadaksham namami
    || || citram vatatarormule vriddhah shishya gururyuva | gurostu maunam vyakhyanam shishyastucchinnasamshayah
    || || nidhaye sarvavidyanam bhishaje bhavaroginam | gurave sarvalokanam dakshinamurtaye namah || ||
    om namah pranavarthaya shuddhajnanaikamurtaye | nirmalaya prashantaya dakshinamurtaye namah || ||
    cidghanaya maheshaya vatamulanivasine | saccidanandarupaya dakshinamurtaye namah || || ishvaro gururatmeti
    murtibhedavibhagine | vyomavadvyaptadehaya dakshinamurtaye namah || || angushthatarjani yogamudra
    vyajenayoginam | shrutyartham brahmajivaikyam darshayanyogata shivah || || om shantih shantih shantih
    || stotram vishvam darpana nagari tulyam nijantargatam pashyannatmani mayaya bahirivodbhutam yatha
    nidraya | ya ssakshatkurute prabodhasamaye svatmaname vadvayam tasmai shrigurumurtaye nama idam shri
    dakshinamurtaye || vankuro jagadidam prannirvikalpam punah mayakalpita deshakalakalana vaicitryacitrikritam
    | mayaviva vijrimbhayatyapi mahayogiva yah svecchaya tasmai shrigurumurtaye nama idam shri dakshinamurtaye
    || || yasyaiva sphuranam sadatmakamasatkalparthakam bhasate sakshattattvamasiti vedavacasa yo bodhayatyashritan
    | yatsakshatkaranadbhavenna punaravrittirbhavambhonidhau tasmai shrigurumurtaye nama idam shri dakshinamurtaye
    || || nanacchidra ghatodara sthita mahadipa prabhabhasvaram jnanam yasya tu cakshuradikarana dvara
    bahih spandate | janamiti tameva bhantamanubhatyetatsamastam jagat tasmai shri gurumurtaye nama idam
    shri dakshinamurtaye || || deham pranamapindriyanyapi calam buddhim ca shunyam viduh stri balandha
    jadopamastvahamiti bhrantabhrisham vadinah | mayashakti vilasakalpita mahavyamoha samharine tasmai
    shri gurumurtaye nama idam shri dakshinamurtaye || || rahugrasta divakarendu sadrisho maya samacchadanat
    sanmatrah karanopasamharanato yo'bhutsushuptah puman | pragasvapsamiti prabodhasamaye yah pratyabhijnayate
    tasmai shri gurumurtaye nama idam shri dakshinamurtaye || || balyadishvapi jagradadishu tatha sarvasvavasthasvapi
    vyavritta mahamityantah sphurantam sada | svatmanam prakatikaroti bhajatam yo mudraya bhadraya tasmai
    shri gurumurtaye nama idam shri dakshinamurtaye || || vishvam pashyati karyakaranataya svasvamisambandhatah
    shishyacaryataya tathaiva pitri putradyatmana bhedatah | svapne jagrati va ya esha purusho maya paribhramitah
    tasmai shri gurumurtaye nama idam shri dakshinamurtaye || || bhurambhamsyanalo'nilo'mbara maharnatho
    himamshuh puman ityabhati caracaratmakamidam yasyaiva murtyashtakam | nanyatkincana vidyate vimrishatam
    yasmatparasmadvibhoh tasmai shri gurumurtaye nama idam shri dakshinamurtaye || || sarvatmatvamiti
    sphutikritamidam yasmadamushmin stave tenasya shravanattadartha mananaddhyanacca sankirtanat | sarvatmatva
    mahavibhutisahitam syadishvaratvam svatah siddhyettatpunarashtadha parinatam caishvarya || || iti
    shrimacchankaracaryaviracitam dakshinamurtistotram sampurnam ||
  devanagari: शान्तिपाठः ॐ यो ब्रह्माणं विदधाति पूर्वं यो वै वेदांश्च प्रहिणोति तस्मै । तं ह देवमात्मबुद्धिप्रकाशं
    मुमुक्षुर्वै शरणमहं प्रपद्ये ॥ ध्यानम् ॐ मौनव्याख्या प्रकटित परब्रह्मतत्त्वं युवानं वर्षिष्ठान्ते
    वसदृषिगणैरावृतं ब्रह्मनिष्ठैः । आचार्येन्द्रं करकलित चिन्मुद्रमानन्दमूर्तिं स्वात्मारामं मुदितवदनं
    दक्षिणामूर्तिमीडे ॥ ॥ वटविटपिसमीपेभूमिभागे निषण्णं सकलमुनिजनानां ज्ञानदातारमारात् । त्रिभुवनगुरुमीशं
    दक्षिणामूर्तिदेवं जननमरणदुःखच्छेददक्षं नमामि ॥ ॥ चित्रं वटतरोर्मूले वृद्धाः शिष्या गुरुर्युवा । गुरोस्तु
    मौनं व्याख्यानं शिष्यास्तुच्छिन्नसंशयाः ॥ ॥ निधये सर्वविद्यानां भिषजे भवरोगिणाम् । गुरवे सर्वलोकानां
    दक्षिणामूर्तये नमः ॥ ॥ ॐ नमः प्रणवार्थाय शुद्धज्ञानैकमूर्तये । निर्मलाय प्रशान्ताय दक्षिणामूर्तये
    नमः ॥ ॥ चिद्घनाय महेशाय वटमूलनिवासिने । सच्चिदानन्दरूपाय दक्षिणामूर्तये नमः ॥ ॥ ईश्वरो गुरुरात्मेति
    मूर्तिभेदविभागिने । व्योमवद्व्याप्तदेहाय दक्षिणामूर्तये नमः ॥ ॥ अङ्गुष्ठतर्जनी योगमुद्रा व्याजेनयोगिनाम्
    । श्रुत्यर्थं ब्रह्मजीवैक्यं दर्शयन्योगता शिवः ॥ ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ स्तोत्रम् विश्वं दर्पण
    नगरी तुल्यं निजान्तर्गतं पश्यन्नात्मनि मायया बहिरिवोद्भूतं यथा निद्रया । य स्साक्षात्कुरुते प्रबोधसमये
    स्वात्मानमे वाद्वयं तस्मै श्रीगुरुमूर्तये नम इदं श्री दक्षिणामूर्तये ॥ वाङ्कुरो जगदिदं प्राङ्निर्विकल्पं
    पुनः मायाकल्पित देशकालकलना वैचित्र्यचित्रीकृतम् । मायावीव विजृम्भयत्यपि महायोगीव यः स्वेच्छया तस्मै
    श्रीगुरुमूर्तये नम इदं श्री दक्षिणामूर्तये ॥ ॥ यस्यैव स्फुरणं सदात्मकमसत्कल्पार्थकं भासते साक्षात्तत्त्वमसीति
    वेदवचसा यो बोधयत्याश्रितान् । यत्साक्षात्करणाद्भवेन्न पुनरावृत्तिर्भवाम्भोनिधौ तस्मै श्रीगुरुमूर्तये
    नम इदं श्री दक्षिणामूर्तये ॥ ॥ नानाच्छिद्र घटोदर स्थित महादीप प्रभाभास्वरं ज्ञानं यस्य तु चक्षुरादिकरण
    द्वारा बहिः स्पन्दते । जानामीति तमेव भान्तमनुभात्येतत्समस्तं जगत् तस्मै श्री गुरुमूर्तये नम इदं श्री
    दक्षिणामूर्तये ॥ ॥ देहं प्राणमपीन्द्रियाण्यपि चलां बुद्धिं च शून्यं विदुः स्त्री बालान्ध जडोपमास्त्वहमिति
    भ्रान्ताभृशं वादिनः । मायाशक्ति विलासकल्पित महाव्यामोह संहारिणे तस्मै श्री गुरुमूर्तये नम इदं श्री
    दक्षिणामूर्तये ॥ ॥ राहुग्रस्त दिवाकरेन्दु सदृशो माया समाच्छादनात् सन्मात्रः करणोपसंहरणतो योऽभूत्सुषुप्तः
    पुमान् । प्रागस्वाप्समिति प्रबोधसमये यः प्रत्यभिज्ञायते तस्मै श्री गुरुमूर्तये नम इदं श्री दक्षिणामूर्तये
    ॥ ॥ बाल्यादिष्वपि जाग्रदादिषु तथा सर्वास्ववस्थास्वपि व्यावृत्ता महमित्यन्तः स्फुरन्तं सदा । स्वात्मानं
    प्रकटीकरोति भजतां यो मुद्रया भद्रया तस्मै श्री गुरुमूर्तये नम इदं श्री दक्षिणामूर्तये ॥ ॥ विश्वं पश्यति
    कार्यकारणतया स्वस्वामिसम्बन्धतः शिष्याचार्यतया तथैव पितृ पुत्राद्यात्मना भेदतः । स्वप्ने जाग्रति वा
    य एष पुरुषो माया परिभ्रामितः तस्मै श्री गुरुमूर्तये नम इदं श्री दक्षिणामूर्तये ॥ ॥ भूरम्भांस्यनलोऽनिलोऽम्बर
    महर्नाथो हिमांशुः पुमान् इत्याभाति चराचरात्मकमिदं यस्यैव मूर्त्यष्टकम् । नान्यत्किञ्चन विद्यते विमृशतां
    यस्मात्परस्माद्विभोः तस्मै श्री गुरुमूर्तये नम इदं श्री दक्षिणामूर्तये ॥ ॥ सर्वात्मत्वमिति स्फुटीकृतमिदं
    यस्मादमुष्मिन् स्तवे तेनास्य श्रवणात्तदर्थ मननाद्ध्यानाच्च सङ्कीर्तनात् । सर्वात्मत्व महाविभूतिसहितं
    स्यादीश्वरत्वं स्वतः सिद्ध्येत्तत्पुनरष्टधा परिणतं चैश्वर्य ॥ ॥ इति श्रीमच्छङ्कराचार्यविरचितं दक्षिणामूर्तिस्तोत्रं
    सम्पूर्णम् ॥
