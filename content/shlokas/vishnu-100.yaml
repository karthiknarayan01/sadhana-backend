id: vishnu-100
category: stotram
name:
  english: vishnu 100
  devanagari: विष्नु १००
content:
  english: shrivishnoh shatanamastotram shri ganeshaya namah | narada uvaca | om vasudevam hrishikesham
    vamanam jalashayinam | janardanam hari krishnam shrivaksham garudadhvajam || 1|| varaham pundarikaksham
    nrisimham narakantakam | avyaktam shashvatam vishnumanantamajamavyayam || 2|| narayanam gadadhyaksham
    govindam kirtibhajanam | govardhanoddharam devam bhudharam bhuvaneshvaram || 3|| vettaram yajnapurusham
    yajnesham yajnavahakam | cakrapanim gadapanim shankhapanim narottamam || 4|| vaikuntham dushtadamanam
    bhugarbham pitavasasam | trivikramam trikalajnam trimurtim nandikeshvaram || 5|| ramam ramam hayagrivam
    bhimam raudram bhavodbhavam | shripatim shridharam shrisham mangalam mangalayudham || 6|| damodaram
    damopetam keshavam keshisudanam | varenyam varadam vishnumanandam vasudevajam || 7|| hiranyaretasam
    diptam puranam purushottamam | sakalam nishkalam shuddham nirgunam gunashashvatam || 8|| hiranyatanusankasham
    suryayutasamaprabham | meghashyamam caturbahum kushalam kamalekshanam || 9|| jyotirupamarupam ca svarupam
    rupasamsthitam | sarvajnam sarvarupastham sarvesham sarvatomukham || 10|| jnanam kutasthamacalam jnanadam
    paramam prabhum | yogisham yoganishnatam yoginam yogarupinam || 11|| ishvaram sarvabhutanam vande
    bhutamayam prabhum | iti namashatam divyam vaishnavam khalu papaham || 12|| vyasena kathitam purvam
    sarvapapapranashanam | yah pathetpratarutthaya sa bhavedvaishnavo narah || 13|| sarvapapavishuddhatma
    vishnusayujyamapnuyat | candrayanasahasrani kanyadanashatani ca || 14|| gavam lakshasahasrani muktibhagi
    bhavennarah | ashvamedhayutam punyam phalam prapnoti manavah || 15|| | iti shrivishnupurane vishnushatanamastotram
    sampurnam |
  devanagari: श्रीविष्णोः शतनामस्तोत्रम् श्री गणेशाय नमः । नारद उवाच । ॐ वासुदेवं हृषीकेशं वामनं जलशायिनम्
    । जनार्दनं हरि कृष्णं श्रीवक्षं गरुडध्वजम् ॥ १॥ वाराहं पुण्डरीकाक्षं नृसिंहं नरकान्तकम् । अव्यक्तं
    शाश्वतं विष्णुमनन्तमजमव्ययम् ॥ २॥ नारायणं गदाध्यक्षं गोविन्दं कीर्तिभाजनम् । गोवर्धनोद्धरं देवं भूधरं
    भुवनेश्वरम् ॥ ३॥ वेत्तारं यज्ञपुरुषं यज्ञेशं यज्ञवाहकम् । चक्रपाणिं गदापाणिं शङ्खपाणिं नरोत्तमम् ॥
    ४॥ वैकुण्ठं दुष्टदमनं भूगर्भं पीतवाससम् । त्रिविक्रमं त्रिकालज्ञं त्रिमूर्तिं नन्दिकेश्वरम् ॥ ५॥ रामं
    रामं हयग्रीवं भीमं रौद्रं भवोद्भवम् । श्रीपतिं श्रीधरं श्रीशं मङ्गलं मङ्गलायुधम् ॥ ६॥ दामोदरं दमोपेतं
    केशवं केशिसूदनम् । वरेण्यं वरदं विष्णुमानन्दं वसुदेवजम् ॥ ७॥ हिरण्यरेतसं दीप्तं पुराणं पुरुषोत्तमम्
    । सकलं निष्कलं शुद्धं निर्गुणं गुणशाश्वतम् ॥ ८॥ हिरण्यतनुसङ्काशं सूर्यायुतसमप्रभम् । मेघश्यामं चतुर्बाहुं
    कुशलं कमलेक्षणम् ॥ ९॥ ज्योतीरूपमरूपं च स्वरूपं रूपसंस्थितम् । सर्वज्ञं सर्वरूपस्थं सर्वेशं सर्वतोमुखम्
    ॥ १०॥ ज्ञानं कूटस्थमचलं ज्ञानदं परमं प्रभुम् । योगीशं योगनिष्णातं योगिनं योगरूपिणम् ॥ ११॥ ईश्वरं सर्वभूतानां
    वन्दे भूतमयं प्रभुम् । इति नामशतं दिव्यं वैष्णवं खलु पापहम् ॥ १२॥ व्यासेन कथितं पूर्वं सर्वपापप्रणाशनम्
    । यः पठेत्प्रातरुत्थाय स भवेद्वैष्णवो नरः ॥ १३॥ सर्वपापविशुद्धात्मा विष्णुसायुज्यमाप्नुयात् । चान्द्रायणसहस्राणि
    कन्यादानशतानि च ॥ १४॥ गवां लक्षसहस्राणि मुक्तिभागी भवेन्नरः । अश्वमेधायुतं पुण्यं फलं प्राप्नोति मानवः
    ॥ १५॥ । इति श्रीविष्णुपुराणे विष्णुशतनामस्तोत्रं सम्पूर्णम् ।
