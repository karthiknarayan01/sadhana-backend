id: andhakakritamvishnustotram
category: stotram
name:
  english: andhakakritamvishnustotram
  devanagari: अन्धककृतंविष्णुस्तोत्रम्
content:
  english: andhakakritam vishnustotram andhaka uvaca | jaya krishnaya haraye vishnave jishnave namah |
    hrishikesha jagaddhatre acyutaya mahatmane || 15|| namah pankajanabhaya namah pankajamaline | janardanaya
    shrishaya shripate pitavasase || 16|| govindaya namo nityam namo jaladhishayine | namah karalavaktraya
    narasimhaya nadine || 17|| sharngine sitavarnaya shankhacakragadabhrite | namo vamanarupaya yajnarupaya
    te namah || 18|| namo varaharupaya krantalokatrayaya ca | vyaptasheshadigantaya keshavaya namo namah
    || 19|| vasudeva namastubhyam namah kaitabhanashine | lakshmyalaya surashreshtha namaste suranayaka
    || 20|| vishnordevadhidevasya pranamam ye'pi kurvate | prajapaterjagaddhatusteshamapi namamyaham ||
    21|| samastabhutadevasya vasudevasya dhimatah | pranamam ye prakurvanti teshamapi namamyaham || 22||
    tasya yajnavarahasya vishnoramitatejasah | pranamam ye prakurvanti teshamapi namamyaham || 23|| gunanam
    hi nidhanaya namaste'stu punahpunah | karunyambunidhe deva sarvabhaktipriyaya ca || 24|| iti shriskandapurane
    avantyakhande revakhande ashtacatvarimsha
  devanagari: अन्धककृतं विष्णुस्तोत्रम् अन्धक उवाच । जय कृष्णाय हरये विष्णवे जिष्णवे नमः । हृषीकेश जगद्धात्रे
    अच्युताय महात्मने ॥ १५॥ नमः पङ्कजनाभाय नमः पङ्कजमालिने । जनार्दनाय श्रीशाय श्रीपते पीतवाससे ॥ १६॥
    गोविन्दाय नमो नित्यं नमो जलधिशायिने । नमः करालवक्त्राय नरसिंहाय नादिने ॥ १७॥ शार्ङ्गिणे सितवर्णाय
    शङ्खचक्रगदाभृते । नमो वामनरूपाय यज्ञरूपाय ते नमः ॥ १८॥ नमो वराहरूपाय क्रान्तलोकत्रयाय च । व्याप्ताशेषदिगन्ताय
    केशवाय नमो नमः ॥ १९॥ वासुदेव नमस्तुभ्यं नमः कैटभनाशिने । लक्ष्म्यालय सुरश्रेष्ठ नमस्ते सुरनायक ॥ २०॥
    विष्णोर्देवाधिदेवस्य प्रणामं येऽपि कुर्वते । प्रजापतेर्जगद्धातुस्तेषामपि नमाम्यहम् ॥ २१॥ समस्तभूतदेवस्य
    वासुदेवस्य धीमतः । प्रणामं ये प्रकुर्वन्ति तेषामपि नमाम्यहम् ॥ २२॥ तस्य यज्ञवराहस्य विष्णोरमिततेजसः
    । प्रणामं ये प्रकुर्वन्ति तेषामपि नमाम्यहम् ॥ २३॥ गुणानां हि निधानाय नमस्तेऽस्तु पुनःपुनः । कारुण्याम्बुनिधे
    देव सर्वभक्तिप्रियाय च ॥ २४॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे रेवाखण्डे अष्टचत्वारिंशा
