id: nrisimhashatcakropanishat
category: upanishad
name:
  english: nrisimhashatcakropanishat
  devanagari: नृसिंहषट्चक्रोपनिषत्
content:
  english: nrisimhashatcakropanishat om deva ha vai satyam lokamayamstam prajapatimapricchannarasimhacakranno
    bruhiti | tanprajapatirnarasimhacakramavocat | shadvai narasimhani cakrani bhavanti | yat prathamam
    taccaturaram yadvitiyam taccaturaram yattritiyam tadashtaram yaccaturtham tatpancaram yatpancamam
    tatpancaram yat shashtham tadashtaram tadetati shadeva narasimhani cakrani bhavanti || atha kani namani
    bhavanti | yat prathamam tadacakram yadvitiyam tatsucakram yattritiyam tanmahacakram yaccaturtham
    tatsakalalokarakshanacakram yatpancamam taddyutacakram yadvai shashtham tadasurantakacakram tadetani
    shadeva narasimhacakranamani bhavanti || atha kani trini valayani bhavanti | yatprathamam tadantaravalayam
    bhavati | yaddditiyam tanmadhyamam valayam bhavati | yat tritiyam tadbahyam valayam bhavati | tadetani
    trinyeva valayani bhavanti | yada tadvaitadbijam yanmadhyamam tam narasimhagayatrim yadbahyam tanmantrah
    || atha kimantaram valayam | shadvantarani valayani bhavanti | yannarasimham tatprathamasya yanmahalakshmyam
    tadvitiyasya yatsarasvatam tattritiyasya yasya yatkamam devam taccaturthasya yat pranavam tatpancamasya
    yatkrodhadaivatam tat shashthasya | tadetani shannam narasimhacakranam shadantarani valayani bhavanti
    || atha kim madhyamam valayam | shadvai madhyamani valayani bhavanti | yannarasimhaya tatprathamasya
    yadvidmahe taddvitiyasya yadvajranakhaya tattritiyasya yaddhimahi taccaturthasya yattannastatpancamasya
    yatsimhah pracodayaditi tat shashthasya | tadetani shannam narasimhacakranam shanmadhyamani valayani
    bhavanti || atha kim bahyam valayam | shadvai bahyani valayani bhavanti | yadacakram yadatma tatprathamasya
    yatsucakram yatpriyatma taddvitiyasya yanmahacakram yajjyotiratma tattritiyasya yatsakalalokarakshanacakram
    yanmayatma taccaturthasya yadacakram yadyogatma tatpancamasya yadasurantakacakram yatsatyatma tat
    shashthasya | tadetani shannam narasimhacakranam shat bahyani valayani bhavanti || kvaitani nyasyani
    | yatprathamam taddhridaye yaddvitiyam tacchirasi yattritiyam tacchikhayam yaccaturtham tatsarveshvangeshu
    yatpancamam tatsarveshu
  devanagari: नृसिंहषट्चक्रोपनिषत् ॐ देवा ह वै सत्यं लोकमायंस्तं प्रजापतिमपृच्छन्नारसिंहचक्रन्नो ब्रूहीति
    । तान्प्रजापतिर्नारसिंहचक्रमवोचत् । षड्वै नारसिंहानि चक्राणि भवन्ति । यत् प्रथमं तच्चतुररं यद्वितीयं
    तच्चतुररं यत्तृतीयं तदष्टारं यच्चतुर्थं तत्पञ्चारं यत्पञ्चमं तत्पञ्चारं यत् षष्ठं तदष्टारं तदेताति
    षडेव नारसिंहानि चक्राणि भवन्ति ॥ अथ कानि नामानि भवन्ति । यत् प्रथमं तदाचक्रं यद्वितीयं तत्सुचक्रं
    यत्तृतीयं तन्महाचक्रं यच्चतुर्थं तत्सकललोकरक्षणचक्रं यत्पञ्चमं तद्द्यूतचक्रं यद्वै षष्ठं तदसुरान्तकचक्रं
    तदेतानि षडेव नारसिंहचक्रनामानि भवन्ति ॥ अथ कानि त्रीणि वलयानि भवन्ति । यत्प्रथमं तदान्तरवलयं भवति
    । यद्द्दितीयं तन्मध्यमं वलयं भवति । यत् तृतीयं तद्बाह्यं वलयं भवति । तदेतानि त्रीण्येव वलयानि भवन्ति
    । यदा तद्वैतद्बीजं यन्मध्यमं तां नारसिंहगायत्रीं यद्बाह्यं तन्मन्त्रः ॥ अथ किमान्तरं वलयम् । षड्वान्तराणि
    वलयानि भवन्ति । यन्नारसिंहं तत्प्रथमस्य यन्माहालक्ष्म्यं तद्वितीयस्य यत्सारस्वतं तत्तृतीयस्य यस्य
    यत्कामं देवं तच्चतुर्थस्य यत् प्रणवं तत्पञ्चमस्य यत्क्रोधदैवतं तत् षष्ठस्य । तदेतानि षण्णां नारसिंहचक्राणां
    षडान्तराणि वलयानि भवन्ति ॥ अथ किं मध्यमं वलयम् । षड्वै मध्यमानि वलयानि भवन्ति । यन्नारसिंहाय तत्प्रथमस्य
    यद्विद्महे तद्द्वितीयस्य यद्वज्रनखाय तत्तृतीयस्य यद्धीमहि तच्चतुर्थस्य यत्तन्नस्तत्पञ्चमस्य यत्सिंहः
    प्रचोदयादिति तत् षष्ठस्य । तदेतानि षण्णां नारसिंहचक्राणां षण्मध्यमानि वलयानि भवन्ति ॥ अथ किं बाह्यं
    वलयम् । षड्वै बाह्यानि वलयानि भवन्ति । यदाचक्रं यदात्मा तत्प्रथमस्य यत्सुचक्रं यत्प्रियात्मा तद्द्वितीयस्य
    यन्महाचक्रं यज्ज्योतिरात्मा तत्तृतीयस्य यत्सकललोकरक्षणचक्रं यन्मायात्मा तच्चतुर्थस्य यदाचक्रं यद्योगात्मा
    तत्पञ्चमस्य यदसुरान्तकचक्रं यत्सत्यात्मा तत् षष्ठस्य । तदेतानि षण्णां नारसिंहचक्राणां षट् बाह्यानि
    वलयानि भवन्ति ॥ क्वैतानि न्यस्यानि । यत्प्रथमं तद्धृदये यद्द्वितीयं तच्छिरसि यत्तृतीयं तच्छिखायां
    यच्चतुर्थं तत्सर्वेष्वङ्गेषु यत्पञ्चमं तत्सर्वेषु
