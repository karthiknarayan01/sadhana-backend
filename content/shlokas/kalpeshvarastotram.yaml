id: kalpeshvarastotram
category: stotram
name:
  english: kalpeshvarastotram
  devanagari: कल्पेश्वरस्तोत्रम्
content:
  english: jiveshavishvasurayakshanrirakshasadyah yasmimsthitashca khalu yena viceshtitashca | yasmatparam
    na ca tatha'paramasti kincit kalpeshvaram bhavabhayartiharam prapadye || 1|| yam nishkriyo vigatamayavibhuh
    pareshah nityo vikararahito nijavirvikalpah | eko'dvitiya iti yacchrutaya bruvanti kalpeshvaram bhavabhayartiharam
    prapadye || 2|| kalpadrumam pranatabhaktahridandhakaram mayavilasamakhilam vinivartayantam | citsuryarupamamalam
    nijamatmarupam kalpeshvaram bhavabhayartiharam prapadye || 3|| iti shrimat paramahamsa parivrajakacarya
    sadguru bhagavata shridharasvamina viracitam shrikalpeshvarastotram sampurnam |
  devanagari: जीवेशविश्वसुरयक्षनृराक्षसाद्याः यस्मिंस्थिताश्च खलु येन विचेष्टिताश्च । यस्मात्परं न च तथाऽपरमस्ति
    किञ्चित् कल्पेश्वरं भवभयार्तिहरं प्रपद्ये ॥ १॥ यं निष्क्रियो विगतमायविभुः परेशः नित्यो विकाररहितो
    निजविर्विकल्पः । एकोऽद्वितीय इति यच्छ्रुतया ब्रुवन्ति कल्पेश्वरं भवभयार्तिहरं प्रपद्ये ॥ २॥ कल्पद्रुमं
    प्रणतभक्तहृदन्धकारं मायाविलासमखिलं विनिवर्तयन्तम् । चित्सूर्यरूपममलं निजमात्मरूपं कल्पेश्वरं भवभयार्तिहरं
    प्रपद्ये ॥ ३॥ इति श्रीमत् परमहंस परिव्राजकाचार्य सद्गुरु भगवता श्रीधरस्वामिना विरचितं श्रीकल्पेश्वरस्तोत्रं
    सम्पूर्णम् ।
meaning: {}
