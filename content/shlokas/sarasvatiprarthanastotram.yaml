id: sarasvatiprarthanastotram
category: stotram
name:
  english: sarasvatiprarthanastotram
  devanagari: सरस्वतीप्रार्थनास्तोत्रम्
content:
  english: nishatanadayarasancitavilokanam daivatam || 2|| kalakkanitanupuram kalitadinarakshakaram shashankakritashekharam
    shamitabhaktadainyotkaram | kada duritadurlabham kamalabhumanovallabham maho'hamavalokaye mahitasahitilabdhaye
    || 3|| rasajnahridayangamasphuradasimabhavodayam tadiyarasabhavanasamucitairgunairbandhuram | nirargalavinirgalatsuradhunitarangakramam
    vidhatrivaravarnani vitaratadvacovaikharima || 4|| viduraya mamapadam vitara bhadramavyahatam vidhehi
    vimalam yasho viracaya prasadam mayi | sudharasasahodaraih shishirayantaram mamakam dayarasatarangitairbhuvanamataralokanaih
    || 5|| tvameva yami sharanam jagadamba vani shitamshukhandaparishobhitamaulibhage | vacalanupurasamancitapadapajhe
    vacamadhishvari vidhehi mayi prasadam || 6|| bhashyakarena racita jiyadvagdevatanutih | shrikalahastishaguruvaryapadabjasevaya
  devanagari: निशातनदयारसाञ्चितविलोकनं दैवतम् ॥ २॥ कलक्कणितनूपुरं कलितदीनरक्षाकरं शशाङ्ककृतशेखरं शमितभक्तदैन्योत्करम्
    । कदा दुरितदुर्लभं कमलभूमनोवल्लभं महोऽहमवलोकये महितसाहितीलब्धये ॥ ३॥ रसज्ञहृदयङ्गमस्फुरदसीमभावोदयां
    तदीयरसभावनासमुचितैर्गुणैर्बन्धुराम् । निरर्गलविनिर्गलत्सुरधुनीतरङ्गक्रमां विधातृवरवर्णनी वितरताद्वचोवैखरीम
    ॥ ४॥ विदूरय ममापदं वितर भद्रमव्याहतं विधेहि विमलं यशो विरचय प्रसादं मयि । सुधारससहोदरैः शिशिरयान्तरं
    मामकं दयारसतरङ्गितैर्भुवनमातरालोकनैः ॥ ५॥ त्वामेव यामि शरणं जगदम्ब वाणि शीतांशुखण्डपरिशोभितमौलिभागे
    । वाचालनूपुरसमञ्चितपादपझे वाचामधीश्वरि विधेहि मयि प्रसादम् ॥ ६॥ भाष्यकारेण रचिता जीयद्वाग्देवतानुतिः
    । श्रीकालहस्तीशगुरुवर्यपादाब्जसेवया
