id: chinnamastasahasra-2
category: sahasranama
name:
  english: chinnamastasahasra
  devanagari: छिन्नमस्तासहस्र
content:
  english: dharmarthakamamoksharthe pathe viniyogah || 8|| om pracandacandika canda candadaityavinashini
    | camunda ca sacanda ca capala carudehini || 9|| lalajihva caladrakta carucandranibhanana | cakorakshi
    candanada cancala ca manonmada || 10|| cetana citisamstha ca citkala jnanarupini | mahabhayankari
    devi varadabhayadharini || 11|| bhavadhya bhavarupa ca bhavabandhavimocini | bhavani bhuvaneshi ca
    bhavasamsaratarini || 12|| bhavabdhirbhavamoksha ca bhavabandhavighatini | bhagirathi bhagastha ca
    bhagyabhogapradayini || 13|| kamala kamada durga durgabandhavimocini | durddarshana durgarupa durjneya
    durganashini || 14|| dinaduhkhahara nitya nityashokavinashini | nityanandamaya devi nityam kalyanakarini
    || 15|| sarvarthasadhanakari sarvasiddhisvarupini | sarvakshobhanashaktishca sarvavidravini para ||
    16|| sarvaranjanashaktishca sarvonmadasvarupini | sarvada siddhidatri ca siddhavidyasvarupini || 17||
    sakala nishkala siddha kalatita kalamayi | kulajna kularupa ca cakshuranandadayini || 18|| kulina
    samarupa ca kamarupa manohara | kamalastha kanjamukhi kunjareshvaragamini || 19|| kularupa kotarakshi
    kamalaishvaryadayini | kunti kakudmini kulla kurukulla karalika || 20|| kameshvari kamamata kamatapavimocini
    | kamarupa kamasatva kamakautukakarini || 21|| karunyahridaya krimkrimmantrarupa ca kotara | kaumodaki
    kumudini kaivalya kulavasini || 22|| keshavi keshavaradhya keshidaityanishudini | kleshaha klesharahita
    kleshasanghavinashini || 23|| karali ca karalasya karalasuranashini | karalacarmasidhara karalakalanashini
    || 24|| kankini kankanirata kapalavaradharini | khadgahasta trinetra ca khandamundasidharini || 25||
    khalaha khalahantri ca ksharanti khagata sada | gangagautamapujya ca gauri gandharvavasini || 26||
    gandharva gaganaradhya gana gandharvasevita | ganatkaragana devi nirguna ca gunatmika || 27|| gunata
    gunadatri ca gunagauravadayini | ganeshamata gambhira gagana jyotikarini || 28|| gaurangi ca gaya
    gamya gautamasthanavasini | gadadharapriya jneya jnanagamya guheshvari || 29|| gayatri ca gunavati
    gunatita guneshvari | ganeshajanani devi ganeshavaradayini || 30|| ganadhyakshanuta nitya ganadhyakshaprapujita
    | girisharamani devi girishaparivandita || 31|| gatida gatiha gita gautami gurusevita | gurupujya
    guruyuta gurusevanatatpara || 32|| gandhadvara ca gandhadhya gandhatma gandhakarini | girvanapatisampujya
    girvanapatitushtida || 33|| girvanadhisharamani girvanadhishavandita | girvanadhishasamsevya girvanadhishaharshada
    || 34|| ganashaktirganagamya ganashaktipradayini | ganavidya ganasiddha ganasantushtamanasa || 35||
    ganatita ganagita ganaharshaprapurita | gandharvapatisamhrishta gandharvagunamandita || 36|| gandharvaganasamsevya
    gandharvaganamadhyaga | gandharvaganakushala gandharvaganapujita || 37|| gandharvagananirata gandharvaganabhushita
    | gharghara ghorarupa ca ghoraghurghuranadini || 38|| gharmabindusamudbhuta gharmabindusvarupini |
    ghantarava ghanarava ghanarupa ghanodari || 39|| ghorasatva ca ghanada ghantanadavinodani | ghoracandalini
    ghora ghoracandavinashini || 40|| ghoradanavadamani ghoradanavanashini | ghorakarmadirahita ghorakarmanishevita
    || 41|| ghoratatvamayi devi ghoratatvavimocani | ghorakarmadirahita ghorakarmadipurita || 42|| ghorakarmadinirata
    ghorakarmapravarddhini | ghorabhutapramathini ghoravetalanashini || 43|| ghoradavagnidamani ghorashatrunishudini
    | ghoramantrayuta caiva ghoramantraprapujita || 44|| ghoramantramanobhijna ghoramantraphalaprada |
    ghoramantranidhishcaiva ghoramantrakritaspada || 45|| ghoramantreshvari devi ghoramantrarthamanasa
    | ghoramantrarthatatvajna ghoramantrarthaparaga || 46|| ghoramantrarthavibhava ghoramantrarthabodhini
    | ghoramantrarthanicaya ghoramantrarthajanmabhuh || 47|| ghoramantrajaparata ghoramantrajapodyata
    | nakaravarnanilaya nakaraksharamandita || 48|| nakarapararupa nakarakshararupini | citrarupa citranadi
    carukeshi cayaprabha || 49|| cancala cancalakara carurupa ca candika | caturvedamayi canda candalaganamandita
    || 50|| candalacchedini candataponirmulakarini | caturbhuja candarupa candamundavinashini || 51||
    candrika candrakirtishca candrakantistathaiva ca | candrasya candrarupa ca candramaulisvarupini ||
    52|| candramaulipriya candramaulisantushtamanasa | cakorabandhuramani cakorabandhupujita || 53|| cakrarupa
    cakramayi cakrakarasvarupini | cakrapanipriya cakrapanipritipradayini || 54|| cakrapanirasabhijna
    cakrapanivaraprada | cakrapanivaronmatta cakrapanisvarupini || 55|| cakrapanishvari nityam cakrapaninamaskrita
    | cakrapanisamudbhuta cakrapanigunaspada || 56|| candravali candravati candrakotisamaprabha | candanarcitapadabja
    candananvitamastaka || 57|| carukirtishcarunetra carucandravibhushana | carubhusha caruvesha caruveshapradayini
    || 58|| carubhushabhushitangi caturvaktravaraprada | caturvaktrasamaradhya caturvaktrasamashrita ||
    59|| caturvaktracaturvaha caturthi ca caturdashi | citra carmanvati caitri candrabhaga ca campaka
    || 60|| caturddashayamakara caturdashayamanuga | caturdashayamaprita caturdashayamapriya || 61|| chalastha
    chidrarupa ca chadmada chadmarajika | chinnamasta tatha chinna chinnamundavidharini || 62|| jayada
    jayarupa ca jayanti jayamohini | jaya jivanasamstha ca jalandharanivasini || 63|| jvalamukhi jvaladatri
    jajvalyadahanopama | jagadvandya jagatpujya jagattranaparayana || 64|| jagati jagatadhara janmamrityujarapaha
    | janani janmabhumishcajanmada jayashalini || 65|| jvararogahara jvala jvalamalaprapurita | jambharatishvari
    jambharativaibhavakarini || 66|| jambharatistuta jambharatishatrunishudini | jayadurga jayaradhya
    jayakali jayeshvari || 67|| jayatara jayatita jayashankaravallabha | jayada jahnutanaya jaladhitrasakarini
    || 68|| jaladhivyadhidamani jaladhijvaranashini | jangameshi jadyahara jadyasanghanivarini || 69||
    jadyagrastajanatita jadyaroganivarini | janmadatri janmahartri jayaghoshasamanvita || 70|| japayogasamayukta
    japayogavinodini | japayogapriya japya japatita jayasvana || 71|| jayabhavasthita jaya jayabhavaprapurani
    | japakusumasankasha japakusumapujita || 72|| japakusumasamprita japakusumamandita | japakusumavadbhasa
    japakusumarupini || 73|| jamadagnisvarupa ca janaki janakatmaja | jhanjhavatapramuktangi jhorajhankaravasini
    || 74|| jhankarakarini jhanjhavatarupa ca jhankari | nakaranusvarupa ca tanatankaranadini || 75||
    tankari takuvani ca thakarakshararupini | dindima ca tatha dimbha dindudindimanadini || 76|| dhakkamayi
    dhilamayi nrityashabda vilasini | dhakka dhakkeshvari dhakkashabdarupa tathaiva ca || 77|| dhakkanadapriya
    dhakkanadasantushtamanasa | nankara naksharamayi naksharadisvarupini || 78|| tripura tripuramayi caiva
    trishaktistrigunatmika | tamasi ca trilokeshi tripura ca trayishvari || 79|| trividya ca trirupa ca
    trinetra ca trirupini | tarini tarala tara tarakariprapujita || 80|| tarakarisamaradhya tarakarivaraprada
    | tarakariprasustanvi taruni taralaprabha || 81|| trirupa ca tripuraga trishulavaradharini | trishulini
    tantramayi tantrashastravisharada || 82|| tantrarupa tapomurtistantramantrasvarupini | tadittadillatakara
    tattvajnanapradayini || 83|| tattvajnaneshvari devi tattvajnanaprabodhini | trayimayi trayisevya tryakshari
    tryakshareshvari || 84|| tapavidhvamsini tapasanghanirmulakarini | trasakartri trasahartri trasadatri
    ca trasaha || 85|| tithisha tithirupa ca tithistha tithipujita | tilottama ca tilada tilaprita tileshvari
    || 86|| triguna trigunakara tripuri tripuratmika | trikuta trikutakara trikutacalamadhyaga || 87||
    trijata ca trinetra ca trinetravarasundari | tritiya ca trivarsha ca trividha trimateshvari || 88||
    trikonastha trikoneshi trikonayantramadhyaga | trisandhya ca trisandhyarcya tripada tripadaspada ||
    89|| sthanasthita sthalastha ca dhanyasthalanivasini | thakarakshararupa ca sthalarupa tathaiva ca
    || 90|| sthulahasta tatha sthula sthairyarupaprakashini | durga durgartihantri ca durgabandhavimocini
    || 91|| devi danavasamhantri danujyeshthanishudini | darapatyaprada nitya shankararddhangadharini
    || 92|| divyangi devamata ca devadushtavinashini | dinaduhkhahara dinatapanirmulakarini || 93|| dinamata
    dinasevya dinadambhavinashini | danujadhvamsini devi devaki devavallabha || 94|| danavaripriya dirgha
    danavariprapujita | dirghasvara dirghatanurddirghadurgatinashini || 95|| dirghanetra dirghacakshurddirghakeshi
    digambara | digambarapriya danta digambarasvarupini || 96|| duhkhahina duhkhahara duhkhasagaratarini
    | duhkhadaridryashamani duhkhadaridryakarini || 97|| duhkhada dussaha dushtakhandanaikasvarupini |
    devavama devasevya devashaktipradayini || 98|| damini daminiprita daminishatasundari | daminishatasamsevya
    daminidamabhushita || 99|| devatabhavasantushta devatashatamadhyaga | dayarddara ca dayarupa dayadanaparayana
    || 100|| dayashila dayasara dayasagarasamsthita | dashavidyatmika devi dashavidyasvarupini || 101||
    dharani dhanada dhatri dhanya dhanyapara shiva | dharmarupa dhanishtha ca dheya ca dhiragocara ||
    102|| dharmarajeshvari dharmakarmarupa dhaneshvari | dhanurvidya dhanurgamya dhanurddharavaraprada
    || 103|| dharmashila dharmalila dharmakarmavivarjita | dharmada dharmanirata dharmapakhandakhandini
    || 104|| dharmeshi dharmarupa ca dharmarajavaraprada | dharmini dharmagehastha dharmadharmasvarupini
    || 105|| dhanada dhanadaprita dhanadhanyasamriddhida | dhanadhanyasamriddhistha dhanadhanyavinashini
    || 106|| dharmanishtha dharmadhira dharmamargarata sada | dharmabijakritasthana dharmabijasurakshini
    || 107|| dharmabijeshvari dharmabijarupa ca dharmaga | dharmabijasamudbhuta dharmabijasamashrita ||
    108|| dharadharapatiprana dharadharapatistuta | dharadharendratanuja dharadharendravandita || 109||
    dharadharendragehastha dharadharendrapalini | dharadharendrasarvartinashini dharmapalini || 110||
    navina nirmmala nitya nagarajaprapujita | nageshvari nagamata nagakanya ca nagnika || 111|| nirlepa
    nirvikalpa ca nirloma nirupadrava | nirahara nirakara niranjanasvarupini || 112|| nagini nagavibhava
    nagarajaparistuta | nagarajagunajna ca nagarajasukhaprada || 113|| nagalokagata nityam nagalokanivasini
    | nagalokeshvari nagabhagini nagapujita || 114|| nagamadhyasthita nagamohasamkshobhadayini | nrityapriya
    nrityavati nrityagitaparayana || 115|| nrityeshvari nartaki ca nrityarupa nirashraya | narayani narendrastha
    naramundasthimalini || 116|| naramamsapriya nitya nararaktapriya sada | nararajeshvari narirupa narisvarupini
    || 117|| nariganarcita narimadhyaga nutanambara | narmada ca nadirupa nadisangamasamsthita || 118||
    narmadeshvarasamprita narmadeshvararupini | padmavati padmamukhi padmakinjalkavasini || 119|| pattavastraparidhana
    padmaragavibhushita | parama pritida nityam pretasananivasini || 120|| paripurnarasonmatta premavihvalavallabha
    | pavitrasavanishputa preyasi paramatmika || 121|| priyavratapara nityam paramapremadayini | pushpapriya
    padmakosha padmadharmanivasini || 122|| phetkarini tantrarupa pherupheravanadini | vamshini vamsharupa
    ca bagala vamarupini || 123|| vanmayi vasudha dhrishya vagbhavakhya vara nara | buddhida buddhirupa
    ca vidya vadasvarupini || 124|| bala vriddhamayirupa vani vakyanivasini | varuna vagvati vira virabhushanabhushita
    || 125|| virabhadrarcitapada virabhadraprasurapi | vedamargarata vedamantrarupa vashat priya || 126||
    vinavadyasamayukta vinavadyaparayana | vinarava tatha vinashabdarupa ca vaishnavi || 127|| vaishnavacaranirata
    vaishnavacaratatpara | vishnusevya vishnupatni vishnurupa varanana || 128|| vishveshvari vishvamata
    vishvanirmanakarini | vishvarupa ca vishveshi vishvasamharakarini || 129|| bhairavi bhairavaradhya
    bhutabhairavasevita | bhairaveshi tatha bhima bhairaveshvaratushtida || 130|| bhairavadhisharamani
    bhairavadhishapalini | bhimeshvari bhimamata bhimashabdaparayana || 131|| bhimarupa ca bhimeshi bhima
    bhimavaraprada | bhimapujitapadabja bhimabhairavapalini || 132|| bhimasuradhvamsakari bhimadushtavinashini
    | bhuvana bhuvanaradhya bhavani bhutida sada || 133|| bhayada bhayahantri ca abhaya bhayarupini |
    bhimanada vihvala ca bhayabhitivinashini || 134|| matta pramattarupa ca madonmattasvarupini | manya
    manojna mana ca mangala ca manohara || 135|| mananiya mahapujya mahamahishamarddini | mahishasurahantri
    ca matangi mayavasini || 136|| madhvi madhumayi mudra mudrika mantrarupini | mahavishveshvari duti
    maulicandraprakashini || 137|| yashahsvarupini devi yogamargapradayini | yogini yogagamya ca yamyeshi
    yogarupini || 138|| yajnangi ca yogamayi japarupa japatmika | yugakhya ca yuganta ca yonimandalavasini
    || 139|| ayonija yoganidra yoganandapradayini | rama ratipriya nityam ratiragavivarddhini || 140||
    ramani rasasambhuta ramya rasapriya rasa | ranotkantha ranastha ca vara rangapradayini || 141|| revati
    ranajaitri ca rasodbhuta ranotsava | lata lavanyarupa ca lavanabdhisvarupini || 142|| lavangakusumaradhya
    lolajihva ca leliha | vashini vanasamstha ca vanapushpapriya vara || 143|| praneshvari buddhirupa
    buddhidatri budhatmika | shamani shvetavarna ca shankari shivabhashini || 144|| shyamyarupa shaktirupa
    shaktibindunivasini | sarveshvari sarvadatri sarvamata ca sharvari || 145|| shambhavi siddhida siddha
    sushumna surabhasini | sahasradalamadhyastha sahasradalavarttini || 146|| harapriya haradhyeya hu~karabijarupini
    | lankeshvari ca tarala lomamamsaprapujita || 147|| kshemya kshemakari kshama kshirabindusvarupini
    | kshiptacittaprada nityam kshaumavastravilasini || 148|| chinna ca chinnarupa ca kshudha kshautkararupini
    | sarvavarnamayi devi sarvasampatpradayini || 149|| sarvasampatpradatri ca sampadapadvibhushita |
    sattvarupa ca sarvartha sarvadevaprapujita || 150|| sarveshvari sarvamata sarvajna surasritmika |
    sindhurmandakini ganga nadisagararupini || 151|| sukeshi muktakeshi ca dakini varavarnini | jnanada
    jnanagagana somamandalavasini || 152|| akashanilaya nitya paramakasharupini | annapurna mahanitya
    mahadevarasodbhava || 153|| mangala kalika canda candanadatibhishana | candasurasya mathini camunda
    capalatmika || 154|| candi camarakeshi ca calatkundaladharini | mundamaladhara nitya khandamundavilasini
    || 155|| khadgahasta mundahasta varahasta varaprada | asicarmadhara nitya pashankushadhara para ||
    156|| shulahasta shivahasta ghantanadavilasini | dhanurbanadhara''ditya nagahasta nagatmaja || 157||
    mahishasurahantri ca raktabijavinashini | raktarupa raktaga ca raktahasta bhayaprada || 158|| asita
    ca dharmadhara pashankushadhara para | dhanurbanadhara nitya dhumralocananashini || 159|| parastha
    devatamurtih sharvani sharada para | nanavarnavibhushangi nanaragasamapini || 160|| pashuvastraparidhana
    pushpayudhadhara para | muktaranjitamaladhya muktaharavilasini || 161|| svarnakundalabhusha ca svarnasimhasanasthita
    | sundarangi suvarnabha shambhavi shakatatmika || 162|| sarvalokeshavidya ca mohasammohakarini | shreyasi
    srishtirupa ca chinnacchadmamayi chala || 163|| chinnamundadhara nitya nityanandavidhayini | nanda
    purna ca rikta ca tithayah purnashodashi || 164|| kuhuh sankrantirupa ca pancaparvavilasini | pancabanadhara
    nitya pancamapritida para || 165|| pancapatrabhilasha ca pancamritavilasini | pancali pancami devi
    pancaraktaprasarini || 166|| pancabanadhara nitya nityadatri dayapara | palaladipriya nitya'pashugamya
    pareshita || 167|| para pararahasya ca paramapremavihvala | kulina keshimargastha kulamargaprakashini
    || 168|| kulakulasvarupa ca kularnavamayi kula | rukma ca kalarupa ca kalakampanakarini || 169|| vilasarupini
    bhadra kulakulanamaskrita | kuberavittadhatri ca kumarajanani para || 170|| kumarirupasamstha ca kumaripujanambika
    | kuranganayana devi dineshasya'parajita || 171|| kundalikadali sena kumargarahita vara | anatarupa'nantastha
    anandasindhuvasini || 172|| ilasvarupini devi iibhedabhayankari | ida ca pingala nadi ikarakshararupini
    || 173|| uma cotpattirupa ca uccabhavavinashini | rigveda ca niraradhya yajurvedaprapujita || 174||
    samavedena sangita atharvavedabhashini | rikararupini riksha niraksharasvarupini || 175|| ahidurgasamacara
    ikararnasvarupini | omkara pranavastha ca omkaradisvarupini || 176|| anulomavilomastha thakaravarnasambhava
    | pancashadvarnabijadhya pancashanmundamalika || 177|| pratyeka dashasamkhya ca shodashi chinnamastaka
    | shadangayuvatipujya shadangarupavarjita || 178|| shadvaktrasamshrita nitya vishveshi khadgadalaya
    | malamantramayi mantrajapamata madalasa || 179|| sarvavishveshvari shaktih sarvanandapradayini |
    iti shrichinnamastaya namasahasramuttamam || 180|| pujakramena kathitam sadhakanam sukhavaham | gopaniyam
    gopaniyam gopaniyam na samshayah || 181|| arddharatre muktakesho bhaktiyukto bhavennarah | japitva
    pujayitva ca pathennamasahasrakam || 182|| vidyasiddhirbhavettasya shanmasabhyasayogatah | yena kena
    prakarena devibhaktiparo bhavet || 183|| akhilanstambhayellokamrajno'pi mohayetsada | akarshayeddevashaktim
    marayeddevi vidvisham || 184|| shatravo dasatam yanti yanti papani samkshayam | mrityushca kshayatam
    yati pathanadbhashanatpriye || 185|| prashastayah prasadena kim na siddhyati bhutale | idam rahasyam
    paramam param svastyayanam mahat || 186|| dhritva bahau mahasiddhih prapyate natra samshayah | anaya
    sadrishi vidya vidyate na maheshvari || 187|| varamekam tu yo'dhite sarvasiddhishvaro bhavet | kulavare
    kulashtamyam kuhusankrantiparvasu || 188|| yashcemam pathate vidyam tasya samyakphalam sha
  devanagari: धर्मार्थकाममोक्षार्थे पाठे विनियोगः ॥ ८॥ ॐ प्रचण्डचण्डिका चण्डा चण्डदैत्यविनाशिनी । चामुण्डा
    च सचण्डा च चपला चारुदेहिनी ॥ ९॥ ललजिह्वा चलद्रक्ता चारुचन्द्रनिभानना । चकोराक्षी चण्डनादा चञ्चला च
    मनोन्मदा ॥ १०॥ चेतना चितिसंस्था च चित्कला ज्ञानरूपिणी । महाभयङ्करी देवी वरदाभयधारिणी ॥ ११॥ भवाढ्या
    भवरूपा च भवबन्धविमोचिनी । भवानी भुवनेशी च भवसंसारतारिणी ॥ १२॥ भवाब्धिर्भवमोक्षा च भवबन्धविघातिनी ।
    भागीरथी भगस्था च भाग्यभोगप्रदायिनी ॥ १३॥ कमला कामदा दुर्गा दुर्गबन्धविमोचिनी । दुर्द्दर्शना दुर्गरूपा
    दुर्ज्ञेया दुर्गनाशिनी ॥ १४॥ दीनदुःखहरा नित्या नित्यशोकविनाशिनी । नित्यानन्दमया देवी नित्यं कल्याणकारिणी
    ॥ १५॥ सर्वार्थसाधनकरी सर्वसिद्धिस्वरूपिणी । सर्वक्षोभणशक्तिश्च सर्वविद्राविणी परा ॥ १६॥ सर्वरञ्जनशक्तिश्च
    सर्वोन्मादस्वरूपिणी । सर्वदा सिद्धिदात्री च सिद्धविद्यास्वरूपिणी ॥ १७॥ सकला निष्कला सिद्धा कलातीता
    कलामयी । कुलज्ञा कुलरूपा च चक्षुरानन्ददायिनी ॥ १८॥ कुलीना सामरूपा च कामरूपा मनोहरा । कमलस्था कञ्जमुखी
    कुञ्जरेश्वरगामिनी ॥ १९॥ कुलरूपा कोटराक्षी कमलैश्वर्यदायिनी । कुन्ती ककुद्मिनी कुल्ला कुरुकुल्ला करालिका
    ॥ २०॥ कामेश्वरी काममाता कामतापविमोचिनी । कामरूपा कामसत्वा कामकौतुककारिणी ॥ २१॥ कारुण्यहृदया क्रींक्रींमन्त्ररूपा
    च कोटरा । कौमोदकी कुमुदिनी कैवल्या कुलवासिनी ॥ २२॥ केशवी केशवाराध्या केशिदैत्यनिषूदिनी । क्लेशहा क्लेशरहिता
    क्लेशसङ्घविनाशिनी ॥ २३॥ कराली च करालास्या करालासुरनाशिनी । करालचर्मासिधरा करालकलनाशिनी ॥ २४॥ कङ्किनी
    कङ्कनिरता कपालवरधारिणी । खड्गहस्ता त्रिनेत्रा च खण्डमुण्डासिधारिणी ॥ २५॥ खलहा खलहन्त्री च क्षरन्ती
    खगता सदा । गङ्गागौतमपूज्या च गौरी गन्धर्ववासिनी ॥ २६॥ गन्धर्वा गगणाराध्या गणा गन्धर्वसेविता । गणत्कारगणा
    देवी निर्गुणा च गुणात्मिका ॥ २७॥ गुणता गुणदात्री च गुणगौरवदायिनी । गणेशमाता गम्भीरा गगणा ज्योतिकारिणी
    ॥ २८॥ गौराङ्गी च गया गम्या गौतमस्थानवासिनी । गदाधरप्रिया ज्ञेया ज्ञानगम्या गुहेश्वरी ॥ २९॥ गायत्री
    च गुणवती गुणातीता गुणेश्वरी । गणेशजननी देवी गणेशवरदायिनी ॥ ३०॥ गणाध्यक्षनुता नित्या गणाध्यक्षप्रपूजिता
    । गिरीशरमणी देवी गिरीशपरिवन्दिता ॥ ३१॥ गतिदा गतिहा गीता गौतमी गुरुसेविता । गुरुपूज्या गुरुयुता गुरुसेवनतत्परा
    ॥ ३२॥ गन्धद्वारा च गन्धाढ्या गन्धात्मा गन्धकारिणी । गीर्वाणपतिसम्पूज्या गीर्वाणपतितुष्टिदा ॥ ३३॥ गीर्वाणाधिशरमणी
    गीर्वाणाधिशवन्दिता । गीर्वाणाधिशसंसेव्या गीर्वाणाधिशहर्षदा ॥ ३४॥ गानशक्तिर्गानगम्या गानशक्तिप्रदायिनी
    । गानविद्या गानसिद्धा गानसन्तुष्टमानसा ॥ ३५॥ गानातीता गानगीता गानहर्षप्रपूरिता । गन्धर्वपतिसंहृष्टा
    गन्धर्वगुणमण्डिता ॥ ३६॥ गन्धर्वगणसंसेव्या गन्धर्वगणमध्यगा । गन्धर्वगणकुशला गन्धर्वगणपूजिता ॥ ३७॥ गन्धर्वगणनिरता
    गन्धर्वगणभूषिता । घर्घरा घोररूपा च घोरघुर्घुरनादिनी ॥ ३८॥ घर्मबिन्दुसमुद्भूता घर्मबिन्दुस्वरूपिणी
    । घण्टारवा घनरवा घनरूपा घनोदरी ॥ ३९॥ घोरसत्वा च घनदा घण्टानादविनोदनी । घोरचाण्डालिनी घोरा घोरचण्डविनाशिनी
    ॥ ४०॥ घोरदानवदमनी घोरदानवनाशिनी । घोरकर्मादिरहिता घोरकर्मनिषेविता ॥ ४१॥ घोरतत्वमयी देवी घोरतत्वविमोचनी
    । घोरकर्मादिरहिता घोरकर्मादिपूरिता ॥ ४२॥ घोरकर्मादिनिरता घोरकर्मप्रवर्द्धिनी । घोरभूतप्रमथिनी घोरवेतालनाशिनी
    ॥ ४३॥ घोरदावाग्निदमनी घोरशत्रुनिषूदिनी । घोरमन्त्रयुता चैव घोरमन्त्रप्रपूजिता ॥ ४४॥ घोरमन्त्रमनोभिज्ञा
    घोरमन्त्रफलप्रदा । घोरमन्त्रनिधिश्चैव घोरमन्त्रकृतास्पदा ॥ ४५॥ घोरमन्त्रेश्वरी देवी घोरमन्त्रार्थमानसा
    । घोरमन्त्रार्थतत्वज्ञा घोरमन्त्रार्थपारगा ॥ ४६॥ घोरमन्त्रार्थविभवा घोरमन्त्रार्थबोधिनी । घोरमन्त्रार्थनिचया
    घोरमन्त्रार्थजन्मभूः ॥ ४७॥ घोरमन्त्रजपरता घोरमन्त्रजपोद्यता । ङकारवर्णानिलया ङकाराक्षरमण्डिता ॥ ४८॥
    ङकारापररूपा ङकाराक्षररूपिणी । चित्ररूपा चित्रनाडी चारुकेशी चयप्रभा ॥ ४९॥ चञ्चला चञ्चलाकारा चारुरूपा
    च चण्डिका । चतुर्वेदमयी चण्डा चण्डालगणमण्डिता ॥ ५०॥ चाण्डालच्छेदिनी चण्डतपोनिर्मूलकारिणी । चतुर्भुजा
    चण्डरूपा चण्डमुण्डविनाशिनी ॥ ५१॥ चन्द्रिका चन्द्रकीर्तिश्च चन्द्रकान्तिस्तथैव च । चन्द्रास्या चन्द्ररूपा
    च चन्द्रमौलिस्वरूपिणी ॥ ५२॥ चन्द्रमौलिप्रिया चन्द्रमौलिसन्तुष्टमानसा । चकोरबन्धुरमणी चकोरबन्धुपूजिता
    ॥ ५३॥ चक्ररूपा चक्रमयी चक्राकारस्वरूपिणी । चक्रपाणिप्रिया चक्रपाणिप्रीतिप्रदायिनी ॥ ५४॥ चक्रपाणिरसाभिज्ञा
    चक्रपाणिवरप्रदा । चक्रपाणिवरोन्मत्ता चक्रपाणिस्वरूपिणी ॥ ५५॥ चक्रपाणिश्वरी नित्यं चक्रपाणिनमस्कृता
    । चक्रपाणिसमुद्भूता चक्रपाणिगुणास्पदा ॥ ५६॥ चन्द्रावली चन्द्रवती चन्द्रकोटिसमप्रभा । चन्दनार्चितपादाब्जा
    चन्दनान्वितमस्तका ॥ ५७॥ चारुकीर्तिश्चारुनेत्रा चारुचन्द्रविभूषणा । चारुभूषा चारुवेषा चारुवेषप्रदायिनी
    ॥ ५८॥ चारुभूषाभूषिताङ्गी चतुर्वक्त्रवरप्रदा । चतुर्वक्त्रसमाराध्या चतुर्वक्त्रसमाश्रिता ॥ ५९॥ चतुर्वक्त्रचतुर्वाहा
    चतुर्थी च चतुर्दशी । चित्रा चर्मण्वती चैत्री चन्द्रभागा च चम्पका ॥ ६०॥ चतुर्द्दशयमाकारा चतुर्दशयमानुगा
    । चतुर्दशयमप्रीता चतुर्दशयमप्रिया ॥ ६१॥ छलस्था छिद्ररूपा च छद्मदा छद्मराजिका । छिन्नमस्ता तथा छिन्ना
    छिन्नमुण्डविधारिणी ॥ ६२॥ जयदा जयरूपा च जयन्ती जयमोहिनी । जया जीवनसंस्था च जालन्धरनिवासिनी ॥ ६३॥ ज्वालामुखी
    ज्वालदात्री जाज्वल्यदहनोपमा । जगद्वन्द्या जगत्पूज्या जगत्त्राणपरायणा ॥ ६४॥ जगती जगताधारा जन्ममृत्युजरापहा
    । जननी जन्मभूमिश्चजन्मदा जयशालिनी ॥ ६५॥ ज्वररोगहरा ज्वाला ज्वालामालाप्रपूरिता । जम्भारातीश्वरी जम्भारातिवैभवकारिणी
    ॥ ६६॥ जम्भारातिस्तुता जम्भारातिशत्रुनिषूदिनी । जयदुर्गा जयाराध्या जयकाली जयेश्वरी ॥ ६७॥ जयतारा जयातीता
    जयशङ्करवल्लभा । जयदा जह्नुतनया जलधित्रासकारिणी ॥ ६८॥ जलधिव्याधिदमनी जलधिज्वरनाशिनी । जङ्गमेशी जाड्यहरा
    जाड्यसङ्घनिवारिणी ॥ ६९॥ जाड्यग्रस्तजनातीता जाड्यरोगनिवारिणी । जन्मदात्री जन्महर्त्री जयघोषसमन्विता
    ॥ ७०॥ जपयोगसमायुक्ता जपयोगविनोदिनी । जपयोगप्रिया जाप्या जपातीता जयस्वना ॥ ७१॥ जायाभावस्थिता जाया जायाभावप्रपूरणी
    । जपाकुसुमसङ्काशा जपाकुसुमपूजिता ॥ ७२॥ जपाकुसुमसम्प्रीता जपाकुसुममण्डिता । जपाकुसुमवद्भासा जपाकुसुमरूपिणी
    ॥ ७३॥ जमदग्निस्वरूपा च जानकी जनकात्मजा । झञ्झावातप्रमुक्ताङ्गी झोरझङ्कारवासिनी ॥ ७४॥ झङ्कारकारिणी
    झञ्झावातरूपा च झङ्करी । ञकाराणुस्वरूपा च टनटङ्कारनादिनी ॥ ७५॥ टङ्कारी टकुवाणी च ठकाराक्षररूपिणी ।
    डिण्डिमा च तथा डिम्भा डिण्डुडिण्डिमनादिनी ॥ ७६॥ ढक्कामयी ढिलमयी नृत्यशब्दा विलासिनी । ढक्का ढक्केश्वरी
    ढक्काशब्दरूपा तथैव च ॥ ७७॥ ढक्कानादप्रिया ढक्कानादसन्तुष्टमानसा । णङ्कारा णाक्षरमयी णाक्षरादिस्वरूपिणी
    ॥ ७८॥ त्रिपुरा त्रिपुरमयी चैव त्रिशक्तिस्त्रिगुणात्मिका । तामसी च त्रिलोकेशी त्रिपुरा च त्रयीश्वरी
    ॥ ७९॥ त्रिविद्या च त्रिरूपा च त्रिनेत्रा च त्रिरूपिणी । तारिणी तरला तारा तारकारिप्रपूजिता ॥ ८०॥ तारकारिसमाराध्या
    तारकारिवरप्रदा । तारकारिप्रसूस्तन्वी तरुणी तरलप्रभा ॥ ८१॥ त्रिरूपा च त्रिपुरगा त्रिशूलवरधारिणी । त्रिशूलिनी
    तन्त्रमयी तन्त्रशास्त्रविशारदा ॥ ८२॥ तन्त्ररूपा तपोमूर्तिस्तन्त्रमन्त्रस्वरूपिणी । तडित्तडिल्लताकारा
    तत्त्वज्ञानप्रदायिनी ॥ ८३॥ तत्त्वज्ञानेश्वरी देवी तत्त्वज्ञानप्रबोधिनी । त्रयीमयी त्रयीसेव्या त्र्यक्षरी
    त्र्यक्षरेश्वरी ॥ ८४॥ तापविध्वंसिनी तापसङ्घनिर्मूलकारिणी । त्रासकर्त्री त्रासहर्त्री त्रासदात्री च
    त्रासहा ॥ ८५॥ तिथीशा तिथिरूपा च तिथिस्था तिथिपूजिता । तिलोत्तमा च तिलदा तिलप्रिता तिलेश्वरी ॥ ८६॥
    त्रिगुणा त्रिगुणाकारा त्रिपुरी त्रिपुरात्मिका । त्रिकुटा त्रिकुटाकारा त्रिकुटाचलमध्यगा ॥ ८७॥ त्रिजटा
    च त्रिनेत्रा च त्रिनेत्रवरसुन्दरी । तृतीया च त्रिवर्षा च त्रिविधा त्रिमतेश्वरी ॥ ८८॥ त्रिकोणस्था त्रिकोणेशी
    त्रिकोणयन्त्रमध्यगा । त्रिसन्ध्या च त्रिसन्ध्यार्च्या त्रिपदा त्रिपदास्पदा ॥ ८९॥ स्थानस्थिता स्थलस्था
    च धन्यस्थलनिवासिनी । थकाराक्षररूपा च स्थलरूपा तथैव च ॥ ९०॥ स्थूलहस्ता तथा स्थूला स्थैर्यरूपप्रकाशिनी
    । दुर्गा दुर्गार्तिहन्त्री च दुर्गबन्धविमोचिनी ॥ ९१॥ देवी दानवसंहन्त्री दनुज्येष्ठनिषूदिनी । दारापत्यप्रदा
    नित्या शङ्करार्द्धाङ्गधारिणी ॥ ९२॥ दिव्याङ्गी देवमाता च देवदुष्टविनाशिनी । दीनदुःखहरा दीनतापनिर्मूलकारिणी
    ॥ ९३॥ दीनमाता दीनसेव्या दीनदम्भविनाशिनी । दनुजध्वंसिनी देवी देवकी देववल्लभा ॥ ९४॥ दानवारिप्रिया दीर्घा
    दानवारिप्रपूजिता । दीर्घस्वरा दीर्घतनुर्द्दीर्घदुर्गतिनाशिनी ॥ ९५॥ दीर्घनेत्रा दीर्घचक्षुर्द्दीर्घकेशी
    दिगम्बरा । दिगम्बरप्रिया दान्ता दिगम्बरस्वरूपिणी ॥ ९६॥ दुःखहीना दुःखहरा दुःखसागरतारिणी । दुःखदारिद्र्यशमनी
    दुःखदारिद्र्यकारिणी ॥ ९७॥ दुःखदा दुस्सहा दुष्टखण्डनैकस्वरूपिणी । देववामा देवसेव्या देवशक्तिप्रदायिनी
    ॥ ९८॥ दामिनी दामिनीप्रीता दामिनीशतसुन्दरी । दामिनीशतसंसेव्या दामिनीदामभूषिता ॥ ९९॥ देवताभावसन्तुष्टा
    देवताशतमध्यगा । दयार्द्दरा च दयारूपा दयादानपरायणा ॥ १००॥ दयाशीला दयासारा दयासागरसंस्थिता । दशविद्यात्मिका
    देवी दशविद्यास्वरूपिणी ॥ १०१॥ धरणी धनदा धात्री धन्या धन्यपरा शिवा । धर्मरूपा धनिष्ठा च धेया च धीरगोचरा
    ॥ १०२॥ धर्मराजेश्वरी धर्मकर्मरूपा धनेश्वरी । धनुर्विद्या धनुर्गम्या धनुर्द्धरवरप्रदा ॥ १०३॥ धर्मशीला
    धर्मलीला धर्मकर्मविवर्जिता । धर्मदा धर्मनिरता धर्मपाखण्डखण्डिनी ॥ १०४॥ धर्मेशी धर्मरूपा च धर्मराजवरप्रदा
    । धर्मिणी धर्मगेहस्था धर्माधर्मस्वरूपिणी ॥ १०५॥ धनदा धनदप्रीता धनधान्यसमृद्धिदा । धनधान्यसमृद्धिस्था
    धनधान्यविनाशिनी ॥ १०६॥ धर्मनिष्ठा धर्मधीरा धर्ममार्गरता सदा । धर्मबीजकृतस्थाना धर्मबीजसुरक्षिणी ॥
    १०७॥ धर्मबीजेश्वरी धर्मबीजरूपा च धर्मगा । धर्मबीजसमुद्भूता धर्मबीजसमाश्रिता ॥ १०८॥ धराधरपतिप्राणा
    धराधरपतिस्तुता । धराधरेन्द्रतनुजा धराधरेन्द्रवन्दिता ॥ १०९॥ धराधरेन्द्रगेहस्था धराधरेन्द्रपालिनी ।
    धराधरेन्द्रसर्वार्तिनाशिनी धर्मपालिनी ॥ ११०॥ नवीना निर्म्मला नित्या नागराजप्रपूजिता । नागेश्वरी नागमाता
    नागकन्या च नग्निका ॥ १११॥ निर्लेपा निर्विकल्पा च निर्लोमा निरुपद्रवा । निराहारा निराकारा निरञ्जनस्वरूपिणी
    ॥ ११२॥ नागिनी नागविभवा नागराजपरिस्तुता । नागराजगुणज्ञा च नागराजसुखप्रदा ॥ ११३॥ नागलोकगता नित्यं नागलोकनिवासिनी
    । नागलोकेश्वरी नागभागिनी नागपूजिता ॥ ११४॥ नागमध्यस्थिता नागमोहसंक्षोभदायिनी । नृत्यप्रिया नृत्यवती
    नृत्यगीतपरायणा ॥ ११५॥ नृत्येश्वरी नर्तकी च नृत्यरूपा निराश्रया । नारायणी नरेन्द्रस्था नरमुण्डास्थिमालिनी
    ॥ ११६॥ नरमांसप्रिया नित्या नररक्तप्रिया सदा । नरराजेश्वरी नारीरूपा नारीस्वरूपिणी ॥ ११७॥ नारीगणार्चिता
    नारीमध्यगा नूतनाम्बरा । नर्मदा च नदीरूपा नदीसङ्गमसंस्थिता ॥ ११८॥ नर्मदेश्वरसम्प्रीता नर्मदेश्वररूपिणी
    । पद्मावती पद्ममुखी पद्मकिञ्जल्कवासिनी ॥ ११९॥ पट्टवस्त्रपरीधाना पद्मरागविभूषिता । परमा प्रीतिदा नित्यं
    प्रेतासननिवासिनी ॥ १२०॥ परिपूर्णरसोन्मत्ता प्रेमविह्वलवल्लभा । पवित्रासवनिष्पूता प्रेयसी परमात्मिका
    ॥ १२१॥ प्रियव्रतपरा नित्यं परमप्रेमदायिनी । पुष्पप्रिया पद्मकोशा पद्मधर्मनिवासिनी ॥ १२२॥ फेत्कारिणी
    तन्त्ररूपा फेरुफेरवनादिनी । वंशिनी वंशरूपा च बगला वामरूपिणी ॥ १२३॥ वाङ्मयी वसुधा धृष्या वाग्भवाख्या
    वरा नरा । बुद्धिदा बुद्धिरूपा च विद्या वादस्वरूपिणी ॥ १२४॥ बाला वृद्धमयीरूपा वाणी वाक्यनिवासिनी ।
    वरुणा वाग्वती वीरा वीरभूषणभूषिता ॥ १२५॥ वीरभद्रार्चितपदा वीरभद्रप्रसूरपि । वेदमार्गरता वेदमन्त्ररूपा
    वषट् प्रिया ॥ १२६॥ वीणावाद्यसमायुक्ता वीणावाद्यपरायणा । वीणारवा तथा वीणाशब्दरूपा च वैष्णवी ॥ १२७॥
    वैष्णवाचारनिरता वैष्णवाचारतत्परा । विष्णुसेव्या विष्णुपत्नी विष्णुरूपा वरानना ॥ १२८॥ विश्वेश्वरी विश्वमाता
    विश्वनिर्माणकारिणी । विश्वरूपा च विश्वेशी विश्वसंहारकारिणी ॥ १२९॥ भैरवी भैरवाराध्या भूतभैरवसेविता
    । भैरवेशी तथा भीमा भैरवेश्वरतुष्टिदा ॥ १३०॥ भैरवाधिशरमणी भैरवाधिशपालिनी । भीमेश्वरी भीममाता भीमशब्दपरायणा
    ॥ १३१॥ भीमरूपा च भीमेशी भीमा भीमवरप्रदा । भीमपूजितपादाब्जा भीमभैरवपालिनी ॥ १३२॥ भीमासुरध्वंसकरी भीमदुष्टविनाशिनी
    । भुवना भुवनाराध्या भवानी भूतिदा सदा ॥ १३३॥ भयदा भयहन्त्री च अभया भयरूपिणी । भीमनादा विह्वला च भयभीतिविनाशिनी
    ॥ १३४॥ मत्ता प्रमत्तरूपा च मदोन्मत्तस्वरूपिणी । मान्या मनोज्ञा माना च मङ्गला च मनोहरा ॥ १३५॥ माननीया
    महापूज्या महामहिषमर्द्दिनी । महिषासुरहन्त्री च मातङ्गी मयवासिनी ॥ १३६॥ माध्वी मधुमयी मुद्रा मुद्रिका
    मन्त्ररूपिणी । महाविश्वेश्वरी दूती मौलिचन्द्रप्रकाशिनी ॥ १३७॥ यशःस्वरूपिणी देवी योगमार्गप्रदायिनी
    । योगिनी योगगम्या च याम्येशी योगरूपिणी ॥ १३८॥ यज्ञाङ्गी च योगमयी जपरूपा जपात्मिका । युगाख्या च युगान्ता
    च योनिमण्डलवासिनी ॥ १३९॥ अयोनिजा योगनिद्रा योगानन्दप्रदायिनी । रमा रतिप्रिया नित्यं रतिरागविवर्द्धिनी
    ॥ १४०॥ रमणी राससम्भूता रम्या रासप्रिया रसा । रणोत्कण्ठा रणस्था च वरा रङ्गप्रदायिनी ॥ १४१॥ रेवती रणजैत्री
    च रसोद्भूता रणोत्सवा । लता लावण्यरूपा च लवणाब्धिस्वरूपिणी ॥ १४२॥ लवङ्गकुसुमाराध्या लोलजिह्वा च लेलिहा
    । वशिनी वनसंस्था च वनपुष्पप्रिया वरा ॥ १४३॥ प्राणेश्वरी बुद्धिरूपा बुद्धिदात्री बुधात्मिका । शमनी
    श्वेतवर्णा च शाङ्करी शिवभाषिणी ॥ १४४॥ श्याम्यरूपा शक्तिरूपा शक्तिबिन्दुनिवासिनी । सर्वेश्वरी सर्वदात्री
    सर्वमाता च शर्वरी ॥ १४५॥ शाम्भवी सिद्धिदा सिद्धा सुषुम्ना सुरभासिनी । सहस्रदलमध्यस्था सहस्रदलवर्त्तिनी
    ॥ १४६॥ हरप्रिया हरध्येया हूँकारबीजरूपिणी । लङ्केश्वरी च तरला लोममांसप्रपूजिता ॥ १४७॥ क्षेम्या क्षेमकरी
    क्षामा क्षीरबिन्दुस्वरूपिणी । क्षिप्तचित्तप्रदा नित्यं क्षौमवस्त्रविलासिनी ॥ १४८॥ छिन्ना च छिन्नरूपा
    च क्षुधा क्षौत्काररूपिणी । सर्ववर्णमयी देवी सर्वसम्पत्प्रदायिनी ॥ १४९॥ सर्वसम्पत्प्रदात्री च सम्पदापद्विभूषिता
    । सत्त्वरूपा च सर्वार्था सर्वदेवप्रपूजिता ॥ १५०॥ सर्वेश्वरी सर्वमाता सर्वज्ञा सुरसृत्मिका । सिन्धुर्मन्दाकिनी
    गङ्गा नदीसागररूपिणी ॥ १५१॥ सुकेशी मुक्तकेशी च डाकिनी वरवर्णिनी । ज्ञानदा ज्ञानगगना सोममण्डलवासिनी
    ॥ १५२॥ आकाशनिलया नित्या परमाकाशरूपिणी । अन्नपूर्णा महानित्या महादेवरसोद्भवा ॥ १५३॥ मङ्गला कालिका चण्डा
    चण्डनादातिभीषणा । चण्डासुरस्य मथिनी चामुण्डा चपलात्मिका ॥ १५४॥ चण्डी चामरकेशी च चलत्कुण्डलधारिणी ।
    मुण्डमालाधरा नित्या खण्डमुण्डविलासिनी ॥ १५५॥ खड्गहस्ता मुण्डहस्ता वरहस्ता वरप्रदा । असिचर्मधरा नित्या
    पाशाङ्कुशधरा परा ॥ १५६॥ शूलहस्ता शिवहस्ता घण्टानादविलासिनी । धनुर्बाणधराऽऽदित्या नागहस्ता नगात्मजा
    ॥ १५७॥ महिषासुरहन्त्री च रक्तबीजविनाशिनी । रक्तरूपा रक्तगा च रक्तहस्ता भयप्रदा ॥ १५८॥ असिता च धर्मधरा
    पाशाङ्कुशधरा परा । धनुर्बाणधरा नित्या धूम्रलोचननाशिनी ॥ १५९॥ परस्था देवतामूर्तिः शर्वाणी शारदा परा
    । नानावर्णविभूषाङ्गी नानारागसमापिनी ॥ १६०॥ पशुवस्त्रपरीधाना पुष्पायुधधरा परा । मुक्तरञ्जितमालाढ्या
    मुक्ताहारविलासिनी ॥ १६१॥ स्वर्णकुण्डलभूषा च स्वर्णसिंहासनस्थिता । सुन्दराङ्गी सुवर्णाभा शाम्भवी शकटात्मिका
    ॥ १६२॥ सर्वलोकेशविद्या च मोहसम्मोहकारिणी । श्रेयसी सृष्टिरूपा च छिन्नच्छद्ममयी छला ॥ १६३॥ छिन्नमुण्डधरा
    नित्या नित्यानन्दविधायिनी । नन्दा पूर्णा च रिक्ता च तिथयः पूर्णषोडशी ॥ १६४॥ कुहूः सङ्क्रान्तिरूपा
    च पञ्चपर्वविलासिनी । पञ्चबाणधरा नित्या पञ्चमप्रीतिदा परा ॥ १६५॥ पञ्चपत्राभिलाषा च पञ्चामृतविलासिनी
    । पञ्चाली पञ्चमी देवी पञ्चरक्तप्रसारिणी ॥ १६६॥ पञ्चबाणधरा नित्या नित्यदात्री दयापरा । पललादिप्रिया
    नित्याऽपशुगम्या परेशिता ॥ १६७॥ परा पररहस्या च परमप्रेमविह्वला । कुलिना केशिमार्गस्था कुलमार्गप्रकाशिनी
    ॥ १६८॥ कुलाकुलस्वरूपा च कुलार्णवमयी कुला । रुक्मा च कालरूपा च कालकम्पनकारिणी ॥ १६९॥ विलासरूपिणी भद्रा
    कुलाकुलनमस्कृता । कुबेरवित्तधात्री च कुमारजननी परा ॥ १७०॥ कुमारीरूपसंस्था च कुमारीपूजनाम्बिका । कुरङ्गनयना
    देवी दिनेशास्याऽपराजिता ॥ १७१॥ कुण्डलीकदली सेना कुमार्गरहिता वरा । अनतरूपाऽनन्तस्था आनन्दसिन्धुवासिनी
    ॥ १७२॥ इलास्वरूपिणी देवी इईभेदभयङ्करी । इडा च पिङ्गला नाडी इकाराक्षररूपिणी ॥ १७३॥ उमा चोत्पत्तिरूपा
    च उच्चभावविनाशिनी । ऋग्वेदा च निराराध्या यजुर्वेदप्रपूजिता ॥ १७४॥ सामवेदेन सङ्गीता अथर्ववेदभाषिणी
    । ऋकाररूपिणी ऋक्षा निरक्षरस्वरूपिणी ॥ १७५॥ अहिदुर्गासमाचारा इकारार्णस्वरूपिणी । ॐकारा प्रणवस्था च
    ॐकारादिस्वरूपिणी ॥ १७६॥ अनुलोमविलोमस्था थकारवर्णसम्भवा । पञ्चाशद्वर्णबीजाढ्या पञ्चाशन्मुण्डमालिका
    ॥ १७७॥ प्रत्येका दशसंख्या च षोडशी छिन्नमस्तका । षडङ्गयुवतीपूज्या षडङ्गरूपवर्जिता ॥ १७८॥ षड्वक्त्रसंश्रिता
    नित्या विश्वेशी खड्गदालया । मालामन्त्रमयी मन्त्रजपमाता मदालसा ॥ १७९॥ सर्वविश्वेश्वरी शक्तिः सर्वानन्दप्रदायिनी
    । इति श्रीछिन्नमस्ताया नामसहस्रमुत्तमम् ॥ १८०॥ पूजाक्रमेण कथितं साधकानां सुखावहम् । गोपनीयं गोपनीयं
    गोपनीयं न संशयः ॥ १८१॥ अर्द्धरात्रे मुक्तकेशो भक्तियुक्तो भवेन्नरः । जपित्वा पूजयित्वा च पठेन्नामसहस्रकम्
    ॥ १८२॥ विद्यासिद्धिर्भवेत्तस्य षण्मासाभ्यासयोगतः । येन केन प्रकारेण देवीभक्तिपरो भवेत् ॥ १८३॥ अखिलान्स्तम्भयेल्लोकांराज्ञोऽपि
    मोहयेत्सदा । आकर्षयेद्देवशक्तिं मारयेद्देवि विद्विषम् ॥ १८४॥ शत्रवो दासतां यान्ति यान्ति पापानि संक्षयम्
    । मृत्युश्च क्षयतां याति पठनाद्भाषणात्प्रिये ॥ १८५॥ प्रशस्तायाः प्रसादेन किं न सिद्ध्यति भूतले । इदं
    रहस्यं परमं परं स्वस्त्ययनं महत् ॥ १८६॥ धृत्वा बाहौ महासिद्धिः प्राप्यते नात्र संशयः । अनया सदृशी
    विद्या विद्यते न महेश्वरि ॥ १८७॥ वारमेकं तु योऽधीते सर्वसिद्धीश्वरो भवेत् । कुलवारे कुलाष्टम्यां कुहूसङ्क्रान्तिपर्वसु
    ॥ १८८॥ यश्चेमं पठते विद्यां तस्य सम्यक्फलं श
