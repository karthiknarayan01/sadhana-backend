id: hanumatprashamsanam
category: stotram
name:
  english: hanumatprashamsanam
  devanagari: हनुमत्प्रशंसनम्
content:
  english: vishnorvaradajayadarjuna eva cainam || 3|| datto varo na manujan prati vanaramshca dhatrasya
    tena vijito yudhi valinaishah | abjodbhavasya varamashvabhibhuya raksho jigye tvaham ranamukhe balimahvayantam
    || 4|| balerdvastho'ham varamasmai sampradaya purvam tu | tena maya raksho'stam yojanamayutam padangulya
    || 5|| punashca yuddhaya samahvayantam nyapatayam ravanamekamushtina | mahabalo'ham kapilakhyarupastrikutarupah
    pavanashca me sutah || 6|| avam svashaktya jayinaviti sma shivo varante'jayadenamevam | jnatva surajeyamimam
    hi vavre haro jayeyahamamum dashananam || 7|| atah svabhavajjayinavaham ca vayushca vayurhanuman sa
    eshah | amushya hetostu pura hi vayuna shivendrapurva api kashthavatkritah || 8|| ato hanuman padametu
    dhaturmadajnaya srishtyavanadikarma | moksham ca lokasya sadaiva kurvan muktashca muktan sukhayan
    pravartatam || 9|| bhogashca ye yani ca karmajatanyanadyanantani mameha santi | madajnaya tanyakhilani
    santi dhatuh pade tat sahabhoganama || 10|| etadrisham me sahabhojanam te maya pradattam hanuman sadaiva
    | itiritastam hanuman pranamya jagada vakyam sthirabhaktinamrah || 11|| iti shrimadanandatirthiyamahabharatatatparyanirnayatah
    shrihanumatprashamsanam |
  devanagari: विष्णोर्वरादजयदर्जुन एव चैनम् ॥ ३॥ दत्तो वरो न मनुजान् प्रति वानरांश्च धात्रास्य तेन विजितो
    युधि वालिनैषः । अब्जोद्भवस्य वरमाश्वभिभूय रक्षो जिग्ये त्वहं रणमुखे बलिमाह्वयन्तम् ॥ ४॥ बलेर्द्वास्थोऽहं
    वरमस्मै सम्प्रदाय पूर्वं तु । तेन मया रक्षोऽस्तं योजनमयुतं पदाङ्गुल्या ॥ ५॥ पुनश्च युद्धाय समाह्वयन्तं
    न्यपातयं रावणमेकमुष्टिना । महाबलोऽहं कपिलाख्यरूपस्त्रिकूटरूपः पवनश्च मे सुतः ॥ ६॥ आवां स्वशक्त्या
    जयिनाविति स्म शिवो वरान्तेऽजयदेनमेवम् । ज्ञात्वा सुराजेयमिमं हि वव्रे हरो जयेयाहममुं दशाननम् ॥ ७॥
    अतः स्वभावाज्जयिनावहं च वायुश्च वायुर्हनुमान् स एषः । अमुष्य हेतोस्तु पुरा हि वायुना शिवेन्द्रपूर्वा
    अपि काष्ठवत्कृताः ॥ ८॥ अतो हनूमान् पदमेतु धातुर्मदाज्ञया सृष्ट्यवनादिकर्म । मोक्षं च लोकस्य सदैव कुर्वन्
    मुक्तश्च मुक्तान् सुखयन् प्रवर्तताम् ॥ ९॥ भोगाश्च ये यानि च कर्मजातान्यनाद्यनन्तानि ममेह सन्ति । मदाज्ञया
    तान्यखिलानि सन्ति धातुः पदे तत् सहभोगनाम ॥ १०॥ एतादृशं मे सहभोजनं ते मया प्रदत्तं हनुमन् सदैव । इतीरितस्तं
    हनूमान् प्रणम्य जगाद वाक्यं स्थिरभक्तिनम्रः ॥ ११॥ इति श्रीमदानन्दतीर्थीयमहाभारततात्पर्यनिर्णयतः श्रीहनुमत्प्रशंसनम्
    ।
