id: devaihkritam10vishnustotram
category: stotram
name:
  english: devaihkritam10vishnustotram
  devanagari: देवैःकृतं१०विष्णुस्तोत्रम्
content:
  english: devaih kritam 10 vishnustotram deva ucuh | namaste'stu jagadbija namaste kamalapate | namaste'stu
    sureshana namaste kamalekshana || 1|| tvam sthitih sarvabhutanam tvameva sharanam satam | tvam hanta
    sarvadushtanam hayagriva namo'stu te || 2|| tvamonkaro vashatkarah svaha svadha caturvidha | adyastvam
    ca sureshana tvameva sharanam sada || 3|| yajno yajnapatiryajva dravyam hota hutastatha | tvadartham
    huyate deva tvameva sharanam sakha || 4|| kalah karalarupastvam tvam varkah shitadidhitih | tvamagnirvarunashcaiva
    tvam ca kalakshayankarah || 5|| gunatrayam tvameveha gunahinastvameva hi | gunanamalayastvam ca gopta
    sarveshu jantushu || 6|| stripumsoshca dvidha tvam ca pashupakshyadimanavaih | caturvidham kulam tvam
    hi caturashitilakshanah || 7|| dinantashcaiva pakshanto masanto hayanam yugam | kalpantashca mahantashca
    kalantastvam ca vai hare || 8|| iti skandapurane brahmakhande dharmaranyakhande pancadashadhyayantargatam
    devaih kritam vishnustotram samaptam | skandapurana | brahmakhanda | dharmaranyakhanda | adhyaya 15
  devanagari: देवैः कृतं १० विष्णुस्तोत्रम् देवा ऊचुः । नमस्तेऽस्तु जगद्बीज नमस्ते कमलापते । नमस्तेऽस्तु
    सुरेशान नमस्ते कमलेक्षण ॥ १॥ त्वं स्थितिः सर्वभूतानां त्वमेव शरणं सताम् । त्वं हन्ता सर्वदुष्टानां
    हयग्रीव नमोऽस्तु ते ॥ २॥ त्वमोङ्कारो वषट्कारः स्वाहा स्वधा चतुर्विधा । आद्यस्त्वं च सुरेशान त्वमेव
    शरणं सदा ॥ ३॥ यज्ञो यज्ञपतिर्यज्वा द्रव्यं होता हुतस्तथा । त्वदर्थं हूयते देव त्वमेव शरणं सखा ॥ ४॥
    कालः करालरूपस्त्वं त्वं वार्कः शीतदीधितिः । त्वमग्निर्वरुणश्चैव त्वं च कालक्षयङ्करः ॥ ५॥ गुणत्रयं
    त्वमेवेह गुणहीनस्त्वमेव हि । गुणानामालयस्त्वं च गोप्ता सर्वेषु जन्तुषु ॥ ६॥ स्त्रीपुंसोश्च द्विधा
    त्वं च पशुपक्ष्यादिमानवैः । चतुर्विधं कुलं त्वं हि चतुराशीतिलक्षणः ॥ ७॥ दिनान्तश्चैव पक्षान्तो मासान्तो
    हायनं युगम् । कल्पान्तश्च महान्तश्च कालान्तस्त्वं च वै हरे ॥ ८॥ इति स्कन्दपुराणे ब्रह्मखण्डे धर्मारण्यखण्डे
    पञ्चदशाध्यायान्तर्गतं देवैः कृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । ब्राह्मखण्ड । धर्मारण्यखण्ड
    । अध्याय १५
