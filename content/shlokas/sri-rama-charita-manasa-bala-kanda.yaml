    dukhu laheu apara| bhayahu roshu rana ravanu mara || do prabhu soi rama ki apara kau jahi japata tripurari|
    satyadhama sarbagya tumha kahahu bibeku bicari || || jaise mitai mora bhrama bhari| kahahu so katha
    natha bistari || jagabalika bole musukai| tumhahi bidita raghupati prabhutai || ramamagata tumha mana
    krama bani| caturai tumhari maim jani || cahahu sunai rama guna gurhaa| kinhihu prasna manahu~ ati
    murhaa || tata sunahu sadara manu lai| kahu~ rama kai katha suhai || mahamohu mahishesu bisala| ramakatha
    kalika karala || ramakatha sasi kirana samana| santa cakora karahim jehi pana || aisei samsaya kinha
    bhavani| mahadeva taba kaha bakhani || do kahu~ so mati anuhari aba uma sambhu sambada| bhayu samaya
    jehi hetu jehi sunu muni mitihi bishada || || eka bara treta juga mahim| sambhu ge kumbhaja rishi
    pahim || sanga sati jagajanani bhavani| puje rishi akhilesvara jani || ramakatha munibarja bakhani|
    suni mahesa parama sukhu mani || rishi puchi haribhagati suhai| kahi sambhu adhikari pai || kahata
    sunata raghupati guna gatha| kachu dina taha~ rahe girinatha || muni sana bida magi tripurari| cale
    bhavana sa~ga dacchakumari || tehi avasara bhanjana mahibhara| hari raghubamsa linha avatara || pita
    bacana taji raju udasi| dandaka bana bicarata abinasi || do hdaya~ bicarata jata hara kehi bidhi darasanu
    hoi| gupta rupa avatareu prabhu ge~ jana sabu koi || sankara ura ati chobhu sati na janahim maramu
    soi || tulasi darasana lobhu mana daru locana lalaci || || ravana marana manuja kara jaca| prabhu
    bidhi bacanu kinha caha saca || jaum nahim jau~ rahi pachitava| karata bicaru na banata banava ||
    ehi bidhi bhe socabasa isa| tehi samaya jai dasasisa || linha nica maricahi sanga| bhayu turata soi
    kapata kuranga || kari chalu murha hari baidehi| prabhu prabhau tasa bidita na tehi || mriga badhi
    bandhu sahita hari ae| ashramu dekhi nayana jala chae || biraha bikala nara iva raghurai| khojata
    bipina phirata dau bhai || kabahu~ joga biyoga na jakem| dekha pragata biraha dukha takem || do ati
    vicitra raghupati carita janahim parama sujana| je matimanda bimoha basa hridaya~ dharahim kachu ana
    || || sambhu samaya tehi ramahi dekha| upaja hiya~ ati harapu bisesha || bhari locana chabisindhu
    nihari| kusamaya janina kinhi cinhari || jaya saccidananda jaga pavana| asa kahi caleu manoja nasavana
    || cale jata siva sati sameta| puni puni pulakata kripaniketa || satim so dasa sambhu kai dekhi| ura
    upaja sandehu biseshi || sankaru jagatabandya jagadisa| sura nara muni saba navata sisa || tinha nripasutahi
    naha paranama| kahi saccidananda paradhama || bhe magana chabi tasu biloki| ajahu~ priti ura rahati
    na roki || do brahma jo vyapaka biraja aja akala aniha abheda| so ki deha dhari hoi nara jahi na janata
    veda || || bishnu jo sura hita naratanu dhari| sau sarbagya jatha tripurari || khoji so ki agya iva
    nari| gyanadhama shripati asurari || sambhugira puni mrisha na hoi| siva sarbagya jana sabu koi ||
    asa samsaya mana bhayu apara| hoi na hridaya~ prabodha pracara || jadyapi pragata na kaheu bhavani|
    hara antarajami saba jani || sunahi sati tava nari subh | samsaya asa na dharia ura k || jasu katha
    kubhanja rishi gai| bhagati jasu maim munihi sunai || sau mama ishtadeva raghubira| sevata jahi sada
    muni dhira || cham muni dhira jogi siddha santata bimala mana jehi dhyavahim| kahi neti nigama purana
    agama jasu kirati gavahim || soi ramu byapaka brahma bhuvana nikaya pati maya dhani| avatareu apane
    bhagata hita nijatantra nita raghukulamani || so laga na ura upadesu jadapi kaheu siva~ bara bahu|
    bole bihasi mahesu harimaya balu jani jiya~ || || jaum tumharem mana ati sandehu| tau kina jai paricha
    lehu || taba lagi baitha ahu~ batachahim| jaba lagi tumha aihahu mohi pahi || jaisem jai moha bhrama
    bhari| karehu so jatanu bibeka bicari || calim sati siva ayasu pai| karahim bicaru karaum ka bhai
    || iha~ sambhu asa mana anumana| dacchasuta kahu~ nahim kalyana || morehu kahem na samsaya jahim|
    bidhi biparita bhalai nahim || hoihi soi jo rama raci rakha| ko kari tarka barhaavai sakha || asa
    kahi lage japana harinama| gi sati jaha~ prabhu sukhadhama || do puni puni hridaya~ vicaru kari dhari
    sita kara rupa| agem hoi cali pantha tehi jehim avata narabhupa || || lachimana dikha umakrita besha
    cakita bhe bhrama hridaya~ bisesha || kahi na sakata kachu ati gambhira| prabhu prabhau janata matidhira
    || sati kapatu janeu surasvami| sabadarasi saba antarajami || sumirata jahi miti agyana| soi sarabagya
    ramu bhagavana || sati kinha caha taha~hu~ dur | dekhahu nari subhava prabh || nija maya balu hridaya~
    bakhani| bole bihasi ramu mridu bani || jori pani prabhu kinha pranamu| pita sameta linha nija namu
    || kaheu bahori kaha~ brishaketu| bipina akeli phirahu kehi hetu || do rama bacana mridu gurha suni
    upaja ati sankocu| sati sabhita mahesa pahim calim hridaya~ bara socu || || maim sankara kara kaha
    na mana| nija agyanu rama para ana || jai utaru aba dehu~ kaha| ura upaja ati daruna daha || jana
    rama satim dukhu pava| nija prabhau kachu pragati janava || satim dikha kautuku maga jata| agem ramu
    sahita shri bhrata || phiri citava pachem prabhu dekha| sahita bandhu siya sundara vesha || jaha~
    citavahim taha~ prabhu asina| sevahim siddha munisa prabina || dekhe siva bidhi bishnu aneka| amita
    prabhau eka tem eka || bandata carana karata prabhu seva| bibidha besha dekhe saba deva || do sati
    bidhatri indira dekhim amita anupa| jehim jehim besha ajadi sura tehi tehi tana anurupa || || dekhe
    jaha~ taha~ raghupati jete| saktinha sahita sakala sura tete || jiva caracara jo samsara| dekhe sakala
    aneka prakara || pujahim prabhuhi deva bahu besha| rama rupa dusara nahim dekha || avaloke raghupati
    bahutere| sita sahita na besha ghanere || soi raghubara soi lachimanu sita| dekhi sati ati bhi sabhita
    || hridaya kampa tana sudhi kachu nahim| nayana mudi baithim maga mahim || bahuri bilokeu nayana ughari|
    kachu na dikha taha~ dacchakumari || puni puni nai rama pada sisa| calim taha~ jaha~ rahe girisa ||
    do gi samipa mahesa taba ha~si puchi kusalata| linhi paricha kavana bidhi kahahu satya saba bata ||
    dusara vishrama satim samujhi raghubira prabh | bhaya basa siva sana kinha dur || kachu na paricha
    linhi gosai| kinha pranamu tumharihi nai || jo tumha kaha so mrisha na hoi| morem mana pratiti ati
    soi || taba sankara dekheu dhari dhyana| satim jo kinha carita saba jana || bahuri ramamayahi siru
    nava| preri satihi jehim jhu~tha kahava || hari iccha bhavi balavana| hridaya~ bicarata sambhu sujana
    || satim kinha sita kara besha| siva ura bhayu bishada bisesha || jaum aba karu~ sati sana priti|
    miti bhagati pathu hoi aniti || do parama punita na jai taji kie~ prema bara papu| pragati na kahata
    mahesu kachu hridaya~ adhika santapu || || taba sankara prabhu pada siru nava| sumirata ramu hridaya~
    asa ava || ehim tana satihi bheta mohi nahim| siva sankalpu kinha mana mahim || asa bicari sankaru
    matidhira| cale bhavana sumirata raghubira || calata gagana bhai gira suhai| jaya mahesa bhali bhagati
    drirhaai || asa pana tumha binu kari ko ana| ramabhagata samaratha bhagavana || suni nabhagira sati
    ura soca| pucha sivahi sameta sakoca || kinha kavana pana kahahu kripala| satyadhama prabhu dinadayala
    || jadapi satim pucha bahu bha~ti| tadapi na kaheu tripura arati || do satim hridaya anumana kiya
    sabu janeu sarbagya| kinha kapatu maim sambhu sana nari sahaja jara agya || ka || hridaya~ socu samujhata
    nija karani| cinta amita jai nahi barani || kripasindhu siva parama agadha| pragata na kaheu mora
    aparadha || sankara rukha avaloki bhavani| prabhu mohi tajeu hridaya~ akulani || nija agha samujhi
    na kachu kahi jai| tapi ava~ iva ura adhikai || satihi sasoca jani brishaketu| kahim katha sundara
    sukha hetu || baranata pantha bibidha itihasa| bisvanatha pahu~ce kailasa || taha~ puni sambhu samujhi
    pana apana| baithe bata tara kari kamalasana || sankara sahaja sarupa samhara| lagi samadhi akhanda
    apara || do sati basahi kailasa taba adhika socu mana mahim| maramu na kou jana kachu juga sama divasa
    sirahim || || nita nava socu satim ura bhara| kaba jaihu~ dukha sagara para || maim jo kinha raghupati
    apamana| punipati bacanu mrisha kari jana || so phalu mohi bidhata~ dinha| jo kachu ucita raha soi
    kinha || aba bidhi asa bujhia nahi tohi| sankara bimukha jiavasi mohi || kahi na jai kachu hridaya
    galani| mana mahu~ ramahi sumira sayani || jau prabhu dinadayalu kahava| arati harana beda jasu gava
    || tau maim binaya karu~ kara jori| chutu begi deha yaha mori || jaum more siva carana sanehu| mana
    krama bacana satya bratu ehu || do tau sabadarasi sunia prabhu karu so begi upai| hoi maranu jehi
    binahim shrama dusaha bipatti bihai || jalu paya sarisa bikai dekhahu priti ki riti bhali| bilaga
    hoi rasu jai kapata khatai parata puni || kha || ehi bidhi dukhita prajesakumari| akathaniya daruna
    dukhu bhari || bitem sambata sahasa satasi| taji samadhi sambhu abinasi || rama nama siva sumirana
    lage| janeu satim jagatapati jage || jai sambhu pada bandanu kinhi| sanamukha sankara asanu dinha
    || lage kahana harikatha rasala| daccha prajesa bhe tehi kala || dekha bidhi bicari saba layaka| dacchahi
    kinha prajapati nayaka || bara adhikara daccha jaba pava| ati abhimanu hridaya~ taba ava || nahim
    kau asa janama jaga mahim| prabhuta pai jahi mada nahim || do daccha lie muni boli saba karana lage
    bara jaga| nevate sadara sakala sura je pavata makha bhaga || || kinnara naga siddha gandharba| badhunha
    sameta cale sura sarba || bishnu biranci mahesu bihai| cale sakala sura jana banai || satim biloke
    byoma bimana| jata cale sundara bidhi nana || sura sundari karahim kala gana| sunata shravana chutahim
    muni dhyana || pucheu taba siva~ kaheu bakhani| pita jagya suni kachu harashani || jaum mahesu mohi
    ayasu dehim| kucha dina jai rahaum misa ehim || pati parityaga hridaya dukhu bhari| kahi na nija aparadha
    bicari || boli sati manohara bani| bhaya sankoca prema rasa sani || do pita bhavana utsava parama
    jaum prabhu ayasu hoi| tau mai jau~ kripayatana sadara dekhana soi || || kahehu nika morehu~ mana
    bhava| yaha anucita nahim nevata pathava || daccha sakala nija suta bolai| hamarem bayara tumhu bisarai
    || brahmasabha~ hama sana dukhu mana| tehi tem ajahu~ karahim apamana || jaum binu bolem jahu bhavani|
    rahi na silu sanehu na kani || jadapi mitra prabhu pitu gura geha| jaia binu bolehu~ na sa~deha ||
    tadapi birodha mana jaha~ koi| taha~ ge~ kalyanu na hoi || bha~ti aneka sambhu samujhava| bhavi basa
    na gyanu ura ava || kaha prabhu jahu jo binahim bolae~| nahim bhali bata hamare bhae~ || do kahi dekha
    hara jatana bahu rahi na dacchakumari| die mukhya gana sanga taba bida kinha tripurari || || pita
    bhavana jaba gi bhavani| daccha trasa kahu~ na sanamani || sadara bhalehim mili eka mata| bhaginim
    milim bahuta musukata || daccha na kachu puchi kusalata| satihi biloki jare saba gata || satim jai
    dekheu taba jaga| katahu~ na dikha sambhu kara bhaga || taba cita carhaeu jo sankara kaheu| prabhu
    apamanu samujhi ura daheu || pachila dukhu na hridaya~ asa byapa| jasa yaha bhayu maha paritapa ||
    jadyapi jaga daruna dukha nana| saba tem kathina jati avamana || samujhi so satihi bhayu ati krodha|
    bahu bidhi jananim kinha prabodha || do siva apamanu na jai sahi hridaya~ na hoi prabodha| sakala
    sabhahi hathi hataki taba bolim bacana sakrodha || || sunahu sabhasada sakala muninda| kahi suni jinha
    sankara ninda || so phalu turata lahaba saba kahu~| bhali bha~ti pachitaba pitahu~ || santa sambhu
    shripati apabada| sunia jaha~ taha~ asi marajada || katia tasu jibha jo basai| shravana mudi na ta
    calia parai || jagadatama mahesu purari| jagata janaka saba ke hitakari || pita mandamati nindata
    tehi| daccha sukra sambhava yaha dehi || tajihu~ turata deha tehi hetu| ura dhari candramauli brishaketu
    || asa kahi joga agini tanu jara| bhayu sakala makha hahakara || do sati maranu suni sambhu gana lage
    karana makha khisa| jagya bidhamsa biloki bhrigu raccha kinhi munisa || || samacara saba sankara pae|
    birabhadru kari kopa pathae || jagya bidhamsa jai tinha kinha| sakala suranha bidhivata phalu dinha
    || bhe jagabidita daccha gati soi| jasi kachu sambhu bimukha kai hoi || yaha itihasa sakala jaga jani|
    tate maim sanchepa bakhani || satim marata hari sana baru maga| janama janama siva pada anuraga ||
    tehi karana himagiri griha jai| janamim parabati tanu pai || jaba tem uma saila griha jaim| sakala
    siddhi sampati taha~ chai || jaha~ taha~ muninha suashrama kinhe| ucita basa hima bhudhara dinhe ||
    do sada sumana phala sahita saba druma nava nana jati| pragatim sundara saila para mani akara bahu
    bha~ti || || sarita saba punita jalu bahahim| khaga mriga madhupa sukhi saba rahahim || sahaja bayaru
    saba jivanha tyaga| giri para sakala karahim anuraga || soha saila girija griha ae~| jimi janu ramabhagati
    ke pae~ || nita nutana mangala griha tasu| brahmadika gavahim jasu jasu || narada samacara saba pae|
    kautukahim giri geha sidhae || sailaraja bara adara kinha| pada pakhari bara asanu dinha || nari sahita
    muni pada siru nava| carana salila sabu bhavanu sincava || nija saubhagya bahuta giri barana| suta
    boli meli muni carana || do trikalagya sarbagya tumha gati sarbatra tumhari || kahahu suta ke dosha
    guna munibara hridaya~ bicari || || kaha muni bihasi gurha mridu bani| suta tumhari sakala guna khani
    || sundara sahaja susila sayani| nama uma ambika bhavani || saba lacchana sampanna kumari| hoihi santata
    piyahi piari || sada acala ehi kara ahivata| ehi tem jasu paihahim pitu mata || hoihi pujya sakala
    jaga mahim| ehi sevata kachu durlabha nahim || ehi kara namu sumiri samsara| triya carhahahi~ patibrata
    asidhara || saila sulacchana suta tumhari| sunahu je aba avaguna dui cari || aguna amana matu pitu
    hina| udasina saba samsaya china || do jogi jatila akama mana nagana amangala besha || asa svami ehi
    kaha~ milihi pari hasta asi rekha || || suni muni gira satya jiya~ jani| dukha dampatihi uma harashani
    || naradahu~ yaha bhedu na jana| dasa eka samujhaba bilagana || sakala sakhim girija giri maina| pulaka
    sarira bhare jala naina || hoi na mrisha devarishi bhasha| uma so bacanu hridaya~ dhari rakha || upajeu
    siva pada kamala sanehu| milana kathina mana bha sandehu || jani kuavasaru priti durai| sakhi ucha~ga
    baithi puni jai || jhuthi na hoi devarishi bani| socahi dampati sakhim sayani || ura dhari dhira kahi
    girir | kahahu natha ka karia up kaha munisa himavanta sunu jo bidhi likha lilara| deva danuja nara
    naga muni kau na metanihara || || tadapi eka maim kahu~ upai| hoi karai jaum daiu sahai || jasa baru
    maim baraneu~ tumha pahim| milahi umahi tasa samsaya nahim || je je bara ke dosha bakhane| te saba
    siva pahi maim anumane || jaum bibahu sankara sana hoi| doshu guna sama kaha sabu koi || jaum ahi
    seja sayana hari karahim| budha kachu tinha kara doshu na dharahim || bhanu krisanu sarba rasa khahim|
    tinha kaha~ manda kahata kau nahim || subha aru asubha salila saba bahi| surasari kau apunita na kahi
    || samaratha kahu~ nahim doshu gosai| rabi pavaka surasari ki nai || do jaum asa hisisha karahim nara
    jarai bibeka abhimana| parahim kalapa bhari naraka mahu~ jiva ki isa samana || || surasari jala krita
    baruni jana| kabahu~ na santa karahim tehi pana || surasari milem so pavana jaisem| isa anisahi antaru
    taisem || sambhu sahaja samaratha bhagavana| ehi bibaha~ saba bidhi kalyana || duraradhya pai ahahim
    mahesu| asutosha puni kie~ kalesu || jaum tapu karai kumari tumhari| bhaviu meti sakahim tripurari
    || jadyapi bara aneka jaga mahim| ehi kaha~ siva taji dusara nahim || bara dayaka pranatarati bhanjana|
    kripasindhu sevaka mana ranjana || icchita phala binu siva avaradhe| lahia na koti joga japa sadhem
    || do asa kahi narada sumiri hari girijahi dinhi asisa| hoihi yaha kalyana aba samsaya tajahu girisa
    || || kahi asa brahmabhavana muni gayu| agila carita sunahu jasa bhayu || patihi ekanta pai kaha maina|
    natha na maim samujhe muni baina || jaum gharu baru kulu hoi anupa| karia bibahu suta anurupa || na
    ta kanya baru rahu kuari| kanta uma mama pranapiari || jaum na milahi baru girijahi jogu| giri jara
    sahaja kahihi sabu logu || soi bicari pati karehu bibahu| jehim na bahori hoi ura dahu || asa kahi
    pari carana dhari sisa| bole sahita saneha girisa || baru pavaka pragatai sasi mahim| narada bacanu
    anyatha nahim || do priya socu pariharahu sabu sumirahu shribhagavana| parabatihi niramayu jehim soi
    karihi kalyana || || aba jau tumhahi suta para nehu| tau asa jai sikhavana dehu || karai so tapu jehim
    milahim mahesu| ana upaya~ na mitahi kalesu || narada bacana sagarbha sahetu| sundara saba guna nidhi
    brishaketu || asa bicari tumha tajahu asanka| sabahi bha~ti sankaru akalanka || suni pati bacana harashi
    mana mahim| gi turata uthi girija pahim || umahi biloki nayana bhare bari| sahita saneha goda baithari
    || barahim bara leti ura lai| gadagada kantha na kachu kahi jai || jagata matu sarbagya bhavani| matu
    sukhada bolim mridu bani || do sunahi matu maim dikha asa sapana sunavu~ tohi| sundara gaura subiprabara
    asa upadeseu mohi || || karahi jai tapu sailakumari| narada kaha so satya bicari || matu pitahi puni
    yaha mata bhava| tapu sukhaprada dukha dosha nasava || tapabala raci prapanca bidhata| tapabala bishnu
    sakala jaga trata || tapabala sambhu karahim sanghara| tapabala seshu dhari mahibhara || tapa adhara
    saba srishti bhavani| karahi jai tapu asa jiya~ jani || sunata bacana bisamita mahatari| sapana sunayu
    girihi ha~kari || matu pituhi bahubidhi samujhai| calim uma tapa hita harashai || priya parivara pita
    aru mata| bhe bikala mukha ava na bata || do bedasira muni ai taba sabahi kaha samujhai || parabati
    mahima sunata rahe prabodhahi pai || || ura dhari uma pranapati carana| jai bipina lagim tapu karana
    || ati sukumara na tanu tapa jogu| pati pada sumiri tajeu sabu bhogu || nita nava carana upaja anuraga|
    bisari deha tapahim manu laga || sambata sahasa mula phala khae| sagu khai sata barasha gava~e ||
    kachu dina bhojanu bari batasa| kie kathina kachu dina upabasa || bela pati mahi pari sukhai| tini
    sahasa sambata soi khai || puni parihare sukhaneu parana| umahi nama taba bhayu aparana || dekhi umahi
    tapa khina sarira| brahmagira bhai gagana gabhira || do bhayu manoratha suphala tava sunu girijakumari|
    pariharu dusaha kalesa saba aba milihahim tripurari || || asa tapu kahu~ na kinha bhavani| bhu aneka
    dhira muni gyani || aba ura dharahu brahma bara bani| satya sada santata suci jani || avai pita bolavana
    jabahim| hatha parihari ghara jaehu tabahim || milahim tumhahi jaba sapta rishisa| janehu taba pramana
    bagisa || sunata gira bidhi gagana bakhani| pulaka gata girija harashani || uma carita sundara maim
    gava| sunahu sambhu kara carita suhava || jaba tem sati jai tanu tyaga| taba sem siva mana bhayu biraga
    || japahim sada raghunayaka nama| jaha~ taha~ sunahim rama guna grama || do cidananda sukhadhama siva
    bigata moha mada kama| bicarahim mahi dhari hridaya~ hari sakala loka abhirama || || katahu~ muninha
    upadesahim gyana| katahu~ rama guna karahim bakhana || jadapi akama tadapi bhagavana| bhagata biraha
    dukha dukhita sujana || ehi bidhi gayu kalu bahu biti| nita nai hoi rama pada priti || naimu premu
    sankara kara dekha| abicala hridaya~ bhagati kai rekha || pragatai ramu kritagya kripala| rupa sila
    nidhi teja bisala || bahu prakara sankarahi saraha| tumha binu asa bratu ko nirabaha || bahubidhi
    rama sivahi samujhava| parabati kara janmu sunava || ati punita girija kai karani| bistara sahita
    kripanidhi barani || do aba binati mama sunehu siva jaum mo para nija nehu| jai bibahahu sailajahi
    yaha mohi magem dehu || || kaha siva jadapi ucita asa nahim| natha bacana puni meti na jahim || sira
    dhari ayasu karia tumhara| parama dharamu yaha natha hamara || matu pita gura prabhu kai bani| binahim
    bicara karia subha jani || tumha saba bha~ti parama hitakari| agya sira para natha tumhari || prabhu
    tosheu suni sankara bacana| bhakti bibeka dharma juta racana || kaha prabhu hara tumhara pana raheu|
    aba ura rakhehu jo hama kaheu || antaradhana bhe asa bhashi| sankara soi murati ura rakhi || tabahim
    saptarishi siva pahim ae| bole prabhu ati bacana suhae || do parabati pahim jai tumha prema pariccha
    lehu| girihi preri pathehu bhavana duri karehu sandehu || || rishinha gauri dekhi taha~ kaisi| muratimanta
    tapasya jaisi || bole muni sunu sailakumari| karahu kavana karana tapu bhari || kehi avaradhahu ka
    tumha cahahu| hama sana satya maramu kina kahahu || kahata bacata manu ati sakucai| ha~sihahu suni
    hamari jaratai || manu hatha para na suni sikhava| cahata bari para bhiti uthava || narada kaha satya
    soi jana| binu pankhanha hama cahahim uraana || dekhahu muni abibeku hamara| cahia sada sivahi bharatara
    || do sunata bacana bihase rishaya girisambhava taba deha| narada kara upadesu suni kahahu baseu kisu
    geha || || dacchasutanha upadesenhi jai| tinha phiri bhavanu na dekha ai || citraketu kara gharu una
    ghala| kanakakasipu kara puni asa hala || narada sikha je sunahim nara nari| avasi hohim taji bhavanu
    bhikhari || mana kapati tana sajjana cinha| apu sarisa sabahi caha kinha || tehi kem bacana mani bisvasa|
    tumha cahahu pati sahaja udasa || nirguna nilaja kubesha kapali| akula ageha digambara byali || kahahu
    kavana sukhu asa baru pae~| bhala bhulihu thaga ke baurae~ || panca kahem siva~ sati bibahi| puni
    avaderi maraenhi tahi || do aba sukha sovata socu nahi bhikha magi bhava khahim| sahaja ekakinha ke
    bhavana kabahu~ ki nari khatahim || || ajahu~ manahu kaha hamara| hama tumha kahu~ baru nika bicara
    || ati sundara suci sukhada susila| gavahim beda jasu jasa lila || dushana rahita sakala guna rasi|
    shripati pura baikuntha nivasi || asa baru tumhahi milauba ani| sunata bihasi kaha bacana bhavani
    || satya kahehu giribhava tanu eha| hatha na chuta chutai baru deha || kanaku puni pashana tem hoi|
    jarehu~ sahaju na parihara soi || narada bacana na maim pariharu~| basu bhavanu ujaru nahim daru~
    || gura kem bacana pratiti na jehi| sapanehu~ sugama na sukha sidhi tehi || do mahadeva avaguna bhavana
    bishnu sakala guna dhama| jehi kara manu rama jahi sana tehi tehi sana kama || || jaum tumha milatehu
    prathama munisa| sunatiu~ sikha tumhari dhari sisa || aba maim janmu sambhu hita hara| ko guna dushana
    karai bicara || jaum tumhare hatha hridaya~ biseshi| rahi na jai binu kie~ bareshi || tau kautukianha
    alasu nahim| bara kanya aneka jaga mahim || janma koti lagi ragara hamari| baru~ sambhu na ta rahu~
    kuari || taju~ na narada kara upadesu| apu kahahi sata bara mahesu || maim pa paru~ kahi jagadamba|
    tumha griha gavanahu bhayu bilamba || dekhi premu bole muni gyani| jaya jaya jagadambike bhavani ||
    do tumha maya bhagavana siva sakala jagata pitu matu| nai carana sira muni cale puni puni harashata
    gatu || || jai muninha himavantu pathae| kari binati girajahim griha lyae || bahuri saptarishi siva
    pahim jai| katha uma kai sakala sunai || bhe magana siva sunata saneha| harashi saptarishi gavane
    geha || manu thira kari taba sambhu sujana| lage karana raghunayaka dhyana || taraku asura bhayu tehi
    kala| bhuja pratapa bala teja bisala || temhi saba loka lokapati jite| bhe deva sukha sampati rite
    || ajara amara so jiti na jai| hare sura kari bibidha larai || taba biranci sana jai pukare| dekhe
    bidhi saba deva dukhare || do saba sana kaha bujhai bidhi danuja nidhana taba hoi| sambhu sukra sambhuta
    suta ehi jiti rana soi || || mora kaha suni karahu upai| hoihi isvara karihi sahai || satim jo taji
    daccha makha deha| janami jai himacala geha || tehim tapu kinha sambhu pati lagi| siva samadhi baithe
    sabu tyagi || jadapi ahi asamanjasa bhari| tadapi bata eka sunahu hamari || pathavahu kamu jai siva
    pahim| karai chobhu sankara mana mahim || taba hama jai sivahi sira nai| karavauba bibahu bariai ||
    ehi bidhi bhalehi devahita hoi| mara ati nika kahi sabu koi || astuti suranha kinhi ati hetu| pragateu
    bishamabana jhashaketu || do suranha kahim nija bipati saba suni mana kinha bicara| sambhu birodha
    na kusala mohi bihasi kaheu asa mara || || tadapi karaba maim kaju tumhara| shruti kaha parama dharama
    upakara || para hita lagi taji jo dehi| santata santa prasamsahim tehi || asa kahi caleu sabahi siru
    nai| sumana dhanusha kara sahita sahai || calata mara asa hridaya~ bicara| siva birodha dhruva maranu
    hamara || taba apana prabhau bistara| nija basa kinha sakala samsara || kopeu jabahi baricaraketu|
    chana mahu~ mite sakala shruti setu || brahmacarja brata sanjama nana| dhiraja dharama gyana bigyana
    || sadacara japa joga biraga| sabhaya bibeka kataku saba bhaga || cham bhageu bibeka sahaya sahita
    so subhata sanjuga mahi mure| sadagrantha parbata kandaranhi mahu~ jai tehi avasara dure || honihara
    ka karatara ko rakhavara jaga kharabharu para| dui matha kehi ratinatha jehi kahu~ ko''pi kara dhanu
    saru dhara || do je sajiva jaga acara cara nari purusha asa nama| te nija nija marajada taji bhe sakala
    basa kama || || saba ke hridaya~ madana abhilasha| lata nihari navahim taru sakha || nadim umagi ambudhi
    kahu~ dhai| sangama karahim talava talai || jaha~ asi dasa jaranha kai barani| ko kahi saki sacetana
    karani || pasu pacchi nabha jala thalacari| bhe kamabasa samaya bisari || madana andha byakula saba
    loka| nisi dinu nahim avalokahim koka || deva danuja nara kinnara byala| preta pisaca bhuta betala
    || inha kai dasa na kaheu~ bakhani| sada kama ke cere jani || siddha birakta mahamuni jogi| tepi kamabasa
    bhe biyogi || cham bhe kamabasa jogisa tapasa pava~ranhi ki ko kahai| dekhahim caracara narimaya je
    brahmamaya dekhata rahe || abala bilokahim purushamaya jagu purusha saba abalamayam| dui danda bhari
    brahmanda bhitara kamakrita kautuka ayam || so dhari na kahu~ dhira sabake mana manasija hare| je
    rakhe raghubira te ubare tehi kala mahu~ || || ubhaya ghari asa kautuka bhayu| jau lagi kamu sambhu
    pahim gayu || sivahi biloki sasankeu maru| bhayu jathathiti sabu samsaru || bhe turata saba jiva sukhare|
    jimi mada utari ge~ matavare || rudrahi dekhi madana bhaya mana| duradharasha durgama bhagavana ||
    phirata laja kachu kari nahim jai| maranu thani mana racesi upai || pragatesi turata rucira rituraja|
    kusumita nava taru raji biraja || bana upabana bapika taraaga| parama subhaga saba disa bibhaga ||
    jaha~ taha~ janu umagata anuraga| dekhi muehu~ mana manasija jaga || cham jagi manobhava muehu~ mana
    bana subhagata na parai kahi| sitala sugandha sumanda maruta madana anala sakha sahi || bikase saranhi
    bahu kanja gunjata punja manjula madhukara| kalahamsa pika suka sarasa rava kari gana nacahim apachara
    || do sakala kala kari koti bidhi hareu sena sameta| cali na acala samadhi siva kopeu hridayaniketa
    || || dekhi rasala bitapa bara sakha| tehi para carhaeu madanu mana makha || sumana capa nija sara
    sandhane| ati risa taki shravana lagi tane || charae bishama bisikha ura lage| chuti samadhi sambhu
    taba jage || bhayu isa mana chobhu biseshi| nayana ughari sakala disi dekhi || saurabha pallava madanu
    biloka| bhayu kopu kampeu trailoka || taba siva~ tisara nayana ughara| citavata kamu bhayu jari chara
    || hahakara bhayu jaga bhari| darape sura bhe asura sukhari || samujhi kamasukhu socahim bhogi| bhe
    akantaka sadhaka jogi || cham jogi akantaka bhe pati gati sunata rati muruchita bhi| rodati badati
    bahu bha~ti karuna karati sankara pahim gi| ati prema kari binati bibidha bidhi jori kara sanmukha
    rahi| prabhu asutosha kripala siva abala nirakhi bole sahi || do aba tem rati tava natha kara hoihi
    namu anangu| binu bapu byapihi sabahi puni sunu nija milana prasangu || || jaba jadubamsa krishna
    avatara| hoihi harana maha mahibhara || krishna tanaya hoihi pati tora| bacanu anyatha hoi na mora
    || rati gavani suni sankara bani| katha apara aba kahu~ bakhani || devanha samacara saba pae| brahmadika
    baikuntha sidhae || saba sura bishnu biranci sameta| ge jaha~ siva kripaniketa || prithaka prithaka
    tinha kinhi prasamsa| bhe prasanna candra avatamsa || bole kripasindhu brishaketu| kahahu amara ae
    kehi hetu || kaha bidhi tumha prabhu antarajami| tadapi bhagati basa binavu~ svami || do sakala suranha
    ke hridaya~ asa sankara parama uchahu| nija nayananhi dekha cahahim natha tumhara bibahu || || yaha
    utsava dekhia bhari locana| soi kachu karahu madana mada mocana| kamu jari rati kahu~ baru dinha|
    kripasindhu yaha ati bhala kinha || sasati kari puni karahim pas | natha prabhunha kara sahaja subh
    || parabatim tapu kinha apara| karahu tasu aba angikara || suni bidhi binaya samujhi prabhu bani|
    aisei hau kaha sukhu mani || taba devanha dundubhim bajaim| barashi sumana jaya jaya sura sai || avasaru
    jani saptarishi ae| turatahim bidhi giribhavana pathae || prathama ge jaha~ rahi bhavani| bole madhura
    bacana chala sani || do kaha hamara na sunehu taba narada kem upadesa| aba bha jhutha tumhara pana
    jareu kamu mahesa || tisara vishrama suni bolim musakai bhavani| ucita kahehu munibara bigyani ||
    tumharem jana kamu aba jara| aba lagi sambhu rahe sabikara || hamarem jana sada siva jogi| aja anavadya
    akama abhogi || jaum maim siva seye asa jani| priti sameta karma mana bani || tau hamara pana sunahu
    munisa| karihahim satya kripanidhi isa || tumha jo kaha hara jareu mara| soi ati bara abibeku tumhara
    || tata anala kara sahaja subh | hima tehi nikata jai nahim k || ge~ samipa so avasi nasai| asi manmatha
    mahesa ki nai || do hiya~ harashe muni bacana suni dekhi priti bisvasa || cale bhavanihi nai sira
    ge himacala pasa || || sabu prasangu giripatihi sunava| madana dahana suni ati dukhu pava || bahuri
    kaheu rati kara baradana| suni himavanta bahuta sukhu mana || hridaya~ bicari sambhu prabhutai| sadara
    munibara lie bolai || sudinu sunakhatu sughari socai| begi bedabidhi lagana dharai || patri saptarishinha
    soi dinhi| gahi pada binaya himacala kinhi || jai bidhihi dinhi so pati| bacata priti na hridaya~
    samati || lagana baci aja sabahi sunai| harashe muni saba sura samudai || sumana brishti nabha bajana
    baje| mangala kalasa dasahu~ disi saje || do lage sa~varana sakala sura bahana bibidha bimana| hohi
    saguna mangala subhada karahim apachara gana || || sivahi sambhu gana karahim singara| jata mukuta
    ahi mauru sa~vara || kundala kankana pahire byala| tana bibhuti pata kehari chala || sasi lalata sundara
    sira ganga| nayana tini upabita bhujanga || garala kantha ura nara sira mala| asiva besha sivadhama
    kripala || kara trisula aru damaru biraja| cale basaha~ carhai bajahim baja || dekhi sivahi suratriya
    musukahim| bara layaka dulahini jaga nahim || bishnu biranci adi surabrata| carhai carhai bahana cale
    barata || sura samaja saba bha~ti anupa| nahim barata dulaha anurupa || do bishnu kaha asa bihasi
    taba boli sakala disiraja| bilaga bilaga hoi calahu saba nija nija sahita samaja || || bara anuhari
    barata na bhai| ha~si karaihahu para pura jai || bishnu bacana suni sura musakane| nija nija sena
    sahita bilagane || manahim mana mahesu musukahim| hari ke bingya bacana nahim jahim || ati priya bacana
    sunata priya kere| bhringihi preri sakala gana tere || siva anusasana suni saba ae| prabhu pada jalaja
    sisa tinha nae || nana bahana nana besha| bihase siva samaja nija dekha || kau mukhahina bipula mukha
    kahu| binu pada kara kau bahu pada bahu || bipula nayana kau nayana bihina| rishtapushta kau ati tanakhina
    || cham tana khina kau ati pina pavana kau apavana gati dharem| bhushana karala kapala kara saba sadya
    sonita tana bharem || khara svana suara srikala mukha gana besha aganita ko ganai| bahu jinasa preta
    pisaca jogi jamata baranata nahim banai || so nacahim gavahim gita parama tarangi bhuta saba| dekhata
    ati biparita bolahim bacana bicitra bidhi || || jasa dulahu tasi bani barata| kautuka bibidha hohim
    maga jata || iha~ himacala raceu bitana| ati bicitra nahim jai bakhana || saila sakala jaha~ lagi
    jaga mahim| laghu bisala nahim barani sirahim || bana sagara saba nadim talava| himagiri saba kahu~
    nevata pathava || kamarupa sundara tana dhari| sahita samaja sahita bara nari || ge sakala tuhinacala
    geha| gavahim mangala sahita saneha || prathamahim giri bahu griha sa~varae| jathajogu taha~ taha~
    saba chae || pura sobha avaloki suhai| lagi laghu biranci nipunai || cham laghu laga bidhi ki nipunata
    avaloki pura sobha sahi| bana baga kupa taraaga sarita subhaga saba saka ko kahi || mangala bipula
    torana pataka ketu griha griha sohahim || banita purusha sundara catura chabi dekhi muni mana mohahim
    || do jagadamba jaha~ avatari so puru barani ki jai| riddhi siddhi sampatti sukha nita nutana adhikai
    || || nagara nikata barata suni ai| pura kharabharu sobha adhikai || kari banava saji bahana nana|
    cale lena sadara agavana || hiya~ harashe sura sena nihari| harihi dekhi ati bhe sukhari || siva samaja
    jaba dekhana lage| bidari cale bahana saba bhage || dhari dhiraju taha~ rahe sayane| balaka saba lai
    jiva parane || ge~ bhavana puchahim pitu mata| kahahim bacana bhaya kampita gata || kahia kaha kahi
    jai na bata| jama kara dhara kidhaum bariata || baru bauraha basaha~ asavara| byala kapala bibhushana
    chara || cham tana chara byala kapala bhushana nagana jatila bhayankara| sa~ga bhuta preta pisaca
    jogini bikata mukha rajanicara || jo jiata rahihi barata dekhata punya bara tehi kara sahi| dekhihi
    so uma bibahu ghara ghara bata asi larikanha kahi || do samujhi mahesa samaja saba janani janaka musukahim|
    bala bujhae bibidha bidhi nidara hohu daru nahim || || lai agavana baratahi ae| die sabahi janavasa
    suhae || maina~ subha arati sa~vari| sanga sumangala gavahim nari || kancana thara soha bara pani|
    parichana cali harahi harashani || bikata besha rudrahi jaba dekha| abalanha ura bhaya bhayu bisesha
    || bhagi bhavana paithim ati trasa| ge mahesu jaha~ janavasa || maina hridaya~ bhayu dukhu bhari|
    linhi boli girisakumari || adhika saneha~ goda baithari| syama saroja nayana bhare bari || jehim bidhi
    tumhahi rupu asa dinha| tehim jara baru baura kasa kinha || cham kasa kinha baru bauraha bidhi jehim
    tumhahi sundarata di| jo phalu cahia surataruhim so barabasa baburahim lagi || tumha sahita giri tem
    giraum pavaka jaraum jalanidhi mahu~ paraum || gharu jau apajasu hau jaga jivata bibahu na haum karaum
    || do bhi bikala abala sakala dukhita dekhi girinari| kari bilapu rodati badati suta sanehu sa~bhari
    || || narada kara maim kaha bigara| bhavanu mora jinha basata ujara || asa upadesu umahi jinha dinha|
    baure barahi lagi tapu kinha || sacehu~ unha ke moha na maya| udasina dhanu dhamu na jaya || para
    ghara ghalaka laja na bhira| bajha~ ki jana prasava kaim pira || jananihi bikala biloki bhavani| boli
    juta bibeka mridu bani || asa bicari socahi mati mata| so na tari jo raci bidhata || karama likha
    jau baura nahu| tau kata dosu lagaia kahu || tumha sana mitahim ki bidhi ke anka| matu byartha jani
    lehu kalanka || cham jani lehu matu kalanku karuna pariharahu avasara nahim| dukhu sukhu jo likha
    lilara hamarem jaba jaha~ pauba tahim || suni uma bacana binita komala sakala abala socahim || bahu
    bha~ti bidhihi lagai dushana nayana bari bimocahim || do tehi avasara narada sahita aru rishi sapta
    sameta| samacara suni tuhinagiri gavane turata niketa || || taba narada sabahi samujhava| puruba kathaprasangu
    sunava || mayana satya sunahu mama bani| jagadamba tava suta bhavani || aja anadi sakti abinasini|
    sada sambhu aradhanga nivasini || jaga sambhava palana laya karini| nija iccha lila bapu dharini ||
    janamim prathama daccha griha jai| namu sati sundara tanu pai || taha~hu~ sati sankarahi bibahim|
    katha prasiddha sakala jaga mahim || eka bara avata siva sanga| dekheu raghukula kamala patanga ||
    bhayu mohu siva kaha na kinha| bhrama basa beshu siya kara linha || cham siya beshu sati jo kinha
    tehi aparadha sankara pariharim| hara biraha~ jai bahori pitu kem jagya joganala jarim || aba janami
    tumhare bhavana nija pati lagi daruna tapu kiya| asa jani samsaya tajahu girija sarbada sankara priya
    || do suni narada ke bacana taba saba kara mita bishada| chana mahu~ byapeu sakala pura ghara ghara
    yaha sambada || || taba mayana himavantu anande| puni puni parabati pada bande || nari purusha sisu
    juba sayane| nagara loga saba ati harashane || lage hona pura mangalagana| saje sabahi hataka ghata
    nana || bha~ti aneka bhi jevarana| supasastra jasa kachu byavahara || so jevanara ki jai bakhani|
    basahim bhavana jehim matu bhavani || sadara bole sakala barati| bishnu biranci deva saba jati ||
    bibidhi pa~ti baithi jevanara| lage parusana nipuna suara || naribrinda sura jeva~ta jani| lagim dena
    garim mridu bani || cham garim madhura svara dehim sundari bingya bacana sunavahim| bhojanu karahim
    sura ati bilambu binodu suni sacu pavahim || jeva~ta jo barhayo anandu so mukha kotihu~ na parai kahyo|
    acava~i dinhe pana gavane basa jaha~ jako rahyo || do bahuri muninha himavanta kahu~ lagana sunai
    ai| samaya biloki bibaha kara pathe deva bolai || || boli sakala sura sadara linhe| sabahi jathocita
    asana dinhe || bedi beda bidhana sa~vari| subhaga sumangala gavahim nari || singhasanu ati dibya suhava|
    jai na barani biranci banava || baithe siva bipranha siru nai| hridaya~ sumiri nija prabhu raghurai
    || bahuri munisanha uma bolai| kari singaru sakhim lai ai || dekhata rupu sakala sura mohe| baranai
    chabi asa jaga kabi ko hai || jagadambika jani bhava bhama| suranha manahim mana kinha pranama ||
    sundarata marajada bhavani| jai na kotihu~ badana bakhani || cham kotihu~ badana nahim banai baranata
    jaga janani sobha maha| sakucahim kahata shruti sesha sarada mandamati tulasi kaha || chabikhani matu
    bhavani gavani madhya mandapa siva jaha~ || avaloki sakahim na sakuca pati pada kamala manu madhukaru
    taha~ || do muni anusasana ganapatihi pujeu sambhu bhavani| kau suni samsaya karai jani sura anadi
    jiya~ jani || || jasi bibaha kai bidhi shruti gai| mahamuninha so saba karavai || gahi girisa kusa
    kanya pani| bhavahi samarapim jani bhavani || panigrahana jaba kinha mahesa| himya~ harashe taba sakala
    suresa || beda mantra munibara uccarahim| jaya jaya jaya sankara sura karahim || bajahim bajana bibidha
    bidhana| sumanabrishti nabha bhai bidhi nana || hara girija kara bhayu bibahu| sakala bhuvana bhari
    raha uchahu || dasim dasa turaga ratha naga| dhenu basana mani bastu bibhaga || anna kanakabhajana
    bhari jana| daija dinha na jai bakhana || cham daija diyo bahu bha~ti puni kara jori himabhudhara
    kahyo| ka deu~ puranakama sankara carana pankaja gahi rahyo || siva~ kripasagara sasura kara santoshu
    saba bha~tihim kiyo| puni gahe pada pathoja mayana~ prema paripurana hiyo || do natha uma mana prana
    sama grihakinkari karehu| chamehu sakala aparadha aba hoi prasanna baru dehu || || bahu bidhi sambhu
    sasa samujhai| gavani bhavana carana siru nai || jananim uma boli taba linhi| lai uchanga sundara
    sikha dinhi || karehu sada sankara pada puja| naridharamu pati deu na duja || bacana kahata bhare
    locana bari| bahuri lai ura linhi kumari || kata bidhi srijim nari jaga mahim| paradhina sapanehu~
    sukhu nahim || bhai ati prema bikala mahatari| dhiraju kinha kusamaya bicari || puni puni milati parati
    gahi carana| parama prema kachu jai na barana || saba narinha mili bheti bhavani| jai janani ura puni
    lapatani || cham jananihi bahuri mili cali ucita asisa saba kahu~ dim| phiri phiri bilokati matu tana
    taba sakhim lai siva pahim gi || jacaka sakala santoshi sankaru uma sahita bhavana cale| saba amara
    harashe sumana barashi nisana nabha baje bhale || do cale sanga himavantu taba pahu~cavana ati hetu|
    bibidha bha~ti paritoshu kari bida kinha brishaketu || || turata bhavana ae girirai| sakala saila
    sara lie bolai || adara dana binaya bahumana| saba kara bida kinha himavana || jabahim sambhu kailasahim
    ae| sura saba nija nija loka sidhae || jagata matu pitu sambhu bhavani| tehi singaru na kahu~ bakhani
    || karahim bibidha bidhi bhoga bilasa| gananha sameta basahim kailasa || hara girija bihara nita nayu|
    ehi bidhi bipula kala cali gayu || taba janameu shatabadana kumara| taraku asura samara jehim mara
    || agama nigama prasiddha purana| shanmukha janmu sakala jaga jana || cham jagu jana shanmukha janmu
    karmu pratapu purusharathu maha| tehi hetu maim brishaketu suta kara carita sanchepahim kaha || yaha
    uma sangu bibahu je nara nari kahahim je gavahim| kalyana kaja bibaha mangala sarbada sukhu pavahim
    || do carita sindhu girija ramana beda na pavahim paru| baranai tulasidasu kimi ati matimanda gava~ru
    || || sambhu carita suni sarasa suhava| bharadvaja muni ati sukha pava || bahu lalasa katha para barhai|
    nayananhi niru romavali tharhai || prema bibasa mukha ava na bani| dasa dekhi harashe muni gyani ||
    aho dhanya tava janmu munisa| tumhahi prana sama priya gaurisa || siva pada kamala jinhahi rati nahim|
    ramahi te sapanehu~ na sohahim || binu chala bisvanatha pada nehu| rama bhagata kara lacchana ehu
    || siva sama ko raghupati bratadhari| binu agha taji sati asi nari || panu kari raghupati bhagati
    dekhai| ko siva sama ramahi priya bhai || do prathamahim mai kahi siva carita bujha maramu tumhara|
    suci sevaka tumha rama ke rahita samasta bikara || || maim jana tumhara guna sila| kahu~ sunahu aba
    raghupati lila || sunu muni aju samagama torem| kahi na jai jasa sukhu mana morem || rama carita ati
    amita munisa| kahi na sakahim sata koti ahisa || tadapi jathashruta kahu~ bakhani| sumiri girapati
    prabhu dhanupani || sarada darunari sama svami| ramu sutradhara antarajami || jehi para kripa karahim
    janu jani| kabi ura ajira nacavahim bani || pranavu~ soi kripala raghunatha| baranu~ bisada tasu guna
    gatha || parama ramya giribaru kailasu| sada jaha~ siva uma nivasu || do siddha tapodhana jogijana
    sura kinnara munibrinda| basahim taha~ sukriti sakala sevahim siba sukhakanda || || hari hara bimukha
    dharma rati nahim| te nara taha~ sapanehu~ nahim jahim || tehi giri para bata bitapa bisala| nita
    nutana sundara saba kala || tribidha samira susitali chaya| siva bishrama bitapa shruti gaya || eka
    bara tehi tara prabhu gayu| taru biloki ura ati sukhu bhayu || nija kara dasi nagaripu chala| baithai
    sahajahim sambhu kripala || kunda indu dara gaura sarira| bhuja pralamba paridhana municira || taruna
    aruna ambuja sama carana| nakha duti bhagata hridaya tama harana || bhujaga bhuti bhushana tripurari|
    ananu sarada canda chabi hari || do jata mukuta surasarita sira locana nalina bisala| nilakantha lavanyanidhi
    soha balabidhu bhala || || baithe soha kamaripu kaisem| dharem sariru santarasu jaisem || parabati
    bhala avasaru jani| gi sambhu pahim matu bhavani || jani priya adaru ati kinha| bama bhaga asanu hara
    dinha || baithim siva samipa harashai| puruba janma katha cita ai || pati hiya~ hetu adhika anumani|
    bihasi uma bolim priya bani || katha jo sakala loka hitakari| soi puchana caha sailakumari || bisvanatha
    mama natha purari| tribhuvana mahima bidita tumhari || cara aru acara naga nara deva| sakala karahim
    pada pankaja seva || do prabhu samaratha sarbagya siva sakala kala guna dhama || joga gyana bairagya
    nidhi pranata kalapataru nama || || jaum mo para prasanna sukharasi| jania satya mohi nija dasi ||
    taum prabhu harahu mora agyana| kahi raghunatha katha bidhi nana || jasu bhavanu surataru tara hoi|
    sahi ki daridra janita dukhu soi || sasibhushana asa hridaya~ bicari| harahu natha mama mati bhrama
    bhari || prabhu je muni paramarathabadi| kahahim rama kahu~ brahma anadi || sesa sarada beda purana|
    sakala karahim raghupati guna gana || tumha puni rama rama dina rati| sadara japahu ana~ga arati ||
    ramu so avadha nripati suta soi| ki aja aguna alakhagati koi || do jaum nripa tanaya ta brahma kimi
    nari biraha~ mati bhori| dekha carita mahima sunata bhramati buddhi ati mori || || jaum aniha byapaka
    bibhu kou| kabahu bujhai natha mohi sou || agya jani risa ura jani dharahu| jehi bidhi moha mitai
    soi karahu || mai bana dikhi rama prabhutai| ati bhaya bikala na tumhahi sunai || tadapi malina mana
    bodhu na ava| so phalu bhali bha~ti hama pava || ajahu~ kachu samsu mana more| karahu kripa binavu~
    kara jorem || prabhu taba mohi bahu bha~ti prabodha| natha so samujhi karahu jani krodha || taba kara
    asa bimoha aba nahim| ramakatha para ruci mana mahim || kahahu punita rama guna gatha| bhujagaraja
    bhushana suranatha || do bandu pada dhari dharani siru binaya karu~ kara jori| baranahu raghubara
    bisada jasu shruti siddhanta nicori || || jadapi joshita nahim adhikari| dasi mana krama bacana tumhari
    || gurhau tattva na sadhu duravahim| arata adhikari jaha~ pavahim || ati arati puchu~ suraraya| raghupati
    katha kahahu kari daya || prathama so karana kahahu bicari| nirguna brahma saguna bapu dhari || puni
    prabhu kahahu rama avatara| balacarita puni kahahu udara || kahahu jatha janaki bibahim| raja taja
    so dushana kahim || bana basi kinhe carita apara| kahahu natha jimi ravana mara || raja baithi kinhim
    bahu lila| sakala kahahu sankara sukhalila || do bahuri kahahu karunayatana kinha jo acaraja rama|
    praja sahita raghubamsamani kimi gavane nija dhama || || puni prabhu kahahu so tattva bakhani| jehim
    bigyana magana muni gyani || bhagati gyana bigyana biraga| puni saba baranahu sahita bibhaga || auru
    rama rahasya aneka| kahahu natha ati bimala bibeka || jo prabhu maim pucha nahi hoi| sau dayala rakhahu
    jani goi || tumha tribhuvana gura beda bakhana| ana jiva pa~vara ka jana || prasna uma kai sahaja
    suhai| chala bihina suni siva mana bhai || hara hiya~ ramacarita saba ae| prema pulaka locana jala
    chae || shriraghunatha rupa ura ava| paramananda amita sukha pava || do magana dhyanarasa danda juga
    puni mana bahera kinha| raghupati carita mahesa taba harashita baranai linha || || jhutheu satya jahi
    binu janem| jimi bhujanga binu raju pahicanem || jehi janem jaga jai herai| jagem jatha sapana bhrama
    jai || bandu~ balarupa soi ramu| saba sidhi sulabha japata jisu namu || mangala bhavana amangala hari|
    dravu so dasaratha ajira bihari || kari pranama ramahi tripurari| harashi sudha sama gira ucari ||
    dhanya dhanya girirajakumari| tumha samana nahim kau upakari || pu~chehu raghupati katha prasanga|
    sakala loka jaga pavani ganga || tumha raghubira carana anuragi| kinhahu prasna jagata hita lagi ||
    do ramakripa tem parabati sapanehu~ tava mana mahim| soka moha sandeha bhrama mama bicara kachu nahim
    || || tadapi asanka kinhihu soi| kahata sunata saba kara hita hoi || jinha hari katha suni nahim kana|
    shravana randhra ahibhavana samana || nayananhi santa darasa nahim dekha| locana morapankha kara lekha
    || te sira katu tumbari samatula| je na namata hari gura pada mula || jinha haribhagati hridaya~ nahim
    ani| jivata sava samana tei prani || jo nahim kari rama guna gana| jiha so dadura jiha samana || kulisa
    kathora nithura soi chati| suni haricarita na jo harashati || girija sunahu rama kai lila| sura hita
    danuja bimohanasila || do ramakatha suradhenu sama sevata saba sukha dani| satasamaja suraloka saba
    ko na sunai asa jani || || ramakatha sundara kara tari| samsaya bihaga udavanihari || ramakatha kali
    bitapa kuthari| sadara sunu girirajakumari || rama nama guna carita suhae| janama karama aganita shruti
    gae || jatha ananta rama bhagavana| tatha katha kirati guna nana || tadapi jatha shruta jasi mati
    mori| kahihu~ dekhi priti ati tori || uma prasna tava sahaja suhai| sukhada santasammata mohi bhai
    || eka bata nahi mohi sohani| jadapi moha basa kahehu bhavani || tuma jo kaha rama kau ana| jehi shruti
    gava dharahim muni dhyana || do kahahi sunahi asa adhama nara grase je moha pisaca| pashandi hari
    pada bimukha janahim jhutha na saca || || agya akobida andha abhagi| kai bishaya mukara mana lagi
    || lampata kapati kutila biseshi| sapanehu~ santasabha nahim dekhi || kahahim te beda asammata bani|
    jinha kem sujha labhu nahim hani || mukara malina aru nayana bihina| rama rupa dekhahim kimi dina
    || jinha kem aguna na saguna bibeka| jalpahim kalpita bacana aneka || harimaya basa jagata bhramahim|
    tinhahi kahata kachu aghatita nahim || batula bhuta bibasa matavare| te nahim bolahim bacana bicare
    || jinha krita mahamoha mada pana| tin kara kaha karia nahim kana || so asa nija hridaya~ bicari taju
    samsaya bhaju rama pada| sunu giriraja kumari bhrama tama rabi kara bacana mama || || sagunahi agunahi
    nahim kachu bheda| gavahim muni purana budha beda || aguna arupa alakha aja joi| bhagata prema basa
    saguna so hoi || jo guna rahita saguna soi kaisem| jalu hima upala bilaga nahim jaisem || jasu nama
    bhrama timira patanga| tehi kimi kahia bimoha prasanga || rama saccidananda dinesa| nahim taha~ moha
    nisa lavalesa || sahaja prakasarupa bhagavana| nahim taha~ puni bigyana bihana || harasha bishada
    gyana agyana| jiva dharma ahamiti abhimana || rama brahma byapaka jaga jana| paramananda paresa purana
    || do purusha prasiddha prakasa nidhi pragata paravara natha || raghukulamani mama svami soi kahi
    siva~ nayu matha || || nija bhrama nahim samujhahim agyani| prabhu para moha dharahim jara prani ||
    jatha gagana ghana patala nihari| jha~peu manu kahahim kubicari || citava jo locana anguli lae~| pragata
    jugala sasi tehi ke bhae~ || uma rama bishika asa moha| nabha tama dhuma dhuri jimi soha || bishaya
    karana sura jiva sameta| sakala eka tem eka saceta || saba kara parama prakasaka joi| rama anadi avadhapati
    soi || jagata prakasya prakasaka ramu| mayadhisa gyana guna dhamu || jasu satyata tem jada maya| bhasa
    satya iva moha sahaya || do rajata sipa mahu~ masa jimi jatha bhanu kara bari| jadapi mrisha tihu~
    kala soi bhrama na saki kau tari || || ehi bidhi jaga hari ashrita rahi| jadapi asatya deta dukha
    ahi || jaum sapanem sira katai koi| binu jagem na duri dukha hoi || jasu kripa~ asa bhrama miti jai|
    girija soi kripala raghurai || adi anta kau jasu na pava| mati anumani nigama asa gava || binu pada
    cali suni binu kana| kara binu karama kari bidhi nana || anana rahita sakala rasa bhogi| binu bani
    bakata bara jogi || tanu binu parasa nayana binu dekha| grahi ghrana binu basa asesha || asi saba
    bha~ti alaukika karani| mahima jasu jai nahim barani || do jehi imi gavahi beda budha jahi dharahim
    muni dhyana || soi dasaratha suta bhagata hita kosalapati bhagavana || || kasim marata jantu avaloki|
    jasu nama bala karu~ bisoki || soi prabhu mora caracara svami| raghubara saba ura antarajami || bibasahu~
    jasu nama nara kahahim| janama aneka racita agha dahahim || sadara sumirana je nara karahim| bhava
    baridhi gopada iva tarahim || rama so paramatama bhavani| taha~ bhrama ati abihita tava bani || asa
    samsaya anata ura mahim| gyana biraga sakala guna jahim || suni siva ke bhrama bhanjana bacana| miti
    gai saba kutaraka kai racana || bhi raghupati pada priti pratiti| daruna asambhavana biti || do puni
    puni prabhu pada kamala gahi jori pankaruha pani| boli girija bacana bara manahu~ prema rasa sani
    || || sasi kara sama suni gira tumhari| mita moha saradatapa bhari || tumha kripala sabu samsu hareu|
    rama svarupa jani mohi pareu || natha kripa~ aba gayu bishada| sukhi bhayu~ prabhu carana prasada
    || aba mohi apani kinkari jani| jadapi sahaja jada nari ayani || prathama jo maim pucha soi kahahu|
    jaum mo para prasanna prabhu ahahu || rama brahma cinamaya abinasi| sarba rahita saba ura pura basi
    || natha dhareu naratanu kehi hetu| mohi samujhai kahahu brishaketu || uma bacana suni parama binita|
    ramakatha para priti punita || do hi~ya~ harashe kamari taba sankara sahaja sujana bahu bidhi umahi
    prasamsi puni bole kripanidhana || pahala vishrama masaparayana sunu subha katha bhavani ramacaritamanasa
    bimala| kaha bhusundi bakhani suna bihaga nayaka garuda || || so sambada udara jehi bidhi bha agem
    kahaba| sunahu rama avatara carita parama sundara anagha || || hari guna nama apara katha rupa aganita
    amita| maim nija mati anusara kahu~ uma sadara sunahu || gha || sunu girija haricarita suhae| bipula
    bisada nigamagama gae || hari avatara hetu jehi hoi| idamittham kahi jai na soi || rama atarkya buddhi
    mana bani| mata hamara asa sunahi sayani || tadapi santa muni beda purana| jasa kachu kahahim svamati
    anumana || tasa maim sumukhi sunavu~ tohi| samujhi pari jasa karana mohi || jaba jaba hoi dharama
    kai hani| badhahim asura adhama abhimani || karahim aniti jai nahim barani| sidahim bipra dhenu sura
    dharani || taba taba prabhu dhari bibidha sarira| harahi kripanidhi sajjana pira || do asura mari
    thapahim suranha rakhahim nija shruti setu| jaga bistarahim bisada jasa rama janma kara hetu || ||
    soi jasa gai bhagata bhava tarahim| kripasindhu jana hita tanu dharahim || rama janama ke hetu aneka|
    parama bicitra eka tem eka || janama eka dui kahu~ bakhani| savadhana sunu sumati bhavani || dvarapala
    hari ke priya dou| jaya aru bijaya jana saba kou || bipra shrapa tem dunu bhai| tamasa asura deha
    tinha pai || kanakakasipu aru hataka locana| jagata bidita surapati mada mocana || biji samara bira
    bikhyata| dhari baraha bapu eka nipata || hoi narahari dusara puni mara| jana prahalada sujasa bistara
    || do bhe nisacara jai tei mahabira balavana| kumbhakarana ravana subhata sura biji jaga jana || |
    mukuta na bhe hate bhagavana| tini janama dvija bacana pravana || eka bara tinha ke hita lagi| dhareu
    sarira bhagata anuragi || kasyapa aditi taha~ pitu mata| dasaratha kausalya bikhyata || eka kalapa
    ehi bidhi avatara| caritra pavitra kie samsara || eka kalapa sura dekhi dukhare| samara jalandhara
    sana saba hare || sambhu kinha sangrama apara| danuja mahabala mari na mara || parama sati asuradhipa
    nari| tehi bala tahi na jitahim purari || do chala kari tareu tasu brata prabhu sura karaja kinha
    || jaba tehi janeu marama taba shrapa kopa kari dinha || || tasu shrapa hari dinha pramana| kautukanidhi
    kripala bhagavana || taha~ jalandhara ravana bhayu| rana hati rama parama pada dayu || eka janama
    kara karana eha| jehi lagi rama dhari naradeha || prati avatara katha prabhu keri| sunu muni barani
    kabinha ghaneri || narada shrapa dinha eka bara| kalapa eka tehi lagi avatara || girija cakita bhi
    suni bani| narada bishnubhagata puni gyani || karana kavana shrapa muni dinha| ka aparadha ramapati
    kinha || yaha prasanga mohi kahahu purari| muni mana moha acaraja bhari || do bole bihasi mahesa taba
    gyani murha na koi| jehi jasa raghupati karahim jaba so tasa tehi chana hoi || kahu~ rama guna gatha
    bharadvaja sadara sunahu| bhava bhanjana raghunatha bhaju tulasi taji mana mada || || himagiri guha
    eka ati pavani| baha samipa surasari suhavani || ashrama parama punita suhava| dekhi devarishi mana
    ati bhava || nirakhi saila sari bipina bibhaga| bhayu ramapati pada anuraga || sumirata harihi shrapa
    gati badhi| sahaja bimala mana lagi samadhi || muni gati dekhi suresa derana| kamahi boli kinha samana
    || sahita sahaya jahu mama hetu| cakeu harashi hiya~ jalacaraketu || sunasira mana mahu~ asi trasa|
    cahata devarishi mama pura basa || je kami lolupa jaga mahim| kutila kaka iva sabahi derahim || do
    sukha hara lai bhaga satha svana nirakhi mrigaraja| chini lei jani jana jara timi surapatihi na laja
    || || tehi ashramahim madana jaba gayu| nija maya~ basanta niramayu || kusumita bibidha bitapa bahuranga|
    kujahim kokila gunjahi bhringa || cali suhavani tribidha bayari| kama krisanu barhaavanihari || rambhadika
    suranari nabina | sakala asamasara kala prabina || karahim gana bahu tana taranga| bahubidhi krirahi
    pani patanga || dekhi sahaya madana harashana| kinhesi puni prapanca bidhi nana || kama kala kachu
    munihi na byapi| nija bhaya~ dareu manobhava papi || sima ki ca~pi saki kau tasu| bara rakhavara ramapati
    jasu || do sahita sahaya sabhita ati mani hari mana maina| gahesi jai muni carana taba kahi suthi
    arata baina || || bhayu na narada mana kachu rosha| kahi priya bacana kama paritosha || nai carana
    siru ayasu pai| gayu madana taba sahita sahai || muni susilata apani karani| surapati sabha~ jai saba
    barani || suni saba kem mana acaraju ava| munihi prasamsi harihi siru nava || taba narada gavane siva
    pahim| jita kama ahamiti mana mahim || mara carita sankarahim sunae| atipriya jani mahesa sikhae ||
    bara bara binavu~ muni tohim| jimi yaha katha sunayahu mohim || timi jani harihi sunavahu kabahu~|
    calehu~ prasanga duraedu tabahu~ || do sambhu dinha upadesa hita nahim naradahi sohana| bharadvaja
    kautuka sunahu hari iccha balavana || || rama kinha cahahim soi hoi| karai anyatha asa nahim koi ||
    sambhu bacana muni mana nahim bhae| taba biranci ke loka sidhae || eka bara karatala bara bina| gavata
    hari guna gana prabina || chirasindhu gavane muninatha| jaha~ basa shrinivasa shrutimatha || harashi
    mile uthi ramaniketa| baithe asana rishihi sameta || bole bihasi caracara raya| bahute dinana kinhi
    muni daya || kama carita narada saba bhashe| jadyapi prathama baraji siva~ rakhe || ati pracanda raghupati
    kai maya| jehi na moha asa ko jaga jaya || do rukha badana kari bacana mridu bole shribhagavana |
    tumhare sumirana tem mitahim moha mara mada mana || || sunu muni moha hoi mana takem| gyana biraga
    hridaya nahim jake || brahmacaraja brata rata matidhira| tumhahi ki kari manobhava pira || narada
    kaheu sahita abhimana| kripa tumhari sakala bhagavana || karunanidhi mana dikha bicari| ura ankureu
    garaba taru bhari || begi so mai darihu~ ukhari| pana hamara sevaka hitakari || muni kara hita mama
    kautuka hoi| avasi upaya karabi mai soi || taba narada hari pada sira nai| cale hridaya~ ahamiti adhikai
    || shripati nija maya taba preri| sunahu kathina karani tehi keri || do biraceu maga mahu~ nagara
    tehim sata jojana bistara| shrinivasapura tem adhika racana bibidha prakara || || basahim nagara sundara
    nara nari| janu bahu manasija rati tanudhari || tehim pura basi silanidhi raja| aganita haya gaya
    sena samaja || sata suresa sama bibhava bilasa| rupa teja bala niti nivasa || bisvamohani tasu kumari|
    shri bimoha jisu rupu nihari || soi harimaya saba guna khani| sobha tasu ki jai bakhani || kari svayambara
    so nripabala| ae taha~ aganita mahipala || muni kautuki nagara tehim gayu| purabasimha saba puchata
    bhayu || suni saba carita bhupagriha~ ae| kari puja nripa muni baithae || do ani dekhai naradahi bhupati
    rajakumari| kahahu natha guna dosha saba ehi ke hridaya~ bicari || || dekhi rupa muni birati bisari|
    barai bara lagi rahe nihari || lacchana tasu biloki bhulane| hridaya~ harasha nahim pragata bakhane
    || jo ehi bari amara soi hoi| samarabhumi tehi jita na koi || sevahim sakala caracara tahi| bari silanidhi
    kanya jahi || lacchana saba bicari ura rakhe| kachuka banai bhupa sana bhashe || suta sulacchana kahi
    nripa pahim| narada cale soca mana mahim || karaum jai soi jatana bicari| jehi prakara mohi barai
    kumari || japa tapa kachu na hoi tehi kala| he bidhi mili kavana bidhi bala || do ehi avasara cahia
    parama sobha rupa bisala| jo biloki rijhai kua~ri taba melai jayamala || || hari sana magaum sundaratai|
    hoihi jata gaharu ati bhai || morem hita hari sama nahim kou| ehi avasara sahaya soi hou || bahubidhi
    binaya kinhi tehi kala| pragateu prabhu kautuki kripala || prabhu biloki muni nayana juraane| hoihi
    kaju hie~ harashane || ati arati kahi katha sunai| karahu kripa kari hohu sahai || apana rupa dehu
    prabhu mohi| ana bha~ti nahim pavaum ohi || jehi bidhi natha hoi hita mora| karahu so begi dasa maim
    tora || nija maya bala dekhi bisala| hiya~ ha~si bole dinadayala || do jehi bidhi hoihi parama hita
    narada sunahu tumhara| soi hama karaba na ana kachu bacana na mrisha hamara || || kupatha maga ruja
    byakula rogi| baida na dei sunahu muni jogi || ehi bidhi hita tumhara maim thayu| kahi asa antarahita
    prabhu bhayu || maya bibasa bhe muni murhaa| samujhi nahim hari gira nigurhaa || gavane turata taha~
    rishirai| jaha~ svayambara bhumi banai || nija nija asana baithe raja| bahu banava kari sahita samaja
    || muni mana harasha rupa ati morem| mohi taji anahi barihi na bhorem || muni hita karana kripanidhana|
    dinha kurupa na jai bakhana || so caritra lakhi kahu~ na pava| narada jani sabahim sira nava || do
    rahe taha~ dui rudra gana te janahim saba bheu| biprabesha dekhata phirahim parama kautuki teu ||
    || jemhi samaja bainthe muni jai| hridaya~ rupa ahamiti adhikai || taha~ baitha mahesa gana dou| biprabesha
    gati lakhi na kou || karahim kuti naradahi sunai| niki dinhi hari sundaratai || rijhahi rajakua~ri
    chabi dekhi| inhahi barihi hari jani biseshi || munihi moha mana hatha parae~| ha~sahim sambhu gana
    ati sacu pae~ || jadapi sunahim muni atapati bani| samujhi na pari buddhi bhrama sani || kahu~ na
    lakha so carita bisesha| so sarupa nripakanya~ dekha || markata badana bhayankara dehi| dekhata hridaya~
    krodha bha tehi || do sakhim sanga lai kua~ri taba cali janu rajamarala| dekhata phiri mahipa saba
    kara saroja jayamala || || jehi disi baithe narada phuli| so disi dehi na biloki bhuli || puni puni
    muni ukasahim akulahim| dekhi dasa hara gana musakahim || dhari nripatanu taha~ gayu kripala| kua~ri
    harashi meleu jayamala || dulahini lai ge lacchinivasa| nripasamaja saba bhayu nirasa || muni ati
    bikala momha~ mati nathi| mani giri gi chuti janu ga~thi || taba hara gana bole musukai| nija mukha
    mukura bilokahu jai || asa kahi dau bhage bhaya~ bhari| badana dikha muni bari nihari || beshu biloki
    krodha ati barhaa| tinhahi sarapa dinha ati garhaa || do hohu nisacara jai tumha kapati papi dau|
    ha~sehu hamahi so lehu phala bahuri ha~sehu muni kau || || puni jala dikha rupa nija pava| tadapi
    hridaya~ santosha na ava || pharakata adhara kopa mana mahim| sapadi cale kamalapati pahim || dehu~
    shrapa ki marihu~ jai| jagata mora upahasa karai || bicahim pantha mile danujari| sanga rama soi rajakumari
    || bole madhura bacana surasaim| muni kaha~ cale bikala ki naim || sunata bacana upaja ati krodha|
    maya basa na raha mana bodha || para sampada sakahu nahim dekhi| tumharem irisha kapata biseshi ||
    mathata sindhu rudrahi baurayahu| suranha preri bisha pana karayahu || do asura sura bisha sankarahi
    apu rama mani caru| svaratha sadhaka kutila tumha sada kapata byavaharu || || parama svatantra na
    sira para koi| bhavi manahi karahu tumha soi || bhalehi manda mandehi bhala karahu| bisamaya harasha
    na hiya~ kachu dharahu || dahaki dahaki paricehu saba kahu| ati asanka mana sada uchahu || karama
    subhasubha tumhahi na badha| aba lagi tumhahi na kahu~ sadha || bhale bhavana aba bayana dinha| pavahuge
    phala apana kinha || bancehu mohi javani dhari deha| soi tanu dharahu shrapa mama eha || kapi akriti
    tumha kinhi hamari| karihahim kisa sahaya tumhari || mama apakara kinhi tumha bhari| nari biraha~
    tumha hoba dukhari || do shrapa sisa dhari harashi hiya~ prabhu bahu binati kinhi| nija maya kai prabalata
    karashi kripanidhi linhi || || jaba hari maya duri nivari| nahim taha~ rama na rajakumari || taba
    muni ati sabhita hari carana| gahe pahi pranatarati harana || mrisha hau mama shrapa kripala| mama
    iccha kaha dinadayala || maim durbacana kahe bahutere| kaha muni papa mitihim kimi mere || japahu
    jai sankara sata nama| hoihi hridaya~ turanta bishrama || kau nahim siva samana priya morem| asi paratiti
    tajahu jani bhorem || jehi para kripa na karahim purari| so na pava muni bhagati hamari || asa ura
    dhari mahi bicarahu jai| aba na tumhahi maya niarai || do bahubidhi munihi prabodhi prabhu taba bhe
    antaradhana || satyaloka narada cale karata rama guna gana || || hara gana munihi jata patha dekhi|
    bigatamoha mana harasha biseshi || ati sabhita narada pahim ae| gahi pada arata bacana sunae || hara
    gana hama na bipra muniraya| bara aparadha kinha phala paya || shrapa anugraha karahu kripala| bole
    narada dinadayala || nisicara jai hohu tumha dou| baibhava bipula teja bala hou || bhujabala bisva
    jitaba tumha jahia| dharihahim bishnu manuja tanu tahia| samara marana hari hatha tumhara| hoihahu
    mukuta na puni samsara || cale jugala muni pada sira nai| bhe nisacara kalahi pai || do eka kalapa
    ehi hetu prabhu linha manuja avatara| sura ranjana sajjana sukhada hari bhanjana bhubi bhara || ||
    ehi bidhi janama karama hari kere| sundara sukhada bicitra ghanere || kalapa kalapa prati prabhu avatarahim|
    caru carita nanabidhi karahim || taba taba katha munisanha gai| parama punita prabandha banai || bibidha
    prasanga anupa bakhane| karahim na suni acaraju sayane || hari ananta harikatha ananta| kahahim sunahim
    bahubidhi saba santa || ramacandra ke carita suhae| kalapa koti lagi jahim na gae || yaha prasanga
    maim kaha bhavani| harimaya~ mohahim muni gyani || prabhu kautuki pranata hitakari || sevata sulabha
    sakala dukha hari || so sura nara muni kau nahim jehi na moha maya prabala || asa bicari mana mahim
    bhajia mahamaya patihi || || apara hetu sunu sailakumari| kahu~ bicitra katha bistari || jehi karana
    aja aguna arupa| brahma bhayu kosalapura bhupa || jo prabhu bipina phirata tumha dekha| bandhu sameta
    dharem munibesha || jasu carita avaloki bhavani| sati sarira rahihu baurani || ajahu~ na chaya mitati
    tumhari| tasu carita sunu bhrama ruja hari || lila kinhi jo tehim avatara| so saba kahihu~ mati anusara
    || bharadvaja suni sankara bani| sakuci saprema uma musakani || lage bahuri barane brishaketu| so
    avatara bhayu jehi hetu || do so maim tumha sana kahu~ sabu sunu munisa mana lai || rama katha kali
    mala harani mangala karani suhai || || svayambhu manu aru satarupa| jinha tem bhai narasrishti anupa
    || dampati dharama acarana nika| ajahu~ gava shruti jinha kai lika || nripa uttanapada suta tasu|
    dhruva hari bhagata bhayu suta jasu || laghu suta nama priyrabrata tahi| beda purana prasamsahi jahi
    || devahuti puni tasu kumari| jo muni kardama kai priya nari || adideva prabhu dinadayala| jathara
    dhareu jehim kapila kripala || sankhya sastra jinha pragata bakhana| tattva bicara nipuna bhagavana
    || tehim manu raja kinha bahu kala| prabhu ayasu saba bidhi pratipala || so hoi na bishaya biraga
    bhavana basata bha cauthapana| hridaya~ bahuta dukha laga janama gayu haribhagati binu || || barabasa
    raja sutahi taba dinha| nari sameta gavana bana kinha || tiratha bara naimisha bikhyata| ati punita
    sadhaka sidhi data || basahim taha~ muni siddha samaja| taha~ hiya~ harashi caleu manu raja || pantha
    jata sohahim matidhira| gyana bhagati janu dharem sarira || pahu~ce jai dhenumati tira| harashi nahane
    niramala nira || ae milana siddha muni gyani| dharama dhurandhara nriparishi jani || jaha~ ja~ha tiratha
    rahe suhae| muninha sakala sadara karavae || krisa sarira munipata paridhana| sata samaja nita sunahim
    purana | do dvadasa acchara mantra puni japahim sahita anuraga| basudeva pada pankaruha dampati mana
    ati laga || || karahim ahara saka phala kanda| sumirahim brahma saccidananda || puni hari hetu karana
    tapa lage| bari adhara mula phala tyage || ura abhilasha nimrantara hoi| dekha nayana parama prabhu
    soi || aguna akhanda ananta anadi| jehi cintahim paramarathabadi || neti neti jehi beda nirupa| nijananda
    nirupadhi anupa || sambhu biranci bishnu bhagavana| upajahim jasu amsa tem nana || aiseu prabhu sevaka
    basa ahi| bhagata hetu lilatanu gahi || jaum yaha bacana satya shruti bhasha| tau hamara pujahi abhilasha
    || do ehi bidhi bitem barasha shata sahasa bari ahara| sambata sapta sahasra puni rahe samira adhara
    || || barasha sahasa dasa tyageu sou| tharhae rahe eka pada dou || bidhi hari tapa dekhi apara| manu
    samipa ae bahu bara || magahu bara bahu bha~ti lobhae| parama dhira nahim calahim calae || asthimatra
    hoi rahe sarira| tadapi managa manahim nahim pira || prabhu sarbagya dasa nija jani| gati ananya tapasa
    nripa rani || magu magu baru bhai nabha bani| parama gabhira kripamrita sani || mritaka jiavani gira
    suhai| shrabana randhra hoi ura jaba ai || hrashtapushta tana bhe suhae| manahu~ abahim bhavana te
    ae || do shravana sudha sama bacana suni pulaka praphullita gata| bole manu kari dandavata prema na
    hridaya~ samata || || sunu sevaka surataru suradhenu| bidhi hari hara bandita pada renu || sevata
    sulabha sakala sukha dayaka| pranatapala sacaracara nayaka || jaum anatha hita hama para nehu| tau
    prasanna hoi yaha bara dehu || jo sarupa basa siva mana mahim| jehi karana muni jatana karahim ||
    jo bhusundi mana manasa hamsa| saguna aguna jehi nigama prasamsa || dekhahim hama so rupa bhari locana|
    kripa karahu pranatarati mocana || dampati bacana parama priya lage| mudula binita prema rasa page
    || bhagata bachala prabhu kripanidhana| bisvabasa pragate bhagavana || do nila saroruha nila mani
    nila niradhara syama| lajahim tana sobha nirakhi koti koti sata kama || || sarada mayanka badana chabi
    simva| caru kapola cibuka dara griva || adhara aruna rada sundara nasa| bidhu kara nikara binindaka
    hasa || nava abunja ambaka chabi niki| citavani lalita bhava~ti ji ki || bhukuti manoja capa chabi
    hari| tilaka lalata patala dutikari || kundala makara mukuta sira bhraja| kutila kesa janu madhupa
    samaja || ura shribatsa rucira banamala| padika hara bhushana manijala || kehari kandhara caru janeu|
    bahu bibhushana sundara teu || kari kara sari subhaga bhujadanda| kati nishanga kara sara kodanda
    || do tadita binindaka pita pata udara rekha bara tini || nabhi manohara leti janu jamuna bhava~ra
    chabi chini || || pada rajiva barani nahi jahim| muni mana madhupa basahim jenha mahim || bama bhaga
    sobhati anukula| adisakti chabinidhi jagamula || jasu amsa upajahim gunakhani| aganita lacchi uma
    brahmani || bhrikuti bilasa jasu jaga hoi| rama bama disi sita soi || chabisamudra hari rupa biloki|
    ekataka rahe nayana pata roki || citavahim sadara rupa anupa| tripti na manahim manu satarupa || harasha
    bibasa tana dasa bhulani| pare danda iva gahi pada pani || sira parase prabhu nija kara kanja| turata
    uthae karunapunja || do bole kripanidhana puni ati prasanna mohi jani| magahu bara joi bhava mana
    mahadani anumani || || suni prabhu bacana jori juga pani| dhari dhiraju boli mridu bani || natha dekhi
    pada kamala tumhare| aba pure saba kama hamare || eka lalasa barai ura mahi| sugama agama kahi jata
    so nahim || tumhahi deta ati sugama gosaim| agama laga mohi nija kripanaim || jatha daridra bibudhataru
    pai| bahu sampati magata sakucai || tasu prabha jana nahim soi| tatha hridaya~ mama samsaya hoi ||
    so tumha janahu antarajami| puravahu mora manoratha svami || sakuca bihai magu nripa mohi| morem nahim
    adeya kachu tohi || do dani siromani kripanidhi natha kahu~ satibhau || cahu~ tumhahi samana suta
    prabhu sana kavana durau || || dekhi priti suni bacana amole| evamastu karunanidhi bole || apu sarisa
    khojaum kaha~ jai| nripa tava tanaya hoba maim ai || satarupahi biloki kara jorem| debi magu baru
    jo ruci tore || jo baru natha catura nripa maga| soi kripala mohi ati priya laga || prabhu parantu
    suthi hoti dhithai| jadapi bhagata hita tumhahi sohai || tumha brahmadi janaka jaga svami| brahma
    sakala ura antarajami || asa samujhata mana samsaya hoi| kaha jo prabhu pravana puni soi || je nija
    bhagata natha tava ahahim| jo sukha pavahim jo gati lahahim || do soi sukha soi gati soi bhagati soi
    nija carana sanehu || soi bibeka soi rahani prabhu hamahi kripa kari dehu || || sunu mridu gurha rucira
    bara racana| kripasindhu bole mridu bacana || jo kachu ruci tumhera mana mahim| maim so dinha saba
    samsaya nahim || matu bibeka alokika torem| kabahu~ na mitihi anugraha morem | bandi carana manu kaheu
    bahori| avara eka binati prabhu mori || suta bishika tava pada rati hou| mohi bara murha kahai kina
    kou || mani binu phani jimi jala binu mina| mama jivana timi tumhahi adhina || asa baru magi carana
    gahi raheu| evamastu karunanidhi kaheu || aba tumha mama anusasana mani| basahu jai surapati rajadhani
    || so taha~ kari bhoga bisala tata gu~ kachu kala puni| hoihahu avadha bhuala taba maim hoba tumhara
    suta || || icchamaya narabesha sa~varem| hoihu~ pragata niketa tumhare || amsanha sahita deha dhari
    tata| karihu~ carita bhagata sukhadata || je suni sadara nara barabhagi| bhava tarihahim mamata mada
    tyagi || adisakti jehim jaga upajaya| sau avatarihi mori yaha maya || puruba maim abhilasha tumhara|
    satya satya pana satya hamara || puni puni asa kahi kripanidhana| antaradhana bhe bhagavana || dampati
    ura dhari bhagata kripala| tehim ashrama nivase kachu kala || samaya pai tanu taji anayasa| jai kinha
    amaravati basa || do yaha itihasa punita ati umahi kahi brishaketu| bharadvaja sunu apara puni rama
    janama kara hetu || pa~cava~ vishrama sunu muni katha punita purani| jo girija prati sambhu bakhani
    || bisva bidita eka kaikaya desu| satyaketu taha~ basi naresu || dharama dhurandhara niti nidhana|
    teja pratapa sila balavana || tehi kem bhe jugala suta bira| saba guna dhama maha ranadhira || raja
    dhani jo jetha suta ahi| nama pratapabhanu asa tahi || apara sutahi arimardana nama| bhujabala atula
    acala sangrama || bhaihi bhaihi parama samiti| sakala dosha chala barajita priti || jethe sutahi raja
    nripa dinha| hari hita apu gavana bana kinha || do jaba prataparabi bhayu nripa phiri dohai desa|
    praja pala ati bedabidhi katahu~ nahim agha lesa || || nripa hitakaraka saciva sayana| nama dharamaruci
    sukra samana || saciva sayana bandhu balabira| apu pratapapunja ranadhira || sena sanga caturanga
    apara| amita subhata saba samara jujhara || sena biloki rau harashana| aru baje gahagahe nisana ||
    bijaya hetu kataki banai| sudina sadhi nripa caleu bajai || ja~ha taha~ parim aneka laraim| jite sakala
    bhupa bariai || sapta dipa bhujabala basa kinhe| lai lai danda charai nripa dinhem || sakala avani
    mandala tehi kala| eka pratapabhanu mahipala || do svabasa bisva kari bahubala nija pura kinha prabesu|
    aratha dharama kamadi sukha sevi samaya~ naresu || || bhupa pratapabhanu bala pai| kamadhenu bhai
    bhumi suhai || saba dukha barajita praja sukhari| dharamasila sundara nara nari || saciva dharamaruci
    hari pada priti| nripa hita hetu sikhava nita niti || gura sura santa pitara mahideva| kari sada nripa
    saba kai seva || bhupa dharama je beda bakhane| sakala kari sadara sukha mane || dina prati deha bibidha
    bidhi dana| sunahu sastra bara beda purana || nana bapim kupa taraaga| sumana batika sundara baga
    || biprabhavana surabhavana suhae| saba tirathanha bicitra banae || do ja~ha lagi kahe purana shruti
    eka eka saba jaga| bara sahasra sahasra nripa kie sahita anuraga || || hridaya~ na kachu phala anusandhana|
    bhupa bibeki parama sujana || kari je dharama karama mana bani| basudeva arpita nripa gyani || carhai
    bara baji bara eka raja| mrigaya kara saba saji samaja || bindhyacala gabhira bana gayu| mriga punita
    bahu marata bhayu || phirata bipina nripa dikha barahu| janu bana dureu sasihi grasi rahu || bara
    bidhu nahi samata mukha mahim| manahu~ krodhabasa ugilata nahim || kola karala dasana chabi gai| tanu
    bisala pivara adhikai || ghurughurata haya arau pae~| cakita bilokata kana uthae~ || do nila mahidhara
    sikhara sama dekhi bisala barahu| capari caleu haya sutuki nripa ha~ki na hoi nibahu || || avata dekhi
    adhika rava baji| caleu baraha maruta gati bhaji || turata kinha nripa sara sandhana| mahi mili gayu
    bilokata bana || taki taki tira mahisa calava| kari chala suara sarira bacava || pragatata durata
    jai mriga bhaga| risa basa bhupa caleu sanga laga || gayu duri ghana gahana barahu| jaha~ nahina gaja
    baji nibahu || ati akela bana bipula kalesu| tadapi na mriga maga taji naresu || kola biloki bhupa
    bara dhira| bhagi paitha giriguha~ gabhira || agama dekhi nripa ati pachitai| phireu mahabana pareu
    bhulai || do kheda khinna chuddhita trishita raja baji sameta| khojata byakula sarita sara jala binu
    bhayu aceta || || phirata bipina ashrama eka dekha| taha~ basa nripati kapata munibesha || jasu desa
    nripa linha charaai| samara sena taji gayu parai || samaya pratapabhanu kara jani| apana ati asamaya
    anumani || gayu na griha mana bahuta galani| mila na rajahi nripa abhimani || risa ura mari ranka
    jimi raja| bipina basi tapasa kem saja || tasu samipa gavana nripa kinha| yaha prataparabi tehi taba
    cinha || rau trishita nahi so pahicana| dekhi subesha mahamuni jana || utari turaga tem kinha pranama|
    parama catura na kaheu nija nama || do bhupati trishita biloki tehim sarabaru dinha dekhai| majjana
    pana sameta haya kinha nripati harashai || || gai shrama sakala sukhi nripa bhayu| nija ashrama tapasa
    lai gayu || asana dinha asta rabi jani| puni tapasa boleu mridu bani || ko tumha kasa bana phirahu
    akelem| sundara juba jiva parahelem || cakrabarti ke lacchana torem| dekhata daya lagi ati morem ||
    nama pratapabhanu avanisa| tasu saciva maim sunahu munisa || phirata aherem pareu~ bhulai| bade bhaga
    dekhu~ pada ai || hama kaha~ durlabha darasa tumhara| janata haum kachu bhala honihara || kaha muni
    tata bhayu a~dhiyara| jojana sattari nagaru tumhara || do nisa ghora gambhira bana pantha na sunahu
    sujana| basahu aju asa jani tumha jaehu hota bihana || || tulasi jasi bhavatabyata taisi mili sahai|
    apunu avi tahi pahim tahi taha~ lai jai || || bhalehim natha ayasu dhari sisa| ba~dhi turaga taru
    baitha mahisa || nripa bahu bhati prasamseu tahi| carana bandi nija bhagya sarahi || puni bole mridu
    gira suhai| jani pita prabhu karu~ dhithai || mohi munisa suta sevaka jani| natha nama nija kahahu
    bakhani || tehi na jana nripa nripahi so jana| bhupa suhrada so kapata sayana || bairi puni chatri
    puni raja| chala bala kinha cahi nija kaja || samujhi rajasukha dukhita arati| ava~ anala iva sulagi
    chati || sarala bacana nripa ke suni kana| bayara sa~bhari hridaya~ harashana || do kapata bori bani
    mridula boleu juguti sameta| nama hamara bhikhari aba nirdhana rahita niketi || || kaha nripa je bigyana
    nidhana| tumha sarikhe galita abhimana || sada rahahi apanapau durae~| saba bidhi kusala kubesha banae~
    || tehi tem kahahi santa shruti terem| parama akincana priya hari kerem || tumha sama adhana bhikhari
    ageha| hota biranci sivahi sandeha || josi sosi tava carana namami| mo para kripa karia aba svami
    || sahaja priti bhupati kai dekhi| apu bishaya bisvasa biseshi || saba prakara rajahi apanai| boleu
    adhika saneha janai || sunu satibhau kahu~ mahipala| iha~ basata bite bahu kala || do aba lagi mohi
    na mileu kau maim na janavu~ kahu| lokamanyata anala sama kara tapa kanana dahu || tulasi dekhi subeshu
    bhulahim murha na catura nara| sundara kekihi pekhu bacana sudha sama asana ahi || tatem guputa rahu~
    jaga mahim| hari taji kimapi prayojana nahim || prabhu janata saba binahim janae~| kahahu kavani sidhi
    loka rijhae~ || tumha suci sumati parama priya morem| priti pratiti mohi para torem || aba jaum tata
