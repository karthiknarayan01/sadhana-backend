id: homamantram
category: mantra
name:
  english: homamantram
  devanagari: होममन्त्रम्
content:
  english: homamantram om 1 agne tava yattejastad brahmam | 2 atastvam pratyaksham brahmasi | 3 tvadiya
    indriyani mano | 4 buddhiriti saptajihvah | 5 tvayi vishaya iti samidho juhomi | 6 ahamityajyam juhomi
    | 7 tvam nah prasida prasida | 8 shreyashca preyashca prayaccha svaha | om shantih shantih shantih
    | iti shrinarayanaguruviracitam homamantram sampurnam |
  devanagari: होममन्त्रम् ॐ १ अग्ने तव यत्तेजस्तद् ब्राह्मम् । २ अतस्त्वं प्रत्यक्षं ब्रह्मासि । ३ त्वदीया
    इन्द्रियाणि मनो । ४ बुद्धिरिति सप्तजिह्वाः । ५ त्वयि विषया इति समिधो जुहोमि । ६ अहमित्याज्यं जुहोमि
    । ७ त्वं नः प्रसीद प्रसीद । ८ श्रेयश्च प्रेयश्च प्रयच्छ स्वाहा । ॐ शान्तिः शान्तिः शान्तिः । इति श्रीनारायणगुरुविरचितं
    होममन्त्रं सम्पूर्णम् ।
meaning: {}
