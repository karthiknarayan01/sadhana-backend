id: guruvayurappan-athava-narayaniya-tatha-rogaharasahasranamastotram
category: sahasranama
name:
  english: guruvayurappan athava narayaniya tatha rogaharasahasranamastotram
  devanagari: गुरुवायुरप्पन् अथवा नारायणीय तथा रोगहरसहस्रनामस्तोत्रम्
content:
  english: ringaraikarasalayah || 70|| muraliganamadhuryamattagopijanavritah | radhamanasatoshakah sarvalokasantoshakah
    || 71|| gopikagarvashamanah virahakleshanashakah | sudarshanacakradharah shapamuktasudarshanah ||
    72|| shankhacudakritantashca arishtasuramardakah | shuravamshakulodbhutah keshavah keshisudanah ||
    73|| vyomasuranihanta ca vyomacarapranamitah | dushtakamsavadhodyuktah mathurapurimaptavan || 74||
    balaramasahavarti yagacapavipatakah | kuvalayapidamardakah pishtacanuramushtikah || 75|| kamsapranasamaharta
    yaduvamshavimocakah | jarasandhaparabhutah yavaneshvaradahakah || 76|| dvarakapuranirmata mucukundagatipradah
    | rukminiharako rukmiviryahanta'parajitah ||| 77|| parigrihitasyamantakah dhritajambavatikarah | satyabhamapatishcaiva
    shatadhanvanihantakah || 78|| kuntiputragunagrahi arjunapritikarakah | narakarirmurarishca banahastanikrintakah
    || 79|| apahritaparijatah devendramadabhanjakah | nrigamokshadah paundrakavasudevagatipradah || 80||
    kashirajashiracchetta bhasmikritasudakshinah | jarasandhamrityukari shishupalagatipradah || 81|| salvapranapahari
    ca dantavaktrabhighatakah | yudhishthiropadeshta ca bhimasenapriyankarah || 82|| arjunabhinnamurtishca
    madriputragurustatha | draupadirakshakashcaiva kuntivatsalyabhajanah || 83|| kauravakrauryasandashtapancalishokanashakah
    | kaunteyadutastejasvi vishvaruprapadarshakah || 84|| nirayudho niratanko jishnusuto janardanah |
    gitopadeshta lokeshah duhkhamaudhyanivarakah || 85|| bhishmadronadraunikarnadyagnijvalaprashamakah
    | kucelapatnidaridryaduhkhabadhavimocakah || 86|| ajah kalavidhata ca artighnah sarvakamadah | analo
    avyayo vyasah arunanujavahanah || 87|| akhilah pranadah pranah anilatmajasevitah | adibhuta anadyantah
    kshantiklantivivarjitah || 88|| aditeyo vikunthatma vaikuntho vishtarashravah | ijyah sudarshano idyah
    indriyanamagocarah || 89|| uttamah sattamo ugra udanah pranarupakah | vyanapano samanashca jivamrityuvibhajakah
    || 90|| urdhvago uhito uhyah uhatitaprabhavavan | ritambharo ritudharah saptarshiganasevitah || 91||
    rishigamyo ribhurriddhih sanakadimunistutah | ekanatho ekamurtiritibadhavinashakah || 92|| aindhano
    eshaniyashca anullanghitashasanah | ojaskaro oshadhisho odramalavibhushitah || 93|| aushadhah sarvatapanam
    samanadhikyavarjitah | kalabhritkaladoshaghnah karyajnah karmakarakah || 94|| khadgi khandakah khadyotah
    khali khandavadahakah | gadagrajo gadapani gambhiro garvanashakah || 95|| ghanavarno gharmabhanuh
    ghatajanmanamaskritah | cintatitah cidanandah vishvabhramanakarakah || 96|| chandakah chandanah channah
    chayakarakah diptiman | jayo jayanto vijayo jnapakah jnanavigrahah || 97|| jharjharapannivarakah jhanajjhanitanupurah
    | tankatikapranamitah thakkuro dambhanashakah || 98|| tattvatitastattvamurtih tattvacintapracodakah
    | daksho data dayamurtih dasharho dirghalocanah || 99|| parajishnuh parandhamah paranandasukhrapadah
    | bhalanetrah phanishayi punyapunyaphalapradah || 100|| bandhahino lokabandhuh balakrishnah satangatih
    | bhavyarashirbhishagvaryah bhasurah bhumipalakah || 101|| madhuvairih kaitabharirmantrajno mantradarshakah
    | yativaryo yajamanah yakshakardamabhushitah || 102|| ranganatho raghuvarah rasajno ripukarshanah
    | lakshyo lakshyajno lakshmikah lakshmibhuminishevitah || 103|| varshishtho vardhamanashca karunamritavarshakah
    | vishvo vriddho vrittihinah vishvajidvishvapavanah || 104|| shasta shamsitah shamstavyah vedashastravibhavitah
    | shadabhijnah shadadharapadmakendranivasakah || 105|| saguno nirgunah sakshi sarvajitsakshivarjitah
    | saumyah krurah shantamurtih kshubdhah kshobhavinashakah || 106|| harshakah havyabhuk havyah hitahitavibhavakah
    | vyoma vyapanashilashca sarvavyapirmaheshvarah || 107|| narayano narashayi narayano narasakhah |
    nandaki cakrapanishca pancajanyapraghoshakah || 108|| kumodakah padmahastah vishvarupo vidhistutah
    | adishesho'prameyashca anantah jnanavigrahah || 109|| bhaktigamyah parandhamah paramo bhaktavatsalah
    | paranjyotih parabrahma parameshthih paratparah || 110|| vishvadharo niradharah sadacarapracarakah
    | mahayogi mahaviro maharupo mahabalah || 111|| mahabhogi havirbhokta mahayagaphalapradah | mahasattvo
    mahashaktih mahayoddha mahaprabhuh || 112|| mahamoho mahakopah mahapatakanashakah | shantah shantipradah
    shurah sharanagatapalakah || 113|| padmapadah padmagarbhah padmapatranibhekshanah | lokeshah sharvah
    kameshah kamakotisamaprabhah || 114|| mahateja mahabrahma mahajnano mahatapah | nilameghanibhah shyamah
    shubhangah shubhakarakah || 115|| kamanah kamalakantah kamitartthapradayakah | yogigamyo yogarupo
    yogi yogeshvareshvarah || 116|| bhavo bhayakaro bhanuh bhaskaro bhavanashakah | kiriti kundali cakri
    caturbahusamanvitah || 117|| jagatprabhurdevadevah pavitrah purushottamah | animadyashtasiddhishah
    siddhah siddhaganeshvarah || 118|| devo devaganadhyaksho vasavo vasurakshakah | onkarah pranavah pranah
    pradhanah prakramah kratuh || 119|| nandirnandito nabhyo nandagopatapahphalah | mohano mohahanta ca
    maitreyo meghavahanah || 120|| bhadro bhadrankaro bhanuh punyashravanakirtanah | gadadharo gadadhvamsi
    gambhiro ganalolupah || 121|| tejasastejasam rashih tridashastridasharcitah | vasudevo vasubhadro
    vadanyo valgudarshanah || 122|| devakinandanah sragvi simatitavibhutiman | vasavo vasaradhishah guruvayupureshvarah
    || 123|| yamo yashasvi yuktashca yoganidraparayanah | suryah suraryamarkashca sarvasantapanashakah
    || 124|| shantatejo maharaudrah saumyarupo'bhayankarah | bhasvan vivasvan saptashvah andhakaravipatakah
    || 125|| tapanah savita hamsah cintamaniraharpatih | aruno mihiro mitrah niharakledanashakah || 126||
    adityo haridashvashca mohalobhavinashakah | kantah kantimatam kantih chayanatho divakarah || 127||
    sthavarajangamaguruh khadyoto lokabandhavah | karmasakshi jagaccakshuh kalarupah kripanidhih || 128||
    sattvamurtistattvamayah satyarupo divaspatih | shubhramshushcandrama candrah oshadhisho nishapatih
    || 129|| mriganko mah kshapanathah nakshatreshah kalanidhih | angarako lohitamshuh kujo bhaumo mahisutah
    || 130|| rauhineyo budhah saumyah sarvavidyavidhayakah | vacaspatirgururjivah suracaryo brihaspatih
    || 131|| ushana bhargavah kavyah kavih shukro'suraguruh | suryaputro shanirmandah sarvabhakshah shanaishcarah
    || 132|| vidhuntudah tamo rahuh shikhi keturviramadah | navagrahasvarupashca grahakopanivarakah ||
    133|| dashanathah pritikarah mapako mangalapradah | dvihastashca mahabahuh kotikotibhujairyutah ||
    134|| ekamukho bahumukhah bahusahrasanetravan | bandhakari bandhahinah samsari bandhamocakah || 135||
    mamatarupo'hambuddhih kritajnah kamamohitah | nanamurtidharah shaktih bhinnadevasvarupadhrik || 136||
    sarvabhutaharah sthanuh sharvo bhimah sadashivah | pashupatih pashahinah jati carmi pinakavan || 137||
    vinayako lambodarah herambo vighnanashakah | ekadanto mahakayah siddhibuddhipradayakah || 138|| guhah
    skando mahasenah vishakhah shikhivahanah | shadanano bahuleyah kumarah krauncabhanjakah || 139|| akhandalo
    sahasrakshah valaratishshacipatih | sutrama gotrabhidvajri ribhuksha vritraha vrisha || 140|| brahma
    prajapatirdhata padmayonih pitamahah | srishtikarta surajyeshthah vidhata vishvasrit vidhih || 141||
    pradyumno madano kamah pushpabano manobhavah | lakshmiputro minaketuranangah pancasharah smarah ||
    142|| krishnaputro sharvajeta ikshucapo ratipriyah | shambaraghno vishvajishnurvishvabhramanakarakah
    || 143|| barhih shushma vayusakhah ashrayasho vibhavasuh | jvalamali krishnavartma hutabhuk dahanah
    shuci || 144|| anilah pavano vayuh prishadashvah prabhanjanah | vatah prano jagatpranah gandhavahah
    sadagatih || 145|| pashayudho nadikantah varuno yadasampatih | rajarajo yaksharajah paulastyo naravahanah
    || 146|| nidhishah tryambakasakhah ekapingo dhaneshvarah | devesho jagadadharah adidevah paratparah
    || 147|| mahatma paramatma ca paramanandadayakah | dharapatih svarpatishca vidyanatho jagatpita ||
    148|| padmahastah padmamali padmashobhipadadvayah | madhuvairih kaitabharih vedadhrik vedapalakah
    || 149|| candamundashiracchetta mahishasuramardakah | mahakalirupadharah camundirupadharakah || 150||
    nishumbhashumbhasamharta raktabijasuharakah | bhandasuranishudako lalitaveshadharakah || 151|| rishabho
    nabhiputrashca indradaushtyaprashamakah | avyakto vyaktarupashca nashahino vinashakrit || 152|| karmadhyaksho
    gunadhyakshah bhutagramavisarjakah | kraturyajnah huto mantrah pita mata pitamahah || 153|| vedyo
    vedo gatirbharta sakshi karaka vedavid | bhokta bhojyah bhuktikarma bhojyabhojyavivecakah || 154||
    sadacaro duracarah shubhashubhaphalapradah | nityo'nityah sthirashcalah drishyadrishyah shrutashrutah
    || 155|| adimadhyantahinashca dehi deho gunashrayah | jnanah jneyah parijnata dhyanah dhyata paridhyeyah
    || 156|| avibhakto vibhaktashca prithagrupo gunashritah | pravrittishca nivrittishca prakritirvikritirupadhrik
    || 157|| bandhano bandhakarta ca sarvabandhavipatakah | pujitah pujakashcaiva pujakarmavidhayakah
    || 158|| vaikunthavasah svarvasah vikunthahridayalayah | brahmabijo vishvabindurjadajivavibhajakah
    ||| 159|| pindandasthah parandhamah shabdabrahmasvarupakah | adharashatkanilayah jivavyapriticodakah
    || 160|| anantarupo jivatma tigmatejah svayambhavah | anadyantah kalarupah guruvayupureshvarah ||
    161|| gururgurutamo gamyo gandharvaganavanditah | rukminivallabhah shaurirbalaramasahodarah || 162||
    paramah paramodarah pannagashanavahanah | vanamali vardhamanah vallavivallabho vashi || 163|| nandasunurnityatriptah
    nashtalabhavivarjitah | purandarah pushkarakshah yogihritkamalalayah || 164|| renukatanayo ramah kartaviryakulantakah
    | sharanyah sharanah shantah shashvatah svastidayakah || 165|| rogaghnah sarvapapaghnah karmadoshabhayapahah
    | gabhastimali garvaghno gargashishyo gavapriyah || 166|| tapaso tapashamanah tandavapriyananditah
    | panktisyanaputrashca kausalyanandavardhanah || 167|| prathitah pragrahah prajnah pratibandhanivarakah
    | shatrunjayo shatruhinah sharabhangagatipradah || 168|| mangalo mangalakantah sarvamangalamangalah
    | yajnamurtirvishvamurtirayurarogyasaukhyadah || 169|| yogindranam tvadangeshvadhikasumadhuram muktibhajam
    nivaso bhaktanam kamavarshadyutarukisalayam natha te padamulam | nityam cittasthitam me pavanapurapate
  devanagari: ृङ्गारैकरसालयः ॥ ७०॥ मुरलीगानमाधुर्यमत्तगोपीजनावृतः । राधामानसतोषकः सर्वलोकसन्तोषकः ॥ ७१॥
    गोपिकागर्वशमनः विरहक्लेशनाशकः । सुदर्शनचक्रधरः शापमुक्तसुदर्शनः ॥ ७२॥ शङ्खचूडकृतान्तश्च अरिष्टासुरमर्दकः
    । शूरवंशकुलोद्भूतः केशवः केशिसूदनः ॥ ७३॥ व्योमासुरनिहन्ता च व्योमचारप्रणमितः । दुष्टकंसवधोद्युक्तः
    मथुरापुरिमाप्तवान् ॥ ७४॥ बलरामसहवर्ती यागचापविपाटकः । कुवलयापीडमर्दकः पिष्टचाणूरमुष्टिकः ॥ ७५॥ कंसप्राणसमाहर्ता
    यदुवंशविमोचकः । जरासन्धपराभूतः यवनेश्वरदाहकः ॥ ७६॥ द्वारकापुरनिर्माता मुचुकुन्दगतिप्रदः । रुक्मिणीहारको
    रुक्मिवीर्यहन्ताऽपराजितः ॥। ७७॥ परिगृहीतस्यमन्तकः धृतजाम्बवतीकरः । सत्यभामापतिश्चैव शतधन्वानिहन्तकः
    ॥ ७८॥ कुन्तीपुत्रगुणग्राही अर्जुनप्रीतिकारकः । नरकारिर्मुरारिश्च बाणहस्तनिकृन्तकः ॥ ७९॥ अपहृतपारिजातः
    देवेन्द्रमदभञ्जकः । नृगमोक्षदः पौण्ड्रकवासुदेवगतिप्रदः ॥ ८०॥ काशिराजशिरच्छेत्ता भस्मीकृतसुदक्षिणः
    । जरासन्धमृत्युकारी शिशुपालगतिप्रदः ॥ ८१॥ साल्वप्राणापहारी च दन्तवक्त्राभिघातकः । युधिष्ठिरोपदेष्टा
    च भीमसेनप्रियङ्करः ॥ ८२॥ अर्जुनाभिन्नमूर्तिश्च माद्रीपुत्रगुरुस्तथा । द्रौपदीरक्षकश्चैव कुन्तीवात्सल्यभाजनः
    ॥ ८३॥ कौरवक्रौर्यसन्दष्टपाञ्चालीशोकनाशकः । कौन्तेयदूतस्तेजस्वी विश्वरूप्रपदर्शकः ॥ ८४॥ निरायुधो निरातङ्को
    जिष्णुसूतो जनार्दनः । गीतोपदेष्टा लोकेशः दुःखमौढ्यनिवारकः ॥ ८५॥ भीष्मद्रोणद्रौणिकर्णाद्यग्निज्वालाप्रशामकः
    । कुचेलपत्नीदारिद्र्यदुःखबाधाविमोचकः ॥ ८६॥ अजः कालविधाता च आर्तिघ्नः सर्वकामदः । अनलो अव्ययो व्यासः
    अरुणानुजवाहनः ॥ ८७॥ अखिलः प्राणदः प्राणः अनिलात्मजसेवितः । आदिभूत अनाद्यन्तः क्षान्तिक्लान्तिविवर्जितः
    ॥ ८८॥ आदितेयो विकुण्ठात्मा वैकुण्ठो विष्टरश्रवाः । इज्यः सुदर्शनो ईड्यः इन्द्रियाणामगोचरः ॥ ८९॥ उत्तमः
    सत्तमो उग्र उदानः प्राणरूपकः । व्यानापानो समानश्च जीवमृत्युविभाजकः ॥ ९०॥ ऊर्ध्वगो ऊहितो ऊह्यः ऊहातीतप्रभाववान्
    । ऋतम्भरो ऋतुधरः सप्तर्षिगणसेवितः ॥ ९१॥ ऋषिगम्यो ऋभुरृद्धिः सनकादिमुनिस्तुतः । एकनाथो एकमूर्तिरीतिबाधाविनाशकः
    ॥ ९२॥ ऐन्धनो एषणीयश्च अनुल्लङ्घितशासनः । ओजस्करो ओषधीशो ओड्रमालाविभूषितः ॥ ९३॥ औषधः सर्वतापानां समानाधिक्यवर्जितः
    । कालभृत्कालदोषघ्नः कार्यज्ञः कर्मकारकः ॥ ९४॥ खड्गी खण्डकः खद्योतः खली खाण्डवदाहकः । गदाग्रजो गदापाणी
    गम्भीरो गर्वनाशकः ॥ ९५॥ घनवर्णो घर्मभानुः घटजन्मनमस्कृतः । चिन्तातीतः चिदानन्दः विश्वभ्रमणकारकः ॥
    ९६॥ छन्दकः छन्दनः छन्नः छायाकारकः दीप्तिमान् । जयो जयन्तो विजयो ज्ञापकः ज्ञानविग्रहः ॥ ९७॥ झर्झरापन्निवारकः
    झणज्झणितनूपुरः । टङ्कटीकप्रणमितः ठक्कुरो दम्भनाशकः ॥ ९८॥ तत्त्वातीतस्तत्त्वमूर्तिः तत्त्वचिन्ताप्रचोदकः
    । दक्षो दाता दयामूर्तिः दाशार्हो दीर्घलोचनः ॥ ९९॥ पराजिष्णुः परन्धामः परानन्दसुख्रपदः । भालनेत्रः
    फणिशायी पुण्यापुण्यफलप्रदः ॥ १००॥ बन्धहीनो लोकबन्धुः बालकृष्णः सताङ्गतिः । भव्यराशिर्भिषग्वर्यः भासुरः
    भूमिपालकः ॥ १०१॥ मधुवैरिः कैटभारिर्मन्त्रज्ञो मन्त्रदर्शकः । यतिवर्यो यजमानः यक्षकर्दमभूषितः ॥ १०२॥
    रङ्गनाथो रघुवरः रसज्ञो रिपुकर्शनः । लक्ष्यो लक्ष्यज्ञो लक्ष्मीकः लक्ष्मीभूमिनिषेवितः ॥ १०३॥ वर्षिष्ठो
    वर्धमानश्च करुणामृतवर्षकः । विश्वो वृद्धो वृत्तिहीनः विश्वजिद्विश्वपावनः ॥ १०४॥ शास्ता शंसितः शंस्तव्यः
    वेदशास्त्रविभावितः । षडभिज्ञः षडाधारपद्मकेन्द्रनिवासकः ॥ १०५॥ सगुणो निर्गुणः साक्षी सर्वजित्साक्षिवर्जितः
    । सौम्यः क्रूरः शान्तमूर्तिः क्षुब्धः क्षोभविनाशकः ॥ १०६॥ हर्षकः हव्यभुक् हव्यः हिताहितविभावकः । व्योम
    व्यापनशीलश्च सर्वव्यापिर्महेश्वरः ॥ १०७॥ नारायणो नारशायी नरायणो नरसखः । नन्दकी चक्रपाणिश्च पाञ्चजन्यप्रघोषकः
    ॥ १०८॥ कुमोदकः पद्महस्तः विश्वरूपो विधिस्तुतः । आदिशेषोऽप्रमेयश्च अनन्तः ज्ञानविग्रहः ॥ १०९॥ भक्तिगम्यः
    परन्धामः परमो भक्तवत्सलः । परञ्ज्योतिः परब्रह्म परमेष्ठिः परात्परः ॥ ११०॥ विश्वाधारो निराधारः सदाचारप्रचारकः
    । महायोगी महावीरो महारूपो महाबलः ॥ १११॥ महाभोगी हविर्भोक्ता महायागफलप्रदः । महासत्त्वो महाशक्तिः महायोद्धा
    महाप्रभुः ॥ ११२॥ महामोहो महाकोपः महापातकनाशकः । शान्तः शान्तिप्रदः शूरः शरणागतपालकः ॥ ११३॥ पद्मपादः
    पद्मगर्भः पद्मपत्रनिभेक्षणः । लोकेशः शर्वः कामेशः कामकोटिसमप्रभः ॥ ११४॥ महातेजा महाब्रह्मा महाज्ञानो
    महातपाः । नीलमेघनिभः श्यामः शुभाङ्गः शुभकारकः ॥ ११५॥ कमनः कमलाकान्तः कामितार्त्थप्रदायकः । योगिगम्यो
    योगरूपो योगी योगेश्वरेश्वरः ॥ ११६॥ भवो भयकरो भानुः भास्करो भवनाशकः । किरिटी कुण्डली चक्री चतुर्बाहुसमन्वितः
    ॥ ११७॥ जगत्प्रभुर्देवदेवः पवित्रः पुरुषोत्तमः । अणिमाद्यष्टसिद्धीशः सिद्धः सिद्धगणेश्वरः ॥ ११८॥ देवो
    देवगणाध्यक्षो वासवो वसुरक्षकः । ओङ्कारः प्रणवः प्राणः प्रधानः प्रक्रमः क्रतुः ॥ ११९॥ नन्दिर्नन्दितो
    नाभ्यो नन्दगोपतपःफलः । मोहनो मोहहन्ता च मैत्रेयो मेघवाहनः ॥ १२०॥ भद्रो भद्रङ्करो भानुः पुण्यश्रवणकीर्तनः
    । गदाधरो गदध्वंसी गम्भीरो गानलोलुपः ॥ १२१॥ तेजसस्तेजसां राशिः त्रिदशस्त्रिदशार्चितः । वासुदेवो वसुभद्रो
    वदान्यो वल्गुदर्शनः ॥ १२२॥ देवकीनन्दनः स्रग्वी सीमातीतविभूतिमान् । वासवो वासराधीशः गुरुवायुपुरेश्वरः
    ॥ १२३॥ यमो यशस्वी युक्तश्च योगनिद्रापरायणः । सूर्यः सुरार्यमार्कश्च सर्वसन्तापनाशकः ॥ १२४॥ शान्ततेजो
    महारौद्रः सौम्यरूपोऽभयङ्करः । भास्वान् विवस्वान् सप्ताश्वः अन्धकारविपाटकः ॥ १२५॥ तपनः सविता हंसः चिन्तामणिरहर्पतिः
    । अरुणो मिहिरो मित्रः नीहारक्लेदनाशकः ॥ १२६॥ आदित्यो हरिदश्वश्च मोहलोभविनाशकः । कान्तः कान्तिमतां
    कान्तिः छायानाथो दिवाकरः ॥ १२७॥ स्थावरजङ्गमगुरुः खद्योतो लोकबान्धवः । कर्मसाक्षी जगच्चक्षुः कालरूपः
    कृपानिधिः ॥ १२८॥ सत्त्वमूर्तिस्तत्त्वमयः सत्यरूपो दिवस्पतिः । शुभ्रांशुश्चन्द्रमा चन्द्रः ओषधीशो निशापतिः
    ॥ १२९॥ मृगाङ्को माः क्षपानाथः नक्षत्रेशः कलानिधिः । अङ्गारको लोहितांशुः कुजो भौमो महीसुतः ॥ १३०॥ रौहिणेयो
    बुधः सौम्यः सर्वविद्याविधायकः । वाचस्पतिर्गुरुर्जीवः सुराचार्यो बृहस्पतिः ॥ १३१॥ उशना भार्गवः काव्यः
    कविः शुक्रोऽसुरगुरुः । सूर्यपुत्रो शनिर्मन्दः सर्वभक्षः शनैश्चरः ॥ १३२॥ विधुन्तुदः तमो राहुः शिखी
    केतुर्विरामदः । नवग्रहस्वरूपश्च ग्रहकोपनिवारकः ॥ १३३॥ दशानाथः प्रीतिकरः मापको मङ्गलप्रदः । द्विहस्तश्च
    महाबाहुः कोटिकोटिभुजैर्युतः ॥ १३४॥ एकमुखो बहुमुखः बहुसाह्रसनेत्रवान् । बन्धकारी बन्धहीनः संसारी बन्धमोचकः
    ॥ १३५॥ ममतारूपोऽहम्बुद्धिः कृतज्ञः काममोहितः । नानामूर्तिधरः शक्तिः भिन्नदेवस्वरूपधृक् ॥ १३६॥ सर्वभूतहरः
    स्थाणुः शर्वो भीमः सदाशिवः । पशुपतिः पाशहीनः जटी चर्मी पिनाकवान् ॥ १३७॥ विनायको लम्बोदरः हेरम्बो विघ्ननाशकः
    । एकदन्तो महाकायः सिद्धिबुद्धिप्रदायकः ॥ १३८॥ गुहः स्कन्दो महासेनः विशाखः शिखिवाहनः । षडाननो बाहुलेयः
    कुमारः क्रौञ्चभञ्जकः ॥ १३९॥ आखण्डलो सहस्राक्षः वलारातिश्शचीपतिः । सुत्रामा गोत्रभिद्वज्री ऋभुक्षा
    वृत्रहा वृषा ॥ १४०॥ ब्रह्मा प्रजापतिर्धाता पद्मयोनिः पितामहः । सृष्टिकर्ता सुरज्येष्ठः विधाता विश्वसृट्
    विधिः ॥ १४१॥ प्रद्युम्नो मदनो कामः पुष्पबाणो मनोभवः । लक्ष्मीपुत्रो मीनकेतुरनङ्गः पञ्चशरः स्मरः ॥
    १४२॥ कृष्णपुत्रो शर्वजेता इक्षुचापो रतिप्रियः । शम्बरघ्नो विश्वजिष्णुर्विश्वभ्रमणकारकः ॥ १४३॥ बर्हिः
    शुष्मा वायुसखः आश्रयाशो विभावसुः । ज्वालामाली कृष्णवर्त्मा हुतभुक् दहनः शुची ॥ १४४॥ अनिलः पवनो वायुः
    पृषदश्वः प्रभञ्जनः । वातः प्राणो जगत्प्राणः गन्धवाहः सदागतिः ॥ १४५॥ पाशायुधो नदीकान्तः वरुणो यादसाम्पतिः
    । राजराजो यक्षराजः पौलस्त्यो नरवाहनः ॥ १४६॥ निधीशः त्र्यम्बकसखः एकपिङ्गो धनेश्वरः । देवेशो जगदाधारः
    आदिदेवः परात्परः ॥ १४७॥ महात्मा परमात्मा च परमानन्ददायकः । धरापतिः स्वर्पतिश्च विद्यानाथो जगत्पिता
    ॥ १४८॥ पद्महस्तः पद्ममाली पद्मशोभिपदद्वयः । मधुवैरिः कैटभारिः वेदधृक् वेदपालकः ॥ १४९॥ चण्डमुण्डशिरच्छेत्ता
    महिषासुरमर्दकः । महाकालीरूपधरः चामुण्डीरूपधारकः ॥ १५०॥ निशुम्भशुम्भसंहर्ता रक्तबीजासुहारकः । भण्डासुरनिषूदको
    ललितावेषधारकः ॥ १५१॥ ऋषभो नाभिपुत्रश्च इन्द्रदौष्ट्यप्रशामकः । अव्यक्तो व्यक्तरूपश्च नाशहीनो विनाशकृत्
    ॥ १५२॥ कर्माध्यक्षो गुणाध्यक्षः भूतग्रामविसर्जकः । क्रतुर्यज्ञः हुतो मन्त्रः पिता माता पितामहः ॥ १५३॥
    वेद्यो वेदो गतिर्भर्ता साक्षी कारक वेदविद् । भोक्ता भोज्यः भुक्तिकर्म भोज्याभोज्यविवेचकः ॥ १५४॥ सदाचारो
    दुराचारः शुभाशुभफलप्रदः । नित्योऽनित्यः स्थिरश्चलः दृश्यादृश्यः श्रुताश्रुतः ॥ १५५॥ आदिमध्यान्तहीनश्च
    देही देहो गुणाश्रयः । ज्ञानः ज्ञेयः परिज्ञाता ध्यानः ध्याता परिध्येयः ॥ १५६॥ अविभक्तो विभक्तश्च पृथग्रूपो
    गुणाश्रितः । प्रवृत्तिश्च निवृत्तिश्च प्रकृतिर्विकृतिरूपधृक् ॥ १५७॥ बन्धनो बन्धकर्ता च सर्वबन्धविपाटकः
    । पूजितः पूजकश्चैव पूजाकर्मविधायकः ॥ १५८॥ वैकुण्ठवासः स्वर्वासः विकुण्ठहृदयालयः । ब्रह्मबीजो विश्वबिन्दुर्जडजीवविभाजकः
    ॥। १५९॥ पिण्डाण्डस्थः परन्धामः शब्दब्रह्मस्वरूपकः । आधारषट्कनिलयः जीवव्यापृतिचोदकः ॥ १६०॥ अनन्तरूपो
    जीवात्मा तिग्मतेजाः स्वयम्भवः । अनाद्यन्तः कालरूपः गुरुवायुपुरेश्वरः ॥ १६१॥ गूरुर्गुरुतमो गम्यो गन्धर्वगणवन्दितः
    । रुक्मिणीवल्लभः शौरिर्बलरामसहोदरः ॥ १६२॥ परमः परमोदारः पन्नगाशनवाहनः । वनमाली वर्धमानः वल्लवीवल्लभो
    वशी ॥ १६३॥ नन्दसूनुर्नित्यतृप्तः नष्टलाभविवर्जितः । पुरन्दरः पुष्कराक्षः योगिहृत्कमलालयः ॥ १६४॥ रेणुकातनयो
    रामः कार्तवीर्यकुलान्तकः । शरण्यः शरणः शान्तः शाश्वतः स्वस्तिदायकः ॥ १६५॥ रोगघ्नः सर्वपापघ्नः कर्मदोषभयापहः
    । गभस्तिमाली गर्वघ्नो गर्गशिष्यो गवप्रियः ॥ १६६॥ तापसो तापशमनः ताण्डवप्रियनन्दितः । पङ्क्तिस्यनपुत्रश्च
    कौसल्यानन्दवर्धनः ॥ १६७॥ प्रथितः प्रग्रहः प्राज्ञः प्रतिबन्धनिवारकः । शत्रुञ्जयो शत्रुहीनः शरभङ्गगतिप्रदः
    ॥ १६८॥ मङ्गलो मङ्गलाकान्तः सर्वमङ्गलमङ्गलः । यज्ञमूर्तिर्विश्वमूर्तिरायुरारोग्यसौख्यदः ॥ १६९॥ योगीन्द्राणां
    त्वदङ्गेष्वधिकसुमधुरं मुक्तिभाजां निवासो भक्तानां कामवर्षद्युतरुकिसलयं नाथ ते पादमूलम् । नित्यं चित्तस्थितं
    मे पवनपुरपते
