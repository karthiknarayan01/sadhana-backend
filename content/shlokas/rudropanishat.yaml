id: rudropanishat
category: upanishad
name:
  english: rudropanishat
  devanagari: रुद्रोपनिषत्
content:
  english: tasmatpranalingi shivah | shiva eva pranalingi | jatabhasmadharo'pi pranajalingi hi shreshthah
    | pranalingi shivarupah | shivarupah pranalingi | jangamarupah shivah | shiva eva jangamarupah | pranalinginam
    shuddhasiddhirna bhavati | pranalinginam jangamapujyanam pujyatapasvinamadhikashcandalo'pi pranalingi
    | tasmatpranalingi vishesha ityaha | ya evam veda sa shivah | shiva eva rudrah pranalingi nanyo bhavati
    || om atma parashivadvayo guruh shivah | gurunam sarvavishvamidam vishvamantrena dharyam | daivadhinam
    jagadidam | taddaivam tanmantrat tanute | tanme daivam gururiti | gurunam sarvajnaninam guruna dattametadannam
    parabrahma | brahma svanubhutih | guruh shivo devah | guruh shiva eva lingam | ubhayormishraprakashatvat
    | pranavattvat maheshvaratvacca shivastadaiva guruh | yatra gurustatra shivah | shivagurusvarupo maheshvarah
    | bhramarakotakaryena dikshitah shivayoginah shivapujapathe gurupujavidhau ca mashvarapujananmuktah
    | lingabhishekam nirmalyam gurorabhishekatirtham maheshvarapadodakam janmamalinyam kshalayanti | tesham
    pritih shivapritih | tesham triptih shivatriptih | taishca pavano vasah | tesham nirasanam shivanirasanam
    | anandaparayanah | tasmacchivam vrajantu | gurum vrajantu | ityeva pavanam ||
  devanagari: तस्मात्प्राणलिङ्गी शिवः । शिव एव प्राणलिङ्गी । जटाभस्मधारोऽपि प्राणजलिङ्गी हि श्रेष्ठः ।
    प्राणलिङ्गी शिवरूपः । शिवरूपः प्राणलिङ्गी । जङ्गमरूपः शिवः । शिव एव जङ्गमरूपः । प्राणलिङ्गिनां शुद्धसिद्धिर्न
    भवति । प्राणलिङ्गिनां जङ्गमपूज्यानां पूज्यतपस्विनामधिकश्चण्डालोऽपि प्राणलिङ्गी । तस्मात्प्राणलिङ्गी
    विशेष इत्याह । य एवं वेद स शिवः । शिव एव रुद्रः प्राणलिङ्गी नान्यो भवति ॥ ॐ आत्मा परशिवद्वयो गुरुः
    शिवः । गुरूणां सर्वविश्वमिदं विश्वमन्त्रेण धार्यम् । दैवाधीनं जगदिदम् । तद्दैवं तन्मन्त्रात् तनुते
    । तन्मे दैवं गुरुरिति । गुरूणां सर्वज्ञानिनां गुरुणा दत्तमेतदन्नं परब्रह्म । ब्रह्म स्वानुभूतिः ।
    गुरुः शिवो देवः । गुरुः शिव एव लिङ्गम् । उभयोर्मिश्रप्रकाशत्वात् । प्राणवत्त्वात् महेश्वरत्वाच्च शिवस्तदैव
    गुरुः । यत्र गुरुस्तत्र शिवः । शिवगुरुस्वरूपो महेश्वरः । भ्रमरकोटकार्येण दीक्षिताः शिवयोगिनः शिवपूजापथे
    गुरुपूजाविधौ च मश्वरपूजनान्मुक्ताः । लिङ्गाभिषेकं निर्माल्यं गुरोरभिषेकतीर्थं महेश्वरपादोदकं जन्ममालिन्यं
    क्षालयन्ति । तेषां प्रीतिः शिवप्रीतिः । तेषां तृप्तिः शिवतृप्तिः । तैश्च पावनो वासः । तेषां निरसनं
    शिवनिरसनम् । आनन्दपारायणः । तस्माच्छिवं व्रजन्तु । गुरुं व्रजन्तु । इत्येव पावनम् ॥
