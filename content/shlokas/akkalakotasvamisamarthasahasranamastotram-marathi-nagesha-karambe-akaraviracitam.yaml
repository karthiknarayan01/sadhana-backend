id: akkalakotasvamisamarthasahasranamastotram-marathi-nagesha-karambe-akaraviracitam
category: sahasranama
name:
  english: akkalakotasvamisamarthasahasranamastotram marathi (nagesha karambeḻakaraviracitam)
  devanagari: अक्कलकोटस्वामीसमर्थसहस्रनामस्तोत्रं मराठी (नागेश करंबेळकरविरचितम्)
content:
  english: vibhramahara rudramukhe | suravarapujita munijanavamdita dinaparayana bhavaushadhe jaya gunavamta
    nija bhagavamta svami samartha kripanidhe || 26|| koticamdra sushitala shamta shatanamda anamdamaya
    kamari shitikamtha kathora pramathadhipate giripriya | lalataksha virupaksha pinaki trilokesha shri
    maheshvara jaya gunavamta nija bhagavamta svami samartha kripakara || 27|| bhujamgabhushana soma sadashiva
    samapriya hari kapardine bhasmodhdulitavigraha havisha dakshadhvarahara trilocane | vishnuvallabha
    nilalohita vrishamka sharva anishvara jaya gunavamta nija bhagavamta svami samartha kripakara || 28||
    vamadeva kailasanivasi vrishabharudha vishakamtha shishta vishishta tvashta sushta shreshtha kanishtha
    shipivishta | ishta anishta tushtatushta tuca pragatavi ritambhara jaya gunavamta nija bhagavamta
    svami samartha kripakara || 29|| shrikara shreya vasurvasumana dhanya sumedha aniruddha sumukha sughosha
    sukhada sukshma suhrida manohara satkarta | skanda skandadhara vriddhatma shatavarta shashvata sthira
    jaya gunavamta nija bhagavamta svami samartha kripakara || 30|| suranamda govimda samirana vacaspati
    madhu medhavi hamsa suparna hiranyanabha padmanabha keshava havi | brahma brahmavivardhana brahmi
    sumdara siddha sulocana jaya gunavamta nija bhagavamta svami samartha kripakara || 31|| ghana ghananiḻa
    saghana ghananada ghanahshyama ghanaghora nabha megha meghahshyama shubhamga meghasvana manabhora
    vibha | dhumravarna dhumrambara dhumra dhumragamdha dhumratishaya jaya gunavamta nija bhagavamta svami
    samartha kripakara || 32|| mahakaya manamohana mamtra mahamamtra he mahadrupa trikalajna he trishulapani
    tripadapurusha trivishtapa | durjanadamana durgunashamana durmatimarshana duritahara jaya gunavamta
    nija bhagavamta svami samartha kripakara || 33|| pranapana vyana udana samana gunakara vyadhihara
    brahma vishnu rudra imdra tum agni vayu surya camdrama | dehatrayatita kalatrayatita gunatita tum
    guruvara jaya gunavamta nija bhagavamta svami samartha kripakara || 34|| matsya kurma tu varaha shesha
    vamana parashurama mahana pamdhari viththala girivara vishnu ramakrishna tu shri hanumana | tuca bhavani
    kali amba gauri durga shaktivara jaya gunavamta nija bhagavamta svami samartha kripakara || 35|| sarveshvaravara
    amaleshvaravara bhimashamkara atmarama trilokapavana patitapavana raghupati raghava rajarama | omkareshvara
    kedareshvara vriddheshvara tu abhayakara jaya gunavamta nija bhagavamta svami samartha kripakara ||
    36|| sheshabharana sheshabhushana sheshashayi mahodadhe purnanamda purna paresha shadbhuja yativara
    gurumurte | shashvatamurte shadbhujamurte akhilamtaka patitoddhara jaya gunavamta nija bhagavamta
    svami samartha kripakara || 37|| sabha sabhapati vrata vratapati kakubha nishangi harikesha | shiva
    shivatara shivatama shanga bheshajagrama mayaskara | urvi urvara dvipada catushpada pashupati pathipati
    annapate jaya gunavamta nija bhagavamta svami samartha kripanidhe || 38|| vriksha vrikshapati giricara
    sthapati vanija mamtri kakshapati ashva ashvapati senani rathi rathapati dishapati shruta shrutasena
    shura dumdubhi vanapati sharva ishudhimate jaya gunavamta nija bhagavamta svami samartha kripanidhe
    || 39|| mahakalpa kalaksha ayudha sukhada darpada gunabhrita gopatanu devesha pavitra sattvika sakshi
    nirvasa | stutya vibhava sukrita tripada caturvedavida samahita jaya gunavamta nija bhagavamta svami
    samartha kripakara || 40|| nakta mukta sthira nara dharmi sahasrashirsha tejishtha kalpataru prabhu
    mahanada gati khaga ravi dinamani tu savita | damta niramtara samta niramta ashirya akshaya avyathita
    | jaya gunavamta nija bhagavamta svami samartha kripakara || 41|| amtaryami amtarjnani amtahsthita
    nita amtahstha jnanapravartaka mohanivartaka tattvamasi khalu svanubhava | padmapada padmasana padma
    padmanana he padmakara jaya gunavamta nija bhagavamta svami samartha kripakara || 42|| jaya gunavamta
    nija bhagavamta svami samartha kripakara | jaya gunavamta nija bhagavamta svami samartha kripakara
    | shri gurudeva datta | shri gurudeva datta | shri svami samartha maharaja ki jaya | racayita shriyut
    nagesha karambeḻakara
  devanagari: विभ्रमहर रुद्रमुखे । सुरवरपूजित मुनिजनवंदित दीनपरायण भवौषधे जय गुणवंता निज भगवंता स्वामी
    समर्था कृपानिधे ॥ २६॥ कोटीचंद्र सुशीतल शांता शतानंद आनंदमया कामारि शितिकंठ कठोरा प्रमथाधिपते गिरिप्रिया
    । ललाटाक्ष विरुपाक्ष पिनाकी त्रिलोकेश श्री महेश्वरा जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा ॥
    २७॥ भुजंगभूषण सोम सदाशिव सामप्रिय हरि कपर्दिने भस्मोध्दूलितविग्रह हविषा दक्षाध्वरहर त्रिलोचने । विष्णुवल्लभा
    नीललोहिता वृषांक शर्वा अनीश्वरा जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा ॥ २८॥ वामदेव कैलासनिवासी
    वृषभारूढा विषकंठा शिष्ट विशिष्टा त्वष्टा सुष्टा श्रेष्ठ कनिष्ठा शिपिविष्टा । इष्ट अनिष्टा तुष्टातुष्टा
    तूच प्रगटवी ऋतंभरा जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा ॥ २९॥ श्रीकर श्रेया वसुर्वसुमना धन्य
    सुमेधा अनिरुद्धा सुमुख सुघोषा सुखदा सूक्ष्मा सुहृद मनोहर सत्कर्ता । स्कन्दा स्कन्दधरा वृद्धात्मा शतावर्त
    शाश्वत स्थिरा जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा ॥ ३०॥ सुरानंद गोविंद समीरण वाचस्पति मधु
    मेधावी हंस सुपर्णा हिरण्यनाभा पद्मनाभ केशवा हवी । ब्रह्मा ब्रह्मविवर्धन ब्रह्मी सुंदर सिद्धा सुलोचना
    जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा ॥ ३१॥ घन घननीळ सघन घननादा घनःश्याम घनघोर नभा मेघा मेघःश्याम
    शुभांगा मेघस्वन मनभोर विभा । धूम्रवर्ण धूम्रांबर धूम्रा धूम्रगंध धूम्रातिशया जय गुणवंता निज भगवंता
    स्वामी समर्था कृपाकरा ॥ ३२॥ महाकाय मनमोहन मंत्रा महामंत्र हे महद्रुपा त्रिकालज्ञ हे त्रिशूलपाणि त्रिपादपुरुषा
    त्रिविष्टपा । दुर्जनदमना दुर्गुणशमना दुर्मतिमर्षण दुरितहरा जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा
    ॥ ३३॥ प्राणापाना व्यान उदाना समान गुणकर व्याधिहरा ब्रह्मा विष्णू रुद्र इंद्र तूं अग्नि वायू सूर्य
    चंद्रमा । देहत्रयातीत कालत्रयातीत गुणातीत तूं गुरुवरा जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा
    ॥ ३४॥ मत्स्य कूर्म तू वराह शेषा वामन परशूराम महान पंढरी विठ्ठल गिरिवर विष्णू रामकृष्ण तू श्री हनुमान
    । तूच भवानी काली अंबा गौरी दुर्गा शक्तिवरा जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा ॥ ३५॥ सर्वेश्वरवर
    अमलेश्वरवर भीमाशंकर आत्माराम त्रिलोकपावन पतीतपावन रघुपति राघव राजाराम । ओंकारेश्वर केदारेश्वर वृद्धेश्वर
    तू अभयकरा जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा ॥ ३६॥ शेषाभरणा शेषभूषणा शेषाशायी महोदधे पूर्णानंदा
    पूर्ण परेशा षड्भुज यतिवर गुरुमूर्ते । शाश्वतमूर्ते षड्भुजमूर्ते अखिलांतक पतितोद्धारा जय गुणवंता निज
    भगवंता स्वामी समर्था कृपाकरा ॥ ३७॥ सभा सभापति व्रात व्रातपति ककुभ निषङ्गी हरिकेशा । शिवा शिवतरा शिवातम
    षङ्गा भेषजग्रामा मयस्करा । उर्वि उर्वरा द्विपद चतुष्पद पशुपति पथिपति अन्नपते जय गुणवंता निज भगवंता
    स्वामी समर्था कृपानिधे ॥ ३८॥ वृक्ष वृक्षपति गिरिचर स्थपति वाणिज मंत्रि कक्षपति अश्व अश्वपति सेनानी
    रथि रथापती दिशापती श्रुत श्रुतसेना शूर दुंदुभि वनपति शर्वा इषुधिमते जय गुणवंता निज भगवंता स्वामी समर्था
    कृपानिधे ॥ ३९॥ महाकल्प कालाक्ष आयुधा सुखद दर्पदा गुणभृता गोपतनु देवेश पवित्रा सात्त्विक साक्षी निर्वासा
    । स्तुत्या विभवा सुकृत त्रिपदा चतुर्वेदविद समाहिता जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा ॥ ४०॥
    नक्ता मुक्ता स्थिर नर धर्मी सहस्रशीर्षा तेजिष्ठा कल्पतरू प्रभू महानाद गति खग रवि दिनमणि तू सविता ।
    दांत निरंतर सांत निरंता अशीर्य अक्षय अव्यथिता । जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा ॥ ४१॥
    अंतर्यामी अंतर्ज्ञानी अंतःस्थित नित अंतःस्था ज्ञानप्रवर्तक मोहनिवर्तक तत्त्वमसि खलु स्वानुभवा । पद्मपाद
    पद्मासन पद्मा पद्मानन हे पद्मकरा जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा ॥ ४२॥ जय गुणवंता निज
    भगवंता स्वामी समर्था कृपाकरा । जय गुणवंता निज भगवंता स्वामी समर्था कृपाकरा । श्री गुरुदेव दत्त । श्री
    गुरुदेव दत्त । श्री स्वामी समर्थ महाराज की जय । रचयिता श्रीयुत् नागेश करंबेळकर
