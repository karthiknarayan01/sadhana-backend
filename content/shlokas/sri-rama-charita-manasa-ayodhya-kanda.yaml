    मोहि नहि सूझा। को जिय कै रघुबर बिनु बूझा ॥ एकहिं आँक इहि मन माहीं। प्रातकाल चलिहुँ प्रभु पाहीम् ॥
    जद्यपि मैं अनभल अपराधी। भै मोहि कारन सकल उपाधी ॥ तदपि सरन सनमुख मोहि देखी। छमि सब करिहहिं कृपा बिसेषी
