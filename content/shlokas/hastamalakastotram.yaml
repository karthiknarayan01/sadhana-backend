id: hastamalakastotram
category: stotram
name:
  english: hastamalakastotram
  devanagari: हस्तामलकस्तोत्रम्
content:
  english: shudrah | na brahmacari na grihi vanastho bhikshurna caham nijabodha rupah ||2|| nimittam manashcakshuradi
    pravrittau nirastakhilopadhirakashakalpah | ravirlokaceshtanimittam yatha yah sa nityopalabdhisvarupo'hamatma
    ||3|| yamagnyushnavannityabodha svarupam manashcakshuradinyabodhatmakani | pravartanta ashritya nishkampamekam
    sa nityopalabdhisvarupo'hamatma ||4|| mukhabhasako darpane drishyamano mukhatvat prithaktvena naivasti
    vastu | cidabhasako dhishu jivo'pi tadvat sa nityopalabdhisvarupo'hamatma ||5|| yatha darpanabhava
    abhasahanau mukham vidyate kalpanahinamekam | tatha dhi viyoge nirabhasako yah sa nityopalabdhisvarupo'hamatma
    ||6|| manashcakshuraderviyuktah svayam yo manashcakshuradermanashcakshuradih | manashcakshuraderagamyasvarupah
    sa nityopalabdhisvarupo'hamatma ||7|| ya eko vibhati svatah shuddhacetah prakashasvarupo'pi naneva
    dhishu sharavodakastho yatha bhanurekah sa nityopalabdhisvarupo'hamatma ||8|| yatha'nekacakshuh
  devanagari: शूद्राः । न ब्रह्मचारी न गृही वनस्थो भिक्षुर्न चाहं निजबोध रूपः ।।२।। निमित्तं मनश्चक्षुरादि
    प्रवृत्तौ निरस्ताखिलोपाधिराकाशकल्पः । रविर्लोकचेष्टानिमित्तं यथा यः स नित्योपलब्धिस्वरूपोऽहमात्मा
    ।।३।। यमग्न्युष्णवन्नित्यबोध स्वरूपं मनश्चक्षुरादीन्यबोधात्मकानि । प्रवर्तन्त आश्रित्य निष्कम्पमेकं
    स नित्योपलब्धिस्वरूपोऽहमात्मा ।।४।। मुखाभासको दर्पणे दृश्यमानो मुखत्वात् पृथक्त्वेन नैवास्ति वस्तु
    । चिदाभासको धीषु जीवोऽपि तद्वत् स नित्योपलब्धिस्वरूपोऽहमात्मा ।।५।। यथा दर्पणाभाव आभासहानौ मुखं विद्यते
    कल्पनाहीनमेकम् । तथा धी वियोगे निराभासको यः स नित्योपलब्धिस्वरूपोऽहमात्मा ।।६।। मनश्चक्षुरादेर्वियुक्तः
    स्वयं यो मनश्चक्षुरादेर्मनश्चक्षुरादिः । मनश्चक्षुरादेरगम्यस्वरूपः स नित्योपलब्धिस्वरूपोऽहमात्मा ।।७।।
    य एको विभाति स्वतः शुद्धचेताः प्रकाशस्वरूपोऽपि नानेव धीषु शरावोदकस्थो यथा भानुरेकः स नित्योपलब्धिस्वरूपोऽहमात्मा
    ।।८।। यथाऽनेकचक्षुः
