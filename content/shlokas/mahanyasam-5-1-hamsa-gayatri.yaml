id: mahanyasam-5-1-hamsa-gayatri
category: stotram
name:
  english: Mahanyasam - 5.1. Hamsa Gayatri
content:
  english: asya shri hamsagayatri mahamantrasya avyakta parabrahma rishih paramahamso devata | hamsa nkilakam
    | paramahamsa prasada siddhyarthe jape viniyogah || shirase svaha | hamsum netratrayaya vaushat |
    hamsah mbhurbhuvassuvaromiti digbandhah | ntimirapaharam | pashyami te sarvajanantarastha deho devalayah
    prokto jivo deva ssanatanah | tyajedajnananirmalyam so 'hambhavena pujayet || hamsa hamsaya vidmahe
    paramahamsaya dhimahi | tanno hamsah pracodaya hamsa hamseti yo bruya
  devanagari: अस्य श्री हंसगायत्री महामन्त्रस्य अव्यक्त परब्रह्म ऋषिः परमहंसो देवता । हंसा ङ्कीलकम् ।
    परमहंस प्रसाद सिद्ध्यर्थे जपे विनियोगः ॥ शिरसे स्वाहा । हंसूं नेत्रत्रयाय वौषट् । हंसः म्भूर्भुव॒स्सुव॒रोमिति
    दिग्बन्धः । न्तिमिरापहारम् । पश्यामि ते सर्वजनान्तरस्थ देहो देवालयः प्रोक्तो जीवो देव स्सनातनः । त्यजेदज्ञाननिर्माल्यं
    सो ऽहम्भावेन पूजयेत् ॥ हं॒स हं॒साय॑ वि॒द्महे॑ परमहं॒साय॑ धीमहि । तन्नो॑ हंसः प्रचो॒दया हंस हं॒सेति
    यो ब्रूया
