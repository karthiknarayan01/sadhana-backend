id: anandasagarastava
category: stotram
name:
  english: anandasagarastava
  devanagari: अनन्दसगरस्तव
content:
  english: gvijnaya yadvitanute tvayi bhavabandham | sa bhaktirityabhimatam yadi siddhamishtam vyartham
    visheshyamalamastu visheshanam nah || 23|| svatmetaratvamavadharya paratvabuddhya yatpriyate gurujaneshviva
    saiva bhaktih | syadetadevamiyameva tu me jihasya dvaitabhramatkimadhikam bhavabandhamulam || 24||
    sevaiva bhaktiriti karmapathapraveshah sevyaprasadaphalaka kila karmaseva | dhyanapravaha iti cecchravanat
    tritiyah prageva matarayamakalito'bhyupayah || 25|| atraiva dasyasi vimuktimathapi yace matah sharirapatanam
    manikarnikayam | astu svakrityamanukampanamishvaranam dasasya karmakarataiva tatha svakrityam || 26||
    sadyo bhavetsukritinamupadeshalabhah papatmanam bahutithe samaye vyatite | ityadibhih kila puranavacobhiramba
    varanasimapi na yacitumutsuko'smi || 27|| akrantamantararibhih madamatsaradyaih gatram valipalita
  devanagari: ग्विज्ञाय यद्वितनुते त्वयि भावबन्धम् । सा भक्तिरित्यभिमतं यदि सिद्धमिष्टं व्यर्थं विशेष्यमलमस्तु
    विशेषणं नः ॥ २३॥ स्वात्मेतरत्वमवधार्य परत्वबुद्ध्या यत्प्रीयते गुरुजनेष्विव सैव भक्तिः । स्यादेतदेवमियमेव
    तु मे जिहास्या द्वैतभ्रमात्किमधिकं भवबन्धमूलम् ॥ २४॥ सेवैव भक्तिरिति कर्मपथप्रवेशः सेव्यप्रसादफलका
    किल कर्मसेवा । ध्यानप्रवाह इति चेच्छ्रवणात् तृतीयः प्रागेव मातरयमाकलितोऽभ्युपायः ॥ २५॥ अत्रैव दास्यसि
    विमुक्तिमथापि याचे मातः शरीरपतनं मणिकर्णिकायाम् । अस्तु स्वकृत्यमनुकम्पनमीश्वराणां दासस्य कर्मकरतैव
    तथा स्वकृत्यम् ॥ २६॥ सद्यो भवेत्सुकृतिनामुपदेशलाभः पापात्मनां बहुतिथे समये व्यतीते । इत्यादिभिः किल
    पुराणवचोभिरम्ब वाराणसीमपि न याचितुमुत्सुकोऽस्मि ॥ २७॥ आक्रान्तमन्तररिभिः मदमत्सराद्यैः गात्रं वलीपलित
