id: kamakhyamantrakramah
category: mantra
name:
  english: kamakhyamantrakramah
  devanagari: कामाख्यामन्त्रक्रमः
content:
  english: asya shrimahatripurasundarikamakhyamantrasya parameshthi rishih | jagati chandah | shrimahatripurasundari
    devata | hrim bijam | shrim shaktih | klim kilakam | mama sarvasaubhagyajnanamokshasiddhaye jape viniyogah
    || karanyasah
  devanagari: अस्य श्रीमहात्रिपुरसुन्दरीकामाख्यामन्त्रस्य परमेष्ठी ऋषिः । जगती छन्दः । श्रीमहात्रिपुरसुन्दरी
    देवता । ह्रीं बीजम् । श्रीं शक्तिः । क्लीं कीलकम् । मम सर्वसौभाग्यज्ञानमोक्षसिद्धये जपे विनियोगः ॥
    करन्यासः
meaning: {}
