id: mucukundastutihgargasamhita
category: stotram
name:
  english: mucukundastutihgargasamhita
  devanagari: मुचुकुन्दस्तुतिःगर्गसम्हिता
content:
  english: krishnaya vasudevaya devakinandanaya ca | nandagopakumaraya govindaya namo namah || 1|| namah
    pankajanabhaya namah pankajamaline | namah pankajanetraya namaste pankajanghraye || 2|| namah krishnaya
    shuddhaya brahmane paramatmane | pranatakleshanashaya govindaya namo namah || 3|| namo'stvanantaya
    sahasramurtaye sahasrapadakshishirorubahave | sahasranamne purushaya shashvate sahasrakotiyugadharine
    namah || 4|| hare matsamah pataki nasti bhumau tatha tvatsamo nasti papapahari | iti tvam ca matva
    jagannatha deva yatheccha bhavette tatha mam kuru tvam || 5|| iti gargasamhitayam dvarakakhande dvitiyadhyayantargata
    mucukundastutih samapta |
  devanagari: कृष्णाय वासुदेवाय देवकीनन्दनाय च । नन्दगोपकुमाराय गोविन्दाय नमो नमः ॥ १॥ नमः पङ्कजनभाय नमः
    पङ्कजमालिने । नमः पङ्कजनेत्राय नमस्ते पङ्कजाङ्घ्रये ॥ २॥ नमः कृष्णाय शुद्धाय ब्रह्मणे परमात्मने ।
    प्रणतक्लेशनाशाय गोविन्दाय नमो नमः ॥ ३॥ नमोऽस्त्वनन्ताय सहस्रमूर्तये सहस्रपादाक्षिशिरोरुबाहवे । सहस्रनाम्ने
    पुरुषाय शाश्वते सहस्रकोटीयुगधारिणे नमः ॥ ४॥ हरे मत्समः पातकी नास्ति भूमौ तथा त्वत्समो नास्ति पापापहारी
    । इति त्वं च मत्वा जगन्नाथ देव यथेच्छा भवेत्ते तथा मां कुरु त्वम् ॥ ५॥ इति गर्गसंहितायां द्वारकाखण्डे
    द्वितीयाध्यायान्तर्गता मुचुकुन्दस्तुतिः समाप्ता ।
meaning: {}
