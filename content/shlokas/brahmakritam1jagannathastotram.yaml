id: brahmakritam1jagannathastotram
category: stotram
name:
  english: brahmakritam1jagannathastotram
  devanagari: ब्रह्मकृतं१जगन्नाथस्तोत्रम्
content:
  english: 20|| gunatita gunadhara trigunatmannamo'stu te || 21|| tvanmayaya mohito'ham srishtimatraparayanah
    | adyapi na labhe sharma antaryyaminnamostu te || 22|| tvannabhipankajajjato nityam tatraiva samstuvan
    | natikramitumisho'smi mayam te ko'nya ishvarah || 23|| aham yathandamadhye'smin racitah srishtikarmani
    | tathanulomakalita brahmande brahmakotayah || 24|| sarddhatrikotisankhyanam virincinamapi prabho
    | naiko'pi tattvato vetti yathaham tvatpurah sthitah || 25|| namo'cintyamahimne te cidrupaya namo
    namah | namo devadhidevaya devadevaya te namah || 26|| divyadivyasvarupaya divyarupaya te namah |
    jaramrityuvihinaya mrityurupaya te namah || 27|| jvaladagnisvarupaya mrityorapi ca mrityave | prapannamrityunashaya
    sahajanandarupine | bhaktipriyaya jagatam matre pitre namo namah || 28|| pranatartivinashaya nityodyoginnamo'stu
    te | namo namaste dinanam kripasahajasindhave || 29|| paraya pararupaya paramparaya te namah | aparaparabhutaya
    brahmarupaya te namah || 2
  devanagari: २०॥ गुणातीत गुणाधार त्रिगुणात्मन्नमोऽस्तु ते ॥ २१॥ त्वन्मायया मोहितोऽहं सृष्टिमात्रपरायणः
    । अद्यापि न लभे शर्म अन्तर्य्यामिन्नमोस्तु ते ॥ २२॥ त्वन्नाभिपङ्कजाज्जातो नित्यं तत्रैव संस्तुवन्
    । नातिक्रमितुमीशोऽस्मि मायां ते कोऽन्य ईश्वरः ॥ २३॥ अहं यथाण्डमध्येऽस्मिन् रचितः सृष्टिकर्मणि । तथानुलोमकलिता
    ब्रह्माण्डे ब्रह्मकोटयः ॥ २४॥ सार्द्धत्रिकोटिसङ्ख्यानां विरिञ्चीनामपि प्रभो । नैकोऽपि तत्त्वतो वेत्ति
    यथाहं त्वत्पुरः स्थितः ॥ २५॥ नमोऽचिन्त्यमहिम्ने ते चिद्रूपाय नमो नमः । नमो देवाधिदेवाय देवदेवाय ते
    नमः ॥ २६॥ दिव्यादिव्यस्वरूपाय दिव्यरूपाय ते नमः । जरामृत्युविहीनाय मृत्युरूपाय ते नमः ॥ २७॥ ज्वलदग्निस्वरूपाय
    मृत्योरपि च मृत्यवे । प्रपन्नमृत्युनाशाय सहजानन्दरूपिणे । भक्तिप्रियाय जगतां मात्रे पित्रे नमो नमः
    ॥ २८॥ प्रणतार्तिविनाशाय नित्योद्योगिन्नमोऽस्तु ते । नमो नमस्ते दीनानां कृपासहजसिन्धवे ॥ २९॥ पराय पररूपाय
    परम्पाराय ते नमः । अपारपारभूताय ब्रह्मरूपाय ते नमः ॥ २
