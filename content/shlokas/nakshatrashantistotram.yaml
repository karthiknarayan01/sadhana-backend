id: nakshatrashantistotram
category: stotram
name:
  english: nakshatrashantistotram
  devanagari: नक्षत्रशान्तिस्तोत्रम्
content:
  english: nakshatrashantistotram krittika parama devi rohini ruciranana || 1|| shriman mrigashira bhadra
    ardra ca paramojjvala | punarvasustatha pushya ashlesha'tha mahabala || 2|| nakshatramataro hyetah
    prabhamalavibhushitah | mahadeva'rcane shakta mahadeva'nubhavitah || 3|| purvabhage sthita hyetah
    shantim kurvantu me sada | magha sarvagunopeta purva caiva tu phalguni || 4|| uttara phalguni shreshtha
    hasta citra tathottama | svati vishakha varada dakshinasthanasamsthitah || 5|| arcayanti sadakalam
    devam tribhuvaneshvaram | nakshatramaro hyetastejasaparibhushitah || 6|| mama'pi shantikam nityam
    kurvantu shivacoditah | anuradha tatha jyeshtha mulamriddhibalanvitam || 7||
  devanagari: नक्षत्रशान्तिस्तोत्रम् कृत्तिका परमा देवी रोहिणी रुचिरानना ॥ १॥ श्रीमान् मृगशिरा भद्रा आर्द्रा
    च परमोज्ज्वला । पुनर्वसुस्तथा पुष्य आश्लेषाऽथ महाबला ॥ २॥ नक्षत्रमातरो ह्येताः प्रभामालाविभूषिताः
    । महादेवाऽर्चने शक्ता महादेवाऽनुभावितः ॥ ३॥ पूर्वभागे स्थिता ह्येताः शान्तिं कुर्वन्तु मे सदा । मघा
    सर्वगुणोपेता पूर्वा चैव तु फाल्गुनी ॥ ४॥ उत्तरा फाल्गुनी श्रेष्ठा हस्ता चित्रा तथोत्तमा । स्वाती विशाखा
    वरदा दक्षिणस्थानसंस्थिताः ॥ ५॥ अर्चयन्ति सदाकालं देवं त्रिभुवनेश्वरम् । नक्षत्रमारो ह्येतास्तेजसापरिभूषिताः
    ॥ ६॥ ममाऽपि शान्तिकं नित्यं कुर्वन्तु शिवचोदिताः । अनुराधा तथा ज्येष्ठा मूलमृद्धिबलान्वितम् ॥ ७॥
