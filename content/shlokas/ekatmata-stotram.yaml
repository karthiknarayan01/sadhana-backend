id: ekatmata-stotram
category: stotram
name:
  english: Ekatmata Stotram
content:
  english: om saccidananda rupaya namostu paramatmane | jyotirmaya svarupaya vishvamangalyamurtaye ||
    prakritih panca bhutani grahalokah svara stadha | dishah kalashca sarvesham sada kurvantu mangalam
    || ratnakara dhautapadam himalaya kiritinim | brahmarajarshi ratnadhyam vande bharata mataram || mahendro
    malayah sahyo devatatma himalayah | dhyeyo raivatako vindhyo girishcaravalistadha || ganga sarasvati
    sindhur brahmaputrashca gandaki | kaveri yamuna reva krishnagoda mahanadi || ayodhya madhura maya
    kashikanci avantika | vaishali dvarika dhyeya puri takshashila gaya || prayagah patali putram vijayanagaram
    mahat | indraprasdham somanadhah tadhamritasarah priyam || caturvedah puranani sarvopanishadastadha
    | ramayanam bharatam ca gita shaddarshanani ca || jainagama stripitaka gurugrandhah satam girah |
    eshah jnananidhih shreshthah hridi sarvada || arundhatyanasuya ca savitri janaki sati | draupadi kannagi
    gargi mira durgavati tadha || lakshmi rahalya cènnamma rudramamba suvikrama | nivedita sharada ca
    pranamyah matridevatah || shriramo bharatah krishno bhishmo dharma stadharjunah | markandeya harishcandrah
    prahlado narado dhruvah || hanuman janako vyaso vashishthashca shuko balih | dadhici vishvakarmanau
    pridhu valmiki bhargavah || bhagiradhashcaikalavyo manurdhanvantaristadha | shibishca rantidevashca
    puranodgita kirtayah || buddhojinendra gorakshah tiruvalluvarastadha | nayanmaralavarashca kambashca
    basaveshvarah || devalo ravidasashca kabiro gurunanakah | narasistulasidaso dashamesho dridhavratah
    || shrimat shankaradevashca bandhu sayanamadhavau | jnaneshvara stukaramo ramadasah purandarah ||
    viraja sahajanando ramasandstadha mahan | vitarastu sadaivaite daivim sadguna sampadam || bharatarshih
    kalidasah shribhojo jakanastadha | suradasastyagarajo rasakhanashca satkavih || ravivarma bharatakhande
    bhagyacandrah sa bhupatih | kalavantashca vikhyatah smaraniya nirantaram || agastyah kambukaundinyau
    rajendrashcolavamshajah | ashokah pushyamitrashca kharavelah sunitiman || canakya candraguptau ca
    vikramah shalivahanah | samudra guptah shri harshahshailendro bapparavalah || lacit bhaskaravarmaca
    yashodharma ca hunajit | shrikrishnadevarayashca lalitaditya udbalah || musunuri nayaka tau pratapah
    shivabhupatih | ranajit simha ityete vira vikhyata vikramah || vaijnanikashca kapilah kanadah shushrata
    stadha | carako bhaskaracaryo varahamiharah sudhih || nagarjuno bharadvajah aryabhatto vasurbhudhah
    | dhyeyo venkataramashca vijna ramanujadayah || ramakrishno dayanando ravindro ramamohanah | ramatirdho
    ravindashca vivekananda udyashah || dadabhayi gopabandhuh tilako gandhiradritah | ramano malaviyashca
    shri subrahmanya bharati || subhashah pranavanandah krantiviro vinayakah | thakkaro bhimaravashca
    pulenarayano guruh || sanghashaktih pranetarau keshavo madhavashtadha | smaraniya sadaivaite navacaitanyadayakah
    || anukta ye bhaktah prabhucarana samsakta hridayah | avijnata virah adhisamaramuddhvastaripavah ||
    samajoddhartarah suhitakaravijnana nipunah | nama stebhyo bhuyat sakala sujanebhyah pratidinam ||
    idamekatmatastotram shraddhaya yah sada pathet | sa rashtra dharma nishtavan akhandam bharatam smaret
  devanagari: ॐ सच्चिदानन्द रूपाय नमोस्तु परमात्मने । ज्योतिर्मय स्वरूपाय विश्वमाङ्गल्यमूर्तये ॥ प्रकृतिः
    पञ्च भूतानि ग्रहालोकाः स्वरा स्तधा । दिशः कालश्च सर्वेषां सदा कुर्वन्तु मङ्गलम् ॥ रत्नाकरा धौतपदां
    हिमालय किरीटिनीम् । ब्रह्मराजर्षि रत्नाढ्यां वन्दे भारत मातरम् ॥ महेन्द्रो मलयः सह्यो देवतात्मा हिमालयः
    । ध्येयो रैवतको विन्ध्यो गिरिश्चारावलिस्तधा ॥ गङ्गा सरस्वती सिन्धुर् ब्रह्मपुत्रश्च गण्डकी । कावेरी
    यमुना रेवा कृष्णागोदा महानदी ॥ अयोध्या मधुरा माया काशीकाञ्ची अवन्तिका । वैशाली द्वारिका ध्येया पुरी
    तक्षशिला गया ॥ प्रयागः पाटली पुत्रं विजयानगरं महत् । इन्द्रप्रस्धं सोमनाधः तधामृतसरः प्रियम् ॥ चतुर्वेदाः
    पुराणानि सर्वोपनिषदस्तधा । रामायणं भारतं च गीता षड्दर्शनानि च ॥ जैनागमा स्त्रिपिटका गुरुग्रन्धः सतां
    गिरः । एषः ज्ञाननिधिः श्रेष्ठः हृदि सर्वदा ॥ अरुन्धत्यनसूय च सावित्री जानकी सती । द्रौपदी कण्णगी गार्गी
    मीरा दुर्गावती तधा ॥ लक्ष्मी रहल्या चॆन्नम्मा रुद्रमाम्बा सुविक्रमा । निवेदिता शारदा च प्रणम्याः मातृदेवताः
    ॥ श्रीरामो भरतः कृष्णो भीष्मो धर्म स्तधार्जुनः । मार्कण्डेया हरिश्चन्द्रः प्रह्लादो नारदो ध्रुवः ॥
    हनुमान् जनको व्यासो वशिष्ठश्च शुको बलिः । दधीचि विश्वकर्माणौ पृधु वाल्मीकि भार्गवाः ॥ भगीरधश्चैकलव्यो
    मनुर्धन्वन्तरिस्तधा । शिबिश्च रन्तिदेवश्च पुराणोद्गीत कीर्तयः ॥ बुद्धोजिनेन्द्रा गोरक्षः तिरुवल्लुवरस्तधा
    । नायन्मारालवाराश्च कम्बश्च बसवेश्वरः ॥ देवलो रविदासश्च कबीरो गुरुनानकः । नरसिस्तुलसीदासो दशमेशो दृढव्रतः
    ॥ श्रीमत् शङ्करदेवश्च बन्धू सायणमाधवौ । ज्ञानेश्वर स्तुकारामो रामदासः पुरन्दरः ॥ विरजा सहजानन्दो रामासन्द्स्तधा
    महान् । वितरस्तु सदैवैते दैवीं सद्गुण सम्पदम् ॥ भरतर्षिः कालिदासः श्रीभोजो जकणस्तधा । सूरदासस्त्यागराजो
    रसखानश्च सत्कविः ॥ रविवर्मा भारतखण्डे भाग्यचन्द्रः स भूपतिः । कलावन्तश्च विख्याताः स्मरणीय निरन्तरम्
    ॥ अगस्त्यः कम्बुकौण्डिन्यौ राजेन्द्रश्चोलवंशजः । अशोकः पुष्यमित्रश्च खारवेलाः सुनीतिमान् ॥ चाणक्य
    चन्द्रगुप्तौ च विक्रमः शालिवाहनः । समुद्र गुप्तः श्री हर्षःशैलेन्द्रो बप्परावलः ॥ लाचित् भास्करवर्माच
    यशोधर्मा च हूणजित् । श्रीकृष्णदेवरायश्च ललितादित्य उद्बलः ॥ मुसुनूरि नायका तौ प्रतापः शिवभूपतिः ।
    रणजित् सिंह इत्येते वीरा विख्यात विक्रमाः ॥ वैज्ञानिकाश्च कपिलः कणादः शुश्रत स्तधा । चरको भास्कराचार्यो
    वराहमिहरः सुधीः ॥ नागार्जुनो भरद्वाजः आर्यभट्टो वसुर्भुधः । ध्येयो वेङ्कटरामश्च विज्ञा रामानुजादयः
    ॥ रामकृष्णो दयानन्दो रवीन्द्रो राममोहनः । रामतीर्धो रविन्दश्च विवेकानन्द उड्यशाः ॥ दादाभायी गोपबन्धुः
    तिलको गान्धिरादृताः । रमणो मालवीयश्च श्री सुब्रह्मण्य भारती ॥ सुभाषः प्रणवानन्दः क्रान्तिवीरो विनायकः
    । ठक्करो भीमरावश्च पुलेनारायणो गुरुः ॥ सङ्घशक्तिः प्रणेतारौ केशवो माधवश्तधा । स्मरणीया सदैवैते नवचैतन्यदायकाः
    ॥ अनुक्ता ये भक्ताः प्रभुचरण संसक्त हृदयाः । अविज्ञाता वीराः अधिसमरमुद्ध्वस्तरिपवः ॥ समाजोद्धर्तारः
    सुहितकरविज्ञान निपुणाः । नम स्तेभ्यो भूयात् सकल सुजनेभ्यः प्रतिदिनम् ॥ इदमेकात्मतास्तोत्रं श्रद्धया
    यः सदा पठेत् । स राष्ट्र धर्म निष्टावान् अखण्डं भारतं स्मरेत्
