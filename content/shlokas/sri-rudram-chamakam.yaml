    मे॒ द्वात्रिग्ं॑शच्च मे॒ षट् त्रिग्ं॑शच्च मे चत्वारि॒ग्ं॒शच्च॑ मे॒ चतु॑श्चत्वारिग्ंशच्च मे॒ ऽष्टाच॑त्वारिग्ंशच्च
    मे॒ वाज॑श्च प्रस॒वश्चा॑पि॒जश्च॒ क्रतु॑श्च॒ सुव॑श्च मू॒र्धा च॒ व्यश्नि॑यश्चान्त्याय॒नश्चान्त्य॑श्च
    भौव॒नश्च॒ भुव॑न॒श्चाधि॑पतिश्च ॥ र्बृह॒स्पति॑रुक्थाम॒दानि॑ शग्ंसिष॒द्विश्वे॑ दे॒वा क्त॒वाचः॒ पृथि॑विमात॒र्मा
    मा॑ हिग्ंसी॒र्मधु॑ मनिष्ये॒ मधु॑ जनिष्ये॒ मधु॑ वक्ष्यामि॒ मधु॑ वदिष्यामि॒ मधु॑मती न्दे॒वेभ्यो॒ वाच॒मुद्यासग्ंशुश्रूषे॒ण्या
    भ्य॒स्तं मा॑ दे॒वा अ॑वन्तु शो॒भायै॑ पि॒तरो ऽनु॑मदन्तु ॥ ॐ शान्ति॒
