id: sasvara
category: veda
name:
  english: sasvara
  devanagari: सस्वर
content:
  english: shi ca me̱ shari̭rani ca ma̱ ayṷshca me ja̱ra ca̭ me ya̱jnena̭ kalpantam || 3|| jyai̭shthyam
    ca ma adhi̭patyam ca me ma̱nyushca̭ me̱ bhama̭shca̱ me'ma̭shca̱ me'mbha̭shca me je̱ma ca̭ me mahi̱ma
    ca̭ me vari̱ma ca̭ me prathi̱ma ca̭ me varshi̱ma ca̭ me draghi̱ma ca̭ me vri̱ddham ca̭ me̱ vriddhi̭shca
    me ya̱jnena̭ kalpantam || 4|| sa̱tyam ca̭ me shra̱ddha ca̭ me̱ jaga̭cca me̱ dhana̭m ca me̱ vishva̭m
    ca me̱ maha̭shca me kri̱da ca̭ me̱ moda̭shca me ja̱tam ca̭ me jani̱shyama̭nam ca me su̱ktam ca̭ me
    sukri̱tam ca̭ me ya̱jnena̭ kalpantam || 5|| ri̱tam ca̭ me'mrita̭m ca me'ya̱kshmam ca̱ me'na̭mayacca
    me ji̱vatṷshca me dirghayu̱tvam ca̭ me'nami̱tram ca̱ me'bha̭yam ca me su̱kham ca̭ me̱ shaya̭nam ca
    me su̱shashca̭ me su̱dina̭m ca me ya̱jnena̭ kalpantam || 6|| ya̱nta ca̭ me dha̱rta ca̭ me̱ kshema̭shca
    me̱ dhriti̭shca me̱ vishva̭m ca me̱ maha̭shca me sa̱mvicca̭ me̱ jnatra̭m ca me̱ sushca̭ me pra̱sushaca̭̱
    me̱ sira̭m ca me̱ laya̭shca me ya̱jnena̭ kalpantam || 7|| sham ca̭ me̱ maya̭shca me pri̱yam ca̭ me'nuka̱mashca̭
    me̱ kama̭shca me saumana̱sashca̭ me̱ bhaga̭shca me̱ dravi̭nam ca me bha̱dram ca̭ me̱ shreya̭shca me̱
    vasi̭yashca me̱ yasha̭shca me ya̱jnena̭ kalpantam || 8|| urkca̭ me su̱nrita̭ ca me̱ paya̭shca me̱
    rasa̭shca me ghri̱tam ca̭ me̱ madhṷ ca me̱ sagdhi̭shca me̱ sapi̭tishca me kri̱shishca̭ me̱ vrishti̭shca
    me̱ jaitra̭m ca ma̱ audbhi̭dyam ca me ya̱jnena̭ kalpantam || 9|| ra̱yishca̭ me̱ raya̭shca me pu̱shtam
    ca̭ me̱ pushti̭shca me vi̱bhu ca̭ me pra̱bhu ca̭ me pu̱rnam ca̭ me pu̱rnata̭ram ca me̱ kuya̭vam ca̱
    me'kshi̭tam ca̱ me'nna̭m ca̱ me'kshṷcca me ya̱jnena̭ kalpantam || 10|| vi̱ttam ca̭ me̱ vedya̭m ca
    me bhu̱tam ca̭ me bhavi̱shyacca̭ me su̱gam ca̭ me supa̱thya̱m ca ma ri̱ddham ca̭ ma̱ riddhi̭shca me
    klri̱ptam ca̭ me̱ klripti̭shca me ma̱tishca̭ me suma̱tishca̭ me ya̱jnena̭ kalpantam || 11|| vri̱haya̭shca
    me̱ yava̭shca me̱ masha̭shca me̱ tila̭shca me mu̱drashca̭ me̱ khalva̭shca me pri̱yanga̭vashca̱ me'na̭vashca
    me shya̱maka̭shca me ni̱vara̭shca me go̱dhuma̭shca me ma̱sura̭shca me ya̱jnena̭ kalpantam || 12||
    ashma̭ ca me̱ mritti̭ka ca me gi̱raya̭shca me̱ parva̭tashca me̱ sika̭tashca me̱ vana̱spata̭yashca
    me̱ hira̭nyam ca̱ me'ya̭shca me shya̱mam ca̭ me lo̱ham ca̭ me̱ sisa̭m ca me̱ trapṷ ca me ya̱jnena̭
    kalpantam || 13|| a̱gnishca̭ ma̱ apa̭shca me vi̱rudha̭shca ma̱ osha̭dhayashca me krishtapa̱cyashca̭
    me'krishtapa̱cyashca̭ me gra̱myashca̭ me pa̱shava̭ ara̱nyashca̭ me vi̱ttam ca̭ me̱ vitti̭shca me bhu̱tam
    ca̭ me̱ bhuti̭shca me ya̱jnena̭ kalpantam || 14|| vasṷ ca me vasa̱tishca̭ me̱ karma̭ ca me̱ shakti̭shca̱
    me'rtha̭shca ma̱ ema̭shca ma i̱tya ca̭ me̱ gati̭shca me ya̱jnena̭ kalpantam || 15|| a̱gnishca̭ ma̱
    indra̭shca me̱ soma̭shca ma̱ indra̭shca me savi̱ta ca̭ ma̱ indra̭shca me̱ sara̭svati ca ma̱ indra̭shca
    me pu̱sha ca̭ ma̱ indra̭shca me̱ briha̱spati̭shca ma̱ indra̭shca me ya̱jnena̭ kalpantam || 16|| mi̱trashca̭
    ma̱ indra̭shca me̱ varṷnashca ma̱ indra̭shca me dha̱ta ca̭ ma̱ indra̭shca me̱ tvashta̭ ca ma̱ indra̭shca
    me ma̱ruta̭shca ma̱ indra̭shca me̱ vishvḙ ca me de̱va indra̭shca me ya̱jnena̭ kalpantam || 17|| pri̱thi̱vi
    ca̭ ma̱ indra̭shca̱ me'ntari̭ksham ca ma̱ indra̭shca me̱ dyaushca̭ ma̱ indra̭shca me̱ sama̭shca ma̱
    indra̭shca me̱ naksha̭trani ca ma̱ indra̭shca me̱ disha̭shca ma̱ indra̭shca me ya̱jnena̭ kalpantam
    || 18|| a̱
  devanagari: षि च मे॒ शरी॑राणि च म॒ आयु॑श्च मे ज॒रा च॑ मे य॒ज्ञेन॑ कल्पन्ताम् ॥ ३॥ ज्यै॑ष्ठ्यं च म आधि॑पत्यं
    च मे म॒न्युश्च॑ मे॒ भाम॑श्च॒ मेऽम॑श्च॒ मेऽम्भ॑श्च मे जे॒मा च॑ मे महि॒मा च॑ मे वरि॒मा च॑ मे प्रथि॒मा
    च॑ मे वर्षि॒मा च॑ मे द्राघि॒मा च॑ मे वृ॒द्धं च॑ मे॒ वृद्धि॑श्च मे य॒ज्ञेन॑ कल्पन्ताम् ॥ ४॥ स॒त्यं
    च॑ मे श्र॒द्धा च॑ मे॒ जग॑च्च मे॒ धनं॑ च मे॒ विश्वं॑ च मे॒ मह॑श्च मे क्री॒डा च॑ मे॒ मोद॑श्च मे जा॒तं
    च॑ मे जनि॒ष्यमा॑णं च मे सू॒क्तं च॑ मे सुकृ॒तं च॑ मे य॒ज्ञेन॑ कल्पन्ताम् ॥ ५॥ ऋ॒तं च॑ मेऽमृतं॑ च मेऽय॒क्ष्मं
    च॒ मेऽना॑मयच्च मे जी॒वातु॑श्च मे दीर्घायु॒त्वं च॑ मेऽनमि॒त्रं च॒ मेऽभ॑यं च मे सु॒खं च॑ मे॒ शय॑नं च
    मे सू॒षाश्च॑ मे सु॒दिनं॑ च मे य॒ज्ञेन॑ कल्पन्ताम् ॥ ६॥ य॒न्ता च॑ मे ध॒र्ता च॑ मे॒ क्षेम॑श्च मे॒ धृति॑श्च
    मे॒ विश्वं॑ च मे॒ मह॑श्च मे सं॒विच्च॑ मे॒ ज्ञात्रं॑ च मे॒ सूश्च॑ मे प्र॒सूशच॒॑ मे॒ सीरं॑ च मे॒ लय॑श्च
    मे य॒ज्ञेन॑ कल्पन्ताम् ॥ ७॥ शं च॑ मे॒ मय॑श्च मे प्रि॒यं च॑ मेऽनुका॒मश्च॑ मे॒ काम॑श्च मे सौमन॒सश्च॑
    मे॒ भग॑श्च मे॒ द्रवि॑णं च मे भ॒द्रं च॑ मे॒ श्रेय॑श्च मे॒ वसी॑यश्च मे॒ यश॑श्च मे य॒ज्ञेन॑ कल्पन्ताम्
    ॥ ८॥ ऊर्क्च॑ मे सू॒नृता॑ च मे॒ पय॑श्च मे॒ रस॑श्च मे घृ॒तं च॑ मे॒ मधु॑ च मे॒ सग्धि॑श्च मे॒ सपी॑तिश्च
    मे कृ॒षिश्च॑ मे॒ वृष्टि॑श्च मे॒ जैत्रं॑ च म॒ औद्भि॑द्यं च मे य॒ज्ञेन॑ कल्पन्ताम् ॥ ९॥ र॒यिश्च॑ मे॒
    राय॑श्च मे पु॒ष्टं च॑ मे॒ पुष्टि॑श्च मे वि॒भु च॑ मे प्र॒भु च॑ मे पू॒र्णं च॑ मे पू॒र्णत॑रं च मे॒ कुय॑वं
    च॒ मेऽक्षि॑तं च॒ मेऽन्नं॑ च॒ मेऽक्षु॑च्च मे य॒ज्ञेन॑ कल्पन्ताम् ॥ १०॥ वि॒त्तं च॑ मे॒ वेद्यं॑ च मे
    भू॒तं च॑ मे भवि॒ष्यच्च॑ मे सु॒गं च॑ मे सुप॒थ्यं॒ च म ऋ॒द्धं च॑ म॒ ऋद्धि॑श्च मे क्लृ॒प्तं च॑ मे॒ क्लृप्ति॑श्च
    मे म॒तिश्च॑ मे सुम॒तिश्च॑ मे य॒ज्ञेन॑ कल्पन्ताम् ॥ ११॥ व्री॒हय॑श्च मे॒ यवा॑श्च मे॒ माषा॑श्च मे॒ तिला॑श्च
    मे मु॒द्राश्च॑ मे॒ खल्वा॑श्च मे प्रि॒यङ्ग॑वश्च॒ मेऽण॑वश्च मे श्या॒माका॑श्च मे नी॒वारा॑श्च मे गो॒धूमा॑श्च
    मे म॒सूरा॑श्च मे य॒ज्ञेन॑ कल्पन्ताम् ॥ १२॥ अश्मा॑ च मे॒ मृत्ति॑का च मे गि॒रय॑श्च मे॒ पर्व॑ताश्च मे॒
    सिक॑ताश्च मे॒ वन॒स्पत॑यश्च मे॒ हिर॑ण्यं च॒ मेऽय॑श्च मे श्या॒मं च॑ मे लो॒हं च॑ मे॒ सीसं॑ च मे॒ त्रपु॑
    च मे य॒ज्ञेन॑ कल्पन्ताम् ॥ १३॥ अ॒ग्निश्च॑ म॒ आप॑श्च मे वी॒रुध॑श्च म॒ ओष॑धयश्च मे कृष्टप॒च्याश्च॑ मेऽकृष्टप॒च्याश्च॑
    मे ग्रा॒म्याश्च॑ मे प॒शव॑ आर॒ण्याश्च॑ मे वि॒त्तं च॑ मे॒ वित्ति॑श्च मे भू॒तं च॑ मे॒ भूति॑श्च मे य॒ज्ञेन॑
    कल्पन्ताम् ॥ १४॥ वसु॑ च मे वस॒तिश्च॑ मे॒ कर्म॑ च मे॒ शक्ति॑श्च॒ मेऽर्थ॑श्च म॒ एम॑श्च म इ॒त्या च॑ मे॒
    गति॑श्च मे य॒ज्ञेन॑ कल्पन्ताम् ॥ १५॥ अ॒ग्निश्च॑ म॒ इन्द्र॑श्च मे॒ सोम॑श्च म॒ इन्द्र॑श्च मे सवि॒ता
    च॑ म॒ इन्द्र॑श्च मे॒ सर॑स्वती च म॒ इन्द्र॑श्च मे पू॒षा च॑ म॒ इन्द्र॑श्च मे॒ बृह॒स्पति॑श्च म॒ इन्द्र॑श्च
    मे य॒ज्ञेन॑ कल्पन्ताम् ॥ १६॥ मि॒त्रश्च॑ म॒ इन्द्र॑श्च मे॒ वरु॑णश्च म॒ इन्द्र॑श्च मे धा॒ता च॑ म॒ इन्द्र॑श्च
    मे॒ त्वष्टा॑ च म॒ इन्द्र॑श्च मे म॒रुत॑श्च म॒ इन्द्र॑श्च मे॒ विश्वे॑ च मे दे॒वा इन्द्र॑श्च मे य॒ज्ञेन॑
    कल्पन्ताम् ॥ १७॥ पृ॒थि॒वी च॑ म॒ इन्द्र॑श्च॒ मेऽन्तरि॑क्षं च म॒ इन्द्र॑श्च मे॒ द्यौश्च॑ म॒ इन्द्र॑श्च
    मे॒ समा॑श्च म॒ इन्द्र॑श्च मे॒ नक्ष॑त्राणि च म॒ इन्द्र॑श्च मे॒ दिश॑श्च म॒ इन्द्र॑श्च मे य॒ज्ञेन॑ कल्पन्ताम्
    ॥ १८॥ अ॒
