    क्रीं यं यमुना तथा । ॐ श्रीं सौः शरयू स्वाहा ॐ श्रीं योगिसमर्चिता ॥ ७०॥ ॐ श्रीं यमस्वसा स्वाहा ॐ ह्रीं
