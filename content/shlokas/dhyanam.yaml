id: dhyanam
category: stotram
name:
  english: dhyanam
  devanagari: ध्यानम्
content:
  english: apaduddharakabatukabhairavadhyanam shuddhasphatikasankasham sahasradityavarcasam | nilajimutasankasham
    nilanjanasamaprabham || 1|| ashtabahum trinayanam caturbahum dvibahukam | damshtrakaralavadanam nupuraravasankulam
    || 2|| bhujangamekhalam devamagnivarnashiroruham | digambaram kumarisham batukakhyam mahabalam ||
    3|| khatvangamasipasham ca shulam dakshinabhagatah | damarum ca kapalam ca varadam bhujagam tatha
    || 4|| agnivarnasamopetam sarameyasamanvitam | dhyatva japet susamhrishtah sarvan kamanavapnuyat ||
    5|| || iti shrimadapaduddharakabatukabhairavadhyanam sampurnam ||
  devanagari: आपदुद्धारकबटुकभैरवध्यानम् शुद्धस्फटिकसङ्काशं सहस्रादित्यवर्चसम् । नीलजीमूतसङ्काशं नीलाञ्जनसमप्रभम्
    ॥ १॥ अष्टबाहुं त्रिनयनं चतुर्बाहुं द्विबाहुकम् । दंष्ट्राकरालवदनं नूपुरारावसङ्कुलम् ॥ २॥ भुजङ्गमेखलं
    देवमग्निवर्णशिरोरुहम् । दिगम्बरं कुमारीशं बटुकाख्यं महाबलम् ॥ ३॥ खट्वाङ्गमसिपाशं च शूलं दक्षिणभागतः
    । डमरुं च कपालं च वरदं भुजगं तथा ॥ ४॥ अग्निवर्णसमोपेतं सारमेयसमन्वितम् । ध्यात्वा जपेत् सुसंहृष्टः
    सर्वान् कामानवाप्नुयात् ॥ ५॥ ॥ इति श्रीमदापदुद्धारकबटुकभैरवध्यानं सम्पूर्णम् ॥
