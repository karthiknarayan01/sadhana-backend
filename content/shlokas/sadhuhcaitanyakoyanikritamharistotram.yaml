id: sadhuhcaitanyakoyanikritamharistotram
category: stotram
name:
  english: sadhuhcaitanyakoyanikritamharistotram
  devanagari: साधुःचैतन्यकोयनिकृतंहरिस्तोत्रम्
content:
  english: sadhuh caitanyakoyanikritam haristotram asankhyah sadhavo yatra svatahprakasharupinah | divya
    vasanti rishayah sharanyam prabhajanti ca || 28|| namastasmai nrinatyaya sarvantaryamine namah | abhyantarebhyah
    shadhubhyo'vanam karoti yo harih || 29|| namastasmai krishnanarayanaya paramatmane | adhyatmikebhyastapebhyashcadhidaivikatastatha
    || 30|| adhibhutadikashtebhyo rakshakaya namo namah | samantavikramat krurallunthakadvanacandrakah
    || 31|| sukhadevi ca tatpatni vanijo yena rakshitah | sayanayanasadhostu samagamena mokshitah || 32||
    sa krishno vartate rakshakarastasmai namo namah | dhanishthakosham vipram ca varanganasu vartitam
    || 33|| snehalatam ca tatpatnim gurum somayanam tatha | nripam malavasimham ca raraksha mokshanam
    dadau || 34|| namastasmai pareshaya shrikantaya tu sharngine | rajivakhyam nripam rajnim sadhvim kundanadevikam
    || 35|| arakshayattatha'mokshayadyastasmai te namo namah | devavishramasya raksham kandikayashca mokshanam
    || 36|| kritam yena ca tasmai shriharaye vai namo namah | harshulamalinam patnim tasya vidrumavallakim
    || 37|| uddadhara hariryah shripatistasmai namo namah | shanadharam pitrihanam karshukam ca raraksha
    yah || 38|| vrishaham nimbadevam ca tasmai krishnaya te namah | bhandam kalindaram sadhukamalayanayogatah
    || 39|| mokshanam caprapayadyastasmai krishnaya te namah | nartakam rayanadevam bodhayanasya yogatah
    || 40|| gayakam nakiralakhye pattane tu vratardinam | rajanam pundravarmanam ya uddadhara te namah
    || 41|| vayakam tulavayakhyam samuddadhara yah prabhuh | kashthaharam tatha jangaladevam te namo namah
    || 42|| panyakridvatsalyadhiram patnim manjulikam tatha | sadhum sadhvim kritavan yastasmai tubhyam
    namo namah || 43|| tilakarangam vanapam shikhadevim ca tatpriyam | uddadhara hariryah sa hridayastho'pi
    rakshatu || 44|| kshetrapam nanjakadevam tatha stenamahamayam | uddadhara hariryashca tasmai krishnaya
    vai namah || 45|| kiratam sagarakhyam tatpatnim ca sarikam tu yah | uddadhara hariryashca tasmai shripataye
    namah || 46|| hunam saranganamanam raraksha yashca te namah | yajnaradham pushkasam ca brahmayanaprasangatah
    || 47|| kutumbayuktam yah krishno'mokshayatte namo namah | kapikshayam tu candalam prajneshvaram dvijam
    tatha || 48|| amokshayaddhariryashca tasmai krishnaya te namah | nalikaram lohakaram patnim kundanikam
    ca yah || 49|| amokshayadbhavapashattasmai shrivishnave namah | carmakaram mangalakhyam patnim vibhavarim
    ca yah || 50|| vishadraraksha bhagavan yastasmai vai namo namah | rathakaram haridasam patnim shrimanavim
    tu yah || 51|| amokshayat prabhave te varam varam namo namah | shilaharam damashiladakam patnim kalabhidham
    || 52|| tadbhritya~shca'mokshayadyastasmai krishnaya te namah | shilpinam sanjayadevam patnim keshavatim
    ca yah || 53|| rajanam khadgavarmanam tatha'nyan shilpino'pi ca | uddadhara haristasmai balakrishnaya
    vai namah || 94|| citrakritsambharadevam ca citramsaritam priyam | citrakaranaparan yo'mokshayatte
    namo namah || 55|| angaraharinam mauktikeshinam tu nijashritam | tatha'paran karmacaran yo raraksha
    ca te namah || 56|| cakradharam lubdhakam yah pautimashyopadeshatah | amokshayaddhi samsarattasmai
    krishnaya te namah || 57|| vatadharam pishunam yo nripam sutarasimhakam | ghatyayanaprasangena'mokshayatte
    namo namah || 98|| vatadharam savasam ca dvaipirajnimarakshayat | amokshayacca yah krishnastasmai
    nityam namo namah || 59|| grihakaram shivajayam vrishaparvaprasangatah | amokshayattu yah krishnastasmai
    shriharaye namah || 60|| yashca sangarayadaskam jalakaramamokshayat | patnim rupavatim shuklayanarshisevaya
    harih || 61|| tatha jatya bharavatamudyamashritinamakam | satishvarim ca tatpannim vallavishcoddadhara
    yah || 62|| ushtrapalam dirgharambham ramayanaprasangatah | uddadhara hariryastam vallabham praname
    prabhum || 63|| ratnaprabham kharapalam nrisimhasvamiyogatah | uddadhara harirnarayanastam pranamamyaham
    || 64|| gadardaneshvaram vaidyam tatpannim ca mukundinim | amokshayaddhi samsaradyastam namami mapatim
    || 65|| kishanakulapalasya deshyavanasya mokshanam | tatpatnyah purikayashca cakre yastam namami vai
    || 66|| napitam harshadharmakhyam patnim nigamikam ca yah | bhubhritam svarnadhanvanam rajnim ca pancadevikam
    || 67|| kalyanadhamasadhostu samagamena tan prabhuh | uddadhara harirnarayanastam pranamami vai ||
    68|| yashca rutanakidevimabhirim daityadharshitam | arakshayadbrahmapriyamadhye rupeshvarim tu tam
    || 69|| mandarakalikadyashca tatha'nya divyarupinih | vyadhacchribhagavan patnistam namami janardanam
    || 70|| dhivaram dhiraparvanam nirvanayanayogatah | kritva tu pavanam krishno'mokshayattam namamyaham
    || 71|| tarakadarshakam shularopakam coddadhara yah | supathanakabhupam ca kritashalyam shulyanganam
    || 72|| uddadhara jati bhutva harishrikrishnanandanah | gopalanandanam krishnam vallabha tam namamyaham
    || 73|| jvalaprasadanamanam cagnidam ca prabhavatim | narayanayanayogadamokshayannamami tam || 74||
    lavadanam tu garadam nripam shrimanaveshvaram | shanteshvaram yuvarajam suryakantam tu sainyapam ||
    75|| kimshukayanayogena samuddadhara yah prabhuh | shrikrishnam deshikam bhaktahridayastham namami
    tam || 76|| vikhandalam shastradharam bharyam harasatim ca yah | nirmohanayanayogadamokshayacca te
    namah || 77|| evam lakshmi stavanam vai sadhushcaitanyakayanih | cakre neme harim sarvasthitam ca
    paritastada || 78|| iti shrilakshminarayaniyasamhitayah dvaparayugasantanatmakasya sadhuh caitanyakoyanikritam
    haristotram sampurnam | lakshminarayaniyasamhita | khanda 3| adhyaya 235
  devanagari: साधुः चैतन्यकोयनिकृतं हरिस्तोत्रम् असङ्ख्याः साधवो यत्र स्वतःप्रकाशरूपिणः । दिव्या वसन्ति
    ऋषयः शरण्यं प्रभजन्ति च ॥ २८॥ नमस्तस्मै नृनाट्याय सर्वान्तर्यामिणे नमः । आभ्यन्तरेभ्यः शधुभ्योऽवनं
    करोति यो हरिः ॥ २९॥ नमस्तस्मै कृष्णनारायणाय परमात्मने । आध्यात्मिकेभ्यस्तापेभ्यश्चाधिदैविकतस्तथा ॥
    ३०॥ आधिभूतादिकष्टेभ्यो रक्षकाय नमो नमः । सामन्तविक्रमात् क्रूराल्लुण्ठकाद्वनचन्द्रकः ॥ ३१॥ सुखादेवी
    च तत्पत्नी वणिजो येन रक्षिताः । सायनायनसाधोस्तु समागमेन मोक्षिताः ॥ ३२॥ स कृष्णो वर्तते रक्षाकरस्तस्मै
    नमो नमः । धनिष्ठकोषं विप्रं च वाराङ्गनासु वर्तितम् ॥ ३३॥ स्नेहलतां च तत्पत्नीं गुरुं सोमायनं तथा ।
    नृपं मालवसिंहं च ररक्ष मोक्षणं ददौ ॥ ३४॥ नमस्तस्मै परेशाय श्रीकान्ताय तु शार्ङ्गिणे । राजीवाख्यं नृपं
    राज्ञीं साध्वीं कुन्दनदेविकाम् ॥ ३५॥ अरक्षयत्तथाऽमोक्षयद्यस्तस्मै ते नमो नमः । देवविश्रामस्य रक्षां
    काण्डिकायाश्च मोक्षणम् ॥ ३६॥ कृतं येन च तस्मै श्रीहरये वै नमो नमः । हर्षुलमालिनं पत्नीं तस्य विद्रुमवल्लकीम्
    ॥ ३७॥ उद्दधार हरिर्यः श्रीपतिस्तस्मै नमो नमः । शाणधरं पितृहणं कर्षुकं च ररक्ष यः ॥ ३८॥ वृषहं निम्बदेवं
    च तस्मै कृष्णाय ते नमः । भाण्डं कालीन्दरं साधुकमलायनयोगतः ॥ ३९॥ मोक्षणं चाप्रापयद्यस्तस्मै कृष्णाय
    ते नमः । नर्तकं रायणदेवं बोधायनस्य योगतः ॥ ४०॥ गायकं नाकिरालाख्ये पत्तने तु व्रतर्दिनम् । राजानं पुण्ड्रवर्माणं
    य उद्दधार ते नमः ॥ ४१॥ वायकं तूलवायाख्यं समुद्दधार यः प्रभुः । काष्ठहारं तथा जङ्गलदेवं ते नमो नमः
    ॥ ४२॥ पण्यकृद्वात्सल्यधीरं पत्नीं मञ्जुलिकां तथा । साधुं साध्वीं कृतवान् यस्तस्मै तुभ्यं नमो नमः ॥
    ४३॥ तिलकरङ्गं वनपं शिखादेवीं च तत्प्रियाम् । उद्दधार हरिर्यः स हृदयस्थोऽपि रक्षतु ॥ ४४॥ क्षेत्रपं
    नाञ्जकदेवं तथा स्तेनमहामयम् । उद्दधार हरिर्यश्च तस्मै कृष्णाय वै नमः ॥ ४५॥ किरातं सागराख्यं तत्पत्नीं
    च सारिकां तु यः । उद्दधार हरिर्यश्च तस्मै श्रीपतये नमः ॥ ४६॥ हूणं सारङ्गनामानं ररक्ष यश्च ते नमः ।
    यज्ञराधं पुष्कसं च ब्रह्मायनप्रसङ्गतः ॥ ४७॥ कुटुम्बयुक्तं यः कृष्णोऽमोक्षयत्ते नमो नमः । कपिक्षयं
    तु चाण्डालं प्राज्ञेश्वरं द्विजं तथा ॥ ४८॥ अमोक्षयद्धरिर्यश्च तस्मै कृष्णाय ते नमः । नालीकरं लोहकारं
    पत्नीं कुन्दनिकां च यः ॥ ४९॥ अमोक्षयद्भवपाशात्तस्मै श्रीविष्णवे नमः । चर्मकारं मङ्गलाख्यं पत्नीं विभावरीं
    च यः ॥ ५०॥ विषाद्ररक्ष भगवान् यस्तस्मै वै नमो नमः । रथकारं हरिदासं पत्नीं श्रीमानवीं तु यः ॥ ५१॥ अमोक्षयत्
    प्रभवे ते वारं वारं नमो नमः । शिलाहारं दामशिलादकं पत्नीं कलाभिधाम् ॥ ५२॥ तद्भृत्याँश्चाऽमोक्षयद्यस्तस्मै
    कृष्णाय ते नमः । शिल्पिनं सञ्जयदेवं पत्नीं केशवतीं च यः ॥ ५३॥ राजानं खड्गवर्माणं तथाऽन्यान् शिल्पिनोऽपि
    च । उद्दधार हरिस्तस्मै बालकृष्णाय वै नमः ॥ ९४॥ चित्रकृत्सम्भरदेवं च चित्रंसरितां प्रियाम् । चित्रकारानपरान्
    योऽमोक्षयत्ते नमो नमः ॥ ५५॥ अङ्गारहारिणं मौक्तिकेशिनं तु निजाश्रितम् । तथाऽपरान् कर्मचारान् यो ररक्ष
    च ते नमः ॥ ५६॥ चक्रधरं लुब्धकं यः पौतिमाष्योपदेशतः । अमोक्षयद्धि संसारात्तस्मै कृष्णाय ते नमः ॥ ५७॥
    वाटधरं पिशुनं यो नृपं सुतारसिंहकम् । घट्ययनप्रसङ्गेनाऽमोक्षयत्ते नमो नमः ॥ ९८॥ वाटधरं सवासं च द्वैपीराज्ञीमरक्षयत्
    । अमोक्षयच्च यः कृष्णस्तस्मै नित्यं नमो नमः ॥ ५९॥ गृहकारं शिवजयं वृषपर्वप्रसङ्गतः । अमोक्षयत्तु यः
    कृष्णस्तस्मै श्रीहरये नमः ॥ ६०॥ यश्च सङ्गरयादस्कं जालकारममोक्षयत् । पत्नीं रूपावतीं शुक्लायनर्षिसेवया
    हरिः ॥ ६१॥ तथा जात्या भरवाटमुद्यमश्रीतिनामकम् । सतीश्वरीं च तत्पन्नीं वल्लवीश्चोद्दधार यः ॥ ६२॥ उष्ट्रपालं
    दीर्घरम्भं रामायनप्रसङ्गतः । उद्दधार हरिर्यस्तं वल्लभं प्रणमे प्रभुम् ॥ ६३॥ रत्नप्रभं खरपालं नृसिंहस्वामियोगतः
    । उद्दधार हरिर्नारायणस्तं प्रणमाम्यहम् ॥ ६४॥ गदार्दनेश्वरं वैद्यं तत्पन्नीं च मुकुन्दिनीम् । अमोक्षयद्धि
    संसाराद्यस्तं नमामि मापतिम् ॥ ६५॥ कीशनकुलपालस्य देश्यावनस्य मोक्षणम् । तत्पत्न्याः पुरिकायाश्च चक्रे
    यस्तं नमामि वै ॥ ६६॥ नापितं हर्षधर्माख्यं पत्नीं निगमिकां च यः । भूभृतं स्वर्णधन्वानं राज्ञीं च पञ्चदेविकाम्
    ॥ ६७॥ कल्याणधामसाधोस्तु समागमेन तान् प्रभुः । उद्दधार हरिर्नारायणस्तं प्रणमामि वै ॥ ६८॥ यश्च रूटाणकीदेवीमाभीरीं
    दैत्यधर्षिताम् । अरक्षयद्ब्रह्मप्रियामध्ये रूपेश्वरीं तु ताम् ॥ ६९॥ मन्दारकलिकाद्याश्च तथाऽन्या दिव्यरूपिणीः
    । व्यधाच्छ्रीभगवान् पत्नीस्तं नमामि जनार्दनम् ॥ ७०॥ धीवरं धीरपर्वाणं निर्वाणायनयोगतः । कृत्वा तु पावनं
    कृष्णोऽमोक्षयत्तं नमाम्यहम् ॥ ७१॥ तारकादर्शकं शूलारोपकं चोद्दधार यः । सुपथानकभूपं च कृतशल्यां शूल्यङ्गनाम्
    ॥ ७२॥ उद्दधार जटी भूत्वा हरिश्रीकृष्णनन्दनः । गोपालनन्दनं कृष्णं वल्लभ तं नमाम्यहम् ॥ ७३॥ ज्वालाप्रसादनामानं
    चाग्निदं च प्रभावतीम् । नारायणायनयोगादमोक्षयन्नमामि तम् ॥ ७४॥ लवादनं तु गरदं नृपं श्रीमानवेश्वरम्
    । शान्तेश्वरं युवराजं सूर्यकान्तं तु सैन्यपम् ॥ ७५॥ किंशुकायनयोगेन समुद्दधार यः प्रभुः । श्रीकृष्णं
    देशिकं भक्तहृदयस्थं नमामि तम् ॥ ७६॥ विखण्डलं शस्त्रधरं भार्यां हरसतीं च यः । निर्मोहनायनयोगादमोक्षयच्च
    ते नमः ॥ ७७॥ एवं लक्ष्मि स्तवनं वै साधुश्चैतन्यकायनिः । चक्रे नेमे हरिं सर्वस्थितं च परितस्तदा ॥ ७८॥
    इति श्रीलक्ष्मीनारायणीयसंहितायाः द्वापरयुगसन्तानात्मकस्य साधुः चैतन्यकोयनिकृतं हरिस्तोत्रं सम्पूर्णम्
    । लक्ष्मीनारायणीयसंहिता । खण्ड ३। अध्याय २३५
