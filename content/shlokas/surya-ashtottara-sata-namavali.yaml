id: surya-ashtottara-sata-namavali
category: stotram
name:
  english: Surya Ashtottara Sata Namavali
  devanagari: सूर्याष्टोत्तरशतनामावलिः १ (अथर्वणरहस्यान्तर्गतम् अरुणाय शरण्याय)
content:
  english: 'surya bija mantra - om hra~ hrim hraum sah suryaya namah | suryam sundara lokanathamamritam
    vedantasaram shivam|h jnanam brahmamayam sureshamamalam lokaikacittam svayam|h || indraditya naradhipam
    suragurum trailokyacudamanim|h brahma vishnu shiva svarupa hridayam vande sada bhaskaram|h || om arunaya
    namah | om sharanyaya namah | om karunarasasindhave namah | om asamanabalaya namah | om artarakshakaya
    namah | om adityaya namah | om adibhutaya namah | om akhilagamavedine namah | om acyutaya namah |
    om akhilajnaya namah | 10| om anantaya namah | om inaya namah | om vishvarupaya namah | om ijyaya
    namah | om indraya namah | om bhanave namah | om indiramandiraptaya namah | om vandaniyaya namah |
    om ishaya namah | om suprasannaya namah | 20| om sushilaya namah | om suvarcase namah | om vasupradaya
    namah | om vasave namah | om vasudevaya namah | om ujjvalaya namah | om ugrarupaya namah | om urdhvagaya
    namah | om vivasvate namah | om udyatkiranajalaya namah | 30| om hrishikeshaya namah | om urjasvalaya
    namah | om viraya namah | om nirjaraya namah | om jayaya namah | om urudvayabhavarupayuktasarathaye
    namah | om rishivandyaya namah | om rugghantre namah | om rikshacakracaraya namah | om rijusvabhavacittaya
    namah | 40| om nityastutyaya namah | om rikaramatrikavarnarupaya namah | om ujjvalatejase namah |
    om rikshadhinathamitraya namah | om pushkarakshaya namah | om luptadantaya namah | om shantaya namah
    | om kantidaya namah | om ghanaya namah | om kanatkanakabhushaya namah | 50| om khadyotaya namah |
    om lunitakhiladaityaya namah | om satyanandasvarupine namah | om apavargapradaya namah | om artasharanyaya
    namah | om ekakine namah | om bhagavate namah | om srishtisthityantakarine namah | om gunatmane namah
    | om ghrinibhrite namah | 60| om brihate namah | om brahmane namah | om aishvaryadaya namah | om sharvaya
    namah | om haridashvaya namah | om shauraye namah | om dashadik|hsamprakashaya namah | om bhaktavashyaya
    namah | om ojaskaraya namah | om jayine namah | 70| om jagadanandahetave namah | om janmamrityujaravyadhivarjitaya
    namah | om uccasthana samarudharathasthaya namah | om asuraraye namah | om kamaniyakaraya namah |
    om abjavallabhaya namah | om antarbahih prakashaya namah | om acintyaya namah | om atmarupine namah
    | om acyutaya namah | 80| om amareshaya namah | om parasmai jyotishe namah | om ahaskaraya namah |
    om ravaye namah | om haraye namah | om paramatmane namah | om tarunaya namah | om varenyaya namah
    | om grahanampataye namah | om bhaskaraya namah | 90| om adimadhyantarahitaya namah | om saukhyapradaya
    namah | om sakalajagatampataye namah | om suryaya namah | om kavaye namah | om narayanaya namah |
    om pareshaya namah | om tejorupaya namah | om shrim hiranyagarbhaya namah | om hrim sampatkaraya namah
    | 100| om aim ishtarthadaya namah | om anuprasannaya namah | om shrimate namah | om shreyasenamah
    | om bhaktakotisaukhyapradayine namah | om nikhilagamavedyaya namah | om nityanandaya namah | om suryaya
    namah | 108| || iti surya ashtottarashatanamavalih sampurnam || Propitiation of the shun (shunday)
    chhaṟitẏ: donate vheat, or sugar candy to a middle aged male government leader at 12:00 nun on a shunday|
    Fashtinġ: On shundays, especially during shun transits and major or minor shun periods| sunrise, especially
    during shun transits and major or minor sun periods: ṟEshuḻt: the planetary diety shurya is propitiated
    increasing courage and notoriety| transliteration and information by dr| sh| khalyanaraman kalyan97@yahuॅom'
  devanagari: 'सूर्य बीज मन्त्र - ॐ ह्राँ ह्रीं ह्रौं सः सूर्याय नमः । सूर्यं सुन्दर लोकनाथममृतं वेदान्तसारं
    शिवम्।ह् ज्ञानं ब्रह्ममयं सुरेशममलं लोकैकचित्तं स्वयम्।ह् ॥ इन्द्रादित्य नराधिपं सुरगुरुं त्रैलोक्यचूडामणिम्।ह्
    ब्रह्मा विष्णु शिव स्वरूप हृदयं वन्दे सदा भास्करम्।ह् ॥ ॐ अरुणाय नमः । ॐ शरण्याय नमः । ॐ करुणारससिन्धवे
    नमः । ॐ असमानबलाय नमः । ॐ आर्तरक्षकाय नमः । ॐ आदित्याय नमः । ॐ आदिभूताय नमः । ॐ अखिलागमवेदिने नमः
    । ॐ अच्युताय नमः । ॐ अखिलज्ञाय नमः । १०। ॐ अनन्ताय नमः । ॐ इनाय नमः । ॐ विश्वरूपाय नमः । ॐ इज्याय
    नमः । ॐ इन्द्राय नमः । ॐ भानवे नमः । ॐ इन्दिरामन्दिराप्ताय नमः । ॐ वन्दनीयाय नमः । ॐ ईशाय नमः । ॐ
    सुप्रसन्नाय नमः । २०। ॐ सुशीलाय नमः । ॐ सुवर्चसे नमः । ॐ वसुप्रदाय नमः । ॐ वसवे नमः । ॐ वासुदेवाय
    नमः । ॐ उज्ज्वलाय नमः । ॐ उग्ररूपाय नमः । ॐ ऊर्ध्वगाय नमः । ॐ विवस्वते नमः । ॐ उद्यत्किरणजालाय नमः
    । ३०। ॐ हृषीकेशाय नमः । ॐ ऊर्जस्वलाय नमः । ॐ वीराय नमः । ॐ निर्जराय नमः । ॐ जयाय नमः । ॐ ऊरुद्वयाभावरूपयुक्तसारथये
    नमः । ॐ ऋषिवन्द्याय नमः । ॐ रुग्घन्त्रे नमः । ॐ ऋक्षचक्रचराय नमः । ॐ ऋजुस्वभावचित्ताय नमः । ४०। ॐ
    नित्यस्तुत्याय नमः । ॐ ऋकारमातृकावर्णरूपाय नमः । ॐ उज्ज्वलतेजसे नमः । ॐ ऋक्षाधिनाथमित्राय नमः । ॐ
    पुष्कराक्षाय नमः । ॐ लुप्तदन्ताय नमः । ॐ शान्ताय नमः । ॐ कान्तिदाय नमः । ॐ घनाय नमः । ॐ कनत्कनकभूषाय
    नमः । ५०। ॐ खद्योताय नमः । ॐ लूनिताखिलदैत्याय नमः । ॐ सत्यानन्दस्वरूपिणे नमः । ॐ अपवर्गप्रदाय नमः
    । ॐ आर्तशरण्याय नमः । ॐ एकाकिने नमः । ॐ भगवते नमः । ॐ सृष्टिस्थित्यन्तकारिणे नमः । ॐ गुणात्मने नमः
    । ॐ घृणिभृते नमः । ६०। ॐ बृहते नमः । ॐ ब्रह्मणे नमः । ॐ ऐश्वर्यदाय नमः । ॐ शर्वाय नमः । ॐ हरिदश्वाय
    नमः । ॐ शौरये नमः । ॐ दशदिक्।ह्सम्प्रकाशाय नमः । ॐ भक्तवश्याय नमः । ॐ ओजस्कराय नमः । ॐ जयिने नमः ।
    ७०। ॐ जगदानन्दहेतवे नमः । ॐ जन्ममृत्युजराव्याधिवर्जिताय नमः । ॐ उच्चस्थान समारूढरथस्थाय नमः । ॐ असुरारये
    नमः । ॐ कमनीयकराय नमः । ॐ अब्जवल्लभाय नमः । ॐ अन्तर्बहिः प्रकाशाय नमः । ॐ अचिन्त्याय नमः । ॐ आत्मरूपिणे
    नमः । ॐ अच्युताय नमः । ८०। ॐ अमरेशाय नमः । ॐ परस्मै ज्योतिषे नमः । ॐ अहस्कराय नमः । ॐ रवये नमः । ॐ
    हरये नमः । ॐ परमात्मने नमः । ॐ तरुणाय नमः । ॐ वरेण्याय नमः । ॐ ग्रहाणांपतये नमः । ॐ भास्कराय नमः ।
    ९०। ॐ आदिमध्यान्तरहिताय नमः । ॐ सौख्यप्रदाय नमः । ॐ सकलजगतांपतये नमः । ॐ सूर्याय नमः । ॐ कवये नमः
    । ॐ नारायणाय नमः । ॐ परेशाय नमः । ॐ तेजोरूपाय नमः । ॐ श्रीं हिरण्यगर्भाय नमः । ॐ ह्रीं सम्पत्कराय
    नमः । १००। ॐ ऐं इष्टार्थदाय नमः । ॐ अनुप्रसन्नाय नमः । ॐ श्रीमते नमः । ॐ श्रेयसेनमः । ॐ भक्तकोटिसौख्यप्रदायिने
    नमः । ॐ निखिलागमवेद्याय नमः । ॐ नित्यानन्दाय नमः । ॐ सूर्याय नमः । १०८। ॥ इति सूर्य अष्टोत्तरशतनामावलिः
    सम्पूर्णम् ॥ Pरोपितिअतिओन् ओफ़् थे षुन् (षुन्दय्) छ्ःआऱीट्य़्: डोनते व्हेअत्, ओर् सुगर् चन्द्य् तो अ
    मिद्द्ले अगेद् मले गोवेर्न्मेन्त् लेअदेर् अत् १२:०० नून् ओन् अ षुन्दय्। Fआष्टीण्ग़्: Oन् षुन्दय्स्,
    एस्पेचिअल्ल्य् दुरिन्ग् षुन् त्रन्सित्स् अन्द् मजोर् ओर् मिनोर् षुन् पेरिओद्स्। सुन्रिसे, एस्पेचिअल्ल्य्
    दुरिन्ग् षुन् त्रन्सित्स् अन्द् मजोर् ओर् मिनोर् सुन् पेरिओद्स्: ऱ्Eषूळ्ट्: ठे प्लनेतर्य् दिएत्य्
    षुर्य इस् प्रोपितिअतेद् इन्च्रेअसिन्ग् चोउरगे अन्द् नोतोरिएत्य्। ट्रन्स्लितेरतिओन् अन्द् इन्फ़ोर्मतिओन्
    ब्य् ड्र्। ष्। ख़ल्यनरमन् कल्यन्९७@यहूॅओम्'
