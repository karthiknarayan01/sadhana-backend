id: nagakumarikabhihkritamshivastotram
category: stotram
name:
  english: nagakumarikabhihkritamshivastotram
  devanagari: नागकुमारिकाभिःकृतंशिवस्तोत्रम्
content:
  english: nagakumarikabhih kritam shivastotram vavanduratha ta bala jnatva lakshmabhirishvaram | tushtvushca
    prahrishtasyah sannakanthyo'tigadgadam || 104|| jaya shambho jayeshana jaya sarvaga sarvada | jaya
    tripurasamhartarjayandhakanishudana || 105|| jaya jalandharahara jaya kandarpadarpahrit | jaya trailokyajanaka
    jaya trailokyavardhana || 106|| jaya trailokyanilaya jaya trailokyavandita | jaya bhaktajanadhina
    jaya pramathanayaka || 107|| jaya tripathagapathahprakshalitajatatata | jaya candrakalajyotirvidyotitajagattraya
    || 108|| jaya sarpaphanaratnaprabhabhasitavigraha | jayadrirajatanayatapahkritardhadehaka || 109||
    jaya shmashananilaya jaya varanasipriya | jayanandavanadhyasi praninirvanadayaka || 2
  devanagari: नागकुमारिकाभिः कृतं शिवस्तोत्रम् ववन्दुरथ ता बाला ज्ञात्वा लक्ष्मभिरीश्वरम् । तुष्ट्वुश्च
    प्रहृष्टास्याः सन्नकण्ठ्योऽतिगद्गदम् ॥ १०४॥ जय शम्भो जयेशान जय सर्वग सर्वद । जय त्रिपुरसंहर्तर्जयान्धकनिषूदन
    ॥ १०५॥ जय जालन्धरहर जय कन्दर्पदर्पहृत् । जय त्रैलोक्यजनक जय त्रैलोक्यवर्धन ॥ १०६॥ जय त्रैलोक्यनिलय
    जय त्रैलोक्यवन्दित । जय भक्तजनाधीन जय प्रमथनायक ॥ १०७॥ जय त्रिपथगापाथःप्रक्षालितजटातट । जय चन्द्रकलाज्योतिर्विद्योतितजगत्त्रय
    ॥ १०८॥ जय सर्पफणारत्नप्रभाभासितविग्रह । जयाद्रिराजतनयातपःक्रीतार्धदेहक ॥ १०९॥ जय श्मशाननिलय जय वाराणसीप्रिय
    । जयानन्दवनाध्यासि प्राणिनिर्वाणदायक ॥ २
meaning: {}
