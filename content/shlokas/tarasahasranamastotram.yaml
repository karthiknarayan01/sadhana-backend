id: tarasahasranamastotram
category: stotram
name:
  english: tarasahasranamastotram
  devanagari: तारासहस्रनामस्तोत्रम्
content:
  english: purusharthacatushtayasiddhyarthe viniyogah || tara ratrirmaharatrirkalaratrirmahamatih | kalika
    kamada maya mahamaya mahasmritih ||26|| mahadanarata yajna yajnotsavavibhushita | candravvajra cakorakshi
    carunetra sulocana ||27|| trinetra mahati devi kurangakshi manorama | brahmi narayani jyotsna carukeshi
    sumurdhaja ||28|| varahi varuni vidya mahavidya maheshvari | siddha kuncitakesha ca mahayajnasvarupini
    ||29|| gauri campakavarna ca krishangi shivamohini | sarvanandasvarupa ca sarvashankaikatarini ||30||
    vidyanandamayi nanda bhadrakali svarupini | gayatri sucaritra ca kaulavrataparayana ||31|| hiranyagarbha
    bhugarbha mahagarbha sulocani | himavattanaya divya mahameghasvarupini ||32|| jaganmata jagaddhatri
    jagatamupakarini | aindri saumya tatha ghora varuni madhavi tatha ||33|| agneyi nairriti caiva aishani
    candikatmika | sumerutanaya nitya sarveshamupakarini ||34|| lalajjihva sarojakshi mundasrakparibhushita
    | sarvanandamayi sarva sarvanandasvarupini ||35|| dhritirmedha tatha lakshmih shraddha pannagagamini
    | rukmini janaki durgambika satyavati ratih ||36|| kamakhya kamada nanda narasimhi sarasvati | mahadevarata
    candi candadordandakhandini ||37|| dirghakeshi sukeshi ca pingakeshi mahakaca | bhavani bhavapatni
    ca bhavabhitihara sati ||38|| paurandari tatha vishnorjaya maheshvari tatha | sarvesham janani vidya
    carvangi daityanashini ||39|| sarvarupa maheshani kamini varavarnini | mahavidya mahamaya mahamedha
    mahotsava ||40|| virupa vishvarupa ca mridani mridavallabha | koticandrapratikasha shatasuryaprakashini
    ||41|| jahnukanya mahogra ca parvati vishvamohini | kamarupa maheshani nityotsaha manasvini ||42||
    vaikunthanathapatni ca tatha shankaramohini | kashyapi kamala krishna krishnarupa ca kalini ||43||
    maheshvari vrisharudha sarvavismayakarini | manya manavati shuddha kanya himagirestatha ||44|| aparna
    padmapatrakshi nagayajnopavitini | mahashankhadhara kanta kamaniya nagatmaja ||45|| brahmani vaishnavi
    shambhorjaya ganga jaleshvari | bhagirathi manobuddhirnitya vidyamayi tatha ||46|| harapriya girisuta
    harapatni tapasvini | mahavyadhihara devi mahaghorasvarupini ||47|| mahapunyaprabha bhima madhukaitabhanashini
    | shankhini vajrini dhatri tatha pustakadharini ||48|| camunda capala tunga shumbadaityanikrintani
    | shantirnidra mahanidra purnanidra ca renuka ||49|| kaumari kulaja kanti kaulavrataparayana | vanadurga
    sadacara draupadi drupadatmaja ||50|| yashasvini yashasya ca yashodhatri yashahprada | srishtirupa
    mahagauri nishumbaprananashini ||51|| padmini vasudha prithvi rohini vindhyavasini | shivashaktirmahashaktih
    shankhini shaktinirgata ||52|| daityapranahara devi sarvarakshanakarini | kshantih kshemankari caiva
    buddhirupa mahadhana ||53|| shrividya bhairavi bhavya bhavani bhavanashini | tapini bhavini sita tikshnatejahsvarupini
    ||54|| datri danapara kali durga daityavibhushana | mahapunyaprada bhima madhukaitabhanashini ||55||
    padma padmavati krishna tushta pushta tathorvashi | vajrini vajrahasta ca tatha narayani shiva ||56||
    khadgini khadgahasta ca khadgakharparadharini | devangana devakanya devamata pulomaja ||57|| sukhini
    svargadatri ca sarvasaukhyavivardhini | shila shilavati sukshma sukshmakara varaprada ||58|| varenya
    varada vani jnanini jnanada sada | ugrakali mahakali bhadrakali ca dakshina ||59|| bhriguvamshasamudbhuta
    bhargavi bhriguvallabha | shulini shulahasta ca kartrikharparadharini ||60|| mahavamshasamudbhuta
    mayuravaravahana | mahashankharata rakta raktakharparadharini ||61|| raktambaradhara rama ramani suranayika
    | mokshada shivada shyama madavibhramamanthara ||62|| paramanandada jyeshtha yogini ganasevita | sara
    jambavati caiva satyabhama nagatmaja ||63|| raudra raudrabala ghora rudrasararunatmika | rudrarupa
    maharaudri raudradaityavinashini ||64|| kaumari kaushiki canda kaladaityavinashini | shambhupatni
    shambhurata shambujaya mahodari ||65|| shivapatni shivarata shivajaya shivapriya | harapatni hararata
    harajaya harapriya ||66|| madanantakakanta ca madanantakavallabha | girija girikanya ca girishasya
    ca vallabha ||67|| bhuta bhavya bhava spashta pavani parapalini | adrishya ca vyaktarupa ishtanishtapravarddhini
    ||68|| acyuta pracyutaprana pramada vasaveshvari | apamnidhisamudbhuta dharini ca pratishthita ||69||
    udbhava kshobhana kshema shrigarbha parameshvari | kamala pushpadeha ca kamini kanjalocana ||70||
    sharanya kamala pritirvimalanandavardhini | kapardini karala ca nirmala devarupini ||71|| udirnabhushana
    bhavya surasena mahodari | shrimati shishira navya shishiracalakanyaka ||72|| suramanya surashreshtha
    jyeshtha praneshvari sthira | tamoghni dhvantasamhantri prayatatma pativrata ||73|| pradyotini ratharudha
    sarvalokaprakashini | medhavini mahavirya hamsi samsaratarini ||74|| pranatapraninamartiharini daityanashini
    | dakini shakinidevi varakhatvangadharini ||75|| kaumudi kumuda kunda kaulika kulajamara | garvita
    gunasampanna nagaja khagavahini ||76|| candranana mahogra ca carumurdhajashobhana | manojna madhavi
    manya mananiya satam suhrit ||77|| jyeshtha shreshtha magha pushya dhanishtha purvaphalguni | raktabijanihantri
    ca raktabijavinashini ||78|| candamundanihantri ca candamundavinashini | kartri hartri sukartri ca
    vimalamalavahini ||79|| vimala bhaskari vina mahishasuraghatini | kalindi yamuna vriddha surabhih
    balika sati ||80|| kaushalya kaumudi maitrirupini capyarundhati | purarigrihini purna purnanandasvarupini
    ||81|| pundarikakshapatni ca pundarikakshavallabha | sampurnacandravadana balacandrasamaprabha ||82||
    revati ramani citra citrambaravibhushanam | sita vinavati caiva yashoda vijaya priya ||83|| navapushpasamudbhuta
    navapushpotsavotsava | navapushpasrajamala malyabhushanabhushita ||84|| navapushpasamaprana navapushpotsavapriya
    | pretamandalamadhyasta sarvangasundari shiva ||85|| navapushpatmika shashthi pushpastavakamandala
    | navapushpagunopeta shmashanabhairavapriya ||86|| kulashastrapradipa ca kulamargapravarddhini | shmashanabhairavi
    kali bhairavi bhairavapriya ||87|| anandabhairavi dhyeya bhairavi kurubhairavi | mahabhairavasamprita
    bhairavikulamohini ||88|| shrividyabhairavi nitibhairavi gunabhairavi | sammohabhairavi pushtibhairavi
    tushtibhairavi ||89|| samharabhairavi srishtibhairavi sthitibhairavi | anandabhairavi vira sundari
    sthitisundari ||90|| gunanandasvarupa ca sundari kalarupini | shrimayasundari saumyasundari lokasundari
    ||91|| shrividyamohini buddhirmahabuddhisvarupini | mallika hararasika haralambanasundari ||92|| nilapankajavarna
    ca nagakesarabhushita | japakusumasankasha japakusumashobhita ||93|| priya priyankari vishnordanavendravinashini
    | jnaneshvari jnanadatri jnananandapradayini ||94|| gunagauravasampanna gunashilasamanvita | rupayauvanasampanna
    rupayauvanashobhita ||95|| gunashraya gunarata gunagauravasundari | madiramodamatta ca tatankadvayashobhita
    ||96|| vrikshamulasthita devi vrikshashakhoparisthita | talamadhyagranilaya vrikshamadhyanivasini
    ||97|| svayambhupushpasankasha svayambhupushpadharini | svayambhukusumaprita svayambhupushpashobhini
    ||98|| svayambhupushparasika nagna dhyanavati sudha | shukrapriya shukrarata shukramajjanatatpara
    ||99|| purnaparna suparna ca nishparna papanashini | madiramodasampanna madiramodadharini ||100||
    sarvashraya sarvaguna nandanandanadharini | naripushpasamudbhuta naripushpotsavotsava ||101|| naripushpasamaprana
    naripushparata mrigi | sarvakalodbhavaprita sarvakalodbhavotsava ||102|| caturbhuja dashabhuja ashtadashabhuja
    tatha | dvibhuja shadbhuja prita raktapankajashobhita ||103|| kauberi kauravi kaurya kurukulla kapalini
    | sudirghakadalijangha rambhoru ramavallabha ||104|| nishacari nishamurtirnishacandrasamaprabha |
    candri candrakala candra carucandranibhanana ||105|| srotasvati srutimati sarvadurgatinashini | sarvadhara
    sarvamayi sarvanandasvarupini ||106|| sarvacakreshvari sarva sarvamantramayi shubha | sahasranayanaprana
    sahasranayanapriya ||107|| sahasrashirsha sushama sadambha sarvabhakshika | yashtika yashticakrastha
    shadvargaphaladayini ||108|| shadvimshapadmamadhyastha shadvimshakulamadhyaga | hu~karavarnanilaya
    hu~karaksharabhushana ||109|| hakaravarnanilaya hakaraksharabhushana | harini haravalita harahirakabhushana
    ||110|| hrinkarabijasahita hrinkarairupashobhita | kandarpasya kala kunda kaulini kuladarpita ||111||
    ketakikusumaprana ketakikritabhushana | ketakikusumasakta ketakiparibhushita ||112|| karpurapurnavadana
    mahamaya maheshvari | kala kelih kriya kirna kadambakusumotsuka ||113|| kadambini karishunda kunjareshvaragamini
    | kharva sukhanjanayana khanjanadvandvabhushana ||114|| khadyota iva durlaksha khadyota iva cancala
    | mahamaya jgaddhatri gitavadyapriya ratih ||115|| ganeshvari ganejya ca gunapujya gunaprada | gunadhya
    gunasampanna gunadatri gunatmika ||116|| gurvi gurutara gauri ganapatyaphalaprada | mahavidya mahamedha
    tulini ganamohini ||117|| bhavya bhavapriya bhavya bhavaniya bhavatmika | gharghara ghoravadana ghoradaityavinashini
    ||118|| ghora ghoravati ghosha ghoraputri ghanacala | carcari carunayana caruvaktra caturguna ||119||
    caturvedamayi candi candrasya caturanana | calaccakoranayana calatkhanjanalocana ||120|| caladambhojanilaya
    caladambhojalocana | chatri chatrapriya chatra chatracamarashobhita ||121|| chinnachada chinnashirashchinnanasa
    chalatmika | chaladhya chalasantrasta chalarupa chalasthira ||122|| chakaravarnanilaya chakaradhya
    chalapriya | chadmini chadmanirata chadmacchadmanivasini ||123|| jagannathapriya jiva jaganmuktikari
    mata | jirna jimutavanita jimutairupashobhita ||124|| jamatrivarada jambha jamalarjunabhanjini | jharjhari
    jhakritirjhalli jhari jharjharika tatha ||125|| tankarakarini tika sarvatankarakarini | thankarangi
    damaruka dakara damarupriya ||126|| dhakkaravarata nitya tulasi manibhushita | tula ca tolika tirna
    tara taranika tatha ||127|| tantravijna tantrarata tantravidya ca tantrada | tantriki tantrayogya
    ca tantrasara ca tantrika ||128|| tantradhari tantrakari sarvatantrasvarupini | tuhinamshusamanasya
    tuhinamshusamaprabha ||129|| tusharakaratulyangi tusharadharasundari | tantrasara tantrakaro tantrasarasvarupini
    ||130|| tusharadhamatulyasya tusharamshusamaprabha | tusharadrisuta tarkshya tarangi talasundari ||131||
    tarasvarena sahita tarasvaravibhushita | thakarakutanilaya thakaraksharamalini ||132|| dayavati dinarata
    duhkhadaridryanashini | daurbhagyaduhkhadalini daurbhagyapadanashini ||133|| duhita dinabandhushca
    danavendravinashini | danapatri danarata danasammanatoshita ||134|| dantyadisevita danta daya damodarapriya
    | dadhicivarada tushta danavendravimardini ||135|| dirghanetra dirghakaca dirghanasa ca dirghika |
    daridryaduhkhasamnasha daridryaduhkhanashini ||136|| dambhika dantura dambha dambhasuravaraprada |
    dhanadhanyaprada dhanya dhaneshvaradhanaprada ||137|| dharmapatni dharmarata dharmadharmavivivarddhini
    | dharmini dharmika dharmya dharmadharmavivarddhini ||138|| dhaneshvari dharmarata dharmanandapravarddhini
    | dhanadhyaksha dhanaprita dhanadhya dhanatoshita ||139|| dhira dhairyavati dhishnya dhavalambhojasamnibha
    | dharini dharini dhatri dhurani dharani dhara ||140|| dharmika dharmasahita dharmanindakavarjita
    | navina nagaja nimna nimnanabhirnageshvari ||141|| nutanambhojanayana navinambhojasundari | nagari
    nagarajyeshtha nagarajasuta naga ||142|| nagarajakritatosha nagarajavibhushita | nageshvari nagarudha
    nagarajakuleshvari ||143|| navinendukala nandi nandikeshvaravallabha | niraja nirajakshi ca nirajadvandvalocana
    ||144|| nira nirabhava vani niranirmaladehini | nagayajnopavitadhya nagayajnopavitika ||145|| nagakesarasantushta
    nagakesaramalini | navinaketakikunda
  devanagari: पुरुषार्थचतुष्टयसिद्ध्यर्थे विनियोगः ॥ तारा रात्रिर्महारात्रिर्कालरात्रिर्महामतिः । कालिका
    कामदा माया महामाया महास्मृतिः ॥२६॥ महादानरता यज्ञा यज्ञोत्सवविभूषिता । चन्द्रव्वज्रा चकोराक्षी चारुनेत्रा
    सुलोचना ॥२७॥ त्रिनेत्रा महती देवी कुरङ्गाक्षी मनोरमा । ब्राह्मी नारायणी ज्योत्स्ना चारुकेशी सुमूर्धजा
    ॥२८॥ वाराही वारुणी विद्या महाविद्या महेश्वरी । सिद्धा कुञ्चितकेशा च महायज्ञस्वरूपिणी ॥२९॥ गौरी चम्पकवर्णा
    च कृशाङ्गी शिवमोहिनी । सर्वानन्दस्वरूपा च सर्वशङ्कैकतारिणी ॥३०॥ विद्यानन्दमयी नन्दा भद्रकाली स्वरूपिणी
    । गायत्री सुचरित्रा च कौलव्रतपरायणा ॥३१॥ हिरण्यगर्भा भूगर्भा महागर्भा सुलोचनी । हिमवत्तनया दिव्या
    महामेघस्वरूपिणी ॥३२॥ जगन्माता जगद्धात्री जगतामुपकारिणी । ऐन्द्री सौम्या तथा घोरा वारुणी माधवी तथा
    ॥३३॥ आग्नेयी नैरृती चैव ऐशानी चण्डिकात्मिका । सुमेरुतनया नित्या सर्वेषामुपकारिणी ॥३४॥ ललज्जिह्वा सरोजाक्षी
    मुण्डस्रक्परिभूषिता । सर्वानन्दमयी सर्वा सर्वानन्दस्वरूपिणी ॥३५॥ धृतिर्मेधा तथा लक्ष्मीः श्रद्धा पन्नगगामिनी
    । रुक्मिणी जानकी दुर्गाम्बिका सत्यवती रतिः ॥३६॥ कामाख्या कामदा नन्दा नारसिंही सरस्वती । महादेवरता
    चण्डी चण्डदोर्दण्डखण्डिनी ॥३७॥ दीर्घकेशी सुकेशी च पिङ्गकेशी महाकचा । भवानी भवपत्नी च भवभीतिहरा सती
    ॥३८॥ पौरन्दरी तथा विष्णोर्जाया माहेश्वरी तथा । सर्वेषां जननी विद्या चार्वङ्गी दैत्यनाशिनी ॥३९॥ सर्वरूपा
    महेशानि कामिनी वरवर्णिनी । महाविद्या महामाया महामेधा महोत्सवा ॥४०॥ विरूपा विश्वरूपा च मृडानी मृडवल्लभा
    । कोटिचन्द्रप्रतीकाशा शतसूर्यप्रकाशिनी ॥४१॥ जह्नुकन्या महोग्रा च पार्वती विश्वमोहिनी । कामरूपा महेशानी
    नित्योत्साहा मनस्विनी ॥४२॥ वैकुण्ठनाथपत्नी च तथा शङ्करमोहिनी । काश्यपी कमला कृष्णा कृष्णरूपा च कालिनी
    ॥४३॥ माहेश्वरी वृषारूढा सर्वविस्मयकारिणी । मान्या मानवती शुद्धा कन्या हिमगिरेस्तथा ॥४४॥ अपर्णा पद्मपत्राक्षी
    नागयज्ञोपवीतिनी । महाशङ्खधरा कान्ता कमनीया नगात्मजा ॥४५॥ ब्रह्माणी वैष्णवी शम्भोर्जाया गङ्गा जलेश्वरी
    । भागीरथी मनोबुद्धिर्नित्या विद्यामयी तथा ॥४६॥ हरप्रिया गिरिसुता हरपत्नी तपस्विनी । महाव्याधिहरा देवी
    महाघोरस्वरूपिणी ॥४७॥ महापुण्यप्रभा भीमा मधुकैटभनाशिनी । शङ्खिनी वज्रिणी धात्री तथा पुस्तकधारिणी ॥४८॥
    चामुण्डा चपला तुङ्गा शुम्बदैत्यनिकृन्तनी । शान्तिर्निद्रा महानिद्रा पूर्णनिद्रा च रेणुका ॥४९॥ कौमारी
    कुलजा कान्ती कौलव्रतपरायणा । वनदुर्गा सदाचारा द्रौपदी द्रुपदात्मजा ॥५०॥ यशस्विनी यशस्या च यशोधात्री
    यशःप्रदा । सृष्टिरूपा महागौरी निशुम्बप्राणनाशिनी ॥५१॥ पद्मिनी वसुधा पृथ्वी रोहिणी विन्ध्यवासिनी ।
    शिवशक्तिर्महाशक्तिः शङ्खिनी शक्तिनिर्गता ॥५२॥ दैत्यप्राणहरा देवी सर्वरक्षणकारिणी । क्षान्तिः क्षेमङ्करी
    चैव बुद्धिरूपा महाधना ॥५३॥ श्रीविद्या भैरवि भव्या भवानी भवनाशिनी । तापिनी भाविनी सीता तीक्ष्णतेजःस्वरूपिणी
    ॥५४॥ दात्री दानपरा काली दुर्गा दैत्यविभूषणा । महापुण्यप्रदा भीमा मधुकैटभनाशिनी ॥५५॥ पद्मा पद्मावती
    कृष्णा तुष्टा पुष्टा तथोर्वशी । वज्रिणी वज्रहस्ता च तथा नारायणी शिवा ॥५६॥ खड्गिनी खड्गहस्ता च खड्गखर्परधारिणी
    । देवाङ्गना देवकन्या देवमाता पुलोमजा ॥५७॥ सुखिनी स्वर्गदात्री च सर्वसौख्यविवर्धिनी । शीला शीलावती
    सूक्ष्मा सूक्ष्माकारा वरप्रदा ॥५८॥ वरेण्या वरदा वाणी ज्ञानिनी ज्ञानदा सदा । उग्रकाली महाकाली भद्रकाली
    च दक्षिणा ॥५९॥ भृगुवंशसमुद्भूता भार्गवी भृगुवल्लभा । शूलिनी शूलहस्ता च कर्त्रीखर्परधारिणी ॥६०॥ महावंशसमुद्भूता
    मयूरवरवाहना । महाशङ्खरता रक्ता रक्तखर्परधारिणी ॥६१॥ रक्ताम्बरधरा रामा रमणी सुरनायिका । मोक्षदा शिवदा
    श्यामा मदविभ्रममन्थरा ॥६२॥ परमानन्ददा ज्येष्ठा योगिनी गणसेविता । सारा जाम्बवती चैव सत्यभामा नगात्मजा
    ॥६३॥ रौद्रा रौद्रबला घोरा रुद्रसारारुणात्मिका । रुद्ररूपा महारौद्री रौद्रदैत्यविनाशिनी ॥६४॥ कौमारी
    कौशिकी चण्डा कालदैत्यविनाशिनी । शम्भुपत्नी शम्भुरता शम्बुजाया महोदरी ॥६५॥ शिवपत्नी शिवरता शिवजाया
    शिवप्रिया । हरपत्नी हररता हरजाया हरप्रिया ॥६६॥ मदनान्तककान्ता च मदनान्तकवल्लभा । गिरिजा गिरिकन्या
    च गिरीशस्य च वल्लभा ॥६७॥ भूता भव्या भवा स्पष्टा पावनी परपालिनी । अदृश्या च व्यक्तरूपा इष्टानिष्टप्रवर्द्धिनी
    ॥६८॥ अच्युता प्रच्युतप्राणा प्रमदा वासवेश्वरी । अपांनिधिसमुद्भूता धारिणी च प्रतिष्ठिता ॥६९॥ उद्भवा
    क्षोभणा क्षेमा श्रीगर्भा परमेश्वरी । कमला पुष्पदेहा च कामिनी कञ्जलोचना ॥७०॥ शरण्या कमला प्रीतिर्विमलानन्दवर्धिनी
    । कपर्दिनी कराला च निर्मला देवरूपिणी ॥७१॥ उदीर्णभूषणा भव्या सुरसेना महोदरी । श्रीमती शिशिरा नव्या
    शिशिराचलकन्यका ॥७२॥ सुरमान्या सुरश्रेष्ठा ज्येष्ठा प्राणेश्वरी स्थिरा । तमोघ्नी ध्वान्तसंहन्त्री प्रयतात्मा
    पतिव्रता ॥७३॥ प्रद्योतिनी रथारूढा सर्वलोकप्रकाशिनी । मेधाविनी महावीर्या हंसी संसारतारिणी ॥७४॥ प्रणतप्राणिनामार्तिहारिणी
    दैत्यनाशिनी । डाकिनी शाकिनीदेवी वरखट्वाङ्गधारिणी ॥७५॥ कौमुदी कुमुदा कुन्दा कौलिका कुलजामरा । गर्विता
    गुणसम्पन्ना नगजा खगवाहिनी ॥७६॥ चन्द्रानना महोग्रा च चारुमूर्धजशोभना । मनोज्ञा माधवी मान्या माननीया
    सतां सुहृत् ॥७७॥ ज्येष्ठा श्रेष्ठा मघा पुष्या धनिष्ठा पूर्वफाल्गुनी । रक्तबीजनिहन्त्री च रक्तबीजविनाशिनी
    ॥७८॥ चण्डमुण्डनिहन्त्री च चण्डमुण्डविनाशिनी । कर्त्री हर्त्री सुकर्त्री च विमलामलवाहिनी ॥७९॥ विमला
    भास्करी वीणा महिषासुरघातिनी । कालिन्दी यमुना वृद्धा सुरभिः बालिका सती ॥८०॥ कौशल्या कौमुदी मैत्रीरूपिणी
    चाप्यरुन्धती । पुरारिगृहिणी पूर्णा पूर्णानन्दस्वरूपिणी ॥८१॥ पुण्डरीकाक्षपत्नी च पुण्डरीकाक्षवल्लभा
    । सम्पूर्णचन्द्रवदना बालचन्द्रसमप्रभा ॥८२॥ रेवती रमणी चित्रा चित्राम्बरविभूषणां । सीता वीणावती चैव
    यशोदा विजया प्रिया ॥८३॥ नवपुष्पसमुद्भूता नवपुष्पोत्सवोत्सवा । नवपुष्पस्रजामाला माल्यभूषणभूषिता ॥८४॥
    नवपुष्पसमप्राणा नवपुष्पोत्सवप्रिया । प्रेतमण्डलमध्यस्ता सर्वाङ्गसुन्दरी शिवा ॥८५॥ नवपुष्पात्मिका षष्ठी
    पुष्पस्तवकमण्डला । नवपुष्पगुणोपेता श्मशानभैरवप्रिया ॥८६॥ कुलशास्त्रप्रदीपा च कुलमार्गप्रवर्द्धिनी
    । श्मशानभैरवी काली भैरवी भैरवप्रिया ॥८७॥ आनन्दभैरवी ध्येया भैरवी कुरुभैरवी । महाभैरवसम्प्रीता भैरवीकुलमोहिनी
    ॥८८॥ श्रीविद्याभैरवी नीतिभैरवी गुणभैरवी । सम्मोहभैरवी पुष्टिभैरवी तुष्टिभैरवी ॥८९॥ संहारभैरवी सृष्टिभैरवी
    स्थितिभैरवी । आनन्दभैरवी वीरा सुन्दरी स्थितिसुन्दरी ॥९०॥ गुणानन्दस्वरूपा च सुन्दरी कालरूपिणी । श्रीमायासुन्दरी
    सौम्यसुन्दरी लोकसुन्दरी ॥९१॥ श्रीविद्यामोहिनी बुद्धिर्महाबुद्धिस्वरूपिणी । मल्लिका हाररसिका हारालम्बनसुन्दरी
    ॥९२॥ नीलपङ्कजवर्णा च नागकेसरभूषिता । जपाकुसुमसङ्काशा जपाकुसुमशोभिता ॥९३॥ प्रिया प्रियङ्करी विष्णोर्दानवेन्द्रविनाशिनी
    । ज्ञानेश्वरी ज्ञानदात्री ज्ञानानन्दप्रदायिनी ॥९४॥ गुणगौरवसम्पन्ना गुणशीलसमन्विता । रूपयौवनसम्पन्ना
    रूपयौवनशोभिता ॥९५॥ गुणाश्रया गुणरता गुणगौरवसुन्दरी । मदिरामोदमत्ता च ताटङ्कद्वयशोभिता ॥९६॥ वृक्षमूलस्थिता
    देवी वृक्षशाखोपरिस्थिता । तालमध्याग्रनिलया वृक्षमध्यनिवासिनी ॥९७॥ स्वयम्भूपुष्पसङ्काशा स्वयम्भूपुष्पधारिणी
    । स्वयम्भूकुसुमप्रीता स्वयम्भूपुष्पशोभिनी ॥९८॥ स्वयम्भूपुष्परसिका नग्ना ध्यानवती सुधा । शुक्रप्रिया
    शुक्ररता शुक्रमज्जनतत्परा ॥९९॥ पूर्णपर्णा सुपर्णा च निष्पर्णा पापनाशिनी । मदिरामोदसम्पन्ना मदिरामोदधारिणी
    ॥१००॥ सर्वाश्रया सर्वगुणा नन्दनन्दनधारिणी । नारीपुष्पसमुद्भूता नारीपुष्पोत्सवोत्सवा ॥१०१॥ नारीपुष्पसमप्राणा
    नारीपुष्परता मृगी । सर्वकालोद्भवप्रीता सर्वकालोद्भवोत्सवा ॥१०२॥ चतुर्भुजा दशभुजा अष्टादशभुजा तथा ।
    द्विभुजा षड्भुजा प्रीता रक्तपङ्कजशोभिता ॥१०३॥ कौबेरी कौरवी कौर्या कुरुकुल्ला कपालिनी । सुदीर्घकदलीजङ्घा
    रम्भोरू रामवल्लभा ॥१०४॥ निशाचरी निशामूर्तिर्निशाचन्द्रसमप्रभा । चान्द्री चान्द्रकला चन्द्रा चारुचन्द्रनिभानना
    ॥१०५॥ स्रोतस्वती स्रुतिमती सर्वदुर्गतिनाशिनी । सर्वाधारा सर्वमयी सर्वानन्दस्वरूपिणी ॥१०६॥ सर्वचक्रेश्वरी
    सर्वा सर्वमन्त्रमयी शुभा । सहस्रनयनप्राणा सहस्रनयनप्रिया ॥१०७॥ सहस्रशीर्षा सुषमा सदम्भा सर्वभक्षिका
    । यष्टिका यष्टिचक्रस्था षद्वर्गफलदायिनी ॥१०८॥ षड्विंशपद्ममध्यस्था षड्विंशकुलमध्यगा । हूँकारवर्णनिलया
    हूँकाराक्षरभूषणा ॥१०९॥ हकारवर्णनिलया हकाराक्षरभूषणा । हारिणी हारवलिता हारहीरकभूषणा ॥११०॥ ह्रीङ्कारबीजसहिता
    ह्रीङ्कारैरुपशोभिता । कन्दर्पस्य कला कुन्दा कौलिनी कुलदर्पिता ॥१११॥ केतकीकुसुमप्राणा केतकीकृतभूषणा
    । केतकीकुसुमासक्ता केतकीपरिभूषिता ॥११२॥ कर्पूरपूर्णवदना महामाया महेश्वरी । कला केलिः क्रिया कीर्णा
    कदम्बकुसुमोत्सुका ॥११३॥ कादम्बिनी करिशुण्डा कुञ्जरेश्वरगामिनी । खर्वा सुखञ्जनयना खञ्जनद्वन्द्वभूषणा
    ॥११४॥ खद्योत इव दुर्लक्षा खद्योत इव चञ्चला । महामाया ज्गद्धात्री गीतवाद्यप्रिया रतिः ॥११५॥ गणेश्वरी
    गणेज्या च गुणपूज्या गुणप्रदा । गुणाढ्या गुणसम्पन्ना गुणदात्री गुणात्मिका ॥११६॥ गुर्वी गुरुतरा गौरी
    गाणपत्यफलप्रदा । महाविद्या महामेधा तुलिनी गणमोहिनी ॥११७॥ भव्या भवप्रिया भाव्या भावनीया भवात्मिका ।
    घर्घरा घोरवदना घोरदैत्यविनाशिनी ॥११८॥ घोरा घोरवती घोषा घोरपुत्री घनाचला । चर्चरी चारुनयना चारुवक्त्रा
    चतुर्गुणा ॥११९॥ चतुर्वेदमयी चण्डी चन्द्रास्या चतुरानना । चलच्चकोरनयना चलत्खञ्जनलोचना ॥१२०॥ चलदम्भोजनिलया
    चलदम्भोजलोचना । छत्री छत्रप्रिया छत्रा छत्रचामरशोभिता ॥१२१॥ छिन्नछदा छिन्नशिराश्छिन्ननासा छलात्मिका
    । छलाढ्या छलसन्त्रस्ता छलरूपा छलस्थिरा ॥१२२॥ छकारवर्णनिलया छकाराढ्या छलप्रिया । छद्मिनी छद्मनिरता
    छद्मच्छद्मनिवासिनी ॥१२३॥ जगन्नाथप्रिया जीवा जगन्मुक्तिकरी मता । जीर्णा जीमूतवनिता जीमूतैरुपशोभिता
    ॥१२४॥ जामातृवरदा जम्भा जमलार्जुनभञ्जिनी । झर्झरी झाकृतिर्झल्ली झरी झर्झरिका तथा ॥१२५॥ टङ्कारकारिणी
    टीका सर्वटङ्कारकारिणी । ठङ्कराङ्गी डमरुका डाकारा डमरुप्रिया ॥१२६॥ ढक्कारावरता नित्या तुलसी मणिभूषिता
    । तुला च तोलिका तीर्णा तारा तारणिका तथा ॥१२७॥ तन्त्रविज्ञा तन्त्ररता तन्त्रविद्या च तन्त्रदा । तान्त्रिकी
    तन्त्रयोग्या च तन्त्रसारा च तन्त्रिका ॥१२८॥ तन्त्रधारी तन्त्रकरी सर्वतन्त्रस्वरूपिणी । तुहिनांशुसमानास्या
    तुहिनांशुसमप्रभा ॥१२९॥ तुषाराकरतुल्याङ्गी तुषाराधारसुन्दरी । तन्त्रसारा तन्त्रकरो तन्त्रसारस्वरूपिणी
    ॥१३०॥ तुषारधामतुल्यास्या तुषारांशुसमप्रभा । तुषाराद्रिसुता तार्क्ष्या ताराङ्गी तालसुन्दरी ॥१३१॥ तारस्वरेण
    सहिता तारस्वरविभूषिता । थकारकूटनिलया थकाराक्षरमालिनी ॥१३२॥ दयावती दीनरता दुःखदारिद्र्यनाशिनी । दौर्भाग्यदुःखदलिनी
    दौर्भाग्यपदनाशिनी ॥१३३॥ दुहिता दीनबन्धुश्च दानवेन्द्रविनाशिनी । दानपात्री दानरता दानसम्मानतोषिता ॥१३४॥
    दान्त्यादिसेविता दान्ता दया दामोदरप्रिया । दधीचिवरदा तुष्टा दानवेन्द्रविमर्दिनी ॥१३५॥ दीर्घनेत्रा
    दीर्घकचा दीर्घनासा च दीर्घिका । दारिद्र्यदुःखसंनाशा दारिद्र्यदुःखनाशिनी ॥१३६॥ दाम्भिका दन्तुरा दम्भा
    दम्भासुरवरप्रदा । धनधान्यप्रदा धन्या धनेश्वरधनप्रदा ॥१३७॥ धर्मपत्नी धर्मरता धर्माधर्मविविवर्द्धिनी
    । धर्मिणी धर्मिका धर्म्या धर्माधर्मविवर्द्धिनी ॥१३८॥ धनेश्वरी धर्मरता धर्मानन्दप्रवर्द्धिनी । धनाध्यक्षा
    धनप्रीता धनाढ्या धनतोषिता ॥१३९॥ धीरा धैर्यवती धिष्ण्या धवलाम्भोजसंनिभा । धरिणी धारिणी धात्री धूरणी
    धरणी धरा ॥१४०॥ धार्मिका धर्मसहिता धर्मनिन्दकवर्जिता । नवीना नगजा निम्ना निम्ननाभिर्नगेश्वरी ॥१४१॥
    नूतनाम्भोजनयना नवीनाम्भोजसुन्दरी । नागरी नगरज्येष्ठा नगराजसुता नगा ॥१४२॥ नागराजकृततोषा नागराजविभूषिता
    । नागेश्वरी नागरूढा नागराजकुलेश्वरी ॥१४३॥ नवीनेन्दुकला नान्दी नन्दिकेश्वरवल्लभा । नीरजा नीरजाक्षी
    च नीरजद्वन्द्वलोचना ॥१४४॥ नीरा नीरभवा वाणी नीरनिर्मलदेहिनी । नागयज्ञोपवीताढ्या नागयज्ञोपवीतिका ॥१४५॥
    नागकेसरसन्तुष्टा नागकेसरमालिनी । नवीनकेतकीकुन्द
