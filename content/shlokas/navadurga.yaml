id: navadurga
category: stotram
name:
  english: navadurga
  devanagari: नवदुर्ग
content:
  english: navadurgastotram devi shailaputri | vande vanchitalabhaya candrardhakritashekharam | vrisharudham
    shuladharam shailaputrim yashasvinim || devi brahmacarini | dadhana karapadmabhyamakshamalakamandalu
    | devi prasidatu mayi brahmacarinyanuttama || devi candraghanteti | pindajapravararudha candakopastrakairyuta
    | prasadam tanute mahyam candraghanteti vishruta || devi kushmamda | surasampurnakalasham rudhiraplutameva
    ca | dadhana hastapadmabhyam kushmanda shubhadastu me || deviskandamata | simhasanagata nityam padmashritakaradvaya
    | shubhadastu sada devi skandamata yashasvini || devikatyayani | candrahasojjvalakara shardulavaravahana
    | katyayani shubham dadyadevi danavaghatini || devikalaratri | ekaveni japakarnapura nagna kharasthita
    | lamboshthi karnikakarni tailabhyaktasharirini || vamapadollasallohalatakantakabhushana | vardhanmurdhadhvaja
    krishna kalaratrirbhayankari || devimahagauri | shvete vrishe samarudha shvetambaradhara shucih |
    mahagauri shubham dadyanmahadevapramodada || devisiddhidatri | siddhagandharvayakshadyairasurairamarairapi
    | sevyamana sada bhuyat siddhida siddhidayini || iti navadurgastotram sampurnam |
  devanagari: नवदुर्गास्तोत्रम् देवी शैलपुत्री । वन्दे वाञ्छितलाभाय चन्द्रार्धकृतशेखराम् । वृषारूढां शूलधरां
    शैलपुत्रीं यशस्विनीम् ॥ देवी ब्रह्मचारिणी । दधाना करपद्माभ्यामक्षमालाकमण्डलू । देवी प्रसीदतु मयि ब्रह्मचारिण्यनुत्तमा
    ॥ देवी चन्द्रघण्टेति । पिण्डजप्रवरारूढा चण्डकोपास्त्रकैर्युता । प्रसादं तनुते मह्यं चन्द्रघण्टेति
    विश्रुता ॥ देवी कूष्मांडा । सुरासम्पूर्णकलशं रुधिराप्लुतमेव च । दधाना हस्तपद्माभ्यां कूष्माण्डा शुभदास्तु
    मे ॥ देवीस्कन्दमाता । सिंहासनगता नित्यं पद्माश्रितकरद्वया । शुभदास्तु सदा देवी स्कन्दमाता यशस्विनी
    ॥ देवीकात्यायनी । चन्द्रहासोज्ज्वलकरा शार्दूलवरवाहना । कात्यायनी शुभं दद्यादेवी दानवघातिनी ॥ देवीकालरात्रि
    । एकवेणी जपाकर्णपूरा नग्ना खरास्थिता । लम्बोष्ठी कर्णिकाकर्णी तैलाभ्यक्तशरीरिणी ॥ वामपादोल्लसल्लोहलताकण्टकभूषणा
    । वर्धन्मूर्धध्वजा कृष्णा कालरात्रिर्भयङ्करी ॥ देवीमहागौरी । श्वेते वृषे समारूढा श्वेताम्बरधरा शुचिः
    । महागौरी शुभं दद्यान्महादेवप्रमोददा ॥ देवीसिद्धिदात्रि । सिद्धगन्धर्वयक्षाद्यैरसुरैरमरैरपि । सेव्यमाना
    सदा भूयात् सिद्धिदा सिद्धिदायिनी ॥ इति नवदुर्गास्तोत्रं सम्पूर्णम् ।
