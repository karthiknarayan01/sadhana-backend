id: kalyanatrimshatikastotram
category: stotram
name:
  english: kalyanatrimshatikastotram
  devanagari: कल्याणत्रिंशतिकास्तोत्रम्
content:
  english: kalyanatrimshatikastotram evankarasamapanna kayavakacittabuddhitah | karomi satatam tasya nutim
    pujam pradakshinam || 1|| ya devi sarvasattvanam srishtisamharakarini | namastasyai namastasyai namastasyai
    namo namah || 2|| ya devi sarvabhutanam pratipale pratishthita | namastasyai namastasyai namastasyai
    namo namah || 3|| ya devi devadevinam devatarupini sthita | namastasyai namastasyai namastasyai namo
    namah || 4|| ya devi daityadurdantadaharupa bhayanaka | namastasyai namastasyai namastasyai namo namah
    || 5|| ya devi sarvanaganam sahasramukhanagini | namastasyai namastasyai namastasyai namo namah ||
    6|| ya devi saptapatale shantarupena samsthita | namastasyai namastasyai namastasyai namo namah ||
    7|| ya devi naranarinam vedamata cidambika | namastasyai namastasyai namastasyai namo namah || 8||
    ya devi kshatrinivaishyashudrijatiprapujita | namastasyai namastasyai namastasyai namo namah || 9||
    ya devi pretalokanam palanaya maharddhika | namastasyai namastasyai namastasyai namo namah || 10||
    ya devi sarvatiryakshu tarini tapanashini | namastasyai namastasyai namastasyai namo namah || 11||
    ya devi narakiyanam duhkhabhajam ca matrika | namastasyai namastasyai namastasyai namo namah || 12||
    ya devi shodashasankhyanarakanam vinashini | namastasyai namastasyai namastasyai namo namah || 13||
    ya devi dveshiraginam mohinam durdurikrita | namastasyai namastasyai namastasyai namo namah || 14||
    ya devi kamakrodhabhyam krodharupena samsthita | namastasyai namastasyai namastasyai namo namah ||
    15|| ya devi lobhalabhanam langhanaya vilambita | namastasyai namastasyai namastasyai namo namah ||
    16|| ya devi mayaya mata matrinam vajrayogini | namastasyai namastasyai namastasyai namo namah ||
    17|| ya devi rajacauragnisimhashatruvinashini | namastasyai namastasyai namastasyai namo namah ||
    18|| ya devi jalanagahidurbhikshabhayatarini | namastasyai namastasyai namastasyai namo namah || 19||
    ya devi pancabhutanam candre surye pratishthita | namastasyai namastasyai namastasyai namo namah ||
    20|| ya devi bhautiki vela alikalivicarini | namastasyai namastasyai namastasyai namo namah || 21||
    ya devi sarvapitheshi kshetrarupopachandika | namastasyai namastasyai namastasyai namo namah || 22||
    ya devi pilavakhyata upapilavamilita | namastasyai namastasyai namastasyai namo namah || 23|| ya devi
    dvadashe cakre rashilagnavibhushini | namastasyai namastasyai namastasyai namo namah || 24|| ya devi
    shadange deshe prodbuddhamukhacandrika | namastasyai namastasyai namastasyai namo namah || 25|| ya
    devi candacakreshu gamini parameshvari | namastasyai namastasyai namastasyai namo namah || 26|| ya
    devi kayavakacitte mantrarupena gamini | namastasyai namastasyai namastasyai namo namah || 27|| ya
    devi nirmalatma shrirriddhisiddhibalaprada | namastasyai namastasyai namastasyai namo namah || 28||
    ya devo sarvajantunam sada mangalakarini | namastasyai namastasyai namastasyai namo namah || 29||
    ya idam pathate dhiman devya bhaktisamanvitah | buddhatvam labhate shighram kalyanam mangalam shivam
    || 30|| iti shri trikayanivasinivajradevyah kalyanatrimshatikastotram sampurnam ||
  devanagari: कल्याणत्रिंशतिकास्तोत्रम् एवङ्कारसमापन्ना कायवाकचित्तबुद्धितः । करोमि सततं तस्या नुतिं पूजां
    प्रदक्षिणाम् ॥ १॥ या देवी सर्वसत्त्वानां सृष्टिसंहारकारिणी । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः
    ॥ २॥ या देवी सर्वभूतानां प्रतिपाले प्रतिष्ठिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ३॥ या देवी
    देवदेवीनां देवतारूपिणी स्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ४॥ या देवी दैत्यदुर्दान्तदाहरूपा
    भयानका । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ५॥ या देवी सर्वनागानां सहस्रमुखनागिनी । नमस्तस्यै
    नमस्तस्यै नमस्तस्यै नमो नमः ॥ ६॥ या देवी सप्तपाताले शान्तरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै
    नमो नमः ॥ ७॥ या देवी नरनारीणां वेदमाता चिदम्बिका । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ८॥ या देवी
    क्षत्रिणीवैश्याशूद्रीजातिप्रपूजिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ९॥ या देवी प्रेतलोकानां
    पालनाय महर्द्धिका । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १०॥ या देवी सर्वतिर्यक्षु तारिणी तापनाशिनी
    । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ११॥ या देवी नारकीयाणां दुःखभाजां च मातृका । नमस्तस्यै नमस्तस्यै
    नमस्तस्यै नमो नमः ॥ १२॥ या देवी षोडशसङ्ख्यनरकाणां विनाशिनी । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः
    ॥ १३॥ या देवी द्वेषिरागीणां मोहिनां दुर्दुरीकृता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १४॥ या
    देवी कामक्रोधाभ्यां क्रोधरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १५॥ या देवी लोभलाभानां
    लङ्घनाय विलम्बिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १६॥ या देवी मायाया माता मातॄणां वज्रयोगिणी
    । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १७॥ या देवी राजचौराग्निसिंहशत्रुविनाशिनी । नमस्तस्यै नमस्तस्यै
    नमस्तस्यै नमो नमः ॥ १८॥ या देवी जलनागाहिदुर्भिक्षभयतारिणी । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः
    ॥ १९॥ या देवी पञ्चभूतानां चन्द्रे सूर्ये प्रतिष्ठिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २०॥
    या देवी भौतिकी वेला आलिकालिविचारिणी । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २१॥ या देवी सर्वपीठेशी
    क्षेत्ररूपोपछन्दिका । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २२॥ या देवी पीलवाख्याता उपपीलवमीलिता
    । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २३॥ या देवी द्वादशे चक्रे राशिलग्नविभूषिणी । नमस्तस्यै नमस्तस्यै
    नमस्तस्यै नमो नमः ॥ २४॥ या देवी षडङ्गे देशे प्रोद्बुद्धमुखचन्द्रिका । नमस्तस्यै नमस्तस्यै नमस्तस्यै
    नमो नमः ॥ २५॥ या देवी चण्डचक्रेषु गामिनी परमेश्वरी । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २६॥ या
    देवी कायवाकचित्ते मन्त्ररूपेण गामिनी । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २७॥ या देवी निर्मलात्मा
    श्रीरृद्धिसिद्धिबलप्रदा । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २८॥ या देवो सर्वजन्तूनां सदा मङ्गलकारिणी
    । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २९॥ य इदं पठते धीमान् देव्या भक्तिसमन्वितः । बुद्धत्वं लभते
    शीघ्रं कल्याणं मङ्गलं शिवम् ॥ ३०॥ इति श्री त्रिकायनिवासिनीवज्रदेव्याः कल्याणत्रिंशतिकास्तोत्रं सम्पूर्णम्
    ॥
