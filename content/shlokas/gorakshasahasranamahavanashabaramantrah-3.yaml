    नमो स्वाहा । ॐ मृत्युञ्जयस्वरूप नमो स्वाहा । ॐ केवल योग द्वारा प्राप्ति को प्राप्त करने वाले नमो स्वाहा
    । ॐ भैरव शक्तिरूप नमो स्वाहा । ॐ शाबर मन्त्र प्रचिता नमो स्वाहा । ॐ तन्त्र मन्त्र महासिद्ध नमो स्वाहा
    । ॐ योग्य मार्गदशक नमो स्वाहा । ॐ सर्व सर्वतः गुरु सतगुरुस्वरूप नमो स्वाहा । ॐ गुढात्मा नमो स्वाहा
    । ॐ गुहयातीत गुहय ज्ञानी नमो स्वाहा । ॐ अपूर्व पुरुष नमो स्वाहा । ॐ नाथपन्थ के आर्भिभावी निर्माण नमो
    स्वाहा । ॐ सभी जिसके वृणि हो नमो स्वाहा । ॐ असङ्ख्य मार्ग द्वार से आत्म दर्शन आत्मज्ञान प्रगट कर्ता
    नमो स्वाहा । ॐ शिव गोरक्ष योगी नमो स्वाहा । १०००॥ हवन क्रिया के पश्चात साधक योगेश्वर ने अग्नि देवता
    को बेलपत्री पुष्प अष्टगन्ध अक्षदा इत्यादि समोपचारे या पञ्चोपचार या षोडशोपचार या यथा लब्धोपचार से पूजन
    करे तथा निम्न पञ्च अग्नि पाठ पढकर हवन करे । पञ्च अग्निपाठ तथा हवन हवन
