id: nasadiya-suktam
category: stotram
name:
  english: Nasadiya Suktam
content:
  english: nasadasinno sadasittadani nnasidrajo no vyoma paro yat | kimavarivah kuha kasya sharmannambhah
    kimasidgahana || na mrityurasidamrita hi na ratrya ahna asitpraketah | anidavatam svadhaya tadeka
    ntasmaddhanyanna parah ki || tama asittamasa gul 'praketam salilam sarvama idam | tucchyenabhvapihitam
    ya~dasittapasastanmahinajayataikam || || kamastadagre samavartatadhi manaso retah prathamam ya~dasit
    | sato bandhumasati niravindan hridi pratishya kavayo manisha || || tirashcino vitato rashmireshamadha
    t | retodha asanmahimana asantsvadha avastatprayatih parastat || || ko addha veda ka iha pra vocatkuta
    ajata kuta iyam vi~srishtih | arvagdeva asya visarjanenatha ko veda yata ababhuva || vi~srishtiryata
    ababhuva yadi va dadhe yadi va na | yo asyadhyakshah parame vyomantso anga veda yadi va na veda ||
  devanagari: नास॑दासी॒न्नो सदा॑सीत्त॒दानी॒ न्नासी॒द्रजो॒ नो व्यो॑मा प॒रो यत् । किमाव॑रीवः॒ कुह॒ कस्य॒
    शर्म॒न्नम्भः॒ किमा॑सी॒द्गह॑न ॥ न मृ॒त्युरा॑सीद॒मृत॒ हि॒ न रात्र्या॒ अह्न॑ आसीत्प्रके॒तः । आनी॑दवा॒तं
    स्व॒धया॒ तदेक॒ न्तस्मा॑द्धा॒न्यन्न प॒रः कि ॥ तम॑ आसी॒त्तम॑सा गू॒ल् ऽप्रके॒तं स॑लि॒लं सर्व॑मा इ॒दम्
    । तु॒च्छ्येना॒भ्वपि॑हितं॒ यँदासी॒त्तप॑स॒स्तन्म॑हि॒नाजा॑य॒तैक॑म् ॥ ॥ काम॒स्तदग्रे॒ सम॑वर्त॒ताधि॒ मन॑सो॒
    रेतः॑ प्रथ॒मं यँदासी॑त् । स॒तो बन्धु॒मस॑ति॒ निर॑विन्दन् हृ॒दि प्र॒तीष्या॑ क॒वयो॑ मनी॒षा ॥ ॥ ति॒र॒श्चीनो॒
    वित॑तो र॒श्मिरे॑षाम॒ध त् । रे॒तो॒धा आ॑सन्महि॒मान॑ आसन्त्स्व॒धा अ॒वस्ता॒त्प्रय॑तिः प॒रस्ता॑त् ॥ ॥ को
    अ॒द्धा वे॑द॒ क इ॒ह प्र वो॑च॒त्कुत॒ आजा॑ता॒ कुत॑ इ॒यं विँसृ॑ष्टिः । अ॒र्वाग्दे॒वा अ॒स्य वि॒सर्ज॑ने॒नाथा॒
    को वे॑द॒ यत॑ आब॒भूव॑ ॥ विँसृ॑ष्टि॒र्यत॑ आब॒भूव॒ यदि॑ वा द॒धे यदि॑ वा॒ न । यो अ॒स्याध्य॑क्षः पर॒मे
    व्यो॑म॒न्त्सो अ॒ङ्ग वे॑द॒ यदि॑ वा॒ न वेद॑ ॥
