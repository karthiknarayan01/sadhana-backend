id: tripuraristotram
category: stotram
name:
  english: tripuraristotram
  devanagari: त्रिपुरारिस्तोत्रम्
content:
  english: '| shiro gangavaripracarakshamo''sya namamah purarim murareh priyam tam || 1|| mukhaih pancabhih
    pancabhih pancashashtham trayisankhyayogangamaranyakani | jagau bhaktikandam haressaukhyabhandam namamah
    purarim murareh priyam tam || 2|| hareranghrito gangavari prasutam kaparde kaparde kaparddicakara
    | akharvam ca garvam haran jahnujaya namamah purarim murareh priyam tam || 3|| gurunam gururyo mato
    naradena upajno''pi shishyah parah purushasya | tritiyam gunam yo niyantum niyanta | namah purarim
    murareh priyam tam || 4|| samastagama mulamantrashca sarve yatah samprasuta yatah siddhimantrah |
    puranarnamadyam dasharnam japante namamah purarim murareh priyam tam || 5|| sadamnayamadyam jagau
    naradaya vikunthadhinathadavapyaiva purvam | tatah sheshatah sheshadharmam dadhara namamah purarim
    murareh priyam tam || 6|| kripato gato vyapivaikunthabhajam samipe dadarsha vrajesham rasesham | tato''nugrihito''khilaibhaktivaryaih
    namamah purarim murareh priyam tam || 7|| sthito yo nideshaya simhasane sve manivratakirne munivratamadhye
    | upajno gururjnanadanaya loke namamah purarim murareh priyam tam || 8|| vyasena kathitam punyam tripurarermahastavam
    | kirtayecchrinuyadyastu sa murareh priyo bhavet || 9||'
  devanagari: । शिरो गाङ्गवारिप्रचारक्षमोऽस्य नमामः पुरारिम् मुरारेः प्रियं तम् ॥ १॥ मुखैः पञ्चभिः पञ्चभिः
    पञ्चषष्ठं त्रयीसाङ्ख्ययोगाङ्गमारण्यकानि । जगौ भक्तिकाण्डं हरेस्सौख्यभाण्डं नमामः पुरारिं मुरारेः प्रियं
    तम् ॥ २॥ हरेरङ्घ्रितो गाङ्गवारि प्रसूतं कपर्दे कपर्दे कपर्द्दीचकार । अखर्वं च गर्वं हरन् जह्नुजाया
    नमामः पुरारिं मुरारेः प्रियं तम् ॥ ३॥ गुरूणां गुरुर्यो मतो नारदेन उपज्ञोऽपि शिष्यः परः पूरुषस्य ।
    तृतीयं गुणं यो नियन्तुं नियन्ता । नामः पुरारिं मुरारेः प्रियं तम् ॥ ४॥ समस्तागमा मूलमन्त्राश्च सर्वे
    यतः सम्प्रसूता यतः सिद्धिमन्त्राः । पुराणार्णमाद्यं दशार्णं जपन्ते नमामः पुरारिं मुरारेः प्रियं तम्
    ॥ ५॥ सदाम्नायमाद्यं जगौ नारदाय विकुण्ठाधिनाथादवाप्यैव पूर्वम् । ततः शेषतः शेषधर्मं दधार नमामः पुरारिं
    मुरारेः प्रियं तम् ॥ ६॥ कृपातो गतो व्यापिवैकुण्ठभाजां समीपे ददर्श व्रजेशं रसेशम् । ततोऽनुगृहीतोऽखिलैभक्तिवर्यैः
    नमामः पुरारिं मुरारेः प्रियं तम् ॥ ७॥ स्थितो यो निदेशाय सिंहासने स्वे मणिव्रातकीर्णे मुनिव्रातमध्ये
    । उपज्ञो गुरुर्ज्ञानदानाय लोके नमामः पुरारिं मुरारेः प्रियं तम् ॥ ८॥ व्यासेन कथितं पुण्यं त्रिपुरारेर्महास्तवम्
    । कीर्तयेच्छृणुयाद्यस्तु स मुरारेः प्रियो भवेत् ॥ ९॥
