id: evarani-nirnayinchirira
category: stotram
name:
  english: Evarani Nirnayinchirira
content:
  english: deshadi pallavi èvarani nirnayincirira ni nnètlaridhincirira nara varu || lèvarani || anu palavi
    shivudano madhavudano kamala bhavudano parabrahmano || èvarani || caranamu shivamantramunaku ma jivamu
    ma dhavamantramunaku rajivamu i vivaramu dèlisina ghanulaku mròkkèda vitaranaguna tyagaraja vinuta
    ni || nnètlaridhincirira ||
  devanagari: देशादि पल्लवि ऎवरनि निर्णयिञ्चिरिरा नि न्नॆट्लारिधिञ्चिरिरा नर वरु ॥ लॆवरनि ॥ अनु पलवि शिवुडनो
    माधवुडनो कमल भवुडनो परब्रह्मनो ॥ ऎवरनि ॥ चरणमु शिवमन्त्रमुनकु मा जीवमु मा धवमन्त्रमुनकु राजीवमु ई
    विवरमु दॆलिसिन घनुलकु म्रॊक्कॆद वितरणगुण त्यागराज विनुत नि ॥ न्नॆट्लारिधिञ्चिरिरा ॥
