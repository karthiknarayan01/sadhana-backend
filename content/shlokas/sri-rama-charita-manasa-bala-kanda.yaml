    चकेउ हरषि हियँ जलचरकेतू ॥ सुनासीर मन महुँ असि त्रासा। चहत देवरिषि मम पुर बासा ॥ जे कामी लोलुप जग माहीं।
    कुटिल काक इव सबहि डेराहीम् ॥ दो सुख हाड़ लै भाग सठ स्वान निरखि मृगराज। छीनि लेइ जनि जान जड़ तिमि सुरपतिहि
    न लाज ॥ ॥ तेहि आश्रमहिं मदन जब गयू। निज मायाँ बसन्त निरमयू ॥ कुसुमित बिबिध बिटप बहुरङ्गा। कूजहिं कोकिल
    गुञ्जहि भृङ्गा ॥ चली सुहावनि त्रिबिध बयारी। काम कृसानु बढ़आवनिहारी ॥ रम्भादिक सुरनारि नबीना । सकल
    असमसर कला प्रबीना ॥ करहिं गान बहु तान तरङ्गा। बहुबिधि क्रीड़हि पानि पतङ्गा ॥ देखि सहाय मदन हरषाना।
    कीन्हेसि पुनि प्रपञ्च बिधि नाना ॥ काम कला कछु मुनिहि न ब्यापी। निज भयँ डरेउ मनोभव पापी ॥ सीम कि चाँपि
    सकि कौ तासु। बड़ रखवार रमापति जासू ॥ दो सहित सहाय सभीत अति मानि हारि मन मैन। गहेसि जाइ मुनि चरन तब
    कहि सुठि आरत बैन ॥ ॥ भयु न नारद मन कछु रोषा। कहि प्रिय बचन काम परितोषा ॥ नाइ चरन सिरु आयसु पाई। गयु
    मदन तब सहित सहाई ॥ मुनि सुसीलता आपनि करनी। सुरपति सभाँ जाइ सब बरनी ॥ सुनि सब कें मन अचरजु आवा। मुनिहि
    प्रसंसि हरिहि सिरु नावा ॥ तब नारद गवने सिव पाहीं। जिता काम अहमिति मन माहीम् ॥ मार चरित सङ्करहिं सुनाए।
    अतिप्रिय जानि महेस सिखाए ॥ बार बार बिनवुँ मुनि तोहीं। जिमि यह कथा सुनायहु मोहीम् ॥ तिमि जनि हरिहि
    सुनावहु कबहूँ। चलेहुँ प्रसङ्ग दुराएडु तबहूँ ॥ दो सम्भु दीन्ह उपदेस हित नहिं नारदहि सोहान। भारद्वाज
    कौतुक सुनहु हरि इच्छा बलवान ॥ ॥ राम कीन्ह चाहहिं सोइ होई। करै अन्यथा अस नहिं कोई ॥ सम्भु बचन मुनि
    मन नहिं भाए। तब बिरञ्चि के लोक सिधाए ॥ एक बार करतल बर बीना। गावत हरि गुन गान प्रबीना ॥ छीरसिन्धु गवने
    मुनिनाथा। जहँ बस श्रीनिवास श्रुतिमाथा ॥ हरषि मिले उठि रमानिकेता। बैठे आसन रिषिहि समेता ॥ बोले बिहसि
    चराचर राया। बहुते दिनन कीन्हि मुनि दाया ॥ काम चरित नारद सब भाषे। जद्यपि प्रथम बरजि सिवँ राखे ॥ अति
    प्रचण्ड रघुपति कै माया। जेहि न मोह अस को जग जाया ॥ दो रूख बदन करि बचन मृदु बोले श्रीभगवान । तुम्हरे
    सुमिरन तें मिटहिं मोह मार मद मान ॥ ॥ सुनु मुनि मोह होइ मन ताकें। ग्यान बिराग हृदय नहिं जाके ॥ ब्रह्मचरज
    ब्रत रत मतिधीरा। तुम्हहि कि करि मनोभव पीरा ॥ नारद कहेउ सहित अभिमाना। कृपा तुम्हारि सकल भगवाना ॥ करुनानिधि
    मन दीख बिचारी। उर अङ्कुरेउ गरब तरु भारी ॥ बेगि सो मै डारिहुँ उखारी। पन हमार सेवक हितकारी ॥ मुनि कर
    हित मम कौतुक होई। अवसि उपाय करबि मै सोई ॥ तब नारद हरि पद सिर नाई। चले हृदयँ अहमिति अधिकाई ॥ श्रीपति
    निज माया तब प्रेरी। सुनहु कठिन करनी तेहि केरी ॥ दो बिरचेउ मग महुँ नगर तेहिं सत जोजन बिस्तार। श्रीनिवासपुर
    तें अधिक रचना बिबिध प्रकार ॥ ॥ बसहिं नगर सुन्दर नर नारी। जनु बहु मनसिज रति तनुधारी ॥ तेहिं पुर बसि
    सीलनिधि राजा। अगनित हय गय सेन समाजा ॥ सत सुरेस सम बिभव बिलासा। रूप तेज बल नीति निवासा ॥ बिस्वमोहनी
    तासु कुमारी। श्री बिमोह जिसु रूपु निहारी ॥ सोइ हरिमाया सब गुन खानी। सोभा तासु कि जाइ बखानी ॥ करि स्वयम्बर
    सो नृपबाला। आए तहँ अगनित महिपाला ॥ मुनि कौतुकी नगर तेहिं गयू। पुरबासिंह सब पूछत भयू ॥ सुनि सब चरित
    भूपगृहँ आए। करि पूजा नृप मुनि बैठाए ॥ दो आनि देखाई नारदहि भूपति राजकुमारि। कहहु नाथ गुन दोष सब एहि
    के हृदयँ बिचारि ॥ ॥ देखि रूप मुनि बिरति बिसारी। बड़ई बार लगि रहे निहारी ॥ लच्छन तासु बिलोकि भुलाने।
    हृदयँ हरष नहिं प्रगट बखाने ॥ जो एहि बरि अमर सोइ होई। समरभूमि तेहि जीत न कोई ॥ सेवहिं सकल चराचर ताही।
    बरि सीलनिधि कन्या जाही ॥ लच्छन सब बिचारि उर राखे। कछुक बनाइ भूप सन भाषे ॥ सुता सुलच्छन कहि नृप पाहीं।
    नारद चले सोच मन माहीम् ॥ करौं जाइ सोइ जतन बिचारी। जेहि प्रकार मोहि बरै कुमारी ॥ जप तप कछु न होइ तेहि
    काला। हे बिधि मिलि कवन बिधि बाला ॥ दो एहि अवसर चाहिअ परम सोभा रूप बिसाल। जो बिलोकि रीझै कुअँरि तब
    मेलै जयमाल ॥ ॥ हरि सन मागौं सुन्दरताई। होइहि जात गहरु अति भाई ॥ मोरें हित हरि सम नहिं कोऊ। एहि अवसर
    सहाय सोइ होऊ ॥ बहुबिधि बिनय कीन्हि तेहि काला। प्रगटेउ प्रभु कौतुकी कृपाला ॥ प्रभु बिलोकि मुनि नयन
    जुड़आने। होइहि काजु हिएँ हरषाने ॥ अति आरति कहि कथा सुनाई। करहु कृपा करि होहु सहाई ॥ आपन रूप देहु प्रभु
    मोही। आन भाँति नहिं पावौं ओही ॥ जेहि बिधि नाथ होइ हित मोरा। करहु सो बेगि दास मैं तोरा ॥ निज माया बल
    देखि बिसाला। हियँ हँसि बोले दीनदयाला ॥ दो जेहि बिधि होइहि परम हित नारद सुनहु तुम्हार। सोइ हम करब न
    आन कछु बचन न मृषा हमार ॥ ॥ कुपथ माग रुज ब्याकुल रोगी। बैद न देइ सुनहु मुनि जोगी ॥ एहि बिधि हित तुम्हार
    मैं ठयू। कहि अस अन्तरहित प्रभु भयू ॥ माया बिबस भे मुनि मूढ़आ। समुझी नहिं हरि गिरा निगूढ़आ ॥ गवने तुरत
    तहाँ रिषिराई। जहाँ स्वयम्बर भूमि बनाई ॥ निज निज आसन बैठे राजा। बहु बनाव करि सहित समाजा ॥ मुनि मन हरष
    रूप अति मोरें। मोहि तजि आनहि बारिहि न भोरेम् ॥ मुनि हित कारन कृपानिधाना। दीन्ह कुरूप न जाइ बखाना ॥
    सो चरित्र लखि काहुँ न पावा। नारद जानि सबहिं सिर नावा ॥ दो रहे तहाँ दुइ रुद्र गन ते जानहिं सब भेउ।
    बिप्रबेष देखत फिरहिं परम कौतुकी तेउ ॥ ॥ जेंहि समाज बैण्ठे मुनि जाई। हृदयँ रूप अहमिति अधिकाई ॥ तहँ
    बैठ महेस गन दोऊ। बिप्रबेष गति लखि न कोऊ ॥ करहिं कूटि नारदहि सुनाई। नीकि दीन्हि हरि सुन्दरताई ॥ रीझहि
    राजकुअँरि छबि देखी। इन्हहि बरिहि हरि जानि बिसेषी ॥ मुनिहि मोह मन हाथ पराएँ। हँसहिं सम्भु गन अति सचु
    पाएँ ॥ जदपि सुनहिं मुनि अटपटि बानी। समुझि न परि बुद्धि भ्रम सानी ॥ काहुँ न लखा सो चरित बिसेषा। सो
    सरूप नृपकन्याँ देखा ॥ मर्कट बदन भयङ्कर देही। देखत हृदयँ क्रोध भा तेही ॥ दो सखीं सङ्ग लै कुअँरि तब
    चलि जनु राजमराल। देखत फिरि महीप सब कर सरोज जयमाल ॥ ॥ जेहि दिसि बैठे नारद फूली। सो दिसि देहि न बिलोकी
    भूली ॥ पुनि पुनि मुनि उकसहिं अकुलाहीं। देखि दसा हर गन मुसकाहीम् ॥ धरि नृपतनु तहँ गयु कृपाला। कुअँरि
    हरषि मेलेउ जयमाला ॥ दुलहिनि लै गे लच्छिनिवासा। नृपसमाज सब भयु निरासा ॥ मुनि अति बिकल मोंहँ मति नाठी।
    मनि गिरि गी छूटि जनु गाँठी ॥ तब हर गन बोले मुसुकाई। निज मुख मुकुर बिलोकहु जाई ॥ अस कहि दौ भागे भयँ
    भारी। बदन दीख मुनि बारि निहारी ॥ बेषु बिलोकि क्रोध अति बाढ़आ। तिन्हहि सराप दीन्ह अति गाढ़आ ॥ दो होहु
    निसाचर जाइ तुम्ह कपटी पापी दौ। हँसेहु हमहि सो लेहु फल बहुरि हँसेहु मुनि कौ ॥ ॥ पुनि जल दीख रूप निज
    पावा। तदपि हृदयँ सन्तोष न आवा ॥ फरकत अधर कोप मन माहीं। सपदी चले कमलापति पाहीम् ॥ देहुँ श्राप कि मरिहुँ
    जाई। जगत मोर उपहास कराई ॥ बीचहिं पन्थ मिले दनुजारी। सङ्ग रमा सोइ राजकुमारी ॥ बोले मधुर बचन सुरसाईं।
    मुनि कहँ चले बिकल की नाईम् ॥ सुनत बचन उपजा अति क्रोधा। माया बस न रहा मन बोधा ॥ पर सम्पदा सकहु नहिं
    देखी। तुम्हरें इरिषा कपट बिसेषी ॥ मथत सिन्धु रुद्रहि बौरायहु। सुरन्ह प्रेरी बिष पान करायहु ॥ दो असुर
    सुरा बिष सङ्करहि आपु रमा मनि चारु। स्वारथ साधक कुटिल तुम्ह सदा कपट ब्यवहारु ॥ ॥ परम स्वतन्त्र न सिर
    पर कोई। भावि मनहि करहु तुम्ह सोई ॥ भलेहि मन्द मन्देहि भल करहू। बिसमय हरष न हियँ कछु धरहू ॥ डहकि डहकि
    परिचेहु सब काहू। अति असङ्क मन सदा उछाहू ॥ करम सुभासुभ तुम्हहि न बाधा। अब लगि तुम्हहि न काहूँ साधा
    ॥ भले भवन अब बायन दीन्हा। पावहुगे फल आपन कीन्हा ॥ बञ्चेहु मोहि जवनि धरि देहा। सोइ तनु धरहु श्राप मम
    एहा ॥ कपि आकृति तुम्ह कीन्हि हमारी। करिहहिं कीस सहाय तुम्हारी ॥ मम अपकार कीन्ही तुम्ह भारी। नारी बिरहँ
    तुम्ह होब दुखारी ॥ दो श्राप सीस धरी हरषि हियँ प्रभु बहु बिनती कीन्हि। निज माया कै प्रबलता करषि कृपानिधि
    लीन्हि ॥ ॥ जब हरि माया दूरि निवारी। नहिं तहँ रमा न राजकुमारी ॥ तब मुनि अति सभीत हरि चरना। गहे पाहि
    प्रनतारति हरना ॥ मृषा हौ मम श्राप कृपाला। मम इच्छा कह दीनदयाला ॥ मैं दुर्बचन कहे बहुतेरे। कह मुनि
    पाप मिटिहिं किमि मेरे ॥ जपहु जाइ सङ्कर सत नामा। होइहि हृदयँ तुरन्त बिश्रामा ॥ कौ नहिं सिव समान प्रिय
    मोरें। असि परतीति तजहु जनि भोरेम् ॥ जेहि पर कृपा न करहिं पुरारी। सो न पाव मुनि भगति हमारी ॥ अस उर
    धरि महि बिचरहु जाई। अब न तुम्हहि माया निअराई ॥ दो बहुबिधि मुनिहि प्रबोधि प्रभु तब भे अन्तरधान ॥ सत्यलोक
    नारद चले करत राम गुन गान ॥ ॥ हर गन मुनिहि जात पथ देखी। बिगतमोह मन हरष बिसेषी ॥ अति सभीत नारद पहिं
    आए। गहि पद आरत बचन सुनाए ॥ हर गन हम न बिप्र मुनिराया। बड़ अपराध कीन्ह फल पाया ॥ श्राप अनुग्रह करहु
    कृपाला। बोले नारद दीनदयाला ॥ निसिचर जाइ होहु तुम्ह दोऊ। बैभव बिपुल तेज बल होऊ ॥ भुजबल बिस्व जितब तुम्ह
    जहिआ। धरिहहिं बिष्नु मनुज तनु तहिआ। समर मरन हरि हाथ तुम्हारा। होइहहु मुकुत न पुनि संसारा ॥ चले जुगल
    मुनि पद सिर नाई। भे निसाचर कालहि पाई ॥ दो एक कलप एहि हेतु प्रभु लीन्ह मनुज अवतार। सुर रञ्जन सज्जन
    सुखद हरि भञ्जन भुबि भार ॥ ॥ एहि बिधि जनम करम हरि केरे। सुन्दर सुखद बिचित्र घनेरे ॥ कलप कलप प्रति प्रभु
    अवतरहीं। चारु चरित नानाबिधि करहीम् ॥ तब तब कथा मुनीसन्ह गाई। परम पुनीत प्रबन्ध बनाई ॥ बिबिध प्रसङ्ग
    अनूप बखाने। करहिं न सुनि आचरजु सयाने ॥ हरि अनन्त हरिकथा अनन्ता। कहहिं सुनहिं बहुबिधि सब सन्ता ॥ रामचन्द्र
