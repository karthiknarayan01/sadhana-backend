id: durvasakritamtamraparnistotram
category: stotram
name:
  english: durvasakritamtamraparnistotram
  devanagari: दुर्वासाकृतंताम्रपर्णीस्तोत्रम्
content:
  english: mahabhage mangalani prayaccha me || 60|| narayani shive gange gauridehasamudbhave | sarvapapahare
    matastubhyam nityam namo namah || 61|| mahapapapariplushtam deham mama tavambhasa | kshalayami jaganmatarmahyam
    nityam prasida me || 62|| iti suktatrayam japtva snatva tattirthavarina | unmamajja jalattasmat dhyatva
    manasi devatam || 63|| tatprabhavadavirabhutpurato'sya mahamuneh | balataparuna tanvi tapaniyavibhushana
    || 64|| iti tamraparnimahatmye 42
  devanagari: महाभागे मङ्गलानि प्रयच्छ मे ॥ ६०॥ नारायणि शिवे गङ्गे गौरीदेहसमुद्भवे । सर्वपापहरे मातस्तुभ्यं
    नित्यं नमो नमः ॥ ६१॥ महापापपरिप्लुष्टं देहं मम तवाम्भसा । क्षालयामि जगन्मातर्मह्यं नित्यं प्रसीद मे
    ॥ ६२॥ इति सूक्तत्रयं जप्त्वा स्नात्वा तत्तीर्थवारिणा । उन्ममज्ज जलात्तस्मात् ध्यात्वा मनसि देवताम्
    ॥ ६३॥ तत्प्रभावादाविरभूत्पुरतोऽस्य महामुनेः । बालातपारुणा तन्वी तपनीयविभूषणा ॥ ६४॥ इति ताम्रपर्णीमाहात्म्ये
    ४२
meaning: {}
