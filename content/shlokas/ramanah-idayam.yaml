id: ramanah-idayam
category: hridaya
name:
  english: ramanahṟidayam
  devanagari: रमणह्ऱिदयम्
content:
  english: shyeko devah sarvabhuteshvapiti || 52|| kim jyotistava bhanumanahani me ratrau pradipadikam
    kim jyotistadavekshanaya nayanam tasyekshane kim manah | tasyeksha vada kena tat svayamaham pashyami
    tajjyotisham jyotistvam bhavasi svayam vibhu param satyam tadevasmyaham || 53|| hridayakuharamadhye
    kevalam brahmamatram hyahamahamiti sakshadatmarupena bhati | hridi visha manasa svam cinvata majjata
    va pavanacalanarodhadatmanishtho bhava tvam || 54|| amalapyacalahamityajasram vilasanti hridayambuje
    cideva | vitaret padavim svayam vimukteh yadi jahyanmanujo vapushyahantam || 55|| deham mrinmayavajjadatmakamahambuddhirna
    tasyastato naham tattadabhavasuptisamaye siddhatmasadbhavatah | ko'hambhavayutah kuto varadhiya drishtvatmanishthatmanam
    so'hamsphurtitayarunacalashivah purno vibhati svayam || 56|| lebhe janim yah parame svamule vicarya
    kasmadahamityudarah | sa eva jatah sa ca nityajato navo navo'yam satatam munindrah || 57|| || sadhakacaraprakaranam
    || hisvahadhiyamatra doshanilaye dehe jade'natmani nityanandamayam svatattvamamalam janihi saccinmayam
    | yo martyo vapushastu poshanarato jnatum svamicchatyasau graham darudhiya pragrihya saritam pumsastitirshossamah
    || 58|| yo dehatmamatikshayo bhavati taddanam ca yajnastapo dharmah satyavacah pareshakaruna yogo'pi
    bhaktih para | nyaso maunamapi sthitishca sahaja kamarthamoksha api shantirdyaumritivarjitam ca maranam
    jnanam ca satyam svayam || 59|| kasyaitani kritirvibhaktirapi cajnanam viyogo'pi ca santityatmavicara
    eva bhavita karmadiyogakramah | yasyam nasti vicarako'hamidho na syadidam cashtakam sa satya sthitirityavehi
    vimala svatmanubhutih shiva || 60|| svam shaktya paramasya calitamavijnayodyato yo'khilah siddhih
    sadhayitum sa eva manujo yadvat sa pangurnarah | yo'vadidbhavita shramo mama kiyanetan vijetum ripun
    mamutthapya niveshayeryadi rane tesham purastaditi || 61|| ya shantirmanasah svayam bhavati sa muktirbudhaih
    kirtita ya parairmanaso'dhikairbhavati yallabhastu tassiddhayah | ta labdhum jadadhiryateta manujo
    yastena labhyam katham syanmuktessukhamantahinamamalam cittopashantyatmakam || 62|| pare vahati bhubharam
    bharamidam mrishajivako vahan bhavati gopurodvahanabimbatulyo hyasau | bharam shirasi dharayannatibharakshamenanasa
    vrajan bhajati cedvyatham bhavati tatra ko doshavan || 63|| || upasanaprakaranam || upari ca jatharaduraso
    madhye bahuvarnakeshu shatsvekam | kuvalayakalikasadrisham dakshinabhage'nguladvaye hridayam || 64||
    avritamasti tadasyam viyati tadantarbhavati nadyashca | tamaso'pi vasananam bhavanamidam pranacittadiptinam
    || 65|| guheshakhyo'sau yo nivasati guhayam hridi parah sa evasmityevam satatamananat so'hamiti cet
    | matih sthairyam gacchedvapurahamiti pratyaya iva tadajnanam nashyet tama iva purastaddinamaneh ||
    66|| mukure bimbitamiva yasyantah vilasati bahiriva jagadidamakhilam | sarveshamapi hridayakhyam tat
    kim nviti pricchati rame bhagavan || 67|| aha vasishtho hridaya dvedha heyam cadeyamiti jneyam
  devanagari: ष्येको देवः सर्वभूतेष्वपीति ॥ ५२॥ किं ज्योतिस्तव भानुमानहनि मे रात्रौ प्रदीपादिकं किं ज्योतिस्तदवेक्षणाय
    नयनं तस्येक्षणे किं मनः । तस्येक्षा वद केन तत् स्वयमहं पश्यामि तज्ज्योतिषां ज्योतिस्त्वं भवसि स्वयं
    विभु परं सत्यं तदेवास्म्यहम् ॥ ५३॥ हृदयकुहरमध्ये केवलं ब्रह्ममात्रं ह्यहमहमिति साक्षादात्मरूपेण भाति
    । हृदि विश मनसा स्वं चिन्वता मज्जता वा पवनचलनरोधादात्मनिष्ठो भव त्वम् ॥ ५४॥ अमलाप्यचलाहमित्यजस्रं
    विलसन्ती हृदयाम्बुजे चिदेव । वितरेत् पदवीं स्वयं विमुक्तेः यदि जह्यान्मनुजो वपुष्यहन्ताम् ॥ ५५॥ देहं
    मृण्मयवज्जडात्मकमहम्बुद्धिर्न तस्यास्ततो नाहं तत्तदभावसुप्तिसमये सिद्धात्मसद्भावतः । कोऽहम्भावयुतः
    कुतो वरधिया दृष्ट्वात्मनिष्ठात्मनां सोऽहंस्फूर्तितयारुणाचलशिवः पूर्णो विभाति स्वयम् ॥ ५६॥ लेभे जनिं
    यः परमे स्वमूले विचार्य कस्मादहमित्युदारः । स एव जातः स च नित्यजातो नवो नवोऽयं सततं मुनीन्द्रः ॥ ५७॥
    ॥ साधकाचारप्रकरणम् ॥ हिस्वाहधियमत्र दोषनिलये देहे जडेऽनात्मनि नित्यानन्दमयं स्वतत्त्वममलं जानीहि सच्चिन्मयम्
    । यो मर्त्यो वपुषस्तु पोषणरतो ज्ञातुं स्वमिच्छत्यसौ ग्राहं दारुधिया प्रगृह्य सरितं पुंसस्तितीर्षोस्समः
    ॥ ५८॥ यो देहात्ममतिक्षयो भवति तद्दानं च यज्ञस्तपो धर्मः सत्यवचः परेशकरुणा योगोऽपि भक्तिः परा । न्यासो
    मौनमपि स्थितिश्च सहजा कामार्थमोक्षा अपि शान्तिर्द्यौमृतिवर्जितं च मरणं ज्ञानं च सत्यं स्वयम् ॥ ५९॥
    कस्यैतानि कृतिर्विभक्तिरपि चाज्ञानं वियोगोऽपि च सन्तीत्यात्मविचार एव भविता कर्मादियोगक्रमाः । यस्यां
    नास्ति विचारकोऽहमिधो न स्यादिदं चाष्टकं सा सत्या स्थितिरित्यवेहि विमला स्वात्मानुभूतिः शिवा ॥ ६०॥
    स्वं शक्त्या परमस्य चालितमविज्ञायोद्यतो योऽखिलाः सिद्धीः साधयितुं स एव मनुजो यद्वत् स पङ्गुर्नरः ।
    योऽवादीद्भविता श्रमो मम कियानेतान् विजेतुं रिपून् मामुत्थाप्य निवेशयेर्यदि रणे तेषां पुरस्तादिति ॥
    ६१॥ या शान्तिर्मनसः स्वयं भवति सा मुक्तिर्बुधैः कीर्तिता या पारैर्मनसोऽधिकैर्भवति यल्लाभस्तु तास्सिद्धयः
    । ता लब्धुं जडधीर्यतेत मनुजो यस्तेन लभ्यं कथं स्यान्मुक्तेस्सुखमन्तहीनममलं चित्तोपशान्त्यात्मकम् ॥
    ६२॥ परे वहति भूभरं भरमिदं मृषाजीवको वहन् भवति गोपुरोद्वहनबिम्बतुल्यो ह्यसौ । भरं शिरसि धारयन्नतिभरक्षमेणानसा
    व्रजन् भजति चेद्व्यथां भवति तत्र को दोषवान् ॥ ६३॥ ॥ उपासनाप्रकरणम् ॥ उपरि च जठरादुरसो मध्ये बहुवर्णकेषु
    षट्स्वेकम् । कुवलयकलिकासदृशं दक्षिणभागेऽङ्गुलद्वये हृदयम् ॥ ६४॥ आवृतमस्ति तदास्यं वियति तदन्तर्भवति
    नाड्यश्च । तमसोऽपि वासनानां भवनमिदं प्राणचित्तदीप्तीनाम् ॥ ६५॥ गुहेशाख्योऽसौ यो निवसति गुहायां हृदि
    परः स एवास्मीत्येवं सततमननात् सोऽहमिति चेत् । मतिः स्थैर्यं गच्छेद्वपुरहमिति प्रत्यय इव तदाज्ञानं
    नश्येत् तम इव पुरस्ताद्दिनमणेः ॥ ६६॥ मुकुरे बिम्बितमिव यस्यान्तः विलसति बहिरिव जगदिदमखिलम् । सर्वेषामपि
    हृदयाख्यं तत् किं न्विति पृच्छति रामे भगवान् ॥ ६७॥ आह वसिष्ठो हृदय द्वेधा हेयं चादेयमिति ज्ञेयम्
