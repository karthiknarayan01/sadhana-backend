id: catuhshashtisamvarastotram
category: stotram
name:
  english: catuhshashtisamvarastotram
  devanagari: चतुःषष्टिसंवरस्तोत्रम्
content:
  english: ringararupadharine | namo bhagavate tubhyam kakasamvara te namah || 20|| ulukavaktrine tubhyam
    mahasaukhyapradaya ca | yonimaithunakriddevolukasamvara te namah || 21|| tarkshyananaya devaya tarine
    bhavasagarat | namastubhyam namastubhyam namo garudasamvara || 22|| govaktraya namastubhyam gohatyapapaharine
    | gotravriddhipradatre ca dhenusamvara te namah || 23|| gardabhakaravaktraya gatagatakshayaya te |
    ganeshvaraya devaya kharasamvara te namah || 24|| mahishasyaya devaya mahapralayakarine | shaktiyuktaya
    devaya namao mahishasamvara || 25|| vidalasya namastubhyam mutrakundaprakridine | shreshthaya parameshaya
    namo marjarasamvara || 26|| namami shalvavaktraya dvayangamekeva shobhitam | namami devadevesha namah
    sharabhasamvara || 27|| siddhaya siddharupaya gunaya gunavartine | krauncasyaya namastubhyam krauncasamvara
    te namah || 28|| ulkananaya shuddhaya uttamaya namo namah | ugraya bhimarupaya ulkasamvara te namah
    || 29|| hamsavaktra namaste'stu hamsasvarasvarupine | hamsahso'hamsvarupaya hamsasamvara te namah
    || 30|| mrigavaktraya devaya namami parameshvara | riddhisiddhipradatre ca mrigasamvara te namah ||
    31|| shaktiyukta namaste'stu cakravakananaya ca | namaste cakavakakhyasamvaraya namo namah || 32||
    ajananaya viraya avidyanashine namah | apavargaphalaptyarthamajasamvara te namah || 33|| kukkutasyaya
    devaya kulavriddhikaraya ca | namaste kautukeshaya tubhyam kukkutasamvara || 34|| krishnasarasavaktraya
    namaste karmasambhava | kalanashaya devaya enasamvara te namah || 35|| mushananaya purnaya jnanadaya
    namo namah | sarvadaityavinashaya mushasamvara te namah || 36|| salukasya namaste'stu manadivaradaya
    ca | siddhibuddhipradatre ca namah salukasamvara || 37|| namah kapolavaktraya prajnopayatmarupine
    | namaste'stu mahavira kapotasamvaraya ca || 38|| namami grahavaktraya bhuktimuktipradaya ca | namo'stu
    sarvabhutesha grahasamvara te namah || 39|| namaste cihlavaktraya namaste maithune rata | namaste
    bhagavan deva cihlasamvara te namah || 40|| catakasyaya devaya namaste'stu jagadguro | namaste'stu
    gunadhisha catakasamvara te namah || 41|| sarasasya namastubhyam namaste gunasagara | namo bhagavate
    tubhyam sarasasamvaraya ca || 42|| khanjanasyaya devaya mahadevaya te namah | nirvanapadadatre khanjaritasamvaraya
    ca || 43|| namaste kshemakaryasya bhuktimuktipradaya ca | namo bhagavate deva kshemakarisamvaraya
    te || 44|| shashakasya namastubhyam namaste bhuvaneshvara | karmapradaya te nityam namah shashakasamvara
    || 45|| namo bhallukavaktraya ratikridaparaya ca | karyasiddhipradatre ca namo bhallukasamvara ||
    46|| pikasyaya namastubhyam mantrasiddhikaraya ca | trilokeshaya sarvaya pikasamvara te namah || 47||
    namami vakavaktraya shaktiyuktaganadhipa | namami devadevesha vakasamvara te namah || 48|| khangivaktraya
    devaya sarvada shirasa namah | namo'stu parameshaya khangisamvara te namah || 49|| karkatasya namastubhyam
    namah samsarahetave | papapunjavinashaya namah karkatasamvara || 50|| namah shallakivaktraya sarvadoshanivarine
    | samsarapashanashaya namah shallakisamvara || 51|| vrishcikasya namastubhyam balakalyanadaya ca |
    namo namaste devaya namo vrishcikasamvara || 52|| alivaktraya devaya alimodaya te namah | alilokavinashaya
    alisamvara te namah || 53|| jahakasya namaste'stu janamohakritaya vai | jayakalyanadatre ca namo jahakasamvara
    || 54|| camarivaktra te nityam caturyaphaladayine | caturvargapradatre ca namashcamarisamvara || 55||
    simnivaktranamastubhyam siddhitvaphaladayine | namo bhagavate nityam simnisamvara te namah || 56||
    namami godhavaktraya namaste bhimavikrama | namaste divyanetraya godhasamvara te namah || 57|| cakorasya
    namastubhyam cancalyadoshanashaka | namo bhagavate tubhyam cakorasamvaraya ca || 58|| godhikasyaya
    satatam srishtisamharakarine | namaste paramananda godhikasamvaraya ca || 59|| madhumakshikavaktraya
    namaste manadayaka | sarvajnaya pareshaya namo makshikasamvara || 60|| patangavaktra te nityam paramesha
    namah sada | divyaya divaseshaya namah patangasamvara || 61|| naravaktraya devaya narakaghnaya te
    namah | nanarupadadhanaya narasamvara te namah || 62|| srishtirupa jagaddhama srijate sarvabhutakam
    | namo namaste satatam srishtisamvara te namah || 63|| sthitirupaya devaya gunaya gunavartine | namah
    saravinashaya sthitisamvara te namah || 64|| sarvalokasya samharakartre te parameshvara | tasmadaham
    namasyami namah pralayasamvara || 65|| jyotirvaktra param dhama namaste jagadishvara | paratparataram
    sukshma jyotihsamvara te namah || 66|| itidam samvarastotram trishu lokeshu durlabham | paratparataram
    stotram catuhshashtipramanakam || 67|| catuhshashtipramaneshu adyamadyam tu vaktritam | bhuyo granthamayaccatra
    adyamatram pracoditam || 68|| kanyarthi labhate kanyam dhanarthi labhate dhanam | vidyarthi labhate
    vidyam moksharthi mokshamapnuyat || 69|| vashikaranamuccatam maramohanastambhanam | akarshanam ca
    vidvesham dhatuvadam rasayanam || 70|| gutikam padukasiddhim khangasiddhim tathaiva ca | khecarisiddhi
    vaidyangam mantrasiddhim ca vakpatuh || 71|| parakayapravesham ca dravyakarshanameva ca | labhate
    stotrarajena satyam satyam mayoditam || 72|| durbhiksham capadi patham kurute shubhamapnuyat | ativrishtavanavrishtau
    mahamarisamudbhave || 73|| rajyabhramshe jnanabhramshe stribhramshe ca dhanakshaye | kalahe ca vivade
    ca pathate stotramuttamam || 74|| bhikshukebhyah sahasrebhyah tulyam danakritam phalam | bahunatra
    kimuktena brahmandadanajam phalam || 75|| iti shrisamvaragame mahatantre amitabhavairocanasamvade
    shricakrasamvaradicatuhshashtisamvarastotram sampurnam ||
  devanagari: ृङ्गाररूपधारिणे । नमो भगवते तुभ्यं काकसंवर ते नमः ॥ २०॥ उलूकवक्त्रिणे तुभ्यं महासौख्यप्रदाय
    च । योनिमैथुनकृद्देवोलूकसंवर ते नमः ॥ २१॥ तार्क्ष्याननाय देवाय तारिणे भवसागरात् । नमस्तुभ्यं नमस्तुभ्यं
    नमो गरुडसंवर ॥ २२॥ गोवक्त्राय नमस्तुभ्यं गोहत्यापापहारिणे । गोत्रवृद्धिप्रदात्रे च धेनुसंवर ते नमः
    ॥ २३॥ गर्दभाकारवक्त्राय गतागतक्षयाय ते । गणेश्वराय देवाय खरसंवर ते नमः ॥ २४॥ महिषास्याय देवाय महाप्रलयकारिणे
    । शक्तियुक्ताय देवाय नमओ महिषसंवर ॥ २५॥ विडालास्य नमस्तुभ्यं मूत्रकूण्डप्रक्रीडिने । श्रेष्ठाय परमेशाय
    नमो मार्जारसंवर ॥ २६॥ नमामि शाल्ववक्त्राय द्वयङ्गमेकेव शोभितम् । नमामि देवदेवेश नमः शरभसंवर ॥ २७॥
    सिद्धाय सिद्धरूपाय गुणाय गुणवर्तिने । क्रौञ्चास्याय नमस्तुभ्यं क्रौञ्चसंवर ते नमः ॥ २८॥ उल्काननाय
    शुद्धाय उत्तमाय नमो नमः । उग्राय भीमरूपाय उल्कसंवर ते नमः ॥ २९॥ हंसवक्त्र नमस्तेऽस्तु हंसस्वरस्वरूपिणे
    । हंसःसोऽहंस्वरूपाय हंससंवर ते नमः ॥ ३०॥ मृगवक्त्राय देवाय नमामि परमेश्वर । ऋद्धिसिद्धिप्रदात्रे च
    मृगसंवर ते नमः ॥ ३१॥ शक्तियुक्त नमस्तेऽस्तु चक्रवाकाननाय च । नमस्ते चकवाकाख्यसंवराय नमो नमः ॥ ३२॥
    अजाननाय वीराय अविद्यानाशिने नमः । अपवर्गफलाप्त्यर्थमजसंवर ते नमः ॥ ३३॥ कुक्कुटास्याय देवाय कुलवृद्धिकराय
    च । नमस्ते कौटुकेशाय तुभ्यं कुक्कुटसंवर ॥ ३४॥ कृष्णसारसवक्त्राय नमस्ते कर्मसम्भव । कालनाशाय देवाय
    एणसंवर ते नमः ॥ ३५॥ मूषाननाय पूर्णाय ज्ञानदाय नमो नमः । सर्वदैत्यविनाशय मूषसंवर ते नमः ॥ ३६॥ सालूकास्य
    नमस्तेऽस्तु मानादिवरदाय च । सिद्धिबुद्धिप्रदात्रे च नमः सालूकसंवर ॥ ३७॥ नमः कपोलवक्त्राय प्रज्ञोपायात्मरूपिणे
    । नमस्तेऽस्तु महावीर कपोतसंवराय च ॥ ३८॥ नमामि ग्राहवक्त्राय भुक्तिमुक्तिप्रदाय च । नमोऽस्तु सर्वभूतेश
    ग्राहसंवर ते नमः ॥ ३९॥ नमस्ते चिह्लवक्त्राय नमस्ते मैथुने रत । नमस्ते भगवन् देव चिह्लसंवर ते नमः ॥
    ४०॥ चटकास्याय देवाय नमस्तेऽस्तु जगद्गुरो । नमस्तेऽस्तु गुणाधीश चटकसंवर ते नमः ॥ ४१॥ सारसास्य नमस्तुभ्यं
    नमस्ते गुणसागर । नमो भगवते तुभ्यं सारससंवराय च ॥ ४२॥ खञ्जनास्याय देवाय महादेवाय ते नमः । निर्वाणपददात्रे
    खञ्जरीटसंवराय च ॥ ४३॥ नमस्ते क्षेमकर्यास्य भुक्तिमुक्तिप्रदाय च । नमो भगवते देव क्षेमकरिसंवराय ते
    ॥ ४४॥ शशकास्य नमस्तुभ्यं नमस्ते भुवनेश्वर । कर्मप्रदाय ते नित्यं नमः शशकसंवर ॥ ४५॥ नमो भल्लूकवक्त्राय
    रतिक्रीडापराय च । कार्यसिद्धिप्रदात्रे च नमो भल्लूकसंवर ॥ ४६॥ पिकास्याय नमस्तुभ्यं मन्त्रसिद्धिकराय
    च । त्रिलोकेशाय सर्वाय पिकसंवर ते नमः ॥ ४७॥ नमामि वकवक्त्राय शक्तियुक्तगणाधिप । नमामि देवदेवेश वकसंवर
    ते नमः ॥ ४८॥ खङ्गिवक्त्राय देवाय सर्वदा शिरसा नमः । नमोऽस्तु परमेशाय खङ्गिसंवर ते नमः ॥ ४९॥ कर्कटास्य
    नमस्तुभ्यं नमः संसारहेतवे । पापपुञ्जविनाशाय नमः कर्कटसंवर ॥ ५०॥ नमः शल्लकिवक्त्राय सर्वदोषनिवारिणे
    । संसारपाशनाशाय नमः शल्लकिसंवर ॥ ५१॥ वृश्चिकास्य नमस्तुभ्यं बलकल्याणदाय च । नमो नमस्ते देवाय नमो वृश्चिकसंवर
    ॥ ५२॥ अलिवक्त्राय देवाय अलिमोदाय ते नमः । अलिलोकविनाशाय अलिसंवर ते नमः ॥ ५३॥ जाहकास्य नमस्तेऽस्तु
    जनमोहकृताय वै । जयकल्याणदात्रे च नमो जाहकसंवर ॥ ५४॥ चमरीवक्त्र ते नित्यं चातुर्यफलदायिने । चतुर्वर्गप्रदात्रे
    च नमश्चमरिसंवर ॥ ५५॥ सीम्निवक्त्रनमस्तुभ्यं सिद्धित्वफलदायिने । नमो भगवते नित्यं सीम्निसंवर ते नमः
    ॥ ५६॥ नमामि गोधवक्त्राय नमस्ते भीमविक्रम । नमस्ते दिव्यनेत्राय गोधासंवर ते नमः ॥ ५७॥ चकोरास्य नमस्तुभ्यं
    चाञ्चल्यदोषनाशक । नमो भगवते तुभ्यं चकोरसंवराय च ॥ ५८॥ गोधिकास्याय सततं सृष्टिसंहारकरिणे । नमस्ते परमानन्द
    गोधिकासंवराय च ॥ ५९॥ मधुमाक्षिकवक्त्राय नमस्ते मानदायक । सर्वज्ञाय परेशाय नमो माक्षिकसंवर ॥ ६०॥ पतङ्गवक्त्र
    ते नित्यं परमेश नमः सदा । दिव्याय दिवसेशाय नमः पतङ्गसंवर ॥ ६१॥ नरवक्त्राय देवाय नरकघ्नाय ते नमः ।
    नानारूपदधानाय नरसंवर ते नमः ॥ ६२॥ सृष्टिरूप जगद्धाम सृजते सर्वभूतकम् । नमो नमस्ते सततं सृष्टिसंवर
    ते नमः ॥ ६३॥ स्थितिरूपाय देवाय गुणाय गुणवर्तिने । नमः सारविनाशाय स्थितिसंवर ते नमः ॥ ६४॥ सर्वलोकस्य
    संहारकर्त्रे ते परमेश्वर । तस्मादहं नमस्यामि नमः प्रलयसंवर ॥ ६५॥ ज्योतिर्वक्त्र परं धाम नमस्ते जगदीश्वर
    । परात्परतरं सूक्ष्म ज्योतिःसंवर ते नमः ॥ ६६॥ इतीदं संवरस्तोत्रं त्रिषु लोकेषु दुर्लभम् । परात्परतरं
    स्तोत्रं चतुःषष्टिप्रमाणकम् ॥ ६७॥ चतुःषष्टिप्रमाणेषु आद्यमाद्यं तु वक्त्रितम् । भूयो ग्रन्थमयाच्चात्र
    आद्यमात्रं प्रचोदितम् ॥ ६८॥ कन्यार्थी लभते कन्यां धनार्थी लभते धनम् । विद्यार्थी लभते विद्यां मोक्षार्थी
    मोक्षमाप्नुयात् ॥ ६९॥ वशीकरणमुच्चाटं मारमोहनस्तम्भनम् । आकर्षणं च विद्वेषं धातुवादं रसायनम् ॥ ७०॥
    गुटिकां पादुकासिद्धिं खङ्गसिद्धिं तथैव च । खेचरीसिद्धि वैद्याङ्गं मन्त्रसिद्धिं च वाक्पटुः ॥ ७१॥ परकायप्रवेशं
    च द्रव्याकर्षणमेव च । लभते स्तोत्रराजेन सत्यं सत्यं मयोदितम् ॥ ७२॥ दुर्भिक्षं चापदि पाठं कुरुते शुभमाप्नुयात्
    । अतिवृष्टावनावृष्टौ महामारीसमुद्भवे ॥ ७३॥ राज्यभ्रंशे ज्ञानभ्रंशे स्त्रीभ्रंशे च धनक्षये । कलहे च
    विवादे च पठते स्तोत्रमुत्तमम् ॥ ७४॥ भिक्षुकेभ्यः सहस्रेभ्यः तुल्यं दानकृतं फलम् । बहुनात्र किमुक्तेन
    ब्रह्माण्डदानजं फलम् ॥ ७५॥ इति श्रीसंवरागमे महातन्त्रे अमिताभवैरोचनसंवादे श्रीचक्रसंवरादिचतुःषष्टिसंवरस्तोत्रं
    सम्पूर्णम् ॥
