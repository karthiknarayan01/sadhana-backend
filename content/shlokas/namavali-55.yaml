    नमः । ॐ वेदान्तवेद्याय नमः । ७० ॥ ॐ भववैद्याय नमः । ॐ भूतये नमः । ॐ ओजसे नमः । ॐ तेजसे नमः । ॐ भ्राजते
    नमः । ॐ ग्रसते नमः । ७६ ॥ इति शिवरहस्यव्युत्पन्नं श्रावणमासकृते शिवशताष्टनामावलिः सम्पूर्णा ॥
