id: nimbarkasahasranamastotram
category: sahasranama
name:
  english: nimbarkasahasranamastotram
  devanagari: निम्बार्कसहस्रनामस्तोत्रम्
content:
  english: samhitah | yaih pathitam shrutam vapi nimbarkakhyasahasrakam || 225|| bahudha sadhitairmantraih
    sadhakanam tu yatphalam | yacchati pathitam tattannimbarkakhyasahasrakam || 226|| nicaya durvinitaya
    himsraya doshadarshine | gurubhaktivihinaya paradararataya ca || 227|| pancasamskarahinaya duracaraya
    papine | shathaya parashishyaya nastikayatmaghatine || 228|| nimbadityanghrihinaya sampradayavivarjine
    | na deyam naiva deyam vai nimbarkakhyasahasrakam || 229|| deyam shantaya shuddhaya sampradayarataya
    ca | radhakrishnopasannaya gurubhaktiparaya ca || 230|| nimbadityanghribhaktaya nimbadityoktavedine
    | pancasamskarayuktaya tulasimaline tatha || 231|| jitakrodhaya namraya shuddhacarayutaya ca | shishyaya
    samabhaktaya svacchantah karanaya ca || 232|| nityapujarataya'tha nimbarkakhyasahasrakam | brahmanaya
    na deyam vai vishnubhaktividushine || 243|| shvapacaya sada deyam krishnabhaktirataya ca | nimbarkanamasahasram
    na pathet samskrito'pi yah || 234|| katham sa vaishnavo jneyo nimbarka
  devanagari: संहिताः । यैः पठितं श्रुतं वापि निम्बार्काख्यासहस्रकम् ॥ २२५॥ बहुधा साधितैर्मन्त्रैः साधकानां
    तु यत्फलम् । यच्छति पठितं तत्तन्निम्बार्काख्यासहस्रकम् ॥ २२६॥ नीचाय दुर्विनीताय हिंस्राय दोषदर्शिने
    । गुरुभक्तिविहीनाय परदाररताय च ॥ २२७॥ पञ्चसंस्कारहीनाय दुराचाराय पापिने । शठाय परशिष्याय नास्तिकायात्मघातिने
    ॥ २२८॥ निम्बादित्याङ्घ्रिहीनाय सम्प्रदायविवर्जिने । न देयं नैव देयं वै निम्बार्काख्यासहस्रकम् ॥ २२९॥
    देयं शान्ताय शुद्धाय सम्प्रदायरताय च । राधाकृष्णोपसन्नाय गुरुभक्तिपराय च ॥ २३०॥ निम्बादित्याङ्घ्रिभक्ताय
    निम्बादित्योक्तवेदिने । पञ्चसंस्कारयुक्ताय तुलसीमालिने तथा ॥ २३१॥ जितक्रोधाय नम्राय शुद्धाचारयुताय
    च । शिष्याय समभक्ताय स्वच्छान्तः करणाय च ॥ २३२॥ नित्यपूजारतायाऽथ निम्बार्काख्यासहस्रकम् । ब्राह्मणाय
    न देयं वै विष्णुभक्तिविदूषिणे ॥ २४३॥ श्वपचाय सदा देयं कृष्णभक्तिरताय च । निम्बार्कनामसाहस्रं न पठेत्
    संस्कृतोऽपि यः ॥ २३४॥ कथं स वैष्णवो ज्ञेयो निम्बार्क
