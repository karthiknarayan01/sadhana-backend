id: renukahridayam
category: hridaya
name:
  english: renukahridayam
  devanagari: रेणुकाह्रिदयम्
content:
  english: om namo renukayai sarvabhutidayai sarvakartryai sarvahartryai sarvapalinyai sarvarthadatryai
    saccidanandarupinyai ekalayai kamakshyai kamadayinyai bhargayai bhargarupinyai bhagavatyai sarveshvaryai
    ekavirayai viravanditayai virashaktyai viramohinyai virasuveshyai hrimkarayai klimkarayai vagbhavayai
    aimkarayai omkarayai shrimkarayai dasharnayai dvadasharnayai shodasharnayai tribijakayai tripurayai
    tripuraharavallabhayai katyayinyai yoginiganasevitayai camundayai mundamalinyai bhairavasevitayai
    bhitiharayai bhavaharinyai kalyanyai kalyanadayai namaste namaste || 5|| namo namah kamukamadayai
    namo namo bhaktadayaghanayai | namo namah kevalakevalayai namo namo mohini mohadayai ||6|| namo namah
    karanakaranayai namo namah shantirasanvitayai || namo namah mangalamanlayai namo namo mangalabhutidayai
    || 7|| namo namah sadgunavaibhavayai vishuddhavijnanasukhapradayai | namo namah shobhanashobhitayai
    namo namah shaktisamavritayai || 8|| namah shivayai shantayai namo mangalamurtaye | sarvasiddhipradayai
    te renukayai namo namah || 9|| lalitayai namastubhyam padmavatyai namo namah || himacalasutayai te
    renukayai namo namah || 10|| vishnuvakshahsthalavase shivavamankasamsthite | brahmanyai brahmamatre
    te renukayai namo'stu te || 11|| ramamatre namastubhyam jagadanandakarini | jamadagnipriyayai te renukayai
    namo namah || 12|| namo bhairavarupayai bhitihantryai namo namah | namah parashuramasya jananyai te
    namo namah || 13|| kamalayai namastubhyam tulajayai namo namah | shadcakradevatayai te renukayai namo
    namah || 14|| ahalyayai namastubhyam kaveryai namo namah | sarvarthipujaniyayai te renukayai namo
    namah || 15|| narmadayai namastubhyam mandodaryai namo namah | adrisamsthanayai te renukayai namo
    namah || 16|| tvaritayai namastubhyam mandakinyai namo namah || sarvamantradhidevatayai te renukayai
    namo namah || 17|| vishokayai namastubhyam kalashaktyai namo namah | madhupanoddhatayai te renukayai
    namo namah || 18|| totulayai namastubhyam narayanyai namo namah | pradhanaguharupinyai renukayai namo
    namah || 19|| simhagayai namastubhyam kripasiddhayai namo namah | daridryavanadahinye renukayai namo
    namah || 20|| stanyadayai namastubhyam vinashaghnyai namo namah | madhukaitakabhahantryai te renukayai
    namo namah || 21|| tripurayai namastubhyam punyakirtyai namo namah | mahishasuravinashayai te renukayai
    namo namah || 22|| cetanayai namastubhyam viralakshmyai namo namah | kailashanilayayai te renukayai
    namo namah || 23|| bagalayai namastubhyam brahmashaktyai namo namah | karmaphalapradayai te renukayai
    namo namah || 24|| shitalayai namastubhyam bhadrakalyai namo namah | shumbhadarpaharayai te renukayai
    namo namah || 25|| elambayai namastubhyam mahadevyai namo namah | pitambaraprabhayai te renukayai
    namo namah || 26|| namah trigayai rukmayai namo te dharmashaktaye | ajnanakalpitayai te renukayai
    namo namah || 27|| kapardayai namastubhyam kripashaktyai namo namah | vanaprasthashramasthayai renukayai
    namo namah || 28|| vijayayai namastubhyam jvalamukhyai namo namah | mahasmritirjyotsnayai renukayai
    namo namah || 29|| namah trishnayai dhumrayai namote dharmasiddhaye | ardhamatraksharayai te renukayai
    namo namah || 30|| namah shraddhayai vartayai namo medhashaktye | mantradhidevatayai te renukayai
    namo namah || 31|| jayadayai namastubhyam shuleshvaryai namo namah | alakapurasamsthanayai renukayai
    namo namah || 32|| namah parayai dhrauvyayai namah te sheshashaktye | dhruvamayi hridrupayai renukayai
    namo namah || 33|| namo namah shaktisamanvitayai namo namah tushtivarapradayai | namo namah mandanamanditayai
    namo namo manjulamokshadayai || 34|| shrishiva uvaca
  devanagari: ॐ नमो रेणुकायै सर्वभूतिदायै सर्वकर्त्र्यै सर्वहर्त्र्यै सर्वपालिन्यै सर्वर्थदात्र्यै सच्चिदानन्दरूपिण्यै
    एकलायै कामाक्ष्यै कामदायिन्यै भर्गायै भर्गरूपिण्यै भगवत्यै सर्वेश्वर्यै एकवीरायै वीरवन्दितायै वीरशक्त्यै
    वीरमोहिन्यै वीरसुवेश्यै ह्रींकारायै क्लींकारायै वाग्भवायै ऐंकारायै ॐकारायै श्रींकारायै दशार्णायै द्वादशर्णायै
    षोडशार्णायै त्रिबीजकायै त्रिपुरायै त्रिपुरहरवल्लभायै कात्यायिन्यै योगिनीगणसेवितायै चामुण्डायै मुण्डमालिन्यै
    भैरवसेवितायै भीतिहरायै भवहारिण्यै कल्याण्यै कल्याणदायै नमस्ते नमस्ते ॥ ५॥ नमो नमः कामुकामदायै नमो
    नमो भक्तदयाघनायै । नमो नमः केवलकेवलायै नमो नमो मोहिनी मोहदायै ॥६॥ नमो नमः कारणकारणायै नमो नमः शान्तिरसान्वितायै
    ॥ नमो नमः मङ्गलमङ्लायै नमो नमो मङ्गलभूतिदायै ॥ ७॥ नमो नमः सद्गुणवैभवायै विशुद्धविज्ञानसुखप्रदायै ।
    नमो नमः शोभनशोभितायै नमो नमः शक्तिसमावृतायै ॥ ८॥ नमः शिवायै शान्तायै नमो मङ्गलमूर्तये । सर्वसिद्धिप्रदायै
    ते रेणुकायै नमो नमः ॥ ९॥ ललितायै नमस्तुभ्यं पद्मावत्यै नमो नमः ॥ हिमाचलसुतायै ते रेणुकायै नमो नमः
    ॥ १०॥ विष्णुवक्षःस्थलावासे शिववामाङ्कसंस्थिते । ब्रह्माण्यै ब्रह्ममात्रे ते रेणुकायै नमोऽस्तु ते ॥
    ११॥ राममात्रे नमस्तुभ्यं जगदानन्दकारिणी । जमदग्निप्रियायै ते रेणुकायै नमो नमः ॥ १२॥ नमो भैरवरूपायै
    भीतिहन्त्र्यै नमो नमः । नमः परशुरामस्य जनन्यै ते नमो नमः ॥ १३॥ कमलायै नमस्तुभ्यं तुलजायै नमो नमः ।
    षड्चक्रदेवतायै ते रेणुकायै नमो नमः ॥ १४॥ अहल्यायै नमस्तुभ्यं कावेर्यै नमो नमः । सर्वार्थिपूजनीयायै
    ते रेणुकायै नमो नमः ॥ १५॥ नर्मदायै नमस्तुभ्यं मन्दोदर्यै नमो नमः । आद्रिसंस्थानायै ते रेणुकायै नमो
    नमः ॥ १६॥ त्वरितायै नमस्तुभ्यं मन्दाकिन्यै नमो नमः ॥ सर्वमन्त्राधिदेवतायै ते रेणुकायै नमो नमः ॥ १७॥
    विशोकायै नमस्तुभ्यं कालशक्त्यै नमो नमः । मधुपानोद्धतायै ते रेणुकायै नमो नमः ॥ १८॥ तोतुलायै नमस्तुभ्यं
    नारायण्यै नमो नमः । प्रधानागुहरूपिण्यै रेणुकायै नमो नमः ॥ १९॥ सिंहगायै नमस्तुभ्यं कृपासिद्धयै नमो
    नमः । दारिद्र्यवनदाहिन्ये रेणुकायै नमो नमः ॥ २०॥ स्तन्यदायै नमस्तुभ्यं विनाशघ्न्यै नमो नमः । मधुकैटकभहन्त्र्यै
    ते रेणुकायै नमो नमः ॥ २१॥ त्रिपुरायै नमस्तुभ्यं पुण्यकीर्त्यै नमो नमः । महिषासुरविनाशायै ते रेणुकायै
    नमो नमः ॥ २२॥ चेतनायै नमस्तुभ्यं वीरलक्ष्म्यै नमो नमः । कैलाशनिलयायै ते रेणुकायै नमो नमः ॥ २३॥ बगलायै
    नमस्तुभ्यं ब्रह्मशक्त्यै नमो नमः । कर्मफलप्रदायै ते रेणुकायै नमो नमः ॥ २४॥ शीतलायै नमस्तुभ्यं भद्रकाल्यै
    नमो नमः । शुम्भदर्पहरायै ते रेणुकायै नमो नमः ॥ २५॥ एलाम्बायै नमस्तुभ्यं महादेव्यै नमो नमः । पीताम्बरप्रभायै
    ते रेणुकायै नमो नमः ॥ २६॥ नमः त्रिगायै रुक्मायै नमो ते धर्मशक्तये । अज्ञानकल्पितायै ते रेणुकायै नमो
    नमः ॥ २७॥ कपर्दायै नमस्तुभ्यं कृपाशक्त्यै नमो नमः । वानप्रस्थाश्रमस्थायै रेणुकायै नमो नमः ॥ २८॥ विजयायै
    नमस्तुभ्यं ज्वालामुख्यै नमो नमः । महास्मृतिर्ज्योत्स्नायै रेणुकायै नमो नमः ॥ २९॥ नमः तृष्णायै धूम्रायै
    नमोते धर्मसिद्धये । अर्धमात्राक्षरायै ते रेणुकायै नमो नमः ॥ ३०॥ नमः श्रद्धायै वार्तायै नमो मेधशक्त्ये
    । मन्त्राधिदेवतायै ते रेणुकायै नमो नमः ॥ ३१॥ जयदायै नमस्तुभ्यं शूलेश्वर्यै नमो नमः । अलकापुरसंस्थानायै
    रेणुकायै नमो नमः ॥ ३२॥ नमः परायै ध्रौव्यायै नमः ते शेषशक्त्ये । ध्रुवमयी हृद्रूपायै रेणुकायै नमो नमः
    ॥ ३३॥ नमो नमः शक्तिसमन्वितायै नमो नमः तुष्टिवरप्रदायै । नमो नमः मण्डनमण्डितायै नमो नमो मञ्जुलमोक्षदायै
    ॥ ३४॥ श्रीशिव उवाच
