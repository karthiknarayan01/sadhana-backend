id: suryadvadashanamastotra
category: stotram
name:
  english: suryadvadashanamastotra
  devanagari: सूर्यद्वादशनामस्तोत्र
content:
  english: suryadvadashanamastotra om sum suryaya namah | adityah prathamam nama dvitiyam tu divakarah
    | tritiyam bhaskarah proktam caturtham tu prabhakarah || pancamam tu sahasramshuh shashtham trailokyalocanah
    | saptamam haridashvashca ashtamam ca vibhavasuh || navamam dinakaram prokto dashamam dvadashatmakah
    | ekadasham trayomurtih dvadasham surya eva ca || iti suryadvadashanamastotram sampurnam |
  devanagari: सूर्यद्वादशनामस्तोत्र ॐ सूं सूर्याय नमः । आदित्यः प्रथमं नाम द्वितीयं तु दिवाकरः । तृतीयं
    भास्करः प्रोक्तं चतुर्थं तु प्रभाकरः ॥ पञ्चमं तु सहस्रांशुः षष्ठं त्रैलोक्यलोचनः । सप्तमं हरिदश्वश्च
    अष्टमं च विभावसुः ॥ नवमं दिनकरं प्रोक्तो दशमं द्वादशात्मकः । एकादशं त्रयोमूर्तिः द्वादशं सूर्य एव
    च ॥ इति सूर्यद्वादशनामस्तोत्रं सम्पूर्णम् ।
meaning: {}
