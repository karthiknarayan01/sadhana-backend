id: devaihkritam06vishnustotram
category: stotram
name:
  english: devaihkritam06vishnustotram
  devanagari: देवैःकृतं०६विष्णुस्तोत्रम्
content:
  english: 10|| namaste gudhadehaya vedanindakaraya ca | yogacaryaya jainaya bauddharupaya mapate || 11||
    namaste kalkirupaya mlecchanamantakarine | anantashaktirupaya saddharmasthapanaya ca || 12|| namaste
    kapilarupaya devahutyai mahatmane | vadate sankhyayogam ca sankhyacaryaya vai prabho || 13|| namah
    paramahamsaya jnanam samvadate param | vidhatre jnanarupaya yenatma samprasidati || 14|| vedavyasaya
    vedanam vibhagam kurvate namah | hitaya sarvalokanam puranaracanaya ca || 15|| evam matsyaditanubhirbhaktakaryodyataya
    te | sargasthitidhvamsakartre namaste brahmane prabho || 16|| artihantre svadasanam sukhadaya shubhaya
    ca | pitambaraya haraye tarkshyayanaya te namah | sarvakriyayaikakartre sharanyaya namo namah || 17||
    daityasantapitamartyaduhkhadidhvamsavajraka | sheshatalpashayayarkacandranetraya te namah || 18||
    kripasindho ramanatha pahi nashsharanagatan | jalandharena devashca svargatsarve nirakritah || 19||
    suryo nissaritah sthanaccandro vahnistathaiva ca | patalannagarajashca dharmarajo nirakritah || 5
  devanagari: १०॥ नमस्ते गूढदेहाय वेदनिन्दाकराय च । योगाचार्याय जैनाय बौद्धरूपाय मापते ॥ ११॥ नमस्ते कल्किरूपाय
    म्लेच्छानामन्तकारिणे । अनन्तशक्तिरूपाय सद्धर्मस्थापनाय च ॥ १२॥ नमस्ते कपिलरूपाय देवहूत्यै महात्मने
    । वदते साङ्ख्ययोगं च साङ्ख्याचार्याय वै प्रभो ॥ १३॥ नमः परमहंसाय ज्ञानं संवदते परम् । विधात्रे ज्ञानरूपाय
    येनात्मा सम्प्रसीदति ॥ १४॥ वेदव्यासाय वेदानां विभागं कुर्वते नमः । हिताय सर्वलोकानां पुराणरचनाय च
    ॥ १५॥ एवं मत्स्यादितनुभिर्भक्तकार्योद्यताय ते । सर्गस्थितिध्वंसकर्त्रे नमस्ते ब्रह्मणे प्रभो ॥ १६॥
    आर्तिहन्त्रे स्वदासानां सुखदाय शुभाय च । पीताम्बराय हरये तार्क्ष्ययानाय ते नमः । सर्वक्रियायैककर्त्रे
    शरण्याय नमो नमः ॥ १७॥ दैत्यसन्तापितामर्त्यदुःखादिध्वंसवज्रक । शेषतल्पशयायार्कचन्द्रनेत्राय ते नमः
    ॥ १८॥ कृपासिन्धो रमानाथ पाहि नश्शरणागतान् । जलन्धरेण देवाश्च स्वर्गात्सर्वे निराकृताः ॥ १९॥ सूर्यो
    निस्सारितः स्थानाच्चन्द्रो वह्निस्तथैव च । पातालान्नागराजश्च धर्मराजो निराकृतः ॥ ५
