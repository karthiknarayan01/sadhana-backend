id: sri-pada-sri-vallabha-siddha-mangala-stotram
category: stotram
name:
  english: Sri Pada Sri Vallabha Siddha Mangala Stotram
content:
  english: shrimadananta shrivibhushita appalalakshminarasimharaja jaya vijayibhava digvijayibhava shrimadakhanda
    shrivijayibhava || || shrividyadhari radha surekha shrirakhidhara shripada jaya vijayibhava digvijayibhava
    shrimadakhanda shrivijayibhava || || mata sumati vatsalyamrita pariposhita jaya shripada jaya vijayibhava
    digvijayibhava shrimadakhanda shrivijayibhava || || satya rishishvara duhitanandana bapanaryanuta
    shricarana jaya vijayibhava digvijayibhava shrimadakhanda shrivijayibhava || || savitrikathakacayana
    punyaphala bharadvaja rishi gotrasambhava jaya vijayibhava digvijayibhava shrimadakhanda shrivijayibhava
    || || do caupati dev lakshmi ghana sankhya bodhita shricarana jaya vijayibhava digvijayibhava shrimadakhanda
    shrivijayibhava || || punyarupini rajamambasuta garbhapunyaphala sanjata jaya vijayibhava digvijayibhava
    shrimadakhanda shrivijayibhava || || sumatinandana naraharinandana dattadeva prabhu shripada jaya
    vijayibhava digvijayibhava shrimadakhanda shrivijayibhava || || pithikapura nitya vihara madhumati
    datta mangalarupa jaya vijayibhava digvijayibhava shrimadakhanda shrivijayibhava || || iti siddhamangala
    stotram ||
  devanagari: श्रीमदनन्त श्रीविभूषित अप्पललक्ष्मीनरसिंहराजा जय विजयीभव दिग्विजयीभव श्रीमदखण्ड श्रीविजयीभव
    ॥ ॥ श्रीविद्याधरि राधा सुरेख श्रीराखीधर श्रीपादा जय विजयीभव दिग्विजयीभव श्रीमदखण्ड श्रीविजयीभव ॥ ॥
    माता सुमती वात्सल्यामृत परिपोषित जय श्रीपादा जय विजयीभव दिग्विजयीभव श्रीमदखण्ड श्रीविजयीभव ॥ ॥ सत्य
    ऋषीश्वर दुहितानन्दन बापनार्यनुत श्रीचरणा जय विजयीभव दिग्विजयीभव श्रीमदखण्ड श्रीविजयीभव ॥ ॥ सवितृकाठकचयन
    पुण्यफल भरद्वाज ऋषि गोत्रसम्भवा जय विजयीभव दिग्विजयीभव श्रीमदखण्ड श्रीविजयीभव ॥ ॥ दो चौपाती देव् लक्ष्मी
    घन सङ्ख्या बोधित श्रीचरणा जय विजयीभव दिग्विजयीभव श्रीमदखण्ड श्रीविजयीभव ॥ ॥ पुण्यरूपिणी राजमाम्बसुत
    गर्भपुण्यफल सञ्जाता जय विजयीभव दिग्विजयीभव श्रीमदखण्ड श्रीविजयीभव ॥ ॥ सुमतीनन्दन नरहरिनन्दन दत्तदेव
    प्रभु श्रीपादा जय विजयीभव दिग्विजयीभव श्रीमदखण्ड श्रीविजयीभव ॥ ॥ पीठिकापुर नित्य विहारा मधुमति दत्ता
    मङ्गलरूपा जय विजयीभव दिग्विजयीभव श्रीमदखण्ड श्रीविजयीभव ॥ ॥ इति सिद्धमङ्गल स्तोत्रम् ॥
