id: vishnustotramshaunakaproktam
category: stotram
name:
  english: vishnustotramshaunakaproktam
  devanagari: विष्णुस्तोत्रम्शौनकप्रोक्तम्
content:
  english: shaunakaproktam vishnustotram vishnave vishnave nityam vishnave vishnave namah | jishnave jishnave
    sarvam jishnave jishnave namah || 3|| namami vishnum buddhisthamahankaragatam harim cittasthamishamavyaktamanantamaparajitam
    | vishnumidyamashesheshamanadinidhanam vibhum || 4|| vishnushcittagato yanme vishnurbuddhigatashca
    yat | yaccahankarago vishnuryadvishnurmayi samsthitah || 5|| karoti kartribhuto'sau sthavarasya carasya
    ca | tatpapam nashamayatu tasminneva vicintite || 6|| dhyato harati yah papam svapne drishtah shubhavahah
    | tamupendramaham vishnum nato'smyartiharam harim || 7|| jagatyasminniradhare majjamane tamasyadhah
    | hastavalambadam vishnum pranato'smi paratparam || 8|| sarveshvareshvara vibho paramatmannadhokshaja
    | hrishikesha hrishikesha hrishikesha namo'stu te || 9|| nrisimhananta govinda bhutabhavana keshava
    | duruktam dushkritam dhyatam prashamagrya namo'stu te || 10|| yanmaya cintitam dushtam svacittvavashavartina
    | narakavahamatyugram tacchamam naya keshava || 11|| brahmanyadeva govinda paramarthaparayana | jagannatha
    jagaddhatah papam prashamayacyuta || 12|| yaccaparahne purvahne madhyahne ca tatha nishi | kayena
    manasa vaca kritam papamajanata || 13|| janata va hrishikesha pundarikaksha madhava | namatrayoccaranatastatprayatu
    mama kshayam || 14|| shariram me hrishikesha pundarikaksha manasam | papam prashamayadya tvam vakkritam
    mama madhava || 15|| yadvrajanyatsvapanbhunjanyaduttishthanyadasthitah | kritavamshcapi yaccaham kayena
    manasa gira || 16|| mahatsvalpamatisthulam kuyoninarakavaham | yatu prashamanam sarvam vasudevasya
    kirtanat || 17|| param brahma param dhama pavitram paramam ca yat | tasminsankirtite vishnoh pade
    papam pranashyatu || 18|| surayo yatpravekshyanti hyapunarbhavakankshinah | mamakhilam daha tvam hi
    tadvishnoh paramam padam || 19|| yatprapya na ninvartante gandhasparshadivarjitam | papam pranashayatvadya
    tadvishnoh paramam padam || 20|| sadasadyattatha vyaktavyaktarupamajajaram
  devanagari: शौनकप्रोक्तं विष्णुस्तोत्रम् विष्णवे विष्णवे नित्यं विष्णवे विष्णवे नमः । जिष्णवे जिष्णवे
    सर्वं जिष्णवे जिष्णवे नमः ॥ ३॥ नमामि विष्णुं बुद्धिस्थमहङ्कारगतं हरिं चित्तस्थमीशमव्यक्तमनन्तमपराजितम्
    । विष्णुमीड्यमशेषेशमनादिनिधनं विभुम् ॥ ४॥ विष्णुश्चित्तगतो यन्मे विष्णुर्बुद्धिगतश्च यत् । यच्चाहङ्कारगो
    विष्णुर्यद्विष्णुर्मयि संस्थितः ॥ ५॥ करोति कर्तृभूतोऽसौ स्थावरस्य चरस्य च । तत्पापं नाशमायातु तस्मिन्नेव
    विचिन्तिते ॥ ६॥ ध्यातो हरति यः पापं स्वप्ने दृष्टः शुभावहः । तमुपेन्द्रमहं विष्णुं नतोऽस्म्यार्तिहरं
    हरिम् ॥ ७॥ जगत्यस्मिन्निराधारे मज्जमाने तमस्यधः । हस्तावलम्बदं विष्णुं प्रणतोऽस्मि परात्परम् ॥ ८॥
    सर्वेश्वरेश्वर विभो परमात्मन्नधोक्षज । हृषीकेश हृषीकेश हृषीकेश नमोऽस्तु ते ॥ ९॥ नृसिंहानन्त गोविन्द
    भूतभावन केशव । दुरुक्तं दुष्कृतं ध्यातं प्रशमाग्र्य नमोऽस्तु ते ॥ १०॥ यन्मया चिन्तितं दुष्टं स्वचित्त्ववशवर्तिना
    । नरकावहमत्युग्रं तच्छमं नय केशव ॥ ११॥ ब्रह्मण्यदेव गोविन्द परमार्थपरायण । जगन्नाथ जगद्धातः पापं प्रशमयाच्युत
    ॥ १२॥ यच्चापराह्ने पूर्वाह्ने मध्याह्ने च तथा निशि । कायेन मनसा वाचा कृतं पापमजानता ॥ १३॥ जानता वा
    हृषीकेश पुण्डरीकाक्ष माधव । नामत्रयोच्चारणतस्तत्प्रयातु मम क्षयम् ॥ १४॥ शारीरं मे हृषीकेश पुण्डरीकाक्ष
    मानसम् । पापं प्रशमयाद्य त्वं वाक्कृतं मम माधव ॥ १५॥ यद्व्रजन्यत्स्वपन्भुञ्जन्यदुत्तिष्ठन्यदास्थितः
    । कृतवांश्चापि यच्चाहं कायेन मनसा गिरा ॥ १६॥ महत्स्वल्पमतिस्थूलं कुयोनिनरकावहम् । यातु प्रशमनं सर्वं
    वासुदेवस्य कीर्तनात् ॥ १७॥ परं ब्रह्म परं धाम पवित्रं परमं च यत् । तस्मिन्सङ्कीर्तिते विष्णोः पादे
    पापं प्रणश्यतु ॥ १८॥ सूरयो यत्प्रवेक्ष्यन्ति ह्यपुनर्भवकाङ्क्षिणः । ममाखिलं दह त्वं हि तद्विष्णोः
    परमं पदम् ॥ १९॥ यत्प्राप्य न निन्वर्तन्ते गन्धस्पर्शादिवर्जितम् । पापं प्रणाशयत्वद्य तद्विष्णोः परमं
    पदम् ॥ २०॥ सदसद्यत्तथा व्यक्ताव्यक्तरूपमजाजरम्
