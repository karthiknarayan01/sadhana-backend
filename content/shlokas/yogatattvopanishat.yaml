id: yogatattvopanishat
category: upanishad
name:
  english: yogatattvopanishat
  devanagari: योगतत्त्वोपनिषत्
content:
  english: khairmayajalena veshtitah || 4 || tesham muktikaram margam mayajalanikrintanam | janmamrityujara
    vyadhinashanam mrityutarakam || 5 || nanamargaistu dushprapam kaivalyam paramam padam | patitah shastrajaleshu
    prajnaya tena mohitah || 6 || anirvacyam padam vaktum na shakyam taih surairapi | svatmaprakasharupam
    tatkim shastrena prakashyate || 7 || nishkalam nirmalam shantam sarvatitam niramayam | tadeva jivarupena
    punyapapaphalairvritam || 8 || paramatmapadam nityam tatkatham jivatam gatam | sarvabhavapadatitam
    jnanarupam niranjanam || 9 || varivatsphuritam tasmimstatrahamkritirutthita | pancatmakamabhutpindam
    dhatubaddham gunatmakam || 10 || sukhaduhkhaih samayuktam jivabhavanaya kuru | tena jivabhidha prokta
    vishuddhaih paramatmani || 11 || kamakrodhabhayam capi mohalobhamado rajah | janma mrityushca karpanyam
    shokastandra kshudha trisha || 12 || trishna lajja bhayam duhkham vishado harsha eva ca | ebhirdoshairvinirmuktah
    sa jivah kevalo matah || 13 || tasmaddoshavinasharthamupayam kathayami te | yogahinam katham jnanam
    mokshadam bhavati dhruvam || 14 || yogo hi jnanahinastu na kshamo mokshakarmani | tasmajjnanam ca
    yogam ca mumukshurdridhamabhyaset || 15 || ajnanadeva samsaro jnanadeva vimucyate | jnanasvarupamevadau
    jnanam jneyaikasadhanam || 16 || jnatam yena nijam rupam kaivalyam paramam padam | nishkalam nirmalam
    sakshatsaccidanandarupakam || 17 || utpattisthitisamharasphurtijnanavivarjitam | etajjnanamiti proktamatha
    yogam bravimi te || 18 || yogo hi bahudha brahmanbhidyate vyavaharatah | mantrayogo layashcaiva hatho'sau
    rajayogatah || 19 || arambhashca ghatashcaiva tatha paricayah smritah | nishpattishcetyavastha ca
    sarvatra parikirtita || 20 || etesham lakshanam brahmanvakshye shrinu samasatah | matrikadiyutam mantram
    dvadashabdam tu yo japet || 21 || kramena labhate jnanamanimadigunanvitam | alpabuddhirimam yogam
    sevate sadhakadhamah || 22 || layayogashcittalayah kotishah parikirtitah | gacchamstishthansvapanbhunjandhyayennishkalamishvaram
    || 23 || sa eva layayogah syaddhathayogamatah shrinu | yamashca niyamashcaiva asanam pranasamyamah
    || 24 || pratyaharo dharana ca dhyanam bhrumadhyame harim | samadhih samatavastha sashtango yoga ucyate
    || 25 || mahamudra mahabandho mahavedhashca khecari | jalandharoddiyanashca mula bandhastathaiva ca
    || 26 || dirghapranavasandhanam siddhantashravanam param | vajroli camaroli ca sahajoli tridha mata
    || 27 || etesham lakshanam brahmanpratyekam shrinu tattvatah | laghvaharo yameshveko mukhyo bhavati
    netarah || 28 || ahimsa niyameshveka mukhya vai caturanana | siddham padmam tatha simham bhadram ceti
    catushtayam || 29 || prathamabhyasakale tu vighnah syushcaturanana | alasyam katthanam dhurtagoshti
    mantradisadhanam || 30 || dhatustrilaulyakadini mrigatrishnamayani vai | jnatva sudhistyajetsarvan
    vighnanpunyaprabhavatah || 31 || pranayamam tatah kuryatpadmasanagatah svayam | sushobhanam matham
    kuryatsukshmadvaram tu nirvranam || 32 || sushthu liptam gomayena sudhaya va prayatnatah | matkunairmashakairlutairvarjitam
    ca prayatnatah || 33 || dine dine ca sammrishtam sammarjanya visheshatah | vasitam ca sugandhena dhupitam
    gugguladibhih || 34 || natyucchritam natinicam cailajinakushottaram | tatropavishya medhavi padmasanasamanvitah
    || 35 || rijukayah pranjalishca pranamedishtadevatam | tato dakshinahastasya angushthenaiva pingalam
    || 36 || nirudhya purayedvayumidaya tu shanaih shanaih | yathashaktyavirodhena tatah kuryacca kumbhakam
    || 37 || punastyajetpingalaya shanaireva na vegatah | punah pingalayapurya purayedudaram shanaih ||
    38 || dharayitva yathashakti recayedidaya shanaih | yaya tyajettayapurya dharayedavirodhatah || 39
    || janu pradakshinikritya na drutam na vilambitam | angulisphotanam kuryatsa matra parigiyate || 40
    || idaya vayumaropya shanaih shodashamatraya | kumbhayetpuritam pashcaccatuhshashtya tu matraya ||
    41 || recayetpingalanadya dvatrimshanmatraya punah | punah pingalayapurya purvavatsusamahitah || 42
    || pratarmadhyamdine sayamardharatre ca kumbhakan | shanairashitiparyantam caturvaram samabhyaset
    || 43 || evam masatrayabhyasannadishuddhistato bhavet | yada tu nadishuddhih syattada cihnani bahyatah
    || 44 || jayante yogino dehe tani vakshyamyasheshatah | shariralaghuta diptirjatharagnivivardhanam
    || 45 || krishatvam ca sharirasya tada jayeta nishcitam | yogavighnakaraharam varjayedyogavittamah
    || 46 || lavanam sarshapam camlamushnam ruksham ca tikshnakam | shakajatam ramathadi vahnistripathasevanam
    || 47 || pratahsnanopavasadikayakleshamshca varjayet | abhyasakale prathamam shastam kshirajyabhojanam
    || 48 || godhumamudgashalyannam yogavriddhikaram viduh | tatah param yatheshtam tu shaktah syadvayudharane
    || 49 || yatheshtadharanadvayoh siddhyetkevalakumbhakah | kevale kumbhake siddhe recapuravivarjite
    || 50 || na tasya durlabham kincittrishu lokeshu vidyate | prasvedo jayate purvam mardanam tena karayet
    || 51 || tato'pi dharanadvayoh kramenaiva shanaih shanaih | kampo bhavati dehasya asanasthasya dehinah
    || 52 || tato'dhikatarabhyasaddarduri svena jayate | yatha ca darduro bhava utplunyotplutya gacchati
    || 53 || padmasanasthito yogi tatha gacchati bhutale | tato'dhika tarabhyasadbhumityagashca jayate
    || 54 || padmasanastha evasau bhumimutsrijya vartate | atimanushaceshtadi tatha samarthyamudbhavet
    || 55 || na darshayecca samarthyam darshanam viryavattaram | svalpam va bahudha duhkham yogi na vyathate
    tada || 56 || alpamutrapurishashca svalpanidrashca jayate | kilavo drishika lala svedadurgandhatanane
    || 57 || etani sarvatha tasya na jayante tatah param | tato'dhikatarabhyasadbalamutpadyate bahu ||
    58 || yena bhucara siddhih syadbhucaranam jaye kshamah | vyaghro va sharabho vapi gajo gavaya eva
    va || 59 || simho va yogina tena mriyante hastataditah | kandarpasya yatha rupam tatha syadapi yoginah
    || 60 || tadrupavashaga naryah kankshante tasya sangamam | yadi sangam karotyesha tasya bindukshayo
    bhavet || 61 || varjayitva striyah sangam kuryadabhyasamadarat | yogino'nge sugandhashca jayate bindudharanat
    || 62 || tato rahasyupavishtah pranavam plutamatraya | japetpurvarjitanam tu papanam nashahetave ||
    63 || sarvavighnaharo mantrah pranavah sarvadoshaha | evamabhyasayogena siddhirarambhasambhava ||
    64 || tato bhaveddhatavastha pavanabhyasatatpara | prano'pano mano buddhirjivatmaparamatmanoh || 65
    || anyonyasyavirodhena ekata ghatate yada | ghatavastheti sa prokta taccihnani bravimyaham || 66 ||
    purvam yah kathito'bhyasashcaturthamsham parigrahet | diva va yadi va sayam yamamatram samabhyaset
    || 67 || ekavaram pratidinam kuryatkevalakumbhakam | indriyanindriyarthebhyo yatpratyaharanam sphutam
    || 68 || yogi kumbhakamasthaya pratyaharah sa ucyate | yadyatpashyati cakshurbhyam tattadatmeti bhavayet
    || 69 || yadyacchrinoti karnabhyam tattadatmeti bhavayet | labhate nasaya yadyattattadatmeti bhavayet
    || 70 || jihvaya yadrasam hyatti tattadatmeti bhavayet | tvaca yadyatsprishedyogi tattadatmeti bhavayet
    || 71 || evam jnanendriyanam tu tattadatmani dharayet | yamamatram pratidinam yogi yatnadatandritah
    || 72 || yatha va cittasamarthyam jayate yogino dhruvam | durashrutirduradrishtih kshanadduragamastatha
    || 73 || vaksiddhih kamarupatvamadrishyakarani tatha | malamutrapralepena lohadeh svarnata bhavet
    || 74 || khe gatistasya jayeta santatabhyasayogatah | sada buddhimata bhavyam yogina yogasiddhaye
    || 75 || ete vighna mahasiddherna rametteshu buddhiman | na darshayetsvasamarthyam yasya kasyapi yogirat
    || 76 || yatha mudho yatha murkho yatha badhira eva va | tatha varteta lokasya svasamarthyasya guptaye
    || 77 || shishyashca svasvakaryeshu prarthayanti na samshayah | tattatkarmakaravyagrah svabhyase'vismrito
    bhavet || 78 || sarvavyaparamutsrijya yoganishto bhavedhyati
  devanagari: खैर्मायाजालेन वेष्टिताः ॥ ४ ॥ तेषां मुक्तिकरं मार्गं मायाजालनिकृन्तनम् । जन्ममृत्युजरा व्याधिनाशनं
    मृत्युतारकम् ॥ ५ ॥ नानामार्गैस्तु दुष्प्रापं कैवल्यं परमं पदम् । पतिताः शास्त्रजालेषु प्रज्ञया तेन
    मोहिताः ॥ ६ ॥ अनिर्वाच्यं पदं वक्तुं न शक्यं तैः सुरैरपि । स्वात्मप्रकाशरूपं तत्किं शास्त्रेण प्रकाश्यते
    ॥ ७ ॥ निष्कलं निर्मलं शान्तं सर्वातीतं निरामयम् । तदेव जीवरूपेण पुण्यपापफलैर्वृतम् ॥ ८ ॥ परमात्मपदं
    नित्यं तत्कथं जीवतां गतम् । सर्वभावपदातीतं ज्ञानरूपं निरञ्जनम् ॥ ९ ॥ वारिवत्स्फुरितं तस्मिंस्तत्राहंकृतिरुत्थिता
    । पञ्चात्मकमभूत्पिण्डं धातुबद्धं गुणात्मकम् ॥ १० ॥ सुखदुःखैः समायुक्तं जीवभावनया कुरु । तेन जीवाभिधा
    प्रोक्ता विशुद्धैः परमात्मनि ॥ ११ ॥ कामक्रोधभयं चापि मोहलोभमदो रजः । जन्म मृत्युश्च कार्पण्यं शोकस्तन्द्रा
    क्षुधा तृषा ॥ १२ ॥ तृष्णा लज्जा भयं दुःखं विषादो हर्ष एव च । एभिर्दोषैर्विनिर्मुक्तः स जीवः केवलो
    मतः ॥ १३ ॥ तस्माद्दोषविनाशार्थमुपायं कथयामि ते । योगहीनं कथं ज्ञानं मोक्षदं भवति ध्रुवम् ॥ १४ ॥ योगो
    हि ज्ञानहीनस्तु न क्षमो मोक्षकर्मणि । तस्माज्ज्ञानं च योगं च मुमुक्षुर्दृढमभ्यसेत् ॥ १५ ॥ अज्ञानादेव
    संसारो ज्ञानादेव विमुच्यते । ज्ञानस्वरूपमेवादौ ज्ञानं ज्ञेयैकसाधनम् ॥ १६ ॥ ज्ञातं येन निजं रूपं कैवल्यं
    परमं पदम् । निष्कलं निर्मलं साक्षात्सच्चिदानन्दरूपकम् ॥ १७ ॥ उत्पत्तिस्थितिसंहारस्फूर्तिज्ञानविवर्जितम्
    । एतज्ज्ञानमिति प्रोक्तमथ योगं ब्रवीमि ते ॥ १८ ॥ योगो हि बहुधा ब्रह्मन्भिद्यते व्यवहारतः । मन्त्रयोगो
    लयश्चैव हठोऽसौ राजयोगतः ॥ १९ ॥ आरम्भश्च घटश्चैव तथा परिचयः स्मृतः । निष्पत्तिश्चेत्यवस्था च सर्वत्र
    परिकीर्तिता ॥ २० ॥ एतेषां लक्षणं ब्रह्मन्वक्ष्ये शृणु समासतः । मातृकादियुतं मन्त्रं द्वादशाब्दं तु
    यो जपेत् ॥ २१ ॥ क्रमेण लभते ज्ञानमणिमादिगुणान्वितम् । अल्पबुद्धिरिमं योगं सेवते साधकाधमः ॥ २२ ॥ लययोगश्चित्तलयः
    कोटिशः परिकीर्तितः । गच्छंस्तिष्ठन्स्वपन्भुञ्जन्ध्यायेन्निष्कलमीश्वरम् ॥ २३ ॥ स एव लययोगः स्याद्धठयोगमतः
    शृणु । यमश्च नियमश्चैव आसनं प्राणसंयमः ॥ २४ ॥ प्रत्याहारो धारणा च ध्यानं भ्रूमध्यमे हरिम् । समाधिः
    समतावस्था साष्टाङ्गो योग उच्यते ॥ २५ ॥ महामुद्रा महाबन्धो महावेधश्च खेचरी । जालन्धरोड्डियाणश्च मूल
    बन्धस्तथैव च ॥ २६ ॥ दीर्घप्रणवसन्धानं सिद्धान्तश्रवणं परम् । वज्रोली चामरोली च सहजोली त्रिधा मता ॥
    २७ ॥ एतेषां लक्षणं ब्रह्मन्प्रत्येकं शृणु तत्त्वतः । लघ्वाहारो यमेष्वेको मुख्यो भवति नेतरः ॥ २८ ॥
    अहिंसा नियमेष्वेका मुख्या वै चतुरानन । सिद्धं पद्मं तथा सिंहं भद्रं चेति चतुष्टयम् ॥ २९ ॥ प्रथमाभ्यासकाले
    तु विघ्नाः स्युश्चतुरानन । आलस्यं कत्थनं धूर्तगोष्टी मन्त्रादिसाधनम् ॥ ३० ॥ धातुस्त्रीलौल्यकादीनि
    मृगतृष्णामयानि वै । ज्ञात्वा सुधीस्त्यजेत्सर्वान् विघ्नान्पुण्यप्रभावतः ॥ ३१ ॥ प्राणायामं ततः कुर्यात्पद्मासनगतः
    स्वयम् । सुशोभनं मठं कुर्यात्सूक्ष्मद्वारं तु निर्व्रणम् ॥ ३२ ॥ सुष्ठु लिप्तं गोमयेन सुधया वा प्रयत्नतः
    । मत्कुणैर्मशकैर्लूतैर्वर्जितं च प्रयत्नतः ॥ ३३ ॥ दिने दिने च संमृष्टं संमार्जन्या विशेषतः । वासितं
    च सुगन्धेन धूपितं गुग्गुलादिभिः ॥ ३४ ॥ नात्युच्छ्रितं नातिनीचं चैलाजिनकुशोत्तरम् । तत्रोपविश्य मेधावी
    पद्मासनसमन्वितः ॥ ३५ ॥ ऋजुकायः प्राञ्जलिश्च प्रणमेदिष्टदेवताम् । ततो दक्षिणहस्तस्य अङ्गुष्ठेनैव पिङ्गलाम्
    ॥ ३६ ॥ निरुध्य पूरयेद्वायुमिडया तु शनैः शनैः । यथाशक्त्यविरोधेन ततः कुर्याच्च कुम्भकम् ॥ ३७ ॥ पुनस्त्यजेत्पिङ्गलया
    शनैरेव न वेगतः । पुनः पिङ्गलयापूर्य पूरयेदुदरं शनैः ॥ ३८ ॥ धारयित्वा यथाशक्ति रेचयेदिडया शनैः । यया
    त्यजेत्तयापूर्य धारयेदविरोधतः ॥ ३९ ॥ जानु प्रदक्षिणीकृत्य न द्रुतं न विलम्बितम् । अङ्गुलिस्फोटनं कुर्यात्सा
    मात्रा परिगीयते ॥ ४० ॥ इडया वायुमारोप्य शनैः षोडशमात्रया । कुम्भयेत्पूरितं पश्चाच्चतुःषष्ट्या तु मात्रया
    ॥ ४१ ॥ रेचयेत्पिङ्गलानाड्या द्वात्रिंशन्मात्रया पुनः । पुनः पिङ्गलयापूर्य पूर्ववत्सुसमाहितः ॥ ४२ ॥
    प्रातर्मध्यंदिने सायमर्धरात्रे च कुम्भकान् । शनैरशीतिपर्यन्तं चतुर्वारं समभ्यसेत् ॥ ४३ ॥ एवं मासत्रयाभ्यासान्नाडीशुद्धिस्ततो
    भवेत् । यदा तु नाडीशुद्धिः स्यात्तदा चिह्नानि बाह्यतः ॥ ४४ ॥ जायन्ते योगिनो देहे तानि वक्ष्याम्यशेषतः
    । शरीरलघुता दीप्तिर्जाठराग्निविवर्धनम् ॥ ४५ ॥ कृशत्वं च शरीरस्य तदा जायेत निश्चितम् । योगाविघ्नकराहारं
    वर्जयेद्योगवित्तमः ॥ ४६ ॥ लवणं सर्षपं चाम्लमुष्णं रूक्षं च तीक्ष्णकम् । शाकजातं रामठादि वह्निस्त्रीपथसेवनम्
    ॥ ४७ ॥ प्रातःस्नानोपवासादिकायक्लेशांश्च वर्जयेत् । अभ्यासकाले प्रथमं शस्तं क्षीराज्यभोजनम् ॥ ४८ ॥
    गोधूममुद्गशाल्यन्नं योगवृद्धिकरं विदुः । ततः परं यथेष्टं तु शक्तः स्याद्वायुधारणे ॥ ४९ ॥ यथेष्टधारणाद्वायोः
    सिद्ध्येत्केवलकुम्भकः । केवले कुम्भके सिद्धे रेचपूरविवर्जिते ॥ ५० ॥ न तस्य दुर्लभं किञ्चित्त्रिषु
    लोकेषु विद्यते । प्रस्वेदो जायते पूर्वं मर्दनं तेन कारयेत् ॥ ५१ ॥ ततोऽपि धारणाद्वायोः क्रमेणैव शनैः
    शनैः । कम्पो भवति देहस्य आसनस्थस्य देहिनः ॥ ५२ ॥ ततोऽधिकतराभ्यासाद्दार्दुरी स्वेन जायते । यथा च दर्दुरो
    भाव उत्प्लुन्योत्प्लुत्य गच्छति ॥ ५३ ॥ पद्मासनस्थितो योगी तथा गच्छति भूतले । ततोऽधिक तराभ्यासाद्भूमित्यागश्च
    जायते ॥ ५४ ॥ पद्मासनस्थ एवासौ भूमिमुत्सृज्य वर्तते । अतिमानुषचेष्टादि तथा सामर्थ्यमुद्भवेत् ॥ ५५ ॥
    न दर्शयेच्च सामर्थ्यं दर्शनं वीर्यवत्तरम् । स्वल्पं वा बहुधा दुःखं योगी न व्यथते तदा ॥ ५६ ॥ अल्पमूत्रपुरीषश्च
    स्वल्पनिद्रश्च जायते । कीलवो दृषिका लाला स्वेददुर्गन्धतानने ॥ ५७ ॥ एतानि सर्वथा तस्य न जायन्ते ततः
    परम् । ततोऽधिकतराभ्यासाद्बलमुत्पद्यते बहु ॥ ५८ ॥ येन भूचर सिद्धिः स्याद्भूचराणां जये क्षमः । व्याघ्रो
    वा शरभो वापि गजो गवय एव वा ॥ ५९ ॥ सिंहो वा योगिना तेन म्रियन्ते हस्तताडिताः । कन्दर्पस्य यथा रूपं
    तथा स्यादपि योगिनः ॥ ६० ॥ तद्रूपवशगा नार्यः काङ्क्षन्ते तस्य सङ्गमम् । यदि सङ्गं करोत्येष तस्य बिन्दुक्षयो
    भवेत् ॥ ६१ ॥ वर्जयित्वा स्त्रियाः सङ्गं कुर्यादभ्यासमादरात् । योगिनोऽङ्गे सुगन्धश्च जायते बिन्दुधारणात्
    ॥ ६२ ॥ ततो रहस्युपाविष्टः प्रणवं प्लुतमात्रया । जपेत्पूर्वार्जितानां तु पापानां नाशहेतवे ॥ ६३ ॥ सर्वविघ्नहरो
    मन्त्रः प्रणवः सर्वदोषहा । एवमभ्यासयोगेन सिद्धिरारम्भसम्भवा ॥ ६४ ॥ ततो भवेद्धटावस्था पवनाभ्यासतत्परा
    । प्राणोऽपानो मनो बुद्धिर्जीवात्मपरमात्मनोः ॥ ६५ ॥ अन्योन्यस्याविरोधेन एकता घटते यदा । घटावस्थेति
    सा प्रोक्ता तच्चिह्नानि ब्रवीम्यहम् ॥ ६६ ॥ पूर्वं यः कथितोऽभ्यासश्चतुर्थांशं परिग्रहेत् । दिवा वा
    यदि वा सायं याममात्रं समभ्यसेत् ॥ ६७ ॥ एकवारं प्रतिदिनं कुर्यात्केवलकुम्भकम् । इन्द्रियाणीन्द्रियार्थेभ्यो
    यत्प्रत्याहरणं स्फुटम् ॥ ६८ ॥ योगी कुम्भकमास्थाय प्रत्याहारः स उच्यते । यद्यत्पश्यति चक्षुर्भ्यां
    तत्तदात्मेति भावयेत् ॥ ६९ ॥ यद्यच्छृणोति कर्णाभ्यां तत्तदात्मेति भावयेत् । लभते नासया यद्यत्तत्तदात्मेति
    भावयेत् ॥ ७० ॥ जिह्वया यद्रसं ह्यत्ति तत्तदात्मेति भावयेत् । त्वचा यद्यत्स्पृशेद्योगी तत्तदात्मेति
    भावयेत् ॥ ७१ ॥ एवं ज्ञानेन्द्रियाणां तु तत्तदात्मनि धारयेत् । याममात्रं प्रतिदिनं योगी यत्नादतन्द्रितः
    ॥ ७२ ॥ यथा वा चित्तसामर्थ्यं जायते योगिनो ध्रुवम् । दूरश्रुतिर्दूरदृष्टिः क्षणाद्दूरगमस्तथा ॥ ७३ ॥
    वाक्सिद्धिः कामरूपत्वमदृश्यकरणी तथा । मलमूत्रप्रलेपेन लोहादेः स्वर्णता भवेत् ॥ ७४ ॥ खे गतिस्तस्य जायेत
    सन्तताभ्यासयोगतः । सदा बुद्धिमता भाव्यं योगिना योगसिद्धये ॥ ७५ ॥ एते विघ्ना महासिद्धेर्न रमेत्तेषु
    बुद्धिमान् । न दर्शयेत्स्वसामर्थ्यं यस्य कस्यापि योगिराट् ॥ ७६ ॥ यथा मूढो यथा मूर्खो यथा बधिर एव वा
    । तथा वर्तेत लोकस्य स्वसामर्थ्यस्य गुप्तये ॥ ७७ ॥ शिष्याश्च स्वस्वकार्येषु प्रार्थयन्ति न संशयः ।
    तत्तत्कर्मकरव्यग्रः स्वाभ्यासेऽविस्मृतो भवेत् ॥ ७८ ॥ सर्वव्यापारमुत्सृज्य योगनिष्टो भवेध्यति
