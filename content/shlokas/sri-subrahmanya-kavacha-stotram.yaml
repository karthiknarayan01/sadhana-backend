id: sri-subrahmanya-kavacha-stotram
category: stotram
name:
  english: Sri Subrahmanya Kavacha Stotram
content:
  english: asya shrisubrahmanyakavacastotramahamantrasya shrisubrahmanyo devata subrahmanyayeti kilakam
    shrisubrahmanya prasadasiddhyarthe jape viniyogah || karanyasah om sam angushthabhyam namah | om sim
    tarjanibhyam namah | om sum madhyamabhyam namah | om saim anamikabhyam namah | om saum kanishthikabhyam
    namah | om sah karatalakaraprishthabhyam namah || anganyasah om sam hridayaya namah | om sim shirase
    svaha | om sum shikhayai vashat | om saim kavacaya hum | om saum netratrayaya vaushat | om sah astraya
    phat | bhurbhuvassuvaromiti digbandhah || dhyanam | sindurarunamindukantivadanam keyuraharadibhih
    divyairabharanairvibhushitatanum svargadisaukhyapradam | ambhojabhayashaktikukkutadharam raktangaragojjvalam
    subrahmanyamupasmahe pranamatam sarvarthasiddhipradam || lamityadi pancapuja | om lam prithivyatmane
    subrahmanyaya gandham samarpayami | om ham akashatmane subrahmanyaya pushpani samarpayami | om yam
    vayvatmane subrahmanyaya dhupamaghrapayami | om ram agnyatmane subrahmanyaya dipam darshayami | om
    vam amritatmane subrahmanyaya svadannam nivedayami | om sam sarvatmane subrahmanyaya sarvopacaran
    samarpayami | kavacam | subrahmanyo'gratah patu senanih patu prishthatah | guho mam dakshine patu
    vahnijah patu vamatah || || shirah patu mahasenah skando rakshellalatakam | netre me dvadashakshashca
    shrotre rakshatu vishvabhrit || || mukham me shanmukhah patu nasikam shankaratmajah | oshthau vallipatih
    patu jihvam patu shadananah || || devasenapatirdantan cibukam bahulodbhavah | kantham tarakajitpatu
    bahu dvadashabahukah || || hastau shaktidharah patu vakshah patu sharodbhavah | hridayam vahnibhuh
    patu kukshim patvambikasutah || || nabhim shambhusutah patu katim patu haratmajah | uru patu gajarudho
    janu me jahnavisutah || || janghe vishakho me patu padau me shikhivahanah | sarvanyangani bhuteshah
    sarvadhatumshca pavakih || || sandhyakale nishithinyam diva pratarjale'gnishu | durgame ca maharanye
    rajadvare mahabhaye || || tumule ranyamadhye ca sarvadushtamrigadishu | coradisadhvase'bhedye jvaradivyadhipidane
    || || dushtagrahadibhitau ca durnimittadibhishane | astrashastranipate ca patu mam krauncarandhrakrit
    || || yah subrahmanyakavacam ishtasiddhipradam pathet | tasya tapatrayam nasti satyam satyam vadamyaham
    || || dharmarthi labhate dharmamartharthi carthamapnuyat | kamarthi labhate kamam moksharthi mokshamapnuyat
    || || yatra yatra japedbhaktya tatra sannihito guhah | pujapratishthakale ca japakale pathedidam ||
    || teshameva phalavaptih mahapatakanashanam | yah pathecchrinuyadbhaktya nityam devasya sannidhau
    | sarvankamaniha prapya so'nte skandapuram vrajet || || uttaranyasah || karanyasah om sam angushthabhyam
    namah | om sim tarjanibhyam namah | om sum madhyamabhyam namah | om saim anamikabhyam namah | om saum
    kanishthikabhyam namah | om sah karatalakaraprishthabhyam namah || anganyasah om sam hridayaya namah
    | om sim shirase svaha | om sum shikhayai vashat | om saim kavacaya hum | om saum netratrayaya vaushat
    | om sah astraya phat | bhurbhuvassuvaromiti digvimokah || iti shri subrahmanya kavaca stotram |
  devanagari: अस्य श्रीसुब्रह्मण्यकवचस्तोत्रमहामन्त्रस्य श्रीसुब्रह्मण्यो देवता सुब्रह्मण्यायेति कीलकं
    श्रीसुब्रह्मण्य प्रसादसिद्ध्यर्थे जपे विनियोगः ॥ करन्यासः ॐ सां अङ्गुष्ठाभ्यां नमः । ॐ सीं तर्जनीभ्यां
    नमः । ॐ सूं मध्यमाभ्यां नमः । ॐ सैं अनामिकाभ्यां नमः । ॐ सौं कनिष्ठिकाभ्यां नमः । ॐ सः करतलकरपृष्ठाभ्यां
    नमः ॥ अङ्गन्यासः ॐ सां हृदयाय नमः । ॐ सीं शिरसे स्वाहा । ॐ सूं शिखायै वषट् । ॐ सैं कवचाय हुम् । ॐ
    सौं नेत्रत्रयाय वौषट् । ॐ सः अस्त्राय फट् । भूर्भुवस्सुवरोमिति दिग्बन्धः ॥ ध्यानम् । सिन्दूरारुणमिन्दुकान्तिवदनं
    केयूरहारादिभिः दिव्यैराभरणैर्विभूषिततनुं स्वर्गादिसौख्यप्रदम् । अम्भोजाभयशक्तिकुक्कुटधरं रक्ताङ्गरागोज्ज्वलं
    सुब्रह्मण्यमुपास्महे प्रणमतां सर्वार्थसिद्धिप्रदम् ॥ लमित्यादि पञ्चपूजा । ॐ लं पृथिव्यात्मने सुब्रह्मण्याय
    गन्धं समर्पयामि । ॐ हं आकाशात्मने सुब्रह्मण्याय पुष्पाणि समर्पयामि । ॐ यं वाय्वात्मने सुब्रह्मण्याय
    धूपमाघ्रापयामि । ॐ रं अग्न्यात्मने सुब्रह्मण्याय दीपं दर्शयामि । ॐ वं अमृतात्मने सुब्रह्मण्याय स्वादन्नं
    निवेदयामि । ॐ सं सर्वात्मने सुब्रह्मण्याय सर्वोपचारान् समर्पयामि । कवचम् । सुब्रह्मण्योऽग्रतः पातु
    सेनानीः पातु पृष्ठतः । गुहो मां दक्षिणे पातु वह्निजः पातु वामतः ॥ ॥ शिरः पातु महासेनः स्कन्दो रक्षेल्ललाटकम्
    । नेत्रे मे द्वादशाक्षश्च श्रोत्रे रक्षतु विश्वभृत् ॥ ॥ मुखं मे षण्मुखः पातु नासिकां शङ्करात्मजः ।
    ओष्ठौ वल्लीपतिः पातु जिह्वां पातु षडाननः ॥ ॥ देवसेनापतिर्दन्तान् चिबुकं बहुलोद्भवः । कण्ठं तारकजित्पातु
    बाहू द्वादशबाहुकः ॥ ॥ हस्तौ शक्तिधरः पातु वक्षः पातु शरोद्भवः । हृदयं वह्निभूः पातु कुक्षिं पात्वम्बिकासुतः
    ॥ ॥ नाभिं शम्भुसुतः पातु कटिं पातु हरात्मजः । ऊरू पातु गजारूढो जानू मे जाह्नवीसुतः ॥ ॥ जङ्घे विशाखो
    मे पातु पादौ मे शिखिवाहनः । सर्वाण्यङ्गानि भूतेशः सर्वधातूंश्च पावकिः ॥ ॥ सन्ध्याकाले निशीथिन्यां
    दिवा प्रातर्जलेऽग्निषु । दुर्गमे च महारण्ये राजद्वारे महाभये ॥ ॥ तुमुले रण्यमध्ये च सर्वदुष्टमृगादिषु
    । चोरादिसाध्वसेऽभेद्ये ज्वरादिव्याधिपीडने ॥ ॥ दुष्टग्रहादिभीतौ च दुर्निमित्तादिभीषणे । अस्त्रशस्त्रनिपाते
    च पातु मां क्रौञ्चरन्ध्रकृत् ॥ ॥ यः सुब्रह्मण्यकवचं इष्टसिद्धिप्रदं पठेत् । तस्य तापत्रयं नास्ति सत्यं
    सत्यं वदाम्यहम् ॥ ॥ धर्मार्थी लभते धर्ममर्थार्थी चार्थमाप्नुयात् । कामार्थी लभते कामं मोक्षार्थी मोक्षमाप्नुयात्
    ॥ ॥ यत्र यत्र जपेद्भक्त्या तत्र सन्निहितो गुहः । पूजाप्रतिष्ठाकाले च जपकाले पठेदिदम् ॥ ॥ तेषामेव फलावाप्तिः
    महापातकनाशनम् । यः पठेच्छृणुयाद्भक्त्या नित्यं देवस्य सन्निधौ । सर्वान्कामानिह प्राप्य सोऽन्ते स्कन्दपुरं
    व्रजेत् ॥ ॥ उत्तरन्यासः ॥ करन्यासः ॐ सां अङ्गुष्ठाभ्यां नमः । ॐ सीं तर्जनीभ्यां नमः । ॐ सूं मध्यमाभ्यां
    नमः । ॐ सैं अनामिकाभ्यां नमः । ॐ सौं कनिष्ठिकाभ्यां नमः । ॐ सः करतलकरपृष्ठाभ्यां नमः ॥ अङ्गन्यासः
    ॐ सां हृदयाय नमः । ॐ सीं शिरसे स्वाहा । ॐ सूं शिखायै वषट् । ॐ सैं कवचाय हुम् । ॐ सौं नेत्रत्रयाय वौषट्
    । ॐ सः अस्त्राय फट् । भूर्भुवस्सुवरोमिति दिग्विमोकः ॥ इति श्री सुब्रह्मण्य कवच स्तोत्रम् ।
