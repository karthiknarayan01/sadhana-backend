id: batukabhairavashtottarashatanamastotram-3
category: stotram
name:
  english: batukabhairavashtottarashatanamastotram 3
  devanagari: बटुकभैरवाष्टोत्तरशतनामस्तोत्रं ३
content:
  english: sahodarah || 8|| deviputro divyamurtirdiptiman diptalocanah | mahasenapriyakaro manyo madhavamatulah
    || 9|| bhadrakalipatirbhadro bhadrado bhadravahanah | pashupahararasikah pashi pashupatirpatih ||
    10|| candah pracanda candeshashcandihridayanandanah | daksho dakshadhvaraharo digvasa dirghalocanah
    || 11|| niratanko nirvikalpah kalpah kalpantabhairavah | madatandavakrin matto mahadevapriyo mahan
    || 12|| khatvangapanih khatitah kharashulah kharantakrita | brahmandabhedano brahmajnani brahmanapalakah
    || 13|| dikcaro bhucaro bhushnuh khecarah khelanapriyah | sarvarogaprahartta ca sarvaroganishudanah
    || 14|| sarvakamapradah sharvah sarvapapanikrintanah | patu mam sarvatah shriman batuko bhairavah
    sada || 15|| || iti kalasankarshanatantroktam batukabhairavashtottarashatanamastotram sampurnam ||
  devanagari: सहोदरः ॥ ८॥ देवीपुत्रो दिव्यमूर्तिर्दीप्तिमान् दीप्तलोचनः । महासेनप्रियकरो मान्यो माधवमातुलः
    ॥ ९॥ भद्रकालीपतिर्भद्रो भद्रदो भद्रवाहनः । पशूपहाररसिकः पाशी पशुपतिर्पतिः ॥ १०॥ चण्डः प्रचण्ड चण्डेशश्चण्डीहृदयनन्दनः
    । दक्षो दक्षाध्वरहरो दिग्वासा दीर्घलोचनः ॥ ११॥ निरातङ्को निर्विकल्पः कल्पः कल्पान्तभैरवः । मदताण्डवकृन्
    मत्तो महादेवप्रियो महान् ॥ १२॥ खट्वाङ्गपाणिः खातीतः खरशूलः खरान्तकृत । ब्रह्माण्डभेदनो ब्रह्मज्ञानी
    ब्रह्मणपालकः ॥ १३॥ दिक्चरो भूचरो भूष्णुः खेचरः खेलनप्रियः । सर्वरोगप्रहर्त्ता च सर्वरोगनिषूदनः ॥ १४॥
    सर्वकामप्रदः शर्वः सर्वपापनिकृन्तनः । पातु मां सर्वतः श्रीमान् बटुको भैरवः सदा ॥ १५॥ ॥ इति कालसङ्कर्षणतन्त्रोक्तं
    बटुकभैरवाष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥
meaning: {}
