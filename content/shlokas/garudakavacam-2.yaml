id: garudakavacam-2
category: kavacha
name:
  english: garudakavacam
  devanagari: गरुडकवचम्
content:
  english: garudakavacam atha garudakavacam | harih om | asya shrigarudakavacastotramantrasya naradabhagavanrishih
    vainateyo devata anushtupchandah shrivainateyaprityarthe jape viniyogah | om shiro me garudah patu
    lalate vinatasutah | netre tu sarpaha patu karnau patu surarcitah || 1|| nasikam patu sarparih vadanam
    vishnuvahanah | suryasutanujah kantham bhujau patu mahabalah || 2||
  devanagari: गरुडकवचम् अथ गरुडकवचम् । हरिः ॐ । अस्य श्रीगरुडकवचस्तोत्रमन्त्रस्य नारदभगवानृषिः वैनतेयो
    देवता अनुष्टुप्छन्दः श्रीवैनतेयप्रीत्यर्थे जपे विनियोगः । ॐ शिरो मे गरुडः पातु ललाटे विनतासुतः । नेत्रे
    तु सर्पहा पातु कर्णौ पातु सुरार्चितः ॥ १॥ नासिकां पातु सर्पारिः वदनं विष्णुवाहनः । सूर्यसूतानुजः कण्ठं
    भुजौ पातु महाबलः ॥ २॥
meaning: {}
