id: somastotram
category: stotram
name:
  english: somastotram
  devanagari: सोमस्तोत्रम्
content:
  english: somastotram atha somastotraprarambhah | asya shrisomastotramahamantrasya gautama rishih | anushtupchandah
    | somo devata | somaprityarthe jape viniyogah | vam angushthabhyam namah | vim tarjanibhyam namah
    | vum madhyamabhyam namah | vaim anamikabhyam namah | vaum kanishthikabhyam namah | vah karatalakaraprishthabhyam
    namah | vam hridayaya namah | vim shirase svaha | vum shikhayai vashat | vaim kavacaya hum | vaum
    netratrayaya vaushat | vah astraya phat | bhurbhuvah suvaromiti digbandhah | dhyanam | shvetambarojjvalatanum
    sitamalyagandham shvetashvayuktarathagam surasevitanghrim | dorbhyam dhritabhayagadam varadam sudhamshum
    shrivatsamauktikadharam pranamami candram || 1|| agneyabhage saratho dashashvashcatreyajo yamunadeshajashca
    | pratyanmukhasthashcaturashrapithe gadadharo no'vatu rohinishah || 2|| candram namami varadam shankarasya
    vibhushanam | kalanidhim kantarupam keyuramakutojjvalam || 3|| varadam vandyacaranam vasudevasya locanam
    | vasudhahladanakaram vidhum tam pranamamyaham || 4|| shvetamalyambaradharam shvetagandhanulepanam
    | shvetachatrollasanmaulim shashinam pranamamyaham || 5|| sarvam jagajjivayasi sudharasamayaih karaih
    | soma dehi mamarogyam sudhapuritamandalam || 6|| raja tvam brahmananam ca ramaya api sodarah | raja
    nathashcaushadhinam raksha mam rajanikara || 7|| shankarasya shiroratnam sharnginashca vilocanam |
    tarakanamadhishastvam taraya'smanmahapadah || 8|| kalyanamurte varada karunarasavaridhe | kalashodadhisanjatakalanatha
    kripam kuru || 9|| kshirarnavasamudbhuta cintamanisahodbhava | kamitarthan pradehi tvam kalpadrumasahodara
    || 10|| shvetambarah shvetavibhushanadhyo gadadharah shvetarucirdvibahuh | candrah sudhatma varadah
    kiriti shreyamsi mahyam pradadatu devah || 11|| idam nishakarastotram yah pathet pratyaham narah |
    upadravatsa mucyeta natra karya vicarana || 12|| iti somastotram sampurnam |
  devanagari: सोमस्तोत्रम् अथ सोमस्तोत्रप्रारम्भः । अस्य श्रीसोमस्तोत्रमहामन्त्रस्य गौतम ऋषिः । अनुष्टुप्छन्दः
    । सोमो देवता । सोमप्रीत्यर्थे जपे विनियोगः । वां अङ्गुष्ठाभ्यां नमः । वीं तर्जनीभ्यां नमः । वूं मध्यमाभ्यां
    नमः । वैं अनामिकाभ्यां नमः । वौं कनिष्ठिकाभ्यां नमः । वः करतलकरपृष्ठाभ्यां नमः । वां हृदयाय नमः ।
    वीं शिरसे स्वाहा । वूं शिखायै वषट् । वैं कवचाय हुम् । वौं नेत्रत्रयाय वौषट् । वः अस्त्राय फट् । भूर्भुवः
    सुवरोमिति दिग्बन्धः । ध्यानम् । श्वेताम्बरोज्ज्वलतनुं सितमाल्यगन्धं श्वेताश्वयुक्तरथगं सुरसेविताङ्घ्रिम्
    । दोर्भ्यां धृताभयगदं वरदं सुधांशुं श्रीवत्समौक्तिकधरं प्रणमामि चन्द्रं ॥ १॥ आग्नेयभागे सरथो दशाश्वश्चात्रेयजो
    यामुनदेशजश्च । प्रत्यङ्मुखस्थश्चतुरश्रपीठे गदाधरो नोऽवतु रोहिणीशः ॥ २॥ चन्द्रं नमामि वरदं शङ्करस्य
    विभूषणम् । कलानिधिं कान्तरूपं केयूरमकुटोज्ज्वलम् ॥ ३॥ वरदं वन्द्यचरणं वासुदेवस्य लोचनम् । वसुधाह्लादनकरं
    विधुं तं प्रणमाम्यहम् ॥ ४॥ श्वेतमाल्याम्बरधरं श्वेतगन्धानुलेपनम् । श्वेतछत्रोल्लसन्मौलिं शशिनं प्रणमाम्यहम्
    ॥ ५॥ सर्वं जगज्जीवयसि सुधारसमयैः करैः । सोम देहि ममारोग्यं सुधापूरितमण्डलम् ॥ ६॥ राजा त्वं ब्राह्मणानां
    च रमाया अपि सोदरः । राजा नाथश्चौषधीनां रक्ष मां रजनीकर ॥ ७॥ शङ्करस्य शिरोरत्नं शार्ङ्गिणश्च विलोचनम्
    । तारकाणामधीशस्त्वं तारयाऽस्मान्महापदः ॥ ८॥ कल्याणमूर्ते वरद करुणारसवारिधे । कलशोदधिसञ्जातकलानाथ कृपां
    कुरु ॥ ९॥ क्षीरार्णवसमुद्भूत चिन्तामणिसहोद्भव । कामितार्थान् प्रदेहि त्वं कल्पद्रुमसहोदर ॥ १०॥ श्वेताम्बरः
    श्वेतविभूषणाढ्यो गदाधरः श्वेतरुचिर्द्विबाहुः । चन्द्रः सुधात्मा वरदः किरीटी श्रेयांसि मह्यं प्रददातु
    देवः ॥ ११॥ इदं निशाकरस्तोत्रं यः पठेत् प्रत्यहं नरः । उपद्रवात्स मुच्येत नात्र कार्या विचारणा ॥ १२॥
    इति सोमस्तोत्रं सम्पूर्णम् ।
