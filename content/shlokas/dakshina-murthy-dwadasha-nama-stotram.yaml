id: dakshina-murthy-dwadasha-nama-stotram
category: stotram
name:
  english: Dakshina Murthy Dwadasha Nama Stotram
content:
  english: atha dakshinamurtidvadashanamastotram prathamam dakshinamurtirdvitiyam munisevitah| brahmarupi
    tritiyam ca caturtham tu guruttamah| pancamam vatamulasthah shashtham vedapriyastatha| saptamam tu
    mahayogi hyashtamam trijagadguruh| navamam ca vishuddhatma dashamam kamitarthadah| ekadasham mahateja
    dvadasham mokshadayakah| dvadashaitani namani sarvalokaguroh kalau| yah pathennityamapnoti naro vidyamanuttamam|
  devanagari: अथ दक्षिणामूर्तिद्वादशनामस्तोत्रं प्रथमं दक्षिणामूर्तिर्द्वितीयं मुनिसेवितः। ब्रह्मरूपी
    तृतीयं च चतुर्थं तु गुरूत्तमः। पञ्चमं वटमूलस्थः षष्ठं वेदप्रियस्तथा। सप्तमं तु महायोगी ह्यष्टमं त्रिजगद्गुरुः।
    नवमं च विशुद्धात्मा दशमं कामितार्थदः। एकादशं महातेजा द्वादशं मोक्षदायकः। द्वादशैतानि नामानि सर्वलोकगुरोः
    कलौ। यः पठेन्नित्यमाप्नोति नरो विद्यामनुत्तमां।
