id: k-ishnastutih2gargasamhita
category: stotram
name:
  english: kṟishnastutih2gargasamhita
  devanagari: क्ऱिष्णस्तुतिः२गर्गसम्हिता
content:
  english: balam navinashatapatravishalanetram bimbadharam sajalamegharucim manojnam | mandasmitam madhurasundaramandayanam
    shrinandanandanamaham manasa namami || 1|| manjiranupuraranannavaratnakanci shriharakesarinakhapratiyantrasangham
    | drishtya''rtiharimashibinduvirajamanam vande kalindatanujatatabalakelim || 2|| purnendusundaramukhopari
    kuncitagrah kesha navinaghananilanibhah sphuranti | rajanta anatashirahkumudasya yasya nandatmajaya
    sabalaya namo namaste || 3|| shrinandanandanastotram pratarutthaya yah pathet | tannetragocaro yati
    sanandam nandanandanah || 4|| iti gargasamhitayam golokakhande vimshadhyayantargata durvasasa krita
    shrikrishnastutih samapta |
  devanagari: बालं नवीनशतपत्रविशालनेत्रं बिम्बाधरं सजलमेघरुचिं मनोज्ञम् । मन्दस्मितं मधुरसुन्दरमन्दयानं
    श्रीनन्दनन्दनमहं मनसा नमामि ॥ १॥ मञ्जीरनूपुररणन्नवरत्नकाञ्ची श्रीहारकेसरिनखप्रतियन्त्रसङ्घम् । दृष्ट्याऽऽर्तिहारिमषिबिन्दुविराजमानं
    वन्दे कलिन्दतनुजातटबालकेलिम् ॥ २॥ पूर्णेन्दुसुन्दरमुखोपरि कुञ्चिताग्राः केशा नवीनघननीलनिभाः स्फुरन्ति
    । राजन्त आनतशिरःकुमुदस्य यस्य नन्दात्मजाय सबलाय नमो नमस्ते ॥ ३॥ श्रीनन्दनन्दनस्तोत्रं प्रातरुत्थाय
    यः पठेत् । तन्नेत्रगोचरो याति सानन्दं नन्दनन्दनः ॥ ४॥ इति गर्गसंहितायां गोलोकखण्डे विंशाध्यायान्तर्गता
    दुर्वससा कृता श्रीकृष्णस्तुतिः समाप्ता ।
meaning: {}
