id: artatranaparayanastotram-arttatranaparayanastutih-3
category: stotram
name:
  english: artatranaparayanastotram ((arttatranaparayanastutih 3)
  devanagari: आर्तत्राणपरायणस्तोत्रम् ((आर्त्तत्राणपरायणस्तुतिः ३)
content:
  english: dartatranaparayanah sa bhagavannarayano me gatih || 5|| yatpadabjanakhodakam trijagatam papaughavicchedanam
    yannamamritapuramastu pibatam samsarasantarakam | pashano'pi yadanghrito muniva dhu rupam param praptavan
    artatranaparayanah sa bhagavannarayano me gatih || 6|| pitra bhrataramuttamasanagatam bhaktottamah
    sa dhruvo drishtva tatsamamarurukshurudito matravamanam gatah | yam gatva sharanam jagama tapasa hemadrisimhasanam
    hyartatranaparayanah sa bhagavannarayano me gatih || 7|| yo'rakshadvasanadibhirvirahitam vipram kucelabhidham
    dinam dinacakorapalanavidhuh shrishankhacakrojjvalah | yajjirnambaramushtimeyaprithukanadaya bhuktva
    kshanat artatranaparayanah sa bhagavannarayano me gatih || 8|| yam kalyanagunabhiramamamalam shastrani
    sancakshate | yasmin yogayute pratishthitamidam vishvam vadantyagamah | yo yogindramanahsaroruhatamahpradhvamsane
    bhanuman artatranaparayanah sa bhagavannarayano me gatih || 2|| yo'trasidaravindagarbhajanusham brahmanamartim
    gatam bhitam kaitabharakshasena madhuna kalpantakale mahan | hatva tau madhukaitabhau ranamukhe bhaktartisamshoshanat
    artatranaparayanah sa bhagavannarayano me gatih || 10|| yannamasmaranadaghaugharahito viprah purajamilah
    prayanmuktimasheshato virahitah samsaradavanalat | so'yam bhagavatottamavana iti praptapratishtho'cirat
    artatranaparayanah sa bhagavannarayano me gatih || 11|| kaverihridayabhiramapuline punye jaganmandale
    candrarkakhyasarittatiparisare dhatra samaradhite | shrirange bhujagendrabhogashayane shete sada yah
    puman artatranaparayanah sa bhagavannarayano me gatih || 12|| vaktrendudyutimanditabjanayano gandollasatkundalah
    shrivatsorumanishriyaptahridayah svarnambaro yo bhujaih | shankham cakragadabhayani bibhrite padmanghriratyunnato
    hyartatranaparayanah sa bhagavannarayano me gatih || 13|| karmabrahmanidanavedanikaram hritva mahimandalam
    tyaktva nirmitamandiro'bhavadatho madhyemahasagaram | hantum somakananakam tamasuram matsyasvarupam
    dadha
  devanagari: दार्तत्राणपरायणः स भगवान्नारायणो मे गतिः ॥ ५॥ यत्पादाब्जनखोदकं त्रिजगतां पापौघविच्छेदनं
    यन्नामामृतपूरमस्तु पिबतां संसारसन्तारकम् । पाषाणोऽपि यदङ्घ्रितो मुनिव धू रूपं परं प्राप्तवान् आर्तत्राणपरायणः
    स भगवान्नारायणो मे गतिः ॥ ६॥ पित्रा भ्रातरमुत्तमासनगतं भक्तोत्तमः स ध्रुवो दृष्ट्वा तत्सममारुरुक्षुरुदितो
    मात्रावमानं गतः । यं गत्वा शरणं जगाम तपसा हेमाद्रिसिंहासनं ह्यार्तत्राणपरायणः स भगवान्नारायणो मे गतिः
    ॥ ७॥ योऽरक्षद्वसनादिभिर्विरहितं विप्रं कुचेलाभिधं दीनं दीनचकोरपालनविधुः श्रीशङ्खचक्रोज्ज्वलः । यज्जीर्णाम्बरमुष्टिमेयपृथुकानादाय
    भुक्त्वा क्षणात् आर्तत्राणपरायणः स भगवान्नारायणो मे गतिः ॥ ८॥ यं कल्याणगुणाभिरामममलं शास्त्राणि सञ्चक्षते
    । यस्मिन् योगयुते प्रतिष्ठितमिदं विश्वं वदन्त्यागमाः । यो योगीन्द्रमनःसरोरुहतमःप्रध्वंसने भानुमान्
    आर्तत्राणपरायणः स भगवान्नारायणो मे गतिः ॥ २॥ योऽत्रासीदरविन्दगर्भजनुषं ब्रह्माणमार्तिं गतं भीतं कैटभराक्षसेन
    मधुना कल्पान्तकाले महान् । हत्वा तौ मधुकैटभौ रणमुखे भक्तार्तिसंशोषणात् आर्तत्राणपरायणः स भगवान्नारायणो
    मे गतिः ॥ १०॥ यन्नामस्मरणादघौघरहितो विप्रः पुराजामिलः प्रायान्मुक्तिमशेषतो विरहितः संसारदावानलात्
    । सोऽयं भागवतोत्तमावन इति प्राप्तप्रतिष्ठोऽचिरात् आर्तत्राणपरायणः स भगवान्नारायणो मे गतिः ॥ ११॥ कावेरीहृदयाभिरामपुलिने
    पुण्ये जगन्मण्डले चन्द्रार्काख्यसरित्तटीपरिसरे धात्रा समाराधिते । श्रीरङ्गे भुजगेन्द्रभोगशयने शेते
    सदा यः पुमान् आर्तत्राणपरायणः स भगवान्नारायणो मे गतिः ॥ १२॥ वक्त्रेन्दुद्युतिमण्डिताब्जनयनो गण्डोल्लसत्कुण्डलः
    श्रीवत्सोरुमणिश्रियाप्तहृदयः स्वर्णाम्बरो यो भुजैः । शङ्खं चक्रगदाभयानि बिभृते पद्माङ्घ्रिरत्युन्नतो
    ह्यार्तत्राणपरायणः स भगवान्नारायणो मे गतिः ॥ १३॥ कर्मब्रह्मनिदानवेदनिकरं हृत्वा महीमण्डलं त्यक्त्वा
    निर्मितमन्दिरोऽभवदथो मध्येमहासागरम् । हन्तुं सोमकनानकं तमसुरं मत्स्यस्वरूपं दधा
