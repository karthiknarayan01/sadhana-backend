id: dattabhavasudharasastotram
category: stotram
name:
  english: dattabhavasudharasastotram
  devanagari: दत्तभावसुधारसस्तोत्रम्
content:
  english: shridatta bhavasudharasastotram shri datta bhavasudharasa stotram | dattatreyam paramasukhamayam
    vedageyam hyameyam yogidhyeyam hritanijabhayam svikritanekakayam | dushtagamyam vitatavijayam devadaityarshivandyam
    vande nityam vihitavinayam cavyayam bhavagamyam || 1|| dattatreya namo'stu te bhagavate papakshayam
    kurvate daridryam harate bhayam shamayate karunyamatanvate | bhaktanuddharate shivam ca dadate satkirtimatanvate
    bhutandravayate varam pradadate shreyah pate sadgate || 2|| ekam saubhagyajanakam tarakam lokanayakam
    | vishokam tratabhajakam namasye kamapurakam || 3|| nityam smarami te pade hatakhede sukhaprade |
    pradehi me shuddhabhavam bhavam yo varayeddrutam || 4|| samastasampatpradamartabamdhum samastakalyanadamastabamdhum
    | karunyasimdhum pranamami dattam yah shodhayatyashu malinacittam || 5|| samastabhutamtarabahyavarti
    yashcatriputro yaticakravarti | sukirtisamvyaptadigamtaralah sa patu mam nirjitabhaktakalah || 6||
    vyadhyadhidaridryabhayartiharta svaguptaye'nekashariradharta svadasabharta bahudha viharta kartapyakarta
    svavasho'riharta || 7|| sa canasuyatanayo'bhavadyo vishnuh svayam bhavikarakshanaya | guna yadiya
    ma hi buddhimadbhirganyamta akalpamapiha dhatra || 8|| na yatkatakshamritavrishtito'tra tishthanti
    tapah sakalah paratra | yah sadgatim sampradadati bhuma sa me'ntare tishthatu divyadhama || 9|| sa
    tvam prasidatrisutartiharin digambara sviyamanoviharin | dushta lipirya likhitatra dhatra karya tvaya
    sa'tishubha vidhatra || 10|| sarvamamgalasamyukta sarvaishvaryasamanvita | prasanne tvayi sarveshe
    kim kesham durlabham kuha || 11|| hardamdhatimiram hantum shuddhajnanaprakashaka | tvadamghrinakhamanikyadyutirevalamisha
    nah || 12|| svakripardrakatakshena vikshase cetsakriddhi mam | bhavishyami kritartho'tra patram capi
    sthitestava || 13|| kva ca mando varako'ham kva bhavanbhagavanprabhuh | athapi bhavadavesha bhagyavanasmi
    te drisha || 14|| vihitani maya nana patakani ca yadyapi | athapi te prasadena pavitro'ham na samshayah
    || 15|| svalilaya tvam hi jananpunasi tanme svalila shravanam prayaccha | tasyah shruteh sandravilocano'ham
    punami catmanamativa deva || 16|| purataste sphutam vacmi dosharashiraham kila | dosha mamamitah pamsuvrishtibindusama
    vibhoh || 17|| papiyasamaham mukhyastvam tu karunikagranih | dayaniyo na hi kvapi madanya iti bhati
    me || 18|| idrisham mam vilokyapi kripalo te mano yadi | na dravettarhi kim vacyamadrishtam me tavagratah
    || 19|| tvameva srishtavansarvandattatreya dayanidhe | vayam dinatarah putrastavakalpah svarakshane
    || 20|| jayatu jayatu datto devasanghabhipujyo jayatu jayatu bhadro bhadrado bhavukejyah | jayatu
    jayatu nityo nirmalajnanavedyo jayatu jayatu satyah satyasamdho'navadyah || 21|| yadyaham tava putrah
    syam pita mata tvameva me | dayastanyamritenashu matastvamabhishinca mam || 22|| ishabhinnanimittopadanatsrashturasya
    te | jagadyone suto naham datta mam paripahyatah || 23|| tava vatsasya me vakyam suktam va'suktamapyaho
    | kshantavyam me'paradhashca tvatto'nya na gatirhi me || 24|| ananyagatikasyasya balasya mama te pitah
    | na sarvathocitopeksha doshanam gananapi ca || 25|| ajnanitvadakalpatvaddosha mama pade pade | bhavanti
    kim karomisha karunavarunalaya || 26|| athapi me'paradhaishcedayasyantarvishadatam | padahatarbhakenapi
    mata rushyati kim bhuvi || 27|| rankamankagatam dinam tadayantam padena ca | mata tyajati kim balam
    pratyutashvasayatyaho || 28|| tadrisham mamakalpam cennashvasayasi bho prabho | ahaha bata dinasya
    tvam vina mama ka gatih || 29|| shishurnayam shathah svarthityapi nayatu te'ntaram | loke hi kshudhita
    balah smaranti nijamataram || 30|| jivanam bhinnayoh pitrorloka ekataracchishoh | tvam tubhayam datta
    mama ma'stu nirdayata mayi || 31|| stavanena na shakto'smi tvam prasadayitum prabho | brahmadyashcakitastatra
    mando'ham shaknuyam katham || 32|| datta tvadbalavakyani suktasuktani yani ca | tani svikuru sarvajna
    dayalo bhaktabhavana || 33|| ye tva sharanamapannah kritartha abhavanhi te | etadvicarya manasa datta
    tvam sharanam gatah || 34|| tvannishthastvatpara bhaktastava te sukhabhaginah | iti shastranurodhena
    datta tvam sharanam gatah || 35|| svabhaktananugrihnati bhagavan bhaktavatsalah | iti sancitya sancitya
    kathanciddharayamyasun || 36|| tvadbhaktastvadadhino'hamasmi tubhyam samarpitam | tanum mano dhanam
    capi kripam kuru mamopari || 37|| tvayi bhaktim naiva jane na jane'rcanapaddhatim | kritam na danadharmadi
    prasadam kuru kevalam || 38|| brahmacaryadi nacirnam nadhita vidhitah shrutih | garhasthyam vidhina
    datta na kritam tatprasida me || 39|| na sadhusangamo me'sti na kritam vriddhasevanam | na shastrashasanam
    datta kevalam tvam dayam kuru || 40|| jnate'pi dharme nahi me pravritti
  devanagari: श्रीदत्त भावसुधारसस्तोत्रम् श्री दत्त भावसुधारस स्तोत्रम् । दत्तात्रेयं परमसुखमयं वेदगेयं
    ह्यमेयं योगिध्येयं हृतनिजभयं स्वीकृतानेककायम् । दुष्टागम्यं विततविजयं देवदैत्यर्षिवन्द्यं वन्दे नित्यं
    विहितविनयं चाव्ययं भावगम्यम् ॥ १॥ दत्तात्रेय नमोऽस्तु ते भगवते पापक्षयं कुर्वते दारिद्र्यं हरते भयं
    शमयते कारुण्यमातन्वते । भक्तानुद्धरते शिवं च ददते सत्कीर्तिमातन्वते भूतान्द्रावयते वरं प्रददते श्रेयः
    पते सद्गते ॥ २॥ एकं सौभाग्यजनकं तारकं लोकनायकम् । विशोकं त्रातभजकं नमस्ये कामपूरकम् ॥ ३॥ नित्यं स्मरामि
    ते पादे हतखेदे सुखप्रदे । प्रदेहि मे शुद्धभावं भावं यो वारयेद्द्रुतम् ॥ ४॥ समस्तसम्पत्प्रदमार्तबंधुं
    समस्तकल्याणदमस्तबंधुम् । कारुण्यसिंधुं प्रणमामि दत्तं यः शोधयत्याशु मलीनचित्तम् ॥ ५॥ समस्तभूतांतरबाह्यवर्ती
    यश्चात्रिपुत्रो यतिचक्रवर्ती । सुकीर्तिसंव्याप्तदिगंतरालः स पातु मां निर्जितभक्तकालः ॥ ६॥ व्याध्याधिदारिद्र्यभयार्तिहर्ता
    स्वगुप्तयेऽनेकशरीरधर्ता स्वदासभर्ता बहुधा विहर्ता कर्ताप्यकर्ता स्ववशोऽरिहर्ता ॥ ७॥ स चानसूयातनयोऽभवद्यो
    विष्णुः स्वयं भाविकरक्षणाय । गुणा यदीया म हि बुद्धिमद्भिर्गण्यंत आकल्पमपीह धात्रा ॥ ८॥ न यत्कटाक्षामृतवृष्टितोऽत्र
    तिष्ठन्ति तापाः सकलाः परत्र । यः सद्गतिं सम्प्रददाति भूमा स मेऽन्तरे तिष्ठतु दिव्यधामा ॥ ९॥ स त्वं
    प्रसीदात्रिसुतार्तिहारिन् दिगम्बर स्वीयमनोविहारिन् । दुष्टा लिपिर्या लिखितात्र धात्रा कार्या त्वया
    साऽतिशुभा विधात्रा ॥ १०॥ सर्वमंगलसंयुक्त सर्वैश्वर्यसमन्वित । प्रसन्ने त्वयि सर्वेशे किं केषां दुर्लभं
    कुह ॥ ११॥ हार्दांधतिमिरं हन्तुं शुद्धज्ञानप्रकाशक । त्वदंघ्रिनखमाणिक्यद्युतिरेवालमीश नः ॥ १२॥ स्वकृपार्द्रकटाक्षेण
    वीक्षसे चेत्सकृद्धि माम् । भविष्यामि कृतार्थोऽत्र पात्रं चापि स्थितेस्तव ॥ १३॥ क्व च मन्दो वराकोऽहं
    क्व भवान्भगवान्प्रभुः । अथापि भवदावेश भाग्यवानस्मि ते दृशा ॥ १४॥ विहितानि मया नाना पातकानि च यद्यपि
    । अथापि ते प्रसादेन पवित्रोऽहं न संशयः ॥ १५॥ स्वलीलया त्वं हि जनान्पुनासि तन्मे स्वलीला श्रवणं प्रयच्छ
    । तस्याः श्रुतेः सान्द्रविलोचनोऽहं पुनामि चात्मानमतीव देव ॥ १६॥ पुरतस्ते स्फुटं वच्मि दोषराशिरहं किल
    । दोषा ममामिताः पांसुवृष्टिबिन्दुसमा विभोः ॥ १७॥ पापीयसामहं मुख्यस्त्वं तु कारुणिकाग्रणीः । दयनीयो
    न हि क्वापि मदन्य इति भाति मे ॥ १८॥ ईदृशं मां विलोक्यापि कृपालो ते मनो यदि । न द्रवेत्तर्हि किं वाच्यमदृष्टं
    मे तवाग्रतः ॥ १९॥ त्वमेव सृष्टवान्सर्वान्दत्तात्रेय दयानिधे । वयं दीनतराः पुत्रास्तवाकल्पाः स्वरक्षणे
    ॥ २०॥ जयतु जयतु दत्तो देवसङ्घाभिपूज्यो जयतु जयतु भद्रो भद्रदो भावुकेज्यः । जयतु जयतु नित्यो निर्मलज्ञानवेद्यो
    जयतु जयतु सत्यः सत्यसंधोऽनवद्यः ॥ २१॥ यद्यहं तव पुत्रः स्यां पिता माता त्वमेव मे । दयास्तन्यामृतेनाशु
    मातस्त्वमभिषिञ्च माम् ॥ २२॥ ईशाभिन्ननिमित्तोपादनात्स्रष्टुरस्य ते । जगद्योने सुतो नाहं दत्त मां परिपाह्यतः
    ॥ २३॥ तव वत्सस्य मे वाक्यं सूक्तं वाऽसूक्तमप्यहो । क्षन्तव्यं मेऽपराधश्च त्वत्तोऽन्या न गतिर्हि मे
    ॥ २४॥ अनन्यगतिकस्यास्य बालस्य मम ते पितः । न सर्वथोचितोपेक्षा दोषाणां गणनापि च ॥ २५॥ अज्ञानित्वादकल्पत्वाद्दोषा
    मम पदे पदे । भवन्ति किं करोमीश करुणावरुणालय ॥ २६॥ अथापि मेऽपराधैश्चेदायास्यन्तर्विषादताम् । पदाहतार्भकेणापि
    माता रुष्यति किं भुवि ॥ २७॥ रङ्कमङ्कगतं दीनं ताडयन्तं पदेन च । माता त्यजति किं बालं प्रत्युताश्वासयत्यहो
    ॥ २८॥ तादृशं मामकल्पं चेन्नाश्वासयसि भो प्रभो । अहहा बत दीनस्य त्वां विना मम का गतिः ॥ २९॥ शिशुर्नायं
    शठः स्वार्थीत्यपि नायातु तेऽन्तरम् । लोके हि क्षुधिता बालाः स्मरन्ति निजमातरम् ॥ ३०॥ जीवनं भिन्नयोः
    पित्रोर्लोक एकतराच्छिशोः । त्वं तूभयं दत्त मम माऽस्तु निर्दयता मयि ॥ ३१॥ स्तवनेन न शक्तोऽस्मि त्वां
    प्रसादयितुं प्रभो । ब्रह्माद्याश्चकितास्तत्र मन्दोऽहं शक्नुयां कथम् ॥ ३२॥ दत्त त्वद्बालवाक्यानि सूक्तासूक्तानि
    यानि च । तानि स्वीकुरु सर्वज्ञ दयालो भक्तभावन ॥ ३३॥ ये त्वा शरणमापन्नाः कृतार्था अभवन्हि ते । एतद्विचार्य
    मनसा दत्त त्वां शरणं गतः ॥ ३४॥ त्वन्निष्ठास्त्वत्परा भक्तास्तव ते सुखभागिनः । इति शास्त्रानुरोधेन
    दत्त त्वां शरणं गतः ॥ ३५॥ स्वभक्ताननुगृह्णाति भगवान् भक्तवत्सलः । इति सञ्चित्य सञ्चित्य कथञ्चिद्धारयाम्यसून्
    ॥ ३६॥ त्वद्भक्तस्त्वदधीनोऽहमस्मि तुभ्यं समर्पितम् । तनुं मनो धनं चापि कृपां कुरु ममोपरि ॥ ३७॥ त्वयि
    भक्तिं नैव जाने न जानेऽर्चनपद्धतिम् । कृतं न दानधर्मादि प्रसादं कुरु केवलम् ॥ ३८॥ ब्रह्मचर्यादि नाचीर्णं
    नाधीता विधितः श्रुतिः । गार्हस्थ्यं विधिना दत्त न कृतं तत्प्रसीद मे ॥ ३९॥ न साधुसङ्गमो मेऽस्ति न कृतं
    वृद्धसेवनम् । न शास्त्रशासनं दत्त केवलं त्वं दयां कुरु ॥ ४०॥ ज्ञातेऽपि धर्मे नहि मे प्रवृत्ति
