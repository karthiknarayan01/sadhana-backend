id: vande-bharata-mataram-vada-bharata
category: stotram
name:
  english: Vande Bharata Mataram Vada Bharata
content:
  english: vande mataram vande mataram vande mataram || janmabhuriyam viravaranam tyagadhananam dhiranam
    matribhumaye lokahitaya ca nityasamarpitacittanam | jitakopanam kritakrityanam vittam trinavad drishtavatam
    matrisevanadatmajivane sarthakatamanitavatam || || grame grame karmadeshikastattvavedino dharmaratah
    | arthasancayastyagahetuko dharmasammatah kama iha | nashvarabuddhih kshanaparivartini kaye atmanyadaradhih
    jato yatra hi svasya janmana dhanyam manyata atmanam || || matastvatto vittam cittam svatvam pratibha
    dehabalam naham karta nihsprihata mama karmaphale | arpitametajjivanapushpam matastava shubhapadapale
    nanyo mantro nanyacintanam nanyaddeshahitaddhi rite ||
  devanagari: वन्दे मातरं वन्दे मातरं वन्दे मातरम् ॥ जन्मभूरियं वीरवराणां त्यागधनानां धीराणां मातृभूमये
    लोकहिताय च नित्यसमर्पितचित्तानाम् । जितकोपानां कृतकृत्यानां वित्तं तृणवद् दृष्टवतां मातृसेवनादात्मजीवने
    सार्थकतामानीतवताम् ॥ ॥ ग्रामे ग्रामे कर्मदेशिकास्तत्त्ववेदिनो धर्मरताः । अर्थसञ्चयस्त्यागहेतुको धर्मसम्मतः
    काम इह । नश्वरबुद्धिः क्षणपरिवर्तिनि काये आत्मन्यादरधीः जातो यत्र हि स्वस्य जन्मना धन्यं मन्यत आत्मानम्
    ॥ ॥ मातस्त्वत्तो वित्तं चित्तं स्वत्वं प्रतिभा देहबलं नाहं कर्ता निःस्पृहता मम कर्मफले । अर्पितमेतज्जीवनपुष्पं
    मातस्तव शुभपादपले नान्यो मन्त्रो नान्यचिन्तनं नान्यद्देशहिताद्धि ॠते ॥
