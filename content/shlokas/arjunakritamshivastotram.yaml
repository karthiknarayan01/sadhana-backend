id: arjunakritamshivastotram
category: stotram
name:
  english: arjunakritamshivastotram
  devanagari: अर्जुनकृतंशिवस्तोत्रम्
content:
  english: arjunakritam shivastotram arjuna uvaca | namaste devadevaya namah kailasavasine | sadashiva
    namastubhyam pancavaktraya te namah || 34|| kapardine namastubhyam trinetraya namo'stu te | manah
    prasannarupaya sahasravadanaya ca || 35|| nilakantha namaste'stu sadyojataya vai namah | vrishadhvaja
    namaste'stu vamangagirijaya ca || 36|| dashadosha namastubhyannamaste paramatmane | damarukapalahastaya
    namaste mundamaline || 37|| shuddhasphatikasankasha shuddhakarpuravarshmane | pinakapanaye tubhyam
    trishulavaradharine || 38|| vyaghracarmottariyaya gajambaravidharine | nagangaya namastubhyam gangadhara
    namo'stu te || 39|| supadaya namaste'stu araktacaranaya ca | nandyadiganasevyaya ganeshaya ca te namah
    || 40|| namo ganesharupaya kartikeyanugaya ca | bhaktidaya ca bhaktanam muktidaya namo namah || 41||
    agunaya namaste'stu sagunaya namo namah | arupaya sarupaya sakalayakalaya ca || 42|| namah kiratarupaya
    madanugrahakarine | yuddhapriyaya viranam nanalilanukarine || 43|| yatkinciddrishyate rupam tattejastavakam
    smritam | cidrupastvam trilokeshu ramase'nvayabhedatah || 44|| gunanam te na sankhyasti yatha bhurajasamiha
    | akashe tarakanam hi kananam vrishtyapamapi || 45|| na te gunastu sankhyatum veda vai sambhavanti
    hi | mandabuddhiraham natha varnayami katham punah || 46|| so'si yo'si namaste'stu kripam kartumiharhasi
    | daso'ham te maheshana svami tvam me maheshvara || 47|| iti shivapurane shatarudrasamhitayam ekacatvarimsha
  devanagari: अर्जुनकृतं शिवस्तोत्रम् अर्जुन उवाच । नमस्ते देवदेवाय नमः कैलासवासिने । सदाशिव नमस्तुभ्यं
    पञ्चवक्त्राय ते नमः ॥ ३४॥ कपर्दिने नमस्तुभ्यं त्रिनेत्राय नमोऽस्तु ते । मनः प्रसन्नरूपाय सहस्रवदनाय
    च ॥ ३५॥ नीलकण्ठ नमस्तेऽस्तु सद्योजाताय वै नमः । वृषध्वज नमस्तेऽस्तु वामाङ्गगिरिजाय च ॥ ३६॥ दशदोष नमस्तुभ्यन्नमस्ते
    परमात्मने । डमरुकपालहस्ताय नमस्ते मुण्डमालिने ॥ ३७॥ शुद्धस्फटिकसङ्काश शुद्धकर्पूरवर्ष्मणे । पिनाकपाणये
    तुभ्यं त्रिशूलवरधारिणे ॥ ३८॥ व्याघ्रचर्मोत्तरीयाय गजाम्बरविधारिणे । नागाङ्गाय नमस्तुभ्यं गङ्गाधर नमोऽस्तु
    ते ॥ ३९॥ सुपादाय नमस्तेऽस्तु आरक्तचरणाय च । नन्द्यादिगणसेव्याय गणेशाय च ते नमः ॥ ४०॥ नमो गणेशरूपाय
    कार्तिकेयानुगाय च । भक्तिदाय च भक्तानां मुक्तिदाय नमो नमः ॥ ४१॥ अगुणाय नमस्तेऽस्तु सगुणाय नमो नमः
    । अरूपाय सरूपाय सकलायाकलाय च ॥ ४२॥ नमः किरातरूपाय मदनुग्रहकारिणे । युद्धप्रियाय वीराणां नानालीलानुकारिणे
    ॥ ४३॥ यत्किञ्चिद्दृश्यते रूपं तत्तेजस्तावकं स्मृतम् । चिद्रूपस्त्वं त्रिलोकेषु रमसेऽन्वयभेदतः ॥ ४४॥
    गुणानां ते न सङ्ख्यास्ति यथा भूरजसामिह । आकाशे तारकाणां हि कणानां वृष्ट्यपामपि ॥ ४५॥ न ते गुणास्तु
    सङ्ख्यातुं वेदा वै सम्भवन्ति हि । मन्दबुद्धिरहं नाथ वर्णयामि कथं पुनः ॥ ४६॥ सोऽसि योऽसि नमस्तेऽस्तु
    कृपां कर्तुमिहार्हसि । दासोऽहं ते महेशान स्वामी त्वं मे महेश्वर ॥ ४७॥ इति शिवपुराणे शतरुद्रसंहितायां
    एकचत्वारिंशा
