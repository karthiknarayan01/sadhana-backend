id: mantrabhajanadinirupanam
category: mantra
name:
  english: mantrabhajanadinirupanam
  devanagari: मन्त्रभजनादिनिरूपणम्
content:
  english: anadishrikrishnanarayana krishna shriyahpate | radhapate parabrahma gopipate jayapate || 106||
    lalitashripate prajnapate padmavatipate | sukhadashripate lakshmipate shrimanikipate || 107|| hamsagarudavaranaturagadhipate
    prabho | satampate satisadhvipate sarvapate vibho || 108|| bhagavan pundarikaksha taraya'sman bhavarnavat
    | dvaparadghorarupadvai cantimasamayatmakat
  devanagari: अनादिश्रीकृष्णनारायण कृष्ण श्रियःपते । राधापते परब्रह्म गोपीपते जयापते ॥ १०६॥ ललिताश्रीपते
    प्रज्ञापते पद्मावतीपते । सुखदाश्रीपते लक्ष्मीपते श्रीमाणिकीपते ॥ १०७॥ हंसगरुडवारणतुरगाधिपते प्रभो
    । सताम्पते सतीसाध्वीपते सर्वपते विभो ॥ १०८॥ भगवन् पुण्डरीकाक्ष तारयाऽस्मान् भवार्णवात् । द्वापराद्घोररूपाद्वै
    चान्तिमसमयात्मकात्
meaning: {}
