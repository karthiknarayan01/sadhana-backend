id: sukra-ashtottara-sata-namavali
category: stotram
name:
  english: Sukra Ashtottara Sata Namavali
content:
  english: om shukraya namah | om shucaye namah | om shubhagunaya namah | om shubhadaya namah | om shubhalakshanaya
    namah | om shobhanakshaya namah | om shubhrarupaya namah | om shuddhasphatikabhasvaraya namah | om
    dinartiharakaya namah | om daityagurave namah || || om devabhivanditaya namah | om kavyasaktaya namah
    | om kamapalaya namah | om kavaye namah | om kalyanadayakaya namah | om bhadramurtaye namah | om bhadragunaya
    namah | om bhargavaya namah | om bhaktapalanaya namah | om bhogadaya namah || || om bhuvanadhyakshaya
    namah | om bhuktimuktiphalapradaya namah | om carushilaya namah | om carurupaya namah | om carucandranibhananaya
    namah | om nidhaye namah | om nikhilashastrajnaya namah | om nitividyadhurandharaya namah | om sarvalakshanasampannaya
    namah | om sarvavagunavarjitaya namah || || om samanadhikanirmuktaya namah | om sakalagamaparagaya
    namah | om bhrigave namah | om bhogakaraya namah | om bhumisurapalanatatparaya namah | om manasvine
    namah | om manadaya namah | om manyaya namah | om mayatitaya namah | om mahashayaya namah || || om
    baliprasannaya namah | om abhayadaya namah | om baline namah | om balaparakramaya namah | om bhavapashaparityagaya
    namah | om balibandhavimocakaya namah | om ghanashayaya namah | om ghanadhyakshaya namah | om kambugrivaya
    namah | om kaladharaya namah || || om karunyarasasampurnaya namah | om kalyanagunavardhanaya namah
    | om shvetambaraya namah | om shvetavapushe namah | om caturbhujasamanvitaya namah | om akshamaladharaya
    namah | om acintyaya namah | om akshinagunabhasuraya namah | om nakshatraganasancaraya namah | om
    nayadaya namah || || om nitimargadaya namah | om varshapradaya namah | om hrishikeshaya namah | om
    kleshanashakaraya namah | om kavaye namah | om cintitarthapradaya namah | om shantamataye namah |
    om cittasamadhikrite namah | om adhivyadhiharaya namah | om bhurivikramaya namah || || om punyadayakaya
    namah | om puranapurushaya namah | om pujyaya namah | om puruhutadisannutaya namah | om ajeyaya namah
    | om vijitarataye namah | om vividhabharanojjvalaya namah | om kundapushpapratikashaya namah | om
    mandahasaya namah | om mahamataye namah || || om muktaphalasamanabhaya namah | om muktidaya namah
    | om munisannutaya namah | om ratnasimhasanarudhaya namah | om rathasthaya namah | om rajataprabhaya
    namah | om suryapragdeshasancaraya namah | om surashatrusuhride namah | om kavaye namah | om tulavrishabharashishaya
    namah || || om durdharaya namah | om dharmapalakaya namah | om bhagyadaya namah | om bhavyacaritraya
    namah | om bhavapashavimocakaya namah | om gaudadesheshvaraya namah | om goptre namah | om gunine
    namah | om gunavibhushanaya namah | om jyeshthanakshatrasambhutaya namah || || om jyeshthaya namah
    | om shreshthaya namah | om shucismitaya namah | om apavargapradaya namah | om anantaya namah | om
    santanaphaladayakaya namah | om sarvaishvaryapradaya namah | om sarvagirvanaganasannutaya namah ||
