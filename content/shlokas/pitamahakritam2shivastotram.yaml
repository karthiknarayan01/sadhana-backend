id: pitamahakritam2shivastotram
category: stotram
name:
  english: pitamahakritam2shivastotram
  devanagari: पितामहकृतं२शिवस्तोत्रम्
content:
  english: pitamahakritam 2 shivastotram shripitamaha uvaca | prasida devadevesha prasida parameshvara
    | prasida jagatam natha prasidanandadavyaya || 122|| pancasya rudrarudraya pancashatkotimurtaye |
    atmatrayopavishtaya vidyatattvaya te namah || 123|| shivaya shivatattvaya aghoraya namo namah | aghorashtakatattvaya
    dvadashatmasvarupine || 124|| vidyutkotipratikashamashtakasham sushobhanam | rupamasthaya loke'smin
    samsthitaya shivatmane || 125|| agnivarnaya raudraya ambikardhasharirine | dhavalashyamaraktanam muktidayamaraya
    ca || 126|| jyeshthaya rudrarupaya somaya varadaya ca | trilokaya tridevaya vashatkaraya vai namah
    || 127|| madhye gaganarupaya gaganasthaya te namah | ashtakshetrashtarupaya ashtatattvaya te namah
    || 128|| caturdha ca caturdha ca caturdha samsthitaya ca | pancadha pancadha caiva pancamantrasharirine
    || 129|| catuhshashtiprakaraya akaraya namo namah | dvatrimshattattvarupaya ukaraya namo namah ||
    130|| shodashatmasvarupaya makaraya namo namah | ashtadha''tmasvarupaya ardhamatra''tmane namah ||
    131|| om karaya namastubhyam caturdha samsthitaya ca | gaganeshaya sahasrashirase svargeshaya namo
    namah || 132|| saptalokaya patalanarakeshaya vai namah | ashtakshetrashtarupaya paratparataraya ca
    || 133|| sahasrashirase tubhyam sahasraya ca te namah | sahasrapadayuktaya sharvaya parameshthine
    || 134|| navatmatattvarupaya navashtatmatmashaktaye | punarashtaprakashaya tathashtashtakamurtaye
    || 135|| catuhshashtyatmatattvaya punarashtavidhaya te | gunashtakavritayaiva gunine nirgunaya te
    || 136|| mulastaya namastubhyam shasvatasthanavasine | nabhimandalasamsthaya hridi nissvanakarine
    || 137|| kandhare ca sthitayaiva talurandhrasthitaya ca | bhrumadhye samsthitayaiva nadamadhye sthitaya
    ca || 138|| candrabimbasthitayaiva shivaya shivarupine | vahnisomarkarupaya shattrimshacchaktirupine
    || 139|| tridha samvritya lokanvai prasuptabhujagatmane | triprakaram stitayaiva tretagnimayarupine
    || 140|| sadashivaya shantaya maheshaya pinakine | sarvajnaya sharanyaya sadyojataya vai namah ||
    141|| aghoraya namastubhyam vamadevaya te namah | tatpurushaya namo'stu ishanaya namo namah || 142||
    namastrimshatprakashaya shantatitaya vai namah | ananteshaya sukshmaya uttamaya namo'stu te || 143||
    ekakshaya namastubhyamekarudraya te namah | namastrimurtaye tubhyam shrikanthaya shikhandine || 144||
    anantasanasamsthaya anantayantakarine | vimalaya vishalaya vimalangaya te namah || 145|| vimalasanasamsthaya
    vimalarthartharupine | yogapithantarasthaya yogine yogadayine || 146|| yoginam hridi samsthaya sada
    nivarashukavat | pratyaharaya te nityam pratyahararataya te || 147|| pratyahararatanam ca pratisthanasthitaya
    ca | dharanayai namastubhyam dharanabhirataya te || 148|| dharanabhyasayuktanam purastatsamsthitaya
    ca | dhyanaya dhyanarupaya dhyanagamyaya te namah || 149|| dhyeyaya dhyeyagamyaya dhyeyadhyanaya te
    namah | dhyeyanamapi dhyeyaya namo dhyeyatamaya te || 150|| samadhanabhigamyaya samadhanaya te namah
    | samadhanaratanam tu nirvikalpartharupine || 151|| dagdhvoddhritam sarvamidam tvayadya jagattrayam
    rudra purutrayam hi | kastotumicchetkathamidrisham tvam stoshyeha tushtaya shivaya tubhyam || 152||
    bhaktya ca tushtyadbhutadarshanacca martya amartya api devadeva | ete ganah siddhaganaih pranamam
    kurvanti devesha ganesha tubhyam || 153|| nirikshanadeva vibho'si dagdhum puratrayam caiva jagattrayam
    ca | lilalasenambikaya kshanena dagdham kileshushca tadatha muktah || 154|| krito rathashcaishuvarashca
    shubhram sharasanam te tripurakshayaya | anekayatnaishca mayatha tubhyam phalam na drishtam surasiddhasanghaih
    || 155|| ratho rathi devavaro harishca rudrah svayam shakrapitamahau ca | tvameva sarve bhagavan katham
    tu stoshye hyatoshyam pranipatya murdhna || 156|| anantapadastvamanantabahuranantamurdhantakarah shivashca
    | anantamurtih kathamidrisham tvam teshye hyatoshyam kathamidrisham tvam || 157|| namo namah sarvavide
    shivaya rudraya sharvaya bhavaya tubhyam | stulaya sukshmaya susukshmasukshmasukshmaya sukshmarthavide
    vidhatre || 158|| srashtre namah sarvasurasuranam bhartre ca hartre jagatam vidhatre | netre suranamasureshvaranam
    datre prashastre mama sarvashastre || 159|| vedantavedyaya sunirmalaya vedarthavidbhih satatam stutaya
    | vedatmarupaya bhavaya tubhyamantaya madhyaya sumadhyamaya || 160|| adyantashunyaya ca samsthitaya
    tatha tvashunyaya ca lingine ca | alingine lingamayaya tubhyam lingaya vedadimayaya sakshat || 161||
    rudraya murdhananikrintanaya mamadidevasya ca yajnamurteh | vidhvantabhangam mama kartumisha drishtvaiva
    bhumau karajagrakotya || 162|| aho vicitram tava devadeva viceshtitam sarvasurasuresha | dehiva devaih
    saha devakaryam karishyase nirgunarupatattva || 163|| ekam sthulam sukshmamekam susukshmam murtamurtam
    murtamekam hyamurtam | ekam drishtam vanmayam caikamisham dhyeyam caikam tattvamatradbhutam te ||
    164|| svapne drishtam yatpadartham hyalakshyam drishtam nunam bhati manye na capi | murtirno vai devamishana
    devairlakshya yatnairapyalakshyam katham tu || 165|| divyah kva devesha bhavatprabhavo vayam kva bhaktih
    kva ca te stutishca | tathapi bhaktya vilapantamisha pitamaham mam bhagavankshamasva || 166|| suta
    uvaca | ya imam sha
  devanagari: पितामहकृतं २ शिवस्तोत्रम् श्रीपितामह उवाच । प्रसीद देवदेवेश प्रसीद परमेश्वर । प्रसीद जगतां
    नाथ प्रसीदानन्ददाव्यय ॥ १२२॥ पञ्चास्य रुद्ररुद्राय पञ्चाशत्कोटिमूर्तये । आत्मत्रयोपविष्टाय विद्यातत्त्वाय
    ते नमः ॥ १२३॥ शिवाय शिवतत्त्वाय अघोराय नमो नमः । अघोराष्टकतत्त्वाय द्वादशात्मस्वरूपिणे ॥ १२४॥ विद्युत्कोटिप्रतीकाशमष्टकाशं
    सुशोभनम् । रूपमास्थाय लोकेऽस्मिन् संस्थिताय शिवात्मने ॥ १२५॥ अग्निवर्णाय रौद्राय अम्बिकार्धशरीरिणे
    । धवलश्यामरक्तानां मुक्तिदायामराय च ॥ १२६॥ ज्येष्ठाय रुद्ररूपाय सोमाय वरदाय च । त्रिलोकाय त्रिदेवाय
    वषट्काराय वै नमः ॥ १२७॥ मध्ये गगनरूपाय गगनस्थाय ते नमः । अष्टक्षेत्राष्टरूपाय अष्टतत्त्वाय ते नमः
    ॥ १२८॥ चतुर्धा च चतुर्धा च चतुर्धा संस्थिताय च । पञ्चधा पञ्चधा चैव पञ्चमन्त्रशरीरिणे ॥ १२९॥ चतुःषष्टिप्रकाराय
    अकाराय नमो नमः । द्वात्रिंशत्तत्त्वरूपाय उकाराय नमो नमः ॥ १३०॥ षोडशात्मस्वरूपाय मकाराय नमो नमः । अष्टधाऽऽत्मस्वरूपाय
    अर्धमात्राऽऽत्मने नमः ॥ १३१॥ ॐ काराय नमस्तुभ्यं चतुर्धा संस्थिताय च । गगनेशाय सहस्रशिरसे स्वर्गेशाय
    नमो नमः ॥ १३२॥ सप्तलोकाय पातालनरकेशाय वै नमः । अष्टक्षेत्राष्टरूपाय परात्परतराय च ॥ १३३॥ सहस्रशिरसे
    तुभ्यं सहस्राय च ते नमः । सहस्रपादयुक्ताय शर्वाय परमेष्ठिने ॥ १३४॥ नवात्मतत्त्वरूपाय नवाष्टात्मात्मशक्तये
    । पुनरष्टप्रकाशाय तथाष्टाष्टकमूर्तये ॥ १३५॥ चतुःषष्ट्यात्मतत्त्वाय पुनरष्टविधाय ते । गुणाष्टकवृतायैव
    गुणिने निर्गुणाय ते ॥ १३६॥ मूलस्ताय नमस्तुभ्यं शास्वतस्थानवासिने । नाभिमण्डलसंस्थाय हृदि निस्स्वनकारिणे
    ॥ १३७॥ कन्धरे च स्थितायैव तालुरन्ध्रस्थिताय च । भ्रूमध्ये संस्थितायैव नादमध्ये स्थिताय च ॥ १३८॥ चन्द्रबिम्बस्थितायैव
    शिवाय शिवरूपिणे । वह्निसोमार्करूपाय षट्त्रिंशच्छक्तिरूपिणे ॥ १३९॥ त्रिधा संवृत्य लोकान्वै प्रसुप्तभुजगात्मने
    । त्रिप्रकारं स्तितायैव त्रेताग्निमयरूपिणे ॥ १४०॥ सदाशिवाय शान्ताय महेशाय पिनाकिने । सर्वज्ञाय शरण्याय
    सद्योजाताय वै नमः ॥ १४१॥ अघोराय नमस्तुभ्यं वामदेवाय ते नमः । तत्पुरुषाय नमोऽस्तु ईशानाय नमो नमः ॥
    १४२॥ नमस्त्रिंशत्प्रकाशाय शान्तातीताय वै नमः । अनन्तेशाय सूक्ष्माय उत्तमाय नमोऽस्तु ते ॥ १४३॥ एकाक्षाय
    नमस्तुभ्यमेकरुद्राय ते नमः । नमस्त्रिमूर्तये तुभ्यं श्रीकण्ठाय शिखण्डिने ॥ १४४॥ अनन्तासनसंस्थाय अनन्तायान्तकारिणे
    । विमलाय विशालाय विमलाङ्गाय ते नमः ॥ १४५॥ विमलासनसंस्थाय विमलार्थार्थरूपिणे । योगपीठान्तरस्थाय योगिने
    योगदायिने ॥ १४६॥ योगिनां हृदि संस्थाय सदा नीवारशूकवत् । प्रत्याहाराय ते नित्यं प्रत्याहाररताय ते ॥
    १४७॥ प्रत्याहाररतानां च प्रतिस्थानस्थिताय च । धारणायै नमस्तुभ्यं धारणाभिरताय ते ॥ १४८॥ धारणाभ्यासयुक्तानां
    पुरस्तात्संस्थिताय च । ध्यानाय ध्यानरूपाय ध्यानगम्याय ते नमः ॥ १४९॥ ध्येयाय ध्येयगम्याय ध्येयध्यानाय
    ते नमः । ध्येयानामपि ध्येयाय नमो ध्येयतमाय ते ॥ १५०॥ समाधानाभिगम्याय समाधानाय ते नमः । समाधानरतानां
    तु निर्विकल्पार्थरूपिणे ॥ १५१॥ दग्ध्वोद्धृतं सर्वमिदं त्वयाद्य जगत्त्रयं रुद्र पुरुत्रयं हि । कस्तोतुमिच्छेत्कथमीदृशं
    त्वां स्तोष्येह तुष्टाय शिवाय तुभ्यम् ॥ १५२॥ भक्त्या च तुष्ट्याद्भुतदर्शनाच्च मर्त्या अमर्त्या अपि
    देवदेव । एते गणाः सिद्धगणैः प्रणामं कुर्वन्ति देवेश गणेश तुभ्यम् ॥ १५३॥ निरीक्षणादेव विभोऽसि दग्धुं
    पुरत्रयं चैव जगत्त्रयं च । लीलालसेनाम्बिकया क्षणेन दग्धं किलेषुश्च तदाथ मुक्तः ॥ १५४॥ कृतो रथश्चैषुवरश्च
    शुभ्रं शरासनं ते त्रिपुरक्षयाय । अनेकयत्नैश्च मयाथ तुभ्यं फलं न दृष्टं सुरसिद्धसङ्घैः ॥ १५५॥ रथो रथी
    देववरो हरिश्च रुद्रः स्वयं शक्रपितामहौ च । त्वमेव सर्वे भगवन् कथं तु स्तोष्ये ह्यतोष्यं प्रणिपत्य
    मूर्ध्ना ॥ १५६॥ अनन्तपादस्त्वमनन्तबाहुरनन्तमूर्धान्तकरः शिवश्च । अनन्तमूर्तिः कथमीदृशं त्वां तेष्ये
    ह्यतोष्यं कथमीदृशं त्वाम् ॥ १५७॥ नमो नमः सर्वविदे शिवाय रुद्राय शर्वाय भवाय तुभ्यम् । स्तूलाय सूक्ष्माय
    सुसूक्ष्मसूक्ष्मसूक्ष्माय सूक्ष्मार्थविदे विधात्रे ॥ १५८॥ स्रष्ट्रे नमः सर्वसुरासुराणां भर्त्रे च
    हर्त्रे जगतां विधात्रे । नेत्रे सुराणामसुरेश्वराणां दात्रे प्रशास्त्रे मम सर्वशास्त्रे ॥ १५९॥ वेदान्तवेद्याय
    सुनिर्मलाय वेदार्थविद्भिः सततं स्तुताय । वेदात्मरूपाय भवाय तुभ्यमन्ताय मध्याय सुमध्यमाय ॥ १६०॥ आद्यन्तशून्याय
    च संस्थिताय तथा त्वशून्याय च लिङ्गिने च । अलिङ्गिने लिङ्गमयाय तुभ्यं लिङ्गाय वेदादिमयाय साक्षात् ॥
    १६१॥ रुद्राय मूर्धाननिकृन्तनाय ममादिदेवस्य च यज्ञमूर्तेः । विध्वान्तभङ्गं मम कर्तुमीश दृष्ट्वैव भूमौ
    करजाग्रकोट्या ॥ १६२॥ अहो विचित्रं तव देवदेव विचेष्टितं सर्वसुरासुरेश । देहीव देवैः सह देवकार्यं करिष्यसे
    निर्गुणरूपतत्त्व ॥ १६३॥ एकं स्थूलं सूक्ष्ममेकं सुसूक्ष्मं मूर्तामूर्तं मूर्तमेकं ह्यमूर्तम् । एकं
    दृष्टं वाङ्मयं चैकमीशं ध्येयं चैकं तत्त्वमत्राद्भुतं ते ॥ १६४॥ स्वप्ने दृष्टं यत्पदार्थं ह्यलक्ष्यं
    दृष्टं नूनं भाति मन्ये न चापि । मूर्तिर्नो वै देवमीशान देवैर्लक्ष्या यत्नैरप्यलक्ष्यं कथं तु ॥ १६५॥
    दिव्यः क्व देवेश भवत्प्रभावो वयं क्व भक्तिः क्व च ते स्तुतिश्च । तथापि भक्त्या विलपन्तमीश पितामहं
    मां भगवन्क्षमस्व ॥ १६६॥ सूत उवाच । य इमं श
