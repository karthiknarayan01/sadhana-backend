id: viththalahridayam
category: hridaya
name:
  english: viththalahridayam
  devanagari: विठ्ठलहृदयम्
content:
  english: shadaganyasah || atha dhyanam om shrim klim prahasitamukhacandram prollasatpurnabimbam pranamadabhayahastam
    carunilambudabham | samapadakamaniyam tattvabodhavagamyam sadayavaradadevam viththalam tam namami
    || 29|| klim shrim om om shrim klim || pandurangah shikham patu murdhanam patu viththalah | mastakam
    madhavah patu tilakam patu shrikarah || 30|| bhargah patu bhuvormadhye locane vishnurojasa | drishtim
    sudarshanah patu shrotre patu digambarah || 31|| nasagram srishtisaundarya oshthau patu sudharnavah
    | dantan dayanidhih patu jihvam me vedavallabhah || 32|| taludesham harih patu rasanam gorasapriyah
    | cibukam cinmayah patu grivam me garudadhvajah || 33|| kantham tu kambukanthashca skandhau patu mahabalah
    | bhujau giridharah patu bahu me madhusudanah || 34|| kurparau kripayavishtah karau me kamalapatih
    | aguliracyutah patu nakhani narakesari || 35|| vakshah shrilanchanah patu stanau me stanalalasah
    | hridayam shrihrishikesha udaram paramamritah || 36|| nabhim me padmanabhashca kukshim brahayadanayakah
    | katim patu katikaro jaghanam tu janardanah || 37|| shishnam patu smaradhisho vrishane vrishabhah
    patih | guhyam guhyatarah patu uru paturuvikramah || 38|| janu patu jagannatho janghe me manamohanah
    | gulphau patu ganadhishah padau patu trivikramah || 39|| shariram cakhilam patu naranarayano harih
    | agre hyagratarah patu dakshine dakshakapriyah || 40|| prishthe pushtikarah patu vame me vasavaprabhuh
    | purve purvaparah patu agneyyam cagnirakshakah || 41|| dakshine dikshitarthashca nairrityamritunayakah
    | pashcime varunadhisho vayavye vatajapatih || 42|| uttare dhritakhadgashca ishanye patu ishvarah
    | uparishtattu bhagavanantarikshe cidambarah || 43|| bhutale dharaninathah patale kurmanayakah | svarge
    patu suredrendro brahmande brahmanaspatih || 44|| atavyam nriharih patu jivane vishvajivanah | marge
    patu manogamyah sthane patu sthirasanah || 45|| sabahyabhyantaram patu pundarikavarapriyah | vishnurme
    vishayan patu vasanah patu vamanah || 46|| karta karmendriyam patu jnata jnanendriyam sada | pranan
    patu prananatha atmaramo manadishu || 47|| jagatim me jagadbrahma svapnam patu sutejakah | sushuptim
    me samadhishasturyam patu munipriyah || 48|| bharyam patu ramakantah putranpatu prajanidhih | kanyam
    me karunanatho bandhavanbhaktavatsalah || 49|| dhanam patu dhanadhyaksho dhanyam vishvakutumbakah
    | pashunme palakah patu vidyam patu kalanidhih || 50|| vacaspatih patu vade sabhayam vishvamohanah
    | kamakrodhodbhavatpatu purnakamo manoramah || 51|| vastram ratnam bhushanam ca nama rupam kulam gaham
    | sarvam sarvatmakah patu shuddhabrahmaparatparah || 52|| kli shrim om om shri klim | vishtalam murdhni
    vinyasya lalate shrikaram nyaset | pandurangam bhruvormadhye netrayorvyapakam nyaset || 53|| karnayornigamartham
    ca gallayorvallabham nyaset | nasikayam nyasetkrishnam mukhe vai madhavam nyaset || 54|| oshthayormuralikantam
    dantapanktyam suhasakam | rasanayam rasadhisham jihvaragre kirtanam nyaset || 55|| kanthe nyasenmahavishnum
    skandhayoh kamalapatim | bahvorbalanujam nyasya kare cakradharam nyaset || 56|| panitale padmadharam
    karagre varadabhayam | vakshahsthale varenyam ca hridaye shriharim nyaset || 1 7|| udare vishvabhartaram
    nabhau nabhikaram nyaset | katyam nyasetkriyatitamurau tu uddhavapriyam || 58|| janudvaye nyasecchaktim
    padayoh pavanam nyaset | sabahyabhyantaram nyasya devadevam jagadgurum || 59|| klim shrim om om shrim
    klim | vishthalaya namastubhyam namo vijnanahetave | vishnujishnusvarupaya shrivishnave namo namah
    || 60|| namah pundarikakshaya purnabimbatmabhe namah | namaste pandurangaya pavanaya namo namah ||
    61|| namah purnaprakashaya namaste purnatejase | purnaishvaryasvarupaya purnajnanatmane namah || 62||
    saccidanandakandaya namo'nantasukhatmane | namo'nantaya shantaya shriramaya namo numah || 63|| namo
    jyotihsvarupaya namo jyotirmayatmane | namo jyotihprakashaya sarvotkrishtatmane namah || 64|| om namobrahmarupaya
    nama omnkaramurtaye | nirvikalpaya satyaya shuddhasattvatmane namah || 65|| mahadbrahma namaste'stu
    satyasankalpahetave | namah srishtiprakashaya gunasamyayate namah || 66|| brahmavishnumaheshaya nanavarnatmarupine
    | sadoditaya shuddhaya gunatitaya te namah || 67|| namah sahasranamne ca namah sahasrarupine | namah
    sahasravaktraya sahasrakshayate namah || 68|| keshavaya namastubhyam namo narayanayaca | madhavaya
    namaste'stu govindaya namo namah || 69|| shrivishnave namastubhyam madhusudanarupine | trivikrama
    sudirghaya vamanaya namo namah || 70|| shridharaya namastubhyam hrishikeshaya te namah | namaste padmanabhaya
    damodaraya te namah || 71|| namaste sankarshanaya vasudevaya te namah | pradyumnaya namaste'stu aniruddhayate
    namah || 72|| namah purushottamayadhokshajaya te namo namah | namaste narasimhaya acyutaya namo namah
    || 73|| namo janardanayastupendraya ca namo namah | shriharaye namastubhyam shrikrishnaya namo namah
    || 74|| namah pandharinathaya bhimatiranivasine | namo rishiprasannaya varadaya namo namah || 75||
    ishtikarudharupaya samapadaya te namah | kativinyastahastaya mukhabrahmatmane namah || 76|| namastirthasvarupaya
    kshetrarupatmane namah | namo'stu murtimurtaya trimurtaye namo namah || 77|| namaste bindutirthaya
    namo'mriteshvaraya ca | namah pushkaratirthaya candrabhagaya te namah || 78|| namaste janudevaya dhiravatyai
    namo namah | namaste pundarikaya bhimarathyai namo namah || 79|| muktikeshapravaraya venuvadatmane
    namah | namaste'nantapadaya dvipadaya namo namah || 80|| namo govatsapadaya gopalaya namo namah |
    namaste padmatirthaya naranarayanatmane || 81|| namaste pitritirthaya lakshmitirthaya te namah | namo'stu
    shankhacakraya gadapadmaya te namah || 82|| namo'shvatthanrisimhaya kundalakhyasvarupine | namaste
    kshetrapalaya mahalingaya te namah || 83|| namaste rangashalaya namah kirtanarupine | mamau rukmininathaya
    mahamurtyai namo namah || 84|| namo vaikunthanathaya namah kshirabdhishayine | sarvabrahma namastubhyamahambrahmatmane
    namah || 85|| namo namo namastubhyam namaste'stu namo namah | klim shrim om | adyante samputikritya
    bijaishca pranavallabhe || 86|| ashtottarashatam mantran hridayam namanaih saha | urananyaih kirtitam
    yaishca teshamajnam vahamyaham || 87|| yavadyasya yatha bhavo yannamanyasapurvakam | tavadeva hi vijnanam
    gaditam madanugrahat || 88|| shrishankara uvaca | ityuktam vasudetroktam gopyadgopyataram mahat |
    nityam sankirtanam yasya praptamuktirna samshayah || 89|| idam guhyam hi hridayam viththalasya mahadbhutam
    | sha
  devanagari: षडगन्यासः ॥ अथ ध्यानम् ॐ श्रीं क्लीं प्रहसितमुखचन्द्रं प्रोल्लसत्पूर्णबिम्बं प्रणमदभयहस्तं
    चारुनीलाम्बुदाभम् । समपदकमनीयं तत्त्वबोधावगम्यं सदयवरददेवं विठ्ठलं तं नमामि ॥ २९॥ क्लीं श्रीं ॐ ॐ
    श्रीं क्लीम् ॥ पाण्डुरङ्गः शिखां पातु मूर्धानं पातु विठ्ठलः । मस्तकं माधवः पातु तिलकं पातु श्रीकरः
    ॥ ३०॥ भर्गः पातु भुवोर्मध्ये लोचने विष्णुरोजसा । दृष्टिं सुदर्शनः पातु श्रोत्रे पातु दिगम्बरः ॥ ३१॥
    नासाग्रं सृष्टिसौन्दर्य ओष्ठौ पातु सुधार्णवः । दन्तान् दयानिधिः पातु जिह्वां मे वेदवल्लभः ॥ ३२॥ तालुदेशं
    हरिः पातु रसनां गोरसप्रियः । चिबुकं चिन्मयः पातु ग्रीवां मे गरुडध्वजः ॥ ३३॥ कण्ठं तु कम्बुकण्ठश्च
    स्कन्धौ पातु महाबलः । भुजौ गिरिधरः पातु बाहू मे मधुसूदनः ॥ ३४॥ कूर्परौ कृपयाविष्टः करौ मे कमलापतिः
    । अगुलीरच्युतः पातु नखानि नरकेसरी ॥ ३५॥ वक्षः श्रीलाञ्छनः पातु स्तनौ मे स्तनलालसः । हृदयं श्रीहृषीकेश
    उदरं परमामृतः ॥ ३६॥ नाभिं मे पद्मनाभश्च कुक्षिं ब्रहयाडनायकः । कटिं पातु कटिकरो जघनं तु जनार्दनः ॥
    ३७॥ शिश्नं पातु स्मराधीशो वृषणे वृषभः पतिः । गुह्यं गुह्यतरः पातु ऊरू पातूरुविक्रमः ॥ ३८॥ जानू पातु
    जगन्नाथो जङ्घे मे मनमोहनः । गुल्फौ पातु गणाधीशः पादौ पातु त्रिविक्रमः ॥ ३९॥ शरीरं चाखिलं पातु नरनारायणो
    हरिः । अग्रे ह्यग्रतरः पातु दक्षिणे दक्षकप्रियः ॥ ४०॥ पृष्ठे पुष्टिकरः पातु वामे मे वासवप्रभुः । पूर्वे
    पूर्वापरः पातु आग्नेय्यां चाग्निरक्षकः ॥ ४१॥ दक्षिणे दीक्षितार्थश्च नैरृत्यामृतुनायकः । पश्चिमे वरुणाधीशो
    वायव्ये वातजापतिः ॥ ४२॥ उत्तरे धृतखड्गश्च ईशान्ये पातु ईश्वरः । उपरिष्टात्तु भगवानन्तरिक्षे चिदम्बरः
    ॥ ४३॥ भूतले धरणीनाथः पाताले कूर्मनायकः । स्वर्गे पातु सुरेद्रेन्द्रो ब्रह्माण्डे ब्रह्मणस्पतिः ॥ ४४॥
    अटव्यां नृहरिः पातु जीवने विश्वजीवनः । मार्गे पातु मनोगम्यः स्थाने पातु स्थिरासनः ॥ ४५॥ सबाह्याभ्यन्तरं
    पातु पुण्डरीकवरप्रियः । विष्णुर्मे विषयान् पातु वासनाः पातु वामनः ॥ ४६॥ कर्ता कर्मेन्द्रियं पातु ज्ञाता
    ज्ञानेन्द्रियं सदा । प्राणान् पातु प्राणनाथ आत्मारामो मनादिषु ॥ ४७॥ जागतिं मे जगद्ब्रह्म स्वप्नं पातु
    सुतेजकः । सुषुप्तिं मे समाधीशस्तुर्यां पातु मुनिप्रियः ॥ ४८॥ भार्यां पातु रमाकान्तः पुत्रान्पातु प्रजानिधिः
    । कन्यां मे करुणानाथो बान्धवान्भक्तवत्सलः ॥ ४९॥ धनं पातु धनाध्यक्षो धान्यं विश्वकुटुम्बकः । पशून्मे
    पालकः पातु विद्यां पातु कलानिधिः ॥ ५०॥ वाचस्पतिः पातु वादे सभायां विश्वमोहनः । कामक्रोधोद्भवात्पातु
    पूर्णकामो मनोरमः ॥ ५१॥ वस्त्रं रत्नं भूषणं च नाम रूपं कुलं गहम् । सर्वं सर्वात्मकः पातु शुद्धब्रह्मपरात्परः
    ॥ ५२॥ क्ली श्रीं ॐ ॐ श्री क्लीम् । विष्टलं मूर्ध्नि विन्यस्य ललाटे श्रीकरं न्यसेत् । पाण्डुरङ्गं भ्रुवोर्मध्ये
    नेत्रयोर्व्यापकं न्यसेत् ॥ ५३॥ कर्णयोर्निगमार्थं च गल्लयोर्वल्लभं न्यसेत् । नासिकायां न्यसेत्कृष्णं
    मुखे वै माधवं न्यसेत् ॥ ५४॥ ओष्ठयोर्मुरलीकान्तं दन्तपङ्क्त्यां सुहासकम् । रसनायां रसाधीशं जिह्वारग्रे
    कीर्तनं न्यसेत् ॥ ५५॥ कण्ठे न्यसेन्महाविष्णुं स्कन्धयोः कमलापतिम् । बाह्वोर्बलानुजं न्यस्य करे चक्रधरं
    न्यसेत् ॥ ५६॥ पाणितले पद्मधरं कराग्रे वरदाभयम् । वक्षःस्थले वरेण्यं च हृदये श्रीहरिं न्यसेत् ॥ १ ७॥
    उदरे विश्वभर्तारं नाभौ नाभिकरं न्यसेत् । कट्यां न्यसेत्क्रियातीतमूरौ तु उद्धवप्रियम् ॥ ५८॥ जानुद्वये
    न्यसेच्छक्तिं पादयोः पावनं न्यसेत् । सबाह्याभ्यन्तरं न्यस्य देवदेवं जगद्गुरुम् ॥ ५९॥ क्लीं श्रीं ॐ
    ॐ श्रीं क्लीम् । विष्ठलाय नमस्तुभ्यं नमो विज्ञानहेतवे । विष्णुजिष्णुस्वरूपाय श्रीविष्णवे नमो नमः ॥
    ६०॥ नमः पुण्डरीकाक्षाय पूर्णबिम्बात्मभे नमः । नमस्ते पाण्डुरङ्गाय पावनाय नमो नमः ॥ ६१॥ नमः पूर्णप्रकाशाय
    नमस्ते पूर्णतेजसे । पूर्णैश्वर्यस्वरूपाय पूर्णज्ञानात्मने नमः ॥ ६२॥ सच्चिदानन्दकन्दाय नमोऽनन्तसुखात्मने
    । नमोऽनन्ताय शान्ताय श्रीरामाय नमो नुमः ॥ ६३॥ नमो ज्योतिःस्वरूपाय नमो ज्योतिर्मयात्मने । नमो ज्योतिःप्रकाशाय
    सर्वोत्कृष्टात्मने नमः ॥ ६४॥ ॐ नमोब्रह्मरूपाय नम ॐङ्कारमूर्तये । निर्विकल्पाय सत्याय शुद्धसत्त्वात्मने
    नमः ॥ ६५॥ महद्ब्रह्म नमस्तेऽस्तु सत्यसङ्कल्पहेतवे । नमः सृष्टिप्रकाशाय गुणसाम्यायते नमः ॥ ६६॥ ब्रह्मविष्णुमहेशाय
    नानावर्णात्मरूपिणे । सदोदिताय शुद्धाय गुणातीताय ते नमः ॥ ६७॥ नमः सहस्रनाम्ने च नमः सहस्ररूपिणे । नमः
    सहस्रवक्त्राय सहस्राक्षायते नमः ॥ ६८॥ केशवाय नमस्तुभ्यं नमो नारायणायच । माधवाय नमस्तेऽस्तु गोविन्दाय
    नमो नमः ॥ ६९॥ श्रीविष्णवे नमस्तुभ्यं मधुसूदनरूपिणे । त्रिविक्रम सुदीर्घाय वामनाय नमो नमः ॥ ७०॥ श्रीधराय
    नमस्तुभ्यं हृषीकेशाय ते नमः । नमस्ते पद्मनाभाय दामोदराय ते नमः ॥ ७१॥ नमस्ते सङ्कर्षणाय वासुदेवाय ते
    नमः । प्रद्युम्नाय नमस्तेऽस्तु अनिरुद्धायते नमः ॥ ७२॥ नमः पुरुषोत्तमायाधोक्षजाय ते नमो नमः । नमस्ते
    नारसिंहाय अच्युताय नमो नमः ॥ ७३॥ नमो जनार्दनायास्तूपेन्द्राय च नमो नमः । श्रीहरये नमस्तुभ्यं श्रीकृष्णाय
    नमो नमः ॥ ७४॥ नमः पण्ढरिनाथाय भीमातीरनिवासिने । नमो ऋषिप्रसन्नाय वरदाय नमो नमः ॥ ७५॥ इष्टिकारूढरूपाय
    समपादाय ते नमः । कटिविन्यस्तहस्ताय मुखब्रह्मात्मने नमः ॥ ७६॥ नमस्तीर्थस्वरूपाय क्षेत्ररूपात्मने नमः
    । नमोऽस्तु मूर्तिमूर्ताय त्रिमूर्तये नमो नमः ॥ ७७॥ नमस्ते बिन्दुतीर्थाय नमोऽमृतेश्वराय च । नमः पुष्करतीर्थाय
    चन्द्रभागाय ते नमः ॥ ७८॥ नमस्ते जानुदेवाय धीरावत्यै नमो नमः । नमस्ते पुण्डरीकाय भीमरथ्यै नमो नमः ॥
    ७९॥ मुक्तिकेशप्रवराय वेणुवादात्मने नमः । नमस्तेऽनन्तपादाय द्विपदाय नमो नमः ॥ ८०॥ नमो गोवत्सपादाय गोपालाय
    नमो नमः । नमस्ते पद्मतीर्थाय नरनारायणात्मने ॥ ८१॥ नमस्ते पितृतीर्थाय लक्ष्मीतीर्थाय ते नमः । नमोऽस्तु
    शङ्खचक्राय गदापद्माय ते नमः ॥ ८२॥ नमोऽश्वत्थनृसिंहाय कुण्डलाख्यस्वरूपिणे । नमस्ते क्षेत्रपालाय महालिङ्गाय
    ते नमः ॥ ८३॥ नमस्ते रङ्गशालाय नमः कीर्तनरूपिणे । ममौ रुक्मिणिनाथाय महामूर्त्यै नमो नमः ॥ ८४॥ नमो वैकुण्ठनाथाय
    नमः क्षीराब्धिशायिने । सर्वब्रह्म नमस्तुभ्यमहम्ब्रह्मात्मने नमः ॥ ८५॥ नमो नमो नमस्तुभ्यं नमस्तेऽस्तु
    नमो नमः । क्लीं श्रीं ओम् । आद्यन्ते सम्पुटीकृत्य बीजैश्च प्राणवल्लभे ॥ ८६॥ अष्टोत्तरशतं मन्त्रान्
    हृदयं नमनैः सह । उरनन्यैः कीर्तितं यैश्च तेषामाज्ञां वहाम्यहम् ॥ ८७॥ यावद्यस्य यथा भावो यन्नामन्यासपूर्वकम्
    । तावदेव हि विज्ञानं गदितं मदनुग्रहात् ॥ ८८॥ श्रीशङ्कर उवाच । इत्युक्तं वासुदेत्रोक्तं गोप्याद्गोप्यतरं
    महत् । नित्यं सङ्कीर्तनं यस्य प्राप्तमुक्तिर्न संशयः ॥ ८९॥ इदं गुह्यं हि हृदयं विठ्ठलस्य महाद्भुतम्
    । श
