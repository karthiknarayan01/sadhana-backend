id: shrinivasastava
category: stotram
name:
  english: shrinivasastava
  devanagari: श्रीनिवासस्तव
content:
  english: nyastu mama sheshagirimastagatavastu || 98|| prashamitapishitasham prastasamsarapasham kritanatagadanasham
    kirtibhissmeritasham | navajaladanikasham nagashailaprakasham parihritavishayasham bhavayamo ramesham
    || 99|| kalyanabhyamasheshabhyudayavibhavasampidanakridanabhyam nabhyamabhyudgatasya dviyugamukhashishoh
    shruyamanastavabhyam | bodhamodarnavabhyam bhujagaparibridhakshmadharalankritibhyam divyabhyam dampatibhyam
    bhavatu nama idam devatasevitabhyam || 100|| || ityatreya shrivenkatadhvarikritishu shravananande
    shrinivasastave prathamashatakam || || atha dvitiyashatakam || shriyah priyatamam seve sheshacalashiromanim
    | mahitam sumanovrindairmandaramiva madrisham || 1|| kamaniyairnijalokaih kamalanandakaribhih tamasamapanetaram
    tameva harimashraye || 2|| parishkritanjanadharam param shrutyantagocaram | locanam staumi lokanam
    kimapyajnanamocanam || 3|| pratipasharabharavalopakam gajapalakam | dadhami harimashcaryam guhashayamihashraye
    || 4|| adrishyam yogivaryairapyabjadiptikaram harim | upatishthe'dhikarunyamudyantamiva bhaskaram
    || 5|| devatamadimam vande dhritam bhujagabhubhrita | samudramashritamurvim prithucapaprasadhitam
    || 6|| anandanilayam vande shlaghyam dugdharnavadapi | shridharam yatra jagarti param jyotirniranjanam
    || 7|| prapannabhayadosmiti satyapaya vaco mayi | naḻikashabda ucitah shrinivasasya te yatah || 8||
    prapancasyamupasya tvam nripancasyati manavah | karoshi tasya yatsvamin karoshitamabhipsitam || 9||
    vrishacaleshasya tusharadidhititvisha mukhenartavishadaharinah | mudam nidanam dyusadavalistutam sada
    padambhojamudaramashraye || 10|| sakritprapannaya krishaya daivatairanapyamapyarpayasi sthiram padam
    | dayaluta madhava durbaleshu hi prabhuttamanam paramam vibhushanam || 11|| ajasramapyabdhisutam vahannurasyajamadhishthaya
    srijan praja hare | bhavatyaho manmathajanmabhurbhavan tathapi kandarpajita'bhimanyase || 12|| tva
    kiminduna tena kalankitena yam prabibhrato napagatandhakarita | tavaiva vikshe mukhacandramadbhutam
    tamo murare harati smrito'pi yah || 13|| patanga udyannupamanatam bhava
  devanagari: न्यस्तु मम शेषगिरिमस्तगतवस्तु ॥ ९८॥ प्रशमितपिशिताशं प्रास्तसंसारपाशं कृतनतगदनाशं कीर्तिभिस्स्मेरिताशम्
    । नवजलदनिकाशं नागशैलप्रकाशं परिहृतविषयाशं भावयामो रमेशम् ॥ ९९॥ कल्याणाभ्यामशेषाभ्युदयविभवसम्पीडनक्रीडनाभ्यां
    नाभ्यामभ्युद्गतस्य द्वियुगमुखशिशोः श्रूयमाणस्तवाभ्याम् । बोधामोदार्णवाभ्यां भुजगपरिबृढक्ष्माधरालङ्कृतिभ्यां
    दिव्याभ्यां दम्पतिभ्यां भवतु नम इदं देवतासेविताभ्याम् ॥ १००॥ ॥ इत्यात्रेय श्रीवेङ्कटध्वरिकृतिषु श्रवणानन्दे
    श्रीनिवासस्तवे प्रथमशतकम् ॥ ॥ अथ द्वितीयशतकम् ॥ श्रियः प्रियतमं सेवे शेषाचलशिरोमणिम् । महितं सुमनोवृन्दैर्मन्दारमिव
    मादृशाम् ॥ १॥ कमनीयैर्निजालोकैः कमलानन्दकारिभिः तमसामपनेतारं तमेव हरिमाश्रये ॥ २॥ परिष्कृताञ्जनधरं
    परं श्रुत्यन्तगोचरम् । लोचनं स्तौमि लोकानां किमप्यज्ञानमोचनम् ॥ ३॥ प्रतीपशरभारावलोपकं गजपालकम् । दधामि
    हरिमाश्चर्यं गुहाशयमिहाश्रये ॥ ४॥ अदृश्यं योगिवर्यैरप्यब्जदीप्तिकरं हरिम् । उपतिष्ठेऽधिकारुण्यमुद्यन्तमिव
    भास्करम् ॥ ५॥ देवतामादिमां वन्दे धृतां भुजगभूभृता । समुद्रमाश्रितामुर्वीं पृथुचापप्रसाधिताम् ॥ ६॥
    आनन्दनिलयं वन्दे श्लाघ्यं दुग्धार्णवादपि । श्रीधरं यत्र जागर्ति परं ज्योतिर्निरञ्जनम् ॥ ७॥ प्रपन्नाभयदोस्मीति
    सत्यापय वचो मयि । नाळीकशब्द उचितः श्रीनिवासस्य ते यतः ॥ ८॥ प्रपञ्चास्यमुपास्य त्वां नृपञ्चास्यति मानवः
    । करोषि तस्य यत्स्वामिन् करोषितमभीप्सितम् ॥ ९॥ वृषाचलेशस्य तुषारदीधितित्विषा मुखेनार्तविषादहारिणः
    । मुदां निदानं द्युसदावलिस्तुतं सदा पदाम्भोजमुदारमाश्रये ॥ १०॥ सकृत्प्रपन्नाय कृशाय दैवतैरनाप्यमप्यर्पयसि
    स्थिरं पदम् । दयालुता माधव दुर्बलेषु हि प्रभूत्तमानां परमं विभूषणम् ॥ ११॥ अजस्रमप्यब्धिसुतां वहन्नुरस्यजामधिष्ठाय
    सृजन् प्रजा हरे । भवत्यहो मन्मथजन्मभूर्भवान् तथापि कन्दर्पजिताऽभिमन्यसे ॥ १२॥ त्व किमिन्दुना तेन कलङ्कितेन
    यं प्रबिभ्रतो नापगतान्धकारिता । तवैव वीक्षे मुखचन्द्रमद्भुतं तमो मुरारे हरति स्मृतोऽपि यः ॥ १३॥ पतङ्ग
    उद्यन्नुपमानतां भव
