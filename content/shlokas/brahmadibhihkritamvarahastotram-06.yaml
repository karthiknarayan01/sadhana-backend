id: brahmadibhihkritamvarahastotram-06
category: stotram
name:
  english: brahmadibhihkritamvarahastotram 06
  devanagari: ब्रह्मादिभिःकृतंवराहस्तोत्रम् ०६
content:
  english: brahmadibhih kritam varahastotram 6 brahma ca rishayah sarve naradadya munishvarah | tushtuvuh
    kritakaryam tam saumyam prithvidharam harim || 29|| namo yajnasvarupaya citimukhaya te namah | vedapadyupadamshtraya
    tatkratuvakshase namah || 30|| analajihvaya darbharomne tapasvine namah | brahmashirshne namo vedatadangashrutisragvine
    || 31|| ahoratrakshanadhrige namah sruvasutundine | namah sadajyanasaya samaghoshasvanaya ca || 32||
    mahate satyadharmaya namo vikramashaline | prayashcittarathaya om ghoraya pashujanave || 33|| udgatrantraya
    devaya homalingaya te namah | sthanabijaya devaya sanmahaushadhaye namah || 34|| namo mantrasphije
    bhumne namo vedyantaratmane | nama ajyasprije somashonitaya ca te namah || 35|| vedaskandhaya shantaya
    havirgandhaya te namah | havyakavyativegaya namah pragvamshadehine || 36|| namo dyutimate nanadikshanvitaya
    te namah | namaste dakshinahride yogine satrarupine || 37|| namah pravargyavittadibhushanaya mahatmane
    | upakarmeshtirucirabrahmane prabhave namah || 38|| nanachandogatipathajushe pranaya te namah | namo
    guhyopanishadasanaya savanaya te || 39|| iti stutah paro devo hyashirdatva tirodadhe | iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 50
  devanagari: ब्रह्मादिभिः कृतं वराहस्तोत्रम् ६ ब्रह्मा च ऋषयः सर्वे नारदाद्या मुनीश्वराः । तुष्टुवुः
    कृतकार्यं तं सौम्यं पृथ्वीधरं हरिम् ॥ २९॥ नमो यज्ञस्वरूपाय चितीमुखाय ते नमः । वेदपाद्युपदंष्ट्राय
    तत्क्रतुवक्षसे नमः ॥ ३०॥ अनलजिह्वाय दर्भरोम्णे तपस्विने नमः । ब्रह्मशिर्ष्णे नमो वेदतदङ्गश्रुतिस्रग्विणे
    ॥ ३१॥ अहोरात्रक्षणधृगे नमः स्रुवसुतुण्डिने । नमः सदाज्यनासाय सामघोषस्वनाय च ॥ ३२॥ महते सत्यधर्माय
    नमो विक्रमशालिने । प्रायश्चित्तरथाय ॐ घोराय पशुजानवे ॥ ३३॥ उद्गात्रन्त्राय देवाय होमलिङ्गाय ते नमः
    । स्थानबीजाय देवाय सन्महौषधये नमः ॥ ३४॥ नमो मन्त्रस्फिजे भूम्ने नमो वेद्यान्तरात्मने । नम आज्यस्पृजे
    सोमशोणिताय च ते नमः ॥ ३५॥ वेदस्कन्धाय शान्ताय हविर्गन्धाय ते नमः । हव्यकव्यातिवेगाय नमः प्राग्वंशदेहिने
    ॥ ३६॥ नमो द्युतिमते नानादीक्षान्विताय ते नमः । नमस्ते दक्षिणाहृदे योगिने सत्ररूपिणे ॥ ३७॥ नमः प्रवर्ग्यवित्तादिभूषणाय
    महात्मने । उपाकर्मेष्टिरुचिरब्रह्मणे प्रभवे नमः ॥ ३८॥ नानाछन्दोगतिपथजुषे प्राणाय ते नमः । नमो गुह्योपनिषदासनाय
    सवनाय ते ॥ ३९॥ इति स्तुतः परो देवो ह्याशीर्दत्वा तिरोदधे । इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे
    कृतयुगसन्ताने ५०
meaning: {}
