id: sri-aadya-kali-stotram
category: stotram
name:
  english: Sri Aadya Kali Stotram
content:
  english: brahmovaca shrinu vatsa pravakshyami adyastotram mahaphalam | yah pathet satatam bhaktya sa
    eva vishnuvallabhah || || mrityurvyadhibhayam tasya nasti kincit kalau yuge | aputra labhate putram
    tripaksham shravanam yadi || || dvau masau bandhananmukti vipravaktrat shrutam yadi | mritavatsa jivavatsa
    shanmasam shravanam yadi || || naukayam sankate yuddhe pathanajjayamapnuyat | likhitva sthapayedgehe
    nagnicaurabhayam kvacit || || rajasthane jayi nityam prasannah sarvadevata | om hrim | brahmani brahmaloke
    ca vaikunthe sarvamangala || || indrani amaravatyamambika varunalaye | yamalaye kalarupa kuberabhavane
    shubha || || mahanandagnikone ca vayavyam mrigavahini | nairrityam raktadanta ca aishanyam shuladharini
    || || patale vaishnavirupa simhale devamohini | surasa ca manidvipe lankayam bhadrakalika || || rameshvari
    setubandhe vimala purushottame | viraja audradeshe ca kamakshya nilaparvate || || kalika vangadeshe
    ca ayodhyayam maheshvari | varanasyamannapurna gayakshetre gayeshvari || || kurukshetre bhadrakali
    vraje katyayani para | dvarakayam mahamaya mathurayam maheshvari || || kshudha tvam sarvabhutanam
    vela tvam sagarasya ca | navami shuklapakshasya krishnasyaikadashi para || || dakshasa duhita devi
    dakshayajnavinashini | ramasya janaki tvam hi ravanadhvamsakarini || || candamundavadhe devi raktabijavinashini
    | nishumbhashumbhamathini madhukaitabhaghatini || || vishnubhaktiprada durga sukhada mokshada sada
    | adyastavamimam punyam yah pathet satatam narah || || sarvajvarabhayam na syat sarvavyadhivinashanam
    | kotitirthaphalam tasya labhate natra samshayah || || jaya me cagratah patu vijaya patu prishthatah
    | narayani shirshadeshe sarvange simhavahini || || shivaduti ugracanda pratyange parameshvari | vishalakshi
    mahamaya kaumari shankhini shiva || || cakrini jayadatri ca ranamatta ranapriya | durga jayanti kali
    ca bhadrakali mahodari || || narasimhi ca varahi siddhidatri sukhaprada | bhayankari maharaudri mahabhayavinashini
    || || iti shribrahmayamale brahmanaradasamvade shri adya stotram ||
  devanagari: ब्रह्मोवाच शृणु वत्स प्रवक्ष्यामि आद्यास्तोत्रं महाफलम् । यः पठेत् सततं भक्त्या स एव विष्णुवल्लभः
    ॥ ॥ मृत्युर्व्याधिभयं तस्य नास्ति किञ्चित् कलौ युगे । अपुत्रा लभते पुत्रं त्रिपक्षं श्रवणं यदि ॥ ॥
    द्वौ मासौ बन्धनान्मुक्ति विप्रवक्त्रात् श्रुतं यदि । मृतवत्सा जीववत्सा षण्मासं श्रवणं यदि ॥ ॥ नौकायां
    सङ्कटे युद्धे पठनाज्जयमाप्नुयात् । लिखित्वा स्थापयेद्गेहे नाग्निचौरभयं क्वचित् ॥ ॥ राजस्थाने जयी नित्यं
    प्रसन्नाः सर्वदेवता । ॐ ह्रीम् । ब्रह्माणी ब्रह्मलोके च वैकुण्ठे सर्वमङ्गला ॥ ॥ इन्द्राणी अमरावत्यामम्बिका
    वरुणालये । यमालये कालरूपा कुबेरभवने शुभा ॥ ॥ महानन्दाग्निकोणे च वायव्यां मृगवाहिनी । नैरृत्यां रक्तदन्ता
    च ऐशान्यां शूलधारिणी ॥ ॥ पाताले वैष्णवीरूपा सिंहले देवमोहिनी । सुरसा च मणिद्विपे लङ्कायां भद्रकालिका
    ॥ ॥ रामेश्वरी सेतुबन्धे विमला पुरुषोत्तमे । विरजा औड्रदेशे च कामाक्ष्या नीलपर्वते ॥ ॥ कालिका वङ्गदेशे
    च अयोध्यायां महेश्वरी । वाराणस्यामन्नपूर्णा गयाक्षेत्रे गयेश्वरी ॥ ॥ कुरुक्षेत्रे भद्रकाली व्रजे कात्यायनी
    परा । द्वारकायां महामाया मथुरायां महेश्वरी ॥ ॥ क्षुधा त्वं सर्वभूतानां वेला त्वं सागरस्य च । नवमी
    शुक्लपक्षस्य कृष्णस्यैकादशी परा ॥ ॥ दक्षसा दुहिता देवी दक्षयज्ञविनाशिनी । रामस्य जानकी त्वं हि रावणध्वंसकारिणी
    ॥ ॥ चण्डमुण्डवधे देवी रक्तबीजविनाशिनी । निशुम्भशुम्भमथिनी मधुकैटभघातिनी ॥ ॥ विष्णुभक्तिप्रदा दुर्गा
    सुखदा मोक्षदा सदा । आद्यास्तवमिमं पुण्यं यः पठेत् सततं नरः ॥ ॥ सर्वज्वरभयं न स्यात् सर्वव्याधिविनाशनम्
    । कोटितीर्थफलं तस्य लभते नात्र संशयः ॥ ॥ जया मे चाग्रतः पातु विजया पातु पृष्ठतः । नारायणी शीर्षदेशे
    सर्वाङ्गे सिंहवाहिनी ॥ ॥ शिवदूती उग्रचण्डा प्रत्यङ्गे परमेश्वरी । विशालाक्षी महामाया कौमारी शङ्खिनी
    शिवा ॥ ॥ चक्रिणी जयदात्री च रणमत्ता रणप्रिया । दुर्गा जयन्ती काली च भद्रकाली महोदरी ॥ ॥ नारसिंही च
    वाराही सिद्धिदात्री सुखप्रदा । भयङ्करी महारौद्री महाभयविनाशिनी ॥ ॥ इति श्रीब्रह्मयामले ब्रह्मनारदसंवादे
    श्री आद्या स्तोत्रम् ॥
