id: indradyumnakritam4vishnustotram
category: stotram
name:
  english: indradyumnakritam4vishnustotram
  devanagari: इन्द्रद्युम्नकृतं४विष्णुस्तोत्रम्
content:
  english: 120|| samsarapatitashrantaduhkhadhvamsa namo'stu te | durbhedyahridayagranthibhedakaya namo'stu
    te || 121|| dvisaptabhuvanagaramulastambhaya te namah | brahmandakotighatanashilpine cakrine namah
    || 122|| karunamritapathodhisudhadhamne namo namah | dinoddharaikaguhyaya kripapathodhaye namah ||
    123|| prakashakanam suryadijyotisham jyotishe namah | pratisvasvanadiptaya antahpapagnaye namah ||
    124|| pavakaya pavitraya pavitranam namo namah | garishthaya varishthaya draghishthaya namo namah
    || 125|| nedishthaya davishthaya kshodishthaya namo namah | varenyaya supunyaya narayana namo'stu
    te || 126|| paritrahi jagannatha dinabandho namo'stu te | nistirno'ham bhavambhodhim prapya tvam taranim
    sukham || 127|| tvayi drishte ramanatha klesha vyapagata mama | cidanandasvarupam tvam praptanam duhkhasankshayah
    || 128|| dhruvam natha samutpannaparamanandahetukam | trahi trahi bhavambhodhimagnam mam dinacetasam
    || 129|| madhyahnarkodite vyomni kutah santamasodayah | dhyanasthitah stuvannevam pranamya jagadishvaram
    || 2
  devanagari: १२०॥ संसारपतितश्रान्तदुःखध्वंस नमोऽस्तु ते । दुर्भेद्यहृदयग्रन्थिभेदकाय नमोऽस्तु ते ॥ १२१॥
    द्विसप्तभुवनागारमूलस्तम्भाय ते नमः । ब्रह्माण्डकोटिघटनाशिल्पिने चक्रिणे नमः ॥ १२२॥ करुणामृतपाथोधिसुधाधाम्ने
    नमो नमः । दीनोद्धारैकगुह्याय कृपापाथोधये नमः ॥ १२३॥ प्रकाशकानां सूर्यादिज्योतिषां ज्योतिषे नमः । प्रतिस्वस्वनदीप्ताय
    अन्तःपापाग्नये नमः ॥ १२४॥ पावकाय पवित्राय पवित्राणां नमो नमः । गरिष्ठाय वरिष्ठाय द्राघिष्ठाय नमो नमः
    ॥ १२५॥ नेदिष्ठाय दविष्ठाय क्षोदिष्ठाय नमो नमः । वरेण्याय सुपुण्याय नारायण नमोऽस्तु ते ॥ १२६॥ परित्राहि
    जगन्नाथ दीनबन्धो नमोऽस्तु ते । निस्तीर्णोऽहं भवाम्भोधिं प्राप्य त्वां तरणिं सुखाम् ॥ १२७॥ त्वयि दृष्टे
    रमानाथ क्लेशा व्यपगता मम । चिदानन्दस्वरूपं त्वां प्राप्तानां दुःखसङ्क्षयः ॥ १२८॥ ध्रुवं नाथ समुत्पन्नपरमानन्दहेतुकम्
    । त्राहि त्राहि भवाम्भोधिमग्नं मां दीनचेतसम् ॥ १२९॥ मध्याह्नार्कोदिते व्योम्नि कुतः सन्तमसोदयः । ध्यानस्थितः
    स्तुवन्नेवं प्रणम्य जगदीश्वरम् ॥ २
