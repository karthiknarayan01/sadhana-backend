id: andhakakritam3shivastotram
category: stotram
name:
  english: andhakakritam3shivastotram
  devanagari: अन्धककृतं३शिवस्तोत्रम्
content:
  english: andhakakritam 3 shivastotram andhaka uvaca | namo'stu te bhairava bhimamurte trilokagoptre
    shitashuladharine | vimsharddhabaho bhujageshahara trinetra mam pahi vipannabuddhim || 52|| jayasva
    sarveshvara vishvamurtte surasurairvanditapadapitha | trailokyamaturgurave vrishanka bhitah sharanyam
    sharanagato'smi || 53|| tvam natha devah shivamirayanti siddha haram sthanu maharshayashca | bhimam
    ca yaksha manuja maheshvaram bhutashca bhutadhipamamananti || 54|| nishacara ugramuparcayanti bhaveti
    punyah pitaro namanti | daso'smi tubhyam hara pahi mahyam papakshayam me kuru lokanatha || 55|| bhavamstridevastriyugastridharma
    tripushkarashcasi vibho trinetra | trayyarunistrishrutiravyayatman punihi mam tvam sharanam gato'smi
    || 56|| trinaciketastripadapratishthah shadangavittvam vishayeshvalubdhah | trailokyanatho'si punihi
    shambho daso'smi bhitah sharanagataste || 57|| kritam mahacchankara te'paradham maya mahabhutapate
    girisha | kamarina nirjitamanasena prasadaye tvam shirasa nato'smi || 58|| papo'ham papakarma'ham
    papatma papasambhavah | trahi mam deva ishana sarvapapaharo bhava || 59|| ma me krudhyasva devesha
    tvaya caitadrisho'smyaham | srishtah papasamacaro me prasanno bhaveshvara || 60|| tvam kartta caiva
    dhata ca tvam jayastvam mahajayah | tvam mangalyastvamonkarastvamishano dhruvo'vyayah || 61|| tvam
    brahma srishtikrinnathastvam vishnustvam maheshvarah | tvamindrastvam vashatkaro dharmastvam ca surottamah
    || 62|| sukshmastvam vyaktarupastvam tvamavyaktastvamishvarah | tvaya sarvamidam vyaptam jagatsthavarajangamam
    || 63|| tvamadiranto madhyashca tvamanadih sahasrapat | vijayastvam sahasraksho virupaksho mahabhujah
    || 64|| anantah sarvago vyapi hamsah pranadhipo'cyutah | girvanapatiravyagro rudrah pashupatih shivah
    || 65|| traividyastvam jitakrodho jitarirvijitendriyah | jayashca shulapanistvam trahi mam sharanagatam
    || 66|| iti vamanapurane saptatimadhyayantargatam andhakakritam shivastotram samaptam | vamanapurana
    | adhyaya 70
  devanagari: अन्धककृतं ३ शिवस्तोत्रम् अन्धक उवाच । नमोऽस्तु ते भैरव भीममूर्ते त्रिलोकगोप्त्रे शितशूलधारिणे
    । विंशार्द्धबाहो भुजगेशहार त्रिनेत्र मां पाहि विपन्नबुद्धिम् ॥ ५२॥ जयस्व सर्वेश्वर विश्वमूर्त्ते सुरासुरैर्वन्दितपादपीठ
    । त्रैलोक्यमातुर्गुरवे वृषाङ्क भीतः शरण्यं शरणागतोऽस्मि ॥ ५३॥ त्वां नाथ देवाः शिवमीरयन्ति सिद्धा हरं
    स्थाणु महर्षयश्च । भीमं च यक्षा मनुजा महेश्वरं भूताश्च भूताधिपमामनन्ति ॥ ५४॥ निशाचरा उग्रमुपार्चयन्ति
    भवेति पुण्याः पितरो नमन्ति । दासोऽस्मि तुभ्यं हर पाहि मह्यं पापक्षयं मे कुरु लोकनाथ ॥ ५५॥ भवांस्त्रिदेवस्त्रियुगस्त्रिधर्मा
    त्रिपुष्करश्चासि विभो त्रिनेत्र । त्रय्यारुणिस्त्रिश्रुतिरव्ययात्मन् पुनीहि मां त्वां शरणं गतोऽस्मि
    ॥ ५६॥ त्रिणाचिकेतस्त्रिपदप्रतिष्ठः षडङ्गवित्त्वं विषयेष्वलुब्धः । त्रैलोक्यनाथोऽसि पुनीहि शम्भो दासोऽस्मि
    भीतः शरणागतस्ते ॥ ५७॥ कृतं महच्छङ्कर तेऽपराधं मया महाभूतपते गिरीश । कामारिणा निर्जितमानसेन प्रसादये
    त्वां शिरसा नतोऽस्मि ॥ ५८॥ पापोऽहं पापकर्माऽहं पापात्मा पापसम्भवः । त्राहि मां देव ईशान सर्वपापहरो
    भव ॥ ५९॥ मा मे क्रुध्यस्व देवेश त्वया चैतादृशोऽस्म्यहम् । सृष्टः पापसमाचारो मे प्रसन्नो भवेश्वर ॥
    ६०॥ त्वं कर्त्ता चैव धाता च त्वं जयस्त्वं महाजयः । त्वं मङ्गल्यस्त्वमोङ्कारस्त्वमीशानो ध्रुवोऽव्ययः
    ॥ ६१॥ त्वं ब्रह्म सृष्टिकृन्नाथस्त्वं विष्णुस्त्वं महेश्वरः । त्वमिन्द्रस्त्वं वषट्कारो धर्मस्त्वं
    च सुरोत्तमः ॥ ६२॥ सूक्ष्मस्त्वं व्यक्तरूपस्त्वं त्वमव्यक्तस्त्वमीश्वरः । त्वया सर्वमिदं व्याप्तं जगत्स्थावरजङ्गमम्
    ॥ ६३॥ त्वमादिरन्तो मध्यश्च त्वमनादिः सहस्रपात् । विजयस्त्वं सहस्राक्षो विरूपाक्षो महाभुजः ॥ ६४॥ अनन्तः
    सर्वगो व्यापी हंसः प्राणाधिपोऽच्युतः । गीर्वाणपतिरव्यग्रो रुद्रः पशुपतिः शिवः ॥ ६५॥ त्रैविद्यस्त्वं
    जितक्रोधो जितारिर्विजितेन्द्रियः । जयश्च शूलपाणिस्त्वं त्राहि मां शरणागतम् ॥ ६६॥ इति वामनपुराणे सप्ततिमाध्यायान्तर्गतं
    अन्धककृतं शिवस्तोत्रं समाप्तम् । वामनपुराण । अध्याय ७०
