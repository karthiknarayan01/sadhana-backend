id: anandasagarastavah
category: stotram
name:
  english: anandasagarastavah
  devanagari: आनन्दसागरस्तवः
content:
  english: tkim tavata svamapi tasya bhavami matah | ajnanatah paragriham pravishanparasya svatvam prayasyati
    pashuh kimu rajakiyah || 44 || adhaya murdhani vrithaiva bharam mahantam murkha nimajjatha katham
    bhavasagare'smin | vinyasya bharamakhilam padayorjananya visrabdhamuttarata palvalatulyamenam || 45
    || kvedam patishyati vapuh kva tato nu gamyam ko dandayishyati kiyamtamanehasam va | kim tasya santaranasadhanamityananta
    cinta sthita tvayi shanairavatarita sa || 46 || jnanam visheyamuta tena vinoddhareyam prarabdhamapyapalapeyamutanurumdhyam
    | ittham sakritprapadanaikavashamvadaya maturmayi pravavrite mahatiha cinta || 47 || etajjadajadavivecanametadeva
    kshityaditatvaparishodhanakaushalam ca | jnanam ca shaivamidamagamakotilabhyam maturyadanghriyugale
    nihito mayatma || 48 || shattrimshadavaranamadhyajushi tvadanghrau halasyanathadayite nihito mayatma
    | bhubhutalatridivavartishu kah kshameta taccakshushadi nibhritena nirikshitum mam || 49 || bandham
    harishyasi sukham vitarishyasiti nishcapracam nikhilamamba tadasta eva | sampratyaham tvayi nidhaya
    bharam samastam yanirvrinomikimito'pi mamapavarge || 50 || kashyam nipataya vapuh shvapacalaye va
    svargam naya tvamapavargamadhogatim va | adyaiva va kuru dayam punarayatau va kah sambhramo mama dhane
    dhaninah pramanam || 51 || naham sahe tava kathashravanantarayam naham sahe tava padarcanavicyutim
    va | moksham dishaitadaviruddhamidam na cetya
  devanagari: त्किं तावता स्वमपि तस्य भवामि मातः । अज्ञानतः परगृहं प्रविशन्परस्य स्वत्वं प्रयास्यति पशुः
    किमु राजकीयः ॥ ४४ ॥ आधाय मूर्धनि वृथैव भरं महान्तं मूर्खा निमज्जथ कथं भवसागरेऽस्मिन् । विन्यस्य भारमखिलं
    पदयोर्जनन्या विस्रब्धमुत्तरत पल्वलतुल्यमेनम् ॥ ४५ ॥ क्वेदं पतिष्यति वपुः क्व ततो नु गम्यं को दण्डयिष्यति
    कियंतमनेहसं वा । किं तस्य सन्तरणसाधनमित्यनन्ता चिन्ता स्थिता त्वयि शनैरवतारिता सा ॥ ४६ ॥ ज्ञानं विशेयमुत
    तेन विनोद्धरेयं प्रारब्धमप्यपलपेयमुतानुरुंध्याम् । इत्थं सकृत्प्रपदनैकवशंवदाया मातुर्मयि प्रववृते
    महतीह चिन्ता ॥ ४७ ॥ एतज्जडाजडविवेचनमेतदेव क्षित्यादितत्वपरिशोधनकौशलं च । ज्ञानं च शैवमिदमागमकोटिलभ्यं
    मातुर्यदङ्घ्रियुगले निहितो मयात्मा ॥ ४८ ॥ षट्त्रिंशदावरणमध्यजुषि त्वदङ्घ्रौ हालास्यनाथदयिते निहितो
    मयात्मा । भूभुतलत्रिदिववर्तिषु कः क्षमेत तच्चक्षुशादि निभृतेन निरीक्षितुं माम् ॥ ४९ ॥ बन्धं हरिष्यसि
    सुखं वितरिष्यसीति निश्चप्रचं निखिलमम्ब तदास्त एव । सम्प्रत्यहं त्वयि निधाय भरं समस्तं यानिर्वृणोमिकिमितोऽपि
    ममापवर्गे ॥ ५० ॥ काश्यां निपातय वपुः श्वपचालये वा स्वर्गं नय त्वमपवर्गमधोगतिं वा । अद्यैव वा कुरु
    दयां पुनरायतौ वा कः सम्भ्रमो मम धने धनिनः प्रमाणम् ॥ ५१ ॥ नाहं सहे तव कथाश्रवणान्तरायं नाहं सहे तव
    पदार्चनविच्युतिं वा । मोक्षं दिशैतदविरुद्धमिदं न चेत्या
