id: namavali-55
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: om surathaya namah | om sumadhyaya namah | om manmathantakaraya namah | om mahomayaya namah
    | om tikshnaya namah | om ardracarmadharaya namah | om shmashanaratinityaya namah | om ulukadharine
    namah | om barhibarhavasanaya namah | om ghanaya namah | 10 || om bahugarjate namah | om kavyapujyaya
    namah | om hridyaya namah | om trinetraya namah | om pinakine namah | om paravaraya namah | om nityaya
    namah | om satyadharmaya namah | om mahadhvareshaya namah | om tandunrittapriyaya namah | 20 || om
    vibhishanaya namah | om bhimaya namah | om bhagapramathanaya namah | om siddhasanghatagitaya namah
    | om mahashesha'ngadaya namah | om muktattahasaya namah | om kshvedasphotakaraya namah | om nardate
    namah | om kurdate namah | om pramuditatmane namah | 30 || om mridaya namah | om devaya namah | om
    dhavate namah | om vishtitaya namah | om dhyayate namah | om nandate namah | om ruvate namah | om
    dravate namah | om valate namah | om kridate namah | 40 || om lambodarasharirine namah | om pishangashmashrukeshaya
    namah | om arunaya namah | om kshayaya namah | om vikritaveshaya namah | om mundamaladharaya namah
    | om unmattaveshaya namah | om kinkinikataye namah | om amarshanaya namah | om kruraya namah | 50
    || om vishnubanadharaya namah | om nrisihmantyavasanaya namah | om krodadamshtravidharine namah |
    om gajadantagadaya namah | om godajinambaravasase namah | om tarunaya namah | om sharanyaya namah
    | om aranyapataye namah | om aprameyaya namah | om diptaya namah | 60 || om nirgunaya namah | om gunaya
    namah | om vadyapriyaya namah | om paraya namah | om cudamanidharaya namah | om tokaya namah | om
    cintyaya namah | om yogidhyeyaya namah | om shambhave namah | om vedantavedyaya namah | 70 || om bhavavaidyaya
    namah | om bhutaye namah | om ojase namah | om tejase namah | om bhrajate namah | om grasate namah
    | 76 || iti shivarahasyavyutpannam shravanamasakrite shivashatashtanamavalih sampurna ||
  devanagari: ॐ सुरथाय नमः । ॐ सुमध्याय नमः । ॐ मन्मथान्तकराय नमः । ॐ महोमयाय नमः । ॐ तीक्ष्णाय नमः ।
