id: lakshminarayanastotram
category: stotram
name:
  english: lakshminarayanastotram
  devanagari: लक्ष्मीनारायणस्तोत्रम्
content:
  english: lakshminarayanastotram shrivasudevanandasarasvati lakshminarayanastotram shrivasudevanandasarasvati
    || lakshminarayanastotram|| shrinivasa jagannatha shrihare bhaktavatsala| lakshmipate namastubhyam
    trahi mam bhavasagarat||1|| radharamana govimda bhaktakamaprapuraka narayana namastubhyam trahi mam
    bhavasagarat||2|| damodara mahodara sarvapattinivarana| hrishikesha namastubhyam trahi mam bhavasagarat||3||
    garudadhvaja vaikumthanivasinkeshavacyuta| janardana namastubhyam trahi mam bhavasagarat||4|| shamkhacakragadapadmadhara
    shrivatsalamchana| meghashyama namastubhyam trahi mam bhavasagarat||5|| tvam mata tvam pita bamdhuh
    sadgurustvam dayanidhih| tvatto
  devanagari: लक्ष्मीनारायणस्तोत्रम् श्रीवासुदेवानन्दसरस्वती लक्ष्मीनारायणस्तोत्रम् श्रीवासुदेवानन्दसरस्वती
    ।। लक्ष्मीनारायणस्तोत्रम्।। श्रीनिवास जगन्नाथ श्रीहरे भक्तवत्सल। लक्ष्मीपते नमस्तुभ्यं त्राहि मां
    भवसागरात्।।१।। राधारमण गोविंद भक्तकामप्रपूरक नारायण नमस्तुभ्यं त्राहि मां भवसागरात्।।२।। दामोदर महोदार
    सर्वापत्तिनिवारण। हृषीकेश नमस्तुभ्यं त्राहि मां भवसागरात्।।३।। गरुडध्वज वैकुंठनिवासिन्केशवाच्युत।
    जनार्दन नमस्तुभ्यं त्राहि मां भवसागरात्।।४।। शंखचक्रगदापद्मधर श्रीवत्सलांछन। मेघश्याम नमस्तुभ्यं त्राहि
    मां भवसागरात्।।५।। त्वं माता त्वं पिता बंधुः सद्गुरुस्त्वं दयानिधिः। त्वत्तो
