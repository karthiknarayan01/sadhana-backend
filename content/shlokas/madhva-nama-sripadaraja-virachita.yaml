id: madhva-nama-sripadaraja-virachita
category: stotram
name:
  english: Madhva Nama (Sripadaraja Virachita)
content:
  english: jaya jaya jagatrana jagadòlagè sutrana akhilaguna saddhama madhvanama || pa || ava kacchapa
    rupadindalandodakava ovi dharisida sheshamurutiyanu avavana balivididu hariya suraraiyduvaru a vayu
    namma kulagururayanu || || avavanu dehadòlagiralu hari nèlasihanu avavanu tòlagè hari ta tòlaguva
    avavanu dehada òla hòragè niyamakanu a vayu namma kulagururayanu || || karunabhimani suraru dehava
    bidalu kuruda kivuda mukanèndènisuva parama mukhya prana tòlagala dehavanu aritu pènanèndu peluvaru
    budhajana || || suraròlagè nararòlagè sarvabhutagalòlagè parataranènisi niyamisi nèlasiha hariyanalladè
    bagèya anyaranu lokadòlu gurukulatilaka mukhya pavamananu || || tretèyali raghupatiya sevè maduvènèndu
    vatasuta hanumantanèndènisida pota bhavadi tarani bimbakkè langhisida itagènèyaru mulokadòlagè ||
    || taranigabhimukhanagi shabdashastrava pathisi uravanisi hindumundagi nadèda parama pavamana suta
    udayasta shailagala bharadiyaididagitagupamè unte || || akhila vedagala sara pathisidanu munnalli
    nikhila vyakaranagala iva pelida mukhadalli kincidapashabda ivagillèndu mukhyapranananu ramananukarisida
    || || taranisutananu kaydu sharadhiyanu nèrèdati dharanisutèyala kandu dhanujaròdanè bharadi ranavanè
    madi gèlidu divyastragala uruhi lankèya banda hanumantanu || || harigè cudamaniyanittu harigala kudi
    sharadhiyanu katti balu rakkasaranu òrasi ranadali dashashirana hudiguttida mèrèda hanumanta balavanta
    dhira || || uragabandhakè siluki kapivararu maimarèyè taranikulatilakanajnèya talida girisahita sanjivanava
    kittu tanditta harivaragè sariyuntè hanumantagè || || vijaya raghupati mècci dharanisutèyaligiyè bhajisi
    mauktikada haravanu padèda ajapadaviyanu rama kòdèvènènè hanumanta nija bhakutiyanè bedi varava padèda
    || || a marutanè bhimanènisi dvaparadalli somakuladali janisi parthanòdanè bhima vikrama rakkasara
    muridòttida a mahima namma kulagururayanu || || karadinda shishubhavanada bhimana bidalu giravadidu
    shatashringavèndènitu harigala harigalim karigala karigalim arèva virarigè sura nararu sariye || ||
    kurupa garalavanikkè nèrè undu tegi hasiduragagala myalè bidaladanòrasida araginaramanèyalli uriyanikkalu
    vira dharisi jahnavigòyda tannanujara || || allirda baka hidimbakarèmba rakkasara nilladòrasida lokakantakaranu
    ballidasurara gèlidu draupadiya kaivididu èlla sujanarigè harushava torida || || rajakula vajranènisida
    magadhana sili rajasuyagavanu madisidanu ajiyòlu kauravara balava savaruvènèndu mujagavariyè kankana
    kattida || || danavara savarabekèndu byaga mananidhi draupadiya manadingitavanaritu kananava pòkku
    kimmaradigala muridu maninigè saugandhikavanè tanda || || durula kicakanu ta draupadiya cèluvikègè
    marulagi karakariya madalavana garadi manèyali barasi avananvayava kurupanattida mallakulava sadèda
    || || kauravara bala savari vairigala nèggòtti orantè kauravana muridu mèrèda vairi dushshasanna ranadalli
    èdagèdahi vira narahariya lilèya torida || || gurusutanu sangaradi narayanastravanu uravanisi bidalu
    shastrava bisutaru harikripèya padèdirda bhima hunkaradim hariya divyastravanu nèrè attida || || canda
    vikramanu gadègòndu ranadi bhu mandaladòlidiranta khalaranèlla hindi bisutiha vrikodarana pratapavanu
    kandu nilluvararu tribhuvanadòlu || || danavaru kaliyugadòlavatarisi vibudharòlu venana matavanaruhaladanaritu
    jnani ta pavamana bhutaladòlavatarisi mananidhi madhvakhyanèndènisida || || arbhakatanadòlaidi badariyali
    madhvamuni nirbhayadi sakala shastrava pathisida urviyòlu mayè biralu tattvamargavanu orva madhvamuni
    torda sujanargè || || sarvesha hari vishva èlla ta pusiyèmba durvadigala matava nèrè khandisi sarvesha
    hari vishva satyavèndaruhida sharvadi girvana santatiyali || || badarikashramakè punarapiyaidi vyasamuni
    padakèragi akhila vedarthagalanu padumanabhana mukhadi tilidu brahmatva yaidida madhvamunirayagabhivandipè
    || || jaya jayatu durvadimatatimira marta da jayajayatu vadigajapancanana jayajayatu carvakagarvaparvatakulisha
    jayajayatu jagannatha madhvanatha || || tungakula guruvarana hritkamaladali nilisi bhangavilladè sukhava
    sujanakèlla hingadè kòduva namma madhvantaratmaka rangavithalanèndu nèrè sarirai || soma suryoparagadi
    gosahasragala bhumidevarigè suranadiya tatadi shrimukundarpanavènuta kòtta phalamakku i madhvanama
    barèdodidargè || || putrarilladavaru satputraraiduvaru sarvatradali digvijayavahudu sakala shatrugalu
    kèduvarapamrityu baralanjuvudu sutranamakana samstuti matradi || || shripadaraya pelida madhvanama
    sam tapakalèdakhila saukhyavanivudu shripati jagannathavithalana tori bhava kuparadinda kadè hayisuvudu
    ||
  devanagari: जय जय जगत्राण जगदॊलगॆ सुत्राण अखिलगुण सद्धाम मध्वनाम ॥ प ॥ आव कच्छप रूपदिन्दलण्डोदकव ओवि
    धरिसिद शेषमूरुतियनु आववन बलिविडिदु हरिय सुररैय्दुवरु आ वायु नम्म कुलगुरुरायनु ॥ ॥ आववनु देहदॊलगिरलु
    हरि नॆलसिहनु आववनु तॊलगॆ हरि ता तॊलगुव आववनु देहदा ऒल हॊरगॆ नियामकनु आ वायु नम्म कुलगुरुरायनु ॥ ॥
    करुणाभिमानि सुररु देहव बिडलु कुरुड किवुड मूकनॆन्दॆनिसुव परम मुख्य प्राण तॊलगला देहवनु अरितु पॆणनॆन्दु
    पेलुवरु बुधजन ॥ ॥ सुररॊलगॆ नररॊलगॆ सर्वभूतगलॊलगॆ परतरनॆनिसि नियामिसि नॆलसिह हरियनल्लदॆ बगॆय अन्यरनु
    लोकदॊलु गुरुकुलतिलक मुख्य पवमाननु ॥ ॥ त्रेतॆयलि रघुपतिय सेवॆ माडुवॆनॆन्दु वातसुत हनुमन्तनॆन्दॆनिसिद
    पोत भावदि तरणि बिम्बक्कॆ लङ्घिसिद ईतगॆणॆयारु मूलोकदॊलगॆ ॥ ॥ तरणिगभिमुखनागि शब्दशास्त्रव पठिसि उरवणिसि
    हिन्दुमुन्दागि नडॆद परम पवमान सुत उदयास्त शैलगल भरदियैदिदगीतगुपमॆ उण्टे ॥ ॥ अखिल वेदगल सार पठिसिदनु
    मुन्नल्लि निखिल व्याकरणगल इव पेलिद मुखदल्लि किञ्चिदपशब्द इवगिल्लॆन्दु मुख्यप्राणननु रामननुकरिसिद ॥
    ॥ तरणिसुतननु काय्दु शरधियनु नॆरॆदाटि धरणिसुतॆयल कण्डु धनुजरॊडनॆ भरदि रणवनॆ माडि गॆलिदु दिव्यास्त्रगल
    उरुहि लङ्कॆय बन्द हनुमन्तनु ॥ ॥ हरिगॆ चूडामणियनित्तु हरिगल कूडि शरधियनु कट्टि बलु रक्कसरनु ऒरसि रणदलि
    दशशिरन हुडिगुट्टिद मॆरॆद हनुमन्त बलवन्त धीर ॥ ॥ उरगबन्धकॆ सिलुकि कपिवररु मैमरॆयॆ तरणिकुलतिलकनाज्ञॆय
    तालिद गिरिसहित सञ्जीवनव कित्तु तन्दित्त हरिवरगॆ सरियुण्टॆ हनुमन्तगॆ ॥ ॥ विजय रघुपति मॆच्चि धरणिसुतॆयलिगीयॆ
    भजिसि मौक्तिकद हारवनु पडॆद अजपदवियनु राम कॊडॆवॆनॆनॆ हनुमन्त निज भकुतियनॆ बेडि वरव पडॆद ॥ ॥ आ मारुतनॆ
    भीमनॆनिसि द्वापरदल्लि सोमकुलदलि जनिसि पार्थनॊडनॆ भीम विक्रम रक्कसर मुरिदॊट्टिद आ महिम नम्म कुलगुरुरायनु
    ॥ ॥ करदिन्द शिशुभावनाद भीमन बिडलु गिरवडिदु शतशृङ्गवॆन्दॆनितु हरिगल हरिगलिं करिगल करिगलिं अरॆव वीररिगॆ
    सुर नररु सरिये ॥ ॥ कुरुप गरलवनिक्कॆ नॆरॆ उण्डु तेगि हसिदुरगगल म्यालॆ बिडलदनॊरसिद अरगिनरमनॆयल्लि उरियनिक्कलु
    वीर धरिसि जाह्नविगॊय्द तन्ननुजर ॥ ॥ अल्लिर्द बक हिडिम्बकरॆम्ब रक्कसर निल्लदॊरसिद लोककण्टकरनु बल्लिदसुरर
    गॆलिदु द्रौपदिय कैविडिदु ऎल्ल सुजनरिगॆ हरुषव तोरिद ॥ ॥ राजकुल वज्रनॆनिसिद मागधन सीलि राजसूयागवनु माडिसिदनु
    आजियॊलु कौरवर बलव सवरुवॆनॆन्दु मूजगवरियॆ कङ्कण कट्टिद ॥ ॥ दानवर सवरबेकॆन्दु ब्याग माननिधि द्रौपदिय
    मनदिङ्गितवनरितु काननव पॊक्कु किम्मारादिगल मुरिदु मानिनिगॆ सौगन्धिकवनॆ तन्द ॥ ॥ दुरुल कीचकनु ता द्रौपदिय
    चॆलुविकॆगॆ मरुलागि करकरिय माडलवना गरडि मनॆयलि बरसि अवनन्वयव कुरुपनट्टिद मल्लकुलव सदॆद ॥ ॥ कौरवर बल
    सवरि वैरिगल नॆग्गॊत्ति ओरन्तॆ कौरवन मुरिदु मॆरॆद वैरि दुश्शासन्न रणदल्लि ऎडगॆडहि वीर नरहरिय लीलॆय
    तोरिद ॥ ॥ गुरुसुतनु सङ्गरदि नारायणास्त्रवनु उरवणिसि बिडलु शस्त्रव बिसुटरु हरिकृपॆय पडॆदिर्द भीम हुङ्कारदिं
    हरिय दिव्यास्त्रवनु नॆरॆ अट्टिद ॥ ॥ चण्ड विक्रमनु गदॆगॊण्डु रणदि भू मण्डलदॊलिदिरान्त खलरनॆल्ला हिण्डि
    बिसुटिह वृकोदरन प्रतापवनु कण्डु निल्लुवरारु त्रिभुवनदॊलु ॥ ॥ दानवरु कलियुगदॊलवतरिसि विबुधरॊलु वेनन
    मतवनरुहलदनरितु ज्ञानि ता पवमान भूतलदॊलवतरिसि माननिधि मध्वाख्यनॆन्दॆनिसिद ॥ ॥ अर्भकतनदॊलैदि बदरियलि
    मध्वमुनि निर्भयदि सकल शास्त्रव पठिसिद उर्वियॊलु मायॆ बीरलु तत्त्वमार्गवनु ओर्व मध्वमुनि तोर्द सुजनर्गॆ
    ॥ ॥ सर्वेश हरि विश्व ऎल्ल ता पुसियॆम्ब दुर्वादिगल मतव नॆरॆ खण्डिसि सर्वेश हरि विश्व सत्यवॆन्दरुहिदा
    शर्वादि गीर्वाण सन्ततियलि ॥ ॥ बदरिकाश्रमकॆ पुनरपियैदि व्यासमुनि पदकॆरगि अखिल वेदार्थगलनु पदुमनाभन
    मुखदि तिलिदु ब्रह्मत्व यैदिद मध्वमुनिरायगभिवन्दिपॆ ॥ ॥ जय जयतु दुर्वादिमततिमिर मार्ता ड जयजयतु वादिगजपञ्चानन
    जयजयतु चार्वाकगर्वपर्वतकुलिश जयजयतु जगन्नाथ मध्वनाथ ॥ ॥ तुङ्गकुल गुरुवरन हृत्कमलदलि निलिसि भङ्गविल्लदॆ
    सुखव सुजनकॆल्ल हिङ्गदॆ कॊडुव नम्म मध्वान्तरात्मक रङ्गविठलनॆन्दु नॆरॆ सारिरै ॥ सोम सूर्योपरागदि गोसहस्रगल
    भूमिदेवरिगॆ सुरनदिय तटदि श्रीमुकुन्दार्पणवॆनुत कॊट्ट फलमक्कु ई मध्वनाम बरॆदोदिदर्गॆ ॥ ॥ पुत्ररिल्लदवरु
    सत्पुत्ररैदुवरु सर्वत्रदलि दिग्विजयवहुदु सकल शत्रुगलु कॆडुवरपमृत्यु बरलञ्जुवुदु सूत्रनामकन संस्तुति
    मात्रदि ॥ ॥ श्रीपादराय पेलिद मध्वनाम सं तापकलॆदखिल सौख्यवनीवुदु श्रीपति जगन्नाथविठलन तोरि भव कूपारदिन्द
    कडॆ हायिसुवुदु ॥
