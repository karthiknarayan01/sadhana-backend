id: vakratundakavac-2
category: raksha
name:
  english: vakratundakavac
  devanagari: वक्रतुण्डकवच्
content:
  english: vakratundaganeshakavacam athava ganesharakshakaram stotram shri ganeshaya namah | maulim maheshaputro'vyadbhalam
    patu vinayakah | trinetrah patu me netre shurpakarno'vatu shruti || 1|| herambo rakshatu ghranam mukham
    patu gajananah | jihvam patu ganesho me kantham shrikanthavallabhah || 2|| skandhau mahabalah patu
    vighnaha patu me bhujau | karau parashubhritpatu hridayam skandapurvajah || 3|| madhyam lambodarah
    patu nabhim sindurabhushitah | jaghanam parvatiputrah sakthini patu pashabhrit || 4|| januni jagatam
    natho janghe mushakavahanah | padau padmasanah patu padadho daityadarpaha || 5|| ekadanto'gratah patu
    prishthe patu ganadhipah | parshvayormodakaharo digvidikshu ca siddhidah || 6|| vrajatastishthato
    vapi jagratah svapato'shnatah | caturthivallabho devah patu me bhuktimuktidah || 7|| idam pavitram
    stotram ca caturthyam niyatah pathet | sinduraraktah kusumairdurvaya pujya vighnapam || 8|| raja rajasuto
    rajapatni mantri kulam calam | tasyavashyam bhavedvashyam vighnarajaprasadatah || 9|| samantrayantram
    yah stotram kare samlikhya dharayet | dhanadhanyasamriddhih syattasya nastyatra samshayah || 10||
    asya mantrah | aim klim hrim vakratundaya hum | rasalaksham sadaikagryah shadanganyasapurvakam | hutva
    tadante vidhivadashtadravyam payo ghritam || 11|| yam yam kamamabhidhyayan kurute karma kincana |
    tam tam sarvamavapnoti vakratundaprasadatah || 12|| bhrigupranitam yah stotram pathate bhuvi manavah
    | bhavedavyahataishvaryah sa ganeshaprasadatah || 13|| || iti ganesharakshakaram stotram samaptam
    ||
  devanagari: वक्रतुण्डगणेशकवचम् अथवा गणेशरक्षाकरं स्तोत्रम् श्री गणेशाय नमः । मौलिं महेशपुत्रोऽव्याद्भालं
    पातु विनायकः । त्रिनेत्रः पातु मे नेत्रे शूर्पकर्णोऽवतु श्रुती ॥ १॥ हेरम्बो रक्षतु घ्राणं मुखं पातु
    गजाननः । जिह्वां पातु गणेशो मे कण्ठं श्रीकण्ठवल्लभः ॥ २॥ स्कन्धौ महाबलः पातु विघ्नहा पातु मे भुजौ
    । करौ परशुभृत्पातु हृदयं स्कन्दपूर्वजः ॥ ३॥ मध्यं लम्बोदरः पातु नाभिं सिन्दूरभूषितः । जघनं पार्वतीपुत्रः
    सक्थिनी पातु पाशभृत् ॥ ४॥ जानुनी जगतां नाथो जङ्घे मूषकवाहनः । पादौ पद्मासनः पातु पादाधो दैत्यदर्पहा
    ॥ ५॥ एकदन्तोऽग्रतः पातु पृष्ठे पातु गणाधिपः । पार्श्वयोर्मोदकाहारो दिग्विदिक्षु च सिद्धिदः ॥ ६॥ व्रजतस्तिष्ठतो
    वापि जाग्रतः स्वपतोऽश्नतः । चतुर्थीवल्लभो देवः पातु मे भुक्तिमुक्तिदः ॥ ७॥ इदं पवित्रं स्तोत्रं च
    चतुर्थ्यां नियतः पठेत् । सिन्दूररक्तः कुसुमैर्दूर्वया पूज्य विघ्नपम् ॥ ८॥ राजा राजसुतो राजपत्नी मन्त्री
    कुलं चलम् । तस्यावश्यं भवेद्वश्यं विघ्नराजप्रसादतः ॥ ९॥ समन्त्रयन्त्रं यः स्तोत्रं करे संलिख्य धारयेत्
    । धनधान्यसमृद्धिः स्यात्तस्य नास्त्यत्र संशयः ॥ १०॥ अस्य मन्त्रः । ऐं क्लीं ह्रीं वक्रतुण्डाय हुं
    । रसलक्षं सदैकाग्र्यः षडङ्गन्यासपूर्वकम् । हुत्वा तदन्ते विधिवदष्टद्रव्यं पयो घृतम् ॥ ११॥ यं यं काममभिध्यायन्
    कुरुते कर्म किञ्चन । तं तं सर्वमवाप्नोति वक्रतुण्डप्रसादतः ॥ १२॥ भृगुप्रणीतं यः स्तोत्रं पठते भुवि
    मानवः । भवेदव्याहतैश्वर्यः स गणेशप्रसादतः ॥ १३॥ ॥ इति गणेशरक्षाकरं स्तोत्रं समाप्तम् ॥
