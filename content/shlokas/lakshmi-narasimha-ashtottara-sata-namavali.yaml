    नमः ॐ स्तम्भजाय नमः ॐ उग्रलोचनाय नमः ॐ रौद्राय नमः ॐ सर्वाद्भुताय नमः ॥ ॥ ॐ श्रीमते नमः ॐ योगानन्दाय
