    सुभग ओहार उघारी। देखि दुलहिनिन्ह होहिं सुखारी ॥ दो एहि बिधि सबही देत सुखु आए राजदुआर। मुदित मातु परुछनि
    करहिं बधुन्ह समेत कुमार ॥ ॥ करहिं आरती बारहिं बारा। प्रेमु प्रमोदु कहै को पारा ॥ भूषन मनि पट नाना
    जाती ॥ करही निछावरि अगनित भाँती ॥ बधुन्ह समेत देखि सुत चारी। परमानन्द मगन महतारी ॥ पुनि पुनि सीय राम
    छबि देखी ॥ मुदित सफल जग जीवन लेखी ॥ सखीं सीय मुख पुनि पुनि चाही। गान करहिं निज सुकृत सराही ॥ बरषहिं
    सुमन छनहिं छन देवा। नाचहिं गावहिं लावहिं सेवा ॥ देखि मनोहर चारिउ जोरीं। सारद उपमा सकल ढँढोरीम् ॥ देत
    न बनहिं निपट लघु लागी। एकटक रहीं रूप अनुरागीम् ॥ दो निगम नीति कुल रीति करि अरघ पाँवड़ए देत। बधुन्ह
    सहित सुत परिछि सब चलीं लवाइ निकेत ॥ ॥ चारि सिङ्घासन सहज सुहाए। जनु मनोज निज हाथ बनाए ॥ तिन्ह पर कुअँरि
    कुअँर बैठारे। सादर पाय पुनित पखारे ॥ धूप दीप नैबेद बेद बिधि। पूजे बर दुलहिनि मङ्गलनिधि ॥ बारहिं बार
    आरती करहीं। ब्यजन चारु चामर सिर ढरहीम् ॥ बस्तु अनेक निछावर होहीं। भरीं प्रमोद मातु सब सोहीम् ॥ पावा
    परम तत्त्व जनु जोगीं। अमृत लहेउ जनु सन्तत रोगीम् ॥ जनम रङ्क जनु पारस पावा। अन्धहि लोचन लाभु सुहावा
    ॥ मूक बदन जनु सारद छाई। मानहुँ समर सूर जय पाई ॥ दो एहि सुख ते सत कोटि गुन पावहिं मातु अनन्दु ॥ भाइन्ह
    सहित बिआहि घर आए रघुकुलचन्दु ॥ ॥ लोक रीत जननी करहिं बर दुलहिनि सकुचाहिं। मोदु बिनोदु बिलोकि बड़ रामु
    मनहिं मुसकाहिम् ॥ ॥ देव पितर पूजे बिधि नीकी। पूजीं सकल बासना जी की ॥ सबहिं बन्दि मागहिं बरदाना। भाइन्ह
    सहित राम कल्याना ॥ अन्तरहित सुर आसिष देहीं। मुदित मातु अञ्चल भरि लेंहीम् ॥ भूपति बोलि बराती लीन्हे।
    जान बसन मनि भूषन दीन्हे ॥ आयसु पाइ राखि उर रामहि। मुदित गे सब निज निज धामहि ॥ पुर नर नारि सकल पहिराए।
    घर घर बाजन लगे बधाए ॥ जाचक जन जाचहि जोइ जोई। प्रमुदित राउ देहिं सोइ सोई ॥ सेवक सकल बजनिआ नाना। पूरन
    किए दान सनमाना ॥ दो देंहिं असीस जोहारि सब गावहिं गुन गन गाथ। तब गुर भूसुर सहित गृहँ गवनु कीन्ह नरनाथ
    ॥ ॥ जो बसिष्ठ अनुसासन दीन्ही। लोक बेद बिधि सादर कीन्ही ॥ भूसुर भीर देखि सब रानी। सादर उठीं भाग्य बड़
    जानी ॥ पाय पखारि सकल अन्हवाए। पूजि भली बिधि भूप जेवाँए ॥ आदर दान प्रेम परिपोषे। देत असीस चले मन तोषे
    ॥ बहु बिधि कीन्हि गाधिसुत पूजा। नाथ मोहि सम धन्य न दूजा ॥ कीन्हि प्रसंसा भूपति भूरी। रानिन्ह सहित
    लीन्हि पग धूरी ॥ भीतर भवन दीन्ह बर बासु। मन जोगवत रह नृप रनिवासू ॥ पूजे गुर पद कमल बहोरी। कीन्हि बिनय
    उर प्रीति न थोरी ॥ दो बधुन्ह समेत कुमार सब रानिन्ह सहित महीसु। पुनि पुनि बन्दत गुर चरन देत असीस मुनीसु
    ॥ ॥ बिनय कीन्हि उर अति अनुरागें। सुत सम्पदा राखि सब आगेम् ॥ नेगु मागि मुनिनायक लीन्हा। आसिरबादु बहुत
    बिधि दीन्हा ॥ उर धरि रामहि सीय समेता। हरषि कीन्ह गुर गवनु निकेता ॥ बिप्रबधू सब भूप बोलाई। चैल चारु
    भूषन पहिराई ॥ बहुरि बोलाइ सुआसिनि लीन्हीं। रुचि बिचारि पहिरावनि दीन्हीम् ॥ नेगी नेग जोग सब लेहीं।
    रुचि अनुरुप भूपमनि देहीम् ॥ प्रिय पाहुने पूज्य जे जाने। भूपति भली भाँति सनमाने ॥ देव देखि रघुबीर बिबाहू।
    बरषि प्रसून प्रसंसि उछाहू ॥ दो चले निसान बजाइ सुर निज निज पुर सुख पाइ। कहत परसपर राम जसु प्रेम न हृदयँ
    समाइ ॥ ॥ सब बिधि सबहि समदि नरनाहू। रहा हृदयँ भरि पूरि उछाहू ॥ जहँ रनिवासु तहाँ पगु धारे। सहित बहूटिन्ह
    कुअँर निहारे ॥ लिए गोद करि मोद समेता। को कहि सकि भयु सुखु जेता ॥ बधू सप्रेम गोद बैठारीं। बार बार हियँ
    हरषि दुलारीम् ॥ देखि समाजु मुदित रनिवासू। सब कें उर अनन्द कियो बासू ॥ कहेउ भूप जिमि भयु बिबाहू। सुनि
    हरषु होत सब काहू ॥ जनक राज गुन सीलु बड़आई। प्रीति रीति सम्पदा सुहाई ॥ बहुबिधि भूप भाट जिमि बरनी। रानीं
    सब प्रमुदित सुनि करनी ॥ दो सुतन्ह समेत नहाइ नृप बोलि बिप्र गुर ग्याति। भोजन कीन्ह अनेक बिधि घरी पञ्च
    गि राति ॥ ॥ मङ्गलगान करहिं बर भामिनि। भै सुखमूल मनोहर जामिनि ॥ अँचि पान सब काहूँ पाए। स्त्रग सुगन्ध
    भूषित छबि छाए ॥ रामहि देखि रजायसु पाई। निज निज भवन चले सिर नाई ॥ प्रेम प्रमोद बिनोदु बढ़आई। समु समाजु
    मनोहरताई ॥ कहि न सकहि सत सारद सेसू। बेद बिरञ्चि महेस गनेसू ॥ सो मै कहौं कवन बिधि बरनी। भूमिनागु सिर
    धरि कि धरनी ॥ नृप सब भाँति सबहि सनमानी। कहि मृदु बचन बोलाई रानी ॥ बधू लरिकनीं पर घर आईं। राखेहु नयन
    पलक की नाई ॥ दो लरिका श्रमित उनीद बस सयन करावहु जाइ। अस कहि गे बिश्रामगृहँ राम चरन चितु लाइ ॥ ॥ भूप
    बचन सुनि सहज सुहाए। जरित कनक मनि पलँग डसाए ॥ सुभग सुरभि पय फेन समाना। कोमल कलित सुपेतीं नाना ॥ उपबरहन
    बर बरनि न जाहीं। स्त्रग सुगन्ध मनिमन्दिर माहीम् ॥ रतनदीप सुठि चारु चँदोवा। कहत न बनि जान जेहिं जोवा
    ॥ सेज रुचिर रचि रामु उठाए। प्रेम समेत पलँग पौढ़आए ॥ अग्या पुनि पुनि भाइन्ह दीन्ही। निज निज सेज सयन
    तिन्ह कीन्ही ॥ देखि स्याम मृदु मञ्जुल गाता। कहहिं सप्रेम बचन सब माता ॥ मारग जात भयावनि भारी। केहि
    बिधि तात ताड़का मारी ॥ दो घोर निसाचर बिकट भट समर गनहिं नहिं काहु ॥ मारे सहित सहाय किमि खल मारीच सुबाहु
    ॥ ॥ मुनि प्रसाद बलि तात तुम्हारी। ईस अनेक करवरें टारी ॥ मख रखवारी करि दुहुँ भाई। गुरु प्रसाद सब बिद्या
    पाई ॥ मुनितय तरी लगत पग धूरी। कीरति रही भुवन भरि पूरी ॥ कमठ पीठि पबि कूट कठोरा। नृप समाज महुँ सिव
    धनु तोरा ॥ बिस्व बिजय जसु जानकि पाई। आए भवन ब्याहि सब भाई ॥ सकल अमानुष करम तुम्हारे। केवल कौसिक कृपाँ
    सुधारे ॥ आजु सुफल जग जनमु हमारा। देखि तात बिधुबदन तुम्हारा ॥ जे दिन गे तुम्हहि बिनु देखें। ते बिरञ्चि
    जनि पारहिं लेखेम् ॥ दो राम प्रतोषीं मातु सब कहि बिनीत बर बैन। सुमिरि सम्भु गुर बिप्र पद किए नीदबस
    नैन ॥ ॥ नीदुँ बदन सोह सुठि लोना। मनहुँ साँझ सरसीरुह सोना ॥ घर घर करहिं जागरन नारीं। देहिं परसपर मङ्गल
    गारीम् ॥ पुरी बिराजति राजति रजनी। रानीं कहहिं बिलोकहु सजनी ॥ सुन्दर बधुन्ह सासु लै सोई। फनिकन्ह जनु
    सिरमनि उर गोई ॥ प्रात पुनीत काल प्रभु जागे। अरुनचूड़ बर बोलन लागे ॥ बन्दि मागधन्हि गुनगन गाए। पुरजन
    द्वार जोहारन आए ॥ बन्दि बिप्र सुर गुर पितु माता। पाइ असीस मुदित सब भ्राता ॥ जननिन्ह सादर बदन निहारे।
    भूपति सङ्ग द्वार पगु धारे ॥ दो कीन्ह सौच सब सहज सुचि सरित पुनीत नहाइ। प्रातक्रिया करि तात पहिं आए
    चारिउ भाइ ॥ तीसरा विश्राम भूप बिलोकि लिए उर लाई। बैठै हरषि रजायसु पाई ॥ देखि रामु सब सभा जुड़आनी।
    लोचन लाभ अवधि अनुमानी ॥ पुनि बसिष्टु मुनि कौसिक आए। सुभग आसनन्हि मुनि बैठाए ॥ सुतन्ह समेत पूजि पद
    लागे। निरखि रामु दौ गुर अनुरागे ॥ कहहिं बसिष्टु धरम इतिहासा। सुनहिं महीसु सहित रनिवासा ॥ मुनि मन अगम
    गाधिसुत करनी। मुदित बसिष्ट बिपुल बिधि बरनी ॥ बोले बामदेउ सब साँची। कीरति कलित लोक तिहुँ माची ॥ सुनि
    आनन्दु भयु सब काहू। राम लखन उर अधिक उछाहू ॥ दो मङ्गल मोद उछाह नित जाहिं दिवस एहि भाँति। उमगी अवध अनन्द
    भरि अधिक अधिक अधिकाति ॥ ॥ सुदिन सोधि कल कङ्कन छौरे। मङ्गल मोद बिनोद न थोरे ॥ नित नव सुखु सुर देखि
    सिहाहीं। अवध जन्म जाचहिं बिधि पाहीम् ॥ बिस्वामित्रु चलन नित चहहीं। राम सप्रेम बिनय बस रहहीम् ॥ दिन
    दिन सयगुन भूपति भ् । देखि सराह महामुनिर् ॥ मागत बिदा राउ अनुरागे। सुतन्ह समेत ठाढ़ भे आगे ॥ नाथ सकल
    सम्पदा तुम्हारी। मैं सेवकु समेत सुत नारी ॥ करब सदा लरिकनः पर छोहू। दरसन देत रहब मुनि मोहू ॥ अस कहि
    राउ सहित सुत रानी। परेउ चरन मुख आव न बानी ॥ दीन्ह असीस बिप्र बहु भाँती। चले न प्रीति रीति कहि जाती
    ॥ रामु सप्रेम सङ्ग सब भाई। आयसु पाइ फिरे पहुँचाई ॥ दो राम रूपु भूपति भगति ब्याहु उछाहु अनन्दु। जात
    सराहत मनहिं मन मुदित गाधिकुलचन्दु ॥ ॥ बामदेव रघुकुल गुर ग्यानी। बहुरि गाधिसुत कथा बखानी ॥ सुनि मुनि
    सुजसु मनहिं मन र् । बरनत आपन पुन्य प्रभ् ॥ बहुरे लोग रजायसु भयू। सुतन्ह समेत नृपति गृहँ गयू ॥ जहँ
    तहँ राम ब्याहु सबु गावा। सुजसु पुनीत लोक तिहुँ छावा ॥ आए ब्याहि रामु घर जब तें। बसि अनन्द अवध सब तब
    तेम् ॥ प्रभु बिबाहँ जस भयु उछाहू। सकहिं न बरनि गिरा अहिनाहू ॥ कबिकुल जीवनु पावन जानी ॥ राम सीय जसु
    मङ्गल खानी ॥ तेहि ते मैं कछु कहा बखानी। करन पुनीत हेतु निज बानी ॥ छं निज गिरा पावनि करन कारन राम जसु
    तुलसी कह्यो। रघुबीर चरित अपार बारिधि पारु कबि कौनें लह्यो ॥ उपबीत ब्याह उछाह मङ्गल सुनि जे सादर गावहीं।
    बैदेहि राम प्रसाद ते जन सर्बदा सुखु पावहीम् ॥ सो सिय रघुबीर बिबाहु जे सप्रेम गावहिं सुनहिं। तिन्ह
    कहुँ सदा उछाहु मङ्गलायतन राम जसु ॥ बारहवाँ विश्राम इति श्रीमद्रामचरितमानसे सकलकलिकलुषबिध्वंसने प्रथमः
    सोपानः समाप्तः।
