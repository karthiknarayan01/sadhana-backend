id: shodashih-idaya
category: hridaya
name:
  english: shodashihṟidaya
  devanagari: षोडशीह्ऱिदय
content:
  english: kaulikalikalitanghrikanjakam balarkanantashocirnnijatanukiranairddipayantim digantan diptairddediptamanam
    danujadalavananalpadavanalabham | dantodantogracitam dalitaditisutam darshaniyam durantam devim dinardracittam
    hridi muditamanah shodashim samsmarami || 11|| dhirandhanyandharitridhavavidhritashiro dhutadhulyabjapadam
    ghrishtandharadharadho vinidhritacapalacarucandaprabhabham | dharmyandhutopaharandharanisuradhavoddharinim
    dhyeyarupam dhimaddhanyatidhanyandhanadadhanavritam sundarim cintayami || 12|| jayatu jayatu jalpa
    yogini yogayukta jayatu jayatu saumya sundari sundarasya | jayatu jayatu padma padmini keshavasya
    jayatu jayatu kali kalini kalakanta || 13|| jayatu jayatu kharva shodashi vedahasta jayatu jayatu
    dhatri dharmini dhatrishantih | jayatu jayatu vani brahmano brahmavandya jayatu jayatu durga darini
    devashatroh || 14|| devi tvam srishtikale kamalabhavabhrita rajasi raktarupa rakshakale tvamamba harihridayadhrita
    satviki shvetarupa | bhurikrodha bhavante bhavabhavanagata tamasi krishnarupa etashcanyastvameva kshitamanujamala
    sundari kevaladya || 15|| sumalashamanametaddevi gopyam gunajne grahanamananayogyam shodashiyam khalaghnam
    | suratarusamashilam sampradam pathakanam prabhavati hridayakhyam stotramatyantamanyam || 16|| idam
    tripurasundaryah shodashyah paramadbhutam | yah sha
  devanagari: कौलिकालिकलितान्घ्रिकञ्जकां बालार्कानन्तशोचिर्न्निजतनुकिरणैर्द्दीपयन्तीं दिगन्तान् दीप्तैर्द्देदीप्तमानां
    दनुजदलवनानल्पदावानलाभाम् । दान्तोदन्तोग्रचितां दलितदितिसुतां दर्शनीयां दुरन्तां देवीं दीनार्द्रचित्तां
    हृदि मुदितमनाः षोडशीं संस्मरामि ॥ ११॥ धीरान्धन्यान्धरित्रीधवविधृतशिरो धूतधूल्यब्जपादां घृष्टान्धाराधराधो
    विनिधृतचपलाचारुचन्दप्रभाभाम् । धर्म्यान्धूतोपहारान्धरणिसुरधवोद्धारिणीं ध्येयरूपां धीमद्धन्यातिधन्यान्धनदधनवृतां
    सुन्दरीं चिन्तयामि ॥ १२॥ जयतु जयतु जल्पा योगिनी योगयुक्ता जयतु जयतु सौम्या सुन्दरी सुन्दरास्या । जयतु
    जयतु पद्मा पद्मिनी केशवस्य जयतु जयतु काली कालिनी कालकान्ता ॥ १३॥ जयतु जयतु खर्वा षोडशी वेदहस्ता जयतु
    जयतु धात्री धर्मिणी धातृशान्तिः । जयतु जयतु वाणी ब्रह्मणो ब्रह्मवन्द्या जयतु जयतु दुर्गा दारिणी देवशत्रोः
    ॥ १४॥ देवि त्वं सृष्टिकाले कमलभवभृता राजसी रक्तरूपा रक्षाकाले त्वमम्बा हरिहृदयधृता सात्विकी श्वेतरूपा
    । भूरिक्रोधा भवान्ते भवभवनगता तामसी कृष्णरूपा एताश्चान्यास्त्वमेव क्षितमनुजमला सुन्दरी केवलाद्या ॥
    १५॥ सुमलशमनमेतद्देवि गोप्यं गुणज्ञे ग्रहणमननयोग्यं षोडशीयं खलघ्नम् । सुरतरुसमशीलं सम्प्रदं पाठकानां
    प्रभवति हृदयाख्यं स्तोत्रमत्यन्तमान्यम् ॥ १६॥ इदं त्रिपुरसुन्दर्याः षोडश्याः परमाद्भुतम् । यः श
