id: shastridashakam
category: stotram
name:
  english: shastridashakam
  devanagari: शास्त्रिदशकम्
content:
  english: shrimahashastri dashakam pandyabhupatindra purva punyamohanakrite panditarcitanghri pundarika
    pavanakrite purnacandratunda vetradandaviryavaridhe purnapushkalasameta bhutanatha pahi mam || 1 adishankaracyuta
    priyatmasambhavaprabho adibhutanatha sadhu bhaktacintitaprada bhutibhusha vedaghosha paritosha shasvata
    purnapushkalasameta bhutanatha pahi mam || 2 pancabanakoti komaḻakrite kripanidhe pancagavyapayasanna
    panakadimodita pancabhuta sancayaprapancabhutapalaka purnapushkalasameta bhutanatha pahi mam || 3
    candrasurya vitihotra netra vaktramohana sandrasundara smitardra kesarindravahana indravandaniyapada
    sadhuvrindajivana purnapushkalasameta bhutanatha pahi mam || 4 atyudarabhakta cittaranga nartana prabho
    nityashuddha nirmaladvitiyadharmapalaka satyarupa muktirupa sarvadevatatmaka purnapushkalasameta bhutanatha
    pahi mam || 5 virabahu varnaniya viryashauryavaridhe varijasanadi devavandya sundarakrite varanendra
    vajisimhavaha bhaktashevadhe purnapushkalasameta bhutanatha pahi mam || 6 samaganalola shantashila
    dharma palaka somasundarasya sadhupujaniya paduka samadanabhedadanda shastraniti bodhaka purnapushkalasameta
    bhutanatha pahi mam || 7 suprasanna devadeva satgati pradayaka citprakashadharmapala sarvabhutanayaka
    suprasiddha pancashaila sanniketana nartaka purnapushkalasameta bhutanatha pahi mam || 8 shula
  devanagari: श्रीमहाशास्तृ दशकम् पाण्ड्यभूपतीन्द्र पूर्व पुण्यमोहनाकृते पण्डितार्चिताङ्घ्रि पुण्डरीक
    पावनाकृते पूर्णचन्द्रतुण्ड वेत्रदण्डवीर्यवारिधे पूर्णपुष्कलासमेत भूतनाथ पाहि माम् ॥ १ आदिशङ्कराच्युत
    प्रियात्मसंभवप्रभो आदिभूतनाथ साधु भक्तचिन्तितप्रद भूतिभूष वेदघोष पारितोष शास्वत पूर्णपुष्कलासमेत भूतनाथ
    पाहि माम् ॥ २ पञ्चबाणकोटि कोमळाकृते कृपानिधे पञ्चगव्यपायसान्न पानकादिमोदित पञ्चभूत सञ्चयप्रपञ्चभूतपालक
    पूर्णपुष्कलासमेत भूतनाथ पाहि माम् ॥ ३ चन्द्रसूर्य वीतिहोत्र नेत्र वक्त्रमोहन सान्द्रसुन्दर स्मितार्द्र
    केसरिन्द्रवाहन इन्द्रवन्दनीयपाद साधुवृन्दजीवन पूर्णपुष्कलासमेत भूतनाथ पाहि माम् ॥ ४ अत्युदारभक्त चित्तरङ्ग
    नर्तन प्रभो नित्यशुद्ध निर्मलाद्वितीयधर्मपालक सत्यरूप मुक्तिरूप सर्वदेवतात्मक पूर्णपुष्कलासमेत भूतनाथ
    पाहि माम् ॥ ५ वीरबाहु वर्णनीय वीर्यशौर्यवारिधे वारिजासनादि देववन्द्य सुन्दराकृते वारणेन्द्र वाजिसिम्हवाह
    भक्तशेवधे पूर्णपुष्कलासमेत भूतनाथ पाहि माम् ॥ ६ सामगानलोल शान्तशील धर्म पालक सोमसुन्दरास्य साधुपूजनीय
    पादुक सामदानभेददण्ड शास्त्रनीति बोधक पूर्णपुष्कलासमेत भूतनाथ पाहि माम् ॥ ७ सुप्रसन्न देवदेव सत्गति
    प्रदायक चित्प्रकाशधर्मपाल सर्वभूतनायक सुप्रसिद्ध पञ्चशैल सन्निकेतन नर्तक पूर्णपुष्कलासमेत भूतनाथ पाहि
    माम् ॥ ८ शूल
