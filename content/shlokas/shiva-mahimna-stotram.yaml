id: shiva-mahimna-stotram
category: stotram
name:
  english: Shiva Mahimna Stotram
content:
  english: atha shri shivamahimnastotram || mahimnah param te paramavidusho yadyasadrishi stutirbrahmadinamapi
    tadavasannastvayi girah | atha'vacyah sarvah svamatiparinamavadhi grinan mamapyesha stotre hara nirapavadah
    parikarah || || atitah panthanam tava ca mahima vanmanasayoh atadvyavrittya yam cakitamabhidhatte
    shrutirapi | sa kasya stotavyah katividhagunah kasya vishayah pade tvarvacine patati na manah kasya
    na vacah || || madhusphita vacah paramamamritam nirmitavatah tava brahman kim vagapi suragurorvismayapadam
    | mama tvetam vanim gunakathanapunyena bhavatah punamityarthe'smin puramathana buddhirvyavasita ||
    || tavaishvaryam yattajjagadudayarakshapralayakrit trayivastu vyastam tisrishu gunabhinnasu tanushu
    | abhavyanamasmin varada ramaniyamaramanim vihantum vyakroshim vidadhata ihaike jadadhiyah || || kimihah
    kinkayah sa khalu kimupayastribhuvanam kimadharo dhata srijati kimupadana iti ca | atarkyaishvarye
    tvayyanavasara duhstho hatadhiyah kutarko'yam kamshcit mukharayati mohaya jagatah || || ajanmano lokah
    kimavayavavanto'pi jagatam adhishthataram kim bhavavidhiranadritya bhavati | anisho va kuryad bhuvanajanane
    kah parikaro yato mandastvam pratyamaravara samsherata ime || || trayi sankhyam yogah pashupatimatam
    vaishnavamiti prabhinne prasthane paramidamadah pathyamiti ca | rucinam vaicitryadrijukutila nanapathajusham
    nrinameko gamyastvamasi payasamarnava iva || || mahokshah khatvangam parashurajinam bhasma phaninah
    kapalam cetiyattava varada tantropakaranam | surastam tamriddhim dadhati tu bhavadbhrupranihitam na
    hi svatmaramam vishayamrigatrishna bhramayati || || dhruvam kashcit sarvam sakalamaparastvadhruvamidam
    paro dhrauvya'dhrauvye jagati gadati vyastavishaye | samaste'pyetasmin puramathana tairvismita iva
    stuvan jihremi tvam na khalu nanu dhrishta mukharata || || tavaishvaryam yatnad yadupari virincirhariradhah
    paricchettum yatavanalamanalaskandhavapushah | tato bhaktishraddha grinadbhyam girisha yat svayam
    tasthe tabhyam tava kimanuvrittirna phalati || || ayatnadasadya tribhuvanamavairavyatikaram dashasyo
    yadbahunabhrita ranakandu paravashan | shirahpadmashreni baleh sthirayastvadbhaktestripurahara visphurjitamidam
    || samadhigatasaram bhujavanam balat kailase'pi tvadadhivasatau vikramayatah | alabhya patale'pyalasacalitangushthashirasi
    pratishtha tvayyasid dhruvamupacito muhyati khalah || || yadriddhim sutramno varada paramoccairapi
    satim adhashcakre banah parijanavidheyatribhuvanah | na taccitram tasmin varivasitari tvaccaranayoh
    na kasyapyunnatyai bhavati shirasastvayyavanatih || devasurakripa vidheyasya''sid yastrinayana visham
    samhritavatah | sa kalmashah kanthe tava na kurute na shriyamaho vikaro'pi shlaghyo bhuvana || asiddhartha
    naiva kvacidapi sadevasuranare nivartante nityam jagati jayino yasya vishikhah | sa pashyannisha tvamitarasurasadharanamabhut
    smarah smartavyatma na hi vashishu pathyah paribhavah || || mahi padaghatad vrajati sahasa samshayapadam
    padam vishnorbhramyad bhuja ganam | muhurdyaurdausthyam yatyanibhrita tata jagadrakshayai tvam natasi
    nanu vamaiva vibhuta || rucih pravaho varam yah prishatalaghudrishtah shirasi te | jagaddvipakaram
    jaladhivalayam tena kritamiti anenaivonneyam dhritamahima divyam tava vapuh || || rathah kshoni yanta
    shatadhritiragendro dhanuratho rathange candrarkau ratha panih shara iti | didhakshoste ko'yam tripuratrinamadambara
    vidhih vidheyaih kridantyo na khalu paratantrah prabhudhiyah || || hariste sahasram kamala balimadhaya
    padayoh yadekone tasmin nijamudaharannetrakamalam | gato bhaktyudrekah parinatimasau cakravapushah
    trayanam rakshayai tripurahara jagarti jagatam || || kratau supte jagrat tvamasi phalayoge kratumatam
    kva karma pradhvastam phalati purusharadhanamrite | atastvam samprekshya kratushu phaladana pratibhuvam
    shrutau shraddham baddhva dridhaparikarah karmasu janah || || kriyadaksho dakshah kratupatiradhishastanubhritam
    rishinamartvijyam sharanada sadasyah sura ganah | kratubhramshastvattah kratuphala vyasaninah dhruvam
    kartuh shraddha vidhuramabhicaraya hi makhah || || prajanatham natha prasabhamabhikam svam duhitaram
    gatam rohid bhutam riramayishumrishyasya vapusha | dhanushpaneryatam divamapi sapatrakritamamum trasantam
    te'dyapi tyajati na mrigavyadharabhasah || || svalavanyashamsa dhritadhanushamahnaya trinavat purah
    plushtam drishtva puramathana pushpayudhamapi | yadi strainam devi yamanirata dehardha ghatanat avaiti
    tvamaddha bata varada mugdha yuvatayah || || shmashaneshvakrida smarahara pishacah sahacarah cita
    bhasmalepah sragapi nrikaroti parikarah | amangalyam shilam tava bhavatu namaivamakhilam tathapi smartrinam
    varada paramam mangalamasi || || manah pratyakcitte savidhamavidhayatta marutah prahrishyadromanah
    pramada drishah | yadalokyahladam hrada iva nimajyamritamaye dadhatyantastattvam kimapi yaminastat
    kila bhavan || || tvamarkastvam somastvamasi pavanastvam hutavahah tvamapastvam vyoma tvamu dharaniratma
    tvamiti ca | paricchinnamevam tvayi parinata bibhrati giram na vidmastattattvam vayamiha tu yat tvam
    na bhavasi || || trayim tisro vrittistribhuvanamatho trinapi suran akaradyairvarnaistribhirabhidadhat
    tirnavikriti | turiyam te dhama dhvanibhiravarundhanamanubhih samastam vyastam tvam sharanada grinatyomiti
    padam || || bhavah sharvo rudrah pashupatirathograh saha mahan tatha bhimeshanaviti yadabhidhanashtakamidam
    | amushmin pratyekam pravicarati deva shrutirapi priyayasmaidhamne pranihita || namo nedishthaya priyadava
    davishthaya ca namah namah kshodishthaya smarahara mahishthaya ca namah | namo varshishthaya trinayana
    yavishthaya ca namah namah sarvasmai te tadidamitisarvaya ca namah || rajase vishvotpattau bhavaya
    namo namah prabala tamase tat samhare haraya namo namah | jana sukhakrite sattvodriktau mridaya namo
    namah pramahasi pade nistraigunye shivaya namo namah || cetah kleshavashyam kva cedam kva ca tava
    guna simollanghini shashvadriddhih | iti cakitamamandikritya mam bhaktiradhad varada caranayoste vakya
    samam syat kajjalam sindhu shakha lekhani patramurvi | likhati yadi grihitva sharada sarvakalam tadapi
    tava gunanamisha param na yati || munindrairarcitasyendu gunamahimno nirgunasyeshvarasya | sakala
    varishthah pushpadantabhidhanah ruciramalaghuvrittaih stotrametaccakara || || aharaharanavadyam dhurjateh
    stotrametat pathati paramabhaktya shuddha cittah puman yah | sa bhavati shivaloke rudratulyastatha'tra
    pracuratara dhanayuh putravan kirtimamshca || || maheshannaparo devo mahimno napara stutih | aghorannaparo
    mantro nasti tattvam guroh param || || diksha danam tapastirtham jnanam yagadikah kriyah | mahimnastava
    pathasya kalam narhanti shodashim || maulerdevadevasya dasah | sa khalu nija mahimno bhrashta evasya
    roshat stavanamidamakarshid divya || suragurumabhipujya svarga suravaramunipujyam svarga pathati yadi
    manushyah pranjalirnanya samipam kinnaraih stuyamanah stavanamidamamogham pushpadantapranitam || nirgatena
    stotrena kilbisha priyena | kanthasthitena pathitena samahitena suprinito bhavati bhutapatirmaheshah
    || || asamaptamidam stotram punyam gandharva bhashitam | anaupamyam manohari sarvamishvaravarnanam
    || || tava tattvam na janami kidrisho'si maheshvara | yadrisho'si mahadeva tadrishaya namo namah ||
    || ekakalam dvikalam va trikalam yah pathennarah | sarvapapa vinirmuktah shiva loke mahiyate || ||
    ityesha vanmayi puja shrimacchankara padayoh | arpita tena deveshah priyatam me sadashivah || || ||
    iti shri pushpadanta viracitam shivamahimna
  devanagari: अथ श्री शिवमहिम्नस्तोत्रम् ॥ महिम्नः पारं ते परमविदुषो यद्यसदृशी स्तुतिर्ब्रह्मादीनामपि
    तदवसन्नास्त्वयि गिरः । अथाऽवाच्यः सर्वः स्वमतिपरिणामावधि गृणन् ममाप्येष स्तोत्रे हर निरपवादः परिकरः
    ॥ ॥ अतीतः पन्थानं तव च महिमा वाङ्मनसयोः अतद्व्यावृत्त्या यं चकितमभिधत्ते श्रुतिरपि । स कस्य स्तोतव्यः
    कतिविधगुणः कस्य विषयः पदे त्वर्वाचीने पतति न मनः कस्य न वचः ॥ ॥ मधुस्फीता वाचः परमममृतं निर्मितवतः
    तव ब्रह्मन् किं वागपि सुरगुरोर्विस्मयपदम् । मम त्वेतां वाणीं गुणकथनपुण्येन भवतः पुनामीत्यर्थेऽस्मिन्
    पुरमथन बुद्धिर्व्यवसिता ॥ ॥ तवैश्वर्यं यत्तज्जगदुदयरक्षाप्रलयकृत् त्रयीवस्तु व्यस्तं तिसृषु गुणभिन्नासु
    तनुषु । अभव्यानामस्मिन् वरद रमणीयामरमणीं विहन्तुं व्याक्रोशीं विदधत इहैके जडधियः ॥ ॥ किमीहः किङ्कायः
    स खलु किमुपायस्त्रिभुवनं किमाधारो धाता सृजति किमुपादान इति च । अतर्क्यैश्वर्ये त्वय्यनवसर दुःस्थो
    हतधियः कुतर्कोऽयं कांश्चित् मुखरयति मोहाय जगतः ॥ ॥ अजन्मानो लोकाः किमवयववन्तोऽपि जगतां अधिष्ठातारं
    किं भवविधिरनादृत्य भवति । अनीशो वा कुर्याद् भुवनजनने कः परिकरो यतो मन्दास्त्वां प्रत्यमरवर संशेरत
    इमे ॥ ॥ त्रयी साङ्ख्यं योगः पशुपतिमतं वैष्णवमिति प्रभिन्ने प्रस्थाने परमिदमदः पथ्यमिति च । रुचीनां
    वैचित्र्यादृजुकुटिल नानापथजुषां नृणामेको गम्यस्त्वमसि पयसामर्णव इव ॥ ॥ महोक्षः खट्वाङ्गं परशुरजिनं
    भस्म फणिनः कपालं चेतीयत्तव वरद तन्त्रोपकरणम् । सुरास्तां तामृद्धिं दधति तु भवद्भ्रूप्रणिहितां न हि
    स्वात्मारामं विषयमृगतृष्णा भ्रमयति ॥ ॥ ध्रुवं कश्चित् सर्वं सकलमपरस्त्वध्रुवमिदं परो ध्रौव्याऽध्रौव्ये
    जगति गदति व्यस्तविषये । समस्तेऽप्येतस्मिन् पुरमथन तैर्विस्मित इव स्तुवन् जिह्रेमि त्वां न खलु ननु
    धृष्टा मुखरता ॥ ॥ तवैश्वर्यं यत्नाद् यदुपरि विरिञ्चिर्हरिरधः परिच्छेत्तुं यातावनलमनलस्कन्धवपुषः ।
    ततो भक्तिश्रद्धा गृणद्भ्यां गिरिश यत् स्वयं तस्थे ताभ्यां तव किमनुवृत्तिर्न फलति ॥ ॥ अयत्नादासाद्य
    त्रिभुवनमवैरव्यतिकरं दशास्यो यद्बाहूनभृत रणकण्डू परवशान् । शिरःपद्मश्रेणी बलेः स्थिरायास्त्वद्भक्तेस्त्रिपुरहर
    विस्फूर्जितमिदम् ॥ समधिगतसारं भुजवनं बलात् कैलासेऽपि त्वदधिवसतौ विक्रमयतः । अलभ्या पातालेऽप्यलसचलिताङ्गुष्ठशिरसि
    प्रतिष्ठा त्वय्यासीद् ध्रुवमुपचितो मुह्यति खलः ॥ ॥ यदृद्धिं सुत्राम्णो वरद परमोच्चैरपि सतीं अधश्चक्रे
    बाणः परिजनविधेयत्रिभुवनः । न तच्चित्रं तस्मिन् वरिवसितरि त्वच्चरणयोः न कस्याप्युन्नत्यै भवति शिरसस्त्वय्यवनतिः
    ॥ देवासुरकृपा विधेयस्याऽऽसीद् यस्त्रिनयन विषं संहृतवतः । स कल्माषः कण्ठे तव न कुरुते न श्रियमहो विकारोऽपि
    श्लाघ्यो भुवन ॥ असिद्धार्था नैव क्वचिदपि सदेवासुरनरे निवर्तन्ते नित्यं जगति जयिनो यस्य विशिखाः । स
    पश्यन्नीश त्वामितरसुरसाधारणमभूत् स्मरः स्मर्तव्यात्मा न हि वशिषु पथ्यः परिभवः ॥ ॥ मही पादाघाताद् व्रजति
    सहसा संशयपदं पदं विष्णोर्भ्राम्यद् भुज गणम् । मुहुर्द्यौर्दौस्थ्यं यात्यनिभृत तटा जगद्रक्षायै त्वं
    नटसि ननु वामैव विभुता ॥ रुचिः प्रवाहो वारां यः पृषतलघुदृष्टः शिरसि ते । जगद्द्वीपाकारं जलधिवलयं तेन
    कृतमिति अनेनैवोन्नेयं धृतमहिम दिव्यं तव वपुः ॥ ॥ रथः क्षोणी यन्ता शतधृतिरगेन्द्रो धनुरथो रथाङ्गे चन्द्रार्कौ
    रथ पाणिः शर इति । दिधक्षोस्ते कोऽयं त्रिपुरतृणमाडम्बर विधिः विधेयैः क्रीडन्त्यो न खलु परतन्त्राः प्रभुधियः
    ॥ ॥ हरिस्ते साहस्रं कमल बलिमाधाय पदयोः यदेकोने तस्मिन् निजमुदहरन्नेत्रकमलम् । गतो भक्त्युद्रेकः परिणतिमसौ
    चक्रवपुषः त्रयाणां रक्षायै त्रिपुरहर जागर्ति जगताम् ॥ ॥ क्रतौ सुप्ते जाग्रत् त्वमसि फलयोगे क्रतुमतां
    क्व कर्म प्रध्वस्तं फलति पुरुषाराधनमृते । अतस्त्वां सम्प्रेक्ष्य क्रतुषु फलदान प्रतिभुवं श्रुतौ श्रद्धां
    बद्ध्वा दृढपरिकरः कर्मसु जनः ॥ ॥ क्रियादक्षो दक्षः क्रतुपतिरधीशस्तनुभृतां ऋषीणामार्त्विज्यं शरणद सदस्याः
    सुर गणाः । क्रतुभ्रंशस्त्वत्तः क्रतुफल व्यसनिनः ध्रुवं कर्तुः श्रद्धा विधुरमभिचाराय हि मखाः ॥ ॥ प्रजानाथं
    नाथ प्रसभमभिकं स्वां दुहितरं गतं रोहिद् भूतां रिरमयिषुमृष्यस्य वपुषा । धनुष्पाणेर्यातं दिवमपि सपत्राकृतममुं
    त्रसन्तं तेऽद्यापि त्यजति न मृगव्याधरभसः ॥ ॥ स्वलावण्याशंसा धृतधनुषमह्नाय तृणवत् पुरः प्लुष्टं दृष्ट्वा
    पुरमथन पुष्पायुधमपि । यदि स्त्रैणं देवी यमनिरत देहार्ध घटनात् अवैति त्वामद्धा बत वरद मुग्धा युवतयः
    ॥ ॥ श्मशानेष्वाक्रीडा स्मरहर पिशाचाः सहचराः चिता भस्मालेपः स्रगपि नृकरोटी परिकरः । अमङ्गल्यं शीलं
    तव भवतु नामैवमखिलं तथापि स्मर्तॄणां वरद परमं मङ्गलमसि ॥ ॥ मनः प्रत्यक्चित्ते सविधमविधायात्त मरुतः
    प्रहृष्यद्रोमाणः प्रमद दृशः । यदालोक्याह्लादं ह्रद इव निमज्यामृतमये दधत्यन्तस्तत्त्वं किमपि यमिनस्तत्
    किल भवान् ॥ ॥ त्वमर्कस्त्वं सोमस्त्वमसि पवनस्त्वं हुतवहः त्वमापस्त्वं व्योम त्वमु धरणिरात्मा त्वमिति
    च । परिच्छिन्नामेवं त्वयि परिणता बिभ्रति गिरं न विद्मस्तत्तत्त्वं वयमिह तु यत् त्वं न भवसि ॥ ॥ त्रयीं
    तिस्रो वृत्तीस्त्रिभुवनमथो त्रीनपि सुरान् अकाराद्यैर्वर्णैस्त्रिभिरभिदधत् तीर्णविकृति । तुरीयं ते
    धाम ध्वनिभिरवरुन्धानमणुभिः समस्तं व्यस्तं त्वां शरणद गृणात्योमिति पदम् ॥ ॥ भवः शर्वो रुद्रः पशुपतिरथोग्रः
    सह महान् तथा भीमेशानाविति यदभिधानाष्टकमिदम् । अमुष्मिन् प्रत्येकं प्रविचरति देव श्रुतिरपि प्रियायास्मैधाम्ने
    प्रणिहित ॥ नमो नेदिष्ठाय प्रियदव दविष्ठाय च नमः नमः क्षोदिष्ठाय स्मरहर महिष्ठाय च नमः । नमो वर्षिष्ठाय
    त्रिनयन यविष्ठाय च नमः नमः सर्वस्मै ते तदिदमितिसर्वाय च नमः ॥ रजसे विश्वोत्पत्तौ भवाय नमो नमः प्रबल
    तमसे तत् संहारे हराय नमो नमः । जन सुखकृते सत्त्वोद्रिक्तौ मृडाय नमो नमः प्रमहसि पदे निस्त्रैगुण्ये
    शिवाय नमो नमः ॥ चेतः क्लेशवश्यं क्व चेदं क्व च तव गुण सीमोल्लङ्घिनी शश्वदृद्धिः । इति चकितममन्दीकृत्य
    मां भक्तिराधाद् वरद चरणयोस्ते वाक्य समं स्यात् कज्जलं सिन्धु शाखा लेखनी पत्रमुर्वी । लिखति यदि गृहीत्वा
    शारदा सर्वकालं तदपि तव गुणानामीश पारं न याति ॥ मुनीन्द्रैरर्चितस्येन्दु गुणमहिम्नो निर्गुणस्येश्वरस्य
    । सकल वरिष्ठः पुष्पदन्ताभिधानः रुचिरमलघुवृत्तैः स्तोत्रमेतच्चकार ॥ ॥ अहरहरनवद्यं धूर्जटेः स्तोत्रमेतत्
    पठति परमभक्त्या शुद्ध चित्तः पुमान् यः । स भवति शिवलोके रुद्रतुल्यस्तथाऽत्र प्रचुरतर धनायुः पुत्रवान्
    कीर्तिमांश्च ॥ ॥ महेशान्नापरो देवो महिम्नो नापरा स्तुतिः । अघोरान्नापरो मन्त्रो नास्ति तत्त्वं गुरोः
    परम् ॥ ॥ दीक्षा दानं तपस्तीर्थं ज्ञानं यागादिकाः क्रियाः । महिम्नस्तव पाठस्य कलां नार्हन्ति षोडशीम्
    ॥ मौलेर्देवदेवस्य दासः । स खलु निज महिम्नो भ्रष्ट एवास्य रोषात् स्तवनमिदमकार्षीद् दिव्य ॥ सुरगुरुमभिपूज्य
    स्वर्ग सुरवरमुनिपूज्यं स्वर्ग पठति यदि मनुष्यः प्राञ्जलिर्नान्य समीपं किन्नरैः स्तूयमानः स्तवनमिदममोघं
    पुष्पदन्तप्रणीतम् ॥ निर्गतेन स्तोत्रेण किल्बिष प्रियेण । कण्ठस्थितेन पठितेन समाहितेन सुप्रीणितो भवति
    भूतपतिर्महेशः ॥ ॥ आसमाप्तमिदं स्तोत्रं पुण्यं गन्धर्व भाषितम् । अनौपम्यं मनोहारि सर्वमीश्वरवर्णनम्
    ॥ ॥ तव तत्त्वं न जानामि कीदृशोऽसि महेश्वर । यादृशोऽसि महादेव तादृशाय नमो नमः ॥ ॥ एककालं द्विकालं वा
    त्रिकालं यः पठेन्नरः । सर्वपाप विनिर्मुक्तः शिव लोके महीयते ॥ ॥ इत्येषा वाङ्मयी पूजा श्रीमच्छङ्कर
    पादयोः । अर्पिता तेन देवेशः प्रीयतां मे सदाशिवः ॥ ॥ ॥ इति श्री पुष्पदन्त विरचितं शिवमहिम्न
