id: vibhishanakritamrameshvarastotram
category: stotram
name:
  english: vibhishanakritamrameshvarastotram
  devanagari: विभीषणकृतंरामेश्वरस्तोत्रम्
content:
  english: namaste devadevesha bhaktanamabhayaprada | sarvatah panipadam te sarvato'kshishiromukham ||
    44|| tvam yajnastvam vashatkarastvam candrastvam prabhakarah | tvam vishnustvam caturvaktrah shakrastvam
    parameshvarah || 45|| yatha tilagatam tailam gudham tishthati sarvada | tatha tvam sarva lokeshu gudhastishthasi
    shankara || 46|| yatha kashthagato vahnih samsthito'pi na lakshyate | mudhaih sarvatra samstho'pi
    tatha tvam naiva lakshyase || 47|| yatha dadhigatam sarpirnigudhatvena samsthitam | caracareshu bhuteshu
    tatha tvam deva samsthitah || 48|| yatha jalam dharaprishthatkhanannapnoti manavah | tatha tvam pujayannityam
    mokshamapnotyasamshayam || 49|| tavacca durlabhah svargastavacchurashca shatravah | yavadeva na santosham
    tvam karoshi sharirinam || 50|| tavallakshmishcala nrinam tavadrogah prithagvidhah | na yavaddevadeva
    tvam santosham samprayasyasi || 51|| tavatputrodbhavam duhkham tatha priyasamudbhavam | yavattvam
    deva nayasi santosham dehinamiha || 52|| iti shriskandapurane nagarakhande caturadhikashatatamadhyayantargatam
    vibhishanakritam rameshvarastotram samaptam | skandapurana | nagarakhanda | adhyaya 104
  devanagari: नमस्ते देवदेवेश भक्तानामभयप्रद । सर्वतः पाणिपादं ते सर्वतोऽक्षिशिरोमुखम् ॥ ४४॥ त्वं यज्ञस्त्वं
    वषट्कारस्त्वं चन्द्रस्त्वं प्रभाकरः । त्वं विष्णुस्त्वं चतुर्वक्त्रः शक्रस्त्वं परमेश्वरः ॥ ४५॥ यथा
    तिलगतं तैलं गूढं तिष्ठति सर्वदा । तथा त्वं सर्व लोकेषु गूढस्तिष्ठसि शङ्कर ॥ ४६॥ यथा काष्ठगतो वह्निः
    संस्थितोऽपि न लक्ष्यते । मूढैः सर्वत्र संस्थोऽपि तथा त्वं नैव लक्ष्यसे ॥ ४७॥ यथा दधिगतं सर्पिर्निगूढत्वेन
    संस्थितम् । चराचरेषु भूतेषु तथा त्वं देव संस्थितः ॥ ४८॥ यथा जलं धरापृष्ठात्खनन्नाप्नोति मानवः । तथा
    त्वां पूजयन्नित्यं मोक्षमाप्नोत्यसंशयम् ॥ ४९॥ तावच्च दुर्लभः स्वर्गस्तावच्छूराश्च शत्रवः । यावदेव
    न सन्तोषं त्वं करोषि शरीरिणाम् ॥ ५०॥ तावल्लक्ष्मीश्चला नॄणां तावद्रोगाः पृथग्विधाः । न यावद्देवदेव
    त्वं सन्तोषं सम्प्रयास्यसि ॥ ५१॥ तावत्पुत्रोद्भवं दुःखं तथा प्रियसमुद्भवम् । यावत्त्वं देव नायासि
    सन्तोषं देहिनामिह ॥ ५२॥ इति श्रीस्कन्दपुराणे नागरखण्डे चतुरधिकशततमाध्यायान्तर्गतं विभीषणकृतं रामेश्वरस्तोत्रं
    समाप्तम् । स्कन्दपुराण । नागरखण्ड । अध्याय १०४
