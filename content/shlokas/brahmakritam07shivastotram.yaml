id: brahmakritam07shivastotram
category: stotram
name:
  english: brahmakritam07shivastotram
  devanagari: ब्रह्मकृतं०७शिवस्तोत्रम्
content:
  english: 130|| tvameva vishnurupena shankhacakragadadharah | trilokim trayase tratah sattvamurte namo'stu
    te || 131|| tvameva vidadhasyetadvidhirbhutva vidhanavit | rajorupam samalambya nirajaskapadaprada
    || 132|| tvameva hi maharudrastvam mahogro bhujangabhrit | tvameva hi mahabhimo mahapitrivanecara
    || 133|| tamasim tanumashritya tvam kritanta kritantaka | kalagnirudro bhutvante tvam samvartapravartakah
    || 134|| tvam pumprakritirupabhyam mahadadyakhilam jagat | akshipakshmasamutkshepatpunaravihkaroshyaja
    || 135|| unmeshavinimeshau te sargasargaikakaranam | kapalamalakhelo'yam bhavatah svairacarinah ||
    136|| tvatkanthe nrikarotiyam dhurjate ya vibhasate | sarveshamantadagdhanam sa sphutam bijamalika
    || 137|| tvattah sarvamidam shambho tvayi sarvam caracaram | kastvam stotum vijanati puram vacamagocaram
    || 138|| stota tvam hi stutistvam hi nityam stutyastvameva ca | vedmyom namah shivayeti nanyadve'dmyeva
    kincana || 139|| tvameva hi sharanyam me tvameva hi gatih para | tvameva pranamamisha namastubhyam
    namo namah || 2
  devanagari: १३०॥ त्वमेव विष्णुरूपेण शङ्खचक्रगदाधरः । त्रिलोकीं त्रायसे त्रातः सत्त्वमूर्ते नमोऽस्तु
    ते ॥ १३१॥ त्वमेव विदधास्येतद्विधिर्भूत्वा विधानवित् । रजोरूपं समालम्ब्य नीरजस्कपदप्रद ॥ १३२॥ त्वमेव
    हि महारुद्रस्त्वं महोग्रो भुजङ्गभृत् । त्वमेव हि महाभीमो महापितृवनेचर ॥ १३३॥ तामसीं तनुमाश्रित्य त्वं
    कृतान्त कृतान्तक । कालाग्निरुद्रो भूत्वान्ते त्वं संवर्तप्रवर्तकः ॥ १३४॥ त्वं पुम्प्रकृतिरूपाभ्यां
    महदाद्यखिलं जगत् । अक्षिपक्ष्मसमुत्क्षेपात्पुनराविःकरोष्यज ॥ १३५॥ उन्मेषविनिमेषौ ते सर्गासर्गैककारणम्
    । कपालमालाखेलोऽयं भवतः स्वैरचारिणः ॥ १३६॥ त्वत्कण्ठे नृकरोटीयं धूर्जटे या विभासते । सर्वेषामन्तदग्धानां
    सा स्फुटं बीजमालिका ॥ १३७॥ त्वत्तः सर्वमिदं शम्भो त्वयि सर्वं चराचरम् । कस्त्वां स्तोतुं विजानाति
    पुरां वाचामगोचरम् ॥ १३८॥ स्तोता त्वं हि स्तुतिस्त्वं हि नित्यं स्तुत्यस्त्वमेव च । वेद्म्यों नमः शिवायेति
    नान्यद्वेऽद्म्येव किञ्चन ॥ १३९॥ त्वमेव हि शरण्यं मे त्वमेव हि गतिः परा । त्वामेव प्रणमामीश नमस्तुभ्यं
    नमो नमः ॥ २
