id: brahmavidya
category: upanishad
name:
  english: brahmavidya
  devanagari: ब्रह्मविद्य
content:
  english: brahmavidyopanishat svavidyatatkaryajatam yadvidyapahnavam gatam | taddhamsavidyanishpannam
    ramacandrapadam bhaje || om saha navavatu || saha nau bhunaktu || saha viryam karavavahai || tejasvinavadhitamastu
    ma vidvishavahai || om shantih shantih shantih || atha brahmavidyopanishaducyate || prasadadbrahmanastasya
    vishnoradbhutakarmanah | rahasyam brahmavidyaya dhruvagnim sampracakshate || 1|| omityekaksharam brahma
    yaduktam brahmavadibhih | shariram tasya vakshyami sthanam kalatrayam tatha || 2|| tatra devastrayah
    prokta loka vedastrayo'gnayah | tisro matrardhamatra ca tryaksharasya shivasya tu || 3|| rigvedo garhapatyam
    ca prithivi brahma eva ca | akarasya shariram tu vyakhyatam brahmavadibhih || 4|| yajurvedo'ntariksham
    ca dakshinagnistathaiva ca | vishnushca bhagavandeva ukarah parikirtitah || 5|| samavedastatha dyaushcahavaniyastathaiva
    ca | ishvarah paramo devo makarah parikirtitah || 6|| suryamandalamadhye'tha hyakarah shankhamadhyagah
    | ukarashcandrasamkashastasya madhye vyavasthitah || 7|| makarastvagnisamkasho vidhumo vidyutopamah
    | tisro matrastatha jneya somasuryagnirupinah || 8|| shikha tu dipasamkasha tasminnupari vartate |
    ardhamatra tatha jneya pranavasyopari sthita || 9|| padmasutranibha sukshma shikha sa drishyate para
    | sa nadi suryasamkasha suryam bhittva tathapara || 10|| dvisaptatisahasrani nadim bhittva ca murdhani
    | varadah sarvabhutanam sarvam vyapyavatishthati || 11|| kamsyaghantaninadastu yatha liyati shantaye
    | onkarastu tatha yojyah shantaye sarvamicchata || 12|| yasminviliyate shabdastatparam brahma giyate
    | dhiyam hi liyate brahma so'mritatvaya kalpate || 13|| vayuh pranastathakashastrividho jivasamjnakah
    | sa jivah prana ityukto valagrashatakalpitah || 14|| nabhisthane sthitam vishvam shuddhatattvam sunirmalam
    | adityamiva dipyantam rashmibhishcakhilam shivam || 15|| sakaram ca hakaram ca jivo japati sarvada
    | nabhirandhradvinishkrantam vishayavyaptivarjitam || 16|| tenedam nishkalam vidyatkshiratsarpiryatha
    tatha | karanenatmana yuktah pranayamaishca pancabhih || 17|| catushkala samayukto bhramyate ca hridisthitah
    | golakastu yada dehe kshiradandena va hatah || 18|| etasminvasate shighramavishrantam mahakhagah
    | yavannishvasito jivastavannishkalatam gatah || 19|| nabhastham nishkalam dhyatva mucyate bhavabandhanat
    anahatadhvaniyutam hamsam yo veda hridgatam || 20|| svaprakashacidanandam sa hamsa iti giyate | recakam
    purakam muktva kumbhakena sthitah sudhih || 21|| nabhikande samau kritva pranapanau samahitah | mastakasthamritasvadam
    pitva dhyanena sadaram || 22|| dipakaram mahadevam jvalantam nabhimadhyame | abhishicyamritenaiva
    hamsa hamseti yo japet || 23|| jaramaranarogadi na tasya bhuvi vidyate | evam dine dine kuryadanimadivibhutaye
    || 24|| ishvaratvamavapnoti sadabhyasaratah puman | bahavo naikamargena prapta nityatvamagatah ||
    25|| hamsavidyamrite loke nasti nityatvasadhanam | yo dadati mahavidyam hamsakhyam parameshvarim ||
    26|| tasya dasyam sada kuryatprajnaya paraya saha | shubham va'shubhamanyadva yaduktam guruna bhuvi
    || 27|| tatkuryadavicarena shishyah santoshasamyutah | hamsavidyamimam labdhva gurushushrushaya narah
    || 28|| atmanamatmana sakshadbrahma buddhva sunishcalam | dehajatyadisambandhanvarnashramasamanvitan
    || 29|| vedashastrani canyani padapamsumiva tyajet | gurubhaktim sada kuryacchreyase bhuyase narah
    || 30|| gurureva harih sakshannanya ityabravicchritih || 31|| shrutya yaduktam paramarthameva tatsamshayo
    natra tatah samastam | shrutya virodhe na bhavetpramanam bhavedanarthaya vina pramanam || 32|| dehasthah
    sakalo jneyo nishkalo dehavarjitah | aptopadeshagamyo'sau sarvatah samavasthitah || 33|| hamsahamseti
    yo bruyaddhamso brahma harih shivah | guruvaktrattu labhyeta pratyaksham sarvatomukham || 34|| tileshu
    ca yatha tailam pushpe gandha ivashritah | purushasya sharire'sminsa bahyabhyantare tatha || 35||
    ulkahasto yathaloke dravyamalokya tam tyajet | jnanena jneyamalokya pashcajjnanam parityajet || 36||
    pushpavatsakalam vidyadgandhastasya tu nishkalah | vrikshastu sakalam vidyacchaya tasya tu nishkala
    || 37|| nishkalah sakalo bhavah sarvatraiva vyavasthitah | upayah sakalastadvadupeyashcaiva nishkalah
    || 38|| sakale sakalo bhavo nishkale nishkalastatha | ekamatro dvimatrashca trimatrashcaiva bhedatah
    || 39|| ardhamatra para jneya tata urdhvam paratparam | pancadha pancadaivatyam sakalam paripathyate
    || 40|| brahmano hridayasthanam kanthe vishnuh samashritah | talumadhye sthito rudro lalatastho maheshvarah
    || 41|| nasagre acyutam vidyattasyante tu param padam | paratvattu param nastityevam shastrasya nirnayah
    || 42|| dehatitam tu tam vidyannasagre dvadashangulam | tadantam tam vijaniyattatrastho vyapayetprabhuh
    || 43|| mano'pyanyatra nikshiptam cakshuranyatra patitam | tathapi yoginam yogo hyavicchinnah pravartate
    || 44|| etattu paramam guhyametattu paramam shubham | natah parataram kincinnatah parataram shubham
    || 45|| shuddhajnanamritam prapya paramaksharanirnayam | guhyadguhyatamam gopyam grahaniyam prayatnatah
    || 46|| naputraya pradatavyam nashishyaya kadacana | gurudevaya bhaktaya nityam bhaktiparaya ca ||
    47|| pradatavyamidam shastram netarebhyah pradapayet | datasya narakam yati siddhyate na kadacana
    || 48|| grihastho brahmacari ca vanaprasthashca bhikshukah | yatra tatra sthito jnani paramaksharavitsada
    || 49|| vishayi vishayasakto yati dehantare shubham | jnanadevasya shastrasya sarvavastho'pi manavah
    || 50|| brahmahatyashvamedhadyaih punyapapairna lipyate | codako bodhakashcaiva mokshadashca parah
    smritah || 51|| ityesham trividho jneya acaryastu mahitale | codako darshayenmargam bodhakah sthanamacaret
    || 52|| mokshadastu param tattvam yajjnatva paramashnute | pratyakshayajanam dehe samkshepacchrinu
    gautama || 53|| teneshtva sa naro yati shashvatam padamavyayam | svayameva tu sampashyeddehe bindum
    ca nishkalam || 54|| ayane dve ca vishuve sada pashyati margavit | kritvayamam pura vatsa recapurakakumbhakan
    || 55|| purvam cobhayamuccarya arcayettu yathakramam | namaskarena yogena mudrayarabhya carcayet ||
    56|| suryasya grahanam vatsa pratyakshayajanam smritam | jnanatsayujyamevoktam toye toyam yatha tatha
    || 57|| ete gunah pravartante yogabhyasakritashramaih | tasmadyogam samadaya sarvaduhkhabahishkritah
    || 58|| yogadhyanam sada kritva jnanam tanmayatam vrajet | jnanatsvarupam paramam hamsamantram samuccaret
    || 59|| praninam dehamadhye tu sthito hamsah sadacyutah | hamsa eva param satyam hamsa eva tu shaktikam
    || 60|| hamsa eva param vakyam hamsa eva tu vadikam | hamsa eva paro rudro hamsa eva paratparam ||
    61|| sarvadevasya madhyastho hamsa eva maheshvarah | prithivyadishivantam tu akaradyashca varnakah
    || 62|| kutanta hamsa eva syanmatriketi vyavasthitah | matrikarahitam mantramadishante na kutracit
    || 63|| hamsajyotiranupamyam madhye devam vyavasthitam | dakshinamukhamashritya jnanamudram prakalpayet
    || 64|| sada samadhim kurvita hamsamantramanusmaran | nirmalasphatikakaram divyarupamanuttamam ||
    65|| madhyadeshe param hamsam jnanamudratmarupakam | prano'panah samanashcodanavyanau ca vayavah ||
    66|| pancakarmendriyairuktah kriyashaktibalodyatah | nagah kurmashca krikaro devadatto dhananjayah
    || 67|| pancajnanendriyairyukta jnanashaktibalodyatah | pavakah shaktimadhye tu nabhicakre ravih sthitah
    || 68|| bandhamudra krita yena nasagre tu svalocane | akarevahnirityahurukare hridi samsthitah ||
    69|| makare ca bhruvormadhye pranashaktya prabodhayet | brahmagranthirakare ca vishnugranthirhridi
    sthitah || 70|| rudragranthirbhruvormadhye bhidyate'ksharavayuna | akare samsthito brahma ukare vishnurasthitah
    || 71|| makare samsthito rudrastato'syantah paratparah | kantham sankucya nadyadau stambhite yena
    shaktitah || 72|| rasana pidyamaneyam shodashi vordhvagamini | trikutam trividha caiva golakham nikharam
    tatha || 73|| trishankhavajramonkaramurdhvanalam bhruvormukham | kundalim calayanprananbhedayanshashimandalam
    || 74|| sadhayanvajrakumbhani navadvarani bandhayet | sumanahpavanarudhah sarago nirgunastatha ||
    75|| brahmasthane tu nadah syacchakinyamritavarshini | shatcakramandaloddharam jnanadipam prakashayet
    || 76|| sarvabhutasthitam devam sarvesham nityamarcayet | atmarupam tamalokya jnanarupam niramayam
    || 77|| drishyantam divyarupena sarvavyapi niranjanah | hamsa hamsa vadedvakyam praninam dehamashritah
    | sapranapanayorgranthirajapetyabhidhiyate || 78|| sahasramekam dvayutam shatshatam caiva sarvada
    | uccaranpathito hamsah so'hamityabhidhiyate || 79|| purvabhage hyadholingam shikhinyam caiva pashcimam
    | jyotirlingam bhruvormadhye nityam dhyayetsada yatih || 80|| acyuto'hamacintyo'hamatarkyo'hamajo'smyaham
    | aprano'hamakayo'hamanango'smyabhayo'smyaham || 81|| ashabdo'hamarupo'hamasparsho'smyahamadvayah
    | araso'hamagandho'hamanadiramrito'smyaham || 82|| akshayo'hamalingo'hamajaro'smyakalo'smyaham | aprano'hamamuko'hamacintyo'smyakrito'smyaham
    || 83|| antaryamyahamagrahyo'nirdeshyo'hamalakshanah | agotro'hamagatro'hamacakshushko'smyavagaham
    || 84|| adrishyo'hamavarno'hamakhando'smyahamadbhutah | ashruto'hamadrishto'hamanveshtavyo'maro'smyaham
    || 85|| avayurapyanakasho'tejasko'vyabhicaryaham | amato'hamajato'hamatisukshmo'vikaryaham || 86||
    arajasko'tamasko'hamasattvosmyaguno'smyaham | amayo'nubhavatmahamananyo'vishayo'smyaham || 87|| advaito'hamapurno'hamabahyo'hamanantarah
    | ashroto'hamadirgho'hamavyakto'hamanamayah || 88|| advayanandavijnanaghano'smyahamavikriyah | aniccho'hamalepo'hamakartasmyahamadvayah
    || 89|| avidyakaryahino'hamavagrasanagocarah | analpo'hamashoko'hamavikalpo'smyavijvalan || 90|| adimadhyantahino'hamakashasadrisho'smyaham
    | atmacaitanyarupo'hamahamanandacidghanah || 91|| anandamritarupo'hamatmasamsthohamantarah | atmakamohamakashatparamatmeshvarosmyaham
    || 92|| ishanosmyahamidyo'hamahamuttamapurushah | utkrishto'hamupadrashta ahamuttarato'smyaham ||
    93|| kevalo'ham kavih karmadhyaksho'ham karanadhipah | guhashayo'ham goptaham cakshushashcakshurasmyaham
    || 94|| cidanando'smyaham ceta cidghanashcinmayo'smyaham | jyotirmayo'smyaham jyayanjyotisham jyotirasmyaham
    || 95|| tamasah sakshyaham turyaturyo'ham tamasah parah | divyo devo'smi durdarsho drishtadhyayo dhruvo'smyaham
    || 96|| nityo'ham niravadyo'ham nishkriyo'smi niranjanah | nirmalo nirvikalpo'ham nirakhyato'smi nishcalah
    || 97|| nirvikaro nityaputo nirguno nihspriho'smyaham | nirindriyo niyantaham nirapeksho'smi nishkalah
    || 98|| purushah paramatmaham puranah paramo'smyaham | paravaro'smyaham prajnah prapancopashamo'smyaham
    || 99|| paramrito'smyaham purnah prabhurasmi puratanah | purnanandaikabodho'ham pratyagekaraso'smyaham
    || 100|| prajnato'ham prashanto'ham prakashah parameshvarah | ekada cintyamano'ham dvaitadvaitavilakshanah
    || 101|| buddho'ham bhutapalo'ham bharupo bhagavanaham | mahajneyo mahanasmi mahajneyo maheshvarah
    || 102|| vimukto'ham vibhuraham varenyo vyapako'smyaham | vaishvanaro vasudevo vishvatashcakshurasmyaham
    || 103|| vishvadhiko'ham vishado vishnurvishvakridasmyaham | shuddho'smi shukrah shanto'smi shashvato'smi
    shivo'smyaham || 104|| sarvabhutantaratmahamahamasmi sanatanah | aham sakridvibhato'smi sve mahimni
    sada sthitah || 105|| sarvantarah svayamjyotih sarvadhipatirasmyaham | sarvabhutadhivaso'ham sarvavyapi
    svaradaham || 106|| samastasakshi sarvatma sarvabhutaguhashayah | sarvendriyagunabhasah sarvendriyavivarjitah
    || 107|| sthanatrayavyatito'ham sarvanugrahako'smyaham | saccidananda purnatma sarvapremaspado'smyaham
    || 108|| saccidanandamatro'ham svaprakasho'smi cidghanah | sattvasvarupasanmatrasiddhasarvatmako'smyaham
    || 109|| sarvadhishthanasanmatrah svatmabandhaharo'smyaham | sarvagraso'smyaham sarvadrashta sarvanubhuraham
    || 110|| evam yo veda tattvena sa vai purusha ucyata ityupanishat || om saha navavatu || saha nau
    bhunaktu || saha viryam karavavahai || tejasvinavadhitamastu ma vidvishavahai || om shantih shantih
    shantih || iti brahmavidyopanishatsamapta ||
  devanagari: ब्रह्मविद्योपनिषत् स्वाविद्यातत्कार्यजातं यद्विद्यापह्नवं गतम् । तद्धंसविद्यानिष्पन्नं रामचन्द्रपदं
    भजे ॥ ॐ सह नाववतु ॥ सह नौ भुनक्तु ॥ सह वीर्यं करवावहै ॥ तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ अथ ब्रह्मविद्योपनिषदुच्यते ॥ प्रसादाद्ब्रह्मणस्तस्य विष्णोरद्भुतकर्मणः । रहस्यं
    ब्रह्मविद्याया ध्रुवाग्निं सम्प्रचक्षते ॥ १॥ ॐइत्येकाक्षरं ब्रह्म यदुक्तं ब्रह्मवादिभिः । शरीरं तस्य
    वक्ष्यामि स्थानं कालत्रयं तथा ॥ २॥ तत्र देवास्त्रयः प्रोक्ता लोका वेदास्त्रयोऽग्नयः । तिस्रो मात्रार्धमात्रा
    च त्र्यक्षरस्य शिवस्य तु ॥ ३॥ ऋग्वेदो गार्हपत्यं च पृथिवी ब्रह्म एव च । आकारस्य शरीरं तु व्याख्यातं
    ब्रह्मवादिभिः ॥ ४॥ यजुर्वेदोऽन्तरिक्षं च दक्षिणाग्निस्तथैव च । विष्णुश्च भगवान्देव उकारः परिकीर्तितः
    ॥ ५॥ सामवेदस्तथा द्यौश्चाहवनीयस्तथैव च । ईश्वरः परमो देवो मकारः परिकीर्तितः ॥ ६॥ सूर्यमण्डलमध्येऽथ
    ह्यकारः शङ्खमध्यगः । उकारश्चन्द्रसंकाशस्तस्य मध्ये व्यवस्थितः ॥ ७॥ मकारस्त्वग्निसंकाशो विधूमो विद्युतोपमः
    । तिस्रो मात्रास्तथा ज्ञेया सोमसूर्याग्निरूपिणः ॥ ८॥ शिखा तु दीपसंकाशा तस्मिन्नुपरि वर्तते । अर्धमात्र
    तथा ज्ञेया प्रणवस्योपरि स्थिता ॥ ९॥ पद्मसूत्रनिभा सूक्ष्मा शिखा सा दृश्यते परा । सा नाडी सूर्यसंकाशा
    सूर्यं भित्त्वा तथापरा ॥ १०॥ द्विसप्ततिसहस्राणि नाडीं भित्त्वा च मूर्धनि । वरदः सर्वभूतानां सर्वं
    व्याप्यावतिष्ठति ॥ ११॥ कांस्यघण्टानिनादस्तु यथा लीयति शान्तये । ओङ्कारस्तु तथा योज्यः शान्तये सर्वमिच्छता
    ॥ १२॥ यस्मिन्विलीयते शब्दस्तत्परं ब्रह्म गीयते । धियं हि लीयते ब्रह्म सोऽमृतत्वाय कल्पते ॥ १३॥ वायुः
    प्राणस्तथाकाशस्त्रिविधो जीवसंज्ञकः । स जीवः प्राण इत्युक्तो वालाग्रशतकल्पितः ॥ १४॥ नाभिस्थाने स्थितं
    विश्वं शुद्धतत्त्वं सुनिर्मलम् । आदित्यमिव दीप्यन्तं रश्मिभिश्चाखिलं शिवम् ॥ १५॥ सकारं च हकारं च जीवो
    जपति सर्वदा । नाभिरन्ध्राद्विनिष्क्रान्तं विषयव्याप्तिवर्जितम् ॥ १६॥ तेनेदं निष्कलं विद्यात्क्षीरात्सर्पिर्यथा
    तथा । कारणेनात्मना युक्तः प्राणायामैश्च पञ्चभिः ॥ १७॥ चतुष्कला समायुक्तो भ्राम्यते च हृदिस्थितः ।
    गोलकस्तु यदा देहे क्षीरदण्डेन वा हतः ॥ १८॥ एतस्मिन्वसते शीघ्रमविश्रान्तं महाखगः । यावन्निश्वसितो जीवस्तावन्निष्कलतां
    गतः ॥ १९॥ नभस्थं निष्कलं ध्यात्वा मुच्यते भवबन्धनात् अनाहतध्वनियुतं हंसं यो वेद हृद्गतम् ॥ २०॥ स्वप्रकाशचिदानन्दं
    स हंस इति गीयते । रेचकं पूरकं मुक्त्वा कुम्भकेन स्थितः सुधीः ॥ २१॥ नाभिकन्दे समौ कृत्वा प्राणापानौ
    समाहितः । मस्तकस्थामृतास्वादं पीत्वा ध्यानेन सादरम् ॥ २२॥ दीपाकारं महादेवं ज्वलन्तं नाभिमध्यमे । अभिषिच्यामृतेनैव
    हंस हंसेति यो जपेत् ॥ २३॥ जरामरणरोगादि न तस्य भुवि विद्यते । एवं दिने दिने कुर्यादणिमादिविभूतये ॥
    २४॥ ईश्वरत्वमवाप्नोति सदाभ्यासरतः पुमान् । बहवो नैकमार्गेण प्राप्ता नित्यत्वमागताः ॥ २५॥ हंसविद्यामृते
    लोके नास्ति नित्यत्वसाधनम् । यो ददाति महाविद्यां हंसाख्यां पारमेश्वरीम् ॥ २६॥ तस्य दास्यं सदा कुर्यात्प्रज्ञया
    परया सह । शुभं वाऽशुभमन्यद्वा यदुक्तं गुरुणा भुवि ॥ २७॥ तत्कुर्यादविचारेण शिष्यः सन्तोषसंयुतः । हंसविद्यामिमां
    लब्ध्वा गुरुशुश्रूषया नरः ॥ २८॥ आत्मानमात्मना साक्षाद्ब्रह्म बुद्ध्वा सुनिश्चलम् । देहजात्यादिसम्बन्धान्वर्णाश्रमसमन्वितान्
    ॥ २९॥ वेदशास्त्राणि चान्यानि पदपांसुमिव त्यजेत् । गुरुभक्तिं सदा कुर्याच्छ्रेयसे भूयसे नरः ॥ ३०॥ गुरुरेव
    हरिः साक्षान्नान्य इत्यब्रवीच्छृतिः ॥ ३१॥ श्रुत्या यदुक्तं परमार्थमेव तत्संशयो नात्र ततः समस्तम् ।
    श्रुत्या विरोधे न भवेत्प्रमाणं भवेदनर्थाय विना प्रमाणम् ॥ ३२॥ देहस्थः सकलो ज्ञेयो निष्कलो देहवर्जितः
    । आप्तोपदेशगम्योऽसौ सर्वतः समवस्थितः ॥ ३३॥ हंसहंसेति यो ब्रूयाद्धंसो ब्रह्मा हरिः शिवः । गुरुवक्त्रात्तु
    लभ्येत प्रत्यक्षं सर्वतोमुखम् ॥ ३४॥ तिलेषु च यथा तैलं पुष्पे गन्ध इवाश्रितः । पुरुषस्य शरीरेऽस्मिन्स
    बाह्याभ्यन्तरे तथा ॥ ३५॥ उल्काहस्तो यथालोके द्रव्यमालोक्य तां त्यजेत् । ज्ञानेन ज्ञेयमालोक्य पश्चाज्ज्ञानं
    परित्यजेत् ॥ ३६॥ पुष्पवत्सकलं विद्याद्गन्धस्तस्य तु निष्कलः । वृक्षस्तु सकलं विद्याच्छाया तस्य तु
    निष्कला ॥ ३७॥ निष्कलः सकलो भावः सर्वत्रैव व्यवस्थितः । उपायः सकलस्तद्वदुपेयश्चैव निष्कलः ॥ ३८॥ सकले
    सकलो भावो निष्कले निष्कलस्तथा । एकमात्रो द्विमात्रश्च त्रिमात्रश्चैव भेदतः ॥ ३९॥ अर्धमात्र परा ज्ञेया
    तत ऊर्ध्वं परात्परम् । पञ्चधा पञ्चदैवत्यं सकलं परिपठ्यते ॥ ४०॥ ब्रह्मणो हृदयस्थानं कण्ठे विष्णुः समाश्रितः
    । तालुमध्ये स्थितो रुद्रो ललाटस्थो महेश्वरः ॥ ४१॥ नासाग्रे अच्युतं विद्यात्तस्यान्ते तु परं पदम् ।
    परत्वात्तु परं नास्तीत्येवं शास्त्रस्य निर्णयः ॥ ४२॥ देहातीतं तु तं विद्यान्नासाग्रे द्वादशाङ्गुलम्
    । तदन्तं तं विजानीयात्तत्रस्थो व्यापयेत्प्रभुः ॥ ४३॥ मनोऽप्यन्यत्र निक्षिप्तं चक्षुरन्यत्र पातितम्
    । तथापि योगिनां योगो ह्यविच्छिन्नः प्रवर्तते ॥ ४४॥ एतत्तु परमं गुह्यमेतत्तु परमं शुभम् । नातः परतरं
    किञ्चिन्नातः परतरं शुभम् ॥ ४५॥ शुद्धज्ञानामृतं प्राप्य परमाक्षरनिर्णयम् । गुह्याद्गुह्यतमं गोप्यं
    ग्रहणीयं प्रयत्नतः ॥ ४६॥ नापुत्राय प्रदातव्यं नाशिष्याय कदाचन । गुरुदेवाय भक्ताय नित्यं भक्तिपराय
    च ॥ ४७॥ प्रदातव्यमिदं शास्त्रं नेतरेभ्यः प्रदापयेत् । दातास्य नरकं याति सिद्ध्यते न कदाचन ॥ ४८॥ गृहस्थो
    ब्रह्मचारी च वानप्रस्थश्च भिक्षुकः । यत्र तत्र स्थितो ज्ञानी परमाक्षरवित्सदा ॥ ४९॥ विषयी विषयासक्तो
    याति देहान्तरे शुभम् । ज्ञानादेवास्य शास्त्रस्य सर्वावस्थोऽपि मानवः ॥ ५०॥ ब्रह्महत्याश्वमेधाद्यैः
    पुण्यपापैर्न लिप्यते । चोदको बोधकश्चैव मोक्षदश्च परः स्मृतः ॥ ५१॥ इत्येषं त्रिविधो ज्ञेय आचार्यस्तु
    महीतले । चोदको दर्शयेन्मार्गं बोधकः स्थानमाचरेत् ॥ ५२॥ मोक्षदस्तु परं तत्त्वं यज्ज्ञात्वा परमश्नुते
    । प्रत्यक्षयजनं देहे संक्षेपाच्छृणु गौतम ॥ ५३॥ तेनेष्ट्वा स नरो याति शाश्वतं पदमव्ययम् । स्वयमेव तु
    सम्पश्येद्देहे बिन्दुं च निष्कलम् ॥ ५४॥ अयने द्वे च विषुवे सदा पश्यति मार्गवित् । कृत्वायामं पुरा
    वत्स रेचपूरककुम्भकान् ॥ ५५॥ पूर्वं चोभयमुच्चार्य अर्चयेत्तु यथाक्रमम् । नमस्कारेण योगेन मुद्रयारभ्य
    चार्चयेत् ॥ ५६॥ सूर्यस्य ग्रहणं वत्स प्रत्यक्षयजनं स्मृतम् । ज्ञानात्सायुज्यमेवोक्तं तोये तोयं यथा
    तथा ॥ ५७॥ एते गुणाः प्रवर्तन्ते योगाभ्यासकृतश्रमैः । तस्माद्योगं समादाय सर्वदुःखबहिष्कृतः ॥ ५८॥ योगध्यानं
    सदा कृत्वा ज्ञानं तन्मयतां व्रजेत् । ज्ञानात्स्वरूपं परमं हंसमन्त्रं समुच्चरेत् ॥ ५९॥ प्राणिनां देहमध्ये
    तु स्थितो हंसः सदाच्युतः । हंस एव परं सत्यं हंस एव तु शक्तिकम् ॥ ६०॥ हंस एव परं वाक्यं हंस एव तु वादिकम्
    । हंस एव परो रुद्रो हंस एव परात्परम् ॥ ६१॥ सर्वदेवस्य मध्यस्थो हंस एव महेश्वरः । पृथिव्यादिशिवान्तं
    तु अकाराद्याश्च वर्णकाः ॥ ६२॥ कूटान्ता हंस एव स्यान्मातृकेति व्यवस्थिताः । मातृकारहितं मन्त्रमादिशन्ते
    न कुत्रचित् ॥ ६३॥ हंसज्योतिरनूपम्यं मध्ये देवं व्यवस्थितम् । दक्षिणामुखमाश्रित्य ज्ञानमुद्रां प्रकल्पयेत्
    ॥ ६४॥ सदा समाधिं कुर्वीत हंसमन्त्रमनुस्मरन् । निर्मलस्फटिकाकारं दिव्यरूपमनुत्तमम् ॥ ६५॥ मध्यदेशे परं
    हंसं ज्ञानमुद्रात्मरूपकम् । प्राणोऽपानः समानश्चोदानव्यानौ च वायवः ॥ ६६॥ पञ्चकर्मेन्द्रियैरुक्ताः क्रियाशक्तिबलोद्यताः
    । नागः कूर्मश्च कृकरो देवदत्तो धनञ्जयः ॥ ६७॥ पञ्चज्ञानेन्द्रियैर्युक्ता ज्ञानशक्तिबलोद्यताः । पावकः
    शक्तिमध्ये तु नाभिचक्रे रविः स्थितः ॥ ६८॥ बन्धमुद्रा कृता येन नासाग्रे तु स्वलोचने । अकारेवह्निरित्याहुरुकारे
    हृदि संस्थितः ॥ ६९॥ मकारे च भ्रुवोर्मध्ये प्राणशक्त्या प्रबोधयेत् । ब्रह्मग्रन्थिरकारे च विष्णुग्रन्थिर्हृदि
    स्थितः ॥ ७०॥ रुद्रग्रन्थिर्भ्रुवोर्मध्ये भिद्यतेऽक्षरवायुना । अकारे संस्थितो ब्रह्मा उकारे विष्णुरास्थितः
    ॥ ७१॥ मकारे संस्थितो रुद्रस्ततोऽस्यान्तः परात्परः । कण्ठं सङ्कुच्य नाड्यादौ स्तम्भिते येन शक्तितः
    ॥ ७२॥ रसना पीड्यमानेयं षोडशी वोर्ध्वगामिनि । त्रिकूटं त्रिविधा चैव गोलाखं निखरं तथा ॥ ७३॥ त्रिशङ्खवज्रमोङ्कारमूर्ध्वनालं
    भ्रुवोर्मुखम् । कुण्डलीं चालयन्प्राणान्भेदयन्शशिमण्डलम् ॥ ७४॥ साधयन्वज्रकुम्भानि नवद्वाराणि बन्धयेत्
    । सुमनःपवनारूढः सरागो निर्गुणस्तथा ॥ ७५॥ ब्रह्मस्थाने तु नादः स्याच्छाकिन्यामृतवर्षिणी । षट्चक्रमण्डलोद्धारं
    ज्ञानदीपं प्रकाशयेत् ॥ ७६॥ सर्वभूतस्थितं देवं सर्वेशं नित्यमर्चयेत् । आत्मरूपं तमालोक्य ज्ञानरूपं
    निरामयम् ॥ ७७॥ दृश्यन्तं दिव्यरूपेण सर्वव्यापी निरञ्जनः । हंस हंस वदेद्वाक्यं प्राणिनां देहमाश्रितः
    । सप्राणापानयोर्ग्रन्थिरजपेत्यभिधीयते ॥ ७८॥ सहस्रमेकं द्वयुतं षट्शतं चैव सर्वदा । उच्चरन्पठितो हंसः
    सोऽहमित्यभिधीयते ॥ ७९॥ पूर्वभागे ह्यधोलिङ्गं शिखिन्यां चैव पश्चिमम् । ज्योतिर्लिङ्गं भ्रुवोर्मध्ये
    नित्यं ध्यायेत्सदा यतिः ॥ ८०॥ अच्युतोऽहमचिन्त्योऽहमतर्क्योऽहमजोऽस्म्यहम् । अप्राणोऽहमकायोऽहमनङ्गोऽस्म्यभयोऽस्म्यहम्
    ॥ ८१॥ अशब्दोऽहमरूपोऽहमस्पर्शोऽस्म्यहमद्वयः । अरसोऽहमगन्धोऽहमनादिरमृतोऽस्म्यहम् ॥ ८२॥ अक्षयोऽहमलिङ्गोऽहमजरोऽस्म्यकलोऽस्म्यहम्
    । अप्राणोऽहममूकोऽहमचिन्त्योऽस्म्यकृतोऽस्म्यहम् ॥ ८३॥ अन्तर्याम्यहमग्राह्योऽनिर्देश्योऽहमलक्षणः । अगोत्रोऽहमगात्रोऽहमचक्षुष्कोऽस्म्यवागहम्
    ॥ ८४॥ अदृश्योऽहमवर्णोऽहमखण्डोऽस्म्यहमद्भुतः । अश्रुतोऽहमदृष्टोऽहमन्वेष्टव्योऽमरोऽस्म्यहम् ॥ ८५॥ अवायुरप्यनाकाशोऽतेजस्कोऽव्यभिचार्यहम्
    । अमतोऽहमजातोऽहमतिसूक्ष्मोऽविकार्यहम् ॥ ८६॥ अरजस्कोऽतमस्कोऽहमसत्त्वोस्म्यगुणोऽस्म्यहम् । अमायोऽनुभवात्माहमनन्योऽविषयोऽस्म्यहम्
    ॥ ८७॥ अद्वैतोऽहमपूर्णोऽहमबाह्योऽहमनन्तरः । अश्रोतोऽहमदीर्घोऽहमव्यक्तोऽहमनामयः ॥ ८८॥ अद्वयानन्दविज्ञानघनोऽस्म्यहमविक्रियः
    । अनिच्छोऽहमलेपोऽहमकर्तास्म्यहमद्वयः ॥ ८९॥ अविद्याकार्यहीनोऽहमवाग्रसनगोचरः । अनल्पोऽहमशोकोऽहमविकल्पोऽस्म्यविज्वलन्
    ॥ ९०॥ आदिमध्यान्तहीनोऽहमाकाशसदृशोऽस्म्यहम् । आत्मचैतन्यरूपोऽहमहमानन्दचिद्घनः ॥ ९१॥ आनन्दामृतरूपोऽहमात्मसंस्थोहमन्तरः
    । आत्मकामोहमाकाशात्परमात्मेश्वरोस्म्यहम् ॥ ९२॥ ईशानोस्म्यहमीड्योऽहमहमुत्तमपूरुषः । उत्कृष्टोऽहमुपद्रष्टा
    अहमुत्तरतोऽस्म्यहम् ॥ ९३॥ केवलोऽहं कविः कर्माध्यक्षोऽहं करणाधिपः । गुहाशयोऽहं गोप्ताहं चक्षुषश्चक्षुरस्म्यहम्
    ॥ ९४॥ चिदानन्दोऽस्म्यहं चेता चिद्घनश्चिन्मयोऽस्म्यहम् । ज्योतिर्मयोऽस्म्यहं ज्यायाञ्ज्योतिषां ज्योतिरस्म्यहम्
    ॥ ९५॥ तमसः साक्ष्यहं तुर्यतुर्योऽहं तमसः परः । दिव्यो देवोऽस्मि दुर्दर्शो दृष्टाध्यायो ध्रुवोऽस्म्यहम्
    ॥ ९६॥ नित्योऽहं निरवद्योऽहं निष्क्रियोऽस्मि निरञ्जनः । निर्मलो निर्विकल्पोऽहं निराख्यातोऽस्मि निश्चलः
    ॥ ९७॥ निर्विकारो नित्यपूतो निर्गुणो निःस्पृहोऽस्म्यहम् । निरिन्द्रियो नियन्ताहं निरपेक्षोऽस्मि निष्कलः
    ॥ ९८॥ पुरुषः परमात्माहं पुराणः परमोऽस्म्यहम् । परावरोऽस्म्यहं प्राज्ञः प्रपञ्चोपशमोऽस्म्यहम् ॥ ९९॥
    परामृतोऽस्म्यहं पूर्णः प्रभुरस्मि पुरातनः । पूर्णानन्दैकबोधोऽहं प्रत्यगेकरसोऽस्म्यहम् ॥ १००॥ प्रज्ञातोऽहं
    प्रशान्तोऽहं प्रकाशः परमेश्वरः । एकदा चिन्त्यमानोऽहं द्वैताद्वैतविलक्षणः ॥ १०१॥ बुद्धोऽहं भूतपालोऽहं
    भारूपो भगवानहम् । महाज्ञेयो महानस्मि महाज्ञेयो महेश्वरः ॥ १०२॥ विमुक्तोऽहं विभुरहं वरेण्यो व्यापकोऽस्म्यहम्
    । वैश्वानरो वासुदेवो विश्वतश्चक्षुरस्म्यहम् ॥ १०३॥ विश्वाधिकोऽहं विशदो विष्णुर्विश्वकृदस्म्यहम् ।
    शुद्धोऽस्मि शुक्रः शान्तोऽस्मि शाश्वतोऽस्मि शिवोऽस्म्यहम् ॥ १०४॥ सर्वभूतान्तरात्महमहमस्मि सनातनः ।
    अहं सकृद्विभातोऽस्मि स्वे महिम्नि सदा स्थितः ॥ १०५॥ सर्वान्तरः स्वयंज्योतिः सर्वाधिपतिरस्म्यहम् ।
    सर्वभूताधिवासोऽहं सर्वव्यापी स्वराडहम् ॥ १०६॥ समस्तसाक्षी सर्वात्मा सर्वभूतगुहाशयः । सर्वेन्द्रियगुणाभासः
    सर्वेन्द्रियविवर्जितः ॥ १०७॥ स्थानत्रयव्यतीतोऽहं सर्वानुग्राहकोऽस्म्यहम् । सच्चिदानन्द पूर्णात्मा
    सर्वप्रेमास्पदोऽस्म्यहम् ॥ १०८॥ सच्चिदानन्दमात्रोऽहं स्वप्रकाशोऽस्मि चिद्घनः । सत्त्वस्वरूपसन्मात्रसिद्धसर्वात्मकोऽस्म्यहम्
    ॥ १०९॥ सर्वाधिष्ठानसन्मात्रः स्वात्मबन्धहरोऽस्म्यहम् । सर्वग्रासोऽस्म्यहं सर्वद्रष्टा सर्वानुभूरहम्
    ॥ ११०॥ एवं यो वेद तत्त्वेन स वै पुरुष उच्यत इत्युपनिषत् ॥ ॐ सह नाववतु ॥ सह नौ भुनक्तु ॥ सह वीर्यं
    करवावहै ॥ तेजस्विनावधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ इति ब्रह्मविद्योपनिषत्समाप्ता
    ॥
