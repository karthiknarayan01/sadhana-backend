id: namavali-31
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: sukhaspadayai namah | om brahmayonaye namah | om yajnamayyai namah | om brahmanirvanadayinyai
    namah | om karmantayai namah | 70 om kamatayai namah | om kamyayai namah | om saumyayai namah | om
    yogatrayashrayayai namah | om dharmakshetrodbhavayai namah | om dharmyayai namah | om dhyanasthayai
    namah | om bhaktinirjharyai namah | om jnanavijnanasopanayai namah | om divyasmaranasantatyai namah
    | 80 om rajavidyayai namah | om rajaguhyayai namah | om pratyakshayai namah | om sulabhagatyai namah
    | om vibhutibhushitayai namah | om anantayai namah | om vishvarupapradarshinyai namah | om adveshtttvadi
  devanagari: सुखास्पदायै नमः । ॐ ब्रह्मयोनये नमः । ॐ यज्ञमय्यै नमः । ॐ ब्रह्मनिर्वाणदायिन्यै नमः । ॐ
    कर्मान्तायै नमः । ७० ॐ कामतायै नमः । ॐ काम्यायै नमः । ॐ सौम्यायै नमः । ॐ योगत्रयाश्रयायै नमः । ॐ धर्मक्षेत्रोद्भवायै
    नमः । ॐ धर्म्यायै नमः । ॐ ध्यानस्थायै नमः । ॐ भक्तिनिर्झर्यै नमः । ॐ ज्ञानविज्ञानसोपानायै नमः । ॐ
    दिव्यस्मरणसन्तत्यै नमः । ८० ॐ राजविद्यायै नमः । ॐ राजगुह्यायै नमः । ॐ प्रत्यक्षायै नमः । ॐ सुलभागत्यै
    नमः । ॐ विभूतिभूषितायै नमः । ॐ अनन्तायै नमः । ॐ विश्वरूपप्रदर्शिन्यै नमः । ॐ अद्वेष्ट्ट्त्वादि
meaning: {}
