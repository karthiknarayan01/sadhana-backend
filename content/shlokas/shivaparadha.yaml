id: shivaparadha
category: stotram
name:
  english: shivaparadha
  devanagari: शिवापराध
content:
  english: shrishivaparadhakshamapanastotram athava shivaparadhabhanjanastotram adau karmaprasangatkalayati
    kalusham matrikukshau sthitam mam vinmutramedhyamadhye kvathayati nitaram jatharo jatavedah | yadyadvai
    tatra duhkham vyathayati nitaram shakyate kena vaktum kshantavyo me'paradhah shiva shiva shiva bho
    shrimahadeva shambho || 1|| balye duhkhatireko malalulitavapuh stanyapane pipasa no shaktashcendriyebhyo
    bhavagunajanitah jantavo mam tudanti | nanarogadiduhkhadrudanaparavashah shankaram na smarami kshantavyo
    me'paradhah shiva shiva shiva bho shrimahadeva shambho || 2|| praudho'ham yauvanastho vishayavishadharaih
    pancabhirmarmasandhau dashto nashto vivekah sutadhanayuvatisvadusaukhye nishannah | shaivicintavihinam
    mama hridayamaho managarvadhirudham kshantavyo me'paradhah shiva shiva shiva bho shrimahadeva shambho
    || 3|| vardhakye cendriyanam vigatagatimatishcadhidaivaditapaih papai rogairviyogaistvanavasitavapuh
    praudhahinam ca dinam | mithyamohabhilashairbhramati mama mano dhurjaterdhyanashunyam kshantavyo me'paradhah
    shiva shiva shiva bho shrimahadeva shambho || 4|| snatva pratyushakale snapanavidhividhau nahritam
    gangatoyam pujartham va kadacidbahutaragahanatkhandabilvidalani | nanita padmamala sarasi vikasita
    gandhadhupaih tvadartham kshantavyo me'paradhah shiva shiva shiva bho shrimahadeva shambho || 5||
    dugdhairmadhvajyayuktairdadhisitasahitaih snapitam naiva lingam no liptam candanadyaih kanakaviracitaih
    pujitam na prasunaih | dhupaih karpuradipairvividharasayutairnaiva bhakshyopaharaih kshantavyo me'paradhah
    shiva shiva shiva bho shrimahadeva shambho || 6|| no shakyam smartakarma pratipadagahanapratyavayakulakhyam
    shraute varta katham me dvijakulavihite brahmamarganusare |
  devanagari: श्रीशिवापराधक्षमापणस्तोत्रम् अथवा शिवापराधभञ्जनस्तोत्रम् आदौ कर्मप्रसङ्गात्कलयति कलुषं मातृकुक्षौ
    स्थितं मां विण्मूत्रामेध्यमध्ये क्वथयति नितरां जाठरो जातवेदाः । यद्यद्वै तत्र दुःखं व्यथयति नितरां
    शक्यते केन वक्तुं क्षन्तव्यो मेऽपराधः शिव शिव शिव भो श्रीमहादेव शम्भो ॥ १॥ बाल्ये दुःखातिरेको मललुलितवपुः
    स्तन्यपाने पिपासा नो शक्तश्चेन्द्रियेभ्यो भवगुणजनिताः जन्तवो मां तुदन्ति । नानारोगादिदुःखाद्रुदनपरवशः
    शङ्करं न स्मरामि क्षन्तव्यो मेऽपराधः शिव शिव शिव भो श्रीमहादेव शम्भो ॥ २॥ प्रौढोऽहं यौवनस्थो विषयविषधरैः
    पञ्चभिर्मर्मसन्धौ दष्टो नष्टो विवेकः सुतधनयुवतिस्वादुसौख्ये निषण्णः । शैवीचिन्ताविहीनं मम हृदयमहो
    मानगर्वाधिरूढं क्षन्तव्यो मेऽपराधः शिव शिव शिव भो श्रीमहादेव शम्भो ॥ ३॥ वार्धक्ये चेन्द्रियाणां विगतगतिमतिश्चाधिदैवादितापैः
    पापै रोगैर्वियोगैस्त्वनवसितवपुः प्रौढहीनं च दीनम् । मिथ्यामोहाभिलाषैर्भ्रमति मम मनो धूर्जटेर्ध्यानशून्यं
    क्षन्तव्यो मेऽपराधः शिव शिव शिव भो श्रीमहादेव शम्भो ॥ ४॥ स्नात्वा प्रत्यूषकाले स्नपनविधिविधौ नाहृतं
    गाङ्गतोयं पूजार्थं वा कदाचिद्बहुतरगहनात्खण्डबिल्वीदलानि । नानीता पद्ममाला सरसि विकसिता गन्धधूपैः त्वदर्थं
    क्षन्तव्यो मेऽपराधः शिव शिव शिव भो श्रीमहादेव शम्भो ॥ ५॥ दुग्धैर्मध्वाज्ययुक्तैर्दधिसितसहितैः स्नापितं
    नैव लिङ्गं नो लिप्तं चन्दनाद्यैः कनकविरचितैः पूजितं न प्रसूनैः । धूपैः कर्पूरदीपैर्विविधरसयुतैर्नैव
    भक्ष्योपहारैः क्षन्तव्यो मेऽपराधः शिव शिव शिव भो श्रीमहादेव शम्भो ॥ ६॥ नो शक्यं स्मार्तकर्म प्रतिपदगहनप्रत्यवायाकुलाख्यं
    श्रौते वार्ता कथं मे द्विजकुलविहिते ब्रह्ममार्गानुसारे ।
