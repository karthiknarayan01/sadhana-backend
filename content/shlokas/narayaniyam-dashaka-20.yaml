id: narayaniyam-dashaka-20
category: stotram
name:
  english: Narayaniyam Dashaka 20
content:
  english: priyavratasya priyaputrabhuta dagnidhrarajadudito hi nabhih | tvam drishtavanishtadamishtimadhye
    tavaiva tushtyai kritayajnakarma || || abhishtutastatra munishvaraistvam rajnah svatulyam sutamarthyamanah
    | svayam janishye'hamiti bruvana stirodadha barhishi vishvamurte || || nabhipriyayamatha merudevyam
    tvamamshato'bhuh rishabhabhidhanah | alokasamanyagunaprabhava prabhavitasheshajanapramodah || || tvayi
    trilokibhriti rajyabharam nidhaya nabhih saha merudevya | tapovanam prapya bhavannishevi gatah kilanandapadam
    padam te || || indrastvadutkarshakritadamarsha dvavarsha nasminnajanabhavarshe | yada tada tvam nijayogashaktya
    svavarshamenadvyadadhah suvarsham || || jitendradattam kamanim jayanti mathodvahannatmaratashayo'pi
    | ajijanastatra shatam tanuja nesham kshitisho bharato'grajanma || || navabhavan yogivara navanye
    tvapalayan bharatavarshakhandan | saika tvashitistava sheshaputra stapobalat bhusurabhuyamiyuh ||
    || uktva sutebhyo'tha munindramadhye viraktibhaktyanvitamuktimargam | svayam gatah paramahamsyavritti
    madha jadonmattapishacacaryam || || paratmabhuto'pi paropadesham kurvan bhavan sarvanirasyamanah |
    vikarahino vicacara kritsnam mahimahinatmarasabhilinah || || shayuvratam gomrigakakacaryam ciram carannapya
    param svarupam | davahritangah kutakacale tvam tapan mamapakuru vatanatha ||
  devanagari: प्रियव्रतस्य प्रियपुत्रभूता दाग्नीध्रराजादुदितो हि नाभिः । त्वां दृष्टवानिष्टदमिष्टिमध्ये
    तवैव तुष्ट्यै कृतयज्ञकर्मा ॥ ॥ अभिष्टुतस्तत्र मुनीश्वरैस्त्वं राज्ञः स्वतुल्यं सुतमर्थ्यमानः । स्वयं
    जनिष्येऽहमिति ब्रुवाण स्तिरोदधा बर्हिषि विश्वमूर्ते ॥ ॥ नाभिप्रियायामथ मेरुदेव्यां त्वमंशतोऽभूः ॠषभाभिधानः
    । अलोकसामान्यगुणप्रभाव प्रभाविताशेषजनप्रमोदः ॥ ॥ त्वयि त्रिलोकीभृति राज्यभारं निधाय नाभिः सह मेरुदेव्या
    । तपोवनं प्राप्य भवन्निषेवी गतः किलानन्दपदं पदं ते ॥ ॥ इन्द्रस्त्वदुत्कर्षकृतादमर्षा द्ववर्ष नास्मिन्नजनाभवर्षे
    । यदा तदा त्वं निजयोगशक्त्या स्ववर्षमेनद्व्यदधाः सुवर्षम् ॥ ॥ जितेन्द्रदत्तां कमनीं जयन्ती मथोद्वहन्नात्मरताशयोऽपि
    । अजीजनस्तत्र शतं तनूजा नेषां क्षितीशो भरतोऽग्रजन्मा ॥ ॥ नवाभवन् योगिवरा नवान्ये त्वपालयन् भारतवर्षखण्डान्
    । सैका त्वशीतिस्तव शेषपुत्र स्तपोबलात् भूसुरभूयमीयुः ॥ ॥ उक्त्वा सुतेभ्योऽथ मुनीन्द्रमध्ये विरक्तिभक्त्यन्वितमुक्तिमार्गम्
    । स्वयं गतः पारमहंस्यवृत्ति मधा जडोन्मत्तपिशाचचर्याम् ॥ ॥ परात्मभूतोऽपि परोपदेशं कुर्वन् भवान् सर्वनिरस्यमानः
    । विकारहीनो विचचार कृत्स्नां महीमहीनात्मरसाभिलीनः ॥ ॥ शयुव्रतं गोमृगकाकचर्यां चिरं चरन्नाप्य परं स्वरूपम्
    । दवाहृताङ्गः कुटकाचले त्वं तापान् ममापाकुरु वातनाथ ॥
