id: allshlokavmean
category: shloka
name:
  english: allshlokavmean
  devanagari: अल्ल्श्लोकव्मेअन्
content:
  english: shrikeshavaya namah | narayanaya namah | madhavaya namah | govimdaya namah | vishnave namah
    | madhusudanaya namah | trivikramaya namah | vamanaya namah | shridharaya namah | hrishikeshaya namah
    | padmanabhaya namah | damodaraya namah | sankarshanaya namah | vasudevaya namah | pradyumnaya namah
    | aniruddhaya namah | purushottamaya namah | adhokshajaya namah | narasimhaya namah | acyutaya namah
    | janardanaya namah | upendraya namah | haraye namah | shrikrishnaya namah || ||
  devanagari: श्रीकेशवाय नमः । नारायणाय नमः । माधवाय नमः । गोविंदाय नमः । विष्णवे नमः । मधुसूदनाय नमः
    । त्रिविक्रमाय नमः । वामनाय नमः । श्रीधराय नमः । हृषीकेशाय नमः । पद्मनाभाय नमः । दामोदराय नमः । सङ्कर्षणाय
    नमः । वासुदेवाय नमः । प्रद्युम्नाय नमः । अनिरुद्धाय नमः । पुरुषोत्तमाय नमः । अधोक्षजाय नमः । नारसिंहाय
    नमः । अच्युताय नमः । जनार्दनाय नमः । उपेन्द्राय नमः । हरये नमः । श्रीकृष्णाय नमः ॥ ॥
meaning: {}
