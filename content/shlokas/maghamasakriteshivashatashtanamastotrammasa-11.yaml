id: maghamasakriteshivashatashtanamastotrammasa-11
category: stotram
name:
  english: maghamasakriteshivashatashtanamastotrammasa 11
  devanagari: माघमासकृतेशिवशताष्टनामस्तोत्रम्मास ११
content:
  english: namaskaryaya vishvaya vishnave brahmarupine || 29|| hiranyabahave sakshaddhiranyapataye namah
    | sharvaya sharvarupaya purushaya namo namah || 30|| rudraya nilarudraya kadrudraya pracetase | kalaya
    kalarupaya tatha kalangaharine || 31|| midhushtamaya devaya shipivishtaya te namah | shambhave dhatave
    caiva manyave rudramurtaye || 32|| namah kapardine tubhyam nilakanthaya te namah | shrikanthaya maheshaya
    balaya ca namonamah || 33|| namastrishulahastaya ugraya ca namo namah | bhimaya ca mrigendraya bhimarupaya
    bandhave || 34|| bhasmadigdhashariraya dindimundishvaraya ca | namo hrasvaya dirghaya vamanayorumedhase
    || 35|| agrevadhaya devaya namo durevadhaya ca | dhanvine shuline tubhyam gadine haline namah || 36||
    cakrine carmine tubhyam daityadanavabhedine | sadyaya hridyarupaya parnashadyaya te namah || 37||
    sadyojataya vamaya aghoraya namo namah | purushaya pareshaya purusharthapradaya ca || 38|| gahvareshthaya
    shishtaya vishishtaya namo namah | parameshthi virupaya vishvarupaya te namah || 39|| mahagrasaya
    dharaya trishuklaya suvaidyute | ishanaya namastubhyamishvaraya suraya ca || 40|| brahmanyaya namaste'stu
    brahmanyeshaya te namah | brahmane brahmarupaya brahmanyarcyapadaya ca || 41|| vishvadhikaya sukshmaya
    padmamaladharaya ca | shvetaya harikeshaya nilagrivaya hetave || 42|| nishangavaraprishthaya sharahetidharaya
    ca | mahadamshtrakaralaya shmashrave jatilaya ca || 43|| tanaya layamadhyaya mahadamaruvadine | garudadhvajapujyaya
    ijyadhyakshaya bhavine || 44|| vishnuraktaprapanaya tasminmasi maheshvari | stutvanena staveneshi
    rudrasarupyamapnuyat || 45|| || iti shivarahasyantargate ishvaraproktam maghamasakrite shivashatashtanamastotram
    sampurnam ||
  devanagari: नमस्कार्याय विश्वाय विष्णवे ब्रह्मरूपिणे ॥ २९॥ हिरण्यबाहवे साक्षाद्धिरण्यपतये नमः । शर्वाय
    शर्वरूपाय पुरुषाय नमो नमः ॥ ३०॥ रुद्राय नीलरुद्राय कद्रुद्राय प्रचेतसे । कालाय कालरूपाय तथा कालाङ्गहारिणे
    ॥ ३१॥ मीढुष्टमाय देवाय शिपिविष्टाय ते नमः । शम्भवे धातवे चैव मन्यवे रुद्रमूर्तये ॥ ३२॥ नमः कपर्दिने
    तुभ्यं नीलकण्ठाय ते नमः । श्रीकण्ठाय महेशाय बलाय च नमोनमः ॥ ३३॥ नमस्त्रिशूलहस्ताय उग्राय च नमो नमः
    । भीमाय च मृगेन्द्राय भीमरूपाय बन्धवे ॥ ३४॥ भस्मदिग्धशरीराय डिण्डिमुण्डीश्वराय च । नमो ह्रस्वाय दीर्घाय
    वामनायोरुमेधसे ॥ ३५॥ अग्रेवधाय देवाय नमो दूरेवधाय च । धन्विने शूलिने तुभ्यं गदिने हलिने नमः ॥ ३६॥
    चक्रिणे चर्मिणे तुभ्यं दैत्यदानवभेदिने । सद्याय हृद्यरूपाय पर्णशद्याय ते नमः ॥ ३७॥ सद्योजाताय वामाय
    अघोराय नमो नमः । पुरुषाय परेशाय पुरुषार्थप्रदाय च ॥ ३८॥ गह्वरेष्ठाय शिष्टाय विशिष्टाय नमो नमः । परमेष्ठि
    विरूपाय विश्वरूपाय ते नमः ॥ ३९॥ महाग्रासाय धाराय त्रिशुक्लाय सुवैद्युते । ईशानाय नमस्तुभ्यमीश्वराय
    सुराय च ॥ ४०॥ ब्रह्मण्याय नमस्तेऽस्तु ब्रह्मण्येशाय ते नमः । ब्रह्मणे ब्रह्मरूपाय ब्रह्मण्यार्च्यपदाय
    च ॥ ४१॥ विश्वाधिकाय सूक्ष्माय पद्ममालाधराय च । श्वेताय हरिकेशाय नीलग्रीवाय हेतवे ॥ ४२॥ निषङ्गवरपृष्ठाय
    शरहेतिधराय च । महादंष्ट्राकरालाय श्मश्रवे जटिलाय च ॥ ४३॥ तानाय लयमध्याय महाडमरुवादिने । गरुडध्वजपूज्याय
    इज्याध्यक्षाय भाविने ॥ ४४॥ विष्णुरक्तप्रपानाय तस्मिन्मासि महेश्वरि । स्तुत्वानेन स्तवेनेशि रुद्रसारूप्यमाप्नुयात्
    ॥ ४५॥ ॥ इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तं माघमासकृते शिवशताष्टनामस्तोत्रं सम्पूर्णम् ॥
