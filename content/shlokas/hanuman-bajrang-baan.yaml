id: hanuman-bajrang-baan
category: stotram
name:
  english: Hanuman Bajrang Baan
content:
  english: nishcaya prema pratiti tè binaya karai sanamana | tehi ke karaja sakala subha siddha karai
    hanumana || caupai jaya hanumanta santa hitakari | suna lijai prabhu araja hamari || jana ke kaja
    bilamba na kijai | atura dauri maha sukha dijai || jaise kudi sindhu mahipara | surasa badana paithi
    bistara || age jaya lankini roka | marehu lata gi suraloka || jaya bibhishana ko sukha dinha | sita
    nirakhi paramapada linha || baga ujari sindhu maham bora | ati atura jamakatara tora || akshaya kumara
    mari samhara | luma lapeti lanka ko jara || laha samana lanka jari gi | jaya jaya dhuni surapura nabha
    bhi || aba bilamba kehi karana svami | kripa karahu ura antarayami || jaya jaya lakhana prana ke data
    | atura hvai dukha karahu nipata || jai hanumana jayati bala nagara || om hanu hanu hanu hanumanta
    hathile | bairihi maru bajra ki kile || om hnim hnim hnim hanumanta kapisa | om hum hum hum hanu ari
    ura sisa || jaya anjani kumara balavanta | shankarasuvana bira hanumanta || badana karala kala ghalaka
    | rama sahaya sada pratipalaka || bhuta pisaca nisacara | agina betala kala mari mara || inhem maru
    tohi sapatha rama ki | rakhu natha marajada nama ki || satya hohu hari sapatha pai kai | rama duta
    dharu maru dhai kai || jaya jaya jaya hanumanta agadha | dukha pavata jana kehi aparadha || puja japa
    tapa nema acara | nahim janata kachu dasa tumhara || bana upabana maga giri griha mahim | tumhare
    bala haum darapata nahim || janakasuta hari dasa kahavau | taki sapatha bilamba na lavau || jai jai
    jai dhuni hota akasa | sumirata hoya dusaha dukha nasa || carana pakari kara jori manavaum | yahi
    ausara aba kehi goharavaum || uthu tohi rama duhai | payam paraum kara jori manai || om cam cam cam
    cam capala calanta | om hanu hanu hanu hanu hanumanta || om ham ham hanka deta kapi cancala | om sam
    sam sahami parane khala dala || apane jana ko turata ubarau | sumirata hoya ananda hamarau || yaha
    bajaranga bana jehi marai | tahi kahau phiri kavana ubarai || patha karai bajaranga bana ki | hanumata
    raksha karai prana ki || yaha bajaranga bana jo japaim | tasom bhuta preta saba kapaim || dhupa deya
    jo japai hamesa | take tana nahim rahai kalesa || doha ura pratiti drirha patha karai dhari dhyana
    | badha saba hara karaim saba kama saphala hanumana || doha nishcaya prema pratiti te binaya karaim
    sanamana | tehi ke karaja sakala shubha siddha karaim hanumana || caupai jaya hanumanta santa hitakari
    | suna lijai prabhu araja hamari || jana ke kaja bilamba na kijai | atura dauri maha sukha dijai ||
    jaise kudi sindhu mahipara | surasa badana paithi bistara || age jaya lankini roka | marehu lata gi
    suraloka || jaya bibhishana ko sukha dinha | sita nirakhi paramapada linha || baga ujari sindhu maha~
    bora | ati atura jamakatara tora || akshaya kumara mari samhara | luma lapeti lanka ko jara || laha
    samana lanka jari gi | jaya jaya dhuni surapura nabha bhi || aba bilamba kehi karana svami | kripa
    karahu ura antarayami || jaya jaya lakhana prana ke data | atura hvai dukha karahu nipata || jai hanumana
    jayati balasagara | sura samuha samaratha bhatanagara || om hanu hanu hanu hanumanta hathile | bairihi
    maru bajra ki kile || gada bajra lai bairihim maro | maharaja prabhu dasa ubaro || onkara hunkara
    mahaprabhu dhavo | bajra gada hanu vilamba na lavo || om hrim hrim hrim hanumanta kapisha | om hum
    hum hum hanu ariurasisha || satya hohu hari sapatha pai kai | rama duta dharu maru dhai kai || jaya
    jaya jaya hanumanta agadha | dukha pavata jana kehi aparadha || puja japa tapa nema acara | nahim
    janata haum dasa tumhara || bana upabana maga giri griha mahim | tumhare bala haum darapata nahim
    || jaya anjani kumara balavanta | shankarasuvana bira hanumanta || badana karala kala ghalaka | rama
    sahaya sada pratipalaka || bhuta pisaca nisacara | agina betala kala mari mara || inhem maru tohi
    sapatha rama ki | rakhu natha marajada nama ki || janakasuta hari dasa kahavau | taki sapatha bilamba
    na lavau || jai jai jai dhuni hota akasa | sumirata hoya dusaha dukha nasa || carana pakari kara jori
    manavaum | yahi ausara aba kehi goharavaum || uthu tohi rama duhai | paya~ paraum kara jori manai
    || om cam cam cam cam capala calanta | om hanu hanu hanu hanu hanumanta || om ham ham ha~ka deta kapi
    cancala | om sam sam sahami parane khaladala || apane jana ko turata ubarau | sumirata hoya ananda
    hamarau || tate vinati karaum pukari | harahu sakala duhkha vipati hamari || aisau bala prabhava prabhu
    tora | kasa na harahu duhkha sankata mora || he bajaranga bana sama dhavau | meti sakala duhkha darasa
    dikhavau || he kapiraja kaja kaba aihau | avasara cuki anta pachataihau || jana ki laja jata aihi
    bara | dhavahu he kapi pavana kumara || jayati jayati jai jai hanumana | jayati jayati guna jnana
    nidhana || jayati jayati jai jai kapirai | jayati jayati jai jai sukhadai || jayati jayati jai rama
    piyare | jayati jayati jai siya dulare || jayati jayati muda mangaladata | jayati jayati tribhuvana
    vikhyata || aihi prakara gavata guna shesha | pavata para nahim lavalesha || rama rupa sarvatra samana
    | dekhata rahata sada harshana || vidhi sharada sahita dinarati | gavata kapi ke guna bahu bhanti
    || tuma sama nahim jagata balavana | kari vicara dekhaum vidhi nana || yaha jiya jani sharana taba
    ai | tate vinaya karaum cita lai || suni kapi arata vacana hamare | metahu sakala duhkha bhrama bhare
    || ehi prakara vinati kapi keri | jo jana karaim lahai sukha dheri || yake parhata vira hanumana |
    dhavata bana tulya banavana || metata ae duhkha kshana mahim | dai darshana raghupati dhiga jahim
    || patha karai bajaranga bana ki | hanumata raksha karai prana ki || ditha tonadika nasai | parakrita
    yantra mantra nahim trase || bhairavadi sura karai mitai | ayusa mani karai sevakai || prana kara
    patha karem mana lai | alpa mrityu graha dosha nasai || avrita gyaraha pratidina japai | taki chamha
    kala nahim capai || dai gugula ki dhupa hamesha | karai patha tana mitai kalesha || yaha bajaranga
    bana jehi mare | tahi kahau phira kauna ubare || shatru samuha mitai saba apai | dekhata tahi surasura
    kampai || teja pratapa buddhi adhikai | rahai sada kapiraja sahai || bana jehi marai | tahi kahau
    phiri kavana ubarai || patha karai bajaranga bana ki | hanumata raksha karai prana ki || yaha bajaranga
    bana jo japaim | tasom bhuta preta saba kapamai || dhupa deya jo japai hamesa | take tana nahim rahai
    kalesa || dohah patha karai dhari dhyana | badha saba hara karaim saba kama saphala hanumana || prema
    pratitihi kapi bhajai sada dharaim ura dhyana | tehi ke karaja sakala shubha siddha karaim hanumana
    || iti shrigosaitulasidasajikrita shrihanumantabajarangabana samapta |
  devanagari: निश्चय प्रेम प्रतीति तॆ बिनय करै सनमान । तेहि के कारज सकल सुभ सिद्ध करै हनुमान ॥ चौपाई जय
    हनुमन्त सन्त हितकारी । सुन लीजै प्रभु अरज हमारी ॥ जन के काज बिलम्ब न कीजै । आतुर दौरि महा सुख दीजै
    ॥ जैसे कूदि सिन्धु महिपारा । सुरसा बदन पैठि बिस्तारा ॥ आगे जाय लङ्किनी रोका । मारेहु लात गी सुरलोका
    ॥ जाय बिभीषन को सुख दीन्हा । सीता निरखि परमपद लीन्हा ॥ बाग उजारि सिन्धु महं बोरा । अति आतुर जमकातर
    तोरा ॥ अक्षय कुमार मारि संहारा । लूम लपेटि लङ्क को जारा ॥ लाह समान लङ्क जरि गी । जय जय धुनि सुरपुर
    नभ भी ॥ अब बिलम्ब केहि कारन स्वामी । कृपा करहु उर अन्तरयामी ॥ जय जय लखन प्रान के दाता । आतुर ह्वै
    दुख करहु निपाता ॥ जै हनुमान जयति बल नागर ॥ ॐ हनु हनु हनु हनुमन्त हठीले । बैरिहि मारु बज्र की कीले
    ॥ ॐ ह्नीं ह्नीं ह्नीं हनुमन्त कपीसा । ॐ हुं हुं हुं हनु अरि उर सीसा ॥ जय अञ्जनि कुमार बलवन्ता । शङ्करसुवन
    बीर हनुमन्ता ॥ बदन कराल काल घालक । राम सहाय सदा प्रतिपालक ॥ भूत पिसाच निसाचर । अगिन बेताल काल मारी
    मर ॥ इन्हें मारु तोहि सपथ राम की । राखु नाथ मरजाद नाम की ॥ सत्य होहु हरि सपथ पाइ कै । राम दूत धरु
    मारु धाइ कै ॥ जय जय जय हनुमन्त अगाधा । दुख पावत जन केहि अपराधा ॥ पूजा जप तप नेम अचारा । नहिं जानत
    कछु दास तुम्हारा ॥ बन उपबन मग गिरि गृह माहीम् । तुम्हरे बल हौं डरपत नाहीम् ॥ जनकसुता हरि दास कहावौ
    । ताकी सपथ बिलम्ब न लावौ ॥ जै जै जै धुनि होत अकासा । सुमिरत होय दुसह दुख नासा ॥ चरन पकरि कर जोरि मनावौम्
    । यहि औसर अब केहि गोहरावौम् ॥ उठु तोहि राम दुहाई । पायं परौं कर जोरि मनाई ॥ ॐ चं चं चं चं चपल चलन्ता
    । ॐ हनु हनु हनु हनु हनुमन्ता ॥ ॐ हं हं हाङ्क देत कपि चञ्चल । ॐ सं सं सहमि पराने खल दल ॥ अपने जन को
    तुरत उबारौ । सुमिरत होय आनन्द हमारौ ॥ यह बजरङ्ग बाण जेहि मारै । ताहि कहौ फिरि कवन उबारै ॥ पाठ करै
    बजरङ्ग बाण की । हनुमत रक्षा करै प्रान की ॥ यह बजरङ्ग बाण जो जापैम् । तासों भूत प्रेत सब कापैम् ॥ धूप
    देय जो जपै हमेसा । ताके तन नहिं रहै कलेसा ॥ दोहा उर प्रतीति दृढ़ पाठ करै धरि ध्यान । बाधा सब हर करैं
    सब काम सफल हनुमान ॥ दोहा निश्चय प्रेम प्रतीति ते बिनय करैं सनमान । तेहि के कारज सकल शुभ सिद्ध करैं
    हनुमान ॥ चौपाई जय हनुमन्त सन्त हितकारी । सुन लीजै प्रभु अरज हमारी ॥ जन के काज बिलम्ब न कीजै । आतुर
    दौरि महा सुख दीजै ॥ जैसे कूदि सिन्धु महिपारा । सुरसा बदन पैठि बिस्तारा ॥ आगे जाय लङ्किनी रोका । मारेहु
    लात गी सुरलोका ॥ जाय बिभीषन को सुख दीन्हा । सीता निरखि परमपद लीन्हा ॥ बाग उजारि सिन्धु महँ बोरा ।
    अति आतुर जमकातर तोरा ॥ अक्षय कुमार मारि संहारा । लूम लपेटि लङ्क को जारा ॥ लाह समान लङ्क जरि गी । जय
    जय धुनि सुरपुर नभ भी ॥ अब बिलम्ब केहि कारन स्वामी । कृपा करहु उर अन्तरयामी ॥ जय जय लखन प्रान के दाता
    । आतुर ह्वै दुख करहु निपाता ॥ जै हनुमान जयति बलसागर । सुर समूह समरथ भटनागर ॥ ॐ हनु हनु हनु हनुमन्त
    हठीले । बैरिहि मारू बज्र की कीले ॥ गदा बज्र लै बैरिहिं मारो । महाराज प्रभु दास उबारो ॥ ओङ्कार हुङ्कार
    महाप्रभु धावो । बज्र गदा हनु विलम्ब न लावो ॥ ॐ ह्रीं ह्रीं ह्रीं हनुमन्त कपीशा । ॐ हुं हुं हुं हनु
    अरिउरसीशा ॥ सत्य होहु हरि सपथ पाइ कै । राम दूत धरू मारू धाइ कै ॥ जय जय जय हनुमन्त अगाधा । दुख पावत
    जन केहि अपराधा ॥ पूजा जप तप नेम अचारा । नहिं जानत हौं दास तुम्हारा ॥ बन उपबन मग गिरि गृह माहीम् ।
    तुम्हरे बल हौं डरपत नाहीम् ॥ जय अञ्जनि कुमार बलवन्ता । शङ्करसुवन बीर हनुमन्ता ॥ बदन कराल काल घालक
    । राम सहाय सदा प्रतिपालक ॥ भूत पिसाच निसाचर । अगिन बेताल काल मारी मर ॥ इन्हें मारू तोहि सपथ राम की
    । राखु नाथ मरजाद नाम की ॥ जनकसुता हरि दास कहावौ । ताकी सपथ बिलम्ब न लावौ ॥ जै जै जै धुनि होत अकासा
    । सुमिरत होय दुसह दुख नासा ॥ चरन पकरि कर जोरि मनावौम् । यहि औसर अब केहि गोहरावौम् ॥ उठु तोहि राम दुहाई
    । पायँ परौं कर जोरि मनाई ॥ ॐ चं चं चं चं चपल चलन्ता । ॐ हनु हनु हनु हनु हनुमन्ता ॥ ॐ हं हं हाँक देत
    कपि चञ्चल । ॐ सं सं सहमि पराने खलदल ॥ अपने जन को तुरत उबारौ । सुमिरत होय आनन्द हमारौ ॥ ताते विनती
    करौं पुकारी । हरहु सकल दुःख विपति हमारी ॥ ऐसौ बल प्रभाव प्रभु तोरा । कस न हरहु दुःख सङ्कट मोरा ॥ हे
    बजरङ्ग बाण सम धावौ । मेटि सकल दुःख दरस दिखावौ ॥ हे कपिराज काज कब ऐहौ । अवसर चूकि अन्त पछतैहौ ॥ जन
    की लाज जात ऐहि बारा । धावहु हे कपि पवन कुमारा ॥ जयति जयति जै जै हनुमाना । जयति जयति गुण ज्ञान निधाना
    ॥ जयति जयति जै जै कपिराई । जयति जयति जै जै सुखदाई ॥ जयति जयति जै राम पियारे । जयति जयति जै सिया दुलारे
    ॥ जयति जयति मुद मङ्गलदाता । जयति जयति त्रिभुवन विख्याता ॥ ऐहि प्रकार गावत गुण शेषा । पावत पार नहीं
    लवलेषा ॥ राम रूप सर्वत्र समाना । देखत रहत सदा हर्षाना ॥ विधि शारदा सहित दिनराती । गावत कपि के गुन
    बहु भान्ति ॥ तुम सम नहीं जगत बलवाना । करि विचार देखौं विधि नाना ॥ यह जिय जानि शरण तब आई । ताते विनय
    करौं चित लाई ॥ सुनि कपि आरत वचन हमारे । मेटहु सकल दुःख भ्रम भारे ॥ एहि प्रकार विनती कपि केरी । जो
    जन करैं लहै सुख ढेरी ॥ याके पढ़त वीर हनुमाना । धावत बाण तुल्य बनवाना ॥ मेटत आए दुःख क्षण माहिम् ।
    दै दर्शन रघुपति ढिग जाहीम् ॥ पाठ करै बजरङ्ग बाण की । हनुमत रक्षा करै प्राण की ॥ डीठ टोनादिक नासै ।
    परकृत यन्त्र मन्त्र नहीं त्रासे ॥ भैरवादि सुर करै मिताई । आयुस मानि करै सेवकाई ॥ प्रण कर पाठ करें
    मन लाई । अल्प मृत्यु ग्रह दोष नसाई ॥ आवृत ग्यारह प्रतिदिन जापै । ताकी छांह काल नहिं चापै ॥ दै गूगुल
    की धूप हमेशा । करै पाठ तन मिटै कलेषा ॥ यह बजरङ्ग बाण जेहि मारे । ताहि कहौ फिर कौन उबारे ॥ शत्रु समूह
    मिटै सब आपै । देखत ताहि सुरासुर काम्पै ॥ तेज प्रताप बुद्धि अधिकाई । रहै सदा कपिराज सहाई ॥ बाण जेहि
    मारै । ताहि कहौ फिरि कवन उबारै ॥ पाठ करै बजरङ्ग बाण की । हनुमत रक्षा करै प्रान की ॥ यह बजरङ्ग बाण
    जो जापैम् । तासों भूत प्रेत सब कापंऐ ॥ धूप देय जो जपै हमेसा । ताके तन नहिं रहै कलेसा ॥ दोहाः पाठ करै
    धरि ध्यान । बाधा सब हर करैं सब काम सफल हनुमान ॥ प्रेम प्रतीतिहि कपि भजै सदा धरैं उर ध्यान । तेहि के
    कारज सकल शुभ सिद्ध करैं हनुमान ॥ इति श्रीगोसाईतुलसीदासजीकृत श्रीहनुमन्तबजरङ्गबाण समाप्त ।
