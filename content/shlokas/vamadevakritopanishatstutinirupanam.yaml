id: vamadevakritopanishatstutinirupanam
category: upanishad
name:
  english: vamadevakritopanishatstutinirupanam
  devanagari: वामदेवकृतोपनिषत्स्तुतिनिरूपणम्
content:
  english: rinoshyakarnah | tvam vetsi sarvam na vidanti hi tvam tvamahuragryam purusham puranam || 23||
    manah paro'si prakriteh paro'si buddhe paro'si mahatah paro'si | avyaktavyaktatpurushatparo'si kashtha
    gatirbrahma puccham svamisha || 24|| asharirastvamasi prasiddhakarma sharirinam nashagatikriyasu |
    tasmadavastharahitam ca shambhum tvam yo vijanati na shocate punah || 25|| srishtani khani paramesha
    vimohanaya tvayyeva deva jagatishvatha eka eva | tasmatparam pashyati vishvamurternatmanamicchanti
    bahirmukha janah || 26|| vishvam drishyamidam vibhati sakalam tvayyeva vidyotate jagratsvapnasushuptishu
    pralayakritkoshadihinah sada | tvamatmanamakhandamindriyaganairaprapyamasha mukham nityam vanchati
    brahma taddhridi sada canandalabdham sukham || 27|| caturthasturiyah shivo'deta atma mahabhutadeheshvasangah
    puranah | sa satyeva tannamarupairgunairva shivah purushah kevalah koshahinah || 28|| amedyo hyadahyastatha
    chedyahinastavadyasti vakpanidehadibandhah | svatantro vibhurnityashuddho vibhasasvamasa jagajjalametadvimasi
    || 29|| yato va mahabhutasanghani jatanyasankhyeyakarmani bhinnani nityam | yenaiva jivanti vibhanti
    dehervidehani nanyatra sanvishthate'nte || 30|| tadetattrinetram vicitram pavitramumashlishtamatrardhacandrardhacudam
    | vijijnasya tadbrahma niruparupam maharupamekam jagatpalanaya || 31|| svamatma tvam brahma tvamasi
    bhagavanghoramakhilam tvaya bhedam janatyavikaladhiya yastu yamirat | ajananyashcettham tvamasi ca
    paradatsa tamanu || 32|| eke tvayyadvitiye jagadidamakhilam neha nanasti kincit shrutya yuktya guruktya
    mananayutadhiya tattvavakyat tapoktya | dvitva bhitimahesha tvayi bhayajanani dvasuparnadivakyaih
    mandansambodhayatsa shrutiriyamadhuna sakshinam tvam phaladam || 33|| esho'ntaradityagato mahesho
    hiranyarupah sa hiranyakeshah | hiranyaretashca tathambikapatih dhyanaikagamyastamasah parastat ||
    34|| esho'ntaryamyamritah puranah kavistatha pranabhritpranahetuh | tvam brahmamanvasa upasate ciram
    muktyai dhritatmana uto mahesham || 35|| tvam shodashatma purushah purishayo na lokaduhkhaistvamasanga
    ekah | na sajjase tadgunabhavavrittishu sthito'si dure ca tadantiko'si || 36|| apanirado gunakarmahino
    guhahito nishkalastvam turiyah | satyam tatha''nandamayastvamatma jnanam sukham samviditi kramena
    || 37|| yada tamastvam na diva nishapi va na sanna casacchiva eva kevalah | tvamaksharam tatsaviturvarenyam
    prajna tvadajnavashato vinihsrita || 38|| koshatitamakhandamekamarasam gandhadihinam tada nashyaddehakadambakeshu
    nitaram nashadihinam vibhum | svatmanam priyadehajalarahitam tatsakshinam sarvada drishyam darshanadigbhramadirahitam
    janannaro mucyate || kvacinjatam vishvam kvacidapi vilinam suraganaih kvacitstabdham dinam kvacidapi
    ca nadaikavivasham | shadurmipraviddham tvayi tu bhagavannabdhi vilasattaranga dyotante na hi tu ca
    bhavamstadgatagunah
  devanagari: ृणोष्यकर्णः । त्वं वेत्सि सर्वं न विदन्ति हि त्वां त्वामाहुरग्र्यं पुरुषं पुराणम् ॥ २३॥
    मनः परोऽसि प्रकृतेः परोऽसि बुद्धे परोऽसि महतः परोऽसि । अव्यक्तव्यक्तात्पुरुषात्परोऽसि काष्ठा गतिर्ब्रह्म
    पुच्छं स्वमीश ॥ २४॥ अशरीरस्त्वमसि प्रसिद्धकर्मा शरीरिणां नाशगतिक्रियासु । तस्मादवस्थारहितं च शम्भुं
    त्वां यो विजानाति न शोचते पुनः ॥ २५॥ सृष्टानि खानि परमेश विमोहनाय त्वय्येव देव जगतीष्वथ एक एव । तस्मात्परं
    पश्यति विश्वमूर्तेर्नात्मानमिच्छन्ति बहिर्मुखा जनाः ॥ २६॥ विश्वं दृश्यमिदं विभाति सकलं त्वय्येव विद्योतते
    जाग्रत्स्वप्नसुषुप्तिषु प्रलयकृत्कोशादिहीनः सदा । त्वामात्मानमखण्डमिन्द्रियगणैरप्राप्यमाशा मुखं नित्यं
    वाञ्छति ब्रह्म तद्धृदि सदा चानन्दलब्धं सुखम् ॥ २७॥ चतुर्थस्तुरीयः शिवोऽदेत आत्मा महाभूतदेहेष्वसङ्गः
    पुराणः । स सत्येव तन्नामरूपैर्गुणैर्वा शिवः पुरुषः केवलः कोशहीनः ॥ २८॥ अमेद्यो ह्यदाह्यस्तथा छेद्यहीनस्तवाद्यास्ति
    वाक्पाणिदेहादिबन्धः । स्वतन्त्रो विभुर्नित्यशुद्धो विभासस्वमासा जगज्जालमेतद्विमासि ॥ २९॥ यतो वा महाभूतसङ्घानि
    जातान्यसङ्ख्येयकर्माणि भिन्नानि नित्यम् । येनैव जीवन्ति विभान्ति देहेर्विदेहानि नान्यत्र सन्विष्ठतेऽन्ते
    ॥ ३०॥ तदेतत्त्रिनेत्रं विचित्रं पवित्रमुमाश्लिष्टमात्रार्धचन्द्रार्धचूडम् । विजिज्ञास्य तद्ब्रह्म
    नीरूपरूपं महारूपमेकं जगत्पालनाय ॥ ३१॥ स्वमात्मा त्वं ब्रह्म त्वमसि भगवन्घोरमखिलं त्वया भेदं जानात्यविकलधिया
    यस्तु यमिराट् । अजानन्यश्चेत्थं त्वमसि च परादात्स तमनु ॥ ३२॥ एके त्वय्यद्वितीये जगदिदमखिलं नेह नानास्ति
    किञ्चित् श्रुत्या युक्त्या गुरूक्त्या मननयुतधिया तत्त्ववाक्यात् तपोक्त्या । द्वित्व भीतिमहेश त्वयि
    भयजननी द्वासुपर्णादिवाक्यैः मन्दान्सम्बोधयत्सा श्रुतिरियमधुना साक्षिणं त्वां फलादम् ॥ ३३॥ एषोऽन्तरादित्यगतो
    महेशो हिरण्यरूपः स हिरण्यकेशः । हिरण्यरेताश्च तथाम्बिकापतिः ध्यानैकगम्यस्तमसः परस्तात् ॥ ३४॥ एषोऽन्तर्याम्यमृतः
    पुराणः कविस्तथा प्राणभृत्प्राणहेतुः । त्वां ब्रह्ममन्वास उपासते चिरं मुक्त्यै धृतात्मान उतो महेशम्
    ॥ ३५॥ त्वं षोडशात्मा पुरुषः पुरीशयो न लोकदुःखैस्त्वमसङ्ग एकः । न सज्जसे तद्गुणभाववृत्तिषु स्थितोऽसि
    दूरे च तदन्तिकोऽसि ॥ ३६॥ अपाणिरादो गुणकर्महीनो गुहाहितो निष्कलस्त्वं तुरीयः । सत्यं तथाऽऽनन्दमयस्त्वमात्मा
    ज्ञानं सुखं संविदिति क्रमेण ॥ ३७॥ यदा तमस्त्वं न दिवा निशापि वा न सन्न चासच्छिव एव केवलः । त्वमक्षरं
    तत्सवितुर्वरेण्यं प्रज्ञा त्वदाज्ञावशतो विनिःसृता ॥ ३८॥ कोशातीतमखण्डमेकमरसं गन्धादिहीनं तदा नश्यद्देहकदम्बकेषु
    नितरां नाशादिहीनं विभुम् । स्वात्मानं प्रियदेहजालरहितं तत्साक्षिणं सर्वदा दृश्यं दर्शनदिग्भ्रमादिरहितं
    जानन्नरो मुच्यते ॥ क्वचिञ्जातं विश्वं क्वचिदपि विलीनं सुरगणैः क्वचित्स्तब्धं दीनं क्वचिदपि च नादैकविवशम्
    । षडूर्मिप्राविद्धं त्वयि तु भगवन्नब्धि विलसत्तरङ्गा द्योतन्ते न हि तु च भवांस्तद्गतगुणः
