id: shrishanaishcaramalamantrah
category: mantra
name:
  english: shrishanaishcaramalamantrah
  devanagari: श्रीशनैश्चरमालामन्त्रः
content:
  english: samastapida parihararthe shanaishcaraprasadasiddhyarthe jape viniyogah || atha karanyasah |
    shanaishcaraya angushthabhyam namah | krishnavarnaya tarjanibhyam namah | suryaputraya madhyamabhyam
    namah | mandagataye anamikabhyam namah | gridhravahanaya kanishthikabhyam namah | pangupadaya karatalakaraprishthabhyam
    namah | iti karanyasah || atha hridayadishadanganyasah | shanaishcaraya hridayaya namah | krishnavarnaya
    shirase svaha | suryaputraya shikhayai vashat | mandagataye kavacaya hum | gridhravahanaya netratrayaya
    vaushat | pangupadaya astraya phat | iti hridayadishadanganyasah || dhyanam | dorbhirdhanurdvishikhacarmadharam
    trishulam bhasvatkiritamukutojjvalitendranilam | nilatapatrakusumadisugandhabhusham devam bhaje ravisutam
    pranato'smi nityam || om namo bhagavate shanaishcaraya mandagataye suryaputraya mahakalagni
  devanagari: समस्तपीडा परिहारार्थे शनैश्चरप्रसादसिद्ध्यर्थे जपे विनियोगः ॥ अथ करन्यासः । शनैश्चराय अङ्गुष्ठाभ्यां
    नमः । कृष्णवर्णाय तर्जनीभ्यां नमः । सूर्यपुत्राय मध्यमाभ्यां नमः । मन्दगतये अनामिकाभ्यां नमः । गृध्रवाहनाय
    कनिष्ठिकाभ्यां नमः । पङ्गुपादाय करतलकरपृष्ठाभ्यां नमः । इति करन्यासः ॥ अथ हृदयादिषडङ्गन्यासः । शनैश्चराय
    हृदयाय नमः । कृष्णवर्णाय शिरसे स्वाहा । सूर्यपुत्राय शिखायै वषट् । मन्दगतये कवचाय हुम् । गृध्रवाहनाय
    नेत्रत्रयाय वौषट् । पङ्गुपादाय अस्त्राय फट् । इति हृदयादिषडङ्गन्यासः ॥ ध्यानम् । दोर्भिर्धनुर्द्विशिखचर्मधरं
    त्रिशूलं भास्वत्किरीटमुकुटोज्ज्वलितेन्द्रनीलम् । नीलातपत्रकुसुमादिसुगन्धभूषं देवं भजे रविसुतं प्रणतोऽस्मि
    नित्यम् ॥ ॐ नमो भगवते शनैश्चराय मन्दगतये सूर्यपुत्राय महाकालाग्नि
meaning: {}
