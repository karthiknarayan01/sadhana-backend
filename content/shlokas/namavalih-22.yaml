    विरजापदतीरस्थाय नमः । ॐ विरजापरिघालयाय नमः । ॐ विरजागाधसलिलभीतभीतविरिञ्चनाय नमः । ९८० ॐ विरजातोयपानाप्तविद्याभक्तजनेदिताय
    नमः । ॐ विनायकध्वजभ्राजद्विमानवरभूषणाय नमः । ॐ वियद्विमानविभ्राजदबलातारकाविधवे नमः । ॐ विकुण्ठनगरीनारीनीराजितपदाम्बुजाय
    नमः । ॐ विकुण्ठपौरीनेत्रालिलीयमानोत्सवासवाय नमः । ॐ विस्पष्टेन्दीवराभात्मलग्नलक्ष्मीमुखेन्दुभाय नमः
    । ॐ विश्वाम्बाहेमपुत्रीभृद्वक्षोनीलाश्मपीठकाय नमः । ॐ विधुबिम्बोपरिस्थार्कभानुविद्योतिताम्बराय नमः
    । ॐ विवेलात्मप्रभापूरनीलीकृतमहाहिपाय नमः । ॐ विषध्रमूर्धसाहस्ररत्नाभालेपचित्रिताय नमः । ९९० ॐ विसारितैकबाह्वग्रकङ्कणाभाञ्चितेन्दिराय
    नमः । ॐ विश्वाम्बाकरकञ्जातलक्ष्मीलालितजानुकाय नमः । ॐ विचित्रदिव्याभरणांशुकाभासिन्धूदयश्रीमुखचन्द्रबिम्बाय
    नमः । ॐ विष्वक्कृपादर्शितकामपूरनखेन्दुभिन्नाङ्गुलिपादपद्माय नमः । ॐ विश्वालयव्यापिविचित्रगन्थमल्लीतुलस्यम्बुजचुम्बिताङ्गाय
    नमः । ॐ विश्वम्भरावासितचारुगन्धविप्ताङ्गनीरन्ध्रपतद्विरेफाय नमः । ॐ विवृत्तरत्नोपधिपुष्पमालागृहीतगन्धाद्भुतकेशवेशाय
    नमः । ॐ विचित्रभूषाम्बरवैष्णवस्त्रीसङ्गीतनाट्याकलनस्मितास्याय नमः । ॐ विनायकोदारसुपर्णकम्पनप्रभूतदिव्यानिललोलितालकाय
    नमः । ॐ विरिञ्चिना द्युन्मकुटप्रभाझरीनिषिक्तपादाय नमः । ॐ विविदाशयाञ्चिताय नमः । १००१ विचित्रभूषाम्बरवैष्णवस्त्रीसङ्गीतनाट्याकलनस्मितास्यः
    ॥ विनायकोदारसुपर्णकम्पनप्रभूतदिव्यानिललोलितालकः । विरिञ्चिना द्युन्मकुटप्रभाझरीनिषिक्तपादो विविदाशयाञ्चितः
    ॥ विनायकश्रौतरथाधिरूढसद्विनायकापाङ्गसुधामयाकृतिः । विचित्रसाहस्रसुमाधिरोहताद्विनायकोदारगलं सुखादियम्
    ॥ पराभवज्येष्ठकमासपूर्णिमातिथौ समाप्तिं गमितासकौ कृतिः । सुखेन रामेण समर्पिता हरेः पदाब्जयोराविधुभासतान्तराम्
    ॥ पराभवाषाढशुद्धद्वादश्यामसकौ कृतिः । रामेण सर्वा व्याख्याता प्रापिता च हरेः पदम् ॥ ॥ एवं सहस्रनामानि
    कृत्वा भगवते कृति नायकाय समर्पयति ॥ ॥ श्री हयग्रीवार्पणमस्तु ॥ इति विवर्णादि विष्णुसहस्रनामावलिः समाप्ता
    ।
