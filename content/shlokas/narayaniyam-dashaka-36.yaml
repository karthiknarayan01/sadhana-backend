id: narayaniyam-dashaka-36
category: stotram
name:
  english: Narayaniyam Dashaka 36
content:
  english: atreh putrataya pura tvamanasuyayam hi dattabhidho jatah shishyanibandhatandritamanah svasthashcaran
    kantaya | drishto bhaktatamena hehayamahipalena tasmai vara nashtaishvaryamukhan pradaya daditha svenaiva
    cante vadham || || satyam kartumatharjunasya ca varam tacchaktimatranatam brahmadveshi tadakhilam
    nripakulam hantum ca bhumerbharam | sanjato jamadagnito bhrigukule tvam renukayam hare ramo nama tadatmajeshvavarajah
    pitroradhah sammadam || || labdhamnayaganashcaturdashavaya gandharvaraje mana gasaktam kila mataram
    prati pituh krodhakulasyajnaya | tatajnatigasodaraih samamimam chitva'tha shantat pitu stesham jivanayogamapitha
    varam mata ca te'dadvaran || || pitra matrimude stavahritaviyaddhenornijadashramat prasthayatha bhrigorgira
    himagiravaradhya gauripatim | labdhva tatparashum taduktadanujacchedi mahastradikam prapto mitramathakritavranamunim
    prapyagamah svashramam || || akhetopagato'rjunah suragavisampraptasampadganai stvatpitra paripujitah
    puragato durmantrivaca punah | gam kretum sacivam nyayunkta kudhiya tenapi rundhanmuni pranakshepasaroshagohatacamucakrena
    vatso hritah || || shukrojjivitatatavakyacalitakrodho'tha sakhya samam bibhraddhyatamahodaropanihitam
    capam kutharam sharan | arudhah sahavahayantrikaratham mahishmatimavishan vagbhirvatsamadashushi kshitipatau
    samprastuthah sangaram || || putranamayutena saptadashabhishcakshauhinibhirmaha senanibhiranekamitranivahairvyajrimbhitayodhanah
    | sadyastvatkakutharabanavidalannishsheshasainyotkaro bhitipradrutanashtashishtatanayastvamapatat
    hehayah || || lilavaritanarmadajalavalallankeshagarvapaha shrimadbahusahasramuktabahushastrastram
    nirundhannamum | cakre tvayyatha vaishnave'pi viphale buddhva harim tvam muda dhyayantam chitasarvadoshamavadhih
    so'gat param te padam || || bhuyo'marshitahehayatmajaganaistate hate renuka maghnanam hridayam nirikshya
    bahusho ghoram pratijnam vahan | dhyananitarathayudhastvamakritha vipradruhah kshatriyan dikcakreshu
    kutharayan vishikhayan nihkshatriyam medinim || || tatojjivanakrinnripalakakulam trissaptakritvo jayan
    santarpyatha samantapancakamaharaktahridaughe pitrin yajne kshmamapi kashyapadishu dishan salvena
    yudhyan punah krishno'mum nihanishyatiti shamito yuddhat kumarairbhavan || || nyasyastrani mahendrabhubhriti
    tapastanvan punarmajjitam gokarnavadhi sagarena dharanim drishtvarthitastapasaih | dhyateshvasadhritanalastracakitam
    sindhum sruvakshepana dutsaryoddhritakeralo bhrigupate vatesha samraksha mam ||
  devanagari: अत्रेः पुत्रतया पुरा त्वमनसूयायां हि दत्ताभिधो जातः शिष्यनिबन्धतन्द्रितमनाः स्वस्थश्चरन्
    कान्तया । दृष्टो भक्ततमेन हेहयमहीपालेन तस्मै वरा नष्टैश्वर्यमुखान् प्रदाय ददिथ स्वेनैव चान्ते वधम्
    ॥ ॥ सत्यं कर्तुमथार्जुनस्य च वरं तच्छक्तिमात्रानतं ब्रह्मद्वेषि तदाखिलं नृपकुलं हन्तुं च भूमेर्भरम्
    । सञ्जातो जमदग्नितो भृगुकुले त्वं रेणुकायां हरे रामो नाम तदात्मजेष्ववरजः पित्रोरधाः सम्मदम् ॥ ॥ लब्धाम्नायगणश्चतुर्दशवया
    गन्धर्वराजे मना गासक्तां किल मातरं प्रति पितुः क्रोधाकुलस्याज्ञया । ताताज्ञातिगसोदरैः सममिमां छित्वाऽथ
    शान्तात् पितु स्तेषां जीवनयोगमापिथ वरं माता च तेऽदाद्वरान् ॥ ॥ पित्रा मातृमुदे स्तवाहृतवियद्धेनोर्निजादाश्रमात्
    प्रस्थायाथ भृगोर्गिरा हिमगिरावाराध्य गौरीपतिम् । लब्ध्वा तत्परशुं तदुक्तदनुजच्छेदी महास्त्रादिकं प्राप्तो
    मित्रमथाकृतव्रणमुनिं प्राप्यागमः स्वाश्रमम् ॥ ॥ आखेटोपगतोऽर्जुनः सुरगवीसम्प्राप्तसम्पद्गणै स्त्वत्पित्रा
    परिपूजितः पुरगतो दुर्मन्त्रिवाचा पुनः । गां क्रेतुं सचिवं न्ययुङ्क्त कुधिया तेनापि रुन्धन्मुनि प्राणक्षेपसरोषगोहतचमूचक्रेण
    वत्सो हृतः ॥ ॥ शुक्रोज्जीविततातवाक्यचलितक्रोधोऽथ सख्या समं बिभ्रद्ध्यातमहोदरोपनिहितं चापं कुठारं शरान्
    । आरूढः सहवाहयन्तृकरथं माहिष्मतीमाविशन् वाग्भिर्वत्समदाशुषि क्षितिपतौ सम्प्रास्तुथाः सङ्गरम् ॥ ॥ पुत्राणामयुतेन
    सप्तदशभिश्चाक्षौहिणीभिर्महा सेनानीभिरनेकमित्रनिवहैर्व्याजृम्भितायोधनः । सद्यस्त्वत्ककुठारबाणविदलन्निश्शेषसैन्योत्करो
    भीतिप्रद्रुतनष्टशिष्टतनयस्त्वामापतत् हेहयः ॥ ॥ लीलावारितनर्मदाजलवलल्लङ्केशगर्वापह श्रीमद्बाहुसहस्रमुक्तबहुशस्त्रास्त्रं
    निरुन्धन्नमुम् । चक्रे त्वय्यथ वैष्णवेऽपि विफले बुद्ध्वा हरिं त्वां मुदा ध्यायन्तं छितसर्वदोषमवधीः
    सोऽगात् परं ते पदम् ॥ ॥ भूयोऽमर्षितहेहयात्मजगणैस्ताते हते रेणुका माघ्नानां हृदयं निरीक्ष्य बहुशो घोरां
    प्रतिज्ञां वहन् । ध्यानानीतरथायुधस्त्वमकृथा विप्रद्रुहः क्षत्रियान् दिक्चक्रेषु कुठारयन् विशिखयन्
    निःक्षत्रियां मेदिनीम् ॥ ॥ तातोज्जीवनकृन्नृपालककुलं त्रिस्सप्तकृत्वो जयन् सन्तर्प्याथ समन्तपञ्चकमहारक्तहृदौघे
    पितृन् यज्ञे क्ष्मामपि काश्यपादिषु दिशन् साल्वेन युध्यन् पुनः कृष्णोऽमुं निहनिष्यतीति शमितो युद्धात्
    कुमारैर्भवान् ॥ ॥ न्यस्यास्त्राणि महेन्द्रभूभृति तपस्तन्वन् पुनर्मज्जितां गोकर्णावधि सागरेण धरणीं
    दृष्ट्वार्थितस्तापसैः । ध्यातेष्वासधृतानलास्त्रचकितं सिन्धुं स्रुवक्षेपणा दुत्सार्योद्धृतकेरलो भृगुपते
    वातेश संरक्ष माम् ॥
