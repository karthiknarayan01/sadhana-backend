id: markandeyamaharshikritamjagannathastotram
category: stotram
name:
  english: markandeyamaharshikritamjagannathastotram
  devanagari: मार्कण्डेयमहर्षिकृतंजगन्नाथस्तोत्रम्
content:
  english: markandeyamaharshikritam jagannathastotram markandeya uvaca | devadeva jagannatha mayabalavapurdhara
    | trahi mam carupadmaksha duhkhitam sharanagatam || 11|| santapto'smi surashreshtha samvartakhyena
    vahnina | angaravarshabhitam ca trahi mam purushottama || 12|| shoshitashca pracandena vayuna jagadamuna
    | vihvalo'ham tatha shrantastrahi mam purushottama || 13|| tapitashca tathamatyaih pralayavartakadibhih
    | na shantimadhigacchami trahi mam purushottama || 14|| trishitashca kshudha''vishto duhkhitashca
    jagatpate | trataram natra pashyami trahi mam purushottama || 15|| asminnekarnave ghore vinashte sacaracare
    | na cantamadhigacchami trahi mam purushottama || 16|| tavodare ca devesha maya drishtam caracaram
    | vismito'ham vishannashca trahi mam purushottama || 17|| samsare'sminniralambe prasida purushottama
    | prasida vibudhashreshtha prasida vibudhapriya || 18|| prasida vibudham natha prasida vibudhalaya
    | prasida sarvalokesha jagatkaranakarana || 19|| prasida sarvakriddeva prasida mama bhudhara | prasida
    salilavasa prasida madhusudana || 20|| prasida kamalakanta prasida tridasheshvara | prasida kamsakeshighna
    prasidarishtanashana || 21|| prasida krishna daityaghna prasida danujantaka | prasida mathuravasa
    prasida yadunandana || 22|| prasida shakravaraja prasida varadavyaya | tvam buddhih prakritishcaiva
    sattvadyastvam jagatpate || 23|| tvam nabhastvam manashcaiva tvamahankara eva ca | tvam buddhih prakritishcaiva
    sattvadyastvam jagatpate || 24|| purashastvam jagadvyapi purushadapi cottamah | tvamindiyani sarvani
    shabdadya vishayah prabho || 25|| tvam dikpalashca dharmashca veda yajnah sadakshinah | tvamindrastvam
    shivo devastvam havistvam hutashanah || 26|| tvam yamah pitriraddeva tvam rakshodhipatih svayam |
    varunastvamapam natha tvam vayustvam dhaneshvarah || 27|| tvamishanastvamanantastvam ganeshashca shanmukhah
    | vasavastvam tatha rudrastvamadityashca khecarah || 28|| danavastvam tatha yakshastvam daityah samarudganah
    | siddhashcapsaraso naga gandharvastvam sa caranah || 29|| pitaro balakhilyashca prajanam patayo'cyuta
    | munayastvamrishiganastvamashvinau nishacarah || 30|| anyashca jatayastvam hi yatkincijjivasamjnitam
    | kim catra bahunoktena brahmadistambagocaram || 31|| bhutam bhavyam bhavishyam ca tvam jagatsacaracaram
    | yatte rupam param deva kutasthamacalam dhruvam || 32|| brahmadyastanna jananti kathamanye'lpamedhasah
    | deva shuddhasvabhavo'si nityastvam prakriteh parah || 33|| avyaktah shashvato'nantah sarvavyapi
    maheshvarah | tvamakashah parah shanto ajastvam vibhuravyayah || 34|| evam tvam nirgunam stotum kah
    shaknoti niranjanam | stuto'si yanmaya deva vikalenalpacetasa | tatsarvam devadevesha kshantumarhasi
    cavyaya || 35|| iti brahmapurane pancapancashattamadhyayantargatam bhagavatstavanirupanam nama jagannathastotram
    samaptam | brahmapurana | adhyaya 55
  devanagari: मार्कण्डेयमहर्षिकृतं जगन्नाथस्तोत्रम् मार्कण्डेय उवाच । देवदेव जगन्नाथ मायाबालवपुर्धर ।
    त्राहि मां चारुपद्माक्ष दुःखितं शरणागतम् ॥ ११॥ सन्तप्तोऽस्मि सुरश्रेष्ठ संवर्ताख्येन वह्निना । अङ्गारवर्षभीतं
    च त्राहि मां पुरुषोत्तम ॥ १२॥ शोषितश्च प्रचण्डेन वायुना जगदामुना । विह्वलोऽहं तथा श्रान्तस्त्राहि
    मां पुरुषोत्तम ॥ १३॥ तापितश्च तथामात्यैः प्रलयावर्तकादिभिः । न शान्तिमधिगच्छामि त्राहि मां पुरुषोत्तम
    ॥ १४॥ तृषितश्च क्षुधाऽऽविष्टो दुःखितश्च जगत्पते । त्रातारं नात्र पश्यामि त्राहि मां पुरुषोत्तम ॥ १५॥
    अस्मिन्नेकार्णवे घोरे विनष्टे सचराचरे । न चान्तमधिगच्छामि त्राहि मां पुरुषोत्तम ॥ १६॥ तवोदरे च देवेश
    मया दृष्टं चराचरम् । विस्मितोऽहं विषण्णश्च त्राहि मां पुरुषोत्तम ॥ १७॥ संसारेऽस्मिन्निरालम्बे प्रसीद
    पुरुषोत्तम । प्रसीद विबुधश्रेष्ठ प्रसीद विबुधप्रिय ॥ १८॥ प्रसीद विबुधां नाथ प्रसीद विबुधालय । प्रसीद
    सर्वलोकेश जगत्कारणकारण ॥ १९॥ प्रसीद सर्वकृद्देव प्रसीद मम भूधर । प्रसीद सलिलावास प्रसीद मधुसूदन ॥
    २०॥ प्रसीद कमलाकान्त प्रसीद त्रिदशेश्वर । प्रसीद कंसकेशिघ्न प्रसीदारिष्टनाशन ॥ २१॥ प्रसीद कृष्ण दैत्यघ्न
    प्रसीद दनुजान्तक । प्रसीद मथुरावास प्रसीद यदुनन्दन ॥ २२॥ प्रसीद शक्रावरज प्रसीद वरदाव्यय । त्वं बुद्धिः
    प्रकृतिश्चैव सत्त्वाद्यास्त्वं जगत्पते ॥ २३॥ त्वं नभस्त्वं मनश्चैव त्वमहङ्कार एव च । त्वं बुद्धिः
    प्रकृतिश्चैव सत्त्वाद्यास्त्वं जगत्पते ॥ २४॥ पुरषस्त्वं जगद्व्यापी पुरुषादपि चोत्तमः । त्वमिन्दियाणि
    सर्वाणि शब्दाद्या विषयाः प्रभो ॥ २५॥ त्वं दिक्पालाश्च धर्माश्च वेदा यज्ञाः सदक्षिणाः । त्वमिन्द्रस्त्वं
    शिवो देवस्त्वं हविस्त्वं हुताशनः ॥ २६॥ त्वं यमः पितृराड्देव त्वं रक्षोधिपतिः स्वयम् । वरुणस्त्वमपां
    नाथ त्वं वायुस्त्वं धनेश्वराः ॥ २७॥ त्वमीशानस्त्वमनन्तस्त्वं गणेशश्च षण्मुखः । वसवस्त्वं तथा रुद्रास्त्वमादित्याश्च
    खेचराः ॥ २८॥ दानवास्त्वं तथा यक्षास्त्वं दैत्याः समरुद्गणाः । सिद्धाश्चाप्सरसो नागा गन्धर्वास्त्वं
    स चारणाः ॥ २९॥ पितरो बालखिल्याश्च प्रजानां पतयोऽच्युत । मुनयस्त्वमृषिगणास्त्वमश्विनौ निशाचराः ॥ ३०॥
    अन्याश्च जातयस्त्वं हि यत्किञ्चिज्जीवसंज्ञितम् । किं चात्र बहुनोक्तेन ब्रह्मादिस्तम्बगोचरम् ॥ ३१॥
    भूतं भव्यं भविष्यं च त्वं जगत्सचराचरम् । यत्ते रूपं परं देव कूटस्थमचलं ध्रुवम् ॥ ३२॥ ब्रह्माद्यास्तन्न
    जानन्ति कथमन्येऽल्पमेधसः । देव शुद्धस्वभावोऽसि नित्यस्त्वं प्रकृतेः परः ॥ ३३॥ अव्यक्तः शाश्वतोऽनन्तः
    सर्वव्यापी महेश्वरः । त्वमाकाशः परः शान्तो अजस्त्वं विभुरव्ययः ॥ ३४॥ एवं त्वां निर्गुणं स्तोतुं कः
    शक्नोति निरञ्जनम् । स्तुतोऽसि यन्मया देव विकलेनाल्पचेतसा । तत्सर्वं देवदेवेश क्षन्तुमर्हसि चाव्यय
    ॥ ३५॥ इति ब्रह्मपुराणे पञ्चपञ्चाशत्तमाध्यायान्तर्गतं भगवत्स्तवनिरूपणं नाम जगन्नाथस्तोत्रं समाप्तम्
    । ब्रह्मपुराण । अध्याय ५५
