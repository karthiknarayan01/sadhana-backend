  devanagari: ॐ कृष्णः कृष्णात्मकः कृष्णस्वरूपः कृष्णनामधृत् । कृष्णाङ्गः कृष्णदैवत्यः कृष्णारक्तविलोचनः
    ॥ ६३॥ कृष्णाश्रयः कृष्णवर्त्त्मा कृष्णालक्ताभिरक्षकः । कृष्णेशप्रीतिजनकः कृष्णेशप्रियकारकः ॥ ६४॥ कृष्णेशारिष्टसंहर्ता
    कृष्णेशप्राणवल्लभः । कृष्णेशानन्दजनकः कृष्णेशायुर्विवर्द्धनः ॥ ६५॥ कृष्णेशारिसमूहघ्नः कृष्णेशाभीष्टसिद्धिदः
    । कृष्णाधीशः कृष्णकेशः कृष्णानन्दविवर्द्धनः ॥ ६६॥ कृष्णागरुसुगन्धाढ्यः कृष्णागरुसुगन्धवित् । कृष्णागरुविवेकज्ञः
    कृष्णागरुविलेपनः ॥ ६७॥ कृतज्ञः कृतकृत्यात्मा कृपासिन्धुः कृपाकरः । कृष्णानन्दैकवरदः कृष्णानन्दपदाश्रयः
    ॥ ६८॥ कमलावल्लभाकारः कलिघ्नः कमलापतिः । कमलानन्दसम्पन्नः कमलासेविताकृतिः ॥ ६९॥ कमलामानसोल्लासी कमलामानदायकः
    । कमलालङ्कृताकारः कमलाश्रितविग्रहः ॥ ७०॥ कमलामुखपद्मार्कः कमलाकरपूजितः । कमलाकरमध्यस्थः कमलाकरतोषितः
    ॥ ७१॥ कमलाकरसंसेव्यः कमलाकरभूषितः । कमलाकरभावज्ञः कमलाकरसंयुतः ॥ ७२॥ कमलाकरपार्श्वस्थः कमलाकररूपवान्
    । कमलाकरशोभाढ्यः कमलाकरपङ्कजः ॥ ७३॥ कमलाकरपापघ्नः कमलाकरपुष्टिकृत् । कमलारूपसौभाग्यवर्द्धनः कमलेक्षणः
    ॥ ७४॥ कमलाकलिताङ्घ्र्यब्जः कमलाकलिताकृतिः । कमलाहृदयानन्दवर्द्धनः कमलाप्रियः ॥ ७५॥ कमलाचलचित्तात्मा
    कमलालङ्कृताकृतिः । कमलाचलभावज्ञः कमलालिङ्गिताकृतिः ॥ ७६॥ कमलामलनेत्रश्रीः कमलाचलमानसः । कमलापरमानन्दवर्द्धनः
    कमलाननः ॥ ७७॥ कमलानन्दसौभाग्यवर्द्धनः कमलाश्रयः । कमलाविलसत्पाणिः कमलामललोचनः ॥ ७८॥ कमलामलभालश्रीः
    कमलाकरपल्लवः । कमलेशः कमलभूः कमलानन्ददायकः ॥ ७९॥ कमलोद्भवभीतिघ्नः कमलोद्भवसंस्तुतः । कमलाकरपाशाढ्यः
    कमलोद्भवपालकः ॥ ८०॥ कमलासनसंसेव्यः कमलासनसंस्थितः । कमलासनरोगघ्नः कमलासनपापहा ॥ ८१॥ कमलोदरमध्यस्थः
    कमलोदरदीपनः । कमलोदरसम्पन्नः कमलोदरसुन्दरः ॥ ८२॥ कनकालङ्कृताकारः कनकालङ्कृताम्बरः । कनकालङ्कृतागारः
    कनकालङ्कृतासनः ॥ ८३॥ कनकालङ्कृतास्यश्रीः कनकालङ्कृतास्पदः । कनकालङ्कृताङ्घ्र्यब्जः कनकालङ्कृतोदरः
    ॥ ८४॥ कनकाम्बरशोभाढ्यः कनकाम्बरभूषणः । कनकोत्तमभालश्रीः कनकोत्तमरूपधृक् ॥ ८५॥ कनकागारमध्यस्थः कनकागारकारकः
    । कनकाचलमध्यस्थः कनकाचलपालकः ॥ ८६॥ कनकाचलशोभाढ्यः कनकाचलभूषणः । कनकैकप्रजाकर्ता कनकैकप्रदायकः ॥ ८७॥
    कलाननः कलरवः कलस्त्रीपरिवेष्टितः । कलहंसपरित्राता कलहंसपराक्रमः ॥ ८८॥ कलहंससमानश्रीः कलहंसप्रियङ्करः
    । कलहंसस्वभावस्थः कलहंसैकमानसः ॥ ८९॥ कलहंससमारूढः कलहंससमप्रभः । कलहंसविवेकज्ञः कलहंसगतिप्रदः ॥ ९०॥
    कलहंसपरित्राता कलहंससुखास्पदः । कलहंसकुलाधीशः कलहंसकुलास्पदः ॥ ९१॥ कलहंसकुलाधारः कलहंसकुलेश्वरः ।
    कलहंसकुलाचारी कलहंसकुलप्रियः ॥ ९२॥ कलहंसकुलत्राता कलहंसकुलात्मकः । कवीशः कविभावस्थः कविनाथः कविप्रियः
    ॥ ९३॥ कविमानसहंसात्मा कविवंशविभूषणः । कविनायकसंसेव्यः कविनायकपालकः ॥ ९४॥ कविवंशैकवरदः कविवंशशिरोमणिः
    । कविवंशविवेकज्ञः कविवंशप्रबोधकः ॥ ९५॥ कविवंशपरित्राता कविवंशप्रभाववित् । कवित्वामृतसंसिद्धः कवित्वामृतसागरः
    ॥ ९६॥ कवित्वाकारसंयुक्तः कवित्वाकारपालकः । कवित्वाद्वैतभावस्थः कवित्वाश्रयकारकः ॥ ९७॥ कवीन्द्रहृदयानन्दी
    कवीन्द्रहृदयास्पदः । कवीण्द्रहृदयान्तःस्थः कवीन्द्रज्ञानदायकः ॥ ९८॥ कवीन्द्रहृदयाम्भोजप्रकाशैकदिवाकरः
    । कवीन्द्रहृदयाम्भोजाह्लादनैकनिशाकरः ॥ ९९॥ कवीन्द्रहृदयाब्जस्थः कवीन्द्रप्रतिबोधकः । कवीन्द्रानन्दजनकः
    कवीन्द्राश्रितपङ्कजः ॥ १००॥ कविशब्दैकवरदः कविशब्दैकदोहनः । कविशब्दैकभावस्थः कविशब्दैककारणः ॥ १०१॥
    कविशब्दैकसंस्तुत्यः कविशब्दैकभूषणः । कविशब्दैकरसिकः कविशब्दविवेकवित् ॥ १०२॥ कवित्वब्रह्मविख्यातः कवित्वब्रह्मगोचरः
    । कविवाणीविवेकज्ञः कविवाणीविभूषणः ॥ १०३॥ कविवाणीसुधास्वादी कविवाणीसुधाकरः । कविवाणीविवेकस्थः कविवाणीविवेकवित्
    ॥ १०४॥ कविवाणीपरित्राता कविवाणीविलासवान् । कविशक्तिप्रदाता च कविशक्तिप्रवर्तकः ॥ १०५॥ कविशक्तिसमूहस्थः
    कविशक्तिकलानिधिः । कलाकोटिसमायुक्तः कलाकोटिसमावृतः ॥ १०६॥ कलाकोटिप्रकाशस्थः कलाकोटिप्रवर्तकः । कलानिधिसमाकारः
    कलानिधिसमन्वितः ॥ १०७॥ कलाकोटिपरित्राता कलाकोटिप्रवर्धनः । कलानिधिसुधास्वादी कलानिधिसमाश्रितः ॥ १०८॥
    कलङ्करहिताकारः कलङ्करहितास्पदः । कलङ्करहितानन्दः कलङ्करहितात्मकः ॥ १०९॥ कलङ्करहिताभासः कलङ्करहितोदयः
    । कलङ्करहितोद्देशः कलङ्करहिताननः ॥ ११०॥ कलङ्करहितश्रीशः कलङ्करहितस्तुतिः । कलङ्करहितोत्साहः कलङ्करहितप्रियः
    ॥ १११॥ कलङ्करहितोच्चारः कलङ्करहितेन्दिरयः । कलङ्करहिताकारः कलङ्करहितोत्सवः ॥ ११२॥ कलङ्काङ्कितदुष्टघ्नः
    कलङ्काङ्कितधर्महा । कलङ्काङ्कितकर्मारिः कलङ्काङ्कितमार्गहृत् ॥ ११३॥ कलङ्काङ्कितदुर्द्दर्शः कलङ्काङ्कितदुःसहः
    । कलङ्काङ्कितदूरस्थः कलङ्काङ्कितदूषणः ॥ ११४॥ कलहोत्पत्तिसंहर्ता कलहोत्पत्तिकृद्रिपुः । कलहातीतधामस्थः
    कलहातीतनायकः ॥ ११५॥ कलहातीततत्त्वज्ञः कलहातीतवैभवः । कलहातीतभावस्थः कलहातीतसत्तमः ॥ ११६॥ कलिकालबलातीतः
    कलिकालविलोपकः । कलिकालैकसंहर्ता कलिकालैकदूषणः ॥ ११७॥ कलिकालकुलध्वंसी कलिकालकुलापहः । कलिकालभयच्छेत्ता
    कलिकालमदापहः ॥ ११८॥ कलिक्लेशविनिर्मुक्तः कलिक्लेशविनाशनः । कलिग्रस्तजनत्राता कलिग्रस्तनिजार्तिहा ॥
    ११९॥ कलिग्रस्तजगन्मित्रः कलिग्रस्तजगत्पतिः । कलिग्रस्तजगत्त्राता कलिपाशविनाशनः ॥ १२०॥ कलिमुक्तिप्रादाता
    कः कलिमुक्तकलेवरः । कलिमुक्तमनोवृत्तिः कलिमुक्तमहामतिः ॥ १२१॥ कलिकालमतातीतः कलिधर्मविलोपकः । कलिधर्माधिपध्वंसी
    कलिधर्मैकखण्डनः ॥ १२२॥ कलिधर्माधिपालक्ष्यः कलिकालविकारहा । कलिकर्मकथातीतः कलिकर्मकथारिपुः ॥ १२३॥ कलिकष्टैकशमनः
    कलिकष्टविवर्ज्जितः । कलिघ्नः कलिधर्मघ्नः कलिधर्माधिकारिहा ॥ १२४॥ कर्मवित्कर्मकृत्कर्मी कर्मकाण्डैकदोहनः
    । कर्मस्थः कर्मजनकः कर्मिष्ठः कर्मसाधनः ॥ १२५॥ कर्मकर्ता कर्मभर्ता कर्महर्ता च कर्मजित् । कर्मजातजगत्त्राता
    कर्मजातजगत्पतिः ॥ १२६॥ कर्मजातजगन्मित्रः कर्मजातजगद्गुरुः । कर्मभूतभवच्छात्रः कर्मभूतभवातिहा ॥ १२७॥
    कर्मकाण्डपरिज्ञाता कर्मकाण्डप्रवर्त्तकः । कर्मकाण्डपरित्राता कर्मकाण्डप्रमाणकृत् ॥ १२८॥ कर्मकाण्डविवेकज्ञः
    कर्मकाण्डप्रकारकः । कर्मकाण्डविवेकस्थः कर्मकाण्डैकदोहनः ॥ १२९॥ कर्मकाण्डरताभीष्टप्रदाता कर्मतत्परः
    । कर्मबद्धजगत्त्राता कर्मबद्धजगद्गुरुः ॥ १३०॥ कर्मबन्धार्तिशमनः कर्मबन्धविमोचनः । कर्मिष्ठद्विजवर्यस्थः
    कर्मिष्ठद्विजवल्लभः ॥ १३१॥ कर्मिष्ठद्विजजीवात्मा कर्मिष्ठद्विजजीवनः । कर्मिष्ठद्विजभावज्ञः कर्मिष्ठद्विजपालकः
    ॥ १३२॥ कर्मिष्ठद्विजजातिस्थः कर्मिष्ठद्विजकामदः । कर्मिष्ठद्विजसंसेव्यः कर्मिष्ठद्विजपापहा ॥ १३३॥
    कर्मिष्ठद्विजबुद्धिस्थः कर्मिष्ठद्विजबोधकः । कर्मिष्ठद्विजभीतिघ्नः कर्मिष्ठद्विजमुक्तिदः ॥ १३४॥ कर्मिष्ठद्विजदोषघ्नः
    कर्मिष्ठद्विजकामधुक् । कर्मिष्ठद्विजसम्पूज्यः कर्मिष्ठद्विजतारकः ॥ १३५॥ कर्मिष्ठारिष्टसंहर्ता कर्मिष्ठाभीष्टसिद्धिदः
    । कर्मिष्ठादृष्टमध्यस्थः कर्मिष्ठादृष्टवर्धनः ॥ १३६॥ कर्ममूलजगद्धेतुः कर्ममूलनिकन्दनः । कर्मबीजपरित्राता
    कर्मबीजविवर्द्धनः ॥ १३७॥ कर्मद्रुमफलाधीशः कर्मद्रुमफलप्रदः । कस्तूरीद्रवलिप्ताङ्गः कस्तूरीद्रववल्लभः
    ॥ १३८॥ कस्तूरीसौरभग्राही कस्तूरीमृगवल्लभः । कस्तूरीतिलकानन्दी कस्तूरीतिलकप्रियः ॥ १३९॥ कस्तूरीतिलकाश्लेषी
    कस्तूरीतिलकाङ्कितः । कस्तूरीवासनालीनः कस्तूरीवासनाप्रियः ॥ १४०॥ कस्तूरीवासनारूपः कस्तूरीवासनात्मकः
    । कस्तूरीवासनान्तःस्थः कस्तूरीवासनास्पदः ॥ १४१॥ कस्तूरीचन्दनग्राही कस्तूरीचन्दनार्चितः । कस्तूरीचन्दनागारः
    कस्तूरीचन्दनान्वितः ॥ १४२॥ कस्तूरीचन्दनाकारः कस्तूरीचन्दनासनः । कस्तूरीचर्चितोरस्कः कस्तूरीचर्विताननः
    ॥ १४३॥ कस्तूरीचर्वितश्रीशः कस्तूरीचर्चिताम्बरः । कस्तूरीचर्चितास्यश्रीः कस्तूरीचर्चितप्रियः ॥ १४४॥
    कस्तूरीमोदमुदितः कस्तूरीमोदवर्द्धनः । कस्तूरीमोददीप्ताङ्गः कस्तूरीसुन्दराकृतिः ॥ १४५॥ कस्तूरीमोदरसिकः
    कस्तूरीमोदलोलुपः । कस्तूरीपरमानन्दी कस्तूरीपरमेश्वरः ॥ १४६॥ कस्तूरीदानसन्तुष्टः कस्तूरीदानवल्लभः ।
    कस्तूरीपरमाह्लादः कस्तूरीपुष्टिवर्द्धनः ॥ १४७॥ कस्तूरीमुदितात्मा च कस्तूरीमुदिताशयः । कदलीवनमध्यस्थः
    कदलीवनपालकः ॥ १४८॥ कदलीवनसञ्चारी कदलीवनवल्लभः । कदलीदर्शनानन्दी कदलीदर्शनोत्सुकः ॥ १४९॥ कदलीपल्लवास्वादी
    कदलीपल्लवाश्रयः । कदलीफलसन्तुष्टः कदलीफलदायकः ॥ १५०॥ कदलीफलसम्पुष्टः कदलीफलभोजनः । कदलीफलवर्याशी कदलीफलतोषितः
    ॥ १५१॥ कदलीफलमाधुर्यवल्लभः कदलीप्रियः । कपिध्वजसमायुक्तः कपिध्वजपरिस्तुतः ॥ १५२॥ कपिध्वजपरित्राता
    कपिध्वजसमाश्रितः । कपिध्वजपदान्तस्थः कपिध्वजजयप्रदः ॥ १५३॥ कपिध्वजरथारूढः कपिध्वजयशःप्रदः । कपिध्वजैकपापघ्नः
    कपिध्वजसुखप्रदः ॥ १५४॥ कपिध्वजारिसंहर्ता कपिध्वजभयापहः । कपिध्वजमनोऽभिज्ञः कपिध्वजमतिप्रदः ॥ १५५॥
    कपिध्वजसुहृन्मित्रः कपिध्वजसुहृत्सखः । कपिध्वजाङ्गनाराध्यः कपिध्वजगतिप्रदः ॥ १५६॥ कपिध्वजाङ्गनारिघ्नः
    कपिध्वजरतिप्रदः । कपिध्वजकुलत्राता कपिध्वजकुलारिहा ॥ १५७॥ कपिध्वजकुलाधीशः कपिध्वजकुलप्रियः । कपीन्द्रसेविताङ्घ्र्यब्जः
    कपीन्द्रस्तुतिवल्लभः ॥ १५८॥ कपीन्द्रानन्दजनकः कपीन्द्राश्रितविग्रहः । कपीन्द्राश्रितपादाब्जः कपीन्द्राश्रितमानसः
    ॥ १५९॥ कपीन्द्राराधिताकारः कपीन्द्राभीष्टसिद्धिदः । कपीन्द्रारातिसंहर्ता कपीन्द्रातिबलप्रदः ॥ १६०॥
    कपीन्द्रैकपरित्राता कपीन्द्रैकयशःप्रदः ॥ १६१॥ कपीन्द्रानन्दसम्पन्नः कपीन्द्रानन्दवर्द्धनः । कपीन्द्रध्यानगम्यात्मा
    कपीन्द्रज्ञानदायकः ॥ १६२॥ कल्याणमङ्गलाकारः कल्याणमङ्गलास्पदः । कल्याणमङ्गलाधीशः कल्याणमङ्गलप्रदः ॥
    १६३॥ कल्याणमङ्गलागारः कल्याणमङ्गलात्मकः । कल्याणानन्दसपन्नः कल्याणानन्दवर्धनः ॥ १६४॥ कल्याणानन्दसहितः
    कल्याणानन्ददायकः ॥ १६५॥ कल्याणानन्दसन्तुष्टः कल्याणानन्दसंयुतः । कल्याणीरागसङ्गीतः कल्याणीरागवल्लभः
    ॥ १६६॥ कल्याणीरागरसिकः कल्याणीरागकारकः । कल्याणीकेलिकुशलः कल्याणीप्रियदर्शनः ॥ १६७॥ कल्पशास्त्रपरिज्ञाता
    कल्पशास्त्रार्थदोहनः । कल्पशास्त्रसमुद्धर्ता कल्पशास्त्रपरिस्तुतः ॥ १६८॥ कल्पकोटिशतातीतः कल्पकोटिशतोत्तरः
    । कल्पकोटिशतज्ञानी कल्पकोटिशतप्रभुः ॥ १६९॥ कल्पवृक्षसमाकारः कल्पवृक्षसमप्रभः । कल्पवृक्षसमोदारः कल्पवृक्षसमस्थितः
    ॥ १७०॥ कल्पवृक्षपरित्राता कल्पवृक्षसमावृतः । कल्पवृक्षवनाधीशः कल्पवृक्षवनास्पदः ॥ १७१॥ कल्पान्तदहनाकारः
    कल्पान्तदहनोपमः । कल्पान्तकालशमनः कल्पान्तातीतविग्रहः ॥ १७२॥ कलशोद्भवसंसेव्यः कलशोद्भववल्लभः । कलशोद्भवभीतिघ्नः
    कलशोद्भवसिद्धिदः ॥ १७३॥ कपिलः कपिलाकारः कपिलप्रियदर्शनः । कर्द्दमात्मजभावस्थः कर्द्दमप्रियकारकः ॥
    १७४॥ कन्यकानीकवरदः कन्यकानीकवल्लभः । कन्यकानीकसंस्तुत्यः कन्यकानीकनायकः ॥ १७५॥ कन्यादानप्रदत्राता
    कन्यादानप्रदप्रियः । कन्यादानप्रभावज्ञः कन्यादानप्रदायकः ॥ १७६॥ कश्यपात्मजभावस्थः कश्यपात्मजभास्करः
    । कश्यपात्मजशत्रुघ्नः कश्यपात्मजपालकः ॥ १७७॥ कश्यपात्मजमध्यस्थः कश्यपात्मजवल्लभः । कश्यपात्मजभीतिघ्नः
    कश्यपात्मजदुर्लभः ॥ १७८॥ कश्यपात्मजभावस्थः कश्यपात्मजभाववित् । कश्यपोद्भवदैत्यारिः कश्यपोद्भवदेवराट्
    ॥ १७९॥ कश्पयानन्दजनकः कश्यपानन्दवर्द्धनः । कश्यपारिष्टसंहर्ता कश्यपाभीष्टसिद्धिदः ॥ १८०॥ कर्तृकर्मक्रियातीतः
    कर्तृकर्मक्रियान्वयः । कर्तृकर्मक्रियालक्ष्यः कर्तृकर्मक्रियास्पदः ॥ १८१॥ कर्तृकर्मक्रियाधीशः कर्तृकर्मक्रियात्मकः
    । कर्तृकर्मक्रियाभासः कर्तृकर्मक्रियाप्रदः ॥ १८२॥ कृपानाथः कृपासिन्धुः कृपाधीशः कृपाकरः । कृपासागरमध्यस्थः
    कृपापात्रः कृपानिधिः ॥ १८३॥ कृपापात्रैकवरदः कृपापात्रभयापहः । कृपाकटाक्षपापघ्नः कृतकृत्यः कृतान्तकः
    ॥ १८४॥ कदम्बवनमध्यस्थः कदम्बकुसुमप्रियः । कदम्बवनसञ्चारी कदम्बवनवल्लभः ॥ १८५॥ कर्पूरामोदमुदितः कर्पूरामोदवल्लभः
    । कर्पूरवासनासक्तः कर्पूरागरुचर्चितः ॥ १८६॥ करुणारसंसम्पूर्णः करुणारसवर्धनः । करुणाकरविख्यातः करुणाकरसागरः
    ॥ १८७॥ कालात्मा कालजनकः कालाग्निः कालसंज्ञकः । कालः कालकलातीतः कालस्थः कालभैरवः ॥ १८८॥ कालज्ञः कालसंहर्ता
    कालचक्रप्रवर्तकः । कालरूपः कालनाथः कालकृत्कालिकाप्रियः ॥ १८९॥ कालैकवरदः कालः कारणः कालरूपभाक् । कालमायाकलातीतः
    कालमायाप्रवर्तकः ॥ १९०॥ कालमायाविनिर्मुक्तः कालमायाबलापहः । कालत्रयगतिज्ञाता कालत्रयपराक्रमः ॥ १९१॥
    कालज्ञानकलातीतः कालज्ञानप्रदायकः । कालज्ञः कालरहितः कालाननसमप्रभः ॥ १९२॥ कालचक्रैक हेतुस्थः कालरात्रिदुरत्ययः
    । कालपाशविनिर्मुक्तः कालपाशविमोचनः ॥ १९३॥ कालव्यालैकदलनः कालव्यालभयापहः । कालकर्मकलातीतः कालकर्मकलाश्रयः
    ॥ १९४॥ कालकर्मकलाधीशः कालकर्मकलात्मकः । कालव्यालपरिग्रस्तनिजभक्तैकमोचनः ॥ १९५॥ काशिराजशिरश्छेत्ता
    काशीशप्रियकारकः । काशीस्थार्तिहरः काशीमध्यस्थः काशिकाप्रियः ॥ १९६॥ काशीवासिजनानन्दी काशीवासिजनप्रियः
    । काशीवासिजनत्राता काशीवासिजनस्तुतः ॥ १९७॥ काशीवासिविकारघ्नः काशीवासिविमोचनः । काशीवासिजनोद्धर्ता
    काशीवासकुलप्रदः ॥ १९८॥ काशीवास्याश्रिताङ्घ्र्यब्जः काशीवासिसुखप्रदः । काशीस्थाभीष्टफलदः काशीस्थारिष्टनाशनः
    ॥ १९९॥ काशीस्थद्विजसंसेव्यः काशीस्थद्विजपालकः । काशीस्थद्विजसद्बुद्धिप्रदाता काशिकाश्रयः ॥ २००॥ कान्तीशः
    कान्तिदः कान्तः कान्तारप्रियदर्शनः । कान्तिमान्कान्तिजनकः कान्तिस्थः कान्तिवर्धनः ॥ २०१॥ कालागरुसुगन्धाढ्यः
    कालागरुविलेपनः । कालागरुसुगन्धज्ञः कालागरुसुगन्धकृत् ॥ २०२॥ कापट्यपटलच्छेत्ता कायस्थः कायवर्धनः ।
    कायभाग्भयभीतिघ्नः कायरोगापहारकः ॥ २०३॥ कार्यकारणकर्तृस्थः कार्यकारणकारकः । कार्यकारणसम्पन्नः कार्यकारणसिद्धिदः
    ॥ २०४॥ काव्यामृतरसास्वादी काव्यामृतरसात्मकः । काव्यामृतरसाभिज्ञः कार्यामृतरसप्रियः ॥ २०५॥ कादिवर्णैकजनकः
    कादिवर्णप्रवर्तकः । कादिवर्णविवेकज्ञः कादिवर्णविनोदवान् ॥ २०६॥ कादिहादिमनुज्ञाता कादिहादिमनुप्रियः
    । कादिहादिमनूद्धारकारकः कादिसंज्ञकः ॥ २०७॥ कालुष्यरहिताकारः कालुष्यैकविनाशनः । कारागृहविमुक्तात्मा
    कारागृहविमोचनः ॥ २०८॥ कामात्मा कामदः कामी कामेशः कामपूरकः । कामहृत्कामजनकः कामिकामप्रदायकः ॥ २०९॥
    कामपालः कामभर्ता कामकेलिकलानिधिः । कामकेलिकलासक्तः कामकेलिकलाप्रियः ॥ २१०॥ कामबीजैकवरदः कामबीजसमन्वितः
    । कामजित्कामवरदः कामक्रीडातिलालसः ॥ २११॥ कामार्तिशमनः कामालङ्कृतः कामसंस्तुतः । कामिनीकामजनकः कामिनीकामवर्धनः
    ॥ २१२॥ कामिनीकामरसिकः कामिनीकामपूरकः । कामिनीमानदः कामकलाकौतूहलप्रियः ॥ २१३॥ कामिनीप्रेमजनकः कामिनीप्रेमवर्धनः
    । कामिनीहावभावज्ञः कामिनीप्रीतिवर्धनः ॥ २१४॥ कामिनीरूपरसिकः कामिनीरूपभूषणः । कामिनीमानसोल्लासी कामिनीमानसास्पदः
    ॥ २१५॥ कामिभक्तजनत्राता कामिभक्तजनप्रियः । कामेश्वरः कामदेवः कामबीजैकजीवनः ॥ २१६॥ कालिन्दीविषसंहर्ता
    कालिन्दीप्राणजीवनः । कालिन्दीहृदयानन्दी कालिन्दीनीरवल्लभः ॥ २१६॥ कालिन्दीकेलिकुशलः कालिन्दीप्रीतिवर्धनः
    । कालिन्दीकेलिरसिकः कालिन्दीकेलिलालसः ॥ २१८॥ कालिन्दीनीरसङ्खेलद्गोपीयूथसमावृतः । कालिन्दीनीरमध्यस्थः
    कालिन्दीनीरकेलिकृत् ॥ २१९॥ कालिन्दीरमणासक्तः कालिनागमदापहः । कामधेनुपरित्राता कामधेनुसमावृतः ॥ २२०॥
    काञ्चनाद्रिसमानश्रीः काञ्चनाद्रिनिवासकृत् । काञ्चनाभूषणासक्तः काञ्चनैकविवर्धनः ॥ २२१॥ काञ्चनाभश्रियासक्तः
    काञ्चनाभश्रियाश्रितः । कार्तिकेयैकवरदः कार्तवीर्यमदापहः ॥ २२२॥ किशोरीनायिकासक्तः किशोरीनायिकाप्रियः
    । किशोरीकेलिकुशलः किशोरीप्राणजीवनः ॥ २२३॥ किशोरीवल्लभाकारः किशोरीप्राणवल्लभः । किशोरीप्रीतिजनकः किशोरीप्रियदर्शनः
    ॥ २२४॥ किशोरीकेलिसंसक्तः किशोरीकेलिवल्लभः । किशोरीकेलिसंयुक्तः किशोरीकेलिलोलुपः ॥ २२५॥ किशोरीहृदयानन्दी
    किशोरीहृदयास्पदः । किशोरीशः किशोरात्मा किशोरः किंशुकाकृतिः ॥ २२६॥ किंशुकाभरणालक्ष्यः किंशुकाभरणान्वितः
    । कीर्तिमान्कीर्तिजनकः कीर्तनीयपराक्रमः ॥ २२७॥ कीर्तनीययशोराशिः कीर्तिस्थः कीर्तनप्रियः । कीर्तिश्रीमतिदः
    कीशः कीर्तिज्ञः कीर्तिवर्धनः ॥ २२८॥ क्रियात्मकः क्रियाधारः किर्याभासः क्रियास्पदः । कीलालामलचिद्वृत्तिः
    कीलालाश्रयकारणः ॥ २२९॥ कुलधर्माधिपाधीशः कुलधर्माधिपप्रियः । कुलधर्मपरित्राता कुलधर्मपतिस्तुतः ॥ २३०॥
    कुलधर्मपदाधारः कुलधर्मपदाश्रयः । कुलधर्मपतिप्राणः कुलधर्मपतिप्रियः ॥ २३१॥ कुलधर्मपतित्राता कुलधर्मैकरक्षकः
    । कुलधर्मसमासक्तः कुलधर्मैकदोहनः ॥ २३२॥ कुलधर्मसमुद्धर्ता कुलधर्मप्रभाववित् । कुलधर्मसमाराध्यः कुलधर्मधुरन्धरः
    ॥ २३३॥ कुलमार्गरतासक्तः कुलमार्गरताश्रयः । कुलमार्गसमासीनः कुलमार्गसमुत्सुकः ॥ २३४॥ कुलधर्माधिकारस्थः
    कुलधर्मविवर्धनः । कुलाचारविचारज्ञः कुलाचारसमाश्रितः ॥ २३५॥ कुलाचारसमायुक्तः कुलाचारसुखप्रदः । कुलाचारातिचतुरः
    कुलाचारातिवल्लभः ॥ २३६॥ कुलाचारपवित्राङ्गः कुलाचारप्रमाणकृत् । कुलवृक्षैकजनकः कुलवृक्षविवर्धनः ॥ २३७॥
    कुलवृक्षपरित्राता कुलवृक्षफलप्रदः । कुलवृक्षफलाधीशः कुलवृक्षफलाशनः ॥ २३८॥ कुलमार्गकलाभिज्ञः कुलमार्गकलान्वितः
    । कुकर्मनिरतातीतः कुकर्मनिरतान्तकः ॥ २३९॥ कुकर्ममार्गरहितः कुकर्मैकनिषूदनः । कुकर्मरहिताधीशः कुकर्मरहितात्मकः
    ॥ २४०॥ कुकर्मरहिताकारः कुकर्मरहितास्पदः । कुकर्मरहिताचारः कुकर्मरहितोत्सवः ॥ २४१॥ कुकर्मरहितोद्देशः
    कुकर्मरहितप्रियः । कुकर्मरहितान्तस्थः कुकर्मरहितेश्वरः ॥ २४२॥ कुकर्मरहितस्त्रीशः कुकर्मरहितप्रजः ।
    कुकर्मोद्भवपापघ्नः कुकर्मोद्भवदुःखहा ॥ २४३॥ कुतर्करहिताधीशः कुतर्करहिताकृतिः । कूटस्थसाक्षी कूटात्मा
    कूटस्थाक्षरनायकः ॥ २४४॥ कूटस्थाक्षरसंसेव्यः कूटस्थाक्षरकारणः । कुबेरबन्धुः कुशलः कुम्भकर्णविनाशनः
    ॥ २४५॥ कूर्माकृतिधरः कूर्मः कूर्मस्थावनिपालकः । कुमारीवरदः कुस्थः कुमारीगणसेवितः ॥ २४६॥ कुशस्थलीसमासीनः
    कुशदैत्यविनाशनः । केशवः क्लेशसंहर्ता केशिदैत्यविनाशनः ॥ २४७॥ क्लेशहीनमनोवृत्तिः क्लेशहीनपरिग्रहः ।
    क्लेशातीतपदाधीशः क्लेशातीतजनप्रियः ॥ २४८॥ क्लेशातीतशुभाकारः क्लेशातीतसुखास्पदः । क्लेशातीतसमाजस्थः
    क्लेशातीतमहामतिः ॥ २४९॥ क्लेशातीतजनत्राता क्लेशहीनजनेश्वरः । क्लेशहीनस्वधर्मस्थः क्लेशहीनविमुक्तिदः
    ॥ २५०॥ क्लेशहीननराधीशःक्लेशहीननरोत्तमः । क्लेशातिरिक्तसदनः क्लेशमूलनिकन्दनः ॥ २५१॥ क्लेशातिरिक्तभावस्थः
    क्लेशहीनैकवल्लभः । क्लेशहीनपदान्तस्थः क्लेशहीनजनार्द्दनः ॥ २५२॥ केसराङ्कितभालश्रीः केसराङ्कितवल्लभः
    । केसरालिप्तहृदयः केसरालिप्तसद्भुजः ॥ २५३॥ केसराङ्कितवासश्रीः केसराङ्कितविग्रहः । केसराकृतिगोपीशः
    केसरामोदवल्लभः ॥ २५४॥ केसरामोदमधुपः केसरामोदसुन्दरः । केसरामोदमुदितः केसरामोदवर्धनः ॥ २५५॥ केसरार्चितभालश्रीः
    केसरार्चितविग्रहः । केसरार्चितपादाब्जः केसरार्चितकुण्डलः ॥ २५६॥ केसरामोदसम्पन्नः केसरामोदलोलुपः ।
    केतकीकुसुमासक्तःकेतकीकुसुमप्रियः ॥ २५७॥ केतकीकुसुमाधीशःकेतकीकुसुमाङ्कितः । केतकीकुसुमामोदवर्धनः केतकीप्रियः
    ॥ २५८॥ केतकीशोभिताकारः केतकीशोभिताम्बरः । केतकीकुसुमामोदवल्लभः केतकीश्वरः ॥ २५९॥ केतकीसौरभानन्दी केतकीसौरभप्रियः
    । केयूरालङ्कृतभुजः केयूरालङ्कृतात्मकः ॥ २६०॥ केयूरालङ्कृतश्रीशःकेयूरप्रियदर्शनः । केदारेश्वरसंयुक्तः
    केदारेश्वरवल्लभः ॥ २६१॥ केदारेश्वरपार्श्वस्थः केदारेश्वरभक्तपः । केदारकल्पसारज्ञः केदारस्थलवासकृत्
    ॥ २६२॥ केदाराश्रितभीतिघ्नः केदाराश्रितमुक्तिदः । केदारावासिवरदः केदाराश्रितदुःखहा ॥ २६३॥ केदारपोषकः
    केशः केदारान्नविवर्द्धनः । केदारपुष्टिजनकः केदारप्रियदर्शनः ॥ २६४॥ कैलासेशसमाजस्थः कैलासेशप्रियङ्करः
    । कैलासेशसमायुक्तः कैलासेशप्रभाववित् ॥ २६५॥ कैलासाधीशत्रुघ्नः कैलासपतितोषकः । कैलासाधीशसहितः कैलासाधीशवल्लभः
    ॥ २६६॥ कैवल्यमुक्तिजनकः कैवल्यपदवीश्वरः । कैवल्यपदवीत्राता कैवल्यपदवीप्रियः ॥ २६७॥ कैवल्यज्ञानसम्पन्नः
    कैवल्यज्ञानसाधनः । कैवल्यज्ञानगम्यात्मा कैवल्यज्ञानदायकः ॥ २६८॥ कैवल्यज्ञानसंसिद्धः कैवल्यज्ञानदीपकः
    । कैवल्यज्ञानविख्यातः कैवल्यैकप्रदायकः ॥ २६९॥ क्रोधलोभभयातीतः क्रोधलोभविनाशनः । क्रोधारिः क्रोधहीनात्मा
    क्रोधहीनजनप्रियः ॥ २७०॥ क्रोधहीनजनाधीशः क्रोधहीनप्रजेश्वरः । कोपतापोपशमनः कोपहीनवरप्रदः ॥ २७१॥ कोपहीननरत्राता
    कोपहीनजनाधिपः । कोपहीननरान्तःस्थः कोपहीनप्रजापतिः ॥ २७२॥ कोपहीनप्रियासक्तः कोपहीनजनार्तिहा । कोपहीनपदाधीशः
    कोपहीनपदप्रदः ॥ २७३॥ कोपहीननरस्वामी कोपहीनस्वरूपधृक् । कोकिलालापसङ्गीतः कोकिलालापवल्लभः ॥ २७४॥ कोकिलालापलीनात्मा
    कोकिलालापकारकः । कोकिलालापकान्तेशः कोकिलालापभाववित् ॥ २७५॥ कोकिलागानरसिकः कोकिलावरवल्लभः । कोटिसूर्यसमानश्रीः
    कोटिचन्द्रामृतात्मकः ॥ २७६॥ कोटिदानवसंहर्ता कोटिकन्दर्पदर्पहा । कोटिदेवेन्द्रसंसेव्यः कोटिब्रह्मार्चिताकृतिः
    ॥ २७७॥ कोटिब्रह्माण्डमध्यस्थः कोटिविद्युत्समद्युतिः । कोट्यश्वमेधपापघ्नः कोटिकामेश्वराकृतिः ॥ २७८॥
    कोटिमेघसमोदारः कोटिवह्निसुदुःसहः । कोटिपाथोधिगम्भीरः कोटिमेरुसमस्थिरः ॥ २७९॥ कोटिगोपीजनाधीशः कोटिगोपाङ्गनावृतः
    । कोटिदैत्येशदप्रघ्नः कोटिरुद्रपराकर्मः ॥ २८०॥ कोटिभक्तार्तिशमनः कोटिदुष्टविमर्दनः । कोटिभक्तजनोद्धर्ता
    कोटियज्ञफलप्रदः ॥ २८१॥ कोटिदेवर्षिसंसेव्यः कोटिब्रह्मर्षिमुक्तिदः । कोटिराजर्षिसंस्तुत्यः कोटिब्रह्माण्डमण्डनः
    ॥ २८२॥ कोट्याकाशप्रकाशात्मा कोटिवायुमहाबलः । कोटितेजोमयाकारः कोटिभूमिसमक्षमी ॥ २८३॥ कोटिनीरसमस्वच्छः
    कोटिदिग्ज्ञानदायकः । कोटिब्रह्माण्डजनकः कोटिब्रह्माण्डपालकः ॥ २८४॥ कोटिब्रह्माण्डसंहर्ता कोटिब्रह्माण्डबोधकः
    । कोटिवाक्पतिवाचालः कोटिशुक्रकवीश्वरः ॥ २८५॥ कोटिद्विजसमाचारः कोटिहेरम्बविघ्नहा । कोटिमानसहंसात्मा
    कोटिमानससंस्थितः ॥ २८६॥ कोटिच्छलकरारातिः कोटिदाम्भिकनाशनः । कोटिशून्यपथच्छेत्ता कोटिपाखण्डखण्डनः ॥
    २८७॥ कोटिशेषधराधारः कोटिकालप्रबोधकः । कोटिवेदान्तसंवेद्यः कोटिसिद्धान्तनिश्चयः ॥ २८८॥ कोटियोगीश्वराधीशः
    कोटियोगैकसिद्धिदः । कोटिधामाधिपाधीशः कोटिलोकैकपालकः ॥ २८९॥ कोटियज्ञैकभोक्ता च कोटियज्ञफलप्रदः । कोटिभक्तहृदन्तस्थः
    कोटिभक्ताभयप्रदः ॥ २९०॥ कोटिजन्मार्तिशमनः कोटिजन्माघनाशनः । कोटिजन्मान्तरज्ञानप्रदाता कोटिभक्तपः ॥
    २९१॥ कोटिशक्तिसमायुक्तः कोटिचैतन्यबोधकः । कोटिचक्रावृताकारः कोटिचक्रप्रवर्तकः ॥ २९२॥ कोटिचक्रार्चनत्राता
    कोटिवीरावलीवृतः । कोटितीर्थजलान्तस्थः कोटितीर्थफलप्रदः ॥ २९३॥ कोमलामलचिद्वृत्तिः कोमलामलमानसः । कौस्तुभोद्भासितोरस्कः
    कौस्तुभोद्भासिताकृतिः ॥ २९४॥ कौरवानीकसंहर्ता कौरवार्णवकुम्भभूः । कौन्तेयाश्रितपादाब्जः कौन्तेयाभयदायकः
    ॥ २९५॥ कौन्तेयारातिसंहर्ता कौन्तेयप्रतिपालकः । कौन्तेयानन्दजनकः कौन्तेयप्राणजीवनः ॥ २९६॥ कौन्तेयाचलभावज्ञः
    कौन्तेयाचलमुक्तिदः । कौमुदीमुदिताकारः कौमुदीमुदिताननः ॥ २९७॥ कौमुदीमुदितप्राणः कौमुदीमुदिताशयः । कौमुदीमोदमुदितः
    कौमुदीमोदवल्लभः ॥ २९८॥ कौमुदीमोदमधुपः कौमुदीमोदवर्धनः । कौमुदीमोदमानात्मा कौमुदीमोदसुन्दरः ॥ २९९॥
    कौमुदीदर्शनानन्दी कौमुदीदर्शनोत्सुकः । कौसल्यापुत्रभावस्थः कौसल्यानन्दवर्धनः ॥ ३००॥ कंसारिः कंसहीनात्मा
    कंसपक्षनिकन्दनः । कङ्कालः कङ्कवरदः कण्टकक्षयकारकः ॥ ३०१॥ कन्दर्पदर्पशमनः कन्दर्पाभिमनोहरः । कन्दर्पकामनाहीनः
    कन्दर्पज्वरनाशनः ॥ ३०२॥ कन्दर्पज्वरनाशन ॐ नम इति इति श्रीसर्वसौभाग्यवर्धनं श्रीपतिप्रियम् । नाम्नामक्षरकादीनां
    सहस्रं परिकीर्तितम् ॥ ३०३॥ सर्वापराधशमनं रहस्यं श्रुतिगोचरम् । कलिकालैकदमनं क्रूरशत्रुनिकन्दनम् ॥
    ३०४॥ क्रूरपापसमूहघ्नं क्रूरकर्मविनाशनम् । क्रूरासुरौघसंहारकारकं क्लेशनाशनम् ॥ ३०५॥ कुमार्गदलनं कष्टहरणं
    कल्मषापहम् । कुबुद्धिशमनं क्रोधकन्दनं कान्तिवर्द्धनम् ॥ ३०६॥ कुविद्यादमनं काममर्दनं कीर्तिदायकम् ।
    कुतर्कनाशनं कान्तं कुपथार्णवशोषणम् ॥ ३०७॥ कोटिजन्मार्जितारिष्टहरं कालभयापहम् । कोटिजन्मार्जिताज्ञाननाशनैकदिवाकरम्
    ॥ ३०८॥ कापट्यपटलध्वंसिकार्पण्यैकहुताशनम् । कालुष्यभावशमनं कीर्तिश्रीमतिदं सताम् ॥ ३०९॥ कोपोपतापशमनं
    कंसारिस्मृतिदायकम् । कुलाचारविचारस्थं कुलधर्मप्रवर्तकम् ॥ ३१०॥ कुलधर्मरताभीष्टसिद्धिदं कुलदीपकम् ।
    कुत्सामार्गनिराकर्तृ कुपथाचारवर्जितम् ॥ ३११॥ कल्याणमङ्गलागारं कल्पवृक्षसमं सताम् । कौटिल्यभावशमनं
    काशीवासफलप्रदम् ॥ ३१२॥ अतिगुह्यतरं पुंसां भोगमोक्षैकसाधनम् । अत्यन्तस्नेहभावेन युष्मदग्रे प्रकाशितम्
    ॥ ३१३॥ न वक्तव्यं न वक्तव्यं न वक्तव्यं कदाचन । पाप्यग्रे कुटिलाग्रे च राग्यग्रे पिशुनाय वै ॥ ३१४॥
    द्रोह्यग्रे मलिनाघ्रे च कपट्यग्रे विशेषतः । लम्पटाग्रेऽभिमान्यग्रे काम्यते क्रोधिने तथा ॥ ३१५॥ लोभ्यग्रे
    तस्कराग्रे च गर्वाहङ्कारभाजिने । संसारासक्तचित्ताग्रे वाद्यग्रे घातिनेऽपि वा ॥ ३१६॥ मताभिमानिने गोप्यं
    मदीयं स्तोत्रमुत्तमम् । वाच्यं शान्ताय भक्ताय निर्मलाय दयालवे ॥ ३१७॥ सन्तोषिणे सुशीलाय सुपात्राय द्विजातये
    । विवेकिने ज्ञानिने च मद्भक्ताय विशेषतः ॥ ३१८॥ य इदं श
