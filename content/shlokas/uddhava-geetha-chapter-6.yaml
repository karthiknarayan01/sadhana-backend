id: uddhava-geetha-chapter-6
category: stotram
name:
  english: Uddhava Geetha - Chapter 6
content:
  english: atha shashtho'dhyayah | shrishukah uvaca | atha brahma atmajaih devaih prajeshaih avritah abhyagat
    | bhavah ca bhutabhavyishah yayau bhutaganaih vritah || || indrah marudbhih bhagavan adityah vasavah
    ashvinau | ribhavah angirasah rudrah vishve sadhyah ca devatah || || gandharvapsarasah nagah siddhacaranaguhyakah
    | rishayah pitarah ca eva savidyadharakinnarah || || dvarakam upasanjagmuh sarve krishnadidrikshavah
    | vapusha yena bhagavan naralokamanoramah | yashah vitene lokeshu sarvalokamalapaham || || tasyam
    vibhrajamanayam samriddhayam mahardhibhih | vyacakshata avitriptakshah krishnam adbhutadarshanam ||
    || svargaudyanauapagaih malyaih chadayantah yadu uttamam | girbhih citrapadarthabhih tushtuvuh jagat
    ishvaram || || devah ucuh | natah sma te natha padaravindam buddhindriyapranamanovacobhih | yat cintyate
    antarhridi bhavayuktaih mumukshubhih karmamaya urupashat || || tvam mayaya trigunaya atmani durvibhavyam
    vyaktam srijasi avasi lumpasi tat gunasthah | na etaih bhavan ajita karmabhih ajyate vai yat sve sukhe
    avyavahite abhiratah anavadyah || || shuddhih nrinam na tu tatha idya durashayanam vidyashrutadhyayanadanatapakriyabhih
    | sattvatmanam rishabha te yashasi pravriddha sat shraddhaya shravanasambhritaya yatha syat || ||
    syat nah tava anghrih ashubhashayadhumaketuh kshemaya yah munibhih ardrahridauhyamanah | yah satvataih
    samavibhutayah atmavadbhih vyuhe arcitah savanashah svah atikramaya || || yah cintyate prayatapanibhih
    adhvaragnau trayya niruktavidhina isha havih grihitva | adhyatmayogah uta yogibhih atmamayam jijnasubhih
    paramabhagavataih parishtah || || paryushtaya tava vibho vanamalaya iyam samspardhini bhagavati pratipatnivat
    shrih | yah supranitam amuyarhanam adat annah bhuyat sada anghrih ashubhashayadhumaketuh || || ketuh
    trivikramayutah tripat patakah yah te bhayabhayakarah asuradevacamvoh | svargaya sadhushu khalu eshu
    itaraya bhuman padah punatu bhagavan bhajatam adham nah || || nasyotagavah iva yasya vashe bhavanti
    brahmadayah anubhritah mithurardyamanah | kalasya te prakritipurushayoh parasya sham nah tanotu caranah
    purushottamasya || || asya asi hetuh udayasthitisamyamanam avyaktajivamahatam api kalam ahuh | sah
    ayam trinabhih akhila apacaye pravrittah kalah gabhirarayah uttamapurushah tvam || || tvattah puman
    samadhigamya yaya svavirya dhatte mahantam iva garbham amoghaviryah | sah ayam taya anugatah atmanah
    andakosham haimam sasarja bahih avaranaih upetam || || tattasthushah ca jagatah ca bhavan adhishah
    yat mayaya utthagunavikriyaya upanitan | arthan jushan api hrishikapate na liptah ye anye svatah parihritat
    api bibhyati sma || || smaya avalokalavadarshitabhavahari bhrumandalaprahitasauratamantrashaundaih
    | patnyah tu shodashasahasram anangabanaih yasya indriyam vimathitum karanaih vibhvyah || || vibhvyah
    tava amritakatha udavahah trilokyah padau anejasaritah shamalani hantum | anushravam shrutibhih anghrijam
    angasangaih tirthadvayam shucishadastah upasprishanti || || badarayanih uvaca | iti abhishtuya vibudhaih
    seshah shatadhritih harim | abhyabhashata govindam pranamya ambaram ashritah || || brahma uvaca |
    bhumeh bhara avataraya pura vijnapitah prabho | tvam asmabhih asheshatman tat tatha eva upapaditam
    || || dharmah ca sthapitah satsu satyasandheshu vai tvaya | kirtih ca dikshu vikshipta sarvalokamalapaha
    || || avatirya yadoh vamshe bibhrat rupam anuttamam | karmani uddamavrittani hitaya jagatah akrithah
    || || yani te caritani isha manushyah sadhavah kalau | sha rinvantah kirtayantah ca tarishyanti anjasa
    tamah || || yaduvamshe avatirnasya bhavatah purushottama | sharat shatam vyatiyaya pancavimsha adhikam
    prabhoh || || na adhuna te akhila adhara devakarya avasheshitam | kulam ca viprashapena nashtaprayam
    abhut idam || || tatah svadhama paramam vishasva yadi manyase | salokan lokapalan nah pahi vaikunthakinkaran
    || || shri bhagavan uvaca | avadharitam etat me yadattha vibudheshvara | kritam vah karyam akhilam
    bhumeh bharah avataritah || || tat idam yadavakulam viryashauryashriyoddhatam | lokam jighrikshat
    ruddham me velaya iva maharnavah || || yadi asamhritya driptanam yadunam vipulam kulam | gantasmi
    anena lokah ayam udvelena vinankshyati || || idanim nashah arabdhah kulasya dvijashapatah | yasyami
    bhavanam brahman na etat ante tava anagha || || shri shukah uvaca | iti uktah lokanathena svayambhuh
    pranipatya tam | saha devaganaih devah svadhama samapadyata || || atha tasyam mahotpatan dvaravatyam
    samutthitan | vilokya bhagavan aha yaduvriddhan samagatan || || shri bhagavan uvaca | ete vai sumahotpatah
    vyuttishthanti iha sarvatah | shapah ca nah kulasya asit brahmanebhyah duratyayah || || na vastavyam
    iha asmabhih jijivishubhih aryakah | prabhasam sumahat punyam yasyamah adya eva ma ciram || || yatra
    snatva dakshashapat grihitah yakshmanaudurat | vimuktah kilbishat sadyah bheje bhuyah kalodayam ||
    || vayam ca tasmin aplutya tarpayitva pitrinsuran | bhojayitva ushijah vipran nanagunavata andhasa
    || || teshu danani patreshu shraddhaya uptva mahanti vai | vrijinani tarishyamah danaih naubhih iva
    arnavam || || shri shukah uvaca | evam bhagavata adishtah yadavah kulanandana | gantum kritadhiyah
    tirtham syandanan samayuyujan || || tat nirikshya uddhavah rajan shrutva bhagavata uditam | drishtva
    arishtani ghorani nityam krishnam anuvratah || || viviktah upasangamya jagatam ishvareshvaram | pranamya
    shirasa padau pranjalih tam abhashata || || uddhavah uvaca | devadevesha yogesha punyashravanakirtana
    | samhritya etat kulam nunam lokam santyakshyate bhavan | viprashapam samarthah api pratyahan na yadi
    ishvarah || || na aham tava anghrikamalam kshanardham api keshava | tyaktum samutsahe natha svadhama
    naya mam api || || tava vikriditam krishna nrinam paramamangalam | karnapiyusham asvadya tyajati anyaspriham
    janah || || shayyasanatanasthanasnanakridashanadishu | katham tvam priyam atmanam vayam bhaktah tyajemahi
    || || tvaya upabhuktasrakgandhavasah alankaracarcitah | ucchishtabhojinah dasah tava mayam jayemahi
    || || vatashanah yah rishayah shramana urdhvamanthinah | brahmakhyam dhama te yanti shantah sannyasinah
    amalah || || vayam tu iha mahayogin bhramantah karmavartmasu | tvat vartaya tarishyamah tavakaih dustaram
    tamah || || smarantah kirtayantah te kritani gaditani ca | gatiutsmitikshanakshveli yat nrilokavidambanam
    || || shri shukah uvaca | evam vijnapitah rajan bhagavan devakisutah | ekantinam priyam bhrityam uddhavam
    samabhashata || || iti shrimadbhagavate mahapurane paramahamsyam samhitayamekadashaskandhe devastutyuddhvavijnapanam
    nama shashtho'dhyayah ||
  devanagari: अथ षष्ठोऽध्यायः । श्रीशुकः उवाच । अथ ब्रह्मा आत्मजैः देवैः प्रजेशैः आवृतः अभ्यगात् । भवः
    च भूतभव्यीशः ययौ भूतगणैः वृतः ॥ ॥ इन्द्रः मरुद्भिः भगवान् आदित्याः वसवः अश्विनौ । ऋभवः अङ्गिरसः रुद्राः
    विश्वे साध्याः च देवताः ॥ ॥ गन्धर्वाप्सरसः नागाः सिद्धचारणगुह्यकाः । ऋषयः पितरः च एव सविद्याधरकिन्नराः
    ॥ ॥ द्वारकां उपसञ्जग्मुः सर्वे कृष्णादिदृक्षवः । वपुषा येन भगवान् नरलोकमनोरमः । यशः वितेने लोकेषु
    सर्वलोकमलापहम् ॥ ॥ तस्यां विभ्राजमानायां समृद्धायां महर्धिभिः । व्यचक्षत अवितृप्ताक्षाः कृष्णं अद्भुतदर्शनम्
    ॥ ॥ स्वर्गौद्यानौअपगैः माल्यैः छादयन्तः यदु उत्तमम् । गीर्भिः चित्रपदार्थाभिः तुष्टुवुः जगत् ईश्वरम्
    ॥ ॥ देवाः ऊचुः । नताः स्म ते नाथ पदारविन्दं बुद्धीन्द्रियप्राणमनोवचोभिः । यत् चिन्त्यते अन्तर्हृदि
    भावयुक्तैः मुमुक्षुभिः कर्ममय ऊरुपाशात् ॥ ॥ त्वं मायया त्रिगुणया आत्मनि दुर्विभाव्यं व्यक्तं सृजसि
    अवसि लुम्पसि तत् गुणस्थः । न एतैः भवान् अजित कर्मभिः अज्यते वै यत् स्वे सुखे अव्यवहिते अभिरतः अनवद्यः
    ॥ ॥ शुद्धिः नृणां न तु तथा ईड्य दुराशयानां विद्याश्रुताध्ययनदानतपक्रियाभिः । सत्त्वात्मनां ऋषभ ते
    यशसि प्रवृद्ध सत् श्रद्धया श्रवणसम्भृतया यथा स्यात् ॥ ॥ स्यात् नः तव अङ्घ्रिः अशुभाशयधूमकेतुः क्षेमाय
    यः मुनिभिः आर्द्रहृदौह्यमानः । यः सात्वतैः समविभूतयः आत्मवद्भिः व्यूहे अर्चितः सवनशः स्वः अतिक्रमाय
    ॥ ॥ यः चिन्त्यते प्रयतपाणिभिः अध्वराग्नौ त्रय्या निरुक्तविधिना ईश हविः गृहीत्वा । अध्यात्मयोगः उत
    योगिभिः आत्ममायां जिज्ञासुभिः परमभागवतैः परीष्टः ॥ ॥ पर्युष्टया तव विभो वनमालया इयं संस्पर्धिनी भगवती
    प्रतिपत्निवत् श्रीः । यः सुप्रणीतं अमुयार्हणं आदत् अन्नः भूयात् सदा अङ्घ्रिः अशुभाशयधूमकेतुः ॥ ॥ केतुः
    त्रिविक्रमयुतः त्रिपत् पताकः यः ते भयाभयकरः असुरदेवचम्वोः । स्वर्गाय साधुषु खलु एषु इतराय भूमन् पादः
    पुनातु भगवन् भजतां अधं नः ॥ ॥ नस्योतगावः इव यस्य वशे भवन्ति ब्रह्मादयः अनुभृतः मिथुरर्द्यमानाः । कालस्य
    ते प्रकृतिपूरुषयोः परस्य शं नः तनोतु चरणः पुरुषोत्तमस्य ॥ ॥ अस्य असि हेतुः उदयस्थितिसंयमानां अव्यक्तजीवमहतां
    अपि कालं आहुः । सः अयं त्रिणाभिः अखिल अपचये प्रवृत्तः कालः गभीररयः उत्तमपूरुषः त्वम् ॥ ॥ त्वत्तः पुमान्
    समधिगम्य यया स्ववीर्य धत्ते महान्तं इव गर्भं अमोघवीर्यः । सः अयं तया अनुगतः आत्मनः आण्डकोशं हैमं ससर्ज
    बहिः आवरणैः उपेतम् ॥ ॥ तत्तस्थुषः च जगतः च भवान् अधीशः यत् मायया उत्थगुणविक्रियया उपनीतान् । अर्थान्
    जुषन् अपि हृषीकपते न लिप्तः ये अन्ये स्वतः परिहृतात् अपि बिभ्यति स्म ॥ ॥ स्माया अवलोकलवदर्शितभावहारि
    भ्रूमण्डलप्रहितसौरतमन्त्रशौण्डैः । पत्न्यः तु षोडशसहस्रं अनङ्गबाणैः यस्य इन्द्रियं विमथितुं करणैः
    विभ्व्यः ॥ ॥ विभ्व्यः तव अमृतकथा उदवहाः त्रिलोक्याः पादौ अनेजसरितः शमलानि हन्तुम् । आनुश्रवं श्रुतिभिः
    अङ्घ्रिजं अङ्गसङ्गैः तीर्थद्वयं शुचिषदस्तः उपस्पृशन्ति ॥ ॥ बादरायणिः उवाच । इति अभिष्टूय विबुधैः सेशः
    शतधृतिः हरिम् । अभ्यभाषत गोविन्दं प्रणम्य अम्बरं आश्रितः ॥ ॥ ब्रह्म उवाच । भूमेः भार अवताराय पुरा
    विज्ञापितः प्रभो । त्वं अस्माभिः अशेषात्मन् तत् तथा एव उपपादितम् ॥ ॥ धर्मः च स्थापितः सत्सु सत्यसन्धेषु
    वै त्वया । कीर्तिः च दिक्षु विक्षिप्ता सर्वलोकमलापहा ॥ ॥ अवतीर्य यदोः वंशे बिभ्रत् रूपं अनुत्तमम्
    । कर्माणि उद्दामवृत्तानि हिताय जगतः अकृथाः ॥ ॥ यानि ते चरितानि ईश मनुष्याः साधवः कलौ । श ऋण्वन्तः
    कीर्तयन्तः च तरिष्यन्ति अञ्जसा तमः ॥ ॥ यदुवंशे अवतीर्णस्य भवतः पुरुषोत्तम । शरत् शतं व्यतीयाय पञ्चविंश
    अधिकं प्रभोः ॥ ॥ न अधुना ते अखिल आधार देवकार्य अवशेषितम् । कुलं च विप्रशापेन नष्टप्रायं अभूत् इदम्
    ॥ ॥ ततः स्वधाम परमं विशस्व यदि मन्यसे । सलोकान् लोकपालान् नः पाहि वैकुण्ठकिङ्करान् ॥ ॥ श्री भगवान्
    उवाच । अवधारितं एतत् मे यदात्थ विबुधेश्वर । कृतं वः कार्यं अखिलं भूमेः भारः अवतारितः ॥ ॥ तत् इदं यादवकुलं
    वीर्यशौर्यश्रियोद्धतम् । लोकं जिघृक्षत् रुद्धं मे वेलया इव महार्णवः ॥ ॥ यदि असंहृत्य दृप्तानां यदुनां
    विपुलं कुलम् । गन्तास्मि अनेन लोकः अयं उद्वेलेन विनङ्क्ष्यति ॥ ॥ इदानीं नाशः आरब्धः कुलस्य द्विजशापतः
    । यास्यामि भवनं ब्रह्मन् न एतत् अन्ते तव आनघ ॥ ॥ श्री शुकः उवाच । इति उक्तः लोकनाथेन स्वयम्भूः प्रणिपत्य
    तम् । सह देवगणैः देवः स्वधाम समपद्यत ॥ ॥ अथ तस्यां महोत्पातान् द्वारवत्यां समुत्थितान् । विलोक्य भगवान्
    आह यदुवृद्धान् समागतान् ॥ ॥ श्री भगवान् उवाच । एते वै सुमहोत्पाताः व्युत्तिष्ठन्ति इह सर्वतः । शापः
    च नः कुलस्य आसीत् ब्राह्मणेभ्यः दुरत्ययः ॥ ॥ न वस्तव्यं इह अस्माभिः जिजीविषुभिः आर्यकाः । प्रभासं
    सुमहत् पुण्यं यास्यामः अद्य एव मा चिरम् ॥ ॥ यत्र स्नात्वा दक्षशापात् गृहीतः यक्ष्मणौडुराट् । विमुक्तः
    किल्बिषात् सद्यः भेजे भूयः कलोदयम् ॥ ॥ वयं च तस्मिन् आप्लुत्य तर्पयित्वा पितॄन्सुरान् । भोजयित्वा
    उशिजः विप्रान् नानागुणवता अन्धसा ॥ ॥ तेषु दानानि पात्रेषु श्रद्धया उप्त्वा महान्ति वै । वृजिनानि तरिष्यामः
    दानैः नौभिः इव अर्णवम् ॥ ॥ श्री शुकः उवाच । एवं भगवता आदिष्टाः यादवाः कुलनन्दन । गन्तुं कृतधियः तीर्थं
    स्यन्दनान् समयूयुजन् ॥ ॥ तत् निरीक्ष्य उद्धवः राजन् श्रुत्वा भगवता उदितम् । दृष्ट्वा अरिष्टानि घोराणि
    नित्यं कृष्णं अनुव्रतः ॥ ॥ विविक्तः उपसङ्गम्य जगतां ईश्वरेश्वरम् । प्रणम्य शिरसा पादौ प्राञ्जलिः तं
    अभाषत ॥ ॥ उद्धवः उवाच । देवदेवेश योगेश पुण्यश्रवणकीर्तन । संहृत्य एतत् कुलं नूनं लोकं सन्त्यक्ष्यते
    भवान् । विप्रशापं समर्थः अपि प्रत्यहन् न यदि ईश्वरः ॥ ॥ न अहं तव अङ्घ्रिकमलं क्षणार्धं अपि केशव ।
    त्यक्तुं समुत्सहे नाथ स्वधाम नय मां अपि ॥ ॥ तव विक्रीडितं कृष्ण नृणां परममङ्गलम् । कर्णपीयूषं आस्वाद्य
    त्यजति अन्यस्पृहां जनः ॥ ॥ शय्यासनाटनस्थानस्नानक्रीडाशनादिषु । कथं त्वां प्रियं आत्मानं वयं भक्ताः
    त्यजेमहि ॥ ॥ त्वया उपभुक्तस्रक्गन्धवासः अलङ्कारचर्चिताः । उच्छिष्टभोजिनः दासाः तव मायां जयेमहि ॥ ॥
    वाताशनाः यः ऋषयः श्रमणा ऊर्ध्वमन्थिनः । ब्रह्माख्यं धाम ते यान्ति शान्ताः सन्न्यासिनः अमलाः ॥ ॥ वयं
    तु इह महायोगिन् भ्रमन्तः कर्मवर्त्मसु । त्वत् वार्तया तरिष्यामः तावकैः दुस्तरं तमः ॥ ॥ स्मरन्तः कीर्तयन्तः
    ते कृतानि गदितानि च । गतिउत्स्मितीक्षणक्ष्वेलि यत् नृलोकविडम्बनम् ॥ ॥ श्री शुकः उवाच । एवं विज्ञापितः
    राजन् भगवान् देवकीसुतः । एकान्तिनं प्रियं भृत्यं उद्धवं समभाषत ॥ ॥ इति श्रीमद्भागवते महापुराणे पारमहंस्यां
    संहितायामेकादशस्कन्धे देवस्तुत्युद्ध्वविज्ञापनं नाम षष्ठोऽध्यायः ॥
