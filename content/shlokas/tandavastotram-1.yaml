id: tandavastotram-1
category: stotram
name:
  english: tandavastotram 1
  devanagari: ताण्डवस्तोत्रम् १
content:
  english: padmadvayambhoruhapurnavishvam | namanmadhyasacikritasvanghripadmam bhaje parvatisham mahatandavesham
    || 5|| shivasheshabandho kripapurnasindho shivanandasandohasandhanabandho | mahashcaryanrityollasatpadapadmam
    bhaje parvatisham mahatandavesham || 6|| katiprantasambandhisauvarnasutram pralambaprakirnorughantaninadam
    | mahasimhanadam prabhinnabdajalam bhaje parvatisham mahatandavesham || 7|| bhramadbahudandam gadapurnaratnam
    prabho kshiptamartandakotiprakasham | mahahishabhusham suresham mahesham bhaje parvatisham mahatandavesham
    || 8|| mahanrityasanjatabhimattahasam mahayogihritpadmakoshavabhasam | mahanagayajnopavitavabhasam
    bhaje parvatisham mahatandavesham || 9|| bhavanisha bhutesha bhargasurare bhavare purare suresharcitanghre
    | na janati yushmatsvarupam jano'yam bhaje parvatisham mahatandavesham || 10|| mukundabjahastollasattrasanadam
  devanagari: पद्मद्वयाम्भोरुहापूर्णविश्वम् । नमन्मध्यसाचीकृतस्वाङ्घ्रिपद्मं भजे पार्वतीशं महाताण्डवेशम्
    ॥ ५॥ शिवाशेषबन्धो कृपापूर्णसिन्धो शिवानन्दसन्दोहसन्धानबन्धो । महाश्चर्यनृत्योल्लसत्पादपद्मं भजे पार्वतीशं
    महाताण्डवेशम् ॥ ६॥ कटिप्रान्तसम्बन्धिसौवर्णसूत्रं प्रलम्बप्रकीर्णोरुघण्टानिनादम् । महासिंहनादं प्रभिन्नाब्दजालं
    भजे पार्वतीशं महाताण्डवेशम् ॥ ७॥ भ्रमद्बाहुदण्डं गदापूर्णरत्नं प्रभो क्षिप्तमार्ताण्डकोटिप्रकाशम्
    । महाहीशभूषं सुरेशं महेशं भजे पार्वतीशं महाताण्डवेशम् ॥ ८॥ महानृत्यसञ्जातभीमाट्टहासं महायोगिहृत्पद्मकोशावभासम्
    । महानागयज्ञोपवीतावभासं भजे पार्वतीशं महाताण्डवेशम् ॥ ९॥ भवानीश भूतेश भर्गासुरारे भवारे पुरारे सुरेशार्चिताङ्घ्रे
    । न जानाति युष्मत्स्वरूपं जनोऽयं भजे पार्वतीशं महाताण्डवेशम् ॥ १०॥ मुकुन्दाब्जहस्तोल्लसत्त्रासनादं
