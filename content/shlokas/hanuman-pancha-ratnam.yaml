id: hanuman-pancha-ratnam
category: stotram
name:
  english: Hanuman Pancha Ratnam
content:
  english: vitakhilavishayeccham jatanandashrupulakamatyaccham sitapati dutadyam vatatmajamadya bhavaye
    hridyam || || tarunarunamukhakamalam karunarasapurapuritapangam sanjivanamashase manjulamahimanamanjanabhagyam
    || || shambaravairisharatigamambujadala vipulalocanodaram kambugalamaniladishtam bimbajvalitoshthamekamavalambe
    || || durikritasitartih prakatikritaramavaibhavasphurtih daritadashamukhakirtih purato mama bhatu
    hanumato murtih || || vanaranikaradhyaksham danavakulakumudaravikarasadrisham dinajanavanadiksham
    pavanatapah pakapunjamadraksham || || etatpavanasutasya stotram yah pathati pancaratnakhyam ciramiha
    nikhilanbhoganbhunktva shriramabhaktibhagbhavati ||
  devanagari: वीताखिलविषयेच्छं जातानन्दाश्रुपुलकमत्यच्छम् सीतापति दूताद्यं वातात्मजमद्य भावये हृद्यम्
    ॥ ॥ तरुणारुणमुखकमलं करुणारसपूरपूरितापाङ्गम् सञ्जीवनमाशासे मञ्जुलमहिमानमञ्जनाभाग्यम् ॥ ॥ शम्बरवैरिशरातिगमम्बुजदल
    विपुललोचनोदारम् कम्बुगलमनिलदिष्टं बिम्बज्वलितोष्ठमेकमवलम्बे ॥ ॥ दूरीकृतसीतार्तिः प्रकटीकृतरामवैभवस्फूर्तिः
    दारितदशमुखकीर्तिः पुरतो मम भातु हनुमतो मूर्तिः ॥ ॥ वानरनिकराध्यक्षं दानवकुलकुमुदरविकरसदृशम् दीनजनावनदीक्षं
    पवनतपः पाकपुञ्जमद्राक्षम् ॥ ॥ एतत्पवनसुतस्य स्तोत्रं यः पठति पञ्चरत्नाख्यम् चिरमिह निखिलान्भोगान्भुङ्क्त्वा
    श्रीरामभक्तिभाग्भवति ॥
