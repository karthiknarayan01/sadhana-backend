id: lakshmistotram-2
category: stotram
name:
  english: lakshmistotram 2
  devanagari: लक्ष्मीस्तोत्रम् २
content:
  english: stvamakshnoranandastvamasi ca param brahmamahishi | cidatma tvam lakshmirjagadiha tavapangacalanam
    samalambya shriman srijati bhagavanattyavati ca || 13|| gunaih purne nirnejanajalapavitratribhuvane
    jaraduribhute janani nigamantastavapade | natanam stotrinamamitaphalavishrananacanau vayam vaikuntheshapranayini
    bhajamastava padau || 14|| kshamacarau dure gurucaranabhaktistu sutaram tatha dharme'pyastha tava
    caranacinta mayi kutah | tathapyangapanganayi kalaya lakshmistava dayam prashamsantyuddamam yamaniyamavanto
    munijanah || 15|| tavapangairdrishto janani karunardrairbhavati yah sa vetta shastranam sa khalu kulashiladisahitah
    | sa darpam kandarpam shamayati ca dantena manasa prashastyenamishashcaturudadhivelam vasumatim ||
    16|| adoshah ko vaste jana iti rusham sheshashayituh parishvangaistungaih prashamayasi karunyabharite
    | madiyanardranapyadhikamaparadhan bhagavati kshamasvemam lakshmi stutimapi mamangikuru muda || 17||
    kadaranye punye kamalavanavapiparivrite tarunam chayabhistaranikiranantardhini tale | vasan matarlakshmih
    kamalavanavasaikarasike prasideti kroshan kalushamapaneshye parinatam || 18|| iti shribhusarampuramadhivasan
    raghavakavih kule vadhulakhye mahati janiman lokavinute | satam sevi satvadhikaraghuvaracaryatanayat
    samutpanno lakshmyah stutibhiradhunanarca caranau || 19|| iti
  devanagari: स्त्वमक्ष्णोरानन्दस्त्वमसि च परं ब्रह्ममहिषी । चिदात्मा त्वं लक्ष्मीर्जगदिह तवापाङ्गचलनं
    समालम्ब्य श्रीमान् सृजति भगवानत्त्यवति च ॥ १३॥ गुणैः पूर्णे निर्णेजनजलपवित्रत्रिभुवने जरादूरीभूते
    जननि निगमान्तस्तवपदे । नतानां स्तोतॄणाममितफलविश्राणनचणौ वयं वैकुण्ठेशप्रणयिनि भजामस्तव पदौ ॥ १४॥ क्षमाचारौ
    दूरे गुरुचरणभक्तिस्तु सुतरां तथा धर्मेऽप्यास्था तव चरणचिन्ता मयि कुतः । तथाप्यङ्गापाङ्गानयि कलय लक्ष्मीस्तव
    दयां प्रशंसन्त्युद्दामां यमनियमवन्तो मुनिजनाः ॥ १५॥ तवापाङ्गैर्दृष्टो जननि करुणार्द्रैर्भवति यः स
    वेत्ता शास्त्राणां स खलु कुलशीलादिसहितः । स दर्पं कान्दर्पं शमयति च दान्तेन मनसा प्रशास्त्येनामीशश्चतुरुदधिवेलां
    वसुमतीम् ॥ १६॥ अदोषः को वास्ते जन इति रुषं शेषशयितुः परिष्वङ्गैस्तुङ्गैः प्रशमयसि कारुण्यभरिते । मदीयानार्द्रानप्यधिकमपराधान्
    भगवति क्षमस्वेमां लक्ष्मि स्तुतिमपि ममाङ्गीकुरु मुदा ॥ १७॥ कदारण्ये पुण्ये कमलवनवापीपरिवृते तरूणां
    छायाभिस्तरणिकिरणान्तर्धिनि तले । वसन् मातर्लक्ष्मीः कमलवनवासैकरसिके प्रसीदेति क्रोशन् कलुषमपनेष्ये
    परिणतम् ॥ १८॥ इति श्रीभूसारम्पुरमधिवसन् राघवकविः कुले वाधूलाख्ये महति जनिमान् लोकविनुते । सतां सेवी
    सत्वाधिकरघुवराचार्यतनयात् समुत्पन्नो लक्ष्म्याः स्तुतिभिरधुनानर्च चरणौ ॥ १९॥ इति
