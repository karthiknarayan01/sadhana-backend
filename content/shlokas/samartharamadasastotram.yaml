id: samartharamadasastotram
category: stotram
name:
  english: samartharamadasastotram
  devanagari: समर्थरामदासस्तोत्रम्
content:
  english: shrisamartha ramadasa stotram adarshantarabimbitam khalu yatha drishyam mudhaiva sphutam tadvadvishvamidam
    vibhati sakalam yasmin pare bastuni | citsamanyasadekato na ca kada yasmin vikarahkvacit tam vande
    gururamadasamamalam saccitsvarupam shivam || 1|| bijasyantaravartivrikshasadrisham vishvam yadetanmahat
    yasyam sukshmatayadhitishthati pura maya mrisha sa param | yancacchadayativa citramiti tadyatsattaya
    vyakarot tam vande gururamadasamamalam saccitsvarupam shivam || 2|| srishtva'dhyasata eva vishvamakhilam
    jiveshabandhadikam sa yasmin kila bhati suryakirane maya mrigammbho yatha | yatsmrityaiva punah svaceshtitamidam
    tyaktvaityabhavam svayam tam vande gururamadasamamalam saccitsvarupam shivam || 3|| rajvam sarpavibhasavad
    vata mrisha mayeti yasmin pare brahmaham nijavedanena nanu sa vidyeti sambhavyate | jivoshantviti
    bhavanena hi tatha'vidyeti ca khyayate tam vande gururamadasamamalam saccitsvarupam shivam || 4||
    anyatkincana vidyate nahi yato yatsvatmarupam dhruvam mayakalpitadeshakalakalana yasminna citrikrita
    | advaitamritasaukhyasindhumagamad dhiryasya bodhatparam tam vande gururamadasamamalam saccitsvarupam
    shivam || 5|| pancaratnatmakamidam stotram pavanamuktatam | pathed gurumukhacchrutva muktihsvad gurvanugrahat
    || 6|| || iti shrimat paramahamsaparivrajakacarya sadguru bhagavata shridharasvamina viracitam shrisamartharamadasastotram
    sampurnam ||
  devanagari: श्रीसमर्थ रामदास स्तोत्रम् आदर्शान्तरबिम्बितं खलु यथा दृश्यं मूधैव स्फुटम् तद्वद्विश्वमिदं
    विभाति सकलं यस्मिन् परे बस्तुनि । चित्सामान्यसदेकतो न च कदा यस्मिन् विकारःक्वचित् तं वन्दे गुरुरामदासममलं
    सच्चित्स्वरूपं शिवम् ॥ १॥ बीजस्यान्तरवर्तिवृक्षसदृशं विश्वं यदेतन्महत् यस्यां सूक्ष्मतयाधितिष्ठति
    पुरा माया मृषा सा परम् । यञ्चाच्छादयतीव चित्रमिति तद्यत्सत्तया व्याकरोत् तं वन्दे गुरुरामदासममलं सच्चित्स्वरूपं
    शिवम् ॥ २॥ सृष्ट्वाऽध्यासत एव विश्वमखिलं जीवेशबन्धादिकम् सा यस्मिन् किल भाति सूर्यकिरणे माया मृगांम्भो
    यथा । यत्स्मृत्यैव पुनः स्वचेष्टितमिदं त्यक्त्वैत्यभावं स्वयम् तं वन्दे गुरुरामदासममलं सच्चित्स्वरूपं
    शिवम् ॥ ३॥ रज्वां सर्पविभासवद् वत मृषा मायेति यस्मिन् परे ब्रह्माहं निजवेदनेन ननु सा विद्येति सम्भाव्यते
    । जीवोषन्त्विति भावनेन हि तथाऽविद्येति च ख्यायते तं वन्दे गुरुरामदासममलं सच्चित्स्वरूपं शिवम् ॥ ४॥
    अन्यत्किञ्चन विद्यते नहि यतो यत्स्वात्मरूपं ध्रुवम् मायाकल्पितदेशकालकलना यस्मिन्न चित्रीकृता । अद्वैतामृतसौख्यसिन्धुमगमद्
    धीर्यस्य बोधात्परम् तं वन्दे गुरुरामदासममलं सच्चित्स्वरूपं शिवम् ॥ ५॥ पञ्चरत्नात्मकमिदं स्तोत्रं पावनमुक्ततम्
    । पठेद् गुरुमुखाच्छ्रुत्वा मुक्तिःस्वाद् गुर्वनुग्रहात् ॥ ६॥ ॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरु
    भगवता श्रीधरस्वामिना विरचितं श्रीसमर्थरामदासस्तोत्रं संपूर्णम् ॥
