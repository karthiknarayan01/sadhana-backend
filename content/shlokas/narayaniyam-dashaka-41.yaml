id: narayaniyam-dashaka-41
category: stotram
name:
  english: Narayaniyam Dashaka 41
content:
  english: vrajeshvaraih shaurivaco nishamya samavrajannadhvani bhitacetah | nishpishtanishsheshatarum
    nirikshya kancitpadartham sharanam gatasvam || || nishamya gopivacanadudantam sarve'pi gopa bhayavismayandhah
    | tvatpatitam ghorapishacadeham dehurvidure'tha kutharakrittam || || tvatpitaputastanataccharirat
    samuccalannuccataro hi dhumah | shankamadhadagaravah kimesha kim candano gaulgulavo'thaveti || ||
    madangasangasya phalam na dure kshanena tavat bhavatamapi syat | ityullapan vallavatallajebhyah tvam
    putanamatanuthah sugandhim || || citram pishacya na hatah kumarah citram puraivakathi shaurinedam
    | iti prashamsan kila gopaloko bhavanmukhalokarase nyamankshit || || dinedine'tha prativriddhalakshmirakshinamangalyashato
    vrajo'yam | bhavannivasadayi vasudeva pramodasandrah parito vireje || || griheshu te komalarupahasamithahkathasankulitah
    kamanyah | vritteshu krityeshu bhavannirikshasamagatah pratyahamatyanandan || || aho kumaro mayi dattadrishtih
    smitam kritam mam prati vatsakena | ehyehi mamityupasarya pani tvayisha kim kim na kritam vadhubhih
    || || bhavadvapuhsparshanakautukena karatkaram gopavadhujanena | nitastvamatamrasarojamalavyalambilolambatulamalasih
    || || nipayayanti stanamankagam tvam vilokayanti vadanam hasanti | dasham yashoda katamam na bheje
    sa tadrishah pahi hare gadanmam ||
  devanagari: व्रजेश्वरैः शौरिवचो निशम्य समाव्रजन्नध्वनि भीतचेताः । निष्पिष्टनिश्शेषतरुं निरीक्ष्य कञ्चित्पदार्थं
    शरणं गतस्वाम् ॥ ॥ निशम्य गोपीवचनादुदन्तं सर्वेऽपि गोपा भयविस्मयान्धाः । त्वत्पातितं घोरपिशाचदेहं देहुर्विदूरेऽथ
    कुठारकृत्तम् ॥ ॥ त्वत्पीतपूतस्तनतच्छरीरात् समुच्चलन्नुच्चतरो हि धूमः । शङ्कामधादागरवः किमेष किं चान्दनो
    गौल्गुलवोऽथवेति ॥ ॥ मदङ्गसङ्गस्य फलं न दूरे क्षणेन तावत् भवतामपि स्यात् । इत्युल्लपन् वल्लवतल्लजेभ्यः
    त्वं पूतनामातनुथाः सुगन्धिम् ॥ ॥ चित्रं पिशाच्या न हतः कुमारः चित्रं पुरैवाकथि शौरिणेदम् । इति प्रशंसन्
    किल गोपलोको भवन्मुखालोकरसे न्यमाङ्क्षीत् ॥ ॥ दिनेदिनेऽथ प्रतिवृद्धलक्ष्मीरक्षीणमाङ्गल्यशतो व्रजोऽयम्
    । भवन्निवासादयि वासुदेव प्रमोदसान्द्रः परितो विरेजे ॥ ॥ गृहेषु ते कोमलरूपहासमिथःकथासङ्कुलिताः कमन्यः
    । वृत्तेषु कृत्येषु भवन्निरीक्षासमागताः प्रत्यहमत्यनन्दन् ॥ ॥ अहो कुमारो मयि दत्तदृष्टिः स्मितं कृतं
    मां प्रति वत्सकेन । एह्येहि मामित्युपसार्य पाणी त्वयीश किं किं न कृतं वधूभिः ॥ ॥ भवद्वपुःस्पर्शनकौतुकेन
    करात्करं गोपवधूजनेन । नीतस्त्वमाताम्रसरोजमालाव्यालम्बिलोलम्बतुलामलासीः ॥ ॥ निपाययन्ती स्तनमङ्कगं त्वां
    विलोकयन्ती वदनं हसन्ती । दशां यशोदा कतमां न भेजे स तादृशः पाहि हरे गदान्माम् ॥
