id: vasavikanyakaparameshvarisahasranamastotram
category: sahasranama
name:
  english: vasavikanyakaparameshvarisahasranamastotram
  devanagari: वासवीकन्यकापरमेश्वरीसहस्रनामस्तोत्रम्
content:
  english: shrivasavikanyakaparameshvari prasadasiddhayarthe jape viniyogah || dhyanam | vande sarvasumangalarupinim
    vande saubhagyadayinim | vande karunamayasundarim vande kanyakaparameshvarim || vande bhaktarakshanakarinim
    vasavim vande shrimantrapuravasinim | vande nityanandasvarupinim vande penukondapuravasinim || atha
    sahasranamastotram | om shrikanyaka kanyakamba kanyakaparameshvari | kanyakavasavidevi mata vasavakanyaka
    || 1|| manidvipadinetra ca mangala mangalaprada | gautamitirabhumistha mahagirinivasini || 2|| sarvamantratmika
    caiva sarvayantradinayika | sarvatantramayi bhadra sarvamantrartharupini || 3|| sarvajna sarvaga sarva
    brahmavishnushivarcita | navya divya ca sevya ca bhavya savya satavyaya || 4|| citraghantamadacchedri
    citralilamayi shubha | vedatita varashrida vishalakshi shubhaprada || 5|| shubhashreshthisuta isha
    vishva vishvambharavani | kanya vishvamayi punya'ganya ca rupasundari || 6|| saguna nirguna caiva
    nirdvandva nirmala'nagha | satya satyasvarupa ca satya satyasvarupini || 7|| caracaramayi caiva yoganidra
    suyogini | nityadharma nishkalanka nityadharmaparayana || 8|| kusumashreshthiputri ca kusumalayabhushana
    | kusumamba kumari ca virupakshasahodari || 9|| karmamayi karmahantri karmabandhavimocani | sharmada
    balada nishtha nirmala nistulaprabha || 10|| indivarasamanakshi indriyanam vashankari | kripasinduh
    kripavarta maninupuramandita || 11|| trimurtipadavidhatri jagadrakshanakarini | sarvabhadrasvarupa
    ca sarvabhadrapradayini || 12|| manikancanamanjira hyarunangrisaroruha | shunyamadhya sarvamanya dhanya'nanya
    samadbhuta || 13|| vishnuvardanasammohakarini papaharini | sarvasampatkari sarvarogashokanivarini
    || 14|| atmagauravasaujanyabodhini manadayini | manarakshakarimata bhuktimuktipradayini || 15|| shivaprada
    nissama ca niratika hyanuttama | yogamaya mahamaya mahashaktisvarupini || 16|| arivargapaharini bhanukotisamaprabha
    | mallicampakagandhadhya ratnakancanabhushita || 17|| candracuda shivamayi candrabimbasamanana | ragarupakapashadhya
    mriganabhivisheshaka || 18|| agnipujya caturbhuja nasacampeyapushpaka | nasamauktikasujvala kuruvindakapolaka
    || 19|| indurocismita vina vinasvaranivasini | agnishuddha sukancita gudhagulpha jaganmayi || 20||
    manisimhasanasthita karunamayasundari | aprameya svaprakasha shishteshta shishtapujita || 21|| cicchaktih
    cetanakara manovacamagocara | caturdashavidyarupa caturdashakalamayi || 22|| mahacatushshashtikotiyoginiganasevita
    | cinmayi paramananda vijnanaghanarupini || 23|| dhyanarupa dhyeyarupa dharmadharmavivarjita | carurupa
    caruhasa carucandrakaladhara || 24|| caracarajagannetra cakrarajaniketana | brahmadisrishtikarti ca
    goptri tejasvarupini || 25|| bhanumandalamadhyastha bhagavatisadashiva | brahmandakotijanani purusharthapradambika
    || 26|| adimadhyantarahita haribrahmeshvararcita | narayani nadarupa sampurna bhuvaneshvari || 27||
    rajarajarcita ramya ranjani muniranjani | kalyani lokavarada karunarasamanjula || 28|| varada vamanayana
    maharajni nirishvari | rakshakari rakshasaghni dushtarajamadapaha || 29|| vidhatri vedajanani raka
    candrasamanana | tantrarupa tantrini ca tantravedya tapasvini || 30|| shastrarupa shastradhara sarvashastrasvarupini
    | ragapasha manashshyabha pancabhutamayi tatha || 31|| pancatanmatrasayaka krodhakarankushancita |
    nijakantiparajanda mandala bhanumandala || 32|| kadambamayatatanka campeyakusumapriya | sarvavidyankurakara
    dantapanktidvayancita || 33|| sarasalapamadhuri jitavani vipancika | graiveyamanibhushita kurmaprishthapadadvaya
    || 34|| nakhakantiparicchinna kamini kamarupini | manikinkinika divyaracana damabhushita || 35|| rambha
    stambhamanojna ca mardavorudvayanvita | padashobhajitamboja mahagiripurishvari || 36|| devaratnagrihantastha
    sarvajna jnanamocana | mahapadmasanastha ca kadambavanavasini || 37|| nijamshabhogasarollasitalakshmigaurisarasvati
    | manjukunjanmanimanjira'lankritapadambhuja || 38|| hamsika mandagamana mahasaundaryavaradi | anavadya'runa
    ganya'ganya durgunaduraka || 39|| sampatdatri saukhyadatri karunamayasundari | ashvinidevasantushta
    sarvadevasusevita || 40|| geyacakraratharudha mantrinyambasamarcita | kamada'navadyangi devarshistutavaibhava
    || 41|| vighnayantrasamobheda karotyannaikamadhava | sankalpamatranirdhuta vishnuvardanamardini ||
    42|| murtitrayasadaseva samayastha niramaya | muladhara bhava'para brahmagranthivibhedini || 43||
    manipurantara vasa vishnu granthivibhedini | ajnacakragadamaya rudragranthivibhedini || 44|| sahasrarasamarudha
    sudhasarabhivarshini | tatinrekha samapasa shatcakroparivasini || 45|| bhaktivashya bhaktigamya bhaktarakshanakarini
    | bhaktipriya bhadramurtih bhaktasantoshadayini || 46|| sarvada kundalini amba sharada sharmada shubha
    | sadhvi shrikaryudara ca dhikari shambhumanita || 47|| shambhu manasikamata sharaccandramukhi tatha
    | shishta shiva nirakara nirgunamba nirakula || 48|| nirlepa nistulakanya niravadya nirantara | nishkarana
    nishkalanka nityabuddha nirishvara || 49|| niraga ragamathani nirmada madanashini | nirmama samamaya
    ca ananya jagadishvari || 50|| niroga nirabadha ca nijananda nirashraya | nityamukta nigamama nityashuddha
    niruttama || 51|| nirvyadha vyadhimathana nishkriya nirupaplava | nishcinta nirahankara nirmoha mohanashini
    || 52|| nirbadha mamatahantri nishpapa papanashini | abheda sakshirupa ca nirbheda bhedanashini ||
    53|| nirnasha nashamathani pushkala lobhaharini | nilaveni niralamba nirapaya bhayapaha || 54|| nissandeha
    samshayajni nirbhava ca niranjita | sukhaprada dushtadura nirvikalpa niratyaya || 55|| sarvajnana
    duhkhahantri samanadhikavarjita | sarvashaktimayi sarvamangala satgatiprada || 56|| sarveshvari sarvamayi
    sarvatattvasvarupini | mahamaya mahashaktih mahasatva mahabala || 57|| mahavirya mahabuddhih mahaishvarya
    mahagatih | manonmani mahadevi mahapatakanashini || 58|| mahapujya mahasiddhih mahayogishvareshvari
    | mahatantra mahamantra mahayantra mahasana || 59|| mahayagakramaradhya mahayogasamarcita | prakritirvikritirvidya
    sarvabhutahitaprada || 60|| shucisvaha hiranmayi dhanya suta svadha tatha | manya shraddha vibhudita
    brahmavishnushivatmika || 61|| dipta kanta ca kamakshi bhavita'nugrahaprada | shivapriya rama'nagha
    amrita''nandarupini || 62|| lokaduhkhavinashini karuna dharmavardhini | padmini padmagandhini suprasanna
    sunandini || 63|| padmakshi punyagandha ca prasadabhimukhiprabha | ahladajanani pushta lokamatendushitala
    || 64|| padmamaladhara'tbhuta ardhacandravibhushini | aryavaishyasahodari vaishyasaukhyapradayini
    || 65|| tushtih pushtishshivarudha daridryavinashini | shivadhatri ca vimalasvamini pritipushkala
    || 66|| arya shyama sati saumya shrida mangaladayini | bhaktakotiparananda siddhirupa vasuprada ||
    67|| bhaskari jnananilaya lalitangi yashasvini | urjita ca trikalajna sarvakalasvarupini || 68|| daridryanashini
    caiva sarvopadravaharini | annada cannadatri ca acyudanandakarini || 69|| ananta acyuta vyakta vyaktavyaktasvarupini
    | sharadambojabhadrakshi ajaya bhaktavatsala || 70|| asha cashrita ramya ca avakashasvarupini | akashamayapadmastha
    anadya ca dvayonija || 71|| abala cagaja caiva atmaja catmagocara | anadya cadidevi ca adityadayabhasvara
    || 72|| karteshvaramanojna ca kalakanthanibhasvara | adhara catmadayita anisha catmarupini || 73||
    ishika isha ishani ishvaraishvaryadayini | indusuta indumata indriya indumandira || 74|| indubimbasamanasya
    indriyanam vashankari | eka caiva ekavira ekakaraikavaibhava || 75|| lokatrayasusampujya lokatrayaprasutita
    | lokamata jaganmata kanyaka parameshvari || 76|| varnatma varnanilaya shodashakshararupini | kali
    kritya maharatri moharatri sulocana || 77|| kamaniya kaladhara kamini varnamalini | kashmiradravaliptangi
    kamya ca kamalarcita || 78|| manikyabhasalankara kanaka kanakaprada | kambugriva kripayukta kishori
    ca lalatini || 79|| kalastha ca nimesha ca kaladatri kalavati | kalajna kalamata ca kanyaka kleshanashini
    || 80|| kalanetra kalavani kalada kalavigraha | kirtivardhini kirtijna kirtistha kirtidayini || 81||
    sukirtita gunatita keshavanandakarini | kumari kumudaba ca karmada karmabhanjani || 82|| kaumudi kumudananda
    kalangi kalabhushana | kapardini komalangi kripasindhuh kripamayi || 83|| kancastha kancavadana kutastha
    kularupini | lokeshvari jagaddhatri kushala kulasambhava || 84|| citajna cintitapada cintastha citsvarupini
    | campakapamanojna ca caru campakamalini || 85|| candasvarupini candi caitanyaghanakehini | citananda
    citadhara citakara citalaya || 86|| cabalapangalatika candrakotisubhasvara | cintamanigunadhara cintamanivibhushita
    || 87|| bhaktacintamanilata cintamanisumandira | carucandanaliptangi catura caturanana || 88|| chatrada
    chatradari ca carucamaravijita | bhaktanam chatrarupa ca chatrachaya kritalaya || 89|| jagajjiva jagaddhatri
    jagadanandakarini | yajnarata ca janani japayajnaparayana || 90|| yajnada yajnaphalada yajnasthanakritalaya
    | yajnabhoktri yajnarupa yajnavighnavinashini || 91|| karmayoga karmarupa karmavighnavinashini | karmada
    karmaphalada karmasthanakritalaya || 92|| akalushyasucaritra sarvakarmasamancita | jayastha jayada
    jaitri jivita jayakarini || 93|| yashoda yashasamrajya yashodanandakarini | jvalini jvalini jvala
    jvaladpavakasannibha || 94|| jvalamukhi janananda jambudvipakritalaya | janmada ca janmahata janmani
    janmaranjani || 95|| janani janmabhuh caiva vedashastrapradarshini | jagadamba janitri ca jivakarunyakarini
    || 96|| jnatida jatida jatijnanada jnanagocara | jnanamayi jnanarupa ishvari jnanavigraha || 97||
    jnanavijnanashalini japapushpasamashtita | jinajaitri jinadhara japakusumashobhita || 98|| tirthankari
    niradhara jinamata jineshvari | amalambaradharini ca vishnuvardanamardini || 99|| shambhukotiduradharsha
    samudrakotigambhira | suryakotipratikasha vayukotimahabala || 100|| yamakotiparakrama kamakotiphalaprada
    | ratikotisulavanya cakrakotisurajyada || 101|| prithvikotikshamadhara padmakotinibhanana | agnikotibhayankari
    shrikanyakaparameshvari || 102|| ishanadikacicchaktih dhanadhara dhanaprada | anima mahima praptih
    karima ladhima tatha || 103|| prakamya vashitva caiva ishitva siddhidayini | mahimadigunairyukta animadyashtasiddhida
    || 104|| yavanangi janadina ajara ca jaravaha | tarini triguna tara tarika tulasinata || 105|| trayividya
    trayimurtih trayajna turiya tatha | triguneshvari trivida vishvamata trapavati || 106|| tattvajna
    tridasharadya trimurtijanani tatha | tvara trivarna trailokya tridiva lokapavani || 107|| trimurti
    trijanani caiva tribhuh tara tapasvini | taruni tapasaradhya taponishta tamopaha || 108|| taruna tridiveshana
    taptakancanasannibha | tapasi tararupini tarunarkapradayini || 109|| tapajni tarkika tarkavidya'vidyasvarupini
    | tripushkara trikalajna trailokyavyapinishvari || 110|| tapatrayavinashini tapassiddhipradayini |
    gunaradhya gunatita kulina kulanandini || 111|| tirtharupa tirthakari shokaduhkhavinashini | adina
    dinavatsala dinanathapriyankari || 112|| dayatmika dayapurna devadanavapujita | dakshina dakshinaradhya
    devanam modakarini || 113|| dakshayani devasuta durga durgatinashini | ghoragnidahadamani duhkhaduhsvapnavarini
    || 114|| shrimatih shrimayi shreshtha shrikari shrivibhavari | shrida shrisha shrinivasa paramanandadayini
    || 115|| shriyuta shrimatih matadhanada damini daya | danta dharmada shanta ca dadimikusumaprabha
    || 116|| dharani dharani dhairya dhairyada dhanashalini | dhananjaya dhanakara dharma dhatri ca dharmini
    || 117|| dedipyamana dharmini duravara durasada | nanaratnavicitrangi nanabharanamandita || 118||
    nirajasya niratanga navalavanyasundari | damana nidhita nitya nija nirnayasundari || 119|| parama
    ca nirvikara nirvaira nikhila tatha | pramada prathama prajna sarvapavanapavani || 120|| sarvapriya
    sarvavrata pavana papanashini | vasavyamshabhaga'purva paranjyotisvarupini || 121|| paroksha paraga
    kanya parishuddha'paraga | parasiddhih paragatih pashupashavimocani || 122|| padmagandha ca padmakshi
    parabrahmasvarupini | padmakesaramandira parabrahmanivasini || 123|| paramanandamudita purnapithanivasini
    | parameshi prithvi caiva paracakranivasini || 124|| paravara paravidya paramanandadayini | vagrupa
    vagmayi vagda vagnetri vagvisharada || 125|| dhirupa dhimayi dhira dhidatri dhivisharada | vrindarakavrindavandya
    vaishyavrindasahodari || 126|| rajarajeshvararcita bhaktasarvarthasadhaka | panibhusha balapuja pranarupa
    priyamvada || 127|| bhaktipriya bhavaradhya bhaveshi bhayanashini | bhaveshvari bhadramukhi bhavamata
    bhava tatha || 128|| bhattarika bhavagamya bhavakantakanashini | bhavananda bhavaniya bhutapancakavasini
    || 129|| bhagavati ca bhudatri bhuteshi bhutarupini | bhutastha bhutamata ca bhutajna bhavamocani
    || 130|| bhaktashokatamohantri bhavabharavinashini | bhugopacarakushala datri ca bhucari tatha ||
    131|| bhitiha bhaktiramya ca bhaktanamishtadayini | bhaktanukampini bhima bhaktanamartinashini ||
    132|| bhasvara bhasvati bhitih bhasvadutthanashalini | bhutida bhutirupa ca bhutika bhuvaneshvari
    || 133|| mahajihva mahadamshtra manipuranivasini | manasi manada manya manahcakshuragocara || 134||
    mahakundalinimata mahashatruvinashini | mahamohantakarajna mahamokshapradayini || 135|| mahashaktih
    mahavirya mahishasuramardini | madhura ca medha medhya mahavaibhavavardhini || 136|| mahavrata mahamurta
    muktikamyarthasiddhida | mahaniya mananiya mahaduhkhavinashini || 137|| muktaharalatobheta mattamatangakamini
    | mahaghora mantramata mahacorabhayapaha || 138|| malini ca mahasukshma makarakritikundala | mahaprabha
    mahacintya mahamantramahaushadhih || 139|| manimandalamadhyastha manimalavirajita | manorama maharupa
    rajni rajivalocana || 140|| vidyarthini ramamata vishnurupavinodini | vireshvari ca varada vishalanayanotpala
    || 141|| virasuta viravandya vishvabhuh viranandini | vishveshvari vishalakshi vishnumayavimohini
    || 142|| vikhyata vilasatkaca brahmeshi brahmarupini | brahmavidya ca brahmani vishva ca vishvarupini
    || 143|| vishvavandya vishvashaktih vira vicakshana tatha | bala balika bindustha vishvapashavimocani
    || 144|| shishupraya vaidyavidya shilashilapradayini | kshetra kshemankari vaishya aryavaishyakuleshvari
    || 145|| kusumashreshthisatputri kusumambakumarika | balanagarasampujya virupakshasahodari || 146||
    sarvasiddheshvararadya sarvabhishtaphalaprada | sarvaduhkhaprashamani sarvarakshasvarupini || 147||
    vibhuda vishnusankalpa vijnanaghanarupini | vicitrini vishnupujya vishnumayavilasini || 148|| vaishyadatri
    vaishyagotra vaishyagotravivardhini | vaishyabhojanasantushta mahasankalparupini || 149|| sandhya
    vinodinivedya satyajnanaprabodhini | vikararahitamata vijaya vishvasakshini || 150|| tattvajna ca
    tattvakara tattvamarthasvarupini | tapasvadhyayanirata tapasvijanasannuta || 151|| vipula vindhyavasini
    nagareshvaramanita | kamaladevisampujya janardanasupujita || 152|| vandita vararupa ca matita mattakashini
    | madhavi malini manya mahapatakanashini || 153|| vara ca varavarnini varitakaravarshini | satkirtigunasampanna
    vaishyalokavashankari || 154|| tattvasana tapophala tarunadityapatala | tantrasara tantramata tapolokanivasini
    || 155|| tantrastha tantrasakshini tantramargapradarshini | sarvasampattijanani satpatha sakaleshtada
    || 156|| asamana samadevi samarha sakalastuta | sanakadimunidyeya sarvashastrarthagocara || 157||
    sadashiva samuttirna satvika shantarupini | sarvavedantanilaya samaya sarvatomukhi || 158|| sahasradalapadmastha
    sarvacaitanyarupini | sarvadoshavinirmukta saccidanandarupini || 159|| sarvavishvambaravedya sarvajnanavisharada
    | vidyavidyakari vidya vidyavidyaprabodhini || 160|| vimala vibhava vedya vishvastha vivitojvala |
    virahatyaprashamani vinamrajanapalini || 161|| viramadhya viratrupa vitantra vishvanayika | vishvambara
    samaradhya vikrama vishvamangala || 162|| vinayaki ca vasavi kanyaka parameshvari | nityakarmaphalaprada
    nityamangalarupini || 163|| kshetrapalasamarcita grahapidanivarini | kshemakarunyakarini rudralakshanadharini
    || 164|| sarvanandamayi bhadra vaishyasaukhyapradayini | nityanandasvarupini vaishyasampatpradayini
    || 165|| kshetrajyeshthacalasthita shrimantrapuravasini | saumangalyadidevata shrikanyakaparameshvari
    || 166|| phalashrutih | sahasranamakam stotram vasavyah yah pathennarah | putrapautramavapnoti sarvasiddhincavindati
    || 1|| sarvarogaprashamanam dirghayushyapradayakam | anena sadrisham stotram na bhutam na bhavishyati
    || 2|| yam yam kamayate kamam tam tam prapnoti nishcitam | tasyaiva bhavati shraddha kanyaka namakirtane
    || 3|| || iti shrivasavikanyakaparameshvari sahasranamastotram sampurnam || samarpanam | yadaksharapadabhrashtam
    matrahinam tu yadbhavet | tatsarvam kshamyatam devi vasavamba namo'stute || 1|| visargabindumatrani
    padapadaksharani ca | nyunani catiriktani kshamasva parameshvari || 2|| anyatha sharanam nasti tvameva
    sharanam mama | tasmatkarunyabhavena raksha raksha maheshvari || 3||
  devanagari: श्रीवासवीकन्यकापरमेश्वरी प्रसादसिद्धयर्थे जपे विनियोगः ॥ ध्यानम् । वन्दे सर्वसुमङ्गलरूपिणीं
    वन्दे सौभाग्यदायिनीम् । वन्दे करुणामयसुन्दरीं वन्दे कन्यकापरमेश्वरीम् ॥ वन्दे भक्तरक्षणकारिणीं वासवीं
    वन्दे श्रीमन्त्रपुरवासिनीम् । वन्दे नित्यानन्दस्वरूपिणीं वन्दे पेनुकोण्डापुरवासिनीम् ॥ अथ सहस्रनामस्तोत्रम्
    । ॐ श्रीकन्यका कन्यकाम्बा कन्यकापरमेश्वरी । कन्यकावासवीदेवी माता वासवकन्यका ॥ १॥ मणिद्वीपादिनेत्रा
    च मङ्गला मङ्गलप्रदा । गौतमीतीरभूमिस्था महागिरिनिवासिनी ॥ २॥ सर्वमन्त्रात्मिका चैव सर्वयन्त्रादिनायिका
    । सर्वतन्त्रमयी भद्रा सर्वमन्त्रार्थरूपिणी ॥ ३॥ सर्वज्ञा सर्वगा सर्वा ब्रह्मविष्णुशिवार्चिता । नव्या
    दिव्या च सेव्या च भव्या सव्या सतव्यया ॥ ४॥ चित्रघण्टमदच्छेद्री चित्रलीलामयी शुभा । वेदातीता वराश्रीदा
    विशालाक्षी शुभप्रदा ॥ ५॥ शुभश्रेष्ठिसुता ईषा विश्वा विश्वम्भरावनी । कन्या विश्वमयी पुण्याऽगण्या च
    रूपसुन्दरी ॥ ६॥ सगुणा निर्गुणा चैव निर्द्वन्द्वा निर्मलाऽनघा । सत्या सत्यस्वरूपा च सत्या सत्यस्वरूपिणी
    ॥ ७॥ चराचरमयी चैव योगनिद्रा सुयोगिनी । नित्यधर्मा निष्कलङ्का नित्यधर्मपरायणा ॥ ८॥ कुसुमश्रेष्ठिपुत्री
    च कुसुमालयभूषणा । कुसुमाम्बा कुमारी च विरूपाक्षसहोदरी ॥ ९॥ कर्ममयी कर्महन्त्री कर्मबन्धविमोचनी । शर्मदा
    बलदा निष्ठा निर्मला निस्तुलप्रभा ॥ १०॥ इन्दीवरसमानाक्षी इन्द्रियाणां वशङ्करी । कृपासिन्दुः कृपावार्ता
    मणिनूपुरमण्डिता ॥ ११॥ त्रिमूर्तिपदवीधात्री जगद्रक्षणकारिणी । सर्वभद्रस्वरूपा च सर्वभद्रप्रदायिनी ॥
    १२॥ मणिकाञ्चनमञ्जीरा ह्यरुणाङ्ग्रिसरोरुहा । शून्यमध्या सर्वमान्या धन्याऽनन्या समाद्भुता ॥ १३॥ विष्णुवर्दनसम्मोहकारिणी
    पापहारिणी । सर्वसम्पत्करी सर्वरोगशोकनिवारिणी ॥ १४॥ आत्मगौरवसौजन्यबोधिनी मानदायिनी । मानरक्षाकरीमाता
    भुक्तिमुक्तिप्रदायिनी ॥ १५॥ शिवप्रदा निस्समा च निरतिका ह्यनुत्तमा । योगमाया महामाया महाशक्तिस्वरूपिणी
    ॥ १६॥ अरिवर्गापहारिणी भानुकोटिसमप्रभा । मल्लीचम्पकगन्धाढ्या रत्नकाञ्चनभूषिता ॥ १७॥ चन्द्रचूडा शिवमयी
    चन्द्रबिम्बसमानना । रागरूपकपाशाढ्या मृगनाभिविशेषका ॥ १८॥ अग्निपूज्या चतुर्भुजा नासाचाम्पेयपुष्पका
    । नासामौक्तिकसुज्वाला कुरुविन्दकपोलका ॥ १९॥ इन्दुरोचिस्मिता वीणा वीणास्वरनिवासिनी । अग्निशुद्धा सुकाञ्चिता
    गूढगुल्फा जगन्मयी ॥ २०॥ मणिसिम्हासनस्थिता करुणामयसुन्दरी । अप्रमेया स्वप्रकाशा शिष्टेष्टा शिष्टपूजिता
    ॥ २१॥ चिच्छक्तिः चेतनाकारा मनोवाचामगोचरा । चतुर्दशविद्यारूपा चतुर्दशकलामयी ॥ २२॥ महाचतुष्षष्टिकोटियोगिनीगणसेविता
    । चिन्मयी परमानन्दा विज्ञानघनरूपिणी ॥ २३॥ ध्यानरूपा ध्येयरूपा धर्माधर्मविवर्जिता । चारुरूपा चारुहासा
    चारुचन्द्रकलाधरा ॥ २४॥ चराचरजगन्नेत्रा चक्रराजनिकेतना । ब्रह्मादिसृष्टिकर्ती च गोप्त्री तेजस्वरूपिणी
    ॥ २५॥ भानुमण्डलमध्यस्था भगवतीसदाशिवा । ब्रह्माण्डकोटिजननी पुरुषार्थप्रदाम्बिका ॥ २६॥ आदिमध्यान्तरहिता
    हरिब्रह्मेश्वरार्चिता । नारायणी नादरूपा सम्पूर्णा भुवनेश्वरी ॥ २७॥ राजराजार्चिता रम्या रञ्जनी मुनिरञ्जनी
    । कल्याणी लोकवरदा करुणारसमञ्जुला ॥ २८॥ वरदा वामनयना महाराज्ञी निरीश्वरी । रक्षाकरी राक्षसघ्नी दुष्टराजमदापहा
    ॥ २९॥ विधात्री वेदजननी राका चन्द्रसमानना । तन्त्ररूपा तन्त्रिणी च तन्त्रवेद्या तपस्विनी ॥ ३०॥ शास्त्ररूपा
    शास्त्राधारा सर्वशास्त्रस्वरूपिणी । रागपाशा मनश्श्याभा पञ्चभूतमयी तथा ॥ ३१॥ पञ्चतन्मात्रसायका क्रोधाकाराङ्कुशाञ्चिता
    । निजकान्तिपराजण्डा मण्डला भानुमण्डला ॥ ३२॥ कदम्बमयताटङ्का चाम्पेयकुसुमप्रिया । सर्वविद्याङ्कुराकारा
    दन्तपङ्क्तिद्वयाञ्चिता ॥ ३३॥ सरसालापमाधुरी जितवाणी विपञ्चिका । ग्रैवेयमणिभूषिता कूर्मपृष्ठपदद्वया
    ॥ ३४॥ नखकान्तिपरिच्छिन्ना कामिनी कामरूपिणी । मणिकिङ्किणिका दिव्यरचना दामभूषिता ॥ ३५॥ रम्भा स्तम्भमनोज्ञा
    च मार्दवोरुद्वयान्विता । पदशोभाजिताम्बोजा महागिरिपुरीश्वरी ॥ ३६॥ देवरत्नगृहान्तस्था सर्वज्ञा ज्ञानमोचना
    । महापद्मासनस्था च कदम्बवनवासिनी ॥ ३७॥ निजांशभोगसरोल्लसितलक्ष्मीगौरीसरस्वती । मञ्जुकुञ्जन्मणिमञ्जीराऽलङ्कृतपदाम्भुजा
    ॥ ३८॥ हंसिका मन्दगमना महासौन्दर्यवारदी । अनवद्याऽरुणा गण्याऽगण्या दुर्गुणदूरका ॥ ३९॥ सम्पत्दात्री
    सौख्यदात्री करुणामयसुन्दरी । अश्विनिदेवसन्तुष्टा सर्वदेवसुसेविता ॥ ४०॥ गेयचक्ररथारूढा मन्त्रिण्यम्बासमर्चिता
    । कामदाऽनवद्याङ्गी देवर्षिस्तुतवैभवा ॥ ४१॥ विघ्नयन्त्रसमोभेदा करोत्यन्नैकमाधवा । सङ्कल्पमात्रनिर्धूता
    विष्णुवर्दनमर्दिनी ॥ ४२॥ मूर्तित्रयसदासेवा समयस्था निरामया । मूलाधारा भवाऽपारा ब्रह्मग्रन्थिविभेदिनी
    ॥ ४३॥ मणिपूरान्तरा वासा विष्णु ग्रन्थिविभेदिनी । आज्ञाचक्रगदामाया रुद्रग्रन्थिविभेदिनी ॥ ४४॥ सहस्रारसमारूढा
    सुधासाराभिवर्षिणी । तटिन्रेखा समापासा षट्चक्रोपरिवासिनी ॥ ४५॥ भक्तिवश्या भक्तिगम्या भक्तरक्षणकारिणी
    । भक्तिप्रिया भद्रमूर्तिः भक्तसन्तोषदायिनी ॥ ४६॥ सर्वदा कुण्डलिनी अम्बा शारदा शर्मदा शुभा । साध्वी
    श्रीकर्युदारा च धीकरी शम्भुमानिता ॥ ४७॥ शम्भु मानसिकामाता शरच्चन्द्रमुखी तथा । शिष्टा शिवा निराकारा
    निर्गुणाम्बा निराकुला ॥ ४८॥ निर्लेपा निस्तुलाकन्या निरवद्या निरन्तरा । निष्कारणा निष्कलङ्का नित्यबुद्धा
    निरीश्वरा ॥ ४९॥ नीरागा रागमथनी निर्मदा मदनाशिनी । निर्ममा सममाया च अनन्या जगदीश्वरी ॥ ५०॥ निरोगा निराबाधा
    च निजानन्दा निराश्रया । नित्यमुक्ता निगममा नित्यशुद्धा निरुत्तमा ॥ ५१॥ निर्व्याधा व्याधिमथना निष्क्रिया
    निरुपप्लवा । निश्चिन्ता निरहङ्कारा निर्मोहा मोहनाशिनी ॥ ५२॥ निर्बाधा ममताहन्त्री निष्पापा पापनाशिनी
    । अभेदा साक्षिरूपा च निर्भेदा भेदनाशिनी ॥ ५३॥ निर्नाशा नाशमथनी पुष्कला लोभहारिणी । नीलवेणी निरालम्बा
    निरपाया भयापहा ॥ ५४॥ निस्सन्देहा संशयज्ञी निर्भवा च निरञ्जिता । सुखप्रदा दुष्टदूरा निर्विकल्पा निरत्यया
    ॥ ५५॥ सर्वज्ञाना दुःखहन्त्री समानाधिकवर्जिता । सर्वशक्तिमयी सर्वमङ्गला सत्गतिप्रदा ॥ ५६॥ सर्वेश्वरी
    सर्वमयी सर्वतत्त्वस्वरूपिणी । महामाया महाशक्तिः महासत्वा महाबला ॥ ५७॥ महावीर्या महाबुद्धिः महैश्वर्या
    महागतिः । मनोन्मणी महादेवी महापातकनाशिनी ॥ ५८॥ महापूज्या महासिद्धिः महायोगीश्वरेश्वरी । महातन्त्रा
    महामन्त्रा महायन्त्रा महासना ॥ ५९॥ महायागक्रमाराध्या महायोगसमर्चिता । प्रकृतिर्विकृतिर्विद्या सर्वभूतहितप्रदा
    ॥ ६०॥ शुचिस्वाहा हिरण्मयी धन्या सुता स्वधा तथा । मान्या श्रद्धा विभूदिता ब्रह्मविष्णुशिवात्मिका ॥
    ६१॥ दीप्ता कान्ता च कामाक्षी भाविताऽनुग्रहप्रदा । शिवप्रिया रमाऽनघा अमृताऽऽनन्दरूपिणी ॥ ६२॥ लोकदुःखविनाशिनी
    करुणा धर्मवर्धिनी । पद्मिनी पद्मगन्धिनी सुप्रसन्ना सुनन्दिनी ॥ ६३॥ पद्माक्षी पुण्यगन्धा च प्रसादाभिमुखीप्रभा
    । आह्लादजननी पुष्टा लोकमातेन्दुशीतला ॥ ६४॥ पद्ममालाधराऽत्भुता अर्धचन्द्रविभूषिणी । आर्यवैश्यसहोदरी
    वैश्यसौख्यप्रदायिनी ॥ ६५॥ तुष्टिः पुष्टिश्शिवारूढा दारिद्र्यविनाशिनी । शिवधात्री च विमलास्वामिनी प्रीतिपुष्कला
    ॥ ६६॥ आर्या श्यामा सती सौम्या श्रीदा मङ्गलदायिनी । भक्तकोटिपरानन्दा सिद्धिरूपा वसुप्रदा ॥ ६७॥ भास्करी
    ज्ञाननिलया ललिताङ्गी यशस्विनी । ऊर्जिता च त्रिकालज्ञा सर्वकालस्वरूपिणी ॥ ६८॥ दारिद्र्यनाशिनी चैव सर्वोपद्रवहारिणी
    । अन्नदा चान्नदात्री च अच्युदानन्दकारिणी ॥ ६९॥ अनन्ता अच्युता व्यक्ता व्यक्ताव्यक्तस्वरूपिणी । शारदम्बोजभद्राक्षी
    अजया भक्तवत्सला ॥ ७०॥ आशा चाश्रिता रम्या च अवकाशस्वरूपिणी । आकाशमयपद्मस्था अनाद्या च द्वयोनिजा ॥ ७१॥
    अबला चागजा चैव आत्मजा चात्मगोचरा । अनाद्या चादिदेवी च आदित्यदयभास्वरा ॥ ७२॥ कार्तेश्वरमनोज्ञा च कालकण्ठनिभस्वरा
    । आधारा चात्मदयिता अनीशा चात्मरूपिणी ॥ ७३॥ ईशिका ईशा ईशानी ईश्वरैश्वर्यदायिनी । इन्दुसुता इन्दुमाता
    इन्द्रिया इन्दुमन्दिरा ॥ ७४॥ इन्दुबिम्बसमानास्या इन्द्रियाणां वशङ्करी । एका चैव एकवीरा एकाकारैकवैभवा
    ॥ ७५॥ लोकत्रयसुसम्पूज्या लोकत्रयप्रसूतिता । लोकमाता जगन्माता कन्यका परमेश्वरी ॥ ७६॥ वर्णात्मा वर्णनिलया
    षोडषाक्षररूपिणी । काली कृत्या महारात्री मोहरात्री सुलोचना ॥ ७७॥ कमनीया कलाधारा कामिनी वर्णमालिनी ।
    काश्मीरद्रवलिप्ताङ्गी काम्या च कमलार्चिता ॥ ७८॥ माणिक्यभासालङ्कारा कनका कनकप्रदा । कम्बुग्रीवा कृपायुक्ता
    किशोरी च ललाटिनी ॥ ७९॥ कालस्था च निमेषा च कालदात्री कलावती । कालज्ञा कालमाता च कन्यका क्लेशनाशिनी
    ॥ ८०॥ कालनेत्रा कलावाणी कालदा कालविग्रहा । कीर्तिवर्धिनी कीर्तिज्ञा कीर्तिस्था कीर्तिदायिनी ॥ ८१॥
    सुकीर्तिता गुणातीता केशवानन्दकारिणी । कुमारी कुमुदाबा च कर्मदा कर्मभञ्जनी ॥ ८२॥ कौमुदी कुमुदानन्दा
    कालाङ्गी कालभूषणा । कपर्दिनी कोमलाङ्गी कृपासिन्धुः कृपामयी ॥ ८३॥ कञ्चस्था कञ्चवदना कूटस्था कुलरूपिणी
    । लोकेश्वरी जगद्धात्री कुशला कुलसम्भवा ॥ ८४॥ चितज्ञा चिन्तितपदा चिन्तस्था चित्स्वरूपिणी । चम्पकापमनोज्ञा
    च चारु चम्पकमालिनी ॥ ८५॥ चण्डस्वरूपिणी चण्डी चैतन्यघनकेहिनी । चितानन्दा चिताधारा चिताकारा चितालया
    ॥ ८६॥ चबलापाङ्गलतिका चन्द्रकोटिसुभास्वरा । चिन्तामणिगुणाधारा चिन्तामणिविभूषिता ॥ ८७॥ भक्तचिन्तामणिलता
    चिन्तामणिसुमन्दिरा । चारुचन्दनलिप्ताङ्गी चतुरा चतुरानना ॥ ८८॥ छत्रदा छत्रदारी च चारुचामरवीजिता । भक्तानां
    छत्ररूपा च छत्रछाया कृतालया ॥ ८९॥ जगज्जीवा जगद्धात्री जगदानन्दकारिणी । यज्ञरता च जननी जपयज्ञपरायणा
    ॥ ९०॥ यज्ञदा यज्ञफलदा यज्ञस्थानकृतालया । यज्ञभोक्त्री यज्ञरूपा यज्ञविघ्नविनाशिनी ॥ ९१॥ कर्मयोगा कर्मरूपा
    कर्मविघ्नविनाशिनी । कर्मदा कर्मफलदा कर्मस्थानकृतालया ॥ ९२॥ अकालुष्यसुचारित्रा सर्वकर्मसमञ्चिता । जयस्था
    जयदा जैत्री जीविता जयकारिणी ॥ ९३॥ यशोदा यशसाम्राज्या यशोदानन्दकारिणी । ज्वलिनी ज्वालिनी ज्वाला ज्वलद्पावकसन्निभा
    ॥ ९४॥ ज्वालामुखी जनानन्दा जम्बूद्वीपकृतालया । जन्मदा च जन्महता जन्मनी जन्मरञ्जनी ॥ ९५॥ जननी जन्मभूः
    चैव वेदशास्त्रप्रदर्शिनी । जगदम्बा जनित्री च जीवकारुण्यकारिणी ॥ ९६॥ ज्ञातिदा जातिदा जातिज्ञानदा ज्ञानगोचरा
    । ज्ञानमयी ज्ञानरूपा ईश्वरी ज्ञानविग्रहा ॥ ९७॥ ज्ञानविज्ञानशालिनी जपापुष्पसमष्टिता । जिनजैत्री जिनाधारा
    जपाकुसुमशोभिता ॥ ९८॥ तीर्थङ्करी निराधारा जिनमाता जिनेश्वरी । अमलाम्बरधारिणी च विष्णुवर्दनमर्दिनी ॥
    ९९॥ शम्भुकोटिदुराधर्षा समुद्रकोटिगम्भीरा । सूर्यकोटिप्रतीकाशा वायुकोटिमहाबला ॥ १००॥ यमकोटिपराक्रमा
    कामकोटिफलप्रदा । रतिकोटिसुलावण्या चक्रकोटिसुराज्यदा ॥ १०१॥ पृथ्विकोटिक्षमाधारा पद्मकोटिनिभानना । अग्निकोटिभयङ्करी
    श्रीकन्यकापरमेश्वरी ॥ १०२॥ ईशानादिकचिच्छक्तिः धनाधारा धनप्रदा । अणिमा महिमा प्राप्तिः करिमा लधिमा
    तथा ॥ १०३॥ प्राकाम्या वशित्वा चैव ईशित्वा सिद्धिदायिनी । महिमादिगुणैर्युक्ता अणिमाद्यष्टसिद्धिदा ॥
    १०४॥ यवनाङ्गी जनादीना अजरा च जरावहा । तारिणी त्रिगुणा तारा तारिका तुलसीनता ॥ १०५॥ त्रयीविद्या त्रयीमूर्तिः
    त्रयज्ञा तुरीया तथा । त्रिगुणेश्वरी त्रिविदा विश्वमाता त्रपावती ॥ १०६॥ तत्त्वज्ञा त्रिदशाराद्या त्रिमूर्तिजननी
    तथा । त्वरा त्रिवर्णा त्रैलोक्या त्रिदिवा लोकपावनी ॥ १०७॥ त्रिमूर्ती त्रिजननी चैव त्रिभूः तारा तपस्विनी
    । तरुणी तापसाराध्या तपोनिष्टा तमोपहा ॥ १०८॥ तरुणा त्रिदिवेशाना तप्तकाञ्चनसन्निभा । तापसी तारारूपिणी
    तरुणार्कप्रदायिनी ॥ १०९॥ तापज्ञी तर्किका तर्कविद्याऽविद्यास्वरूपिणी । त्रिपुष्करा त्रिकालज्ञा त्रैलोक्यव्यापिनीश्वरी
    ॥ ११०॥ तापत्रयविनाशिनी तपस्सिद्धिप्रदायिनी । गुणाराध्या गुणातीता कुलीना कुलनन्दिनी ॥ १११॥ तीर्थरूपा
    तीर्थकरी शोकदुःखविनाशिनी । अदीना दीनवत्सला दीनानाथप्रियङ्करी ॥ ११२॥ दयात्मिका दयापूर्णा देवदानवपूजिता
    । दक्षिणा दक्षिणाराध्या देवानां मोदकारिणी ॥ ११३॥ दाक्षायणी देवसुता दुर्गा दुर्गतिनाशिनी । घोराग्निदाहदमनी
    दुःखदुःस्वप्नवारिणी ॥ ११४॥ श्रीमतिः श्रीमयी श्रेष्ठा श्रीकरी श्रीविभावरी । श्रीदा श्रीशा श्रीनिवासा
    परमानन्ददायिनी ॥ ११५॥ श्रीयुता श्रीमतिः माताधनदा दामिनी दया । दान्ता धर्मदा शान्ता च दाडिमीकुसुमप्रभा
    ॥ ११६॥ धरणी धारणी धैर्या धैर्यदा धनशालिनी । धनञ्जया धनाकारा धर्मा धात्री च धर्मिणी ॥ ११७॥ देदीप्यमाना
    धर्मिणी दुरावारा दुरासदा । नानारत्नविचित्राङ्गी नानाभरणमण्डिता ॥ ११८॥ नीरजास्या निरातङ्गा नवलावण्यसुन्दरी
    । दमना निधिता नित्या निजा निर्णयसुन्दरी ॥ ११९॥ परमा च निर्विकारा निर्वैरा निखिला तथा । प्रमदा प्रथमा
    प्राज्ञा सर्वपावनपावनी ॥ १२०॥ सर्वप्रिया सर्वव्रता पावना पापनाशिनी । वासव्यंशभागाऽपूर्वा परञ्ज्योतिस्वरूपिणी
    ॥ १२१॥ परोक्षा पारगा कन्या परिशुद्धाऽपारगा । परासिद्धिः परागतिः पशुपाशविमोचनी ॥ १२२॥ पद्मगन्धा च पद्माक्षी
    परब्रह्मस्वरूपिणी । पद्मकेसरमन्दिरा परब्रह्मनिवासिनी ॥ १२३॥ परमानन्दमुदिता पूर्णपीठनिवासिनी । परमेशी
    पृथ्वी चैव परचक्रनिवासिनी ॥ १२४॥ परावरा पराविद्या परमानन्ददायिनी । वाग्रूपा वाग्मयी वाग्दा वाग्नेत्री
    वाग्विशारदा ॥ १२५॥ धीरूपा धीमयी धीरा धीदात्री धीविशारदा । वृन्दारकवृन्दवन्द्या वैश्यवृन्दसहोदरी ॥
    १२६॥ राजराजेश्वरार्चिता भक्तसर्वार्थसाधका । पणिभूषा बालापूजा प्राणरूपा प्रियंवदा ॥ १२७॥ भक्तिप्रिया
    भवाराध्या भवेशी भयनाशिनी । भवेश्वरी भद्रमुखी भवमाता भवा तथा ॥ १२८॥ भट्टारिका भवागम्या भवकण्टकनाशिनी
    । भवानन्दा भावनीया भूतपञ्चकवासिनी ॥ १२९॥ भगवती च भूदात्री भूतेशी भूतरूपिणी । भूतस्था भूतमाता च भूतज्ञा
    भवमोचनी ॥ १३०॥ भक्तशोकतमोहन्त्री भवभारविनाशिनी । भूगोपचारकुशला दात्री च भूचरी तथा ॥ १३१॥ भीतिहा भक्तिरम्या
    च भक्तानामिष्टदायिनी । भक्तानुकम्पिनी भीमा भक्तानामार्तिनाशिनी ॥ १३२॥ भास्वरा भास्वती भीतिः भास्वदुत्थानशालिनी
    । भूतिदा भूतिरूपा च भूतिका भुवनेश्वरी ॥ १३३॥ महाजिह्वा महादंष्ट्रा मणिपूरनिवासिनी । मानसी मानदा मान्या
    मनःचक्षुरगोचरा ॥ १३४॥ महाकुण्डलिनीमाता महाशत्रुविनाशिनी । महामोहान्तकारज्ञा महामोक्षप्रदायिनी ॥ १३५॥
    महाशक्तिः महाविर्या महिषासुरमर्दिनी । मधुरा च मेधा मेध्या महावैभववर्धिनी ॥ १३६॥ महाव्रता महामूर्ता
    मुक्तिकाम्यार्थसिद्धिदा । महनीया माननीया महादुःखविनाशिनी ॥ १३७॥ मुक्ताहारालतोभेता मत्तमातङ्गकामिनी
    । महाघोरा मन्त्रमाता महाचोरभयापहा ॥ १३८॥ मालिनी च महासूक्ष्मा मकराकृतिकुण्डला । महाप्रभा महाचिन्त्या
    महामन्त्रमहौषधिः ॥ १३९॥ मणिमण्डलमध्यस्था मणिमालाविराजिता । मनोरमा महारूपा राज्ञी राजीवलोचना ॥ १४०॥
    विद्यार्थिनी रमामाता विष्णुरूपाविनोदिनी । वीरेश्वरी च वरदा विशालनयनोत्पला ॥ १४१॥ वीरसुता वीरवन्द्या
    विश्वभूः वीरनन्दिनी । विश्वेश्वरी विशालाक्षी विष्णुमायाविमोहिनी ॥ १४२॥ विख्याता विलसत्कचा ब्रह्मेशी
    ब्रह्मरूपिणी । ब्रह्मविद्या च ब्रह्माणी विश्वा च विश्वरूपिणी ॥ १४३॥ विश्ववन्द्या विश्वशक्तिः वीरा
    विचक्षणा तथा । बाला बालिका बिन्दुस्था विश्वपाशविमोचनी ॥ १४४॥ शिशुप्राया वैद्यविद्या शीलाशीलप्रदायिनी
    । क्षेत्रा क्षेमङ्करी वैश्या आर्यवैश्यकुलेश्वरी ॥ १४५॥ कुसुमश्रेष्ठिसत्पुत्री कुसुमाम्बाकुमारिका ।
    बालनगरसम्पूज्या विरूपाक्षसहोदरी ॥ १४६॥ सर्वसिद्धेश्वराराद्या सर्वाभीष्टफलप्रदा । सर्वदुःखप्रशमनी सर्वरक्षास्वरूपिणी
    ॥ १४७॥ विभुदा विष्णुसङ्कल्पा विज्ञानघनरूपिणी । विचित्रिणी विष्णुपूज्या विष्णुमायाविलासिनी ॥ १४८॥ वैश्यदात्री
    वैश्यगोत्रा वैश्यगोत्रविवर्धिनी । वैश्यभोजनसन्तुष्टा महासङ्कल्परूपिणी ॥ १४९॥ सन्ध्या विनोदिनीवेद्या
    सत्यज्ञानप्रबोधिनी । विकाररहितामाता विजया विश्वसाक्षिणी ॥ १५०॥ तत्त्वज्ञा च तत्त्वाकारा तत्त्वमर्थस्वरूपिणी
    । तपस्वाध्यायनिरता तपस्वीजनसन्नुता ॥ १५१॥ विपुला विन्ध्यवासिनी नगरेश्वरमानिता । कमलादेविसम्पूज्या
    जनार्दनसुपूजिता ॥ १५२॥ वन्दिता वररूपा च मतिता मत्तकाशिनी । माधवी मालिनी मान्या महापातकनाशिनी ॥ १५३॥
    वरा च वरवर्णिनी वारिताकारवर्षिणी । सत्कीर्तिगुणसम्पन्ना वैश्यलोकवशङ्करी ॥ १५४॥ तत्त्वासना तपोफला तरुणादित्यपाटला
    । तन्त्रसारा तन्त्रमाता तपोलोकनिवासिनी ॥ १५५॥ तन्त्रस्था तन्त्रसाक्षिणी तन्त्रमार्गप्रदर्शिनी । सर्वसम्पत्तिजननी
    सत्पथा सकलेष्टदा ॥ १५६॥ असमाना सामदेवी समर्हा सकलस्तुता । सनकादिमुनिद्येया सर्वशास्त्रार्थगोचरा ॥
    १५७॥ सदाशिवा समुत्तीर्णा सात्विका शान्तरूपिणी । सर्ववेदान्तनिलया समया सर्वतोमुखी ॥ १५८॥ सहस्रदलपद्मस्था
    सर्वचैतन्यरूपिणी । सर्वदोषविनिर्मुक्ता सच्चिदानन्दरूपिणी ॥ १५९॥ सर्वविश्वम्बरावेद्या सर्वज्ञानविशारदा
    । विद्याविद्याकरी विद्या विद्याविद्यप्रबोधिनी ॥ १६०॥ विमला विभवा वेद्या विश्वस्था विवितोज्वला । वीरहत्यप्रशमनी
    विनम्रजनपालिनी ॥ १६१॥ वीरमध्या विराट्रूपा वितन्त्रा विश्वनायिका । विश्वम्बरा समाराध्या विक्रमा विश्वमङ्गला
    ॥ १६२॥ विनायकी च वासवी कन्यका परमेश्वरी । नित्यकर्मफलप्रदा नित्यमङ्गलरूपिणी ॥ १६३॥ क्षेत्रपालसमर्चिता
    ग्रहपीडानिवारिणी । क्षेमकारुण्यकारिणी रुद्रलक्षणधारिणी ॥ १६४॥ सर्वानन्दमयी भद्रा वैश्यसौख्यप्रदायिनी
    । नित्यानन्दस्वरूपिणी वैश्यसम्पत्प्रदायिनी ॥ १६५॥ क्षेत्रज्येष्ठाचलस्थिता श्रीमन्त्रपुरवासिनी । सौमङ्गल्यादिदेवता
    श्रीकन्यकापरमेश्वरी ॥ १६६॥ फलश्रुतिः । सहस्रनामकं स्तोत्रं वासव्याः यः पठेन्नरः । पुत्रपौत्रमवाप्नोति
    सर्वसिद्धिञ्चविन्दति ॥ १॥ सर्वरोगप्रशमनं दीर्घायुष्यप्रदायकम् । अनेन सदृशं स्तोत्रं न भूतं न भविष्यति
    ॥ २॥ यं यं कामयते कामं तं तं प्राप्नोति निश्चितम् । तस्यैव भवति श्रद्धा कन्यका नामकीर्तने ॥ ३॥ ॥ इति
    श्रीवासवीकन्यकापरमेश्वरी सहस्रनामस्तोत्रं सम्पूर्णम् ॥ समर्पणम् । यदक्षरपदभ्रष्टं मात्राहीनं तु यद्भवेत्
    । तत्सर्वं क्षम्यतां देवी वासवाम्बा नमोऽस्तुते ॥ १॥ विसर्गबिन्दुमात्राणि पदपादाक्षराणि च । न्यूनानि
    चातिरिक्तानि क्षमस्व परमेश्वरी ॥ २॥ अन्यथा शरणं नास्ति त्वमेव शरणं मम । तस्मात्कारुण्यभावेन रक्ष रक्ष
    महेश्वरी ॥ ३॥
