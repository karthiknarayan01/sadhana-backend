    loka beda tem bimukha bha adhama na bena samana || || sahasabahu suranathu trisanku| kehi na rajamada
    dinha kalanku || bharata kinha yaha ucita up | ripu rina ranca na rakhaba k || eka kinhi nahim bharata
    bhalai| nidare ramu jani asahai || samujhi parihi sau aju biseshi| samara sarosha rama mukhu pekhi
    || etana kahata niti rasa bhula| rana rasa bitapu pulaka misa phula || prabhu pada bandi sisa raja
    rakhi| bole satya sahaja balu bhashi || anucita natha na manaba mora| bharata hamahi upacara na thora
    || kaha~ lagi sahia rahia manu marem| natha satha dhanu hatha hamarem || do chatri jati raghukula
    janamu rama anuga jagu jana| latahu~ marem carhati sira nica ko dhuri samana || || uthi kara jori
    rajayasu maga| manahu~ bira rasa sovata jaga || ba~dhi jata sira kasi kati bhatha| saji sarasanu sayaku
    hatha || aju rama sevaka jasu leu~| bharatahi samara sikhavana deu~ || rama niradara kara phalu pai|
    sovahu~ samara seja dau bhai || ai bana bhala sakala samaju| pragata karu~ risa pachila aju || jimi
    kari nikara dali mrigaraju| lei lapeti lava jimi baju || taisehim bharatahi sena sameta| sanuja nidari
