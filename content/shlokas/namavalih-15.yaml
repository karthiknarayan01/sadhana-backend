    || 1|| ashvamedhasahasranam vajapeyasya kotayah | sakritpathena jayante mahamayaprasadatah || 2||
    ya idam pathati nityam devyagare kritanjalih | kim tasya durlabham devi divi bhuvi rasatale || 3||
    sa dirghayuh sukhi vagmi nishcitam parvatatmaje | shraddhaya'shraddhaya vapi durganamaprasadatah ||
    4|| ya idam pathate nityam devibhakto mudanvitah | tasya shatrukshayam yati tatha shakrasamo bhavet
    || 5|| pratinama samuccarya srotasi yah prapujayet | shanmasabhyantare devi nirdhani dhanavan bhavet
    || 6|| vandhya va kakavandhya va mritavatsa ca ya'ngana | asya prayogamatrena bahuputravati bhavet
    || 7|| arogyarthe shatavrittih putrarthe hyekavatsaram | diptagnisannidhau pathat apapo bhavati dhruvam
    || 8|| ashtottarashatenasya purashcarya vidhiyate | kalau caturgunam proktam purashcaranasiddhaye
    || 9|| japakamalapushpam ca campakam nagakesharam | kadambam kusumam capi pratinamna samarcayet ||
    10|| pranavadinamo'ntena caturthyantena mantravit | srotasi pujayitva tu upaharam samarpayet || 11||
    icchajnanakriyasiddhirnishcatam girinandini | dehante paramam sthanam yatsurairapi durlabham || 12||
    sa yasyati na sandeho shridurganamakirtanat | bhajeddurgam smareddurgam japeddurgam shivapriyam |
    tatkshanat shivamapnoti satyam satyam varanane || 13|| || iti tantrarajatantrantargata stotramuddhrita
    shridurgasahasranamavalih samapta ||
