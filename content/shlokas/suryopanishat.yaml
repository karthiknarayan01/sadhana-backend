id: suryopanishat
category: upanishad
name:
  english: suryopanishat
  devanagari: सूर्योपनिषत्
content:
  english: upanishad suryopanishat atharvavediya samanyopanishat | suditasvatiriktarisurinandatmabhavitam
    | suryanarayanakaram naumi citsuryavaibhavam || om bhadram karnebhih shrunuyama devah | bhadram pashyemakshabhiryajatrah
    | sthirairangaistushtuvamsastanubhirvyashema devahitam yadayuh | svasti na indro vriddhashravah |
    svasti nah pusha vishvavedah | svasti nastarkshyo arishtanemih | svasti no brihaspatirdadhatu || om
    shantih shantih shantih || harih om atha suryatharvangirasam vyakhyasyamah | brahma rishih | gayatri
    chandah | adityo devata | hamsah so'hamagninarayanayuktam bijam | hrillekha shaktih | viyadadisargasamyuktam
    kilakam | caturvidhapurusharthasiddhyarthe viniyogah | shatsvararudhena bijena shadangam raktambujasamsthitam
    | saptashvarathinam hiranyavarnam caturbhujam padmadvayabhayavaradahastam kalacakrapranetaram shrisuryanarayanam
    ya evam veda sa vai brahmanah | om bhurbhuvahsuvah | om tatsaviturvarenyam bhargo devasya dhimahi
    | dhiyo yo nah pracodayat | surya atma jagatastasthushashca | suryadvai khalvimani bhutani jayante
    | suryadyanẏah parjanyo'nnamatma namasta aditya | tvameva pratyaksham karmakartasi | tvameva pratyaksham
    brahmasi | tvameva pratyaksham vishnurasi | tvameva pratyaksham rudro'si | tvameva pratyakshamrigasi
    | tvameva pratyaksham yajurasi | tvameva pratyaksham samasi | tvameva pratyakshamatharvasi | tvameva
    sarvam chando'si | adityadvayurjayate | adityadbhumirjayate | adityadapo jayante | adityajjyotirjayate
    | adityadvyoma disho jayante | adityaddeva jayante | adityadveda jayante | adityo va esha etanmandalam
    tapati | asavadityo brahma | adityo'ntahkaranamanobuddhicittahankarah | adityo vai vyanah samanodano'panah
    pranah | adityo vai shrotratvakcakshurasanaghranah | adityo vai vakpanipadapayupasthah | adityo vai
    shabdasparsharuparasagandhah | adityo vai vacanadanagamanavisarganandah | anandamayo nẏanamayo vinẏananamaya
    adityah | namo mitraya bhanave mrityorma pahi | bhrajishnave vishvahetave namah | suryadbhavanti bhutani
    suryena palitani tu | surye layam prapnuvanti yah suryah so'hameva ca | cakshurno devah savita cakshurna
    uta parvatah | cakshurdhata dadhatu nah | adityaya vidmahe sahasrakiranaya dhimahi | tannah suryah
    pracodayat | savita pashcattatsavita purastatsavitottarattatsavitadharattat | savita nah suvatu sarvatatim
    savita no rasatam dirghamayuh | omityekaksharam brahma | ghriniriti dve akshare | surya ityaksharadvayam
    | aditya iti trinyaksharani | etasyaiva suryasyashtaksharo manuh | yah sadaharaharjapati sa vai brahmano
    bhavati sa vai brahmano bhavati | suryabhimukho japtva mahavyadhibhayatpramucyate | alakshmirnashyati
    | abhakshyabhakshanatputo bhavati | agamyagamanatputo bhavati | patitasambhashanatputo bhavati | asatsambhashanatputo
    bhavati | madhyahne surabhimukhah pathet | sadyotpannapa
  devanagari: उपनिषद् सूर्योपनिषत् अथर्ववेदीय सामान्योपनिषत् । सूदितस्वातिरिक्तारिसूरिनन्दात्मभावितम्
    । सूर्यनारायणाकारं नौमि चित्सूर्यवैभवम् ॥ ॐ भद्रं कर्णेभिः श्रुणुयाम देवाः । भद्रं पश्येमाक्षभिर्यजत्राः
    । स्थिरैरण्गैस्तुष्टुवांसस्तनूभिर्व्यशेम देवहितं यदायुः । स्वस्ति न इन्द्रो वृद्धश्रवाः । स्वस्ति
    नः पूषा विश्ववेदाः । स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः । स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः
    शान्तिः ॥ हरिः ॐ अथ सूर्याथर्वाण्गिरसं व्याख्यास्यामः । ब्रह्मा ऋषिः । गायत्री च्हन्दः । आदित्यो देवता
    । हंसः सोऽहमग्निनारायणयुक्तं बीजम् । हृल्लेखा शक्तिः । वियदादिसर्गसंयुक्तं कीलकम् । चतुर्विधपुरुषार्थसिद्ध्यर्थे
    विनियोगः । षट्स्वरारूढेन बीजेन षडण्गं रक्ताम्बुजसंस्थितम् । सप्ताश्वरथिनं हिरण्यवर्णं चतुर्भुजं पद्मद्वयाभयवरदहस्तं
    कालचक्रप्रणेतारं श्रीसूर्यनारायणं य एवं वेद स वै ब्राह्मणः । ॐ भूर्भुवःसुवः । ॐ तत्सवितुर्वरेण्यं
    भर्गो देवस्य धीमहि । धियो यो नः प्रचोदयात् । सूर्य आत्मा जगतस्तस्थुषश्च । सूर्याद्वै खल्विमानि भूतानि
    जायन्ते । सूर्याद्यङ्य़ः पर्जन्योऽन्नमात्मा नमस्त आदित्य । त्वमेव प्रत्यक्षं कर्मकर्तासि । त्वमेव
    प्रत्यक्षं ब्रह्मासि । त्वमेव प्रत्यक्षं विष्णुरसि । त्वमेव प्रत्यक्षं रुद्रोऽसि । त्वमेव प्रत्यक्षमृगसि
    । त्वमेव प्रत्यक्षं यजुरसि । त्वमेव प्रत्यक्षं सामासि । त्वमेव प्रत्यक्षमथर्वासि । त्वमेव सर्वं च्हन्दोऽसि
    । आदित्याद्वायुर्जायते । आदित्याद्भूमिर्जायते । आदित्यादापो जायन्ते । आदित्याज्ज्योतिर्जायते । आदित्याद्व्योम
    दिशो जायन्ते । आदित्याद्देवा जायन्ते । आदित्याद्वेदा जायन्ते । आदित्यो वा एष एतन्मण्डलं तपति । असावादित्यो
    ब्रह्म । आदित्योऽन्तःकरणमनोबुद्धिचित्ताहण्काराः । आदित्यो वै व्यानः समानोदानोऽपानः प्राणः । आदित्यो
    वै श्रोत्रत्वक्चक्षूरसनघ्राणाः । आदित्यो वै वाक्पाणिपादपायूपस्थाः । आदित्यो वै शब्दस्पर्शरूपरसगन्धाः
    । आदित्यो वै वचनादानागमनविसर्गानन्दाः । आनन्दमयो ङ्य़ानमयो विङ्य़ानानमय आदित्यः । नमो मित्राय भानवे
    मृत्योर्मा पाहि । भ्राजिष्णवे विश्वहेतवे नमः । सूर्याद्भवन्ति भूतानि सूर्येण पालितानि तु । सूर्ये
    लयं प्राप्नुवन्ति यः सूर्यः सोऽहमेव च । चक्षुर्नो देवः सविता चक्षुर्न उत पर्वतः । चक्षुर्धाता दधातु
    नः । आदित्याय विद्महे सहस्रकिरणाय धीमहि । तन्नः सूर्यः प्रचोदयात् । सविता पश्चात्तात्सविता पुरस्तात्सवितोत्तरात्तात्सविताधरात्तात्
    । सविता नः सुवतु सर्वतातिं सविता नो रासतां दीर्घमायुः । ॐइत्येकाक्षरं ब्रह्म । घृणिरिति द्वे अक्षरे
    । सूर्य इत्यक्षरद्वयम् । आदित्य इति त्रीण्यक्षराणि । एतस्यैव सूर्यस्याष्टाक्षरो मनुः । यः सदाहरहर्जपति
    स वै ब्राह्मणो भवति स वै ब्राह्मणो भवति । सूर्याभिमुखो जप्त्वा महाव्याधिभयात्प्रमुच्यते । अलक्ष्मीर्नश्यति
    । अभक्ष्यभक्षणात्पूतो भवति । अगम्यागमनात्पूतो भवति । पतितसम्भाषणात्पूतो भवति । असत्सम्भाषणात्पूतो
    भवति । मध्याह्ने सूराभिमुखः पठेत् । सद्योत्पन्नप
