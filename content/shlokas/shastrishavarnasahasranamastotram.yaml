    shivasamsarasha
  devanagari: शास्त्रकृच्छास्त्रचारणः । शास्त्री शास्त्रप्रतिष्ठाता शास्त्रार्थः शास्त्रपोषकः ॥ ३९॥ शास्त्रहेतुः
    शास्त्रसेतुः शास्त्रकेतुश्च शास्त्रभूः । शास्त्राश्रयः शास्त्रगेयः शास्त्रकारश्च शास्त्रदृक् ॥ ४०॥
    शास्त्राङ्गः शास्त्रपूज्यश्च शास्त्रग्रथनलालसः । शास्त्रप्रसाधकः शास्त्रज्ञेयः शास्त्रार्थपण्डितः
    ॥ ४१॥ शास्त्रपारङ्गतः शास्त्रगुणविच्छास्त्रशोधकः । शास्त्रकृद्वरदाता च शास्त्रसन्दर्भबोधकः ॥ ४२॥ शास्त्रकृत्पूजितः
    शास्त्रकरः शास्त्रपरायणः । शास्त्रानुरक्तः शास्त्रात्मा शास्त्रसन्देहभञ्जकः ॥ ४३॥ शास्त्रनेता शास्त्रपूतः
    शास्त्रयोनिश्च शास्त्रहृत् । शास्त्रलोलः शास्त्रपालः शास्त्रकृत्परिरक्षकः ॥ ४४॥ शास्त्रधर्मः शास्त्रकर्मा
    शास्त्रशीलश्च शास्त्रनुत् । शास्त्रदृष्टिः शास्त्रपुष्टिः शास्त्रतुष्टिश्च शास्त्रचित् ॥ ४५॥ शास्त्रशुद्धिः
    शास्त्रबुद्धिः शास्त्रधीः शास्त्रवर्धनः । शास्त्रप्रज्ञः शास्त्रविज्ञः शास्त्रार्थी शास्त्रमण्डलः
    ॥ ४६॥ शास्त्रस्पृक् शास्त्रनिपुणः शास्त्रसृक् शास्त्रमङ्गलः । शास्त्रधीरः शास्त्रशूरः शास्त्रवीरश्च
    शास्त्रसत् ॥ ४७॥ शास्त्राधिपः शास्त्रदेवः शास्त्रक्रीडोऽथ शास्त्रराट् । शास्त्राढ्यः शास्त्रसारज्ञः
    शास्त्रं शास्त्रप्रदर्शकः ॥ ४८॥ शास्त्रप्रौढः शास्त्ररूढः शास्त्रगूढश्च शास्त्रपः । शास्त्रध्यानः
    शास्त्रगुणः शास्त्रेशानश्च शास्त्रभूः ॥ ४९॥ शास्त्रज्येष्ठः शास्त्रनिष्ठः शास्त्रश्रेष्ठश्च शास्त्ररुक्
    । शास्त्रत्राता शास्त्रभर्ता शास्त्रकर्ता च शास्त्रमुत् ॥ ५०॥ शास्त्रधन्यः शास्त्रपुण्यः शास्त्रगण्यश्च
    शास्त्रधीः । शास्त्रस्फूर्तिः शास्त्रमूर्तिः शास्त्रकीर्तिश्च शास्त्रभृत् ॥ ५१॥ शास्त्रप्रियः शास्त्रजायः
    शास्त्रोपायश्च शास्त्रगीः । शास्त्राधारः शास्त्रचरः शास्त्रसारश्च शास्त्रधुक् ॥ ५२॥ शास्त्रप्राणः
    शास्त्रगणः शास्त्रत्राणश्च शास्त्रभाक् । शास्त्रनाथः शास्त्ररथः शास्त्रसेनश्च शास्त्रदः ॥ ५३॥ शास्त्रस्वामी
    शास्त्रभूमा शास्त्रकामी च शास्त्रभुक् । शास्त्रप्रख्यः शास्त्रमुख्यः शास्त्रविख्योऽथ शास्त्रवान् ॥
    ५४॥ शास्त्रवर्णः शास्त्रपूर्णः शास्त्रकर्णोऽथ शास्त्रपुट् । शास्त्रभोगः शास्त्रयोगः शास्त्रभागश्च
    शास्त्रयुक् ॥ ५५॥ शास्त्रोज्ज्वलः शास्त्रबालः शास्त्रनामा च शास्त्रभुक् । शास्त्रश्रीः शास्त्रसन्तुष्टः
    शास्त्रोक्तः शास्त्रदैवतम् ॥ ५६॥ शास्त्रमौलिः शास्त्रकेलिः शास्त्रपालिश्च शास्त्रमुक् । शास्त्रराज्यः
    शास्त्रभोज्यः शास्त्रेज्यः शास्त्रयाजकः ॥ ५७॥ शास्त्रसौख्यः शास्त्रविभुः शास्त्रप्रेष्ठश्च शास्त्रजुट्
    । शास्त्रवीर्यः शास्त्रकार्यः शास्त्रार्हः शास्त्रतत्परः ॥ ५८॥ शास्तग्राही शास्त्रवहः शास्त्राक्षः
    शास्त्रकारकः । शास्त्रश्रीदः शास्त्रदेहः शास्त्रशेषश्च शास्त्रत्विट् ॥ ५९॥ शास्त्रह्लादी शास्त्रकलः
    शास्त्ररश्मिश्च शास्त्रधीः । शास्त्रसिन्धुः शास्त्रबन्धुः शास्त्रयत्नश्च शास्त्रभित् ॥ ६०॥ शास्त्रप्रदर्शी
    शास्त्रेष्टः शास्त्रभूषश्च शास्त्रगः । शास्त्रसङ्घः शास्त्रसखस्तथा शास्त्रविशारदः ॥ ६१॥ शास्त्रप्रीतः
    शास्त्रहितः शास्त्रपूतोऽथ शास्त्रकृत् । शास्त्रमाली शास्त्रयायी शास्त्रीयः शास्त्रपारदृक् ॥ ६२॥ शास्त्रस्थायी
    शास्त्रचारी शास्त्रगीः शास्त्रचिन्तनः । शास्त्रध्यानः शास्त्रगानः शास्त्राली शास्त्रमानदः ॥ ६३॥ शिक्यपालः
    शिक्यरक्षः शिखण्डी शिखरादरः । शिखरं शिखरीन्द्रस्थः शिखरीव्यूहपालकः ॥ ६४॥ शिखरावासनप्रीतः शिखावलवशादृतः
    । शिखावान्शिखिमित्रश्च शिखीड्यः शिखिलोचनः ॥ ६५॥ शिखायोगरतः शिग्रुप्रीतः शिग्रुजखादनः । शिग्रुजेक्षुरसानन्दः
    शिखिप्रीतिकृतादरः ॥ ६६॥ शितः शितिः शितिकण्ठादरश्च शितिवक्षरुक् । शिञ्जञ्जिकाहेमकान्तिवस्त्रः शिञ्जितमण्डितः
    ॥ ६७॥ शिथिलारिगणः शिञ्जी शिपिविष्टप्रियः शिफी । शिबिप्रियः शिबिनुतः शिबीड्यश्च शिबिस्तुतः ॥ ६८॥ शिबिकष्टहरः
    शिव्याश्रितश्च शिबिकाप्रियः । शिबिरी शिबिरत्राणः शिबिरालयवल्लभः ॥ ६९॥ शिबिवल्लभसत्प्रेमा शिराफलजलादरः
    । शिरजालङ्कृतशिराः शिरस्त्राणविभूषितः ॥ ७०॥ शिरोरत्नप्रतीकाशः शिरोवेष्टनशोभितः । शिलादसंस्तुतः शिल्पी
    शिवदश्च शिवङ्करः ॥ ७१॥ शिवः शिवात्मा शिवभूः शिवकृच्छिवशेखरः । शिवज्ञः शिवकर्मज्ञः शिवधर्मविचारकः ॥
    ७२॥ शिवजन्मा शिवावासः शिवयोगी शिवास्पदः । शिवस्मृतिः शिवधृतिः शिवार्थः शिवमानसः ॥ ७३॥ शिवाढ्यः शिववर्यज्ञः
    शिवार्थः शिवकीर्तनः । शिवेश्वरः शिवाराध्यः शिवाध्यक्षः शिवप्रियः ॥ ७४॥ शिवनाथः शिवस्वामी शिवेशः शिवनायकः
    । शिवमूर्तिः शिवपतिः शिवकीर्तिः शिवादरः ॥ ७५॥ शिवप्राणः शिवत्राणः शिवत्राता शिवाज्ञकः । शिवपश्च शिवक्रीडः
    शिवदेवः शिवाधिपः ॥ ७६॥ शिवज्येष्ठः शिवश्रेष्ठः शिवप्रेष्ठः शिवाधिराट् । शिवराट् शिवगोप्ता च शिवाङ्गः
    शिवदैवतः ॥ ७७॥ शिवबन्धुः शिवसुहृच्छिवाधीशः शिवप्रदः । शिवाग्रणीः शिवेशानः शिवगीतः शिवोच्छ्रयः ॥ ७८॥
    शिवस्फूर्तिः शिवसुतः शिवप्रौढःशिवोद्यतः । शिवसेनः शिवचरः शिवभर्ता शिवप्रभुः ॥ ७९॥ शिवैकराट् शिवप्रज्ञः
    शिवसारः शिवस्पृहः । शिवग्रीवः शिवनामा शिवभूतिः शिवान्तरः ॥ ८०॥ शिवमुख्यः शिवप्रख्यः शिवविख्यः शिवाख्यगः
    । शिवध्याता शिवोद्गाता शिवदाता शिवस्थितिः ॥ ८१॥ शिवानन्दः शिवमतिः शिवार्हः शिवतत्परः । शिवभक्तः शिवासक्तः
    शिवशक्तः शिवात्मकः ॥ ८२॥ शिवदृक् शिवसम्पन्नः शिवहृच्छिवमण्डितः । शिवभाक् शिवसन्धाता शिवश्लाघी शिवोत्सुकः
    ॥ ८३॥ शिवशीलः शिवरसः शिवलोलः शिवोत्कटः । शिवलिङ्गः शिवपदः शिवसन्धः शिवोज्ज्वलः ॥ ८४॥ शिवश्रीदः शिवकलः
    शिवमान्यः शिवप्रदः । शिवव्रतः शिवहितः शिवप्रीतः शिवाशयः ॥ ८५॥ शिवनिष्ठः शिवजपः शिवसंज्ञः शिवोर्जितः
    । शिवमानः शिवस्थानः शिवगानः शिवोपमः ॥ ८६॥ शिवानुरक्तः शिवहृच्छिवहेतुः शिवार्चकः । शिवकेलिः शिववटुः
    शिवचाटुः शिवास्त्रवित् ॥ ८७॥ शिवसङ्गः शिवधरः शिवभावः शिवार्थकृत् । शिवलीलः शिवस्वान्तः शिवेच्छः शिवदायकः
    ॥ ८८॥ शिवशिष्यः शिवोपायः शिवेष्टः शिवभावनः । शिवप्रधीः शिवविभुः शिवाभीष्टः शिवध्वजः ॥ ८९॥ शिववान्
    शिवसम्मोहः शिवर्धिः शिवसम्भ्रमः । शिवश्रीः शिवसङ्कल्पः शिवगात्रः शिवोक्तिदः ॥ ९०॥ शिववेषः शिवोत्कर्षः
    शिवभाषः शिवोत्सुकः । शिवमूलः शिवापालः शिवशूलः शिवाबलः ॥ ९१॥ शिवाचारः शिवाकारः शिवोदारः शिवाकरः । शिवहृष्टः
    शिवोद्दिष्टः शिवतुष्टः शिवेष्टदः ॥ ९२॥ शिवडिम्भः शिवारम्भः शिवोज्जृम्भः शिवाभरः । शिवमायः शिवचयः शिवदायः
    शिवोच्छ्रयः ॥ ९३॥ शिवव्यूहः शिवोत्साहः शिवस्नेहः शिवावहः । शिवलोकः शिवालोकः शिवौकाः शिवसूचकः ॥ ९४॥
    शिवबुद्धिः शिवर्धिश्च शिवसिद्धिः शिवर्धिदः । शिवधीः शिवसंशुद्धिः शिवधीः शिवसिद्धिदः ॥ ९५॥ शिवनामा
    शिवप्रेमा शिवभूः शिववित्तमः । शिवाविष्टः शिवादिष्टः शिवाभीष्टः शिवेष्टकृत् ॥ ९६॥ शिवसेवी शिवकविः शिवख्यातः
    शिवच्छविः । शिवलीनः शिवच्छन्नः शिवध्यानः शिवस्वनः ॥ ९७॥ शिवपालः शिवस्थूलः शिवजालः शिवालयः । शिवावेशः
    शिवोद्देशः शिवादेशः शिवोद्यतः ॥ ९८॥ शिवपक्षः शिवाध्यक्षः शिवरक्षः शिवेक्षणः । शिवपद्यः शिवोद्विद्यः
    शिवहृद्यः शिवाद्यकः ॥ ९९॥ शिवपाद्यः शिवस्वाद्यः शिवार्घ्यः शिवपाद्यकः । शिवार्हः शिवहार्दश्च शिवबिम्बः
    शिवार्भकः ॥ १००॥ शिवमण्डलमध्यस्थः शिवकेलिपरायणः । शिवामित्रप्रमथनः शिवभक्तार्तिनाशनः ॥ १०१॥ शिवभक्तिप्रियरतः
    शिवप्रवणमानसः । शिववाल्लभ्यपुष्टाङ्गः शिवारिहरणोत्सुकः ॥ १०२॥ शिवानुग्रहसन्धाता शिवप्रणयतत्परः । शिवपादाब्जलोलम्बः
    शिवपूजापरायणः ॥ १०३॥ शिवकीर्तनसन्तुष्टः शिवोल्लासक्रियादरः । शिवापदानचतुरः शिवकार्यानुकूलदः ॥ १०४॥
    शिवपुत्रप्रीतिकरः शिवाश्रितगणेष्टदः । शिवमूर्धाभिषिक्ताङ्गः शिवसैन्यपुरःसरः ॥ १०५॥ शिवविश्वाससम्पूर्णः
    शिवप्रमथसुन्दरः । शिवलीलाविनोदज्ञः शिवविष्णुमनोहरः ॥ १०६॥ शिवप्रेमार्द्रदिव्याङ्गः शिववागमृतार्थवित्
    । शिवपूजाग्रगण्यश्च शिवमङ्गलचेष्टितः ॥ १०७॥ शिवदूषकविध्वंसी शिवाज्ञापरिपालकः । शिवसंसारश
