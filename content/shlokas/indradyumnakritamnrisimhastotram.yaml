id: indradyumnakritamnrisimhastotram
category: stotram
name:
  english: indradyumnakritamnrisimhastotram
  devanagari: इन्द्रद्युम्नकृतंनृसिंहस्तोत्रम्
content:
  english: 40|| duhkhadhvamsasyaikahetum na hetum bhettum chettum samshayanagrajatam | jyotirupa jnanarupa
    prakasha stomavyuhakara nirmanaheto || 41|| tvatpadabje bhaktimagryam sada me dehi svaminmulabhutam
    caturnam | shrautaih smartairnityayukta janaste dinastishthantyatra baddha bhavabdhau || 42|| anantapadam
    bahuhastanetramanantakarnam kakubhaughavastram | divanishanathasukundaladhyam nakshatramalakritacaruharam
    || 43|| tvamadbhutam divyanrisimhamurtim bhakteshtapurtim sharanam prapadye | yatpadapadmam hi pitamahasya
    kiritaratnairvikacatvameti || 44|| yadiyapadabjayugantabhumau luthecchiro yasya hi pancabhautam |
    taddivyapadam shirasa vahanti surendranaryah khalu tam namami || 45|| taddivyasimham hatapapasangham
    padashritanam karunabdhisimham | pada'bjasanghattavighattamanabrahmandabhandam pranamami candam ||
    46|| satacchatakampanashiryamanaghanaughavidravitapapasangham | candattahasantaritabdashabdam trilokagarbham
    nriharim namami || 47|| namaste namaste namaste'dya vishno paritrahi dinanukampinnanatham | bhavantam
    samasadya me dehabandho murare na samsarakaragrihe'stu || 48|| hayamedhasahasrante yatha tvam carmacakshusha
    | divyarupam prapashyami tathanukroshaya prabho || 49|| yatha cejyasahasram me nirvighnam tatsamapyate
    | yajnesha tvatprasadanme tatha sannidhyamastu te || 2
  devanagari: ४०॥ दुःखध्वंसस्यैकहेतुं न हेतुं भेत्तुं छेत्तुं संशयानग्रजातम् । ज्योतीरूप ज्ञानरूप प्रकाश
    स्तोमव्यूहाकार निर्माणहेतो ॥ ४१॥ त्वत्पादाब्जे भक्तिमग्र्यां सदा मे देहि स्वामिन्मूलभूतां चतुर्णाम्
    । श्रौतैः स्मार्तैर्नित्ययुक्ता जनास्ते दीनास्तिष्ठन्त्यत्र बद्धा भवाब्धौ ॥ ४२॥ अनन्तपादं बहुहस्तनेत्रमनन्तकर्णं
    ककुभौघवस्त्रम् । दिवानिशानाथसुकुण्डलाढ्यं नक्षत्रमालाकृतचारुहारम् ॥ ४३॥ त्वामद्भुतं दिव्यनृसिंहमूर्तिं
    भक्तेष्टपूर्तिं शरणं प्रपद्ये । यत्पादपद्मं हि पितामहस्य किरीटरत्नैर्विकचत्वमेति ॥ ४४॥ यदीयपादाब्जयुगान्तभूमौ
    लुठेच्छिरो यस्य हि पाञ्चभौतम् । तद्दिव्यपादं शिरसा वहन्ति सुरेन्द्रनार्यः खलु तं नमामि ॥ ४५॥ तद्दिव्यसिंहं
    हतपापसङ्घं पादाश्रितानां करुणाब्धिसिंहम् । पादाऽब्जसङ्घट्टविघट्टमानब्रह्माण्डभाण्डं प्रणमामि चण्डम्
    ॥ ४६॥ सटाच्छटाकम्पनशीर्यमाणघनौघविद्रावितपापसङ्घम् । चण्डाट्टहासान्तरिताब्दशब्दं त्रिलोकगर्भं नृहरिं
    नमामि ॥ ४७॥ नमस्ते नमस्ते नमस्तेऽद्य विष्णो परित्राहि दीनानुकम्पिन्ननाथम् । भवन्तं समासाद्य मे देहबन्धो
    मुरारे न संसारकारागृहेऽस्तु ॥ ४८॥ हयमेधसहस्रान्ते यथा त्वां चर्मचक्षुषा । दिव्यरूपं प्रपश्यामि तथानुक्रोशय
    प्रभो ॥ ४९॥ यथा चेज्यासहस्रं मे निर्विघ्नं तत्समाप्यते । यज्ञेश त्वत्प्रसादान्मे तथा सान्निध्यमस्तु
    ते ॥ २
