id: shivasankalpopanishat-2
category: upanishad
name:
  english: shivasankalpopanishat 2
  devanagari: शिवसन्कल्पोपनिषत् २
content:
  english: yah sarve sarvavedaishca tanme manah shivasankalpamastu || 20|| prayatah pranavonkaram pranavam
    purushottamam | onkaram pranavatmanam tanme manah shivasankalpamastu || 21|| yo'sau sarveshu vedeshu
    pathyate hyaja ishvarah | akayo nirguno hyatma tanme manah shivasankalpamastu || 22|| gobhirjushtam
    dhanena hyayusha ca balena ca | prajaya pashubhih pushkaraksham tanme manah shivasankalpamastu ||
    23|| tryambakam yajamahe sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya ma'mritattanme
    manah shivasankalpamastu || 24|| kailasashikhare ramye shankarasya shivalaye | devatastatra modanti
    tanme manah shivasankalpamastu || 25|| kailasashikharavasa himavadgiri samsthitam | nilakantham trinetram
    ca tanme manah shivasamkalpamastu || 26|| vishvatashcakshuruta vishvatomukho vishvatohasta uta vishvataspat
    | sam bahubhyam namati sampatatrairdyavaprithivi janayan deva ekastanme manah shivasankalpamastu ||
    27|| caturo vedanadhiyita sarvashastramayam viduh | itihasapurananam tanme manah shivasamkalpamastu
    || 28|| ma no mahantamuta ma no arbhakam ma na ukshantamuta ma na ukshitam | mano'vadhih pitaram mota
    mataram priya manastanuvo rudra ririshastanme manah shivasankalpamastu || 29|| manastoke tanaye ma
    na ayushi ma no goshu ma no ashveshu ririshah | viranma no rudra bhamito'vadhirhavishmanto namasa
    vidhemate tanme manah shivasankalpamastu || 30|| rita
  devanagari: यः सर्वे सर्ववेदैश्च तन्मे मनः शिवसङ्कल्पमस्तु ॥ २०॥ प्रयतः प्रणवोङ्कारं प्रणवं पुरुषोत्तमम्
    । ओङ्कारं प्रणवात्मानं तन्मे मनः शिवसङ्कल्पमस्तु ॥ २१॥ योऽसौ सर्वेषु वेदेषु पठ्यते ह्यज ईश्वरः । अकायो
    निर्गुणो ह्यात्मा तन्मे मनः शिवसङ्कल्पमस्तु ॥ २२॥ गोभिर्जुष्टं धनेन ह्यायुषा च बलेन च । प्रजया पशुभिः
    पुष्कराक्षं तन्मे मनः शिवसङ्कल्पमस्तु ॥ २३॥ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् । उर्वारुकमिव
    बन्धनान्मृत्योर्मुक्षीय माऽमृतात्तन्मे मनः शिवसङ्कल्पमस्तु ॥ २४॥ कैलासशिखरे रम्ये शङ्करस्य शिवालये
    । देवतास्तत्र मोदन्ति तन्मे मनः शिवसङ्कल्पमस्तु ॥ २५॥ कैलासशिखरावासा हिमवद्गिरि संस्थितम् । नीलकण्ठं
    त्रिनेत्रं च तन्मे मनः शिवसंकल्पमस्तु ॥ २६॥ विश्वतश्चक्षुरुत विश्वतोमुखो विश्वतोहस्त उत विश्वतस्पात्
    । सं बाहुभ्यां नमति सम्पतत्रैर्द्यावापृथिवी जनयन् देव एकस्तन्मे मनः शिवसङ्कल्पमस्तु ॥ २७॥ चतुरो वेदानधीयीत
    सर्वशास्त्रमयं विदुः । इतिहासपुराणानां तन्मे मनः शिवसंकल्पमस्तु ॥ २८॥ मा नो महान्तमुत मा नो अर्भकं
    मा न उक्षन्तमुत मा न उक्षितम् । मानोऽवधीः पितरं मोत मातरं प्रिया मानस्तनुवो रुद्र रीरिषस्तन्मे मनः
    शिवसङ्कल्पमस्तु ॥ २९॥ मानस्तोके तनये मा न आयुषि मा नो गोषु मा नो अश्वेषु रीरिषः । वीरान्मा नो रुद्र
    भामितोऽवधीर्हविष्मन्तो नमसा विधेमते तन्मे मनः शिवसङ्कल्पमस्तु ॥ ३०॥ ऋत
