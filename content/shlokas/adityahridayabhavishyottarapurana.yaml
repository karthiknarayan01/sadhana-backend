id: adityahridayabhavishyottarapurana
category: hridaya
name:
  english: adityahridayabhavishyottarapurana
  devanagari: आदित्यहृदयभविष्योत्तरपुराण
content:
  english: rinu pandava | giyate nrityate nagna asphotayati dhavati || 92|| shivarutam ca kurute hasate
    krandate punah | evam sampidyate partha yadyapi syanmaheshvarah || 93|| kim punarmanushah kashcicchaucacaravivarjitah
    | piditasya na sandeho jvarau bhavati darunah || 94|| yada canugraham tasya kartumicchecchubhankaram
    | tada salilamadaya japenmantramimam budhah || 95|| namo bhagavate tubhyamadityaya namo namah | jayaya
    jayabhadraya haridashvaya te namah || 96|| snapayettena mantrena shubham bhavati nanyatha | anyatha
    ca bhaveddosho nashyate natra samshayah || 97|| ataste nikhilah proktah pujam caiva nibodha me | upalipte
    shucau deshe niyato vagyatah shucih || 98|| vrittam va caturasram va liptabhumau likhecchaci | tridha
    tatra likhetpadmamashtapatram sakarnikam || 99|| ashtapatramlikhetpadmam liptagomayamandale | purvapatre
    likhet suryamagneyyam tu ravim nyaset || 100|| yamyayam ca vivasvantam nairrityam tu bhagam nyaset
    | praticyam varunam vidyadvayavyam mitrameva ca || 101|| adityamuttare patre ishanyam mitrameva ca
    | madhye tu bhaskaram vidyatkramenaivam samarcayet || 102|| atah parataram nasti siddhikamasya pandava
    | mahatejah samudyatam pranametsa kritanjalih || 103|| sakesarani padmani karavirani carjuna | tilatandgulayuktani
    kushagandhodakani ca || 104|| raktacandanamishrani kritva vai tamrabhajane | dhritva shirasi tatpatram
    janubhyam dharanim sprishet || 105|| mantraputam gudakeshah carghyam dadyadgabhastaye | sayudham saratham
    caiva suryamavahayamyaham || 106|| svagato bhava | supratishthito bhava | sannidhau bhava | sannihito
    bhava | sammukho bhava | iti pancamudrah | sphutayitva'rhayetsuryam bhukti muktim labhennarah || 107||
    om shrim vidya kilikilikatakeshtasarvarthasadhanaya svaha | om shrim hrim hrum hamsah suryaya namah
    svaha | om shrim hram hrim hrum hrah suryamurtaye svaha | om shrim hrim kham khah lokaya suryamurtaye
    svaha | om hrum martandaya svaha | namo'stu suryaya sahasrabhanave namo'stu vaishvanarajatavedase
    | tvameva carghyam pratigrihna deva devadhidevaya namo namaste || 108|| namo bhagavate tubhyam namaste
    jatavedase | dattamarghyam maya bhano tvam grihana namo'stu te || 109|| ehi surya sahasramsho tejorashe
    jagatpate | anukampaya mam deva grihanarghyam namo'stute || 110|| namo bhagavate tubhyam namaste jatavedase
    | mamedamarghyam grihna tvam devadeva namo'stu te || 111|| sarvadevadhidevaya adhivyadhivinashine
    | idam grihana me deva sarvavyadhirvinashyatu || 112|| namah suryaya shantaya sarvarogavinashine |
    mamepsitam phalam dattva prasida parameshvara || 113|| om namo bhagavate suryaya svaha | om shivaya
    svaha | om sarvatmane suryaya namah svaha | om akshayyatejasenamah svaha | sarvasankatadaridryam shatrum
    nashaya nashaya | sarvalokeshu vishvatmansarvatmansarvadarshaka || 114|| namo bhagavate surya kushtharoganvikhandaya
    | ayurarogyamaishvaryam dehi deva namo'stu te || 115|| namo bhagavate tubhyamadityaya namo namah |
    om akshayyatejase namah | om suryaya namah | om vishvamurtaye namah | adityam ca shivam vidyacchivamadityarupinam
    | ubhayorantaram nasti adityasya shivasya ca || 116|| etadicchamyaham shrotum purusho vai divakarah
    | udaye brahmano rupam madhyahne tu maheshvarah || 117|| astamane svayam vishnustrimurtishca divakarah
    | namo bhagavate tubhyam vishnave prabhavishnave || 118|| mamedamarghyam pratigrihna deva devadhidevaya
    namo namaste | shrisuryanarayanaya sangaya saparivaraya idamarghyam samarpayami || 119|| himaghnaya
    tamoghnaya rakshoghnaya ca te namah | kritaghnaya satyaya tasmai suyartmane namah || 120|| jayo'jayashca
    vijayo jitaprano jitashramah | manojavo jitakrodho vajinah sapta kirtitah || 121|| haritahayaratham
    divakaram kanakamayambujarenupinjaram | pratidinamudaye navam sharanamupaimi hiranyaretasam || 122||
    na tam vyalah prabadhante na vyadhibhyobhayam bhavet | na nagebhyo bhayam caiva naca bhutabhayam kvacit
    || 123|| agnishatrubhayam nasti parthivebhyastathaiva ca | durgatim tarate ghoram prajam ca labhate
    pashun || 124|| siddhikamo labhetsiddhim kanyakamastu kanyakam | etatpathetsa kaunteya bhaktiyuktena
    cetasa || 125|| ashvamedhasahasrasya vajapeyashatasya ca | kanyakotisahasrasya dattasya phalamapnuyat
    || 126|| idamadityahridayam yo'dhite satatam narah | sarvapapavishuddhatma suryaloke mahiyate || 127||
    nastyadityasamo devo nastyadityasama gatih | pratyaksho bhagavanvishnuryena vishvam pratishthitam
    || 128|| navatiryojanam laksham sahasrani shatani ca | yavadghatipramanena tavaccarati bhaskarah ||
    129|| gavam shatasahasrasya samyagdattasya yatphalam | tatphalam labhate vidvanshantatma stauti yo
    ravim || 130|| yo'dhite suryahridayam sakalam saphalam bhavet | ashtanam brahmananam ca lekhayitva
    samarpayet || 131|| brahmaloke rishinam ca jayate manusho'pi va | jatismaratvamapnoti shuddhatma natra
    samshayah || 132|| ajaya lokatrayapavanaya bhutatmane gopataye vrishaya | suryaya sarvapralayantakaya
    namo mahakarunikottamaya || 133|| vivasvate jnanamridantaratmane jagatpradipaya gajaddhitaishine |
    svayambhuve diptasahasracakshushe surottamayamitatejase namah || 134|| surairanekaih parishevitaya
    hiranyagarbhaya hiranmayaya | mahatmane mokshapadaya nityam namo'stu te vasarakaranaya || 135|| adityashcarcito
    deva adityah paramam padam | adityo matriko bhutva adityo vanmaya jagat || 136|| adityam pashyate
    bhaktya mam pashyati dhruvam narah | nadityam pashyate bhaktya na sa pashyati mam narah || 137|| trigunam
    ca tritattvam ca trayo devastrayo'gnayah | trayanam ca trimurtistvam turiyastvam namo'stu te || 138||
    namah savitre jagadeka cakshushe jagatprasutisthitinashahetave | trayimayaya trigunatmadharine virincinarayanashankaratmane
    || 139|| yasyodayeneha jagatprabuddhyate pravartate cakhilakarmasiddhaye | brahmendranarayanarudravanditah
    sa nah sada yacchatu mangalam ravih || 140|| namo'stu suryaya sahasrarashmaye sahasrashakhanvitasambhavatmane
    | sahasrayogodbhavabhavabhagine sahasrasankhyayugadharine namah || 141|| yatmandalam ditikaram vishalam
    ratnaprabham tivramanadirupam | daridryaduhkhakshayakaranam ca punatu mam tatsaviturvarenyam || 142||
    yanmandalam devaganaih supujitam vipraih stutambhavanamuktikovidam | tam devadevam pranamami suryam
    punatu mam tatsaviturvarenyam || 143|| yanmandalam jnanaghanam tvagamyam trailokyapujyam trigunatmarupam
    | samastatejomayadivyarupam punatu mam tatsaviturvarenyam || 144|| yanmandalam gudhamatiprabodham
    dharmasya vriddhim kurute jananam | yatsarvapapakshayakaranam ca punatu mam tatsaviturvarenyam ||
    145|| yanmandalam vyadhi vinashadaksham yadrigyajuh samasu sampragitam | prakashitam yena ca bhurbhuvahsvah
    punatu mam tatsavituvarenyam || 146|| yanmandalam vedavido vadanti gayanti yaccarana siddhasanghah
    | yadyogino yogajusham ca sanghah punatu mam tatsaviturvarenyam || 147|| yanmandalam sarvajaneshu
    pujitam jyotishca kuryadiha martyaloke | yatkalakaladimanadirupam punatu mam tatsaviturvarenyam ||
    148|| yanmandalam vishnucaturmukhakhyam yadaksharam papaharam jananam | yatkalakalpakshayakaranam
    ca punatu mam tatsaviturvarenyam || 149|| yanmandalam vishvasrijam prasiddhamutpattirakshampralayapragalbham
    | yasminjagatsamharate'khilam ca punatu mam tatsaviturvarenyam || 150|| yanmandalam sarvagatasya vishnoratma
    param dhama vishuddhatattvam | sukshmantarairyogapathanugamyam punatu mam tatsaviturvarenyam || 151||
    yanmandalam brahmavido vadanti gayanti yaccaranasiddhasanghah | yanmandalam vedavidah smaranti punatu
    mam tatsaviturvarenyam || 152|| yanmandalam vedavidopagitam yadyoginam yogapathatugamyam | tatsarvavedam
    pranamami suryam punatu mam tatsaviturvarenyam || 153|| mandalashtamidam punyam yah pathetsatatam
    narah | sarvapapavishuddhatma suryaloke mahiyate || 154|| dhyeyah sadasavitrimandalamadhyavarti narayanah
    sarasijasana sannivishtah | keyuravanmakarakundalavan kiriti hari hiranmayavapurdhritashankhacakrah
    || 155|| sashankhacakram ravimandale sthitam kusheshayakrantamanantamacyutam | bhajami buddhaya tapaniyamurtim
    surottamam citravibhushanojjvalam || 156|| evam brahmadayo deva rishayashca tapodhanah | kirtayanti
    surashreshtham devam narayanam bibhuva || 157|| vedavedangashariram divyadiptikaram param | rakshoshnam
    raktavarnam ca srishtisamharakarakam || 158|| ekacakro ratho yasya divyah kanakabhushitah | sa me
    bhavatu supritah padmahasto divakarah || 159|| adityah prathamam nama dvitiyam tu divakarah | tritiyam
    bhaskarah proktam caturtham tu prabhakarah || 160|| pancamam tu sahasramshuh shashtham caiva trilocanah
    | saptamam haridashvashca ashtamam tu vibhavasuh || 161|| navamam dinakritproktam dashamam dvadashatmakam
    | ekadasham trayimurtirdvadasham surya eva ca || 162|| dvadashadityanamani pratahkale pathennarah
    | duhsvapnanashanam caiva sarvaduhkham ca nashyati || 163|| dadrukushthaharam caiva daridryam harate
    dhruvam | sarvatirthapradam caiva sarvakamapravardhanam || 164|| yah pathetmatarutthaya bhaktya nityamidam
    narah | saukhyamayustatha''rogyam labhate mokshameva ca || 15|| agnimide namastubhyamishetvorjesvarupine
    | agra ayahi pitastvam namaste jyotisham pate || 166|| shanno devi namastubhyam jagaccakshurnamo'stu
    te | pancamayopavedaya namastubhyam namonamah || 167|| padmasanah padmakarah padmagarbhasamadyutih
    | saptashvarathasamyukto dvibhujah syatsada ravih || 168|| adityasya namaskaram ye kurvanti dinedine
    | janmantarasahasreshu daridryam nopajayate || 169||
  devanagari: ृणु पाण्डव । गीयते नृत्यते नग्न आस्फोटयति धावति ॥ ९२॥ शिवारुतं च कुरुते हसते क्रन्दते पुनः
    । एवं सम्पीड्यते पार्थ यद्यपि स्यान्महेश्वरः ॥ ९३॥ किं पुनर्मानुषः कश्चिच्छौचाचारविवर्जितः । पीडितस्य
    न सन्देहो ज्वरौ भवति दारुणः ॥ ९४॥ यदा चानुग्रहं तस्य कर्तुमिच्छेच्छुभङ्करम् । तदा सलिलमादाय जपेन्मन्त्रमिमं
    बुधः ॥ ९५॥ नमो भगवते तुभ्यमादित्याय नमो नमः । जयाय जयभद्राय हरिदश्वाय ते नमः ॥ ९६॥ स्नापयेत्तेन मन्त्रेण
    शुभं भवति नान्यथा । अन्यथा च भवेद्दोषो नश्यते नात्र संशयः ॥ ९७॥ अतस्ते निखिलः प्रोक्तः पूजां चैव निबोध
    मे । उपलिप्ते शुचौ देशे नियतो वाग्यताः शुचिः ॥ ९८॥ वृत्तं वा चतुरस्रं वा लिप्तभूमौ लिखेच्छचि । त्रिधा
    तत्र लिखेत्पद्ममष्टपत्रं सकर्णिकम् ॥ ९९॥ अष्टपत्रंलिखेत्पद्मं लिप्तगोमयमण्डले । पूर्वपत्रे लिखेत्
    सूर्यमाग्नेय्यां तु रविं न्यसेत् ॥ १००॥ याम्यायां च विवस्वन्तं नैरृत्यां तु भगं न्यसेत् । प्रतीच्यां
    वरुणं विद्याद्वायव्यां मित्रमेव च ॥ १०१॥ आदित्यमुत्तरे पत्रे ईशान्यां मित्रमेव च । मध्ये तु भास्करं
    विद्यात्क्रमेणैवं समर्चयेत् ॥ १०२॥ अतः परतरं नास्ति सिद्धिकामस्य पाण्डव । महातेजः समुद्यतं प्रणमेत्स
    कृताञ्जलिः ॥ १०३॥ सकेसराणि पद्मानि करवीराणि चार्जुन । तिलतन्द्गुलयुक्तानि कुशगन्धोदकानि च ॥ १०४॥ रक्तचन्दनमिश्राणि
    कृत्वा वै ताम्रभाजने । धृत्वा शिरसि तत्पात्रं जानुभ्यां धरणीं स्पृशेत् ॥ १०५॥ मन्त्रपूतं गुडाकेशः
    चार्घ्यं दद्याद्गभस्तये । सायुधं सरथं चैव सूर्यमावाहयाम्यहम् ॥ १०६॥ स्वागतो भव । सुप्रतिष्ठितो भव
    । सन्निधौ भव । सन्निहितो भव । सम्मुखो भव । इति पञ्चमुद्राः । स्फुटयित्वाऽर्हयेत्सूर्यं भुक्ति मुक्तिं
    लभेन्नरः ॥ १०७॥ ॐ श्रीं विद्या किलिकिलिकटकेष्टसर्वार्थसाधनाय स्वाहा । ॐ श्रीं ह्रीं ह्रूं हंसः सूर्याय
    नमः स्वाहा । ॐ श्रीं ह्रां ह्रीं ह्रूं ह्रः सूर्यमूर्तये स्वाहा । ॐ श्रीं ह्रीं खं खः लोकाय सूर्यमूर्तये
    स्वाहा । ॐ ह्रूं मार्तण्डाय स्वाहा । नमोऽस्तु सूर्याय सहस्रभानवे नमोऽस्तु वैश्वानरजातवेदसे । त्वमेव
    चार्घ्यं प्रतिगृह्ण देव देवाधिदेवाय नमो नमस्ते ॥ १०८॥ नमो भगवते तुभ्यं नमस्ते जातवेदसे । दत्तमर्घ्यं
    मया भानो त्वं गृहाण नमोऽस्तु ते ॥ १०९॥ एहि सूर्य सहस्रांशो तेजोराशे जगत्पते । अनुकम्पय मां देव गृहाणार्घ्यं
    नमोऽस्तुते ॥ ११०॥ नमो भगवते तुभ्यं नमस्ते जातवेदसे । ममेदमर्घ्यं गृह्ण त्वं देवदेव नमोऽस्तु ते ॥ १११॥
    सर्वदेवाधिदेवाय आधिव्याधिविनाशिने । इदं गृहाण मे देव सर्वव्याधिर्विनश्यतु ॥ ११२॥ नमः सूर्याय शान्ताय
    सर्वरोगविनाशिने । ममेप्सितं फलं दत्त्वा प्रसीद परमेश्वर ॥ ११३॥ ॐ नमो भगवते सूर्याय स्वाहा । ॐ शिवाय
    स्वाहा । ॐ सर्वात्मने सूर्याय नमः स्वाहा । ॐ अक्षय्यतेजसेनमः स्वाहा । सर्वसङ्कटदारिद्र्यं शत्रुं नाशय
    नाशय । सर्वलोकेषु विश्वात्मन्सर्वात्मन्सर्वदर्शक ॥ ११४॥ नमो भगवते सूर्य कुष्ठरोगान्विखण्डय । आयुरारोग्यमैश्वर्यं
    देहि देव नमोऽस्तु ते ॥ ११५॥ नमो भगवते तुभ्यमादित्याय नमो नमः । ॐ अक्षय्यतेजसे नमः । ॐ सूर्याय नमः
    । ॐ विश्वमूर्तये नमः । आदित्यं च शिवं विद्याच्छिवमादित्यरूपिणम् । उभयोरन्तरं नास्ति आदित्यस्य शिवस्य
    च ॥ ११६॥ एतदिच्छाम्यहं श्रोतुं पुरूषो वै दिवाकरः । उदये ब्राह्मणो रूपं मध्याह्ने तु महेश्वरः ॥ ११७॥
    अस्तमाने स्वयं विष्णुस्त्रिमूर्तिश्च दिवाकरः । नमो भगवते तुभ्यं विष्णवे प्रभविष्णवे ॥ ११८॥ ममेदमर्घ्यं
    प्रतिगृह्ण देव देवाधिदेवाय नमो नमस्ते । श्रीसूर्यनारायणाय साङ्गाय सपरिवाराय इदमर्घ्यं समर्पयामि ॥
    ११९॥ हिमघ्नाय तमोघ्नाय रक्षोघ्नाय च ते नमः । कृतघ्नाय सत्याय तस्मै सूयार्त्मने नमः ॥ १२०॥ जयोऽजयश्च
    विजयो जितप्राणो जितश्रमः । मनोजवो जितक्रोधो वाजिनः सप्त कीर्तिताः ॥ १२१॥ हरितहयरथं दिवाकरं कनकमयाम्बुजरेणुपिञ्जरम्
    । प्रतिदिनमुदये नवं शरणमुपैमि हिरण्यरेतसम् ॥ १२२॥ न तं व्यालाः प्रबाधन्ते न व्याधिभ्योभयं भवेत् ।
    न नागेभ्यो भयं चैव नच भूतभयं क्वचित् ॥ १२३॥ अग्निशत्रुभयं नास्ति पार्थिवेभ्यस्तथैव च । दुर्गतिं तरते
    घोरां प्रजां च लभते पशून् ॥ १२४॥ सिद्धिकामो लभेत्सिद्धिं कन्याकामस्तु कन्यकाम् । एतत्पठेत्स कौन्तेय
    भक्तियुक्तेन चेतसा ॥ १२५॥ अश्वमेधसहस्रस्य वाजपेयशतस्य च । कन्याकोटिसहस्रस्य दत्तस्य फलमाप्नुयात् ॥
    १२६॥ इदमादित्यहृदयं योऽधीते सततं नरः । सर्वपापविशुद्धात्मा सूर्यलोके महीयते ॥ १२७॥ नास्त्यादित्यसमो
    देवो नास्त्यादित्यसमा गतिः । प्रत्यक्षो भगवन्विष्णुर्येन विश्वं प्रतिष्ठितम् ॥ १२८॥ नवतिर्योजनं लक्षं
    सहस्राणि शतानि च । यावद्घटीप्रमाणेन तावच्चरति भास्करः ॥ १२९॥ गवां शतसहस्रस्य सम्यग्दत्तस्य यत्फलम्
    । तत्फलं लभते विद्वाञ्शान्तात्मा स्तौति यो रविम् ॥ १३०॥ योऽधीते सूर्यहृदयं सकलं सफलं भवेत् । अष्टानां
    ब्राह्मणानां च लेखयित्वा समर्पयेत् ॥ १३१॥ ब्रह्मलोके ऋषीणां च जायते मानुषोऽपि वा । जातिस्मरत्वमाप्नोति
    शुद्धात्मा नात्र संशयः ॥ १३२॥ अजाय लोकत्रयपावनाय भूतात्मने गोपतये वृषाय । सूर्याय सर्वप्रलयान्तकाय
    नमो महाकारुणिकोत्तमाय ॥ १३३॥ विवस्वते ज्ञानमृदन्तरात्मने जगत्प्रदीपाय गजद्धितैषिणे । स्वयम्भुवे दीप्तसहस्रचक्षुषे
    सुरोत्तमायामिततेजसे नमः ॥ १३४॥ सुरैरनेकैः परिषेविताय हिरण्यगर्भाय हिरण्मयाय । महात्मने मोक्षपदाय नित्यं
    नमोऽस्तु ते वासरकारणाय ॥ १३५॥ आदित्यश्चार्चितो देव आदित्यः परमं पदम् । आदित्यो मातृको भूत्वा आदित्यो
    वाङ्मय जगत् ॥ १३६॥ आदित्यं पश्यते भक्त्या मां पश्यति ध्रुवं नरः । नादित्यं पश्यते भक्त्या न स पश्यति
    मां नरः ॥ १३७॥ त्रिगुणं च त्रितत्त्वं च त्रयो देवास्त्रयोऽग्नयः । त्रयाणां च त्रिमूर्तिस्त्वं तुरीयस्त्वं
    नमोऽस्तु ते ॥ १३८॥ नमः सवित्रे जगदेक चक्षुषे जगत्प्रसूतिस्थितिनाशहेतवे । त्रयीमयाय त्रिगुणात्मधारिणे
    विरिञ्चिनारायणशङ्करात्मने ॥ १३९॥ यस्योदयेनेह जगत्प्रबुद्ध्यते प्रवर्तते चाखिलकर्मसिद्धये । ब्रह्मेन्द्रनारायणरुद्रवन्दितः
    स नः सदा यच्छतु मङ्गलं रविः ॥ १४०॥ नमोऽस्तु सूर्याय सहस्ररश्मये सहस्रशाखान्वितसम्भवात्मने । सहस्रयोगोद्भवभावभागिने
    सहस्रसङ्ख्यायुगधारिणे नमः ॥ १४१॥ यत्मण्डलं दीतिकरं विशालं रत्नप्रभं तीव्रमनादिरूपम् । दारिद्र्यदुःखक्षयकारणं
    च पुनातु मां तत्सवितुर्वरेण्यम् ॥ १४२॥ यन्मण्डलं देवगणैः सुपूजितं विप्रैः स्तुतम्भावनमुक्तिकोविदम्
    । तं देवदेवं प्रणमामि सूर्यं पुनातु मां तत्सवितुर्वरेण्यम् ॥ १४३॥ यन्मण्डलं ज्ञानघनं त्वगम्यं त्रैलोक्यपूज्यं
    त्रिगुणात्मरूपम् । समस्ततेजोमयदिव्यरूपं पुनातु मां तत्सवितुर्वरेण्यम् ॥ १४४॥ यन्मण्डलं गूढमतिप्रबोधं
    धर्मस्य वृद्धिं कुरुते जनानाम् । यत्सर्वपापक्षयकारणं च पुनातु मां तत्सवितुर्वरेण्यम् ॥ १४५॥ यन्मण्डलं
    व्याधि विनाशदक्षं यदृग्यजुः सामसु सम्प्रगीतम् । प्रकाशितं येन च भूर्भुवःस्वः पुनातु मां तत्सवितुवरेण्यम्
    ॥ १४६॥ यन्मण्डलं वेदविदो वदन्ति गायन्ति यच्चारण सिद्धसङ्घाः । यद्योगिनो योगजुषां च सङ्घाः पुनातु मां
    तत्सवितुर्वरेण्यम् ॥ १४७॥ यन्मण्डलं सर्वजनेषु पूजितं ज्योतिश्च कुर्यादिह मर्त्यलोके । यत्कालकालादिमनादिरूपं
    पुनातु मां तत्सवितुर्वरेण्यम् ॥ १४८॥ यन्मण्डलं विष्णुचतुर्मुखाख्यं यदक्षरं पापहारं जनानाम् । यत्कालकल्पक्षयकारणं
    च पुनातु मां तत्सवितुर्वरेण्यम् ॥ १४९॥ यन्मण्डलं विश्वसृजां प्रसिद्धमुत्पत्तिरक्षाम्प्रलयप्रगल्भम्
    । यस्मिञ्जगत्संहरतेऽखिलं च पुनातु मां तत्सवितुर्वरेण्यम् ॥ १५०॥ यन्मण्डलं सर्वगतस्य विष्णोरात्मा परं
    धाम विशुद्धतत्त्वम् । सूक्ष्मान्तरैर्योगपथानुगम्यं पुनातु मां तत्सवितुर्वरेण्यम् ॥ १५१॥ यन्मण्डलं
    ब्रह्मविदो वदन्ति गायन्ति यच्चारणसिद्धसङ्घाः । यन्मण्डलं वेदविदः स्मरन्ति पुनातु मां तत्सवितुर्वरेण्यम्
    ॥ १५२॥ यन्मण्डलं वेदविदोपगीतं यद्योगिनां योगपथातुगम्यम् । तत्सर्ववेदं प्रणमामि सूर्यं पुनातु मां तत्सवितुर्वरेण्यम्
    ॥ १५३॥ मण्डलाष्टमिदं पुण्यं यः पठेत्सततं नरः । सर्वपापविशुद्धात्मा सूर्यलोके महीयते ॥ १५४॥ ध्येयः
    सदासवितृमण्डलमध्यवर्ती नारायणः सरसिजासन सन्निविष्टः । केयूरवान्मकरकुण्डलवान् किरीटी हारी हिरण्मयवपुर्धृतशङ्खचक्रः
    ॥ १५५॥ सशङ्खचक्रं रविमण्डले स्थितं कुशेशयाक्रान्तमनन्तमच्युतम् । भजामि बुद्धया तपनीयमूर्तिं सुरोत्तमं
    चित्रविभूषणोज्ज्वलम् ॥ १५६॥ एवं ब्रह्मादयो देवा ऋषयश्च तपोधनाः । कीर्तयन्ति सुरश्रेष्ठं देवं नारायणं
    बिभुव ॥ १५७॥ वेदवेदाङ्गशरीरं दिव्यदीप्तिकरं परम् । रक्षोश्नं रक्तवर्णं च सृष्टिसंहारकारकम् ॥ १५८॥
    एकचक्रो रथो यस्य दिव्यः कनकभूषितः । स मे भवतु सुप्रीतः पद्महस्तो दिवाकरः ॥ १५९॥ आदित्यः प्रथमं नाम
    द्वितीयं तु दिवाकरः । तृतीयं भास्करः प्रोक्तं चतुर्थं तु प्रभाकरः ॥ १६०॥ पञ्चमं तु सहस्रांशुः षष्ठं
    चैव त्रिलोचनः । सप्तमं हरिदश्वश्च अष्टमं तु विभावसुः ॥ १६१॥ नवमं दिनकृत्प्रोक्तं दशमं द्वादशात्मकम्
    । एकादशं त्रयीमुर्तिर्द्वादशं सूर्य एव च ॥ १६२॥ द्वादशादित्यनामानि प्रातःकाले पठेन्नरः । दुःस्वप्ननाशनं
    चैव सर्वदुःखं च नश्यति ॥ १६३॥ दद्रुकुष्ठहरं चैव दारिद्र्यं हरते ध्रुवम् । सर्वतीर्थप्रदं चैव सर्वकामप्रवर्धनम्
    ॥ १६४॥ यः पठेत्मातरुत्थाय भक्त्या नित्यमिदं नरः । सौख्यमायुस्तथाऽऽरोग्यं लभते मोक्षमेव च ॥ १५॥ अग्निमीडे
    नमस्तुभ्यमिषेत्वोर्जेस्वरूपिणे । अग्र आयाहि पीतस्त्वं नमस्ते ज्योतिषां पते ॥ १६६॥ शन्नो देवि नमस्तुभ्यं
    जगच्चक्षुर्नमोऽस्तु ते । पञ्चमायोपवेदाय नमस्तुभ्यं नमोनमः ॥ १६७॥ पद्मासनः पद्मकरः पद्मगर्भसमद्युतिः
    । सप्ताश्वरथसंयुक्तो द्विभुजः स्यात्सदा रविः ॥ १६८॥ आदित्यस्य नमस्कारं ये कुर्वन्ति दिनेदिने । जन्मान्तरसहस्रेषु
    दारिद्र्यं नोपजायते ॥ १६९॥
