id: ekashlokirama-2
category: stotram
name:
  english: ekashlokirama 2
  devanagari: एकश्लोकिराम २
content:
  english: ekashloki ramayanam 2 ramadau jananam kumaragamanam yajnapratipalanam shapaduddharanam dhanurvidalanam
    sitanganodvahanam | lankaya dahanam samudrataranam saumitrisammohanam rakshah samharanam svarajyabhavanam
    caitaddhi ramayanam || iti ekashloki ramayanam
  devanagari: एकश्लोकि रामायणम् २ रामादौ जननं कुमारगमनं यज्ञप्रतीपालनं शापादुद्धरणं धनुर्विदलनं सीताङ्गनोद्वाहनम्
    । लङ्काया दहनं समुद्रतरणं सौमित्रिसम्मोहनं रक्षः संहरणं स्वराज्यभवनं चैतद्धि रामायणम् ॥ इति एकश्लोकि
    रामायणं
meaning: {}
