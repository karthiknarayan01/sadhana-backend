id: veda-svasti-vachanam
category: stotram
name:
  english: Veda Svasti Vachanam
content:
  english: shri krishna yajurveda samhitantargatiya svastivacanam ashu shshishano vrishabho na yuddhmo
    ghanaghanah shaninam | sankrandano thsakamindrah || sankrandanena nimishena jishnuna yutkarena dushcyavanena
    dhrishnuna | tadindrena jayata ta yu~dho nara ishuhastena vrishna ssa nishangibhirvashi sagg srashta
    sa yudha indro ganena | sagmsrishtaji thsomapa bahushardhyu rdhvadhanva pratihitabhirasta || brihaspate
    pari diya rathena rakshoha 'mitragm apa badhamanah | prabhanjan pramrino yudha jayannasmaka meddhyavita
    rathanam || gotrabhida njayantamajma pramrinanta mojasa | imagm sajata anuvira yaddhvamindragm sakhayo
    'nu sagm rabhaddhvam || balavijnayah vaji sahamana ugrah | abhiviro abhisatva sahoja jaitramindra
    rathamatishtha govit || abhi gotrani sahasa gahamano shshatamanyurindrah | shshatamanyurindrah | dushcyavanah
    pritanashada yuddhyo smakagm sena avatu pra yuthsu || indra asam neta brihaspati rdakshina yajnah
    pura etu somah | devasenana mmaruto yantvagre || indrasya vrishno varunasya rajna adityana mmarutagm
    shardha ugram | mahamanasa njayata mudasthat || asmaka ssamriteshu dhvajeshvasmakam ya~ ishavasta
    jayantu | vi~ra uttare bhavantvasmanu deva avata haveshu || uddhar mmahagmsi | udvritrahan vajinam
    njayatametu ghoshah || upa preta jayata narassthira vah santu bahavah | indro va dhrishya yathasatha
    || avasrishta para pata sharavye brahma sagmshita | gaccha nkancanocchishah || marmani te varmabhishchadayami
    somastva raja 'mritenabhi vastam | urorvariyo varivaste astu jayanta ntvamanu madantu devah || yatra
    bana ssampatanti kumara vishikha iva | indro nastatra vritraha vishvaha sharma yacchatu || || jimutasyeva
    bhavati pratikam ya~dvarmi yati samadamupasthe | anaviddhaya tanuva jaya tvagm sa tva varmano mahima
    pipartu || dhanvana ga dhanvana njayema dhanvana tivra ssamado jayema | dhanu nkrinoti dhanvana sarvah
    pradisho jayema || vakshyantiveda ganiganti karna mparishasvajana | yosheva shinkte vitata njya iyagm
    samane parayanti || te acaranti samaneva yosha mateva putra | apa shatrun viddhyatagm sam vi~dane
    artni ime vishphuranti amitran || bahvina mpita bahurasya putrashcishca krinoti samana ssankah pritanashca
    sarvah prishthe ninaddho jayati prasutah || rathe tishtha nnayati vajinah puro yatrayatra kamayate
    susharathih | abhishuna mpanayata manah pashcadanu yacchanti rashmayah || tivra n krinvate vrishapanayo
    ssaha vajayantah | avakramantah prapadairamitra n kshinanti shatrugmranapavyayantah || rathavahanagm
    havirasya nama yatra nnihitamasya varma | tatra rathamupa shagmagm sadema vishvaha vayagm sumanasyamanah
    || svadushagm sadah pitaro vayodhah kricchreshrita shshaktivanto gabhirah | citrasena ishubala amriddhra
    vratasahah || brahmanasah shshive no dyavaprithivi anehasa | pusha nah patu duritadritavridho raksha
    makirno aghashagmsa ishata || suparnam va~ste mrigo asya danto gobhi ssannaddha patati prasuta | yatra
    nara nca vi ca dravanti tatrasmabhyamishava shsharma yagmsann || rijite pari vringdhi no 'shma bhavatu
    nastanuh | somo adhi bravitu no shsharma yacchatu || a janghanti sanvesha njaghanagm upa jighnate
    | ashvajani pracetaso thsamathsu codaya || ahiriva bhogaih paryeti bahu mparibadhamanah | hastaghno
    vishva vayunani vidva mpari patu vishvatah || vanaspate vidvango hi bhuya asma ssannaddho asi vidayasva
    ''sthata te jayatu jetvani || divah prithivyah pa va~naspatibhyah paryabhritagm sahah | apamojmana
    mpari gobhiravritamindrasya vajragm havisha ratham ya~ja || indrasya vajro marutamanika mmitrasya
    garbho varunasya nabhih | sema njushano deva ratha prati havya gribhaya || upa shvasaya prithivimuta
    dya mpurutra te manutam njagat | sa dundubhe sajurindrena devairdura ddaviyo apasedha shatrun || a
    krandaya balamojo na a dha nishtanihi durita badhamanah | apa protha dundubhe ducchunagm ita indrasya
    mushtirasi vidayasva || a 'muraja pratyavartayemah ketuma ddundubhi rvavaditi | samashvaparnashcaranti
    no naro 'smakamindra rathino jayantu || gne varco vihaveshvastu vaya ntvendhana stanuva mpradishashcatasra
    stvaya 'ddhyakshena pritana jayema || mama deva vihave santu sarva indravanto maruto vishnuragnih
    | mamantariksha muru gopamastu mahyam nkame asminn || mayi deva dravina mayajanta mmayya shirastu
    mayi devahutih | daivya hotara vanishanta ssyama tanuva suvirah ya~jantu mama yani havya ssatya manaso
    me astu | eno maniga vi~shve devaso adhivoca ta me || devi shshadurvirurunah krinota vishve deva sa
    iha virayaddhvam | maha smahi prajaya ma tanubhirma radhama dvishate soma rajann || agnirmanyu dadabdho
    gopah paripahi nastvam | pratyanco yantu nigutah punaste 'maisha mprabudha vineshat || dhata dhatrina
    mbhuvanasya yaspati rdevagm savitaramabhi matishaha ya~jna mashvinobha brihaspati rdevah pa nnyarthat
    || uruvyaca no mahisha shsharma yagm sadasmin have puruhutah purukshu | sa nah prajayai haryashva
    mridayendra ma no ririsho ma para dah | no ririsho ma para dah || ye nah sapatna apate bhavantvindra
    gnibhyamava badhamahe tan | vasavo rudra aditya upari sprisha ncettaramadhi rajamakrann || arvanca
    mindramamuto havamahe yo goji jidyah | imanno yajnam vi~have jushasvasya kurmo harivo medina || agnermanve
    prathamasya pracetaso ya vi~shi pravivishivagm samimahe sa no muncatvagm hasah || yasyeda dyadejati
    yasya jata nca kevalam | staumyagni nnathito johavimi sa no muncatvagm hasah || indrasya manye prathamasya
    pracetaso vritraghna sstoma upa mamupaguh | yo dashushah sukrito havamupa ganta sa no muncatvagm hasah
    | sa no muncatvagm hasah || ya va~shi yudhe yah pushtani sagmsrijati trayani | staumindra nnathito
    johavimi sa no muncatvagm hasah || manve va mmitra varuna tasya vittagm satyaujasa drigmhana ya |
    ya rajanagm saratham ya~tha ugra ta no muncatamagasah || yo vagm ratha rijurashmi ssatyadharma mithu
    shcaranta mupayati dushayann | staumi mitravaruna nathito johavimi tau no muncatamagasah || vayo ssavitu
    rvidathani manmahe yava dbibhrito yau ca rakshatah | yau vishvasya paribhu babhuvatustau no muncatamagasah
    || upa shreshthana ashisho devayordharme asthirann | staumi vayugm savitara nnathito johavimi tau
    no muncatamagasah || rathitamau rathinamahva utaye shubha ngamishthau suyamebhirashvaih mojastau no
    muncatamagasah || yadayatam stricakrena sagm sadamicchamanau | staumi deva vashvinau nathito johavimi
    tau no muncatamagasah || maruta mmanve adhino bruvantu premam vi~shva mavantu vishve huve suyamanutaye
    te no muncantvenasah || tigmamayudham pritanasu jishnu | staumi deva nmaruto nathito johavimi te no
    muncantvenasah || devana mmanve adhi no bruvantu premam vi~shvamavantu vishve huve suyamanutaye te
    no muncantvenasah || yadida 'bhishocati paurusheyena daivyena | staumi vishva nnathito johavimi te
    no muncantvenasah || anuno nvidanumate tvam ~vai shvanaro na utyaprishto divi mamitebhi rojobhi rye
    pratishthe abhavatam va~sunam | staumi dyava prithivi nathito johavimi te no muncatamagm hasah ||
    urvi rodasi varivah krinota nkshetrasya patni adhi no bruyatam | staumi dyava prithivi nathito johavimi
    te no muncatamagm hasah || ya mpurushatra yavishtha vidvagmsashcakrima kaccana ''gah | kridhi svasmagm
    aditeranaga vyenagmsi shishratho vishvagagne || yatha ha ta tpadishita mamuncata yajatrah | eva tvamasma
    tpramunca vyagmhah prata ryagne prataranna ayuh ||
  devanagari: श्री कृष्ण यजुर्वेद संहितान्तर्गतीय स्वस्तिवाचनम् आ॒शु श्शिशा॑नो वृष॒भो न यु॒द्ध्मो घ॑नाघ॒नः
    षणी॒नाम् । स॒ङ्क्रन्द॑नो थ्सा॒कमिन्द्रः॑ ॥ स॒ङ्क्रन्द॑नेना निमि॒षेण॑ जि॒ष्णुना॑ युत्का॒रेण॑ दुश्च्यव॒नेन॑
    धृ॒ष्णुना । तदिन्द्रे॑ण जयत॒ त युँधो॑ नर॒ इषु॑हस्तेन॒ वृष्णा स्स नि॑ष॒ङ्गिभि॑र्व॒शी सग्ग् स्र॑ष्टा॒
    स युध॒ इन्द्रो॑ ग॒णेन॑ । स॒ग्ं॒सृ॒ष्ट॒जि थ्सो॑म॒पा बा॑हुश॒र्ध्यू र्ध्वध॑न्वा॒ प्रति॑हिताभि॒रस्ता ॥
    बृह॑स्पते॒ परि॑ दीया॒ रथे॑न रक्षो॒हा ऽमित्राग्ं॑ अप॒ बाध॑मानः । प्र॒भ॒ञ्जन् प्रमृ॒णो यु॒धा जय॑न्न॒स्माक॑
    मेद्ध्यवि॒ता रथा॑नाम् ॥ गो॒त्र॒भिद॑ ञ्जय॑न्त॒मज्म॑ प्रमृ॒णन्त॒ मोज॑सा । इ॒मग्ं स॑जाता॒ अनु॑वीर यद्ध्व॒मिन्द्रग्ं॑
    सखा॒यो ऽनु॒ सग्ं र॑भद्ध्वम् ॥ ब॒ल॒वि॒ज्ञा॒यः वा॒जी सह॑मान उ॒ग्रः । अ॒भिवी॑रो अ॒भिस॑त्वा सहो॒जा जैत्र॑मिन्द्र॒
    रथ॒माति॑ष्ठ गो॒वित् ॥ अ॒भि गो॒त्राणि॒ सह॑सा॒ गाह॑मानो श्श॒तम॑न्यु॒रिन्द्रः॑ । श्श॒तम॑न्यु॒रिन्द्रः॑
    । दु॒श्च्य॒व॒नः पृ॑तना॒षाड॑ यु॒द्ध्यो स्माक॒ग्ं॒ सेना॑ अवतु॒ प्र यु॒थ्सु ॥ इन्द्र॑ आसां ने॒ता बृह॒स्पति॒
    र्दक्षि॑णा य॒ज्ञः पु॒र ए॑तु॒ सोमः॑ । दे॒व॒से॒नाना॑ म्म॒रुतो॑ य॒न्त्वग्रे ॥ इन्द्र॑स्य॒ वृष्णो॒ वरु॑णस्य॒
    राज्ञ॑ आदि॒त्याना म्म॒रुता॒ग्ं॒ शर्ध॑ उ॒ग्रम् । म॒हाम॑नसा ञ्जय॑ता॒ मुद॑स्थात् ॥ अ॒स्माक॒ स्समृ॑तेषु
    ध्व॒जेष्व॒स्माकं॒ याँ इष॑व॒स्ता ज॑यन्तु । वीँ॒रा उत्त॑रे भवन्त्व॒स्मानु॑ देवा अवता॒ हवे॑षु ॥ उद्ध॑र्
    म्महाग्ं॑सि । उद्वृ॑त्रहन् वा॒जिनां॒ ञ्जय॑तामेतु॒ घोषः॑ ॥ उप॒ प्रेत॒ जय॑ता नरस्स्थि॒रा वः॑ सन्तु बा॒हवः॑
    । इन्द्रो॑ व॒ धृ॒ष्या यथास॑थ ॥ अव॑सृष्टा॒ परा॑ पत॒ शर॑व्ये॒ ब्रह्म॑ सग्ंशिता । गच्छा॒ ङ्कञ्च॒नोच्छि॑षः
    ॥ मर्मा॑णि ते॒ वर्म॑भिश्छादयामि॒ सोम॑स्त्वा॒ राजा॒ ऽमृते॑ना॒भि व॑स्ताम् । उ॒रोर्वरी॑यो॒ वरि॑वस्ते
    अस्तु॒ जय॑न्त॒ न्त्वामनु॑ मदन्तु दे॒वाः ॥ यत्र॑ बा॒णा स्स॒म्पत॑न्ति कुमा॒रा वि॑शि॒खा इ॑व । इन्द्रो॑
    न॒स्तत्र॑ वृत्र॒हा वि॑श्वा॒हा शर्म॑ यच्छतु ॥ ॥ जी॒मूत॑स्येव भवति॒ प्रती॑कं॒ यँद्व॒र्मी याति॑ स॒मदा॑मु॒पस्थे
    । अना॑विद्धया त॒नुवा॑ जय॒ त्वग्ं स त्वा॒ वर्म॑णो महि॒मा पि॑पर्तु ॥ धन्व॑ना॒ गा धन्व॑ना॒ ञ्ज॑येम॒ धन्व॑ना
    ती॒व्रा स्स॒मदो॑ जयेम । धनु॒ ङ्कृ॑णोति॒ धन्व॑ना॒ सर्वाः प्र॒दिशो॑ जयेम ॥ व॒क्ष्यन्ती॒वेदा ग॑नीगन्ति॒
    कर्ण॑ म्परिषस्वजा॒ना । योषे॑व शिङ्क्ते॒ वित॒ता ञ्ज्या इ॒यग्ं सम॑ने पा॒रय॑न्ती ॥ ते आ॒चर॑न्ती॒ सम॑नेव॒
    योषा॑ मा॒तेव॑ पु॒त्र । अप॒ शत्रून्॑ विद्ध्यताग्ं सं विँदा॒ने आर्त्नी॑ इ॒मे वि॑ष्फु॒रन्ती॑ अ॒मित्रान्॑
    ॥ ब॒ह्वी॒ना म्पि॒ता ब॒हुर॑स्य पु॒त्रश्चि॒श्चा कृ॑णोति॒ सम॑ना स्सङ्काः॒ पृत॑नाश्च॒ सर्वाः पृ॒ष्ठे निन॑द्धो
    जयति॒ प्रसू॑तः ॥ रथे॒ तिष्ठ॑ न्नयति वा॒जिनः॑ पु॒रो यत्र॑यत्र का॒मय॑ते सुषार॒थिः । अ॒भीशू॑ना म्पनायत॒
    मनः॑ प॒श्चादनु॑ यच्छन्ति र॒श्मयः॑ ॥ ती॒व्रा न् कृण्वते॒ वृष॑पाण॒यो स्स॒ह वा॒जय॑न्तः । अ॒व॒क्राम॑न्तः॒
    प्रप॑दैर॒मित्रा न् क्षि॒णन्ति॒ शत्रू॒ग्ं॒रन॑पव्ययन्तः ॥ र॒थ॒वाह॑नग्ं ह॒विर॑स्य॒ नाम॒ यत्रा न्निहि॑तमस्य॒
    वर्म॑ । तत्रा॒ रथ॒मुप॑ श॒ग्मग्ं स॑देम वि॒श्वाहा॑ व॒यग्ं सु॑मन॒स्यमा॑नाः ॥ स्वा॒दु॒ष॒ग्ं॒ सदः॑ पि॒तरो॑
    वयो॒धाः कृ॑च्छ्रे॒श्रित॒ श्शक्ती॑वन्तो गभी॒राः । चि॒त्रसे॑ना॒ इषु॑बला॒ अमृ॑द्ध्रा व्रातसा॒हाः ॥ ब्राह्म॑णासः॒
    श्शि॒वे नो॒ द्यावा॑पृथि॒वी अ॑ने॒हसा । पू॒षा नः॑ पातु दुरि॒तादृ॑तावृधो॒ रक्षा॒ माकि॑र्नो अ॒घशग्ं॑स
    ईशत ॥ सु॒प॒र्णं वँ॑स्ते मृ॒गो अ॑स्या॒ दन्तो॒ गोभि॒ स्सन्न॑द्धा पतति॒ प्रसू॑ता । यत्रा॒ नर॒ ञ्च॒ वि
    च॒ द्रव॑न्ति॒ तत्रा॒स्मभ्य॒मिष॑व॒ श्शर्म॑ यग्ंसन्न् ॥ ऋजी॑ते॒ परि॑ वृङ्ग्धि॒ नो ऽश्मा॑ भवतु नस्त॒नूः
    । सोमो॒ अधि॑ ब्रवीतु॒ नो श्शर्म॑ यच्छतु ॥ आ ज॑ङ्घन्ति॒ सान्वे॑षा ञ्ज॒घना॒ग्ं॒ उप॑ जिघ्नते । अश्वा॑जनि॒
    प्रचे॑त॒सो थ्स॒मथ्सु॑ चोदय ॥ अहि॑रिव भो॒गैः पर्ये॑ति बा॒हु म्प॑रि॒बाध॑मानः । ह॒स्त॒घ्नो विश्वा॑ व॒युना॑नि
    वि॒द्वा म्परि॑ पातु वि॒श्वतः॑ ॥ वन॑स्पते वी॒ड्व॑ङ्गो॒ हि भू॒या अ॒स्म स्सन्न॑द्धो असि वी॒डय॑स्वा ऽऽस्था॒ता
    ते॑ जयतु॒ जेत्वा॑नि ॥ दि॒वः पृ॑थि॒व्याः प वँन॒स्पति॑भ्यः॒ पर्याभृ॑त॒ग्ं॒ सहः॑ । अ॒पामो॒ज्मान॒ म्परि॒
    गोभि॒रावृ॑त॒मिन्द्र॑स्य॒ वज्रग्ं॑ ह॒विषा॒ रथं॑ यँज ॥ इन्द्र॑स्य॒ वज्रो॑ म॒रुता॒मनी॑क म्मि॒त्रस्य॒
    गर्भो॒ वरु॑णस्य॒ नाभिः॑ । सेमा ञ्जुषा॒णो देव॑ रथ॒ प्रति॑ ह॒व्या गृ॑भाय ॥ उप॑ श्वासय पृथि॒वीमु॒त द्या
    म्पु॑रु॒त्रा ते॑ मनुतां॒ ञ्जग॑त् । स दु॑न्दुभे स॒जूरिन्द्रे॑ण दे॒वैर्दू॒रा द्दवी॑यो॒ अप॑सेध॒ शत्रून्॑
    ॥ आ क्र॑न्दय॒ बल॒मोजो॑ न॒ आ धा॒ निष्ट॑निहि दुरि॒ता बाध॑मानः । अप॑ प्रोथ दुन्दुभे दु॒च्छुनाग्ं॑ इ॒त
    इन्द्र॑स्य मु॒ष्टिर॑सि वी॒डय॑स्व ॥ आ ऽमूर॑ज प्र॒त्याव॑र्तये॒माः के॑तु॒म द्दु॑न्दु॒भि र्वा॑वदीति ।
