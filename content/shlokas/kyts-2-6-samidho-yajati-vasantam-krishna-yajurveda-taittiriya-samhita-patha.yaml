id: kyts-2-6-samidho-yajati-vasantam-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 2.6 Samidho Yajati Vasantam - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ndvitiyakande shashthah prashnah avashishtakarmabhidhanam
    o shri gurubhyo namah | harih om || samidho yajati vasantamevartunamava rundhe tanunapatam ya~jati
    grishmamevava rundha ido yajati varsha evava rundhe barhiryajati sharadamevava rundhe svahakaram ya~jati
    hemantamevava rundhe tasma 'va sidanti samidho yajatyushasa eva devatanamava rundhe tanunapatam ya~jati
    yajnamevava rundha ido yajati pashunevava rundhe bar hiryajati prajamevava rundhe samanayata upabhritastejo
    va ajya mpraja barhih prajasveva tejo dadhati svahakaram ya~jati vacamevava rundhe dasha sa vi~radvirajai
    vannadyamava rundhe samidho yajatyasminneva loke pratitishthati tanunapatam yajna evantarikshe prati
    tishthatido yajati pashushveva pratitishthati barahiryajati ya eva devayanah panthanasteshveva pratitishthati
    svahakaram ya~jati suvarga eva loke prati tishthatyetavanto vai devalokasteshveva yathapurva mpratitishthati
    devasura eshu lokeshvaspardhanta te devah prayajairebhyo lokebhyo 'sura vi~dushah prayaja ijyante
    praibhyo lokebhyo bhratrivyannudate 'bhikrama njuhotyabhijityai yo vai prayajana ve~da pra prajaya
    pashubhi rmithunai rjayate samidho bahviriva yajati tanunapatamekamiva mithuna ntadido bahviriva yajati
    barhirekamiva mithuna ntadetadvai prayajana prajaya pashubhi rmithunai rjayate devanam va~ anishta
    devata asannathasura yajnamajighagm sa nte deva gayatrim npancaksharani pracinani trini praticinani
    tato varma yajnayabhavadvarma yajamanaya ya tprayajanuyaja ijyante varmaiva tadyajnaya kriyate varma
    yajamanaya bhratrivyabhibhutyai tasma shiyah pashcaddhrasiyo deva vai pura raksho iti svahakarena
    prayajeshu yajnagm saggsthapyamapashya svahakarena prayajeshu samasthapayan vi va eta thsvahakarena
    prayajeshu sagg sthapayanti prayajanishtva havig shyabhi gharayati yajnasya santatya atho havirevakaratho
    yathapurvamupaiti pita vai prayajah praja tprayajanishtva havig shyabhigharayati pitaiva ta kurute
    tasmadahu nkurute tasmadahu ve~da yashca na katha putrasya kevala mpiturityaskannameva tadya tprayajeshvishteshu
    skandati gayatryeva tena garbha yajamanaya prajanayati || yajati yajnamevava rundhe prayajana tta
    mevam cakshushi va ete yajnasya yadajyabhagau yadajyabhagau yajati cakshushi eva ta dyajnasya prati
    dadhati purvardhe juhoti tasma tpurvardhe cakshushi prabahug tprabahukcakshushi devalokam va~ agnina
    yajamano 'nu pashyati pitrilokagm somenottarardhe 'gnaye juhoti dakshinardhe somayaivamiva himau lokavanayo
    rlokayoranukhyatyai rajanau va etau devatanam ~yadagnishomavantara devata ijyete devatanam drajna
    manushya vidhrita brahmavadino vadanti ki dyajne yajamanah kurute yenanyatodatashca pashu manucya
    ''jyabhagasya jushanena yajati tenanyatodato dadhararcamanucya havisha rica yajati tenobhayatodato
    dadhara murdhanvati puro 'nuvakya bhavati murdhanamevainagm samanana niyutvatya yajati bhratrivyasyaiva
    pashu nni yuvate keshinagmha darbhya nkeshi satyakamiruvaca saptapada nte shakvarig shvo yajne prayoktase
    yasyai viryena pra jata nbhratrivyannudate prati janishyamanan yasyai viryenobhayo rlokayo rjyoti
    rdhatte yasyai viryena purvardhenanadva nbhunakti jaghanardhena dhenuriti purasta 'nuvakya bhavati
    jataneva bhratrivya npranudata uparishtallakshma yajya janishyamananeva pratinudate purasta 'nuvakya
    bhavatyasminneva loke jyotirdhatta uparishtallakshma yajya 'mushminneva loke jyotirdhatte jyotishmantavasma
    imau lokau bhavato ya evam 'nuvakya bhavati tasma tpurvardhenanadva nbhunaktyuparishtallakshma yajya
    tasma jjaghanardhena dhenurya evam ve~da bhunkta enametau vajra ajyam vajro vashatkarastrivritameva
    vajragm sambhritya bhratrivyaya pra haratyacchambatkara mapagurya vashatkaroti strityai gayatri puro
    'nuvakya bhavati trishtug yajya brahmanneva kshatramanvara dbrahmano mukhyo mukhyo bhavati ya evam
    'nuvakyaya ''ha pranayati yajyaya gamayati vashatkarenaivaina 'nuvakyaya datte prayacchati yajyaya
    prati vashatkarena sthapayati tripada puro 'nuvakya bhavati traya ime loka eshveva lokeshu pratitishthati
    catushpada yajya catushpada eva pashunava rundhe dvyaksharo vashatkaro dvipa dyajamanah pashushvevoparishta
    tpratitishthati gayatri puro 'nuvakya bhavati trishtug yajyaisha vai saptapada shakvari yadva etaya
    deva ashiksha ve~da shaknotyeva yacchikshati || prajapati rdevebhyo yajnan vyadisha thsa atmannajyamadhatta
    ta ndeva abruvannesha vava yajno yadajyamapyeva no dyajan va ajyabhagavupa strinanabhi gharayaniti
    tasma jyabhagavupa strinantyabhi gharayanti brahmavadino vadanti kasma dyatayamanyanyani havig majyamiti
    prajapatya miti bruyadayatayama hi devana mprajapatiriti chandagmsi devebhyo va~kshyama iti tebhya
    eta 'nuvakyayai yajyayai devatayai vashatkaraya yaccaturavatta njuhoti chandagsyeva ta tprinati tanyasya
    pritani devebhyo havyam va~hantyangiraso va ita uttama ntadrishayo yajnavastvabhyavaya yajnavastvabhyavaya
    ntamabruvannindraya dhriyasva brihaspataye dhriyasva vishve dhriyasveti sa naddhriyata tamabruvannagnaye
    cyuto bhavati suvargasya lokasyabhijityai tamabruvan katha stha ityanupakto 'bhuvamityabravi dupanakti
    suvargasya lokasya samash tyai sarvani kapala nyabhi prathayati tavatah purodashanamushmin ~loke 'bhi
    jayati yo vidagdha ssa sadevastasmadavidahata shritakrintyah sadevatvaya bhasmana nmagm senasthi channam
    ve~denabhi vasayati tasma ya~cchritagm haviranabhigharita dvasayati devatraivaina nnashyedeko masah
    sam ssyadatha yajamanah pramiyeta ya va~thsarasyanavetau syatamatha yajamanah pramiyeta sankhyayo
    dvasayati yajamanasya gopithaya yadi nashyedashvina mekakapalamashvinau vai devana mbhishajau tabhyamevasmai
    bheshaja nkaroti dyavaprithivya ekakapalo bhavatyanayorva etannashyati yannashya dvindati pratishthityai
    || vedenabhi vasayati tasma devasya tva savituh prasava iti sphyama datte prasu rbahubhyamityaha shvinau
    hi devanamaddhvaryu asta bhyamityaha yatyai shatabhrishtirasi vanaspatyo dvishato vadha ityaha vajrameva
    ta shyati bhratrivyaya praharishyan haratyetavati vai prithivi yavati vedistasya etavata eva bhratrivya
    nnirbhajanti trir harati traya ime loka ebhya evainam lo~kebhyo nirbhajati tushni ncaturthagm haratyaparimitadevaina
    nnirbhajatyuddhanti yadevasya ameddhya ntadapa hantyuddhanti tasmadoshadhayah para bhavanti mula nchinatti
    bhratrivyasyaiva mula nchinatti pitridevatya yajnamukhena sammitama yajnamukhena sammitama pratishthayai
    khanati yajamanameva pratishtha ngamayati dakshinato var nkaroti devayajanasyaiva rupamakah purishavati
    nkaroti prajavai pashavah purisha mpashubhih purishavanta mpari grihnatyetavati vai prithivi yavati
    vedistasya etavata eva bhratrivya mparigrihnati kruramiva va nkaroti dha asi svadha asiti yoyupyate
    shantyai prokshanira sadayatyapo vai rakshoghni rakshasamapahatyai sphyasyavartman thsadayati yajnasya
    santatyaiya ndhyayecchucaivainamarpayati || brahmavadino vadantyadbhir havigmshi praukshih kenapa
    iti brahmaneti bruyadadbhir hyeva havigmshi prokshati brahmana 'pa iddhmabarhih prokshati meddhyamevaina
    mprokshatyriksha va sha 'ntarikshaya tva prithivyai tveti bar kshatyebhya evainallokebhyah prokshati
    kruramiva va eta tkhanatyapo ninayati shantyai purasta ngrihnati mukhyamevaina ngrihnati prajapatina
    yajnamukhena sammita sstrinati praja vai barhih prithivi vedih praja eva prithivya mpratishthapayatyanatidrishnagg
    strinati prajayaivaina mbarhishah prastaragm sadayati praja vai barhi ryajamanah prastaroyajamana
    'ntardadhati vyavrittya anakti havishkritamevainagm suvargam 'nakti traya ime loka ebhya evainam 'nakti
    na prati shrinatiya ya~jamanasya syadupariva pra hara tyupariva hi suvargo loko niyacchati vrishtimevasmai
    niyacchati natyagra mpra haredyadatyagra tyasarinyaddhvaryo rnashuka syanna purasta mpraharati yajamanameva
    suvargam ngamayati na vishvancam stryasya jayetordhva thstryasya jayetordhva tyurdhvamiva hi pugmsah
    pumanevasya jayate ya thsphyena vopaveshena va yoyupyeta stritirevasya sa hastena yoyupyate yajamanasya
    gopithaya brahmavadino vadanti kim ya~jnasya yajamana iti prastara iti tasya kva suvargo loka ityahavaniya
    iti bruyadya tprastaramahavaniye praharati yajamanameva yo~yupyante barhiranu praharati shantya anarambhana
    iva va etar shvaro vepano bhavitordhruva 'sitimamabhi mrishatiyam 'syameva pratitishthati na vepano
    bhavatyaga nagnidityaha yadbruyada ngamayenni ryajamanagm suvargalloka dbhajedagannityeva bruya dyajamanameva
    suvargam agnestrayo jyayagmso bhratara asa nte devebhyo havyam va~hantah pramiyanta so 'rishyatiti
    sa nilayata so ndevatah praishamaiccha mmathsyah prabravi ttamashapaddhiyadhiya tva vaddhyasuryo ma
    pravoca iti tasmanmathsya ndhiyadhiya ghnanti shapto ntama bruvannupa na a vartasva havya vri~nai
    yadeva grihitasyahutasyabahih paridhi skanda mbhagadheyamasaditi tasmadya dgrihitasyahutasya bahih
    paridhi skandati tesha ntaneva tena prinati paridhi npari dadhati rakshasamapahatyai sagg mananvavacaraya
    na purasta tpari dadhatyadityo hyevodya drakshagsyapahantyurdhve samidhava dadhatyuparishtadeva rakshagsyapa
    hanti yajusha mmithunatvaya dve a dadhati dvipa dyajamanah pratishthityai brahmavadino vadanti sa
    tvai yajeta yo yajnasya thsyaditi bhupataye svaha bhuvanapataye svaha bhutana mpataye svaheti skannamanu
    mantrayeta yajnasyaiva tadartya yajamano vasiya nbhavati bhuyasirhi devatah prinati jami va eta dyajnasya
    kriyate yadanvancau purodasha vupagmshuyajamantara yajatyajamitvayatho mithunatvayagniramushmin ~loka
    asi nte deva abruvannetemau vi paryuhametyannadyena deva agni mupamantrayanta rajyena pitaro yama
    ntasmadagni rdevanamannado yamah pitrinagm raja ya evam ve~da prarajyamannadya mapnoti tasma eta 'vadyanti
    yadagnaye svishtakrite 'vadyati bhagadheyenaiva ta drudragm samardhayati sakri thsakridava dyati sakridiva
    hi rudra uttarardhadava dyatyesha vai rudrasya svayameva dishi rudra nniravadayate dvirabhi gharayati
    caturavattasya ''ptyaipashavo vai purva ahutaya esha rudro yadagnirya tpurva ahutirabhi juhuya drudraya
    pashunapi dadhyadapashuryajamana ssyadatihaya purva ahutirjuhoti pashuna manuh prithivya yajniyamaiccha
    'pi kartoriti tavabruta mmitravarunau goreva ssva iti tau tato gagm samairayatagm sa yatra yatra nyakrama
    ttato ghritamapidyata tasma dghritapadyucyate tadasyai janmopahutagm rathantaragm saha prithivyetyahe
    saha prithivyetyaha vai~ rathantaramimameva sahanna dyenopa hvayata upahutam va~madevyagm sahantarikshenetyaha
    pashavo vai vamadevya mpashuneva sahantarikshenopa hvayata upahuta thsaha divetyahairam vai~ brihadirameva
    saha divopa hvayata upahuta ssapta hotra ityaha hotra evopa hvayata upahuta dhenu shabhetyaha mithunamevopa
    hvayata upahuto bhaksha ssakhetyaha somapithamevopa hvayata upahuta~ ''tmanamevopa hvayata atma hyupahutanam
    va~sishtha idamupa hvayate pashavo va ida pashunevopa hvayate caturupa hvayate catushpado hi pashavo
    manavityaha manur dghritapadityaha ya devasyai pada dyata tasmadevamaha maitravarunityaha mitravarunau
    hyenagm samairayata mupahutamityaha brahmaivopa hvayate daivya addhvaryava upahuta upahuta manushya
    ityaha devamanushyanevopa hvayate ya imam ya~jnamavan ye yajnapatim yajnaya caiva yajamanaya ca ''shishama
    sha sta upahute dyavaprithivi ityaha dyavaprithivi evopa hvayate purvaje ritavari ityaha purvaje hyete
    ritavari devi devaputre ityaha devi hyete devaputre upahuto 'yam ~yajamana ityaha yajamanamevopa hvayata
    uttarasya ndevayajyayamupahuto bhuyasi havishkarana upahuto divye dhamannupahuta ityaha praja va uttara
    devayajya pashavo bhuyo havishkaranagm suvargo loko divya sidamasityeva yajnasya priya ndhamopa hvayate
    vishvamasya priya chambatkaramevopa hvayate || svayama datte kamameva ''tmana pashunama datte na hyanyah
    kama mprayacchati vacaspataye tva huta 'shnamityaha vacameva bhagadheyena prinati sadasaspataye tva
    huta 'shnamityaha svagakrityai caturavatta mbhavati havirvai caturavatta drudraya pashunapi daddhyadapashuryajamana
    dvacaspataye tva huta 'shnamityaha parokshamevaina jjuhoti sadasaspataye tva huta mprashnamityaha
    svagakrityai prashnanti tirtha eva prashnanti dakshina ndadati tirtha eva dakshina ndadati vi va etadyajna
    chindanti yanmaddhyatah nchindanti yanmaddhyatah prashnantyadbhi rjayanta apo vai sarva devata devatabhireva
    yajnagm sa ntanvanti deva vai yajna drudramantarayan ndeva abhi samagacchanta kalpata mbhavishyati
    yadimagm radhayishyama iti ta thsvishtakritah svishtakrittva dyajnasya yadupa ca striniyadabhi ca
    gharayedubhayata shvayi kuryadavadayabhi gharayati dvi ssampadyate dvipa dyajamanah pratishthityai
    ya ya~jnasyabhi viddhyedagrena pari harati tirthenaiva pari harati ta tpushne paryaharanta tpusha
    prashya dato tpusha prapishtabhago ndeva abruvan vi va ayama rdhyaprashitriyo va ayamabhuditi ta dbrihaspataye
    paryaharan thsuryasya tva cakshusha prati pashyamityabravinna hi suryasya cakshuh mma higmsishyatiti
    devasya tva savituh prasave mprati grihnamityabravi thsavitriprasuta evainadbrahmana devatabhih pratyagrihna
    mma higmsishyatityagnestva ''syena pra 'shnamityabravinna hyagnerasya nkincana hinasti so higmsishyatiti
    brahmanasyodarenetya bravinna hi bra ncana hinasti brihaspaterbrahmaneti sa hi brahmishtho tpranah
    kramanti yah prashitra rjayitva pranan vai~ prana amritamapah prananeva yathasthanamupa hvayate ||
    nkincana hinasti so ccatushcatvarigmshacca nprinati samidhama dadhatyuttarasa mpratishthitya atho
    samidvatyeva juhoti paridhin shti paraniva hyetar ssampadyate catushpadah pashavah pashunevava rundhe
    brahma syama ityahatra va etar yatra brahma yatraiva yajna shshritastata evainama rabhate yaddhastena
    pramive ttushnimasita 'sampratto yajna tpratishthetyeva bruya shshrito yatraiva yajna shshritastata
    evainagm sa mpra yacchati deva savitareta tyai brihaspati rbrahmetyaha sa hi brahmishtha mpahi sa
    yajnapati mpahityaha yajnaya yajamanaya ''tmane tebhya eva yajeti brahmavadino vadantishta devata
    atha katama ete deva iti chandagmsiti bruya mityatho khalvahurbrahmana vai chandagmsiti taneva ta
    va~ ishta devata asannathagnirnodajvala thsamindha etadurvai nama hi yajnasya ''shishamavrinkta ya
    u dyavaprithivi bhadra du dyavaprithivi bhadra ndyavaprithivi bhadramabhudityeva bruya dyajamanameva
    yajnasya ngamayatyardhma suktavakamuta namovakami thsmeti vavaitadahopashrito divah prithivyorityaha
    dyavaprithivyor hi yajna upashrita omanvati te yajne yajamana dyavaprithivi stamityaha ''shishamevaitama
    sha thsupavasana ca svaddhyavasana ceti pramayuko yajamana ssyadyada hi pramiyate 'themamupavasyati
    supacarana ca svadhicarana cetyeva bruya dvariyasimevasmai gavyutima sha ste na pramayuko bhavati
    tayoravidyagniridagm havirajushatetyaha ya aya devatasta ariradhameti vavaitadaha yanna nirdishe ya~jnasya
    ''shirgaccheda sha 'savityaha nirdishyaivainagm suvargam ste suprajastvama sha sta ityaha 'shishamevai
    tama sha ste sajatavanasyama sha sta ityaha prana vai sajatah prananeva nantareti tadagnirdevo devebhyo
    vanate vayamagnermanusha ityahagnirdevebhyo vanute vaya bhya iti vavaitadaheha gatirvamasyeda nca
    namo devebhya ityaha yashcaiva devata yajati yashca na tabhya evobhayi bhyo namaskarotyatmano deva
    vai yajnasya svagakartara haspatyamabruvannima svaga kurviti so 'shraddadhano yajatai sa me yajnasya
    ''shirasaditi tasma 'shraddadhano yajate sham ya~jnasya ''shirgacchatyeta 'paguratai shatena yatayadyo
    nihana thsahasrena yatayadyo lohita nkaravadyavatah praskadya pagmsun nna prajanaditi tasma dbrahmanaya
    napa gureta na ni hanyanna lohita nkuryadetavata hainasa bhavati taccham yo~ra vrinimaha ityaha yajnameva
    ta thsvaga karoti tat yo~ra vrinimaha ityaha sham mbhagadheyena samardhayati gatum ya~jnapataya ityaha
    ''shishamevai tama sha ddadhati tvashtaram ya~jati reta eva hita ntvashta rupani vi karoti devana
    ryajati mithunatvayagni ya~jati pratishthityai jami va eta dyajnasya kriyate yadajyena prayaja ijyanta
    ajyena patnisam ya~ja ricamanucya patnisam ya~janamrica yajatyajamitvayatho mithunatvaya pankti prayano
    vai yajnah panktyudayanah panca prayaja ijyante catvarah patnisam ssamishtayajuh pancama mpanktimevanu
    prayanti panktimanudyanti || yukshvahi devahutamagm ashvagm agne rathiriva | ni hota purvya ssadah
    || uta no deva devagm accha voco vidushtarah | shradvishva varya kridhi || tvagm ha yadyavishthya
    sahasa ssunavahuta | ritava yajniyo bhuvah || ayamagni ssahasrino vajasya shatinaspatih | murdha kavi
    rayinam || ta nnemimribhavo yatha ''namasva sahutibhih | nediyo yajna mangirah || tasmai nu namabhidyave
    vaca virupa nityaya | vrishne codasva sushtutim || kamu shvidasya senaya 'gnerapakacakshasah | pani
    ngoshu staramahe || ma no devanam vi~shah prasnatirivosrah | krisha nna hasuraghniyah || ma nah samasya
    dudhyah paridveshaso agm hatih | urmirna navama vadhit || namaste agna ojase grinanti deva krishtayah
    | amai ramitramardaya || kuvith ve~shisho rayim | urukriduru naskridhi || ma no asmi nmahadhane para
    vargbharabhridyatha | sam va~rgagm sagm rayi njaya || anyamasmadbhiya iyamagne sishaktu ducchuna |
    vardha no amavacchavah || yasyajushannamasvina shshamimadurmakhasyava | ta 'vati || parasya adhi 'varagm
    abhya tara | yatrahamasmi tagm ava || vidma hi te pura vayamagne pituryathavasah | adha te sumnamimahe
    || ya ugra iva sharyaha tigmashringo na vagmsagah | agne puro rurojitha || sakhaya ya~ncamishagg stoma
    shishthaya kshitinamurjo naptre sahasvate || sagm samidyuvase vrishanna nyarya a | idaspade samidhyase
    sa no vasunya bhara | prajapate nnekanna vigmshatishca ushantastva havamaha ushanta ssamidhimahi |
    ushannushata a vaha pitrin havishe attave || tvagm soma pracikito manisha tvagm rajishthamanu neshi
    pantha m | tava praniti pitaro na indo deveshu ratnama bhajanta dhirah || tvaya hi nah pitarah soma
    purve karmani cakruh pavamana dhirah | vanvannavatah paridhigm rapo nah || tvagm soma pitribhih sam
    'nu dyavaprithivi a tatantha | tasmai ta indo havisha vidhema vayagg syama patayo rayinam || agnishvattah
    pitara eha gacchata sadah sada ssadata supranitayah | atta havigmshi prayatani barhishyatha rayigm
    sarvavira hishadah pitara utyarvagima vo havya cakrima jushaddhva thsuvidatragm avithsi napata | barhishado
    ye svadhaya sutasya bhajanta pitvasta iha '' gamishthah || upahutah pitarah somyaso bar hishyeshu
    nidhishu priyeshu | ta a gamantu ta iha shruvantvadhi bruvantu te avantvasman || udiratamavara u tparasa
    unmaddhyamah pitarah somyasah | asum ~ya iyura vrika ritajnaste no 'vantu pitaro haveshu || ida mpitribhyo
    namo astvadya ye purvaso ya uparasa iyuh | ye parthive rajasya nishatta ye va nunagm suvrijanasu vikshu
    || adha yatha nah pitarah parasah pratnaso agna ritamashushanah | shucidaya ndidhiti mukthashasah
    kshama bhindanto arunirapa vrann || yadagne kavyavahana pitrin yakshyritavridhah | pra ca havyani
    vakshyasi devebhyashca pitribhya a || tvamagna idito jatavedo ddhavyani surabhini kritva | pradah
    pitribhyah svadhaya te akshannaddhi tva ndeva prayata havigmshi || matali kavyairyamo angirobhi rbrihaspatir
    rikvabhi rvavridhanah | yag shca deva vavridhurye ca devan ya~ma prastaramahi sidangirobhih pitribhih
