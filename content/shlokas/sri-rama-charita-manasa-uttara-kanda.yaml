    आपु गे अरु घालहिं आनहिम् ॥ करहिं मोह बस द्रोह परावा। सन्त सङ्ग हरि कथा न भावा ॥ अवगुन सिन्धु मन्दमति
    कामी। बेद बिदूषक परधन स्वामी ॥ बिप्र द्रोह पर द्रोह बिसेषा। दम्भ कपट जियँ धरें सुबेषा ॥ दो ऐसे अधम
