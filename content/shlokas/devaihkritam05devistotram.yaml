id: devaihkritam05devistotram
category: stotram
name:
  english: devaihkritam05devistotram
  devanagari: देवैःकृतं०५देवीस्तोत्रम्
content:
  english: devaih kritam 5 devistotram deva ucuh | namaste devadeveshi namaste kancanaprabhe | namaste
    padmapatrakshi namaste jagadambike || 31|| namaste vishvarupe ca namaste vishvasamstute | tvam matistvam
    dhritih kantistvam sudha tvam vibhavari || 32|| kshama riddhih prabha svaha savitri kamala sati |
    tvam gauri tvam mahamaya camunda tvam sarasvati || 33|| bhairavi bhishanakara candamundasidharini
    | bhutapriya mahakaya ghatali vikramotkata || 34|| madyamamsapriya nityam bhaktatranaparayana | tvaya
    vyaptamidam sarvam trailokyam sacaracaram || 35|| iti shriskandapurane prabhasakhande arbudakhande
    shattrimshadhyayantargatam devaih kritam devistotram samaptam | skandapurana | prabhasakhanda | arbudakhanda
    | adhyaya 36
  devanagari: देवैः कृतं ५ देवीस्तोत्रम् देवा ऊचुः । नमस्ते देवदेवेशि नमस्ते काञ्चनप्रभे । नमस्ते पद्मपत्राक्षि
    नमस्ते जगदम्बिके ॥ ३१॥ नमस्ते विश्वरूपे च नमस्ते विश्वसंस्तुते । त्वं मतिस्त्वं धृतिः कान्तिस्त्वं
    सुधा त्वं विभावरी ॥ ३२॥ क्षमा ऋद्धिः प्रभा स्वाहा सावित्री कमला सती । त्वं गौरी त्वं महामाया चामुण्डा
    त्वं सरस्वती ॥ ३३॥ भैरवी भीषणाकारा चण्डमुण्डासिधारिणी । भूतप्रिया महाकाया घटाली विक्रमोत्कटा ॥ ३४॥
    मद्यमांसप्रिया नित्यं भक्तत्राणपरायणा । त्वया व्याप्तमिदं सर्वं त्रैलोक्यं सचराचरम् ॥ ३५॥ इति श्रीस्कन्दपुराणे
    प्रभासखण्डे अर्बुदखण्डे षट्त्रिंशाध्यायान्तर्गतं देवैः कृतं देवीस्तोत्रं समाप्तम् । स्कन्दपुराण ।
    प्रभासखण्ड । अर्बुदखण्ड । अध्याय ३६
