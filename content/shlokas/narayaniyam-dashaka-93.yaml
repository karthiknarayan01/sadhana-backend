id: narayaniyam-dashaka-93
category: stotram
name:
  english: Narayaniyam Dashaka 93
content:
  english: bandhusneham vijahyam tava hi karunaya tvayyupaveshitatma sarvam tyaktva careyam sakalamapi
    jagadvikshya mayavilasam | nanatvadbhrantijanyat sati khalu gunadoshavabodhe vidhirva vyasedho va
    katham tau tvayi nihitamatervitavaishamyabuddheh || || kshuttrishnalopamatre satatakritadhiyo jantavah
    santyananta stebhyo vijnanavattvat purusha iha varastajjanirdurlabhaiva | tatrapyatmatmanah syatsuhridapi
    ca ripuryastvayi nyastaceta stapocchitterupayam smarati sa hi suhrit svatmavairi tato'nyah || || tvatkarunye
    pravritte ka iva nahi gururlokavritte'pi bhuman sarvakrantapi bhumirnahi calati tatassatkshamam shikshayeyam
    | grihniyamisha tattadvishayaparicaye'pyaprasaktim samirat vyaptatvancatmano me gaganaguruvashadbhatu
    nirlepata ca || svacchah syam pavano'ham madhura udakavadvahnivanma sma grihnam sarvannino'pi dosham
    tarushu tamiva mam sarvabhuteshvaveyam | pushtirnashtih kalanam shashina iva tanornatmano'stiti vidyam
    toyadivyastamartandavadapi ca tanushvekatam tvatprasadat || || snehadvyadhattaputrapranayamritakapotayito
    ma sma bhuvam praptam prashnan saheya kshudhamapi shayuvat sindhuvatsyamagadhah | ma paptam yoshidadau
    shikhini shalabhavat bhringavatsarabhagi bhuyasam kintu tadvaddhanacayanavashanmahamisha pranesham
    || || ma baddhyasam tarunya gaja iva vashaya narjayeyam dhanaugham hartanyastam hi madhvihara iva
    mrigavanma muham gramyagitaih | natyasajjeya bhojye jhasha iva balishe pingalavannirashah supyam bhartavyayogat
    kurara iva vibho samisho'nyairna hanyai || || varteya tyaktamanah sukhamatishishuvannissahayashcareyam
    kanyaya ekashesho valaya iva vibho varjitanyonyaghoshah | tvaccitto navabudhyai paramishukridiva kshmabhridayanaghosham
    geheshvanyapraniteshvahiriva nivasanyundurormandireshu || || tvayyeva tvatkritam tvam kshapayasi jagadityurnanabhat
    pratiyam tvaccinta tvatsvarupam kuruta iti dridham shikshaye peshakarat | vidbhasmatma ca deho bhavati
    guruvaro yo vivekam viraktim dhatte sancintyamano mama tu bahurujapidito'yam visheshat || || hi hi
    me dehamoham tyaja pavanapuradhisha yatpremaheto rgehe vitte kalatradishu ca vivashitastvatpadam vismaranti
    | so'yam vahneshshuno va paramiha paratah sampratancakshikarna tvagjihvadya vikarshantyavashamata
    itah ko'pi na tvatpadabje || || durvaro dehamoho yadi punaradhuna tarhi nishshesharogan hritva bhaktim
    dradhishtham kuru tava padapankeruhe pankajaksha | nunam nanabhavante samadhigatamamum muktidam vipradeham
    kshudre ha hanta ma ma kshipa vishayarase pahi mam marutesha ||
  devanagari: बन्धुस्नेहं विजह्यां तव हि करुणया त्वय्युपावेशितात्मा सर्वं त्यक्त्वा चरेयं सकलमपि जगद्वीक्ष्य
    मायाविलासम् । नानात्वाद्भ्रान्तिजन्यात् सति खलु गुणदोषावबोधे विधिर्वा व्यासेधो वा कथं तौ त्वयि निहितमतेर्वीतवैषम्यबुद्धेः
    ॥ ॥ क्षुत्तृष्णालोपमात्रे सततकृतधियो जन्तवः सन्त्यनन्ता स्तेभ्यो विज्ञानवत्त्वात् पुरुष इह वरस्तज्जनिर्दुर्लभैव
    । तत्राप्यात्मात्मनः स्यात्सुहृदपि च रिपुर्यस्त्वयि न्यस्तचेता स्तापोच्छित्तेरुपायं स्मरति स हि सुहृत्
    स्वात्मवैरी ततोऽन्यः ॥ ॥ त्वत्कारुण्ये प्रवृत्ते क इव नहि गुरुर्लोकवृत्तेऽपि भूमन् सर्वाक्रान्तापि
    भूमिर्नहि चलति ततस्सत्क्षमां शिक्षयेयम् । गृह्णीयामीश तत्तद्विषयपरिचयेऽप्यप्रसक्तिं समीरात् व्याप्तत्वञ्चात्मनो
    मे गगनगुरुवशाद्भातु निर्लेपता च ॥ स्वच्छः स्यां पावनोऽहं मधुर उदकवद्वह्निवन्मा स्म गृह्णां सर्वान्नीनोऽपि
    दोषं तरुषु तमिव मां सर्वभूतेष्ववेयाम् । पुष्टिर्नष्टिः कलानां शशिन इव तनोर्नात्मनोऽस्तीति विद्यां
    तोयादिव्यस्तमार्ताण्डवदपि च तनुष्वेकतां त्वत्प्रसादात् ॥ ॥ स्नेहाद्व्याधात्तपुत्रप्रणयमृतकपोतायितो
    मा स्म भूवं प्राप्तं प्राश्नन् सहेय क्षुधमपि शयुवत् सिन्धुवत्स्यामगाधः । मा पप्तं योषिदादौ शिखिनि
    शलभवत् भृङ्गवत्सारभागी भूयासं किन्तु तद्वद्धनचयनवशान्माहमीश प्रणेशम् ॥ ॥ मा बद्ध्यासं तरुण्या गज इव
    वशया नार्जयेयं धनौघं हर्तान्यस्तं हि माध्वीहर इव मृगवन्मा मुहं ग्राम्यगीतैः । नात्यासज्जेय भोज्ये
    झष इव बलिशे पिङ्गलावन्निराशः सुप्यां भर्तव्ययोगात् कुरर इव विभो सामिषोऽन्यैर्न हन्यै ॥ ॥ वर्तेय त्यक्तमानः
    सुखमतिशिशुवन्निस्सहायश्चरेयं कन्याया एकशेषो वलय इव विभो वर्जितान्योन्यघोषः । त्वच्चित्तो नावबुध्यै
    परमिषुकृदिव क्ष्माभृदायानघोषं गेहेष्वन्यप्रणीतेष्वहिरिव निवसान्युन्दुरोर्मन्दिरेषु ॥ ॥ त्वय्येव त्वत्कृतं
    त्वं क्षपयसि जगदित्यूर्णनाभात् प्रतीयां त्वच्चिन्ता त्वत्स्वरूपं कुरुत इति दृढं शिक्षये पेशकारात्
    । विड्भस्मात्मा च देहो भवति गुरुवरो यो विवेकं विरक्तिं धत्ते सञ्चिन्त्यमानो मम तु बहुरुजापीडितोऽयं
    विशेषात् ॥ ॥ ही ही मे देहमोहं त्यज पवनपुराधीश यत्प्रेमहेतो र्गेहे वित्ते कलत्रादिषु च विवशितास्त्वत्पदं
    विस्मरन्ति । सोऽयं वह्नेश्शुनो वा परमिह परतः साम्प्रतञ्चाक्षिकर्ण त्वग्जिह्वाद्या विकर्षन्त्यवशमत
    इतः कोऽपि न त्वत्पदाब्जे ॥ ॥ दुर्वारो देहमोहो यदि पुनरधुना तर्हि निश्शेषरोगान् हृत्वा भक्तिं द्रढिष्ठां
    कुरु तव पदपङ्केरुहे पङ्कजाक्ष । नूनं नानाभवान्ते समधिगतममुं मुक्तिदं विप्रदेहं क्षुद्रे हा हन्त मा
    मा क्षिप विषयरसे पाहि मां मारुतेश ॥
