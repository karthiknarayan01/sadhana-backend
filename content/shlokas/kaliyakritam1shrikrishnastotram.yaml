id: kaliyakritam1shrikrishnastotram
category: stotram
name:
  english: kaliyakritam1shrikrishnastotram
  devanagari: कालियकृतं१श्रीकृष्णस्तोत्रम्
content:
  english: kaliyakritam 1 shrikrishnastotram vyasa uvaca | ityukte tabhirashvasya klantadeho'pi pannagah
    | prasida devadeveti praha vakyam shanaih shanaih || 43|| kaliya uvaca | tavashtagunamaishvaryam natha
    svabhavikam param | nirastatishayam yasya tasya stoshyami kinvaham || 44|| tvam parastvam parasya''dyah
    param tvam tatparatmakam | parasmatparamo yastvam tasya stoshyami kim nvaham || 45|| yatha'ham bhavata
    srishto jatya rupena ceshvarah | svabhavena ca samyuktastathedam ceshtitam maya || 46|| yadyanyatha
    pravarteya devadeva tato mayi | nyayyo dandanipataste tavaiva vacanam yatha || 47|| tatha'pi yam jagatsvami
    dandam patitavanmayi | sa sodho'yam varo dandastvatto nanyo'stu me varah || 48|| hataviryo hatavisho
    damito'ham tvaya'cyuta | jivitam diyatamekamajnapaya karomi kim || 49|| iti brahmapurane pancashityadhikashatatamadhyayantargatam
    kaliyakritam shrikrishnastotram samaptam | brahmapurana | adhyaya 185
  devanagari: कालियकृतं १ श्रीकृष्णस्तोत्रम् व्यास उवाच । इत्युक्ते ताभिराश्वास्य क्लान्तदेहोऽपि पन्नगः
    । प्रसीद देवदेवेति प्राह वाक्यं शनैः शनैः ॥ ४३॥ कालीय उवाच । तवाष्टगुणमैश्वर्यं नाथ स्वाभविकं परम्
    । निरस्तातिशयं यस्य तस्य स्तोष्यामि किन्वहम् ॥ ४४॥ त्वं परस्त्वं परस्याऽऽद्यः परं त्वं तत्परात्मकम्
    । परस्मात्परमो यस्त्वं तस्य स्तोष्यामि किं न्वहम् ॥ ४५॥ यथाऽहं भवता सृष्टो जात्या रूपेण चेश्वरः ।
    स्वभावेन च संयुक्तस्तथेदं चेष्टितं मया ॥ ४६॥ यद्यन्यथा प्रवर्तेय देवदेव ततो मयि । न्याय्यो दण्डनिपातस्ते
    तवैव वचनं यथा ॥ ४७॥ तथाऽपि यं जगत्स्वामी दण्डं पातितवान्मयि । स सोढोऽयं वरो दण्डस्त्वत्तो नान्योऽस्तु
    मे वरः ॥ ४८॥ हतवीर्यो हतविषो दमितोऽहं त्वयाऽच्युत । जीवितं दीयतामेकमाज्ञापय करोमि किम् ॥ ४९॥ इति ब्रह्मपुराणे
    पञ्चाशीत्यधिकशततमाध्यायान्तर्गतं कालियकृतं श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय १८५
