id: purushottamastotram
category: stotram
name:
  english: purushottamastotram
  devanagari: पुरुषोत्तमस्तोत्रम्
content:
  english: amnayabhigatanam ca svacaryanam mahatmanam | stotravalim pravakshyami shreyase bhaktaye guroh
    || 1|| niranjanam nityamanantamadyam yanneti neti shrutisammatam ca | taddhama daivam paramam parebhyo
    vande mukundam purushottamam tam || 2|| anoraniyanmahato mahiyan dure'pyadure bahirantaram ca | viruddhadharmashrayamaptakamam
    vande mukundam purushottamam tam || 3|| parasya shaktih sahajah svabhavah chaya ca mayadbhutakaryakartri
    | yadvishvamanandarasatmarupam vande mukundam purushottamam tam || 4|| riramsaya yah paripurnakamo
    nijatmarupamakarotsvalilam | nityamakhandamagunam gunadhyam vande mukundam purushottamam tam || 5||
    yo nirgunah prakritasadgunashca nijatmakamo'pi sadaptakamah | kamam dvidhasibahudha ramami vande mukundam
    purushottamam tam || 6|| rishisvarupairvividhaih svarupaistapahprasiddhairvrajadbhriddhadhunam | yuthairasankhyai
    ramate svasiddhairvande mukundam purushottamam tam || 7|| akaranam karyakari yadriccha vidhaya tam
    doshagunairvimuktah | srishtim vicitramavalokate yo vande mukundam purushottamam tam || 8|| shuddham
    tathadvaitamanantarupam jagatsvarupena ca viddhamekam | na canyayogo'tra na samprayogo vande mukundam
    purushottamam tam || 9|| stotram yadetatpurushottamasya nirupitam yaddharanidharena | dadhati vaci
    prasha
  devanagari: आम्नायाभिगतानां च स्वाचार्याणां महात्मनाम् । स्तोत्रावलिं प्रवक्ष्यामि श्रेयसे भक्तये गुरोः
    ॥ १॥ निरञ्जनं नित्यमनन्तमाद्यं यन्नेति नेति श्रुतिसम्मतं च । तद्धाम दैवं परमं परेभ्यो वन्दे मुकुन्दं
    पुरुषोत्तमं तम् ॥ २॥ अणोरणीयान्महतो महीयान् दूरेऽप्यदूरे बहिरन्तरं च । विरुद्धधर्माश्रयमाप्तकामं वन्दे
    मुकुन्दं पुरुषोत्तमं तम् ॥ ३॥ परास्य शक्तिः सहजाः स्वभावाः छाया च मायाद्भुतकार्यकर्त्री । यद्विश्वमानन्दरसात्मरूपं
    वन्दे मुकुन्दं पुरुषोत्तमं तम् ॥ ४॥ रिरंसया यः परिपूर्णकामो निजात्मरूपामकरोत्स्वलीलाम् । नित्यामखण्डामगुणां
    गुणाढ्यां वन्दे मुकुन्दं पुरुषोत्तमं तम् ॥ ५॥ यो निर्गुणः प्राकृतसद्गुणश्च निजात्मकामोऽपि सदाप्तकामः
    । कामं द्विधासीबहुधा रमामि वन्दे मुकुन्दं पुरुषोत्तमं तम् ॥ ६॥ ऋषिस्वरूपैर्विविधैः स्वरूपैस्तपःप्रसिद्धैर्व्रजद्भृद्धधूनाम्
    । यूथैरसङ्ख्यै रमते स्वसिद्धैर्वन्दे मुकुन्दं पुरुषोत्तमं तम् ॥ ७॥ अकारणं कार्यकरी यदृच्छा विधाय तां
    दोषगुणैर्विमुक्तः । सृष्टिं विचित्रामवलोकते यो वन्दे मुकुन्दं पुरुषोत्तमं तम् ॥ ८॥ शुद्धं तथाद्वैतमनन्तरूपं
    जगत्स्वरूपेण च विद्धमेकम् । न चान्ययोगोऽत्र न सम्प्रयोगो वन्दे मुकुन्दं पुरुषोत्तमं तम् ॥ ९॥ स्तोत्रं
    यदेतत्पुरुषोत्तमस्य निरूपितं यद्धरणीधरेण । दधाति वाचि प्रश
