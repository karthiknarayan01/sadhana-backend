id: annamayya-keerthanas-nallani-meni
category: stotram
name:
  english: Annamayya Keerthanas Nallani Meni
content:
  english: adi pallavi nallani meni nagavu cupula vadu | tèllani kannula devudu || birusaina danujula
    pinchamanacinatti | tirupu kaiduva todi devudu | saripadda jagamèlla cakka chayaku dècci | tèravu
    cupinatti devudu || nallani meni nagavu cupula vadu nitagalasinatti nindina caduvulu | teta paracinatti
    devudu | patimalinatti pranula duritapu | tita rasinatti devudu || nallani meni nagavu cupula vadu
    gurutuvèttagarani gunamula nèlakònna | tiruvenkatadripai devudu | tiramuga dhrivuniki divyapadambicci
    | tèraci rajannatti devudu || nallani meni nagavu cupula vadu | tèllani kannula devudu ||
  devanagari: आदि पल्लवि नल्लनि मेनि नगवु चूपुल वाडु । तॆल्लनि कन्नुल देवुडु ॥ बिरुसैन दनुजुल पिञ्छमणचिनट्टि
    । तिरुपु कैदुव तोडि देवुडु । सरिपड्ड जगमॆल्ल चक्क छायकु दॆच्चि । तॆरवु चूपिनट्टि देवुडु ॥ नल्लनि मेनि
    नगवु चूपुल वाडु नीटगलसिनट्टि निण्डिन चदुवुलु । तेट परचिनट्टि देवुडु । पाटिमालिनट्टि प्राणुल दुरितपु
    । तीट रासिनट्टि देवुडु ॥ नल्लनि मेनि नगवु चूपुल वाडु गुरुतुवॆट्टगरानि गुणमुल नॆलकॊन्न । तिरुवेङ्कटाद्रिपै
    देवुडु । तिरमुग धृवुनिकि दिव्यपदम्बिच्चि । तॆरचि राजन्नट्टि देवुडु ॥ नल्लनि मेनि नगवु चूपुल वाडु ।
    तॆल्लनि कन्नुल देवुडु ॥
