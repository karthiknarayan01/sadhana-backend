id: namavali-53
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: lobhaya namah | 30 || om pancasyaya namah | om sudhanvane namah | om trinetraya namah | om
    suparshvaya namah | om tushtaya namah | om udaraya namah | om shivaya namah | om shantarupaya namah
    | om shatavartaya namah | om annayasannapalaya namah | 40 || om attamalaya namah | om bhavaya namah
    | om rudraya namah | om kadrudraya namah | om pracetase namah | om indriyahinaya namah | om lelihanaya
    namah | om srikvine namah | om vishvaya namah | om vishvarupaya namah | 50 || om vishvasmai namah
    | om shirase namah | om sarvatah panipadaya namah | om sarvendriyaviharine namah | om rudraya namah
    | om pratirupaya namah | om khandacandradharaya namah | om vishvotpattivinashaya namah | om shadurmirahitaya
    namah | om siddhaya namah | 60 || om sadhyaya namah | om yamanam pataye namah | om mayobhuve namah
    | om shambhave namah | om vibhave namah | om prabhave namah | om dundubhyaya namah | om ahananyaya
    namah | om shangaya namah | om pramaya namah | 70 || om suviraya namah | om sughoraya namah | om akshobhyakshobhanaya
    namah | om suprajaya namah | om sumedhyaya namah | om sudhamne namah | om anantacakshushe namah |
    om buddhaya namah | om shuddhaya namah | om bandhamokshaya namah | 80 || om bhutabhavyaya namah |
    om vartamanaya namah | om damyate namah | om bhavaya namah | om bhadraya namah | om ghanaghoshaya
    namah | om prapannajanarakshaya namah | om bhaktapapaharaya namah | om saketavasagopyaya namah | om
    yamamargaharaya namah | 90 || om bhadraya namah | om rudrarupaya namah | om tandraya namah | om sthulaya
    namah | om sukshmaya namah | om drishyadrishyaya namah | om goptrine namah | om varshate namah | om
    jvalate namah | om grasate namah | 100 || om hrasate namah | om sucarukoshaya namah | om uruvakshashikhaya
    namah | om suvarnaya namah | om tapaniyanibhaya namah | om virupaya namah | om prasannaya namah |
    om sarvarupaya namah | 108 || || iti shivarahasyavyutpannam jyeshthamasakrite shivashatashtanamavalih
    sampurna ||
