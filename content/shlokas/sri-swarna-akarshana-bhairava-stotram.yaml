id: sri-swarna-akarshana-bhairava-stotram
category: stotram
name:
  english: Sri Swarna Akarshana Bhairava Stotram
content:
  english: om asya shri svarnakarshana bhairava stotra mahamantrasya brahma rishih anushtup chandah shri
    svarnakarshana bhairavo devata hrim bijam klim shaktih sah kilakam mama daridrya nasharthe pathe viniyogah
    || rishyadi nyasah | brahmarshaye namah shirasi | anushtup chandase namah mukhe | svarnakarshana bhairavaya
    namah hridi | hrim bijaya namah guhye | klim shaktaye namah padayoh | sah kilakaya namah nabhau |
    viniyògaya namah sarvange | hram hrim hrum iti kara shadanganyasah || dhyanam | parijatadruma kantare
    sthite manikyamandape | simhasanagatam vande bhairavam svarnadayakam || gangeya patram damarum trishulam
    varam karah sandadhatam trinetram | devyayutam tapta suvarnavarna svarnakarshanabhairavamashrayami
    || mantrah | om aim hrim shrim aim shrim apaduddharanaya hram hrim hrum ajamalavadhyaya lokeshvaraya
    svarnakarshanabhairavaya mama daridrya vidveshanaya mahabhairavaya namah shrim hrim aim | stotram
    | namaste'stu bhairavaya brahmavishnushivatmane | namastrailokyavandyaya varadaya paratmane || ||
    ratnasimhasanasthaya divyabharanashobhine | divyamalyavibhushaya namaste divyamurtaye || || namaste'nekahastaya
    hyanekashirase namah | namaste'nekanetraya hyanekavibhave namah || || namaste'nekakanthaya hyanekamshaya
    te namah | namostvanekaishvaryaya hyanekadivyatejase || || anekayudhayuktaya hyanekasurasevine | anekagunayuktaya
    mahadevaya te namah || || namo daridryakalaya mahasampatpradayine | shribhairaviprayuktaya trilokeshaya
    te namah || || digambara namastubhyam digishaya namo namah | namo'stu daityakalaya papakalaya te namah
    || || sarvajnaya namastubhyam namaste divyacakshushe | ajitaya namastubhyam jitamitraya te namah ||
    || namaste rudraputraya gananathaya te namah | namaste viraviraya mahaviraya te namah || || namo'stvanantaviryaya
    mahaghoraya te namah | namaste ghoraghoraya vishvaghoraya te namah || || namah ugraya shantaya bhaktebhyah
    shantidayine | gurave sarvalokanam namah pranava rupine || || namaste vagbhavakhyaya dirghakamaya
    te namah | namaste kamarajaya yoshitkamaya te namah || || dirghamayasvarupaya mahamayapate namah |
    srishtimayasvarupaya visargaya samyayine || || rudralokeshapujyaya hyapaduddharanaya ca | namo'jamalabaddhaya
    suvarnakarshanaya te || || namo namo bhairavaya mahadaridryanashine | unmulanakarmathaya hyalakshmya
    sarvada namah || || namo lokatrayeshaya svanandanihitaya te | namah shribijarupaya sarvakamapradayine
    || || namo mahabhairavaya shrirupaya namo namah | dhanadhyaksha namastubhyam sharanyaya namo namah
    || || namah prasannarupaya hyadidevaya te namah | namaste mantrarupaya namaste ratnarupine || || namaste
    svarnarupaya suvarnaya namo namah | namah suvarnavarnaya mahapunyaya te namah || || namah shuddhaya
    buddhaya namah samsaratarine | namo devaya guhyaya prabalaya namo namah || || namaste balarupaya paresham
    balanashine | namaste svargasamsthaya namo bhurlokavasine || || namah patalavasaya niradharaya te
    namah | namo namah svatantraya hyanantaya namo namah || || dvibhujaya namastubhyam bhujatrayasushobhine
    | namo'nimadisiddhaya svarnahastaya te namah || || purnacandrapratikashavadanambhojashobhine | namaste
    svarnarupaya svarnalankarashobhine || || namah svarnakarshanaya svarnabhaya ca te namah | namaste
    svarnakanthaya svarnalankaradharine || || svarnasimhasanasthaya svarnapadaya te namah | namah svarnabhaparaya
    svarnakancisushobhine || || namaste svarnajanghaya bhaktakamadughatmane | namaste svarnabhaktanam
    kalpavrikshasvarupine || || cintamanisvarupaya namo brahmadisevine | kalpadrumadhahsamsthaya bahusvarnapradayine
    || || namo hemadikarshaya bhairavaya namo namah | stavenanena santushto bhava lokeshabhairava || ||
    pashya mam karunavishta sharanagatavatsala | shribhairava dhanadhyaksha sharanam tvam bhajamyaham
    | prasida sakalan kaman prayaccha mama sarvada || || phalashrutih shrimahabhairavasyedam stotrasuktam
    sudurlabham | mantratmakam mahapunyam sarvaishvaryapradayakam || || yah pathennityamekagram patakaih
    sa vimucyate | labhate camalalakshmimashtaishvaryamavapnuyat || || cintamanimavapnoti dhenu kalpatarum
    dhrivam | svarnarashimavapnoti siddhimeva sa manavah || || sandhyayam yah pathet stotram dashavritya
    narottamaih | svapne shribhairavastasya sakshadbhutva jagadguruh || || svarnarashi dadatyeva tat kshanannasti
    samshayah | sarvada yah pathet stotram bhairavasya mahatmanah || || lokatrayam vashikuryadacalam shriyamavapnuyat
    | na bhayam labhate kvapi vighnabhutadisambhava || || mriyante shatravo'vashyamalakshminashamapnuyat
    | akshayam labhate saukhyam sarvada manavottamah || || ashtapancashatanadhyo mantrarajah prakirtitah
    | daridryaduhkhashamanam svarnakarshanakarakah || || ya yena sanjapet dhiman stotram va prapathet
    sada | mahabhairavasayujyam svantakale bhaveddhruvam || || iti rudrayamala tantre svarnakarshana bhairava
    stotram ||
  devanagari: ॐ अस्य श्री स्वर्णाकर्षण भैरव स्तोत्र महामन्त्रस्य ब्रह्म ऋषिः अनुष्टुप् छन्दः श्री स्वर्णाकर्षण
    भैरवो देवता ह्रीं बीजं क्लीं शक्तिः सः कीलकं मम दारिद्र्य नाशार्थे पाठे विनियोगः ॥ ऋष्यादि न्यासः
    । ब्रह्मर्षये नमः शिरसि । अनुष्टुप् छन्दसे नमः मुखे । स्वर्णाकर्षण भैरवाय नमः हृदि । ह्रीं बीजाय नमः
    गुह्ये । क्लीं शक्तये नमः पादयोः । सः कीलकाय नमः नाभौ । विनियॊगाय नमः सर्वाङ्गे । ह्रां ह्रीं ह्रूं
    इति कर षडङ्गन्यासः ॥ ध्यानम् । पारिजातद्रुम कान्तारे स्थिते माणिक्यमण्डपे । सिंहासनगतं वन्दे भैरवं
    स्वर्णदायकम् ॥ गाङ्गेय पात्रं डमरूं त्रिशूलं वरं करः सन्दधतं त्रिनेत्रम् । देव्यायुतं तप्त सुवर्णवर्ण
    स्वर्णाकर्षणभैरवमाश्रयामि ॥ मन्त्रः । ॐ ऐं ह्रीं श्रीं ऐं श्रीं आपदुद्धारणाय ह्रां ह्रीं ह्रूं अजामलवध्याय
    लोकेश्वराय स्वर्णाकर्षणभैरवाय मम दारिद्र्य विद्वेषणाय महाभैरवाय नमः श्रीं ह्रीं ऐम् । स्तोत्रम् ।
    नमस्तेऽस्तु भैरवाय ब्रह्मविष्णुशिवात्मने । नमस्त्रैलोक्यवन्द्याय वरदाय परात्मने ॥ ॥ रत्नसिंहासनस्थाय
    दिव्याभरणशोभिने । दिव्यमाल्यविभूषाय नमस्ते दिव्यमूर्तये ॥ ॥ नमस्तेऽनेकहस्ताय ह्यनेकशिरसे नमः । नमस्तेऽनेकनेत्राय
    ह्यनेकविभवे नमः ॥ ॥ नमस्तेऽनेककण्ठाय ह्यनेकांशाय ते नमः । नमोस्त्वनेकैश्वर्याय ह्यनेकदिव्यतेजसे ॥
    ॥ अनेकायुधयुक्ताय ह्यनेकसुरसेविने । अनेकगुणयुक्ताय महादेवाय ते नमः ॥ ॥ नमो दारिद्र्यकालाय महासम्पत्प्रदायिने
    । श्रीभैरवीप्रयुक्ताय त्रिलोकेशाय ते नमः ॥ ॥ दिगम्बर नमस्तुभ्यं दिगीशाय नमो नमः । नमोऽस्तु दैत्यकालाय
    पापकालाय ते नमः ॥ ॥ सर्वज्ञाय नमस्तुभ्यं नमस्ते दिव्यचक्षुषे । अजिताय नमस्तुभ्यं जितामित्राय ते नमः
    ॥ ॥ नमस्ते रुद्रपुत्राय गणनाथाय ते नमः । नमस्ते वीरवीराय महावीराय ते नमः ॥ ॥ नमोऽस्त्वनन्तवीर्याय
    महाघोराय ते नमः । नमस्ते घोरघोराय विश्वघोराय ते नमः ॥ ॥ नमः उग्राय शान्ताय भक्तेभ्यः शान्तिदायिने
    । गुरवे सर्वलोकानां नमः प्रणव रूपिणे ॥ ॥ नमस्ते वाग्भवाख्याय दीर्घकामाय ते नमः । नमस्ते कामराजाय योषित्कामाय
    ते नमः ॥ ॥ दीर्घमायास्वरूपाय महामायापते नमः । सृष्टिमायास्वरूपाय विसर्गाय सम्यायिने ॥ ॥ रुद्रलोकेशपूज्याय
    ह्यापदुद्धारणाय च । नमोऽजामलबद्धाय सुवर्णाकर्षणाय ते ॥ ॥ नमो नमो भैरवाय महादारिद्र्यनाशिने । उन्मूलनकर्मठाय
    ह्यलक्ष्म्या सर्वदा नमः ॥ ॥ नमो लोकत्रयेशाय स्वानन्दनिहिताय ते । नमः श्रीबीजरूपाय सर्वकामप्रदायिने
    ॥ ॥ नमो महाभैरवाय श्रीरूपाय नमो नमः । धनाध्यक्ष नमस्तुभ्यं शरण्याय नमो नमः ॥ ॥ नमः प्रसन्नरूपाय ह्यादिदेवाय
    ते नमः । नमस्ते मन्त्ररूपाय नमस्ते रत्नरूपिणे ॥ ॥ नमस्ते स्वर्णरूपाय सुवर्णाय नमो नमः । नमः सुवर्णवर्णाय
    महापुण्याय ते नमः ॥ ॥ नमः शुद्धाय बुद्धाय नमः संसारतारिणे । नमो देवाय गुह्याय प्रबलाय नमो नमः ॥ ॥
    नमस्ते बलरूपाय परेषां बलनाशिने । नमस्ते स्वर्गसंस्थाय नमो भूर्लोकवासिने ॥ ॥ नमः पातालवासाय निराधाराय
    ते नमः । नमो नमः स्वतन्त्राय ह्यनन्ताय नमो नमः ॥ ॥ द्विभुजाय नमस्तुभ्यं भुजत्रयसुशोभिने । नमोऽणिमादिसिद्धाय
    स्वर्णहस्ताय ते नमः ॥ ॥ पूर्णचन्द्रप्रतीकाशवदनाम्भोजशोभिने । नमस्ते स्वर्णरूपाय स्वर्णालङ्कारशोभिने
    ॥ ॥ नमः स्वर्णाकर्षणाय स्वर्णाभाय च ते नमः । नमस्ते स्वर्णकण्ठाय स्वर्णालङ्कारधारिणे ॥ ॥ स्वर्णसिंहासनस्थाय
    स्वर्णपादाय ते नमः । नमः स्वर्णाभपाराय स्वर्णकाञ्चीसुशोभिने ॥ ॥ नमस्ते स्वर्णजङ्घाय भक्तकामदुघात्मने
    । नमस्ते स्वर्णभक्तानां कल्पवृक्षस्वरूपिणे ॥ ॥ चिन्तामणिस्वरूपाय नमो ब्रह्मादिसेविने । कल्पद्रुमाधःसंस्थाय
    बहुस्वर्णप्रदायिने ॥ ॥ नमो हेमादिकर्षाय भैरवाय नमो नमः । स्तवेनानेन सन्तुष्टो भव लोकेशभैरव ॥ ॥ पश्य
    मां करुणाविष्ट शरणागतवत्सल । श्रीभैरव धनाध्यक्ष शरणं त्वां भजाम्यहम् । प्रसीद सकलान् कामान् प्रयच्छ
    मम सर्वदा ॥ ॥ फलश्रुतिः श्रीमहाभैरवस्येदं स्तोत्रसूक्तं सुदुर्लभम् । मन्त्रात्मकं महापुण्यं सर्वैश्वर्यप्रदायकम्
    ॥ ॥ यः पठेन्नित्यमेकाग्रं पातकैः स विमुच्यते । लभते चामलालक्ष्मीमष्टैश्वर्यमवाप्नुयात् ॥ ॥ चिन्तामणिमवाप्नोति
    धेनु कल्पतरुं धृवम् । स्वर्णराशिमवाप्नोति सिद्धिमेव स मानवः ॥ ॥ सन्ध्यायां यः पठेत् स्तोत्रं दशावृत्या
    नरोत्तमैः । स्वप्ने श्रीभैरवस्तस्य साक्षाद्भूत्वा जगद्गुरुः ॥ ॥ स्वर्णराशि ददात्येव तत् क्षणान्नास्ति
    संशयः । सर्वदा यः पठेत् स्तोत्रं भैरवस्य महात्मनः ॥ ॥ लोकत्रयं वशीकुर्यादचलां श्रियमवाप्नुयात् । न
    भयं लभते क्वापि विघ्नभूतादिसम्भव ॥ ॥ म्रियन्ते शत्रवोऽवश्यमलक्ष्मीनाशमाप्नुयात् । अक्षयं लभते सौख्यं
    सर्वदा मानवोत्तमः ॥ ॥ अष्टपञ्चाशताणढ्यो मन्त्रराजः प्रकीर्तितः । दारिद्र्यदुःखशमनं स्वर्णाकर्षणकारकः
    ॥ ॥ य येन सञ्जपेत् धीमान् स्तोत्रं वा प्रपठेत् सदा । महाभैरवसायुज्यं स्वान्तकाले भवेद्ध्रुवम् ॥ ॥
    इति रुद्रयामल तन्त्रे स्वर्णाकर्षण भैरव स्तोत्रम् ॥
