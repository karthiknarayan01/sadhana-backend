id: brahmastotram
category: stotram
name:
  english: brahmastotram
  devanagari: ब्रह्मस्तोत्रम्
content:
  english: rinu maheshani brahmanah paramatmanah | ucchrutva sadhako devi brahmasayujyamashnute || om
    namaste sate sarvalokashrayaya namaste cite vishvarupatmakaya | namo'dvaitatattvaya muktipradaya namo
    brahmane vyapine nirgunaya || 1|| tvamekam sharanyam tvamekam varenyam tvamekam jagatkaranam vishvarupam
    | tvamekam jagatkartripatriprahartri tvamekam param nishcalam nirvikalpam || 2|| bhayanam bhayam bhishanam
    bhishananam gatih praninam pavanam pavananam | mahoccaih padanam niyantri tvamekam paresham param
    rakshanam rakshananam || 3|| paresha prabho sarvarupavinashin anirdeshya sarvendriyagamya satya |
    acintyakshara vyapakavyaktatattva jagadbhasakadhisha payadapayat || 4|| tadekam smaramastadekam bhajama
  devanagari: ृणु महेशानि ब्रह्मणः परमात्मनः । उच्छ्रुत्वा साधको देवि ब्रह्मसायुज्यमश्नुते ॥ ॐ नमस्ते
    सते सर्वलोकाश्रयाय नमस्ते चिते विश्वरूपात्मकाय । नमोऽद्वैततत्त्वाय मुक्तिप्रदाय नमो ब्रह्मणे व्यापिने
    निर्गुणाय ॥ १॥ त्वमेकं शरण्यं त्वमेकं वरेण्यं त्वमेकं जगत्कारणं विश्वरूपम् । त्वमेकं जगत्कर्तृपातृप्रहार्तृ
    त्वमेकं परं निश्चलं निर्विकल्पम् ॥ २॥ भयानां भयं भीषणं भीषणानां गतिः प्राणिनां पावनं पावनानाम् । महोच्चैः
    पदानां नियन्तृ त्वमेकं परेशं परं रक्षणं रक्षणानाम् ॥ ३॥ परेश प्रभो सर्वरूपाविनाशिन् अनिर्देश्य सर्वेन्द्रियागम्य
    सत्य । अचिन्त्याक्षर व्यापकव्यक्ततत्त्व जगद्भासकाधीश पायादपायात् ॥ ४॥ तदेकं स्मरामस्तदेकं भजाम
