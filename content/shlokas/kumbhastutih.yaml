id: kumbhastutih
category: stotram
name:
  english: kumbhastutih
  devanagari: कुम्भस्तुतिः
content:
  english: kamya se sundara ramaniyom ke vakshahsthala para udgata tujha kumbha ke liye kritanjali hota
    hua maim sarvatha namribhuta hu~ || 7|| namna ghataya kalashaya subhajanaya dhamna nabho'rkashashidipasamikritaya
    | damna ca saddravinakoshavisheshitaya kumbhaya me'stu vinatih pranatih stutishca || 8|| nama se ghata
    kalasha sundara patra ke rupa vale
  devanagari: काम्य से सुन्दर रमणियों के वक्षःस्थल पर उद्गत तुझ कुम्भ के लिये कृताञ्जलि होता हुआ मैं सर्वथा
    नम्रीभूत हूँ ॥ ७॥ नाम्ना घटाय कलशाय सुभाजनाय धाम्ना नभोऽर्कशशिदीपसमीकृताय । दाम्ना च सद्द्रविणकोषविशेषिताय
    कुम्भाय मेऽस्तु विनतिः प्रणतिः स्तुतिश्च ॥ ८॥ नाम से घट कलश सुन्दर पात्र के रूप वाले
meaning: {}
