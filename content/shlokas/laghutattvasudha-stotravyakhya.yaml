id: laghutattvasudha-stotravyakhya
category: stotram
name:
  english: laghutattvasudha stotravyakhya
  devanagari: लघुतत्त्वसुधा स्तोत्रव्याख्या
content:
  english: laghutattvasudha shridakshinamurtistotravyakhya shri shankarabhagavatpadacaryapranitam shri
    dakshinamurtistotram shri svayamprakashayati viracita laghutattvasudhakhyavyakhyasametam shri dakshinamurtistotram
    maunavyakhyaprakatitaparabrahmatattvam yuvanam varshishthantevasadrishiganairavritam brahmanishthaih
    | acaryendram karakalitacinmudramanamanandamurtim svatmaramam muditavadanam dakshinamurtimide || laghutattvasudha
    kaivalyanandayogindra shuddhanandayatishvarau | natvarabhe laghuvyakhyam dakshinashamukhastuteh ||
    avatarika iha khalu sarvajno bhagavan bhashyakaro lokanugrahaikaprayojanakritashariraparigrahah sakalavedantadugdhabdheh
    nyayamandarena vicaranirmathanadavirbhutadvaitamritasya vinyasakalashabhutam shridakshinamurtistotram
    sakalalokanujighrikshaya bhoktrijivabhogyajagat bhogapradaparameshvaramokshaprada
  devanagari: लघुतत्त्वसुधा श्रीदक्षिणामूर्तिस्तोत्रव्याख्या श्री शङ्करभगवत्पादाचार्यप्रणीतं श्री दक्षिणामूर्तिस्तोत्रम्
    श्री स्वयंप्रकाशयति विरचित लघुतत्त्वसुधाख्यव्याख्यासमेतम् श्री दक्षिणामूर्तिस्तोत्रम् मौनव्याख्याप्रकटितपरब्रह्मतत्त्वं
    युवानं वर्षिष्ठान्तेवसदृषिगणैरावृतं ब्रह्मनिष्ठैः । आचार्येन्द्रं करकलितचिन्मुद्रमानमानन्दमूर्तिं
    स्वात्मारामं मुदितवदनं दक्षिणामूर्तिमीडे ॥ लघुतत्त्वसुधा कैवल्यानन्दयोगीन्द्र शुद्धानन्दयतीश्वरौ ।
    नत्वारभे लघुव्याख्यां दक्षिणाशामुखस्तुतेः ॥ अवतारिका इह खलु सर्वज्ञो भगवान् भाष्यकारो लोकानुग्रहैकप्रयोजनकृतशरीरपरिग्रहः
    सकलवेदान्तदुग्धाब्धेः न्यायमन्दरेण विचारनिर्मथनादाविर्भूताद्वैतामृतस्य विन्यासकलशभूतं श्रीदक्षिणामूर्तिस्तोत्रं
    सकललोकानुजिघृक्षया भोक्तृजीवभोग्यजगत् भोगप्रदपरमेश्वरमोक्षप्रद
meaning: {}
