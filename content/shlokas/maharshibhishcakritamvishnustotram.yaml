id: maharshibhishcakritamvishnustotram
category: stotram
name:
  english: maharshibhishcakritamvishnustotram
  devanagari: महर्षिभिश्चकृतंविष्णुस्तोत्रम्
content:
  english: maharshibhishca kritam vishnustotram brahmadaya ucuh | tam jatamatram bhagavantamisham narayanam
    lokapatim puranam | brahma samabhyetya samam maharshibhih stotram jagadatha vibhormaharshe || 35||
    namo'stu te madhava sattvamurtte namo'stu te shashvata vishvarupa | namo'stu te shatruvanendhanagne
    namo'stu vai papamahadavagne || 36|| namaste pundarikaksha namaste vishvabhavana | namaste jagadadhara
    namaste purushottama || 37|| narayana jaganmurte jagannatha gadadhara | pitavasah shriyah kanta janardana
    namo'stu te || 38|| bhavamstrata ca gopta ca vishvatma sarvago | avyayah | sarvadhari dharadhari rupadhari
    namo'stu te || 39|| vardhasva vardhitasheshatrailokya surapujita | kurushva daivatapate maghono'shrupramarjanam
    || 40|| tvam dhata ca vidhata ca samharta tvam maheshvarah | mahalaya mahayogin yogashayin namo'stu
    te || 41|| ittham stuto jagannatham sarvatma sarvago harih | provaca bhagavan mahyam kurupanayanam
    vibho || 42|| iti vamanapurane ekonanavatitamadhyayantargatam vamanapradurbhave brahmana maharshibhishca
    kritam vishnustotram samaptam | vamanapurana | adhyaya 89
  devanagari: महर्षिभिश्च कृतं विष्णुस्तोत्रम् ब्रह्मादय ऊचुः । तं जातमात्रं भगवन्तमीशं नारायणं लोकपतिं
    पुराणम् । ब्रह्मा समभ्येत्य समं महर्षिभिः स्तोत्रं जगादाथ विभोर्महर्षे ॥ ३५॥ नमोऽस्तु ते माधव सत्त्वमूर्त्ते
    नमोऽस्तु ते शाश्वत विश्वरूप । नमोऽस्तु ते शत्रुवनेन्धनाग्ने नमोऽस्तु वै पापमहादवाग्ने ॥ ३६॥ नमस्ते
    पुण्डरीकाक्ष नमस्ते विश्वभावन । नमस्ते जगदाधार नमस्ते पुरुषोत्तम ॥ ३७॥ नारायण जगन्मूर्ते जगन्नाथ गदाधर
    । पीतवासः श्रियः कान्त जनार्दन नमोऽस्तु ते ॥ ३८॥ भवांस्त्राता च गोप्ता च विश्वात्मा सर्वगो । अव्ययः
    । सर्वधारी धराधारी रूपधारी नमोऽस्तु ते ॥ ३९॥ वर्धस्व वर्धिताशेषत्रैलोक्य सुरपूजित । कुरुष्व दैवतपते
    मघोनोऽश्रुप्रमार्जनम् ॥ ४०॥ त्वं धाता च विधाता च संहर्ता त्वं महेश्वरः । महालय महायोगिन् योगशायिन्
    नमोऽस्तु ते ॥ ४१॥ इत्थं स्तुतो जगन्नाथं सर्वात्मा सर्वगो हरिः । प्रोवाच भगवान् मह्यं कुरूपनयनं विभो
    ॥ ४२॥ इति वामनपुराणे एकोननवतितमाध्यायान्तर्गतं वामनप्रादुर्भावे ब्रह्मणा महर्षिभिश्च कृतं विष्णुस्तोत्रं
    समाप्तम् । वामनपुराण । अध्याय ८९
