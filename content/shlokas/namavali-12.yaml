id: namavali-12
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: om kambukanthaya namah | om lamboshthaya namah | om lambanasikaya namah | om sarvavayavasampurnaya
    namah | om sarvalakshanalakshitaya namah | om ikshucapadharaya namah | om shuline namah | om kantikandalitashrayaya
    namah | om akshamaladharaya namah | om jnanamudravate namah |
  devanagari: ॐ कम्बुकण्ठाय नमः । ॐ लम्बोष्ठाय नमः । ॐ लम्बनासिकाय नमः । ॐ सर्वावयवसम्पूर्णाय नमः । ॐ
    सर्वलक्षणलक्षिताय नमः । ॐ इक्षुचापधराय नमः । ॐ शूलिने नमः । ॐ कान्तिकन्दलिताश्रयाय नमः । ॐ अक्षमालाधराय
    नमः । ॐ ज्ञानमुद्रावते नमः ।
meaning: {}
