id: guru-graha-pancharatna-stotram
category: stotram
name:
  english: Guru Graha Pancharatna Stotram
content:
  english: devananca rishinanca gurukancana sannibham | buddhi mantam trilokesham tam namami brihaspatim
    || || varakshamalam dandam ca kamandaladharam vibhum | pushyaragankitam pitam varadam bhavayet gurum
    || || abhishtavaradam devam sarvajnam surapujitam | sarvakaryartha siddhyartham pranamami brihaspatim
    sada || || angirasabdasanjata angirasa kulodbhavah | indradidevo devesho devatabhishtadayikah || ||
    brahmaputro brahmanesho brahmavidyavisharadah | caturbhuja samanvitam devam tam gurum pranamamyaham
    ||
  devanagari: देवानाञ्च ऋषीणाञ्च गुरुकाञ्चन सन्निभम् । बुद्धि मन्तं त्रिलोकेशं तं नमामि बृहस्पतिम् ॥ ॥
    वराक्षमालां दण्डं च कमण्डलधरं विभुम् । पुष्यरागाङ्कितं पीतं वरदां भावयेत् गुरुम् ॥ ॥ अभीष्टवरदां देवं
    सर्वज्ञं सुरपूजितम् । सर्वकार्यर्थ सिद्ध्यर्थं प्रणमामि बृहस्पतिं सदा ॥ ॥ आङ्गीरसाब्दसञ्जात अङ्गीरस
    कुलोद्भवः । इन्द्रादिदेवो देवेशो देवताभीष्टदायिकः ॥ ॥ ब्रह्मपुत्रो ब्राह्मणेशो ब्रह्मविद्याविशारदः
    । चतुर्भुज समन्वितं देवं तं गुरुं प्रणमाम्यहम् ॥
