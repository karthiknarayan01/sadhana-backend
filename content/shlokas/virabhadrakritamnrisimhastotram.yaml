id: virabhadrakritamnrisimhastotram
category: stotram
name:
  english: virabhadrakritamnrisimhastotram
  devanagari: वीरभद्रकृतंनृसिंहस्तोत्रम्
content:
  english: virabhadrakritam nrisimhastotram virabhadra uvaca | jagatsukhaya bhagavannavatirno'si madhava
    | sthityartham tvam prayukto'si pareshah parameshthina || 17|| jantucakram bhagavata pracchinnam matsyarupina
    | pucchenaiva samabadhya bhramannekarnave pura || 18|| bibharshi karmarupena varahenoddhrita mahi
    | anena harirupena hiranyakashipurhatah || 19|| vamanena balirbaddhastvaya vikramata punah | tvameva
    sarvabhutanam prabhavah prabhuravyayah || 20|| yada yada hi lokasya duhkham kincitprajayate | tada
    tadavatirnastvam karishyasi niramayam || 21|| nadhikastvatsamo'pyasti hare shivaparayanah | tvaya
    vedashca dharmashca shubhamarge pratishthitah || 22|| yadarthamavataro'yam nihatassa hi danavah |
    hiranyakashipushcaiva prahlado'pi surakshitah || 23|| ativa ghoram bhagavannarasimhavapustava | upasamhara
    vishvatmamstvameva mama sannidhau || 24|| iti shivapurane shatarudrasamhitayam ekadashadhyayantargatam
    virabhadrakritam nrisimhastotram samaptam | shivapurana | shatarudrasamhita | adhyaya 11
  devanagari: वीरभद्रकृतं नृसिंहस्तोत्रम् वीरभद्र उवाच । जगत्सुखाय भगवन्नवतीर्णोऽसि माधव । स्थित्यर्थं
    त्वं प्रयुक्तोऽसि परेशः परमेष्ठिना ॥ १७॥ जन्तुचक्रं भगवता प्रच्छिन्नं मत्स्यरूपिणा । पुच्छेनैव समाबध्य
    भ्रमन्नेकार्णवे पुरा ॥ १८॥ बिभर्षि कर्मरूपेण वाराहेणोद्धृता मही । अनेन हरिरूपेण हिरण्यकशिपुर्हतः ॥
    १९॥ वामनेन बलिर्बद्धस्त्वया विक्रमता पुनः । त्वमेव सर्वभूतानां प्रभवः प्रभुरव्ययः ॥ २०॥ यदा यदा हि
    लोकस्य दुःखं किञ्चित्प्रजायते । तदा तदावतीर्णस्त्वं करिष्यसि निरामयम् ॥ २१॥ नाधिकस्त्वत्समोऽप्यस्ति
    हरे शिवपरायणः । त्वया वेदाश्च धर्माश्च शुभमार्गे प्रतिष्ठिताः ॥ २२॥ यदर्थमवतारोऽयं निहतस्स हि दानवः
    । हिरण्यकशिपुश्चैव प्रह्लादोऽपि सुरक्षितः ॥ २३॥ अतीव घोरं भगवन्नरसिंहवपुस्तव । उपसंहर विश्वात्मंस्त्वमेव
    मम सन्निधौ ॥ २४॥ इति शिवपुराणे शतरुद्रसंहितायां एकादशाध्यायान्तर्गतं वीरभद्रकृतं नृसिंहस्तोत्रं समाप्तम्
    । शिवपुराण । शतरुद्रसंहिता । अध्याय ११
