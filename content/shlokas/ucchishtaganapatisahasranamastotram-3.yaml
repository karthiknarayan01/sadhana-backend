id: ucchishtaganapatisahasranamastotram-3
category: sahasranama
name:
  english: ucchishtaganapatisahasranamastotram
  devanagari: उच्छिष्टगणपतिसहस्रनामस्तोत्रम्
content:
  english: punarjeta punarjivah punarvasuh | timirastimiketushca titishasuraghatanah || 70|| tishyastuladharo
    jrimbho vishleshashleshadanarat | manado madhavo madho vacalo maghavopamah || 71|| madhyo maghapriyo
    megho mahashundo mahabhujah | purvaphalgunikah sphita phalguruttaraphalgunah || 72|| phenilo brahmado
    brahma saptatantusamashrayah | ghonahastashcaturhasto hastivaktro halayudhah || 73|| citrambaro'rcitapadah
    svastidah svastivigrahah | vishakhah shikhisevyashca shikhidhvajasahodarah || 74|| anurenutkarah spharo
    rururenusuto narah | anuradhapriyo radhah shrimanchuklah shucismitah || 75|| jyeshthah shreshtharcitapado
    mulam ca trijagadguruh | shucishcaiva purvashadhashcottarashadha ishvarah || 76|| shravyo'bhijidanantatma
    shravo vepitadanavah | shravanah shravanah shrota dhani dhanyo dhanishthakah || 77|| shatatapah shatakumbhah
    sharajjyotih shatabhishak | purvabhadrapado bhadrashcottarabhadrapaditah || 78|| renukatanayo ramo
    revatiramano rami | ashvayukkartikeyeshto margashirsho mrigottamah || 79|| pausheshvarah phalgunatma
    vasantashcaitrako madhuh | rajyado'bhijidatmiyastareshastarakadyutih || 80|| pratitah prorjitah pritah
    paramah paramo hitah | paraha pancabhuh pancavayupujyah parigrahah || 81|| puranagamavidyogi mahisho
    rasabho'grajah | graho mesho vrisho mando manmatho mithunakritih || 82|| kalpabhritkatako dipo markatah
    karkato ghrinih | kukkuto vanajo hamsah paramahamsah srigalakah || 83|| simhah simhasanabhushyo madgurmushakavahanah
    | putrado narakatrata kanyapritah kulodvahah || 84|| atulyarupo baladastulyabhrittulyasakshikah |
    alishcapadharo dhanvi kacchapo makaro manih || 85|| kumbhabhritkalashah kubjo minamamsasutarpitah
    | rashitaragrahamayastithirupo jagadvibhuh || 86|| pratapi pratipatpreyo'dvitiyo'dvaitanishcitah |
    trirupashca tritiyagnistrayirupastrayitanuh || 87|| caturthivallabho devo paragah pancamishvarah |
    shadrasasvadavijnanah shashthi shashtikavatsalah || 88|| saptarnavagatih sarah saptamishvara rohitah
    | ashtaminandanottamso navamibhaktibhavitah || 89|| dashadikpatipujyashca dashamidruhino drutah |
    ekadashatmaganapo dvadashiyugacarcitah || 90|| trayodashamanistutyashcaturdashasvarapriyah | caturdashendrasamstutyah
    purnimanandavigrahah || 91|| darshadarsho darshanashca vanaprastho maheshvarah | maurvi madhuravanmulamurtimanmeghavahanah
    || 92|| mahagajo jitakrodho jitashatrurjayashrayah | raudro rudrapriyo rudro rudraputro'ghanashanah
    || 93|| bhavapriyo bhavanishto bharabhridbhutabhavanah | gandharvakushalo'kuntho vaikuntho vishtarashravah
    || 94|| vritraha vighnaha sirah samastaduhkhatapaha | manjuro marjaro matto durgaputro duralasah ||
    95|| anantacitsudhadharo viro viryaikasadhakah | bhasvanmukutamanikyah kujatkinkimnijalakah || 96||
    shundadhari tundacalah kundali mundamalakah | padmakshah padmahastashca padmanabhasamarcitah || 97||
    uddhritadharadantadhyo malabhushanabhushitah | marado varano lolashravanah shurpakarnakah || 98||
    brihadullasanasadhyo vyaptatrailokyamandalah | ratnamandalamadhyasthah krishanurupashilakah || 99||
    brihatkarnancalodbhutavayuvijitadiktatah | brihadasyaravakrantabhitabrahmandabhandakah || 100|| brihatpadasamakrantasaptapataladipitah
    | brihaddantakritatyugrarananandarasalasah || 101|| brihaddhastadhritasheshayudhanirjitadanavah |
    sphuratsinduravadanah sphurattejo'gnilocanah || 102|| uddipitamanisphurjannupuradhvaninaditah | calattoyapravahadhyo
    nadijalakanakarah || 103|| bhramatkunjarasanghatavanditanghrisaroruhah | brahmacyutamaharudrapurassarasurarcitah
    || 104|| asheshasheshaprabhritivyalajalopasevitah | garjatpancananaravavyaptakashadharatalah || 105||
    hahahuhugatatyugrasvaravibhrantamanasah | pancashadvarnabijakhyamantramantritavigrahah || 106|| vedantashastrapiyushadhara''plavitabhutalah
    | shankhadhvanisamakrantapataladinabhastalah || 107|| cintamanirmahamallo ballahasto balih kavih |
    kritatretayugollasabhasamanajagattrayah || 108|| dvaparah paralokaikah karmadhvantasudhakarah | sudha''siktavapurvyaso
    brahmandadikabahukah || 109|| akaradikshakarantavarnapanktisamujjvalah | akarakaraprodgitatananadaninaditah
    || 110|| ikarekaramatradhyamalabhramanalalasah | ukarokaraprodgarighoranagopavitakah || 111|| rivarnankitarikaripadmadvayasamujjvalah
    | lrikarayutalrikarashankhapurnadigantarah || 112|| ekaraikakaragirijastanapanavicakshanah | okaraukaravishvadikritasrishtikramalasah
    || 113|| amahvarnavalivyaptapadadishirshamandalah | karnatalakritatyuccairvayuvijitanirjarah || 114||
    khageshadhvajaratnankakiritarunapadakah | garvitasheshagandharvagitatatparashrotrakah || 115|| ghanavahanavagishapurassarasurarcitah
    | navarnamritadharadhyashobhamanaikadantakah || 116|| candrakunkumajambalaliptasinduravigrahah | chatracamararatnadhyamukutalankritananah
    || 117|| jatabaddhamahanarghamanipanktivirajitah | jhankarimadhupavratagananadavinaditah || 118||
    navarnakritasamharadaityasrikparnamudgarah | takarakhyaphalasvadavepitasheshamurdhajah || 119|| thakaradyadakarankadhakaranandatoshitah
    | navarnamritapiyushadharadharasudhakarah || 120|| tamrasindurapujadhyalalataphalakacchavih | thakaradhanapanktyatisantoshitadvijavrajah
    || 121|| dayamritahridambhojadhritatrailokyamandalah | dhanadadimahayakshasamsevitapadambujah || 122||
    namitasheshadevaughakiritamaniranjitah | paravargapavargadibhogecchedanadakshakah || 123|| phanicakrasamakrantagalamandalamanditah
    | baddhabhruyugabhimograsantarjitasurasurah || 124|| bhavanihridayanandavarddhanaikanishakarah | madirakalashasphitakaralaikakarambujah
    || 125|| yajnantarayasanghatasajjikritavarayudhah | ratnakarasutakantikrantikirtivivardhanah || 126||
    lambodaramahabhimavapurdiptakritasurah | varunadidigishanasvarcitarcanacarcitah || 127|| shankaraikapriyapremanayanandavarddhanah
    | shodashasvaritalapagitaganavicakshanah || 128|| samastadurgatisarinnathottaranakodupah | haradibrahmavaikunthabrahmagitadipathakah
    || 129|| kshamapuritahritpadmasamrakshitacaracarah | tarankamantravarnaikavigrahojjvalavigrahah ||
    130|| akaradikshakarantavidyabhushitavigrahah | om shrivinayako om hrim vighnadhyaksho ganadhipah
    || 131|| herambo modakaharo vakratundo vidhih smritah | vedantagito vidyarthisiddhamantrah shadaksharah
    || 132|| ganesho varado devo dvadashaksharamantritah | saptakotimahamantramantritasheshavigrahah ||
    133|| gangeyo ganasevyashca om shridvaimaturah shivah | om hrim shrim klim glaum ga~ devo mahaganapatih
    prabhuh || 134|| idam namasahasram tu mahaganapateh smritam | guhyam gopyatamam siddham sarvatantreshu
    gopitam || 135|| sarvamantramayam divyam sarvavighnavinashanam | grahataramayam rashivarnapanktisamanvitam
    || 136|| sarvavidyamayam brahmasadhanam sadhakapriyam | ganeshasya ca sarvasvam rahasyam tridivaukasam
    || 137|| yatheshtaphaladam loke manorathaprapuranam | ashtasiddhimayam shreshtham sadhakanam jayapradam
    || 138|| vinarcanam vina homam vinanyasam vina japam | animadyashtasiddhinam sadhanam smritimatratah
    || 139|| caturthyamardharatre tu pathenmantri catushpathe | likhedbhurje mahadevi
  devanagari: पुनर्जेता पुनर्जीवः पुनर्वसुः । तिमिरास्तिमिकेतुश्च तितिषासुरघातनः ॥ ७०॥ तिष्यस्तुलाधरो
    जृम्भो विश्लेषाश्लेषदानराट् । मानदो माधवो माधो वाचालो मघवोपमः ॥ ७१॥ मध्यो मघाप्रियो मेघो महाशुण्डो
    महाभुजः । पूर्वफाल्गुनिकः स्फीत फल्गुरुत्तरफाल्गुनः ॥ ७२॥ फेनिलो ब्रह्मदो ब्रह्मा सप्ततन्तुसमाश्रयः
    । घोणाहस्तश्चतुर्हस्तो हस्तिवक्त्रो हलायुधः ॥ ७३॥ चित्राम्बरोऽर्चितपदः स्वस्तिदः स्वस्तिविग्रहः ।
    विशाखः शिखिसेव्यश्च शिखिध्वजसहोदरः ॥ ७४॥ अणुरेणूत्करः स्फारो रुरुरेणुसुतो नरः । अनुराधाप्रियो राधः
    श्रीमाञ्छुक्लः शुचिस्मितः ॥ ७५॥ ज्येष्ठः श्रेष्ठार्चितपदो मूलं च त्रिजगद्गुरुः । शुचिश्चैव पूर्वाषाढश्चोत्तराषाढ
    ईश्वरः ॥ ७६॥ श्रव्योऽभिजिदनन्तात्मा श्रवो वेपितदानवः । श्रावणः श्रवणः श्रोता धनी धन्यो धनिष्ठकः ॥
    ७७॥ शातातपः शातकुम्भः शरज्ज्योतिः शताभिषक् । पूर्वाभाद्रपदो भद्रश्चोत्तराभाद्रपादितः ॥ ७८॥ रेणुकातनयो
    रामो रेवतीरमणो रमी । आश्वयुक्कार्तिकेयेष्टो मार्गशीर्षो मृगोत्तमः ॥ ७९॥ पौषेश्वरः फाल्गुनात्मा वसन्तश्चैत्रको
    मधुः । राज्यदोऽभिजिदात्मीयस्तारेशस्तारकद्युतिः ॥ ८०॥ प्रतीतः प्रोर्जितः प्रीतः परमः परमो हितः । परहा
    पञ्चभूः पञ्चवायुपूज्यः परिग्रहः ॥ ८१॥ पुराणागमविद्योगी महिषो रासभोऽग्रजः । ग्रहो मेषो वृषो मन्दो मन्मथो
    मिथुनाकृतिः ॥ ८२॥ कल्पभृत्कटको दीपो मर्कटः कर्कटो घृणिः । कुक्कुटो वनजो हंसः परमहंसः सृगालकः ॥ ८३॥
    सिंहः सिंहासनाभूष्यो मद्गुर्मूषकवाहनः । पुत्रदो नरकत्राता कन्याप्रीतः कुलोद्वहः ॥ ८४॥ अतुल्यरूपो बलदस्तुल्यभृत्तुल्यसाक्षिकः
    । अलिश्चापधरो धन्वी कच्छपो मकरो मणिः ॥ ८५॥ कुम्भभृत्कलशः कुब्जो मीनमांससुतर्पितः । राशिताराग्रहमयस्तिथिरूपो
    जगद्विभुः ॥ ८६॥ प्रतापी प्रतिपत्प्रेयोऽद्वितीयोऽद्वैतनिश्चितः । त्रिरूपश्च तृतीयाग्निस्त्रयीरूपस्त्रयीतनुः
    ॥ ८७॥ चतुर्थीवल्लभो देवो परागः पञ्चमीश्वरः । षड्रसास्वादविज्ञानः षष्ठी षष्टिकवत्सलः ॥ ८८॥ सप्तार्णवगतिः
    सारः सप्तमीश्वर रोहितः । अष्टमीनन्दनोत्तंसो नवमीभक्तिभावितः ॥ ८९॥ दशदिक्पतिपूज्यश्च दशमीद्रुहिणो द्रुतः
    । एकादशात्मगणपो द्वादशीयुगचर्चितः ॥ ९०॥ त्रयोदशमणिस्तुत्यश्चतुर्दशस्वरप्रियः । चतुर्दशेन्द्रसंस्तुत्यः
    पूर्णिमानन्दविग्रहः ॥ ९१॥ दर्शदर्शो दर्शनश्च वानप्रस्थो महेश्वरः । मौर्वी मधुरवाङ्मूलमूर्तिमान्मेघवाहनः
    ॥ ९२॥ महागजो जितक्रोधो जितशत्रुर्जयाश्रयः । रौद्रो रुद्रप्रियो रुद्रो रुद्रपुत्रोऽघनाशनः ॥ ९३॥ भवप्रियो
    भवानीष्टो भारभृद्भूतभावनः । गान्धर्वकुशलोऽकुण्ठो वैकुण्ठो विष्टरश्रवाः ॥ ९४॥ वृत्रहा विघ्नहा सीरः
    समस्तदुःखतापहा । मञ्जुरो मार्जरो मत्तो दुर्गापुत्रो दुरालसः ॥ ९५॥ अनन्तचित्सुधाधारो वीरो वीर्यैकसाधकः
    । भास्वन्मुकुटमाणिक्यः कूजत्किङ्किंणिजालकः ॥ ९६॥ शुण्डाधारी तुण्डचलः कुण्डली मुण्डमालकः । पद्माक्षः
    पद्महस्तश्च पद्मनाभसमर्चितः ॥ ९७॥ उद्धृताधरदन्ताढ्यो मालाभूषणभूषितः । मारदो वारणो लोलश्रवणः शूर्पकर्णकः
    ॥ ९८॥ बृहदुल्लासनासाढ्यो व्याप्तत्रैलोक्यमण्डलः । रत्नमण्डलमध्यस्थः कृशानुरूपशीलकः ॥ ९९॥ बृहत्कर्णाञ्चलोद्भूतवायुवीजितदिक्तटः
    । बृहदास्यरवाक्रान्तभीतब्रह्माण्डभाण्डकः ॥ १००॥ बृहत्पादसमाक्रान्तसप्तपातालदीपितः । बृहद्दन्तकृतात्युग्ररणानन्दरसालसः
    ॥ १०१॥ बृहद्धस्तधृताशेषायुधनिर्जितदानवः । स्फूरत्सिन्दूरवदनः स्फुरत्तेजोऽग्निलोचनः ॥ १०२॥ उद्दीपितमणिस्फूर्जन्नूपुरध्वनिनादितः
    । चलत्तोयप्रवाहाढ्यो नदीजलकणाकरः ॥ १०३॥ भ्रमत्कुञ्जरसङ्घातवन्दिताङ्घ्रिसरोरुहः । ब्रह्माच्युतमहारुद्रपुरस्सरसुरार्चितः
    ॥ १०४॥ अशेषशेषप्रभृतिव्यालजालोपसेवितः । गर्जत्पञ्चाननारावव्याप्ताकाशधरातलः ॥ १०५॥ हाहाहूहूगतात्युग्रस्वरविभ्रान्तमानसः
    । पञ्चाशद्वर्णबीजाख्यमन्त्रमन्त्रितविग्रहः ॥ १०६॥ वेदान्तशास्त्रपीयूषधाराऽऽप्लावितभूतलः । शङ्खध्वनिसमाक्रान्तपातालादिनभस्तलः
    ॥ १०७॥ चिन्तामणिर्महामल्लो बल्लहस्तो बलिः कविः । कृतत्रेतायुगोल्लासभासमानजगत्त्रयः ॥ १०८॥ द्वापरः
    परलोकैकः कर्मध्वान्तसुधाकरः । सुधाऽऽसिक्तवपुर्व्यासो ब्रह्माण्डादिकबाहुकः ॥ १०९॥ अकारादिक्षकारान्तवर्णपङ्क्तिसमुज्ज्वलः
    । अकाराकारप्रोद्गीतताननादनिनादितः ॥ ११०॥ इकारेकारमत्राढ्यमालाभ्रमणलालसः । उकारोकारप्रोद्गारिघोरनागोपवीतकः
    ॥ १११॥ ऋवर्णाङ्कितॠकारिपद्मद्वयसमुज्ज्वलः । लृकारयुतलॄकारशङ्खपूर्णदिगन्तरः ॥ ११२॥ एकारैककारगिरिजास्तनपानविचक्षणः
    । ओकारौकारविश्वादिकृतसृष्टिक्रमालसः ॥ ११३॥ अंअःवर्णावलीव्याप्तपादादिशीर्षमण्डलः । कर्णतालकृतात्युच्चैर्वायुवीजितनिर्जरः
    ॥ ११४॥ खगेशध्वजरत्नाङ्ककिरीटारुणपादकः । गर्विताशेषगन्धर्वगीततत्परश्रोत्रकः ॥ ११५॥ घनवाहनवागीशपुरस्सरसुरार्चितः
    । ङवर्णामृतधाराढ्यशोभमानैकदन्तकः ॥ ११६॥ चन्द्रकुङ्कुमजम्बाललिप्तसिन्दूरविग्रहः । छत्रचामररत्नाढ्यमुकुटालङ्कृताननः
    ॥ ११७॥ जटाबद्धमहानर्घमणिपङ्क्तिविराजितः । झङ्कारिमधुपव्रातगाननादविनादितः ॥ ११८॥ ञवर्णकृतसंहारदैत्यासृक्पर्णमुद्गरः
    । टकाराख्याफलास्वादवेपिताशेषमूर्धजः ॥ ११९॥ ठकाराद्यडकाराङ्कढकारानन्दतोषितः । णवर्णामृतपीयूषधाराधारसुधाकरः
    ॥ १२०॥ ताम्रसिन्दूरपूजाढ्यललाटफलकच्छविः । थकारधनपङ्क्त्यातिसन्तोषिताद्विजव्रजः ॥ १२१॥ दयामृतहृदम्भोजधृतत्रैलोक्यमण्डलः
    । धनदादिमहायक्षसंसेवितपदाम्बुजः ॥ १२२॥ नमिताशेषदेवौघकिरीटमणिरञ्जितः । परवर्गापवर्गादिभोगेच्छेदनदक्षकः
    ॥ १२३॥ फणिचक्रसमाक्रान्तगलमण्डलमण्डितः । बद्धभ्रूयुगभीमोग्रसन्तर्जितसुरासुरः ॥ १२४॥ भवानीहृदयानन्दवर्द्धनैकनिशाकरः
    । मदिराकलशस्फीतकरालैककराम्बुजः ॥ १२५॥ यज्ञान्तरायसङ्घातसज्जीकृतवरायुधः । रत्नाकरसुताकान्तिक्रान्तिकीर्तिविवर्धनः
    ॥ १२६॥ लम्बोदरमहाभीमवपुर्दीप्तकृतासुरः । वरुणादिदिगीशानस्वर्चितार्चनचर्चितः ॥ १२७॥ शङ्करैकप्रियप्रेमनयनान्दवर्द्धनः
    । षोडशस्वरितालापगीतगानविचक्षणः ॥ १२८॥ समस्तदुर्गतिसरिन्नाथोत्तारणकोडुपः । हरादिब्रह्मवैकुण्ठब्रह्मगीतादिपाठकः
    ॥ १२९॥ क्षमापूरितहृत्पद्मसंरक्षितचराचरः । ताराङ्कमन्त्रवर्णैकविग्रहोज्ज्वलविग्रहः ॥ १३०॥ अकारादिक्षकारान्तविद्याभूषितविग्रहः
    । ॐ श्रीविनायको ॐ ह्रीं विघ्नाध्यक्षो गणाधिपः ॥ १३१॥ हेरम्बो मोदकाहारो वक्रतुण्डो विधिः स्मृतः । वेदान्तगीतो
    विद्यार्थिसिद्धमन्त्रः षडक्षरः ॥ १३२॥ गणेशो वरदो देवो द्वादशाक्षरमन्त्रितः । सप्तकोटिमहामन्त्रमन्त्रिताशेषविग्रहः
    ॥ १३३॥ गाङ्गेयो गणसेव्यश्च ॐ श्रीद्वैमातुरः शिवः । ॐ ह्रीं श्रीं क्लीं ग्लौं गँ देवो महागणपतिः प्रभुः
    ॥ १३४॥ इदं नामसहस्रं तु महागणपतेः स्मृतम् । गुह्यं गोप्यतमं सिद्धं सर्वतन्त्रेषु गोपितम् ॥ १३५॥ सर्वमन्त्रमयं
    दिव्यं सर्वविघ्नविनाशनम् । ग्रहतारामयं राशिवर्णपङ्क्तिसमन्वितम् ॥ १३६॥ सर्वाविद्यामयं ब्रह्मसाधनं
    साधकप्रियम् । गणेशस्य च सर्वस्वं रहस्यं त्रिदिवौकसाम् ॥ १३७॥ यथेष्टफलदं लोके मनोरथप्रपूरणम् । अष्टसिद्धिमयं
    श्रेष्ठं साधकानां जयप्रदम् ॥ १३८॥ विनार्चनं विना होमं विनान्यासं विना जपम् । अणिमाद्यष्टसिद्धीनां
    साधनं स्मृतिमात्रतः ॥ १३९॥ चतुर्थ्यामर्धरात्रे तु पठेन्मन्त्री चतुष्पथे । लिखेद्भूर्जे महादेवि
