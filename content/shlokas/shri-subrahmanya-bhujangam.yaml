id: shri-subrahmanya-bhujangam
category: stotram
name:
  english: shri subrahmanya bhujangam
  devanagari: श्री सुब्रह्मण्य भुजङ्गम्
content:
  english: stada parvate rajate te'dhirudhah | itiva bruvangandhashailadhirudhah sa devo mude me sada
    shanmukho'stu ||6|| mahambhodhitire mahapapacore munindranukule sugandhakhyashaile | guhayam vasantam
    svabhasa lasantam janartim harantam shrayamo guham tam ||7|| lasatsvarnagehe nrinam kamadohe sumastomasamchannamanikyamance
    | samudyatsahasrarkatulyaprakasham sada bhavaye kartikeyam suresham ||8|| ranaddhamsake manjule'tyantashone
    manoharilavanyapiyushapurne | manahshatpado me bhavakleshataptah sada modatam skanda te padapadme
    ||9|| suvarnabhadivyambarairbhasamanam kvanatkinkinimekhalashobhamanam | lasaddhemapattena vidyotamanam
    katim bhavaye skanda te dipyamanam ||10 || pulindeshakanyaghanabhogatunga
  devanagari: स्तदा पर्वते राजते तेऽधिरूढाः । इतीव ब्रुवन्गन्धशैलाधिरूढः स देवो मुदे मे सदा षण्मुखोऽस्तु
    ॥६॥ महाम्भोधितीरे महापापचोरे मुनिन्द्रानुकूले सुगन्धाख्यशैले । गुहायां वसन्तं स्वभासा लसन्तं जनार्तिं
    हरन्तं श्रयामो गुहं तम् ॥७॥ लसत्स्वर्णगेहे नृणां कामदोहे सुमस्तोमसंछन्नमाणिक्यमञ्चे । समुद्यत्सहस्रार्कतुल्यप्रकाशं
    सदा भावये कार्तिकेयं सुरेशम् ॥८॥ रणद्धंसके मञ्जुलेऽत्यन्तशोणे मनोहारिलावण्यपीयूषपूर्णे । मनःषट्पदो
    मे भवक्लेशतप्तः सदा मोदतां स्कन्द ते पादपद्मे ॥९॥ सुवर्णाभदिव्याम्बरैर्भासमानां क्वणत्किङ्किणीमेखलाशोभमानाम्
    । लसद्धेमपट्टेन विद्योतमानां कटिं भावये स्कन्द ते दीप्यमानाम् ॥१० ॥ पुलिन्देशकन्याघनाभोगतुङ्ग
