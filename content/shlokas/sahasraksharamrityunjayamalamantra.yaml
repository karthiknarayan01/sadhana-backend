id: sahasraksharamrityunjayamalamantra
category: mantra
name:
  english: sahasraksharamrityunjayamalamantra
  devanagari: सहस्राक्षरमृत्युन्जयमालामन्त्र
content:
  english: vasukitakshakakarkotakashankhakulikapadmamahapadmetyashtanagakulabhushanaya pranavasvarupaya
    cidakashayakashadisvarupaya grahanakshatramaline sakalaya kalankarahitaya sakalalokaikakartre sakalalokaikasamhartre
    sakalalokaikabhartre sakalalokaikasakshine sakalanigamedyaya sakalavedantaparagaya sakalalokaikavarapradaya
    sakalalokaikashankaraya shashankashekharaya shashvatanijavasaya nirabhasaya niramayaya nirmalaya nirlobhaya
    nirmohaya nirmadaya nishcintaya nirahankaraya nirakulaya nishkalankaya nirgunaya nishkamaya nirupaplavaya
    niravadyaya nirantaraya nishkaranaya niratankaya nishprapancaya nissangaya nirdvandvaya niradharaya
    nirogaya nishkrodhaya nirgamaya nishpapaya nirbhayaya nirvikalpaya nirbhedaya nishkriyaya nistulaya
    nissamshayaya niranjanaya nirupamavibhavaya nityashuddhabuddhaparipurnasaccidanandadrishyaya paramashantasvarupaya
    tejorupaya tejomayaya jaya jaya maharaudrabhadravataramahabhairava kalabhairava kalpantabhairava kapalamaladhara
    khatvanga
  devanagari: वासुकितक्षककर्कोटकशङ्खकुलिकपद्ममहापद्मेत्यष्टनागकुलभूषणाय प्रणवस्वरूपाय चिदाकाशायाकाशादिस्वरूपाय
    ग्रहनक्षत्रमालिने सकलाय कलङ्करहिताय सकललोकैककर्त्रे सकललोकैकसंहर्त्रे सकललोकैकभर्त्रे सकललोकैकसाक्षिणे
    सकलनिगमेड्याय सकलवेदान्तपारगाय सकललोकैकवरप्रदाय सकललोकैकशङ्कराय शशाङ्कशेखराय शाश्वतनिजावासाय निराभासाय
    निरामयाय निर्मलाय निर्लोभाय निर्मोहाय निर्मदाय निश्चिन्ताय निरहङ्काराय निराकुलाय निष्कलङ्काय निर्गुणाय
    निष्कामाय निरूपप्लवाय निरवद्याय निरन्तराय निष्कारणाय निरातङ्काय निष्प्रपञ्चाय निस्सङ्गाय निर्द्वन्द्वाय
    निराधाराय नीरोगाय निष्क्रोधाय निर्गमाय निष्पापाय निर्भयाय निर्विकल्पाय निर्भेदाय निष्क्रियाय निस्तुलाय
    निस्संशयाय निरञ्जनाय निरूपमविभवाय नित्यशुद्धबुद्धपरिपूर्णसच्चिदानन्दादृश्याय परमशान्तस्वरूपाय तेजोरूपाय
    तेजोमयाय जय जय महारौद्रभद्रावतारमहाभैरव कालभैरव कल्पान्तभैरव कपालमालाधर खट्वाङ्ग
meaning: {}
