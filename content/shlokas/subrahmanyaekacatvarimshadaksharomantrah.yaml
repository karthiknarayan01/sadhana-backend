id: subrahmanyaekacatvarimshadaksharomantrah
category: mantra
name:
  english: subrahmanyaekacatvarimshadaksharomantrah
  devanagari: सुब्रह्मण्यएकचत्वारिंशदक्षरोमन्त्रः
content:
  english: ringarasarodayam || dhyayamipsitasiddhidam shivasutam shridvadashaksham guham khetam kukkutamankusham
    ca varadam pasham dhanushcakrakam | vajram shaktimasim ca shulamabhayam dorbhidhritam shanmukham dhyayeccittamayuravahanagatam
    citrambaralankritam ||
  devanagari: ृङ्गारसारोदयम् ॥ ध्यायामीप्सितसिद्धिदं शिवसुतं श्रीद्वादशाक्षं गुहं खेटं कुक्कुटमङ्कुशं
    च वरदं पाशं धनुश्चक्रकम् । वज्रं शक्तिमसिं च शूलमभयं दोर्भिधृतं षण्मुखं ध्यायेच्चित्तमयूरवाहनगतं चित्राम्बरालङ्कृतम्
    ॥
meaning: {}
