id: vasantakamapsarasakritamnaranarayanastotram
category: stotram
name:
  english: vasantakamapsarasakritamnaranarayanastotram
  devanagari: वसन्तकामाप्सरसकृतंनरनारायणस्तोत्रम्
content:
  english: vasantakamapsarasakritam naranarayanastotram vasantakamapsarasa ucuh | prasidatu jagaddhata
    yasya devasya mayaya | mohitah sma vijanimo nantaram vidyate dvayoh || 46|| prasidatu sa vam devo
    yasya rupamidam dvidha | dhamabhutasya lokanamanaderapratishthatah || 47|| naranarayanau devau shankhacakrayudhavubhau
    | astam prasadasumukhavasmakamaparadhinam || 48|| nidhanam sarvavidyanam sarvapapavananalah | narayano'to
    bhagavan sarvapapam vyapohatu || 49|| sharngacihnayudhah shrimanatmajnanamayo'naghah | narah samastapapani
    hatatma sarvadehinam || 50|| jatakalapabaddho'yamanayornah kshamavatoh | saumyasyadrishtih papani
    hantum janmarjitani vai || 51|| tatha''tmavidyadoshena yo'paradhah krito mahan | trailokyavandyau
    yau nathau vilobhayitumagatah || 52|| prasida deva vijnanaghana mudhadrishamiva | bhavanti santah
    satatam svadharmaparipalakah || 53|| drishtvaitannah samutpannam yatha striratnamuttamam | tvayi narayanotpanna
    shreshtha paravati matih || 54|| tena satyena satyatmanparamatmansanatana | narayana prasidesha sarvalokaparayana
    || 55|| prasannabuddhe shantatmanprasannavadanekshana | prasida yoginamisha nara sarvagatacyuta ||
    56|| namasyamo naram devam tatha narayanam harim | namo naraya namyaya namo narayanaya ca || 57||
    prasannanamanathanam tatha nathavatam prabho | sham karotu naro'smakam sham narayana dehi nah || 58||
    iti shriskandapurane avantyakhande revakhande dvinavatyadhika
  devanagari: वसन्तकामाप्सरसकृतं नरनारायणस्तोत्रम् वसन्तकामाप्सरस ऊचुः । प्रसीदतु जगद्धाता यस्य देवस्य
    मायया । मोहिताः स्म विजानीमो नान्तरं विद्यते द्वयोः ॥ ४६॥ प्रसीदतु स वां देवो यस्य रूपमिदं द्विधा
    । धामभूतस्य लोकानामनादेरप्रतिष्ठतः ॥ ४७॥ नरनारायणौ देवौ शङ्खचक्रायुधावुभौ । आस्तां प्रसादसुमुखावस्माकमपराधिनाम्
    ॥ ४८॥ निधानं सर्वविद्यानां सर्वपापवनानलः । नारायणोऽतो भगवान् सर्वपापं व्यपोहतु ॥ ४९॥ शार्ङ्गचिह्नायुधः
    श्रीमानात्मज्ञानमयोऽनघः । नरः समस्तपापानि हतात्मा सर्वदेहिनाम् ॥ ५०॥ जटाकलापबद्धोऽयमनयोर्नः क्षमावतोः
    । सौम्यास्यदृष्टिः पापानि हन्तुं जन्मार्जितानि वै ॥ ५१॥ तथाऽऽत्मविद्यादोषेण योऽपराधः कृतो महान् ।
    त्रैलोक्यवन्द्यौ यौ नाथौ विलोभयितुमागताः ॥ ५२॥ प्रसीद देव विज्ञानघन मूढदृशामिव । भवन्ति सन्तः सततं
    स्वधर्मपरिपालकाः ॥ ५३॥ दृष्ट्वैतन्नः समुत्पन्नं यथा स्त्रीरत्नमुत्तमम् । त्वयि नारायणोत्पन्ना श्रेष्ठा
    पारवती मतिः ॥ ५४॥ तेन सत्येन सत्यात्मन्परमात्मन्सनातन । नारायण प्रसीदेश सर्वलोकपरायण ॥ ५५॥ प्रसन्नबुद्धे
    शान्तात्मन्प्रसन्नवदनेक्षण । प्रसीद योगिनामीश नर सर्वगताच्युत ॥ ५६॥ नमस्यामो नरं देवं तथा नारायणं
    हरिम् । नमो नराय नम्याय नमो नारायणाय च ॥ ५७॥ प्रसन्नानामनाथानां तथा नाथवतां प्रभो । शं करोतु नरोऽस्माकं
    शं नारायण देहि नः ॥ ५८॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे रेवाखण्डे द्विनवत्यधिक
