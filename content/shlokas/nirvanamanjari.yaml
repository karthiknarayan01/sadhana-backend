id: nirvanamanjari
category: stotram
name:
  english: nirvanamanjari
  devanagari: निर्वाणमञ्जरी
content:
  english: aham namaro naiva martyo na daityo na gandharvayakshah pishacaprabhedah | pumannaiva na stri
    tatha naiva shandah prakrishtaprakashasvarupah shivo'ham || 1 || aham naiva balo yuva naiva vriddho
    na varni na ca brahmacari grihasthah | vanastho'pi naham na samnyastadharma jagajjanmanashaikahetuh
    shivo'ham || 2 || aham naiva meyastirobhutamaya tathaivekshitum mam prithannastyupayah | samashlishtakayatrayo
    apyadvitiyah sadatindriyah sarvarupah shivo'ham || 3 || aham naiva manta na ganta na vakta na karta
    na bhokta na muktashramasthah | yathaham manovrittibhedasvarupa
  devanagari: अहं नामरो नैव मर्त्यो न दैत्यो न गन्धर्वयक्षः पिशाचप्रभेदः । पुमान्नैव न स्त्री तथा नैव
    षण्डः प्रकृष्टप्रकाशस्वरूपः शिवोऽहम् ॥ १ ॥ अहं नैव बालो युवा नैव वृद्धो न वर्णी न च ब्रह्मचारी गृहस्थः
    । वनस्थोऽपि नाहं न संन्यस्तधर्मा जगज्जन्मनाशैकहेतुः शिवोऽहम् ॥ २ ॥ अहं नैव मेयस्तिरोभूतमाया तथैवेक्षितुं
    मां पृथङ्नास्त्युपायः । समाश्लिष्टकायत्रयो अप्यद्वितीयः सदातीन्द्रियः सर्वरूपः शिवोऽहम् ॥ ३ ॥ अहं
    नैव मन्ता न गन्ता न वक्ता न कर्ता न भोक्ता न मुक्ताश्रमस्थः । यथाहं मनोवृत्तिभेदस्वरूप
meaning: {}
