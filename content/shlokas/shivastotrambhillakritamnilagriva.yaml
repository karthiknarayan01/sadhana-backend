id: shivastotrambhillakritamnilagriva
category: stotram
name:
  english: shivastotrambhillakritamnilagriva
  devanagari: शिवस्तोत्रम्भिल्लकृतंनीलग्रीव
content:
  english: bhillakritam nilagrivashivastotram sarvavyapi sarvabhutantaratma sakshi vetta nirgunashceshvarashca
    | somo nityo nirvikarashcidatma nilagrivah patu mamadhiduhkhat || 180|| mayatito mohitasheshalokah
    somakarah samavedasvarupah | sarvashasyah sarvarupo mahesho nilagrivah patu mamadhiduhkhat || 181||
    vyaktavyaktanadidharmabhigamyo vyaktavyaktanadidharmabhigabhyah | vyaktavyakta'nadivedabhigamyo nilagrivah
    patu mamadhiduhkhat || 182|| yam vedanta naiva jananti devam yasmannityam vedavaco nivrittah | yam
    brahmadya naiva jananti so'yam nilagrivah patu mamadhiduhkhat || 183|| yatsavyangadudbhavah srishtikartuh
    yadvamangajjanma samprapa vishnuh | yah sarveshah so'yamadyantashunyo nilagrivah patu mamadhiduhkhat
    || 184|| yam sarvesham tattvato vedanishtha vijnayesham pujayantyadarena | so'yam sharvah sarvavedantavedyo
    nilagrivah patu mamadhiduhkhat || 185|| yasyapangaspandamatrena nityam brahmopendrendradayah kampamanah
    | dure tishthantyanvaham so'yamisho nilagrivah patu mamadhiduhkhat || 186|| yatpadabjam vishnuratyantabhaktya
    sviyam netram samyagadutkhaya ramyam | svabhishtartham pujayamasa so'yam nilagrivah patu mamadhiduhkhat
    || 187|| yasya smritya sarvapapaughanasho yatpujato ghorasamsaranashah | yasya stutya muktiraptaiva
    so'yam nilagrivah patu mamadhiduhkhat || 188|| || iti shivarahasyantargate bhillakritam nilagrivashivastotram
    sampurnam ||
  devanagari: भिल्लकृतं नीलग्रीवशिवस्तोत्रम् सर्वव्यापी सर्वभूतान्तरात्मा साक्षी वेत्ता निर्गुणश्चेश्वरश्च
    । सोमो नित्यो निर्विकारश्चिदात्मा नीलग्रीवः पातु मामाधिदुःखात् ॥ १८०॥ मायातीतो मोहिताशेषलोकः सोमाकारः
    सामवेदस्वरूपः । सर्वाशास्यः सर्वरूपो महेशो नीलग्रीवः पातु मामाधिदुःखात् ॥ १८१॥ व्यक्ताव्याक्तानादिधर्माभिगम्यो
    व्यक्ताव्याक्तानादिधर्माभिगभ्यः । व्यक्ताव्यक्ताऽनादिवेदाभिगम्यो नीलग्रीवः पातु मामाधिदुःखात् ॥ १८२॥
    यं वेदान्ता नैव जानन्ति देवं यस्मान्नित्यं वेदवाचो निवृत्ताः । यं ब्रह्माद्या नैव जानन्ति सोऽयं नीलग्रीवः
    पातु मामाधिदुःखात् ॥ १८३॥ यत्सव्याङ्गादुद्भवः सृष्टिकर्तुः यद्वामाङ्गाज्जन्म सम्प्राप विष्णुः । यः
    सर्वेशः सोऽयमाद्यन्तशून्यो नीलग्रीवः पातु मामाधिदुःखात् ॥ १८४॥ यं सर्वेशं तत्त्वतो वेदनिष्ठा विज्ञायेशं
    पूजयन्त्यादरेण । सोऽयं शर्वः सर्ववेदान्तवेद्यो नीलग्रीवः पातु मामाधिदुःखात् ॥ १८५॥ यस्यापाङ्गस्पन्दमात्रेण
    नित्यं ब्रह्मोपेन्द्रेन्द्रादयः कम्पमानाः । दूरे तिष्ठन्त्यन्वहं सोऽयमीशो नीलग्रीवः पातु मामाधिदुःखात्
    ॥ १८६॥ यत्पादाब्जं विष्णुरत्यन्तभक्त्या स्वीयं नेत्रं सम्यगदुत्खाय रम्यम् । स्वाभीष्टार्थं पूजयामास
    सोऽयं नीलग्रीवः पातु मामाधिदुःखात् ॥ १८७॥ यस्य स्मृत्या सर्वपापौघनाशो यत्पूजातो घोरसंसारनाशः । यस्य
    स्तुत्या मुक्तिराप्तैव सोऽयं नीलग्रीवः पातु मामाधिदुःखात् ॥ १८८॥ ॥ इति शिवरहस्यान्तर्गते भिल्लकृतं
    नीलग्रीवशिवस्तोत्रं सम्पूर्णम् ॥
