id: sri-lakshmi-narayana-hrudaya-stotram
category: stotram
name:
  english: Sri Lakshmi Narayana Hrudaya Stotram
content:
  english: atha narayana hridaya stotram asya shrinarayanahridayastotramantrasya bhargava rishih shrilakshminarayano
    devata shrilakshminarayana prityarthe jape viniyogah | karanyasah | om narayanah param jyotiriti angushthabhyam
    namah | narayanah param brahmeti tarjanibhyam namah | narayanah paro deva iti madhyamabhyam namah
    | narayanah param dhameti anamikabhyam namah | narayanah paro dharma iti kanishthikabhyam namah |
    vishvam narayana iti karatalakaraprishthabhyam namah | anganyasah | narayanah param jyotiriti hridayaya
    namah | narayanah param brahmeti shirase svaha | narayanah paro deva iti shikhayai vaushat | narayanah
    param dhameti kavacaya hum | narayanah paro dharma iti netrabhyam vaushat | vishvam narayana iti astraya
    phat | digbandhah | om aindryadidashadisham om namah sudarshanaya sahasraraya hum phat badhnami namashcakraya
    svaha | iti pratidisham yojyam | atha dhyanam | udyadadityasankasham pitavasam caturbhujam | shankhacakragadapanim
    dhyayellakshmipatim harim || || trailokyadharacakram tadupari kamatham tatra canantabhogi tanmadhye
    bhumipadmankushashikharadalam karnikabhutamerum | tatrastham shantamurtim manimayamakutam kundalodbhasitangam
    lakshminarayanakhyam sarasijanayanam santatam cintayami || || atha mulashtakam | om || narayanah param
    jyotiratma narayanah parah | narayanah param brahma narayana namo'stu te || || narayanah paro devo
    dhata narayanah parah | narayanah paro dhata narayana namo'stu te || || narayanah param dhama dhyanam
    narayanah parah | narayana paro dharmo narayana namo'stu te || || narayanah parovedyah vidya narayanah
    parah | vishvam narayanah sakshannarayana namo'stu te || || narayanadvidhirjato jato narayanadbhavah
    | jato narayanadindro narayana namo'stu te || || ravirnarayanastejah candro narayano mahah | vahnirnarayanah
    sakshannarayana namo'stu te || || narayana upasyah syadgururnarayanah parah | narayanah paro bodho
    narayana namo'stu te || || narayanah phalam mukhyam siddhirnarayanah sukham | sevyonarayanah shuddho
    narayana namo'stu te || atha prarthanadashakam | narayana tvamevasi daharakhye hridi sthitah | prerakah
    preryamananam tvaya preritamanasah || || tvadajnam shirasa dhritva japami janapavanam | nanopasanamarganam
    bhavakridbhavabodhakah || || bhavarthakridbhavatito bhava saukhyaprado mama | tvanmayamohitam vishvam
    tvayaiva parikalpitam || || tvadadhishthanamatrena sa vai sarvarthakarini | tvametam ca puraskritya
    sarvakamanpradarshaya || || na me tvadanyastratasti tvadanyanna hi daivatam | tvadanyam na hi janami
    palakam punyavardhanam || || yavatsamsariko bhavo manasstho bhavanatmakah | tavatsiddhirbhavetsadhya
    sarvatha sarvada vibho || || papinamahamevagryo dayalunam tvamagranih | dayaniyo madanyo'sti tava
    ko'tra jagattraye || || tvayaham naiva srishtashcenna syattava dayaluta | amayo va na srishtashcedaushadhasya
    vrithodayah || || papasanghaparishrantah papatma paparupadhrit | tvadanyah ko'tra papebhyastratasti
    jagatitale || || tvameva mata ca pita tvameva tvameva bandhushca sakha tvameva | tvameva sevyashca
    gurustvameva tvameva sarvam mama deva deva || || prarthanadashakam caiva mulashtakamatah param | yah
    pathecchrinuyannityam tasya lakshmih sthira bhavet || || narayanasya hridayam sarvabhishtaphalapradam
    | lakshmihridayakam stotram yadi cettadvinakritam || || tatsarvam nishphalam proktam lakshmih kruddhyati
    sarvada | etatsankalitam stotram sarvakamaphalapradam || || lakshmihridayakam caiva tatha narayanatmakam
    | japedyah sankalikritya sarvabhishtamavapnuyat || || narayanasya hridayamadau japtva tatah param
    | lakshmihridayakam stotram japennarayanam punah || || punarnarayanam japtva punarlakshminutim japet
    | punarnarayanam japyam sankalikaranam bhavet || || evam madhye dvivarena japetsankalitam tu tat |
    lakshmihridayakam stotram sarvakamaprakashitam || || tadvajjapadikam kuryadetatsankalitam shubham
    | sarvankamanavapnoti adhivyadhibhayam haret || || gopyametatsada kuryanna sarvatra prakashayet |
    iti guhyatamam shastram praptam brahmadikaih pura || || tasmatsarvaprayatnena gopayetsadhayesudhih
    | yatraitatpustakam tishthellakshminarayanatmakam || || bhutapaishacavetala bhayam naiva tu sarvada
    | lakshmihridayakam proktam vidhina sadhayetsudhih || || bhriguvare ca ratrau ca pujayetpustakadvayam
    | sarvatha sarvada satyam gopayetsadhayetsudhih | gopanatsadhanalloke dhanyo bhavati tattvatah ||
    || ityatharvarahasye uttarabhage narayanahridayam sampurnam | atha lakshmi hridaya stotram asya shri
    mahalakshmihridayastotra mahamantrasya bhargava rishih anushtupadini nanachandamsi adyadi shrimahalakshmirdevata
    adyadimahalakshmi prasadasiddhyartham jape viniyogah || rishyadinyasah om bhargavrishaye namah shirasi
    | om anushtupadinanachandobhyo namo mukhe | om adyadishrimahalakshmi devatayai namo hridaye | om shrim
    bijaya namo guhye | om hrim shaktaye namah padayoh | om aim kilakaya namo nabhau | om viniyogaya namah
    sarvange | karanyasah om shrim angushthabhyam namah | om hrim tarjanibhyam namah | om aim madhyamabhyam
    namah | om shrim anamikabhyam namah | om hrim kanishthikabhyam namah | om aim karatala karaprishthabhyam
    namah | anganyasah om shrim hridayaya namah | om hrim shirase svaha | om aim shikhayai vashat | om
    shrim kavacaya hum | om hrim netratrayaya vaushat | om aim astraya phat | om shrim hrim aim iti digbandhah
    | atha dhyanam | hastadvayena kamale dharayantim svalilaya | haranupurasamyuktam lakshmim devim vicintaye
    || kausheyapitavasanamaravindanetram padmadvayabhayavarodyatapadmahastam | udyacchatarkasadrishim
    paramankasamstham dhyayedvidhishanatapadayugam janitrim || pitavastram suvarnangim padmahastadvayanvitam
    | lakshmim dhyatveti mantrena sa bhavetprithivipatih || matulungam gadam khetam panau patram ca bibhrati
    | nagam lingam ca yonim ca bibhratim caiva murdhani || iti dhyatva manasopacaraih sampujya | shankhacakragadahaste
    shubhravarne suvasini | mama dehi varam lakshmih sarvasiddhipradayini | iti samprarthya om shrim hrim
    aim mahalakshmyai kamaladharinyai simhavahinyai svaha iti mantram japtva punah purvavaddhridayadi
    shadanganyasam kritva stotram pathet | stotram | vande lakshmim paramashivamayim shuddhajambunadabham
    tejorupam kanakavasanam sarvabhushojjvalangim | bijapuram kanakakalasham hemapadmam dadhana madyam
    shaktim sakalajananim vishnuvamankasamstham || || shrimatsaubhagyajananim staumi lakshmim sanatanim
    | sarvakamaphalavaptisadhanaikasukhavaham || || smarami nityam deveshi tvaya preritamanasah | tvadajnam
    shirasa dhritva bhajami parameshvarim || || samastasampatsukhadam mahashriyam samastasaubhagyakarim
    mahashriyam | samastakalyanakarim mahashriyam bhajamyaham jnanakarim mahashriyam || || vijnanasampatsukhadam
    sanatanim vicitravagbhutikarim manoharam | anantasammodasukhapradayinim namamyaham bhutikarim haripriyam
    || || samastabhutantarasamsthita tvam samastabhoktrishvari vishvarupe | tannasti yattvadvyatiriktavastu
    tvatpadapadmam pranamamyaham shrih || || daridrya duhkhaughatamopahantri tvatpadapadmam mayi sannidhatsva
    | dinartivicchedanahetubhutaih kripakatakshairabhishinca mam shrih || || amba prasida karunasudhayardradrishtya
    mam tvatkripadravinagehamimam kurushva | alokaya pranatahridgatashokahantri tvatpadapadmayugalam pranamamyaham
    shrih || || shantyai namo'stu sharanagatarakshanayai kantyai namo'stu kamaniyagunashrayayai | kshantyai
    namo'stu duritakshayakaranayai datryai namo'stu dhanadhanyasamriddhidayai || || shaktyai namo'stu
    shashishekharasamstutayai ratyai namo'stu rajanikarasodarayai | bhaktyai namo'stu bhavasagaratarakayai
    matyai namo'stu madhusudanavallabhayai || || lakshmyai namo'stu shubhalakshanalakshitayai siddhyai
    namo'stu shivasiddhasupujitayai | dhrityai namo'stvamitadurgatibhanjanayai gatyai namo'stu varasadgatidayikayai
    || || devyai namo'stu divi devaganarcitayai bhutyai namo'stu bhuvanartivinashanayai | dhatryai namo'stu
    dharanidharavallabhayai pushtyai namo'stu purushottamavallabhayai || || sutivradaridryaviduhkhahantryai
    namo'stu te sarvabhayapahantryai | shrivishnuvakshahsthalasamsthitayai namo namah sarvavibhutidayai
    || || jayatu jayatu lakshmirlakshanalankritangi jayatu jayatu padma padmasadmabhivandya | jayatu jayatu
    vidya vishnuvamankasamstha jayatu jayatu samyaksarvasampatkari shrih || || jayatu jayatu devi devasanghabhipujya
    jayatu jayatu bhadra bhargavi bhagyarupa | jayatu jayatu nitya nirmalajnanavedya jayatu jayatu satya
    sarvabhutantarastha || || jayatu jayatu ramya ratnagarbhantarastha jayatu jayatu shuddha shuddhajambunadabha
    | jayatu jayatu kanta kantimadbhasitangi jayatu jayatu shanta shighramagaccha saumye || || yasyah
    kalayah kamalodbhavadya rudrashca shakra pramukhashca devah | jivanti sarve'pi sashaktayaste prabhutvamaptah
    paramayushaste || || lilekha nitile vidhirmama lipim visrijyantaram tvaya vilikhitavyametaditi tatphalapraptaye
    | tadantaraphalesphutam kamalavasini shririmam samarpaya samudrikam sakalabhagyasamsucikam || || kalaya
    te yatha devi jivanti sacaracarah | tatha sampatkare lakshmi sarvada samprasida me || || yatha vishnurdhruve
    nityam svakalam sannyaveshayat | tathaiva svakalam lakshmi mayi samyak samarpaya || || sarvasaukhyaprade
    devi bhaktanamabhayaprade | acalam kuru yatnena kalam mayi niveshitam || || mudastam matphale paramapadalakshmih
    sphutakala sada vaikunthashrirnivasatu kala me nayanayoh | vasetsatye loke mama vacasi lakshmirvarakala
    shriyah shvetadvipe nivasatu kala me svakarayoh || || tavannityam mamangeshu kshirabdhau shrikala
    vaset | suryacandramasau yavadyavallakshmipatih shriyah || || sarvamangalasampurna sarvaishvaryasamanvita
    | adyadi shrirmahalakshmi tvatkala mayi tishthatu || || ajnanatimiram hantum shuddhajnanaprakashika
    | sarvaishvaryaprada me'stu tvatkala mayi samsthita || || alakshmim haratu kshipram tamah suryaprabha
    yatha | vitanotu mama shreyastvatkala mayi samsthita || || aishvaryamangalotpattistvatkalayam nidhiyate
    | mayi tasmatkritartho'smi patramasmi sthitestava || || bhavadaveshabhagyarho bhagyavanasmi bhargavi
    | tvatprasadatpavitro'ham lokamatarnamo'stu te || || punasi mam tvatkalayaiva yasma datah samagaccha
    mamagratastvam | param padam shrirbhava suprasanna mayyacyutena pravishadilakshmih || || shrivaikunthasthite
    lakshmi samagaccha mamagratah | narayanena saha mam kripadrishtya'valokaya || || satyalokasthite lakshmi
    tvam mamagaccha sannidhim | vasudevena sahita prasida varada bhava || || shvetadvipasthite lakshmi
    shighramagaccha suvrate | vishnuna sahite devi jaganmatah prasida me || || kshirambudhisthite lakshmi
    samagaccha samadhava | tvatkripadrishtisudhaya satatam mam vilokaya || || ratnagarbhasthite lakshmi
    paripurne hiranmaye | samagaccha samagaccha sthitva''shu purato mama || || sthira bhava mahalakshmi
    nishcala bhava nirmale | prasanne kamale devi prasannahridaya bhava || || shridhare shrimahabhute
    tvadantahstham mahanidhim | shighramuddhritya puratah pradarshaya samarpaya || || vasundhare shrivasudhe
    vasudogdhri kripamaye | tvatkukshigatasarvasvam shighram me sampradarshaya || || vishnupriye ratnagarbhe
    samastaphalade shive | tvadgarbhagatahemadin sampradarshaya darshaya || || rasatalagate lakshmi shighramagaccha
    me purah | na jane paramam rupam matarme sampradarshaya || || avirbhava manovegacchighramagaccha me
    purah | ma vatsa bhairihetyuktva kamam gauriva raksha mam || || devi shighram samagaccha dharanigarbhasamsthite
    | matastvadbhrityabhrityo'ham mrigaye tvam kutuhalat || || uttishtha jagrihi tvam me samuttishtha
    sujagrihi | akshayan hemakalashan suvarnena supuritan || || nikshepanme samakrishya samuddhritya mamagratah
    | samunnatanana bhutva samadhehi dharantarat || || matsannidhim samagaccha madahitakriparasat | prasida
    shreyasam dogdhri lakshmirme nayanagratah || || atropavisha lakshmi tvam sthira bhava hiranmaye |
    susthira bhava sampritya prasida varada bhava || || anitamstu tatha devi nidhinme sampradarshaya |
    adya kshanena sahasa dattva samraksha mam sada || || mayi tishtha tatha nityam yathendradishu tishthasi
    | abhayam kuru me devi mahalakshmirnamo'stu te || || samagaccha mahalakshmi shuddhajambunadaprabhe
    | prasida puratah sthitva pranatam mam vilokaya || || lakshmirbhuvam gata bhasi yatra yatra hiranmayi
    | tatra tatra sthita tvam me tava rupam pradarshaya || || kridanti bahudha bhumau paripurnakripamayi
    | mama murdhani te hastamavilambitamarpaya || || phaladbhagyodaye lakshmi samastapuravasini | prasida
    me mahalakshmi paripurnamanorathe || || ayodhyadishu sarveshu nagareshu samasthite | vaibhavairvividhairyuktaih
    samagaccha mudanvite || || samagaccha samagaccha mamagre bhava susthira | karunarasanishyandanetradvaya
    vilasini || sannidhatsva mahalakshmi tvatpanim mama mastake | karunasudhaya mam tvamabhishincya sthiram
    kuru || || sarvarajagrihe lakshmi samagaccha balanvite | sthitva''shu purato me'dya prasadena'bhayam
    kuru || || sadaram mastake hastam mama tvam kripayarpaya | sarvarajagrihe lakshmi tvatkala mayi tishthatu
    || || adyadi shrimahalakshmi vishnuvamankasamsthite | pratyaksham kuru me rupam raksha mam sharanagatam
    || || prasida me mahalakshmi suprasida mahashive | acala bhava sampritya susthira bhava madgrihe ||
    || yavattishthanti vedashca yavaccandradivakarau | yavadvishnushca yavattvam tavatkuru kripam mayi
    || || candrikala yatha shukle vardhate sa dine dine | tatha daya te mayyeva vardhatamabhivardhatam
    || || yatha vaikunthanagare yatha vai kshirasagare | tatha madbhavane tishtha sthiram shrivishnuna
    saha || || yoginam hridaye nityam yatha tishthasi vishnuna | tatha madbhavane tishtha sthiram shrivishnuna
    saha || || narayanasya hridaye bhavati yathaste narayano'pi tava hritkamale yathaste | narayanastvamapi
    nityamubhau tathaiva tau tishthatam hridi mamapi dayanvitau shrih || || vijnanavriddhim hridaye kuru
    shrih saubhagyavriddhim kuru me grihe shrih | dayasuvriddhim kurutam mayi shrih suvarnavriddhim kuru
    me grihe shrih || || na mam tyajethah shritakalpavalli sadbhaktacintamanikamadheno | vishvasya matarbhava
    suprasanna grihe kalatreshu ca putravarge || || adyadimaye tvamajandabijam tvameva sakaranirakritistvam
    | tvaya dhritashcabjabhavandasangha shcitram caritram tava devi vishnoh || || brahmarudradayo deva
    vedashcapi na shaknuyuh | mahimanam tava stotum mando'ham shaknuyam katham || || amba tvadvatsavakyani
    suktasuktani yani ca | tani svikuru sarvajne dayalutvena sadaram || || bhavatim sharanam gatva kritarthah
    syuh puratanah | iti sancintya manasa tvamaham sharanam vraje || || ananta nityasukhinastvadbhaktastvatparayanah
    | iti vedapramanaddhi devi tvam sharanam vraje || || tava pratijna madbhakta na nashyantityapi kvacit
    | iti sancintya sancintya pranan sandharayamyaham || || tvadadhinastvaham matastvatkripa mayi vidyate
    | yavatsampurnakamah syattavaddehi dayanidhe || || kshanamatram na shaknomi jivitum tvatkripam vina
    | na jivantiha jalaja jalam tyaktva jalagrahah || || yatha hi putravatsalyajjanani prasnutastani |
    vatsam tvaritamagatya samprinayati vatsala || || yadi syam tava putro'ham mata tvam yadi mamaki |
    dayapayodharastanyasudhabhirabhishinca mam || || mrigyo na gunalesho'pi mayi doshaikamandire | pamsunam
    vrishtibindunam doshanam ca na me matih || || papinamahamevagryo dayalunam tvamagranih | dayaniyo
    madanyo'sti tava ko'tra jagattraye || || vidhinaham na srishtashcenna syattava dayaluta | amayo va
    na srishtashcedaushadhasya vrithodayah || || kripa madagraja kim te aham kim va tadagrajah | vicarya
    dehi me vittam tava devi dayanidhe || || mata pita tvam gurusadgatih shri stvameva sanjivanahetubhuta
    | anyam na manye jagadekanathe tvameva sarvam mama devi satye || || adyadilakshmirbhava suprasanna
    vishuddhavijnanasukhaikadogdhri | ajnanahantri trigunatirikta prajnananetri bhava suprasanna || ||
    asheshavagjadyamalapahantri navam navam spashtasuvakpradayini | mameha jihvagra suranganartaki bhava
    prasanna vadane ca me shrih || || samastasampatsuvirajamana samastatejashcayabhasamana | vishnupriye
    tvam bhava dipyamana vagdevata me nayane prasanna || || sarvapradarshe sakalarthade tvam prabhasulavanyadayapradogdhri
    | suvarnade tvam sumukhi bhava shri rhiranmayi me nayane prasanna || || sarvarthada sarvajagatprasutih
    sarveshvari sarvabhayapahantri | sarvonnata tvam sumukhi bhava shri rhiranmayi me nayane prasanna
    || || samastavighnaughavinashakarini samastabhaktoddharane vicakshana | anantasaubhagyasukhapradayini
    hiranmayi me nayane prasanna || || devi prasida dayaniyatamaya mahyam devadhinathabhavadevaganabhivandye
    | matastathaiva bhava sannihita drishorme patya samam mama mukhe bhava suprasanna || || ma vatsa bhairabhayadanakaro'rpitaste
    maulau mameti mayi dinadayanukampe | matah samarpaya muda karunakataksham mangalyabijamiha nah srija
    janma matah || || kataksha iha kamadhuktava manastu cintamanih karah surataruh sada navanidhistvamevendire
    | bhave tava dayaraso mama rasayanam canvaham mukham tava kalanidhirvividhavanchitarthapradam || ||
    yatha rasasparshanato'yaso'pi suvarnata syatkamale tatha te | katakshasamsparshanato janana mamangalanamapi
    mangalatvam || || dehiti nastiti vacah pravesha dbhito rame tvam sharanam prapadye | atah sada'sminnabhayaprada
    tvam sahaiva patya mayi sannidhehi || || kalpadrumena manina sahita suramya shriste kala mayi rasena
    rasayanena | astam yato mama shirahkaradrishtipada sprishtah suvarnavapushah sthirajangamah syuh ||
    || adyadivishnoh sthiradharmapatni tvameva patya mayi sannidhehi | adyadilakshmi tvadanugrahena pade
    pade me nidhidarshanam syat || || adyadilakshmihridayam pathedyah sa rajyalakshmimacalam tanoti |
    mahadaridro'pi bhaveddhanadhya stadanvaye shrih sthiratam prayati || || yasya smaranamatrena tushta
    syadvishnuvallabha | tasyabhishtam dadatyashu tam palayati putravat || || idam rahasyam hridayam sarvakamaphalapradam
    | japah pancasahasram tu purashcaranamucyate || || trikalamekakalam va naro bhaktisamanvitah | yah
    pathecchrinuyadvapi sa yati paramam shriyam || || mahalakshmim samuddishya nishi bhargavavasare |
    idam shrihridayam japtva pancavaram dhani bhavet || || anena hridayenannam garbhinya abhimantritam
    | dadati tatkule putro jayate shripatih svayam || || narena va'thava narya lakshmihridayamantrite
    | jale pite ca tadvamshe mandabhagyo na jayate || || ya ashvine masi ca shuklapakshe ramotsave sannihite
    subhaktya | pathettathaikottaravaravriddhya labhetsa sauvarnamayim suvrishtim || || ya ekabhakto'nvahamekavarsham
    vishuddhadhih saptativarajapi | sa mandabhagyo'pi ramakataksha dbhavetsahasrakshashatadhikashrih ||
    || shrishanghribhaktim haridasadasyam prasannamantrarthadridhaikanishtham | guroh smritim nirmalabodhabuddhim
    pradehi matah paramam padam shrih || || prithvipatitvam purushottamatvam vibhutivasam vividharthasiddhim
    | sampurnakirtim bahuvarshabhogam pradehi me lakshmi punah punastvam || || vadarthasiddhim bahulokavashyam
    vayah sthiratvam lalanasubhogam | pautradilabdhim sakalarthasiddhim pradehi me bhargavi janmajanmani
    || || suvarnavriddhim kuru me grihe shrih sudhanyavriddhim kuru me grihe shrih | kalyanavriddhim kuru
    me grihe shrih vibhutivriddhim kuru me grihe shrih || || dhyayellakshmim prahasitamukhim kotibalarkabhasam
    vidyudvarnambaravaradharam bhushanadhyam sushobham | bijapuram sarasijayugam bibhratim svarnapatram
    bhartrayuktam muhurabhayadam mahyamapyacyutashrih || || guhyatiguhyagoptri tvam grihanasmatkritam
    japam | siddhirbhavatu me devi tvatprasadanmayi sthita || || iti shriatharvanarahasye shrilakshmihridayastotram
    sampurnam ||
  devanagari: अथ नारायन हृदय स्तोत्रम् अस्य श्रीनारायणहृदयस्तोत्रमन्त्रस्य भार्गव ऋषिः श्रीलक्ष्मीनारायणो
    देवता श्रीलक्ष्मीनारायण प्रीत्यर्थे जपे विनियोगः । करन्यासः । ॐ नारायणः परं ज्योतिरिति अङ्गुष्ठाभ्यां
    नमः । नारायणः परं ब्रह्मेति तर्जनीभ्यां नमः । नारायणः परो देव इति मध्यमाभ्यां नमः । नारायणः परं धामेति
    अनामिकाभ्यां नमः । नारायणः परो धर्म इति कनिष्ठिकाभ्यां नमः । विश्वं नारायण इति करतलकरपृष्ठाभ्यां नमः
    । अङ्गन्यासः । नारायणः परं ज्योतिरिति हृदयाय नमः । नारायणः परं ब्रह्मेति शिरसे स्वाहा । नारायणः परो
    देव इति शिखायै वौषट् । नारायणः परं धामेति कवचाय हुम् । नारायणः परो धर्म इति नेत्राभ्यां वौषट् । विश्वं
    नारायण इति अस्त्राय फट् । दिग्बन्धः । ॐ ऐन्द्र्यादिदशदिशं ॐ नमः सुदर्शनाय सहस्राराय हुं फट् बध्नामि
    नमश्चक्राय स्वाहा । इति प्रतिदिशं योज्यम् । अथ ध्यानम् । उद्यादादित्यसङ्काशं पीतवासं चतुर्भुजम् ।
    शङ्खचक्रगदापाणिं ध्यायेल्लक्ष्मीपतिं हरिम् ॥ ॥ त्रैलोक्याधारचक्रं तदुपरि कमठं तत्र चानन्तभोगी तन्मध्ये
    भूमिपद्माङ्कुशशिखरदलं कर्णिकाभूतमेरुम् । तत्रस्थं शान्तमूर्तिं मणिमयमकुटं कुण्डलोद्भासिताङ्गं लक्ष्मीनारायणाख्यं
    सरसिजनयनं सन्ततं चिन्तयामि ॥ ॥ अथ मूलाष्टकम् । ओम् ॥ नारायणः परं ज्योतिरात्मा नारायणः परः । नारायणः
    परं ब्रह्म नारायण नमोऽस्तु ते ॥ ॥ नारायणः परो देवो धाता नारायणः परः । नारायणः परो धाता नारायण नमोऽस्तु
    ते ॥ ॥ नारायणः परं धाम ध्यानं नारायणः परः । नारायण परो धर्मो नारायण नमोऽस्तु ते ॥ ॥ नारायणः परोवेद्यः
    विद्या नारायणः परः । विश्वं नारायणः साक्षान्नारायण नमोऽस्तु ते ॥ ॥ नारायणाद्विधिर्जातो जातो नारायणाद्भवः
    । जातो नारायणादिन्द्रो नारायण नमोऽस्तु ते ॥ ॥ रविर्नारायणस्तेजः चन्द्रो नारायणो महः । वह्निर्नारायणः
    साक्षान्नारायण नमोऽस्तु ते ॥ ॥ नारायण उपास्यः स्याद्गुरुर्नारायणः परः । नारायणः परो बोधो नारायण नमोऽस्तु
    ते ॥ ॥ नारायणः फलं मुख्यं सिद्धिर्नारायणः सुखम् । सेव्योनारायणः शुद्धो नारायण नमोऽस्तु ते ॥ अथ प्रार्थनादशकम्
    । नारायण त्वमेवासि दहराख्ये हृदि स्थितः । प्रेरकः प्रेर्यमाणानां त्वया प्रेरितमानसः ॥ ॥ त्वदाज्ञां
    शिरसा धृत्वा जपामि जनपावनम् । नानोपासनमार्गाणां भवकृद्भावबोधकः ॥ ॥ भावार्थकृद्भवातीतो भव सौख्यप्रदो
    मम । त्वन्मायामोहितं विश्वं त्वयैव परिकल्पितम् ॥ ॥ त्वदधिष्ठानमात्रेण सा वै सर्वार्थकारिणी । त्वमेतां
    च पुरस्कृत्य सर्वकामान्प्रदर्शय ॥ ॥ न मे त्वदन्यस्त्रातास्ति त्वदन्यन्न हि दैवतम् । त्वदन्यं न हि
    जानामि पालकं पुण्यवर्धनम् ॥ ॥ यावत्सांसारिको भावो मनस्स्थो भावनात्मकः । तावत्सिद्धिर्भवेत्साध्या सर्वथा
    सर्वदा विभो ॥ ॥ पापिनामहमेवाग्र्यो दयालूनां त्वमग्रणीः । दयनीयो मदन्योऽस्ति तव कोऽत्र जगत्त्रये ॥
    ॥ त्वयाहं नैव सृष्टश्चेन्न स्यात्तव दयालुता । आमयो वा न सृष्टश्चेदौषधस्य वृथोदयः ॥ ॥ पापसङ्घपरिश्रान्तः
    पापात्मा पापरूपधृत् । त्वदन्यः कोऽत्र पापेभ्यस्त्रातास्ति जगतीतले ॥ ॥ त्वमेव माता च पिता त्वमेव त्वमेव
    बन्धुश्च सखा त्वमेव । त्वमेव सेव्यश्च गुरुस्त्वमेव त्वमेव सर्वं मम देव देव ॥ ॥ प्रार्थनादशकं चैव मूलाष्टकमतः
    परम् । यः पठेच्छृणुयान्नित्यं तस्य लक्ष्मीः स्थिरा भवेत् ॥ ॥ नारायणस्य हृदयं सर्वाभीष्टफलप्रदम् ।
    लक्ष्मीहृदयकं स्तोत्रं यदि चेत्तद्विनाकृतम् ॥ ॥ तत्सर्वं निष्फलं प्रोक्तं लक्ष्मीः क्रुद्ध्यति सर्वदा
    । एतत्सङ्कलितं स्तोत्रं सर्वकामफलप्रदम् ॥ ॥ लक्ष्मीहृदयकं चैव तथा नारायणात्मकम् । जपेद्यः सङ्कलीकृत्य
    सर्वाभीष्टमवाप्नुयात् ॥ ॥ नारायणस्य हृदयमादौ जप्त्वा ततः परम् । लक्ष्मीहृदयकं स्तोत्रं जपेन्नारायणं
    पुनः ॥ ॥ पुनर्नारायणं जप्त्वा पुनर्लक्ष्मीनुतिं जपेत् । पुनर्नारायणं जाप्यं सङ्कलीकरणं भवेत् ॥ ॥ एवं
    मध्ये द्विवारेण जपेत्सङ्कलितं तु तत् । लक्ष्मीहृदयकं स्तोत्रं सर्वकामप्रकाशितम् ॥ ॥ तद्वज्जपादिकं
    कुर्यादेतत्सङ्कलितं शुभम् । सर्वान्कामानवाप्नोति आधिव्याधिभयं हरेत् ॥ ॥ गोप्यमेतत्सदा कुर्यान्न सर्वत्र
    प्रकाशयेत् । इति गुह्यतमं शास्त्रं प्राप्तं ब्रह्मादिकैः पुरा ॥ ॥ तस्मात्सर्वप्रयत्नेन गोपयेत्साधयेसुधीः
    । यत्रैतत्पुस्तकं तिष्ठेल्लक्ष्मीनारायणात्मकम् ॥ ॥ भूतपैशाचवेताल भयं नैव तु सर्वदा । लक्ष्मीहृदयकं
    प्रोक्तं विधिना साधयेत्सुधीः ॥ ॥ भृगुवारे च रात्रौ च पूजयेत्पुस्तकद्वयम् । सर्वथा सर्वदा सत्यं गोपयेत्साधयेत्सुधीः
    । गोपनात्साधनाल्लोके धन्यो भवति तत्त्वतः ॥ ॥ इत्यथर्वरहस्ये उत्तरभागे नारायणहृदयं सम्पूर्णम् । अथ
    लक्ष्मी हृदय स्तोत्रम् अस्य श्री महालक्ष्मीहृदयस्तोत्र महामन्त्रस्य भार्गव ऋषिः अनुष्टुपादीनि नानाछन्दांसि
    आद्यादि श्रीमहालक्ष्मीर्देवता आद्यादिमहालक्ष्मी प्रसादसिद्ध्यर्थं जपे विनियोगः ॥ ऋष्यादिन्यासः ॐ भार्गवृषये
    नमः शिरसि । ॐ अनुष्टुपादिनानाछन्दोभ्यो नमो मुखे । ॐ आद्यादिश्रीमहालक्ष्मी देवतायै नमो हृदये । ॐ श्रीं
    बीजाय नमो गुह्ये । ॐ ह्रीं शक्तये नमः पादयोः । ॐ ऐं कीलकाय नमो नाभौ । ॐ विनियोगाय नमः सर्वाङ्गे ।
    करन्यासः ॐ श्रीं अङ्गुष्ठाभ्यां नमः । ॐ ह्रीं तर्जनीभ्यां नमः । ॐ ऐं मध्यमाभ्यां नमः । ॐ श्रीं अनामिकाभ्यां
    नमः । ॐ ह्रीं कनिष्ठिकाभ्यां नमः । ॐ ऐं करतल करपृष्ठाभ्यां नमः । अङ्गन्यासः ॐ श्रीं हृदयाय नमः । ॐ
    ह्रीं शिरसे स्वाहा । ॐ ऐं शिखायै वषट् । ॐ श्रीं कवचाय हुम् । ॐ ह्रीं नेत्रत्रयाय वौषट् । ॐ ऐं अस्त्राय
    फट् । ॐ श्रीं ह्रीं ऐं इति दिग्बन्धः । अथ ध्यानम् । हस्तद्वयेन कमले धारयन्तीं स्वलीलया । हारनूपुरसंयुक्तां
    लक्ष्मीं देवीं विचिन्तये ॥ कौशेयपीतवसनामरविन्दनेत्रां पद्मद्वयाभयवरोद्यतपद्महस्ताम् । उद्यच्छतार्कसदृशीं
    परमाङ्कसंस्थां ध्यायेद्विधीशनतपादयुगां जनित्रीम् ॥ पीतवस्त्रां सुवर्णाङ्गीं पद्महस्तद्वायान्विताम्
    । लक्ष्मीं ध्यात्वेति मन्त्रेण स भवेत्पृथिवीपतिः ॥ मातुलुङ्गं गदां खेटं पाणौ पात्रं च बिभ्रती । नागं
    लिङ्गं च योनिं च बिभ्रतीं चैव मूर्धनि ॥ इति ध्यात्वा मानसोपचारैः सम्पूज्य । शङ्खचक्रगदाहस्ते शुभ्रवर्णे
    सुवासिनी । मम देहि वरं लक्ष्मीः सर्वसिद्धिप्रदायिनी । इति सम्प्रार्थ्य ॐ श्रीं ह्रीं ऐं महालक्ष्म्यै
    कमलधारिण्यै सिंहवाहिन्यै स्वाहा इति मन्त्रं जप्त्वा पुनः पूर्ववद्धृदयादि षडङ्गन्यासं कृत्वा स्तोत्रं
    पठेत् । स्तोत्रम् । वन्दे लक्ष्मीं परमशिवमयीं शुद्धजाम्बूनदाभां तेजोरूपां कनकवसनां सर्वभूषोज्ज्वलाङ्गीम्
    । बीजापूरं कनककलशं हेमपद्मं दधाना माद्यां शक्तिं सकलजननीं विष्णुवामाङ्कसंस्थाम् ॥ ॥ श्रीमत्सौभाग्यजननीं
    स्तौमि लक्ष्मीं सनातनीम् । सर्वकामफलावाप्तिसाधनैकसुखावहाम् ॥ ॥ स्मरामि नित्यं देवेशि त्वया प्रेरितमानसः
    । त्वदाज्ञां शिरसा धृत्वा भजामि परमेश्वरीम् ॥ ॥ समस्तसम्पत्सुखदां महाश्रियं समस्तसौभाग्यकरीं महाश्रियम्
    । समस्तकल्याणकरीं महाश्रियं भजाम्यहं ज्ञानकरीं महाश्रियम् ॥ ॥ विज्ञानसम्पत्सुखदां सनातनीं विचित्रवाग्भूतिकरीं
    मनोहराम् । अनन्तसम्मोदसुखप्रदायिनीं नमाम्यहं भूतिकरीं हरिप्रियाम् ॥ ॥ समस्तभूतान्तरसंस्थिता त्वं समस्तभोक्त्रीश्वरि
    विश्वरूपे । तन्नास्ति यत्त्वद्व्यतिरिक्तवस्तु त्वत्पादपद्मं प्रणमाम्यहं श्रीः ॥ ॥ दारिद्र्य दुःखौघतमोपहन्त्री
    त्वत्पादपद्मं मयि सन्निधत्स्व । दीनार्तिविच्छेदनहेतुभूतैः कृपाकटाक्षैरभिषिञ्च मां श्रीः ॥ ॥ अम्ब प्रसीद
    करुणासुधयार्द्रदृष्ट्या मां त्वत्कृपाद्रविणगेहमिमं कुरुष्व । आलोकय प्रणतहृद्गतशोकहन्त्री त्वत्पादपद्मयुगलं
    प्रणमाम्यहं श्रीः ॥ ॥ शान्त्यै नमोऽस्तु शरणागतरक्षणायै कान्त्यै नमोऽस्तु कमनीयगुणाश्रयायै । क्षान्त्यै
    नमोऽस्तु दुरितक्षयकारणायै दात्र्यै नमोऽस्तु धनधान्यसमृद्धिदायै ॥ ॥ शक्त्यै नमोऽस्तु शशिशेखरसंस्तुतायै
    रत्यै नमोऽस्तु रजनीकरसोदरायै । भक्त्यै नमोऽस्तु भवसागरतारकायै मत्यै नमोऽस्तु मधुसूदनवल्लभायै ॥ ॥ लक्ष्म्यै
    नमोऽस्तु शुभलक्षणलक्षितायै सिद्ध्यै नमोऽस्तु शिवसिद्धसुपूजितायै । धृत्यै नमोऽस्त्वमितदुर्गतिभञ्जनायै
    गत्यै नमोऽस्तु वरसद्गतिदायिकायै ॥ ॥ देव्यै नमोऽस्तु दिवि देवगणार्चितायै भूत्यै नमोऽस्तु भुवनार्तिविनाशनायै
    । धात्र्यै नमोऽस्तु धरणीधरवल्लभायै पुष्ट्यै नमोऽस्तु पुरुषोत्तमवल्लभायै ॥ ॥ सुतीव्रदारिद्र्यविदुःखहन्त्र्यै
    नमोऽस्तु ते सर्वभयापहन्त्र्यै । श्रीविष्णुवक्षःस्थलसंस्थितायै नमो नमः सर्वविभूतिदायै ॥ ॥ जयतु जयतु
    लक्ष्मीर्लक्षणालङ्कृताङ्गी जयतु जयतु पद्मा पद्मसद्माभिवन्द्या । जयतु जयतु विद्या विष्णुवामाङ्कसंस्था
    जयतु जयतु सम्यक्सर्वसम्पत्करी श्रीः ॥ ॥ जयतु जयतु देवी देवसङ्घाभिपूज्या जयतु जयतु भद्रा भार्गवी भाग्यरूपा
    । जयतु जयतु नित्या निर्मलज्ञानवेद्या जयतु जयतु सत्या सर्वभूतान्तरस्था ॥ ॥ जयतु जयतु रम्या रत्नगर्भान्तरस्था
    जयतु जयतु शुद्धा शुद्धजाम्बूनदाभा । जयतु जयतु कान्ता कान्तिमद्भासिताङ्गी जयतु जयतु शान्ता शीघ्रमागच्छ
    सौम्ये ॥ ॥ यस्याः कलायाः कमलोद्भवाद्या रुद्राश्च शक्र प्रमुखाश्च देवाः । जीवन्ति सर्वेऽपि सशक्तयस्ते
    प्रभुत्वमाप्ताः परमायुषस्ते ॥ ॥ लिलेख निटिले विधिर्मम लिपिं विसृज्यान्तरं त्वया विलिखितव्यमेतदिति
    तत्फलप्राप्तये । तदन्तरफलेस्फुटं कमलवासिनी श्रीरिमां समर्पय समुद्रिकां सकलभाग्यसंसूचिकाम् ॥ ॥ कलया
    ते यथा देवि जीवन्ति सचराचराः । तथा सम्पत्करे लक्ष्मि सर्वदा सम्प्रसीद मे ॥ ॥ यथा विष्णुर्ध्रुवे नित्यं
    स्वकलां सन्न्यवेशयत् । तथैव स्वकलां लक्ष्मि मयि सम्यक् समर्पय ॥ ॥ सर्वसौख्यप्रदे देवि भक्तानामभयप्रदे
    । अचलां कुरु यत्नेन कलां मयि निवेशिताम् ॥ ॥ मुदास्तां मत्फाले परमपदलक्ष्मीः स्फुटकला सदा वैकुण्ठश्रीर्निवसतु
    कला मे नयनयोः । वसेत्सत्ये लोके मम वचसि लक्ष्मीर्वरकला श्रियः श्वेतद्वीपे निवसतु कला मे स्वकरयोः ॥
    ॥ तावन्नित्यं ममाङ्गेषु क्षीराब्धौ श्रीकला वसेत् । सूर्याचन्द्रमसौ यावद्यावल्लक्ष्मीपतिः श्रियाः ॥
    ॥ सर्वमङ्गलसम्पूर्णा सर्वैश्वर्यसमन्विता । आद्यादि श्रीर्महालक्ष्मी त्वत्कला मयि तिष्ठतु ॥ ॥ अज्ञानतिमिरं
    हन्तुं शुद्धज्ञानप्रकाशिका । सर्वैश्वर्यप्रदा मेऽस्तु त्वत्कला मयि संस्थिता ॥ ॥ अलक्ष्मीं हरतु क्षिप्रं
    तमः सूर्यप्रभा यथा । वितनोतु मम श्रेयस्त्वत्कला मयि संस्थिता ॥ ॥ ऐश्वर्यमङ्गलोत्पत्तिस्त्वत्कलायां
    निधीयते । मयि तस्मात्कृतार्थोऽस्मि पात्रमस्मि स्थितेस्तव ॥ ॥ भवदावेशभाग्यार्हो भाग्यवानस्मि भार्गवि
    । त्वत्प्रसादात्पवित्रोऽहं लोकमातर्नमोऽस्तु ते ॥ ॥ पुनासि मां त्वत्कलयैव यस्मा दतः समागच्छ ममाग्रतस्त्वम्
    । परं पदं श्रीर्भव सुप्रसन्ना मय्यच्युतेन प्रविशादिलक्ष्मीः ॥ ॥ श्रीवैकुण्ठस्थिते लक्ष्मि समागच्छ
    ममाग्रतः । नारायणेन सह मां कृपादृष्ट्याऽवलोकय ॥ ॥ सत्यलोकस्थिते लक्ष्मि त्वं ममागच्छ सन्निधिम् । वासुदेवेन
    सहिता प्रसीद वरदा भव ॥ ॥ श्वेतद्वीपस्थिते लक्ष्मि शीघ्रमागच्छ सुव्रते । विष्णुना सहिते देवि जगन्मातः
    प्रसीद मे ॥ ॥ क्षीराम्बुधिस्थिते लक्ष्मि समागच्छ समाधवा । त्वत्कृपादृष्टिसुधया सततं मां विलोकय ॥ ॥
    रत्नगर्भस्थिते लक्ष्मि परिपूर्णे हिरण्मये । समागच्छ समागच्छ स्थित्वाऽऽशु पुरतो मम ॥ ॥ स्थिरा भव महालक्ष्मि
    निश्चला भव निर्मले । प्रसन्ने कमले देवि प्रसन्नहृदया भव ॥ ॥ श्रीधरे श्रीमहाभूते त्वदन्तःस्थं महानिधिम्
    । शीघ्रमुद्धृत्य पुरतः प्रदर्शय समर्पय ॥ ॥ वसुन्धरे श्रीवसुधे वसुदोग्ध्रि कृपामये । त्वत्कुक्षिगतसर्वस्वं
    शीघ्रं मे सम्प्रदर्शय ॥ ॥ विष्णुप्रिये रत्नगर्भे समस्तफलदे शिवे । त्वद्गर्भगतहेमादीन् सम्प्रदर्शय
    दर्शय ॥ ॥ रसातलगते लक्ष्मि शीघ्रमागच्छ मे पुरः । न जाने परमं रूपं मातर्मे सम्प्रदर्शय ॥ ॥ आविर्भव
    मनोवेगाच्छीघ्रमागच्छ मे पुरः । मा वत्स भैरिहेत्युक्त्वा कामं गौरिव रक्ष माम् ॥ ॥ देवि शीघ्रं समागच्छ
    धरणीगर्भसंस्थिते । मातस्त्वद्भृत्यभृत्योऽहं मृगये त्वां कुतूहलात् ॥ ॥ उत्तिष्ठ जागृहि त्वं मे समुत्तिष्ठ
    सुजागृहि । अक्षयान् हेमकलशान् सुवर्णेन सुपूरितान् ॥ ॥ निक्षेपान्मे समाकृष्य समुद्धृत्य ममाग्रतः ।
    समुन्नतानना भूत्वा समाधेहि धरान्तरात् ॥ ॥ मत्सन्निधिं समागच्छ मदाहितकृपारसात् । प्रसीद श्रेयसां दोग्ध्री
    लक्ष्मीर्मे नयनाग्रतः ॥ ॥ अत्रोपविश लक्ष्मि त्वं स्थिरा भव हिरण्मये । सुस्थिरा भव सम्प्रीत्या प्रसीद
    वरदा भव ॥ ॥ आनीतांस्तु तथा देवि निधीन्मे सम्प्रदर्शय । अद्य क्षणेन सहसा दत्त्वा संरक्ष मां सदा ॥ ॥
    मयि तिष्ठ तथा नित्यं यथेन्द्रादिषु तिष्ठसि । अभयं कुरु मे देवि महालक्ष्मीर्नमोऽस्तु ते ॥ ॥ समागच्छ
    महालक्ष्मि शुद्धजाम्बूनदप्रभे । प्रसीद पुरतः स्थित्वा प्रणतं मां विलोकय ॥ ॥ लक्ष्मीर्भुवं गता भासि
    यत्र यत्र हिरण्मयी । तत्र तत्र स्थिता त्वं मे तव रूपं प्रदर्शय ॥ ॥ क्रीडन्ती बहुधा भूमौ परिपूर्णकृपामयि
    । मम मूर्धनि ते हस्तमविलम्बितमर्पय ॥ ॥ फलद्भाग्योदये लक्ष्मि समस्तपुरवासिनी । प्रसीद मे महालक्ष्मि
    परिपूर्णमनोरथे ॥ ॥ अयोध्यादिषु सर्वेषु नगरेषु समास्थिते । वैभवैर्विविधैर्युक्तैः समागच्छ मुदान्विते
    ॥ ॥ समागच्छ समागच्छ ममाग्रे भव सुस्थिरा । करुणारसनिष्यन्दनेत्रद्वय विलासिनी ॥ सन्निधत्स्व महालक्ष्मि
    त्वत्पाणिं मम मस्तके । करुणासुधया मां त्वमभिषिञ्च्य स्थिरं कुरु ॥ ॥ सर्वराजगृहे लक्ष्मि समागच्छ बलान्विते
    । स्थित्वाऽऽशु पुरतो मेऽद्य प्रसादेनाऽभयं कुरु ॥ ॥ सादरं मस्तके हस्तं मम त्वं कृपयार्पय । सर्वराजगृहे
    लक्ष्मि त्वत्कला मयि तिष्ठतु ॥ ॥ आद्यादि श्रीमहालक्ष्मि विष्णुवामाङ्कसंस्थिते । प्रत्यक्षं कुरु मे
    रूपं रक्ष मां शरणागतम् ॥ ॥ प्रसीद मे महालक्ष्मि सुप्रसीद महाशिवे । अचला भव सम्प्रीत्या सुस्थिरा भव
    मद्गृहे ॥ ॥ यावत्तिष्ठन्ति वेदाश्च यावच्चन्द्रदिवाकरौ । यावद्विष्णुश्च यावत्त्वं तावत्कुरु कृपां मयि
    ॥ ॥ चान्द्रीकला यथा शुक्ले वर्धते सा दिने दिने । तथा दया ते मय्येव वर्धतामभिवर्धताम् ॥ ॥ यथा वैकुण्ठनगरे
    यथा वै क्षीरसागरे । तथा मद्भवने तिष्ठ स्थिरं श्रीविष्णुना सह ॥ ॥ योगिनां हृदये नित्यं यथा तिष्ठसि
    विष्णुना । तथा मद्भवने तिष्ठ स्थिरं श्रीविष्णुना सह ॥ ॥ नारायणस्य हृदये भवती यथास्ते नारायणोऽपि तव
    हृत्कमले यथास्ते । नारायणस्त्वमपि नित्यमुभौ तथैव तौ तिष्ठतां हृदि ममापि दयान्वितौ श्रीः ॥ ॥ विज्ञानवृद्धिं
    हृदये कुरु श्रीः सौभाग्यवृद्धिं कुरु मे गृहे श्रीः । दयासुवृद्धिं कुरुतां मयि श्रीः सुवर्णवृद्धिं
    कुरु मे गृहे श्रीः ॥ ॥ न मां त्यजेथाः श्रितकल्पवल्लि सद्भक्तचिन्तामणिकामधेनो । विश्वस्य मातर्भव सुप्रसन्ना
    गृहे कलत्रेषु च पुत्रवर्गे ॥ ॥ आद्यादिमाये त्वमजाण्डबीजं त्वमेव साकारनिराकृतिस्त्वम् । त्वया धृताश्चाब्जभवाण्डसङ्घा
    श्चित्रं चरित्रं तव देवि विष्णोः ॥ ॥ ब्रह्मरुद्रादयो देवा वेदाश्चापि न शक्नुयुः । महिमानं तव स्तोतुं
    मन्दोऽहं शक्नुयां कथम् ॥ ॥ अम्ब त्वद्वत्सवाक्यानि सूक्तासूक्तानि यानि च । तानि स्वीकुरु सर्वज्ञे दयालुत्वेन
    सादरम् ॥ ॥ भवतीं शरणं गत्वा कृतार्थाः स्युः पुरातनाः । इति सञ्चिन्त्य मनसा त्वामहं शरणं व्रजे ॥ ॥
    अनन्ता नित्यसुखिनस्त्वद्भक्तास्त्वत्परायणाः । इति वेदप्रमाणाद्धि देवि त्वां शरणं व्रजे ॥ ॥ तव प्रतिज्ञा
    मद्भक्ता न नश्यन्तीत्यपि क्वचित् । इति सञ्चिन्त्य सञ्चिन्त्य प्राणान् सन्धारयाम्यहम् ॥ ॥ त्वदधीनस्त्वहं
    मातस्त्वत्कृपा मयि विद्यते । यावत्सम्पूर्णकामः स्यात्तावद्देहि दयानिधे ॥ ॥ क्षणमात्रं न शक्नोमि जीवितुं
    त्वत्कृपां विना । न जीवन्तीह जलजा जलं त्यक्त्वा जलग्रहाः ॥ ॥ यथा हि पुत्रवात्सल्याज्जननी प्रस्नुतस्तनी
    । वत्सं त्वरितमागत्य सम्प्रीणयति वत्सला ॥ ॥ यदि स्यां तव पुत्रोऽहं माता त्वं यदि मामकी । दयापयोधरस्तन्यसुधाभिरभिषिञ्च
    माम् ॥ ॥ मृग्यो न गुणलेशोऽपि मयि दोषैकमन्दिरे । पांसूनां वृष्टिबिन्दूनां दोषाणां च न मे मतिः ॥ ॥ पापिनामहमेवाग्र्यो
    दयालूनां त्वमग्रणीः । दयनीयो मदन्योऽस्ति तव कोऽत्र जगत्त्रये ॥ ॥ विधिनाहं न सृष्टश्चेन्न स्यात्तव
    दयालुता । आमयो वा न सृष्टश्चेदौषधस्य वृथोदयः ॥ ॥ कृपा मदग्रजा किं ते अहं किं वा तदग्रजः । विचार्य
    देहि मे वित्तं तव देवि दयानिधे ॥ ॥ माता पिता त्वं गुरुसद्गतिः श्री स्त्वमेव सञ्जीवनहेतुभूता । अन्यं
    न मन्ये जगदेकनाथे त्वमेव सर्वं मम देवि सत्ये ॥ ॥ आद्यादिलक्ष्मीर्भव सुप्रसन्ना विशुद्धविज्ञानसुखैकदोग्ध्री
    । अज्ञानहन्त्री त्रिगुणातिरिक्ता प्रज्ञाननेत्री भव सुप्रसन्ना ॥ ॥ अशेषवाग्जाड्यमलापहन्त्री नवं नवं
    स्पष्टसुवाक्प्रदायिनी । ममेह जिह्वाग्र सुरङ्गनर्तकी भव प्रसन्ना वदने च मे श्रीः ॥ ॥ समस्तसम्पत्सुविराजमाना
    समस्ततेजश्चयभासमाना । विष्णुप्रिये त्वं भव दीप्यमाना वाग्देवता मे नयने प्रसन्ना ॥ ॥ सर्वप्रदर्शे सकलार्थदे
    त्वं प्रभासुलावण्यदयाप्रदोग्ध्री । सुवर्णदे त्वं सुमुखी भव श्री र्हिरण्मयी मे नयने प्रसन्ना ॥ ॥ सर्वार्थदा
    सर्वजगत्प्रसूतिः सर्वेश्वरी सर्वभयापहन्त्री । सर्वोन्नता त्वं सुमुखी भव श्री र्हिरण्मयी मे नयने प्रसन्ना
    ॥ ॥ समस्तविघ्नौघविनाशकारिणी समस्तभक्तोद्धरणे विचक्षणा । अनन्तसौभाग्यसुखप्रदायिनी हिरण्मयी मे नयने
    प्रसन्ना ॥ ॥ देवि प्रसीद दयनीयतमाय मह्यं देवाधिनाथभवदेवगणाभिवन्द्ये । मातस्तथैव भव सन्निहिता दृशोर्मे
    पत्या समं मम मुखे भव सुप्रसन्ना ॥ ॥ मा वत्स भैरभयदानकरोऽर्पितस्ते मौलौ ममेति मयि दीनदयानुकम्पे । मातः
    समर्पय मुदा करुणाकटाक्षं माङ्गल्यबीजमिह नः सृज जन्म मातः ॥ ॥ कटाक्ष इह कामधुक्तव मनस्तु चिन्तामणिः
    करः सुरतरुः सदा नवनिधिस्त्वमेवेन्दिरे । भवे तव दयारसो मम रसायनं चान्वहं मुखं तव कलानिधिर्विविधवाञ्छितार्थप्रदम्
    ॥ ॥ यथा रसस्पर्शनतोऽयसोऽपि सुवर्णता स्यात्कमले तथा ते । कटाक्षसंस्पर्शनतो जनाना ममङ्गलानामपि मङ्गलत्वम्
    ॥ ॥ देहीति नास्तीति वचः प्रवेशा द्भीतो रमे त्वां शरणं प्रपद्ये । अतः सदाऽस्मिन्नभयप्रदा त्वं सहैव
    पत्या मयि सन्निधेहि ॥ ॥ कल्पद्रुमेण मणिना सहिता सुरम्या श्रीस्ते कला मयि रसेन रसायनेन । आस्तां यतो
    मम शिरःकरदृष्टिपाद स्पृष्टाः सुवर्णवपुषः स्थिरजङ्गमाः स्युः ॥ ॥ आद्यादिविष्णोः स्थिरधर्मपत्नी त्वमेव
    पत्या मयि सन्निधेहि । आद्यादिलक्ष्मि त्वदनुग्रहेण पदे पदे मे निधिदर्शनं स्यात् ॥ ॥ आद्यादिलक्ष्मीहृदयं
    पठेद्यः स राज्यलक्ष्मीमचलां तनोति । महादरिद्रोऽपि भवेद्धनाढ्य स्तदन्वये श्रीः स्थिरतां प्रयाति ॥ ॥
    यस्य स्मरणमात्रेण तुष्टा स्याद्विष्णुवल्लभा । तस्याभीष्टं ददत्याशु तं पालयति पुत्रवत् ॥ ॥ इदं रहस्यं
    हृदयं सर्वकामफलप्रदम् । जपः पञ्चसहस्रं तु पुरश्चरणमुच्यते ॥ ॥ त्रिकालमेककालं वा नरो भक्तिसमन्वितः
    । यः पठेच्छृणुयाद्वापि स याति परमां श्रियम् ॥ ॥ महालक्ष्मीं समुद्दिश्य निशि भार्गववासरे । इदं श्रीहृदयं
    जप्त्वा पञ्चवारं धनी भवेत् ॥ ॥ अनेन हृदयेनान्नं गर्भिण्या अभिमन्त्रितम् । ददाति तत्कुले पुत्रो जायते
    श्रीपतिः स्वयम् ॥ ॥ नरेण वाऽथवा नार्या लक्ष्मीहृदयमन्त्रिते । जले पीते च तद्वंशे मन्दभाग्यो न जायते
    ॥ ॥ य आश्विने मासि च शुक्लपक्षे रमोत्सवे सन्निहिते सुभक्त्या । पठेत्तथैकोत्तरवारवृद्ध्या लभेत्स सौवर्णमयीं
    सुवृष्टिम् ॥ ॥ य एकभक्तोऽन्वहमेकवर्षं विशुद्धधीः सप्ततिवारजापी । स मन्दभाग्योऽपि रमाकटाक्षा द्भवेत्सहस्राक्षशताधिकश्रीः
    ॥ ॥ श्रीशाङ्घ्रिभक्तिं हरिदासदास्यं प्रसन्नमन्त्रार्थदृढैकनिष्ठाम् । गुरोः स्मृतिं निर्मलबोधबुद्धिं
    प्रदेहि मातः परमं पदं श्रीः ॥ ॥ पृथ्वीपतित्वं पुरुषोत्तमत्वं विभूतिवासं विविधार्थसिद्धिम् । सम्पूर्णकीर्तिं
    बहुवर्षभोगं प्रदेहि मे लक्ष्मि पुनः पुनस्त्वम् ॥ ॥ वादार्थसिद्धिं बहुलोकवश्यं वयः स्थिरत्वं ललनासुभोगम्
    । पौत्रादिलब्धिं सकलार्थसिद्धिं प्रदेहि मे भार्गवि जन्मजन्मनि ॥ ॥ सुवर्णवृद्धिं कुरु मे गृहे श्रीः
    सुधान्यवृद्धिं कुरू मे गृहे श्रीः । कल्याणवृद्धिं कुरु मे गृहे श्रीः विभूतिवृद्धिं कुरु मे गृहे श्रीः
    ॥ ॥ ध्यायेल्लक्ष्मीं प्रहसितमुखीं कोटिबालार्कभासां विद्युद्वर्णाम्बरवरधरां भूषणाढ्यां सुशोभाम् । बीजापूरं
    सरसिजयुगं बिभ्रतीं स्वर्णपात्रं भर्त्रायुक्तां मुहुरभयदां मह्यमप्यच्युतश्रीः ॥ ॥ गुह्यातिगुह्यगोप्त्री
    त्वं गृहाणास्मत्कृतं जपम् । सिद्धिर्भवतु मे देवि त्वत्प्रसादान्मयि स्थिता ॥ ॥ इति श्रीअथर्वणरहस्ये
    श्रीलक्ष्मीहृदयस्तोत्रं सम्पूर्णम् ॥
