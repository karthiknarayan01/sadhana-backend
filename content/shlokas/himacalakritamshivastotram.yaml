id: himacalakritamshivastotram
category: stotram
name:
  english: himacalakritamshivastotram
  devanagari: हिमाचलकृतंशिवस्तोत्रम्
content:
  english: himacalakritam shivastotram himacala uvaca | devadeva mahadeva karunakara shankara | pashya
    mam sharanampraptamunmilya nayane vibho || 15|| shiva sharva maheshana jagadanandakritprabho | tvam
    nato'ham mahadeva sarvapadvinivartakam || 16|| na tvam jananti devesha vedashshastrani kritsnashah
    | atito mahimadhvanam tava vanmanasoh sada || 17|| atadvyavrittitastvam vai cakitam cakitam sada |
    abhidhatte shrutih sarva paresham ka katha mata || 18|| jananti bahavo bhaktastvatkripam prapya bhaktitah
    | sharanagata bhaktanam na kutrapi bhramadikam || 19|| vijnaptim sha
  devanagari: हिमाचलकृतं शिवस्तोत्रम् हिमाचल उवाच । देवदेव महादेव करुणाकर शङ्कर । पश्य मां शरणम्प्राप्तमुन्मील्य
    नयने विभो ॥ १५॥ शिव शर्व महेशान जगदानन्दकृत्प्रभो । त्वां नतोऽहं महादेव सर्वापद्विनिवर्तकम् ॥ १६॥
    न त्वां जानन्ति देवेश वेदाश्शास्त्राणि कृत्स्नशः । अतीतो महिमाध्वानं तव वाङ्मनसोः सदा ॥ १७॥ अतद्व्यावृत्तितस्त्वां
    वै चकितं चकितं सदा । अभिधत्ते श्रुतिः सर्वा परेषां का कथा मता ॥ १८॥ जानन्ति बहवो भक्तास्त्वत्कृपां
    प्राप्य भक्तितः । शरणागत भक्तानां न कुत्रापि भ्रमादिकम् ॥ १९॥ विज्ञप्तिं श
