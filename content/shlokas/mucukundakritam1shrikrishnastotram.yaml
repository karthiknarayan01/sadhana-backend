id: mucukundakritam1shrikrishnastotram
category: stotram
name:
  english: mucukundakritam1shrikrishnastotram
  devanagari: मुचुकुन्दकृतं१श्रीकृष्णस्तोत्रम्
content:
  english: mucukundakritam 1 shrikrishnastotram mucukunda uvaca | samsarapatitasyaiko jantostvam sharanam
    param | prasida tvam prapannarttihara nashaya me'shubham || 31|| tvam payonidhayashshailasaritastvam
    vanani ca | medini gaganam vayurapo'gnistvam tatha manah || 32|| buddhiravyakritapranah praneshastvam
    tatha puman | pumsah parataram yacca vyapya janma vikaravat || 33|| shabdadihinamajaramameyam kshayavarjitam
    | avriddhinasham tadbrahma tvamadyantavivarjitam || 34|| tvatto'marassapitaro yakshagandharvakinnarah
    | siddhashcapsarasastvatto manushyah pashavah khagah || 35|| sarisripa mrigassarve tvattassarve mahiruhah
    | yacca bhutam bhavishyam ca kincidatra caracaram || 36|| murttamurttam tatha capi sthulam sukshmataram
    tatha | tatsarvam tvam jagatkartta nasti kincittvaya vina || 37|| maya samsaracakre'sminbhramata bhagavamstada
    | tapatrayabhibhutena na prapta nirvritih kvacit || 38|| duhkhanyeva sukhaniti mrigatrishnajalashayah
    | maya natha grihitani tani tapaya me'bhavan || 39|| rajyamurvi balam kosho mitrapakshastathatmajah
    | bharya bhrityajana ye ca shabdadya vishayah prabho || 40|| sukhabuddhya maya sarvam grihitamidamavyayam
    | pariname tadevesha tapatmakamabhunmama || 41|| devalokagatim prapto natha devagano'pi hi | mattassahayyakamobhucchashvati
    kutra nirvritih || 42|| tvamanaradhya jagatam sarvesham prabhavaspadam | shashvati prapyate kena parameshvara
    nirvritih || 43|| tvanmayamudhamanaso janmamrityujaradikan | avapya tapanpashyanti pretarajamanantaram
    || 44|| tato nijakriyasutinarakeshvatidarunam | prapnuvanti nara duhkhamasvarupavidastava || 45||
    ahamatyantavishayi mohitastava mayaya | mamatvagarvagarttantarbhramami parameshvara || 46|| so'ham
    tvam sharanamaparamaprameyam sampraptah paramapadam yato na kincit | samsarabhramaparitapataptaceta
    nirvane parinatadhamni sabhilashah || 47|| iti shrivishnumahapurane pancamamshe trayovimsho'dhyayantargatam
    mucukundakritam shrikrishnastotram samaptam | vishnupurana | adhyaya 5
  devanagari: मुचुकुन्दकृतं १ श्रीकृष्णस्तोत्रम् मुचुकुन्द उवाच । संसारपतितस्यैको जन्तोस्त्वं शरणं परम्
    । प्रसीद त्वं प्रपन्नार्त्तिहर नाशय मेऽशुभम् ॥ ३१॥ त्वं पयोनिधयश्शैलसरितस्त्वं वनानि च । मेदिनी गगनं
    वायुरापोऽग्निस्त्वं तथा मनः ॥ ३२॥ बुद्धिरव्याकृतप्राणाः प्राणेशस्त्वं तथा पुमान् । पुंसः परतरं यच्च
    व्याप्य जन्म विकारवत् ॥ ३३॥ शब्दादिहीनमजरममेयं क्षयवर्जितम् । अवृद्धिनाशं तद्ब्रह्म त्वमाद्यन्तविवर्जितम्
    ॥ ३४॥ त्वत्तोऽमरास्सपितरो यक्षगन्धर्वकिन्नराः । सिद्धाश्चाप्सरसस्त्वत्तो मनुष्याः पशवः खगाः ॥ ३५॥
    सरीसृपा मृगास्सर्वे त्वत्तस्सर्वे महीरुहाः । यच्च भूतं भविष्यं च किञ्चिदत्र चराचरम् ॥ ३६॥ मूर्त्तामूर्त्तं
    तथा चापि स्थूलं सूक्ष्मतरं तथा । तत्सर्वं त्वं जगत्कर्त्ता नास्ति किञ्चित्त्वया विना ॥ ३७॥ मया संसारचक्रेऽस्मिन्भ्रमता
    भगवंस्तदा । तापत्रयाभिभूतेन न प्राप्ता निर्वृतिः क्वचित् ॥ ३८॥ दुःखान्येव सुखानीति मृगतृष्णाजलाशयाः
    । मया नाथ गृहीतानि तानि तापाय मेऽभवन् ॥ ३९॥ राज्यमुर्वी बलं कोशो मित्रपक्षस्तथात्मजाः । भार्या भृत्यजना
    ये च शब्दाद्या विषयाः प्रभो ॥ ४०॥ सुखबुद्ध्या मया सर्वं गृहीतमिदमव्ययम् । परिणामे तदेवेश तापात्मकमभून्मम
    ॥ ४१॥ देवलोकगतिं प्राप्तो नाथ देवगणोऽपि हि । मत्तस्साहाय्यकामोभूच्छाश्वती कुत्र निर्वृतिः ॥ ४२॥ त्वामनाराध्य
    जगतां सर्वेषां प्रभवास्पदम् । शाश्वती प्राप्यते केन परमेश्वर निर्वृतिः ॥ ४३॥ त्वन्मायामूढमनसो जन्ममृत्युजरादिकान्
    । अवाप्य तापान्पश्यन्ति प्रेतराजमनन्तरम् ॥ ४४॥ ततो निजक्रियासूतिनरकेष्वतिदारुणम् । प्राप्नुवन्ति नरा
    दुःखमस्वरूपविदस्तव ॥ ४५॥ अहमत्यन्तविषयी मोहितस्तव मायया । ममत्वगर्वगर्त्तान्तर्भ्रमामि परमेश्वर ॥
    ४६॥ सोऽहं त्वां शरणमपारमप्रमेयं सम्प्राप्तः परमपदं यतो न किञ्चित् । संसारभ्रमपरितापतप्तचेता निर्वाणे
    परिणतधाम्नि साभिलाषः ॥ ४७॥ इति श्रीविष्णुमहापुराणे पञ्चमांशे त्रयोविंशोऽध्यायान्तर्गतं मुचुकुन्दकृतं
    श्रीकृष्णस्तोत्रं समाप्तम् । विष्णुपुराण । अध्याय ५
