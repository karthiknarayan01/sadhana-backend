id: vivekanandastotram-4
category: stotram
name:
  english: vivekanandastotram 4
  devanagari: विवेकानन्दस्तोत्रम् ४
content:
  english: shrivivekanandastotram jivasevavratam yasya lakshyamasinmahitale jnanamatmagatam yo vai tena
    margena sangatah | karmine jnanine caiva bhaktaya svamine punah vivekanandarupaya bhuyo bhuyo namamyaham
    || 1|| yatsevavratamamananti munayo buddho jinah shankarah shriramah kamaniyakamyakavane vrindavane
    madhavah | jahnavyah sutateshu gaur̤agahane gaurangadevastatha tatsevavratamadya sadhakavarah svami
    punarghoshate || 2|| deva nagashca yakshah khagabhujagaganashcapsaroramshabhuta gandharva rakshasa
    ye sakalabhuvanajashcasura vrikshajatah | shatrurmitram ca ye va nikhilanarakaja yatanasthashca jiva
    abrahma stambarupam jagadidamakhilam tripyatam tripyatam bhoh || 3|| candalo brahmano va gururuta
    vayasa laghavah pandito va murkho dino dhanadhyah sakalagunaganairanvito nirguno va | sarve narayanaste
    vayamapi ca tatha yuyamapyatra bhuta atma narayano'yam pracarati bahushah sevyatamatmarupah || 4||
    dvare bhikshurbubhukshuh kathayati karunam
  devanagari: श्रीविवेकानन्दस्तोत्रम् जीवसेवाव्रतं यस्य लक्ष्यमासीन्महीतले ज्ञानमात्मगतं यो वै तेन मार्गेण
    सङ्गतः । कर्मिणे ज्ञानिने चैव भक्ताय स्वामिने पुनः विवेकानन्दरूपाय भूयो भूयो नमाम्यहम् ॥ १॥ यत्सेवाव्रतमामनन्ति
    मुनयो बुद्धो जिनः शङ्करः श्रीरामः कमनीयकाम्यकवने वृन्दावने माधवः । जाह्नव्याः सुतटेषु गौड़गहने गौराङ्गदेवस्तथा
    तत्सेवाव्रतमद्य साधकवरः स्वामी पुनर्घोषते ॥ २॥ देवा नागाश्च यक्षाः खगभुजगगनाश्चाप्सरोरंशभूता गन्धर्वा
    राक्षसा ये सकलभुवनजाश्चासुरा वृक्षजाताः । शत्रुर्मित्रं च ये वा निखिलनरकजा यातनास्थाश्च जीवा आब्रह्म
    स्तम्बरूपं जगदिदमखिलं तृप्यतां तृप्यतां भोः ॥ ३॥ चण्डालो ब्राह्मणो वा गुरुरुत वयसा लाघवः पण्डितो वा
    मूर्खो दीनो धनाढ्यः सकलगुणगणैरन्वितो निर्गुणो वा । सर्वे नारायणास्ते वयमपि च तथा यूयमप्यत्र भूता आत्मा
    नारायणोऽयं प्रचरति बहुशः सेव्यतामात्मरूपः ॥ ४॥ द्वारे भिक्षुर्बुभुक्षुः कथयति करुणं
meaning: {}
