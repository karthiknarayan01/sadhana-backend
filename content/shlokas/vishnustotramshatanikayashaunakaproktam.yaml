id: vishnustotramshatanikayashaunakaproktam
category: stotram
name:
  english: vishnustotramshatanikayashaunakaproktam
  devanagari: विष्णुस्तोत्रंशतानीकायशौनकप्रोक्तम्
content:
  english: shatanikaya shaunakaproktam vishnustotram om namo vasudevaya purushaya mahatmane | hiranyaretase'cintyasvarupayativedhase
    || 10|| vishnave jishnave nityam shantayanagharupine | sarvasthityantakaranavratine pitavasase ||
    11|| narayanaya vishvaya vishveshayeshvaraya ca | namah kamalakinjalkasuvarnamukutaya ca || 12|| keshavayatisukshmaya
    brahmamurtimate namah | namah paramakalyanakalyanayatmayonaye || 13|| janardanaya devaya shridharaya
    sumedhase | mahatmane varenyaya namah pankajanabhaye || 14|| smritamatraghaghataya krishnayaklishtakarmane
    | namo nataya namreshairasheshairvasavadibhih || 15|| namo mayavine tubhyam haraye harimedhase | hiranyagarbhagarbhaya
    jagatah karanatmane || 16|| govindayadibhutaya shradinam
  devanagari: शतानीकाय शौनकप्रोक्तम् विष्णुस्तोत्रम् ॐ नमो वासुदेवाय पुरुषाय महात्मने । हिरण्यरेतसेऽचिन्त्यस्वरूपायातिवेधसे
    ॥ १०॥ विष्णवे जिष्णवे नित्यं शान्तायानघरूपिणे । सर्वस्थित्यन्तकरणव्रतिने पीतवाससे ॥ ११॥ नारायणाय विश्वाय
    विश्वेशायेश्वराय च । नमः कमलकिञ्जल्कसुवर्णमुकुटाय च ॥ १२॥ केशवायातिसूक्ष्माय ब्रह्ममूर्तिमते नमः ।
    नमः परमकल्याणकल्याणायात्मयोनये ॥ १३॥ जनार्दनाय देवाय श्रीधराय सुमेधसे । महात्मने वरेण्याय नमः पङ्कजनाभये
    ॥ १४॥ स्मृतमात्राघघाताय कृष्णायाक्लिष्टकर्मणे । नमो नताय नम्रेशैरशेषैर्वासवादिभिः ॥ १५॥ नमो मायाविने
    तुभ्यं हरये हरिमेधसे । हिरण्यगर्भगर्भाय जगतः कारणात्मने ॥ १६॥ गोविन्दायादिभूताय श्रादीनां
