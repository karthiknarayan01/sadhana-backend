id: ratrisuktam-2
category: veda
name:
  english: ratrisuktam
  devanagari: रात्रिसूक्तम्
content:
  english: prapatyamnte tesham me abhayam kuru | tesham me abhayam kuruvonnamah || 10 keshinim sarvabhutanam
    pancamiti ca nama ca | sa mam sama nisha devi sarvatah pari rakshatu | sarvatah pari rakshatvonnamah
    || 11 tamagnivarnam tapasa jvalamtim vairocanim karmaphaleshu jushtam | durgam devim sharanamaham
    prapadye sutarasi tarase namah | sutarasi tarase namah || 12 durga durgeshu sthaneshu sham no devirabhishtaye
    | ya imam durgastavam punyam ratrauratrau sada pathet || 13 ratrih kushikasobharo ratrirva bharadvaji
    ratristavo gayatri | ratarisuktam japennityam tatkalamupapadyate || 14 ulukayatum shishilukayatum
    jahi shvayatumuta kokayatum | suparnayatumuta gridhrayatum drishadeva pramrina raksha indra || 15
    pishangabhrishatimambhrinam pishacimindra sam mrina | sarvam raksho nibarhaya || 16 himasya tva jarayuna
    shale pari vyayamasi |
  devanagari: प्रपत्यम्न्ते तेषां मे अभयं कुरु । तेषां मे अभयं कुरुवोन्नमः ॥ १० केशिनीं सर्वभूतानां पञ्चमीति
    च नाम च । सा मां समा निशा देवी सर्वतः परि रक्षतु । सर्वतः परि रक्षत्वोन्नमः ॥ ११ तामग्निवर्णां तपसा
    ज्वलम्तीं वैरोचनीं कर्मफलेषु जुष्टाम् । दुर्गां देवीं शरणमहं प्रपद्ये सुतरसि तरसे नमः । सुतरसि तरसे
    नमः ॥ १२ दुर्गा दुर्गेषु स्थानेषु शं नो देवीरभिष्टये । य इमं दुर्गास्तवं पुण्यं रात्रौरात्रौ सदा पठेत्
    ॥ १३ रात्रिः कुशिकसोभरो रात्रिर्वा भारद्वाजी रात्रिस्तवो गायत्री । रातरीसूक्तं जपेन्नित्यं तत्कालमुपपद्यते
    ॥ १४ उलूकयातुं शीशीलूकयातुं जहि श्वयातुमुत कोकयातुम् । सुपर्णयातुमुत गृध्रयातुं दृषदेव प्रमृण रक्ष
    इन्द्र ॥ १५ पिशङ्गभृषटिमम्भृणं पिशाचिमिन्द्र सं मृण । सर्वं रक्षो निबर्हय ॥ १६ हिमस्य त्वा जरायुणा
    शाले परि व्ययामसि ।
