id: brahmakritamradhikastotram
category: stotram
name:
  english: brahmakritamradhikastotram
  devanagari: ब्रह्मकृतंराधिकास्तोत्रम्
content:
  english: brahmakritam radhikastotram brahmovaca | he matastvatpadambhojam drishtam krishnaprasadatah
    || 94|| sudurlabham ca sarvesham bharate ca visheshatah | shashtivarshasahasrani tapastaptam pura
    maya || 95|| bhaskare pushkare tirthe krishnasya paramatmanah | ajagama varam datum varadata harih
    svayam || 96|| varam vrinishvetyukte ca svabhishtam ca vritam muda | radhikacaranambhojam sarveshamapi
    durlabham || 97|| he gunatita me shighramadhunaiva pradarshaya | mayetyukto harirayamuvaca mam tapasvinam
    || 98|| darshayishyami kale ca vatsedanim kshameti ca | nahishvarajna viphala tena drishtam padambujam
    || 99|| sarvesham vanchitam matargoloke bharate'dhuna | sarva devyah prakrityamsha janyah prakritika
    dhruvam || 100|| tvam krishnangardhasambhuta tulya krishnena sarvatah | shrikrishnastvanmayam radha
    tvam radha va harih svayam || 101|| na hi vedeshu me drishta iti kena nirupitam | brahmandadbahirurdhvam
    ca goloko'sti yathambike || 102|| vaikunthashcapyajanyashca tvamajanya tathambike | yatha samastabrahmande
    shrikrishnamshamshajivinah || 103|| tatha shaktisvarupa tvam teshu sarveshu samsthita | purushashca
    hareramshastvadamsha nikhilah striyah || 104|| atmana deharupa tvamasyadharastvameva hi | asyanu pranaistvam
    matastvatpranairayamishvarah || 105|| kimaho nirmitah kena hetuna shilpakarina | nityo'yam ca tatha
    krishnastvam ca nitya tatha'mbike || 106|| asyamsha tvam tvadamsho va'pyayam kena nirupitah | aham
    vidhata jagatam devanam janakah svayam || 107|| tam pathitva gurumukhadbhavantyeva budha janah | gunanam
    vastavanam te shatamsham vaktumakshamah || 108|| vedo va pandito va'nyah ko va tvam stotumishvarah
    | stavanam janakam jnanam buddhirjnanambika sada || 109|| tvam buddherjanani matah ko va tvam stotumishvarah
    | yadvastu drishtam sarvesham taddhi vaktum budhah kshamah || 110|| yadadrishtashrutam vastu tannirvaktum
    ca kah kshamah | aham mahesho'nantashca stotum tvam ko'pi na kshamah || 111|| sarasvati ca vedashca
    kshamah kah stotumishvarah | yathagamam yathoktam ca na mam ninditumarhasi || 112|| ishvaranamishvarasya
    yogyayogye sama kripa | janasya pratipalyasya kshane doshah kshane gunah || 113|| janani janako yo
    va sarvam kshamati snehatah | ityuktva jagatam dhata tasthau ca puratastayoh || 114|| pranamya caranambhoje
    sarvesham vandyamipsitam | brahmana ca kritam stotram trisandhyam yah pathennarah || 115|| radhamadhavayoh
    pade bhaktirdasyam labheddhruvam | karmanirmulanam kritva mrityum jitva sudurjayam | vilanghya sarvalokamshca
    yati golokamuttamam || 116|| iti shribrahmavaivartapurane shrikrishnajanmakhande purve pancadashadhyayantargatam
    brahmakritam shriradhikastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: ब्रह्मकृतं राधिकास्तोत्रम् ब्रह्मोवाच । हे मातस्त्वत्पदाम्भोजं दृष्टं कृष्णप्रसादतः ॥ ९४॥
    सुदुर्लभं च सर्वेषां भारते च विशेषतः । षष्टिवर्षसहस्राणि तपस्तप्तं पुरा मया ॥ ९५॥ भास्करे पुष्करे
    तीर्थे कृष्णस्य परमात्मनः । आजगाम वरं दातुं वरदाता हरिः स्वयम् ॥ ९६॥ वरं वृणीष्वेत्युक्ते च स्वाभीष्टं
    च वृतं मुदा । राधिकाचरणाम्भोजं सर्वेषामपि दुर्लभम् ॥ ९७॥ हे गुणातीत मे शीघ्रमधुनैव प्रदर्शय । मयेत्युक्तो
    हरिरयमुवाच मां तपस्विनम् ॥ ९८॥ दर्शयिष्यामि काले च वत्सेदानीं क्षमेति च । नहीश्वराज्ञा विफला तेन दृष्टं
    पदाम्बुजम् ॥ ९९॥ सर्वेषां वाञ्छितं मातर्गोलोके भारतेऽधुना । सर्वा देव्यः प्रकृत्यंशा जन्याः प्राकृतिका
    ध्रुवम् ॥ १००॥ त्वं कृष्णाङ्गार्धसम्भूता तुल्या कृष्णेन सर्वतः । श्रीकृष्णस्त्वन्मयं राधा त्वं राधा
    वा हरिः स्वयम् ॥ १०१॥ न हि वेदेषु मे दृष्ट इति केन निरूपितम् । ब्रह्माण्डाद्बहिरूर्ध्वं च गोलोकोऽस्ति
    यथाम्बिके ॥ १०२॥ वैकुण्ठश्चाप्यजन्यश्च त्वमजन्या तथाम्बिके । यथा समस्तब्रह्माण्डे श्रीकृष्णांशांशजीविनः
    ॥ १०३॥ तथा शक्तिस्वरूपा त्वं तेषु सर्वेषु संस्थिता । पुरुषाश्च हरेरंशास्त्वदंशा निखिलाः स्त्रियः ॥
    १०४॥ आत्मना देहरूपा त्वमस्याधारस्त्वमेव हि । अस्यानु प्राणैस्त्वं मातस्त्वत्प्राणैरयमीश्वरः ॥ १०५॥
    किमहो निर्मितः केन हेतुना शिल्पकारिणा । नित्योऽयं च तथा कृष्णस्त्वं च नित्या तथाऽम्बिके ॥ १०६॥ अस्यांशा
    त्वं त्वदंशो वाऽप्ययं केन निरूपितः । अहं विधाता जगतां देवानां जनकः स्वयम् ॥ १०७॥ तं पठित्वा गुरुमुखाद्भवन्त्येव
    बुधा जनाः । गुणानां वास्तवानां ते शतांशं वक्तुमक्षमः ॥ १०८॥ वेदो वा पण्डितो वाऽन्यः को वा त्वां स्तोतुमीश्वरः
    । स्तवानां जनकं ज्ञानं बुद्धिर्ज्ञानाम्बिका सदा ॥ १०९॥ त्वं बुद्धेर्जननी मातः को वा त्वां स्तोतुमीश्वरः
    । यद्वस्तु दृष्टं सर्वेषां तद्धि वक्तुं बुधः क्षमः ॥ ११०॥ यददृष्टाश्रुतं वस्तु तन्निर्वक्तुं च कः
    क्षमः । अहं महेशोऽनन्तश्च स्तोतुं त्वां कोऽपि न क्षमः ॥ १११॥ सरस्वती च वेदाश्च क्षमः कः स्तोतुमीश्वरः
    । यथागमं यथोक्तं च न मां निन्दितुमर्हसि ॥ ११२॥ ईश्वराणामीश्वरस्य योग्यायोग्ये समा कृपा । जनस्य प्रतिपाल्यस्य
    क्षणे दोषः क्षणे गुणः ॥ ११३॥ जननी जनको यो वा सर्वं क्षमति स्नेहतः । इत्युक्त्वा जगतां धाता तस्थौ च
    पुरतस्तयोः ॥ ११४॥ प्रणम्य चरणाम्भोजे सर्वेषां वन्द्यमीप्सितम् । ब्रह्मणा च कृतं स्तोत्रं त्रिसन्ध्यं
    यः पठेन्नरः ॥ ११५॥ राधामाधवयोः पादे भक्तिर्दास्यं लभेद्ध्रुवम् । कर्मनिर्मूलनं कृत्वा मृत्युं जित्वा
    सुदुर्जयम् । विलङ्घ्य सर्वलोकांश्च याति गोलोकमुत्तमम् ॥ ११६॥ इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे
    पूर्वे पञ्चदशाध्यायान्तर्गतं ब्रह्मकृतं श्रीराधिकास्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
