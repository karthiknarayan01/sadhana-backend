id: ramamantra-meanings
category: mantra
name:
  english: ramamantra-meanings
  devanagari: राममन्त्र-मेअनिन्ग्स्
content:
  english: shrirama mamtrace shloka sartha samartha ramadasasvamikrita || jaya jaya raghuvira samartha
    || nako shastra abhyasa vitpatti mothi | jade garva tatha abhimana potim || kasa konata nenave ajapa
    re | hare rama ha mamtra sopa japa re || 1||
  devanagari: श्रीराम मंत्राचे श्लोक सार्थ समर्थ रामदासस्वामीकृत ॥ जय जय रघुवीर समर्थ ॥ नको शास्त्र अभ्यास
    वित्पत्ति मोठी । जडे गर्व ताठा अभीमान पोटीं ॥ कसा कोणता नेणवे आजपा रे । हरे राम हा मंत्र सोपा जपा
    रे ॥ १॥
meaning: {}
