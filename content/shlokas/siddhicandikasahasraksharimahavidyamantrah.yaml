id: siddhicandikasahasraksharimahavidyamantrah
category: mantra
name:
  english: siddhicandikasahasraksharimahavidyamantrah
  devanagari: सिद्धिचण्डिकासहस्राक्षरीमहाविद्यामन्त्रः
content:
  english: om aim hrim klim namo daivyai mahadevyai shivayai satatam namah | namah prakrityai bhadrayai
    niyatah pranatah sma tam || 1|| om aim hrim shrim sarvamangalamangalye shive sarvarthasadhike | sharanye
    tryambake gauri narayani namo'stu te || 2|| sarvasvarupe sarveshe sarvashaktisamanvite | bhayebhyastrahi
    no devi durge devi namo'stu te || 3|| siddhicandimahamantram yah pathet prayato narah | sarvasiddhimavapnoti
    sarvatra vijayi bhavet || 4|| sangrameshu jayet shatrun matangamiva kesari | vashayet sada nikhilan
    visheshena mahipatin || 5|| trikalam yah pathennityam sarvaishvaryapurahsaram | tasya nashyanti vighnani
    grahapidashca varanam || 6|| parabhicarashamanam tivradaridryanashanam | sarvakalyananilayam devyah
    santoshakarakam || 7|| sahasravrittitastu devi manorathasamriddhidam | dvisahasravrittitastu sarvasankatanashanam
    || 8|| trisahasravrittitastu vashayedrajayoshitam | ayutam prapathedyastu sarvatra caivatandritah
    | sa pashyeccandikam sakshadvaradanakritodyamam || 9|| idam rahasyam paramam gopaniyam prayatnatah
    | vacyam na kasyacit devi vidhanamastu sundari || 10|| || iti shrisiddhidamare shivadevisamvade sahasraksharam
    siddhicandimahavidyottamam sampurnam ||
  devanagari: ॐ ऐं ह्रीं क्लीं नमो दैव्यै महादेव्यै शिवायै सततं नमः । नमः प्रकृत्यै भद्रायै नियताः प्रणताः
    स्म ताम् ॥ १॥ ॐ ऐं ह्रीं श्रीं सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थसाधिके । शरण्ये त्र्यम्बके गौरि नारायणि
    नमोऽस्तु ते ॥ २॥ सर्वस्वरूपे सर्वेशे सर्वशक्तिसमन्विते । भयेभ्यस्त्राहि नो देवि दुर्गे देवि नमोऽस्तु
    ते ॥ ३॥ सिद्धिचण्डीमहामन्त्रं यः पठेत् प्रयतो नरः । सर्वसिद्धिमवाप्नोति सर्वत्र विजयी भवेत् ॥ ४॥ सङ्ग्रामेषु
    जयेत् शत्रून् मातङ्गमिव केसरी । वशयेत् सदा निखिलान् विशेषेण महीपतीन् ॥ ५॥ त्रिकालं यः पठेन्नित्यं
    सर्वैश्वर्यपुरःसरम् । तस्य नश्यन्ति विघ्नानि ग्रहपीडाश्च वारणम् ॥ ६॥ पराभिचारशमनं तीव्रदारिद्र्यनाशनम्
    । सर्वकल्याणनिलयं देव्याः सन्तोषकारकम् ॥ ७॥ सहस्रावृत्तितस्तु देवि मनोरथसमृद्धिदम् । द्विसहस्रावृत्तितस्तु
    सर्वसङ्कटनाशनम् ॥ ८॥ त्रिसहस्रावृत्तितस्तु वशयेद्राजयोषितम् । अयुतं प्रपठेद्यस्तु सर्वत्र चैवातन्द्रितः
    । स पश्येच्चण्डिकां साक्षाद्वरदानकृतोद्यमाम् ॥ ९॥ इदं रहस्यं परमं गोपनीयं प्रयत्नतः । वाच्यं न कस्यचित्
    देवि विधानमस्तु सुन्दरि ॥ १०॥ ॥ इति श्रीसिद्धिडामरे शिवदेवीसंवादे सहस्राक्षरं सिद्धिचण्डीमहाविद्योत्तमं
    सम्पूर्णम् ॥
