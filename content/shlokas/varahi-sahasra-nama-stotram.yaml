id: varahi-sahasra-nama-stotram
category: stotram
name:
  english: Varahi Sahasra Nama Stotram
content:
  english: devyuvaca | shrikantha karunasindho dinabandho jagatpate | bhutibhushitasarvanga paratparatara
    prabho || || kritanjaliputa bhutva pricchamyekam dayanidhe | adya ya citsvarupa ya nirvikara niranjana
    || || bodhatita jnanagamya kutasthanandavigraha | agrahyatindriya shuddha niriha svavabhasika || ||
    gunatita nishprapanca hyavanmanasagocara | prakritirjagadutpattisthitisamharakarini || || rakshartham
    jagato devakaryartham va suradvisham | nashaya dhatte sa deham tattatkaryaikasadhakam || || tatra
    bhudharanarthaya yajnavistarahetave | vidyutkeshahiranyakshabalakadivadhaya ca || || avirbabhuva ya
    shaktirghora bhudararupini | varahi vikatakara danavasuranashini || || sadyah siddhikari devi ghoradghoratara
    shiva | tasyah sahasranamakhyam stotram me samudiraya || || kripalesho'sti mayi cedbhagyam me yadi
    va bhavet | anugrahya yadyaham syam tada vada dayanidhe || || ishvara uvaca | sadhu sadhu vararohe
    dhanya bahumatasi me | shushrushaya samutpanna bhaktih shraddhanvita tava || || sahasranama varahyah
    sarvasiddhividhayi ca | tava cenna pravakshyami priye kasya vadamyaham || || kintu gopyam prayatnena
    samrakshyam pranato'pi ca | visheshatah kaliyuge na deyam yasya kasyacit | sarve'nyatha siddhibhajo
    bhavishyanti varanane || || om asya shrivarahisahasranamastotrasya mahadeva rishih | anushtup chandah
    | varahi devata | aim bijam | krom shaktih | hum kilakam | mama sarvarthasiddhyarthe jape viniyogah
    | om varahi vamani vama bagala vasavi vasuh | vaidehi virasurbala varada vishnuvallabha || || vandita
    vasuda vashya vyattasya vancini bala | vasundhara vitihotra vitaraga vihayasi || || sarva khanipriya
    kamya kamala kancani rama | dhumra kapalini vama kurukulla kalavati || || yamya''gneyi dhara dhanya
    dharmini dhyanini dhruva | dhritirlakshmirjaya tushtih shaktirmedha tapasvini || || vedha jaya kritih
    kantih svaha shantirdama ratih | lajja matih smritirnidra tantra gauri shiva svadha || || candi durga'bhaya
    bhima bhasha bhama bhayanaka | bhudara bhayaha bhirurbhairavi bhangara bhati || || ghurghura ghoshana
    ghora ghoshini ghonasamyuta | ghanaghana gharghara ca ghonayukta'ghanashini || || purvagneyi yatu
    yamya vayavyuttaravaruni | aishanyurdhvadhahsthita ca prishthadakshagravamaga || || hrinnabhibrahmarandhrarkasvargapatalabhumiga
    | aim shrih hrih klim tirthagatih pritirdhirgih kala'vyaya || || rigyajuh samarupa ca para potrinyudumbara
    | gadasishakticapeshushulacakrarshtidharini || || jarati yuvati bala caturangabalotkata | satyakshara
    nidhirnetri dhatri potri para patuh || || kshetrajna kampini jyeshtha duradharsha dhurandhara | malini
    manini mata mananiya manasvini || || madotkata manyukari manurupa manojava | medasvini madyarata madhupa
    mangala'mara || || maya mata''mayahari mridani mahila mritih | mahadevi mohahari manjurmrityunjaya'mala
    || || mamsala manava mula maharatrirmadalasa | mriganka menaka manya mahishaghni madantika || || murchamohamrishamoghamadamrityumalapaha
    | simharkshamahishavyaghramrigakrodanana dhuni || || dharini dharini dhenurdharitri dhavani dhava
    | dharmadhvana dhyanapara dhanadhanyadharaprada || || papadosharipuvyadhinashini siddhidayini | kalakashthakshamapakshahastrutishvasarupini
    || || samriddha subhuja raudri radha raga ramaranih | rama ratipriya rushta rakshini ravimadhyaga
    || || rajani ramani reva rankini ranjini rama | rosha roshavati ruksha karirajyaprada rata || || ruksha
    rupavati rasya rudrani ranapandita | ganga ca yamuna caiva sarasvatisvasurmadhuh || || gandaki tungabhadra
    ca kaveri kaushiki patuh | katvoragavati cara sahasraksha pratardana || || sarvajna shankari shastri
    jatadharinyayorada | yavani saurabhi kubja vakratunda vadhodyata || || candrapida vedavedya shankhini
    nilalohita | dhyanatita'paricchedya mrityurupa trivargada || || arupa bahurupa ca nanarupa natanana
    | vrishakapirvrisharudha vrisheshi vrishavahana || || vrishapriya vrishavarta vrishaparva vrishakritih
    | kodandini nagacuda cakshushya paramarthika || || durvasa durgaha devi duravasa durariha | durga
    radha duhkhahantri duraradhya daviyasi || || duravasa dushprahasta dushprakampa duruhini | suveni
    ramani shyama mrigavyadharghatapini || || ugra tarkshi pashupati kaunapi kunapashana | kapardini kamakama
    kamaniya kalojjvala || || kasavahritkarakani kambukanthi kritagama | karkasha karana kanta kalpa'kalpa
    katankata || || shmashananilaya bhinna gajarudha gajapaha | tatpriya tatpara raya svarbhanuh kalavancini
    || || shakha vishakha goshakha sushakha sheshashakhini | vyanga shubhanga vamanga nilanga'nangarupini
    || || sangopanga ca saranga subhanga rangarupini | bhadra subhadra bhadrakshi simhika vinata'ditih
    || || hridya'vadya supadya ca gadyapadyapriya prasuh | carcika bhogavatyamba sarasi shabari nati ||
    || yogini pushkala'nanta para sankhya shaci sati | nimnaga nimnanabhishca sahishnurjagriti lipih ||
    || damayanti dami dandoddandini daradayika | dipini davini dhatri dakshakanya damya darat || || dahini
    dravini darvi dandini dandanayika | danapriya doshahantri duhkhadaridryanashini || || doshada doshakriddogdhri
    dohati devika'dhana | darvikari durvalita duryuga'dvayavadini || || caracara'nantavrishtirunmatta
    kamala'lasa | tarini tarakantara paramatmabjalocana || || indurhiranyakavaca vyavastha vyavasayika
    | ishananda nadi nagi yakshini sarpini vari || || sudha sura vishvasaha suvarnangadadharini | janani
    pritibhageshi samrajni samviduttama || || ameya'rishtadamani pingala lingadharini | camunda plavini
    hala brihajjyotirurukrama || || supratika ca sugriva havyavaha pralapini | nabhasya madhavi jyeshtha
    shishira jvalini rucih || || shukla shukra shuca shoka shuki bheki piki baki | prishadashva nabhoyonih
    supratika vibhavari || || garvita gurvini ganya gururgurudhari gaya | gandharvi ganika gundra garudi
    gopika'graga || || ganeshi gamini ganta gopatirgandhini gavi | garjita ganani gona goraksha govidam
    gatih || || grathiki grathikridgoshthi garbharupa gunaishini | paraskari pancanada bahurupa virupika
    || || uha vyuha duruha ca sammoha mohaharini | yajnavigrahini yajna yayajuka yashasvini || || agnishtoma'tyagnishtoma
    vajapeyashca shodashi | pundarika'shvamedhashca rajasuyashca nabhasah || || svishtakridbahusauvarno
    gosavashca mahavratah | vishvajidbrahmayajnashca prajapatyah shilayavah || || ashvakranta rathakranta
    vishnukranta vibhavasuh | suryakranta gajakranta balibhinnagayajnakah || || savitri cardhasavitri
    sarvatobhadravaruna | adityamaya godoha gavamaya mrigamaya || || sarpamayah kalapinjah kaundinyopanagahalah
    | agnividdvadashahasvopamshuh soma vidho hanah || || ashvapratigraho barhiratho'bhyudaya riddhirat
    | sarvasvadakshino diksha somakhya samidahvayah || || kathayanashca godohah svahakarastanunapat |
    danda purusha medhashca shyeno vajra ishuryamah || || angirah kankabherunda candrayanaparayana | jyotishtomah
    gudo darsho nandyakhyah paurnamasikah || || gajapratigraho ratrih saurabhah shankalayanah | saubhagyakricca
    karisho baidalayanaramathau || || shocishkari naciketah shantikritpushtikrittatha | vainateyoccatanau
    ca vashikarana marane || || trailokyamohano virah kandarpabalashatanah | shankhacudo gajacchayo raudrakhyo
    vishnuvikramah || || bhairavah kavahakhyashcavabhritho'shtakapalakah | shraushat vaushat vashatkarah
    pakasamstha parishruti || || cayano naramedhashca kariri ratnadanika | sautramani ca bharunda barhaspatyo
    balangamah || || pracetah sarvasatrashca gajamedhah karambhakah | havihsamstha somasamstha pakasamstha
    garutmati || || satyasuryashcamasah sruk sruvolukhala mekshani | capalo manthani medhi yupah pragvamshakuncika
    || || rashmiramshushca dobhyashca varunodah pavih kutha | aptoryamo dronakalasho maitravaruna ashvinah
    || || patnivatashca manthi ca hariyojana eva ca | pratiprasthanashukrau ca samidheni samitsama ||
    || hota'dhvaryustathodgata neta tvashta ca yotrika | agnidhro'cchavakashtavaggravastutpratardakah
    || || subrahmanyo brahmanashca maitravarunavarunau | prastota pratiprasthata yajamano dhruvantrika
    || || amiksha prishadajyam ca havyam kavyam caruh payah | juhudghravopabhridbrahma trayi treta tarasvini
    || || purodashah pashukarshah prokshani brahmayajnini | agnijihva darbharoma brahmashirsha mahodari
    || || amritaprashika narayani nagna digambara | onkarini caturvedarupa shrutiranulbana || || ashtadashabhuja
    rambha satya gaganacarini | bhimavaktra mahavaktra kirtirakrishnapingala || || krishnamurdha mahamurdha
    ghoramurdha bhayanana | ghoranana ghorajihva ghorarava mahavrata || || diptasya diptanetra ca candapraharana
    jati | surabhi saulabhi vici chaya sandhya ca mamsala || || krishna krishnambara krishnasharngini
    krishnavallabha | trasini mohini dveshya mrityurupa bhayapaha || || bhishana danavendraghni kalpakarta
    kshayankari | abhaya prithivi sadhvi keshini vyadhijanmaha || || akshobhya''hladini kanya pavitra
    ropini shubha | kanyadevi suradevi bhimadevi madantika || || shakambhari mahashveta dhumra dhumreshvarishvari
    | virabhadra mahabhadra mahadevi mahasuri || || shmashanavasini dipta citisamstha citipriya | kapalahasta
    khatvangi khadgini shulini hali || || kantarini mahayogi yogamarga yugagraha | dhumraketurmahasyayuryuganam
    parivartini || || angarinyankushakara ghantavarna ca cakrini | vetali brahmavetali mahavetalika tatha
    || || vidyarajni moharajni maharajni mahodari | bhutam bhavyam bhavishyam ca sankhyam yogastapo damah
    || || adhyatmam cadhidaivam cadhibhutamsha eva ca | ghantarava virupakshi shikhivicchricayapriya ||
    || khadgashulagadahasta mahishasuramardini | matangi mattamatangi kaushiki brahmavadini || || ugrateja
    siddhasena jrimbhini mohini tatha | jaya ca vijaya caiva vinata kadrureva ca || || dhatri vidhatri
    vikranta dhvasta murcha ca murchani | damani dharmini damya chedini tapini tapi || || bandhini badhini
    bandha bodhatita budhapriya | harini harini hantri dharini dharini dhara || || visadhini sadhini ca
    sandhya sangopani priya | revati kalakarni ca siddhirlakshmirarundhati || || dharmapriya dharmaratih
    dharmishtha dharmacarini | vyushtih khyatih sinivali kuhuh ritumati mritih || || tvashtri vairocani
    maitri niraja kaitabheshvari | bhramani bhramani bhrama bhramari bhramari bhrama || || nishkala kalaha
    nita kaulakara kalebara | vidyujjihva varshini ca hiranyakshanipatini || || jitakama kamrigaya kola
    kalpangini kala | pradhana taraka tara hitatma hitabhedini || || durakshara parabrahma mahadana mahahava
    | varuni vyaruni vani vina veni vihangama || || modapriya modakini plavani plavini plutih | ajara
    lohita laksha pratapta vishvabhojini || || mano buddhirahankarah kshetrajna kshetrapalika | caturveda
    caturbhara caturanta carupriya || || carvini corini cari shankari carmabhairavi | nirlepa nishprapanca
    ca prashanta nityavigraha || || stavya stavapriya vyala gururashritavatsala | nishkalanka niralamba
    nirdvandva nishparigraha || || nirguna nirmala nitya niriha niragha nava | nirindriya nirabhasa nirmoha
    nitinayika || || nirindhana nishkala ca lilakara niramaya | munda virupa vikrita pingalakshi gunottara
    || || padmagarbha mahagarbha vishvagarbha vilakshana | paramatma pareshani para para parantapa ||
    || samsarasetuh krurakshi murchamukta manupriya | vismaya durjaya daksha danuhantri dayalaya || ||
    parabrahma''nandarupa sarvasiddhividhayini | om | evamuddamaratantranmayoddhritya prakashitam || ||
    gopaniyam prayatnena nakhyeyam yasya kasyacit | yadicchasi drutam siddhimaishvaryam cirajivitam ||
    || arogyam nripasammanam dananyasya tu kirtayet | namnam sahasram varahyah maya te samudiritam ||
    || yah pathecchrinuyadvapi sarvapapaih pramucyate | ashvamedhasahasrasya vajapeyashatasya ca || ||
    pundarikayutasyapi phalam pathat prajayate | pathatah sarvabhavena sarva syuh siddhayah kare || ||
    jayate mahadaishvaryam sarvesham dayito bhavet | ghanasarayate vahniragadhobdhih kanayate || || siddhayashca
    trinayante vishamapyamritayate | harayante mahasarpah simhah kridamrigayate || || dasayante mahipala
    jaganmitrayate'khilam | tasmannamnam sahasrena stuta sa jagadambika | prayacchatyakhilan kaman dehante
    paramam gatim || || iti uddamaratantre shri adivarahi sahasranama stotram ||
  devanagari: देव्युवाच । श्रीकण्ठ करुणासिन्धो दीनबन्धो जगत्पते । भूतिभूषितसर्वाङ्ग परात्परतर प्रभो ॥
    ॥ कृताञ्जलिपुटा भूत्वा पृच्छाम्येकं दयानिधे । आद्या या चित्स्वरूपा या निर्विकारा निरञ्जना ॥ ॥ बोधातीता
    ज्ञानगम्या कूटस्थानन्दविग्रहा । अग्राह्यातीन्द्रिया शुद्धा निरीहा स्वावभासिका ॥ ॥ गुणातीता निष्प्रपञ्चा
    ह्यवाङ्मनसगोचरा । प्रकृतिर्जगदुत्पत्तिस्थितिसंहारकारिणी ॥ ॥ रक्षार्थं जगतो देवकार्यार्थं वा सुरद्विषाम्
    । नाशाय धत्ते सा देहं तत्तत्कार्यैकसाधकम् ॥ ॥ तत्र भूधरणार्थाय यज्ञविस्तारहेतवे । विद्युत्केशहिरण्याक्षबालाकादिवधाय
    च ॥ ॥ आविर्बभूव या शक्तिर्घोरा भूदाररूपिणी । वाराही विकटाकारा दानवासुरनाशिनी ॥ ॥ सद्यः सिद्धिकरी देवी
    घोराद्घोरतरा शिवा । तस्याः सहस्रनामाख्यं स्तोत्रं मे समुदीरय ॥ ॥ कृपालेशोऽस्ति मयि चेद्भाग्यं मे यदि
    वा भवेत् । अनुग्राह्या यद्यहं स्यां तदा वद दयानिधे ॥ ॥ ईश्वर उवाच । साधु साधु वरारोहे धन्या बहुमतासि
    मे । शुश्रूषया समुत्पन्ना भक्तिः श्रद्धान्विता तव ॥ ॥ सहस्रनाम वाराह्याः सर्वसिद्धिविधायि च । तव चेन्न
    प्रवक्ष्यामि प्रिये कस्य वदाम्यहम् ॥ ॥ किन्तु गोप्यं प्रयत्नेन संरक्ष्यं प्राणतोऽपि च । विशेषतः कलियुगे
    न देयं यस्य कस्यचित् । सर्वेऽन्यथा सिद्धिभाजो भविष्यन्ति वरानने ॥ ॥ ॐ अस्य श्रीवाराहीसहस्रनामस्तोत्रस्य
    महादेव ऋषिः । अनुष्टुप् छन्दः । वाराही देवता । ऐं बीजम् । क्रों शक्तिः । हुं कीलकम् । मम सर्वार्थसिद्ध्यर्थे
    जपे विनियोगः । ॐ वाराही वामनी वामा बगला वासवी वसुः । वैदेही वीरसूर्बाला वरदा विष्णुवल्लभा ॥ ॥ वन्दिता
    वसुदा वश्या व्यात्तास्या वञ्चिनी बला । वसुन्धरा वीतिहोत्रा वीतरागा विहायसी ॥ ॥ सर्वा खनिप्रिया काम्या
    कमला काञ्चनी रमा । धूम्रा कपालिनी वामा कुरुकुल्ला कलावती ॥ ॥ याम्याऽऽग्नेयी धरा धन्या धर्मिणी ध्यानिनी
    ध्रुवा । धृतिर्लक्ष्मीर्जया तुष्टिः शक्तिर्मेधा तपस्विनी ॥ ॥ वेधा जया कृतिः कान्तिः स्वाहा शान्तिर्दमा
    रतिः । लज्जा मतिः स्मृतिर्निद्रा तन्त्रा गौरी शिवा स्वधा ॥ ॥ चण्डी दुर्गाऽभया भीमा भाषा भामा भयानका
    । भूदारा भयहा भीरुर्भैरवी भङ्गरा भटी ॥ ॥ घुर्घुरा घोषणा घोरा घोषिणी घोणसंयुता । घनाघना घर्घरा च घोणयुक्ताऽघनाशिनी
    ॥ ॥ पूर्वाग्नेयी यातु याम्या वायव्युत्तरवारुणी । ऐशान्यूर्ध्वाधःस्थिता च पृष्ठदक्षाग्रवामगा ॥ ॥ हृन्नाभिब्रह्मरन्ध्रार्कस्वर्गपातालभूमिगा
    । ऐं श्रीः ह्रीः क्लीं तीर्थगतिः प्रीतिर्धीर्गीः कलाऽव्यया ॥ ॥ ऋग्यजुः सामरूपा च परा पोत्रिण्युदुम्बरा
    । गदासिशक्तिचापेषुशूलचक्रर्ष्टिधारिणी ॥ ॥ जरती युवती बाला चतुरङ्गबलोत्कटा । सत्याक्षरा निधिर्नेत्री
    धात्री पोत्री परा पटुः ॥ ॥ क्षेत्रज्ञा कम्पिनी ज्येष्ठा दुराधर्षा धुरन्धरा । मालिनी मानिनी माता माननीया
    मनस्विनी ॥ ॥ मदोत्कटा मन्युकरी मनुरूपा मनोजवा । मेदस्विनी मद्यरता मधुपा मङ्गलाऽमरा ॥ ॥ माया माताऽऽमयहरी
    मृडानी महिला मृतिः । महादेवी मोहहरी मञ्जुर्मृत्युञ्जयाऽमला ॥ ॥ मांसला मानवा मूला महारात्रिर्मदालसा
    । मृगाङ्का मेनका मान्या महिषघ्नी मदन्तिका ॥ ॥ मूर्छामोहमृषामोघामदमृत्युमलापहा । सिंहर्क्षमहिषव्याघ्रमृगक्रोडानना
    धुनी ॥ ॥ धरिणी धारिणी धेनुर्धरित्री धावनी धवा । धर्मध्वना ध्यानपरा धनधान्यधराप्रदा ॥ ॥ पापदोषरिपुव्याधिनाशिनी
    सिद्धिदायिनी । कलाकाष्ठाक्षमापक्षाहस्त्रुटिश्वासरूपिणी ॥ ॥ समृद्धा सुभुजा रौद्री राधा रागा रमारणिः
    । रामा रतिप्रिया रुष्टा रक्षिणी रविमध्यगा ॥ ॥ रजनी रमणी रेवा रङ्किनी रञ्जिनी रमा । रोषा रोषवती रूक्षा
    करिराज्यप्रदा रता ॥ ॥ रूक्षा रूपवती रास्या रुद्राणी रणपण्डिता । गङ्गा च यमुना चैव सरस्वतिस्वसूर्मधुः
    ॥ ॥ गण्डकी तुङ्गभद्रा च कावेरी कौशिकी पटुः । कट्वोरगवती चारा सहस्राक्षा प्रतर्दना ॥ ॥ सर्वज्ञा शाङ्करी
    शास्त्री जटाधारिण्ययोरदा । यावनी सौरभी कुब्जा वक्रतुण्डा वधोद्यता ॥ ॥ चन्द्रापीडा वेदवेद्या शङ्खिनी
    नीललोहिता । ध्यानातीताऽपरिच्छेद्या मृत्युरूपा त्रिवर्गदा ॥ ॥ अरूपा बहुरूपा च नानारूपा नतानना । वृषाकपिर्वृषारूढा
    वृषेशी वृषवाहना ॥ ॥ वृषप्रिया वृषावर्ता वृषपर्वा वृषाकृतिः । कोदण्डिनी नागचूडा चक्षुष्या परमार्थिका
    ॥ ॥ दुर्वासा दुर्गहा देवी दुरावासा दुरारिहा । दुर्गा राधा दुःखहन्त्री दुराराध्या दवीयसी ॥ ॥ दुरावासा
    दुष्प्रहस्ता दुष्प्रकम्पा दुरूहिणी । सुवेणी रमणी श्यामा मृगव्याधार्घतापिनी ॥ ॥ उग्रा तार्क्षी पाशुपती
    कौणपी कुणपाशना । कपर्दिनी कामकामा कमनीया कलोज्ज्वला ॥ ॥ कासावहृत्कारकानी कम्बुकण्ठी कृतागमा । कर्कशा
    कारणा कान्ता कल्पाऽकल्पा कटङ्कटा ॥ ॥ श्मशाननिलया भिन्ना गजारुढा गजापहा । तत्प्रिया तत्परा राया स्वर्भानुः
    कालवञ्चिनी ॥ ॥ शाखा विशाखा गोशाखा सुशाखा शेषशाखिनी । व्यङ्गा शुभाङ्गा वामाङ्गा नीलाङ्गाऽनङ्गरूपिणी
    ॥ ॥ साङ्गोपाङ्गा च सारङ्गा सुभाङ्गा रङ्गरूपिणी । भद्रा सुभद्रा भद्राक्षी सिंहिका विनताऽदितिः ॥ ॥ हृद्याऽवद्या
    सुपद्या च गद्यपद्यप्रिया प्रसूः । चर्चिका भोगवत्यम्बा सारसी शबरी नटी ॥ ॥ योगिनी पुष्कलाऽनन्ता परा
    साङ्ख्या शची सती । निम्नगा निम्ननाभिश्च सहिष्णुर्जागृती लिपिः ॥ ॥ दमयन्ती दमी दण्डोद्दण्डिनी दारदायिका
    । दीपिनी दाविनी धात्री दक्षकन्या दम्या दरत् ॥ ॥ दाहिनी द्रविणी दर्वी दण्डिनी दण्डनायिका । दानप्रिया
    दोषहन्त्री दुःखदारिद्र्यनाशिनी ॥ ॥ दोषदा दोषकृद्दोग्ध्री दोहती देविकाऽधना । दर्वीकरी दुर्वलिता दुर्युगाऽद्वयवादिनी
    ॥ ॥ चराचराऽनन्तवृष्टिरुन्मत्ता कमलाऽलसा । तारिणी तारकान्तारा परमात्माब्जलोचना ॥ ॥ इन्दुर्हिरण्यकवचा
    व्यवस्था व्यवसायिका । ईशनन्दा नदी नागी यक्षिणी सर्पिणी वरी ॥ ॥ सुधा सुरा विश्वसहा सुवर्णाङ्गदधारिणी
    । जननी प्रीतिभागेशी साम्राज्ञी संविदुत्तमा ॥ ॥ अमेयाऽरिष्टदमनी पिङ्गला लिङ्गधारिणी । चामुण्डा प्लाविनी
    हाला बृहज्ज्योतिरुरुक्रमा ॥ ॥ सुप्रतीका च सुग्रीवा हव्यवाहा प्रलापिनी । नभस्या माधवी ज्येष्ठा शिशिरा
    ज्वालिनी रुचिः ॥ ॥ शुक्ला शुक्रा शुचा शोका शुकी भेकी पिकी बकी । पृषदश्वा नभोयोनिः सुप्रतीका विभावरी
    ॥ ॥ गर्विता गुर्विणी गण्या गुरुर्गुरुधरी गया । गन्धर्वी गणिका गुन्द्रा गारुडी गोपिकाऽग्रगा ॥ ॥ गणेशी
    गामिनी गन्ता गोपतिर्गन्धिनी गवी । गर्जिता गाननी गोना गोरक्षा गोविदां गतिः ॥ ॥ ग्राथिकी ग्रथिकृद्गोष्ठी
    गर्भरूपा गुणैषिणी । पारस्करी पाञ्चनदा बहुरूपा विरूपिका ॥ ॥ ऊहा व्यूहा दुरूहा च सम्मोहा मोहहारिणी ।
    यज्ञविग्रहिणी यज्ञा यायजूका यशस्विनी ॥ ॥ अग्निष्टोमाऽत्यग्निष्टोमा वाजपेयश्च षोडशी । पुण्डरीकाऽश्वमेधश्च
    राजसूयश्च नाभसः ॥ ॥ स्विष्टकृद्बहुसौवर्णो गोसवश्च महाव्रतः । विश्वजिद्ब्रह्मयज्ञश्च प्राजापत्यः शिलायवः
    ॥ ॥ अश्वक्रान्ता रथक्रान्ता विष्णुक्रान्ता विभावसुः । सूर्यक्रान्ता गजक्रान्ता बलिभिन्नागयज्ञकः ॥
    ॥ सावित्री चार्धसावित्री सर्वतोभद्रवारुणा । आदित्यामय गोदोह गवामय मृगामया ॥ ॥ सर्पमयः कालपिञ्जः कौण्डिन्योपनागाहलः
    । अग्निविद्द्वादशाहस्वोपांशुः सोम विधो हनः ॥ ॥ अश्वप्रतिग्रहो बर्हिरथोऽभ्युदय ऋद्धिराट् । सर्वस्वदक्षिणो
    दीक्षा सोमाख्या समिदाह्वयः ॥ ॥ कठायनश्च गोदोहः स्वाहाकारस्तनूनपात् । दण्डा पुरुष मेधश्च श्येनो वज्र
    इषुर्यमः ॥ ॥ अङ्गिराः कङ्कभेरुण्डा चान्द्रायणपरायणा । ज्योतिष्टोमः गुदो दर्शो नन्द्याख्यः पौर्णमासिकः
    ॥ ॥ गजप्रतिग्रहो रात्रिः सौरभः शाङ्कलायनः । सौभाग्यकृच्च कारीषो बैदलायनरामठौ ॥ ॥ शोचिष्कारी नाचिकेतः
    शान्तिकृत्पुष्टिकृत्तथा । वैनतेयोच्चाटनौ च वशीकरण मारणे ॥ ॥ त्रैलोक्यमोहनो वीरः कन्दर्पबलशातनः । शङ्खचूडो
    गजच्छायो रौद्राख्यो विष्णुविक्रमः ॥ ॥ भैरवः कवहाख्यश्चावभृथोऽष्टकपालकः । श्रौषट् वौषट् वषट्कारः पाकसंस्था
    परिश्रुती ॥ ॥ चयनो नरमेधश्च कारीरी रत्नदानिका । सौत्रामणी च भारुन्दा बार्हस्पत्यो बलङ्गमः ॥ ॥ प्रचेताः
    सर्वसत्रश्च गजमेधः करम्भकः । हविःसंस्था सोमसंस्था पाकसंस्था गरुत्मती ॥ ॥ सत्यसूर्यश्चमसः स्रुक् स्रुवोलूखल
    मेक्षणी । चपलो मन्थनी मेढी यूपः प्राग्वंशकुञ्चिका ॥ ॥ रश्मिरंशुश्च दोभ्यश्च वारुणोदः पविः कुथा । आप्तोर्यामो
    द्रोणकलशो मैत्रावरुण आश्विनः ॥ ॥ पात्नीवतश्च मन्थी च हारियोजन एव च । प्रतिप्रस्थानशुक्रौ च सामिधेनी
    समित्समा ॥ ॥ होताऽध्वर्युस्तथोद्गाता नेता त्वष्टा च योत्रिका । आग्नीध्रोऽच्छावकाष्टावग्ग्रावस्तुत्प्रतर्दकः
    ॥ ॥ सुब्रह्मण्यो ब्राह्मणश्च मैत्रावरुणवारुणौ । प्रस्तोता प्रतिप्रस्थाता यजमानो ध्रुवन्त्रिका ॥ ॥
    आमिक्षा पृषदाज्यं च हव्यं कव्यं चरुः पयः । जुहुद्घ्रावोपभृद्ब्रह्मा त्रयी त्रेता तरस्विनी ॥ ॥ पुरोडाशः
    पशूकर्षः प्रोक्षणी ब्रह्मयज्ञिनी । अग्निजिह्वा दर्भरोमा ब्रह्मशीर्षा महोदरी ॥ ॥ अमृतप्राशिका नारायणी
    नग्ना दिगम्बरा । ओङ्कारिणी चतुर्वेदरूपा श्रुतिरनुल्बणा ॥ ॥ अष्टादशभुजा रम्भा सत्या गगनचारिणी । भीमवक्त्रा
    महावक्त्रा कीर्तिराकृष्णपिङ्गला ॥ ॥ कृष्णमूर्धा महामूर्धा घोरमूर्धा भयानना । घोरानना घोरजिह्वा घोररावा
    महाव्रता ॥ ॥ दीप्तास्या दीप्तनेत्रा च चण्डप्रहरणा जटी । सुरभी सौलभी वीची छाया सन्ध्या च मांसला ॥ ॥
    कृष्णा कृष्णाम्बरा कृष्णशार्ङ्गिणी कृष्णवल्लभा । त्रासिनी मोहिनी द्वेष्या मृत्युरूपा भयापहा ॥ ॥ भीषणा
    दानवेन्द्रघ्नी कल्पकर्ता क्षयङ्करी । अभया पृथिवी साध्वी केशिनी व्याधिजन्महा ॥ ॥ अक्षोभ्याऽऽह्लादिनी
    कन्या पवित्रा रोपिणी शुभा । कन्यादेवी सुरादेवी भीमादेवी मदन्तिका ॥ ॥ शाकम्भरी महाश्वेता धूम्रा धूम्रेश्वरीश्वरी
    । वीरभद्रा महाभद्रा महादेवी महासुरी ॥ ॥ श्मशानवासिनी दीप्ता चितिसंस्था चितिप्रिया । कपालहस्ता खट्वाङ्गी
    खड्गिनी शूलिनी हली ॥ ॥ कान्तारिणी महायोगी योगमार्गा युगग्रहा । धूम्रकेतुर्महास्यायुर्युगानां परिवर्तिनी
    ॥ ॥ अङ्गारिण्यङ्कुशकरा घण्टावर्णा च चक्रिणी । वेताली ब्रह्मवेताली महावेतालिका तथा ॥ ॥ विद्याराज्ञी
    मोहराज्ञी महाराज्ञी महोदरी । भूतं भव्यं भविष्यं च साङ्ख्यं योगस्तपो दमः ॥ ॥ अध्यात्मं चाधिदैवं चाधिभूतांश
    एव च । घण्टारवा विरूपाक्षी शिखिविच्छ्रीचयप्रिया ॥ ॥ खड्गशूलगदाहस्ता महिषासुरमर्दिनी । मातङ्गी मत्तमातङ्गी
    कौशिकी ब्रह्मवादिनी ॥ ॥ उग्रतेजा सिद्धसेना जृम्भिणी मोहिनी तथा । जया च विजया चैव विनता कद्रुरेव च
    ॥ ॥ धात्री विधात्री विक्रान्ता ध्वस्ता मूर्छा च मूर्छनी । दमनी धर्मिणी दम्या छेदिनी तापिनी तपी ॥ ॥
    बन्धिनी बाधिनी बन्धा बोधातीता बुधप्रिया । हरिणी हारिणी हन्त्री धरिणी धारिणी धरा ॥ ॥ विसाधिनी साधिनी
    च सन्ध्या सङ्गोपनी प्रिया । रेवती कालकर्णी च सिद्धिर्लक्ष्मीररुन्धती ॥ ॥ धर्मप्रिया धर्मरतिः धर्मिष्ठा
    धर्मचारिणी । व्युष्टिः ख्यातिः सिनीवाली कुहूः ऋतुमती मृतिः ॥ ॥ त्वाष्ट्री वैरोचनी मैत्री नीरजा कैटभेश्वरी
    । भ्रमणी भ्रामणी भ्रामा भ्रमरी भ्रामरी भ्रमा ॥ ॥ निष्कला कलहा नीता कौलाकारा कलेबरा । विद्युज्जिह्वा
    वर्षिणी च हिरण्याक्षनिपातिनी ॥ ॥ जितकामा कामृगया कोला कल्पाङ्गिनी कला । प्रधाना तारका तारा हितात्मा
    हितभेदिनी ॥ ॥ दुरक्षरा परब्रह्म महादाना महाहवा । वारुणी व्यरुणी वाणी वीणा वेणी विहङ्गमा ॥ ॥ मोदप्रिया
    मोदकिनी प्लवनी प्लाविनी प्लुतिः । अजरा लोहिता लाक्षा प्रतप्ता विश्वभोजिनी ॥ ॥ मनो बुद्धिरहङ्कारः क्षेत्रज्ञा
    क्षेत्रपालिका । चतुर्वेदा चतुर्भारा चतुरन्ता चरुप्रिया ॥ ॥ चर्विणी चोरिणी चारी शाङ्करी चर्मभैरवी ।
    निर्लेपा निष्प्रपञ्चा च प्रशान्ता नित्यविग्रहा ॥ ॥ स्तव्या स्तवप्रिया व्याला गुरुराश्रितवत्सला । निष्कलङ्का
    निरालम्बा निर्द्वन्द्वा निष्परिग्रहा ॥ ॥ निर्गुणा निर्मला नित्या निरीहा निरघा नवा । निरिन्द्रिया निराभासा
    निर्मोहा नीतिनायिका ॥ ॥ निरिन्धना निष्कला च लीलाकारा निरामया । मुण्डा विरूपा विकृता पिङ्गलाक्षी गुणोत्तरा
    ॥ ॥ पद्मगर्भा महागर्भा विश्वगर्भा विलक्षणा । परमात्मा परेशानी परा पारा परन्तपा ॥ ॥ संसारसेतुः क्रूराक्षी
    मूर्छामुक्ता मनुप्रिया । विस्मया दुर्जया दक्षा दनुहन्त्री दयालया ॥ ॥ परब्रह्माऽऽनन्दरूपा सर्वसिद्धिविधायिनी
    । ओम् । एवमुड्डामरातन्त्रान्मयोद्धृत्य प्रकाशितम् ॥ ॥ गोपनीयं प्रयत्नेन नाख्येयं यस्य कस्यचित् । यदीच्छसि
    द्रुतं सिद्धिमैश्वर्यं चिरजीविताम् ॥ ॥ आरोग्यं नृपसम्मानं दानान्यस्य तु कीर्तयेत् । नाम्नां सहस्रं
    वाराह्याः मया ते समुदीरितम् ॥ ॥ यः पठेच्छृणुयाद्वापि सर्वपापैः प्रमुच्यते । अश्वमेधसहस्रस्य वाजपेयशतस्य
    च ॥ ॥ पुण्डरीकायुतस्यापि फलं पाठात् प्रजायते । पठतः सर्वभावेन सर्वा स्युः सिद्धयः करे ॥ ॥ जायते महदैश्वर्यं
    सर्वेषां दयितो भवेत् । घनसारायते वह्निरगाधोब्धिः कणायते ॥ ॥ सिद्धयश्च तृणायन्ते विषमप्यमृतायते । हारायन्ते
    महासर्पाः सिंहः क्रीडामृगायते ॥ ॥ दासायन्ते महीपाला जगन्मित्रायतेऽखिलम् । तस्मान्नाम्नां सहस्रेण स्तुता
    सा जगदम्बिका । प्रयच्छत्यखिलान् कामान् देहान्ते परमां गतिम् ॥ ॥ इति उड्डामरतन्त्रे श्री आदिवाराही
    सहस्रनाम स्तोत्रम् ॥
