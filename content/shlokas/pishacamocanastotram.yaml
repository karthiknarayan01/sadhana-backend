id: pishacamocanastotram
category: stotram
name:
  english: pishacamocanastotram
  devanagari: पिशाचमोचनस्तोत्रम्
content:
  english: pishacamocanastotram shriganeshaya namah | shrilakshminrisimhaya namah | vishuddhamajamanandamekamatramakhanditam
    | saccinmatram param shantam taddhi brahma namamyaham || 1|| yaddhasa nikhilam bhati yasya nanyatprakashakam
    | puranamavyayam jyotim taddhi brahma namamyaham || 2|| yadekam sarvabhuteshu pratirupataya sthitam
    | jyotiryathodapatreshu taddhi brahma namamyaham || 3|| yadantah sarvabhutanam yadrupamabadhitam |
    mevabharanadinam taddhi brahma namamyaham || 4|| yadekam sarvabhavanam nirantaramadushitam | cinmatram
    nishkalam purnam taddhi brahma namamyaham || 5|| ye narthanbhajate jantuh indriyeshu manasyapi | nirahankaramanandam
    taddhi brahma namamyaham || 6|| yanmano manasam pranah prananamindriyam varam | sarvatmakamakhandam
    sattaddhi brahma namamyaham || 7|| yannamagunarupadyaih vicitramanisarvagam | niyate pashubuddhinam
    taddhi brahma namamyaham || 8|| yasmadudeti sadvishvam yena jivati vardhate | yasmin praliyate sarvam
    taddhi brahma namamyaham || 9|| yato vagadaya bhavah utthitah svasvakarmasu | pravartante sakshirupat
    taddhi brahma namamyaham || 10|| yad grasakam grasakanam viranam ca vivardhanam | vyapakam vyapakanam
    ca taddhi brahma namamyaham || 11|| sakalam nishkalam vyoma mayatitam niranjanam | astinastidvayatitam
    taddhi brahma namamyaham || 12|| yajjvalayati kaladyastamo yena prakashate | mahajvalatamorupam taddhi
    brahma namamyaham || 13|| yatsarvato vadanavatsarvatah karanacchirah | sarvato nayanashrotram taddhi
    brahma namamyaham || 14|| yadvicaravato nrinam bandho'nadi tamobhavah | sadyo nashyati sharirastaddhi
    brahma namamyaham || 15|| yasyajnayanilarkendumrityuvahnigrahadayah | svakarmasu vartante taddhi brahma
    namamyaham || 16|| yannama mangalatamam mangalanamanuttamam | stutibhih stuyate vedaistaddhi brahma
    namamyaham || 17|| yasya'tmatam vidam mrityuranadi mriyate kshanat | mrityumaranamapurnam taddhi brahma
    namamyaham || 18|| nishidhya sarvaloke'smin yaccheshamupalabhyate | sattamatramanirdeshyam taddhi
    brahma namamyaham || 19|| purnamantam bahih purnam yena purnena puryate | purnasya purnamakasham taddhi
    brahma namamyaham || 20|| ugram viram mahavishnum jvalantam sarvato mukham | nrisimham bhishanam bhadram
    mrityumrityum namamyaham || 21|| iti nrisimhapurane shivaparvatisamvade pishacamocanastotram sampurnam
    |
  devanagari: पिशाचमोचनस्तोत्रम् श्रीगणेशाय नमः । श्रीलक्ष्मीनृसिंहाय नमः । विशुद्धमजमानन्दमेकमात्रमखण्डितम्
    । सच्चिन्मात्रं परं शान्तं तद्धि ब्रह्म नमाम्यहम् ॥ १॥ यद्धासा निखिलं भाति यस्य नान्यत्प्रकाशकम् ।
    पुराणमव्ययं ज्योतिं तद्धि ब्रह्म नमाम्यहम् ॥ २॥ यदेकं सर्वभूतेषु प्रतिरूपतया स्थितम् । ज्योतिर्यथोदपात्रेषु
    तद्धि ब्रह्म नमाम्यहम् ॥ ३॥ यदन्तः सर्वभूतानां यद्रूपमबाधितम् । मेवाभरणादीनां तद्धि ब्रह्म नमाम्यहम्
    ॥ ४॥ यदेकं सर्वभावानां निरन्तरमदूषितम् । चिन्मात्रं निष्कलं पूर्णं तद्धि ब्रह्म नमाम्यहम् ॥ ५॥ ये
    नार्थान्भजते जन्तुः इन्द्रियेषु मनस्यपि । निरहङ्कारमानन्दं तद्धि ब्रह्म नमाम्यहम् ॥ ६॥ यन्मनो मनसां
    प्राणः प्राणानामिन्द्रियं वरम् । सर्वात्मकमखण्डं सत्तद्धि ब्रह्म नमाम्यहम् ॥ ७॥ यन्नामगुणरूपाद्यैः
    विचित्रमणिसर्वगम् । नीयते पशुबुद्धीनां तद्धि ब्रह्म नमाम्यहम् ॥ ८॥ यस्मादुदेति सद्विश्वं येन जीवति
    वर्धते । यस्मिन् प्रलीयते सर्वं तद्धि ब्रह्म नमाम्यहम् ॥ ९॥ यतो वागादया भावाः उत्थिताः स्वस्वकर्मसु
    । प्रवर्तन्ते साक्षिरूपात् तद्धि ब्रह्म नमाम्यहम् ॥ १०॥ यद् ग्रासकं ग्रासकाणां वीराणां च विवर्धनम्
    । व्यापकं व्यापकानां च तद्धि ब्रह्म नमाम्यहम् ॥ ११॥ सकलं निष्कलं व्योम मायातीतं निरञ्जनम् । अस्तिनास्तिद्वयातीतं
    तद्धि ब्रह्म नमाम्यहम् ॥ १२॥ यज्ज्वालयति कालाद्यास्तमो येन प्रकाशते । महाज्वालातमोरूपं तद्धि ब्रह्म
    नमाम्यहम् ॥ १३॥ यत्सर्वतो वदनवत्सर्वतः करणाच्छिरः । सर्वतो नयनश्रोत्रं तद्धि ब्रह्म नमाम्यहम् ॥ १४॥
    यद्विचारवतो नृणां बन्धोऽनादि तमोभवः । सद्यो नश्यति शारीरस्तद्धि ब्रह्म नमाम्यहम् ॥ १५॥ यस्याज्ञयानिलार्केन्दुमृत्युवह्निग्रहादयः
    । स्वकर्मसु वर्तन्ते तद्धि ब्रह्म नमाम्यहम् ॥ १६॥ यन्नाम मङ्गलतमं मङ्गलानामनुत्तमम् । स्तुतिभिः स्तूयते
    वेदैस्तद्धि ब्रह्म नमाम्यहम् ॥ १७॥ यस्याऽत्मतां विदां मृत्युरनादि म्रियते क्षणात् । मृत्युमारणमापूर्णं
    तद्धि ब्रह्म नमाम्यहम् ॥ १८॥ निषिध्य सर्वलोकेऽस्मिन् यच्छेषमुपलभ्यते । सत्तामात्रमनिर्देश्यं तद्धि
    ब्रह्म नमाम्यहम् ॥ १९॥ पूर्णमन्तं बहिः पूर्णं येन पूर्णेन पूर्यते । पूर्णस्य पूर्णमाकाशं तद्धि ब्रह्म
    नमाम्यहम् ॥ २०॥ उग्रं वीरं महाविष्णुं ज्वलन्तं सर्वतो मुखम् । नृसिंहं भीषणं भद्रं मृत्युमृत्युं नमाम्यहम्
    ॥ २१॥ इति नृसिंहपुराणे शिवपार्वतीसंवादे पिशाचमोचनस्तोत्रं सम्पूर्णम् ।
