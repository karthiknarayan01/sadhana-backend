id: durga-suktam
category: stotram
name:
  english: Durga Suktam
  devanagari: दुर्गासूक्तम्
content:
  english: '|| atha durga suktam || om jatavedase sunavama soma maratiyato nidahati vedah | sa nah parshadati
    durgani vishva naveva sindhum durita''tyagnih || 1|| tamagnivarnam tapasa jvalantim vairocanim karmaphaleshu
    jushtam | durgam devi sharanamaham prapadye sutarasi tarase namah || 2|| agne tvam paraya navyo asmanthsvastibhirati
    durgani vishva | pushca prithvi bahula na urvi bhava tokaya tanayaya shamyoh || 3|| vishvani no durgaha
    jatavedah sindhunna nava durita''tiparshi | agne atrivanmanasa grinano''smakam bodhyavita tanunam
    || 4|| pritana jita sahamanamugramagni huvema paramathsadhasthat | sa nah parshadati durgani vishva
    kshamaddevo ati duritatyagnih || 5|| pratnoshi kamidyo adhvareshu sanacca hota navyashca sathsi |
    svancagne tanuvam piprayasvasmabhyam ca saubhagamayajasva || 6|| gobhirjushtamayujo nishiktantavendra
    vishnoranusamcarema | nakasya prishthamabhi samvasano vaishnavim loka iha madayantam || 7|| om katyayanaya
    vidmahe kanyakumari dhimahi | tanno durgih pracodayat || || iti durga suktam || om shantih shantih
    shantih || taittiriyaranyakam 4, prapathakah 10, anuvakah 2'
  devanagari: ॥ अथ दुर्गा सूक्तम् ॥ ॐ जातवेदसे सुनवाम सोम मरातीयतो निदहाति वेदः । स नः पर्षदति दुर्गाणि
    विश्वा नावेव सिन्धुं दुरिताऽत्यग्निः ॥ १॥ तामग्निवर्णां तपसा ज्वलन्तीं वैरोचनीं कर्मफलेषु जुष्टाम्
    । दुर्गां देवी शरणमहं प्रपद्ये सुतरसि तरसे नमः ॥ २॥ अग्ने त्वं पारया नव्यो अस्मान्थ्स्वस्तिभिरति दुर्गाणि
    विश्वा । पूश्च पृथ्वी बहुला न उर्वी भवा तोकाय तनयाय शंयोः ॥ ३॥ विश्वानि नो दुर्गहा जातवेदः सिन्धुन्न
    नावा दुरिताऽतिपर्षि । अग्ने अत्रिवन्मनसा गृणानोऽस्माकं बोध्यविता तनूनाम् ॥ ४॥ पृतना जित सहमानमुग्रमग्नि
    हुवेम परमाथ्सधस्थात् । स नः पर्षदति दुर्गाणि विश्वा क्षामद्देवो अति दुरितात्यग्निः ॥ ५॥ प्रत्नोषि
    कमीड्यो अध्वरेषु सनाच्च होता नव्यश्च सथ्सि । स्वाञ्चाग्ने तनुवं पिप्रयस्वास्मभ्यं च सौभगमायजस्व ॥
    ६॥ गोभिर्जुष्टमयुजो निषिक्तन्तवेन्द्र विष्णोरनुसंचरेम । नाकस्य पृष्ठमभि संवसानो वैष्णवीं लोक इह मादयन्ताम्
    ॥ ७॥ ॐ कात्यायनाय विद्महे कन्यकुमारि धीमहि । तन्नो दुर्गिः प्रचोदयात् ॥ ॥ इति दुर्गा सूक्तम् ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ तैत्तिरीयारण्यकम् ४, प्रपाठकः १०, अनुवाकः २
