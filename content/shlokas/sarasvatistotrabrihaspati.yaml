id: sarasvatistotrabrihaspati
category: stotram
name:
  english: sarasvatistotrabrihaspati
  devanagari: सरस्वतिस्तोत्रब्रिहस्पति
content:
  english: vartate nirmalam jnanam kumatidhvamsakarakam | stotrenanena yo bhaktya mam stuvanti sada narah
    || 7|| trisandhyam prayato bhutva yah stuti pathate tatha | tasya kanthe sada vasam karishyami na
    samshayah || 8|| prathamam bharati caiva dvitiyam tu sarasvati | tritiyam sharada devi caturtha kamsamardani
    || 9|| pancamam tu jaganmata shashtham caiva tu parvati | saptamam caiva varahi hyashtamam brahmacarini
    || 10|| navamam caiva kamakshi dashamam brahmaputrika | ekadasham tu lakshmistu dvadasham surasundari
    || 11|| dvadashaitani namani trisandhyam yah pathennarah | tasya sarasvatam caiva shanmasadeva sidhyati
    || 12|| sidbhasarasvatam siddhasarasvatam nama stotram vakshye'hamuttamam | uma ca bharati bhadra
    vani ca vijaya jaya || 13|| vani sarvagata gauri kamakshi kamalapriya | sarasvati ca kamala matangi
    cetana shiva || 14|| kshemankari shivanandi kundali vaishnavi tatha | ai indri madhumati lakshmirgirija
    shambhavambika tara padmavati hamsa panavasa manonmani | aparna lalita devi kaumari kabari tatha ||
    16|| shambhavi mumukhi netri trinetri vishvarupini | arya mridani hinkari sadhani sumanashca hi ||
    17|| sukshma parapara kartasvaravarna haripriya | jvalamalinika carca kanya ca kamalasana || 18||
    mahalakshmirmahasiddhih svadha svaha sudhamayi | trilokapavani bhi trisandhya tripura trayi || 19||
    trishaktistripura durga brahmi trailokyamohini | tripushkaratrivargadau trivarna trisvadhamayi ||
    20|| triguna nirguna nitya nirvikara niranjana | kamakshi kamini kanta kamada kalahamsaga || 21||
    sahaja kalaja prajna rama mangalasundari | vagvilasa vishalakshi sarvavidya sumangala || 22|| kali
    maheshvari caiva bhairavi bhuvaneshvari | ashtottarashatam namnam vagbhatriḻa capurarjitam || 23||
    trisandhyam kirtayedyastu sarvasiddhim labheta sah | ayurarogyamaishvarya sukha sampattivardhanam
    || 24|| shatkarmasiddhidam stotram sakshatrailokyamohanam | siddhasarasvatam caiva bhavedvishayanashanam
    || 25|| || iti shrisarasvatistotram siddhasarasvatam sampurnam ||
  devanagari: वर्तते निर्मलं ज्ञानं कुमतिध्वंसकारकम् । स्तोत्रेणानेन यो भक्त्या मां स्तुवन्ति सदा नरः
    ॥ ७॥ त्रिसन्ध्यं प्रयतो भूत्वा यः स्तुति पठते तथा । तस्य कण्ठे सदा वासं करिष्यामि न संशयः ॥ ८॥ प्रथमं
    भारती चैव द्वितीयं तु सरस्वती । तृतीयं शारदा देवी चतुर्थ कंसमर्दनी ॥ ९॥ पञ्चमं तु जगन्माता षष्ठं चैव
    तु पार्वती । सप्तमं चैव वाराही ह्यष्टमं ब्रह्मचारिणी ॥ १०॥ नवमं चैव कामाक्षी दशमं ब्रह्मपुत्रिका ।
    एकादशं तु लक्ष्मीस्तु द्वादशं सुरसुन्दरी ॥ ११॥ द्वादशैतानि नामानि त्रिसन्ध्यं यः पठेन्नरः । तस्य सारस्वतं
    चैव षण्मासादेव सिध्यति ॥ १२॥ सिद्भसारस्वतं सिद्धसारस्वतं नाम स्तोत्रं वक्ष्येऽहमुत्तमम् । उमा च भारती
    भद्रा वाणी च विजया जया ॥ १३॥ वाणी सर्वगता गौरी कामाक्षी कमलप्रिया । सरस्वती च कमला मातङ्गी चेतना शिवा
    ॥ १४॥ क्षेमङ्करी शिवानन्दी कुण्डली वैष्णवी तथा । ऐ इन्द्री मधुमती लक्ष्मीर्गिरिजा शाम्भवाम्बिका तारा
    पद्मावती हंसा पनवासा मनोन्मणी । अपर्णा ललिता देवी कौमारी कबरी तथा ॥ १६॥ शाम्भवी मुमुखी नेत्री त्रिनेत्री
    विश्वरूपिणी । आर्या मृडानी हीङ्कारी साधनी सुमनाश्च हि ॥ १७॥ सूक्ष्मा परापरा कार्तस्वरवर्णा हरिप्रिया
    । ज्वालामालिनिका चर्चा कन्या च कमलासना ॥ १८॥ महालक्ष्मीर्महासिद्धिः स्वधा स्वाहा सुधामयी । त्रिलोकपावनी
    भी त्रिसन्ध्या त्रिपुरा त्रयी ॥ १९॥ त्रिशक्तिस्त्रिपुरा दुर्गा ब्राह्मी त्रैलोक्यमोहिनी । त्रिपुष्करत्रिवर्गादौ
    त्रिवर्णा त्रिस्वधामयी ॥ २०॥ त्रिगुणा निर्गुणा नित्या निर्विकारा निरञ्जना । कामाक्षी कामिनी कान्ता
    कामदा कलहंसगा ॥ २१॥ सहजा कालजा प्रज्ञा रमा मङ्गलसुन्दरी । वाग्विलासा विशालाक्षी सर्वविद्या सुमङ्गला
    ॥ २२॥ काली महेश्वरी चैव भैरवी भुवनेश्वरी । अष्टोत्तरशतं नाम्नां वाग्भत्रिळ चपुरार्जितम् ॥ २३॥ त्रिसन्ध्यं
    कीर्तयेद्यस्तु सर्वसिद्धिं लभेत सः । आयुरारोग्यमैश्वर्य सुख सम्पत्तिवर्धनम् ॥ २४॥ षट्कर्मसिद्धिदं
    स्तोत्रं साक्षात्रैलोक्यमोहनम् । सिद्धसारस्वतं चैव भवेद्विषयनाशनम् ॥ २५॥ ॥ इति श्रीसरस्वतीस्तोत्रं
    सिद्धसारस्वतं सम्पूर्णम् ॥
