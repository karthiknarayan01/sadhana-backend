id: annamayya-keerthanas-naraayanaaya-namo-namo
category: stotram
name:
  english: Annamayya Keerthanas Naraayanaaya Namo Namo
content:
  english: narayanaya namo namo nanatmane namo namo yiracanalane yèvvaru dalacina yihapara mantramu lindariki
    || govindaya namo namo gopalaya namo namo bhavajagurave namo namo pranavatmane namo namo | deveshaya
    namo namo divyagunaya namo yanucu yivarusalane yèvvaru dalacina yihapara mantramu lindariki || damodaraya
    namo namo dharanishaya namo namo shrimahilapataye namo shishtarakshine namo namo | vamanaya te namo
    namo vanajakshaya namo namo yimeralane yèvvaru dalacina yihapara mantramu lindariki || paripurnaya
    namo namo pranavagraya namo namo cirantana shri venkatanayaka sheshashayine namo namo | narakadhvamse
    namo namo narasimhaya namo namo yiravuga nigati nèvvaru dalacina yihapara mantramu lindariki ||
  devanagari: नारायणाय नमो नमो नानात्मने नमो नमो यीरचनलने यॆव्वरु दलचिन यिहपर मन्त्रमु लिन्दरिकि ॥ गोविन्दाय
    नमो नमो गोपालाय नमो नमो भावजगुरवे नमो नमो प्रणवात्मने नमो नमो । देवेशाय नमो नमो दिव्यगुणाय नमो यनुचु
    यीवरुसलने यॆव्वरु दलचिन यिहपर मन्त्रमु लिन्दरिकि ॥ दामोदराय नमो नमो धरणीशाय नमो नमो श्रीमहिलापतये
    नमो शिष्टरक्षिणे नमो नमो । वामनाय ते नमो नमो वनजाक्षाय नमो नमो यीमेरलने यॆव्वरु दलचिन यिहपर मन्त्रमु
    लिन्दरिकि ॥ परिपूर्णाय नमो नमो प्रणवाग्राय नमो नमो चिरन्तन श्री वेङ्कटनायक शेषशायिने नमो नमो । नरकध्वंसे
    नमो नमो नरसिंहाय नमो नमो यिरवुग नीगति नॆव्वरु दलचिन यिहपर मन्त्रमु लिन्दरिकि ॥
