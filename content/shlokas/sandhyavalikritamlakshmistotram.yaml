id: sandhyavalikritamlakshmistotram
category: stotram
name:
  english: sandhyavalikritamlakshmistotram
  devanagari: सन्ध्यावलीकृतंलक्ष्मीस्तोत्रम्
content:
  english: ndhyavali pranjalistam natva hridi jagada ca | namo matre mahalakshmyai trahi bhaktam ca me
    patim || 4|| namah prakritisamjnayai mulayai te namo namah | samhartryai brahmamatre te kukshisrishtyai
    namo namah || 5|| vamana vapi dirghashca narayanastu te mukhe | mahakaladayashcapi santi grasashca
    te namah || 6|| sankarshanastatha rudra yamashcaiva tavanane | damshtraikacarvanah sarve mahamatre
    namo namah || 7|| vasudevastatha bhuma narayanashca purushah | tvatpallatataditaste mahashaktyai namo
    namah || 8|| tvatto lakshmih samutpanna mahavishnustvadankajah | brahmandani ca te romni raksha lakshmyai
    namo namah || 9|| mahagnayastu te gupte tvatsvede vadava'nalah | bhagavantashca te garbhe candalakshmyai
    namo'stu te || 10|| jrimbhe te pralayah santi cande kalah prakampate | curnayante mahandani prishthamride
    namo'stu te || 11|| raksha raksha mahamaye patim me parameshvari | candi tandi mahamundi ghamandi
    dindikadikah || 12|| kalikaraliprajvalilihaliraktiladikah | shaktayaste raktaleshah pahi kantam drutam
    kuru || 13|| pahi shighram canyatha tvam galam nikritya pujaye | yadyaham vidhava syam cetpurvam tvam
    vidhava bhava || 14|| yadyaham rajyashunyam syam tvam vaikuntham vina bhava | yadyavamanito raja syatpatiste'pyamanitah
    || 15|| madyajne cedbhavedvighnam tava yajne tatha'stu vai | vadatyevam candavega sha
  devanagari: न्ध्यावली प्राञ्जलिस्तां नत्वा हृदि जगाद च । नमो मात्रे महालक्ष्म्यै त्राहि भक्तं च मे पतिम्
    ॥ ४॥ नमः प्रकृतिसंज्ञायै मूलायै ते नमो नमः । संहर्त्र्यै ब्रह्ममात्रे ते कुक्षिसृष्ट्यै नमो नमः ॥
    ५॥ वामना वापि दीर्घाश्च नारायणास्तु ते मुखे । महाकालादयश्चापि सन्ति ग्रासाश्च ते नमः ॥ ६॥ सङ्कर्षणास्तथा
    रुद्रा यमाश्चैव तवानने । दंष्ट्रैकचर्वणाः सर्वे महामात्रे नमो नमः ॥ ७॥ वासुदेवस्तथा भूमा नारायणाश्च
    पूरुषाः । त्वत्पल्लताताडितास्ते महाशक्त्यै नमो नमः ॥ ८॥ त्वत्तो लक्ष्मीः समुत्पन्ना महाविष्णुस्त्वदङ्कजः
    । ब्रह्माण्डानि च ते रोम्णि रक्ष लक्ष्म्यै नमो नमः ॥ ९॥ महाग्नयस्तु ते गुप्ते त्वत्स्वेदे वाडवाऽनलाः
    । भगवन्तश्च ते गर्भे चण्डलक्ष्म्यै नमोऽस्तु ते ॥ १०॥ जृम्भे ते प्रलयाः सन्ति चण्डे कालः प्रकम्पते
    । चूर्णायन्ते महाण्डानि पृष्ठम्रीडे नमोऽस्तु ते ॥ ११॥ रक्ष रक्ष महामाये पतिं मे परमेश्वरि । चण्डी
    तण्डी महामुण्डी घमण्डी डिण्डिकादिकाः ॥ १२॥ कालीकरालीप्रज्वालीलिहालीरक्तिलादिकाः । शक्तयस्ते रक्तलेशः
    पाहि कान्तं द्रुतं कुरु ॥ १३॥ पाहि शीघ्रं चान्यथा त्वां गलं निकृत्य पूजये । यद्यहं विधवा स्यां चेत्पूर्वं
    त्वं विधवा भव ॥ १४॥ यद्यहं राज्यशून्यां स्यां त्वं वैकुण्ठं विना भव । यद्यवमानितो राजा स्यात्पतिस्तेऽप्यमानितः
    ॥ १५॥ मद्यज्ञे चेद्भवेद्विघ्नं तव यज्ञे तथाऽस्तु वै । वदत्येवं चण्डवेगा श
