id: narayanastotram-4
category: stotram
name:
  english: narayanastotram
  devanagari: नारायणस्तोत्रम्
content:
  english: narayana narayana jaya govinda hare || narayana narayana jaya gopala hare || dhru || karunaparavara
    varunalayagambhira || narayana || 1|| ghananiradasankasha kritakalikalmashanasha || narayana || 2||
    yamunatiravihara dhritakaustubhamanihara || narayana || 3|| pitambaraparidhana surakalyananidhana
    || narayana || 4|| manjulagunjabhusha mayamanushavesha || narayana || 5|| radhadharamadhurasika rajanikarakulatilaka
    || narayana || 6|| muraliganavinoda vedastutabhupada || narayana || 7|| barhinibarhapida natanatakaphanikrida
    || narayana || 8|| varijabhushabharana rajivarukminiramana || narayana || 9|| jalaruhadalanibhanetra
    jagadarambhakasutra || narayana || 10|| patakarajanisamhara karunalaya mamuddhara || narayana || 11||
    aghabakakshayakamsare keshava krishna murare || narayana || 12|| hatakanibhapitambara abhayam kuru
    me mavara || narayana || 13|| dasharatharajakumara danavamadasamhara || narayana || 14|| govardhanagiriramana
    gopimanasaharana || narayana || 15|| sharayutiravihara sajjanarishimandara || narayana || 16|| vishvamitramakhatra
    vividhaparasucaritra || narayana || 17|| dhvajavajrankushapada dharanisutasahamoda || narayana ||
    18|| janakasutapratipala jaya jaya samsritilila || narayana || 19|| dasharathavagdhritibhara dandakavanasancara
    || narayana || 20|| mushtikacanurasamhara munimanasavihara || narayana || 21|| valivinigrahashaurya
    varasugrivahitarya || narayana || 22|| mam muralikara dhivara palaya palaya shridhara || narayana
    || 23|| jalanidhibandhanadhira ravanakanthavidara || narayana || 24|| tatimadadalanadhya natagunavividhadhanadhya
    || narayana || 25|| gautamapatnipujana karunaghanavalokana || narayana || 26|| sambhramasitahara saketapuravihara
    || narayana || 27|| acaloddhriticancatkara bhaktanugrahatatpara || narayana || 28|| naigamaganavinoda
    rakshahsutaprahlada || narayana || 29|| bharatiyativarashankara namamritamakhilantara || narayana
    || 30|| | iti shrimacchankaracaryaviracitam narayanastotram sampurnam |
  devanagari: नारायण नारायण जय गोविन्द हरे ॥ नारायण नारायण जय गोपाल हरे ॥ ध्रु ॥ करुणापारावार वरुणालयगम्भीर
    ॥ नारायण ॥ १॥ घननीरदसङ्काश कृतकलिकल्मषनाश ॥ नारायण ॥ २॥ यमुनातीरविहार धृतकौस्तुभमणिहार ॥ नारायण ॥
    ३॥ पीताम्बरपरिधान सुरकल्याणनिधान ॥ नारायण ॥ ४॥ मञ्जुलगुञ्जाभूष मायामानुषवेष ॥ नारायण ॥ ५॥ राधाधरमधुरसिक
    रजनीकरकुलतिलक ॥ नारायण ॥ ६॥ मुरलीगानविनोद वेदस्तुतभूपाद ॥ नारायण ॥ ७॥ बर्हिनिबर्हापीड नटनाटकफणिक्रीड
    ॥ नारायण ॥ ८॥ वारिजभूषाभरण राजिवरुक्मिणीरमण ॥ नारायण ॥ ९॥ जलरुहदलनिभनेत्र जगदारम्भकसूत्र ॥ नारायण
    ॥ १०॥ पातकरजनीसंहर करुणालय मामुद्धर ॥ नारायण ॥ ११॥ अघबकक्षयकंसारे केशव कृष्ण मुरारे ॥ नारायण ॥ १२॥
    हाटकनिभपीताम्बर अभयं कुरु मे मावर ॥ नारायण ॥ १३॥ दशरथराजकुमार दानवमदसंहार ॥ नारायण ॥ १४॥ गोवर्धनगिरिरमण
    गोपीमानसहरण ॥ नारायण ॥ १५॥ शरयूतीरविहार सज्जनऋषिमन्दार ॥ नारायण ॥ १६॥ विश्वामित्रमखत्र विविधपरासुचरित्र
    ॥ नारायण ॥ १७॥ ध्वजवज्राङ्कुशपाद धरणीसुतसहमोद ॥ नारायण ॥ १८॥ जनकसुताप्रतिपाल जय जय संसृतिलील ॥ नारायण
    ॥ १९॥ दशरथवाग्धृतिभार दण्डकवनसञ्चार ॥ नारायण ॥ २०॥ मुष्टिकचाणूरसंहार मुनिमानसविहार ॥ नारायण ॥ २१॥
    वालिविनिग्रहशौर्य वरसुग्रीवहितार्य ॥ नारायण ॥ २२॥ मां मुरलीकर धीवर पालय पालय श्रीधर ॥ नारायण ॥ २३॥
    जलनिधिबन्धनधीर रावणकण्ठविदार ॥ नारायण ॥ २४॥ ताटीमददलनाढ्य नटगुणविविधधनाढ्य ॥ नारायण ॥ २५॥ गौतमपत्नीपूजन
    करुणाघनावलोकन ॥ नारायण ॥ २६॥ सम्भ्रमसीताहार साकेतपुरविहार ॥ नारायण ॥ २७॥ अचलोद्धृतिचञ्चत्कर भक्तानुग्रहतत्पर
    ॥ नारायण ॥ २८॥ नैगमगानविनोद रक्षःसुतप्रह्लाद ॥ नारायण ॥ २९॥ भारतीयतिवरशङ्कर नामामृतमखिलान्तर ॥ नारायण
    ॥ ३०॥ । इति श्रीमच्छङ्कराचार्यविरचितं नारायणस्तोत्रं सम्पूर्णम् ।
