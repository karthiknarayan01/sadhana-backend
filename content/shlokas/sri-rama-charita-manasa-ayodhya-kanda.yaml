    कुमुख बचन सुभ कैसे। मगहँ गयादिक तीरथ जैसे ॥ रामहि मातु बचन सब भाए। जिमि सुरसरि गत सलिल सुहाए ॥ दो
    गि मुरुछा रामहि सुमिरि नृप फिरि करवट लीन्ह। सचिव राम आगमन कहि बिनय समय सम कीन्ह ॥ ॥ अवनिप अकनि रामु
