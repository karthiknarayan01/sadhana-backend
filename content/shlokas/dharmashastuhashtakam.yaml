id: dharmashastuhashtakam
category: stotram
name:
  english: dharmashastuhashtakam
  devanagari: धर्मशास्तुःअष्टकम्
content:
  english: gunjapinaddhakacabharalasatkiritam | shastarameva satatam sa tu sarvalokan vismapaynnijavilokanat
    nitantam || 3|| panceshukaitabhavirodhitanubhavam tam arudhadantiparamadritamandahasam | hastambujairaviratam
    nijabhaktahamse shvriddhim param hi dadatam bhuvanaikavandyam || 4|| gunjamanisragupalakshitakeshahastam
    kasturikatilakamohanasarvalokam | pancananambujalasat ghanakarnapasham shastaramamburuhalocanamishamide
    || 5|| pancananam dashabhujam dhritahetidandam dharavatadapi ca rushnikamalikabhih | icchanurupaphalado'smyahameva
    bhakte
  devanagari: गुञ्जापिनद्धकचभारलसत्किरीटम् । शास्तारमेव सततं स तु सर्वलोकान् विस्मापय्न्निजविलोकनत् नितान्तम्
    ॥ ३॥ पञ्चेषुकैटभविरोधितनूभवं तं आरूढदन्तिपरमादृतमन्दहासम् । हस्ताम्बुजैरविरतं निजभक्तहंसे ष्वृद्धिं
    परां हि ददतं भुवनैकवन्द्यम् ॥ ४॥ गुञ्जामणिस्रगुपलक्षितकेशहस्तं कस्तूरिकातिलकमोहनसर्वलोकम् । पञ्चाननाम्बुजलसत्
    घनकर्णपाशं शास्तारमम्बुरुहलोचनमीशमीडे ॥ ५॥ पञ्चाननं दशभुजं धृतहेतिदण्डं धारावतादपि च रूष्णिकमालिकाभिः
    । इच्छानुरूपफलदोऽस्म्यहमेव भक्ते
meaning: {}
