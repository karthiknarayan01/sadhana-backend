id: radhak-ishnasahasra-2
category: sahasranama
name:
  english: radhakṟishnasahasra
  devanagari: राधाक्ऱिश्णसहस्र
content:
  english: '| akruratapashamano rajakayuhpranashanah || 80|| mathuranandadayi ca kamsavastravilunthanah
    | kamsavastraparidhano gopavastrapradayakah || 81|| sudamagrihagami ca sudamaparipujitah | tantuvayakasampritah
    kubjacandanalepanah || 82|| kubjarupaprado vijno mukundo vishtarashravah | sarvajno mathuraloki sarvalokabhinandanah
    || 83|| kripakatakshadarshi ca daityarirdevapalakah | sarvaduhkhaprashamano dhanurbhangi mahotsavah
    || 84|| kuvalayapidahanta dantaskandhabalagranih | kalparupadharo dhiro divyavastranulepanah || 85||
    mallarupo mahakalah kamarupi balanvitah | kamsatrasakaro bhimo mushtikantashca kamsaha || 86|| canuraghno
    bhayaharah shalaristoshalantakah | vaikunthavasi kamsarih sarvadushtanishudanah || 87|| devadundubhinirghoshi
    pitrishokanivaranah | yadavendrah satamnatho yadavaripramarddanah || 88|| shaurishokavinashi ca devakitapanashanah
    | ugrasenaparitrata ugrasenabhipujitah || 89|| ugrasenabhisheki ca ugrasenadayaparah | sarvasatvatasakshi
    ca yadunamabhinandanah || 90|| sarvamathurasamsevyah karuno bhaktabandhavah | sarvagopaladhanado gopigopalalalasah
    || 91|| shauridattopaviti ca ugrasenadayakarah | gurubhakto brahmacari nigamadhyayane ratah || 92||
    sankarshanasahadhyayi sudamasuhrideva ca | vidyanidhih kalakosho mritaputrapradastatha || 93|| cakri
    pancajani caiva sarvanarakimocanah | yamarcitah paro devo namoccaravasho''cyutah || 94|| kubjavilasi
    subhago dinabandhuranupamah | akruragrihagopta ca pratijnapalakah shubhah || 95|| jarasandhajayi vidvan
    yavananto dvijashrayah | mucukundapriyakaro jarasandhapalayitah || 96|| dvarakajanako gudho brahmanyah
    satyasangarah | liladharah priyakaro vishvakarma yashahpradah || 97|| rukminipriyasandesho rukmashokavivarddhanah
    | caidyashokalayah shreshtho dushtarajanyanashanah || 98|| rukmivairupyakarano rukminivacane ratah
    | balabhadravacograhi muktarukmi janardanah || 99|| rukminiprananathashca satyabhamapatih svayam |
    bhaktapakshi bhaktivashyo hyakruramanidayakah || 100|| shatadhanvapranahari riksharajasutapriyah |
    satrajittanayakanto mitravindapaharakah || 101| satyapatirlakshmanajitpujyo bhadrapriyankarah | narakasuraghati
    ca lilakanyaharo jayi || 102|| murarirmadanesho''pi dharitriduhkhanashanah | vainateyi svargagami
    aditya kundalapradah || 103|| indrarcito ramakanto vajribharyaprapujitah | parijatapahari ca shakramanapaharakah
    || 104|| pradyumnajanakah sambatato bahusuto vidhuh | gargacaryah satyagatirdharmadharo dharadharah
    || 105|| dvarakamandanah shlokyah sushloko nigamalayah | paundrakapranahari ca kashirajashiroharah
    || 106|| avaishnavavipradahi sudakshinabhayavahah | jarasandhavidari ca dharmanandanayajnakrit ||
    107|| shishupalashirashchedi dantavaktravinashanah | vidurathantakah shrishah shrido dvividanashanah
    || 108|| rukminimanahari ca rukminimanavarddhanah | devarshishapaharta ca draupadivakyapalakah ||
    109|| durvasobhayahari ca pancalismaranagatah | parthadutah parthamantri parthaduhkhaughanashanah
    || 110|| parthamanapahari ca parthajivanadayakah | pancalivastradata ca vishvapalakapalakah || 111||
    shvetashvasarathih satyah satyasadhyo bhayapahah | satyasandhah satyaratih satyapriya udaradhih ||
    112|| mahasenajayi caiva shivasainyavinashanah | banasurabhujacchetta banabahuvarapradah || 113||
    tarkshyamanapahari ca tarkshyatejovivarddhanah | ramasvarupadhari ca satyabhamamudavahah || 114||
    ratnakarajalakrido vrajalilapradarshakah | svapratijnaparidhvamsi bhishmajnaparipalakah || 115|| virayudhaharah
    kalah kalikesho mahabalah | varvarishashirohari varvarishashirahpradah || 116|| dharmaputrajayi shuraduryodhanamadantakah
    | gopikapritinirbandhanityakrido vrajeshvarah || 117|| radhakundaratirdhanyah sadandolasamashritah
    | sadamadhuvananandi sadavrindavanapriyah || 118|| ashokavanasannaddhah sadatilakasangatah | sadagovarddhanaratih
    sada gokulavallabhah || 119|| bhandiravatasamvasi nityam vamshivatasthitah | nandagramakritavaso vrishabhanugrahapriyah
    || 120|| grihitakaminirupo nityam rasavilasakrit | vallavijanasangopta vallavijanavallabhah || 121||
    devasharmakripakarta kalpapadapasamsthitah | shilanugandhanilayah padacari ghanacchavih || 122|| atasikusumaprakhyah
    sada lakshmikripakarah | tripuraripriyakaro hyugradhanvaparajitah || 123|| shaddhuradhvamsakarta ca
    nikumbhapranaharakah | vajranabhapuradhvamsi paundrakapranaharakah || 124|| bahulashvapritikarta dvijavaryapriyankarah
    | shivasankatahari ca vrikasuravinashanah || 125|| bhrigusatkarakari ca shivasattvikatapradah | gokarnapujakah
    sambakushthavidhvamsakaranah || 126|| vedastuto vedavetta yaduvamshavivarddhanah | yaduvamshavinashi
    ca uddhavoddharakarakah || 127||'
  devanagari: । अक्रूरतापशमनो रजकायुःप्रणाशनः ॥ ८०॥ मथुरानन्ददायी च कंसवस्त्रविलुण्ठनः । कंसवस्त्रपरीधानो
    गोपवस्त्रप्रदायकः ॥ ८१॥ सुदामगृहगामी च सुदामपरिपूजितः । तन्तुवायकसम्प्रीतः कुब्जाचन्दनलेपनः ॥ ८२॥
    कुब्जारूपप्रदो विज्ञो मुकुन्दो विष्टरश्रवाः । सर्वज्ञो मथुरालोकी सर्वलोकाभिनन्दनः ॥ ८३॥ कृपाकटाक्षदर्शी
    च दैत्यारिर्देवपालकः । सर्वदुःखप्रशमनो धनुर्भङ्गी महोत्सवः ॥ ८४॥ कुवलयापीडहन्ता दन्तस्कन्धबलाग्रणीः
    । कल्परूपधरो धीरो दिव्यवस्त्रानुलेपनः ॥ ८५॥ मल्लरूपो महाकालः कामरूपी बलान्वितः । कंसत्रासकरो भीमो
    मुष्टिकान्तश्च कंसहा ॥ ८६॥ चाणूरघ्नो भयहरः शलारिस्तोशलान्तकः । वैकुण्ठवासी कंसारिः सर्वदुष्टनिषूदनः
    ॥ ८७॥ देवदुन्दुभिनिर्घोषी पितृशोकनिवारणः । यादवेन्द्रः सतांनाथो यादवारिप्रमर्द्दनः ॥ ८८॥ शौरिशोकविनाशी
    च देवकीतापनाशनः । उग्रसेनपरित्राता उग्रसेनाभिपूजितः ॥ ८९॥ उग्रसेनाभिषेकी च उग्रसेनदयापरः । सर्वसात्वतसाक्षी
    च यदूनामभिनन्दनः ॥ ९०॥ सर्वमाथुरसंसेव्यः करुणो भक्तबान्धवः । सर्वगोपालधनदो गोपीगोपाललालसः ॥ ९१॥ शौरिदत्तोपवीती
    च उग्रसेनदयाकरः । गुरुभक्तो ब्रह्मचारी निगमाध्ययने रतः ॥ ९२॥ सङ्कर्षणसहाध्यायी सुदामसुहृदेव च । विद्यानिधिः
    कलाकोशो मृतपुत्रप्रदस्तथा ॥ ९३॥ चक्री पाञ्चजनी चैव सर्वनारकिमोचनः । यमार्चितः परो देवो नामोच्चारवशोऽच्युतः
    ॥ ९४॥ कुब्जाविलासी सुभगो दीनबन्धुरनूपमः । अक्रूरगृहगोप्ता च प्रतिज्ञापालकः शुभः ॥ ९५॥ जरासन्धजयी विद्वान्
    यवनान्तो द्विजाश्रयः । मुचुकुन्दप्रियकरो जरासन्धपलायितः ॥ ९६॥ द्वारकाजनको गूढो ब्रह्मण्यः सत्यसङ्गरः
    । लीलाधरः प्रियकरो विश्वकर्मा यशःप्रदः ॥ ९७॥ रुक्मिणीप्रियसन्देशो रुक्मशोकविवर्द्धनः । चैद्यशोकालयः
    श्रेष्ठो दुष्टराजन्यनाशनः ॥ ९८॥ रुक्मिवैरूप्यकरणो रुक्मिणीवचने रतः । बलभद्रवचोग्राही मुक्तरुक्मी जनार्दनः
    ॥ ९९॥ रुक्मिणीप्राणनाथश्च सत्यभामापतिः स्वयम् । भक्तपक्षी भक्तिवश्यो ह्यक्रूरमणिदायकः ॥ १००॥ शतधन्वाप्राणहारी
    ऋक्षराजसुताप्रियः । सत्राजित्तनयाकान्तो मित्रविन्दापहारकः ॥ १०१। सत्यापतिर्लक्ष्मणाजित्पूज्यो भद्राप्रियङ्करः
    । नरकासुरघाती च लीलाकन्याहरो जयी ॥ १०२॥ मुरारिर्मदनेशोऽपि धरित्रीदुःखनाशनः । वैनतेयी स्वर्गगामी अदित्य
    कुण्डलप्रदः ॥ १०३॥ इन्द्रार्चितो रमाकान्तो वज्रिभार्याप्रपूजितः । पारिजातापहारी च शक्रमानापहारकः ॥
    १०४॥ प्रद्युम्नजनकः साम्बतातो बहुसुतो विधुः । गर्गाचार्यः सत्यगतिर्धर्माधारो धराधरः ॥ १०५॥ द्वारकामण्डनः
    श्लोक्यः सुश्लोको निगमालयः । पौण्ड्रकप्राणहारी च काशीराजशिरोहरः ॥ १०६॥ अवैष्णवविप्रदाही सुदक्षिणभयावहः
    । जरासन्धविदारी च धर्मनन्दनयज्ञकृत् ॥ १०७॥ शिशुपालशिरश्छेदी दन्तवक्त्रविनाशनः । विदूरथान्तकः श्रीशः
    श्रीदो द्विविदनाशनः ॥ १०८॥ रुक्मिणीमानहारी च रुक्मिणीमानवर्द्धनः । देवर्षिशापहर्ता च द्रौपदीवाक्यपालकः
    ॥ १०९॥ दुर्वासोभयहारी च पाञ्चालीस्मरणागतः । पार्थदूतः पार्थमन्त्री पार्थदुःखौघनाशनः ॥ ११०॥ पार्थमानापहारी
    च पार्थजीवनदायकः । पाञ्चालीवस्त्रदाता च विश्वपालकपालकः ॥ १११॥ श्वेताश्वसारथिः सत्यः सत्यसाध्यो भयापहः
    । सत्यसन्धः सत्यरतिः सत्यप्रिय उदारधीः ॥ ११२॥ महासेनजयी चैव शिवसैन्यविनाशनः । बाणासुरभुजच्छेत्ता बाणबाहुवरप्रदः
    ॥ ११३॥ तार्क्ष्यमानापहारी च तार्क्ष्यतेजोविवर्द्धनः । रामस्वरूपधारी च सत्यभामामुदावहः ॥ ११४॥ रत्नाकरजलक्रीडो
    व्रजलीलाप्रदर्शकः । स्वप्रतिज्ञापरिध्वंसी भीष्माज्ञापरिपालकः ॥ ११५॥ वीरायुधहरः कालः कालिकेशो महाबलः
    । वर्वरीषशिरोहारी वर्वरीषशिरःप्रदः ॥ ११६॥ धर्मपुत्रजयी शूरदुर्योधनमदान्तकः । गोपिकाप्रीतिनिर्बन्धनित्यक्रीडो
    व्रजेश्वरः ॥ ११७॥ राधाकुण्डरतिर्धन्यः सदान्दोलसमाश्रितः । सदामधुवनानन्दी सदावृन्दावनप्रियः ॥ ११८॥
    अशोकवनसन्नद्धः सदातिलकसङ्गतः । सदागोवर्द्धनरतिः सदा गोकुलवल्लभः ॥ ११९॥ भाण्डीरवटसंवासी नित्यं वंशीवटस्थितः
    । नन्दग्रामकृतावासो वृषभानुग्रहप्रियः ॥ १२०॥ गृहीतकामिनीरूपो नित्यं रासविलासकृत् । वल्लवीजनसङ्गोप्ता
    वल्लवीजनवल्लभः ॥ १२१॥ देवशर्मकृपाकर्ता कल्पपादपसंस्थितः । शिलानुगन्धनिलयः पादचारी घनच्छविः ॥ १२२॥
    अतसीकुसुमप्रख्यः सदा लक्ष्मीकृपाकरः । त्रिपुरारिप्रियकरो ह्युग्रधन्वापराजितः ॥ १२३॥ षड्धुरध्वंसकर्ता
    च निकुम्भप्राणहारकः । वज्रनाभपुरध्वंसी पौण्ड्रकप्राणहारकः ॥ १२४॥ बहुलाश्वप्रीतिकर्ता द्विजवर्यप्रियङ्करः
    । शिवसङ्कटहारी च वृकासुरविनाशनः ॥ १२५॥ भृगुसत्कारकारी च शिवसात्त्विकताप्रदः । गोकर्णपूजकः साम्बकुष्ठविध्वंसकारणः
    ॥ १२६॥ वेदस्तुतो वेदवेत्ता यदुवंशविवर्द्धनः । यदुवंशविनाशी च उद्धवोद्धारकारकः ॥ १२७॥
