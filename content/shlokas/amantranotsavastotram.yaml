id: amantranotsavastotram
category: mantra
name:
  english: amantranotsavastotram
  devanagari: आमन्त्रणोत्सवस्तोत्रम्
content:
  english: amantranotsavastotram amantranam te nigamoktamantraistantrapraveshaya manoharaya | shriramacandraya
    sukhapradaya karomyaham tvam kripaya grihana || 1|| satyadhirajarcitapadapadma shrimadhvasampujita
    sundaranga | shribhargavisannutamandahasa shrivyasadevaya namo namaste || 2|| anantarupairajitadibhishca
    paradibhishshribrihatisahasrah | vishvadibhishcaiva sahasrarupairnarayanadyashtashatairajadyaih ||
    3|| ekadhipancashaditaishca rupaishshrikeshavadyaishca caturssuvimshaih | matsyadibhissvacchadashasvarupairvishvadibhishcashtabhiragrarupaih
    || 4|| tatha'niruddhadicatussvarupairgobrahmanashritulasinivasaih | mantresharupaih paramanupurvasamvatsarantamalakalarupaih
    || 5|| jnanadindaissthavarajangamasthairavyakritakashavihararupaih | narayanakhyena tatha'niruddharupena
    sakshmodagatena tushtaih || 6|| pradyumnasankarshananamakabhyam bhoktristhitabhyam bhujishaktidabhyam
    | shrivasudevena nabhahsthitena hyabhishtadenakhilasadgunena || 7|| ashvadisadyanagatena nityamarudharupena
    susaukhyadena | vishvadijagradviniyamakena svapnasthapalena ca tejasena || 8|| prajnaina saushuptikapalakena
    turyena murdhni sthitiyukparena | atmantaratmetyabhidhena hritstharupadvayenakhilasarabhoktra | hritpadmamulagragasarvagaishca
    rupatrayenakhilashaktibhaja | kriddholkarupairhridayadisamsthaih pranadigairannamayadigaishca || 10||
    ilavritadyamalakhandasamsthaih plakshadisaddvipasamudradhishnyaih | merusthakimstughnagakalacakragrahagrahanugrahibhishca
    lokaih || 11|| narayanipurvavadhururupaistridhamabhirbharasuradhamabhishca | shrimularamapratimadisamsthashriramacandrakhilasadgunabdhe
    || 12|| sitapate shriparamavatara mabadibhiṟbrahmamukhaishca devaih | dikpalakaissakamanantasaukhyasampurnasadbhaktadayamburashe
    || 13|| satyadhirajaryahridabjavasa shrimadhvahritpankajakoshavasa | madvimbarupena bhavaikyashali
    camantritastvadya namo namaste || varakshatan kancanamudrikashca mantrena hemnashcashake nidhaya |
    sitapate te puratashshrutestu pradadhyurevam bhagavatsvarupam || 15|| hiranyarupassahiranyasamvridagapannapasteduhiranyavarnah
    | hiranyayatpariyone nishadhya hiranyadadadatyannamasme || 16|| vasishyottamavastrani bhushanairapyalankuru
    | kurvannutsavamatyantamasmadiyam makham yaja || 17|| vasishyami yedhravastranyurjapate somano adhvaram
    yaja | mantrito'si devesha puranapurushottama | mantreshairlokapalaishca sardham devaganaih shriya
    || 18|| trikalapujasu dayardradrishtya mayarpitam carhanamashu sattvam | grihana lokadhipate ramesha
    mamaparadhan sakalan kshamasva || 19|| shrimatsatyapramodaryahrinnivasyanileshita | satyajnananantagunah
    priyatam badarayanah || 20|| iti amantranotsavastotram sampurnam |
  devanagari: आमन्त्रणोत्सवस्तोत्रम् आमन्त्रणं ते निगमोक्तमन्त्रैस्तन्त्रप्रवेशाय मनोहराय । श्रीरामचन्द्राय
    सुखप्रदाय करोम्यहं त्वं कृपया गृहाण ॥ १॥ सत्याधिराजार्चितपादपद्म श्रीमध्वसम्पूजित सुन्दराङ्ग । श्रीभार्गवीसन्नुतमन्दहास
    श्रीव्यासदेवाय नमो नमस्ते ॥ २॥ अनन्तरूपैरजितादिभिश्च परादिभिश्श्रीबृहतीसहस्रः । विश्वादिभिश्चैव सहस्ररूपैर्नारायणाद्यष्टशतैरजाद्यैः
    ॥ ३॥ एकाधिपञ्चाशदितैश्च रूपैश्श्रीकेशवाद्यैश्च चतुर्स्सुविंशैः । मत्स्यादिभिस्स्वच्छदशस्वरूपैर्विश्वादिभिश्चाष्टभिरग्ररूपैः
    ॥ ४॥ तथाऽनिरुद्धादिचतुस्स्वरूपैर्गोब्राह्मणश्रीतुलसीनिवासैः । मन्त्रेशरूपैः परमाणुपूर्वसंवत्सरान्तामलकालरूपैः
    ॥ ५॥ ज्ञानादिन्दैस्स्थावरजङ्गमस्थैरव्याकृताकाशविहाररूपैः । नारायणाख्येन तथाऽनिरुद्धरूपेण सक्ष्मोदगतेन
    तुष्टैः ॥ ६॥ प्रद्युम्नसङ्कर्षणनामकाभ्यां भोक्तृस्थिताभ्यां भुजिशक्तिदाभ्याम् । श्रीवासुदेवेन नभःस्थितेन
    ह्यभीष्टदेनाखिलसद्गुणेन ॥ ७॥ अश्वादिसद्यानगतेन नित्यमारूढरूपेण सुसौख्यदेन । विश्वादिजाग्रद्विनियामकेन
    स्वप्नस्थपालेन च तेजसेन ॥ ८॥ प्राज्ञैन सौषुप्तिकपालकेन तुर्येण मूर्ध्नि स्थितियुक्परेण । आत्मान्तरात्मेत्यभिधेन
    हृत्स्थरूपद्वयेनाखिलसारभोक्त्रा । हृत्पद्ममूलाग्रगसर्वगैश्च रूपत्रयेणाखिलशक्तिभाजा । कृद्धोल्करूपैर्हृदयादिसंस्थैः
    प्राणादिगैरन्नमयादिगैश्च ॥ १०॥ इलावृताद्यामलखण्डसंस्थैः प्लक्षादिसद्द्वीपसमुद्रधिष्ण्यैः । मेरुस्थकिंस्तुघ्नगकालचक्रग्रहग्रहानुग्रहिभिश्च
    लोकैः ॥ ११॥ नारायणीपूर्ववधूरुरूपैस्त्रिधामभिर्भारसुरधामभिश्च । श्रीमूलरामप्रतिमादिसंस्थश्रीरामचन्द्रखिलसद्गुणाब्धे
    ॥ १२॥ सीतापते श्रीपरमावतार माबादिभिऱ्ब्राह्ममुखैश्च देवैः । दिक्पालकैस्साकमनन्तसौख्यसम्पूर्णसद्भक्तदयाम्बुराशे
    ॥ १३॥ सत्याधिराजार्यहृदब्जवास श्रीमध्वहृत्पङ्कजकोशवास । मद्विम्बरूपेण भवैक्यशाली चामन्त्रितस्त्वद्य
    नमो नमस्ते ॥ वराक्षतान् काञ्चनमुद्रिकाश्च मन्त्रेण हेम्नश्चषके निधाय । सीतापते ते पुरतश्श्रुतेस्तु
    प्रदध्युरेवं भगवत्स्वरूपम् ॥ १५॥ हिरण्यरूपस्सहिरण्यसंवृदगपान्नपास्तेदुहिरण्यवर्णः । हिरण्ययात्परियोने
    निषध्या हिरण्यदाददत्यन्नमस्मे ॥ १६॥ वसिष्योत्तमवस्त्राणि भूषणैरप्यलङ्कुरु । कुर्वन्नुत्सवमत्यन्तमस्मदीयं
    मखं यज ॥ १७॥ वसिष्यामि येध्रवस्त्राण्यूर्जापते सोमनो अध्वरं यज । मन्त्रितोऽसि देवेश पुराणपुरुषोत्तम
    । मन्त्रेशैर्लोकपालैश्च सार्धं देवगणैः श्रिया ॥ १८॥ त्रिकालपूजासु दयार्द्रदृष्ट्या मयार्पितं चार्हणमाशु
    सत्त्वम् । गृहाण लोकाधिपते रमेश ममापराधान् सकलान् क्षमस्व ॥ १९॥ श्रीमत्सत्यप्रमोदार्यहृन्निवास्यनिलेशिता
    । सत्यज्ञानानन्तगुणः प्रीयतां बादरायणः ॥ २०॥ इति आमन्त्रणोत्सवस्तोत्रं सम्पूर्णम् ।
