id: kyts-7-2-saadhyaa-vai-devaah-suvargakaamaah-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 7.2 Saadhyaa Vai Devaah Suvargakaamaah - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitayam saptamakande dvitiyah prashnah shri gurubhyo namah
    | harih om || saddhya vai deva ssuvargakama etagm shad ntenayajanta tato vai te suvargam ratramasate
    suvargameva lokam ratrah pratyakshagg hyetani prishthani ya evam ratramasate sakshadeva devata abhyarohanti
    shad nvarohantyritubhih sam va~thsara eva prati tishthanti briha va~va rathantaramasau brihadabhyameva
    yantyatho anayoreva prati tishthantyete vai yajnasya njasayani sruti tabhyameva suvargam ya~nti trivridagnishtomo
    bhavati teja evava rundhate pancadasho bhavatindriyamevava rundhate saptadasho bhavatyannadyasya 'varuddhya
    atho praiva tena jayanta ekavigmsho bhavati pratishthitya atho rucameva ndadhate trinavo bhavati vijityai
    trayastrigmsho bhavati pratishthityai sadohavirdhanina etena shad ratrena yajerannashvatthi havirdhana
    nca bhavatastaddhi suvargya ssuvargasya lokasya samashtya ulukhalabuddhno yupo bhavati pratishthityai
    pranco yanti praniva hi suvargo ssarasvatya yantyesha vai devayanah panthasta nvarohantyakroshanto
    yantyavarti npratishajya pratishtha ngacchanti yada dasha shata mutthanagm shatayuh purusha shshatendriya
    ayushyevendriye prati tishthanti yada shatagm sahasra mutthanagm sahasrasammito va asau loko 'mumeva
    lokamabhi jayanti yadai mpramiyeta yada va jiyerannathaika kusurubinda auddalaki thsyamiti sa etagm
    saptaratra ttenayajata tena vai sa yavanto gramyah pashavastanava thsaptaratrena yajate yavanta eva
    gramyah pashavasta nevava rundhe saptaratro bhavati sapta gramyah pashavah sapta dagnishtomo bhavati
    teja 'va rundhe pancadasho bhavatindriyamevava rundhe saptadasho bhavatyannadyasya varuddhya atho
    praiva tena jayata ekavigmsho bhavati pratishthitya atho rucameva ndhatte trinavo bhavati vijityai
    pancavigmsho 'gnishtomo bhavati prajapate raptyai mahavratava nannadyasya varuddhyai vishvaji thsarvaprishtho
    'tiratro bhavati sarvasyabhijityai ya mpurveshvahassu prishthanyupeyuh pratyaksham ~vishvajiti yatha
    dugdha mupasidatyevamuttama mahah syannaikaratrashcana sya drathantare purveshvahassupa yantiyam va~va
    rathantaramasau brihadabhyameva na yantyatho anayoreva prati tishthanti ya vi~shvajiti prishthanyupayanti
    yatha pratta nduhe tadrigeva tat || upeyuh pratyaksham rakamayata brahmavarcasi syamiti sa eta ttenayajata
    tato vai sa brahmavarcasyabhavadya evam nashtaratrena yajate brahmavarcasyeva bhavatyashtaratro bhavatyashtakshara
    gayatri gayatri brahmavarcasa ngayatriyaiva brahmavarcasamava rundhe 'shtaratro bhavati catasro vai
    dishashcatasro 'vantaradisha digbhya eva brahmavarcasamava rundhe dagnishtomo bhavati teja evava rundhe
    pancadasho bhavatindriyamevava rundhe saptadasho bhavatyannadyasya varuddhya atho praiva tena jayata
    ekavigmsho bhavati pratishthitya atho rucameva ndhatte trinavo bhavati vijityai trayastrigmsho bhavati
    pratishthityai pancavigmsho 'gnishtomo bhavati prajapateraptyai mahavratava nannadyasya varuddhyai
    vishvaji 'tiratro bhavati sarvasyabhijityai || digbhya eva brahmavarcasamava rundhe prajapatih praja
    asrijata ta ttenayajata tato vai prajabhyo hi navaratrena yajeteme hi va etasam lo~ka aklipta athaitah
    ''bhyo lokan kalpayati tan kalpamana 'nu kalpate kalpante 'sma ime loka urja mprajasu dadhati triratrenaivemam
    nkalpayati triratrenantariksha manvasyatyevameva talloke lokamanvasyati dhritya ashithilambhavaya
    jyotirgaurayuriti jnata va~va jyotirantariksha vayureshveva lokeshu prati tishthanti jnatra gacchati
    navaratro ngacchati navaratro bhavatyabhipu ntejo dadhati yo jyogamayavi sya thsa navaratrena yajeta
    prana hi va etasya dhrita athaitasya jyogamayati prananevasmi ndadharota yaditasurbhavati jivatyeva
    || rakamayata pra jayeyeti sa eta ttena dasharatramasrijata tena dasharatrena pra jayata dasharatraya
    dikshishyamano dashahotara ddashahotraiva dasharatragm srijate tena dasharatrena pra jayate vairajo
    va esha yajno yaddasharatro ya evam dasharatrena yajate virajameva gacchati prajapatyo va esha yajno
    ya dasharatrena yajate praiva jayata indro vai sadri thsa na vyavritamagaccha ttenayajata tato vai
    so rvyavritamagacchadya evam ndasharatrena yajate vyavritameva papmana bhratrivyena gacchati trikakudva
    tpancadashah kakudekavigmshah kaku ttrayastrigmsho ya evam ndasharatrena yajate trikakudeva samanana
    mbhavati yajamanah pancadasho yajamana ekavigmsho yajamana strayastrigmshah pura itara abhicaryamano
    dasharatrena yajeta devapura eva paryuhate tasya na kutashcanopa vyadho bhavati nainamabhicaran thstrinute
    devasura devapura apashyan devapura apashyan ya ddasharatrastah paryauhanta tesha 'sura yo bhratrivyavan
    thsa dasharatrena yajeta devapura eva paryuhate tasya na kutashcanopa vyadho bhavati bhavatyatmana
    para 'sya bhratrivyo bhavati stoma sstomasyopastirbhavati bhratrivyamevopasti tkurvanti yajjyayagmsagg
    stomamupetya kaniyagmsamupayanti yadagnishto cca bhavantyajamitvaya trivridagnishtomo gneyishu bhavati
    teja evava rundhe pancadasha ukthya aindrishvindriyamevava rundhe trivridagnishtomo vai shvadevishu
    pushtimevava rundhe saptadasho 'gnishtomah prajapatyasu tivrasomo varuddhya atho praiva tena jayata
    ekavigmsha ukthyah saurishu ekavigmsha ukthyah saurishu pratishthitya atho rucameva 'gnishtomah prajapatyasupahavya
    upahavameva gacchati trinavavagnishtomavabhita aindrishu vijityai trayastrigmsha ukthyo vaishvadevishu
    pratishthityai vishvaji 'tiratro bhavati sarvasyabhijityai || prajapatyo va esha yajno ya ritavo vai
    prajakamah praja 'kamayanta prajagm srijemahi prajamava rundhimahi prajam vi~ndemahi prajavanta ssyameti
    ta etamekadasharatramapashya ntenayajanta tato vai te prajamasrijanta prajamavarundhata prajamavindanta
    prajavanto dartava ucyante ya evam vi~dvagmsa ekadasharatramasate prajameva srijante prajamava rundhate
    prajam vi~ndante prajavanto bhavanti jyotiratiratro bhavati jyotireva purasta ddadhate suvargasya
    lokasya nukhyatyai prishthyah shadaho bhavati sha shshat prishthani prishthairevartuna nvarohantyritubhih
    sam va~thsara eva prati tishthanti caturvigmsho bhavati caturvigmshatyakshara gayatri ngayatriyameva
    brahmavarcase prati tishthanti catushcatvarigmsho bhavati catushcatvarigmshadakshara trishtugindriya
    ptrishtubhyevendriye prati tishthantyashtacatvarigmsho bhavatyashtacatvarigmshadakshara jagati jagatah
    pashavo jagatyameva pashushu prati tishthantye kadasharatro bhavati panca va ritava artavah pancartushveva
    va~thsare pratishthaya prajamava rundhate 'tiratravabhito bhavatah prajayai parigrihityai || ngrihniyadyah
    kamayeta yatha purva mprajah kalperanniti yajnasya vai kliptimanu prajah kalpante yajnasya 'kliptimanu
    na kalpante yatha purvameva prajah kalpayati na jyayagmsa nkaniyanati kramatyaindravayavagra ngrihniyadamayavinah
    pranena va esha vyriddhyate yasya ndravayavah pranenaivainagm samardhayati maitravarunagra va~ ete
    vyriddhyante yesha mpramiyate pranapanau mitravarunau pranapanaveva mukhatah pari haranta ashvinagra
    ngrihnita ''nujavaro 'shvinau vai devanamanujavarau pashcevagra mashvinavetasya devata ya anujavara
    shshriyai gatva ni vartate 'ntadeva 'ntama rabhate na tatah papiya ngrahayati tajagartimarcchatya
    ngrihnita yasya pita pitamahah punya dvaca va esha indriyena vyriddhyate yasya pita pitamahah punyo
    bhavatyatha tanna prapnotyura ivaita dyajnasya vagiva yada grayano vacaivainamindriyena samardhayati
    na tatah papiya ngrihnitabhicaryamana tpatranamindriyam ya~dukthyapatragm sarvenaivainamindriyenati
    prayunkte sarasvatyabhi no neshi vasya iti puroruca sarasvati vacaivainamati prayunkte ma tva tkshetranyaranani
    ganmetyaha mrityorvai kshetranyaranani tenaiva mrityoh kshetrani na gacchati purna ngrihniyadamayavinah
    pranan va etasya shugricchati yasya ''mayati prana grahah prananevasya shuco muncatyuta yaditasurbhavati
    jivatyeva purna hi parjanyo na var tpranan va etar hi prajanagm shugricchati yar hi parjanyo na var
    prananeva prajanagm shuco muncati taja riddhyate yasya pita pitamahah punyo ndravayavo gayatra 'hannaindravayavo
    grihyate sva evainamayatane grihnati traishtubho vai shukrastraishtubha 'hanchukro grihyate sva evainamayatane
    grihnati jagato va a 'hannagrayano grihyate sva evainamayatane grihnatyetadvai dyacchandagsyapnoti
    yada shshvo grihyate yatraiva yajnamadrisha mpunah prayunkte jaganmukho vai dvitiyastriratro jagata
    agrayano yaccaturthe 'hannagrayano grihyate sva evaina mayatane grihnatyatho svameva chando 'nu paryavartante
    rathantaro va ai ndravayavo rathantara aindravayavo grihyate nnaindravayavo grihyate sva evaina mayatane
    grihnati bar hato vai shukro bar 'hanchukro grihyate sva evaina mayatane grihnatyetadvai dvitiyam
    dyacchandagsyapnoti yacchukra shshvo grihyate yatraiva yajna mpunah prayunkte trishtunmukho vai tritiya
    'hanchukro grihyate sva evainamayatane grihnatyatho svameva chando 'nu paryavartante vagva a grayano
    vagashtamamaha 'hannagrayano grihyate sva evainamayatane grihnati prano va ai ndravayavah prano navama
    nnavame 'hannaindravayavo grihyate sva evainamayatane grihnatyeta dyacchandagsyapnoti yadai shshvo
    grihyate yatraiva yajnamadrisha mpunah prayunkte 'tho svameva chando 'nu paryavartante patho va ete
    'ddhyapathena yanti ye 'ntah khalu va esha yajnasya ya mahardashame 'hannaindravayavo grihyate yajnasyai
    tpanthamapi yantyatho yatha vahiyasa pratisaram va~hanti tadrigeva tacchandagsyanyo 'nyasya lokamabhyaddhyaya
    ntanyetenaiva deva vyavahayannaindravayavasya va etadayatanam nnagrayano grihyate tasma dagrayanasya
    ''yatane navame 'hannaindravayavo grihyate shukrasya va etadayatanam nnaindravayavo grihyate tasma
    'hanchukro grihyata agrayanasya va etadayatanam stasminchukro grihyate tasma cchukrasya ''yatane 'hannagrayano
    grihyate chandagsyeva tadvi vahayati pra vasyaso vivahama prajapatirakamayata pra jayeyeti sa eta
    ttenayajata tato vai sa prajayata yah kamayeta pra jayeyeti sa dvadasharatrena yajeta praiva jayate
    brahmavadino vadantyagnishtomaprayana yajna atha kasmadatiratrah purvah pra yujyata iti cakshushi
    va ete yajnasya yadatiratrau kaninike agnishtomau ya nbahirdha kaninike daddhyustasma datiratrah purvah
    pra yujyate cakshushi eva yajne dhitva maddhyatah kaninike prati dadhati yo vai gayatri ve~da jyotisha
    bhasa suvargam lo~kameti yavagnishtomau tau pakshau ye ssa atmaisha vai gayatri jyotihpaksha ya evam
    ve~da jyotisha bhasa suvargam eti prajapatirva meti prajapatirva esha dvadashadha vihito ya ddvadasharatro
    yavatiratro tau pakshau ye ssa atma prajapatirvavaisha san thsaddha vai satrena sprinoti prana vai
    sa tprananeva sprinoti sarvasam mpranairasate ye satramasate tasma tpricchanti kimete satrina iti
    priyah prajana mutthito bhavati ya evam ~veda || ssuvargaya lokaya prabhavadurdhvo ha va esha atata
    asi thsuvargasya lokasya prabhu tya ritavo va etena prajapatimayajaya rdhnodadhi tadriddhnoti ha va
    ritvikshu ya evam ndvadashahena yajate te 'sminnaicchanta sa rasamaha vasantaya prayaccha vrihincharade
    mashatilau hemantashishirabhya ttato va indra indro ranujavarasya yajna iti sa hyetena 'yajataisha
    ha vai kunapamatti ya ssatre pratigrihnati purushakunapa ttanna nirnenijati tato njayata eka eva yajetaiko
    hi prajapati va~thsarah prajapatih prajapatirvavaisha esha ha tvai jayate yastapaso 'dhi jayate caturdha
    va etastisrastisro ratrayo ya ddvadashopasado yah prathama yajna mbharati ya dvitiya yajna yastritiyah
    patrani tabhirnirnenikte yashcaturthirapi tabhiratmana shshundhate yo va asya pashumatti magmsagm
    so 'tti yah purodasha mmastishkagm sa yah parivapa mpurishagm sa ya ajya ssomagg svedagm so 'pi ha
    va asya shir shanya nishpadah prati grihnati yo dvadashahe pratigrihnati tasma ddvadashahena na yajya
    mpapmano vyavrittyai || ekasmai svaha dvabhyag svaha ssvaha caturbhya ssvaha caturdashabhya ssvaha
    pancadashabhya ssvaha saptadashabhya kanna vigmshatyai svaha navavigmshatyai svahai kanna catvarigmshate
    svaha navacatvarigmshate svahai kanna shashtyai svaha navashashtyai svahai kannashityai svaha navashityai
    svahaikanna shataya svaha shataya svaha dvabhyagm shatabhyag svaha sarvasmai svaha navacatvarigmshate
    svahai kannaikavigmshatishca ssvaha pancadashabhya ssvaha saptadashabhya ssvahaikanna vigmshatyai
    svaha navavigmshatyai svahaikanna catvarigmshate svaha navacatvarigmshate svahaikanna shashtyai svaha
    navashashtyai svahaikanna shityai svaha navashityai svahaikanna shataya svaha shataya svaha sarvasmai
    svaha dvabhyag svaha caturbhya ssvaha caturdashabhya ssvaha vigmshatyai svaha 'shtanavatyai svaha
    shataya svaha sarvasmai svaha dvabhyamashtanavatyai ssvaha pancadashabhya ssvaha saptadashabhya ssvahaikanna
    vigmshatyai svaha navavigmshatyai svahaikanna catvarigmshate svaha navacatvarigmshate svahaikanna
    shashtyai svaha navashashtyai svahaikanna 'shityai svaha navashityai svahaikanna shataya svaha shataya
    svaha sarvasmai svaha 'shtacatvarigmshat ssvaha vigmshatyai svaha shannavatyai svaha shataya svaha
    sarvasmai svaha ssvaha pancadashabhya ssvaha vigmshatyai svaha pancanavatyai svaha shataya svaha sarvasmai
    svaha pancabhyah pancanavatyai ssvaha vigmshatyai svaha trigmshate svaha catvarigmshate svaha pancashate
    svaha shashtyai svaha saptatyai svaha 'shityai svaha navatyai svaha shataya svaha sarvasmai svaha
    vigmshatyai svaha catvarigmshate svaha shashtyai svaha 'shityai svaha shataya svaha sarvasmai svaha
    pancashate svaha shataya svaha dvabhyagm shatabhyag svaha ssvaha caturbhyah shatebhya ssvaha pancabhyah
    shatebhya ssvaha saptabhyah shatebhya ssvaha navabhyah shatebhya ssvaha sahasraya svaha sarvasmai
    svaha shataya svaha sahasraya svaha 'yutaya svaha niyutaya svaha prayutaya svaha 'rbudaya svaha nyarbudaya
    svaha samudraya svaha maddhyaya svaha 'ntaya svaha parardhaya svahoshase svaha vyushtyai svahodeshyate
    svaho dyate svahoditaya svaha suvargaya svaha lokaya svaha sarvasmai svaha kusurubindah saptaratram
    brihaspatirashtaratram prajapatirakamayata dashahotaratra || harih om || || krishna yajurvediya taittiriya
    samhitayam saptamakande dvitiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां सप्तमकाण्डे द्वितीयः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ सा॒द्ध्या वै दे॒वा स्सु॑व॒र्गका॑मा ए॒तग्ं ष॑ड् न्तेना॑यजन्त॒ ततो॒ वै ते सु॑व॒र्गं रा॒त्रमास॑ते
    सुव॒र्गमे॒व लो॒कं रा॒त्रः प्र॒त्यक्ष॒ग्ग्॒ ह्ये॑तानि॑ पृ॒ष्ठानि॒ य ए॒वं रा॒त्रमास॑ते सा॒क्षादे॒व दे॒वता॑
    अ॒भ्यारो॑हन्ति॒ षड् न्वारो॑हन्त्यृ॒तुभिः॑ सं वँथ्स॒र ए॒व प्रति॑ तिष्ठन्ति बृह वाँव र॑थन्त॒रम॒सौ बृ॒हदा॒भ्यामे॒व
    य॒न्त्यथो॑ अ॒नयो॑रे॒व प्रति॑ तिष्ठन्त्ये॒ते वै य॒ज्ञस्या ञ्ज॒साय॑नी स्रु॒ती ताभ्या॑मे॒व सु॑व॒र्गं
    यँ॑न्ति त्रि॒वृद॑ग्निष्टो॒मो भ॑वति॒ तेज॑ ए॒वाव॑ रुन्धते पञ्चद॒शो भ॑वतीन्द्रि॒यमे॒वाव॑ रुन्धते सप्तद॒शो
    भ॒व॒त्य॒न्नाद्य॒स्या ऽव॑रुद्ध्या॒ अथो॒ प्रैव तेन॑ जायन्त एकवि॒ग्ं॒शो भ॑वति॒ प्रति॑ष्ठित्या॒ अथो॒ रुच॑मे॒वा
    न्द॑धते त्रिण॒वो भ॑वति॒ विजि॑त्यै त्रयस्त्रि॒ग्ं॒शो भ॑वति॒ प्रति॑ष्ठित्यै सदोहविर्धा॒निन॑ ए॒तेन॑ षड्
    रा॒त्रेण॑ यजेर॒न्नाश्व॑त्थी हवि॒र्धान॒ ञ्च भवत॒स्तद्धि सु॑व॒र्ग्य॑ स्सुव॒र्गस्य॑ लो॒कस्य॒ सम॑ष्ट्या
    उ॒लूख॑लबुद्ध्नो॒ यूपो॑ भवति॒ प्रति॑ष्ठित्यै॒ प्राञ्चो॑ यान्ति॒ प्राङि॑व॒ हि सु॑व॒र्गो स्सर॑स्वत्या
    यान्त्ये॒ष वै दे॑व॒यानः॒ पन्था॒स्त न्वारो॑हन्त्या॒क्रोश॑न्तो या॒न्त्यव॑र्ति न्प्रति॒षज्य॑ प्रति॒ष्ठा
    ङ्ग॑च्छन्ति य॒दा दश॑ श॒त मु॒त्थानग्ं॑ श॒तायुः॒ पुरु॑ष श्श॒तेन्द्रि॑य॒ आयु॑ष्ये॒वेन्द्रि॒ये प्रति॑
    तिष्ठन्ति य॒दा श॒तग्ं स॒हस्र॑ मु॒त्थानग्ं॑ स॒हस्र॑सम्मितो॒ वा अ॒सौ लो॒को॑ ऽमुमे॒व लो॒कम॒भि ज॑यन्ति
    य॒दै म्प्र॒मीये॑त य॒दा वा॒ जीये॑र॒न्नथैक॑ कु॒सु॒रु॒बिन्द॒ औद्दा॑लकि थ्स्या॒मिति॒ स ए॒तग्ं स॑प्तरा॒त्र
    त्तेना॑यजत॒ तेन॒ वै स याव॑न्तो ग्रा॒म्याः प॒शव॒स्तानवा॑ थ्स॑प्तरा॒त्रेण॒ यज॑ते॒ याव॑न्त ए॒व ग्रा॒म्याः
    प॒शव॒स्ता ने॒वाव॑ रुन्धे सप्तरा॒त्रो भ॑वति स॒प्त ग्रा॒म्याः प॒शवः॑ स॒प्ता द॑ग्निष्टो॒मो भ॑वति॒ तेज॑
    ऽव॑ रुन्धे पञ्चद॒शो भ॑वतीन्द्रि॒यमे॒वाव॑ रुन्धे सप्तद॒शो भ॑वत्य॒न्नाद्य॒स्या व॑रुद्ध्या॒ अथो॒ प्रैव
    तेन॑ जायत एकवि॒ग्ं॒शो भ॑वति॒ प्रति॑ष्ठित्या॒ अथो॒ रुच॑मे॒वा न्ध॑त्ते त्रिण॒वो भ॑वति॒ विजि॑त्यै पञ्चवि॒ग्ं॒शो
