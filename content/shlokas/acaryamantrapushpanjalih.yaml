id: acaryamantrapushpanjalih
category: mantra
name:
  english: acaryamantrapushpanjalih
  devanagari: आचार्यमन्त्रपुष्पाञ्जलिः
content:
  english: acaryamantrapushpanjalih harih om | namo'stvanantaya sahasramurtaye sahasrapadakshishirorubahave
    sahasranamne purushaya shashvate sahasrakotiyugadharine namah || 1|| vishnubrahmendradevaih rajatagiritatatprarthito
    yo'vatirya shakyadyuddamakanthiravanakharakaraghatasanjatamurcham | chandodhenum yatindrah prakritimagamayatsuktipiyushavarshaih
    so'yam shrishankararyo bhavadavadahanatpatu lokanajasram || 2|| purnah piyushabhanurbhavamarutapanoddamatapakulanam
    praudhajnanandhakaravritavishamapathabhramyatamamshumali | kalpah shakhi yatinam vigatadhanasutadishananam
    sada nah payacchripadmapadadimamunisahitah shrimadacaryavaryah || 3|| brahmanandam paramasukhadam
    kevalam jnanamurtim dvandvatitam gaganasadrisham tattvamasyadilakshyam | ekam nityam vimalamacalam
    sarvadhisakshibhutam bhavatitam trigunarahitam sadgurum tam namami || 4|| narayanam padmabhavam vasishtham
    shaktim ca tatputraparasharam ca vyasam shukam gaudapadam mahantam govindayogindramathasyashishyam
    | shrishankaracaryamathasyapadmapadam ca hastamalakam ca shishyam tam totakam vartikakaramanyanasmadgurunsantatamanato'smi
    || 5|| vishvam darpanadrishyamananagaritulyam nijantargatam pashyannatmani mayaya bahirivodbhutam
    yatha nidraya | yah sakshatkurute prabodhasamaye svatmanamevadvayam tasmai shrigurumurtaye nama idam
    shridakshinamurtaye || 6|| akhandamandalakaram vyaptam yena caracaram | tatpadam darshitam yena tasmai
    shrigurave namah || 7|| gururbrahma gururvishnurgururdevo maheshvarah | guruh sakshatparam brahma
    tasmai shrigurave namah || 8|| shrutismritipurananamalayam karunalayam | namami bhagavatpadam shankaram
    lokashankaram || 9|| shankaram shankaracarya keshavam badarayanam | sutrabhashyakritau vande bhagavantau
    punah punah || 10|| ishvaro gururatmeti murtibhedavibhagine | vyomavadvyaptadehaya dakshinamurtaye
    namah || 11||
  devanagari: आचार्यमन्त्रपुष्पाञ्जलिः हरिः ॐ । नमोऽस्त्वनन्ताय सहस्रमूर्तये सहस्रपादाक्षिशिरोरुबाहवे
    सहस्रनाम्ने पुरुषाय शाश्वते सहस्रकोटीयुगधारिणे नमः ॥ १॥ विष्णुब्रह्मेन्द्रदेवैः रजतगिरितटात्प्रार्थितो
    योऽवतीर्य शाक्याद्युद्दामकण्ठीरवनखरकराघातसञ्जातमूर्छाम् । छन्दोधेनुं यतीन्द्रः प्रकृतिमगमयत्सूक्तिपीयूषवर्षैः
    सोऽयं श्रीशङ्करार्यो भवदवदहनात्पातु लोकानजस्रम् ॥ २॥ पूर्णः पीयूषभानुर्भवमरुतपनोद्दामतापाकुलानां प्रौढाज्ञानान्धकारावृतविषमपथभ्राम्यतामंशुमाली
    । कल्पः शाखी यतीनां विगतधनसुतादीषणानां सदा नः पायाच्छ्रीपद्मपादादिममुनिसहितः श्रीमदाचार्यवर्यः ॥ ३॥
    ब्रह्मानन्दं परमसुखदं केवलं ज्ञानमूर्तिं द्वन्द्वातीतं गगनसदृशं तत्त्वमस्यादिलक्ष्यम् । एकं नित्यं
    विमलमचलं सर्वधीसाक्षिभूतं भावातीतं त्रिगुणरहितं सद्गुरुं तं नमामि ॥ ४॥ नारायणं पद्मभवं वसिष्ठं शक्तिं
    च तत्पुत्रपराशरं च व्यासं शुकं गौडपादं महान्तं गोविन्दयोगीन्द्रमथास्यशिष्यम् । श्रीशङ्कराचार्यमथास्यपद्मपादं
    च हस्तामलकं च शिष्यं तं तोटकं वार्तिककारमन्यानस्मद्गुरून्सन्ततमानतोऽस्मि ॥ ५॥ विश्वं दर्पणदृश्यमाननगरीतुल्यं
    निजान्तर्गतं पश्यन्नात्मनि मायया बहिरिवोद्भूतं यथा निद्रया । यः साक्षात्कुरुते प्रबोधसमये स्वात्मानमेवाद्वयं
    तस्मै श्रीगुरुमूर्तये नम इदं श्रीदक्षिणामूर्तये ॥ ६॥ अखण्डमण्डलाकारं व्याप्तं येन चराचरम् । तत्पदं
    दर्शितं येन तस्मै श्रीगुरवे नमः ॥ ७॥ गुरुर्ब्रह्मा गुरुर्विष्णुर्गुरुर्देवो महेश्वरः । गुरुः साक्षात्परं
    ब्रह्म तस्मै श्रीगुरवे नमः ॥ ८॥ श्रुतिस्मृतिपुराणानामालयं करुणालयम् । नमामि भगवत्पादं शङ्करं लोकशङ्करम्
    ॥ ९॥ शङ्करं शङ्कराचार्य केशवं बादरायणम् । सूत्रभाष्यकृतौ वन्दे भगवन्तौ पुनः पुनः ॥ १०॥ ईश्वरो गुरुरात्मेति
    मूर्तिभेदविभागिने । व्योमवद्व्याप्तदेहाय दक्षिणामूर्तये नमः ॥ ११॥
