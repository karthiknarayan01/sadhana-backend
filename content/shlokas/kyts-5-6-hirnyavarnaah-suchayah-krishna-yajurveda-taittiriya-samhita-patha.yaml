    रुन्धे शृ॒ण्वन्त्ये॑न ञ्चि॑क्या॒नमत्त्यन्न॒ग्ं॒ रोच॑त इ॒यं वाँव प्र॑थ॒मा चिति॒रोष॑धयो॒ वन॒स्पत॑यः॒
    पुरी॑षम॒न्तरि॑क्ष न्द्वि॒तीया॒ वयाग्ं॑सि॒ पुरी॑षम॒सौ तृ॒तीया॒ नक्ष॑त्राणि॒ पुरी॑षं यँ॒ज्ञश्च॑तु॒र्थी
    दक्षि॑णा॒ पुरी॑षं॒ यँज॑मानः पञ्च॒मी प्र॒जा पुरी॑षं॒ त्पञ्च॑चितीकश्चेत॒व्य॑ ए॒तदे॒व सर्वग्ग्॑ स्पृणोति॒
    य त्रि॒वृद्ध्य॑ग्निर्य स्त्रि॒वृद्ध्य॑ग्निर्य द्यज॑मानः॒ प्रति॑ष्ठित्यै॒ पञ्च॒ चित॑यो भवन्ति॒ पाङ्क्तः॒
    पुरु॑ष आ॒त्मान॑मे॒व स्पृ॑णोति॒ पञ्च॒ चित॑यो भवन्ति प॒ञ्चभिः॒ पुरी॑षैर॒भ्यू॑हति॒ दश॒ स क्षरो॒ वै पुरु॑षो॒
    यावा॑ने॒व पुरु॑ष॒स्तग्ग् ड्वि॒राज्ये॒वान्नाद्ये॒ प्रति॑ तिष्ठति सं वँथ्स॒रो वै ष॒ष्ठी चिति॑र् ऋ॒तवः॒
    पुरी॑ष॒ग्ं॒ षट् चित॑यो भवन्ति॒ षट् पुरी॑षाणि॒ द्वाद॑श॒ स म्प॑द्यन्ते॒ द्वाद॑श॒ मासा वँथ्स॒र ए॒व प्रति॑
    तिष्ठति ॥ रोहि॑तो धू॒म्ररो॑हितः क॒र्कन्धु॑रोहित॒स्ते प्रा॑जाप॒त्या ब॒भ्रुर॑रु॒णब॑भ्रु॒ श्शुक॑बभ्रु॒स्ते
    रौ॒द्रा श्श्येतः॑ श्येता॒क्ष श्श्येत॑ग्रीव॒स्ते पि॑तृदेव॒त्या स्ति॒स्रः कृ॒ष्णा व॒शा वा॑रु॒ण्य॑स्ति॒स्र
    स्सौ॒र्यो॑ मैत्राबार् हस्प॒त्या धू॒म्रल॑लामास्तूप॒राः ॥ पृ॑श्ञि॒स्ते मा॑रु॒ताः फ॒ल्गूर्लो॑हितो॒र्णी
    ब॑ल॒क्षी ता स्सा॑रस्व॒त्यः॑ पृष॑ती स्थू॒लपृ॑षती क्षु॒द्रपृ॑षती॒ ता वै श्श्या॒मा व॒शाः पौ॒ष्णिय॑स्ति॒स्रो
    रोहि॑णीर्व॒शा मै॒त्रिय॑ ऐन्द्राबार् हस्प॒त्या अ॑रु॒णल॑लामास्तूप॒राः ॥ स्सम॒न्त शि॑तिबाहु॒स्त ऐ श्शि॑ति॒रन्ध्रो॒
    ऽन्यत॑श्शितिरन्ध्र स्सम॒न्तशि॑तिरन्ध्र॒स्ते मै स्स॒र्वशु॑द्धवालो म॒णिवा॑ल॒स्त आ परमे॒ष्ठिने॑ सोमापौ॒ष्णा
    श्श्या॒मल॑लामास्तूप॒राः ॥ शि॒ति॒बा॒हुः पञ्च॑विग्ंशतिः उ॒न्न॒त ऋ॑ष॒भो वा॑म॒नस्त ऐ श्शिति॑ककुच्छितिपृ॒ष्ठ
    श्शि॑ति॒पाच्छि॒त्योष्ठः॑ शिति॒भ्रुस्त ऐ न्द्रावैष्ण॒वास्ति॒स्र श्वकर्म॒ण्य॑स्ति॒स्रो धा॒त्रे पृ॑षोद॒रा
    ऐ श्श्येत॑ललामास्तूप॒राः ॥ उ॒न्न॒तः पञ्च॑विग्ंशतिः क॒र्णास्त्रयो॑ या॒मा स्सौ॒म्यास्त्रयः॑ श्विति॒ङ्गा
    अ॒ग्नये॒ यवि॑ष्ठाय॒ त्रयो॑ नकु॒लास्ति॒स्रो रोहि॑णी॒स्त्र्यव्य॒स्ता वसू॑ना ऽरु॒णा दि॑त्यौ॒ह्य॑स्ता
    रु॒द्राणाग्ं॑ सोमै॒न्द्रा ब॒भ्रुल॑लामास्तूप॒राः ॥ शु॒ण्ठास्त्रयो॑ वैष्ण॒वा अ॑धीलोध॒कर्णा॒स्त्रयो॒
    विष्ण॑व उरुक्र॒माय॑ लफ्सु॒दिन॒स्त्रयो॒ विष्ण॑व उरुगा॒याय॒ पञ्चा॑वीस्ति॒स्र आ॑दि॒त्याना ऽङ्गि॑रसामैन्द्रावैष्ण॒वा
    गौ॒रल॑लामास्तूप॒राः ॥ इन्द्रा॑य॒ राज्ञे॒ त्रयः॑ शितिपृ॒ष्ठा इन्द्रा॑या श्शिति॑ककुद॒ इन्द्रा॑य स्व॒राज्ञे॒
