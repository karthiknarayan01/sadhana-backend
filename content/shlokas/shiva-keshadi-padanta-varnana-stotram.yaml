id: shiva-keshadi-padanta-varnana-stotram
category: stotram
name:
  english: Shiva Keshadi Padanta Varnana Stotram
content:
  english: deyasurmurdhni rajatsarasasurasaritparaparyantanirya tpramshustambah pishangastulitaparinataraktashalilata
    vah | durvarapattigartashritanikhilajanottarane rajjubhuta ghoraghorviruhalidahanashikhishikhah sharma
    sharvah kapardah || || kurvannirvanamargapragamaparilasadrupyasopanashankam shakrarinam puranam trayavijayakritaspashtarekhayamanam
    | avyadavyajamuccairalikahimadharadhityakantastridhodya jjahnavyabham mridanikamituruduparukpandaram
    vastripundram || || krudhyadgauriprasadanatisamayapadangushthasankrantalaksha binduspardhi smarareh
    sphatikamanidrishanmagnamanikyashobham | murdhnyudyaddivyasindhoh patitashapharikakari vo mastakam
    sta dastokapattikrityai hutavahakanikamoksharuksham sadakshi || || bhutyai drigbhutayoh syadyadahimahimarugbimbayoh
    snigdhavarno daityaughadhvamsashamsi sphuta iva pariveshavashesho vibhati | sargasthityantavrittirmayi
    samupagatetiva nirvrittagarvam sharvanibharturuccairyugalamatha dadhadvibhramam tadbhruvorvah || ||
    yugme rukmabjapinge graha iva pihite dragyayoh pragduhitra shailasya dhvantanilambararacitabrihatkancuko'bhutprapancah
    | te trainetre pavitre tridashavaraghatamitrajaitrograshastre netre netre bhavetam drutamiha bhavatamindriyashvanviyantum
    || || candivaktrarpanecchostadanu bhagavatah pandurukpanduganda prodyatkandum vinetum vitanuta iva
    ye ratnakonairvighrishtim | candarcirmandalabhe satatanatajanadhvantakhandatishaunde candishe te shriyestamadhikamavanatakhandale
    kundale vah || || khatvangodagrapaneh sphutavikataputo vaktrarandhrapravesha prepsudancatphanorushvasadatidhavalahindrashankam
    dadhanah | yushmakam kramavaktramburuhaparilasatkarnikakarashobhah shashvattranaya bhuyadalamativimalottungakonah
    sa ghonah || || krudhyatyaddha yayoh svam tanumatilasatorbimbitam lakshayanti bhartre spardhatinighna
    muhuritaravadhushankaya shailakanya | yushmamstau shashvaduccairabahuladashamisharvarishatishubhra
    vavyastam divyasindhoh kamituravanamallokapalau kapolau || || yo bhasa bhatyupantasthita iva nibhritam
    kaustubho drashtumiccha nsotthasnehannitantam galagatagaralam patyuruccaih pashunam | prodyatpremna
    yamardra pibati girisuta sampadah satireka lokah shonikritanta yadadharamahasa so'dharo vo vidhattam
    || || atyartham rajate ya vadanashashadharadudgalaccaruvani piyushambhahpravahaprasaraparilasatphenabindvavaliva
    | deyatsa dantapanktishciramiha danudayadadauvarikasya dyutya diptendukundacchaviramalatarapronnatagra
    mudam vah || || nyakkurvannurvarabhrinnibhaghanasamayoddhushtameghaughaghosham sphurjadvardhyutthitorudhvanitamapi
    parabrahmabhuto gabhirah | suvyakto vyaktamurteh prakatitakaranah prananathasya satyah pritya vah
    samvidadhyatphalavikalamalam janma nadah sa nadah || || bhasa yasya triloki lasati parilasatphenabindvarnavanta
    rvyamagnevatigaurastulitasurasaridvaripuraprasarah | pinatma dantabhabhirbhrishamahahahakaratibhimah
    sadeshtam pushtam tushtim krishishta sphutamiha bhavatamattahaso'shtamurteh || || sadyojatakhyamapyam
    yaduvimalamudagvarti yadvamadevam namna hemna sadriksham jaladanibhamaghorahvayam dakshinam yat |
    yadbalarkaprabham tatpurushanigaditam purvamishanasanjnam yaddivyam tani shambhorbhavadabhilashitam
    panca dadyurmukhani || || atmapremno bhavanya svayamiva racitah sadaram samvananya mashya tisrahsunilanjananibhagararekhah
    samabhanti yasyam | akalpanalpabhasa bhrisharuciratara kambukalpambikayah patyuh satyantamantarvilasatu
    satatam manthara kandhara vah || || vaktrendordantalakshmyashciramadharamahakaustubhasyapyupante sotthanam
    prarthayanyah sthitimacalabhuve varayantyai nivesham | prayunktevashisho yah pratipadamamritatve sthitah
    kalashatroh kalam kurvangalam vo hridayamayamalam kshalayetkalakutah || || praudhapremakulaya dridhataraparirambheshu
    parvendumukhyah parvatyashcarucamikaravalayapadairankitam kantishali | rangannagangadadhyam satatamavihitam
    karma nirmulayetta ddormulam nirmalam yaddhridi duritamapasyarjitam dhurjatervah || || kanthashlesharthamapta
    diva iva kamituh svargasindhoh pravahah krantyai samsarasindhoh sphatikamanimahasankramakaradirghah
    | tiryagvishkambhabhutastribhuvanavasaterbhinnadaityebhadeha baha vasta harasya drutamiha nivahanamhasam
    samharantu || || vaksho dakshadvisho'lam smarabharavinamaddakshajakshinavaksho jantarnikshiptashumbhanmalayajamilitodbhasi
    bhasmokshitam yat | kshipram tadrukshacakshuh shrutiganaphanaratnaughabhabhikshnashobham yushmakam
    shashvadenah sphatikamanishilamandalabham kshinotu || || muktamukte vicitrakulavalilaharijalashalinyavanca
    nnabhyavarte viloladbhujagavarayute kalashatrorvishale | yushmaccittatridhama pratinavarucire mandire
    kantilakshmyah shetam shitamshugaure cirataramudarakshirasindhau salilam || || vaiyaghri yatra krittih
    sphurati himagirervistritopatyakantah sandravashyayamishra parita iva vrita nilajimutamala | abaddhahindrakancigunamatiprithulam
    shailajakridabhumi stadvo nihshreyase syajjaghanamatighanam balashitamshumauleh || || pushtavashtambhabhutau
    prithutarajaghanasyapi nityam trilokyah samyagvrittau surendradviradavarakarodarakantim dadhanau |
    saravuru purareh prasabhamarighataghasmarau bhasmashubhrau bhaktairatyardracittairadhikamavanatau
    vanchitam vo vidhattam || || anandayendukantopalaracitasamudgayite ye muninam cittadarsham nidhatum
    vidadhati carane tandavakuncanani | kancibhogindramurdhnam pratimuhurupadhanayamane kshanam te kante
    stamantakarerdyutivijitasudhabhanuni januni vah || || manjiribhutabhogipravaraganaphanamandalantarnitanta
    vyadirghanargharatnadyutikisalayate stuyamane dyusadbhih | bibhratyau vibhramam vah sphatikamanibrihaddandavadbhasite
    ye janghe shankhendushubhre bhrishamiha bhavatam manase shulapaneh || || astokastomashastrairapacitimamalam
    bhuribhavopaharaih kurvadbhih sarvadoccaih satatamabhivritau brahmaviddevaladyaih | samyaksampujyamanaviha
    hridi sarasivanisham yushmadiye sharvasya kridatam tau prapadavarabrihatkacchapavacchabhasau || ||
    yah svasyaikamshapatadatibahalagaladraktavaktram pranunna pranam prakroshayanprannijamacalavaram calayantam
    dashasyam | padangulyo dishantu drutamayugadrishah kalmashaploshakalyah kalyanam phullamalyaprakaravilasita
    vah pranaddhahivallyah || || prahvapracinabarhihpramukhasuravaraprasphuranmaulisakta jyayoratnotkarosrairaviratamamala
    bhurinirajita ya | prodagragra pradeyattatiriva rucira tarakanam nitantam nilagrivasya padamburuhavilasita
    sa nakhali sukham vah || || satyah satyananendavapi savidhagate ye vikasam dadhate svante svam te
    labhante shriyamiha sarasivamara ye dadhanah | lolam lolambakanam kulamiva sudhiyam sevate ye sada
    stam bhutyai bhutyainapanervimalatararucaste padambhoruhe vah || || yesham ragadidoshakshatamati yatayo
    yanti muktim prasada dye va namratmamurtidyusadrishiparishanmurdhni sheshayamanah | shrikanthasyarunodyaccaranasarasijaprotthitaste
    bhavakhya tparavaracciram vo duritahatikritastarayeyuh paragah || || bhumna yasyastasimna bhuvanamanusritam
    yatparam dhama dhamnam samnamamnayatattvam yadapi ca paramam yadgunatitamadyam | yaccamhohanniriham
    gahanamiti muhuh prahuruccairmahanto mahesham tanmaho me mahitamaharaharmoharoham nihantu || || iti
    shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah
    kritau shri shiva keshadipadantavarnana stotram ||
  devanagari: देयासुर्मूर्ध्नि राजत्सरससुरसरित्पारपर्यन्तनिर्य त्प्रांशुस्तम्बाः पिशङ्गास्तुलितपरिणतारक्तशालीलता
    वः । दुर्वारापत्तिगर्तश्रितनिखिलजनोत्तारणे रज्जुभूता घोराघोर्वीरुहालीदहनशिखिशिखाः शर्म शार्वाः कपर्दाः
    ॥ ॥ कुर्वन्निर्वाणमार्गप्रगमपरिलसद्रूप्यसोपानशङ्कां शक्रारीणां पुराणां त्रयविजयकृतस्पष्टरेखायमाणम्
    । अव्यादव्याजमुच्चैरलिकहिमधराधित्यकान्तस्त्रिधोद्य ज्जाह्नव्याभं मृडानीकमितुरुडुपरुक्पाण्डरं वस्त्रिपुण्ड्रम्
    ॥ ॥ क्रुध्यद्गौरीप्रसादानतिसमयपदाङ्गुष्ठसङ्क्रान्तलाक्षा बिन्दुस्पर्धि स्मरारेः स्फटिकमणिदृषन्मग्नमाणिक्यशोभम्
    । मूर्ध्न्युद्यद्दिव्यसिन्धोः पतितशफरिकाकारि वो मस्तकं स्ता दस्तोकापत्तिकृत्यै हुतवहकणिकामोक्षरूक्षं
    सदाक्षि ॥ ॥ भूत्यै दृग्भूतयोः स्याद्यदहिमहिमरुग्बिम्बयोः स्निग्धवर्णो दैत्यौघध्वंसशंसी स्फुट इव परिवेषावशेषो
    विभाति । सर्गस्थित्यन्तवृत्तिर्मयि समुपगतेतीव निर्वृत्तगर्वं शर्वाणीभर्तुरुच्चैर्युगलमथ दधद्विभ्रमं
    तद्भ्रुवोर्वः ॥ ॥ युग्मे रुक्माब्जपिङ्गे ग्रह इव पिहिते द्राग्ययोः प्राग्दुहित्रा शैलस्य ध्वान्तनीलाम्बररचितबृहत्कञ्चुकोऽभूत्प्रपञ्चः
    । ते त्रैनेत्रे पवित्रे त्रिदशवरघटामित्रजैत्रोग्रशस्त्रे नेत्रे नेत्रे भवेतां द्रुतमिह भवतामिन्द्रियाश्वान्वियन्तुम्
    ॥ ॥ चण्डीवक्त्रार्पणेच्छोस्तदनु भगवतः पाण्डुरुक्पाण्डुगण्ड प्रोद्यत्कण्डूं विनेतुं वितनुत इव ये रत्नकोणैर्विघृष्टिम्
    । चण्डार्चिर्मण्डलाभे सततनतजनध्वान्तखण्डातिशौण्डे चाण्डीशे ते श्रियेस्तामधिकमवनताखण्डले कुण्डले वः
    ॥ ॥ खट्वाङ्गोदग्रपाणेः स्फुटविकटपुटो वक्त्ररन्ध्रप्रवेश प्रेप्सूदञ्चत्फणोरुश्वसदतिधवलाहीन्द्रशङ्कां
    दधानः । युष्माकं क्रमवक्त्राम्बुरुहपरिलसत्कर्णिकाकारशोभः शश्वत्त्राणाय भूयादलमतिविमलोत्तुङ्गकोणः स
    घोणः ॥ ॥ क्रुध्यत्यद्धा ययोः स्वां तनुमतिलसतोर्बिम्बितां लक्षयन्ती भर्त्रे स्पर्धातिनिघ्ना मुहुरितरवधूशङ्कया
    शैलकन्या । युष्मांस्तौ शश्वदुच्चैरबहुलदशमीशर्वरीशातिशुभ्रा वव्यास्तां दिव्यसिन्धोः कमितुरवनमल्लोकपालौ
    कपोलौ ॥ ॥ यो भासा भात्युपान्तस्थित इव निभृतं कौस्तुभो द्रष्टुमिच्छ न्सोत्थस्नेहान्नितान्तं गलगतगरलं
    पत्युरुच्चैः पशूनाम् । प्रोद्यत्प्रेम्णा यमार्द्रा पिबति गिरिसुता सम्पदः सातिरेका लोकाः शोणीकृतान्ता
    यदधरमहसा सोऽधरो वो विधत्ताम् ॥ ॥ अत्यर्थं राजते या वदनशशधरादुद्गलच्चारुवाणी पीयूषाम्भःप्रवाहप्रसरपरिलसत्फेनबिन्द्वावलीव
    । देयात्सा दन्तपङ्क्तिश्चिरमिह दनुदायाददौवारिकस्य द्युत्या दीप्तेन्दुकुन्दच्छविरमलतरप्रोन्नताग्रा
    मुदं वः ॥ ॥ न्यक्कुर्वन्नुर्वराभृन्निभघनसमयोद्धुष्टमेघौघघोषं स्फूर्जद्वार्ध्युत्थितोरुध्वनितमपि परब्रह्मभूतो
    गभीरः । सुव्यक्तो व्यक्तमूर्तेः प्रकटितकरणः प्राणनाथस्य सत्याः प्रीत्या वः संविदध्यात्फलविकलमलं जन्म
    नादः स नादः ॥ ॥ भासा यस्य त्रिलोकी लसति परिलसत्फेनबिन्द्वर्णवान्त र्व्यामग्नेवातिगौरस्तुलितसुरसरिद्वारिपूरप्रसारः
    । पीनात्मा दन्तभाभिर्भृशमहहहकारातिभीमः सदेष्टां पुष्टां तुष्टिं कृषीष्ट स्फुटमिह भवतामट्टहासोऽष्टमूर्तेः
    ॥ ॥ सद्योजाताख्यमाप्यं यदुविमलमुदग्वर्ति यद्वामदेवं नाम्ना हेम्ना सदृक्षं जलदनिभमघोराह्वयं दक्षिणं
    यत् । यद्बालार्कप्रभं तत्पुरुषनिगदितं पूर्वमीशानसञ्ज्ञं यद्दिव्यं तानि शम्भोर्भवदभिलषितं पञ्च दद्युर्मुखानि
    ॥ ॥ आत्मप्रेम्णो भवान्या स्वयमिव रचिताः सादरं सांवनन्या मष्या तिस्रःसुनीलाञ्जननिभगररेखाः समाभान्ति
    यस्याम् । अकल्पानल्पभासा भृशरुचिरतरा कम्बुकल्पाम्बिकायाः पत्युः सात्यन्तमन्तर्विलसतु सततं मन्थरा कन्धरा
    वः ॥ ॥ वक्त्रेन्दोर्दन्तलक्ष्म्याश्चिरमधरमहाकौस्तुभस्याप्युपान्ते सोत्थानां प्रार्थयन्यः स्थितिमचलभुवे
    वारयन्त्यै निवेशम् । प्रायुङ्क्तेवाशिषो यः प्रतिपदममृतत्वे स्थितः कालशत्रोः कालं कुर्वन्गलं वो हृदयमयमलं
    क्षालयेत्कालकूटः ॥ ॥ प्रौढप्रेमाकुलाया दृढतरपरिरम्भेषु पर्वेन्दुमुख्याः पार्वत्याश्चारुचामीकरवलयपदैरङ्कितं
    कान्तिशालि । रङ्गन्नागाङ्गदाढ्यं सततमविहितं कर्म निर्मूलयेत्त द्दोर्मूलं निर्मलं यद्धृदि दुरितमपास्यार्जितं
    धूर्जटेर्वः ॥ ॥ कण्ठाश्लेषार्थमाप्ता दिव इव कमितुः स्वर्गसिन्धोः प्रवाहाः क्रान्त्यै संसारसिन्धोः
    स्फटिकमणिमहासङ्क्रमाकारदीर्घाः । तिर्यग्विष्कम्भभूतास्त्रिभुवनवसतेर्भिन्नदैत्येभदेहा बाहा वस्ता हरस्य
    द्रुतमिह निवहानंहसां संहरन्तु ॥ ॥ वक्षो दक्षद्विषोऽलं स्मरभरविनमद्दक्षजाक्षीणवक्षो जान्तर्निक्षिप्तशुम्भन्मलयजमिलितोद्भासि
    भस्मोक्षितं यत् । क्षिप्रं तद्रूक्षचक्षुः श्रुतिगणफणरत्नौघभाभीक्ष्णशोभं युष्माकं शश्वदेनः स्फटिकमणिशिलामण्डलाभं
    क्षिणोतु ॥ ॥ मुक्तामुक्ते विचित्राकुलवलिलहरीजालशालिन्यवाञ्च न्नाभ्यावर्ते विलोलद्भुजगवरयुते कालशत्रोर्विशाले
    । युष्मच्चित्तत्रिधामा प्रतिनवरुचिरे मन्दिरे कान्तिलक्ष्म्याः शेतां शीतांशुगौरे चिरतरमुदरक्षीरसिन्धौ
    सलीलम् ॥ ॥ वैयाघ्री यत्र कृत्तिः स्फुरति हिमगिरेर्विस्तृतोपत्यकान्तः सान्द्रावश्यायमिश्रा परित इव
    वृता नीलजीमूतमाला । आबद्धाहीन्द्रकाञ्चीगुणमतिपृथुलं शैलजाक्रीडभूमि स्तद्वो निःश्रेयसे स्याज्जघनमतिघनं
    बालशीतांशुमौलेः ॥ ॥ पुष्टावष्टम्भभूतौ पृथुतरजघनस्यापि नित्यं त्रिलोक्याः सम्यग्वृत्तौ सुरेन्द्रद्विरदवरकरोदारकान्तिं
    दधानौ । सारावूरू पुरारेः प्रसभमरिघटाघस्मरौ भस्मशुभ्रौ भक्तैरत्यार्द्रचित्तैरधिकमवनतौ वाञ्छितं वो विधत्ताम्
    ॥ ॥ आनन्दायेन्दुकान्तोपलरचितसमुद्गायिते ये मुनीनां चित्तादर्शं निधातुं विदधति चरणे ताण्डवाकुञ्चनानि
    । काञ्चीभोगीन्द्रमूर्ध्नां प्रतिमुहुरुपधानायमाने क्षणं ते कान्ते स्तामन्तकारेर्द्युतिविजितसुधाभानुनी
    जानुनी वः ॥ ॥ मञ्जीरीभूतभोगिप्रवरगणफणामण्डलान्तर्नितान्त व्यादीर्घानर्घरत्नद्युतिकिसलयते स्तूयमाने
    द्युसद्भिः । बिभ्रत्यौ विभ्रमं वः स्फटिकमणिबृहद्दण्डवद्भासिते ये जङ्घे शङ्खेन्दुशुभ्रे भृशमिह भवतां
    मानसे शूलपाणेः ॥ ॥ अस्तोकस्तोमशस्त्रैरपचितिममलां भूरिभावोपहारैः कुर्वद्भिः सर्वदोच्चैः सततमभिवृतौ
    ब्रह्मविद्देवलाद्यैः । सम्यक्सम्पूज्यमानाविह हृदि सरसीवानिशं युष्मदीये शर्वस्य क्रीडतां तौ प्रपदवरबृहत्कच्छपावच्छभासौ
    ॥ ॥ याः स्वस्यैकांशपातादतिबहलगलद्रक्तवक्त्रं प्रणुन्न प्राणं प्राक्रोशयन्प्राङ्निजमचलवरं चालयन्तं
    दशास्यम् । पादाङ्गुल्यो दिशन्तु द्रुतमयुगदृशः कल्मषप्लोषकल्याः कल्याणं फुल्लमाल्यप्रकरविलसिता वः प्रणद्धाहिवल्ल्यः
    ॥ ॥ प्रह्वप्राचीनबर्हिःप्रमुखसुरवरप्रस्फुरन्मौलिसक्त ज्यायोरत्नोत्करोस्रैरविरतममला भूरिनीराजिता या
    । प्रोदग्राग्रा प्रदेयात्ततिरिव रुचिरा तारकाणां नितान्तं नीलग्रीवस्य पादाम्बुरुहविलसिता सा नखाली सुखं
    वः ॥ ॥ सत्याः सत्याननेन्दावपि सविधगते ये विकासं दधाते स्वान्ते स्वां ते लभन्ते श्रियमिह सरसीवामरा
    ये दधानाः । लोलं लोलम्बकानां कुलमिव सुधियां सेवते ये सदा स्तां भूत्यै भूत्यैणपाणेर्विमलतररुचस्ते पदाम्भोरुहे
    वः ॥ ॥ येषां रागादिदोषाक्षतमति यतयो यान्ति मुक्तिं प्रसादा द्ये वा नम्रात्ममूर्तिद्युसदृषिपरिषन्मूर्ध्नि
    शेषायमाणाः । श्रीकण्ठस्यारुणोद्यच्चरणसरसिजप्रोत्थितास्ते भावाख्या त्पारावाराच्चिरं वो दुरितहतिकृतस्तारयेयुः
    परागाः ॥ ॥ भूम्ना यस्यास्तसीम्ना भुवनमनुसृतं यत्परं धाम धाम्नां साम्नामाम्नायतत्त्वं यदपि च परमं यद्गुणातीतमाद्यम्
    । यच्चांहोहन्निरीहं गहनमिति मुहुः प्राहुरुच्चैर्महान्तो माहेशं तन्महो मे महितमहरहर्मोहरोहं निहन्तु
    ॥ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्री
    शिव केशादिपादान्तवर्णन स्तोत्रम् ॥
