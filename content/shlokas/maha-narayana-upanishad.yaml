    gnayo vai trayi vidya devayanah pantha gar va~madevya mahavaniya ssamasuvargo loko brihat ssvishtagm
    suhutam mprayanagm suvargasya lokasya jyoti yajna iti yajnena hi deva diva ngata yajnenasura napanudanta
