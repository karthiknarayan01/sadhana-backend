id: sharadapancaratnastutih
category: stotram
name:
  english: sharadapancaratnastutih
  devanagari: शारदापञ्चरत्नस्तुतिः
content:
  english: vidyamudrakshamala'mritakalashakara kotisuryaprakasha jaya padmofbhavasya pranatajanatateh
    sarvamishtam dishanti | indropendradivandya tribhuvanajanani vaksavitri sharanya seyam shrisharadambam
    sakalasukhakari mangalani pradadyat || || iti dhyanam|| shrimacchankaradeshikendraracite tungapagatirage
    shringeryakhyapurasthite suvimale sanmaunisamsevite | pithe tam ravikotidiptisahitam rarajamanam shivam
    rajivakshamukhamararcitapadam vande sada sharadam ||1|| padanamrajanartinashanipunam nadanusandhayinim
    vedantapratipadyamanavibhavam vadadishaktipradam | vidyakalpalatam caturmukhamukhambhojatasuryayitam
    vidyatirthaguruttamairaharahah samsevyamanam bhaje ||2|| ishatsmeramukhambujam kucabharanamram trilokavanim
    daityavratavinashinim kucajitapravritpayodam shivam | samsararnavamagnadinajanatasantapasannashinim
    vande tam shubhadamananyasharanah svante sada sharadam ||3|| karunyamritavarirashimanisham keyuraharairvritam
    kamareh sahajam karabjavilasatkiram kuberarcitam | kamakrodhamukharivargashamanim kaivalyasampatpradam
    kanjodbhutamanah priyam hridi bhaje bhaktya sada sharadam ||4|| nitya'nityavivekadananipunam stutyam
    mukundadibhih yatyakarashashankamaulivinutam satyapitasvashravam | natya kevalameva tushtahridayam
    tyaktva'nyadevanaham bhaktya me hridayambuje'navaratam vande sada sharadam ||5|| || iti shrisharadapancaratnastutih||
  devanagari: विद्यामुद्राक्षमालाऽमृतकलशकरा कोटिसूर्यप्रकाशा जाया पद्मोफ़्भवस्य प्रणतजनततेः सर्वमिष्टं
    दिशन्ती । इन्द्रोपेन्द्रादिवन्द्या त्रिभुवनजननी वाक्सवित्री शरण्या सेयं श्रीशारदाम्बां सकलसुखकरी मङ्गलानि
    प्रदद्यात् ॥ ॥ इति ध्यानम्॥ श्रीमच्छङ्करदेशिकेन्द्ररचिते तुङ्गापगातीरगे शृङ्गेर्याख्यपुरस्थिते सुविमले
    सन्मौनिसंसेविते । पीठे तां रविकोटिदीप्तिसहितां राराजमानां शिवां राजीवाक्षमुखामरार्चितपदां वन्दे सदा
    शारदाम् ॥१॥ पादानम्रजनार्तिनाशनिपुणां नादानुसन्धायिनीं वेदान्तप्रतिपाद्यमानविभवां वादादिशक्तिप्रदाम्
    । विद्याकल्पलतां चतुर्मुखमुखाम्भोजातसूर्यायितां विद्यातीर्थगुरूत्तमैरहरहः संसेव्यमानां भजे ॥२॥ ईषत्स्मेरमुखाम्बुजां
    कुचभरानम्रां त्रिलोकावनीं दैत्यव्रातविनाशिनीं कुचजितप्रावृट्पयोदां शिवाम् । संसारार्णवमग्नदीनजनतासन्तापसन्नाशिनीं
    वन्दे तां शुभदामनन्यशरणः स्वान्ते सदा शारदाम् ॥३॥ कारुण्यामृतवारिराशिमनिशं केयूरहारैर्वृतां कामारेः
    सहजां कराब्जविलसत्कीरां कुबेरार्चिताम् । कामक्रोधमुखारिवर्गशमनीं कैवल्यसम्पत्प्रदां कञ्जोद्भूतमनः
    प्रियां हृदि भजे भक्त्या सदा शारदाम् ॥४॥ नित्याऽनित्यविवेकदाननिपुणां स्तुत्यां मुकुन्दादिभिः यत्याकारशशाङ्कमौलिविनुतां
    सत्यापितस्वाश्रवाम् । नत्या केवलमेव तुष्टहृदयां त्यक्त्वाऽन्यदेवानहं भक्त्या मे हृदयाम्बुजेऽनवरतं
    वन्दे सदा शारदाम् ॥५॥ ॥ इति श्रीशारदापञ्चरत्नस्तुतिः॥
