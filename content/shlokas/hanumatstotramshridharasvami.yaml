id: hanumatstotramshridharasvami
category: stotram
name:
  english: hanumatstotramshridharasvami
  devanagari: हनुमत्स्तोत्रम्श्रीधरस्वामी
content:
  english: sukhaikadhama bhushanam manojagarvakhandanam | anatmadhivigarhanam bhajeshamanjanisutam ||
    1|| bhavambudhim titirshubhih susevyamanamadbhutam | shivavatarinam param bhaje'hamanjanisutam ||
    2|| gunakaram kripakaram sushantidam yashaskaram | nijatmabuddhidayakam bhaje'hamanjanisutam || 3||
    sadaiva dushtabhanjanam sada sudharmavardhanam | mumukshubhaktaranjanam bhaje'hamanjanisutam || 4||
    suramapadasevinam suramanamagayinam | suramabhaktidayinam bhaje'hamanjanisutam || 5|| viraktamandaladhipam
    sadatmavitsusevitam | subhaktavrindavanditam bhaje'hamanjanisutam || 6|| vimukti vighnanashakam vimukti
    bhaktidayakam | mahaviraktikarakam bhaje'hamanjanisutam || 7|| sukhamyadevamadvayam brihattvameva
    tat svayam | itiha bodhikam gurum bhaje'hamanjanisutam || 8|| viraktimuktidayakam imam stavam supavanam
    | pathanti ye samadarata na samsarati te dhruvam || 9|| || iti shrimat paramahamsaparivrajakacarya
    sadguru bhagavata shridharasvamina viracitam shrisamartharamadasa stotram sampurnam ||
  devanagari: सुखैकधाम भूषणम् मनोजगर्वखण्डनम् । अनात्मधीविगर्हणम् भजेषमञ्जनीसुतम् ॥ १॥ भवाम्बुधिं तितीर्षुभिः
    सुसेव्यमानमद्भुतम् । शिवावतारिणं परम् भजेऽहमञ्जनीसुतम् ॥ २॥ गुणाकरं कृपाकरम् सुशान्तिदं यशस्करम् ।
    निजात्मबुद्धिदायकम् भजेऽहमञ्जनीसुतम् ॥ ३॥ सदैव दुष्टभञ्जनम् सदा सुधर्मवर्धनम् । मुमुक्षुभक्तरञ्जनम्
    भजेऽहमञ्जनीसुतम् ॥ ४॥ सुरामपादसेविनम् सुरामनामगायिनम् । सुरामभक्तिदायिनम् भजेऽहमञ्जनीसुतम् ॥ ५॥ विरक्तमण्डलाधिपम्
    सदात्मवित्सुसेवितम् । सुभक्तवृन्दवन्दितम् भजेऽहमञ्जनीसुतम् ॥ ६॥ विमुक्ति विघ्ननाशकम् विमुक्ति भक्तिदायकम्
    । महाविरक्तिकारकम् भजेऽहमञ्जनीसुतम् ॥ ७॥ सुखंयदेवमद्वयम् बृहत्त्वमेव तत् स्वयम् । इतीह बोधिकं गुरुम्
    भजेऽहमञ्जनीसुतम् ॥ ८॥ विरक्तिमुक्तिदायकम् इमं स्तवं सुपावनम् । पठन्ति ये समादरात न संसरति ते ध्रुवम्
    ॥ ९॥ ॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरु भगवता श्रीधरस्वामिना विरचितं श्रीसमर्थरामदास स्तोत्रं
    सम्पूर्णम् ॥
