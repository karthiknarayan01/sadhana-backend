id: vedavyasaproktamganapatistotram
category: stotram
name:
  english: vedavyasaproktamganapatistotram
  devanagari: वेदव्यासप्रोक्तंगणपतिस्तोत्रम्
content:
  english: vedavyasaproktam ganapatistotram vyasa uvaca | punaranyatpravakshyami stotram ganadhipasya
    ca | sarvasiddhikaram putam sarvabhishtaphalapradam || 1|| ekadantam mahakayam taptakancanasannibham
    | lambodaram vishalaksham vande'ham gananayakam || 2|| munjakrishnajinadharam nagayajnopavitakam |
    balendukalikamaulim vande'ham gananayakam || 3|| sarvavighnaharam devam sarvavighnavivarjitam mushakottamamaruhya
    devasuramahahave | yoddhukamam mahabahum vande'ham gananayakam || 4|| ambikahridayanandam matrikapariveshtitam
    | bhaktapriyam madonmattam vande'ham gananayakam || 5|| citraratnavicitrangam citramalavibhushanam
    | kamarupadharam devam vande'ham gananayakam || 6|| gajavaktram surashreshtham carukarnavibhushitam
    | pashankushadharam devam vande'ham gananayakam || 7|| yakshakinnaragandharvaih siddhavidyadharaissada
    | stuyamanam mahadeham vande'ham gananayakam || 8|| ganashtakamidam punyam bhaktito yah pathennarah
    | sarvasiddhimavapnoti rudraloke mahiyate || 9|| na nihsvatam tathabhyeti saptajanmasu manavah | ya
    idam pathate nityam maharajo bhavennarah || 10|| vashyam karoti trailokyam pathanacchravanadapi |
    stotram param mahapunyam ganapasya mahatmanah || 11|| iti shripadmapurane srishtikhande catushshashtitamadhyayantargatam
    vedavyasakritam ganapatistotram samaptam | padmapurana | srishtikhanda | adhyaya 64
  devanagari: वेदव्यासप्रोक्तं गणपतिस्तोत्रम् व्यास उवाच । पुनरन्यत्प्रवक्ष्यामि स्तोत्रं गणाधिपस्य च
    । सर्वसिद्धिकरं पूतं सर्वाभीष्टफलप्रदम् ॥ १॥ एकदन्तं महाकायं तप्तकाञ्चनसन्निभम् । लम्बोदरं विशालाक्षं
    वन्देऽहं गणनायकम् ॥ २॥ मुञ्जकृष्णाजिनधरं नागयज्ञोपवीतकम् । बालेन्दुकलिकामौलिं वन्देऽहं गणनायकम् ॥
    ३॥ सर्वविघ्नहरं देवं सर्वविघ्नविवर्जितं मूषकोत्तममारुह्य देवासुरमहाहवे । योद्धुकामं महाबाहुं वन्देऽहं
    गणनायकम् ॥ ४॥ अम्बिकाहृदयानन्दं मातृकापरिवेष्टितम् । भक्तप्रियं मदोन्मत्तं वन्देऽहं गणनायकम् ॥ ५॥
    चित्ररत्नविचित्राङ्गं चित्रमालाविभूषणम् । कामरूपधरं देवं वन्देऽहं गणनायकम् ॥ ६॥ गजवक्त्रं सुरश्रेष्ठं
    चारुकर्णविभूषितम् । पाशाङ्कुशधरं देवं वन्देऽहं गणनायकम् ॥ ७॥ यक्षकिन्नरगन्धर्वैः सिद्धविद्याधरैस्सदा
    । स्तूयमानं महादेहं वन्देऽहं गणनायकम् ॥ ८॥ गणाष्टकमिदं पुण्यं भक्तितो यः पठेन्नरः । सर्वसिद्धिमवाप्नोति
    रुद्रलोके महीयते ॥ ९॥ न निःस्वतां तथाभ्येति सप्तजन्मसु मानवः । य इदं पठते नित्यं महाराजो भवेन्नरः
    ॥ १०॥ वश्यं करोति त्रैलोक्यं पठनाच्छ्रवणादपि । स्तोत्रं परं महापुण्यं गणपस्य महात्मनः ॥ ११॥ इति श्रीपाद्मपुराणे
    सृष्टिखण्डे चतुष्षष्टितमाध्यायान्तर्गतं वेदव्यासकृतं गणपतिस्तोत्रं समाप्तम् । पद्मपुराण । सृष्टिखण्ड
    । अध्याय ६४
