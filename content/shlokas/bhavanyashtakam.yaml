id: bhavanyashtakam
category: stotram
name:
  english: bhavanyashtakam
  devanagari: भवान्यष्टकम्
content:
  english: bhavanyashtakam shrishamkaracaryah bhavanyashtakam shrishamkaracaryah na tato na mata na bandhurna
    data na putro na putri na bhrityo na bharta| na jaya na vidya na vrittirmamaiva gatistvam gatistvam
    tvameka bhavani ||1|| bhavabdhavapare mahaduhkhabhiru papata prakami pralobhi pramattah| kusamsarapashaprabaddhah
    sadaham gatistvam gatistvam tvameka bhavani ||2|| na janami danam na ca dhyanayogam na janami tantram
    na ca stotramantram| na janami pujam na ca nyasayogam gatistvam gatistvam tvameka bhavani ||3|| na
    janami punyam na janami tirtham na janami muktim layam va kadacit| na janami bhaktim vratam vapi matargatistvam
    gatistvam tvameka bhavani ||4|| kukarmi kusangi kubuddhih kudasah kulacarahinah kadacaralinah| kudrishtih
    kuvakyaprabandhah sadaham gatistvam gatistvam tvameka bhavani ||5|| prajesham ramesham mahesham suresham
    dinesham nishitheshvaram va kadacit| na janami canyat sadaham sharanye gatistvam gatistvam tvameka
    bhavani ||6|| vivade vishade pramade pravase jale canale parvate shatrumadhye| aranye sharanye sada
    mam prapahi gatistvam gatistvam tvameka bhavani ||7|| anatho daridro jararogayukto mahakshinadinah
    sada jadyavaktrah| vipattau pravishtah pranashtah sadaham gatistvam gatistvam tvameka bhavani ||8||
    iti shrimacchar̤karacaryakritam bhavanyashtakam sampurnam|
  devanagari: भवान्यष्टकम् श्रीशंकराचार्यः भवान्यष्टकम् श्रीशंकराचार्यः न तातो न माता न बन्धुर्न दाता
    न पुत्रो न पुत्री न भृत्यो न भर्ता। न जाया न विद्या न वृत्तिर्ममैव गतिस्त्वं गतिस्त्वं त्वमेका भवानि
    ॥१॥ भवाब्धावपारे महादुःखभीरु पपात प्रकामी प्रलोभी प्रमत्तः। कुसंसारपाशप्रबद्धः सदाहं गतिस्त्वं गतिस्त्वं
    त्वमेका भवानि ॥२॥ न जानामि दानं न च ध्यानयोगं न जानामि तन्त्रं न च स्तोत्रमन्त्रम्। न जानामि पूजां
    न च न्यासयोगम् गतिस्त्वं गतिस्त्वं त्वमेका भवानि ॥३॥ न जानामि पुण्यं न जानामि तीर्थं न जानामि मुक्तिं
    लयं वा कदाचित्। न जानामि भक्तिं व्रतं वापि मातर्गतिस्त्वं गतिस्त्वं त्वमेका भवानि ॥४॥ कुकर्मी कुसङ्गी
    कुबुद्धिः कुदासः कुलाचारहीनः कदाचारलीनः। कुदृष्टिः कुवाक्यप्रबन्धः सदाहम् गतिस्त्वं गतिस्त्वं त्वमेका
    भवानि ॥५॥ प्रजेशं रमेशं महेशं सुरेशं दिनेशं निशीथेश्वरं वा कदाचित्। न जानामि चान्यत् सदाहं शरण्ये
    गतिस्त्वं गतिस्त्वं त्वमेका भवानि ॥६॥ विवादे विषादे प्रमादे प्रवासे जले चानले पर्वते शत्रुमध्ये। अरण्ये
    शरण्ये सदा मां प्रपाहि गतिस्त्वं गतिस्त्वं त्वमेका भवानि ॥७॥ अनाथो दरिद्रो जरारोगयुक्तो महाक्षीणदीनः
    सदा जाड्यवक्त्रः। विपत्तौ प्रविष्टः प्रनष्टः सदाहम् गतिस्त्वं गतिस्त्वं त्वमेका भवानि ॥८॥ इति श्रीमच्छड़्कराचार्यकृतं
    भवान्यष्टकं सम्पूर्णम्।
