id: suryakavac
category: kavacha
name:
  english: suryakavac
  devanagari: सूर्यकवच्
content:
  english: rm aryama prabhuh || 16|| tam tham dam dham mukham payad yam yogishvarapujitah | tam tham dam
    dham galam patu nam narayanavallabhah || 17|| pam pham bam bham mama skandhau patu mam mahasam nidhih
    | yam ram lam vam bhujau patu mulam sakanayakah || 18|| sham sham sam ham patu vaksho mulamantramayoi
    dhruvah | ḻam kshah kukshsim sada patu grahatho dineshvarah || 19|| nam nam nam nam mam me patu prishtham
    divasanayakah | am am im im um um rim rim nabhim patu tamopahah || 20|| lim lim em aim om aum am ah
    lingam me'vyad graheshvarah | kam kham gam gham cam cham jam jham katim bhanurmamavatu || 21|| tam
    tham dam dham tam tham dam dham janu bhasvan mamavatu | pam pham bam bham yam ram lam vam janghe me|avyad
    vibhakarah || 22|| sham sham sam ham ḻam kshah patu mulam padau trayitanuh | nam nam nam nam mam me
    patu savita sakalam vapuh || 23|| somah purve ca mam patu bhaumo'gnau mam sadavatu | budho mam dakshine
    patu nairitya gurareva mam || 24|| pashcime mam sitah patu vayavyam mam shanaishcarah | uttare mam
    tamah payadaishanyam mam shikhi tatha || 25|| urdhvam mam patu mihiro mamadhastanjagatpatih | prabhate
    bhaskarah patu madhyahne mam dineshvarah || 26|| sayam vedapriyah patu nishithe visphurapatih | sarvatra
    sarvada suryah patu mam cakranayakah || 27|| rane rajakule dyute vidade shatrusankate | sangame ca
    jvare roge patu mam savita prabhuh || 28|| om om om uta omuom ha sa ma yah suro'vatanmam bhayad |
    hram hrim hrum hahaha hasauh hasahasauh hamso'vatat sarvatah | sah sah sah sasasa nripadvanacaraccauradranat
    samkatat | payanmam kulanayako'pi savita om hrim ha sauh sarvada || 29|| dram drim drum dadhanam tatha
    ca taranirbhambhairbhayad bhaskaro ram rim rum rururum ravirjvarabhayat kushthacca shulamayat | am
    am am vivivim mahamayabhayam mam patu martandako mulavyaptatanuh sadavatu param hamsah sahasramshuman
    || 30|| iti shrikavaccam divyam vajrapanjarakabhidham | sarvadevarahasyam ca matrikamantraveshtitam
    || 31|| maharogabhayaghnam ca papaghnam manmukhoditam | guhyam yashaskaram punyam sarvashreyaskaram
    shive || 32|| likhitva ravivare tu tishye va janmabhe priye | ashtagandhena divyena sudhakshirena
    parvati || 33|| arkakshirena punyena bhurjatvaci maheshvari | kanakikashthalekhanya kavacam bhaskarodaye
    || 34|| shvetasutrena raktena shyamenaveshtayed gutim | sauvarnenatha samveshthya dharayenmurdhni
    va bhuje || 35|| rane ripunjayed devi vade sadasi jeshyati | rajamanyo bhavennityam sarvatejomayo
    bhavet || 36|| kanthastha putrada devi kukshistha roganashini | shirahstha gutika divya rakalokavashankari
    || 37|| bhujastha dhanada nityam tejobuddhivivardhini | vandhya va kakavandhya va mritavatsa ca yangana
    || 38|| kanthe sa dharayennityam bahuputra prajayaye | yasya dehe bhavennityam gutikaisha maheshvari
    || 39|| mahastranindramuktani brahmastradini parvati | taddeham prapya vyarthani bhavishyanti na samshayah
    || 40|| trikalam yah pathennityam kavacam vajrapanjaram | tasya sadyo mahadevi savita varado bhavet
    || 41|| ajnatva kavacam devi pujayed yastrayitanum | tasya pujarjitam punyam janmakotishu nishphalam
    || 42|| shatavartam pathedvarma saptamyam ravivasare | mahakushthardito devi mucyate natra samshayah
    || 43|| nirogo yah pathedvarma daridro vajrapanjaram | lakshmivanjayate devi sadyah suryaprasadatah
    || 44|| bhaktya yah prapathed devi kavacam pratyaham priye | iha loke shriyam bhuktva dehante muktimapnuyat
    || 45|| iti shrirudrayamale tantre shridevirahasye vajrapanjarakhyasuryakavacanirupanam trayastrimshah
    patalah || 33 ||
  devanagari: र्ं अर्यमा प्रभुः ॥ १६॥ टं ठं डं ढं मुखं पायाद् यं योगीश्वरपूजितः । तं थं दं धं गलं पातु
    नं नारायणवल्लभः ॥ १७॥ पं फं बं भं मम स्कन्धौ पातु मं महसां निधिः । यं रं लं वं भुजौ पातु मूलं सकनायकः
    ॥ १८॥ शं षं सं हं पातु वक्षो मूलमन्त्रमयोइ ध्रुवः । ळं क्षः कुक्ष्सिं सदा पातु ग्रहाथो दिनेश्वरः ॥
    १९॥ ङं ञं णं नं मं मे पातु पृष्ठं दिवसनायकः । अं आं इं ईं उं ऊं ऋं ॠं नाभिं पातु तमोपहः ॥ २०॥ ऌं ॡं
    एं ऐं ओं औं अं अः लिङ्गं मेऽव्याद् ग्रहेश्वरः । कं खं गं घं चं छं जं झं कटिं भानुर्ममावतु ॥ २१॥ टं
    ठं डं ढं तं थं दं धं जानू भास्वान् ममावतु । पं फं बं भं यं रं लं वं जङ्घे मे।आव्याद् विभाकरः ॥ २२॥
    शं षं सं हं ळं क्षः पातु मूलं पादौ त्रयितनुः । ङं ञं णं नं मं मे पातु सविता सकलं वपुः ॥ २३॥ सोमः पूर्वे
    च मां पातु भौमोऽग्नौ मां सदावतु । बुधो मां दक्षिणे पातु नैऋत्या गुररेव माम् ॥ २४॥ पश्चिमे मां सितः
    पातु वायव्यां मां शनैश्चरः । उत्तरे मां तमः पायादैशान्यां मां शिखी तथा ॥ २५॥ ऊर्ध्वं मां पातु मिहिरो
    मामधस्ताञ्जगत्पतिः । प्रभाते भास्करः पातु मध्याह्ने मां दिनेश्वरः ॥ २६॥ सायं वेदप्रियः पातु निशीथे
    विस्फुरापतिः । सर्वत्र सर्वदा सूर्यः पातु मां चक्रनायकः ॥ २७॥ रणे राजकुले द्यूते विदादे शत्रुसङ्कटे
    । सङ्गामे च ज्वरे रोगे पातु मां सविता प्रभुः ॥ २८॥ ओं ओं ओं उत ओंउॐ ह स म यः सूरोऽवतान्मां भयाद् ।
    ह्रां ह्रीं ह्रुं हहहा हसौः हसहसौः हंसोऽवतात् सर्वतः । सः सः सः सससा नृपाद्वनचराच्चौराद्रणात् संकटात्
    । पायान्मां कुलनायकोऽपि सविता ओं ह्रीं ह सौः सर्वदा ॥ २९॥ द्रां द्रीं द्रूं दधनं तथा च तरणिर्भांभैर्भयाद्
    भास्करो रां रीं रूं रुरुरूं रविर्ज्वरभयात् कुष्ठाच्च शूलामयात् । अं अं आं विविवीं महामयभयं मां पातु
    मार्तण्डको मूलव्याप्ततनुः सदावतु परं हंसः सहस्रांशुमान् ॥ ३०॥ इति श्रीकवच्चं दिव्यं वज्रपञ्जरकाभिधम्
    । सर्वदेवरहस्यं च मातृकामन्त्रवेष्टितम् ॥ ३१॥ महारोगभयघ्नं च पापघ्नं मन्मुखोदितम् । गुह्यं यशस्करं
    पुण्यं सर्वश्रेयस्करं शिवे ॥ ३२॥ लिखित्वा रविवारे तु तिष्ये वा जन्मभे प्रिये । अष्टगन्धेन दिव्येन
    सुधाक्षीरेण पार्वति ॥ ३३॥ अर्कक्षीरेण पुण्येन भूर्जत्वचि महेश्वरि । कनकीकाष्ठलेखन्या कवचं भास्करोदये
    ॥ ३४॥ श्वेतसूत्रेण रक्तेन श्यामेनावेष्टयेद् गुटीम् । सौवर्णेनाथ संवेष्ठ्य धारयेन्मूर्ध्नि वा भुजे
    ॥ ३५॥ रणे रिपूञ्जयेद् देवि वादे सदसि जेष्यति । राजमान्यो भवेन्नित्यं सर्वतेजोमयो भवेत् ॥ ३६॥ कण्ठस्था
    पुत्रदा देवि कुक्षिस्था रोगनाशिनी । शिरःस्था गुटिका दिव्या राकलोकवशङ्करी ॥ ३७॥ भुजस्था धनदा नित्यं
    तेजोबुद्धिविवर्धिनी । वन्ध्या वा काकवन्ध्या वा मृतवत्सा च याङ्गना ॥ ३८॥ कण्ठे सा धारयेन्नित्यं बहुपुत्रा
    प्रजायये । यस्य देहे भवेन्नित्यं गुटिकैषा महेश्वरि ॥ ३९॥ महास्त्राणीन्द्रमुक्तानि ब्रह्मास्त्रादीनि
    पार्वति । तद्देहं प्राप्य व्यर्थानि भविष्यन्ति न संशयः ॥ ४०॥ त्रिकालं यः पठेन्नित्यं कवचं वज्रपञ्जरम्
    । तस्य सद्यो महादेवि सविता वरदो भवेत् ॥ ४१॥ अज्ञात्वा कवचं देवि पूजयेद् यस्त्रयीतनुम् । तस्य पूजार्जितं
    पुण्यं जन्मकोटिषु निष्फलम् ॥ ४२॥ शतावर्तं पठेद्वर्म सप्तम्यां रविवासरे । महाकुष्ठार्दितो देवि मुच्यते
    नात्र संशयः ॥ ४३॥ निरोगो यः पठेद्वर्म दरिद्रो वज्रपञ्जरम् । लक्ष्मीवाञ्जायते देवि सद्यः सूर्यप्रसादतः
    ॥ ४४॥ भक्त्या यः प्रपठेद् देवि कवचं प्रत्यहं प्रिये । इह लोके श्रियं भुक्त्वा देहान्ते मुक्तिमाप्नुयात्
    ॥ ४५॥ इति श्रीरुद्रयामले तन्त्रे श्रीदेविरहस्ये वज्रपञ्जराख्यसूर्यकवचनिरूपणं त्रयस्त्रिंशः पटलः ॥
    ३३ ॥
