id: snehalatikayakritampurushottamastotram-11
category: stotram
name:
  english: snehalatikayakritampurushottamastotram 11
  devanagari: स्नेहलतिकयाकृतंपुरुषोत्तमस्तोत्रम् ११
content:
  english: atha'sya putrah putryashca patni sadhvi sadharmini || 27|| namna snehalatadevi shushoca svapatisthitim
    | mahabhagavati patni bhajate shriharim tu mam || 28|| prarthayatyeva pujayam patyurdharmasya rakshanam
    | adharmasya parityagam yashah kirtim suvamshajam || 29|| balakrishna hare krishna purushottama madhava
    | tava bhaktasya citte yaccancalyam tatprashamaya || 30|| anadishrikrishna narayana shrikanta keshava
    | mama patyurvyavayasya vyasanam tvam pramocaya || 31|| raja'pi tava bhaktah syattatha krishna vidhehi
    ca | ganika api bhaktah syuryatha te paramatmanah || 32|| prajashcapi ca bhaktah syustatha krishna
    kripam kuru | vratam cadyadinatte'ham varshantam tvekabhojanam || 33|| karishye ca tatha sadhusatiseva
    samahita | pratyaham pujanam te ca karishye ghatikavadhim || 34|| shodashairupacaraishca karayishye
    tu sutake | prenkham svarnamayim capi murtim svarnamayim ca te || 35|| karayishye shriya yuktam radhaya
    ramaya yutam | padmavatya yutam yuktam manikyaya ca shobhanam || 36|| lakshmya yuktam tatha ramyam
    vibhushadhyam suyauvanam | shayyaparyankamevapi karayishye shubhottamam || 37|| svarnarajatajanyam
    ca tavopakarananyapi | vyajane camare chatram paduke bhushanani ca || 38|| karayishye svarnaratnamayani
    tava tushtaye | nityam sugandhasaraishca tailasaraishca mardanam || 39|| abhyanjanam dravaishcapi
    pujanam tulasidalaih | naivedyam ghritamishtanaih karayishye'titushtaye || 40|| tavotsavan karayishye
    varshikan kanta keshava | vanijam me patim varanganavyasananmocaya || 41|| esha te sharanam prapta
    patita tava padayoh | mama patyustu papani prajvalaya priyam kuru || 42|| ityuktva snehalatika dipotsavidine
    hareh | kritva me pujanam capyasamvatsaram vratam vyadhat || 43|| iti shrilakshminarayaniyasamhitayah
    dvaparayugasantanatmakasya tritiyakhande 192
  devanagari: अथाऽस्य पुत्राः पुत्र्यश्च पत्नी साध्वी सधर्मिणी ॥ २७॥ नाम्ना स्नेहलतादेवी शुशोच स्वपतिस्थितिम्
    । महाभागवती पत्नी भजते श्रीहरिं तु माम् ॥ २८॥ प्रार्थयत्येव पूजायां पत्युर्धर्मस्य रक्षणम् । अधर्मस्य
    परित्यागं यशः कीर्तिं सुवंशजाम् ॥ २९॥ बालकृष्ण हरे कृष्ण पुरुषोत्तम माधव । तव भक्तस्य चित्ते यच्चाञ्चल्यं
    तत्प्रशामय ॥ ३०॥ अनादिश्रीकृष्ण नारायण श्रीकान्त केशव । मम पत्युर्व्यवायस्य व्यसनं त्वं प्रमोचय ॥
    ३१॥ राजाऽपि तव भक्तः स्यात्तथा कृष्ण विधेहि च । गणिका अपि भक्ताः स्युर्यथा ते परमात्मनः ॥ ३२॥ प्रजाश्चापि
    च भक्ताः स्युस्तथा कृष्ण कृपां कुरु । व्रतं चाद्यदिनात्तेऽहं वर्षान्तं त्वेकभोजनम् ॥ ३३॥ करिष्ये च
    तथा साधुसतीसेवा समाहिता । प्रत्यहं पूजनं ते च करिष्ये घटिकावधिम् ॥ ३४॥ षोडशैरुपचारैश्च कारयिष्ये तु
    सूतके । प्रेङ्खां स्वर्णमयीं चापि मूर्तिं स्वर्णमयीं च ते ॥ ३५॥ कारयिष्ये श्रिया युक्तां राधया रमया
    युताम् । पद्मावत्या युतां युक्तां माणिक्यया च शोभनाम् ॥ ३६॥ लक्ष्म्या युक्तां तथा रम्यां विभूषाढ्यां
    सुयौवनाम् । शय्यापर्यङ्कमेवापि कारयिष्ये शुभोत्तमाम् ॥ ३७॥ स्वर्णराजतजन्यं च तवोपकरणान्यपि । व्यजने
    चामरे छत्रं पादुके भूषणानि च ॥ ३८॥ कारयिष्ये स्वर्णरत्नमयानि तव तुष्टये । नित्यं सुगन्धसारैश्च तैलसारैश्च
    मर्दनम् ॥ ३९॥ अभ्यञ्जनं द्रवैश्चापि पूजनं तुलसीदलैः । नैवेद्यं घृतमिष्टानैः कारयिष्येऽतितुष्टये ॥
    ४०॥ तवोत्सवान् कारयिष्ये वार्षिकान् कान्त केशव । वणिजं मे पतिं वाराङ्गनाव्यसनान्मोचय ॥ ४१॥ एषा ते
    शरणं प्राप्ता पतिता तव पादयोः । मम पत्युस्तु पापानि प्रज्वालय प्रियं कुरु ॥ ४२॥ इत्युक्त्वा स्नेहलतिका
    दीपोत्सवीदिने हरेः । कृत्वा मे पूजनं चाप्यासंवत्सरं व्रतं व्यधात् ॥ ४३॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः
    द्वापरयुगसन्तानात्मकस्य तृतीयखण्डे १९२
