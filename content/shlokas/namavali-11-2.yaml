id: namavali-11-2
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: shriganeshadashanamavalih om ganadhipaya namah | om umaputraya namah | om aghanashanaya namah
    | om ekadantaya namah | om ibhavaktreshaya namah | om devaya namah | om mushakavahanaya namah | om
    vinayakaya namah | om ishaputraya namah | om sarvasiddhipradayakaya namah | iti shriganeshadashanamavalih
    sampurna |
  devanagari: श्रीगणेशदशनामावलिः ॐ गणाधिपाय नमः । ॐ उमापुत्राय नमः । ॐ अघनाशनाय नमः । ॐ एकदन्ताय नमः ।
    ॐ इभवक्त्रेशाय नमः । ॐ देवाय नमः । ॐ मूषकवाहनाय नमः । ॐ विनायकाय नमः । ॐ ईशपुत्राय नमः । ॐ सर्वसिद्धिप्रदायकाय
    नमः । इति श्रीगणेशदशनामावलिः सम्पूर्णा ।
meaning: {}
