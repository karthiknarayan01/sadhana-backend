id: kytb-2-1-agnihotra-brahmanam-krishna-yajurveda-taittiriya-brahmana-patha-angiraso-vai
category: stotram
name:
  english: KYTB 2.1 Agnihotra Brahmanam - Krishna Yajurveda Taittiriya Brahmana Patha - Angiraso Vai
content:
  english: krishna yajurvediya taittiriya brahmane dvitiyashtake prathamah prapathakah agnihotrabrahmanam
    o shri gurubhyo namah | harih om || anuvakam agnihotrasyopoddhatah angiraso vai satramasata | tesha
    rgharmadhugasit | sarjishenajivat | te 'bruvann | kasmai nu satrama 'sya oshadhirna janayama iti |
    te divo vrishti sstoka avapadyanta | tavatiroshadhayo 'jayanta || ta jatah pitaro vishenalimpann ||
    njagdhva rupyantyait | te 'bruvann | ka idamittha micchamana iti pitaro vo~ bhagadheyamiti | agnihotra
    eva no bruvann | tebhya eta mprayacchann | yaddhutva nimar shti | tato vai ta oshadhira 'sma oshadhayah
    | te vathsamu mpradapayeti | so vri~nai | dasha ma ratri nna dohann | asangava mmatra saha caraniti
    | tasma ndasha ratrirna duhanti | asangava mmatra saha carati | varevritagghyasya | tasma dvathsagm
    sagmsrishtadhayagm rudro ghatukah | ati hi sandha agnihotranirupanam prajapati mpraja anvasrijyanta
    | tamabhaga upa kramat | tamavaruru nnashaknot | sa tapo 'tapyata | so ruparamatatapi vai sya prajapatiriti
    | sa raratadudamrishta || dghritamabhavat | tasmadyasya dakshinatah kesha unmrishtah | ta shthalakshmi
    prajapatyetyahuh | ya draratadudamrishta | tasma drarate kesha na santi | tadagnau pragrihnat | tadvyacikithsat
    | juhavani dvicikithsayai janma || ya evam || vasiya eva cetayate || tam 'bravit | kastvamasiti |
    svaiva te vagityabravit | so thsvaheti | tathsvahakarasya janma || ya evagg svahakarasya janma veda
    | karoti svahakarena virya vi~dushah svahakarena juhvati || || bhogayaivasya huta mbhavati || tasya
    ahutyai purusha majuhot | sa gamasrijata | caturtha rabibhet | ahutibhirvai ma ''pnotiti | sa prajapati
    mpunah pravishat | ta rabravit | jayasveti | so mbhagadheyamabhi janishya iti | tubhyamevedagm huyata
    ityabravit | sa eta dbhagadheyamabhyajayata | yadagnihotram || mucyate || taddhuyamana 'bravit | ma
    haushih | ubhayorvai nnau hoshyantiti | sayameva tubhya njuhavann | pratarmahya mityabravit | tasmadagnaye
    sayagm huyate | suryaya pratah || || agneyi vai ratrih | aindramahah | yadanudite surye pratarjuhuyat
    | ubhayamevagneyagg pratarjuhoti | tatha 'gnaye sayagm huyate | suryaya pratah || ratrim va~ anu prajah
    pra jayante | ahna prati tishthanti | yathsaya || praiva tena jayate | udite surye rjuhoti | pratyeva
    tena tishthati || prajapatira kamayata prajayeyeti | sa etadagnihotra mapashyat | tadudite surye 'juhot
    | yajusha 'nyat | tushnimanyat | tato vai sa prajayata | yasyaivam vi~dusha udite surye || praiva
    jayate | atho yatha diva prajananneti | tadrigeva tat || atho khalvahuh | yasya vai dvau punyau grihe
    vasatah | yastayoranyagm radhayatyanya nna | ubhau vava sa tavricchatiti | agnim mpravishati | tasmadagnirdurannakta
    ndadrishe | ubhe hi tejasi sapandyete || magniranu samarohati | tasma ddhuma evagnerdiva dadrishe
    | yadagnaye saya njuhuyat | a suryaya vrishcyeta | yathsuryaya prata 'gnaye vrishcyeta | devata ndaddhyat
    | agnirjyoti ssvahetyeva sayagm hotavya m | suryo jyoti ssvaheti pratah | tathobhabhyagm sayagm huyate
    || mpratah | na devata ndadhati || agnirjyotirityaha | agnirvai retodhah || praja jyotirityaha | praja
    evasmai pra janayati || suryo jyotirityaha | prajasveva prajatasu reto dadhati || jyotiragni ssvahetyaha
    | praja eva prajata asya njuhoti | mithunatvaya praja tyai || yadudite surye 'tithaye pradrutaya shunyayavasatha
    yaharyagm haranti | tadrigeva tat | kvaha tatasta dbhavatityahuh | yathsa na veda | yasmai taddharantiti
    | tasma njuhoti | tadeva sapranti | atho yatha prarthamaushasa shti | tadrigeva tat || upayokshyamanasya
    havisha ssamskarah rudro va eshah | yadagnih | patni sthali | yanmaddhye t | rudraya patnimapi daddhyat
    | pramayuka syat | udico 'ngaranniruhyadhi shrayati | patniyai gopithaya || vyantan karoti | tatha
    patnya ntah | aharahah pravrijyate | yadagnihotram | pratishince tpashukamasya | shantamiva hi pashavya
    dbrahmavarcasakamasya | samiddhamiva hi brahmavarcasam || atho khalu | pratishicyameva | yat m | yajjuhoti
    | tadbrahmavarcasi | ubhayamevakah || pracyutam ndevalokam | yacchritagm haviranabhigharitam | abhidyotayati
    | abhyevainadgharayati | atho devatraivaina || paryagni karoti | rakshasa mapahatyai || trih paryagni
    karoti | tryavriddhi yajnah | atho meddhyatvaya || yat t | yajamanagm shuca 'rpayet | ya ddakshina
    | pitridevatyagg syat | yat || patnigm shuca 'rpayet | udicina mudvasayati | esha vai devamanushyanagm
    shanta dik | tamevainadanu || vartma karoti | yajnasya santatyai || nishtapati | upaiva tathstrinati
    || caturunnayati | catushpadah pashavah || purnanunnayati | sarve hi punya raddhah || anuca unnayati
    | prajaya anucinatvaya | anucyevasya praja 'rdhuka bhavati || sa mmrishati vyavrittyai || naho shyannupa
    sadayet | yadaho t | yatha 'nyasma upanidhaya || prayacchati | tadrigeva tat | a 'smai vrishcyeta
    | yadeva gar 'dhishrayati | tena gar mprinati || agnirabibhet | ahutayo ma shyantiti | sa etagm samidha
    'dhatta | tato va agnavahutayo || yadenagm samayacchat | tathsamidhah samittvam | samidhamadadhati
    | samevainam | atho agnihotrameveddhmavat mpratishthityai || brahmavadino vadanti | yadekagm samidhamadhaya
    dve ahuti juhoti | atha kasyagm samidhi dvitiya ddve samidhavadaddhyat | bhratrivyamasmai janayet
    | ekagm samidhamadhaya | yajusha 'nyamahuti njuhoti | ubhe eva samidvati ahuti juhoti | nasmai bhratrivya
    njuhoti | samiddhamiva hi brahmavarcasam | atho yatha njyotishkritva pariveve shti | tadrigeva tat
    || caturunnayati | dvirjuhoti | tasma ccatushpadamatti | atho dvipadyeva catushpadah pratishthapayati
    || ssamskarah uttaravatim vai~ deva ahutimajuhavuh | avacimasurah | tato deva abhavann | para nkamayeta
    vasiyan thsyaditi | kaniyastasya purvagm hutva | uttara mbhuyo juhuyat | esha va uttaravatyahutih
    | ta ndeva ajuhavuh | tataste njuhvati | bhavatyeva || ya nkamayeta papiyan thsyaditi | bhuyastasya
    purvagm hutva | uttara nkaniyo juhuyat | esha va avacyahutih | tamasura ajuhavuh | tataste para njuhvati
    | paraiva bhavati || || hutvopa sadayatyajamitvaya | atho vyavrittyai || gar kshate | ananuddhyayina
    nkaroti || agnihotrasya vai sthanurasti | tam ya~ ricchet | yajnasthanumricchet | esha va agnihotrasya
    sthanuh | yat mricchet | atihaya purvamahuti njuhoti | yajnasthanumeva pari vrinakti | atho bhratrivyamevaptva
    'tikramati || avacinagm sayamupa mar mpratah | pra janayatyeva tat || brahmavadino vadanti | caturunnayati
    || || dvirjuhoti | atha kva dve ahuti bhavata iti | agnau vai shvanara iti bruyat | esha va agnirvai
    hmanah | hutva dvih prashnati | agnaveva vai shvanare dve ahuti juhoti || dvirjuhoti | dvirnima shti
    | dvih prashnati || thsampadyante | shadva ritavah | rituneva prinati | brahmavadino vadanti | ki
    magnihotramiti | vaishvadevamiti bruyat | ya dyajusha juhoti | tadai shti | tadoshadhinam | yaddvitiya
    dgarbhanam | tasma dgarbha anashnanto vardhante | yadacamati | tanmanushyanam || udamparyavrityacamati
    || || atmano gopithaya || nirnenekti shuddhyai || nishtapati svagakrityai | u ddishati | saptarshineva
    prinati || dakshina paryavartate | svameva viryamanu paryavartate | tasma 'rdha atmano viryavattarah
    | atho adityasyaivavritamanu paryavartate || hutvopa samindhe || || brahmavarcasasya samiddhyai ||
    na barahiranu pra haret | asaggsthito va esha yajnah | yadagnihotram | yadanu prahare vi~cchindyat
    | tasmannanu prahritya m | yajnasya santatyai || apo ni nayati | avabhrithasyaiva rupamakah || shti
    dvih prashnati kamyani homadravyani brahmavadino vadanti | agnihotraprayana yajnah | ki magnihotramiti
    | vathso va agnihotrasya prayanam | agnihotram m || tasya prithivi sadah | antariksha m | divya apah
    prokshanayah | oshadhayo barahih || || vanaspataya iddhmah | dishah paridhayah | adityo yupah | yajamanah
    pashuh | samudro ssvagakarah | tasmadahitagne njuhoti | ratrimeva tena dakshinya || ahareva tena dakshinya
    tato dadati | sa dakshina || yavanto vai deva ahutamadann | te para 'bhavann | ta etadagnihotragm
    sarvasyaiva samavadayajuhavuh | tasmadahuh | agnihotram njuhoti | ratriya eva taddhutadyaya || pratah
    | ahna eva taddhutadyaya | yajamanasya 'shnati | hutameva tat || dvayoh payasa juhuyat pashukamasya
    | etadva agnihotra mmithunam | ya evam ve~da | pra prajaya pashubhi || imameva purvaya duhe | amumuttaraya
    | adhishrityottarama nayati | yonaveva ta dretah sincati prajanane || ajyena juhuyat tejaskamasya
    | tejo va ajya m | tejasvyeva bhavati | payasa pashukamasya | etadvai pashunagm rupam | rupenaivasmai
    pashunava rundhe || || pashumaneva bhavati | daddhnendriya kamasya | indriyam vai~ dadhi | indriyavyeva
    bhavati | yavagva gramakamasyaushadha vai manushyah | bhagadheyenaivasmai sajatanava rundhe | gramyeva
    bhavati || ayajno va eshah | yosama || || caturunnayati | caturaksharagm rathantaram | rathantarasyaisha
    varnah | upariva harati | antariksham va~madevyam | vamadevyasyaisha varnah | dvirjuhoti | dvyakshara
    mbrihat | brihata esha varnah | agnihotrameva ta || yo va agnihotrasyopasado veda | upainamupasado
    namanti | vindata upasattara m | unniyopa sadayati | prithivimeva prinati | hoshyannupa sadayati |
    antarikshameva prinati | hutvopa sadayati | divameva prinati | eta va agnihotrasyopasadah || mupasado
    namanti | vindata upasattara m || yo va agnihotrasyashravita mpratyashravitagm hotara ve~da | tasya
    tveva hutam | prano va agnihotrasyashravitam | apanah pratyashravitam | mano hota rbrahma | nimesho
    vashatkarah || ve~da | tasya tveva hutam || sayam ya~vanashca vai devah prataryavanashca gnihotrino
    grihamagacchanti | tan 'sya pashubhirvi tishtherann | yattarpaye mprajaya pashubhistarpayeyuh || sajurdevai
    ya~vabhiriti sayagm sa mmrishati | sajurdevaih prataryavabhiriti pratah | ye caiva deva ya~vano ye
    ca prataryavanah || || tanevobhayag starpayati | ta ena ntriptah prajaya pashubhi starpayanti || aruno
    ha smahaupaveshih | agnihotra evahagm saya mbhratrivyebhyah pra harami | tasma nmatpapiyagmso bhratrivya
    iti | caturunnayati | dvirjuhoti | sami thsaptami | saptapada shakvari | shakvaro vajrah | agnihotra
    eva tathsaya ya~jamano bhratrivyaya pra harati | bhavatyatmana 'sya bhratrivyo bhavati || tyeta va
    agnihotrasyo pasado shca prataryavano homabhavapratikarashca prajapati tatman vanme jayeteti | so
    tman vadajayata | agni 'bruvann | prajapati vanme jayeteti | tasya vayamajanishmahi | jayata 'juhavuh
    | prananamagnih | tanuvai vayuh || || cakshusha adityah | teshagm hutadajayata gaureva || tasyai payasi
    vyayacchanta | mama hutadajani mameti | te prajapati mprashnamayann | sa adityo mabravit | yataro
    nau jaya t | tannau sahasaditi | kasyai ko 'haushiditi prajapati kasyai ka iti | prananamahamityagnih
    || || tanuva ahamiti vayuh | cakshusho 'hamityadityah | ya eva prananamahaushit | tasya hutadajaniti
    | agner hutadajaniti | tadagnihotrasya gnihotratvam | gaurva agnihotram | ya evam ve~da gauragnihotramiti
    | pranapanabhya mevagnigm samardhayati | avyardhukah pranapanabhya ve~da || tau vayurabravit | anu
    ma bhajatamiti | yadeva gar mabhyuddravan | tena tva mabhyuddravati | vayumeva tena prinati || prajapati
    ssrijamanah | agnimeva devatana || prajapatimabhi paryavartata | sa mrityo matmano niramimita | tagmhutva
    para mparyavartata | tato vai sa mrityumapajayat | apa mrityu vi~dushah | utaikahamuta dvyaha nna
    juhvati | hutamevasya bhavati | asau hyadityo ssarvadevatasambandhena prashamsa raudra mupasrishtam
    | ashvina nduhyamanam | saumya ndugdham | varunamadhishritam | vaishvadeva bhindavah | paushnamudantam
    | sarasvatam vi~shyandamanam | maitragm sharah | dhaturudvasitam | brihaspaterunnitam | savituh prakra
    ntam | dyavaprithivyagg hriyamanam | aindragna mupasannam | agneh purva ''hutih | prajapate ruttara
    | aindragm hutam || udvasitagm sapta ca 'gnihotrahotrashca dakshinata upa srijati | pitrilokameva
    tena jayati || pracimavartayati | devalokameva tena jayati | udicimavritya dogdhi | manushyalokameva
    tena jayati || purvau duhyajjyeshthasya jyaishthineyasya | yo va gatashri ssyat | aparau duhyat kanishthasya
    kanishthineyasya | yo va bubhushet || mmrishati | papavasyasasya vyavrittyai || vayavyam va~ etadupasrishtam
    | ashvina nduhyamanam | maitra ndugdham | aryamna udvasyamanam | tvashtra munniyamanam | brihaspate
    runnitam | savituh prakra ntam | dyavaprithivyagg hriyamanam || || aindragnamupa saditam | sarva njuhoti
    || yatha khalu vai dhenu ntirthe tarpayati | evamagnihotri yajamana ntarpayati | tripyati prajaya
    pashubhih | prasuvargam njanati | pashyati putram | pashyati pautra m | pra prajaya pashubhi njuhvati
    | ya u caina devam agnihotrasyasamsrishtahomamantrau trayo vai praiyamedha asann | tesha majuhot |
    dvirekah | sakridekah | tesham ya~strirajuhot | sa rica 'juhot | yo dvih | sa yajusha | ya ssakrit
    | sa tushnim || || yashca yajusha 'juhodyashca tushnim | tavubhava dyajusha ''hutih purva hotavya
    | tushnimuttara | ubhe evardhi avarundhe | agni njuhoti | reta eva ta ddadhati | suryo jyoti ssvaheti
    pratah | reta eva hita mpra janayati || reto va etasya hita gnihotramahutagm suryo dyante syat | unniya
    pramudadravet | sa upasadyatamito rasita | sa yada tamye ssvaheti juhuyat | prajapatirvai bhutah |
    tamevo ntata unnayati | nartimarcchati yajamanah || vahneravasthavisheshanusarena homah yadagni muddharati
    | vasavastar hyagnih | tasmin yasya tathavidhe juhvati | vasushvevasya mbhavati || nihito dhupayanchete
    | rudrastahyargnih | tasmin yasya tathavidhe juhvati | rudreshvevasya mbhavati || prathamamiddhmamarcira
    labhate | adityastar yasya tathavidhe juhvati | adityeshvevasya mbhavati || sarva eva sarvasha iddhma
    adi pto bhavati | vishve devastahyargnih | tasmin yasya tathavidhe juhvati | vishve shvevasya deveshvagnihotragm
    huta mbhavati || nitaramarcirupavaiti lohinikeva bhavati | indrastar hyagnih | tasmin yasya tathavidhe
    juhvati | indra evasya || angara bhavanti | tebhyo 'rcirudeti | prajapatistar hyagnih | tasmin yasya
    tathavidhe juhvati | prajapatavevasya 'ngara addhyuhante | brahma hyagnih | tasmin yasya tathavidhe
    juhvati | brahmannevasya mbhavati || vasushu rudreshvadityeshu vishveshu deveshu | indre prajapatau
    brahmann | aparivargamevasyaitasu devatasu huta njuhvati | ya u caina devam deveshu catvari ca nnihitah
    prathamagm sarva eva nitaramangara 'ngara brahmavasushvashtau ntva satyena parishincamiti saya mparishincati
    | satya ntvartena parishincamiti pratah | agnirva ritam | asavaditya ssatyam | agnimeva tadadityena
    saya mparishincati | agnina ''ditya mpratassah | yavadahoratre bhavatah | tavadasya lokasya | nartirna
    rishtih | nanto na paryanto njuhvati | ya u caina devam 'gnihotraprayana yajnah prajapatirakamayatatmanva
    ntva satyenaikadasha yo va agnihotrasyopasado || harih om || || krishna yajurvediya taittiriya brahmane
    dvitiyashtake prathamah prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे द्वितीयाष्टके प्रथमः प्रपाठकः अग्निहोत्रब्राह्मणम्
    ओ श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ अनुवाकं अग्निहोत्रस्योपोद्धातः अङ्गि॑रसो॒ वै स॒त्रमा॑सत । तेषा॒
    र्घर्म॒धुगा॑सीत् । सर्जी॒षेणा॑जीवत् । ते ऽब्रुवन्न् । कस्मै॒ नु स॒त्रमा ऽस्या ओष॑धी॒र्न ज॒नया॑म॒ इति॑
    । ते दि॒वो वृष्टि॑ स्स्तो॒का अ॒वाप॑द्यन्त । ताव॑ती॒रोष॑धयो ऽजायन्त ॥ ता जा॒ताः पि॒तरो॑ वि॒षेणा॑लिम्पन्न्
    ॥ ञ्ज॒ग्ध्वा रुप्य॒न्त्यैत् । ते ऽब्रुवन्न् । क इ॒दमि॒त्थ मि॒च्छमा॑ना॒ इति॑ पि॒तरो वोँ॑ भाग॒धेय॒मिति॑
    । अ॒ग्नि॒हो॒त्र ए॒व नो ब्रुवन्न् । तेभ्य॑ ए॒त म्प्राय॑च्छन्न् । यद्धु॒त्वा नि॒मार् ष्टि॑ । ततो॒ वै
    त ओष॑धीर ऽस्मा॒ ओष॑धयः । ते व॒थ्समु॒ म्प्रदा॑प॒येति॑ । सो वृँणै । दश॑ मा॒ रात्री न्न दो॑हन्न् । आ॒स॒ङ्ग॒व
    म्मा॒त्रा स॒ह च॑रा॒णीति॑ । तस्मा न्दश॒ रात्री॒र्न दु॑हन्ति । आ॒स॒ङ्ग॒व म्मा॒त्रा स॒ह चर॑ति । वारे॑वृत॒ग्ग्॒ह्य॑स्य
    । तस्मा द्व॒थ्सग्ं सग्ं॑सृष्टध॒यग्ं रु॒द्रो घातु॑कः । अति॒ हि स॒न्धा अग्निहोत्रनिरूपणम् प्र॒जाप॑ति
    म्प्र॒जा अन्व॑सृज्यन्त । तम॑भा॒ग उपा क्रामत् । तम॑व॒रुरु॑ न्नाश॑क्नोत् । स तपो॑ ऽतप्यत । सो रुपा॑रम॒ताता॑पि॒
    वै स्य प्र॒जाप॑ति॒रिति॑ । स र॒राटा॒दुद॑मृष्ट ॥ द्घृ॒तम॑भवत् । तस्मा॒द्यस्य॑ दक्षिण॒तः केशा॒ उन्मृ॑ष्टाः
    । ता ष्ठल॒क्ष्मी प्रा॑जाप॒त्येत्या॑हुः । य द्र॒राटा॑दु॒दमृ॑ष्ट । तस्मा द्र॒राटे॒ केशा॒ न स॑न्ति ।
    तद॒ग्नौ प्रागृ॑ह्णात् । तद्व्य॑चिकि॒थ्सत् । जु॒हवा॒नी द्वि॑चिकि॒थ्सायै॒ जन्म॑ ॥ य ए॒वं ॥ वसी॑य ए॒व
    चे॑तयते ॥ तं ऽब्रवीत् । कस्त्वम॒सीति॑ । स्वैव ते॒ वागित्य॑ब्रवीत् । सो॑ थ्स्वाहेति॑ । तथ्स्वा॑हाका॒रस्य॒
