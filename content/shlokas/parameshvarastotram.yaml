id: parameshvarastotram
category: stotram
name:
  english: parameshvarastotram
  devanagari: परमेश्वरस्तोत्रम्
content:
  english: parameshvarastotram jagadisha sudhisha bhavesha vibho paramesha paratpara puta pitah | pranatam
    patitam hatabuddhibalam janatarana taraya tapitakam || 1|| gunahinasudinamalinamatim tvayi patari
    datari caparatim | tamasa rajasavritavrittimimam janatarana taraya tapitakam || 2|| mama jivanaminamimam
    patitam marughorabhuviha suvihamaho | karunabdhicalomirjalanayanam janatarana taraya tapitakam ||
    3|| bhavavarana karana karmatatau bhavasindhujale shiva magnamatah | karunanca samarpya tarim tvaritam
    janatarana taraya tapitakam || 4|| atinashya janurmama punyaruce duritaughabharaih paripurnabhuvah
    | sujaghanyamaganyamapunyarucim janatarana taraya tapitakam || 5|| bhavakaraka narakaharaka he bhavataraka
    patakadaraka he | hara shankara kinkarakarmacayam janatarana taraya tapitakam || 6|| trishitancaramasmi
    sudham hita me
  devanagari: परमेश्वरस्तोत्रम् जगदीश सुधीश भवेश विभो परमेश परात्पर पूत पितः । प्रणतं पतितं हतबुद्धिबलं
    जनतारण तारय तापितकम् ॥ १॥ गुणहीनसुदीनमलीनमतिं त्वयि पातरि दातरि चापरतिम् । तमसा रजसावृतवृत्तिमिमं
    जनतारण तारय तापितकम् ॥ २॥ मम जीवनमीनमिमं पतितं मरुघोरभुवीह सुवीहमहो । करुणाब्धिचलोमिर्जलानयनं जनतारण
    तारय तापितकम् ॥ ३॥ भववारण कारण कर्मततौ भवसिन्धुजले शिव मग्नमतः । करुणाञ्च समर्प्य तरिं त्वरितं जनतारण
    तारय तापितकम् ॥ ४॥ अतिनाश्य जनुर्मम पुण्यरुचे दुरितौघभरैः परिपूर्णभुवः । सुजघण्यमगण्यमपुण्यरुचिं जनतारण
    तारय तापितकम् ॥ ५॥ भवकारक नारकहारक हे भवतारक पातकदारक हे । हर शङ्कर किङ्करकर्मचयं जनतारण तारय तापितकम्
    ॥ ६॥ तृषितञ्चरमस्मि सुधां हित मे
