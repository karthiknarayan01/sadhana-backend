id: devadibhihkritam5shivastotram
category: stotram
name:
  english: devadibhihkritam5shivastotram
  devanagari: देवादिभिःकृतं५शिवस्तोत्रम्
content:
  english: devadibhih kritam 5 shivastotram tushtava parameshanam baddhanjaliputah sthitah | dvaitibhuya
    jagatpati tasmai purnaya te namah || 124|| puratanaya punyaya purusharthapradayine | purantakaya bhutanam
    pataye sthanave namah || 125|| ekatah purushakaramekato mahilatmakam | prapancapitaram vande vande
    vishvaikamataram || 126|| kvacit karburavarnaya kvacit kunkumamurtaye | nilagrivaya devaya nishkalaya
    namo namah || 127|| tvamadau rajasa''vishtah sattvenasau jagatsthitih | tvamevante tu sarvatman tvamaham
    sharanam gatah || 128|| tvamahuh shrutayah satyamavyaktam vyaktameva ca | tasmattvam jagadadharam
    pranato'smi sadashivam || 129|| tattatkarmaphalapraptyai yadajnarudhamaulinah | brahmadyah sakala
    devastasmai purnatmane namah || 130|| namashshivaya shantaya namassomardhadharine | namassakalakalyanasaubhagyamarashakhine
    || 131|| shekharikritapiyushanidhaye nidhaye namah | yadekamamalam brahma nirgunam paramadbhutam ||
    132|| namah paraya sarvesham bhaskaraya namo namah | iti tamraparnimahatmye 43
  devanagari: देवादिभिः कृतं ५ शिवस्तोत्रम् तुष्टाव परमेशानं बद्धाञ्जलिपुटः स्थितः । द्वैतीभूय जगत्पाति
    तस्मै पूर्णाय ते नमः ॥ १२४॥ पुरातनाय पुण्याय पुरुषार्थप्रदायिने । पुरान्तकाय भूतानां पतये स्थाणवे
    नमः ॥ १२५॥ एकतः पुरुषाकारमेकतो महिलात्मकम् । प्रपञ्चपितरं वन्दे वन्दे विश्वैकमातरम् ॥ १२६॥ क्वचित्
    कर्बुरवर्णाय क्वचित् कुङ्कुममूर्तये । नीलग्रीवाय देवाय निष्कलाय नमो नमः ॥ १२७॥ त्वमादौ रजसाऽऽविष्टः
    सत्त्वेनासौ जगत्स्थितिः । त्वमेवान्ते तु सर्वात्मन् त्वामहं शरणं गतः ॥ १२८॥ त्वामाहुः श्रुतयः सत्यमव्यक्तं
    व्यक्तमेव च । तस्मात्त्वां जगदाधारं प्रणतोऽस्मि सदाशिवम् ॥ १२९॥ तत्तत्कर्मफलप्राप्त्यै यदाज्ञारूढमौलिनः
    । ब्रह्माद्याः सकला देवास्तस्मै पूर्णात्मने नमः ॥ १३०॥ नमश्शिवाय शान्ताय नमस्सोमार्धधारिणे । नमस्सकलकल्याणसौभाग्यामरशाखिने
    ॥ १३१॥ शेखरीकृतपीयूषनिधये निधये नमः । यदेकममलं ब्रह्म निर्गुणं परमाद्भुतम् ॥ १३२॥ नमः पराय सर्वेषां
    भास्कराय नमो नमः । इति ताम्रपर्णीमाहात्म्ये ४३
