id: nakhastutih
category: stotram
name:
  english: nakhastutih
  devanagari: नखस्तुतिः
content:
  english: nakhastutih shrimadanandatirthah nakhastutih vishnustotrani shrimadanandatirthah pantvasman
    puruhuta vairi balavan matanga madyadghata | kumbhoccadrivipatana'dhikapatu pratyeka vajrayitah |
    shrimatkanthiravasyapratatasunakhara daritara'tidura | praddhvasta dhvamta shamta pravitata manasa
    bhavita bhuribhagaih || 1|| lakshmikamtasamamtato'pikalayan naiveshituh te samam | pashyamyuttamavastu
    duratarato pastam raso yo'shtamah | yadroshotkara dakshanetrakutilah pramtotthita'gni sphurat | khadyotopamavisphulinga
    bhasita brahmeshashakrotkarah || 2|| iti shrimadanamdatirtha bhagavatpadacarya viracitam shri nrisimhanakhastutih
    sampurnam || bharatiramanamukhyapranamtargata shrikrishnarpanamastu ||
  devanagari: नखस्तुतिः श्रीमदानन्दतीर्थाः नखस्तुतिः विष्णुस्तोत्राणि श्रीमदानन्दतीर्थाः पान्त्वस्मान्
    पुरुहूत वैरि बलवन् मातङ्ग माद्यद्घटा । कुंभोच्चाद्रिविपाटनाऽधिकपटु प्रत्येक वज्रायिताः । श्रीमत्कण्ठीरवास्यप्रततसुनखरा
    दारिताराऽतिदूर । प्रद्ध्वस्त ध्वांत शांत प्रवितत मनसा भाविता भूरिभागैः ॥ १॥ लक्ष्मीकांतसमंततोऽपिकलयन्
    नैवेशितुः ते समम् । पश्याम्युत्तमवस्तु दूरतरतो पास्तं रसो योऽष्टमः । यद्रोशोत्कर दक्षनेत्रकुटिलः प्रांतोत्थिताऽग्नि
    स्फुरत् । खद्योतोपमविस्फुलिङ्ग भसिता ब्रह्मेशशक्रोत्कराः ॥ २॥ इति श्रीमदानंदतीर्थ भगवत्पादाचार्य विरचितं
    श्री नृसिंहनखस्तुतिः संपूर्णम् ॥ भारतीरमणमुख्यप्राणांतर्गत श्रीकृष्णार्पणमस्तु ॥
