id: ganesha-vajra-panjara-stotram
category: stotram
name:
  english: Ganesha Vajra Panjara Stotram
content:
  english: dhyanam | trinetram gajasyam caturbahudharam parashvadishastrairyutam bhalacandram | narakaradeham
    sada yogashantam ganesham bhaje sarvavandyam paresham || || bindurupo vakratundo rakshatu me hridi
    sthitah | dehamshcaturvidhamstattvamstattvadharah sanatanah || || dehamohayutam hyekadantah so'ham
    svarupadhrik | dehinam mam visheshena rakshatu bhramanashakah || || mahodarastatha devo nanabodhan
    pratapavan | sada rakshatu me bodhanandasamstho hyaharnisham || || sankhyan rakshatu sankhyesho gajananah
    susiddhidah | asatyeshu sthitam mam sa lambodarashca rakshatu || || satsu sthitam sumohena vikato
    mam paratparah | rakshatu bhaktavatsalyat sadaikamritadharakah || || anandeshu sthitam nityam mam
    rakshatu samatmakah | vighnarajo mahavighnairnanakhelakarah prabhuh || || avyakteshu sthitam nityam
    dhumravarnah svarupadhrik | mam rakshatu sukhakarah sahajah sarvapujitah || || svasamvedyeshu samstham
    mam ganeshah svasvarupadhrik | rakshatu yogabhavena samsthito bhavanayakah || || ayogeshu sthitam
    nityam mam rakshatu ganeshvarah | nivrittirupadhrik sakshadasamadhisukhe ratah || || yogashantidharo
    mam tu rakshatu yogasamsthitam | ganadhishah prasannatma siddhibuddhisamanvitah || || puro mam gajakarnashca
    rakshatu vighnaharakah | vahnyam yamyam ca nairrityam cintamanirvarapradah || || rakshatu pashcime
    dhundhirherambo vayudik sthitam | vinayakashcottare tu pramodashceshadik sthitam || || urdhvam siddhipatih
    patu buddhisho'dhah sthitam sada | sarvangeshu mayureshah patu mam bhaktilalasah || || yatra tatra
    sthitam mam tu sada rakshatu yogapah | purashupashasamyukto varadabhayadharakah || || idam ganapateh
    proktam vajrapanjarakam param | dharayasva mahadeva vijayi tvam bhavishyasi || || ya idam panjaram
    dhritva yatra kutra sthito bhavet | na tasya jayate kvapi bhayam nanasvabhavajam || || yah pathet
    panjaram nityam sa ipsitamavapnuyat | vajrasaratanurbhutva caretsarvatra manavah || || trikalam yah
    pathennityam sa ganesha ivaparah | nirvighnah sarvakaryeshu brahmabhuto bhavennarah || || yah shrinoti
    ganeshasya panjaram vajrasanjnakam | arogyadisamayukto bhavate ganapapriyah || || dhanam dhanyam pashun
    vidyamayushyam putrapautrakam | sarvasampatsamayuktamaishvaryam pathanallabhet || || na bhayam tasya
    vajrattu cakracchuladbhavet kada | shankaradermahadeva pathanadasya nityashah || || yam yam cintayate
    martyastam tam prapnoti shashvatam | pathanadasya vighnesha panjarasya nirantaram || || lakshavrittibhirevam
    sa siddhapanjarako bhavet | stambhayedapi suryam tu brahmandam vashamanayet || || evamuktva ganeshano'ntardadhe
    munisattama | shivo devadibhiryukto harshitah sambabhuva ha || || iti shrimanmudgale mahapurane dhumravarnacarite
    vajrapanjarakathanam nama trayovimsho'dhyayah |
  devanagari: ध्यानम् । त्रिनेत्रं गजास्यं चतुर्बाहुधारं परश्वादिशस्त्रैर्युतं भालचन्द्रम् । नराकारदेहं
    सदा योगशान्तं गणेशं भजे सर्ववन्द्यं परेशम् ॥ ॥ बिन्दुरूपो वक्रतुण्डो रक्षतु मे हृदि स्थितः । देहांश्चतुर्विधांस्तत्त्वांस्तत्त्वाधारः
    सनातनः ॥ ॥ देहमोहयुतं ह्येकदन्तः सोऽहं स्वरूपधृक् । देहिनं मां विशेषेण रक्षतु भ्रमनाशकः ॥ ॥ महोदरस्तथा
    देवो नानाबोधान् प्रतापवान् । सदा रक्षतु मे बोधानन्दसंस्थो ह्यहर्निशम् ॥ ॥ साङ्ख्यान् रक्षतु साङ्ख्येशो
    गजाननः सुसिद्धिदः । असत्येषु स्थितं मां स लम्बोदरश्च रक्षतु ॥ ॥ सत्सु स्थितं सुमोहेन विकटो मां परात्परः
    । रक्षतु भक्तवात्सल्यात् सदैकामृतधारकः ॥ ॥ आनन्देषु स्थितं नित्यं मां रक्षतु समात्मकः । विघ्नराजो
    महाविघ्नैर्नानाखेलकरः प्रभुः ॥ ॥ अव्यक्तेषु स्थितं नित्यं धूम्रवर्णः स्वरूपधृक् । मां रक्षतु सुखाकारः
    सहजः सर्वपूजितः ॥ ॥ स्वसंवेद्येषु संस्थं मां गणेशः स्वस्वरूपधृक् । रक्षतु योगभावेन संस्थितो भवनायकः
    ॥ ॥ अयोगेषु स्थितं नित्यं मां रक्षतु गणेश्वरः । निवृत्तिरूपधृक् साक्षादसमाधिसुखे रतः ॥ ॥ योगशान्तिधरो
    मां तु रक्षतु योगसंस्थितम् । गणाधीशः प्रसन्नात्मा सिद्धिबुद्धिसमन्वितः ॥ ॥ पुरो मां गजकर्णश्च रक्षतु
    विघ्नहारकः । वाह्न्यां याम्यां च नैरृत्यां चिन्तामणिर्वरप्रदः ॥ ॥ रक्षतु पश्चिमे ढुण्ढिर्हेरम्बो वायुदिक्
    स्थितम् । विनायकश्चोत्तरे तु प्रमोदश्चेशदिक् स्थितम् ॥ ॥ ऊर्ध्वं सिद्धिपतिः पातु बुद्धीशोऽधः स्थितं
    सदा । सर्वाङ्गेषु मयूरेशः पातु मां भक्तिलालसः ॥ ॥ यत्र तत्र स्थितं मां तु सदा रक्षतु योगपः । पुरशुपाशसंयुक्तो
    वरदाभयधारकः ॥ ॥ इदं गणपतेः प्रोक्तं वज्रपञ्जरकं परम् । धारयस्व महादेव विजयी त्वं भविष्यसि ॥ ॥ य इदं
    पञ्जरं धृत्वा यत्र कुत्र स्थितो भवेत् । न तस्य जायते क्वापि भयं नानास्वभावजम् ॥ ॥ यः पठेत् पञ्जरं
    नित्यं स ईप्सितमवाप्नुयात् । वज्रसारतनुर्भूत्वा चरेत्सर्वत्र मानवः ॥ ॥ त्रिकालं यः पठेन्नित्यं स गणेश
    इवापरः । निर्विघ्नः सर्वकार्येषु ब्रह्मभूतो भवेन्नरः ॥ ॥ यः शृणोति गणेशस्य पञ्जरं वज्रसञ्ज्ञकम् ।
    आरोग्यादिसमायुक्तो भवते गणपप्रियः ॥ ॥ धनं धान्यं पशून् विद्यामायुष्यं पुत्रपौत्रकम् । सर्वसम्पत्समायुक्तमैश्वर्यं
    पठनाल्लभेत् ॥ ॥ न भयं तस्य वज्रात्तु चक्राच्छूलाद्भवेत् कदा । शङ्करादेर्महादेव पठनादस्य नित्यशः ॥
    ॥ यं यं चिन्तयते मर्त्यस्तं तं प्राप्नोति शाश्वतम् । पठनादस्य विघ्नेश पञ्जरस्य निरन्तरम् ॥ ॥ लक्षावृत्तिभिरेवं
    स सिद्धपञ्जरको भवेत् । स्तम्भयेदपि सूर्यं तु ब्रह्माण्डं वशमानयेत् ॥ ॥ एवमुक्त्वा गणेशानोऽन्तर्दधे
    मुनिसत्तम । शिवो देवादिभिर्युक्तो हर्षितः सम्बभूव ह ॥ ॥ इति श्रीमन्मुद्गले महापुराणे धूम्रवर्णचरिते
    वज्रपञ्जरकथनं नाम त्रयोविंशोऽध्यायः ।
