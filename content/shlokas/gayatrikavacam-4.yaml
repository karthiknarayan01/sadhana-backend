id: gayatrikavacam-4
category: kavacha
name:
  english: gayatrikavacam 4
  devanagari: गायत्रीकवचम् ४
content:
  english: rinu | yasya vijnanamatrena trailokyam vashayetkshanat || 1|| savitri me shirah patu shikhayamamriteshvari
    | lalatam brahmadaivatya bhruvau me patu vaishnavi || 2|| karnau me patu rudrani surya savitrika'mbika
    | gayatri vadanam patu sharada dashanacchadau || 3|| dvijan yajnapriya patu rasanayam sarasvati |
    sankhyayani nasikam me kapolau candrahasini || 4|| cibukam vedagarbha ca kantham patvaghanashini |
    stanau me patu indrani hridayam brahmavadini || 5|| udaram vishvabhoktri ca nabhau patu surapriya
    | jaghanam narasimhi ca prishtham brahmandadharini || 6|| parshvau me patu padmakshi guhyam gogoptrika'vatu
    | urvoronkararupa ca janvoh sandhyatmikavatu || 7|| janghayoh patu akshobhya gulphayorbrahmashirshaka
    | surya padadvayam patu candra padangulishu ca || 8|| sarvangam vedajanani patu me sarvadanagha |
    ityetatkavacam brahman gayatryah sarvapavanam | punyam pavitram papaghnam sarvaroganivaranam || 9||
    trisandhyam yah pathedvidvan sarvan kamanavavapnuyat | sarvashastrarthatattavajnah sa bhavedvedavittamah
    || 10|| sarvayajnaphalam prapya brahmante samavapnuyat | prapnoti japamatrena purusharthamshcaturvidhan
    || 11|| iti shrivishvamitrasamhitoktam gayatrikavacam sampurnam ||
  devanagari: ृणु । यस्य विज्ञानमात्रेण त्रैलोक्यं वशयेत्क्षणात् ॥ १॥ सावित्री मे शिरः पातु शिखायाममृतेश्वरी
    । ललाटं ब्रह्मदैवत्या भ्रुवौ मे पातु वैष्णवी ॥ २॥ कर्णौ मे पातु रुद्राणी सूर्या सावित्रिकाऽम्बिका
    । गायत्री वदनं पातु शारदा दशनच्छदौ ॥ ३॥ द्विजान् यज्ञप्रिया पातु रसनायां सरस्वती । साङ्ख्यायनी नासिकां
    मे कपोलौ चन्द्रहासिनी ॥ ४॥ चिबुकं वेदगर्भा च कण्ठं पात्वघनाशिनी । स्तनौ मे पातु इन्द्राणी हृदयं ब्रह्मवादिनी
    ॥ ५॥ उदरं विश्वभोक्त्री च नाभौ पातु सुरप्रिया । जघनं नारसिंही च पृष्ठं ब्रह्माण्डधारिणी ॥ ६॥ पार्श्वौ
    मे पातु पद्माक्षी गुह्यं गोगोप्त्रिकाऽवतु । ऊर्वोरोङ्काररूपा च जान्वोः सन्ध्यात्मिकावतु ॥ ७॥ जङ्घयोः
    पातु अक्षोभ्या गुल्फयोर्ब्रह्मशीर्षका । सूर्या पदद्वयं पातु चन्द्रा पादाङ्गुलीषु च ॥ ८॥ सर्वाङ्गं
    वेदजननी पातु मे सर्वदानघा । इत्येतत्कवचं ब्रह्मन् गायत्र्याः सर्वपावनम् । पुण्यं पवित्रं पापघ्नं सर्वरोगनिवारणम्
    ॥ ९॥ त्रिसन्ध्यं यः पठेद्विद्वान् सर्वान् कामानववाप्नुयात् । सर्वशास्त्रार्थतत्तवज्ञः स भवेद्वेदवित्तमः
    ॥ १०॥ सर्वयज्ञफलं प्राप्य ब्रह्मान्ते समवाप्नुयात् । प्राप्नोति जपमात्रेण पुरुषार्थांश्चतुर्विधान्
    ॥ ११॥ इति श्रीविश्वामित्रसंहितोक्तं गायत्रीकवचं सम्पूर्णम् ॥
