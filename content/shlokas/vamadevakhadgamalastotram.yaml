id: vamadevakhadgamalastotram
category: stotram
name:
  english: vamadevakhadgamalastotram
  devanagari: वामदेवखड्गमालास्तोत्रम्
content:
  english: shivaikyasiddhyarthe jape viniyogah || dhyanam | shvetapadmasamasinam candrakotisamaprabham
    | vamadevam trinayanam varadabhayadayakam || vamankasamsthitam devim manonmanim manoharam | atha stotram
    | om manonmayi hridayadevi vame jyeshthe raudri kali kalavikarini balavikarini balapramathani sarvabhutadamani
    manonmani purvadalasamsthite agneyadalasamsthite dakshinadalasamsthite nairityadalasamsthite pashcimadalasamsthite
    vayavyadalasamsthite uttaradalasamsthite ishanadalasamsthite bindumadhyanivasini icchashakte jnanashakte
    kriyashakte shuddhavidyatattvasvarupini padmasanadhishthatri vamadevahridayeshvari pancabrahmamaye
    paramashivavamankanilaye sarvavaranasamrakshini sarvasiddhiprade sarvamangalakarini sarvabhutavashankari
    sarvaduhkhavinashini sarvanandamaye shivashaktyaikyarupini shrimanonmanyamba sahita shrivamadevasvarupini
    namaste namaste namaste namah || iti shrivamadevakhadgamala sampurna ||
  devanagari: शिवैक्यसिद्ध्यर्थे जपे विनियोगः ॥ ध्यानम् । श्वेतपद्मसमासीनं चन्द्रकोटिसमप्रभम् । वामदेवं
    त्रिनयनं वरदाभयदायकम् ॥ वामाङ्कसंस्थितां देवीं मनोन्मनीं मनोहराम् । अथ स्तोत्रम् । ॐ मनोन्मयि हृदयदेवि
    वामे ज्येष्ठे रौद्रि कालि कालविकारिणि बलविकारिणि बलप्रमथनि सर्वभूतदमनि मनोन्मनि पूर्वदलसंस्थिते आग्नेयदलसंस्थिते
    दक्षिणदलसंस्थिते नैऋत्यदलसंस्थिते पश्चिमदलसंस्थिते वायव्यदलसंस्थिते उत्तरदलसंस्थिते ईशानदलसंस्थिते
    बिन्दुमध्यनिवासिनि इच्छाशक्ते ज्ञानशक्ते क्रियाशक्ते शुद्धविद्यातत्त्वस्वरूपिणि पद्मासनाधिष्ठात्रि
    वामदेवहृदयेश्वरि पञ्चब्रह्ममये परमशिववामाङ्कनिलये सर्वावरणसंरक्षिणि सर्वसिद्धिप्रदे सर्वमङ्गलकारिणि
    सर्वभूतवशङ्करि सर्वदुःखविनाशिनि सर्वानन्दमये शिवशक्त्यैक्यरूपिणि श्रीमनोन्मन्यम्बा सहित श्रीवामदेवस्वरूपिणि
    नमस्ते नमस्ते नमस्ते नमः ॥ इति श्रीवामदेवखड्गमाला सम्पूर्णा ॥
