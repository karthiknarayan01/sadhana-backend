id: paramahayonikavacasadhana
category: kavacha
name:
  english: paramahayonikavacasadhana
  devanagari: परामहायोनिकवचसाधना
content:
  english: shivah rishih | mahati jagatih chandah | shri cicchaktih devata | aim vijam | hrim shaktih
    | sakalahrim kilakam | para
  devanagari: शिवः ऋषिः । महती जगतीः छन्दः । श्री चिच्छक्तिः देवता । ऐं वीजम् । ह्रीं शक्तिः । सकलह्रीं
    कीलकम् । पर
meaning: {}
source_attribution:
  text_source: sanskritdocuments.org — https://sanskritdocuments.org/doc_devii/parAmahAyonikavachasAdhanA.html
