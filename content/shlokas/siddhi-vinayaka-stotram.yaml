id: siddhi-vinayaka-stotram
category: stotram
name:
  english: Siddhi Vinayaka Stotram
content:
  english: vighnesha vighnacayakhandananamadheya shrishankaratmaja suradhipavandyapada | durgamahavrataphalakhilamangalatman
    vighnam mamapahara siddhivinayaka tvam || || satpadmaragamanivarnasharirakantih shrisiddhibuddhiparicarcitakunkumashrih
    | vakshahsthale valayitatimanojnashundo vighnam mamapahara siddhivinayaka tvam || || pashankushabjaparashumshca
    dadhaccaturbhi rdorbhishca shonakusumasragumangajatah | sindurashobhitalalatavidhuprakasho vighnam
    mamapahara siddhivinayaka tvam || || karyeshu vighnacayabhitavirincamukhyaih sampujitah suravarairapi
    modakadyaih | sarveshu ca prathamameva sureshu pujyo vighnam mamapahara siddhivinayaka tvam || ||
    shighrancanaskhalanatungaravordhvakantha sthulendurudraganahasitadevasanghah | shurpashrutishca prithuvartulatungatundo
    vighnam mamapahara siddhivinayaka tvam || || yajnopavitapadalambhitanagaraja masadipunyadadrishikritriksharajah
    | bhaktabhayaprada dayalaya vighnaraja vighnam mamapahara siddhivinayaka tvam || || sadratnasaratatirajitasatkiritah
    kausumbhacaruvasanadvaya urjitashrih | sarvatramangalakarasmaranapratapo vighnam mamapahara siddhivinayaka
    tvam || || devantakadyasurabhitasurartiharta vijnanabodhanavarena tamo'paharta | ananditatribhuvanesha
    kumarabandho vighnam mamapahara siddhivinayaka tvam || || iti shrimudgalapurane shrisiddhivinayaka
    stotram sampurnam |
  devanagari: विघ्नेश विघ्नचयखण्डननामधेय श्रीशङ्करात्मज सुराधिपवन्द्यपाद । दुर्गामहाव्रतफलाखिलमङ्गलात्मन्
    विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ ॥ सत्पद्मरागमणिवर्णशरीरकान्तिः श्रीसिद्धिबुद्धिपरिचर्चितकुङ्कुमश्रीः
    । वक्षःस्थले वलयितातिमनोज्ञशुण्डो विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ ॥ पाशाङ्कुशाब्जपरशूंश्च दधच्चतुर्भि
    र्दोर्भिश्च शोणकुसुमस्रगुमाङ्गजातः । सिन्दूरशोभितललाटविधुप्रकाशो विघ्नं ममापहर सिद्धिविनायक त्वम्
    ॥ ॥ कार्येषु विघ्नचयभीतविरिञ्चमुख्यैः सम्पूजितः सुरवरैरपि मोदकाद्यैः । सर्वेषु च प्रथममेव सुरेषु पूज्यो
    विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ ॥ शीघ्राञ्चनस्खलनतुङ्गरवोर्ध्वकण्ठ स्थूलेन्दुरुद्रगणहासितदेवसङ्घः
    । शूर्पश्रुतिश्च पृथुवर्तुलतुङ्गतुन्दो विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ ॥ यज्ञोपवीतपदलम्भितनागराज
    मासादिपुण्यददृशीकृतृक्षराजः । भक्ताभयप्रद दयालय विघ्नराज विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ ॥ सद्रत्नसारततिराजितसत्किरीटः
    कौसुम्भचारुवसनद्वय ऊर्जितश्रीः । सर्वत्रमङ्गलकरस्मरणप्रतापो विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ ॥ देवान्तकाद्यसुरभीतसुरार्तिहर्ता
    विज्ञानबोधनवरेण तमोऽपहर्ता । आनन्दितत्रिभुवनेश कुमारबन्धो विघ्नं ममापहर सिद्धिविनायक त्वम् ॥ ॥ इति
    श्रीमुद्गलपुराणे श्रीसिद्धिविनायक स्तोत्रं सम्पूर्णम् ।
