    कृत्त्यधीवा॒से चाश्व॒ग्ं॒ सञ्ज्ञ॑पयन्ति । ए॒तद्वै प॑शू॒नाग्ं रू॒पम् । रू॒पेणै॒व प॒शूनव॑रुन्धे ॥ हि॒र॒ण्य॒क॒शि॒पु
    भ॑वति । तेज॒सो ॥ रु॒क्मो भ॑वति । सु॒व॒र्गस्य॑ लो॒कस्या नु॑ख्यात्यै ॥ अश्वो॑ भवति । प्र॒जाप॑ते॒ ॥ अ॒स्य
    वै लो॒कस्य॑ रू॒प न्ता॒र्प्यम् । अ॒न्तरि॑क्षस्य कृत्त्यधीवा॒सः । दि॒वो हि॑रण्यकशि॒पु । आ॒दि॒त्यस्य॑
    रु॒क्मः । प्र॒जाप॑ते॒रश्वः॑ । इ॒ममे॒व लो॒क ङ्कृत्यधीवा॒सेन॑ । दिवग्ं॑ हिरण्यकशि॒पुना । आ॒दि॒त्यग्ं
    रु॒क्मेण॑ । अश्वे॑नै॒व मेद्ध्ये॑न प्र॒जाप॑ते॒ स्सायु॑ज्यग्ं सलो॒कता॑ माप्नोति ॥ ए॒तासा॑मे॒व दे॒वता॑ना॒ग्ं॒
    सायु॑ज्यम् । सा॒र् ष्टिताग्ं॑ समान लो॒कता॑माप्नोति । यो ऽश्वमे॒धेन॒ यज॑ते । य उ॑ चैनमे॒वं उत्तरवेद्युपवापः
    आ॒दि॒त्याश्चाङ्गि॑रसश्च सुव॒र्गे लो॒के ऽङ्गि॑रस आदि॒त्येभ्यः॑ । अ॒मुमा॑दि॒त्य ऽभू॒दिति॑ । तस्मा॒दश्व॒ग्ं॒
    सव॒र्येत्या द्य॒ज्ञे वरो॑ दीयते ॥ यत्प्र॒जाप॑ति॒ ऽभ॑वत् । तस्मा॒दश्वो॒ नाम॑ ॥ त् । तस्मा॒दर्वा॒ नाम॑
    ॥ यथ्स॒द्यो वाजा न्थ्स॒मज॑यत् । तस्मा द्वा॒जी नाम॑ ॥ यदसु॑राणां लोँ॒कानाद॑त्त । तस्मा॑दादि॒त्यो नाम॑
    ॥ अ॒ग्निर्वा अ॑श्वमे॒धस्य॒ योनि॑रा॒यत॑नम् । सूर्यो॒ रा॒यत॑नम् । यद॑श्वमे॒धे ऽग्नौ चित्य॑ उत्तरवे॒दि
    वेँद॑ ॥ प्रा॒णा॒पा॒नौ वा ए॒तौ दे॒वाना म् । यद॑र्काश्वमे॒धौ । प्रा॒णा॒पा॒नावे॒वाव॑रुन्धे ॥ ओजो॒ बलं॒
    म् । यद॑र्काश्वमे॒धौ । ओजो॒ बल॑मे॒वाव॑रुन्धे ॥ अ॒ग्निर्वा अ॑श्वमे॒धस्य॒ योनि॑ रा॒यत॑नम् । यद॑श्वमे॒धे
    ऽग्नौ चित्य॑ उत्तरवे॒दि ञ्चि॒नोति॑ । ताव॑र्काश्वमे॒धौ । अ॒र्का॒श्व॒मे॒धावे॒वा व॑रुन्धे । अथो॑ अर्काश्व
    मे॒धयो॑रे॒व प्रति॑तिष्ठति ॥ ऋषभालम्भः प्र॒जाप॑तिं॒ म्मेधा॒याल॑भन्त । तमा॒लभ्योपा॑वसन्न् । प्रा॒तर्यष्टा
    वाँ ए॒तद्दे॒वाना॒महः॑ । यथ्सं॑ वँथ्स॒रः । तस्मा॒दश्वः॑ पु॒रस्ता वँथ्स॒र आल॑भ्यते ॥ यत्प्र॒जाप॑ति॒
    ऽभ॑वत् । तस्मा॒दश्वः॑ । यथ्स॒द्यो मेधो ॥ तस्मा॑दश्वमे॒धः ॥ वेदु॒को वेँद॑ ॥ यद्वै तत्प्र॒जाप॑ति॒ ऽभ॑वत्
    । तस्मा॒दश्वः॑ प्र॒जाप॑तेः पशू॒ना ऽस्य॑ पु॒त्रः प्रति॑रूपो जायते । य ए॒वं वेँद॑ ॥ सर्वा॑णि भू॒तानि॑
    स॒भृन्त्याल॑भते । समे॑न स्तेज॑से ब्रह्मवर्च॒साय॑ भरन्ति । यो वेँद॑ ॥ ए॒तद्वै तद्दे॒वा ए॒ता म्मेधा॒याल॑भन्त
    । य॒ज्ञम॒व । य॒ज्ञेन॑ य॒ज्ञम॑यजन्त दे॒वाः । का॒म॒प्रं यँ॒ज्ञम॑ कुर्वत । ते॑ ऽमृत॒त्वम॑कामयन्त । त॑
    ऽश्वमे॒धेन॒ यज॑ते । दे॒वाना॑मे॒वा ॥ प्रा॒जा॒प॒त्येनै॒व य॒ज्ञेन॑ यजते काम॒प्रेण॑ । अपु॑नर्मारमे॒व ग॑च्छति
    ॥ ए॒तस्य॒ वै रू॒पेण॑ पु॒रस्ता भ्यः । सर्व॒स्याप्त्यै ऽश्वमे॒धेन॒ यज॑ते । य उ॑ चैनमे॒वं अश्वावयवेषूपासनम्
    यो वा अश्व॑स्य॒ मेद्ध्य॑स्य॒ लोम॑नी॒ वेद॑ । अश्व॑स्यै॒व मेद्ध्य॑स्य॒ लोमं॑ लोँमञ्जुहोति । अ॒हो॒रा॒त्रे
    वा अश्व॑स्य॒ मेद्ध्य॑स्य॒ लोम॑नी । यथ्सा॒य म्प्रा॑तर्जु॒होति॑ । अश्व॑स्यै॒व मेद्ध्य॑स्य॒ लोमं॑ लोँमञ्जुहोति
    । ए॒तद॑नुकृति हस्म॒ वै पु॒रा । अश्व॑स्य॒ मेद्ध्य॑स्य॒ लोमं॑ लोँमञ्जुह्वति ॥ यो वा अश्व॑स्य॒ मेद्ध्य॑स्य
    प॒दे वेद॑ । अश्व॑स्यै॒व मेद्ध्य॑स्य प॒दे प॑दे जुहोति । द॒र्॒श॒पू॒र्ण॒मा॒सौ वा अश्व॑स्य॒ मेद्ध्य॑स्य
    प॒दे ॥ शपूर्णमा॒सौ यज॑ते । अश्व॑स्यै॒व मेद्ध्य॑स्य प॒दे प॑दे जुहोति । ए॒तद॑नुकृति ह स्म॒ वै पु॒रा
    । अश्व॑स्य॒ मेद्ध्य॑स्य प॒दे प॑दे जुह्वति ॥ यो वा अश्व॑स्य॒ मेद्ध्य॑स्य वि॒वर्त॑नं॒ वेँद॑ । अश्व॑स्यै॒व
    मेद्ध्य॑स्य वि॒वर्त॑ने विवर्तने जुहोति । अ॒सौ वा आ॑दि॒त्यो ऽश्वः॑ । स आ॑हव॒नीय॒ माग॑च्छति । तद्विव॑र्तते
    । यद॑ग्निहो॒त्र ञ्जु॒होति॑ । अश्व॑स्यै॒व मेद्ध्य॑स्य वि॒वर्त॑ने विवर्तने जुहोति । ए॒तद॑नुकृति ह स्म॒
    वै पु॒रा । अश्व॑स्य॒ मेद्ध्य॑स्य वि॒वर्त॑ने विवर्तने जुह्वति ॥ ञ्जु॒होति॒ त्रीणि॑ च प्र॒जाप॑ति॒स्तम॑ष्टाद॒शिभिः॑
    प्र॒जाप॑तिरकामयतो॒भा अप॒ श्रीरू॒द्र्ध्वम् प्र॒जाप॑तिरकामयत म॒हान् ँयो वा अश्व॑स्य॒ मेद्ध्य॑स्य॒ लोम॑नी॒
    त्रयो॑विग्ंशतिः प्र॒जाप॑तिरकामयत म॒हान् प्र वा ए॒ष ए॒भ्यो लो॒केभ्यः॒ सर्वग्ं॑ ह॒ वै तत्र॒ पय॑स्व॒द्य
    वेँद॑ च॒त्वार्यशी॑तिः ॥ हरिः ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे तृतीयाष्टके नवमः प्रपाठक
