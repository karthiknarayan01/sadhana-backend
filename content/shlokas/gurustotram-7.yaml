name:
  english: gurustotram 7
  devanagari: गुरुस्तोत्रम् ७
content:
  english: gurustotram 7 sanatkumara uvaca | athasamavritisthanam shaktinam samayena ca | namnam sahasram
    vakshyami gurudhyanapurahsaram || 89
  devanagari: गुरुस्तोत्रम् ७ सनत्कुमार उवाच । अथासामावृतिस्थानां शक्तीनां समयेन च । नाम्नां सहस्रं वक्ष्यामि
    गुरुध्यानपुरःसरम् ॥ ८९
