id: yamuna-ashtakam
category: stotram
name:
  english: Yamuna Ashtakam
  devanagari: यमुनाष्टकम् १० (रूपगोस्वामिविरचितं भ्रातुरन्तकस्य)
content:
  english: bhraturantakasya pattane'bhipattiharini prekshayatipapino'pi papasindhutarini | niramadhuribhirapyasheshacittabandhini
    mam punatu sarvadaravindabandhunandini || 1|| harivaridharayabhimanditorukhandava pundarikamandalodyadandajalitandava
    | snanakamapamarograpapasampadandhini mam punatu sarvadaravindabandhunandini || 2|| shikarabhimrishtajantudurvipakamardini
    nandanandanantarangabhaktipuravardhini | tirasangamabhilashimangalanubandhini mam punatu sarvadaravindabandhunandini
    || 3|| dvipacakravalajushtasaptasindhubhedini shrimukundanirmitorudivyakelivedini | kantikandalibhirindranilavrindanindini
    mam punatu sarvadaravindabandhunandini || 4|| mathurena mandalena carunabhimandita premanaddhavaishnavadhvavardhanaya
    pandita | urmidorvilasapadmanabhapadavandini mam punatu sarvadaravindabandhunandini || 5|| ramyatirarambhamanagokadambabhushita
    divyagandhabhakkadambapushparajirushita | nandasunubhaktasanghasangamabhinandini mam punatu sarvadaravindabandhunandini
    || 6|| phullapakshamallikakshahamsalakshakujita bhaktividdhadevasiddhakinnaralipujita | tiragandhavahagandhajanmabandharandhini
    mam punatu sarvadaravindabandhunandini || 7|| cidvilasavaripurabhurbhuvahsvarapini kirtitapi durmadorupapamarmatapini
    | ballavendranandanangaragabhangagandhini mam punatu sarvadaravindabandhunandini || 8|| tushtabuddhirashtakena
    nirmalormiceshtitam tvamanena bhanuputri! sarvadevaveshtitam | yahstaviti vardhayasva sarvapapamocane
    bhaktipuramasya devi! pundarikalocane || 9|| iti shrirupagosvamiviracitastavamalayam shriyamunashtakam
    sampurnam |
  devanagari: भ्रातुरन्तकस्य पत्तनेऽभिपत्तिहारिणी प्रेक्षयातिपापिनोऽपि पापसिन्धुतारिणी । नीरमाधुरीभिरप्यशेषचित्तबन्धिनी
    मां पुनातु सर्वदारविन्दबन्धुनन्दिनी ॥ १॥ हारिवारिधारयाभिमण्डितोरुखाण्डवा पुण्डरीकमण्डलोद्यदण्डजालिताण्डवा
    । स्नानकामपामरोग्रपापसम्पदन्धिनी मां पुनातु सर्वदारविन्दबन्धुनन्दिनी ॥ २॥ शीकराभिमृष्टजन्तुदुर्विपाकमर्दिनी
    नन्दनन्दनान्तरङ्गभक्तिपूरवर्धिनी । तीरसङ्गमाभिलाषिमङ्गलानुबन्धिनी मां पुनातु सर्वदारविन्दबन्धुनन्दिनी
    ॥ ३॥ द्वीपचक्रवालजुष्टसप्तसिन्धुभेदिनी श्रीमुकुन्दनिर्मितोरुदिव्यकेलिवेदिनी । कान्तिकन्दलीभिरिन्द्रनीलवृन्दनिन्दिनी
    मां पुनातु सर्वदारविन्दबन्धुनन्दिनी ॥ ४॥ माथुरेण मण्डलेन चारुणाभिमण्डिता प्रेमनद्धवैष्णवाध्ववर्धनाय
    पण्डिता । ऊर्मिदोर्विलासपद्मनाभपादवन्दिनी मां पुनातु सर्वदारविन्दबन्धुनन्दिनी ॥ ५॥ रम्यतीररम्भमाणगोकदम्बभूषिता
    दिव्यगन्धभाक्कदम्बपुष्पराजिरूषिता । नन्दसूनुभक्तसङ्घसङ्गमाभिनन्दिनी मां पुनातु सर्वदारविन्दबन्धुनन्दिनी
    ॥ ६॥ फुल्लपक्षमल्लिकाक्षहंसलक्षकूजिता भक्तिविद्धदेवसिद्धकिन्नरालिपूजिता । तीरगन्धवाहगन्धजन्मबन्धरन्धिनी
    मां पुनातु सर्वदारविन्दबन्धुनन्दिनी ॥ ७॥ चिद्विलासवारिपूरभूर्भुवःस्वरापिनी कीर्तितापि दुर्मदोरुपापमर्मतापिनी
    । बल्लवेन्द्रनन्दनाङ्गरागभङ्गगन्धिनी मां पुनातु सर्वदारविन्दबन्धुनन्दिनी ॥ ८॥ तुष्टबुद्धिरष्टकेन निर्मलोर्मिचेष्टितां
    त्वामनेन भानुपुत्रि! सर्वदेववेष्टिताम् । यःस्तवीति वर्धयस्व सर्वपापमोचने भक्तिपूरमस्य देवि! पुण्डरीकलोचने
    ॥ ९॥ इति श्रीरूपगोस्वामिविरचितस्तवमालायां श्रीयमुनाष्टकं सम्पूर्णम् ।
