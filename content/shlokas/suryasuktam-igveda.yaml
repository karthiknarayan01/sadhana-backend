id: suryasuktam-igveda
category: sukta
name:
  english: suryasuktamṟigveda
  devanagari: सूर्यसूक्तम्ऱिग्वेद
content:
  english: 03 tatsurya̭sya deva̱tvam tanma̭hi̱tvam ma̱dhya karto̱rvita̭ta̱m sam ja̭bhara | ya̱dedayṷkta
    ha̱rita̭h sa̱dhastha̱dadratri̱ vasa̭stanute si̱masmai
  devanagari: ०३ तत्सूर्य॑स्य देव॒त्वं तन्म॑हि॒त्वं म॒ध्या कर्तो॒र्वित॑तं॒ सं ज॑भार । य॒देदयु॑क्त ह॒रितः॑
    स॒धस्था॒दाद्रात्री॒ वास॑स्तनुते सि॒मस्मै
meaning: {}
