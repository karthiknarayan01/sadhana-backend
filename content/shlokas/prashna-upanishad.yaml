id: prashna-upanishad
category: upanishad
name:
  english: prashna upanishad
  devanagari: प्रश्न उपनिषद्
content:
  english: om sukesha ca bharadvajah shaibyashca satyakamah sauryayani ca gargyah kausalyashcashvalayano
    bhargavo vaidarbhih kabandhi katyayanaste haite brahmapara brahmanishthah param brahmanveshamana esha
    ha vai tatsarvam vakshyatiti te ha samitpanayo bhagavantam pippaladamupasannah || 1 || tan ha sa rishiruvaca
    bhuya eva tapasa brahmacaryena shraddhaya samvatsaram samvatsyatha yathakamam prashnan pricchata yadi
    vijnasyamah sarvam ha vo vakshyama iti || 2 || atha kabandhi katyayana upetya papraccha | bhagavan
    kute ha va imah prajah prajayanta iti || 3 || tasmai sa hovaca prajakamo vai prajapatih sa tapo'tapyata
    sa tapastaptva sa mithunamutpadayate | rayim ca pranam cetyetau me bahudha prajah karishyata iti ||
    4 || adityo ha vai prano rayireva candrama rayirva etat sarvam yanmurtam camurtam ca tasmanmurtireva
    rayih || 5 || athaditya udayanyatpracim disham pravishati tena pracyan pranan rashmishu sannidhatte
    | yaddakshinam yat praticim yadudicim yadadho yadurdhvam yadantara disho yat sarvam prakashayati tena
    sarvan pranan rashmishu sannidhatte || 6 || sa esha vaishvanaro vishvarupah prano'gnirudayate | tadetadrica'bhyuktam
    || 7 || vishvarupam harinam jatavedasam parayanam jyotirekam tapantam | sahasrarashmih shatadha vartamanah
    pranah prajanamudayatyesha suryah || 8 || samvatsaro vai prajapatistasyayane dakshinam cottaram ca
    | tadye ha vai tadishtapurte kritamityupasate te candramasameva lokamabhijayante | ta eva punaravartante
    tasmadeta rishayah prajakama dakshinam pratipadyante | esha ha vai rayiryah pitriyanah || 9 || athottarena
    tapasa brahmacaryena shraddhaya vidyaya''tmanamanvishyadityamabhijayante | etadvai prananamayatanametadamritamabhayametat
    parayanametasmanna punaravartanta ityesha nirodhastadesha shlokah || 10 || pancapadam pitaram dvadashakritim
    diva ahuh pare ardhe purishinam | atheme anya u pare vicakshanam saptacakre shadara ahurarpitamiti
    || 11 || maso vai prajapatistasya krishnapaksha eva rayih shuklah pranastasmadeta rishayah shukla
    ishtam kurvantitara itarasmin || 12 || ahoratro vai prajapatistasyahareva prano ratrireva rayih pranam
    va ete praskandanti ye diva ratya samyujyante brahmacaryameva tadyadratrau ratya samyujyante || 13
    || annam vai prajapatistato ha vai tadretastasmadimah prajah prajayanta iti || 14 || tadye ha vai
    tat prajapativratam caranti te mithunamutpadayante | teshamevaisha brahmaloko yesham tapo brahmacaryam
    yeshu satyam pratishtitam || 15 || teshamasau virajo brahmaloko na yeshu jihmamanritam na maya ceti
    || 16 || iti prashnopanishadi prathamah prashnah || atha hainam bhargavo vaidarbhih papraccha | bhagavan
    katyeva devah pracam didharayante katara etat prakashayante kah punaresham varishtha iti || 1 || tasmai
    sa hovacakasho ha va esha devo vayuragnirapah prithivi vanmanashcakshuh shrotram ca | te prakashyabhivadanti
    vayametadbanamavashtabhya vidharayamah || 2 || tan varishthah prana uvaca | ma mohamapadyatha ahamevaitat
    pancadha''tmanam pravibhajyaitadbanamavashtabhya vidharayamiti te'shraddadhana babhuvuh || 3 || so'bhimanadurdhvamutkramata
    iva tasminnutkramatyathetare sarva evotkramante tasmi
  devanagari: ॐ सुकेशा च भारद्वाजः शैब्यश्च सत्यकामः सौर्यायणी च गार्ग्यः कौसल्यश्चाश्वलायनो भार्गवो वैदर्भिः
    कबन्धी कात्यायनस्ते हैते ब्रह्मपरा ब्रह्मनिष्ठाः परं ब्रह्मान्वेषमाणा एष ह वै तत्सर्वं वक्ष्यतीति
    ते ह समित्पाणयो भगवन्तं पिप्पलादमुपसन्नाः ॥ १ ॥ तन् ह स ऋषिरुवच भूय एव तपसा ब्रह्मचर्येण श्रद्धया
    संवत्सरं संवत्स्यथ यथाकामं प्रश्नान् पृच्छत यदि विज्ञास्यामः सर्वं ह वो वक्ष्याम इति ॥ २ ॥ अथ कबन्धी
    कत्यायन उपेत्य पप्रच्छ । भगवन् कुते ह वा इमाः प्रजाः प्रजायन्त इति ॥ ३ ॥ तस्मै स होवाच प्रजाकामो वै
    प्रजापतिः स तपोऽतप्यत स तपस्तप्त्वा स मिथुनमुत्पादयते । रयिं च प्रणं चेत्येतौ मे बहुधा प्रजाः करिष्यत
    इति ॥ ४ ॥ आदित्यो ह वै प्राणो रयिरेव चन्द्रमा रयिर्वा एतत् सर्वं यन्मूर्तं चामूर्तं च तस्मान्मूर्तिरेव
    रयिः ॥ ५ ॥ अथादित्य उदयन्यत्प्राचीं दिशं प्रविशति तेन प्राच्यान् प्राणान् रश्मिषु सन्निधत्ते । यद्दक्षिणां
    यत् प्रतीचीं यदुदीचीं यदधो यदूर्ध्वं यदन्तरा दिशो यत् सर्वं प्रकाशयति तेन सर्वान् प्राणान् रश्मिषु
    सन्निधत्ते ॥ ६ ॥ स एष वैश्वानरो विश्वरुपः प्राणोऽग्निरुदयते । तदेतदृचाऽभ्युक्तम् ॥ ७ ॥ विश्वरूपं हरिणं
    जातवेदसं परायणं ज्योतिरेकं तपन्तम् । सहस्ररश्मिः शतधा वर्तमानः प्राणः प्रजानामुदयत्येष सूर्यः ॥ ८
    ॥ संवत्सरो वै प्रजापतिस्तस्यायने दक्षिणं चोत्तरं च । तद्ये ह वै तदिष्टापूर्ते कृतमित्युपासते ते चान्द्रमसमेव
    लोकमभिजयन्ते । त एव पुनरावर्तन्ते तस्मादेत ऋषयः प्रजाकामा दक्षिणं प्रतिपद्यन्ते । एष ह वै रयिर्यः
    पितृयाणः ॥ ९ ॥ अथोत्तरेण तपसा ब्रह्मचर्येण श्रद्धया विद्ययाऽऽत्मानमन्विष्यादित्यमभिजयन्ते । एतद्वै
    प्राणानामायतनमेतदमृतमभयमेतत् परायणमेतस्मान्न पुनरावर्तन्त इत्येष निरोधस्तदेष श्लोकः ॥ १० ॥ पञ्चपादं
    पितरं द्वादशाकृतिं दिव आहुः परे अर्धे पुरीषिणम् । अथेमे अन्य उ परे विचक्षणं सप्तचक्रे षडर आहुरर्पितमिति
    ॥ ११ ॥ मासो वै प्रजापतिस्तस्य कृष्णपक्ष एव रयिः शुक्लः प्रणस्तस्मादेत ऋषयः शुक्ल इष्टं कुर्वन्तीतर
    इतरस्मिन् ॥ १२ ॥ अहोरात्रो वै प्रजापतिस्तस्याहरेव प्राणो रात्रिरेव रयिः प्राणं वा एते प्रस्कन्दन्ति
    ये दिवा रत्या संयुज्यन्ते ब्रह्मचर्यमेव तद्यद्रात्रौ रत्या संयुज्यन्ते ॥ १३ ॥ अन्नं वै प्रजापतिस्ततो
    ह वै तद्रेतस्तस्मादिमाः प्रजाः प्रजायन्त इति ॥ १४ ॥ तद्ये ह वै तत् प्रजापतिव्रतं चरन्ति ते मिथुनमुत्पादयन्ते
    । तेषामेवैष ब्रह्मलोको येषां तपो ब्रह्मचर्यं येषु सत्यं प्रतिष्टितम् ॥ १५ ॥ तेषामसौ विरजो ब्रह्मलोको
    न येषु जिह्ममनृतं न माया चेति ॥ १६ ॥ इति प्रश्नोपनिषदि प्रथमः प्रश्नः ॥ अथ हैनं भार्गवो वैदर्भिः पप्रच्छ
    । भगवन् कत्येव देवाः प्रचां दिधारयन्ते कतर एतत् प्रकशयन्ते कः पुनरेषां वरिष्ठ इति ॥ १ ॥ तस्मै स होवाचाकाशो
    ह वा एष देवो वायुरग्निरापः पृथिवी वाङ्मनश्चक्षुः श्रोत्रं च । ते प्रकाश्याभिवदन्ति वयमेतद्बाणमवष्टभ्य
    विधारयामः ॥ २ ॥ तान् वरिष्ठः प्राण उवाच । मा मोहमापद्यथ अहमेवैतत् पञ्चधाऽऽत्मानं प्रविभज्यैतद्बाणमवष्टभ्य
    विधारयामीति तेऽश्रद्दधाना बभूवुः ॥ ३ ॥ सोऽभिमानादूर्ध्वमुत्क्रामत इव तस्मिन्नुत्क्रामत्यथेतरे सर्व
    एवोत्क्रामन्ते तस्मि
