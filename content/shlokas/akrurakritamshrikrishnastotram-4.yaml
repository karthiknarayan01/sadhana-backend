id: akrurakritamshrikrishnastotram-4
category: stotram
name:
  english: akrurakritamshrikrishnastotram 4
  devanagari: अक्रूरकृतंश्रीकृष्णस्तोत्रम् ४
content:
  english: rmahanajadirmana indriyani | sarvendriyartha vibudhashca sarve ye hetavaste jagato'nga bhutah
    || 2|| naite svarupam viduratmanaste hyajadayo'natmataya grihitah | ajo'nubaddhah sa gunairajaya gunatparam
    veda na te svarupam || 3|| tvam yogino yajantyaddha mahapurushamishvaram | sadhyatmam sadhibhutam
    ca sadhidaivam ca sadhavah || 4|| trayya ca vidyaya kecittvam vai vaitanika dvijah | yajante vitatairyajnairnanarupamarakhyaya
    || 5|| eke tvakhilakarmani sannyasyopashamam gatah | jnanino jnanayajnena yajanti jnanavigraham ||
    6|| anye ca samskritatmano vidhinabhihitena te | yajanti tvanmayastvam vai bahumurtyekamurtikam ||
    7|| tvamevanye shivoktena margena shivarupinam | bahvacaryavibhedena bhagavan samupasate || 8|| sarva
    eva yajanti tvam sarvadevamayeshvaram | ye'pyanyadevatabhakta yadyapyanyadhiyah prabho || 9|| yathadriprabhava
    nadyah parjanyapuritah prabho | vishanti sarvatah sindhum tadvattvam gatayo'ntatah || 10|| sattvam
    rajastama iti bhavatah prakritergunah | teshu hi prakritah prota abrahmasthavaradayah || 11|| tubhyam
    namaste'stvavishaktadrishtaye sarvatmane sarvadhiyam ca sakshine | gunapravaho'yamavidyaya kritah
    pravartate devanritiryagatmasu || 12|| agnirmukham te'vaniranghririkshanam suryo nabho nabhiratho
    dishah shrutih | dyauh kam surendrastava bahavo'rnavah kukshirmarutpranabalam prakalpitam || 13||
    romani vrikshaushadhayah shiroruha meghah parasyasthi nakhani te'drayah | nimeshanam ratryahani prajapati
  devanagari: र्महानजादिर्मन इन्द्रियाणि । सर्वेन्द्रियार्था विबुधाश्च सर्वे ये हेतवस्ते जगतोऽङ्ग भूताः
    ॥ २॥ नैते स्वरूपं विदुरात्मनस्ते ह्यजादयोऽनात्मतया गृहीताः । अजोऽनुबद्धः स गुणैरजाया गुणात्परं वेद
    न ते स्वरूपम् ॥ ३॥ त्वां योगिनो यजन्त्यद्धा महापुरुषमीश्वरम् । साध्यात्मं साधिभूतं च साधिदैवं च साधवः
    ॥ ४॥ त्रय्या च विद्यया केचित्त्वां वै वैतानिका द्विजाः । यजन्ते विततैर्यज्ञैर्नानारूपामराख्यया ॥ ५॥
    एके त्वाखिलकर्माणि सन्न्यस्योपशमं गताः । ज्ञानिनो ज्ञानयज्ञेन यजन्ति ज्ञानविग्रहम् ॥ ६॥ अन्ये च संस्कृतात्मानो
    विधिनाभिहितेन ते । यजन्ति त्वन्मयास्त्वां वै बहुमूर्त्येकमूर्तिकम् ॥ ७॥ त्वामेवान्ये शिवोक्तेन मार्गेण
    शिवरूपिणम् । बह्वाचार्यविभेदेन भगवन् समुपासते ॥ ८॥ सर्व एव यजन्ति त्वां सर्वदेवमयेश्वरम् । येऽप्यन्यदेवताभक्ता
    यद्यप्यन्यधियः प्रभो ॥ ९॥ यथाद्रिप्रभवा नद्यः पर्जन्यापूरिताः प्रभो । विशन्ति सर्वतः सिन्धुं तद्वत्त्वां
    गतयोऽन्ततः ॥ १०॥ सत्त्वं रजस्तम इति भवतः प्रकृतेर्गुणाः । तेषु हि प्राकृताः प्रोता आब्रह्मस्थावरादयः
    ॥ ११॥ तुभ्यं नमस्तेऽस्त्वविषक्तदृष्टये सर्वात्मने सर्वधियां च साक्षिणे । गुणप्रवाहोऽयमविद्यया कृतः
    प्रवर्तते देवनृतिर्यगात्मसु ॥ १२॥ अग्निर्मुखं तेऽवनिरङ्घ्रिरीक्षणं सूर्यो नभो नाभिरथो दिशः श्रुतिः
    । द्यौः कं सुरेन्द्रास्तव बाहवोऽर्णवाः कुक्षिर्मरुत्प्राणबलं प्रकल्पितम् ॥ १३॥ रोमाणि वृक्षौषधयः शिरोरुहा
    मेघाः परस्यास्थि नखानि तेऽद्रयः । निमेषणं रात्र्यहनी प्रजापति
