id: anjaneyasahasranamastotram
category: stotram
name:
  english: anjaneyasahasranamastotram
  devanagari: आञ्जनेयसहस्रनामस्तोत्रम्
content:
  english: sukhaprado nago maheshakritasamstavah | maheshvarah satyasandhah sharabhah kalipavanah || 60||
    raso rasajnah sanmano rupam cakshuh shruti ravah | ghranam gandhah sparshanam ca sparsho hinkaramanagah
    || 61|| neti netiti gamyashca vaikunthabhajanapriyah | girisho girijakanto durvasah kavirangirah ||
    62|| bhrigurvasishthashcyavano naradastumbururharah | vishvakshetram vishvabijam vishvanetram ca vishvapah
    || 63|| yajako yajamanashca pavakah pitarastatha | shraddha buddhih kshama tandra mantro mantrayita
    surah || 64|| rajendro bhupati rudho mali samsarasarathih | nityah sampurnakamashca bhaktakamadhuguttamah
    || 65|| ganapah keshavo bhrata pita mata'tha marutih | sahasramurdha sahasrasyah sahasrakshah sahasrapat
    || 66|| kamajit kamadahanah kamah kamyaphalapradah | mudropahari rakshoghnah kshitibharaharo balah
    || 67|| nakhadamshtrayudho vishnubhakto bhaktabhayapradah | darpaha darpado damshtrashatamurtiramurtiman
    || 68|| mahanidhirmahabhago mahabhargo maharddhidah | mahakaro mahayogi mahateja mahadyutih || mahakarma
    mahanado mahamantro mahamatih | mahashamo mahodaro mahadevatmako vibhuh || 70|| rudrakarma krurakarma
    ratnanabhah kritagamah | ambhodhilanghanah siddhah satyadharma pramodanah || 71|| jitamitro jayah
    somo vijayo vayuvahanah | jivo dhata sahasramshurmukundo bhuridakshinah || 72|| siddharthah siddhidah
    siddhah sankalpah siddhihetukah | saptapatalacaranah saptarshiganavanditah || 73|| saptabdhilanghano
    virah saptadviporumandalah | saptangarajyasukhadah saptamatrinishevitah || 74|| saptalokaikamakutah
    saptahotrah svarashrayah | saptasamopagitashca saptapatalasamshrayah || 75|| saptacchandonidhih saptacchandah
    saptajanashrayah | medhadah kirtidah shokahari daurbhagyanashanah || 76|| sarvavashyakaro garbhadoshaha
    putrapautradah | prativadimukhastambho rushtacittaprasadanah || 77|| parabhicarashamano duhkhaha bandhamokshadah
    | navadvarapuradharo navadvaraniketanah || 78|| naranarayanastutyo navanathamaheshvarah | mekhali
    kavaci khadgi bhrajishnurjishnusarathih || bahuyojanavistirnapucchah pucchahatasurah | dushtahanta
    niyamita pishacagrahashatanah || 80|| balagrahavinashi ca dharmaneta kripakarah | ugrakrityashcogravega
    ugranetrah shatakratuh || 81|| shatamanyustutah stutyah stutih stota mahabalah | samagragunashali
    ca vyagro rakshovinashanah || 82|| raksho'gnidavo brahmeshah shridharo bhaktavatsalah | meghanado
    megharupo meghavrishtinivaranah || 83|| meghajivanahetushca meghashyamah paratmakah | samiratanayo
    dhata tattvavidyavisharadah || 84|| amogho'moghavrishtishcabhishtado'nishtanashanah | artho'narthapahari
    ca samartho ramasevakah || 85|| arthi dhanyo'suraratih pundarikaksha atmabhuh | sankarshano vishuddhatma
    vidyarashih sureshvarah || 86|| acaloddharako nityah setukridramasarathih | anandah paramanando matsyah
    kurmo nidhih shayah || 87|| varaho narasimhashca vamano jamadagnijah | ramah krishnah shivo buddhah
    kalki ramashrayo harih || 88|| nandi bhringi ca candi ca ganesho ganasevitah | karmadhyakshah suraramo
    vishramo jagatipatih || jagannathah kapishashca sarvavasah sadashrayah | sugrivadistuto dantah sarvakarma
    plavangamah || 90|| nakhadaritarakshashca nakhayuddhavisharadah | kushalah sudhanah shesho vasukistakshakastatha
    || 91|| svarnavarno baladhyashca purujeta'ghanashanah | kaivalyadipah kaivalyo garudah pannago guruh
    || 92|| klikliravahataratigarvah parvatabhedanah | vajrango vajravaktrashca bhaktavajranivarakah ||
    93|| nakhayudho manigrivo jvalamali ca bhaskarah | praudhapratapastapano bhaktatapanivarakah || 94||
    sharanam jivanam bhokta nanaceshto'tha cancalah | svasthastvasvasthyaha duhkhashatanah pavanatmajah
    || 95|| pavanah pavanah kanto bhaktangah sahano balah | meghanadaripurmeghanadasamhritarakshasah ||
    96|| ksharo'ksharo vinitatma vanareshah satangatih | shrikanthah shitikanthashca sahayah sahanayakah
    || 97|| asthulastvananurbhargo devasamsritinashanah | adhyatmavidyasarashcapyadhyatmakushalah sudhih
    || 98|| akalmashah satyahetuh satyadah satyagocarah | satyagarbhah satyarupah satyah satyaparakramah
    || 99|| anjanapranalingam ca vayuvamshodbhavah shrutih | bhadrarupo rudrarupah surupashcitrarupadhrik
    || 100|| mainakavanditah sukshmadarshano vijayo jayah | krantadinmandalo rudrah prakatikritavikramah
    || 101|| kambukanthah prasannatma hrasvanaso vrikodarah | lamboshthah kundali citramali yogavidam
    varah || 102|| vipashcit kaviranandavigraho'nalpanashanah | phalgunisunuravyagro yogatma yogatatparah
    || 103|| yogavidyogakarta ca yogayonirdigambarah | akaradikshakarantavarnanirmitavigrahah || 104||
    ulukhalamukhah siddhasamstutah parameshvarah | shlishtajanghah shlishtajanuh shlishtapanih shikhadharah
    || 105|| susharma'mitadharma ca narayanaparayanah | jishnurbhavishnu rocishnurgrasishnuh sthanureva
    ca || 106|| hari rudranukridvrikshakampano bhumikampanah | gunapravahah sutratma vitaragah stutipriyah
    || 107|| nagakanyabhayadhvamsi kritapurnah kapalabhrit | anukulo'kshayo'payo'napayo vedaparagah ||
    108|| aksharah purusho lokanathastryakshah prabhurdridhah | ashtangayogaphalabhuh satyasandhah purushtutah
    || 109|| shmashanasthananilayah pretavidravanakshamah | pancaksharaparah pancamatriko ranjano dhvajah
    || 110|| yoginivrindavandyashrih shatrughno'nantavikramah | brahmacarindriyavapurdhritadando dashatmakah
    || 111|| aprapancah sadacarah shuraseno vidarakah | buddhah pramoda anandah saptajihvapatirdharah
    || 112|| navadvarapuradharah pratyagrah samagayanah | shatcakradhama svarlokabhayahrinmanado madah
    || 113|| sarvavashyakarah shaktirananto'nantamangalah | ashtamurtidharo neta virupah svarasundarah
    || 114|| dhumaketurmahaketuh satyaketurmaharathah | nandipriyah svatantrashca mekhali damarupriyah
    || 115|| lohitangah samidvahnih shadrituh sharva ishvarah | phalabhuk phalahastashca sarvakarmaphalapradah
    || 116|| dharmadhyaksho dharmaphalo dharmo dharmaprado'rthadah | pancavimshatitattvajnastarako brahmatatparah
    || 117|| trimargavasatirbhimah sarvadushtanibarhanah | urjahsvami jalasvami shuli mali nishakarah
    || 118|| raktambaradharo rakto raktamalyavibhushanah | vanamali shubhangashca shvetah shvetambaro
    yuva || 119|| jayo'jeyaparivarah sahasravadanah kavih | shakinidakiniyaksharakshobhutaprabhanjanah
    || 120|| sadyojatah kamagatirjnanamurtiryashaskarah | shambhutejah sarvabhaumo vishnubhaktah plavangamah
    || 121|| caturnavatimantrajnah paulastyabaladarpaha | sarvalakshmipradah shrimanangadapriyavardhanah
    || 122|| smritibijam sureshanah samsarabhayanashanah | uttamah shriparivarah shribhurugrashca kamadhuk
    || 123|| sadagatirmatarishva ramapadabjashatpadah | nilapriyo nilavarno nilavarnapriyah suhrit ||
    124|| ramaduto lokabandhurantaratma manoramah | shriramadhyanakridvirah sada kimpurushastutah || 125||
    ramakaryantarangashca shuddhirgatiranamayah | punyashlokah paranandah pareshapriyasarathih || 126||
    lokasvami muktidata sarvakaranakaranah | mahabalo mahavirah paravaragatirguruh || 127|| tarako bhagavamstrata
    svastidata sumangalah | samastalokasakshi ca samastasuravanditah | aitasametashriramapadasevadhurandharah
    || 128|| idam namasahasram tu yo'dhite pratyaham narah | duhkhaugho nashyate kshipram sampattirvardhate
    ciram | vashyam caturvidham tasya bhavatyeva na samshayah || 129|| rajano rajaputrashca rajakiyashca
    mantrinah | trikalam pathanadasya drishyante ca tripakshatah || 130|| ashvatthamule japatam nasti
    vairikritam bhayam | trikalapathanadasya siddhih syat karasamsthita || 131|| brahme muhurte cotthaya
    pratyaham yah pathennarah | aihikamushmikan so'pi labhate natra samshayah || 132|| sangrame sannivishtanam
    vairividravanam bhavet | jvarapasmarashamanam gulmadivyadhivaranam || 133|| samrajyasukhasampattidayakam
    japatam nrinam | ya idam pathate nityam pathayedva samahitah | sarvan kamanavapnoti vayuputraprasadatah
    || 134|| || shri anjaneyasahasranamastotram hanumatsahasranamastotram ca sampurnam ||
  devanagari: सुखप्रदो नागो महेशकृतसंस्तवः । महेश्वरः सत्यसन्धः शरभः कलिपावनः ॥ ६०॥ रसो रसज्ञः सन्मानो
    रूपं चक्षुः श्रुती रवः । घ्राणं गन्धः स्पर्शनं च स्पर्शो हिङ्कारमानगः ॥ ६१॥ नेति नेतीति गम्यश्च वैकुण्ठभजनप्रियः
    । गिरिशो गिरिजाकान्तो दुर्वासाः कविरङ्गिराः ॥ ६२॥ भृगुर्वसिष्ठश्च्यवनो नारदस्तुम्बुरुर्हरः । विश्वक्षेत्रं
    विश्वबीजं विश्वनेत्रं च विश्वपः ॥ ६३॥ याजको यजमानश्च पावकः पितरस्तथा । श्रद्धा बुद्धिः क्षमा तन्द्रा
    मन्त्रो मन्त्रयिता सुरः ॥ ६४॥ राजेन्द्रो भूपती रूढो माली संसारसारथिः । नित्यः सम्पूर्णकामश्च भक्तकामधुगुत्तमः
    ॥ ६५॥ गणपः केशवो भ्राता पिता माताऽथ मारुतिः । सहस्रमूर्धा सहस्रास्यः सहस्राक्षः सहस्रपात् ॥ ६६॥ कामजित्
    कामदहनः कामः काम्यफलप्रदः । मुद्रोपहारी रक्षोघ्नः क्षितिभारहरो बलः ॥ ६७॥ नखदंष्ट्रायुधो विष्णुभक्तो
    भक्ताभयप्रदः । दर्पहा दर्पदो दंष्ट्राशतमूर्तिरमूर्तिमान् ॥ ६८॥ महानिधिर्महाभागो महाभर्गो महर्द्धिदः
    । महाकारो महायोगी महातेजा महाद्युतिः ॥ महाकर्मा महानादो महामन्त्रो महामतिः । महाशमो महोदारो महादेवात्मको
    विभुः ॥ ७०॥ रुद्रकर्मा क्रूरकर्मा रत्ननाभः कृतागमः । अम्भोधिलङ्घनः सिद्धः सत्यधर्मा प्रमोदनः ॥ ७१॥
    जितामित्रो जयः सोमो विजयो वायुवाहनः । जीवो धाता सहस्रांशुर्मुकुन्दो भूरिदक्षिणः ॥ ७२॥ सिद्धार्थः सिद्धिदः
    सिद्धः सङ्कल्पः सिद्धिहेतुकः । सप्तपातालचरणः सप्तर्षिगणवन्दितः ॥ ७३॥ सप्ताब्धिलङ्घनो वीरः सप्तद्वीपोरुमण्डलः
    । सप्ताङ्गराज्यसुखदः सप्तमातृनिषेवितः ॥ ७४॥ सप्तलोकैकमकुटः सप्तहोत्रः स्वराश्रयः । सप्तसामोपगीतश्च
    सप्तपातालसंश्रयः ॥ ७५॥ सप्तच्छन्दोनिधिः सप्तच्छन्दः सप्तजनाश्रयः । मेधादः कीर्तिदः शोकहारी दौर्भाग्यनाशनः
    ॥ ७६॥ सर्ववश्यकरो गर्भदोषहा पुत्रपौत्रदः । प्रतिवादिमुखस्तम्भो रुष्टचित्तप्रसादनः ॥ ७७॥ पराभिचारशमनो
    दुःखहा बन्धमोक्षदः । नवद्वारपुराधारो नवद्वारनिकेतनः ॥ ७८॥ नरनारायणस्तुत्यो नवनाथमहेश्वरः । मेखली कवची
    खड्गी भ्राजिष्णुर्जिष्णुसारथिः ॥ बहुयोजनविस्तीर्णपुच्छः पुच्छहतासुरः । दुष्टहन्ता नियमिता पिशाचग्रहशातनः
    ॥ ८०॥ बालग्रहविनाशी च धर्मनेता कृपाकरः । उग्रकृत्यश्चोग्रवेग उग्रनेत्रः शतक्रतुः ॥ ८१॥ शतमन्युस्तुतः
    स्तुत्यः स्तुतिः स्तोता महाबलः । समग्रगुणशाली च व्यग्रो रक्षोविनाशनः ॥ ८२॥ रक्षोऽग्निदावो ब्रह्मेशः
    श्रीधरो भक्तवत्सलः । मेघनादो मेघरूपो मेघवृष्टिनिवारणः ॥ ८३॥ मेघजीवनहेतुश्च मेघश्यामः परात्मकः । समीरतनयो
    धाता तत्त्वविद्याविशारदः ॥ ८४॥ अमोघोऽमोघवृष्टिश्चाभीष्टदोऽनिष्टनाशनः । अर्थोऽनर्थापहारी च समर्थो रामसेवकः
    ॥ ८५॥ अर्थी धन्योऽसुरारातिः पुण्डरीकाक्ष आत्मभूः । सङ्कर्षणो विशुद्धात्मा विद्याराशिः सुरेश्वरः ॥
    ८६॥ अचलोद्धारको नित्यः सेतुकृद्रामसारथिः । आनन्दः परमानन्दो मत्स्यः कूर्मो निधिः शयः ॥ ८७॥ वराहो नारसिंहश्च
    वामनो जमदग्निजः । रामः कृष्णः शिवो बुद्धः कल्की रामाश्रयो हरिः ॥ ८८॥ नन्दी भृङ्गी च चण्डी च गणेशो
    गणसेवितः । कर्माध्यक्षः सुरारामो विश्रामो जगतीपतिः ॥ जगन्नाथः कपीशश्च सर्वावासः सदाश्रयः । सुग्रीवादिस्तुतो
    दान्तः सर्वकर्मा प्लवङ्गमः ॥ ९०॥ नखदारितरक्षश्च नखयुद्धविशारदः । कुशलः सुधनः शेषो वासुकिस्तक्षकस्तथा
    ॥ ९१॥ स्वर्णवर्णो बलाढ्यश्च पुरुजेताऽघनाशनः । कैवल्यदीपः कैवल्यो गरुडः पन्नगो गुरुः ॥ ९२॥ क्लीक्लीरावहतारातिगर्वः
    पर्वतभेदनः । वज्राङ्गो वज्रवक्त्रश्च भक्तवज्रनिवारकः ॥ ९३॥ नखायुधो मणिग्रीवो ज्वालामाली च भास्करः
    । प्रौढप्रतापस्तपनो भक्ततापनिवारकः ॥ ९४॥ शरणं जीवनं भोक्ता नानाचेष्टोऽथ चञ्चलः । स्वस्थस्त्वस्वास्थ्यहा
    दुःखशातनः पवनात्मजः ॥ ९५॥ पवनः पावनः कान्तो भक्ताङ्गः सहनो बलः । मेघनादरिपुर्मेघनादसंहृतराक्षसः ॥
    ९६॥ क्षरोऽक्षरो विनीतात्मा वानरेशः सताङ्गतिः । श्रीकण्ठः शितिकण्ठश्च सहायः सहनायकः ॥ ९७॥ अस्थूलस्त्वनणुर्भर्गो
    देवसंसृतिनाशनः । अध्यात्मविद्यासारश्चाप्यध्यात्मकुशलः सुधीः ॥ ९८॥ अकल्मषः सत्यहेतुः सत्यदः सत्यगोचरः
    । सत्यगर्भः सत्यरूपः सत्यः सत्यपराक्रमः ॥ ९९॥ अञ्जनाप्राणलिङ्गं च वायुवंशोद्भवः श्रुतिः । भद्ररूपो
    रुद्ररूपः सुरूपश्चित्ररूपधृक् ॥ १००॥ मैनाकवन्दितः सूक्ष्मदर्शनो विजयो जयः । क्रान्तदिङ्मण्डलो रुद्रः
    प्रकटीकृतविक्रमः ॥ १०१॥ कम्बुकण्ठः प्रसन्नात्मा ह्रस्वनासो वृकोदरः । लम्बोष्ठः कुण्डली चित्रमाली योगविदां
    वरः ॥ १०२॥ विपश्चित् कविरानन्दविग्रहोऽनल्पनाशनः । फाल्गुनीसूनुरव्यग्रो योगात्मा योगतत्परः ॥ १०३॥ योगविद्योगकर्ता
    च योगयोनिर्दिगम्बरः । अकारादिक्षकारान्तवर्णनिर्मितविग्रहः ॥ १०४॥ उलूखलमुखः सिद्धसंस्तुतः परमेश्वरः
    । श्लिष्टजङ्घः श्लिष्टजानुः श्लिष्टपाणिः शिखाधरः ॥ १०५॥ सुशर्माऽमितधर्मा च नारायणपरायणः । जिष्णुर्भविष्णू
    रोचिष्णुर्ग्रसिष्णुः स्थाणुरेव च ॥ १०६॥ हरी रुद्रानुकृद्वृक्षकम्पनो भूमिकम्पनः । गुणप्रवाहः सूत्रात्मा
    वीतरागः स्तुतिप्रियः ॥ १०७॥ नागकन्याभयध्वंसी कृतपूर्णः कपालभृत् । अनुकूलोऽक्षयोऽपायोऽनपायो वेदपारगः
    ॥ १०८॥ अक्षरः पुरुषो लोकनाथस्त्र्यक्षः प्रभुर्दृढः । अष्टाङ्गयोगफलभूः सत्यसन्धः पुरुष्टुतः ॥ १०९॥
    श्मशानस्थाननिलयः प्रेतविद्रावणक्षमः । पञ्चाक्षरपरः पञ्चमातृको रञ्जनो ध्वजः ॥ ११०॥ योगिनीवृन्दवन्द्यश्रीः
    शत्रुघ्नोऽनन्तविक्रमः । ब्रह्मचारीन्द्रियवपुर्धृतदण्डो दशात्मकः ॥ १११॥ अप्रपञ्चः सदाचारः शूरसेनो विदारकः
    । बुद्धः प्रमोद आनन्दः सप्तजिह्वपतिर्धरः ॥ ११२॥ नवद्वारपुराधारः प्रत्यग्रः सामगायनः । षट्चक्रधामा
    स्वर्लोकभयहृन्मानदो मदः ॥ ११३॥ सर्ववश्यकरः शक्तिरनन्तोऽनन्तमङ्गलः । अष्टमूर्तिधरो नेता विरूपः स्वरसुन्दरः
    ॥ ११४॥ धूमकेतुर्महाकेतुः सत्यकेतुर्महारथः । नन्दीप्रियः स्वतन्त्रश्च मेखली डमरुप्रियः ॥ ११५॥ लोहिताङ्गः
    समिद्वह्निः षडृतुः शर्व ईश्वरः । फलभुक् फलहस्तश्च सर्वकर्मफलप्रदः ॥ ११६॥ धर्माध्यक्षो धर्मफलो धर्मो
    धर्मप्रदोऽर्थदः । पञ्चविंशतितत्त्वज्ञस्तारको ब्रह्मतत्परः ॥ ११७॥ त्रिमार्गवसतिर्भीमः सर्वदुष्टनिबर्हणः
    । ऊर्जःस्वामी जलस्वामी शूली माली निशाकरः ॥ ११८॥ रक्ताम्बरधरो रक्तो रक्तमाल्यविभूषणः । वनमाली शुभाङ्गश्च
    श्वेतः श्वेताम्बरो युवा ॥ ११९॥ जयोऽजेयपरीवारः सहस्रवदनः कविः । शाकिनीडाकिनीयक्षरक्षोभूतप्रभञ्जनः ॥
    १२०॥ सद्योजातः कामगतिर्ज्ञानमूर्तिर्यशस्करः । शम्भुतेजाः सार्वभौमो विष्णुभक्तः प्लवङ्गमः ॥ १२१॥ चतुर्णवतिमन्त्रज्ञः
    पौलस्त्यबलदर्पहा । सर्वलक्ष्मीप्रदः श्रीमानङ्गदप्रियवर्धनः ॥ १२२॥ स्मृतिबीजं सुरेशानः संसारभयनाशनः
    । उत्तमः श्रीपरीवारः श्रीभूरुग्रश्च कामधुक् ॥ १२३॥ सदागतिर्मातरिश्वा रामपादाब्जषट्पदः । नीलप्रियो
    नीलवर्णो नीलवर्णप्रियः सुहृत् ॥ १२४॥ रामदूतो लोकबन्धुरन्तरात्मा मनोरमः । श्रीरामध्यानकृद्वीरः सदा
    किम्पुरुषस्तुतः ॥ १२५॥ रामकार्यान्तरङ्गश्च शुद्धिर्गतिरनामयः । पुण्यश्लोकः परानन्दः परेशप्रियसारथिः
    ॥ १२६॥ लोकस्वामी मुक्तिदाता सर्वकारणकारणः । महाबलो महावीरः पारावारगतिर्गुरुः ॥ १२७॥ तारको भगवांस्त्राता
    स्वस्तिदाता सुमङ्गलः । समस्तलोकसाक्षी च समस्तसुरवन्दितः । अईतासमेतश्रीरामपादसेवाधुरन्धरः ॥ १२८॥ इदं
    नामसहस्रं तु योऽधीते प्रत्यहं नरः । दुःखौघो नश्यते क्षिप्रं सम्पत्तिर्वर्धते चिरम् । वश्यं चतुर्विधं
    तस्य भवत्येव न संशयः ॥ १२९॥ राजानो राजपुत्राश्च राजकीयाश्च मन्त्रिणः । त्रिकालं पठनादस्य दृश्यन्ते
    च त्रिपक्षतः ॥ १३०॥ अश्वत्थमूले जपतां नास्ति वैरिकृतं भयम् । त्रिकालपठनादस्य सिद्धिः स्यात् करसंस्थिता
    ॥ १३१॥ ब्राह्मे मुहूर्ते चोत्थाय प्रत्यहं यः पठेन्नरः । ऐहिकामुष्मिकान् सोऽपि लभते नात्र संशयः ॥ १३२॥
    सङ्ग्रामे सन्निविष्टानां वैरिविद्रावणं भवेत् । ज्वरापस्मारशमनं गुल्मादिव्याधिवारणम् ॥ १३३॥ साम्राज्यसुखसम्पत्तिदायकं
    जपतां नृणाम् । य इदं पठते नित्यं पाठयेद्वा समाहितः । सर्वान् कामानवाप्नोति वायुपुत्रप्रसादतः ॥ १३४॥
    ॥ श्री आञ्जनेयसहस्रनामस्तोत्रं हनुमत्सहस्रनामस्तोत्रं च सम्पूर्णम् ॥
