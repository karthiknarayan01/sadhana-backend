id: dakshinamurtistotram-4
category: stotram
name:
  english: dakshinamurtistotram 4
  devanagari: दक्षिणामूर्तिस्तोत्रम् ४
content:
  english: ringarabhujrimbhanavaranaya prasunakodandaripum prapadye | vinetumartim vishayadhvajanyam vatadrumadhovasatim
    prapadye || 2|| mohatirekasmayamoshanaya padarditapasmaranam prapadye | karmatavipatanakautukena panau
    virajatparashum prapadye || 3|| vishuddhavijnanavikasahetoh prabodhamudrabharitam prapadye | tapatrayatopasamapanaya
    praḻeyadhamabharanam prapadye || 4|| vaimalyasampadanavanchaya'ham mandakinimalyadharam prapadye |
    prasadalabham paramihamanah mugdhasmitollasimukham prapadye || 5|| vyathamasheshamapanetukamah namna
    mridam nathamaham prapadye | anadyavidyashamanam prapadye
  devanagari: ृङ्गारभूजृम्भणवारणाय प्रसूनकोदण्डरिपुं प्रपद्ये । विनेतुमार्तिं विषयाध्वजन्यां वटद्रुमाधोवसतिं
    प्रपद्ये ॥ २॥ मोहातिरेकस्मयमोषणाय पादार्दितापस्मरणं प्रपद्ये । कर्माटवीपाटनकौतुकेन पाणौ विराजत्परशुं
    प्रपद्ये ॥ ३॥ विशुद्धविज्ञानविकासहेतोः प्रबोधमुद्राभरितं प्रपद्ये । तापत्रयाटोपसमापनाय प्राळेयधामाभरणं
    प्रपद्ये ॥ ४॥ वैमल्यसम्पादनवाञ्छयाऽहं मन्दाकिनीमाल्यधरं प्रपद्ये । प्रसादलाभं परमीहमानः मुग्धस्मितोल्लासिमुखं
    प्रपद्ये ॥ ५॥ व्यथामशेषामपनेतुकामः नाम्ना मृडं नाथमहं प्रपद्ये । अनाद्यविद्याशमनं प्रपद्ये
meaning: {}
