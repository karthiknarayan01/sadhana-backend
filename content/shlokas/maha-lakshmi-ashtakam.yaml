id: maha-lakshmi-ashtakam
category: stotram
name:
  english: Maha Lakshmi Ashtakam
content:
  english: namaste'stu mahamaye shripithe surapujite | shankhacakra gadahaste mahalakshmi namo'stu te
    || || namaste garudarudhe kolasura bhayankari | sarvapapahare devi mahalakshmi namo'stu te || || sarvajne
    sarvavarade sarva dushta bhayankari | sarvaduhkha hare devi mahalakshmi namo'stu te || || siddhi buddhi
    prade devi bhukti mukti pradayini | mantra murte sada devi mahalakshmi namo'stu te || || adyanta rahite
    devi adishakti maheshvari | yogajne yoga sambhute mahalakshmi namo'stu te || || sthula sukshma maharaudre
    mahashakti mahodare | maha papa hare devi mahalakshmi namo'stu te || || padmasana sthite devi parabrahma
    svarupini | parameshi jaganmatah mahalakshmi namo'stu te || || shvetambaradhare devi nanalankara bhushite
    | jagasthite jaganmatah mahalakshmi namo'stu te || || mahalakshmashtakam stotram yah pathed bhaktiman
    narah | sarva siddhi mavapnoti rajyam prapnoti sarvada || ekakale pathennityam mahapapa vinashanam
    | dvikalam yah pathennityam dhana dhanya samanvitah || trikalam yah pathennityam mahashatru vinashanam
    | mahalakshmi rbhaven nityam prasanna varada shubha || iti shri indrakritam mahalakshmyashtakastotram
    sampurnam
  devanagari: नमस्तेऽस्तु महामाये श्रीपीठे सुरपूजिते । शङ्खचक्र गदाहस्ते महालक्ष्मि नमोऽस्तु ते ॥ ॥ नमस्ते
    गरुडारूढे कोलासुर भयङ्करि । सर्वपापहरे देवि महालक्ष्मि नमोऽस्तु ते ॥ ॥ सर्वज्ञे सर्ववरदे सर्व दुष्ट
    भयङ्करि । सर्वदुःख हरे देवि महालक्ष्मि नमोऽस्तु ते ॥ ॥ सिद्धि बुद्धि प्रदे देवि भुक्ति मुक्ति प्रदायिनि
    । मन्त्र मूर्ते सदा देवि महालक्ष्मि नमोऽस्तु ते ॥ ॥ आद्यन्त रहिते देवि आदिशक्ति महेश्वरि । योगज्ञे
    योग सम्भूते महालक्ष्मि नमोऽस्तु ते ॥ ॥ स्थूल सूक्ष्म महारौद्रे महाशक्ति महोदरे । महा पाप हरे देवि
    महालक्ष्मि नमोऽस्तु ते ॥ ॥ पद्मासन स्थिते देवि परब्रह्म स्वरूपिणि । परमेशि जगन्मातः महालक्ष्मि नमोऽस्तु
    ते ॥ ॥ श्वेताम्बरधरे देवि नानालङ्कार भूषिते । जगस्थिते जगन्मातः महालक्ष्मि नमोऽस्तु ते ॥ ॥ महालक्ष्मष्टकं
    स्तोत्रं यः पठेद् भक्तिमान् नरः । सर्व सिद्धि मवाप्नोति राज्यं प्राप्नोति सर्वदा ॥ एककाले पठेन्नित्यं
    महापाप विनाशनम् । द्विकालं यः पठेन्नित्यं धन धान्य समन्वितः ॥ त्रिकालं यः पठेन्नित्यं महाशत्रु विनाशनम्
    । महालक्ष्मी र्भवेन् नित्यं प्रसन्ना वरदा शुभा ॥ इति श्री इन्द्रकृतं महालक्ष्म्यष्टकस्तोत्रं सम्पूर्णम्
