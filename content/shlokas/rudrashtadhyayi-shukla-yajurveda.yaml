id: rudrashtadhyayi-shukla-yajurveda
category: stotram
name:
  english: Rudrashtadhyayi (Shukla Yajurveda)
content:
  english: '|| om shri ganeshaya namah || om dhyanam vande siddhipradam devam ganesham priyapalakam |
    vishvagarbham ca vighnesham anadim mangalam vibhum || atha dhyanam dhyayennityam mahesham rajatagirinibham
    caru candravatamsam | ratnakalpojjvalangam parashumrigavarabhitihastam prasannam || || padmasinam
    samantatstutamamaraganairvyaghrakritim vasanam | vishvadyam vishvavandyam nikhilabhayaharam pancavaktram
    trinetram || shiva sankalpa suktam harih om gananam tva ganapatigm havamahe priyanam tva priyapatigm
    havamahe nidhinam tva nidhipatigm havamahe vaso mama | ahamajani garbhadhama tvamajasi garbhadham
    || || gayatri trishtubjagatyanushtuppanktya saha | brihatyushniha kakupsucibhih shamyantu tva || ||
    dvipadayashcatushpadastripadayashcashatpadah | vicchanda yashca sacchanda ssucibhih shamyantu tva
    || ssahacchandasa avritah sahaprama rishaya ssapta daivyah | purvesham panthamanudrishya dhira anvalebhire
    rathyo na rashmin || || yajjagrato duramudaiti daivam tadu suptasya tathaivaiti | durangama njyotisham
    jyotirekam tanme manah shivasankalpamastu || || yena karmanyapaso manishino yajne krinvanti vidatheshu
    dhirah | yadapurvam ya~kshamantah prajanam tanme manah shivasankalpamastu || || yatprajnanamuta ceto
    dhritishca yajjyotirantaramritam prajasu | yasmanna ncana karma kriyate tanme manah shivasankalpamastu
    || mbhavishyatparigrihitamamritena sarvam | yena yajnastayate saptahota tanme manah shivasankalpamastu
    || ssama yajugmshi yasmi npratishthita rathanabhavivarah | yasmigmshcittagm sarvamotam prajanam tanme
    manah shivasankalpamastu || || susharathirashvaniva yanmanushyanneniyate ''bhishubhirvajina iva |
    hritpratishtham yadajira njavishtham tanme manah shivasankalpamastu || purusha suktam harih om sahasrashir
    ssahasrapat | sa bhumigm sarvatah spritvatyatishthaddashangulam || || purusha evedagm sarvam yadbhutam
    ya~cca bhavyam | utamritatvasyeshano yadannenatirohati || || etavanasya mahimato jyaya nshca purushah
    | pado ''sya vishva bhutani tripadasyamritam divi || || tripadurdhva udaitpurushah pado ''syehabhavatpunah
    | tato vishvan vyakramatsashananashane abhi || || tato viradajayata virajo adhi purushah | sa jato
    atyaricyata pashcadbhumimatho purah || || tasmadyajnatsarvahuta mprishadajyam | pashu nshcakre vayavyanaranya
    gramyashca ye || || tasmadyajnatsarvahuta rica ssamani jajnire | chandagmsi jajnire tasmadyajustasmadajayata
    || || tasmadashva ajayanta ye ke cobhayadatah | gavo ha jajnire tasmattasmajjata ajavayah || hishi
    praukshanpurusha njatamagratah | tena deva ayajanta sadhya rishayashca ye || || yatpurusham vyadadhuh
    katidha vyakalpayann | mukham kimasyasi mbahu kimuru pada ucyete || ''sya mukhamasidbahu rajanyah
    kritah | uru tadasya yadvaishyah padbhyagm shudro ajayata || || candrama manaso jatashcakshoh suryo
    ajayata | shrotradvayushca pranashca mukhadagnirajayata || || nabhya asidantarikshagm shir ssamavartata
    | padbhya shshrotrattatha loka || yatpurushena havisha deva yajnamatanvata | vasanto ''syasidajyam
    grishma idhma || saptasyasanparidhayastrissapta samidhah kritah | deva yadyajna || yajnena yajnamayajanta
    devastani dharmani prathamanyasann | te ha nakam mahimanah sacanta yatra purve sadhya ssambhritah
    prithivyai rasacca vishvakarmana ssamavartatagre | tasya tvashta vidadhadrupameti tanmartyasya devatvamajanamagre
    || mmahantamadityavarnam tamasah parastat | tameva viditva ''ti mrityumeti nanyah pantha vidyate ||
    prajapatishcarati garbhe antarajayamano bahudha vi jayate | tasya yonim paripashyanti dhirastasminha
    tasthurbhuvanani vishva || || yo devebhya atapati yo devanam purohitah | purvo yo devebhyo jato namo
    rucaya brahmaye || njanayanto deva agre tadabruvann | yastvaiva mbrahmano vidyattasya deva asanvashe
    || || shrishca te lakshmishca patnyavahoratre par shve nakshatrani rupamashvinau vyattam | ishnannishanamu
    || iti rudre dvitiyo apratiratha suktam hari om ashu shshishano vrishabho na bhimo ghanaghanah shaninam
    | sankrandano shshatagm sena ajayatsakamindrah || ''nimishena jishnuna yutkarena dushcyavanena dhrishnuna
    | tadindrena jayata tatsahadhvam yudho nara ishuhastena vrishna || || sa ishuhastaih sa nishangibhirvashi
    sagmsrashta sa yudha indro ganena | sagmsrishtajitsomapa bahushardhyugradhanva pratihitabhirasta ||
    || brihaspate paridiya rathena rakshohamitra apabadhamanah | prabhanjantsenah pramrino yudha jayannasmakamedhyavita
    rathanam || ssthavirah pravira ssahasvanvaji sahamana ugrah | abhiviro abhisatva sahoja jaitramindra
    rathamatishtha govit || || gotrabhidam govidam vajrabahum jayantamajma pramrinantamojasa | imagm sajata
    anu virayadhvamindragm sakhayo anu sagmrabhadhvam || || abhi gotrani sahasa gahamano shshatamanyurindrah
    | dushcyavanah pritanashadayudhyo ''smakagm sena avatu pra yutsu || nneta brihaspatirdakshina yajnah
    pura etu somah | devasenanamabhibhanjatina mmaruto yantvagram || || indrasya vrishno varunasya rajna
    adityanam marutagm shardha ugram | mahamanasa mbhuvanacyavanam ghosho devanam jayatamudasthat || shaya
    maghavannayudhanyutsatvana mmamakanam managmsi | udvritrahanvajinam vajinanyudrathanam jayatam ssamriteshu
    dhvajeshvasmakam ya ishavasta jayantu | asmakam vira uttare bhavantvasma u deva avata haveshu || mpratilobhayanti
    grihananganyapve parehi | abhi prehi nirdaha hritsu shokairandhenamitrastamasa sacantam || || avasrishta
    parapata sharavye brahmasagmshite | gacchamitranprapadyasva mamishankancanocchishah || || preta jayata
    nara indro va shsharma yacchatu | ugra vah santu bahavo || asau ya sena marutah pareshamabhyaiti na
    ojasa spardhamana | ta ''pavratena yathami anyo anya ssampatanti kumara vishikha iva | tanna indro
    brihaspatiraditi shsharma yacchatu vishvaha sharma yacchatu || || marmani te varmana chadayami somastva
    raja ''mritenanuvastam | urorvariyo varunaste krinotu jayantam tvanu deva madantu || maitra suktam
    harih om vibhradbrihatpibatu somya mmadhvayurdadhadyajnapatavavihrutam | vatajuto yo abhirakshati
    tmana prajah puposha purudha vi rajati || va~hanti ketavah | drishe vishvaya suryam || || yena pavaka
    cakshasa bhuranyantam jana || daivyavadhvaryu agatagm rathena suryatvaca madhva yajnagm samanjathe
    | ta mpratnatha purvatha vishvathematha jyeshthatati hishadagmsvarvidam | praticinam vri~janam dohase
    dhunimashu njayantamanu yasu vardhase || ve~nashcodayatprishnigarbha jyotirjarayu rajaso vimane |
    imamapagmsangame suryasya shishunna vipra matibhi rihanti || ndevanamudagadanikam cakshurmitrasya
    varunasyagneh | apra dyavaprithivi antarikshagm surya atma jagatastasthushashca || || a na idabhirvidathe
    sushasti vishvanara ssavita deva etu | api yatha yuvano matsatha no vishvam jagadabhipitve manisha
    || || yadadya kacca vritrahannudaga abhi surya | sarvam tadindra te vashe || || taranirvishvadar shato
    jyotishkridasi surya | vishvama bhasi rocanam || || tatsuryasya devatva mmadhya kartorvitatagm sa
    njabhara | yadedayukta haritah sadhasthadadratri vasastanute simasmai || || tanmitrasya varunasyabhicakshe
    suryo rupa nkrinute dyorupasthe | anantamanyadrushadasya pajah krishnamanyaddharita || asi surya badaditya
    maha || asi | mahaste sato mahima panasyate || bat surya shravasa maha || asi | mahna devanamasuryah
    purohito vibhu jyotiradabhyam || || shrayanta iva suryam vishvedindrasya bhakshata | vasuni jate janamana
    ojasa prati bhaga || adya deva udita suryasya niragmhasah piprita niravadyat | tanno mitro varuno
    mamahantamaditi ssindhuh prithivi uta dyauh || || a krishnena rajasa vartamano niveshayannamritam
    martyam ca | hiranyayena savita rathena devo yati bhuvanani pashyan || || iti rudre caturtho harih
    om namaste rudra manyava uto ta ishave namah | bahubhyamuta te namah || || ya te rudra shiva tanuraghora
    ''papakashini | taya nastanva shantamaya girishantabhi cakashihi || || yamishum girishanta haste bibhar
    nkuru ma higmsih purusham jagat || || shivena vacasa tva girisha ''cchavadamasi | yatha na ssarvamijjagadayakshmagm
    sumana asat || || adhyavocadadhivakta prathamo daivyo bhishak | ahigmshca sarvanjambhayantsarvashca
    yatudhanyo || asau yastamro aruna uta babhru ssumangalah | ye cainagm rudra abhito dikshu shrita ''vaishagm
    heda imahe || ''vasarpati nilagrivo vilohitah | utainam gopa adrishrannadrishrannudaharya ssa drishto
    mridayati nah || ''stu nilagrivaya sahasrakshaya midhushe | atho ye asya satvano || pramunca dhanvanastvamubhayorartnyorjyam
    | yashca te hasta ishavah para ta bhagavo vapa || || vijyam dhanuh kapardino vishalyo banava || uta
    | aneshannasya ya ishava abhurasya nishangadhih || || ya te hetirmidhushtama haste babhuva te dhanuh
    | tayasmanvishvatastvamayakshmaya paribhuja || || pari te dhanvano hetirasmanvrinaktu vishvatah |
    atho ya ishudhistavare asmannidhehi tam || || avatatya dhanushtvagm sahasraksha shateshudhe | nishirya
    shalyanam mukha shivo nah sumana bhava || || namasta ayudhayanatataya dhrishnave | ubhabhyamuta te
    namo bahubhyam tava dhanvane || || ma no mahantamuta ma no arbhaka mma na ukshantamuta ma na ukshitam
    | ma no vadhih pitaram mota mataram ma nah priyastanvo rudra ririshah || || ma nastoke tanaye ma na
    ayushi ma no goshu ma no ashveshu ririshah | ma no vira nrudra bhamino vadhir ssadamittva havamahe
    || || namo hiranyabahave senanye disha nca pataye namo namo vrikshebhyo harikeshebhyah pashuna mpataye
    namo namah shashpinjaraya tvishimate pathina mpataye namo namo harikeshayopavitine pushtanam pataye
    namah || || namo babhlushaya vyadhine ''nnanam pataye namo namo bhavasya hetyai jagatam pataye namo
    namo rudrayatatayine kshetranam pataye namo namah sutayahantyai vananam pataye namah || || namo rohitaya
    sthapataye vrikshanam pataye namo namo bhuvantaye varivaskritayaushadhinam pataye namo namo mantrine
    vanijaya kakshanam pataye namo nama uccairghoshayakrandayate pattina || namah kritsnayataya dhavate
    satvanam pataye namo nama ssahamanaya nivyadhina avyadhininam pataye namo namo nishangine kakubhaya
    stenanam pataye namo namo nicerave paricarayaranyanam pataye namah || || namo vancate parivancate
    stayuna mpataye namo namo nishangina ishudhimate taskaranam pataye namo namah srikayibhyo jighagmsadbhyo
    mushnata ''simadbhyo naktancaradbhyo vikrintanam pataye namah || || nama ushnishine giricaraya kuluncanam
    pataye namo nama ishumadbhyo dhanvayibhyashca vo namo nama atanvanebhyah pratidadhanebhyashca vo namo
    nama ayacchadbhyo ''syadbhyashca vo namah || || namo visrijadbhyo vidhyadbhyashca vo namo namah svapadbhyo
    jagradbhyashca vo namo nama shshayanebhya asinebhyashca vo namo namastishthadbhyo dhavadbhyashca vo
    namah || || namah sabhabhyah sabhapatibhyashca vo namo namo ''shvapatibhyashca vo namo nama avyadhinibhyo
    vividhyantibhyashca vo namo nama uganabhyastrigmhatibhyashca vo namah || || namo ganebhyo ganapatibhyashca
    vo namo namo vratebhyo vratapatibhyashca vo namo namo gritsebhyo gritsapatibhyashca vo namo namo virupebhyo
    vishvarupebhyashca vo namah || ssenanibhyashca vo namo namo rathibhyo arathebhyashca vo namo namah
    kshattribhyah sangrahitribhyashca vo namo namo mahadbhyo arbhakebhyashca vo namah || || namastakshabhyo
    rathakarebhyashca vo namo namah kulalebhyah karmarebhyashca vo namo namo nishadebhyah punjishtebhyashca
    vo namo namah shvanibhyo mrigayubhyashca vo namah || shshvapatibhyashca vo namo namo bhavaya ca rudraya
    ca namah sharvaya ca pashupataye ca namo nilagrivaya ca shitikanthaya ca || || namah kapardine ca
    vyuptakeshaya ca namah sahasrakshaya ca shatadhanvane ca namo girishayaya ca shipivishtaya ca namo
    midhushtamaya ceshumate ca || || namo hrasvaya ca vamanaya ca namo brihate ca var shiyase ca namo
    vriddhaya ca savridhe ca namo ''gryaya ca prathamaya ca || || nama ashave cajiraya ca nama shshighryaya
    ca shibhyaya ca nama urmyaya cavasvanyaya ca namo nadeyaya ca dvipyaya ca || || namo jyeshthaya ca
    kanishthaya ca namah purvajaya caparajaya ca namo madhyamaya capagalbhaya ca namo jaghanyaya ca budhnyaya
    ca || ssobhyaya ca pratisaryaya ca namo yamyaya ca kshemyaya ca nama shshlokyaya cavasanyaya ca nama
    urvaryaya ca khalyaya ca || || namo vanyaya ca kakshyaya ca namah shravaya ca pratishravaya ca nama
    ashushenaya cashurathaya ca nama shshuraya cavabhedine ca || || namo bilmine ca kavacine ca namo varmine
    ca varuthine ca namah shrutaya ca shrutasenaya ca namo dundubhyaya cahananyaya ca || || namo dhrishnave
    ca pramrishaya ca namo nishangine ceshudhimate ca namastikshneshave cayudhine ca namah svayudhaya
    ca sudhanvane ca || ssrutyaya ca pathyaya ca namah katyaya ca nipyaya ca namah kulyaya ca sarasyaya
    ca namo nadeyaya ca vaishantaya ca || || namah kupyaya cavatyaya ca namo vidhryaya catapyaya ca namo
    meghyaya ca vidyutyaya ca namo var || namo vatyaya ca reshmyaya ca namo vastavyaya ca vastupaya ca
    nama ssomaya ca rudraya ca namastamraya carunaya ca || || namah shangave ca pashupataye ca nama ugraya
    ca bhimaya ca namo ''grevadhaya ca durevadhaya ca namo hantre ca haniyase ca namo vrikshebhyo harikeshebhyo
    namastaraya || || namah shambhavaya ca mayobhavaya ca namah shankaraya ca mayaskaraya ca namah shivaya
    ca shivataraya ca || || namah paryaya cavaryaya ca namah prataranaya cottaranaya ca namastirthyaya
    ca kulyaya ca nama shshashpyaya ca phenyaya ca || || namah sikatyaya ca pravahyaya ca namah kigmshilaya
    ca kshayanaya ca namah kapardine ca pulastaye ca nama irinyaya ca prapathyaya ca || || namo vrajyaya
    ca goshthyaya ca namastalpyaya ca gehyaya ca namo hridayyaya ca niveshpyaya ca namah katyaya ca gahvareshthaya
    ca || shshushkyaya ca harityaya ca namah pagmsavyaya ca rajasyaya ca namo lopyaya colapyaya ca nama
    urvyaya ca survyaya ca || || namah parnaya ca parnashadaya ca nama udguramanaya cabhighnate ca nama
    akhidate ca prakhidate ca namah ishukridbhyo dhanushkridbhyashca vo namo namo vah kirikebhyo devanagm
    hridayebhyo namo vicinvatkebhyo namo vikshinatkebhyo nama anir || drape andhasaspate daridram nilalohita
    | asa mma bherma ronbho ca nah kincanamamat || || ima rudraya tavase kapardine kshayadviraya prabharamahe
    matih | yatha shamasaddvipade catushpade vishvam pushta ngrame asminnanaturam || || ya te rudra shiva
    tanu shshiva vishvaha bheshaji | shiva rutasya bheshaji taya no mrida jivase || || pari no rudrasya
    hetirvrinaktu pari tveshasya durmatiraghayoh | ava sthira maghavadbhyastanushva midhvastokaya tanayaya
    mrida || || midhushtama shivatama shivo nah sumana bhava | parame vriksha ayudha nnidhaya krittim
    vasana acara pinakam bibhradagahi || || vikiridra vilohita namaste astu bhagavah | yaste sahasragm
    hetayo ''nyamasmannivapantu tah || || sahasrani sahasrasho bahvostava hetayah | tasamishano bhagavah
    paracina mukha kridhi || || asamkhyata sahasrani ye rudra adhi bhumyam | teshagm sahasrayojane ''va
    dhanvani tanmasi || || asminmahatyarnave ''ntarikshe bhava adhi | teshagm sahasrayojane ''va dhanvani
    tanmasi || shshitikantha divagm rudra upashritah | teshagm sahasrayojane ''va dhanvani tanmasi ||
    shshitikanthah sharva adhah kshamacarah | teshagm sahasrayojane ''va dhanvani tanmasi || || ye vriksheshu
    shashpinjara nilagriva vilohitah | teshagm sahasrayojane ''va dhanvani tanmasi || || ye bhutanamadhipatayo
    vishikhasah kapardinah | teshagm sahasrayojane ''va dhanvani tanmasi || mpathirakshaya ailabrida ayuryudhah
    | teshagm sahasrayojane ''va dhanvani tanmasi || || ye tirthani pracaranti srikahasta nishanginah
    | teshagm sahasrayojane ''va dhanvani tanmasi || ''nneshu vividhyanti patreshu pibato janan | teshagm
    sahasrayojane ''va dhanvani tanmasi || || ya etavantashca bhuyagmsashca disho rudra vitasthire | teshagm
    sahasrayojane ''va dhanvani tanmasi || ''stu rudrebhyo ye divi yesham var shamishavastebhyo dasha
    pracirdasha dakshina dasha praticirdashodicirdashordhvastebhyo namo astu te no ''vantu te no mridayantu
    te yam dvishmo yashca no dveshti tamesham jambhe dadhmah || ''stu rudrebhyo ye ''ntarikshe yesham
    vata ishavastebhyo dasha pracirdasha dakshina dasha praticirdashodicirdashordhvastebhyo namo astu
    te no ''vantu te no mridayantu te yam dvishmo yashca no dveshti tamesham jambhe dadhmah || ''stu rudrebhyo
    ye prithivyam ye~shamannamishavastebhyo dasha pracirdasha dakshina dasha praticirdashodicirdashordhvastebhyo
    namo astu te no ''vantu te no mridayantu te yam dvishmo yashca no dveshti tamesham jambhe dadhmah
    || tryambaka yajanam harih om vayagmsoma vrate tava manastanushu bibhratah | prajavanta || esha te
    rudra bhaga njushasva svahaisha te rudra bhaga akhuste pashuh || || ava rudramadimahyava deva ntryambakam
    | yatha no vasyasaskaradyatha na shshreyasaskaradyatha no vyavasayayat || ''shvaya purushaya bheshajam
    | sukha mpushtivardhanam | urvarukamiva bandhananmrityormukshiya ma ''mritat | tryambakam mpativedanam
    | urvarukamiva bandhanadito mukshiya mamutah || || etatte rudravasa ntena paro mujavato ''tihi | avatatadhanva
    pinakavasah krittivasa ahigmsanna njamadagneh kashyapasya tryayusham | yaddeveshu tryayusha ntanno
    astu tryayusham || || shivo namasi svadhitiste pita namaste astu ma ma higmsih | nivartayamyayushe
    ''nnadyaya prajananaya rayasposhaya suprajastvaya suviryaya || jata''dhyayah harih om ugrashca bhimashca
    dhvantashca dhunishca | sasahvamshcabhiyugva ca vikshipa || agnigm hridayenashanigm hridayagrena pashupatim
    kritsnahridayena bhavam mmatasnabhyamishana mmanyuna mahadevamantah par va~nishthuna vasishthahanuh
    shingini koshyabhyam || llo~hitena mitragm sauvratyena rudra ndaurvratyenendram prakridena maruto
    balena sadhyanpramuda | bhavasya kanthyagm rudrasyantah par mmahadevasya yakriccharvasya vanishthuh
    pashupateh puritat || ssvaha tvace svaha tvace svaha lohitaya svaha lohitaya svaha medobhya ssvaha
    | magmsebhya ssvaha magmsebhya ssvaha snavabhya ssvaha snavabhya ssvaha | retase svaha payave svaha
    || || ayasaya svaha prayasaya svaha sam ya~saya svaha viyasaya svahodyasaya svaha | shuce svaha shocate
    svaha shocamanaya svaha shokaya svaha || || tapase svaha tapyate svaha tapyamanaya svaha taptaya svaha
    gharmaya svaha | nishkrityai svaha prayashcittyai svaha bheshajaya svaha || || yamaya svahantakaya
    svaha mrityave svaha brahmane svaha brahmahatyayai svaha | vishvebhyo devebhya ssvaha dyavaprithivibhyagm
    svaha || harih om vajashca me prasavashca me prayatishca me prasitishca me dhitishca me kratushca
    me svarashca me shlokashca me shravashca me shrutishca me jyotishca me svashca me yajnena kalpantam
    || ''panashca me vyanashca me nca me vakca me manashca me cakshushca me shrotram ca me dakshashca
    me balam ca me yajnena kalpantam || || ojashca me sahashca ma atma ca me tanushca me sharma ca me
    varma ca me ''sthini ca me parugmshi ca me sharirani ca ma ayushca me jara ca me yajnena kalpantam
    || nca me manyushca me bhamashca me ''mbhashca me jema ca me mahima ca me varima ca me prathima ca
    me var shima ca me draghima ca me vriddha nca me vriddhishca me yajnena kalpantam || nca me shraddha
    ca me jagacca me dhanam ca me vishvam ca me mahashca me krida ca me modashca me jata nca me yajnena
    kalpantam || ''namayacca me jivatushca me dirghayutva nca me sushashca me sudinam ca me yajnena kalpantam
    || || yanta ca me dharta ca me kshemashca me dhritishca me vishvam ca me mahashca me samvicca me jnatram
    ca me sushca me prasushaca me siram ca me layashca me yajnena kalpantam || nca me mayashca me priya
    ''nukamashca me kamashca me saumanasashca me bhagashca me dravina nca me shreyashca me vasiyashca
    me yashashca me yajnena kalpantam || || urkca me sunrita ca me payashca me rasashca me ghrita nca
    me madhu ca me sagdhishca me sapitishca me krishishca me vrishtishca me jaitram ca ma audbhidya nca
