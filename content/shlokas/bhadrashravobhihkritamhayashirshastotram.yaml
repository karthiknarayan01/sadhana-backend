id: bhadrashravobhihkritamhayashirshastotram
category: stotram
name:
  english: bhadrashravobhihkritamhayashirshastotram
  devanagari: भद्रश्रवोभिःकृतंहयशीर्षस्तोत्रम्
content:
  english: bhadrashravasa ucuh | om namo bhagavate dharmayatmavishodhanaya nama iti || 2|| aho vicitram
    bhagavadviceshtitam ghnantam jano'yam hi mishanna pashyati | dhyayannasadyarhi vikarma sevitum nirhritya
    putram pitaram jijivishati || 3|| vadanti vishvam kavayah sma nashvaram pashyanti cadhyatmavido vipashcitah
    | tathapi muhyanti tavaja mayaya suvismitam krityamajam nato'smi tam || 4|| vishvodbhavasthananirodhakarma
    te hyakarturangikritamapyapavritah | yuktam na citram tvayi karyakarane sarvatmani vyatirikte ca vastutah
    || 5|| vedan yugante tamasa tiraskritan rasataladyo nriturangavigrahah | pratyadade vai kavaye'bhiyacate
    tasmai namaste'vitathehitaya iti || 6|| iti shrimadbhagavatamahapurane pancamaskandhe ashtadashadhyayantargatam
    bhadrashravobhih kritam hayashirshastotram samaptam | bhagavatapurana | adhyaya 5
  devanagari: भद्रश्रवस ऊचुः । ॐ नमो भगवते धर्मायात्मविशोधनाय नम इति ॥ २॥ अहो विचित्रं भगवद्विचेष्टितं
    घ्नन्तं जनोऽयं हि मिषन्न पश्यति । ध्यायन्नसद्यर्हि विकर्म सेवितुं निर्हृत्य पुत्रं पितरं जिजीविषति
    ॥ ३॥ वदन्ति विश्वं कवयः स्म नश्वरं पश्यन्ति चाध्यात्मविदो विपश्चितः । तथापि मुह्यन्ति तवाज मायया सुविस्मितं
    कृत्यमजं नतोऽस्मि तम् ॥ ४॥ विश्वोद्भवस्थाननिरोधकर्म ते ह्यकर्तुरङ्गीकृतमप्यपावृतः । युक्तं न चित्रं
    त्वयि कार्यकारणे सर्वात्मनि व्यतिरिक्ते च वस्तुतः ॥ ५॥ वेदान् युगान्ते तमसा तिरस्कृतान् रसातलाद्यो
    नृतुरङ्गविग्रहः । प्रत्याददे वै कवयेऽभियाचते तस्मै नमस्तेऽवितथेहिताय इति ॥ ६॥ इति श्रीमद्भागवतमहापुराणे
    पञ्चमस्कन्धे अष्टादशाध्यायान्तर्गतं भद्रश्रवोभिः कृतं हयशीर्षस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय
    ५
