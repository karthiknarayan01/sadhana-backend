id: mukambika1000str-2
category: sahasranama
name:
  english: mukambika1000str
  devanagari: मूकाम्बिका१०००स्त्र्
content:
  english: bhasvan mukhambujakiritayutam trinetram | shankharyabhitivaravaryakaram manojnam mukambikam
    munisura'bhayadam smarami || 1|| pramatta madhukaitabhau mahishadanavam ya'vadhit sadhumranayanahvayau
    sabalacandamundavapi | saraktadanujau bhayankaranishubhashumbhasurau asau | bhagavati sada hridi vibhatu
    mukambika || 2|| prapannajanakamadam prabalamukadarpapaham anushnasukaladharam aridarabhayeshtanvitam
    | tatidvisarabhasuram kutajashailamulashritam | asheshavibhudhatmikam anubhajami mukambikam || 3||
    || lamityadi pancapuja || shri markandeya uvaca | shrim hrim aim om | om mukambika mukamata mukavagbhutidayini
    | mahalakshmih mahadevi maharajyapradayini || 1|| mahodaya maharupa manya mahitavikrama | manuvandya
    maheshvasa mantrivarya manasvini || 2|| menakatanaya mata mahita matripujita | mahati marajanani mritasanjivini
    matih || 3|| mahaniya madollasa mandarakusumaprabha | madhavi mallikapujya malayacalavasini || 4||
    mahankabhagini murta mahasarasvataprada | martyalokashraya manyuh matida mokshadayini || 5|| mahapujya
    makhaphalaprada maghavadashraya | maricimarutapranah manujyeshtha mahaushadhih || 6|| mahakarunika
    muktabharana mangalaprada | manimanikyashobhadhya madahina madotkata || 7|| mahabhagyavati mandasmita
    manmathasevita | mayavidyamayi manjubhashini madalalasa || 8|| mridani mrityumathini mridubhasha mridapriya
    | mantrajna mitrasankasha munih mahishamardini || 9|| mahodaya mahoraska mrigadrishtih maheshvari
    | mrinalashitala mrityuh merumandaravasini || 10|| medhya matangagamana mahamarisvarupini | meghashyama
    meghanada minakshi madanakritih || 11|| manonmayi mahamaya mahishasuramokshada | menakavandita menya
    munivanditapaduka || 12|| mrityuvandya mrityudatri mohini mithunakritih | maharupa mohitangi munimanasasamsthita
    || 13|| mohanakaravadana musalayudhadharini | maricimala manikyabhushana mandagamini || 14|| mahishi
    marutagatih mahalavanyashalini | mridanganadini maitri madiramodalalasa || 15|| mayamayi mohanasha
    munimanasamandira | martandakotikirana mithyajnananivarini || 16|| mrigankavadana margadayini mriganabhidhrik
    | mandamarutasamsevya mandaratarumulaga || 17|| mandahasa madakari madhupanasamudyata madhura | madhavanuta
    madhavi madhavarcita || 18|| martandakotijanani martandagatidayini | mrinalamurtih mayavi mahasamrajyadayini
    || 19|| kanta kantamukhi kali kacanirjitabhringika | kanjakshi kanjavadana kasturitilakojjvala ||
    20|| kalikakaravadana karpuramodasamyuta | kokilalapasangita kanakakritibimbabhrit || 21|| kambukanthi
    kanjahara kalidoshavinashini | kancukadhya kanjarupa kancibhushanarajita || 22|| kanthiravajitamadhya
    kancidamavibhushita | kritakinkinikashobha kancanasravinivika || 23|| kancanottamashobhadhya kanakaklriptapaduka
    | kanthiravasamasina kanthiravaparakrama || 24|| kalyani kamala kamya kamaniya kalavati | kritih kalpataruh
    kirtih kutajacalavasini || 25|| kavipriya kavyalola kapardirucirakritih | kanthiravadhvaja kamarupa
    kamitadayini || 26|| krishanuh keshavanuta kritaprajna krishodari | koshadhishvarasamsevya krishakarshitapataka
    || 27|| karindragamini keḻi kumari kalabhashini | kalidoshahara kashtha karavirasumapriya || 28||
  devanagari: भास्वन् मुखाम्बुजकिरीटयुतां त्रिनेत्राम् । शङ्खार्यभीतिवरवर्यकरां मनोज्ञां मूकाम्बिकां मुनिसुराऽभयदां
    स्मरामि ॥ १॥ प्रमत्त मधुकैटभौ महिषदानवं याऽवधीत् सधूम्रनयनाह्वयौ सबलचण्डमुण्डावपि । सरक्तदनुजौ भयङ्करनिशुभशुम्भासुरौ
    असौ । भगवती सदा हृदि विभातु मूकाम्बिका ॥ २॥ प्रपन्नजनकामदां प्रबलमूकदर्पापहां अनुष्णसुकलाधरां अरिदराभयेष्टान्विताम्
    । तटिद्विसरभासुरां कुटजशैलमूलाश्रितां । अशेषविभुधात्मिकां अनुभजामि मूकाम्बिकाम् ॥ ३॥ ॥ लमित्यादि पञ्चपूजा
    ॥ श्री मार्कण्डेय उवाच । श्रीं ह्रीं ऐं ॐ । ॐ मूकाम्बिका मूकमाता मूकवाग्भूतिदायिनी । महालक्ष्मीः महादेवी
    महाराज्यप्रदायिनी ॥ १॥ महोदया महारूपा मान्या महितविक्रमा । मनुवन्द्या महेष्वासा मन्त्रिवर्या मनस्विनी
    ॥ २॥ मेनकातनया माता महिता मातृपूजिता । महती मारजननी मृतसञ्जीविनी मतिः ॥ ३॥ महनीया मदोल्लासा मन्दारकुसुमप्रभा
    । माधवी मल्लिकापूज्या मलयाचलवासिनी ॥ ४॥ महाङ्कभगिनी मूर्ता महासारस्वतप्रदा । मर्त्यलोकाश्रया मन्युः
    मतिदा मोक्षदायिनी ॥ ५॥ महापूज्या मखफलप्रदा मघवदाश्रया । मरीचिमारुतप्राणाः मनुज्येष्ठा महौषधिः ॥ ६॥
    महाकारुणिका मुक्ताभरणा मङ्गलप्रदा । मणिमाणिक्यशोभाढ्या मदहीना मदोत्कटा ॥ ७॥ महाभाग्यवती मन्दस्मिता
    मन्मथसेविता । मायाविद्यामयी मञ्जुभाषिणी मदलालसा ॥ ८॥ मृडाणी मृत्युमथिनी मृदुभाषा मृडप्रिया । मन्त्रज्ञा
    मित्रसङ्काशा मुनिः महिषमर्दिनी ॥ ९॥ महोदया महोरस्का मृगदृष्टिः महेश्वरी । मृनालशीतला मृत्युः मेरुमन्दरवासिनी
    ॥ १०॥ मेध्या मातङ्गगमना महामारीस्वरूपिणी । मेघश्यामा मेघनादा मीनाक्षी मदनाकृतिः ॥ ११॥ मनोन्मयी महामाया
    महिषासुरमोक्षदा । मेनकावन्दिता मेन्या मुनिवन्दितपादुका ॥ १२॥ मृत्युवन्द्या मृत्युदात्री मोहिनी मिथुनाकृतिः
    । महारूपा मोहिताङ्गी मुनिमानससंस्थिता ॥ १३॥ मोहनाकारवदना मुसलायुधधारिणी । मरीचिमाला माणिक्यभूषणा मन्दगामिनी
    ॥ १४॥ महिषी मारुतगतिः महालावण्यशालिनी । मृदङ्गनादिनी मैत्री मदिरामोदलालसा ॥ १५॥ मायामयी मोहनाशा मुनिमानसमन्दिरा
    । मार्ताण्डकोटिकिरणा मिथ्याज्ञाननिवारिणी ॥ १६॥ मृगाङ्कवदना मार्गदायिनी मृगनाभिधृक् । मन्दमारुतसंसेव्या
    मन्दारतरुमूलगा ॥ १७॥ मन्दहासा मदकरी मधुपानसमुद्यता मधुरा । माधवनुता माधवी माधवार्चिता ॥ १८॥ मार्ताण्डकोटिजननी
    मार्ताण्डगतिदायिनी । मृणालमूर्तिः मायावी महासाम्राज्यदायिनी ॥ १९॥ कान्ता कान्तमुखी काली कचनिर्जितभृङ्गिका
    । कञ्जाक्षी कञ्जवदना कस्तूरीतिलकोज्ज्वला ॥ २०॥ कलिकाकारवदना कर्पूरामोदसंयुता । कोकिलालापसङ्गीता कनकाकृतिबिम्बभृत्
    ॥ २१॥ कम्बुकण्ठी कञ्जहारा कलिदोषविनाशिनी । कञ्चुकाढ्या कञ्जरूपा काञ्चीभूषणराजिता ॥ २२॥ कण्ठीरवजितामध्या
    काञ्चीदामविभूषिता । कृतकिङ्किणिकाशोभा काञ्चनस्राविनीविका ॥ २३॥ काञ्चनोत्तमशोभाढ्या कनकाक्लृप्तपादुका
    । कण्ठीरवसमासीना कण्ठीरवपराक्रमा ॥ २४॥ कल्याणी कमला काम्या कमनीया कलावती । कृतिः कल्पतरुः कीर्तिः
    कुटजाचलवासिनी ॥ २५॥ कविप्रिया काव्यलोला कपर्दीरुचिराकृतिः । कण्ठीरवध्वजा कामरूपा कामितदायिनी ॥ २६॥
    कृषाणुः केशवनुता कृतप्रज्ञा कृशोदरी । कोशाधीश्वरसंसेव्या कृशाकर्षितपातका ॥ २७॥ करीन्द्रगामिनी केळी
    कुमारी कलभाषिणी । कलिदोषहरा काष्ठा करवीरसुमप्रिया ॥ २८॥
