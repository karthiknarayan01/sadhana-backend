id: subrahmanya-aparadha-kshamapana-stotram
category: stotram
name:
  english: Subrahmanya Aparadha Kshamapana Stotram
content:
  english: namaste namaste guha tarakare namaste namaste guha shaktipane | namaste namaste guha divyamurte
    kshamasva kshamasva samastaparadham || || namaste namaste guha danavare namaste namaste guha carumurte
    | namaste namaste guha punyamurte kshamasva kshamasva samastaparadham || || namaste namaste maheshatmaputra
    namaste namaste mayurasanastha | namaste namaste sarorbhuta deva kshamasva kshamasva samastaparadham
    || || namaste namaste svayam jyotirupa namaste namaste param jyotirupa | namaste namaste jagam jyotirupa
    kshamasva kshamasva samastaparadham || || namaste namaste guha manjugatra namaste namaste guha saccaritra
    | namaste namaste guha bhaktamitra kshamasva kshamasva samastaparadham || || namaste namaste guha
    lokapala namaste namaste guha dharmapala | namaste namaste guha satyapala kshamasva kshamasva samastaparadham
    || || namaste namaste guha lokadipa namaste namaste guha bodharupa | namaste namaste guha ganalola
    kshamasva kshamasva samastaparadham || || namaste namaste mahadevasuno namaste namaste mahamohaharin
    | namaste namaste maharogaharin kshamasva kshamasva samastaparadham || || iti shri subrahmanya aparadhakshamapana
    stotram ||
  devanagari: नमस्ते नमस्ते गुह तारकारे नमस्ते नमस्ते गुह शक्तिपाणे । नमस्ते नमस्ते गुह दिव्यमूर्ते क्षमस्व
    क्षमस्व समस्तापराधम् ॥ ॥ नमस्ते नमस्ते गुह दानवारे नमस्ते नमस्ते गुह चारुमूर्ते । नमस्ते नमस्ते गुह
    पुण्यमूर्ते क्षमस्व क्षमस्व समस्तापराधम् ॥ ॥ नमस्ते नमस्ते महेशात्मपुत्र नमस्ते नमस्ते मयूरासनस्थ
    । नमस्ते नमस्ते सरोर्भूत देव क्षमस्व क्षमस्व समस्तापराधम् ॥ ॥ नमस्ते नमस्ते स्वयं ज्योतिरूप नमस्ते
    नमस्ते परं ज्योतिरूप । नमस्ते नमस्ते जगं ज्योतिरूप क्षमस्व क्षमस्व समस्तापराधम् ॥ ॥ नमस्ते नमस्ते
    गुह मञ्जुगात्र नमस्ते नमस्ते गुह सच्चरित्र । नमस्ते नमस्ते गुह भक्तमित्र क्षमस्व क्षमस्व समस्तापराधम्
    ॥ ॥ नमस्ते नमस्ते गुह लोकपाल नमस्ते नमस्ते गुह धर्मपाल । नमस्ते नमस्ते गुह सत्यपाल क्षमस्व क्षमस्व
    समस्तापराधम् ॥ ॥ नमस्ते नमस्ते गुह लोकदीप नमस्ते नमस्ते गुह बोधरूप । नमस्ते नमस्ते गुह गानलोल क्षमस्व
    क्षमस्व समस्तापराधम् ॥ ॥ नमस्ते नमस्ते महादेवसूनो नमस्ते नमस्ते महामोहहारिन् । नमस्ते नमस्ते महारोगहारिन्
    क्षमस्व क्षमस्व समस्तापराधम् ॥ ॥ इति श्री सुब्रह्मण्य अपराधक्षमापण स्तोत्रम् ॥
