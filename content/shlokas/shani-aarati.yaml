id: shani-aarati
category: stotram
name:
  english: Shani Aarati
content:
  english: jaya jaya shri shanideva bhaktana hitakari | surya putra prabhu chaya mahatari || jaya jaya
    shri shani deva | shyama anga vakra drishti caturbhuja dhari | ni lambara dhara natha gaja ki asavari
    || jaya jaya shri shani deva | krita mukuta shisha rajita dipata hai lilari | muktana ki mala gale
    shobhita balihari || jaya jaya shri shani deva | modaka mishthana pana carhata haim supari | loha
    tila tela urada mahishi ati pyari || jaya jaya shri shani deva | deva danuja rishi muni sumirata nara
    nari | vishvanatha dharata dhyana sharana haim tumhari || jaya jaya shri shani deva bhaktana hitakari
    || jaya jaya shri shani deva |
  devanagari: जय जय श्री शनिदेव भक्तन हितकारी । सूर्य पुत्र प्रभु छाया महतारी ॥ जय जय श्री शनि देव । श्याम
    अङ्ग वक्र दृष्टि चतुर्भुजा धारी । नी लाम्बर धार नाथ गज की असवारी ॥ जय जय श्री शनि देव । क्रीट मुकुट
    शीश राजित दिपत है लिलारी । मुक्तन की माला गले शोभित बलिहारी ॥ जय जय श्री शनि देव । मोदक मिष्ठान पान
    चढ़त हैं सुपारी । लोहा तिल तेल उड़द महिषी अति प्यारी ॥ जय जय श्री शनि देव । देव दनुज ऋषि मुनि सुमिरत
    नर नारी । विश्वनाथ धरत ध्यान शरण हैं तुम्हारी ॥ जय जय श्री शनि देव भक्तन हितकारी ॥ जय जय श्री शनि
    देव ।
