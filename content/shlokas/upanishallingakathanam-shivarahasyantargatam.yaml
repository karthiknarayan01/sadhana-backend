id: upanishallingakathanam-shivarahasyantargatam
category: upanishad
name:
  english: upanishallingakathanam (shivarahasyantargatam)
  devanagari: उपनिषल्लिङ्गकथनम् (शिवरहस्यान्तर्गतम्)
content:
  english: rinvanto'pi shive lingam na vidurbahavo'pi ye || 83|| ashcaryavatpashyati kashcidetadashcaryavacchrinute
    taccalingam | ashcaryavadbodhate yam tathanye hyashcaryavatpashyati taccalingam || 84|| na pranena
    napanena lingahino na jivati || 85|| ajamekam lohitashuklrikrishnam bahvim prajam janayantim sarupam
    | ajo lingi jushamano'nushete jahatyenam lingasamsthassa atma || 86|| tallingamare drashtavyam shrotavyam
    vedaparvataih | purishayam ca tallingam sarvabhuteshu samsthitam || 87|| kohyevanyancakahpranyallingahinomaheshvari
    | rasohyeshamahalingarasa esho'mbikesada || 88|| etaddhi paramanandam lingametatsvayam prabham ||
    89|| yasmatparam naparamasti kincidyasmannaniyo na jyayo'sti kishcit | vriksha iva stabdhandivi tishthati
    lingamekam tenedam purnam lingabhasaikasarvam || 90|| lingadvaco nivartante hyaprapya manasa saha
    | tadatyatishthaddeveshi brahmandordhvangulam tatam || 91|| tasminbhati svayam lingam candrasuryagnayo
    na hi | bhati tattejasa vyaptam jagadetaccaracaram || 92|| yatha kshetrajnavihitam hi bhumau guhahitam
    tacca lingam mahantam | hiranyam na vindanti cordhvam carantastathedam prapashyambike lingametat ||
    93|| jagratsvapnasushuptishu yallingam manasa tatam | tadetadahamiti jnatva lingi lingatigo bhaveta
    || 94|| yathornanabhissrijate tantujalam grihnati vaktrena tathatti sarvam | tatha jagajjalamidam
    hi lingato bhavatyato'nte vilayam prayati || 95|| brahmaiva tallingamidam sanatanam svavidyaya samsarate
    ca mucyate | tadetallingam tapasa veditavyam nanyairdharmaistacca lingam tvalingam || 96|| tadeva
    lingam tvavimukte nivishtam bhutatigam vishvanathabhidham ca | varanasyam bhruyuge sannivishtam yogaih
    pashyanti tatra te cotkramanti || 97|| tatraiva tesham tarakam copadeshamonkaradyam pranavam brahmamantram
    | na tasya prano'nutkramativa devi tallingasangam bhavatityalingam || 98|| daharadvistaram tacca suryamandalamanditam
    | candrakotisahasrabham tadrishyam sarvadha shive || 104|| yogenatmanusandhanairvitamohabhayaissada
    || 105|| vedantavijnanasunishcitarthaissanyasayogairyatibhishshuddhabuddhaih | teshamevaitadvirajam
    lingadhama prapyaprapteshcaviduram shive'dya || 106|| naisha tarkena matirapaneya kshuropamam lingametaddhi
    satyam | rico akshare parame tatpravishtam sargadihinam mahalingametat || 107|| suradyairdurapam tathayogibhih
    karmabhishcapyavashyam | tallingatyagena sarvadha vitamoho bhavatyavashyam shrutiguhyametat || 108||
    yo navirato dushcaratitannashanto nasamahitah | tasyaitaddurlabham lingamasaktasyaiva sarvagam ||
    109|| yesham na jihmamanritam sadaiva tesham lingam hridi bhatyeva shantam | ato lingam pujayedatmakamo
    na kamakami lingapujadhikari || 110|| etadartham gudhatamam maheshi nanye vindanti jnananishtha hi
    bhuyah | na va deshiko naiva shishyah kadacinna puja na pujyo na va pujakatvam || 111|| svadoshatpradosho'pi
    nastyeva linge jagannaiva shesham visheshadbhavani | mahasheshabhushavishesho'pinatra sadoshakaraparamaulirna
    caiva || 112|| || iti shivarahasyantargate maheshvarakhye shivagaurisamvade upanishallingakathanam
    ||
  devanagari: ृण्वन्तोऽपि शिवे लिङ्गं न विदुर्बहवोऽपि ये ॥ ८३॥ आश्चर्यवत्पश्यति कश्चिदेतदाश्चर्यवच्छृणुते
    तच्चलिङ्गम् । आश्चर्यवद्बोधते यं तथान्ये ह्याश्चर्यवत्पश्यति तच्चलिङ्गम् ॥ ८४॥ न प्राणेन नापानेन लिङ्गहीनो
    न जीवति ॥ ८५॥ अजामेकां लोहितशुक्लृकृष्णां बह्वीं प्रजां जनयन्तीं सरूपाम् । अजो लिङ्गी जुषमाणोऽनुशेते
    जहात्येनां लिङ्गसंस्थस्स आत्मा ॥ ८६॥ तल्लिङ्गमारे द्रष्टव्यं श्रोतव्यं वेदपर्वतैः । पुरीशयं च तल्लिङ्गं
    सर्वभूतेषु संस्थितम् ॥ ८७॥ कोह्येवान्याञ्चकःप्राण्याल्लिङ्गहीनोमहेश्वरि । रसोह्येषमहालिङ्गरस एषोऽम्बिकेसदा
    ॥ ८८॥ एतद्धि परमानन्दं लिङ्गमेतत्स्वयं प्रभम् ॥ ८९॥ यस्मात्परं नापरमस्ति किञ्चिद्यस्मान्नाणीयो न ज्यायोऽस्ति
    किश्चित् । वृक्ष इव स्तब्धन्दिवि तिष्ठति लिङ्गमेकं तेनेदं पूर्णं लिङ्गभासैकसर्वम् ॥ ९०॥ लिङ्गाद्वाचो
    निवर्तन्ते ह्यप्राप्य मनसा सह । तदत्यतिष्ठद्देवेशि ब्रह्माण्डोर्ध्वाङ्गुलं ततम् ॥ ९१॥ तस्मिन्भाति
    स्वयं लिङ्गं चन्द्रसूर्याग्नयो न हि । भाति तत्तेजसा व्याप्तं जगदेतच्चराचरम् ॥ ९२॥ यथा क्षेत्रज्ञविहितं
    हि भूमौ गुहाहितं तच्च लिङ्गं महान्तम् । हिरण्यं न विन्दन्ति चोर्ध्वं चरन्तस्तथेदं प्रपश्याम्बिके लिङ्गमेतत्
    ॥ ९३॥ जाग्रत्स्वप्नसुषुप्तीषु यल्लिङ्गं मनसा ततम् । तदेतदहमिति ज्ञात्वा लिङ्गी लिङ्गातिगो भवेत ॥ ९४॥
    यथोर्णनाभिस्सृजते तन्तुजालं गृह्णाति वक्त्रेण तथात्ति सर्वम् । तथा जगज्जालमिदं हि लिङ्गतो भवत्यतोऽन्ते
    विलयं प्रयाति ॥ ९५॥ ब्रह्मैव तल्लिङ्गमिदं सनातनं स्वविद्यया संसरते च मुच्यते । तदेतल्लिङ्गं तपसा वेदितव्यं
    नान्यैर्धर्मैस्तच्च लिङ्गं त्वलिङ्गम् ॥ ९६॥ तदेव लिङ्गं त्वविमुक्ते निविष्टं भूतातिगं विश्वनाथाभिधं
    च । वाराणस्यां भ्रूयुगे सन्निविष्टं योगैः पश्यन्ति तत्र ते चोत्क्रमन्ति ॥ ९७॥ तत्रैव तेषां तारकं चोपदेशमोङ्काराद्यं
    प्रणवं ब्रह्ममन्त्रम् । न तस्य प्राणोऽनुत्क्रमतीव देवि तल्लिङ्गसङ्गं भवतीत्यलिङ्गम् ॥ ९८॥ दहराद्विस्तरं
    तच्च सूर्यमण्डलमण्डितम् । चन्द्रकोटिसहस्राभं तदृश्यं सर्वधा शिवे ॥ १०४॥ योगेनात्मानुसन्धानैर्वीतमोहभयैस्सदा
    ॥ १०५॥ वेदान्तविज्ञानसुनिश्चितार्थैस्सन्यासयोगैर्यतिभिश्शुद्धबुद्धैः । तेषामेवैतद्विरजं लिङ्गधाम प्राप्यप्राप्तेश्चाविदूरं
    शिवेऽद्य ॥ १०६॥ नैषा तर्केण मतिरापनेया क्षुरोपमं लिङ्गमेतद्धि सत्यम् । ऋचो अक्षरे परमे तत्प्रविष्टं
    सर्गादिहीनं महालिङ्गमेतत् ॥ १०७॥ सुराद्यैर्दुरापं तथायोगिभिः कर्मभिश्चाप्यवश्यम् । तल्लिङ्गत्यागेन
    सर्वधा वीतमोहो भवत्यवश्यं श्रुतिगुह्यमेतत् ॥ १०८॥ यो नाविरतो दुश्चरतितान्नाशान्तो नासमाहितः । तस्यैतद्दुर्लभं
    लिङ्गमासक्तस्यैव सर्वगम् ॥ १०९॥ येषां न जिह्ममनृतं सदैव तेषां लिङ्गं हृदि भात्येव शान्तम् । अतो लिङ्गं
    पूजयेदात्मकामो न कामकामी लिङ्गपूजाधिकारी ॥ ११०॥ एतदर्थं गूढतमं महेशि नान्ये विन्दन्ति ज्ञाननिष्ठा
    हि भूयः । न वा देशिको नैव शिष्यः कदाचिन्न पूजा न पूज्यो न वा पूजकत्वम् ॥ १११॥ स्वदोषात्प्रदोषोऽपि
    नास्त्येव लिङ्गे जगन्नैव शेषं विशेषाद्भवानि । महाशेषभूषाविशेषोऽपिनात्र सदोषाकरापारमौलिर्न चैव ॥ ११२॥
    ॥ इति शिवरहस्यान्तर्गते माहेश्वराख्ये शिवगौरीसंवादे उपनिषल्लिङ्गकथनम् ॥
