id: vamadevakavacam
category: kavacha
name:
  english: vamadevakavacam
  devanagari: वामदेवकवचम्
content:
  english: sarvange | atha dhyanam | varakshamala'bhayadhakkahastah sarojakinjalkasamanavarnah | trilocanashcarucaturmukho
    mam payadudicyam dishi vamadevah || om vam shirah patu me devo lalatam hrim sada mama | vamadevah
    pradesham me bijadvayasvarupinam || 1|| hum patu locanadvandvam mukham hrim bijarupinam | hrinkaro
    kanthadelam hrim patu skandhayormama || 2|| vamadevo sada patu bhujau savyetarau mama | hrinkaro hridayam
    patu hrim so'vyadudaram mama || 3|| hrim nabhau patu satatam devo hrinkararupakah | avyanme lingadesham
    ca hrim rakshedgudadeshake || 4|| candrabijam patu padau namah padatalam mama | dashaksharah patu
    nityam sarvangam mama sarvada || 5|| antarbahishca mam patu vamadevashca bhairavah | bhagalingamritaprito
    sarvasandhishu rakshatu || 6|| shankaro mam sada patu mamendriyasamanakam | shivo mamendriyartheshu
    rakshayedakhileshvapi || 7|| vamadevahpashcime'vyadakshine devadattakah | bhagalingamritaprito bhagalingasvarupakah
    || 8|| udicyamurdhvagah patu purve samharabhairavah | digambarah shmashanasthah patu dikshu vidikshu
    ca || 9|| ghoraravattattahaso me shivo tvam sushobhitah | patu vighneshu ghoreshu jagadrudhirabhakshakah
    || 10|| karalavadano ghorah pretakolahalapriyah | muktakeshah sukeshashca madironmattabhairavah ||
    11|| devadatto mahograshca sadashmashanagah parah | shirasah padaparyantam devadatto'vatatsada ||
    12|| itidam kavacam divyam sadhakanam sudurlabham | mantrasiddhikaram sakshanmahadevasya bhashitam
    || 13|| idam kavacamajnatva yojayedvamadevakah | shatalakshaprajapto'pi tasya devo na siddhyate ||
    14|| sa shastraghatamapnoti so'ciranmritumapnuyat | mantrena mriyate yogi rakshayet kavacam param
    || 15|| trisandhyam pathanadasya kavacasya tu parvati | siddhayo'shtau kare tasya mahesha iva caparah
    || 16|| rupena smaratulyo'sau kamininam priyo bhavet | tasmadetatsukavacam na deyam yasyakasyacit
    | bhaktiyuktaya shantaya danashilaya dhimate || 17|| yo dadati sushishyebhyastasya vashyam jagadbhavet
    | guhyadguhyataram guhyam maharudrena bhashitam || 18|| yasya kanthagatam tasya karasthah sarvasiddhayah
    | shrivishvamangalam nama kavacam na prakashayet | rahasyatirahasyam ca gopaniyam svayonivat || 19||
    iti shrirudrayamaletantre shrivishvamangalam nama vamadevakavacam sampurnam ||
  devanagari: सर्वाङ्गे । अथ ध्यानम् । वरक्षमालाऽभयढक्कहस्तः सरोजकिञ्जल्कसमानवर्णः । त्रिलोचनश्चारुचतुर्मुखो
    मां पयादुदीच्यां दिशि वामदेवः ॥ ॐ वां शिरः पातु मे देवो ललाटं ह्रीं सदा मम । वामदेवः प्रदेशं मे बीजद्वयस्वरूपिणम्
    ॥ १॥ हुं पातु लोचनद्वन्द्वं मुखं ह्रीं बीजरूपिणम् । ह्रीङ्कारो कण्ठदेलं ह्रीं पातु स्कन्धयोर्मम ॥
    २॥ वामदेवो सदा पातु भुजौ सव्येतरौ मम । ह्रीङ्कारो हृदयं पातु ह्रीं सोऽव्यादुदरं मम ॥ ३॥ ह्रीं नाभौ
    पातु सततं देवो ह्रिङ्काररूपकः । अव्यान्मे लिङ्गदेशं च ह्रिं रक्षेद्गुददेशके ॥ ४॥ चन्द्रबीजं पातु पादौ
    नमः पादतलं मम । दशाक्षरः पातु नित्यं सर्वाङ्गं मम सर्वदा ॥ ५॥ अन्तर्बहिश्च मां पातु वामदेवश्च भैरवः
    । भगलिङ्गामृतप्रीतो सर्वसन्धिषु रक्षतु ॥ ६॥ शङ्करो मां सदा पातु ममेन्द्रियसमानकम् । शिवो ममेन्द्रियार्थेषु
    रक्षयेदखिलेष्वपि ॥ ७॥ वामदेवःपश्चिमेऽव्यादक्षिणे देवदत्तकः । भगलिङ्गामृतप्रीतो भगलिङ्गस्वरूपकः ॥ ८॥
    उदीच्यामूर्ध्वगः पातु पूर्वे संहारभैरवः । दिगम्बरः श्मशानस्थः पातु दिक्षु विदिक्षु च ॥ ९॥ घोररावाट्टाट्टहासो
    मे शिवो त्वं सुशोभितः । पातु विघ्नेषु घोरेषु जगद्रुधिरभक्षकः ॥ १०॥ करालवदनो घोरः प्रेतकोलाहलप्रियः
    । मुक्तकेशः सुकेशश्च मदिरोन्मत्तभैरवः ॥ ११॥ देवदत्तो महोग्रश्च सदाश्मशानगः परः । शिरसः पादपर्यन्तं
    देवदत्तोऽवतात्सदा ॥ १२॥ इतीदं कवचं दिव्यं साधकानां सुदुर्लभम् । मन्त्रसिद्धिकरं साक्षान्महादेवस्य
    भाषितम् ॥ १३॥ इदं कवचमज्ञात्वा योजयेद्वामदेवकः । शतलक्षप्रजप्तोऽपि तस्य देवो न सिद्ध्यते ॥ १४॥ स शस्त्रघातमाप्नोति
    सोऽचिरन्मृतुमाप्नुयात् । मन्त्रेण म्रियते योगी रक्षयेत् कवचं परम् ॥ १५॥ त्रिसन्ध्यं पठनादस्य कवचस्य
    तु पार्वति । सिद्धयोऽष्टौ करे तस्य महेश इव चापरः ॥ १६॥ रूपेण स्मरतुल्योऽसौ कामिनीनां प्रियो भवेत्
    । तस्मादेतत्सुकवचं न देयं यस्यकस्यचित् । भक्तियुक्ताय शान्ताय दानशीलाय धीमते ॥ १७॥ यो ददाति सुशिष्येभ्यस्तस्य
    वश्यं जगद्भवेत् । गुह्याद्गुह्यतरं गुह्यं महारुद्रेण भाषितम् ॥ १८॥ यस्य कण्ठगतं तस्य करस्थाः सर्वसिद्धयः
    । श्रीविश्वमङ्गलं नाम कवचं न प्रकाशयेत् । रहस्यातिरहस्यं च गोपनीयं स्वयोनिवत् ॥ १९॥ इति श्रीरुद्रयामलेतन्त्रे
    श्रीविश्वमङ्गलं नाम वामदेवकवचं सम्पूर्णम् ॥
