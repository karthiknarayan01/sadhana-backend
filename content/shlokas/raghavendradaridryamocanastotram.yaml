id: raghavendradaridryamocanastotram
category: stotram
name:
  english: raghavendradaridryamocanastotram
  devanagari: राघवेन्द्रदारिद्र्यमोचनस्तोत्रम्
content:
  english: shriraghavendradaridryamocanastotram shritanam padam te sakalavidhaya shokaharanah tvamevamba
    tatastvamasi mama mitram saralahrit | pradatum svacchandam dravinamanrinam vatsala guro kalatradyaih
    sakam satatamanubhoktum ca vitara || 1|| ratam va dushtarye tyajati sutamamba kimu pita kripam kritva
    shishnodarakritamahagasyapi mayi | pradatum svacchandam dravinamanrinam vatsala guro kalatradyaih
    sakam satatamanubhoktum ca vitara || 2|| ghanagho va dino vavayavavikalo vakshavikalah prapannashcetpadam
    tava sukhayasityagamamaham | pradatum svacchandam dravinamanrinam vatsala guro kalatradyaih sakam
    satatamanubhoktum ca vitara || 3|| vadanyat tvadbhumau divi surabhikalpadrumadrishadam laghutvam jane'ham
    vitaranamidam vikshya bhavatah | pradatum svacchandam dravinamanrinam vatsala guro kalatradyaih sakam
    satatamanubhoktum ca vitara || 4|| dravatkarunya shriparimalasamudgarihridaya tvadanyo data cedbhavati
    kathamayami vada me | pradatum svacchandam dravinamanrinam vatsala guro kalatradyaih sakam satatamanubhoktum
    ca vitara || 5|| yathashaktya''radhya prasabhamamaranapyatha naran vrajan desham desham shramajanirabhuvam
    na ca dhani | pradatum svacchandam dravinamanrinam vatsala guro kalatradyaih sakam satatamanubhoktum
    ca vitara || 6|| na badhante dara kimidamadhuna me priya dishe
  devanagari: श्रीराघवेन्द्रदारिद्र्यमोचनस्तोत्रम् श्रितानां पादं ते सकलविधया शोकहरणः त्वमेवाम्बा तातस्त्वमसि
    मम मित्रं सरलहृत् । प्रदातुं स्वच्छन्दं द्रविणमनृणं वत्सल गुरो कलत्राद्यैः साकं सततमनुभोक्तुं च वितर
    ॥ १॥ रतं वा दुष्टार्ये त्यजति सुतमम्बा किमु पिता कृपां कृत्वा शिश्नोदरकृतमहागस्यपि मयि । प्रदातुं
    स्वच्छन्दं द्रविणमनृणं वत्सल गुरो कलत्राद्यैः साकं सततमनुभोक्तुं च वितर ॥ २॥ घनाघो वा दीनो वावयवविकलो
    वाक्षविकलः प्रपन्नश्चेत्पादं तव सुखयसीत्यागममहम् । प्रदातुं स्वच्छन्दं द्रविणमनृणं वत्सल गुरो कलत्राद्यैः
    साकं सततमनुभोक्तुं च वितर ॥ ३॥ वदान्यात् त्वद्भूमौ दिवि सुरभिकल्पद्रुमदृषदां लघुत्वं जानेऽहं वितरणमिदं
    वीक्ष्य भवतः । प्रदातुं स्वच्छन्दं द्रविणमनृणं वत्सल गुरो कलत्राद्यैः साकं सततमनुभोक्तुं च वितर ॥
    ४॥ द्रवत्कारुण्य श्रीपरिमलसमुद्गारिहृदय त्वदन्यो दाता चेद्भवति कथमायामि वाद मे । प्रदातुं स्वच्छन्दं
    द्रविणमनृणं वत्सल गुरो कलत्राद्यैः साकं सततमनुभोक्तुं च वितर ॥ ५॥ यथाशक्त्याऽऽराध्य प्रसभममरानप्यथ
    नरान् व्रजन् देशं देशं श्रमजनिरभूवं न च धनी । प्रदातुं स्वच्छन्दं द्रविणमनृणं वत्सल गुरो कलत्राद्यैः
    साकं सततमनुभोक्तुं च वितर ॥ ६॥ न बाधन्ते दारा किमिदमधुना मे प्रिय दिशे
