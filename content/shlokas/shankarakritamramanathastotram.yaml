id: shankarakritamramanathastotram
category: stotram
name:
  english: shankarakritamramanathastotram
  devanagari: शन्करकृतंरामनाथस्तोत्रम्
content:
  english: shankarakritam ramanathastotram shankara uvaca | namami rudramishanam ramanathamumapatim ||
    102|| pahi mam kripaya deva brahmahatyam dahashu me | tripuraghna mahadeva kalakutavishadana || 103||
    raksha mam tvam dayasindho strihatyam me vimocaya | gangadhara virupaksha ramanatha trilocana || 104||
    mam palaya kripadrishtya chindhi matpatakam vibho | kamare kamasandayinbhaktanam raghaveshvara ||
    105|| kataksham pataya mayi shuddham mam kuru dhurjate | markandeyabhayatranamrityunjaya shivavyaya
    || 106|| namaste girijardhaya nishpapam kuru mam sada | rudrakshamalabharana candrashekhara shankara
    || 107|| vedoktasamyagacarayogyam mam kuru te namah | suryadantabhide tubhyam bharatinasikacchide
    || 108|| rameshvaraya devaya namo me shuddhido bhava | anandam saccidanandam ramanatham vrishadhvajam
    || 109|| bhuyo bhuyo namasyami patakam me vinashyatu || iti shriskandapurane brahmakhande setukhande
    ashtacatvarimsha
  devanagari: शङ्करकृतं रामनाथस्तोत्रम् शङ्कर उवाच । नमामि रुद्रमीशानं रामनाथमुमापतिम् ॥ १०२॥ पाहि मां
    कृपया देव ब्रह्महत्यां दहाशु मे । त्रिपुरघ्न महादेव कालकूटविषादन ॥ १०३॥ रक्ष मां त्वं दयासिन्धो स्त्रीहत्यां
    मे विमोचय । गङ्गाधर विरूपाक्ष रामनाथ त्रिलोचन ॥ १०४॥ मां पालय कृपादृष्ट्या छिन्धि मत्पातकं विभो ।
    कामारे कामसन्दायिन्भक्तानां राघवेश्वर ॥ १०५॥ कटाक्षं पातय मयि शुद्धं मां कुरु धूर्जटे । मार्कण्डेयभयत्राणमृत्युञ्जय
    शिवाव्यय ॥ १०६॥ नमस्ते गिरिजार्धाय निष्पापं कुरु मां सदा । रुद्राक्षमालाभरण चन्द्रशेखर शङ्कर ॥ १०७॥
    वेदोक्तसम्यगाचारयोग्यं मां कुरु ते नमः । सूर्यदन्तभिदे तुभ्यं भारतीनासिकाच्छिदे ॥ १०८॥ रामेश्वराय
    देवाय नमो मे शुद्धिदो भव । आनन्दं सच्चिदानन्दं रामनाथं वृषध्वजम् ॥ १०९॥ भूयो भूयो नमस्यामि पातकं मे
    विनश्यतु ॥ इति श्रीस्कन्दपुराणे ब्रह्मखण्डे सेतुखण्डे अष्टचत्वारिंशा
meaning: {}
