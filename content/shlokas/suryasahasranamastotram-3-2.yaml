id: suryasahasranamastotram-3-2
category: sahasranama
name:
  english: suryasahasranamastotram 3
  devanagari: सूर्यसहस्रनामस्तोत्रम् ३
content:
  english: rinu param suryasya ca mahatmanah | uttamam namasahasram yattamaste nikrintati || brihaspatissabhagavanityuktasuryavarcasam
    | dhyatva narayanam devam bhanumandalamadhyagam || atha shrisuryasahasranamastotram | om adityashcadidevo'yam
    bhaskaro bhavanashanah | vishvamurtirvishvaneta cinmurtishcintitarthadah || 1|| sadyojato vamadevassarvapapavinashakah
    | vedyo vaidyassadayogi vishvakarma vibhavasuh || 2|| virincirvishrutatma ca vishvasargapravartakah
    | vidyatma vishayajnashca vishvatma vishvapapaha || 3|| vidushamishvaro vidvanvishvaneta visheshavit
    | viraha vishayashshunyo valakhilyadivanditah || 4|| vamano varadah pramshurvasudevassanatanah | valakhilyapurogashca
    varido vasumanvasuh || 5|| varenyo vasudevashca vasureta vasupradah | vayurvacaspatirvishvam vishnurvishvamareshvarah
    || 6|| onkarashca vashatkarah somagrahapurogamah | grahanakshatramali ca shimshumarashariravan ||
    7|| sharanyashshankarashshambhuh kalatma kantivardhanah || kamadevah kamaharta viradvirasanasthitah
    || 8|| vistarabhuma bhutesho vishvaguptanurishvarah | mandeharipurindushca bindussundaravigrahah ||
    9|| samaganapriyassadhussatyasandhassadashivah | samatmasandhiravyaktam sambassarasavardhanah || 10||
    sudassukshmassukshmakayassukshmadriksudrigavyayah | rathangahetirambhojavardhanah sarvasammatah ||
    11|| vajrabhridvatsalo vagmi vagisho vayuvahanah | dharmatma'dharmashatrushca karmasakshi parantapah
    || 12|| pancananah pancamurtih pancangi papabhanjanah | parasharah punyamurtih puruhutanujah parah
    || 13|| sanatsarvam sahassarvassarvagassarvaposhakah | saptashvassaptarajjushca saptaidhassaptasarathih
    || 14|| saptapriyassaptadogdha munjikesho murantakah | shukashshuddhashshubhacarassarvabijamanayakah
    || 15|| karta vikarta gahano karanam karanam mahat | akunthavikramashshaurirvaikuntho bhagavanbhavah
    || 16|| bhanurhamsassahasramshustapanassavita pita | jatukarno jayi jyayan minangi simhapalakah ||
    17|| ekoccassaptanicashca shatpatirmanavallabhah | ritussudarshanah kalah kunjarananapujitah || 18||
    dvijo'dvijashshucirdhirah shriman murtitrayatmakah | shivankarah shribhuteshassindhuruccaishshrava
    harih || 19|| pradmaprabodhakah padmi padmagarbhah prabhakarah | ahnamprabhurdinamanidaiteyakulamrityukrit
    || 20|| kala kashtha muhurtatma dinaratrishariravan | padmapatih paramdhama paramatma parayanam ||
    21|| nidanam nityamadvaitam kevalam muktikaranam | sarvabhutasharirastham caitanyam brahmanirgunam
    || 22|| eko naikah kritishshantirmatirbuddhidhritissmritih | mantro yantram tathakshetram kshetrajno'ksharasamjnikah
    || 23|| indriyanamadhishthata tattvam tatpurushagranih | amayi mayinamagryo lokasvami svaradguruh
    || 24|| pranadah pranavah prano praptisadhanamambaram | jaganmitram pavitram ca devanamapidaivatam
    || 25|| sindhunidraddhiranyango saimhikeyavishodhitah | vishuvaccayanam kantishcandrotpattyayanam
    grahah || 26|| digisho devavrindesho nakshatresho dhaneshvarah | suryavarcassuriradyassuryapatirumadhavah
    || 27|| vibhakaro dvadashatma kapilah kapishikshakah | kapitatah kapih pingah pangukalapita harah
    || 28|| viviktassagarassetustamrastamraratho rathi | meruprabhassumerushca budhanunnaratho bhavah
    || 29|| sahasrapragraho dhanvi medhavi shrutisagarah | bhishakpita bhishaksaro bhaishajam bhavarogahrit
    || 30|| janmadishshastrayonishca vijnanam jnanameva ca | jnata jneyam sphutasphurtiranisho nahavirnripah
    || 31|| avicchinnanvayashshasta ramo rajivalocanah | gayatrivallabhah pramshurgeyo gata gunarnavah
    || 32|| satyamedhassamamnayassandhata kashyapatmajah | sarvadharmamayassakshi citkutanilayo'nalah
    || 33|| cirantanashcidatma ca vaishakhashikhivahanah | ashvatthah kushanabhashca samrajyam jagadishvarah
    || 34|| diptamurtimahamurtissutapah ritubhukpashuh | yajva jajjvalyadehashca shatrumandalakhandanah
    || 35|| shararudhvamsakashshasta shastrayonirniranjanah | anindyo nindyavidhvamsi vishvamitravarapradah
    || 36|| vidhyarthabodhako bhanurvindhyavithi plavangamah | tatpadartho'hampadarthastattvamasyarthabodhakah
    || 37|| ta ete tvamaham devayaksharakshobhayankarah | mrityunjayah pakabhedi sushumnatalashobhitah
    || 38|| sahasrarambujarudho karnikamadhyamandapah | guhashayashshivassthanurgopta gunapatirgirih ||
    39|| gomurtissarvadevatma sarvasandhyapravartakah | jyotishmanindrasharma ca cidanando digambarah
    || 40|| kiriti kavaci khadgi shankhi sharngi ca padmakah | vetri shuli nishangi ca tapanastapatam
    varah || 41|| shankarashcarusarvangassarvabandhavimocakah | mahatma carusarvangassarvabhushanabhushitah
    || 42|| bhaktepsitarthasandhanakalpavrikshah kakutpatih | bandhukakusumaprakhyassarvashastrabhritam
    varah || 43|| brahmanyo brahmano brahmi rajarshiramitaprabhah | sanatanavarassomassarvatattvavalambanah
    || 44|| mahapatalasammanyo maninamagranirmahan | siddharthakritsiddhaguhyah siddhanamuttamagatih ||
    45|| lokanatho vibhanatho matharo madhuvallabhah | tikshnamshustirthagarbhashca shvetalohitavahanah
    || 46|| karma karmavidam neta sadavaranamandalah | sahasraguranantatma vishishtashshishtaposhakah
    || 47|| divyamurtirdevasimho divishatpravaro damah | vishalakshashshrimurtirvishvabhbharavibhavasuh
    || 48|| murdhanvadishtadayi ca kriticintanivartakah | gandharvaganagopta ca vasvadiganavanditah ||
    49|| grahapo grahaneta ca grandhibandhavibhanjanah | grasishnurgrahagopta ca grahi grahyasharirabhah
    || 50|| tapasvi tapasashshocyo taranirdyumanirmanih | cintamanirdinamanirjyotirmanirajeshvarah ||
    51|| chandomayashshastramayassarvakantikhanirmanuh | anurusarathih pilo paippalo trivilocanah || 52||
    trishikhi brahmanamayo jyotissiddhantabodhanah | trinama trisharirashca trikandashcandadidhitih ||
    53|| muktidvaram munivaro mahorasko mahamanah | annapatrapradata ca vishnucintaparah puman || 54||
    apadamapaharta ca rogakandadavanalah | nivrittatma samavritto cakshurindriyadevata || 55|| tapomayastaptatanuh
    pusha pushadivanditah | sarvajantusharanyashca bahvrico bahudayakah || 56|| krishnatma kamaniyashca
    sarvavedavibhagakrit | karno vikarnah kantashca bahubhoji bahupriyah || 57|| dakshino dakshinamurtirdayavan
    dambhavarjitah | sadbhutih koshagah koshi sarvasiddhiparayanah || 58|| shivadehashshivatma ca shivadehashshivapradah
    | varanasivasaparo hamsatirthapravartakah || 59|| suryalingapratishthata somakantivivardhanah | sugrahassukhadassukshmaskharasasvarita
    evaca || 60|| sankhyavansarvasamsari surih parapuranjayah | kritagamah kritavidhih kritashastrah kritahnikah
    || 61|| raja rajadvitiyashca graharajah pramanavit | badavo badavamulam havyam kavyam pitripriyah
    || 62|| samadhivetta sararthassaradriksharadapriyah | raktapushparcaniyashca raktagandhakshatapriyah
    || 63|| pararthyarthyah purnakantih kritatattvarthanirnayah | nikhilaprananilayo nityamerupradakshinah
    || 64|| purnah purnayita pujyah paramannakritadarah | parahimsadirahito gurumurtirgatipradah || 65||
    gopalo lokapalashca sarvassarvasvamacyutah | marudisho maruccakshurmitro hrittapanashakah || 66||
    hridrogahari kaumari harimadivinashakah | uttaram divamarudho haridrah kokanayakah || 67|| hrim bijamadhyanilayo
    navanathavivardhanah | yoginivandyacarano baligrahanatatparah || 68|| nityakalyananilayo kalyanacalasevakah
    | kalyanadanah kalpatma'tyugro ripubhayankarah || 69|| bhutikridbhutibhridbhutirbhutabhavanapurvajah
    | triyugashca triprishthashca tripanmurtitrayatmakah || 70|| sarvavighnavinashi ca sarvabandhavimocakah
    | trishirastripralambashca tridamshtrastricaturgatih || 71|| kujamitram pitripatih pitrikaraka eva
    ca | shubhango lokasarangassarango'runasarathih || 72|| punyashlokah punyadayi punyakari puratanah
    | vijayo vishnurajashca vishnurato bhavadihrit || 73|| vadanyashca viradrupi vidyanatho vidhirvidhuh
    | prashastagunasindhushca bandhurvedantavedinam || 74|| tattvarthamata tamrashvastarunastadidujjvalah
    | tirnaduhkhastivravego candanadyutiratmavan || 75|| arkaparnasnanatoshi vitihotradidaivatah | ekakshashcaikacakrashca
    svatejobhassvayamprabhah || 76|| paragatih pindajanamandajanam bhayavahah | kruravratah krurakalpo
    tamasah paraviraha || 77|| shatpallavavidhanajnashshatpallavavarapradah | shrutipadapasancari kokilah
    kamalashrayah || 78|| kushthavyadhivinashi ca dushtapidanibarhanah | dhritapadmadvayo yoddha tejomandalamadhyagah
    || 79|| sarvadhivyadhishamano sarvatapalitapanah | sarvasakshi sadudayah svashtaksharyadhidevata ||
    80|| sphotadidoshahari ca gulmaduhkhaprabhanjanah | yojanarbudasancari salokyadipradah pita || 81||
    khetah kripitadayi ca nagno nalinavallabhah | kuntiprasannah kauberah shrivakshah shriniketanah ||
    82|| aruno'runaketushca yuddhapretagatipradah | samjnamanonukulashca mahendrakritapujanah || 83||
    garudagrajasutashca sasyalisuhridurmikrit | godhumadhanyanathashca vartulakaramandalah || 84|| rudrapratyadhidevashca
    hastanakshatranayakah | gunjapunjapratikashah pavitrikritavritraha || 85|| kalindijanakashcaiva gobrahmanahite
    ratah | indro vriddhashravah pusha vishvavedah prajapatih || 86|| agnirvayushca suryashca vayvashvo
    rashmipalakah | maricyatma bhuvanasuradrohi putradayakah || 87|| mahanamnivratahito mahamanoparakshasah
    | adityo'ditidevashca ditidevo divaspatih || 88|| vyomasandrigvimanastho sumridikassarovibhuh || smritipratyakshamaitihyamanumanam
    vidhayakah || 89|| sataissarvaissamavishto'nurmahanadhivatsarah | pataro viklidhah pingah pradarshi
    copadarshakah || 90|| nanamukhashcaiva shirsho ritulakshanalakshitah | shuklatma dakshinah pakshah
    krishnatma vamapakshakah || 91|| ahodyaurvishurupi ca vishvavanavisheshavit | apashushcapashughnashca
    napashuh pashupalakah || 92|| samvatsarapriyatamah pratyakshajneyamandalah | shadudyamassaptayatro
    vinadi cabhidhavakah || 93|| shashtivalgassarshtikashca praishakritprathamassmritah | aghorakshassadonadi
    vakprayojaka eva ca || 94|| samvatsarinah karmaphalapadmapita ivojjvalah | kanakojjvalavasashca ahatambara
    eva ca || 95|| kapardi vishikhashcaiva vatavanmarutam mukham | kshapano yotsyamanashca hemacakshurakopanah
    || 96|| apadhvastashca sannaddhassahadrigjivanapradah | na devo na manushyashca nagnirnendro na marutah
    || 97|| nopamo rudradhanva ca karmabrahmaprapancakah | ritubhissannutassvami sarvakamadhugavyayah
    || 98|| arogyasthanabha bhrajah patarasthanabha api | saptasuryarpitashcaiva kashyapo mervamocakah
    || 99|| vatsyayanah pancakarno saptahota ca rikpatih | tasthivanjagadatma ca vaishampayana eva ca
    || 100|| anambha ambhasam mulamagnivayuparayanam | kashyapasyatithishcaiva siddhagamana eva ca ||
    101|| nama uktipriyah punyo ajiraprabhureva ca | naryapah panktiradhashca visarpi nilalohitah || 102||
    nilarcih pitakarcishca vayurekadashatmakah | vasukivaidyutashcaiva rajatah parushadikah || 103|| nasatyajanakashcaiva
    shambarashcapapurushah | subrahmanyashca surindro gautamah kaushikipatih || 104|| agnishca jatavedashca
    sahoja ajiraprabhuh | kah kim kam tatsatyamannamamrito jiva eva ca || 105|| vyayajanmanujanmo'grassaptasaptakadrishtibhak
    | bhanurvidhushca bhaumashca candrasunushca gishpatih || 106|| ushana suryasunushca tamah ketustathadribhrit
    | ardhapraharo guliko yamakantaka eva ca || 107|| karako marakashcapi poshakastoshakastatha | pashcallattah
    purolattah parshvalattastathaiva ca || 108|| akashagrahasamsevyo dhumaketuvijrimbhanah | bhukampanadihetushca
    raktavrishtividhayakah || 109|| garjan parjanyarupi ca durjayo duratikramah | nirjararadhyacarano
    jaramaranavarjitah || 110|| viyadgamanajanghalo vitihotrasamaprabhah | virincigarbhasambhuto vishavyalavinashakrit
    || 111|| shripushtikirtisandayi namatam namanapriyah | vedadhyayanasampanno vedanteshu ca nishthitah
    || 112|| shabdashastrapraneta ca shabdabrahmamayah parah | arthabrahmamayo'rtharthi svarthinamarthadayakah
    || 113|| japayajnastapoyajno danayajnastathaiva ca | svadhyayayajno dharmajno nitijno vijna eva ca
    || 114|| guhashayi guhabhedi sakshanmanmathamanmathah | manjudeho manjukantirmahimatishayojjvalah
    || 115|| mitravindavandyapado munivrindavane hitah | brahmacari sumedhashca urdhvaretastapomayah ||
    116|| ainkaranilayo vagmi vagarthaprada eva ca | hrinkaranilayo mayi indrajaladitattvavit || 117||
    shrinkaranilayashshriman dhanado dhanavardhanah | shricakrarajanilayah shridevikarnabhushanam || 118||
    klinkaramadhyanilayah kamarajavashankarah | saushshaktisahito jnanadanadakshah prakashakah || 119||
    paramatmantaratma ca jivatma ca niyamakah | hridayagranthibhetta ca sarvasamshayanashanah || 120||
    brahmavyakhyananipuno yajnadikshadhurandharah | daurbhagyatulavatulo jaradhvantanivartakah || 121||
    dvaitamohavinashi ca bhedavadivibhedanah | virabhadramatadhvamsi viraradhyanibarhanah || 122|| kapalimatakopi
    ca mimamsanyayatatparah | kartantikavarassarvakartantikaparayanah || 123|| jangamajangamamayo janakipujitah
    pura | ikshvakuvamshanathashca indirasthanasundarah || 124|| vidyavinayavijnana trayitandavamandapah
    | ramacandrakulambhodhih kaminikamadayakah || 125|| sangitashastranipunah sarvavidyapravartakah |
    rajagraho'dhikari ca rajarajeshvaripriyah || 126|| rajyam bhaujyam ca samrajyam vairajyam rajyameva
    ca | gauh pancagavyam shuddhatma candrayanaphalapradah || 127|| kricchradiphaladayi ca daridryabhayanashanah
    | duhkharnavottarakashca duritavatakhandanah || 128|| brahmahatyadividhvamsi bhrunahatyanibarhanah
    | gurudrohadishamano matrigamivadhodyatah || 129|| pancastrashastrameghalijhanjhavato jhashadikah
    | citragurdanashaundashca simhasamhanano yuva || 130|| vaidhavyabadhashamano vidhavanam gatipradah
    | rajodoshavinashi ca kritapakvannagarhanah || 131|| pattabhishiktabhaktalirdushtamattebhakesari |
    anargalagatigudho gomatitirapunyakrit || 132|| jarayudoshahari ca purnayuryogakarakah | bhaktabjapurnacandrashca
    dharmamargapravartakah || 133|| sauvargasukhahetushca nirayadhvamsadikshitah | bhramanmandalasamsthano
    bhrantipittadirogahrit || 134|| mehadirogashamano pandukshayavinashanah | papavetalamantrajno papakrijjanadurlabhah
    || 135|| jvaradidoshadurashca vijvarikritabhusurah | mokshanishrenikasakshi dakshayanyadisevakah ||
    136|| bhavuko bhadrakarunamashvinipushkarojjvalah | prashastavannistulana prabandhashatakalpanah ||
    137|| bhuneta bhudharo bhogi bhagyadayi bhavapriyah | karmandi valalah klibah pashupalo'shvapalakah
    || 138|| shanipidavinashi ca krityadoshanibarhanah | abhicarikavidhvamsi gadavanadavanalah || 139||
    japapujarcanarato narayanapadam param | papapashanadalanatankikritakaravalih || 140|| mokshalakshmikavatashca
    matrikavarnamandanah | akaradikshakarantavarnamalavibhushanah || 141|| anusvaradisankhyatma svaro
    vyanjana eva ca | sarvarthadassarvakarmasarvakaryaprakashakah || 142|| pancavimshatitattvasthah pancabrahmasamudbhavah
    | paramarthikasandayi pangvadigatidayakah || 143|| saphalikritapujartho viphalikritadushkritih | shrutismritisamamnatasmartakarmaprakashakah
    || 144|| yajnopavitadhari ca yajnavalkyadivanditah | sushumnayogamadhyastho lambikayogasadhanah ||
    145|| salambanoddipanadikriyabijam mahamanuh | kalpatishayisankalpo vikalpavidhivarjitah || 146||
    analpamurtirashvatma svatmanandavidhayakah | atmanatmavivekajno niravaranabodhanah || 147|| nidanabhutastattvanam
    nityakalyanasundarah | shantarakshananirnidrah shrutismritishubhadrumah || 148|| alapikritavedango
    malalankritakandharah | rudrakshakankanalasatkaro rudrajapapriyah || 149|| sadashivaparabrahmasthanam
    shrishambhuvigrahah | muladharambujarudho daharakashamadhyagah || 150|| sahasrarambujarudho jnanadolavilasavan
    | velollanghanasamarthyo vetta nirvritidayakah || 151|| surabhusuradattarghyashuddhambugrahane ratah
    | brahmavarcasvitamulam brahmashrisuryavigrahah || 152|| phalashrutih
  devanagari: ृणु परं सूर्यस्य च महात्मनः । उत्तमं नामसाहस्रं यत्तमस्ते निकृन्तति ॥ बृहस्पतिस्सभगवानित्युक्तसूर्यवर्चसम्
    । ध्यात्वा नारायणं देवं भानुमण्डलमध्यगम् ॥ अथ श्रीसूर्यसहस्रनामस्तोत्रम् । ॐ आदित्यश्चादिदेवोऽयं भास्करो
    भवनाशनः । विश्वमूर्तिर्विश्वनेता चिन्मूर्तिश्चिन्तितार्थदः ॥ १॥ सद्योजातो वामदेवस्सर्वपापविनाशकः ।
    वेद्यो वैद्यस्सदायोगी विश्वकर्मा विभावसुः ॥ २॥ विरिञ्चिर्विश्रुतात्मा च विश्वसर्गप्रवर्तकः । विद्यात्मा
    विषयज्ञश्च विश्वात्मा विश्वपापहा ॥ ३॥ विदुषामीश्वरो विद्वान्विश्वनेता विशेषवित् । वीरहा विषयश्शून्यो
    वालखिल्यादिवन्दितः ॥ ४॥ वामनो वरदः प्रांशुर्वासुदेवस्सनातनः । वालखिल्यपुरोगश्च वारिदो वसुमान्वसुः
    ॥ ५॥ वरेण्यो वासुदेवश्च वसुरेता वसुप्रदः । वायुर्वाचस्पतिर्विश्वं विष्णुर्विश्वामरेश्वरः ॥ ६॥ ओङ्कारश्च
    वषट्कारः सोमग्रहपुरोगमः । ग्रहनक्षत्रमाली च शिंशुमारशरीरवान् ॥ ७॥ शरण्यश्शङ्करश्शम्भुः कालात्मा कान्तिवर्धनः
    ॥ कामदेवः कामहर्ता विराड्वीरासनस्थितः ॥ ८॥ विस्तारभूमा भूतेशो विश्वगुप्तनुरीश्वरः । मन्देहरिपुरिन्दुश्च
    बिन्दुस्सुन्दरविग्रहः ॥ ९॥ सामगानप्रियस्साधुस्सत्यसन्धस्सदाशिवः । समात्मासन्धिरव्यक्तं साम्बस्सारसवर्धनः
    ॥ १०॥ सूदस्सूक्ष्मस्सूक्ष्मकायस्सूक्ष्मदृक्सुदृगव्ययः । रथाङ्गहेतिरम्भोजवर्धनः सर्वसम्मतः ॥ ११॥ वज्रभृद्वत्सलो
    वाग्मी वागीशो वायुवाहनः । धर्मात्माऽधर्मशत्रुश्च कर्मसाक्षी परन्तपः ॥ १२॥ पञ्चाननः पञ्चमूर्तिः पञ्चाङ्गी
    पापभञ्जनः । पराशरः पुण्यमूर्तिः पुरुहूतानुजः परः ॥ १३॥ सनात्सर्वं सहस्सर्वस्सर्वगस्सर्वपोषकः । सप्ताश्वस्सप्तरज्जुश्च
    सप्तैधास्सप्तसारथिः ॥ १४॥ सप्तप्रियस्सप्तदोग्धा मुञ्जिकेशो मुरान्तकः । शुकश्शुद्धश्शुभाचारस्सर्वबीजमनायकः
    ॥ १५॥ कर्ता विकर्ता गहनो कारणं करणं महत् । अकुण्ठविक्रमश्शौरिर्वैकुण्ठो भगवान्भवः ॥ १६॥ भानुर्हंसस्सहस्रांशुस्तपनस्सविता
    पिता । जातुकर्णो जयी ज्यायान् मीनाङ्गी सिंहपालकः ॥ १७॥ एकोच्चस्सप्तनीचश्च षट्पतिर्मानवल्लभः । ऋतुस्सुदर्शनः
    कालः कुञ्जराननपूजितः ॥ १८॥ द्विजोऽद्विजश्शुचिर्धीरः श्रीमान् मूर्तित्रयात्मकः । शिवङ्करः श्रीभूतेशस्सिन्धुरुच्चैश्श्रवा
    हरिः ॥ १९॥ प्रद्मप्रबोधकः पद्मी पद्मगर्भः प्रभाकरः । अह्नाम्प्रभुर्दिनमणिदैतेयकुलमृत्युकृत् ॥ २०॥
    कला काष्ठा मुहूर्तात्मा दिनरात्रिशरीरवान् । पद्मापतिः परंधाम परमात्मा परायणम् ॥ २१॥ निदानं नित्यमद्वैतं
    केवलं मुक्तिकारणम् । सर्वभूतशरीरस्थं चैतन्यं ब्रह्मनिर्गुणम् ॥ २२॥ एको नैकः कृतिश्शान्तिर्मतिर्बुद्धिधृतिस्स्मृतिः
    । मन्त्रो यन्त्रं तथाक्षेत्रं क्षेत्रज्ञोऽक्षरसंज्ञिकः ॥ २३॥ इन्द्रियाणामधिष्ठाता तत्त्वं तत्पुरुषाग्रणीः
    । अमायी मायिनामग्र्यो लोकस्वामी स्वराड्गुरुः ॥ २४॥ प्राणदः प्रणवः प्राणो प्राप्तिसाधनमम्बरम् । जगन्मित्रं
    पवित्रं च देवानामपिदैवतम् ॥ २५॥ सिन्धुनिद्राद्धिरण्याङ्गो सैंहिकेयविशोधितः । विषुवच्चायनं कान्तिश्चन्द्रोत्पत्त्ययनं
    ग्रहः ॥ २६॥ दिगीशो देववृन्देशो नक्षत्रेशो धनेश्वरः । सूर्यवर्चास्सूरिराद्यस्सूर्यापतिरुमाधवः ॥ २७॥
    विभाकरो द्वादशात्मा कपिलः कपिशिक्षकः । कपितातः कपिः पिङ्गः पङ्गुकालपिता हरः ॥ २८॥ विविक्तस्सागरस्सेतुस्ताम्रस्ताम्ररथो
    रथी । मेरुप्रभस्सुमेरुश्च बुधनुन्नरथो भवः ॥ २९॥ सहस्रप्रग्रहो धन्वी मेधावी श्रुतिसागरः । भिषक्पिता
    भिषक्सारो भैषजं भवरोगहृत् ॥ ३०॥ जन्मादिश्शास्त्रयोनिश्च विज्ञानं ज्ञानमेव च । ज्ञाता ज्ञेयं स्फुटस्फूर्तिरनीशो
    नाहविर्नृपः ॥ ३१॥ अविच्छिन्नान्वयश्शास्ता रामो राजीवलोचनः । गायत्रीवल्लभः प्रांशुर्गेयो गाता गुणार्णवः
    ॥ ३२॥ सत्यमेधास्समाम्नायस्सन्धाता कश्यपात्मजः । सर्वधर्ममयस्साक्षी चित्कूटनिलयोऽनलः ॥ ३३॥ चिरन्तनश्चिदात्मा
    च वैशाखशिखिवाहनः । अश्वत्थः कुशनाभश्च साम्राज्यं जगदीश्वरः ॥ ३४॥ दीप्तमूर्तिमहामूर्तिस्सुतपाः ऋतुभुक्पशुः
    । यज्वा जाज्ज्वल्यदेहश्च शत्रुमण्डलखण्डनः ॥ ३५॥ शरारुध्वंसकश्शास्ता शास्त्रयोनिर्निरञ्जनः । अनिन्द्यो
    निन्द्यविध्वंसी विश्वामित्रवरप्रदः ॥ ३६॥ विध्यर्थबोधको भानुर्विन्ध्यवीथी प्लवङ्गमः । तत्पदार्थोऽहंपदार्थस्तत्त्वमस्यर्थबोधकः
    ॥ ३७॥ त एते त्वमहं देवयक्षरक्षोभयङ्करः । मृत्युञ्जयः पाकभेदी सुषुम्नातालशोभितः ॥ ३८॥ सहस्राराम्बुजारूढो
    कर्णिकामध्यमण्डपः । गुहाशयश्शिवस्स्थाणुर्गोप्ता गुणपतिर्गिरिः ॥ ३९॥ गोमूर्तिस्सर्वदेवात्मा सर्वसन्ध्याप्रवर्तकः
    । ज्योतिष्मानिन्द्रशर्मा च चिदानन्दो दिगम्बरः ॥ ४०॥ किरीटी कवची खड्गी शङ्खी शार्ङ्गी च पद्मकः । वेत्री
    शूली निषङ्गी च तापनस्तपतां वरः ॥ ४१॥ शङ्करश्चारुसर्वाङ्गस्सर्वबन्धविमोचकः । महात्मा चारुसर्वाङ्गस्सर्वभूषणभूषितः
    ॥ ४२॥ भक्तेप्सितार्थसन्धानकल्पवृक्षः ककुत्पतिः । बन्धूककुसुमप्रख्यस्सर्वशस्त्रभृतां वरः ॥ ४३॥ ब्रह्मण्यो
    ब्राह्मणो ब्राह्मी राजर्षिरमितप्रभः । सनातनवरस्सोमस्सर्वतत्त्वावलम्बनः ॥ ४४॥ महापातालसम्मान्यो मानिनामग्रणीर्महान्
    । सिद्धार्थकृत्सिद्धगुह्यः सिद्धानामुत्तमागतिः ॥ ४५॥ लोकनाथो विभानाथो माठरो मधुवल्लभः । तीक्ष्णांशुस्तीर्थगर्भश्च
    श्वेतलोहितवाहनः ॥ ४६॥ कर्म कर्मविदां नेता सदावरणमण्डलः । सहस्रगुरनन्तात्मा विशिष्टश्शिष्टपोषकः ॥ ४७॥
    दिव्यमूर्तिर्देवसिंहो दिविषत्प्रवरो दमः । विशालाक्षश्श्रीमूर्तिर्विश्वभ्भरविभावसुः ॥ ४८॥ मूर्धन्वदिष्टदायी
    च कृतिचिन्तानिवर्तकः । गन्धर्वगणगोप्ता च वस्वादिगणवन्दितः ॥ ४९॥ ग्रहपो ग्रहनेता च ग्रन्धिबन्धविभञ्जनः
    । ग्रसिष्णुर्ग्रहगोप्ता च ग्राही ग्राह्यशरीरभाः ॥ ५०॥ तपस्वी तापसश्शोच्यो तरणिर्द्युमणिर्मणिः । चिन्तामणिर्दिनमणिर्ज्योतिर्मणिरजेश्वरः
    ॥ ५१॥ छन्दोमयश्शास्त्रमयस्सर्वकान्तिखनिर्मनुः । अनूरुसारथिः पीलो पैप्पलो त्रिविलोचनः ॥ ५२॥ त्रिशिखी
    ब्राह्मणमयो ज्योतिस्सिद्धान्तबोधनः । त्रिनामा त्रिशरीरश्च त्रिकाण्डश्चण्डदीधितिः ॥ ५३॥ मुक्तिद्वारं
    मुनिवरो महोरस्को महामनाः । अन्नपात्रप्रदाता च विष्णुचिन्तापरः पुमान् ॥ ५४॥ आपदामपहर्ता च रोगकाण्डदवानलः
    । निवृत्तात्मा समावृत्तो चक्षुरिन्द्रियदेवता ॥ ५५॥ तपोमयस्तप्ततनुः पूषा पूषादिवन्दितः । सर्वजन्तुशरण्यश्च
    बह्वृचो बहुदायकः ॥ ५६॥ कृष्णात्मा कमनीयश्च सर्ववेदविभागकृत् । कर्णो विकर्णः कान्तश्च बहुभोजी बहुप्रियः
    ॥ ५७॥ दक्षिणो दक्षिणामूर्तिर्दयावान् दम्भवर्जितः । सद्भूतिः कोशगः कोशी सर्वसिद्धिपरायणः ॥ ५८॥ शिवदेहश्शिवात्मा
    च शिवदेहश्शिवप्रदः । वाराणसीवासपरो हंसतीर्थप्रवर्तकः ॥ ५९॥ सूर्यलिङ्गप्रतिष्ठाता सोमकान्तिविवर्धनः
    । सुग्रहस्सुखदस्सूक्ष्मस्खरसस्वारित एवच ॥ ६०॥ सङ्ख्यावान्सर्वसंसारी सूरिः परपुरञ्जयः । कृतागमः कृतविधिः
    कृतशास्त्रः कृताह्निकः ॥ ६१॥ राजा राजद्वितीयश्च ग्रहराजः प्रमाणवित् । बाडवो बाडवामूलं हव्यं कव्यं
    पितृप्रियः ॥ ६२॥ समाधिवेत्ता सारार्थस्सारदृक्शारदाप्रियः । रक्तपुष्पार्चनीयश्च रक्तगन्धाक्षतप्रियः
    ॥ ६३॥ परार्थ्यार्थ्यः पूर्णकान्तिः कृततत्त्वार्थनिर्णयः । निखिलप्राणनिलयो नित्यमेरुप्रदक्षिणः ॥ ६४॥
    पूर्णः पूर्णयिता पूज्यः परमान्नकृतादरः । परहिंसादिरहितो गुरुमूर्तिर्गतिप्रदः ॥ ६५॥ गोपालो लोकपालश्च
    सर्वस्सर्वस्वमच्युतः । मरुदीशो मरुच्चक्षुर्मित्रो हृत्तापनाशकः ॥ ६६॥ हृद्रोगहारी कौमारी हरिमादिविनाशकः
    । उत्तरां दिवमारूढो हारिद्रः कोकनायकः ॥ ६७॥ ह्रीं बीजमध्यनिलयो नवनाथविवर्धनः । योगिनीवन्द्यचरणो बलिग्रहणतत्परः
    ॥ ६८॥ नित्यकल्याणनिलयो कल्याणाचलसेवकः । कल्याणदानः कल्पात्माऽत्युग्रो रिपुभयङ्करः ॥ ६९॥ भूतिकृद्भूतिभृद्भूतिर्भूतभावनपूर्वजः
    । त्रियुगश्च त्रिपृष्ठश्च त्रिपान्मूर्तित्रयात्मकः ॥ ७०॥ सर्वविघ्नविनाशी च सर्वबन्धविमोचकः । त्रिशिरास्त्रिप्रलम्बश्च
    त्रिदंष्ट्रस्त्रिचतुर्गतिः ॥ ७१॥ कुजमित्रं पितृपतिः पितृकारक एव च । शुभाङ्गो लोकसारङ्गस्सारङ्गोऽरुणसारथिः
    ॥ ७२॥ पुण्यश्लोकः पुण्यदायी पुण्यकारी पुरातनः । विजयो विष्णुराजश्च विष्णुरातो भवादिहृत् ॥ ७३॥ वदान्यश्च
    विराड्रूपी विद्यानाथो विधिर्विधुः । प्रशस्तगुणसिन्धुश्च बन्धुर्वेदान्तवेदिनाम् ॥ ७४॥ तत्त्वार्थमाता
    ताम्राश्वस्तरुणस्तडिदुज्ज्वलः । तीर्णदुःखस्तीव्रवेगो चन्दनद्युतिरात्मवान् ॥ ७५॥ अर्कपर्णस्नानतोषी
    वीतिहोत्रादिदैवतः । एकाक्षश्चैकचक्रश्च स्वतेजोभास्स्वयम्प्रभः ॥ ७६॥ परागतिः पिण्डजानामण्डजानां भयावहः
    । क्रूरव्रतः क्रूरकल्पो तामसः परवीरहा ॥ ७७॥ षट्पल्लवविधानज्ञष्षट्पल्लववरप्रदः । श्रुतिपादपसञ्चारी
    कोकिलः कमलाश्रयः ॥ ७८॥ कुष्ठव्याधिविनाशी च दुष्टपीडानिबर्हणः । धृतपद्मद्वयो योद्धा तेजोमण्डलमध्यगः
    ॥ ७९॥ सर्वाधिव्याधिशमनो सर्वतापालितापनः । सर्वसाक्षी सदुदयः स्वाष्टाक्षर्यधिदेवता ॥ ८०॥ स्फोटादिदोषहारी
    च गुल्मदुःखप्रभञ्जनः । योजनार्बुदसञ्चारी सालोक्यादिप्रदः पिता ॥ ८१॥ खेटः कृपीटदायी च नग्नो नलिनवल्लभः
    । कुन्तीप्रसन्नः कौबेरः श्रीवक्षाः श्रीनिकेतनः ॥ ८२॥ अरुणोऽरुणकेतुश्च युद्धप्रेतगतिप्रदः । संज्ञामनोनुकूलश्च
    महेन्द्रकृतपूजनः ॥ ८३॥ गरुडाग्रजसूतश्च सस्यालिसुहृदूर्मिकृत् । गोधूमधान्यनाथश्च वर्तुलाकारमण्डलः ॥
    ८४॥ रुद्रप्रत्यधिदेवश्च हस्तनक्षत्रनायकः । गुञ्जापुञ्जप्रतीकाशः पवित्रीकृतवृत्रहा ॥ ८५॥ कालिन्दीजनकश्चैव
    गोब्राह्मणहिते रतः । इन्द्रो वृद्धश्रवाः पूषा विश्ववेदाः प्रजापतिः ॥ ८६॥ अग्निर्वायुश्च सूर्यश्च वाय्वश्वो
    रश्मिपालकः । मरीच्यात्मा भुवनसूरद्रोही पुत्रदायकः ॥ ८७॥ महानाम्नीव्रतहितो महामानोपराक्षसः । आदित्योऽदितिदेवश्च
    दितिदेवो दिवस्पतिः ॥ ८८॥ व्योमसन्दृग्विमानस्थो सुमृडीकस्सरोविभुः ॥ स्मृतिप्रत्यक्षमैतिह्यमनुमानं विधायकः
    ॥ ८९॥ सतैस्सर्वैस्समाविष्टोऽणुर्महानधिवत्सरः । पटरो विक्लिधः पिङ्गः प्रदर्शी चोपदर्शकः ॥ ९०॥ नानामुखश्चैव
    शीर्षो ऋतुलक्षणलक्षितः । शुक्लात्मा दक्षिणः पक्षः कृष्णात्मा वामपक्षकः ॥ ९१॥ अहोद्यौर्विषुरूपी च विश्वावनविशेषवित्
    । अपशुश्चापशुघ्नश्च नपशुः पशुपालकः ॥ ९२॥ संवत्सरप्रियतमः प्रत्यक्षज्ञेयमण्डलः । षडुद्यमस्सप्तयात्रो
    विनादी चाभिधावकः ॥ ९३॥ षष्टिवल्गस्सार्ष्टिकश्च प्रैषकृत्प्रथमस्स्मृतः । अघोराक्षस्सदोनादी वाक्प्रयोजक
    एव च ॥ ९४॥ संवत्सरीणः कर्मफलपद्मापीत इवोज्ज्वलः । कनकोज्ज्वलवासाश्च अहताम्बर एव च ॥ ९५॥ कपर्दी विशिखश्चैव
    वातवान्मरुतां मुखम् । क्षपणो योत्स्यमानश्च हेमचक्षुरकोपनः ॥ ९६॥ अपध्वस्तश्च सन्नद्धस्सहदृग्जीवनप्रदः
    । न देवो न मनुष्यश्च नाग्निर्नेन्द्रो न मारुतः ॥ ९७॥ नोपमो रुद्रधन्वा च कर्मब्रह्मप्रपञ्चकः । ऋतुभिस्सन्नुतस्स्वामी
    सर्वकामधुगव्ययः ॥ ९८॥ आरोग्यस्थानभा भ्राजः पटरस्थानभा अपि । सप्तसूर्यार्पितश्चैव कश्यपो मेर्वमोचकः
    ॥ ९९॥ वात्स्यायनः पञ्चकर्णो सप्तहोता च ऋक्पतिः । तस्थिवाञ्जगदात्मा च वैशम्पायन एव च ॥ १००॥ अनम्भा
    अम्भसां मूलमग्निवायुपरायणम् । कश्यपस्यातिथिश्चैव सिद्धागमन एव च ॥ १०१॥ नम उक्तिप्रियः पुण्यो अजिराप्रभुरेव
    च । नर्यापाः पङ्क्तिराधाश्च विसर्पी नीललोहितः ॥ १०२॥ नीलार्चिः पीतकार्चिश्च वायुरेकादशात्मकः । वासुकिवैद्युतश्चैव
    रजतः परुषादिकः ॥ १०३॥ नासत्यजनकश्चैव शाम्बरश्चापपूरुषः । सुब्रह्मण्यश्च सूरीन्द्रो गौतमः कौशिकीपतिः
    ॥ १०४॥ अग्निश्च जातवेदाश्च सहोजा अजिराप्रभुः । कः किं कं तत्सत्यमन्नममृतो जीव एव च ॥ १०५॥ व्ययजन्मानुजन्मोऽग्रस्सप्तसप्तकदृष्टिभाक्
    । भानुर्विधुश्च भौमश्च चन्द्रसूनुश्च गीष्पतिः ॥ १०६॥ उशना सूर्यसूनुश्च तमः केतुस्तथाद्रिभृत् । अर्धप्रहारो
    गुलिको यमकण्टक एव च ॥ १०७॥ कारको मारकश्चापि पोषकस्तोषकस्तथा । पश्चाल्लत्तः पुरोलत्तः पार्श्वलत्तस्तथैव
    च ॥ १०८॥ आकाशग्रहसंसेव्यो धूमकेतुविजृम्भणः । भूकम्पनादिहेतुश्च रक्तवृष्टिविधायकः ॥ १०९॥ गर्जन् पर्जन्यरूपी
    च दुर्जयो दुरतिक्रमः । निर्जराराध्यचरणो जरामरणवर्जितः ॥ ११०॥ वियद्गमनजङ्घालो वीतिहोत्रसमप्रभः । विरिञ्चिगर्भसम्भूतो
    विषव्यालविनाशकृत् ॥ १११॥ श्रीपुष्टिकीर्तिसन्दायी नमतां नमनप्रियः । वेदाध्ययनसम्पन्नो वेदान्तेषु च
    निष्ठितः ॥ ११२॥ शब्दशास्त्रप्रणेता च शब्दब्रह्ममयः परः । अर्थब्रह्ममयोऽर्थार्थी स्वार्थिनामर्थदायकः
    ॥ ११३॥ जपयज्ञस्तपोयज्ञो दानयज्ञस्तथैव च । स्वाध्याययज्ञो धर्मज्ञो नीतिज्ञो विज्ञ एव च ॥ ११४॥ गुहाशायी
    गुहाभेदी साक्षान्मन्मथमन्मथः । मञ्जुदेहो मञ्जुकान्तिर्महिमातिशयोज्ज्वलः ॥ ११५॥ मित्रविन्दावन्द्यपादो
    मुनिवृन्दावने हितः । ब्रह्मचारी सुमेधाश्च ऊर्ध्वरेतास्तपोमयः ॥ ११६॥ ऐङ्कारनिलयो वाग्मी वागर्थप्रद
    एव च । ह्रीङ्कारनिलयो मायी इन्द्रजालादितत्त्ववित् ॥ ११७॥ श्रीङ्कारनिलयश्श्रीमान् धनदो धनवर्धनः । श्रीचक्रराजनिलयः
    श्रीदेवीकर्णभूषणम् ॥ ११८॥ क्लीङ्कारमध्यनिलयः कामराजवशङ्करः । सौश्शक्तिसहितो ज्ञानदानदक्षः प्रकाशकः
    ॥ ११९॥ परमात्मान्तरात्मा च जीवात्मा च नियामकः । हृदयग्रन्थिभेत्ता च सर्वसंशयनाशनः ॥ १२०॥ ब्रह्मव्याख्याननिपुणो
    यज्ञदीक्षाधुरन्धरः । दौर्भाग्यतूलवातूलो जराध्वान्तनिवर्तकः ॥ १२१॥ द्वैतमोहविनाशी च भेदवादिविभेदनः
    । वीरभद्रमतध्वंसी वीराराध्यनिबर्हणः ॥ १२२॥ कापालिमतकोपी च मीमांसान्यायतत्परः । कार्तान्तिकवरस्सर्वकार्तान्तिकपरायणः
    ॥ १२३॥ जङ्गमाजङ्गममयो जानकीपूजितः पुरा । इक्ष्वाकुवंशनाथश्च इन्दिरास्थानसुन्दरः ॥ १२४॥ विद्याविनयविज्ञान
    त्रयीताण्डवमण्डपः । रामचन्द्रकुलाम्भोधिः कामिनीकामदायकः ॥ १२५॥ सङ्गीतशास्त्रनिपुणः सर्वविद्याप्रवर्तकः
    । राजग्रहोऽधिकारी च राजराजेश्वरीप्रियः ॥ १२६॥ राज्यं भौज्यं च साम्राज्यं वैराज्यं राज्यमेव च । गौः
    पञ्चगव्यं शुद्धात्मा चान्द्रायणफलप्रदः ॥ १२७॥ कृच्छ्रादिफलदायी च दारिद्र्यभयनाशनः । दुःखार्णवोत्तारकश्च
    दुरितवातखण्डनः ॥ १२८॥ ब्रह्महत्यादिविध्वंसी भ्रूणहत्यानिबर्हणः । गुरुद्रोहादिशमनो मातृगामिवधोद्यतः
    ॥ १२९॥ पञ्चास्त्रशस्त्रमेघालिझञ्झावातो झषादिकः । चित्रगुर्दानशौण्डश्च सिंहसंहननो युवा ॥ १३०॥ वैधव्यबाधाशमनो
    विधवानां गतिप्रदः । रजोदोषविनाशी च कृतपक्वान्नगर्हणः ॥ १३१॥ पट्टाभिषिक्तभक्तालिर्दुष्टमत्तेभकेसरी
    । अनर्गलगतिगूढो गोमतीतीरपुण्यकृत् ॥ १३२॥ जरायुदोषहारी च पूर्णायुर्योगकारकः । भक्ताब्जपूर्णचन्द्रश्च
    धर्ममार्गप्रवर्तकः ॥ १३३॥ सौवर्गसुखहेतुश्च निरयध्वंसदीक्षितः । भ्रमन्मण्डलसंस्थानो भ्रान्तिपित्तादिरोगहृत्
    ॥ १३४॥ मेहादिरोगशमनो पाण्डुक्षयविनाशनः । पापवेतालमन्त्रज्ञो पापकृज्जनदुर्लभः ॥ १३५॥ ज्वरादिदोषदूरश्च
    विज्वरीकृतभूसुरः । मोक्षनिश्रेणिकासाक्षी दाक्षायण्यादिसेवकः ॥ १३६॥ भावुको भद्रकरुणमश्विनीपुष्करोज्ज्वलः
    । प्रशस्तवान्निस्तुलन प्रबन्धशतकल्पनः ॥ १३७॥ भूनेता भूधरो भोगी भाग्यदायी भवप्रियः । कर्मन्दी वललः
    क्लीबः पशुपालोऽश्वपालकः ॥ १३८॥ शनिपीडाविनाशी च कृत्यादोषनिबर्हणः । आभिचारिकविध्वंसी गदावनदवानलः ॥
    १३९॥ जपपूजार्चनरतो नारायणपदं परम् । पापपाषाणदलनटङ्कीकृतकरावलिः ॥ १४०॥ मोक्षलक्ष्मीकवाटश्च मातृकावर्णमण्डनः
    । अकारादिक्षकारान्तवर्णमालाविभूषणः ॥ १४१॥ अनुस्वारादिसङ्ख्यात्मा स्वरो व्यञ्जन एव च । सर्वार्थदस्सर्वकर्मसर्वकार्यप्रकाशकः
    ॥ १४२॥ पञ्चविंशतितत्त्वस्थः पञ्चब्रह्मसमुद्भवः । पारमार्थिकसन्दायी पङ्ग्वादिगतिदायकः ॥ १४३॥ सफलीकृतपूजार्थो
    विफलीकृतदुष्कृतिः । श्रुतिस्मृतिसमाम्नातस्मार्तकर्मप्रकाशकः ॥ १४४॥ यज्ञोपवीतधारी च याज्ञवल्क्यादिवन्दितः
    । सुषुम्नायोगमध्यस्थो लम्बिकायोगसाधनः ॥ १४५॥ सालम्बनोद्दीपनादिक्रियाबीजं महामनुः । कल्पातिशायिसङ्कल्पो
    विकल्पविधिवर्जितः ॥ १४६॥ अनल्पमूर्तिरश्वात्मा स्वात्मानन्दविधायकः । आत्मानात्मविवेकज्ञो निरावरणबोधनः
    ॥ १४७॥ निदानभूतस्तत्त्वानां नित्यकल्याणसुन्दरः । शान्तरक्षणनिर्निद्रः श्रुतिस्मृतिशुभद्रुमः ॥ १४८॥
    आलापीकृतवेदाङ्गो मालालङ्कृतकन्धरः । रुद्राक्षकङ्कणलसत्करो रुद्रजपप्रियः ॥ १४९॥ सदाशिवपरब्रह्मस्थानं
    श्रीशम्भुविग्रहः । मूलाधाराम्बुजारूढो दहराकाशमध्यगः ॥ १५०॥ सहस्राराम्बुजारूढो ज्ञानडोलाविलासवान् ।
    वेलोल्लङ्घनसामर्थ्यो वेत्ता निर्वृतिदायकः ॥ १५१॥ सुरभूसुरदत्तार्घ्यशुद्धाम्बुग्रहणे रतः । ब्रह्मवर्चस्वितामूलं
    ब्रह्मश्रीसूर्यविग्रहः ॥ १५२॥ फलश्रुतिः
