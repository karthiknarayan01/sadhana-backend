id: devaihkritam03devistotram
category: stotram
name:
  english: devaihkritam03devistotram
  devanagari: देवैःकृतं०३देवीस्तोत्रम्
content:
  english: devaih kritam 3 devistotram deva ucuh | jaya tvam devi camunde jaya bhutapaharini | jaya sarvagate
    devi kalaratri namo'stu te || 22|| bhimarupe shive vidye mahamaye mahodaye | mahabhage jaye jrimbhe
    bhimakshi bhimadarshane || 23|| mahamaye vicitrangi geyanrityapriye shubhe | vikarali mahakali kalike
    kalarupini || 24|| prasahaste dandahaste bhimahaste bhayanane | camunde jvalamanasye tikshnadamshtre
    mahabale | shavayanasthite devi pretasanghanishevite || 25|| iti shriskandapurane prabhasakhande prabhasakshetramahatmye
    dvicatvarimshadhikadvishatatamadhyayantargatam devaih kritam devistotram samaptam | skandapurana |
    prabhasakhanda | adhyaya 242
  devanagari: देवैः कृतं ३ देवीस्तोत्रम् देवा ऊचुः । जय त्वं देवि चामुण्डे जय भूतापहारिणि । जय सर्वगते
    देवि कालरात्रि नमोऽस्तु ते ॥ २२॥ भीमरूपे शिवे विद्ये महामाये महोदये । महाभागे जये जृम्भे भीमाक्षि
    भीमदर्शने ॥ २३॥ महामाये विचित्राङ्गि गेयनृत्यप्रिये शुभे । विकरालि महाकालि कालिके कालरूपिणि ॥ २४॥
    प्रासहस्ते दण्डहस्ते भीमहस्ते भयानने । चामुण्डे ज्वलमानास्ये तीक्ष्णदंष्ट्रे महाबले । शवयानस्थिते
    देवि प्रेतसङ्घनिषेविते ॥ २५॥ इति श्रीस्कन्दपुराणे प्रभासखण्डे प्रभासक्षेत्रमाहात्म्ये द्विचत्वारिंशाधिकद्विशततमाध्यायान्तर्गतं
    देवैः कृतं देवीस्तोत्रं समाप्तम् । स्कन्दपुराण । प्रभासखण्ड । अध्याय २४२
meaning: {}
