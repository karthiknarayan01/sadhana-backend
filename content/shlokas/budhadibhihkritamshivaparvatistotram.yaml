id: budhadibhihkritamshivaparvatistotram
category: stotram
name:
  english: budhadibhihkritamshivaparvatistotram
  devanagari: बुधादिभिःकृतंशिवपार्वतीस्तोत्रम्
content:
  english: budhadibhih kritam shivaparvatistotram budhastushtava prathamamila ca tadanantaram | tatah
    pururavah putro gaurim devim ca shankaram || 103|| budha uvaca | yau kunkumena svasharirajena svabhavahemapratimau
    sarupau | yavarcitau skandaganeshvarabhyam tau me sharanyau sharanam bhavetam || 104|| ilovaca | samsaratapatrayadavadagdhah
    sharirino yau paricintayantah | sadyah param nirvritimapnuvanti tau shankarau me sharanam bhavetam
    || 105|| arta hyaham piditamanasa te kleshadigopta na paro'sti kashcit | deva tvadiyau caranau supunyau
    tau me sharanyau sharanam bhavetam || 106|| pururava uvaca | yayoh sakashadidamabhyudaiti prayati
    cante layameva sarvam | jagaccharanyau jagadatmakau tu gauriharau me sharanam bhavetam || 107|| yau
    devavrindeshu mahotsave tu padau grihanesha girishaputryah | proktam dhritau pritivashacchivena tau
    me sharanyau sharanam bhavetam || 108|| iti brahmapurane ashtadhikashatatamadhyayantargatam budhadibhih
    kritam shivastotram samaptam | brahmapurana | adhyaya 108
  devanagari: बुधादिभिः कृतं शिवपार्वतीस्तोत्रम् बुधस्तुष्टाव प्रथममिला च तदनन्तरम् । ततः पुरूरवाः पुत्रो
    गौरीं देवीं च शङ्करम् ॥ १०३॥ बुध उवाच । यौ कुङ्कुमेन स्वशरीरजेन स्वभावहेमप्रतिमौ सरूपौ । यावर्चितौ
    स्कन्दगणेश्वराभ्यां तौ मे शरण्यौ शरणं भवेताम् ॥ १०४॥ इलोवाच । संसारतापत्रयदावदग्धाः शरीरिणो यौ परिचिन्तयन्तः
    । सद्यः परां निर्वृतिमाप्नुवन्ति तौ शङ्करौ मे शरणं भवेताम् ॥ १०५॥ आर्ता ह्यहं पीडितमानसा ते क्लेशादिगोप्ता
    न परोऽस्ति कश्चित् । देव त्वदीयौ चरणौ सुपुण्यौ तौ मे शरण्यौ शरणं भवेताम् ॥ १०६॥ पुरूरवा उवाच । ययोः
    सकाशादिदमभ्युदैति प्रयाति चान्ते लयमेव सर्वम् । जगच्छरण्यौ जगदात्मकौ तु गौरीहरौ मे शरणं भवेताम् ॥
    १०७॥ यौ देववृन्देषु महोत्सवे तु पादौ गृहाणेश गिरीशपुत्र्याः । प्रोक्तं धृतौ प्रीतिवशाच्छिवेन तौ मे
    शरण्यौ शरणं भवेताम् ॥ १०८॥ इति ब्रह्मपुराणे अष्टाधिकशततमाध्यायान्तर्गतं बुधादिभिः कृतं शिवस्तोत्रं
    समाप्तम् । ब्रह्मपुराण । अध्याय १०८
