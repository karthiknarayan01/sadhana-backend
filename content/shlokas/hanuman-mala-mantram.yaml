id: hanuman-mala-mantram
category: stotram
name:
  english: Hanuman Mala Mantram
content:
  english: om hraum kshraum glaum hum hsaum om namo bhagavate pancavaktra hanumate prakata parakramakranta
    sakaladinmandalaya nijakirti sphurtidhavalya vitanayamana jagattritayaya atulabalaishvarya rudravataraya
    mairavana madavarana garva nirvapanotkantha kanthiravaya brahmastragarva sarvankashaya akshashikshana
    vicakshanaya dashagriva garvaparvatotpatanaya ramamanasa cakoramritakaraya manikundalamandita gandasthalaya
    mandahasojjvalanmukharavindaya maunji kaupina virajatkatitataya durvara varakilita lambashikhaya tatitkoti
    samujjvala pitambaralankritaya tapta jambunadaprabhabhasura ramya divyamangala vigrahaya manimayagraiveyangada
    harakinkini kiritodaramurtaye tripancanayana sphuratpancavaktra khatvanga trishula khadgogra pashankusha
    kshmadhara bhuruha kaumodaki kapala halabhriddashabhujatopapratapa bhushanaya kshya varaha hayagrivanana
    dharaya nirankusha vagvaibhavapradaya sarvotkrishta phalapradaya sukumara brahmacarine rama sugriva
    sandhana caturya prabhavaya rudratejasvine vayunandanaya anjanagarbharatnakaramritakaraya nirantara
    ramacandrapadaravinda makaranda matta madhurakarayamana manasaya nijavala valayikrita kapisainya prakaraya
    sakala jaganmodakotkrishtakarya nirvahakaya om namo bhagavate pancavaktra hanumate tejorashe ehyehi
    devabhayam asurabhayam gandharvabhayam yakshabhayam brahmarakshasabhayam bhutabhayam pretabhayam pishacabhayam
    vidravaya vidravaya rajabhayam corabhayam shatrubhayam sarpabhayam vrishcikabhayam mrigabhayam pakshibhayam
    krimibhayam kitakabhayam khadaya khadaya om namo bhagavate pancavaktra hanumate jagadashcaryakara
    shauryashaline ehyehi shravanajabhutanam drishtijabhutanam shakini dhakini kamini mohininam bhetala
    brahmarakshasa sakala kushmandanam vishayadushtanam vishamavisheshajanam bhayam hara hara matha matha
    bhedaya bhedaya chedaya chedaya maraya maraya shoshaya shoshaya praharaya praharaya thathathatha khakhakhakha
    khekhe om namo bhagavate pancavaktra hanumate shrinkhalabandha vimocanaya umamaheshvara tejo mahimavatara
    sarvavishabhedana sarvabhayotpatana sarvajvaracchedana sarvabhayabhanjana om namo bhagavate pancavaktra
    hanumate kabalikritarkamandala bhutamandala pretamandala pishacamandalannirghataya nirghataya bhutajvara
    pretajvara pishacajvara maheshvarajvara bhetalajvara brahmarakshasajvara aikahikajvara dvyahikajvara
    tryahikajvara caturthikajvara pancaratrikajvara vishamajvara doshajvara brahmarakshasajvara bhetalapasha
    mahanagakulavisham nirvisham kuru kuru jhata jhata daha daha om namo bhagavate pancavaktra hanumate
    kalarudra raudravatara sarvagrahanuccatayoccataya aha aha ehi ehi dashadisho bandha bandha sarvato
    raksha raksha sarvashatrun kampaya kampaya maraya maraya dahaya dahaya kabalaya kabalaya sarvajananaveshaya
    aveshaya mohaya mohaya akarshaya akarshaya om namo bhagavate pancavaktra hanumate jagadgitakirtaye
    pratyarthidarpa dalanaya paramantradarpa dalanaya paramantraprananashaya atmamantra parirakshanaya
    parabalam khadaya khadaya kshobhaya kshobhaya haraya haraya tvadbhakta manorathani puraya puraya sakalasanjivininayaka
    varam me dapaya dapaya om namo bhagavate pancavaktra hanumate om hraum kshraum glaum hum hsaum shrim
    bhrim ghrim om nrum klim hram hrim hrum hraim hraum hrah hum phat khe khe hum phat svaha | iti shri
    pancamukha hanumanmala mantram ||
  devanagari: ॐ ह्रौं क्ष्रौं ग्लौं हुं ह्सौं ॐ नमो भगवते पञ्चवक्त्र हनूमते प्रकट पराक्रमाक्रान्त सकलदिङ्मण्डलाय
    निजकीर्ति स्फूर्तिधावल्य वितानायमान जगत्त्रितयाय अतुलबलैश्वर्य रुद्रावताराय मैरावण मदवारण गर्व निर्वापणोत्कण्ठ
    कण्ठीरवाय ब्रह्मास्त्रगर्व सर्वङ्कषाय अक्षशिक्षण विचक्षणाय दशग्रीव गर्वपर्वतोत्पाटनाय राममानस चकोरामृतकराय
    मणिकुण्डलमण्डित गण्डस्थलाय मन्दहासोज्ज्वलन्मुखारविन्दाय मौञ्जी कौपीन विराजत्कटितटाय दुर्वार वारकीलित
    लम्बशिखाय तटित्कोटि समुज्ज्वल पीताम्बरालङ्कृताय तप्त जाम्बूनदप्रभाभासुर रम्य दिव्यमङ्गल विग्रहाय मणिमयग्रैवेयाङ्गद
    हारकिङ्किणी किरीटोदारमूर्तये त्रिपञ्चनयन स्फुरत्पञ्चवक्त्र खट्वाङ्ग त्रिशूल खड्गोग्र पाशाङ्कुश क्ष्माधर
    भूरुह कौमोदकी कपाल हलभृद्दशभुजाटोपप्रताप भूषणाय क्ष्य वराह हयग्रीवानन धराय निरङ्कुश वाग्वैभवप्रदाय
    सर्वोत्कृष्ट फलप्रदाय सुकुमार ब्रह्मचारिणे राम सुग्रीव सन्धान चातुर्य प्रभावाय रुद्रतेजस्विने वायुनन्दनाय
    अञ्जनागर्भरत्नाकरामृतकराय निरन्तर रामचन्द्रपादारविन्द मकरन्द मत्त मधुरकरायमाण मानसाय निजवाल वलयीकृत
    कपिसैन्य प्राकाराय सकल जगन्मोदकोत्कृष्टकार्य निर्वाहकाय ॐ नमो भगवते पञ्चवक्त्र हनूमते तेजोराशे एह्येहि
    देवभयं असुरभयं गन्धर्वभयं यक्षभयं ब्रह्मराक्षसभयं भूतभयं प्रेतभयं पिशाचभयं विद्रावय विद्रावय राजभयं
    चोरभयं शत्रुभयं सर्पभयं वृश्चिकभयं मृगभयं पक्षिभयं क्रिमिभयं कीटकभयं खादय खादय ॐ नमो भगवते पञ्चवक्त्र
    हनूमते जगदाश्चर्यकर शौर्यशालिने एह्येहि श्रवणजभूतानां दृष्टिजभूतानां शाकिनी ढाकिनी कामिनी मोहिनीनां
    भेताल ब्रह्मराक्षस सकल कूश्माण्डानां विषयदुष्टानां विषमविशेषजानां भयं हर हर मथ मथ भेदय भेदय छेदय छेदय
    मारय मारय शोषय शोषय प्रहारय प्रहारय ठठठठ खखखख खेखे ॐ नमो भगवते पञ्चवक्त्र हनूमते शृङ्खलाबन्ध विमोचनाय
    उमामहेश्वर तेजो महिमावतार सर्वविषभेदन सर्वभयोत्पाटन सर्वज्वरच्छेदन सर्वभयभञ्जन ॐ नमो भगवते पञ्चवक्त्र
    हनूमते कबलीकृतार्कमण्डल भूतमण्डल प्रेतमण्डल पिशाचमण्डलान्निर्घाटय निर्घाटाय भूतज्वर प्रेतज्वर पिशाचज्वर
    माहेश्वरज्वर भेतालज्वर ब्रह्मराक्षसज्वर ऐकाहिकज्वर द्व्याहिकज्वर त्र्याहिकज्वर चातुर्थिकज्वर पाञ्चरात्रिकज्वर
    विषमज्वर दोषज्वर ब्रह्मराक्षसज्वर भेतालपाश महानागकुलविषं निर्विषं कुरु कुरु झट झट दह दह ॐ नमो भगवते
    पञ्चवक्त्र हनूमते कालरुद्र रौद्रावतार सर्वग्रहानुच्चाटयोच्चाटय आह आह एहि एहि दशदिशो बन्ध बन्ध सर्वतो
    रक्ष रक्ष सर्वशत्रून् कम्पय कम्पय मारय मारय दाहय दाहय कबलय कबलय सर्वजनानावेशय आवेशय मोहय मोहय आकर्षय
    आकर्षय ॐ नमो भगवते पञ्चवक्त्र हनूमते जगद्गीतकीर्तये प्रत्यर्थिदर्प दलनाय परमन्त्रदर्प दलनाय परमन्त्रप्राणनाशाय
    आत्ममन्त्र परिरक्षणाय परबलं खादय खादय क्षोभय क्षोभय हारय हारय त्वद्भक्त मनोरथानि पूरय पूरय सकलसञ्जीविनीनायक
    वरं मे दापय दापय ॐ नमो भगवते पञ्चवक्त्र हनूमते ॐ ह्रौं क्ष्रौं ग्लौं हुं ह्सौं श्रीं भ्रीं घ्रीं ॐ
    न्रूं क्लीं ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः हुं फट् खे खे हुं फट् स्वाहा । इति श्री पञ्चमुख हनुमन्माला
    मन्त्रम् ॥
