id: indrasyashatcatvarimshanamastotram
category: stotram
name:
  english: indrasyashatcatvarimshanamastotram
  devanagari: इन्द्रस्यषट्चत्वारिंशनामस्तोत्रम्
content:
  english: indrasya shatcatvarimshanamastotram nanda uvaca | indrah surapatih shakro ditijah pavanagrajah
    || 150|| sahasraksho bhagangashca kashyapangaja eva ca | bidaujashca sunasiro marutvanpakashasanah
    || 151|| jayantajanakah shrimanchacisho daityasudanah | vajrahastah kamasakho gautamivratanashanah
    || 152|| vritraha vasavashcaiva dadhicidehabhikshukah | vishnushca vamanabhrata puruhutah purandarah
    || 153|| divaspatih shatamakhah sutrama gotrabhidvibhuh | lekharshabho balaratirjambhabhedi surashrayah
    || 154|| sankrandano dushcyavanasturashanmeghavahanah | akhandalo harihayo namuciprananashanah ||
    155|| vriddhashrava vrishashcaiva daityadarpanishudanah | shatcatvarimshannamani papaghnani vinishcitam
    || 156|| stotrametatkauthumoktam nityam yadi pathennarah | mahavipattau shakrastam vajrahastashca
    rakshati || 157|| ativrishtishilavrishtivajrapatacca darunat | kadacinna bhayam tasya rakshita vasavah
    svayam || 158|| yatra gehe stotramidam yashca janati punyavan | na tatra vajrapatanam shilavrishtishca
    narada || 159|| iti brahmavaivartapurane shrikrishnajanmakhande ekavimshadhyayantargatam indrasya
    shatcatvarimshanamastotram sampurnam | brahmavaivartapurana | shrikrishnajanma
  devanagari: इन्द्रस्य षट्चत्वारिंशनामस्तोत्रम् नन्द उवाच । इन्द्रः सुरपतिः शक्रो दितिजः पवनाग्रजः ॥
    १५०॥ सहस्राक्षो भगाङ्गश्च कश्यपाङ्गज एव च । बिडौजाश्च सुनासीरो मरुत्वान्पाकशासनः ॥ १५१॥ जयन्तजनकः
    श्रीमाञ्छचीशो दैत्यसूदनः । वज्रहस्तः कामसखो गौतमीव्रतनाशनः ॥ १५२॥ वृत्रहा वासवश्चैव दधीचिदेहभिक्षुकः
    । विष्णुश्च वामनभ्राता पुरुहूतः पुरन्दरः ॥ १५३॥ दिवस्पतिः शतमखः सुत्रामा गोत्रभिद्विभुः । लेखर्षभो
    बलारातिर्जम्भभेदी सुराश्रयः ॥ १५४॥ सङ्क्रन्दनो दुश्च्यवनस्तुराषाण्मेघवाहनः । आखण्डलो हरिहयो नमुचिप्राणनाशनः
    ॥ १५५॥ वृद्धश्रवा वृषश्चैव दैत्यदर्पनिषूदनः । षट्चत्वारिंशन्नामानि पापघ्नानि विनिश्चितम् ॥ १५६॥ स्तोत्रमेतत्कौथुमोक्तं
    नित्यं यदि पठेन्नरः । महाविपत्तौ शक्रस्तं वज्रहस्तश्च रक्षति ॥ १५७॥ अतिवृष्टिशिलावृष्टिवज्रपाताच्च
    दारुणात् । कदाचिन्न भयं तस्य रक्षिता वासवः स्वयम् ॥ १५८॥ यत्र गेहे स्तोत्रमिदं यश्च जानाति पुण्यवान्
    । न तत्र वज्रपतनं शिलावृष्टिश्च नारद ॥ १५९॥ इति ब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे एकविंशाध्यायान्तर्गतं
    इन्द्रस्य षट्चत्वारिंशनामस्तोत्रं सम्पूर्णम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
meaning: {}
