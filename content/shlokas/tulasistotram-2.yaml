id: tulasistotram-2
category: stotram
name:
  english: tulasistotram 2
  devanagari: तुलसीस्तोत्रम् २
content:
  english: tulasistotram 2 shribhagavanuvaca | vrindarupashca vrikshashca yadaikatra bhavanti ca | vidurbudhastena
    vrindam matpriyam tam bhaja myaham || 18|| pura babhuva ya devi hyadau vrindavane vane | tena vrindavani
    khyata tam saubhagyam bhajamyaham || 19|| asankhyeshu ca vishveshu pujita ya nirantaram | tena vishvapujitakhyam
    jagatpujyam bhajamyaham || 20|| asankhyani ca vishvani pavitrani yaya sada | tam vishvapavanim devim
    virahena smaramyaham || 21|| deva na tushtah pushpanam samuhena yaya vina | tam pushpasaram shuddham
    ca drashtumicchami shokatah || 22|| vishve yatpraptimatrena bhaktya''nando bhaveddhruvam | nandini
    tena vikhyata sa prita bhavita hi me || 23|| yasya devya stula nasti vishveshu nikhileshu ca | tulasi
    tena vikhyata tam yami sharanam priye || 24|| krishnajivanarupa ya shashvatpriyatama sati | tena krishnajivaniti
    mama rakshatu jivanam || 25|| ityevam stavanam kritva tatra tasthau ramapatih | dadarsha tulasim sakshatpada
    padme natam satim || 26|| rudatimabhimanena maninim manapujitam | priyam drishtva priyah shighram
    vasayamasa vakshasi || 27|| vrindam vrindavanim vishvapavanimvishvapujitam | pushpasaram nandinim
    ca tulasim krishnajivanim || 32|| etannamashtakam caita tstotram namarthasamyutam | yah pathettam
    ca sampujya so'shvamedhaphalam labhet || 33|| tulasim pushpasaram ca satim pujyam manoharam | kritsnapapedhmadahaya
    jvaladagnishikhopamam || 41|| pushpeshu tulanapyasya nasiddevishu va mune | pavitrarupa sarvasu tulasi
    sa ca kirttita || 42|| shirodharya ca sarveshamipsitam vishvapavanim | jivanmuktam muktidam ca bhaja
    tam haribhaktidam || 43|| iti brahmavaivartapurane prakritikhande dvavimshadhyayantargatam tulasistotram
    samaptam | brahmavaivartapurana | prakritikhanda | adhyaya 22
  devanagari: तुलसीस्तोत्रम् २ श्रीभगवानुवाच । वृन्दारूपाश्च वृक्षाश्च यदैकत्र भवन्ति च । विदुर्बुधास्तेन
    वृन्दां मत्प्रियां तां भजा म्यहम् ॥ १८॥ पुरा बभूव या देवी ह्यादौ वृन्दावने वने । तेन वृन्दावनी ख्याता
    तां सौभाग्यां भजाम्यहम् ॥ १९॥ असङ्ख्येषु च विश्वेषु पूजिता या निरन्तरम् । तेन विश्वपूजिताख्यां जगत्पूज्यां
    भजाम्यहम् ॥ २०॥ असङ्ख्यानि च विश्वानि पवित्राणि यया सदा । तां विश्वपावनीं देवीं विरहेण स्मराम्यहम्
    ॥ २१॥ देवा न तुष्टाः पुष्पाणां समूहेन यया विना । तां पुष्पसारां शुद्धां च द्रष्टुमिच्छामि शोकतः ॥
    २२॥ विश्वे यत्प्राप्तिमात्रेण भक्त्याऽऽनन्दो भवेद्ध्रुवम् । नन्दिनी तेन विख्याता सा प्रीता भविता हि
    मे ॥ २३॥ यस्या देव्या स्तुला नास्ति विश्वेषु निखिलेषु च । तुलसी तेन विख्याता तां यामि शरणं प्रिये
    ॥ २४॥ कृष्णजीवनरूपा या शश्वत्प्रियतमा सती । तेन कृष्णजीवनीति मम रक्षतु जीवनम् ॥ २५॥ इत्येवं स्तवनं
    कृत्वा तत्र तस्थौ रमापतिः । ददर्श तुलसीं साक्षात्पाद पद्मे नतां सतीम् ॥ २६॥ रुदतीमभिमानेन मानिनीं
    मानपूजिताम् । प्रियां दृष्ट्वा प्रियः शीघ्रं वासयामास वक्षसि ॥ २७॥ वृन्दां वृन्दावनीं विश्वपावनींविश्वपूजिताम्
    । पुष्पसारां नन्दिनीं च तुलसीं कृष्णजीवनीम् ॥ ३२॥ एतन्नामाष्टकं चैत त्स्तोत्रं नामार्थसंयुतम् । यः
    पठेत्तां च सम्पूज्य सोऽश्वमेधफलं लभेत् ॥ ३३॥ तुलसीं पुष्पसारां च सतीं पूज्यां मनोहराम् । कृत्स्नपापेध्मदाहाय
    ज्वलदग्निशिखोपमाम् ॥ ४१॥ पुष्पेषु तुलनाप्यस्या नासीद्देवीषु वा मुने । पवित्ररूपा सर्वासु तुलसी सा
    च कीर्त्तिता ॥ ४२॥ शिरोधार्या च सर्वेषामीप्सितां विश्वपावनीम् । जीवन्मुक्तां मुक्तिदां च भज तां हरिभक्तिदाम्
    ॥ ४३॥ इति ब्रह्मवैवर्तपुराणे प्रकृतिखण्डे द्वाविंशाध्यायान्तर्गतं तुलसीस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण
    । प्रकृतिखण्ड । अध्याय २२
