id: tripurasun
category: stotram
name:
  english: tripurasun
  devanagari: त्रिपुरसुन्
content:
  english: rdipodbhasisharavashobhitamukhaih kumbhairnavaih shobhina | svarnabaddhavicitraratnapatalicancatkapatashriya
    yuktam dvaracatushtayena girije vande mani mandiram || 21|| astirnarunakambalasanayutam pushpopaharanvitam
    diptanekamanipradipasubhagam rajadvitanottamam | dhupodgarisugandhisambhramamiladbhringavaligunjitam
    kalyanam vitanotu me'navaratam shrimandapabhyantaram || 22|| kanakaracite pancapretasanena virajite
    maniganacite raktashvetambarastaranottame | kusumasurabhau talpe divyopadhanasukhavahe hridayakamale
    pradurbhutam bhaje paradevatam || 23|| sarvangasthitiramyaruparuciram pratah samabhyutthitam jrimbhamanjumukhambujam
    madhumadavyaghurnadakshitrayam | sevayatasamastasamnidhisakhih sammanayantim drisha sampashyanparadevatam
    paramaho manye kritartham januh || 24|| uccaistoranavartivadyanivahadhvane samujjrimbhite bhaktairbhumivilagnamaulibhiralam
    dandapraname krite | nanaratnasamuhanaddhakathanasthalisamudbhasitam prataste parikalpayami girije
    nirajanamujjvalam || 25|| padyam te parikalpayami padayorarghyam tatha hastayoh saudhibhirmadhuparkamamba
    madhuram dharabhirasvadaya | toyenacamanam vidhehi shucina gangena matkalpitam sashtangam pranipatamishadayite
    drishtya kritarthi kuru || 26|| matah pashya mukhambujam suvimale datte maya darpane devi svikuru
    dantadhavanamidam gangajalenanvitam | suprakshalitamananam viracayansnigdhambarapronchanam dragangikuru
    tattvamamba madhuram tambulamasvadaya || 27|| nidhehi manipadukopari padambujam majjana
  devanagari: र्दीपोद्भासिशरावशोभितमुखैः कुम्भैर्नवैः शोभिना । स्वर्णाबद्धविचित्ररत्नपटलीचञ्चत्कपाटश्रिया
    युक्तं द्वारचतुष्टयेन गिरिजे वन्दे मणी मन्दिरम् ॥ २१॥ आस्तीर्णारुणकम्बलासनयुतं पुष्पोपहारान्वितं दीप्तानेकमणिप्रदीपसुभगं
    राजद्वितानोत्तमम् । धूपोद्गारिसुगन्धिसम्भ्रममिलद्भृङ्गावलीगुञ्जितं कल्याणं वितनोतु मेऽनवरतं श्रीमण्डपाभ्यन्तरम्
    ॥ २२॥ कनकरचिते पञ्चप्रेतासनेन विराजिते मणिगणचिते रक्तश्वेताम्बरास्तरणोत्तमे । कुसुमसुरभौ तल्पे दिव्योपधानसुखावहे
    हृदयकमले प्रादुर्भूतां भजे परदेवताम् ॥ २३॥ सर्वाङ्गस्थितिरम्यरूपरुचिरां प्रातः समभ्युत्थितां जृम्भामञ्जुमुखाम्बुजां
    मधुमदव्याघूर्णदक्षित्रयाम् । सेवायातसमस्तसंनिधिसखीः संमानयन्तीं दृशा सम्पश्यन्परदेवतां परमहो मन्ये
    कृतार्थं जनुः ॥ २४॥ उच्चैस्तोरणवर्तिवाद्यनिवहध्वाने समुज्जृम्भिते भक्तैर्भूमिविलग्नमौलिभिरलं दण्डप्रणामे
    कृते । नानारत्नसमूहनद्धकथनस्थालीसमुद्भासितां प्रातस्ते परिकल्पयामि गिरिजे नीराजनामुज्ज्वलाम् ॥ २५॥
    पाद्यं ते परिकल्पयामि पदयोरर्घ्यं तथा हस्तयोः सौधीभिर्मधुपर्कमम्ब मधुरं धाराभिरास्वादय । तोयेनाचमनं
    विधेहि शुचिना गाङ्गेन मत्कल्पितं साष्टाङ्गं प्रणिपातमीशदयिते दृष्ट्या कृतार्थी कुरु ॥ २६॥ मातः पश्य
    मुखाम्बुजं सुविमले दत्ते मया दर्पणे देवि स्वीकुरु दन्तधावनमिदं गङ्गाजलेनान्वितम् । सुप्रक्षालितमाननं
    विरचयन्स्निग्धाम्बरप्रोञ्छनं द्रागङ्गीकुरु तत्त्वमम्ब मधुरं ताम्बूलमास्वादय ॥ २७॥ निधेहि मणिपादुकोपरि
    पदाम्बुजं मज्जना
