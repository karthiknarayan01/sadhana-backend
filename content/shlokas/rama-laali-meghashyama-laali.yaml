id: rama-laali-meghashyama-laali
category: stotram
name:
  english: Rama Laali Meghashyama Laali
content:
  english: rama lali meghashyama lali tamarasa nayana dasharatha tanaya lali || accavadana ataladi alasinavura
    bòjjalopalarigèdaka nidurapovara || jola padi jokòttitè alakincèvu calincamari urukunte sanjna cesevu
    || ènto èttu mariginavu emi setura intula cetula kakalaku ènto kandevu ||
  devanagari: राम लाली मेघश्याम लाली तामरसा नयन दशरथ तनय लाली ॥ अच्चावदन आटलाडि अलसिनावुरा बॊज्जलोपलरिगॆदाक
    निदुरपोवरा ॥ जोल पाडि जोकॊट्टितॆ आलकिञ्चॆवु चालिञ्चमरि ऊरुकुण्टे सञ्ज्ञ चेसेवु ॥ ऎन्तो ऎत्तु मरिगिनावु
    एमि सेतुरा इन्तुल चेतुल काकलकु ऎन्तो कन्देवु ॥
