id: kadrukritamindrastotram
category: stotram
name:
  english: kadrukritamindrastotram
  devanagari: कद्रुकृतंइन्द्रस्तोत्रम्
content:
  english: kadrukritam indrastotram namaste devadevesha namaste balasudana | namucighna namaste'stu sahasraksha
    shacipate || 7|| sarpanam suryataptanam varina tvam plavo bhava | tvameva paramam tranamasmakamamarottama
    || 8|| isho hyasi payah srashtum tvamanalpam purandara | tvameva meghastvam vayustvamagnirvaidyuto'mbare
    || 9|| tvamabhraghanavikshepta tvamevahuh punarghanam | tvam vajramatulam ghoram ghoshavamstvam balahakah
    || 10|| srashta tvameva lokanam samharta caparajitah | tvam jyotih sarvabhutanam tvamadityo vibhavasuh
    || 11|| tvam mahadbhutamashcaryam tvam raja tvam surottamah | tvam vishnustvam sahasrakshastvam devastvam
    parayanam || 12|| tvam sarvamamritam deva tvam somah paramarcitah | tvam muhurtastithishca tvam lavastvam
    vai punah kshanah || 13|| shuklastvam bahulashcaiva kala kashtha trutistatha | samvatsarartavo masa
    rajanyashca dinani ca || 14|| tvamuttama sagirivana vasundhara sabhaskaram vitimiramambaram tatha
    | mahodadhih satimitimingilastatha mahormimanbahumakaro jhashalayah || 15|| mahadyashastvamiti sadabhipujyase
    manishibhirmuditamana maharshibhih | abhishtutah pibasi ca somamadhvare vashatkritanyapi ca havimshi
    bhutaye || 16|| tvam vipraih satatamihejyase phalartham vedangeshvatulabalaugha giyase ca | tvaddhetoryajanaparayana
    dvijendra vedanganyabhigamayanti sarvavedaih || 17|| iti mahabharate adiparvani 21 adhyayantargatam
    kadrukritam indrastotram sampurnam | mahabharata | adiparva | adhyaya 21
  devanagari: कद्रुकृतं इन्द्रस्तोत्रम् नमस्ते देवदेवेश नमस्ते बलसूदन । नमुचिघ्न नमस्तेऽस्तु सहस्राक्ष
    शचीपते ॥ ७॥ सर्पाणां सूर्यतप्तानां वारिणा त्वं प्लवो भव । त्वमेव परमं त्राणमस्माकममरोत्तम ॥ ८॥ ईशो
    ह्यसि पयः स्रष्टुं त्वमनल्पं पुरन्दर । त्वमेव मेघस्त्वं वायुस्त्वमग्निर्वैद्युतोऽम्बरे ॥ ९॥ त्वमभ्रघनविक्षेप्ता
    त्वामेवाहुः पुनर्घनम् । त्वं वज्रमतुलं घोरं घोषवांस्त्वं बलाहकः ॥ १०॥ स्रष्टा त्वमेव लोकानां संहर्ता
    चापराजितः । त्वं ज्योतिः सर्वभूतानां त्वमादित्यो विभावसुः ॥ ११॥ त्वं महद्भूतमाश्चर्यं त्वं राजा त्वं
    सुरोत्तमः । त्वं विष्णुस्त्वं सहस्राक्षस्त्वं देवस्त्वं परायणम् ॥ १२॥ त्वं सर्वममृतं देव त्वं सोमः
    परमार्चितः । त्वं मुहूर्तस्तिथिश्च त्वं लवस्त्वं वै पुनः क्षणः ॥ १३॥ शुक्लस्त्वं बहुलश्चैव कला काष्ठा
    त्रुटिस्तथा । संवत्सरर्तवो मासा रजन्यश्च दिनानि च ॥ १४॥ त्वमुत्तमा सगिरिवना वसुन्धरा सभास्करं वितिमिरमम्बरं
    तथा । महोदधिः सतिमितिमिङ्गिलस्तथा महोर्मिमान्बहुमकरो झषालयः ॥ १५॥ महद्यशस्त्वमिति सदाभिपूज्यसे मनीषिभिर्मुदितमना
    महर्षिभिः । अभिष्टुतः पिबसि च सोममध्वरे वषट्कृतान्यपि च हवींषि भूतये ॥ १६॥ त्वं विप्रैः सततमिहेज्यसे
    फलार्थं वेदाङ्गेष्वतुलबलौघ गीयसे च । त्वद्धेतोर्यजनपरायणा द्विजेन्द्रा वेदाङ्गान्यभिगमयन्ति सर्ववेदैः
    ॥ १७॥ इति महाभारते आदिपर्वणि २१ अध्यायान्तर्गतं कद्रुकृतं इन्द्रस्तोत्रं सम्पूर्णम् । महाभारत । आदिपर्व
    । अध्याय २१
