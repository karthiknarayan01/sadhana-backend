id: ganeshakritamshivastotram
category: stotram
name:
  english: ganeshakritamshivastotram
  devanagari: गणेशकृतंशिवस्तोत्रम्
content:
  english: ganeshakritam shivastotram ganesha uvaca | namami devam shaktyanvitam jnanarupam prasannam
    jnanatparam paramam jyotirupam | rupatparam paramam tattvarupam tattvatparam paramam mangalam ca anandakhyam
    nishkalam nirvishadam || 48|| dhumatparamayovahnirdhumavatpratibhasate | prakrityantargatastvam hi
    lakshyase jnanisambhavah | prakrityantargatastvam hi mayavyaktiritiyase || 49|| evamvidhastvam bhagavansvamayaya
    srijasyatho lumpasi pasi vishvam | asmadgaratsarvamidam pranashtam sabrahmaviprendrayutam caracaram
    || 50|| yatha pura''sirbhagavanmaheshastrailokyanatho'si caracaratma | kurushya shighram sahajivakosham
    caracaram tatsakalam pradagdham || 51|| iti shriskandapurane maheshvarakhande
  devanagari: गणेशकृतं शिवस्तोत्रम् गणेश उवाच । नमामि देवं शक्त्यान्वितं ज्ञानरूपं प्रसन्नं ज्ञानात्परं
    परमं ज्योतिरूपम् । रूपात्परं परमं तत्त्वरूपं तत्त्वात्परं परमं मङ्गलं च आनन्दाख्यं निष्कलं निर्विषादम्
    ॥ ४८॥ धूमात्परमयोवह्निर्धूमवत्प्रतिभासते । प्रकृत्यन्तर्गतस्त्वं हि लक्ष्यसे ज्ञानिसम्भवः । प्रकृत्यन्तर्गतस्त्वं
    हि मायाव्यक्तिरितीयसे ॥ ४९॥ एवंविधस्त्वं भगवन्स्वमायया सृजस्यथो लुम्पसि पासि विश्वम् । अस्माद्गरात्सर्वमिदं
    प्रनष्टं सब्रह्मविप्रेन्द्रयुतं चराचरम् ॥ ५०॥ यथा पुराऽऽसीर्भगवान्महेशस्त्रैलोक्यनाथोऽसि चराचरात्मा
    । कुरुष्य शीघ्रं सहजीवकोशं चराचरं तत्सकलं प्रदग्धम् ॥ ५१॥ इति श्रीस्कन्दपुराणे माहेश्वरखण्डे
