id: viramanikantha
category: stotram
name:
  english: viramanikantha
  devanagari: वीरमनिकन्थ
content:
  english: anatha natha dina bandho shabari girisha nitya nirmala nishada virya vira manikantha | caturmukha
    pujya nada svarupa vira manikantha | madagaja vaha manmatha rupa vira manikantha | kalimala nashana
    kirtanapriya vira manikantha | satya svarupa tandavapriya vira manikantha | yogananda yogi kula virya
    vira manikantha | mohini suta mohana rupa vira manikantha | bhumi prapanca bhusura rakshaka vira manikantha
    | villari vira vijaya kumara vira manikantha | bhaktavatsala parama dayala vira manikantha | shabari
    girisha suguna pratapa vira manikantha | komalarupa shyamala varna vira manikantha | anatha rakshaka
    apatbandhava vira manikantha | manimaya bhusha manjula bhasha vira manikantha | kanta girisha kanana
    priya vira manikantha | punyashloka pushkala kanta vira manikantha | shambu kumara shanmukha sodara
    vira manikantha
  devanagari: अनाथ नाथ दीन बन्धो शबरि गिरीश नित्य निर्मला निषाद वीर्या वीर मणिकण्ठ । चतुर्मुख पूज्य नाद
    स्वरूप वीर मणिकण्ठ । मदगज वाहा मन्मथ रूपा वीर मणिकण्ठ । कलिमल नाशन कीर्तनप्रिय वीर मणिकण्ठ । सत्य
    स्वरूप ताण्डवप्रिय वीर मणिकण्ठ । योगानन्द योगि कुल वीर्य वीर मणिकण्ठ । मोहिनि सुत मोहन रूप वीर मणिकण्ठ
    । भूमि प्रपञ्च भूसुर रक्षक वीर मणिकण्ठ । विल्लरि वीरा विजय कुमारा वीर मणिकण्ठ । भक्तवत्सला परम दयाला
    वीर मणिकण्ठ । शबरि गिरीशा सुगुण प्रतापा वीर मणिकण्ठ । कोमलरूपा श्यामल वर्णा वीर मणिकण्ठ । अनाथ रक्षक
    आपत्बान्धव वीर मणिकण्ठ । मणिमय भूष मञ्जुल भाषा वीर मणिकण्ठ । कान्त गिरीशा कानन प्रिय वीर मणिकण्ठ ।
    पुण्यश्लोका पुष्कला कान्त वीर मणिकण्ठ । शम्बु कुमारा षण्मुख सोदर वीर मणिकण्ठ
