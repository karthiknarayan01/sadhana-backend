id: vishnuvallabhashtashashtinamatirthastotra
category: stotram
name:
  english: vishnuvallabhashtashashtinamatirthastotra
  devanagari: विष्णुवल्लभाष्टषष्टिनामतीर्थस्तोत्र
content:
  english: rinushvavahito brahman guhyanamani me'dhuna | kshetrani caiva guhyani tava vakshyami tattvatah
    || 6|| kokamukhe tu varaham mandare madhusudanam | anantam kapiladvipe prabhase ravinandanam || 7||
    malyodapane vaikuntham mahendre tu nripatmajam | rishabhe tu mahavishnum dvarakayam tu bhupatim ||
    8|| pandusahye tu devesham vasurudhe jagatpatim | vallivate mahayogam citrakute naradhipam || 9||
    nimishe pitavasam ca gavam nishkramane harim | shalagrame tapovasamacintyam gandhamadane || 10|| kubjagare
    hrishikesham gandhadvare payodharam | garudadhvajam tu sakale govindam nama sayake || 11|| vrindavane
    tu gopalam mathurayam svayambhuvam | kedare madhavam vindyadvaranasyam tu keshavam || 12|| pushkare
    pushkaraksham tu dhrishtadyumne jayadhvajam | trinabinduvane viramashokam sindhusagare || 13|| kaserate
    mahabahumamritam taijase vane | vishvasayupe vishvesham narasimham mahavane || 14|| halangare ripuharam
    devashalam trivikramam | purushottamam dashapure kubjake vamanam viduh || 15|| vidyadharam vitastayam
    varahe dharanidharam | devadaruvane guhyam kaveryam nagashayinam || 16|| prayage yogamurtim ca payoshnyam
    ca sudarshanam | kumaratirthe kaumaram lohite hayashirshakam || 17|| ujjayinyam trivikramam lingakute
    caturbhujam | hariharam tu bhadrayam drishtva papat pramucyate || 18|| vishvarupam kurukshetre manikunde
    halayudham | lokanathamayodhyayam kundine kundineshvaram || 19|| bhandare vasudevam tu cakratirthe
    sudarshanam | adhye vishnupadam vidyacchukare shukaram viduh || 20|| brahmesham manase tirthe dandake
    shyamalam viduh | trikute nagamoksham ca meruprishthe ca bhaskaram || 21|| virajam pushpabhadrayam
    balam keralake viduh | yashaskaram vipashayam mahishmatyam hutashanam || 22|| kshirabdhau padmanabham
    tu vimale tu sanatanam | shivanadyam shivakaram gayayam ca gadadharam || 23|| sarvatra paramatmanam
    yah pashyati sa mucyate | ashtashashtishca namani kathitani maya tava || 24|| kshetrani caiva guhyani
    kathitani visheshatah | etani mama namani rahasyani prajapate || 25|| yah pathet pratarutthaya sha
  devanagari: ृणुष्वावहितो ब्रह्मन् गुह्यनामानि मेऽधुना । क्षेत्राणि चैव गुह्यानि तव वक्ष्यामि तत्त्वतः
    ॥ ६॥ कोकामुखे तु वाराहं मन्दरे मधुसूदनम् । अनन्तं कपिलद्वीपे प्रभासे रविनन्दनम् ॥ ७॥ माल्योदपाने वैकुण्ठं
    महेन्द्रे तु नृपात्मजम् । ऋषभे तु महाविष्णुं द्वारकायां तु भूपतिम् ॥ ८॥ पाण्डुसह्ये तु देवेशं वसुरूढे
    जगत्पतिम् । वल्लीवटे महायोगं चित्रकूटे नराधिपम् ॥ ९॥ निमिषे पीतवासं च गवां निष्क्रमणे हरिम् । शालग्रामे
    तपोवासमचिन्त्यं गन्धमादने ॥ १०॥ कुब्जागारे हृषीकेशं गन्धद्वारे पयोधरम् । गरुडध्वजं तु सकले गोविन्दं
    नाम सायके ॥ ११॥ वृन्दावने तु गोपालं मथुरायां स्वयम्भुवम् । केदारे माधवं विन्द्याद्वाराणस्यां तु केशवम्
    ॥ १२॥ पुष्करे पुष्कराक्षं तु धृष्टद्युम्ने जयध्वजम् । तृणबिन्दुवने वीरमशोकं सिन्धुसागरे ॥ १३॥ कसेरटे
    महाबाहुममृतं तैजसे वने । विश्वासयूपे विश्वेशं नरसिंहं महावने ॥ १४॥ हलाङ्गरे रिपुहरं देवशालां त्रिविक्रमम्
    । पुरुषोत्तमं दशपुरे कुब्जके वामनं विदुः ॥ १५॥ विद्याधरं वितस्तायां वाराहे धरणीधरम् । देवदारुवने गुह्यं
    कावेर्यां नागशायिनम् ॥ १६॥ प्रयागे योगमूर्तिं च पयोष्ण्यां च सुदर्शनम् । कुमारतीर्थे कौमारं लोहिते
    हयशीर्षकम् ॥ १७॥ उज्जयिन्यां त्रिविक्रमं लिङ्गकूटे चतुर्भुजम् । हरिहरं तु भद्रायां दृष्ट्वा पापात्
    प्रमुच्यते ॥ १८॥ विश्वरूपं कुरुक्षेत्रे मणिकुण्डे हलायुधम् । लोकनाथमयोध्यायां कुण्डिने कुण्डिनेश्वरम्
    ॥ १९॥ भाण्डारे वासुदेवं तु चक्रतीर्थे सुदर्शनम् । आढ्ये विष्णुपदं विद्याच्छूकरे शूकरं विदुः ॥ २०॥
    ब्रह्मेशं मानसे तीर्थे दण्डके श्यामलं विदुः । त्रिकूटे नागमोक्षं च मेरुपृष्ठे च भास्करम् ॥ २१॥ विरजं
    पुष्पभद्रायां बालं केरलके विदुः । यशस्करं विपाशायां माहिष्मत्यां हुताशनम् ॥ २२॥ क्षीराब्धौ पद्मनाभं
    तु विमले तु सनातनम् । शिवनद्यां शिवकरं गयायां च गदाधरम् ॥ २३॥ सर्वत्र परमात्मानं यः पश्यति स मुच्यते
    । अष्टषष्टिश्च नामानि कथितानि मया तव ॥ २४॥ क्षेत्राणि चैव गुह्यानि कथितानि विशेषतः । एतानि मम नामानि
    रहस्यानि प्रजापते ॥ २५॥ यः पठेत् प्रातरुत्थाय श
