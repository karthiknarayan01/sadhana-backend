id: shadabhijnastotram
category: stotram
name:
  english: shadabhijnastotram
  devanagari: षडभिज्नस्तोत्रम्
content:
  english: shadabhijnastotram rupalakshanasampurno hinoccasamasevanah | sandarshaya sada danam namaste
    danaparaga || 1|| shabdalakshanasampurnah sushobho gunasagarah | samshravaya sada shilam namaste shilaparaga
    || 2|| gandhalakshanasampurno divyaprano vinayakah | samprapaya jina kshantim namaste kshantiparaga
    || 3|| rasalakshanasampurnah sujihvo dharmadeshakah | bhashasva saugatam dharmam namaste viryaparagah
    || 4|| sparshalakshanasampurnah aniruddho nirihakah | samsparshaya jina dhyanam namaste dhyanaparaga
    || 5|| dharmalakshanasampurnah sattveshu samacintakah | prajnopayamahaprapta namaste buddhiparaga
    || 6|| shadabhijnastavam yo'yam trisandhyam bhaktiman pathet | samsarabandhanam hitva sa yati paramam
    gatim || 7|| iti shrimahabuddhabhattarakasya shadabhijnastotram sampurnam ||
  devanagari: षडभिज्ञस्तोत्रम् रूपलक्षणसम्पूर्णो हीनोच्चसमसेवनः । सन्दर्शय सदा दानं नमस्ते दानपारग ॥ १॥
    शब्दलक्षणसम्पूर्णः सुशोभो गुणसागरः । संश्रावय सदा शीलं नमस्ते शीलपारग ॥ २॥ गन्धलक्षणसम्पूर्णो दिव्यप्राणो
    विनायकः । संप्रापय जिन क्षान्तिं नमस्ते क्षान्तिपारग ॥ ३॥ रसलक्षणसम्पूर्णः सुजिह्वो धर्मदेशकः । भाषस्व
    सौगतं धर्मं नमस्ते वीर्यपारगः ॥ ४॥ स्पर्शलक्षणसम्पूर्णः अनिरुद्धो निरीहकः । संस्पर्शय जिन ध्यानं नमस्ते
    ध्यानपारग ॥ ५॥ धर्मलक्षणसम्पूर्णः सत्त्वेषु समचिन्तकः । प्रज्ञोपायमहाप्राप्त नमस्ते बुद्धिपारग ॥ ६॥
    षडभिज्ञस्तवं योऽयं त्रिसन्ध्यं भक्तिमान् पठेत् । संसारबन्धनं हित्वा स याति परमां गतिम् ॥ ७॥ इति श्रीमहाबुद्धभट्टारकस्य
    षडभिज्ञस्तोत्रं सम्पूर्णम् ॥
