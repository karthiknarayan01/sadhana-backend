id: rudracandikavacam
category: kavacha
name:
  english: rudracandikavacam
  devanagari: रुद्रचण्डीकवचम्
content:
  english: shribhairava rishaye namah shirasi | anushtupchandase namah mukhe | shricandikadevatayai namah
    hridi | caturvargaphalapraptyartham pathe viniyogaya namah sarvange || atha kavacastotram | candika
    me'gratah patu agneyyam bhavasundari | yamyam patu mahadevi nairrityam patu parvati || 1|| varune
    candika patu camunda patu vayave | uttare bhairavi patu ishane patu shankari || 2|| purve patu shiva
    devi urdhve patu maheshvari | adhah patu sada'nanta muladhara nivasini || 3|| murdhni patu mahadevi
    lalate ca maheshvari | kanthe kotishvari patu hridaye nalakubari || 4|| nabhau katipradeshe ca payallambodari
    sada | urvorjanvoh sada payat tvacam me madalalasa || 5|| urdhve parshve sada patu bhavani bhaktavatsala
    | padayoh patu mamisha sarvange vijaya sada || 6|| rakta mamse mahamaya tvaci mam patu lalasa | shukramajjasthisangheshu
    guhyam me bhuvaneshvari || 7|| urdhvakeshi sada payan nadi sarvangasandhishu | om aim aim hrim hrim
    camunde svahamantrasvarupini || 8|| atmanam me sada payat siddhavidya dashakshari | ityetat kavacam
    devyashcandikayah shubhavaham || 9|| || phalashruti || gopaniyam prayatnena kavacam sarvasiddhidam
    | sarvarakshakaram dhanyam na deyam yasya kasyacit || 10|| ajnatva kavacam devya yah pathet stavamuttamam
    | na tasya jayate siddhirbahudha pathanena ca || 11|| dhritvaitat kavacam devya divyadehadharo bhavet
    | adhikari bhavedetaccandipathena sadhakah || 12|| iti shrirudrayamalatantre shrishivakartikeyasamvade
    rudracandikavacam sampurnam shivam bhuyat ||
  devanagari: श्रीभैरव ऋषये नमः शिरसि । अनुष्टुप्छन्दसे नमः मुखे । श्रीचण्डिकादेवतायै नमः हृदि । चतुर्वर्गफलप्राप्त्यर्थं
    पाठे विनियोगाय नमः सर्वाङ्गे ॥ अथ कवचस्तोत्रम् । चण्डिका मेऽग्रतः पातु आग्नेय्यां भवसुन्दरी । याम्यां
    पातु महादेवी नैरृत्यां पातु पार्वती ॥ १॥ वारुणे चण्डिका पातु चामुण्डा पातु वायवे । उत्तरे भैरवी पातु
    ईशाने पातु शङ्करी ॥ २॥ पूर्वे पातु शिवा देवी ऊर्ध्वे पातु महेश्वरी । अधः पातु सदाऽनन्ता मूलाधार निवासिनी
    ॥ ३॥ मूर्ध्नि पातु महादेवी ललाटे च महेश्वरी । कण्ठे कोटीश्वरी पातु हृदये नलकूबरी ॥ ४॥ नाभौ कटिप्रदेशे
    च पायाल्लम्बोदरी सदा । ऊर्वोर्जान्वोः सदा पायात् त्वचं मे मदलालसा ॥ ५॥ ऊर्ध्वे पार्श्वे सदा पातु भवानी
    भक्तवत्सला । पादयोः पातु मामीशा सर्वाङ्गे विजया सदा ॥ ६॥ रक्त मांसे महामाया त्वचि मां पातु लालसा ।
    शुक्रमज्जास्थिसङ्घेषु गुह्यं मे भुवनेश्वरी ॥ ७॥ ऊर्ध्वकेशी सदा पायान् नाडी सर्वाङ्गसन्धिषु । ॐ ऐं
    ऐं ह्रीं ह्रीं चामुण्डे स्वाहामन्त्रस्वरूपिणी ॥ ८॥ आत्मानं मे सदा पायात् सिद्धविद्या दशाक्षरी । इत्येतत्
    कवचं देव्याश्चण्डिकायाः शुभावहम् ॥ ९॥ ॥ फलश्रुति ॥ गोपनीयं प्रयत्नेन कवचं सर्वसिद्धिदम् । सर्वरक्षाकरं
    धन्यं न देयं यस्य कस्यचित् ॥ १०॥ अज्ञात्वा कवचं देव्या यः पठेत् स्तवमुत्तमम् । न तस्य जायते सिद्धिर्बहुधा
    पठनेन च ॥ ११॥ धृत्वैतत् कवचं देव्या दिव्यदेहधरो भवेत् । अधिकारी भवेदेतच्चण्डीपाठेन साधकः ॥ १२॥ इति
    श्रीरुद्रयामलतन्त्रे श्रीशिवकार्तिकेयसंवादे रुद्रचण्डीकवचं सम्पूर्णं शिवं भूयात् ॥
