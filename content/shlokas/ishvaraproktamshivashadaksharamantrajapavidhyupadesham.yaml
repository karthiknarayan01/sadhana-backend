id: ishvaraproktamshivashadaksharamantrajapavidhyupadesham
category: mantra
name:
  english: ishvaraproktamshivashadaksharamantrajapavidhyupadesham
  devanagari: ईश्वरप्रोक्तंशिवषडक्षरमन्त्रजपविध्युपदेशम्
content:
  english: nyastarunotpalayuja parinaddhadeham || 34|| shantam padmasanastham shashadharamakutam pancavaktram
    trinetram shulam vajram ca khangam parashumabhayadam dakshabhage vahantam | nagam pasham ca ghantam
    pralayahutavaham cankusham vamabhage nanalankaradiptasphatikamaninibham parvatisham namami || 35||
    mangalayatanam devam yuvanamatisundaram | dhyayetkalpatarormule samasinam sahomaya || 36|| evam dhyatva
    japenmantram pancaksharamatandritah | tarpayellakshamekam tu juhuyallakshameva ca || 37|| ajyena payasenapi
    palashakusumena va | tatah sidhyati mantro'yam bhuktimuktiphalapradah || 38|| tailena cabhicareshu
    arkanam samidho hunet | vashye kausumbha kusumairbilvapatrairdhanaptaye || 39|| jvararogadishantyarthamashvatthasamidho
    hunet | vidveshane marane ca vaibhitakakaranjakau || 40|| uccatane ca shatrunamapamargairhunettada
    | pratyekamashtasahasram japedbhaktya samahitah || 41|| samyagjnanam samasadya mayi lino bhavishyati
    | lakshapancashatam japtva vritrareh padamapnuyat || 42|| shashtilakshajapenaiva labhate brahmanah
    padam | ashitilaksham japtva tu naro vishnutvamapnuyat || 43|| lakshanam tu shatam japtva sakshadrudratvamapnuyat
    | laksham japtva tathayushyam dvilaksham japatah sutan || 44|| nishkamo lakshadashakam japtvapyeta'vimuktakam
    | viniyogah samakhyatah tajjape lakshanam sha
  devanagari: न्यस्तारुणोत्पलयुजा परिणद्धदेहम् ॥ ३४॥ शान्तं पद्मासनस्थं शशधरमकुटं पञ्चवक्त्रं त्रिणेत्रं
    शूलं वज्रं च खङ्गं परशुमभयदं दक्षभागे वहन्तम् । नागं पाशं च घण्टां प्रलयहुतवहं चाङ्कुशं वामभागे नानालङ्कारदीप्तस्फटिकमणिनिभं
    पार्वतीशं नमामि ॥ ३५॥ मङ्गलायतनं देवं युवानमतिसुन्दरम् । ध्यायेत्कल्पतरोर्मूले समासीनं सहोमया ॥ ३६॥
    एवं ध्यात्वा जपेन्मन्त्रं पञ्चाक्षरमतन्द्रितः । तर्पयेल्लक्षमेकं तु जुहुयाल्लक्षमेव च ॥ ३७॥ आज्येन
    पायसेनापि पलाशकुसुमेन वा । ततः सिध्यति मन्त्रोऽयं भुक्तिमुक्तिफलप्रदः ॥ ३८॥ तैलेन चाभिचारेषु अर्काणां
    समिधो हुनेत् । वश्ये कौसुम्भ कुसुमैर्बिल्वपत्रैर्धनाप्तये ॥ ३९॥ ज्वररोगादिशान्त्यर्थमश्वत्थसमिधो हुनेत्
    । विद्वेषणे मारणे च वैभीतककरञ्जकौ ॥ ४०॥ उच्चाटने च शत्रूणामपामार्गैर्हुनेत्तदा । प्रत्येकमष्टसाहस्रं
    जपेद्भक्त्या समाहितः ॥ ४१॥ सम्यग्ज्ञानं समासाद्य मयि लीनो भविष्यति । लक्षपञ्चशतं जप्त्वा वृत्रारेः
    पदमाप्नुयात् ॥ ४२॥ षष्टिलक्षजपेनैव लभते ब्रह्मणः पदम् । अशीतिलक्षं जप्त्वा तु नरो विष्णुत्वमाप्नुयात्
    ॥ ४३॥ लक्षाणां तु शतं जप्त्वा साक्षाद्रुद्रत्वमाप्नुयात् । लक्षं जप्त्वा तथायुष्यं द्विलक्षं जपतः
    सुतान् ॥ ४४॥ निष्कामो लक्षदशकं जप्त्वाप्येताऽविमुक्तकम् । विनियोगः समाख्यातः तज्जापे लक्षणं श
