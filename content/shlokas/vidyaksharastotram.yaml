id: vidyaksharastotram
category: stotram
name:
  english: vidyaksharastotram
  devanagari: विद्याक्षरस्तोत्रम्
content:
  english: vidyaksharastotram omkarotpannashuklabham madhyasimhasanasthitam | bodhyam trimudraya yuktam
    vairocanamunim numah || 1|| hunkarotpannanilabham purve gajasanasthitam | bhusparshamudraya yuktamakshobhyam
    shrighana numah || 2|| trankarotpannahemabham dakshine'shvamarudham | varadamudraya yuktam namami
    ratnasambhavam || 3|| jhinkarotpannaraktabham pashcime mayurasanam | dhyanamurtidharam nathamamitabhamunim
    numah || 4|| khankarotpannashyamabhamuttare garudasanam | abhayamudrasambaddhamamoghasiddhim namamyaham
    || 5|| rocana mamaki caiva pandara tarani tatha | brahmadikonasamsthashca caturdevyo namo namah ||
    6|| niranjanam nirakaram pratyekajyotirupinam | caityamadhyasthitam devam vajrasattvam namo vayam
    || 7|| iti shri buddhabhattarakasya vidyaksharastotram sampurnam ||
  devanagari: विद्याक्षरस्तोत्रम् ॐकारोत्पन्नशुक्लाभं मध्यसिंहासनस्थितम् । बोध्यं त्रिमुद्रया युक्तं वैरोचनमुनिं
    नुमः ॥ १॥ हूङ्कारोत्पन्ननीलाभं पूर्वे गजासनस्थितम् । भूस्पर्शमुद्रया युक्तमक्षोभ्यं श्रीघन नुमः ॥
    २॥ त्राङ्कारोत्पन्नहेमाभं दक्षिणेऽश्वमारूढम् । वरदमुद्रया युक्तं नमामि रत्नसम्भवम् ॥ ३॥ झिङ्कारोत्पन्नरक्ताभं
    पश्चिमे मयूरासनम् । ध्यानमूर्तिधरं नाथममिताभमुनिं नुमः ॥ ४॥ खङ्कारोत्पन्नश्यामाभमुत्तरे गरुडासनम्
    । अभयमुद्रसम्बद्धममोघसिद्धिं नमाम्यहम् ॥ ५॥ रोचना मामकी चैव पाण्डरा तारणी तथा । ब्रह्मादिकोणसंस्थाश्च
    चतुर्देव्यो नमो नमः ॥ ६॥ निरञ्जनं निराकारं प्रत्येकज्योतिरूपिणम् । चैत्यमध्यस्थितं देवं वज्रसत्त्वं
    नमो वयम् ॥ ७॥ इति श्री बुद्धभट्टारकस्य विद्याक्षरस्तोत्रं सम्पूर्णम् ॥
