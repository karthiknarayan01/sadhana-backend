id: renukastotram
category: stotram
name:
  english: renukastotram
  devanagari: रेणुकास्तोत्रम्
content:
  english: renukastotram shriganeshaya namah | pakamritamshumakutabharana bhavani shokapaha natajanasya
    shubhakhilangi | kokakritistanabhara kushalani nityam mukambika mama tanotu munindravandya || shlokasyadyantayorvagbhavamuccarya
    pathediti sampradayah || om || kalagnyadi shivavasanamakhilam te gulphadaghnam shive murtim kirtayitum
    na kasya rasana lajjambudhau majjati | tasmat tvaccaranaikadeshanakharajyotihsphulinga iva sphurjanti
    prabhavishnavashca satatam te padmanabhadayah || 1|| kalpah ko'pi sa shambhavo vijayate matastvaya
    kalpito yatranalpavikalpajalavimukhah kashcidvipashcit parah | sa tvam sattvavatamapiha sulabha naivasi
    kim stuyase svacchandam shishavo yatha tava punah kridanti veda ime || 2|| lilacamaradharinisahacarigatya
    mahasiddhayo nunam vancayitum sphuranti bhavatikarunyashunyam janam | amba tvannayanancalam karunaya
    yasmin parikridate tasya dvari nivarito'pi kurute sevam suranam ganah || 3|| a patalatalat phanishvarashiroratnamshunirajita
  devanagari: रेणुकास्तोत्रम् श्रीगणेशाय नमः । पाकामृतांशुमकुटाभरणा भवानी शोकापहा नतजनस्य शुभाखिलाङ्गी
    । कोकाकृतिस्तनभरा कुशलानि नित्यं मूकाम्बिका मम तनोतु मुनीन्द्रवन्द्या ॥ श्लोकस्याद्यन्तयोर्वाग्भवमुच्चार्य
    पठेदिति सम्प्रदायः ॥ ॐ ॥ कालाग्न्यादि शिवावसानमखिलं ते गुल्फदघ्नं शिवे मूर्तिं कीर्तयितुं न कस्य रसना
    लज्जाम्बुधौ मज्जति । तस्मात् त्वच्चरणैकदेशनखरज्योतिःस्फुलिङ्गा इव स्फूर्जन्ति प्रभविष्णवश्च सततं ते
    पद्मनाभादयः ॥ १॥ कल्पः कोऽपि स शाम्भवो विजयते मातस्त्वया कल्पितो यत्रानल्पविकल्पजालविमुखः कश्चिद्विपश्चित्
    परः । सा त्वं सत्त्ववतामपीह सुलभा नैवासि किं स्तूयसे स्वच्छन्दं शिशवो यथा तव पुनः क्रीडन्ति वेदा इमे
    ॥ २॥ लीलाचामरधारिणीसहचरीगत्या महासिद्धयो नूनं वञ्चयितुं स्फुरन्ति भवतीकारुण्यशून्यं जनम् । अम्ब त्वन्नयनाञ्चलं
    करुणया यस्मिन् परिक्रीडते तस्य द्वारि निवारितोऽपि कुरुते सेवां सुराणां गणः ॥ ३॥ आ पातालतलात् फणीश्वरशिरोरत्नांशुनीराजिता
