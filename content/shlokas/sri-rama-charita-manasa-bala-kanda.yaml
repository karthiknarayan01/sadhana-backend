    mudita mana sabahim kaha || jogindra siddha munisa deva biloki prabhu dundubhi hani| cale harashi
    barashi prasuna nija nija loka jaya jaya jaya bhani || sahita badhutinha kua~ra saba taba ae pitu
    pasa| sobha mangala moda bhari umageu janu janavasa || || puni jevanara bhi bahu bha~ti| pathe janaka
    bolai barati || parata pa~varae basana anupa| sutanha sameta gavana kiyo bhupa || sadara sabake paya
    pakhare| jathajogu pirhanha baithare || dhoe janaka avadhapati carana| silu sanehu jai nahim barana
    || bahuri rama pada pankaja dhoe| je hara hridaya kamala mahu~ goe || tiniu bhai rama sama jani| dhoe
    carana janaka nija pani || asana ucita sabahi nripa dinhe| boli supakari saba linhe || sadara lage
    parana panavare| kanaka kila mani pana sa~vare || do supodana surabhi sarapi sundara svadu punita|
    chana mahu~ saba kem parusi ge catura suara binita || || panca kavala kari jevana lage| gari gana
    suni ati anurage || bha~ti aneka pare pakavane| sudha sarisa nahim jahim bakhane || parusana lage
    suara sujana| binjana bibidha nama ko jana || cari bha~ti bhojana bidhi gai| eka eka bidhi barani
    na jai || charasa rucira binjana bahu jati| eka eka rasa aganita bha~ti || jeva~ta dehim madhura dhuni
    gari| lai lai nama purusha aru nari || samaya suhavani gari biraja| ha~sata rau suni sahita samaja
    || ehi bidhi sabahim bhaujanu kinha| adara sahita acamanu dinha || do dei pana puje janaka dasarathu
    sahita samaja| janavasehi gavane mudita sakala bhupa sirataja || || nita nutana mangala pura mahim|
    nimisha sarisa dina jamini jahim || barae bhora bhupatimani jage| jacaka guna gana gavana lage ||
    dekhi kua~ra bara badhunha sameta| kimi kahi jata modu mana jeta || pratakriya kari ge guru pahim|
    mahapramodu premu mana mahim || kari pranama puja kara jori| bole gira amia~ janu bori || tumhari
    kripa~ sunahu muniraja| bhayu~ aju maim puranakaja || aba saba bipra bolai gosaim| dehu dhenu saba
    bha~ti banai || suni gura kari mahipala baraai| puni pathe muni brinda bolai || do bamadeu aru devarishi
    balamiki jabali| ae munibara nikara taba kausikadi tapasali || || danda pranama sabahi nripa kinhe|
    puji saprema barasana dinhe || cari laccha bara dhenu magai| kamasurabhi sama sila suhai || saba bidhi
    sakala alankrita kinhim| mudita mahipa mahidevanha dinhim || karata binaya bahu bidhi naranahu| laheu~
    aju jaga jivana lahu || pai asisa mahisu ananda| lie boli puni jacaka brinda || kanaka basana mani
    haya gaya syandana| die bujhi ruci rabikulanandana || cale parhata gavata guna gatha| jaya jaya jaya
    dinakara kula natha || ehi bidhi rama biaha uchahu| saki na barani sahasa mukha jahu || do bara bara
    kausika carana sisu nai kaha rau| yaha sabu sukhu muniraja tava kripa kataccha pasau || || janaka
    sanehu silu karatuti| nripu saba bha~ti saraha bibhuti || dina uthi bida avadhapati maga| rakhahim
    janaku sahita anuraga || nita nutana adaru adhikai| dina prati sahasa bha~ti pahunai || nita nava
    nagara ananda uchahu| dasaratha gavanu sohai na kahu || bahuta divasa bite ehi bha~ti| janu saneha
    raju ba~dhe barati || kausika satananda taba jai| kaha bideha nripahi samujhai || aba dasaratha kaha~
    ayasu dehu| jadyapi charai na sakahu sanehu || bhalehim natha kahi saciva bolae| kahi jaya jiva sisa
    tinha nae || do avadhanathu cahata calana bhitara karahu janau| bhe premabasa saciva suni bipra sabhasada
    rau || || purabasi suni calihi barata| bujhata bikala paraspara bata || satya gavanu suni saba bilakhane|
    manahu~ sa~jha sarasija sakucane || jaha~ jaha~ avata base barati| taha~ taha~ siddha cala bahu bha~ti
    || bibidha bha~ti meva pakavana| bhojana saju na jai bakhana || bhari bhari basaha~ apara kahara|
    pathi janaka aneka susara || turaga lakha ratha sahasa pacisa| sakala sa~vare nakha aru sisa || matta
    sahasa dasa sindhura saje| jinhahi dekhi disikunjara laje || kanaka basana mani bhari bhari jana|
    mahishim dhenu bastu bidhi nana || do daija amita na sakia kahi dinha bideha~ bahori| jo avalokata
    lokapati loka sampada thori || || sabu samaju ehi bha~ti banai| janaka avadhapura dinha pathai ||
    calihi barata sunata saba ranim| bikala minagana janu laghu panim || puni puni siya goda kari lehim|
    dei asisa sikhavanu dehim || hoehu santata piyahi piari| ciru ahibata asisa hamari || sasu sasura
    gura seva karehu| pati rukha lakhi ayasu anusarehu || ati saneha basa sakhim sayani| nari dharama
    sikhavahim mridu bani || sadara sakala kua~ri samujhai| raninha bara bara ura lai || bahuri bahuri
    bhetahim mahatarim| kahahim biranci racim kata narim || do tehi avasara bhainha sahita ramu bhanu
    kula ketu| cale janaka mandira mudita bida karavana hetu || || caria bhai subhaya~ suhae| nagara nari
    nara dekhana dhae || kau kaha calana cahata hahim aju| kinha bideha bida kara saju || lehu nayana
    bhari rupa nihari| priya pahune bhupa suta cari || ko janai kehi sukrita sayani| nayana atithi kinhe
    bidhi ani || maranasilu jimi pava piusha| surataru lahai janama kara bhukha || pava naraki haripadu
    jaisem| inha kara darasanu hama kaha~ taise || nirakhi rama sobha ura dharahu| nija mana phani murati
    mani karahu || ehi bidhi sabahi nayana phalu deta| ge kua~ra saba raja niketa || do rupa sindhu saba
    bandhu lakhi harashi utha ranivasu| karahi nichavari arati maha mudita mana sasu || || dekhi rama
    chabi ati anuragim| premabibasa puni puni pada lagim || rahi na laja priti ura chai| sahaja sanehu
    barani kimi jai || bhainha sahita ubati anhavae| charasa asana ati hetu jeva~e || bole ramu suavasaru
    jani| sila saneha sakucamaya bani || rau avadhapura cahata sidhae| bida hona hama iha~ pathae || matu
    mudita mana ayasu dehu| balaka jani karaba nita nehu || sunata bacana bilakheu ranivasu| boli na sakahim
    premabasa sasu || hridaya~ lagai kua~ri saba linhi| patinha saumpi binati ati kinhi || cham kari binaya
    siya ramahi samarapi jori kara puni puni kahai| bali ja~u tata sujana tumha kahu~ bidita gati saba
    ki ahai || parivara purajana mohi rajahi pranapriya siya janibi| tulasisa silu sanehu lakhi nija kinkari
    kari manibi || so tumha paripurana kama jana siromani bhavapriya| jana guna gahaka rama dosha dalana
    karunayatana || || asa kahi rahi carana gahi rani| prema panka janu gira samani || suni sanehasani
    bara bani| bahubidhi rama sasu sanamani || rama bida magata kara jori| kinha pranamu bahori bahori
    || pai asisa bahuri siru nai| bhainha sahita cale raghurai || manju madhura murati ura ani| bhi saneha
    sithila saba rani || puni dhiraju dhari kua~ri ha~kari| bara bara bhetahim mahatarim || pahu~cavahim
    phiri milahim bahori| barhai paraspara priti na thori || puni puni milata sakhinha bilagai| bala baccha
    jimi dhenu lavai || do premabibasa nara nari saba sakhinha sahita ranivasu| manahu~ kinha bidehapura
    karuna~ biraha~ nivasu || || suka sarika janaki jyae| kanaka pinjaranhi rakhi parhaae || byakula kahahim
    kaha~ baidehi| suni dhiraju parihari na kehi || bhe bikala khaga mriga ehi bha~ti| manuja dasa kaisem
    kahi jati || bandhu sameta janaku taba ae| prema umagi locana jala chae || siya biloki dhirata bhagi|
    rahe kahavata parama biragi || linhi ra~ya ura lai janaki| miti mahamarajada gyana ki || samujhavata
    saba saciva sayane| kinha bicaru na avasara jane || barahim bara suta ura lai| saji sundara palakim
    magai || do premabibasa parivaru sabu jani sulagana naresa| ku~ari carhaai palakinha sumire siddhi
    ganesa || || bahubidhi bhupa suta samujhai| naridharamu kulariti sikhai || dasim dasa die bahutere|
    suci sevaka je priya siya kere || siya calata byakula purabasi| hohim saguna subha mangala rasi ||
    bhusura saciva sameta samaja| sanga cale pahu~cavana raja || samaya biloki bajane baje| ratha gaja
    baji baratinha saje || dasaratha bipra boli saba linhe| dana mana paripurana kinhe || carana saroja
    dhuri dhari sisa| mudita mahipati pai asisa || sumiri gajananu kinha payana| mangalamula saguna bhe
    nana || do sura prasuna barashahi harashi karahim apachara gana| cale avadhapati avadhapura mudita
    bajai nisana || || nripa kari binaya mahajana phere| sadara sakala magane tere || bhushana basana
    baji gaja dinhe| prema poshi tharhae saba kinhe || bara bara biridavali bhashi| phire sakala ramahi
    ura rakhi || bahuri bahuri kosalapati kahahim| janaku premabasa phirai na cahahim || puni kaha bhupati
    bacana suhae| phiria mahisa duri barai ae || rau bahori utari bhe tharhae| prema prabaha bilocana
    barhae || taba bideha bole kara jori| bacana saneha sudha~ janu bori || karau kavana bidhi binaya
    banai| maharaja mohi dinhi baraai || do kosalapati samadhi sajana sanamane saba bha~ti| milani parasapara
    binaya ati priti na hridaya~ samati || || muni mandalihi janaka siru nava| asirabadu sabahi sana pava
    || sadara puni bhente jamata| rupa sila guna nidhi saba bhrata || jori pankaruha pani suhae| bole
    bacana prema janu jae || rama karau kehi bha~ti prasamsa| muni mahesa mana manasa hamsa || karahim
    joga jogi jehi lagi| kohu mohu mamata madu tyagi || byapaku brahmu alakhu abinasi| cidanandu niraguna
    gunarasi || mana sameta jehi jana na bani| taraki na sakahim sakala anumani || mahima nigamu neti
    kahi kahi| jo tihu~ kala ekarasa rahi || do nayana bishaya mo kahu~ bhayu so samasta sukha mula| sabi
    labhu jaga jiva kaha~ bhe~ isu anukula || || sabahi bha~ti mohi dinhi baraai| nija jana jani linha
    apanai || hohim sahasa dasa sarada sesha| karahim kalapa kotika bhari lekha || mora bhagya raura guna
    gatha| kahi na sirahim sunahu raghunatha || mai kachu kahu~ eka bala morem| tumha rijhahu saneha suthi
    thorem || bara bara magu~ kara jorem| manu pariharai carana jani bhorem || suni bara bacana prema
    janu poshe| puranakama ramu paritoshe || kari bara binaya sasura sanamane| pitu kausika basishtha
    sama jane || binati bahuri bharata sana kinhi| mili sapremu puni asisha dinhi || do mile lakhana ripusudanahi
    dinhi asisa mahisa| bhe paraspara premabasa phiri phiri navahim sisa || || bara bara kari binaya baraai|
    raghupati cale sanga saba bhai || janaka gahe kausika pada jai| carana renu sira nayananha lai ||
    sunu munisa bara darasana torem| agamu na kachu pratiti mana morem || jo sukhu sujasu lokapati cahahim|
    karata manoratha sakucata ahahim || so sukhu sujasu sulabha mohi svami| saba sidhi tava darasana anugami
    || kinhi binaya puni puni siru nai| phire mahisu asisha pai || cali barata nisana bajai| mudita chota
    bara saba samudai || ramahi nirakhi grama nara nari| pai nayana phalu hohim sukhari || do bica bica
    bara basa kari maga loganha sukha deta| avadha samipa punita dina pahu~ci ai janeta || hane nisana
    panava bara baje| bheri sankha dhuni haya gaya gaje || jha~jhi birava dindamim suhai| sarasa raga
    bajahim sahanai || pura jana avata akani barata| mudita sakala pulakavali gata || nija nija sundara
    sadana sa~vare| hata bata cauhata pura dvare || galim sakala aragaja~ sincai| jaha~ taha~ caukem caru
    purai || bana bajaru na jai bakhana| torana ketu pataka bitana || saphala pugaphala kadali rasala|
    rope bakula kadamba tamala || lage subhaga taru parasata dharani| manimaya alabala kala karani ||
    do bibidha bha~ti mangala kalasa griha griha race sa~vari| sura brahmadi sihahim saba raghubara puri
    nihari || || bhupa bhavana tehi avasara soha| racana dekhi madana manu moha || mangala saguna manoharatai|
    ridhi sidhi sukha sampada suhai || janu uchaha saba sahaja suhae| tanu dhari dhari dasaratha dasaratha
    griha~ chae || dekhana hetu rama baidehi| kahahu lalasa hohi na kehi || jutha jutha mili calim suasini|
    nija chabi nidarahim madana bilasani || sakala sumangala sajem arati| gavahim janu bahu besha bharati
    || bhupati bhavana kolahalu hoi| jai na barani samu sukhu soi || kausalyadi rama mahatarim| prema
    bibasa tana dasa bisarim || do die dana bipranha bipula puji ganesa purari| pramudita parama daridra
    janu pai padaratha cari || || moda pramoda bibasa saba mata| calahim na carana sithila bhe gata ||
    rama darasa hita ati anuragim| parichani saju sajana saba lagim || bibidha bidhana bajane baje| mangala
    mudita sumitra~ saje || harada duba dadhi pallava phula| pana pugaphala mangala mula || acchata ankura
    locana laja| manjula manjari tulasi biraja || chuhe purata ghata sahaja suhae| madana sakuna janu
    nira banae || saguna sungadha na jahim bakhani| mangala sakala sajahim saba rani || racim aratim bahuta
    bidhana| mudita karahim kala mangala gana || do kanaka thara bhari mangalanhi kamala karanhi lie~
    mata| calim mudita parichani karana pulaka pallavita gata || || dhupa dhuma nabhu mecaka bhayu| savana
    ghana ghamandu janu thayu || surataru sumana mala sura barashahim| manahu~ balaka avali manu karashahim
    || manjula manimaya bandanivare| manahu~ pakaripu capa sa~vare || pragatahim durahim atanha para bhamini|
    caru capala janu damakahim damini || dundubhi dhuni ghana garajani ghora| jacaka cataka dadura mora
    || sura sugandha suci barashahim bari| sukhi sakala sasi pura nara nari || samu jani gura ayasu dinha|
    pura prabesu raghukulamani kinha || sumiri sambhu giraja ganaraja| mudita mahipati sahita samaja ||
    do hohim saguna barashahim sumana sura dundubhim bajai| bibudha badhu nacahim mudita manjula mangala
    gai || || magadha suta bandi nata nagara| gavahim jasu tihu loka ujagara || jaya dhuni bimala beda
    bara bani| dasa disi sunia sumangala sani || bipula bajane bajana lage| nabha sura nagara loga anurage
    || bane barati barani na jahim| maha mudita mana sukha na samahim || purabasimha taba raya johare|
    dekhata ramahi bhe sukhare || karahim nichavari manigana cira| bari bilocana pulaka sarira || arati
    karahim mudita pura nari| harashahim nirakhi ku~ara bara cari || sibika subhaga ohara ughari| dekhi
    dulahininha hohim sukhari || do ehi bidhi sabahi deta sukhu ae rajaduara| mudita matu paruchani karahim
    badhunha sameta kumara || || karahim arati barahim bara| premu pramodu kahai ko para || bhushana mani
    pata nana jati || karahi nichavari aganita bha~ti || badhunha sameta dekhi suta cari| paramananda
    magana mahatari || puni puni siya rama chabi dekhi || mudita saphala jaga jivana lekhi || sakhim siya
    mukha puni puni cahi| gana karahim nija sukrita sarahi || barashahim sumana chanahim chana deva| nacahim
    gavahim lavahim seva || dekhi manohara cariu jorim| sarada upama sakala dha~dhorim || deta na banahim
    nipata laghu lagi| ekataka rahim rupa anuragim || do nigama niti kula riti kari aragha pa~varae deta|
    badhunha sahita suta parichi saba calim lavai niketa || || cari singhasana sahaja suhae| janu manoja
    nija hatha banae || tinha para kua~ri kua~ra baithare| sadara paya punita pakhare || dhupa dipa naibeda
    beda bidhi| puje bara dulahini mangalanidhi || barahim bara arati karahim| byajana caru camara sira
    dharahim || bastu aneka nichavara hohim| bharim pramoda matu saba sohim || pava parama tattva janu
    jogim| amrita laheu janu santata rogim || janama ranka janu parasa pava| andhahi locana labhu suhava
    || muka badana janu sarada chai| manahu~ samara sura jaya pai || do ehi sukha te sata koti guna pavahim
    matu anandu || bhainha sahita biahi ghara ae raghukulacandu || || loka rita janani karahim bara dulahini
    sakucahim| modu binodu biloki bara ramu manahim musakahim || || deva pitara puje bidhi niki| pujim
    sakala basana ji ki || sabahim bandi magahim baradana| bhainha sahita rama kalyana || antarahita sura
    asisha dehim| mudita matu ancala bhari lemhim || bhupati boli barati linhe| jana basana mani bhushana
    dinhe || ayasu pai rakhi ura ramahi| mudita ge saba nija nija dhamahi || pura nara nari sakala pahirae|
    ghara ghara bajana lage badhae || jacaka jana jacahi joi joi| pramudita rau dehim soi soi || sevaka
    sakala bajania nana| purana kie dana sanamana || do demhim asisa johari saba gavahim guna gana gatha|
    taba gura bhusura sahita griha~ gavanu kinha naranatha || || jo basishtha anusasana dinhi| loka beda
    bidhi sadara kinhi || bhusura bhira dekhi saba rani| sadara uthim bhagya bara jani || paya pakhari
    sakala anhavae| puji bhali bidhi bhupa jeva~e || adara dana prema pariposhe| deta asisa cale mana
    toshe || bahu bidhi kinhi gadhisuta puja| natha mohi sama dhanya na duja || kinhi prasamsa bhupati
    bhuri| raninha sahita linhi paga dhuri || bhitara bhavana dinha bara basu| mana jogavata raha nripa
    ranivasu || puje gura pada kamala bahori| kinhi binaya ura priti na thori || do badhunha sameta kumara
    saba raninha sahita mahisu| puni puni bandata gura carana deta asisa munisu || || binaya kinhi ura
    ati anuragem| suta sampada rakhi saba agem || negu magi muninayaka linha| asirabadu bahuta bidhi dinha
    || ura dhari ramahi siya sameta| harashi kinha gura gavanu niketa || biprabadhu saba bhupa bolai|
    caila caru bhushana pahirai || bahuri bolai suasini linhim| ruci bicari pahiravani dinhim || negi
    nega joga saba lehim| ruci anurupa bhupamani dehim || priya pahune pujya je jane| bhupati bhali bha~ti
    sanamane || deva dekhi raghubira bibahu| barashi prasuna prasamsi uchahu || do cale nisana bajai sura
    nija nija pura sukha pai| kahata parasapara rama jasu prema na hridaya~ samai || || saba bidhi sabahi
    samadi naranahu| raha hridaya~ bhari puri uchahu || jaha~ ranivasu taha~ pagu dhare| sahita bahutinha
    kua~ra nihare || lie goda kari moda sameta| ko kahi saki bhayu sukhu jeta || badhu saprema goda baitharim|
    bara bara hiya~ harashi dularim || dekhi samaju mudita ranivasu| saba kem ura ananda kiyo basu ||
    kaheu bhupa jimi bhayu bibahu| suni harashu hota saba kahu || janaka raja guna silu baraai| priti
