id: shanaishcarastotram
category: stotram
name:
  english: shanaishcarastotram
  devanagari: शनैश्चरस्तोत्रम्
content:
  english: evamuktastada saurih graharajo mahabalah | abravicca shanirvakyam hrishtaroma sa bhaskarih
    || 42|| shaniruvaca | tushto'ham tava rajendra stotrenanena suvrata | varam bruhi pradasyami manasa
    yadabhipsitam || 43|| dasharatha uvaca | prasanno yadi me saure pidam kuru na kasyacit | devasuramanushyanam
    pashupannagapakshinam || 44|| shaniruvaca | grahanacca grahajneyah grahah pidakarah smritah | adeyo'pi
    varo'smabhih tushto'ham tu dadami te || 45|| devasuramanushyashca siddhavidyadharoragah | pashupakshimriga
    vrikshah pidam muncantu sarvada || 46|| tvaya proktamidam stotram yah pathediha manavah | ekakalam
    kvacitkalam pidam muncami tasya vai || 47|| mrityusthanagato vapi janmavyayagato'pi va | pathati shraddhaya
    yuktah shucih snatva samahitah || 48|| shamipatraih samabhyarcya pratimam lohajam mama | mashaudanam
    tilairmishram dadyalloham tu dakshinam || 49|| krishnangam mahishim vastram mamuddishya dvijataye
    | maddine tu visheshena stotrenanena pujayet || 50|| pujayitva japetstotram bhuktva caiva kritanjalih
    | tasya pidam na caivaham karishyami kadacana || 51|| gocare janmalagne va dashasvantardashasu ca
    | rakshami satatam tasya pidasvanyagrahasya ca || 52|| anenaiva prakarena pidamuktam jagadbhavet |
    suta uvaca | varadvayam tu samprapya raja dasharathastada || 53|| mene kritarthamatmanam namaskritya
    shanaishcaram | shanina cabhyanujnatah svasthanamagamat nripah || 54|| svasthanam ca tato gatva praptakamo'bhavattada
    | konah shanaishcaro mandah chayahridayanandanah || 55|| martandajastatha saurih patangirgrahanayakah
    | brahmanyah krurakarma ca nilavastro'njanadyutih || 56|| dvadashaitani namani yah pathecca dine dine
    | vishamastho'pi bhagavan supritastasya jayate || 57|| mandavare shucih snatva mitaharo jitendriyah
    | tadvarnakusumairyuktam sarvangam dvijasattamah || 58|| purayitvannapanadyaih stotram yah prayatah
    pathet | putrakamo labhetputram dhanakamo labheddhanam || 59|| rajyakamo labhedrajyam jayarthi vijayi
    bhavet | ayushkamo labhedayuh shrikamah shriyamapnuyat || 60|| yadyadicchati tatsarvam bhagavan bhaktavatsalah
    | cintitani ca sarvani dadati ca na samshayah || 61|| iti shri dasharathamaharajakritam shanaishcarastotram
    sampurnam |
  devanagari: एवमुक्तस्तदा सौरिः ग्रहराजो महाबलः । अब्रवीच्च शनिर्वाक्यं हृष्टरोमा स भास्करिः ॥ ४२॥ शनिरुवाच
    । तुष्टोऽहं तव राजेन्द्र स्तोत्रेणानेन सुव्रत । वरं ब्रूहि प्रदास्यामि मनसा यदभीप्सितम् ॥ ४३॥ दशरथ
    उवाच । प्रसन्नो यदि मे सौरे पीडां कुरु न कस्यचित् । देवासुरमनुष्याणां पशुपन्नगपक्षिणाम् ॥ ४४॥ शनिरुवाच
    । ग्रहणाच्च ग्रहाज्ञेयाः ग्रहाः पीडाकराः स्मॄताः । अदेयोऽपि वरोऽस्माभिः तुष्टोऽहं तु ददामि ते ॥ ४५॥
    देवासुरमनुष्याश्च सिद्धविद्याधरोरगाः । पशुपक्षिमृगा वृक्षाः पीडां मुञ्चन्तु सर्वदा ॥ ४६॥ त्वया प्रोक्तमिदं
    स्तोत्रं यः पठेदिह मानवः । एककालं क्वचित्कालं पीडां मुञ्चामि तस्य वै ॥ ४७॥ मृत्युस्थानगतो वापि जन्मव्ययगतोऽपि
    वा । पठति श्रद्धया युक्तः शुचिः स्नात्वा समाहितः ॥ ४८॥ शमीपत्रैः समभ्यर्च्य प्रतिमां लोहजां मम । माषौदनं
    तिलैर्मिश्रं दद्याल्लोहं तु दक्षिणाम् ॥ ४९॥ कृष्णाङ्गां महिषीं वस्त्रं मामुद्दिश्य द्विजातये । मद्दिने
    तु विशेषेण स्तोत्रेणानेन पूजयेत् ॥ ५०॥ पूजयित्वा जपेत्स्तोत्रं भुक्त्वा चैव कृताञ्जलिः । तस्य पीडां
    न चैवाहं करिष्यामि कदाचन ॥ ५१॥ गोचरे जन्मलग्ने वा दशास्वन्तर्दशासु च । रक्षामि सततं तस्य पीडास्वन्यग्रहस्य
    च ॥ ५२॥ अनेनैव प्रकारेण पीडामुक्तं जगद्भवेत् । सूत उवाच । वरद्वयं तु सम्प्राप्य राजा दशरथस्तदा ॥ ५३॥
    मेने कृतार्थमात्मानं नमस्कृत्य शनैश्चरम् । शनिना चाभ्यनुज्ञातः स्वस्थानमगमत् नृपः ॥ ५४॥ स्वस्थानं
    च ततो गत्वा प्राप्तकामोऽभवत्तदा । कोणः शनैश्चरो मन्दः छायाहृदयनन्दनः ॥ ५५॥ मार्ताण्डजस्तथा सौरिः पातङ्गिर्ग्रहनायकः
    । ब्रह्मण्यः क्रूरकर्मा च नीलवस्त्रोऽञ्जनद्युतिः ॥ ५६॥ द्वादशैतानि नामानि यः पठेच्च दिने दिने । विषमस्थोऽपि
    भगवान् सुप्रीतस्तस्य जायते ॥ ५७॥ मन्दवारे शुचिः स्नात्वा मिताहारो जितेन्द्रियः । तद्वर्णकुसुमैर्युक्तं
    सर्वाङ्गं द्विजसत्तमाः ॥ ५८॥ पूरयित्वान्नपानाद्यैः स्तोत्रं यः प्रयतः पठेत् । पुत्रकामो लभेत्पुत्रं
    धनकामो लभेद्धनम् ॥ ५९॥ राज्यकामो लभेद्राज्यं जयार्थी विजयी भवेत् । आयुष्कामो लभेदायुः श्रीकामः श्रियमाप्नुयात्
    ॥ ६०॥ यद्यदिच्छति तत्सर्वं भगवान् भक्तवत्सलः । चिन्तितानि च सर्वाणि ददाति च न संशयः ॥ ६१॥ इति श्री
    दशरथमहाराजकृतं शनैश्चरस्तोत्रं सम्पूर्णम् ।
