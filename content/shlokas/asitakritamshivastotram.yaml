id: asitakritamshivastotram
category: stotram
name:
  english: asitakritamshivastotram
  devanagari: असितकृतंशिवस्तोत्रम्
content:
  english: asitakritam shivastotram asita uvaca | jagadguro namastubhyam shivaya shivadaya ca | yogindranam
    ca yogindra gurunam gurave namah || 43|| mrityomrirtyusvarupena mrityusamsarakhandana | mrityorisha
    mrityubija mrityunjaya namo'stu te || 44|| kalarupam kalayatam kalakalesha karana | kaladatita kalasya
    kalakala namo'stu te || 45|| gunatita gunadhara gunabija gunatmaka | gunisha guninam bija guninam
    gurave namah || 46|| brahmasvarupa brahmajna brahmabhave ca tatpara | brahmabijasvarupena brahmabija
    namostu te || 47|| iti stutva shivam natva purastasthau munishvarah | dinavatsashrunetrashca pulakancitavigrahah
    || 48|| asitena kritam stotram bhaktiyuktashca yah pathet | varshamekam havishyashi shankarasya mahatmanah
    || 49|| sa labhedvaishnavam putram jnaninam cirajivinam | bhaveddhanadhyo duhkhi ca muko bhavati panditah
    || 50|| abharyo labhate bharyam sushilam ca pativra tam | iha loke sukham bhuktva yatyante shivasannidhim
    || 51|| idam stotram pura dattam brahmana ca pracetase | pracetasa svaputrayasitaya dattamuttamam
    || 52|| iti shribrahmavaivartapurane shrikrishnajanmakhande purve trimshadhyayantargatam asitakritam
    shrikrishnastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: असितकृतं शिवस्तोत्रम् असित उवाच । जगद्गुरो नमस्तुभ्यं शिवाय शिवदाय च । योगीन्द्राणां च योगीन्द्र
    गुरूणां गुरवे नमः ॥ ४३॥ मृत्योमृर्त्युस्वरूपेण मृत्युसंसारखण्डन । मृत्योरीश मृत्युबीज मृत्युञ्जय नमोऽस्तु
    ते ॥ ४४॥ कालरूपं कलयतां कालकालेश कारण । कालादतीत कालस्य कालकाल नमोऽस्तु ते ॥ ४५॥ गुणातीत गुणाधार गुणबीज
    गुणात्मक । गुणीश गुणिनां बीज गुणिनां गुरवे नमः ॥ ४६॥ ब्रह्मस्वरूप ब्रह्मज्ञ ब्रह्मभावे च तत्पर । ब्रह्मबीजस्वरूपेण
    ब्रह्मबीज नमोस्तु ते ॥ ४७॥ इति स्तुत्वा शिवं नत्वा पुरस्तस्थौ मुनीश्वरः । दीनवत्साश्रुनेत्रश्च पुलकाञ्चितविग्रहः
    ॥ ४८॥ असितेन कृतं स्तोत्रं भक्तियुक्तश्च यः पठेत् । वर्षमेकं हविष्याशी शङ्करस्य महात्मनः ॥ ४९॥ स लभेद्वैष्णवं
    पुत्रं ज्ञानिनं चिरजीविनम् । भवेद्धनाढ्यो दुःखी च मूको भवति पण्डितः ॥ ५०॥ अभार्यो लभते भार्यां सुशीलां
    च पतिव्र ताम् । इह लोके सुखं भुक्त्वा यात्यन्ते शिवसन्निधिम् ॥ ५१॥ इदं स्तोत्रं पुरा दत्तं ब्रह्मणा
    च प्रचेतसे । प्रचेतसा स्वपुत्रायासिताय दत्तमुत्तमम् ॥ ५२॥ इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे
    पूर्वे त्रिंशाध्यायान्तर्गतं असितकृतं श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
