id: narayaniyam-dashaka-32
category: stotram
name:
  english: Narayaniyam Dashaka 32
content:
  english: pura hayagrivamahasurena shashthantarantodyadakandakalpe | nidronmukhabrahmamukhat hriteshu
    vedeshvadhitsah kila matsyarupam || || satyavratasya dramiladhibharturnadijale tarpayatastadanim |
    karanjalau sanjvalitakritistvamadrishyathah kashcana balaminah || || kshiptam jale tvam cakitam vilokya
    ninye'mbupatrena munih svageham | svalpairahobhih kalashim ca kupam vapim sarashcanashishe vibho tvam
    || || yogaprabhavadbhavadajnayaiva nitastatastvam munina payodhim | prishto'muna kalpadidrikshumenam
    saptahamasveti vadannayasih || || prapte tvadukte'hani varidharapariplute bhumitale munindrah | saptarshibhih
    sardhamaparavarinyudghurnamanah sharanam yayau tvam || || dharam tvadadeshakarimavaptam naurupinimaruruhustada
    te tatkampakampreshu ca teshu bhuyastvamambudheravirabhurmahiyan || || jhashakritim yojanalakshadirgham
    dadhanamuccaistaratejasam tvam | nirikshya tushta munayastvaduktya tvattungashringe taranim babandhuh
    || || akrishtanauko munimandalaya pradarshayan vishvajagadvibhagan | samstuyamano nrivarena tena jnanam
    param copadishannacarih || || kalpavadhau saptamunin purovat prasthapya satyavratabhumipam tam | vaivasvatakhyam
    manumadadhanah krodhad hayagrivamabhidruto'bhuh || || svatungashringakshatavakshasam tam nipatya daityam
    nigaman grihitva | virincaye pritahride dadanah prabhanjanagarapate prapayah ||
  devanagari: पुरा हयग्रीवमहासुरेण षष्ठान्तरान्तोद्यदकाण्डकल्पे । निद्रोन्मुखब्रह्ममुखात् हृतेषु वेदेष्वधित्सः
    किल मत्स्यरूपम् ॥ ॥ सत्यव्रतस्य द्रमिलाधिभर्तुर्नदीजले तर्पयतस्तदानीम् । कराञ्जलौ सञ्ज्वलिताकृतिस्त्वमदृश्यथाः
    कश्चन बालमीनः ॥ ॥ क्षिप्तं जले त्वां चकितं विलोक्य निन्येऽम्बुपात्रेण मुनिः स्वगेहम् । स्वल्पैरहोभिः
    कलशीं च कूपं वापीं सरश्चानशिषे विभो त्वम् ॥ ॥ योगप्रभावाद्भवदाज्ञयैव नीतस्ततस्त्वं मुनिना पयोधिम्
    । पृष्टोऽमुना कल्पदिदृक्षुमेनं सप्ताहमास्वेति वदन्नयासीः ॥ ॥ प्राप्ते त्वदुक्तेऽहनि वारिधारापरिप्लुते
    भूमितले मुनीन्द्रः । सप्तर्षिभिः सार्धमपारवारिण्युद्घूर्णमानः शरणं ययौ त्वाम् ॥ ॥ धरां त्वदादेशकरीमवाप्तां
    नौरूपिणीमारुरुहुस्तदा ते तत्कम्पकम्प्रेषु च तेषु भूयस्त्वमम्बुधेराविरभूर्महीयान् ॥ ॥ झषाकृतिं योजनलक्षदीर्घां
    दधानमुच्चैस्तरतेजसं त्वाम् । निरीक्ष्य तुष्टा मुनयस्त्वदुक्त्या त्वत्तुङ्गशृङ्गे तरणिं बबन्धुः ॥ ॥
    आकृष्टनौको मुनिमण्डलाय प्रदर्शयन् विश्वजगद्विभागान् । संस्तूयमानो नृवरेण तेन ज्ञानं परं चोपदिशन्नचारीः
    ॥ ॥ कल्पावधौ सप्तमुनीन् पुरोवत् प्रस्थाप्य सत्यव्रतभूमिपं तम् । वैवस्वताख्यं मनुमादधानः क्रोधाद् हयग्रीवमभिद्रुतोऽभूः
    ॥ ॥ स्वतुङ्गशृङ्गक्षतवक्षसं तं निपात्य दैत्यं निगमान् गृहीत्वा । विरिञ्चये प्रीतहृदे ददानः प्रभञ्जनागारपते
    प्रपायाः ॥
