id: prata-smaranam
category: stotram
name:
  english: prata:smaranam
  devanagari: प्रात:स्मरणम्
content:
  english: smaranam vakratunda mahakaya suryakotisamaprabha | nirvighnam kuru me deva sarvakaryeshu sarvada
    || 1 || shamtakaram bhujagashayanam padmanabham suresham | vishvadharam gaganasadrisham meghavarnam
    shubhangam | lakshmikantam kamalanayanam yogibhirdhyanagamyam | vande vishnum bhavabhayaharam sarvalokaikanatham
    || 2 || krishnaya vasudevaya haraye paramatmane | pranatkleshanashaya govimdaya namo nama
  devanagari: स्मरणम् वक्रतुण्ड महाकाय सूर्यकोटिसमप्रभ । निर्विघ्नं कुरू मे देव सर्वकार्येषु सर्वदा ।।
    १ ।। शांताकारं भुजगशयनं पद्मनाभं सुरेशं । विश्वाधारं गगनसदृशं मेघवर्णं शुभाङ्गम् । लक्ष्मीकान्तं कमलनयनं
    योगिभिर्ध्यानगम्यम् । वन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम् ।। २ ।। कृष्णाय वासुदेवाय हरये परमात्मने
    । प्रणत्क्लेशनाशाय गोविंदाय नमो नम
meaning: {}
