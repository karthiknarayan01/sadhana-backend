id: vishnu-16
category: stotram
name:
  english: vishnu 16
  devanagari: विष्नु १६
content:
  english: shrivishnoh shodashanamastotram aushadhe cintayedvishnum bhojane ca janardanam | shayane padmanabham
    ca vivahe ca prajapatim || 1|| yuddhe cakradharam devam pravase ca trivikramam | narayanam tanutyage
    shridharam priyasamgame || 2|| duhsvapne smara govimdam samkate madhusudanam | kanane narasimham ca
    pavake jalashayinam || 3|| jalamadhye varaham ca parvate raghunandanam | gamane vamanam caiva sarvakaryeshu
    madhavam || 4|| shodashaitani namani pratarutthaya yah pathet | sarvapapavirnimukto vishnuloke mahiyate
    || 5|| | iti shrivishnoh shodashanamastotram sampurnam |
  devanagari: श्रीविष्णोः षोडशनामस्तोत्रम् औषधे चिन्तयेद्विष्णुं भोजने च जनार्दनम् । शयने पद्मनाभं च विवाहे
    च प्रजापतिम् ॥ १॥ युद्धे चक्रधरं देवं प्रवासे च त्रिविक्रमम् । नारायणं तनुत्यागे श्रीधरं प्रियसंगमे
    ॥ २॥ दुःस्वप्ने स्मर गोविंदं संकटे मधुसूदनम् । कानने नारसिंहं च पावके जलशायिनम् ॥ ३॥ जलमध्ये वराहं
    च पर्वते रघुनन्दनम् । गमने वामनं चैव सर्वकार्येषु माधवम् ॥ ४॥ षोडशैतानि नामानि प्रातरूत्थाय यः पठेत्
    । सर्वपापविर्निमुक्तो विष्णुलोके महीयते ॥ ५॥ । इति श्रीविष्णोः षोडशनामस्तोत्रं सम्पूर्णम् ।
