id: advaitamalamantrah-vasudevanandasarasvativiracitah
category: mantra
name:
  english: advaitamalamantrah (vasudevanandasarasvativiracitah)
  devanagari: अद्वैतमालामन्त्रः (वासुदेवानन्दसरस्वतीविरचितः)
content:
  english: sanga ragadvaishau vidveshaya vidveshaya ''ptakama kamadishatrunuccatayoccataya kalpanatita
    dushkalpanah stambhaya stambhaya 'suranishudanasurabhavam maraya maraya 'ttasudarshana vyadhistyanadiyogopasarganchamaya
    shamaya mrityunjaya pramadamrityum vidravaya vidravaya vimukta hridayagranthim bhindhi bhindhi nihsamshaya
    sarvasamshayamshchindhi chindhi nirvasana durvasana varaya varaya kriyakarakaphalasamsprishta jnanagnina
    dahyakarmani daha daha pashavimocana pashamstrotaya trotaya ''dityavarnatmasvarupapradarshanena svapadena
    niyojaya niyojaya jaya jaya bhagavannanasuyanandavardhanaya dattatreyaya namaste namaste || 500||
    iti pancashatarnam yo dadhyanmalamanum gale | artham tasya na mushnanti dehasthendriyataskarah ||
    2|| dambhadarpadayo ghora ye cavidyanishacarah | ye yogabhucara jnanabhucarah khecara api || 3|| antarayakara
    bhutagrahah kruratara api | yashca trishnadirakshasyo durbhara bhairava api || 4|| ye ca trividhaduhkhakhya
    vetalo lobhasamjnitah | mahamohabhidho brahmarakshaso dvividhavriti || 5|| shakini dakini capi layadyashca
    pishacakah | duradeva palayante te'pi malabhrito drutam || 6|| dhishuddhikramato labhya parabhaktih
    prajapinah | datto'nte paramam dadyatpadam devasudurlabham || 7|| iti shri paramapujaniyashrivasudevanandasarasvativiracitah
    advaitamalamantrah sampurnah |
  devanagari: सङ्ग रागद्वैषौ विद्वेषय विद्वेषया ऽऽप्तकाम कामादिशत्रूनुच्चाटयोच्चाटय कल्पनातीत दुष्कल्पनाः
    स्तम्भय स्तम्भया ऽसुरनिषूदनासुरभावं मारय मारया ऽत्तसुदर्शन व्याधिस्त्यानादियोगोपसर्गाञ्छमय शमय मृत्युञ्जय
    प्रमादमृत्युं विद्रावय विद्रावय विमुक्त हृदयग्रन्थिं भिन्धि भिन्धि निःसंशय सर्वसंशयांश्छिन्धि छिन्धि
    निर्वासन दुर्वासना वारय वारय क्रियाकारकफलसंस्पृष्ट ज्ञानाग्निना दाह्यकर्माणि दह दह पाशविमोचन पाशांस्त्रोटय
    त्रोटया ऽऽदित्यवर्णात्मस्वरूपप्रदर्शनेन स्वपदेन नियोजय नियोजय जय जय भगवन्ननसूयानन्दवर्धनाय दत्तात्रेयाय
    नमस्ते नमस्ते ॥ ५००॥ इति पञ्चशतार्णं यो दध्यान्मालामनुं गले । अर्थं तस्य न मुष्णन्ति देहस्थेन्द्रियतस्कराः
    ॥ २॥ दम्भदर्पादयो घोरा ये चाविद्यानिशाचराः । ये योगभूचरा ज्ञानभूचराः खेचरा अपि ॥ ३॥ अन्तरायकरा भूतग्रहाः
    क्रूरतरा अपि । याश्च तृष्णादिराक्षस्यो दुर्भरा भैरवा अपि ॥ ४॥ ये च त्रिविधदुःखाख्या वेतालो लोभसंज्ञितः
    । महामोहाभिधो ब्रह्मराक्षसो द्विविधावृती ॥ ५॥ शाकिनी डाकिनी चापि लयाद्याश्च पिशाचकाः । दूरादेव पलायन्ते
    तेऽपि मालाभृतो द्रुतम् ॥ ६॥ धीशुद्धिक्रमतो लभ्या परभक्तिः प्रजापिनः । दत्तोऽन्ते परमं दद्यात्पदं देवसुदुर्लभम्
    ॥ ७॥ इति श्री परमपूजनीयश्रीवासुदेवानन्दसरस्वतीविरचितः अद्वैतमालामन्त्रः सम्पूर्णः ।
