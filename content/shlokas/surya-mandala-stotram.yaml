id: surya-mandala-stotram
category: stotram
name:
  english: Surya Mandala Stotram
  devanagari: सूर्यमण्डल-स्तोत्रम्
content:
  english: namo'stu suryaya sahasrarashmaye sahasrashakhanvitasambhavatmane sahasrayogodbhavabhavabhagine
    sahasrasankhyayugadharine namah yanmandalam diptikaram vishalam ratnaprabham tivramanadirupam daridryaduhkhakshayakaranam
    ca punatu mam tatsaviturvarenyam yanmandalam devaganaih supujitam vipraih stutam bhavanamuktikovidam
    tam devadevam pranamami suryam punatu mam tatsaviturvarenyam yanmandalam jnanaghanam tvagamyam trailokyapujyam
    trigunatmarupam divyarupam punatu mam tatsaviturvarenyam yanmandalam gudhamatiprabodham dharmasya
    vriddhim kurute jananam yatsarvapapakshayakaranam ca punatu mam tatsaviturvarenyam yanmandalam vyadhivinashadaksham
    yadrigyajuhsamasu sampragitam prakashitam yena ca bhurbhuvah svah punatu mam tatsaviturvarenyam yanmandalam
    vedavido vadanti gayanti yaccarana yadyogino yogajusham ca sanghah punatu mam tatsaviturvarenyam yanmandalam
    sarvajanaishca pujitam jyotishca kuryadiha martyaloke yatkalakaladyamanadirupam punatu mam tatsaviturvarenyam
    yanmandalam vishnucaturmukhakhyam yadaksharam papaharam jananam yatkalakalpakshayakaranam ca punatu
    mam tatsaviturvarenyam yanmandalam vishvasrijam prasiddhamutpatti yasminjagatsamharate'khilam ca punatu
    mam tatsaviturvarenyam yanmandalam sarvagatasya vishnoratma param dhama vishuddhatattvam sukshmantarairyogapathanugamyam
    punatu mam tatsaviturvarenyam yanmandalam vedavido vadanti gayanti yaccarana yanmandalam vedavidah
    smaranti punatu mam tatsaviturvarenyam yanmandalam vedavidopagitam yadyoginam yogapathanugamyam tatsarvavedyam
    pranamami suryam punatu mam tatsaviturvarenyam suryamandalasustotram yah pathet satatam narah sarvapapavishuddhatma
    suryaloke mahiyate bhavishyottarapurane shrikrishnarjunasamvade suryamandalastotram sampurnam|| yo
    devah savita'smakam dhiyo dharmadi prerayet tasya yad bhargastad varenyamupasmahe
  devanagari: नमोऽस्तु सूर्याय सहस्ररश्मये सहस्रशाखान्वितसम्भवात्मने सहस्रयोगोद्भवभावभागिने सहस्रसङ्ख्यायुगधारिणे
    नमः यन्मण्डलं दीप्तिकरं विशालं रत्नप्रभं तीव्रमनादिरूपम् दारिद्र्यदुःखक्षयकारणं च पुनातु मां तत्सवितुर्वरेण्यम्
    यन्मण्डलं देवगणैः सुपूजितं विप्रैः स्तुतं भावनमुक्तिकोविदम् तं देवदेवं प्रणमामि सूर्यं पुनातु मां
    तत्सवितुर्वरेण्यम् यन्मण्डलं ज्ञानघनं त्वगम्यं त्रैलोक्यपूज्यं त्रिगुणात्मरूपम् दिव्यरूपं पुनातु मां
    तत्सवितुर्वरेण्यम् यन्मण्डलं गूढमतिप्रबोधं धर्मस्य वृद्धिं कुरुते जनानाम् यत्सर्वपापक्षयकारणं च पुनातु
    मां तत्सवितुर्वरेण्यम् यन्मण्डलं व्याधिविनाशदक्षं यदृग्यजुःसामसु सम्प्रगीतम् प्रकाशितं येन च भूर्भुवः
    स्वः पुनातु मां तत्सवितुर्वरेण्यम् यन्मण्डलं वेदविदो वदन्ति गायन्ति यच्चारण यद्योगिनो योगजुषां च सङ्घाः
    पुनातु मां तत्सवितुर्वरेण्यम् यन्मण्डलं सर्वजनैश्च पूजितं ज्योतिश्च कुर्यादिह मर्त्यलोके यत्कालकालाद्यमनादिरूपं
    पुनातु मां तत्सवितुर्वरेण्यम् यन्मण्डलं विष्णुचतुर्मुखाख्यं यदक्षरं पापहरं जनानाम् यत्कालकल्पक्षयकारणं
    च पुनातु मां तत्सवितुर्वरेण्यम् यन्मण्डलं विश्वसृजं प्रसिद्धमुत्पत्ति यस्मिञ्जगत्संहरतेऽखिलं च पुनातु
    मां तत्सवितुर्वरेण्यम् यन्मण्डलं सर्वगतस्य विष्णोरात्मा परं धाम विशुद्धतत्त्वम् सूक्ष्मान्तरैर्योगपथानुगम्यं
    पुनातु मां तत्सवितुर्वरेण्यम् यन्मण्डलं वेदविदो वदन्ति गायन्ति यच्चारण यन्मण्डलं वेदविदः स्मरन्ति
    पुनातु मां तत्सवितुर्वरेण्यम् यन्मण्डलं वेदविदोपगीतं यद्योगिनां योगपथानुगम्यम् तत्सर्ववेद्यं प्रणमामि
    सूर्यं पुनातु मां तत्सवितुर्वरेण्यम् सूर्यमण्डलसुस्तोत्रं यः पठेत् सततं नरः सर्वपापविशुद्धात्मा सूर्यलोके
    महीयते भविष्योत्तरपुराणे श्रीकृष्णार्जुनसंवादे सूर्यमण्डलस्तोत्रं सम्पूर्णम्॥ यो देवः सविताऽस्माकं
    धियो धर्मादि प्रेरयेत् तस्य यद् भर्गस्तद् वरेण्यमुपास्महे
