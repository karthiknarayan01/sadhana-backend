id: parayonikavacam
category: kavacha
name:
  english: parayonikavacam
  devanagari: परयोनीकवचम्
content:
  english: rinu devi pravakshyami parayonikavacam shubham | sarvagamarahasyam tat kamakhyahridayodbhavam
    || 2|| gopaniyam prayatnena yoginiganasevitam | devyah prasadajananam sarvarakshakaram param || 3||
    asya shriparayonikavacasya parameshvara rishih | anushtupchandah proktah kamakhya devata para || 4||
    dhyayet kamakhyam parameshim raktapadmasanoparim | trinetram varadam shantam yoginibhih samavritam
    || 5|| sindurarunadeham tam ratnamaulivirajitam | sarvabijasvarupam tam parayonim vicintayet || 6||
    kamakhya me shirah patu parayonih shikham mama | mahamaya lalatam me tripura bhruyugam tatha || 7||
    bhairavi netrayugalam tara karnau sadavatu | shodashi nasikam patu matangi vadanam mama || 8|| vagishvari
    jihvikam patu cinmudra dantapanktikam | bagalamukhi me kantham dhumavatyurasi sthitam || 9|| kamala
    hridayam patu bhuvaneshi nabhimandalam | chinnamasta katim patu kali guhyam sadavatu || 10|| varahi
    me sakthini patu vaishnavi coruyugmakam | brahmi janudvayam patu maheshi janghike mama || 11|| kaumari
    gulphadesham me narasimhi padadvayam | indrani padatalayoh sarvada mangalam dadat || 12|| mahakalo'gratah
    patu pashcad bhairava ishvarah | dakshine nandikeshashca vame vireshvaro'vatu || 13|| ishano murdhni
    me patu sadashiva udanmukhah | rudro'dhastatsada patu brahma madhye vyavasthitah || 14|| vishnurvyapya
    tanum patu harih praneshu sarvada | shambhurbuddhim sada patu dattatreyo dhritim mama || 15|| yoginyah
    sarvato rakshan siddhavidyah samantatah | dakinyah shakinyashcaiva guhyamarge sadavatu || 16|| catuhshashtimahayogyah
    sarvangam me sadavatu | bhairavah kshetrapalashca marge marge'bhirakshatu || 17|| yonipitheshvari
    devi kamakhya parameshvari | antarbahishca mam patu nityam cinmatrarupini || 18|| parabrahmasvarupa
    sa parashaktih sanatani | yasyah smaranamatrena sarvaraksha prajayate || 19|| kamarupanilaya nitya
    sarvatattvaikavigraha | sarvangam me sada patu kamakhya kamadayini || 20|| ityetat kathitam devi parayonekavacam
    param | sarvatantreshu nigudham kamakhyahridayodbhavam || 21|| gopaniyam prayatnena na prakashyam
    kadacana | bhaktiyuktaya shishyaya datavyam siddhikankshine || 22|| yah pathetpratarutthaya shucirbhutva
    samahitah | kamakhyaya mahapritim sa labhet natra samshayah || 23|| yatraitatpathyate nityam tatra
    pitham prajayate | yoginyo modamanastu tishthanti saha bhairavaih || 24|| na tasya vighnasanghato
    na grahanam prapidanam | na bhutapretavetalairbadhyate kavacashrayah || 25|| rane rajakule ghore vane
    durge jalantare | agnicaurabhaye prapte kavacam paramam sharanam || 26|| daridryam duhkhamajnanam
    durbhagyam papakancukam | kamakhyadrishtimatrena himavat vilayam vrajet || 27|| vandhya putravati
    syat syaddhani nirdhano'pi ca | rogi rogavinirmukto bhayabhitah sukhi bhavet || 28|| yatra kamakhyaya
    devya smritih kavacasamyuta | tatra siddhirnivasati nityashrirna cancala || 29|| bhurjapatre samalikhya
    gandhacandanalepitam | dharayedyadi bhaktya vai sarvaraksham labheddhruvam || 30|| ashtottarashatavrittya
    purashcarya prakirtita | sahasravartanadasya mantro jagarti nishcitam || 31|| na vedairna tapobhirva
    na danairyajnakotibhih | yadrishi jayate siddhih kavacasyasya kirtanat || 32|| kamakhya parama devi
    parayonih paratpara | yatra sa tatra me muktirnatra karya vicarana || 33|| iti parayonikavacam sampurnam
    |
  devanagari: ृणु देवि प्रवक्ष्यामि परयोनिकवचं शुभम् । सर्वागमरहस्यं तत् कामाख्याहृदयोद्भवम् ॥ २॥ गोपनीयं
    प्रयत्नेन योगिनीगणसेवितम् । देव्याः प्रसादजननं सर्वरक्षाकरं परम् ॥ ३॥ अस्य श्रीपरयोनिकवचस्य परमेश्वर
    ऋषिः । अनुष्टुप्छन्दः प्रोक्तः कामाख्या देवता परा ॥ ४॥ ध्यायेत् कामाख्यां परमेशीं रक्तपद्मासनोपरीम्
    । त्रिनेत्रां वरदां शान्तां योगिनीभिः समावृताम् ॥ ५॥ सिन्दूरारुणदेहां तां रत्नमौलिविराजिताम् । सर्वबीजस्वरूपां
    तां परयोनिं विचिन्तयेत् ॥ ६॥ कामाख्या मे शिरः पातु परयोनिः शिखां मम । महामाया ललाटं मे त्रिपुरा भ्रूयुगं
    तथा ॥ ७॥ भैरवी नेत्रयुगलं तारा कर्णौ सदावतु । षोडशी नासिकां पातु मातङ्गी वदनं मम ॥ ८॥ वागीश्वरी जिह्विकां
    पातु चिन्मुद्रा दन्तपङ्क्तिकाम् । बगलामुखि मे कण्ठं धूमावत्युरसि स्थिताम् ॥ ९॥ कमला हृदयं पातु भुवनेशी
    नाभिमण्डलम् । छिन्नमस्ता कटिं पातु काली गुह्यं सदावतु ॥ १०॥ वाराही मे सक्थिनी पातु वैष्णवी चोरुयुग्मकम्
    । ब्राह्मी जानुद्वयं पातु माहेशी जङ्घिके मम ॥ ११॥ कौमारी गुल्फदेशं मे नारसिंही पदद्वयम् । इन्द्राणी
    पादतलयोः सर्वदा मङ्गलं ददात् ॥ १२॥ महाकालोऽग्रतः पातु पश्चाद् भैरव ईश्वरः । दक्षिणे नन्दिकेशश्च वामे
    वीरेश्वरोऽवतु ॥ १३॥ ईशानो मूर्ध्नि मे पातु सदाशिव उदङ्मुखः । रुद्रोऽधस्तात्सदा पातु ब्रह्मा मध्ये
    व्यवस्थितः ॥ १४॥ विष्णुर्व्याप्य तनुं पातु हरिः प्राणेषु सर्वदा । शम्भुर्बुद्धिं सदा पातु दत्तात्रेयो
    धृतिं मम ॥ १५॥ योगिन्यः सर्वतो रक्षन् सिद्धविद्याः समन्ततः । डाकिन्यः शाकिन्यश्चैव गुह्यमार्गे सदावतु
    ॥ १६॥ चतुःषष्टिमहायोग्यः सर्वाङ्गं मे सदावतु । भैरवाः क्षेत्रपालाश्च मार्गे मार्गेऽभिरक्षतु ॥ १७॥
    योनिपीठेश्वरी देवी कामाख्या परमेश्वरी । अन्तर्बहिश्च मां पातु नित्यं चिन्मात्ररूपिणी ॥ १८॥ परब्रह्मस्वरूपा
    सा पराशक्तिः सनातनी । यस्याः स्मरणमात्रेण सर्वरक्षा प्रजायते ॥ १९॥ कामरूपनिलया नित्या सर्वतत्त्वैकविग्रहा
    । सर्वाङ्गं मे सदा पातु कामाख्या कामदायिनी ॥ २०॥ इत्येतत् कथितं देवि परयोनेकवचं परम् । सर्वतन्त्रेषु
    निगूढं कामाख्याहृदयोद्भवम् ॥ २१॥ गोपनीयं प्रयत्नेन न प्रकाश्यं कदाचन । भक्तियुक्ताय शिष्याय दातव्यं
    सिद्धिकाङ्क्षिणे ॥ २२॥ यः पठेत्प्रातरुत्थाय शुचिर्भूत्वा समाहितः । कामाख्याया महाप्रीतिं स लभेत् नात्र
    संशयः ॥ २३॥ यत्रैतत्पठ्यते नित्यं तत्र पीठं प्रजायते । योगिन्यो मोदमानास्तु तिष्ठन्ति सह भैरवैः ॥
    २४॥ न तस्य विघ्नसङ्घातो न ग्रहाणां प्रपीडनम् । न भूतप्रेतवेतालैर्बाध्यते कवचाश्रयः ॥ २५॥ रणे राजकुले
    घोरे वने दुर्गे जलान्तरे । अग्निचौरभये प्राप्ते कवचं परमं शरणम् ॥ २६॥ दारिद्र्यं दुःखमज्ञानं दुर्भाग्यं
    पापकञ्चुकम् । कामाख्यादृष्टिमात्रेण हिमवत् विलयं व्रजेत् ॥ २७॥ वन्ध्या पुत्रवती स्यात् स्याद्धनी निर्धनोऽपि
    च । रोगी रोगविनिर्मुक्तो भयभीतः सुखी भवेत् ॥ २८॥ यत्र कामाख्यया देव्या स्मृतिः कवचसंयुता । तत्र सिद्धिर्निवसति
    नित्यश्रीर्न चञ्चला ॥ २९॥ भूर्जपत्रे समालिख्य गन्धचन्दनलेपितम् । धारयेद्यदि भक्त्या वै सर्वरक्षां
    लभेद्ध्रुवम् ॥ ३०॥ अष्टोत्तरशतावृत्त्या पुरश्चर्या प्रकीर्तिता । सहस्रावर्तनादस्य मन्त्रो जागर्ति
    निश्चितम् ॥ ३१॥ न वेदैर्न तपोभिर्वा न दानैर्यज्ञकोटिभिः । यादृशी जायते सिद्धिः कवचस्यास्य कीर्तनात्
    ॥ ३२॥ कामाख्या परमा देवी परयोनिः परात्परा । यत्र सा तत्र मे मुक्तिर्नात्र कार्या विचारणा ॥ ३३॥ इति
    परयोनिकवचं सम्पूर्णम् ।
