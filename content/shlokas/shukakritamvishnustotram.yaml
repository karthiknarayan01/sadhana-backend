id: shukakritamvishnustotram
category: stotram
name:
  english: shukakritamvishnustotram
  devanagari: शुककृतंविष्णुस्तोत्रम्
content:
  english: shrishukakritam vishnustotram shuka uvaca | namaste vasudevaya sarvalokaikasakshine || 50||
    jagadbijasvarupaya purnaya nibhritatmane | haraye vasukisthaya shvetadvipanavasine || 51|| hamsaya
    matsyarupaya varahatanudharine | nrisimhaya dhruvejyaya sankhyayogeshvaraya ca || 52|| catuhsanaya
    kurmaya prithave svasukhatmane | nabheyaya jagaddhatre vidhatre'ntakaraya ca || 53|| bhargavendraya
    ramaya raghavaya paraya ca | krishnaya vedakartre ca buddhakalkisvarupine || 54|| caturvyuhaya vedyaya
    dhyeyaya paramatmane | naranarayanakhyaya shipivishtaya vishnave || 55|| ritadhamne vidhamne ca suparnaya
    svarocishe | ribhave suvratakhyaya sudhamne cajitaya ca || 56|| vishvarupaya vishvaya srishtisthityantakarine
    | yajnaya yajnabhoktre ca sthavishthayanave'rthine || 57|| adityasomanetraya sahaojobalaya ca | ijyaya
    sakshine'jaya bahushirshanghribahave || 58|| shrishaya shrinivasaya bhaktavashyaya sharngine | ashtaprakrityadhishaya
    brahmane'nantashaktaye || 59|| brihadaranyavedyaya hrishikeshaya vedhase | pundarikanibhakshaya kshetrajnaya
    vibhasine || 60|| govindaya jagatkartre jagannathaya yogine | satyaya satyasandhaya vaikunthayacyutaya
    ca || 61|| adhokshajaya dharmaya vamanaya tridhatave | ghritarcishe vishnave te'nantaya kapilaya ca
    || 62|| virincaye trikakude rigyajuhsamarupine | ekasha
  devanagari: श्रीशुककृतं विष्णुस्तोत्रम् शुक उवाच । नमस्ते वासुदेवाय सर्वलोकैकसाक्षिणे ॥ ५०॥ जगद्बीजस्वरूपाय
    पूर्णाय निभृतात्मने । हरये वासुकिस्थाय श्वेतद्वीपनवासिने ॥ ५१॥ हंसाय मत्स्यरूपाय वाराहतनुधारिणे ।
    नृसिंहाय ध्रुवेज्याय साङ्ख्ययोगेश्वराय च ॥ ५२॥ चतुःसनाय कूर्माय पृथवे स्वसुखात्मने । नाभेयाय जगद्धात्रे
    विधात्रेऽन्तकराय च ॥ ५३॥ भार्गवेन्द्राय रामाय राघवाय पराय च । कृष्णाय वेदकर्त्रे च बुद्धकल्किस्वरूपिणे
    ॥ ५४॥ चतुर्व्यूहाय वेद्याय ध्येयाय परमात्मने । नरनारायणाख्याय शिपिविष्टाय विष्णवे ॥ ५५॥ ऋतधाम्ने विधाम्ने
    च सुपर्णाय स्वरोचिषे । ऋभवे सुव्रताख्याय सुधाम्ने चाजिताय च ॥ ५६॥ विश्वरूपाय विश्वाय सृष्टिस्थित्यन्तकारिणे
    । यज्ञाय यज्ञभोक्त्रे च स्थविष्ठायाणवेऽर्थिने ॥ ५७॥ आदित्यसोमनेत्राय सहओजोबलाय च । ईज्याय साक्षिणेऽजाय
    बहुशीर्षाङ्घ्रिबाहवे ॥ ५८॥ श्रीशाय श्रीनिवासाय भक्तवश्याय शार्ङ्गिणे । अष्टप्रकृत्यधीशाय ब्रह्मणेऽनन्तशक्तये
    ॥ ५९॥ बृहदारण्यवेद्याय हृषीकेशाय वेधसे । पुण्डरीकनिभाक्षाय क्षेत्रज्ञाय विभासिने ॥ ६०॥ गोविन्दाय जगत्कर्त्रे
    जगन्नाथाय योगिने । सत्याय सत्यसन्धाय वैकुण्ठायाच्युताय च ॥ ६१॥ अधोक्षजाय धर्माय वामनाय त्रिधातवे ।
    घृतार्चिषे विष्णवे तेऽनन्ताय कपिलाय च ॥ ६२॥ विरिञ्चये त्रिककुदे ऋग्यजुःसामरूपिणे । एकश
