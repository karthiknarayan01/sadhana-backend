id: vishnunaparashuramayaproktamkavacam
category: kavacha
name:
  english: vishnunaparashuramayaproktamkavacam
  devanagari: विष्णुनापरशुरामायप्रोक्तंकवचम्
content:
  english: mantram dadau tatah || 63|| prajapatih rishiryasya chandashca brihati tatha | devi padmalaya
    yasya caturvargam niyojanam || 64|| om shrikamalavasinyai svaha me patu mastakam | om shri kapalam
    me patu locane shrimshriyai namah || 65|| o shrimshriyai svaheti vai karnayugmam sada'vatu | om shrinklim
    mahalakshmyai svaha me patu nasikam || 66|| om shrim padmalayayai ca svaha dantan sada'vatu | aushrim
    krishnapriyayai ca dantarandhran sada'vatu || 67|| om shrinarayaneshayai mama kantham sada'vatu |
    om shrim keshavakantayai mama skandham sada'vatu || 68|| om shrim padmanivasinyai svaha nabhim sada'vatu
    | om hrim shrim samsaramatre mama vakshah sada'vatu || 69|| om shrimmom krishnakantayai svaha prishtham
    sada'vatu | om hrimshrim shriyai svaha ca mama hastau sada'vatu || 70|| om shrinivasakantayai mama
    padau sada'vatu | om shrimhrinklim shriyai svaha sarvangam me sada'vatu || 71|| pracyam patu mahalakshmiragneyyam
    kamalalaya | padma mam dakshine patu nairrityam shriharipriya || 72|| padmalaya pashcime mam vayavyam
    patu mam svayam | uttare kamala patu caishanyam sindhukanyaka || 73|| narayani ca paturdhvamadho vishnupriya'vatu
    | santatam sarvatah patu vishnupranadhika mama || 74|| iti sarvaishvaryapradam varma bahau sudharaya
    | devendraishcasurendraishca'vadhyo bhavasi nishcitam || 75|| ityuktva kavacam datva yayau vaikunthamacyutah
    | iti shrilakshminarayaniyasamhitayam prathame kritayugasantane 458
  devanagari: मन्त्रं ददौ ततः ॥ ६३॥ प्रजापतिः ऋषिर्यस्य छन्दश्च बृहती तथा । देवी पद्मालया यस्य चतुर्वर्गं
    नियोजनम् ॥ ६४॥ ॐ श्रीकमलवासिन्यै स्वाहा मे पातु मस्तकम् । ॐ श्री कपालं मे पातु लोचने श्रींश्रियै नमः
    ॥ ६५॥ ओ श्रींश्रियै स्वाहेति वै कर्णयुग्मं सदाऽवतु । ॐ श्रीङ्क्लीं महालक्ष्म्यै स्वाहा मे पातु नासिकाम्
    ॥ ६६॥ ॐ श्रीं पद्मालयायै च स्वाहा दन्तान् सदाऽवतु । औश्रीं कृष्णप्रियायै च दन्तरन्ध्रान् सदाऽवतु ॥
    ६७॥ ॐ श्रीनारायणेशायै मम कण्ठं सदाऽवतु । ॐ श्रीं केशवकान्तायै मम स्कन्धं सदाऽवतु ॥ ६८॥ ॐ श्रीं पद्मनिवासिन्यै
    स्वाहा नाभिं सदाऽवतु । ॐ ह्रीं श्रीं संसारमात्रे मम वक्षः सदाऽवतु ॥ ६९॥ ॐ श्रीम्मों कृष्णकान्तायै
    स्वाहा पृष्ठं सदाऽवतु । ॐ ह्रींश्रीं श्रियै स्वाहा च मम हस्तौ सदाऽवतु ॥ ७०॥ ॐ श्रीनिवासकान्तायै मम
    पादौ सदाऽवतु । ॐ श्रींह्रीङ्क्लीं श्रियै स्वाहा सर्वाङ्गं मे सदाऽवतु ॥ ७१॥ प्राच्यां पातु महालक्ष्मीराग्नेय्यां
    कमलालया । पद्मा मां दक्षिणे पातु नैरृत्यां श्रीहरिप्रिया ॥ ७२॥ पद्मालया पश्चिमे मां वायव्यां पातु
    मां स्वयम् । उत्तरे कमला पातु चैशान्यां सिन्धुकन्यका ॥ ७३॥ नारायणी च पातूर्ध्वमधो विष्णुप्रियाऽवतु
    । सन्ततं सर्वतः पातु विष्णुप्राणाधिका मम ॥ ७४॥ इति सर्वैश्वर्यप्रदं वर्म बाहौ सुधारय । देवेन्द्रैश्चासुरेन्द्रैश्चाऽवध्यो
    भवसि निश्चितम् ॥ ७५॥ इत्युक्त्वा कवचं दत्वा ययौ वैकुण्ठमच्युतः । इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतयुगसन्ताने ४५८
