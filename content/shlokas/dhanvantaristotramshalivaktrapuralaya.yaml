id: dhanvantaristotramshalivaktrapuralaya
category: stotram
name:
  english: dhanvantaristotramshalivaktrapuralaya
  devanagari: धन्वन्तरिस्तोत्रम्शालिवक्त्रपुरालय
content:
  english: shalivaktrapuralaya dhanvantari stotram bhishagvara ramakanta shalivaktrapuralaya | ragarogadibhutam
    mam pahi dhanvantare hare || 1|| shankhacakrasudhakumbhajalukadhara madhava | karunakara mamashu pahi
    dhanvantare hare || 2|| akhiladhara govinda nikhilartinivaraka | vyakulam mam mahavishno pahi dhanvantare
    hare || 3|| shyamavarna sadananda shalitundapureshvara | vipannam mam vishvabandho pahi dhanvantare
    hare || 4|| janarddana jagannatha jalajaksha jvarapaha | pranatardra prapannam mam pahi dhanvantare
    hare || 5|| sanatana gunarama sarvamayakulantaka | rujartam mam kriparashe pahi dhanvantare hare ||
    6|| shanta shalimukhagara sharadendunibhanana | sharmasagara nihsvam mam pahi dhanvantare hare ||
    7|| sudhashanapate vishvakleshanashana keshava | prataptam mam sudhapane pahi dhanvantare hare ||
    8|| vasudeva hrishikesha vyadhijatavinashaka | vanamalin varakam mam pahi dhanvantare hare || 9||
    narayana dayasindho natha shalimukhalaya | padmanabha murare mam pahi dhanvantara hare || 10|| rogaturanamabhayapradayin
    dakshinyavardhe bhishagishamurte | kalyanarashe kamalapate mam dhanvantare pahi hare murare || 11||
    kshirabdhinatha daracakrasudhajaluka
  devanagari: शालिवक्त्रपुरालय धन्वन्तरि स्तोत्रम् भिषग्वर रमाकान्त शालिवक्त्रपुरालय । रागरोगादिभूतं मां
    पाहि धन्वन्तरे हरे ॥ १॥ शङ्खचक्रसुधाकुम्भजलुकाधर माधव । करुणाकर मामाशु पाहि धन्वन्तरे हरे ॥ २॥ अखिलाधार
    गोविन्द निखिलार्तिनिवारक । व्याकुलं मां महाविष्णो पाहि धन्वन्तरे हरे ॥ ३॥ श्यामवर्ण सदानन्द शालितुण्डपुरेश्वर
    । विपन्नं मां विश्वबन्धो पाहि धन्वन्तरे हरे ॥ ४॥ जनार्द्दन जगन्नाथ जलजाक्ष ज्वरापह । प्रणतार्द्र प्रपन्नं
    मां पाहि धन्वन्तरे हरे ॥ ५॥ सनातन गुणाराम सर्वामयकुलान्तक । रुजार्तं मां कृपाराशे पाहि धन्वन्तरे हरे
    ॥ ६॥ शान्त शालिमुखागार शारदेन्दुनिभानन । शर्मसागर निःस्वं मां पाहि धन्वन्तरे हरे ॥ ७॥ सुधाशनपते विश्वक्लेशनाशन
    केशव । प्रतप्तं मां सुधापाणे पाहि धन्वन्तरे हरे ॥ ८॥ वासुदेव हृषीकेश व्याधिजातविनाशक । वनमालिन् वराकं
    मां पाहि धन्वन्तरे हरे ॥ ९॥ नारायण दयासिन्धो नाथ शालिमुखालय । पद्मनाभ मुरारे मां पाहि धन्वन्तर हरे
    ॥ १०॥ रोगातुराणामभयप्रदायिन् दाक्षिण्यवार्धे भिषगीशमूर्ते । कल्याणराशे कमलापते मां धन्वन्तरे पाहि
    हरे मुरारे ॥ ११॥ क्षीराब्धिनाथ दरचक्रसुधाजलूका
