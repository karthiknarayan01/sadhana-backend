id: avyaktopanishat-samavedokta
category: upanishad
name:
  english: avyaktopanishat (samavedokta)
  devanagari: अव्यक्तोपनिषत् (सामवेदोक्त)
content:
  english: indro vai kila devanamanujavara asit | tam prajapatirabravidgaccha devanamadhipatirbhaveti
    | so'gacchat | tam deva ucuranujavaro'si tvamasmakam kutastvadhipatyamiti | sa prajapatimabhyetyovacaivam
    deva ucuranujavarasya kutastavadhipatyamiti | tam prajapatirindram trikalashairamritapurnairanushtubhabhimantritairabhishicya
    tam sudarshanena dakshinato raraksha pancajanyena vamato dvayenaiva surakshito'bhavat | raukme phalake
    suryavarcasi mantramanushtubham vinyasya tadasya kanthe pratyamuncat | tatah sudurniriksho'bhavat
    | tasmai vidyamanushtubhim pradat | tato devastamadhipatyayanumenire | sa svaradabhut | ya evam veda
    svarad bhavet | so'manyata prithivimapi kathamapam jayeyamiti | sa prajapatimupadhavat | tasmatprajapatih
    kamathakaramindranagabhujagendradharam bhadrasanam pradat | sa prithivimabhyajayat | tatah sa ubhayorlokayoradhipatirabhut
    | ya evam vedobhayorlokayoradhipatirbhavati | sa prithivim jayati |
  devanagari: इन्द्रो वै किल देवानामनुजावर आसीत् । तं प्रजापतिरब्रवीद्गच्छ देवानामधिपतिर्भवेति । सोऽगच्छत्
    । तं देवा ऊचुरनुजावरोऽसि त्वमस्माकं कुतस्त्वाधिपत्यमिति । स प्रजापतिमभ्येत्योवाचैवं देवा ऊचुरनुजावरस्य
    कुतस्तवाधिपत्यमिति । तं प्रजापतिरिन्द्रं त्रिकलशैरमृतपूर्णैरानुष्टुभाभिमन्त्रितैरभिषिच्य तं सुदर्शनेन
    दक्षिणतो ररक्ष पाञ्चजन्येन वामतो द्वयेनैव सुरक्षितोऽभवत् । रौक्मे फलके सूर्यवर्चसि मन्त्रमानुष्टुभं
    विन्यस्य तदस्य कण्ठे प्रत्यमुञ्चत् । ततः सुदुर्निरीक्षोऽभवत् । तस्मै विद्यामानुष्टुभीं प्रादात् ।
    ततो देवास्तमाधिपत्यायानुमेनिरे । स स्वराडभूत् । य एवं वेद स्वराड् भवेत् । सोऽमन्यत पृथिवीमपि कथमपां
    जयेयमिति । स प्रजापतिमुपाधावत् । तस्मात्प्रजापतिः कमठाकारमिन्द्रनागभुजगेन्द्राधारं भद्रासनं प्रादात्
    । स पृथिवीमभ्यजयत् । ततः स उभयोर्लोकयोरधिपतिरभूत् । य एवं वेदोभयोर्लोकयोरधिपतिर्भवति । स पृथिवीं जयति
    ।
