id: budha-kavacham
category: stotram
name:
  english: Budha Kavacham
content:
  english: asya shribudhakavacastotramantrasya budhaprityartham jape viniyogah | atha budha kavacam budhastu
    pustakadharah kunkumasya samadyutih | pitambaradharah patu pitamalyanulepanah || || katim ca patu
    me saumyah shirodesham budhastatha | netre jnanamayah patu shrotre patu nishapriyah || || ghranam
    gandhapriyah patu jihvam vidyaprado mama | kantham patu vidhoh putro bhujau pustakabhushanah || ||
    vakshah patu varangashca hridayam rohinisutah | nabhim patu suraradhyo madhyam patu khageshvarah ||
    || januni rauhineyashca patu janghe ukhilapradah | padau me bodhanah patu patu saumyo || atha phalashrutih
    etaddhi kavacam divyam sarvapapapranashanam | sarvarogaprashamanam sarvaduhkhanivaranam || || ayurarogyashubhadam
    putrapautrapravardhanam | yah pathecchrinuyadvapi sarvatra vijayi bhavet || || || iti shribrahmavaivartapurane
    budhakavacam sampurnam ||
  devanagari: अस्य श्रीबुधकवचस्तोत्रमन्त्रस्य बुधप्रीत्यर्थं जपे विनियोगः । अथ बुध कवचम् बुधस्तु पुस्तकधरः
    कुङ्कुमस्य समद्युतिः । पीताम्बरधरः पातु पीतमाल्यानुलेपनः ॥ ॥ कटिं च पातु मे सौम्यः शिरोदेशं बुधस्तथा
    । नेत्रे ज्ञानमयः पातु श्रोत्रे पातु निशाप्रियः ॥ ॥ घ्राणं गन्धप्रियः पातु जिह्वां विद्याप्रदो मम
    । कण्ठं पातु विधोः पुत्रो भुजौ पुस्तकभूषणः ॥ ॥ वक्षः पातु वराङ्गश्च हृदयं रोहिणीसुतः । नाभिं पातु
    सुराराध्यो मध्यं पातु खगेश्वरः ॥ ॥ जानुनी रौहिणेयश्च पातु जङ्घे उखिलप्रदः । पादौ मे बोधनः पातु पातु
    सौम्यो ॥ अथ फलश्रुतिः एतद्धि कवचं दिव्यं सर्वपापप्रणाशनम् । सर्वरोगप्रशमनं सर्वदुःखनिवारणम् ॥ ॥ आयुरारोग्यशुभदं
    पुत्रपौत्रप्रवर्धनम् । यः पठेच्छृणुयाद्वापि सर्वत्र विजयी भवेत् ॥ ॥ ॥ इति श्रीब्रह्मवैवर्तपुराणे बुधकवचं
    सम्पूर्णम् ॥
