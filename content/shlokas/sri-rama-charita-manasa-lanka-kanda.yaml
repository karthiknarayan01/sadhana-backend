    काहा ॥ कहहु कवन भय करिअ बिचारा। नर कपि भालु अहार हमारा ॥ दो सब के बचन श्रवन सुनि कह प्रहस्त कर जोरि।
    निति बिरोध न करिअ प्रभु मत्रिन्न्ह मति अति थोरि ॥ ॥ कहहिं सचिव सठ ठकुरसोहाती। नाथ न पूर आव एहि भाँती
    ॥ बारिधि नाघि एक कपि आवा। तासु चरित मन महुँ सबु गावा ॥ छुधा न रही तुम्हहि तब काहू। जारत नगरु कस न
    धरि खाहू ॥ सुनत नीक आगें दुख पावा। सचिवन अस मत प्रभुहि सुनावा ॥ जेहिं बारीस बँधायु हेला। उतरेउ सेन
    समेत सुबेला ॥ सो भनु मनुज खाब हम भाई। बचन कहहिं सब गाल फुलाई ॥ तात बचन मम सुनु अति आदर। जनि मन गुनहु
    मोहि करि कादर ॥ प्रिय बानी जे सुनहिं जे कहहीं। ऐसे नर निकाय जग अहहीम् ॥ बचन परम हित सुनत कठोरे। सुनहिं
    जे कहहिं ते नर प्रभु थोरे ॥ प्रथम बसीठ पठु सुनु नीती। सीता देइ करहु पुनि प्रीती ॥ दो नारि पाइ फिरि
    जाहिं जौं तौ न बढ़आइअ रारि। नाहिं त सन्मुख समर महि तात करिअ हठि मारि ॥ ॥ यह मत जौं मानहु प्रभु मोरा।
    उभय प्रकार सुजसु जग तोरा ॥ सुत सन कह दसकण्ठ रिसाई। असि मति सठ केहिं तोहि सिखाई ॥ अबहीं ते उर संसय
    होई। बेनुमूल सुत भयहु घमोई ॥ सुनि पितु गिरा परुष अति घोरा। चला भवन कहि बचन कठोरा ॥ हित मत तोहि न लागत
    कैसें। काल बिबस कहुँ भेषज जैसेम् ॥ सन्ध्या समय जानि दससीसा। भवन चलेउ निरखत भुज बीसा ॥ लङ्का सिखर उपर
    आगारा। अति बिचित्र तहँ होइ अखारा ॥ बैठ जाइ तेही मन्दिर रावन। लागे किन्नर गुन गन गावन ॥ बाजहिं ताल
    पखाउज बीना। नृत्य करहिं अपछरा प्रबीना ॥ दो सुनासीर सत सरिस सो सन्तत करि बिलास। परम प्रबल रिपु सीस
    पर तद्यपि सोच न त्रास ॥ ॥ इहाँ सुबेल सैल रघुबीरा। उतरे सेन सहित अति भीरा ॥ सिखर एक उतङ्ग अति देखी।
    परम रम्य सम सुभ्र बिसेषी ॥ तहँ तरु किसलय सुमन सुहाए। लछिमन रचि निज हाथ डसाए ॥ ता पर रूचिर मृदुल मृगछाला।
    तेहीं आसान आसीन कृपाला ॥ प्रभु कृत सीस कपीस उछङ्गा। बाम दहिन दिसि चाप निषङ्गा ॥ दुहुँ कर कमल सुधारत
