id: govindashtakam
category: stotram
name:
  english: govindashtakam
  devanagari: गोविन्दाष्टकम्
content:
  english: '|| govindashtakam || satyam jnanamanamtam nityamanakasham paramakasham | goshthapranganarinkhanalolamanayasam
    paramayasam | mayakalpitananakaramanakaram bhuvanakaram | kshmaya nathamanatham pranamata govimdam
    paramanamdam || 1 || mritsnamatsiheti yashodatadanashaishava samtrasam | vyaditavaktralokitalokalokacaturdashalokalim
    | lokatrayapuramulastambham lokalokamanalokam | lokesham paramesham pranamata govimdam paramanamdam
    || 2 || traivishtaparipuviraghnam kshitibharaghnam bhavarogaghnam | kaivalyam navanitaharamanaharam
    bhuvanaharam | vaimalyasphutacetovrittivisheshabhasamanabhasam | shaivam kevalashamtam pranamata govimdam
    paramanamdam || 3 || gopalam prabhulilavigrahagopalam kulagopalam | gopikhelanagovardhanadhritililalalitagopalam
    | gobhirnigadita govimdasphutanamanam bahunamanam | gopigocarapathikam pranamata govimdam paramanamdam
    || 4 || gopimamdalagoshthibhedam bhedavasthamabhedabham | shashvadgokhuranirghutoddhatadhulidhusarasaubhagyam
    | shraddhabhaktigrihitanamdamacintyam cimtitasadbhavam | cimtamanimahimanam pranamata govimdam paramanamdam
    || 5 || snanavyakulayoshidvastramupadayagamuparudham | vyaditsamtiratha digvastra hyupudatumupakarshamtam
    | nirdhutadvayashokavimoham buddham buddheramtastham | sattamatrashariram pranamata govimdam paramanamdam
    || 6 || kamtam karanakaranamadimanadim kalamanabhasam | kalimdigatakaliyashirasi muhurnrityamtam nrityamtam
    | kalam kalakalatitam kalitashesham kalidoshaghnam | kalatrayagatihetum pranamata govimdam paramanamdam
    || 7 || vrimdavanabhuvi vrimdarakaganavrindaradhyam vamde''ham | kumdabhamalamamdasmerasudhanamdam
    suhridanamdam | vamdyasheshamahamunimanasavamdyanamdapadadvamdvam | vamdyasheshagunabdhim pranamata
    govimdam paramanamdam || 8 || govimdashtakametadadhite govimdarpitaceta yo | govimdacyuta madhava
    vishno gokulanayaka krishneti | govimdanghrisarojadhyanasudhajaladhautasamastagho | govimdam paramanamdamritamamtahstham
    sa tamabhyeti || || iti shrimacchankaracaryaviracitam shrigovimdashtakam sampurnam'
  devanagari: ॥ गोविन्दाष्टकं ॥ सत्यं ज्ञानमनंतं नित्यमनाकाशं परमाकाशम् । गोष्ठप्राङ्गणरिङ्खणलोलमनायासं
    परमायासम् । मायाकल्पितनानाकारमनाकारं भुवनाकारम् । क्ष्माया नाथमनाथं प्रणमत गोविंदं परमानंदम् ॥ १ ॥
    मृत्स्नामत्सीहेति यशोदाताडनशैशव संत्रासम् । व्यदितवक्त्रालोकितलोकालोकचतुर्दशलोकालिम् । लोकत्रयपुरमूलस्तंभं
    लोकालोकमनालोकम् । लोकेशं परमेशं प्रणमत गोविंदं परमानंदम् ॥ २ ॥ त्रैविष्टपरिपुवीरघ्नं क्षितिभारघ्नं
    भवरोगघ्नम् । कैवल्यं नवनीताहारमनाहारं भुवनाहारम् । वैमल्यस्फुटचेतोवृत्तिविशेषाभासमनाभासम् । शैवं केवलशांतं
    प्रणमत गोविंदं परमानंदम् ॥ ३ ॥ गोपालं प्रभुलीलाविग्रहगोपालं कुलगोपालम् । गोपीखेलनगोवर्धनधृतिलीलालालितगोपालम्
    । गोभिर्निगदित गोविंदस्फुतनामानं बहुनामानम् । गोपीगोचरपथिकं प्रणमत गोविंदं परमानंदम् ॥ ४ ॥ गोपीमंडलगोष्ठिभेदं
    भेदावस्थमभेदाभम् । शश्वद्गोखुरनिर्घूतोद्धतधूलीधूसरसौभाग्यम् । श्रद्धाभक्तिगृहीतानंदमचिन्त्यं चिंतितसद्भावम्
    । चिंतामणिमहिमानं प्रणमत गोविंदं परमानंदम् ॥ ५ ॥ स्नानव्याकुलयोशिद्वस्त्रमुपादायागमुपारूढम् । व्यदित्संतिरथ
    दिग्वस्त्रा ह्युपुदातुमुपाकर्षंतम् । निर्धूतद्वयशोकविमोहं बुद्धं बुद्धेरंतस्थम् । सत्तामात्रशरीरं
    प्रणमत गोविंदं परमानंदम् ॥ ६ ॥ कांतं कारणकारणमादिमनादिं कालमनाभासम् । कालिंदीगतकालियशिरसि मुहुर्नृत्यंतं
    नृत्यंतम् । कालं कालकलातीतं कलिताशेषं कलिदोषघ्नम् । कालत्रयगतिहेतुं प्रणमत गोविंदं परमानंदम् ॥ ७ ॥
    वृंदावनभुवि वृंदारकगणवृन्दाराध्यं वंदेऽहम् । कुंदाभामलमंदस्मेरसुधानंदं सुहृदानंदम् । वंद्याशेषमहामुनिमानसवंद्यानंदपदद्वंद्वम्
    । वंद्याशेषगुणाब्धिं प्रणमत गोविंदं परमानंदम् ॥ ८ ॥ गोविंदाष्टकमेतदधीते गोविंदार्पितचेता यो । गोविंदाच्युत
    माधव विष्णो गोकुलनायक कृष्णेति । गोविंदाङ्घ्रिसरोजध्यानसुधाजलधौतसमस्ताघो । गोविंदं परमानंदामृतमंतःस्थं
    स तमभ्येति ॥ ॥ इति श्रीमच्छङ्कराचार्यविरचितं श्रीगोविंदाष्टकं संपूर्णम्
