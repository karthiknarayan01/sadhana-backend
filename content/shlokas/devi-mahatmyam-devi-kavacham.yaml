id: devi-mahatmyam-devi-kavacham
category: stotram
name:
  english: Devi Mahatmyam Devi Kavacham
content:
  english: om namashcandikayai nyasah asya shri candi kavacasya | brahma rishih | anushtup chandah | camunda
    devata | anganyasokta mataro bijam | navavarano mantrashaktih | digbandha devatah tatvam | shri jagadamba
    prityarthe saptashati pathangatvena jape viniyogah || om namashcandikayai markandeya uvaca | om yadguhyam
    paramam loke sarvarakshakaram nrinam | yanna kasyacidakhyatam tanme bruhi pitamaha || || brahmovaca
    | asti guhyatamam vipra sarvabhutopakarakam | devyastu kavacam punyam tacchrinushva mahamune || ||
    prathamam shailaputri ca dvitiyam brahmacarini | tritiyam candraghanteti kushmandeti caturthakam ||
    || pancamam skandamateti shashtham katyayaniti ca | saptamam kalaratriti mahagauriti cashtamam ||
    || navamam siddhidatri ca navadurgah prakirtitah | uktanyetani namani brahmanaiva mahatmana || ||
    agnina dahyamanastu shatrumadhye gato rane | vishame durgame caiva bhayartah sharanam gatah || ||
    na tesham jayate kincidashubham ranasankate | napadam tasya pashyami shokaduhkhabhayam na hi || ||
    yaistu bhaktya smrita nunam tesham vriddhih prajayate | ye tvam smaranti deveshi rakshase tannasamshayah
    || || pretasamstha tu camunda varahi mahishasana | aindri gajasamarudha vaishnavi garudasana || ||
    maheshvari vrisharudha kaumari shikhivahana | lakshmih padmasana devi padmahasta haripriya || || shvetarupadhara
    devi ishvari vrishavahana | brahmi hamsasamarudha sarvabharanabhushita || || ityeta matarah sarvah
    sarvayogasamanvitah | nanabharanashobhadhya nanaratnopashobhitah || || drishyante rathamarudha devyah
    krodhasamakulah | shankham cakram gadam shaktim halam ca musalayudham || || khetakam tomaram caiva
    parashum pashameva ca | kuntayudham trishulam ca sharngamayudhamuttamam || || daityanam dehanashaya
    bhaktanamabhayaya ca | dharayantyayudhanittham devanam ca hitaya vai || || namaste'stu maharaudre
    mahaghoraparakrame | mahabale mahotsahe mahabhayavinashini || || trahi mam devi dushprekshye shatrunam
    bhayavardhini | pracyam rakshatu mamaindri agneyyamagnidevata || || dakshine'vatu varahi nairrityam
    khadgadharini | praticyam varuni rakshedvayavyam mrigavahini || || udicyam patu kaumari aishanyam
    shuladharini | urdhvam brahmani me rakshedadhastadvaishnavi tatha || || evam dasha disho raksheccamunda
    shavavahana | jaya me cagratah patu vijaya patu prishthatah || || ajita vamaparshve tu dakshine caparajita
    | shikhamudyotini raksheduma murdhni vyavasthita || || maladhari lalate ca bhruvau rakshedyashasvini
    | trinetra ca bhruvormadhye yamaghanta ca nasike || || shankhini cakshushormadhye shrotrayordvaravasini
    | kapolau kalika rakshetkarnamule tu shankari || || nasikayam sugandha ca uttaroshthe ca carcika |
    adhare camritakala jihvayam ca sarasvati || || dantan rakshatu kaumari kanthadeshe tu candika | ghantikam
    citraghanta ca mahamaya ca taluke || || kamakshi cibukam rakshedvacam me sarvamangala | grivayam bhadrakali
    ca prishthavamshe dhanurdhari || || nilagriva bahih kanthe nalikam nalakubari | skandhayoh khadgini
    rakshedbahu me vajradharini || || hastayordandini rakshedambika cangulishu ca | nakhanchuleshvari
    rakshetkukshau rakshetkuleshvari || || stanau rakshenmahadevi manahshokavinashini | hridaye lalita
    devi udare shuladharini || || nabhau ca kamini rakshedguhyam guhyeshvari tatha | putana kamika medhram
    gude mahishavahini || || katyam bhagavati rakshejjanuni vindhyavasini | janghe mahabala rakshetsarvakamapradayini
    || || gulphayornarasimhi ca padaprishthe tu taijasi | padangulishu shri rakshetpadadhastalavasini
    || || nakhan damshtrakarali ca keshamshcaivordhvakeshini | romakupeshu kaumari tvacam vagishvari tatha
    || || raktamajjavasamamsanyasthimedamsi parvati | antrani kalaratrishca pittam ca mukuteshvari ||
    || padmavati padmakoshe kaphe cudamanistatha | jvalamukhi nakhajvalamabhedya sarvasandhishu || me
    rakshecchayam chatreshvari tatha | ahankaram mano buddhim rakshenme dharmadharini || || pranapanau
    tatha vyanamudanam ca samanakam | vajrahasta ca me rakshetpranam kalyanashobhana || || rase rupe ca
    gandhe ca shabde sparshe ca yogini | sattvam rajastamashcaiva rakshennarayani sada || || ayu rakshatu
    varahi dharmam rakshatu vaishnavi | yashah kirtim ca lakshmim ca dhanam vidyam ca cakrini || me rakshetpashunme
    raksha candike | putran rakshenmahalakshmirbharyam rakshatu bhairavi || || panthanam supatha rakshenmargam
    kshemakari tatha | rajadvare mahalakshmirvijaya sarvatah sthita || sthanam varjitam kavacena tu |
    tatsarvam raksha me devi || padamekam na gacchettu yadicchecchubhamatmanah | kavacenavrito nityam
    yatra yatraiva gacchati || || tatra tatrarthalabhashca vijayah sarvakamikah | yam yam cintayate kamam
    tam tam prapnoti nishcitam || || paramaishvaryamatulam prapsyate bhutale puman | nirbhayo jayate martyah
    sangrameshvaparajitah || || trailokye tu bhavetpujyah kavacenavritah puman | idam tu devyah kavacam
    devanamapi durlabham || || yah pathetprayato nityam trisandhyam shraddhayanvitah | daivikala bhavettasya
    trailokyeshvaparajitah | || jivedvarshashatam sagramapamrityuvivarjitah | nashyanti vyadhayah sarve
    lutavisphotakadayah || || sthavaram jangamam caiva kritrimam caiva yadvisham | abhicarani sarvani
    mantrayantrani bhutale || || bhucarah khecarashcaiva julajashcopadeshikah | sahaja kulaja mala dakini
    shakini tatha || || antarikshacara ghora dakinyashca mahabalah | grahabhutapishacashca yakshagandharvarakshasah
    || || brahmarakshasavetalah kushmanda bhairavadayah | nashyanti darshanattasya kavace hridi samsthite
    || || manonnatirbhavedrajnastejovriddhikaram param | yashasa vardhate so'pi kirtimanditabhutale ||
    || japetsaptashatim candim kritva tu kavacam pura | yavadbhumandalam dhatte sashailavanakananam ||
    || tavattishthati medinyam santatih putrapautriki | dehante paramam sthanam yatsurairapi durlabham
    || || prapnoti purusho nityam mahamayaprasadatah | labhate paramam rupam shivena saha modate || ||
    || iti varahapurane hariharabrahma viracitam devyah kavacam sampurnam ||
  devanagari: ॐ नमश्चण्डिकायै न्यासः अस्य श्री चण्डी कवचस्य । ब्रह्मा ऋषिः । अनुष्टुप् छन्दः । चामुण्डा
    देवता । अङ्गन्यासोक्त मातरो बीजम् । नवावरणो मन्त्रशक्तिः । दिग्बन्ध देवताः तत्वम् । श्री जगदम्बा प्रीत्यर्थे
    सप्तशती पाठाङ्गत्वेन जपे विनियोगः ॥ ॐ नमश्चण्डिकायै मार्कण्डेय उवाच । ॐ यद्गुह्यं परमं लोके सर्वरक्षाकरं
    नृणाम् । यन्न कस्यचिदाख्यातं तन्मे ब्रूहि पितामह ॥ ॥ ब्रह्मोवाच । अस्ति गुह्यतमं विप्र सर्वभूतोपकारकम्
    । देव्यास्तु कवचं पुण्यं तच्छृणुष्व महामुने ॥ ॥ प्रथमं शैलपुत्री च द्वितीयं ब्रह्मचारिणी । तृतीयं
    चन्द्रघण्टेति कूष्माण्डेति चतुर्थकम् ॥ ॥ पञ्चमं स्कन्दमातेति षष्ठं कात्यायनीति च । सप्तमं कालरात्रीति
    महागौरीति चाष्टमम् ॥ ॥ नवमं सिद्धिदात्री च नवदुर्गाः प्रकीर्तिताः । उक्तान्येतानि नामानि ब्रह्मणैव
    महात्मना ॥ ॥ अग्निना दह्यमानस्तु शत्रुमध्ये गतो रणे । विषमे दुर्गमे चैव भयार्ताः शरणं गताः ॥ ॥ न तेषां
    जायते किञ्चिदशुभं रणसङ्कटे । नापदं तस्य पश्यामि शोकदुःखभयं न हि ॥ ॥ यैस्तु भक्त्या स्मृता नूनं तेषां
    वृद्धिः प्रजायते । ये त्वां स्मरन्ति देवेशि रक्षसे तान्नसंशयः ॥ ॥ प्रेतसंस्था तु चामुण्डा वाराही महिषासना
    । ऐन्द्री गजसमारूढा वैष्णवी गरुडासना ॥ ॥ माहेश्वरी वृषारूढा कौमारी शिखिवाहना । लक्ष्मीः पद्मासना देवी
    पद्महस्ता हरिप्रिया ॥ ॥ श्वेतरूपधरा देवी ईश्वरी वृषवाहना । ब्राह्मी हंससमारूढा सर्वाभरणभूषिता ॥ ॥
    इत्येता मातरः सर्वाः सर्वयोगसमन्विताः । नानाभरणाशोभाढ्या नानारत्नोपशोभिताः ॥ ॥ दृश्यन्ते रथमारूढा
    देव्यः क्रोधसमाकुलाः । शङ्खं चक्रं गदां शक्तिं हलं च मुसलायुधम् ॥ ॥ खेटकं तोमरं चैव परशुं पाशमेव च
    । कुन्तायुधं त्रिशूलं च शार्ङ्गमायुधमुत्तमम् ॥ ॥ दैत्यानां देहनाशाय भक्तानामभयाय च । धारयन्त्यायुधानीत्थं
    देवानां च हिताय वै ॥ ॥ नमस्तेऽस्तु महारौद्रे महाघोरपराक्रमे । महाबले महोत्साहे महाभयविनाशिनि ॥ ॥ त्राहि
    मां देवि दुष्प्रेक्ष्ये शत्रूणां भयवर्धिनि । प्राच्यां रक्षतु मामैन्द्री आग्नेय्यामग्निदेवता ॥ ॥ दक्षिणेऽवतु
    वाराही नैरृत्यां खड्गधारिणी । प्रतीच्यां वारुणी रक्षेद्वायव्यां मृगवाहिनी ॥ ॥ उदीच्यां पातु कौमारी
    ऐशान्यां शूलधारिणी । ऊर्ध्वं ब्रह्माणी मे रक्षेदधस्ताद्वैष्णवी तथा ॥ ॥ एवं दश दिशो रक्षेच्चामुण्डा
    शववाहना । जया मे चाग्रतः पातु विजया पातु पृष्ठतः ॥ ॥ अजिता वामपार्श्वे तु दक्षिणे चापराजिता । शिखामुद्योतिनी
    रक्षेदुमा मूर्ध्नि व्यवस्थिता ॥ ॥ मालाधरी ललाटे च भ्रुवौ रक्षेद्यशस्विनी । त्रिनेत्रा च भ्रुवोर्मध्ये
    यमघण्टा च नासिके ॥ ॥ शङ्खिनी चक्षुषोर्मध्ये श्रोत्रयोर्द्वारवासिनी । कपोलौ कालिका रक्षेत्कर्णमूले
    तु शाङ्करी ॥ ॥ नासिकायां सुगन्धा च उत्तरोष्ठे च चर्चिका । अधरे चामृतकला जिह्वायां च सरस्वती ॥ ॥ दन्तान्
    रक्षतु कौमारी कण्ठदेशे तु चण्डिका । घण्टिकां चित्रघण्टा च महामाया च तालुके ॥ ॥ कामाक्षी चिबुकं रक्षेद्वाचं
    मे सर्वमङ्गला । ग्रीवायां भद्रकाली च पृष्ठवंशे धनुर्धरी ॥ ॥ नीलग्रीवा बहिः कण्ठे नलिकां नलकूबरी ।
    स्कन्धयोः खड्गिनी रक्षेद्बाहू मे वज्रधारिणी ॥ ॥ हस्तयोर्दण्डिनी रक्षेदम्बिका चाङ्गुलीषु च । नखाञ्छूलेश्वरी
    रक्षेत्कुक्षौ रक्षेत्कुलेश्वरी ॥ ॥ स्तनौ रक्षेन्महादेवी मनःशोकविनाशिनी । हृदये ललिता देवी उदरे शूलधारिणी
    ॥ ॥ नाभौ च कामिनी रक्षेद्गुह्यं गुह्येश्वरी तथा । पूतना कामिका मेढ्रं गुदे महिषवाहिनी ॥ ॥ कट्यां भगवती
    रक्षेज्जानुनी विन्ध्यवासिनी । जङ्घे महाबला रक्षेत्सर्वकामप्रदायिनी ॥ ॥ गुल्फयोर्नारसिंही च पादपृष्ठे
    तु तैजसी । पादाङ्गुलीषु श्री रक्षेत्पादाधस्तलवासिनी ॥ ॥ नखान् दंष्ट्रकराली च केशांश्चैवोर्ध्वकेशिनी
    । रोमकूपेषु कौमारी त्वचं वागीश्वरी तथा ॥ ॥ रक्तमज्जावसामांसान्यस्थिमेदांसि पार्वती । अन्त्राणि कालरात्रिश्च
    पित्तं च मुकुटेश्वरी ॥ ॥ पद्मावती पद्मकोशे कफे चूडामणिस्तथा । ज्वालामुखी नखज्वालामभेद्या सर्वसन्धिषु
    ॥ मे रक्षेच्छायां छत्रेश्वरी तथा । अहङ्कारं मनो बुद्धिं रक्षेन्मे धर्मधारिणी ॥ ॥ प्राणापानौ तथा व्यानमुदानं
    च समानकम् । वज्रहस्ता च मे रक्षेत्प्राणं कल्याणशोभना ॥ ॥ रसे रूपे च गन्धे च शब्दे स्पर्शे च योगिनी
    । सत्त्वं रजस्तमश्चैव रक्षेन्नारायणी सदा ॥ ॥ आयू रक्षतु वाराही धर्मं रक्षतु वैष्णवी । यशः कीर्तिं
    च लक्ष्मीं च धनं विद्यां च चक्रिणी ॥ मे रक्षेत्पशून्मे रक्ष चण्डिके । पुत्रान् रक्षेन्महालक्ष्मीर्भार्यां
    रक्षतु भैरवी ॥ ॥ पन्थानं सुपथा रक्षेन्मार्गं क्षेमकरी तथा । राजद्वारे महालक्ष्मीर्विजया सर्वतः स्थिता
    ॥ स्थानं वर्जितं कवचेन तु । तत्सर्वं रक्ष मे देवि ॥ पदमेकं न गच्छेत्तु यदीच्छेच्छुभमात्मनः । कवचेनावृतो
    नित्यं यत्र यत्रैव गच्छति ॥ ॥ तत्र तत्रार्थलाभश्च विजयः सार्वकामिकः । यं यं चिन्तयते कामं तं तं प्राप्नोति
    निश्चितम् ॥ ॥ परमैश्वर्यमतुलं प्राप्स्यते भूतले पुमान् । निर्भयो जायते मर्त्यः सङ्ग्रामेष्वपराजितः
    ॥ ॥ त्रैलोक्ये तु भवेत्पूज्यः कवचेनावृतः पुमान् । इदं तु देव्याः कवचं देवानामपि दुर्लभम् ॥ ॥ यः पठेत्प्रयतो
    नित्यं त्रिसन्ध्यं श्रद्धयान्वितः । दैवीकला भवेत्तस्य त्रैलोक्येष्वपराजितः । ॥ जीवेद्वर्षशतं साग्रमपमृत्युविवर्जितः
    । नश्यन्ति व्याधयः सर्वे लूताविस्फोटकादयः ॥ ॥ स्थावरं जङ्गमं चैव कृत्रिमं चैव यद्विषम् । अभिचाराणि
    सर्वाणि मन्त्रयन्त्राणि भूतले ॥ ॥ भूचराः खेचराश्चैव जुलजाश्चोपदेशिकाः । सहजा कुलजा माला डाकिनी शाकिनी
    तथा ॥ ॥ अन्तरिक्षचरा घोरा डाकिन्यश्च महाबलाः । ग्रहभूतपिशाचाश्च यक्षगन्धर्वराक्षसाः ॥ ॥ ब्रह्मराक्षसवेतालाः
    कूष्माण्डा भैरवादयः । नश्यन्ति दर्शनात्तस्य कवचे हृदि संस्थिते ॥ ॥ मानोन्नतिर्भवेद्राज्ञस्तेजोवृद्धिकरं
    परम् । यशसा वर्धते सोऽपि कीर्तिमण्डितभूतले ॥ ॥ जपेत्सप्तशतीं चण्डीं कृत्वा तु कवचं पुरा । यावद्भूमण्डलं
    धत्ते सशैलवनकाननम् ॥ ॥ तावत्तिष्ठति मेदिन्यां सन्ततिः पुत्रपौत्रिकी । देहान्ते परमं स्थानं यत्सुरैरपि
    दुर्लभम् ॥ ॥ प्राप्नोति पुरुषो नित्यं महामायाप्रसादतः । लभते परमं रूपं शिवेन सह मोदते ॥ ॥ ॥ इति वाराहपुराणे
    हरिहरब्रह्म विरचितं देव्याः कवचं सम्पूर्णम् ॥
