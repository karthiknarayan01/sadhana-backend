id: sri-bagalamukhi-kavacham
category: stotram
name:
  english: Sri Bagalamukhi Kavacham
content:
  english: kailasacalamadhyagam puravaham shantam trinetram shivam vamastha kavacam pranamya girija bhutipradam
    pricchati | devi shribagalamukhi ripukularanyagnirupa ca ya tasyashcapavimukta mantrasahitam pritya'dhuna
    bruhi mam || || shrishankara uvaca | devi shribhavavallabhe shrinu mahamantram vibhutipradam devya
    varmayutam samastasukhadam samrajyadam muktidam | taram rudravadhum virincimahila vishnupriya kamayu
    kkante shribagalanane mama ripunnashaya yugmantviti || || aishvaryani padam ca dehi yugalam shighram
    manovanchitam karyam sadhaya yugmayukchivavadhu vahnipriyanto manuh | kamsarestanayam ca bijamaparashaktishca
    vani tatha kilam shrimiti bhairavarshisahitam chando virat samyutam || || sveshtarthasya parasya vetti
    nitaram karyasya sampraptaye nanasadhyamahagadasya niyatannashaya viryaptaye | dhyatva shribagalananamanuvaram
    japtva sahasrakhyakam dirghaih shatkayutaishca rudramahilabijairvinyasyangake || || dhyanam | sauvarnasanasamsthitam
    trinayanam pitamshukolasinim hemabhangarucim shashankamukutam srakcampakasragyutam | hastairmadgarapashabaddharasanam
    sambibhratim bhushana vyaptangim bagalamukhim trijagatam samstambhinim cintaye || || viniyogah | om
    asya shribagalamukhi brahmastramantra kavacasya bhairava rishih virat chandah shribagalamukhi devata
    klim bijam aim shaktih shrim kilakam mama parasya ca manobhilashiteshtakaryasiddhaye viniyogah | rishyadinyasah
    | bhairava rishaye namah shirasi | virat chandase namah mukhe | shri bagalamukhi devatayai namah hridi
    | klim bijaya namah guhye | aim shaktaye namah padayoh | shrim kilakaya namah sarvange | karanyasah
    | om hram angushthabhyam namah | om hrim tarjanibhyam namah | om hrum madhyamabhyam namah | om hraim
    anamikabhyam namah | om hraum kanishthikabhyam namah | om hrah karatalakaraprishthabhyam namah | anganyasah
    | om hram hridayaya namah | om hrim shirase svaha | om hrum shikhayai vashat | om hraim kavacaya hum
    | om hraum netratrayaya vaushat | om hrah astraya phat | bhurbhuvassuvaromiti digbandhah | mantroddharah
    | om hrim aim shrim klim shribagalanane mama ripunnashaya nashaya mamaishvaryani dehi dehi shighram
    manovanchitakaryam sadhayah sadhayah hrim svaha | kavacam | shiro me patu om hrim aim shrim klim patu
    lalatakam | sambodhanapadam patu netre shribagalanane || || shrutau mama ripum patu nasikannashaya
    dvayam | patu gandau sada mamaishvaryanyam tam tu mastakam || || dehi dvandvam sada jihvam patu shighram
    vaco mama | kanthadesham manah patu vanchitam bahumulakam || || karyam sadhaya dvandvantu karau patu
    sada mama | mayayukta tatha svaha hridayam patu sarvada || || ashtadhikacatvarimshaddandadhya bagalamukhi
    | raksham karotu sarvatra grihe'ranye sada mama || || brahmastrakhyo manuh patu sarvange sarvasandhishu
    | mantrarajah sada raksham karotu mama sarvada || || om hrim patu nabhidesham katim me bagala'vatu
    | mukhi varnadvayam patu lingam me mushkayugmakam || || januni sarvadushtanam patu me varnapancakam
    | vacam mukham tatha padam shadvarna parameshvari || || janghayugme sada patu bagala ripumohini |
    stambhayeti padam prishtham patu varnatrayam mama || || jihvam varnadvayam patu gulphau me kilayeti
    ca | padordhvam sarvada patu buddhim padatale mama || || vinashaya padam patu padangulyornakhani me
    | hrim bijam sarvada patu buddhindriyavacamsi me || || sarvangam pranavah patu svaha romani me'vatu
    | brahmi purvadale patu cagneyam vishnuvallabha || || maheshi dakshine patu camunda rakshase'vatu
    | kaumari pashcime patu vayavye caparajita || || varahi cottare patu narasimhi shive'vatu | urdhvam
    patu mahalakshmih patale sharada'vatu || || ityashtau shaktayah pantu sayudhashca savahanah | rajadvare
    mahadurge patu mam gananayakah || || shmashane jalamadhye ca bhairavashca sada'vatu | dvibhuja raktavasanah
    sarvabharanabhushitah || || yoginyah sarvada patu maharanye sada mama | iti te kathitam devi kavacam
    paramadbhutam || || shrivishvavijayannama kirtishrivijayapradam | aputro labhate putram dhiram shuram
    shatayusham || || nirdhano dhanamapnoti kavacasyasya pathatah | japitva mantrarajam tu dhyatva shribagalamukhim
    || || pathedidam hi kavacam nishayam niyamattu yah | yadyatkamayate kamam sadhyasadhye mahitale ||
    || tattatkamamavapnoti saptaratrena shankari | gurum dhyatva suram pitva ratrau shaktisamanvitah ||
    || kavacam yah patheddevi tasya'sadhyam na kincana | yam dhyatva prajapenmantram sahasram kavacam
    pathet || || triratrena vasham yati mrityum tam natra samshayah | likhitva pratimam shatroh satalena
    haridraya || || likhitva hyadi tam nama tam dhyatva prajapenmanum | ekavimshaddinam yavatpratyaham
    ca sahasrakam || || japtva pathettu kavacam caturvimshativarakam | samstambham jayate shatrornatra
    karya vicarana || || vivade vijayam tasya sangrame jayamapnuyat | shmashane ca bhayam nasti kavacasya
    prabhavatah || || navanitam cabhimantrya strinam dadyanmaheshvari | vandhyayam jayate putro vidyabalasamanvitah
    || || shmashanangaramadaya bhaume ratrau shanavatha | padodakena sprishtva ca likhellohashalakaya
    || || bhumau shatroh svarupam ca hridi nama samalikhet | hastam taddhridaye datva kavacam tithivarakam
    || || dhyatva japenmantrarajam navaratram prayatnatah | mriyate jvaradahena dashame'hni na samshayah
    || || bhurjapatreshvidam stotramashtagandhena samlikhet | dharayeddakshine bahau nari vamabhuje tatha
    || || sangrame jayamapnoti nari putravati bhavet | brahmastradini shastrani naiva krintanti tam janam
    || || sampujya kavacam nityam pujayah phalamalabhet | brihaspatisamo vapi vibhave dhanadopamah ||
    || kamatulyashca narinam shatrunam ca yamopamah | kavitalahari tasya bhavedgangapravahavat || || gadyapadyamayi
    vani bhaveddeviprasadatah | ekadashashatam yavatpurashcaranamucyate || || purashcaryavihinam tu na
    cedam phaladayakam | na deyam parashishyebhyo dushtebhyashca visheshatah || || deyam shishyaya bhaktaya
    pancatvam ca'nyathapnuyat | idam kavacamajnatva bhajedyo bagalamukhim | shatakoti japitva tu tasya
    siddhirna jayate || || daradhyo manujosya lakshajapatah prapnoti siddhim param vidyam shrivijayam
    tatha suniyatam dhiram ca viram varam | brahmastrakhyamanum vilikhya nitaram bhurjeshtagandhena vai
    dhritva rajapuram vrajanti khalu ye daso'sti tesham nripah || || iti vishvasaroddharatantre parvatishvarasamvade
    bagalamukhikavacam sampurnam |
  devanagari: कैलासाचलमध्यगं पुरवहं शान्तं त्रिनेत्रं शिवं वामस्था कवचं प्रणम्य गिरिजा भूतिप्रदं पृच्छति
    । देवी श्रीबगलामुखी रिपुकुलारण्याग्निरूपा च या तस्याश्चापविमुक्त मन्त्रसहितं प्रीत्याऽधुना ब्रूहि
    माम् ॥ ॥ श्रीशङ्कर उवाच । देवी श्रीभववल्लभे शृणु महामन्त्रं विभूतिप्रदं देव्या वर्मयुतं समस्तसुखदं
    साम्राज्यदं मुक्तिदम् । तारं रुद्रवधूं विरिञ्चिमहिला विष्णुप्रिया कामयु क्कान्ते श्रीबगलानने मम रिपून्नाशाय
    युग्मन्त्विति ॥ ॥ ऐश्वर्याणि पदं च देहि युगलं शीघ्रं मनोवाञ्छितं कार्यं साधय युग्मयुक्छिववधू वह्निप्रियान्तो
    मनुः । कंसारेस्तनयं च बीजमपराशक्तिश्च वाणी तथा कीलं श्रीमिति भैरवर्षिसहितं छन्दो विराट् संयुतम् ॥
    ॥ स्वेष्टार्थस्य परस्य वेत्ति नितरां कार्यस्य सम्प्राप्तये नानासाध्यमहागदस्य नियतन्नाशाय वीर्याप्तये
    । ध्यात्वा श्रीबगलाननामनुवरं जप्त्वा सहस्राख्यकं दीर्घैः षट्कयुतैश्च रुद्रमहिलाबीजैर्विन्यास्याङ्गके
    ॥ ॥ ध्यानम् । सौवर्णासनसंस्थितां त्रिनयनां पीतांशुकोलासिनीं हेमाभाङ्गरुचिं शशाङ्कमुकुटां स्रक्चम्पकस्रग्युताम्
    । हस्तैर्मद्गरपाशबद्धरसनां सम्बिभ्रतीं भूषण व्याप्ताङ्गीं बगलामुखीं त्रिजगतां संस्तम्भिनीं चिन्तये
    ॥ ॥ विनियोगः । ॐ अस्य श्रीबगलामुखी ब्रह्मास्त्रमन्त्र कवचस्य भैरव ऋषिः विराट् छन्दः श्रीबगलामुखी देवता
    क्लीं बीजं ऐं शक्तिः श्रीं कीलकं मम परस्य च मनोभिलषितेष्टकार्यसिद्धये विनियोगः । ऋष्यादिन्यासः । भैरव
    ऋषये नमः शिरसि । विराट् छन्दसे नमः मुखे । श्री बगलामुखी देवतायै नमः हृदि । क्लीं बीजाय नमः गुह्ये
    । ऐं शक्तये नमः पादयोः । श्रीं कीलकाय नमः सर्वाङ्गे । करन्यासः । ॐ ह्रां अङ्गुष्ठाभ्यां नमः । ॐ ह्रीं
    तर्जनीभ्यां नमः । ॐ ह्रूं मध्यमाभ्यां नमः । ॐ ह्रैं अनामिकाभ्यां नमः । ॐ ह्रौं कनिष्ठिकाभ्यां नमः
    । ॐ ह्रः करतलकरपृष्ठाभ्यां नमः । अङ्गन्यासः । ॐ ह्रां हृदयाय नमः । ॐ ह्रीं शिरसे स्वाहा । ॐ ह्रूं
    शिखायै वषट् । ॐ ह्रैं कवचाय हुम् । ॐ ह्रौं नेत्रत्रयाय वौषट् । ॐ ह्रः अस्त्राय फट् । भूर्भुवस्सुवरोमिति
    दिग्बन्धः । मन्त्रोद्धारः । ॐ ह्रीं ऐं श्रीं क्लीं श्रीबगलानने मम रिपून्नाशय नाशय ममैश्वर्याणि देहि
    देहि शीघ्रं मनोवाञ्छितकार्यं साधयः साधयः ह्रीं स्वाहा । कवचम् । शिरो मे पातु ॐ ह्रीं ऐं श्रीं क्लीं
    पातु ललाटकम् । सम्बोधनपदं पातु नेत्रे श्रीबगलानने ॥ ॥ श्रुतौ मम रिपुं पातु नासिकान्नाशय द्वयम् । पातु
    गण्डौ सदा मामैश्वर्याण्यं तं तु मस्तकम् ॥ ॥ देहि द्वन्द्वं सदा जिह्वां पातु शीघ्रं वचो मम । कण्ठदेशं
    मनः पातु वाञ्छितं बाहुमूलकम् ॥ ॥ कार्यं साधय द्वन्द्वन्तु करौ पातु सदा मम । मायायुक्ता तथा स्वाहा
    हृदयं पातु सर्वदा ॥ ॥ अष्टाधिकचत्वारिंशद्दण्डाढ्या बगलामुखी । रक्षां करोतु सर्वत्र गृहेऽरण्ये सदा
    मम ॥ ॥ ब्रह्मास्त्राख्यो मनुः पातु सर्वाङ्गे सर्वसन्धिषु । मन्त्रराजः सदा रक्षां करोतु मम सर्वदा ॥
    ॥ ॐ ह्रीं पातु नाभिदेशं कटिं मे बगलाऽवतु । मुखी वर्णद्वयं पातु लिङ्गं मे मुष्कयुग्मकम् ॥ ॥ जानुनी
    सर्वदुष्टानां पातु मे वर्णपञ्चकम् । वाचं मुखं तथा पदं षड्वर्णा परमेश्वरी ॥ ॥ जङ्घायुग्मे सदा पातु
    बगला रिपुमोहिनी । स्तम्भयेति पदं पृष्ठं पातु वर्णत्रयं मम ॥ ॥ जिह्वां वर्णद्वयं पातु गुल्फौ मे कीलयेति
    च । पादोर्ध्वं सर्वदा पातु बुद्धिं पादतले मम ॥ ॥ विनाशय पदं पातु पादाङ्गुल्योर्नखानि मे । ह्रीं बीजं
    सर्वदा पातु बुद्धीन्द्रियवचांसि मे ॥ ॥ सर्वाङ्गं प्रणवः पातु स्वाहा रोमाणि मेऽवतु । ब्राह्मी पूर्वदले
    पातु चाग्नेयां विष्णुवल्लभा ॥ ॥ माहेशी दक्षिणे पातु चामुण्डा राक्षसेऽवतु । कौमारी पश्चिमे पातु वायव्ये
    चापराजिता ॥ ॥ वाराही चोत्तरे पातु नारसिंही शिवेऽवतु । ऊर्ध्वं पातु महालक्ष्मीः पाताले शारदाऽवतु ॥
    ॥ इत्यष्टौ शक्तयः पान्तु सायुधाश्च सवाहनाः । राजद्वारे महादुर्गे पातु मां गणनायकः ॥ ॥ श्मशाने जलमध्ये
    च भैरवश्च सदाऽवतु । द्विभुजा रक्तवसनाः सर्वाभरणभूषिताः ॥ ॥ योगिन्यः सर्वदा पातु महारण्ये सदा मम ।
    इति ते कथितं देवि कवचं परमाद्भुतम् ॥ ॥ श्रीविश्वविजयन्नाम कीर्तिश्रीविजयप्रदम् । अपुत्रो लभते पुत्रं
    धीरं शूरं शतायुषम् ॥ ॥ निर्धनो धनमाप्नोति कवचस्यास्य पाठतः । जपित्वा मन्त्रराजं तु ध्यात्वा श्रीबगलामुखीम्
    ॥ ॥ पठेदिदं हि कवचं निशायां नियमात्तु यः । यद्यत्कामयते कामं साध्यासाध्ये महीतले ॥ ॥ तत्तत्काममवाप्नोति
    सप्तरात्रेण शङ्करी । गुरुं ध्यात्वा सुरां पीत्वा रात्रौ शक्तिसमन्वितः ॥ ॥ कवचं यः पठेद्देवि तस्याऽसाध्यं
    न किञ्चन । यं ध्यात्वा प्रजपेन्मन्त्रं सहस्रं कवचं पठेत् ॥ ॥ त्रिरात्रेण वशं याति मृत्युं तं नात्र
    संशयः । लिखित्वा प्रतिमां शत्रोः सतालेन हरिद्रया ॥ ॥ लिखित्वा ह्यदि तं नाम तं ध्यात्वा प्रजपेन्मनुम्
    । एकविंशद्दिनं यावत्प्रत्यहं च सहस्रकम् ॥ ॥ जप्त्वा पठेत्तु कवचं चतुर्विंशतिवारकम् । संस्तम्भं जायते
    शत्रोर्नात्र कार्या विचारणा ॥ ॥ विवादे विजयं तस्य सङ्ग्रामे जयमाप्नुयात् । श्मशाने च भयं नास्ति कवचस्य
    प्रभावतः ॥ ॥ नवनीतं चाभिमन्त्र्य स्त्रीणां दद्यान्महेश्वरि । वन्ध्यायां जायते पुत्रो विद्याबलसमन्वितः
    ॥ ॥ श्मशानाङ्गारमादाय भौमे रात्रौ शनावथ । पादोदकेन स्पृष्ट्वा च लिखेल्लोहशलाकया ॥ ॥ भूमौ शत्रोः स्वरूपं
    च हृदि नाम समालिखेत् । हस्तं तद्धृदये दत्वा कवचं तिथिवारकम् ॥ ॥ ध्यात्वा जपेन्मन्त्रराजं नवरात्रं
    प्रयत्नतः । म्रियते ज्वरदाहेन दशमेऽह्नि न संशयः ॥ ॥ भूर्जपत्रेष्विदं स्तोत्रमष्टगन्धेन संलिखेत् ।
    धारयेद्दक्षिणे बाहौ नारी वामभुजे तथा ॥ ॥ सङ्ग्रामे जयमाप्नोति नारी पुत्रवती भवेत् । ब्रह्मास्त्रादीनि
    शस्त्राणि नैव कृन्तन्ति तं जनम् ॥ ॥ सम्पूज्य कवचं नित्यं पूजायाः फलमालभेत् । बृहस्पतिसमो वापि विभवे
    धनदोपमः ॥ ॥ कामतुल्यश्च नारीणां शत्रूणां च यमोपमः । कवितालहरी तस्य भवेद्गङ्गाप्रवाहवत् ॥ ॥ गद्यपद्यमयी
    वाणी भवेद्देवीप्रसादतः । एकादशशतं यावत्पुरश्चरणमुच्यते ॥ ॥ पुरश्चर्याविहीनं तु न चेदं फलदायकम् । न
    देयं परशिष्येभ्यो दुष्टेभ्यश्च विशेषतः ॥ ॥ देयं शिष्याय भक्ताय पञ्चत्वं चाऽन्यथाप्नुयात् । इदं कवचमज्ञात्वा
    भजेद्यो बगलामुखीम् । शतकोटि जपित्वा तु तस्य सिद्धिर्न जायते ॥ ॥ दाराढ्यो मनुजोस्य लक्षजपतः प्राप्नोति
    सिद्धिं परां विद्यां श्रीविजयं तथा सुनियतं धीरं च वीरं वरम् । ब्रह्मास्त्राख्यमनुं विलिख्य नितरां
    भूर्जेष्टगन्धेन वै धृत्वा राजपुरं व्रजन्ति खलु ये दासोऽस्ति तेषां नृपः ॥ ॥ इति विश्वसारोद्धारतन्त्रे
    पार्वतीश्वरसंवादे बगलामुखीकवचं सम्पूर्णम् ।
