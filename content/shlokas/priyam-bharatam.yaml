id: priyam-bharatam
category: stotram
name:
  english: Priyam Bharatam
  devanagari: प्रियं भारतम्
content:
  english: prakritya suramyam vishalam prakamam sarittaraharaih lalamam nikamam | himadrirlalate pade
    caiva sindhuh priyam bharatam sarvatha darshaniyam || 1|| beautiful necklace of rivers, vorth being
    sin| dhananam nidhanam dharayam pradhanam idam bharatam devalokena tulyam | yasho yasya shubhram videsheshu
    gitam priyam bharatam tat sada pujaniyam || 2|| desha is comparable to heavens, Whose glory is praised
    across the globe, dear Bharat desha aneke pradeshah aneke ca veshah anekani rupani bhasha anekah |
    param yatra sarve vayam bharatiyah priyam bharatam tat sada rakshaniyam || 3|| With different regions
    and different costumes, different appearance and different languages| here ve all are Bharatiya, that
    dear Bharat desha should alvays be protected| vayam bharatiyah svadesham namamah param dharmamekam
    sada manayamah | tadartham dhanam jivanam carpayama priyam bharatam me sada vandaniyam || 4|| We all
    Bhartiya salute to our country, and alvays think ve all are one, be alvays respected/ adored| kavivarya-
    daॅ| candrabhanu tripathi
  devanagari: प्रकृत्या सुरम्यं विशालं प्रकामं सरित्तारहारैः ललामं निकामम् । हिमाद्रिर्ललाटे पदे चैव सिन्धुः
    प्रियं भारतं सर्वथा दर्शनीयम् ॥ १॥ बेऔतिफ़ुल् नेच्क्लचे ओफ़् रिवेर्स्, वोर्थ् बेइन्ग् सीन्। धनानां निधानं
    धरायां प्रधानं इदं भारतं देवलोकेन तुल्यम् । यशो यस्य शुभ्रं विदेशेषु गीतं प्रियं भारतं तत् सदा पूजनीयम्
    ॥ २॥ देश इस् चोम्परब्ले तो हेअवेन्स्, Wहोसे ग्लोर्य् इस् प्रैसेद् अच्रोस्स् थे ग्लोबे, देअर् Bहरत्
    देश अनेके प्रदेशाः अनेके च वेषाः अनेकानि रुपाणि भाषा अनेकाः । परं यत्र सर्वे वयं भारतीयाः प्रियं भारतं
    तत् सदा रक्षणीयम् ॥ ३॥ Wइथ् दिफ़्फ़ेरेन्त् रेगिओन्स् अन्द् दिफ़्फ़ेरेन्त् चोस्तुमेस्, दिफ़्फ़ेरेन्त् अप्पेअरन्चे
    अन्द् दिफ़्फ़ेरेन्त् लन्गुअगेस्। ःएरे वे अल्ल् अरे Bहरतिय, थत् देअर् Bहरत् देश शोउल्द् अल्वय्स् बे प्रोतेच्तेद्।
    वयं भारतीयाः स्वदेशं नमामः परं धर्ममेकं सदा मानयामः । तदर्थं धनं जीवनं चार्पयाम प्रियं भारतं मे सदा
    वन्दनीयम् ॥ ४॥ Wए अल्ल् Bहर्तिय सलुते तो ओउर् चोउन्त्र्य्, अन्द् अल्वय्स् थिन्क् वे अल्ल् अरे ओने,
    बे अल्वय्स् रेस्पेच्तेद्/ अदोरेद्। कविवर्य- डाॅ। चन्द्रभानु त्रिपाठी
