    no bhavarnave| vitarka vici sankule || vivikta vasinah sada| bhajanti muktaye muda || nirasya indriyadikam|
    prayanti te gatim svakam || tamekamabhdutam prabhum| nirihamishvaram vibhum || jagadgurum ca shashvatam|
    turiyameva kevalam || bhajami bhava vallabham| kuyoginam sudurlabham || svabhakta kalpa padapam| samam
    susevyamanvaham || anupa rupa bhupatim| nato'hamurvija patim || prasida me namami te| padabja bhakti
    dehi me || pathanti ye stavam idam| naradarena te padam || vrajanti natra samshayam| tvadiya bhakti
    samyuta || do binati kari muni nai siru kaha kara jori bahori| carana saroruha natha jani kabahu~
    tajai mati mori || || anusuiya ke pada gahi sita| mili bahori susila binita || rishipatini mana sukha
    adhikai| asisha dei nikata baithai || dibya basana bhushana pahirae| je nita nutana amala suhae ||
    kaha rishibadhu sarasa mridu bani| naridharma kachu byaja bakhani || matu pita bhrata hitakari| mitaprada
    saba sunu rajakumari || amita dani bharta bayadehi| adhama so nari jo seva na tehi || dhiraja dharma
    mitra aru nari| apada kala parikhiahim cari || briddha rogabasa jara dhanahina| adham badhira krodhi
    ati dina || aisehu pati kara kie~ apamana| nari pava jamapura dukha nana || eki dharma eka brata nema|
    kaya~ bacana mana pati pada prema || jaga pati brata cari bidhi ahahim| beda purana santa saba kahahim
    || uttama ke asa basa mana mahim| sapanehu~ ana purusha jaga nahim || madhyama parapati dekhi kaisem|
    bhrata pita putra nija jaimsem || dharma bicari samujhi kula rahi| so nikishta triya shruti asa kahi
    || binu avasara bhaya tem raha joi| janehu adhama nari jaga soi || pati bancaka parapati rati kari|
    raurava naraka kalpa sata pari || chana sukha lagi janama sata koti| dukha na samujha tehi sama ko
    khoti || binu shrama nari parama gati lahi| patibrata dharma charai chala gahi || pati pratikula janama
    jaha~ jai| bidhava hoi pai tarunai || so sahaja apavani nari pati sevata subha gati lahi| jasu gavata
    shruti cari ajahu tulasika harihi priya || ka || sanu sita tava nama sumira nari patibrata karahi|
    tohi pranapriya rama kahiu~ katha samsara hita || kha || suni janakim parama sukhu pava| sadara tasu
    carana siru nava || taba muni sana kaha kripanidhana| ayasu hoi jau~ bana ana || santata mo para kripa
    karehu| sevaka jani tajehu jani nehu || dharma dhurandhara prabhu kai bani| suni saprema bole muni
    gyani || jasu kripa aja siva sanakadi| cahata sakala paramaratha badi || te tumha rama akama piare|
    dina bandhu mridu bacana ucare || aba jani maim shri caturai| bhaji tumhahi saba deva bihai || jehi
    samana atisaya nahim koi| ta kara sila kasa na asa hoi || kehi bidhi kahaum jahu aba svami| kahahu
    natha tumha antarajami || asa kahi prabhu biloki muni dhira| locana jala baha pulaka sarira || cham
    tana pulaka nirbhara prema purana nayana mukha pankaja die| mana gyana guna gotita prabhu maim dikha
    japa tapa ka kie || japa joga dharma samuha tem nara bhagati anupama pavi| radhubira carita punita
    nisi dina dasa tulasi gavi || do kalimala samana damana mana rama sujasa sukhamula| sadara sunahi
    je tinha para rama rahahim anukula || kathina kala mala kosa dharma na gyana na joga japa| parihari
    sakala bharosa ramahi bhajahim te catura nara || || muni pada kamala nai kari sisa| cale banahi sura
    nara muni isa || age rama anuja puni pachem| muni bara besha bane ati kachem || umaya bica shri sohi
    kaisi| brahma jiva bica maya jaisi || sarita bana giri avaghata ghata| pati pahicani dehim bara bata
    || jaha~ jaha~ jahi deva raghuraya| karahim medha taha~ taha~ nabha chaya || mila asura biradha maga
    jata| avatahim raghuvira nipata || turatahim rucira rupa tehim pava| dekhi dukhi nija dhama pathava
    || puni ae jaha~ muni sarabhanga| sundara anuja janaki sanga || do dekhi rama mukha pankaja munibara
    locana bhringa| sadara pana karata ati dhanya janma sarabhanga || || kaha muni sunu raghubira kripala|
    sankara manasa rajamarala || jata raheu~ biranci ke dhama| suneu~ shravana bana aihahim rama || citavata
    pantha raheu~ dina rati| aba prabhu dekhi juraani chati || natha sakala sadhana maim hina| kinhi kripa
    jani jana dina || so kachu deva na mohi nihora| nija pana rakheu jana mana cora || taba lagi rahahu
    dina hita lagi| jaba lagi milaum tumhahi tanu tyagi || joga jagya japa tapa brata kinha| prabhu kaha~
    dei bhagati bara linha || ehi bidhi sara raci muni sarabhanga| baithe hridaya~ charai saba sanga ||
    do sita anuja sameta prabhu nila jalada tanu syama| mama hiya~ basahu nirantara sagunarupa shrirama
    || || asa kahi joga agini tanu jara| rama kripa~ baikuntha sidhara || tate muni hari lina na bhayu|
    prathamahim bheda bhagati bara layu || rishi nikaya munibara gati dekhi| sukhi bhe nija hridaya~ biseshi
    || astuti karahim sakala muni brinda| jayati pranata hita karuna kanda || puni raghunatha cale bana
    age| munibara brinda bipula sa~ga lage || asthi samuha dekhi raghuraya| puchi muninha lagi ati daya
    || janatahu~ puchia kasa svami| sabadarasi tumha antarajami || nisicara nikara sakala muni khae| suni
    raghubira nayana jala chae || do nisicara hina karu~ mahi bhuja uthai pana kinha| sakala muninha ke
    ashramanhi jai jai sukha dinha || || muni agasti kara sishya sujana| nama sutichana rati bhagavana
    || mana krama bacana rama pada sevaka| sapanehu~ ana bharosa na devaka || prabhu agavanu shravana
    suni pava| karata manoratha atura dhava || he bidhi dinabandhu raghuraya| mo se satha para karihahim
    daya || sahita anuja mohi rama gosai| milihahim nija sevaka ki nai || more jiya~ bharosa drirha nahim|
    bhagati birati na gyana mana mahim || nahim satasanga joga japa jaga| nahim drirha carana kamala anuraga
    || eka bani karunanidhana ki| so priya jakem gati na ana ki || hoihaim suphala aju mama locana| dekhi
    badana pankaja bhava mocana || nirbhara prema magana muni gyani| kahi na jai so dasa bhavani || disi
    aru bidisi pantha nahim sujha| ko maim caleu~ kaha~ nahim bujha || kabahu~ka phiri pachem puni jai|
    kabahu~ka nritya kari guna gai || abirala prema bhagati muni pai| prabhu dekhaim taru ota lukai ||
    atisaya priti dekhi raghubira| pragate hridaya~ harana bhava bhira || muni maga majha acala hoi baisa|
    pulaka sarira panasa phala jaisa || taba raghunatha nikata cali ae| dekhi dasa nija jana mana bhae
    || munihi rama bahu bha~ti jagava| jaga na dhyanajanita sukha pava || bhupa rupa taba rama durava|
    hridaya~ caturbhuja rupa dekhava || muni akulai utha taba kaisem| bikala hina mani phani bara jaisem
    || agem dekhi rama tana syama| sita anuja sahita sukha dhama || pareu lakuta iva carananhi lagi| prema
    magana munibara barabhagi || bhuja bisala gahi lie uthai| parama priti rakhe ura lai || munihi milata
    asa soha kripala| kanaka taruhi janu bhenta tamala || rama badanu biloka muni tharhaa| manahu~ citra
    majha likhi karhaa || do taba muni hridaya~ dhira dhira gahi pada barahim bara| nija ashrama prabhu
    ani kari puja bibidha prakara || || kaha muni prabhu sunu binati mori| astuti karaum kavana bidhi
    tori || mahima amita mori mati thori| rabi sanmukha khadyota a~jori || shyama tamarasa dama shariram|
    jata mukuta paridhana municiram || pani capa shara kati tuniram| naumi nirantara shriraghuviram ||
    moha vipina ghana dahana krishanuh| santa saroruha kanana bhanuh || nishicara kari varutha mrigarajah|
    tratu sada no bhava khaga bajah || aruna nayana rajiva suvesham| sita nayana cakora nishesham || hara
    hradi manasa bala maralam| naumi rama ura bahu vishalam || samshaya sarpa grasana uragadah| shamana
    sukarkasha tarka vishadah || bhava bhanjana ranjana sura yuthah| tratu sada no kripa varuthah || nirguna
    saguna vishama sama rupam| jnana gira gotitamanupam || amalamakhilamanavadyamaparam| naumi rama bhanjana
    mahi bharam || bhakta kalpapadapa aramah| tarjana krodha lobha mada kamah || ati nagara bhava sagara
    setuh| tratu sada dinakara kula ketuh || atulita bhuja pratapa bala dhamah| kali mala vipula vibhanjana
    namah || dharma varma narmada guna gramah| santata sham tanotu mama ramah || jadapi biraja byapaka
    abinasi| saba ke hridaya~ nirantara basi || tadapi anuja shri sahita kharari| basatu manasi mama kananacari
    || je janahim te janahu~ svami| saguna aguna ura antarajami || jo kosala pati rajiva nayana| karu
    so rama hridaya mama ayana| asa abhimana jai jani bhore| maim sevaka raghupati pati more || suni muni
    bacana rama mana bhae| bahuri harashi munibara ura lae || parama prasanna janu muni mohi| jo bara
    magahu deu so tohi || muni kaha mai bara kabahu~ na jaca| samujhi na pari jhutha ka saca || tumhahi
    nika lagai raghurai| so mohi dehu dasa sukhadai || abirala bhagati birati bigyana| hohu sakala guna
    gyana nidhana || prabhu jo dinha so baru maim pava| aba so dehu mohi jo bhava || do anuja janaki sahita
    prabhu capa bana dhara rama| mama hiya gagana indu iva basahu sada nihakama || || evamastu kari ramanivasa|
    harashi cale kubhanja rishi pasa || bahuta divasa gura darasana pae~| bhe mohi ehim ashrama ae~ ||
    aba prabhu sanga jau~ gura pahim| tumha kaha~ natha nihora nahim || dekhi kripanidhi muni caturai|
    lie sanga bihasai dvau bhai || pantha kahata nija bhagati anupa| muni ashrama pahu~ce surabhupa ||
    turata sutichana gura pahim gayu| kari dandavata kahata asa bhayu || natha kausaladhisa kumara| ae
    milana jagata adhara || rama anuja sameta baidehi| nisi dinu deva japata hahu jehi || sunata agasti
    turata uthi dhae| hari biloki locana jala chae || muni pada kamala pare dvau bhai| rishi ati priti
    lie ura lai || sadara kusala puchi muni gyani| asana bara baithare ani || puni kari bahu prakara prabhu
    puja| mohi sama bhagyavanta nahim duja || jaha~ lagi rahe apara muni brinda| harashe saba biloki sukhakanda
    || do muni samuha maha~ baithe sanmukha saba ki ora| sarada indu tana citavata manahu~ nikara cakora
    || || taba raghubira kaha muni pahim| tumha sana prabhu durava kachu nahi || tumha janahu jehi karana
    ayu~| tate tata na kahi samujhayu~ || aba so mantra dehu prabhu mohi| jehi prakara maraum munidrohi
    || muni musakane suni prabhu bani| puchehu natha mohi ka jani || tumharei~ bhajana prabhava aghari|
    janu~ mahima kachuka tumhari || umari taru bisala tava maya| phala brahmanda aneka nikaya || jiva
    caracara jantu samana| bhitara basahi na janahim ana || te phala bhacchaka kathina karala| tava bhaya~
    darata sada sau kala || te tumha sakala lokapati saim| pu~chehu mohi manuja ki naim || yaha bara magu~
    kripaniketa| basahu hridaya~ shri anuja sameta || abirala bhagati birati satasanga| carana saroruha
    priti abhanga || jadyapi brahma akhanda ananta| anubhava gamya bhajahim jehi santa || asa tava rupa
    bakhanu~ janu~| phiri phiri saguna brahma rati manu~ || santata dasanha dehu baraai| tatem mohi pu~chehu
    raghurai || hai prabhu parama manohara th ~| pavana pancabati tehi n ~ || dandaka bana punita prabhu
    karahu| ugra sapa munibara kara harahu || basa karahu taha~ raghukula raya| kije sakala muninha para
    daya || cale rama muni ayasu pai| turatahim pancabati niarai || do gidharaja saim bhainta bhi bahu
    bidhi priti barhaai || godavari nikata prabhu rahe parana griha chai || || jaba te rama kinha taha~
    basa| sukhi bhe muni biti trasa || giri bana nadim tala chabi chae| dina dina prati ati hauhim suhae
    || khaga mriga brinda anandita rahahim| madhupa madhura ganjata chabi lahahim || so bana barani na
    saka ahiraja| jaha~ pragata raghubira biraja || eka bara prabhu sukha asina| lachimana bacana kahe
    chalahina || sura nara muni sacaracara saim| maim puchu~ nija prabhu ki nai || mohi samujhai kahahu
    soi deva| saba taji karaum carana raja seva || kahahu gyana biraga aru maya| kahahu so bhagati karahu
    jehim daya || do isvara jiva bheda prabhu sakala kahau samujhai || jatem hoi carana rati soka moha
    bhrama jai || || thorehi maha~ saba kahu~ bujhai| sunahu tata mati mana cita lai || maim aru mora
    tora taim maya| jehim basa kinhe jiva nikaya || go gocara jaha~ lagi mana jai| so saba maya janehu
    bhai || tehi kara bheda sunahu tumha sou| bidya apara abidya dou || eka dushta atisaya dukharupa|
    ja basa jiva para bhavakupa || eka raci jaga guna basa jakem| prabhu prerita nahim nija bala takem
    || gyana mana jaha~ eku nahim| dekha brahma samana saba mahi || kahia tata so parama biragi| trina
    sama siddhi tini guna tyagi || do maya isa na apu kahu~ jana kahia so jiva| bandha moccha prada sarbapara
    maya preraka siva || || dharma tem birati joga tem gyana| gyana mocchaprada beda bakhana || jatem
    begi dravu~ maim bhai| so mama bhagati bhagata sukhadai || so sutantra avalamba na ana| tehi adhina
    gyana bigyana || bhagati tata anupama sukhamula| mili jo santa hoi~ anukula || bhagati ki sadhana
    kahu~ bakhani| sugama pantha mohi pavahim prani || prathamahim bipra carana ati priti| nija nija karma
    nirata shruti riti || ehi kara phala puni bishaya biraga| taba mama dharma upaja anuraga || shravanadika
    nava bhakti drirhaahim| mama lila rati ati mana mahim || santa carana pankaja ati prema| mana krama
    bacana bhajana drirha nema || guru pitu matu bandhu pati deva| saba mohi kaha~ jane drirha seva ||
    mama guna gavata pulaka sarira| gadagada gira nayana baha nira || kama adi mada dambha na jakem| tata
    nirantara basa maim takem || do bacana karma mana mori gati bhajanu karahim nihkama || tinha ke hridaya
    kamala mahu~ karu~ sada bishrama || || bhagati joga suni ati sukha pava| lachimana prabhu carananhi
    siru nava || ehi bidhi ge kachuka dina biti| kahata biraga gyana guna niti || supanakha ravana kai
    bahini| dushta hridaya daruna jasa ahini || pancabati so gi eka bara| dekhi bikala bhi jugala kumara
    || bhrata pita putra uragari| purusha manohara nirakhata nari || hoi bikala saka manahi na roki| jimi
    rabimani drava rabihi biloki || rucira rupa dhari prabhu pahim jai| boli bacana bahuta musukai ||
    tumha sama purusha na mo sama nari| yaha sa~joga bidhi raca bicari || mama anurupa purusha jaga mahim|
    dekheu~ khoji loka tihu nahim || tate aba lagi rahiu~ kumari| manu mana kachu tumhahi nihari || sitahi
    citi kahi prabhu bata| ahi kuara mora laghu bhrata || gi lachimana ripu bhagini jani| prabhu biloki
    bole mridu bani || sundari sunu maim unha kara dasa| paradhina nahim tora supasa || prabhu samartha
    kosalapura raja| jo kachu karahim unahi saba chaja || sevaka sukha caha mana bhikhari| byasani dhana
    subha gati bibhicari || lobhi jasu caha cara gumani| nabha duhi dudha cahata e prani || puni phiri
    rama nikata so ai| prabhu lachimana pahim bahuri pathai || lachimana kaha tohi so bari| jo trina tori
    laja parihari || taba khisiani rama pahim gi| rupa bhayankara pragatata bhi || sitahi sabhaya dekhi
    raghurai| kaha anuja sana sayana bujhai || do lachimana ati laghava~ so naka kana binu kinhi| take
    kara ravana kaha~ manau cunauti dinhi || || naka kana binu bhi bikarara| janu strava saila gairu kai
    dhara || khara dushana pahim gi bilapata| dhiga dhiga tava paurusha bala bhrata || tehi pucha saba
    kahesi bujhai| jatudhana suni sena banai || dhae nisicara nikara barutha| janu sapaccha kajjala giri
    jutha || nana bahana nanakara| nanayudha dhara ghora apara || supanakha agem kari lini| asubha rupa
    shruti nasa hini || asaguna amita hohim bhayakari| ganahim na mrityu bibasa saba jhari || garjahi
    tarjahim gagana uraahim| dekhi kataku bhata ati harashahim || kau kaha jiata dharahu dvau bhai| dhari
    marahu tiya lehu charaai || dhuri puri nabha mandala raha| rama bolai anuja sana kaha || lai janakihi
    jahu giri kandara| ava nisicara kataku bhayankara || rahehu sajaga suni prabhu kai bani| cale sahita
    shri sara dhanu pani || dekhi rama ripudala cali ava| bihasi kathina kodanda carhaava || cham kodanda
    kathina carhaai sira jata juta ba~dhata soha kyom| marakata sayala para larata damini koti som juga
    bhujaga jyom || kati kasi nishanga bisala bhuja gahi capa bisikha sudhari kai || citavata manahu~
    mrigaraja prabhu gajaraja ghata nihari kai || so ai ge bagamela dharahu dharahu dhavata subhata| jatha
    biloki akela bala rabihi gherata danuja || || prabhu biloki sara sakahim na dari| thakita bhi rajanicara
    dhari || saciva boli bole khara dushana| yaha kau nripabalaka nara bhushana || naga asura sura nara
    muni jete| dekhe jite hate hama kete || hama bhari janma sunahu saba bhai| dekhi nahim asi sundaratai
    || jadyapi bhagini kinha kurupa| badha layaka nahim purusha anupa || dehu turata nija nari durai|
    jiata bhavana jahu dvau bhai || mora kaha tumha tahi sunavahu| tasu bacana suni atura avahu || dutanha
    kaha rama sana jai| sunata rama bole musakai || hama chatri mrigaya bana karahim| tumha se khala mriga
    khaujata phirahim || ripu balavanta dekhi nahim darahim| eka bara kalahu sana larahim || jadyapi manuja
    danuja kula ghalaka| muni palaka khala salaka balaka || jaum na hoi bala ghara phiri jahu| samara
    bimukha maim hatu~ na kahu || rana carhai karia kapata caturai| ripu para kripa parama kadarai ||
    dutanha jai turata saba kaheu| suni khara dushana ura ati daheu || cham ura daheu kaheu ki dharahu
    dhae bikata bhata rajanicara| sara capa tomara sakti sula kripana parigha parasu dhara || prabhu kinha
    dhanusha takora prathama kathora ghora bhayavaha| bhe badhira byakula jatudhana na gyana tehi avasara
    raha || do savadhana hoi dhae jani sabala arati| lage barashana rama para astra sastra bahu bha~ti
    || || tinha ke ayudha tila sama kari kate raghubira| tani sarasana shravana lagi puni cha~rae nija
    tira || taba cale jana babana karala| phunkarata janu bahu byala || kopeu samara shrirama| cale bisikha
    nisita nikama || avaloki kharatara tira| muri cale nisicara bira || bhe kruddha tiniu bhai| jo bhagi
    rana te jai || tehi badhaba hama nija pani| phire marana mana mahu~ thani || ayudha aneka prakara|
    sanamukha te karahim prahara || ripu parama kope jani| prabhu dhanusha sara sandhani || cha~rae bipula
    naraca| lage katana bikata pisaca || ura sisa bhuja kara carana| jaha~ taha~ lage mahi parana || cikkarata
    lagata bana| dhara parata kudhara samana || bhata katata tana sata khanda| puni uthata kari pashanda
    || nabha urata bahu bhuja munda| binu mauli dhavata runda || khaga kanka kaka srigala| katakatahim
    kathina karala || cham katakatahim zambuka bhuta preta pisaca kharpara sancahim| betala bira kapala
    tala bajai jogini nancahim || raghubira bana pracanda khandahim bhatanha ke ura bhuja sira| jaha~
    taha~ parahim uthi larahim dhara dharu dharu karahim bhayakara gira || antavarim gahi urata gidha
    pisaca kara gahi dhavahim || sangrama pura basi manahu~ bahu bala gurai uraavahim || mare pachare
    ura bidare bipula bhata kaha~rata pare| avaloki nija dala bikala bhata tisiradi khara dushana phire
    || sara sakti tomara parasu sula kripana ekahi barahim| kari kopa shriraghubira para aganita nisacara
    darahim || prabhu nimisha mahu~ ripu sara nivari pacari dare sayaka| dasa dasa bisikha ura majha mare
    sakala nisicara nayaka || mahi parata uthi bhata bhirata marata na karata maya ati ghani| sura darata
    caudaha sahasa preta biloki eka avadha dhani || sura muni sabhaya prabhu dekhi mayanatha ati kautuka
    kar yo| dekhahi parasapara rama kari sangrama ripudala lari mar yo || do rama rama kahi tanu tajahim
    pavahim pada nirbana| kari upaya ripu mare chana mahu~ kripanidhana || || harashita barashahim sumana
    sura bajahim gagana nisana| astuti kari kari saba cale sobhita bibidha bimana || || jaba raghunatha
    samara ripu jite| sura nara muni saba ke bhaya bite || taba lachimana sitahi lai ae| prabhu pada parata
    harashi ura lae| sita citava syama mridu gata| parama prema locana na aghata || pancavatim basi shriraghunayaka|
    karata carita sura muni sukhadayaka || dhua~ dekhi kharadushana kera| jai supanakha~ ravana prera
    || boli bacana krodha kari bhari| desa kosa kai surati bisari || karasi pana sovasi dinu rati| sudhi
    nahim tava sira para arati || raja niti binu dhana binu dharma| harihi samarpe binu satakarma || bidya
    binu bibeka upajae~| shrama phala parhae kie~ aru pae~ || sanga te jati kumantra te raja| mana te
    gyana pana tem laja || priti pranaya binu mada te guni| nasahi begi niti asa suni || so ripu ruja
    pavaka papa prabhu ahi gania na chota kari| asa kahi bibidha bilapa kari lagi rodana karana || sabha
    majha pari byakula bahu prakara kaha roi| tohi jiata dasakandhara mori ki asi gati hoi || || sunata
    sabhasada uthe akulai| samujhai gahi baha~ uthai || kaha lankesa kahasi nija bata| ke~i~ tava nasa
    kana nipata || avadha nripati dasaratha ke jae| purusha singha bana khelana ae || samujhi pari mohi
    unha kai karani| rahita nisacara karihahim dharani || jinha kara bhujabala pai dasanana| abhaya bhe
    bicarata muni kanana || dekhata balaka kala samana| parama dhira dhanvi guna nana || atulita bala
    pratapa dvau bhrata| khala badha rata sura muni sukhadata || sobhadhama rama asa nama| tinha ke sanga
    nari eka syama || rupa rasi bidhi nari sa~vari| rati sata koti tasu balihari || tasu anuja kate shruti
    nasa| suni tava bhagini karahim parihasa || khara dushana suni lage pukara| chana mahu~ sakala kataka
    unha mara || khara dushana tisira kara ghata| suni dasasisa jare saba gata || do supanakhahi samujhai
    kari bala bolesi bahu bha~ti| gayu bhavana ati socabasa nida pari nahim rati || || sura nara asura
    naga khaga mahim| more anucara kaha~ kau nahim || khara dushana mohi sama balavanta| tinhahi ko mari
    binu bhagavanta || sura ranjana bhanjana mahi bhara| jaum bhagavanta linha avatara || tau mai jai
    bairu hathi karu~| prabhu sara prana tajem bhava taru~ || hoihi bhajanu na tamasa deha| mana krama
    bacana mantra drirha eha || jaum nararupa bhupasuta kou| harihu~ nari jiti rana dou || cala akela
    jana cadhi tahava~| basa marica sindhu tata jahava~ || iha~ rama jasi juguti banai| sunahu uma so
    katha suhai || do lachimana ge banahim jaba lena mula phala kanda| janakasuta sana bole bihasi kripa
    sukha brinda || || sunahu priya brata rucira susila| maim kachu karabi lalita naralila || tumha pavaka
    mahu~ karahu nivasa| jau lagi karaum nisacara nasa || jabahim rama saba kaha bakhani| prabhu pada
    dhari hiya~ anala samani || nija pratibimba rakhi taha~ sita| taisi sila rupa subinita || lachimanahu~
    yaha maramu na jana| jo kachu carita raca bhagavana || dasamukha gayu jaha~ marica| nai matha svaratha
    rata nica || navani nica kai ati dukhadai| jimi ankusa dhanu uraga bilai || bhayadayaka khala kai
    priya bani| jimi akala ke kusuma bhavani || do kari puja marica taba sadara puchi bata| kavana hetu
    mana byagra ati akasara ayahu tata || || dasamukha sakala katha tehi agem| kahi sahita abhimana abhagem
    || hohu kapata mriga tumha chalakari| jehi bidhi hari anau nripanari || tehim puni kaha sunahu dasasisa|
    te nararupa caracara isa || tasom tata bayaru nahim kije| marem maria jiae~ jijai || muni makha rakhana
    gayu kumara| binu phara sara raghupati mohi mara || sata jojana ayu~ chana mahim| tinha sana bayaru
    kie~ bhala nahim || bhi mama kita bhringa ki nai| jaha~ taha~ maim dekhu~ dau bhai || jaum nara tata
    tadapi ati sura| tinhahi birodhi na aihi pura || do jehim taraka subahu hati khandeu hara kodanda
    || khara dushana tisira badheu manuja ki asa baribanda || || jahu bhavana kula kusala bicari| sunata
    jara dinhisi bahu gari || guru jimi murha karasi mama bodha| kahu jaga mohi samana ko jodha || taba
    marica hridaya~ anumana| navahi birodhem nahim kalyana || sastri marmi prabhu satha dhani| baida bandi
    kabi bhanasa guni || ubhaya bha~ti dekha nija marana| taba takisi raghunayaka sarana || utaru deta
    mohi badhaba abhagem| kasa na maraum raghupati sara lagem || asa jiya~ jani dasanana sanga| cala rama
    pada prema abhanga || mana ati harasha janava na tehi| aju dekhihu~ parama sanehi || cham nija parama
    pritama dekhi locana suphala kari sukha paihaum| shri sahita anuja sameta kripaniketa pada mana laihaum
    || nirbana dayaka krodha ja kara bhagati abasahi basakari| nija pani sara sandhani so mohi badhihi
    sukhasagara hari || do mama pachem dhara dhavata dharem sarasana bana| phiri phiri prabhuhi bilokihu~
    dhanya na mo sama ana || || tehi bana nikata dasanana gayu| taba marica kapatamriga bhayu || ati bicitra
    kachu barani na jai| kanaka deha mani racita banai || sita parama rucira mriga dekha| anga anga sumanohara
    besha || sunahu deva raghubira kripala| ehi mriga kara ati sundara chala || satyasandha prabhu badhi
    kari ehi| anahu carma kahati baidehi || taba raghupati janata saba karana| uthe harashi sura kaju
    sa~varana || mriga biloki kati parikara ba~dha| karatala capa rucira sara sa~dha || prabhu lachimanihi
    kaha samujhai| phirata bipina nisicara bahu bhai || sita keri karehu rakhavari| budhi bibeka bala
    samaya bicari || prabhuhi biloki cala mriga bhaji| dhae ramu sarasana saji || nigama neti siva dhyana
    na pava| mayamriga pachem so dhava || kabahu~ nikata puni duri parai| kabahu~ka pragati kabahu~ chapai
    || pragatata durata karata chala bhuri| ehi bidhi prabhuhi gayu lai duri || taba taki rama kathina
    sara mara| dharani pareu kari ghora pukara || lachimana kara prathamahim lai nama| pachem sumiresi
    mana mahu~ rama || prana tajata pragatesi nija deha| sumiresi ramu sameta saneha || antara prema tasu
    pahicana| muni durlabha gati dinhi sujana || do bipula sumana sura barashahim gavahim prabhu guna
    gatha| nija pada dinha asura kahu~ dinabandhu raghunatha || || khala badhi turata phire raghubira|
    soha capa kara kati tunira || arata gira suni jaba sita| kaha lachimana sana parama sabhita || jahu
    begi sankata ati bhrata| lachimana bihasi kaha sunu mata || bhrikuti bilasa srishti laya hoi| sapanehu~
    sankata pari ki soi || marama bacana jaba sita bola| hari prerita lachimana mana dola || bana disi
    deva saumpi saba kahu| cale jaha~ ravana sasi rahu || suna bica dasakandhara dekha| ava nikata jati
    kem besha || jakem dara sura asura derahim| nisi na nida dina anna na khahim || so dasasisa svana
    ki nai| ita uta citi cala bharaihai || imi kupantha paga deta khagesa| raha na teja budhi bala lesa
    || nana bidhi kari katha suhai| rajaniti bhaya priti dekhai || kaha sita sunu jati gosaim| bolehu
    bacana dushta ki naim || taba ravana nija rupa dekhava| bhi sabhaya jaba nama sunava || kaha sita
    dhari dhiraju garhaa| ai gayu prabhu rahu khala tharhaa || jimi haribadhuhi chudra sasa caha| bhesi
    kalabasa nisicara naha || sunata bacana dasasisa risana| mana mahu~ carana bandi sukha mana || do
    krodhavanta taba ravana linhisi ratha baithai| cala gaganapatha atura bhaya~ ratha ha~ki na jai ||
    || ha jaga eka bira raghuraya| kehim aparadha bisarehu daya || arati harana sarana sukhadayaka| ha
    raghukula saroja dinanayaka || ha lachimana tumhara nahim dosa| so phalu payu~ kinheu~ rosa || bibidha
    bilapa karati baidehi| bhuri kripa prabhu duri sanehi || bipati mori ko prabhuhi sunava| purodasa
    caha rasabha khava || sita kai bilapa suni bhari| bhe caracara jiva dukhari || gidharaja suni arata
    bani| raghukulatilaka nari pahicani || adhama nisacara linhe jai| jimi malecha basa kapila gai ||
    site putri karasi jani trasa| karihu~ jatudhana kara nasa || dhava krodhavanta khaga kaisem| chuti
    pabi parabata kahu~ jaise || re re dushta tharha kina hohi| nirbhaya calesi na janehi mohi || avata
    dekhi kritanta samana| phiri dasakandhara kara anumana || ki mainaka ki khagapati hoi| mama bala jana
    sahita pati soi || jana jaratha jatayu eha| mama kara tiratha cha~raihi deha || sunata gidha krodhatura
    dhava| kaha sunu ravana mora sikhava || taji janakihi kusala griha jahu| nahim ta asa hoihi bahubahu
    || rama rosha pavaka ati ghora| hoihi sakala salabha kula tora || utaru na deta dasanana jodha| tabahim
    gidha dhava kari krodha || dhari kaca biratha kinha mahi gira| sitahi rakhi gidha puni phira || caucanha
    mari bidaresi dehi| danda eka bhi murucha tehi || taba sakrodha nisicara khisiana| karhaesi parama
    karala kripana || katesi pankha para khaga dharani| sumiri rama kari adabhuta karani || sitahi jani
    carhaai bahori| cala utaila trasa na thori || karati bilapa jati nabha sita| byadha bibasa janu mrigi
    sabhita || giri para baithe kapinha nihari| kahi hari nama dinha pata dari || ehi bidhi sitahi so
    lai gayu| bana asoka maha~ rakhata bhayu || do hari para khala bahu bidhi bhaya aru priti dekhai|
    taba asoka padapa tara rakhisi jatana karai || chatha vishrama jehi bidhi kapata kuranga sa~ga dhai
    cale shrirama| so chabi sita rakhi ura ratati rahati harinama || || raghupati anujahi avata dekhi|
    bahija cinta kinhi biseshi || janakasuta pariharihu akeli| ayahu tata bacana mama peli || nisicara
    nikara phirahim bana mahim| mama mana sita ashrama nahim || gahi pada kamala anuja kara jori| kaheu
    natha kachu mohi na khori || anuja sameta ge prabhu tahava~| godavari tata ashrama jahava~ || ashrama
    dekhi janaki hina| bhe bikala jasa prakrita dina || ha guna khani janaki sita| rupa sila brata nema
    punita || lachimana samujhae bahu bha~ti| puchata cale lata taru pa~ti || he khaga mriga he madhukara
    shreni| tumha dekhi sita mriganaini || khanjana suka kapota mriga mina| madhupa nikara kokila prabina
    || kunda kali daraima damini| kamala sarada sasi ahibhamini || baruna pasa manoja dhanu hamsa| gaja
    kehari nija sunata prasamsa || shriphala kanaka kadali harashahim| neku na sanka sakuca mana mahim
    || sunu janaki tohi binu aju| harashe sakala pai janu raju || kimi sahi jata anakha tohi pahim | priya
    begi pragatasi kasa nahim || ehi bidhi khaujata bilapata svami| manahu~ maha birahi ati kami || puranakama
    rama sukha rasi| manuja carita kara aja abinasi || age para gidhapati dekha| sumirata rama carana
    jinha rekha || do kara saroja sira paraseu kripasindhu radhubira || nirakhi rama chabi dhama mukha
    bigata bhi saba pira || || taba kaha gidha bacana dhari dhira | sunahu rama bhanjana bhava bhira ||
    natha dasanana yaha gati kinhi| tehi khala janakasuta hari linhi || lai dacchina disi gayu gosai|
    bilapati ati kurari ki nai || darasa lagi prabhu rakhemu~ prana| calana cahata aba kripanidhana ||
    rama kaha tanu rakhahu tata| mukha musakai kahi tehim bata || ja kara nama marata mukha ava| adhamu
    mukuta hoi shruti gava || so mama locana gocara agem| rakhaum deha natha kehi kha~ge~ || jala bhari
    nayana kahahi~ raghurai| tata karma nija te gatim pai || parahita basa jinha ke mana mahi~| tinha
    kahu~ jaga durlabha kachu nahi~ || tanu taji tata jahu mama dhama| deu~ kaha tumha puranakama || do
    sita harana tata jani kahahu pita sana jai || jau~ mai~ rama ta kula sahita kahihi dasanana ai ||
    || gidha deha taji dhari hari rupa| bhushana bahu pata pita anupa || syama gata bisala bhuja cari|
    astuti karata nayana bhari bari || cham jaya rama rupa anupa nirguna saguna guna preraka sahi| dasasisa
    bahu pracanda khandana canda sara mandana mahi || pathoda gata saroja mukha rajiva ayata locanam|
    nita naumi ramu kripala bahu bisala bhava bhaya mocanam || || balamaprameyamanadimajamabyaktamekamagocaram|
