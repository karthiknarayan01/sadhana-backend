id: rudracanditrailokyamamgalakavacam
category: kavacha
name:
  english: rudracanditrailokyamamgalakavacam
  devanagari: रुद्रचण्डीत्रैलोक्यमंगलकवचम्
content:
  english: '|| 9|| sarvangam rakshate candi sarvamantram sakilakam | atma paratma jivatma candika patu
    sarvada || 10|| sadhane candika patu sajjnanam candika''vatu | satsangam candika patu sadyogam candika''vatu
    || 11|| satkatham candika rakshet saccintam candika''vatu | purvasyam candika patu agneyyam candika''vatu
    || 12|| dakshinasyam tatha candi sarvada parirakshatu | nairrityam candika rakshet pashcime candika''vatu
    || 13|| vayavyam candika patu uttare candika''vatu | aishanyam candika patu urdhvadhashcandika tatha
    || 14|| candika rakshate kanyam sutam strim candika''vatu | bhrataram bhaginim sarvam candika rakshate
    sada || 15|| bandhuvargakutumbani dasidasam tatah param | rakshate candika devi matribhavanmaheshvari
    || 16|| gajavajigavan sarvan jantunam sarvaparvasu | rakshate candika devi sviyabhavena shambhavi
    || 17|| vastuvrikshadikam sarvam candika rakshate sada | sainyam svasainyavarganam candika parirakshatu
    || 18|| shmashane prantare''ranye candika patu sarvada | rajadvare rane ghore parvate va jale sthale
    || 19|| agnivajradiduryoge vivade shatrusankate | candika patu sarvatra yatha dhenuh sutam prati ||
    20|| iti te kathitam kante'
  devanagari: ॥ ९॥ सर्वाङ्गं रक्षते चण्डी सर्वमन्त्रं सकीलकम् । आत्मा परात्मा जीवात्मा चण्डिका पातु सर्वदा
    ॥ १०॥ साधने चण्डिका पातु सज्ज्ञानं चण्डिकाऽवतु । सत्सङ्गं चण्डिका पातु सद्योगं चण्डिकाऽवतु ॥ ११॥ सत्कथां
    चण्डिका रक्षेत् सच्चिन्तां चण्डिकाऽवतु । पूर्वस्यां चण्डिका पातु आग्नेय्यां चण्डिकाऽवतु ॥ १२॥ दक्षिणस्यां
    तथा चण्डी सर्वदा परिरक्षतु । नैरृत्यां चण्डिका रक्षेत् पश्चिमे चण्डिकाऽवतु ॥ १३॥ वायव्यां चण्डिका
    पातु उत्तरे चण्डिकाऽवतु । ऐशान्यां चण्डिका पातु ऊर्ध्वाधश्चण्डिका तथा ॥ १४॥ चण्डिका रक्षते कन्यां
    सुतं स्त्रीं चण्डिकाऽवतु । भ्रातरं भगिनीं सर्वं चण्डिका रक्षते सदा ॥ १५॥ बन्धुवर्गकुटुम्बानि दासीदासं
    ततः परम् । रक्षते चण्डिका देवी मातृभावान्महेश्वरी ॥ १६॥ गजवाजिगवान् सर्वान् जन्तूनां सर्वपर्वसु ।
    रक्षते चण्डिका देवी स्वीयभावेन शाम्भवी ॥ १७॥ वास्तुवृक्षादिकं सर्वं चण्डिका रक्षते सदा । सैन्यं स्वसैन्यवर्गाणां
    चण्डिका परिरक्षतु ॥ १८॥ श्मशाने प्रान्तरेऽरण्ये चण्डिका पातु सर्वदा । राजद्वारे रणे घोरे पर्वते वा
    जले स्थले ॥ १९॥ अग्निवज्रादिदुर्योगे विवादे शत्रुसङ्कटे । चण्डिका पातु सर्वत्र यथा धेनुः सुतं प्रति
    ॥ २०॥ इति ते कथितं कान्ते
