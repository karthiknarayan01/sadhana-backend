id: ashtavakra-gita-chapter-15
category: stotram
name:
  english: Ashtavakra Gita Chapter 15
content:
  english: ashtavakra uvaca || yathatathopadeshena kritarthah sattvabuddhiman | ajivamapi jijnasuh parastatra
    vimuhyati || || moksho vishayavairasyam bandho vaishayiko rasah | etavadeva vijnanam yathecchasi tatha
    kuru || || vagmiprajnamahodyogam janam mukajadalasam | karoti tattvabodho'yamatastyakto bubhukshabhih
    || || na tvam deho na te deho bhokta karta na va bhavan | cidrupo'si sada sakshi nirapekshah sukham
    cara || || ragadveshau manodharmau na manaste kadacana | nirvikalpo'si bodhatma nirvikarah sukham
    cara || || sarvabhuteshu catmanam sarvabhutani catmani | vijnaya nirahankaro nirmamastvam sukhi bhava
    || || vishvam sphurati yatredam taranga iva sagare | tattvameva na sandehashcinmurte vijvaro bhava
    || || shraddhasva tata shraddhasva natra moham kurushva bhoh | jnanasvarupo bhagavanatma tvam prakriteh
    parah || || gunaih samveshtito dehastishthatyayati yati ca | atma na ganta naganta kimenamanushocasi
    || || dehastishthatu kalpantam gacchatvadyaiva va punah | kva vriddhih kva ca va hanistava cinmatrarupinah
    || || tvayyanantamahambhodhau vishvavicih svabhavatah | udetu vastamayatu na te vriddhirna va kshatih
    || || tata cinmatrarupo'si na te bhinnamidam jagat | atah kasya katham kutra heyopadeyakalpana ||
    || ekasminnavyaye shante cidakashe'male tvayi | kuto janma kuto karma kuto'hankara eva ca || || yattvam
    pashyasi tatraikastvameva pratibhasase | kim prithak bhasate svarnat katakangadanupuram || || ayam
    so'hamayam naham vibhagamiti santyaja | sarvamatmeti nishcitya nihsankalpah sukhi bhava || || tavaivajnanato
    vishvam tvamekah paramarthatah | tvatto'nyo nasti samsari nasamsari ca kashcana || || bhrantimatramidam
    vishvam na kinciditi nishcayi | nirvasanah sphurtimatro na kincidiva shamyati || || eka eva bhavambhodhavasidasti
    bhavishyati | na te bandho'sti moksho va kritakrityah sukham cara || || ma sankalpavikalpabhyam cittam
    kshobhaya cinmaya | upashamya sukham tishtha svatmanyanandavigrahe || || tyajaiva dhyanam sarvatra
    ma kincid hridi dharaya | atma tvam mukta evasi kim vimrishya karishyasi ||
  devanagari: अष्टावक्र उवाच ॥ यथातथोपदेशेन कृतार्थः सत्त्वबुद्धिमान् । आजीवमपि जिज्ञासुः परस्तत्र विमुह्यति
    ॥ ॥ मोक्षो विषयवैरस्यं बन्धो वैषयिको रसः । एतावदेव विज्ञानं यथेच्छसि तथा कुरु ॥ ॥ वाग्मिप्राज्ञामहोद्योगं
    जनं मूकजडालसम् । करोति तत्त्वबोधोऽयमतस्त्यक्तो बुभुक्षभिः ॥ ॥ न त्वं देहो न ते देहो भोक्ता कर्ता न
    वा भवान् । चिद्रूपोऽसि सदा साक्षी निरपेक्षः सुखं चर ॥ ॥ रागद्वेषौ मनोधर्मौ न मनस्ते कदाचन । निर्विकल्पोऽसि
    बोधात्मा निर्विकारः सुखं चर ॥ ॥ सर्वभूतेषु चात्मानं सर्वभूतानि चात्मनि । विज्ञाय निरहङ्कारो निर्ममस्त्वं
    सुखी भव ॥ ॥ विश्वं स्फुरति यत्रेदं तरङ्गा इव सागरे । तत्त्वमेव न सन्देहश्चिन्मूर्ते विज्वरो भव ॥ ॥
    श्रद्धस्व तात श्रद्धस्व नात्र मोहं कुरुष्व भोः । ज्ञानस्वरूपो भगवानात्मा त्वं प्रकृतेः परः ॥ ॥ गुणैः
    संवेष्टितो देहस्तिष्ठत्यायाति याति च । आत्मा न गन्ता नागन्ता किमेनमनुशोचसि ॥ ॥ देहस्तिष्ठतु कल्पान्तं
    गच्छत्वद्यैव वा पुनः । क्व वृद्धिः क्व च वा हानिस्तव चिन्मात्ररूपिणः ॥ ॥ त्वय्यनन्तमहाम्भोधौ विश्ववीचिः
    स्वभावतः । उदेतु वास्तमायातु न ते वृद्धिर्न वा क्षतिः ॥ ॥ तात चिन्मात्ररूपोऽसि न ते भिन्नमिदं जगत्
    । अतः कस्य कथं कुत्र हेयोपादेयकल्पना ॥ ॥ एकस्मिन्नव्यये शान्ते चिदाकाशेऽमले त्वयि । कुतो जन्म कुतो
    कर्म कुतोऽहङ्कार एव च ॥ ॥ यत्त्वं पश्यसि तत्रैकस्त्वमेव प्रतिभाससे । किं पृथक् भासते स्वर्णात् कटकाङ्गदनूपुरम्
    ॥ ॥ अयं सोऽहमयं नाहं विभागमिति सन्त्यज । सर्वमात्मेति निश्चित्य निःसङ्कल्पः सुखी भव ॥ ॥ तवैवाज्ञानतो
    विश्वं त्वमेकः परमार्थतः । त्वत्तोऽन्यो नास्ति संसारी नासंसारी च कश्चन ॥ ॥ भ्रान्तिमात्रमिदं विश्वं
    न किञ्चिदिति निश्चयी । निर्वासनः स्फूर्तिमात्रो न किञ्चिदिव शाम्यति ॥ ॥ एक एव भवाम्भोधावासीदस्ति भविष्यति
    । न ते बन्धोऽस्ति मोक्षो वा कृतकृत्यः सुखं चर ॥ ॥ मा सङ्कल्पविकल्पाभ्यां चित्तं क्षोभय चिन्मय । उपशाम्य
    सुखं तिष्ठ स्वात्मन्यानन्दविग्रहे ॥ ॥ त्यजैव ध्यानं सर्वत्र मा किञ्चिद् हृदि धारय । आत्मा त्वं मुक्त
    एवासि किं विमृश्य करिष्यसि ॥
