id: himavatakritamgirijastotram
category: stotram
name:
  english: himavatakritamgirijastotram
  devanagari: हिमवताकृतंगिरिजास्तोत्रम्
content:
  english: adya me saphalam janma adya me saphalam tapah || 1|| yanme sakshattvamavyakta prasanna drishtigocara
    | tvaya srishtam jagatsarvam pradhanadyam tvayi sthitam || 2|| tvayyeva liyate devi tvameva ca para
    gatih | vadanti kecittvameva prakritim prakriteh param || 3|| apare paramarthajnah shiveti shivasamshrayat
    | tvayi pradhanam purusho mahan brahma tatheshvarah || 4|| avidya niyatirmaya kaladyah shatasho'bhavan
    | tvam hi sa parama shaktirananta parameshthini || 5|| sarvabhedavinirmukta sarvebhedashrayashraya
    | tvamadhishthaya yogeshi mahadevo maheshvarah || 6|| pradhanadyam jagatkritsnam karoti vikaroti ca
    | tvayaiva sangato devah svamanandam samashnute || 7|| tvameva paramanandastvamevanandadayini | tvamaksharam
    param vyoma mahajjyotirniranjanam || 8|| shivam sarvagatam sukshmam param brahma sanatanam | tvam
    shakrah sarvadevanam brahma brahmavidamasi || 9|| vayurbalavatam devi yoginam tvam kumarakah | rishinam
    ca vasishthastvam vyaso vedavidamasi || 10|| sankhyanam kapilo devo rudranamasi shankarah | adityanamupendrastvam
    vasunam caiva pavakah || 11|| vedanam samavedastvam gayatri chandasamasi | adhyatmavidya vidyanam
    gatinam parama gatih || 12|| maya tvam sarvashaktinam kalah kalayatamasi | onkarah sarvaguhyanam varnanam
    ca dvijottamah || 13|| ashramanam ca garhasthyamishvaranam maheshvarah | pumsam tvamekah purushah
    sarvabhutahridi sthitah || 14|| sarvopanishadam devi guhyopanishaducyate | ishanashcasi kalpanam yuganam
    kritameva ca || 15|| adityah sarvamarganam vacam devi sarasvati | tvam lakshmishcarurupanam vishnurmayavinamasi
    || 16|| arundhati satinam tvam suparnah patatamasi | suktanam paurusham suktam sama jyeshtham ca samasu
    || 17|| savitri casi japyanam yajusham shatarudriyam | parvatanam mahamerurananto bhoginamasi || 18||
    sarvesham tvam param brahma tvanmayam sarvameva hi || 19|| rupam tavasheshakalavihinamagocaram nirmalamekarupam
    | anadimadhyantamanantamadyam namami satyam tamasah parastat || 20|| yadeva pashyanti jagatprasutim
    vedantavijnanavinishcitarthah | anandamatram pranavabhidhanam tadeva rupam sharanam prapadye || 21||
    asheshabhutantarasannivishtam pradhanapumyogaviyogahetum | tejomayam janmavinashahinam pranabhidhanam
    pranato'smi rupam || 22|| adyantahinam jagadatmabhutam vibhinnasamstham prakriteh parastat | kutasthamavyaktavapustathaiva
    namami rupam purushabhidhanam || 23|| sarvashrayam sarvajagadvidhanam sarvatragam janmavinashahinam
    | sukshmam vicitram trigunam pradhanam nato'smi te rupamarupabhedam || 24|| adyam mahantam purushatmarupam
    prakrityavastham trigunatmabijam | aishvaryavijnanaviragadharmaih samanvitam devi nato'smi rupam ||
    25|| dvisaptalokatmakamambusamstham vicitrabhedam purushaikanatham | anantabhutairadhivasitam te nato'smi
    rupam jagadandasanjnam || 26|| asheshavedatmakamekamadyam svatejasa puritalokabhedam | trikalahetum
    parameshthisanjnam namami rupam ravimandalastham || 27|| sahasramurdhanamanantashaktim sahasrabahum
    purusham puranam | shayanamantah salile tathaiva narayanakhyam pranato'smi rupam || 28|| damshtrakaralam
    tridashabhivandyam yugantakalanalakalparupam | asheshabhutandavinashahetum namami rupam tava kalasanjnam
    || 29|| phanasahasrena virajamanam bhogindramukhyairabhipujyamanam | janardanarudhatanum prasuptam
    nato'smi rupam tava sheshasanjnam || 30|| avyahataishvaryamayugmanetram brahmamritanandarasajnamekam
    | yugantashesham divi nrityamanam nato'smi rupam tava rudrasanjnam || 31|| prahinashokam vimalam pavitram
    surasurairarcitapadapadmam | sukomalam devi vibhasi shubhram namami te rupamidam bhavani || 32|| om
    namaste'stu mahadevi namaste parameshvari | namo bhagavatishani shivayai te namo namah || 33|| tvanmayo'ham
    tvadadharastvameva ca gatirmama | tvameva sharanam yasye prasida parameshvari || 34|| maya nasti samo
    loke devo va danavo'pi va | jaganmataiva matputri sambhuta tapasa yatah || 35|| esha tavambika devi
    kilabhutpitrikanyaka | mena'sheshajaganmaturaho punyasya gauravam || 36|| pahi mamamareshani menaya
    saha sarvada | namami tava padabjam vrajami sharanam shivam || 37|| aho me sumahadbhagyam mahadevisamagamat
    | ajnapaya mahadevi kim karishyami shankari || 38|| etavaduktva vacanam tada himagirishvarah | samprekshanamano
    girijam pranjalih parshvato'bhavat || 39|| iti kurmapurane purvabhage dvadashadhyayantargatam himavata
    kritam girijastotram samaptam | kurmapurane purvabhage 12
  devanagari: अद्य मे सफलं जन्म अद्य मे सफलं तपः ॥ १॥ यन्मे साक्षात्त्वमव्यक्ता प्रसन्ना दृष्टिगोचरा ।
    त्वया सृष्टं जगत्सर्वं प्रधानाद्यं त्वयि स्थितम् ॥ २॥ त्वय्येव लीयते देवि त्वमेव च परा गतिः । वदन्ति
    केचित्त्वामेव प्रकृतिं प्रकृतेः पराम् ॥ ३॥ अपरे परमार्थज्ञाः शिवेति शिवसंश्रयात् । त्वयि प्रधानं पुरुषो
    महान् ब्रह्मा तथेश्वरः ॥ ४॥ अविद्या नियतिर्माया कलाद्याः शतशोऽभवन् । त्वं हि सा परमा शक्तिरनन्ता परमेष्ठिनी
    ॥ ५॥ सर्वभेदविनिर्मुक्ता सर्वेभेदाश्रयाश्रया । त्वामधिष्ठाय योगेशि महादेवो महेश्वरः ॥ ६॥ प्रधानाद्यं
    जगत्कृत्स्नं करोति विकरोति च । त्वयैव सङ्गतो देवः स्वमानन्दं समश्नुते ॥ ७॥ त्वमेव परमानन्दस्त्वमेवानन्ददायिनी
    । त्वमक्षरं परं व्योम महज्ज्योतिर्निरञ्जनम् ॥ ८॥ शिवं सर्वगतं सूक्ष्मं परं ब्रह्म सनातनम् । त्वं शक्रः
    सर्वदेवानां ब्रह्मा ब्रह्मविदामसि ॥ ९॥ वायुर्बलवतां देवि योगिनां त्वं कुमारकः । ऋषीणां च वसिष्ठस्त्वं
    व्यासो वेदविदामसि ॥ १०॥ साङ्ख्यानां कपिलो देवो रुद्राणामसि शङ्करः । आदित्यानामुपेन्द्रस्त्वं वसूनां
    चैव पावकः ॥ ११॥ वेदानां सामवेदस्त्वं गायत्री छन्दसामसि । अध्यात्मविद्या विद्यानां गतीनां परमा गतिः
    ॥ १२॥ माया त्वं सर्वशक्तीनां कालः कलयतामसि । ओङ्कारः सर्वगुह्यानां वर्णानां च द्विजोत्तमः ॥ १३॥ आश्रमाणां
    च गार्हस्थ्यमीश्वराणां महेश्वरः । पुंसां त्वमेकः पुरुषः सर्वभूतहृदि स्थितः ॥ १४॥ सर्वोपनिषदां देवि
    गुह्योपनिषदुच्यते । ईशानश्चासि कल्पानां युगानां कृतमेव च ॥ १५॥ आदित्यः सर्वमार्गाणां वाचां देवि सरस्वती
    । त्वं लक्ष्मीश्चारुरूपाणां विष्णुर्मायाविनामसि ॥ १६॥ अरुन्धती सतीनां त्वं सुपर्णः पततामसि । सूक्तानां
    पौरुषं सूक्तं साम ज्येष्ठं च सामसु ॥ १७॥ सावित्री चासि जाप्यानां यजुषां शतरुद्रियम् । पर्वतानां महामेरुरनन्तो
    भोगिनामसि ॥ १८॥ सर्वेषां त्वं परं ब्रह्म त्वन्मयं सर्वमेव हि ॥ १९॥ रूपं तवाशेषकलाविहीनमगोचरं निर्मलमेकरूपम्
    । अनादिमध्यान्तमनन्तामाद्यं नमामि सत्यं तमसः परस्तात् ॥ २०॥ यदेव पश्यन्ति जगत्प्रसूतिं वेदान्तविज्ञानविनिश्चितार्थाः
    । आनन्दमात्रं प्रणवाभिधानं तदेव रूपं शरणं प्रपद्ये ॥ २१॥ अशेषभूतान्तरसन्निविष्टं प्रधानपुंयोगवियोगहेतुम्
    । तेजोमयं जन्मविनाशहीनं प्राणाभिधानं प्रणतोऽस्मि रूपम् ॥ २२॥ आद्यन्तहीनं जगदात्मभूतं विभिन्नसंस्थं
    प्रकृतेः परस्तात् । कूटस्थमव्यक्तवपुस्तथैव नमामि रूपं पुरुषाभिधानम् ॥ २३॥ सर्वाश्रयं सर्वजगद्विधानं
    सर्वत्रगं जन्मविनाशहीनम् । सूक्ष्मं विचित्रं त्रिगुणं प्रधानं नतोऽस्मि ते रूपमरूपभेदम् ॥ २४॥ आद्यं
    महान्तं पुरुषात्मरूपं प्रकृत्यवस्थं त्रिगुणात्मबीजम् । ऐश्वर्यविज्ञानविरागधर्मैः समन्वितं देवि नतोऽस्मि
    रूपम् ॥ २५॥ द्विसप्तलोकात्मकमम्बुसंस्थं विचित्रभेदं पुरुषैकनाथम् । अनन्तभूतैरधिवासितं ते नतोऽस्मि
    रूपं जगदण्डसञ्ज्ञम् ॥ २६॥ अशेषवेदात्मकमेकमाद्यं स्वतेजसा पूरितलोकभेदम् । त्रिकालहेतुं परमेष्ठिसञ्ज्ञं
    नमामि रूपं रविमण्डलस्थम् ॥ २७॥ सहस्रमूर्धानमनन्तशक्तिं सहस्रबाहुं पुरुषं पुराणम् । शयानमन्तः सलिले
    तथैव नारायणाख्यं प्रणतोऽस्मि रूपम् ॥ २८॥ दंष्ट्राकरालं त्रिदशाभिवन्द्यं युगान्तकालानलकल्परूपम् । अशेषभूताण्डविनाशहेतुं
    नमामि रूपं तव कालसञ्ज्ञम् ॥ २९॥ फणासहस्रेण विराजमानं भोगीन्द्रमुख्यैरभिपूज्यमानम् । जनार्दनारूढतनुं
    प्रसुप्तं नतोऽस्मि रूपं तव शेषसञ्ज्ञम् ॥ ३०॥ अव्याहतैश्वर्यमयुग्मनेत्रं ब्रह्मामृतानन्दरसज्ञमेकम्
    । युगान्तशेषं दिवि नृत्यमानं नतोऽस्मि रूपं तव रुद्रसञ्ज्ञम् ॥ ३१॥ प्रहीणशोकं विमलं पवित्रं सुरासुरैरर्चितापादपद्मम्
    । सुकोमलं देवि विभासि शुभ्रं नमामि ते रूपमिदं भवानि ॥ ३२॥ ॐ नमस्तेऽस्तु महादेवि नमस्ते परमेश्वरि ।
    नमो भगवतीशानि शिवायै ते नमो नमः ॥ ३३॥ त्वन्मयोऽहं त्वदाधारस्त्वमेव च गतिर्मम । त्वामेव शरणं यास्ये
    प्रसीद परमेश्वरि ॥ ३४॥ मया नास्ति समो लोके देवो वा दानवोऽपि वा । जगन्मातैव मत्पुत्री सम्भूता तपसा
    यतः ॥ ३५॥ एषा तवाम्बिका देवि किलाभूत्पितृकन्यका । मेनाऽशेषजगन्मातुरहो पुण्यस्य गौरवम् ॥ ३६॥ पाहि माममरेशानि
    मेनया सह सर्वदा । नमामि तव पादाब्जं व्रजामि शरणं शिवाम् ॥ ३७॥ अहो मे सुमहद्भाग्यं महादेवीसमागमात्
    । आज्ञापय महादेवि किं करिष्यामि शङ्करि ॥ ३८॥ एतावदुक्त्वा वचनं तदा हिमगिरीश्वरः । सम्प्रेक्षणमाणो
    गिरिजां प्राञ्जलिः पार्श्वतोऽभवत् ॥ ३९॥ इति कूर्मपुराणे पूर्वभागे द्वादशाध्यायान्तर्गतं हिमवता कृतं
    गिरिजास्तोत्रं समाप्तम् । कूर्मपुराणे पूर्वभागे १२
