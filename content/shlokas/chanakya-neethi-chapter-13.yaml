id: chanakya-neethi-chapter-13
category: stotram
name:
  english: Chanakya Neethi - Chapter 13
content:
  english: muhurtamapi jivecca narah shuklena karmana | na kalpamapi kashtena lokadvayavirodhina || ||
    gate shoko na kartavyo bhavishyam naiva cintayet | vartamanena kalena vartayanti vicakshanah || ||
    svabhavena hi tushyanti devah satpurushah pita | jnatayah snanapanabhyam vakyadanena panditah || ||
    ayuh karma ca vittam ca vidya nidhanameva ca | pancaitani hi srijyante garbhasthasyaiva dehinah ||
    || aho bata vicitrani caritani mahatmanam | lakshmim trinaya manyante tadbharena namanti ca || ||
    yasya sneho bhayam tasya sneho duhkhasya bhajanam | snehamulani duhkhani tani tyaktva vaset sukham
    || || anagatavidhata ca pratyutpannamatistatha | dvavetau sukhamedhete yadbhavishyo vinashyati ||
    || rajni dharmini dharmishthah pape papah same samah | rajanamanuvartante yatha raja tatha prajah
    || || jivantam mritavanmanye dehinam dharmavarjitam | mrito dharmena samyukto dirghajivi na samshayah
    || || dharmarthakamamokshanam yasyaiko'pi na vidyate | ajagalastanasyeva tasya janma nirarthakam ||
    || dahyamanah sutivrena nicah parayasho'gnina | ashaktastatpadam gantum tato nindam prakurvate ||
    || bandhaya vishayasango muktyai nirvishayam manah | mana eva manushyanam karanam bandhamokshayoh
    || || dehabhimane galitam jnanena paramatmani | yatra yatra mano yati tatra tatra samadhayah || ||
    ipsitam manasah sarvam kasya sampadyate sukham | daivayattam yatah sarvam tasmatsantoshamashrayet
    || || yatha dhenusahasreshu vatso gacchati mataram | tatha yacca kritam karma kartaramanugacchati
    || || anavasthitakaryasya na jane na vane sukham | jano dahati samsargadvanam sangavivarjanat || ||
    khanitva hi khanitrena bhutale vari vindati | tatha gurugatam vidyam shushrushuradhigacchati || ||
    karmayattam phalam pumsam buddhih karmanusarini | tathapi sudhiyashcarya suvicaryaiva kurvate || ||
    ekaksharapradataram yo gurum nabhivandate | shvanayonishatam gatva candaleshvabhijayate || || yugante
    pracalenmeruh kalpante sapta sagarah | sadhavah pratipannarthanna calanti kadacana || || prithivyam
    trini ratnani jalamannam subhashitam | mudhaih pashanakhandeshu ratnasanjna vidhiyate ||
  devanagari: मुहूर्तमपि जीवेच्च नरः शुक्लेन कर्मणा । न कल्पमपि कष्टेन लोकद्वयविरोधिना ॥ ॥ गते शोको न
    कर्तव्यो भविष्यं नैव चिन्तयेत् । वर्तमानेन कालेन वर्तयन्ति विचक्षणाः ॥ ॥ स्वभावेन हि तुष्यन्ति देवाः
    सत्पुरुषाः पिता । ज्ञातयः स्नानपानाभ्यां वाक्यदानेन पण्डिताः ॥ ॥ आयुः कर्म च वित्तं च विद्या निधनमेव
    च । पञ्चैतानि हि सृज्यन्ते गर्भस्थस्यैव देहिनः ॥ ॥ अहो बत विचित्राणि चरितानि महात्मनाम् । लक्ष्मीं
    तृणाय मन्यन्ते तद्भारेण नमन्ति च ॥ ॥ यस्य स्नेहो भयं तस्य स्नेहो दुःखस्य भाजनम् । स्नेहमूलानि दुःखानि
    तानि त्यक्त्वा वसेत् सुखम् ॥ ॥ अनागतविधाता च प्रत्युत्पन्नमतिस्तथा । द्वावेतौ सुखमेधेते यद्भविष्यो
    विनश्यति ॥ ॥ राज्ञि धर्मिणि धर्मिष्ठाः पापे पापाः समे समाः । राजानमनुवर्तन्ते यथा राजा तथा प्रजाः
    ॥ ॥ जीवन्तं मृतवन्मन्ये देहिनं धर्मवर्जितम् । मृतो धर्मेण संयुक्तो दीर्घजीवी न संशयः ॥ ॥ धर्मार्थकाममोक्षाणां
    यस्यैकोऽपि न विद्यते । अजागलस्तनस्येव तस्य जन्म निरर्थकम् ॥ ॥ दह्यमानाः सुतीव्रेण नीचाः परयशोऽग्निना
    । अशक्तास्तत्पदं गन्तुं ततो निण्डां प्रकुर्वते ॥ ॥ बन्धाय विषयासङ्गो मुक्त्यै निर्विषयं मनः । मन एव
    मनुष्याणां कारणं बन्धमोक्षयोः ॥ ॥ देहाभिमाने गलितं ज्ञानेन परमात्मनि । यत्र यत्र मनो याति तत्र तत्र
    समाधयः ॥ ॥ ईप्सितं मनसः सर्वं कस्य सम्पद्यते सुखम् । दैवायत्तं यतः सर्वं तस्मात्सन्तोषमाश्रयेत् ॥
    ॥ यथा धेनुसहस्रेषु वत्सो गच्छति मातरम् । तथा यच्च कृतं कर्म कर्तारमनुगच्छति ॥ ॥ अनवस्थितकार्यस्य न
    जने न वने सुखम् । जनो दहति संसर्गाद्वनं सङ्गविवर्जनात् ॥ ॥ खनित्वा हि खनित्रेण भूतले वारि विन्दति
    । तथा गुरुगतां विद्यां शुश्रूषुरधिगच्छति ॥ ॥ कर्मायत्तं फलं पुंसां बुद्धिः कर्मानुसारिणी । तथापि सुधियश्चार्या
    सुविचार्यैव कुर्वते ॥ ॥ एकाक्षरप्रदातारं यो गुरुं नाभिवन्दते । श्वानयोनिशतं गत्वा चाण्डालेष्वभिजायते
    ॥ ॥ युगान्ते प्रचलेन्मेरुः कल्पान्ते सप्त सागराः । साधवः प्रतिपन्नार्थान्न चलन्ति कदाचन ॥ ॥ पृथिव्यां
    त्रीणि रत्नानि जलमन्नं सुभाषितम् । मूढैः पाषाणखण्डेषु रत्नसञ्ज्ञा विधीयते ॥
