id: shivastotrambrahmadibhihkritam
category: stotram
name:
  english: shivastotrambrahmadibhihkritam
  devanagari: शिवस्तोत्रम्ब्रह्मादिभिःकृतं
content:
  english: mahadevam shivam sthanumugram rudram vrishadhvajam | shmashanavasinam bhargam sarvantakaranam
    param || 55|| tvam namamo vayam bhaktya shankaram nilalohitam | girisham varadam devam bhutabhavanamavyayam
    || 56|| anadimadhyasamsarayogavidyaya shambhave | namah shivaya shantaya brahmane lingamurtaye ||
    57|| jatilaya girishaya vidyashaktidharaya te | namah shivaya shantaya brahmane lingamurtaye || 58||
    jnanamritantasampurnashuddhadehantaraya ca | namah shivaya shantaya brahmane lingamurtaye || 59||
    adimadhyantabhutaya svabhavanaladiptaye | namah shivaya shantaya brahmane lingamurtaye || 60|| pralayanavasamsthaya
    pralayasthitihetave | namah shivaya shantaya brahmane lingamurtaye || 61|| yah parebhyah parastasmat
    paraya paramatmane | namah shivaya shantaya brahmane lingamurtaye || 62|| jvalamalavritangaya namaste
    vishvarupine | namah shivaya shantaya brahmane lingamurtaye || 63|| om namah paramarthaya jnanadipaya
    vedhase | namah shivaya shantaya brahmane lingamurtaye || 64|| namo dakshayanikanta mrida sharva maheshvara
    | namaste sarvabhutesha prasida bhagavanchiva || 65|| sashoke tvayi lokeshe ceshtamane maheshvara
    | surah samakulah sarve tasmacchokam parityaja || 66|| namo namaste bhutesha sarvakaranakarana | prasida
    raksha nah sarvamstyaja shokam namo'stute || 67|| iti kalikapurane ekonavimshadhyayantargatam markandeyaproktam
    shivastotram sampurnam |
  devanagari: महादेवं शिवं स्थाणुमुग्रं रुद्रं वृषध्वजम् । श्मशानवासिनं भर्गं सर्वान्तकरणं परम् ॥ ५५॥
    त्वां नमामो वयं भक्त्या शङ्करं नीललोहितम् । गिरीशं वरदं देवं भूतभावनमव्ययम् ॥ ५६॥ अनादिमध्यसंसारयोगविद्याय
    शम्भवे । नमः शिवाय शान्ताय ब्रह्मणे लिङ्गमूर्तये ॥ ५७॥ जटिलाय गिरिशाय विद्याशक्तिधराय ते । नमः शिवाय
    शान्ताय ब्रह्मणे लिङ्गमूर्तये ॥ ५८॥ ज्ञानामृतान्तसम्पूर्णशुद्धदेहान्तराय च । नमः शिवाय शान्ताय ब्रह्मणे
    लिङ्गमूर्तये ॥ ५९॥ आदिमध्यान्तभूताय स्वभावानलदीप्तये । नमः शिवाय शान्ताय ब्रह्मणे लिङ्गमूर्तये ॥ ६०॥
    प्रलयाणवसंस्थाय प्रलयस्थितिहेतवे । नमः शिवाय शान्ताय ब्रह्मणे लिङ्गमूर्तये ॥ ६१॥ यः परेभ्यः परस्तस्मात्
    पराय परमात्मने । नमः शिवाय शान्ताय ब्रह्मणे लिङ्गमूर्तये ॥ ६२॥ ज्वालामालावृताङ्गाय नमस्ते विश्वरूपिणे
    । नमः शिवाय शान्ताय ब्रह्मणे लिङ्गमूर्तये ॥ ६३॥ ॐ नमः परमार्थाय ज्ञानदीपाय वेधसे । नमः शिवाय शान्ताय
    ब्रह्मणे लिङ्गमूर्तये ॥ ६४॥ नमो दाक्षायणीकान्त मृड शर्व महेश्वर । नमस्ते सर्वभूतेश प्रसीद भगवञ्छिव
    ॥ ६५॥ सशोके त्वयि लोकेशे चेष्टमाने महेश्वर । सुराः समाकुलाः सर्वे तस्माच्छोकं परित्यज ॥ ६६॥ नमो नमस्ते
    भूतेश सर्वकारणकारण । प्रसीद रक्ष नः सर्वांस्त्यज शोकं नमोऽस्तुते ॥ ६७॥ इति कालिकापुराणे एकोनविंशाध्यायान्तर्गतं
    मार्कण्डेयप्रोक्तं शिवस्तोत्रं सम्पूर्णम् ।
