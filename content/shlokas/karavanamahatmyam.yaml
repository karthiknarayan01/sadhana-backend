id: karavanamahatmyam
category: sutra
name:
  english: karavanamahatmyam
  devanagari: कारवणमाहात्म्यम्
content:
  english: varamasmai pradattavan || trinetrah shulapanishca mama rupasvarupadhrik | saptarshibhishca
    bhanuna paramarthavisharadaih || prapta taih parama siddhirakshaya lokadurlabha | anyaishca bahubhih
    siddhestapasa pushkalena ca || apare tu yuge prapte vriddhadevo mahodayah | yatra siddho mahamedhah
    svayam devo maheshvarah || asya darshanamatrena mucyate sarvapatakaih | kshetradhipam tu tam viddhi
    svayam tatra vyavasthitah || ghore kaliyuge prapte devadevo jagadguruh | lakulisha iti khyatah trishu
    lokeshu vishrutah || tatrasthajivalokanam muktyartham naiva samshayah | jnanamurttih svayam sakshaddevadevo
    bhavodbhavah || atmastham cintaya jnanam vitaragam ca kevalam | tattirtham lakulam jneyam shivakshetramudahritam
    || sevyate daivataih sarvam rishibhishca tapodhanaih | tapasa sadhitastaistu surairbrahmadibhih priye
    || ipsitam praptavan karyamasmin tirthe varanane | tatra snatva ca dattva ca pitrinam tu tilodakam
    || mucyate manavah papat saptajanmasamudbhavat | sandeho naiva kartavya iti shambhuh svayamabravit
    || prayage va bhavenmoksho mahakale ca va priye
  devanagari: वरमस्मै प्रदत्तवान् ॥ त्रिनेत्रः शूलपाणिश्च मम रूपस्वरूपधृक् । सप्तर्षिभिश्च भानुना परमार्थविशारदैः
    ॥ प्राप्ता तैः परमा सिद्धिरक्षया लोकदुर्लभा । अन्यैश्च बहुभिः सिद्धेस्तपसा पुष्कलेन च ॥ अपरे तु युगे
    प्राप्ते वृद्धदेवो महोदयः । यत्र सिद्धो महामेधाः स्वयं देवो महेश्वरः ॥ अस्य दर्शनमात्रेण मुच्यते सर्वपातकैः
    । क्षेत्राधिपं तु तं विद्धि स्वयं तत्र व्यवस्थितः ॥ घोरे कलियुगे प्राप्ते देवदेवो जगद्गुरुः । लकुलीश
    इति ख्यातः त्रिषु लोकेषु विश्रुतः ॥ तत्रस्थजीवलोकानां मुक्त्यर्थं नैव संशयः । ज्ञानमूर्त्तिः स्वयं
    साक्षाद्देवदेवो भवोद्भवः ॥ आत्मस्थं चिन्तय ज्ञानं वीतरागं च केवलम् । तत्तीर्थं लाकुलं ज्ञेयं शिवक्षेत्रमुदाहृतम्
    ॥ सेव्यते दैवतैः सर्वं ऋषिभिश्च तपोधनैः । तपसा साधितस्तैस्तु सुरैर्ब्रह्मादिभिः प्रिये ॥ ईप्सितं प्राप्तवान्
    कार्यमस्मिन् तीर्थे वरानने । तत्र स्नात्वा च दत्त्वा च पितॄणां तु तिलोदकम् ॥ मुच्यते मानवः पापात्
    सप्तजन्मसमुद्भवात् । सन्देहो नैव कर्तव्य इति शम्भुः स्वयमब्रवीत् ॥ प्रयागे वा भवेन्मोक्षो महाकाले
    च वा प्रिये
