id: ramakrishnastotram-8
category: stotram
name:
  english: ramakrishnastotram 8
  devanagari: रामकृष्णस्तोत्रम् ८
content:
  english: vacanairhelaya kirtayantam | jnane tungam mahidhram shishumiva saralam vishvakalyanamurtim
    vande shriramakrishnam dvijakulatilakam nirjaram manavakhyam || 3|| balyat tyagasya marge sthiramaticalitam
    bhogamarganca hitva pashyantam na prabhedam kamapi karadhrite kancane mriccaye ca | jitva jaivapravrirttim
    prakritisahacaram brahmacaryam carantam vande shriramakrishnam jagati nirupamam sadhakeshvagraganyam
    || 4|| jivanmuktam mahantam vijita bhava bhayam shuddhasattva
  devanagari: वचनैर्हेलया कीर्तयन्तम् । ज्ञाने तुङ्गं महीध्रं शिशुमिव सरलं विश्वकल्याणमूर्तिं वन्दे श्रीरामकृष्णं
    द्विजकुलतिलकं निर्जरं मानवाख्यम् ॥ ३॥ बाल्यात् त्यागस्य मार्गे स्थिरमतिचलितं भोगमार्गञ्च हित्वा पश्यन्तं
    न प्रभेदं कमपि करधृते काञ्चने मृच्चये च । जित्वा जैवप्रवृर्त्तिं प्रकृतिसहचरं ब्रह्मचर्यं चरन्तं वन्दे
    श्रीरामकृष्णं जगति निरुपमं साधकेष्वग्रगण्यम् ॥ ४॥ जीवन्मुक्तं महान्तं विजित भव भयं शुद्धसत्त्व
meaning: {}
