id: sri-shodashi-tripura-sundari-ashtottara-satanama-stotram
category: stotram
name:
  english: Sri Shodashi (Tripura Sundari) Ashtottara Satanama Stotram
content:
  english: bhriguruvaca caturvaktra jagannatha stotram vada mayi prabho | yasyanushthanamatrena naro bhaktimavapnuyat
    || || brahmovaca sahasranamnamakrishya namnamashtottaram shatam | guhyadguhyataram guhyam sundaryah
    parikirtitam || || asya shrishodashyashtottarashatanamastotrasya shambhurrishih anushtup chandah shrishodashi
    devata dharmarthakamamokshasiddhyarthe jape viniyogah | tripura shodashi mata tryakshara tritaya trayi
    | sundari sumukhi sevya samavedaparayana || || sharada shabdanilaya sagara saridambara | shuddha shuddhatanuh
    sadhvi shivadhyanaparayana || || svamini shambhuvanita shambhavi ca sarasvati | samudramathini shighragamini
    shighrasiddhida || || sadhusevya sadhugamya sadhusantushtamanasa | khatvangadharini kharva khadgakharparadharini
    || || shadvargabhavarahita shadvargaparicarika | shadvarga ca shadanga ca shodha shodashavarshiki
    || || kraturupa kratumati ribhukshakratumandita | kavargadipavarganta antastha'nantarupini || || akarakararahita
    kalamrityujarapaha | tanvi tattveshvari tara trivarsha jnanarupini || || kali karali kameshi chaya
    sanjnapyarundhati | nirvikalpa mahavega mahotsaha mahodari || || megha balaka vimala vimalajnanadayini
    | gauri vasundhara goptri gavam patinishevita || || bhaganga bhagarupa ca bhaktibhavaparayana | chinnamasta
    mahadhuma tatha dhumravibhushana || || dharmakarmadirahita dharmakarmaparayana | sita matangini medha
    madhudaityavinashini || || bhairavi bhuvana mata'bhayada bhavasundari | bhavuka bagala kritya bala
    tripurasundari || || rohini revati ramya rambha ravanavandita | shatayajnamayi sattva shatakratuvaraprada
    || || shatacandranana devi sahasradityasannibha | somasuryagninayana vyaghracarmambaravrita || ||
    ardhendudharini matta madira madirekshana | iti te kathitam gopyam namnamashtottaram shatam || ||
    sundaryah sarvadam sevyam mahapatakanashanam | gopaniyam gopaniyam gopaniyam kalau yuge || || sahasranamapathasya
    phalam yadvai prakirtitam | tasmatkotigunam punyam stavasyasya prakirtanat || || pathetsada bhaktiyuto
    naro yo nishithakale'pyarunodaye va | pradoshakale navamidine'thava labheta bhoganparamadbhutanpriyan
    || || iti brahmayamale purvakhande shodashyashtottarashatanama stotram |
  devanagari: भृगुरुवाच चतुर्वक्त्र जगन्नाथ स्तोत्रं वद मयि प्रभो । यस्यानुष्ठानमात्रेण नरो भक्तिमवाप्नुयात्
    ॥ ॥ ब्रह्मोवाच सहस्रनाम्नामाकृष्य नाम्नामष्टोत्तरं शतम् । गुह्याद्गुह्यतरं गुह्यं सुन्दर्याः परिकीर्तितम्
    ॥ ॥ अस्य श्रीषोडश्यष्टोत्तरशतनामस्तोत्रस्य शम्भुरृषिः अनुष्टुप् छन्दः श्रीषोडशी देवता धर्मार्थकाममोक्षसिद्ध्यर्थे
    जपे विनियोगः । त्रिपुरा षोडशी माता त्र्यक्षरा त्रितया त्रयी । सुन्दरी सुमुखी सेव्या सामवेदपरायणा ॥
    ॥ शारदा शब्दनिलया सागरा सरिदम्बरा । शुद्धा शुद्धतनुः साध्वी शिवध्यानपरायणा ॥ ॥ स्वामिनी शम्भुवनिता
    शाम्भवी च सरस्वती । समुद्रमथिनी शीघ्रगामिनी शीघ्रसिद्धिदा ॥ ॥ साधुसेव्या साधुगम्या साधुसन्तुष्टमानसा
    । खट्वाङ्गधारिणी खर्वा खड्गखर्परधारिणी ॥ ॥ षड्वर्गभावरहिता षड्वर्गपरिचारिका । षड्वर्गा च षडङ्गा च
    षोढा षोडशवार्षिकी ॥ ॥ क्रतुरूपा क्रतुमती ऋभुक्षक्रतुमण्डिता । कवर्गादिपवर्गान्ता अन्तस्थाऽनन्तरूपिणी
    ॥ ॥ अकाराकाररहिता कालमृत्युजरापहा । तन्वी तत्त्वेश्वरी तारा त्रिवर्षा ज्ञानरूपिणी ॥ ॥ काली कराली कामेशी
    छाया सञ्ज्ञाप्यरुन्धती । निर्विकल्पा महावेगा महोत्साहा महोदरी ॥ ॥ मेघा बलाका विमला विमलज्ञानदायिनी
    । गौरी वसुन्धरा गोप्त्री गवां पतिनिषेविता ॥ ॥ भगाङ्गा भगरूपा च भक्तिभावपरायणा । छिन्नमस्ता महाधूमा
    तथा धूम्रविभूषणा ॥ ॥ धर्मकर्मादिरहिता धर्मकर्मपरायणा । सीता मातङ्गिनी मेधा मधुदैत्यविनाशिनी ॥ ॥ भैरवी
    भुवना माताऽभयदा भवसुन्दरी । भावुका बगला कृत्या बाला त्रिपुरसुन्दरी ॥ ॥ रोहिणी रेवती रम्या रम्भा रावणवन्दिता
    । शतयज्ञमयी सत्त्वा शतक्रतुवरप्रदा ॥ ॥ शतचन्द्रानना देवी सहस्रादित्यसन्निभा । सोमसूर्याग्निनयना व्याघ्रचर्माम्बरावृता
    ॥ ॥ अर्धेन्दुधारिणी मत्ता मदिरा मदिरेक्षणा । इति ते कथितं गोप्यं नाम्नामष्टोत्तरं शतम् ॥ ॥ सुन्दर्याः
    सर्वदं सेव्यं महापातकनाशनम् । गोपनीयं गोपनीयं गोपनीयं कलौ युगे ॥ ॥ सहस्रनामपाठस्य फलं यद्वै प्रकीर्तितम्
    । तस्मात्कोटिगुणं पुण्यं स्तवस्यास्य प्रकीर्तनात् ॥ ॥ पठेत्सदा भक्तियुतो नरो यो निशीथकालेऽप्यरुणोदये
    वा । प्रदोषकाले नवमीदिनेऽथवा लभेत भोगान्परमाद्भुतान्प्रियान् ॥ ॥ इति ब्रह्मयामले पूर्वखण्डे षोडश्यष्टोत्तरशतनाम
    स्तोत्रम् ।
