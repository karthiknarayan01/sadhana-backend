id: shatashlokinrisimhadhyanam
category: shataka
name:
  english: shatashlokinrisimhadhyanam
  devanagari: शतश्लोकीनृसिंहध्यानम्
content:
  english: shatashloki nrisimhadhyanam atha shatashloki dhyanam | mahacakrasya sannabhimandale trigunatmani
    | sukham samvitkshirajalam cintayet kshirasagaram || 1|| shvetadvipam ca tanmadhye shabdadivishayatmakah
    | jatibrahmavanopetamsa sadralamsikatancitam || 2|| maniratnamaye tatra prasade sumanohare | shvetasimhasanam
    dhyayet shvetapadmottaracchadam || 3|| shesham tatra vijaniyatsaptatyapucchamandalaih | phanasahasramupari
    chatrikritya vyavasthitam || 4|| shvetaharakiritabhyam dadhanam musalam halam | raktaksham shvetapushpastrak
    nilavastraikakundalam || 5|| tadange cilayeddevam nrisiham pitavasasam | suryendukotimahasamarunottaravasasam
    || 6|| shvetadrikantivapusham satyajnanasukhatmakam || asinam yogapattena caturdashtram caturbhujam
    || 7|| pradakshinyena dadhatamurdhvadakshinabahuke | cakram pinakanabhayam varam karacatushtaye ||
    8|| taptahatakakeshantam candrardhakritashekharam | sukapolam suvistirnalalataphalakojvalam || 9||
    candrasuryagnisankasham vrittotphullatrilocanam | phuratkamalakinjalkasamaromantakarnakam || 10||
    kincidunnatamadhyeshatphullanasamanoharam | lalajjikaprapancasyaprakashitaradavali || 11|| shmashrulambitasrikvanam
    kincidukuncitabhruvam | stabdhadhuropamapakshmanam tiryagalambikesaram || 12|| kakudam sashirah kanthaprakuncitakacoccayam
    | nilagrivam prakrityatma shrivatsankitavakshasam || 13|| vistirnorasthalaluthatpurushatmakakaustubham
    | vishtabdhaparshvaprishthasthimagnanabhyankitodaram || 14|| tiryaksamsthijanghoru janvahitakaradvayam
    | tikshnogranakhavajralirocirvidravitasuram || 15|| tiryakpadatalasparshakritarthikritavasukim | kiritaharakeyurakancikatakabhushitam
    || 16|| ayuktajanghabharanam padantavyaptanupuram | ratnamnguliyakajyotirudbhasita digambaram || 17||
    samakarnantavinyastacarakundalabhushitam | pancabhutatmikam pancarupam malam ca bibhratam || 18||
    vamarugataya lakshmyashlishtam dakshinabahuna | dadhatya vamahastena dadimam sumanoharam || 19|| svarnaratnabharanaya
    pitakausheyavastraya | hiranyavarnayanyastadrisha svamimukhambuje || 20|| nanarupadharaih shastraih
    prishthaparshvagataih prithak | svasvayudhodyatakaraih murtimadbhirupasitam || 21|| sacamarairvirajyamanam
    lakshmyadyabhishca shaktibhih | samsaktabhyanuraktabhiranyabhih parivaritam || 22|| yaksha pannagagandharvavidyadharavadhuganaih
    | nrityavaditrasangitastutibhih kankshitekshanam || 23|| surasuraganaishcaivam prasadavaptadarshanaih
    | kritanjalibhirajnartham kinkarairduratasthitaih || 24|| antarikshagataih siddhaih yogibhih sanakadibhih
    | samstuyamanamekadyairrigyajuhsamamantragaih || 25|| aishanim dishamarabhya mahacakradalasthitaih
    | padmasanairabhimukhairvikshamanam sudarshanaih || 26|| narayanairvasudevaih keshavadyairyathakramam
    | brahmadyairnarisimhaishca svasvavarnayudhanvitaih || 27|| purastadvasubhistasya rudrairddakshinasthitaih
    | cakrasya pashcadadityairvishvedevairyathapyudak || 28|| upopavishtah padante brahmavishnumaheshvaraih
    | svasvayudhakarairudhvam kritanjaliputadharaih || 29|| tathaivopasthitam candrasuryabhyam parshvayodvayoh
    | mahavibhutisamsthanam sarvadevatmakam prabhum || 30|| brahmajneyah shirastasya pitarah sarvashayah
    satah | rudro lalatam vidyutbhurashvinau nasike smritau || 31|| shrotre dishotha gandau dvau naradastumbarustatha
    | mukhamagniradabhani damshtrasta kalaratrayah || 32|| dyavaprithivya voshthau dvau rasana tu sarasvati
    | veda vacaspatih kanthah skandhau guhavinayakau || 33|| stanau brihaspatih shukrah sendradevastu
    bahavah | sarpa angulayo jneyah shastrastrani tatha nakhah || 34|| lakshmirvakshasthalam tasya prano
    narayanatmakah | dharmatmanau carma varma nabhirgaganamucyate || 35|| jagacca jatharam sadhyah pashve
    dve iti hi shrutih | prishtham tu maruto deva lingam tasya prajapatih || 36|| uru dvau vasavah proktau
    janghe svacaranau tu bhuh | siddhah sadhya puraroma nadyo dhamanayah smritah || 37|| asthini parvatastasya
    hiranyam reta ucyate | krodho rudrah samakhyato jyotirbhairavarupadhrik || 38|| shankhacakra gadashan
    cakram lohita mucyate | shankhacakragadashah shankhashankhanibhah smritah || 39|| gada cakrabja shangi
    gatapita nigadyate | sashagacakrabjagadam shardinilambudaprabham || 40|| bana japanibhanili shankhacakradhanurdharah
    | khadgacakragadashanga khadgo dhumrah prakirtitah || 41|| gadabuddhirahankarah shankha shangadvidha
    sthitam | bhutadindriyadimshca manashcakram vidurbudhah || 42|| sharastanindriyanyahurbuddhikarmatmikani
    vai | vidyam khadgam tathaivahuravidya carma sucyate || 43|| shulam halam ca musalam dhavalam tritayam
    smritam | shuladi prathamam kritra shankhacakragadadharah || 44|| caturbhujaste cakradyah suvarnavasanayudhah
    | cakradi cihna mukutah khadgo jneyorunambarah || 45|| atha shatshlokaih kathyate | adya caturthe
    cakre ritupurushakhyai rasaissadalaih | imiti pitantatrantarmayaya veshtita nemih || 46|| vedangayatri
    jagatyanushtubham dalam shesham | cakratritayam tatra hnimiti shukla bahirmayaya || 47|| sphuradattahasavikatogradamshtradiptananan
    raudran | pingordhvabhimakeshan bhimakshannavara vipraravyan || 48|| cakradharam sarojakhangankushapashamusalagadah
    | saha sarvairabharanairamalairdadhatah sudarshananvande || 49|| asitanasitasupitakshitilakshmibhyam
    paribhaktan | cakrambujam shankhagadadadhato narayananvande || 50|| pranato'smi vasudevan cakradharambujagadahastan
    | nikhilavibhushanabhushita sitavapushah sitarojagatan || 51|| shankhacakragadapadyaih keshavah kanakaprabhah
    | kshirambhobjagadacakradharaih narayanah smritah || 52|| madhavah shankhacakrabja gadahastojapanibhah
    | manahshilabho govindo gadapadmadaradibhih || 53|| sapadmashankhadigado vishnushcalaktakaprabhah
    | shankhacakragadapadyairarjuno madhusudanah || 54|| sagadashankhacakrabjo nilabjabhastrivikramah
    | raktashcakragadapadmashankhairvamana ucyate || 55|| cakridarigadisajashridharah kumudaprabhah ||
    kashmirabho hrishikeshah sacakrabjadarogadi || 56|| padmacakra gadashangaih padmanabho janaprabhah
    | damodarah shankhagadacakrabjaih kshirasannibhah || 57|| sphatikabho vasudevah shankhadyabjagadadharah
    | sankarshanodarabjadidaraih kanakasannibhah || 58|| shankhagadisabjacakri pradyumno vajrasannibhah
    | gadishankhi sabjacakrastvaniruddho sitaprabhah || 59|| brahmadya narasimhastu svasvalakshanalakshitah
    | nrisimhakaravadanah sarva eva trilocanah || 60|| dadhati sruvarasruvau brahmavishnushcakrasashankhakam
    | maheshvarah shulacapau purushah shankhacakrabhrit || 61|| dadyati ceshvarah shulam damarum ca yathakramam
    | lekhani pustakam ceti dadhati dve sarasvati || 62|| padmadvayam dadhati shrigauri nilotpaladvayam
    | prakritishva tatha
  devanagari: शतश्लोकी नृसिंहध्यानम् अथ शतश्लोकी ध्यानम् । महाचक्रस्य सन्नाभिमण्डले त्रिगुणात्मनि । सुखं
    संवीत्क्षीरजलं चिन्तयेत् क्षीरसागरम् ॥ १॥ श्वेतद्वीपं च तन्मध्ये शब्दादिविषयात्मकः । जातिब्रह्मवनोपेतंस
    सद्रलंसिकताञ्चितम् ॥ २॥ मणिरत्नमये तत्र प्रासादे सुमनोहरे । श्वेतसिंहासनं ध्यायेत् श्वेतपद्मोत्तरच्छदं
    ॥ ३॥ शेषं तत्र विजानीयात्सप्तत्यापुच्छमण्डलैः । फणासहस्रमुपरि छत्रीकृत्य व्यवस्थितम् ॥ ४॥ श्वेतहारकिरीटाभ्यां
    दधानं मुसलं हलम् । रक्ताक्षं श्वेतपुष्पस्त्रक् नीलवस्त्रैककुण्डलम् ॥ ५॥ तदङ्गे चिलयेद्देवं नृसिहं
    पीतवाससम् । सूर्येन्दुकोटिमहसमरुणोत्तरवाससम् ॥ ६॥ श्वेताद्रिकान्तिवपुषं सत्यज्ञानसुखात्मकम् ॥ आसीनं
    योगपट्टेन चतुर्दष्ट्रं चतुर्भुजम् ॥ ७॥ प्रादक्षिण्येन दधतमूर्ध्वदक्षिणबाहुके । चक्रं पिनाकनभयं वरं
    करचतुष्टये ॥ ८॥ तप्तहाटककेशान्तं चन्द्रार्धकृतशेखरम् । सुकपोलं सुविस्तीर्णललाटफलकोज्वलम् ॥ ९॥ चन्द्रसूर्याग्निसङ्काशं
    वृत्तोत्फुल्लत्रिलोचनम् । फुरत्कमलकिञ्जल्कसमरोमान्तकर्णकम् ॥ १०॥ किञ्चिदुन्नतमध्येषत्फुल्लनासामनोहरम्
    । ललज्जिकाप्रपञ्चास्यप्रकाशितरदावलि ॥ ११॥ श्मश्रुलम्बितसृक्वाणं किञ्चिदुकुञ्चितभ्रुवम् । स्तब्धधूरोपमपक्ष्माणं
    तिर्यगालम्बिकेसरम् ॥ १२॥ ककुदं सशिरः कण्ठप्राकुञ्चितकचोच्चयम् । नीलग्रीवं प्रकृत्यात्मा श्रीवत्साङ्कितवक्षसम्
    ॥ १३॥ विस्तीर्णोरस्थललुठत्पुरुषात्मककौस्तुभम् । विष्टब्धपार्श्वपृष्ठास्थिमग्ननाभ्यङ्कितोदरं ॥ १४॥
    तिर्यक्संस्थिजङ्घोरू जान्वाहितकरद्वयम् । तीक्ष्णोग्रनखवज्रालिरोचिर्विद्रावितासुरम् ॥ १५॥ तिर्यक्पादतलस्पर्शकृतार्थीकृतवासुकिम्
    । किरीटहारकेयूरकाञ्चीकटकभूषितम् ॥ १६॥ आयुक्तजङ्घाभरणं पादान्तव्याप्तनूपुरम् । रत्नांङ्गुलीयकज्योतिरुद्भासित
    दिगम्बरम् ॥ १७॥ समकर्णान्तविन्यस्तचारकुण्डलभूषितम् । पञ्चभूतात्मिकां पञ्चरूपां मालां च बिभ्रतम् ॥
    १८॥ वामारूगतया लक्ष्म्याश्लिष्टं दक्षिणबाहुना । दधत्या वामहस्तेन दाडिमं सुमनोहरम् ॥ १९॥ स्वर्णरत्नाभरणया
    पीतकौशेयवस्त्रया । हिरण्यवर्णयान्यस्तदृशा स्वामिमुखाम्बुजे ॥ २०॥ नानारूपधरैः शस्त्रैः पृष्ठपार्श्वगतैः
    पृथक् । स्वस्वायुधोद्यतकरैः मूर्तिमद्भिरुपासितम् ॥ २१॥ सचामरैर्विरज्यमानं लक्ष्म्याद्याभिश्च शक्तिभिः
    । संसाक्ताभ्यनुरक्ताभिरन्याभिः परिवारितम् ॥ २२॥ यक्ष पन्नगगन्धर्वविद्याधरवधूगणैः । नृत्यवादित्रसङ्गीतस्तुतिभिः
    काङ्क्षितेक्षणं ॥ २३॥ सुरासुरगणैश्चैवं प्रसादावाप्तदर्शनैः । कृताञ्जलीभिराज्ञार्थं किङ्करैर्दूरतस्थितैः
    ॥ २४॥ अन्तरिक्षगतैः सिद्धैः योगिभिः सनकादिभिः । संस्तूयमानमेकाद्यैरृग्यजुःसाममन्त्रगैः ॥ २५॥ ऐशानीं
    दिशमारभ्य महाचक्रदलस्थितैः । पद्मासनैरभिमुखैर्वीक्षमाणं सुदर्शनैः ॥ २६॥ नारायणैर्वासुदेवैः केशवाद्यैर्यथाक्रमम्
    । ब्रह्माद्यैर्नारिसिंहैश्च स्वस्ववर्णायुधान्वितैः ॥ २७॥ पुरस्ताद्वसुभिस्तस्य रूद्रैर्द्दक्षिणस्थितैः
    । चक्रस्य पश्चादादित्यैर्विश्वेदेवैर्यथाप्युदक् ॥ २८॥ उपोपविष्टः पादान्ते ब्रह्मविष्णुमहेश्वरैः ।
    स्वस्वायुधकरैरूध्वं कृताञ्जलिपुटधरैः ॥ २९॥ तथैवोपस्थितं चन्द्रसूर्याभ्यां पार्श्वयोद्वयोः । महाविभूतिसंस्थानं
    सर्वदेवात्मकं प्रभुम् ॥ ३०॥ ब्रह्माज्ञेयः शिरस्तस्य पितरः सर्वषयः सटाः । रुद्रो ललाटं विद्युत्भूरश्विनौ
    नासिके स्मृतौ ॥ ३१॥ श्रोत्रे दिशोथ गण्डौ द्वौ नारदस्तुम्बरूस्तथा । मुखमग्नीरदाभानि दंष्ट्रास्ता कालरात्रयः
    ॥ ३२॥ द्यावापृथिव्या वोष्ठौ द्वौ रसना तु सरस्वती । वेदा वाचस्पतिः कण्ठः स्कन्धौ गुहविनायकौ ॥ ३३॥ स्तनौ
    बृहस्पतिः शुक्रः सेन्द्रादेवास्तु बाहवः । सर्पा अङ्गुलयो ज्ञेयाः शस्त्रास्त्राणि तथा नखाः ॥ ३४॥ लक्ष्मीर्वक्षस्थलं
    तस्य प्राणो नारायणात्मकः । धर्मात्मानौ चर्म वर्म नाभिर्गगनमुच्यते ॥ ३५॥ जगच्च जठरं साध्याः पाश्वे
    द्वे इति हि श्रुतिः । पृष्ठं तु मरुतो देवा लिङ्गं तस्य प्रजापतिः ॥ ३६॥ उरू द्वौ वसवः प्रोक्तौ जङ्घे
    स्वचरणौ तु भूः । सिद्धाः साध्या पुरारोमा नद्यो धमनयः स्मृताः ॥ ३७॥ अस्थीनि पर्वतास्तस्य हिरण्यं रेत
    उच्यते । क्रोधो रुद्रः समाख्यातो ज्योतिर्भैरवरूपधृक् ॥ ३८॥ शङ्खचक्र गदाशाङ् चक्रं लोहित मुच्यते ।
    शङ्खचक्रगदाशाः शङ्खशङ्खनिभः स्मृतः ॥ ३९॥ गदा चक्राब्ज शाङ्गी गतापीता निगद्यते । सशागचक्राब्जगदं शार्डीनीलाम्बुदप्रभम्
    ॥ ४०॥ बाणा जपानिभानीली शङ्खचक्रधनुर्धराः । खड्गचक्रगदाशाङ्ग खड्गो धूम्रः प्रकीर्तितः ॥ ४१॥ गदाबुद्धिरहङ्कारः
    शङ्ख शाङ्गद्विधा स्थितम् । भूतादीन्द्रियादींश्च मनश्चक्रं विदुर्बुधाः ॥ ४२॥ शरास्तानिन्द्रियाण्याहुर्बुद्धिकर्मात्मिकानि
    वै । विद्यां खड्गं तथैवाहुरविद्या चर्म सूच्यते ॥ ४३॥ शूलं हलं च मुसलं धवलं त्रितयं स्मृतम् । शूलादि
    प्रथमं कृत्रा शङ्खचक्रगदाधराः ॥ ४४॥ चतुर्भुजास्ते चक्राद्याः सुवर्णवसनायुधाः । चक्रादि चिह्न मुकुटाः
    खड्गो ज्ञेयोरुणाम्बरः ॥ ४५॥ अथ षट्श्लोकैः कथ्यते । आद्या चतुर्थे चक्रे ऋतुपुरुषाख्यै रसैस्सदलैः ।
    ईमिति पीतान्तत्रान्तर्मायया वेष्टिता नेमिः ॥ ४६॥ वेदाङ्गायत्री जगत्यनुष्टुभं दलं शेषम् । चक्रत्रितयं
    तत्र ह्निमिति शुक्ला बहिर्मायया ॥ ४७॥ स्फुरदट्टहासविकटोग्रदंष्ट्रदीप्ताननान् रौद्रान् । पिङ्गोर्ध्वभीमकेशान्
    भीमाक्षान्नवर विप्ररव्यान् ॥ ४८॥ चक्रधरं सरोजखङ्गाङ्कुशपाशमुसलगदाः । सह सर्वैराभरणैरमलैर्दधातः सुदर्शनान्वन्दे
    ॥ ४९॥ असितानसितसुपीतक्षितिलक्ष्मीभ्यां परिभक्तान् । चक्राम्बुजं शङ्खगदादधतो नारायणान्वन्दे ॥ ५०॥ प्रणतोऽस्मि
    वासुदेवान् चक्रधराम्बुजगदहस्तान् । निखिलविभूषणभूषित सितवपुषः सितरोजगतान् ॥ ५१॥ शङ्खचक्रगदापद्यैः केशवः
    कनकप्रभः । क्षीराम्भोब्जगदाचक्रधरैः नारायणः स्मृतः ॥ ५२॥ माधवः शङ्खचक्राब्ज गदाहस्तोजपानिभः । मनःशीलाभो
    गोविन्दो गदापद्मदरादिभिः ॥ ५३॥ सपद्मशङ्खादिगदो विष्णुश्चालक्तकप्रभः । शङ्खचक्रगदापद्यैरर्जुनो मधुसूदनः
    ॥ ५४॥ सगदाशङ्खचक्राब्जो नीलाब्जाभस्त्रिविक्रमः । रक्तश्चक्रगदापद्मशङ्खैर्वामन उच्यते ॥ ५५॥ चक्रीदारीगदीसाजश्रीधरः
    कुमुदप्रभः ॥ काश्मीराभो हृषीकेशः सचक्राब्जदरोगदी ॥ ५६॥ पद्मचक्र गदाशङ्गैः पद्मनाभो जनप्रभः । दामोदरः
    शङ्खगदाचक्राब्जैः क्षीरसन्निभः ॥ ५७॥ स्फटिकाभो वासुदेवः शङ्खाद्यब्जगदाधरः । सङ्कर्षणोदराब्जादिदरैः
    कनकसन्निभः ॥ ५८॥ शङ्खागदीसाब्जचक्री प्रद्युम्नो वज्रसन्निभः । गदीशङ्खी साब्जचक्रस्त्वनिरुद्धो सितप्रभः
    ॥ ५९॥ ब्रह्माद्या नारसिंहास्तु स्वस्वलक्षणलक्षिताः । नृसिंहाकारवदनाः सर्व एव त्रिलोचनाः ॥ ६०॥ दधाति
    स्रुवरस्रुवौ ब्रह्माविष्णुश्चक्रसशङ्खकम् । महेश्वरः शूलचापौ पुरुषः शङ्खचक्रभृत् ॥ ६१॥ दद्याति चेश्वरः
    शूलं डमरूं च यथाक्रमम् । लेखनी पुस्तकं चेति दधाति द्वे सरस्वती ॥ ६२॥ पद्मद्वयं दधाति श्रीगौरी नीलोत्पलद्वयम्
    । प्रकृतिश्व तथा
