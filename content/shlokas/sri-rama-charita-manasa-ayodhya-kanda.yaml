    रुख पाइ। घर तरु तर सर बाग बन बास बनाएन्हि जाइ ॥ ॥ सृङ्गबेरपुर भरत दीख जब। भे सनेहँ सब अङ्ग सिथिल तब
    ॥ सोहत दिएँ निषादहि लागू। जनु तनु धरें बिनय अनुरागू ॥ एहि बिधि भरत सेनु सबु सङ्गा। दीखि जाइ जग पावनि
    गङ्गा ॥ रामघाट कहँ कीन्ह प्रनामू। भा मनु मगनु मिले जनु रामू ॥ करहिं प्रनाम नगर नर नारी। मुदित ब्रह्ममय
    बारि निहारी ॥ करि मज्जनु मागहिं कर जोरी। रामचन्द्र पद प्रीति न थोरी ॥ भरत कहेउ सुरसरि तव रेनू। सकल
