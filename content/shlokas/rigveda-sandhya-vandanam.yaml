    कनिष्ठिकाभ्या थ्सर्वात्मने करतल करपृष्ठाभ्या न्नमः । अङ्गन्यासम् ओ न्तत्सवितुः॒ ब्रह्मात्मने हृदयाय
    नमः । वरे विँष्ण्वात्मने शिरसे स्वाहा । भर्गो॑ देव॒स्य॑ रुद्रात्मने शिखायै वषट् । धी॒महि सत्यात्मने
    कवचाय हुम् । धियो॒ यो नः॑ ज्ञानात्मने नेत्रत्रयाय वौषट् । प्रचो॒दया थ्सर्वात्मने अस्त्राय फट् । भूर्भुव॒स्स्वरों
    इति दिग्विमोकः ॥ शनम् सुरभिः ज्ञान चक्र न्निर्याण मुद्रा चेत्यष्टमुद्राः प्रकीर्तिताः । सूर्योपस्थानम्
    जातवेदसेत्यस्य मन्त्रस्य कश्यप ऋषिः । दुर्गाजातवेदाग्निर्देवता । त्रिष्टु प्छन्दः । सूर्योपस्थाने
    विनियोगः । ओ दसे सुनवाम॒ सोम॑मरातीय॒तो निद॑हाति॒ वेदः॑ । स नः॑ पर् ष॒दति॑ दु॒र्गाणि॒ विश्वा ऽत्य॒ग्निः
    ॥ त्र्यम्बकमिति मन्त्रस्य । मैत्रा वरुणिर्वसिष्ठ ऋषिः । रुद्रो देवता । अनुष्टु प्छन्दः । उपस्थाने
    विनियोगः । ओ म्पुष्टि॒वर्ध॑नम् । उ॒र्वा॒रु॒कमि॑व॒ बन्ध॑नान्मृ॒त्योर्मृ॑क्षीय॒ मा योँरित्यस्य मन्त्रस्य
    । शम्युर ऋषिः । विश्वेदेवाः देवता । शक्वरी छन्दः । शान्त्यर्थे उपस्थाने विनियोगः । ओ योँरावृ॑णीमहे
    । गा॒तुं स्स्व॒स्तिर॑स्तु नः । स्व॒स्तिर्मानु॑षेभ्यः । ऊ॒र्ध्व ञ्जि॑गातु भेष॒जम् । श नमो ब्रह्मणे
    इत्यस्य मन्त्रस्य प्रजापति ऋषिः विश्वेदेवाः देवता । जगती श्छन्दः प्रदक्षिणे विनियोगः । ओ ऽस्त्व॒ग्नये॒
    नमः॑ पृथि॒व्यै नम॒ ओष॑धीभ्यः । नमो वा॒चस्प॑तये॒ नमो॒ विष्ण॑वे मह॒ते क॑रोमि ॥ दिग्देवता नमस्कारः ओ
    न्नमः॒ प्राच्यै॑ दि॒शे याश्च॑ दे॒वता॑ ए॒तस्या॒ म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒ नमः । ओ न्नमो॒ दक्षि॑णायै
    दि॒शे याश्च॑ दे॒वता॑ ए॒तस्या॒ म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒ नमः । ओ च्यै दि॒शे याश्च॑ दे॒वता॑ ए॒तस्या॒
    म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒ नमः । ओ च्यै दि॒शे याश्च॑ दे॒वता॑ ए॒तस्या॒ म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒
    नमः । ओ न्नम॑ ऊ॒र्ध्वा॑यै दि॒शे याश्च॑ दे॒वता॑ ए॒तस्या॒ म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒ नमः । ओ ऽध॑रायै
    दि॒शे याश्च॑ दे॒वता॑ ए॒तस्या॒ म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒ नमः । ओ ऽवान्त॒रायै॑ दि॒शे याश्च॑ दे॒वता॑
    ए॒तस्या॒ म्प्रति॑वसन्त्ये॒ ताभ्य॑श्च॒ नमः ॥ ऋषि देवतादि नमस्कारः नमो गङ्गायमुनयोर्मध्ये ये॑ व॒सन्ति॒
    ते मे प्रसन्नात्मानश्चिर वँ॑र्धय॒न्ति॒ नमो गङ्गायमुनयोर्मुनि॑भ्यश्च॒ नमो॒ नमो गङ्गायमुनयोर्मुनि॑भ्यश्च
    नमः । ॐ सन्ध्या॑यै नमः । सावि॑त्र्यै नमः । गाय॑त्र्यै नमः । सर॑स्वत्यै नमः । सर्वा भ्यो॒ नमः । दे॒वेभ्यो॒
    नमः । ऋषि॑भ्यो॒ नमः । मुनि॑भ्यो॒ नमः । गुरु॑भ्यो॒ नमः । मातृ॑भ्यो॒ नमः । पितृ॑भ्यो॒ नमः । कामो न्नमो॒
    नमः । मन्युरकारिषी न्नमो॒ नमः । यां॒ सदा॑ सर्व॑भूता॒नि॒ च॒रा॑णि स्था॒वरा॑णि च । साय॑ म्प्रा॒तर्न॑मस्य॒न्ति
    सा॒मा॒ सन्ध्या॑ ऽभिर॑क्षतु ॥ देवता स्मरणम् ब्रह्मण्यो देवकीपुत्रो ब्रह्मण्यो मधुसूदनः । ब्रह्मण्यः
    पुण्डरीकाक्षो ब्रह्मण्यो विष्णुरच्युतः ॥ नमो ब्रह्मण्यदेवाय गोब्राह्मणहिताय च । जगद्धिताय कृष्णाय
    गोविन्दाय नमो नमः ॥ क्षीरेण स्नापिते देवी चन्दनेन विलेपिते । बिल्वपत्रार्चिते देवी दुर्गे ङ्गतः ॥
    गायत्री प्रस्थान प्रार्थना उ॒त्तमे॑ शिख॑रे जा॒ते॒ भू॒म्या म्प॑र्वत॒ मूर्ध॑नि । ब्रा॒ह्मणे॑भ्यो ऽभ्य॑नुज्ञा॒ता॒
    ग॒च्छदे॑वि य॒था सु॑खम् ॥ स्तुतो मया वरदा वे॑दमा॒ता॒ प्रचोदयन्ती पवने द्विजा॒ता । आयुः पृथिव्या म्ब्र॑ह्मव॒र्चसं
    मह्य म्ब्र॑ह्मलो॒कम् ॥ नारायण नमस्कृति नमो ऽस्त्वनन्ताय सहस्र मूर्तये सहस्र पादाक्षि शिरोरु बाहवे
    । सहस्रनाम्ने पुरुषाय शाश्वते सहस्र कोटी युगधारिणे नमः ॥ भूम्याकाशाभिवन्दनम् इ॒द न्द्या॑वा पृथि॒वी
    स॒त्यम॑स्तु । पित॒र्मात॒र्यदि॒होप॑ब्रुवे वा॑म् । भू॒त न्दे॒वाना॑मव॒मे अवो॑भिः । विद्यामे॒षं ञ्जी॒रदा॑नुम्
    । आकाशात्पतित यँथा गच्छति सागरम् । सर्वदेव नमस्कारः केशव म्प्रतिगच्छति ॥ सर्ववेदेषु यत्पुण्यं सर्वतीर्थेषु
    यत्फलम् । तत्फलं समवाप्नोति स्तुत्वा देव ञ्जनार्दनम् ॥ वासनाद्वासुदेवस्य वासित न्ते जगत्त्रयम् । सर्वभूत
    निवासो ऽस्तु ते ॥ अभिवादनम् चतुस्सागर पर्यन्त स गोत्रः आश्वलायनसूत्रः ऋक् शाखाध्यायी म्भो अभिवादये
    ॥ आचम्य ॥ समर्पणम् यस्य स्मृत्याच नामोक्त्या तप स्सन्ध्या क्रियादिषु । न्यूनं सम्पूर्णतां याँति सद्योवन्दे
    तमच्युतम् ॥ मन्त्रहीन म्भक्तिहीनं रमापते । यत्कृत न्तु मयादेव परिपूर्ण न्तदस्तु ते ॥ अनेन प्रातः सायं
    सन्ध्यावन्दनेन भगवान् सर्वात्मक श्श्री लक्ष्मीनारायणः प्रीयताम् । सुप्रीतो वरदो भवतु । आब्रह्मलोकादाशेषादालोकालोक
    पर्वतात् । ये सन्ति ब्राहणा देवास्तेभ्यो नित्य न्नमो नमः ॥ कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्यात्मना
    वा प्रकृते स्स्वभावात् । करोमि यद्यत्सकल म्परस्मै नारायणायेति समर्पयामि ॥ सर्वं श्रीमन्नारायणार्पणमस्तु
    ॥
