id: ganesha-ashtakam
category: stotram
name:
  english: Ganesha Ashtakam
content:
  english: sarve ucuh | yato'nantashakteranantashca jiva yato nirgunadaprameya gunaste | yato bhati sarvam
    tridha bhedabhinnam sada tam ganesham namamo bhajamah || || yatashcavirasijjagatsarvameta ttathabjasano
    vishvago vishvagopta | tathendradayo devasangha manushyah sada tam ganesham namamo bhajamah || ||
    yato vahnibhanu bhavo bhurjalam ca yatah sagarashcandrama vyoma vayuh | yatah sthavara jangama vrikshasanghah
    sada tam ganesham namamo bhajamah || || yato danavah kinnara yakshasangha yatashcarana varanah shvapadashca
    | yatah pakshikita yato virudhashca sada tam ganesham namamo bhajamah || || yato buddhirajnananasho
    mumuksho ryatah sampado bhaktasantoshadah syuh | yato vighnanasho yatah karyasiddhih sada tam ganesham
    namamo bhajamah || || yatah putrasampadyato vanchitartho yato'bhaktavighnastatha'nekarupah | yatah
    shokamohau yatah kama eva sada tam ganesham namamo bhajamah || || yato'nantashaktih sa shesho babhuva
    dharadharane'nekarupe ca shaktah | yato'nekadha svargaloka hi nana sada tam ganesham namamo bhajamah
    || || yato vedavaco vikuntha manobhih sada neti netiti yatta grinanti | parabrahmarupam cidanandabhutam
    sada tam ganesham namamo bhajamah || || shriganesha uvaca | punaruce ganadhishah stotrametatpathennarah
    | trisandhyam tridinam tasya sarvakaryam bhavishyati || || yo japedashtadivasam shlokashtakamidam
    shubham | ashtavaram caturthyam tu so'shtasiddhiravapnuyat || || yah pathenmasamatram tu dashavaram
    dine dine | sa mocayedbandhagatam rajavadhyam na samshayah || || vidyakamo labhedvidyam putrarthi
    putramapnuyat | vanchita~llabhate sarvanekavimshativaratah || || yo japetparaya bhaktya gajananaparo
    narah | evamuktva tato devashcantardhanam gatah prabhuh || || iti shriganeshapurane upasanakhande
    shriganeshashtakam |
  devanagari: सर्वे उचुः । यतोऽनन्तशक्तेरनन्ताश्च जीवा यतो निर्गुणादप्रमेया गुणास्ते । यतो भाति सर्वं
    त्रिधा भेदभिन्नं सदा तं गणेशं नमामो भजामः ॥ ॥ यतश्चाविरासीज्जगत्सर्वमेत त्तथाब्जासनो विश्वगो विश्वगोप्ता
    । तथेन्द्रादयो देवसङ्घा मनुष्याः सदा तं गणेशं नमामो भजामः ॥ ॥ यतो वह्निभानू भवो भूर्जलं च यतः सागराश्चन्द्रमा
    व्योम वायुः । यतः स्थावरा जङ्गमा वृक्षसङ्घाः सदा तं गणेशं नमामो भजामः ॥ ॥ यतो दानवाः किन्नरा यक्षसङ्घा
    यतश्चारणा वारणाः श्वापदाश्च । यतः पक्षिकीटा यतो वीरुधश्च सदा तं गणेशं नमामो भजामः ॥ ॥ यतो बुद्धिरज्ञाननाशो
    मुमुक्षो र्यतः सम्पदो भक्तसन्तोषदाः स्युः । यतो विघ्ननाशो यतः कार्यसिद्धिः सदा तं गणेशं नमामो भजामः
    ॥ ॥ यतः पुत्रसम्पद्यतो वाञ्छितार्थो यतोऽभक्तविघ्नास्तथाऽनेकरूपाः । यतः शोकमोहौ यतः काम एव सदा तं गणेशं
    नमामो भजामः ॥ ॥ यतोऽनन्तशक्तिः स शेषो बभूव धराधारणेऽनेकरूपे च शक्तः । यतोऽनेकधा स्वर्गलोका हि नाना
    सदा तं गणेशं नमामो भजामः ॥ ॥ यतो वेदवाचो विकुण्ठा मनोभिः सदा नेति नेतीति यत्ता गृणन्ति । परब्रह्मरूपं
    चिदानन्दभूतं सदा तं गणेशं नमामो भजामः ॥ ॥ श्रीगणेश उवाच । पुनरूचे गणाधीशः स्तोत्रमेतत्पठेन्नरः । त्रिसन्ध्यं
    त्रिदिनं तस्य सर्वकार्यं भविष्यति ॥ ॥ यो जपेदष्टदिवसं श्लोकाष्टकमिदं शुभम् । अष्टवारं चतुर्थ्यां तु
    सोऽष्टसिद्धीरवाप्नुयात् ॥ ॥ यः पठेन्मासमात्रं तु दशवारं दिने दिने । स मोचयेद्बन्धगतं राजवध्यं न संशयः
    ॥ ॥ विद्याकामो लभेद्विद्यां पुत्रार्थी पुत्रमाप्नुयात् । वाञ्छिताँल्लभते सर्वानेकविंशतिवारतः ॥ ॥ यो
    जपेत्परया भक्त्या गजाननपरो नरः । एवमुक्त्वा ततो देवश्चान्तर्धानं गतः प्रभुः ॥ ॥ इति श्रीगणेशपुराणे
    उपासनाखण्डे श्रीगणेशाष्टकम् ।
