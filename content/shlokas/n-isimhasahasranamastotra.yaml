id: n-isimhasahasranamastotra
category: stotram
name:
  english: nṟisimhasahasranamastotra
  devanagari: न्ऱिसिंहसहस्रनामस्तोत्र
content:
  english: ringaya te namah | mangalyaya manojnaya mantavyaya mahatmane || 51|| mahadevaya devaya matulingadharaya
    ca | mahamayaprasutaya prastutaya ca mayine || 52|| anantanantarupaya mayine jalashayine | mahodaraya
    mandaya madadaya madaya ca || 53|| madhukaitabhahantre ca madhavaya muraraye | mahaviryaya dhairyaya
    citravaryaya te namah || 54|| citrakurmaya citraya namaste citrabhanave | mayatitaya mayaya mahaviraya
    te namah || 55|| mahatejaya bijaya tejodhamne ca bijine | tejomaya nrisimhaya namaste citrabhanave
    || 56|| mahadamshtraya tushtaya namah pushtikaraya ca | shipivishtaya hrishtaya pushtaya parameshthine
    || 57|| vishishtaya ca shishtaya garishthayeshtadayine | namo jyeshthaya shreshthaya tushtayamitatejase
    || 58|| ashtanganyastarupaya sarvadushtantakaya ca | vaikunthaya vikunthaya keshikanthaya te namah
    || 59|| kanthiravaya lunthaya nihshathaya hathaya ca | sattvodriktaya rudraya rigyajussamagaya ca
    || 60|| ritudhvajaya vajraya mantrarajaya mantrine | trinetraya trivargaya tridhamne ca trishuline
    || 61|| trikalajnanarupaya tridehaya tridhatmane | namastrimurtividyaya tritattvajnanine namah ||
    62|| akshobhyayaniruddhaya aprameyaya bhanave | amritaya anantaya amitayamitaujase || 63|| apamrityuvinashaya
    apasmaravighatine | annadayannarupaya annayannabhuje namah || 64|| nadyaya niravadyaya vidyayadbhutakarmane
    | sadyojataya sanghaya vaidyutaya namo namah || 65|| adhvatitaya sattvaya vagatitaya vagmine | vagishvaraya
    gopaya gohitaya gavampate || 66|| gandharvaya gabhiraya garjitayorjitaya ca | parjanyaya prabuddhaya
    pradhanapurushaya ca || 67|| padmabhaya sunabhaya padmanabhaya manine | padmanetraya padmaya padmayah
    pataye namah || 68|| padmodaraya putaya padmakalpodbhavaya ca | namo hritpadmavasaya bhupadmoddharanaya
    ca || 69|| shabdabrahmasvarupaya brahmarupadharaya ca | brahmane brahmarupaya padmanetraya te namah
    || 70|| brahmadaya brahmanaya brahmabrahmatmane namah | subrahmanyaya devaya brahmanyaya trivedine
    || 71|| parabrahmasvarupaya pancabrahmatmane namah | namaste brahmashirase tada'shvashirase namah
    || 72|| atharvashirase nityamashanipramitaya ca | namaste tikshnadamshtraya lolaya lalitaya ca ||
    73|| lavanyaya lavitraya namaste bhasakaya ca | lakshanajnaya lakshaya lakshanaya namo namah || 74||
    lasaddiptaya liptaya vishnave prabhavishnave | vrishnimulaya krishnaya shrimahavishnave namah || 75||
    pashyami tvam mahasimham harinam vanamalinam | kiritinam kundalinam sarvangam sarvatomukham || 76||
    sarvatah panipadoram sarvato'kshi shiromukham | sarveshvaram sadatushtam samartham samarapriyam ||
    77|| bahuyojanavistirnam bahuyojanamayatam | bahuyojanahastanghrim bahuyojananasikam || 78|| maharupam
    mahavaktram mahadamshtram mahabhujam | mahanadam maharaudram mahakayam mahabalam || 79|| anabherbrahmano
    rupamagaladvaishnavam tatha | ashirshadrandhramishanam tadagre sarvatah shivam || 80|| namo'stu narayana
    narasimha namo'stu narayana virasimha | namo'stu narayana krurasimha namo'stu narayana divyasimha
    || 81|| namo'stu narayana vyaghrasimha namo'stu narayana pucchasimha | namo'stu narayana purnasimha
    namo'stu narayana raudrasimha || 82|| namo namo bhishanabhadrasimha namo namo vihvalanetrasimha |
    namo namo brimhitabhutasimha namo namo nirmalacitrasimha || 83|| namo namo nirjitakalasimha namo namah
    kalpitakalpasimha | namo namo kamadakamasimha namo namaste bhuvanaikasimha || 84|| dyavaprithivyoridamantaram
    hi vyaptam tvayaikena dishashca sarvah | drishtvadbhutam rupamugram tavedam lokatrayam pravyathitam
    mahatman || 85|| ami hitva surasangha vishanti kecidbhitah pranjalayo grinanti | svastityuktva munayah
    siddhasanghah stuvanti tvam stutibhih pushkalabhih || 86|| rudradityavasavo ye ca sadhya vishvedeva
    marutashcoshmapashca | gandharvayakshasurasiddhasangha vikshanti tvam vismitashcaiva sarve || 87||
    lelihyase grasamanah samantallokansamagranvadanairjvaladbhih | tejobhirapurya jagatsamagram bhasastavograh
    pratapanti vishno || 88|| bhavishnustvam sahishnustvam bhrajishnurjishnureva ca | prithivimantariksham
    tvam parvataranyameva ca || 89|| kalakashtha viliptastvam muhurtapraharadikam | ahoratram trisandhya
    ca pakshamasartuvatsarah || 90|| yugadiryugabhedastvam samyugo yugasandhayah | nityam naimittikam
    dainam mahapralayameva ca || 91|| karanam karanam karta bharta harta tvamishvarah | satkarta satkritirgopta
    saccidanandavigrahah || 92|| pranastvam praninam pratyagatma tvam sarvadehinam | sujyotistvam paranjyotiratmajyotih
    sanatanah || 93|| jyotirlokasvarupastvam tvam jyotirjyotisham patih | svahakarah svadhakaro vashatkarah
    kripakarah || 94|| hantakaro nirakaro vegakarashca shankarah | akaradihakaranta onkaro lokakarakah
    || 95|| ekatma tvamanekatma caturatma caturbhujah | caturmurtishcaturdamshtrashcaturvedamayottamah
    || 96|| lokapriyo lokagururlokesho lokanayakah | lokasakshi lokapatirlokatma lokalocanah || 97|| lokadharo
    brihalloko lokalokamayo vibhuh | lokakarta vishvakarta kritavartah kritagamah || 98|| anadistvamanantastvamabhutobhutavigrahah
    | stutih stutyah stavapritah stota neta niyamakah || 99|| tvam gatistvam matirmahyam pita mata guruh
    sakha | suhridashcatmarupastvam tvam vina nasti me gatih || 100|| namaste mantrarupaya astrarupaya
    te namah | bahurupaya rupaya pancarupadharaya ca || 101|| bhadrarupaya rudhaya yogarupaya yogine |
    samarupaya yogaya yogapithasthitaya ca || 102|| yogagamyaya saumyaya dhyanagamyaya dhyayine | dhyeyagamyaya
    dhamne ca dhamadhipataye namah || 103|| dharadharaya dharmaya dharanabhirataya ca | namo dhatre ca
    sandhatre vidhatre ca dharaya ca || 104|| damodaraya dantaya danavantakaraya ca | namah samsaravaidyaya
    bheshajaya namo namah || 105|| siradhvajaya shitaya vatayapramitaya ca | sarasvataya samsaranashanayaksha
    maline || 106|| asidharmadharayaiva shatkarmanirataya ca | vikarmaya sukarmaya parakarmavidhayine
    || 107|| susharmane manmathaya namo varmaya varmine | karicarmavasanaya karalavadanaya ca || 108||
    kavaye padmagarbhaya bhutagarbhaghrinanidhe | brahmagarbhaya garbhaya brihadgarbhaya dhurjate || 109||
    namaste vishvagarbhaya shrigarbhaya jitaraye | namo hiranyagarbhaya hiranyakavacaya ca || 110|| hiranyavarnadehaya
    hiranyakshavinashine | hiranyakashiporhantre hiranyanayanaya ca || 111|| hiranyaretase tubhyam hiranyavadanaya
    ca | namo hiranyasha
  devanagari: ृङ्गाय ते नमः । माङ्गल्याय मनोज्ञाय मन्तव्याय महात्मने ॥ ५१॥ महादेवाय देवाय मातुलिङ्गधराय
    च । महामायाप्रसूताय प्रस्तुताय च मायिने ॥ ५२॥ अनन्तानन्तरूपाय मायिने जलशायिने । महोदराय मन्दाय मददाय
    मदाय च ॥ ५३॥ मधुकैटभहन्त्रे च माधवाय मुरारये । महावीर्याय धैर्याय चित्रवार्याय ते नमः ॥ ५४॥ चित्रकूर्माय
    चित्राय नमस्ते चित्रभानवे । मायातीताय मायाय महावीराय ते नमः ॥ ५५॥ महातेजाय बीजाय तेजोधाम्ने च बीजिने
    । तेजोमय नृसिंहाय नमस्ते चित्रभानवे ॥ ५६॥ महादंष्ट्राय तुष्टाय नमः पुष्टिकराय च । शिपिविष्टाय हृष्टाय
    पुष्टाय परमेष्ठिने ॥ ५७॥ विशिष्टाय च शिष्टाय गरिष्ठायेष्टदायिने । नमो ज्येष्ठाय श्रेष्ठाय तुष्टायामिततेजसे
    ॥ ५८॥ अष्टाङ्गन्यस्तरूपाय सर्वदुष्टान्तकाय च । वैकुण्ठाय विकुण्ठाय केशिकण्ठाय ते नमः ॥ ५९॥ कण्ठीरवाय
    लुण्ठाय निःशठाय हठाय च । सत्त्वोद्रिक्ताय रुद्राय ऋग्यजुस्सामगाय च ॥ ६०॥ ऋतुध्वजाय वज्राय मन्त्रराजाय
    मन्त्रिणे । त्रिनेत्राय त्रिवर्गाय त्रिधाम्ने च त्रिशूलिने ॥ ६१॥ त्रिकालज्ञानरूपाय त्रिदेहाय त्रिधात्मने
    । नमस्त्रिमूर्तिविद्याय त्रितत्त्वज्ञानिने नमः ॥ ६२॥ अक्षोभ्यायानिरुद्धाय अप्रमेयाय भानवे । अमृताय
    अनन्ताय अमितायामितौजसे ॥ ६३॥ अपमृत्युविनाशाय अपस्मारविघातिने । अन्नदायान्नरूपाय अन्नायान्नभुजे नमः
    ॥ ६४॥ नाद्याय निरवद्याय विद्यायाद्भुतकर्मणे । सद्योजाताय सङ्घाय वैद्युताय नमो नमः ॥ ६५॥ अध्वातीताय
    सत्त्वाय वागतीताय वाग्मिने । वागीश्वराय गोपाय गोहिताय गवाम्पते ॥ ६६॥ गन्धर्वाय गभीराय गर्जितायोर्जिताय
    च । पर्जन्याय प्रबुद्धाय प्रधानपुरुषाय च ॥ ६७॥ पद्माभाय सुनाभाय पद्मनाभाय मानिने । पद्मनेत्राय पद्माय
    पद्मायाः पतये नमः ॥ ६८॥ पद्मोदराय पूताय पद्मकल्पोद्भवाय च । नमो हृत्पद्मवासाय भूपद्मोद्धरणाय च ॥ ६९॥
    शब्दब्रह्मस्वरूपाय ब्रह्मरूपधराय च । ब्रह्मणे ब्रह्मरूपाय पद्मनेत्राय ते नमः ॥ ७०॥ ब्रह्मदाय ब्राह्मणाय
    ब्रह्मब्रह्मात्मने नमः । सुब्रह्मण्याय देवाय ब्रह्मण्याय त्रिवेदिने ॥ ७१॥ परब्रह्मस्वरूपाय पञ्चब्रह्मात्मने
    नमः । नमस्ते ब्रह्मशिरसे तदाऽश्वशिरसे नमः ॥ ७२॥ अथर्वशिरसे नित्यमशनिप्रमिताय च । नमस्ते तीक्ष्णदंष्ट्राय
    लोलाय ललिताय च ॥ ७३॥ लावण्याय लवित्राय नमस्ते भासकाय च । लक्षणज्ञाय लक्षाय लक्षणाय नमो नमः ॥ ७४॥ लसद्दीप्ताय
    लिप्ताय विष्णवे प्रभविष्णवे । वृष्णिमूलाय कृष्णाय श्रीमहाविष्णवे नमः ॥ ७५॥ पश्यामि त्वां महासिंहं
    हारिणं वनमालिनम् । किरीटिनं कुण्डलिनं सर्वाङ्गं सर्वतोमुखम् ॥ ७६॥ सर्वतः पाणिपादोरं सर्वतोऽक्षि शिरोमुखम्
    । सर्वेश्वरं सदातुष्टं समर्थं समरप्रियम् ॥ ७७॥ बहुयोजनविस्तीर्णं बहुयोजनमायतम् । बहुयोजनहस्ताङ्घ्रिं
    बहुयोजननासिकम् ॥ ७८॥ महारूपं महावक्त्रं महादंष्ट्रं महाभुजम् । महानादं महारौद्रं महाकायं महाबलम् ॥
    ७९॥ आनाभेर्ब्रह्मणो रूपमागलाद्वैष्णवं तथा । आशीर्षाद्रन्ध्रमीशानं तदग्रे सर्वतः शिवम् ॥ ८०॥ नमोऽस्तु
    नारायण नारसिंह नमोऽस्तु नारायण वीरसिंह । नमोऽस्तु नारायण क्रूरसिंह नमोऽस्तु नारायण दिव्यसिंह ॥ ८१॥
    नमोऽस्तु नारायण व्याघ्रसिंह नमोऽस्तु नारायण पुच्छसिंह । नमोऽस्तु नारायण पूर्णसिंह नमोऽस्तु नारायण
    रौद्रसिंह ॥ ८२॥ नमो नमो भीषणभद्रसिंह नमो नमो विह्वलनेत्रसिंह । नमो नमो बृंहितभूतसिंह नमो नमो निर्मलचित्रसिंह
    ॥ ८३॥ नमो नमो निर्जितकालसिंह नमो नमः कल्पितकल्पसिंह । नमो नमो कामदकामसिंह नमो नमस्ते भुवनैकसिंह ॥
    ८४॥ द्यावापृथिव्योरिदमन्तरं हि व्याप्तं त्वयैकेन दिशश्च सर्वाः । दृष्ट्वाद्भुतं रूपमुग्रं तवेदं लोकत्रयं
    प्रव्यथितं महात्मन् ॥ ८५॥ अमी हित्वा सुरसङ्घा विशन्ति केचिद्भीताः प्राञ्जलयो गृणन्ति । स्वस्तीत्युक्त्वा
    मुनयः सिद्धसङ्घाः स्तुवन्ति त्वां स्तुतिभिः पुष्कलाभिः ॥ ८६॥ रुद्रादित्यावसवो ये च साध्या विश्वेदेवा
    मरुतश्चोष्मपाश्च । गन्धर्वयक्षासुरसिद्धसङ्घा वीक्षन्ति त्वां विस्मिताश्चैव सर्वे ॥ ८७॥ लेलिह्यसे ग्रसमानः
    समन्ताल्लोकान्समग्रान्वदनैर्ज्वलद्भिः । तेजोभिरापूर्य जगत्समग्रं भासस्तवोग्राः प्रतपन्ति विष्णो ॥
    ८८॥ भविष्णुस्त्वं सहिष्णुस्त्वं भ्रजिष्णुर्जिष्णुरेव च । पृथिवीमन्तरीक्षं त्वं पर्वतारण्यमेव च ॥ ८९॥
    कलाकाष्ठा विलिप्तस्त्वं मुहूर्तप्रहरादिकम् । अहोरात्रं त्रिसन्ध्या च पक्षमासर्तुवत्सराः ॥ ९०॥ युगादिर्युगभेदस्त्वं
    संयुगो युगसन्धयः । नित्यं नैमित्तिकं दैनं महाप्रलयमेव च ॥ ९१॥ करणं कारणं कर्ता भर्ता हर्ता त्वमीश्वरः
    । सत्कर्ता सत्कृतिर्गोप्ता सच्चिदानन्दविग्रहः ॥ ९२॥ प्राणस्त्वं प्राणिनां प्रत्यगात्मा त्वं सर्वदेहिनाम्
    । सुज्योतिस्त्वं परञ्ज्योतिरात्मज्योतिः सनातनः ॥ ९३॥ ज्योतिर्लोकस्वरूपस्त्वं त्वं ज्योतिर्ज्योतिषां
    पतिः । स्वाहाकारः स्वधाकारो वषट्कारः कृपाकरः ॥ ९४॥ हन्तकारो निराकारो वेगकारश्च शङ्करः । अकारादिहकारान्त
    ओङ्कारो लोककारकः ॥ ९५॥ एकात्मा त्वमनेकात्मा चतुरात्मा चतुर्भुजः । चतुर्मूर्तिश्चतुर्दंष्ट्रश्चतुर्वेदमयोत्तमः
    ॥ ९६॥ लोकप्रियो लोकगुरुर्लोकेशो लोकनायकः । लोकसाक्षी लोकपतिर्लोकात्मा लोकलोचनः ॥ ९७॥ लोकाधारो बृहल्लोको
    लोकालोकमयो विभुः । लोककर्ता विश्वकर्ता कृतावर्तः कृतागमः ॥ ९८॥ अनादिस्त्वमनन्तस्त्वमभूतोभूतविग्रहः
    । स्तुतिः स्तुत्यः स्तवप्रीतः स्तोता नेता नियामकः ॥ ९९॥ त्वं गतिस्त्वं मतिर्मह्यं पिता माता गुरुः
    सखा । सुहृदश्चात्मरूपस्त्वं त्वां विना नास्ति मे गतिः ॥ १००॥ नमस्ते मन्त्ररूपाय अस्त्ररूपाय ते नमः
    । बहुरूपाय रूपाय पञ्चरूपधराय च ॥ १०१॥ भद्ररूपाय रूढाय योगरूपाय योगिने । समरूपाय योगाय योगपीठस्थिताय
    च ॥ १०२॥ योगगम्याय सौम्याय ध्यानगम्याय ध्यायिने । ध्येयगम्याय धाम्ने च धामाधिपतये नमः ॥ १०३॥ धराधराय
    धर्माय धारणाभिरताय च । नमो धात्रे च सन्धात्रे विधात्रे च धराय च ॥ १०४॥ दामोदराय दान्ताय दानवान्तकराय
    च । नमः संसारवैद्याय भेषजाय नमो नमः ॥ १०५॥ सीरध्वजाय शीताय वातायाप्रमिताय च । सारस्वताय संसारनाशनायाक्ष
    मालिने ॥ १०६॥ असिधर्मधरायैव षट्कर्मनिरताय च । विकर्माय सुकर्माय परकर्मविधायिने ॥ १०७॥ सुशर्मणे मन्मथाय
    नमो वर्माय वर्मिणे । करिचर्मवसानाय करालवदनाय च ॥ १०८॥ कवये पद्मगर्भाय भूतगर्भघृणानिधे । ब्रह्मगर्भाय
    गर्भाय बृहद्गर्भाय धूर्जटे ॥ १०९॥ नमस्ते विश्वगर्भाय श्रीगर्भाय जितारये । नमो हिरण्यगर्भाय हिरण्यकवचाय
    च ॥ ११०॥ हिरण्यवर्णदेहाय हिरण्याक्षविनाशिने । हिरण्यकशिपोर्हन्त्रे हिरण्यनयनाय च ॥ १११॥ हिरण्यरेतसे
    तुभ्यं हिरण्यवदनाय च । नमो हिरण्यश
