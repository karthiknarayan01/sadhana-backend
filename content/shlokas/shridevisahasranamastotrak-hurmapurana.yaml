id: shridevisahasranamastotrak-hurmapurana
category: stotram
name:
  english: shridevisahasranamastotrak͟hurmaPurana
  devanagari: श्रीदेवीसहस्रनामस्तोत्रख़ुर्मPउरन
content:
  english: rinudhvam munipumgavah || 12|11|| shantirvidya pratishtha ca nivrittishceti tah smritah | caturvyuhastato
    devah procyate parameshvarah || 12|12|| anaya paraya devah svatmanandam samashnute | caturshvapi ca
    vedeshu caturmurtirmaheshvarah || 12|13|| asyastvanadisamsiddhamaishvaryamatulam mahat | tatsambandhadanantaya
    rudrena paramatmana || 12|14|| saisha sarveshvari devi sarvabhutapravartika | procyate bhagavan kalo
    harih prano maheshvarah || 12|15|| tatra sarvamidam protamotamcaivakhilam jagat | sa kalo'gnirharo
    rudro giyate vedavadibhih || 12|16|| kalah srijati bhutani kalah samharate prajah | sarve kalasya
    vashaga na kalah kasyacid vashe || 12|17|| pradhanam purushastattvam mahanatma tvahamkritih | kalenanyani
    tattvani samavishtani yogina || 12|18|| tasya sarvajaganmurtih shaktirmayeti vishruta | tadeyam bhramayedisho
    mayavi purushottamah || 12|19|| saisha mayatmika shaktih sarvakara sanatani | vaishvarupam maheshasya
    sarvada samprakashayet || 12|20|| anyashca shaktayo mukhyastasya devasya nirmitah | jnanashaktih kriyashaktih
    pranashaktiriti trayam || 12|21|| sarvasameva shaktinam shaktimanto vinirmitah | mayayaivatha viprendrah
    sa canadiranashvarah || 12|22|| sarvashaktyatmika maya durnivara duratyaya | mayavi sarvashaktishah
    kalah kalakarah prabhuh || 12|23|| karoti kalah sakalam samharet kala eva hi | kalah sthapayate vishvam
    kaladhinamidam jagat || 12|24|| labdhva devadhidevasya sannidhim parameshthinah | anantasyakhileshasya
    shambhoh kalatmanah prabhoh || 12|25|| pradhanam purusho maya maya caivam prapadyate | eka sarvagatananta
    kevala nishkala shiva || 12|26|| eka shaktih shivaiko'pi shaktimanucyate shivah | shaktayah shaktimanto'nye
    sarvashaktisamudbhavah || 12|27|| shaktishaktimatorbhedam vadanti paramarthatah | abhedamcanupashyanti
    yoginastattvacintakah || 12|28|| shaktayo giraja devi shaktimanatha shamkarah | visheshah kathyate
    cayam purane brahmavadibhih || 12|29|| bhogya vishveshvari devi maheshvarapativrata | procyate bhagavan
    bhokta kapardi nilalohitah || 12|30|| manta vishveshvaro devah shamkaro manmathantakah | procyate
    matirishani mantavya ca vicaratah || 12|31|| ityetadakhilam viprah shaktishaktimadudbhavam | procyate
    sarvavedeshu munibhistattvadarshibhih || 12|32|| etatpradarshitam divyam devya mahatmyamuttamam |
    sarvavedantavideshu nishcitam brahmavadibhih || 12|33|| ekam sarvagatam sukshmam kutasthamacalam dhruvam
    | yoginastatprapashyanti mahadevyah param padam || 12|34|| anandamaksharam brahma kevalam nishkalam
    param | yoginastatprapashyanti mahadevyah param padam || 12|35|| paratparataram tattvam shashvatam
    shivamacyutam | anantaprakritau linam devyastatparamam padam || 12|36|| shubham niranjanam shuddham
    nirgunam dvaitavarjitam | atmopalabdhivishayam devyastataparamam padam || 12|37|| saisha dhatri vidhatri
    ca paramanandamicchatam | samsaratapanakhilannihantishvarasamshraya || 12|38|| tasmadvimuktimanvicchan
    parvatim parameshvarim | ashrayetsarvabhutanamatmabhutam shivatmikam || 12|39|| labdhva ca putrim
    sharvanim tapastaptva sudushcaran | sabharyah sharanam yatah parvatim parameshvarim || 12|40|| tam
    drishtva jayamanam ca svecchayaiva varananam | mena himavatah patni prahedam parvateshvaram || 12|41||
    menovaca pashya balamimam rajanrajivasadrishananam | hitaya sarvabhutanam jata ca tapasavayoh || 12|42||
    so'pi drishtva tatah devim tarunadityasannibham | kapardinim caturvakram trinetramatilalasam || 12|43||
    ashtahastam vishalakshim candravayavabhushanam | nirgunam sagunam sakshatsadasadvyaktivarjitam ||
    12|44|| pranamya shirasa bhumau tejasa cativihvalah | bhitah kritanjalistasyah provaca parameshvarim
    || 12|45|| himavanuvaca ka tvam devi vishalakshi shashankavayavankite | na jane tvamaham vatse yathavadbruhi
    pricchate || 12|46|| girindravacanam shrutva tatah sa parameshvari | vyajahara mahashailam yoginamabhayaprada
    || 12|47|| devyuvaca mam viddhi paramam shaktim parameshvarasamashrayam || 12|48|| ananyamavyayamekam
    yam pashyanti mumukshavah | aham vai sarvabhavanatma sarvantara shiva || 12|49|| shashvataishvaryavijnanamurtih
    sarvapravartika | ananta'nantamahima samsararnavatarini || 12|50|| divyam dadami te cakshuh pashya
    me rupamaishvaram | etavaduktva vijnanam dattva himavate svayam || 12|51|| svam rupam darshayamasa
    divyam tat parameshvaram | kotisuryapritikasham tejobimbam nirakulam || 12|52|| jvalamalasahasradhyam
    kalanalashatopamam | damshtrakaralam durddharsham jatamanadalamanditam || 12|53|| kiritinam gadahastam
    shankacakradharam tatha | trishulavarahastam ca ghorarupam bhayanakam || 12|54|| prashantam somyavadanamanantashcaryasamyutam
    | candravayavalakshmanam candrakotisamaprabham || 12|55|| kiritinam gadahastam nupurairupashobhitam
    | divyamalyambaradharam divyagandhanulepanam || 12|56|| shankhacakradharam kamyam trinetram krittivasasam
    | andastham candabahyastham bahyamabhyantaram param || 12|57|| sarvashaktimayam shubhram sarvakaram
    sanatanam | brahmondropendrayogindrairvandyamanapadambujam || 12|58|| sarvatah panipadantam sarvato'kshishiromukham
    | sarvamavritya tishthantam dadarsha parameshvaram || 12|59|| drishtva tadidrisham rupam devya maheshvaram
    param | bhayena ca samavishtah sa raja hrishtamanasah || 12|60|| atmanyadhaya catmanamonkaram samanusmaran
    | namnamashtasahasrena tushtava parameshvarim || 12|61|| himavanuvaca shivoma parama shaktirananta
    nishkalamala | shanta maheshvari nitya shashvati paramakshara || 12|62|| acintya kevala'nantya shivatma
    paramatmika | anadiravyaya shuddha devatma sarvaga'cala || 12|63|| ekanekavibhagastha mayatita sunirmala
    | mahamaheshvari satya mahadevi niranjana || 12|64|| kashtha sarvantarastha ca cicchaktiratilalasa
    | nanda sarvatmika vidya jyotirupa'mritakshara || 12|65|| shantih pratishtha sarvesham nivrittiramritaprada
    | vyomamurtirvyomalaya vyomadhara'cyuta'mara || 12|66|| anadinidhana'mogha karanatmakulakula | svatah
    prathamajanabhiramritasyatmasamshraya || 12|67|| praneshvarapriya mata mahamahishaghatini | praneshvari
    pranarupa pradhanapurusheshvari || 12|68|| mahamaya sudushpura mulaprakritirishvari sarvashaktikalakara
    jyotsna dyormahimaspada || 12|69|| sarvakaryaniyantri ca sarvabhuteshvareshvari | samsarayonih sakala
    sarvashaktisamudbhava || 12|70|| samsarapota durvara durnirikshya durasada | pranashaktih pranavidya
    yoganiparama kala || 12|71|| mahavibhutidurdarsha mulaprakritisambhava | anadyanantavibhava paramadyapakarshini
    || 12|72|| sargasthityantakarani sudurvacyaduratyaya | shabdayonih shabdamayi nadakhya nadavigraha
    || 12|73|| anadiravyaktaguna mahananda sanatani | akashayoniryogastha mahayogeshvareshvari || 12|74||
    mahamaya sudushpara mulaprakritirishvari pradhanapurushatita pradhanapurushatmika || 12|75|| purani
    cinmayi pumsamadih purusharupini | bhutantaratma kutastha mahapurushasamjnita || 12|76|| janmamrityujaratita
    sarvashaktisamanvita | vyapini canavacchinna pradhananupraveshini || 12|77|| kshetrajnashaktiravyaktalakshana
    malavarjita | anadimayasambhinna tritattva prakritigraha || 12|78|| mahamayasamutpanna tamasi paurushi
    dhruva | vyaktavyaktatmika krishna rakta shukla prasutika || 12|79|| akarya karyajanani nityam prasavadharmini
    | sargapralayanirmukta srishtisthityantadharmini || 12|80|| brahmagarbha caturvisha padmanabha'cyutatmika
    | vaidyuti shashvati yonirjaganmateshvarapriya || 12|81|| sarvadhara maharupa sarvaishvaryasamanvita
    | vishvarupa mahagarbha vishveshecchanuvartini || 12|82|| mahiyasi brahmayonih mahalakshmisamudbhava
    mahavimanamadhyastha mahanidratmahetuka || 12|83|| sarvasadharani sukshma hyavidya paramarthika |
    anantarupa'nantastha devi purushamohini || 12|84|| anekakarasamsthana kalatrayavivarjita | brahmajanma
    harermurtirbrahmavishnushivatmika || 12|85|| brahmeshavishnujanani brahmakhya brahmasamshraya | vyakta
    prathamaja brahmi mahati jnanarupini || 12|86|| vairagyaishvaryadharmatma brahmamurtirhridisthita
    | apamyonih svayambhutirmanasi tattvasambhava || 12|87|| ishvarani ca sharvani shamkararddhasharirini
    | bhavani caiva rudrani mahalakshmirathambika || 12|88|| maheshvarasamutpanna bhuktimuktiphalaprada
    | sarveshvari sarvavandya nityam muditamanasa || 12|89|| brahmendropendranamita shamkarecchanuvartini
    | ishvararddhasanagata maheshvarapativrata || 12|90|| sakridvibhata sarvarti samudraparishoshini |
    parvati himavatputri paramanandadayini || 12|91|| gunadhya yogaja yogya jnanamurtirvikasini | savitrikamala
    lakshmih shriranantorasi sthita || 12|92|| sarojanilaya mudra yoganidra surardini | sarasvati sarvavidya
    jagajjyeshtha sumangala || 12|93|| vagdevi varada vacya kirtih sarvarthasadhika | yogishvari brahmavidya
    mahavidya sushobhana || 12|94|| guhyavidyatmavidya ca dharmavidyatmabhavita | svaha vishvambhara siddhih
    svadha medha dhritih shrutih || 12|95|| nitih sunitih sukritirmadhavi naravahini | pujya vibhavari
    saumya bhogini bhogashayini || 12|96|| shobha vamshakari lola malini parameshthini | trailokyasundari
    ramya sundari kamacarini || 12|97|| mahanubhava sattvastha mahamahishamardini | padmamala papahara
    vicitra mukutanana || 12|98|| kanta citrambaradhara divyabaranabhushita | hamsakhya vyomanilaya jagatsrishtivivarddhini
    || 12|99|| niryantra yantravahastha nandini bhadrakalika | adityavarna kaumari mayuravaravahana ||
    12|100|| vrishasanagata gauri mahakali surarcita | aditirniyata raudra padmagarbha vivahana || 12|101||
    virupakshi lelihana mahapuranivasini | mahaphala'navadyangi kamarupa vibhavari || 12|102|| vicitraratnamukuta
    pranatartiprabhanjani | kaushiki karshani ratristridashartivinashini || 12|103|| bahurupa svarupa
    ca virupa rupavarjita | bhaktartishamani bhavya bhavabharavinashani || 12|104|| nirguna nityavibhava
    nihsara nirapatrapa | yashasvini samagitirbhavanganilayalaya || 12|105|| diksha vidyadhari dipta mahendravinipatini
    | sarvatishayini vishva sarvasiddhipradayini || 12|106|| sarveshvarapriya bharya samudrantaravasini
    | akalanka niradhara nityasiddha niramaya || 12|107|| kamadhenurbrihadgarbha dhimati mohanashini |
    nihsankalpa niratanka vinaya vinayapriya || 12|108|| jvalamalasahasradhya devadevi manomayi | mahabhagavati
    bharga vasudevasamudbhava || 12|109|| mahendropendrabhagini bhaktigamya paravara | jnanajneya jaratita
    vedantavishaya gatih || 12|110|| dakshina dahana maya sarvabhutanamaskrita | yogamaya vibhagajna mahamoha
    mahiyasi || 12|111|| samdhya sarvasamudbhutirbrahmavrikshashrayanatih | bijankurasamudbhutirmahashaktirmahamatih
    || 12|112|| khyatih prajna citih samccinmahabhogindrashayini | vikritih shamsari shastirganagandharvasevita
    || 12|113|| vaishvanari mahashala devasena guhapriya | maharatrih shivamanda shaci duhsvapnanashini
    || 12|114|| ijya pujya jagaddhatri durvijneya surupini | tapasvini samadhistha trinetra divi samsthita
    || 12|115|| guhambika gunotpattirmahapitha marutsuta | havyavahantaragadih havyavahasamudbhava ||
    12|116|| jagadyonirjaganmata janmamrityujaratiga | buddhimata buddhimati purushantaravasini || 12|117||
    tarasvini samadhistha trinetra divisamsthita | sarvendriyamanomata sarvabhutahridi sthita || 12|118||
    samsaratarini vidya brahmavadimanolaya | brahmani brihati brahmi brahmabhuta bhavarani || 12|119||
    hiranmayi maharatrih samsaraparivarttika | sumalini surupa ca bhavini tarini prabha || 12|120|| unmilani
    sarvasaha sarvapratyayasakshini | susaumya candravadana tandavasaktamanasa || 12|121|| sattvashuddhikari
    shuddhirmalatrayavinashini | jagatpriya jaganmurtistrimurtiramritash || 12|122|| nirashraya nirahara
    nirankuravanodbhava | candrahasta vicitrangi sragvini padmadharini || 12|123|| paravaravidhanajna
    mahapurushapurvaja | vidyeshvarapriya vidya vidyujjihva jitashrama || 12|124|| vidyamayi sahasrakshi
    sahasravadanatmaja | sahasrarashmih sattvastha maheshvarapadashraya || 12|125|| kshalini sanmayi vyapta
    taijasi padmabodhika | mahamayashraya manya mahadevamanorama || 12|126|| vyomalakshmih siharatha cekitanamitaprabha
    | vireshvari vimanastha vishokashokanashini || 12|127|| anahata kundalini nalini padmavasini | sadananda
    sadakirtih sarvabhutashrayasthita || 12|128|| vagdevata brahmakala kalatita kalarani | brahmashrirbrahmahridaya
    brahmavishnushivapriya || 12|129|| vyomashaktih kriyashaktirjnanashaktih paragatih | kshobhika bandhika
    bhedya bhedabhedavivarjita || 12|130|| abhinnabhinnasamsthana vamshini vamshaharini | guhyashaktirgunatita
    sarvada sarvatomukhi || 12|131|| bhagini bhagavatpatni sakala kalakarini | sarvavit sarvatobhadra
    guhyatita guhavalih || 12|132|| prakriya yogamata ca ganga vishveshvareshvari | kapila kapila kantakanakabhakalantara
    || 12|133|| punya pushkarini bhoktri puramdarapurassara | poshani paramaishvaryabhutida bhutibhushana
    || 12|134|| pancabrahmasamutpattih paramartharthavigraha | dharmodaya bhanumati yogijneya manojava
    || 12|135|| manohara manorastha tapasi vedarupini | vedashaktirvedamata vedavidyaprakashini || 12|136||
    yogeshvareshvari mata mahashaktirmanomayi | vishvavastha viyanmurttirvidyunmala vihayasi || 12|137||
    kimnari surabhirvandya nandini nandivallabha | bharati paramananda paraparavibhedika || 12|138|| sarvapraharanopeta
    kamya kameshvareshvari | acintya'cintyavibhava hrillekha kanakaprabha 12|139|| kushmandi dhanaratnadhya
    sugandha gandhayini | trivikramapadodbhuta dhanushpanih shivodaya || 12|140|| sudurlabha dhanadyaksha
    dhanya pingalalocana | shantih prabhavati diptih pankajayatalocana || 12|141|| adya hritkamalodbhuta
    gavam mata ranapriya | satkriya girija shudirnityapushta nirantara || 12|142|| durgakatyayanicandi
    carcika shantavigraha | hiranyavarna rajani jagadyantrapravartika || 12|143|| mandaradrinivasa ca
    sharada svarnamalini | ratnamala ratnagarbha prithvi vishvapramathini || 12|144|| padmanana padmanibha
    nityatushta'mritodbhava | dhunvati duhprakampa ca suryamata drishadvati || 12|145|| mahendrabhagini
    manya varenya varadayika | kalyani kamalavasa pancacuda varaprada || 12|146|| vacya vareshvari vandya
    durjaya duratikrama | kalaratrirmahavega virabhadrapriya hita || 12|147|| bhadrakali jaganmata bhaktanam
    bhadradayini | karala pingalakara kamabheda'mahamada || 12|148|| yashasvini yashoda ca shadadhvaparivarttika
    | shankhini padmini samkhya samkhyayogapravartika || 12|149|| caitra samvatsararudha jagatsampuranidhvaja
    | shumbharih khecarisvastha kambugrivakalipriya || 12|150|| khagadhvaja khagarudha pararya paramalini
    | aishvaryapadmanilaya virakta garudasana || 12|151|| jayanti hridguha gamya gahvareshtha ganagranih
    | samkalpasiddha samyastha sarvavijnanadayini || 12|152|| kalikalpavihantri ca guhyopanishaduttama
    | nishtha drishtih smritirvyaptih pushtistushtih kriyavati || 12|153|| vishvamareshvareshana bhuktirmuktih
    shiva'mrita | lohita sarpamala ca bhishani vanamalini || 12|154|| anantashayana'nanta naranarayanodbhava
    | nrisimhi daityamathani shankhacakragadadhara || 12|155|| samkarshanasamutpattirambikapadasamshraya
    | mahajvala mahamurttih sumurttih sarvakamadhuk || 12|156|| suprabha sustana sauri dharmakamarthamokshada
    | bhrumadhyanilaya purva puranapurusharanih || 12|157|| mahavibhutida madhya sarojanayana sama | ashtadashabhujanadya
    nilotpaladalaprabha12|158|| sarvashaktyasanarudha sarvadharmarthavarjita | vairagyajnananirata niraloka
    nirindriya || 12|159|| vicitragahanadhara shashvatasthanavasini | sthaneshvari nirananda trishulavaradharini
    || 12|160|| asheshadevatamurttirdevata varadevata | ganambika gireh putri nishumbhavinipatini || 12|161||
    avarna varnarahita trivarna jivasambhava | anantavarna'nanyastha shamkari shantamanasa || 12|162||
    agotra gomati goptri guhyarupa gunottara | gaurgirgavyapriya gauni ganeshvaranamaskrita || 12|163||
    satyamata satyasamdha trisamdhya samdhivarjita | sarvavadashraya samkhya samkhyayogasamudbhava ||
    12|164|| asamkhyeya'prameyakhya shunya shuddhakulodbhava | bindunadasamutpattih shambhuvama shashiprabha
    || 12|165|| pishanga bhedarahita manojna madhusudani | mahashrih shrisamutpattistamahpare pratishthita
    || 12|166|| tritattvamata trividha susukshmapadasamshraya | shanta bhita malatita nirvikara nirashraya
    || 12|167|| shivakhya cittanilaya shivajnanasvarupini | daityadanavanirmatri kashyapi kalakarnika
    || 12|168|| shastrayonih kriyamurtishcaturvargapradarshika | narayani narodbhutih kaumudi lingadharini
    || 12|169|| kamuki lalitabhava paraparavibhutida | parantajatamahima badava vamalocana || 12|170||
    subhadra devaki sita vedavedangaparaga | manasvini manyumata mahamanyusamudbhava || 12|171|| amrityuramritasvada
    puruhuta purushtuta | ashocya bhinnavishaya hiranyarajatapriya || 12|172|| hiranya rajati haima hemabharanabhushita
    | vibhrajamana durjneya jyotishtomaphalaprada || 12|173|| mahanidrasamudbhutiranidra satyadevata |
    dirghakakudmini hridya shantida shantivarddhini || 12|174|| lakshmyadishaktijanani shakticakrapravartika
    | trishaktijanani janya shadurmiparivarjita || 12|175|| sudhama karmakarani yugantadahanatmika | samkarshani
    jagaddhatri kamayonih kiritini || 12|176|| aindri trailokyanamita vaishnavi parameshvari | pradyumnadayita
    datri yugmadrishtistrilocana || 12|177|| madotkata hamsagatih pracanda candavikrama | vrishavesha
    viyanmata vindhyaparvatavasini || 12|178|| himavanmerunilaya kailasagirivasini | canurahantritanaya
    nitijna kamarupini || 12|179|| vedavidyavratasnata dharmashila'nilashana | virabhadrapriya vira mahakamasamudbhava
    || 12|180|| vidyadharapriya siddha vidyadharanirakritih | apyayani haranti ca pavani poshani kala
    || 12|181|| matrika manmathodbhuta varija vahanapriya | karishini sudhavani vinavadanatatpara || 12|182||
    sevita sevika sevya sinivali garutmati | arundhati hiranyakshi mrigamka manadayini || 12|183|| vasuprada
    vasumati vasorddhara vasumdhara | dharadhara vararoha varavarasahasrada || 12|184|| shriphala shrimati
    shrisha shrinivasa shivapriya | shridhara shrikari kalya shridhararddhasharirini || 12|185|| anantadrishtirakshudra
    dhatrisha dhanadapriya | nihantri daityasanghanam sihika sihavahana || 12|186|| sushena candranilaya
    sukirtishchinnasamshaya | rasajna rasada rama lelihanamritasrava || 12|187|| nityodita svayamjyotirutsuka
    mritajivana | vajradanda vajrajihva vaidehi vajravigraha || 12|188|| mangalya mangala mala malina
    malaharini | gandharvi garudi candri kambalashvatarapriya || 12|189|| saudamini janananda bhrukutikutilanana
    | karnikarakara kakshya kamsapranapaharini || 12|190|| yugamdhara yugavartta trisamdhya harshavarddhani
    | pratyakshadevata divya divyagandha diva para || 12|191|| shakrasanagata shakri sandhya carusharasana
    | ishta vishishta shishteshta shishtashishtaprapujita || 12|192|| shatarupa shatavartta vinata surabhih
    sura | surendramata sudyumna sushumna suryasamsthita || 12|193|| samikshya satpratishtha ca nivrittirjnanaparaga
    | dharmashastrarthakushala dharmajna dharmavahana || 12|194|| dharmadharmavinirmatri dharmikanam shivaprada
    | dharmashaktirdharmamayi vidharma vishvadharmini || 12|195|| dharmantara dharmamayi dharmapurva dhanavaha
    | dharmopadeshtri dharmatma dharmagamya dharadhara || 12|196|| kapali shakala murttih kala kalitavigraha
    | sarvashaktivinirmukta sarvashaktyashrayashraya || 12|197|| sarva sarveshvari sukshma sukshmajnanasvarupini
    | pradhanapurusheshesha mahadevaikasakshini || 12|198|| sadashiva viyanmurttirvishvamurttiramurttika
