id: ucchishtamahaganapatidhyanam
category: stotram
name:
  english: ucchishtamahaganapatidhyanam
  devanagari: उच्छिष्टमहागणपतिध्यानम्
content:
  english: shriucchishtamahaganapati dhyanam muladhare suyonyakhye cidagnivaramandale | samasinam parashaktivigraham
    gananayakam || 1|| raktotpalasamaprakhyam nilameghasamaprabham | ratnaprabhalasaddiptamukutancitamastakam
    || 2|| karunarasasudhadharasravadakshitrayanvitam | akshikukshimahavakshah gandashukadibhushanam ||
    3|| pashankushekshukodandapancabanalasatkaram | nilakantighanibhutanilavanisuparshvakam || 4|| sutrikonakhyanilangarasasvadanatatparam
    | patnyalingatavamangam saptamatrinishevitam || 5|| brahmavishnumahendradisamprapujitapadukam | mahaddvayapadovacyapadukamantrasarakam
    || 6|| navavaranayajnakhya varivasyavidhipriyam | pancavaranayajnakhya vidhisampujyapadukam || 7||
    akhandakotibrahmandamandaleshvaramavyayam | radanaksharasampurnamantrarajasvarupinam || 8|| girivyahritivarnatmamantratatvapradarshakam
    | arunarunatanucchayamahakamakalatmakam || 9|| mahagopyamahavidya prakashitakalevaram | cicchivam
    cidbhavam shantam trigunadivivarjitam || 10|| ashtottarashatabhikhyakalanyasavidhipriyam | cidakaramahadvipamadhyavasasuvigraham
    || 11|| cidabdhimathanotpannacitsaraghanavigraham | vacamagocaram shantam shuddhacaitanyarupinam ||
    12|| mulakandasthaciddeshanavatandavapanditam | shadamburuhasamsthayiparacivdyomabhasuram || 13||
    akaradikshakarantavarnalakshitacitsukham | akaraksharanirdishtaprakashamayavigraham || 14|| hakarakhyavimarshatmaprabhadiptajagattrayam
    | mahahamsajapadhyanavidhijnatasvarupakam || 15|| sadoditamahaprajnakaram samsaratarakam | mokshalakshmipradataram
    kalatitamahaprabhum || 16|| namarupadisambhinnanityapurnaciduttamam | pratyagbhutamahaprajnagatragocaravigraham
    || 17|| mahakundalinirupam shatckranagareshvaram | aprakritamahadivyacaitanyatmasvarupinam || 18||
    nadabindukalatitam karyakaranavarjitam | shadamburuhacakrantah sphuratsaudaminiprabham || 19|| tattvamasyadivakyarthaparibodhanapanditam
    | brahmadikitaparyantavyaptasamvitsudharasam || 20|| icchajnanakriyanandasarvatantra svatantrinam
    | hridayagranthibhidvidyadarshanotsukamanasam || 21|| pancakrityapareshanam mahatraipuravigraham |
    shricakrarajamadhyasthashunyagramamaheshvaram || 22|| brahmavidyasvarupashrilalitarupadharinam | vashinyadyavritam
    sadhyam advayanandavardhanam || 23|| adishankararupeshadakshinamurtipujitam | asamsprishtamahaprajnabhikhyadvaitasthitiprabham
    || 24|| evam sancitayeddevam ucchishtagananayakam | nilatarasametam tu saccidanandavigraham || 25||
  devanagari: श्रीउच्छिष्टमहागणपति ध्यानम् मूलाधारे सुयोन्याख्ये चिदग्निवरमण्डले । समासीनं पराशक्तिविग्रहं
    गणनायकम् ॥ १॥ रक्तोत्पलसमप्रख्यं नीलमेघसमप्रभम् । रत्नप्रभालसद्दीप्तमुकुटाञ्चितमस्तकम् ॥ २॥ करुणारससुधाधारास्रवदक्षित्रयान्वितम्
    । अक्षिकुक्षिमहावक्षः गण्डशूकादिभूषणम् ॥ ३॥ पाशाङ्कुशेक्षुकोदण्डपञ्चबाणलसत्करम् । नीलकान्तिघनीभूतनीलवाणीसुपार्श्वकम्
    ॥ ४॥ सुत्रिकोणाख्यनीलाङ्गरसास्वादनतत्परम् । पत्न्यालिङ्गतवामाङ्गं सप्तमातृनिषेवितम् ॥ ५॥ ब्रह्मविष्णुमहेन्द्रादिसम्प्रपूजितपादुकम्
    । महद्द्वयपदोवाच्यपादुकामन्त्रसारकम् ॥ ६॥ नवावरणयज्ञाख्य वरिवस्याविधिप्रियम् । पञ्चावरणयज्ञाख्य विधिसम्पूज्यपादुकम्
    ॥ ७॥ अखण्डकोटिब्रह्माण्डामण्डलेश्वरमव्ययम् । रदनाक्षरसम्पूर्णमन्त्रराजस्वरूपिणम् ॥ ८॥ गिरिव्याहृतिवर्णात्ममन्त्रतत्वप्रदर्शकम्
    । अरुणारुणतनुच्छायमहाकामकलात्मकम् ॥ ९॥ महागोप्यमहाविद्या प्रकाशितकलेवरम् । चिच्छिवं चिद्भवं शान्तं
    त्रिगुणादिविवर्जितम् ॥ १०॥ अष्टोत्तरशताभिख्यकलान्यासविधिप्रियम् । चिदाकारमहाद्वीपमध्यवाससुविग्रहम्
    ॥ ११॥ चिदब्धिमथनोत्पन्नचित्सारघनविग्रहम् । वाचामगोचरं शान्तं शुद्धचैतन्यरूपिणम् ॥ १२॥ मूलकन्दस्थचिद्देशनवताण्डवपण्डितम्
    । षडम्बुरुहसंस्थायिपरचिव्द्योमभासुरम् ॥ १३॥ अकारादिक्षकारान्तवर्णलक्षितचित्सुखम् । अकाराक्षरनिर्दिष्टप्रकाशमयविग्रहम्
    ॥ १४॥ हकाराख्यविमर्शात्मप्रभादीप्तजगत्त्रयम् । महाहंसजपध्यानविधिज्ञातस्वरूपकम् ॥ १५॥ सदोदितमहाप्रज्ञाकारं
    संसारतारकम् । मोक्षलक्ष्मीप्रदातारं कालातीतमहाप्रभुम् ॥ १६॥ नामरूपादिसम्भिन्ननित्यपूर्णचिदुत्तमम्
    । प्रत्यग्भूतमहाप्रज्ञागात्रगोचरविग्रहम् ॥ १७॥ महाकुण्डलिनीरूपं षट्च्क्रनगरेश्वरम् । अप्राकृतमहादिव्यचैतन्यात्मस्वरूपिणम्
    ॥ १८॥ नादबिन्दुकलातीतं कार्यकारणवर्जितम् । षडम्बुरुहचक्रान्तः स्फुरत्सौदामिनीप्रभम् ॥ १९॥ तत्त्वमस्यादिवाक्यार्थपरिबोधनपण्डितम्
    । ब्रह्मादिकीटपर्यन्तव्याप्तसंवित्सुधारसम् ॥ २०॥ इच्छाज्ञानक्रियानन्दसर्वतन्त्र स्वतन्त्रिणम् । हृदयग्रन्थिभिद्विद्यादर्शनोत्सुकमानसम्
    ॥ २१॥ पञ्चकृत्यपरेशानं महात्रैपुरविग्रहम् । श्रीचक्रराजमध्यस्थशून्यग्राममहेश्वरम् ॥ २२॥ ब्रह्मविद्यास्वरूपश्रीललितारूपधारिणम्
    । वशिन्याद्यावृतं साध्यं अद्वयानन्दवर्धनम् ॥ २३॥ आदिशङ्कररूपेशदक्षिणामूर्तिपूजितम् । असंस्पृष्टमहाप्रज्ञाभिख्याद्वैतस्थितिप्रभम्
    ॥ २४॥ एवं सञ्चितयेद्देवं उच्छिष्टगणनायकम् । नीलतारासमेतं तु सच्चिदानन्दविग्रहम् ॥ २५॥
