id: manyu-suktam
category: stotram
name:
  english: Manyu Suktam
  devanagari: मन्युसूक्तम् (ऋग्वेद १०।८३, १०।८४)
content:
  english: shrigurubhyo namah harih om | rigvedasamhitayam dashamam mandalam, 83 tryashititamam suktam,
    rishih manyustapasah, devata manyuh, chandah 1 viradjagati, 2 trishtup, 3, 6 virat|htrishtup, 4 padanicrittrishtup,
    5, 7 nicrittrishtup, svarah 1 nishadah, 2-7 dhaivatah || rigvedasamhitayam dashamam mandalam, 84 caturashititamam
    suktam, rishih manyustapasah, devata manyuh, chandah 1, 3 trishtup, 2 bhuriktrishtup, 4, 5 padanicrijjagati,
    6 arcisvaradjagati, 7 viradjagati, svarah 1-3 dhaivatah, 4-7 nishadah || yaste manyo'vidhadvajra sayaka
    saha ojah pushyati vishvamanushak | sahyama dasamaryam tvaya yuja sahaskritena sahasa sahasvata ||
    10|083|01 manyurindro manyurevasa devo manyurhota varuno jatavedah | manyum visha iḻate manushiryah
    pahi no manyo tapasa sajoshah || 10|083|02 abhihi manyo tavasastaviyantapasa yuja vi jahi shatrun
    | amitraha vritraha dasyuha ca vishva vasunya bhara tvam nah || 10|083|03 tvam hi manyo abhibhutyojah
    svayambhurbhamo abhimatishahah | vishvacarshanih sahurih sahavanasmasvojah pritanasu dhehi || 10|083|04
    abhagah sannapa pareto asmi tava kratva tavishasya pracetah | tam tva manyo akraturjihiḻaham sva tanurbaladeyaya
    mehi || 10|083|05 ayam te asmyupa mehyarvanpraticinah sahure vishvadhayah | manyo vajrinnabhi mama
    vavritsva hanava dasyu~ruta bodhyapeh || 10|083|06 abhi prehi dakshinato bhava me'dha vritrani janghanava
    bhuri | juhomi te dharunam madhvo agramubha upamshu prathama pibava || 10|083|07 tvaya manyo sarathamarujanto
    harshamanaso dhrishita marutvah | tigmeshava ayudha samshishana abhi pra yantu naro agnirupah || 10|084|01
    agniriva manyo tvishitah sahasva senanirnah sahure huta edhi | hatvaya shatrunvi bhajasva veda ojo
    mimano vi mridho nudasva || 10|084|02 sahasva manyo abhimatimasme rujanmrinanpramrinanprehi shatrun
    | ugram te pajo nanva rurudhre vashi vasham nayasa ekaja tvam || 10|084|03 eko bahunamasi manyaviḻito
    vishamvisham yudhaye sam shishadhi | akrittaruktvaya yuja vayam dyumantam ghosham vijayaya krinmahe
    || 10|084|04 vijeshakridindra ivanavabravo3'smakam manyo adhipa bhaveha | priyam te nama sahure grinimasi
    vidma tamutsam yata ababhutha || 10|084|05 abhutya sahaja vajra sayaka saho bibharshyabhibhuta uttaram
    | kratva no manyo saha medyedhi mahadhanasya puruhuta samsriji || 10|084|06 samsrishtam dhanamubhayam
    samakritamasmabhyam dattam varunashca manyuh | bhiyam dadhana hridayeshu shatravah parajitaso apa
    ni layantam || 10|084|07 om shantih shantih shantih | harih om |
  devanagari: श्रीगुरुभ्यो नमः हरिः ॐ । ऋग्वेदसंहितायां दशमं मण्डलं, ८३ त्र्यशीतितमं सूक्तम्, ऋषिः मन्युस्तापसः,
    देवता मन्युः, छन्दः १ विराड्जगती, २ त्रिष्टुप्, ३, ६ विराट्।ह्त्रिष्टुप्, ४ पादनिचृत्त्रिष्टुप्, ५,
    ७ निचृत्त्रिष्टुप्, स्वरः १ निषादः, २-७ धैवतः ॥ ऋग्वेदसंहितायां दशमं मण्डलं, ८४ चतुरशीतितमं सूक्तम्,
    ऋषिः मन्युस्तापसः, देवता मन्युः, छन्दः १, ३ त्रिष्टुप्, २ भुरिक्त्रिष्टुप्, ४, ५ पादनिचृज्जगती, ६
    आर्चीस्वराड्जगती, ७ विराड्जगती, स्वरः १-३ धैवतः, ४-७ निषादः ॥ यस्ते मन्योऽविधद्वज्र सायक सह ओजः पुष्यति
    विश्वमानुषक् । साह्याम दासमार्यं त्वया युजा सहस्कृतेन सहसा सहस्वता ॥ १०।०८३।०१ मन्युरिन्द्रो मन्युरेवास
    देवो मन्युर्होता वरुणो जातवेदाः । मन्युं विश ईळते मानुषीर्याः पाहि नो मन्यो तपसा सजोषाः ॥ १०।०८३।०२
    अभीहि मन्यो तवसस्तवीयान्तपसा युजा वि जहि शत्रून् । अमित्रहा वृत्रहा दस्युहा च विश्वा वसून्या भरा त्वं
    नः ॥ १०।०८३।०३ त्वं हि मन्यो अभिभूत्योजाः स्वयम्भूर्भामो अभिमातिषाहः । विश्वचर्षणिः सहुरिः सहावानस्मास्वोजः
    पृतनासु धेहि ॥ १०।०८३।०४ अभागः सन्नप परेतो अस्मि तव क्रत्वा तविषस्य प्रचेतः । तं त्वा मन्यो अक्रतुर्जिहीळाहं
    स्वा तनूर्बलदेयाय मेहि ॥ १०।०८३।०५ अयं ते अस्म्युप मेह्यर्वाङ्प्रतीचीनः सहुरे विश्वधायः । मन्यो वज्रिन्नभि
    मामा ववृत्स्व हनाव दस्यूँरुत बोध्यापेः ॥ १०।०८३।०६ अभि प्रेहि दक्षिणतो भवा मेऽधा वृत्राणि जङ्घनाव
    भूरि । जुहोमि ते धरुणं मध्वो अग्रमुभा उपांशु प्रथमा पिबाव ॥ १०।०८३।०७ त्वया मन्यो सरथमारुजन्तो हर्षमाणासो
    धृषिता मरुत्वः । तिग्मेषव आयुधा संशिशाना अभि प्र यन्तु नरो अग्निरूपाः ॥ १०।०८४।०१ अग्निरिव मन्यो त्विषितः
    सहस्व सेनानीर्नः सहुरे हूत एधि । हत्वाय शत्रून्वि भजस्व वेद ओजो मिमानो वि मृधो नुदस्व ॥ १०।०८४।०२
    सहस्व मन्यो अभिमातिमस्मे रुजन्मृणन्प्रमृणन्प्रेहि शत्रून् । उग्रं ते पाजो नन्वा रुरुध्रे वशी वशं नयस
    एकज त्वम् ॥ १०।०८४।०३ एको बहूनामसि मन्यवीळितो विशंविशं युधये सं शिशाधि । अकृत्तरुक्त्वया युजा वयं
    द्युमन्तं घोषं विजयाय कृण्महे ॥ १०।०८४।०४ विजेषकृदिन्द्र इवानवब्रवो३ऽस्माकं मन्यो अधिपा भवेह । प्रियं
    ते नाम सहुरे गृणीमसि विद्मा तमुत्सं यत आबभूथ ॥ १०।०८४।०५ आभूत्या सहजा वज्र सायक सहो बिभर्ष्यभिभूत
    उत्तरम् । क्रत्वा नो मन्यो सह मेद्येधि महाधनस्य पुरुहूत संसृजि ॥ १०।०८४।०६ संसृष्टं धनमुभयं समाकृतमस्मभ्यं
    दत्तां वरुणश्च मन्युः । भियं दधाना हृदयेषु शत्रवः पराजितासो अप नि लयन्ताम् ॥ १०।०८४।०७ ॐ शान्तिः शान्तिः
    शान्तिः । हरिः ॐ ।
