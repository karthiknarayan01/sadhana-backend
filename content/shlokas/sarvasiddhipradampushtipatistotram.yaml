id: sarvasiddhipradampushtipatistotram
category: stotram
name:
  english: sarvasiddhipradampushtipatistotram
  devanagari: सर्वसिद्धिप्रदंपुष्टिपतिस्तोत्रम्
content:
  english: sarvasiddhipradam pushtipatistotram shriganeshaya namah | radhakrishnavucatuh | namastubhyam
    pushtipate namah shankarasunave | brahmabhutaya devaya sarvasiddhipradaya te || 1|| svanandavasine
    tubhyam brahmaputraya te namah | siddhibuddhipate te vai ganeshaya namo namah || 2|| herambaya namastubhyam
    namo yogamayaya ca | sarvadaye ca sarvesha sarvajnaya namo namah || 3|| nirgunaya namastubhyam sagunaya
    namo namah | gajananaya vai tubhyamabhedaya namo namah || 4|| shantirupaya shantaya shantidaya mahodara
    | mushakavahanayaiva ganapatyapriyaya te || 5|| anantanantarupaya bhaktasamrakshanaya ca | bhaktipriyaya
    devaya bhaktyadhinaya te namah || 6|| caturbahudharayaiva nagayajnopavitine | shurpakarnaya shuraya
    parashudhara te namah || 7|| vishnuputraya sarvesham pitre matre namo namah | vinayakaya vipranam
    putraya te namo namah || 8|| sarvesham garvahantre ca sarvebhyah sukhadaya te | lambodaraya vighnesha
    brahmanayaka te namah || 9|| kim stuvastvam ganadhisha yatra vedadayah prabho | shukashambhvadayashcaiva
    babhuvuh kunthitah param || 10|| avam garvayutau jatau brahmakarau vritha prabho | tatra tvaya ca
    vighnena kritam garvasya khandanam || 11|| sadhunam vighnaharta tvam shantiyogarthamanjasa | asadhunam
    vinashaya hyatastvam pranamamahe || 12|| vighnayuktataya dhundhe avabhyam yogasevaya | sakshatkarah
    kritastvam vai samicinamidam kritam || 13|| hridi cintamanim tvam ca pashyavah satatam prabho | atah
    sushubhado vighnah sanjato no gajanana || 14|| adhuna dehi vighnesha bhaktim te caranambuje | dridham
    yaya ca garvena na bhavavah samayutau || 15|| ityuktva tam pranamyaiva nanritaturmudanvitau | dhanyau
    prabruvatau dhanyau darshanadganapasya tau || 16|| brahmovaca | tatastau gananatho vai jagada bhaktibhavatah
    | drishtva premarasahladayuktau radhajanardanau || 17||
  devanagari: सर्वसिद्धिप्रदं पुष्टिपतिस्तोत्रम् श्रीगणेशाय नमः । राधाकृष्णावूचतुः । नमस्तुभ्यं पुष्टिपते
    नमः शङ्करसूनवे । ब्रह्मभूताय देवाय सर्वसिद्धिप्रदाय ते ॥ १॥ स्वानन्दवासिने तुभ्यं ब्रह्मपुत्राय ते
    नमः । सिद्धिबुद्धिपते ते वै गणेशाय नमो नमः ॥ २॥ हेरम्बाय नमस्तुभ्यं नमो योगमयाय च । सर्वादये च सर्वेश
    सर्वज्ञाय नमो नमः ॥ ३॥ निर्गुणाय नमस्तुभ्यं सगुणाय नमो नमः । गजाननाय वै तुभ्यमभेदाय नमो नमः ॥ ४॥ शान्तिरूपाय
    शान्ताय शान्तिदाय महोदर । मूषकवाहनायैव गाणपत्यप्रियाय ते ॥ ५॥ अनन्तानन्तरूपाय भक्तसंरक्षणाय च । भक्तिप्रियाय
    देवाय भक्त्यधीनाय ते नमः ॥ ६॥ चतुर्बाहुधरायैव नागयज्ञोपवीतिने । शूर्पकर्णाय शूराय परशुधर ते नमः ॥
    ७॥ विष्णुपुत्राय सर्वेषां पित्रे मात्रे नमो नमः । विनायकाय विप्राणां पुत्राय ते नमो नमः ॥ ८॥ सर्वेषां
    गर्वहन्त्रे च सर्वेभ्यः सुखदाय ते । लम्बोदराय विघ्नेश ब्रह्मनायक ते नमः ॥ ९॥ किम् स्तुवस्त्वां गणाधीश
    यत्र वेदादयः प्रभो । शुकशम्भ्वादयश्चैव बभूवुः कुण्ठिताः परम् ॥ १०॥ आवां गर्वयुतौ जातौ ब्रह्माकारौ
    वृथा प्रभो । तत्र त्वया च विघ्नेन कृतं गर्वस्य खण्डनम् ॥ ११॥ साधूनां विघ्नहर्ता त्वं शान्तियोगार्थमञ्जसा
    । असाधूनां विनाशाय ह्यतस्त्वां प्रणमामहे ॥ १२॥ विघ्नयुक्ततया ढुण्ढे आवाभ्यां योगसेवया । साक्षात्कारः
    कृतस्त्वं वै समीचीनमिदं कृतम् ॥ १३॥ हृदि चिन्तामणिं त्वां च पश्यावः सततं प्रभो । अतः सुशुभदो विघ्नः
    सञ्जातो नो गजानन ॥ १४॥ अधुना देहि विघ्नेश भक्तिं ते चरणाम्बुजे । दृढां यया च गर्वेण न भवावः समायुतौ
    ॥ १५॥ इत्युक्त्वा तं प्रणम्यैव ननृततुर्मुदान्वितौ । धन्यौ प्रब्रुवतौ धन्यौ दर्शनाद्गणपस्य तौ ॥ १६॥
    ब्रह्मोवाच । ततस्तौ गणनाथो वै जगाद भक्तिभावतः । दृष्ट्वा प्रेमरसाह्लादयुक्तौ राधाजनार्दनौ ॥ १७॥
