id: dhanyashtakam
category: stotram
name:
  english: Dhanyashtakam
content:
  english: tajjnanam prashamakaram yadindriyanam tajjneyam yadupanishatsu nishcitartham | te dhanya bhuvi
    paramarthanishcitehah sheshastu bhramanilaye paribhramantah || adau vijitya vishayanmadamoharaga dveshadishatruganamahritayogarajyah
    | jnatva matam samanubhuyaparatmavidya kantasukham vanagrihe vicaranti dhanyah || || tyaktva grihe
    ratimadhogatihetubhutam atmecchayopanishadartharasam pibantah | vitaspriha vishayabhogapade virakta
    dhanyashcaranti vijaneshu viraktasangah || || tyaktva mamahamiti bandhakare pade dve manavamanasadrishah
    samadarshinashca | kartaramanyamavagamya tadarpitani kurvanti karmaparipakaphalani dhanyah || || tyaktvishanatrayamavekshitamokshamarga
    bhaikshamritena parikalpitadehayatrah | jyotih paratparataram paramatmasanjnam dhanya dvijarahasi
    hridyavalokayanti || || nasanna sanna sadasanna mahasannacanu na stri pumanna ca napumsakamekabijam
    | yairbrahma tatsamamupasitamekacittaih dhanya virejurittarebhavapashabaddhah || || ajnanapankaparimagnamapetasaram
    duhkhalayam maranajanmajaravasaktam | samsarabandhanamanityamavekshya dhanya jnanasina tadavashirya
    vinishcayanti || || shantairananyamatibhirmadhurasvabhavaih ekatvanishcitamanobhirapetamohaih | sakam
    vaneshu vijitatmapadasvarupam tadvastu samyaganisham vimrishanti dhanyah || ahimiva janayogam sarvada
    varjayedyah kunapamiva sunarim tyaktukamo viragi | vishamiva vishayanyo manyamano durantan jayati
    paramahamso muktibhavam sameti || shardulavikriditavrittam sampurnam jagadeva nandanavanam sarve'pi
    kalpadruma gangam vari samastavarinivahah punyah samastah kriyah | vacah prakritasamskritah shrutishirovaranasi
    medini sarvavasthitirasya vastuvishaya drishte parabrahmani || || || iti shrimad shankaracaryaviracitam
    dhanyashtakam samaptam ||
  devanagari: तज्ज्ञानं प्रशमकरं यदिन्द्रियाणां तज्ज्ञेयं यदुपनिषत्सु निश्चितार्थम् । ते धन्या भुवि परमार्थनिश्चितेहाः
    शेषास्तु भ्रमनिलये परिभ्रमन्तः ॥ आदौ विजित्य विषयान्मदमोहराग द्वेषादिशत्रुगणमाहृतयोगराज्याः । ज्ञात्वा
    मतं समनुभूयपरात्मविद्या कान्तासुखं वनगृहे विचरन्ति धन्याः ॥ ॥ त्यक्त्वा गृहे रतिमधोगतिहेतुभूताम् आत्मेच्छयोपनिषदर्थरसं
    पिबन्तः । वीतस्पृहा विषयभोगपदे विरक्ता धन्याश्चरन्ति विजनेषु विरक्तसङ्गाः ॥ ॥ त्यक्त्वा ममाहमिति बन्धकरे
    पदे द्वे मानावमानसदृशाः समदर्शिनश्च । कर्तारमन्यमवगम्य तदर्पितानि कुर्वन्ति कर्मपरिपाकफलानि धन्याः
    ॥ ॥ त्यक्त्वीषणात्रयमवेक्षितमोक्षमर्गा भैक्षामृतेन परिकल्पितदेहयात्राः । ज्योतिः परात्परतरं परमात्मसञ्ज्ञं
    धन्या द्विजारहसि हृद्यवलोकयन्ति ॥ ॥ नासन्न सन्न सदसन्न महसन्नचाणु न स्त्री पुमान्न च नपुंसकमेकबीजम्
    । यैर्ब्रह्म तत्सममुपासितमेकचित्तैः धन्या विरेजुरित्तरेभवपाशबद्धाः ॥ ॥ अज्ञानपङ्कपरिमग्नमपेतसारं दुःखालयं
    मरणजन्मजरावसक्तम् । संसारबन्धनमनित्यमवेक्ष्य धन्या ज्ञानासिना तदवशीर्य विनिश्चयन्ति ॥ ॥ शान्तैरनन्यमतिभिर्मधुरस्वभावैः
    एकत्वनिश्चितमनोभिरपेतमोहैः । साकं वनेषु विजितात्मपदस्वरुपं तद्वस्तु सम्यगनिशं विमृशन्ति धन्याः ॥ अहिमिव
    जनयोगं सर्वदा वर्जयेद्यः कुणपमिव सुनारीं त्यक्तुकामो विरागी । विषमिव विषयान्यो मन्यमानो दुरन्तान्
    जयति परमहंसो मुक्तिभावं समेति ॥ शार्दूलविक्रीडितवृत्तम् सम्पूर्णं जगदेव नन्दनवनं सर्वेऽपि कल्पद्रुमा
    गाङ्गं वरि समस्तवारिनिवहः पुण्याः समस्ताः क्रियाः । वाचः प्राकृतसंस्कृताः श्रुतिशिरोवाराणसी मेदिनी
    सर्वावस्थितिरस्य वस्तुविषया दृष्टे परब्रह्मणि ॥ ॥ ॥ इति श्रीमद् शङ्कराचार्यविरचितं धन्याष्टकं समाप्तम्
    ॥
