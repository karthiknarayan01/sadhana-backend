id: shakyasimhastotram-5
category: stotram
name:
  english: shakyasimhastotram 5
  devanagari: शाक्यसिंहस्तोत्रम् ५
content:
  english: shakyasimhastotram 5 namami saugatam jinam lasadvitanabhasuram sahasrasuryarocisham shashankakotinirmalam
    | saromakupamandalad galatsusukshmatejasam sahasranemicakritanghripadmapanishobhitam || 1|| bhajami
    lokanayakam sashokaroganashakam jaravipadbhayantakam bhavarnavapratarakam | prabuddhapankajasanam
    vibuddhabodhikananam trilokalokabhavanam jagattrayaikapavanam || 2|| namo'stu palabhum jagaccakara
    janma manavam vishuddhashakyasagare payonidhau shashi yatha | kathasudhamayo'dhuna vinodayishyate
    bhavan trijalamohatamasam vinashayishyase jvalan || 3|| sthitaya bodhimandape hitaya lokasancayam
    jitaya marasainyakam shritaya sattrinasanam | sujatashakyabhupateryutaya paramarthakai
  devanagari: शाक्यसिंहस्तोत्रम् ५ नमामि सौगतं जिनं लसद्वितानभासुरं सहस्रसूर्यरोचिषं शशाङ्ककोटिनिर्मलम्
    । सरोमकूपमण्डलाद् गलत्सुसूक्ष्मतेजसं सहस्रनेमिचक्रिताङ्घ्रिपद्मपाणिशोभितम् ॥ १॥ भजामि लोकनायकं सशोकरोगनाशकं
    जराविपद्भयान्तकं भवार्णवप्रतारकम् । प्रबुद्धपङ्कजासनं विबुद्धबोधिकाननं त्रिलोकलोकभावनं जगत्त्रयैकपावनम्
    ॥ २॥ नमोऽस्तु पालभुं जगच्चकार जन्म मानवं विशुद्धशाक्यसागरे पयोनिधौ शशी यथा । कथासुधामयोऽधुना विनोदयिष्यते
    भवान् त्रिजालमोहतामसं विनाशयिष्यसे ज्वलन् ॥ ३॥ स्थिताय बोधिमण्डपे हिताय लोकसञ्चयं जिताय मारसैन्यकं
    श्रिताय सत्तृणासनम् । सुजातशाक्यभूपतेर्युताय पारमार्थकै
meaning: {}
