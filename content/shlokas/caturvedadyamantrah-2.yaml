id: caturvedadyamantrah-2
category: veda
name:
  english: caturvedadyamantrah
  devanagari: चतुर्वेदाद्यमन्त्राः
content:
  english: om | i̱she tvo̱rje tva̭ va̱yava̭ stha de̱vo va̭h savi̱ta prarpa̭yatu̱ shreshtha̭tamaya̱ karma̭na̱
    a pya̭yadhva maghnya̱ indra̭ya bha̱gam pra̱javati̭ranami̱va a̭ya̱kshma ma va̭ ste̱na i̭shata̱ maghasha̭
  devanagari: ॐ । इ॒षे त्वो॒र्जे त्वा॑ वा॒यव॑ स्थ दे॒वो वः॑ सवि॒ता प्रार्प॑यतु॒ श्रेष्ठ॑तमाय॒ कर्म॑ण॒
    आ प्या॑यध्व मघ्न्या॒ इन्द्रा॑य भा॒गं प्र॒जावती॑रनमी॒वा अ॑य॒क्ष्मा मा व॑ स्ते॒न ई॑शत॒ माघश॑
meaning: {}
