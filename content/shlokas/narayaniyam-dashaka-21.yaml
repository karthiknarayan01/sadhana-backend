id: narayaniyam-dashaka-21
category: stotram
name:
  english: Narayaniyam Dashaka 21
content:
  english: madhyodbhave bhuva ilavritanamni varshe gauripradhanavanitajanamatrabhaji | sharvena mantranutibhih
    samupasyamanam sankarshanatmakamadhishvara samshraye tvam || || bhadrashvanamaka ilavritapurvavarshe
    bhadrashravobhih rishibhih parinuyamanam | kalpantagudhanigamoddharanapravinam dhyayami deva hayashirshatanum
    bhavantam || || dhyayami dakshinagate harivarshavarshe prahladamukhyapurushaih parishevyamanam | uttungashantadhavalakritimekashuddha
    jnanapradam naraharim bhagavan bhavantam || || varshe pratici lalitatmani ketumale lilavisheshalalitasmitashobhanangam
    | lakshmya prajapatisutaishca nishevyamanam tasyah priyaya dhritakamatanum bhaje tvam || || ramye
    hyudici khalu ramyakanamni varshe tadvarshanathamanuvaryasaparyamanam | bhaktaikavatsalamamatsarahritsu
    bhantam matsyakritim bhuvananatha bhaje bhavantam || || varsham hiranmayasamahvayamauttaraha masinamadridhritikarmathakamathangam
    | samsevate pitriganapravaro'ryama yam tam tvam bhajami bhagavan paracinmayatman || || kincottareshu
    kurushu priyaya dharanya samsevito mahitamantranutiprabhedaih | damshtragraghrishtaghanaprishthagarishthavarshma
    tvam pahi bijnanuta yajnavarahamurte || || yamyam disham bhajati kimpurushakhyavarshe samsevito hanumata
    dridhabhaktibhaja | sitabhiramaparamadbhutarupashali ramatmakah parilasan paripahi vishno || || shrinaradena
    saha bharatakhandamukhyai stvam sankhyayoganutibhih samupasyamanah | akalpakalamiha sadhujanabhirakshi
    narayano narasakhah paripahi bhuman || || plakshe'rkarupamayi shalmala indurupam dvipe bhajanti kushanamani
    vahnirupam | kraunce'mburupamatha vayumayam ca shake tvam brahmarupamapi pushkaranamni lokah || ||
    sarvairdhruvadibhiruduprakarairgrahaishca pucchadikeshvavayaveshvabhikalpyamanaih | tvam shimshumaravapusha
    mahatamupasyah sandhyasu rundhi narakam mama sindhushayin || || patalamulabhuvi sheshatanum bhavantam
    lolaikakundalavirajisahasrashirsham | nilambaram dhritahalam bhujaganganabhi rjushtam bhaje hara gadan
    gurugehanatha ||
  devanagari: मध्योद्भवे भुव इलावृतनाम्नि वर्षे गौरीप्रधानवनिताजनमात्रभाजि । शर्वेण मन्त्रनुतिभिः समुपास्यमानं
    सङ्कर्षणात्मकमधीश्वर संश्रये त्वाम् ॥ ॥ भद्राश्वनामक इलावृतपूर्ववर्षे भद्रश्रवोभिः ऋषिभिः परिणूयमानम्
    । कल्पान्तगूढनिगमोद्धरणप्रवीणं ध्यायामि देव हयशीर्षतनुं भवन्तम् ॥ ॥ ध्यायामि दक्षिणगते हरिवर्षवर्षे
    प्रह्लादमुख्यपुरुषैः परिषेव्यमाणम् । उत्तुङ्गशान्तधवलाकृतिमेकशुद्ध ज्ञानप्रदं नरहरिं भगवन् भवन्तम्
    ॥ ॥ वर्षे प्रतीचि ललितात्मनि केतुमाले लीलाविशेषललितस्मितशोभनाङ्गम् । लक्ष्म्या प्रजापतिसुतैश्च निषेव्यमाणं
    तस्याः प्रियाय धृतकामतनुं भजे त्वाम् ॥ ॥ रम्ये ह्युदीचि खलु रम्यकनाम्नि वर्षे तद्वर्षनाथमनुवर्यसपर्यमाणम्
    । भक्तैकवत्सलममत्सरहृत्सु भान्तं मत्स्याकृतिं भुवननाथ भजे भवन्तम् ॥ ॥ वर्षं हिरण्मयसमाह्वयमौत्तराह
    मासीनमद्रिधृतिकर्मठकामठाङ्गम् । संसेवते पितृगणप्रवरोऽर्यमा यं तं त्वां भजामि भगवन् परचिन्मयात्मन्
    ॥ ॥ किञ्चोत्तरेषु कुरुषु प्रियया धरण्या संसेवितो महितमन्त्रनुतिप्रभेदैः । दंष्ट्राग्रघृष्टघनपृष्ठगरिष्ठवर्ष्मा
    त्वं पाहि बिज्ञनुत यज्ञवराहमूर्ते ॥ ॥ याम्यां दिशं भजति किम्पुरुषाख्यवर्षे संसेवितो हनुमता दृढभक्तिभाजा
    । सीताभिरामपरमाद्भुतरूपशाली रामात्मकः परिलसन् परिपाहि विष्णो ॥ ॥ श्रीनारदेन सह भारतखण्डमुख्यै स्त्वं
    साङ्ख्ययोगनुतिभिः समुपास्यमानः । आकल्पकालमिह साधुजनाभिरक्षी नारायणो नरसखः परिपाहि भूमन् ॥ ॥ प्लाक्षेऽर्करूपमयि
    शाल्मल इन्दुरूपं द्वीपे भजन्ति कुशनामनि वह्निरूपम् । क्रौञ्चेऽम्बुरूपमथ वायुमयं च शाके त्वां ब्रह्मरूपमपि
    पुष्करनाम्नि लोकाः ॥ ॥ सर्वैर्ध्रुवादिभिरुडुप्रकरैर्ग्रहैश्च पुच्छादिकेष्ववयवेष्वभिकल्प्यमानैः । त्वं
    शिंशुमारवपुषा महतामुपास्यः सन्ध्यासु रुन्धि नरकं मम सिन्धुशायिन् ॥ ॥ पातालमूलभुवि शेषतनुं भवन्तं लोलैककुण्डलविराजिसहस्रशीर्षम्
    । नीलाम्बरं धृतहलं भुजगाङ्गनाभि र्जुष्टं भजे हर गदान् गुरुगेहनाथ ॥
