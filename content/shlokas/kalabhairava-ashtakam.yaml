id: kalabhairava-ashtakam
category: stotram
name:
  english: Kalabhairava Ashtakam
  devanagari: आल्तेर्नतिवे
content:
  english: devarajasevyamanapavanamghripankajam vyalayajnasutramindushekharam kripakaram | naradadiyogivrindavanditam
    digambaram kashikapuradhinathakalabhairavam bhaje || 1|| bhanukotibhasvaram bhavabdhitarakam param
    nilakanthamipsitarthadayakam trilocanam | kalakalamambujakshamakshashulamaksharam kashikapuradhinathakalabhairavam
    bhaje || 2|| shulatamkapashadandapanimadikaranam shyamakayamadidevamaksharam niramayam | bhimavikramam
    prabhum vicitratandavapriyam kashikapuradhinathakalabhairavam bhaje || 3|| bhuktimuktidayakam prashastacaruvigraham
    bhaktavatsalam sthitam samastalokavigraham | (sthiram) vinikvananmanojnahemakinkinilasatkatim (nikvanan)
    kashikapuradhinathakalabhairavam bhaje || 4|| dharmasetupalakam tvadharmamarganashakam (nashanam)
    karmapashamocakam susharmadayakam vibhum | svarnavarnasheshapashashobhitamgamandalam (keshapasha,
    nirmalam) kashikapuradhinathakalabhairavam bhaje || 5|| ratnapadukaprabhabhiramapadayugmakam nityamadvitiyamishtadaivatam
    niramjanam | mrityudarpanashanam karaladamshtramokshadam (bhushanam) kashikapuradhinathakalabhairavam
    bhaje || 6|| attahasabhinnapadmajandakoshasamtatim drishtipatanashtapapajalamugrashasanam | ashtasiddhidayakam
    kapalamalikadharam kashikapuradhinathakalabhairavam bhaje || 7|| bhutasamghanayakam vishalakirtidayakam
    kashivasalokapunyapapashodhakam vibhum | (kashivasi) nitimargakovidam puratanam jagatpatim kashikapuradhinathakalabhairavam
    bhaje || 8|| || phalashrutih || kalabhairavashtakam pathamti ye manoharam jnanamuktisadhanam vicitrapunyavardhanam
    | shokamohadainyalobhakopatapanashanam (lobhadainya) prayanti kalabhairavamghrisannidhim nara dhruvam
    || (te prayanti kalabhairavamghrisannidhim dhruvam ||) || iti shrimatparamahamsaparivrajakacaryasya
    shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah kritau shri kalabhairavashtakam sampurnam
    || shankaracarya, Volume 18, page 89| there is a similar one in shivarahasya amshah 11 adhyayah 34
    | 53-61||
  devanagari: देवराजसेव्यमानपावनांघ्रिपङ्कजं व्यालयज्ञसूत्रमिन्दुशेखरं कृपाकरम् । नारदादियोगिवृन्दवन्दितं
    दिगंबरं काशिकापुराधिनाथकालभैरवं भजे ॥ १॥ भानुकोटिभास्वरं भवाब्धितारकं परं नीलकण्ठमीप्सितार्थदायकं
    त्रिलोचनम् । कालकालमंबुजाक्षमक्षशूलमक्षरं काशिकापुराधिनाथकालभैरवं भजे ॥ २॥ शूलटंकपाशदण्डपाणिमादिकारणं
    श्यामकायमादिदेवमक्षरं निरामयम् । भीमविक्रमं प्रभुं विचित्रताण्डवप्रियं काशिकापुराधिनाथकालभैरवं भजे
    ॥ ३॥ भुक्तिमुक्तिदायकं प्रशस्तचारुविग्रहं भक्तवत्सलं स्थितं समस्तलोकविग्रहम् । (स्थिरम्) विनिक्वणन्मनोज्ञहेमकिङ्किणीलसत्कटिं
    (निक्वणन्) काशिकापुराधिनाथकालभैरवं भजे ॥ ४॥ धर्मसेतुपालकं त्वधर्ममार्गनाशकं (नाशनं) कर्मपाशमोचकं सुशर्मदायकं
    विभुम् । स्वर्णवर्णशेषपाशशोभितांगमण्डलं (केशपाश, निर्मलं) काशिकापुराधिनाथकालभैरवं भजे ॥ ५॥ रत्नपादुकाप्रभाभिरामपादयुग्मकं
    नित्यमद्वितीयमिष्टदैवतं निरंजनम् । मृत्युदर्पनाशनं करालदंष्ट्रमोक्षदं (भूषणं) काशिकापुराधिनाथकालभैरवं
    भजे ॥ ६॥ अट्टहासभिन्नपद्मजाण्डकोशसंततिं दृष्टिपातनष्टपापजालमुग्रशासनम् । अष्टसिद्धिदायकं कपालमालिकाधरं
    काशिकापुराधिनाथकालभैरवं भजे ॥ ७॥ भूतसंघनायकं विशालकीर्तिदायकं काशिवासलोकपुण्यपापशोधकं विभुम् । (काशिवासि)
    नीतिमार्गकोविदं पुरातनं जगत्पतिं काशिकापुराधिनाथकालभैरवं भजे ॥ ८॥ ॥ फलश्रुतिः ॥ कालभैरवाष्टकं पठंति
    ये मनोहरं ज्ञानमुक्तिसाधनं विचित्रपुण्यवर्धनम् । शोकमोहदैन्यलोभकोपतापनाशनं (लोभदैन्य) प्रयान्ति कालभैरवांघ्रिसन्निधिं
    नरा ध्रुवम् ॥ (ते प्रयान्ति कालभैरवांघ्रिसन्निधिं ध्रुवम् ॥) ॥ इति श्रीमत्परमहंसपरिव्राजकाचर्यस्य
    श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्री कालभैरवाष्टकं सम्पूर्णम् ॥ षन्करचर्य,
    Vओलुमे १८, पगे ८९। ठेरे इस् अ सिमिलर् ओने इन् षिवरहस्य अंशः ११ अध्यायः ३४ । ५३-६१॥
