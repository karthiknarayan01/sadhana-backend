id: sri-rudram-namakam
category: veda
name:
  english: Sri Rudram Namakam
  devanagari: श्री रुद्रप्रश्नः (नमकम्)
content:
  english: '|| shri rudraprashnah (namakam) || || atha shrirudraprashnah || shri gurubhyo namah | harih
    o3m | om gananam tva ganapati havamahe kavim kavinamupamashravastamam | jyeshtharajam brahmanam brahmanaspata
    a nah shrinvannutibhissida sadanam || || om namo bhagavate rudraya || namaste rudramanyava utota ishave
    namah | namaste astu dhanvane bahubhyamuta te namah || 1|1|| yata ishuh shivatama shivam babhuva te
    dhanuh | shiva sharavya ya tava taya no rudra mridaya || 1|2|| ya te rudra shiva tanuraghora''papakashini
    | taya nastanuva shantamaya girishanjtabhicakashihi || 1|3|| yamishum girishanjta haste bibharshyastave
    | shivam giritra tam kuru ma hisih purusham jagat || 1|4|| shivena vacasa tva girishaccha vadamasi
    | yatha nah sarvamijjagadayakshmasumana asat || 1|5|| adhyavocadadhi vakta prathamo daivyo bhishak
    | ahishca sarvanjambhayantsarvashca yatudhanyah || 1|6|| asau yastamro aruna uta babhruh sumanjgalah
    | ye cemarudra abhito dikshu | shritah sahasrasho''vaishaheda imahe || 1|7|| asau yo''vasarpati nilagrivo
    vilohitah | utainam gopa adrishannadrishannudaharyah | utainam vishva bhutani sa drishto mridayati
    nah || 1|8|| namo astu nilagrivaya sahasrakshaya midhushe | atho ye asya satvano''ham tebhyo''karannamah
    || 1|9|| pramunjca dhanvanastvamubhayorartniyorjyam | yashca te hasta ishavah para ta bhagavo vapa
    || 1|10|| avatatya dhanustva sahasraksha shateshudhe | nishirya shalyanam mukha shivo nah sumana bhava
    || 1|11|| vijyam dhanuh kapardino vishalyo banava uta | aneshannasyeshava abhurasya nishanjgathih
    || 1|12|| ya te hetirmidhushtama haste babhuva te dhanuh | taya''smanvishvatastvamayakshmaya paribbhuja
    || 1|13|| namaste astvayudhayanatataya dhrishnave | ubhabhyamuta te namo bahubhyam tava dhanvane ||
    1|14|| pari te dhanvano hetirasmanvrunaktu vishvatah | atho ya ishudhistavare asmannidhehi tam ||
    1|15|| namaste astu bhagavan vishveshvaraya mahadevaya tryambakaya tripurantakaya trikagnikalaya kalagnirudraya
    nilakanthaya mrityunjayaya sarveshvaraya sadashivaya shrimanmahadevaya namah || 2|0|| namo hiranyabahave
    senanye dishanj ca pataye namo namo vrikshebhyo harikeshebhyah pashunam pataye namo namah saspincaraya
    tvishimate pathinam pataye namo namo babhlushaya vivyadhine''nnanam pataye namo namo harikeshayopavitine
    pushtanam pataye namo namo bhavasya hetyai jagatam pataye namo namo rudrayatatavine kshetranam pataye
    namo namah sutayahantyaya vananam pataye namo namah || 2|1|| rohitaya sthapataye vrikshanam pataye
    namo namo mantrine vanijaya kakshanam pataye namo namo bhuvanjtaye varivaskritayaushadhinam pataye
    namo nama uccairghoshayakrandayate pattinam pataye namo namah kritsnavitaya dhavate satvanam pataye
    namah || 2|2|| namah sahamanaya nivyadhina avyadhininam pataye namo namah kakubhaya nishangine stenanam
    pataye namo namo nishangina ishudhimate taskaranam pataye namo namo vancate parivancate stayunam pataye
    namo namo nicerave paricarayaranyanam pataye namo namah srikavibhyo jighasadbhyo mushnatam pataye
    namo namo ''simadbhyo naktam caradbhyah prakrintanam pataye namo nama ushnishine giricaraya kuluncanam
    pataye namo namah || 3|1|| ishumadbhyo dhanvavibhyashca vo namo nama atanvanebhyah pratidadhanebhyashca
    vo namo nama ayacchadbhyo visrijadbhyashca vo namo namo ''syadbhyo viddhyadbhyashca vo namo nama asinebhyah
    shayanebhyashca vo namo namah svapadbhyo jagradbhyashca vo namo nama stishthadbhyo dhavadbhyashca
    vo namo namah sabhabhyah sabhapatibhyashca vo namo namo ashvebhyo''shvapatibhyashca vo namah || 3|2||
    nama avyadhinibhyo vividhyantibhyashca vo namo nama uganabhyastrihatibhyashca vo namo namo gritsebhyo
    grutsapatibhyashca vo namo namo vratebhyo vratapatibhyashca vo namo namo ganebhyo ganapatibhyashca
    vo namo namo virupebhyo vishvarupebhyashca vo namo namo mahadbhyah kshullakebhyashca vo namo namo
    rathibhyo''rathebhyashca vo namo namo rathebhyah || 4|1|| rathapatibhyashca vo namo namah senabhyah
    senanibhyashca vo namo namah kshattribhyah sanjgrahitribhyashca vo namo nama stakshabhyo rathakarebhyashca
    vo namo namah kulalebhyah karmarebhyashca vo namo namah punjishtebhyo nishadebhyashca vo namo nama
    ishukridbhyo dhanvakridbhyashca vo namo namo mrugayubhyah shvanibhyashca vo namo namah shvabhyah shvapatibhyashca
    vo namah || 4|2|| namo bhavaya ca rudraya ca namah sharvaya ca pashupataye ca namo nilagrivaya ca
    shitikanthaya ca namah kapardine ca vyuptakeshaya ca namah sahasrakshaya ca shatadhanvane ca namo
    girishaya ca shipivishtaya ca namo midhushtamaya ceshumate ca namo hrasvaya ca vamanaya ca namo brihate
    ca varshiyase ca namo vriddhaya ca samvriddhvane ca || 5|1|| namo agriyaya ca prathamaya ca nama ashave
    cajiraya ca namh shighriyaya ca shibhyaya ca nam urmyaya cavasvanyaya ca namah srotasyaya ca dvipyaya
    ca || 5|2|| namo jyeshthaya ca kanishthaya ca namah purvajaya caparajaya ca namo madhyamaya capagalbhaya
    ca namo jaghanyaya ca budhniyaya ca namah sobhyaya ca pratisaryaya ca namo yamyaya ca kshemyaya ca
    nama urvaryaya ca khalyaya ca namah shlokyaya cavasanyaya ca namo vanyaya ca kakshyaya ca namah shravaya
    ca pratishravaya ca || 6|1|| nama ashushenaya cashurathaya ca namah shuraya cavabhindate ca namo varmine
    ca varuthine ca namo bilmine ca kavacine ca namah shrutaya ca shrutasenaya ca || 6|2|| namo dundubhyaya
    cahananyaya ca namo dhrishnave ca pramrishaya ca namo dutaya ca prahitaya ca namo nishangine ceshudhimate
    ca namastikshneshave cayudhine ca namah svayudhaya ca sudhanvane ca namah srutyaya ca pathyaya ca
    namah katyaya ca nipyaya ca namah sudyaya ca sarasyaya ca namo nadyaya ca vaishantaya ca || 7|1||
    namah kupyaya cavatyaya ca namo varshyaya cavarshyaya ca namo meghyaya ca vidyutyaya ca nama ighriyaya
    catapyaya ca namo vatyaya ca reshmiyaya ca namo vastavyaya ca vastupaya ca || 7|2|| namah somaya ca
    rudraya ca namastamraya carunaya ca namah shangaya ca pashupataye ca nama ugraya ca bhimaya ca namo
    agrevadhaya ca durevadhaya ca namo hantre ca haniyase ca namo vrikshebhyo harikeshebhyo namastaraya
    namah shambhave ca mayobhave ca namah shanjkaraya ca mayaskaraya ca namah shivaya ca shivataraya ca
    || 8|1|| namastirthyaya ca kulyaya ca namah paryaya cavaryaya ca namah prataranaya cottaranaya ca
    nama ataryaya caladyaya ca namah shashpyaya ca phenyaya ca namah sikatyaya ca pravahyaya ca || 8|2||
    nama irinyaya ca prapathyaya ca namah kishilaya ca kshayanaya ca namah kapardine ca pulastaye ca namo
    goshthyaya ca grihyaya ca namastalpyaya ca gehyaya ca namah katyaya ca gahvareshthaya ca namo hridayyaya
    ca niveshpyaya ca namah pasavyaya ca rajasyaya ca namah shushkyaya ca harityaya ca namo lopyaya colapyaya
    ca || 9|1|| nama urvyaya ca surmyaya ca namah parnyaya ca parnashadyaya ca namo''paguramanaya cabhighnate
    ca nama akhkhidate ca prakhkhidate ca namo vah kirikebhyo devana hridayebhyo namo vikshinakebhyo namo
    vicinvatkebhyo nama anirhatebhyo nama amivatkebhyah || 9|2|| drape andhasaspate daridrannilalohita
    | esham purushanamesham pashunam ma bhermaro mo esham kinjcanamamat || 10|1|| ya te rudra shiva tanuh
    shiva vishvaha bheshaji | shiva rudrasya bheshaji taya no mrida jivase || 10|2|| imarudraya tavase
    kapardine kshayadviraya prabharamahe matim | yatha nah shamasaddvipade catushpade vishvam pushtam
    grame asminnanaturam || 10|3|| mrida no rudrotano mayaskridhi kshayadviraya namasa vidhema te | yaccham
    ca yoshca manurayaje pita tadashyama tava rudra pranitau || 10|4|| ma no mahantamuta ma no arbhakam
    ma na ukshantamuta ma na ukshitam | ma no vadhih pitaram mota mataram priya ma nastanuvo rudra ririshah
    || 10|5|| manastoke tanaye ma na ayushi ma no goshu ma no ashveshu ririshah | viranma no rudra bhamito''vadhirhavishmanto
    namasa vidhema te || 10|6|| aratte goghna utta purushaghne kshayadviraya sumnamasme te astu | raksha
    ca no adhi ca deva bruhyatha ca nah sharma yaccha dvibarhah || 10|7|| stuhi shrutam gartasadam yuvanam
    mriganna bhimamupahatnumugram | mruda jaritre rudra stavano anyante asmannivapantu senah || 10|8||
    parino rudrasya hetirvrinaktu pari tveshasya durmatiraghayoh | ava sthira maghavadbhyastanushva midhvastokaya
    tanayaya mrudaya || 10|9|| midhushtama shivatama shivo nah sumana bhava | parame vruksha ayudham nidhaya
    krittim vasana acara pinakam vibhradagahi || 10|10|| vikirida vilohita namaste astu bhagavah | yaste
    sahasrahetayo''nyamasmannivapantu tah || 10|11|| sahasrani sahasradha bahuvostava hetayah | tasamishano
    bhagavah paracina mukha kridhi || 10|12|| sahasrani sahasrasho ye rudra adhi bhumyam | teshasahasrayojane''vadhanvani
    tanmasi || 11|1|| asmin mahatyarnave''ntarikshe bhava adhi || 11|2|| nilagrivah shitikanthah sharva
    adhah kshamacarah || 11|3|| nilagrivah shitikantha divarudra upashritah || 11|4|| ye vriksheshu saspinjara
    nilagriva vilohitah || 11|5|| ye bhutanamadhipatayo vishikhasah kapardinah || 11|6|| ye anneshu vividhyanti
    patreshu pibato janan || 11|7|| ye patham pathirakshaya ailabrida yavyudhah || 11|8|| ye tirthani
    pracaranti srikavanto nishanginah || 11|9|| ya etavantashca bhuyasashca disho rudra vitasthire teshasahasrayojane
    | avadhanvani tanmasi || 11|10|| namo rudrebhyo ye prithivyam ye | antarikshe ye divi yeshamannam
    vato varshamishavastebhyo dasha pracirdasha dakshina dasha praticirdashodicirdashordhvastebhyo namaste
    no mridayantu te yam dvishmo yashca no dveshti tam vo jambhe dadhami || 11|11|| tryambakam yajamahe
    sugandhim pushtivardhanam | urvarukamiva bandhananmrityormukshiya ma''mritat || 1|| yo rudro agnau
    yo apsu ya oshadhishu | yo rudro vishva bhuvana''''vivesha tasmai rudraya namo astu || 2|| tamushtuhi
    yah svishuh sudhanva yo vishvasya kshayati bheshajasya | yakshvamahe saumanasaya rudram namobhirdevamasuram
    duvasya || 3|| ayam me hasto bhagavanayam me bhagavattarah | ayam me vishvabheshajo''ya shivabhimarshanah
    || 4|| ye te sahasramayutam pasha mrityo martyaya hantave | tan yajnasya mayaya sarvanava yajamahe
    | mrityave svaha mrityave svaha || 5|| om namo bhagavate rudraya vishnave mrityurme pahi | prananam
    granthirasi rudro ma vishantakah | tenannenapyayasva || 6|| namo rudraya vishnave mrityurme pahi ||
    om shantih shantih shantih || || iti shrikrishnayajurvediya taittiriya samhitayam caturthakande panjcamah
    prapathakah ||'
  devanagari: ॥ श्री रुद्रप्रश्नः (नमकम्) ॥ ॥ अथ श्रीरुद्रप्रश्नः ॥ श्री गुरुभ्यो नमः । हरिः ओ३म् । ॐ
    गणानां त्वा गणपति हवामहे कविं कवीनामुपमश्रवस्तमम् । ज्येष्ठराजं ब्रह्मणां ब्रह्मणस्पत आ नः शृण्वन्नूतिभिस्सीद
    सादनम् ॥ ॥ ॐ नमो भगवते रुद्राय ॥ नमस्ते रुद्रमन्यव उतोत इषवे नमः । नमस्ते अस्तु धन्वने बाहुभ्यामुत
    ते नमः ॥ १।१॥ यात इषुः शिवतमा शिवं बभूव ते धनुः । शिवा शरव्या या तव तया नो रुद्र मृडय ॥ १।२॥ या ते
    रुद्र शिवा तनूरघोराऽपापकाशिनी । तया नस्तनुवा शन्तमया गिरिशञ्ज्ताभिचाकशीहि ॥ १।३॥ यामिषुं गिरिशञ्ज्त
    हस्ते बिभर्ष्यस्तवे । शिवां गिरित्र तां कुरु मा हिसीः पुरुषं जगत् ॥ १।४॥ शिवेन वचसा त्वा गिरिशाच्छा
    वदामसि । यथा नः सर्वमिज्जगदयक्ष्मसुमना असत् ॥ १।५॥ अध्यवोचदधि वक्ता प्रथमो दैव्यो भिषक् । अहीश्च सर्वाञ्जम्भयन्त्सर्वाश्च
    यातुधान्यः ॥ १।६॥ असौ यस्ताम्रो अरुण उत बभ्रुः सुमञ्ज्गलः । ये चेमारुद्रा अभितो दिक्षु । श्रिताः सहस्रशोऽवैषाहेड
    ईमहे ॥ १।७॥ असौ योऽवसर्पति नीलग्रीवो विलोहितः । उतैनं गोपा अदृशन्नदृशन्नुदहार्यः । उतैनं विश्वा भूतानि
    स दृष्टो मृडयाति नः ॥ १।८॥ नमो अस्तु नीलग्रीवाय सहस्राक्षाय मीढुषे । अथो ये अस्य सत्वानोऽहं तेभ्योऽकरन्नमः
    ॥ १।९॥ प्रमुञ्ज्च धन्वनस्त्वमुभयोरार्त्नियोर्ज्याम् । याश्च ते हस्त इषवः परा ता भगवो वप ॥ १।१०॥ अवतत्य
    धनुस्त्व सहस्राक्ष शतेषुधे । निशीर्य शल्यानां मुखा शिवो नः सुमना भव ॥ १।११॥ विज्यं धनुः कपर्दिनो विशल्यो
    बाणवा उत । अनेशन्नस्येषव आभुरस्य निषञ्ज्गथिः ॥ १।१२॥ या ते हेतिर्मीढुष्टम हस्ते बभूव ते धनुः । तयाऽस्मान्विश्वतस्त्वमयक्ष्मया
    परिब्भुज ॥ १।१३॥ नमस्ते अस्त्वायुधायानातताय धृष्णवे । उभाभ्यामुत ते नमो बाहुभ्यां तव धन्वने ॥ १।१४॥
    परि ते धन्वनो हेतिरस्मान्व्रुणक्तु विश्वतः । अथो य इषुधिस्तवारे अस्मन्निधेहि तम् ॥ १।१५॥ नमस्ते अस्तु
    भगवन् विश्वेश्वराय महादेवाय त्र्यम्बकाय त्रिपुरान्तकाय त्रिकाग्निकालाय कालाग्निरुद्राय नीलकण्ठाय मृत्युञ्जयाय
    सर्वेश्वराय सदाशिवाय श्रीमन्महादेवाय नमः ॥ २।०॥ नमो हिरण्यबाहवे सेनान्ये दिशाञ्ज् च पतये नमो नमो वृक्षेभ्यो
    हरिकेशेभ्यः पशूनां पतये नमो नमः सस्पिञ्चराय त्विषीमते पथीनां पतये नमो नमो बभ्लुशाय विव्याधिनेऽन्नानां
    पतये नमो नमो हरिकेशायोपवीतिने पुष्टानां पतये नमो नमो भवस्य हेत्यै जगतां पतये नमो नमो रुद्रायातताविने
    क्षेत्राणां पतये नमो नमः सूतायाहन्त्याय वनानां पतये नमो नमः ॥ २।१॥ रोहिताय स्थपतये वृक्षाणां पतये
    नमो नमो मन्त्रिणे वाणिजाय कक्षाणां पतये नमो नमो भुवञ्ज्तये वारिवस्कृतायौषधीनां पतये नमो नम उच्चैर्घोषायाक्रन्दयते
    पत्तीनां पतये नमो नमः कृत्स्नवीताय धावते सत्वनां पतये नमः ॥ २।२॥ नमः सहमानाय निव्याधिन आव्याधिनीनां
    पतये नमो नमः ककुभाय निषङ्गिणे स्तेनानां पतये नमो नमो निषङ्गिण इषुधिमते तस्कराणां पतये नमो नमो वञ्चते
    परिवञ्चते स्तायूनां पतये नमो नमो निचेरवे परिचरायारण्यानां पतये नमो नमः सृकाविभ्यो जिघासद्भ्यो मुष्णतां
    पतये नमो नमो ऽसिमद्भ्यो नक्तं चरद्भ्यः प्रकृन्तानां पतये नमो नम उष्णीषिणे गिरिचराय कुलुञ्चानां पतये
    नमो नमः ॥ ३।१॥ इषुमद्भ्यो धन्वाविभ्यश्च वो नमो नम आतन्वानेभ्यः प्रतिदधानेभ्यश्च वो नमो नम आयच्छद्भ्यो
    विसृजद्भ्यश्च वो नमो नमो ऽस्यद्भ्यो विद्ध्यद्भ्यश्च वो नमो नम आसीनेभ्यः शयानेभ्यश्च वो नमो नमः स्वपद्भ्यो
    जाग्रद्भ्यश्च वो नमो नम स्तिष्ठद्भ्यो धावद्भ्यश्च वो नमो नमः सभाभ्यः सभापतिभ्यश्च वो नमो नमो अश्वेभ्योऽश्वपतिभ्यश्च
    वो नमः ॥ ३।२॥ नम आव्याधिनीभ्यो विविध्यन्तीभ्यश्च वो नमो नम उगणाभ्यस्तृहतीभ्यश्च वो नमो नमो गृत्सेभ्यो
    ग्रुत्सपतिभ्यश्च वो नमो नमो व्रातेभ्यो व्रातपतिभ्यश्च वो नमो नमो गणेभ्यो गणपतिभ्यश्च वो नमो नमो विरूपेभ्यो
    विश्वरूपेभ्यश्च वो नमो नमो महद्भ्यः क्षुल्लकेभ्यश्च वो नमो नमो रथिभ्योऽरथेभ्यश्च वो नमो नमो रथेभ्यः
    ॥ ४।१॥ रथपतिभ्यश्च वो नमो नमः सेनाभ्यः सेननिभ्यश्च वो नमो नमः क्षत्तृभ्यः सञ्ज्ग्रहीतृभ्यश्च वो नमो
    नम स्तक्षभ्यो रथकारेभ्यश्च वो नमो नमः कुलालेभ्यः कर्मारेभ्यश्च वो नमो नमः पुञ्जिष्टेभ्यो निषादेभ्यश्च
    वो नमो नम इषुकृद्भ्यो धन्वकृद्भ्यश्च वो नमो नमो म्रुगयुभ्यः श्वनिभ्यश्च वो नमो नमः श्वभ्यः श्वपतिभ्यश्च
    वो नमः ॥ ४।२॥ नमो भवाय च रुद्राय च नमः शर्वाय च पशुपतये च नमो नीलग्रीवाय च शितिकण्ठाय च नमः कपर्दिने
    च व्युप्तकेशाय च नमः सहस्राक्षाय च शतधन्वने च नमो गिरिशाय च शिपिविष्टाय च नमो मीढुष्टमाय चेषुमते च
    नमो ह्रस्वाय च वामनाय च नमो बृहते च वर्षीयसे च नमो वृद्धाय च संवृद्ध्वने च ॥ ५।१॥ नमो अग्रियाय च प्रथमाय
    च नम आशवे चाजिराय च नम्ः शीघ्रियाय च शीभ्याय च नम् ऊर्म्याय चावस्वन्याय च नमः स्रोतस्याय च द्वीप्याय
    च ॥ ५।२॥ नमो ज्येष्ठाय च कनिष्ठाय च नमः पूर्वजाय चापरजाय च नमो मध्यमाय चापगल्भाय च नमो जघन्याय च बुध्नियाय
    च नमः सोभ्याय च प्रतिसर्याय च नमो याम्याय च क्षेम्याय च नम उर्वर्याय च खल्याय च नमः श्लोक्याय चावसान्याय
    च नमो वन्याय च कक्ष्याय च नमः श्रवाय च प्रतिश्रवाय च ॥ ६।१॥ नम आशुषेणाय चाशुरथाय च नमः शूराय चावभिन्दते
    च नमो वर्मिणे च वरूथिने च नमो बिल्मिने च कवचिने च नमः श्रुताय च श्रुतसेनाय च ॥ ६।२॥ नमो दुन्दुभ्याय
    चाहनन्याय च नमो धृष्णवे च प्रमृशाय च नमो दूताय च प्रहिताय च नमो निषङ्गिणे चेषुधिमते च नमस्तीक्ष्णेषवे
    चायुधिने च नमः स्वायुधाय च सुधन्वने च नमः स्रुत्याय च पथ्याय च नमः काट्याय च नीप्याय च नमः सूद्याय
    च सरस्याय च नमो नाद्याय च वैशन्ताय च ॥ ७।१॥ नमः कूप्याय चावट्याय च नमो वर्ष्याय चावर्ष्याय च नमो मेघ्याय
    च विद्युत्याय च नम ईघ्रियाय चातप्याय च नमो वात्याय च रेष्मियाय च नमो वास्तव्याय च वास्तुपाय च ॥ ७।२॥
    नमः सोमाय च रुद्राय च नमस्ताम्राय चारुणाय च नमः शङ्गाय च पशुपतये च नम उग्राय च भीमाय च नमो अग्रेवधाय
    च दूरेवधाय च नमो हन्त्रे च हनीयसे च नमो वृक्षेभ्यो हरिकेशेभ्यो नमस्ताराय नमः शम्भवे च मयोभवे च नमः
    शञ्ज्कराय च मयस्कराय च नमः शिवाय च शिवतराय च ॥ ८।१॥ नमस्तीर्थ्याय च कूल्याय च नमः पार्याय चावार्याय
    च नमः प्रतरणाय चोत्तरणाय च नम आतार्याय चालाद्याय च नमः शष्प्याय च फेन्याय च नमः सिकत्याय च प्रवाह्याय
    च ॥ ८।२॥ नम इरिण्याय च प्रपथ्याय च नमः किशिलाय च क्षयणाय च नमः कपर्दिने च पुलस्तये च नमो गोष्ठ्याय
    च गृह्याय च नमस्तल्प्याय च गेह्याय च नमः काट्याय च गह्वरेष्ठाय च नमो हृदय्याय च निवेष्प्याय च नमः
    पासव्याय च रजस्याय च नमः शुष्क्याय च हरित्याय च नमो लोप्याय चोलप्याय च ॥ ९।१॥ नम ऊर्व्याय च सूर्म्याय
    च नमः पर्ण्याय च पर्णशद्याय च नमोऽपगुरमाणाय चाभिघ्नते च नम आख्खिदते च प्रख्खिदते च नमो वः किरिकेभ्यो
    देवाना हृदयेभ्यो नमो विक्षीणकेभ्यो नमो विचिन्वत्केभ्यो नम आनिर्हतेभ्यो नम आमीवत्केभ्यः ॥ ९।२॥ द्रापे
    अन्धसस्पते दरिद्रन्नीललोहित । एषां पुरुषाणामेषां पशूनां मा भेर्मारो मो एषां किञ्ज्चनाममत् ॥ १०।१॥
    या ते रुद्र शिवा तनूः शिवा विश्वाह भेषजी । शिवा रुद्रस्य भेषजी तया नो मृड जीवसे ॥ १०।२॥ इमारुद्राय
    तवसे कपर्दिने क्षयद्वीराय प्रभरामहे मतिम् । यथा नः शमसद्द्विपदे चतुष्पदे विश्वं पुष्टं ग्रामे आस्मिन्ननातुरम्
    ॥ १०।३॥ मृडा नो रुद्रोतनो मयस्कृधि क्षयद्वीराय नमसा विधेम ते । यच्छं च योश्च मनुरायजे पिता तदश्याम
    तव रुद्र प्रणीतौ ॥ १०।४॥ मा नो महान्तमुत मा नो अर्भकं मा न उक्षन्तमुत मा न उक्षितम् । मा नो वधीः पितरं
    मोत मातरं प्रिया मा नस्तनुवो रुद्र रीरिषः ॥ १०।५॥ मानस्तोके तनये मा न आयुषि मा नो गोषु मा नो अश्वेषु
    रीरिषः । वीरान्मा नो रुद्र भामितोऽवधीर्हविष्मन्तो नमसा विधेम ते ॥ १०।६॥ आरात्ते गोघ्न उत्त पूरुषघ्ने
    क्षयद्वीराय सुम्नमस्मे ते अस्तु । रक्षा च नो अधि च देव ब्रूह्यथा च नः शर्म यच्छ द्विबर्हाः ॥ १०।७॥
    स्तुहि श्रुतं गर्तसदं युवानं मृगन्न भीममुपहत्नुमुग्रम् । म्रुडा जरित्रे रुद्र स्तवानो अन्यन्ते अस्मन्निवपन्तु
    सेनाः ॥ १०।८॥ परिणो रुद्रस्य हेतिर्वृणक्तु परि त्वेषस्य दुर्मतिरघायोः । अव स्थिरा मघवद्भ्यस्तनुष्व
    मीढ्वस्तोकाय तनयाय म्रुडय ॥ १०।९॥ मीढुष्टम शिवतम शिवो नः सुमना भव । परमे व्रुक्ष आयुधं निधाय कृत्तिं
    वसान आचर पिनाकं विभ्रदागहि ॥ १०।१०॥ विकिरिद विलोहित नमस्ते अस्तु भगवः । यास्ते सहस्रहेतयोऽन्यमस्मन्निवपन्तु
    ताः ॥ १०।११॥ सहस्राणि सहस्रधा बाहुवोस्तव हेतयः । तासामीशानो भगवः पराचीना मुखा कृधि ॥ १०।१२॥ सहस्राणि
    सहस्रशो ये रुद्रा अधि भूम्याम् । तेषासहस्रयोजनेऽवधन्वानि तन्मसि ॥ ११।१॥ अस्मिन् महत्यर्णवेऽन्तरिक्षे
    भवा अधि ॥ ११।२॥ नीलग्रीवाः शितिकण्ठाः शर्वा अधः क्षमाचराः ॥ ११।३॥ नीलग्रीवाः शितिकण्ठा दिवरुद्रा उपश्रिताः
    ॥ ११।४॥ ये वृक्षेषु सस्पिञ्जरा नीलग्रीवा विलोहिताः ॥ ११।५॥ ये भूतानामधिपतयो विशिखासः कपर्दिनः ॥ ११।६॥
    ये अन्नेषु विविध्यन्ति पात्रेषु पिबतो जनान् ॥ ११।७॥ ये पथां पथिरक्षय ऐलबृदा यव्युधः ॥ ११।८॥ ये तीर्थानि
    प्रचरन्ति सृकावन्तो निषङ्गिणः ॥ ११।९॥ य एतावन्तश्च भूयासश्च दिशो रुद्रा वितस्थिरे तेषासहस्रयोजने ।
    अवधन्वानि तन्मसि ॥ ११।१०॥ नमो रुद्रेभ्यो ये पृथिव्यां ये । अन्तरिक्षे ये दिवि येषामन्नं वातो वर्षमिषवस्तेभ्यो
    दश प्राचीर्दश दक्षिणा दश प्रतीचीर्दशोदीचीर्दशोर्ध्वास्तेभ्यो नमस्ते नो मृडयन्तु ते यं द्विष्मो यश्च
    नो द्वेष्टि तं वो जम्भे दधामि ॥ ११।११॥ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् । उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय
    माऽमृतात् ॥ १॥ यो रुद्रो अग्नौ यो अप्सु य ओषधीषु । यो रुद्रो विश्वा भुवनाऽऽविवेश तस्मै रुद्राय नमो
    अस्तु ॥ २॥ तमुष्टुहि यः स्विषुः सुधन्वा यो विश्वस्य क्षयति भेषजस्य । यक्ष्वामहे सौमनसाय रुद्रं नमोभिर्देवमसुरं
    दुवस्य ॥ ३॥ अयं मे हस्तो भगवानयं मे भगवत्तरः । अयं मे विश्वभेषजोऽय शिवाभिमर्शनः ॥ ४॥ ये ते सहस्रमयुतं
    पाशा मृत्यो मर्त्याय हन्तवे । तान् यज्ञस्य मायया सर्वानव यजामहे । मृत्यवे स्वाहा मृत्यवे स्वाहा ॥
    ५॥ ॐ नमो भगवते रुद्राय विष्णवे मृत्युर्मे पाहि । प्राणानां ग्रन्थिरसि रुद्रो मा विशान्तकः । तेनान्नेनाप्यायस्व
    ॥ ६॥ नमो रुद्राय विष्णवे मृत्युर्मे पाहि ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ इति श्रीकृष्णयजुर्वेदीय तैत्तिरीय
    संहितायां चतुर्थकाण्डे पञ्ज्चमः प्रपाठकः ॥
