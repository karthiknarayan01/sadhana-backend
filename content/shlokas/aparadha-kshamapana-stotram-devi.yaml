id: aparadha-kshamapana-stotram-devi
category: stotram
name:
  english: Aparadha Kshamapana Stotram (Devi)
  devanagari: अपराधक्षमापणस्तोत्रम्
content:
  english: om aparadhashatam kritva jagadambeti coccaret | yam gatim samavapnoti na tam brahmadayah surah
    || 1|| saparadho'smi sharanam praptastvam jagadambike | idanimanukampyo'ham yathecchasi tatha kuru
    || 2|| ajnanadvismriterbhrantya yannyunamadhikam kritam | tatsarvam kshamyatam devi prasida parameshvari
    || 3|| kameshvari jaganmatah saccidanandavigrahe | grihanarcamimam pritya prasida parameshvari ||
    4|| sarvarupamayi devi sarvam devimayam jagat | ato'ham vishvarupam tvam namami parameshvarim || 5||
    yadaksharam paribhrashtam matrahinanca yadbhavet | purnam bhavatu tat sarvam tvatprasadanmaheshvari
    || 6|| yadatra pathe jagadambike maya visargabindvaksharahinamiritam | tadastu sampurnatamam prasadatah
    sankalpasiddhishva sadaiva jayatam || 7|| yanmatrabindubindudvitayapadapadadvandvavarnadihinam bhaktyabhaktyanupurvam
    prasabhakritivashat vyakttamavyakttamamba | mohadajnanato va pathitamapathitam sampratam te stave'smin
    tat sarvam sangamastam bhagavati varade tvatprasadat prasida || 8|| prasida bhagavatyamba prasida
    bhaktavatsale | prasadam kuru me devi durge devi namo'stu te || 9|| || iti aparadhakshamapanastotram
    samaptam||
  devanagari: ॐ अपराधशतं कृत्वा जगदम्बेति चोच्चरेत् । यां गतिं समवाप्नोति न तां ब्रह्मादयः सुराः ॥ १॥
    सापराधोऽस्मि शरणं प्राप्तस्त्वां जगदम्बिके । इदानीमनुकम्प्योऽहं यथेच्छसि तथा कुरु ॥ २॥ अज्ञानाद्विस्मृतेर्भ्रान्त्या
    यन्न्यूनमधिकं कृतम् । तत्सर्वं क्षम्यतां देवि प्रसीद परमेश्वरि ॥ ३॥ कामेश्वरि जगन्मातः सच्चिदानन्दविग्रहे
    । गृहाणार्चामिमां प्रीत्या प्रसीद परमेश्वरि ॥ ४॥ सर्वरूपमयी देवी सर्वं देवीमयं जगत् । अतोऽहं विश्वरूपां
    त्वां नमामि परमेश्वरीम् ॥ ५॥ यदक्षरं परिभ्रष्टं मात्राहीनञ्च यद्भवेत् । पूर्णं भवतु तत् सर्वं त्वत्प्रसादान्महेश्वरि
    ॥ ६॥ यदत्र पाठे जगदम्बिके मया विसर्गबिन्द्वक्षरहीनमीरितम् । तदस्तु सम्पूर्णतमं प्रसादतः सङ्कल्पसिद्धिश्व
    सदैव जायताम् ॥ ७॥ यन्मात्राबिन्दुबिन्दुद्वितयपदपदद्वन्द्ववर्णादिहीनं भक्त्याभक्त्यानुपूर्वं प्रसभकृतिवशात्
    व्यक्त्तमव्यक्त्तमम्ब । मोहादज्ञानतो वा पठितमपठितं साम्प्रतं ते स्तवेऽस्मिन् तत् सर्वं साङ्गमास्तां
    भगवति वरदे त्वत्प्रसादात् प्रसीद ॥ ८॥ प्रसीद भगवत्यम्ब प्रसीद भक्तवत्सले । प्रसादं कुरु मे देवि दुर्गे
    देवि नमोऽस्तु ते ॥ ९॥ ॥ इति अपराधक्षमापणस्तोत्रं समाप्तम्॥
