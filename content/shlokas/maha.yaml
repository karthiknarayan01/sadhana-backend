id: maha
category: upanishad
name:
  english: maha
  devanagari: मह
content:
  english: stvanirakaranam mestu tadatmani nirate ya upanishatsu dharmaste mayi santu te mayi santu||
    om shantih shantih shantih || athato mahopanishadam vyakhyasyamastadahureko ha vai narayana asinna
    brahma neshano napo nagnishomau neme dyavaprithivi na nakshatrani na suryo na candramah | sa ekaki
    na ramate | tasya dhyanantahsthasya yajnastomamucyate | tasminpurushashcaturdasha jayante | eka kanya
    | dashendriyani mana ekadasham tejah | dvadasho'hankarah | trayodashakah pranah | caturdasha atma
    | pancadashi buddhih | bhutani panca tanmatrani | panca mahabhutani | sa ekah pancavimshatih purushah
    | tatpurusham purusho niveshya nasya pradhanasamvatsara jayante | samvatsaradadhijayante | atha punareva
    narayanah so'nyatkamo manasadhyayata | tasya dhyanantahsthasya lalatattryakshah shulapanih purusho
    jayate | bibhracchriyam yashah satyam brahmacaryam tapo vairagyam mana aishvaryam sapranava vyahritaya
    rigyajuhsamatharvangirasah sarvani chandamsi tanyange samashritani | tasmadishano mahadevo mahadevah
    | atha punareva narayanah so'nyatkamo manasadhyayata | tasya dhyanantahsthasya lalatatsvedo'papat
    | ta imah pratata apah | tatastejo hiranmayamandalam | tatra brahma caturmukho'jayata | so'dhyayt
    | purvabhimukho bhutva bhuriti vyahritirgayatram chanda rigvedo'gnirdevata | pashcimabhimukho bhutva
    bhuvariti vyahritistraishtubham chando yajurvedo vayurdevata | uttarabhimukho bhutva svariti vyahritirjagratam
    chandah samavedah suryo devata | dakshinabhimukho bhutva maharitivyahritiranushtabha chando'tharvavedah
    somo devata | sahasrashirsham devam sahasraksham vishvasambhuvam | vishvatah paramam nityam vishvam
    narayanam harim | vishvamevedam purushastadvishvamupajivati | patim vishveshvaram devam samudre vishvarupinam
    | padmakoshapratikasham lambatyakoshasamnibham | hridayam capyadhomukham santatyai sitkarabhishca
    | tasya madhye mahanarcirvishvarcirvishvatomukham | tasya madhye vahnishikha aniyordhva vyavasthita
    | tasyah shikhaya madhye paramatma vyavasthita | sa brahma sa ishanah sendrah so'ksharah paramah svaraditi
    mahopanishat || iti prathamodhyayah || 1|| shuko nama mahatejah svarupanandatatparah | jatamatrena
    munirad yatsatyam tadavaptavan || 1|| tenasau svavivekena svayameva mahamanah | pravicarya ciram sadhu
    svatmanishcayamaptavan || 2|| anakhyatvadagamyatvanmanahshashthendriyasthiteh | cinmatramevamatmanurakashadapi
    sukshmakah || 3|| cidanoh paramasyantah kotibrahmandarenavah | utpattisthitimabhyetya liyante shaktiparyayat
    || 4|| akasham bahyashunyatvadanakasham tu cittvatah | na kimcidyadanirdeshyam vastu satteti kimcana
    || 5|| cetano'sau prakashatvadvedyabhavacchilopamah | svatmani vyomani svasthe jagadunmeshacitrakrit
    || 6|| tadbhamatramidam vishvamiti na syattatah prithak | jagadbhedo'pi tadbhanamiti bhedo'pi tanmayah
    || 7|| sarvagah sarvasambandho gatyabhavanna gacchati | nastyasavashrayabhavatsadrupatvadathasti ca
    || 8|| vijnanamanandam brahma raterdatuh parayanam | sarvasamkalpasamnyasashcetasa yatparigrahah ||
    9|| jagratah pratyayabhavam yasyahuh pratyayam budhah | yatsamkocavikasabhyam jagatpralayasrishtayah
    || 10|| nishtha vedantavakyanamatha vacamagocarah | aham saccitparanandabrahmaivasmi na cetarah ||
    11|| svayaiva sukshmaya buddhya sarvam vijnatavanchukah | svayam prapte pare vastunyavishrantamanah
    sthitah || 12|| idam vastviti vishvasam nasavatmanyupayayau | kevalam viraramasya ceto vishayacapalam
    | bhogebhyo bhuribhangebhyo dharabhya iva catakah || 13|| ekada so'malaprajno meravekantasamsthitah
    | papraccha pitaram bhaktya krishnadvaipayanam munim || 14|| samsaradambaramidam kathamabhyutthitam
    mune | katham ca prashamam yati kim yatkasya kada vada || 15|| evam prishtena munina vyasenakhilamatmaje
    | yathavadakhilam proktam vaktavyam viditatmana || 16|| ajnasisham purvamevamahamityatha tatpituh
    | sa shukah svakaya buddhya na vakyam bahu manyate || 17|| vyaso'pi bhagavanbuddhva putrabhiprayamidrisham
    | pratyuvaca punah putram naham janami tattvatah || 18|| janako nama bhupalo vidyate mithilapure |
    yathavadvettyasau vedyam tasmatsarvamavapsyasi || 19|| pitretyuktah shukah prayatsumerorvasudhatalam
    | videhanagarim prapa janakenabhipalitam || 20|| avedito'sau yashtikairjanakaya mahatmane | dvari
    vyasasuto rajanchuko'tra sthitavaniti || 21|| jijnasartham shukasyasavastamevetyavajnaya | uktva babhuva
    janakastushnim sapta dinanyatha || 22|| tatah praveshayamasa janakah shukamangane | tatrahani sa saptaiva
    tathaivavasadunmanah || 23|| tatah praveshayamasa janako'ntahpurajire | raja na drishyate tavaditi
    saptadinani tam || 24|| tatronmadabhih kantabhirbhojanairbhogasamcayaih | janako lalayamasa shukam
    shashinibhananam || 25|| te bhogastani bhojyani vyasaputrasya tanmanah | najahvurmandapavano baddhapithamivacalam
    || 26|| kevalam susamah svaccho mauni muditamanasah | sampurna iva shitamshuratishthadamalah shukah
    || 27|| parijnatasvabhavam tam shukam sa janako nripah | aniya muditatmanamavalokya nanama ha || 28||
    nihsheshitajagatkaryah praptakhilamanorathah | kimipsitam tavetyaha kritasvagata aha tam || 29|| samsaradambaramidam
    kathamabhyutthitam guro | katham prashamamayati yathavatkathayashu me ||30|| yathavadakhilam proktam
    janakena mahatmana | tadeva tatpura proktam tasya pitra mahadhiya || 31|| svayameva maya purvamabhijnatam
    visheshatah | etadeva hi prishtena pitra me samudahritam || 32|| bhavatapyesha evarthah kathito vagvidam
    vara | esha eva hi vakyarthah shastreshu paridrishyate || 33|| manovikalpasamjatam tadvikalpaparikshayat
    | kshiyate dagdhasamsaro nihsara iti nishcitah || 34|| tatkimetanmahabhaga satyam bruhi mamacalam
    | tvatto vishramamapnomi cetasa bhramata jagat || 35|| shrunu tavadidanim tvam kathyamanamidam maya
    | shrishukam jnanavistaram buddhisarantarantaram || 36|| yadvijnanatpumansadyo jivanmuktatvamapnuyat
    || 37|| drishyam nastiti bodhena manaso drishyamarjanam | sampannam cettadutpanna para nirvananirvritih
    || 38|| asheshena parityago vasanayam ya uttamah | moksha ityucyate sadbhih sa eva vimalakramah ||
    39|| ye shuddhavasana bhuyo na janmanarthabhaginah | jnatajneyasta ucyante jivanmukta mahadhiyah ||
    40|| padarthabhavanadardhyam bandha ityabhidhiyate | vasanatanavam brahmanmoksha ityabhidhiyate ||
    41|| tapah prabhritina yasmai hetunaiva vina punah | bhoga iha na rocante sa jivanmukta ucyate ||
    42|| apatatsu yathakalam sukhaduhkheshvanaratah | na hrishyati glayati yah sa jivanmukta ucyate ||
    43|| harshamarshabhayakrodhakamakarpanyadrishtibhih | na paramrishyate yo'ntah sa jivanmukta ucyate
    || 44|| ahamkaramayim tyaktva vasanam lilayaiva yah | tishthati dhyeyasamtyagi sa jivanmukta ucyate
    || 45|| ipsitanipsite na sto yasyantarvartidrishtishu | sushuptivadyashcarati sa jivanmukta ucyate
    || 46|| adhyatmaratirasinah purnah pavanamanasah | praptanuttamavishrantirna kimcidiha vanchati |
    yo jivati gatasnehah sa jivanmukta ucyate || 47|| samvedyena hridakashe managapi na lipyate | yasyasavajada
    samvitsa jivanmukta ucyate || 48|| ragadveshau sukham duhkham dharmadharmau phalaphale | yah karotyanapekshyaiva
    sa jivanmukta ucyate || 49|| maunavannirahambhavo nirmano muktamatsarah | yah karoti gatodvegah sa
    jivanmukta ucyate || 50|| sarvatra vigatasneho yah sakshivadavasthitah | niriccho vartate karye sa
    jivanmukta ucyate || 51|| yena dharmamadharmam ca manomananamihitam | sarvamantah parityaktam sa jivanmukta
    ucyate || 52|| yavati drishyakalana sakaleyam vilokyate | sa yena sushthu samtyakta sa jivanmukta
    ucyate || 53|| katvamlalavanam tiktamamrishtam mrishtameva ca | samameva ca yo bhunkte sa jivanmukta
    ucyate || 54|| jaramaranamapacca rajyam daridryameva ca | ramyamityeva yo bhunkte sa jivanmukta ucyate
    || 55|| dharmadharmau sukham duhkham tatha maranajanmani | dhiya yena susamtyaktam sa jivanmukta ucyate
    || 56|| udveganandarahitah samaya svacchaya dhiya | na shocate na codeti sa jivanmukta ucyate || 57||
    sarvecchah sakalah shankah sarvehah sarvanishcayah | dhiya yena parityaktah sa jivanmukta ucyate ||
    58|| janmasthitivinasheshu sodayastamayeshu ca | samameva mano yasya sa jivanmukta ucyate || 59||
    na kimcana dveshti tatha na kimcidapi kankshati | bhunkte yah prakritanbhogansa jivanmukta ucyate
    || 60|| shantasamsarakalanah kalavanapi nishkalah | yah sacitto'pi nishcittah sa jivanmukta ucyate
    || 61|| yah samastarthajaleshu vyavaharyapi nihsprihah | parartheshviva purnatma sa jivanmukta ucyate
    || 62|| jivanmuktapadam tyaktva svadehe kalasatkrite | vishatyadehamuktatvam pavano'spandatamiva ||
    63|| videhamukto nodeti nastameti na shamyati | na sannasanna durastho na caham na ca netarah || 64||
    tatah stimitagambhiram na tejo na tamastatam | anakhyamanabhivyaktam satkimcidavashishyate || 65||
    na shunyam napi cakaro na drishyam napi darshanam | na ca bhutapadarthaughasadanantataya sthitam ||
    66|| kimapyavyapadeshatma purnatpurnatarakritih | na sannasanna sadasanna bhavo bhavanam na ca ||
    67|| cinmatram caityarahitamanantamajaram shivam | anadimadhyaparyantam yadanadi niramayam || 68||
    drashtridarshanadrishyanam madhye yaddarshanam smritam | natah parataram kimcinnishcayo'styaparo mune
    || 69|| svayameva tvaya jnatam gurutashca punah shrutam | svasamkalpavashadbaddho nihsamkalpadvimucyate
    || 70|| tena svayam tvaya jnatam jneyam yasya mahatmanah | bhogebhyo hyaratirjata drishyadva sakaladiha
    || 71|| praptam praptavyamakhilam bhavata purnacetasa | svarupe tapasi brahmanmuktastvam bhrantimutsrija
    || 72|| atibahyam tatha bahyamantarabhyantaram dhiyah | shuka pashyanna pashyestvam sakshi sampurnakevalah
    || 73|| vishashrama shukastushnim svasthe paramavastuni | vitashokabhayayaso nirihashchinnasamshayah
    || 74|| jagama shikharam meroh samadhyarthamakhanditam || 75|| tatra varshasahasrani nirvikalpasamadhina
    | deshe sthitva shashamasavatmanyasnehadipavat || 76|| vyapagatakalanakalankashuddhah svayamamalatmani
    pavane pade'sau | salilakana ivambudhau mahatma vigalitavasanamekatam jagama || 77|| iti mahopanishat
    | iti dvitiyo'dhyayah || 2|| nidagho nama munirat praptavidyashca balakah | vihritastirthayatrartham
    pitranujnatavansvayam || 1|| sardhatrikotitirtheshu snatva grihamupagatah | svodantam kathayamasa
    ribhum natva mahayashah || 2|| sardhatrikotitirtheshu snanapunyaprabhavatah | pradurbhutomanasi me
    vicarah so'yamidrishah || 3|| jayate mriyate loko mriyate jananaya ca | asthirah sarva eveme sacaracaraceshtitah
    | sarvapadam padam papa bhava vibhavabhumayah || 4|| ayahshalakasadrishah parasparamasanginah | shushyante
    kevala bhava manahkalpanayanaya || 5|| bhaveshvaratirayata pathikasya marushviva | shamyatidam katham
    duhkhamiti tapto'smi cetasa || 6|| cintanicayacakrani nanandaya dhanani me | samprasutakalatrani grihanyugrapadamiva
    || 7|| iyamasmi sthitodara samsare paripelava | shrirmune parimohaya sapi nunam na sharmada || 8||
    ayuh pallavakonagralambambukanabhanguram | unmatta iva samtyajya yamyakande sharirakam || 9|| vishayashi
    vishasangaparijarjaracetasam | apraudhatmavivekanamayurayasakaranam || 10|| yujyate veshtanam vayorakashasya
    ca khandanam | granthanam ca taranganamastha nayushi yujyate || 11|| prapyam samprapyate yena bhuyo
    yena na shocyate | paraya nirvriteh sthanam yattajjivitamucyate || 12|| taravo'pi hi jivanti jivanti
    mrigapakshinah | sa jivati mano yasya mananenopajivati || 13|| jatasta eva jagati jantavah sadhujivitah
    | ye punarneha jayante shesha jarathagardabhah || 14|| bharo vivekinah shastram bharo jnanam ca raginah
    | ashantasya mano bharo bharo'natmavido vapuh || 15|| ahamkaravashadapadahamkaradduradhayah | ahamkaravashadiha
    nahamkaratparo ripuh || 16|| ahamkaravashadyadyanmaya bhuktam caracaram | tattatsarvamavastveva vastvahamkarariktata
    || 17|| itashcetashca suvyagram vyarthamevabhidhavati | mano durataram yati grame kauleyako yatha
    || 18|| krurena jadatam yata trishnabharyanugamina | vashah kauleyakeneva brahmanmukto'smi cetasa
    || 19|| apyabdhipananmahatah sumerunmulanadapi | api vahnyashanadbrahmanvishamashcittanigrahah ||
    20|| cittam karanamarthanam tasminsati jagattrayam | tasminkshine jagatkshinam taccikitsyam prayatnatah
    || 21|| yam yamaham munishreshtha samshrayami gunashriyam | tam tam krintati me trishna tantrimiva
    kumushika || 22|| padam karotyalanghye'pi tripta viphalamihate | ciram tishthati naikatra trishna
    capalamarkati || 23|| kshanamayati patalam kshanam yati nabhasthalam | kshanam bhramati dikkunje trishna
    hritpadmashatpadi || 24|| sarvasamsaraduhkhanam trishnaika dirghaduhkhada | antahpurasthamapi ya yojayatyatisamkate
    || 25|| trishnavishucikamantrashcintatyago hi sa dvija | stokenanandamayati stokenayati khedatam ||
    26|| nasti dehasamah shocyo nico gunavivarjitah || 27|| kalevaramahamkaragrihasthasya mahagriham |
    luthatvabhyetu va sthairyam kimanena guro mama || 28|| panktibaddhendriyapashum valgattrishnagrihanganam
    | cittabhrityajanakirnam neshtam dehagriham mama || 29|| jihvamarkatikakrantavadanadvarabhishanam
    | drishtadantasthishakalam neshtam dehagriham mama || 30|| raktamamsamayasyasya sabahyabhyantare mune
    | nashaikadharmino bruhi kaiva kayasya ramyata || 31|| taditsu sharadabhreshu gandharvanagareshu ca
    | sthairyam yena vinirnitam sa vishvasitu vigrahe || 32|| shaishave guruto bhitirmatritah pitritastatha
    | janato jyeshthabalacca shaishavam bhayamandiram || 33|| svacittabilasamsthena nanavibhramakarina
    | balatkamapishacena vivashah paribhuyate || 34|| dasah putrah striyashcaiva bandhavah suhridastatha
    | hasantyunmattakamiva naram vardhakakampitam || 35|| dainyadoshamayi dirgha vardhate vardhake spriha
    | sarvapadamekasakhi hridi dahapradayini || 36|| kvacidva vidyate yaisha samsare sukhabhavana | ayuh
    stambamivasadya kalastamapi krintati || 37|| trinam pamsum mahendram ca suvarnam merusarshapam | atmambharitaya
    sarvamatmasatkartumudyatah | kalo'yam sarvasamhari tenakrantam jagattrayam || 38|| mamsapancalikayastu
    yantraloleangapanjare | snayvasthigranthishalinyah striyah kimiva shobhanam || 39|| tvanmamsaraktabashpambu
    prithakkritva vilocane | samalokaya ramyam cetkim mudha parimuhyasi || 40|| merusha
  devanagari: स्त्वनिराकारणं मेस्तु तदात्मनि निरते य उपनिषत्सु धर्मास्ते मयि सन्तु ते मयि सन्तु॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ अथातो महोपनिषदं व्याख्यास्यमस्तदाहुरेको ह वै नारायण आसीन्न ब्रह्मा नेशानो नापो नाग्नीषोमौ
    नेमे द्यावापृथिवी न नक्षत्राणि न सूर्यो न चन्द्रमाः । स एकाकी न रमते । तस्य ध्यानान्तःस्थस्य यज्ञस्तोममुच्यते
    । तस्मिन्पुरुषाश्चतुर्दश जायन्ते । एका कन्या । दशेन्द्रियाणि मन एकादशं तेजः । द्वादशोऽहङ्कारः । त्रयोदशकः
    प्राणः । चतुर्दश आत्मा । पञ्चदशी बुद्धिः । भूतानि पञ्च तन्मात्राणि । पञ्च महाभूतानि । स एकः पञ्चविंशतिः
    पुरुषः । तत्पुरुषं पुरुषो निवेश्य नास्य प्रधानसंवत्सरा जायन्ते । संवत्सरादधिजायन्ते । अथ पुनरेव नारायणः
    सोऽन्यत्कामो मनसाध्यायत । तस्य ध्यानान्तःस्थस्य ललाटात्त्र्यक्षः शूलपाणिः पुरुषो जायते । बिभ्रच्छ्रियं
    यशः सत्यं ब्रह्मचर्यं तपो वैराग्यं मन ऐश्वर्यं सप्रणवा व्याहृतय ऋग्यजुःसामाथर्वाङ्गिरसः सर्वाणि छन्दांसि
    तान्यङ्गे समाश्रितानि । तस्मादीशानो महादेवो महादेवः । अथ पुनरेव नारायणः सोऽन्यत्कामो मनसाध्यायत ।
    तस्य ध्यानान्तःस्थस्य ललाटात्स्वेदोऽपपत् । ता इमाः प्रतता आपः । ततस्तेजो हिरण्मयमण्डलम् । तत्र ब्रह्मा
    चतुर्मुखोऽजायत । सोऽध्याय्त् । पूर्वाभिमुखो भूत्वा भूरिति व्याहृतिर्गायत्रं छन्द ऋग्वेदोऽग्निर्देवता
    । पश्चिमाभिमुखो भूत्वा भुवरिति व्याहृतिस्त्रैष्टुभं छन्दो यजुर्वेदो वायुर्देवता । उत्तराभिमुखो भूत्वा
    स्वरिति व्याहृतिर्जाग्रतं छन्दः सामवेदः सूर्यो देवता । दक्षिणाभिमुखो भूत्वा महरितिव्याहृतिरानुष्टभ
    छन्दोऽथर्ववेदाः सोमो देवता । सहस्रशीर्षं देवं सहस्राक्षं विश्वसम्भुवम् । विश्वतः परमं नित्यं विश्वं
    नारायणं हरिम् । विश्वमेवेदं पुरुषस्तद्विश्वमुपजीवति । पतिं विश्वेश्वरं देवं समुद्रे विश्वरूपिणम् ।
    पद्मकोशप्रतीकाशं लम्बत्याकोशसंनिभम् । हृदयं चाप्यधोमुखं सन्तत्यै सीत्कराभीश्च । तस्य मध्ये महानर्चिर्विश्वर्चिर्विश्वतोमुखम्
    । तस्य मध्ये वह्निशिखा अणीयोर्ध्वा व्यवस्थिता । तस्याः शिखाया मध्ये परमात्मा व्यवस्थिता । स ब्रह्मा
    स ईशानः सेन्द्रः सोऽक्षरः परमः स्वराडिति महोपनिषत् ॥ इति प्रथमोध्यायः ॥ १॥ शुको नाम महातेजाः स्वरूपानन्दतत्परः
    । जातमात्रेण मुनिराड् यत्सत्यं तदवाप्तवान् ॥ १॥ तेनासौ स्वविवेकेन स्वयमेव महामनाः । प्रविचार्य चिरं
    साधु स्वात्मनिश्चयमाप्तवान् ॥ २॥ अनाख्यत्वादगम्यत्वान्मनःषष्ठेन्द्रियस्थितेः । चिन्मात्रमेवमात्माणुराकाशादपि
    सूक्ष्मकः ॥ ३॥ चिदणोः परमस्यान्तः कोटिब्रह्माण्डरेणवः । उत्पत्तिस्थितिमभ्येत्य लीयन्ते शक्तिपर्ययात्
    ॥ ४॥ आकाशं बाह्यशून्यत्वादनाकाशं तु चित्त्वतः । न किंचिद्यदनिर्देश्यं वस्तु सत्तेति किंचन ॥ ५॥ चेतनोऽसौ
    प्रकाशत्वाद्वेद्याभावाच्छिलोपमः । स्वात्मनि व्योमनि स्वस्थे जगदुन्मेषचित्रकृत् ॥ ६॥ तद्भामात्रमिदं
    विश्वमिति न स्यात्ततः पृथक् । जगद्भेदोऽपि तद्भानमिति भेदोऽपि तन्मयः ॥ ७॥ सर्वगः सर्वसम्बन्धो गत्यभावान्न
    गच्छति । नास्त्यसावश्रयाभावात्सद्रूपत्वादथास्ति च ॥ ८॥ विज्ञानमानन्दं ब्रह्म रातेर्दातुः परायणम् ।
    सर्वसंकल्पसंन्यासश्चेतसा यत्परिग्रहः ॥ ९॥ जाग्रतः प्रत्ययाभावं यस्याहुः प्रत्ययं बुधाः । यत्संकोचविकासाभ्यां
    जगत्प्रलयसृष्टयः ॥ १०॥ निष्ठा वेदान्तवाक्यानामथ वाचामगोचरः । अहं सच्चित्परानन्दब्रह्मैवास्मि न चेतरः
    ॥ ११॥ स्वयैव सूक्ष्मया बुद्ध्या सर्वं विज्ञातवाञ्छुकः । स्वयं प्राप्ते परे वस्तुन्यविश्रान्तमनाः स्थितः
    ॥ १२॥ इदं वस्त्विति विश्वासं नासावात्मन्युपाययौ । केवलं विररामास्य चेतो विषयचापलम् । भोगेभ्यो भूरिभङ्गेभ्यो
    धाराभ्य इव चातकः ॥ १३॥ एकदा सोऽमलप्रज्ञो मेरावेकान्तसंस्थितः । पप्रच्छ पितरं भक्त्या कृष्णद्वैपायनं
    मुनिम् ॥ १४॥ संसाराडम्बरमिदं कथमभ्युत्थितं मुने । कथं च प्रशमं याति किं यत्कस्य कदा वद ॥ १५॥ एवं पृष्टेन
    मुनिना व्यासेनाखिलमात्मजे । यथावदखिलं प्रोक्तं वक्तव्यं विदितात्मना ॥ १६॥ अज्ञासिषं पूर्वमेवमहमित्यथ
    तत्पितुः । स शुकः स्वकया बुद्ध्या न वाक्यं बहु मन्यते ॥ १७॥ व्यासोऽपि भगवान्बुद्ध्वा पुत्राभिप्रायमीदृशम्
    । प्रत्युवाच पुनः पुत्रं नाहं जानामि तत्त्वतः ॥ १८॥ जनको नाम भूपालो विद्यते मिथिलापुरे । यथावद्वेत्त्यसौ
    वेद्यं तस्मात्सर्वमवाप्स्यसि ॥ १९॥ पित्रेत्युक्तः शुकः प्रायात्सुमेरोर्वसुधातलम् । विदेहनगरीं प्राप
    जनकेनाभिपालिताम् ॥ २०॥ आवेदितोऽसौ याष्टीकैर्जनकाय महात्मने । द्वारि व्याससुतो राजञ्छुकोऽत्र स्थितवानिति
    ॥ २१॥ जिज्ञासार्थं शुकस्यासावास्तामेवेत्यवज्ञया । उक्त्वा बभूव जनकस्तूष्णीं सप्त दिनान्यथ ॥ २२॥ ततः
    प्रवेशयामास जनकः शुकमङ्गणे । तत्राहानि स सप्तैव तथैवावसदुन्मनाः ॥ २३॥ ततः प्रवेशयामास जनकोऽन्तःपुराजिरे
    । राजा न दृश्यते तावदिति सप्तदिनानि तम् ॥ २४॥ तत्रोन्मदाभिः कान्ताभिर्भोजनैर्भोगसंचयैः । जनको लालयामास
    शुकं शशिनिभाननम् ॥ २५॥ ते भोगास्तानि भोज्यानि व्यासपुत्रस्य तन्मनः । नाजह्वुर्मन्दपवनो बद्धपीठमिवाचलम्
    ॥ २६॥ केवलं सुसमः स्वच्छो मौनी मुदितमानसः । सम्पूर्ण इव शीतांशुरतिष्ठदमलः शुकः ॥ २७॥ परिज्ञातस्वभावं
    तं शुकं स जनको नृपः । आनीय मुदितात्मानमवलोक्य ननाम ह ॥ २८॥ निःशेषितजगत्कार्यः प्राप्ताखिलमनोरथः ।
    किमीप्सितं तवेत्याह कृतस्वागत आह तम् ॥ २९॥ संसाराडम्बरमिदं कथमभ्युत्थितं गुरो । कथं प्रशममायाति यथावत्कथयाशु
    मे ॥३०॥ यथावदखिलं प्रोक्तं जनकेन महात्मना । तदेव तत्पुरा प्रोक्तं तस्य पित्रा महाधिया ॥ ३१॥ स्वयमेव
    मया पूर्वमभिज्ञातं विशेषतः । एतदेव हि पृष्टेन पित्रा मे समुदाहृतम् ॥ ३२॥ भवताप्येष एवार्थः कथितो वाग्विदां
    वर । एष एव हि वाक्यार्थः शास्त्रेषु परिदृश्यते ॥ ३३॥ मनोविकल्पसंजातं तद्विकल्पपरिक्षयात् । क्षीयते
    दग्धसंसारो निःसार इति निश्चितः ॥ ३४॥ तत्किमेतन्महाभाग सत्यं ब्रूहि ममाचलम् । त्वत्तो विश्रममाप्नोमि
    चेतसा भ्रमता जगत् ॥ ३५॥ श्रुणु तावदिदानीं त्वं कथ्यमानमिदं मया । श्रीशुकं ज्ञानविस्तारं बुद्धिसारान्तरान्तरम्
    ॥ ३६॥ यद्विज्ञानात्पुमान्सद्यो जीवन्मुक्तत्वमाप्नुयात् ॥ ३७॥ दृश्यं नास्तीति बोधेन मनसो दृश्यमार्जनम्
    । सम्पन्नं चेत्तदुत्पन्ना परा निर्वाणनिर्वृतिः ॥ ३८॥ अशेषेण परित्यागो वासनायां य उत्तमः । मोक्ष इत्युच्यते
    सद्भिः स एव विमलक्रमः ॥ ३९॥ ये शुद्धवासना भूयो न जन्मानर्थभागिनः । ज्ञातज्ञेयास्त उच्यन्ते जीवन्मुक्ता
    महाधियः ॥ ४०॥ पदार्थभावनादार्ढ्यं बन्ध इत्यभिधीयते । वासनातानवं ब्रह्मन्मोक्ष इत्यभिधीयते ॥ ४१॥ तपः
    प्रभृतिना यस्मै हेतुनैव विना पुनः । भोगा इह न रोचन्ते स जीवन्मुक्त उच्यते ॥ ४२॥ आपतत्सु यथाकालं सुखदुःखेष्वनारतः
    । न हृष्यति ग्लायति यः स जीवन्मुक्त उच्यते ॥ ४३॥ हर्षामर्षभयक्रोधकामकार्पण्यदृष्टिभिः । न परामृश्यते
    योऽन्तः स जीवन्मुक्त उच्यते ॥ ४४॥ अहंकारमयीं त्यक्त्वा वासनां लीलयैव यः । तिष्ठति ध्येयसंत्यागी स
    जीवन्मुक्त उच्यते ॥ ४५॥ ईप्सितानीप्सिते न स्तो यस्यान्तर्वर्तिदृष्टिषु । सुषुप्तिवद्यश्चरति स जीवन्मुक्त
    उच्यते ॥ ४६॥ अध्यात्मरतिरासीनः पूर्णः पावनमानसः । प्राप्तानुत्तमविश्रान्तिर्न किंचिदिह वाञ्छति । यो
    जीवति गतस्नेहः स जीवन्मुक्त उच्यते ॥ ४७॥ संवेद्येन हृदाकाशे मनागपि न लिप्यते । यस्यासावजडा संवित्स
    जीवन्मुक्त उच्यते ॥ ४८॥ रागद्वेषौ सुखं दुःखं धर्माधर्मौ फलाफले । यः करोत्यनपेक्ष्यैव स जीवन्मुक्त
    उच्यते ॥ ४९॥ मौनवान्निरहंभावो निर्मानो मुक्तमत्सरः । यः करोति गतोद्वेगः स जीवन्मुक्त उच्यते ॥ ५०॥
    सर्वत्र विगतस्नेहो यः साक्षिवदवस्थितः । निरिच्छो वर्तते कार्ये स जीवन्मुक्त उच्यते ॥ ५१॥ येन धर्ममधर्मं
    च मनोमननमीहितम् । सर्वमन्तः परित्यक्तं स जीवन्मुक्त उच्यते ॥ ५२॥ यावती दृश्यकलना सकलेयं विलोक्यते
    । सा येन सुष्ठु संत्यक्ता स जीवन्मुक्त उच्यते ॥ ५३॥ कट्वम्ललवणं तिक्तममृष्टं मृष्टमेव च । सममेव च
    यो भुङ्क्ते स जीवन्मुक्त उच्यते ॥ ५४॥ जरामरणमापच्च राज्यं दारिद्र्यमेव च । रम्यमित्येव यो भुङ्क्ते
    स जीवन्मुक्त उच्यते ॥ ५५॥ धर्माधर्मौ सुखं दुःखं तथा मरणजन्मनी । धिया येन सुसंत्यक्तं स जीवन्मुक्त
    उच्यते ॥ ५६॥ उद्वेगानन्दरहितः समया स्वच्छया धिया । न शोचते न चोदेति स जीवन्मुक्त उच्यते ॥ ५७॥ सर्वेच्छाः
    सकलाः शङ्काः सर्वेहाः सर्वनिश्चयाः । धिया येन परित्यक्ताः स जीवन्मुक्त उच्यते ॥ ५८॥ जन्मस्थितिविनाशेषु
    सोदयास्तमयेषु च । सममेव मनो यस्य स जीवन्मुक्त उच्यते ॥ ५९॥ न किंचन द्वेष्टि तथा न किंचिदपि काङ्क्षति
    । भुङ्क्ते यः प्रकृतान्भोगान्स जीवन्मुक्त उच्यते ॥ ६०॥ शान्तसंसारकलनः कलावानपि निष्कलः । यः सचित्तोऽपि
    निश्चित्तः स जीवन्मुक्त उच्यते ॥ ६१॥ यः समस्तार्थजालेषु व्यवहार्यपि निःस्पृहः । परार्थेष्विव पूर्णात्मा
    स जीवन्मुक्त उच्यते ॥ ६२॥ जीवन्मुक्तपदं त्यक्त्वा स्वदेहे कालसात्कृते । विशत्यदेहमुक्तत्वं पवनोऽस्पन्दतामिव
    ॥ ६३॥ विदेहमुक्तो नोदेति नास्तमेति न शाम्यति । न सन्नासन्न दूरस्थो न चाहं न च नेतरः ॥ ६४॥ ततः स्तिमितगंभीरं
    न तेजो न तमस्ततम् । अनाख्यमनभिव्यक्तं सत्किंचिदवशिष्यते ॥ ६५॥ न शून्यं नापि चाकारो न दृश्यं नापि दर्शनम्
    । न च भूतपदार्थौघसदनन्ततया स्थितम् ॥ ६६॥ किमप्यव्यपदेशात्मा पूर्णात्पूर्णतराकृतिः । न सन्नासन्न सदसन्न
    भावो भावनं न च ॥ ६७॥ चिन्मात्रं चैत्यरहितमनन्तमजरं शिवम् । अनादिमध्यपर्यन्तं यदनादि निरामयम् ॥ ६८॥
    द्रष्टृदर्शनदृश्यानां मध्ये यद्दर्शनं स्मृतम् । नातः परतरं किंचिन्निश्चयोऽस्त्यपरो मुने ॥ ६९॥ स्वयमेव
    त्वया ज्ञातं गुरुतश्च पुनः श्रुतम् । स्वसंकल्पवशाद्बद्धो निःसंकल्पाद्विमुच्यते ॥ ७०॥ तेन स्वयं त्वया
    ज्ञातं ज्ञेयं यस्य महात्मनः । भोगेभ्यो ह्यरतिर्जाता दृश्याद्वा सकलादिह ॥ ७१॥ प्राप्तं प्राप्तव्यमखिलं
    भवता पूर्णचेतसा । स्वरूपे तपसि ब्रह्मन्मुक्तस्त्वं भ्रान्तिमुत्सृज ॥ ७२॥ अतिबाह्यं तथा बाह्यमन्तराभ्यन्तरं
    धियः । शुक पश्यन्न पश्येस्त्वं साक्षी सम्पूर्णकेवलः ॥ ७३॥ विशश्राम शुकस्तूष्णीं स्वस्थे परमवस्तुनि
    । वीतशोकभयायासो निरीहश्छिन्नसंशयः ॥ ७४॥ जगाम शिखरं मेरोः समाध्यर्थमखण्डितम् ॥ ७५॥ तत्र वर्षसहस्राणि
    निर्विकल्पसमाधिना । देशे स्थित्वा शशामासावात्मन्यस्नेहदीपवत् ॥ ७६॥ व्यपगतकलनाकलङ्कशुद्धः स्वयममलात्मनि
    पावने पदेऽसौ । सलिलकण इवांबुधौ महात्मा विगलितवासनमेकतां जगाम ॥ ७७॥ इति महोपनिषत् । इति द्वितीयोऽध्यायः
    ॥ २॥ निदाघो नाम मुनिराट् प्राप्तविद्यश्च बालकः । विहृतस्तीर्थयात्रार्थं पित्रानुज्ञातवान्स्वयम् ॥
    १॥ सार्धत्रिकोटितीर्थेषु स्नात्वा गृहमुपागतः । स्वोदन्तं कथयामास ऋभुं नत्वा महायशाः ॥ २॥ सार्धत्रिकोटितीर्थेषु
    स्नानपुण्यप्रभावतः । प्रादुर्भूतोमनसि मे विचारः सोऽयमीदृशः ॥ ३॥ जायते म्रियते लोको म्रियते जननाय च
    । अस्थिरः सर्व एवेमे सचराचरचेष्टिताः । सर्वापदां पदं पापा भावा विभवभूमयः ॥ ४॥ अयःशलाकासदृशाः परस्परमसङ्गिनः
    । शुष्यन्ते केवला भावा मनःकल्पनयानया ॥ ५॥ भावेष्वरतिरायाता पथिकस्य मरुष्विव । शाम्यतीदं कथं दुःखमिति
    तप्तोऽस्मि चेतसा ॥ ६॥ चिन्तानिचयचक्राणि नानन्दाय धनानि मे । सम्प्रसूतकलत्राणि गृहाण्युग्रापदामिव ॥
    ७॥ इयमस्मि स्थितोदारा संसारे परिपेलवा । श्रीर्मुने परिमोहाय सापि नूनं न शर्मदा ॥ ८॥ आयुः पल्लवकोणाग्रलम्बाम्बुकणभङ्गुरम्
    । उन्मत्त इव संत्यज्य याम्यकाण्डे शरीरकम् ॥ ९॥ विषयाशी विषासङ्गपरिजर्जरचेतसाम् । अप्रौढात्मविवेकानामायुरायासकारणम्
    ॥ १०॥ युज्यते वेष्टनं वायोराकाशस्य च खण्डनम् । ग्रन्थनं च तरङ्गाणामास्था नायुषि युज्यते ॥ ११॥ प्राप्यं
    सम्प्राप्यते येन भूयो येन न शोच्यते । पराया निर्वृतेः स्थानं यत्तज्जीवितमुच्यते ॥ १२॥ तरवोऽपि हि जीवन्ति
    जीवन्ति मृगपक्षिणः । स जीवति मनो यस्य मननेनोपजीवति ॥ १३॥ जातास्त एव जगति जन्तवः साधुजीविताः । ये पुनर्नेह
    जायन्ते शेषा जरठगर्दभाः ॥ १४॥ भारो विवेकिनः शास्त्रं भारो ज्ञानं च रागिणः । अशान्तस्य मनो भारो भारोऽनात्मविदो
    वपुः ॥ १५॥ अहंकारवशादापदहंकाराद्दुराधयः । अहंकारवशादीहा नाहंकारात्परो रिपुः ॥ १६॥ अहंकारवशाद्यद्यन्मया
    भुक्तं चराचरम् । तत्तत्सर्वमवस्त्वेव वस्त्वहंकाररिक्तता ॥ १७॥ इतश्चेतश्च सुव्यग्रं व्यर्थमेवाभिधावति
    । मनो दूरतरं याति ग्रामे कौलेयको यथा ॥ १८॥ क्रूरेण जडतां याता तृष्णाभार्यानुगामिना । वशः कौलेयकेनेव
    ब्रह्मन्मुक्तोऽस्मि चेतसा ॥ १९॥ अप्यब्धिपानान्महतः सुमेरून्मूलनादपि । अपि वह्न्यशनाद्ब्रह्मन्विषमश्चित्तनिग्रहः
    ॥ २०॥ चित्तं कारणमर्थानां तस्मिन्सति जगत्त्रयम् । तस्मिन्क्षीणे जगत्क्षीणं तच्चिकित्स्यं प्रयत्नतः
    ॥ २१॥ यां यामहं मुनिश्रेष्ठ संश्रयामि गुणश्रियम् । तां तां कृन्तति मे तृष्णा तन्त्रीमिव कुमूषिका ॥
    २२॥ पदं करोत्यलङ्घ्येऽपि तृप्ता विफलमीहते । चिरं तिष्ठति नैकत्र तृष्णा चपलमर्कटी ॥ २३॥ क्षणमायाति
    पातालं क्षणं याति नभस्थलम् । क्षणं भ्रमति दिक्कुञ्जे तृष्णा हृत्पद्मषट्पदी ॥ २४॥ सर्वसंसारदुःखानां
    तृष्णैका दीर्घदुःखदा । अन्तःपुरस्थमपि या योजयत्यतिसंकटे ॥ २५॥ तृष्णाविषूचिकामन्त्रश्चिन्तात्यागो हि
    स द्विज । स्तोकेनानन्दमायाति स्तोकेनायाति खेदताम् ॥ २६॥ नास्ति देहसमः शोच्यो नीचो गुणविवर्जितः ॥ २७॥
    कलेवरमहंकारगृहस्थस्य महागृहम् । लुठत्वभ्येतु वा स्थैर्यं किमनेन गुरो मम ॥ २८॥ पङ्क्तिबद्धेन्द्रियपशुं
    वल्गत्तृष्णागृहाङ्गणम् । चित्तभृत्यजनाकीर्णं नेष्टं देहगृहं मम ॥ २९॥ जिह्वामर्कटिकाक्रान्तवदनद्वारभीषणम्
    । दृष्टदन्तास्थिशकलं नेष्टं देहगृहं मम ॥ ३०॥ रक्तमांसमयस्यास्य सबाह्याभ्यन्तरे मुने । नाशैकधर्मिणो
    ब्रूहि कैव कायस्य रम्यता ॥ ३१॥ तडित्सु शरदभ्रेषु गन्धर्वनगरेषु च । स्थैर्यं येन विनिर्णीतं स विश्वसितु
    विग्रहे ॥ ३२॥ शैशवे गुरुतो भीतिर्मातृतः पितृतस्तथा । जनतो ज्येष्ठबालाच्च शैशवं भयमन्दिरम् ॥ ३३॥ स्वचित्तबिलसंस्थेन
    नानाविभ्रमकारिणा । बलात्कामपिशाचेन विवशः परिभूयते ॥ ३४॥ दासाः पुत्राः स्त्रियश्चैव बान्धवाः सुहृदस्तथा
    । हसन्त्युन्मत्तकमिव नरं वार्धककम्पितम् ॥ ३५॥ दैन्यदोषमयी दीर्घा वर्धते वार्धके स्पृहा । सर्वापदामेकसखी
    हृदि दाहप्रदायिनी ॥ ३६॥ क्वचिद्वा विद्यते यैषा संसारे सुखभावना । आयुः स्तम्बमिवासाद्य कालस्तामपि कृन्तति
    ॥ ३७॥ तृणं पांसुं महेन्द्रं च सुवर्णं मेरुसर्षपम् । आत्मंभरितया सर्वमात्मसात्कर्तुमुद्यतः । कालोऽयं
    सर्वसंहारी तेनाक्रान्तं जगत्त्रयम् ॥ ३८॥ मांसपाञ्चालिकायास्तु यन्त्रलोलेअङ्गपञ्जरे । स्नाय्वस्थिग्रन्थिशालिन्याः
    स्त्रियः किमिव शोभनम् ॥ ३९॥ त्वङ्मांसरक्तबाष्पाम्बु पृथक्कृत्वा विलोचने । समालोकय रम्यं चेत्किं मुधा
    परिमुह्यसि ॥ ४०॥ मेरुश
