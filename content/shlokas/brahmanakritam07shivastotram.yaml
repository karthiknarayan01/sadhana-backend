id: brahmanakritam07shivastotram
category: stotram
name:
  english: brahmanakritam07shivastotram
  devanagari: ब्रह्मणाकृतं०७शिवस्तोत्रम्
content:
  english: brahmana kritam 7 shivastotram shuddhasphatikasankasham sarvabharanabhushitam | atha tam manasa
    dhyatva yuktatma vai pitamahah || 5|| vavande devamishanam sarvesham sarvagam prabhum | brahmovaca
    | omishana namaste'stu mahadeva namo'stu te || 6|| namo'stu sarvavidyanamishana parameshvara | namo'stu
    sarvabhutanamishana vrishavahana || 7|| brahmano'dhipate tubhyam brahmane brahmarupine | namo brahmadhipataye
    shivam me'stu sadashiva || 8|| om karamurte devesha sadyojata namo namah | prapadye tvam prapanno'smi
    sadyojataya vai namah || 9|| abhave ca bhave tubhyam tatha natibhave namah | bhavodbhava bhaveshana
    mam bhajasva mahadyute || 10|| vamadeva namastubhyam jyeshthaya varadaya ca | namo rudraya kalaya
    kalanaya namo namah || 11|| namo vikaranayaiva kalavarnaya varnine | balaya balinam nityam sada vikaranaya
    te || 12|| balapramathanayaiva baline brahmarupine | sarvabhuteshvareshaya bhutanam damanaya ca ||
    13|| manonmanaya devaya namastubhyam mahadyute | vamadevaya vamaya namastubhyam mahatmane || 14||
    jyeshthaya caiva shreshthaya rudraya varadaya ca | kalahantre namastubhyam namastubhyam mahatmane
    || 15|| iti stavena devesham nanama vrishabhadhvajam | yah pathet sakrideveha brahmalokam gamishyati
    || 16|| shravayedva dvijan shraddhe sa yati paramam gatim | iti shrilingamahapurane purvabhage shodashadhyayantargatam
    brahmana kritam shivastotram samaptam | lingapurana | purvabhaga | adhyaya 16
  devanagari: ब्रह्मणा कृतं ७ शिवस्तोत्रम् शुद्धस्फटिकसङ्काशं सर्वाभरणभूषितम् । अथ तं मनसा ध्यात्वा युक्तात्मा
    वै पितामहः ॥ ५॥ ववन्दे देवमीशानं सर्वेशं सर्वगं प्रभुम् । ब्रह्मोवाच । ओमीशान नमस्तेऽस्तु महादेव नमोऽस्तु
    ते ॥ ६॥ नमोऽस्तु सर्वविद्यानामीशान परमेश्वर । नमोऽस्तु सर्वभूतानामीशान वृषवाहन ॥ ७॥ ब्रह्मणोऽधिपते
    तुभ्यं ब्रह्मणे ब्रह्मरूपिणे । नमो ब्रह्माधिपतये शिवं मेऽस्तु सदाशिव ॥ ८॥ ॐ कारमूर्ते देवेश सद्योजात
    नमो नमः । प्रपद्ये त्वां प्रपन्नोऽस्मि सद्योजाताय वै नमः ॥ ९॥ अभवे च भवे तुभ्यं तथा नातिभवे नमः ।
    भवोद्भव भवेशान मां भजस्व महाद्युते ॥ १०॥ वामदेव नमस्तुभ्यं ज्येष्ठाय वरदाय च । नमो रुद्राय कालाय कलनाय
    नमो नमः ॥ ११॥ नमो विकरणायैव कालवर्णाय वर्णिने । बलाय बलिनां नित्यं सदा विकरणाय ते ॥ १२॥ बलप्रमथनायैव
    बलिने ब्रह्मरूपिणे । सर्वभूतेश्वरेशाय भूतानां दमनाय च ॥ १३॥ मनोन्मनाय देवाय नमस्तुभ्यं महाद्युते ।
    वामदेवाय वामाय नमस्तुभ्यं महात्मने ॥ १४॥ ज्येष्ठाय चैव श्रेष्ठाय रुद्राय वरदाय च । कालहन्त्रे नमस्तुभ्यं
    नमस्तुभ्यं महात्मने ॥ १५॥ इति स्तवेन देवेशं ननाम वृषभध्वजम् । यः पठेत् सकृदेवेह ब्रह्मलोकं गमिष्यति
    ॥ १६॥ श्रावयेद्वा द्विजान् श्राद्धे स याति परमां गतिम् । इति श्रीलिङ्गमहापुराणे पूर्वभागे षोडशाध्यायान्तर्गतं
    ब्रह्मणा कृतं शिवस्तोत्रं समाप्तम् । लिङ्गपुराण । पूर्वभाग । अध्याय १६
