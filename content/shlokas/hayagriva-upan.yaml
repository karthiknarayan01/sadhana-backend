id: hayagriva-upan
category: upanishad
name:
  english: hayagriva upan
  devanagari: हयग्रिव उपन्
content:
  english: sakalasamrajyena siddhim kuru kuru svaha | tanetanmantranyo veda apavitrah pavitro bhavati
    | abrahmacari subrahmacari bhavati | agamyagamanatputo bhavati | patitasambhashanatputo bhavati |
    brahmahatyadipatakairmukto bhavati | griham rihapatiriva dehi dehante paramatmanam pravishati | prajnanamanandam
    brahma tattvamasi ayamatma brahma aham brahmasmiti mahavakyaih pratipaditamartham ta ete mantrah pratipadayanti
    | svaravyanjanabhedena dvidha ete | athanumantranjapati | yadvagvadantyavicetanani rashtri devanam
    nishasada mandra | catasra urjam duduhe payamsi kva svidasyah paramam jagama || 1|| gaurirmimaya salilani
    takshatyekapadi dvipadi sa catushpadi | ashtapadi navapadi babhuvushi sahasrakshara parame vyoman
    || 2|| oshthapidhana nakuli dantaih parivrita pavih | sarvasyai vaca ishana caru mamiha vadayeti ca
    vagrasah || 3|| sasarpariramatim badhamana brihanmimaya jamadagnidatta | asuryasya durita tanana shravo
    deveshvamritamajuryam || 4|| ya imam brahmavidyamekadashyam patheddhayagrivaprabhavena mahapurusho
    bhavati | sa jivanmukto bhavati | om namo brahmane dharanam me astvanirakaranam dharayita bhuyasam
    karnayoh shrutam macyodhvam mamamushya omityupanishat || om bhadram karnebhih shrunuyama devah | bhadram
    pashyemakshabhiryajatrah | sthirairangaistushtuva
  devanagari: सकलसाम्राज्येन सिद्धिं कुरु कुरु स्वाहा । तानेतान्मन्त्रान्यो वेद अपवित्रः पवित्रो भवति
    । अब्रह्मचारी सुब्रह्मचारी भवति । अगम्यागमनात्पूतो भवति । पतितसम्भाषणात्पूतो भवति । ब्रह्महत्यादिपातकैर्मुक्तो
    भवति । गृहं ऋहपतिरिव देही देहान्ते परमात्मानं प्रविशति । प्रज्ञानमानन्दं ब्रह्म तत्त्वमसि अयमात्मा
    ब्रह्म अहं ब्रह्मास्मीति महावाक्यैः प्रतिपादितमर्थं त एते मन्त्राः प्रतिपादयन्ति । स्वरव्यञ्जनभेदेन
    द्विधा एते । अथानुमन्त्राञ्जपति । यद्वाग्वदन्त्यविचेतनानि राष्ट्री देवानां निषसाद मन्द्रा । चतस्र
    ऊर्जं दुदुहे पयांसि क्व स्विदस्याः परमं जगाम ॥ १॥ गौरीर्मिमाय सलिलानि तक्षत्येकपदी द्विपदी सा चतुष्पदी
    । अष्टापदी नवपदी बभूवुषी सहस्राक्षरा परमे व्योमन् ॥ २॥ ओष्ठापिधाना नकुली दन्तैः परिवृता पविः । सर्वस्यै
    वाच ईशाना चारु मामिह वादयेति च वाग्रसः ॥ ३॥ ससर्परीरमतिं बाधमान बृहन्मिमाय जमदग्निदत्त । आसूर्यस्य
    दुरिता तनान श्रवो देवेष्वमृतमजुर्यम् ॥ ४॥ य इमां ब्रह्मविद्यामेकादश्यां पठेद्धयग्रीवप्रभावेन महापुरुषो
    भवति । स जीवन्मुक्तो भवति । ॐ नमो ब्रह्मणे धारणं मे अस्त्वनिराकरणं धारयिता भूयासं कर्णयोः श्रुतं माच्योढ्वं
    ममामुष्य ओमित्युपनिषत् ॥ ॐ भद्रं कर्णेभिः श्रुणुयाम देवाः । भद्रं पश्येमाक्षभिर्यजत्राः । स्थिरैरङ्गैस्तुष्टुवा
