id: bribasic
category: upanishad
name:
  english: bribasic
  devanagari: ब्रिबसिच्
content:
  english: sa hovaca na va are patyuh kamaya patih priyo bhavatyatmanastu kamaya patih priyo bhavati |
    na va are jayayai kamaya jaya priya bhavatyatmanastu kamaya jaya priya bhavati | na va are putranam
    kamaya putrah priya bhavantyatmanastu kamaya putrah priya bhavanti | na va are vittasya kamaya vittam
    priyam bhavatyatmanastu kamaya vittam priyam bhavati || na va are pashunam kamaya pashavah priya bhavanti
    atmanastu kamaya pashavah priya bhavanti | na va are brahmanah kamaya brahma priyam bhavatyatmanastu
    kamaya brahma priyam bhavati | na va are kshatrasya kamaya kshatram priyam bhavatyatmanastu kamaya
    kshatram priyam bhavati | na va are lokanam kamaya lokah priya bhavantyatmanastu kamaya lokah priya
    bhavanti | na va are devanam kamaya devah priya bhavantyatmanastu kamaya devah priya bhavanti | na
    va are vedanam kamaya vedah priya bhavantyatmanastu kamaya vedah priya bhavanti | na va are bhutanam
    kamaya bhutani priyani bhavantyatmanastu kamaya bhutani priyani bhavanti | na va are sarvasya kamaya
    sarvam priyam bhavatyatmanastu kamaya sarvam priyam bhavatyatma va are drashtavyah shrotavyo mantavyo
    nididhyasitavyo maitreyyatmani khalvare drishte shrute mate vijnata ida
  devanagari: स होवाच न वा अरे पत्युः कामाय पतिः प्रियो भवत्यात्मनस्तु कामाय पतिः प्रियो भवति । न वा अरे
    जायायै कामाय जाया प्रिया भवत्यात्मनस्तु कामाय जाया प्रिया भवति । न वा अरे पुत्राणां कामाय पुत्राः
    प्रिया भवन्त्यात्मनस्तु कामाय पुत्राः प्रिया भवन्ति । न वा अरे वित्तस्य कामाय वित्तं प्रियं भवत्यात्मनस्तु
    कामाय वित्तं प्रियं भवति ॥ न वा अरे पशूनां कामाय पशवः प्रिया भवन्ति आत्मनस्तु कामाय पशवः प्रिया भवन्ति
    । न वा अरे ब्रह्मणः कामाय ब्रह्म प्रियं भवत्यात्मनस्तु कामाय ब्रह्म प्रियं भवति । न वा अरे क्षत्रस्य
    कामाय क्षत्रं प्रियं भवत्यात्मनस्तु कामाय क्षत्रं प्रियं भवति । न वा अरे लोकानां कामाय लोकाः प्रिया
    भवन्त्यात्मनस्तु कामाय लोकाः प्रिया भवन्ति । न वा अरे देवानां कामाय देवाः प्रिया भवन्त्यात्मनस्तु
    कामाय देवाः प्रिया भवन्ति । न वा अरे वेदानां कामाय वेदाः प्रिया भवन्त्यात्मनस्तु कामाय वेदाः प्रिया
    भवन्ति । न वा अरे भूतानां कामाय भूतानि प्रियाणि भवन्त्यात्मनस्तु कामाय भूतानि प्रियाणि भवन्ति । न
    वा अरे सर्वस्य कामाय सर्वं प्रियं भवत्यात्मनस्तु कामाय सर्वं प्रियं भवत्यात्मा वा अरे द्रष्टव्यः श्रोतव्यो
    मन्तव्यो निदिध्यासितव्यो मैत्रेय्यात्मनि खल्वरे दृष्टे श्रुते मते विज्ञात इद
