id: krishnavatsaravalistotram
category: stotram
name:
  english: krishnavatsaravalistotram
  devanagari: कृष्णवत्सरावलिस्तोत्रम्
content:
  english: shubha | nilatoyadavakyadishrutivakyeshu kirtita || 8|| shrimukha mahishivargam bhaktana bhagavatanapi
    | munayashcakshate vyomni parasmin yajjushah sada || 9|| yuduktam jnanamashritya jana gitagamadishu
    | tadbhavabhavamapannah sargadinamagocarah || 10|| yuva kumaro yah proktah yuvatishca kumarini | yasya
    patni taya shraddhanamnya devatvamashnute || 11|| dhatusamye sthite smarta yastam kashthadisannibham
    | nayamiti kriti kolah svajanmanyatravidbhuvam || 12|| vyapanam bharanam svamyam svasya yo lokato'vadat
    | ishvarah sarvabhutanam yo hriddeshe'vatishtate || 13|| yasminnandakulam yate nardramardranca dhenavah
    | bahukshiradudhashcasana bahudhanyam ca bhutalama || 14|| pramathi kamsadantindro yaduddhritarado'bhavat
    | tyaktasuryena mallashca so'pi saudhatalasyitah || 15|| yadvikramasya kakubhau putanarishtakeshinau
    | pralambadharanisunu kaliyadyashca sakshinah || 16|| vrishapreritavarshena gopagopijanakulam | artam
    gavam kulam dritva yo dadhara dharadharam || 17|| yadvahamuktahetishabimbodyaccitrabhanuna | dagdha
    varanasi krityasahita sarshabhikrita || 18|| subhanuna rathangena yasya bhanuritarohitah | jayadrathavadhodyuktaparthasya
    pritaye diva || 19|| bharapaharanadbhumeravita bhavitaranah | yamunayastate reme yo gopisahito muda
    || 20|| ajatare rajasuye yo'sau parthivasamsadi | arcitah sahadevena sarvasammatipurvakam || 21||
    avyayashcedirajasya vyayam cakre vinindatah | cakrena bahusho yastu svapadakamalam gatam || 22|| yah
    sarvajiditi khyato jitam bhagavata jagat | ityadivakyairyo'pyevam jito bhaktajanaih priyaih || 23||
    sarvadhari svarupena sankalpenapi yah shrutau | khyato matsthani bhutanityadivavayeshu ca svatah ||
    24|| virodhi rudrarakshyatvabhrantirbanasuro yatah | kandishike sasainye'smi~llunabahuvano'bhavat
    || 25|| prakritervikritih sarva yenadhyakshena jayate | yacchariram samastam ca yasyetyadiryadiritam
    || 26|| yadbhayat pavate vayuh kharavrishtirudeti ca | lohitashvassurendrashca mrityurdhavati pancamah
    || 27|| lepanam dama cannani kubja malyopajivini | viduro'pi daduryasmai sa payannandanandanah ||
    28|| yasmadvijayasarathyam kritam sakalasakshikam | tasmat krishnasya saulabhyakashtha loke vidarshita
    || 29|| jayatatpatagadhishamadhirudhah sureshvaram | vijitya parijatam yo'nayat satyamude bhuvam ||
    30|| rasalilaviyogena yah pidyante sma gopikah | tasamavirabhudyo'sau sakshanmanmathamanmathah ||
    31|| sumukhi sumana vapi virahe yasya gopika | na kapi durmukhi kintu durmana ca lasattanoh || 32||
    yadavendrasya sevayam hevilambijanadrutam | bhajasva tam bhavambhodhim taritum duritalayam || 33||
    vilambitulasimalyam vishnum nandajamashraye | vigrahe svasya raktanam vishayasaktivarakam || 34||
    avikari samastasya vastu prakrititam bhajat | api yaccidaciddvara tadacyutamupasmahe || 35|| sharvaritih
    samastashca brahmaritishca he jana | vicarya heya vishvasya patim prapnuhi yadavam || 36|| nrideham
    pratilabhyapi plavam krishnena vayuna | iritam yo bhavabdhim sa na taredatmaha bhavet || 37|| yasya
    kelih pralambaghnalilaya sangatakhila | lokopakarini jata shubhakrit bhavatat sa nah || 38|| madhuram
    gamito yo'savarena sashobhakrit | gopinam virahartanam nagarastrirasavahah || 39|| nilah suvakro dhishanam
    yadgudalakasancayah | pashyatam harinim hartum jalati snigdhashitaguh || 40|| dvitrastricatura vapi
    kataksha yasya pancashah | vishvavasujanasyalam datum dhanadatulyatam || 41|| parabhavati yasyanghryorbhaktisthasya
    tu keshavah | sulabhastasya nabhakte bhaktikrito hi sa smritah || 42|| plavangadutyakarananna saulabhyamalabhi
    yat | purvajanmani tatso'yam vrito'bhut pandujanmanam || 43|| varam sa kilakashikhipanjarantarvyavasthitih
    | na shauricintavimukhajanasamvasavaishasa || 44|| keshavo yasya hridyaste saumyarupo bhavatyayam
    | antah kshitirasam brute carutvat salabhuruhah || 45|| gopika cintayanti yadvigraham nijamandire
    | sadharanam nijasunam na labhe kintu yatpadam || 46|| yenavivado yasyasittishthata hridayambuje |
    sa kritarthastu nojivet kruratma yadvirodhikrit || 47|| gopalashishubhistulyaihsaha vrindavane caram
    | vastu vatsavanam naumi paridhavi sudiptimat || 48|| pramadi candrasankashamukhabimbavalokane | krishnasya
    ma bhuh kainkarye janaitatpadagocare || 49|| naranadamupakramya yadanandagunam shrutih | paricchettumana
    vaco'pyabhumim manaso'vadan || 50|| krishna pahi gabhiraksha sannyastabharanam tvayi | mam tvamevarjunavyajadattha
    sarvadipadyatah || 51|| pritanam dhartarashtranam parthasyandanacakratah | nalatavimivaklishtam dvipo
    mattah pipesha yah || 52|| pujanam kusumam yogyam shrimatah keshavasya hi | na bhikshoh pingalajatadharinastu
    kadacana || 53|| yasya cetasi govindah kritam tasya kalau na cet | satkalayuktitah shraishthyam naiva
    tasya yugam kalih || 14|| siddharthinam nijabhishtapraptih krishnasya sevanat | syat prasiddho hi
    sarvesham sarvakamaprado harih || 55|| raudram va sevanam brahmamanyadaivatagocaram | varjayanti prabuddhastu
    yasmat parimitam phalam || 56|| vasudevaparityagi yo'nyasevaparo narah | trishitah svarnaditire kupam
    khanati durmatih || 57|| yatha krishnaprabhavena mukta anakadundubhih | sha
  devanagari: शुभा । नीलतोयदवाक्यादिश्रुतिवाक्येषु कीर्तिता ॥ ८॥ श्रीमुख महिषीवर्गं भक्तान भागवतानपि ।
    मुनयश्चक्षते व्योम्नि परस्मिन् यज्जुषः सदा ॥ ९॥ युदुक्तं ज्ञानमाश्रित्य जना गीतागमादिषु । तद्भावभावमापन्नाः
    सर्गादीनामगोचराः ॥ १०॥ युवा कुमारो यः प्रोक्तः युवतिश्च कुमारिणी । यस्य पत्नी तया श्रद्धानाम्न्या
    देवत्वमश्नुते ॥ ११॥ धातुसाम्ये स्थिते स्मर्ता यस्तं काष्ठादिसन्निभम् । नयामीति कृती कोलः स्वजन्मन्यत्रवीद्भुवम्
    ॥ १२॥ व्यापनं भरणं स्वाम्यं स्वस्य यो लोकतोऽवदत् । ईश्वरः सर्वभूतानां यो हृद्देशेऽवतिष्टते ॥ १३॥ यस्मिन्नन्दकुलं
    याते नार्द्रमार्द्रञ्च धेनवः । बहुक्षीरदुधाश्चासन बहुधान्यं च भूतलम ॥ १४॥ प्रमाथी कंसदन्तीन्द्रो यदुद्धृतरदोऽभवत्
    । त्यक्तासुर्येन मल्लाश्च सोऽपि सौधतलस्यितः ॥ १५॥ यद्विक्रमस्य ककुभौ पूतनारिष्टकेशिनौ । प्रलम्बधरणीसूनू
    कालियाद्याश्च साक्षिणः ॥ १६॥ वृषप्रेरितवर्षेण गोपगोपीजनाकुलम् । आर्तं गवां कुलं दृट्वा यो दधार धराधरम्
    ॥ १७॥ यद्वाहमुक्तहेतीशबिम्बोद्यच्चित्रभानुना । दग्धा वाराणसी कृत्यासहिता सर्षभीकृता ॥ १८॥ सुभानुना
    रथाङ्गेन यस्य भानुरितरोहितः । जयद्रथवधोद्युक्तपार्थस्य प्रीतये दिवा ॥ १९॥ भारापहरणाद्भुमेरविता भवितारणः
    । यमुनायास्तटे रेमे यो गोपीसहितो मुदा ॥ २०॥ अजातारे राजसूये योऽसौ पार्थिवसंसदि । अर्चितः सहदेवेन सर्वसम्मतिपूर्वकम्
    ॥ २१॥ अव्ययश्चेदिराजस्य व्ययं चक्रे विनिन्दतः । चक्रेण बहुशो यस्तु स्वपादकमलं गतम् ॥ २२॥ यः सर्वजिदिति
    ख्यातो जितं भगवता जगत् । इत्यादिवाक्यैर्योऽप्येवं जितो भक्तजनैः प्रियैः ॥ २३॥ सर्वधारी स्वरूपेण सङ्कल्पेनापि
    यः श्रुतौ । ख्यातो मत्स्थानि भूतानीत्यादिवावयेषु च स्वतः ॥ २४॥ विरोधी रुद्ररक्ष्यत्वभ्रान्तिर्बाणासुरो
    यतः । कान्दिशीके ससैन्येऽस्मिँल्लूनबाहुवनोऽभवत् ॥ २५॥ प्रकृतेर्विकृतिः सर्वा येनाध्यक्षेण जायते ।
    यच्छरीरं समस्तं च यस्येत्यादिर्यदीरितम् ॥ २६॥ यद्भयात् पवते वायुः खरवृष्टिरुदेति च । लोहिताश्वस्सुरेन्द्रश्च
    मृत्युर्धावति पञ्चमः ॥ २७॥ लेपनं दाम चान्नानि कुब्जा माल्योपजीविनी । विदुरोऽपि ददुर्यस्मै स पायान्नन्दनन्दनः
    ॥ २८॥ यस्माद्विजयसारथ्यं कृतं सकलसाक्षिकम् । तस्मात् कृष्णस्य सौलभ्यकाष्ठा लोके विदर्शिता ॥ २९॥ जयतात्पतगाधीशमधिरूढः
    सुरेश्वरम् । विजित्य पारिजातं योऽनयत् सत्यामुदे भुवम् ॥ ३०॥ रासलीलावियोगेन याः पीड्यन्ते स्म गोपिकाः
    । तासामाविरभूद्योऽसौ साक्षान्मन्मथमन्मथः ॥ ३१॥ सुमुखी सुमना वापि विरहे यस्य गोपिका । न कापि दुर्मुखी
    किन्तु दुर्मना च लसत्तनोः ॥ ३२॥ यादवेन्द्रस्य सेवायां हेविलम्बिजनद्रुतम् । भजस्व तं भवाम्भोधिं तरितुं
    दुरितालयम् ॥ ३३॥ विलम्बितुलसीमाल्यं विष्णुं नन्दजमाश्रये । विग्रहे स्वस्य रक्तानां विषयासक्तिवारकम्
    ॥ ३४॥ अविकारि समस्तस्य वस्तु प्रकृतितां भजत् । अपि यच्चिदचिद्द्वारा तदच्युतमुपास्महे ॥ ३५॥ शार्वरीतीः
    समस्ताश्च ब्राह्मरीतीश्च हे जन । विचार्य हेया विश्वस्य पतिं प्राप्नुहि यादवम् ॥ ३६॥ नृदेहं प्रतिलभ्यापि
    प्लवं कृष्णेन वायुना । ईरितं यो भवाब्धिं स न तरेदात्महा भवेत् ॥ ३७॥ यस्य केलिः प्रलम्बघ्नलीलया सङ्गताखिला
    । लोकोपकारिणी जाता शुभकृत् भवतात् स नः ॥ ३८॥ मधुरां गमितो योऽसावरेण सशोभकृत् । गोपीनां विरहार्तानां
    नगरस्त्रीरसावहः ॥ ३९॥ नीलः सुवक्रो धिषणां यद्गुडालकसञ्चयः । पश्यतां हरिणीं हर्तुं जालति स्निग्धशीतगुः
    ॥ ४०॥ द्वित्रास्त्रिचतुरा वापि कटाक्षा यस्य पञ्चषाः । विश्वावसुजनस्यालं दातुं धनदतुल्यताम् ॥ ४१॥ पराभवति
    यस्याङ्घ्र्योर्भक्तिस्थस्य तु केशवः । सुलभस्तस्य नाभक्ते भक्तिक्रीतो हि स स्मृतः ॥ ४२॥ प्लवङ्गदूत्यकरणान्न
    सौलभ्यमलाभि यत् । पूर्वजन्मनि तत्सोऽयं वृतोऽभूत् पाण्डुजन्मनाम् ॥ ४३॥ वरं स कीलकशिखिपञ्जरान्तर्व्यवस्थितिः
    । न शौरिचिन्ताविमुखजनसंवासवैशस ॥ ४४॥ केशवो यस्य हृद्यास्ते सौम्यरूपो भवत्ययम् । अन्तः क्षितिरसं ब्रूते
    चारुत्वात् सालभूरुहः ॥ ४५॥ गोपिका चिन्तयन्ती यद्विग्रहं निजमन्दिरे । साधारणं निजासूनां न लभे किन्तु
    यत्पदम् ॥ ४६॥ येनाविवादो यस्यासीत्तिष्ठता हृदयाम्बुजे । स कृतार्थस्तु नोजीवेत् क्रूरात्मा यद्विरोधिकृत्
    ॥ ४७॥ गोपालशिशुभिस्तुल्यैःसह वृन्दावने चरम् । वस्तु वत्सावनं नौमि परिधावि सुदीप्तिमत् ॥ ४८॥ प्रमादी
    चन्द्रसङ्काशमुखबिम्बावलोकने । कृष्णस्य मा भूः कैङ्कर्ये जनैतत्पदगोचरे ॥ ४९॥ नरानदमुपक्रम्य यदानन्दगुणं
    श्रुतिः । परिच्छेत्तुमना वाचोऽप्यभूमिं मनसोऽवदन् ॥ ५०॥ कृष्ण पाहि गभीराक्ष सन्न्यस्तभरणं त्वयि । मां
    त्वमेवार्जुनव्याजादात्थ सर्वादिपद्यतः ॥ ५१॥ पृतनां धार्तराष्ट्राणां पार्थस्यन्दनचक्रतः । नलाटवीमिवाक्लिष्टं
    द्विपो मत्तः पिपेष यः ॥ ५२॥ पूजनं कुसुमं योग्यं श्रीमतः केशवस्य हि । न भिक्षोः पिङ्गलजटाधारिणस्तु
    कदाचन ॥ ५३॥ यस्य चेतसि गोविन्दः कृतं तस्य कलौ न चेत् । सत्कालयुक्तितः श्रैष्ठ्यं नैव तस्य युगं कलिः
    ॥ १४॥ सिद्धार्थिनां निजाभीष्टप्राप्तिः कृष्णस्य सेवनात् । स्यात् प्रसिद्धो हि सर्वेषां सर्वकामप्रदो
    हरिः ॥ ५५॥ रौद्रं वा सेवनं ब्राह्ममन्यदैवतगोचरम् । वर्जयन्ति प्रबुद्धास्तु यस्मात् परिमितं फलम् ॥
    ५६॥ वासुदेवपरित्यागी योऽन्यसेवापरो नरः । तृषितः स्वर्णदीतीरे कूपं खनति दुर्मतिः ॥ ५७॥ यथा कृष्णप्रभावेण
    मुक्त आनकदुन्दुभिः । श
