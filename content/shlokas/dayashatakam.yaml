id: dayashatakam
category: stotram
name:
  english: dayashatakam
  devanagari: दयाशतकम्
content:
  english: dayashatakam shrimate nigamantamahadeshikaya namah | shrimanvenkatanatharyah kavitarkikakesari
    | vedantacaryavaryo me sannidhattam sada hridi || shrih | prapadye tam girim prayah shrinivasanukampaya
    | ikshusarasravantyeva yanmurtya sharkarayitam || 1|| vigahe tirthabahulam shitalam gurusantatim |
    shrinivasadayambhodhiparivahaparamparam || 2|| kritinah kamalavasakarunyaikantino bhaje | dhatte yatsuktirupena
    trivedi sarvayogyatam || 3|| parasharamukhanvande bhagirathanaye sthitan | kamalakantakarunyagangaplavitamadvidhan
    || 4|| asheshavighnashamanamanikeshvaramashraye | shrimatah karunambhodhau shikshasrota ivotthitam
    || 5|| samastajananim vande caitanyastanyadayinim | shreyasim shrinivasasya karunamiva rupinim ||
    6|| vande vrishagirishasya mahishim vishvadharinim | tatkripapratighatanam kshamaya varanam yaya ||
    7|| nishamayatu mam nila yadbhogapatalairdhruvam | bhavitam shrinivasasya bhaktadosheshvadarshanam
    || 8|| kamapyanavadhim vande karunavarunalayam | vrishashailatatasthanam svayam vyaktimupagatam ||
    9|| akincananidhim sutimapavargatrivargayoh | anjanadrishvaradayamabhishtaumi niranjanam || 10|| anucarashaktyadigunamagresarabodhaviracitalokam
    | svadhinavrishagirisham svayam prabhutam pramanayami dayam || 11|| api nikhilalokasucaritamushtindhayaduritamurcchanajushtam
    | sanjivayatu daye mamanjanagirinatharanjani bhavati || 12|| bhagavati daye bhavatya vrishagirinathe
    samaplute tunge | apratighamajjananam hastalambo madagasam mrigyah || 13|| kripanajanakalpalatikam
    kritaparadhasya nishkriyamadyam | vrishagirinathadaye tvam vidanti samsaratarinim vibudhah || 14||
    vrishagirigrihamedhiguna bodhabalaishvaryaviryashaktimukhah | dosha bhaveyurete yadi nama daye tvaya
    vinabhutah || 15|| asrishti santatanamaparadhanam nirodhinim jagatah | padmasahayakarune pratisancarakelimacarasi
    || 16|| acidavishishtanpralaye jantunavalokya jatanirveda | karanakalevarayogam vitarasi vrishashailanathakarune
    tvam || 17|| anugunadasharpitena shridharakarune samahitasneha | shamayasi tamah prajanam shastramayena
    sthirapradipena || 18|| rudha vrishacalapateh pade mukhakantipatralacchaya | karune sukhayasi vinatankatakshavitapaih
    karapaceyaphalaih || 19|| nayane vrishacalendostaramaitrim dadhanaya karune | drishtastvayaiva janimanapavargamakrishtapacyamanubhavati
    || 20|| samayopanataistava pravahairanukampe kritasamplava dharitri | sharanagatasasyamaliniyam vrishashaileshakrishivalam
    dhinoti || 21|| kalashodadhisampado bhavatyah karune sanmatimanthasamskritayah | amritamshamavaimi
    divyadeham mritasanjivanamanjanacalendoh || 22|| jaladheriva shitata daye tvam vrishashailadhipatessvabhavabhuta
    | pralayarabhatinatim tadiksham prasabham grahayasi prasattilasyam || 23|| pranatapratikulamulaghati
    pratighah ko'pi vrishacaleshvarasya | kalame yavasapacayanitya karune kinkaratam tavopayati || 24||
    abahishkritanigrahanvidantah kamalakantagunansvatantratadin | avikalpamanugraham duhanam bhavatimeva
    daye bhajanti santah || 25|| kamalanilayastvaya dayaluh karune nishkaruna nirupane tvam | ata eva
    hi tavakashritanam duritanam bhavati tvadeva bhitih || 26|| atilanghitashasaneshvabhikshnam vrishashailadhipatirvijrimbhitoshma
    | punareva daye kshamanidanairbhavatimadriyate bhavatyadhinaih || 27|| karune duriteshu mamakeshu
    pratikarantaradurjayeshu khinnah | kavacayitaya tvayaiva sharngi vijayasthanamupashrito vrishadrim
    || 28|| mayi tishthati dushkritam pradhane mitadoshanitaranvicinvati tvam | aparadhaganairapurnakukshih
    kamalakantadaye katham bhavitri || 29|| ahamasmyaparadhacakravarti karune tvam ca guneshu sarvabhaumi
    | vidushi sthitimidrishim svayam mam vrishashaileshvarapadasatkuru tvam || 30|| ashithilakarane'sminnakshatashvasavrittau
    vapushi gamanayogye vasamasadayeyam | vrishagirikatakeshu vyanjayatsu pratitai
  devanagari: दयाशतकम् श्रीमते निगमान्तमहादेशिकाय नमः । श्रीमान्वेङ्कटनाथार्यः कवितार्किककेसरी । वेदान्ताचार्यवर्यो
    मे सन्निधत्तां सदा हृदि ॥ श्रीः । प्रपद्ये तं गिरिं प्रायः श्रीनिवासानुकम्पया । इक्षुसारस्रवन्त्येव
    यन्मूर्त्या शर्करायितम् ॥ १॥ विगाहे तीर्थबहुलां शीतलां गुरुसन्ततिम् । श्रीनिवासदयाम्भोधिपरीवाहपरम्पराम्
    ॥ २॥ कृतिनः कमलावासकारुण्यैकान्तिनो भजे । धत्ते यत्सूक्तिरूपेण त्रिवेदी सर्वयोग्यताम् ॥ ३॥ पराशरमुखान्वन्दे
    भगीरथनये स्थितान् । कमलाकान्तकारुण्यगङ्गाप्लावितमद्विधान् ॥ ४॥ अशेषविघ्नशमनमनीकेश्वरमाश्रये । श्रीमतः
    करुणाम्भोधौ शिक्षास्रोत इवोत्थितम् ॥ ५॥ समस्तजननीं वन्दे चैतन्यस्तन्यदायिनीम् । श्रेयसीं श्रीनिवासस्य
    करुणामिव रूपिणीम् ॥ ६॥ वन्दे वृषगिरीशस्य महिषीं विश्वधारिणीम् । तत्कृपाप्रतिघातानां क्षमया वारणं यया
    ॥ ७॥ निशामयतु मां नीला यद्भोगपटलैर्ध्रुवम् । भावितं श्रीनिवासस्य भक्तदोषेष्वदर्शनम् ॥ ८॥ कमप्यनवधिं
    वन्दे करुणावरुणालयम् । वृषशैलतटस्थानां स्वयं व्यक्तिमुपागतम् ॥ ९॥ अकिञ्चननिधिं सूतिमपवर्गत्रिवर्गयोः
    । अञ्जनाद्रीश्वरदयामभिष्टौमि निरञ्जनाम् ॥ १०॥ अनुचरशक्त्यादिगुणामग्रेसरबोधविरचितालोकाम् । स्वाधीनवृषगिरीशां
    स्वयं प्रभूतां प्रमाणयामि दयाम् ॥ ११॥ अपि निखिललोकसुचरितमुष्टिन्धयदुरितमूर्च्छनाजुष्टम् । सञ्जीवयतु
    दये मामञ्जनगिरिनाथरञ्जनी भवती ॥ १२॥ भगवति दये भवत्या वृषगिरिनाथे समाप्लुते तुङ्गे । अप्रतिघमज्जनानां
    हस्तालम्बो मदागसां मृग्यः ॥ १३॥ कृपणजनकल्पलतिकां कृतापराधस्य निष्क्रियामाद्याम् । वृषगिरिनाथदये त्वां
    विदन्ति संसारतारिणीं विबुधाः ॥ १४॥ वृषगिरिगृहमेधिगुणा बोधबलैश्वर्यवीर्यशक्तिमुखाः । दोषा भवेयुरेते
    यदि नाम दये त्वया विनाभूताः ॥ १५॥ आसृष्टि सन्ततानामपराधानां निरोधिनीं जगतः । पद्मासहायकरुणे प्रतिसञ्चरकेलिमाचरसि
    ॥ १६॥ अचिदविशिष्टान्प्रलये जन्तूनवलोक्य जातनिर्वेदा । करणकलेवरयोगं वितरसि वृषशैलनाथकरुणे त्वम् ॥ १७॥
    अनुगुणदशार्पितेन श्रीधरकरुणे समाहितस्नेहा । शमयसि तमः प्रजानां शास्त्रमयेन स्थिरप्रदीपेन ॥ १८॥ रुढा
    वृषाचलपतेः पादे मुखकान्तिपत्रलच्छाया । करुणे सुखयसि विनतान्कटाक्षविटपैः करापचेयफलैः ॥ १९॥ नयने वृषाचलेन्दोस्तारामैत्रीं
    दधानया करुणे । दृष्टस्त्वयैव जनिमानपवर्गमकृष्टपच्यमनुभवति ॥ २०॥ समयोपनतैस्तव प्रवाहैरनुकम्पे कृतसम्प्लवा
    धरित्री । शरणागतसस्यमालिनीयं वृषशैलेशकृषीवलं धिनोति ॥ २१॥ कलशोदधिसम्पदो भवत्याः करुणे सन्मतिमन्थसंस्कृतायाः
    । अमृतांशमवैमि दिव्यदेहं मृतसञ्जीवनमञ्जनाचलेन्दोः ॥ २२॥ जलधेरिव शीतता दये त्वं वृषशैलाधिपतेस्स्वभावभूता
    । प्रलयारभटीनटीं तदीक्षां प्रसभं ग्राहयसि प्रसत्तिलास्यम् ॥ २३॥ प्रणतप्रतिकूलमूलघाती प्रतिघः कोऽपि
    वृषाचलेश्वरस्य । कलमे यवसापचायनीत्या करुणे किङ्करतां तवोपयाति ॥ २४॥ अबहिष्कृतनिग्रहान्विदन्तः कमलाकान्तगुणान्स्वतन्त्रतादीन्
    । अविकल्पमनुग्रहं दुहानां भवतीमेव दये भजन्ति सन्तः ॥ २५॥ कमलानिलयस्त्वया दयालुः करुणे निष्करुणा निरूपणे
    त्वम् । अत एव हि तावकाश्रितानां दुरितानां भवति त्वदेव भीतिः ॥ २६॥ अतिलङ्घितशासनेष्वभीक्ष्णं वृषशैलाधिपतिर्विजृम्भितोष्मा
    । पुनरेव दये क्षमानिदानैर्भवतीमाद्रियते भवत्यधीनैः ॥ २७॥ करुणे दुरितेषु मामकेषु प्रतिकारान्तरदुर्जयेषु
    खिन्नः । कवचायितया त्वयैव शार्ङ्गी विजयस्थानमुपाश्रितो वृषाद्रिम् ॥ २८॥ मयि तिष्ठति दुष्कृतां प्रधाने
    मितदोषानितरान्विचिन्वती त्वम् । अपराधगणैरपूर्णकुक्षिः कमलाकान्तदये कथं भवित्री ॥ २९॥ अहमस्म्यपराधचक्रवर्ती
    करुणे त्वं च गुणेषु सार्वभौमी । विदुषी स्थितिमीदृशीं स्वयं मां वृषशैलेश्वरपादसात्कुरु त्वम् ॥ ३०॥
    अशिथिलकरणेऽस्मिन्नक्षतश्वासवृत्तौ वपुषि गमनयोग्ये वासमासादयेयम् । वृषगिरिकटकेषु व्यञ्जयत्सु प्रतीतै
