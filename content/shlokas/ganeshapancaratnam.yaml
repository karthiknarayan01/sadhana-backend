id: ganeshapancaratnam
category: stotram
name:
  english: ganeshapancaratnam
  devanagari: गणेशपञ्चरत्नम्
content:
  english: shrimacchankarabhagavatpadaih viracitam ||shriganeshapancaratnam|| mudakarattamodakam sada
    vimuktisadhakam kaladharavatamsakam vilasalokarakshakam| anayakaikanayakam vinashitebhadaityakam natashubhashunashakam
    namami tam vinayakam||1|| natetaratibhikaram navoditarkabhasvaram namatsurarinirjaram natadhikapaduddharam|
    sureshvaram nidhishvaram gajeshvaram ganeshvaram maheshvaram tamashraye paratparam nirantaram||2||
    samastalokashankaram nirastadaityakunjaram daretarodaram varam varebhavaktramaksharam| kripakaram
    kshamakaram mudakaram yashaskaram manaskaram namaskritam namaskaromi bhasvaram||3|| akincanartimarjanam
    cirantanoktibhajanam puraripurvanandanam surarigarvacarvanam| prapancanashabhishanam dhananjayadibhushanam
    kapoladanavaranam bhaje puranavaranam||4|| nitantakantadantakantimantakantakatmajam acintyarupamantahinamantarayakrintanam|
    hridantare nirantaram vasantameva yoginam tamekadantameva tam vicintayami santatam||6|| mahaganeshapancaratnamadarena
    yo'nvaham prajalpati prabhatake hridi smaran ganeshvaram| arogatam adoshatam susahitim suputratam
    samihitayurashtabhutimabhyupaiti so'cirat||6||
  devanagari: श्रीमच्छङ्करभगवत्पादैः विरचितम् ॥श्रीगणेशपञ्चरत्नम्॥ मुदाकरात्तमोदकं सदा विमुक्तिसाधकं कलाधरावतंसकं
    विलासलोकरक्षकम्। अनायकैकनायकं विनाशितेभदैत्यकं नताशुभाशुनाशकं नमामि तं विनायकम्॥१॥ नतेतरातिभीकरं नवोदितार्कभास्वरं
    नमत्सुरारिनिर्जरं नताधिकापदुद्धरम्। सुरेश्वरं निधीश्वरं गजेश्वरं गणेश्वरं महेश्वरं तमाश्रये परात्परं
    निरन्तरम्॥२॥ समस्तलोकशङ्करं निरस्तदैत्यकुञ्जरं दरेतरोदरं वरं वरेभवक्त्रमक्षरम्। कृपाकरं क्षमाकरं मुदाकरं
    यशस्करं मनस्करं नमस्कृतां नमस्करोमि भास्वरम्॥३॥ अकिञ्चनार्तिमार्जनं चिरन्तनोक्तिभाजनं पुरारिपूर्वनन्दनं
    सुरारिगर्वचर्वणम्। प्रपञ्चनाशभीषणं धनञ्जयादिभूषणं कपोलदानवारणं भजे पुराणवारणम्॥४॥ नितान्तकान्तदन्तकान्तिमन्तकान्तकात्मजं
    अचिन्त्यरूपमन्तहीनमन्तरायकृन्तनम्। हृदन्तरे निरन्तरं वसन्तमेव योगिनां तमेकदन्तमेव तं विचिन्तयामि सन्ततम्॥६॥
    महागणेशपञ्चरत्नमादरेण योऽन्वहं प्रजल्पति प्रभातके हृदि स्मरन् गणेश्वरम्। अरोगतां अदोषतां सुसाहितीं
    सुपुत्रतां समीहितायुरष्टभूतिमभ्युपैति सोऽचिरात्॥६॥
