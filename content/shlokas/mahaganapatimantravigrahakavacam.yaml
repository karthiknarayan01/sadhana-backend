id: mahaganapatimantravigrahakavacam
category: mantra
name:
  english: mahaganapatimantravigrahakavacam
  devanagari: महागणपतिमन्त्रविग्रहकवचम्
content:
  english: om onkaro me shirah patu shri~karah patu bhalakam | hri~ bijam me lalate'vyat kli~ bijam bhruyugam
    mama || 1|| glau~ bijam netrayoh patu ga~ bijam patu nasikam | ga~ bijam mukhapadme'vyad mahasiddhiphalapradam
    || 2|| nakaro dantayoh patu pakaro lambikam mama | takarah patu me talvoryekara oshthayormama || 3||
    vakarah kanthadeshe'vyad rakarashcopakanthake | dvitiyastu vakaro me hridayam patu sarvada || 4||
    rakarastu dvitiyo vai ubhau parshvau sada mama | dakara udare patu sakaro nabhimandale || 5|| rvakarah
    patu me lingam jakarah patu guhyake | nakarah patu me janghe mekaro janunordvayoh || 6|| vakarah patu
    me gulphau shakarah padayordvayoh | makarastu sada patu dakshapadangulishu ca || 7|| nakarastu sada
    patu vamapadangulishu ca | yakaro me sada patu dakshapadatale tatha || 8|| svakaro brahmarupakhyo
    vamapadatale tatha | hakarah sarvada patu sarvange ganapah prabhuh || 9|| purve mam patu shrirudrah
    shri~ hri~ kli~ phat kaladharah | agneyyam me sada patu hri~ shri~ kli~ lokamohanah || 10|| dakshine
    shriyamah patu kri~ hra~ ai~ hri~ hsrau~ namah | nairritye nirritih patu a~ hri~ kro~ kro~ namo namah
    || 11|| pashcime varunah patu shri~ hri~ kli~ phat hsrau~ namah | vayurme patu vayavye hru~ hri~ shri~
    hsphre~ namo namah || 12|| uttare dhanadah patu shri~ hri~ shri~ hri~ dhaneshvarah | ishanye patu
    mam devo hrau~ hri~ ju~ sah sadashivah || 13|| prapannaparijataya svaha mam patu ishvarah | urdhvam
    me sarvada patu ga~ glau~ kli~ hsrau~ namo namah || 14|| anantaya namah svaha adhastaddishi rakshatu
    | purve mam ganapah patu dakshine kshetrapalakah || 15|| pashcime patu mam durga ai~ hri~ kli~ candika
    shiva | uttare vatukah patu hri~ va~ va~ vatukah shivah || 16|| svaha sarvarthasiddheshca dayako vishvanayakah
    | punah purve ca mam patu shrimanasitabhairavah || 17|| agneyyam patu no hri~ hri~ hri~ kro~ kro~
    rurubhairavah | dakshine patu mam krau~ kro~ hrai~ hrai~ me candabhairavah || 18|| nairritye patu
    mam hri~ hu~ hrau~ hrau~ hri~ hsrai~ namo namah | svaha me sarvabhutatma patu mam krodhabhairavah
    || 19|| pashcime ishvarah patu kri~ kli~ unmattabhairavah | vayavye patu mam hri~ kli~ kapali kamalekshanah
    || 20|| uttare patu mam devo hri~ hri~ bhishanabhairavah | ishanye patu mam devah kli~ hri~ samharabhairavah
    || 21|| urdhvam me patu deveshah shrisammohanabhairavah | adhastad vatukah patu sarvatah kalabhairavah
    || 22|| itidam kavacam divyam brahmavidyakalevaram | gopaniyam prayatnena yadicchedatmanah sukham
    || 23|| kavacasya ca divyasya sahasravartanannarah | devatadarshanam sadyo labhate na vicarana ||
    24|| iti shrimahaganapati mantravigrahakavacam sampurnam |
  devanagari: ॐ ओङ्कारो मे शिरः पातु श्रीँकारः पातु भालकम् । ह्रीँ बीजं मे ललातेऽव्यात् क्लीँ बीजं भ्रूयुगं
    मम ॥ १॥ ग्लौँ बीजं नेत्रयोः पातु गँ बीजं पातु नासिकाम् । गँ बीजं मुखपद्मेऽव्याद् महासिद्धिफलप्रदम्
    ॥ २॥ णकारो दन्तयोः पातु पकारो लम्बिकां मम । तकारः पातु मे ताल्वोर्येकार ओष्ठयोर्मम ॥ ३॥ वकारः कण्ठदेशेऽव्याद्
    रकारश्चोपकण्ठके । द्वितीयस्तु वकारो मे हृदयं पातु सर्वदा ॥ ४॥ रकारस्तु द्वितीयो वै उभौ पार्श्वौ सदा
    मम । दकार उदरे पातु सकारो नाभिमण्डले ॥ ५॥ र्वकारः पातु मे लिङ्गं जकारः पातु गुह्यके । नकारः पातु मे
    जङ्घे मेकारो जानुनोर्द्वयोः ॥ ६॥ वकारः पातु मे गुल्फौ शकारः पादयोर्द्वयोः । माकारस्तु सदा पातु दक्षपादाङ्गुलीषु
    च ॥ ७॥ नकारस्तु सदा पातु वामपादाङ्गुलीषु च । यकारो मे सदा पातु दक्षपादतले तथा ॥ ८॥ स्वाकारो ब्रह्मरूपाख्यो
    वामपादतले तथा । हाकारः सर्वदा पातु सर्वाङ्गे गणपः प्रभुः ॥ ९॥ पूर्वे मां पातु श्रीरुद्रः श्रीँ ह्रीँ
    क्लीँ फट् कलाधरः । आग्नेय्यां मे सदा पातु ह्रीँ श्रीँ क्लीँ लोकमोहनः ॥ १०॥ दक्षिणे श्रीयमः पातु क्रीँ
    ह्रँ ऐँ ह्रीँ ह्स्रौँ नमः । नैरृत्ये निरृतिः पातु आँ ह्रीँ क्रोँ क्रोँ नमो नमः ॥ ११॥ पश्चिमे वरुणः
    पातु श्रीँ ह्रीँ क्लीँ फट् ह्स्रौँ नमः । वायुर्मे पातु वायव्ये ह्रूँ ह्रीँ श्रीँ ह्स्फ्रेँ नमो नमः
    ॥ १२॥ उत्तरे धनदः पातु श्रीँ ह्रीँ श्रीँ ह्रीँ धनेश्वरः । ईशान्ये पातु मां देवो ह्रौँ ह्रीँ जूँ सः
    सदाशिवः ॥ १३॥ प्रपन्नपारिजाताय स्वाहा मां पातु ईश्वरः । ऊर्ध्वं मे सर्वदा पातु गँ ग्लौँ क्लीँ ह्स्रौँ
    नमो नमः ॥ १४॥ अनन्ताय नमः स्वाहा अधस्ताद्दिशि रक्षतु । पूर्वे मां गणपः पातु दक्षिणे क्षेत्रपालकः ॥
    १५॥ पश्चिमे पातु मां दुर्गा ऐँ ह्रीँ क्लीँ चण्डिका शिवा । उत्तरे वटुकः पातु ह्रीँ वँ वँ वटुकः शिवः
    ॥ १६॥ स्वाहा सर्वार्थसिद्धेश्च दायको विश्वनायकः । पुनः पूर्वे च मां पातु श्रीमानसितभैरवः ॥ १७॥ आग्नेय्यां
    पातु नो ह्रीँ ह्रीँ हृँ क्रोँ क्रोँ रुरुभैरवः । दक्षिणे पातु मां क्रौँ क्रोँ ह्रैँ ह्रैँ मे चण्डभैरवः
    ॥ १८॥ नैरृत्ये पातु मां ह्रीँ हूँ ह्रौँ ह्रौँ ह्रीँ ह्स्रैँ नमो नमः । स्वाहा मे सर्वभूतात्मा पातु
    मां क्रोधभैरवः ॥ १९॥ पश्चिमे ईश्वरः पातु क्रीँ क्लीँ उन्मत्तभैरवः । वायव्ये पातु मां ह्रीँ क्लीँ कपाली
    कमलेक्षणः ॥ २०॥ उत्तरे पातु मां देवो ह्रीँ ह्रीँ भीषणभैरवः । ईशान्ये पातु मां देवः क्लीँ ह्रीँ संहारभैरवः
    ॥ २१॥ ऊर्ध्वं मे पातु देवेशः श्रीसम्मोहनभैरवः । अधस्ताद् वटुकः पातु सर्वतः कालभैरवः ॥ २२॥ इतीदं कवचं
    दिव्यं ब्रह्मविद्याकलेवरम् । गोपनीयं प्रयत्नेन यदीच्छेदात्मनः सुखम् ॥ २३॥ कवचस्य च दिव्यस्य सहस्रावर्तनान्नरः
    । देवतादर्शनं सद्यो लभते न विचारणा ॥ २४॥ इति श्रीमहागणपति मन्त्रविग्रहकवचं सम्पूर्णम् ।
