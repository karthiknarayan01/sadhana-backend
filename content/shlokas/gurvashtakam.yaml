id: gurvashtakam
category: stotram
name:
  english: Gurvashtakam
content:
  english: shariram surupam tatha va kalatram yashashcaru citram dhanam meru tulyam | manashcena lagnam
    guroranghripadme tatah kim tatah kim tatah kim tatah kim || || kalatram dhanam putra pautradisarvam
    griho bandhavah sarvametaddhi jatam | manashcena lagnam guroranghripadme tatah kim tatah kim tatah
    kim tatah kim || || shadkshangadivedo mukhe shastravidya kavitvadi gadyam supadyam karoti | manashcena
    lagnam guroranghripadme tatah kim tatah kim tatah kim tatah kim || || videsheshu manyah svadesheshu
    dhanyah sadacaravritteshu matto na canyah | manashcena lagnam guroranghripadme tatah kim tatah kim
    tatah kim tatah kim || || kshamamandale bhupabhupalabribdaih sada sevitam yasya padaravindam | manashcena
    lagnam guroranghripadme tatah kim tatah kim tatah kim tatah kim || || yasho me gatam dikshu danapratapat
    jagadvastu sarvam kare yatprasadat | manashcena lagnam guroranghripadme tatah kim tatah kim tatah
    kim tatah kim || || na bhoge na yoge na va vajirajau na kantamukhe naiva vitteshu cittam | manashcena
    lagnam guroranghripadme tatah kim tatah kim tatah kim tatah kim || || aranye na va svasya gehe na
    karye na dehe mano vartate me tvanardhye | manashcena lagnam guroranghripadme tatah kim tatah kim
    tatah kim tatah kim || || gurorashtakam yah pathetpurayadehi yatirbhupatirbrahmacari ca gehi | lamedvacchitatham
    padam brahmasanjnam guroruktavakye mano yasya lagnam ||
  devanagari: शरीरं सुरूपं तथा वा कलत्रं यशश्चारु चित्रं धनं मेरु तुल्यम् । मनश्चेन लग्नं गुरोरङ्घ्रिपद्मे
    ततः किं ततः किं ततः किं ततः किम् ॥ ॥ कलत्रं धनं पुत्र पौत्रादिसर्वं गृहो बान्धवाः सर्वमेतद्धि जातम्
    । मनश्चेन लग्नं गुरोरङ्घ्रिपद्मे ततः किं ततः किं ततः किं ततः किम् ॥ ॥ षड्क्षङ्गादिवेदो मुखे शास्त्रविद्या
    कवित्वादि गद्यं सुपद्यं करोति । मनश्चेन लग्नं गुरोरङ्घ्रिपद्मे ततः किं ततः किं ततः किं ततः किम् ॥
    ॥ विदेशेषु मान्यः स्वदेशेषु धन्यः सदाचारवृत्तेषु मत्तो न चान्यः । मनश्चेन लग्नं गुरोरङ्घ्रिपद्मे ततः
    किं ततः किं ततः किं ततः किम् ॥ ॥ क्षमामण्डले भूपभूपलबृब्दैः सदा सेवितं यस्य पादारविन्दम् । मनश्चेन
    लग्नं गुरोरङ्घ्रिपद्मे ततः किं ततः किं ततः किं ततः किम् ॥ ॥ यशो मे गतं दिक्षु दानप्रतापात् जगद्वस्तु
    सर्वं करे यत्प्रसादात् । मनश्चेन लग्नं गुरोरङ्घ्रिपद्मे ततः किं ततः किं ततः किं ततः किम् ॥ ॥ न भोगे
    न योगे न वा वाजिराजौ न कन्तामुखे नैव वित्तेषु चित्तम् । मनश्चेन लग्नं गुरोरङ्घ्रिपद्मे ततः किं ततः
    किं ततः किं ततः किम् ॥ ॥ अरण्ये न वा स्वस्य गेहे न कार्ये न देहे मनो वर्तते मे त्वनर्ध्ये । मनश्चेन
    लग्नं गुरोरङ्घ्रिपद्मे ततः किं ततः किं ततः किं ततः किम् ॥ ॥ गुरोरष्टकं यः पठेत्पुरायदेही यतिर्भूपतिर्ब्रह्मचारी
    च गेही । लमेद्वाच्छिताथं पदं ब्रह्मसञ्ज्ञं गुरोरुक्तवाक्ये मनो यस्य लग्नम् ॥
