id: bhadrakalisahasranamastotram-2
category: sahasranama
name:
  english: bhadrakalisahasranamastotram
  devanagari: भद्रकालीसहस्रनामस्तोत्रम्
content:
  english: rinu devi pravakshyami mantranamasahasrakam | bhadrakalya kalau gopyam jivanmuktaikasadhanam
    || asya namnam sahasrasya rishirbatukabhairavah | chandonushtup samakhyato devata bhadrakalika ||
    krim bijam hum shaktisyatsvaha kilakamucyate | dharmarthakamamoksharthe viniyogah prakirtitah || asya
    shri bhadrakali mantranamasahasrasya batukabhairavarishih anushtup chandah bhaimbhadrakali devata
    krim bijam hum shaktih svaha kilakam dharmarthakamamoksharthe sahasranama pathe viniyogah || atha
    dhyanam | krinkarodbhasitasya mudita shashikala shekharam pretavaham | hunkarodbhasitakshim shivaprabhritisuraih
    sevitam madyamattam || hrim hrim bhaim lalayantim prahasita vadanam sidhupatram vahantim | bhaim hrim
    hum vahnikantakshara sahitarasam bhadrakalim smarami || om krim kali krim hsauh svaha krim kubja krim
    kaniyasim | krim hum hrim kotarakshi ca krim krim krim kuladevata || 1|| aim klim sauh kaulini svaha
    aim sauh klim kulashekhara | om hrim shrim komalangi ca aim krim hum komalalaka || 2|| krim hum hrim
    koshada svaha aim krim bhaim kulakaulini | om hrim krum krurabhasha ca om hrim krim aim kapalini ||
    3|| om krim shrim hum hsauh kamya krim krim krim kamacarini | om hram aim sauh kurupakshi om krim
    kalakshayankari || 4|| hum hrim kamalapatrakshi om krim shrim kamalapriya | krim bhaim kadambari svaha
    krim shrim kamavivardhini || 5|| aim krim hum kurukulla ca krim hum hrim kantarupini | om shrim kanakavarnabha
    aim klim sauh kancanangada || 6|| krim hum krim kamini svaha krim kraim kamakshayankari | om hrim
    shrim krim kshmyum svahakara bandhanamokshada || 7|| krom shrim koshavati svaha aim klim kamalavasini
    | krim krim kamukasevya ca krim kashijanavandita || 8|| krim hum kunkumaliptangi krim shrim krodhitamanasa
    | om krom shrim hum ca koshastha krim kraim krum kraum kalavati || 9|| om shrim hrim shrim krim kathorangi
    om krim kravyadaghatini | om krim kamarigatrastha krim kamarikshayankari || 10|| aim klim krishnambara
    svaha hum krim hrim krishnasevita | om krim katyayani svaha om krim hrim kalinashini || 11|| om krim
    hum bhaim kaladhara hum kalanidhishekhara | aim klim sauh kamadasvaha om krim kutmalakelita || 12||
    om krim kumudapatrakshi krim hum kumudasevita | krim shrim kumarajanani om klim karunyarupini || 13||
    om shrim hrim krim ca kameshi om hrim shrim keshavarcita | om krim kalankarahita krim kuntim krim
    kulodgata || 14|| krim shrim krityambara svaha krim hum kesarivahana | om hrim shrim krim hsauh hum
    hrim kanciyuktanitambini || 15|| krim hum hrim kirtida svaha krim shrim keyurabhasvara | om krim hum
    hrim ca kaushambi krim shrim aim klim ca kaumudi || 16|| om krim hum kamana svaha krom kritantanishevita
    | krim shrim aim koshanamrangi krim hum hrim krauncavahana || 17|| om shrim kenashabhayada kram kapardi
    bhayapaha | krim shrim aim sauh klum hum bhaim kamalasanasevita || 18|| kakarabhushitatanuh om krim
    hum hrim klum payah | om shrim aim khadgini svaha om shrim khrim khagagamini || 19|| om shrim khrim
    khalahantri ca khrim shrim hrim khagalocana | om hrim mlum khecari svaha om shrim khadyotarupini ||
    20|| om aim sauh sarvada svaha om shrim sakaladayini | aim klim sarparcita svaha sauh klim sarpopavitini
    || 21|| shrim klim aim vedavidya ca aim sauh klim varavarnini | om shrim hrim vartada svaha om hrim
    sarvasamashraya || 22|| aim klim satyavati svaha sauh klim shrim sarasa payah | om aim sauh satyabhama
    ca om jum sah sanatani || 23|| om shrim sauh satyasangha ca om shrim sitapatipriya | om aim sauh sundari
    svaha aim sauh sundaravallabha || 24|| om shrim sarojapatrastha om aim sauh klim sarvasurapriya |
    hsauh satyagama hrim shrim krim hum kraum hrim madalasa || 25|| om krim aim sauh blum sadhvi om hrim
    krim sadhujanapriya | om shrim manoramangi ca aim sauh klim sundarangada || 26|| om shrim aim sauh
    sati svaha om shrim shankaravallabha | om hrim klim sanaya svaha aim sauh svedonmukhi payah || 27||
    om shrim suryasahasrabha aim sauh klim satyavadini | om shrim satyatmika svaha aim sauh sarvajanapriya
    || 28|| om shrim aim sauh smitasya ca om shrim aim sauh sitambara | om shrim aim sarvakartri ca aim
    sauh shumbhanisudini || 29|| om shrim sadambara svaha om sauh satyaparayana | om shrim sarvaprada
    svaha shrim hrim shrim satyasangara || 30|| om shrim aim sarvahartri ca om aim sauh sarvamangala |
    om shrim shvetapriya svaha aim sauh shardulagamini || 31|| om hrim shrim shantida shrim klim hum hum
    shambhunishevita | om hrim aim shivada svaha shrim hrim shrim sharika payah || 32|| om shrim aim klim
    ca sharvani om shrim shakha hsauh shikha | om shrim shrum shikhishikhanetra om hrim aim shikhivishtara
    || 33|| om shrim shraim shlishtavidya ca om shrim aim shishupalini | om shrim aim shurpari aim sauh
    shurpakarnasamarcita || 34|| om shrim shiva hsauh klim klim shivavamangavasini | om shrim shrum sidhumatta
    ca shrim klim sah sidhupayini || 35|| om jum sah shitalangi ca shrim hum krim shighragamini | shrim
    shrim shyamambara svaha shrim shyama shrim shavasana || 36|| om krim gim gopavatsa ca om klim kaushikasevita
    | om klim kantishca krim kulla kraum kantarabhujapriya || 37|| om shrim shanka hsauh shishta om shrim
    sharmapradayini | om klim shrim shankhahasta ca om shrim vam venuvadini || 38|| shrim shrim aim aim
    hsauh klim sah shambararimadatura | om aim sauh surasevya ca aim klim siradhvajashrita || 39|| om
    shrim aim klim hsauh krim hum surapanaparayana | om shrim sarvasaha svaha om shrim sarottamottama
    || 40|| om shrim om uttama om om onkarapranavatmika | om prim pratyangira svaha om shrim parvatanandini
    || 41|| om prim parvatapakshaghni om prim pitambarapriya | om shrim prim pashahasta ca om prim pattisadharini
    || 42|| om shrim putasugandhadhya om prim padmavati payah | om prim pativrata svaha prim shrim panaparayana
    || 43|| om shrim hrim pamsula om shrim hrim prim pavanagamini | pavanatmajasevya om klim shrim bijamayi
    payah || 44|| om aim ekakshari svaha om hrim shrim klim ca parvati | hram hum shambhujatabhara om
    sharashcandralepita || 45|| om shrim aim sauh rasananda sunanda shrim hsauh suyata | om hrim shrim
    klim hsauh rajni om shrim rajyapradayini || 46|| om hrim shrim ramani om shrim revashrimadanatura
    | aim sauh rambhopamoru ca aim sauh klim ramavallabha || 47|| aim sauh shrim revati svaha aim klim
    aramavasini | om shrim rajyaprada svaha om shrim ravanaghatini || 48|| om ram raghavasevya ca om hrim
    shrim rohini payah | om shrim aim sauh hsauh klim shrim revatiramanapriya || 49|| om shrim im ram
    ca indra om im indrasamashrita | om hrim shrim aim ca indrakshi aim shrim vritranisudini || 50|| om
    shrim vritrari roghagni om vritrasurapujita | om shrim vrittiprada svaha vrom klim vrittastani payah
    || 51|| om hrim shrim krim hsauh brahmi brom brahmanavaraprada | shrim klim hatyapaha svaha hrim shrim
    klim harisevita || 52|| om shrim hararcita svaha jum haum sah jrimbhini payah | om jam jalandhari
    svaha om shrim hrim hsauh harivahana || 53|| om klim hrim haridashvakshi om hrim harihararcita | om
    shrim klim haihayeshta ca om hrim shrim hayagamini || 54|| am shrim ambhodanilangi am krim ashvasukhapriya
    | am aim ambhojahasta ca am klim ambhojani payah || 55|| om shrim klim shraum shatananda shraum shatanandaghatini
    | om shrim gitapriya svaha om gim gitajna ca glaum gatih || 56|| om shrim gim gunivatsa ca om gim
    shrim guniragini | om gim shrim garudividyangi shrim gim gomati payah || 57|| om gim gatha hsauh svaha
    om gim gandharvasevita | om gim ganeshasevya ca aim sauh gim ganavallabha || 58|| aim klim gim gajarajeshta
    gim shrim gauri hsauh gatih | krim gim galadrasa om gim gajananasamarcita || 59|| om prim shrim padmabhuh
    svaha om sauh jum atmabhu payah | om shrim madhumakshika om aim sauh mrim madalasa || 60|| om shrim
    mrim madhaveshta ca shrim ma hrim shrim rasa payah | om hrim shrim indira shrim klim shrida aim sauh
    ca shrimati || 61|| om shrim klim lalita svaha om shrim gim garudashrita | aim klim nishumbhahantri
    ca shrim hrim mahishagamini || 62|| om aim sauh padmaja hrim shrim mahishasuraghatini | madhukaitabhahantri
    om hrim shrim mrim madhurakshara || 63|| om aim bhagodara svaha shrim klim mrim manmathatura | om
    hrim shrim matida shrim mrim krim hum matangini payah || 64|| om shrim aim khetahasta ca kshmyum kshirambudhisambhava
    | om kshmim kshuritakesha ca aim sauh klim shrim kshamavati || 65|| om shrim aim sauh kshama om shrim
    kshma om aim sauh kshamadhara | om shrim krim kshmyum ca kshanada om shrim kshmyam kshalitambara ||
    66|| om shrim aim sauh janavasa om jum sah hum jaratura | om shrim aim klim hsauh shraddha om prim
    shri puratana || 67|| om prim puranaprakritih om aim klim sauh sarasvati | om krim hum hrim ca varahi
    om shrim vaikunthasudini || 68|| om shrim vetravati svaha om aim vidyamayi payah | om shrim aim klim
    vitasta ca om shrim vimukhaghatini || 69|| om shrim ganga hsauh svaha om krim yam yamuna tatha | om
    shrim sauh sharayu svaha om shrim yogisamarcita || 70|| om shrim yamasvasa svaha om hrim shrim yamamardini
    | om shrim yamaprada klim sauh om shrim yadaspatipriya || 71|| om hrim shrim klim hsauh yatra om shrim
    aim yakshini payah | om shrim aim sauh ca yaksheshi om yam yaksheshvararcita || 72|| aim sauh yuyutsava
    svaha om yam shrim klim ca yamini | om jum yam shrim yajneshi om yam klim yajnadakshina || 73|| om
    shrim aim sauh ca yajnangi om shrim aim sauh yashovati | om shrim yashahprada svaha om klim yam yajnikapriya
    || 74|| om klim yam yajamanastri om shrim yajnikavallabha | om hrim shrim klim hsauh aim sauh yajamanavaraprada
    || 75|| om shrim klim yam yudhisthayi om yam yajnabhujampriya | om shrim yam yajnabhaksha ca om yam
    shrim yajnalalasah || 76|| om shrim aim ishvari svaha im im am yam yamastuta | om shrim im aikiki
    svaha om shrim ayushmati tatha || 77|| om shrim adityavarada am klim adityalocana | om shrim aim aditih
    svaha am anantaphalaprada || 78|| om shrim anantashirshastha om shrim anantashayini | om shrim klim
    ratijna svaha om hrim shrim klim ditistatha || 79|| om shrim aditiputreshta om shrim ditijaghatini
    | om aim klim ambika svaha om aim ratipatipriya || 80|| om shrim klim jagadishani om jum sah jayavardhini
    | om shrim jyotishmati svaha om klim shrim mlecchaghatini || 81|| om shrim rajasvala svaha om ram
    ram rajaki tatha | om shrim klim bahuputra ca om shrim klim hiranandana || 82|| aim klim sauh harini
    svaha om shrim harihareshvari | om shrim hrim abala svaha om am akashagamini || 83|| am shrim aranyavasa
    ca om shrim atmabhuvarcita | am shrim bhushanabhushadhya om shrim bhitimati tatha || 84|| om shrim
    am lokamata ca om shrim lam lakshamatrika | om shrim ram gim hsauh labhya shrim alabhya hsauh lata
    || 85|| om shrim lokeshavarada om shrim lam lasyatatpara | om shrim lohitanetra ca om shrim lavankritistatha
    || 86|| aim sauh lalitajihva ca om shrim lokarisevita | om shrim trilokajanani om jum sah lokaghatini
    || 87|| om shrim dirghajatajuta om shrim jrimbharisevita | om krim jum medini svaha om krim jum sah
    mritinjaya || 88|| om shrim jum jayada svaha om shrim janakanandini | om jum lam jatini svaha om jum
    jagatsamashraya || 89|| om shrim maunavrata svaha om shrim modakabhakshini | om shrim hrim klim glaum
    glum lam modakaharatoshita || 90|| om hrim mudgarahasta ca om hrim matamahi tatha | om prim pitamahi
    svaha om prim pitripitamahi || 91|| om klim pashanarupa ca om prim pashandabhakshini | om aim shrim
    sarvatograstha om prim palitakeshini || 92|| om shrim klim harapatni ca om kalapatni hsauh kuti |
    om hrim shrim vishnupatni ca om hrim shrim klim ca vaishnavi || 93|| om hrim shrim klim hsauh raudri
    om ram klim rudrasevita | om shrim klim sah ca brahmani om shrim brahmendrasevita || 94|| om shrim
    klim vratini svaha om klim drim dakshanandini | om shrim klim aim mlaum krim hum dakshakratuvinashini
    || 95|| om shrim klim vighnahantri ca om shrim vighneshvareshvari | om shrim shyama ca aim bala om
    hrim balakatoshita || 96|| om shrim cam carcitapada ca om shrim cam caruhasini | om klim caturbhuja
    svaha om shrim candanabhasvara || 97|| om aim sauh acyuteshta ca om shrim klim sah cyutalaka | om
    shrim aim carmavastra ca om shrim canyakarajita || 98|| om shrim carvanabhakshya ca om shrim cam carulocana
    | aim klim sauh krim hsauh hrim bhaim ashtadashadalasthita || 99|| om shrim aim sauh ca carvangi om
    shrim candrakalashraya | om shrim candrakaliptangi om krim putasugandhini || 100|| om shrim kasturibhushadhya
    om gim sindurabhushita | om shrim klim chinnamasta ca om shrim klim chinnajanghaka || 101|| om shrim
    hrim strim hsauh tara om aim nilasarasvati | om aim ekajata svaha om shrim klim tarini tatha || 102||
    om shrim strim ugratara ca om shrim strim totala tatha | om shrim krim sauh hsauh stutya om strim
    trailokyavandita || 103|| om shrim krim aim hsauh om strim trayitanuvilocana | om vam vedatrayi svaha
    om shrim agnitrayim tatha || 104|| om prim puratrayi svaha om vam vargatrayi tatha | om sauh vidyatrayi
    shrim klim devi tritayarupini || 105|| om drim devaprasu svaha om drim aim sauh dayavati | om klim
    aim sauh ca dharmajna om shrim dharmanidhistatha || 106|| om shrim drim dhanada svaha aim sauh klim
    dhanadarcita | om shrim hum dharmikeshta ca om shrim dharmijanapriya || 107|| aim sauh dyutimati shrim
    hrim sarvadabhutabhushita | om klim dipti hsauh dhatri om shrim dhurta hsauh dhritih || 108|| om shrim
    dambhavihina ca om shrim dambhikarupini | om shrim mrim modini svaha om klim aim mohini tatha || 109||
    om shrim strim stambhini svaha om aim klim stambhanarupini | om shrim stutimayi svaha om adhyeyaparakrama
    || 110|| om shrim dhyeya hsauh dhutih om shrim dhumramukhi tatha | om shrim klim kalaratrishca om
    shrim sah nalakubari || 111|| om vam vateshvari svaha mahamaya mlaum tatha | om shrim candashara svaha
    om shrim candamadapaha || 112|| om aim klim sauh ca camunda om shrim candeshvari tatha | om shrim
    prim strim pracanda ca shrim aim candamatrika || 113|| om shrim klim sauh shatakshi ca om shrim hrim
    shridharashraya | om shrim vam vishvanishtha ca om klim vishvambhararcita || 114|| om shrim klim vishvadhatri
    ca om vam nrityavilasini | om shrim haum sah nirakara om shrim shakambhari tatha || 115|| om shrim
    ram raktajihva ca om shrim ram raktalocana | om ram raktambara svaha om shrim pingalakeshini || 116||
    om shrim strim sauh tapasya sauh taponishtha hsauh stutih | om shrim klim taulini aim sauh tarakeshi
    hsauh tula || 117|| om shrim hrim hsauh sutarttiya shrim shrim aim muktida tatha | om aim klim sauh
    ca kamakshi om shrim strim pingalalaka || 118|| om shrim aim sauh ca kulaja om shrim krim kuntaleshvari
    | om shri aim klim aparna ca om shrim parnashana tatha || 119|| aim sauh padma hsauh punya om shrim
    prim punyada tatha | om aim punyanidhi shrim klim aim sauh punyajanarcita || 120|| om shrim ashvastutih
    svaha om am ashvamukheshvari | am am ashvamukhi svaha om shrim ashvasamadyuti || 121|| om aim sauh
    ashvaga svaha om shrim klim ashvagayudha | om aim klim kulavageshi om shrim klim kulakaulini || 122||
    om shrim aim sauh kulodbhasa om krim kridashaya tatha | om shrim klim nirahankara om sauh siddha hsauh
    shrutih || 123|| om shrim shrutidhara aim klim jyeshtha aim sauh aja tatha | om shrim jyotih kshmim
    kshama om kshmim kshoda hsauh kshudha || 124|| om klim sah krodini svaha om krom kambalaghatini |
    om krim kambalavastra ca om krim kotindusannibha || 125|| om shrim klim aim ca kalyani om shrim klim
    gomukhi tatha | om jum sah skandajanani om shrim bhaim bhairavarcita || 126|| om shrim bhudharaputri
    ca om aim sah brahmacarini | om klim sah brahmavidya ca om aim klim brahmarupini || 127|| aim klim
    sauh tripura svaha om shrim tripurabhairavi | om shrim tryakshi hsauh strim strim om shrim tribhuvanarcita
    || 128|| om klim treta hsauh amba om shrim tripuraghatini | om shrim hrim krim trirupa ca om aim sauh
    vahnivallabha || 129|| om strim tarunyashobhadhya om strim tanvi hsauh tanuh | om strim talanuga aim
    sauh turi shrim strim sureshvari || 130|| om shrim tamradhara om strim taranih aim ranashrita | om
    shrim taranidipta ca aim sauh nauh klim ca navika || 131|| om shrim namra hsauh nitih om klim sauh
    namrakandhara | om aim sauh narasimhi ca om shrim narayani tatha || 132|| om klim nandanakunjastha
    om shrim bandistuta tatha | om anandamayi klim sauh om shrim atmagati tatha || 133|| om klim arta
    hsauh adya om shrim ijya kshmim strutih | om shrim samagata aim sauh samya klim samagayini || 134||
    om shrim sanakasevya ca shrim hrim shrim sabhaya tatha | om aim sauh svagatih svaha om shrim sagarasambhava
    || 135|| om strim shrim drutaga svaha om vam vedashrutistatha | om aim sauh varuni svaha shrim hrim
    shrim varunarcita || 136|| aim shrim klim vibhava svaha shrim klim vishvaprakashini | om sauh klim
    viramata ca aim sauh shrim viranandini || 137|| shrim klim varangana svaha om hrim shrim janmavallabha
    | aim sauh klim nilagriva ca aim sauh durga hsauh dari || 138|| om nila hsauh nanda klim nutih shrim
    nagatmaja | om aim sauh nilavastra ca om shrim klim nilalocana || 139|| om drim druhinasevya ca om
    shrim drim klim dharadhara | om deveshi hsauh devi om shrim drim dullilocana || 140|| om strim tomarahasta
    ca om shrim klim mundamalini | om jum jihvadhara svaha om shrim jambavadashraya || 141|| om jum aim
    sauh hsauh klim shrim jambudvipanivasini | om jum sah klim hsauh aim sauh jaramaranavarjita || 142||
    aim mahadurgatihari om sauh mahishmati tatha | krim kashmiri hsauh reva om shrim kashi hsauh kuni
    || 143|| om ayodhya hsauh maya om shrim mrim mathurapuri | om hrim himacalastha ca om shrim hrim vindhyavasini
    || 144|| om klim mrim merusamstha ca om shrim klim amaravati | om jum mantratmika svaha om shrim maramadankita
    || 145|| om shrim shesha hsauh sakshi om shrim sheshagata tatha | om ashesha hsauh shveta om shiti
    om sushitala || 146|| om giti hsauh kara om sauh karavibhushita | om shrim mrim malayastha ca om mrim
    malayacarcita || 147|| om klim calacala aim sauh klim caracarasevita | om shrim klim kavyashakti ca
    om krim kavisamarcita || 148|| om shrim graheshvari svaha om gim grahanishevita | om shrim strim akshari
    svaha om shrim strim satvarupini || 149|| om shrim hrim klim hsauh aim sauh mahatripurasundari | om
    shrim hrim annapurna ca om hrim shrim vajrayogini || 150|| om hrim jvalamukhi caiva om klim sah sharada
    tatha | om hrim shrim siddhalakshmi ca mahalakshmi hsauh tatha || 151|| om prim payodharabha ca om
    shrim payodharankita | om prim praja hsauh pranta prim prabha shrim prabhavada || 152|| om prim pancamaga
    svaha om aim nakshatramalini | strim tithih shrim atulya ca shrim tryarna klim trapavati || 153||
    om shrim toma hsauh treta om jum tribhuvaneshvari | om shrim aja hsauh antya klim amba shrim krameshvari
    || 154|| krim hum kotirasa hsauh krura om shrim kautilyasevita | om shrim kanti hsauh malli om hrim
    shrim malati tatha || 155|| om mrim shrim mallika krim hum marjari mrim manorama | om shrim mati hsauh
    manya om mrim klim manada tatha || 156|| om jum shrim malini om krim matta hrim manasashraya | om
    strim tapi hsauh sindhuh candrabhaga hsauh tatha || 157|| om shrim munihsuta shrim sah tapodhanasamarcita
    | om klim strim tapasi svaha om shrim strim aim trilocana || 158|| om shrim hrim vaidyavidya ca om
    klim vaidyaprasu tatha | om shrim hrim navodha ca om strim nebim hsauh munih || 159|| om shrim nagatmaja
    svaha om aim sauh nagini tatha | om shrim navambaradhara om aim sauh navani tatha || 160|| om shrim
    aim shrim navanitangi om shrim ambasunandini | om shrim prita hsauh pama om shrim klim pivarastani
    || 161|| om shrim hrim prim ca pinangi om klim aim parvatatmaja | om shrim shobhavati svaha om klim
    shanta hsauh shiva || 162|| om aim sauh spandini svaha om shrim hrim spandanasthita | om shrim rasatmika
    svaha om hram mandodari tatha || 163|| om shrim mandagatih svaha om shrim mandanana tatha | om shrim
    mandaprasu svaha om shrim mandakshayankari || 164|| om shrim klim ballavi svaha shrim balli hrim prabalika
    | om shrim hrim vanija svaha om prim punyangana tatha || 165|| om krim hum kamadhenushca om shrim
    am annadayini | om prim shrim klim mahamari aim shrim mrityuhara tatha || 166|| om shrim hrim mrim
    hsauh madhvi mrim madhvirasaghurnita | om shrim klim aim sauh hsauh mata aim klim sauh manasi tatha
    || 167|| om mahabhashini krim hum krida krim krim kasha tatha | om hrim shrim krodahantri ca krim
    krim krim kamarocana || 168|| om shrim kamavati svaha om aim bhagya hsauh bhaga | om shrim gandharvakanya
    ca om gim gajanibhakritih || 169|| om shrim goptri hsauh guhya om shrim gajajinambara | om shrim pinga
    hsauh sankhya om shrim saukhyakari tatha || 170|| om shrim sukhatmika svaha om shrim sahasakarini
    | om shrim klim sajaya svaha om shrim gim janavallabha || 171|| aim sauh klim drim dvija aim sauh
    danta klim danatatpara | om krim kalashahasta ca krim hum kunjaragamini || 172|| om krim kaulagatih
    shrim hrim kumatih krim ca capini | om krim kapivareshani klim kapindravaraprada || 173|| om krim
    shrim vinata hrim shrim vainateyasamarcita | om klim shrim viratih svaha om klim vanarasevita || 174||
    om krim hum hrim kalankeshi krim lankeshanishevita | om kram lata hsauh luta om krim shrim lalitambara
    || 175|| krim hum hrim kleshahartri ca om klim lilavati tatha | om shrim lola aim klim lata aim klim
    musalayudha tatha || 176|| om aim shrim adidevi ca om shrim shunyagata tatha | om klim shrim shankari
    svaha sarvasmmohani hsauh || 177|| om shrim shubhankari svaha hrim kshmam kshemankari tatha | om shrim
    ashokapatrabha om ashoka hsauh tama || 178|| om shrim gim gadini svaha gim gadadharasevita | shrim
    lam lolarasa svaha krim kripanakara tatha || 179|| om shrim hsauh klim hrim vidyut om shrim jimutavallabha
    | aim sauh klim shrim jaradhyaksha om strim tarusamashrita || 180|| om klim hrim hotika svaha shrim
    hrim klim haravallabha | aim sauh aim vagbhavi svaha om vam virutsamarcita || 181|| om shrim vidyamayi
    hrim klim om jum janitavaibhava | om shrim virarcita aim sauh vadhuh hram klim vareshvara || 182||
    om klim hrim varahasta ca om vam varapradayini | om shrim klim sah ca vacala aim sauh vacalapujita
    || 183|| om shrim vinashada om hrim virupa aim varuthini | om ram vaishvanarakshi ca om shrim sauh
    vayunandini || 184|| om klim vayutanuh aim sauh valisha om varitanuh | om krim vama hsauh vira om
    shrim vaishvanararcita || 185|| om aim valmikipujya ca om valmikadhara hsauh | om shrim sita hsauh
    aim klim dharadharasuta tatha || 186|| om shrim dhara hsauh dhatri om deveshvarapujita | om shrim
    rukmangadeshta ca aim sauh klim rukmabhasvara || 187|| om ram rukmangada shrim klim rukmini om hsauh
    rama | om shrim ram aruneshani om shrim arvacini hsauh || 188|| om bhaim ashtarapadmastha om hrim
    shrim ashtami tatha | om shrim krim hum amavasya om tithi aim trayodashi || 189|| om aim ekadashi
    shrim hrim dvadashi shrim caturdashi | om aim sauh klim saptami shrim shrim dashami aim supurnima
    || 190|| om shrim shuddhatmika aim sauh shuddha shrim shuddharupini | om krim hum shukrasevya ca krim
    shukreshi hsauh shucih || 191|| krim hum shrim saptatih om shrim sarvangi aim shiveshvari | om aim
    shuddheshvari aim klim shrimati shrim shravishrava || 192|| om aim shreyaskari om shrim shrida om
    shrim dhareshvari | om aim shrim shaktirupa ca aim shrim shabdadivallabha || 193|| om shrim klim shrutpatih
    shrim klim klebeshi krim kurupini | om shrim muvishtara shrim klim shreshtha aim shambhavi hsauh ||
    194|| om shrim klim nityaklinna shrim naranarayaneshvari | om naradhipasevya ca shrim narayanavallabha
    || 195|| om klim shrim padmapatrakshi om aim purvadhikeshvari | om klim prim shrim apurva ca om shrim
    klim prim paratpara || 196|| om aparabhava aim klim paravarasamashrita | om shrim pallavahasta ca
    om shrim prim pallavadhara || 197|| om strim payodhasadrishi om payodharabharini | om prim parangama
    svaha om prim pashavimocini || 198|| prim klim pashcimadigrupa om prim pashanamandita | om shrim pitambareshani
    om krim kevalarupini || 199|| om shrim mahadashashteshi om krim makuragamini | om krim mantritagatra
    ca om gim guruprabhavada || 200|| om gim gurvi hsauh goshthi gim gunjavalibhushita | om gim godavari
    klim gim goshthikanandadayini || 201|| om gim goshthatmika aim sauh gaurangi gim guruttama | om gim
    shrim gamyarupa gim agamya hsauh guti || 202|| om gim gitapriya om gim gajarajanishevita | om shrim
    ram raktadanta om raktabijanisudini || 203|| om klim shrim hrim madhumati om aim sauh svapnanayika
    | om shrim klim svapnamaya ca aim sauh svapnavati tatha || 204|| shrim svadumayi aim sauh saratma
    aim samarcika | aim sauh satya hsauh sartri om shrim mantraphalaprada || 205|| om sadrupa hsauh sajja
    aim majja sauh dhanurlata | om shrim dhanurdhareshani drim shrim dhumarakeshini || 206|| om shrim
    mayavati svaha om shrim klim kubjacarini | aim klim kathorapulaka krim karmukaphalaprada || 207||
    krim krim krim karmada hum hum karmalesha hsauh katih | krim karmeshtha hsauh kuh aim karmastha krim
    ca karmini || 208|| om krim karmukahasta ca krim karmukaravakula | krim kapolasaddiptih krim krim
    kamalajarcita || 209|| krim lekhakapriya krim hum lekhya krim lekhacarika | krim mashirupini aim klim
    mushti aim mushtivardhini || 210|| krim mrom mohaprada srim srum mantravidya hsauh magha | om shrim
    sundari shrim shrim saradarpasamujjvala || 211|| aim shrim majja hsauh shrim mrim aim sauh mutrapurishika
    | aim sauh klim shrim sunanda ca aim sauh klim sadgatih tatha || 212|| om shrim santanavalli ca om
    santanaphalaprada | om shrim mahodari aim sauh sah praja aim prajavati || 213|| om bhratrivallabha
    bhaim krim bhitiha bhaim bhatarcita | om bhateshi hsauh kadruh om krim hum kanakeshvari || 214|| krim
    skandajanani aim sauh drim dadimaphalanana | shrim dirghasya hsauh dhih shrim dyumaninduvilocana ||
    215|| om drim dambheshalobhadhya om shrim dhih sacivashraya | am shrim amatyavargeshta om amatyapriyankari
    || 216|| om shrim asilata krim hum anekaksharabhushana | om krim alparasa hsauh shrim alpahasa hsauh
    anuh || 217|| om shrim atribhara aim sauh havabhavasamanvita | aim sauh sitkarini svaha aim sauh surasamandana
    || 218|| aim sura shrim suradevi aim surasurasevita | aim shrim satkaraga svaha om shrim satkarapujita
    || 219|| om sauh sadhakasevya ca aim sauh sadhakavallabha | om hrim shrim bhaim ca bhirunda om krim
    bhaim bhagamalini || 220|| om bhaim bhagodara hrim bhaim bhima hum bhaim bhagatmika | om bhaim bhargashikha
    hum bhaim bhasvati bhaim hsauh bhaga || 221|| om bhaim bhageshvari svaha om bhaim bhargangavasini
    | om shrim bhaim bhanumadhyatha krim hrim bhaim baindaveshvari || 222|| om bhaim bandhurarupa ca om
    bhaim bhasvararupini | om bhaim balibhujakanta om bhaim balinishevita || 223|| om bhaim balibalaghni
    om bhaim balya bhaim balatmika | om bhaim shrim bhucari om shrim bhucaranamatipriya || 224|| om bhaim
    krim bhagini hum bhaim bhaveshi bhaim bhagotsuka | bhaim shrim bhagaikalinga bhaim bhagalingasukhavaha
    || 225|| om bhaim bhagaikashukra bhaim krim bhaim bhuvanapalini | krim hum hrim hrim hsauh kali krim
    hrim dakshinakalika || 226|| krim krim krim hrim hrim svaha devi shmashanakalika | krim krim krim
    hum hum hrim hrim bhaim bhaim svaha bhadrakalika || 227|| iti bhaim bhadrakalyashca mantranama sahasrakam
    | bhadrakalyashca sarvasvam rahasyatirahasyakam || 228|| bhaim bijarupatatvaikam mantragarbham param
    mahat | sarvagamaikasarantu saratsarottamottamam || 229|| sarvamantramayam divyam siddhavidya vinayakam
    | sarvapapa prashamanam rahasyam tridivaukasam || 230|| gopyam gopyatamam gopyam guptaguptatamam kalau
    | bhogadam mokshadam stutyam sarvavarga phalapradam || 231|| mantratmikam manumayam trailokyoddharanakshamam
    | jagatsaram sthito brahma tatah saram shivah smritah || 232|| tatah shaktih smritah saram tatah tatah
    tripurasundari | tatah shri dakshinakali tato bhaim bhadrakalika || 233|| dvavimshatyakshari devi
    sarvamritamayi shiva | siddhida buddhida loke sarvamantramayi tatha || 234|| shuddhacaitanyarupeyam
    vidya bhuvana durlabha | dvavimshatyakshari vidya pratiloma svarupini || 235|| gopita gopaniya ca
    saratsarottamottama | asya saramidam namnam sahasram mantragarbhakam || 236|| natra shuddherapekshasti
    na va mitradi dushanam | na mohena ca daurbalyam na shoko niyamo na va || 237|| sarvathamritarupa
    ca vidyeyam shuddharupini | tat brahmamayi vidya tat bijamayi tatha || 238|| na daridryabhayam devi
    na ca durbhikshapidanam | na ca maribhayam tatra yatra namnasahasrakam || 239|| ardharatre pathennamnam
    sahasram mantragarbhakam | striya sahacaredbhogam devi darshanamapnuyat || 240|| vinardharatra samaye
    pathanam na phalapradam | brahmahatya gurorhatya brahmahatya priya vadham || 241|| tatkshalayati vidyeyam
    dvavimshatyaksharapara | trayastrimshatakotinam devatanam maheshvari || 242|| tejorupamidam namnam
    sahasram mantrarupakam | rahasyam putrapautradi go gajashvaratha pradam || 243|| amavasyam ravervare
    madhyanhe kupa sannidhau | pathenmantri trivaram yah sa bhavet bhakta visheshatah || 244|| bhaumeshtamyam
    ca sayam yah patheddipagatorahah | tasya sarvartha siddhih syanatidura maheshvarih || 245|| shuklecaikadashi
    ratrau likhenamnasahasrakam | karpura kunkumarakta kasturi malayaih shanaih || 246|| tavibhurjasya
    deveshi dhupadipadi purvakam | nilavastrena samveshtyam lakshaya pariveshtayet || 247|| suvarnenapisamveshtaya
    pancagavyena shodhayet | ravau kanya navaprita sampujya vidhivat shive || 248|| bhojayittatatodevi
    gutikeyam phalaprada | vandhyalabhetsutat shighram nirdhano dhanamapnuyat || 249|| sarvatha sarvada
    loke gutikeyam bhavishyati | yo stri vamakare va dharaye purushe dakshine bhuje || 250|| tatratphalamavapnoti
    yatranmanasi vartate | prabhate parvate namnam sahasram mantragarbhakam || 251|| stambhayedapi brahmanam
    mohayedapi keshavam | marayedapi kinasham vashayedapi shankaram || 252|| uccatayati svanshatrunakarshayati
    yoshitah | stambhayedvayu surya ca shamayedapi pavakam || 253|| idam namnam sahasrantu bhadrakalyashca
    pathanam | rane rajakule dyute vivade shatru samsadim || 254|| sadhako jayamapnoti smaranatsadhakeshvari
    | rajyam deyam shiro deyam deya santatirarthine || 255|| bhadrakalya idam namnam sahasram manmukhoditam
    | no deyam sadhakaih devi vinashishyaya siddhaye || 256|| durjanaya akulinaya bhrashtaya amitabhashine
    | na datavyam na datavyam sadhakai sarva siddhaye || 257|| svashishyaya kulinaya bhaktaya mitabhashine
    | datavyam sadhakairdevi shubhadam svasiddhaye || 258|| yah pathetpathayedvapi sha
  devanagari: ृणु देवि प्रवक्ष्यामि मन्त्रनामसहस्रकम् । भद्रकाल्या कलौ गोप्यं जीवन्मुक्तैकसाधनम् ॥ अस्य
    नाम्नां सहस्रस्य ऋषिर्बटुकभैरवः । छन्दोनुष्टुप् समाख्यातो देवता भद्रकालिका ॥ क्रीं बीजं हूं शक्तिस्यात्स्वाहा
    कीलकमुच्यते । धर्मार्थकाममोक्षार्थे विनियोगः प्रकीर्तितः ॥ अस्य श्री भद्रकाली मन्त्रनामसहस्रस्य बटुकभैरवऋषिः
    अनुष्टुप् छन्दः भैंभद्रकाली देवता क्रीं बीजं हूं शक्तिः स्वाहा कीलकं धर्मार्थकाममोक्षार्थे सहस्रनाम
    पाठे विनियोगः ॥ अथ ध्यानम् । क्रीङ्कारोद्भासितास्या मुदित शशिकला शेखरां प्रेतवाहाम् । हूङ्कारोद्भासिताक्षीं
    शिवप्रभृतिसुरैः सेवितां मद्यमत्ताम् ॥ ह्रीं ह्रीं भैं लालयन्तीं प्रहसित वदनां सीधुपात्रं वहन्तीम्
    । भैं ह्रीं हूं वह्निकान्ताक्षर सहितरसां भद्रकालीं स्मरामि ॥ ॐ क्रीं काली क्रीं ह्सौः स्वाहा क्रीं
    कुब्जा क्रीं कनीयसीम् । क्रीं हूं ह्रीं कोटराक्षी च क्रीं क्रीं क्रीं कुलदेवता ॥ १॥ ऐं क्लीं सौः कौलिनी
    स्वाहा ऐं सौः क्लीं कुलशेखरा । ॐ ह्रीं श्रीं कोमलाङ्गी च ऐं क्रीं हूं कोमलालका ॥ २॥ क्रीं हूं ह्रीं
    कोशदा स्वाहा ऐं क्रीं भैं कुलकौलिनी । ॐ ह्रीं क्रूं क्रूरभाषा च ॐ ह्रीं क्रीं ऐं कपालिनी ॥ ३॥ ॐ क्रीं
    श्रीं हूं ह्सौः काम्या क्रीं क्रीं क्रीं कामचारिणी । ॐ ह्रां ऐं सौः कुरूपाक्षी ॐ क्रीं कालक्षयङ्करी
    ॥ ४॥ हूं ह्रीं कमलपत्राक्षी ॐ क्रीं श्रीं कमलप्रिया । क्रीं भैं कादम्बरी स्वाहा क्रीं श्रीं कामविवर्धिनी
    ॥ ५॥ ऐं क्रीं हूं कुरुकुल्ला च क्रीं हूं ह्रीं कान्तरूपिणी । ॐ श्रीं कनकवर्णाभा ऐं क्लीं सौः काञ्चनाङ्गदा
    ॥ ६॥ क्रीं हूं क्रीं कामिनी स्वाहा क्रीं क्रैं कामक्षयङ्करी । ॐ ह्रीं श्रीं क्रीं क्ष्म्यूं स्वाहाकारा
    बन्धनमोक्षदा ॥ ७॥ क्रों श्रीं कोशवती स्वाहा ऐं क्लीं कमलवासिनी । क्रीं क्रीं कामुकसेव्या च क्रीं काशीजनवन्दिता
    ॥ ८॥ क्रीं हूं कुङ्कुमलिप्ताङ्गी क्रीं श्रीं क्रोधितमानसा । ॐ क्रों श्रीं हूं च कोशस्था क्रीं क्रैं
    क्रूं क्रौं कलावती ॥ ९॥ ॐ श्रीं ह्रीं श्रीं क्रीं कठोराङ्गी ॐ क्रीं क्रव्यादघातिनी । ॐ क्रीं कामारिगात्रस्था
    क्रीं कामारिक्षयङ्करी ॥ १०॥ ऐं क्लीं कृष्णाम्बरा स्वाहा हूं क्रीं ह्रीं कृष्णसेविता । ॐ क्रीं कात्यायनी
    स्वाहा ॐ क्रीं ह्रीं कलिनाशिनी ॥ ११॥ ॐ क्रीं हूं भैं कलाधारा हूं कलानिधिशेखरा । ऐं क्लीं सौः कामदास्वाहा
    ॐ क्रीं कुट्मलकेलिता ॥ १२॥ ॐ क्रीं कुमुदपत्राक्षी क्रीं हूं कुमुदसेविता । क्रीं श्रीं कुमारजननी ॐ
    क्लीं कारुण्यरूपिणी ॥ १३॥ ॐ श्रीं ह्रीं क्रीं च कामेशी ॐ ह्रीं श्रीं केशवार्चिता । ॐ क्रीं कलङ्करहिता
    क्रीं कुन्तीं क्रीं कुलोद्गता ॥ १४॥ क्रीं श्रीं कृत्यम्बरा स्वाहा क्रीं हूं केसरिवाहना । ॐ ह्रीं श्रीं
    क्रीं ह्सौः हूं ह्रीं काञ्चीयुक्तनितम्बिनी ॥ १५॥ क्रीं हूं ह्रीं कीर्तिदा स्वाहा क्रीं श्रीं केयुरभास्वरा
    । ॐ क्रीं हूं ह्रीं च कौशाम्बी क्रीं श्रीं ऐं क्लीं च कौमुदी ॥ १६॥ ॐ क्रीं हूं कामना स्वाहा क्रों
    कृतान्तनिषेविता । क्रीं श्रीं ऐं कोशनम्राङ्गी क्रीं हूं ह्रीं क्रौञ्चवाहना ॥ १७॥ ॐ श्रीं केनाशभयदा
    क्रां कपर्दि भयापहा । क्रीं श्रीं ऐं सौः क्लूं हूं भैं कमलासनसेविता ॥ १८॥ ककारभूषिततनुः ॐ क्रीं हूं
    ह्रीं क्लूं पयः । ॐ श्रीं ऐं खड्गिनी स्वाहा ॐ श्रीं ख्रीं खगगामिनी ॥ १९॥ ॐ श्रीं ख्रीं खलहन्त्री च
    ख्रीं श्रीं ह्रीं खगलोचना । ॐ ह्रीं म्लूं खेचरी स्वाहा ॐ श्रीं खद्योतरूपिणी ॥ २०॥ ॐ ऐं सौः सर्वदा
    स्वाहा ॐ श्रीं सकलदायिनी । ऐं क्लीं सर्पार्चिता स्वाहा सौः क्लीं सर्पोपवीतिनी ॥ २१॥ श्रीं क्लीं ऐं
    वेदविद्या च ऐं सौः क्लीं वरवर्णिनी । ॐ श्रीं ह्रीं वर्तदा स्वाहा ॐ ह्रीं सर्वसमाश्रया ॥ २२॥ ऐं क्लीं
    सत्यवती स्वाहा सौः क्लीं श्रीं सरसा पयः । ॐ ऐं सौः सत्यभामा च ॐ जुं सः सनातनी ॥ २३॥ ॐ श्रीं सौः सत्यसङ्घा
    च ॐ श्रीं सीतापतिप्रिया । ॐ ऐं सौः सुन्दरी स्वाहा ऐं सौः सुन्दरवल्लभा ॥ २४॥ ॐ श्रीं सरोजपत्रस्था ॐ
    ऐं सौः क्लीं सर्वसुरप्रिया । ह्सौः सत्यगमा ह्रीं श्रीं क्रीं हूं क्रौं ह्रीं मदालसा ॥ २५॥ ॐ क्रीं
    ऐं सौः ब्लूं साध्वी ॐ ह्रीं क्रीं साधुजनप्रिया । ॐ श्रीं मनोरमाङ्गी च ऐं सौः क्लीं सुन्दराङ्गदा ॥
    २६॥ ॐ श्रीं ऐं सौः सती स्वाहा ॐ श्रीं शङ्करवल्लभा । ॐ ह्रीं क्लीं सनया स्वाहा ऐं सौः स्वेदोन्मुखी
    पयः ॥ २७॥ ॐ श्रीं सूर्यसहस्राभा ऐं सौः क्लीं सत्यवादिनी । ॐ श्रीं सत्यात्मिका स्वाहा ऐं सौः सर्वजनप्रिया
    ॥ २८॥ ॐ श्रीं ऐं सौः स्मितास्या च ॐ श्रीं ऐं सौः सिताम्बरा । ॐ श्रीं ऐं सर्वकर्त्री च ऐं सौः शुम्भनिसूदिनी
    ॥ २९॥ ॐ श्रीं साडम्बरा स्वाहा ॐ सौः सत्यपरायणा । ॐ श्रीं सर्वप्रदा स्वाहा श्रीं ह्रीं श्रीं सत्यसङ्गरा
    ॥ ३०॥ ॐ श्रीं ऐं सर्वहर्त्री च ॐ ऐं सौः सर्वमङ्गला । ॐ श्रीं श्वेतप्रिया स्वाहा ऐं सौः शार्दूलगामिनी
    ॥ ३१॥ ॐ ह्रीं श्रीं शान्तिदा श्रीं क्लीं हूं हूं शम्भुनिषेविता । ॐ ह्रीं ऐं शिवदा स्वाहा श्रीं ह्रीं
    श्रीं शारिका पयः ॥ ३२॥ ॐ श्रीं ऐं क्लीं च शर्वाणी ॐ श्रीं शाखा ह्सौः शिखा । ॐ श्रीं श्रूं शिखिशिखानेत्रा
