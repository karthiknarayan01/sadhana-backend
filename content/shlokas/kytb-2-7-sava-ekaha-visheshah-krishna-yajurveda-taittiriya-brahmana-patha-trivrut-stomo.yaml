id: kytb-2-7-sava-ekaha-visheshah-krishna-yajurveda-taittiriya-brahmana-patha-trivrut-stomo
category: stotram
name:
  english: KYTB 2.7 Sava Ekaha Visheshah - Krishna Yajurveda Taittiriya Brahmana Patha - Trivrut Stomo
content:
  english: krishna yajurvediya taittiriya brahmane dvitiyashtake saptamah prapathakah shri gurubhyo namah
    | harih om || thstomo bhavati | brahmavarcasam vai~ trivrit | brahmavarcasamevavarundhe || agnishtoma
    ssomo bhavati | brahmavarcasam va~ agnishtomah | brahmavarcasamevavarundhe || rathantaragm sama bhavati
    | brahmavarcasam vai~ rathantaram | brahmavarcasamevavarundhe || parisraji hota bhavati || || aruno
    mirmirastrishukrah | eta dvai brahmavarcasasya rupam | rupenaiva brahmavarcasamavarundhe || brihaspati
    ngaccheyamiti | sa eta mbrihaspatisavamapashyat | tama 'harat | tenayajata | tato vai sa devana magacchat
    | yah purodhakama ssyat | sa brihaspatisavena yajeta || || purodhameva gacchati || tasya pratassavane
    sanneshu narashagmseshu | ekadasha dakshina niyante | ekadasha maddhyadinne savane sanneshu narashagmseshu
    | ekadasha tritiyasavane sanneshu narashagmseshu | trayastrigmsha thsampadyante | trayastrigmsha |
    devata evavarundhe || ashvashcatustrigmshah | prajapatyo va ashvah || shcatustrigmsho devatanam |
    yavatireva devatah | ta evavarundhe || krishnajine 'bhishincati | brahmano va eta tkrishnajinam |
    brahmavarcasenaivainagm samardhayati || ajyenabhishincati | tejo va ajya gneyo bhavati | agnimukha
    hyriddhih || atha ya tpaushnah | pushtirvai pusha | pushti rvaishyasya | pushtimevavarundhe || prasavaya
    savitrah || atha ya ttvashtrah | tvashta hi rupani vikaroti || nirvarunatvaya varunah || || atho ya
    eva kashca san | sa hi varunah || atha ya shvadevah | vaishvadevo hi vaishyah || atha ya nmarutah
    | maruto hi vaishyah || saptaitani havigmshi bhavanti | saptagana vai marutah || prishnih pashthauhi
    marutyalabhyate | vidvai marutah || visha evaita 'bhishicyate | tasma dva esha vishah priyah | visho
    hi maddhyato 'ddhyabhishincati | sa hi prajanayita || daddhna 'bhishincati | urgva annadya mannadyena
    samardhayati || gneyo bhavati | agneyo vai bra thsaumyah | saumyo hi bra hmanah || prasavayaiva savitrah
    || atha ya haspatyah | etadvai bra m || atha yadagnishomiyah | agneyo vai bra hmanah | tau yada sagancchete
    || || atha viryavattaro bhavati || atha ya thsarasvatah | etaddhi pratyaksha mbrahmanasya vakpatiya
    m || nirvarunatvayaiva varunah | atho ya eva kashca san | sa hi varunah || atha ya ddyavaprithivyah
    | indro vritraya vajramudayacchat | ta ndyavaprithivi nanvamanyetam | tametenaiva bhagadheyena ||
    vajrasya va esho 'numanaya | anumatavajra ssuyata iti || ashtavetani havigmshi bhavanti | ashtakshara
    gayatri | gayatri brahmavarcasam | gayatriyaiva brahmavarcasamavarundhe || hiranyena ghritamu tpunati
    | tejasa eva ruce || krishnajine 'bhishincati | brahmano va etadrikhsamayo rupam | ya tkrishnajinam
    | brahmannevaina raddhyabhishincati || ghritena bhishincati | tatha viryavattaro bhavati || bhagadheyenanvamanyetagm
    somasavah na vai somena somasya savo 'sti | hato hyeshah | abhishuto hyeshah | na hi hata | saumigm
    sutavashamalabhate | somo vai retodhah | reta eva ta ddadhati || saumyarca 'bhishincati | retodha
    hyasha | reta ssomah | reta evasmi tkinca rajasuyamrite soma yu~thsu pritanasu papri vri~janasya gopam
    | bhareshujagm sukshitigm sushravasam | jayanta ntvamanu madema soma || prithisavah yo vai somena
    suyate | sa devasavah | yah pashuna suyate | sa devasavah | ya ishtya suyate | sa manushyasavah |
    etam vai~ prithaye devah prayacchann | tato vai so mpashunamasuyata | yavatih kiyatishca praja vacam
    va~danti | tasagm sarvasagm suyate || || ya etena yajate | ya u cainamevam ve~da || narashaggsyarca
    'bhishincati | manushya vai narashagmsah | nihnutya vavaitat | athabhishincati || ya mbhavati || ye
    me pancashata ndaduh | ashvanagm sadhastutih | dyumadagne mahi shravah | briha m | nrivadamrita nrinam
    || sadhastutistrini ca gosavah esha gosavah | shattrigmsha ukthyo briha thsama | pavamane kanvarathantara
    mbhavati || yo vai vajapeyah | sa samratthsavah | yo rajasuyah | sa varunasavah | prajapati mparameshthi
    | svara ngaureva || gauriva bhavati || || ya etena yajate | ya u cainamevam drathantare bhavatah |
    taddhi svara ndakshinah | taddhi svara jyam || pratidhusha 'bhishincati | taddhi svara jyam || anuddhate
    vedyai dakshinata ahavaniyasya brihata mpratyabhishincati | iyam || asau brihat | anayorevaina mabhishincati
    || pashustomo va eshah | tena gosavah | shattrigmsha ssarvah || revajjata ssahasa vriddhah | kshatrana
    nkshatrabhrittamo vayodhah | maha nmahitve tastabhanah | kshatre rashtre ca jagrihi | prajapatestva
    parameshthina odanasavamantrah sigmhe vyaghra uta ya pridakau | tvishiragnau bra hmane surye ya |
    indram ya~ devi subhaga jajana | sa na agan varcasa sam vi~dana || ya rajanye dundubhavayatayam |
    ashvasya krandye purushasya mayau | indram ya~ devi subhaga jajana | sa na agan varcasa sam vi~dana
    || ya hastini dvipini ya hiranye | tvishi rashveshu purusheshu goshu || ya~ devi subhaga jajana |
    sa na agan varcasa sam vi~dana || rathe aksheshu vrishabhasya vaje | vate parjanye varunasya shushme
    ya~ devi subhaga jajana | sa na agan varcasa sam vi~dana || radasi viradasi | samradasi svaradasi
    || indraya tva tejasvate tejasvantagg shrinami | indraya tvaujasvata ojasavantagg || indraya tva payasvate
    payasvantagg shrinami | indraya tva ''yushmata ayushmantagg tte prayacchami | tejasvadastu me mukha
    m | tejasvacchiro astu me | tejasvan vishvatah pratyam | tejasa sampiprigdhi ma || ojo || ojasvadastu
    me mukha m | ojasvacchiro astu me | ojasvan vishvatah pratyam | ojasa sampiprigdhi ma || payo 'si
    | tatte prayacchami | payasvadastu me mukha m | payasvacchiro astu me | payasvan vishvatah pratyam
    | payasa sampiprigdhi ma || tte prayacchami | ayushmadastu me mukha m | ayushmacchiro astu me | ayushman
    vishvatah pratyam | ayusha sampiprigdhi ma || imamagna ayushe varcase kridhi | priyagm reto varuna
    soma rajann | mateva sma adite sharma yaccha | vishve deva jaradashtiryatha 'sat || || ayurasi vishvayurasi
    | sarvayurasi sarvamayurasi || yato vato mano javah | yatah ksharanti sindhavah | tasa ntva sarvasagm
    ruca | abhishincami varcasa || samudra ivasi gahmana bhyah | agniriva vishvatah pratyam | surya iva
    jyotisha vibhuh || yo~ dravane rasah | tamahamasma amushyayanaya | tejase brahmavarcasaya grihnami
    | apam ya~ urmau rasah | tamahamasma amushyayanaya | ojase viryaya grihnami | apam yo~ maddhyato rasah
    | tamahamasma amushyayanaya | pushtyai prajananaya grihnami | apam yo~ yajniyo rasah | tamahamasma
    amushyayanaya | ayushe dirghayutvaya grihnami || 'si tatte prayacchami payasa sampiprigdhi ma r yajniyo
    raso dve ca odanasavagata stharohanamantrah abhiprehi virayasva | ugrashcetta sapatnaha || atishtha
    mitravardhanah | tubhya ndeva adhibravann || ankaunyanka vabhito ratham va~tagramanu sacamrantau dure
    hetirindriyava 'gnayah paprayah parayantu || shame as ite mpari vishve abhushann | shriyam va~sanashcarati
    svarocah | mahat tadasyasurasya nama | a vishvarupo amritani tasthau || anu tvendro madatvanu brihaspatih
    || || anu somo anvagniravit | anu tva vishve deva avantu | anu sapta rajano ya utabhishiktah || anu
    tva mitravarunavihavatam | anu dyavaprithivi vishvashabhum | suryo ahobhiranu tva 'vatu | candrama
    nakshatrairanu tva 'vatu || dyaushca tva prithivi ca pracetasa | shukro briha ddakshina tva pipartu
    | anu svadha cikitagm somo agnih | a mprinaktu rajasi upastha odanasavah prajapatih praja asrijata
    | ta asma thsrishtah paracirayann | sa eta 'tishthat | ta anyatrannadyamavittva | prajapati mpraja
    upavartanta | annamevaina mpashyantih praja upavartante | ya etena yajate | ya u cainamevam ve~da
    || sarvanyannani bhavanti || || sarve purushah | sarva nyevannanyavarundhe | sarva npurushan || radasi
    viradasityaha | svara ngamayati || yaddhiranya ndadati | tejastenavarundhe | yattisridhanvam | virya
    m | ayushtena || yaddhiranyamabaddhnati | jyotirvai hiranyam | jyotirevasmin dadhati | atho tejo vai
    hiranyam | teja evatma mprashnati | etadeva sarvamavaruddhya || nkaryah | yadbra hmana eva rohini
    | tasmadeva | atho var shmaivainagm samanana nkaroti || udyata suryena karyah | udyantam prajah pratinandanti
    || didrikshenyo dar shaniyo bhavati | ya evam ve~da || brahmavadino vadanti || ddarbhapunjilaih pavayati
    | ta thsvidevavaiti | tannavaiti || tribhih pavayati | traya ime lokah | ebhirevainam lo~kaih pavayati
    | atho apam ddarbhapunjilaih pavayati | apamevaina ddarbhapunjilaih pavayatyeka pancasharadiyavidhih
    prajapatirakamayata bahorbhuya thsyamiti | sa eta 'harat | tenayajata | tato vai sa bahorbhuya nabhavat
    | yah kamayeta bahorbhuya thsyamiti | sa pancasharadiyena yajeta | bahoreva bhuya thstomo va eshah
    | maruto hi devana || bahurbhavati | ya etena yajate | ya u cainamevam ve~da || pancasharadiyo bhavati
    | panca va ritavah sam va~thsarah | ritushveva sam va~thsare pratitishthati | atho panca kshara panktih
    | pankto yajnah | yajnamevavarundhe || saptadashagg stoma natiyanti | saptadashah prajapatih | prajapateraptyai
    pancasharadiyagatapashuvidhih agastyo marudbhya ukshnah praukshat | tanindra adatta | ta enam va~jramudyatyabhyayanta
    | tanagastyashcaivendrashca kayashubhiyenashamayatam | tancha ndra maruta ukshanah savaniya bhavanti
    | trayah prathame 'hannalabhyante | eva 'hannalabhyante | var shishthamiva hyetadahah || var mbhavati
    | ya etena yajate | ya u cainamevam va~ esha yajnah | etena va ekayava kandama ngacchati | ya etena
    yajate || ve~da || maruto va esha stomah | etena vai maruto devana mbhuyishtha abhavann | bhuyishtha
    mbhavati | ya etena yajate | ya u cainamevam ve~da || pancasharadiyo va esha yajnah | a pancamat purushadannamatti
    | ya etena yajate | ya u cainamevam ve~da || saptadashagg stoma natiyanti | saptadashah prajapatih
    | prajapatereva naiti || gacchati ya etena yajate 'tti ya etena yajate ya u cainamevam mmarutah pancasharadiyo
    va esha yajna ssaptadasham prajapatereva naiti agnishtudyage grahana mpurorucah asyajaraso dama maritrah
    | arcaddhumaso agnayah pavakah | shvicicayah shvatraso bhuranyavah | vanara shado vayavo na somah
    || yaja no mitravaruna | yaja devagm rita mbrihat | agne yakshi sva m || ashvina pibatagm sutam |
    didyagni shuci vrata | rituna yajnavahasa || 'nya vathsamupadhapayete | hariranyasya mbhavati svadhavan
    | shukro anyasya ncarato mayayaitau | shishu kridantau pariyato addhvaram | vishva | ritunanyo vidadhajjayate
    punah || trini shata trishahasra nyagnim | trigmshacca deva nava casaparyann || barhirasmai | adiddhotara
    nnyashadayanta || agnina ssamiddhyate | kavi m | putadakshah kavikratuh | devo devebhiragamat || agnishriyo
    maruto vishvakrishtayah | a tveshamugramava imahe vayam || || te svanino rudriya vara shanirnijah
    | sigmha na heshakratava ssudanavah || yaduttame maruto maddhyame va 'vame subhagaso divishtha | tato
    no rudra uta va 'nvasya | agne vittaddhavisho yadyajamah || ide agnigg nnamobhih | iha prasapto vicayatkrita
    nnah | rathairiva prabhare vajayadbhih | pradakshini nmarutag stomamriddhyam || || shrudhi shrutkarna
    vahnibhih | devairagne sayavabhih | asidantu barahishi | mitro varuno aryama | prataryavano addhvaram
    || vishvesha ryajniyanam | vishvasha rmanushanam | agni rdevanamava avrinanah | sumridiko bhavatu
    vishvavedah || tve agne sumati || divi shravo dadhire yajniyasah | nakta ca cakrurushasa virupe |
    krishna nca sandhuh || tvamagna adityasa asya njihvagm shucayashcakrire kave | tvagm ratishaco addhvareshu
    sashcire | tve deva haviradantyahutam || ni tva yajnasya sadhanam | agne hotara ddeva dhimahi pracetasam
    | jira indrastudyage grahana mpurorucah tishtha hari ratha a yujyamana yahi | vayurna niyuto no accha
    | pibasyandho abhisrishto asme | indra svaha rarima te madaya || kasya vrisha sute saca n vrishabho
    ranat | vritraha somapitaye || indram mmahadhane | indramarbhe havamahe | yujam || dvitayo vritrahantamah
    | vida indrah shatakratuh | upa no haribhi ssutam || sa sura ajanayanjyotirindra m | aya dhiya taraniradribar
    hah | ritena shushminavamano arkaih | vyusridho asro adrirbibheda || uta tyadashvashviyam | yadindra
    nahushishva | agre vikshu pratidayat || || bhareshvindragm suhavagm havamahe | agmhomucagm sukrita
    va~runagm sataye bhaga m | dyavaprithivi marutah svastaye thsakhibhyashca rathagm samairat | indro
    nribhirajana ssakam | suryamushasa ngatumagnim || uru nno lokamanuneshi vidvan | suvarva || rishva
    ta indra sthavirasya bahu | upastheyama sharana brihanta || a no vishvabhirutibhih sajoshah | brahma
    jushano haryashva yahi | varivrija ssushipra | asme dadha dvrishanagm shushmamindra || indraya gava
    ashira m | duduhre vajrine madhu | ya 'vidat || taste vajri ndhenavo jojayurnah || || gabhastayo niyuto
    vishvavarah | aharaharbhuya ijjoguvanah | purna indra kshumato bhojanasya || ima mprabhare maho mahim
    | asya stotre dhishana yatta anaje | tamuthsave ca prasave ca sasahim | indra aptoryamavidhih prajapatih
    pashunasrijata | te nca ayann | tanagnishtomena napno t | tanukthyena napno t | tanratriya napno 'gnimabravit
    | imanma iphseti | tanagnistrivrita stomena napno || sa indramabravit | imanma iphseti | tanindrah
    pancadashena stomena napno nabravit | imanma iphsateti | tan ssaptadashena stomena napnuvann | sa
    vishnumabravit | imanma iphseti | tan vishnurekavigmshena stomenapnot | varavantiyenavarayata || rvicakrama
    iti vyakramata || yasma tpashavah pra preva bhragmsherann | sa etena yajeta || yadapno t | tadaptoryamasyaptoryamatvam
    || etena vai deva jaitvani jitva | ya nkamayate | tametena rajabhishekah vyaghro 'yamagnau carati
    pravishtah | rishina mputro abhishastipa ayam | namaskarena namasa te juhomi | ma devana mmithuya
    karma bhagam || savirahi deva prasavaya pitre | var shmanamasmai varimanamasmai | athasmabhyagm savita
    ssarvatata | dive diva asuva bhuripashvah || bhuto bhuteshu carati pravishtah | sa bhutana || tasya
    mrityau carati rajasuya manumanyatamidam || yebhi paprathanamadrigmhat | yebhidryamabhyapigmshat prajapatih
    | yebhirvacam vi~shvarupagm samavyayat | tenemamagna iha varcasa samangdhi || yebhiradityastapati
    praketubhih | yebhi ssuryo dadrishe citrabhanuh | yebhirvaca mpushkalebhiravyayat | tenemamagna iha
    varcasa samangdhi || mbhatu shavasa panca krishtih | indra iva jyeshtho bhavatu prajavan | asma astu
    pushkala mprinaktu rajasi upastha nkashyapa rocanavat | indriyavat ncitrabhanu | yasmin ssapta sakam
    | tasmin madhivishrayemam || dyaurasi prithivyasi || vyaghro vaiyaghre || vishrayasva disho mahih
    | vishastva sarva vanchantu | ma tva drashtramadhibhrashat || ya divya apah payasa sambabhuvuh | ya
    antariksha uta parthiviryah | ta sa ntva sarvasagm ruca | abhishincami varcasa | abhi tva varcasa
    sica ndivyena | payasa saha | yatha ''sa rashtravardhanah || tva savita karat | indram vi~shva avivridhann
    | samudra vyacasa ngirah | rathitamagm rathinam | vajanagm sa m | vasavastva purastadabhishincantu
    gayatrena chandasa | rudrastva dakshinato 'bhishincantu traishtubhena chandasa | adityastva pashcadabhishincantu
    jagatena chandasa | vishve tva deva uttarato tvanushtubhena chandasa | brihaspati dabhishincatu panktena
    chandasa || mmarutamagre arcishah | suryavanta vi~shasahim | indramukthyeshu namahutamagm huvema ||
    pra bahava sisrita njivase nah | a no gavyutimukshata nghritena | a no jane mme mitravaruna havema
    || indrasya te viryakritah | bahu upavaharami || ttenemamagna iha varcasa samangdhi panktena chandaso
    rajabhishekangam ratharohanam abhi prehi virayasva | ugrashcetta sapatnaha || atishtha vritrahantamah
    | tubhya ndeva adhibravann || ankau nyankavabhito ratham ncarantau | dure heti 'gnayah paprayah parayantu
    || namasta rishe gada | avyathayai || ma na indrabhitastva drishvarishtasah | eva brahmantavedastu
    || tishtha rathe adhi ya dvajrahastah || a rashmindeva yuvase svashvah || above mpari vishve abhushann
    | shriyam va~sanashcarati svarocah | mahat tadasyasurasya nama | a vishvarupo amritani tasthau ||
    | anu tvendro madatvanu brihaspatih | anu somo anvagniravit | anu tva vishve deva avantu | anu sapta
    rajano ya utabhishiktah || anutva mitravarunavihavatam | anu dyavaprithivi vishvashabhum | suryo ahobhiranu
    tva 'vatu | candrama nakshatrairanu tva 'vatu || || dyaushca tva prithivi ca pracetasa | shukro briha
    ddakshina tva pipartu | anu svadha cikitagm somo agnih | anu tva 'vatu savita savena || vi~shva avivridhann
    | samudra vyacasa ngirah | rathitamagm rathinam | vajanagm sa m || pari ma senya ghoshah vri~njantu
    griddhnavah | methishthah pinvamana iha | ma ranumanyatam | tanmata prithivi ta ssomasuto mayobhuvah
    | tadashvina shrinutagm saubhaga yuvam || ava te hedo varuna namobhirava yajnebhirimahe havirbhih
    | kshayannasmabhyamasura praceto rajannenagmsi shishrathah kritani || va~runa pashamasmadava shrathaya
    | atha vayamaditya vrate tava 'nagaso aditaye syama || || ena vyaghra mparishasvajanah | sigmhagm
    hinvanti mahate saubhagaya | samudra dvipinamaphsvantah || udasavetu suryah | udida va~cah | udihi
    deva surya | saha vagnuna mama | aham va~co vivacanam | mayi vagastu dharnasih | yantu nadayo var
    | supippala oshadhayo bhavantu || annavatamodanavatamamikshavatam | eshagm raja bhuyasam || va~panam
    ye keshinah prathama ssatramasata | yebhirabhritam vi~rocate | tebhyo juhomi bahudha ghritena | rayasposhenemam
    va~rcasa sagmsrijatha || narte brahmanastapaso vimokah | dvinamni diksha vashini hyugra | prakesha
    ssuvate kandino bhavanti | tesha mbrahmedishe vapanasya nanyah || aroha proshtham vi~shahasva shatrun
    | ava sragdiksha vashini hyugra || mpratirasvayuh | atha mucyasva varunasya pasha thsavita kshurena
    | somasya rajno varunasya vidvan | tena brahmano vapatedamasyorjemam | rayya varcasa sagmsrijatha
    || ma te keshananu gadvarca etat | tatha dhata karotu te | tubhyamindro brihaspatih | savita varca
    adadhat || mbahudha vyaicchann | antara dyavaprithivi apa ssuvah | darbhastambe viryakrite nidhaya
    | paugg va~rcasa sagmsrijatha || bala ssavita dadhatu | somastva 'naktu payasa ghritena | strishu
    rupamashvinaita nnidhattam | paugg va~rcasa sagmsrijatha || ya nkankataste lilekha | yadva kshurah
    parivavarja vapaggste | strishu rupamashvinaita nnidhattam | paugg syenemagm sagmsrijatho viryena
    || sragdiksha vashini hyugra dvavarja vapaggste dve ca ye keshino narte ma te balam vidyanakhya ekahavisheshah
    indram vai~ sva visho maruto napacayann | so vi~ghanamapashyat | tama 'harat | tenayajata | tenaivasa
    ntagm saggstambham dvighanasya vighanatvam || vi papmana mbhratrivyagm hate | ya etena yajate | ya
    u cainamevam vi~sho napacayeyuh | yo va brahmanastamasa papmana pravrita ssyat | sa etena yajeta |
    vighanenaivaina dvihatya | vishamadhipatya ngacchati || tasya dve dvadashe stotre bhavatah | dve caturvigmshe
    | audbhidyameva tat | etadvai kshatrasyaudbhidyam | yadasmai sva visho baligm haranti || || harantyasmai
    visho balim | ainamapratikhyata ve~da || prabahugva agre kshatranyatepuh | teshamindrah kshatranyadatta
    | na va imani kshatranya bhuvanniti | tannakshatrana nnakshatratvam | a shreyaso bhratrivyasya teja
    indriya ndatte | ya etena yajate | ya u cainamevam dyatha ha vai sacyakrinau kaplakavupa m | evametau
