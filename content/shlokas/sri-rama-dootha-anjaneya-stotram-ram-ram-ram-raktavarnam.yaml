id: sri-rama-dootha-anjaneya-stotram-ram-ram-ram-raktavarnam
category: stotram
name:
  english: Sri Rama Dootha Anjaneya Stotram (Ram Ram Ram Raktavarnam)
content:
  english: ram ram ram raktavarnam dinakaravadanam tikshnadamshtrakaralam ram ram ram ramyatejam giricalanakaram
    kirtipancadi vaktram | ram ram ram rajayogam sakalashubhanidhim saptabhetalabhedyam ram ram ram rakshasantam
    sakaladishayasham ramadutam namami || || kham kham kham khadgahastam vishajvaraharanam vedavedangadipam
    kham kham kham khadgarupam tribhuvananilayam devatasuprakasham | kham kham kham kalpavriksham manimayamakutam
    maya mayasvarupam kham kham kham kalacakram sakaladishayasham ramadutam namami || || im im im indravandyam
    jalanidhikalanam saumyasamrajyalabham im im im siddhiyogam natajanasadayam aryapujyarcitangam | im
    im im simhanadam amritakaratalam adiantyaprakasham im im im citsvarupam sakaladishayasham ramadutam
    namami || || sam sam sam sakshibhutam vikasitavadanam pingalaksham suraksham sam sam sam satyagitam
    sakalamuninutam shastrasampatkariyam | sam sam sam samavedam nipuna sulalitam nityatattvasvarupam
    sam sam sam savadhanam sakaladishayasham ramadutam namami || || ham ham ham hamsarupam sphutavikatamukham
    sukshmasukshmavataram ham ham ham antaratmam ravishashinayanam ramyagambhirabhimam | ham ham ham attahasam
    suravaranilayam urdhvaromam karalam ham ham ham hamsahamsam sakaladishayasham ramadutam namami ||
    || iti shri ramaduta stotram ||
  devanagari: रं रं रं रक्तवर्णं दिनकरवदनं तीक्ष्णदंष्ट्राकरालं रं रं रं रम्यतेजं गिरिचलनकरं कीर्तिपञ्चादि
    वक्त्रम् । रं रं रं राजयोगं सकलशुभनिधिं सप्तभेतालभेद्यं रं रं रं राक्षसान्तं सकलदिशयशं रामदूतं नमामि
    ॥ ॥ खं खं खं खड्गहस्तं विषज्वरहरणं वेदवेदाङ्गदीपं खं खं खं खड्गरूपं त्रिभुवननिलयं देवतासुप्रकाशम्
    । खं खं खं कल्पवृक्षं मणिमयमकुटं माय मायास्वरूपं खं खं खं कालचक्रं सकलदिशयशं रामदूतं नमामि ॥ ॥ इं
    इं इं इन्द्रवन्द्यं जलनिधिकलनं सौम्यसाम्राज्यलाभं इं इं इं सिद्धियोगं नतजनसदयं आर्यपूज्यार्चिताङ्गम्
    । इं इं इं सिंहनादं अमृतकरतलं आदिअन्त्यप्रकाशं इं इं इं चित्स्वरूपं सकलदिशयशं रामदूतं नमामि ॥ ॥ सं
    सं सं साक्षिभूतं विकसितवदनं पिङ्गलाक्षं सुरक्षं सं सं सं सत्यगीतं सकलमुनिनुतं शास्त्रसम्पत्करीयम्
    । सं सं सं सामवेदं निपुण सुललितं नित्यतत्त्वस्वरूपं सं सं सं सावधानं सकलदिशयशं रामदूतं नमामि ॥ ॥ हं
    हं हं हंसरूपं स्फुटविकटमुखं सूक्ष्मसूक्ष्मावतारं हं हं हं अन्तरात्मं रविशशिनयनं रम्यगम्भीरभीमम् ।
    हं हं हं अट्टहासं सुरवरनिलयं ऊर्ध्वरोमं करालं हं हं हं हंसहंसं सकलदिशयशं रामदूतं नमामि ॥ ॥ इति श्री
    रामदूत स्तोत्रम् ॥
