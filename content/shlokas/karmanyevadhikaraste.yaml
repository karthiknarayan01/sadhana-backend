id: karmanyevadhikaraste
category: gita_shloka
name:
  english: Karmanyevadhikaraste
  devanagari: कर्मण्येवाधिकारस्ते
content:
  english: >-
    karmany evadhikaras te ma phaleshu kadachana, ma karma-phala-hetur
    bhur ma te sango 'stv akarmani
  devanagari: >-
    कर्मण्येवाधिकारस्ते मा फलेषु कदाचन । मा कर्मफलहेतुर्भूर्मा ते
    सङ्गोऽस्त्वकर्मणि ॥
meaning:
  english: >-
    You have a right to your actions alone, never to their fruits.
    Let not the fruits of action be your motive, nor attach yourself
    to inaction.
source_attribution:
  text_source: Bhagavad Gita, Chapter 2, Verse 47
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
