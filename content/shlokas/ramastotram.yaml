id: ramastotram
category: stotram
name:
  english: ramastotram
  devanagari: रमास्तोत्रम्
content:
  english: ramastotram jaya kolhapuranilaye bhajadishtetaravilaye | tava padau hridi kalaye ratnaracitavalaye
    || 1|| jaya jaya sagarajate kuru karunam mayi bhite | jagadambabhidhaya te jivati tava pote || 2||
    jaya jaya sagarasadana jaya kantya jitamadana | jaya dushtantakakadana kundamukularadana || 3|| suraramaninutacarane
    sumanahsankataharane | susvararanjitavine sundaranijakirane || 4|| bhajadindivarasoma bhavamukhyamarakama
    | bhayamulaḻivirama bhanjitamunibhima || 5|| kunkumaranjitaphale kunjarabandhavalole | kaladhautamalacaile
    krintakujanajale || 6|| dhritakarunarasapure dhanadanotsavadhire | dhvanilavaninditakire dhiradanujadare
    || 7|| surahritpanjarakira sumaroharpitahara | sundarakunjavihara suravaraparivara || 8|| varakabaridhritakusume
    varakanakadhikasushame | vananilayadayabhime vadanavijitasome || 9|| madakalabhalasagamane madhumathanalasanayane
    | mridulolalakaracane madhurasarasagane || 10|| vyaghrapurivaranilaye vyasapadarpitahridaye | kuru
    karunam mayi sadaye vividhanigamageye || 11|| iti shrihulagishriyahpatyacaryaviracitam shriramastotram
    sampurnam |
  devanagari: रमास्तोत्रम् जय कोल्हापुरनिलये भजदिष्टेतरविलये । तव पादौ हृदि कलये रत्नरचितवलये ॥ १॥ जय
    जय सागरजाते कुरु करुणां मयि भीते । जगदम्बाभिधया ते जीवति तव पोते ॥ २॥ जय जय सागरसदना जय कान्त्या जितमदना
    । जय दुष्टान्तककदना कुन्दमुकुलरदना ॥ ३॥ सुररमणीनुतचरणे सुमनःसङ्कटहरणे । सुस्वररञ्जितवीणे सुन्दरनिजकिरणे
    ॥ ४॥ भजदिन्दीवरसोमा भवमुख्यामरकामा । भयमूलाळिविरामा भञ्जितमुनिभीमा ॥ ५॥ कुङ्कुमरञ्जितफाले कुञ्जरबान्धवलोले
    । कलधौतामलचैले कृन्तकुजनजाले ॥ ६॥ धृतकरुणारसपूरे धनदानोत्सवधीरे । ध्वनिलवनिन्दितकीरे धीरदनुजदारे ॥
    ७॥ सुरहृत्पञ्जरकीरा सुमरोहार्पितहारा । सुन्दरकुञ्जविहारा सुरवरपरिवारा ॥ ८॥ वरकबरीधृतकुसुमे वरकनकाधिकसुषमे
    । वननिलयादयभीमे वदनविजितसोमे ॥ ९॥ मदकलभालसगमने मधुमथनालसनयने । मृदुलोलालकरचने मधुरसरसगाने ॥ १०॥ व्याघ्रपुरीवरनिलये
    व्यासपदार्पितहृदये । कुरु करुणां मयि सदये विविधनिगमगेये ॥ ११॥ इति श्रीहुलगीश्रियःपत्याचार्यविरचितं
    श्रीरमास्तोत्रं सम्पूर्णम् ।
