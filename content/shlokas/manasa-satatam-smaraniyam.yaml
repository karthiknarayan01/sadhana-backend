id: manasa-satatam-smaraniyam
category: stotram
name:
  english: Manasa Satatam Smaraniyam
content:
  english: manasa satatam smaraniyam vacasa satatam vadaniyam lokahitam mama karaniyam || lokahitam ||
    na bhogabhavane ramaniyam na ca sukhashayane shayaniyanam aharnisham jagaraniyam lokahitam mama karaniyam
    || manasa || na jatu duhkham gananiyam na ca nijasaukhyam mananiyam karyakshetre tvaraniyam lokahitam
    mama karaniyam || manasa || duhkhasagare taraniyam kashtaparvate caraniyam vipattivipine bhramaniyam
    lokahitam mama karaniyam || manasa || gahanaranye ghanandhakare bandhujana ye sthita gahvare tatra
    maya sancaraniyam lokahitam mama karaniyam || manasa || racana shridhara bhaskara varnèkara
  devanagari: मनसा सततं स्मरणीयम् वचसा सततं वदनीयम् लोकहितं मम करणीयम् ॥ लोकहितम् ॥ न भोगभवने रमणीयम्
    न च सुखशयने शयनीयनम् अहर्निशं जागरणीयम् लोकहितं मम करणीयम् ॥ मनसा ॥ न जातु दुःखं गणनीयम् न च निजसौख्यं
    मननीयम् कार्यक्षेत्रे त्वरणीयम् लोकहितं मम करणीयम् ॥ मनसा ॥ दुःखसागरे तरणीयम् कष्टपर्वते चरणीयम् विपत्तिविपिने
    भ्रमणीयम् लोकहितं मम करणीयम् ॥ मनसा ॥ गहनारण्ये घनान्धकारे बन्धुजना ये स्थिता गह्वरे तत्रा मया सञ्चरणीयम्
    लोकहितं मम करणीयम् ॥ मनसा ॥ रचन श्रीधर भास्कर वर्णॆकर
