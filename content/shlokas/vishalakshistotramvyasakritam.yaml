id: vishalakshistotramvyasakritam
category: stotram
name:
  english: vishalakshistotramvyasakritam
  devanagari: विशालाक्षीस्तोत्रम्व्यासकृतं
content:
  english: vishalakshi namastubhyam parabrahmatmike shive | tvameva mata sarvesham brahmadinam divaukasam
    || 15|| icchashaktih kriyashaktirjnanashaktistvameva hi | rijvi kundalini sukshma yogasiddhipradayini
    || 16|| svaha svadha mahavidya medha lakshmih sarasvati | sati dakshayani vidya sarvashaktimayi shiva
    || 17|| aparna caikaparna ca tatha caikaikapatala | uma haimavati capi kalyani caiva matrika || 18||
    khyatih prajna mahabhaga loke gauriti vishruta | ganambiko mahadevi nandini jatavedasi || 19|| savitri
    varada punya pavani lokavishruta | ayati niyati raudri durga bhadra pramathini || 20|| kalaratri mahamaya
    revati bhutanayika | gautami kaushiki ca''rtha candi katyayani sati || 21|| vrishadhvaja shuladhara
    parama brahmacarini | mahendropendramata ca parvati simhavahana || 22|| evam stutva vishalakshi divyairetaih
    sunamabhih | kritakrityo'bhavadvyaso varanasyam dvijottamah || 23|| varanasyam vishalakshi ganga vishveshvarah
    shivah | bhaktih pashupatau tatra durlabham hi catushtayam || 24|| yah pashyati vishalakshim snatva
    gangambhasi dvijah | ashvamedhasahasrasya phalamapnotyanuttamam || 25|| varanasyaratu mahatmyamiti
    kincinmayoditam | yah pathecchrinuyadva'pi yati maheshvaram padam || 26|| iti saurapurane ashtamadhyayantargatam
    vyasakritam vishalakshistotram sampurnam |
  devanagari: विशालाक्षि नमस्तुभ्यं परब्रह्मात्मिके शिवे । त्वमेव माता सर्वेषां ब्रह्मादीनां दिवौकसाम्
    ॥ १५॥ इच्छाशक्तिः क्रियाशक्तिर्ज्ञानशक्तिस्त्वमेव हि । ऋज्वी कुण्डलिनी सुक्ष्मा योगसिद्धिप्रदायिनी
    ॥ १६॥ स्वाहा स्वधा महाविद्या मेधा लक्ष्मीः सरस्वती । सती दाक्षायणी विद्या सर्वशक्तिमयी शिवा ॥ १७॥
    अपर्णा चैकपर्णा च तथा चैकैकपाटला । उमा हैमवती चापि कल्याणी चैव मातृका ॥ १८॥ ख्यातिः प्रज्ञा महाभागा
    लोके गौरीति विश्रुता । गणाम्बिको महादेवी नन्दिनी जातवेदसी ॥ १९॥ सावित्री वरदा पुण्या पावनी लोकविश्रुता
    । आयती नियती रौद्री दुर्गा भद्रा प्रमाथिनी ॥ २०॥ कालरात्री महामाया रेवती भूतनायिका । गौतमी कौशिकी
    चाऽऽर्था चण्डी कात्यायनी सती ॥ २१॥ वृषध्वजा शूलधरा परमा ब्रह्मचारिणी । महेन्द्रोपेन्द्रमाता च पार्वती
    सिंहवाहना ॥ २२॥ एवं स्तुत्वा विशालाक्षी दिव्यैरेतैः सुनामभिः । कृतकृत्योऽभवद्व्यासो वाराणस्यां द्विजोत्तमाः
    ॥ २३॥ वाराणस्यां विशालाक्षी गङ्गा विश्वेश्वरः शिवः । भक्तिः पशुपतौ तत्र दुर्लभं हि चतुष्टयम् ॥ २४॥
    यः पश्यति विशालाक्षीं स्नात्वा गङ्गाम्भसि द्विजाः । अश्वमेधसहस्रस्य फलमाप्नोत्यनुत्तमम् ॥ २५॥ वाराणस्यारतु
    माहात्म्यमिति किञ्चिन्मयोदितम् । यः पठेच्छृणुयाद्वाऽपि याति माहेश्वरं पदम् ॥ २६॥ इति सौरपुराणे अष्टमाध्यायान्तर्गतं
    व्यासकृतं विशालाक्षीस्तोत्रं सम्पूर्णम् ।
