id: yudhishthirakritam2shrikrishnastotram
category: stotram
name:
  english: yudhishthirakritam2shrikrishnastotram
  devanagari: युधिष्ठिरकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: yudhishthirakritam 2 shrikrishnastotram tava krishna prasadena nayena ca balena ca | buddhya
    ca yadushardula tatha vikramanena ca || 2|| punah praptamidam rajyam pitripaitamaham maya | namaste
    pundarikaksha punah punararindama || 3|| tvamekamahuh purusham tvamahuh satvatam patim | namabhistvam
    bahuvidhaih stuvanti paramarshayah || 4|| vishvakarmannamaste'stu vishvatmanvishvasambhava | vishno
    jishno hare krishna vaikuntha purushottama || 5|| adityah saptaratram tu purane garbhatam gatah |
    prishnigarbhastvamevaikastriyugam tvam vadantyapi || 6|| shucishrava hrishikesho ghritarcirhamsa ucyase
    | tricakshuh shambhurekastvam vibhurdamodaro'pi ca || 7|| varaho'gnirbrihadbhanurvrishanastarkshyalakshanah
    | anikasahah purushah shipivishta urukramah || 8|| vacishtha ugrah senanih satyo vajasanirguhah |
    acyutashcyavano'rinam sankritirvikritirvrishah || 9|| kritavartma tvamevadrirvrishagarbho vrishakapih
    | sindhukshidurmistrikakuttridhama trivridacyutah || 10|| samradviratsvaratcaiva suraraddharmado bhavah
    | vibhurbhurabhibhuh krishnah krishnavartma tvameva ca || 11|| svishtakridbhishagavartah kapilastvam
    ca vamanah | yajno dhruvah patangashca jayatsenastvamucyase || 12|| shikhandi nahusho babhrurdivaspriktvam
    punarvasuh | subabhruruksho rukmastvam susheno dundubhistatha || 13|| gabhastinemih shripadmam pushkaram
    pushpadharanah | ribhurvibhuh sarvasukshmastvam savitram ca pathyase || 14|| ambhonidhistvam brahma
    tvam pavitram dhama dhanva ca | hiranyagarbham tvamahuh svadha svaha ca keshava || 15|| yonistvamasya
    pralayashca krishna tvamevedam srijasi vishvamagre | vishvam cedam tvadvashe vishvayone namo'stu te
    sharngacakrasipane || 16|| iti mahabharate shantiparvani 43 adhyayantargatam yudhishthirakritam shrikrishnastotram
    sampurnam | mahabharata | shantiparva | adhyaya 43
  devanagari: युधिष्ठिरकृतं २ श्रीकृष्णस्तोत्रम् तव कृष्ण प्रसादेन नयेन च बलेन च । बुद्ध्या च यदुशार्दूल
    तथा विक्रमणेन च ॥ २॥ पुनः प्राप्तमिदं राज्यं पितृपैतामहं मया । नमस्ते पुण्डरीकाक्ष पुनः पुनररिन्दम
    ॥ ३॥ त्वामेकमाहुः पुरुषं त्वामाहुः सात्वतां पतिम् । नामभिस्त्वां बहुविधैः स्तुवन्ति परमर्षयः ॥ ४॥
    विश्वकर्मन्नमस्तेऽस्तु विश्वात्मन्विश्वसम्भव । विष्णो जिष्णो हरे कृष्ण वैकुण्ठ पुरुषोत्तम ॥ ५॥ अदित्याः
    सप्तरात्रं तु पुराणे गर्भतां गतः । पृश्निगर्भस्त्वमेवैकस्त्रियुगं त्वां वदन्त्यपि ॥ ६॥ शुचिश्रवा हृषीकेशो
    घृतार्चिर्हंस उच्यसे । त्रिचक्षुः शम्भुरेकस्त्वं विभुर्दामोदरोऽपि च ॥ ७॥ वराहोऽग्निर्बृहद्भानुर्वृषणस्तार्क्ष्यलक्षणः
    । अनीकसाहः पुरुषः शिपिविष्ट उरुक्रमः ॥ ८॥ वाचिष्ठ उग्रः सेनानीः सत्यो वाजसनिर्गुहः । अच्युतश्च्यावनोऽरीणां
    सङ्कृतिर्विकृतिर्वृषः ॥ ९॥ कृतवर्त्मा त्वमेवाद्रिर्वृषगर्भो वृषाकपिः । सिन्धुक्षिदूर्मिस्त्रिककुत्त्रिधामा
    त्रिवृदच्युतः ॥ १०॥ संराड्विराट्स्वराट्चैव सुरराड्धर्मदो भवः । विभुर्भूरभिभूः कृष्णः कृष्णवर्त्मा
    त्वमेव च ॥ ११॥ स्विष्टकृद्भिषगावर्तः कपिलस्त्वं च वामनः । यज्ञो ध्रुवः पतङ्गश्च जयत्सेनस्त्वमुच्यसे
    ॥ १२॥ शिखण्डी नहुषो बभ्रुर्दिवस्पृक्त्वं पुनर्वसुः । सुबभ्रुरुक्षो रुक्मस्त्वं सुषेणो दुन्दुभिस्तथा
    ॥ १३॥ गभस्तिनेमिः श्रीपद्मं पुष्करं पुष्पधारणः । ऋभुर्विभुः सर्वसूक्ष्मस्त्वं सावित्रं च पठ्यसे ॥
    १४॥ अम्भोनिधिस्त्वं ब्रह्मा त्वं पवित्रं धाम धन्व च । हिरण्यगर्भं त्वामाहुः स्वधा स्वाहा च केशव ॥
    १५॥ योनिस्त्वमस्य प्रलयश्च कृष्ण त्वमेवेदं सृजसि विश्वमग्रे । विश्वं चेदं त्वद्वशे विश्वयोने नमोऽस्तु
    ते शार्ङ्गचक्रासिपाणे ॥ १६॥ इति महाभारते शान्तिपर्वणि ४३ अध्यायान्तर्गतं युधिष्ठिरकृतं श्रीकृष्णस्तोत्रं
    सम्पूर्णम् । महाभारत । शान्तिपर्व । अध्याय ४३
