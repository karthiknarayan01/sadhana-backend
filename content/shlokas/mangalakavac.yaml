id: mangalakavac
category: kavacha
name:
  english: mangalakavac
  devanagari: मन्गलकवच्
content:
  english: bhaumaprityartham jape viniyogah | raktambaro raktavapuh kiriti caturbhujo meshagamo gadabhrit
    | dharasutah shaktidharashca shuli sada mama syadvaradah prashantah || 1|| angarakah shiro rakshenmukham
    vai dharanisutah | shravau raktambarah patu netre me raktalocanah || 2|| nasam shaktidharah patu mukham
    me raktalocanah | bhujau me raktamali ca hastau shaktidharastatha || 3|| vakshah patu varangashca
    hridayam patu rohitah | katim me graharajashca mukham caiva dharasutah || 4|| janujanghe kujah patu
    padau bhaktapriyah sada | sarvanyanyani cangani rakshenme meshavahanah || 5|| ya idam kavacam divyam
    sarvashatrunivaranam | bhutapretapishacanam nashanam sarvasiddhidam || 6|| sarvarogaharam caiva sarvasampatpradam
    shubham | bhuktimuktipradam nrinam sarvasaubhagyavardhanam | rogabandhavimoksham ca satyametanna samshayah
    || 7|| || iti shrimarkandeyapurane mangalakavacam sampurnam ||
  devanagari: भौमप्रीत्यर्थं जपे विनियोगः । रक्ताम्बरो रक्तवपुः किरीटी चतुर्भुजो मेषगमो गदाभृत् । धरासुतः
    शक्तिधरश्च शूली सदा मम स्याद्वरदः प्रशान्तः ॥ १॥ अङ्गारकः शिरो रक्षेन्मुखं वै धरणीसुतः । श्रवौ रक्ताम्बरः
    पातु नेत्रे मे रक्तलोचनः ॥ २॥ नासां शक्तिधरः पातु मुखं मे रक्तलोचनः । भुजौ मे रक्तमाली च हस्तौ शक्तिधरस्तथा
    ॥ ३॥ वक्षः पातु वराङ्गश्च हृदयं पातु रोहितः । कटिं मे ग्रहराजश्च मुखं चैव धरासुतः ॥ ४॥ जानुजङ्घे कुजः
    पातु पादौ भक्तप्रियः सदा । सर्वाण्यन्यानि चाङ्गानि रक्षेन्मे मेषवाहनः ॥ ५॥ य इदं कवचं दिव्यं सर्वशत्रुनिवारणम्
    । भूतप्रेतपिशाचानां नाशनं सर्वसिद्धिदम् ॥ ६॥ सर्वरोगहरं चैव सर्वसम्पत्प्रदं शुभम् । भुक्तिमुक्तिप्रदं
    नॄणां सर्वसौभाग्यवर्धनम् । रोगबन्धविमोक्षं च सत्यमेतन्न संशयः ॥ ७॥ ॥ इति श्रीमार्कण्डेयपुराणे मङ्गलकवचं
    सम्पूर्णम् ॥
