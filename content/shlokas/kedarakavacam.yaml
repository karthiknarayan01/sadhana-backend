id: kedarakavacam
category: kavacha
name:
  english: kedarakavacam
  devanagari: केदारकवचम्
content:
  english: brahmane rishaye namah | shirasi | anushtup chandase namah | mukhe | shriravalanathaya namah
    | hridaye | ram bijaya namah | guhye | vam shaktaye namah | padayoh | lam kilakaya namah | sarvange
    | shriravalanathaprityarthe jape viniyogah || atha dhyanam | keyuradivibhushitaih karatalairatnankitaih
    sundaram nanaharavicitrapannagayutairhemambarairmanditam | hastabhyam dhritakhadgapatradamarushulam
    sada bibhratam vajivahanadaityadarpadalanam kedaramisham bhaje || atha kavacam | om kedarah purvatah
    patu cagneyyam ravaleshvarah | dakshine varijakshastu nairrityam rakshasudanah || 1|| pashcime pannageshashca
    vayavyam daityanashakah | uttare uttareshashca ishanyam isha eva ca || 2|| urdhvam gangadharah patu
    dharayanca trivikramah | evam dashadishonyasya pashcadangeshu vinyaset || 3|| shikhayam renukanatho
    mastake bhalalocanah | bhalam me raksha bhagavan bhrumadhye medinipatih || 4|| netrayorjyotinathashca
    karnayoh kirtivardhanah | kundalinah kapolauca nasikam vighnanashanah || 5|| oshthadvayo umanatho
    dantayordharanidharah | jihvayam vedajihvashca hanushcahanumatpriyah || 6|| grivayam nilakanthashca
    skandhauskanda priyankarah | bahoh shastrabhritam shreshtho hastedamarudharakah || 7|| hridayam vishvanathashca
    udaram me janapriyah | nabhim patu guhavaso katimadhye kapalabhrit || 8|| guhyeguhya nivasashca urubhyam
    ukshavahanah | janvorjahnu sutadhari janghayorjanganodbalin || 9|| gulphayoh gudhakartatma padayoh
    padavanditah | nakheshu romakupeshu vyapakah sarvasandhishu || 10|| agratah patu me khadgi prishthatah
    patu shulavan | patumam patradharica vatapittakaphadishu || 11|| jale jaladharah patu sthale sthanuh
    sanatanah | maharnave mahadurge agni corabhayeshu ca || 12|| shastrakshateshu yo rakshed ratnasuranibarhanah
    | supti pramada vipadai rakshamam girivasakah || 13||
  devanagari: ब्रह्मणे ऋषये नमः । शिरसि । अनुष्टुप् छन्दसे नमः । मुखे । श्रीरवलनाथाय नमः । हृदये । रं
    बीजाय नमः । गुह्ये । वं शक्तये नमः । पादयोः । लं कीलकाय नमः । सर्वाङ्गे । श्रीरवलनाथप्रीत्यर्थे जपे
    विनियोगः ॥ अथ ध्यानम् । केयूरादिविभूषितैः करतलैरत्नाङ्कितैः सुन्दरं नानाहारविचित्रपन्नगयुतैर्हेमाम्बरैर्मण्डितम्
    । हस्ताभ्यां धृतखड्गपात्रडमरूशूलं सदा बिभ्रतं वाजीवाहनदैत्यदर्पदलनं केदारमीशं भजे ॥ अथ कवचम् । ॐ केदारः
    पूर्वतः पातु चाग्नेय्यां रवलेश्वरः । दक्षिणे वारिजाक्षस्तु नैरृत्यां रक्षसूदनः ॥ १॥ पश्चिमे पन्नगेशश्च
    वायव्यां दैत्यनाशकः । उत्तरे उत्तरेशश्च ईशान्यां ईश एव च ॥ २॥ ऊर्ध्वं गङ्गाधरः पातु धरायाञ्च त्रिविक्रमः
    । एवं दशदिशोन्यस्य पश्चादङ्गेषु विन्यसेत् ॥ ३॥ शिखायां रेणुकानाथो मस्तके भाललोचनः । भालं मे रक्ष भगवन्
    भ्रूमध्ये मेदिनीपतिः ॥ ४॥ नेत्रयोर्ज्योतिनाथश्च कर्णयोः कीर्तिवर्धनः । कुण्डलीनाः कपोलौच नासिकां विघ्ननाशनः
    ॥ ५॥ ओष्ठद्वयो उमानाथो दन्तयोर्धरणीधरः । जिह्वायां वेदजिह्वश्च हनुश्चहनुमत्प्रियः ॥ ६॥ ग्रीवायां नीलकण्ठश्च
    स्कन्धौस्कन्द प्रियङ्करः । बाहोः शस्त्रभृतां श्रेष्ठो हस्तेडमरूधारकः ॥ ७॥ हृदयं विश्वनाथश्च उदरं मे
    जनप्रियः । नाभिं पातु गुहावासो कटिमध्ये कपालभृत् ॥ ८॥ गुह्येगुह्य निवासश्च उरूभ्यां उक्षवाहनः । जान्वोर्जह्नु
    सुताधारी जङ्घयोर्जङ्गनोद्बलीन् ॥ ९॥ गुल्फयोः गूढकर्तात्मा पादयोः पदवन्दितः । नखेषु रोमकूपेषु व्यापकः
    सर्वसन्धिषु ॥ १०॥ अग्रतः पातु मे खड्गी पृष्ठतः पातु शूलवान् । पातुमां पात्रधारीच वातपित्तकफादिषु ॥
    ११॥ जले जलधरः पातु स्थले स्थाणुः सनातनः । महार्णवे महादुर्गे अग्नि चोरभयेषु च ॥ १२॥ शस्त्रक्षतेषु
    यो रक्षेद् रत्नासुरनिबर्हणः । सुप्ति प्रमाद विपदै रक्षमां गिरिवासकः ॥ १३॥
