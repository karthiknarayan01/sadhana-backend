id: ramanacatvarimshat-m
category: stotram
name:
  english: ramanacatvarimshatġm
  devanagari: रमणचत्वारिंशत्ग़्ं
content:
  english: stasmai shriramanaya lokagurave shokasya hantre namah || 22|| prasarataditah shubhavilokitam
    | ramana te sakritphalatu me kritam || 23|| ramana janminamayi bhavan guruh | abhida ashayastava mahanuruh
    || 24|| jagadaham parah sphurati me trayam | sadabhidam gira tava visamshayam || 25|| tvadupadeshato
    galati samvida | mayi niranyaya sadahamorbhida || 26|| ahami yo'ntarastamamalam hridi | anubhavema
    bhostava kripa yadi || 27|| na karuna gunastava vidam pate | hridayatejasah sahajabhaivate || 28||
    tava tanurjvalatyanagha vidyuta | tava drigatata lasati bhasvata || 29|| kabalitam manastava vibho
    hrida | tvamasi santatam vilasito muda || 30|| bhuvanabhupaterbhagavatah krite | bhavasi pacako yamavatam
    pate || 31|| narapashunimanahami tadayan | parashivaudanam vitanushe pacan || 32|| timirani na kevalam
    vacobhih karunapangavilokitaishca nrinam | hridaye prasaranti mardayantam bhagavantam ramanam gurum
    namami || 33|| bhavajalanidhim gaham gaham ciradalasalasan padajalaruhadvandvadvipam shritamstava
    samprati | ramanabhagavan kalyananam niketana pahi nah sadaya dayaya siktairbhaktanapangavilokitaih
    || 34|| yadi na janani stanyam dadyacchishorbata ka gatih yadi pashupatih krodham kuryatpashoravanam
    kutah | yadi padajushamacarya tvam nihamsi na samshayam bhramashataparabhuta ete tarantu bhavam katham
    || 35|| vishadahasite purna shantih sudhakarasodare sthiraprithulayoh purna shaktirdrishoratularcishoh
    | hridayakamale nitya nishtha bahishca saratprabhe ramanabhagavan ko va mauni samastava bhutale ||
    36|| devi shaktiriyam drishoh shritajanadhvantakshayadhayini devi shririyamambujakshamahishi vaktro
    sahasracchade | devi brahmavadhuriyam vijayate vyaharagudha para vishvacarya mahanubhava ramana tvam
    stautu kah prakritah || 37|| so'ham jato ramanabhagavan padayoste davishtho yadyapyasminmahati samaye
    shaktilasye pravritte | suryasyeva jvalitamahaso duragam natha shaktim vishvasyagyram tava mama mano
    vitaduhkham tathapi || 38|| tadbhagadheyamasamanamanekamauni
  devanagari: स्तस्मै श्रीरमणाय लोकगुरवे शोकस्य हन्त्रे नमः ॥ २२॥ प्रसरतादितः शुभविलोकितम् । रमण ते सकृत्फलतु
    मे कृतम् ॥ २३॥ रमण जन्मिनामयि भवान् गुरुः । अभिद आशयस्तव महानुरुः ॥ २४॥ जगदहं परः स्फुरति मे त्रयम्
    । सदभिदं गिरा तव विसंशयम् ॥ २५॥ त्वदुपदेशतो गलति संविदा । मयि निरन्यया सदहमोर्भिदा ॥ २६॥ अहमि योऽन्तरस्तममलं
    हृदि । अनुभवेम भोस्तव कृपा यदि ॥ २७॥ न करुणा गुणस्तव विदां पते । हृदयतेजसः सहजभैवते ॥ २८॥ तव तनुर्ज्वलत्यनघ
    विद्युता । तव दृगातता लसति भास्वता ॥ २९॥ कबलितं मनस्तव विभो हृदा । त्वमसि सन्ततं विलसितो मुदा ॥ ३०॥
    भुवनभूपतेर्भगवतः कृते । भवसि पाचको यमवतां पते ॥ ३१॥ नरपशूनिमानहमि ताडयन् । परशिवौदनं वितनुषे पचन्
    ॥ ३२॥ तिमिराणि न केवलं वचोभिः करुणापाङ्गविलोकितैश्च नॄणाम् । हृदये प्रसरन्ति मर्दयन्तं भगवन्तं रमणं
    गुरुं नमामि ॥ ३३॥ भवजलनिधिं गाहं गाहं चिरादलसालसान् पदजलरुहद्वन्द्वद्वीपं श्रितांस्तव सम्प्रति । रमणभगवन्
    कल्याणानां निकेतन पाहि नः सदय दयया सिक्तैर्भक्तानपाङ्गविलोकितैः ॥ ३४॥ यदि न जननी स्तन्यं दद्याच्छिशोर्बत
    का गतिः यदि पशुपतिः क्रोधं कुर्यात्पशोरवनं कुतः । यदि पदजुषामाचार्य त्वं निहंसि न संशयं भ्रमशतपराभूता
    एते तरन्तु भवं कथम् ॥ ३५॥ विशदहसिते पूर्णा शान्तिः सुधाकरसोदरे स्थिरपृथुलयोः पूर्णा शक्तिर्दृशोरतुलार्चिषोः
    । हृदयकमले नित्या निष्ठा बहिश्च सरत्प्रभे रमणभगवन् को वा मौनी समस्तव भूतले ॥ ३६॥ देवी शक्तिरियं दृशोः
    श्रितजनध्वान्तक्षयाधायिनी देवी श्रीरियमम्बुजाक्षमहिषी वक्त्रो सहस्रच्छदे । देवी ब्रह्मवधूरियं विजयते
    व्याहारगूढा परा विश्वाचार्य महानुभाव रमण त्वां स्तौतु कः प्राकृतः ॥ ३७॥ सोऽहं जातो रमणभगवन् पादयोस्ते
    दविष्ठो यद्यप्यस्मिन्महति समये शक्तिलास्ये प्रवृत्ते । सूर्यस्येव ज्वलितमहसो दूरगां नाथ शक्तिं विश्वस्याग्य्रां
    तव मम मनो वीतदुःखं तथापि ॥ ३८॥ तद्भागधेयमसमानमनेकमौनि
