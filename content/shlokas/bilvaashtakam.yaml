id: bilvaashtakam
category: stotram
name:
  english: Bilvaashtakam
content:
  english: tridalam trigunakaram trinetram ca triyayudham | trijanma papasamharam ekabilvam shivarpanam
    || trishakhaih bilvapatraishca acchidraih komalaih shubhaih | tavapujam karishyami ekabilvam shivarpanam
    || koti kanya mahadanam tilaparvata kotayah | kancanam shailadanena ekabilvam shivarpanam || kashikshetra
    nivasam ca kalabhairava darshanam | prayage madhavam drishtva ekabilvam shivarpanam || induvare vratam
    sthitva niraharo maheshvarah | naktam haushyami devesha ekabilvam shivarpanam || ramalinga pratishtha
    ca vaivahika kritam tatha | tatakanica sandhanam ekabilvam shivarpanam || akhanda bilvapatram ca ayutam
    shivapujanam | kritam nama sahasrena ekabilvam shivarpanam || umaya sahadevesha nandi vahanameva ca
    | bhasmalepana sarvangam ekabilvam shivarpanam || salagrameshu vipranam tatakam dashakupayoh | yajnakoti
    sahasrasya ekabilvam shivarpanam || danti koti sahasreshu ashvamedhashatakratau | kotikanya mahadanam
    ekabilvam shivarpanam || bilvanam darshanam punyam sparshanam papanashanam | aghora papasamharam ekabilvam
    shivarpanam || sahasraveda pateshu brahmastapanamucyate | anekavrata kotinam ekabilvam shivarpanam
    || annadana sahasreshu sahasropanayanam tadha | aneka janmapapani ekabilvam shivarpanam || bilvashtakamidam
    punyam yah patheshshiva sannidhau | shivalokamavapnoti ekabilvam shivarpanam || vikalpa sankarpana
    tridalam trigunakaram trinetram ca triyayudham | trijanma papasamharam ekabilvam shivarpitam || ||
    trishakhaih bilvapatraishca acchidraih komalaih shubhaih | tavapujam karishyami ekabilvam shivarpitam
    || || darshanam bilvavrikshasya sparshanam papanashanam | aghorapapasamharam ekabilvam shivarpitam
    || || salagrameshu vipreshu tatake vanakupayoh | yajnakoti sahasranam ekabilvam shivarpitam || ||
    dantikoti sahasreshu ashvamedha shatani ca | kotikanyapradanena ekabilvam shivarpitam || || ekam ca
    bilvapatraishca kotiyajna phalam labhet | mahadevaishca pujartham ekabilvam shivarpitam || || kashikshetre
    nivasam ca kalabhairava darshanam | gayaprayaga me drishtva ekabilvam shivarpitam || || umaya saha
    devesham vahanam nandishankaram | mucyate sarvapapebhyo ekabilvam shivarpitam || || iti shri bilvashtakam
    ||
  devanagari: त्रिदलं त्रिगुणाकारं त्रिनेत्रं च त्रियायुधम् । त्रिजन्म पापसंहारं एकबिल्वं शिवार्पणम् ॥
    त्रिशाखैः बिल्वपत्रैश्च अच्छिद्रैः कोमलैः शुभैः । तवपूजां करिष्यामि एकबिल्वं शिवार्पणम् ॥ कोटि कन्या
    महादानं तिलपर्वत कोटयः । काञ्चनं शैलदानेन एकबिल्वं शिवार्पणम् ॥ काशीक्षेत्र निवासं च कालभैरव दर्शनम्
    । प्रयागे माधवं दृष्ट्वा एकबिल्वं शिवार्पणम् ॥ इन्दुवारे व्रतं स्थित्वा निराहारो महेश्वराः । नक्तं
    हौष्यामि देवेश एकबिल्वं शिवार्पणम् ॥ रामलिङ्ग प्रतिष्ठा च वैवाहिक कृतं तथा । तटाकानिच सन्धानं एकबिल्वं
    शिवार्पणम् ॥ अखण्ड बिल्वपत्रं च आयुतं शिवपूजनम् । कृतं नाम सहस्रेण एकबिल्वं शिवार्पणम् ॥ उमया सहदेवेश
    नन्दि वाहनमेव च । भस्मलेपन सर्वाङ्गं एकबिल्वं शिवार्पणम् ॥ सालग्रामेषु विप्राणां तटाकं दशकूपयोः ।
    यज्ञकोटि सहस्रस्य एकबिल्वं शिवार्पणम् ॥ दन्ति कोटि सहस्रेषु अश्वमेधशतक्रतौ । कोटिकन्या महादानं एकबिल्वं
    शिवार्पणम् ॥ बिल्वाणां दर्शनं पुण्यं स्पर्शनं पापनाशनम् । अघोर पापसंहारं एकबिल्वं शिवार्पणम् ॥ सहस्रवेद
    पाटेषु ब्रह्मस्तापनमुच्यते । अनेकव्रत कोटीनां एकबिल्वं शिवार्पणम् ॥ अन्नदान सहस्रेषु सहस्रोपनयनं तधा
    । अनेक जन्मपापानि एकबिल्वं शिवार्पणम् ॥ बिल्वाष्टकमिदं पुण्यं यः पठेश्शिव सन्निधौ । शिवलोकमवाप्नोति
    एकबिल्वं शिवार्पणम् ॥ विकल्प सङ्कर्पण त्रिदलं त्रिगुणाकारं त्रिनेत्रं च त्रियायुधम् । त्रिजन्म पापसंहारं
    एकबिल्वं शिवार्पितम् ॥ ॥ त्रिशाखैः बिल्वपत्रैश्च अच्छिद्रैः कोमलैः शुभैः । तवपूजां करिष्यामि एकबिल्वं
    शिवार्पितम् ॥ ॥ दर्शनं बिल्ववृक्षस्य स्पर्शनं पापनाशनम् । अघोरपापसंहारं एकबिल्वं शिवार्पितम् ॥ ॥ सालग्रामेषु
    विप्रेषु तटाके वनकूपयोः । यज्ञकोटि सहस्राणां एकबिल्वं शिवार्पितम् ॥ ॥ दन्तिकोटि सहस्रेषु अश्वमेध शतानि
    च । कोटिकन्याप्रदानेन एकबिल्वं शिवार्पितम् ॥ ॥ एकं च बिल्वपत्रैश्च कोटियज्ञ फलं लभेत् । महादेवैश्च
    पूजार्थं एकबिल्वं शिवार्पितम् ॥ ॥ काशीक्षेत्रे निवासं च कालभैरव दर्शनम् । गयाप्रयाग मे दृष्ट्वा एकबिल्वं
    शिवार्पितम् ॥ ॥ उमया सह देवेशं वाहनं नन्दिशङ्करम् । मुच्यते सर्वपापेभ्यो एकबिल्वं शिवार्पितम् ॥ ॥
    इति श्री बिल्वाष्टकम् ॥
