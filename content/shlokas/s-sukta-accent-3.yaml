id: s-sukta-accent-3
category: veda
name:
  english: s-sukta-accent
  devanagari: स्-सुक्त-अच्चेन्त्
content:
  english: ktam ja̱petsa̭da || varsha̭ntu̱ te vi̭bhava̱ri̱ di̱vo a̭bhrasya̱ vidyṷtah | roha̭ntu̱ sarva̭bi̱ja̱nya̱va
    bra̭hma dvi̱sho ja̭hi || padma̭priye padmini padma̱haste padma̭laye padmadalaya̭takshi | vishva̭priye̱
    vishnu mano̭'nuku̱le tvatpa̭dapa̱dmam mayi̱ sanni̭dhatsva || ya sa padma̭sana̱stha vipulakatitati
    padma̱patra̭yata̱kshi | gambhira va̭rtana̱bhih stanabhara namita shubhra vastro̭ttari̱ya | lakshmirdi̱vyairgajendrairma̱nigana
    khacitaissnapita hḙmaku̱mbhaih | ni̱tyam sa pa̭dmaha̱sta mama vasa̭tu gri̱he sarva̱mangalya̭yukta
    || la̱kshmim kshirasamudra rajatanayam shri̱ramgadhamḙshvarim | da̱sibhutasamasta deva va̱nitam lo̱kaika̱
    dipa̭mkuram | shrimanmandakatakshalabdha vibhava bra̱hmendraganga̭dharam | tvam trai̱lokya̱ kutṷmbinim
    sa̱rasijam vande̱ mukṷndapriyam || si̱ddha̱la̱kshmirmo̭kshala̱kshmi̱rja̱yala̭kshmissa̱rasva̭ti |
    shrilakshmirva̭rala̱kshmi̱shca̱ pra̱sanna ma̭ma sa̱rvada || varamkushau pashamabhi̭timu̱dra̱m ka̱rairvahantim
    ka̭mala̱sanastham | balarka koti prati̭bham tri̱ne̱tra̱m bha̱jehamadyam ja̭gadi̱shvarim tam || sa̱rva̱ma̱nga̱lama̱ngalyḙ
    shi̱ve sa̱rvartha̭ sadhike | shara̭nye tryamba̭ke de̱vi̱ na̱raya̭ni na̱mo'stṷ te || sarasijanilaye
    saro̭jaha̱ste dhavalataramshuka gandhama
  devanagari: क्तं ज॒पेत्स॑दा ॥ वर्ष॑न्तु॒ ते वि॑भाव॒रि॒ दि॒वो अ॑भ्रस्य॒ विद्यु॑तः । रोह॑न्तु॒ सर्व॑बी॒जा॒न्य॒व
    ब्र॑ह्म द्वि॒षो ज॑हि ॥ पद्म॑प्रिये पद्मिनि पद्म॒हस्ते पद्मा॑लये पद्मदलाय॑ताक्षि । विश्व॑प्रिये॒ विष्णु
    मनो॑ऽनुकू॒ले त्वत्पा॑दप॒द्मं मयि॒ सन्नि॑धत्स्व ॥ या सा पद्मा॑सन॒स्था विपुलकटितटी पद्म॒पत्रा॑यता॒क्षी
    । गम्भीरा व॑र्तना॒भिः स्तनभर नमिता शुभ्र वस्त्रो॑त्तरी॒या । लक्ष्मीर्दि॒व्यैर्गजेन्द्रैर्म॒णिगण खचितैस्स्नापिता
    हे॑मकु॒म्भैः । नि॒त्यं सा प॑द्मह॒स्ता मम वस॑तु गृ॒हे सर्व॒माङ्गल्य॑युक्ता ॥ ल॒क्ष्मीं क्षीरसमुद्र
    राजतनयां श्री॒रंगधामे॑श्वरीम् । दा॒सीभूतसमस्त देव व॒नितां लो॒कैक॒ दीपां॑कुराम् । श्रीमन्मन्दकटाक्षलब्ध
    विभव ब्र॒ह्मेन्द्रगङ्गा॑धराम् । त्वां त्रै॒लोक्य॒ कुटु॑म्बिनीं स॒रसिजां वन्दे॒ मुकु॑न्दप्रियाम् ॥
    सि॒द्ध॒ल॒क्ष्मीर्मो॑क्षल॒क्ष्मी॒र्ज॒यल॑क्ष्मीस्स॒रस्व॑ती । श्रीलक्ष्मीर्व॑रल॒क्ष्मी॒श्च॒ प्र॒सन्ना
    म॑म स॒र्वदा ॥ वरांकुशौ पाशमभी॑तिमु॒द्रां॒ क॒रैर्वहन्तीं क॑मला॒सनस्थाम् । बालार्क कोटि प्रति॑भां त्रि॒णे॒त्रां॒
    भ॒जेहमाद्यां ज॑गदी॒श्वरीं ताम् ॥ स॒र्व॒म॒ङ्ग॒लमा॒ङ्गल्ये॑ शि॒वे स॒र्वार्थ॑ साधिके । शर॑ण्ये त्र्यम्ब॑के
    दे॒वि॒ ना॒राय॑णि न॒मोऽस्तु॑ ते ॥ सरसिजनिलये सरो॑जह॒स्ते धवलतरांशुक गन्धमा
