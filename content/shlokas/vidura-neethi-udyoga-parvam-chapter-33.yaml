id: vidura-neethi-udyoga-parvam-chapter-33
category: stotram
name:
  english: Vidura Neethi - Udyoga Parvam Chapter 33
content:
  english: '|| atha shrimahabharate udyogaparvani prajagaraparvani viduranitivakye trayastrimsho''dhyayah
    || vaishampayana uvaca | dvahstham praha mahaprajno dhritarashtro mahipatih | viduram drashtumicchami
    tamihanaya maciram || || prahito dhritarashtrena dutah kshattaramabravit | ishvarastvam maharajo mahaprajna
    didrikshati || || evamuktastu vidurah prapya rajaniveshanam | abraviddhritarashtraya dvahstha mam
    prativedaya || || dvahstha uvaca | viduro''yamanuprapto rajendra tava shasanat | drashtumicchati te
    padau kim karotu prashadhi mam || || dhritarashtra uvaca | praveshaya mahaprajnam viduram dirghadarshinam
    | aham hi vidurasyasya nakalyo jatu darshane || || dvahstha uvaca | pravishantah puram kshattarmaharajasya
    dhimatah | na hi te darshane''kalyo jatu raja braviti mam || || vaishampayana uvaca | tatah pravishya
    viduro dhritarashtra niveshanam | abravitpranjalirvakyam cintayanam naradhipam || || viduro''ham mahaprajna
    sampraptastava shasanat | yadi kim cana kartavyamayamasmi prashadhi mam || || dhritarashtra uvaca
    | sanjayo vidura prapto garhayitva ca mam gatah | ajatashatroh shvo vakyam sabhamadhye sa vakshyati
    || || tasyadya kuruvirasya na vijnatam vaco maya | tanme dahati gatrani tadakarshitprajagaram || ||
    jagrato dahyamanasya shreyo yadiha pashyasi | tadbruhi tvam hi nastata dharmarthakushalo hyasi ||
    || yatah praptah sanjayah pandavebhyo na me yathavanmanasah prashantih | savendriyanyaprakritim gatani
    kim vakshyatityeva hi me''dya cinta || || tanme bruhi vidura tvam yathavan manishitam sarvamajatashatroh
    | yatha ca nastata hitam bhavecca prajashca sarvah sukhita bhaveyuh || || vidura uvaca | abhiyuktam
    balavata durbalam hinasadhanam | hritasvam kaminam coramavishanti prajagarah || || kaccidetairmahadoshairna
    sprishto''si naradhipa | kaccinna paravitteshu gridhyanviparitapyase || || dhritarashtra uvaca | shrotumicchami
    te dharmyam param naihshreyasam vacah | asminrajarshivamshe hi tvamekah prajnasammatah || || vidura
    uvaca | raja lakshanasampannastrailokyasyadhipo bhavet | preshyaste preshitashcaiva dhritarashtra
    yudhishthirah || || viparitatarashca tvam bhagadheye na sammatah | arcisham prakshayaccaiva dharmatma
    dharmakovidah || || anrishamsyadanukroshaddharmatsatyatparakramat | gurutvattvayi samprekshya bahunkleshamstitikshate
    || || duryodhane saubale ca karne duhshasane tatha | eteshvaishvaryamadhaya katham tvam bhutimicchasi
    || || ekasmatvrikshadyajnapatrani rajan srukca drauni pethanipidane ca | etasmadrajanbruvato me nibodha
    ekasmadvai jayate''sacca sacca || || atmajnanam samarambhastitiksha dharmanityata | yamarthannapakarshanti
    sa vai pandita ucyate || || nishevate prashastani ninditani na sevate | anastikah shraddadhana etatpandita
    lakshanam || || krodho harshashca darpashca hristambho manyamanita | yamarthannapakarshanti sa vai
    pandita ucyate || || yasya krityam na jananti mantram va mantritam pare | kritamevasya jananti sa
    vai pandita ucyate || || yasya krityam na vighnanti shitamushnam bhayam ratih | samriddhirasamriddhirva
    sa vai pandita ucyate || || yasya samsarini prajna dharmarthavanuvartate | kamadartham vrinite yah
    sa vai pandita ucyate || || yathashakti cikirshanti yathashakti ca kurvate | na kim cidavamanyante
    pandita bharatarshabha || || kshipram vijanati ciram shrinoti vijnaya cartham bhajate na kamat | nasamprishto
    vyaupayunkte pararthe tatprajnanam prathamam panditasya || || naprapyamabhivanchanti nashtam necchanti
    shocitum | apatsu ca na muhyanti narah pandita buddhayah || || nishcitya yah prakramate nantarvasati
    karmanah | avandhya kalo vashyatma sa vai pandita ucyate || || arya karmani rajyante bhutikarmani
    kurvate | hitam ca nabhyasuyanti pandita bharatarshabha || || na hrishyatyatmasammane navamanena tapyate
    | gango hrada ivakshobhyo yah sa pandita ucyate || || tattvajnah sarvabhutanam yogajnah sarvakarmanam
    | upayajno manushyanam narah pandita ucyate || || pravritta vakcitrakatha uhavanpratibhanavan | ashu
    granthasya vakta ca sa vai pandita ucyate || || shrutam prajnanugam yasya prajna caiva shrutanuga
    | asambhinnarya maryadah panditakhyam labheta sah || || artham mahantamasadya vidyamaishvaryameva
    ca | vicaratyasamunnaddho yasya pandita ucyate || || ashrutashca samunnaddho daridrashca mahamanah
    | arthamshcakarmana prepsurmudha ityucyate budhaih || || svamartham yah parityajya pararthamanutishthati
    | mithya carati mitrarthe yashca mudhah sa ucyate || || akamam kamayati yah kamayanam parityajet |
    balavantam ca yo dveshti tamahurmudhacetasam || || akamankamayati yah kamayananparidvishan | balavantam
    ca yo dveshti tamahurmudhacetasam || || amitram kurute mitram mitram dveshti hinasti ca | karma carabhate
    dushtam tamahurmudhacetasam || || samsarayati krityani sarvatra vicikitsate | ciram karoti kshiprarthe
    sa mudho bharatarshabha || || shraddham pitribhyo na dadati daivatani narcati | suhrinmitram na labhate
    tamahurmudhacetasam || || anahutah pravishati aprishto bahu bhashate | vishvasatyapramatteshu mudha
    ceta naradhamah || || param kshipati doshena vartamanah svayam tatha | yashca krudhyatyanishah sansa
    ca mudhatamo narah || || atmano balamajnaya dharmarthaparivarjitam | alabhyamicchannaishkarmyanmudha
    buddhirihocyate || || ashishyam shasti yo rajanyashca shunyamupasate | kadaryam bhajate yashca tamahurmudhacetasam
    || || artham mahantamasadya vidyamaishvaryameva va | vicaratyasamunnaddho yah sa pandita ucyate ||
    || ekah sampannamashnati vaste vasashca shobhanam | yo''samvibhajya bhrityebhyah ko nrishamsatarastatah
    || || ekah papani kurute phalam bhunkte mahajanah | bhoktaro vipramucyante karta doshena lipyate ||
    || ekam hanyanna vahanyadishurmukto dhanushmata | buddhirbuddhimatotsrishta hanyadrashtram sarajakam
    || || ekaya dve vinishcitya trimshcaturbhirvashe kuru | panca jitva viditva shatsapta hitva sukhi
    bhava || || ekam visharaso hanti shastrenaikashca vadhyate | sarashtram sa prajam hanti rajanam mantravisravah
    || || ekah svadu na bhunjita ekashcarthanna cintayet | eko na gacchedadhvanam naikah supteshu jagriyat
    || || ekamevadvitiyam tadyadrajannavabudhyase | satyam svargasya sopanam paravarasya nauriva || ||
    ekah kshamavatam dosho dvitiyo nopalabhyate | yadenam kshamaya yuktamashaktam manyate janah || ||
    so''sya dosho na mantavyah kshama hi paramam balam | kshama guno hyashaktanam shaktanam bhushanam
    tatha || || kshama vashikritirloke kshamaya kim na sadhyate | shantishankhah kare yasya kim karishyati
    durjanah || || atrine patito vahnih svayamevopashamyati | akshamavanparam doshairatmanam caiva yojayet
    || || eko dharmah param shreyah kshamaika shantiruttama | vidyaika parama drishtirahimsaika sukhavaha
    || || dvavimau grasate bhumih sarpo bilashayaniva | rajanam caviroddharam brahmanam capravasinam ||
    || dve karmani narah kurvannasmi~lloke virocate | abruvanparusham kim cidasato narthayamstatha ||
    || dvavimau purushavyaghra parapratyaya karinau | striyah kamita kaminyo lokah pujita pujakah || ||
    dvavimau kantakau tikshnau shariraparishoshanau | yashcadhanah kamayate yashca kupyatyanishvarah ||
    || dvaveva na virajete viparitena karmana | grihasthashca nirarambhah karyavamshcaiva bhikshukah ||
    || dvavimau purushau rajansvargasya pari tishthatah | prabhushca kshamaya yukto daridrashca pradanavan
    || || nyayagatasya dravyasya boddhavyau dvavatikramau | apatre pratipattishca patre capratipadanam
    || || dvavambhasi niveshtavyau gale baddhva dridham shilam | dhanavantamadataram daridram catapasvinam
    || || dvavimau purushavyaghra suryamandalabhedinau | parivradyogayuktashca rane cabhimukho hatah ||
    || trayo nyaya manushyanam shruyante bharatarshabha | kaniyanmadhyamah shreshtha iti vedavido viduh
    || || trividhah purusha rajannuttamadhamamadhyamah | niyojayedyathavattamstrividheshveva karmasu ||
    || traya evadhana rajanbharya dasastatha sutah | yatte samadhigacchanti yasya te tasya taddhanam ||
    || haranam ca parasvanam paradarabhimarshanam | suhridashca parityagastrayo dosha kshayavahah || ||
    trividham narakasyedam dvaram nashanamatmanah | kamah krodhastatha lobhastasmadetattrayam tyajet ||
    || varapradanam rajyam ca putrajanma ca bharata | shatroshca mokshanam kricchrattrini caikam ca tatsamam
    || || bhaktam ca bajamanam ca tavasmiti vadinam | trinetan sharanam praptanvishame''pi na santyajet
    || || catvari rajna tu mahabalena varjyanyahuh panditastani vidyat | alpaprajnaih saha mantram na
    kuryan na dirghasutrairalasaishcaranaishca || || catvari te tata grihe vasantu shriyabhijushtasya
    grihastha dharme | vriddho jnatiravasannah kulinah sakha daridro bhagini canapatya || || catvaryaha
    maharaja sadyaskani brihaspatih | pricchate tridashendraya tanimani nibodha me || || devatanam ca
    sankalpamanubhavam ca dhimatam | vinayam kritavidyanam vinasham papakarmanam || || catvari karmanyabhayankarani
    bhayam prayacchantyayathakritani | managnihotram uta manamaunam manenadhitamuta manayajnah || || pancagnayo
    manushyena paricaryah prayatnatah | pita matagniratma ca gurushca bharatarshabha || || pancaiva pujaya~lloke
    yashah prapnoti kevalam | devanpitrinmanushyamshca bhikshunatithipancaman || || panca tvanugamishyanti
    yatra yatra gamishyasi | mitranyamitra madhyastha upajivyopajivinah || || pancendriyasya martyasya
    chidram cedekamindriyam | tato''sya sravati prajna driteh padadivodakam || || shaddoshah purusheneha
    hatavya bhutimicchata | nidra tandri bhayam krodha alasyam dirghasutrata || || shadimanpurusho jahyadbhinnam
    navamivarnave | apravaktaramacaryamanadhiyanamritvijam || || arakshitaram rajanam bharyam capriya
    vadinim | gramakaram ca gopalam vanakamam ca napitam || || shadeva tu gunah pumsa na hatavyah kadacana
    | satyam danamanalasyamanasuya kshama dhritih || || arthagamo nityamarogita ca priya ca bharya priyavadini
    ca | vashyashca putro''rthakari ca vidya shat jivalokasya sukhani rajan || || shannamatmani nityanamaishvaryam
    yo''dhigacchati | na sa papaih kuto''narthairyujyate vijitendriyah || || shadime shatsu jivanti saptamo
    nopalabhyate | corah pramatte jivanti vyadhiteshu cikitsakah || || pramadah kamayaneshu yajamaneshu
    yajakah | raja vivadamaneshu nityam murkheshu panditah || || shadimani vinashyanti muhurtamanavekshanat
    | gavah seva krishirbharya vidya vrishalasangatih || || shadete hyavamanyante nityam purvopakarinam
    | acaryam shikshita shishyah kritadarashca mataram || || narim vigatakamastu kritarthashca prayojakam
    | navam nistirnakantara naturashca cikitsakam || || arogyamanrinyamavipravasah sadbhirmanushyaih saha
    samprayogah | svapratyaya vrittirabhitavasah shat jivalokasya sukhani rajan || || irshurghrini nasantushtah
    krodhano nityashankitah | parabhagyopajivi ca shadete nityaduhkhitah || || sapta doshah sada rajna
    hatavya vyasanodayah | prayasho yairvinashyanti kritamulashca parthivah || || striyo''ksha mrigaya
    panam vakparushyam ca pancamam | mahacca dandaparushyamarthadushanameva ca || || ashtau purvanimittani
    narasya vinashishyatah | brahmananprathamam dveshti brahmanaishca virudhyate || || brahmana svani
    cadatte brahmanamshca jighamsati | ramate nindaya caisham prashamsam nabhinandati || || naitansmarati
    krityeshu yacitashcabhyasuyati | etandoshannarah prajno buddhya buddhva vivarjayet || || ashtavimani
    harshasya nava nitani bharata | vartamanani drishyante tanyeva susukhanyapi || || samagamashca sakhibhirmahamshcaiva
    dhanagamah | putrena ca parishvangah sannipatashca maithune || || samaye ca priyalapah svayutheshu
    ca sannatih | abhipretasya labhashca puja ca janasamsadi || || ashtau gunah purusham dipayanti prajna
    ca kaulyam ca damah shrutam ca | parakramashcabahubhashita ca danam yathashakti kritajnata ca || ||
    navadvaramidam veshma tristhunam panca sakshikam | kshetrajnadhishthitam vidvanyo veda sa parah kavih
    || || dasha dharmam na jananti dhritarashtra nibodha tan | mattah pramatta unmattah shrantah kruddho
    bubhukshitah || || tvaramanashca bhirushca lubdhah kami ca te dasha | tasmadeteshu bhaveshu na prasajjeta
    panditah || || atraivodaharantimamitihasam puratanam | putrarthamasurendrena gitam caiva sudhanvana
    || || yah kamamanyu prajahati raja patre pratishthapayate dhanam ca | visheshavicchrutavankshiprakari
    tam sarvalokah kurute pramanam || || janati vishvasayitum manushyan vijnata dosheshu dadhati dandam
    | janati matram ca tatha kshamam ca tam tadrisham shrirjushate samagra || || sudurbalam navajanati
    kancid yukto ripum sevate buddhipurvam | na vigraham rocayate balasthaih kale ca yo vikramate sa dhirah
    || || prapyapadam na vyathate kada cid udyogamanvicchati capramattah | duhkham ca kale sahate jitatma
    dhurandharastasya jitah sapatnah || || anarthakam vipra vasam grihebhyah papaih sandhim paradarabhimarsham
    | dambham stainyam paishunam madya panam na sevate yah sa sukhi sadaiva || || na samrambhenarabhate''rthavargam
    akaritah shamsati tathyameva | na matrarthe rocayate vivadam napujitah kupyati capyamudhah || || na
    yo''bhyasuyatyanukampate ca na durbalah pratibhavyam karoti | natyaha kim citkshamate vivadam sarvatra
    tadriglabhate prashamsam || || yo noddhatam kurute jatu vesham na paurushenapi vikatthate''nyan |
    na murcchitah katukanyaha kim cit priyam sada tam kurute jano''pi || || na vairamuddipayati prashantam
    na darmamarohati nastameti | na durgato''smiti karoti manyum tamarya shilam paramahuragryam || ||
    na sve sukhe vai kurute praharsham nanyasya duhkhe bhavati pratitah | dattva na pashcatkurute''nutapam
    na katthate satpurusharya shilah || || deshacaransamayanjatidharman bubhushate yastu paravarajnah
    | sa tatra tatradhigatah sadaiva mahajanasyadhipatyam karoti || || dambham moham matsaram papakrityam
    rajadvishtam paishunam pugavairam | mattonmattairdurjanaishcapi vadam yah prajnavanvarjayetsa pradhanah
    || || damam shaucam daivatam mangalani prayashcittam vividha~llokavadan | etani yah kurute naityakani
    tasyotthanam devata radhayanti || || samairvivaham kurute na hinaih samaih sakhyam vyavaharam kathashca
    | gunairvishishtamshca puro dadhati vipashcitastasya nayah sunitah || || mitam bhunkte samvibhajyashritebhyo
    mitam svapityamitam karmakritva | dadatyamitreshvapi yacitah sam stamatmavantam prajahatyanarthah
    || || cikirshitam viprakritam ca yasya nanye janah karma jananti kim cit | mantre gupte samyaganushthite
    ca svalpo nasya vyathate kashcidarthah || || yah sarvabhutaprashame nivishtah satyo mridurdanakricchuddha
    bhavah | ativa sanjnayate jnatimadhye mahamanirjatya iva prasannah || || ya atmanapatrapate bhrisham
    narah sa sarvalokasya gururbhavatyuta | ananta tejah sumanah samahitah svatejasa surya ivavabhasate
    || || vane jatah shapadagdhasya rajnah pandoh putrah panca pancendra kalpah | tvayaiva bala vardhitah
    shikshitashca tavadesham palayantyambikeya || || pradayaishamucitam tata rajyam sukhi putraih sahito
    modamanah | na devanam napi ca manushanam bhavishyasi tvam tarkaniyo narendra || || || iti shrimahabharate
    udyogaparvani prajagaraparvani viduranitivakye trayastrimsho''dhyayah ||'
  devanagari: ॥ अथ श्रीमहाभारते उद्योगपर्वणि प्रजागरपर्वणि विदुरनीतिवाक्ये त्रयस्त्रिंशोऽध्यायः ॥ वैशम्पायन
    उवाच । द्वाःस्थं प्राह महाप्राज्ञो धृतराष्ट्रो महीपतिः । विदुरं द्रष्टुमिच्छामि तमिहानय माचिरम् ॥
    ॥ प्रहितो धृतराष्ट्रेण दूतः क्षत्तारमब्रवीत् । ईश्वरस्त्वां महाराजो महाप्राज्ञ दिदृक्षति ॥ ॥ एवमुक्तस्तु
    विदुरः प्राप्य राजनिवेशनम् । अब्रवीद्धृतराष्ट्राय द्वाःस्थ मां प्रतिवेदय ॥ ॥ द्वाःस्थ उवाच । विदुरोऽयमनुप्राप्तो
    राजेन्द्र तव शासनात् । द्रष्टुमिच्छति ते पादौ किं करोतु प्रशाधि माम् ॥ ॥ धृतराष्ट्र उवाच । प्रवेशय
    महाप्राज्ञं विदुरं दीर्घदर्शिनम् । अहं हि विदुरस्यास्य नाकाल्यो जातु दर्शने ॥ ॥ द्वाःस्थ उवाच । प्रविशान्तः
    पुरं क्षत्तर्महाराजस्य धीमतः । न हि ते दर्शनेऽकाल्यो जातु राजा ब्रवीति माम् ॥ ॥ वैशम्पायन उवाच । ततः
    प्रविश्य विदुरो धृतराष्ट्र निवेशनम् । अब्रवीत्प्राञ्जलिर्वाक्यं चिन्तयानं नराधिपम् ॥ ॥ विदुरोऽहं महाप्राज्ञ
    सम्प्राप्तस्तव शासनात् । यदि किं चन कर्तव्यमयमस्मि प्रशाधि माम् ॥ ॥ धृतरष्त्र उवाच । सञ्जयो विदुर
    प्राप्तो गर्हयित्वा च मां गतः । अजातशत्रोः श्वो वाक्यं सभामध्ये स वक्ष्यति ॥ ॥ तस्याद्य कुरुवीरस्य
    न विज्ञातं वचो मया । तन्मे दहति गात्राणि तदकार्षीत्प्रजागरम् ॥ ॥ जाग्रतो दह्यमानस्य श्रेयो यदिह पश्यसि
    । तद्ब्रूहि त्वं हि नस्तात धर्मार्थकुशलो ह्यसि ॥ ॥ यतः प्राप्तः सञ्जयः पाण्डवेभ्यो न मे यथावन्मनसः
    प्रशान्तिः । सवेन्द्रियाण्यप्रकृतिं गतानि किं वक्ष्यतीत्येव हि मेऽद्य चिन्ता ॥ ॥ तन्मे ब्रूहि विदुर
    त्वं यथावन् मनीषितं सर्वमजातशत्रोः । यथा च नस्तात हितं भवेच्च प्रजाश्च सर्वाः सुखिता भवेयुः ॥ ॥ विदुर
    उवाच । अभियुक्तं बलवता दुर्बलं हीनसाधनम् । हृतस्वं कामिनं चोरमाविशन्ति प्रजागराः ॥ ॥ कच्चिदेतैर्महादोषैर्न
    स्पृष्टोऽसि नराधिप । कच्चिन्न परवित्तेषु गृध्यन्विपरितप्यसे ॥ ॥ धृतराष्ट्र उवाच । श्रोतुमिच्छामि ते
    धर्म्यं परं नैःश्रेयसं वचः । अस्मिन्राजर्षिवंशे हि त्वमेकः प्राज्ञसम्मतः ॥ ॥ विदुर उवाच । रजा लक्षणसम्पन्नस्त्रैलोक्यस्याधिपो
    भवेत् । प्रेष्यस्ते प्रेषितश्चैव धृतराष्ट्र युधिष्ठिरः ॥ ॥ विपरीततरश्च त्वं भागधेये न सम्मतः । अर्चिषां
    प्रक्षयाच्चैव धर्मात्मा धर्मकोविदः ॥ ॥ आनृशंस्यादनुक्रोशाद्धर्मात्सत्यात्पराक्रमात् । गुरुत्वात्त्वयि
    सम्प्रेक्ष्य बहून्क्लेषांस्तितिक्षते ॥ ॥ दुर्योधने सौबले च कर्णे दुःशासने तथा । एतेष्वैश्वर्यमाधाय
    कथं त्वं भूतिमिच्छसि ॥ ॥ एकस्मात्वृक्षाद्यज्ञपत्राणि राजन् स्रुक्च द्रौणी पेठनीपीडने च । एतस्माद्राजन्ब्रुवतो
    मे निबोध एकस्माद्वै जायतेऽसच्च सच्च ॥ ॥ आत्मज्ञानं समारम्भस्तितिक्षा धर्मनित्यता । यमर्थान्नापकर्षन्ति
    स वै पण्दित उच्यते ॥ ॥ निषेवते प्रशस्तानि निन्दितानि न सेवते । अनास्तिकः श्रद्दधान एतत्पण्डित लक्षणम्
    ॥ ॥ क्रोधो हर्षश्च दर्पश्च ह्रीस्तम्भो मान्यमानिता । यमर्थान्नापकर्षन्ति स वै पण्डित उच्यते ॥ ॥ यस्य
    कृत्यं न जानन्ति मन्त्रं वा मन्त्रितं परे । कृतमेवास्य जानन्ति स वै पण्डित उच्यते ॥ ॥ यस्य कृत्यं
    न विघ्नन्ति शीतमुष्णं भयं रतिः । समृद्धिरसमृद्धिर्वा स वै पण्डित उच्यते ॥ ॥ यस्य संसारिणी प्रज्ञा
    धर्मार्थावनुवर्तते । कामादर्थं वृणीते यः स वै पण्डित उच्यते ॥ ॥ यथाशक्ति चिकीर्षन्ति यथाशक्ति च कुर्वते
    । न किं चिदवमन्यन्ते पण्डिता भरतर्षभ ॥ ॥ क्षिप्रं विजानाति चिरं शृणोति विज्ञाय चार्थं भजते न कामात्
    । नासम्पृष्टो व्यौपयुङ्क्ते परार्थे तत्प्रज्ञानं प्रथमं पण्डितस्य ॥ ॥ नाप्राप्यमभिवाञ्छन्ति नष्टं
    नेच्छन्ति शोचितुम् । आपत्सु च न मुह्यन्ति नराः पण्डित बुद्धयः ॥ ॥ निश्चित्य यः प्रक्रमते नान्तर्वसति
    कर्मणः । अवन्ध्य कालो वश्यात्मा स वै पण्डित उच्यते ॥ ॥ आर्य कर्मणि राज्यन्ते भूतिकर्माणि कुर्वते ।
    हितं च नाभ्यसूयन्ति पण्डिता भरतर्षभ ॥ ॥ न हृष्यत्यात्मसम्माने नावमानेन तप्यते । गाङ्गो ह्रद इवाक्षोभ्यो
    यः स पण्डित उच्यते ॥ ॥ तत्त्वज्ञः सर्वभूतानां योगज्ञः सर्वकर्मणाम् । उपायज्ञो मनुष्याणां नरः पण्डित
    उच्यते ॥ ॥ प्रवृत्त वाक्चित्रकथ ऊहवान्प्रतिभानवान् । आशु ग्रन्थस्य वक्ता च स वै पण्डित उच्यते ॥ ॥
    श्रुतं प्रज्ञानुगं यस्य प्रज्ञा चैव श्रुतानुगा । असम्भिन्नार्य मर्यादः पण्डिताख्यां लभेत सः ॥ ॥ अर्थं
    महान्तमासद्य विद्यामैश्वर्यमेव च । विचरत्यसमुन्नद्धो यस्य पण्डित उच्यते ॥ ॥ अश्रुतश्च समुन्नद्धो दरिद्रश्च
    महामनाः । अर्थांश्चाकर्मणा प्रेप्सुर्मूढ इत्युच्यते बुधैः ॥ ॥ स्वमर्थं यः परित्यज्य परार्थमनुतिष्ठति
    । मिथ्या चरति मित्रार्थे यश्च मूढः स उच्यते ॥ ॥ अकामां कामयति यः कामयानां परित्यजेत् । बलवन्तं च यो
    द्वेष्टि तमाहुर्मूढचेतसम् ॥ ॥ अकामान्कामयति यः कामयानान्परिद्विषन् । बलवन्तं च यो द्वेष्टि तमाहुर्मूढचेतसम्
    ॥ ॥ अमित्रं कुरुते मित्रं मित्रं द्वेष्टि हिनस्ति च । कर्म चारभते दुष्टं तमाहुर्मूढचेतसम् ॥ ॥ संसारयति
    कृत्यानि सर्वत्र विचिकित्सते । चिरं करोति क्षिप्रार्थे स मूढो भरतर्षभ ॥ ॥ श्राद्धं पितृभ्यो न ददाति
    दैवतानि नार्चति । सुहृन्मित्रं न लभते तमाहुर्मूढचेतसम् ॥ ॥ अनाहूतः प्रविशति अपृष्टो बहु भाषते । विश्वसत्यप्रमत्तेषु
    मूढ चेता नराधमः ॥ ॥ परं क्षिपति दोषेण वर्तमानः स्वयं तथा । यश्च क्रुध्यत्यनीशः सन्स च मूढतमो नरः ॥
    ॥ आत्मनो बलमाज्ञाय धर्मार्थपरिवर्जितम् । अलभ्यमिच्छन्नैष्कर्म्यान्मूढ बुद्धिरिहोच्यते ॥ ॥ अशिष्यं
    शास्ति यो राजन्यश्च शून्यमुपासते । कदर्यं भजते यश्च तमाहुर्मूढचेतसम् ॥ ॥ अर्थं महान्तमासाद्य विद्यामैश्वर्यमेव
    वा । विचरत्यसमुन्नद्धो यः स पण्डित उच्यते ॥ ॥ एकः सम्पन्नमश्नाति वस्ते वासश्च शोभनम् । योऽसंविभज्य
    भृत्येभ्यः को नृशंसतरस्ततः ॥ ॥ एकः पापानि कुरुते फलं भुङ्क्ते महाजनः । भोक्तारो विप्रमुच्यन्ते कर्ता
    दोषेण लिप्यते ॥ ॥ एकं हन्यान्न वाहन्यादिषुर्मुक्तो धनुष्मता । बुद्धिर्बुद्धिमतोत्सृष्टा हन्याद्राष्ट्रं
    सराजकम् ॥ ॥ एकया द्वे विनिश्चित्य त्रींश्चतुर्भिर्वशे कुरु । पञ्च जित्वा विदित्वा षट्सप्त हित्वा सुखी
    भव ॥ ॥ एकं विषरसो हन्ति शस्त्रेणैकश्च वध्यते । सराष्ट्रं स प्रजं हन्ति राजानं मन्त्रविस्रवः ॥ ॥ एकः
    स्वादु न भुञ्जीत एकश्चार्थान्न चिन्तयेत् । एको न गच्छेदध्वानं नैकः सुप्तेषु जागृयात् ॥ ॥ एकमेवाद्वितीयं
    तद्यद्राजन्नावबुध्यसे । सत्यं स्वर्गस्य सोपानं पारावारस्य नौरिव ॥ ॥ एकः क्षमावतां दोषो द्वितीयो नोपलभ्यते
    । यदेनं क्षमया युक्तमशक्तं मन्यते जनः ॥ ॥ सोऽस्य दोषो न मन्तव्यः क्षमा हि परमं बलम् । क्षमा गुणो ह्यशक्तानां
    शक्तानां भूषणं तथा ॥ ॥ क्षमा वशीकृतिर्लोके क्षमया किं न साध्यते । शान्तिशङ्खः करे यस्य किं करिष्यति
    दुर्जनः ॥ ॥ अतृणे पतितो वह्निः स्वयमेवोपशाम्यति । अक्षमावान्परं दोषैरात्मानं चैव योजयेत् ॥ ॥ एको धर्मः
    परं श्रेयः क्षमैका शान्तिरुत्तमा । विद्यैका परमा दृष्टिरहिंसैका सुखावहा ॥ ॥ द्वाविमौ ग्रसते भूमिः
    सर्पो बिलशयानिव । राजानं चाविरोद्धारं ब्राह्मणं चाप्रवासिनम् ॥ ॥ द्वे कर्मणी नरः कुर्वन्नस्मिँल्लोके
    विरोचते । अब्रुवन्परुषं किं चिदसतो नार्थयंस्तथा ॥ ॥ द्वाविमौ पुरुषव्याघ्र परप्रत्यय कारिणौ । स्त्रियः
    कामित कामिन्यो लोकः पूजित पूजकः ॥ ॥ द्वाविमौ कण्टकौ तीक्ष्णौ शरीरपरिशोषणौ । यश्चाधनः कामयते यश्च कुप्यत्यनीश्वरः
    ॥ ॥ द्वावेव न विराजेते विपरीतेन कर्मणा । गृहस्थश्च निरारम्भः कार्यवांश्चैव भिक्षुकः ॥ ॥ द्वाविमौ पुरुषौ
    राजन्स्वर्गस्य परि तिष्ठतः । प्रभुश्च क्षमया युक्तो दरिद्रश्च प्रदानवान् ॥ ॥ न्यायागतस्य द्रव्यस्य
    बोद्धव्यौ द्वावतिक्रमौ । अपात्रे प्रतिपत्तिश्च पात्रे चाप्रतिपादनम् ॥ ॥ द्वावम्भसि निवेष्टव्यौ गले
    बद्ध्वा दृढं शिलाम् । धनवन्तमदातारं दरिद्रं चातपस्विनम् ॥ ॥ द्वाविमौ पुरुषव्याघ्र सुर्यमण्डलभेदिनौ
    । परिव्राड्योगयुक्तश्च रणे चाभिमुखो हतः ॥ ॥ त्रयो न्याया मनुष्याणां श्रूयन्ते भरतर्षभ । कनीयान्मध्यमः
    श्रेष्ठ इति वेदविदो विदुः ॥ ॥ त्रिविधाः पुरुषा राजन्नुत्तमाधममध्यमाः । नियोजयेद्यथावत्तांस्त्रिविधेष्वेव
    कर्मसु ॥ ॥ त्रय एवाधना राजन्भार्या दासस्तथा सुतः । यत्ते समधिगच्छन्ति यस्य ते तस्य तद्धनम् ॥ ॥ हरणं
    च परस्वानां परदाराभिमर्शनम् । सुहृदश्च परित्यागस्त्रयो दोषा क्षयावहः ॥ ॥ त्रिविधं नरकस्येदं द्वारं
    नाशनमात्मनः । कामः क्रोधस्तथा लोभस्तस्मादेतत्त्रयं त्यजेत् ॥ ॥ वरप्रदानं राज्यां च पुत्रजन्म च भारत
    । शत्रोश्च मोक्षणं कृच्छ्रात्त्रीणि चैकं च तत्समम् ॥ ॥ भक्तं च बजमानं च तवास्मीति वादिनम् । त्रीनेतान्
    शरणं प्राप्तान्विषमेऽपि न सन्त्यजेत् ॥ ॥ चत्वारि राज्ञा तु महाबलेन वर्ज्यान्याहुः पण्डितस्तानि विद्यात्
    । अल्पप्रज्ञैः सह मन्त्रं न कुर्यान् न दीर्घसूत्रैरलसैश्चारणैश्च ॥ ॥ चत्वारि ते तात गृहे वसन्तु श्रियाभिजुष्टस्य
    गृहस्थ धर्मे । वृद्धो ज्ञातिरवसन्नः कुलीनः सखा दरिद्रो भगिनी चानपत्या ॥ ॥ चत्वार्याह महाराज सद्यस्कानि
    बृहस्पतिः । पृच्छते त्रिदशेन्द्राय तानीमानि निबोध मे ॥ ॥ देवतानां च सङ्कल्पमनुभावं च धीमताम् । विनयं
    कृतविद्यानां विनाशं पापकर्मणाम् ॥ ॥ चत्वारि कर्माण्यभयङ्कराणि भयं प्रयच्छन्त्ययथाकृतानि । मानाग्निहोत्रं
    उत मानमौनं मानेनाधीतमुत मानयज्ञः ॥ ॥ पञ्चाग्नयो मनुष्येण परिचर्याः प्रयत्नतः । पिता माताग्निरात्मा
    च गुरुश्च भरतर्षभ ॥ ॥ पञ्चैव पूजयँल्लोके यशः प्राप्नोति केवलम् । देवान्पितॄन्मनुष्यांश्च भिक्षूनतिथिपञ्चमान्
    ॥ ॥ पञ्च त्वानुगमिष्यन्ति यत्र यत्र गमिष्यसि । मित्राण्यमित्रा मध्यस्था उपजीव्योपजीविनः ॥ ॥ पञ्चेन्द्रियस्य
    मर्त्यस्य छिद्रं चेदेकमिन्द्रियम् । ततोऽस्य स्रवति प्रज्ञा दृतेः पादादिवोदकम् ॥ ॥ षड्दोषाः पुरुषेणेह
    हातव्या भूतिमिच्छता । निद्रा तन्द्री भयं क्रोध आलस्यं दीर्घसूत्रता ॥ ॥ षडिमान्पुरुषो जह्याद्भिन्नां
    नावमिवार्णवे । अप्रवक्तारमाचार्यमनधीयानमृत्विजम् ॥ ॥ अरक्षितारं राजानं भार्यां चाप्रिय वादिनीम् ।
    ग्रामकारं च गोपालं वनकामं च नापितम् ॥ ॥ षडेव तु गुणाः पुंसा न हातव्याः कदाचन । सत्यं दानमनालस्यमनसूया
    क्षमा धृतिः ॥ ॥ अर्थागमो नित्यमरोगिता च प्रिया च भार्या प्रियवादिनी च । वश्यश्च पुत्रोऽर्थकरी च विद्या
    षट् जीवलोकस्य सुखानि राजन् ॥ ॥ षण्णामात्मनि नित्यानामैश्वर्यं योऽधिगच्छति । न स पापैः कुतोऽनर्थैर्युज्यते
    विजितेन्द्रियः ॥ ॥ षडिमे षट्सु जीवन्ति सप्तमो नोपलभ्यते । चोराः प्रमत्ते जीवन्ति व्याधितेषु चिकित्सकाः
    ॥ ॥ प्रमदाः कामयानेषु यजमानेषु याजकाः । राजा विवदमानेषु नित्यं मूर्खेषु पण्डिताः ॥ ॥ षडिमानि विनश्यन्ति
    मुहूर्तमनवेक्षणात् । गावः सेवा कृषिर्भार्या विद्या वृषलसङ्गतिः ॥ ॥ षडेते ह्यवमन्यन्ते नित्यं पूर्वोपकारिणम्
    । आचार्यं शिक्षिता शिष्याः कृतदारश्च मातरम् ॥ ॥ नारिं विगतकामस्तु कृतार्थाश्च प्रयोजकम् । नावं निस्तीर्णकान्तारा
    नातुराश्च चिकित्सकम् ॥ ॥ आरोग्यमानृण्यमविप्रवासः सद्भिर्मनुष्यैः सह सम्प्रयोगः । स्वप्रत्यया वृत्तिरभीतवासः
    षट् जीवलोकस्य सुखानि राजन् ॥ ॥ ईर्षुर्घृणी नसन्तुष्टः क्रोधनो नित्यशङ्कितः । परभाग्योपजीवी च षडेते
    नित्यदुःखिताः ॥ ॥ सप्त दोषाः सदा राज्ञा हातव्या व्यसनोदयाः । प्रायशो यैर्विनश्यन्ति कृतमूलाश्च पार्थिवाः
    ॥ ॥ स्त्रियोऽक्षा मृगया पानं वाक्पारुष्यं च पञ्चमम् । महच्च दण्डपारुष्यमर्थदूषणमेव च ॥ ॥ अष्टौ पूर्वनिमित्तानि
    नरस्य विनशिष्यतः । ब्राह्मणान्प्रथमं द्वेष्टि ब्राह्मणैश्च विरुध्यते ॥ ॥ ब्राह्मण स्वानि चादत्ते ब्राह्मणांश्च
    जिघांसति । रमते निन्दया चैषां प्रशंसां नाभिनन्दति ॥ ॥ नैतान्स्मरति कृत्येषु याचितश्चाभ्यसूयति । एतान्दोषान्नरः
    प्राज्ञो बुद्ध्या बुद्ध्वा विवर्जयेत् ॥ ॥ अष्टाविमानि हर्षस्य नव नीतानि भारत । वर्तमानानि दृश्यन्ते
    तान्येव सुसुखान्यपि ॥ ॥ समागमश्च सखिभिर्महांश्चैव धनागमः । पुत्रेण च परिष्वङ्गः सन्निपातश्च मैथुने
    ॥ ॥ समये च प्रियालापः स्वयूथेषु च सन्नतिः । अभिप्रेतस्य लाभश्च पूजा च जनसंसदि ॥ ॥ अष्टौ गुणाः पुरुषं
    दीपयन्ति प्रज्ञा च कौल्यं च दमः श्रुतं च । पराक्रमश्चाबहुभाषिता च दानं यथाशक्ति कृतज्ञता च ॥ ॥ नवद्वारमिदं
    वेश्म त्रिस्थूणं पञ्च साक्षिकम् । क्षेत्रज्ञाधिष्ठितं विद्वान्यो वेद स परः कविः ॥ ॥ दश धर्मं न जानन्ति
    धृतराष्ट्र निबोध तान् । मत्तः प्रमत्त उन्मत्तः श्रान्तः क्रुद्धो बुभुक्षितः ॥ ॥ त्वरमाणश्च भीरुश्च
    लुब्धः कामी च ते दश । तस्मादेतेषु भावेषु न प्रसज्जेत पण्डितः ॥ ॥ अत्रैवोदाहरन्तीममितिहासं पुरातनम्
    । पुत्रार्थमसुरेन्द्रेण गीतं चैव सुधन्वना ॥ ॥ यः काममन्यू प्रजहाति राजा पात्रे प्रतिष्ठापयते धनं च
    । विशेषविच्छ्रुतवान्क्षिप्रकारी तं सर्वलोकः कुरुते प्रमाणम् ॥ ॥ जानाति विश्वासयितुं मनुष्यान् विज्ञात
    दोषेषु दधाति दण्डम् । जानाति मात्रां च तथा क्षमां च तं तादृशं श्रीर्जुषते समग्रा ॥ ॥ सुदुर्बलं नावजानाति
    कञ्चिद् युक्तो रिपुं सेवते बुद्धिपूर्वम् । न विग्रहं रोचयते बलस्थैः काले च यो विक्रमते स धीरः ॥ ॥
    प्राप्यापदं न व्यथते कदा चिद् उद्योगमन्विच्छति चाप्रमत्तः । दुःखं च काले सहते जितात्मा धुरन्धरस्तस्य
    जिताः सपत्नाः ॥ ॥ अनर्थकं विप्र वासं गृहेभ्यः पापैः सन्धिं परदाराभिमर्शम् । दम्भं स्तैन्यं पैशुनं
    मद्य पानं न सेवते यः स सुखी सदैव ॥ ॥ न संरम्भेणारभतेऽर्थवर्गम् आकारितः शंसति तथ्यमेव । न मात्रार्थे
    रोचयते विवादं नापूजितः कुप्यति चाप्यमूढः ॥ ॥ न योऽभ्यसूयत्यनुकम्पते च न दुर्बलः प्रातिभाव्यं करोति
    । नात्याह किं चित्क्षमते विवादं सर्वत्र तादृग्लभते प्रशंसाम् ॥ ॥ यो नोद्धतं कुरुते जातु वेषं न पौरुषेणापि
    विकत्थतेऽन्यान् । न मूर्च्छितः कटुकान्याह किं चित् प्रियं सदा तं कुरुते जनोऽपि ॥ ॥ न वैरमुद्दीपयति
    प्रशान्तं न दर्ममारोहति नास्तमेति । न दुर्गतोऽस्मीति करोति मन्युं तमार्य शीलं परमाहुरग्र्यम् ॥ ॥ न
    स्वे सुखे वै कुरुते प्रहर्षं नान्यस्य दुःखे भवति प्रतीतः । दत्त्वा न पश्चात्कुरुतेऽनुतापं न कत्थते
    सत्पुरुषार्य शीलः ॥ ॥ देशाचारान्समयाञ्जातिधर्मान् बुभूषते यस्तु परावरज्ञः । स तत्र तत्राधिगतः सदैव
    महाजनस्याधिपत्यं करोति ॥ ॥ दम्भं मोहं मत्सरं पापकृत्यं राजद्विष्टं पैशुनं पूगवैरम् । मत्तोन्मत्तैर्दुर्जनैश्चापि
    वादं यः प्रज्ञावान्वर्जयेत्स प्रधानः ॥ ॥ दमं शौचं दैवतं मङ्गलानि प्रायश्चित्तं विविधाँल्लोकवादान्
    । एतानि यः कुरुते नैत्यकानि तस्योत्थानं देवता राधयन्ति ॥ ॥ समैर्विवाहं कुरुते न हीनैः समैः सख्यं व्यवहारं
    कथाश्च । गुणैर्विशिष्टांश्च पुरो दधाति विपश्चितस्तस्य नयाः सुनीताः ॥ ॥ मितं भुङ्क्ते संविभज्याश्रितेभ्यो
    मितं स्वपित्यमितं कर्मकृत्वा । ददात्यमित्रेष्वपि याचितः सं स्तमात्मवन्तं प्रजहात्यनर्थाः ॥ ॥ चिकीर्षितं
    विप्रकृतं च यस्य नान्ये जनाः कर्म जानन्ति किं चित् । मन्त्रे गुप्ते सम्यगनुष्ठिते च स्वल्पो नास्य
    व्यथते कश्चिदर्थः ॥ ॥ यः सर्वभूतप्रशमे निविष्टः सत्यो मृदुर्दानकृच्छुद्ध भावः । अतीव सञ्ज्ञायते ज्ञातिमध्ये
    महामणिर्जात्य इव प्रसन्नः ॥ ॥ य आत्मनापत्रपते भृशं नरः स सर्वलोकस्य गुरुर्भवत्युत । अनन्त तेजाः सुमनाः
    समाहितः स्वतेजसा सूर्य इवावभासते ॥ ॥ वने जाताः शापदग्धस्य राज्ञः पाण्डोः पुत्राः पञ्च पञ्चेन्द्र कल्पाः
    । त्वयैव बाला वर्धिताः शिक्षिताश्च तवादेशं पालयन्त्याम्बिकेय ॥ ॥ प्रदायैषामुचितं तात राज्यं सुखी पुत्रैः
    सहितो मोदमानः । न देवानां नापि च मानुषाणां भविष्यसि त्वं तर्कणीयो नरेन्द्र ॥ ॥ ॥ इति श्रीमहाभारते
    उद्योगपर्वणि प्रजागरपर्वणि विदुरनीतिवाक्ये त्रयस्त्रिंशोऽध्यायः ॥
