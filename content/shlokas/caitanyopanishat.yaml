id: caitanyopanishat
category: upanishad
name:
  english: caitanyopanishat
  devanagari: चैतन्योपनिषत्
content:
  english: shvetarupah | caitanyatma sa vai caitanyashaktirbhaktakaro bhaktido bhaktivedyah || 6|| namo
    vedantavedyaya krishnaya paramatmane | sarvacaitanyarupaya caitanyaya namo namah || 7|| vedantavedyam
    purusham puranam caitanyatmanam vishvayonim mahantam | tameva viditva'timrityumeti nanyah pantha vidyate'yanaya
    || 8|| svanamamulamantrena sarvam hladayati vibhuh || 9|| dve shakti parame tasya hladini samvideva
    ca | iti || 10|| sa eva mulamantram japati haririti krishna iti rama iti || 11|| harati hridayagrandhim
    vasanarupamiti harih | krishih smarane tacca nantadubhayamelanamiti krishnah | ramayati sarvamiti
    rama anandarupah | atra shloko bhavati || 12|| mantro guhyah paramo bhaktivedya || 13|| namanyashtavashte
    ca shobhanani
  devanagari: श्वेतरूपः । चैतन्यात्मा स वै चैतन्यशक्तिर्भक्ताकारो भक्तिदो भक्तिवेद्यः ॥ ६॥ नमो वेदान्तवेद्याय
    कृष्णाय परमात्मने । सर्वचैतन्यरूपाय चैतन्याय नमो नमः ॥ ७॥ वेदान्तवेद्यं पुरुषं पुराणं चैतन्यात्मानं
    विश्वयोनिं महान्तम् । तमेव विदित्वाऽतिमृत्युमेति नान्यः पन्था विद्यतेऽयनाय ॥ ८॥ स्वनाममूलमन्त्रेण
    सर्वं ह्लादयति विभुः ॥ ९॥ द्वे शक्ती परमे तस्य ह्लादिनी संविदेव च । इति ॥ १०॥ स एव मूलमन्त्रं जपति
    हरिरिति कृष्ण इति राम इति ॥ ११॥ हरति हृदयग्रन्धिं वासनारूपमिति हरिः । कृषिः स्मरणे तच्च णन्तदुभयमेलनमिति
    कृष्णः । रमयति सर्वमिति राम आनन्दरूपः । अत्र श्लोको भवति ॥ १२॥ मन्त्रो गुह्यः परमो भक्तिवेद्य ॥ १३॥
    नामान्यष्टावष्टे च शोभनानि
