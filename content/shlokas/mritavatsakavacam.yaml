id: mritavatsakavacam
category: kavacha
name:
  english: mritavatsakavacam
  devanagari: मृतवत्साकवचम्
content:
  english: stribhuta damani devi bijarupa sadavatu | hrim aim shrim vaim vaim vaim vaim raksha raksha
    sarvabhutopadravebyah svaha || hrim patu kali sarvangam samso bhatarajaya svaha | hrim patu vriddharupasamatrika
    sarvatoharatu | idantu paramam guhyam sadhakabhishtadayakam | sarvarakshakarancaiva bhutapretairvisheshatah
    || anapatyaya ca ya nari mritavat sa ca ya bhavet | vahuputri jivavatsa bhavatyeva na samshayah |
    bhutapretapishacashca ye canye'nishtakarakah | duradeva palayante kavacasya ca dharanat | bhutananca
    prakritirmritavat sahara bhavet | tava dharyam prayatnena mritavatsa pranashakam | avashyam dharayet
    tasya mritavatsaduram gata | iti kubjikatantre mritavatsa kavacam nama saptadashah patalah ||
  devanagari: स्त्रीभूत दामनी देवी बीजरूपा सदावतु । ह्रीं ऐं श्रीं वैं वैं वैं वैं रक्ष रक्ष सर्वभूतोपद्रवेब्यः
    स्वाहा ॥ ह्रीं पातु काली सर्वाङ्गं संसो भटराजाय स्वाहा । ह्रीं पातु वृद्धरूपसमातृका सर्वतोहरतु । इदन्तु
    परमं गुह्यं साधकाभीष्टदायकम् । सर्वरक्षाकरञ्चैव भूतप्रेतैर्विशेषतः ॥ अनपत्यया च या नारी मृतवत् सा
    च या भवेत् । वहूपुत्री जीववत्सा भवत्येव न संशयः । भूतप्रेतपिशाचाश्च ये चान्येऽनिष्टकारकाः । दुरादेव
    पलायन्ते कवचस्य च धारणात् । भूतानाञ्च प्रकृतिर्मृतवत् साहरा भवेत् । तव धार्यं प्रयत्नेन मृतवत्सा प्रनाशकम्
    । अवश्यं धारयेत् तस्या मृतवत्सादूरं गता । इति कुब्जिकातन्त्रे मृतवत्सा कवचं नाम सप्तदशः पटलः ॥
