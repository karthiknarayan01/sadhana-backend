id: guruvina-gulaama
category: stotram
name:
  english: Guruvina Gulaama
content:
  english: guruvina gulamanaguva tanaka dòrèyadanna mukuti pari pari shastravanodidarenu vyarthavaytu
    bhakuti aru shastrava odidarilla muru puranava mugisidarilla sara nyaya kathègala kelidarilla dhiranagi
    ta pelidarilla kòralòlu malè dharisidarilla bèralòlu japamani ènisidarilla marulanagi sharirakè budi
    òrèsikòndu ta tirugidarilla nariya bhoga alisidarilla sharirika sukhava bidisidarilla naradavarada
    purandara viththalana serikòndu ta padèyuva tanaka
  devanagari: गुरुविन गुलामनागुव तनक दॊरॆयदण्ण मुकुति परि परि शास्त्रवनोदिदरेनु व्यर्थवाय्तु भकुति आरु
    शास्त्रव ओदिदरिल्ल मूरु पुराणव मुगिसिदरिल्ल सार न्याय कथॆगल केलिदरिल्ल धीरनागि ता पेलिदरिल्ल कॊरलॊलु
    मालॆ धरिसिदरिल्ल बॆरलॊलु जपमणि ऎणिसिदरिल्ल मरुलनागि शरीरकॆ बूदि ऒरॆसिकॊण्डु ता तिरुगिदरिल्ल नारिय
    भोग अलिसिदरिल्ल शारीरिक सुखव बिडिसिदरिल्ल नारदवरद पुरन्दर विठ्ठलन सेरिकॊण्डु ता पडॆयुव तनक
meaning: {}
