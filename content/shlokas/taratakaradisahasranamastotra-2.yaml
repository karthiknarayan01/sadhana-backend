  devanagari: ृणु वत्स प्रवक्ष्यामि रहस्यं सर्वसिद्धिदम् । यस्योपदेशमात्रेण तव सिद्धिर्भविष्यति ॥ २॥ महाप्रलयकालादौ
    नष्टे स्थावरजङ्गमे । महाकारं समाकर्ण्य कृपया संहृतन्तनौ ॥ ३॥ नाम्ना तेन महातारा ख्याता सा ब्रह्मरूपिणी
    । महाशूलत्रयङ्कृत्वा तत्र चैकाकिनी स्थिता ॥ ४॥ पुनः सृष्टेश्चिकीर्षाभूद्दिव्यसाम्राज्यसञ्ज्ञकम् ।
    नाम्नां सहस्रमस्यास्तु तकाराद्यं मया स्मृतम् ॥ ५॥ तत्प्रभावेण ब्रह्माण्डन्निर्मितं सुदृढं महत् । आविर्भूता
    वयन्तत्र यन्त्रैस्तस्याः पुरा द्विज ॥ ६॥ स्वस्य कार्यार्थिनस्तत्र भ्रान्ता भूम्यायथा वयम् । तयोपदिष्टाः
    कृपया भवामस्सृष्टिकारकाः ॥ ७॥ तस्याः प्रसादाद्विप्रेन्द्र त्रयो ब्रह्माण्डनायकाः । अन्ये सुरगणास्सर्वे
    तस्याः पादप्रसेवकाः ॥ ८॥ पठनाद्धारणात्सृष्टेः कर्ताहम्पालको हरिः । तत्त्वाक्षरोपदेशेन संहर्ता शङ्करस्स्वयम्
    ॥ ९॥ ऋषिच्छन्दादिकध्यानं मूलवत्परिकीर्तितम् । नियोगोमात्रसिद्धौ च पुरुषार्थचतुष्टये ॥ १०॥ तारा तारादिपञ्चार्णा
    तारान्यावेदवीर्यजा । तारातारहितावर्णा ताराद्या ताररूपिणी ॥ ११॥ तारारात्रिसमुत्पन्ना तारारात्रिवरोद्यता
    । तारारात्रिजपासक्ता तारारात्रिस्वरूपिणी ॥ १२॥ ताराराज्ञीस्वसन्तुष्टा ताराराज्ञीवरप्रदा । ताराराज्ञीस्वरूपा
    च ताराराज्ञीप्रसिद्धिदा ॥ १३॥ ताराहृत्पङ्कजागारा ताराहृत्पङ्कजापरा । ताराहृत्पङ्कजाधारा ताराहृत्पङ्कजा
    तथा ॥ १४॥ तारेश्वरी च ताराभा तारागणस्वरूपिणी । तारागणसमाकीर्णा तारागणनिषेविता ॥ १५॥ तारा तारान्विता
    तारा रत्नान्वितविभूषणा । तारागणरणासन्ना ताराकृत्यप्रपूजिता ॥ १६॥ तारागणकृताहारा तारागणकृताश्रया ।
    तारागणकृतागारा तारागणनतत्परा ॥ १७॥ तारागुणगणाकीर्णा तारागुणगणप्रदा । तारागुणगणासक्ता तारागुणगणालया
    ॥ १८॥ तारेश्वरी तारपूज्या ताराजप्या तु तारणा । तारमुख्या तु ताराख्या तारदक्षा तु तारिणी ॥ १९॥ तारागम्या
    तु तारस्था तारामृततरङ्गिणी । तारभव्या तु तारार्णा तारहव्या तु तारिणी ॥ २०॥ तारका तारकान्तस्स्था तारकाराशिभूषणा
    । तारकाहारशोभाढ्या तारकावेष्टिताङ्गणा ॥ २१॥ तारकाहंसकाकीर्णा तारकाकृतभूषणा । तारकाङ्गदशोभाङ्गी तारकाश्रितकङ्कणा
    ॥ २२॥ तारकाञ्चितकाञ्ची च तारकान्वितभक्षणा । तारकाचित्रवसना तारकासनमण्डला ॥ २३॥ तारकाकीर्णमुकुटा तारकाश्रितकुण्डला
    । तारकान्वितताटङ्कयुग्मगण्डस्थलोज्ज्वला ॥ २४॥ तारकाश्रितपादाब्जा तारकावरदायिका । तारकादत्तहृदया तारकाञ्चितसायका
    ॥ २५॥ तारकान्यासकुशला तारकान्यासविग्रहा । तारकान्याससन्तुष्टा तारकान्याससिद्धिदा ॥ २६॥ तारकान्यासनिलया
    तारकान्यासपूजिता । तारकान्याससंहृष्टा तारकान्याससिद्धिदा ॥ २७॥ तारकान्याससंमग्ना तारकान्यासवासिनी
    । तारकान्याससम्पूर्णमन्त्रसिद्धिविधायिनी ॥ २८॥ तारकोपासकप्राणा तारकोपासकप्रिया । तारकोपासकासाध्या
    तारकोपासकेष्टदा ॥ २९॥ तारकोपासकासक्ता तारकोपासकार्थिनी । तारकोपासकाराध्या तारकोपासकाश्रया ॥ ३०॥ तारकासुरसन्तुष्टा
    तारकासुरपूजिता । तारकासुरनिर्माणकर्त्री तारकवन्दिता ॥ ३१॥ तारकासुरसम्मान्या तारकासुरमानदा । तारकासुरसंसिद्धा
    तारकासुरदेवता ॥ ३२॥ तारकासुरदेहस्था तारकासुरस्वर्गदा । तारकासुरसंसृष्टा तारकासुरगर्वदा ॥ ३३॥ तारकासुरसंहन्त्री
    तारकासुरमर्दिनी । तारकासुरसङ्ग्रामनर्तकी तारकापहा ॥ ३४॥ तारकासुरसङ्ग्रामकारिणी तारकारिभृत् । तारकासुरसङ्ग्रामकबन्धवृन्दवन्दिता
    ॥ ३५॥ तारकारिप्रसूतारिकारिमाता तु कारिका । तारकारीमनोहारीवस्त्रभूषानुशासिका ॥ ३६॥ तारकारीविधात्री
    च तारकारिनिषेविता । तारकारीवचस्तुष्टा तारकारीसुशिक्षिता ॥ ३७॥ तारकारीसुसन्तुष्टा तारकारिविभूषिता ।
    तारकारिकृतोत्सङ्गी तारकारिप्रहर्षदा ॥ ३८॥ तमः सम्पूर्णसर्वाङ्गी तमोलिप्तकलेवरा । तमोव्याप्तस्थलासङ्गा
    तमः पटलसन्निभा ॥ ३९॥ तमोहन्त्री तमः कर्त्री तमःसञ्चारकारिणी । तमोगात्री तमोदात्री तमः पात्री तमोपहा
    ॥ ४०॥ तमोराशिपूर्णराशिस्तमोराशिविनाशिनी । तमोराशिकृतध्वंसी तमोराशिभयङ्करी ॥ ४१॥ तमोगुणप्रसन्नास्या
    तमोगुणसुसिद्धिदा । तमोगुणोक्तमार्गस्था तमोगुणविराजिता ॥ ४२॥ तमोगुणस्तुतिपरा तमोगुणविवर्धिनी । तमोगुणाश्रितपरा
    तमोगुणविनाशिनी ॥ ४३॥ तमोगुणाक्षयकरी तमोगुणकलेवरा । तमोगुणध्वंसतुष्टा तमः पारेप्रतिष्ठिता ॥ ४४॥ तमोभवभवप्रीता
    तमोभवभवप्रिया । तमोभवभवाश्रद्धा तमोभवभवाश्रया ॥ ४५॥ तमोभवभवप्राणा तमोभवभवार्चिता । तमोभवभवप्रीत्यालीढकुम्भस्थलस्थिता
    ॥ ४६॥ तपस्विवृन्दसन्तुष्टा तपस्विवृन्दपुष्टिदा । तपस्विवृन्दसंस्तुत्या तपस्विवृन्दवन्दिता ॥ ४७॥ तपस्विवृन्दसम्पन्ना
    तपस्विवृन्दहर्षदा । तपस्विवृन्दसम्पूज्या तपस्विवृन्दभूषिता ॥ ४८॥ तपस्विचित्ततल्पस्था तपस्विचित्तमध्यगा
    । तपस्विचित्तचित्तार्हा तपस्विचित्तहारिणी ॥ ४९॥ तपस्विकल्पवल्ल्याभा तपस्विकल्पपादपी । तपस्विकामधेनुश्च
    तपस्विकामपूर्तिदा ॥ ५०॥ तपस्वित्राणनिरता तपस्विगृहसंस्थिता । तपस्विगृहराजश्रीस्तपस्विराज्यदायिका ॥
    ५१॥ तपस्विमानसाराध्या तपस्विमानदायिका । तपस्वितापसंहर्त्री तपस्वितापशान्तिकृत् ॥ ५२॥ तपस्विसिद्धिविद्या
    च तपस्विमन्त्रसिद्धिकृत् । तपस्विमन्त्रतन्त्रेशी तपस्विमन्त्ररूपिणी ॥ ५३॥ तपस्विमन्त्रनिपुणा तपस्विकर्मकारिणी
    । तपस्विकर्मसम्भूता तपस्विकर्मसाक्षिणी ॥ ५४॥ तपस्सेव्या तपोभव्या तपोभाव्या तपस्विनी । तपोवश्या तपोगम्या
    तपोगेहनिवासिनी ॥ ५५॥ तपोधन्या तपोमान्या तपः कन्या तपोवृता । तपस्तथ्या तपोगोप्या तपोजप्या तपोनृता ॥
    ५६॥ तपस्साध्या तपोराध्या तपोवन्द्या तपोमयी । तपस्सन्ध्या तपोवन्ध्या तपस्सान्निध्यकारिणी ॥ ५७॥ तपोध्येया
    तपोगेया तपस्तप्ता तपोबला । तपोलेया तपोदेया तपस्तत्त्वफलप्रदा ॥ ५८॥ तपोविघ्नवरघ्नी च तपोविघ्नविनाशिनी
    । तपोविघ्नचयध्वंसी तपोविघ्नभयङ्करी ॥ ५९॥ तपोभूमिवरप्राणा तपोभूमिपतिस्तुता । तपोभूमिपतिध्येया तपोभूमिपतीष्टदा
    ॥ ६०॥ तपोवनकुरङ्गस्था तपोवनविनाशिनी । तपोवनगतिप्रीता तपोवनविहारिणी ॥ ६१॥ तपोवनफलासक्ता तपोवनफलप्रदा
    । तपोवनसुसाध्या च तपोवनसुसिद्धिदा ॥ ६२॥ तपोवनसुसेव्या च तपोवननिवासिनी । तपोधनसुसंसेव्या तपोधनसुसाधिता
    ॥ ६३॥ तपोधनसुसँलीना तपोधनमनोमयी । तपोधननमस्कारा तपोधनविमुक्तिदा ॥ ६४॥ तपोधनधनासाध्या तपोधनधनात्मिका
    । तपोधनधनाराध्या तपोधनफलप्रदा ॥ ६५॥ तपोधनधनाढ्या च तपोधनधनेश्वरी । तपोधनधनप्रीता तपोधनधनालया ॥ ६६॥
    तपोधनजनाकीर्णा तपोधनजनाश्रया । तपोधनजनाराध्या तपोधनजनप्रसूः ॥ ६७॥ तपोधनजनप्राणा तपोधनजनेष्टदा । तपोधनजनासाध्या
    तपोधनजनेश्वरी ॥ ६८॥ तरुणासृक्प्रपानार्ता तरुणासृक्प्रतर्पिता । तरुणासृक्समुद्रस्था तरुणासृक्प्रहर्षदा
    ॥ ६९॥ तरुणासृक्सुसन्तुष्टा तरुणासृग्विलेपिता । तरुणासृङ्नदीप्राणा तरुणासृग्विभूषणा ॥ ७०॥ तरुणैणबलिप्रीता
    तरुणैणबलिप्रिया । तरुणैणवलिप्राणा तरुणैणबलीष्टदा ॥ ७१॥ तरुणाजबलिप्रीता तरुणाजबलिप्रिया । तरुणाजबलिघ्राणा
    तरुणाजबलिप्रभुक् ॥ ७२॥ तरुणादित्यसङ्काशा तरुणादित्यविग्रहा । तरुणादित्यरुचिरा तरुणादित्यनिर्मला ॥
    ७३॥ तरुणादित्यनिलया तरुणादित्यमण्डला । तरुणादित्यललिता तरुणादित्यकुण्डला ॥ ७४॥ तरुणार्कसमज्योत्स्ना
    तरुणार्कसमप्रभा । तरुणार्कप्रतीकारा तरुणार्कप्रवर्धिता ॥ ७५॥ तरुणा तरुणानेत्रा च तरुणा तरुणलोचना ।
    तरुणा तरुणनेत्रा च तरुणा तरुणभूषणा ॥ ७६॥ तरुणीदत्तसङ्केता तरुणीदत्तभूषणा । तरुणीगणसन्तुष्टा तरुणीतरुणीमणिः
    ॥ ७७॥ तरुणीमणिसंसेव्या तरुणीमणिवन्दिता । तरुणीमणिसन्तुष्टा तरुणीमणिपूजिता ॥ ७८॥ तरुणीवृन्दसँवाद्या
    तरुणीवृन्दवन्दिता । तरुणीवृन्दसंस्तुत्या तरुणीवृन्दमानदा ॥ ७९॥ तरुणीवृन्दमध्यस्था तरुणीवृन्दवेष्टिता
    । तरुणीवृन्दसम्प्रीता तरुणीवृन्दभूषिता ॥ ८०॥ तरुणीजपसंसिद्धा तरुणीजपमोक्षदा । तरुणीपूजकासक्ता तरुणीपूजकार्थिनी
    ॥ ८१॥ तरुणीपूजकश्रीदा तरुणीपूजकार्त्तिहा । तरुणीपूजकप्राणा तरुणीनिन्दकार्त्तिदा ॥ ८२॥ तरुणीकोटिनिलया
    तरुणीकोटिविग्रहा । तरुणीकोटिमध्यस्था तरुणीकोटिवेष्टिता ॥ ८३॥ तरुणीकोटिदुस्साध्या तरुणीकोटिविग्रहा
    । तरुणीकोटिरुचिरा तरुणीतरुणीश्वरी ॥ ८४॥ तरुणीमणिहाराढ्या तरुणीमणिकुण्डला । तरुणीमणिसन्तुष्टा तरुणीमणिमण्डिता
    ॥ ८५॥ तरुणीसरणीप्रीता तरुणीसरणीरता । तरुणीसरणीस्थाना तरुणीसरणीरता ॥ ८६॥ तरणीमण्डलश्रीदा तरणीमण्डलेश्वरी
    । तरणीमण्डलश्रद्धा तरणीमण्डलस्थिता ॥ ८७॥ तरणीमण्डलार्घाढ्या तरणीमण्डलार्चिता । तरणीमण्डलध्येया तरणीभवसागरा
    ॥ ८८॥ तरणीकारणासक्ता तरणीतक्षकार्चिता । तरणीतक्षकश्रीदा तरणीतक्षकार्थिनी ॥ ८९॥ तरणीतरणशीला च तरीतरणतारिणी
    । तरीतरणसंवेद्या तरीतरणकारिणी ॥ ९०॥ तरुरूपा तरूपस्था तरुस्तरुलतामयी । तरुरूपा तरुस्था च तरुमध्यनिवासिनी
    ॥ ९१॥ तप्तकाञ्चनगेहस्था तप्तकाञ्चनभूमिका । तप्तकाञ्चनप्राकारा तप्तकाञ्चनपादुका ॥ ९२॥ तप्तकाञ्चनदीप्ताङ्गी
    तप्तकाञ्चनसन्निभा । तप्तकाञ्चनगौराङ्गी तप्तकाञ्चनमञ्चगा ॥ ९३॥ तप्तकाञ्चनवस्त्राढ्या तप्तकाञ्चनरूपिणी
    । तप्तकाञ्चनमध्यस्था तप्तकाञ्चनकारिणी ॥ ९४॥ तप्तकाञ्चनमासार्च्च्या तप्तकाञ्चनपात्रभुक् । तप्तकाञ्चनशैलस्था
    तप्तकाञ्चनकुण्डला ॥ ९५॥ तप्तकाञ्चनक्षत्त्राढ्या तप्तकाञ्चनदण्डधृक् । तप्तकाञ्चनभूषाढ्या तप्तकाञ्चनदानदा
    ॥ ९६॥ तप्तकाञ्चनदेशेशी तप्तकाञ्चनचापधृक् । तप्तकाञ्चनतूणाढ्या तप्तकाञ्चनबाणभृत् ॥ ९७॥ तलातलविधात्री
    च तलातलविधायिनी । तलातलस्वरूपेशी तलातलविहारिणी ॥ ९८॥ तलातलजनासाध्या तलातलजनेश्वरी । तलातलजनाराध्या
    तलातलजनार्थदा ॥ ९९॥ तलातलजयाभाक्षी तलातलजचञ्चला । तलातलजरत्नाढ्या तलातलजदेवता ॥ १००॥ तटिनीस्थानरसिका
    तटिनी तटवासिनी । तटिनी तटिनीतीरगामिनी तटिनीप्रिया ॥ १०१॥ तटिनीप्लवनप्रीता तटिनीप्लवनोद्यता । तटिनीप्लवनश्लाघ्या
    तटिनीप्लवनार्थदा ॥ १०२॥ तटलास्था तटस्थाना तटेशी तटवासिनी । तटपूज्या तटाराध्या तटरोममुखार्थिनी ॥ १०३॥
    तटजा तटरूपा च तटस्था तटचञ्चला । तटसन्निधिगेहस्थासहिता तटशायिनी ॥ १०४॥ तरङ्गिणी तरङ्गाभा तरङ्गायतलोचना
    । तरङ्गसमदुर्द्धर्षा तरङ्गसमचञ्चला ॥ १०५॥ तरङ्गसमदीर्घाङ्गी तरङ्गसमवर्धिता । तरङ्गसमसँवृद्धिस्तरङ्गसमनिर्मला
    ॥ १०६॥ तडागमध्यनिलया तडागमध्यासम्भवा । गडागरचनश्लाघ्या तडागरचनोद्यता ॥ १०७॥ तडागकुसुदामोदी तडागेशी
    तडागिनी । तडागनीरसंस्नाता तडागनीरनिर्मला ॥ १०८॥ तडागकमलागारा तडागकमलालया । तडागकमलान्तस्स्था तडागकमलोद्यता
    ॥ १०९॥ तडागकमलाङ्गी च तडागकमलानना । तडागकमलप्राणा तडागकमलेक्षणा ॥ ११०॥ तडागरक्तपद्मस्था तडागश्वेतपद्मगा
    । तडागनीलपद्माभा तडागनीलपद्मभृत् ॥ १११॥ तनुस्तनुगता तन्वी तन्वङ्गी तनुधारिणी । तनुरूपा तनुगता तनुधृक्
    तनुरूपिणी ॥ ११२॥ तनुस्था तनुमध्याङ्गी तनुकृत्तनुमङ्गला । तनुसेव्या तु तनुजा तनुजातनुसम्भवा ॥ ११३॥
    तनुभृत्तनुसम्भूता तनुदातनुकारिणी । तनुभृत्तनुसंहन्त्री तनुसञ्चारकारिणी ॥ ११४॥ तथ्यवाक् तथ्यवचना तथ्यकृत्
    तथ्यवादिनी । तथ्यभृत्तथ्यचरिता तथ्यधर्मानुवर्त्तिनी ॥ ११५॥ तथ्यभुक् तथ्यगमना तथ्यभक्तिवरप्रदा । तथ्यनीचेश्वरी
    तथ्यचित्ताचाराशुसिद्धिदा ॥ ११६॥ तर्क्यातर्क्यस्वभावा च तर्कदाया तु तर्ककृत् । तर्काध्यापनमध्यस्था
    तर्काध्यापनकारिणी ॥ ११७॥ तर्काध्यापनसन्तुष्टा तर्काध्यापनरूपिणी । तर्काध्यापनसंशीला तर्कार्थप्रतिपादिता
    ॥ ११८॥ तर्काध्यापनसन्तृप्ता तर्कार्थप्रतिपादिका । तर्कवादाश्रितपदा तर्कवादविवर्धिनी ॥ ११९॥ तर्कवादैकनिपुणा
    तर्कवादप्रचारिणी । तमालदलश्यामाङ्गी तमालदलमालिनी ॥ १२०॥ तमालवनसङ्केता तमालपुष्पपूजिता । तगरी तगराराध्या
    तगरार्चितपादुका ॥ १२१॥ तगरस्रक्सुसन्तुष्टा तगरस्रग्विराजिता । तगराहुतिसन्तुष्टा तगराहुतिकीर्तिदा ॥
    १२२॥ तगराहुतिसंसिद्धा तगराहुतिमानदा । तडित्तडिल्लताकारा तडिच्चञ्चललोचना ॥ १२३॥ तडिल्लता तडित्तन्वी
    तडिद्दीप्ता तडित्प्रभा । तद्रूपा तत्स्वरूपेशी तन्मयी तत्त्वरूपिणी ॥ १२४॥ तत्स्थानदाननिरता तत्कर्मफलदायिनी
    । तत्त्वकृत् तत्त्वदा तत्त्वा तत्त्ववित् तत्त्वतर्पिता ॥ १२५॥ तत्त्वार्च्च्या तत्त्वपूजा च तत्त्वार्घ्या
    तत्त्वरूपिणी । तत्त्वज्ञानप्रदानेशी तत्त्वज्ञानसुमोक्षदा ॥ १२६॥ त्वरिता त्वरितप्रीता त्वरितार्त्तिविनाशिनी
    । त्वरितासवसन्तुष्टा त्वरितासवतर्पिता ॥ १२७॥ त्वग्वस्त्रा त्वक्परीधाना तरला तरलेक्षणा । तरक्षुचर्मवसना
    तरक्षुत्वग्विभूषणा ॥ १२८॥ तरक्षुस्तरक्षुप्राणा तरक्षुपृष्ठगामिनी । तरक्षुपृष्ठसंस्थाना तरक्षुपृष्ठवासिनी
    ॥ १२९॥ तर्पितोदैस्तर्पणाशा तर्पणासक्तमानसा । तर्पणानन्दहृदया तर्पणाधिपतिस्ततिः ॥ १३०॥ त्रयीमयी त्रयीसेव्या
    त्रयीपूज्या त्रयीकथा । त्रयीभव्या त्रयीभाव्या त्रयीभाव्या त्रयीयुता ॥ १३१॥ त्र्यक्षरी त्र्यक्षरेशानी
    त्र्यक्षरीशीघ्रसिद्धिदा । त्र्यक्षरेशी त्र्यक्षरीस्था त्र्यक्षरीपुरुषापदा ॥ १३२॥ तपना तपनेष्टा च तपस्तपनकन्यका
    । तपनांशुसमासह्या तपनकोटिकान्तिकृत् ॥ १३३॥ तपनीया तल्पतल्पगता तल्पविधायिनी । तल्पकृत्तल्पगा तल्पदात्री
    तल्पतलाश्रया ॥ १३४॥ तपनीयतलारात्री तपनीयांशुप्रार्थिनी । तपनीयप्रदातप्ता तपनीयाद्रिसंस्थिता ॥ १३५॥
    तल्पेशी तल्पदा तल्पसंस्थिता तल्पवल्लभा । तल्पप्रिया तल्परता तल्पनिर्माणकारिणी ॥ १३६॥ तरसापूजनासक्ता
    तरसावरदायिनी । तरसासिद्धिसन्धात्री तरसामोक्षदायिनी ॥ १३७॥ तापसी तापसाराध्या तापसार्त्तिविनाशनी । तापसार्त्ता
    तापसश्रीस्तापसप्रियवादिनी ॥ १३८॥ तापसानन्दहृदया तापसानन्ददायिनी । तापसाश्रितपादाब्जा तापसक्तमानसा
    ॥ १३९॥ तामसी तामसीपूज्या तामसीप्रणयोत्सुका । तामसी तामसीसीता तामसीशीघ्रसिद्धिदा ॥ १४०॥ तालेशी तालभुक्तालदात्री
    तालोपमस्तनी । तालवृक्षस्थिता तालवृक्षजा तालरूपिणी ॥ १४१॥ तार्क्ष्या तार्क्ष्यसमारूढा तार्क्ष्येशी
    तार्क्ष्यपूजिता । तार्क्ष्येश्वरी तार्क्ष्यमाता तार्क्ष्येशीवरदायिनी ॥ १४२॥ तापी तु तपिनी तापसंहन्त्री
    तापनाशिनी । तापदात्री तापकर्त्री तापविध्वंसकारिणी ॥ १४३॥ त्रासकर्त्री त्रासदात्री त्रासहर्त्री च त्रासहा
    । त्रासिता त्रासरहिता त्रासनिर्मूलकारिणी ॥ १४४॥ त्राणकृत्त्राणसंशीला तानेशी तानदायिनी । तानगानरता
    तानकारिणी तानगायिनी ॥ १४५॥ तारुण्यामृतसम्पूर्णा तारुण्यामृतवारिधिः । तारुण्यामृतसन्तुष्टा तारुण्यामृततर्पिता
    ॥ १४६॥ तारुण्यामृतपूर्णाङ्गी तारुण्यामृतविग्रहा । तारुण्यगुणसम्पन्ना तारुण्योक्तिविशारदा ॥ १४७॥ ताम्बूली
    ताम्बुलेशानी ताम्बूलचर्वणोद्यता । ताम्बूलपूरितास्या च ताम्बूलारुणिताधरा ॥ १४८॥ ताटङ्करत्नविख्यातिस्ताटङ्करत्नभूषिणी
    । ताटङ्करत्नमध्यस्था ताटङ्कद्वयभूषिता ॥ १४९॥ तिथीशा तिथिसम्पूज्या तिथिस्था तिथिरूपिणी । त्रितिथिवासिनीसेव्या
    तिथीशवरदायिनी ॥ १५०॥ तिलोत्तमादिकाराध्या तिलोत्तमादिकप्रभा । तिलोत्तमा तिलप्रक्षा तिलाराध्या तिलार्च्चिता
    ॥ १५१॥ प्। १४४
