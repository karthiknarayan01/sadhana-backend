id: nityakavacamtantraraja
category: kavacha
name:
  english: nityakavacamtantraraja
  devanagari: नित्याकवचम्तन्त्रराज
content:
  english: rinu tat kavacam devi vakshye tava tadatmakam | yenahamapi yuddheshu devasurajayi sada || 5||
    sarvatah sarvadatmanam lalita patu sarvaga | kameshi puratah patu bhagamala tvanantaram || 6|| disham
    patu tatha dakshaparshvam me patu sarvada | nityaklinna ca bherunda disham patu sada mama || 7|| tathaiva
    pashcimam bhagam rakshet sa vahnivasini | mahavajreshvari rakshedanantaradisham sada || 8|| vamaparshvam
    sada patu duti me tvarita tatah | palayettu disham canyam rakshenmam kulasundari || 9|| nitya mamurddhvatah
    patu sadho me patu sarvada | nitya nilapatakakhya vijaya sarvatashca mam || 10|| karotu me mangalani
    sarvada sarvamangala | dehendriyamanahpranan jvalamalinivigraha || 11|| palayedanisham citra cittam
    me patu sarvada | kamat krodhattatha lobhanmohanmananmadadapi || 12|| papanmatsaratah shokat samshayat
    sarvatah sada | staimityacca samudyogadashubheshu tu karmasu || 13|| asatyakruracintato himsatashcauryatastatha
    | rakshantu mam sarvada tah kurvantviccham shubheshu ca || 14|| nityah shodasha mam pantu gajarudhah
    svashaktibhih | tatha hayasamarudhah pantu mam sarvatah sada || 15|| simharudhastatha pantu mantarakshagata
    api | ratharudhashca mam pantu sarvatah sarvada rane || 16|| tarkshyarudhashca mam pantu tatha vyomagatastatha
    | bhugatah sarvada pantu manca sarvatra sarvada || 17|| bhutapretapishacapasmarakrityadikan gadan
    | dravayantu svashaktinam bhishanairayudhairmama || 18|| gajashvadvipipancasyatarkshyarudhakhilayudhah
    | asamkhyah shaktayo devyah pantu mam sarvatah sada || 19|| sayam pratarjapannityakavacam sarvarakshakam
    | kadacinnashubham pashyenna sha
  devanagari: ृणु तत् कवचं देवि वक्ष्ये तव तदात्मकम् । येनाहमपि युद्धेषु देवासुरजयी सदा ॥ ५॥ सर्वतः सर्वदात्मानं
    ललिता पातु सर्वगा । कामेशी पुरतः पातु भगमाला त्वनन्तरम् ॥ ६॥ दिशं पातु तथा दक्षपार्श्वं मे पातु सर्वदा
    । नित्यक्लिन्ना च भेरुण्डा दिशं पातु सदा मम ॥ ७॥ तथैव पश्चिमं भागं रक्षेत् सा वह्निवासिनी । महावज्रेश्वरी
    रक्षेदनन्तरदिशं सदा ॥ ८॥ वामपार्श्वं सदा पातु दूती मे त्वरिता ततः । पालयेत्तु दिशं चान्यां रक्षेन्मां
    कुलसुन्दरी ॥ ९॥ नित्या मामूर्द्ध्वतः पातु साधो मे पातु सर्वदा । नित्या नीलपताकाख्या विजया सर्वतश्च
    माम् ॥ १०॥ करोतु मे मङ्गलानि सर्वदा सर्वमङ्गला । देहेन्द्रियमनःप्राणान् ज्वालामालिनिविग्रहा ॥ ११॥
    पालयेदनिशं चित्रा चित्तं मे पातु सर्वदा । कामात् क्रोधात्तथा लोभान्मोहान्मानान्मदादपि ॥ १२॥ पापान्मत्सरतः
    शोकात् संशयात् सर्वतः सदा । स्तैमित्याच्च समुद्योगादशुभेषु तु कर्मसु ॥ १३॥ असत्यक्रूरचिन्तातो हिंसातश्चौर्यतस्तथा
    । रक्षन्तु मां सर्वदा ताः कुर्वन्त्विच्छां शुभेषु च ॥ १४॥ नित्याः षोडश मां पान्तु गजारूढाः स्वशक्तिभिः
    । तथा हयसमारूढाः पान्तु मां सर्वतः सदा ॥ १५॥ सिंहारूढास्तथा पान्तु मान्तरक्षगता अपि । रथारूढाश्च मां
    पान्तु सर्वतः सर्वदा रणे ॥ १६॥ तार्क्ष्यारूढाश्च मां पान्तु तथा व्योमगतास्तथा । भूगताः सर्वदा पान्तु
    माञ्च सर्वत्र सर्वदा ॥ १७॥ भूतप्रेतपिशाचापस्मारकृत्यादिकान् गदान् । द्रावयन्तु स्वशक्तीनां भीषणैरायुधैर्मम
    ॥ १८॥ गजाश्वद्वीपिपञ्चास्यतार्क्ष्यरूढाखिलायुधाः । असंख्याः शक्तयो देव्याः पान्तु मां सर्वतः सदा ॥
    १९॥ सायं प्रातर्जपन्नित्याकवचं सर्वरक्षकम् । कदाचिन्नाशुभं पश्येन्न श
