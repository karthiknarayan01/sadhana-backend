id: advayatarakopanishat
category: upanishad
name:
  english: advayatarakopanishat
  devanagari: अद्वयतारकोपनिषत्
content:
  english: prakritayoge purnamanovilayabhavena drishyamanajyotishah pratyagatmasvarupatvanirnayah idam
    jyotih tvampadarthah ahosvit tatpadarthah iti samshiyate | kutah samshayah tvampadarthavivecana iti
    saccidanandasvarupam brahmaiveti ca uktatvat | atrocyate | tvampadarthah pratyagatmaiva | brahmamshatvattu
    brahmatvamupacaryate sakshadbrahmayogo hi manoviyuktabhyasarupah | tatraiva manonashasambhavat | manoyuktabhyasastu
    prakritah kantharavoktah | manassahakaricakshusha vedyam bhavatiti ca | yadi manasaiva vedyamityuktam
    tada antardrishteh mano'nanyatvat manasah brahmani vilayasambhavacca akhandabrahmayoga eva vivakshitah
    iti vaktum shakyam | na tu tadasti | pratyagatmayoge ca antare bahyavat atmamanashcakshussamyogenaiva
    rupagrahanakaryodayah syat | na tu brahmayoge tadiyakhandasamyagdarshanam cakshuradhinam mano'dinam
    va bhavati | cakshurmanasi prishthatah kritva svayamprakashamanatvat | nanu manoyuktantardrishtirityuktatvat
    manasah antardrishtidvara brahmani vilaya eva arthadavagamyate iti cetra | bahyavadityuktatvena prakritayoge
    manovilayasambhavat | tatkalikastu manolayah sushuptasyeva natyanta shladhyatamo bhavitumarhati |
    yadva kramamuktisadhanibhuto'pi sa manolayah punarjanmabijabharjanabhavat na nashaparaparyayah ityavagantavyam
    ||
  devanagari: प्रकृतयोगे पूर्णमनोविलयाभावेन दृश्यमानज्योतिषः प्रत्यगात्मस्वरूपत्वनिर्णयः इदं ज्योतिः त्वंपदार्थः
    आहोस्वित् तत्पदार्थः इति संशीयते । कुतः संशयः त्वंपदार्थविवेचन इति सच्चिदानन्दस्वरूपं ब्रह्मैवेति
    च उक्तत्वात् । अत्रोच्यते । त्वंपदार्थः प्रत्यगात्मैव । ब्रह्मांशत्वात्तु ब्रह्मत्वमुपचर्यते साक्षाद्ब्रह्मयोगो
    हि मनोवियुक्ताभ्यासरूपः । तत्रैव मनोनाशसम्भवात् । मनोयुक्ताभ्यासस्तु प्रकृतः कण्ठरवोक्तः । मनस्सहकारिचक्षुषा
    वेद्यं भवतीति च । यदि मनसैव वेद्यमित्युक्तं तदा अन्तर्दृष्टेः मनोऽनन्यत्वात् मनसः ब्रह्मणि विलयसम्भवाच्च
    अखण्डब्रह्मयोग एव विवक्षितः इति वक्तुं शक्यं । न तु तदस्ति । प्रत्यगात्मयोगे च आन्तरे बाह्यवत् आत्ममनश्चक्षुस्संयोगेनैव
    रूपग्रहणकार्योदयः स्यात् । न तु ब्रह्मयोगे तदीयाखण्डसम्यग्दर्शनं चक्षुरधीनं मनोऽदीनं वा भवति । चक्षुर्मनसी
    पृष्ठतः कृत्वा स्वयंप्रकशमानत्वात् । ननु मनोयुक्तान्तर्दृष्टिरित्युक्तत्वात् मनसः अन्तर्दृष्टिद्वारा
    ब्रह्मणि विलय एव अर्थादवगम्यते इति चेत्र । बह्यवदित्युक्तत्वेन प्रकृतयोगे मनोविलयासम्भवात् । तात्कालिकस्तु
    मनोलयः सुषुप्तस्येव नात्यन्त श्लाध्यतमो भवितुमर्हति । यद्वा क्रममुक्तिसाधनीभूतोऽपि स मनोलयः पुनर्जन्मबीजभर्जनाभावात्
    न नाशापरपर्यायः इत्यवगन्तव्यं ॥
