id: kamakshistotram-5
category: stotram
name:
  english: kamakshistotram 5
  devanagari: कामाक्षीस्तोत्रम् ५
content:
  english: shrikamakshistotram mangala carane mangala vadane mangaladayini kamakshi | guru guha janani
    kuru kalyanam kunjari janani kamakshi || 1|| kashta nivarini ishta vidayini dushta vinashini kamakshi
    | guru guha janani kuru kalyanam kunjari janani kamakshi || 2|| himagiritanaye mama hridinilaye sajjanasadaye
    kamakshi | guru guha janani kuru kalyanam kunjari janani kamakshi || 3|| grahanuta carane grihasutadayini
    nava nava bhavate kamakshi | guru guha janani kuru kalyanam kunjari janani kamakshi || 4|| shivamukha
    vinute bhavasukhadayini nava nava bhavate kamakshi | guru guha janani kuru kalyanam kunjari janani
    kamakshi || 5|| bhakta sumanasa tapa vinashini mangaladayini kamakshi | guru guha janani kuru kalyanam
    kunjari janani kamakshi || 6|| kenopanishad vakya vinodini devi parashakti kamakshi guru guha janani
    kuru kalyanam kunjari janani kamakshi || 7|| parashiva jaye varamuni bhavye akhilandeshvari kamakshi
    | guru guha janani kuru kalyanam kunjari janani kamakshi || 8|| haridra mandalavasini nitya mangaladayini
    kamakshi | guru guha janani kuru kalyanam kunjari janani kamakshi || 9|| iti shri jagadguru candrashekharasarasvativiracitam
    kamakshistotram sampurnam |
  devanagari: श्रीकामाक्षीस्तोत्रम् मङ्गल चरणे मङ्गल वदने मङ्गलदायिनी कामाक्षी । गुरु गुह जननी कुरु कल्याणं
    कुञ्जरी जननी कामाक्षी ॥ १॥ कष्ट निवारिणी इष्ट विदायिनी दुष्ट विनाशिनी कामाक्षी । गुरु गुह जननी कुरु
    कल्याणं कुञ्जरी जननी कामाक्षी ॥ २॥ हिमगिरितनये मम हृदिनिलये सज्जनसदये कामाक्षी । गुरु गुह जननी कुरु
    कल्याणं कुञ्जरी जननी कामाक्षी ॥ ३॥ ग्रहनुत चरणे गृहसुतदायिनी नव नव भवते कामाक्षी । गुरु गुह जननी कुरु
    कल्याणं कुञ्जरी जननी कामाक्षी ॥ ४॥ शिवमुख विनुते भवसुखदायिनी नव नव भवते कामाक्षी । गुरु गुह जननी कुरु
    कल्याणं कुञ्जरी जननी कामाक्षी ॥ ५॥ भक्त सुमानस ताप विनाशिनी मङ्गलदायिनी कामाक्षी । गुरु गुह जननी कुरु
    कल्याणं कुञ्जरी जननी कामाक्षी ॥ ६॥ केनोपनिषद् वाक्य विनोदिनी देवी पराशक्ति कामाक्षी गुरु गुह जननी
    कुरु कल्याणं कुञ्जरी जननी कामाक्षी ॥ ७॥ परशिव जाये वरमुनि भाव्ये अखिलाण्डेश्वरी कामाक्षी । गुरु गुह
    जननी कुरु कल्याणं कुञ्जरी जननी कामाक्षी ॥ ८॥ हरिद्रा मण्डलवासिनी नित्य मङ्गलदायिनी कामाक्षी । गुरु
    गुह जननी कुरु कल्याणं कुञ्जरी जननी कामाक्षी ॥ ९॥ इति श्री जगद्गुरु चन्द्रशेखरसरस्वतीविरचितं कामाक्षीस्तोत्रं
    सम्पूर्णम् ।
