id: mushikavahanashatanamastotram
category: stotram
name:
  english: mushikavahanashatanamastotram
  devanagari: मूषिकवाहनशतनामस्तोत्रम्
content:
  english: mushikavahanashatanamastotram mushikavahana modakahasta camarakarna vilambitasutra | vamanarupa
    maheshvaraputra vighnavinayakapada namaste || 1|| devadevasutam devam jagadvighnavinashakam | hastirupam
    mahakayam suryakotisamaprabham || 2|| vamanam jatilam kantam hrasvagrivam mahodaram | dhumrasindurayuggandam
    vikatam prakatotkatam || 3|| ekadantam pralamboshtham nagayajnopavitinam | tryaksham gajamukham krishnam
    sukritam raktavasasam || 4|| dantapanim ca varadam brahmanyam brahmacarinam | punyam ganapatim divyam
    vighnarajam namamyaham || 5|| devam ganapatim natham vishvasyagre tu gaminam | devanamadhikam shreshtham
    nayakam suvinayakam || 6|| namami bhagavantam tam adbhutam gananayakam | vakratunda pracandaya ugratundaya
    te namah || 7|| candaya guru candaya candacandaya te namah | madonmattapramattaya nityamattaya te
    namah || 8|| umasutam namasyami gangaputraya te namah | onkaraya vashatkara svahakaraya te namah ||
    9|| mantramurte mahayogin jatavedo namo namah | parshupashakahastaya gajahastaya te namah || 10||
    meghaya meghavarnaya megheshvara namo namah | ghoraya ghorarupaya ghoraghoraya te namah || 11|| purana
    purvapujyaya purushaya namo namah | madotkata namaste'stu namaste candavikrama || 12|| vinayaka namaste'stu
    namaste bhaktavatsala | bhaktapriyaya shantaya mahatejasvine namah || 13|| yajnaya yajnahotre ca yajneshaya
    namo namah | namaste shukla bhasmanga shuklamalyadharaya ca || 14|| madaklinna kapolaya ganadhipataye
    namah | raktapushpapriyayatha raktacandanabhushita || 15|| agnihotraya shantaya aparajayya te namah
    | akhuvahana devesha ekadantaya te namah || 16|| shurpakarnaya shuraya dirghadantaya te namah | vighnam
    haratu deveshah shivaputro vinayakah || 17|| iti mushikavahasya stotram sarvarthasadhakam | sarvamangalamangalyam
    sarvapapapranashanam | sarvakamapradam pumsam pathatam sha
  devanagari: मूषिकवाहनशतनामस्तोत्रम् मूषिकवाहन मोदकहस्त चामरकर्ण विलम्बितसूत्र । वामनरूप महेश्वरपुत्र
    विघ्नविनायकपाद नमस्ते ॥ १॥ देवदेवसुतं देवं जगद्विघ्नविनाशकम् । हस्तिरूपं महाकायं सूर्यकोटिसमप्रभम्
    ॥ २॥ वामनं जटिलं कान्तं ह्रस्वग्रीवं महोदरम् । धूम्रसिन्दूरयुग्गण्डं विकटं प्रकटोत्कटम् ॥ ३॥ एकदन्तं
    प्रलम्बोष्ठं नागयज्ञोपवीतिनम् । त्र्यक्षं गजमुखं कृष्णं सुकृतं रक्तवाससम् ॥ ४॥ दन्तपाणिं च वरदं ब्रह्मण्यं
    ब्रह्मचारिणम् । पुण्यं गणपतिं दिव्यं विघ्नराजं नमाम्यहम् ॥ ५॥ देवं गणपतिं नाथं विश्वस्याग्रे तु गामिनम्
    । देवानामधिकं श्रेष्ठं नायकं सुविनायकम् ॥ ६॥ नमामि भगवन्तं तं अद्भुतं गणनायकम् । वक्रतुण्ड प्रचण्डाय
    उग्रतुण्डाय ते नमः ॥ ७॥ चण्डाय गुरु चण्डाय चण्डचण्डाय ते नमः । मदोन्मत्तप्रमत्ताय नित्यमत्ताय ते नमः
    ॥ ८॥ उमासुतं नमस्यामि गङ्गापुत्राय ते नमः । ओङ्काराय वषट्कार स्वाहाकाराय ते नमः ॥ ९॥ मन्त्रमूर्ते
    महायोगिन् जातवेदो नमो नमः । पर्शुपाशकहस्ताय गजहस्ताय ते नमः ॥ १०॥ मेघाय मेघवर्णाय मेघेश्वर नमो नमः
    । घोराय घोररूपाय घोरघोराय ते नमः ॥ ११॥ पुराण पूर्वपूज्याय पुरुषाय नमो नमः । मदोत्कट नमस्तेऽस्तु नमस्ते
    चण्डविक्रम ॥ १२॥ विनायक नमस्तेऽस्तु नमस्ते भक्तवत्सल । भक्तप्रियाय शान्ताय महातेजस्विने नमः ॥ १३॥
    यज्ञाय यज्ञहोत्रे च यज्ञेशाय नमो नमः । नमस्ते शुक्ल भस्माङ्ग शुक्लमाल्यधराय च ॥ १४॥ मदक्लिन्न कपोलाय
    गणाधिपतये नमः । रक्तपुष्पप्रियायाथ रक्तचन्दनभूषित ॥ १५॥ अग्निहोत्राय शान्ताय अपराजय्य ते नमः । आखुवाहन
    देवेश एकदन्ताय ते नमः ॥ १६॥ शूर्पकर्णाय शूराय दीर्घदन्ताय ते नमः । विघ्नं हरतु देवेशः शिवपुत्रो विनायकः
    ॥ १७॥ इति मूषिकवाहस्य स्तोत्रं सर्वार्थसाधकम् । सर्वमङ्गलमाङ्गल्यं सर्वपापप्रणाशनम् । सर्वकामप्रदं
    पुंसां पठतां श
