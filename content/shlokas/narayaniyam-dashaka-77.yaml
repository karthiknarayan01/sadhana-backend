id: narayaniyam-dashaka-77
category: stotram
name:
  english: Narayaniyam Dashaka 77
content:
  english: sairandhryastadanu ciram smaraturaya yato'bhuh sulalitamuddhavena sardham | avasam tvadupagamotsavam
    sadaiva dhyayantyah pratidinavasasajjikayah || || upagate tvayi purnamanoratham pramadasambhramakamprapayodharam
    | vividhamananamadadhatim muda rahasi tam ramayancakrishe sukham || || prishta varam punarasavavrinodvaraki
    bhuyastvaya suratameva nishantareshu | sayujyamastviti vadet budha eva kamam samipyamastvanishamityapi
    nabravit kim || || tato bhavan deva nishasu kasucinmrigidrisham tam nibhritam vinodayan | adadupashloka
    iti shrutam sutam sa naradat sattvatatantravidbababhau || || akruramandiramito'tha baloddhavabhya
    mabhyarcito bahu nuto muditena tena | enam visrijya vipinagatapandaveya vrittam viveditha tatha dhritarashtrceshtam
    || || vighatajjamatuh paramasuhrido bhojanripate rjarasandhe rundhatyanavadhirushandhe'tha mathuram
    | rathadyairdyorlabdhaih katipayabalastvam balayuta strayovimshatyakshauhini tadupanitam samahrithah
    || || baddham baladatha balena balottaram tvam bhuyo balodyamarasena mumocithainam | nishsheshadigjayasamahritavishvasainyat
    ko'nyastato hi balapaurushavamstadanim || || bhagnah sa lagnahridayo'pi nripaih pranunno yuddham tvaya
    vyadhita shodashakritva evam | akshauhinih shiva shivasya jaghantha vishno sambhuya saikanavatitrishatam
    tadanim || || ashtadashe'sya samare samupeyushi tvam drishtva puro'tha yavanam yavanatrikotya | tvashtra
    vidhapya puramashu payodhimadhye tatra'tha yogabalatah svajanananaishih || || padabhyam tvam padmamali
    cakita iva purannirgato dhavamano mleccheshenanuyato vadhasukritavihinena shaile nyalaishih | suptenanghryahatena
    drutamatha mucukundena bhasmikrite'smin bhupayasmai guhante sulalitavapusha tasthishe bhaktibhaje
    || || aikshvako'ham virakto'smyakhilanripasukhe tvatprasadaikakankshi ha deveti stuvantam varavitatishu
    tam nispriham vikshya hrishyan | muktestulyam ca bhaktim dhutasakalamalam mokshamapyashu datva karyam
    himsavishuddhyai tapa iti ca tada prattha lokapratityai || || tadanu mathuram gatva hatva camum yavanahritam
    magadhapatina marge sainyaih pureva nivaritah | caramavijayam darpayasmai pradaya palayito jaladhinagarim
    yato vatalayeshvara pahi mam ||
  devanagari: सैरन्ध्र्यास्तदनु चिरं स्मरातुराया यातोऽभूः सुललितमुद्धवेन सार्धम् । आवासं त्वदुपगमोत्सवं
    सदैव ध्यायन्त्याः प्रतिदिनवाससज्जिकायाः ॥ ॥ उपगते त्वयि पूर्णमनोरथां प्रमदसम्भ्रमकम्प्रपयोधराम् ।
    विविधमाननमादधतीं मुदा रहसि तां रमयाञ्चकृषे सुखम् ॥ ॥ पृष्टा वरं पुनरसाववृणोद्वराकी भूयस्त्वया सुरतमेव
    निशान्तरेषु । सायुज्यमस्त्विति वदेत् बुध एव कामं सामीप्यमस्त्वनिशमित्यपि नाब्रवीत् किम् ॥ ॥ ततो भवान्
    देव निशासु कासुचिन्मृगीदृशं तां निभृतं विनोदयन् । अदादुपश्लोक इति श्रुतं सुतं स नारदात् सात्त्वततन्त्रविद्बबभौ
    ॥ ॥ अक्रूरमन्दिरमितोऽथ बलोद्धवाभ्या मभ्यर्चितो बहु नुतो मुदितेन तेन । एनं विसृज्य विपिनागतपाण्डवेय
    वृत्तं विवेदिथ तथा धृतराष्ट्र्चेष्टाम् ॥ ॥ विघाताज्जामातुः परमसुहृदो भोजनृपते र्जरासन्धे रुन्धत्यनवधिरुषान्धेऽथ
    मथुराम् । रथाद्यैर्द्योर्लब्धैः कतिपयबलस्त्वं बलयुत स्त्रयोविंशत्यक्षौहिणि तदुपनीतं समहृथाः ॥ ॥ बद्धं
    बलादथ बलेन बलोत्तरं त्वं भूयो बलोद्यमरसेन मुमोचिथैनम् । निश्शेषदिग्जयसमाहृतविश्वसैन्यात् कोऽन्यस्ततो
    हि बलपौरुषवांस्तदानीम् ॥ ॥ भग्नः स लग्नहृदयोऽपि नृपैः प्रणुन्नो युद्धं त्वया व्यधित षोडशकृत्व एवम्
    । अक्षौहिणीः शिव शिवास्य जघन्थ विष्णो सम्भूय सैकनवतित्रिशतं तदानीम् ॥ ॥ अष्टादशेऽस्य समरे समुपेयुषि
    त्वं दृष्ट्वा पुरोऽथ यवनं यवनत्रिकोट्या । त्वष्ट्रा विधाप्य पुरमाशु पयोधिमध्ये तत्राऽथ योगबलतः स्वजनाननैषीः
    ॥ ॥ पदभ्यां त्वां पद्ममाली चकित इव पुरान्निर्गतो धावमानो म्लेच्छेशेनानुयातो वधसुकृतविहीनेन शैले न्यलैषीः
    । सुप्तेनाङ्घ्र्याहतेन द्रुतमथ मुचुकुन्देन भस्मीकृतेऽस्मिन् भूपायास्मै गुहान्ते सुललितवपुषा तस्थिषे
    भक्तिभाजे ॥ ॥ ऐक्ष्वाकोऽहं विरक्तोऽस्म्यखिलनृपसुखे त्वत्प्रसादैककाङ्क्षी हा देवेति स्तुवन्तं वरविततिषु
    तं निस्पृहं वीक्ष्य हृष्यन् । मुक्तेस्तुल्यां च भक्तिं धुतसकलमलां मोक्षमप्याशु दत्वा कार्यं हिंसाविशुद्ध्यै
    तप इति च तदा प्रात्थ लोकप्रतीत्यै ॥ ॥ तदनु मथुरां गत्वा हत्वा चमूं यवनाहृतां मगधपतिना मार्गे सैन्यैः
    पुरेव निवारितः । चरमविजयं दर्पायास्मै प्रदाय पलायितो जलधिनगरीं यातो वातालयेश्वर पाहि माम् ॥
