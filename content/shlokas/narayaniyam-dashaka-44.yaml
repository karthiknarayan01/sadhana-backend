id: narayaniyam-dashaka-44
category: stotram
name:
  english: Narayaniyam Dashaka 44
content:
  english: gudham vasudevagira kartum te nishkriyasya samskaran | hridgatahoratattvo gargamunistvat griham
    vibho gatavan || || nando'tha nanditatma vrindishtam manayannamum yaminam | mandasmitardramuce tvatsamskaran
    vidhatumutsukadhih || || yaduvamshacaryatvat sunibhritamidamarya karyamiti kathayan | gargo nirgatapulakashcakre
    tava sagrajasya namani || || kathamasya nama kurve sahasranamno hyanantanamno va | iti nunam gargamunishcakre
    tava nama nama rahasi vibho || || krishidhatunakarabhyam sattanandatmatam kilabhilapat | jagadaghakarshitvam
    va kathayadrishih krishnanama te vyatanot || || anyamshca namabhedan vyakurvannagraje ca ramadin |
    atimanushanubhavam nyagadattvamaprakashayan pitre || || snihyati yastava putre muhyati sa na mayikaih
    punah shokaih | druhyati yah sa tu nashyedityavadatte mahattvamrishivaryah || || jeshyati bahutaradaityan
    neshyati nijabandhulokamamalapadam | shroshyasi suvimalakirtirasyeti bhavadvibhutimrishiruce || ||
    amunaiva sarvadurgam taritastha kritasthamatra tishthadhvam | harirevetyanabhilapannityadi tvamavarnayat
    sa munih || || garge'tha nirgate'smin nanditanandadinandyamanastvam | madgadamudgatakaruno nirgamaya
    shrimarutpuradhisha ||
  devanagari: गूढं वसुदेवगिरा कर्तुं ते निष्क्रियस्य संस्कारान् । हृद्गतहोरातत्त्वो गर्गमुनिस्त्वत् गृहं
    विभो गतवान् ॥ ॥ नन्दोऽथ नन्दितात्मा वृन्दिष्टं मानयन्नमुं यमिनाम् । मन्दस्मितार्द्रमूचे त्वत्संस्कारान्
    विधातुमुत्सुकधीः ॥ ॥ यदुवंशाचार्यत्वात् सुनिभृतमिदमार्य कार्यमिति कथयन् । गर्गो निर्गतपुलकश्चक्रे
    तव साग्रजस्य नामानि ॥ ॥ कथमस्य नाम कुर्वे सहस्रनाम्नो ह्यनन्तनाम्नो वा । इति नूनं गर्गमुनिश्चक्रे
    तव नाम नाम रहसि विभो ॥ ॥ कृषिधातुणकाराभ्यां सत्तानन्दात्मतां किलाभिलपत् । जगदघकर्षित्वं वा कथयदृषिः
    कृष्णनाम ते व्यतनोत् ॥ ॥ अन्यांश्च नामभेदान् व्याकुर्वन्नग्रजे च रामादीन् । अतिमानुषानुभावं न्यगदत्त्वामप्रकाशयन्
    पित्रे ॥ ॥ स्निह्यति यस्तव पुत्रे मुह्यति स न मायिकैः पुनः शोकैः । द्रुह्यति यः स तु नश्येदित्यवदत्ते
    महत्त्वमृषिवर्यः ॥ ॥ जेष्यति बहुतरदैत्यान् नेष्यति निजबन्धुलोकममलपदम् । श्रोष्यसि सुविमलकीर्तीरस्येति
    भवद्विभूतिमृषिरूचे ॥ ॥ अमुनैव सर्वदुर्गं तरितास्थ कृतास्थमत्र तिष्ठध्वम् । हरिरेवेत्यनभिलपन्नित्यादि
    त्वामवर्णयत् स मुनिः ॥ ॥ गर्गेऽथ निर्गतेऽस्मिन् नन्दितनन्दादिनन्द्यमानस्त्वम् । मद्गदमुद्गतकरुणो निर्गमय
    श्रीमरुत्पुराधीश ॥
