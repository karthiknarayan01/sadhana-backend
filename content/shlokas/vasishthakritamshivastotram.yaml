id: vasishthakritamshivastotram
category: stotram
name:
  english: vasishthakritamshivastotram
  devanagari: वसिष्ठकृतंशिवस्तोत्रम्
content:
  english: vasishthakritam shivastotram namah shivaya shuddhaya sarvagaya'mritaya ca | kaparddine namastubhyam
    namastasmai trimurttaye || 6|| namah sthulaya sukshmaya vyapakaya mahatmane | nishangine namastubhyam
    trinetraya namo namah || 7|| namashcandrakaladhara namo digvasanaya ca | pinakapanaye tubhyamashtamurte
    namo namah || 8|| namaste jnanarupaya jnanagamyaya te namah | namaste jnanadehaya sarvajnanamayaya
    ca || 9|| kashipate namastubhyam girishaya namo namah | jagatkaranarupaya mahadevaya te namah || 10||
    gaurikanta namastubhyam namastubhyam shivatmane | brahmavishnusvarupaya trinetraya namo namah || 11||
    vishvarupaya shuddhaya namastubhyam mahatmane | namo vishvasvarupaya sarvadevamayaya ca || 12|| iti
    shriskandapurane prabhasakhande arbudakhande caturthadhyayantargatam vasishthakritam shivastotram
    samaptam | skandapurana | prabhasakhanda | arbudakhanda | adhyaya 4
  devanagari: वसिष्ठकृतं शिवस्तोत्रम् नमः शिवाय शुद्धाय सर्वगायाऽमृताय च । कपर्द्दिने नमस्तुभ्यं नमस्तस्मै
    त्रिमूर्त्तये ॥ ६॥ नमः स्थूलाय सूक्ष्माय व्यापकाय महात्मने । निषङ्गिणे नमस्तुभ्यं त्रिनेत्राय नमो
    नमः ॥ ७॥ नमश्चन्द्रकलाधार नमो दिग्वसनाय च । पिनाकपाणये तुभ्यमष्टमूर्ते नमो नमः ॥ ८॥ नमस्ते ज्ञानरूपाय
    ज्ञानगम्याय ते नमः । नमस्ते ज्ञानदेहाय सर्वज्ञानमयाय च ॥ ९॥ काशीपते नमस्तुभ्यं गिरिशाय नमो नमः । जगत्कारणरूपाय
    महादेवाय ते नमः ॥ १०॥ गौरीकान्त नमस्तुभ्यं नमस्तुभ्यं शिवात्मने । ब्रह्मविष्णुस्वरूपाय त्रिनेत्राय
    नमो नमः ॥ ११॥ विश्वरूपाय शुद्धाय नमस्तुभ्यं महात्मने । नमो विश्वस्वरूपाय सर्वदेवमयाय च ॥ १२॥ इति श्रीस्कन्दपुराणे
    प्रभासखण्डे अर्बुदखण्डे चतुर्थाध्यायान्तर्गतं वसिष्ठकृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । प्रभासखण्ड
    । अर्बुदखण्ड । अध्याय ४
meaning: {}
