id: shankaracaryapadavalambanastuti
category: stotram
name:
  english: shankaracaryapadavalambanastuti
  devanagari: शन्कराचार्यपदावलम्बनस्तुति
content:
  english: shrimajjagadgurushankaracaryapadavalambanastuti omityasheshavibudhah shirasa yadajnam sambibhrate
    sumamayimiva navyamalam | onkarajaparatalabhyapadabja sa tvam shrishankararya mama dehi padavalambam
    || 1|| namralihrittimiracandamayukhamalin kamrasmitapahritakundasudhamshudarpa | samradyadiyadayaya
    prabhaveddaridrah shrishankararya mama dehi padavalambam || 2|| maste duraksharatatirlikhita vidhatra
    jagartu sadhvasalavo'pi na me'sti tasyah | lumpami te karunaya karunambudhe tam shrishankararya mama
    dehi padavalambam || 3|| shampalatasadrishabhasvaradehayukta sampadayamyakhilashastradhiyam kada va
    | shankanivaranapato namatam naranam shrishankararya mama dehi padavalambam || 4|| kandarpadarpadalanam
    kitavairagamyam karunyajanmabhavanam kritasarvaraksham | kinashabhitiharanam shritavanaham tvam shrishankararya
    mama dehi padavalambam || 5|| rakasudhakarasamanamukhaprasarpa
  devanagari: श्रीमज्जगद्गुरुशङ्कराचार्यपदावलम्बनस्तुती ओमित्यशेषविबुधाः शिरसा यदाज्ञां सम्बिभ्रते सुममयीमिव
    नव्यमालाम् । ओङ्कारजापरतलभ्यपदाब्ज स त्वं श्रीशङ्करार्य मम देहि पदावलम्बम् ॥ १॥ नम्रालिहृत्तिमिरचण्डमयूखमालिन्
    कम्रस्मितापहृतकुन्दसुधांशुदर्प । सम्राड्यदीयदयया प्रभवेद्दरिद्रः श्रीशङ्करार्य मम देहि पदावलम्बम्
    ॥ २॥ मस्ते दुरक्षरततिर्लिखिता विधात्रा जागर्तु साध्वसलवोऽपि न मेऽस्ति तस्याः । लुम्पामि ते करुणया
    करुणाम्बुधे तां श्रीशङ्करार्य मम देहि पदावलम्बम् ॥ ३॥ शम्पालतासदृशभास्वरदेहयुक्त सम्पादयाम्यखिलशास्त्रधियं
    कदा वा । शङ्कानिवारणपटो नमतां नराणां श्रीशङ्करार्य मम देहि पदावलम्बम् ॥ ४॥ कन्दर्पदर्पदलनं कितवैरगम्यं
    कारुण्यजन्मभवनं कृतसर्वरक्षम् । कीनाशभीतिहरणं श्रितवानहं त्वां श्रीशङ्करार्य मम देहि पदावलम्बम् ॥
    ५॥ राकासुधाकरसमानमुखप्रसर्प
