id: sri-kali-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Kali Ashtottara Sata Namavali
content:
  english: om kalyai namah | om kapalinyai namah | om kantayai namah | om kamadayai namah | om kamasundaryai
