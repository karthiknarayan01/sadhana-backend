id: gita-govindam-chapter-1-samoda-damodara
category: stotram
name:
  english: Gita Govindam Chapter 1 - Samoda Damodara
content:
  english: '|| gitagovindam || || ashtapadi || || shri gopalaka dhyanam || yadgopivadanendumandanamabhutkasturikapatrakam
    yallakshmikucashatakumbha kalashe vyagocamindivaram | yannirvanavidhanasadhanavidhau siddhanjanam
    yoginam tannashyamalamavirastu hridaye krishnabhidhanam mahah || || || shri jayadeva dhyanam || radhamanoramaramavararasalila
    ganamritaikabhanitam kavirajarajam | shrimadhavarccanavidhavanuragasadma padmavatipriyatamam pranatosmi
    nityam || || shrigopalavilasini valayasadratnadimugdhakriti shriradhapatipadapadmabhajananandabdhimagno''nisham
    || loke satkavirajaraja iti yah khyato dayambhonidhih tam vande jayadevasadgurumaham padmavativallabham
    || || || prathamah sargah || || samodadamodarah || meghairmeduramambaram vanabhuvah shyamastamaladrumai
    rnaktam bhirurayam tvameva tadimam radhe griham prapaya | ittham nandanideshitashcalitayoh pratyadhvakunjadrumam
    radhamadhavayorjayanti yamunakule rahahkelayah || || vagdevatacaritacitritacittasadma padmavaticaranacaranacakravarti
    | shrivasudevaratikelikathasametam etam karoti jayadevakavih prabandham || || yadi harismarane sarasam
    mano yadi vilasakalasu kutuhalam | madhurakomalakantapadavalim shrinu tada jayadevasarasvatim || ||
    vacah pallavayatyumapatidharah sandarbhashuddhim giram janite jayadeva eva sharanah shlaghyo duruhadrute
    | shringarottarasatprameyaracanairacaryagovardhana spardhi ko''pi na vishrutah shrutidharo dhoyi kavikshmapatih
    || || pralayapayodhijale dhritavanasi vedam | vihitavahitracaritramakhedam || keshava dhritaminasharira
    jaya jagadisha hare || || kshitirativipulatare tava tishthati prishthe | dharanidharanakinacakragarishthe
    || keshava dhritakacchaparupa jaya jagadisha hare || || vasati dashanashikhare dharani tava lagna
    | shashini kalankakaleva nimagna || keshava dhritasukararupa jaya jagadisha hare || || tava karakamalavare
    nakhamadbhutashringam | dalitahiranyakashiputanubhringam || keshava dhritanaraharirupa jaya jagadisha
    hare || || chalayasi vikramane balimadbhutavamana | padanakhanirajanitajanapavana || keshava dhritavamanarupa
    jaya jagadisha hare || || kshatriyarudhiramaye jagadapagatapapam | snapayasi payasi shamitabhavatapam
    || keshava dhritabhrighupatirupa jaya jagadisha hare || || vitarasi dikshu rane dikpatikamaniyam |
    dashamukhamaulibalim ramaniyam || keshava dhritaramasharira jaya jagadisha hare || || vahasi vapushi
    vishade vasanam jaladabham | halahatibhitimilitayamunabham || keshava dhritahaladhararupa jaya jagadisha
    hare || || nindasi yajnavidherahaha shrutijatam | sadayahridayadarshitapashughatam || keshava dhritabuddhasharira
    jaya jagadisha hare || || mlecchanivahanidhane kalayasi karavalam | dhumaketumiva kimapi karalam ||
    keshava dhritakalkisharira jaya jagadisha hare || || shrijayadevakaveridamuditamudaram | shrinu sukhadam
    shubhadam bhavasaram || keshava dhritadashavidharupa jaya jagadisha hare || || vedanuddharate jagannivahate
    bhugolamudbibhrate daityam darayate balim chalayate kshatrakshayam kurvate | paulastyam jayate halam
    kalayate karunyamatanvate mlecchanmurcchayate dashakritikrite krishnaya tubhyam namah || || shrijayadevakaveridam
    kurute mudam | mangalamujjvalagitam || padmapayodharatatiparirambhalagna kashmiramudritamuro madhusudanasya
    | vyaktanuragamiva kheladanangakheda svedambupuramanupurayatu priyam vah || || vasante vasantikusumasukumarairavayavai
    rbhramantim kantare bahuvihitakrishnanusaranam | amandam kandarpajvarajanitacintakulataya valadbadham
    radham sarasamidamuce sahacari || || lalitalavangalataparishilanakomalamalayasamire | madhukaranikarakarambitakokilakujitakunjakutire
    || viharati haririha sarasavasante nrityati yuvatijanena samam sakhi virahijanasya durante || || unmadamadanamanorathapathikavadhujanajanitavilape
    | alikulasankulakusumasamuhanirakulabakulakalape || || mrigamadasaurabharabhasavashamvadanavadalamalatamale
    | yuvajanahridayavidaranamanasijanakharucikimshukajale || || madanamahipatikanakadandarucikesharakusumavikase
    | militashilimukhapatalipatalakritasmaratunavilase || || vigalitalajjitajagadavalokanatarunakarunakritahase
    | virahinikrintanakuntamukhakritiketakadanturitashe || || madhavikaparimalalalite navamalikajatisugandhau
    | munimanasamapi mohanakarini tarunakaranabandhau || || sphuradatimuktalataparirambhanamukulitapulakitacute
    | brindavanavipine parisaraparigatayamunajalapute || || shrijayadevabhanitamidamudayati haricaranasmritisaram
    | sarasavasantasamayavanavarnanamanugatamadanavikaram || || daravidalitamallivallicancatparaga prakatitapatavasairvasayan
    kananani | iha hi dahati cetah ketakigandhabandhuh prasaradasamabanapranavadgandhavahah || || unmilanmadhugandhalubdhamadhupavyadhutacutankura
    kridatkokilakakalikalakalairudgirnakarnajvarah | niyante pathikaih kathankathamapi dhyanavadhanakshana
    praptapranasamasamagamarasollasairami vasarah || || anekanariparirambhasambhrama sphuranmanoharivilasalalasam
    | murarimaradupadarshayantyasau sakhi samaksham punaraha radhikam || || candanacarcitanilakalebarapitavasanavanamali
    | kelicalanmanikundalamanditagandayugasmitashali || haririhamugdhavadhunikare vilasini vilasati kelipare
    || || pinapayodharabharabharena harim pariramya saragam | gopavadhuranugayati kacidudancitapancamaragam
    || || kapi vilasavilolavilocanakhelanajanitamanojam | dhyayati mugdhavadhuradhikam madhusudanavadanasarojam
    || || kapi kapolatale milita lapitum kimapi shrutimule | caru cucumba nitambavati dayitam pulakairanukule
    || || kelikalakutukena ca kacidamum yamunajalakule | manjulavanjulakunjagatam vicakarsha karena dukule
    || || karatalatalataralavalayavalikalitakalasvanavamshe | rasarase sahanrityapara harina yuvatih prashashamse
    || || shlishyati kamapi cumbati kamapi kamapi ramayati ramam | pashyati sasmitacaruparamaparamanugacchati
    vamam || || shrijayadevakaveridamadbhutakeshavakelirahasyam | vrindavanavipine lalitam vitanotu shubhani
    yashasyam || || vishveshamanuranjanena janayannanandamindivara shrenishyamalakomalairupanayannangairanangotsavam
    | svacchandam vrajasundaribhirabhitah pratyangamalinkitah shringarah sakhi murtimaniva madhau mugdho
    harih kridati || || adyotsangavasadbhujangakavalakleshadiveshacalam praleyaplavanecchayanusarati shrikhandashailanilah
    | kim ca snigdharasalamaulimukulanyalokya harshodaya dunmilanti kuhuh kuhuriti kalottalah pikanam
    girah || || rasollasabharenavibhramabhritamabhiravamabhruva mabhyarnam pariramyanirbharamurah premandhaya
    radhaya | sadhu tvadvadanam sudhamayamiti vyahritya gitastuti vyajadudbhatacumbitasmitamanohari harih
    patu vah || || || iti shrigitagovinde samodadamodaro nama prathamah sargah ||'
  devanagari: ॥ गीतगोविन्दम् ॥ ॥ अष्टपदी ॥ ॥ श्री गोपालक ध्यानम् ॥ यद्गोपीवदनेन्दुमण्डनमभूत्कस्तूरिकापत्रकं
    यल्लक्ष्मीकुचशातकुम्भ कलशे व्यागोचमिन्दीवरम् । यन्निर्वाणविधानसाधनविधौ सिद्धाञ्जनं योगिनां तन्नश्यामलमाविरस्तु
    हृदये कृष्णाभिधानं महः ॥ ॥ ॥ श्री जयदेव ध्यानम् ॥ राधामनोरमरमावररासलील गानामृतैकभणितं कविराजराजम्
    । श्रीमाधवार्च्चनविधवनुरागसद्म पद्मावतीप्रियतमं प्रणतोस्मि नित्यम् ॥ ॥ श्रीगोपलविलासिनी वलयसद्रत्नादिमुग्धाकृति
    श्रीराधापतिपादपद्मभजनानन्दाब्धिमग्नोऽनिशम् ॥ लोके सत्कविराजराज इति यः ख्यातो दयाम्भोनिधिः तं वन्दे
    जयदेवसद्गुरुमहं पद्मावतीवल्लभम् ॥ ॥ ॥ प्रथमः सर्गः ॥ ॥ सामोददामोदरः ॥ मेघैर्मेदुरमम्बरं वनभुवः श्यामास्तमालद्रुमै
    र्नक्तं भीरुरयं त्वमेव तदिमं राधे गृहं प्रापय । इत्थं नन्दनिदेशितश्चलितयोः प्रत्यध्वकुञ्जद्रुमं राधामाधवयोर्जयन्ति
    यमुनाकूले रहःकेलयः ॥ ॥ वाग्देवताचरितचित्रितचित्तसद्मा पद्मावतीचरणचारणचक्रवर्ती । श्रीवासुदेवरतिकेलिकथासमेतं
    एतं करोति जयदेवकविः प्रबन्धम् ॥ ॥ यदि हरिस्मरणे सरसं मनो यदि विलासकलासु कुतूहलम् । मधुरकोमलकान्तपदावलीं
    शृणु तदा जयदेवसरस्वतीम् ॥ ॥ वाचः पल्लवयत्युमापतिधरः सन्दर्भशुद्धिं गिरां जानीते जयदेव एव शरणः श्लाघ्यो
    दुरूहद्रुते । शृङ्गारोत्तरसत्प्रमेयरचनैराचार्यगोवर्धन स्पर्धी कोऽपि न विश्रुतः श्रुतिधरो धोयी कविक्ष्मापतिः
    ॥ ॥ प्रलयपयोधिजले धृतवानसि वेदम् । विहितवहित्रचरित्रमखेदम् ॥ केशव धृतमीनशरीर जय जगदीश हरे ॥ ॥ क्षितिरतिविपुलतरे
    तव तिष्ठति पृष्ठे । धरणिधरणकिणचक्रगरिष्ठे ॥ केशव धृतकच्छपरूप जय जगदीश हरे ॥ ॥ वसति दशनशिखरे धरणी तव
    लग्ना । शशिनि कलङ्ककलेव निमग्ना ॥ केशव धृतसूकररूप जय जगदीश हरे ॥ ॥ तव करकमलवरे नखमद्भुतशृङ्गम् । दलितहिरण्यकशिपुतनुभृङ्गम्
    ॥ केशव धृतनरहरिरूप जय जगदीश हरे ॥ ॥ छलयसि विक्रमणे बलिमद्भुतवामन । पदनखनीरजनितजनपावन ॥ केशव धृतवामनरूप
    जय जगदीश हरे ॥ ॥ क्षत्रियरुधिरमये जगदपगतपापम् । स्नपयसि पयसि शमितभवतापम् ॥ केशव धृतभृघुपतिरूप जय जगदीश
    हरे ॥ ॥ वितरसि दिक्षु रणे दिक्पतिकमनीयम् । दशमुखमौलिबलिं रमणीयम् ॥ केशव धृतरामशरीर जय जगदीश हरे ॥
    ॥ वहसि वपुषि विशदे वसनं जलदाभम् । हलहतिभीतिमिलितयमुनाभम् ॥ केशव धृतहलधररूप जय जगदीश हरे ॥ ॥ निन्दसि
    यज्ञविधेरहह श्रुतिजातम् । सदयहृदयदर्शितपशुघातम् ॥ केशव धृतबुद्धशरीर जय जगदीश हरे ॥ ॥ म्लेच्छनिवहनिधने
    कलयसि करवालम् । धूमकेतुमिव किमपि करालम् ॥ केशव धृतकल्किशरीर जय जगदीश हरे ॥ ॥ श्रीजयदेवकवेरिदमुदितमुदारम्
    । शृणु सुखदं शुभदं भवसारम् ॥ केशव धृतदशविधरूप जय जगदीश हरे ॥ ॥ वेदानुद्धरते जगन्निवहते भूगोलमुद्बिभ्रते
    दैत्यं दारयते बलिं छलयते क्षत्रक्षयं कुर्वते । पौलस्त्यं जयते हलं कलयते कारुण्यमातन्वते म्लेच्छान्मूर्च्छयते
    दशाकृतिकृते कृष्णाय तुभ्यं नमः ॥ ॥ श्रीजयदेवकवेरिदं कुरुते मुदम् । मङ्गलमुज्ज्वलगीतं ॥ पद्मापयोधरतटीपरिरम्भलग्न
    काश्मीरमुद्रितमुरो मधुसूदनस्य । व्यक्तानुरागमिव खेलदनङ्गखेद स्वेदाम्बुपूरमनुपूरयतु प्रियं वः ॥ ॥ वसन्ते
    वासन्तीकुसुमसुकुमारैरवयवै र्भ्रमन्तीं कान्तारे बहुविहितकृष्णानुसरणाम् । अमन्दं कन्दर्पज्वरजनितचिन्ताकुलतया
    वलद्बाधां राधां सरसमिदमुचे सहचरी ॥ ॥ ललितलवङ्गलतापरिशीलनकोमलमलयसमीरे । मधुकरनिकरकरम्बितकोकिलकूजितकुञ्जकुटीरे
    ॥ विहरति हरिरिह सरसवसन्ते नृत्यति युवतिजनेन समं सखि विरहिजनस्य दुरन्ते ॥ ॥ उन्मदमदनमनोरथपथिकवधूजनजनितविलापे
    । अलिकुलसङ्कुलकुसुमसमूहनिराकुलबकुलकलापे ॥ ॥ मृगमदसौरभरभसवशंवदनवदलमालतमाले । युवजनहृदयविदारणमनसिजनखरुचिकिंशुकजाले
    ॥ ॥ मदनमहीपतिकनकदण्डरुचिकेशरकुसुमविकासे । मिलितशिलीमुखपाटलिपटलकृतस्मरतूणविलासे ॥ ॥ विगलितलज्जितजगदवलोकनतरुणकरुणकृतहासे
    । विरहिनिकृन्तनकुन्तमुखाकृतिकेतकदन्तुरिताशे ॥ ॥ माधविकापरिमलललिते नवमालिकजातिसुगन्धौ । मुनिमनसामपि
    मोहनकारिणि तरुणाकारणबन्धौ ॥ ॥ स्फुरदतिमुक्तलतापरिरम्भणमुकुलितपुलकितचूते । बृन्दावनविपिने परिसरपरिगतयमुनाजलपूते
    ॥ ॥ श्रीजयदेवभणितमिदमुदयति हरिचरणस्मृतिसारम् । सरसवसन्तसमयवनवर्णनमनुगतमदनविकारम् ॥ ॥ दरविदलितमल्लीवल्लिचञ्चत्पराग
    प्रकटितपटवासैर्वासयन् काननानि । इह हि दहति चेतः केतकीगन्धबन्धुः प्रसरदसमबाणप्राणवद्गन्धवाहः ॥ ॥ उन्मीलन्मधुगन्धलुब्धमधुपव्याधूतचूताङ्कुर
    क्रीडत्कोकिलकाकलीकलकलैरुद्गीर्णकर्णज्वराः । नीयन्ते पथिकैः कथङ्कथमपि ध्यानावधानक्षण प्राप्तप्राणसमासमागमरसोल्लासैरमी
    वासराः ॥ ॥ अनेकनारीपरिरम्भसम्भ्रम स्फुरन्मनोहारिविलासलालसम् । मुरारिमारादुपदर्शयन्त्यसौ सखी समक्षं
    पुनराह राधिकाम् ॥ ॥ चन्दनचर्चितनीलकलेबरपीतवसनवनमाली । केलिचलन्मणिकुण्डलमण्डितगण्डयुगस्मितशाली ॥ हरिरिहमुग्धवधूनिकरे
    विलासिनि विलसति केलिपरे ॥ ॥ पीनपयोधरभारभरेण हरिं परिरम्य सरागम् । गोपवधूरनुगायति काचिदुदञ्चितपञ्चमरागम्
    ॥ ॥ कापि विलासविलोलविलोचनखेलनजनितमनोजम् । ध्यायति मुग्धवधूरधिकं मधुसूदनवदनसरोजम् ॥ ॥ कापि कपोलतले
    मिलिता लपितुं किमपि श्रुतिमूले । चारु चुचुम्ब नितम्बवती दयितं पुलकैरनुकूले ॥ ॥ केलिकलाकुतुकेन च काचिदमुं
    यमुनाजलकूले । मञ्जुलवञ्जुलकुञ्जगतं विचकर्ष करेण दुकूले ॥ ॥ करतलतालतरलवलयावलिकलितकलस्वनवंशे । रासरसे
    सहनृत्यपरा हरिणा युवतिः प्रशशंसे ॥ ॥ श्लिष्यति कामपि चुम्बति कामपि कामपि रमयति रामाम् । पश्यति सस्मितचारुपरामपरामनुगच्छति
    वामाम् ॥ ॥ श्रीजयदेवकवेरिदमद्भुतकेशवकेलिरहस्यम् । वृन्दावनविपिने ललितं वितनोतु शुभानि यशस्यम् ॥ ॥
    विश्वेषामनुरञ्जनेन जनयन्नानन्दमिन्दीवर श्रेणीश्यामलकोमलैरुपनयन्नङ्गैरनङ्गोत्सवम् । स्वच्छन्दं व्रजसुन्दरीभिरभितः
    प्रत्यङ्गमालिङ्कितः शृङ्गारः सखि मूर्तिमानिव मधौ मुग्धो हरिः क्रीडति ॥ ॥ अद्योत्सङ्गवसद्भुजङ्गकवलक्लेशादिवेशाचलं
    प्रालेयप्लवनेच्छयानुसरति श्रीखण्डशैलानिलः । किं च स्निग्धरसालमौलिमुकुलान्यालोक्य हर्षोदया दुन्मीलन्ति
    कुहूः कुहूरिति कलोत्तालाः पिकानां गिरः ॥ ॥ रासोल्लासभरेणविभ्रमभृतामाभीरवामभ्रुवा मभ्यर्णं परिरम्यनिर्भरमुरः
    प्रेमान्धया राधया । साधु त्वद्वदनं सुधामयमिति व्याहृत्य गीतस्तुति व्याजादुद्भटचुम्बितस्मितमनोहरी हरिः
    पातु वः ॥ ॥ ॥ इति श्रीगीतगोविन्दे सामोददामोदरो नाम प्रथमः सर्गः ॥
