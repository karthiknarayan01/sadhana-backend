id: vedic-svara
category: veda
name:
  english: Vedic svara
  devanagari: Vएदिच् स्वर
content:
  english: jye̱shthaya̭ ca kani̱shthaya̭ ca̱ nama̭h purva̱jaya̭ capara̱jaya̭ ca̱ namo̭ madhya̱maya̭ capaga̱lbhaya̭
    ca̱ namo̭ jagha̱nya̭ya ca̱ budhni̭yaya ca̱ nama̭h so̱bhya̭ya ca pratisa̱rya̭ya ca̱ namo̱ yamya̭ya
    ca̱ kshemya̭ya ca̱ nama̭ urva̱rya̭ya ca̱ khalya̭ya ca̱ nama̱h shlokya̭ya ca'vasa̱nya̭ya ca̱ namo̱
    vanya̭ya ca̱ kakshya̭ya ca̱ nama̭h shra̱vaya̭ ca pratishra̱vaya̭ ca̱ nama̭ a̱shushḙnaya ca̱shura̭thaya
    ca̱ nama̱h shura̭ya cavabhinda̱te ca̱ namo̭ va̱rminḙ ca varu̱thinḙ ca̱ namo̭ bi̱lminḙ ca kava̱cinḙ
    ca̱ nama̭h shru̱taya̭ ca shrutase̱naya̭ ca || 6|| namo̭ dundu̱bhya̭ya cahana̱nya̭ya ca̱ namo̭ dhri̱shnavḙ
    ca pramri̱shaya̭ ca̱ namo̭ du̱taya̭ ca̱ prahi̭taya ca̱ namo̭ nisha̱nginḙ ceshudhi̱matḙ ca̱ nama̭sti̱kshnesha̭ve
    cayu̱dhinḙ ca̱ nama̭h svayu̱dhaya̭ ca su̱dhanva̭ne ca̱ nama̱h srutya̭ya ca̱ pathya̭ya ca̱ nama̭h
    ka̱tya̭ya ca ni̱pya̭ya ca̱ nama̱h sudya̭ya ca sara̱sya̭ya ca̱ namo̭ na̱dyaya̭ ca vaisha̱ntaya̭ ca̱
    nama̱h kupya̭ya cava̱tya̭ya ca̱ namo̱ varshya̭ya cava̱rshyaya̭ ca̱ namo̭ me̱ghya̭ya ca vidyu̱tya̭ya
    ca̱ nama̭ i̱dhriya̭ya cata̱pya̭ya ca̱ namo̱ vatya̭ya ca̱ reshmi̭yaya ca̱ namo̭ vasta̱vya̭ya ca vastu̱
    paya̭ ca || 7|| nama̱h soma̭ya ca ru̱draya̭ ca̱ nama̭sta̱mraya̭ caru̱naya̭ ca̱ nama̭h sha̱ngaya̭ ca
    pashu̱pata̭ye ca̱ nama̭ u̱graya̭ ca bhi̱maya̭ ca̱ namo̭ agreva̱dhaya̭ ca dureva̱dhaya̭ ca̱ namo̭ ha̱ntre
    ca̱ hani̭yase ca̱ namo̭ vri̱kshebhyo̱ hari̭keshebhyo̱ nama̭sta̱raya̱ nama̭shsha̱mbhavḙ ca mayo̱bhavḙ
    ca̱ nama̭h shanka̱raya̭ ca mayaska̱raya̭ ca̱ nama̭h shi̱vaya̭ ca shi̱vata̭raya ca̱ nama̱stirthya̭ya
    ca̱ kulya̭ya ca̱ nama̭h pa̱rya̭ya cava̱rya̭ya ca̱ nama̭h pra̱tara̭naya co̱ttara̭naya ca̱ nama̭ ata̱rya̭ya
    cala̱dya̭ya ca̱ nama̱h shashpya̭ya ca̱ phenya̭ya ca̱ nama̭h sika̱tya̭ya ca prava̱hya̭ya ca || 8||
    nama̭ iri̱nya̭ya ca prapa̱thya̭ya ca̱ nama̭h ki
  devanagari: ज्ये॒ष्ठाय॑ च कनि॒ष्ठाय॑ च॒ नमः॑ पूर्व॒जाय॑ चापर॒जाय॑ च॒ नमो॑ मध्य॒माय॑ चापग॒ल्भाय॑ च॒ नमो॑
    जघ॒न्या॑य च॒ बुध्नि॑याय च॒ नमः॑ सो॒भ्या॑य च प्रतिस॒र्या॑य च॒ नमो॒ याम्या॑य च॒ क्षेम्या॑य च॒ नम॑ उर्व॒र्या॑य
    च॒ खल्या॑य च॒ नमः॒ श्लोक्या॑य चाऽवसा॒न्या॑य च॒ नमो॒ वन्या॑य च॒ कक्ष्या॑य च॒ नमः॑ श्र॒वाय॑ च प्रतिश्र॒वाय॑
    च॒ नम॑ आ॒शुषे॑णाय चा॒शुर॑थाय च॒ नमः॒ शूरा॑य चावभिन्द॒ते च॒ नमो॑ व॒र्मिणे॑ च वरू॒थिने॑ च॒ नमो॑ बि॒ल्मिने॑
    च कव॒चिने॑ च॒ नमः॑ श्रु॒ताय॑ च श्रुतसे॒नाय॑ च ॥ ६॥ नमो॑ दुन्दु॒भ्या॑य चाहन॒न्या॑य च॒ नमो॑ धृ॒ष्णवे॑
    च प्रमृ॒शाय॑ च॒ नमो॑ दू॒ताय॑ च॒ प्रहि॑ताय च॒ नमो॑ निष॒ङ्गिणे॑ चेषुधि॒मते॑ च॒ नम॑स्ती॒क्ष्णेष॑वे चायु॒धिने॑
    च॒ नमः॑ स्वायु॒धाय॑ च सु॒धन्व॑ने च॒ नमः॒ स्रुत्या॑य च॒ पथ्या॑य च॒ नमः॑ का॒ट्या॑य च नी॒प्या॑य च॒ नमः॒
    सूद्या॑य च सर॒स्या॑य च॒ नमो॑ ना॒द्याय॑ च वैश॒न्ताय॑ च॒ नमः॒ कूप्या॑य चाव॒ट्या॑य च॒ नमो॒ वर्ष्या॑य
    चाव॒र्ष्याय॑ च॒ नमो॑ मे॒घ्या॑य च विद्यु॒त्या॑य च॒ नम॑ ई॒ध्रिया॑य चात॒प्या॑य च॒ नमो॒ वात्या॑य च॒ रेष्मि॑याय
    च॒ नमो॑ वास्त॒व्या॑य च वास्तु॒ पाय॑ च ॥ ७॥ नमः॒ सोमा॑य च रु॒द्राय॑ च॒ नम॑स्ता॒म्राय॑ चारु॒णाय॑ च॒
    नमः॑ श॒ङ्गाय॑ च पशु॒पत॑ये च॒ नम॑ उ॒ग्राय॑ च भी॒माय॑ च॒ नमो॑ अग्रेव॒धाय॑ च दूरेव॒धाय॑ च॒ नमो॑ ह॒न्त्रे
    च॒ हनी॑यसे च॒ नमो॑ वृ॒क्षेभ्यो॒ हरि॑केशेभ्यो॒ नम॑स्ता॒राय॒ नम॑श्श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑
    च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ नम॒स्तीर्थ्या॑य च॒ कूल्या॑य च॒ नमः॑ पा॒र्या॑य चावा॒र्या॑य
    च॒ नमः॑ प्र॒तर॑णाय चो॒त्तर॑णाय च॒ नम॑ आता॒र्या॑य चाला॒द्या॑य च॒ नमः॒ शष्प्या॑य च॒ फेन्या॑य च॒ नमः॑
    सिक॒त्या॑य च प्रवा॒ह्या॑य च ॥ ८॥ नम॑ इरि॒ण्या॑य च प्रप॒थ्या॑य च॒ नमः॑ कि
