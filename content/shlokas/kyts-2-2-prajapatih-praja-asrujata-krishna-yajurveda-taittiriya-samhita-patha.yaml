id: kyts-2-2-prajapatih-praja-asrujata-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 2.2 Prajapatih Praja Asrujata - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ndvitiyakande dvitiyah prashnah shri gurubhyo namah
    | harih om || prajapatih praja asrijata ta ssrishta indragni apaguhatagm so tprajapatirindragni vai
    me praja apaghukshatamiti sa etamai ttavasmai prajah prasadhayata mindragni va etasya prajamapa guhato
    yo nna vindata aindragna prajakama indragni eva svena bhagadheyenopa dhavati tavevasmai mpra sadhayato
    vindate kshetre va sajateshu vendragni eva svena bhagadheyenopa dhavati tabhyamevendriyam ~virya mbhratrivyasya
    vrinkte vi papmana bhratrivyena jayate 'pa va etasmadindriyam nnindragni eva svena bhagadheyenopa
    dhavati tavevasmi ssahendriyena viryenopa pra yati jayati tagm sagrammam vi~ va esha indriyena viryenardhyate
    ya njitvendragni eva svena bhagadheyenopa dhavati tavevasmi dhatto nendriyena dhatto nendriyena viryena
    vyriddhyate 'pa va etasmadindriyam nkramati ya eti janatamaindragna nnindragni eva svena bhagadheyenopa
    dhavati tavevasmi ssahendriyena viryena janatameti paushna tpusha va indriyasya viryasya 'nupradata
    pushanameva svena bhagadheyenopa dhavati sa evasma indriyam vi~ryamanu prayacchati kshaitrapatya vai~
    kshetrasya patirasyameva prati tishthatyaindragna nnirvapedasyameva pratishthaye prajakama indragni
    ndragnamekadashakapala kannacatvarigmshacca agnaye pathikrite purodasha nnirvapedyo dar shapurnamasayaji
    sannamavasyam tpatho va eshoddhyapathenaiti yo dar shapurnamasayaji sannamavasyam va~tipadayatyagnimeva
    pathikritagg svena bhagadheyenopa dhavati sa evainamapatha tpanthamapi nayatyanadva ndakshina vahi
    hyesha samriddhya agnaye nnirvapedya ahitagni ssannavratyamiva caredagnimeva vratapatigg svena bhagadheyenopa
    dhavati sa evainam ya~ti vratyo bhavatyagnaye rakshoghne purodasha nnirvapedyagm rakshagmsi sacerannagnimeva
    rakshohanagg svena bhagadheyenopa dhavati sa evasma drakshagsyapa hanti nishitaya nnishitayagm hi
    rakshagmsi prerate sapremrna nyevainani hanti parishrite yajaye mananvavacaraya rakshoghni ya jyanuvakye
    bhavato rakshasag stritya agnaye rudravate purodasha nnesha va asya ghora tanurya drudrastasma evainamavrishcati
    tajagarti marcchatyagnaye surabhimate purodasha nnirvapedyasya gavo va purusha va pramiyeran yo va
    bibhiyadesha va asya bheshajya tanurya nkaroti surabhimate bhavati putigandhasya 'pahatya agnaye kshamavate
    purodasha ya~tte bhagadheyenaivainagm shamayitva paranabhi nirdishati yamavaresham vi~ddhyanti jivati
    sa ya mpra sa miyate jayati tagm sangrama mabhi va esha etanucyati yesha mpurvapara anvancah pramiyante
    purushahutir 'gnaye kshamavate purodasha dbhagadheyenaivainagm shamayati naisha 'bhi va esha etasya
    grihanucyati yasya griha ndahatyagnaye kshamavate purodasha dbhagadheyenaivainagm shamayati na agnaye
    kamaya purodasha dagnimeva kamagg svena bhagadheyenopa dhavati sa evaina nkamena samardhayatyupaina
    nkamo namatyagnaye ya vishthaya purodasha kshetre va sajateshu va 'gnimeva yavishthagg svena bhagadheyenopa
    dhavati tenaivendriyam yuvate vipapmana yuvate vipapmana bhratrivyena jayate 'gnaye yavishthaya purodasha
    dabhicaryamano 'gnimeva yavishthagg svena bhagadheyenopa dhavati sa evasma drakshagmsi yavayati naina
    'gnaya ayushmate purodasha nnirvapedyah kamayeta sarva ''yushmantagg svena bhagadheyenopa dhavati
    sa eva nnayurdadhati sarvamayu retyagnaye jatavedase purodasha 'gnimeva jatavedasagg svena bhagadheyenopa
    dhavati sa evaina ngamayati bhavatyevagnaye rukmate purodasha 'gnimeva rukmantagg svena bhagadheyenopa
    dhavati sa evasmi rocata evagnaye tejasvate purodasha 'gnimeva tejasvantagg svena bhagadheyenopa dhavati
    sa evasmi ntejo dadhati tejasvyeva bhavatyagnaye sahantyaya purodashamashtakapala thsikshamano 'gnimeva
    sahantyagg svena bhagadheyenopa dhavati tenaiva sahate yagm sikshate || nnirvapedyah kamayeta nnavantagg
    svena bhagadheyenopa dhavati sa evainamannavanta nkarotyannavaneva bhavatyagnaye 'nnadaya purodasha
    nnirvapedyah kamayeta svena bhagadheyenopa dhavati sa evaina 'nnapatigg svena bhagadheyenopa dhavati
    sa evaina reva bhavatyagnaye pavamanaya purodasha nnirvapedagnaye pavakayagnaye shucaye jyogamayavi
    yadagnaye pavamanaya nirvapati prana ntena dadhati yadagnaye ntena dadhati yadagnaye shucaya ayu ntena
    dadhatyuta yaditasu rbhavati jivatyevaita ccakshushkamo yadagnaye pavamanaya nirvapati prana ntena
    dadhati yadagnaye pavakaya vaca ntena dadhati yadagnaye shucaye cakshu tyuta yadyandho bhavati praiva
    pashyatyagnaye putravate purodasha dindraya putrine purodasha mprajanayati vriddha mindrah pra yacchatyagnaye
    rasavate nnirvapedyah kamayeta rasavan meva rasavantagg svena bhagadheyenopa dhavati sa evainagm rasavanta
    rasavaneva bhavatyajakshire bhavatyagneyi va esha yadaja sakshadeva rasamava rundhe 'gnaye vasumate
    purodasha nnirvapedyah kamayeta vasuman meva vasumantagg svena bhagadheyenopa dhavati sa evainam nkaroti
    vasumaneva bhavatyagnaye vajasrite purodasha njigishatyagnih khalu vai devanam meva vajasritagg svena
    bhagadheyenopa dhavati dhavati vajagm hanti vritra njayati tagm sagramma matho agniriva na pratidhrishe
    bhavatyagnaye 'gnivate purodasha rnirdishtabhago va etayo 'gnivate nirvapati bhagadheyenaivainau shamayati
    na ''rtimarcchati yajamano 'gnaye jyotishmate purodasha 'gnihotra udvayedapara adipya 'nuddhritya
    ityahusta dbhagadheyamabhi purva uddhriyate kimaparo hriyeteti tanyeva ddhriyeteti tanyeva vakshanani
    sannidhaya mantheditah prathama ssvadyoneradhi jatavedah | sa gayatriya trishtubha jagatya devebhyo
    havyam va~hatu prajananniti chandobhi revainagg svadyoneh prajanayatyesha va va so 'gnirityahu rjyotistva
    asya parapatita miti yadagnaye jyotishmate nirvapati yadevasya jyotih parapatita shucaye cakshurevasmi
    nne carumabhishasyamano ya shvanaro dvadashakapalo bhavati sam va~thsaro va agni rvai va~thsarenaivainagg
    svadayatyapa papam va~rnagm hate varunenaivainam nmuncati dadhikrav nna punati hiranya ndakshina pavitram
    mbhavatyetameva nirvape shvanaro dvadashakapalo bhavati sam va~thsaro va agni rvai va~thsarameva bhagadheyena
    shamayati so mprajanayati varunenaivainam nmuncati dadhikrav nna punati hiranya ndakshina pavitram
    tputre jateyadashtakapalo bhavati gayatriyaivaina mbrahmavarcasena punati yannavakapala ddashakapalo
    virajaiva ndadhati yadekadashakapala ddvadashakapalo jagatyaiva ndadhati yasmin jata etamishti eva
    tejasvyannada eva tejasvyannada indriyavi pashuma nbhavatyava va esha suvarga shapurnamasayaji sannamavasyam
    va~tipadayati suvargaya hi lokaya dar shapurnamasa vijyete vaishvanara va~thsaro va agni rvai va~thsarameva
    prinatyatho sam va~thsaramevasma upa dadhati suvargasya lokasya samashtya atho devata evanvarabhya
    suvargam lo~kameti viraha va esha devanam mudvasayate na va etasya brahmana ritayavah pura magnimudvasayishyan
    yadashtakapalo bhavatyashtakshara gayatri 'gnistasma atithya nkarotyatho yatha janam ddvadashakapalo
    vaishvanaro bhavati dvadasha masa va~thsarah khalu va agneryoni nnirvapenmarutagm saptakapala ngramakama
    ahavaniye vaishvanaramadhi shrayati gar mpapavasyasasya vidhrityai dvadashakapalo vaishvanaro bhavati
    dvadasha masa va~thsarenaivasmai sajatag shcyavayati maruto bhavati maruto vai devanam vi~sho devavishenaiva
    'smai manushya vishamava rundhe saptakapalo bhavati sapta gana vai maruto ganasha evasmai sajatanava
    rundhe 'nucyamana a sadayati vishamevasma anuvartmana tyekanna trigmshacca rasyameva purve pratitishthanti
    vaishvanara va~thsaro va agni rvai va~thsarah khalu vai devana metasmadva ayatana nnirvapati devana
    ''yatane yatate jayati tagm sagramma metasmin va etau mrijate dvidvishanayoranna va~thsaraya va etau
    samamate yau samamate tayoryah purvo va~runo grihnati vaishvanara thsamamanayoh purvo ''ptva nirvarunam
    dabhi druhyati nainam va~runo grihnatyavyam va~ esha prati grihnati yo mpratigrihnati vaishvanara
    svaditameva pratigrihnati na mpratigrihnatyatmano va esha matramapnoti ya ubhayada tpratigrihnatyashvam
    va~thsaro va agnirvai svaditameva prati grihnati natmano matramapnoti vaishvanara shvanaro yada khalu
    vai sam ncaratyatha sa dhanargho bhavatiya satameva sanimabhi pracyavate danakama asmai praja bhavanti
    yo vai sam prayujya na vimuncatyapratishthano vai sa bhavatyeta mpunaragatya nirvapedya meva prayunkte
    ta mbhagadheyena vi muncati pratishthityai yaya rajvo mbhratrivyaya pra hinuya mevasmai pra hinoti
    || tpashukama aindra vai pashava indrameva svena bhagadheyenopa dhavati sa evasmai pashu neva bhavati
    carurbhavati svadevasmai yoneh nprajanayatindrayendriyavate purodasha tpashukama indriyam mevendriyavantagg
    svena bhagadheyenopa dhavati sa nprayacchati pashumaneva bhavatindraya dbrahmavarcasakamo brahmavarcasam
    vai~ gharma indrameva gharmavantagg svena bhagadheyenopa dhavati sa evasmi ndadhati brahmavarcasyeva
    bhavatindraya 'rkavantagg svena bhagadheyeno pa dhavati sa evasma anna mprayacchatyannada eva bhavatindraya
    gharmavate purodasha ndriyavata indraya 'rkavate bhutikamo yadindraya gharmavate nirvapati shira evasya
    tena karoti yadindrayendriyavata atmana mevasya tena karoti 'rkavate bhuta evannadye prati tishthati
    bhavatyevendraya 'gm homuce purodasha nnirvapedyah papmana grihita tpapma va agmha indrameva 'gm homucagg
    svena bhagadheyenopa dhavati sa evaina 'gmhaso muncatindraya vaimridhaya purodasha svena bhagadheyenopa
    dhavati sa eva 'pa hantindraya tratre purodasha dbaddho va pariyatto vendrameva trataragg svena bhagadheyenopa
    dhavati sa evaina ntrayata indraya 'rkashvamedhavate purodasha mmahayajno nopanamedete vai mahayajnasya
    vantagg svena bhagadheyenopa dhavati sa evasma antato mahayajna indriyavantagg svena bhagadheyenopa
    dhavati so 'rkavantagg svena bhagadheyenai dgramakama indra 'nvrijugg svena bhagadheyenopa dhavati
    sa evasmai sajata nanukan karoti gramyeva bhavatindranyai caru nnirvapedyasya sena dindrani vai senayai
    devate meva svena bhagadheyenopa dhavati saivasya senagm sagg shyati balbajanapi ttato balbaja udatishtha
    mapiniya ga vedayatindraya manyumate manasvate purodasha ya~tta indriyena vai manyuna manasa sangrama
    mmanasvantagg svena bhagadheyenopa dhavati sa evasminnindriya mmano dadhati jayati tagm meva nirvapedyo
    hatamana mpapa iva syadetani hi va etasma dapakrantanyathaisha hatamana mpapa indrameva manyumanta
    mmanasvantagg svena bhagadheyenopa dhavati sa evasmi mmano dadhati na hatamana mpapo bhavatindraya
    datre purodasha nnirvapedyah kamayeta danakama me praja meva dataragg svena bhagadheyenopa dhavati
    sa evasmai danakamah prajah karoti danakama asmai praja bhavantindraya pradatre purodasha dyasmai
    prattamiva sanna pradiyetendra meva pradataragg svena bhagadheyenopa dhavati sa evasmai pra dapayatindraya
    sutramne purodasha 'paruddhyamano vendrameva sutramanagg svena bhagadheyenopa dhavati sa evaina ntrayate
    'naparuddhyo bhavatindro vai sadri thsa na vyavritamagaccha cchakvari yajyanuvakye akaro dvajro vai
    shakvari sa enam va~jro bhutya aindha dbhutah pra ma dhakshyatiti sa prajapati shshakvarya adhi revati
    nniramimita shantya apradahaya yo dindrameva svena bhagadheyenopa dhavati sa eva ndadhati revati puronuvakya
    bhavati shantya apradahaya shakvari yajya vajro vai shakvarisa enam va~jro bhutya indhe bhavatyeva
    || thsarasvatyajya bhaga sya haspat yashcaruryada vaishnava ekadashakapalo bhavatyagni ssarva devata
    vishnuryajno devatabhi ya~jnena cabhi carati sarasvatyajyabhaga bhavati vagvai sarasvati vacaivaina
    shcaru rbhavati brahma vai devana mbrihaspati rbrahmanaivaina || prati vai parasta mabhi caranti dvedve
    puro 'nuvakye kuryadati prayuktya etayaiva yajetabhi caryamano devatabhi praticarati yajnena yajnam
    mbrahmana brahma sa devata nca maddhyato vyavasarpati tasya na kuta thstrinuta agnavaishnava ssarva
    devata vishnu nca svena bhagadheyenopa dhavati tavevasmai yajna nnirvapeccakshushkamo 'gnervai cakshusha
    manushya vi pashyanti yajnasya deva agni nca svena bhagadheyenopa dhavati taveva asmin cakshurdhatta
    neva bhavati dhenvai va eta devasmai cakshuh prajanayati ghrite bhavati tejo vai ghrita stejasaivasmai
    teja shcakshurava rundha indriyam vri~nkte bhratrivyo yajamano dbhratrivye yajamane na ~viryam ~vrinkte
    puravacah pravadito mbhratrivyasya vrinkte tamasya vaca 'nu pravadanti ta indriyam ya~jamane dadhatyagna
    vaishnava '' kale sarasvatyajyabhaga sya ryadashtakapalo bhavatyashtakshara gayatri gayatra nmaddhyandinasya
    savanasya '' kale sarasvatyajyabhaga sya shcaru ryadekadashakapalo bhavatyekadashakshara trishtu mmaddhyandinagm
    savana mmaddhyadinnameva savana ''pnotyagnavaishnava ''kale sarasvatyajyabhaga sya ddvadashakapalo
    bhavati dvadashakshara jagati jagata ntritiya savanameva tena ''pnoti devatabhireva devatah || praticarati
    yajnena yajnam mbrahmana brahma kapalaireva chandagsyapnoti purodashai ssavanani maitravaruna dvashayai
    kale yaivasau bhratrivyasya vasha 'nubandhya so evaishaitasyaikakapalo bhavati na hi kapalaih brahmanaivainamabhi
    carati asavadityo na vyarocata tasmai devah prayashcitti ntasma etagm somaraudra nrucamadadhuryo brahmavarcasakama
    ttasma etagm somaraudra nca svena bhagadheyenopa dhavati tavevasmi ndhatto brahmavarcasyeva bhavati
    tishyapurnamase nirvapedrudro || vai tishyah somah purnamasa ssakshadeva brahmavarcasamava rundhe
    parishrite yajayati brahmavarcasasya parigrihityai shvetayai shvetavathsayai dugdha mprokshanamajyena
    marjayante yavadeva brahmavarcasa nkarotyati brahmavarcasa nkriyata ityahurishvaro dushcarma bhavitoriti
    manavi ricau dhayye kurya 'smai karoti yadi bibhiya ddushcarma bhavishyamiti somapaushna thsaumyo
    vai devataya purushah paushnah pashava ssvayai vasmai devataya pashubhi nkaroti na dushcarma bhavati
    somaraudra ssomo vai retodha agnih prajana mprajanayita soma evasmai reto dadha mprajanayati vindate
    || prajagm somaraudra thsaumyo vai devataya purusha esha rudro yadagni ndevatayai nishkriya rudrayapi
    dadhati tajagarti marcchati somaraudra jjyogamayavi somam va~ etasya raso gacchatyagnigm shariram
    ya~sya jyogamayati somadevasya rasa nnishkrinatyagne tasu rbhavati jivatyeva somarudrayorva eta ngrasitagm
    hota nishkhidati sa i hotra deyo vahnirva anadvan vahnirhota vahninaiva vahni matmanagg sprinoti somaraudra
    nnirvapedyah kamayeta sve 'sma ayatane bhratrivya mbarhishah striniya nna sva evasma ayatane bhratrivya
    nnirvapenmarutagm saptakapala ngramakama indra ncaiva marutashca svena bhagadheyenopa dhavati ta evasmai
    sajata nprayacchanti gramyeva bhavatyahavaniya aindramadhi shrayati gar mpapavasyasasya vidhrityai
    saptakapalo maruto bhavati saptagana vai marutoganasha evasmai sajatanava rundhe 'nucyamana a sadayati
    vishameva asma anuvartmanam nkarotyetameva nirvapedyah kamayeta kshatraya ca vishe ca samada 'nu bruhityashravya
    bruya nmaruto yajeti marutasya 'nu bruhityashravya bruyadindram ya~jeti sva evaibhyo bhagadheye samada
    ndadhati vitrigmhana stishthantye tameva || nirvapedyah kamayeta kalperanniti yathadevata dbhagadheyenaivainan
    yathayatha nkalpayati kalpanta evaindra ngramakama indra ncaiva vishvagshca devan thsvena bhagadheyenopa
    dhavati ta evasmai sajata nprayacchanti gramyeva bhavatyaindrasya 'vadaya vaishvadevasyava dye dindriyenaivasma
    ubhayatah sajata npari grihnatyupadhayya purvayam va~so dakshina sajatanamupahityai prishniyai dugdhe
    praiyangava nnirvapenmarudbhyo gramakamah prishniyai vai payaso maruto jatah prishniyai priyangavo
    marutah khalu vai devataya sajata maruta eva svena bhagadheyenopa dhavati ta evasmai sajata nprayacchanti
    gramyeva bhavati priyavati yajyanuvakye bhavatah priyamevainagm || bhavatah priyamevainagm samanana
    nkaroti dvipada puro 'nuvakya bhavati dvipada evava rundhe catushpada yajya catushpada eva pashunava
    rundhe devasura nte deva mitho vipriya asa 'nyasmai jyaishthyaya shcaturdha vyakrama ssomo rudrairindro
    marudbhi ssa indrah prajapati dagnaye vasumate purodasha thsomaya rudravate carumindraya marutvate
    purodasha ndeva jyaishthyayabhi samajanata ya dagnaye vasumate purodasha thsomaya rudravate caru mindraya
    marutvate purodasha va~runaya ''dityavate caru njyaishthyaya samana abhi sa hiranyagarbha apo ha yatprajapate
    || sa veda putrah pitaragm sa mataragm sa sunubharva tpunarmaghah | sa dyamaurnodantarikshagm sa suva
    ssa vishva bhuvo abhava ncitram || sa pratnavannaviyasa shshashvataskarhaste dadhano || narya puruni
    | agnirbhuvadrayipati rayinagm satra cakrano amritani vishva || hiranyapanimutaye savitaramupa hvaye
    | sa cetta devata padam || vamamadya savitarvamamu shvo divedive vamamasmabhyagm savih | vamasya hi
    kshayasya deva bhureraya dhiya vamabhajah syama || badittha parvatana shi prithivi | pra ya bhumi
    pravatvati mahna jinoshi || mahini || stomasastva vicarini pratishtobhantyaktubhih | praya vaja masyasyarjuni
    || ridudarena sakhya saceya yo ma na rishye ddharyashva pitah | ayam yyasme tasma indra shshimi vancharumagm
    rijishi | somo vishva nyatasa vanani narvagindra mpratimanani debhuh || pra shciketendraya brahma
    jamadagni rarcann | vrisha yanta ryaccha grinate dhartra ndrigmha || sabadhaste mada brahmakritah
    saparyann | arko va ya tturate somacaksha dindro dadhate prithsu turyam || vasha tte vishnavasa a
    krinomi tanme jushasva shipivishta havyam | || || vardhantu tva sushtutayo giro me yuya tte adya shipivishta
    nama shshagm sami vayunani vidvan | tantva grinami tavasa mataviyan kshayantamasya rajasah parake
    || kimi tte vishno paricakshya tpra yadvavakshe shipivishto asmi | ma varpo asmadapa guha etadya ||
    agne da dashushe rayim mparinasam | shishihi nah sunumatah || da no agne shatino da ssahasrino duro
    na vajagg shrutya apa vridhi | praci dyavaprithivi brahmana kridhi suvarna shukramushaso vi didyutuh
    || agnirda dravinam ssahasra sanoti | agnirdivi havyama tatana rdhamani vibhrita purutra || ma no
    mardhi ra tu bhara | || no mardhi ra tu bhara || ghrita shshuci hiranyam | ta tte rukmo na rocata
    svadhavah || ubhe sushcandra sarpisho darvi shrinisha asani | uto na u tpupurya uktheshu shavasaspata
    ishagg stotribhya a bhara || vayo shatagm harinam yu~vasva poshyanam | uta va te sahasrino ratha a
    yatu pajasa || pra yabhi yasi dashvagmsamaccha ryasi dashvagmsamaccha niyudbhi rvayavishtaye durone
    | ni no rayigm subhojasam ssadhamada indre santu tuvivajah | kshumanto yabhirmadema || revagm idrevatah
    stota sya ttvavato maghonah | predu hariva maindramakadashakapalagm dyasi dashvagmsa || harih om ||
    || krishna yajurvediya taittiriya samhitaya ndvitiyakande dvitiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्द्वितीयकाण्डे द्वितीयः प्रश्नः श्री गुरुभ्यो नमः ।
    ह॒रिः॒ ओम् ॥ प्र॒जाप॑तिः प्र॒जा अ॑सृजत॒ ता स्सृ॒ष्टा॒ इन्द्रा॒ग्नी अपा॑गूहता॒ग्ं॒ सो॑ त्प्र॒जाप॑तिरिन्द्रा॒ग्नी
