id: sree-lalitha-sahasra-nama-stotram
category: stotram
name:
  english: Sree Lalitha Sahasra Nama Stotram
content:
  english: om || asya shri lalita divya sahasranama stotra mahamantrasya vashinyadi vagdevata rishayah
    shri lalita parabhattarika maha tripura sundari devata mama dharmartha kama moksha caturvidha phalapurushartha
    siddhyarthe lalita tripurasundari parabhattarika sahasra nama jape viniyogah karanyasah aim angushthabhyam
    namah klim tarjanibhyam namah sauh anamikabhyam namah klim kanishthikabhyam namah aim karatala karaprishthabhyam
    namah anganyasah aim hridayaya namah klim netratrayaya vaushat bhurbhuvassuvaromiti digbandhah dhyanam
    arunam karuna tarangitakshim dhritapashankusha pushpabanacapam | animadibhi ravritam mayukhaih ahamityeva
    vibhavaye bhavanim || || dhyayet padmasanastham vikasitavadanam padma patrayatakshim hemabham pitavastram
    karakalita lasaddhemapadmam varangim | sarvalankarayuktam sakalamabhayadam bhaktanamram bhavanim shri
    vidyam shantamurtim sakala suranutam sarvasampat || sakunkuma vilepana malikacumbi kasturikam samanda
    hasitekshanam sasharacapa pashankusham | ashesha janamohini marunamalya bhushojjvalam japakusuma bhasuram
    japavidhau smare dambikam || || sindhuraruna vigraham trinayanam manikya maulisphura ttaranayaka shekharam
    smitamukhi mapina vakshoruham | panibhya malipurna ratna cashakam raktotpalam bibhratim saumyam ratnaghatastha
    rakta caranam dhyayetparamambikam || || lamityadi pancapujam vibhavayet lam prithivi tattvatmikayai
    shri lalitadevyai gandham parikalpayami ham akasha tattvatmikayai shri lalitadevyai pushpam parikalpayami
    yam vayu tattvatmikayai shri lalitadevyai dhupam parikalpayami ram vahni tattvatmikayai shri lalitadevyai
    dipam parikalpayami vam amrita tattvatmikayai shri lalitadevyai amrita naivedyam parikalpayami sam
    sarva tattvatmikayai shri lalitadevyai tambuladi sarvopacaran parikalpayami gururbrahma gururvishnuh
    gururdevo maheshvarah | gurussakshat parabrahma tasmai shri gurave namah || harih om shrimata simhasaneshvari
    | cidagni samanvita | ragasvarupa krodhakarankushojjvala || sayaka | nijaruna prabhapura majjad ||
    campakashoka punnaga saugandhika lasatkaca kuruvinda manishreni kanatkotira mandita || || ashtami
    candra vibhraja dalikasthala shobhita | mukhacandra kalankabha mriganabhi visheshaka || || vadanasmara
    mangalya grihatorana cillika | vaktralakshmi parivaha calanminabha locana || || navacampaka pushpabha
    nasadanda virajita | tarakanti tiraskari nasabharana bhasura || || kadamba manjariklipta karnapura
    manohara | tatanka yugalibhuta tapanodupa mandala || || padmaraga shiladarsha paribhavi kapolabhuh
    | navavidruma bimbashri nyakkari radanacchada || || shuddha vidyankurakara dvijapankti dvayojjvala
    | karpuraviti kamoda samakarshaddigantara || || nijasallapa madhurya vinirbhartsita kacchapi | mandasmita
    prabhapura majjat || anakalita sadrishya cubuka shri virajita | kameshabaddha mangalya sutrashobhita
    kandhara || || kanakangada keyura kamaniya bhujanvita | ratnagraiveya cintaka lolamukta phalanvita
    || || kameshvara premaratna mani pratipanastani| nabhyalavala romali lataphala kucadvayi || || lakshyaromalata
    dharata samunneya madhyama | stanabhara dalan madhya pattabandha valitraya || || arunaruna kausumbha
    vastra bhasvat katitati | ratnakinkini karamya rashanadama bhushita || || kamesha jnata saubhagya
    mardavoru dvayanvita | manikya makutakara janudvaya virajita || || indragopa parikshipta smara tunabha
    janghika | gudhagulpha kurmaprishtha jayishnu prapadanvita || || nakhadidhiti sanchanna namajjana
    tamoguna | padadvaya prabhajala parakrita saroruha || || shinjana manimanjira mandita shri padambuja
    | marali mandagamana || sarvaruna'navadyangi sarvabharana bhushita | shivakameshvarankastha || sumeru
    madhyashringastha shrimannagara nayika | cintamani grihantastha pancabrahmasanasthita || || mahapadmatavi
    samstha kadamba vanavasini | sudhasagara madhyastha kamakshi kamadayini || || devarshi ganasanghata
    stuyamanatma vaibhava | bhandasura vadhodyukta shaktisena samanvita || || sampatkari samarudha sindhura
    vrajasevita | ashvarudhadhishthitashva kotikoti bhiravrita || || cakraraja ratharudha sarvayudha parishkrita
    | geyacakra ratharudha mantrini parisevita || || kiricakra ratharudha dandanatha puraskrita | jvalamalini
    kakshipta vahniprakara madhyaga || || bhandasainya vadhodyukta shakti vikramaharshita | nitya parakramatopa
    nirikshana samutsuka || || bhandaputra vadhodyukta balavikrama nandita | mantrinyamba viracita vishanga
    vadhatoshita || vishukra pranaharana varahi viryanandita | kameshvara mukhaloka kalpita shri ganeshvara
    || || mahaganesha nirbhinna vighnayantra praharshita | bhandasurendra nirmukta shastra pratyastra
    varshini || || karanguli nakhotpanna narayana dashakritih | mahapashupatastragni nirdagdhasura sainika
    || || kameshvarastra nirdagdha sabhandasura shunyaka | brahmopendra mahendradi devasamstuta vaibhava
    || || haranetragni sandagdha kama sanjivanaushadhih | shrimadvagbhava kutaika svarupa mukhapankaja
    || || kanthadhah katiparyanta madhyakuta svarupini | shaktikutaika tapanna katyadhobhaga dharini ||
    mulakuta traya kalevara | kulamritaika rasika brahmagranthi vibhedini | manipuranta rudita vishnugranthi
    vibhedini || || ajna cakrantaralastha rudragranthi vibhedini | sahasrarambuja rudha sudhasarabhi varshini
    || bhavaranya kutharika | bhadrapriya rbhaktasaubhagya dayini || sharaccandranibhanana | shatodari
    nirashraya | nityashuddha rnirishvara | niraga lobhanashini | nihsamshaya bhedanashini | nirnasha
    doshavarjita | sarvajna sadgatiprada | sarveshvari sarvamantra svarupini || manonmani | maheshvari
    mahapataka nashini | mahamaya mahashakti rmaharatih || rmahayogeshvareshvari || mahasana | mahayaga
    kramaradhya || maheshvara mahakalpa mahatandava sakshini | mahakamesha mahishi mahatripura sundari
    || || catuhshashtyupacaradhya catushshashti kalamayi | maha catushshashti koti yogini ganasevita ||
    candramandalamadhyaga | carurupa cakraraja niketana | parvati pancabrahma svarupini | cinmayi || dhyanadhyatri
    dhyeyarupa dharmadharma vivarjita | vishvarupa sarvavastha vivarjita | srishtikartri tirodhanakarishvari
    | sadashivanugrahada || bhanumandala madhyastha || unmesha nimishotpanna vipanna bhuvanavalih | sahasrashirshavadana
    varnashrama vidhayini | nijajnarupanigama punyapunya phalaprada || || shruti simanta sindhurikrita
    padabjadhulika | sakalagama sandoha shuktisamputa mauktika || bhuvaneshvari | ambika haribrahmendra
    sevita || namarupa vivarjita | hrinkari ranatkinkini mekhala || ratipriya | rakshakari kadamba kusumapriya
    | kalyani kadambaripriya | varada vindhyacala nivasini | vidhatri kshetra kshetrajna palini | kshayavriddhi
    vinirmukta kshetrapala samarcita || vandaru janavatsala | vagvadini pashupasha vimocani | samhritashesha
    pashanda || tapatrayagni santapta samahladana candrika | taruni cideka rasarupini | svatmanandalavibhuta
    brahmadyananda santatih || || kameshvara prananadi kamapujita | shringara rasasampurna bindumandala
    vasini | rahoyaga kramaradhya sakshivarjita | shadangadevata yukta shadgunya paripurita || nirvana
    sukhadayini | nitya shrikanthardha sharirini || parameshvari | mulaprakriti ravyakta vyakta'vyakta
    svarupini || vidya'vidya svarupini | mahakamesha nayana kumudahlada kaumudi || || bhaktaharda tamobheda
    bhanumad bhanusantatih | shivaduti shishtapujita | aprameya rjadatmika | gayatri dvijabrinda nishevita
    || pancakoshantarasthita | nissimamahima || madaghurnita raktakshi madapatala gandabhuh | candana
    dravadigdhangi campeya kusuma priya || kuleshvari | kulakundalaya kaula margatatpara sevita || lolakshi
    kamarupini | malini suranayika | kalakanthi vayo'vastha vivarjita | siddheshvari || vishuddhi cakranilaya
    trilocana | khatvangadi praharana pashuloka bhayankari | amritadi mahashakti samvrita vadanadvaya
    | damshtrojjvala || kalaratryadi shaktyaughavrita snigdhaudanapriya | mahavirendra varada rakinyamba
    svarupini || vadanatraya samyuta | vajradikayudhopeta damaryadibhi ravrita || gudanna pritamanasa
    | samasta bhaktasukhada lakinyamba svarupini || || svadhishthanambujagata caturvaktra manohara | shuladyayudha
    sampanna bandinyadi samanvita | || muladharambujarudha 'sthisamsthita | ankushadi praharana || mudgaudanasakta
    citta sakinyambasvarupini | ajna cakrabjanilaya samanvita | haridrannaika rasika sarvavarnopa shobhita
    | sarvayudhadhara || sarvaudana pritacitta yakinyamba svarupini | svaha punyashravana kirtana | pulomajarcita
    viyadadi jagatprasuh | sarvavyadhi prashamani sarvamrityu nivarini || kalikalmasha nashini | katyayani
    || tambula purita mukhi dadimi kusumaprabha | mrigakshi nikhileshvari | maitryadi vasanalabhya prajnana
    ghanarupini | madhvipanalasa matrika varna rupini || mrinala mridudorlata | mahaniya rmahasamrajyashalini
    || kamasevita | shrishodashakshari vidya || katakshakinkari bhuta kamala kotisevita | shirahsthita
    phalasthendra dhanuhprabha || trikonantara dipika | dakshayani || darandolita dirghakshi darahasojjvalanmukhi
    | gurumurti daharakasha rupini | pratipanmukhya rakanta tithimandala pujita || kavyalapa vinodini
    | sacamara ramavani savyadakshina sevita || pavanakritih | anekakoti brahmanda janani kaivalya padadayini
    | tripura sindhura tilakancita | uma 'varada vagadhishvari | dhyanagamya || sarvavedanta samvedya
    satyananda svarupini | lopamudrarcita lilaklipta brahmandamandala || vedyavarjita | yogini || icchashakti
    jnanashakti kriyashakti svarupini | sarvadhara lokayatra vidhayini | ekakini brahmatmaikya svarupini
    | brihati bhavabhava vivarjita | sukharadhya rajapitha niveshita nijashrita || caturanga baleshvari
    | samrajyadayini sarvaloka vashankari | sarvarthadatri saccidananda rupini || || deshakala'paricchinna
    sarvamohini | sarasvati || sarvopadhi vinirmukta sadashiva pativrata | sampradayeshvari dakshinamurti
    rupini | sanakadi samaradhya shivajnana pradayini || priyankari | namaparayana prita || mithya jagadadhishthana
    muktida muktirupini | lasyapriya paparanya davanala | daurbhagyatula vatula jaradhvanta raviprabha
    || || bhagyabdhicandrika bhaktacittakeki ghanaghana | rogaparvata dambholi rmrityudaru kutharika ||
    candamunda'sura nishudini || vishvadharini | trivargadatri japapushpa nibhakritih | ojovati patali
    kusumapriya | mahati mandara kusumapriya || vishvatomukhi | pratyagrupa || martanda bhairavaradhya
    mantrini nyastarajyadhuh | tripureshi || satyajnana'nandarupa samarasya parayana | kapardini muni
    manasa hamsika | satyavrata budharcita | prasavitri pitharupini | vishrinkhala mulavigraha rupini
    | bhavajna bhavarogaghni bhavacakra pravartini || || janmamrityu jaratapta jana vishranti dayini |
    sarvopanisha shantyatita kalatmika || ganalolupa | kalpanarahita || karyakarana nirmukta kamakeli
    tarangita | kanat || ajakshaya vinirmukta mugdha kshipraprasadini | antarmukha samaradhya bahirmukha
    sudurlabha || tripuramalini | niramaya || samsarapanka nirmagna samuddharana pandita | yajnapriya
    dhanadhanya vivardhini | viprapriya vishnurupini | ayoni nadarupini | vijnana kalana tattvamartha
    svarupini | samaganapriya || savyapasavya margastha sarvapadvi nivarini | svastha || caitanyarghya
    samaradhya caitanya kusumapriya | sadodita darasmera mukhambuja | kaulini kevala 'narghya kaivalya
    padadayini || shrutisamstuta vaibhava | manasvini vamakeshvari | pancayajnapriya pancapreta mancadhishayini
    || panca sankhyopacarini | shashvati dharmavardhini | lokatita || bandhuka kusuma prakhya lilavinodini
    | sumangali || suvasinyarcanaprita shuddha manasa | bindu tarpana santushta || dashamudra samaradhya
    tripura shrivashankari | jnanamudra jnanajneya svarupini || trikonaga | anaghadbhuta caritra vanchitartha
    pradayini || || abhyasati shayajnata shadadhvatita rupini | avyaja karunamurti rajnanadhvanta dipika
    || sarvanullanghya shasana | shri cakrarajanilaya shrimattripura sundari || shivashaktyaikya rupini
    lalitambika | evam shrilalitadevya namnam sahasrakam jaguh || || || iti shri brahmandapurane shri
    hayagrivagastya samvade shri lalita rahasyanama sahasrastotra kathanam nama dvitiyo'dhyayah ||
  devanagari: ओम् ॥ अस्य श्री ललिता दिव्य सहस्रनाम स्तोत्र महामन्त्रस्य वशिन्यादि वाग्देवता ऋषयः श्री
    ललिता पराभट्टारिका महा त्रिपुर सुन्दरी देवता मम धर्मार्थ काम मोक्ष चतुर्विध फलपुरुषार्थ सिद्ध्यर्थे
    ललिता त्रिपुरसुन्दरी पराभट्टारिका सहस्र नाम जपे विनियोगः करन्यासः ऐं अङ्गुष्ठाभ्यां नमः क्लीं तर्जनीभ्यां
    नमः सौः अनामिकाभ्यां नमः क्लीं कनिष्ठिकाभ्यां नमः ऐं करतल करपृष्ठाभ्यां नमः अङ्गन्यासः ऐं हृदयाय नमः
    क्लीं नेत्रत्रयाय वौषट् भूर्भुवस्सुवरोमिति दिग्बन्धः ध्यानं अरुणां करुणा तरङ्गिताक्षीं धृतपाशाङ्कुश
    पुष्पबाणचापाम् । अणिमादिभि रावृतां मयूखैः अहमित्येव विभावये भवानीम् ॥ ॥ ध्यायेत् पद्मासनस्थां विकसितवदनां
    पद्म पत्रायताक्षीं हेमाभां पीतवस्त्रां करकलित लसद्धेमपद्मां वराङ्गीम् । सर्वालङ्कारयुक्तां सकलमभयदां
    भक्तनम्रां भवानीं श्री विद्यां शान्तमूर्तिं सकल सुरनुतां सर्वसम्पत् ॥ सकुङ्कुम विलेपना मलिकचुम्बि
    कस्तूरिकां समन्द हसितेक्षणां सशरचाप पाशाङ्कुशाम् । अशेष जनमोहिनी मरुणमाल्य भूषोज्ज्वलां जपाकुसुम भासुरां
    जपविधौ स्मरे दम्बिकाम् ॥ ॥ सिन्धूरारुण विग्रहां त्रिणयनां माणिक्य मौलिस्फुर त्तारानायक शेखरां स्मितमुखी
    मापीन वक्षोरुहाम् । पाणिभ्या मलिपूर्ण रत्न चषकं रक्तोत्पलं बिभ्रतीं सौम्यां रत्नघटस्थ रक्त चरणां ध्यायेत्परामम्बिकाम्
    ॥ ॥ लमित्यादि पञ्चपूजां विभावयेत् लं पृथिवी तत्त्वात्मिकायै श्री ललितादेव्यै गन्धं परिकल्पयामि हं
    आकाश तत्त्वात्मिकायै श्री ललितादेव्यै पुष्पं परिकल्पयामि यं वायु तत्त्वात्मिकायै श्री ललितादेव्यै
    धूपं परिकल्पयामि रं वह्नि तत्त्वात्मिकायै श्री ललितादेव्यै दीपं परिकल्पयामि वं अमृत तत्त्वात्मिकायै
    श्री ललितादेव्यै अमृत नैवेद्यं परिकल्पयामि सं सर्व तत्त्वात्मिकायै श्री ललितादेव्यै ताम्बूलादि सर्वोपचारान्
    परिकल्पयामि गुरुर्ब्रह्मा गुरुर्विष्णुः गुरुर्देवो महेश्वरः । गुरुस्साक्षात् परब्रह्म तस्मै श्री गुरवे
    नमः ॥ हरिः ॐ श्रीमाता सिंहासनेश्वरी । चिदग्नि समन्विता । रागस्वरूप क्रोधाकाराङ्कुशोज्ज्वला ॥ सायका
    । निजारुण प्रभापूर मज्जद् ॥ चम्पकाशोक पुन्नाग सौगन्धिक लसत्कचा कुरुविन्द मणिश्रेणी कनत्कोटीर मण्डिता
    ॥ ॥ अष्टमी चन्द्र विभ्राज दलिकस्थल शोभिता । मुखचन्द्र कलङ्काभ मृगनाभि विशेषका ॥ ॥ वदनस्मर माङ्गल्य
    गृहतोरण चिल्लिका । वक्त्रलक्ष्मी परीवाह चलन्मीनाभ लोचना ॥ ॥ नवचम्पक पुष्पाभ नासादण्ड विराजिता । ताराकान्ति
    तिरस्कारि नासाभरण भासुरा ॥ ॥ कदम्ब मञ्जरीकॢप्त कर्णपूर मनोहरा । ताटङ्क युगलीभूत तपनोडुप मण्डला ॥ ॥
    पद्मराग शिलादर्श परिभावि कपोलभूः । नवविद्रुम बिम्बश्री न्यक्कारि रदनच्छदा ॥ ॥ शुद्ध विद्याङ्कुराकार
    द्विजपङ्क्ति द्वयोज्ज्वला । कर्पूरवीटि कामोद समाकर्षद्दिगन्तरा ॥ ॥ निजसल्लाप माधुर्य विनिर्भर्त्सित
    कच्छपी । मन्दस्मित प्रभापूर मज्जत् ॥ अनाकलित सादृश्य चुबुक श्री विराजिता । कामेशबद्ध माङ्गल्य सूत्रशोभित
    कन्धरा ॥ ॥ कनकाङ्गद केयूर कमनीय भुजान्विता । रत्नग्रैवेय चिन्ताक लोलमुक्ता फलान्विता ॥ ॥ कामेश्वर
    प्रेमरत्न मणि प्रतिपणस्तनी। नाभ्यालवाल रोमालि लताफल कुचद्वयी ॥ ॥ लक्ष्यरोमलता धारता समुन्नेय मध्यमा
    । स्तनभार दलन् मध्य पट्टबन्ध वलित्रया ॥ ॥ अरुणारुण कौसुम्भ वस्त्र भास्वत् कटीतटी । रत्नकिङ्किणि कारम्य
    रशनादाम भूषिता ॥ ॥ कामेश ज्ञात सौभाग्य मार्दवोरु द्वयान्विता । माणिक्य मकुटाकार जानुद्वय विराजिता
    ॥ ॥ इन्द्रगोप परिक्षिप्त स्मर तूणाभ जङ्घिका । गूढगुल्फा कूर्मपृष्ठ जयिष्णु प्रपदान्विता ॥ ॥ नखदीधिति
    सञ्छन्न नमज्जन तमोगुणा । पदद्वय प्रभाजाल पराकृत सरोरुहा ॥ ॥ शिञ्जान मणिमञ्जीर मण्डित श्री पदाम्बुजा
    । मराली मन्दगमना ॥ सर्वारुणाऽनवद्याङ्गी सर्वाभरण भूषिता । शिवकामेश्वराङ्कस्था ॥ सुमेरु मध्यशृङ्गस्था
    श्रीमन्नगर नायिका । चिन्तामणि गृहान्तस्था पञ्चब्रह्मासनस्थिता ॥ ॥ महापद्माटवी संस्था कदम्ब वनवासिनी
    । सुधासागर मध्यस्था कामाक्षी कामदायिनी ॥ ॥ देवर्षि गणसङ्घात स्तूयमानात्म वैभवा । भण्डासुर वधोद्युक्त
    शक्तिसेना समन्विता ॥ ॥ सम्पत्करी समारूढ सिन्धुर व्रजसेविता । अश्वारूढाधिष्ठिताश्व कोटिकोटि भिरावृता
    ॥ ॥ चक्रराज रथारूढ सर्वायुध परिष्कृता । गेयचक्र रथारूढ मन्त्रिणी परिसेविता ॥ ॥ किरिचक्र रथारूढ दण्डनाथा
    पुरस्कृता । ज्वालामालिनि काक्षिप्त वह्निप्राकार मध्यगा ॥ ॥ भण्डसैन्य वधोद्युक्त शक्ति विक्रमहर्षिता
    । नित्या पराक्रमाटोप निरीक्षण समुत्सुका ॥ ॥ भण्डपुत्र वधोद्युक्त बालाविक्रम नन्दिता । मन्त्रिण्यम्बा
    विरचित विषङ्ग वधतोषिता ॥ विशुक्र प्राणहरण वाराही वीर्यनन्दिता । कामेश्वर मुखालोक कल्पित श्री गणेश्वरा
    ॥ ॥ महागणेश निर्भिन्न विघ्नयन्त्र प्रहर्षिता । भण्डासुरेन्द्र निर्मुक्त शस्त्र प्रत्यस्त्र वर्षिणी
    ॥ ॥ कराङ्गुलि नखोत्पन्न नारायण दशाकृतिः । महापाशुपतास्त्राग्नि निर्दग्धासुर सैनिका ॥ ॥ कामेश्वरास्त्र
    निर्दग्ध सभण्डासुर शून्यका । ब्रह्मोपेन्द्र महेन्द्रादि देवसंस्तुत वैभवा ॥ ॥ हरनेत्राग्नि सन्दग्ध
    काम सञ्जीवनौषधिः । श्रीमद्वाग्भव कूटैक स्वरूप मुखपङ्कजा ॥ ॥ कण्ठाधः कटिपर्यन्त मध्यकूट स्वरूपिणी ।
    शक्तिकूटैक तापन्न कट्यधोभाग धारिणी ॥ मूलकूट त्रय कलेवरा । कुलामृतैक रसिका ब्रह्मग्रन्थि विभेदिनी ।
    मणिपूरान्त रुदिता विष्णुग्रन्थि विभेदिनी ॥ ॥ आज्ञा चक्रान्तरालस्था रुद्रग्रन्थि विभेदिनी । सहस्राराम्बुजा
    रूढा सुधासाराभि वर्षिणी ॥ भवारण्य कुठारिका । भद्रप्रिया र्भक्तसौभाग्य दायिनी ॥ शरच्चन्द्रनिभानना ।
    शातोदरी निराश्रया । नित्यशुद्धा र्निरीश्वरा । नीरागा लोभनाशिनी । निःसंशया भेदनाशिनी । निर्नाशा दोषवर्जिता
    । सर्वज्ञा सद्गतिप्रदा । सर्वेश्वरी सर्वमन्त्र स्वरूपिणी ॥ मनोन्मनी । माहेश्वरी महापातक नाशिनी । महामाया
    महाशक्ति र्महारतिः ॥ र्महायोगेश्वरेश्वरी ॥ महासना । महायाग क्रमाराध्या ॥ महेश्वर महाकल्प महाताण्डव
    साक्षिणी । महाकामेश महिषी महात्रिपुर सुन्दरी ॥ ॥ चतुःषष्ट्युपचाराढ्या चतुष्षष्टि कलामयी । महा चतुष्षष्टि
    कोटि योगिनी गणसेविता ॥ चन्द्रमण्डलमध्यगा । चारुरूपा चक्रराज निकेतना । पार्वती पञ्चब्रह्म स्वरूपिणी
    । चिन्मयी ॥ ध्यानध्यातृ ध्येयरूपा धर्माधर्म विवर्जिता । विश्वरूपा सर्वावस्था विवर्जिता । सृष्टिकर्त्री
    तिरोधानकरीश्वरी । सदाशिवानुग्रहदा ॥ भानुमण्डल मध्यस्था ॥ उन्मेष निमिषोत्पन्न विपन्न भुवनावलिः । सहस्रशीर्षवदना
    वर्णाश्रम विधायिनी । निजाज्ञारूपनिगमा पुण्यापुण्य फलप्रदा ॥ ॥ श्रुति सीमन्त सिन्धूरीकृत पादाब्जधूलिका
    । सकलागम सन्दोह शुक्तिसम्पुट मौक्तिका ॥ भुवनेश्वरी । अम्बिका हरिब्रह्मेन्द्र सेविता ॥ नामरूप विवर्जिता
    । ह्रीङ्कारी रणत्किङ्किणि मेखला ॥ रतिप्रिया । रक्षाकरी कदम्ब कुसुमप्रिया । कल्याणी कादम्बरीप्रिया
    । वरदा विन्ध्याचल निवासिनी । विधात्री क्षेत्र क्षेत्रज्ञ पालिनी । क्षयवृद्धि विनिर्मुक्ता क्षेत्रपाल
    समर्चिता ॥ वन्दारु जनवत्सला । वाग्वादिनी पशुपाश विमोचनी । संहृताशेष पाषण्डा ॥ तापत्रयाग्नि सन्तप्त
    समाह्लादन चन्द्रिका । तरुणी चिदेक रसरूपिणी । स्वात्मानन्दलवीभूत ब्रह्माद्यानन्द सन्ततिः ॥ ॥ कामेश्वर
    प्राणनाडी कामपूजिता । शृङ्गार रससम्पूर्णा बिन्दुमण्डल वासिनी । रहोयाग क्रमाराध्या साक्षिवर्जिता ।
    षडङ्गदेवता युक्ता षाड्गुण्य परिपूरिता ॥ निर्वाण सुखदायिनी । नित्या श्रीकण्ठार्ध शरीरिणी ॥ परमेश्वरी
    । मूलप्रकृति रव्यक्ता व्यक्ताऽव्यक्त स्वरूपिणी ॥ विद्याऽविद्या स्वरूपिणी । महाकामेश नयना कुमुदाह्लाद
    कौमुदी ॥ ॥ भक्तहार्द तमोभेद भानुमद् भानुसन्ततिः । शिवदूती शिष्टपूजिता । अप्रमेया र्जडात्मिका । गायत्री
    द्विजबृन्द निषेविता ॥ पञ्चकोशान्तरस्थिता । निस्सीममहिमा ॥ मदघूर्णित रक्ताक्षी मदपाटल गण्डभूः । चन्दन
    द्रवदिग्धाङ्गी चाम्पेय कुसुम प्रिया ॥ कुलेश्वरी । कुलकुण्डालया कौल मार्गतत्पर सेविता ॥ लोलाक्षी कामरूपिणी
    । मालिनी सुरनायिका । कालकण्ठी वयोऽवस्था विवर्जिता । सिद्धेश्वरी ॥ विशुद्धि चक्रनिलया त्रिलोचना । खट्वाङ्गादि
    प्रहरणा पशुलोक भयङ्करी । अमृतादि महाशक्ति संवृता वदनद्वया । दंष्ट्रोज्ज्वला ॥ कालरात्र्यादि शक्त्यौघवृता
    स्निग्धौदनप्रिया । महावीरेन्द्र वरदा राकिण्यम्बा स्वरूपिणी ॥ वदनत्रय संयुता । वज्रादिकायुधोपेता डामर्यादिभि
    रावृता ॥ गुडान्न प्रीतमानसा । समस्त भक्तसुखदा लाकिन्यम्बा स्वरूपिणी ॥ ॥ स्वाधिष्ठानाम्बुजगता चतुर्वक्त्र
    मनोहरा । शूलाद्यायुध सम्पन्ना बन्दिन्यादि समन्विता । ॥ मूलाधाराम्बुजारूढा ऽस्थिसंस्थिता । अङ्कुशादि
    प्रहरणा ॥ मुद्गौदनासक्त चित्ता साकिन्यम्बास्वरूपिणी । आज्ञा चक्राब्जनिलया समन्विता । हरिद्रान्नैक
    रसिका सर्ववर्णोप शोभिता । सर्वायुधधरा ॥ सर्वौदन प्रीतचित्ता याकिन्यम्बा स्वरूपिणी । स्वाहा पुण्यश्रवण
    कीर्तना । पुलोमजार्चिता वियदादि जगत्प्रसूः । सर्वव्याधि प्रशमनी सर्वमृत्यु निवारिणी ॥ कलिकल्मष नाशिनी
    । कात्यायनी ॥ ताम्बूल पूरित मुखी दाडिमी कुसुमप्रभा । मृगाक्षी निखिलेश्वरी । मैत्र्यादि वासनालभ्या
    प्रज्ञान घनरूपिणी । माध्वीपानालसा मातृका वर्ण रूपिणी ॥ मृणाल मृदुदोर्लता । महनीया र्महासाम्राज्यशालिनी
    ॥ कामसेविता । श्रीषोडशाक्षरी विद्या ॥ कटाक्षकिङ्करी भूत कमला कोटिसेविता । शिरःस्थिता फालस्थेन्द्र
    धनुःप्रभा ॥ त्रिकोणान्तर दीपिका । दाक्षायणी ॥ दरान्दोलित दीर्घाक्षी दरहासोज्ज्वलन्मुखी । गुरुमूर्ति
    दहराकाश रूपिणी । प्रतिपन्मुख्य राकान्त तिथिमण्डल पूजिता ॥ काव्यालाप विनोदिनी । सचामर रमावाणी सव्यदक्षिण
    सेविता ॥ पावनाकृतिः । अनेककोटि ब्रह्माण्ड जननी कैवल्य पददायिनी । त्रिपुरा सिन्धूर तिलकाञ्चिता । उमा
    ऽवरदा वागधीश्वरी । ध्यानगम्या ॥ सर्ववेदान्त संवेद्या सत्यानन्द स्वरूपिणी । लोपामुद्रार्चिता लीलाकॢप्त
    ब्रह्माण्डमण्डला ॥ वेद्यवर्जिता । योगिनी ॥ इच्छाशक्ति ज्ञानशक्ति क्रियाशक्ति स्वरूपिणी । सर्वाधारा
    लोकयात्रा विधायिनी । एकाकिनी ब्रह्मात्मैक्य स्वरूपिणी । बृहती भावाभाव विवर्जिता । सुखाराध्या राजपीठ
    निवेशित निजाश्रिता ॥ चतुरङ्ग बलेश्वरी । साम्राज्यदायिनी सर्वलोक वशङ्करी । सर्वार्थदात्री सच्चिदानन्द
    रूपिणी ॥ ॥ देशकालाऽपरिच्छिन्ना सर्वमोहिनी । सरस्वती ॥ सर्वोपाधि विनिर्मुक्ता सदाशिव पतिव्रता । सम्प्रदायेश्वरी
    दक्षिणामूर्ति रूपिणी । सनकादि समाराध्या शिवज्ञान प्रदायिनी ॥ प्रियङ्करी । नामपारायण प्रीता ॥ मिथ्या
    जगदधिष्ठाना मुक्तिदा मुक्तिरूपिणी । लास्यप्रिया पापारण्य दवानला । दौर्भाग्यतूल वातूला जराध्वान्त रविप्रभा
    ॥ ॥ भाग्याब्धिचन्द्रिका भक्तचित्तकेकि घनाघना । रोगपर्वत दम्भोलि र्मृत्युदारु कुठारिका ॥ चण्डमुण्डाऽसुर
    निषूदिनी ॥ विश्वधारिणी । त्रिवर्गदात्री जपापुष्प निभाकृतिः । ओजोवती पाटली कुसुमप्रिया । महती मन्दार
    कुसुमप्रिया ॥ विश्वतोमुखी । प्रत्यग्रूपा ॥ मार्ताण्ड भैरवाराध्या मन्त्रिणी न्यस्तराज्यधूः । त्रिपुरेशी
    ॥ सत्यज्ञानाऽनन्दरूपा सामरस्य परायणा । कपर्दिनी मुनि मानस हंसिका । सत्यव्रता बुधार्चिता । प्रसवित्री
    पीठरूपिणी । विशृङ्खला मूलविग्रह रूपिणी । भावज्ञा भवरोगघ्नी भवचक्र प्रवर्तिनी ॥ ॥ जन्ममृत्यु जरातप्त
    जन विश्रान्ति दायिनी । सर्वोपनिष शान्त्यतीत कलात्मिका ॥ गानलोलुपा । कल्पनारहिता ॥ कार्यकारण निर्मुक्ता
    कामकेलि तरङ्गिता । कनत् ॥ अजाक्षय विनिर्मुक्ता मुग्धा क्षिप्रप्रसादिनी । अन्तर्मुख समाराध्या बहिर्मुख
    सुदुर्लभा ॥ त्रिपुरमालिनी । निरामया ॥ संसारपङ्क निर्मग्न समुद्धरण पण्डिता । यज्ञप्रिया धनधान्य विवर्धिनी
    । विप्रप्रिया विष्णुरूपिणी । अयोनि नादरूपिणी । विज्ञान कलना तत्त्वमर्थ स्वरूपिणी । सामगानप्रिया ॥
    सव्यापसव्य मार्गस्था सर्वापद्वि निवारिणी । स्वस्था ॥ चैतन्यार्घ्य समाराध्या चैतन्य कुसुमप्रिया । सदोदिता
    दरस्मेर मुखाम्बुजा । कौलिनी केवला ऽनर्घ्या कैवल्य पददायिनी ॥ श्रुतिसंस्तुत वैभवा । मनस्विनी वामकेश्वरी
    । पञ्चयज्ञप्रिया पञ्चप्रेत मञ्चाधिशायिनी ॥ पञ्च सङ्ख्योपचारिणी । शाश्वती धर्मवर्धिनी । लोकातीता ॥
    बन्धूक कुसुम प्रख्या लीलाविनोदिनी । सुमङ्गली ॥ सुवासिन्यर्चनप्रीता शुद्ध मानसा । बिन्दु तर्पण सन्तुष्टा
    ॥ दशमुद्रा समाराध्या त्रिपुरा श्रीवशङ्करी । ज्ञानमुद्रा ज्ञानज्ञेय स्वरूपिणी ॥ त्रिकोणगा । अनघाद्भुत
    चारित्रा वाञ्छितार्थ प्रदायिनी ॥ ॥ अभ्यासाति शयज्ञाता षडध्वातीत रूपिणी । अव्याज करुणामूर्ति रज्ञानध्वान्त
    दीपिका ॥ सर्वानुल्लङ्घ्य शासना । श्री चक्रराजनिलया श्रीमत्त्रिपुर सुन्दरी ॥ शिवशक्त्यैक्य रूपिणी ललिताम्बिका
    । एवं श्रीललितादेव्या नाम्नां साहस्रकं जगुः ॥ ॥ ॥ इति श्री ब्रह्माण्डपुराणे श्री हयग्रीवागस्त्य संवादे
    श्री ललिता रहस्यनाम साहस्रस्तोत्र कथनं नाम द्वितीयोऽध्यायः ॥
