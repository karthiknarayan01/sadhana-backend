id: govindashtakam
category: stotram
name:
  english: Govindashtakam
  devanagari: गोविन्दाष्टकम् (शङ्कराचार्यविरचितम्)
content:
  english: satyam jnanamanantam nityamanakasham paramakasham goshthapranganarinkhanalolamanayasam paramayasam
    | mayakalpitananakaramanakaram bhuvanakaram kshmamanathamanatham pranamata govindam paramanandam ||
    1|| mritsnamatsiheti yashodatadanashaishava santrasam vyaditavaktralokitalokalokacaturdashalokalim
    | lokatrayapuramulastambham lokalokamanalokam lokesham paramesham pranamata govindam paramanandam
    || 2|| traivishtaparipuviraghnam kshitibharaghnam bhavarogaghnam kaivalyam navanitaharamanaharam bhuvanaharam
    | vaimalyasphutacetovrittivisheshabhasamanabhasam shaivam kevalashantam pranamata govindam paramanandam
    || 3|| gopalam prabhulilavigrahagopalam kulagopalam gopikhelanagovardhanadhritililalalitagopalam |
    gobhirnigaditagovindasphutanamanam bahunamanam gopigocarapathikam pranamata govindam paramanandam
    || 4|| gopimandalagoshthibhedam bhedavasthamabhedabham (goshti) shashvad|hgokhuranirdhutodgatadhulidhusarasaubhagyam
    | shraddhabhaktigrihitanandamacintyam cintitasadbhavam cintamanimahimanam pranamata govindam paramanandam
    || 5|| snanavyakulayoshid|hvastramupadayagamuparudham vyaditsantiratha digvastra hyupudatumupakarshantam
    | nirdhutadvayashokavimoham buddham buddherantastham sattamatrashariram pranamata govindam paramanandam
    || 6|| kantam karanakaranamadimanadim kalamanabhasam kalindigatakaliyashirasi muhurnrityantam nrityantam
    | kalam kalakalatitam kalitashesham kalidoshaghnam kalatrayagatihetum pranamata govindam paramanandam
    || 7|| vrindavanabhuvi vrindarakaganavrindaradhyam vande'ham kundabhamalamandasmerasudhanandam suhridanandam
    | vandyasheshamahamunimanasavandyanandapadadvandvam vandyasheshagunabdhim pranamata govindam paramanandam
    || 8|| govindashtakametadadhite govindarpitaceta yo govindacyuta madhava vishno gokulanayaka krishneti
    | govindanghrisarojadhyanasudhajaladhautasamastagho govindam paramanandamritamantahstham sa tamabhyeti
    || || iti shrimacchankaracaryaviracitam shrigovindashtakam sampurnam ||
  devanagari: सत्यं ज्ञानमनन्तं नित्यमनाकाशं परमाकाशं गोष्ठप्राङ्गणरिङ्खणलोलमनायासं परमायासम् । मायाकल्पितनानाकारमनाकारं
    भुवनाकारं क्ष्मामानाथमनाथं प्रणमत गोविन्दं परमानन्दम् ॥ १॥ मृत्स्नामत्सीहेति यशोदाताडनशैशव सन्त्रासं
    व्यादितवक्त्रालोकितलोकालोकचतुर्दशलोकालिम् । लोकत्रयपुरमूलस्तम्भं लोकालोकमनालोकं लोकेशं परमेशं प्रणमत
    गोविन्दं परमानन्दम् ॥ २॥ त्रैविष्टपरिपुवीरघ्नं क्षितिभारघ्नं भवरोगघ्नं कैवल्यं नवनीताहारमनाहारं भुवनाहारम्
    । वैमल्यस्फुटचेतोवृत्तिविशेषाभासमनाभासं शैवं केवलशान्तं प्रणमत गोविन्दं परमानन्दम् ॥ ३॥ गोपालं प्रभुलीलाविग्रहगोपालं
    कुलगोपालं गोपीखेलनगोवर्धनधृतिलीलालालितगोपालम् । गोभिर्निगदितगोविन्दस्फुटनामानं बहुनामानं गोपीगोचरपथिकं
    प्रणमत गोविन्दं परमानन्दम् ॥ ४॥ गोपीमण्डलगोष्ठीभेदं भेदावस्थमभेदाभं (गोष्टी) शश्वद्।ह्गोखुरनिर्धूतोद्गतधूलीधूसरसौभाग्यम्
    । श्रद्धाभक्तिगृहीतानन्दमचिन्त्यं चिन्तितसद्भावं चिन्तामणिमहिमानं प्रणमत गोविन्दं परमानन्दम् ॥ ५॥
    स्नानव्याकुलयोशिद्।ह्वस्त्रमुपादायागमुपारूढं व्यादित्सन्तीरथ दिग्वस्त्रा ह्युपुदातुमुपाकर्षन्तम् ।
    निर्धूतद्वयशोकविमोहं बुद्धं बुद्धेरन्तस्थं सत्तामात्रशरीरं प्रणमत गोविन्दं परमानन्दम् ॥ ६॥ कान्तं
    कारणकारणमादिमनादिं कालमनाभासं कालिन्दीगतकालियशिरसि मुहुर्नृत्यन्तं नृत्यन्तम् । कालं कालकलातीतं कलिताशेषं
    कलिदोषघ्नं कालत्रयगतिहेतुं प्रणमत गोविन्दं परमानन्दम् ॥ ७॥ वृन्दावनभुवि वृन्दारकगणवृन्दाराध्यं वन्देऽहं
    कुन्दाभामलमन्दस्मेरसुधानन्दं सुहृदानन्दम् । वन्द्याशेषमहामुनिमानसवन्द्यानन्दपदद्वन्द्वं वन्द्याशेषगुणाब्धिं
    प्रणमत गोविन्दं परमानन्दम् ॥ ८॥ गोविन्दाष्टकमेतदधीते गोविन्दार्पितचेता यो गोविन्दाच्युत माधव विष्णो
    गोकुलनायक कृष्णेति । गोविन्दाङ्घ्रिसरोजध्यानसुधाजलधौतसमस्ताघो गोविन्दं परमानन्दामृतमन्तःस्थं स तमभ्येति
    ॥ ॥ इति श्रीमच्छङ्कराचार्यविरचितं श्रीगोविन्दाष्टकं सम्पूर्णम् ॥
