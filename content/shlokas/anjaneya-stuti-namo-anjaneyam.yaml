id: anjaneya-stuti-namo-anjaneyam
category: stotram
name:
  english: Anjaneya Stuti (Namo Anjaneyam)
content:
  english: namo anjaneyam namo divya kayam namo vayuputram namo surya mitram | namo nikhila raksha karam
    rudra rupam namo marutim rama dutam namami || namo vanaresham namo divya bhasam namo vajra deham namo
    bramha tejam | namo shatru samharakam vajra kayam namo marutim rama dutam namami || shri anjaneyam
    namaste prasannajaneyam namaste || namo vanarendram namo vishvapalam namo vishva modam namo deva shuram
    | namo gagana sancaritam pavana tanayam namo marutim rama dutam namami || namo ramadasam namo bhakta
    palam namo ishva ramsham namo loka viram | namo bhakta cinta manim gadha panim namo marutim rama dutam
    namami || shri anjaneyam namaste prasannajaneyam namaste || namo papa nasham namo supra kasham namo
    veda saram namo nirvikaram | namo nikhila sampujitam deva sreshtam namo marutim rama dutam namami
    || namo kama rupam namo raudra rupam namo vayu tanayam namo vana rakram | namo bhakta varadayakam
    atmavasam namo marutim rama dutam namami || shri anjaneyam namaste prasannajaneyam namaste || namo
    ramya namam namo bhava punitam namo ciranjivam namo vishva pujyam | namo shatru nashana karam dhira
    rupam namo marutim rama dutam namami || namo deva devam namo bhakta ratnam namo abhaya varadam namo
    panca vadanam | namo shubhada shubha mangalam anjaneyam namo marutim rama dutam namami || shri anjaneyam
    namaste prasannanjaneyam namaste ||
  devanagari: नमो आन्जनेयं नमो दिव्य कायम् नमो वायुपुत्रं नमो सूर्य मित्रम् । नमो निखिल रक्शा करं रुद्र
    रूपम् नमो मारुतिं रम दूतं नमामि ॥ नमो वानरेशं नमो दिव्य भासम् नमो वज्र देहं नमो ब्रम्ह तेजम् । नमो
    शत्रु सम्हारकं वज्र कायम् नमो मारुतिं राम दूतं नमामि ॥ श्री आन्जनेयं नमस्ते प्रसन्नाजनेयं नमस्ते ॥
    नमो वानरेन्द्रं नमो विश्वपालम् नमो विश्व मोदं नमो देव शूरम् । नमो गगन सन्चारितं पवन तनयम् नमो मारुतिं
    राम दूतं नमामि ॥ नमो रामदासं नमो भक्त पालम् नमो ईश्व राम्शं नमो लोक वीरम् । नमो भक्त चिन्ता मणिं गधा
    पाणिम् नमो मारुतिं राम दूतं नमामि ॥ श्री आन्जनेयं नमस्ते प्रसन्नाजनेयं नमस्ते ॥ नमो पाप नाशं नमो सुप्र
    काशम् नमो वेद सारं नमो निर्विकारम् । नमो निखिल सम्पूजितं देव स्रेश्तम् नमो मारुतिं राम दूतं नमामि
    ॥ नमो काम रूपं नमो रौद्र रूपम् नमो वायु तनयं नमो वान राक्रम् । नमो भक्त वरदायकं आत्मवासम् नमो मारुतिं
    राम दूतं नमामि ॥ श्री आन्जनेयं नमस्ते प्रसन्नाजनेयं नमस्ते ॥ नमो रम्य नामं नमो भव पुनीतम् नमो चिरन्जीवं
    नमो विश्व पूज्यम् । नमो शत्रु नाशन करं धीर रूपम् नमो मारुतिं राम दूतं नमामि ॥ नमो देव देवं नमो भक्त
    रत्नम् नमो अभय वरदं नमो पञ्च वदनम् । नमो शुभद शुभ मङ्गलं आन्जनेयम् नमो मारुतिं राम दूतं नमामि ॥ श्री
    आन्जनेयं नमस्ते प्रसन्नान्जनेयं नमस्ते ॥
