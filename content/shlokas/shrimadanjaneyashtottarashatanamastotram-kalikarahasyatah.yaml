id: shrimadanjaneyashtottarashatanamastotram-kalikarahasyatah
category: stotram
name:
  english: shrimadanjaneyashtottarashatanamastotram kalikarahasyatah
  devanagari: श्रीमदाञ्जनेयाष्टोत्तरशतनामस्तोत्रम् कालिकारहस्यतः
content:
  english: '|| shrimadanjaneyashtottarashatanamastotram kalikarahasyatah || anjaneyo mahaviro hanumanmarutatmajah
    | tatvajnanapradah sitadevimudrapradayakah || 1|| ashokavanikacchetta sarvamayavibhanjanah | sarvabandhavimokta
    ca rakshovidhvamsakarakah || 2|| paravidyapariharah parashauryavinashanah | paramantranirakarta parayantraprabhedakah
    || 3|| sarvagrahavinashi ca bhimasenasahayakrit | sarvaduhkhaharah sarvalokacari manojavah || 4||
    parijatadrumulasthah sarvamantrasvarupavan | sarvatantrasvarupi ca sarvayantratmakastatha || 5|| kapishvaro
    mahakayah sarvarogaharah prabhuh | balasiddhikarah sarvavidyasampatpradayakah || 6|| kapisenanayakashca
    bhavishyaccaturananah | kumarabrahmacari ca ratnakundaladiptiman || 7|| sancaladvalasannaddhalambamanashikhojjvalah
    | gandharvavidyatattvajno mahabalaparakramah || 8|| karagrihavimokta ca shrinkhalabandhamocakah |
    sagarottarakah prajno ramadutah pratapavan || 9|| vanarah kesarisutah sitashokanivarakah | anjanagarbhasambhuto
    balarkasadrishananah || 10|| vibhishanapriyakaro dashagrivakulantakah | lakshmanapranadata ca vajrakayo
    mahadyutih || 11|| ciranjivi ramabhakto daityakaryavighatakah | akshahanta kancanabhah pancavaktro
    mahatapah || 12|| lankinibhanjanah shriman simhikapranabhanjanah | gandhamadanashailastho lankapuravidahakah
    || 13|| sugrivasacivo dhirah shuro daityakulantakah | surarcito mahateja ramacudamanipradah || 14||
    kamarupi pingalaksho vardhimainakapujitah | kabalikritamartandamandalo vijitendiryah || 15|| ramasugrivasandhata
    maharavanamardanah | sphatikabho vagadhisho navavyakritipanditah || 16|| caturbahurdinabandhurmahatma
    bhaktavatsalah | sanjivananagaharta shucirvagmi dridhavratah || 17|| kalanemipramathano harimarkatamarkatah
    | dantah shantah prasannatma shatakanthamadapahrit || 18|| yogi ramakathalolah sitanveshanapanditah
    | vajradamshtro vajranakho rudraviryasamudbhavah || 19|| indrajitprahitamoghabrahmastravinivarakah
    | parthadhvajagrasamvasi sharapanjarabhedakah || 20|| dashabahulorkapujyo jambavatpriti vardhanah
    | sitasameta shriramabhadrapujadhurandharah || 21|| ityevam shrihanumato namnamashtottaram shatam
    || yah pathecchrinuyannityam sarvankamanavapnuyat || 22|| || iti shrimadanjaneyashtottarashatanamastotram
    sampurnam ||'
  devanagari: ॥ श्रीमदाञ्जनेयाष्टोत्तरशतनामस्तोत्रम् कालिकारहस्यतः ॥ आञ्जनेयो महावीरो हनुमान्मारुतात्मजः
    । तत्वज्ञानप्रदः सीतादेवीमुद्राप्रदायकः ॥ १॥ अशोकवनिकाच्छेत्ता सर्वमायाविभञ्जनः । सर्वबन्धविमोक्ता
    च रक्षोविध्वंसकारकः ॥ २॥ परविद्यापरीहारः परशौर्यविनाशनः । परमन्त्रनिराकर्ता परयन्त्रप्रभेदकः ॥ ३॥
    सर्वग्रहविनाशी च भीमसेनसहायकृत् । सर्वदुःखहरः सर्वलोकचारी मनोजवः ॥ ४॥ पारिजातद्रुमूलस्थः सर्वमन्त्रस्वरूपवान्
    । सर्वतन्त्रस्वरूपी च सर्वयन्त्रात्मकस्तथा ॥ ५॥ कपीश्वरो महाकायः सर्वरोगहरः प्रभुः । बलसिद्धिकरः सर्वविद्यासम्पत्प्रदायकः
    ॥ ६॥ कपिसेनानायकश्च भविष्यच्चतुराननः । कुमारब्रह्मचारी च रत्नकुण्डलदीप्तिमान् ॥ ७॥ सञ्चलद्वालसन्नद्धलम्बमानशिखोज्ज्वलः
    । गन्धर्वविद्यातत्त्वज्ञो महाबलपराक्रमः ॥ ८॥ कारागृहविमोक्ता च शृङ्खलाबन्धमोचकः । सागरोत्तारकः प्राज्ञो
    रामदूतः प्रतापवान् ॥ ९॥ वानरः केसरिसुतः सीताशोकनिवारकः । अञ्जनागर्भसम्भूतो बालार्कसदृशाननः ॥ १०॥ विभीषणप्रियकरो
    दशग्रीवकुलान्तकः । लक्ष्मणप्राणदाता च वज्रकायो महाद्युतिः ॥ ११॥ चिरञ्जीवी रामभक्तो दैत्यकार्यविघातकः
    । अक्षहन्ता काञ्चनाभः पञ्चवक्त्रो महातपाः ॥ १२॥ लङ्किणीभञ्जनः श्रीमान् सिंहिकाप्राणभञ्जनः । गन्धमादनशैलस्थो
    लङ्कापुरविदाहकः ॥ १३॥ सुग्रीवसचिवो धीरः शूरो दैत्यकुलान्तकः । सुरार्चितो महातेजा रामचूडामणिप्रदः ॥
    १४॥ कामरूपी पिङ्गलाक्षो वार्धिमैनाकपूजितः । कबलीकृतमार्तण्डमण्डलो विजितेन्दिर्यः ॥ १५॥ रामसुग्रीवसन्धाता
    महारावणमर्दनः । स्फटिकाभो वागधीशो नवव्याकृतिपण्डितः ॥ १६॥ चतुर्बाहुर्दीनबन्धुर्महात्मा भक्तवत्सलः
    । सञ्जीवननगाहर्ता शुचिर्वाग्मी दृढव्रतः ॥ १७॥ कालनेमिप्रमथनो हरिमर्कटमर्कटः । दान्तः शान्तः प्रसन्नात्मा
    शतकण्ठमदापहृत् ॥ १८॥ योगी रामकथालोलः सीतान्वेषणपण्डितः । वज्रदंष्ट्रो वज्रनखो रुद्रवीर्यसमुद्भवः ॥
    १९॥ इन्द्रजित्प्रहितामोघब्रह्मास्त्रविनिवारकः । पार्थध्वजाग्रसंवासी शरपञ्जरभेदकः ॥ २०॥ दशबाहुलोर्कपूज्यो
    जाम्बवत्प्रीति वर्धनः । सीतासमेत श्रीरामभद्रपूजाधुरन्धरः ॥ २१॥ इत्येवं श्रीहनुमतो नाम्नामष्टोत्तरं
    शतम् ॥ यः पठेच्छृणुयान्नित्यं सर्वान्कामानवाप्नुयात् ॥ २२॥ ॥ इति श्रीमदाञ्जनेयाष्टोत्तरशतनामस्तोत्रं
    सम्पूर्णम् ॥
