id: parabrahma
category: upanishad
name:
  english: parabrahma
  devanagari: परब्रह्म
content:
  english: kritopavitatvam caturgunikritya caturvimshatitattvapadanatantukrittvam navatattvamekameva ||
    parambrahma tatpratisarayogyatvadbahumargapravrittim kalpayanti | sarvesham brahmadinam devarshinam
    manushyanam murtireka | brahmaikameva | brahmanatvamekameva | varnashramacaravisheshah prithakprithak
    shikhavarnashraminamekakaiva | apavargasya yateh shikhayajnopavitamulam pranavamekameva vadanti |
    hamsah shikha | pranava upavitam | nadah samdhanam | esha dharmo netaro dharmah | tatkathamiti | pranavahamso
    nadastrivritsutram svahridi caitanye tishthati trividham brahma | tadviddhi prapancikashikhopavitam
    tyajet | sashikham vapanam kritva bahihsutram tyajedbudhah | yadaksharam parambrahma tatsutramiti
    dharayet || 1|| punarjanmanivrityartham mokshasyaharnisham smaret | sucanatsutramityuktam sutram nama
    param padam || 2|| tatsutram viditam yena sa mumukshuh sa bhikshukah | sa vedavitsadacarah sa viprah
    panktipavanah || 3|| yena sarvamidam protam sutre manigana iva | tatsutram dharayedyogi yogavidbrahmano
    yatih || 4|| bahihsutram tyajedvipro yogavijnanatatparah | brahmabhavamidam sutram dharayedyah sa
    muktibhak || 5|| nashucitvam na cocchishtam tasya sutrasya dharanat | sutramantargatam yesham jnanayajnopavitinam
    || 6|| ye tu sutravido loke te ca yajnopavitinah | jnanashikhino jnananishtha jnanayajnopavitinah
    | jnanameva param tesham pavitram jnanamiritam || 7|| agneriva shikha nanya yasya jnanamayi shikha
    | sa shikhityucyate vidvannetare keshadharinah || 8|| karmanyadhikritah ye tu vaidike laukike'pi va
    | brahmanabhasamatrena jivante kukshipurakah | vrajante nirayam te tu punarjanmani janmani || 9||
    vamamsadakshakanthyantam brahmasutram tu savyatah | antarbahirivatyartham tattvatantusamanvitam ||
    10|| nabhyadibrahmarandhrantapramanam dharayetsudhih | tebhirdharyamidam sutram kriyangam tantunirmitam
    || 11|| shikha jnanamayi yasya upavitam ca tanmayam | brahmanyam sakalam tasya netaresham tu kimcana
    || 12|| idam yajnopavitam tu paramam yatparayanam | vidvanyajnopaviti samdharayedyah sa muktibhak
    || 13|| bahirantashcopaviti viprah samnyastumarhati | ekayajnopaviti tu naiva samnyastumarhati ||
    14|| tasmatsarvaprayatnena mokshapekshi bhavedyatih | bahihsutram parityajya svantahsutram tu dharayet
    || 15|| bahihprapancashikhopavititvamanadritya pranavahamsashikhopavititvamavalambya mokshasadhanam
    kuryadityaha bhagavanchaunaka ityupanishat || om bhadram karnebhih sha
  devanagari: कृतोपवीतत्वं चतुर्गुणीकृत्य चतुर्विंशतितत्त्वापादनतन्तुकृत्त्वं नवतत्त्वमेकमेव ॥ परंब्रह्म
    तत्प्रतिसरयोग्यत्वाद्बहुमार्गप्रवृत्तिं कल्पयन्ति । सर्वेषां ब्रह्मादीनां देवर्षीणां मनुष्याणां मूर्तिरेका
    । ब्रह्मैकमेव । ब्राह्मणत्वमेकमेव । वर्णाश्रमाचारविशेषाः पृथक्पृथक् शिखावर्णाश्रमिणामेककैव । अपवर्गस्य
    यतेः शिखायज्ञोपवीतमूलं प्रणवमेकमेव वदन्ति । हंसः शिखा । प्रणव उपवीतम् । नादः संधानम् । एष धर्मो नेतरो
    धर्मः । तत्कथमिति । प्रणवहंसो नादस्त्रिवृत्सूत्रं स्वहृदि चैतन्ये तिष्ठति त्रिविधं ब्रह्म । तद्विद्धि
    प्रापञ्चिकशिखोपवीतं त्यजेत् । सशिखं वपनं कृत्वा बहिःसूत्रं त्यजेद्बुधः । यदक्षरं परंब्रह्म तत्सूत्रमिति
    धारयेत् ॥ १॥ पुनर्जन्मनिवृत्यर्थं मोक्षस्याहर्निशं स्मरेत् । सूचनात्सूत्रमित्युक्तं सूत्रं नाम परं
    पदम् ॥ २॥ तत्सूत्रं विदितं येन स मुमुक्षुः स भिक्षुकः । स वेदवित्सदाचारः स विप्रः पङ्क्तिपावनः ॥ ३॥
    येन सर्वमिदं प्रोतं सूत्रे मणिगणा इव । तत्सूत्रं धारयेद्योगी योगविद्ब्राह्मणो यतिः ॥ ४॥ बहिःसूत्रं
    त्यजेद्विप्रो योगविज्ञानतत्परः । ब्रह्मभावमिदं सूत्रं धारयेद्यः स मुक्तिभाक् ॥ ५॥ नाशुचित्वं न चोच्छिष्टं
    तस्य सूत्रस्य धारणात् । सूत्रमन्तर्गतं येषां ज्ञानयज्ञोपवीतिनाम् ॥ ६॥ ये तु सूत्रविदो लोके ते च यज्ञोपवीतिनः
    । ज्ञानशिखिनो ज्ञाननिष्ठा ज्ञानयज्ञोपवीतिनः । ज्ञानमेव परं तेषां पवित्रं ज्ञानमीरितम् ॥ ७॥ अग्नेरिव
    शिखा नान्या यस्य ज्ञानमयी शिखा । स शिखीत्युच्यते विद्वान्नेतरे केशधारिणः ॥ ८॥ कर्मण्यधिकृतः ये तु
    वैदिके लौकिकेऽपि वा । ब्राह्मणाभासमात्रेण जीवन्ते कुक्षिपूरकाः । व्रजन्ते निरयं ते तु पुनर्जन्मनि
    जन्मनि ॥ ९॥ वामांसदक्षकण्ठ्यन्तं ब्रह्मसूत्रं तु सव्यतः । अन्तर्बहिरिवात्यर्थं तत्त्वतन्तुसमन्वितम्
    ॥ १०॥ नाभ्यादिब्रह्मरन्ध्रान्तप्रमाणं धारयेत्सुधीः । तेभिर्धार्यमिदं सूत्रं क्रियाङ्गं तन्तुनिर्मितम्
    ॥ ११॥ शिखा ज्ञानमयी यस्य उपवीतं च तन्मयम् । ब्राह्मण्यं सकलं तस्य नेतरेषां तु किंचन ॥ १२॥ इदं यज्ञोपवीतं
    तु परमं यत्परायणम् । विद्वान्यज्ञोपवीती संधारयेद्यः स मुक्तिभाक् ॥ १३॥ बहिरन्तश्चोपवीती विप्रः संन्यस्तुमर्हति
    । एकयज्ञोपवीती तु नैव संन्यस्तुमर्हति ॥ १४॥ तस्मात्सर्वप्रयत्नेन मोक्षापेक्षी भवेद्यतिः । बहिःसूत्रं
    परित्यज्य स्वान्तःसूत्रं तु धारयेत् ॥ १५॥ बहिःप्रपञ्चशिखोपवीतित्वमनादृत्य प्रणवहंसशिखोपवीतित्वमवलम्ब्य
    मोक्षसाधनं कुर्यादित्याह भगवाञ्छौनक इत्युपनिषत् ॥ ॐ भद्रं कर्णेभिः श
