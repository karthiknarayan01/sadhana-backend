id: akrurakritamshrikrishnastotram-2
category: stotram
name:
  english: akrurakritamshrikrishnastotram 2
  devanagari: अक्रूरकृतंश्रीकृष्णस्तोत्रम् २
content:
  english: akrurakritam 2 shrikrishnastotram akrura uvaca | tato vijnatasadbhavah sa tu danapatistatha
    | tushtava sarvavijnanamayamacyutamishvaram || 5
  devanagari: अक्रूरकृतं २ श्रीकृष्णस्तोत्रम् अक्रूर उवाच । ततो विज्ञातसद्भावः स तु दानपतिस्तथा । तुष्टाव
    सर्वविज्ञानमयमच्युतमीश्वरम् ॥ ५
meaning: {}
