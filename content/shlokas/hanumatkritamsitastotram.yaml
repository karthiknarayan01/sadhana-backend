id: hanumatkritamsitastotram
category: stotram
name:
  english: hanumatkritamsitastotram
  devanagari: हनुमत्कृतंसीतास्तोत्रम्
content:
  english: 50|| daridryaranasamhartrim bhaktanamishtadayinim | videharajatanayam raghavanandakarinim ||
    51|| bhumerduhitaram vidyam namami prakritim shivam | paulastyaishvaryasamhartrim bhaktabhishtam sarasvatim
    || 52|| pativratadhurinam tvam namami janakatmajam | anugrahaparamriddhimanagham harivallabham ||
    53|| atmavidyam trayirupamumarupam namamyaham | prasadabhimukhim lakshmim kshirabdhitanayam shubham
    || 54|| namami candrabhaginim sitam sarvangasundarim | namami dharmanilayam karunam vedamataram ||
    55|| padmalayam padmahastam vishnuvakshasthalalayam | namami candranilayam sitam candranibhananam
    || 56|| ahladarupinim siddhim shivam shivakarim satim | namami vishvajananim ramacandreshtavallabham
    | sitam sarvanavadyangim bhajami satatam hrida || 57|| iti shriskandapurane brahmakhande setukhande
    shatcatvarimsha
  devanagari: ५०॥ दारिद्र्यरणसंहर्त्रीं भक्तानामिष्टदायिनीम् । विदेहराजतनयां राघवानन्दकारिणीम् ॥ ५१॥ भूमेर्दुहितरं
    विद्यां नमामि प्रकृतिं शिवाम् । पौलस्त्यैश्वर्यसंहर्त्रीं भक्ताभीष्टां सरस्वतीम् ॥ ५२॥ पतिव्रताधुरीणां
    त्वां नमामि जनकात्मजाम् । अनुग्रहपरामृद्धिमनघां हरिवल्लभाम् ॥ ५३॥ आत्मविद्यां त्रयीरूपामुमारूपां नमाम्यहम्
    । प्रसादाभिमुखीं लक्ष्मीं क्षीराब्धितनयां शुभाम् ॥ ५४॥ नमामि चन्द्रभगिनीं सीतां सर्वाङ्गसुन्दरीम्
    । नमामि धर्मनिलयां करुणां वेदमातरम् ॥ ५५॥ पद्मालयां पद्महस्तां विष्णुवक्षस्थलालयाम् । नमामि चन्द्रनिलयां
    सीतां चन्द्रनिभाननाम् ॥ ५६॥ आह्लादरूपिणीं सिद्धिं शिवां शिवकरीं सतीम् । नमामि विश्वजननीं रामचन्द्रेष्टवल्लभाम्
    । सीतां सर्वानवद्याङ्गीं भजामि सततं हृदा ॥ ५७॥ इति श्रीस्कन्दपुराणे ब्रह्मखण्डे सेतुखण्डे षट्चत्वारिंशा
