id: narayaniyam-dashaka-1
category: stotram
name:
  english: Narayaniyam Dashaka 1
content:
  english: sandranandavabodhatmakamanupamitam kaladeshavadhibhyam nirmuktam nityamuktam nigamashatasahasrena
    nirbhasyamanam | aspashtam drishtamatre punarurupurusharthatmakam brahma tatvam tattavadbhati sakshad
    gurupavanapure hanta bhagyam jananam || || evandurlabhyavastunyapi sulabhataya hastalabdhe yadanyat
    tanva vaca dhiya va bhajati bata janah kshudrataiva sphuteyam | ete tavadvayam tu sthirataramanasa
    vishvapidapahatyai nishsheshatmanamenam gurupavanapuradhishamevashrayamah || || sattvam yattat parabhyamaparikalanato
    nirmalam tena tavat bhutairbhutendriyaiste vapuriti bahushah shruyate vyasavakyam| tat svacchtvadyadacchaditaparasukhacidgarbhanirbhasarupam
    tasmin dhanya ramante shrutimatimadhure sugrahe vigrahe te || || nishkampe nityapurne niravadhiparamanandapiyusharupe
    nirlinanekamuktavalisubhagatame nirmalabrahmasindhau | kallolollasatulyam khalu vimalataram sattvamahustadatma
    kasmanno nishkalastvam sakala iti vacastvatkalasveva bhuman || || nirvyaparo'pi nishkaranamaja bhajase
    yatkriyamikshanakhyam tenaivodeti lina prakritirasatikalpa'pi kalpadikale| tasyah samshuddhamamsham
    kamapi tamatirodhayakam sattvarupam sa tvam dhritva dadhasi svamahimavibhavakuntha vaikuntha rupam||
    || tatte pratyagradharadharalalitakalayavalikelikaram lavanyasyaikasaram sukritijanadrisham purnapunyavataram|
    lakshminishshankalilanilayanamamritasyandasandohamantah sincat sancintakanam vapuranukalaye marutagaranatha
    || || kashta te srishticeshta bahutarabhavakhedavaha jivabhaja mityevam purvamalocitamajita maya naivamadyabhijane|
    nocejjivah katham va madhurataramidam tvadvapushcidrasardram netraih shrotraishca pitva paramarasasudhambhodhipure
    rameran|| || namranam sannidhatte satatamapi purastairanabhyarthitana pyarthan kamanajasram vitarati
    paramanandasandram gatim ca| ittham nishsheshalabhyo niravadhikaphalah parijato hare tvam kshudram
    tam shakravatidrumamabhilashati vyarthamarthivrajo'yam|| || karunyatkamamanyam dadati khalu pare svatmadastvam
    vishesha daishvaryadishate'nye jagati parajane svatmano'pishvarastvam| tvayyuccairaramanti pratipadamadhure
    cetanah sphitabhagya stvam catmarama evetyatulagunaganadhara shaure namaste|| || aishvaryam shankaradishvaraviniyamanam
    vishvatejoharanam tejassamhari viryam vimalamapi yasho nisprihaishcopagitam| angasanga sada shrirakhilavidasi
    na kvapi te sangavarta tadvatagaravasin murahara bhagavacchabdamukhyashrayo'si||
  devanagari: सान्द्रानन्दावबोधात्मकमनुपमितं कालदेशावधिभ्यां निर्मुक्तं नित्यमुक्तं निगमशतसहस्रेण निर्भास्यमानम्
    । अस्पष्टं दृष्टमात्रे पुनरुरुपुरुषार्थात्मकं ब्रह्म तत्वं तत्तावद्भाति साक्षाद् गुरुपवनपुरे हन्त
    भाग्यं जनानाम् ॥ ॥ एवन्दुर्लभ्यवस्तुन्यपि सुलभतया हस्तलब्धे यदन्यत् तन्वा वाचा धिया वा भजति बत जनः
    क्षुद्रतैव स्फुटेयम् । एते तावद्वयं तु स्थिरतरमनसा विश्वपीडापहत्यै निश्शेषात्मानमेनं गुरुपवनपुराधीशमेवाश्रयामः
    ॥ ॥ सत्त्वं यत्तत् पराभ्यामपरिकलनतो निर्मलं तेन तावत् भूतैर्भूतेन्द्रियैस्ते वपुरिति बहुशः श्रूयते
    व्यासवाक्यम्। तत् स्वच्छ्त्वाद्यदाच्छादितपरसुखचिद्गर्भनिर्भासरूपं तस्मिन् धन्या रमन्ते श्रुतिमतिमधुरे
    सुग्रहे विग्रहे ते ॥ ॥ निष्कम्पे नित्यपूर्णे निरवधिपरमानन्दपीयूषरूपे निर्लीनानेकमुक्तावलिसुभगतमे निर्मलब्रह्मसिन्धौ
    । कल्लोलोल्लासतुल्यं खलु विमलतरं सत्त्वमाहुस्तदात्मा कस्मान्नो निष्कलस्त्वं सकल इति वचस्त्वत्कलास्वेव
    भूमन् ॥ ॥ निर्व्यापारोऽपि निष्कारणमज भजसे यत्क्रियामीक्षणाख्यां तेनैवोदेति लीना प्रकृतिरसतिकल्पाऽपि
    कल्पादिकाले। तस्याः संशुद्धमंशं कमपि तमतिरोधायकं सत्त्वरूपं स त्वं धृत्वा दधासि स्वमहिमविभवाकुण्ठ
    वैकुण्ठ रूपं॥ ॥ तत्ते प्रत्यग्रधाराधरललितकलायावलीकेलिकारं लावण्यस्यैकसारं सुकृतिजनदृशां पूर्णपुण्यावतारम्।
    लक्ष्मीनिश्शङ्कलीलानिलयनममृतस्यन्दसन्दोहमन्तः सिञ्चत् सञ्चिन्तकानां वपुरनुकलये मारुतागारनाथ ॥ ॥ कष्टा
    ते सृष्टिचेष्टा बहुतरभवखेदावहा जीवभाजा मित्येवं पूर्वमालोचितमजित मया नैवमद्याभिजाने। नोचेज्जीवाः कथं
    वा मधुरतरमिदं त्वद्वपुश्चिद्रसार्द्रं नेत्रैः श्रोत्रैश्च पीत्वा परमरससुधाम्भोधिपूरे रमेरन्॥ ॥ नम्राणां
    सन्निधत्ते सततमपि पुरस्तैरनभ्यर्थितान प्यर्थान् कामानजस्रं वितरति परमानन्दसान्द्रां गतिं च। इत्थं
    निश्शेषलभ्यो निरवधिकफलः पारिजातो हरे त्वं क्षुद्रं तं शक्रवाटीद्रुममभिलषति व्यर्थमर्थिव्रजोऽयम्॥ ॥
    कारुण्यात्काममन्यं ददति खलु परे स्वात्मदस्त्वं विशेषा दैश्वर्यादीशतेऽन्ये जगति परजने स्वात्मनोऽपीश्वरस्त्वम्।
    त्वय्युच्चैरारमन्ति प्रतिपदमधुरे चेतनाः स्फीतभाग्या स्त्वं चात्माराम एवेत्यतुलगुणगणाधार शौरे नमस्ते॥
    ॥ ऐश्वर्यं शङ्करादीश्वरविनियमनं विश्वतेजोहराणां तेजस्संहारि वीर्यं विमलमपि यशो निस्पृहैश्चोपगीतम्।
    अङ्गासङ्गा सदा श्रीरखिलविदसि न क्वापि ते सङ्गवार्ता तद्वातागारवासिन् मुरहर भगवच्छब्दमुख्याश्रयोऽसि॥
