id: shiva-tandava-stotram
category: stotram
name:
  english: Shiva Tandava Stotram
content:
  english: jatatavigalajjalapravahapavitasthale galevalambya lambitam bhujangatungamalikam | damaddamaddamaddamanninadavaddamarvayam
    cakara candatandavam tanotu nah shivah shivam || || jatakatahasambhramabhramannilimpanirjhari vilolavicivallarivirajamanamurdhani
    | dhagaddhagaddhagajjvalallalatapattapavake kishoracandrashekhare ratih pratikshanam mama || || dharadharendranandinivilasabandhubandhura
    sphuraddigantasantatipramodamanamanase | kripakatakshadhoraniniruddhadurdharapadi kvaciddigambare
    mano vinodametu vastuni || || jatabhujangapingalasphuratphanamaniprabha kadambakunkumadravapraliptadigvadhumukhe
    | madandhasindhurasphurattvaguttariyamedure mano vinodamadbhutam bibhartu bhutabhartari || || sahasralocanaprabhrityasheshalekhashekhara
    prasunadhulidhorani vidhusaranghripithabhuh | bhujangarajamalaya nibaddhajatajutakah shriyai ciraya
    jayatam cakorabandhushekharah || || lalatacatvarajvaladdhananjayasphulingabha nipitapancasayakam namannilimpanayakam
    | sudhamayukhalekhaya virajamanashekharam mahakapalisampadeshirojatalamastu nah || || karalaphalapattikadhagaddhagaddhagajjvala
    ddhananjayadharikritapracandapancasayake | dharadharendranandinikucagracitrapatraka prakalpanaikashilpini
    trilocane matirmama || || navinameghamandali niruddhadurdharasphurat kuhunishithinitamah prabandhabandhukandharah
    | nilimpanirjharidharastanotu krittisindhurah kalanidhanabandhurah shriyam jagaddhurandharah || ||
    praphullanilapankajaprapancakalimaprabha vilambikanthakandaliruciprabaddhakandharam | smaracchidam
    puracchidam bhavacchidam makhacchidam gajacchidandhakacchidam tamantakacchidam bhaje || || agarvasarvamangalakalakadambamanjari
    rasapravahamadhuri vijrimbhanamadhuvratam | smarantakam purantakam bhavantakam makhantakam gajantakandhakantakam
    tamantakantakam bhaje || || jayatvadabhravibhramabhramadbhujangamashvasa dvinirgamatkramasphuratkaralaphalahavyavat
    | dhimiddhimiddhimidhvananmridangatungamangala dhvanikramapravartita pracandatandavah shivah || ||
    drishadvicitratalpayorbhujangamauktikasrajor garishtharatnaloshthayoh suhridvipakshapakshayoh | trinaravindacakshushoh
    prajamahimahendrayoh samam pravartayanmanah kada sadashivam bhaje || || kada nilimpanirjharinikunjakotare
    vasan vimuktadurmatih sada shirahsthamanjalim vahan | vimuktalolalocano lalataphalalagnakah shiveti
    mantramuccaran sada sukhi bhavamyaham || || imam hi nityamevamuktamuttamottamam stavam pathansmaranbruvannaro
    vishuddhimetisantatam | hare gurau subhaktimashu yati nanyatha gatim vimohanam hi dehinam sushankarasya
    cintanam || || pujavasanasamaye dashavaktragitam yah shambhupujanaparam pathati pradoshe | tasya sthiram
    rathagajendraturangayuktam lakshmim sadaiva sumukhim pradadati shambhuh ||
  devanagari: जटाटवीगलज्जलप्रवाहपावितस्थले गलेवलम्ब्य लम्बितां भुजङ्गतुङ्गमालिकाम् । डमड्डमड्डमड्डमन्निनादवड्डमर्वयं
    चकार चण्डताण्डवं तनोतु नः शिवः शिवम् ॥ ॥ जटाकटाहसम्भ्रमभ्रमन्निलिम्पनिर्झरी विलोलवीचिवल्लरीविराजमानमूर्धनि
    । धगद्धगद्धगज्ज्वलल्ललाटपट्टपावके किशोरचन्द्रशेखरे रतिः प्रतिक्षणं मम ॥ ॥ धराधरेन्द्रनन्दिनीविलासबन्धुबन्धुर
    स्फुरद्दिगन्तसन्ततिप्रमोदमानमानसे । कृपाकटाक्षधोरणीनिरुद्धदुर्धरापदि क्वचिद्दिगम्बरे मनो विनोदमेतु
    वस्तुनि ॥ ॥ जटाभुजङ्गपिङ्गलस्फुरत्फणामणिप्रभा कदम्बकुङ्कुमद्रवप्रलिप्तदिग्वधूमुखे । मदान्धसिन्धुरस्फुरत्त्वगुत्तरीयमेदुरे
    मनो विनोदमद्भुतं बिभर्तु भूतभर्तरि ॥ ॥ सहस्रलोचनप्रभृत्यशेषलेखशेखर प्रसूनधूलिधोरणी विधूसराङ्घ्रिपीठभूः
    । भुजङ्गराजमालया निबद्धजाटजूटकः श्रियै चिराय जायतां चकोरबन्धुशेखरः ॥ ॥ ललाटचत्वरज्वलद्धनञ्जयस्फुलिङ्गभा
    निपीतपञ्चसायकं नमन्निलिम्पनायकम् । सुधामयूखलेखया विराजमानशेखरं महाकपालिसम्पदेशिरोजटालमस्तु नः ॥ ॥
    करालफालपट्टिकाधगद्धगद्धगज्ज्वल द्धनञ्जयाधरीकृतप्रचण्डपञ्चसायके । धराधरेन्द्रनन्दिनीकुचाग्रचित्रपत्रक
    प्रकल्पनैकशिल्पिनि त्रिलोचने मतिर्मम ॥ ॥ नवीनमेघमण्डली निरुद्धदुर्धरस्फुरत् कुहूनिशीथिनीतमः प्रबन्धबन्धुकन्धरः
    । निलिम्पनिर्झरीधरस्तनोतु कृत्तिसिन्धुरः कलानिधानबन्धुरः श्रियं जगद्धुरन्धरः ॥ ॥ प्रफुल्लनीलपङ्कजप्रपञ्चकालिमप्रभा
    विलम्बिकण्ठकन्दलीरुचिप्रबद्धकन्धरम् । स्मरच्छिदं पुरच्छिदं भवच्छिदं मखच्छिदं गजच्छिदान्धकच्छिदं तमन्तकच्छिदं
    भजे ॥ ॥ अगर्वसर्वमङ्गलाकलाकदम्बमञ्जरी रसप्रवाहमाधुरी विजृम्भणामधुव्रतम् । स्मरान्तकं पुरान्तकं भवान्तकं
    मखान्तकं गजान्तकान्धकान्तकं तमन्तकान्तकं भजे ॥ ॥ जयत्वदभ्रविभ्रमभ्रमद्भुजङ्गमश्वस द्विनिर्गमत्क्रमस्फुरत्करालफालहव्यवाट्
    । धिमिद्धिमिद्धिमिध्वनन्मृदङ्गतुङ्गमङ्गल ध्वनिक्रमप्रवर्तित प्रचण्डताण्डवः शिवः ॥ ॥ दृषद्विचित्रतल्पयोर्भुजङ्गमौक्तिकस्रजोर्
    गरिष्ठरत्नलोष्ठयोः सुहृद्विपक्षपक्षयोः । तृणारविन्दचक्षुषोः प्रजामहीमहेन्द्रयोः समं प्रवर्तयन्मनः
    कदा सदाशिवं भजे ॥ ॥ कदा निलिम्पनिर्झरीनिकुञ्जकोटरे वसन् विमुक्तदुर्मतिः सदा शिरःस्थमञ्जलिं वहन् ।
    विमुक्तलोललोचनो ललाटफाललग्नकः शिवेति मन्त्रमुच्चरन् सदा सुखी भवाम्यहम् ॥ ॥ इमं हि नित्यमेवमुक्तमुत्तमोत्तमं
    स्तवं पठन्स्मरन्ब्रुवन्नरो विशुद्धिमेतिसन्ततम् । हरे गुरौ सुभक्तिमाशु याति नान्यथा गतिं विमोहनं हि
    देहिनां सुशङ्करस्य चिन्तनम् ॥ ॥ पूजावसानसमये दशवक्त्रगीतं यः शम्भुपूजनपरं पठति प्रदोषे । तस्य स्थिरां
    रथगजेन्द्रतुरङ्गयुक्तां लक्ष्मीं सदैव सुमुखीं प्रददाति शम्भुः ॥
