id: devadibhihkritam6shivastotram
category: stotram
name:
  english: devadibhihkritam6shivastotram
  devanagari: देवादिभिःकृतं६शिवस्तोत्रम्
content:
  english: devadibhih kritam 6 shivastotram dakshoktim ca saticcham ca samprapya munayah surah | pujam
    prapya satim natva jagmuh kailasabhubhritam || 67|| savitrihito brahma lakshminarayanastatha | ramaya
    sahito vishnurdevibhih sahitah surah || 68|| saptarshayah svapatnibhih sahita manavastatha | jagmuh
    kailasashikharam yatra devo maheshvarah || 69|| gatva shambhum pranamyaiva drishtva shantam ca yoginam
    | tushtuvurvividhaih stotrairbaddhanjaliputa muda || 70|| namo'ksharasvarupaya krishnanetratmane namah
    | namah sadashivakhyaya tejahpujaya te namah || 71|| vairajaputrarupaya brahmacaryaya te namah | namo
    brahmasvarupaya sada shantaya te namah || 72|| nirgunaya gunadhyaya vaishnavaya namo namah | avyaktaratridehaya
    nirvikaraya te namah || 73|| maheshaya pareshaya shiva'dhipataye namah | kvacicchantikrite kadacitkasamharine
    namah || 74|| namah sheshaya sankarshanasvarupaya te namah | namo vairagyavasaya satiragaya te namah
    || 75|| na yasya deva rishayah siddhah sadhvyashca sadhavah | viduh padam svarupam ca tasmai shivaya
    te namah || 76|| padam didrikshavo yasya yatante yoginah sada | tasmai namah pareshaya yogasthaya
    namo namah || 77|| anantasiddhiyuktaya giram duraya te namah | nama atmaprakashaya nirvanasthaya te
    namah || 78|| jnanine te namashcastu nishkriyaya''tmavedine | tapasa drak prasannaya sarvadatre ca
    te namah || 79|| trinetraya sacandraya sarvadhyakshaya te namah | sharanayataprarthyarthalabhadaya
    ca te namah || 80|| aishvaryanam pradatre te mokshadaya ca te namah | bhakteshtapurakaya'mnayodadhaye
    ca te namah || 81|| svaprakashaya nityaya pratyakdrashtre ca te namah | sakama vatha nishkama bhaktaste
    sharanagatah || 82|| aprapya siddhim yasmanna nivartante ca te namah | kacitkanya tvadartham vai karoti
    tapa utkatam || 83|| tvam katham ca'karuno'si prasanno bhava te namah | lokakaryapravahartham vicaram
    kuru shankara || 84|| adhyatmayogagamya tvam pranamamah stumo vayam | na tvam devo'suro martyo na
    tiryann dvijah pashuh || 85|| na stri na shandho na puman yo'si so'si ca te namah | vishvalayakrite
    vishvadharine pranata vayam || 86|| sankhya jnanena pashyanti samadhau yoginashca yam | bhaktah kripaya
    pashyanti trayimayam ca te namah || 87|| namo bhaktoddharakartre namaste gudhavarcase | namah pratyakshadevaya
    ca'parokshanubhutaye || 88|| kalaratrivilasaya dakshaputryarthitaya ca | pravrittaya namastubhyam
    nivrittaya ca te namah || 89|| bhaktecchapuraka
  devanagari: देवादिभिः कृतं ६ शिवस्तोत्रम् दक्षोक्तिं च सतीच्छां च सम्प्राप्य मुनयः सुराः । पूजां प्राप्य
    सतीं नत्वा जग्मुः कैलासभूभृतम् ॥ ६७॥ सावित्रीहितो ब्रह्मा लक्ष्मीनारायणस्तथा । रमया सहितो विष्णुर्देवीभिः
    सहिताः सुराः ॥ ६८॥ सप्तर्षयः स्वपत्नीभिः सहिता मनवस्तथा । जग्मुः कैलासशिखरं यत्र देवो महेश्वरः ॥ ६९॥
    गत्वा शम्भुं प्रणम्यैव दृष्ट्वा शान्तं च योगिनम् । तुष्टुवुर्विविधैः स्तोत्रैर्बद्धाञ्जलिपुटा मुदा
    ॥ ७०॥ नमोऽक्षरस्वरूपाय कृष्णनेत्रात्मने नमः । नमः सदाशिवाख्याय तेजःपूजाय ते नमः ॥ ७१॥ वैराजपुत्ररूपाय
    ब्रह्मचर्याय ते नमः । नमो ब्रह्मस्वरूपाय सदा शान्ताय ते नमः ॥ ७२॥ निर्गुणाय गुणाढ्याय वैष्णवाय नमो
    नमः । अव्यक्तरात्रिदेहाय निर्विकाराय ते नमः ॥ ७३॥ महेशाय परेशाय शिवाऽधिपतये नमः । क्वचिच्छान्तिकृते
    कादाचित्कसंहारिणे नमः ॥ ७४॥ नमः शेषाय सङ्कर्षणस्वरूपाय ते नमः । नमो वैराग्यवासाय सतीरागाय ते नमः ॥
    ७५॥ न यस्य देवा ऋषयः सिद्धाः साध्व्यश्च साधवः । विदुः पदं स्वरूपं च तस्मै शिवाय ते नमः ॥ ७६॥ पदं दिदृक्षवो
    यस्य यतन्ते योगिनः सदा । तस्मै नमः परेशाय योगस्थाय नमो नमः ॥ ७७॥ अनन्तसिद्धियुक्ताय गिरां दूराय ते
    नमः । नम आत्मप्रकाशाय निर्वाणस्थाय ते नमः ॥ ७८॥ ज्ञानिने ते नमश्चास्तु निष्क्रियायाऽऽत्मवेदिने । तपसा
    द्राक् प्रसन्नाय सर्वदात्रे च ते नमः ॥ ७९॥ त्रिनेत्राय सचन्द्राय सर्वाध्यक्षाय ते नमः । शरणायातप्रार्थ्यार्थलाभदाय
    च ते नमः ॥ ८०॥ ऐश्वर्याणां प्रदात्रे ते मोक्षदाय च ते नमः । भक्तेष्टपूरकायाऽम्नायोदधये च ते नमः ॥
    ८१॥ स्वप्रकाशाय नित्याय प्रत्यक्द्रष्ट्रे च ते नमः । सकामा वाथ निष्कामा भक्तास्ते शरणागताः ॥ ८२॥ अप्राप्य
    सिद्धिं यस्मान्न निवर्तन्ते च ते नमः । काचित्कन्या त्वदर्थं वै करोति तप उत्कटम् ॥ ८३॥ त्वं कथं चाऽकरुणोऽसि
    प्रसन्नो भव ते नमः । लोककार्यप्रवाहार्थं विचारं कुरु शङ्कर ॥ ८४॥ अध्यात्मयोगगम्य त्वां प्रणमामः स्तुमो
    वयम् । न त्वं देवोऽसुरो मर्त्यो न तिर्यङ्न् द्विजः पशुः ॥ ८५॥ न स्त्री न षण्ढो न पुमान् योऽसि सोऽसि
    च ते नमः । विश्वलयकृते विश्वधारिणे प्रणता वयम् ॥ ८६॥ साङ्ख्या ज्ञानेन पश्यन्ति समाधौ योगिनश्च यम्
    । भक्ताः कृपया पश्यन्ति त्रयीमयं च ते नमः ॥ ८७॥ नमो भक्तोद्धारकर्त्रे नमस्ते गूढवर्चसे । नमः प्रत्यक्षदेवाय
    चाऽपरोक्षानुभूतये ॥ ८८॥ कालरात्रिविलासाय दक्षपुत्र्यार्थिताय च । प्रवृत्ताय नमस्तुभ्यं निवृत्ताय च
    ते नमः ॥ ८९॥ भक्तेच्छापूरक
