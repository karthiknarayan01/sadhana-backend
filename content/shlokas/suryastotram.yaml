id: suryastotram
category: stotram
name:
  english: suryastotram
  devanagari: सूर्यस्तोत्रम्
content:
  english: shrisuryanarayanadevataprasadasiddhyarthe jape viniyogah || atha suryastotraprarambhah | asya
    shribhagavatsuryastotramahamantrasya agastya rishih | anushtupchandah | shrisuryanarayano devata |
    sum bijam | rim shaktih | yam kilakam | suryaprasadasiddhyarthe jape viniyogah | adityaya angushthabhyam
    namah | arkaya tarjanibhyam namah | divakaraya madhyamabhyam namah | prabhakaraya anamikabhyam namah
    | sahasrakiranaya kanishthikabhyam namah | martandaya karatalakaraprishthabhyam namah | adityaya hridayaya
    namah | arkaya shirase svaha | divakaraya shikhayai vashat | prabhakaraya kavacaya hum | sahasrakiranaya
    netratrayaya vaushat | martandaya astraya phat | bhurbhuvah suvaromiti digbandhah || dhyanam | dhyayet
    suryamanantashaktikiranam tejomayam bhasvaram bhaktanamabhayapradam dinakaram jyotirmayam shankaram
    | adityam jagadishamacyutamajam trailokyacudamanim bhaktabhishtavarapradam dinamanim martandamadyam
    shubham || brahma vishnushca rudrashca ishvarashca sadashivah | pancabrahmamayakarah yena jata namami
    tam || 1|| kalatma sarvabhutatma vedatma vishvatomukhah | janmamrityujaravyadhisamsarabhayanashanah
    || 2|| brahmasvarupa udaye madhyahne tu sadashivah | astakale svayam vishnustrayimurtirdivakarah ||
    3|| ekacakro ratho yasya divyah kanakabhushitah | so'yam bhavatu nah pritah padmahasto divakarah ||
    4|| padmahastah paranjyotih pareshaya namo namah | andayone karmasakshinnadityaya namo namah || 5||
    kamalasana devesha karmasakshinnamo namah | dharmamurte dayamurte tattvamurte namo namah || 6|| sakaleshaya
    suryaya sarvajnaya namo namah | kshayapasmaragulmadivyadhihantre namo namah || 7|| sarvajvaraharam
    caiva sarvaroganivaranam | stotrametacchivaproktam sarvasiddhikaram param || 8|| sarvasampatkaram
    caiva sarvabhishtapradayakam || iti suryastotram sampurnam |
  devanagari: श्रीसूर्यनारायणदेवताप्रसादसिद्ध्यर्थे जपे विनियोगः ॥ अथ सूर्यस्तोत्रप्रारम्भः । अस्य श्रीभगवत्सूर्यस्तोत्रमहामन्त्रस्य
    अगस्त्य ऋषिः । अनुष्टुप्छन्दः । श्रीसूर्यनारायणो देवता । सूं बीजम् । रिं शक्तिः । यं कीलकम् । सूर्यप्रसादसिद्ध्यर्थे
    जपे विनियोगः । आदित्याय अङ्गुष्ठाभ्यां नमः । अर्काय तर्जनीभ्यां नमः । दिवाकराय मध्यमाभ्यां नमः । प्रभाकराय
    अनामिकाभ्यां नमः । सहस्रकिरणाय कनिष्ठिकाभ्यां नमः । मार्ताण्डाय करतलकरपृष्ठाभ्यां नमः । आदित्याय हृदयाय
    नमः । अर्काय शिरसे स्वाहा । दिवाकराय शिखायै वषट् । प्रभाकराय कवचाय हुम् । सहस्रकिरणाय नेत्रत्रयाय
    वौषट् । मार्ताण्डाय अस्त्राय फट् । भूर्भुवः सुवरोमिति दिग्बन्धः ॥ ध्यानम् । ध्यायेत् सूर्यमनन्तशक्तिकिरणं
    तेजोमयं भास्वरं भक्तानामभयप्रदं दिनकरं ज्योतिर्मयं शङ्करम् । आदित्यं जगदीशमच्युतमजं त्रैलोक्यचूडामणिं
    भक्ताभीष्टवरप्रदं दिनमणिं मार्ताण्डमाद्यं शुभम् ॥ ब्रह्मा विष्णुश्च रुद्रश्च ईश्वरश्च सदाशिवः । पञ्चब्रह्ममयाकाराः
    येन जाता नमामि तम् ॥ १॥ कालात्मा सर्वभूतात्मा वेदात्मा विश्वतोमुखः । जन्ममृत्युजराव्याधिसंसारभयनाशनः
    ॥ २॥ ब्रह्मस्वरूप उदये मध्याह्ने तु सदाशिवः । अस्तकाले स्वयं विष्णुस्त्रयीमूर्तिर्दिवाकरः ॥ ३॥ एकचक्रो
    रथो यस्य दिव्यः कनकभूषितः । सोऽयं भवतु नः प्रीतः पद्महस्तो दिवाकरः ॥ ४॥ पद्महस्तः परञ्ज्योतिः परेशाय
    नमो नमः । अण्डयोने कर्मसाक्षिन्नादित्याय नमो नमः ॥ ५॥ कमलासन देवेश कर्मसाक्षिन्नमो नमः । धर्ममूर्ते
    दयामूर्ते तत्त्वमूर्ते नमो नमः ॥ ६॥ सकलेशाय सूर्याय सर्वज्ञाय नमो नमः । क्षयापस्मारगुल्मादिव्याधिहन्त्रे
    नमो नमः ॥ ७॥ सर्वज्वरहरं चैव सर्वरोगनिवारणम् । स्तोत्रमेतच्छिवप्रोक्तं सर्वसिद्धिकरं परम् ॥ ८॥ सर्वसम्पत्करं
    चैव सर्वाभीष्टप्रदायकम् ॥ इति सूर्यस्तोत्रं सम्पूर्णम् ।
