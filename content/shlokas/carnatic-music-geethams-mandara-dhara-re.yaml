name:
  english: Carnatic Music Geethams - Mandara Dhara Re
content:
  english: catusra jati triputa talam paidala gurumurti shastri bhasha samskritam sahityam mandara dharare
    mokshamu rare daityakulantaka pavana murte padashubharekha makutamayura a daityakulantaka pavana murte
    padashubharekha makutamayura svarah sa | ta ka || da da pa ma | ga ma | pa | ni ni | da pa || pa da
    shu bha | re kha || da da pa pa | ma ga | ri sa || ma ku ta ma | yu | ta ka || da da pa ma | ga ma
    | pa | ni ni | da pa || pa da shu bha | re kha || da da pa pa | ma ga | ri sa || ma ku ta ma | yu
  devanagari: चतुस्र जाति त्रिपुट तालम् पैडल गुरुमूर्ति शास्त्रि भाषा संस्कृतम् साहित्यम् मन्दर धाररे
    मोक्षमु रारे दैत्यकुलान्तक पावन मूर्ते पदशुभरेख मकुटमयूर आ दैत्यकुलान्तक पावन मूर्ते पदशुभरेख मकुटमयूर
    स्वराः स । त क ॥ द द प म । ग म । प । नि नि । द प ॥ प द शु भ । रे ख ॥ द द प प । म ग । रि स ॥ म कु ट
    म । यू । त क ॥ द द प म । ग म । प । नि नि । द प ॥ प द शु भ । रे ख ॥ द द प प । म ग । रि स ॥ म कु ट म
    । यू
