id: bhudevikritamvarahastotram-05
category: stotram
name:
  english: bhudevikritamvarahastotram 05
  devanagari: भूदेवीकृतंवराहस्तोत्रम् ०५
content:
  english: rnirastamayakritaye namo namah || 37|| karoti vishvasthitisamyamodayam yasyepsitam nepsitamikshiturgunaih
    | maya yathayo bhramate tadashrayam gravno namaste gunakarmasakshine || 38|| pramathya daityam prativaranam
    mridhe yo mam rasaya jagadadisukarah | kritvagradamshtre niragadudanvatah kridannivebhah pranatasmi
    tam vibhumiti || 39|| iti shrimadbhagavatamahapurane pancamaskandhe ashtadashadhyayantargatam bhudevikritam
    varahastotram samaptam | bhagavatapurana | adhyaya 5
  devanagari: र्निरस्तमायाकृतये नमो नमः ॥ ३७॥ करोति विश्वस्थितिसंयमोदयं यस्येप्सितं नेप्सितमीक्षितुर्गुणैः
    । माया यथायो भ्रमते तदाश्रयं ग्राव्णो नमस्ते गुणकर्मसाक्षिणे ॥ ३८॥ प्रमथ्य दैत्यं प्रतिवारणं मृधे
    यो मां रसाया जगदादिसूकरः । कृत्वाग्रदंष्ट्रे निरगादुदन्वतः क्रीडन्निवेभः प्रणतास्मि तं विभुमिति ॥
    ३९॥ इति श्रीमद्भागवतमहापुराणे पञ्चमस्कन्धे अष्टादशाध्यायान्तर्गतं भूदेवीकृतं वराहस्तोत्रं समाप्तम्
    । भागवतपुराण । अध्याय ५
meaning: {}
