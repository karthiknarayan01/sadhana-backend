id: bala-mukundashtakam
category: stotram
name:
  english: Bala Mukundashtakam
content:
  english: kararavindena padaravindam mukharavinde viniveshayantam | vatasya patrasya pute shayanam balam
    mukundam manasa smarami || || samhritya lokanvatapatramadhye shayanamadyantavihinarupam | sarveshvaram
    sarvahitavataram balam mukundam manasa smarami || || indivarashyamalakomalangam indradidevarcitapadapadmam
    | santanakalpadrumamashritanam balam mukundam manasa smarami || || lambalakam lambitaharayashtim shringaralilankitadantapanktim
    | bimbadharam caruvishalanetram balam mukundam manasa smarami || || shikye nidhayadyapayodadhini bahirgatayam
    vrajanayikayam | bhuktva yatheshtam kapatena suptam balam mukundam manasa smarami || || kalindajantasthitakaliyasya
    phanagrarangenatanapriyantam | tatpucchahastam sharadinduvaktram balam mukundam manasa smarami ||
    || ulukhale baddhamudarashauryam uttungayugmarjuna bhangalilam | utphullapadmayata carunetram balam
    mukundam manasa smarami || || alokya maturmukhamadarena stanyam pibantam sarasiruhaksham | saccinmayam
    devamanantarupam balam mukundam manasa smarami ||
  devanagari: करारविन्देन पदारविन्दं मुखारविन्दे विनिवेशयन्तम् । वटस्य पत्रस्य पुटे शयानं बालं मुकुन्दं
    मनसा स्मरामि ॥ ॥ संहृत्य लोकान्वटपत्रमध्ये शयानमाद्यन्तविहीनरूपम् । सर्वेश्वरं सर्वहितावतारं बालं
    मुकुन्दं मनसा स्मरामि ॥ ॥ इन्दीवरश्यामलकोमलाङ्गं इन्द्रादिदेवार्चितपादपद्मम् । सन्तानकल्पद्रुममाश्रितानां
    बालं मुकुन्दं मनसा स्मरामि ॥ ॥ लम्बालकं लम्बितहारयष्टिं शृङ्गारलीलाङ्कितदन्तपङ्क्तिम् । बिम्बाधरं
    चारुविशालनेत्रं बालं मुकुन्दं मनसा स्मरामि ॥ ॥ शिक्ये निधायाद्यपयोदधीनि बहिर्गतायां व्रजनायिकायाम्
    । भुक्त्वा यथेष्टं कपटेन सुप्तं बालं मुकुन्दं मनसा स्मरामि ॥ ॥ कलिन्दजान्तस्थितकालियस्य फणाग्ररङ्गेनटनप्रियन्तम्
    । तत्पुच्छहस्तं शरदिन्दुवक्त्रं बालं मुकुन्दं मनसा स्मरामि ॥ ॥ उलूखले बद्धमुदारशौर्यं उत्तुङ्गयुग्मार्जुन
    भङ्गलीलम् । उत्फुल्लपद्मायत चारुनेत्रं बालं मुकुन्दं मनसा स्मरामि ॥ ॥ आलोक्य मातुर्मुखमादरेण स्तन्यं
    पिबन्तं सरसीरुहाक्षम् । सच्चिन्मयं देवमनन्तरूपं बालं मुकुन्दं मनसा स्मरामि ॥
