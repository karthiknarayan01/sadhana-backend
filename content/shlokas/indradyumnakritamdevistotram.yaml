id: indradyumnakritamdevistotram
category: stotram
name:
  english: indradyumnakritamdevistotram
  devanagari: इन्द्रद्युम्नकृतंदेवीस्तोत्रम्
content:
  english: indradyumnakritam devistotram indradyumna uvaca | namaste tridasheshani sarvapadvinivarini
    | brahmavishnushivadyabhih kalpanabhirudirite || 93|| karanam jagatamadye prasida parameshvari | tvaya
    vina jagannaitatkshanamutsahate shive || 94|| siddhayah sarvakaryanam mangalani ca shashvate | tvatpadaradhanaphalam
    martyaloke hi nanyatha || 95|| caracarapatervishnoh shaktistvam parameshvari | yaya srijatyavati ca
    jagatsamharate vibhuh || 96|| caracaragurum devam nilacalanivasinam | anugrihnishva mam devi yatha
    pashye svacakshusha || 97|| iti shriskandapurane vaishnavakhande purushottamajagannathamahatmye ekadashadhyayantargatam
    brahmadibhih kritam vishnustotram samaptam | skandapurana | vaishnavakhanda | purushottamakhanda |
    adhyaya 11
  devanagari: इन्द्रद्युम्नकृतं देवीस्तोत्रम् इन्द्रद्युम्न उवाच । नमस्ते त्रिदशेशानि सर्वापद्विनिवारिणि
    । ब्रह्मविष्णुशिवाद्याभिः कल्पनाभिरुदीरिते ॥ ९३॥ कारणं जगतामाद्ये प्रसीद परमेश्वरि । त्वया विना जगन्नैतत्क्षणमुत्सहते
    शिवे ॥ ९४॥ सिद्धयः सर्वकार्याणां मङ्गलानि च शाश्वते । त्वत्पादाराधनफलं मर्त्यलोके हि नान्यथा ॥ ९५॥
    चराचरपतेर्विष्णोः शक्तिस्त्वं परमेश्वरि । यया सृजत्यवति च जगत्संहरते विभुः ॥ ९६॥ चराचरगुरुं देवं नीलाचलनिवासिनम्
    । अनुगृह्णीष्व मां देवि यथा पश्ये स्वचक्षुषा ॥ ९७॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे पुरुषोत्तमजगन्नाथमाहात्म्ये
    एकादशाध्यायान्तर्गतं ब्रह्मादिभिः कृतं विष्णुस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । पुरुषोत्तमखण्ड
    । अध्याय ११
