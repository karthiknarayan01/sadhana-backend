    ॥ सब पर प्रीति प्रतीति जियँ जानिअ आपु समान ॥ ॥ बिषी जीव पाइ प्रभुताई। मूढ़ मोह बस होहिं जनाई ॥ भरतु
    नीति रत साधु सुजाना। प्रभु पद प्रेम सकल जगु जाना ॥ तेऊ आजु राम पदु पाई। चले धरम मरजाद मेटाई ॥ कुटिल
    कुबन्ध कुअवसरु ताकी। जानि राम बनवास एकाकी ॥ करि कुमन्त्रु मन साजि समाजू। आए करै अकण्टक राजू ॥ कोटि
    प्रकार कलपि कुटलाई। आए दल बटोरि दौ भाई ॥ जौं जियँ होति न कपट कुचाली। केहि सोहाति रथ बाजि गजाली ॥ भरतहि
    दोसु देइ को जाएँ। जग बौराइ राज पदु पाएँ ॥ दो ससि गुर तिय गामी नघुषु चढ़एउ भूमिसुर जान। लोक बेद तें
    बिमुख भा अधम न बेन समान ॥ ॥ सहसबाहु सुरनाथु त्रिसङ्कू। केहि न राजमद दीन्ह कलङ्कू ॥ भरत कीन्ह यह उचित
    उप् । रिपु रिन रञ्च न राखब क् ॥ एक कीन्हि नहिं भरत भलाई। निदरे रामु जानि असहाई ॥ समुझि परिहि सौ आजु
    बिसेषी। समर सरोष राम मुखु पेखी ॥ एतना कहत नीति रस भूला। रन रस बिटपु पुलक मिस फूला ॥ प्रभु पद बन्दि
    सीस रज राखी। बोले सत्य सहज बलु भाषी ॥ अनुचित नाथ न मानब मोरा। भरत हमहि उपचार न थोरा ॥ कहँ लगि सहिअ
    रहिअ मनु मारें। नाथ साथ धनु हाथ हमारेम् ॥ दो छत्रि जाति रघुकुल जनमु राम अनुग जगु जान। लातहुँ मारें
    चढ़ति सिर नीच को धूरि समान ॥ ॥ उठि कर जोरि रजायसु मागा। मनहुँ बीर रस सोवत जागा ॥ बाँधि जटा सिर कसि
    कटि भाथा। साजि सरासनु सायकु हाथा ॥ आजु राम सेवक जसु लेऊँ। भरतहि समर सिखावन देऊँ ॥ राम निरादर कर फलु
    पाई। सोवहुँ समर सेज दौ भाई ॥ आइ बना भल सकल समाजू। प्रगट करुँ रिस पाछिल आजू ॥ जिमि करि निकर दलि मृगराजू।
    लेइ लपेटि लवा जिमि बाजू ॥ तैसेहिं भरतहि सेन समेता। सानुज निदरि निपातुँ खेता ॥ जौं सहाय कर सङ्करु आई।
    तौ मारुँ रन राम दोहाई ॥ दो अति सरोष माखे लखनु लखि सुनि सपथ प्रवान। सभय लोक सब लोकपति चाहत भभरि भगान
    ॥ ॥ जगु भय मगन गगन भि बानी। लखन बाहुबलु बिपुल बखानी ॥ तात प्रताप प्रभाउ तुम्हारा। को कहि सकि को जाननिहारा
    ॥ अनुचित उचित काजु किछु होऊ। समुझि करिअ भल कह सबु कोऊ ॥ सहसा करि पाछैं पछिताहीं। कहहिं बेद बुध ते
    बुध नाहीम् ॥ सुनि सुर बचन लखन सकुचाने। राम सीयँ सादर सनमाने ॥ कही तात तुम्ह नीति सुहाई। सब तें कठिन
    राजमदु भाई ॥ जो अचवँत नृप मातहिं तेई। नाहिन साधुसभा जेहिं सेई ॥ सुनहु लखन भल भरत सरीसा। बिधि प्रपञ्च
    महँ सुना न दीसा ॥ दो भरतहि होइ न राजमदु बिधि हरि हर पद पाइ ॥ कबहुँ कि काँजी सीकरनि छीरसिन्धु बिनसाइ
    ॥ ॥ तिमिरु तरुन तरनिहि मकु गिली। गगनु मगन मकु मेघहिं मिली ॥ गोपद जल बूड़हिं घटजोनी। सहज छमा बरु छाड़ऐ
    छोनी ॥ मसक फूँक मकु मेरु उड़आई। होइ न नृपमदु भरतहि भाई ॥ लखन तुम्हार सपथ पितु आना। सुचि सुबन्धु नहिं
    भरत समाना ॥ सगुन खीरु अवगुन जलु ताता। मिलि रचि परपञ्चु बिधाता ॥ भरतु हंस रबिबंस तड़आगा। जनमि कीन्ह
    गुन दोष बिभागा ॥ गहि गुन पय तजि अवगुन बारी। निज जस जगत कीन्हि उजिआरी ॥ कहत भरत गुन सीलु सुभ् । पेम
    पयोधि मगन रघुर् सुनि रघुबर बानी बिबुध देखि भरत पर हेतु। सकल सराहत राम सो प्रभु को कृपानिकेतु ॥ ॥ जौं
    न होत जग जनम भरत को। सकल धरम धुर धरनि धरत को ॥ कबि कुल अगम भरत गुन गाथा। को जानि तुम्ह बिनु रघुनाथा
    ॥ लखन राम सियँ सुनि सुर बानी। अति सुखु लहेउ न जाइ बखानी ॥ इहाँ भरतु सब सहित सहाए। मन्दाकिनीं पुनीत
    नहाए ॥ सरित समीप राखि सब लोगा। मागि मातु गुर सचिव नियोगा ॥ चले भरतु जहँ सिय रघुराई। साथ निषादनाथु
    लघु भाई ॥ समुझि मातु करतब सकुचाहीं। करत कुतरक कोटि मन माहीम् ॥ रामु लखनु सिय सुनि मम न् ँ। उठि जनि
    अनत जाहिं तजि ठ् मातु मते महुँ मानि मोहि जो कछु करहिं सो थोर। अघ अवगुन छमि आदरहिं समुझि आपनी ओर ॥
    ॥ जौं परिहरहिं मलिन मनु जानी। जौ सनमानहिं सेवकु मानी ॥ मोरें सरन रामहि की पनही। राम सुस्वामि दोसु
    सब जनही ॥ जग जस भाजन चातक मीना। नेम पेम निज निपुन नबीना ॥ अस मन गुनत चले मग जाता। सकुच सनेहँ सिथिल
    सब गाता ॥ फेरत मनहुँ मातु कृत खोरी। चलत भगति बल धीरज धोरी ॥ जब समुझत रघुनाथ सुभ् । तब पथ परत उताइल
    प् ॥ भरत दसा तेहि अवसर कैसी। जल प्रबाहँ जल अलि गति जैसी ॥ देखि भरत कर सोचु सनेहू। भा निषाद तेहि समयँ
    बिदेहू ॥ दो लगे होन मङ्गल सगुन सुनि गुनि कहत निषादु। मिटिहि सोचु होइहि हरषु पुनि परिनाम बिषादु ॥ ॥
    सेवक बचन सत्य सब जाने। आश्रम निकट जाइ निअराने ॥ भरत दीख बन सैल समाजू। मुदित छुधित जनु पाइ सुनाजू ॥
    ईति भीति जनु प्रजा दुखारी। त्रिबिध ताप पीड़इत ग्रह मारी ॥ जाइ सुराज सुदेस सुखारी। होहिं भरत गति तेहि
    अनुहारी ॥ राम बास बन सम्पति भ्राजा। सुखी प्रजा जनु पाइ सुराजा ॥ सचिव बिरागु बिबेकु नरेसू। बिपिन सुहावन
    पावन देसू ॥ भट जम नियम सैल रजधानी। सान्ति सुमति सुचि सुन्दर रानी ॥ सकल अङ्ग सम्पन्न सुर् । राम चरन
    आश्रित चित च् जीति मोह महिपालु दल सहित बिबेक भुआलु। करत अकण्टक राजु पुरँ सुख सम्पदा सुकालु ॥ ॥ बन
    प्रदेस मुनि बास घनेरे। जनु पुर नगर गाउँ गन खेरे ॥ बिपुल बिचित्र बिहग मृग नाना। प्रजा समाजु न जाइ बखाना
    ॥ खगहा करि हरि बाघ बराहा। देखि महिष बृष साजु सराहा ॥ बयरु बिहाइ चरहिं एक सङ्गा। जहँ तहँ मनहुँ सेन
    चतुरङ्गा ॥ झरना झरहिं मत्त गज गाजहिं। मनहुँ निसान बिबिधि बिधि बाजहिम् ॥ चक चकोर चातक सुक पिक गन। कूजत
    मञ्जु मराल मुदित मन ॥ अलिगन गावत नाचत मोरा। जनु सुराज मङ्गल चहु ओरा ॥ बेलि बिटप तृन सफल सफूला। सब
    समाजु मुद मङ्गल मूला ॥ दो राम सैल सोभा निरखि भरत हृदयँ अति पेमु। तापस तप फलु पाइ जिमि सुखी सिरानें
    नेमु ॥ बीसवाँ विश्राम नवाह्नपारायण पाँचवाँ विश्राम तब केवट ऊँचें चढ़इ धाई। कहेउ भरत सन भुजा उठाई ॥
    नाथ देखिअहिं बिटप बिसाला। पाकरि जम्बु रसाल तमाला ॥ जिन्ह तरुबरन्ह मध्य बटु सोहा। मञ्जु बिसाल देखि
    मनु मोहा ॥ नील सघन पल्ल्व फल लाला। अबिरल छाहँ सुखद सब काला ॥ मानहुँ तिमिर अरुनमय रासी। बिरची बिधि
    सँकेलि सुषमा सी ॥ ए तरु सरित समीप गोसाँई। रघुबर परनकुटी जहँ छाई ॥ तुलसी तरुबर बिबिध सुहाए। कहुँ कहुँ
    सियँ कहुँ लखन लगाए ॥ बट छायाँ बेदिका बनाई। सियँ निज पानि सरोज सुहाई ॥ दो जहाँ बैठि मुनिगन सहित नित
    सिय रामु सुजान। सुनहिं कथा इतिहास सब आगम निगम पुरान ॥ ॥ सखा बचन सुनि बिटप निहारी। उमगे भरत बिलोचन
    बारी ॥ करत प्रनाम चले दौ भाई। कहत प्रीति सारद सकुचाई ॥ हरषहिं निरखि राम पद अङ्का। मानहुँ पारसु पायु
    रङ्का ॥ रज सिर धरि हियँ नयनन्हि लावहिं। रघुबर मिलन सरिस सुख पावहिम् ॥ देखि भरत गति अकथ अतीवा। प्रेम
    मगन मृग खग जड़ जीवा ॥ सखहि सनेह बिबस मग भूला। कहि सुपन्थ सुर बरषहिं फूला ॥ निरखि सिद्ध साधक अनुरागे।
    सहज सनेहु सराहन लागे ॥ होत न भूतल भाउ भरत को। अचर सचर चर अचर करत को ॥ दो पेम अमिअ मन्दरु बिरहु भरतु
    पयोधि गँभीर। मथि प्रगटेउ सुर साधु हित कृपासिन्धु रघुबीर ॥ ॥ सखा समेत मनोहर जोटा। लखेउ न लखन सघन बन
    ओटा ॥ भरत दीख प्रभु आश्रमु पावन। सकल सुमङ्गल सदनु सुहावन ॥ करत प्रबेस मिटे दुख दावा। जनु जोगीं परमारथु
    पावा ॥ देखे भरत लखन प्रभु आगे। पूँछे बचन कहत अनुरागे ॥ सीस जटा कटि मुनि पट बाँधें। तून कसें कर सरु
    धनु काँधेम् ॥ बेदी पर मुनि साधु समाजू। सीय सहित राजत रघुराजू ॥ बलकल बसन जटिल तनु स्यामा। जनु मुनि
    बेष कीन्ह रति कामा ॥ कर कमलनि धनु सायकु फेरत। जिय की जरनि हरत हँसि हेरत ॥ दो लसत मञ्जु मुनि मण्डली
    मध्य सीय रघुचन्दु। ग्यान सभाँ जनु तनु धरे भगति सच्चिदानन्दु ॥ ॥ सानुज सखा समेत मगन मन। बिसरे हरष सोक
    सुख दुख गन ॥ पाहि नाथ कहि पाहि गोसाई। भूतल परे लकुट की नाई ॥ बचन सपेम लखन पहिचाने। करत प्रनामु भरत
    जियँ जाने ॥ बन्धु सनेह सरस एहि ओरा। उत साहिब सेवा बस जोरा ॥ मिलि न जाइ नहिं गुदरत बनी। सुकबि लखन मन
    की गति भनी ॥ रहे राखि सेवा पर भारू। चढ़ई चङ्ग जनु खैञ्च खेलारू ॥ कहत सप्रेम नाइ महि माथा। भरत प्रनाम
    करत रघुनाथा ॥ उठे रामु सुनि पेम अधीरा। कहुँ पट कहुँ निषङ्ग धनु तीरा ॥ दो बरबस लिए उठाइ उर लाए कृपानिधान।
    भरत राम की मिलनि लखि बिसरे सबहि अपान ॥ ॥ मिलनि प्रीति किमि जाइ बखानी। कबिकुल अगम करम मन बानी ॥ परम
    पेम पूरन दौ भाई। मन बुधि चित अहमिति बिसराई ॥ कहहु सुपेम प्रगट को करी। केहि छाया कबि मति अनुसरी ॥ कबिहि
    अरथ आखर बलु साँचा। अनुहरि ताल गतिहि नटु नाचा ॥ अगम सनेह भरत रघुबर को। जहँ न जाइ मनु बिधि हरि हर को
    ॥ सो मैं कुमति कहौं केहि भाँती। बाज सुराग कि गाँडर ताँती ॥ मिलनि बिलोकि भरत रघुबर की। सुरगन सभय धकधकी
    धरकी ॥ समुझाए सुरगुरु जड़ जागे। बरषि प्रसून प्रसंसन लागे ॥ दो मिलि सपेम रिपुसूदनहि केवटु भेण्टेउ राम।
    भूरि भायँ भेण्टे भरत लछिमन करत प्रनाम ॥ ॥ भेण्टेउ लखन ललकि लघु भाई। बहुरि निषादु लीन्ह उर लाई ॥ पुनि
    मुनिगन दुहुँ भाइन्ह बन्दे। अभिमत आसिष पाइ अनन्दे ॥ सानुज भरत उमगि अनुरागा। धरि सिर सिय पद पदुम परागा
    ॥ पुनि पुनि करत प्रनाम उठाए। सिर कर कमल परसि बैठाए ॥ सीयँ असीस दीन्हि मन माहीं। मगन सनेहँ देह सुधि
    नाहीम् ॥ सब बिधि सानुकूल लखि सीता। भे निसोच उर अपडर बीता ॥ कौ किछु कहि न कौ किछु पूँछा। प्रेम भरा
    मन निज गति छूँछा ॥ तेहि अवसर केवटु धीरजु धरि। जोरि पानि बिनवत प्रनामु करि ॥ दो नाथ साथ मुनिनाथ के
    मातु सकल पुर लोग। सेवक सेनप सचिव सब आए बिकल बियोग ॥ ॥ सीलसिन्धु सुनि गुर आगवनू। सिय समीप राखे रिपुदवनू
