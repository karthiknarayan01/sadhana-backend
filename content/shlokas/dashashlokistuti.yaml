id: dashashlokistuti
category: stotram
name:
  english: dashashlokistuti
  devanagari: दशश्लोकीस्तुति
content:
  english: abhava ttasminme hridayam sukhena ramatam sambe parabrahmani || 7|| shaurim satyagiram varahavapusham
    padambujadarshane cakre yo dayaya samastajagatam natham shirodarshane | mithyavacamapujyameva satatam
    hamsasvarupam vidhim tasminme hridayam sukhena ramatam sambe parabrahmani || 8|| yasyasandharanijalagnipavanavyomarkacandradayo
    vikhyatastanavo'shtadha parinata nanyattato vartate | omkararthavivecani shrutiriyam cacashta turyam
    shivam tasminme hridayam sukhena ramatam sambe parabrahmani || 9|| vishnubrahmasuradhipaprabhritayah
    sarve'pi deva yada sambhutajjaladhervishatparibhavam praptastada satvaram |
  devanagari: अभव त्तस्मिन्मे हृदयं सुखेन रमतां साम्बे परब्रह्मणि ॥ ७॥ शौरिं सत्यगिरं वराहवपुषं पादाम्बुजादर्शने
    चक्रे यो दयया समस्तजगतां नाथं शिरोदर्शने । मिथ्यावाचमपूज्यमेव सततं हंसस्वरूपं विधिं तस्मिन्मे हृदयं
    सुखेन रमतां साम्बे परब्रह्मणि ॥ ८॥ यस्यासन्धरणीजलाग्निपवनव्योमार्कचन्द्रादयो विख्यातास्तनवोऽष्टधा
    परिणता नान्यत्ततो वर्तते । ओंकारार्थविवेचनी श्रुतिरियं चाचष्ट तुर्यं शिवं तस्मिन्मे हृदयं सुखेन रमतां
    साम्बे परब्रह्मणि ॥ ९॥ विष्णुब्रह्मसुराधिपप्रभृतयः सर्वेऽपि देवा यदा संभूताज्जलधेर्विषात्परिभवं प्राप्तास्तदा
    सत्वरम् ।
