    । ॐ भव्यफलदाय नमः । ॐ भक्ताभयवरप्रदाय नमः । ॐ शत्रुहन्त्रे नमः । ॐ शमोपेताय नमः ॥ ॥ ॐ शरणागतपोषकाय
