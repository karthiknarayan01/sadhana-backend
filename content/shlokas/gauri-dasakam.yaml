id: gauri-dasakam
category: stotram
name:
  english: Gauri Dasakam
content:
  english: lilalabdhasthapitaluptakhilalokam lokatitairyogibhirantashciramrigyam | baladityashrenisamanadyutipunjam
    gaurimambamamburuhakshimahamide || || pratyaharadhyanasamadhisthitibhajam nityam citte nirvritikashtham
    kalayantim | satyajnananandamayim tam tanurupam gaurimambamamburuhakshimahamide || || candrapidananditamandasmitavaktram
    candrapidalankritanilalakabharam | indropendradyarcitapadambujayugmam gaurimambamamburuhakshimahamide
    || || adikshantamaksharamurtya vilasantim bhute bhute bhutakadambaprasavitrim | shabdabrahmanandamayim
    tam tatidabham gaurimambamamburuhakshimahamide || || muladharadutthitavithya vidhirandhram sauram
    candram vyapya viharajvalitangim | yeyam sukshmatsukshmatanustam sukharupam gaurimambamamburuhakshimahamide
    || || nityah shuddho nishkala eko jagadishah sakshi yasyah sargavidhau samharane ca | vishvatranakridanalolam
    shivapatnim gaurimambamamburuhakshimahamide || || yasyah kukshau linamakhandam jagadandam bhuyo bhuyah
    pradurabhudutthitameva | patya sardham tam rajatadrau viharantim gaurimambamamburuhakshimahamide ||
    || yasyamotam protamashesham manimala sutre yadvatkapi caram capyacaram ca | tamadhyatmajnanapadavya
    gamaniyam gaurimambamamburuhakshimahamide || || nanakaraih shaktikadambairbhuvanani vyapya svairam
    kridati yeyam svayameka | kalyanim tam kalpalatamanatibhajam gaurimambamamburuhakshimahamide || ||
    ashapashakleshavinasham vidadhanam padambhojadhyanaparanam purushanam | ishamishardhangaharam tamabhiramam
    gaurimambamamburuhakshimahamide || || pratahkale bhavavishuddhah pranidhana dbhaktya nityam jalpati
    gauridashakam yah | vacam siddhim sampadamagryam shivabhaktim tasyavashyam parvataputri vidadhati
    || || iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah
    kritau gauri dashakam |
  devanagari: लीलालब्धस्थापितलुप्ताखिललोकां लोकातीतैर्योगिभिरन्तश्चिरमृग्याम् । बालादित्यश्रेणिसमानद्युतिपुञ्जां
    गौरीमम्बामम्बुरुहाक्षीमहमीडे ॥ ॥ प्रत्याहारध्यानसमाधिस्थितिभाजां नित्यं चित्ते निर्वृतिकाष्ठां कलयन्तीम्
    । सत्यज्ञानानन्दमयीं तां तनुरूपां गौरीमम्बामम्बुरुहाक्षीमहमीडे ॥ ॥ चन्द्रापीडानन्दितमन्दस्मितवक्त्रां
    चन्द्रापीडालङ्कृतनीलालकभाराम् । इन्द्रोपेन्द्राद्यर्चितपादाम्बुजयुग्मां गौरीमम्बामम्बुरुहाक्षीमहमीडे
    ॥ ॥ आदिक्षान्तामक्षरमूर्त्या विलसन्तीं भूते भूते भूतकदम्बप्रसवित्रीम् । शब्दब्रह्मानन्दमयीं तां तटिदाभां
    गौरीमम्बामम्बुरुहाक्षीमहमीडे ॥ ॥ मूलाधारादुत्थितवीथ्या विधिरन्ध्रं सौरं चान्द्रं व्याप्य विहारज्वलिताङ्गीम्
    । येयं सूक्ष्मात्सूक्ष्मतनुस्तां सुखरूपां गौरीमम्बामम्बुरुहाक्षीमहमीडे ॥ ॥ नित्यः शुद्धो निष्कल एको
    जगदीशः साक्षी यस्याः सर्गविधौ संहरणे च । विश्वत्राणक्रीडनलोलां शिवपत्नीं गौरीमम्बामम्बुरुहाक्षीमहमीडे
    ॥ ॥ यस्याः कुक्षौ लीनमखण्डं जगदण्डं भूयो भूयः प्रादुरभूदुत्थितमेव । पत्या सार्धं तां रजताद्रौ विहरन्तीं
    गौरीमम्बामम्बुरुहाक्षीमहमीडे ॥ ॥ यस्यामोतं प्रोतमशेषं मणिमाला सूत्रे यद्वत्कापि चरं चाप्यचरं च । तामध्यात्मज्ञानपदव्या
    गमनीयां गौरीमम्बामम्बुरुहाक्षीमहमीडे ॥ ॥ नानाकारैः शक्तिकदम्बैर्भुवनानि व्याप्य स्वैरं क्रीडति येयं
    स्वयमेका । कल्याणीं तां कल्पलतामानतिभाजां गौरीमम्बामम्बुरुहाक्षीमहमीडे ॥ ॥ आशापाशक्लेशविनाशं विदधानां
    पादाम्भोजध्यानपराणां पुरुषाणाम् । ईशामीशार्धाङ्गहरां तामभिरामां गौरीमम्बामम्बुरुहाक्षीमहमीडे ॥ ॥ प्रातःकाले
    भावविशुद्धः प्रणिधाना द्भक्त्या नित्यं जल्पति गौरीदशकं यः । वाचां सिद्धिं सम्पदमग्र्यां शिवभक्तिं
    तस्यावश्यं पर्वतपुत्री विदधाति ॥ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य
    श्रीमच्छङ्करभगवतः कृतौ गौरी दशकम् ।
