id: brahmaproktamnrisimhastotram
category: stotram
name:
  english: brahmaproktamnrisimhastotram
  devanagari: ब्रह्मप्रोक्तंनृसिंहस्तोत्रम्
content:
  english: brahmaproktam nrisimhastotram yamabhyarcya gatim yanti punaravrittidurlabham | nrisimhabhimukhah
    stotramidamaha mudanvitah || 13|| namo'stu te devavaraikasimha namo'stu papaughagajaikasimha | namo'stu
    duhkharnavaparasimha namo'stu tejomaya divyasimha || 14|| namo'stu sarvakriticitrasimha namo'stu te
    kleshavimuktisimha | namo'stu te divyavapurnrisimha namo'stu te viravaraikasimha || 15|| namo'stu
    te daityavidarasimha namo'stu deveshvadhi devasimha | namo'stu vedantavanaikasimha namo'stu te yogiguhaikasimha
    || 16|| namo'stu te simhavrishaikasimha namo'stu nilacalasha
  devanagari: ब्रह्मप्रोक्तं नृसिंहस्तोत्रम् यामभ्यर्च्य गतिं यान्ति पुनरावृत्तिदुर्लभाम् । नृसिंहाभिमुखः
    स्तोत्रमिदमाह मुदान्वितः ॥ १३॥ नमोऽस्तु ते देववरैकसिंह नमोऽस्तु पापौघगजैकसिंह । नमोऽस्तु दुःखार्णवपारसिंह
    नमोऽस्तु तेजोमय दिव्यसिंह ॥ १४॥ नमोऽस्तु सर्वाकृतिचित्रसिंह नमोऽस्तु ते क्लेशविमुक्तिसिंह । नमोऽस्तु
    ते दिव्यवपुर्नृसिंह नमोऽस्तु ते वीरवरैकसिंह ॥ १५॥ नमोऽस्तु ते दैत्यविदारसिंह नमोऽस्तु देवेष्वधि देवसिंह
    । नमोऽस्तु वेदान्तवनैकसिंह नमोऽस्तु ते योगिगुहैकसिंह ॥ १६॥ नमोऽस्तु ते सिंहवृषैकसिंह नमोऽस्तु नीलाचलश
meaning: {}
