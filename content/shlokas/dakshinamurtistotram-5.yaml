id: dakshinamurtistotram-5
category: stotram
name:
  english: dakshinamurtistotram 5
  devanagari: दक्षिणामूर्तिस्तोत्रम् ५
content:
  english: shrimedhadakshinamurtistotram natakhetanishatakiritatati ghatitopalapatalapithitalam | tadidabhajatapatalimakutam
    vatamulakutinilayam kalaye || 1|| smaranam khalu yaccaranambujayorbharanaya bhavottaranaya bhavet
    | sharanam karunavarunavasatham bhaja balasudhakiranabharanam || 2|| parikirnasuvarnasavarnajatabhramadabhrasariccharadabhrarucih
    | makutokutilam chatayan shashinam nitilenaladrigjatilo jayati || 3|| varabhujakutighatitasphatikopalakuttimaveditale
    vimale | smitaphullamukham cidupattasukham puravairimahah karavai hridaye || 4|| akalankashashankasahasrasahodaradidhitidipitadigvalayam
    | nigamagamaniradhinirmathanoditamakalayamyamritam kimapi || 5|| vishabhushamapakritadoshacayam muniveshavisheshamasheshagurum
    | dhritacinmayamudramaham kalaye gatanidramamudrasamadhividhau || 6|| dridhayogarasanubhavotkalikam
    prasaratpulakam kratubhuktilakam | bhasitollasitalikavisphuritanaladriktilakam kalayendushikham ||
    7|| vada citta kimattamabhudbhavata bhramata bahudhakhiladikshu mudha | nijasharmakaram kuru karma
    param bhavameva bhayapahamakalaya || 8|| varapustakahastamapastatamah shrutimastakashastasamastagunam
    | mama nistulavastu puro'stu varam pranavapravanapravaravagatam || 9|| iti shrimedhadakshinamurtistotram
    sampurnam ||
  devanagari: श्रीमेधादक्षिणामूर्तिस्तोत्रम् नतखेटनिशाटकिरीटतटी घटितोपलपाटलपीठितलम् । तडिदाभजटापटलीमकुटं
    वटमूलकुटीनिलयं कलये ॥ १॥ स्मरणं खलु यच्चरणाम्बुजयोर्भरणाय भवोत्तरणाय भवेत् । शरणं करुणावरुणावसथं भज
    बालसुधाकिरणाभरणम् ॥ २॥ परिकीर्णसुवर्णसवर्णजटाभ्रमदभ्रसरिच्छरदभ्ररुचिः । मकुटोकुटिलं छटयन् शशिनं निटिलेनलदृग्जटिलो
    जयति ॥ ३॥ वरभूजकुटीघटितस्फटिकोपलकुट्टिमवेदितले विमले । स्मितफुल्लमुखं चिदुपात्तसुखं पुरवैरिमहः करवै
    हृदये ॥ ४॥ अकलङ्कशशाङ्कसहस्रसहोदरदीधितिदीपितदिग्वलयम् । निगमागमनीरधिनिर्मथनोदितमाकलयाम्यमृतं किमपि
    ॥ ५॥ विषभूषमपाकृतदोषचयं मुनिवेषविशेषमशेषगुरुम् । धृतचिन्मयमुद्रमहं कलये गतनिद्रममुद्रसमाधिविधौ ॥ ६॥
    दृढयोगरसानुभवोत्कलिकं प्रसरत्पुलकं क्रतुभुक्तिलकम् । भसितोल्लसितालिकविस्फुरितानलदृक्तिलकं कलयेन्दुशिखम्
    ॥ ७॥ वद चित्त किमात्तमभूद्भवता भ्रमता बहुधाखिलदिक्षु मुधा । निजशर्मकरं कुरु कर्म परं भवमेव भयापहमाकलय
    ॥ ८॥ वरपुस्तकहस्तमपास्ततमः श्रुतिमस्तकशस्तसमस्तगुणम् । मम निस्तुलवस्तु पुरोऽस्तु वरं प्रणवप्रवणप्रवरावगतम्
    ॥ ९॥ इति श्रीमेधादक्षिणामूर्तिस्तोत्रं सम्पूर्णम् ॥
