id: tejobindu
category: upanishad
name:
  english: tejobindu
  devanagari: तेजोबिन्दु
content:
  english: cinmatrasvarupamanubruhiti | sa hovaca paramah shivah | akhandaikarasam drishyamakhandaikarasam
    jagat | akhandaikarasam bhavamakhandaikarasam svayam || 1|| akhandaikaraso mantra akhandaikarasa kriya
    | akhandaikarasam jnanamakhandaikarasam jalam || 2|| akhandaikarasa bhumirakhandaikarasam viyat |
    akhandaikarasam shastramakhandaikarasa trayi || 3|| akhandaikarasam brahma cakhandaikarasam vratam
    | akhandaikaraso jiva akhandaikaraso hyajah || 4|| akhandaikaraso brahma akhandaikaraso harih | akhandaikaraso
    rudra akhandaikaraso'smyaham || 5|| akhandaikaraso hyatma hyakhandaikaraso guruh | akhandaikarasam
    lakshyamakhandaikarasam mahah || 6|| akhandaikaraso deha akhandaikarasam manah | akhandaikarasam cittamakhandaikarasam
    sukham || 7|| akhandaikarasa vidya akhandaikaraso'vyayah | akhandaikarasam nityamakhandaikarasam param
    || 8|| akhandaikarasam kincidakhandaikarasam param | akhandaikarasadanyannasti nasti shadanana ||
    9|| akhandaikarasannasti akhandaikarasanna hi | akhandaikarasatkincidakhandaikarasadaham || 10|| akhandaikarasam
    sthulam sukshmam cakhandarupakam | akhandaikarasam vedyamakhandaikaraso bhavan || 11|| akhandaikarasam
    guhyamakhandaikarasadikam | akhandaikaraso jnata hyakhandaikarasa sthitih || 12|| akhandaikarasa mata
    akhandaikararasah pita | akhandaikaraso bhrata akhandaikarasah patih || 13|| akhandaikarasam sutramakhandaikaraso
    virat | akhandaikarasam gatramakhandaikarasam shirah || 14|| akhandaikarasam cantarakhandaikarasam
    bahih | akhandaikarasam purnamakhandaikarasamritam || 15|| akhaindaikarasam gotramakhandaikarasam
    griham | akhandaikarasam gopyamakhandaikarasashashi || 16|| akhandaikarasastara akhandaikaraso ravih
    | akhandaikarasam kshetramakhandaikarasa kshama || 17|| akhandaikarasa shanta akhandaikaraso'gunah
    | akhandaikarasah sakshi akhandaikarasah suhrit || 18|| akhandaikaraso bandhurakhandaikarasah sakha
    | akhandaikaraso raja akhandaikarasam puram || 19|| akhandaikarasam rajyamakhandaikarasah prajah |
    akhandaikarasam taramakhandaikaraso japah || 20|| akhandaikarasam dhyanamakhandaikarasam padam | akhandaikarasam
    grahyamakhandaikarasam mahat || 21|| akhandaikarasam jyotirakhandaikarasam dhanam | akhandaikarasam
    bhojyamakhandaikarasam havih || 22|| akhandaikaraso homa akhandaikaraso japah | akhandaikarasam svargamakhandaikarasah
    svayam || 23|| akhandaikarasam sarvam cinmatramiti bhavayet | cinmatrameva cinmatramakhandaikarasam
    param || 24|| bhavavarjitacinmatram sarvam cinmatrameva hi | idam ca sarvam cinmatramayam cinmayameva
    hi || 25|| atmabhavam ca cinmatramakhandaikarasam viduh | sarvalokam ca cinmatram vatta matta ca cinmayam
    || 26|| akasho bhurjalam vayuragnirbrahma harih shivah | yatkincidyanna kincicca sarvam cinmatrameva
    hi || 27|| akhandaikarasam sarvam yadyaccinmatrameva hi | bhutam bhavyam bhavishyacca sarvam cinmatrameva
    hi || 28|| dravyam kalam ca cinmatram jnanam jneyam cideva hi | jnata cinmatrarupashca sarvam cinmayameva
    hi || 29|| sambhashanam ca cinmatram yadyaccinmatrameva hi | asacca sacca cinmatramadyantam cinmayam
    sada || 30|| adirantashca cinmatram gurushishyadi cinmayam | drigdrishyam yadi cinmatramasti ceccinmayam
    sada || 31|| sarvashcaryam hi cinmatram deham cinmatrameva hi | lingam ca karanam caiva cinmatranna
    hi vidyate || 32|| aham tvam caiva cinmatram murtamurtadicinmayam | punyam papam ca cinmatram jivashcinmatravigrahah
    || 33|| cinmatrannasti sankalpashcinmatrannasti vedanam | cinmatrannasti mantradi cinmatrannasti devata
    || 34|| cinmatrannasti dikpalashcinmatradvyavaharikam | cinmatratparamam brahma cinmatrannasti ko'pi
    hi || 35|| cinmatrannasti maya ca cinmatrannasti pujanam | cinmatrannasti mantavyam cinmatrannasti
    satyakam || 36|| cinmatrannasti koshadi cinmatrannasti vai vasu | cinmatrannasti maunam ca cinmatrannastyamaunakam
    || 37|| cinmatrannasti vairagyam sarvam cinmatrameva hi | yacca yavacca cinmatram yacca yavacca drishyate
    || 38|| yacca yavacca durastham sarvam cinmatrameva hi | yacca yavacca bhutadi yacca yavacca lakshyate
    || 39|| yacca yavacca vedantah sarvam cinmatrameva hi | cinmatrannasti gamanam cinmatrannasti mokshakam
    || 40|| cinmatrannasti lakshyam ca sarvam cinmatrameva hi | akhandaikarasam brahma cinmatranna hi
    vidyate || 41|| shastre mayi tvayishe ca hyakhandaikaraso bhavan | ityekarupataya yo va janatyaham
    tviti || 42|| sakrijjnanena muktih syatsamyagjnane svayam guruh || 43|| iti dvitiyo'dhyayah || 2||
    kumarah pitaramatmanubhavamanubruhiti papraccha | sa hovaca parah shivah | parabrahmasvarupo'ham paramanandamasmyaham
    | kevalam jnanarupo'ham kevalam paramo'smyaham || 1|| kevalam shantarupo'ham kevalam cinmayo'smyaham
    | kevalam nityarupo'ham kevalam shashvato'smyaham || 2|| kevalam sattvarupo'hamaham tyaktvahamasmyaham
    | sarvahinasvarupo'ham cidakashamayo'smyaham || 3|| kevalam turyarupo'smi turyatito'smi kevalah |
    sada caitanyarupo'smi cidanandamayo'smyaham || 4|| kevalakararupo'smi shuddharupo'smyaham sada | kevalam
    jnanarupo'smi kevalam priyamasmyaham || 5|| nirvikalpasvarupo'smi niriho'smi niramayah | sada'sangasvarupo'smi
    nirvikaro'hamavyayah || 6|| sadaikarasarupo'smi sada cinmatravigrahah | aparicchinnarupo'smi hyakhandanandarupavan
    || 7|| satparanandarupo'smi citparanandamasmyaham | antarantararupo'hamavanmanasagocarah || 8|| atmanandasvarupo'ham
    satyanando'smyaham sada | atmaramasvarupo'smi hyayamatma sadashivah || 9|| atmaprakasharupo'smi hyatmajyotiraso'smyaham
    | adimadhyantahino'smi hyakashasadrisho'smyaham || 10|| nityashuddhacidanandasattamatro'hamavyayah
    | nityabuddhavishuddhaikasaccidanandamasmyaham || 1|| nityasheshasvarupo'smi sarvatito'smyaham sada
    | rupatitasvarupo'smi paramakashavigrahah || 12|| bhumanandasvarupo'smi bhashahino'smyaham sada |
    sarvadhishthanarupo'smi sarvada cidghano'smyaham || 13|| dehabhavavihino'smi cintahino'smi sarvada
    | cittavrittivihino'ham cidatmaikaraso'smyaham || 14|| sarvadrishyavihino'ham drigrupo'smyahameva
    hi | sarvada purnarupo'smi nityatripto'smyaham sada || 15|| aham brahmaiva sarvam syadaham caitanyameva
    hi | ahamevahamevasmi bhumakashasvarupavan || 16|| ahameva mahanatma hyahameva paratparah | ahamanyavadabhami
    hyahameva shariravat || 17|| aham shishyavadabhami hyayam lokatrayashrayah | aham kalatrayatita aham
    vedairupasitah || 18|| aham shastrena nirnita aham citte vyavasthitah | mattyaktam nasti kincidva
    mattyaktam prithivi ca va || 19|| mayatiriktam yadyadva tattannastiti nishcinu | aham brahmasmi siddho'smi
    nityashuddho'smyaham sada || 20|| nirgunah kevalatmasmi nirakaro'smyaham sada | kevalam brahmamatro'smi
    hyajaro'smyamaro'smyaham || 21|| svayameva svayam bhami svayameva sadatmakah | svayamevatmani svasthah
    svayameva para gatih || 22|| svayameva svayam bhanje svayameva svayam rame | svayameva svayam jyotih
    svayameva svayam mahah || 23|| svasyatmani svayam ramsye svatmanyeva vilokaye | svatmanyeva sukhasinah
    svatmamatravasheshakah || 24|| svacaitanye svayam sthasye svatmarajye sukhe rame | svatmasimhasane
    sthitva svatmano'nyanna cintaye || 25|| cidrupamatram brahmaiva saccidanandamadvayam | anandaghana
    evahamaham brahmasmi kevalam || 26|| sarvada sarvashunyo'ham sarvatmanandavanaham | nityanandasvarupo'hamatmakasho'smi
    nityada || 27|| ahameva hridakashashcidadityasvarupavan | atmanatmani tripto'smi hyarupo'smyahamavyayah
    || 28|| ekasankhyavihino'smi nityamuktasvarupavan | akashadapi sukshmo'hamadyantabhavavanaham || 29||
    sarvaprakasharupo'ham paravarasukho'smyaham | sattamatrasvarupo'ham shuddhamokshasvarupavan || 30||
    satyanandasvarupo'ham jnananandaghano'smyaham | vijnanamatrarupo'ham saccidanandalakshanah || 31||
    brahmamatramidam sarvam brahmano'nyanna kincana | tadevaham sadanandam brahmaivaham sanatanam || 32||
    tvamityetattadityetanmatto'nyannasti kincana | ciccaitanyasvarupo'hamahameva shivah parah || 33||
    atibhavasvarupo'hamahameva sukhatmakah | sakshivastuvihinatvatsakshitvam nasti me sada || 34|| kevalam
    brahmamatratvadahamatma sanatanah | ahamevadishesho'hamaham shesho'hameva hi || 35|| namarupavimukto'hamahamanandavigrahah
    | indriyabhavarupo'ham sarvabhavasvarupakah || 36|| bandhamuktivihino'ham shashvatanandavigrahah |
    adicaitanyamatro'hamakhandaikaraso'smyaham || 37|| vanmano'gocarashcaham sarvatra sukhavanaham | sarvatra
    purnarupo'ham bhumanandamayo'smyaham || 38|| sarvatra triptirupo'ham paramritaraso'smyaham | ekamevadvitiyam
    sadbrahmaivaham na samshayah || 39|| sarvashunyasvarupo'ham sakalagamagocarah | mukto'ham moksharupo'ham
    nirvanasukharupavan || 40|| satyavijnanamatro'ham sanmatranandavanaham | turiyatitarupo'ham nirvikalpasvarupavan
    || 41|| sarvada hyajarupo'ham nirago'smi niranjanah | aham shuddho'smi buddho'smi nityo'smi prabhurasmyaham
    || 42|| onkararthasvarupo'smi nishkalankamayo'smyaham | cidakarasvarupo'smi nahamasmi na so'smyaham
    || 43|| na hi kincitsvarupo'smi nirvyaparasvarupavan | niramsho'smi nirabhaso na mano nendriyo'smyaham
    || 44|| na buddhirna vikalpo'ham na dehaditrayo'smyaham | na jagratsvapnarupo'ham na sushuptisvarupavan
    || 45|| na tapatrayarupo'ham neshanatrayavanaham | shravanam nasti me siddhermananam ca cidatmani
    || 46|| sajatiyam na me kincidvijatiyam na me kvacit | svagatam ca na me kincinna me bhedatrayam kvacit
    || 47|| asatyam hi manorupamasatyam buddhirupakam | ahankaramasiddhiti nityo'ham shashvato hyajah
    || 48|| dehatrayamasadviddhi kalatrayamasatsada | gunatrayamasatviddhi hyayam satyatmakah shucih ||
    49|| shrutam sarvamasatdviddhi vedam sarvamasatsada | shastram sarvamasatdviddhi hyaham satyacidatmakah
    || 50|| murtitrayamasadviddhi sarvabhutamasatsada | sarvatattvamasadviddhi hyayam bhuma sadashivah
    || 51|| gurushishyamasadviddhi gurormantramasattatah | yaddrishyam tadasadviddhi na mam viddhi tathavidham
    || 52|| yaccintyam tadasadviddhi yannyayam tadasatsada | yaddhitam tadasadviddhi na mam viddhi tathavidham
    || 53|| sarvanprananasadviddhi sarvanbhoganasattviti | drishtam shrutamasadviddhi otam protamasanmayam
    || 54|| karyakaryamasadviddhi nashtam praptamasanmayam | duhkhaduhkhamasadviddhi sarvasarvamanmayam
    || 55|| purnapurnamasadviddhi dharmadharmamasanmayam | labhalabhavasadviddhi jayajayamasanmayam ||
    56|| shabdam sarvamasadviddhi sparsham sarvamasatsada | rupam sarvamasadviddhi rasam sarvamasanmayam
    || 57|| gandham sarvamasadviddhi sarvajnanamasanmayam | asadeva sada sarvamasadeva bhavodbhavam ||
    58|| asadeva gunam sarvam sanmatramahameva hi | svatmamantram sada pashyetsvatmamantram sadabhyaset
    || 59|| aham brahmasmi mantro'yam drishyapapam vinashayet | aham brahmasmi mantro'yamanyamantram vinashayet
    || 60|| aham brahmasmi mantro'yam dehadosham vinashayet | aham brahmasmi mantro'yam janmapapam vinashayet
    || 61|| aham brahmasmi mantro'yam mrityupasham vinashayet | aham brahmasmi mantro'yam dvaitaduhkham
    vinashayet || 62|| aham brahmasmi mantro'yam bhedabuddhim vinashayet | aham brahmasmi mantro'yam cintaduhkham
    vinashayet || 63|| aham brahmasmi mantro'yam buddhivyadhim vinashayet | aham brahmasmi mantro'yam
    cittabandham vinashayet || 64|| aham brahmasmi mantro'yam sarvavyadhinvinashayet | aham brahmasmi
    mantro'yam sarvashokam vinashayet || 65|| aham brahmasmi mantro'yam kamadinnashayetkshanat | aham
    brahmasmi mantro'yam krodhashaktim vinashayet || 66|| aham brahmasmi mantro'yam cittavrittim vinashayet
    | aham brahmasmi mantro'yam sankalpadinvinashayet || 67|| aham brahmasmi mantro'yam kotidosham vinashayet
    | aham brahmasmi mantro'yam sarvatantram vinashayet || 68|| aham brahmasmi mantro'yamatmajnanam vinashayet
    | aham brahmasmi mantro'yamatmalokajayapradah || 69|| aham brahmasmi mantro'yamapratarkyasukhapradah
    | aham brahmasmi mantro'yamajadatvam prayacchati || 70|| aham brahmasmi mantro'yamanatmasuramardanah
    | aham brahmasmi vajro'yamanatmakhyagirinharet || 71|| aham brahmasmi mantro'yamanatmakhyasuranharet
    | aham brahmasmi mantro'yam sarvamstanmokshayishyati || 72|| aham brahmasmi mantro'yam jnananandam
    prayacchati | saptakotimahamantram janmakotishatapradam || 73|| sarvamantransamutsrijya etam mantram
    samabhyaset | sadyo mokshamavapnoti natra sandehamanvapi || 74|| iti tritiyodhyayah || 3|| kumarah
    parameshvaram papraccha jivanmuktavidehamuktayoh sthitimanubruhiti | sa hovaca parah shivah | cidatmaham
    paratmaham nirguno'ham paratparah | atmamatrena yastishthetsa jivanmukta ucyate || 1|| dehatrayatirikto'ham
    shuddhacaitanyamasmyaham | brahmahamiti yasyantah sa jivanamukta ucyate || 2|| anandaghanarupo'smi
    paranandaghano'smyaham | yasya dehadikam nasti yasya brahmeti nishcayah | paramanandapurno yah sa
    jivanmukta ucyate || 3|| yasya kincidaham nasti cinmatrenavatishthate | caitanyamatro yasyantashcinmatraikasvarupavan
    || 4|| sarvatra purnarupatma sarvatratmavasheshakah | anandaratiravyaktah paripurnashcidatmakah ||
    5|| shuddhacaitanyarupatma sarvasangavivarjitah | nityanandah prasannatma hyanyacintavivarjitah ||
    6 kincidastitvahino yah sa jivanmukta ucyate | na me cittam na me buddhirnahankaro na cendriyam ||
    7|| na me dehah kadacidva na me pranadayah kvacit | na me maya na me kamo na me krodhah paro'smyaham
    || 8|| na me kincididam vapi na me kincitkvacijjagat | na me dosho na me lingam na me cakshurna me
    manah || 9|| na me shrotram na me nasa na me jihva na me karah | na me jagranna me svapnam na me karanamanvapi
    || 10|| na me turiyamiti yah sa jivanmukta ucyate | idam sarvam na me kincidayam sarvam na me kvacit
    || 11|| na me kalo na me desho na me vastu na me matih | na me snanam na me sandhya na me daivam na
    me sthalam || 12|| na me tirtham na me seva na me jnanam na me padam | na me bandho na me janma na
    me vakyam na me ravih || 13|| na me punyam na me papam na me karyam na me shubham | ne me jiva iti
    svatma na me kincijjagatrayam || 14|| na me moksho na me dvaitam na me vedo na me vidhih | na me'ntikam
    na me duram na me bodho na me rahah || 15|| na me gururna me shishyo na me hino na cadhikah | na me
    brahma na me vishnurna me rudro na candramah || 16|| na me prithvi na me toyam na me vayurna me viyat
    | na me vahnirna me gotram na me lakshyam na me bhavah || 17|| na me dhyata na me dhyeyam na me dhyanam
    na me manuh | na me shitam na me coshnam na me trishna na me kshudha || 18|| na me mitram na me shatrurna
    me moho na me jayah | na me purvam na me pashcanna me cordhvam na me dishah || 19|| na me vaktavyamalpam
    va na me shrotavyamanvapi | na me gantavyamishadva na me dhyatavyamanvapi || 20|| na me bhoktavyamishadva
    na me smartavyamanvapi | na me bhogo na me rago na me yago na me layah || 21|| na me maurkhyam na
    me shantam na me bandho na me priyam | na me modah pramodo va na me sthulam na me krisham || 22||
    na me dirgham na me hrasvam na me vriddhirna me kshayah | adhyaropo'pavado va na me caikam na me bahu
    || 23|| na me andhyam na me mandyam na me patvidamanvapi | na me mamsam na me raktam na me medo na
    me hyasrik || 24|| na me majja na me'sthirva na me tvagdhatu saptakam | na me shuklam na me raktam
    na me nilam name prithak || 25|| na me tapo na me labho mukhyam gaunam na me kvacit | na me bhrantirna
    me sthairyam na me guhyam na me kulam || 26|| na me tyajyam na me grahyam na me hasyam na me nayah
    | na me vrittam na me glanirna me shoshyam na me sukham || 27|| na me jnata na me jnanam na me jneyam
    na me svayam | na me tubhyam name mahyam na me tvam ca na me tvaham || 28|| na me jara na me balyam
    na me yauvanamanvapi | aham brahmasmyaham brahmasmyaham brahmeti nishcayah || 29|| cidaham cidaham
    ceti sa jivanmukta ucyate | brahmaivaham cidevaham paro vaham na samshayah || 30|| svayameva svayam
    hamsah svayameva svayam sthitah | svayameva svayam pashyetsvatmarajye sukham vaset || 31|| svatmanandam
    svayam bhokshyetsa jivanmukta ucyate | svayamevaikaviro'gre svayameva prabhuh smritah || 32|| brahmabhutah
    prashantatma brahmanandamayah sukhi | svaccharupo mahamauni vaidehi mukta eva sah || 33|| sarvatma
    samarupatma shuddhatma tvahamutthitah | ekavarjita ekatma sarvatma svatmamatrakah || 34|| ajatma camritatmaham
    svayamatmahamavyayah | lakshyatma lalitatmaham tushnimatmasvabhavavan || 35|| anandatma priyo hyatma
    mokshatma bandhavarjitah | brahmaivaham cidevahamevam vapi na cintyate || 36|| cinmatrenaiva yastishthedvaidehi
    mukta eva sah || 37|| nishcayam ca parityajya aham brahmeti nishcayam | anandabharitasvanto vaidehi
    mukta eva sah || 38|| sarvamastiti nastiti nishcayam tyajya tishthati | aham brahmasmi nasmiti saccidanandamatrakah
    || 39|| kincitkvacitkadacicca atmanam na sprishatyasau | tushnimeva sthitastushnim tushnim satyam
    na kincana || 40|| paramatma gunatitah sarvatma bhutabhavanah | kalabhedam vastubhedam deshabhedam
    svabhedakam || 41|| kincidbhedam na tasyasti kincidvapi na vidyate | aham tvam tadidam so'yam kalatma
    kalahinakah || 42|| shunyatma sukshmarupatma vishvatma vishvahinakah | devatmadevahinatma meyatma
    meyavarjitah || 43|| sarvatra jadahinatma sarveshamantaratmakah | sarvasankalpahinatma cinmatro'smiti
    sarvada || 44|| kevalah paramatmaham kevalo jnanavigrahah | sattamatrasvarupatma nanyatkincijjagadbhayam
    || 45|| jiveshvareti vakkveti vedashastradyaham tviti | idam caitanyameveti aham caitanyamityapi ||
    46|| iti nishcayashunyo yo vaidehi mukta eva sah | caitanyamatrasamsiddhah svatmaramah sukhasanah
    || 47|| aparicchinnarupatma anusthuladivarjitah | turyaturya paranando vaidehi mukta eva sah || 48||
    namarupavihinatma parasamvitsukhatmakah | turiyatitarupatma shubhashubhavivarjitah || 49|| yogatma
    yogayuktatma bandhamokshavivarjitah | gunagunavihinatma deshakaladivarjitah || 50|| sakshyasakshitvahinatma
    kincitkincinna kincana | yasya prapancamanam na brahmakaramapiha na || 51|| svasvarupe svayanjyotih
    svasvarupe svayamratih | vacamagocaranando vanmanogocarah svayam || 52|| atitatitabhavo yo vaidehi
    mukta eva sah | cittavritteratito yashcittavrittyavabhasakah || 53|| sarvavrittivihinatma vaidehi
    mukta eva sah | tasminkale videhiti dehasmaranavarjitah || 54|| ishanmatram smritam cedyastada sarvasamanvitah
    | parairadrishtabahyatma paramanandaciddhanah || 55|| parairadrishtabahyatma sarvavedantagocarah |
    brahmamritarasasvado brahmamritarasayanah || 56|| brahmamritarasasakto brahmamritarasah svayam | brahmamritarase
    magno brahmanandashivarcanah || 57|| brahmamritarase tripto brahmanandanubhavakah | brahmanandashivanando
    brahmanandarasaprabhah || 58|| brahmanandaparam jyotirbrahmanandanirantarah | brahmanandarasannado
    brahmanandakutumbakah || 59|| brahmanandarasarudho brahmanandaikaciddhanah | brahmanandarasodbaho
    brahmanandarasambharah || 60|| brahmanandajanairyukto brahmanandatmani sthitah | atmarupamidam sarvamatmano'nyanna
    kancana || 61|| sarvamatmahamatmasmi paramatma paratmakah | nityananda svarupatma vaidehi mukta eva
    sah || 62|| purnarupo mahanatma pritatma shashvatatmakah | sarvantaryamirupatma nirmalatma niratmakah
    || 63|| nirvikarasvarupatma shuddhatma shantarupakah | shantashantasvarupatma naikatmatvavivarjitah
    || 64|| jivatmaparamatmeti cintasarvasvavarjitah | muktamuktasvarupatma muktamuktavivarjitah || 65||
    bandhamokshasvarupatma bandhamokshavivarjitah | dvaitadvaitasvarupatma dvaitadvaitavivarjitah || 66||
    sarvasarvasvarupatma sarvasarvavivarjitah | modapramodarupatma modadivinivarjitah || 67|| sarvasankalpahinatma
    vaidehi mukta eva sah | nishkalatma nirmalatma buddhatmapurushatmakah || 68|| anandadivihinatma amritatmamritatmakah
    | kalatrayasvarupatma kalatrayavivarjitah || 69|| akhilatma hyameyatma manatma manavarjitah | nityapratyaksharupatma
    nityapratyakshanirnayah || 70|| anyahinasvabhavatma anyahinasvayamprabhah | vidyavidyadimeyatma vidyavidyadivarjitah
    || 71|| nityanityavihinatma ihamutravivarjitah | shamadishatkashunyatma mumukshutvadivarjitah || 72||
    sthuladehavihinatma sukshmadehavivarjitah | karanadivihinatma turiyadivivarjitah || 73|| annakoshavihinatma
    pranakoshavivarjitah | manahkoshavihinatma vijnanadivivarjitah || 74|| anandakoshahinatma pancakoshavivarjitah
    | nirvikalpasvarupatma savikalpavivarjitah || 75|| drishyanuviddhahinatma shabdaviddhavivarjitah |
    sada samadhishunyatma adimadhyantavarjitah || 76|| prajnanavakyahinatma ahambrahmasmivarjitah | tattvamasyadihinatma
    ayamatmetyabhavakah || 77|| onkaravacyahinatma sarvavacyavivarjitah | avasthatrayahinatma aksharatma
    cidatmakah || 78|| atmajneyadihinatma yatkincididamatmakah | bhanabhanavihinatma vaidehi mukta eva
    sah || 79|| atmanameva vikshasva atmanam bodhaya svakam | svamatmanam svayam bhunkshva svastho bhava
    shadanana || 80|| svamatmani svayam triptah svamatmanam svayam cara | atmanameva modasva vaidehi muktiko
    bhavetyupanishat || iti caturtho'dhyayah || 4|| nidagho nama vai munih papraccha ribhum bhagavantamatmanatmavivekamanubruhiti
    | sa hovaca ribhuh | sarvavaco'vadhirbrahma sarvacintavadhirguruh | sarvakaranakaryatma karyakaranavarjitah
    || 1|| sarvasankalparahitah sarvanadamayah shivah | sarvavarjitacinmatrah sarvanandamayah parah ||
    2|| sarvatejahprakashatma nadanandamayatmakah | sarvanubhavanirmuktah sarvadhyanavivarjitah || 3||
    sarvanadakalatita esha atmahamavyayah | atmanatmavivekadibhedabhedavivarjitah || 4|| shantashantadihinatma
    nadantarjyotirupakah | mahavakyarthato duro brahmasmityatiduratah || 5|| tacchabdavarjyastvamshabdahino
    vakyarthavarjitah | ksharaksharavihino yo nadantarjyotireva sah || 6|| akhandaikaraso vahamanando'smiti
    varjitah | sarvatitasvabhavatma nadantarjyotireva sah || 7|| atmeti shabdahino ya atmashabdarthavarjitah
    | saccidanandahino ya eshaivatma sanatanah || 8|| sa nirdeshtumashakyo yo vedavakyairagamyatah | yasya
    kincidbahirnasti kincidantah kiyanna ca || 9|| yasya lingam prapancam va brahmaivatma na samshayah
    | nasti yasya shariram va jivo va bhutabhautikah || 10|| namarupadikam nasti bhojyam va bhogabhukca
    va | sadva'sadva sthitirvapi yasya nasti ksharaksharam || 11|| gunam va vigunam vapi sama atma na
    samshayah | yasya vacyam vacakam va shravanam mananam ca va || 12|| gurushishyadibhedam va devalokah
    surasurah | yatra dharmamadharmam va shuddham vashuddhamanvapi || 13|| yatra kalamakalam va nishcayah
    samshayo na hi | yatra mantramamantram va vidyavidye na vidyate || 14|| drashtridarshanadrishyam va
    ishanmatram kalatmakam | anatmeti prasango va hyanatmeti mano'pi va || 15|| anatmeti jagadvapi nasti
    nasti nishcinu | sarvasankalpashunyatvatsarvakaryavivarjanat || 16|| kevalam brahmamatratvannastyanatmeti
    nishcinu | dehatrayavihinatvatkalatrayavivarjanat || 17|| jivatrayagunabhavattapatrayavivarjanat |
    lokatrayavihinatvatsarvamatmeti shasanat || 18|| cittabhaccintaniyam dehabhavajjara na ca | padabhavadgatirnasti
    hastabhavatkriya na ca || 19|| mrityurnasti janabhavadbuddhyabhavatsukhadikam | dharmo nasti shucirnasti
    satyam nasti bhayam na ca || 20|| aksharoccaranam nasti gurushishyadi nastyapi | ekabhave dvitiyam
    na na dvitiye na caikata || 21|| satyatvamasti cetkincidasatyam na ca sambhavet | asatyatvam yadi
    bhavetsatyatvam na ghatishyati || 22|| shubham yadyashubham viddhi ashubhacchubhamishyate | bhayam
    yadyabhavam viddhi abhayadbhayamapatet || 23|| bandhatvamapi cenmoksho bandhabhave kva mokshata |
    maranam yadi cejjanma janmabhave mritirna ca || 24|| tvamityapi bhaveccaham tvam no cedahameva na
    | idam yadi tadevasti tadabhadidam na ca || 25|| astiti cennasti tada nasti cedasti kincana | karyam
    cetkaranam kincitkaryabhave na karanam || 26|| dvaitam yadi tada'dvaitam dvaitabhave dvayam na ca
    | drishyam yadi drigapyasti drishyabhave drigena na || 27|| antaryadi bahih satyamanta bhave bahirna
    ca | purnatvamasti cetkincidapurnatvam prasajyate || 28|| tasmadetatkvacinnasti tvam caham va ime
    idam | nasti drishtantikam satye nasti darshtantikam hyaje || 29|| parambrahmahamasmiti smaranasya
    mano na hi | brahmamatram jagadidam brahmamatram tvamapyaham || 30|| cinmatram kevalam caham nastyanatmyeti
    nishcinu | idam prapancam nastyeva notpannam no sthitam kvacit || 31|| cittam prapancamityahurnasti
    nastyeva sarvada | na prapancam na cittadi nahankaro na jivakah || 32|| mayakaryadikam nasti maya
    nasti bhayam nahi | karta nasti kriya nasti shravanam mananam nahi || 33|| samadhidvitayam nasti matrimanadi
    nasti hi | ajnanam capi nastyeva hyavivekam kadacana || 34|| anubandhacatushkam na sambandhatrayameva
    na | na ganga na gaya seturna bhutam nanyadasti hi || 35|| na bhumirna jalam nagnirna na vayurna ca
    kham kvacit | na deva na ca dikpala na veda na guruh kvacit || 36|| na duram nastikam nalam na madhyam
    na kvacitsthitam | nadvaitam dvaitasatyam va hyasatyam va idam na ca || 37|| bandhamokshadikam nasti
    sadva'sadva sukhadi va | jatirnasti gatirnasti varno nasti na laukikam || 38|| sarvam brahmeti nastyeva
    brahma ityapi nasti hi | cidityeveti nastyeva cidahambhashanam na hi || 39|| aham brahmasmi nastyeva
    nityashuddho'smi na kvacit | vaca yaducyate kincinmanasa manute kvacit || 40|| buddhya nishcinute
    nasti cittena jnayate nahi | yogi yogadikam nasti sada sarvam sada na ca || 41|| ahoratradikam nasti
    snanadhyanadikam nahi | bhrantirabhrantirnastyeva nastyanatmeti nishcinu || 42|| vedashastram puranam
    ca karyam karanamishvarah | loko bhutam janastvaikyam sarvam mithya na samshayah || 43|| bandho mokshah
    sukham duhkham dhyanam cittam surasurah | gaunam mukhyam param canyatsarvam mithya na samshayah ||
    44|| vaca vadati yatkincitsankalpaih kalpyate ca yat | manasa cintyate yadyatsarvam mithya na samshayah
    || 45|| buddhya nishciyate kinciccitte nishciyate kvacit | shastraih prapancyate yadyannetrenaiva
    nirikshyate || 46|| shrotrabhyam shruyate yadyadanyatsadbhavameva ca | netram shrotram gatrameva mithyeti
    ca sunishcitam || 47|| idamityeva nirdishtamayamityeva kalpyate | tvamaham tadidam so'hamanyatsadbhavameva
    ca || 48|| yadyatsambhavyate loke sarvasankalpasambhramah | sarvadhyasam sarvagopyam sarvabhogaprabhedakam
    || 49|| sarvadoshaprabhedacca nastyanatmeti nishcinu | madiyam ca tvadiyam ca mameti ca taveti ca
    || 50|| mahyam tubhyam mayetyadi tatsarvam vitatham bhavet | rakshako vishnurityadi brahma srishtestu
    karanam || 51|| samhare rudra ityevam sarvam mithyeti nishcinu | snanam japastapo homah svadhyayo
    devapujanam || 52|| mantram tantram ca satsango gunadoshavijrimbhanam | antahkaranasadbhava avidyashca
    sambhavah || 53|| anekakotibrahmandam sarvam mithyeti nishcinu | sarvadeshikavakyoktiryena kenapi
    nishcitam || 54|| drishyate jagati yadyadyadyajjagati vikshyate | vartate jagati yadyatsarvam mithyeti
    nishcinu || 55|| yena kenaksharenoktam yena kena vinishcitam | yena kenapi gaditam yena kenapi moditam
    || 56|| yena kenapi yaddattam yena kenapi yatkritam | yatra yatra shubham karma yatra yatra ca dushkritam
    || 57|| yadyatkaroshi satyena sarvam mithyeti nishcinu | tvameva paramatmasi tvameva paramo guruh
    || 58|| tvamevakasharupo'si sakshihino'si sarvada | tvameva sarvabhavo'si tvam brahmasi na samshayah
    || 59|| kalahino'si kalo'si sada brahmasi cidghanah | sarvatah svasvarupo'si caitanyaghanavanasi ||
    60|| satyo'si siddho'si sanatano'si mukto'si moksho'si mudamrito'si | devo'si shanto'si niramayo'si
    brahmasi purno'si paratparo'si || 61|| samo'si saccapi sanatano'si satyadivakyaih pratibodhito'si
    | sarvangahino'si sada sthito'si brahmendrarudradivibhavito'si || 62|| sarvaprapancabhramavarjito'si
    sarveshu bhuteshu ca bhasito'si | sarvatra sankalpavivarjito'si sarvagamantarthavibhavito'si || 63||
    sarvatra santoshasukhasano'si sarvatra gatyadivivarjito'si | sarvatra lakshyadivivarjito'si dhyato'si
    vishnvadisurairajasram || 64|| cidakarasvarupo'si cinmatro'si nirankushah | atmanyeva sthito'si tvam
    sarvashunyo'si nirgunah || 65|| anando'si paro'si tvameka evadvitiyakah | cidghananandarupo'si paripurnasvarupakah
    || 66|| sadasi tvamasi jno'si so'si janasi vikshasi | saccidanandarupo'si vasudevo'si vai prabhuh
    || 67|| amrito'si vibhushcasi cancalo hyacalo hyasi | sarvo'si sarvahino'si shantashantavivarjitah
    || 68|| sattamatraprakasho'si sattasamanyako hyasi | nityasiddhisvarupo'si sarvasiddhivivarjitah ||
    69|| ishanmatravishunyo'si anumatravivarjitah | astitvavarjito'si tvam nastitvadivivarjitah || 70||
    lakshyalakshanahino'si nirvikaro niramayah | sarvanadantaro'si tvam kalakashthavivarjitah || 71||
    brahmavishnvishahino'si svasvarupam prapashyasi | svasvarupavashesho'si svanandabdhau nimajjasi ||
    72|| svatmarajye svamevasi svayambhavavivarjitah | shishtapurnasvarupo'si svasmatkincinna pashyasi
    || 73|| svasvarupanna calasi svasvarupena jrimbhasi | svasvarupadananyo'si hyahamevasi nishcinu ||
    74|| idam prapancam yatkincidyadyajjagati vidyate | drishyarupam ca drigrupam sarvam shashavishanavat
    || 75|| bhumirapo'nalo vayuh kham mano buddhireva ca | ahankarashca tejashca lokam bhuvanamandalam
    || 76|| nasho janma ca satyam ca punyapapajayadikam | ragah kamah krodhalobhau dhyanam dhyeyam gunam
    param || 77|| gurushishyopadeshadiradirantam shamam shubham | bhutam bhavyam vartamanam lakshyam lakshanamadvayam
    || 78|| shamo vicarah santosho bhoktribhojyadirupakam | yamadyashtangayogam ca gamanagamanatmakam
    || 79|| adimadhyantarangam ca grahyam tyajyam harih shivah | indriyani manashcaiva avasthatritayam
    tatha || 80|| caturvimshatitattvam ca sadhananam catushtayam | sajatiyam vijatiyam loka bhuradayah
    kramat || 81|| sarvavarnashramacaram mantratantradisangraham | vidyavidyadirupam ca sarvavedam jadajadam
    || 82|| bandhamokshavibhagam ca jnanavijnanarupakam | bodhabodhasvarupam va dvaitadvaitadibhashanam
    || 83|| sarvavedantasiddhantam sarvashastrarthanirnayam | anekajivasadbhavamekajivadinirnayam || 84||
    yadyaddhyayati cittena yadyatsankalpate kvacit | buddhya nishciyate yadyadguruna samsha
  devanagari: चिन्मात्रस्वरूपमनुब्रूहीति । स होवाच परमः शिवः । अखण्डैकरसं दृश्यमखण्डैकरसं जगत् । अखण्डैकरसं
    भावमखण्डैकरसं स्वयम् ॥ १॥ अखण्डैकरसो मन्त्र अखण्डैकरसा क्रिया । अखण्डैकरसं ज्ञानमखण्डैकरसं जलम् ॥
    २॥ अखण्डैकरसा भूमिरखण्डैकरसं वियत् । अखण्डैकरसं शास्त्रमखण्डैकरसा त्रयी ॥ ३॥ अखण्डैकरसं ब्रह्म चाखण्डैकरसं
    व्रतम् । अखण्डैकरसो जीव अखण्डैकरसो ह्यजः ॥ ४॥ अखण्डैकरसो ब्रह्मा अखण्डैकरसो हरिः । अखण्डैकरसो रुद्र
    अखण्डैकरसोऽस्म्यहम् ॥ ५॥ अखण्डैकरसो ह्यात्मा ह्यखण्डैकरसो गुरुः । अखण्डैकरसं लक्ष्यमखण्डैकरसं महः
    ॥ ६॥ अखण्डैकरसो देह अखण्डैकरसं मनः । अखण्डैकरसं चित्तमखण्डैकरसं सुखम् ॥ ७॥ अखण्डैकरसा विद्या अखण्डैकरसोऽव्ययः
    । अखण्डैकरसं नित्यमखण्डैकरसं परम् ॥ ८॥ अखण्डैकरसं किञ्चिदखण्डैकरसं परम् । अखण्डैकरसादन्यन्नास्ति नास्ति
    षडानन ॥ ९॥ अखण्डैकरसान्नास्ति अखण्डैकरसान्न हि । अखण्डैकरसात्किञ्चिदखण्डैकरसादहम् ॥ १०॥ अखण्डैकरसं
    स्थूलं सूक्ष्मं चाखण्डरूपकम् । अखण्डैकरसं वेद्यमखण्डैकरसो भवान् ॥ ११॥ अखण्डैकरसं गुह्यमखण्डैकरसादिकम्
    । अखण्डैकरसो ज्ञाता ह्यखण्डैकरसा स्थितिः ॥ १२॥ अखण्डैकरसा माता अखण्डैकररसः पिता । अखण्डैकरसो भ्राता
    अखण्डैकरसः पतिः ॥ १३॥ अखण्डैकरसं सूत्रमखण्डैकरसो विराट् । अखण्डैकरसं गात्रमखण्डैकरसं शिरः ॥ १४॥ अखण्डैकरसं
    चान्तरखण्डैकरसं बहिः । अखण्डैकरसं पूर्णमखण्डैकरसामृतम् ॥ १५॥ अखैण्डैकरसं गोत्रमखण्डैकरसं गृहम् । अखण्डैकरसं
    गोप्यमखण्डैकरसशशी ॥ १६॥ अखण्डैकरसास्तारा अखण्डैकरसो रविः । अखण्डैकरसं क्षेत्रमखण्डैकरसा क्षमा ॥ १७॥
    अखण्डैकरस शान्त अखण्डैकरसोऽगुणः । अखण्डैकरसः साक्षी अखण्डैकरसः सुहृत् ॥ १८॥ अखण्डैकरसो बन्धुरखण्डैकरसः
    सखा । अखण्डैकरसो राजा अखण्डैकरसं पुरम् ॥ १९॥ अखण्डैकरसं राज्यमखण्डैकरसाः प्रजाः । अखण्डैकरसं तारमखण्डैकरसो
    जपः ॥ २०॥ अखण्डैकरसं ध्यानमखण्डैकरसं पदम् । अखण्डैकरसं ग्राह्यमखण्डैकरसं महत् ॥ २१॥ अखण्डैकरसं ज्योतिरखण्डैकरसं
    धनम् । अखण्डैकरसं भोज्यमखण्डैकरसं हविः ॥ २२॥ अखण्डैकरसो होम अखण्डैकरसो जपः । अखण्डैकरसं स्वर्गमखण्डैकरसः
    स्वयम् ॥ २३॥ अखण्डैकरसं सर्वं चिन्मात्रमिति भावयेत् । चिन्मात्रमेव चिन्मात्रमखण्डैकरसं परम् ॥ २४॥
    भववर्जितचिन्मात्रं सर्वं चिन्मात्रमेव हि । इदं च सर्वं चिन्मात्रमयं चिन्मयमेव हि ॥ २५॥ आत्मभावं च
    चिन्मात्रमखण्डैकरसं विदुः । सर्वलोकं च चिन्मात्रं वत्ता मत्ता च चिन्मयम् ॥ २६॥ आकाशो भूर्जलं वायुरग्निर्ब्रह्मा
    हरिः शिवः । यत्किञ्चिद्यन्न किञ्चिच्च सर्वं चिन्मात्रमेव हि ॥ २७॥ अखण्डैकरसं सर्वं यद्यच्चिन्मात्रमेव
    हि । भूतं भव्यं भविष्यच्च सर्वं चिन्मात्रमेव हि ॥ २८॥ द्रव्यं कालं च चिन्मात्रं ज्ञानं ज्ञेयं चिदेव
    हि । ज्ञाता चिन्मात्ररूपश्च सर्वं चिन्मयमेव हि ॥ २९॥ सम्भाषणं च चिन्मात्रं यद्यच्चिन्मात्रमेव हि ।
    असच्च सच्च चिन्मात्रमाद्यन्तं चिन्मयं सदा ॥ ३०॥ आदिरन्तश्च चिन्मात्रं गुरुशिष्यादि चिन्मयम् । दृग्दृश्यं
    यदि चिन्मात्रमस्ति चेच्चिन्मयं सदा ॥ ३१॥ सर्वाश्चर्यं हि चिन्मात्रं देहं चिन्मात्रमेव हि । लिङ्गं
    च कारणं चैव चिन्मात्रान्न हि विद्यते ॥ ३२॥ अहं त्वं चैव चिन्मात्रं मूर्तामूर्तादिचिन्मयम् । पुण्यं
    पापं च चिन्मात्रं जीवश्चिन्मात्रविग्रहः ॥ ३३॥ चिन्मात्रान्नास्ति सङ्कल्पश्चिन्मात्रान्नास्ति वेदनम्
    । चिन्मात्रान्नास्ति मन्त्रादि चिन्मात्रान्नास्ति देवता ॥ ३४॥ चिन्मात्रान्नास्ति दिक्पालाश्चिन्मात्राद्व्यावहारिकम्
    । चिन्मात्रात्परमं ब्रह्म चिन्मात्रान्नास्ति कोऽपि हि ॥ ३५॥ चिन्मात्रान्नास्ति माया च चिन्मात्रान्नास्ति
    पूजनम् । चिन्मात्रान्नास्ति मन्तव्यं चिन्मात्रान्नास्ति सत्यकम् ॥ ३६॥ चिन्मात्रान्नास्ति कोशादि चिन्मात्रान्नास्ति
    वै वसु । चिन्मात्रान्नास्ति मौनं च चिन्मात्रान्नस्त्यमौनकम् ॥ ३७॥ चिन्मात्रान्नास्ति वैराग्यं सर्वं
    चिन्मात्रमेव हि । यच्च यावच्च चिन्मात्रं यच्च यावच्च दृश्यते ॥ ३८॥ यच्च यावच्च दूरस्थं सर्वं चिन्मात्रमेव
    हि । यच्च यावच्च भूतादि यच्च यावच्च लक्ष्यते ॥ ३९॥ यच्च यावच्च वेदान्ताः सर्वं चिन्मात्रमेव हि । चिन्मात्रान्नास्ति
    गमनं चिन्मात्रान्नास्ति मोक्षकम् ॥ ४०॥ चिन्मात्रान्नास्ति लक्ष्यं च सर्वं चिन्मात्रमेव हि । अखण्डैकरसं
    ब्रह्म चिन्मात्रान्न हि विद्यते ॥ ४१॥ शास्त्रे मयि त्वयीशे च ह्यखण्डैकरसो भवान् । इत्येकरूपतया यो
    वा जानात्यहं त्विति ॥ ४२॥ सकृज्ज्ञानेन मुक्तिः स्यात्सम्यग्ज्ञाने स्वयं गुरुः ॥ ४३॥ इति द्वितीयोऽध्यायः
    ॥ २॥ कुमारः पितरमात्मानुभवमनुब्रूहीति पप्रच्छ । स होवाच परः शिवः । परब्रह्मस्वरूपोऽहं परमानन्दमस्म्यहम्
    । केवलं ज्ञानरूपोऽहं केवलं परमोऽस्म्यहम् ॥ १॥ केवलं शान्तरूपोऽहं केवलं चिन्मयोऽस्म्यहम् । केवलं नित्यरूपोऽहं
    केवलं शाश्वतोऽस्म्यहम् ॥ २॥ केवलं सत्त्वरूपोऽहमहं त्यक्त्वाहमस्म्यहम् । सर्वहीनस्वरूपोऽहं चिदाकाशमयोऽस्म्यहम्
    ॥ ३॥ केवलं तुर्यरूपोऽस्मि तुर्यातीतोऽस्मि केवलः । सदा चैतन्यरूपोऽस्मि चिदानन्दमयोऽस्म्यहम् ॥ ४॥ केवलाकाररूपोऽस्मि
    शुद्धरूपोऽस्म्यहं सदा । केवलं ज्ञानरूपोऽस्मि केवलं प्रियमस्म्यहम् ॥ ५॥ निर्विकल्पस्वरूपोऽस्मि निरीहोऽस्मि
    निरामयः । सदाऽसङ्गस्वरूपोऽस्मि निर्विकारोऽहमव्ययः ॥ ६॥ सदैकरसरूपोऽस्मि सदा चिन्मात्रविग्रहः । अपरिच्छिन्नरूपोऽस्मि
    ह्यखण्डानन्दरूपवान् ॥ ७॥ सत्परानन्दरूपोऽस्मि चित्परानन्दमस्म्यहम् । अन्तरान्तररूपोऽहमवाङ्मनसगोचरः
    ॥ ८॥ आत्मानन्दस्वरूपोऽहं सत्यानन्दोऽस्म्यहं सदा । आत्मारामस्वरूपोऽस्मि ह्ययमात्मा सदाशिवः ॥ ९॥ आत्मप्रकाशरूपोऽस्मि
    ह्यात्मज्योतिरसोऽस्म्यहम् । आदिमध्यान्तहीनोऽस्मि ह्याकाशसदृशोऽस्म्यहम् ॥ १०॥ नित्यशुद्धचिदानन्दसत्तामात्रोऽहमव्ययः
    । नित्यबुद्धविशुद्धैकसच्चिदानन्दमस्म्यहम् ॥ १॥ नित्यशेषस्वरूपोऽस्मि सर्वातीतोऽस्म्यहं सदा । रूपातीतस्वरूपोऽस्मि
    परमाकाशविग्रहः ॥ १२॥ भूमानन्दस्वरूपोऽस्मि भाषाहीनोऽस्म्यहं सदा । सर्वाधिष्ठानरूपोऽस्मि सर्वदा चिद्घनोऽस्म्यहम्
    ॥ १३॥ देहभावविहीनोऽस्मि चिन्ताहीनोऽस्मि सर्वदा । चित्तवृत्तिविहीनोऽहं चिदात्मैकरसोऽस्म्यहम् ॥ १४॥
    सर्वदृश्यविहीनोऽहं दृग्रूपोऽस्म्यहमेव हि । सर्वदा पूर्णरूपोऽस्मि नित्यतृप्तोऽस्म्यहं सदा ॥ १५॥ अहं
    ब्रह्मैव सर्वं स्यादहं चैतन्यमेव हि । अहमेवाहमेवास्मि भूमाकाशस्वरूपवान् ॥ १६॥ अहमेव महानात्मा ह्यहमेव
    परात्परः । अहमन्यवदाभामि ह्यहमेव शरीरवत् ॥ १७॥ अहं शिष्यवदाभामि ह्ययं लोकत्रयाश्रयः । अहं कालत्रयातीत
    अहं वेदैरुपासितः ॥ १८॥ अहं शास्त्रेण निर्णीत अहं चित्ते व्यवस्थितः । मत्त्यक्तं नास्ति किञ्चिद्वा
    मत्त्यक्तं पृथिवी च वा ॥ १९॥ मयातिरिक्तं यद्यद्वा तत्तन्नास्तीति निश्चिनु । अहं ब्रह्मास्मि सिद्धोऽस्मि
    नित्यशुद्धोऽस्म्यहं सदा ॥ २०॥ निर्गुणः केवलात्मास्मि निराकारोऽस्म्यहं सदा । केवलं ब्रह्ममात्रोऽस्मि
    ह्यजरोऽस्म्यमरोऽस्म्यहम् ॥ २१॥ स्वयमेव स्वयं भामि स्वयमेव सदात्मकः । स्वयमेवात्मनि स्वस्थः स्वयमेव
    परा गतिः ॥ २२॥ स्वयमेव स्वयं भञ्जे स्वयमेव स्वयं रमे । स्वयमेव स्वयं ज्योतिः स्वयमेव स्वयं महः ॥ २३॥
    स्वस्यात्मनि स्वयं रंस्ये स्वात्मन्येव विलोकये । स्वात्मन्येव सुखासीनः स्वात्ममात्रावशेषकः ॥ २४॥ स्वचैतन्ये
    स्वयं स्थास्ये स्वात्मराज्ये सुखे रमे । स्वात्मसिंहासने स्थित्वा स्वात्मनोऽन्यन्न चिन्तये ॥ २५॥ चिद्रूपमात्रं
    ब्रह्मैव सच्चिदानन्दमद्वयम् । आनन्दघन एवाहमहं ब्रह्मास्मि केवलम् ॥ २६॥ सर्वदा सर्वशून्योऽहं सर्वात्मानन्दवानहम्
    । नित्यानन्दस्वरूपोऽहमात्माकाशोऽस्मि नित्यदा ॥ २७॥ अहमेव हृदाकाशश्चिदादित्यस्वरूपवान् । आत्मनात्मनि
    तृप्तोऽस्मि ह्यरूपोऽस्म्यहमव्ययः ॥ २८॥ एकसङ्ख्याविहीनोऽस्मि नित्यमुक्तस्वरूपवान् । आकाशादपि सूक्ष्मोऽहमाद्यन्ताभाववानहम्
    ॥ २९॥ सर्वप्रकाशरूपोऽहं परावरसुखोऽस्म्यहम् । सत्तामात्रस्वरूपोऽहं शुद्धमोक्षस्वरूपवान् ॥ ३०॥ सत्यानन्दस्वरूपोऽहं
    ज्ञानानन्दघनोऽस्म्यहम् । विज्ञानमात्ररूपोऽहं सच्चिदानन्दलक्षणः ॥ ३१॥ ब्रह्ममात्रमिदं सर्वं ब्रह्मणोऽन्यन्न
    किञ्चन । तदेवाहं सदानन्दं ब्रह्मैवाहं सनातनम् ॥ ३२॥ त्वमित्येतत्तदित्येतन्मत्तोऽन्यन्नास्ति किञ्चन
    । चिच्चैतन्यस्वरूपोऽहमहमेव शिवः परः ॥ ३३॥ अतिभावस्वरूपोऽहमहमेव सुखात्मकः । साक्षिवस्तुविहीनत्वात्साक्षित्वं
    नास्ति मे सदा ॥ ३४॥ केवलं ब्रह्ममात्रत्वादहमात्मा सनातनः । अहमेवादिशेषोऽहमहं शेषोऽहमेव हि ॥ ३५॥ नामरूपविमुक्तोऽहमहमानन्दविग्रहः
    । इन्द्रियाभावरूपोऽहं सर्वभावस्वरूपकः ॥ ३६॥ बन्धमुक्तिविहीनोऽहं शाश्वतानन्दविग्रहः । आदिचैतन्यमात्रोऽहमखण्डैकरसोऽस्म्यहम्
    ॥ ३७॥ वाङ्मनोऽगोचरश्चाहं सर्वत्र सुखवानहम् । सर्वत्र पूर्णरूपोऽहं भूमानन्दमयोऽस्म्यहम् ॥ ३८॥ सर्वत्र
    तृप्तिरूपोऽहं परामृतरसोऽस्म्यहम् । एकमेवाद्वितीयं सद्ब्रह्मैवाहं न संशयः ॥ ३९॥ सर्वशून्यस्वरूपोऽहं
    सकलागमगोचरः । मुक्तोऽहं मोक्षरूपोऽहं निर्वाणसुखरूपवान् ॥ ४०॥ सत्यविज्ञानमात्रोऽहं सन्मात्रानन्दवानहम्
    । तुरीयातीतरूपोऽहं निर्विकल्पस्वरूपवान् ॥ ४१॥ सर्वदा ह्यजरूपोऽहं नीरागोऽस्मि निरञ्जनः । अहं शुद्धोऽस्मि
    बुद्धोऽस्मि नित्योऽस्मि प्रभुरस्म्यहम् ॥ ४२॥ ओङ्कारार्थस्वरूपोऽस्मि निष्कलङ्कमयोऽस्म्यहम् । चिदाकारस्वरूपोऽस्मि
    नाहमस्मि न सोऽस्म्यहम् ॥ ४३॥ न हि किञ्चित्स्वरूपोऽस्मि निर्व्यापारस्वरूपवान् । निरंशोऽस्मि निराभासो
    न मनो नेन्द्रियोऽस्म्यहम् ॥ ४४॥ न बुद्धिर्न विकल्पोऽहं न देहादित्रयोऽस्म्यहम् । न जाग्रत्स्वप्नरूपोऽहं
    न सुषुप्तिस्वरूपवान् ॥ ४५॥ न तापत्रयरूपोऽहं नेषणात्रयवानहम् । श्रवणं नास्ति मे सिद्धेर्मननं च चिदात्मनि
    ॥ ४६॥ सजातीयं न मे किञ्चिद्विजातीयं न मे क्वचित् । स्वगतं च न मे किञ्चिन्न मे भेदत्रयं क्वचित् ॥ ४७॥
    असत्यं हि मनोरूपमसत्यं बुद्धिरूपकम् । अहङ्कारमसिद्धीति नित्योऽहं शाश्वतो ह्यजः ॥ ४८॥ देहत्रयमसद्विद्धि
    कालत्रयमसत्सदा । गुणत्रयमसत्विद्धि ह्ययं सत्यात्मकः शुचिः ॥ ४९॥ श्रुतं सर्वमसत्द्विद्धि वेदं सर्वमसत्सदा
    । शास्त्रं सर्वमसत्द्विद्धि ह्यहं सत्यचिदात्मकः ॥ ५०॥ मूर्तित्रयमसद्विद्धि सर्वभूतमसत्सदा । सर्वतत्त्वमसद्विद्धि
    ह्ययं भूमा सदाशिवः ॥ ५१॥ गुरुशिष्यमसद्विद्धि गुरोर्मन्त्रमसत्ततः । यद्दृश्यं तदसद्विद्धि न मां विद्धि
    तथाविधम् ॥ ५२॥ यच्चिन्त्यं तदसद्विद्धि यन्न्यायं तदसत्सदा । यद्धितं तदसद्विद्धि न मां विद्धि तथाविधम्
    ॥ ५३॥ सर्वान्प्राणानसद्विद्धि सर्वान्भोगानसत्त्विति । दृष्टं श्रुतमसद्विद्धि ओतं प्रोतमसन्मयम् ॥ ५४॥
    कार्याकार्यमसद्विद्धि नष्टं प्राप्तमसन्मयम् । दुःखादुःखमसद्विद्धि सर्वासर्वमन्मयम् ॥ ५५॥ पूर्णापूर्णमसद्विद्धि
    धर्माधर्ममसन्मयम् । लाभालाभावसद्विद्धि जयाजयमसन्मयम् ॥ ५६॥ शब्दं सर्वमसद्विद्धि स्पर्शं सर्वमसत्सदा
    । रूपं सर्वमसद्विद्धि रसं सर्वमसन्मयम् ॥ ५७॥ गन्धं सर्वमसद्विद्धि सर्वाज्ञानमसन्मयम् । असदेव सदा सर्वमसदेव
    भवोद्भवम् ॥ ५८॥ असदेव गुणं सर्वं सन्मात्रमहमेव हि । स्वात्ममन्त्रं सदा पश्येत्स्वात्ममन्त्रं सदाभ्यसेत्
    ॥ ५९॥ अहं ब्रह्मास्मि मन्त्रोऽयं दृश्यपापं विनाशयेत् । अहं ब्रह्मास्मि मन्त्रोऽयमन्यमन्त्रं विनाशयेत्
    ॥ ६०॥ अहं ब्रह्मास्मि मन्त्रोऽयं देहदोषं विनाशयेत् । अहं ब्रह्मास्मि मन्त्रोऽयं जन्मपापं विनाशयेत्
    ॥ ६१॥ अहं ब्रह्मास्मि मन्त्रोऽयं मृत्युपाशं विनाशयेत् । अहं ब्रह्मास्मि मन्त्रोऽयं द्वैतदुःखं विनाशयेत्
    ॥ ६२॥ अहं ब्रह्मास्मि मन्त्रोऽयं भेदबुद्धिं विनाशयेत् । अहं ब्रह्मास्मि मन्त्रोऽयं चिन्तादुःखं विनाशयेत्
    ॥ ६३॥ अहं ब्रह्मास्मि मन्त्रोऽयं बुद्धिव्याधिं विनाशयेत् । अहं ब्रह्मास्मि मन्त्रोऽयं चित्तबन्धं विनाशयेत्
    ॥ ६४॥ अहं ब्रह्मास्मि मन्त्रोऽयं सर्वव्याधीन्विनाशयेत् । अहं ब्रह्मास्मि मन्त्रोऽयं सर्वशोकं विनाशयेत्
    ॥ ६५॥ अहं ब्रह्मास्मि मन्त्रोऽयं कामादीन्नाशयेत्क्षणात् । अहं ब्रह्मास्मि मन्त्रोऽयं क्रोधशक्तिं विनाशयेत्
    ॥ ६६॥ अहं ब्रह्मास्मि मन्त्रोऽयं चित्तवृत्तिं विनाशयेत् । अहं ब्रह्मास्मि मन्त्रोऽयं सङ्कल्पादीन्विनाशयेत्
    ॥ ६७॥ अहं ब्रह्मास्मि मन्त्रोऽयं कोटिदोषं विनाशयेत् । अहं ब्रह्मास्मि मन्त्रोऽयं सर्वतन्त्रं विनाशयेत्
    ॥ ६८॥ अहं ब्रह्मास्मि मन्त्रोऽयमात्माज्ञानं विनाशयेत् । अहं ब्रह्मास्मि मन्त्रोऽयमात्मलोकजयप्रदः ॥
    ६९॥ अहं ब्रह्मास्मि मन्त्रोऽयमप्रतर्क्यसुखप्रदः । अहं ब्रह्मास्मि मन्त्रोऽयमजडत्वं प्रयच्छति ॥ ७०॥
    अहं ब्रह्मास्मि मन्त्रोऽयमनात्मासुरमर्दनः । अहं ब्रह्मास्मि वज्रोऽयमनात्माख्यगिरीन्हरेत् ॥ ७१॥ अहं
    ब्रह्मास्मि मन्त्रोऽयमनात्माख्यासुरान्हरेत् । अहं ब्रह्मास्मि मन्त्रोऽयं सर्वांस्तान्मोक्षयिष्यति
    ॥ ७२॥ अहं ब्रह्मास्मि मन्त्रोऽयं ज्ञानानन्दं प्रयच्छति । सप्तकोटिमहामन्त्रं जन्मकोटिशतप्रदम् ॥ ७३॥
    सर्वमन्त्रान्समुत्सृज्य एतं मन्त्रं समभ्यसेत् । सद्यो मोक्षमवाप्नोति नात्र सन्देहमण्वपि ॥ ७४॥ इति
    तृतीयोध्यायः ॥ ३॥ कुमारः परमेश्वरं पप्रच्छ जीवन्मुक्तविदेहमुक्तयोः स्थितिमनुब्रूहीति । स होवाच परः
    शिवः । चिदात्माहं परात्माहं निर्गुणोऽहं परात्परः । आत्ममात्रेण यस्तिष्ठेत्स जीवन्मुक्त उच्यते ॥ १॥
    देहत्रयातिरिक्तोऽहं शुद्धचैतन्यमस्म्यहम् । ब्रह्माहमिति यस्यान्तः स जीवनमुक्त उच्यते ॥ २॥ आनन्दघनरूपोऽस्मि
    परानन्दघनोऽस्म्यहम् । यस्य देहादिकं नास्ति यस्य ब्रह्मेति निश्चयः । परमानन्दपूर्णो यः स जीवन्मुक्त
    उच्यते ॥ ३॥ यस्य किञ्चिदहं नास्ति चिन्मात्रेणावतिष्ठते । चैतन्यमात्रो यस्यान्तश्चिन्मात्रैकस्वरूपवान्
    ॥ ४॥ सर्वत्र पूर्णरूपात्मा सर्वत्रात्मावशेषकः । आनन्दरतिरव्यक्तः परिपूर्णश्चिदात्मकः ॥ ५॥ शुद्धचैतन्यरूपात्मा
    सर्वसङ्गविवर्जितः । नित्यानन्दः प्रसन्नात्मा ह्यन्यचिन्ताविवर्जितः ॥ ६ किञ्चिदस्तित्वहीनो यः स जीवन्मुक्त
    उच्यते । न मे चित्तं न मे बुद्धिर्नाहङ्कारो न चेन्द्रियम् ॥ ७॥ न मे देहः कदाचिद्वा न मे प्राणादयः
    क्वचित् । न मे माया न मे कामो न मे क्रोधः परोऽस्म्यहम् ॥ ८॥ न मे किञ्चिदिदं वापि न मे किञ्चित्क्वचिज्जगत्
    । न मे दोषो न मे लिङ्गं न मे चक्षुर्न मे मनः ॥ ९॥ न मे श्रोत्रं न मे नासा न मे जिह्वा न मे करः । न
    मे जाग्रन्न मे स्वप्नं न मे कारणमण्वपि ॥ १०॥ न मे तुरीयमिति यः स जीवन्मुक्त उच्यते । इदं सर्वं न मे
    किञ्चिदयं सर्वं न मे क्वचित् ॥ ११॥ न मे कालो न मे देशो न मे वस्तु न मे मतिः । न मे स्नानं न मे सन्ध्या
    न मे दैवं न मे स्थलम् ॥ १२॥ न मे तीर्थं न मे सेवा न मे ज्ञानं न मे पदम् । न मे बन्धो न मे जन्म न मे
    वाक्यं न मे रविः ॥ १३॥ न मे पुण्यं न मे पापं न मे कार्यं न मे शुभम् । ने मे जीव इति स्वात्मा न मे
    किञ्चिज्जगत्रयम् ॥ १४॥ न मे मोक्षो न मे द्वैतं न मे वेदो न मे विधिः । न मेऽन्तिकं न मे दूरं न मे बोधो
    न मे रहः ॥ १५॥ न मे गुरुर्न मे शिष्यो न मे हीनो न चाधिकः । न मे ब्रह्म न मे विष्णुर्न मे रुद्रो न
    चन्द्रमाः ॥ १६॥ न मे पृथ्वी न मे तोयं न मे वायुर्न मे वियत् । न मे वह्निर्न मे गोत्रं न मे लक्ष्यं
    न मे भवः ॥ १७॥ न मे ध्याता न मे ध्येयं न मे ध्यानं न मे मनुः । न मे शीतं न मे चोष्णं न मे तृष्णा न
    मे क्षुधा ॥ १८॥ न मे मित्रं न मे शत्रुर्न मे मोहो न मे जयः । न मे पूर्वं न मे पश्चान्न मे चोर्ध्वं
    न मे दिशः ॥ १९॥ न मे वक्तव्यमल्पं वा न मे श्रोतव्यमण्वपि । न मे गन्तव्यमीषद्वा न मे ध्यातव्यमण्वपि
    ॥ २०॥ न मे भोक्तव्यमीषद्वा न मे स्मर्तव्यमण्वपि । न मे भोगो न मे रागो न मे यागो न मे लयः ॥ २१॥ न मे
    मौर्ख्यं न मे शान्तं न मे बन्धो न मे प्रियम् । न मे मोदः प्रमोदो वा न मे स्थूलं न मे कृशम् ॥ २२॥ न
    मे दीर्घं न मे ह्रस्वं न मे वृद्धिर्न मे क्षयः । अध्यारोपोऽपवादो वा न मे चैकं न मे बहु ॥ २३॥ न मे
    आन्ध्यं न मे मान्द्यं न मे पट्विदमण्वपि । न मे मांसं न मे रक्तं न मे मेदो न मे ह्यसृक् ॥ २४॥ न मे
    मज्जा न मेऽस्थिर्वा न मे त्वग्धातु सप्तकम् । न मे शुक्लं न मे रक्तं न मे नीलं नमे पृथक् ॥ २५॥ न मे
    तापो न मे लाभो मुख्यं गौणं न मे क्वचित् । न मे भ्रान्तिर्न मे स्थैर्यं न मे गुह्यं न मे कुलम् ॥ २६॥
    न मे त्याज्यं न मे ग्राह्यं न मे हास्यं न मे नयः । न मे वृत्तं न मे ग्लानिर्न मे शोष्यं न मे सुखम्
    ॥ २७॥ न मे ज्ञाता न मे ज्ञानं न मे ज्ञेयं न मे स्वयम् । न मे तुभ्यं नमे मह्यं न मे त्वं च न मे त्वहम्
    ॥ २८॥ न मे जरा न मे बाल्यं न मे यौवनमण्वपि । अहं ब्रह्मास्म्यहं ब्रह्मास्म्यहं ब्रह्मेति निश्चयः ॥
    २९॥ चिदहं चिदहं चेति स जीवन्मुक्त उच्यते । ब्रह्मैवाहं चिदेवाहं परो वाहं न संशयः ॥ ३०॥ स्वयमेव स्वयं
    हंसः स्वयमेव स्वयं स्थितः । स्वयमेव स्वयं पश्येत्स्वात्मराज्ये सुखं वसेत् ॥ ३१॥ स्वात्मानन्दं स्वयं
    भोक्ष्येत्स जीवन्मुक्त उच्यते । स्वयमेवैकवीरोऽग्रे स्वयमेव प्रभुः स्मृतः ॥ ३२॥ ब्रह्मभूतः प्रशान्तात्मा
    ब्रह्मानन्दमयः सुखी । स्वच्छरूपो महामौनी वैदेही मुक्त एव सः ॥ ३३॥ सर्वात्मा समरूपात्मा शुद्धात्मा
    त्वहमुत्थितः । एकवर्जित एकात्मा सर्वात्मा स्वात्ममात्रकः ॥ ३४॥ अजात्मा चामृतात्माहं स्वयमात्माहमव्ययः
    । लक्ष्यात्मा ललितात्माहं तूष्णीमात्मस्वभाववान् ॥ ३५॥ आनन्दात्मा प्रियो ह्यात्मा मोक्षात्मा बन्धवर्जितः
    । ब्रह्मैवाहं चिदेवाहमेवं वापि न चिन्त्यते ॥ ३६॥ चिन्मात्रेणैव यस्तिष्ठेद्वैदेही मुक्त एव सः ॥ ३७॥
    निश्चयं च परित्यज्य अहं ब्रह्मेति निश्चयम् । आनन्दभरितस्वान्तो वैदेही मुक्त एव सः ॥ ३८॥ सर्वमस्तीति
    नास्तीति निश्चयं त्यज्य तिष्ठति । अहं ब्रह्मास्मि नास्मीति सच्चिदानन्दमात्रकः ॥ ३९॥ किञ्चित्क्वचित्कदाचिच्च
    आत्मानं न स्पृशत्यसौ । तूष्णीमेव स्थितस्तूष्णीं तूष्णीं सत्यं न किञ्चन ॥ ४०॥ परमात्मा गुणातीतः सर्वात्मा
    भूतभावनः । कालभेदं वस्तुभेदं देशभेदं स्वभेदकम् ॥ ४१॥ किञ्चिद्भेदं न तस्यास्ति किञ्चिद्वापि न विद्यते
    । अहं त्वं तदिदं सोऽयं कालात्मा कालहीनकः ॥ ४२॥ शून्यात्मा सूक्ष्मरूपात्मा विश्वात्मा विश्वहीनकः ।
    देवात्मादेवहीनात्मा मेयात्मा मेयवर्जितः ॥ ४३॥ सर्वत्र जडहीनात्मा सर्वेषामन्तरात्मकः । सर्वसङ्कल्पहीनात्मा
    चिन्मात्रोऽस्मीति सर्वदा ॥ ४४॥ केवलः परमात्माहं केवलो ज्ञानविग्रहः । सत्तामात्रस्वरूपात्मा नान्यत्किञ्चिज्जगद्भयम्
    ॥ ४५॥ जीवेश्वरेति वाक्क्वेति वेदशास्त्राद्यहं त्विति । इदं चैतन्यमेवेति अहं चैतन्यमित्यपि ॥ ४६॥ इति
    निश्चयशून्यो यो वैदेही मुक्त एव सः । चैतन्यमात्रसंसिद्धः स्वात्मारामः सुखासनः ॥ ४७॥ अपरिच्छिन्नरूपात्मा
    अणुस्थूलादिवर्जितः । तुर्यतुर्या परानन्दो वैदेही मुक्त एव सः ॥ ४८॥ नामरूपविहीनात्मा परसंवित्सुखात्मकः
    । तुरीयातीतरूपात्मा शुभाशुभविवर्जितः ॥ ४९॥ योगात्मा योगयुक्तात्मा बन्धमोक्षविवर्जितः । गुणागुणविहीनात्मा
    देशकालादिवर्जितः ॥ ५०॥ साक्ष्यसाक्षित्वहीनात्मा किञ्चित्किञ्चिन्न किञ्चन । यस्य प्रपञ्चमानं न ब्रह्माकारमपीह
    न ॥ ५१॥ स्वस्वरूपे स्वयञ्ज्योतिः स्वस्वरूपे स्वयंरतिः । वाचामगोचरानन्दो वाङ्मनोगोचरः स्वयम् ॥ ५२॥
    अतीतातीतभावो यो वैदेही मुक्त एव सः । चित्तवृत्तेरतीतो यश्चित्तवृत्त्यवभासकः ॥ ५३॥ सर्ववृत्तिविहीनात्मा
    वैदेही मुक्त एव सः । तस्मिन्काले विदेहीति देहस्मरणवर्जितः ॥ ५४॥ ईषन्मात्रं स्मृतं चेद्यस्तदा सर्वसमन्वितः
    । परैरदृष्टबाह्यात्मा परमानन्दचिद्धनः ॥ ५५॥ परैरदृष्टबाह्यात्मा सर्ववेदान्तगोचरः । ब्रह्मामृतरसास्वादो
    ब्रह्मामृतरसायनः ॥ ५६॥ ब्रह्मामृतरसासक्तो ब्रह्मामृतरसः स्वयम् । ब्रह्मामृतरसे मग्नो ब्रह्मानन्दशिवार्चनः
    ॥ ५७॥ ब्रह्मामृतरसे तृप्तो ब्रह्मानन्दानुभावकः । ब्रह्मानन्दशिवानन्दो ब्रह्मानन्दरसप्रभः ॥ ५८॥ ब्रह्मानन्दपरं
    ज्योतिर्ब्रह्मानन्दनिरन्तरः । ब्रह्मानन्दरसान्नादो ब्रह्मानन्दकुटुम्बकः ॥ ५९॥ ब्रह्मानन्दरसारूढो ब्रह्मानन्दैकचिद्धनः
    । ब्रह्मानन्दरसोद्बाहो ब्रह्मानन्दरसम्भरः ॥ ६०॥ ब्रह्मानन्दजनैर्युक्तो ब्रह्मानन्दात्मनि स्थितः ।
    आत्मरूपमिदं सर्वमात्मनोऽन्यन्न कञ्चन ॥ ६१॥ सर्वमात्माहमात्मास्मि परमात्मा परात्मकः । नित्यानन्द स्वरूपात्मा
    वैदेही मुक्त एव सः ॥ ६२॥ पूर्णरूपो महानात्मा प्रीतात्मा शाश्वतात्मकः । सर्वान्तर्यामिरूपात्मा निर्मलात्मा
    निरात्मकः ॥ ६३॥ निर्विकारस्वरूपात्मा शुद्धात्मा शान्तरूपकः । शान्ताशान्तस्वरूपात्मा नैकात्मत्वविवर्जितः
    ॥ ६४॥ जीवात्मपरमात्मेति चिन्तासर्वस्ववर्जितः । मुक्तामुक्तस्वरूपात्मा मुक्तामुक्तविवर्जितः ॥ ६५॥ बन्धमोक्षस्वरूपात्मा
    बन्धमोक्षविवर्जितः । द्वैताद्वैतस्वरूपात्मा द्वैताद्वैतविवर्जितः ॥ ६६॥ सर्वासर्वस्वरूपात्मा सर्वासर्वविवर्जितः
    । मोदप्रमोदरूपात्मा मोदादिविनिवर्जितः ॥ ६७॥ सर्वसङ्कल्पहीनात्मा वैदेही मुक्त एव सः । निष्कलात्मा निर्मलात्मा
    बुद्धात्मापुरुषात्मकः ॥ ६८॥ आनन्दादिविहीनात्मा अमृतात्मामृतात्मकः । कालत्रयस्वरूपात्मा कालत्रयविवर्जितः
    ॥ ६९॥ अखिलात्मा ह्यमेयात्मा मानात्मा मानवर्जितः । नित्यप्रत्यक्षरूपात्मा नित्यप्रत्यक्षनिर्णयः ॥ ७०॥
    अन्यहीनस्वभावात्मा अन्यहीनस्वयम्प्रभः । विद्याविद्यादिमेयात्मा विद्याविद्यादिवर्जितः ॥ ७१॥ नित्यानित्यविहीनात्मा
    इहामुत्रविवर्जितः । शमादिषट्कशून्यात्मा मुमुक्षुत्वादिवर्जितः ॥ ७२॥ स्थूलदेहविहीनात्मा सूक्ष्मदेहविवर्जितः
    । कारणादिविहीनात्मा तुरीयादिविवर्जितः ॥ ७३॥ अन्नकोशविहीनात्मा प्राणकोशविवर्जितः । मनःकोशविहीनात्मा
    विज्ञानादिविवर्जितः ॥ ७४॥ आनन्दकोशहीनात्मा पञ्चकोशविवर्जितः । निर्विकल्पस्वरूपात्मा सविकल्पविवर्जितः
    ॥ ७५॥ दृश्यानुविद्धहीनात्मा शब्दविद्धविवर्जितः । सदा समाधिशून्यात्मा आदिमध्यान्तवर्जितः ॥ ७६॥ प्रज्ञानवाक्यहीनात्मा
    अहम्ब्रह्मास्मिवर्जितः । तत्त्वमस्यादिहीनात्मा अयमात्मेत्यभावकः ॥ ७७॥ ओङ्कारवाच्यहीनात्मा सर्ववाच्यविवर्जितः
    । अवस्थात्रयहीनात्मा अक्षरात्मा चिदात्मकः ॥ ७८॥ आत्मज्ञेयादिहीनात्मा यत्किञ्चिदिदमात्मकः । भानाभानविहीनात्मा
    वैदेही मुक्त एव सः ॥ ७९॥ आत्मानमेव वीक्षस्व आत्मानं बोधय स्वकम् । स्वमात्मानं स्वयं भुङ्क्ष्व स्वस्थो
    भव षडानन ॥ ८०॥ स्वमात्मनि स्वयं तृप्तः स्वमात्मानं स्वयं चर । आत्मानमेव मोदस्व वैदेही मुक्तिको भवेत्युपनिषत्
    ॥ इति चतुर्थोऽध्यायः ॥ ४॥ निदाघो नाम वै मुनिः पप्रच्छ ऋभुं भगवन्तमात्मानात्मविवेकमनुब्रूहीति । स होवाच
    ऋभुः । सर्ववाचोऽवधिर्ब्रह्म सर्वचिन्तावधिर्गुरुः । सर्वकारणकार्यात्मा कार्यकारणवर्जितः ॥ १॥ सर्वसङ्कल्परहितः
    सर्वनादमयः शिवः । सर्ववर्जितचिन्मात्रः सर्वानन्दमयः परः ॥ २॥ सर्वतेजःप्रकाशात्मा नादानन्दमयात्मकः
    । सर्वानुभवनिर्मुक्तः सर्वध्यानविवर्जितः ॥ ३॥ सर्वनादकलातीत एष आत्माहमव्ययः । आत्मानात्मविवेकादिभेदाभेदविवर्जितः
    ॥ ४॥ शान्ताशान्तादिहीनात्मा नादान्तर्ज्योतिरूपकः । महावाक्यार्थतो दूरो ब्रह्मास्मीत्यतिदूरतः ॥ ५॥
    तच्छब्दवर्ज्यस्त्वंशब्दहीनो वाक्यार्थवर्जितः । क्षराक्षरविहीनो यो नादान्तर्ज्योतिरेव सः ॥ ६॥ अखण्डैकरसो
    वाहमानन्दोऽस्मीति वर्जितः । सर्वातीतस्वभावात्मा नादान्तर्ज्योतिरेव सः ॥ ७॥ आत्मेति शब्दहीनो य आत्मशब्दार्थवर्जितः
    । सच्चिदानन्दहीनो य एषैवात्मा सनातनः ॥ ८॥ स निर्देष्टुमशक्यो यो वेदवाक्यैरगम्यतः । यस्य किञ्चिद्बहिर्नास्ति
    किञ्चिदन्तः कियन्न च ॥ ९॥ यस्य लिङ्गं प्रपञ्चं वा ब्रह्मैवात्मा न संशयः । नास्ति यस्य शरीरं वा जीवो
    वा भूतभौतिकः ॥ १०॥ नामरूपादिकं नास्ति भोज्यं वा भोगभुक्च वा । सद्वाऽसद्वा स्थितिर्वापि यस्य नास्ति
    क्षराक्षरम् ॥ ११॥ गुणं वा विगुणं वापि सम आत्मा न संशयः । यस्य वाच्यं वाचकं वा श्रवणं मननं च वा ॥ १२॥
    गुरुशिष्यादिभेदं वा देवलोकाः सुरासुराः । यत्र धर्ममधर्मं वा शुद्धं वाशुद्धमण्वपि ॥ १३॥ यत्र कालमकालं
    वा निश्चयः संशयो न हि । यत्र मन्त्रममन्त्रं वा विद्याविद्ये न विद्यते ॥ १४॥ द्रष्टृदर्शनदृश्यं वा
    ईषन्मात्रं कलात्मकम् । अनात्मेति प्रसङ्गो वा ह्यनात्मेति मनोऽपि वा ॥ १५॥ अनात्मेति जगद्वापि नास्ति
    नास्ति निश्चिनु । सर्वसङ्कल्पशून्यत्वात्सर्वकार्यविवर्जनात् ॥ १६॥ केवलं ब्रह्ममात्रत्वान्नास्त्यनात्मेति
    निश्चिनु । देहत्रयविहीनत्वात्कालत्रयविवर्जनात् ॥ १७॥ जीवत्रयगुणाभावात्तापत्रयविवर्जनात् । लोकत्रयविहीनत्वात्सर्वमात्मेति
    शासनात् ॥ १८॥ चित्ताभाच्चिन्तनीयं देहाभावाज्जरा न च । पादाभावाद्गतिर्नास्ति हस्ताभावात्क्रिया न च
    ॥ १९॥ मृत्युर्नास्ति जनाभावाद्बुद्ध्यभावात्सुखादिकम् । धर्मो नास्ति शुचिर्नास्ति सत्यं नास्ति भयं
    न च ॥ २०॥ अक्षरोच्चारणं नास्ति गुरुशिष्यादि नास्त्यपि । एकाभावे द्वितीयं न न द्वितीये न चैकता ॥ २१॥
    सत्यत्वमस्ति चेत्किञ्चिदसत्यं न च सम्भवेत् । असत्यत्वं यदि भवेत्सत्यत्वं न घटिष्यति ॥ २२॥ शुभं यद्यशुभं
    विद्धि अशुभाच्छुभमिष्यते । भयं यद्यभवं विद्धि अभयाद्भयमापतेत् ॥ २३॥ बन्धत्वमपि चेन्मोक्षो बन्धाभावे
    क्व मोक्षता । मरणं यदि चेज्जन्म जन्माभावे मृतिर्न च ॥ २४॥ त्वमित्यपि भवेच्चाहं त्वं नो चेदहमेव न ।
    इदं यदि तदेवास्ति तदभादिदं न च ॥ २५॥ अस्तीति चेन्नास्ति तदा नास्ति चेदस्ति किञ्चन । कार्यं चेत्कारणं
    किञ्चित्कार्याभावे न कारणम् ॥ २६॥ द्वैतं यदि तदाऽद्वैतं द्वैताभावे द्वयं न च । दृश्यं यदि दृगप्यस्ति
    दृश्याभावे दृगेन न ॥ २७॥ अन्तर्यदि बहिः सत्यमन्ता भावे बहिर्न च । पूर्णत्वमस्ति चेत्किञ्चिदपूर्णत्वं
    प्रसज्यते ॥ २८॥ तस्मादेतत्क्वचिन्नास्ति त्वं चाहं वा इमे इदम् । नास्ति दृष्टान्तिकं सत्ये नास्ति दार्ष्टान्तिकं
    ह्यजे ॥ २९॥ परम्ब्रह्माहमस्मीति स्मरणस्य मनो न हि । ब्रह्ममात्रं जगदिदं ब्रह्ममात्रं त्वमप्यहम् ॥
    ३०॥ चिन्मात्रं केवलं चाहं नास्त्यनात्म्येति निश्चिनु । इदं प्रपञ्चं नास्त्येव नोत्पन्नं नो स्थितं
    क्वचित् ॥ ३१॥ चित्तं प्रपञ्चमित्याहुर्नास्ति नास्त्येव सर्वदा । न प्रपञ्चं न चित्तादि नाहङ्कारो न
    जीवकः ॥ ३२॥ मायाकार्यादिकं नास्ति माया नास्ति भयं नहि । कर्ता नास्ति क्रिया नास्ति श्रवणं मननं नहि
    ॥ ३३॥ समाधिद्वितयं नास्ति मातृमानादि नास्ति हि । अज्ञानं चापि नास्त्येव ह्यविवेकं कदाचन ॥ ३४॥ अनुबन्धचतुष्कं
    न सम्बन्धत्रयमेव न । न गङ्गा न गया सेतुर्न भूतं नान्यदस्ति हि ॥ ३५॥ न भूमिर्न जलं नाग्निर्न न वायुर्न
    च खं क्वचित् । न देवा न च दिक्पाला न वेदा न गुरुः क्वचित् ॥ ३६॥ न दूरं नास्तिकं नालं न मध्यं न क्वचित्स्थितम्
    । नाद्वैतं द्वैतसत्यं वा ह्यसत्यं वा इदं न च ॥ ३७॥ बन्धमोक्षादिकं नास्ति सद्वाऽसद्वा सुखादि वा । जातिर्नास्ति
    गतिर्नास्ति वर्णो नास्ति न लौकिकम् ॥ ३८॥ सर्वं ब्रह्मेति नास्त्येव ब्रह्म इत्यपि नास्ति हि । चिदित्येवेति
    नास्त्येव चिदहम्भाषणं न हि ॥ ३९॥ अहं ब्रह्मास्मि नास्त्येव नित्यशुद्धोऽस्मि न क्वचित् । वाचा यदुच्यते
    किञ्चिन्मनसा मनुते क्वचित् ॥ ४०॥ बुद्ध्या निश्चिनुते नास्ति चित्तेन ज्ञायते नहि । योगी योगादिकं नास्ति
    सदा सर्वं सदा न च ॥ ४१॥ अहोरात्रादिकं नास्ति स्नानध्यानादिकं नहि । भ्रान्तिरभ्रान्तिर्नास्त्येव नास्त्यनात्मेति
    निश्चिनु ॥ ४२॥ वेदशास्त्रं पुराणं च कार्यं कारणमीश्वरः । लोको भूतं जनस्त्वैक्यं सर्वं मिथ्या न संशयः
    ॥ ४३॥ बन्धो मोक्षः सुखं दुःखं ध्यानं चित्तं सुरासुराः । गौणं मुख्यं परं चान्यत्सर्वं मिथ्या न संशयः
    ॥ ४४॥ वाचा वदति यत्किञ्चित्सङ्कल्पैः कल्प्यते च यत् । मनसा चिन्त्यते यद्यत्सर्वं मिथ्या न संशयः ॥
    ४५॥ बुद्ध्या निश्चीयते किञ्चिच्चित्ते निश्चीयते क्वचित् । शास्त्रैः प्रपञ्च्यते यद्यन्नेत्रेणैव निरीक्ष्यते
    ॥ ४६॥ श्रोत्राभ्यां श्रूयते यद्यदन्यत्सद्भावमेव च । नेत्रं श्रोत्रं गात्रमेव मिथ्येति च सुनिश्चितम्
    ॥ ४७॥ इदमित्येव निर्दिष्टमयमित्येव कल्प्यते । त्वमहं तदिदं सोऽहमन्यत्सद्भावमेव च ॥ ४८॥ यद्यत्सम्भाव्यते
    लोके सर्वसङ्कल्पसम्भ्रमः । सर्वाध्यासं सर्वगोप्यं सर्वभोगप्रभेदकम् ॥ ४९॥ सर्वदोषप्रभेदाच्च नास्त्यनात्मेति
    निश्चिनु । मदीयं च त्वदीयं च ममेति च तवेति च ॥ ५०॥ मह्यं तुभ्यं मयेत्यादि तत्सर्वं वितथं भवेत् । रक्षको
    विष्णुरित्यादि ब्रह्मा सृष्टेस्तु कारणम् ॥ ५१॥ संहारे रुद्र इत्येवं सर्वं मिथ्येति निश्चिनु । स्नानं
    जपस्तपो होमः स्वाध्यायो देवपूजनम् ॥ ५२॥ मन्त्रं तन्त्रं च सत्सङ्गो गुणदोषविजृम्भणम् । अन्तःकरणसद्भाव
    अविद्याश्च सम्भवः ॥ ५३॥ अनेककोटिब्रह्माण्डं सर्वं मिथ्येति निश्चिनु । सर्वदेशिकवाक्योक्तिर्येन केनापि
    निश्चितम् ॥ ५४॥ दृश्यते जगति यद्यद्यद्यज्जगति वीक्ष्यते । वर्तते जगति यद्यत्सर्वं मिथ्येति निश्चिनु
    ॥ ५५॥ येन केनाक्षरेणोक्तं येन केन विनिश्चितम् । येन केनापि गदितं येन केनापि मोदितम् ॥ ५६॥ येन केनापि
    यद्दत्तं येन केनापि यत्कृतम् । यत्र यत्र शुभं कर्म यत्र यत्र च दुष्कृतम् ॥ ५७॥ यद्यत्करोषि सत्येन
    सर्वं मिथ्येति निश्चिनु । त्वमेव परमात्मासि त्वमेव परमो गुरुः ॥ ५८॥ त्वमेवाकाशरूपोऽसि साक्षिहीनोऽसि
    सर्वदा । त्वमेव सर्वभावोऽसि त्वं ब्रह्मासि न संशयः ॥ ५९॥ कालहीनोऽसि कालोऽसि सदा ब्रह्मासि चिद्घनः
    । सर्वतः स्वस्वरूपोऽसि चैतन्यघनवानसि ॥ ६०॥ सत्योऽसि सिद्धोऽसि सनातनोऽसि मुक्तोऽसि मोक्षोऽसि मुदामृतोऽसि
    । देवोऽसि शान्तोऽसि निरामयोऽसि ब्रह्मासि पूर्णोऽसि परात्परोऽसि ॥ ६१॥ समोऽसि सच्चापि सनातनोऽसि सत्यादिवाक्यैः
    प्रतिबोधितोऽसि । सर्वाङ्गहीनोऽसि सदा स्थितोऽसि ब्रह्मेन्द्ररुद्रादिविभावितोऽसि ॥ ६२॥ सर्वप्रपञ्चभ्रमवर्जितोऽसि
    सर्वेषु भूतेषु च भासितोऽसि । सर्वत्र सङ्कल्पविवर्जितोऽसि सर्वागमान्तार्थविभावितोऽसि ॥ ६३॥ सर्वत्र
    सन्तोषसुखासनोऽसि सर्वत्र गत्यादिविवर्जितोऽसि । सर्वत्र लक्ष्यादिविवर्जितोऽसि ध्यातोऽसि विष्ण्वादिसुरैरजस्रम्
    ॥ ६४॥ चिदाकारस्वरूपोऽसि चिन्मात्रोऽसि निरङ्कुशः । आत्मन्येव स्थितोऽसि त्वं सर्वशून्योऽसि निर्गुणः
    ॥ ६५॥ आनन्दोऽसि परोऽसि त्वमेक एवाद्वितीयकः । चिद्घनानन्दरूपोऽसि परिपूर्णस्वरूपकः ॥ ६६॥ सदसि त्वमसि
    ज्ञोऽसि सोऽसि जानासि वीक्षसि । सच्चिदानन्दरूपोऽसि वासुदेवोऽसि वै प्रभुः ॥ ६७॥ अमृतोऽसि विभुश्चासि
    चञ्चलो ह्यचलो ह्यसि । सर्वोऽसि सर्वहीनोऽसि शान्ताशान्तविवर्जितः ॥ ६८॥ सत्तामात्रप्रकाशोऽसि सत्तासामान्यको
    ह्यसि । नित्यसिद्धिस्वरूपोऽसि सर्वसिद्धिविवर्जितः ॥ ६९॥ ईषन्मात्रविशून्योऽसि अणुमात्रविवर्जितः । अस्तित्ववर्जितोऽसि
    त्वं नास्तित्वादिविवर्जितः ॥ ७०॥ लक्ष्यलक्षणहीनोऽसि निर्विकारो निरामयः । सर्वनादान्तरोऽसि त्वं कलाकाष्ठाविवर्जितः
    ॥ ७१॥ ब्रह्मविष्ण्वीशहीनोऽसि स्वस्वरूपं प्रपश्यसि । स्वस्वरूपावशेषोऽसि स्वानन्दाब्धौ निमज्जसि ॥ ७२॥
    स्वात्मराज्ये स्वमेवासि स्वयम्भावविवर्जितः । शिष्टपूर्णस्वरूपोऽसि स्वस्मात्किञ्चिन्न पश्यसि ॥ ७३॥
    स्वस्वरूपान्न चलसि स्वस्वरूपेण जृम्भसि । स्वस्वरूपादनन्योऽसि ह्यहमेवासि निश्चिनु ॥ ७४॥ इदं प्रपञ्चं
    यत्किञ्चिद्यद्यज्जगति विद्यते । दृश्यरूपं च दृग्रूपं सर्वं शशविषाणवत् ॥ ७५॥ भूमिरापोऽनलो वायुः खं
    मनो बुद्धिरेव च । अहङ्कारश्च तेजश्च लोकं भुवनमण्डलम् ॥ ७६॥ नाशो जन्म च सत्यं च पुण्यपापजयादिकम् ।
    रागः कामः क्रोधलोभौ ध्यानं ध्येयं गुणं परम् ॥ ७७॥ गुरुशिष्योपदेशादिरादिरन्तं शमं शुभम् । भूतं भव्यं
    वर्तमानं लक्ष्यं लक्षणमद्वयम् ॥ ७८॥ शमो विचारः सन्तोषो भोक्तृभोज्यादिरूपकम् । यमाद्यष्टाङ्गयोगं च
    गमनागमनात्मकम् ॥ ७९॥ आदिमध्यान्तरङ्गं च ग्राह्यं त्याज्यं हरिः शिवः । इन्द्रियाणि मनश्चैव अवस्थात्रितयं
    तथा ॥ ८०॥ चतुर्विंशतितत्त्वं च साधनानां चतुष्टयम् । सजातीयं विजातीयं लोका भूरादयः क्रमात् ॥ ८१॥ सर्ववर्णाश्रमाचारं
    मन्त्रतन्त्रादिसङ्ग्रहम् । विद्याविद्यादिरूपं च सर्ववेदं जडाजडम् ॥ ८२॥ बन्धमोक्षविभागं च ज्ञानविज्ञानरूपकम्
    । बोधाबोधस्वरूपं वा द्वैताद्वैतादिभाषणम् ॥ ८३॥ सर्ववेदान्तसिद्धान्तं सर्वशास्त्रार्थनिर्णयम् । अनेकजीवसद्भावमेकजीवादिनिर्णयम्
    ॥ ८४॥ यद्यद्ध्यायति चित्तेन यद्यत्सङ्कल्पते क्वचित् । बुद्ध्या निश्चीयते यद्यद्गुरुणा संश
