id: ekashlokiramayanam
category: stotram
name:
  english: ekashlokiramayanam
  devanagari: एकश्लोकिरामायणम्
content:
  english: shardulavikridita adau ramatapovanadigamanam hatva mrigam kamcanam vaidehiharanam jatayumaranam
    sugrivasambhashanam | valinirdalanam samudrataranam lamkapuridahanam pashcadravanakumbhakarnahananametaddhi
    ramayanam || || ekashloki ramayanam sampurnam ||
  devanagari: शार्दुलविक्रीडित आदौ रामतपोवनादिगमनं हत्वा मृगं कांचनं वैदेहीहरणं जटायुमरणं सुग्रीवसंभाषणम्
    । वालीनिर्दलनं समुद्रतरणं लंकापुरीदाहनं पश्चाद्रावणकुंभकर्णहननमेतद्धि रामायणम् ॥ ॥ एकश्लोकि रामायणं
    संपूर्णम् ॥
meaning: {}
