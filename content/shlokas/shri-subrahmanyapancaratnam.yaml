id: shri-subrahmanyapancaratnam
category: stotram
name:
  english: shri subrahmanyapancaratnam
  devanagari: श्री सुब्रह्मण्यपञ्चरत्नम्
content:
  english: shadananam candanalepitangam mahorasam divyamayuravahanam | rudrasya sunum suralokanatham brahmanyadevam
    sharanam prapadye ||1|| jajvalyamanam suravrindavandyam kumara dharatata mandirastham | kandarparupam
    kamaniyagatram brahmanyadevam sharanam prapadye ||2|| dvishadbhujam dvadashadivyanetram trayitanum
    shulamasi dadhanam | sheshavataram kamaniyarupam brahmanyadevam sharanam prapadye ||3|| surari ghorahavashobhamanam
    surottamam shaktidharam kumaram | sudhara shaktyayudha shobhihastam brahmanyadevam sharanam prapadye
    ||4|| ishtarthasiddhipradamishaputram mishtannadam bhusura kamadhenum | gangodbhavam sarvajananukulam
    brahmanyadevam sharanam prapadye ||5|| yah shlokapancamidam pathatiha bhaktya brahmanyadeva viniveshita
    manasah san | prapnoti bhogamakhilam bhuvi yadyadishta
  devanagari: षडाननं चन्दनलेपिताङ्गं महोरसं दिव्यमयूरवाहनम् । रुद्रस्य सूनुं सुरलोकनाथं ब्रह्मण्यदेवं
    शरणं प्रपद्ये ॥१॥ जाज्वल्यमानं सुरवृन्दवन्द्यं कुमार धारातट मन्दिरस्थम् । कन्दर्परूपं कमनीयगात्रं
    ब्रह्मण्यदेवं शरणं प्रपद्ये ॥२॥ द्विषड्भुजं द्वादशदिव्यनेत्रं त्रयीतनुं शूलमसी दधानम् । शेषावतारं
    कमनीयरूपं ब्रह्मण्यदेवं शरणं प्रपद्ये ॥३॥ सुरारि घोराहवशोभमानं सुरोत्तमं शक्तिधरं कुमारम् । सुधार
    शक्त्यायुध शोभिहस्तं ब्रह्मण्यदेवं शरणं प्रपद्ये ॥४॥ इष्टार्थसिद्धिप्रदमीशपुत्रं मिष्टान्नदं भूसुर
    कामधेनुम् । गङ्गोद्भवं सर्वजनानुकूलं ब्रह्मण्यदेवं शरणं प्रपद्ये ॥५॥ यः श्लोकपञ्चमिदं पठतीह भक्त्या
    ब्रह्मण्यदेव विनिवेशित मानसः सन् । प्राप्नोति भोगमखिलं भुवि यद्यदिष्ट
