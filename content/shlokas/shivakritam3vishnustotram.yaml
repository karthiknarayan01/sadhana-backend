id: shivakritam3vishnustotram
category: stotram
name:
  english: shivakritam3vishnustotram
  devanagari: शिवकृतं३विष्णुस्तोत्रम्
content:
  english: shivakritam 3 vishnustotram sa praha mohinim tatra narayanamrite kvacit | yoginam manaso dhairyam
    hartum shakto na vai parah || 60|| tasmai namo bhagavate mayarupadharaya ca | namah krishnaya devaya
    narayanaya vishnave || 61|| mohinyatmasvarupaya moharupaya te namah | tvayi natra mama shoko narayane
    paratpare || 62|| tathapi devadevesha raksha mayavimohanat | moho'yam jagatam bandhakaro'sti vasanodayah
    || 63|| tava yogo'pi mohatma muktyatma nirguno matah | tavedam rupamatyarhasaundaryabhajanam param
    || 64|| na me canyasya bandhaya mokshamatrapradam hi tat | tasmattvaya kritam yadvai tadvai me labhadam
    param || 65|| parvatyah sahavase'pi smritva tvam mohinim sada | vinirbandho bhavishyami lapsye nairgunyameva
    ca || 66|| shrutvaitacchambhuhardajno bhagavan kamalapatih | yoshidrupam ca samhritya caturbahuh kshane'bhavat
    || 67|| prahasanpraha sarvatma samashlishya haram hrida | madbhakto matkritam mayam jitavanasi shankara
    || 68|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane 199
  devanagari: शिवकृतं ३ विष्णुस्तोत्रम् स प्राह मोहिनीं तत्र नारायणमृते क्वचित् । योगिनां मनसो धैर्यं
    हर्तुं शक्तो न वै परः ॥ ६०॥ तस्मै नमो भगवते मायारूपधाराय च । नमः कृष्णाय देवाय नारायणाय विष्णवे ॥
    ६१॥ मोहिन्यात्मस्वरूपाय मोहरूपाय ते नमः । त्वयि नात्र मम शोको नारायणे परात्परे ॥ ६२॥ तथापि देवदेवेश
    रक्ष मायाविमोहनात् । मोहोऽयं जगतां बन्धकरोऽस्ति वासनोदयः ॥ ६३॥ तव योगोऽपि मोहात्मा मुक्त्यात्मा निर्गुणो
    मतः । तवेदं रूपमत्यर्हसौन्दर्यभाजनं परम् ॥ ६४॥ न मे चान्यस्य बन्धाय मोक्षमात्रप्रदं हि तत् । तस्मात्त्वया
    कृतं यद्वै तद्वै मे लाभदं परम् ॥ ६५॥ पार्वत्याः सहवासेऽपि स्मृत्वा त्वां मोहिनीं सदा । विनिर्बन्धो
    भविष्यामि लप्स्ये नैर्गुण्यमेव च ॥ ६६॥ श्रुत्वैतच्छम्भुहार्दज्ञो भगवान् कमलापतिः । योषिद्रूपं च संहृत्य
    चतुर्बाहुः क्षणेऽभवत् ॥ ६७॥ प्रहसन्प्राह सर्वात्मा समाश्लिष्य हरं हृदा । मद्भक्तो मत्कृतां मायां जितवानसि
    शङ्कर ॥ ६८॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने १९९
