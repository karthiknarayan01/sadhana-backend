id: dashaksharalakshmimantram
category: mantra
name:
  english: dashaksharalakshmimantram
  devanagari: दशाक्षरलक्ष्मीमन्त्रम्
content:
  english: om abhishtasiddhim me dehi sharanagatavatsale | bhaktya samarpaye tubhyam tritiyavaranarcanam
    || atha dashaksharalakshmi mantrah | om namah kamalavasinyai svaha | japaprakarah dashalaksham japenmantram
    mantravidvijitendriyah | dashamsham juhuyanmantri madhuna''ktaih saroruhaih || iti sampujayeddevim
    sampadamalayam bhavet | samudrakanyam sariti kanthamatre jale sthitah || trilaksham prajapenmantri
    sakshadvaishravano bhavet | aradhyottaranakshatre devim srakcandanadibhih || nandyavarttabhavaih pushpaih
    sahasram juhuyattatah | purnamasyam phalaih citraih juhuyanmadhuraplutaih || pancamyam vishadambhojaih
    shukravare sugandhibhih | anyairva vishadaih pushpaih pratimasam phalavatih || sa bhavedabdamatrena
    sarvada sampadam nidhih || iti dashaksharalakshmimantram sampurnam |
  devanagari: ॐ अभीष्टसिद्धिं मे देहि शरणागतवत्सले । भक्त्या समर्पये तुभ्यं तृतीयावरणार्चनम् ॥ अथ दशाक्षरलक्ष्मी
    मन्त्रः । ॐ नमः कमलवासिन्यै स्वाहा । जपप्रकारः दशलक्षं जपेन्मन्त्रं मन्त्रविद्विजितेन्द्रियः । दशांशं
    जुहुयान्मन्त्री मधुनाऽऽक्तैः सरोरुहैः ॥ इति सम्पूजयेद्देवीं सम्पदामालयं भवेत् । समुद्रकन्यां सरिति
    कण्ठमात्रे जले स्थितः ॥ त्रिलक्षं प्रजपेन्मन्त्री साक्षाद्वैश्रवणो भवेत् । आराध्योत्तरनक्षत्रे देवीं
    स्रक्चन्दनादिभिः ॥ नन्द्यावर्त्तभवैः पुष्पैः सहस्रं जुहुयात्ततः । पूर्णमास्यां फलैः चित्रैः जुहुयान्मधुराप्लुतैः
    ॥ पञ्चम्यां विशदाम्भोजैः शुक्रवारे सुगन्धिभिः । अन्यैर्वा विशदैः पुष्पैः प्रतिमासं फलावतीः ॥ स भवेदब्दमात्रेण
    सर्वदा सम्पदां निधिः ॥ इति दशाक्षरलक्ष्मीमन्त्रं सम्पूर्णम् ।
