    logu sih || kahehu satya sabu sakha sujana| mohi dinha pitu ayasu ana || do barasha caridasa basu
    bana muni brata beshu aharu| grama basu nahim ucita suni guhahi bhayu dukhu bharu || || rama lakhana
    siya rupa nihari| kahahim saprema grama nara nari || te pitu matu kahahu sakhi kaise| jinha pathe
    bana balaka aise || eka kahahim bhala bhupati kinha| loyana lahu hamahi bidhi dinha || taba nishadapati
    ura anumana| taru simsupa manohara jana || lai raghunathahi thau~ dekhava| kaheu rama saba bha~ti
    suhava || purajana kari joharu ghara ae| raghubara sandhya karana sidhae || guha~ sa~vari sa~thari
    dasai| kusa kisalayamaya mridula suhai || suci phala mula madhura mridu jani| dona bhari bhari rakhesi
    pani || do siya sumantra bhrata sahita kanda mula phala khai| sayana kinha raghubamsamani paya palotata
    bhai || || uthe lakhanu prabhu sovata jani| kahi sacivahi sovana mridu bani || kachuka dura saji bana
    sarasana| jagana lage baithi birasana || gu~ha bolai paharu pratiti| thava~ tha~va rakhe ati priti
    || apu lakhana pahim baitheu jai| kati bhathi sara capa carhaai || sovata prabhuhi nihari nishadu|
    bhayu prema basa hdaya~ bishadu || tanu pulakita jalu locana bahi| bacana saprema lakhana sana kahi
    || bhupati bhavana subhaya~ suhava| surapati sadanu na patatara pava || manimaya racita caru caubare|
    janu ratipati nija hatha sa~vare || do suci subicitra subhogamaya sumana sugandha subasa| pala~ga
    manju manidipa jaha~ saba bidhi sakala supasa || || bibidha basana upadhana turai| chira phena mridu
    bisada suhai || taha~ siya ramu sayana nisi karahim| nija chabi rati manoja madu harahim || te siya
    ramu satharim soe| shramita basana binu jahim na joe || matu pita parijana purabasi| sakha susila
    dasa aru dasi || jogavahim jinhahi prana ki nai| mahi sovata tei rama gosaim || pita janaka jaga bidita
    prabh | sasura suresa sakha raghur || ramacandu pati so baidehi| sovata mahi bidhi bama na kehi ||
    siya raghubira ki kanana jogu| karama pradhana satya kaha logu || do kaikayanandini mandamati kathina
    kutilapanu kinha| jehim raghunandana janakihi sukha avasara dukhu dinha || || bhi dinakara kula bitapa
    kuthari| kumati kinha saba bisva dukhari || bhayu bishadu nishadahi bhari| rama siya mahi sayana nihari
    || bole lakhana madhura mridu bani| gyana biraga bhagati rasa sani || kahu na kau sukha dukha kara
    data| nija krita karama bhoga sabu bhrata || joga biyoga bhoga bhala manda| hita anahita madhyama
    bhrama phanda || janamu maranu jaha~ lagi jaga jalu| sampati bipati karamu aru kalu || dharani dhamu
    dhanu pura parivaru| saragu naraku jaha~ lagi byavaharu || dekhia sunia gunia mana mahim| moha mula
    paramarathu nahim || do sapanem hoi bhikhari nripa ranku nakapati hoi| jagem labhu na hani kachu timi
    prapanca jiya~ joi || || asa bicari nahim kija rosu| kahuhi badi na deia dosu || moha nisa~ sabu sovanihara|
    dekhia sapana aneka prakara || ehim jaga jamini jagahim jogi| paramarathi prapanca biyogi || jania
    tabahim jiva jaga jaga| jaba jaba bishaya bilasa biraga || hoi bibeku moha bhrama bhaga| taba raghunatha
    carana anuraga || sakha parama paramarathu ehu| mana krama bacana rama pada nehu || rama brahma paramaratha
    rupa| abigata alakha anadi anupa || sakala bikara rahita gatabheda| kahi nita neti nirupahim beda|
    do bhagata bhumi bhusura surabhi sura hita lagi kripala| karata carita dhari manuja tanu sunata mitahi
    jaga jala || pandrahava vishrama sakha samujhi asa parihari mohu| siya raghubira carana rata hohu
    || kahata rama guna bha bhinusara| jage jaga mangala sukhadara || sakala soca kari rama nahava| suci
    sujana bata chira magava || anuja sahita sira jata banae| dekhi sumantra nayana jala chae || hridaya~
    dahu ati badana malina| kaha kara jori bacana ati dina || natha kaheu asa kosalanatha| lai rathu jahu
    rama kem satha || banu dekhai surasari anhavai| anehu pheri begi dau bhai || lakhanu ramu siya anehu
    pheri| samsaya sakala sa~koca niberi || do nripa asa kaheu gosai~ jasa kahi karaum bali soi| kari
    binati payanha pareu dinha bala jimi roi || || tata kripa kari kijia soi| jatem avadha anatha na hoi
    || mantrahi rama uthai prabodha| tata dharama matu tumha sabu sodha || sibi dadhici haricanda naresa|
    sahe dharama hita koti kalesa || rantideva bali bhupa sujana| dharamu dhareu sahi sankata nana ||
    dharamu na dusara satya samana| agama nigama purana bakhana || maim soi dharamu sulabha kari pava|
    tajem tihu~ pura apajasu chava || sambhavita kahu~ apajasa lahu| marana koti sama daruna dahu || tumha
    sana tata bahuta ka kahu~| die~ utaru phiri pataku lahu~ || do pitu pada gahi kahi koti nati binaya
    karaba kara jori| cinta kavanihu bata kai tata karia jani mori || || tumha puni pitu sama ati hita
    morem| binati karu~ tata kara jorem || saba bidhi soi karatabya tumharem| dukha na pava pitu soca
    hamarem || suni raghunatha saciva sambadu| bhayu saparijana bikala nishadu || puni kachu lakhana kahi
    katu bani| prabhu baraje bara anucita jani || sakuci rama nija sapatha devai| lakhana sa~desu kahia
    jani jai || kaha sumantru puni bhupa sa~desu| sahi na sakihi siya bipina kalesu || jehi bidhi avadha
    ava phiri siya| soi raghubarahi tumhahi karaniya || nataru nipata avalamba bihina| maim na jiaba jimi
    jala binu mina || do mikem sasarem sakala sukha jabahim jaha~ manu mana || ta~ha taba rahihi sukhena
    siya jaba lagi bipati bihana || || binati bhupa kinha jehi bha~ti| arati priti na so kahi jati ||
    pitu sa~desu suni kripanidhana| siyahi dinha sikha koti bidhana || sasu sasura gura priya parivaru|
    phiratu ta saba kara mitai khabharu || suni pati bacana kahati baidehi| sunahu pranapati parama sanehi
    || prabhu karunamaya parama bibeki| tanu taji rahati cha~ha kimi chenki || prabha jai kaha~ bhanu
    bihai| kaha~ candrika candu taji jai || patihi premamaya binaya sunai| kahati saciva sana gira suhai
    || tumha pitu sasura sarisa hitakari| utaru deu~ phiri anucita bhari || do arati basa sanamukha bhiu~
    bilagu na manaba tata| arajasuta pada kamala binu badi jaha~ lagi nata || || pitu baibhava bilasa
    maim ditha| nripa mani mukuta milita pada pitha || sukhanidhana asa pitu griha morem| piya bihina
    mana bhava na bhorem || sasura cakkavi kosalar | bhuvana caridasa pragata prabh || agem hoi jehi surapati
    lei| aradha singhasana asanu dei || sasuru etadrisa avadha nivasu| priya parivaru matu sama sasu ||
    binu raghupati pada paduma paraga| mohi keu sapanehu~ sukhada na laga || agama pantha banabhumi pahara|
    kari kehari sara sarita apara || kola kirata kuranga bihanga| mohi saba sukhada pranapati sanga ||
    do sasu sasura sana mori hu~ti binaya karabi pari paya~ || mora socu jani karia kachu maim bana sukhi
    subhaya~ || || prananatha priya devara satha| bira dhurina dharem dhanu bhatha || nahim maga shramu
    bhramu dukha mana morem| mohi lagi socu karia jani bhorem || suni sumantru siya sitali bani| bhayu
    bikala janu phani mani hani || nayana sujha nahim suni na kana| kahi na saki kachu ati akulana ||
    rama prabodhu kinha bahu bha~ti| tadapi hoti nahim sitali chati || jatana aneka satha hita kinhe|
    ucita utara raghunandana dinhe || meti jai nahim rama rajai| kathina karama gati kachu na basai ||
    rama lakhana siya pada siru nai| phireu banika jimi mura gava~i || do ratha ha~keu haya rama tana
    heri heri hihinahim| dekhi nishada bishadabasa dhunahim sisa pachitahim || || jasu biyoga bikala pasu
    aise| praja matu pitu jihahim kaisem || barabasa rama sumantru pathae| surasari tira apu taba ae ||
    magi nava na kevatu ana| kahi tumhara maramu maim jana || carana kamala raja kahu~ sabu kahi| manusha
    karani muri kachu ahi || chuata sila bhi nari suhai| pahana tem na katha kathinai || taraniu muni
    gharini hoi jai| bata pari mori nava uraai || ehim pratipalu~ sabu parivaru| nahim janu~ kachu aura
    kabaru || jau prabhu para avasi ga cahahu| mohi pada paduma pakharana kahahu || cham pada kamala dhoi
    carhaai nava na natha utarai cahaum| mohi rama rauri ana dasaratha sapatha saba saci kahaum || baru
    tira marahu~ lakhanu pai jaba lagi na paya pakharihaum| taba lagi na tulasidasa natha kripala paru
    utarihaum || so suni kebata ke baina prema lapete atapate| bihase karunaaina citi janaki lakhana tana
    || || kripasindhu bole musukai| soi karu jemhi tava nava na jai || vegi anu jala paya pakharu| hota
    bilambu utarahi paru || jasu nama sumarata eka bara| utarahim nara bhavasindhu apara || soi kripalu
    kevatahi nihora| jehim jagu kiya tihu pagahu te thora || pada nakha nirakhi devasari harashi| suni
    prabhu bacana moha~ mati karashi || kevata rama rajayasu pava| pani kathavata bhari lei ava || ati
    ananda umagi anuraga| carana saroja pakharana laga || barashi sumana sura sakala sihahim| ehi sama
    punyapunja kau nahim || do pada pakhari jalu pana kari apu sahita parivara| pitara paru kari prabhuhi
    puni mudita gayu lei para || || utari thara bhe surasari reta| siyarama guha lakhana sameta || kevata
    utari dandavata kinha| prabhuhi sakuca ehi nahim kachu dinha || piya hiya ki siya jananihari| mani
    mudari mana mudita utari || kaheu kripala lehi utarai| kevata carana gahe akulai || natha aju maim
    kaha na pava| mite dosha dukha darida dava || bahuta kala maim kinhi majuri| aju dinha bidhi bani
    bhali bhuri || aba kachu natha na cahia morem| dinadayala anugraha torem || phirati bara mohi je deba|
    so prasadu maim sira dhari leba || do bahuta kinha prabhu lakhana siya~ nahim kachu kevatu lei| bida
    kinha karunayatana bhagati bimala baru dei || || taba majjanu kari raghukulanatha| puji parathiva
    nayu matha || siya~ surasarihi kaheu kara jori| matu manoratha purubi mori || pati devara sanga kusala
    bahori| ai karaum jehim puja tori || suni siya binaya prema rasa sani| bhi taba bimala bari bara bani
    || sunu raghubira priya baidehi| tava prabhau jaga bidita na kehi || lokapa hohim bilokata torem|
    tohi sevahim saba sidhi kara jorem || tumha jo hamahi barai binaya sunai| kripa kinhi mohi dinhi baraai
    || tadapi debi maim debi asisa| saphala hopana hita nija bagisa || do prananatha devara sahita kusala
    kosala ai| pujahi saba manakamana sujasu rahihi jaga chai || || ganga bacana suni mangala mula| mudita
    siya surasari anukula || taba prabhu guhahi kaheu ghara jahu| sunata sukha mukhu bha ura dahu || dina
    bacana guha kaha kara jori| binaya sunahu raghukulamani mori || natha satha rahi panthu dekhai| kari
    dina cari carana sevakai || jehim bana jai rahaba raghurai| paranakuti maim karabi suhai || taba mohi
    kaha~ jasi deba rajai| soi karihu~ raghubira dohai || sahaja saneha rama lakhi tasu| sanga linha guha
    hridaya hulasu || puni guha~ gyati boli saba linhe| kari paritoshu bida taba kinhe || do taba ganapati
    siva sumiri prabhu nai surasarihi matha| sakha anuja siya sahita bana gavanu kinha radhunatha || ||
    tehi dina bhayu bitapa tara basu| lakhana sakha~ saba kinha supasu || prata pratakrita kari radhusai|
    tiratharaju dikha prabhu jai || saciva satya shradhda priya nari| madhava sarisa mitu hitakari ||
    cari padaratha bhara bha~daru| punya pradesa desa ati caru || chetra agama garhau garha suhava| sapanehu~
    nahim pratipacchinha pava || sena sakala tiratha bara bira| kalusha anika dalana ranadhira || sangamu
    simhasanu suthi soha| chatru akhayabatu muni manu moha || cava~ra jamuna aru ganga taranga| dekhi
    hohim dukha darida bhanga || do sevahim sukriti sadhu suci pavahim saba manakama| bandi beda purana
    gana kahahim bimala guna grama || || ko kahi saki prayaga prabh | kalusha punja kunjara mrigar ||
    asa tirathapati dekhi suhava| sukha sagara raghubara sukhu pava || kahi siya lakhanahi sakhahi sunai|
    shrimukha tiratharaja baraai || kari pranamu dekhata bana baga| kahata mahatama ati anuraga || ehi
    bidhi ai biloki beni| sumirata sakala sumangala deni || mudita nahai kinhi siva seva| puji jathabidhi
    tiratha deva || taba prabhu bharadvaja pahim ae| karata dandavata muni ura lae || muni mana moda na
    kachu kahi jai| brahmananda rasi janu pai || do dinhi asisa munisa ura ati anandu asa jani| locana
    gocara sukrita phala manahu~ kie bidhi ani || || kusala prasna kari asana dinhe| puji prema paripurana
    kinhe || kanda mula phala ankura nike| die ani muni manahu~ ami ke || siya lakhana jana sahita suhae|
    ati ruci rama mula phala khae || bhe bigatashrama ramu sukhare| bharavdaja mridu bacana ucare || aju
    suphala tapu tiratha tyagu| aju suphala japa joga biragu || saphala sakala subha sadhana saju| rama
    tumhahi avalokata aju || labha avadhi sukha avadhi na duji| tumharem darasa asa saba puji || aba kari
    kripa dehu bara ehu| nija pada sarasija sahaja sanehu || do karama bacana mana charai chalu jaba lagi
    janu na tumhara| taba lagi sukhu sapanehu~ nahim kie~ koti upacara || suni muni bacana ramu sakucane|
    bhava bhagati ananda aghane || taba raghubara muni sujasu suhava| koti bha~ti kahi sabahi sunava ||
    so bada so saba guna gana gehu| jehi munisa tumha adara dehu || muni raghubira parasapara navahim|
    bacana agocara sukhu anubhavahim || yaha sudhi pai prayaga nivasi| batu tapasa muni siddha udasi ||
    bharadvaja ashrama saba ae| dekhana dasaratha suana suhae || rama pranama kinha saba kahu| mudita
    bhe lahi loyana lahu || dehim asisa parama sukhu pai| phire sarahata sundaratai || do rama kinha bishrama
    nisi prata prayaga nahai| cale sahita siya lakhana jana mudadita munihi siru nai || || rama saprema
    kaheu muni pahim| natha kahia hama kehi maga jahim || muni mana bihasi rama sana kahahim| sugama sakala
    maga tumha kahu~ ahahim || satha lagi muni sishya bolae| suni mana mudita pacasaka ae || sabanhi rama
    para prema apara| sakala kahahi magu dikha hamara || muni batu cari sanga taba dinhe| jinha bahu janama
    sukrita saba kinhe || kari pranamu rishi ayasu pai| pramudita hridaya~ cale raghurai || grama nikata
    jaba nikasahi jai| dekhahi darasu nari nara dhai || hohi sanatha janama phalu pai| phirahi dukhita
    manu sanga pathai || do bida kie batu binaya kari phire pai mana kama| utari nahae jamuna jala jo
    sarira sama syama || || sunata tiravasi nara nari| dhae nija nija kaja bisari || lakhana rama siya
    sundaratai| dekhi karahim nija bhagya baraai || ati lalasa basahim mana mahim| nau~ gau~ bujhata sakucahim
    || je tinha mahu~ bayabiridha sayane| tinha kari juguti ramu pahicane || sakala katha tinha sabahi
    sunai| banahi cale pitu ayasu pai || suni sabishada sakala pachitahim| rani raya~ kinha bhala nahim
    || tehi avasara eka tapasu ava| tejapunja laghubayasa suhava || kavi alakhita gati beshu biragi| mana
    krama bacana rama anuragi || do sajala nayana tana pulaki nija ishtadeu pahicani| pareu danda jimi
    dharanitala dasa na jai bakhani || || rama saprema pulaki ura lava| parama ranka janu parasu pava
    || manahu~ premu paramarathu dou| milata dhare tana kaha sabu kou || bahuri lakhana payanha soi laga|
    linha uthai umagi anuraga || puni siya carana dhuri dhari sisa| janani jani sisu dinhi asisa || kinha
    nishada dandavata tehi| mileu mudita lakhi rama sanehi || piata nayana puta rupu piyusha| mudita suasanu
    pai jimi bhukha || te pitu matu kahahu sakhi kaise| jinha pathe bana balaka aise || rama lakhana siya
    rupu nihari| hohim saneha bikala nara nari || do taba raghubira aneka bidhi sakhahi sikhavanu dinha|
    rama rajayasu sisa dhari bhavana gavanu te~i~ kinha || || puni siya~ rama lakhana kara jori| jamunahi
    kinha pranamu bahori || cale sasiya mudita dau bhai| rabitanuja ki karata baraai || pathika aneka
    milahim maga jata| kahahim saprema dekhi dau bhrata || raja lakhana saba anga tumharem| dekhi socu
    ati hridaya hamarem || maraga calahu payadehi pae~| jyotishu jhutha hamarem bhae~ || agamu pantha
    giri kanana bhari| tehi maha~ satha nari sukumari || kari kehari bana jai na joi| hama sa~ga calahi
    jo ayasu hoi || jaba jaha~ lagi taha~ pahu~cai| phiraba bahori tumhahi siru nai || do ehi bidhi pu~chahim
    prema basa pulaka gata jalu naina| kripasindhu pherahi tinhahi kahi binita mridu baina || || je pura
    ga~va basahim maga mahim| tinhahi naga sura nagara sihahim || kehi sukritim kehi gharim basae| dhanya
    punyamaya parama suhae || jaha~ jaha~ rama carana cali jahim| tinha samana amaravati nahim || punyapunja
    maga nikata nivasi| tinhahi sarahahim surapurabasi || je bhari nayana bilokahim ramahi| sita lakhana
    sahita ghanasyamahi || je sara sarita rama avagahahim| tinhahi deva sara sarita sarahahim || jehi
    taru tara prabhu baithahim jai| karahim kalapataru tasu baraai || parasi rama pada paduma paraga|
    manati bhumi bhuri nija bhaga || do cha~ha karahi ghana bibudhagana barashahi sumana sihahim| dekhata
    giri bana bihaga mriga ramu cale maga jahim || || sita lakhana sahita raghurai| ga~va nikata jaba
    nikasahim jai || suni saba bala briddha nara nari| calahim turata grihakaju bisari || rama lakhana
    siya rupa nihari| pai nayanaphalu hohim sukhari || sajala bilocana pulaka sarira| saba bhe magana
    dekhi dau bira || barani na jai dasa tinha keri| lahi janu rankanha suramani dheri || ekanha eka boli
    sikha dehim| locana lahu lehu chana ehim || ramahi dekhi eka anurage| citavata cale jahim sa~ga lage
    || eka nayana maga chabi ura ani| hohim sithila tana mana bara bani || do eka dekhim bata cha~ha bhali
    dasi mridula trina pata| kahahim gava~ia chinuku shramu gavanaba abahim ki prata || || eka kalasa
    bhari anahim pani| a~cia natha kahahim mridu bani || suni priya bacana priti ati dekhi| rama kripala
    susila biseshi || jani shramita siya mana mahim| gharika bilambu kinha bata chahim || mudita nari
    nara dekhahim sobha| rupa anupa nayana manu lobha || ekataka saba sohahim cahu~ ora| ramacandra mukha
    canda cakora || taruna tamala barana tanu soha| dekhata koti madana manu moha || damini barana lakhana
    suthi nike| nakha sikha subhaga bhavate ji ke || munipata katinha kasem tunira| sohahim kara kamalini
    dhanu tira || do jata mukuta sisani subhaga ura bhuja nayana bisala| sarada paraba bidhu badana bara
    lasata sveda kana jala || || barani na jai manohara jori| sobha bahuta thori mati mori || rama lakhana
    siya sundaratai| saba citavahim cita mana mati lai || thake nari nara prema piase| manahu~ mrigi mriga
    dekhi dia se || siya samipa gramatiya jahim| pu~chata ati saneha~ sakucahim || bara bara saba lagahim
    pae~| kahahim bacana mridu sarala subhae~ || rajakumari binaya hama karahim| tiya subhaya~ kachu pu~chata
    darahim| svamini abinaya chamabi hamari| bilagu na manaba jani gava~ri || rajakua~ra dau sahaja salone|
    inha tem lahi duti marakata sone || do syamala gaura kisora bara sundara sushama aina| sarada sarbarinatha
    mukhu sarada saroruha naina || solahava~ vishrama navanhaparayana cautha vishrama koti manoja lajavanihare|
    sumukhi kahahu ko ahim tumhare || suni sanehamaya manjula bani| sakuci siya mana mahu~ musukani ||
    tinhahi biloki bilokati dharani| duhu~ sakoca sakucita barabarani || sakuci saprema bala mriga nayani|
    boli madhura bacana pikabayani || sahaja subhaya subhaga tana gore| namu lakhanu laghu devara more
    || bahuri badanu bidhu ancala dha~ki| piya tana citi bhaumha kari ba~ki || khanjana manju tiriche
    nayanani| nija pati kaheu tinhahi siya~ sayanani || bhi mudita saba gramabadhutim| rankanha raya rasi
    janu lutim || do ati saprema siya paya~ pari bahubidhi dehim asisa| sada sohagini hohu tumha jaba
    lagi mahi ahi sisa || || parabati sama patipriya hohu| debi na hama para charaba chohu || puni puni
    binaya karia kara jori| jaum ehi maraga phiria bahori || darasanu deba jani nija dasi| lakhim siya~
