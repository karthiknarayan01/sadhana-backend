id: batukabhairavah-idayastotram
category: hridaya
name:
  english: batukabhairavahṟidayastotram
  devanagari: बटुकभैरवह्ऱिदयस्तोत्रम्
content:
  english: rinu devi pravakshyami hridayam batukasya ca || 3|| guhyadguhyataram guhyam tacchrinushva tu
    madhyame | hridayasyasya deveshi brihadaranyako rishih || 4|| chando'nushtup samakhyato devata batukah
    smritah | prayogabhishtasiddhayartham viniyogah prakirtitah || 5|| || savidhi hridayastotrasya viniyogah
    || om asya shribatukabhairavahridayastotrasya shribrihadaranyaka rishih | anushtup chandah | shribatukabhairavah
    devata | abhishtasiddhyartham pathe viniyogah || || atha rishyadinyasah || shri brihadaranyakarishaye
    namah shirasi | anushtupchandase namah mukhe | shribatukabhairavadevatayai namah hridaye | abhishtasiddhyartham
    pathe viniyogaya namah sarvange || || iti rishyadinyasah || om pranaveshah shirah patu lalate pramathadhipah
    | kapolau kamavapusho bhrubhage bhairaveshvarah || 1|| netrayorvahninayano nasikayamaghapahah | urdhvoshthe
    dirghanayano hyadharoshthe bhayashanah || 2|| cibuke bhalanayano gandayoshcandrashekharah | mukhantare
    mahakalo bhimaksho mukhamandale || 3|| grivayam virabhadro'vyad ghantikayam mahodarah | nilakantho
    gandadeshe jihvayam phanibhushanah || 4|| dashane vajradashano taluke hyamriteshvarah | dordande vajradando
    me skandhayoh skandavallabhah || 5|| kurpare kanjanayano phanau phetkarinipatih | angulishu mahabhimo
    nakheshu aghahavatu || 6|| kakshe vyaghrasano patu katyam matangacarmani | kukshau kameshvarah patu
    vastideshe smarantakah || 7|| shulapanirlingadeshe guhye guhyeshvaro'vatu | janghayam vajradamano
    jaghane jrimbhakeshvarah || 8|| padau jnanapradah patu dhanadashcangulishu ca | digvaso romakupeshu
    sandhideshe sadashivah || 9|| purvasham kamapithasthah uddishastho'gnikonake | yamyam jalandharastho
    me nairrityam kotipithagah || 10|| varunyam vajrapithastho vayavyam kulapithagah | udicyam banapithasthah
    aishanyamindupithagah || 11|| urdhvam bijendrapithasthah khetastho bhutalo'vatu | ruruh shayane'vatu
    mam cando vade sadavatu || 12|| gamane tivranayanah asine bhutavallabhah | yuddhakale mahabhimo bhayakale
    bhavantakah || 13|| raksha raksha pareshana bhimadamshtra bhayapaha | mahakala mahakala raksha mam
    kalasankatat || 14|| || phalashrutih || itidam hridayam divyam sarvapapapranashanam | sarvasampatpradam
    bhadre sarvasiddhiphalapradam || || iti shribatukabhairavahridayastotram sampurnam ||
  devanagari: ृणु देवि प्रवक्ष्यामि हृदयं बटुकस्य च ॥ ३॥ गुह्याद्गुह्यतरं गुह्यं तच्छृणुष्व तु मध्यमे
    । हृदयास्यास्य देवेशि बृहदारण्यको ऋषिः ॥ ४॥ छन्दोऽनुष्टुप् समाख्यातो देवता बटुकः स्मृतः । प्रयोगाभीष्टसिद्धयर्थं
    विनियोगः प्रकीर्तितः ॥ ५॥ ॥ सविधि हृदयस्तोत्रस्य विनियोगः ॥ ॐ अस्य श्रीबटुकभैरवहृदयस्तोत्रस्य श्रीबृहदारण्यक
    ऋषिः । अनुष्टुप् छन्दः । श्रीबटुकभैरवः देवता । अभीष्टसिद्ध्यर्थं पाठे विनियोगः ॥ ॥ अथ ऋष्यादिन्यासः
    ॥ श्री बृहदारण्यकऋषये नमः शिरसि । अनुष्टुप्छन्दसे नमः मुखे । श्रीबटुकभैरवदेवतायै नमः हृदये । अभीष्टसिद्ध्यर्थं
    पाठे विनियोगाय नमः सर्वाङ्गे ॥ ॥ इति ऋष्यादिन्यासः ॥ ॐ प्रणवेशः शिरः पातु ललाटे प्रमथाधिपः । कपोलौ
    कामवपुषो भ्रूभागे भैरवेश्वरः ॥ १॥ नेत्रयोर्वह्निनयनो नासिकायामघापहः । ऊर्ध्वोष्ठे दीर्घनयनो ह्यधरोष्ठे
    भयाशनः ॥ २॥ चिबुके भालनयनो गण्डयोश्चन्द्रशेखरः । मुखान्तरे महाकालो भीमाक्षो मुखमण्डले ॥ ३॥ ग्रीवायां
    वीरभद्रोऽव्याद् घण्टिकायां महोदरः । नीलकण्ठो गण्डदेशे जिह्वायां फणिभूषणः ॥ ४॥ दशने वज्रदशनो तालुके
    ह्यमृतेश्वरः । दोर्दण्डे वज्रदण्डो मे स्कन्धयोः स्कन्दवल्लभः ॥ ५॥ कूर्परे कञ्जनयनो फणौ फेत्कारिणीपतिः
    । अङ्गुलीषु महाभीमो नखेषु अघहावतु ॥ ६॥ कक्षे व्याघ्रासनो पातु कट्यां मातङ्गचर्मणी । कुक्षौ कामेश्वरः
    पातु वस्तिदेशे स्मरान्तकः ॥ ७॥ शूलपाणिर्लिङ्गदेशे गुह्ये गुह्येश्वरोऽवतु । जङ्घायां वज्रदमनो जघने
    जृम्भकेश्वरः ॥ ८॥ पादौ ज्ञानप्रदः पातु धनदश्चाङ्गुलीषु च । दिग्वासो रोमकूपेषु सन्धिदेशे सदाशिवः ॥
    ९॥ पूर्वाशां कामपीठस्थः उड्डीशस्थोऽग्निकोणके । याम्यां जालन्धरस्थो मे नैरृत्यां कोटिपीठगः ॥ १०॥ वारुण्यां
    वज्रपीठस्थो वायव्यां कुलपीठगः । उदीच्यां बाणपीठस्थः ऐशान्यामिन्दुपीठगः ॥ ११॥ ऊर्ध्वं बीजेन्द्रपीठस्थः
    खेटस्थो भूतलोऽवतु । रुरुः शयानेऽवतु मां चण्डो वादे सदावतु ॥ १२॥ गमने तीव्रनयनः आसीने भूतवल्लभः । युद्धकाले
    महाभीमो भयकाले भवान्तकः ॥ १३॥ रक्ष रक्ष परेशान भीमदंष्ट्र भयापह । महाकाल महाकाल रक्ष मां कालसङ्कटात्
    ॥ १४॥ ॥ फलश्रुतिः ॥ इतीदं हृदयं दिव्यं सर्वपापप्रणाशनम् । सर्वसम्पत्प्रदं भद्रे सर्वसिद्धिफलप्रदम्
    ॥ ॥ इति श्रीबटुकभैरवहृदयस्तोत्रं सम्पूर्णम् ॥
