id: balopanishat
category: upanishad
name:
  english: balopanishat
  devanagari: बालोपनिषत्
content:
  english: rinu priye cakra cakrastha | mahatma | mahaguhya | guhyatara | shreshthatishreshtha | bhavya
    | bhavyatara | trigunaga | gunatita | gunasvarupa | gunkaramadhyastha recakapurakakumbhasvarupa |
    ashtangarupa caturdashabhuvanamalini | caturdashabhuvaneshvari caturvedavedangaparaga | sankhyasankhyasvarupa
    | shanta | shaktapriya | shaktadharmaparayana | sarvabhadra vibhadra | subhadra | bhadrabhadrantargata
    | virabhadravatarini | shunya shunyatara shunyaprabhava shunyalaya shunyajnanaprada shunyatita shulahasta
    mahasundari surasurarividhvamsini shukaranana subhaga shubhada sushubha shastrastradharini paraprasadavamanga
    parameshvari parapara paramatma papaghna pancendriyalaya parabrahmavatara padmahasta pancajanya pundarikaksha
    pashupashaharini pashupapujya pakhandadhvamsini pavaneshi pavanasvarupa padyapadyamayi padyajnanapradatri
    pustahasta pakvabimbaphalaprabha pretasana prajapali prapancaharini prithivirupa pitambara pishacaganasevita
    pitrivanastha hamsasvarupa paramahamsi ainkarabija vagbhavastha vagbhavabijodyogini vagbhaveshi vagbhavabijamalini
    yah evam veda sa vedavit | balopanishadam yah pathati yah sha
  devanagari: ृणु प्रिये चक्र चक्रस्था । महात्मा । महागुह्या । गुह्यतरा । श्रेष्ठातिश्रेष्ठा । भव्या ।
    भव्यतरा । त्रिगुणगा । गुणातीता । गुणस्वरूपा । गुङ्कारमध्यस्था रेचकपूरककुम्भस्वरूपा । अष्टाङ्गरूपा
    चतुर्दशभुवनमालिनी । चतुर्दशभुवनेश्वरी चतुर्वेदवेदाङ्गपारगा । साङ्ख्यासाङ्ख्यस्वरूपा । शान्ता । शाक्तप्रिया
    । शाक्तधर्मपरायणा । सर्वभद्रा विभद्रा । सुभद्रा । भद्रभद्रान्तर्गता । वीरभद्रावतारिणी । शून्या शून्यतरा
    शून्यप्रभवा शून्यालया शून्यज्ञानप्रदा शून्यातीता शूलहस्ता महासुन्दरी सुरासुरारिविध्वंसिनी शूकरानना
    सुभगा शुभदा सुशुभा शस्त्रास्त्रधारिणी पराप्रासादवामाङ्गा परमेश्वरी परापरा परमात्मा पापघ्ना पञ्चेन्द्रियालया
    परब्रह्मावतारा पद्महस्ता पाञ्चजन्या पुण्डरीकाक्षा पशुपाशहारिणी पशुपपूज्या पाखण्डध्वंसिनी पवनेशी पवनस्वरूपा
    पद्यापद्यमयी पद्यज्ञानप्रदात्री पुस्तहस्ता पक्वबिम्बफलप्रभा प्रेतासना प्रजापाली प्रपञ्चहारिणी पृथिवीरूपा
    पीताम्बरा पिशाचगणसेविता पितृवनस्था हंसस्वरूपा परमहंसी ऐङ्कारबीजा वाग्भावस्था वाग्भवबीजोद्योगिनी वाग्भावेशी
    वाग्भवबीजमालिनी यः एवं वेद स वेदवित् । बालोपनिषदं यः पठति यः श
