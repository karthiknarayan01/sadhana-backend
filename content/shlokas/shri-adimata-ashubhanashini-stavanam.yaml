id: shri-adimata-ashubhanashini-stavanam
category: stotram
name:
  english: shri adimata ashubhanashini stavanam
  devanagari: श्री आदिमाता अशुभनाशिनी स्तवनम्
content:
  english: om namashcandikayai namashcandikayai namashcandikayai kshamasva me parameshvari om namashcandikayai
    namashcandikayai namashcandikayai prasida me parameshvari
  devanagari: ॐ नमश्चण्डिकायै नमश्चण्डिकायै नमश्चण्डिकायै क्षमस्व मे परमेश्वरि ॐ नमश्चण्डिकायै नमश्चण्डिकायै
    नमश्चण्डिकायै प्रसीद मे परमेश्वरि
meaning: {}
