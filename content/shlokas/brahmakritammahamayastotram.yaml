id: brahmakritammahamayastotram
category: stotram
name:
  english: brahmakritammahamayastotram
  devanagari: ब्रह्मकृतंमहामायास्तोत्रम्
content:
  english: tvamatsyante ca sarvada | mahavidya mahamaya mahamedha mahasmritih || 57|| mahamoha ca bhavati
    mahadevi mahasuri | tvam shristvamishvari tvam brahmani devasahayini || 58|| khadgashulagadacakrashankhacapakrita''yudha
    | bhushundiparighaprashabanasattomarayudha || 59|| yacca kincit kvacidvastu sadasadva'khilatmakam
    | tasya sarvasya ya shaktistvametatkaryasadhika || 60|| shambhorardhangana tanvi vishnorardhangana
    rama | vedhaso'rdhangana brahmi srijyadeveshu samvasa || 61|| iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 162
  devanagari: त्वमत्स्यन्ते च सर्वदा । महाविद्या महामाया महामेधा महास्मृतिः ॥ ५७॥ महामोहा च भवती महादेवी
    महासुरी । त्वं श्रीस्त्वमीश्वरी त्वं ब्रह्माणी देवसहायिनी ॥ ५८॥ खड्गशूलगदाचक्रशङ्खचापकृताऽऽयुधा ।
    भुशुण्डीपरिघप्राशबाणसत्तोमरायुधा ॥ ५९॥ यच्च किञ्चित् क्वचिद्वस्तु सदसद्वाऽखिलात्मकम् । तस्य सर्वस्य
    या शक्तिस्त्वमेतत्कार्यसाधिका ॥ ६०॥ शम्भोरर्धाङ्गना तन्वी विष्णोरर्धाङ्गना रमा । वेधसोऽर्धाङ्गना ब्राह्मी
    सृज्यदेवेषु संवस ॥ ६१॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने १६२
meaning: {}
