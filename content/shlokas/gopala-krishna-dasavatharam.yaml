id: gopala-krishna-dasavatharam
category: stotram
name:
  english: Gopala Krishna Dasavatharam
content:
  english: mallèpulaharamèyyave oyamma nannu matsyavatarudanave mallèpulaharamesèda gopalakrishna matsyavatarudanèda
    kuppikuccula jadaluvèyyave oyamma nannu kurmavatarudanave kuppikuccula jadaluvesèda gopalakrishna
    kurmavatarudanèda varamulicci divincave oyamma nannu varahavatarudanave varamulicci divincèda gopalakrishna
    varahavatarudanèda nanyamaina nagaluveyave oyamma nannu narasimhavatarudanave nanyamaina nagaluvesèda
    gopalakrishna narasimhavatarudanèda vayuvega rathamuniyyave oyamma nannu vamanavatarudanave vayuvega
    rathamuniccèda gopalakrishna vamanavatarudanèda palu posi buvvapèttave oyamma nannu parashuramavatarudanave
    palu posi buvvapèttèda gopalakrishna parashuramavatarudanèda anandabaludanave oyamma nannu ayodhyavasudanave
    anandabaludanèda gopalakrishna ayodhyavasudanèda govulukacè baludanavè oyamma nannu gopalakrishnudanave
    govulukacè baludanèda na tandri ninnu gopalakrishnudanèda budhdhulu kalipi muddapèttave oyamma nannu
    budhdhavatarudanave budhdhulu kalipi muddapèttèda gopalakrishna budhdhavatarudanèda kallaku pasidigajjèlu
    kattave oyamma nannu kalikavatarudanave kallaku pasidigajjèlu kattèda gopalakrishna kalikavatarudanèda
  devanagari: मल्लॆपूलहारमॆय्यवे ओयम्म नन्नु मत्स्यावतारुडनवे मल्लॆपूलहारमेसॆदा गोपालकृष्ण मत्स्यावतारुडनॆद
    कुप्पिकुच्चुल जडलुवॆय्यवे ओयम्म नन्नु कूर्मावतारुडनवे कुप्पिकुच्चुल जडलुवेसॆदा गोपालकृष्ण कूर्मावतारुडनॆद
    वरमुलिच्चि दीविञ्चवे ओयम्म नन्नु वरहावतारुडनवे वरमुलिच्चि दीविञ्चॆद गोपालकृष्ण वरहावतारुडनॆद नाण्यमैन
    नगलुवेयवे ओयम्म नन्नु नरसिंहावतारुडनवे नाण्यमैन नगलुवेसॆदा गोपालकृष्ण नरसिंहावतारुडनॆद वायुवेग रथमुनिय्यवे
    ओयम्म नन्नु वामनवतारुडनवे वायुवेग रथमुनिच्चॆदा गोपालकृष्ण वामनावतारुडनॆद पालु पोसि बुव्वपॆट्टवे ओयम्म
    नन्नु परशुरामावतारुडनवे पालु पोसि बुव्वपॆट्टॆद गोपालकृष्ण परशुरामावतारुडनॆद आनन्दबालुडनवे ओयम्म नन्नु
    अयोध्यवासुडनवे आनन्दबालुडनॆद गोपालकृष्ण अयोध्यवासुडनॆद गोवुलुकाचॆ बालुडनवॆ ओयम्म नन्नु गोपालकृष्णुडनवे
    गोवुलुकाचॆ बालुडनॆद ना तण्ड्रि निन्नु गोपालकृष्णुडनॆद बुध्धुलु कलिपि मुद्दपॆट्टवे ओयम्म नन्नु बुध्धावतारुडनवे
    बुध्धुलु कलिपि मुद्दपॆट्टॆद गोपालकृष्ण बुध्धावतारुडनॆद काल्लकु पसिडिगज्जॆलु कट्टवे ओयम्म नन्नु कलिकावतारुडनवे
    काल्लकु पसिडिगज्जॆलु कट्टॆद गोपालकृष्ण कलिकावतारुडनॆद
