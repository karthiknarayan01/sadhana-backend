id: sita108stananda
category: stotram
name:
  english: sita108stananda
  devanagari: सीता१०८स्तानन्द
content:
  english: vamange raghunayakasya rucire ya samsthita shobhana ya vipradhipayanaramyanayana ya viprapalanana
    | vidyutpunjavirajamanavasana bhaktartisankhandana shrimadraghavapadapadmayugaḻanyastekshana savatu
    || atha stotram | shrisita janakidevi vaidehi raghavapriya | rama'vanisuta rama rakshasantaprakarini
    || 1|| ratnagupta matulingi maithili bhaktatoshada | padmakshaja kanjanetra smitasya nupurasvana ||
    2|| vaikunthanilaya ma shrih muktida kamapurani | nripatmaja hemavarna mridulangi subhashini || 3||
    kushambika divyada ca lavamata manohara | hanumadvanditapada mugdha keyuradharini || 4|| ashokavanamadhyastha
    ravanadikamohini | vimanasamsthita subhruh sukeshi rashananvita || 5|| rajorupa sattvarupa tamasi
    vahnivasini | hemamrigasaktacitta valmikyashramavasini || 6|| pativrata mahamaya pitakausheyavasini
    | mriganetra ca bimboshthi dhanurvidyavisharada || 7|| saumyarupa dasharathasnusha camaravijita |
    sumedhaduhita divyarupa trailokyapalini || 8|| annapurna mahalakshmih dhirlajja ca sarasvati | shantih
    pushtih kshama gauri prabha'yodhyanivasini || 9|| vasantashitala gauri snanasantushtamanasa | ramanamabhadrasamstha
    hemakumbhapayodhara || 10|| surarcita dhritih kantih smritirmedha vibhavari | laghudara vararoha hemakankanamandita
    || 11|| dvijapatnyarpitanijabhusha raghavatoshini | shriramasevanarata ratnatatankadharini || 12||
    ramavamangasamstha ca ramacandraikaranjani | sarayujalasankridakarini ramamohini || 13|| suvarnatulita
    punya punyakirtih kalavati | kalakantha kambukantha rambhorurgajagamini || 14|| ramarpitamana ramavandita
    ramavallabha | shriramapadacihnanga ramarameti bhashini || 15|| ramaparyankashayana ramanghrikshalini
    vara | kamadhenvannasantushta matulingakare dhrita || 16|| divyacandanasamstha shrirmulakasuramardini
    | evamashtottarashatam sitanamnam supunyadam || 17|| ye pathanti nara bhumyam te dhanyah svargagaminah
    | ashtottarashatam namnam sitayah stotramuttamam || 18|| japaniyam prayatnena sarvada bhaktipurvakam
    | santi stotranyanekani punyadani mahanti ca || 19|| nanena sadrishaniha tani sarvani bhusura | stotranamuttamam
    cedam bhuktimuktipradam nrinam || 20|| evam sutikshna te proktamashtottarashatam shubham | sitanamnam
    punyadam ca shravananmangaḻapradam || 21|| naraih pratah samutthaya pathitavyam prayatnatah | sitapujanakale'pi
    sarvavanchitadayakam || 22|| iti shrishatakotiramacarite shrimadanandaramayane valmikiye manoharakande
    caturdashasargantargatam sitashtottarashatanamastotram sampurnam ||
  devanagari: वामाङ्गे रघुनायकस्य रुचिरे या संस्थिता शोभना या विप्राधिपयानरम्यनयना या विप्रपालानना । विद्युत्पुञ्जविराजमानवसना
    भक्तार्तिसङ्खण्डना श्रीमद्राघवपादपद्मयुगळन्यस्तेक्षणा सावतु ॥ अथ स्तोत्रम् । श्रीसीता जानकीदेवी वैदेही
    राघवप्रिया । रमाऽवनिसुता रामा राक्षसान्तप्रकारिणी ॥ १॥ रत्नगुप्ता मातुलिङ्गी मैथिली भक्ततोषदा । पद्माक्षजा
    कञ्जनेत्रा स्मितास्या नूपुरस्वना ॥ २॥ वैकुण्ठनिलया मा श्रीः मुक्तिदा कामपूरणी । नृपात्मजा हेमवर्णा
    मृदुलाङ्गी सुभाषिणी ॥ ३॥ कुशाम्बिका दिव्यदा च लवमाता मनोहरा । हनूमद्वन्दितपदा मुग्धा केयूरधारिणी ॥
    ४॥ अशोकवनमध्यस्था रावणादिकमोहिनी । विमानसंस्थिता सुभ्रूः सुकेशी रशनान्विता ॥ ५॥ रजोरूपा सत्त्वरूपा
    तामसी वह्निवसिनी । हेममृगासक्तचित्ता वाल्मीक्याश्रमवासिनी ॥ ६॥ पतिव्रता महामाया पीतकौशेयवासिनी । मृगनेत्रा
    च बिम्बोष्ठी धनुर्विद्याविशारदा ॥ ७॥ सौम्यरूपा दशरथस्नुषा चामरवीजिता । सुमेधादुहिता दिव्यरूपा त्रैलोक्यपालिनि
    ॥ ८॥ अन्नपूर्णा महालक्ष्मीः धीर्लज्जा च सरस्वती । शान्तिः पुष्टिः क्षमा गौरी प्रभाऽयोध्यानिवासिनी
    ॥ ९॥ वसन्तशीतला गौरी स्नानसन्तुष्टमानसा । रमानामभद्रसंस्था हेमकुम्भपयोधरा ॥ १०॥ सुरार्चिता धृतिः कान्तिः
    स्मृतिर्मेधा विभावरी । लघूदरा वरारोहा हेमकङ्कणमण्डिता ॥ ११॥ द्विजपत्न्यर्पितनिजभूषा राघवतोषिणी । श्रीरामसेवनरता
    रत्नताटङ्कधारिणी ॥ १२॥ रामवामाङ्गसंस्था च रामचन्द्रैकरञ्जनी । सरयूजलसङ्क्रीडाकारिणी राममोहिनी ॥ १३॥
    सुवर्णतुलिता पुण्या पुण्यकीर्तिः कलावती । कलकण्ठा कम्बुकण्ठा रम्भोरूर्गजगामिनी ॥ १४॥ रामार्पितमना
    रामवन्दिता रामवल्लभा । श्रीरामपदचिह्नाङ्गा रामरामेति भाषिणी ॥ १५॥ रामपर्यङ्कशयना रामाङ्घ्रिक्षालिणी
    वरा । कामधेन्वन्नसन्तुष्टा मातुलिङ्गकरे धृता ॥ १६॥ दिव्यचन्दनसंस्था श्रीर्मूलकासुरमर्दिनी । एवमष्टोत्तरशतं
    सीतानाम्नां सुपुण्यदम् ॥ १७॥ ये पठन्ति नरा भूम्यां ते धन्याः स्वर्गगामिनः । अष्टोत्तरशतं नाम्नां सीतायाः
    स्तोत्रमुत्तमम् ॥ १८॥ जपनीयं प्रयत्नेन सर्वदा भक्तिपूर्वकम् । सन्ति स्तोत्राण्यनेकानि पुण्यदानि महान्ति
    च ॥ १९॥ नानेन सदृशानीह तानि सर्वाणि भूसुर । स्तोत्राणामुत्तमं चेदं भुक्तिमुक्तिप्रदं नृणाम् ॥ २०॥
    एवं सुतीक्ष्ण ते प्रोक्तमष्टोत्तरशतं शुभम् । सीतानाम्नां पुण्यदं च श्रवणान्मङ्गळप्रदम् ॥ २१॥ नरैः
    प्रातः समुत्थाय पठितव्यं प्रयत्नतः । सीतापूजनकालेऽपि सर्ववाञ्छितदायकम् ॥ २२॥ इति श्रीशतकोटिरामचरिते
    श्रीमदानन्दरामायणे वाल्मिकीये मनोहरकाण्डे चतुर्दशसर्गान्तर्गतं सीताष्टोत्तरशतनामस्तोत्रं सम्पूर्णम्
    ॥
