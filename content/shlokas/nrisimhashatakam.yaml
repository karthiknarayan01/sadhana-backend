id: nrisimhashatakam
category: shataka
name:
  english: nrisimhashatakam
  devanagari: नृसिंहशतकम्
content:
  english: saccakre sutamrityunkaranakushalata suryajakarshashilah | yashcetoharihalahalabhriti bahalapritiruttalaketuh
    preyo vrindavanah kauravagururabhitah shrihari rakshatam nah || 96|| pratyakshadipramanonabhimataparalokapraharsho
    nayajne prahlade cantanishthe ghrinayati ghrinimalyacchavidyotito yah | sarvesham mulahetuh kila yadabhimato
    bhavahavaprasiddhah samsaraduddharenmam kapataharitanuh shuddhabuddhasvarupah || 97|| sardham dushtaih
    pravriddhaih kaliyugamalahritsindhujarohashali yo'bhudyevadhirajapranayavashataya labdhajanmanukarah
    | samsare satyadharma caranaparavasho yah kripanam samudrah devo'bhudrogahanta bhavatu naraharirbhasvadantah
    prakashah || 98|| daityanam kaladandah sphuratu hridi hareshcandalanguladandah shakrashrilasyadandah
    svajanaghanakripaketanollasadandah | apadgoshandadandah surapuratarunitrasabhandaughadandah svarlokacchatradandastripuranijajanurghoshanatodyadandah
    || 99|| svarge samsargavatya dititanujabhuja viryalakshmiyuvatyah prodastam kinnu dasta kalitakacakulam
    kshmatale patanaya | krodhashribahudandam valayitasitarunmandalam tatpracandam ceto brahmandaketoh
    smaraharivapusho valahastaprakandam
  devanagari: सच्चक्रे सूतमृत्युङ्करणकुशलता सूर्यजाकर्षशीलः । यश्चेतोहारिहालाहलभृति बहलप्रीतिरुत्तालकेतुः
    प्रेयो वृन्दावनः कौरवगुरुरभितः श्रीहरी रक्षतां नः ॥ ९६॥ प्रत्यक्षादिप्रमाणोनभिमतपरलोकप्रहर्षो नयज्ञे
    प्रह्लादे चान्तनिष्ठे घृणयति घृणिमाल्यच्छविद्योतितो यः । सर्वेषां मूलहेतुः किल यदभिमतो भावहावप्रसिद्धः
    संसारादुद्धरेन्मां कपटहरितनुः शुद्धबुद्धस्वरूपः ॥ ९७॥ सार्धं दुष्टैः प्रवृद्धैः कलियुगमलहृत्सिन्धुजारोहशाली
    योऽभूद्येवाधिराजप्रणयवशतया लब्धजन्मानुकारः । संसारे सत्यधर्मा चरणपरवशो यः कृपाणां समुद्रः देवोऽभूद्रोगहन्ता
    भवतु नरहरिर्भास्वदन्तः प्रकाशः ॥ ९८॥ दैत्यानां कालदण्डः स्फुरतु हृदि हरेश्चण्डलाङ्गूलदण्डः शक्रश्रीलास्यदण्डः
    स्वजनघनकृपाकेतनोल्लासदण्डः । आपद्गोषण्डदण्डः सुरपुरतरुणीत्रासभाण्डौघदण्डः स्वर्लोकच्छत्रदण्डस्त्रिपुरनिजजनुर्घोषणातोद्यदण्डः
    ॥ ९९॥ स्वर्गे संसर्गवत्या दितितनुजभुजा वीर्यलक्ष्मीयुवत्याः प्रोदस्तं किन्नु दस्ता कलितकचकुलं क्ष्मातले
    पातनाय । क्रोधश्रीबाहुदण्डं वलयितसितरुङ्मण्डलं तत्प्रचण्डं चेतो ब्रह्माण्डकेतोः स्मरहरिवपुषो वालहस्तप्रकाण्डं
