id: ashvatthamahimastotram
category: stotram
name:
  english: ashvatthamahimastotram
  devanagari: अश्वत्थमहिमास्तोत्रम्
content:
  english: ashvatthamahimastotram ishvarah sarvabhutanam kripaya vrikshamashritah || 24|| caturmasye'tha
    samprapte sarvabhutadayakarah | ashvattho'tah sada sevyo mandavare visheshatah || 25|| nityamashvatthasamsparshatpapam
    yati sahasradha | dugdhena tarpanam ye vai tilamishrena bhaktitah || 26|| secanam va karishyanti triptistatpurvajeshu
    ca | darshanadeva vrikshasya patakam tu vinashyati || 27|| pippalah pujito dhyato drishtah sevita
    eva va | paparogavinashaya caturmasye visheshatah | ashvattham pujitam siktam sarvabhutasukhavaham
    || 28|| sarvamayaharam caiva sarvapapaughaharinam | ye narah kirtayishyanti namapyashvatthavrikshajam
    || 29|| na tesham yamalokasya bhayam marge prajayate | kunkumaishcandanaishcaiva suliptam yashca karayet
    || 30|| tasya tapatrayabhavo vaikunthe ganata bhavet | duhsvapnam dushtacintanca dushtajvaraparabhavan
    || 31|| vilayam naya papani pippala tvam haripriya | mantrenanena ye devah pujayishyanti pippalam
    || 32|| tatastesham dharmarajo jayate vakyakarakah | ashvattho vacanenapi prokto jnanaprado nrinam|
    ||133|| shruto harati papam ca janmadi maranavadhi | ashvatthasevanam punyam caturmasye visheshatah
    || 34|| supte deve vrikshamadhyamasthaya bhagavanprabhuh | jalam prithvigatam sarvam prapibanniva
    sevate || 35|| jalam vishnurjalatvena vishnureva raso mahan | tasmadvrikshagato vishnushcaturmasye'ghanashanah
    || 36|| sarvabhutagato vishnurapyayayati vai jagat | tathashvatthagatam vishnum yo namasyenna naraki
    || 37|| ashvattham ropayedyastu prithivyam prayato narah | tasya papasahasrani vilayam yanti tatkshanat
    || 38|| ashvatthah sarvavrikshanam pavitro mangalanvitah | muktido ropito dhyatashcaturmasye'ghanashanah
    || 39|| ashvatthe caranam dattva brahmahatya prajayate | nishkaranam sankuthitva narake pacyate dhruvam
    || 40|| mule vishnuh sthito nityam skandhe keshava eva ca | narayanastu shakhasu patreshu bhagavanharih
    || 41|| phale'cyuto na sandehah sarvadevaih samanvitah | caturmasye visheshena drumapuji sa muktibhak
    || 42|| tasmatsarvaprayatnena sadaivashvatthasevanam | yah karoti naro bhaktya papam yati dinodbhavam
    || 43|| sa eva vishnurdruma eva murto mahatmabhih sevitapunyamulah | yasyashrayah papasahasrahanta
    bhavennrinam kamadugho gunadhyah || 44|| iti shriskandapurane nagarakhande saptacatvarimshadhikadvishatatamadhyayantargatam
    ashvatthamahimastotram samaptam | skandapurana | nagarakhanda | adhyaya 247
  devanagari: अश्वत्थमहिमास्तोत्रम् ईश्वरः सर्वभूतानां कृपया वृक्षमाश्रितः ॥ २४॥ चातुर्मास्येऽथ सम्प्राप्ते
    सर्वभूतदयाकरः । अश्वत्थोऽतः सदा सेव्यो मन्दवारे विशेषतः ॥ २५॥ नित्यमश्वत्थसंस्पर्शात्पापं याति सहस्रधा
    । दुग्धेन तर्पणं ये वै तिलमिश्रेण भक्तितः ॥ २६॥ सेचनं वा करिष्यन्ति तृप्तिस्तत्पूर्वजेषु च । दर्शनादेव
    वृक्षस्य पातकं तु विनश्यति ॥ २७॥ पिप्पलः पूजितो ध्यातो दृष्टः सेवित एव वा । पापरोगविनाशाय चातुर्मास्ये
    विशेषतः । अश्वत्थं पूजितं सिक्तं सर्वभूतसुखावहम् ॥ २८॥ सर्वामयहरं चैव सर्वपापौघहारिणम् । ये नराः कीर्तयिष्यन्ति
    नामाप्यश्वत्थवृक्षजम् ॥ २९॥ न तेषां यमलोकस्य भयं मार्गे प्रजायते । कुङ्कुमैश्चन्दनैश्चैव सुलिप्तं
    यश्च कारयेत् ॥ ३०॥ तस्य तापत्रयाभावो वैकुण्ठे गणता भवेत् । दुःस्वप्नं दुष्टचिन्ताञ्च दुष्टज्वरपराभवान्
    ॥ ३१॥ विलयं नय पापानि पिप्पल त्वं हरिप्रिय । मन्त्रेणानेन ये देवाः पूजयिष्यन्ति पिप्पलम् ॥ ३२॥ ततस्तेषां
    धर्मराजो जायते वाक्यकारकः । अश्वत्थो वचनेनापि प्रोक्तो ज्ञानप्रदो नृणां। ॥१३३॥ श्रुतो हरति पापं च
    जन्मादि मरणावधि । अश्वत्थसेवनं पुण्यं चातुर्मास्ये विशेषतः ॥ ३४॥ सुप्ते देवे वृक्षमध्यमास्थाय भगवान्प्रभुः
    । जलं पृथ्वीगतं सर्वं प्रपिबन्निव सेवते ॥ ३५॥ जलं विष्णुर्जलत्वेन विष्णुरेव रसो महान् । तस्माद्वृक्षगतो
    विष्णुश्चातुर्मास्येऽघनाशनः ॥ ३६॥ सर्वभूतगतो विष्णुराप्याययति वै जगत् । तथाश्वत्थगतं विष्णुं यो नमस्येन्न
    नारकी ॥ ३७॥ अश्वत्थं रोपयेद्यस्तु पृथिव्यां प्रयतो नरः । तस्य पापसहस्राणि विलयं यान्ति तत्क्षणात्
    ॥ ३८॥ अश्वत्थः सर्ववृक्षाणां पवित्रो मङ्गलान्वितः । मुक्तिदो रोपितो ध्यातश्चातुर्मास्येऽघनाशनः ॥ ३९॥
    अश्वत्थे चरणं दत्त्वा ब्रह्महत्या प्रजायते । निष्कारणं सङ्कुथित्वा नरके पच्यते ध्रुवम् ॥ ४०॥ मूले
    विष्णुः स्थितो नित्यं स्कन्धे केशव एव च । नारायणस्तु शाखासु पत्रेषु भगवान्हरिः ॥ ४१॥ फलेऽच्युतो न
    सन्देहः सर्वदेवैः समन्वितः । चातुर्मास्ये विशेषेण द्रुमपूजी स मुक्तिभाक् ॥ ४२॥ तस्मात्सर्वप्रयत्नेन
    सदैवाश्वत्थसेवनम् । यः करोति नरो भक्त्या पापं याति दिनोद्भवम् ॥ ४३॥ स एव विष्णुर्द्रुम एव मूर्तो महात्मभिः
    सेवितपुण्यमूलः । यस्याश्रयः पापसहस्रहन्ता भवेन्नृणां कामदुघो गुणाढ्यः ॥ ४४॥ इति श्रीस्कन्दपुराणे नागरखण्डे
    सप्तचत्वारिंशाधिकद्विशततमाध्यायान्तर्गतं अश्वत्थमहिमास्तोत्रं समाप्तम् । स्कन्दपुराण । नागरखण्ड ।
    अध्याय २४७
