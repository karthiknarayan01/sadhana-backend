id: durga-kavacham-brahmanda-puranam
category: stotram
name:
  english: Durga Kavacham (Brahmanda Puranam)
content:
  english: narayana uvaca | om durgeti caturthyantah svahanto me shiro'vatu | mantrah shadaksharo'yam
    ca bhaktanam kalpapadapah || || vicaro nasti vedeshu grahane'sya manormune | mantragrahanamatrena
    vishnutulyo bhavennarah || || mama vaktram sada patu om durgayai namo'ntatah | om durge rakshayati
    ca kantham patu sada mama || || om hrim shrimiti mantro'yam skandham patu nirantaram | hrim shrim
    klimiti prishtham ca patu me sarvatah sada || || hrim me vakshahsthalam patu hastam shrimiti santatam
    | shrim hrim klim patu sarvangam svapne jagarane tatha || || pracyam mam prakritih patuh patu vahnau
    ca candika | dakshine bhadrakali ca nairrityam ca maheshvari || || varunyam patu varahi vayavyam sarvamangala
    | uttare vaishnavi patu tathaishanyam shivapriya || || jale sthale cantarikshe patu mam jagadambika
    | iti te kathitam vatsa kavacam ca sudurlabham || || yasmai kasmai na datavyam pravaktavyam na kasyacit
    | gurumabhyarcya vidhivadvastralankaracandanaih | kavacam dharayedyastu so'pi vishnurna samshayah
    || || iti shribrahmavaivarte mahapurane prakritikhande naradanarayanasamvade durgopakhyane saptashashtitamo'dhyaye
    brahmandamohanam nama shri durga kavacam |
  devanagari: नारायण उवाच । ॐ दुर्गेति चतुर्थ्यन्तः स्वाहान्तो मे शिरोऽवतु । मन्त्रः षडक्षरोऽयं च भक्तानां
    कल्पपादपः ॥ ॥ विचारो नास्ति वेदेषु ग्रहणेऽस्य मनोर्मुने । मन्त्रग्रहणमात्रेण विष्णुतुल्यो भवेन्नरः
    ॥ ॥ मम वक्त्रं सदा पातु ॐ दुर्गायै नमोऽन्ततः । ॐ दुर्गे रक्षयति च कण्ठं पातु सदा मम ॥ ॥ ॐ ह्रीं श्रीमिति
    मन्त्रोऽयं स्कन्धं पातु निरन्तरम् । ह्रीं श्रीं क्लीमिति पृष्ठं च पातु मे सर्वतः सदा ॥ ॥ ह्रीं मे
    वक्षःस्थलं पातु हस्तं श्रीमिति सन्ततम् । श्रीं ह्रीं क्लीं पातु सर्वाङ्गं स्वप्ने जागरणे तथा ॥ ॥ प्राच्यां
    मां प्रकृतिः पातुः पातु वह्नौ च चण्डिका । दक्षिणे भद्रकाली च नैरृत्यां च महेश्वरी ॥ ॥ वारुण्यां पातु
    वाराही वायव्यां सर्वमङ्गला । उत्तरे वैष्णवी पातु तथैशान्यां शिवप्रिया ॥ ॥ जले स्थले चान्तरिक्षे पातु
    मां जगदम्बिका । इति ते कथितं वत्स कवचं च सुदुर्लभम् ॥ ॥ यस्मै कस्मै न दातव्यं प्रवक्तव्यं न कस्यचित्
    । गुरुमभ्यर्च्य विधिवद्वस्त्रालङ्कारचन्दनैः । कवचं धारयेद्यस्तु सोऽपि विष्णुर्न संशयः ॥ ॥ इति श्रीब्रह्मवैवर्ते
    महापुराणे प्रकृतिखण्डे नारदनारायणसंवादे दुर्गोपाख्याने सप्तषष्टितमोऽध्याये ब्रह्माण्डमोहनं नाम श्री
    दुर्गा कवचम् ।
