id: rishibhihkritamnrisimhastotram
category: stotram
name:
  english: rishibhihkritamnrisimhastotram
  devanagari: ऋषिभिःकृतंनृसिंहस्तोत्रम्
content:
  english: rishibhih kritam nrisimhastotram rishaya ucuh | namo namaste jagatamadhisha vishvesha vishvabhaya
    vishvamurte | kripamburashe bhajaniyatirthapadambuja shrisha dayam vidhehi || 46|| eko'si nana nijamayaya
    svaya ghate payo yadvadupadhibhinnam | bhaktecchayopattavicitravigraha prasida vishvanana vishvabhavana
    || 47|| iti shriskandapurane vaishnavakhande badarikashramamahatmye caturthadhyayantargatam rishibhih
    kritam nrisimhastotram samaptam | skandapurana | vaishnavakhanda | badarikakhanda | adhyaya 4
  devanagari: ऋषिभिः कृतं नृसिंहस्तोत्रम् ऋषय ऊचुः । नमो नमस्ते जगतामधीश विश्वेश विश्वाभय विश्वमूर्ते
    । कृपाम्बुराशे भजनीयतीर्थपादाम्बुज श्रीश दयां विधेहि ॥ ४६॥ एकोऽसि नाना निजमायया स्वया घटे पयो यद्वदुपाधिभिन्नम्
    । भक्तेच्छयोपात्तविचित्रविग्रह प्रसीद विश्वानन विश्वभावन ॥ ४७॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे बदरिकाश्रममाहात्म्ये
    चतुर्थाध्यायान्तर्गतं ऋषिभिः कृतं नृसिंहस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । बदरिकाखण्ड
    । अध्याय ४
meaning: {}
