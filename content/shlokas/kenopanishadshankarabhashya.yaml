id: kenopanishadshankarabhashya
category: upanishad
name:
  english: kenopanishadshankarabhashya
  devanagari: केनोपनिषद्शान्करभाष्य
content:
  english: vedyam brahma atmatvena avagamya tadeva brahma pratipadyate ityarthah || 9|| om apyayantu mamangani
    vakpranashcakshuhshrotramatho balamindriyani ca sarvani | sarvam brahmaupanishadam | maham brahma
    nirakuryam | mama brahma nirakarot | anirakaranamastvanirakaranam me astu | tadatmani nirate ya upanishatsu
    dharmaste mayi santu | te mayi santu || om shantih shantih shantih || iti shrimatparamahamsaparivrajakacaryasya
    shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah kritau kenopanishadbhashyam sampurnam
    || tippani
  devanagari: वेद्यं ब्रह्म आत्मत्वेन अवगम्य तदेव ब्रह्म प्रतिपद्यते इत्यर्थः ॥ ९॥ ॐ आप्यायन्तु ममाङ्गानि
    वाक्प्राणश्चक्षुःश्रोत्रमथो बलमिन्द्रियाणि च सर्वाणि । सर्वं ब्रह्मौपनिषदम् । माहं ब्रह्म निराकुर्याम्
    । मामा ब्रह्म निराकरोत् । अनिराकरणमस्त्वनिराकरणं मे अस्तु । तदात्मनि निरते य उपनिषत्सु धर्मास्ते मयि
    सन्तु । ते मयि सन्तु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य
    श्रीमच्छङ्करभगवतः कृतौ केनोपनिषद्भाष्यं सम्पूर्णम् ॥ टिप्पणी
