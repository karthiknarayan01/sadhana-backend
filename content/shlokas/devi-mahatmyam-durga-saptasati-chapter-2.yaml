id: devi-mahatmyam-durga-saptasati-chapter-2
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 2
content:
  english: mahishasura sainyavadho nama dvitiyo'dhyayah || asya sapta satimadhyama caritrasya vishnur
    rishih | ushnik chandah | shrimahalakshmidevata| shakambhari shaktih | durga bijam | vayustattvam
    | yajurvedah svarupam | shri mahalakshmiprityarthe madhyama caritra jape viniyogah || dhyanam om akshasrakparashum
    gadeshukulisham padmam dhanuh kundikam dandam shaktimasim ca carma jalajam ghantam surabhajanam |
    shulam pashasudarshane ca dadhatim hastaih pravala prabham seve sairibhamardinimiha mahalakshmim sarojasthitam
    || rishiruvaca || || devasuramabhudyuddham purnamabdashatam pura| mahishe'suranam adhipe devananca
    purandare tatrasurairmahaviryirdevasainyam parajitam| jitva ca sakalan devan indro'bhunmahishasurah
    || || tatah parajita devah padmayonim prajapatim| puraskrityagatastatra yatresha garudadhvajau ||
    || yathavrittam tayostadvan mahishasuraceshtitam| tridashah kathayamasurdevabhibhavavistaram || ||
    suryendragnyanilendunam yamasya varunasya ca anyesham cadhikaransa svayamevadhitishtati || || svargannirakritah
    sarve tena deva gana bhuvih| vicaranti yatha martya mahishena duratmana || || etadvah kathitam sarvam
    amarariviceshtitam| sharanam vah prapannah smo vadhastasya vicintyatam || || ittham nishamya devanam
    vacamsi madhusudhanah cakara kopam shambhushca bhrukutikutilananau || || tato'tikopapurnasya cakrino
    vadanattatah| nishcakrama mahattejo brahmanah shankarasya ca || || anyesham caiva devanam shakradinam
    shariratah| nirgatam sumahattejah staccaikyam samagacchata || || ativa tejasah kutam jvalantamiva
    parvatam| dadrishuste surastatra jvalavyaptadigantaram || || atulam tatra tattejah sarvadeva sharirajam|
    ekastham tadabhunnari vyaptalokatrayam tvisha || || yadabhucchambhavam tejah stenajayata tanmukham|
    yamyena cabhavan kesha bahavo vishnutejasa || || saumyena stanayoryugmam madhyam caindrena cabhavat|
    varunena ca janghoru nitambastejasa bhuvah || || brahmanastejasa padau tadangulyo'rka tejasa| vasunam
    ca karangulyah kauberena ca nasika || || tasyastu dantah sambhuta prajapatyena tejasa nayanatritayam
    jajne tatha pavakatejasa || || bhruvau ca sandhyayostejah shravanavanilasya ca anyesham caiva devanam
    sambhavastejasam shiva || || tatah samasta devanam tejorashisamudbhavam| tam vilokya mudam prapuh
    amara mahisharditah || || shulam shuladvinishkrishya dadau tasyai pinakadhrik| cakram ca dattavan
    krishnah samutpatya svacakratah || || shankham ca varunah shaktim dadau tasyai hutashanah maruto dattavamshcapam
    banapurne tatheshudhi || || vajramindrah samutpatya kulishadamaradhipah| dadau tasyai sahasraksho
    ghantamairavatadgajat || || kaladandadyamo dandam pasham cambupatirdadau| prajapatishcakshamalam dadau
    brahma kamandalam || || samastaromakupeshu nija rashmin divakarah kalashca dattavan khadgam tasyah
    shcarma ca nirmalam || || kshirodashcamalam haram ajare ca tathambare cudamanim tathadivyam kundale
    katakanica || || ardhacandram tadha shubhram keyuran sarva bahushu nupurau vimalau tadva dgraiveyakamanuttamam
    || || anguliyakaratnani samastasvangulishu ca vishva karma dadau tasyai parashum cati nirmalam ||
    || astranyanekarupani tatha'bhedyam ca damshanam| amlana pankajam malam shirasyu rasi caparam|| ||
    adadajjaladhistasyai pankajam catishobhanam| himavan vahanam simham ratnani vividhanica|| || dadavashunyam
    suraya panapatram danadhipah| sheshashca sarva nagesho mahamani vibhushitam || || nagaharam dada'u
    tasyai dhatte yah prithivimimam| anyairapi surairdevi bhushanaih ayudhaistathah || || sammanita nanadoccaih
    sattahasam muhurmuhu| tasyanadena ghorena kritsna mapuritam nabhah || || amayatatimahata pratishabdo
    mahanabhut| cukshubhuh sakalalokah samudrashca cakampire || || cacala vasudha celuh sakalashca mahidharah|
    jayeti devashca muda tamucuh simhavahinim || || tushtuvurmunayashcainam bhaktinamratmamurtayah| drishtva
    samastam sankshubdham trailokyam amararayah || || sannaddhakhilasainyaste samuttasthurudayudah| ah
    kimetaditi krodhadabhashya mahishasurah || || abhyadhavata tam shabdam asheshairasurairvritah| sa
    dadarsha tato devim vyaptalokatrayam tvisha|| || padakrantya natabhuvam kiritollikhitambaram| kshobhitasheshapatalam
    dhanurjyanihsvanena tam || || disho bhujasahasrena samantadvyapya samsthitam| tatah pravavrite yuddham
    taya devya suradvisham || || shastrastrairbhahudha muktairadipitadigantaram| mahishasurasenanishcikshurakhyo
    mahasurah || || yuyudhe camarashcanyaishcaturangabalanvitah| rathanamayutaih shadbhih rudagrakhyo
    mahasurah || || ayudhyatayutanam ca sahasrena mahahanuh| pancashadbhishca niyutairasiloma mahasurah
    || || ayutanam shataih shadbhihrbhashkalo yuyudhe rane| gajavaji sahasraughai ranekaih parivaritah
    || || vrito rathanam kotya ca yuddhe tasminnayudhyata| bidalakhyo'yutanam ca pancashadbhirathayutaih
    || || yuyudhe samyuge tatra rathanam parivaritah| anye ca tatrayutasho rathanagahayairvritah || ||
    yuyudhuh samyuge devya saha tatra mahasurah| kotikotisahastraistu rathanam dantinam tatha || || hayanam
    ca vrito yuddhe tatrabhunmahishasurah| tomarairbhindhipalaishca shaktibhirmusalaistatha || || yuyudhuh
    samyuge devya khadgaih parasupattisaih| keciccha cikshipuh shaktih kecit pashamstathapare || || devim
    khadgapraharaistu te tam hantum pracakramuh| sapi devi tatastani shastranyastrani candika || || lila
    yaiva praciccheda nijashastrastravarshini| anayastanana devi stuyamana surarshibhih || || mumocasuradeheshu
    shastranyastrani ceshvari| so'pi kruddho dhutasato devya vahanakesari || || cacarasura sainyeshu vaneshviva
    hutashanah| nihshvasan mumuceyamshca yudhyamanarane'mbika|| || ta eva sadhyasambhuta ganah shatasahasrashah|
    yuyudhuste parashubhirbhindipalasipattishaih || || nashayanto'asuraganan devishaktyupabrimhitah| avadayanta
    patahan ganah shanam stathapare|| || mridangamshca tathaivanye tasminyuddha mahotsave| tatodevi trishulena
    gadaya shaktivrishtibhih|| || khadgadibhishca shatasho nijaghana mahasuran| patayamasa caivanyan ghantasvanavimohitan
    || || asuran bhuvipashena badhvacanyanakarshayat| kecid dvidhakrita stikshnaih khadgapataistathapare||
    || vipothita nipatena gadaya bhuvi sherate| vemushca kecidrudhiram musalena bhrisham hatah || || kecinnipatita
    bhumau bhinnah shulena vakshasi| nirantarah sharaughena kritah kecidranajire || || shalyanukarinah
    pranan mamucustridashardanah| keshancidbahavashcinnashcinnagrivastathapare || || shiramsi peturanyesham
    anye madhye vidaritah| vicchinnajajghasvapare petururvyam mahasurah || || ekabahvakshicaranah keciddevya
    dvidhakritah| chinnepi canye shirasi patitah punarutthitah || || kabandha yuyudhurdevya grihitaparamayudhah|
    nanritushcapare tatra yudde turyalayashritah || || kabandhashcinnashirasah khadgashakytrishtipanayah|
    tishtha tishtheti bhashanto devi manye mahasurah || || patitai rathanagashvaih asuraishca vasundhara|
    agamya sabhavattatra yatrabhut sa maharanah || || shonitaugha mahanadyassadyastatra visusruvuh| madhye
    casurasainyasya varanasuravajinam || || kshanena tanmahasainyamasuranam tatha'mbika| ninye kshayam
    yatha vahnistrinadaru mahacayam || || saca simho mahanadamutsrijan dhutakesarah| sharirebhyo'mararinamasuniva
    vicinvati || || devya ganaishca taistatra kritam yuddham tathasuraih| yathaisham tushtuvurdevah pushpavrishtimuco
    divi || || jaya jaya shri markandeya purane savarnike manvantare devi mahatmye mahishasurasainyavadho
    nama dvitiyo'dhyayah|| ahuti om hrim sangayai sayudhayai sashaktikayai saparivarayai savahanayai ashtavimshati
    varnatmikayai lakshmi bijadishtayai mahahutim samarpayami namah svaha |
  devanagari: महिषासुर सैन्यवधो नाम द्वितीयोऽध्यायः ॥ अस्य सप्त सतीमध्यम चरित्रस्य विष्णुर् ऋषिः । उष्णिक्
    छन्दः । श्रीमहालक्ष्मीदेवता। शाकम्भरी शक्तिः । दुर्गा बीजम् । वायुस्तत्त्वम् । यजुर्वेदः स्वरूपम्
    । श्री महालक्ष्मीप्रीत्यर्थे मध्यम चरित्र जपे विनियोगः ॥ ध्यानं ॐ अक्षस्रक्परशुं गदेषुकुलिशं पद्मं
    धनुः कुण्डिकां दण्डं शक्तिमसिं च चर्म जलजं घण्टां सुराभाजनम् । शूलं पाशसुदर्शने च दधतीं हस्तैः प्रवाल
    प्रभां सेवे सैरिभमर्दिनीमिह महलक्ष्मीं सरोजस्थिताम् ॥ ऋषिरुवाच ॥ ॥ देवासुरमभूद्युद्धं पूर्णमब्दशतं
    पुरा। महिषेऽसुराणां अधिपे देवानाञ्च पुरन्दरे तत्रासुरैर्महावीर्यिर्देवसैन्यं पराजितं। जित्वा च सकलान्
    देवान् इन्द्रोऽभून्महिषासुरः ॥ ॥ ततः पराजिता देवाः पद्मयोनिं प्रजापतिम्। पुरस्कृत्यगतास्तत्र यत्रेश
    गरुडध्वजौ ॥ ॥ यथावृत्तं तयोस्तद्वन् महिषासुरचेष्टितम्। त्रिदशाः कथयामासुर्देवाभिभवविस्तरम् ॥ ॥ सूर्येन्द्राग्न्यनिलेन्दूनां
    यमस्य वरुणस्य च अन्येषां चाधिकारान्स स्वयमेवाधितिष्टति ॥ ॥ स्वर्गान्निराकृताः सर्वे तेन देव गणा भुविः।
    विचरन्ति यथा मर्त्या महिषेण दुरात्मना ॥ ॥ एतद्वः कथितं सर्वं अमरारिविचेष्टितम्। शरणं वः प्रपन्नाः
    स्मो वधस्तस्य विचिन्त्यताम् ॥ ॥ इत्थं निशम्य देवानां वचांसि मधुसूधनः चकार कोपं शम्भुश्च भ्रुकुटीकुटिलाननौ
    ॥ ॥ ततोऽतिकोपपूर्णस्य चक्रिणो वदनात्ततः। निश्चक्राम महत्तेजो ब्रह्मणः शङ्करस्य च ॥ ॥ अन्येषां चैव
    देवानां शक्रादीनां शरीरतः। निर्गतं सुमहत्तेजः स्तच्चैक्यं समगच्छत ॥ ॥ अतीव तेजसः कूटं ज्वलन्तमिव पर्वतम्।
    ददृशुस्ते सुरास्तत्र ज्वालाव्याप्तदिगन्तरम् ॥ ॥ अतुलं तत्र तत्तेजः सर्वदेव शरीरजम्। एकस्थं तदभून्नारी
    व्याप्तलोकत्रयं त्विषा ॥ ॥ यदभूच्छाम्भवं तेजः स्तेनाजायत तन्मुखम्। याम्येन चाभवन् केशा बाहवो विष्णुतेजसा
    ॥ ॥ सौम्येन स्तनयोर्युग्मं मध्यं चैन्द्रेण चाभवत्। वारुणेन च जङ्घोरू नितम्बस्तेजसा भुवः ॥ ॥ ब्रह्मणस्तेजसा
    पादौ तदङ्गुल्योऽर्क तेजसा। वसूनां च कराङ्गुल्यः कौबेरेण च नासिका ॥ ॥ तस्यास्तु दन्ताः सम्भूता प्राजापत्येन
    तेजसा नयनत्रितयं जज्ञे तथा पावकतेजसा ॥ ॥ भ्रुवौ च सन्ध्ययोस्तेजः श्रवणावनिलस्य च अन्येषां चैव देवानां
    सम्भवस्तेजसां शिव ॥ ॥ ततः समस्त देवानां तेजोराशिसमुद्भवाम्। तां विलोक्य मुदं प्रापुः अमरा महिषार्दिताः
    ॥ ॥ शूलं शूलाद्विनिष्कृष्य ददौ तस्यै पिनाकधृक्। चक्रं च दत्तवान् कृष्णः समुत्पाट्य स्वचक्रतः ॥ ॥ शङ्खं
    च वरुणः शक्तिं ददौ तस्यै हुताशनः मारुतो दत्तवांश्चापं बाणपूर्णे तथेषुधी ॥ ॥ वज्रमिन्द्रः समुत्पाट्य
    कुलिशादमराधिपः। ददौ तस्यै सहस्राक्षो घण्टामैरावताद्गजात् ॥ ॥ कालदण्डाद्यमो दण्डं पाशं चाम्बुपतिर्ददौ।
    प्रजापतिश्चाक्षमालां ददौ ब्रह्मा कमण्डलं ॥ ॥ समस्तरोमकूपेषु निज रश्मीन् दिवाकरः कालश्च दत्तवान् खड्गं
    तस्याः श्चर्म च निर्मलम् ॥ ॥ क्षीरोदश्चामलं हारं अजरे च तथाम्बरे चूडामणिं तथादिव्यं कुण्डले कटकानिच
    ॥ ॥ अर्धचन्द्रं तधा शुभ्रं केयूरान् सर्व बाहुषु नूपुरौ विमलौ तद्व द्ग्रैवेयकमनुत्तमम् ॥ ॥ अङ्गुलीयकरत्नानि
    समस्तास्वङ्गुलीषु च विश्व कर्मा ददौ तस्यै परशुं चाति निर्मलं ॥ ॥ अस्त्राण्यनेकरूपाणि तथाऽभेद्यं च
    दंशनम्। अम्लान पङ्कजां मालां शिरस्यु रसि चापराम्॥ ॥ अददज्जलधिस्तस्यै पङ्कजं चातिशोभनम्। हिमवान् वाहनं
    सिंहं रत्नानि विविधानिच॥ ॥ ददावशून्यं सुरया पानपात्रं दनाधिपः। शेषश्च सर्व नागेशो महामणि विभूषितम्
    ॥ ॥ नागहारं ददऽउ तस्यै धत्ते यः पृथिवीमिमाम्। अन्यैरपि सुरैर्देवी भूषणैः आयुधैस्तथाः ॥ ॥ सम्मानिता
    ननादोच्चैः साट्टहासं मुहुर्मुहु। तस्यानादेन घोरेण कृत्स्न मापूरितं नभः ॥ ॥ अमायतातिमहता प्रतिशब्दो
    महानभूत्। चुक्षुभुः सकलालोकाः समुद्राश्च चकम्पिरे ॥ ॥ चचाल वसुधा चेलुः सकलाश्च महीधराः। जयेति देवाश्च
    मुदा तामूचुः सिंहवाहिनीम् ॥ ॥ तुष्टुवुर्मुनयश्चैनां भक्तिनम्रात्ममूर्तयः। दृष्ट्वा समस्तं सङ्क्षुब्धं
    त्रैलोक्यं अमरारयः ॥ ॥ सन्नद्धाखिलसैन्यास्ते समुत्तस्थुरुदायुदाः। आः किमेतदिति क्रोधादाभाष्य महिषासुरः
    ॥ ॥ अभ्यधावत तं शब्दं अशेषैरसुरैर्वृतः। स ददर्ष ततो देवीं व्याप्तलोकत्रयां त्विषा॥ ॥ पादाक्रान्त्या
    नतभुवं किरीटोल्लिखिताम्बराम्। क्षोभिताशेषपातालां धनुर्ज्यानिःस्वनेन ताम् ॥ ॥ दिशो भुजसहस्रेण समन्ताद्व्याप्य
    संस्थिताम्। ततः प्रववृते युद्धं तया देव्या सुरद्विषां ॥ ॥ शस्त्रास्त्रैर्भहुधा मुक्तैरादीपितदिगन्तरम्।
    महिषासुरसेनानीश्चिक्षुराख्यो महासुरः ॥ ॥ युयुधे चमरश्चान्यैश्चतुरङ्गबलान्वितः। रथानामयुतैः षड्भिः
    रुदग्राख्यो महासुरः ॥ ॥ अयुध्यतायुतानां च सहस्रेण महाहनुः। पञ्चाशद्भिश्च नियुतैरसिलोमा महासुरः ॥ ॥
    अयुतानां शतैः षड्भिःर्भाष्कलो युयुधे रणे। गजवाजि सहस्रौघै रनेकैः परिवारितः ॥ ॥ वृतो रथानां कोट्या
    च युद्धे तस्मिन्नयुध्यत। बिडालाख्योऽयुतानां च पञ्चाशद्भिरथायुतैः ॥ ॥ युयुधे संयुगे तत्र रथानां परिवारितः।
    अन्ये च तत्रायुतशो रथनागहयैर्वृताः ॥ ॥ युयुधुः संयुगे देव्या सह तत्र महासुराः। कोटिकोटिसहस्त्रैस्तु
    रथानां दन्तिनां तथा ॥ ॥ हयानां च वृतो युद्धे तत्राभून्महिषासुरः। तोमरैर्भिन्धिपालैश्च शक्तिभिर्मुसलैस्तथा
    ॥ ॥ युयुधुः संयुगे देव्या खड्गैः परसुपट्टिसैः। केचिच्छ चिक्षिपुः शक्तीः केचित् पाशांस्तथापरे ॥ ॥ देवीं
    खड्गप्रहारैस्तु ते तां हन्तुं प्रचक्रमुः। सापि देवी ततस्तानि शस्त्राण्यस्त्राणि चण्डिका ॥ ॥ लील यैव
    प्रचिच्छेद निजशस्त्रास्त्रवर्षिणी। अनायस्तानना देवी स्तूयमाना सुरर्षिभिः ॥ ॥ मुमोचासुरदेहेषु शस्त्राण्यस्त्राणि
    चेश्वरी। सोऽपि क्रुद्धो धुतसटो देव्या वाहनकेसरी ॥ ॥ चचारासुर सैन्येषु वनेष्विव हुताशनः। निःश्वासान्
    मुमुचेयांश्च युध्यमानारणेऽम्बिका॥ ॥ त एव सध्यसम्भूता गणाः शतसहस्रशः। युयुधुस्ते परशुभिर्भिन्दिपालासिपट्टिशैः
    ॥ ॥ नाशयन्तोऽअसुरगणान् देवीशक्त्युपबृंहिताः। अवादयन्ता पटहान् गणाः शङां स्तथापरे॥ ॥ मृदङ्गांश्च तथैवान्ये
    तस्मिन्युद्ध महोत्सवे। ततोदेवी त्रिशूलेन गदया शक्तिवृष्टिभिः॥ ॥ खड्गादिभिश्च शतशो निजघान महासुरान्।
    पातयामास चैवान्यान् घण्टास्वनविमोहितान् ॥ ॥ असुरान् भुविपाशेन बध्वाचान्यानकर्षयत्। केचिद् द्विधाकृता
    स्तीक्ष्णैः खड्गपातैस्तथापरे॥ ॥ विपोथिता निपातेन गदया भुवि शेरते। वेमुश्च केचिद्रुधिरं मुसलेन भृशं
    हताः ॥ ॥ केचिन्निपतिता भूमौ भिन्नाः शूलेन वक्षसि। निरन्तराः शरौघेन कृताः केचिद्रणाजिरे ॥ ॥ शल्यानुकारिणः
    प्राणान् ममुचुस्त्रिदशार्दनाः। केषाञ्चिद्बाहवश्चिन्नाश्चिन्नग्रीवास्तथापरे ॥ ॥ शिरांसि पेतुरन्येषां
    अन्ये मध्ये विदारिताः। विच्छिन्नजज्घास्वपरे पेतुरुर्व्यां महासुराः ॥ ॥ एकबाह्वक्षिचरणाः केचिद्देव्या
    द्विधाकृताः। छिन्नेपि चान्ये शिरसि पतिताः पुनरुत्थिताः ॥ ॥ कबन्धा युयुधुर्देव्या गृहीतपरमायुधाः। ननृतुश्चापरे
    तत्र युद्दे तूर्यलयाश्रिताः ॥ ॥ कबन्धाश्चिन्नशिरसः खड्गशक्य्तृष्टिपाणयः। तिष्ठ तिष्ठेति भाषन्तो देवी
    मन्ये महासुराः ॥ ॥ पातितै रथनागाश्वैः आसुरैश्च वसुन्धरा। अगम्या साभवत्तत्र यत्राभूत् स महारणः ॥ ॥
    शोणितौघा महानद्यस्सद्यस्तत्र विसुस्रुवुः। मध्ये चासुरसैन्यस्य वारणासुरवाजिनाम् ॥ ॥ क्षणेन तन्महासैन्यमसुराणां
    तथाऽम्बिका। निन्ये क्षयं यथा वह्निस्तृणदारु महाचयम् ॥ ॥ सच सिंहो महानादमुत्सृजन् धुतकेसरः। शरीरेभ्योऽमरारीणामसूनिव
    विचिन्वति ॥ ॥ देव्या गणैश्च तैस्तत्र कृतं युद्धं तथासुरैः। यथैषां तुष्टुवुर्देवाः पुष्पवृष्टिमुचो
    दिवि ॥ ॥ जय जय श्री मार्कण्डेय पुराणे सावर्निके मन्वन्तरे देवि महत्म्ये महिषासुरसैन्यवधो नाम द्वितीयोऽध्यायः॥
    आहुति ॐ ह्रीं साङ्गायै सायुधायै सशक्तिकायै सपरिवारायै सवाहनायै अष्टाविंशति वर्णात्मिकायै लक्श्मी बीजादिष्टायै
    महाहुतिं समर्पयामि नमः स्वाहा ।
