id: gauramukhamunikritamshrikrishnanarayanastotram
category: stotram
name:
  english: gauramukhamunikritamshrikrishnanarayanastotram
  devanagari: गौरमुखमुनिकृतंश्रीकृष्णनारायणस्तोत्रम्
content:
  english: gauramukhamunikritam shrikrishnanarayanastotram namaste shrikrishnanarayanayaksharadhamine
    | namaste cadyarupaya vinadhrik dvibhujaya ca || 26|| shankhacakranvitalakshmipataye'rthadhrige namah
    | sarvapradaya divyaya bhaktagoptre ca te namah || 27|| pancabhutasthitaya'tra hridayasthaya te namah
    | apurakaya sarveshamakshayaya ca te namah || 28|| brahmavratadharaya'bdhau sheshasthaya ca te namah
    | tvatto bhutamidam sarvam sarvadatre ca te namah || 29|| tvatto yajnastatha havyam kavyam bhojyam
    ca vari ca | sarvam casti shariram te tasmai bhojyam pradehi vai || 30|| mama'tra shrikrishnanarayana
    raja hi durjayah | agato'bhyagatastasya catithyam kuru madhava || 31|| aham ca tava daso'smi kurushvannadisancayam
    | yam yam sprishami hastena yam ca pashyami cakshusha || 32|| kashtham va trinakandam va tattadannam
    caturvidham | tatha peyam jalam mishtam dugdham dadhi ghritadikam || 33|| tatsarvam siddhyatam mahyam
    yaddhyatam manasa maya | tavaiva tu pratapena bhavedatithyamacyuta || 34|| iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 532
  devanagari: गौरमुखमुनिकृतं श्रीकृष्णनारायणस्तोत्रम् नमस्ते श्रीकृष्णनारायणायाक्षरधामिने । नमस्ते चाद्यरूपाय
    वीणाधृक् द्विभुजाय च ॥ २६॥ शङ्खचक्रान्वितलक्ष्मीपतयेऽर्थधृगे नमः । सर्वप्रदाय दिव्याय भक्तगोप्त्रे
    च ते नमः ॥ २७॥ पञ्चभूतस्थितायाऽत्र हृदयस्थाय ते नमः । आपूरकाय सर्वेषामक्षयाय च ते नमः ॥ २८॥ ब्रह्मव्रतधरायाऽब्धौ
    शेषस्थाय च ते नमः । त्वत्तो भूतमिदं सर्वं सर्वदात्रे च ते नमः ॥ २९॥ त्वत्तो यज्ञस्तथा हव्यं कव्यं
    भोज्यं च वारि च । सर्वं चास्ति शरीरं ते तस्मै भोज्यं प्रदेहि वै ॥ ३०॥ ममाऽत्र श्रीकृष्णनारायण राजा
    हि दुर्जयः । आगतोऽभ्यागतस्तस्य चातिथ्यं कुरु माधव ॥ ३१॥ अहं च तव दासोऽस्मि कुरुष्वन्नादिसञ्चयम् ।
    यं यं स्पृशामि हस्तेन यं च पश्यामि चक्षुषा ॥ ३२॥ काष्ठं वा तृणकन्दं वा तत्तदन्नं चतुर्विधम् । तथा
    पेयं जलं मिष्टं दुग्धं दधि घृतादिकम् ॥ ३३॥ तत्सर्वं सिद्ध्यतां मह्यं यद्ध्यातं मनसा मया । तवैव तु
    प्रतापेन भवेदातिथ्यमच्युत ॥ ३४॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने ५३२
