id: navaratnamala
category: stotram
name:
  english: navaratnamala
  devanagari: नवरत्नमल
content:
  english: deshaka vamakucanihitavinam varadam sangitamatrikam vande || 2|| shyamalimasaukumaryam saundaryanandasampadunmesham
    | tarunimakarunapuram madajalakallolalocanam vande || 3|| nakhamukhamukharitavinanadarasasvadanavanavollasam
    | mukhamamba modayatu mam muktatatankamugdhahasitam te || 4|| sarigamapadhaniratam tam vinasankrantakantahastam
    tam | shantam mridulasvantam kucabharatantam namami shivakantam || 5|| avatutataghatitaculitaditatalipalashatatankam
    | vinavadanavela'kampitashirasam namami matangim || 6|| vinaravanushangam vikacamukhambhojamadhuribhringam
    | karunapuratarangam kalaye matangakanyakapangam || 7|| manibhangamecakangim matangim naumi siddhamatangim
    | yauvanavanasarangim sangitambhoruhanubhavabhringim || 8|| mecakamasecanakam mithyadrishtantamadhyabhagam
    te | matasvarupamanisham mangalasangitasaurabham vande || 9||
  devanagari: देशक वामकुचनिहितवीणां वरदां सङ्गीतमातृकां वन्दे ॥ २॥ श्यामलिमसौकुमार्यां सौन्दर्यानन्दसम्पदुन्मेषाम्
    । तरुणिमकरुणापूरां मदजलकल्लोललोचनां वन्दे ॥ ३॥ नखमुखमुखरितवीणानादरसास्वादनवनवोल्लासम् । मुखमम्ब मोदयतु
    मां मुक्ताताटङ्कमुग्धहसितं ते ॥ ४॥ सरिगमपधनिरतां तां वीणासङ्क्रान्तकान्तहस्तां ताम् । शान्तां मृदुलस्वान्तां
    कुचभरतान्तां नमामि शिवकान्ताम् ॥ ५॥ अवटुतटघटितचूलीताडिततालीपलाशताटङ्काम् । वीणावादनवेलाऽकम्पितशिरसां
    नमामि मातङ्गीम् ॥ ६॥ वीणारवानुषङ्गं विकचमुखाम्भोजमाधुरीभृङ्गम् । करुणापूरतरङ्गं कलये मातङ्गकन्यकापाङ्गम्
    ॥ ७॥ मणिभङ्गमेचकाङ्गीं मातङ्गीं नौमि सिद्धमातङ्गीम् । यौवनवनसारङ्गीं सङ्गीताम्भोरुहानुभवभृङ्गीम् ॥
    ८॥ मेचकमासेचनकं मिथ्यादृष्टान्तमध्यभागं ते । मातस्वरूपमनिशं मङ्गलसङ्गीतसौरभं वन्दे ॥ ९॥
