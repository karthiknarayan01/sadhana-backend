id: yagnopavita-dharana
category: stotram
name:
  english: Yagnopavita Dharana
content:
  english: ntrayate iti gayatri mbhurbhuvassuvah || tathsaviturvare mbhargo devasya dhimahi | dhiyo yo
    nah pracodaya | sharira shuddhi shlo|| apavitrah pavitro va sarvavastha tpundarikaksham sa bahyabhyantarashshucih
    || | acamanam om acamya | o nnarayanaya svaha | o ntrivikramaya namah | om va~manaya namah | om shridharaya
    namah | om hrishikeshaya namah | o ndamodaraya namah | om sankar mpradyumnaya namah | om aniruddhaya
    namah | o mpurushottamaya namah | om adhokshajaya namah | o nnarasimhaya namah | om acyutaya namah
    | o njanardhanaya namah | om upendraya namah | om haraye namah | om shrikrishnaya namah | om shrikrishna
    parabrahmane namo namah | | bhutoccatana uttishthantu | bhuta pishacah | ye te bhumibharakah | ye
    teshamavirodhena | brahmakarma samarabhe | o mbhuvah | ogm suvah | o ntapah | ogm satyam | o nyam
    bhargo devasya dhimahi | dhiyo yo nah pracodaya t || omapo jyoti raso | sankalpam mamopatta shri parameshvara
    prityartham pravartamanasya adyabrahmanah dvitiyapararthe asmin vartamana vyavaharika candramanena
    shubhayoge shubhakarana evanguna visheshana vishishthayam shubhatithau shriman shrimatah gotrasya
    mamopattaduritakshayadvara shriparameshvara prityartha mmama sakala shrautasmarta nityakarmanushthana
    yogyataphalasidhyartha nnutana yajnopavitadharana | yajnopavita dharana yajnopavita prana pratishthapana
    nkarishye| shlo|| om asunite punarasmasu cakshuh punahpranamiha no dhehi bhogam | jyokpashyema suryamuccara
    vai~ prana amritamapah prananeva yathasthanamupahvayate | | yajnopavita mantram shlo|| yajnopavite
    tasya mantrasya parameshti parabrahmar devi gayatricchandah | yajnopavita dharane viniyogah || | yajnopavita
    dharana mantram shlo|| yajnopavita mpurastat | ayushyamagrya | jirna yajnopavita visarjana shlo||
    upavita nkashmaladushitam visrijami yasho brahmavarco dirghayurastu me || om shanti shanti shantih
    catussagara paryanta mbho abhivadaye | samarpana yasya smritya ca namoktya tapassandhya kriyadishu
    nyunam sampurnatam ya~ti sadyo vande tamacyutam | mantrahina mbhaktihinam ramapate yatkrita ntu maya
    deva paripurna ntadastu me || anena yajnopavita dharanena shri lakshminarayana preranaya shri lakshminarayana
    priyantam va~rado bhavatu | shri krishnarpanamastu || kayena vaca manasendriyairva buddhya tmana va
    prakrite ssvabhavat | karomi yadyatsakala mparasmai shrimannarayanayeti samarpayami ||
  devanagari: न्त्रायते इति गायत्री म्भूर्भुव॒स्सुवः॑ ॥ तथ्स॑वि॒तुर्वरे म्भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒
    यो नः॑ प्रचोदया । शरीर शुद्धि श्लो॥ अपवित्रः पवित्रो वा सर्वावस्था त्पुण्डरीकाक्षं स बाह्याभ्यन्तरश्शुचिः
    ॥ । आचमनम् ॐ आचम्य । ओ न्नारायणाय स्वाहा । ओ न्त्रिविक्रमाय नमः । ॐ वाँमनाय नमः । ॐ श्रीधराय नमः ।
    ॐ हृषीकेशाय नमः । ओ न्दामोदराय नमः । ॐ सङ्कर् म्प्रद्युम्नाय नमः । ॐ अनिरुद्धाय नमः । ओ म्पुरुषोत्तमाय
    नमः । ॐ अधोक्षजाय नमः । ओ न्नारसिंहाय नमः । ॐ अच्युताय नमः । ओ ञ्जनार्धनाय नमः । ॐ उपेन्द्राय नमः
    । ॐ हरये नमः । ॐ श्रीकृष्णाय नमः । ॐ श्रीकृष्ण परब्रह्मणे नमो नमः । । भूतोच्चाटन उत्तिष्ठन्तु । भूत
    पिशाचाः । ये ते भूमिभारकाः । ये तेषामविरोधेन । ब्रह्मकर्म समारभे । ओ म्भुवः । ओग्ं सुवः । ओ न्तपः
    । ओग्ं स॒त्यम् । ओ ण्यं॒ भर्गो॑ दे॒वस्य॑ धीमहि । धियो॒ यो नः॑ प्रचोदया त् ॥ ओमापो॒ ज्योती॒ रसो॒ ।
    सङ्कल्पम् ममोपात्त श्री परमेश्वर प्रीत्यर्थम् प्रवर्तमानस्य अद्यब्रह्मणः द्वितीयपरार्थे अस्मिन् वर्तमान
    व्यावहारिक चान्द्रमानेन शुभयोगे शुभकरण एवङ्गुण विशेषण विशिष्ठायां शुभतिथौ श्रीमान् श्रीमतः गोत्रस्य
    ममोपात्तदुरितक्षयद्वारा श्रीपरमेश्वर प्रीत्यर्थ म्मम सकल श्रौतस्मार्त नित्यकर्मानुष्ठान योग्यताफलसिध्यर्थ
    न्नूतन यज्ञोपवीतधारण । यज्ञोपवीत धारण यज्ञोपवीत प्राण प्रतिष्ठापन ङ्करिष्ये। श्लो॥ ॐ असुनीते पुनरस्मासु
    चक्षुः पुनःप्राणमिह नो धेहि भोगम् । ज्योक्पश्येम सूर्यमुच्चर वैँ प्राणा अमृतमापः प्राणानेव यथास्थानमुपह्वयते
    । । यज्ञोपवीत मन्त्रम् श्लो॥ यज्ञोपवीते तस्य मन्त्रस्य परमेष्टि परब्रह्मर् देवी गायत्रीच्छन्दः । यज्ञोपवीत
    धारणे विनियोगः ॥ । यज्ञोपवीत धारण मन्त्रम् श्लो॥ यज्ञोपवीत म्पुरस्तात् । आयुष्यमग्र्य । जीर्ण यज्ञोपवीत
    विसर्जन श्लो॥ उपवीत ङ्कश्मलदूषितं विसृजामि यशो ब्रह्मवर्चो दीर्घायुरस्तु मे ॥ ॐ शान्ति शान्ति शान्तिः
    चतुस्सागर पर्यन्त म्भो अभिवादये । समर्पण यस्य स्मृत्या च नामोक्त्या तपस्सन्ध्या क्रियादिषु न्यूनं
    सम्पूर्णतां याँति सद्यो वन्दे तमच्युतम् । मन्त्रहीन म्भक्तिहीनं रमापते यत्कृत न्तु मया देव परिपूर्ण
    न्तदस्तु मे ॥ अनेन यज्ञोपवीत धारणेन श्री लक्ष्मीनारायण प्रेरणाय श्री लक्ष्मीनारायण प्रीयन्तां वँरदो
    भवतु । श्री कृष्णार्पणमस्तु ॥ कायेन वाचा मनसेन्द्रियैर्वा बुद्ध्या त्मना वा प्रकृते स्स्वभावात् ।
    करोमि यद्यत्सकल म्परस्मै श्रीमन्नारायणायेति समर्पयामि ॥
