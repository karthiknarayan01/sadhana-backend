    नमो॑ रु॒द्राय॒ नमः॒ काला॑य॒ नमः॒ कल॑विकरणाय नमो॒ बल॑विकरणाय॒ नमो॒ बला॑य॒ नमो॒ बल॑प्रमथनाय॒ नम॒ स्सर्व॑भूतदमनाय॒
    नमो॑ म॒नोन्म॑नाय॒ नमः॑ । ओ म्भूर्भुव॒स्सुव॒रोम् । अस्मिन् उत्तरकलशे वामदेव न्ध्यायामि । आवाहयामि ।
