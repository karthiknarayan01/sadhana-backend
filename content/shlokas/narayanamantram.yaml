id: narayanamantram
category: mantra
name:
  english: narayanamantram
  devanagari: नारायणमन्त्रम्
content:
  english: 43|| iti naradapurane uttarabhage shatpancashattamadhyayantargatam narayanamantram stotram
    samaptam | brihannaradiyapurana | uttarabhaga | adhyaya 56
  devanagari: ४३॥ इति नारदपुराणे उत्तरभागे षट्पञ्चाशत्तमाध्यायान्तर्गतं नरायणमन्त्रं स्तोत्रं समाप्तम्
    । बृहन्नारदीयपुराण । उत्तरभाग । अध्याय ५६
meaning: {}
