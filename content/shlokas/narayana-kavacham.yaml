id: narayana-kavacham
category: stotram
name:
  english: Narayana Kavacham
content:
  english: nyasah anganyasah om om padayoh namah | om nam janunoh namah | om mom urvoh namah | om nam
    udare namah | om ram hridi namah | om yam urasi namah | om nam mukhe namah | om yam shirasi namah
    | karanyasah om om dakshinatarjanyam namah | om nam dakshinamadhyamayam namah | om mom dakshinanamikayam
    namah | om bham dakshinakanishthikayam namah | om gam vamakanishthikayam namah | om vam vamanikayam
    namah | om tem vamamadhyamayam namah | om vam vamatarjanyam namah | om sum dakshinangushthordhvaparvani
    namah | om dem dakshinangushthadhah parvani namah | om vam vamangushthordhvaparvani namah | om yam
    vamangushthadhah parvani namah | vishnushadaksharanyasah om om hridaye namah | om vim murdhnai namah
    | om sham bhrurvormadhye namah | om nam shikhayam namah | om vem netrayoh namah | om nam sarvasandhishu
    namah | om mah pracyam astraya phat | om mah agneyyam astraya phat | om mah dakshinasyam astraya phat
    | om mah nairitye astraya phat | om mah praticyam astraya phat | om mah vayavye astraya phat | om
    mah udicyam astraya phat | om mah aishanyam astraya phat | om mah urdhvayam astraya phat | om mah
    adharayam astraya phat | shri harih atha shrinarayanakavaca rajovaca yaya guptah sahasrakshah savahan
    ripusainikan | kridanniva vinirjitya trilokya bubhuje shriyam || || bhagavamstanmamakhyahi varma narayanatmakam
    | yatha''tatayinah shatrun yena gupto'jayanmridhe || || shri shuka uvaca vritah purohitastvashtro
    mahendrayanupricchate | narayanakhyam varmaha tadihaikamanah shrinu || || shrivishvarupa uvaca dhautanghripaniracamya
    sapavitra udanmukhah | kritasvangakaranyaso mantrabhyam vagyatah shucih || || narayanamayam varma
    sannahyedbhaya agate | daivabhutatmakarmabhyo narayanamayah puman || || padayorjanunorurvorudare hridyathorasi
    | mukhe shirasyanupurvyadonkaradini vinyaset || || om namo narayanayeti viparyayamathapi va | karanyasam
    tatah kuryaddvadashaksharavidyaya || || pranavadiyakarantamangulyangushthaparvasu | nyaseddhridaya
    onkaram vikaramanu murdhani || || shakaram tu bhruvormadhye nakaram shikhaya nyaset | vekaram netrayoryunjyannakaram
    sarvasandhishu || || makaramastramuddishya mantramurtirbhavedbudhah | savisargam phadantam tatsarvadikshu
    vinirdishet || || om vishnave namah || ityatmanam param dhyayeddhyeyam shatchaktibhiryutam | vidyatejastapomurtimimam
    mantramudaharet || || om harirvidadhyanmama sarvaraksham nyastanghripadmah patagendra prishthe | dararicarmasigadeshucapa
    pashandadhano'shtaguno'shtabahuh || || jaleshu mam rakshatu matsyamurti ryadoganebhyo varunasya pashat
    | sthaleshu mayavatuvamano'vya ttrivikramah khe'vatu vishvarupah || || durgeshvatavyajimukhadishu
    prabhuh payannrisimho'surayuthaparih | vimuncato yasya mahattahasam disho vinedurnyapatamshca garbhah
    || || rakshatvasau madhvani yajnakalpah svadamshtrayonnitadharo varahah | ramo'drikuteshvatha vipravase
    salakshmano'vyadbharatagrajo'sman || || mamugradharmadakhilatpramada nnarayanah patu narashca hasat
    | dattastvayogadatha yoganathah payadguneshah kapilah karmabandhat || || sanatkumaro'vatu kamadeva
    ddhayanano mam pathi devahelanat | devarshivaryah purusharcanantara tkurmo harirmam nirayadasheshat
    || || dhanvantarirbhagavanpatvapathya ddvandvadbhayadrishabho nirjitatma | yajnashca lokadavatajjananta
    dbalo ganatkrodhavashadahindrah || || dvaipayano bhagavanaprabodha dbuddhastu pashandaganatpramadat
    | kalkih kaleh kalamalatprapatu dharmavanayorukritavatarah || || mam keshavo gadaya prataravya dgovinda
    asangavamattavenuh | narayanah prahna udattashakti rmadhyandine vishnurarindrapanih || || devo'parahne
    madhuhogradhanva sayam tridhamavatu madhavo mam | doshe hrishikesha utardharatre nishitha eko'vatu
    padmanabhah || ratra ishah pratyusha isho'sidharo janardanah | damodaro'vyadanusandhyam prabhate vishveshvaro
    bhagavankalamurtih || || cakram yugantanalatigmanemi bhramatsamantadbhagavatprayuktam | dandagdhi
    dandagdhyarisainyamashu kaksham yatha vatasakho hutashah || || gade'shanisparshanavisphulinge nishpindhi
    nishpindhyajitapriyasi | kushmandavainayakayaksharaksho bhutagrahamshcurnaya curnayarin || || tvam
    yatudhanapramathapretamatri pishacavipragrahaghoradrishtin | darendra vidravaya krishnapurito bhimasvano'rerhridayani
    kampayan || || tvam tigmadharasivararisainya mishaprayukto mama chindhi chindhi | cakshumshi carman
    shatacandra chadaya dvishamaghonam hara papacakshusham || || yanno bhayam grahebhyo'bhutketubhyo nribhya
    eva ca | sarisripebhyo damshtribhyo bhutebhyo'ghebhya eva ca || || sarvanyetani bhagavannamarupastrakirtanat
    | prayantu sankshayam sadyo ye nah shreyahpratipakah || || garudo bhagavan stotrastomashchandomayah
    prabhuh | rakshatvasheshakricchrebhyo vishvaksenah svanamabhih || || sarvapadbhyo harernamarupayanayudhani
    nah | buddhindriyamanahprananpantu parshadabhushanah || || yatha hi bhagavaneva vastutah sadasacca
    yat | satyenanena nah sarve yantu nashamupadravah || || yathaikatmyanubhavanam vikalparahitah svayam
    | bhushanayudhalingakhya dhatte shaktih svamayaya || || tenaiva satyamanena sarvajno bhagavan harih
    | patu sarvaih svarupairnah sada sarvatra sarvagah || || vidikshu dikshurdhvamadhah samanta dantarbahirbhagavannarasimhah
    | prahapaya~llokabhayam svanena svatejasa grastasamastatejah || || maghavannidamakhyatam varma narayanatmakam
    | vijeshyasyanjasa yena damshito'surayuthapan || || etaddharayamanastu yam yam pashyati cakshusha
    | pada va samsprishetsadyah sadhvasatsa vimucyate || || na kutashcidbhayam tasya vidyam dharayato
    bhavet | rajadasyugrahadibhyo vyadhyadibhyashca karhicit || || imam vidyam pura kashcitkaushiko dharayan
    dvijah | yogadharanaya svangam jahau sa marudhanvani || || tasyopari vimanena gandharvapatirekada
    | yayau citrarathah stribhirvrito yatra dvijakshayah || || gaganannyapatatsadyah savimano hyavakchirah
    | sa valakhilyavacanadasthinyadaya vismitah | prapya pracyam sarasvatyam snatva dhama svamanvagat
    || || shri shuka uvaca ya idam shrinuyatkale yo dharayati cadritah | tam namasyanti bhutani mucyate
    sarvato bhayat || || etam vidyamadhigato vishvarupacchatakratuh | trailokyalakshmim bubhuje vinirjitya
    mridhe'suran || || iti shrimadbhagavate mahapurane shashthaskandhe narayanavarmopadesho namashtamo'dhyayah
    |
  devanagari: न्यासः अङ्गन्यासः ॐ ॐ पादयोः नमः । ॐ नं जानुनोः नमः । ॐ मों ऊर्वोः नमः । ॐ नां उदरे नमः
    । ॐ रां हृदि नमः । ॐ यं उरसि नमः । ॐ णां मुखे नमः । ॐ यं शिरसि नमः । करन्यासः ॐ ॐ दक्षिणतर्जन्यां
    नमः । ॐ नं दक्षिणमध्यमायां नमः । ॐ मों दक्षिणानामिकायां नमः । ॐ भं दक्षिणकनिष्ठिकायां नमः । ॐ गं वामकनिष्ठिकायां
    नमः । ॐ वं वामानिकायां नमः । ॐ तें वाममध्यमायां नमः । ॐ वां वामतर्जन्यां नमः । ॐ सुं दक्षिणाङ्गुष्ठोर्ध्वपर्वणि
    नमः । ॐ दें दक्षिणाङ्गुष्ठाधः पर्वणि नमः । ॐ वां वामाङ्गुष्ठोर्ध्वपर्वणि नमः । ॐ यं वामाङ्गुष्ठाधः
    पर्वणि नमः । विष्णुषडक्षरन्यासः ॐ ॐ हृदये नमः । ॐ विं मूर्ध्नै नमः । ॐ षं भ्रुर्वोर्मध्ये नमः । ॐ
    णं शिखायां नमः । ॐ वें नेत्रयोः नमः । ॐ नं सर्वसन्धिषु नमः । ॐ मः प्राच्यां अस्त्राय फट् । ॐ मः आग्नेय्यां
    अस्त्राय फट् । ॐ मः दक्षिणस्यां अस्त्राय फट् । ॐ मः नैऋत्ये अस्त्राय फट् । ॐ मः प्रतीच्यां अस्त्राय
    फट् । ॐ मः वायव्ये अस्त्राय फट् । ॐ मः उदीच्यां अस्त्राय फट् । ॐ मः ऐशान्यां अस्त्राय फट् । ॐ मः ऊर्ध्वायां
    अस्त्राय फट् । ॐ मः अधरायां अस्त्राय फट् । श्री हरिः अथ श्रीनारायणकवच राजोवाच यया गुप्तः सहस्राक्षः
    सवाहान् रिपुसैनिकान् । क्रीडन्निव विनिर्जित्य त्रिलोक्या बुभुजे श्रियम् ॥ ॥ भगवंस्तन्ममाख्याहि वर्म
    नारायणात्मकम् । यथाऽऽततायिनः शत्रून् येन गुप्तोऽजयन्मृधे ॥ ॥ श्री शुक उवाच वृतः पुरोहितस्त्वाष्ट्रो
    महेन्द्रायानुपृच्छते । नारायणाख्यं वर्माह तदिहैकमनाः शृणु ॥ ॥ श्रीविश्वरूप उवाच धौताङ्घ्रिपाणिराचम्य
    सपवित्र उदङ्मुखः । कृतस्वाङ्गकरन्यासो मन्त्राभ्यां वाग्यतः शुचिः ॥ ॥ नारायणमयं वर्म सन्नह्येद्भय आगते
    । दैवभूतात्मकर्मभ्यो नारायणमयः पुमान् ॥ ॥ पादयोर्जानुनोरूर्वोरुदरे हृद्यथोरसि । मुखे शिरस्यानुपूर्व्यादोङ्कारादीनि
    विन्यसेत् ॥ ॥ ॐ नमो नारायणायेति विपर्ययमथापि वा । करन्यासं ततः कुर्याद्द्वादशाक्षरविद्यया ॥ ॥ प्रणवादियकारान्तमङ्गुल्यङ्गुष्ठपर्वसु
    । न्यसेद्धृदय ओङ्कारं विकारमनु मूर्धनि ॥ ॥ षकारं तु भ्रुवोर्मध्ये णकारं शिखया न्यसेत् । वेकारं नेत्रयोर्युञ्ज्यान्नकारं
    सर्वसन्धिषु ॥ ॥ मकारमस्त्रमुद्दिश्य मन्त्रमूर्तिर्भवेद्बुधः । सविसर्गं फडन्तं तत्सर्वदिक्षु विनिर्दिशेत्
    ॥ ॥ ॐ विष्णवे नमः ॥ इत्यात्मानं परं ध्यायेद्ध्येयं षट्छक्तिभिर्युतम् । विद्यातेजस्तपोमूर्तिमिमं मन्त्रमुदाहरेत्
    ॥ ॥ ॐ हरिर्विदध्यान्मम सर्वरक्षां न्यस्ताङ्घ्रिपद्मः पतगेन्द्र पृष्ठे । दरारिचर्मासिगदेषुचाप पाशान्दधानोऽष्टगुणोऽष्टबाहुः
    ॥ ॥ जलेषु मां रक्षतु मत्स्यमूर्ति र्यादोगणेभ्यो वरुणस्य पाशात् । स्थलेषु मायावटुवामनोऽव्या त्त्रिविक्रमः
    खेऽवतु विश्वरूपः ॥ ॥ दुर्गेष्वटव्याजिमुखादिषु प्रभुः पायान्नृसिंहोऽसुरयूथपारिः । विमुञ्चतो यस्य महाट्टहासं
    दिशो विनेदुर्न्यपतंश्च गर्भाः ॥ ॥ रक्षत्वसौ माध्वनि यज्ञकल्पः स्वदंष्ट्रयोन्नीतधरो वराहः । रामोऽद्रिकूटेष्वथ
    विप्रवासे सलक्ष्मणोऽव्याद्भरताग्रजोऽस्मान् ॥ ॥ मामुग्रधर्मादखिलात्प्रमादा न्नारायणः पातु नरश्च हासात्
    । दत्तस्त्वयोगादथ योगनाथः पायाद्गुणेशः कपिलः कर्मबन्धात् ॥ ॥ सनत्कुमारोऽवतु कामदेवा द्धयाननो मां पथि
    देवहेलनात् । देवर्षिवर्यः पुरुषार्चनान्तरा त्कूर्मो हरिर्मां निरयादशेषात् ॥ ॥ धन्वन्तरिर्भगवान्पात्वपथ्या
    द्द्वन्द्वाद्भयादृषभो निर्जितात्मा । यज्ञश्च लोकादवताज्जनान्ता द्बलो गणात्क्रोधवशादहीन्द्रः ॥ ॥ द्वैपायनो
    भगवानप्रबोधा द्बुद्धस्तु पाषण्डगणात्प्रमादात् । कल्किः कलेः कालमलात्प्रपातु धर्मावनायोरुकृतावतारः
    ॥ ॥ मां केशवो गदया प्रातरव्या द्गोविन्द आसङ्गवमात्तवेणुः । नारायणः प्राह्ण उदात्तशक्ति र्मध्यन्दिने
    विष्णुररीन्द्रपाणिः ॥ ॥ देवोऽपराह्णे मधुहोग्रधन्वा सायं त्रिधामावतु माधवो माम् । दोषे हृषीकेश उतार्धरात्रे
    निशीथ एकोऽवतु पद्मनाभः ॥ रात्र ईशः प्रत्युष ईशोऽसिधरो जनार्दनः । दामोदरोऽव्यादनुसन्ध्यं प्रभाते विश्वेश्वरो
    भगवान्कालमूर्तिः ॥ ॥ चक्रं युगान्तानलतिग्मनेमि भ्रमत्समन्ताद्भगवत्प्रयुक्तम् । दन्दग्धि दन्दग्ध्यरिसैन्यमाशु
    कक्षं यथा वातसखो हुताशः ॥ ॥ गदेऽशनिस्पर्शनविस्फुलिङ्गे निष्पिण्ढि निष्पिण्ढ्यजितप्रियासि । कूष्माण्डवैनायकयक्षरक्षो
    भूतग्रहांश्चूर्णय चूर्णयारीन् ॥ ॥ त्वं यातुधानप्रमथप्रेतमातृ पिशाचविप्रग्रहघोरदृष्टीन् । दरेन्द्र
    विद्रावय कृष्णपूरितो भीमस्वनोऽरेर्हृदयानि कम्पयन् ॥ ॥ त्वं तिग्मधारासिवरारिसैन्य मीशप्रयुक्तो मम छिन्धि
    छिन्धि । चक्षूंषि चर्मन् शतचन्द्र छादय द्विषामघोनां हर पापचक्षुषाम् ॥ ॥ यन्नो भयं ग्रहेभ्योऽभूत्केतुभ्यो
    नृभ्य एव च । सरीसृपेभ्यो दंष्ट्रिभ्यो भूतेभ्योऽघेभ्य एव च ॥ ॥ सर्वाण्येतानि भगवन्नामरूपास्त्रकीर्तनात्
    । प्रयान्तु सङ्क्षयं सद्यो ये नः श्रेयःप्रतीपकाः ॥ ॥ गरुडो भगवान् स्तोत्रस्तोमश्छन्दोमयः प्रभुः ।
    रक्षत्वशेषकृच्छ्रेभ्यो विष्वक्सेनः स्वनामभिः ॥ ॥ सर्वापद्भ्यो हरेर्नामरूपयानायुधानि नः । बुद्धीन्द्रियमनःप्राणान्पान्तु
    पार्षदभूषणाः ॥ ॥ यथा हि भगवानेव वस्तुतः सदसच्च यत् । सत्येनानेन नः सर्वे यान्तु नाशमुपद्रवाः ॥ ॥ यथैकात्म्यानुभावानां
    विकल्परहितः स्वयम् । भूषणायुधलिङ्गाख्या धत्ते शक्तीः स्वमायया ॥ ॥ तेनैव सत्यमानेन सर्वज्ञो भगवान्
    हरिः । पातु सर्वैः स्वरूपैर्नः सदा सर्वत्र सर्वगः ॥ ॥ विदिक्षु दिक्षूर्ध्वमधः समन्ता दन्तर्बहिर्भगवान्नारसिंहः
    । प्रहापयँल्लोकभयं स्वनेन स्वतेजसा ग्रस्तसमस्ततेजाः ॥ ॥ मघवन्निदमाख्यातं वर्म नारायणात्मकम् । विजेष्यस्यञ्जसा
    येन दंशितोऽसुरयूथपान् ॥ ॥ एतद्धारयमाणस्तु यं यं पश्यति चक्षुषा । पदा वा संस्पृशेत्सद्यः साध्वसात्स
    विमुच्यते ॥ ॥ न कुतश्चिद्भयं तस्य विद्यां धारयतो भवेत् । राजदस्युग्रहादिभ्यो व्याध्यादिभ्यश्च कर्हिचित्
    ॥ ॥ इमां विद्यां पुरा कश्चित्कौशिको धारयन् द्विजः । योगधारणया स्वाङ्गं जहौ स मरुधन्वनि ॥ ॥ तस्योपरि
    विमानेन गन्धर्वपतिरेकदा । ययौ चित्ररथः स्त्रीभिर्वृतो यत्र द्विजक्षयः ॥ ॥ गगनान्न्यपतत्सद्यः सविमानो
    ह्यवाक्छिराः । स वालखिल्यवचनादस्थीन्यादाय विस्मितः । प्राप्य प्राच्यां सरस्वत्यां स्नात्वा धाम स्वमन्वगात्
    ॥ ॥ श्री शुक उवाच य इदं शृणुयात्काले यो धारयति चादृतः । तं नमस्यन्ति भूतानि मुच्यते सर्वतो भयात् ॥
    ॥ एतां विद्यामधिगतो विश्वरूपाच्छतक्रतुः । त्रैलोक्यलक्ष्मीं बुभुजे विनिर्जित्य मृधेऽसुरान् ॥ ॥ इति
    श्रीमद्भागवते महापुराणे षष्ठस्कन्धे नारायणवर्मोपदेशो नामाष्टमोऽध्यायः ।
