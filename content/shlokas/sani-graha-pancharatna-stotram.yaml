id: sani-graha-pancharatna-stotram
category: stotram
name:
  english: Sani Graha Pancharatna Stotram
content:
  english: nilanjana samabhasam raviputram yamagrajam | chaya martanda sambhutam tam namami shanaishcaram
    || || shanaishcaraya shantaya sarvabhishta pradayine | sharanyaya varenyaya sarveshaya namonamah ||
    || stutyaya stotra gamyaya bhakti vashyaya bhanave | bhanuputraya bhavyaya pavanaya namonamah || ||
    dhanurmandala samsthaya dhanadaya dhanushmate | tanu prakashadehaya tamasaya namonamah || || jvalordhamakutabhasam
    nilagridhra rathavaham | caturbhujam devam tam shanim pranamamyaham || || om kalarupaya vidmahe varadhipaya
    | dhimahi tanna shshanih pracodayat ||
  devanagari: नीलाञ्जन समाभासं रविपुत्रं यमाग्रजम् । छाया मार्ताण्ड सम्भूतं तं नमामि शनैश्चरम् ॥ ॥ शनैश्चराय
    शान्ताय सर्वाभीष्ट प्रदायिने । शरण्याय वरेण्याय सर्वेशाय नमोनमः ॥ ॥ स्तुत्याय स्तोत्र गम्याय भक्ति
    वश्याय भानवे । भानुपुत्राय भव्याय पावनाय नमोनमः ॥ ॥ धनुर्मण्डल संस्थाय धनदाय धनुष्मते । तनु प्रकाशदेहाय
    तामसाय नमोनमः ॥ ॥ ज्वालोर्धमकुटाभासं नीलगृध्र रथावहम् । चतुर्भुजं देवं तं शनिं प्रणमाम्यहम् ॥ ॥ ॐ
    कालरूपाय विद्महे वाराधिपाय । धीमहि तन्न श्शनिः प्रचोदयात् ॥
