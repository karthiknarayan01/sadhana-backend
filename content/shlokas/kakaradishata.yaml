id: kakaradishata
category: stotram
name:
  english: kakaradishata
  devanagari: ककारादिशत
content:
  english: stotram yathashaktya maheshvari || 31|| shatavaraprapathananmantrasiddhirbhaveddhruvam | nanatantram
    shrutam devi mama vaktrat sureshvari || 32|| mundamalamahamantram mahamantrasya sadhanam | bhaktya
    bhagavatim durgam duhkhadaridryanashinim || 33|| samsmared yo japeddhyayet sa mukto natra samshaya
    | jivanmuktah sa vijneyastantrabhaktiparayanah || 34|| sa sadhako mahajnani yashca durgapadanugah
    | na ca bhaktirna vahabhaktirna muktinaganandini || 35|| vina durgam jagaddhatri nishphalam jivanam
    bhabhet | shaktimargarato bhutva yohanyamarge pradhavati || 36|| na ca shaktastasya vaktram paripashyanti
    shankari | vina tantrad vina mantrad vina yantranmaheshvari || 37|| na ca bhuktishca muktishca jayate
    varavarnini | yatha gururmaheshani yatha ca paramo guruh || 38|| tantravakta guruh sakshad yatha ca
    jnanadah shivah | tantranca tantravaktaram nindanti tantrikim kriyam || 39|| ye jana bhairavastesham
    mamsasthicarvanodyatah | ataeva ca tantrajnam sa nindanti kadacana | na hastanti na himsanti na vadantyanyatha
    budha || 40|| || iti mundamalatantre'shtamapatale devishvara samvade kalishatanamastotram sampurnam
    ||
  devanagari: स्तोत्रं यथाशक्त्या महेश्वरी ॥ ३१॥ शतवारप्रपठनान्मन्त्रसिद्धिर्भवेद्ध्रूवम् । नानातन्त्रं
    श्रुतं देवि मम वक्त्रात् सुरेश्वरी ॥ ३२॥ मुण्डमालामहामन्त्रं महामन्त्रस्य साधनम् । भक्त्या भगवतीं
    दुर्गां दुःखदारिद्र्यनाशिनीम् ॥ ३३॥ संस्मरेद् यो जपेद्ध्यायेत् स मुक्तो नात्र संशय । जीवन्मुक्तः स
    विज्ञेयस्तन्त्रभक्तिपरायणः ॥ ३४॥ स साधको महाज्ञानी यश्च दुर्गापदानुगः । न च भक्तिर्न वाहभक्तिर्न मुक्तिनगनन्दिनि
    ॥ ३५॥ विना दुर्गां जगद्धात्री निष्फलं जीवनं भभेत् । शक्तिमार्गरतो भूत्वा योहन्यमार्गे प्रधावति ॥ ३६॥
    न च शाक्तास्तस्य वक्त्रं परिपश्यन्ति शङ्करी । विना तन्त्राद् विना मन्त्राद् विना यन्त्रान्महेश्वरी
    ॥ ३७॥ न च भुक्तिश्च मुक्तिश्च जायते वरवर्णिनी । यथा गुरुर्महेशानि यथा च परमो गुरुः ॥ ३८॥ तन्त्रावक्ता
    गुरुः साक्षाद् यथा च ज्ञानदः शिवः । तन्त्रञ्च तन्त्रवक्तारं निन्दन्ति तान्त्रीकीं क्रियाम् ॥ ३९॥ ये
    जना भैरवास्तेषां मांसास्थिचर्वणोद्यताः । अतएव च तन्त्रज्ञं स निन्दन्ति कदाचन । न हस्तन्ति न हिंसन्ति
    न वदन्त्यन्यथा बुधा ॥ ४०॥ ॥ इति मुण्डमालातन्त्रेऽष्टमपटले देवीश्वर संवादे कालीशतनामस्तोत्रं सम्पूर्णम्
    ॥
