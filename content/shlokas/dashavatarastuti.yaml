id: dashavatarastuti
category: stotram
name:
  english: dashavatarastuti
  devanagari: दशवतरस्तुति
content:
  english: toketarartiharanakevalartasukhadhikekikalajalada | saketanathavarapakeramukhyasuta kokena bhaktimatulam
    rakendu bimbamukha kakekshanapaha hrishikesha te'nghrikamale || 13|| rame nrinam hridabhiramenarashikulabhime
    mano'dyaramatam gomedinijayitapo'meyagadhisutakamenivishta manasi | shyame sada tvayi jitameyatapasajarame
    gatadhikasame bhimeshacapadalanameyashauryajitavamekshane vijayini || 14|| kantaragehakhalakantaratadvadana
    kantalakantakasharam kantarayambujanikantanvavayavidhukantashmabhadipahare | kantaliloladalakantabhishobhitilakantabhavantamanusa
    kantanuyanajita kantaradurgakatakanta ramatvavatu mam || 15|| dantam dashananasutantam dharamadhivasantam
    pracandatapasa klantam sametya vipinantam tvavapa yamanantam tapasvipatalam | yantam bhavaratibhayantam
    mamashu bhagavantam bharena bhajatat svantam savaridanujantam dharadharanishantam sa tapasavaram ||
    16|| shampabhacapalavakampastashatrubalasampaditamitayashah sham padatamarasasampatino'lamanukamparasena
    disha me | sampatipakshisahajam papiravanahatam pavanam yadakrithah tvam papakupapatitam pahi mam
    tadapi pampasarastatacara || 17|| lolakshyapekshitasulilakurangavadhakhelakutuhalagate svalapabhumijanibalapaharyanujapaladya
    bho jayajaya | balagnidagdhapurashalanilatmajaniphalattapattalarajo nilangadadikapimalakritalipathamulabhyatitajaladhe
    || 18|| tunirakarmuka kripanikinankabhujapaniravipratimabhah kshonidharalinibhaghonimukhadighanavenisurakshanakarah
    | shonibhavannayana konijitambunidhipaniritarhanamani
  devanagari: तोकेतरार्तिहरणाकेवलार्तसुखधीकेकिकालजलद । साकेतनाथवरपाकेरमुख्यसुत कोकेन भक्तिमतुलाम् राकेन्दु
    बिम्बमुख काकेक्षणापह हृशीकेश तेऽङ्घ्रिकमले ॥ १३॥ रामे नृणां हृदभिरामेनराशिकुलभीमे मनोऽद्यरमताम् गोमेदिनीजयितपोऽमेयगाधिसुतकामेनिविष्ट
    मनसि । श्यामे सदा त्वयि जितामेयतापसजरामे गताधिकसमे भीमेशचापदलनामेयशौर्यजितवामेक्षणे विजयिनि ॥ १४॥
    कान्तारगेहखलकान्तारटद्वदन कान्तालकान्तकशरम् कान्तारयाम्बुजनिकान्तान्ववायविधुकान्ताश्मभादिपहरे । कान्तालिलोलदलकान्ताभिशोभितिलकान्ताभवन्तमनुसा
    कान्तानुयानजित कान्तारदुर्गकटकान्ता रमात्ववतु माम् ॥ १५॥ दान्तं दशाननसुतान्तं धरामधिवसन्तं प्रचण्डतपसा
    क्लान्तं समेत्य विपिनान्तं त्ववाप यमनन्तं तपस्विपटलम् । यान्तं भवारतिभयान्तं ममाशु भगवन्तं भरेण भजतात्
    स्वान्तं सवारिदनुजान्तं धराधरनिशान्तं स तापसवरम् ॥ १६॥ शम्पाभचापलवकंपास्तशत्रुबलसम्पादितामितयशाः शं
    पादतामरससम्पातिनोऽलमनुकम्पारसेन दिश मे । सम्पातिपक्षिसहजं पापिरावणहतं पावनं यदकृथाः त्वं पापकूपपतितं
    पाहि मां तदपि पम्पासरस्तटचर ॥ १७॥ लोलाक्ष्यपेक्षितसुलीलाकुरङ्गवधखेलाकुतूहलगते स्वालापभूमिजनिबालापहार्यनुजपालाद्य
    भो जयजय । बालाग्निदग्धपुरशालानिलात्मजनिफालात्तपत्तलरजो नीलाङ्गदादिकपिमालाकृतालिपथमूलाभ्यतीतजलधे ॥
    १८॥ तूणीरकार्मुक कृपाणीकिणाङ्कभुजपाणीरविप्रतिमभाः क्षोणिधरालिनिभघोणीमुखादिघनवेणीसुरक्षणकरः । शोणिभवन्नयन
    कोणीजिताम्बुनिधिपाणीरितार्हणमणि
