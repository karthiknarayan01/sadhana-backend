id: dattatreyakavacam-vasudevanandasarasvati-viracitam
category: kavacha
name:
  english: dattatreyakavacam (vasudevanandasarasvati viracitam)
  devanagari: दत्तात्रेयकवचम् (वासुदेवानन्दसरस्वती विरचितम्)
content:
  english: shridattatreyakavacam shripadah patu me padavuru siddhasanasthitah | payaddigambaro guhyam
    nriharih patu me katim || 1|| nabhim patu jagatsrashtodaram patu dalodarah | kripaluh patu hridayam
    shadbhujah patu me bhujau || 2|| srakkundishuladamarushankhacakradharah karan | patu kantham kambukanthah
    sumukhah patu me mukham || 3|| jihvam me vedavakpatu netre me patu divyadrik | nasikam patu gandhatma
    patu punyashravah shruti || 4|| lalatam patu hamsatma shirah patu jatadharah | karmendriyani patvishah
    patu jnanendriyanyajah || 5|| sarvantaro'ntakaranam prananme patu yogirat | uparishtadadhastacca prishthatah
    parshvato'grajah || 6|| antarbahishca mam nityam nanarupadharo'vatu | varjitam kavacenavyatsthanam
    me divyadarshanah || 7|| rajatah shatruto himsrad dushprayogadito'ghatah | adhivyadhibhayartibhyo
    dattatreyah sadavatu || 8|| dhanadhanyagrihakshetrastriputrapashukinkaran | jnatimshca patu nityam
    me'nasuyanandavardhanah || 9|| balonmattapishacabho dyunitsandhishu patu mam | bhutabhautikamrityubhyo
    harih patu digambarah || 10|| ya etaddattakavacam sannahyadbhaktibhavitah | sarvanarthavinirmukto
    grahapidavivarjitah || 11|| bhutapretapishacadyairdevairapyaparajitah | bhuktvatra divyabhogansa dehante
    tatpadam vrajet || 12|| iti shrimad paramapujaniya shrivasudevanandasarasvativiracitam shridattatreyakavacam
    sampurnam |
  devanagari: श्रीदत्तात्रेयकवचम् श्रीपादः पातु मे पादावूरू सिद्धासनस्थितः । पायाद्दिगम्बरो गुह्यं नृहरिः
    पातु मे कटिम् ॥ १॥ नाभिं पातु जगत्स्रष्टोदरं पातु दलोदरः । कृपालुः पातु हृदयं षड्भुजः पातु मे भुजौ
    ॥ २॥ स्रक्कुण्डीशूलडमरुशङ्खचक्रधरः करान् । पातु कण्ठं कम्बुकण्ठः सुमुखः पातु मे मुखम् ॥ ३॥ जिह्वां
    मे वेदवाक्पातु नेत्रे मे पातु दिव्यदृक् । नासिकां पातु गन्धात्मा पातु पुण्यश्रवाः श्रुती ॥ ४॥ ललाटं
    पातु हंसात्मा शिरः पातु जटाधरः । कर्मेन्द्रियाणि पात्वीशः पातु ज्ञानेन्द्रियाण्यजः ॥ ५॥ सर्वान्तरोऽन्तकरणं
    प्राणान्मे पातु योगिराट् । उपरिष्टादधस्ताच्च पृष्ठतः पार्श्वतोऽग्रजः ॥ ६॥ अन्तर्बहिश्च मां नित्यं
    नानारूपधरोऽवतु । वर्जितं कवचेनाव्यात्स्थानं मे दिव्यदर्शनः ॥ ७॥ राजतः शत्रुतो हिंस्राद् दुष्प्रयोगादितोऽघतः
    । आधिव्याधिभयार्तिभ्यो दत्तात्रेयः सदावतु ॥ ८॥ धनधान्यगृहक्षेत्रस्त्रीपुत्रपशुकिङ्करान् । ज्ञातींश्च
    पातु नित्यं मेऽनसूयानन्दवर्धनः ॥ ९॥ बालोन्मत्तपिशाचाभो द्युनिट्सन्धिषु पातु माम् । भूतभौतिकमृत्युभ्यो
    हरिः पातु दिगम्बरः ॥ १०॥ य एतद्दत्तकवचं सन्नह्याद्भक्तिभावितः । सर्वानर्थविनिर्मुक्तो ग्रहपीडाविवर्जितः
    ॥ ११॥ भूतप्रेतपिशाचाद्यैर्देवैरप्यपराजितः । भुक्त्वात्र दिव्यभोगान्स देहान्ते तत्पदं व्रजेत् ॥ १२॥
    इति श्रीमद् परमपूजनीय श्रीवासुदेवानन्दसरस्वतीविरचितं श्रीदत्तात्रेयकवचं सम्पूर्णम् ।
