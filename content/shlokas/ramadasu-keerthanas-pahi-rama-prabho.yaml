id: ramadasu-keerthanas-pahi-rama-prabho
category: stotram
name:
  english: Ramadasu Keerthanas Pahi Rama Prabho
content:
  english: pahiramaprabho pahiramaprabho pahi bhadradri vaidehi ramaprabho shrimanmaha gunastomamabhiramaminama
    kirtanalu varnintura ramaprabho indirahridayaravindadhirudha sundarakara sananda ramaprabho èndunejuda
    misundaranandamunu kandunokannulimpapòda shriramaprabho punyacaritralavanya karunyagambhiryadakshinya
    shriramacandra kandarpajanakanayanduranjali sadanandundu vai pujalandu ramaprabho impuga jèvulakunvindu
    ga nikathal kanduga mimmi sòpòndaramaprabho vandanamu cesimunulandaru ghanulai rivindalai nattigovinda
    ramaprabho brindara kadibrindarcita padaravindamula nisandarshitananda ramaprabho tallivinivèmatandrivinivè
    madatavunivu mabhrataramaprabho vallavadharalainagòlla bhamalagudi yullamalarangaranjilli ramaprabho
    mallarangambunandèlla mallulajiriyallakamsuni jampumalla ramaprabho kòllaluganimaya vèlliviriyaga
    jeyunallapamuna kridasalpu ramaprabho tammudununivu parshvammulam jerivillammu lèkkadinilcuramaprabho
    krammukòni shatruvuluhummanucu vaccèdaru immèna banammulimmu ramaprabho rammunakimmabhayammu nipadamull
    namminanayya shriramacandra prabho kantimishankhammu kantimicakramukanti mipadamulganti ramaprabho
    vinti mimahima vènnanti mitammudunivu jantaravayya navènta ramaprabho memunivaramainamainamurakshimpu
    mannamujagelashriramacandra namanovidhininipremato nundumibhumijasahitajaya ramaprabho mimahatvamuvinann
    manambandu bremambuvemarubuttu shriramaprabho shyamalasundarankomalanjanaki kamukantvambhaje ramacandra
    prabho kamitardhamuliccu nimahatyamuvinna moralincu nasvami ramaprabho kamitaprabhudavai prematorakshincusvami
    saketapuri ramaprabho annaravanna nikannanamidanèvarannavareriramanna ramaprabho ninnègakanumariyanyulagananan
    gannatandrivimayanna ramaprabho vènnadòngilitinna cinna krishnammaninnènna gavashamèramanna ramaprabho
    ènnènnojanmamulanèttagajalani ninnènammitini varnintu ramaprabho pannagadhipashayibhavanagata apannanamanavi
    vinavanna ramaprabho etivakyambumisatidaivambumummatiki bhuviledumeti ramaprabho padudunmimmu gòniyadudunmodamuna
    veducunnanu gapadu ramaprabho vedukoganè nijodukadanu nivukudirarayyanatoda ramaprabho nedunakorkèlideragajesi
    kapadarakarinelujuda ramaprabho mudumurtula katmamulamai cènnòndinadavani shatrulunnada ramaprabho
    cudamibhaktulanugudamiripulago radumivallagovinda ramaprabho pundarikakshamartanda vamshodbhavakhandalastutyakodanda
    ramaprabho kundalishayanabhumandaloddharana pashandajanaharanakodanda ramaprabho nindudayatodanayandabayakanu
    nivundigapadu kodanda ramaprabho jatakautuhalam setukritvarama putasitapatedata ramaprabho patakulalo
    mòdatipatukuda navanti patukuni kacute khyati ramaprabho bhutanadhunivillukhyatigakhandincisita gaikònnavikhyati
    ramaprabho putanakalmashoddhutapèn shatrusamharisitasametaramaprabho jatinitulu leka bhutalambunadirugughatakulabarimarcu
    neta ramaprabho èppudun gantikin rèppavalègacinanòppugagavumayappa ramaprabho edayanidayayodayambhonidhiyadi
    ledayyanamida ramaprabho ghorarakshasa garvaharavishvambharodaravistara gunasandra ramaprabho modamunanivunannadukovayya
    godavaritira bhadradri ramaprabho nidubanambulanu nadushatrubattibadhimpakunnanademi ramaprabho adimadhyanta
    bahirantaratmundanucuvadintune jagannatha calademipadabjatamula satipadunalgulokambulugudi ramaprabho
    elayilagugelajesedu mammelukovayya mapaliramaprabho paluvènnalumruccilincayashodarola gattinamayajala
    ramaprabho kòllalugavrepallèpallavadhurulato nalliballiganuranjillu ramaprabho vali nòkkammuna gulinesina
    shauryashaliyoninudalatujala salabhanjikalanirmulambuceyagajalitivi gopalabala ramaprabho talavrikshamunòkkakola
    dharagulangadulanesina bahushali shilayainayahalya shripadamulusokanòlatayaimimudalacèra vinanayya
    manavi gaikònavayya tappulan ganakayya sammatingònucu ramaprabho danadharmambuludapajapambulu nidunamakirtanakusarikavu
    ramaprabho manavamanamulu mahini nivaiyundaganiyèdanundamakela jnanayogabhyasamandunundèdivari kanandamayudavainavu
    anurenuparipurnadauhridivanigamanavi vinu devakitanaya ramaprabho masyamai yashritra vadanyamai sujanasanmodamai
    vèlugu murdhanya ramaprabho nityamaisatyamainirmalambai mahini divyavamshottamsamaina ramaprabho sedyamaimikadhalbhavyamai
    sajjana shravyamaiyundunodivya ramaprabho gattiganannu nivupattugavihitamaupattugamammucepattu ramaprabho
  devanagari: पाहिरामप्रभो पाहिरामप्रभो पाहि भद्राद्रि वैदेहि रामप्रभो श्रीमन्महा गुणस्तोममाभिराममीनाम
    कीर्तनलु वर्णिन्तुरा रामप्रभो इन्दिराहृदयारविन्दाधिरूढ सुन्दराकार सानन्द रामप्रभो ऎन्दुनेजूड मीसुन्दरानन्दमुनु
    कन्दुनोकन्नुलिम्पपॊद श्रीरामप्रभो पुण्यचारित्रलावण्य कारुण्यगाम्भीर्यदाक्षिण्य श्रीरामचन्द्र कन्दर्पजनकनायन्दुरञ्जलि
    सदानन्दुण्डु वै पूजलन्दु रामप्रभो इम्पुगा जॆवुलकुन्विन्दु गा नीकथल् कन्दुगा मिम्मि सॊपॊन्दरामप्रभो
    वन्दनमु चेसिमुनुलन्दरु घनुलै रिविन्दलै नट्टिगोविन्द रामप्रभो बृन्दार कादिबृन्दार्चित पदारविन्दमुल
    नीसन्दर्शितानन्द रामप्रभो तल्लिवीनीवॆमातण्ड्रिविनीवॆ मदातवुनीवु माभ्रतरामप्रभो वल्लवाधरलैनगॊल्ल भामलगूडि
    युल्लमलरङ्गरञ्जिल्लि रामप्रभो मल्लरङ्गम्बुनन्दॆल्ल मल्लुलजीरियल्लकंसुनि जम्पुमल्ल रामप्रभो कॊल्ललुगनीमाय
    वॆल्लिविरियग जेयुनल्लपमुन क्रीडसल्पु रामप्रभो तम्मुडुनुनीवु पार्श्वम्मुलं जेरिविल्लम्मु लॆक्कडिनिल्चुरामप्रभो
    क्रम्मुकॊनि शात्रुवुलुहुम्मनुचु वच्चॆदरु इम्मॆन बाणम्मुलिम्मु रामप्रभो रम्मुनाकिम्मभयम्मु नीपादमुल्ल्
    नम्मिनानय्य श्रीरामचन्द्र प्रभो कण्टिमीशङ्खम्मु कन्तीमीचक्रमुकण्टि मीपादमुल्गण्टि रामप्रभो विण्टि
    मीमहिमा वॆन्नण्टि मीतम्मुडुनीवु जण्टरावय्य नावॆण्ट रामप्रभो मेमुनीवारमैनामैनामुरक्षिम्पु मन्नामुजागेलश्रीरामचन्द्र
    नामनोवीधिनिनीप्रेमतो नुण्डुमीभूमीजासहितजय रामप्रभो मीमहत्वमुविनन्न् मनम्बन्दु ब्रेमम्बुवेमरुबुट्टु
    श्रीरामप्रभो श्यामलसुन्दरङ्कोमलञ्जानकी कामुकन्त्वम्भजे रामचन्द्र प्रभो कामितार्धमुलिच्चु नीमहत्यमुविन्ना
    मोरालिञ्चु नास्वामि रामप्रभो कामितप्रभुडवै प्रेमतोरक्षिञ्चुस्वामि साकेतपुरि रामप्रभो अन्नरावन्न नीकन्ननामिदनॆवरन्नवारेरिरामन्न
    रामप्रभो निन्नॆगाकनुमरियन्युलगाननन् गन्नतण्ड्रिविमायन्न रामप्रभो वॆन्नदॊङ्गिलितिन्न चिन्न कृष्णम्मनिन्नॆन्न
    गावशमॆरामन्न रामप्रभो ऎन्नॆन्नोजन्ममुलनॆत्तगाजालनि निन्नॆनम्मितिनि वर्णिन्तु रामप्रभो पन्नगाधिपशायिभावनागत
    आपन्ननामनवि विनवन्न रामप्रभो एटिवाक्यम्बुमीसाटिदैवम्बुमुम्माटिकि भुविलेदुमेटि रामप्रभो पाडुदुन्मिम्मु
    गॊनियाडुदुन्मोदमुन वेडुचुन्नानु गापाडु रामप्रभो वेडुकोगानॆ नीजोडुकाडनु नीवुकूडिरारय्यनातोड रामप्रभो
    नेडुनाकोर्कॆलीडेरगाजेसि कापाडराकरिनेलुजूड रामप्रभो मूडुमूर्तुल कात्ममूलमै चॆन्नॊन्दिनाडवनि शत्रुलुन्नाड
    रामप्रभो चूडमीभक्तुलनुगूडमीरिपुलगो राडुमीवल्लगोविन्द रामप्रभो पुण्डरीकाक्षमार्ताण्ड वंशोद्भवाखण्डलस्तुत्यकोदण्ड
    रामप्रभो कुण्डलीशयनभूमण्डलोद्धरण पाषाण्डजनहरणकोदण्ड रामप्रभो निण्डुदयतोडनायण्डबायकनु नीवुण्डिगापाडु
    कोदण्ड रामप्रभो जातकौतूहलं सेतुकृत्वारमा पूतसीतापतेदात रामप्रभो पातकुललो मॊदटिपातुकुड नावण्टि पातुकुनि
    काचूटे ख्याति रामप्रभो भूतनाधुनिविल्लुख्यातिगाखण्डिञ्चिसीत गैकॊन्नविख्याति रामप्रभो पूतनाकल्मषोद्धूतपॆन्
    शत्रुसंहारिसीतासमेतरामप्रभो जातिनीतुलु लेक भूतलम्बुनदिरुगुघातकुलबरिमार्चु नेत रामप्रभो ऎप्पुडुन् गण्टिकिन्
    रॆप्पवलॆगाचिननॊप्पुगागावुमायप्प रामप्रभो एदयानीदयायोदयाम्भोनिधियादि लेदय्यनामीद रामप्रभो घोरराक्षस
    गर्वहरविश्वम्भरोदारविस्तार गुणसान्द्र रामप्रभो मोदमुननीवुनन्नादुकोवय्य गोदावरीतीर भद्राद्रि रामप्रभो
    नीदुबाणम्बुलनु नादुशत्रुबट्टिबाधिम्पकुन्नानदेमि रामप्रभो आदिमध्यान्त बहिरन्तरात्मुण्डनुचुवादिन्तुने
    जगन्नाथ चालदेमिपदाब्जातमुल साटिपदुनाल्गुलोकम्बुलुगूडि रामप्रभो एलयीलागुगेलजेसेदु मम्मेलुकोवय्य मापालिरामप्रभो
    पालुवॆन्नलुम्रुच्चिलिञ्चयशोदरोल गट्टिनमायजाल रामप्रभो कॊल्ललुगव्रेपल्लॆपल्लवाधुरुलतो नल्लिबल्लिगनुरञ्जिल्लु
    रामप्रभो वालि नॊक्कम्मुन गूलिनेसिन शौर्यशालियोनिनुदलतुजाल सालभञ्जिकलनिर्मूलम्बुचेयगाजालितिवि गोपालबाल
    रामप्रभो तालवृक्षमुनॊक्ककोल धरगूलङ्गदूलनेसिन बहुशालि शिलयैनयहल्य श्रीपादमुलुसोकनॊलतयैमिमुदलचॆरा विननय्य
    मनवि गैकॊनवय्य तप्पुलन् गनकय्य सम्मतिङ्गॊनुचु रामप्रभो दानधर्मम्बुलुदपजपम्बुलु नीदुनामकीर्तनकुसरिकावु
    रामप्रभो मानावमानमुलु महिनि नीवैयुण्डगनीयॆडनुण्डमाकेल ज्ञानयोगभ्यासमन्दुनुण्डॆडिवारि कानन्दमयुडवैनावु
    अणुरेणुपरिपूर्णडौहृदिवानिगामनवि विनु देवकीतनय रामप्रभो मास्यमै याश्रित्र वदान्यमै सुजनसन्मोदमै वॆलुगु
    मूर्धन्य रामप्रभो नित्यमैसत्यमैनिर्मलम्बै महिनि दिव्यवंशोत्तंसमैन रामप्रभो सेद्यमैमीकधल्भाव्यमै सज्जन
    श्राव्यमैयुण्डुनोदिव्य रामप्रभो गट्टिगानन्नु नीवुपट्टुगाविहितमौपट्टुगामम्मुचेपट्टु रामप्रभो
