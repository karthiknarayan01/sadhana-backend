id: chanakya-neethi-chapter-6
category: stotram
name:
  english: Chanakya Neethi - Chapter 6
content:
  english: shrutva dharmam vijanati shrutva tyajati durmatim | shrutva jnanamavapnoti shrutva mokshamavapnuyat
    || || pakshinah kakashcandalah pashunam caiva kukkurah | muninam papashcandalah sarvacandalanindakah
    || || bhasmana shuddhyate kasyam tamramamlena shuddhyati | rajasa shuddhyate nari nadi vegena shuddhyati
    || || bhramansampujyate raja bhramansampujyate dvijah | bhramansampujyate yogi stri bhramanti vinashyati
    || || yasyarthastasya mitrani yasyarthastasya bandhavah | yasyarthah sa puma~lloke yasyarthah sa ca
    panditah || || tadrishi jayate buddhirvyavasayo'pi tadrishah | sahayastadrisha eva yadrishi bhavitavyata
    || || kalah pacati bhutani kalah samharate prajah | kalah supteshu jagarti kalo hi duratikramah ||
    || na pashyati ca janmandhah kamandho naiva pashyati | madonmatta na pashyanti arthi dosham na pashyati
    || || svayam karma karotyatma svayam tatphalamashnute | svayam bhramati samsare svayam tasmadvimucyate
    || || raja rashtrakritam papam rajnah papam purohitah | bharta ca strikritam papam shishyapapam gurustatha
    || || rinakarta pita shatrurmata ca vyabhicarini | bharya rupavati shatruh putrah shatrurapanditah
    || || lubdhamarthena grihniyat stabdhamanjalikarmana | murkham chando'nuvrittya ca yatharthatvena
    panditam || || varam na rajyam na kurajarajyam varam na mitram na kumitramitram | varam na shishyo
    na kushishyashishyo varam na dara na kudaradarah || || kurajarajyena kutah prajasukham kumitramitrena
    kuto'bhinirvritih | kudaradaraishca kuto grihe ratih kushishyashishyamadhyapayatah kuto yashah ||
    || simhadekam bakadekam shiksheccatvari kukkutat | vayasatpanca shikshecca shatshunastrini gardabhat
    || || prabhutam karyamalpam va yannarah kartumicchati | sarvarambhena tatkaryam simhadekam pracakshate
    || || indriyani ca samyamya ragadveshavivarjitah | samaduhkhasukhah shantah tattvajnah sadhurucyate
    || || pratyutthanam ca yuddham ca samvibhagam ca bandhushu | svayamakramya bhuktam ca shiksheccatvari
    kukkutat || || gudhamaithunacaritvam kale kale ca sangraham | apramattamavishvasam panca shikshecca
    vayasat || || bahvashi svalpasantushtah sanidro laghucetanah | svamibhaktashca shurashca shadete shvanato
    gunah || || sushranto'pi vahedbharam shitoshnam na ca pashyati | santushtashcarate nityam trini shikshecca
    gardabhat || || ya etanvimshatigunanacarishyati manavah | karyavasthasu sarvasu ajeyah sa bhavishyati
    ||
  devanagari: श्रुत्वा धर्मं विजानाति श्रुत्वा त्यजति दुर्मतिम् । श्रुत्वा ज्ञानमवाप्नोति श्रुत्वा मोक्षमवाप्नुयात्
    ॥ ॥ पक्षिणः काकश्चण्डालः पशूनां चैव कुक्कुरः । मुनीनां पापश्चण्डालः सर्वचाण्डालनिन्दकः ॥ ॥ भस्मना
    शुद्ध्यते कास्यं ताम्रमम्लेन शुद्ध्यति । रजसा शुद्ध्यते नारी नदी वेगेन शुद्ध्यति ॥ ॥ भ्रमन्सम्पूज्यते
    राजा भ्रमन्सम्पूज्यते द्विजः । भ्रमन्सम्पूज्यते योगी स्त्री भ्रमन्ती विनश्यति ॥ ॥ यस्यार्थास्तस्य
    मित्राणि यस्यार्थास्तस्य बान्धवाः । यस्यार्थाः स पुमाँल्लोके यस्यार्थाः स च पण्डितः ॥ ॥ तादृशी जायते
    बुद्धिर्व्यवसायोऽपि तादृशः । सहायास्तादृशा एव यादृशी भवितव्यता ॥ ॥ कालः पचति भूतानि कालः संहरते प्रजाः
    । कालः सुप्तेषु जागर्ति कालो हि दुरतिक्रमः ॥ ॥ न पश्यति च जन्मान्धः कामान्धो नैव पश्यति । मदोन्मत्ता
    न पश्यन्ति अर्थी दोषं न पश्यति ॥ ॥ स्वयं कर्म करोत्यात्मा स्वयं तत्फलमश्नुते । स्वयं भ्रमति संसारे
    स्वयं तस्माद्विमुच्यते ॥ ॥ राजा राष्ट्रकृतं पापं राज्ञः पापं पुरोहितः । भर्ता च स्त्रीकृतं पापं शिष्यपापं
    गुरुस्तथा ॥ ॥ ऋणकर्ता पिता शत्रुर्माता च व्यभिचारिणी । भार्या रूपवती शत्रुः पुत्रः शत्रुरपण्डितः ॥
    ॥ लुब्धमर्थेन गृह्णीयात् स्तब्धमञ्जलिकर्मणा । मूर्खं छन्दोऽनुवृत्त्या च यथार्थत्वेन पण्डितम् ॥ ॥ वरं
    न राज्यं न कुराजराज्यं वरं न मित्रं न कुमित्रमित्रम् । वरं न शिष्यो न कुशिष्यशिष्यो वरं न दार न कुदरदारः
    ॥ ॥ कुराजराज्येन कुतः प्रजासुखं कुमित्रमित्रेण कुतोऽभिनिर्वृतिः । कुदारदारैश्च कुतो गृहे रतिः कुशिष्यशिष्यमध्यापयतः
    कुतो यशः ॥ ॥ सिंहादेकं बकादेकं शिक्षेच्चत्वारि कुक्कुटात् । वायसात्पञ्च शिक्षेच्च षट्शुनस्त्रीणि गर्दभात्
    ॥ ॥ प्रभूतं कार्यमल्पं वा यन्नरः कर्तुमिच्छति । सर्वारम्भेण तत्कार्यं सिंहादेकं प्रचक्षते ॥ ॥ इन्द्रियाणि
    च संयम्य रागद्वेषविवर्जितः । समदुःखसुखः शान्तः तत्त्वज्ञः साधुरुच्यते ॥ ॥ प्रत्युत्थानं च युद्धं च
    संविभागं च बन्धुषु । स्वयमाक्रम्य भुक्तं च शिक्षेच्चत्वारि कुक्कुटात् ॥ ॥ गूढमैथुनचारित्वं काले काले
    च सङ्ग्रहम् । अप्रमत्तमविश्वासं पञ्च शिक्षेच्च वायसात् ॥ ॥ बह्वाशी स्वल्पसन्तुष्टः सनिद्रो लघुचेतनः
    । स्वामिभक्तश्च शूरश्च षडेते श्वानतो गुणाः ॥ ॥ सुश्रान्तोऽपि वहेद्भारं शीतोष्णं न च पश्यति । सन्तुष्टश्चरते
    नित्यं त्रीणि शिक्षेच्च गर्दभात् ॥ ॥ य एतान्विंशतिगुणानाचरिष्यति मानवः । कार्यावस्थासु सर्वासु अजेयः
    स भविष्यति ॥
