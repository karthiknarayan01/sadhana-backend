id: sri-venkateswara-vajra-kavacha-stotram
category: stotram
name:
  english: Sri Venkateswara Vajra Kavacha Stotram
content:
  english: markandeya uvaca | narayanam parabrahma sarva karanam | prapadye venkateshakhyam tadeva kavacam
    mama || shirsha purusho venkatesha shshiro'vatu | praneshah prana nilayah pranan rakshatu me harih
    || tsutanatha atmanam me sadavatu | devadevottamo payaddeham me venkateshvarah || || sarvatra sarvakaleshu
    mangambaja nirishvarah | palayenmam sada karma saphalyam nah prayacchatu || mabhedyam venkateshituh
    | sayam pratah pathennityam mrityum tarati nirbhayah || kritam shri venkateshvara vajrakavaca stotram
    sampurnam ||
  devanagari: मार्कण्डेय उवाच । नारायणं परब्रह्म सर्व कारणम् । प्रपद्ये वेङ्कटेशाख्यं तदेव कवचं मम ॥ शीर्षा
    पुरुषो वेङ्कटेश श्शिरोऽवतु । प्राणेशः प्राण निलयः प्राणान् रक्षतु मे हरिः ॥ ट्सुतानाथ आत्मानं मे सदावतु
    । देवदेवोत्तमो पायाद्देहं मे वेङ्कटेश्वरः ॥ ॥ सर्वत्र सर्वकालेषु मङ्गाम्बाजा निरीश्वरः । पालयेन्मां
    सदा कर्म साफल्यं नः प्रयच्छतु ॥ मभेद्यं वेङ्कटेशितुः । सायं प्रातः पठेन्नित्यं मृत्युं तरति निर्भयः
    ॥ कृतं श्री वेङ्कटेश्वर वज्रकवच स्तोत्रं सम्पूर्णम् ॥
