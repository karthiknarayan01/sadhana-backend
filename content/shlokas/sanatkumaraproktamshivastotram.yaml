id: sanatkumaraproktamshivastotram
category: stotram
name:
  english: sanatkumaraproktamshivastotram
  devanagari: सनत्कुमारप्रोक्तंशिवस्तोत्रम्
content:
  english: karanayanalaya ganeshaya lokapalaya mahabhujaya mahahastaya shuline mahadamshtrine kalaya maheshvaraya
    avyayaya kalarupine nilagrivaya mahodaraya ganadhyakshaya sarvatmane sarvabhavanaya sarvagaya mrityuhantre
    pariyatrasuvrataya brahmacarine vedantagaya tapo'ntagaya pashupataye vyangaya shulapanaye vrishaketave
    haraye jatine shikhandine lakutine mahayashase bhuteshvaraya guhavasine vinapanavatalabate amaraya
    darshaniyaya balasuryanibhaya shmashanavasine bhagavate umapataye arindamaya bhagasyakshipatine pushnordashananashanaya
    krurakartakaya pashahastaya pralayakalaya ulkamukhayagniketave munaye diptaya vishampataye unnayate
    janakaya caturthakaya lokasattamaya vamadevaya vagdakshinyaya vamato bhikshave bhikshurupine jatine
    svayanjatilaya shakrahastapratistambhakaya vasunam stambhaya kratave kratukaraya kalaya medhavine
    madhukaraya calaya vanaspatyaya vajasaneti samashramapujitaya jagaddhatre jagatkartre purushaya shashvataya
    dhruvaya dharmadhyakshaya trivartmane bhutabhavanaya trinetraya bahurupaya suryayutasamaprabhaya devaya
    sarvaturyaninadine sarvabadhavimocanaya bandhanaya sarvadharine dharmottamaya pushpadantayapi bhagaya
    mukhaya sarvaharaya hiranyashravase dvarine bhimaya bhimaparakramaya onnamo namah | imam mantravaram
    japtva shukro jatharapanjarat | nishkranto lingamargena shambhoshshukramivotkatam || 1|| iti shivapurane
    rudrasamhitayam yuddhakhande ekonapancashattamadhyayantargatam sanatkumaraproktam shivastotram samaptam
    | shivapurana | rudrasamhita | yuddhakhanda | adhyaya 49
  devanagari: करणायानलाय गणेशाय लोकपालाय महाभुजाय महाहस्ताय शूलिने महादंष्ट्रिणे कालाय महेश्वराय अव्ययाय
    कालरूपिणे नीलग्रीवाय महोदराय गणाध्यक्षाय सर्वात्मने सर्वभावनाय सर्वगाय मृत्युहन्त्रे पारियात्रसुव्रताय
    ब्रह्मचारिणे वेदान्तगाय तपोऽन्तगाय पशुपतये व्यङ्गाय शूलपाणये वृषकेतवे हरये जटिने शिखण्डिने लकुटिने
    महायशसे भूतेश्वराय गुहावासिने वीणापणवतालबते अमराय दर्शनीयाय बालसूर्यनिभाय श्मशानवासिने भगवते उमापतये
    अरिन्दमाय भगस्याक्षिपातिने पूष्णोर्दशननाशनाय क्रूरकर्तकाय पाशहस्ताय प्रलयकालाय उल्कामुखायाग्निकेतवे
    मुनये दीप्ताय विशाम्पतये उन्नयते जनकाय चतुर्थकाय लोकसत्तमाय वामदेवाय वाग्दाक्षिण्याय वामतो भिक्षवे
    भिक्षुरूपिणे जटिने स्वयञ्जटिलाय शक्रहस्तप्रतिस्तम्भकाय वसूनां स्तम्भाय क्रतवे क्रतुकराय कालाय मेधाविने
    मधुकराय चलाय वानस्पत्याय वाजसनेति समाश्रमपूजिताय जगद्धात्रे जगत्कर्त्रे पुरुषाय शाश्वताय ध्रुवाय धर्माध्यक्षाय
    त्रिवर्त्मने भूतभावनाय त्रिनेत्राय बहुरूपाय सूर्यायुतसमप्रभाय देवाय सर्वतूर्यनिनादिने सर्वबाधाविमोचनाय
    बन्धनाय सर्वधारिणे धर्मोत्तमाय पुष्पदन्तायापि भागाय मुखाय सर्वहराय हिरण्यश्रवसे द्वारिणे भीमाय भीमपराक्रमाय
    ओन्नमो नमः । इमं मन्त्रवरं जप्त्वा शुक्रो जठरपञ्जरात् । निष्क्रान्तो लिङ्गमार्गेण शम्भोश्शुक्रमिवोत्कटम्
    ॥ १॥ इति शिवपुराणे रुद्रसंहितायां युद्धखण्डे एकोनपञ्चाशत्तमाध्यायान्तर्गतं सनत्कुमारप्रोक्तं शिवस्तोत्रं
    समाप्तम् । शिवपुराण । रुद्रसंहिता । युद्धखण्ड । अध्याय ४९
