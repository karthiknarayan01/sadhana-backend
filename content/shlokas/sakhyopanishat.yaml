id: sakhyopanishat
category: upanishad
name:
  english: sakhyopanishat
  devanagari: सख्योपनिषत्
content:
  english: ringaro bahu || 8|| sakhyatma || 9|| sakhyarasajjayante paravyuhavibhavantaryyamyarcavatarah
    | sakhyarasanmahavishnurjayate | sakhyarasanmahabrahma jayate | sakhyarasanmaharudro jayate | sakhyarasatparamatma
    jayate | sakhyarasanmahalakshmirjayate | sakhyarasanmahamayajayate | sakhyarasadadyashaktirjayate
    | sakhyarasatsakha jayate | sakhyarasadvasudevo jayate | sakhyarasatkshirashayi jayate | sakhyarasatsarveshvarah
    jayante | sadhyarasatsarve'vatarah jayante | sakhyarasannrisimho jayate | sakhyarasadvaraho jayate
    | sakhyarasanmatsyakacchapau jayete | sakhyarasatkalkibauddhau jayete | sakhyarasadvamano jayate |
    sakhyarasatparashuramo jayate | sakhyarasacchrikrishno jayate | sakhyarasadbalaramo jayate | sakhyarasadvishnurjayate
    | sakhyarasanmahadevo jayate | sakhyarasadbrahma jayate | sakhyarasanmahendro jayate | sakhyarasadindro
    jayate | sakhyarasatsarvedevah jayante | sakhyarasatsarvah shaktayo jayante | sakhyarasacchesho jayate
    | sakhyarasadganesho jayate | sakhyarasadvaruno jayate | sakhyarasatsomo jayate | sakhyarasadagnirjayate
    | sakhyarasatsuryo jayate | sakhyarasadyamo jayate | sakhyarasatkalpavriksho jayate | sakhyarasatkamo
    jayate sakhyarasatkamadhenurjayate | sakhyarasaddhanado jayate | sakhyarasatsarvemarutah jayante |
    sakhyarasatsarve gandharvah jayante | sakhyarasatsarvevidyadharah jayante | sakhyarasatsarvevedah
    jayante | sakhyarasatsarvopanishado jayante | sakhyarasatsarvemantrah jayante | sakhyarasatsarvesiddhah
    jayante | sakhyarasatpanca mahabhutani jayante | sakhyarasatsarve jadacetanahjayante | ato brahmavitsarvam
    stripunnapumsakatmakam vishvam sakhyatmakam pashyati | yasmaditarannakinciditi | nityabhedam | nityo'bhedo
    | nityo'bhedo | nityo'bhedo vivecaniyobrahmavidbhih | om purnamadah purnamidam purnatpurnamudacyate
    | purnasya purnamadaya purnamevavashishyate || ityatharvanavediya pippaliya shakhayam sakhyopanishat
    samapta |
  devanagari: ृङ्गारो बाहू ॥ ८॥ सख्यात्मा ॥ ९॥ सख्यरसाज्जायन्ते परव्यूहविभवान्तर्य्याम्यर्चावताराः । सख्यरसान्महाविष्णुर्जायते
    । सख्यरसान्महाब्रह्मा जायते । सख्यरसान्महारुद्रो जायते । सख्यरसात्परमात्मा जायते । सख्यरसान्महालक्ष्मीर्जायते
    । सख्यरसान्महामायाजायते । सख्यरसादाद्याशक्तिर्जायते । सख्यरसात्सखा जायते । सख्यरसाद्वासुदेवो जायते
    । सख्यरसात्क्षीरशायी जायते । सख्यरसात्सर्वेश्वराः जायन्ते । सध्यरसात्सर्वेऽवताराः जायन्ते । सख्यरसान्नृसिंहो
    जायते । सख्यरसाद्वराहो जायते । सख्यरसान्मत्स्यकच्छपौ जायेते । सख्यरसात्कल्किबौद्धौ जायेते । सख्यरसाद्वामनो
    जायते । सख्यरसात्परशुरामो जायते । सख्यरसाच्छ्रीकृष्णो जायते । सख्यरसाद्बलरामो जायते । सख्यरसाद्विष्णुर्जायते
    । सख्यरसान्महादेवो जायते । सख्यरसाद्ब्रह्मा जायते । सख्यरसान्महेन्द्रो जायते । सख्यरसादिन्द्रो जायते
    । सख्यरसात्सर्वेदेवाः जायन्ते । सख्यरसात्सर्वाः शक्तयो जायन्ते । सख्यरसाच्छेषो जायते । सख्यरसाद्गणेशो
    जायते । सख्यरसाद्वरुणो जायते । सख्यरसात्सोमो जायते । सख्यरसादग्निर्जायते । सख्यरसात्सूर्यो जायते ।
    सख्यरसाद्यमो जायते । सख्यरसात्कल्पवृक्षो जायते । सख्यरसात्कामो जायते सख्यरसात्कामधेनुर्जायते । सख्यरसाद्धनदो
    जायते । सख्यरसात्सर्वेमरूताः जायन्ते । सख्यरसात्सर्वे गन्धर्वाः जायन्ते । सख्यरसात्सर्वेविद्याधराः
    जायन्ते । सख्यरसात्सर्वेवेदाः जायन्ते । सख्यरसात्सर्वोपनिषदो जायन्ते । सख्यरसात्सर्वेमन्त्राः जायन्ते
    । सख्यरसात्सर्वेसिद्धाः जायन्ते । सख्यरसात्पञ्च महाभूतानि जायन्ते । सख्यरसात्सर्वे जडचेतनाःजायन्ते
    । अतो ब्रह्मवित्सर्वं स्त्रीपुन्नपुंसकात्मकं विश्वं सख्यात्मकं पश्यति । यस्मादितरन्नकिञ्चिदिति । नित्यभेदम्
    । नित्योऽभेदो । नित्योऽभेदो । नित्योऽभेदो विवेचनीयोब्रह्मविद्भिः । ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते
    । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥ इत्यथर्वणवेदीय पिप्पलीय शाखायां सख्योपनिषत् समाप्ता ।
