id: hayagrivastotramvyakhyanam
category: stotram
name:
  english: hayagrivastotramvyakhyanam
  devanagari: हयग्रीवस्तोत्रम्व्याख्यानम्
content:
  english: mashishi lij| manasi hayagivavirbhave amrita kalpatatkiranajalairmanogata sakala santapa nivrittirme
    bhavedityashayah | vagarthasiddhihetoh pathata hayagrivasamstutim bhaktya | kavitarkikakesarina venkatanathena
    viracitametam || 33|| iti kavitarkika simhasya sarvatantra svatantrasya shrimadvenkatanathasya vedantacaryasya
    kritishu shrihayagrivastotram sampurnam | kavitarkikasimhaya kalyanagunashaline | shrimate venkateshaya
    vedantagurave namah || shrimate nigamanta mahadeshikaya namah | svagranthasya vishvasaniyatvaya svanama
    prakatayan svakritastotrasya phalama pyaha
  devanagari: माशिषि लिज्। मनसि हयगीवाविर्भावे अमृत कल्पतत्किरणजालैर्मनोगत सकल सन्ताप निवृत्तिर्मे भवेदित्याशयः
    । वागर्थसिद्धिहेतोः पठत हयग्रीवसंस्तुतिं भक्त्या । कवितार्किककेसरिणा वेङ्कटनाथेन विरचितामेताम् ॥ ३३॥
    इति कवितार्किक सिंहस्य सर्वतन्त्र स्वतन्त्रस्य श्रीमद्वेङ्कटनाथस्य वेदान्ताचार्यस्य कृतिषु श्रीहयग्रीवस्तोत्रं
    सम्पूर्णम् । कवितार्किकसिंहाय कल्याणगुणशालिने । श्रीमते वेङ्कटेशाय वेदान्तगुरवे नमः ॥ श्रीमते निगमान्त
    महादेशिकाय नमः । स्वग्रन्थस्य विश्वसनीयत्वाय स्वनाम प्रकटयन् स्वकृतस्तोत्रस्य फलम प्याह
meaning: {}
