id: gangastotram-10
category: stotram
name:
  english: gangastotram 10
  devanagari: गन्गास्तोत्रम् १०
content:
  english: gangastotram 10 shvetacampakavarnabham gangam papapranashinim | krishnavigrahasambhutam krishnatulyam
    param satim || 97|| vahnishuddhamshukadhanam ratnabhushanabhushitam | sharatpurnendushatakaprabhajushtakalevaram
    || 98|| ishaddhasaprasannasyam shashvatsusthirayauvanam | narayanapriyam shantam satsaubhagyasamanvitam
    || 99|| bibhratim kabaribharam malatimalyasamyutam | sindurabindulalitam sarddham candanabindubhih
    || 100|| kasturipatrakam gande nanacitrasamanvitam | pakvabimbasamanaikacarvoshthaputamuttamam ||
    101|| muktapanktiprabhajushtadantapanktimanoharam | sucaruvakranayanam sakatakshamanoramam || 102||
    kathinam shriphalakaram stanayugmam ca bibhratim | brihacchronim sukathinam rambhastambhaparishkritam
    || 103|| sthalapadmaprabhajushtapadapadmayugandharam | ratnabharanasamyuktam kunkumaktam sayavakam
    || 104|| devendramaulimandaramakarandakanarunam | surasiddhamunindradidattarghyaissamyutam sada ||
    105|| tapasvimaulinikarabhramarashrenisamyutam | muktipradam mumukshunam kaminam svargabhogadam ||
    106|| varam varenyam varadam bhaktanugrahakataram | shrivishnoh padadatrim ca bhaje vishnupadim satim
    || 107|| iti brahmavaivartapurane prakritikhande dashamadhyayantargatam gangastotram samaptam | brahmavaivartapurana
    | prakritikhanda | adhyaya 10
  devanagari: गङ्गास्तोत्रम् १० श्वेतचम्पकवर्णाभां गङ्गां पापप्रणाशिनीम् । कृष्णविग्रहसम्भूतां कृष्णतुल्यां
    परां सतीम् ॥ ९७॥ वह्निशुद्धांशुकाधानां रत्नभूषणभूषिताम् । शरत्पूर्णेन्दुशतकप्रभाजुष्टकलेवराम् ॥ ९८॥
    ईषद्धासप्रसन्नास्यां शश्वत्सुस्थिरयौवनाम् । नारायणप्रियां शान्तां सत्सौभाग्यसमन्विताम् ॥ ९९॥ बिभ्रतीं
    कबरीभारं मालतीमाल्यसंयुताम् । सिन्दूरबिन्दुललितां सार्द्धं चन्दनबिन्दुभिः ॥ १००॥ कस्तूरीपत्रकं गण्डे
    नानाचित्रसमन्वितम् । पक्वबिम्बसमानैकचार्वोष्ठपुटमुत्तमम् ॥ १०१॥ मुक्तापङ्क्तिप्रभाजुष्टदन्तपङ्क्तिमनोहराम्
    । सुचारुवक्रनयनां सकटाक्षमनोरमाम् ॥ १०२॥ कठिनं श्रीफलाकारं स्तनयुग्मं च बिभ्रतीम् । बृहच्छ्रोणीं सुकठिनां
    रम्भास्तम्भपरिष्कृताम् ॥ १०३॥ स्थलपद्मप्रभाजुष्टपादपद्मयुगन्धराम् । रत्नाभरणसंयुक्तं कुङ्कुमाक्तं
    सयावकम् ॥ १०४॥ देवेन्द्रमौलिमन्दारमकरन्दकणारुणम् । सुरसिद्धमुनीन्द्रादिदत्तार्घ्यैस्संयुतं सदा ॥ १०५॥
    तपस्विमौलिनिकरभ्रमरश्रेणिसंयुतम् । मुक्तिप्रदं मुमुक्षूणां कामिनां स्वर्गभोगदम् ॥ १०६॥ वरां वरेण्यां
    वरदां भक्तानुग्रहकातराम् । श्रीविष्णोः पददात्रीं च भजे विष्णुपदीं सतीम् ॥ १०७॥ इति ब्रह्मवैवर्तपुराणे
    प्रकृतिखण्डे दशमाध्यायान्तर्गतं गङ्गास्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । प्रकृतिखण्ड । अध्याय
    १०
