id: agastyakritam02shivastotram
category: stotram
name:
  english: agastyakritam02shivastotram
  devanagari: अगस्त्यकृतं०२शिवस्तोत्रम्
content:
  english: kaladharam bhavam bhaktabhayapaham | parvatisahitam bhavyam putarjunamupasmahe || 86|| mokshasthanam
    mumukshunam bhogasthanam tu bhoginam | umadehardhashambhum tam putarjunamupasmahe || 87|| ravinduvahninayanam
    ramaramanavanditam | karpuragauram purusham putarjunamupasmahe || 88|| pramanam pranavarthanam kantam
    kantardhavigraham | ravikotipratikasham putarjunamupasmahe || 89|| shankhakundendusankasham karpurodaravigraham
    | kandalatkarunamurtam putarjunamupasmahe || 90|| namashshivayamalavigrahaya natabhilashaikasuradrumaya
    | navendravrishodaravahanaya namo namashcandravibhushanaya || 91|| iti stutva mahadevam bhaktipranataya
    gira | papata padayoh shambhordandavat kumbhasambhavah || 92|| tavallingat samuttasthau ardhanarishvarashshivah
    | iti tamraparnimahatmye saptadashadhyayantargatam agastyakritam shivastotram sampurnam | tamraparnimahatmya
    | adhyaya 17
  devanagari: कलाधरं भवं भक्तभयापहम् । पार्वतीसहितं भव्यं पुटार्जुनमुपास्महे ॥ ८६॥ मोक्षस्थानं मुमुक्षूणां
    भोगस्थानं तु भोगिनम् । उमादेहार्धशम्भुं तं पुटार्जुनमुपास्महे ॥ ८७॥ रवीन्दुवह्निनयनं रामारमणवन्दितम्
    । कर्पूरगौरं पुरुषं पुटार्जुनमुपास्महे ॥ ८८॥ प्रमाणं प्रणवार्थानां कान्तं कान्तार्धविग्रहम् । रविकोटीप्रतीकाशं
    पुटार्जुनमुपास्महे ॥ ८९॥ शङ्खकुन्देन्दुसङ्काशं कर्पूरोदारविग्रहम् । कन्दलत्करुणामूर्तं पुटार्जुनमुपास्महे
    ॥ ९०॥ नमश्शिवायामलविग्रहाय नताभिलाषैकसुरद्रुमाय । नवेन्द्रवृषोदरवाहनाय नमो नमश्चन्द्रविभूषणाय ॥ ९१॥
    इति स्तुत्वा महादेवं भक्तिप्रणतया गिरा । पपात पादयोः शम्भोर्दण्डवत् कुम्भसम्भवः ॥ ९२॥ तावल्लिङ्गात्
    समुत्तस्थौ अर्धनारीश्वरश्शिवः । इति ताम्रपर्णीमाहात्म्ये सप्तदशाध्यायान्तर्गतं अगस्त्यकृतं शिवस्तोत्रं
    सम्पूर्णम् । ताम्रपर्णीमाहात्म्य । अध्याय १७
meaning: {}
