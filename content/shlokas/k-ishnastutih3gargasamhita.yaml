id: k-ishnastutih3gargasamhita
category: stotram
name:
  english: kṟishnastutih3gargasamhita
  devanagari: क्ऱिष्णस्तुतिः३गर्गसम्हिता
content:
  english: tvam devadevah parameshvarah prabhuh purnah puranah purushottamottamah | paratparastvam prakriteh
    paro harirmam pahi pahi dyupate jagatpate || 2|| dashavataro bhagavamstvameva rirakshaya dharmagavam
    shruteshca | adyaiva jatah paripurnadevah kamsadi daityendravinashanaya || 3|| tvanmayaya mohitacittavrittim
    madoddhatam helanabhajanam mam | piteva putram dyupate kshamasva prasida devesha jagannivasa || 4||
    onnamo govardhanoddharanaya govindaya gokulanivasaya gopalaya gopalapataye gopijanabhartre girigajoddhartre
    karunanidhaye jagadvidhaye jaganmangalaya jagannivasaya jaganmohanaya kotimanmathamanmathaya vrishabhanusutavaraya
    shrinandarajakulapradipaya shrikrishnaya paripurnatamaya te'sankhyabrahmandapataye golokadhamadhishanadhipataye
    svayambhagavate sabalaya namaste namaste || 5|| shrinarada uvaca
  devanagari: त्वं देवदेवः परमेश्वरः प्रभुः पूर्णः पुराणः पुरुषोत्तमोत्तमः । परात्परस्त्वं प्रकृतेः परो
    हरिर्मां पाहि पाहि द्युपते जगत्पते ॥ २॥ दशावतारो भगवांस्त्वमेव रिरक्षया धर्मगवां श्रुतेश्च । अद्यैव
    जातः परिपूर्णदेवः कंसादि दैत्येन्द्रविनाशनाय ॥ ३॥ त्वन्मायया मोहितचित्तवृत्तिं मदोद्धतं हेलनभाजनं
    माम् । पितेव पुत्रं द्युपते क्षमस्व प्रसीद देवेश जगन्निवास ॥ ४॥ ओन्नमो गोवर्धनोद्धरणाय गोविन्दाय गोकुलनिवासाय
    गोपालाय गोपालपतये गोपीजनभर्त्रे गिरिगजोद्धर्त्रे करुणानिधये जगद्विधये जगन्मङ्गलाय जगन्निवासाय जगन्मोहनाय
    कोटिमन्मथमन्मथाय वृषभानुसुतावराय श्रीनन्दराजकुलप्रदीपाय श्रीकृष्णाय परिपूर्णतमाय तेऽसङ्ख्यब्रह्माण्डपतये
    गोलोकधामधिषणाधिपतये स्वयम्भगवते सबलाय नमस्ते नमस्ते ॥ ५॥ श्रीनारद उवाच
