id: kumaropanishat
category: upanishad
name:
  english: kumaropanishat
  devanagari: कुमारोपनिषत्
content:
  english: om shriganeshaya namah || ambhodhimadhye ravikotyanekaprabham dadatyashritajivamadhye | om
    hamsah tasmai kumaraya namo'stu || 1|| virajayogasya phalena sakshyam dadati namah kumaraya tasmai
    | om hamsah tasmai kumaraya namo'stu || 2|| yo'titakale svamatat grihitva shrutim karotyanyajivan
    svakale | om hamsah tasmai kumaraya namo'stu || 3|| yasyamshca jivena samprapnuvanti dvibhagajivashca
    samaikakale | om hamsah tasmai kumaraya namo'stu || 4|| pracodayannada hridisthitena mantranyajivam
    prakatikaroti | om hamsah tasmai kumaraya namo'stu || 5|| bandhavyakallola hridvari dure vimanamakarkasya
    ca yah karoti | om hamsah tasmai kumaraya namo'stu || 6|| saddikshaya shastrashabdasmritirhridvatamshca
    chinnadanubhudirupam | om hamsah tasmai kumaraya namo'stu || 7|| dikshavidhijnanacaturvidhanya pracodayanmantradaivadvarasya
    | om hamsah tasmai kumaraya namo'stu || 8|| kotyadbhute saptabhireva mantraih hatva shukam kashcidayasya
    padam | om hamsah tasmai kumaraya namo'stu || 9|| svasvadhikaramshca vimuktadevah shirshena samyogayedyasya
    padam | om hamsah tasmai kumaraya namo'stu || 10|| hunkarashabdena srishtibhavam jivasya dattam svaravena
    yena | om hamsah tasmai kumaraya namo'stu || 11|| virajapatrastha kumarabhutim yo bhaktahastena samsvikaroti
    | svasarbhuvah samavaptipurnah bhaveddhi samyati tam dirghamayuh || etadrishanugrahabhasitaya sakalyakolaya
    vai shanmukhaya om hamsah tasmai kumaraya namo'stu || 12|| om shri subrahmanyaya namah ||
  devanagari: ॐ श्रीगणेशाय नमः ॥ अम्भोधिमध्ये रविकोट्यनेकप्रभां ददात्याश्रितजीवमध्ये । ॐ हंसः तस्मै कुमाराय
    नमोऽस्तु ॥ १॥ विराजयोगस्य फलेन साक्ष्यं ददाति नमः कुमाराय तस्मै । ॐ हंसः तस्मै कुमाराय नमोऽस्तु ॥
    २॥ योऽतीतकाले स्वमतात् गृहीत्वा श्रुतिं करोत्यन्यजीवान् स्वकाले । ॐ हंसः तस्मै कुमाराय नमोऽस्तु ॥
    ३॥ यस्यांश्च जीवेन सम्प्राप्नुवन्ति द्विभागजीवाश्च समैककाले । ॐ हंसः तस्मै कुमाराय नमोऽस्तु ॥ ४॥ प्रचोदयान्नाद
    हृदिस्थितेन मन्त्राण्यजीवं प्रकटीकरोति । ॐ हंसः तस्मै कुमाराय नमोऽस्तु ॥ ५॥ बान्धव्यकल्लोल हृद्वारि
    दूरे विमानमकार्कस्य च यः करोति । ॐ हंसः तस्मै कुमाराय नमोऽस्तु ॥ ६॥ सद्दीक्षया शास्त्रशब्दस्मृतिर्हृद्वाताम्श्च
    छिन्नादनुभूदिरूपम् । ॐ हंसः तस्मै कुमाराय नमोऽस्तु ॥ ७॥ दीक्षाविधिज्ञानचतुर्विधान्य प्रचोदयान्मन्त्रदैवाद्वरस्य
    । ॐ हंसः तस्मै कुमाराय नमोऽस्तु ॥ ८॥ कोट्यद्भुते सप्तभिरेव मन्त्रैः हत्वा शुकं कश्चिदयस्य पादम् ।
    ॐ हंसः तस्मै कुमाराय नमोऽस्तु ॥ ९॥ स्वस्वाधिकारांश्च विमुक्तदेवाः शीर्षेण संयोगयेद्यस्य पादम् । ॐ
    हंसः तस्मै कुमाराय नमोऽस्तु ॥ १०॥ हुङ्कारशब्देन सृष्टिभावं जीवस्य दत्तं स्वरवेण येन । ॐ हंसः तस्मै
    कुमाराय नमोऽस्तु ॥ ११॥ वीराजपत्रस्थ कुमारभूतिं यो भक्तहस्तेन संस्वीकरोति । स्वसर्भुवः समवाप्तिपूर्णः
    भवेद्धि संयाति तं दीर्घमायुः ॥ एतादृशानुग्रहभासिताय साकल्यकोलाय वै षण्मुखाय ॐ हंसः तस्मै कुमाराय नमोऽस्तु
    ॥ १२॥ ॐ श्री सुब्रह्मण्याय नमः ॥
