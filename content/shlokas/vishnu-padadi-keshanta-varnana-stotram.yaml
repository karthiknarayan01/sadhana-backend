    samaya nrityatkalavyaladvayam va | vashabda ivarthah | samaya vishnupadadikeshantavarnanastotram |
    shabdo naikatyavaci | balikashabdah shankasdhnoruparibhrulatapucchadeshavacakah kapolapranta gatagrakuntalapunjavisheshavacako
    va | sa balikasarpamatritvenotprekshita | kimbhute lala tarange | rajanikaratanoshcandramandalasyardhakhandavadardhabhagavadavadate
    nirmale || rukshasmarekshucapacyutasharanikarakshinalakshmikataksha protphullatpadmamalavilasitamahitasphatikeshanalingam
    | bhuyadbhuyo vibhutyai mama bhuvanapaterbhrulatadvandvamadhya duttham tatpundramurdhva janimaranatamahkhandanam
    mandanam ca || 43 || bhuvanapaterbhagavatastadurdhvam pundum tilakam mama bhuyo vibhutya adhikaishvaryaya
    bhuyat | kim lakshanam | janimaranatamahkhandanam | janmamaranakaranajnanarupatamonashakamityarthah
    | bhrulatadvandvamadhyaduttham svayamevodbhutam sphatikeshanalingam sphatikamanimayashivalingamiva
    | rukshah kuro yah smarekshucapatkamasambandhikshukodandaccyutah sharanikarastena kshinam krishame
    vamvidham tat lakshmikatakshetyadi ceti karmadharayah | lakshmikataksha eva protphulladvi kasatpadanam
    mala taya vilasitamujjrimbhitam mahitam mahattvam yasya tacca tatsphatike shanalingam ca || pithibhutalakante
    kritamukutamahadevalingapratishthe lalate natyarange vikatataratate kaitabhareshciraya | prodhdatyaivatmatandriprakatapatakutim
    prasphurantim sphutangam patviyam bhavanakhyam catulamati nati natikam natayennah || 44 || kaitabharerbhagavato
    lalatameva lalatam tasminnatyarange no'tmakamiyam khabhavasiddha catula capala matireva nati nartaki
    bhavanakhyam bhavananamnim natikam khakanyam ciraya dirghakalam natayennartayet | asmanmatirbhagavallalate
    dhyanatmikam vrittim nairantaryena pravartayedityarthah | kimlakshana | patvi catura| kim kritva |
    atmatandri khalasyam tadrupam prakatapatakutim prasiddhavaranapatam proddhatya | alasyarupanibidatiraskarinimapasaryetyarthah
    | kimlakshanam natikam | sphutangam prasphurantim | kathambhute natyarange | pithibhutah pithatam
    gato yo'lakantah keshodgamaprantadesho lalatoparirekha tatra krita mukutalakshanamaha devalingasya
    pratishtha yasmin | tatha vikatataratate'tishayena vishalatate || malalivalidhamnah kuvalayakalita
    shripateh kuntalali kalindyaruhya murghno galati harashirahkhardhunispardhaya nu | rahurva yati vakram
    sakalashashikalabhrantilolantaratma lokairalocyate ya pradishatu sakalaih sakhilam mangalam nah ||
    45 || kavyamala| alivacchyamalam ghama tejo yasya tasya shripateh sa kuntalali no'smakamakhilam mangalam
    pradishatu | ya sakalairlokah kuvalayakalita nilotpalaracita malali mala parampareva | athava kalindi
    yamuna harashirahkhardhunispardhaya mahadevamastakasthagangeyaya bhagavanmurdhanamaruhya tato galati
    nu | yadva sakala casau shashikala shashiprakasha stadakarabhrantiyuktashcasau lolashcapalo'ntaratma
    mano yasyaitadrisho rahurvetyalocyata utprekshyate || suptakarah prasupte bhagavati vibudhairapyadrishtavarupa
    vyaptavyomantaralastaralarucijalaranjitah spashtabhasah | dehacchayodgamabha ripuvapuraguruplosharoshagnidhumyah
    keshah keshidvisho no vidadhatu vipulakleshapashapranasham || 46|| keshidvishah keshinamakasurahanturbhagavatah
    kesha no'smakam vipula bahula ye klaisha avidyasmitaragadveshabhiniveshastra eva pashastesham prakarshena
    nasham vidadhatu | kimlakshanah| bhagavati prasupte suptakarah suptasya bhagavata akara ivakaro yesham
    te | ata eva vibudhai rapi na drishtam svarupam yesham te tathavidhah | tatha vyaptam vyomantaralam
    brahmandodaram yaih| tatha taralani capalani rucimantyujjvalani ca jalani kshirasagaranirani tairasama
    ntadranjitah | spashtabhasah | dehasya shrimanmurteshchaya kantistasya udgama uparipra carastadvadabhanti
    te | ripunam vapumshyevagurustasya plosho dahastasminarosharupo yo'gnistasya dhumya dhumasamuha iva
    | etairvisheshanaih keshanam meghasamyam dhvaninam | iti puranaprasiddhya || yatra pratyuptaratnamavaraparilasadbhurirocihpratana
    sphurtya murtirmuraredyumanishatacitavyomavahunimrikshya | kurvatparepayodhi jvaladakritamahabhakhadaurvagnishankam
    shashvannah sharma dishyatkalikalushatamahpatanam tatkiritam || 47 || tanmurareh kiritam no'smakam
    shashvacchama dishyat | kathambhutam | kalikallushatamah patanam | parepayodhi samudramadhye jvalannakritrimo
    mahanpraudho bhakhanprakashabahulashca ya aurvagnirvadhavanalastasya shankam kurvat yatra kirite pratyuptanam
    khacitanamrtnapravaranam parito lasadbhuryadhika yocisyano vistarastasya sphurtya sphuranena murarermurtirdyu
    manishatacitavyomavadyugapaduditanekasuryavyaptakashavaddurnirikshya dushprekshya tat || bhrantva
    bhrantva yadantastribhuvanagururapyabdakotiraneka gantum nantam samartho bhramara iva punarnabhinalikanalat
    | vishnupadadikeshantavarnanastotram | unmajjannurjitashristribhuvanamaparam nirmame tatsadriksham
    dehambhodhih sa deyannirava ghiramritam daityavidveshino nah ||48|| daityavidveshino narayanasya sa
    dehambhodhirno'smabhyamamritam kaivalyam deyat | tribhuva nagurustrailokyapita brahmapi yadantarmadhye'neka
    asamkhyata abdakotih | anekakotisam vatsaraparyantamityarthah | bhranva bhranta bahusho vibhramyantamavasanam
    gantum praptum na sama rtho'bhudityadhyaharah | punarantapraptyashavicchedanantaram nabhinalikanalamara
    ivonma jjannaparam tribhuvanam tatsadaksham nirmame | kimlakshanah | urjitashrih | kathambhuto nehambhodhih
    | niravadhih|| matsyah kurmo varaho naraharinapatimino jamadagnya kakutsthah kamsaghati manasijavijayi
    yashca kalki bhavishyan | vishnoramshavatara bhuvanahitakara dharmasamsthapanarthah payasurmam ta
    ete gurutarakarunabharakhinnashaya ye ||49|| harinapatih simhah | narashcasau harinapatishceti vigrahannarasimhah
    | kamsaghati krishnah | manasijavijayi marajittapakhivesho bhagavanbuddhah | bhavishyankaliyugante
    | anyatsphu tam | vishnorerte'shavatarah | bhuvanahitakarah| yato dharmasamsthapanarthah | tatha guruta
    rena karunabharena khinnah khedam praptah | paravashikrita ityarthah | ashayo'ntahkaranam yesham te
    mam bhaktam payasuh|| yasmadvaco nivrittah samamapi manasa lakshanamikshamanah kharthalabhatpararthavyapagamakathanashlaghino
    vedavadah | nityanandam khasamviniravadhimamritam khantasamkrantabimba cchayapattyapi nityam sukhayati
    yamino yattadavyanmaho nah ||50|| tanmahastejo no'smansadavyat | yatmanmanasa samam vaco'pi nivrittah
    | tadi dameveti bodhayitumasamarthah | kimlakshanah | lakshana mukhyavrittervrittyantaram tamikshamana
    akankshamanah | kasmat | vedalakshanavadah kharthasya shaktivishayasyarthasyalabhatpare ca te'rthastesham
    vyapagamo nirasanam tatkathanena shlagha yesham te | kimlakshanam mahah | nityanandam | khasamvitkhayam
    prakashakam | tatha niravadhim niravadhikam | kakaro'tra lupto ishtavyah | amritamaparinami | kutasthamityarthah
    | api ca yanmahah khantamantahkaranam tatra samkranta bimbacchaya bimbakritistadapattyapi tavanmanapradhyapi
    yamino yatinnityam sukhaya tyanandayati || a padada ca shirshno vapuridamanagham vaishnavam yah khacitte
    dhatte nityam nirastakhilakalikalushe samtatantahpramodah | kavyamala| juhvajjihvakrishanau haricaritahavih
    stotramantranupathe statpadambhoruhabhyam satatamapi namaskurmahe nirmalabhyam || 51 || a padatpadamarabhya
    shirahparyantamidam purvavarnitam vaishnavam vapurvishnu svarupam ye nirastakhilakalikalushe khacitte
    samtatantahpramoda anandabharitantahkaranah san nityam dhatte nirmalabhyam tatpadambhoruhabhyamapi
    vayam namaskurmahe | kim kurvan | stotramantranupathairjihvakrishanau jihvarupe'gnau haricaritahavih
    satatam juhvat | haricari tani tatstotrani ca sada pathannityarthah | iti bhagavatpadashrishamkaracaryakritam
    vishnupadadikeshantavarnanastotram satippanam samaptam |
  devanagari: विष्णुपादादिकेशान्तवर्णनस्तोत्रम् शङ्कराचार्यः १९३२ विष्णुपादादिकेशान्तवर्णनस्तोत्रम् शङ्कराचार्यः
    १९३२ काव्यमाला । भगवत्पादश्रीशंकराचार्यकृतं विष्णुपादादिकेशान्तवर्णनस्तोत्रम् । टिप्पणसहितम् । लक्ष्मीभर्तुर्भुजाग्रे
    कृतवसति सितं यस्य रूपं विशालं नीलाद्रेस्तुङ्गशृङ्गस्थितमिव रजनीनाथबिम्बं विभाति । पायान्नः पाञ्चजन्यः
    स सकुलदितिजत्रासनैः पूरयन्स्वै र्निध्वानैर्नीरदौघध्वनिपरिभवदैरम्बरं कम्बुराजः ॥ १ ॥ स पाञ्चजन्यो नाम
    कम्बुराजः शङ्खश्रेष्ठो नोऽस्मान्पायात् । किंविशिष्टः । स्वैर्निर्ध्वानैर्नितरां ध्वानैरम्बरं नभः पूरयन्
    । नीरदा मेघास्तेषामोघोऽविच्छिन्नस्तोमस्तस्य ध्वनीनां गर्जितशब्दानां परिभवमभिभवं ददतीत्येवंविधैरित्यर्थः
    । मेघौघशङ्खयोर्युगपद्ध्वनतोः श्रुतिमतां शङ्खशब्द एव श्रुतिगोचरो न मेघौघशब्द इति मेघध्वनयः शङ्खध्वनिभिरभिभूयन्त
    इत्युच्यते । एतेन विशेषणेन निर्ध्वानैरित्यत्र निरुपसर्गद्योतितोऽतिशयः साधितः । कुलैः सह वर्तमानाः
    सकुलास्ते च ते दितिजा दैत्यास्तांस्त्रासयन्तीति तैः । यस्य कम्बुराजस्य रूपं लक्ष्मीभर्तुः श्रीकान्तस्य
    भुजाग्रे । वामोर्ध्वकर इति यावत् । कृता वसतिर्येन रूपेण तत् । सितं शुभ्रम् । विशालं महत् । उत्प्रेक्षते
    नीलाद्रिरिन्द्रनीलमणिपर्वतस्तस्य यत्तुङ्गमुन्नतं शृङ्गं शिखरं तत्र स्थितं रजनीनाथस्य चन्द्रमसो बिम्बं
    मण्डलमिव । इन्द्रनीलगिरिरिव भगवन्मूर्तिस्तच्छृङ्गवत्करस्तत्रस्थचन्द्रमण्डलवच्छङ्ख इति योज्यम् ॥ आहुर्यस्य
    स्वरूपं क्षणमुखमखिलं सूरयः कालमेतं ध्वान्तस्यैकान्तमन्तं यदपि च परमं सर्वघाम्नां च धाम । १ बहवो ग्रन्थाः
    स्तोत्राणि च शंकराचार्यकृतित्वेन प्रसिद्धानि समुपलभ्यन्ते तानि सर्वाण्यपि प्रधानशंकराचार्यकृतानीति
    न मन्तव्यम् किं तु तत्सिंहासनाधिरूढैरधुनापि शंकराचार्यपदप्रसिद्धैतच्छिष्यप्रशिष्यैरपि बहूनि विरचितानीति
    ज्ञेयम् एतद्विष्णुपादादिकेशान्तवर्णनस्तोत्रं तु प्रधानशंकराचार्यकृतमेव भाति यतो माधवीयशंकरविजये चतुर्दशे
    सर्गे मुमूर्षुस्वजननीप्रेरणया शंकराचार्यैर्विष्णुस्वरूपवर्णनमकारि इत्यादिका कथा वर्तते सा च विष्णुस्तुतिरियमेवेति
    बहूनां मतम् प्रधानशंकराचार्यास्तु ख्रिस्तसंवत्सरीयाष्टमशतकसमाप्तौ प्रादुर्बभूवुरित्यार्यविद्यासुधाकरधृतशंकरमन्दारसौरभादिवचनेभ्योऽवसीयते
    षष्ठशतकोत्तरभागे सप्तमशतकपूर्वभागे वा शंकराचार्यस्थितिरासीदिति नव्यविदुषां मतम् एतदेव युचियुक्तं प्रतीयते
    चक्रं तच्चक्रपाणेदितिजतनुगलद्रक्तधाराक्तधारं शश्चन्नो विश्ववन्धं वितरतु विपुलं शर्म धर्माशुशोभम् ॥
    २ ॥ चक्रपाणेर्नारायणस्य तच्चक्र दक्षिणोकरस्थितं नोऽलाक विपुलं शर्म सुखं वित रतु । किं विशिष्टम् ।
    विश्ववन्द्यम् । पुनः किंविशिष्टम् । युद्धावसरे दितिजानां तनुभ्यो विदारिताभ्यो या गलन्त्यो रक्तधारास्ताभिरक्ता
    लिप्ता धारा नेम्यग्रं यस्य तत् । सूरवो विद्वांसः क्षणमुखं क्षणलवत्रुटिप्रभृतिकमखिलं संवत्सरान्तमेतं
    सर्व कालं यस्य चक्रस्य खरूपमाहुस्तच्चक्रमिति संवन्धः । अपि च यचक्रं ध्वान्तस्यैकान्तमव्यभिचा र्यन्तमन्तकर
    सूरय आहुः । अन्तयति नाशयतीत्यन्तम् । सर्वेषां धान्नां तेजसां चापि परमं निरतिशयं धामाश्रयीभूतम् । घाँशोः
    सूयस्येव शोभा यस्य । सूर्येऽपि कालात्म कवं निरतिशयतेजोमयत्वं निःशेषतमोनाशकवं विश्ववन्धलं च सर्वागमप्रसिद्धमेव
    ॥ अव्यान्निर्घातघोरो हरिभुजपवनामर्शनाध्मातमूर्ते रमान्विस्मेरनेत्रत्रिदशनुतिवचःसाधुकारैः सुतारः ।
    सर्व संहर्तुमिच्छोररिकुलभुवनं स्फारविस्फारनादः संयत्कल्पान्तसिन्धौ शरसलिलघटावार्मुचः कार्मुकस्य ॥
    ३ ॥ कार्मुकस्य धनुषः स्फारविस्फारनादोऽस्मानव्यात् । स्फारः प्रबलोऽतिशयितो वा विस्फारनादो धनुषघोषः
    इत्यमरः । व्याकर्षणविशेषजो ध्वनि रेत्यर्थः । किंविशिष्टः । निर्घातोऽशनिपातशब्दस्तबद्धोरो दुःसहः ।
    पुनः किंविशिष्टः । किमिदमित्यकस्माद्विस्मराणि विकसितानि नेत्राणि येषां ते च ते त्रिदशास्तेषां नुतिवचः
    साधुकारैर्विस्मितदेवकृतैः इत्यादिस्तुविवचनसत्कारैमिश्रितः सन्सुतारः सुतरामुचः । हरेनारायणस्य भुजः
    कर एव पवनतनामर्शनं यदीषदाकर्षणं तेनाघ्मातोपचिता मूर्तिर्यस्य । सर्वमशेषमरिकुलभुवनं शत्रुसमूह एव भुवनं
    जगत्संहर्तु नाशयितुमिच्छोः । संयत्सङ्ग्राम एव कल्पान्तसिन्धुः प्रलयकालीनसमुदस्तस्मिन् । शरा एव सलिलानि
    तेषां घटा धाराः । अनवच्छिन्नपरम्परा शरवृष्टिरिति यावत् । तस्या वार्मुक् मेघस्तस्य । अत्र वार्मुक्शब्दो
    मेघे रूढ एव प्रायः सलिलशब्देन पौनरुक्त्या पातात् । यथा प्रलयकालीनो मेघः पवनामर्शनाध्मातमूर्तिः सर्वजगत्संहारेच्छुः
    सर्वसंहार कालयसिन्धुपूरणाय सलिलघटां मुञ्चति तद्वद्धनरपि । जीमूतश्यामभासा मुहुरपि भगवद्वाहुना मोहयन्ती
    युद्धेपूयमाना झटिति तडिदिवालक्ष्यते यस्य मूर्तिः । सोऽसिनासाकुलाक्षत्रिदशरिपुवपुःशोणिताखाददृप्तो नित्यानन्दाय
    भूयान्मधुमथनमनोनन्दको नन्दको नः ॥ ४ ॥ सोऽसिः खड्गो नन्दको नन्दकनामा नोऽस्माकं नित्यानन्दाय भूयात्
    । किंलक्षणः । वासेनाकुलान्यक्षाणीन्द्रियाणि येषां ते च ते त्रिदशरिपवस्तेषां वपूंषि तेषु शोणितं रुधिरं
    तस्यास्वादः पानं तेन हप्तो दीविष्टः । मधुमथनो मधुसूदनस्तस्य मनो नन्दयतीति नन्दनः। यस्य मूर्तियुद्धेषु
    झटिति शीघ्रं तडिदिव चपलगतिरालक्ष्यते । किंलक्षणा मूर्तिः । जीमूतश्यामभासा भगवतो बाहुना मुहुरुद्भूयमाना
    कम्प्यमाना । अपिशब्दान्मे घान्तस्तडिदिव दैत्यदेहेषु प्रविश्यमानेति । अत एव मोहयन्ती । दैत्यानिति शेषः।
    अत्रानुक्तमपि चर्म सद्गसहचरं बोद्धव्यम् अष्टायुधसहिताष्टबाहुयुक्तभगवन्मूर्तेः पुराणेषु प्रसिद्धखात्
    ॥ कम्राकारा मुरारेः करकमलतलेनानुरागागृहीता सम्यग्वृत्ता स्थिताग्रे सपदि न सहते दर्शनं या परेषाम् ।
    राजन्ती दैत्यजीवासवमदमुदिता लोहितालेपनार्दा कामं दीप्तांशुकान्ता प्रदिशतु दयितेवास्य कौमोदकी नः ॥
    ५॥ एवंविशिष्टा सा कौमोदकी भगवद्गदा नोऽस्मभ्यं काममभीष्टं प्रदिशतु । किंलक्षणा । कम्रो मनोहर आकारो
    यस्याः सा । तथा मुरारेः करकमलतले नानुरागाद्गृहीता । नि मे तार्थी पञ्चमी । सम्यग्वृत्ता वर्तुला । अग्रे
    भगवत्पुरतः स्थिता। परेषां शत्रूणां दर्शनं न सहते । सपदि सहसैव तानिर्भर्त्सयतीति शेषः । यद्वा सपदि
    कदापि परेषां दर्शनं न सहते । राजन्ती शोभमाना । दैत्यानां जीवो जीवनं स एवासवो मद्यं तदाखादकृत मदेन
    हर्षेण मुदिता । तथा दैत्यदेहस्थलोहितकृतालेपनेनारागेणाी क्लिना । तथा दीप्तैरंशुभिः किरणैः कान्ता कमनीया।
    अस्य भगवतो दयितेव । कथं तदुच्यते अनुरागाद्गृहीतेत्यन्तं यथाव्याख्यातमेव । वृत्तं चारित्रम् । परेषां
    परपुरुषाणाम् । लोहे तचन्दनलेपनेनार्दा । दीप्त उज्ज्वलोऽशुकस्य वन्न स्याऽप्रभागो यस्याः सा ॥ यो विधप्राणभूतस्तनुरपि
    च हरेर्यानकेतुखरूषो यं संचिन्त्यैव सद्यः स्वयमुरगवधूवर्गगर्भाः पतन्ति । चञ्चच्चण्डोस्तुण्डत्रुटितफणिवसारक्तपाकितास्य
    वन्दे छन्दोमयं तं खगपतिममलस्वर्णवर्णं सुपर्णम् ॥ ६ ॥ तं सुपर्ण गरुडं वन्दे । किंलक्षणम् । अमलं यत्स्वगं
    सुवर्ण तस्य वर्ण इव वी यस्य । खगाः पक्षिणस्तेषां पतिस्तम् । चञ्चद्देदीप्यमानं चण्डमतिकोपनमुरु महच
    यत्तुण्डं मुखं तेन त्रुटिताश्छिन्ना ये फणिनस्तेषां वसा रकं च तयोः पङ्कः कर्दमस्तेना वितं लिप्तमास्यं
    मुखं यस्य । पुनः किंविशिष्टम् । छन्दोमयम् । यो विश्वप्राणभूतः । सर्वप्राणेभ्यो भूत उद्भूतः । एकीभूतसकलप्राणिबलमूर्तिरित्यर्थः
    । अपि च हरेस्तनुर्मूर्त्य न्तरम् । तथा तस्यैव यानकेतुखरूपः । वाहनरूपो ध्वजरूपश्चेत्यर्थः । यं संचिन्यैव
    सद्य उरगवधूवर्गस्य सर्पस्त्रीसमूहस्य गर्भा जठरान्तःस्थिता अपि नागसंतानाः खयं पतन्ति । काव्यमाला। विष्णोविश्वेश्वरस्य
    प्रवरशयनकृत्सर्वलोकैकधर्ता सोऽनन्तः सर्वभूतः पृथुविमलयशाः सर्ववेदैश्च वेद्यः । पाता विश्वस्य शश्वत्सकलसुररिपुध्वंसनः
    पापहन्ता सर्वज्ञः सर्वसाक्षी सकलविषभयात्पातु भोगीश्वरो नः ॥ ७ ॥ सोऽनन्तोऽनन्तनामा भोगीश्वरो नागकुलपतिनोंऽस्मान्सकलविषभयात्पातु
    । विश्वे श्वरस्य विष्णोः प्रवरं श्रेष्ठं यच्छयनं शय्या तत्करोतीति । अत एव सर्वलोकैकधर्ता । खान्तःस्थितसकलजगतः
    परमात्मनो धारयितेत्यर्थः । सृष्टिकाले सर्वभूतमुत्पन्नमस्सा दिति सर्वभूतः । अत एव पृथु महद्विमलं पावयित
    यशो यस्य । सर्ववेदैः । वेद इत्युप लक्षणम् । इतिहासपुराणादिभिरपि वेद्य इत्यर्थः । जगस्थितिकाले विश्वस्य
    पाता पाल यिता । शश्वत्सदा । सकलसुररिपुध्वंसनः । अखिलधर्मप्रतिपक्षध्वंसन इत्यर्थः । नति नुतिस्मरणादिभिः
    सर्वजनानां पापहन्ता । सर्वज्ञः । सर्वसाक्षी । अनन्तस्य विष्णोरवता रखेन वर्णितत्वात्सर्वाणि विशेषणानि
    युक्तानि ॥ वाग्भूगौर्यादिभेदैर्विदुरिह मुनयो यां यदीयैश्च पुंसां कारुण्याः कटाक्षः सकृदपि पतितैः संपदः
    स्युः समग्राः । कुन्देन्दुस्खच्छमन्दस्मितमधुरमुखाम्भोरुहां सुन्दराङ्गीं वन्दे वन्द्यामशेषैरपि मुरभिदुरोमन्दिरामिन्दिरां
    ताम् ॥ ८॥ तामिन्दिरां लक्ष्मी वन्दे । किंलक्षणाम् । मुरभिदो नारायणस्योरो वक्षो मन्दिर गृहं यस्याः
    । अशेषैः समस्तैर्वन्या । सुन्दराण्यमानि यस्याः । कुन्दः कुसुमविशेषः इन्दुश्चन्द्रः । कुन्देन्दू इव
    खच्छं शुभ्रं मन्दमल्पं च तत्स्मितं तेन मधुरं मनोहरं मुखा म्भोरुहं यस्याः । यां मुनयो व्यासादयो वाक्सरस्वती
    पदाद्विद्यादीनां ग्रहणम् । तै दैर्विदुः । पुनः किंलक्षणाम् । यदीयैः कारुण्याः कृपा परवशैः कटाक्षः
    सकृदेकवारमपि पतितैः पुंसां समप्राः संपूर्णाः संपदः स्युः । ताम् ॥ या सूते सत्त्वजालं सकलमपि सदा संनिधानेन
    पुंसो धत्ते या सत्त्वयोगाच्चरमचरमिदं भूतये भूतजातम् । धात्री स्थात्री जनित्री प्रकृतिमविकृति विश्वशक्तिं
    विधात्री विष्णोविश्वात्मनस्तां विपुलगुणमयीं प्राणनाथां प्रणौमि ॥ ९ ॥ विश्वात्मनो विष्णोः प्राणनाथां
    प्रकृति तां प्रणौमि प्रकर्षेण स्तौमि । विश्वस्थामा तस्य । विश्वाधिष्ठानस्येत्यर्थः । प्राणनाथां प्राणप्रियात्
    । भार्यामिति यावत् । प्रक्रियते प्रसूयते सर्वमस्या इति प्रकृति निमतामुपादानम् । किंलक्षणम् । विकृतिर्विकारः
    । न विकृतिरविकृतिस्ताम् । अनादिमित्यर्थः । विश्वस्मिन्प्रपञ्चे शक्तिरुत्पादनसामर्थ्य यस्याः । विष्णुपादादिकेशान्तवर्णनस्तोत्रम्
    विधात्रीम् । स्थात्री स्थिरखभावाम् । जनित्रीमपूर्वाकारोत्पादयित्रीम् । विपुला विस्तीर्णा गुणाः सत्त्वादयस्तन्मयीं
    तत्स्वरूपाम् । लोहितशुक्लकृष्णमयीमिति वा । या पुंसः सर्वा घिष्ठानस्य विष्णोः संनिधानेन संनिधिसत्तामात्रेण
    सत्त्वजालं प्राणिसमूहं सदा सूते जन यति । सकलमित्यनेन न केवलं भूमिगतानामेव प्रसवित्री अपि तु देवादीनामपीति
    गम्यते । पुनः या पुंसः सत्त्वयोगात्सत्तासंबन्धादिदं प्रत्यक्षादिसंनिधापितं चरं जग ममचर स्थावरं च भूतजातं
    भूतये विभूत्यर्थम् । प्राणिविस्तारार्थमिति यावत् । धत्ते बिभर्ति ॥ येभ्योऽसूयद्भिरुच्चैः सपदि पदमुरु
    त्यज्यते दैत्यवर्ग र्येभ्यो धर्तुं च मूनी स्पृहयति सततं सर्वगीर्वाणवर्गः । नित्यं निर्मूलयेयुर्निचिततरममी
    भक्तिनिघ्नात्मनां नः पद्माक्षस्याभिपद्मद्वयतलनिलयाः पांसवः पापपङ्कम् ॥ १० ॥ अगी पद्माक्षस्य पुण्डरीकाक्षस्य
    हरेरशिपद्मद्रयस्य तलमधोभागस्तन्निलयः स्थानं येषां ते पांसवो रेणवो नोऽस्माकं पापपत दुरितकर्दमं नित्यं
    निर्मूलयेयुः । नित्यमिति पापपकविशेषणम् । नितरां चितं निचितमुपर्युपरि संचितम् तत्राप्यतिशयेन निचितं
    निचिततरम् । पूर्वपूर्वचितमनुत्सायैव पुनःपुनरुपर्युपरि चितमित्यर्थः । कथंभूतानां नः । भक्तिनिनात्मनां
    भक्त्यधीनचित्तानाम् । येभ्यः पादतलपांसुभ्योऽसूयद्भिः । यान्नुह्य द्भिरित्यर्थः । दैत्यवगैरसुरकुलैः
    । उच्चैरुन्नतैः । आक्रान्तदेवकुलैरिति यावत् । उरु बढे। श्वर्ययुक्तमपि पदं खस्थानं सपदि तत्क्षणमेव
    त्यज्यत उत्सृज्यते । पुनः किंभूतानाम् । सर्वगीर्वाणवर्गः सततं मूभी धर्तुमुद्वोढुं येभ्यः स्पृहयति
    । यान्धर्तु वाञ्छतीत्यर्थः ॥ रेखा लेखाभिवन्द्याश्चरणतलगताश्चक्रमत्स्यादिरूपाः स्निग्धाः सूक्ष्माः
    सुजाता मृदुललिततरक्षौमसूत्रायमाणाः । दद्यु मङ्गलानि भ्रमरभरजुषा कोमलेनाब्धिजायाः कनेणानेड्यमानाः किसलयमृदुना
    पाणिना चक्रपाणेः ॥ ११ ॥ चक्रपाणेर्नारायणस्य चरणतलगताश्चक्रमत्स्यादिरूपा रेखा नोऽस्मभ्यं मङ्गलानि दद्युः।
    किविशिष्टाः । लेखा देवास्तैर्वन्या वन्दनाहींः । स्निग्धा अरूक्षाः । सूक्ष्माः कृशाः । सुजाताः । खाश्रयसमतलवाविरोधिन्य
    इत्यर्थः । मृदूनि श्लक्ष्णानि च तानि ललिततरा ग्यतिशयमनोहराणि च यानि क्षौमसूत्राणि तद्वदाचरन्तीति ताः
    । अब्धिजाया लक्ष्म्याः पाणिनामेळ्यमानाः पुनःपुनरामृज्यमानाः । कथंभूतेन पाणिना । किसलयमृदुना । कप्रेण
    कमनीयेन । भ्रमन्ति रुवन्ति वेति व्युत्पत्त्या संशब्दं भ्रममाणानि प्रकोष्ठनिष्ट करभूषणानि श्रमराणि
    तेषां भरः स्तोमवं जुषते तेन । कोमलेन लक्षणेन ॥ काव्यमाला। यस्मादाक्रामतो द्यां गरुडमणिशिलाकेतुदण्डायमाना
    दाश्थ्योतन्ती बभासे सुरसरिदमला वैजयन्तीव कान्ता । भूमिष्ठो यस्तस्थान्यो भुवनगृह बृहत्स्तम्भशोभां दधानः
    पातामेतौ पयोजोदरदलिततलौ पङ्कजाक्षस्य पादौ ॥ १२ ॥ यस्मात्पादादाश्योतन्त्यापतन्ती सुरसरिद्गङ्गा । अमला
    निर्मलोदका कान्ता मनोहरा वैजयन्ती पताकेव बभासे । किंलक्षणात् । यामाकामतः । अण्डकपालस्फुटनपर्यन्तं
    दीर्घकृतादित्यर्थः । गरुडमणिर्मरकतमणिस्तन्मयी या शिला तद्रूपो यः केतुदण्डः पता काश्रयभूता यष्टिस्तद्वदाचरतीति
    तस्मात् । एवं वामपादं वर्णयित्वा दक्षिणं वर्णयति तथान्यो दक्षिणः पादो भूमिष्ठः । भुवनं त्रैलोक्यं
    तदेव गृहं तस्मिन्बृहन्महान्यः स्तम्भ स्तस्य शोभां दधानः । त्रैलोक्यभवनोत्तम्भनस्तम्भ इव स्थित इत्यर्थः
    । यावेवंविधौ पङ्कजाक्षस्य हरेः पादौ तावेतौ पातां पालयेताम् । अस्मानिति शेषः । पयोज कमलं तस्योदरं मध्यं
    तद्दलितं पराभूतं याभ्यां तादृशे तले ययोस्ती । पयोजोदरादपि सुकुमा रतलावित्यर्थः॥ आक्रामद्भ्यां त्रिलोकीमसुरसुरपती
    तत्क्षणादेव नीतौ याभ्यां वैरोचनीन्द्रौ युगपदपि विपत्संपदोरेकधाम । ताभ्यां ताम्रोदराभ्यां मुहुरमजितस्याञ्चिताभ्यामुभाभ्यां
    प्राज्यैश्वर्यप्रदाभ्यां प्रणतिमुपगतः पादपकेरुहाभ्याम् ॥ १३ ॥ तत्क्षणादेव यस्मिन्क्षणे बलिदैत्यदत्तोदकं
    हस्ते पतितं तदैव त्रिलोकीमाक्रामद्भयां याभ्यामसुरसुरपती वैरोचनीन्द्रौ बलिशको युगपत्समकालमेव क्रमेण
    विपत्संपदोरैश्वर्य भ्रंशतत्संपत्त्योरेकलधाम मुख्य स्थानं नीतौ प्रापितौ । विरोचनापत्यं बलिविपद्धामत्वम्
    इन्द्रश्च संपद्धामलं नीत इत्यर्थः । अपिशब्दो विरोधद्योतकः । एकस्यामाक्रमणक्रियायां विरुद्धोभयकार्ययोगो
    विरोधः । याभ्यामेवं कृतं ताभ्यामुभाभ्यामजितस्य विष्णोः पाद पड़ेहाभ्यामहं मुहुः शश्वत्प्रणति नम्रतामुपगतः
    । तानेत्यादीनि पादविशेषणानि । ताने आरके उदरे अधस्तले ययोः । अश्चिताभ्यां पूजिताभ्याम् । ब्रह्मादिभिरिति
    शेषः । प्राज्यमधिकमैश्वर्यं भवेभ्यः प्रददत इति ताभ्याम् ॥ येभ्यो वर्णश्चतुर्थश्चरमत उदभूदादिसर्गे
    प्रजानां साहस्री चापि संख्या प्रकटमभिहिता सर्ववेदेषु येषाम् । व्याप्ता विश्वभरा यैरतिवितततनोविश्वमूर्विराजो
    विष्णोस्तेभ्यो महद्भयः सततमपि नमोऽस्त्वविपकेरुहेभ्यः ॥ १४॥ विश्वमूर्तेर्विराजो विराट्ररूपस्य विष्णोस्तेभ्योऽप्यजिपकेरुहेभ्यः
    सततं सर्वदा नमोऽस्तु । विष्णुपादादिकेशान्तवर्णनस्तोत्रम् । अतिवितततनोरपरिच्छिन्न देहस्य । किंलक्षणेभ्यः
    । महद्भ्य । येभ्यः सकाशात्प्रजाना मादिसर्गे चतुर्थो वर्णः शूद्राख्यश्चरमतो वर्णत्रयोत्पत्त्यनन्तरमुदभूत्
    । अपि च येषाम ङ्घ्रिपङ्केरुहाणां साहस्री संख्या प्रकटं स्फुटं सर्ववेदेष्वभिहिता । सहस्राक्षः सहस्रपात्
    इत्यायेत्यर्थः । यैर्विश्वंभरा पृथिवी व्याप्ता पूर्णा ॥ विष्णो पादद्वयाग्रे विमलनखमणिभ्राजिता राजते
    या राजीवस्येव रम्या हिमजलकणिकालंकृताग्रा दलाली । अस्माकं विस्मयार्हाण्यखिलमुनिजनप्रार्थनीयानि सेयं
    दद्यादाद्यानवद्या ततिरतिरुचिरा मङ्गलान्यङ्गुलीनाम् ॥ १५ ॥ सेयं विष्णोरङ्गुलीनां ततिः पङ्क्तिरस्माकं
    मङ्गलानि दद्यात् । किंभूता । आदौ भवाद्या पूर्वसिद्धा । भक्तानामखिलाभीष्टकारणभूतेत्यर्थः । अनवद्या
    निर्मला । अम्लानेत्यर्थः । अतिरुचिरा । या पादद्वयाग्रे विमला निर्मला ये नखमणयस्तैर्भ्राजिता सती राजते
    । राजीवस्य कमलस्य दलाली दलपङ्तिरिव । किंलक्षणा दलाली । रम्या । हिमजलानां कणिकाभिर्विन्दुभिरलंकृतान्यप्राणि
    यस्याः सा । किंलक्षणानि मङ्गलानि । विस्मयार्हा ण्याश्चर्ययोग्यानि । अदृष्टपूर्वाणीति यावत् । तथाखिलमुनिजनप्रार्थनीयानि
    ॥ यस्यां दृष्ट्वामलायां प्रतिकृतिममराः खां भवन्त्यानमन्तः सेन्द्राः सान्द्रीकृतेर्ष्याः खपरसुरकुलाशङ्कयातङ्कवन्तः
    । सा सद्यः सातिरेकां सकलसुखकरीं संपदं साधयेन्न श्चञ्चच्चार्वंशुचक्रा चरणनलिनयोश्चक्रपाणेर्नखाली ॥
    १६ ॥ सा चक्रपाणेश्वरणनलिनयोर्नखाली नोऽस्माकं संपदं सद्यः साधयेत् । सकलान्यै हिकामुष्मिकाणि सुखानि
    करोति ताम् । सातिरेकामधिकाम् । किंलक्षणा नखाली। चञ्चन्तः प्रसरन्तश्चारवो येंशवस्तेषां चक्रं समूहो
    यस्याः । यस्यां नखाल्याममलायां सेन्द्रा अमरा आनमन्तः सन्तः खां प्रतिकृतिं प्रतिबिम्बं दृष्ट्वा खपरसुरकुलाशङ्कया
    खप्रतिपक्षदेवसमूहभ्रान्या सान्द्रीकृतेर्ष्या अतिशयेर्ष्यायुक्ता आतङ्कवन्तः शङ्कानिमित्त कभययुक्ताश्च
    भवन्ति ॥ पादाम्भोजन्मसेवासमवनतसुरव्रातभाखकिरीट प्रत्युप्तोच्चावचाश्मप्रवरकरगणैश्चित्रितं यद्विभाति
    । नम्राङ्गाणां हरेर्नो हरिदुपलमहाकूर्मसौन्दर्यहारि च्छायं श्रेयःप्रदायि प्रपदयुगमिदं प्रापयेत्पापमन्तम्
    ॥ १७ ॥ हरेरिदं प्रपदयुगं पादाग्रद्वन्द्वं नोऽस्माकं पापमन्तं नाशं प्रापयेत् । कथंभूतानां नः । नम्राङ्गाणाम्
    । साष्टाङ्गं प्रणामं कुर्वतामित्यर्थः । किंलक्षणं प्रपदयुगम् । हरिदुपलो हरित काव्यमाला। वर्णो मणिविशेषस्तनिर्मितो
    यो महाकूर्मस्तस्य सौन्दर्य लावण्यं हरतीत्येवंविधा छाया कान्तिर्यस्य तत् । यथा श्रेयःप्रदायि । पादावेवाम्भोजन्मनी
    कमले तयोः सेवा तस्यां समवनता ये सुरास्तेषां यो व्रातः समूहस्तस्मिन्यानि भाखन्ति किरीटानि तेषु प्रत्युता
    निखाता य उच्चावचा नानाविधा अश्मप्रवरा मणिश्रेष्ठास्तेषां करा रश्मयस्तेषां गणैः समूहैश्चित्रितं कर्बुरितं
    यद्विभाति ॥ श्रीमत्यौ चारुवृत्ते करपरिमलनानन्दहृष्टे रमायाः सौन्दर्याढ्येन्द्रनीलोपलरचितमहादण्डयोः
    कान्तिचौरे । सूरीन्द्रैः स्तूयमाने सुरकुलसुखदे सूदितारातिसंघे जङ्घे नारायणीये मुहुरपि जयतामस्मदंहो
    हरन्त्यौ ॥ १८ ॥ नारायणस्येमे जङ्घे मुहुः शश्वदस्मदंहः पापं हरन्त्यौ सत्यौ जयताम् । श्रीमत्यौ शोभावस्थौ
    । चारु सुन्दरं यथा स्यात्तथा वृत्ते वर्तुले । रमाया लक्ष्म्याः करयोः परिमल नेन य आनन्दस्तेन हृष्टे
    पुलकिते । सौन्दर्येण लावण्येनाढ्यो य इन्दनीलोपलस्तेन रचितौ यौ महादण्डौ तयोः कान्तिचौरे । सूरीन्द्रैर्विद्वच्छ्रेष्ठैः
    स्तूयमाने वर्ण्यमाने । सुरकुलस्य सुखदे । यस्मात्सूदितारातिसंघे हतदेवशत्रुकुले ॥ सम्यक्साह्यं विधातुं
    सममपि सततं जङ्घयोः खिन्नयोर्ये भारीभूतोरुदण्डद्वयभरणकृतोत्तम्भभावं भजेते । चिचादर्शं निघातुं महितमिव
    सतां ते समुद्गायमाने वृत्ताकारे विधत्तां हृदि मुदमजितस्यानिशं जानुनी नः ॥ १९॥ अजितस्य हरेस्ते जानुनी
    नोऽस्माकं चित्ते मुदमनिशं विधत्ताम् । वृत्ताकारे मण्ड लवत्समवर्तुलाकारे । सतां भक्तानां चित्तादर्श
    मनोदर्पणं निधातुं समुद्गायमान आद र्शकोषायमाणे इव । महितं निर्मलीकृतं चित्तदर्शम् । ये खिन्नयोर्जङ्घयो
    त्येन साह्यं सहत्वम् । उपकारमिति यावत् । समं युगपदेव भारीभूतस्योरुदण्डद्वयस्य यद्धरणं धारणं तस्मिन्कृत
    उत्तम्भभावोऽवष्टम्भलं तद्भजेते । अपिशब्दः संभावनायाम् ।। देवो भीर्ति विधातुः सपदि विदधतौ कैटभाख्यं
    मधुंया वारोप्यारूढगर्वावधिजलधि ययोरेव दैत्यो जघान । वृत्तावन्योन्यतुल्यौ चतुरमुपचयं बिभ्रतावभ्रनीला
    वूरू चारू हरेतौ मुदमतिशयिनीं मानसे नो विधत्ताम् ॥ २० ॥ हरेस्तावूरू नोऽस्माकं मानसेऽतिशयिनीं मुदं विधत्ताम्
    । चारू मनोहरौ । वृत्ता वर्तुलौ । अन्योन्यं परस्परं तुल्यौ समौ । चतुरं यथा स्यात्तथोपचयं पुष्टिं बिभ्रती
    । करिकरसदृशाकारावित्यर्थः । अभ्रनीलौ सजलजलदवच्छयामौ । तौ कौ। ययोरिति सप्तमी विष्णुपादादिकेशान्तवर्णनस्तोत्रम्
    । द्विवचनम् । देवो विष्णुर्ययोरूर्वोर्दैत्यं कैटभाख्यं मधुं चारोप्य जघानैव । कथंभूतौ । विधातुर्ब्रह्मणः
    सपदि खोत्पत्तिमात्रेण भीतिं विदधतौ । आरूढगर्वौ । कुन जघान । अधिजलधि समुदे ॥ पीतेन द्योतते यच्चतुरपरिहिते
    नाम्बरेणात्युदारं जातालंकारयोगं जलमिव जलघेर्वाडवाग्निप्रभाभिः । एतत्पातित्यदान्नो जघनमतिघनादेनसो माननीयं
    सातत्येनैव चेतोविषयमवतरत्पातु पीताम्बरस्य ॥ २१ ।। पीताम्बरस्य विष्णोरेतव्द्याख्यास्यमानविशेषणं जघनं
    सातत्येन चेतोविषयमवतरन्म नोवृत्तिसमारूढं सत् । एनसः पापान्नोऽस्मान्पातु । कथंभूतादेनसः । अतिघनात्
    । अनेकजन्माभ्याससंचितादित्यर्थः । अत एव पातित्यदात् । किंलक्षणं जघनम् । मान नीयं मानार्हम् । चतुरैरलंकरणकर्मकुशलमत्तैश्चतुरं
    यथा स्यात्तथेति वा परिहितेनास जितेन पीतेन सुवर्णाभेनाम्बरेण वस्त्रेण जातालंकारयोगं सदात्युदारं यथा
    स्यात्तथा द्योतते प्रकाशते तदेतत् । वाडवाग्निप्रभाभिर्जलधेर्जलमिव ॥ यस्या दाम्न्या त्रिधाम्नो जघनकलितया
    भ्राजतेऽङ्गं यथाब्धे र्मध्यस्थो मन्दराद्रिर्भुजगपतिमहाभोगसंनद्धमध्यः । काञ्ची सा काञ्चनाभा मणिवरकिरणैरुल्लसद्भिः
    प्रदीप्ता कल्यां कल्याणदात्रीं मम मतिमनिशं कम्ररूपा करोतु ॥ २२ ॥ विधाम्नो भगवतोऽहं यस्याः काञ्चया
    दाम्न्या रशनया तस्यैव जघनकलितया नित म्बनिबद्धया भ्राजते सा काञ्ची मम मतिमनिशं सर्वदा कल्यां समां कल्याणदात्रीं
    म ङ्गलकरीं करोतु । अन्धेः क्षीरसमुद्रस्य मध्ये स्थितो मन्दराद्रिर्भुजगपतेर्वासुकेर्महाभो गेन पृथुदीर्घेण
    कायेन संनद्धं परिवेष्टितं मध्यं यस्यैवंविधो यथाभ्राजीत्तथा भ्राजते । किंलक्षणाञ्काची । काञ्चनाभा सुवर्णराजिकृतशोभा।
    मणिवराणां वज्रादीनां किरणैरु ल्लसद्भिः प्रदीप्ता प्रकाशिता। अत एव कम्ररूपा कमनीयाकारा । पीताम्बरं
    हि तर तदन्तराले भगवन्मूर्तिमन्दराचलवत् तत्परिवेष्टनं काञ्चीदाम्नी वासुकिशरीरवत् इति योज्यम् ॥ उन्ननं
    कम्रमुच्चैरुपचितमुदभूद्यत्र पत्रैर्विचित्रैः पूर्वं गीर्वाणपूज्यं कमलजमधुपस्यास्पदं तत्पयोजम् । तस्मिन्नीलाश्मनीलैस्तरलरुचिजलैः
    पूरिते केलिबुद्ध्या नालीकाक्षस्य नामीसरसि वसतु नश्चित्तहंसश्चिराय ॥ २३ ॥ यत्र यस्मिनाभीसरसि तत्पयोजं
    कमलं पूर्वं सृष्टिकाल उदभूत्तस्मिन्नालीकाक्षस्य २ द्वि० गु० काव्यमाला। कमलनयनस्य भगवतो नाभीसरसि सरोवद्गम्भीरवर्तुले
    नाभिमण्डले नोऽस्माकं चित्त हंसश्चिराय दीर्घकालं केलिबुद्ध्या रमणेच्छया वसतु । कथंभूते नाभीसरसि । नीला
    श्मनीलैरिन्द्रनीलमणिवन्नीलवर्णैतरलैश्चञ्चलै रुचिजलैर्देहप्रभाकान्तिपूरैः पूरिते। किं लक्षणं पयोजम्
    । उन्नम्रमुन्नतम् । कम्रं मनोहरम् । विचित्रैर्नानावणैः पत्रैरुच्चैरविशये नोपचितम् । तथा गीर्वाणानां
    देवानां पूज्यम् । तथा कमलजो ब्रह्मा स एव मधुपो भ्रमरस्तस्यास्पदं स्थानम् ॥ पातालं यस्य नालं बलयमपि
    दिशां पत्रपङ्क्तिं नगेन्द्रा न्विद्वांसः केसरालीर्विदुरिह विपुलां कर्णिकां वर्णशैलम् । भूयाद्गायत्वयंभूमधुकरभुवनं
    भूमयं कामदं नो नालीकं नाभिपद्माकरभवमुरु तन्नागशय्यस्य शौरेः ॥ २४ ॥ नागः शेषाख्यः शय्या यस्य तस्य शौरर्विष्णोनीभिरेव
    पद्माकरः सरतत्र भवतीति तथाविधमुरु बृहन्नालीकं कमलं नोऽस्माकं कामदं भूयात् । गायन्वेदान्पठन्वयंभूर्ब्रह्मा
    स एव मधुकरस्तस्य भवनं गृहम् । तथा भूमयं पृथ्वीखरूपम् । किं तत् । विद्वांसो वि दितसकलवेद्या यस्य नालं
    पातालमाहुः । तथा यस्य पत्रपङ्क्ति दिशां वलयं मण्डलमाहुः । तथा नगेन्द्रान्हिमवदादीन्यस्य केसरालीर्विदुः
    । तथा खर्णशैलं मेरुं यस्य विपुलां कर्णिकां विदुः । तत् ॥ कान्त्यम्भःपूरपूर्णे लसदसितवलीभङ्गभास्वत्तरङ्गे
    गम्भीराकारनाभीचतुरतरमहावर्तशोभिन्युदारे । कीडवानद्धहेमोदरनविनमहावाडवाग्निप्रभाढ्ये कामं दामोदरीयोदरसलिलनिधौ
    चित्तमत्स्यश्चिरं नः ॥ २५ ॥ दामोदरस्य भगवत उदरसलिलनिधौ । कुक्षौ समुद्राश्चत्वारः इत्युक्तत्वात् ।
    नोऽस्माकं चित्तमत्स्यः कामं यथेष्टं क्रीडतु । उदरसलिलनिधिविशेषणानि । कान्तिर्देह दीप्तिः सैचाम्भ उदकं
    तस्य पूरः प्रवाहप्रसर्पणं तेन पूर्णे। तथा लसन्तः शोभमाना असिता नीला वलीनामुदरदेशस्थरेखाविशेषाणां भङ्गा
    एव भास्वन्तस्तरङ्गा यस्मिन् । तथा गम्भीरोऽगाध आकारो यस्य स चासौ नाभिश्चेति स एव चतुरतरोऽतिशयेन चतुरः
    सुन्दरो महानावर्ततेन शोभा विद्यते यस्मिन् । अत एवोदारे मनोहरे। तथा नद्धमासमन्ताद्वद्धं यद्धेममयमुदरनविनमुदराभरणं
    तदेव महती वाडवामिप्रभा तयाढ्ये संभृते । यद्वा कर्णिकां स्वर्णशैलम् इति पूर्वश्लोके मेरुकर्णिकस्य नाभिकमलस्योक्तत्वात्
    । हेमोदरं हेम कर्णिकाख्यमुदरे मध्ये यस्य तच्च तन्नलिनं च तदेव महावाडवाग्निप्रभेति व्याख्येयम् ॥ विष्णुपादादिकेशान्तवर्णनस्तोत्रम्
    । नाभीनालीकमूलादधिकपरिमलोन्मोहितानामलीनां माला नीलेव यान्ती स्फुरति रुचिमती वक्त्रपद्मोन्मुखी या ।
    रम्या सा रोमराजिर्महितरुचिमती मध्यभागस्य विष्णो श्चित्तस्था मा विरंसीचिरतरमुचितां साधयन्ती श्रियं
    नः ॥२६॥ विष्णोर्मध्यभागस्य संबन्धिनी रोमरार्जिर्नोऽस्माकं चित्तस्था सती मा विरंसीद्वि रतिं मा करोतु
    । तत्र भूयादित्यर्थः । किं कुर्वती । उचितामस्मद्योग्यां श्रियं साध यन्ती । किंभूता । रम्या । महितरुचिमती
    महिता सर्वैः प्रशस्ता या रुचिस्तद्वती। या नामीनालीकस्य मूलाद्वक्रपद्मोन्मुखी । अलीनां भ्रमराणां नीला
    मालेव रुचिमती रुचिरा स्फुरति । कथंभूतानामलीनाम् । अधिकपरिमलोन्मोहितानाम् । नाभिकमल सौरभ्याघ्राणादधिकमोहितानामित्यर्थः
    ॥ आदौ कल्पस्य यस्मात्प्रभवति विततं विश्वमेतद्विकल्पैः कल्पान्ते यस्य चान्तः प्रविशति सकलं स्थावरं
    जङ्गमं च । अत्यन्ताचिन्त्यमूर्तेश्चिरतरमजितस्यान्तरिक्षस्वरूपे तस्मिन्नस्साकमन्तःकरणमतिमुदा क्रीडतात्क्रोडभागे
    ॥ २७ ॥ अजितस्य हरेः क्रोडभागे भुजद्वयमध्यप्रदेशे वक्षःस्थलादधोभागेऽस्माकमन्तःकरणं चिरतरमतिमुदा क्रीडतात्
    । कीदृशे। अन्तरिक्षखरूपे । हृदयाकाशस्थान इत्यर्थः । किंभूतस्याजितस्य । अत्यन्तं सर्वात्मना न चिन्त्या
    मूर्तिः खरूपं यस्य । यस्मात्कोड भागात्सकलं निरवशेषं विश्वं कल्पस्यादौ प्रभवत्युद्भवति । तथा कल्पान्ते
    यस्यान्तः स्थावरं जङ्गमं च विश्वं प्रविशति । किंलक्षणं विश्वम् । मन्वन्तरादिभेदैर्विततं विस्तीर्णम्
    ॥ संस्तीर्णं कौस्तुभांशुप्रसरकिसलयैर्मुग्धमुक्ताफलाढ्यं श्रीवत्सोल्लासि फुल्लप्रतिवनवनमालांशुराजद्भुजान्तम्
    । वक्षः श्रीवृक्षकान्तं मधुकरनिकरश्यामलं शार्ङ्गपाणेः संसाराध्वश्रमार्तैरुपवनमिव यत्सेवितं तत्प्रपद्ये
    ॥ २८ ॥ शाईपाणेर्नारायणस्य तद्वक्षः प्रपद्ये तात्पर्येणाश्रये । यत्संसाराध्वश्रमार्तैर्जन्ममरणभो गवेदनादिमार्गभ्रमणजश्रमपीडितैरुपवनमिव
    सेवितमुपासितम् । उपवनतुल्यतामेव प्रति कौस्तुभस्य भगवत्कण्ठस्थितरत्नविशेषस्यांशवः किरणास्तेषां प्रसरास्तान्येव
    किसलयानि तैः संस्तीर्णम् । सर्वत्र विप्रसृतमिति यावत् । तथा मुग्धानि सुन्दराणि मुक्ताफलानि तैराढ्यम्
    । मौक्तिकानि यत्र फलतुल्यानीति यावत् । श्रीवत्सो नाम भगवद्वक्षसि प्रदक्षिणरोमावर्तो भृगुपदप्रहारस्थानगतश्चिह्नविशेषस्तस्योल्लासोऽभिव्यक्ति
    र्विद्यते यस्मिन् । तथा च फुल्ला विकसिता प्रतिवनं वने वने जाता या वनमाला काव्यमाला । तस्या अंशुभिः
    परागै राजच्छोभमानं भुजान्तं यस्मिन् । पत्त्रपुष्पमय्या पादलम्बिनी माला वनमालेत्युच्यते। तथा श्रीवृक्षो
    नाम शुभावर्तविशेषस्तेन कान्तम् । अथवा श्रीरेव वृक्षस्तेन कान्तम् । तथा मधुकरनिकरवच्छयामलम् । उपवनमपि
    किसलयसंस्ती श्रीमतां शोभमानानां गवादिवत्सानामुल्लासर्युक्तम् तथा फुल्लानि यानि प्रतिवनानि संमुखवनानि
    तेषां या वनमाला संभजनीया माला पङ्तिस्तस्यां राजन्तो भुजा विटमास्तेषामन्तः पर्यन्तो यस्मिंस्तादृशम्
    श्रीवृक्षैर्बिल्वद्रुमैः कान्तम् मधुकरनिकरैः श्यामलं च भवति ॥ कान्तं वक्षो नितान्तं विदधदिव गलं कालिमा
    कालशत्रो रिन्दोर्बिम्बं यथाङ्को मधुप इव तरोर्मञ्जरीं राजते यः । श्रीमान्नित्यं विधेयादविरलमिलितः कौस्तुभश्रीप्रतानैः
    श्रीवत्सः श्रीपतेः स श्रिय इव दयितो वत्स उच्चैः श्रियं नः २९ श्रीपवेर्नारायणस्य श्रीवत्सश्चिह्नविशेषो
    नोऽस्माकं श्रियं नित्यमुच्चैरधिकं विधेयात् । किंलक्षणः । श्रीमाञ्शोभाढ्य । यतः कौस्तुभश्रीप्रतानैः
    कौस्तुभमणिप्रभाप्रसरणैरविरलं निरन्तरं यथा स्यात्तथा मिलितः । श्रियो लक्ष्म्या भगवद्वक्षःस्थलस्थाया
    दयितः प्रीत्या स्पदो वत्स इव । तया निवं संलाल्यमानत्वात् । यः श्रीवत्सः कालशत्रोः शिवस्य गलं कालिमा
    कालकूटकार्ष्ण्यमिव अङ्कः कलङ्क इन्दोर्बिम्बमिव मधुपो भ्रमरस्तरोर्मञ्जरी मिव श्रीपतेर्वक्षो नितान्तं
    कान्तं मनोरमं विदधद्राजते शोभते ॥ संभूयाम्भोधिमध्यात्सपदि सहजया यः श्रिया संनिधत्ते नीले नारायणोरःस्थलगगनतले
    हारतारोपसेव्ये । आशाः सर्वाः प्रकाशा विदधदपिदधच्चात्मभासान्यतेजां स्याश्चर्यस्याकरो नो द्युमणिरिव
    मणिः कौस्तुभः सोऽस्तु भूत्यै ॥३०॥ यः सहजया श्रिया सहाम्भोधिमध्यात्संभूयाविर्भूय नारायणस्योरःस्थलमेव
    नीलवि शालाकारवत्त्वाद्गगनतलं तस्मिन्संनिधत्त उच्चैः प्रत्यक्षो भवति । किंलक्षणे । हारो मुक्कामाला
    स एव तारा नक्षत्राणि तैरुपसेव्ये । किं कुर्वन् । सर्वा आशा दिश आत्म भासा प्रकाशा विधत् । तथान्यतेजांस्याभरणान्तराणां
    प्रभा अपिदधत् । आत्मभा साच्छादयनित्यर्थः । तयाश्चर्यस्य विस्मयस्याकरः स्थानभूतः । स कौस्तुभो नोऽस्माकं
    भूत्या अस्तु । उत्प्रेक्षवे द्युमणिरिव सूर्य इव । सूर्योऽपि प्रातः समुद्रादुद्गच्छति । सह सिद्धया
    श्रिया शोभया युक्तः । नीलवर्णे तारायुक्त गगनतले संनिधत्ते आशाः प्रका शयति । अन्यतेजांसि चन्दनक्षत्रादितेजांसि
    पिदधाति ॥ या वायावानुकूल्यात्सरति मणिरुचा भासमानासमाना साकं साकम्पमंसे वसति विदधती वासुभद्रं सुभद्रम्
    । विष्णुपादादिकेशान्तवर्णनस्तोत्रम् । सारं सारङ्गसंधैर्मुखरितकुसुमा मेचकान्ता च कान्ता माला मालालितास्मान्न
    विरमतु सुखैर्योजयन्ती जयन्ती ॥ ३१ ॥ या माला विष्णोरंसे साकम्पमीषत्कम्पसहितं यथा स्यात्तथा वसति । सामान्सुखै
    र्योजयन्ती सती न विरमतु । किंलक्षणा । जयन्ती जयकरी जयन्याख्या वा । वायौ मारुत आनुकूल्यात्सरति वहति
    सति साकम्पमिति योज्यम् । मणिरुचा कौस्तुभप्रभया साकं सह भासमानात एवासमानानुपमा । तथा वासुभद्रं वासुदेवं
    सुभद्रं शोभनं विद धती । भूषयन्तीत्यर्थः । तथा सारङ्गसंधैर्भ्रमरसमूहः सारं यथा स्यात्तथा मुखरितकुसुमा।
    तथा मेचकान्ता श्यामवर्णकुसुमगुम्फितप्रान्ता । अत एव कान्ता। तथा मालालिता वक्षःस्थया लक्ष्म्यानुमोदिता
    ॥ हारस्योरुप्रभाभिः प्रतिवनवनमालांशुभिः प्रांशुभिर्य च्छ्रीभिश्चाप्यङ्गदानां शवलितरुचिभिनिष्कभाभिश्च
    भाति । बाहुल्येनैव बद्धाञ्जलिपुटमजितस्याभियाचामहे त द्बन्धार्ति बाधतां नो बहुविहतिकरीं बन्धुरं बाहुमूलम्
    ॥ ३२॥ अजितस्य भगवतस्तद्वाहुमूलमंसदेशमभियाचामहे प्रार्थयामहे । किंलक्षणम् । बन्धुरं सुन्दरम् । किं
    कृत्वा । बाहुल्येन पुनःपुनरेवाञ्जलिपुटं बद्धा । किं याञ्चयेति चेत् । नोऽस्माकं बहुवितिकरीमनेकानर्थकरीं
    बन्धाति बन्धनरूपां पीडां बाधताम् । संसार निगडादस्मान्मोचयत्वित्यर्थः । यद्बाहुमूलं हारस्योरुप्रभाभिरतिकान्तिभिः
    । तथा प्रतिव नजातपुष्परचितवनमालाया अंशुभिरंशस्थानीयैर्विचित्रवर्णैः । निष्कस्य भूषणविशेषस्य भाभिः
    शबलिता रुचयो यासाम् । ताभिरमदानां बाहुभूषणानां श्रीभिर्भांति । प्रांशुभिरि त्यंशुविशेषणम् ॥ विश्वत्राणैकदीक्षास्तदनुगुणगुणक्षत्रनिर्माणदक्षाः
    कर्तारो दुर्निरूपाः स्फुटगुरुयशसां कर्मणामद्भुतानाम् । शार्ङ्गं बाणं कृपाणं फलकमरिगदे पद्मशङ्खौ सहस्रं
    बिभ्राणाः शस्त्रजालं मम ददतु हरेर्बाहवो मोहहानिम् ।। ३३ ।। हरेर्बाहवो मम मोहहानिं ददतु । किविशिष्टाः
    । विश्वस्य जगतनाणे रक्षण एका मुख्या दीक्षा व्रतधारणं येषाम् । अत एव तस्य विश्वत्राणस्यानुगुणा योग्या
    गुणाः शौर्यादयो यस्य तादृशक्षत्रस्य निर्माणे दक्षाः समर्थाः । दुर्निरूपाः । एते एवंप्रकारा इय न्तश्चेत्सवधारयितुमशक्याः
    । तथा स्फुटगुरुयशसामविस्पष्टमहत्ख्यातियुक्तानामद्भुतानां कर्मणां पराक्रमाणां कर्तारः । तथा शार्ङ्ग
    धनुः इत्येवंविधमन्यच्च सहस्रमपरिमितं शस्त्रजालं बिभ्राणाः । सहस्रं बाहव इति वा योजना काव्यमाल्य कण्ठाकल्पोद्गतैर्यः
    कनकमयलसत्कुण्डलोस्रैल्दारै रुद्योतैः कौस्तुभस्याप्युरुभिरुपचितश्चित्रवर्णो विभाति । कण्ठाश्लेषे रमायाः
    करवलयपदैर्मुद्रिते भद्रूरूपे वैकुण्ठीयेऽत्र कण्ठे वसतु मम मतिः कुण्ठमावं विहाय ॥ ३४ ॥ अत्र वैकुण्ठस्य
    विष्णोरयं वैकुण्ठीयस्तस्मिन्कण्ठे मम मतिः फुण्ठभावमालस्यं विहाय वसतु स्थिरीभवतु । यैः कण्ठाकल्पाः
    कण्ठभूषणानि तेभ्य उद्गतैरुद्योतैः। तथा कनकमये लसन्ती ये कुण्डले तयोरुस्रै किरणैः । उदारैर्मनोहरैरिष्टार्थदैर्वा
    । तथा कौस्तुभस्या प्युरुभिरुद्योतैरुपचितः सन् । चित्रवर्णो विभाति । पुनः किंलक्षणे । कण्ठे रमायाः
    कण्ठाश्लेषे लक्ष्मीकृतकण्ठालिङ्गने सति तस्या एव करवलयपदैर्मुद्रिते । अत एव भद्ररूपे सुन्दराकारे॥ पद्मानन्दप्रदाता
    परिलसदरुणश्रीपरीताग्रभागः काले काले च कम्बुप्रवरशशधरापूरणे यः प्रवीणः । वक्राकाशान्तरस्थस्तिरयति नितरां
    दन्ततारौघशोभां श्रीभर्तुर्दन्तवासोद्युमणिरघतमोनाशनायास्त्वसौ नः ॥ ३५ ॥ असौ श्रीभर्तुर्दन्तवासो दन्ताच्छादनम्
    । ओष्ठद्वयमिति यावत् । स एव घुमणिः सूर्यो नोऽस्माकमघतमोनाशनाय पापान्धकारदूरीकरणायास्तु । किंलक्षणः
    । पद्मा लक्ष्मीस्तस्या आनन्दप्रदाता । तथा परिलसन्ती यारुणश्री रक्तवर्णा कान्तिस्तया परीतो व्याप्तोऽप्रभागो
    यस्य । तथा काले काल उचितसमयेषु कम्वुप्रवरः शङ्खश्रेष्ठः स एव शशधरश्चन्द्रस्तस्यापूरणमाध्मानं तत्र
    यः प्रवीणः । तथा वक्ररूपो य आकाश स्तस्यान्तरे मध्ये तिष्ठतीति तथाविधः सन् । दन्तरूपाणां ताराणामोघः
    समूहस्तस्य शोभां तिरयत्यभिभवति । प्रसिद्धोऽपि द्युमणिः पद्मानामानन्दप्रदाता । अरुणः सूर्यसा रथिस्त्रच्छ्रिया
    परीताग्रभागः । काले काले शुक्लपक्षतिथिषु चन्द्रस्य वृद्धिकरणे प्रवीणः । आकाशमध्यस्थः सन् । तारौघशोभा
    तिरस्करोति ॥ नित्यं स्नेहातिरेकानिजकमितुरलं विप्रयोगाक्षमा या वक्त्रेन्दोरन्तराले कृतवसतिरिवाभाति
    नक्षत्रराजिः । लक्ष्मीकान्तस्य कान्ताकृतिरतिविलसन्मुग्धमुक्ताफलश्री दन्ताली संततं सा नतिनुतिनिरतान्रक्षतादक्षता
    नः ॥ ३६ ।। सा लक्ष्मीकान्तस्य दन्ताली दन्तपङ्किर्नतिनुतिनिरतान्नमस्कारस्तुतितत्परान्नोऽस्मा न्संततं
    रक्षतात् । किंलक्षणा । अक्षता क्षतरहिता । निरन्तरेति यावत् । कान्ताकृति र्मनोहराकारा । तथातिविलसतामत्यन्तशोभिनां
    मुग्धानां सुन्दराणां मुक्ताफलानां विष्णुपादादिकेशान्तवर्णनस्तोत्रम् । श्रीरिव श्रीर्यस्याः या नियं
    स्नेहातिरेकात्प्रेमबाहुल्यान्निजकमितुः खकान्तस्य विप्रयोगं वियोगं न क्षमते सा विप्रयोगाक्षमा । एवंभूता
    सती वक्रेन्दोर्मुखचन्द्रस्यान्तराले मध्ये कृतवसतिर्नक्षत्रराजिरिवालमाभाति ॥ ब्रह्मन्ब्रह्मण्यजिह्मां
    मतिमपि कुरुषे देव संभावये त्वां शंभो शक त्रिलोकीमवसि किममरैर्नारदाद्याः सुखं वः । इत्थं सेवावनम्रं
    सुरमुनिनिकरं वीक्ष्य विष्णोः प्रसन्न स्यास्येन्दोरास्रवन्ती वरवचनसुधा ह्लादयेन्मानसं नः ॥ ३७ ।। विष्णोरास्येन्दोर्मुखचन्द्रादास्रवन्ती
    सम्यङ्ति सरन्ती वरा श्रेष्ठा वचनसुधा वचनामृतं नोऽस्माकं मानसं हादयेत् सुखयतु । इति वा छेदः । किंलक्षणस्य
    । सेवावनम्रं सुरमुनिनिकरं वीक्ष्य प्रसन्नस्य । अनुग्रहेच्छोरित्यर्थः । का वचनसुधा । हे ब्रह्मन्प्रजापते
    ब्रह्मणि स्वस्वरूपेऽजिह्मामकुटिलां तादात्म्यलक्षणां मतिमपि कुरुषे । हे देव शंभो त्वां संभावये । कुशलं
    पृच्छामीत्यर्थः । हे शक्र अमरैः सह त्रिलोकीमवसि किम् । सम्यक्पालग्रसीलर्थः । हे नारदाद्या मुनयः वो
    युष्माकं किं सुखं वर्तते ॥ कर्णस्थस्वर्णकम्रोज्ज्वलमकरमहाकुण्डलप्रोतदीप्य न्माणिक्यश्रीप्रतानैः परिमिलितमलिश्यामलं
    कोमलं यत् । प्रोद्यत्सूर्यांशुराजन्मरकतमुकुराकारचोरं मुरारे र्गाढामागामिनीं नो गमयतु विपदं गण्डयोमण्डलं
    तत् ॥ ३८॥ मुरारेर्नारायणस्य तद्गण्डयोः कपोलयोमण्डलं नोस्माऽकं गाढां दृढामनेकानर्थकरीमा गामिनीं भाविनीं
    विपदं गमयतु दूरीकरोतु । इति वा पाठः। किंलक्षणम् । प्रोयन्प्रादुर्भवन्यः सूर्यस्तस्यांशुवदाजद्दीप्यमानं
    यन्मरकतरत्नं तन्निर्मितो मुकुरो दर्प णस्तस्य य आकारस्तस्य चोरम् । तत्सदृशमित्यर्थः । कोमलम् । अलिवच्छ्यामलम्
    । तथा कर्णस्थयोः वर्णमययोः कम्रयोः कमनीययोरुज्ज्वलयोर्मकराकारयोर्महाकुण्डलयोः प्रोतानां दीप्यतां माणिक्यानां
    श्रीप्रतानैः परिमिलितं परितो व्याप्तम् ॥ वक्राम्भोजे लसन्तं मुहुरधरमणिं पक्वबिम्बाभिरामं दृष्ट्वा
    दष्टुं शुकस्य स्फुटमवतरतस्तुण्डदण्डायते यः । घोणः शोणीकृतात्मा श्रवणयुगलसत्कुण्डलोस्रैर्मुरारेः प्राणाख्यस्यानिलस्य
    प्रसरणसरणिः प्राणदानाय नः स्तात् ॥ ३९ ॥ मुरारेर्घोणो नासिकादण्डो नोऽस्माकं प्राणदानाय जीवनं दातुं
    स्वाद्भूयात् । कथं भूतः । श्रवणयुगे लसतोः कुण्डलयोरुस्रै किरणैः शोणीकृतात्मा । प्राणाख्यस्यानिलस्य
    प्राणवायोः प्रसरणसरणिः । संचारमार्ग इत्यर्थः । यो वक्राम्भोजे लसन्तं पक्वबिम्बफलव काव्यमाला। दभिराममारक्तमधरमणि
    मुहुर्दृष्ट्वा पुनःपुनरवलोक्य दष्टुं खादितुमवतरतः शुकस्य कीरस्य स्फुटं यथा स्यात्तथा तुण्डद्ण्डायते
    चञ्चदण्डवदाचरंस्तिष्ठति ॥ दिक्कालौ वेदयन्तौ जगति मुहुरिमौ संचरन्तौ रवीन्दू त्रैलोक्यालोकदीपावभिदधति
    ययोरेव रूपं मुनीन्द्राः । अस्मानब्जप्रभे ते प्रचुरतरकृपानिर्भरं प्रेक्षमाणे पातामाताम्रशुक्लासितरुचिरुचिरे
    पद्मनेत्रस्य नेत्रे ॥ ४० ॥ पद्मनेत्रस्य पुण्डरीकाक्षस्य नेत्रे अस्मान्पातां रक्षताम् । किंलक्षणे ।
    अब्जप्रमे । तथा प्रचुरतरा या कृपा तया निर्भरं परिपूर्णं यथा स्यात्तथा प्रेक्षमाणे । भक्तानिति शेषः
    । तथाताम्रेषद्रका शुक्ला सिता च या रुचिः कान्तिस्तया रुचिरे । ते के । मुनीन्द्रा ययोरेव रूपमिमौ प्रसिद्धौ
    रवीन्दू अभिदधति वदन्ति । किंलक्षणौ रवीन्दू । जगति दिक्प्राच्या कालो मुहूर्तादिः । तौ वेदयन्तौ प्रकाशयन्तौ
    । अत एव त्रैलोक्यालोकदीपौ। तथा मुहुः प्रसहोरात्रं संचरन्तौ भ्रमन्तौ ॥ लक्ष्माकारालकालिस्फुरदलिकशशाशर्घसंदर्शमील
    न्नेत्राम्भोजप्रबोधोत्सुकनिभृततरालीनभृङ्गच्छदाभे । लक्ष्मीनाथस्य लक्षीकृतविबुधगणापाङ्गबाणासनार्घ च्छाये
    नो भूतिभूरिप्रसवकुशलते भ्रूलते पालयेताम् ॥ ११ ॥ लक्ष्मीनाथस्य भूलते नोऽस्मान्पालयेताम् । कथंभूते ।
    लक्ष्माकाराश्चिह्नाकृतयो येऽलकास्तेषामालिस्तया स्फुरद्यदलिकं ललाटं तदेव शशाङ्कार्घं तस्य संदर्शनेन
    मीलन्ती ये नेत्राम्भोजे तयोः प्रबोधे विकासननिमित्तमुत्सुकरतथा निभृततरमालीनो यो भृङ्गस्तस्य छदौ पक्षौ
    तद्वदाभा ययोः । तथा लक्षीकृतो विबुधगणो यैस्तेषामपाङ्गबाणानां यदसनं धनुस्तस्यार्धच्छाये । धनुरर्धभागसदृश
    इत्यर्थः । तथा भूतीनामैश्वर्याणां यो भूरिप्रस्रवो ऽधिकोद्भूतिस्तत्र कुशलता सामर्थ्य ययोः । भक्तानां
    सर्वाभीष्टप्रद इत्यर्थः ॥ पातात्पातालपातात्पतगपतिगतेर्भ्रूयुगं भुग्नमध्यं येनेषच्चालितेन खपदनियमिताः
    सासुरा देवसंघाः । नृत्यल्लालाटरङ्गे रजनिकरतनोरर्धखण्डावदाते कालव्यालद्वयं वा विलसति समया बालिकामातरं
    नः ॥ १२ ॥ पतगपतिर्गरुडस्तेन गतिर्गमनं यस्य तस्य भगवतो भूयुगं नोऽस्मान्पातालपातान्नरक पतनात्याताद्रक्षतात्
    । कीदृशम् । भुग्नमध्यम् । येनेषच्चालितेन सासुरा देवसंघाः खपदे खखस्थाने व्यापारे च नियमिता वर्तन्ते
    । उत्प्रेक्षते ललाटमेव लालाटं तदेव रङ्गो नृत्यस्थानं तस्मिन्बालिकामातरं समया नृत्यत्कालव्यालद्वयं
    वा । वाशब्द इवार्थः । समया विष्णुपादादिकेशान्तवर्णनस्तोत्रम् । शब्दो नैकट्यवाची । बालिकाशब्दः शङ्कास्ध्नोरुपरिभ्रूलतापुच्छदेशवाचकः
    कपोलप्रान्त गताग्रकुन्तलपुञ्जविशेषवाचको वा । सा बालिकासर्पमातृत्वेनोत्प्रेक्षिता । किंभूते लाला टरङ्गे
    । रजनिकरतनोश्चन्द्रमण्डलस्यार्धखण्डवदर्धभागवदवदाते निर्मले ॥ रूक्षस्मारेक्षुचापच्युतशरनिकरक्षीणलक्ष्मीकटाक्ष
    प्रोत्फुल्लत्पद्ममालाविलसितमहितस्फाटिकेशानलिङ्गम् । भूयाद्भूयो विभूत्यै मम भुवनपतेर्भ्रूलताद्वन्द्वमध्या
    दुत्थं तत्पुण्ड्रमूर्ध्व जनिमरणतमःखण्डनं मण्डनं च ॥ ४३ ॥ भुवनपतेर्भगवतस्तदूर्ध्वं पुण्डूं तिलकं मम
    भूयो विभूत्या अधिकैश्वर्याय भूयात् । किं लक्षणम् । जनिमरणतमःखण्डनम् । जन्ममरणकारणाज्ञानरूपतमोनाशकमित्यर्थः
    । भ्रूलताद्वन्द्वमध्यादुत्थं स्वयमेवोद्भूतं स्फाटिकेशानलिङ्गं स्फटिकमणिमयशिवलिङ्गमिव । रूक्षः कुरो
    यः स्मारेक्षुचापात्कामसंबन्धीक्षुकोदण्डाच्च्युतः शरनिकरस्तेन क्षीणं कृशमे वंविधं तत् लक्ष्मीकटाक्षेत्यादि
    चेति कर्मधारयः । लक्ष्मीकटाक्षा एव प्रोत्फुल्लद्वि कसत्पदानां माला तया विलसितमुज्जृम्भितं महितं महत्त्वं
    यस्य तच्च तत्स्फटिके शानलिङ्गं च ॥ पीठीभूतालकान्ते कृतमुकुटमहादेवलिङ्गप्रतिष्ठे लालाटे नाट्यरङ्गे
    विकटतरतटे कैटभारेश्चिराय । प्रोध्दात्यैवात्मतन्द्रीप्रकटपटकुटीं प्रस्फुरन्तीं स्फुटाङ्गं पट्वीयं भावनाख्यां
    चटुलमति नटी नाटिकां नाटयेन्नः ॥ ४४ ॥ कैटभारेर्भगवतो ललाटमेव लालाटं तस्मिन्नाट्यरङ्गे नोऽत्माकमियं
    खभावसिद्धा चटुला चपला मतिरेव नटी नर्तकी भावनाख्यां भावनानाम्नीं नाटिकां खकन्यां चिराय दीर्घकालं नाटयेन्नर्तयेत्
    । अस्मन्मतिर्भगवल्ललाटे ध्यानात्मिकां वृत्तिं नैरन्तर्येण प्रवर्तयेदित्यर्थः । किंलक्षणा । पट्वी चतुरा।
    किं कृत्वा । आत्मतन्द्री खालस्यं तद्रूपां प्रकटपटकुटीं प्रसिद्धावरणपटं प्रोद्धाट्य । आलस्यरूपनिबिडतिरस्करिणीमपसार्येत्यर्थः
    । किंलक्षणां नाटिकाम् । स्फुटाङ्गं प्रस्फुरन्तीम् । कथंभूते नाट्यरङ्गे । पीठीभूतः पीठतां गतो योऽलकान्तः
    केशोद्गमप्रान्तदेशो ललाटोपरिरेखा तत्र कृता मुकुटलक्षणमहा देवलिङ्गस्य प्रतिष्ठा यस्मिन् । तथा विकटतरतटेऽतिशयेन
    विशालतटे ॥ मालालीवालिधाम्नः कुवलयकलिता श्रीपतेः कुन्तलाली कालिन्द्यारुह्य मूर्घ्नो गलति हरशिरःखर्धुनीस्पर्धया
    नु । राहुर्वा याति वक्रं सकलशशिकलाभ्रान्तिलोलान्तरात्मा लोकैरालोच्यते या प्रदिशतु सकलैः साखिलं मङ्गलं
    नः ॥ ४५ ॥ काव्यमाला। अलिवच्छ्यामलं घाम तेजो यस्य तस्य श्रीपतेः सा कुन्तलाली नोऽस्माकमखिलं मङ्गलं प्रदिशतु
    । या सकलैर्लोकः कुवलयकलिता नीलोत्पलरचिता मालाली माला परंपरेव । अथवा कालिन्दी यमुना हरशिरःखर्धुनीस्पर्धया
    महादेवमस्तकस्थगङ्गेयया भगवन्मूर्धानमारुह्य ततो गलति नु । यद्वा सकला चासौ शशिकला शशिप्रकाश स्तदाकारभ्रान्तियुक्तश्चासौ
    लोलश्चपलोऽन्तरात्मा मनो यस्यैतादृशो राहुर्वेत्यालोच्यत उत्प्रेक्ष्यते ॥ सुप्ताकाराः प्रसुप्ते भगवति
    विबुधैरप्यदृष्टवरूपा व्याप्तव्योमान्तरालास्तरलरुचिजलारञ्जिताः स्पष्टभासः । देहच्छायोद्गमाभा रिपुवपुरगुरुप्लोषरोषाग्निधूम्याः
    केशाः केशिद्विषो नो विदधतु विपुलक्लेशपाशप्रणाशम् ॥ ४६॥ केशिद्विषः केशिनामकासुरहन्तुर्भगवतः केशा नोऽस्माकं
    विपुला बहुला ये क्लैशा अविद्यास्मितारागद्वेषाभिनिवेशास्त्र एव पाशास्तेषां प्रकर्षेण नाशं विदधतु ।
    किंलक्षणाः। भगवति प्रसुप्ते सुप्ताकाराः सुप्तस्य भगवत आकार इवाकारो येषां ते । अत एव विबुधै रपि न दृष्टं
    स्वरूपं येषां ते तथाविधाः । तथा व्याप्तं व्योमान्तरालं ब्रह्माण्डोदरं यैः। तथा तरलानि चपलानि रुचिमन्त्युज्ज्वलानि
    च जलानि क्षीरसागरनीराणि तैरासम न्ताद्रञ्जिताः । स्पष्टभासः । देहस्य श्रीमन्मूर्तेश्छाया कान्तिस्तस्या
    उद्गम उपरिप्र चारस्तद्वदाभान्ति ते । रिपूणां वपूंष्येवागुरुस्तस्य प्लोषो दाहस्तस्मिनरोषरूपो योऽग्निस्तस्य
    धूम्या धूमसमूह इव । एतैर्विशेषणैः केशानां मेघसाम्यं ध्वनिनम् । इति पुराणप्रसिद्ध्या ॥ यत्र प्रत्युप्तरत्नमवरपरिलसद्भूरिरोचिःप्रतान
    स्फूर्त्या मूर्तिर्मुरारेद्युमणिशतचितव्योमवहुनिंरीक्ष्या । कुर्वत्पारेपयोधि ज्वलदकृतमहाभाखदौर्वाग्निशङ्कां
    शश्वन्नः शर्म दिश्यात्कलिकलुषतमःपाटनं तत्किरीटम् ॥ ४७ ।। तन्मुरारेः किरीटं नोऽस्माकं शश्वच्छम दिश्यात्
    । कथंभूतम् । कलिकल्लुषतमः पाटनम् । पारेपयोधि समुद्रमध्ये ज्वलन्नकृत्रिमो महान्प्रौढो भाखान्प्रकाशबहुलश्च
    य और्वाग्निर्वाढवानलस्तस्य शङ्कां कुर्वत् यत्र किरीटे प्रत्युप्तानां खचितानांर्त्नप्रवराणां परितो
    लसद्भूर्यधिक योचिस्यानो विस्तारस्तस्य स्फूर्त्या स्फुरणेन मुरारेर्मुर्तिर्द्यु मणिशतचितव्योमवद्युगपदुदितानेकसूर्यव्याप्ताकाशवद्दुर्निरीक्ष्या
    दुष्प्रेक्ष्या तत् ॥ भ्रान्त्वा भ्रान्त्वा यदन्तस्त्रिभुवनगुरुरप्यब्दकोटीरनेका गन्तुं नान्तं समर्थो
    भ्रमर इव पुनर्नाभिनालीकनालात् । विष्णुपादादिकेशान्तवर्णनस्तोत्रम् । उन्मज्जन्नूर्जितश्रीस्त्रिभुवनमपरं
    निर्ममे तत्सदृक्षं देहाम्भोधिः स देयान्निरव घिरमृतं दैत्यविद्वेषिणो नः ॥४८॥ दैत्यविद्वेषिणो नारायणस्य
    स देहाम्भोधिर्नोऽस्मभ्यममृतं कैवल्यं देयात् । त्रिभुव नगुरुस्त्रैलोक्यपिता ब्रह्मापि यदन्तर्मध्येऽनेका
    असंख्याता अब्दकोटीः । अनेककोटिसं वत्सरपर्यन्तमित्यर्थः । भ्रान्वा भ्रान्ता बहुशो विभ्रम्यान्तमवसानं
    गन्तुं प्राप्तुं न सम र्थोऽभूदित्यध्याहारः । पुनरन्तप्राप्त्याशाविच्छेदानन्तरं नाभिनालीकनालामर इवोन्म
    ज्जन्नपरं त्रिभुवनं तत्सदक्षं निर्ममे । किंलक्षणः । ऊर्जितश्रीः । कथंभूतो नेहाम्भोधिः । निरवधिः॥ मत्स्यः
    कूर्मो वराहो नरहरिणपतिमिनो जामदग्न्य काकुत्स्थः कंसघाती मनसिजविजयी यश्च कल्की भविष्यन् । विष्णोरंशावतारा
    भुवनहितकरा धर्मसंस्थापनार्थाः पायासुर्मां त एते गुरुतरकरुणाभारखिन्नाशया ये ॥४९॥ हरिणपतिः सिंहः । नरश्चासौ
    हरिणपतिश्चेति विग्रहान्नरसिंहः । कंसघाती कृष्णः । मनसिजविजयी मारजित्तपखिवेषो भगवान्बुद्धः । भविष्यन्कलियुगान्ते
    । अन्यत्स्फु टम् । विष्णोरेर्तेऽशावताराः । भुवनहितकराः। यतो धर्मसंस्थापनार्थाः । तथा गुरुत रेण करुणाभारेण
    खिन्नः खेदं प्राप्तः । परवशीकृत इत्यर्थः । आशयोऽन्तःकरणं येषां ते मां भक्तं पायासुः॥ यस्माद्वाचो निवृत्ताः
    सममपि मनसा लक्षणामीक्षमाणाः खार्थालाभात्परार्थव्यपगमकथनश्लाघिनो वेदवादाः । नित्यानन्दं खसंविनिरवधिममृतं
    खान्तसंक्रान्तबिम्ब च्छायापत्त्यापि नित्यं सुखयति यमिनो यत्तदव्यान्महो नः ॥५०॥ तन्महस्तेजो नोऽस्मान्सदाव्यात्
    । यत्मान्मनसा समं वाचोऽपि निवृत्ताः । तदि दमेवेति बोधयितुमसमर्थाः । किंलक्षणाः । लक्षणा मुख्यवृत्तेर्वृत्त्यन्तरं
    तामीक्षमाणा आकाङ्क्षमाणाः । कस्मात् । वेदलक्षणवादाः खार्थस्य शक्तिविषयस्यार्थस्यालाभात्परे च तेऽर्थास्तेषां
    व्यपगमो निरसनं तत्कथनेन श्लाघा येषां ते । किंलक्षणं महः । नित्यानन्दम् । खसंवित्खयं प्रकाशकम् । तथा
    निरवधिं निरवधिकम् । ककारोऽत्र लुप्तो इष्टव्यः । अमृतमपरिणामि । कूटस्थमित्यर्थः । अपि च यन्महः खान्तमन्तःकरणं
    तत्र संक्रान्ता बिम्बच्छाया बिम्बाकृतिस्तदापत्त्यापि तावन्मानप्राध्यापि यमिनो यतीन्नित्यं सुखय त्यानन्दयति
    ॥ आ पादादा च शीर्ष्णो वपुरिदमनघं वैष्णवं यः खचित्ते धत्ते नित्यं निरस्ताखिलकलिकलुषे संततान्तःप्रमोदः
    । काव्यमाला। जुह्वज्जिह्वाकृशानौ हरिचरितहविः स्तोत्रमन्त्रानुपाठे स्तत्पादाम्भोरुहाभ्यां सततमपि नमस्कुर्महे
    निर्मलाभ्याम् ॥ ५१ ।। आ पादात्पादमारभ्य शिरःपर्यन्तमिदं पूर्ववर्णितं वैष्णवं वपुर्विष्णु स्वरूपं ये
    निरस्ताखिलकलिकलुषे खचित्ते संततान्तःप्रमोद आनन्दभरितान्तःकरणः सन् नित्यं धत्ते निर्मलाभ्यां तत्पादाम्भोरुहाभ्यामपि
    वयं नमस्कुर्महे । किं कुर्वन् । स्तोत्रमन्त्रानुपाठैर्जिह्वाकृशानौ जिह्वारूपेऽग्नौ हरिचरितहविः सततं
    जुह्वत् । हरिचरि तानि तत्स्तोत्राणि च सदा पठन्नित्यर्थः । इति भगवत्पादश्रीशंकराचार्यकृतं विष्णुपादादिकेशान्तवर्णनस्तोत्रं
    सटिप्पणं समाप्तम् ।
