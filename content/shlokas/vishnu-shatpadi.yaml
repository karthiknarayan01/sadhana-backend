id: vishnu-shatpadi
category: stotram
name:
  english: Vishnu Shatpadi
content:
  english: avinayamapanaya vishno damaya manah shamaya vishayamrigatrishnam | bhutadayam vistaraya taraya
    samsarasagaratah || || divyadhunimakarande parimalaparibhogasaccidanande | shripatipadaravinde bhavabhayakhedacchide
    vande || || satyapi bhedapagame natha tava'ham na mamakinastvam | samudro hi tarangah kvacana samudro
    na tarangah || || uddhritanaga nagabhidanuja danujakulamitra mitrashashidrishte | drishte bhavati
    prabhavati na bhavati kim bhavatiraskarah || || matsyadibhiravatarairavataravata'vata sada vasudham
    | parameshvara paripalyo bhavata bhavatapabhito'ham || || damodara gunamandira sundaravadanaravinda
    govinda | bhavajaladhimathanamandara paramam daramapanaya tvam me || || narayana karunamaya sharanam
    karavani tavakau caranau | iti shatpadi madiye vadanasaroje sada vasatu || iti shrimaccankaracarya
    viracitam shri vishnu shatpadi stotram sampurnam
  devanagari: अविनयमपनय विष्णो दमय मनः शमय विषयमृगतृष्णाम् । भूतदयां विस्तारय तारय संसारसागरतः ॥ ॥ दिव्यधुनीमकरन्दे
    परिमलपरिभोगसच्चिदानन्दे । श्रीपतिपदारविन्दे भवभयखेदच्छिदे वन्दे ॥ ॥ सत्यपि भेदापगमे नाथ तवाऽहं न मामकीनस्त्वम्
    । सामुद्रो हि तरङ्गः क्वचन समुद्रो न तारङ्गः ॥ ॥ उद्धृतनग नगभिदनुज दनुजकुलामित्र मित्रशशिदृष्टे ।
    दृष्टे भवति प्रभवति न भवति किं भवतिरस्कारः ॥ ॥ मत्स्यादिभिरवतारैरवतारवताऽवता सदा वसुधाम् । परमेश्वर
    परिपाल्यो भवता भवतापभीतोऽहम् ॥ ॥ दामोदर गुणमन्दिर सुन्दरवदनारविन्द गोविन्द । भवजलधिमथनमन्दर परमं दरमपनय
    त्वं मे ॥ ॥ नारायण करुणामय शरणं करवाणि तावकौ चरणौ । इति षट्पदी मदीये वदनसरोजे सदा वसतु ॥ इति श्रीमच्चङ्कराचार्य
    विरचितं श्री विष्णु षट्पदी स्तोत्रं सम्पूर्णम्
