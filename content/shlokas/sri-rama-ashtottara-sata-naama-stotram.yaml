id: sri-rama-ashtottara-sata-naama-stotram
category: stotram
name:
  english: Sri Rama Ashtottara Sata Naama Stotram
content:
  english: shriramo ramabhadrashca ramacandrashca shashvatah | rajivalocanah shrimanrajendro raghupungavah
    || || janakivallabho jaitro jitamitro janardanah | vishvamitrapriyo dantah sharanatranatatparah ||
    || valipramathano vagmi satyavaksatyavikramah | satyavrato vratadharah sadahanumadashritah || || kausaleyah
    kharadhvamsi viradhavadhapanditah | vibhishanaparitrata harakodandakhandanah || || saptatalaprabhetta
    ca dashagrivashiroharah | jamadagnyamahadarpadalanastatakantakah || || vedantasaro vedatma bhavarogasya
    bheshajam | dushanatrishirohanta trimurtistrigunatmakah || || trivikramastrilokatma punyacaritrakirtanah
    | trilokarakshako dhanvi dandakaranyakartanah || || ahalyashapashamanah pitribhakto varapradah | jitendriyo
    jitakrodho jitamitro jagadguruh || || rikshavanarasanghati citrakutasamashrayah | jayantatranavaradah
    sumitraputrasevitah || || sarvadevadidevashca mritavanarajivanah | mayamaricahanta ca mahadevo mahabhujah
    || || sarvadevastutah saumyo brahmanyo munisamstutah | mahayogi mahodarah sugrivepsitarajyadah ||
    || sarvapunyadhikaphalah smritasarvaghanashanah | adipurushah paramapurusho mahapurusha eva ca ||
    || punyodayo dayasarah puranapurushottamah | smitavaktro mitabhashi purvabhashi ca raghavah || ||
    anantagunagambhiro dhirodattagunottamah | mayamanushacaritro mahadevadipujitah || || setukrijjitavarashih
    sarvatirthamayo harih | shyamangah sundarah shurah pitavasa dhanurdharah || || sarvayajnadhipo yajva
    jaramaranavarjitah | shivalingapratishthata sarvavagunavarjitah || || paramatma param brahma saccidanandavigrahah
    | paranjyotih parandhama parakashah paratparah || || pareshah paragah parah sarvadevatmakah parah
    || evam shriramacandrasya namnamashtottaram shatam iti shri ramashtottara shatanamastotram sampurnam
  devanagari: श्रीरामो रामभद्रश्च रामचन्द्रश्च शाश्वतः । राजीवलोचनः श्रीमान्राजेन्द्रो रघुपुङ्गवः ॥ ॥
    जानकीवल्लभो जैत्रो जितामित्रो जनार्दनः । विश्वामित्रप्रियो दान्तः शरणत्राणतत्परः ॥ ॥ वालिप्रमथनो वाग्मी
    सत्यवाक्सत्यविक्रमः । सत्यव्रतो व्रतधरः सदाहनुमदाश्रितः ॥ ॥ कौसलेयः खरध्वंसी विराधवधपण्डितः । विभीषणपरित्राता
    हरकोदण्डखण्डनः ॥ ॥ सप्ततालप्रभेत्ता च दशग्रीवशिरोहरः । जामदग्न्यमहादर्पदलनस्ताटकान्तकः ॥ ॥ वेदान्तसारो
    वेदात्मा भवरोगस्य भेषजम् । दूषणत्रिशिरोहन्ता त्रिमूर्तिस्त्रिगुणात्मकः ॥ ॥ त्रिविक्रमस्त्रिलोकात्मा
    पुण्यचारित्रकीर्तनः । त्रिलोकरक्षको धन्वी दण्डकारण्यकर्तनः ॥ ॥ अहल्याशापशमनः पितृभक्तो वरप्रदः । जितेन्द्रियो
    जितक्रोधो जितामित्रो जगद्गुरुः ॥ ॥ ऋक्षवानरसङ्घाती चित्रकूटसमाश्रयः । जयन्तत्राणवरदः सुमित्रापुत्रसेवितः
    ॥ ॥ सर्वदेवादिदेवश्च मृतवानरजीवनः । मायामारीचहन्ता च महादेवो महाभुजः ॥ ॥ सर्वदेवस्तुतः सौम्यो ब्रह्मण्यो
    मुनिसंस्तुतः । महायोगी महोदारः सुग्रीवेप्सितराज्यदः ॥ ॥ सर्वपुण्याधिकफलः स्मृतसर्वाघनाशनः । आदिपुरुषः
    परमपुरुषो महापूरुष एव च ॥ ॥ पुण्योदयो दयासारः पुराणपुरुषोत्तमः । स्मितवक्त्रो मिताभाषी पूर्वभाषी च
    राघवः ॥ ॥ अनन्तगुणगम्भीरो धीरोदात्तगुणोत्तमः । मायामानुषचारित्रो महादेवादिपूजितः ॥ ॥ सेतुकृज्जितवाराशिः
    सर्वतीर्थमयो हरिः । श्यामाङ्गः सुन्दरः शूरः पीतवासा धनुर्धरः ॥ ॥ सर्वयज्ञाधिपो यज्वा जरामरणवर्जितः
    । शिवलिङ्गप्रतिष्ठाता सर्वावगुणवर्जितः ॥ ॥ परमात्मा परं ब्रह्म सच्चिदानन्दविग्रहः । परञ्ज्योतिः परन्धाम
    पराकाशः परात्परः ॥ ॥ परेशः पारगः पारः सर्वदेवात्मकः परः ॥ एवं श्रीरामचन्द्रस्य नाम्नामष्टोत्तरं शतम्
    इति श्री रामाष्टोत्तर शतनामस्तोत्रं सम्पूर्णम्
