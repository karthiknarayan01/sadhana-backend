id: sudarshanakavacam-4
category: kavacha
name:
  english: sudarshanakavacam 4
  devanagari: सुदर्शनकवचम् ४
content:
  english: gopikasamakirno venuvadanatatparah || 7|| kamarupi kalavamshca kaminyam kamado vibhuh | manmatho
    mathuranatho madhavo makaradhvajah || 8|| shridharah shrikarashcaiva shrinivasah satam gatih | bhuktido
    muktido vishnurbhudharo bhutabhavanah || 9|| sarvaduhkhaharo viro dushtadaityavinashakah | shrinrisimho
    mahavishnuh shrinivasah satam gatih || 10|| cidanandamayo nityah purnabrahmasanatanah | kotibhanuprakashi
    ca nishcitarthasvarupakah || 11|| bhaktapriyah padmanetro bhaktanam vanchitapradah | hridi krishno
    mukhe krishno netre krishnashca karnayoh || 12|| bhaktipriyashca shrikrishnah sarvam krishnamayam
    jagat | kalamrityuyamahutam bhutapreto na drishyate || 13|| pishaca rakshasashcaiva hridi rogashca
    darunah | bhucarah khecarah sarve dakini shakini tatha || 14|| natakam cetakam caiva chalam chidram
    na drishyate | akale maranam tasya shokaduhkham na labhyate || 15|| sarvavighnam kshayam yati raksha
    me gopikapriya | bhayadavagnicauranam vigrahe rajasankate || 16|| vyala
  devanagari: गोपिकासमाकीर्णो वेणुवादनतत्परः ॥ ७॥ कामरूपी कलावांश्च कामिन्यां कामदो विभुः । मन्मथो मथुरानाथो
    माधवो मकरध्वजः ॥ ८॥ श्रीधरः श्रीकरश्चैव श्रीनिवासः सतां गतिः । भुक्तिदो मुक्तिदो विष्णुर्भूधरो भूतभावनः
    ॥ ९॥ सर्वदुःखहरो वीरो दुष्टदैत्यविनाशकः । श्रीनृसिंहो महाविष्णुः श्रीनिवासः सतां गतिः ॥ १०॥ चिदानन्दमयो
    नित्यः पूर्णब्रह्मसनातनः । कोटिभानुप्राकाशी च निश्चितार्थस्वरूपकः ॥ ११॥ भक्तप्रियः पद्मनेत्रो भक्तानां
    वाञ्छितप्रदः । हृदि कृष्णो मुखे कृष्णो नेत्रे कृष्णश्च कर्णयोः ॥ १२॥ भक्तिप्रियश्च श्रीकृष्णः सर्वं
    कृष्णमयं जगत् । कालमृत्युयमाहूतं भूतप्रेतो न दृश्यते ॥ १३॥ पिशाचा राक्षसाश्चैव हृदि रोगाश्च दारुणाः
    । भूचराः खेचराः सर्वे डाकिनी शाकिनी तथा ॥ १४॥ नाटकं चेटकं चैव छलं छिद्रं न दृश्यते । अकाले मरणं तस्य
    शोकदुःखं न लभ्यते ॥ १५॥ सर्वविघ्नं क्षयं याति रक्ष मे गोपिकाप्रिय । भयदावाग्निचौराणां विग्रहे राजसङ्कटे
    ॥ १६॥ व्याल
