id: durgakavacam-4
category: kavacha
name:
  english: durgakavacam 4
  devanagari: दुर्गाकवचम् ४
content:
  english: kamalam patu nityam nabhogatam | mahakundalini nityam patu me jatharam shiva || 7|| vahnijaya
    sada yajnam patu karma svadha punah | aranye vijane patu durga devi rane vane | jale patu jaganmata
    devi tribhuvaneshvari || 8|| ityevam kavacam devi durjneyam rajamohanam | japenmatram kshititale vashyam
    yati mahipatih || 9|| pujaya varaya bhaktya kriyaya ca vina shive
  devanagari: कमलं पातु नित्यं नभोगतम् । महाकुण्डलिनी नित्यं पातु मे जठरं शिवा ॥ ७॥ वह्निजाया सदा यज्ञं
    पातु कर्म स्वधा पुनः । अरण्ये विजने पातु दुर्गा देवी रणे वने । जले पातु जगन्माता देवी त्रिभुवनेश्वरी
    ॥ ८॥ इत्येवं कवचं देवि दुर्ज्ञेयं राजमोहनम् । जपेन्मत्रं क्षितितले वश्यं याति महीपतिः ॥ ९॥ पूजया वरया
    भक्त्या क्रियया च विना शिवे
meaning: {}
