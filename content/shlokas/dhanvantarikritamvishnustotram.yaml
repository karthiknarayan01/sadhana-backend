id: dhanvantarikritamvishnustotram
category: stotram
name:
  english: dhanvantarikritamvishnustotram
  devanagari: धन्वन्तरिकृतंविष्णुस्तोत्रम्
content:
  english: dhanvantarikritam vishnustotram dhanvantariruvaca | jaya vishno jayacintya jaya jishno jayacyuta
    | jaya gopala lakshmisha jaya krishna jaganmaya || 29|| jaya bhutapate natha jaya pannagashayine |
    jaya sarvaga govinda jaya vishvakrite namah || 30|| jaya vishvabhuje deva jaya vishvadhrite namah
    | jayesha sadasattvam vai jaya madhava dharmine || 31|| jaya kamada kama tvam jaya rama gunarnava
    | jaya pushtida pushtisha jaya kalyanadayine || 32|| jaya bhutapa bhutesha jaya manavidhayine | jaya
    karmada karma tvam jaya pitambaracchada || 33|| jaya sarvesha sarvastvam jaya mangalarupine | jaya
    sattvadhinathaya jaya vedavide namah || 34|| jaya janmada janmistha paramatmannamo'stu te | jaya muktida
    muktistvam jaya bhuktida keshava || 35|| jaya lokada lokesha jaya papavinashana | jaya vatsala bhaktanam
    jaya cakradhrite namah || 36|| jaya manada manastvam jaya lokanamaskrita | jaya dharmada dharmastvam
    jaya samsaraparaga || 37|| jaya annada annam tvam jaya vacaspate namah | jaya shaktida shaktistvam
    jaya jaitravaraprada || 38|| jaya yajnada yajnastvam jaya padmadalekshana | jaya danada danam tvam
    jaya kaitabhasudana || 39|| jaya kirtida kirtistvam jaya murtida murtidhrik | jaya saukhyada saukhyatmanjaya
    pavanapavana || 40|| jaya shantida shantistvam jaya shankarasambhava | jaya panada panastvam jaya
    jyotihsvarupine || 41|| jaya vamana vittesha jaya dhumapatakine | jaya sarvasya jagato datrimurte
    namo'stu te || 42|| tvameva lokatrayavartijivanikayasankleshavinashadakshah | shripundarikaksha kripanidhe
    tvam nidhehi panim mama murdhni vishno || 43|| iti brahmapurane dvavimshadhikashatatamadhyayantargatam
    dhanvantarikritam vishnustotram samaptam | brahmapurana | adhyaya 122
  devanagari: धन्वन्तरिकृतं विष्णुस्तोत्रम् धन्वन्तरिरुवाच । जय विष्णो जयाचिन्त्य जय जिष्णो जयाच्युत ।
    जय गोपाल लक्ष्मीश जय कृष्ण जगन्मय ॥ २९॥ जय भूतपते नाथ जय पन्नगशायिने । जय सर्वग गोविन्द जय विश्वकृते
    नमः ॥ ३०॥ जय विश्वभुजे देव जय विश्वधृते नमः । जयेश सदसत्त्वं वै जय माधव धर्मिणे ॥ ३१॥ जय कामद काम
    त्वं जय राम गुणार्णव । जय पुष्टिद पुष्टीश जय कल्याणदायिने ॥ ३२॥ जय भूतप भूतेश जय मानविधायिने । जय
    कर्मद कर्म त्वं जय पीताम्बरच्छद ॥ ३३॥ जय सर्वेश सर्वस्त्वं जय मङ्गलरूपिणे । जय सत्त्वाधिनाथाय जय वेदविदे
    नमः ॥ ३४॥ जय जन्मद जन्मिस्थ परमात्मन्नमोऽस्तु ते । जय मुक्तिद मुक्तिस्त्वं जय भुक्तिद केशव ॥ ३५॥ जय
    लोकद लोकेश जय पापाविनाशन । जय वत्सल भक्तानां जय चक्रधृते नमः ॥ ३६॥ जय मानद मानस्त्वं जय लोकनमस्कृत
    । जय धर्मद धर्मस्त्वं जय संसारपारग ॥ ३७॥ जय अन्नद अन्नं त्वं जय वाचस्पते नमः । जय शक्तिद शक्तिस्त्वं
    जय जैत्रवरप्रद ॥ ३८॥ जय यज्ञद यज्ञस्त्वं जय पद्मदलेक्षण । जय दानद दानं त्वं जय कैटभसूदन ॥ ३९॥ जय कीर्तिद
    कीर्तिस्त्वं जय मूर्तिद मूर्तिधृक् । जय सौख्यद सौख्यात्मञ्जय पावनपावन ॥ ४०॥ जय शान्तिद शान्तिस्त्वं
    जय शङ्करसम्भव । जय पानद पानस्त्वं जय ज्योतिःस्वरूपिणे ॥ ४१॥ जय वामन वित्तेश जय धूमपताकिने । जय सर्वस्य
    जगतो दातृमूर्ते नमोऽस्तु ते ॥ ४२॥ त्वमेव लोकत्रयवर्तिजीवनिकायसङ्क्लेशविनाशदक्षः । श्रीपुण्डरीकाक्ष
    कृपानिधे त्वं निधेहि पाणिं मम मूर्ध्नि विष्णो ॥ ४३॥ इति ब्रह्मपुराणे द्वाविंशाधिकशततमाध्यायान्तर्गतं
    धन्वन्तरिकृतं विष्णुस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय १२२
