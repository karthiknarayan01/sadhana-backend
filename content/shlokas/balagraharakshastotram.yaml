id: balagraharakshastotram
category: raksha
name:
  english: balagraharakshastotram
  devanagari: बालग्रहरक्षास्तोत्रम्
content:
  english: balagraharakshastotram adaya krishnam santrasta yashodapi dvijottama | gopuccham bhramya hastena
    baladoshamapakarot || 1|| gokarishamupadaya nandagopo'pi mastake | krishnasya pradadau rakshankurvityetadudirayan
    || 2|| rakshatu tvamasheshanam bhutanam prabhavo harih | yasya nabhisamudbhutapankajadabhavajjagat
    || 3|| yena damshtragravidhrita dharayatyavani jagat | varaharupadhrigdevassa tvam rakshatu keshavah
    || 4|| nakhankuravinirbhinnavairivakshahsthalo vibhuh | nrisimharupi sarvatra rakshatu tvam janardanah
    || 5|| vamano rakshatu sada bhavantam yah kshanadabhut | trivikramah kramakrantatrailokyah sphuradayudhah
    | shiraste patu gorvidah katham rakshatu keshavah | guhyam sattvataram vishnurjaghe padau janardanah
    || 7|| mukhashcadudabahuca manassarvendriyani ca | rakshatvavyahataishvaryastava narayano'vyayah ||
    8|| shankhacakragadapaneshshankhanadahatah kshayam | gacchantu pretakushmandarakshasa ye tavahitah
    || 9|| tvam patu dikshu vaikuntho vidikshu madhusudanah | hrishikesho'mbare bhumau rakshatu tvam mahidharah
    || 10|| evam kritasvastyayano nandagopena balakah | shayitashshakatasyadho balaparyankikatale || 11||
    vanamali gadi sharngi shankhi cakri ca nandaki | shrimannarayano vishnurvasudevo'bhirakshatu || 12||
    iti balagraharakshastotram sampurnam |
  devanagari: बालग्रहरक्षास्तोत्रम् आदाय कृष्णं सन्त्रस्ता यशोदापि द्विजोत्तम । गोपुच्छं भ्राम्य हस्तेन
    बालदोषमपाकरोत् ॥ १॥ गोकरीषमुपादाय नन्दगोपोऽपि मस्तके । कृष्णस्य प्रददौ रक्षाङ्कुर्वित्येतदुदीरयन्
    ॥ २॥ रक्षतु त्वामशेषाणां भूतानां प्रभवो हरिः । यस्य नाभिसमुद्भूतपङ्कजादभवज्जगत् ॥ ३॥ येन दंष्ट्राग्रविधृता
    धारयत्यवनी जगत् । वराहरूपधृग्देवस्स त्वां रक्षतु केशवः ॥ ४॥ नखाङ्कुरविनिर्भिन्नवैरिवक्षःस्थलो विभुः
    । नृसिंहरूपी सर्वत्र रक्षतु त्वां जनार्दनः ॥ ५॥ वामनो रक्षतु सदा भवन्तं यः क्षणादभूत् । त्रिविक्रमः
    क्रमाक्रान्तत्रैलोक्यः स्फुरदायुधः । शिरस्ते पातु गोर्विदः कठं रक्षतु केशवः । गुह्यं सत्त्वतरं विष्णुर्जघे
    पादौ जनार्दनः ॥ ७॥ मुखश्चादूडबाहूच मनस्सर्वेन्द्रियाणि च । रक्षत्वव्याहतैश्वर्यस्तव नारायणोऽव्ययः
    ॥ ८॥ शङ्खचक्रगदापाणेश्शङ्खनादहताः क्षयम् । गच्छन्तु प्रेतकूष्माण्डराक्षसा ये तवाहिताः ॥ ९॥ त्वां पातु
    दिक्षु वैकुण्ठो विदिक्षु मधुसूदनः । हृषीकेशोऽम्बरे भूमौ रक्षतु त्वां महीधरः ॥ १०॥ एवं कृतस्वस्त्ययनो
    नन्दगोपेन बालकः । शायितश्शकटस्याधो बालपर्यङ्किकातले ॥ ११॥ वनमाली गदी शार्ङ्गी शङ्खी चक्री च नन्दकी
    । श्रीमन्नारायणो विष्णुर्वासुदेवोऽभिरक्षतु ॥ १२॥ इति बालग्रहरक्षास्तोत्रं सम्पूर्णम् ।
