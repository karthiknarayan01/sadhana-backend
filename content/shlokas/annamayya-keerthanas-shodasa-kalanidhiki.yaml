id: annamayya-keerthanas-shodasa-kalanidhiki
category: stotram
name:
  english: Annamayya Keerthanas Shodasa Kalanidhiki
content:
  english: pallavi shodasha kalanidhiki shodashopacaramulu jadatoda niccalunu samarpayami || alaru vishvatmakunanu
    avahanamidè sarva nilayunaku asanamu nèmminide | alaganga janakunaku arghyapadya acamanalu jaladhi
    shayikini majjanamide || shodasha kalanidhiki shodashopacaramulu jadatoda niccalunu samarpayami ||
    varapitambarunaku vastralankaramidè sari shrimantunaku bhushanamulive | dharanidharunaku gandhapushpa
    dhupamulu tiramidè kotisuryatejunaku dipamu || shodasha kalanidhiki shodashopacaramulu jadatoda niccalunu
    samarpayami || amritamathanunaku nadivo naivedyamu ravijandranetrunaku kappuravidèmu | amarina shrivenkatadri
    midi devuniki tamito pradakshinalu dandamulu nivigo || shodasha kalanidhiki shodashopacaramulu jadatoda
    niccalunu samarpayami ||
  devanagari: पल्लवि षोडश कलानिधिकि षोडशोपचारमुलु जाडतोड निच्चलुनु समर्पयामि ॥ अलरु विश्वात्मकुननु आवाहनमिदॆ
    सर्व निलयुनकु आसनमु नॆम्मिनिदे । अलगङ्गा जनकुनकु अर्घ्यपाद्य अचमनालु जलधि शायिकिनि मज्जनमिदे ॥ षोडश
    कलानिधिकि षोडशोपचारमुलु जाडतोड निच्चलुनु समर्पयामि ॥ वरपीताम्बरुनकु वस्त्रालङ्कारमिदॆ सरि श्रीमन्तुनकु
    भूषणमुलिवे । धरणीधरुनकु गन्धपुष्प धूपमुलु तिरमिदॆ कोटिसूर्यतेजुनकु दीपमु ॥ षोडश कलानिधिकि षोडशोपचारमुलु
    जाडतोड निच्चलुनु समर्पयामि ॥ अमृतमथनुनकु नदिवो नैवेद्यमु रविजन्द्रनेत्रुनकु कप्पुरविडॆमु । अमरिन श्रीवेङ्कटाद्रि
    मीदि देवुनिकि तमितो प्रदक्षिणालु दण्डमुलु निविगो ॥ षोडश कलानिधिकि षोडशोपचारमुलु जाडतोड निच्चलुनु समर्पयामि
    ॥
