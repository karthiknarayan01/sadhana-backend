id: vyadeshvarakripakavacam
category: kavacha
name:
  english: vyadeshvarakripakavacam
  devanagari: व्याडेश्वरकृपाकवचम्
content:
  english: shrivyadeshvarakripakavacam shriganeshaya namah | guhagarasthitah sakshanmahavyadeshvarah shivah
    | patu mam sankatatsatyam sharanagatavatsalah || 1|| sa mamavatu durbhikshe sukhe duhkhe dine dine
    | parivaram sada patu sadanam tripurantakah || 2|| mama cetashca buddhim ca dhurjati patu me manah
    | vrittim patu pinaki me vyavasayam jatadharah || 3|| bhumau tatha pitriloke lokanathah sadashivah
    | svarge rakshatu sarvesho mahadevashca sarvada || 4|| shirsham me shankarah patu bhalam rakshatu
    vai bhavah | netrau drishtim nilakanthah shrutim bhuteshvarastatha || 5|| bhargavasthapitah sthanurmastakam
    me sada'vatu | ghranam mrityunjayah patu mukham konkanarakshakah || 6|| oshthau vani ca jihvam ca
    rakshatam candrashekharah | kandharamishvarah patu bhujau pancananastatha || 7|| skandhau maheshvarah
    patu karau me shailajapatih | hastau rakshedashutosho vishvanathah karangulih || 8|| bhasmadhari karaprishthe
    shuli karatale tatha | hridayam patu yogishah uro me parvatipriyah || 9|| jatharam havyavannetro nabhim
    bhaktamanogatah | smarantakah kati patu sakthini vimalantarah || 10|| guhagrameshvarah patu janghe
    uru ca guhyakam | januni sthanurupena rakshenmama purantakah || 11|| gulpha guhapita raksheccaranau
    kuladaivatam | sarvangani vibhu rakshet tvagrakshedbhayanashanah || 12|| dharmam me'vatu samharta
    karma rakshetpinakavan | punyam me patu kashisho dhairyam rakshatu vai harah || 13|| rudro me santatim
    patu pashunpashupatistatha | vahanam sarvagah shambhuh shilam tryambakavaibhavah || 14|| vartma kailasanathashca
    patu me kuladaivatam | sampadam samba anandam patu nartanapanditah || 15|| sarvasthaneshu kaleshu
    rakshenmam girijapatih | kavacasmaranenaiva patu vyadeshvarah svayam || 16|| prabhate va pradoshe
    va dine ratryam pathennarah | vighnani tasya nashyeyuh sarvada sukhabhagbhavet || 17|| arunodayakale
    va japeddipakasannidhau | amogham kavacam bhuyatprajnankurapravartanam || 18|| ashtadasheshu lokeshu
    raksham vyadeshvarakritam | prapya bhakto bhavennityam sada shivakripankitah || 19|| dhyayedvyadeshvaram
    nityam japennama shivasya ca | saddharmakarmasamyuktah sadacari sukhi bhavet || 20|| etattu kavacam
    shraddhabhaktiyuktena cetasa | divakarakavipraptam hridayanandakaranam || 21|| iti shrianantasuta
  devanagari: श्रीव्याडेश्वरकृपाकवचम् श्रीगणेशाय नमः । गुहागरस्थितः साक्षान्महाव्याडेश्वरः शिवः । पातु
    मां सङ्कटात्सत्यं शरणागतवत्सलः ॥ १॥ स मामवतु दुर्भिक्षे सुखे दुःखे दिने दिने । परिवारं सदा पातु सदनं
    त्रिपुरान्तकः ॥ २॥ मम चेतश्च बुद्धिं च धूर्जटी पातु मे मनः । वृत्तिं पातु पिनाकी मे व्यवसायं जटाधरः
    ॥ ३॥ भूमौ तथा पितृलोके लोकनाथः सदाशिवः । स्वर्गे रक्षतु सर्वेशो महादेवश्च सर्वदा ॥ ४॥ शीर्षं मे शङ्करः
    पातु भालं रक्षतु वै भवः । नेत्रौ दृष्टिं नीलकण्ठः श्रुतिं भूतेश्वरस्तथा ॥ ५॥ भार्गवस्थापितः स्थाणुर्मस्तकं
    मे सदाऽवतु । घ्राणं मृत्युञ्जयः पातु मुखं कोङ्कणरक्षकः ॥ ६॥ ओष्ठौ वाणी च जिह्वां च रक्षतां चन्द्रशेखरः
    । कन्धरामीश्वरः पातु भुजौ पञ्चाननस्तथा ॥ ७॥ स्कन्धौ महेश्वरः पातु करौ मे शैलजापतिः । हस्तौ रक्षेदाशुतोषो
    विश्वनाथः कराङ्गुलीः ॥ ८॥ भस्मधारी करपृष्ठे शूली करतले तथा । हृदयं पातु योगीशः उरो मे पार्वतीप्रियः
    ॥ ९॥ जठरं हव्यवाण्नेत्रो नाभिं भक्तमनोगतः । स्मरान्तकः कटी पातु सक्थिनी विमलान्तरः ॥ १०॥ गुहग्रामेश्वरः
    पातु जङ्घे ऊरू च गुह्यकम् । जानुनी स्थाणुरूपेण रक्षेन्मम पुरान्तकः ॥ ११॥ गुल्फ गुहपिता रक्षेच्चरणौ
    कुलदैवतम् । सर्वाङ्गाणि विभू रक्षेत् त्वग्रक्षेद्भयनाशनः ॥ १२॥ धर्मं मेऽवतु संहर्ता कर्म रक्षेत्पिनाकवान्
    । पुण्यं मे पातु काशीशो धैर्यं रक्षतु वै हरः ॥ १३॥ रुद्रो मे सन्ततिं पातु पशून्पशुपतिस्तथा । वाहनं
    सर्वगः शम्भुः शीलं त्र्यम्बकवैभवः ॥ १४॥ वर्त्म कैलासनाथश्च पातु मे कुलदैवतम् । सम्पदं साम्ब आनन्दं
    पातु नर्तनपण्डितः ॥ १५॥ सर्वस्थानेषु कालेषु रक्षेन्मां गिरिजापतिः । कवचस्मरणेनैव पातु व्याडेश्वरः
    स्वयम् ॥ १६॥ प्रभाते वा प्रदोषे वा दिने रात्र्यां पठेन्नरः । विघ्नानि तस्य नश्येयुः सर्वदा सुखभाग्भवेत्
    ॥ १७॥ अरुणोदयकाले वा जपेद्दीपकसन्निधौ । अमोघं कवचं भूयात्प्रज्ञाङ्कुरप्रवर्तनम् ॥ १८॥ अष्टादशेषु लोकेषु
    रक्षां व्याडेश्वरकृताम् । प्राप्य भक्तो भवेन्नित्यं सदा शिवकृपाङ्कितः ॥ १९॥ ध्यायेद्व्याडेश्वरं नित्यं
    जपेन्नाम शिवस्य च । सद्धर्मकर्मसंयुक्तः सदाचारी सुखी भवेत् ॥ २०॥ एतत्तु कवचं श्रद्धाभक्तियुक्तेन चेतसा
    । दिवाकरकविप्राप्तं हृदयानन्दकारणम् ॥ २१॥ इति श्रीअनन्तसुत
