id: shivashadaksharastotram-2
category: stotram
name:
  english: shivashadaksharastotram 2
  devanagari: शिवषडक्षरस्तोत्रम् २
content:
  english: shrishivashadaksharastotram 2 onkarasanjatasamastavedapuranapunyagamapujitaya | onkaravarnapratipaditaya
    onkararupaya namah shivaya || 1|| nagadhivasaya niramayaya bhasmangaragaya bhayapahaya | devadidevaya
    digambaraya tasmai nakaraya namah shivaya || 2|| mattebhacarmambarabhushanaya marantakaraya maheshvaraya
    | candrarkavaishvanaralocanaya tasmai makaraya namah shivaya || 3|| shivaya gaurivadanaravinda suryaya
    dakshadhvaranashanaya | shrinilakanthaya shivapriyaya tasmai shikaraya namah shivaya || 4|| vagishakumbhodbhavagautamadimunindravandyaya
    munishvaraya | trailokyanathaya purantakaya tasmai vakaraya namah shivaya || 5|| yajnasvarupaya jatadharaya
    pinakahastaya sanatanaya | nityaya shuddhaya niranjanaya tasmai yakaraya namah shivaya || 6|| shadaksharamidam
    stotram yah pathenchivasannidhau | shivalokamavapnoti shivena saha modate || 7|| pratahkale shivam
    drishtva nishapapam vinashyati | madhyahne kritamajanma sayahve saptajanmasu || 8|| merukancanadattanam
    gavam kotishatairapi | pancakotituranganam tatphalam
  devanagari: श्रीशिवषडक्षरस्तोत्रम् २ ओङ्कारसञ्जातसमस्तवेदपुराणपुण्यागमपूजिताय । ओङ्कारवर्णप्रतिपादिताय
    ओङ्काररूपाय नमः शिवाय ॥ १॥ नगाधिवासाय निरामयाय भस्माङ्गरागाय भयापहाय । देवादिदेवाय दिगम्बराय तस्मै
    नकाराय नमः शिवाय ॥ २॥ मत्तेभचर्माम्बरभूषणाय मारान्तकाराय महेश्वराय । चन्द्रार्कवैश्वानरलोचनाय तस्मै
    मकाराय नमः शिवाय ॥ ३॥ शिवाय गौरीवदनारविन्द सूर्याय दक्षाध्वरनाशनाय । श्रीनीलकण्ठाय शिवाप्रियाय तस्मै
    शिकाराय नमः शिवाय ॥ ४॥ वागीशकुम्भोद्भवगौतमादिमुनीन्द्रवन्द्याय मुनीश्वराय । त्रैलोक्यनाथाय पुरान्तकाय
    तस्मै वकाराय नमः शिवाय ॥ ५॥ यज्ञस्वरूपाय जटाधराय पिनाकहस्ताय सनातनाय । नित्याय शुद्धाय निरञ्जनाय तस्मै
    यकाराय नमः शिवाय ॥ ६॥ षडक्षरमिदं स्तोत्रं यः पठेञ्छिवसन्निधौ । शिवलोकमवाप्नोति शिवेन सह मोदते ॥ ७॥
    प्रातःकाले शिवं दृष्ट्वा निशापापं विनश्यति । मध्याह्ने कृतमाजन्म सायाह्वे सप्तजन्मसु ॥ ८॥ मेरुकाञ्चनदत्तानां
    गवां कोटिशतैरपि । पञ्चकोटीतुरङ्गानां तत्फलं
meaning: {}
