id: annamayya-keerthanas-chaduvulone-harina
category: stotram
name:
  english: Annamayya Keerthanas Chaduvulone Harina
content:
  english: caduvulone harini jattigònavalègaka | madamugappinamida maguda nadi galada || jadamatiki sahajame
    samsarayatana yidi | kadu nindulo baramu gadiyincavalègaka | tòdari galappudu turpèttaka tanu | vidici
    maṟacina vènaka vèdakite galada || bhavabandhunaku vidhipapapunyapulankè | tiviri yindune tèlivi tèlusukovalègaka
    | avala vènnèlalone allunere llinte | niviri ninnativuniki netiki galada || dehadhariki galade tèganiyindriyabadha
    | sahasambuna bhakti sadhincavalègaka | yihalanu shrivenkateshudasulavalana | vuhinci gatiganaka vòdigite
    galada ||
  devanagari: चदुवुलोने हरिनि जट्टिगॊनवलॆगाक । मदमुगप्पिनमीद मगुड नदि गलदा ॥ जडमतिकि सहजमे संसारयातन यिदि
    । कडु निन्दुलो बरमु गडियिञ्चवलॆगाक । तॊडरि गालप्पुडु तूर्पॆत्तक तानु । विडिचि मऱचिन वॆनक वॆदकिते गलदा
    ॥ भवबन्धुनकु विधिपापपुण्यपुलङ्कॆ । तिविरि यिन्दुने तॆलिवि तॆलुसुकोवलॆगाक । अवल वॆन्नॆललोने अल्लुनेरे
    ल्लिन्ते । निविरि निन्नटिवुनिकि नेटिकि गलदा ॥ देहधारिकि गलदे तॆगनियिन्द्रियबाध । साहसम्बुन भक्ति साधिञ्चवलॆगाक
    । यिहलनु श्रीवेङ्कटेशुदासुलवलन । वूहिञ्चि गतिगानक वॊदिगिते गलदा ॥
