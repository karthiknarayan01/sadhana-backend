id: mantratmakashlokah
category: mantra
name:
  english: mantratmakashlokah
  devanagari: मन्त्रात्मकश्लोकाः
content:
  english: 133 anasuyatrisambhuto dattatreyo digambarah | smartrigami svabhaktanamuddharta bhava sankatat
    || 1|| daridravipragehe yah shakam bhuktvottamashriyam | dadau shridattadevah sa daridryacchriprado'vatu
    || 2|| durikritya pishacartim jivayitva mritam sutam | yo'bhudabhishtadah patu sa nah santanavriddhikrit
    || 3|| jivayamasa bhartaram mritam satya hi mrityuha | mrityunjayah sa yogindrah saubhagyam me prayacchatu
    || 4|| atreratmapradanena yo mukto bhagavanrinat | dattatreyam tamishanam namami rinamuktaye || 5||
    japecchlokamimam devapitrarshipunnrinapaham | so'nrino dattakripaya parambrahmadhigacchati || 6||
    atriputro mahatejo dattatreyo mahamunih | tasya smaranamatrena sarvapapaih pramucyate || 7|| namaste
    bhagavandeva dattatreya jagatprabho | sarvabadhaprashamanam kuru shantim prayaccha me || 8|| anasuyasuta
    shrisha janapatakanashana | digambaram namo nityam tubhyam me varado bhava || 9|| shrivishnoravataro'yam
    dattatreyo digambarah | malakamandalucchuladamarushankhacakradhrik || 10|| namaste sharade devi sarasvati
    matiprade | vasa tvam mama jihvagre sarvavidyaprada bhava || 11|| dattatreyam prapadye sharanamanudinam
    dinabandhum mukundam || nairgunyam sannivishtam pathi paramapadam bodhayantam muninam || bhasmabhyangam
    jatabhih sulalitamukutam dikpatam divyarupam sahyadrau nityavasam pramuditamamalam sadgurum carushilam
    || 12|| iti shrivasudevanandasarasvativiracitah mantrashlokah sampurnah |
  devanagari: १३३ अनसूयात्रिसम्भूतो दत्तात्रेयो दिगम्बरः । स्मर्तृगामी स्वभक्तानामुद्धर्ता भव सङ्कटात्
    ॥ १॥ दरिद्रविप्रगेहे यः शाकं भुक्त्वोत्तमश्रियम् । ददौ श्रीदत्तदेवः स दारिद्र्याच्छ्रीप्रदोऽवतु ॥
    २॥ दूरीकृत्य पिशाचार्तिं जीवयित्वा मृतं सुतम् । योऽभूदभीष्टदः पातु स नः सन्तानवृद्धिकृत् ॥ ३॥ जीवयामास
    भर्तारं मृतं सत्या हि मृत्युहा । मृत्युञ्जयः स योगीन्द्रः सौभाग्यं मे प्रयच्छतु ॥ ४॥ अत्रेरात्मप्रदानेन
    यो मुक्तो भगवानृणात् । दत्तात्रेयं तमीशानं नमामि ऋणमुक्तये ॥ ५॥ जपेच्छ्लोकमिमं देवपित्रर्षिपुन्नृणापहम्
    । सोऽनृणो दत्तकृपया परम्ब्रह्माधिगच्छति ॥ ६॥ अत्रिपुत्रो महातेजो दत्तात्रेयो महामुनिः । तस्य स्मरणमात्रेण
    सर्वपापैः प्रमुच्यते ॥ ७॥ नमस्ते भगवन्देव दत्तात्रेय जगत्प्रभो । सर्वबाधाप्रशमनं कुरु शान्तिं प्रयच्छ
    मे ॥ ८॥ अनसूयासुत श्रीश जनपातकनाशन । दिगम्बरं नमो नित्यं तुभ्यं मे वरदो भव ॥ ९॥ श्रीविष्णोरवतारोऽयं
    दत्तात्रेयो दिगम्बरः । मालाकमण्डलूच्छूलडमरूशङ्खचक्रधृक् ॥ १०॥ नमस्ते शारदे देवि सरस्वति मतिप्रदे ।
    वस त्वं मम जिह्वाग्रे सर्वविद्याप्रदा भव ॥ ११॥ दत्तात्रेयं प्रपद्ये शरणमनुदिनं दीनबन्धुं मुकुन्दम्
    ॥ नैर्गुण्यं सन्निविष्टं पथि परमपदं बोधयन्तं मुनीनाम् ॥ भस्माभ्यङ्गं जटाभिः सुललितमुकुटं दिक्पटं दिव्यरूपं
    सह्याद्रौ नित्यवासं प्रमुदितममलं सद्गुरुं चारुशीलम् ॥ १२॥ इति श्रीवासुदेवानन्दसरस्वतीविरचिताः मन्त्रश्लोकाः
    सम्पूर्णाः ।
