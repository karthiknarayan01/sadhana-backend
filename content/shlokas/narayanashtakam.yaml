id: narayanashtakam
category: stotram
name:
  english: narayanashtakam
  devanagari: नारायणाष्टकम्
content:
  english: vatsalyadabhayapradanasamayadarttartinirvapanad audaryyadaghashoshanadaganitashreyah padaprapanat
    | sevyah shripatireka eva jagatamete'bhavansakshinah prahladashca vibhishanashca karirat pancalyahalyadhruvah
    || 1|| prahladasti yadishvaro vada harih sarvatra me darshaya stambhe caivamiti bruvantamasuram tatravirasiddharih
    | vakshastasya vidarayannijanakhairvatsalyamapadayan narttatranaparayanah sa bhagavannarayano me gatih
    || 2|| shriramo'tra vibhishano'yamanagho rakshobhayadagatah sugrivanaya palayainamadhuna paulastyamevagatam
    | ityuktva'bhayamasya sarvaviditam yo raghavo dattavan arttatranaparayanah sa bhagavannarayano me
    gatih || 3|| nakragrastapadam samuddhritakaram brahmadayo bhoh sura rakshantamiti dinavakyakarinam
    deveshvashakteshu yah | ma bhaishiriti tasya nakrahanane cakrayudhah shridharo hyarttatranaparayanah
    sa bhagavannarayano me gatih || 4|| bhoh krishnacyutah bhoh kripalaya hare bhoh pandavanam sakhe kvasi
    kvasi suyodhanadhyapahritam bho raksha mamaturam | ityuktto'kshayavastrasambhritatanuryo'palayaddraupadim
    arttatranaparayanah sa bhagavannarayano me gatih || 5|| yatpadabjanakhodakam trijagatam papaughavidhvamsanam
    yannamamritapurakam ca pibatam samsarasantarakam | pashano'pi yadanighrapankarajasa shapanmunermocito
    hyarttatranaparayanah sa bhagavannarayano me gatih || 6|| pitra bhrataramuttamasanagatam hyauttanapadirdhruvo
    drishtva tatsamamarurukshuradhikam matra'vamanam gatah | yam gatva sharanam yadapa tapasa hemadrisimhasanam
    hyarttatranaparayanah sa bhagavannarayano me gatih || 7|| artta vishannah shithilashca bhita ghoreshu
    ca vyadhishu vartamanah | samkirtya narayanashabdamatram vimuktaduhkhah sukhino bhavanti || 8|| iti
    shrikureshasvamiviracitam narayanashtakam sampurnam |
  devanagari: वात्सल्यादभयप्रदानसमयादार्त्तार्तिनिर्वापणाद् औदार्य्यादघशोषणादगणितश्रेयः पदप्रापणात् ।
    सेव्यः श्रीपतिरेक एव जगतामेतेऽभवन्साक्षिणः प्रह्लादश्च विभीषणश्च करिराट् पाञ्चाल्यहल्याध्रुवः ॥ १॥
    प्रह्लादास्ति यदीश्वरो वद हरिः सर्वत्र मे दर्शय स्तंभे चैवमिति ब्रुवन्तमसुरं तत्राविरासीद्धरिः । वक्षस्तस्य
    विदारयन्निजनखैर्वात्सल्यमापादयन् नार्त्तत्राणपरायणः स भगवान्नारायणो मे गतिः ॥ २॥ श्रीरामोऽत्र विभीषणोऽयमनघो
    रक्षोभयादागतः सुग्रीवानय पालयैनमधुना पौलस्त्यमेवागतम् । इत्युक्त्वाऽभयमस्य सर्वविदितं यो राघवो दत्तवान्
    आर्त्तत्राणपरायणः स भगवान्नारायणो मे गतिः ॥ ३॥ नक्रग्रस्तपदं समुद्धृतकरं ब्रह्मादयो भोः सुरा रक्षन्तामिति
    दीनवाक्यकरिणं देवेष्वशक्तेषु यः । मा भैषीरिति तस्य नक्रहनने चक्रायुधः श्रीधरो ह्यार्त्तत्राणपरायणः
    स भगवान्नारायणो मे गतिः ॥ ४॥ भोः कृष्णाच्युतः भोः कृपालय हरे भोः पाण्डवानां सखे क्वासि क्वासि सुयोधनाध्यपहृतां
    भो रक्ष मामातुराम् । इत्युक्त्तोऽक्षयवस्त्रसंभृततनुर्योऽपालयद्द्रौपदीम् आर्त्तत्राणपरायणः स भगवान्नारायणो
    मे गतिः ॥ ५॥ यत्पादाब्जनखोदकं त्रिजगतां पापौघविध्वंसनं यन्नामामृतपूरकं च पिबतां संसारसन्तारकम् । पाषाणोऽपि
    यदङिघ्रपङ्करजसा शापान्मुनेर्मोचितो ह्यार्त्तत्राणपरायणः स भगवान्नारायणो मे गतिः ॥ ६॥ पित्रा भ्रातरमुत्तमासनगतं
    ह्यौत्तानपादिर्ध्रुवो दृष्ट्वा तत्सममारुरुक्षुरधिकं मात्राऽवमानं गतः । यं गत्वा शरणं यदाप तपसा हेमाद्रिसिंहासनं
    ह्यार्त्तत्राणपरायणः स भगवान्नारायणो मे गतिः ॥ ७॥ आर्त्ता विषण्णाः शिथिलाश्च भीता घोरेशु च व्याधिशु
    वर्तमानाः । संकीर्त्य नारायणशब्दमात्रं विमुक्तदुःखाः सुखिनो भवन्ति ॥ ८॥ इति श्रीकूरेशस्वामिविरचितं
    नारायणाष्टकं सम्पूर्णम् ।
