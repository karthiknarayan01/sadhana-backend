id: cakshusha-upanishada
category: upanishad
name:
  english: cakshusha upanishada
  devanagari: चाक्षुष उपनिषद
content:
  english: '|| cakshushopanishat || athatashcakshushim pathitasiddhavidyam cakshurogaharam vyakhyasyamah|
    yaccakshurogah sarvato nashyamti| cakshushi diptirbhavishyatiti| asyashcakshushi vidyayah ahirbudhnya
    rishih | gayatri chandah | suryodevata | cakshuroganivrittaye viniyogah | om cakshuh cakshuh cakshuh
    tejah sthiro bhava | mam pahi pahi | tvaritam cakshurogan shamaya shamaya | mama jatarupam tejo darshaya
    darshaya | yathahamandho na syam tatha kalpaya kalpaya | kalyanam kuru kuru | yani mama purvajanmoparjitani
    cakshuh pratirodhaka dushkritani sarvani nirmulaya nirmulaya | om namashcakshustejodatre divyaya bhaskaraya
    | om namah kalyanakaraya amritaya | om namah suryaya | om namo bhagavate suryaya akshitejase namah
    | khecaraya namah | mahate namah | rajase namah | tamase namah | asato ma sadgamaya | tamaso ma jyotirgamaya
    | mrityorma amritam gamaya | ushno bhagavanchucirupah | hamso bhagavan shucipratirupah | ya imam cakshushmatim
    vidyam brahmano nityamadhiyate na tasya akshirogo bhavati | na tasya kule andho bhavati | na tasya
    kule andho bhavati | ashtau brahmanan grahayitva vidyasiddhirbhavati | vishvarupam ghrininam jatavedasam
    hiranmayam purusham jyotirupam tapantam sahasrarashmih shatadhavartamanah purahprajanamudayatyesha
    suryah | om namo bhagavate adityaya | ahovahinyahovahini svaha| om vayah suparna upasedurindram priyamedha
    rishayo nadhamanah| apadhvantamurnuhi purddhi cakshurmumugdhyasmannidhayeva baddhan| pundarikakshaya
    namah| pushkarekshanaya namah| amalekshanaya namah| kamalekshanaya namah| vishvarupaya namah|mahavishnave
    namah| iti cakshushopanishat sampurna|'
  devanagari: ॥ चाक्षुषोपनिषत् ॥ अथातश्चाक्षुषीं पठितसिद्धविद्यां चक्षूरोगहरां व्याख्यास्यामः। यच्चक्षूरोगाः
    सर्वतो नश्यंति। चाक्षुषी दीप्तिर्भविष्यतीति। अस्याश्चाक्षुषी विद्यायाः अहिर्बुध्न्य ऋषिः । गायत्री
    छन्दः । सूर्योदेवता । चक्षूरोगनिवृत्तये विनियोगः । ॐ चक्षुः चक्षुः चक्षुः तेजः स्थिरो भव । मां पाहि
    पाहि । त्वरितम् चक्षूरोगान् शमय शमय । मम जातरूपं तेजो दर्शय दर्शय । यथाहमन्धो न स्यां तथा कल्पय कल्पय
    । कल्याणं कुरु कुरु । यानि मम पूर्वजन्मोपार्जितानि चक्षुः प्रतिरोधक दुष्कृतानि सर्वाणि निर्मूलय निर्मूलय
    । ॐ नमश्चक्षुस्तेजोदात्रे दिव्याय भास्कराय । ॐ नमः कल्याणकराय अमृताय । ॐ नमः सूर्याय । ॐ नमो भगवते
    सूर्याय अक्षितेजसे नमः । खेचराय नमः । महते नमः । रजसे नमः । तमसे नमः । असतो मा सद्गमय । तमसो मा ज्योतिर्गमय
    । मृत्योर्मा अमृतं गमय । उष्णो भगवान्छुचिरूपः । हंसो भगवान् शुचिप्रतिरूपः । य इमां चाक्षुष्मतीं विद्यां
    ब्राह्मणो नित्यमधीयते न तस्य अक्षिरोगो भवति । न तस्य कुले अन्धो भवति । न तस्य कुले अन्धो भवति । अष्टौ
    ब्राह्मणान् ग्राहयित्वा विद्यासिद्धिर्भवति । विश्वरूपं घृणिनं जातवेदसं हिरण्मयं पुरुषं ज्योतीरूपं
    तपन्तं सहस्ररश्मिः शतधावर्तमानः पुरःप्रजानामुदयत्येष सूर्यः । ॐ नमो भगवते आदित्याय । अहोवाहिन्यहोवाहिनी
    स्वाहा। ॐ वयः सुपर्णा उपसेदुरिन्द्रं प्रियमेधा ऋषयो नाधमानाः। अपध्वान्तमूर्णुहि पूर्द्धि चक्षुर्मुमुग्ध्यस्मान्निधयेव
    बद्धान्। पुण्डरीकाक्षाय नमः। पुष्करेक्षणाय नमः। अमलेक्षणाय नमः। कमलेक्षणाय नमः। विश्वरूपाय नमः।महाविष्णवे
    नमः। इति चाक्षुषोपनिषत् संपूर्णा।
