    ॐ अव्यक्ताय नमः ॐ सुव्यक्ताय नमः ॥ ॥ ॐ वैशाख शुक्ल भूतोत्धाय नमः ॐ शरणागत वत्सलाय नमः ॐ उदार कीर्तये
