id: kriyasiddhih-sattve-bhavati
category: stotram
name:
  english: Kriyasiddhih Sattve Bhavati
content:
  english: kriyasiddhih sattve bhavati mahatannopakarane | sevadikshita ma vismara bho suktim || na dhanam
    na balam napi sampada na syajjananukampa siddha na syat karyabhumika na syadapi protsahah avrinotu
    va vighnavaridhistvam ma vismara suktim || || atmabalam smara bahubalam dhara paramukhaprekshi ma
    bhuh kvacidapi ma bhudatmavismritih na syallakshyaccyavanam | asadaya janamanasapritim suciram samsmara
    suktim || || arunasarathim vikalasadhanam suryam samsmara nityam shurapurushan dridhanajeyan padatpadam
    smara gacchan samanyetaradrigbhyassodara sidhyati karyamapurvam ||
  devanagari: क्रियासिद्धिः सत्त्वे भवति महतान्नोपकरणे । सेवादीक्षित मा विस्मर भो सूक्तिम् ॥ न धनं न बलं
    नापि सम्पदा न स्याज्जनानुकम्पा सिद्धा न स्यात् कार्यभूमिका न स्यादपि प्रोत्साहः आवृणोतु वा विघ्नवारिधिस्त्वं
    मा विस्मर सूक्तिम् ॥ ॥ आत्मबलं स्मर बाहुबलं धर परमुखप्रेक्षी मा भूः क्वचिदपि मा भूदात्मविस्मृतिः न
    स्याल्लक्ष्याच्च्यवनम् । आसादय जनमानसप्रीतिं सुचिरं संस्मर सूक्तिम् ॥ ॥ अरुणसारथिं विकलसाधनं सूर्यं
    संस्मर नित्यं शूरपूरुषान् दृढानजेयान् पदात्पदं स्मर गच्छन् सामान्येतरदृग्भ्यस्सोदर सिध्यति कार्यमपूर्वम्
    ॥
