id: narayanapurvatapiniyopanishat
category: upanishad
name:
  english: narayanapurvatapiniyopanishat
  devanagari: नारायणपूर्वतापिनीयोपनिषत्
content:
  english: sthitishca samharatirodhananusammatam | pancakrityasya kartaram narayanamanamayam || ityatharvanarahasye
    narayanapurvatapiniye prathamah khandah dvitiyah khandah sa hovaca bhagavan brahma narayanashtaksharamantram
    vyacashte | shrimannarayanasya dashamantrah kathyante | om namo narayanaya ityashtaksharo mantrah
    | sa eva mantrarajo bhavati | etannarayanasya tarakam bhavati | tadevopasitavyam bhavati | ityuvaca
    bhagavannarayanashabdaparabrahmashrimahamayaprakritisarvamekajananilakshmirbhavati | devanam devalakshmirbhavati
    | siddhanam siddhalakshmirbhavati | mumukshunam mokshalakshmirbhavati | yoginam yogalakshmirbhavati
    | muninam vivekabuddhirbhavati | rajnam rajyalakshmirbhavati | srishtirupa sarasvati bhavati | sthitirupa
    mahalakshmirbhavati | samhararupa rudrani bhavati | tirodhanakari parvati bhavati | anugraharupa uma
    bhavati | pancakrityarupa parameshvari bhavati | shrimahalakshmyai nama iti saptaksharo mantrah ||
    sarveshameva bhutanam mahasaubhagyadayini | mahalakshmirmahadevi sarvalokaikamohini || samrajyadayini
    nityam sarvavedasvarupini | mahavidya jaganmata muninam mokshadayini | jnaninam jnanada satyam danavanam
    vinashini || iti mahalakshmirmulaprakritirbhavati | narayanah sa bhagavan parabrahmasvarupi sarvavedantagocarah
    nityashuddhabuddhaparabrahmanandamayo bhavati | tasmallakshminarayana iti sa hovaca bhagavan ya evam
    veda | ityupanishat || ityatharvanarahasye narayanapurvatapiniye dvitiyah khandah tritiyah khandah
    sa hovaca bhagavan brahma narayanamantrah kidrisho bhavati |
  devanagari: स्थितिश्च संहारतिरोधानानुसंमतम् । पञ्चकृत्यस्य कर्तारं नारायणमनामयम् ॥ इत्याथर्वणरहस्ये
    नारायणपूर्वतापिनीये प्रथमः खण्डः द्वितीयः खण्डः स होवाच भगवान् ब्रह्मा नारायणाष्टाक्षरमन्त्रं व्याचष्टे
    । श्रीमन्नारायणस्य दशमन्त्राः कथ्यन्ते । ॐ नमो नारायणाय इत्यष्टाक्षरो मन्त्रः । स एव मन्त्रराजो भवति
    । एतन्नारायणस्य तारकं भवति । तदेवोपासितव्यं भवति । इत्युवाच भगवान्नारायणशब्दपरब्रह्मश्रीमहामायाप्रकृतिसर्वमेकजननीलक्ष्मीर्भवति
    । देवानां देवलक्ष्मीर्भवति । सिद्धानां सिद्धलक्ष्मीर्भवति । मुमुक्षूणां मोक्षलक्ष्मीर्भवति । योगिनां
    योगलक्ष्मीर्भवति । मुनीनां विवेकबुद्धिर्भवति । राज्ञां राज्यलक्ष्मीर्भवति । सृष्टिरूपा सरस्वती भवति
    । स्थितिरूपा महालक्ष्मीर्भवति । संहाररूपा रुद्राणी भवति । तिरोधानकरी पार्वती भवति । अनुग्रहरूपा उमा
    भवति । पञ्चकृत्यरूपा परमेश्वरी भवति । श्रीमहालक्ष्म्यै नम इति सप्ताक्षरो मन्त्रः ॥ सर्वेषामेव भूतानां
    महासौभाग्यदायिनी । महालक्ष्मीर्महादेवी सर्वलोकैकमोहिनी ।। साम्राज्यदायिनी नित्यं सर्ववेदस्वरूपिणी
    । महाविद्या जगन्माता मुनीनां मोक्षदायिनी । ज्ञानिनां ज्ञानदा सत्यं दानवानां विनाशिनी ॥ इति महालक्ष्मीर्मूलप्रकृतिर्भवति
    । नारायणः स भगवान् परब्रह्मस्वरूपी सर्ववेदान्तगोचरः नित्यशुद्धबुद्धपरब्रह्मानन्दमयो भवति । तस्माल्लक्ष्मीनारायण
    इति स होवाच भगवान् य एवं वेद । इत्युपनिषत् ॥ इत्याथर्वणरहस्ये नारायणपूर्वतापिनीये द्वितीयः खण्डः तृतीयः
    खण्डः स होवाच भगवान् ब्रह्मा नारायणमन्त्रः कीदृशो भवति ।
