id: rakaratmakaramasahasranamastotram
category: sahasranama
name:
  english: rakaratmakaramasahasranamastotram
  devanagari: रकारात्मकरामसहस्रनामस्तोत्रम्
content:
  english: ranabhumivihari ca raktapado runacchavih || 14|| raghuviro mahaviro dhiro vai sarvarat ravih
    | ranganatharcitapado ramo rajivalocanah || 15|| rajadharmapriyo'rishto vishishto rakshasantakrit
    | ramo anantamaryadapalako raghavo harih || 16|| rambhaphala kritaharo rambhaprana surottamah | ramaramanasarvesho
    raghuvamsha kritalayah || 17|| ratnaratnani varmani divyaratnavibhushitah | rishishvaro mahaprajno
    rajatkeyurakundalah || 18|| ranjako bhanjako kharvo raktavastrasadapriyah | ranamurttih ranekarma
    ranadhyanaparayanah || 19|| ranayuddharato vidvan ranavidyaticaturah | rimphatum sphuritangani rajivo
    rajasapriyah || 20|| rangamurtih rajabhogi rajyabhogapradah puman | ramakarmarato viro ramasantushtacetasah
    || 21|| ramavihari raghurat ramasatyaikavigrahah | ramavigrahadhari ca ramadhyanaparayanah || 22||
    rama'bhicaranirato rama''jnaparipalakah | ramakarmaikasantushto ramaramanavatsalah || 23|| ramapramodasahito
    rama agragato harih | ramasahayo bhagavan ravanapranaharakah || 24|| ramasarvakari sakshi ramabhadro
    ramanidhih | ramapriyo rameyatma ramabhagya vivarddhanah || 25|| ramakanto ramanatho raghavo'rishtabhanjanah
    | rama vishvasya janani raghavendrasvarupadhrik || 26|| ramapracari bhagavan ramasambodhanapriyah
    | ramakaryarato rikto ramalavanyasambhavah || 27|| ramadanarato shrisho ramapalanapalakah | ramaramendra
    raktango raktavigrahavigrahah || 28|| ramadayakaro vishnuh adinarayanah kavih | ramavishvasvarupatma
    shrikrishnah kalashasanah || 29|| ramasarvakariyantrah ramacandramanuvratah | raghavo bhagyavan viro
    ranamadhye jayapradah || 30|| rama sanghena samrambho ramapuja sadapriyah | ramahasya suhasi ca ramasakhyaikasundarah
    || 31|| ramavidhanasampanno ramanandanakarakah | ramasarvaparitripto ramakaranakaranah || 32|| ramamanaprakari
    ca ramajnanavisharadah | ramakhelanakhela ca ramavela ramapatih || 33|| ramasankatahartta ca nrisimho
    bhaktavatsalah | ramapratitasahita tasyajnaparipurnatah || 34|| ramacandrashcandra lakshmi ramacarcitapadayah
    | ramalokavilasi ca rama ramasya sarvada || 35|| ramasudharmakarma ca ramasarvarthasadhakah | ramakitapatangadya
    rama sarvamidam jagat || 36|| ramapadamahapunyamayo ramo dhurandharah | ramapravino vishvatma sarvatma
    vishvapujitah || 37|| ramasthavararupa ca raghuvamshe'tinirmalah | ramaprasadasahito ramacancalacancalah
    || 38|| ramabharanabhutatma ramaposhanakarakah | ramapurnita purnatma ramavarahasamyutah || 39|| ramakurmenasahita
    ramamatsyasamanvitah | ramanrisimhasahita ramavamanasamyuta || 40|| rama ramenasahita ramakrishnaparayana
    | rama bauddhasvarupa ca rama kalkisvarupadhrik || 41|| ramavishnusvarupatma rama rama sadagatih |
    rama matisvarupatma ramasamsargasangamah || 42|| ramapradhanamanajno ramasarveshvaro harih | ramashariravasi
    ca ramavijnanadarshakah || 43|| ramatattvopadeshta ca ramamantraparayanah | ramabhogapradata ca ramaduhkhavimocakah
    || 44|| ramasurendracarcatu rama manasamanasah | ramatarpanatripta ramagatha'runakritih || 45|| ramagaurimayimurttih
    ramashyamasvarupaka | rama pitasvarupa ca raghunatho puratanah || 46|| ramakaro ramadanto ramasattvo
    ramacchavih | rama'dharo mahaviro rama avyaktadarshanah || 47|| ramatattva parijnani ramarajyaviharakah
    | ramarevatate dhiro ramamantrajapotkatah || 48|| ramasurendravandyashca raghuh sarvangasundarah |
    rama abrahmasamyukta raghavasya priya satih || 49|| rama yajnamayi murtih ramacandrasya sangatih |
    ramarupi ramacandro parabrahmasvarupakah || 50|| raktacandanaliptango raktamalyanulepanah | raktapushpapriyo
    ramo vedavidyavisharadah || 51|| raktavastravilasi ca raghavo raghupungavah | rama sevakaro yasya
    satyasandhah pratapavan || 52|| rajadhirajo bhagavan caturdha murtidharakah | rajendro bhavahartta
    ca rakshasendravarapradah || 53|| rajakirttirlokamurttih ramah satyaparakramah | rama yasyardhadehastha
    ramo ghoradyamardanah || 54|| raghavendro virabhadro ranakarkashakarkashah | rakinyadyamahashaktih
    sevyamanapadambujah || 55|| ramaraminyasarvesho maharajo mahadyutih | rajyado bhaktabhaktanamabhaktanam
    ca kinkarah || 56|| ratipriyo ratinatho ragi ragavisharadah | ravih shanaishcaro bhadro graharupi
    janardanah || 57|| ramakala ramaklinno ramabhagyo rama'ngadah | ramarama bhavo bhimo bhayabhitivinashakrit
    || 58|| ramakriya ramaviryo sarvadharmaikasadhakah | raktapatrapriyo ramo raktanetravarah prabhuh
    || 59|| raktamamsapriyo viro narayanasvarupakah | raktasthicarvako vidvan dinanatho dinah prabhuh
    || 60|| ramarakteshvaro shuddho ramashcaitanyacetasah | ramo apurvakarmajno dharmakarmapravartakah
    || 61|| ramo vishvasya karta ca ramo vishvasya nandanah | ramo vishvasya lupta ca ramo vishvakulantakah
    || 62|| ramo vishvasya bhartta ca ramo rajyadhipeshvarah | ramo jagaddhito viro ramah sarvarthadarshakah
    || 63|| ramo viramo virajo kaushalyanandavardhanah | ramah suratriptikarta ramo mamsasya bhakshakah
    || 64|| ramah shrishambhavah sakshat shrisita shambhavi para | ramashcakrapracari ca ramastrailokyavyapakah
    || 65|| ramah sadashivo murttih kalamurtirdigambarah | ramah kripakaro devo vishvavyapi niranjanah
    || 66|| ramo niramayo nityo nityasarvagato'vyayah | ramo vayusvarupatma ramakashyaikarupakah || 67||
    ramo dharamurttirupo ramah kalantako harih | ramo vibhishanashridah parabrahmamayoditah || 68|| ramo
    rakshasahanta ca rakshasanam kulantakah | ramyamanapadambhojah ramate sakalam jagat || 69|| rukminipriyakartta
    ca rukminimanasesthitah | rukmini carthadata ca rukmini vallabho harih || 70|| rukminisiddhidah siddho
    sidhyasadhyadivanditah | rukminipriyabhagyashca rukminibhagyavardhanah || 71|| rukminibhaktibhaktashca
    rukminisaukhyadarshakah | rukminishrisvarupa ca rukminiprananayakah || 72|| rukminibhogabhuktashca
    rukminibhagatarpanah | rukminiduhkhahartta ca rukminidivyadarshanah || 73|| rukminiruparupa ca strirupa
    ca pativratah | rukminisangasanga ca ramo narayano'vyayah || 74|| rukminirajyadata ca rukminivakyasiddhidah
    | rukmini kashtaharta ca rukmini dvarakeshvari || 75|| radha''radhitavittatma radhavandita sarvada
    | radhanamasada''nandah radhatrailokyamohini || 76|| radhasiddhi sunishtha ca radhabhaktirato raghuh
    | radharupi ramacandro radhamohanamohanah || 77|| radhamantrasvarupatma shrimandasharathih prabhuh
    | radhasukhanidhanam ca ramo vishvasya mohanah || 78|| radhapranatriptikaro radhakarmapracarakah |
    radhasatyavratadhino ramanama sadagatih || 79|| rakarah sarvadevanam sakshat kalanalah prabhuh | rakarah
    sarvadevanam tejapunjah sanatanah || 80|| rakarah sarvabhutanam jivarupi janardanah | rakarah sarvajivanam
    sarvapapasya dahakah || 81|| rakarah sarvasaukhyanam siddhidastu puratanah | rakarah sarvavidyanam
    vedastattvasanatanah || 82|| rakarah sarvasadhyanam sadhako'nantarupadhrik | rakarah sarvabhutanam
    vyapyavyapakamishvarah || 83|| rakarotpadyate nityam rakaro liyate jagat | rakaro nirvikalpashca shuddhabuddha
    sada'vyayah || 84|| rakarah sarvakamashca paripurnamanorathah | rakaro jayate brahya rakaro jayate
    harih | || 85|| rakaro jayate shambhuh rakarah sarvashaktayah | rakarah sarvadushtanam nashako raghunayakah
    || 86|| rakarah sarvasiddhinam smaranat dayako guruh | rakaro dharmakamanam mokshashcarthaikasiddhikrit
    || 87|| rakarah sarvasattvanam mahamodamayah svarat | ramahasyakari maya rakaro vidyate sada || 88||
    ramakirttikari maya mayaramayashaskari | ramatejakari maya sarvakaleshu sarvada || 89|| ramarajyakari
    maya rajarajamayo harih | ramabhogakari maya kalakale nirantaram || 90|| ramadurgamahanta ca ramasaubhagyasundarah
    | ramasarvarthadata ca bhagavan bhavabhanjanah || 91|| ramanama sada''nando ramanama sadagatih | ramanama
    sadatushto ramanamasvarupakah || 92|| ramanamapara vedah ramanama sadashucih | ramanamapara yajnah
    ramanamaparo dhvanih || 93|| ramanamaparam bijam ramanamaparam jagat | ramo udarakarma ca ramashca
    sakalam jagat || 94|| ramo dayakaro dirgho duhkhadaridryamardanah | ramanama param jnanam vishvam
    ramasya cashrayam || 95|| ramat parataram nasti karyakaranagauravam | ramastaponidhirdevo dirghanetro
    dyuticchadah || 96|| ramah koshasya bhokta ca rajarajo dhanadhipah | ramo banadharah shriman capatunirapurakah
    || 97|| ramah parakrami kami kamadevasya palakah | ramo harah parvatisho smaryate ca divanisham ||
    98|| rajayogasya siddhinam rajarajeshvaro'bhavet | rakaradini namani sha
  devanagari: रणभूमिविहारी च रक्तपादो रुणच्छविः ॥ १४॥ रघुवीरो महावीरो धीरो वै सर्वराट् रविः । रङ्गनाथार्चितपदो
    रामो राजीवलोचनः ॥ १५॥ राजधर्मप्रियोऽरिष्टो विशिष्टो राक्षसान्तकृत् । रामो अनन्तमर्यादापालको राघवो
    हरिः ॥ १६॥ रम्भाफल कृताहारो रम्भाप्राण सुरोत्तमः । रमारमणसर्वेशो रघुवंश कृतालयः ॥ १७॥ रत्नरत्नानि
    वर्माणि दिव्यरत्नविभूषितः । ऋषीश्वरो महाप्राज्ञो राजत्केयूरकुण्डलः ॥ १८॥ रञ्जको भञ्जको खर्वो रक्तवस्त्रसदाप्रियः
    । रणमूर्त्तिः रणेकर्मा रणध्यानपरायणः ॥ १९॥ रणयुद्धरतो विद्वान् रणविद्यातिचातुरः । रिम्फतुं स्फुरिताङ्गानि
    राजीवो राजसप्रियः ॥ २०॥ रङ्गमूर्तिः राजभोगी राज्यभोगप्रदः पुमान् । रमाकर्मरतो वीरो रमासन्तुष्टचेतसः
    ॥ २१॥ रमाविहारी रघुराट् रमासत्यैकविग्रहः । रमाविग्रहधारी च रमाध्यानपरायणः ॥ २२॥ रमाऽभिचारनिरतो रमाऽऽज्ञापरिपालकः
    । रमाकर्मैकसन्तुष्टो रमारमणवत्सलः ॥ २३॥ रमाप्रमोदसहितो रमा अग्रगतो हरिः । रमासहायो भगवान् रावणप्राणहारकः
    ॥ २४॥ रमासर्वकरी साक्षी रामभद्रो रमानिधिः । रमाप्रियो रमेयात्मा रमाभाग्य विवर्द्धनः ॥ २५॥ रमाकान्तो
    रमानाथो राघवोऽरिष्टभञ्जनः । रमा विश्वस्य जननी राघवेन्द्रस्वरूपधृक् ॥ २६॥ रमाप्रचारी भगवान् रमासम्बोधनप्रियः
    । रमाकार्यरतो रिक्तो रमालावण्यसम्भवः ॥ २७॥ रामादानरतो श्रीशो रमापालनपालकः । रमारमेन्द्र रक्ताङ्गो
    रक्तविग्रहविग्रहः ॥ २८॥ रमादयाकरो विष्णुः आदिनारायणः कविः । रमाविश्वस्वरूपात्मा श्रीकृष्णः कालशासनः
    ॥ २९॥ रमासर्वकरीयन्त्रः रामचन्द्रमनुव्रतः । राघवो भाग्यवान् वीरो रणमध्ये जयप्रदः ॥ ३०॥ रमा सङ्घेन
    संरम्भो रमापूजा सदाप्रियः । रमाहास्य सुहासी च रमासख्यैकसुन्दरः ॥ ३१॥ रमाविधानसम्पन्नो रमानन्दनकारकः
    । रमासर्वपरितृप्तो रमाकारणकारणः ॥ ३२॥ रमामानप्रकारी च रमाज्ञानविशारदः । रमाखेलनखेला च रमावेला रमापतिः
    ॥ ३३॥ रमासङ्कटहर्त्ता च नृसिंहो भक्तवत्सलः । रमाप्रतीतसहित तस्याज्ञापरिपूर्णतः ॥ ३४॥ रामचन्द्रश्चन्द्र
    लक्ष्मी रमाचर्चितपादयः । रमालोकविलासी च रमा रामस्य सर्वदा ॥ ३५॥ रमासुधर्मकर्मा च रमासर्वार्थसाधकः
    । रमाकीटपतङ्गाद्या रमा सर्वमिदं जगत् ॥ ३६॥ रमापादमहापुण्यमयो रामो धुरन्धरः । रमाप्रवीणो विश्वात्मा
    सर्वात्मा विश्वपूजितः ॥ ३७॥ रमास्थावररूपा च रघुवंशेऽतिनिर्मलः । रमाप्रसादसहितो रमाचञ्चलचञ्चलः ॥ ३८॥
    रमाभरणभूतात्मा रमापोषणकारकः । रमापूर्णित पूर्णात्मा रमावाराहसंयुतः ॥ ३९॥ रमाकूर्मेणसहिता रमामत्स्यसमन्विताः
    । रमानृसिंहसहिता रमावामनसंयुता ॥ ४०॥ रमा रामेणसहिता रमाकृष्णपरायणा । रमा बौद्धस्वरूपा च रमा कल्किस्वरूपधृक्
    ॥ ४१॥ रमाविष्णुस्वरूपात्मा रमा राम सदागतिः । रमा मतिस्वरूपात्मा रमासंसर्गसङ्गमः ॥ ४२॥ रमाप्रधानमानज्ञो
    रमासर्वेश्वरो हरिः । रमाशरीरवासी च रमाविज्ञानदर्शकः ॥ ४३॥ रमातत्त्वोपदेष्टा च रमामन्त्रपरायणः । रमाभोगप्रदाता
    च रमादुःखविमोचकः ॥ ४४॥ रमासुरेन्द्रचर्चातु रमा मानसमानसः । रमातर्पणतृप्ता रमागाथाऽरुणाकृतिः ॥ ४५॥
    रमागौरिमयीमूर्त्तिः रमाश्यामास्वरूपका । रमा पीतस्वरूपा च रघुनाथो पुरातनः ॥ ४६॥ रमाकरो रमादान्तो रमासत्त्वो
    रमाच्छविः । रमाऽधरो महावीरो रमा अव्यक्तदर्शनः ॥ ४७॥ रमातत्त्व परिज्ञानी रमाराज्यविहारकः । रमारेवातटे
    धीरो रमामन्त्रजपोत्कटः ॥ ४८॥ रमासुरेन्द्रवन्द्याश्च रघुः सर्वाङ्गसुन्दरः । रमा आब्रह्मसंयुक्ता राघवस्य
    प्रिया सतीः ॥ ४९॥ रमा यज्ञमयी मूर्तिः रामचन्द्रस्य सङ्गतिः । रमारूपी रामचन्द्रो परब्रह्मस्वरूपकः ॥
    ५०॥ रक्तचन्दनलिप्ताङ्गो रक्तमाल्यानुलेपनः । रक्तपुष्पप्रियो रामो वेदविद्याविशारदः ॥ ५१॥ रक्तवस्त्रविलासी
    च राघवो रघुपुङ्गवः । रमा सेवाकरो यस्य सत्यसन्धः प्रतापवान् ॥ ५२॥ राजाधिराजो भगवान् चतुर्धा मूर्तिधारकः
    । राजेन्द्रो भवहर्त्ता च राक्षसेन्द्रवरप्रदः ॥ ५३॥ राजकीर्त्तिर्लोकमूर्त्तिः रामः सत्यपराक्रमः । रमा
    यस्यार्धदेहस्था रामो घोराद्यमर्दनः ॥ ५४॥ राघवेन्द्रो वीरभद्रो रणकर्कशकर्कशः । राकिन्याद्यामहाशक्तिः
    सेव्यमानपदाम्बुजः ॥ ५५॥ रमारमिण्यासर्वेशो महाराजो महाद्युतिः । राज्यदो भक्तभक्तानामभक्तानां च किङ्करः
    ॥ ५६॥ रतिप्रियो रतिनाथो रागी रागविशारदः । रविः शनैश्चरो भद्रो ग्रहरूपी जनार्दनः ॥ ५७॥ रामकला रामक्लिन्नो
    रमाभाग्यो रमाऽङ्गदः । रमाराम भवो भीमो भयभीतिविनाशकृत् ॥ ५८॥ रमाक्रिया रमावीर्यो सर्वधर्मैकसाधकः ।
    रक्तपात्रप्रियो रामो रक्तनेत्रवरः प्रभुः ॥ ५९॥ रक्तमांसप्रियो वीरो नारायणस्वरूपकः । रक्तास्थिचर्वको
    विद्वान् दीनानाथो दिनः प्रभुः ॥ ६०॥ रमारक्तेश्वरो शुद्धो रामश्चैतन्यचेतसः । रामो अपूर्वकर्मज्ञो धर्मकर्मप्रवर्तकः
    ॥ ६१॥ रामो विश्वस्य कर्ता च रामो विश्वस्य नन्दनः । रामो विश्वस्य लुप्ता च रामो विश्वकुलान्तकः ॥ ६२॥
    रामो विश्वस्य भर्त्ता च रामो राज्याधिपेश्वरः । रामो जगद्धितो वीरो रामः सर्वार्थदर्शकः ॥ ६३॥ रामो विरामो
    विरजो कौशल्यानन्दवर्धनः । रामः सुरातृप्तिकर्ता रामो मांसस्य भक्षकः ॥ ६४॥ रामः श्रीशाम्भवः साक्षात्
    श्रीसीता शाम्भवी परा । रामश्चक्रप्रचारी च रामस्त्रैलोक्यव्यापकः ॥ ६५॥ रामः सदाशिवो मूर्त्तिः कालमूर्तिर्दिगम्बरः
    । रामः कृपाकरो देवो विश्वव्यापी निरञ्जनः ॥ ६६॥ रामो निरामयो नित्यो नित्यसर्वगतोऽव्ययः । रामो वायुस्वरूपात्मा
    रामाकाश्यैकरूपकः ॥ ६७॥ रामो धरामूर्त्तिरूपो रामः कालान्तको हरिः । रामो विभीषणश्रीदः परब्रह्ममयोदितः
    ॥ ६८॥ रामो राक्षसहन्ता च राक्षसानां कुलान्तकः । रम्यमानपदाम्भोजः रमते सकलं जगत् ॥ ६९॥ रुक्मिणीप्रियकर्त्ता
    च रुक्मिणीमानसेस्थितः । रुक्मिणी चार्थदाता च रुक्मिणी वल्लभो हरिः ॥ ७०॥ रुक्मिणीसिद्धिदः सिद्धो सिध्यसाध्यादिवन्दितः
    । रुक्मिणीप्रियभाग्यश्च रुक्मिणीभाग्यवर्धनः ॥ ७१॥ रुक्मिणीभक्तिभक्तश्च रुक्मिणीसौख्यदर्शकः । रुक्मिणीश्रीस्वरूपा
    च रुक्मिणीप्राणनायकः ॥ ७२॥ रुक्मिणीभोगभुक्तश्च रुक्मिणीभगतर्पणः । रुक्मिणीदुःखहर्त्ता च रुक्मिणीदिव्यदर्शनः
    ॥ ७३॥ रुक्मिणीरूपरूपा च स्त्रीरूपा च पतिव्रताः । रुक्मिणीसङ्गसङ्गा च रामो नारायणोऽव्ययः ॥ ७४॥ रुक्मिणीराज्यदाता
    च रुक्मिणीवाक्यसिद्धिदः । रुक्मिणी कष्टहर्ता च रुक्मिणी द्वारकेश्वरी ॥ ७५॥ राधाऽऽराधितवित्तात्मा राधावन्दित
    सर्वदा । राधानामसदाऽऽनन्दः राधात्रैलोक्यमोहिनी ॥ ७६॥ राधासिद्धि सुनिष्ठा च राधाभक्तिरतो रघुः । राधारूपी
    रामचन्द्रो राधामोहनमोहनः ॥ ७७॥ राधामन्त्रस्वरूपात्मा श्रीमान्दाशरथिः प्रभुः । राधासुखनिधानं च रामो
    विश्वस्य मोहनः ॥ ७८॥ राधाप्राणतृप्तिकरो राधाकर्मप्रचारकः । राधासत्यव्रताधीनो रामनाम सदागतिः ॥ ७९॥
    रकारः सर्वदेवानां साक्षात् कालानलः प्रभुः । रकारः सर्वदेवानां तेजपुञ्जः सनातनः ॥ ८०॥ रकारः सर्वभूतानां
    जीवरूपी जनार्दनः । रकारः सर्वजीवानां सर्वपापस्य दाहकः ॥ ८१॥ रकारः सर्वसौख्यानां सिद्धिदस्तु पुरातनः
    । रकारः सर्वविद्यानां वेदस्तत्त्वसनातनः ॥ ८२॥ रकारः सर्वसाध्यानां साधकोऽनन्तरूपधृक् । रकारः सर्वभूतानां
    व्याप्यव्यापकमीश्वरः ॥ ८३॥ रकारोत्पद्यते नित्यं रकारो लीयते जगत् । रकारो निर्विकल्पश्च शुद्धबुद्ध
    सदाऽव्ययः ॥ ८४॥ रकारः सर्वकामश्च परिपूर्णमनोरथः । रकारो जायते ब्रह्या रकारो जायते हरिः । ॥ ८५॥ रकारो
    जायते शम्भुः रकारः सर्वशक्तयः । रकारः सर्वदुष्टानां नाशको रघुनायकः ॥ ८६॥ रकारः सर्वसिद्धीनां स्मरणात्
    दायको गुरुः । रकारो धर्मकामानां मोक्षश्चार्थैकसिद्धिकृत् ॥ ८७॥ रकारः सर्वसत्त्वानां महामोदमयः स्वराट्
    । रामहास्यकारी माया रकारो विद्यते सदा ॥ ८८॥ रामकीर्त्तिकरी माया मायारामयशस्करी । रामतेजकरी माया सर्वकालेषु
    सर्वदा ॥ ८९॥ रामराज्यकरी माया राजराजमयो हरिः । रामभोगकरी माया कालकाले निरन्तरम् ॥ ९०॥ रामदुर्गमहन्ता
    च रामसौभाग्यसुन्दरः । रामसर्वार्थदाता च भगवान् भवभञ्जनः ॥ ९१॥ रामनाम सदाऽऽनन्दो रामनाम सदागतिः । रामनाम
    सदातुष्टो रामनामस्वरूपकः ॥ ९२॥ रामनामपरा वेदाः रामनाम सदाशुचिः । रामनामपरा यज्ञाः रामनामपरो ध्वनिः
    ॥ ९३॥ रामनामपरं बीजं रामनामपरं जगत् । रामो उदारकर्मा च रामश्च सकलं जगत् ॥ ९४॥ रामो दयाकरो दीर्घो दुःखदारिद्र्यमर्दनः
    । रामनाम परं ज्ञानं विश्वं रामस्य चाश्रयम् ॥ ९५॥ रामात् परतरं नास्ति कार्यकारणगौरवम् । रामस्तपोनिधिर्देवो
    दीर्घनेत्रो द्युतिच्छदः ॥ ९६॥ रामः कोशस्य भोक्ता च राजराजो धनाधिपः । रामो बाणधरः श्रीमान् चापतूणीरपूरकः
    ॥ ९७॥ रामः पराक्रमी कामी कामदेवस्य पालकः । रामो हरः पार्वतीशो स्मर्यते च दिवानिशम् ॥ ९८॥ राजयोगस्य
    सिद्धीनां राजराजेश्वरोऽभवेत् । रकारादीनि नामानि श
