id: garudadhvaja
category: stotram
name:
  english: garudadhvaja
  devanagari: गरुडध्वज
content:
  english: dhruva uvaca | yo'ntah pravishya mama vacamimam prasuptam sanjiyatyakhilashaktidharah svadhamna
    | anyamshca hastacaranashravanatvagadin pranannamo bhagavate purushaya tubhyam || 1|| ekastvameva
    bhagavannidamatmashaktya mayakhyayorugunaya mahadadyashesham | srishtva'nuvishya purushastadasadguneshu
    naneva darushu vibhavasuvadvibhasi || 2|| tvaddattaya vayunayedamacashta vishvam suptaprabuddha iva
    natha bhavatprapannah | tasyapavargyasharanam tava padamulam vismaryate kritavida kathamartabandho
    || 3|| nunam vimushtamatayastava mayaya te ye tvam bhavapyayavimokshanamanyahetoh | arcanti kalpakatarum
    kunapopabhogya
  devanagari: ध्रुव उवाच । योऽन्तः प्रविश्य मम वाचमिमां प्रसुप्तां सञ्जीयत्यखिलशक्तिधरः स्वधाम्ना । अन्यांश्च
    हस्तचरणश्रवणत्वगादीन् प्राणान्नमो भगवते पुरूषाय तुभ्यम् ॥ १॥ एकस्त्वमेव भगवन्निदमात्मशक्त्या मायाख्ययोरुगुणया
    महदाद्यशेषम् । सृष्ट्वाऽनुविश्य पुरुषस्तदसद्गुणेषु नानेव दारूषु विभावसुवद्विभासि ॥ २॥ त्वद्दत्तया
    वयुनयेदमचष्ट विश्वं सुप्तप्रबुद्ध इव नाथ भवत्प्रपन्नः । तस्यापवर्ग्यशरणं तव पादमूलं विस्मर्यते कृतविदा
    कथमार्तबन्धो ॥ ३॥ नूनं विमुष्टमतयस्तव मायया ते ये त्वां भवाप्ययविमोक्षणमन्यहेतोः । अर्चन्ति कल्पकतरूं
    कुणपोपभोग्य
meaning: {}
