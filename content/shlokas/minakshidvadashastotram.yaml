id: minakshidvadashastotram
category: stotram
name:
  english: minakshidvadashastotram
  devanagari: मीनाक्षीद्वादशस्तोत्रम्
content:
  english: shriminakshidvadashastotram ya devi jagatam kartri shankarasyapi shankari | namastasyai suminakshyai
    devyai mangalamurtaye || 1|| sakridaradhya yam sarvamabhishtam labhate narah | namastasyai suminakshyai
    devyai mangalamurtaye || 2|| yasyah prasadaleshena bhoramokshau na durlabhau | namastasyai suminakshyai
    devyai mangalamurtaye || 3|| yaya shivo'pi yuktah san pancakrityam karoti hi | namastasyai suminakshyai
    devyai mangalamurtaye || 4|| yasyah prityarthamanisham lasyam kurvan shivo babhau | namastasyai suminakshyai
    devyai mangalamurtaye || 5|| lakshmisarasvatimukhya yasyastejahkanodbhavah | namastasyai suminakshyai
    devyai mangalamurtaye || 6|| ya devi muktikamanam brahmavidyapradayini | namastasyai suminakshyai
    devyai mangalamurtaye || 7|| yasyah pranamamatrena vardhante sarvasampadah | namastasyai suminakshyai
    devyai mangalamurtaye || 8|| ya stuta sarvapapaghni sarvopadravanashini | namastasyai suminakshyai
    devyai mangalamurtaye || 9|| ya dhyata parama shaktih sarvasiddhikari shiva | namastasyai suminakshyai
    devyai mangalamurtaye || 10|| yaya devyapi virahitah shivo'pi hi nirarthakah | namastasyai suminakshyai
    devyai mangalamurtaye || 11|| caracaram jagat sarvam yasyah padasamudbhavam | namastasyai suminakshyai
    devyai mangalamurtaye || 12|| iti shriminakshidvadashastotram sampurnam |
  devanagari: श्रीमीनाक्षीद्वादशस्तोत्रम् या देवी जगतां कर्त्री शङ्करस्यापि शङ्करी । नमस्तस्यै सुमीनाक्ष्यै
    देव्यै मङ्गलमूर्तये ॥ १॥ सकृदाराध्य यां सर्वमभीष्टं लभते नरः । नमस्तस्यै सुमीनाक्ष्यै देव्यै मङ्गलमूर्तये
    ॥ २॥ यस्याः प्रसादलेशेन भोरामोक्षौ न दुर्लभौ । नमस्तस्यै सुमीनाक्ष्यै देव्यै मङ्गलमूर्तये ॥ ३॥ यया
    शिवोऽपि युक्तः सन् पञ्चकृत्यं करोति हि । नमस्तस्यै सुमीनाक्ष्यै देव्यै मङ्गलमूर्तये ॥ ४॥ यस्याः प्रीत्यर्थमनिशं
    लास्यं कुर्वन् शिवो बभौ । नमस्तस्यै सुमीनाक्ष्यै देव्यै मङ्गलमूर्तये ॥ ५॥ लक्ष्मीसरस्वतीमुख्या यस्यास्तेजःकणोद्भवाः
    । नमस्तस्यै सुमीनाक्ष्यै देव्यै मङ्गलमूर्तये ॥ ६॥ या देवी मुक्तिकामानां ब्रह्मविद्याप्रदायिनी । नमस्तस्यै
    सुमीनाक्ष्यै देव्यै मङ्गलमूर्तये ॥ ७॥ यस्याः प्रणाममात्रेण वर्धन्ते सर्वसम्पदः । नमस्तस्यै सुमीनाक्ष्यै
    देव्यै मङ्गलमूर्तये ॥ ८॥ या स्तुता सर्वपापघ्नी सर्वोपद्रवनाशिनी । नमस्तस्यै सुमीनाक्ष्यै देव्यै मङ्गलमूर्तये
    ॥ ९॥ या ध्याता परमा शक्तिः सर्वसिद्धिकरी शिवा । नमस्तस्यै सुमीनाक्ष्यै देव्यै मङ्गलमूर्तये ॥ १०॥ यया
    देव्यापि विरहितः शिवोऽपि हि निरर्थकः । नमस्तस्यै सुमीनाक्ष्यै देव्यै मङ्गलमूर्तये ॥ ११॥ चराचरं जगत्
    सर्वं यस्याः पादसमुद्भवम् । नमस्तस्यै सुमीनाक्ष्यै देव्यै मङ्गलमूर्तये ॥ १२॥ इति श्रीमीनाक्षीद्वादशस्तोत्रं
    सम्पूर्णम् ।
