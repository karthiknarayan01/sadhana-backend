id: ekadantasharanagatistotram
category: stotram
name:
  english: ekadantasharanagatistotram
  devanagari: एकदन्तशरणागतिस्तोत्रम्
content:
  english: ekadantasharanagatistotram shriganeshaya namah | devarshaya ucuh | sadatmarupam sakaladibhutamamayinam
    so'hamacintyabodham | anadimadhyantavihinamekam tamekadantam sharanam vrajamah || 1|| anantacidrupamayam
    ganeshamabhedabhedadivihinamadyam | hridi prakashasya dharam svadhistham tamekadantam sharanam vrajamah
    || 2|| samadhisamstham hridi yoginam yam prakasharupena vibhatametam | sada niralambasamadhigamyam
    tamekadantam sharanam vrajamah || 3|| svabimbabhavena vilasayuktam pratyakshamayam vividhasvarupam
    | svaviryakam tatra dadati yo vai tamekadantam sharanam vrajamah || 4|| tvadiyaviryena samarthabhutasvamayaya
    samracitam ca vishvam | turiyakam hyatmapratitisamjnam tamekadantam sharanam vrajamah || 5|| svadiyasattadharamekadantam
    guneshvaram yam gunabodhitaram | bhajantamatyantamajam trisamstham tamekadantam sharanam vrajamah
    || 6|| tatasvaya preritanadakena sushuptisamjnam racitam jagadvai | samanarupam hyubhayatrasamstham
    tamekadantam sharanam vrajamah || 7|| tadeva vishvam kripaya prabhutam dvibhavamadau tamasa vibhantam
    | anekarupam ca tathaikabhutam tamekadantam sharanam vrajamah || 8|| tatastvaya preritakena srishtam
    babhuva sukshmam jagadekasamstham | susatvikam svapnamanantamadyam tamekadantam sharana vrajamah ||
    9|| tadeva svapnam tapasa ganesha susiddharupam vividham babhuva | sadaikarupam kripaya ca te'dya
    tamekadantam sharanam vrajamah || 10|| tvadajnaya tena tvaya hridistham tatha susrishtam jagadamsharupam
    | vibhinnajagranmayamaprameyam tamekadantam sharanam vrajamah || 11|| tadeva jagradrajasa vibhatam
    vilokitam tvatkripaya smritena | babhuva bhinnam ca sadaikarupam tamekadantam sharanam vrajamah ||
    12|| sadeva srishtva prakritisvabhavattadantare tvam ca vibhasi nityam | dhiyah pradata gananatha
    ekastamekadantam sharanam vrajamah || 13|| tvadajnaya bhanti grahashca sarve prakasharupani vibhanti
    khe vai || bhramanti nityam svaviharakaryastamekadantam sharanam vrajamah || 14|| tvadajnaya srishtikaro
    vidhata tvadajnaya palaka eva vishnuh | tvadajnaya samharako haro'pi tamekadantam sharanam vrajamah
    || 15|| yadajnaya bhumijale'tra samsthe yadajnayapah pravahanti nadyah | svatirthasamsthashca kritah
    samudrastamekadantam sharanam vrajamah|| 16|| yadajnaya devagana divistha dadanti vai karmaphalani
    nityam | yadajnaya shailaganah sthira vai tamekadantam sharanam vrajamah || 17|| yadajnaya sheshadharadharo
    vai yadajnaya mohapradashca kamah | yadajnaya kaladharo'ryama ca tamekadantam sharanam vrajamah ||
    18|| yadajnaya vati vibhati vayuryadajnayagnirjatharadisamsthah | yadajnayedam sacaracaram ca tamekadantam
    sharanam vrajamah || 19|| yadantare samsthitamekadantastadajnaya sarvamidam vibhati | anantarupam
    hridi bodhakam yastamekadantam sharanam vrajamah || 20|| suyogino yogabalena sadhyam prakurvate kah
    stavanena stauti | atah pranamena susiddhido'stu tamekadantam sharanam vrajamah || 21|| gritsamada
    uvaca | evam stutva ganeshanam devah samunayah prabhum || tushnimbhavam prapadyaiva nanriturharshasamyutah
    || 22|| sa tanuvaca pritatma devarshinam stavena vai || ekadanto mahabhago devarshin bhaktavatsalah
    || 23|| ekadanta uvaca | stotrena'ham prasanno'smi surah sarshiganah kila | varadam bho vrinuta vo
    dasyami manasipsitam || 24|| bhavatkritam madiyam yatstotram pritipradam ca tat | bhavishyati na sandehah
    sarvasiddhipradayakam || 25|| yam yamicchati tam tam vai dasyami stotrapathatah | putrapautradikam
    sarvam kalatram dhanadhanyakam || 26 | gajashvadikamatyantam rajyabhogadikam dhruvam | bhuktim muktim
    ca yogam vai labhate shantidayakam || 27|| maranoccatanadini rajyabandhadikam ca yat | pathatam sha
  devanagari: एकदन्तशरणागतिस्तोत्रम् श्रीगणेशाय नमः । देवर्षय ऊचुः । सदात्मरूपं सकलादिभूतममायिनं सोऽहमचिन्त्यबोधम्
    । अनादिमध्यान्तविहीनमेकं तमेकदन्तं शरणं व्रजामः ॥ १॥ अनन्तचिद्रूपमयं गणेशमभेदभेदादिविहीनमाद्यम् ।
    हृदि प्रकाशस्य धरं स्वधीस्थं तमेकदन्तं शरणं व्रजामः ॥ २॥ समाधिसंस्थं हृदि योगिनां यं प्रकाशरूपेण विभातमेतम्
    । सदा निरालम्बसमाधिगम्यं तमेकदन्तं शरणं व्रजामः ॥ ३॥ स्वबिम्बभावेन विलासयुक्तां प्रत्यक्षमायां विविधस्वरूपाम्
    । स्ववीर्यकं तत्र ददाति यो वै तमेकदन्तं शरणं व्रजामः ॥ ४॥ त्वदीयवीर्येण समर्थभूतस्वमायया संरचितं च
    विश्वम् । तुरीयकं ह्यात्मप्रतीतिसंज्ञं तमेकदन्तं शरणं व्रजामः ॥ ५॥ स्वदीयसत्ताधरमेकदन्तं गुणेश्वरं
    यं गुणबोधितारम् । भजन्तमत्यन्तमजं त्रिसंस्थं तमेकदन्तं शरणं व्रजामः ॥ ६॥ ततस्वया प्रेरितनादकेन सुषुप्तिसंज्ञं
    रचितं जगद्वै । समानरूपं ह्युभयत्रसंस्थं तमेकदन्तं शरणं व्रजामः ॥ ७॥ तदेव विश्वं कृपया प्रभूतं द्विभावमादौ
    तमसा विभान्तम् । अनेकरूपं च तथैकभूतं तमेकदन्तं शरणं व्रजामः ॥ ८॥ ततस्त्वया प्रेरितकेन सृष्टं बभूव
    सूक्ष्मं जगदेकसंस्थम् । सुसात्विकं स्वप्नमनन्तमाद्यं तमेकदन्तं शरण व्रजामः ॥ ९॥ तदेव स्वप्नं तपसा
    गणेश सुसिद्धरूपं विविधं बभूव । सदैकरूपं कृपया च तेऽद्य तमेकदन्तं शरणं व्रजामः ॥ १०॥ त्वदाज्ञया तेन
    त्वया हृदिस्थं तथा सुसृष्टं जगदंशरूपम् । विभिन्नजाग्रन्मयमप्रमेयं तमेकदन्तं शरणं व्रजामः ॥ ११॥ तदेव
    जाग्रद्रजसा विभातं विलोकितं त्वत्कृपया स्मृतेन । बभूव भिन्नं च सदैकरूपं तमेकदन्तं शरणं व्रजामः ॥ १२॥
    सदेव सृष्ट्वा प्रकृतिस्वभावात्तदन्तरे त्वं च विभासि नित्यम् । धियः प्रदाता गणनाथ एकस्तमेकदन्तं शरणं
    व्रजामः ॥ १३॥ त्वदाज्ञया भान्ति ग्रहाश्च सर्वे प्रकाशरूपाणि विभान्ति खे वै ॥ भ्रमन्ति नित्यं स्वविहारकार्यास्तमेकदन्तं
    शरणं व्रजामः ॥ १४॥ त्वदाज्ञया सृष्टिकरो विधाता त्वदाज्ञया पालक एव विष्णुः । त्वदाज्ञया संहरको हरोऽपि
    तमेकदन्तं शरणं व्रजामः ॥ १५॥ यदाज्ञया भूमिजलेऽत्र संस्थे यदाज्ञयापः प्रवहन्ति नद्यः । स्वतीर्थसंस्थश्च
    कृतः समुद्रस्तमेकदन्तं शरणं व्रजामः॥ १६॥ यदाज्ञया देवगणा दिविस्था ददन्ति वै कर्मफलानि नित्यम् । यदाज्ञया
    शैलगणाः स्थिरा वै तमेकदन्तं शरणं व्रजामः ॥ १७॥ यदाज्ञया शेषधराधरो वै यदाज्ञया मोहप्रदश्च कामः । यदाज्ञया
    कालधरोऽर्यमा च तमेकदन्तं शरणं व्रजामः ॥ १८॥ यदाज्ञया वाति विभाति वायुर्यदाज्ञयाग्निर्जठरादिसंस्थः
    । यदाज्ञयेदं सचराचरं च तमेकदन्तं शरणं व्रजामः ॥ १९॥ यदन्तरे संस्थितमेकदन्तस्तदाज्ञया सर्वमिदं विभाति
    । अनन्तरूपं हृदि बोधकं यस्तमेकदन्तं शरणं व्रजामः ॥ २०॥ सुयोगिनो योगबलेन साध्यं प्रकुर्वते कः स्तवनेन
    स्तौति । अतः प्रणामेन सुसिद्धिदोऽस्तु तमेकदन्तं शरणं व्रजामः ॥ २१॥ गृत्समद उवाच । एवं स्तुत्वा गणेशानं
    देवाः समुनयः प्रभुम् ॥ तूष्णीम्भावं प्रपद्यैव ननृतुर्हर्षसंयुताः ॥ २२॥ स तानुवाच प्रीतात्मा देवर्षीणां
    स्तवेन वै ॥ एकदन्तो महाभागो देवर्षीन् भक्तवत्सलः ॥ २३॥ एकदन्त उवाच । स्तोत्रेणाऽहं प्रसन्नोऽस्मि सुराः
    सर्षिगणाः किल । वरदं भो वृणुत वो दास्यामि मनसीप्सितम् ॥ २४॥ भवत्कृतं मदीयं यत्स्तोत्रं प्रीतिप्रदं
    च तत् । भविष्यति न सन्देहः सर्वसिद्धिप्रदायकम् ॥ २५॥ यं यमिच्छति तं तं वै दास्यामि स्तोत्रपाठतः ।
    पुत्रपौत्रादिकं सर्वं कलत्रं धनधान्यकम् ॥ २६ । गजाश्वादिकमत्यन्तं राज्यभोगादिकं ध्रुवम् । भुक्तिं
    मुक्तिं च योगं वै लभते शान्तिदायकम् ॥ २७॥ मारणोच्चाटनादीनि राज्यबन्धादिकं च यत् । पठतां श
