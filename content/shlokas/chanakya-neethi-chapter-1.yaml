id: chanakya-neethi-chapter-1
category: stotram
name:
  english: Chanakya Neethi - Chapter 1
content:
  english: pranamya shirasa vishnum trailokyadhipatim prabhum | nanashastroddhritam vakshye rajanitisamuccayam
    || || adhityedam yathashastram naro janati sattamah | dharmopadeshavikhyatam karyakaryam shubhashubham
    || || tadaham sampravakshyami lokanam hitakamyaya | yena vijnatamatrena sarvajnatvam prapadyate ||
    || murkhashishyopadeshena dushtastribharanena ca | duhkhitaih samprayogena pandito'pyavasidati ||
    || dushta bharya shatham mitram bhrityashcottaradayakah | sasarpe ca grihe vaso mrityureva na samshayah
    || || apadarthe dhanam raksheddaran raksheddhanairapi | atmanam satatam raksheddarairapi dhanairapi
    || || apadarthe dhanam rakshecchrimatam kuta apadah | kadaciccalate lakshmih sancito'pi vinashyati
    || || yasmindeshe na sammano na vrittirna ca bandhavah | na ca vidyagamo'pyasti vasam tatra na karayet
    || || dhanikah shrotriyo raja nadi vaidyastu pancamah | panca yatra na vidyante na tatra divasam vaset
    || || lokayatra bhayam lajja dakshinyam tyagashilata | panca yatra na vidyante na kuryattatra samsthitim
    || || janiyatpreshane bhrityanbandhavan vyasanagame | mitram capattikaleshu bharyam ca vibhavakshaye
    || || ature vyasane prapte durbhikshe shatrusankate | rajadvare shmashane ca yastishthati sa bandhavah
    || || yo dhruvani parityajya adhruvam parishevate | dhruvani tasya nashyanti cadhruvam nashtameva
    hi || || varayetkulajam prajno virupamapi kanyakam | rupashilam na nicasya vivahah sadrishe kule ||
    || nadinam shastrapaninannakhinam shringinam tatha | vishvaso naiva kartavyah strishu rajakuleshu
    ca || || vishadapyamritam grahyamamedhyadapi kancanam | amitradapi sadvrittam baladapi subhashitam
    || || strinam dviguna aharo lajja capi caturguna | sahasam shadgunam caiva kamashcashtagunah smritah
    ||
  devanagari: प्रणम्य शिरसा विष्णुं त्रैलोक्याधिपतिं प्रभुम् । नानाशास्त्रोद्धृतं वक्ष्ये राजनीतिसमुच्चयम्
    ॥ ॥ अधीत्येदं यथाशास्त्रं नरो जानाति सत्तमः । धर्मोपदेशविख्यातं कार्याकार्यं शुभाशुभम् ॥ ॥ तदहं सम्प्रवक्ष्यामि
    लोकानां हितकाम्यया । येन विज्ञातमात्रेण सर्वज्ञात्वं प्रपद्यते ॥ ॥ मूर्खशिष्योपदेशेन दुष्टस्त्रीभरणेन
    च । दुःखितैः सम्प्रयोगेण पण्डितोऽप्यवसीदति ॥ ॥ दुष्टा भार्या शठं मित्रं भृत्यश्चोत्तरदायकः । ससर्पे
    च गृहे वासो मृत्युरेव न संशयः ॥ ॥ आपदर्थे धनं रक्षेद्दारान् रक्षेद्धनैरपि । आत्मानं सततं रक्षेद्दारैरपि
    धनैरपि ॥ ॥ आपदर्थे धनं रक्षेच्छ्रीमतां कुत आपदः । कदाचिच्चलते लक्ष्मीः सञ्चितोऽपि विनश्यति ॥ ॥ यस्मिन्देशे
    न सम्मानो न वृत्तिर्न च बान्धवाः । न च विद्यागमोऽप्यस्ति वासं तत्र न कारयेत् ॥ ॥ धनिकः श्रोत्रियो
    राजा नदी वैद्यस्तु पञ्चमः । पञ्च यत्र न विद्यन्ते न तत्र दिवसं वसेत् ॥ ॥ लोकयात्रा भयं लज्जा दाक्षिण्यं
    त्यागशीलता । पञ्च यत्र न विद्यन्ते न कुर्यात्तत्र संस्थितिम् ॥ ॥ जानीयात्प्रेषणे भृत्यान्बान्धवान्
    व्यसनागमे । मित्रं चापत्तिकालेषु भार्यां च विभवक्षये ॥ ॥ आतुरे व्यसने प्राप्ते दुर्भिक्षे शत्रुसङ्कटे
    । राजद्वारे श्मशाने च यस्तिष्ठति स बान्धवः ॥ ॥ यो ध्रुवाणि परित्यज्य अध्रुवं परिषेवते । ध्रुवाणि तस्य
    नश्यन्ति चाध्रुवं नष्टमेव हि ॥ ॥ वरयेत्कुलजां प्राज्ञो विरूपामपि कन्यकाम् । रूपशीलां न नीचस्य विवाहः
    सदृशे कुले ॥ ॥ नदीनां शस्त्रपाणीनान्नखीनां शृङ्गिणां तथा । विश्वासो नैव कर्तव्यः स्त्रीषु राजकुलेषु
    च ॥ ॥ विषादप्यमृतं ग्राह्यममेध्यादपि काञ्चनम् । अमित्रादपि सद्वृत्तं बालादपि सुभाषितम् ॥ ॥ स्त्रीणां
    द्विगुण आहारो लज्जा चापि चतुर्गुणा । साहसं षड्गुणं चैव कामश्चाष्टगुणः स्मृतः ॥
