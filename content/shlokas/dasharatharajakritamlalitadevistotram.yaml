id: dasharatharajakritamlalitadevistotram
category: stotram
name:
  english: dasharatharajakritamlalitadevistotram
  devanagari: दशरथराजकृतंललितादेवीस्तोत्रम्
content:
  english: dasharatharajakritam lalitadevistotram ciram dhyatva maharajah suvasamsi bahuni ca | divyanyayatananyasyai
    dattva stotram cakara ha || 123|| rajovaca | padagralambiparamabharanabhirame manjiraratnarucimanjulapadapadme
    | pitambarasphuritapeshalahemakancikeyurakankanaparishkritabahuvalli || 124|| pundrekshucapavilasanmriduvamapane
    ratnormikasumasharancitadakshahaste | vakshojamandalavilasivalakshahari pashankushangadalasadbhujashobhitangi
    || 125|| vaktrashriya vijitasharadacandrabimbe tatankaratnakaramanditagandabhage | vame kare sarasijam
    subisam dadhane karunyanirjharadapangayute maheshi || 126|| manikyasutramanibhasurakambukanthi bhalasthacandrashakalojjvalitalakadhye
    | mandasmitasphuranashalini manjunase netrashriya vijitanilasarojapatre || 127|| subhrulate suvadane
    sulalatacitre yogindramanasasarojanivasahamsi | ratnanubaddhatapaniyamahakirite sarvangasundari samastasurendravandye
    || 128|| kankshanurupavarade karunardracitte samrajyasampadabhimanini cakranathe | indradidevaparisevitapadapadme
    simhasaneshvari pare mayi sannidadhyah || 129|| iti stutva sa bhupalo bahirnirgatya bhaktitah | tasyastu
    dakshine bhage mahagaurim dadarsha ha || 130|| iti brahmandapurane uttarabhage catvarimshadhyayantargatam
    dasharatharajakritam lalitadevistotram samaptam | brahmandapurana | uttarabhaga | lalita | adhyaya
    40
  devanagari: दशरथराजकृतं ललितादेवीस्तोत्रम् चिरं ध्यात्वा महाराजः सुवासांसि बहूनि च । दिव्यान्यायतनान्यस्यै
    दत्त्वा स्तोत्रं चकार ह ॥ १२३॥ राजोवाच । पादाग्रलम्बिपरमाभरणाभिरामे मञ्जीररत्नरुचिमञ्जुलपादपद्मे ।
    पीताम्बरस्फुरितपेशलहेमकाञ्चिकेयूरकङ्कणपरिष्कृतबाहुवल्लि ॥ १२४॥ पुण्ड्रेक्षुचापविलसन्मृदुवामपाणे रत्नोर्मिकासुमशराञ्चितदक्षहस्ते
    । वक्षोजमण्डलविलासिवलक्षहारि पाशाङ्कुशाङ्गदलसद्भुजशोभिताङ्गि ॥ १२५॥ वक्त्रश्रिया विजितशारदचन्द्रबिम्बे
    ताटङ्करत्नकरमण्डितगण्डभागे । वामे करे सरसिजं सुबिसं दधाने कारुण्यनिर्झरदपाङ्गयुते महेशि ॥ १२६॥ माणिक्यसूत्रमणिभासुरकम्बुकण्ठि
    भालस्थचन्द्रशकलोज्ज्वलितालकाढ्ये । मन्दस्मितस्फुरणशालिनि मञ्जुनासे नेत्रश्रिया विजितनीलसरोजपत्रे ॥
    १२७॥ सुभ्रूलते सुवदने सुललाटचित्रे योगीन्द्रमानससरोजनिवासहंसि । रत्नानुबद्धतपनीयमहाकिरीटे सर्वाङ्गसुन्दरि
    समस्तसुरेन्द्रवन्द्ये ॥ १२८॥ काङ्क्षानुरूपवरदे करुणार्द्रचित्ते साम्राज्यसम्पदभिमानिनि चक्रनाथे ।
    इन्द्रादिदेवपरिसेवितपादपद्मे सिंहासनेश्वरी परे मयि सन्निदध्याः ॥ १२९॥ इति स्तुत्वा स भूपालो बहिर्निर्गत्य
    भक्तितः । तस्यास्तु दक्षिणे भागे महागौरीं ददर्श ह ॥ १३०॥ इति ब्रह्माण्डपुराणे उत्तरभागे चत्वारिंशाध्यायान्तर्गतं
    दशरथराजकृतं ललितादेवीस्तोत्रं समाप्तम् । ब्रह्माण्डपुराण । उत्तरभाग । ललिता । अध्याय ४०
