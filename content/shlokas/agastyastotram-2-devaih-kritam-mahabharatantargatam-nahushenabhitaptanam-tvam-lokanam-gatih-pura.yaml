id: agastyastotram-2-devaih-kritam-mahabharatantargatam-nahushenabhitaptanam-tvam-lokanam-gatih-pura
category: stotram
name:
  english: agastyastotram 2 (devaih kritam mahabharatantargatam nahushenabhitaptanam tvam lokanam gatih
    pura)
  devanagari: अगस्त्यस्तोत्रम् २ (देवैः कृतं महाभारतान्तर्गतम् नाहुषेणाभितप्तानां त्वं लोकानां गतिः पुरा)
content:
  english: devaih kritam agastyastotram 2 deva ucuh | nahushenabhitaptanam tvam lokanam gatih pura bhramshitashca
    suraishvaryallokartham lokakantakah || 14|| krodhatpravriddhah sahasa bhaskarasya nagottamah | vacastavanatikramanvindhyah
    shailo na vardhate || 15|| tapasa cavrite loke mrityunabhyarditah prajah | tvameva nathamasadya nirvritim
    paramam gatah || 16|| asmakam bhayabhitanam nityasho bhagavangatih | tatastvartah prayacamastvam varam
    varado hyasi || 17|| iti mahabharate aranyaparvani 101 adhyayantargatam devaih kritam agastyastotram
    sampurnam | mahabharata | aranyakaparva | adhyaya 101
  devanagari: देवैः कृतं अगस्त्यस्तोत्रम् २ देवा ऊचुः । नाहुषेणाभितप्तानां त्वं लोकानां गतिः पुरा भ्रंशितश्च
    सुरैश्वर्याल्लोकार्थं लोककण्टकः ॥ १४॥ क्रोधात्प्रवृद्धः सहसा भास्करस्य नगोत्तमः । वचस्तवानतिक्रामन्विन्ध्यः
    शैलो न वर्धते ॥ १५॥ तपसा चावृते लोके मृत्युनाभ्यर्दिताः प्रजाः । त्वामेव नाथमासाद्य निर्वृतिं परमां
    गताः ॥ १६॥ अस्माकं भयभीतानां नित्यशो भगवान्गतिः । ततस्त्वार्ताः प्रयाचामस्त्वां वरं वरदो ह्यसि ॥ १७॥
    इति महाभारते आरण्यपर्वणि १०१ अध्यायान्तर्गतम् देवैः कृतं अगस्त्यस्तोत्रम् सम्पूर्णम् । महाभारत । आरण्यकपर्व
    । अध्याय १०१
meaning: {}
