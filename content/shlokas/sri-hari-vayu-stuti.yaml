id: sri-hari-vayu-stuti
category: stotram
name:
  english: Sri Hari Vayu Stuti
content:
  english: atha nakhastutih pantvasman puruhutavairibalavanmatangamadyadghata kumbhoccadrivipatanadhikapatu
    pratyeka vajrayitah | shrimatkanthiravasyapratatasunakhara daritaratidura pradhvastadhvantashantapravitatamanasa
    bhavita bhuribhagaih || || lakshmikanta samantato'pi kalayan naiveshituste samam pashyamyuttamavastu
    durataratopastam raso yo'shtamah | yadroshotkara daksha netra kutila prantotthitagni sphurat khadyotopama
    visphulingabhasita brahmeshashakrotkarah || || atha vayustutih shrimadvishnvanghrinishthatigunagurutamashrimadanandatirtha
    trailokyacaryapadojjvalajalajalasatpamsavo'sman punantu | vacam yatra pranetri tribhuvanamahita sharada
    sharadendu jyotsnabhadrasmitashridhavalitakakubha premabharam babhara || || utkanthakunthakolahalajavavijitajasrasevanuvriddha
    prajnatmajnanadhutandhatamasasumanomauliratnavalinam | bhaktyudrekavagadhapraghatanasadhatatkarasanghrishyamana
    prantapragryanghripithotthitakanakarajahpinjararanjitashah || || janmadhivyadhyupadhipratihativirahaprapakanam
    gunanam agryanamarpakanam ciramuditacidanandasandohadanam | eteshamesha doshapramushitamanasam dveshinam
    dushakanam daityanamartimandhe tamasi vidadhatam samstave nasmi shaktah || || asyavishkartukamam kalimalakalushe'smin
    jane jnanamargam vandyam candrendrarudradyumaniphanivayonayakadyairihadya | madhvakhyam mantrasiddham
    kimuta kritavato marutasyavataram pataram parameshtyam padamapavipadah prapturapannapumsam || || udyadvidyutpracandam
    nijarucinikaravyaptalokavakasho bibhradbhimo bhuje yo'bhyuditadinakarabhangadadhya prakande | viryoddharyam
    gadagryamayamiha sumatim vayudevo vidadhyat adhyatmajnananeta yativaramahito bhumibhushamanirme ||
    || samsarottapanityopashamadasadayasnehahasambupura prodyadvidyanavadyadyutimanikiranashrenisampuritashah
    | shrivatsankadhivasocitatarasaralashrimadanandatirtha kshirambhodhirvibhindyadbhavadanabhimatam bhuri
    me bhutihetuh || || murdhanyesho'njalirme dridhataramiha te badhyate bandhapasha cchetre datre sukhanam
    bhajati bhuvi bhavishyadvidhatre dyubhartre | atyantam santatam tvam pradisha padayuge hanta santapabhaja
    masmakam bhaktimekam bhagavata uta te madhavasyatha vayoh || || sabhroshnabhishushubhraprabhamabhaya
    nabho bhuribhubhridvibhuti bhrajishnurbhurribhunam bhavanamapi vibho'bhedi babhre babhuve | yena bhruvibhramaste
    bhramayatu subhrisham babhruvaddurbhritashan bhrantirbhedavabhasastviti bhayamabhibhurbhokshyato mayibhikshun
    || || ye'mum bhavam bhajante suramukhasujanaradhitam te tritiyam bhasante bhasuraiste sahacaracalitaishcamaraishcaruveshah
    | vaikunthe kanthalagnasthirashucivilasatkantitarunyalila lavanyapurnakantakucabharasulabhashleshasammodasandrah
    || || anandanmandamanda dadati hi marutah kundamandaranandya vartamodan dadhana mridupadamuditodgitakaih
    sundarinam | vrindairavandyamuktendvahimagumadanahindradevendrasevye maukunde mandire'sminnaviratamudayanmodinam
    devadeva || || uttapta'tyutkatatvit prakatakatakatadhvanasanghattanodya dvidyudvyudhasphulingaprakaravikiranotkvathite
    badhitangan | udgadham patyamana tamasi tata itah kinkaraih pankile te panktirgravnam garimna glapayati
    hi bhavadveshino vidvadadya || || asminnasmadgurunam haricaranaciradhyanasanmangalanam yushmakam parshvabhumim
    dhritaranaranikasvargisevyam prapannah | yastudaste sa aste'dhibhavamasulabhakleshanirmukamasta prayanandam
    kathancinna vasati satatam pancakashte'tikashte || || kshut kshaman ruksharakshoradakharanakharakshunnavikshobhitaksha
    namagnanandhakupe kshuramukhamukharaih pakshibhirvikshatangan | puyasrinmutravishthakrimikulakalile
    tatkshanakshiptashaktya dyastravratarditamstvaddvisha upajihate vajrakalpa jalukah || || matarme matarishvan
    pitaratulaguro bhratarishtaptabandho svamin sarvantaratmannajara jarayitarjanmamrityamayanam | govinde
    dehi bhaktim bhavati ca bhagavannurjitam nirnimittam nirvyajam nishcalam sadgunaganabrihatim shashvatimashu
    deva || || vishnorattyuttamatvadakhilagunaganaistatra bhaktim garishtham ashlishte shridharabhyamamumatha
    parivaratmana sevakeshu | yah sandhatte virincashvasanavihagapanantarudrendrapurve shvadhyayamstaratamyam
    sphutamavati sada vayurasmadgurustam || || tattvajnan muktibhajah sukhayisi hi guro yogyatataratamya
    dadhatse mishrabuddhimstridivanirayabhugocaran nityabaddhan | tamisrandhadikakhye tamasi subahulam
    duhkhayasyanyathajnan vishnorajnabhirittham shritishatamitihasadi cakarnayamah || || vande'ham tam
    hanumaniti mahitamahapaurusho bahushali khyataste'gryo'vatarah sahita iha bahubrahmacaryadidharmaih
    | sasnehanam sahasvanaharaharahitam nirdahan dehabhajam amhomohapaho yah sprihayati mahatim bhaktimadyapi
    rame || || prakpancashatsahasrairvyavahitamahitam yojanaih parvatam tvam yavatsanjivanadyaushadhanidhimadhikaprana
    lankamanaishih | adrakshidutpatantam tata uta girimutpatayantam grihitva yantam khe raghavanghrau
    pranatamapi tadaikakshane tvam hi lokah || || kshiptah pashcatsatsalilam shatamatulamate yojananam
    sa ucca stavadvistaravamshcapyupalalava iva vyagrabuddhya tvaya'tah | svasvasthanasthitatisthirashakalashilajalasamshleshanashta
    chchedankah pragivabhut kapivaravapushaste namah kaushalaya || || drishtva dushtadhiporah sphutitakanakasadvarma
    ghrishtasthikutam nishpishtam hatakadriprakatatatatatakatishanko jano'bhut | yena'jau ravanaripriyanatanapaturmushtirishtam
    pradeshtum kim neshte me sa te'shtapadakatakatatitkotibhamrishtakashthah || || devyadeshapranitidrihinaharavaravadhyarakshovighata
    dyasevodyaddayardrah sahabhujamakarodramanama mukundah | dushprape parameshthye karatalamatulam murdhivinyasya
    dhanyam tanvanbhuyah prabhutapranayavikasitabjekshanastvekshamanah || || jaghne nighnena vighno bahulabalabakadhvamsanadyena
    shoca dvipranukroshapashairasuvidhritisukhasyaikacakrajananam | tasmai te deva kurmah kurukulapataye
    karmana ca pranaman kirmiram durmatinam prathamamatha ca yo narmana nirmamatha || || nirmridnannatyayatnam
    vijaravara jarasandhakayasthisandhin yuddhe tvam svadhvare va pashumiva damayan vishnupakshadvidisham
    | yavatpratyakshabhutam nikhilamakhabhujam tarpayamasithasau tavatya'yoji triptya kimu vada bhagavan
    rajasuyashvamedhe || || kshvelakshinattahasam tava ranamarihannudgadoddamabahoh bahvakshauhinyanikakshapanasunipunam
    yasya sarvottamasya | shushrushartham cakartha svayamayamatha samvaktumanandatirtha shrimannamansamarthastvamapi
    hi yuvayoh padapadmam prapadye || || drihyantim hridriham mam dritamanila baladdravayantimavidya nidram
    vidravya sadyoracanapatumatha'padya vidyasamudra | vagdevi sa suvidyadravinada vidita draupadi rudrapatnya
    dudrikta dragabhadradrahayatu dayita purvabhima'jnaya te || || yabhyam shushrushurasih kurukulajanane
    kshatraviproditabhyam brahmabhyam brimhitabhyam citasukhavapusha krishnanamaspadabhyam | nirbhedabhyam
    visheshadvivacanavishayabhyamamubhyamubhabhyam tubhyam ca kshemadebhyah sarisijavilasallocanebhyo
    namo'stu || || gacchan saugandhikartham pathi sa hanumatah pucchamacchasya bhimah proddhartum nashakatsa
    tvamumuruvapusha bhishayamasa ceti | purnajnanaujasoste gurutama vapushoh shrimadanandatirtha kridamatram
    tadetat pramadada sudhiyam mohaka dveshabhajam || || bahvih kotiratikah kutalakatumatinutkatatopakopan
    drakca tvam satvaratvaccaranada gadaya pothayamasitharin | unmathyatathyamithyatvavacanavacananutpathasthamstatha'nyan
    prayacchah svapriyayai priyatamakusumam prana tasmai namaste || || dehadutkramitanamadhipatirasatamakramadvakrabuddhih
    kruddhah krodhaikavashyah krimiriva maniman dushkriti nishkriyartham | cakre bhucakrametya krakacamiva
    satam cetasah kashtashastram dustarkam cakrapanergunaganaviraham jivatam cadhikritya || || taddushprekshanusaratkatipayakunarairadrito'nyairvisrishto
    brahma'ham nirguno'ham vitathamidamiti hyesha pashandavadah | tadyuktyabhasajalaprasaravishataruddahadakshapramana
    jvalamaladharagnih pavana vijayate te'vatarastritiyah || || akroshanto nirasha bhayabharavivashasvashayashchinnadarpa
    vashanto deshanashasviti bata kudhiyam nashamashadasha'shu | dhavanto'shlilashila vitathashapathashapashivah
    shantashaurya stvadvyakhyasimhanade sapadi dadrishire mayigomayavaste || || trishvapyevavatareshvaribhirapaghrinam
    himsito nirvikarah sarvajnah sarvashaktih sakalagunaganapurnarupapragalbhah | svacchah svacchandamrityuh
    sukhayasi sujanam deva kim citramatra trata yasya tridhama jagaduta vashagam kinkarah shankaradyah
    || || udyanmandasmitashrimridu madhumadhuralapapiyushadhara purasekopashantasukhasujanamanolocanapiyamanam
    | sandrakshye sundaram sanduhadiha mahadanandamanandatirtha shrimadvaktrendubimbam duratanududitam
    nityada'ham kada nu || || pracinacirnapunyoccayacaturataracaratashcarucitta natyuccam rocayantim shruticitavacanam
    shravakamshcodyacuncun | vyakhyamutkhataduhkham ciramucitamahacarya cintaratamste citram sacchastrakartashcaranaparicaranchravayasmamshca
    kincit || || pithe ratnokapaklripte rucirarucimanijyotisha sannishannam brahmanam bhavinam tvam jvalati
    nijapade vaidikadya hi vidyah | sevante murtimatyah sucarita caritam bhati gandharva gitam pratyekam
    devasamsatsvapi tava bhagavannartitadyovadhushu || || sanukroshairajasram janimritinirayadyurmimalavile'smin
    samsarabdhau nimagnan sharanamasharananicchato vikshya jantun | yushmabhih prarthitah san jalanidhishayanah
    satyavatyam maharshe rvyaktashcinmatramurtirna khalu bhagavatah prakrito jatu dehah || || astavyastam
    samastashrutigatamadhamai ratnapugam yatha'ndhai rartham lokopakrityai gunagananilayah sutrayamasa
    kritsnam | yo'sau vyasabhidhanastamahamaharaharbhaktitastvatprasadat sadyo vidyopalabdhyai gurutamamagurum
    devadevam namami || || ajnamanyairadharyam shirasi parisaradrashmikotirakotau krishnasyaklishtakarma
    dadhadanusaranadarthito devasanghaih | bhumavagatya bhumannasukaramakarorbrahmasutrasya bhashyam durbhashyam
    vyasya dasyormanimata uditam vedasadyuktibhistvam || || bhutva kshetre vishuddhe dvijagananilaye raupyapithabhidhane
    tatrapi brahmajatistribhuvanavishade madhyagehakhyagehe | parivrajyadhirajah punarapi badarim prapya
    krishnam ca natva kritva bhashyani samyag vyatanuta ca bhavan bharatarthaprakasham || || vande tam
    tvam supurnapramatimanudinasevitam devavrindaih vande vandarumishe shriya uta niyatam shrimadanandatirtham
    | vande mandakinisatsaridamalajalasekasadhikyasangam vande'ham deva bhaktya bhavabhayadahanam sajjananmodayantam
    || || subrahmanyakhyasureh suta iti subhrisham keshavanandatirtha shrimatpadabjabhaktah stutimakrita
    harervayudevasya casya | tatpadarcadarena grathitapadalasanmalaya tvetaya ye samradhyamu namanti pratatamatiguna
    muktimete vrajanti || || atha shrinakhastutih pantvasman puruhutavairibalavanmatangamadyadghata kumbhoccadrivipatanadhikapatupratyekavajrayitah
    | shrimatkanthiravasya pratata sunakhara daritaratidura pradhvastadhvantashantapravitatamanasa bhavita
    nakivrindaih || || lakshmikanta samantato'vikalayan naiveshituste samam pashyamyuttamavastu duratarato'pastam
    raso yo'shtamah | yadroshotkaradakshanetrakutilaprantotthitagnisphurat khadyotopamavisphulingabhasita
    brahmeshashakrotkarah || || iti shritrivikramapanditacarya viracita vayustutih samapta ||
  devanagari: अथ नखस्तुतिः पान्त्वस्मान् पुरुहूतवैरिबलवन्मातङ्गमाद्यद्घटा कुम्भोच्चाद्रिविपाटनाधिकपटु
    प्रत्येक वज्रायिताः । श्रीमत्कण्ठीरवास्यप्रततसुनखरा दारितारातिदूर प्रध्वस्तध्वान्तशान्तप्रविततमनसा
    भाविता भूरिभागैः ॥ ॥ लक्ष्मीकान्त समन्ततोऽपि कलयन् नैवेशितुस्ते समं पश्याम्युत्तमवस्तु दूरतरतोपास्तं
    रसो योऽष्टमः । यद्रोषोत्कर दक्ष नेत्र कुटिल प्रान्तोत्थिताग्नि स्फुरत् खद्योतोपम विस्फुलिङ्गभसिता
    ब्रह्मेशशक्रोत्कराः ॥ ॥ अथ वायुस्तुतिः श्रीमद्विष्ण्वङ्घ्रिनिष्ठातिगुणगुरुतमश्रीमदानन्दतीर्थ त्रैलोक्याचार्यपादोज्ज्वलजलजलसत्पांसवोऽस्मान्
    पुनन्तु । वाचां यत्र प्रणेत्री त्रिभुवनमहिता शारदा शारदेन्दु ज्योत्स्नाभद्रस्मितश्रीधवलितककुभा प्रेमभारं
    बभार ॥ ॥ उत्कण्ठाकुण्ठकोलाहलजवविजिताजस्रसेवानुवृद्ध प्राज्ञात्मज्ञानधूतान्धतमससुमनोमौलिरत्नावलीनाम्
    । भक्त्युद्रेकावगाढप्रघटनसधटात्कारसङ्घृष्यमाण प्रान्तप्राग्र्याङ्घ्रिपीठोत्थितकनकरजःपिञ्जरारञ्जिताशाः
    ॥ ॥ जन्माधिव्याध्युपाधिप्रतिहतिविरहप्रापकाणां गुणानां अग्र्याणामर्पकाणां चिरमुदितचिदानन्दसन्दोहदानाम्
    । एतेषामेष दोषप्रमुषितमनसां द्वेषिणां दूषकाणां दैत्यानामार्तिमन्धे तमसि विदधतां संस्तवे नास्मि शक्तः
    ॥ ॥ अस्याविष्कर्तुकामं कलिमलकलुषेऽस्मिन् जने ज्ञानमार्गं वन्द्यं चन्द्रेन्द्ररुद्रद्युमणिफणिवयोनायकाद्यैरिहाद्य
    । मध्वाख्यं मन्त्रसिद्धं किमुत कृतवतो मारुतस्यावतारं पातारं पारमेष्ट्यं पदमपविपदः प्राप्तुरापन्नपुंसाम्
    ॥ ॥ उद्यद्विद्युत्प्रचण्डां निजरुचिनिकरव्याप्तलोकावकाशो बिभ्रद्भीमो भुजे योऽभ्युदितदिनकराभाङ्गदाढ्य
    प्रकाण्डे । वीर्योद्धार्यां गदाग्र्यामयमिह सुमतिं वायुदेवो विदध्यात् अध्यात्मज्ञाननेता यतिवरमहितो
    भूमिभूषामणिर्मे ॥ ॥ संसारोत्तापनित्योपशमदसदयस्नेहहासाम्बुपूर प्रोद्यद्विद्यानवद्यद्युतिमणिकिरणश्रेणिसम्पूरिताशः
    । श्रीवत्साङ्काधिवासोचिततरसरलश्रीमदानन्दतीर्थ क्षीराम्भोधिर्विभिन्द्याद्भवदनभिमतं भूरि मे भूतिहेतुः
    ॥ ॥ मूर्धन्येषोऽञ्जलिर्मे दृढतरमिह ते बध्यते बन्धपाश च्छेत्रे दात्रे सुखानां भजति भुवि भविष्यद्विधात्रे
    द्युभर्त्रे । अत्यन्तं सन्ततं त्वं प्रदिश पदयुगे हन्त सन्तापभाजा मस्माकं भक्तिमेकां भगवत उत ते माधवस्याथ
    वायोः ॥ ॥ साभ्रोष्णाभीशुशुभ्रप्रभमभय नभो भूरिभूभृद्विभूति भ्राजिष्णुर्भूरृभूणां भवनमपि विभोऽभेदि बभ्रे
    बभूवे । येन भ्रूविभ्रमस्ते भ्रमयतु सुभृशं बभ्रुवद्दुर्भृताशान् भ्रान्तिर्भेदावभासस्त्विति भयमभिभूर्भोक्ष्यतो
    मायिभिक्षून् ॥ ॥ येऽमुं भावं भजन्ते सुरमुखसुजनाराधितं ते तृतीयं भासन्ते भासुरैस्ते सहचरचलितैश्चामरैश्चारुवेषाः
    । वैकुण्ठे कण्ठलग्नस्थिरशुचिविलसत्कान्तितारुण्यलीला लावण्यापूर्णकान्ताकुचभरसुलभाश्लेषसम्मोदसान्द्राः
    ॥ ॥ आनन्दान्मन्दमन्दा ददति हि मरुतः कुन्दमन्दारनन्द्या वर्तामोदान् दधाना मृदुपदमुदितोद्गीतकैः सुन्दरीणाम्
    । वृन्दैरावन्द्यमुक्तेन्द्वहिमगुमदनाहीन्द्रदेवेन्द्रसेव्ये मौकुन्दे मन्दिरेऽस्मिन्नविरतमुदयन्मोदिनां
    देवदेव ॥ ॥ उत्तप्ताऽत्युत्कटत्विट् प्रकटकटकटध्वानसङ्घट्टनोद्य द्विद्युद्व्यूढस्फुलिङ्गप्रकरविकिरणोत्क्वाथिते
    बाधिताङ्गान् । उद्गाढं पात्यमाना तमसि तत इतः किङ्करैः पङ्किले ते पङ्क्तिर्ग्राव्णां गरिम्णा ग्लपयति
    हि भवद्वेषिणो विद्वदाद्य ॥ ॥ अस्मिन्नस्मद्गुरूणां हरिचरणचिरध्यानसन्मङ्गलानां युष्माकं पार्श्वभूमिं
    धृतरणरणिकस्वर्गिसेव्यां प्रपन्नः । यस्तूदास्ते स आस्तेऽधिभवमसुलभक्लेशनिर्मूकमस्त प्रायानन्दं कथञ्चिन्न
    वसति सततं पञ्चकष्टेऽतिकष्टे ॥ ॥ क्षुत् क्षामान् रूक्षरक्षोरदखरनखरक्षुण्णविक्षोभिताक्षा नामग्नानान्धकूपे
    क्षुरमुखमुखरैः पक्षिभिर्विक्षताङ्गान् । पूयासृङ्मूत्रविष्ठाकृमिकुलकलिले तत्क्षणक्षिप्तशक्त्या द्यस्त्रव्रातार्दितांस्त्वद्द्विष
    उपजिहते वज्रकल्पा जलूकाः ॥ ॥ मातर्मे मातरिश्वन् पितरतुलगुरो भ्रातरिष्टाप्तबन्धो स्वामिन् सर्वान्तरात्मन्नजर
    जरयितर्जन्ममृत्यामयानाम् । गोविन्दे देहि भक्तिं भवति च भगवन्नूर्जितां निर्निमित्तां निर्व्याजां निश्चलां
    सद्गुणगणबृहतीं शाश्वतीमाशु देव ॥ ॥ विष्णोरत्त्युत्तमत्वादखिलगुणगणैस्तत्र भक्तिं गरिष्ठां आश्लिष्टे
    श्रीधराभ्याममुमथ परिवारात्मना सेवकेषु । यः सन्धत्ते विरिञ्चश्वसनविहगपानन्तरुद्रेन्द्रपूर्वे ष्वाध्यायंस्तारतम्यं
    स्फुटमवति सदा वायुरस्मद्गुरुस्तम् ॥ ॥ तत्त्वज्ञान् मुक्तिभाजः सुखयिसि हि गुरो योग्यतातारतम्या दाधत्से
    मिश्रबुद्धिंस्त्रिदिवनिरयभूगोचरान् नित्यबद्धान् । तामिस्रान्धादिकाख्ये तमसि सुबहुलं दुःखयस्यन्यथाज्ञान्
    विष्णोराज्ञाभिरित्थं शृतिशतमितिहासादि चाकर्णयामः ॥ ॥ वन्देऽहं तं हनूमानिति महितमहापौरुषो बाहुशाली
    ख्यातस्तेऽग्र्योऽवतारः सहित इह बहुब्रह्मचर्यादिधर्मैः । सस्नेहानां सहस्वानहरहरहितं निर्दहन् देहभाजां
    अंहोमोहापहो यः स्पृहयति महतीं भक्तिमद्यापि रामे ॥ ॥ प्राक्पञ्चाशत्सहस्रैर्व्यवहितमहितं योजनैः पर्वतं
    त्वं यावत्सञ्जीवनाद्यौषधनिधिमधिकप्राण लङ्कामनैषिः । अद्राक्षीदुत्पतन्तं तत उत गिरिमुत्पाटयन्तं गृहीत्वा
    यान्तं खे राघवाङ्घ्रौ प्रणतमपि तदैकक्षणे त्वां हि लोकः ॥ ॥ क्षिप्तः पश्चात्सत्सलीलं शतमतुलमते योजनानां
    स उच्च स्तावद्विस्तारवंश्चाप्युपललव इव व्यग्रबुद्ध्या त्वयाऽतः । स्वस्वस्थानस्थितातिस्थिरशकलशिलाजालसंश्लेषनष्ट
    छ्छेदाङ्कः प्रागिवाभूत् कपिवरवपुषस्ते नमः कौशलाय ॥ ॥ दृष्ट्वा दुष्टाधिपोरः स्फुटितकनकसद्वर्म घृष्टास्थिकूटं
    निष्पिष्टं हाटकाद्रिप्रकटतटतटाकातिशङ्को जनोऽभूत् । येनाऽजौ रावणारिप्रियनटनपटुर्मुष्टिरिष्टं प्रदेष्टुं
    किं नेष्टे मे स तेऽष्टापदकटकतटित्कोटिभामृष्टकाष्ठः ॥ ॥ देव्यादेशप्रणीतिदृहिणहरवरावध्यरक्षोविघाता द्यासेवोद्यद्दयार्द्रः
    सहभुजमकरोद्रामनामा मुकुन्दः । दुष्प्रापे पारमेष्ठ्ये करतलमतुलं मूर्धिविन्यस्य धन्यं तन्वन्भूयः प्रभूतप्रणयविकसिताब्जेक्षणस्त्वेक्षमाणः
    ॥ ॥ जघ्ने निघ्नेन विघ्नो बहुलबलबकध्वंसनाद्येन शोच द्विप्रानुक्रोशपाशैरसुविधृतिसुखस्यैकचक्राजनानाम्
    । तस्मै ते देव कुर्मः कुरुकुलपतये कर्मणा च प्रणामान् किर्मीरं दुर्मतीनां प्रथममथ च यो नर्मणा निर्ममाथ
    ॥ ॥ निर्मृद्नन्नत्ययत्नं विजरवर जरासन्धकायास्थिसन्धीन् युद्धे त्वं स्वध्वरे वा पशुमिव दमयन् विष्णुपक्षद्विडीशम्
    । यावत्प्रत्यक्षभूतं निखिलमखभुजं तर्पयामासिथासौ तावत्याऽयोजि तृप्त्या किमु वद भगवन् राजसूयाश्वमेधे
    ॥ ॥ क्ष्वेलाक्षीणाट्टहासं तव रणमरिहन्नुद्गदोद्दामबाहोः बह्वक्षौहिण्यनीकक्षपणसुनिपुणं यस्य सर्वोत्तमस्य
    । शुश्रूषार्थं चकर्थ स्वयमयमथ संवक्तुमानन्दतीर्थ श्रीमन्नामन्समर्थस्त्वमपि हि युवयोः पादपद्मं प्रपद्ये
    ॥ ॥ दृह्यन्तीं हृदृहं मां दृतमनिल बलाद्द्रावयन्तीमविद्या निद्रां विद्राव्य सद्योरचनपटुमथाऽपाद्य विद्यासमुद्र
    । वाग्देवी सा सुविद्याद्रविणद विदिता द्रौपदी रुद्रपत्न्या दुद्रिक्ता द्रागभद्राद्रहयतु दयिता पूर्वभीमाऽज्ञया
    ते ॥ ॥ याभ्यां शुश्रूषुरासीः कुरुकुलजनने क्षत्रविप्रोदिताभ्यां ब्रह्मभ्यां बृंहिताभ्यां चितसुखवपुषा
    कृष्णनामास्पदाभ्याम् । निर्भेदाभ्यां विशेषाद्विवचनविषयाभ्याममूभ्यामुभाभ्यां तुभ्यं च क्षेमदेभ्यः सरिसिजविलसल्लोचनेभ्यो
    नमोऽस्तु ॥ ॥ गच्छन् सौगन्धिकार्थं पथि स हनुमतः पुच्छमच्छस्य भीमः प्रोद्धर्तुं नाशकत्स त्वमुमुरुवपुषा
    भीषयामास चेति । पूर्णज्ञानौजसोस्ते गुरुतम वपुषोः श्रीमदानन्दतीर्थ क्रीडामात्रं तदेतत् प्रमदद सुधियां
    मोहक द्वेषभाजाम् ॥ ॥ बह्वीः कोटीरटीकः कुटलकटुमतीनुत्कटाटोपकोपान् द्राक्च त्वं सत्वरत्वाच्चरणद गदया
    पोथयामासिथारीन् । उन्मथ्यातथ्यमिथ्यात्ववचनवचनानुत्पथस्थांस्तथाऽन्यान् प्रायच्छः स्वप्रियायै प्रियतमकुसुमं
    प्राण तस्मै नमस्ते ॥ ॥ देहादुत्क्रामितानामधिपतिरसतामक्रमाद्वक्रबुद्धिः क्रुद्धः क्रोधैकवश्यः क्रिमिरिव
    मणिमान् दुष्कृती निष्क्रियार्थम् । चक्रे भूचक्रमेत्य क्रकचमिव सतां चेतसः कष्टशास्त्रं दुस्तर्कं चक्रपाणेर्गुणगणविरहं
    जीवतां चाधिकृत्य ॥ ॥ तद्दुष्प्रेक्षानुसारात्कतिपयकुनरैरादृतोऽन्यैर्विसृष्टो ब्रह्माऽहं निर्गुणोऽहं
    वितथमिदमिति ह्येष पाषण्डवादः । तद्युक्त्याभासजालप्रसरविषतरूद्दाहदक्षप्रमाण ज्वालामालाधराग्निः पवन
    विजयते तेऽवतारस्तृतीयः ॥ ॥ आक्रोशन्तो निराशा भयभरविवशस्वाशयाश्छिन्नदर्पा वाशन्तो देशनाशस्विति बत कुधियां
    नाशमाशादशाऽशु । धावन्तोऽश्लीलशीला वितथशपथशापाशिवाः शान्तशौर्या स्त्वद्व्याख्यासिंहनादे सपदि ददृशिरे
    मायिगोमायवस्ते ॥ ॥ त्रिष्वप्येवावतारेष्वरिभिरपघृणं हिंसितो निर्विकारः सर्वज्ञः सर्वशक्तिः सकलगुणगणापूर्णरूपप्रगल्भः
    । स्वच्छः स्वच्छन्दमृत्युः सुखयसि सुजनं देव किं चित्रमत्र त्राता यस्य त्रिधामा जगदुत वशगं किङ्कराः
    शङ्कराद्याः ॥ ॥ उद्यन्मन्दस्मितश्रीमृदु मधुमधुरालापपीयूषधारा पूरासेकोपशान्तासुखसुजनमनोलोचनापीयमानम्
    । सन्द्रक्ष्ये सुन्दरं सन्दुहदिह महदानन्दमानन्दतीर्थ श्रीमद्वक्त्रेन्दुबिम्बं दुरतनुदुदितं नित्यदाऽहं
    कदा नु ॥ ॥ प्राचीनाचीर्णपुण्योच्चयचतुरतराचारतश्चारुचित्ता नत्युच्चां रोचयन्तीं श्रुतिचितवचनां श्रावकांश्चोद्यचुञ्चून्
    । व्याख्यामुत्खातदुःखां चिरमुचितमहाचार्य चिन्तारतांस्ते चित्रां सच्छास्त्रकर्ताश्चरणपरिचराञ्छ्रावयास्मांश्च
    किञ्चित् ॥ ॥ पीठे रत्नोकपक्लृप्ते रुचिररुचिमणिज्योतिषा सन्निषण्णं ब्रह्माणं भाविनं त्वां ज्वलति निजपदे
    वैदिकाद्या हि विद्याः । सेवन्ते मूर्तिमत्यः सुचरित चरितं भाति गन्धर्व गीतं प्रत्येकं देवसंसत्स्वपि
    तव भगवन्नर्तितद्योवधूषु ॥ ॥ सानुक्रोशैरजस्रं जनिमृतिनिरयाद्यूर्मिमालाविलेऽस्मिन् संसाराब्धौ निमग्नान्
    शरणमशरणानिच्छतो वीक्ष्य जन्तून् । युष्माभिः प्रार्थितः सन् जलनिधिशयनः सत्यवत्यां महर्षे र्व्यक्तश्चिन्मात्रमूर्तिर्न
    खलु भगवतः प्राकृतो जातु देहः ॥ ॥ अस्तव्यस्तं समस्तश्रुतिगतमधमै रत्नपूगं यथाऽन्धै रर्थं लोकोपकृत्यै
    गुणगणनिलयः सूत्रयामास कृत्स्नम् । योऽसौ व्यासाभिधानस्तमहमहरहर्भक्तितस्त्वत्प्रसादात् सद्यो विद्योपलब्ध्यै
    गुरुतममगुरुं देवदेवं नमामि ॥ ॥ आज्ञामन्यैरधार्यां शिरसि परिसरद्रश्मिकोटीरकोटौ कृष्णस्याक्लिष्टकर्मा
    दधदनुसराणादर्थितो देवसङ्घैः । भूमावागत्य भूमन्नसुकरमकरोर्ब्रह्मसूत्रस्य भाष्यं दुर्भाष्यं व्यस्य दस्योर्मणिमत
    उदितं वेदसद्युक्तिभिस्त्वम् ॥ ॥ भूत्वा क्षेत्रे विशुद्धे द्विजगणनिलये रौप्यपीठाभिधाने तत्रापि ब्रह्मजातिस्त्रिभुवनविशदे
    मध्यगेहाख्यगेहे । पारिव्राज्याधिराजः पुनरपि बदरीं प्राप्य कृष्णं च नत्वा कृत्वा भाष्याणि सम्यग् व्यतनुत
    च भवान् भारतार्थप्रकाशम् ॥ ॥ वन्दे तं त्वां सुपूर्णप्रमतिमनुदिनासेवितं देववृन्दैः वन्दे वन्दारुमीशे
    श्रिय उत नियतं श्रीमदानन्दतीर्थम् । वन्दे मन्दाकिनीसत्सरिदमलजलासेकसाधिक्यसङ्गं वन्देऽहं देव भक्त्या
    भवभयदहनं सज्जनान्मोदयन्तम् ॥ ॥ सुब्रह्मण्याख्यसूरेः सुत इति सुभृशं केशवानन्दतीर्थ श्रीमत्पादाब्जभक्तः
    स्तुतिमकृत हरेर्वायुदेवस्य चास्य । तत्पादार्चादरेण ग्रथितपदलसन्मालया त्वेतया ये संराध्यामू नमन्ति
    प्रततमतिगुणा मुक्तिमेते व्रजन्ति ॥ ॥ अथ श्रीनखस्तुतिः पान्त्वस्मान् पुरुहूतवैरिबलवन्मातङ्गमाद्यद्घटा
    कुम्भोच्चाद्रिविपाटनाधिकपटुप्रत्येकवज्रायिताः । श्रीमत्कण्ठीरवास्य प्रतत सुनखरा दारितारातिदूर प्रध्वस्तध्वान्तशान्तप्रविततमनसा
    भाविता नाकिवृन्दैः ॥ ॥ लक्ष्मीकान्त समन्ततोऽविकलयन् नैवेशितुस्ते समं पश्याम्युत्तमवस्तु दूरतरतोऽपास्तं
    रसो योऽष्टमः । यद्रोषोत्करदक्षनेत्रकुटिलप्रान्तोत्थिताग्निस्फुरत् खद्योतोपमविस्फुलिङ्गभसिता ब्रह्मेशशक्रोत्कराः
    ॥ ॥ इति श्रीत्रिविक्रमपण्डिताचार्य विरचिता वायुस्तुतिः समाप्ता ॥
