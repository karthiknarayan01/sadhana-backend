id: sri-sita-rama-stotram
category: stotram
name:
  english: Sri Sita Rama Stotram
content:
  english: ayodhyapuranetaram mithilapuranayikam | raghavanamalankaram vaidehanamalankriyam || || raghunam
    kuladipam ca niminam kuladipikam | suryavamshasamudbhutam somavamshasamudbhavam || || putram dasharathasyadyam
    putrim janakabhupateh | vashishthanumatacaram shatanandamatanugam || || kausalyagarbhasambhutam vedigarbhoditam
    svayam | pundarikavishalaksham sphuradindivarekshanam || || candrakantananambhojam candrabimbopamananam
    | mattamatangagamanam mattahamsavadhugatam || || candanardrabhujamadhyam kunkumardrakucasthalim |
    capalankritahastabjam padmalankritapanikam || || sharanagatagoptaram pranipadaprasadikam | kalameghanibham
    ramam kartasvarasamaprabham || || divyasimhasanasinam divyasragvastrabhushanam | anukshanam katakshabhyam
    anyonyekshanakankshinau || || anyonyasadrishakarau trailokyagrihadampati| imau yuvam pranamyaham bhajamyadya
    kritarthatam || || anena stauti yah stutyam ramam sitam ca bhaktitah | tasya tau tanutam punyah sampadah
    sakalarthadah || || evam shriramacandrasya janakyashca visheshatah | kritam hanumata punyam stotram
    sadyo vimuktidam | yah pathetpratarutthaya sarvan kamanavapnuyat || sitarama stotram sampurnam ||
  devanagari: अयोध्यापुरनेतारं मिथिलापुरनायिकाम् । राघवाणामलङ्कारं वैदेहानामलङ्क्रियाम् ॥ ॥ रघूणां कुलदीपं
    च निमीनां कुलदीपिकाम् । सूर्यवंशसमुद्भूतं सोमवंशसमुद्भवाम् ॥ ॥ पुत्रं दशरथस्याद्यं पुत्रीं जनकभूपतेः
    । वशिष्ठानुमताचारं शतानन्दमतानुगाम् ॥ ॥ कौसल्यागर्भसम्भूतं वेदिगर्भोदितां स्वयम् । पुण्डरीकविशालाक्षं
    स्फुरदिन्दीवरेक्षणाम् ॥ ॥ चन्द्रकान्ताननाम्भोजं चन्द्रबिम्बोपमाननाम् । मत्तमातङ्गगमनं मत्तहंसवधूगताम्
    ॥ ॥ चन्दनार्द्रभुजामध्यं कुङ्कुमार्द्रकुचस्थलीम् । चापालङ्कृतहस्ताब्जं पद्मालङ्कृतपाणिकाम् ॥ ॥ शरणागतगोप्तारं
    प्रणिपादप्रसादिकाम् । कालमेघनिभं रामं कार्तस्वरसमप्रभाम् ॥ ॥ दिव्यसिंहासनासीनं दिव्यस्रग्वस्त्रभूषणाम्
    । अनुक्षणं कटाक्षाभ्यां अन्योन्येक्षणकाङ्क्षिणौ ॥ ॥ अन्योन्यसदृशाकारौ त्रैलोक्यगृहदम्पती। इमौ युवां
    प्रणम्याहं भजाम्यद्य कृतार्थताम् ॥ ॥ अनेन स्तौति यः स्तुत्यं रामं सीतां च भक्तितः । तस्य तौ तनुतां
    पुण्याः सम्पदः सकलार्थदाः ॥ ॥ एवं श्रीरामचन्द्रस्य जानक्याश्च विशेषतः । कृतं हनूमता पुण्यं स्तोत्रं
    सद्यो विमुक्तिदम् । यः पठेत्प्रातरुत्थाय सर्वान् कामानवाप्नुयात् ॥ सीताराम स्तोत्रं सम्पूर्णम् ॥
