id: karika
category: upanishad
name:
  english: karika
  devanagari: कारिका
content:
  english: llokavidah prahurashrama iti tadvidah | stripumnapumsakam laingah paraparamathapare || 27||
    srishtiriti srishtivido laya iti ca tadvidah | sthitiriti sthitividah sarve ceha tu sarvada || 28||
    yam bhavam darshayedyasya tam bhavam sa tu pashyati | tam cavati sa bhutva'sau tadgrahah samupaiti
    tam || 29|| etairesho'prithagbhavaih prithageveti lakshitah | evam yo veda tattvena kalpayetso'vishankitah
    || 30|| svapnamaye yatha drishte gandharvanagaram yatha | tatha vishvamidam drishtam vedanteshu vicakshanaih
    || 31|| na nirodho na cotpattirna baddho na ca sadhakah | na mumukshurna vai mukta ityesha paramarthata
    || 32|| bhavairasadbhirevayamadvayena ca kalpitah | bhava apyadvayenaiva tasmadadvayata shiva || 33||
    na''tmabhavena nanedam na svenapi kathancana | na prithannaprithakkinciditi tattvavido viduh || 34||
    vitaragabhayakrodhairmunibhirvedaparagaih | nirvikalpo hyayam drishtah prapancopashamo'dvayah || 35||
    tasmadevam viditvainamadvaite yojayetsmritim | advaitam samanuprapya jadavallokamacaret || 36|| nistutirnirnamaskaro
    nihsvadhakara eva ca | calacalaniketashca yatiryadricchiko bhavet || 37|| tattvamadhyatmikam drishtva
    tattvam drishtva tu bahyatah | tattvibhutastadaramastattvadapracyuto bhavet || 38|| iti gaudapadiyakarikasu
    vaitathyakhyam dvitiyam prakaranam || 2|| om || upasanashrito dharmo jate brahmani vartate | pragutpatterajam
    sarvam tenasau kripanah smritah || 1|| ato vakshyamyakarpanyamajati samatam gatam | yatha na jayate
    kincijjayamanam samantatah || 2|| atma hyakashavajjivairghatakashairivoditah | ghatadivacca sanghatairjatavetannidarshanam
    || 3|| ghatadishu pralineshu ghatakashadayo yatha | akashe sampraliyante tadvajjiva iha''tmani ||
    4|| yathaikasminghatakashe rajodhumadibhiryute | na sarve samprayujyante tadvajjivah sukhadibhih ||
    5|| rupakaryasamakhyashca bhidyante tatra tatra vai | akashasya na bhedo'sti tadvajjiveshu nirnayah
    || 6|| na''kashasya ghatakasho vikaravayavau yatha | naiva''tmanah sada jivo vikaravayavau tatha ||
    7|| yatha bhavati balanam gaganam malinam malaih | tatha bhavatyabuddhanamatma'pi malino malaih ||
    8|| marane sambhave caiva gatyagamanayorapi | sthitau sarvasharireshu akashenavilakshanah || 9|| sanghatah
    svapnavatsarve atmamayavisarjitah | adhikye sarvasamye va nopapattirhi vidyate || 10|| rasadayo hi
    ye kosha vyakhyatastaittiriyake | teshamatma paro jivah kham yatha samprakashitah || 11|| dvayordvayormadhujnane
    param brahma prakashitam | prithivyamudare caiva yatha''kashah prakashitah || 12|| jivatmanorananyatvamabhedena
    prashasyate | nanatvam nindyate yacca tadevam hi samanjasam || 13|| jivatmanoh prithaktvam yatpragutpatteh
    prakirtitam | bhavishyadvrittya gaunam tanmukhyatvam hi na yujyate || 14|| mrillohavisphulingadyai
    srishtirya codita'nyatha | upayah so'vataraya nasti bhedah kathancana || 15|| ashramastrividha hinamadhyamotkrishtadrishtayah
    | upasanopadishteyam tadarthamanukampaya || 16|| svasiddhantavyavasthasu dvaitino nishcita dridham
    | parasparam virudhyante tairayam na virudhyate || 17|| advaitam paramartho hi dvaitam tadbheda ucyate
    | teshamubhayatha dvaitam tenayam na virudhyate || 18|| mayaya bhidyate hyetannanyatha'jam kathancana
    | tattvato bhidyamane hi martyatamamritam vrajet || 19|| ajatasyaiva bhavasya jatimicchanti vadinah
    | ajato hyamrito bhavo martyatam kathameshyati || 20|| na bhavatyamritam martyam na martyamamritam
    tatha | prakriteranyathabhavo na kathancidbhavishyati || 21|| svabhavenamrito yasya bhavo gacchati
    martyatam | kritakenamritastasya katham sthasyati nishcalah || 22|| bhutato'bhutato va'pi srijyamane
    sama shrutih | nishcitam yuktiyuktam ca yattadbhavati netarat || 23|| neha naneti ca''mnayadindro
    mayabhirityapi || ajayamano bahudha mayaya jayate tu sah || 24|| sambhuterapavadacca sambhavah pratishidhyate
    | ko nvenam janayediti karanam pratishidhyate || 25|| sa esha neti netiti vyakhyatam nihnute yatah
    | sarvamagrahyabhavena hetuna'jam prakashate || 26|| sato hi mayaya janma yujyate na tu tattvatah
    | tattvato jayate yasya jatam tasya hi jayate || 27|| asato mayaya janma tattvato naiva yujyate |
    vandhyaputro na tattvena mayaya va'pi jayate || 28|| yatha svapne dvayabhasam spandate mayaya manah
    | tatha jagraddvayabhasam spandate mayaya manah || 29|| advayam ca dvayabhasam manah svapne na samshayah
    | advayam ca dvayabhasam tatha jagranna samshayah || 30|| manodrishyamidam dvaitam yatkincitsacaracaram
    | manaso hyamanibhave dvaitam naivopalabhyate || 31|| atmasatyanubodhena na sankalpayate yada | amanastam
    tada yati grahyabhave tadagraham || 32|| akalpakamajam jnanam jneyabhinnam pracakshate | brahmajneyamajam
    nityamajenajam vibudhyate || 33|| nigrihitasya manaso nirvikalpasya dhimatah | pracarah sa tu vijneyah
    sushupte'nyo na tatsamah || 34|| liyate hi sushupte tannigrihitam na liyate | tadeva nirbhayam brahma
    jnanalokam samantatah || 35|| ajamanidramasvapnamanamakamarupakam | sakridvibhatam sarvajnam nopacarah
    kathancana || 36|| sarvabhilapavigatah sarvacintasamutthitah | suprashantah sakrijjyotih samadhiracalo'bhayah
    || 37|| graho na tatra notsargrashcinta yatra na vidyate | atmasamstham tada jnanamajati samatam gatam
    || 38|| asparshayogo vai nama durdarshah sarvayogibhih | yogino bibhyati hyasmadabhaye bhayadarshinah
    || 39|| manaso nigrahayattamabhayam sarvayoginam | duhkhakshayah prabodhashcapyakshaya shantireva
    ca || 40|| utseka udadheryadvatkushagrenaikabinduna | manaso nigrahastadvadbhavedaparikhedatah ||
    41|| upayena nigrihniyadvikshiptam kamabhogayoh | suprasannam laye caiva yatha kamo layastatha ||
    42|| duhkham sarvamanusmritya kamabhogannivartayet | ajam sarvamanusmritya jatam naiva tu pashyati
    || 43|| laye sambodhayeccittam vikshiptam shamayetpunah | sakashayam vijaniyatsamapraptam na calayet
    || 44|| na''svadayetsukham tatra nihsangah prajnaya bhavet | nishcalam nishcaraccittameki kuryatprayatnatah
    || 45|| yada na liyate cittam na ca vikshipyate punah | aninganamanabhasam nishpannam brahma tattada
    || 46|| svastham shantam sanirvanamakathyam sukhamuttamam | ajamajena jneyena sarvajnam paricakshata
    || 47|| na kashcijjayate jivah sambhavo'sya na vidyate | etattaduttamam satyam yatra kincinna jayate
    || 48|| iti gaudapadiyakarikayamadvaitakhyam tritiyam prakaranam || 3|| om tatsat || jnanena''kashakalpena
    dharmanyo gaganopaman | jneyabhinnena sambuddhastam vande dvipadam varam || 1|| asparshayogo vai nama
    sarvasattvasukho hitah | avivado'viruddhashca deshitastam namamyaham || 2|| bhutasya jatimicchanti
    vadinah kecideva hi | abhutasyapare dhira vivadantah parasparam || 3|| bhutam na jayate kincidabhutam
    naiva jayate | vivadanto dvaya hyevamajatim khyapayanti te || 4|| khyapyamanamajatim tairanumodamahe
    vayam | vivadamo na taih sardhamavivadam nibodhata || 5|| ajatasyaiva dharmasya jatimicchanti vadinah
    | ajato hyamrito dharmo martyatam kathameshyati || 6|| na bhavatyamritam martyam na martyamamritam
    tatha | prakriteranyathabhavo na kathancidbhavishyati || 7|| svabhavenamrito yasya dharmo gacchati
    martyatam | kritakenamritastasya katham sthasyati nishcalah || 8|| samsiddhiki svabhaviki sahaja akrita
    ca ya | prakritih seti vijneya svabhavam na jahati ya || 9|| jaramarananirmuktah sarve dharmah svabhavatah
    | jaramaranamicchantashcyavante tanmanishaya || 10|| karanam yasya vai karyam karanam tasya jayate
    | jayamanam kathamajam bhinnam nityam katham ca tat || 11|| karanadyadyananyatvamatah karyamajam yadi
    | jayamanaddhi vai karyatkaranam te katham dhruvam || 12|| ajadvai jayate yasya drishtantastasya nasti
    vai | jatacca jayamanasya na vyavastha prasajyate || 13|| hetoradih phalam yeshamadirhetuh phalasya
    ca | hetoh phalasya canadih katham tairupavarnyate || 14|| hetoradih phalam yeshamadirhetuh phalasya
    ca | tatha janma bhavettesham putrajjanma pituryatha || 15|| sambhave hetuphalayoreshitavyah kramastvaya
    | yugapatsambhave yasmadasambandho vishanavat || 16|| phaladutpadyamanah sanna te hetuh prasidhyati
    | aprasiddhah katham hetuh phalamutpadayishyati || 17|| yadi hetoh phalatsiddhih phalasiddhishca hetutah
    | kataratpurvanishpannam yasya siddhirapekshaya || 18|| ashaktiraparijnanam kramakopo'tha va punah
    | evam hi sarvatha buddhairajatih paridipita || 19|| bijankurakhyo drishtantah sada sadhyasamo hi
    sah | na hi sadhyasamo hetuh siddhau sadhyasya yujyate || 20|| purvaparaparijnanamajateh paridipakam
    | jayamanaddhi vai dharmatkatham purvam na grihyate || 21|| svato va parato va'pi na kincidvastu jayate
    | sadasatsadasadva'pi na kincidvastu jayate || 22|| heturna jayate'nadeh phalam capi svabhavatah |
    adirna vidyate yasya tasya hyadirna vidyate || 23|| prajnapteh sanimittatvamanyatha dvayanashatah
    | sankleshasyopalabdheshca paratantrastita mata || 24|| prajnapteh sanimittatvamishyate yuktidarshanat
    | nimittasyanimittatvamishyate bhutadarshanat || 25|| cittam na samsprishatyartham narthabhasam tathaiva
    ca | abhuto hi yatashcartho narthabhasastatah prithak || 26|| nimittam na sada cittam samsprishatyadhvasu
    trishu | animitto viparyasah katham tasya bhavishyati || 27|| tasmanna jayate cittam cittadrishyam
    na jayate | tasya pashyanti ye jatim khe vai pashyanti te padam || 28|| ajatam jayate yasmadajatih
    prakritistatah | prakriteranyathabhavo na kathancidbhavishyati || 29|| anaderantavattvam ca samsarasya
    na setsyati | anantata ca''dimato mokshasya na bhavishyati || 30|| adavante ca yannasti vartamane'pi
    tattatha | vitathaih sadrishah santo'vitatha iva lakshitah || 31|| saprayojanata tesham svapne vipratipadyate
    | tasmadadyantavattvena mithyaiva khalu te smritah || 32|| sarve dharma mrisha svapne kayasyantarnidarshanat
    | samvrite'sminpradeshe vai bhutanam darshanam kutah || 33|| na yuktam darshanam gatva kalasyaniyamadgatau
    | pratibuddhashca vai sarvastasmindeshe na vidyate || 34|| mitradyaih saha sammantrya sambuddho na
    prapadyate | grihitam capi yatkincitpratibuddho na pashyati || 35|| svapne cavastukah kayah prithaganyasya
    darshanat | yatha kayastatha sarvam cittadrishyamavastukam || 36|| grahanajjagaritavattaddhetuh svapna
    ishyate | taddhetutvattu tasyaiva sajjagaritamishyate || 37|| utpadasyaprasiddhatvadajam sarvamudahritam
    | na ca bhutadabhutasya sambhavo'sti kathancana || 38|| asajjagarite drishtva svapne pashyati tanmayah
    | asatsvapne'pi drishtva ca pratibuddho na pashyati || 39|| nastyasaddhetukamasatsadasaddhetukam tatha
    | sacca saddhetukam nasti saddhetukamasatkutah || 40|| viparyasadyatha jagradacintyanbhutavatsprishet
    | tatha svapne viparyasat dharmamstatraiva pashyati || 41|| upalambhatsamacaradastivastutvavadinam
    | jatistu deshita buddhaih ajatestrasatam sada || 42|| ajatestrasatam teshamupalambhadviyanti ye |
    jatidosha na setsyanti dosho'pyalpo bhavishyati || 43|| upalambhatsamacaranmayahasti yathocyate |
    upalambhatsamacaradasti vastu tathocyate || 44|| jatyabhasam calabhasam vastvabhasam tathaiva ca |
    ajacalamavastutvam vijnanam shantamadvayam || 45|| evam na jayate cittamevamdharma ajah smritah |
    evameva vijananto na patanti viparyate || 46|| rijuvakradikabhasamalataspanditam yatha | grahanagrahakabhasam
    vijnanaspanditam tatha || 47|| aspandamanamalatamanabhasamajam yatha | aspandamanam vijnanamanabhasamajam
    tatha || 48|| alate spandamane vai na''bhasa anyatobhuvah | na tato'nyatra nispandannalatam pravishanti
    te || 49|| na nirgata alatatte dravyatvabhavayogatah | vijnane'pi tathaiva syurabhasasyavisheshatah
    || 50|| vijnane spandamane vai na''bhasa anyatobhuvah | na tato'nyatra nispandanna vijnanam vishanti
    te || 51|| na nirgataste vijnanaddravyatvabhavayogatah | karyakaranatabhavadyato'cintyah sadaiva te
    || 52|| dravyam dravyasya hetuh syadanyadanyasya caiva hi | dravyatvamanyabhavo va dharmanam nopapadyate
    || 53|| evam na cittaja dharmashcittam va'pi na dharmajam | evam hetuphalajatim pravishanti manishinah
    || 54|| yavaddhetuphalaveshastavaddhetuphalodbhavah | kshine hetuphalaveshe nasti hetuphalodbhavah
    || 55|| yavaddhetuphalaveshah samsarastavadayatah | kshine hetuphalaveshe samsaram na prapadyate ||
    56|| samvritya jayate sarvam shashvatam nasti tena vai | sadbhavena hyajam sarvamucchedastena nasti
    vai || 57|| dharma ya iti jayante jayante te na tattvatah | janma mayopamam tesham sa ca maya na vidyate
    || 58|| yatha mayamayadbijajjayate tanmayo'nkurah | nasau nityo na cocchyedi tadvaddharmeshu yojana
    || 59|| najeshu sarvadharmeshu shashvatashashvatabhidha | yatra varna na vartante vivekastatra nocyate
    || 60|| yatha svapne dvayabhasam cittam calati mayaya | tatha jagraddvayabhasam cittam calati mayaya
    || 61|| advayam ca dvayabhasam cittam svapne na samshayah | advayam ca dvayabhasam tatha jagranna
    samshayam || 62|| svapnadrikpracaransvapne dikshu vai dashasu sthitan | andajansvedajanva'pi jivanpashyati
    yansada || 63|| svapnadrikcittadrishyaste na vidyante tatah prithak | tatha taddrishyamevedam svapnadrikcittamishyate
    || 64|| caranjagarite jagraddikshu vai dashasu sthitan | andajansvedajanva'pi jivanpashyati yansada
    || 65|| jagraccitekshaniyaste na vidyante tatah prithak | tatha taddrishyamevedam jagratashcittamishyate
    || 66|| ubhe hyanyonyadrishye te kim tadastiti nocyate | lakshanashunyamubhayam tanmatenaiva grihyate
    || 67|| yatha svapnamayo jivo jayate mriyate'pi ca | tatha jiva ami sarve bhavanti na bhavanti ca
    || 68|| yatha mayamayo jivo jayate mriyate'pi ca | tatha jiva ami sarve bhavanti na bhavanti ca ||
    69|| yatha nirmitako jivo jayate mriyate'pi va | tatha jiva ami sarve bhavanti na bhavanti ca || 70||
    na kashcijjayate jivah sambhavo'sya na vidyate | etattaduttamam satyam yatra kincinna jayate || 71||
    cittaspanditamevedam grahyagrahakavaddvayam | cittam nirvishayam nityamasangam tena kirtitam || 72||
    yo'sti kalpitasamvritya paramarthena nastyasau | paratantrabhisamvritya syannasti paramarthatah ||
    73|| ajah kalpitasamvritya paramarthena napyajah | paratantrabhinishpattya samvritya jayate tu sah
    || 74|| abhutabhinivesho'sti dvayam tatra na vidyate | dvayabhavam sa buddhvaiva nirnimitto na jayate
    || 75|| yada na labhate hetunuttamadhamamadhyaman | tada na jayate cittam hetvabhave phalam kutah
    || 76|| animittasya cittasya ya'nutpattih sama'dvaya | ajatasyaiva sarvasya cittadrishyam hi tadyatah
    || 77|| budhdva'nimittatam satyam hetum prithaganapnuvan | vitashokam tatha kamamabhayam padamashnute
    || 78|| abhutabhiniveshaddhi sadrishe tatpravartate | vastvabhavam sa buddhvaiva nihsangam vinivartate
    || 79|| nivrittasyapravrittasya nishcala hi tada sthitih | vishayah sa hi buddhanam tatsamyamajamadvayam
    || 80|| ajamanidramasvapnam prabhatam bhavati svayam | sakridvibhato hyevaisha dharmo dhatusvabhavatah
    || 81|| sukhamavriyate nityam duhkham vivriyate sada | yasya kasya ca dharmasya grahena bhagavanasau
    || 82|| asti nastyasti nastiti nasti nastiti va punah | calasthirobhayabhavairavrinotyeva balishah
    || 83|| kotyashcatasra etastu grahairyasam sada''vritah | bhagavanabhirasprishto yena drishtah sa
    sarvadrik || 84|| prapya sarvajnatam kritsnam brahmanyam padamadvayam | anapannadimadhyantam kimatah
    paramihate || 85|| vipranam vinayo hyesha shamah prakrita ucyate | damah prakritidantatvadevam vidvanshamam
    vrajet || 86|| savastu sopalambham ca dvayam laukikamishyate | avastu sopalambham ca shuddham laukikamishyate
    || 87|| avastvanupalambham ca lokottaramiti smritam | jnanam jneyam ca vijneyam sada buddhaih prakirtitam
    || 88|| jnane ca trividhe jneye kramena vidite svayam | sarvajnata hi sarvatra bhavatiha mahadhiyah
    || 89|| heyajneyapyapakyani vijneyanyagrayanatah | teshamanyatra vijneyadupalambhastrishu smritah
    || 90|| prakritya''kashavajjneyah sarve dharma anadayah | vidyate na hi nanatvam tesham kvacana kincana
    || 91|| adibuddhah prakrityaiva sarve dharmah sunishcitah | yasyaivam bhavati kshantih so'mritatvaya
    kalpate || 92|| adishanta hyanutpannah prakrityaiva sunirvritah | sarve dharmah samabhinna ajam samyam
    visharadam || 93|| vaisharadyam tu vai nasti bhede vicaratam sada | bhedanimnah prithagvadastasmatte
    kripanah smritah || 94|| aje samye tu ye kecidbhavishyanti sunishcitah | te hi loke mahajnanastacca
    loko na gahate || 95|| ajeshvajamasankrantam dharmeshu jnanamishyate | yato na kramate jnanamasangam
    tena kirtitam || 96|| anumatre'pi vaidharme jayamane'vipashcitah | asangata sada nasti kimuta''varanacyutih
    || 97|| alabdhavaranah sarve dharmah prakritinirmalah | adau buddhastatha mukta budhyanta iti nayakah
    || 98|| kramate na hi buddhasya jnanam dharmeshu tayinah | sarve dharmastatha jnanam naitadbuddhena
    bhashitam || 99|| durdarshamatigambhiramajam samyam visharadam | buddhva padamananatvam namaskurmo
    yathabalam || 100|| iti gaudapadacaryakrita mandukyopanishatkarikah sampurnah || om tatsat ||
  devanagari: ल्लोकविदः प्राहुराश्रमा इति तद्विदः । स्त्रीपुंनपुंसकं लैङ्गाः परापरमथापरे ॥ २७॥ सृष्टिरिति
    सृष्टिविदो लय इति च तद्विदः । स्थितिरिति स्थितिविदः सर्वे चेह तु सर्वदा ॥ २८॥ यं भावं दर्शयेद्यस्य
    तं भावं स तु पश्यति । तं चावति स भूत्वाऽसौ तद्ग्रहः समुपैति तम् ॥ २९॥ एतैरेषोऽपृथग्भावैः पृथगेवेति
    लक्षितः । एवं यो वेद तत्त्वेन कल्पयेत्सोऽविशङ्कितः ॥ ३०॥ स्वप्नमाये यथा दृष्टे गन्धर्वनगरं यथा । तथा
    विश्वमिदं दृष्टं वेदान्तेषु विचक्षणैः ॥ ३१॥ न निरोधो न चोत्पत्तिर्न बद्धो न च साधकः । न मुमुक्षुर्न
    वै मुक्त इत्येषा परमार्थता ॥ ३२॥ भावैरसद्भिरेवायमद्वयेन च कल्पितः । भावा अप्यद्वयेनैव तस्मादद्वयता
    शिवा ॥ ३३॥ नाऽऽत्मभावेन नानेदं न स्वेनापि कथञ्चन । न पृथङ्नापृथक्किञ्चिदिति तत्त्वविदो विदुः ॥ ३४॥
    वीतरागभयक्रोधैर्मुनिभिर्वेदपारगैः । निर्विकल्पो ह्ययं दृष्टः प्रपञ्चोपशमोऽद्वयः ॥ ३५॥ तस्मादेवं विदित्वैनमद्वैते
    योजयेत्स्मृतिम् । अद्वैतं समनुप्राप्य जडवल्लोकमाचरेत् ॥ ३६॥ निस्तुतिर्निर्नमस्कारो निःस्वधाकार एव
    च । चलाचलनिकेतश्च यतिर्यादृच्छिको भवेत् ॥ ३७॥ तत्त्वमाध्यात्मिकं दृष्ट्वा तत्त्वं दृष्ट्वा तु बाह्यतः
    । तत्त्वीभूतस्तदारामस्तत्त्वादप्रच्युतो भवेत् ॥ ३८॥ इति गौडपादीयकारिकासु वैतथ्याख्यं द्वितीयं प्रकरणम्
    ॥ २॥ ॐ ॥ उपासानाश्रितो धर्मो जाते ब्रह्मणि वर्तते । प्रागुत्पत्तेरजं सर्वं तेनासौ कृपणः स्मृतः ॥ १॥
    अतो वक्ष्याम्यकार्पण्यमजाति समतां गतम् । यथा न जायते किञ्चिज्जायमानं समन्ततः ॥ २॥ आत्मा ह्याकाशवज्जीवैर्घटाकाशैरिवोदितः
    । घटादिवच्च सङ्घातैर्जातावेतन्निदर्शनम् ॥ ३॥ घटादिषु प्रलीनेषु घटाकाशादयो यथा । आकाशे सम्प्रलीयन्ते
    तद्वज्जीवा इहाऽऽत्मनि ॥ ४॥ यथैकस्मिन्घटाकाशे रजोधूमादिभिर्युते । न सर्वे सम्प्रयुज्यन्ते तद्वज्जीवाः
    सुखादिभिः ॥ ५॥ रूपकार्यसमाख्याश्च भिद्यन्ते तत्र तत्र वै । आकाशस्य न भेदोऽस्ति तद्वज्जीवेषु निर्णयः
    ॥ ६॥ नाऽऽकाशस्य घटाकाशो विकारावयवौ यथा । नैवाऽऽत्मनः सदा जीवो विकारावयवौ तथा ॥ ७॥ यथा भवति बालानां
    गगनं मलिनं मलैः । तथा भवत्यबुद्धानामात्माऽपि मलिनो मलैः ॥ ८॥ मरणे सम्भवे चैव गत्यागमनयोरपि । स्थितौ
    सर्वशरीरेषु आकाशेनाविलक्षणः ॥ ९॥ सङ्घाताः स्वप्नवत्सर्वे आत्ममायाविसर्जिताः । आधिक्ये सर्वसाम्ये वा
    नोपपत्तिर्हि विद्यते ॥ १०॥ रसादयो हि ये कोशा व्याख्यातास्तैत्तिरीयके । तेषामात्मा परो जीवः खं यथा
    सम्प्रकाशितः ॥ ११॥ द्वयोर्द्वयोर्मधुज्ञाने परं ब्रह्म प्रकाशितम् । पृथिव्यामुदरे चैव यथाऽऽकाशः प्रकाशितः
    ॥ १२॥ जीवात्मनोरनन्यत्वमभेदेन प्रशस्यते । नानात्वं निन्द्यते यच्च तदेवं हि समञ्जसम् ॥ १३॥ जीवात्मनोः
    पृथक्त्वं यत्प्रागुत्पत्तेः प्रकीर्तितम् । भविष्यद्वृत्त्या गौणं तन्मुख्यत्वं हि न युज्यते ॥ १४॥ मृल्लोहविस्फुलिङ्गाद्यै
    सृष्टिर्या चोदिताऽन्यथा । उपायः सोऽवताराय नास्ति भेदः कथञ्चन ॥ १५॥ आश्रमास्त्रिविधा हीनमध्यमोत्कृष्टदृष्टयः
    । उपासनोपदिष्टेयं तदर्थमनुकम्पया ॥ १६॥ स्वसिद्धान्तव्यवस्थासु द्वैतिनो निश्चिता दृढम् । परस्परं विरुध्यन्ते
    तैरयं न विरुध्यते ॥ १७॥ अद्वैतं परमार्थो हि द्वैतं तद्भेद उच्यते । तेषामुभयथा द्वैतं तेनायं न विरुध्यते
    ॥ १८॥ मायया भिद्यते ह्येतन्नान्यथाऽजं कथञ्चन । तत्त्वतो भिद्यमाने हि मर्त्यताममृतं व्रजेत् ॥ १९॥ अजातस्यैव
    भावस्य जातिमिच्छन्ति वादिनः । अजातो ह्यमृतो भावो मर्त्यतां कथमेष्यति ॥ २०॥ न भवत्यमृतं मर्त्यं न मर्त्यममृतं
    तथा । प्रकृतेरन्यथाभावो न कथञ्चिद्भविष्यति ॥ २१॥ स्वभावेनामृतो यस्य भावो गच्छति मर्त्यताम् । कृतकेनामृतस्तस्य
    कथं स्थास्यति निश्चलः ॥ २२॥ भूततोऽभूततो वाऽपि सृज्यमाने समा श्रुतिः । निश्चितं युक्तियुक्तं च यत्तद्भवति
    नेतरत् ॥ २३॥ नेह नानेति चाऽऽम्नायादिन्द्रो मायाभिरित्यपि ॥ अजायमानो बहुधा मायया जायते तु सः ॥ २४॥
    सम्भूतेरपवादाच्च सम्भवः प्रतिषिध्यते । को न्वेनं जनयेदिति कारणं प्रतिषिध्यते ॥ २५॥ स एष नेति नेतीति
    व्याख्यातं निह्नुते यतः । सर्वमग्राह्यभावेन हेतुनाऽजं प्रकाशते ॥ २६॥ सतो हि मायया जन्म युज्यते न तु
    तत्त्वतः । तत्त्वतो जायते यस्य जातं तस्य हि जायते ॥ २७॥ असतो मायया जन्म तत्त्वतो नैव युज्यते । वन्ध्यापुत्रो
    न तत्त्वेन मायया वाऽपि जायते ॥ २८॥ यथा स्वप्ने द्वयाभासं स्पन्दते मायया मनः । तथा जाग्रद्द्वयाभासं
    स्पन्दते मायया मनः ॥ २९॥ अद्वयं च द्वयाभासं मनः स्वप्ने न संशयः । अद्वयं च द्वयाभासं तथा जाग्रन्न
    संशयः ॥ ३०॥ मनोदृश्यमिदं द्वैतं यत्किञ्चित्सचराचरम् । मनसो ह्यमनीभावे द्वैतं नैवोपलभ्यते ॥ ३१॥ आत्मसत्यानुबोधेन
    न सङ्कल्पयते यदा । अमनस्तां तदा याति ग्राह्याभावे तदग्रहम् ॥ ३२॥ अकल्पकमजं ज्ञानं ज्ञेयाभिन्नं प्रचक्षते
    । ब्रह्मज्ञेयमजं नित्यमजेनाजं विबुध्यते ॥ ३३॥ निगृहीतस्य मनसो निर्विकल्पस्य धीमतः । प्रचारः स तु विज्ञेयः
    सुषुप्तेऽन्यो न तत्समः ॥ ३४॥ लीयते हि सुषुप्ते तन्निगृहीतं न लीयते । तदेव निर्भयं ब्रह्म ज्ञानालोकं
    समन्ततः ॥ ३५॥ अजमनिद्रमस्वप्नमनामकमरूपकम् । सकृद्विभातं सर्वज्ञं नोपचारः कथञ्चन ॥ ३६॥ सर्वाभिलापविगतः
    सर्वचिन्तासमुत्थितः । सुप्रशान्तः सकृज्ज्योतिः समाधिरचलोऽभयः ॥ ३७॥ ग्रहो न तत्र नोत्सर्ग्रश्चिन्ता
    यत्र न विद्यते । आत्मसंस्थं तदा ज्ञानमजाति समतां गतम् ॥ ३८॥ अस्पर्शयोगो वै नाम दुर्दर्शः सर्वयोगिभिः
    । योगिनो बिभ्यति ह्यस्मादभये भयदर्शिनः ॥ ३९॥ मनसो निग्रहायत्तमभयं सर्वयोगिनाम् । दुःखक्षयः प्रबोधश्चाप्यक्षया
    शान्तिरेव च ॥ ४०॥ उत्सेक उदधेर्यद्वत्कुशाग्रेणैकबिन्दुना । मनसो निग्रहस्तद्वद्भवेदपरिखेदतः ॥ ४१॥ उपायेन
    निगृह्णीयाद्विक्षिप्तं कामभोगयोः । सुप्रसन्नं लये चैव यथा कामो लयस्तथा ॥ ४२॥ दुःखं सर्वमनुस्मृत्य
    कामभोगान्निवर्तयेत् । अजं सर्वमनुस्मृत्य जातं नैव तु पश्यति ॥ ४३॥ लये सम्बोधयेच्चित्तं विक्षिप्तं
    शमयेत्पुनः । सकषायं विजानीयात्समप्राप्तं न चालयेत् ॥ ४४॥ नाऽऽस्वादयेत्सुखं तत्र निःसङ्गः प्रज्ञया
    भवेत् । निश्चलं निश्चरच्चित्तमेकी कुर्यात्प्रयत्नतः ॥ ४५॥ यदा न लीयते चित्तं न च विक्षिप्यते पुनः
    । अनिङ्गनमनाभासं निष्पन्नं ब्रह्म तत्तदा ॥ ४६॥ स्वस्थं शान्तं सनिर्वाणमकथ्यं सुखमुत्तमम् । अजमजेन
    ज्ञेयेन सर्वज्ञं परिचक्षत ॥ ४७॥ न कश्चिज्जायते जीवः सम्भवोऽस्य न विद्यते । एतत्तदुत्तमं सत्यं यत्र
    किञ्चिन्न जायते ॥ ४८॥ इति गौडपादियकारिकायामद्वैताख्यं तृतीयं प्रकरणम् ॥ ३॥ ॐ तत्सत् ॥ ज्ञानेनाऽऽकाशकल्पेन
    धर्मान्यो गगनोपमान् । ज्ञेयाभिन्नेन सम्बुद्धस्तं वन्दे द्विपदां वरम् ॥ १॥ अस्पर्शयोगो वै नाम सर्वसत्त्वसुखो
    हितः । अविवादोऽविरुद्धश्च देशितस्तं नमाम्यहम् ॥ २॥ भूतस्य जातिमिच्छन्ति वादिनः केचिदेव हि । अभूतस्यापरे
    धीरा विवदन्तः परस्परम् ॥ ३॥ भूतं न जायते किञ्चिदभूतं नैव जायते । विवदन्तो द्वया ह्येवमजातिं ख्यापयन्ति
    ते ॥ ४॥ ख्याप्यमानामजातिं तैरनुमोदामहे वयम् । विवदामो न तैः सार्धमविवादं निबोधत ॥ ५॥ अजातस्यैव धर्मस्य
    जातिमिच्छन्ति वादिनः । अजातो ह्यमृतो धर्मो मर्त्यतां कथमेष्यति ॥ ६॥ न भवत्यमृतं मर्त्यं न मर्त्यममृतं
    तथा । प्रकृतेरन्यथाभावो न कथञ्चिद्भविष्यति ॥ ७॥ स्वभावेनामृतो यस्य धर्मो गच्छति मर्त्यताम् । कृतकेनामृतस्तस्य
    कथं स्थास्यति निश्चलः ॥ ८॥ सांसिद्धिकी स्वाभाविकी सहजा अकृता च या । प्रकृतिः सेति विज्ञेया स्वभावं
    न जहाति या ॥ ९॥ जरामरणनिर्मुक्ताः सर्वे धर्माः स्वभावतः । जरामरणमिच्छन्तश्च्यवन्ते तन्मनीषया ॥ १०॥
    कारणं यस्य वै कार्यं कारणं तस्य जायते । जायमानं कथमजं भिन्नं नित्यं कथं च तत् ॥ ११॥ कारणाद्यद्यनन्यत्वमतः
    कार्यमजं यदि । जायमानाद्धि वै कार्यात्कारणं ते कथं ध्रुवम् ॥ १२॥ अजाद्वै जायते यस्य दृष्टान्तस्तस्य
    नास्ति वै । जाताच्च जायमानस्य न व्यवस्था प्रसज्यते ॥ १३॥ हेतोरादिः फलं येषामादिर्हेतुः फलस्य च । हेतोः
    फलस्य चानादिः कथं तैरूपवर्ण्यते ॥ १४॥ हेतोरादिः फलं येषामादिर्हेतुः फलस्य च । तथा जन्म भवेत्तेषां
    पुत्राज्जन्म पितुर्यथा ॥ १५॥ सम्भवे हेतुफलयोरेषितव्यः क्रमस्त्वया । युगपत्सम्भवे यस्मादसम्बन्धो विषाणवत्
    ॥ १६॥ फलादुत्पद्यमानः सन्न ते हेतुः प्रसिध्यति । अप्रसिद्धः कथं हेतुः फलमुत्पादयिष्यति ॥ १७॥ यदि हेतोः
    फलात्सिद्धिः फलसिद्धिश्च हेतुतः । कतरत्पूर्वनिष्पन्नं यस्य सिद्धिरपेक्षया ॥ १८॥ अशक्तिरपरिज्ञानं क्रमकोपोऽथ
    वा पुनः । एवं हि सर्वथा बुद्धैरजातिः परिदीपिता ॥ १९॥ बीजाङ्कुराख्यो दृष्टान्तः सदा साध्यसमो हि सः
    । न हि साध्यसमो हेतुः सिद्धौ साध्यस्य युज्यते ॥ २०॥ पूर्वापरापरिज्ञानमजातेः परिदीपकम् । जायमानाद्धि
    वै धर्मात्कथं पूर्वं न गृह्यते ॥ २१॥ स्वतो वा परतो वाऽपि न किञ्चिद्वस्तु जायते । सदसत्सदसद्वाऽपि न
    किञ्चिद्वस्तु जायते ॥ २२॥ हेतुर्न जायतेऽनादेः फलं चापि स्वभावतः । आदिर्न विद्यते यस्य तस्य ह्यादिर्न
    विद्यते ॥ २३॥ प्रज्ञप्तेः सनिमित्तत्वमन्यथा द्वयनाशतः । सङ्क्लेशस्योपलब्धेश्च परतन्त्रास्तिता मता
    ॥ २४॥ प्रज्ञप्तेः सनिमित्तत्वमिष्यते युक्तिदर्शनात् । निमित्तस्यानिमित्तत्वमिष्यते भूतदर्शनात् ॥ २५॥
    चित्तं न संस्पृशत्यर्थं नार्थाभासं तथैव च । अभूतो हि यतश्चार्थो नार्थाभासस्ततः पृथक् ॥ २६॥ निमित्तं
    न सदा चित्तं संस्पृशत्यध्वसु त्रिषु । अनिमित्तो विपर्यासः कथं तस्य भविष्यति ॥ २७॥ तस्मान्न जायते चित्तं
    चित्तदृश्यं न जायते । तस्य पश्यन्ति ये जातिं खे वै पश्यन्ति ते पदम् ॥ २८॥ अजातं जायते यस्मादजातिः
    प्रकृतिस्ततः । प्रकृतेरन्यथाभावो न कथञ्चिद्भविष्यति ॥ २९॥ अनादेरन्तवत्त्वं च संसारस्य न सेत्स्यति
    । अनन्तता चाऽऽदिमतो मोक्षस्य न भविष्यति ॥ ३०॥ आदावन्ते च यन्नास्ति वर्तमानेऽपि तत्तथा । वितथैः सदृशाः
    सन्तोऽवितथा इव लक्षिताः ॥ ३१॥ सप्रयोजनता तेषां स्वप्ने विप्रतिपद्यते । तस्मादाद्यन्तवत्त्वेन मिथ्यैव
    खलु ते स्मृताः ॥ ३२॥ सर्वे धर्मा मृषा स्वप्ने कायस्यान्तर्निदर्शनात् । संवृतेऽस्मिन्प्रदेशे वै भूतानां
    दर्शनं कुतः ॥ ३३॥ न युक्तं दर्शनं गत्वा कालस्यानियमाद्गतौ । प्रतिबुद्धश्च वै सर्वस्तस्मिन्देशे न विद्यते
    ॥ ३४॥ मित्राद्यैः सह संमन्त्र्य सम्बुद्धो न प्रपद्यते । गृहीतं चापि यत्किञ्चित्प्रतिबुद्धो न पश्यति
    ॥ ३५॥ स्वप्ने चावस्तुकः कायः पृथगन्यस्य दर्शनात् । यथा कायस्तथा सर्वं चित्तदृश्यमवस्तुकम् ॥ ३६॥ ग्रहणाज्जागरितवत्तद्धेतुः
    स्वप्न इष्यते । तद्धेतुत्वात्तु तस्यैव सज्जागरितमिष्यते ॥ ३७॥ उत्पादस्याप्रसिद्धत्वादजं सर्वमुदाहृतम्
    । न च भूतादभूतस्य सम्भवोऽस्ति कथञ्चन ॥ ३८॥ असज्जागरिते दृष्ट्वा स्वप्ने पश्यति तन्मयः । असत्स्वप्नेऽपि
    दृष्ट्वा च प्रतिबुद्धो न पश्यति ॥ ३९॥ नास्त्यसद्धेतुकमसत्सदसद्धेतुकं तथा । सच्च सद्धेतुकं नास्ति सद्धेतुकमसत्कुतः
    ॥ ४०॥ विपर्यासाद्यथा जाग्रदचिन्त्यान्भूतवत्स्पृशेत् । तथा स्वप्ने विपर्यासात् धर्मांस्तत्रैव पश्यति
    ॥ ४१॥ उपलम्भात्समाचारादस्तिवस्तुत्ववादिनाम् । जातिस्तु देशिता बुद्धैः अजातेस्त्रसतां सदा ॥ ४२॥ अजातेस्त्रसतां
    तेषामुपलम्भाद्वियन्ति ये । जातिदोषा न सेत्स्यन्ति दोषोऽप्यल्पो भविष्यति ॥ ४३॥ उपलम्भात्समाचारान्मायाहस्ती
    यथोच्यते । उपलम्भात्समाचारादस्ति वस्तु तथोच्यते ॥ ४४॥ जात्याभासं चलाभासं वस्त्वाभासं तथैव च । अजाचलमवस्तुत्वं
    विज्ञानं शान्तमद्वयम् ॥ ४५॥ एवं न जायते चित्तमेवंधर्मा अजाः स्मृताः । एवमेव विजानन्तो न पतन्ति विपर्यते
    ॥ ४६॥ ऋजुवक्रादिकाभासमलातस्पन्दितं यथा । ग्रहणग्राहकाभासं विज्ञानस्पन्दितं तथा ॥ ४७॥ अस्पन्दमानमलातमनाभासमजं
    यथा । अस्पन्दमानं विज्ञानमनाभासमजं तथा ॥ ४८॥ अलाते स्पन्दमाने वै नाऽऽभासा अन्यतोभुवः । न ततोऽन्यत्र
    निस्पन्दान्नालातं प्रविशन्ति ते ॥ ४९॥ न निर्गता अलातात्ते द्रव्यत्वाभावयोगतः । विज्ञानेऽपि तथैव स्युराभासस्याविशेशतः
    ॥ ५०॥ विज्ञाने स्पन्दमाने वै नाऽऽभासा अन्यतोभुवः । न ततोऽन्यत्र निस्पन्दान्न विज्ञानं विशन्ति ते ॥
    ५१॥ न निर्गतास्ते विज्ञानाद्द्रव्यत्वाभावयोगतः । कार्यकारणताभावाद्यतोऽचिन्त्याः सदैव ते ॥ ५२॥ द्रव्यं
    द्रव्यस्य हेतुः स्यादन्यदन्यस्य चैव हि । द्रव्यत्वमन्यभावो वा धर्माणां नोपपद्यते ॥ ५३॥ एवं न चित्तजा
    धर्माश्चित्तं वाऽपि न धर्मजम् । एवं हेतुफलाजातिं प्रविशन्ति मनीषिणः ॥ ५४॥ यावद्धेतुफलावेशस्तावद्धेतुफलोद्भवः
    । क्षीणे हेतुफलावेशे नास्ति हेतुफलोद्भवः ॥ ५५॥ यावद्धेतुफलावेशः संसारस्तावदायतः । क्षीणे हेतुफलावेशे
    संसारं न प्रपद्यते ॥ ५६॥ संवृत्या जायते सर्वं शाश्वतं नास्ति तेन वै । सद्भावेन ह्यजं सर्वमुच्छेदस्तेन
    नास्ति वै ॥ ५७॥ धर्मा य इति जायन्ते जायन्ते ते न तत्त्वतः । जन्म मायोपमं तेषां सा च माया न विद्यते
    ॥ ५८॥ यथा मायामयाद्बीजाज्जायते तन्मयोऽङ्कुरः । नासौ नित्यो न चोच्छ्येदी तद्वद्धर्मेषु योजना ॥ ५९॥
    नाजेषु सर्वधर्मेषु शाश्वताशाश्वताभिधा । यत्र वर्णा न वर्तन्ते विवेकस्तत्र नोच्यते ॥ ६०॥ यथा स्वप्ने
    द्वयाभासं चित्तं चलति मायया । तथा जाग्रद्द्वयाभासं चित्तं चलति मायया ॥ ६१॥ अद्वयं च द्वयाभासं चित्तं
    स्वप्ने न संशयः । अद्वयं च द्वयाभासं तथा जाग्रन्न संशयम् ॥ ६२॥ स्वप्नदृक्प्रचरन्स्वप्ने दिक्षु वै
    दशसु स्थितान् । अण्डजान्स्वेदजान्वाऽपि जीवान्पश्यति यान्सदा ॥ ६३॥ स्वप्नदृक्चित्तदृश्यास्ते न विद्यन्ते
    ततः पृथक् । तथा तद्दृश्यमेवेदं स्वप्नदृक्चित्तमिष्यते ॥ ६४॥ चरञ्जागरिते जाग्रद्दिक्षु वै दशसु स्थितान्
    । अण्डजान्स्वेदजान्वाऽपि जीवान्पश्यति यान्सदा ॥ ६५॥ जाग्रच्चितेक्षणीयास्ते न विद्यन्ते ततः पृथक् ।
    तथा तद्दृश्यमेवेदं जाग्रतश्चित्तमिष्यते ॥ ६६॥ उभे ह्यन्योन्यदृश्ये ते किं तदस्तीति नोच्यते । लक्षणाशून्यमुभयं
    तन्मतेनैव गृह्यते ॥ ६७॥ यथा स्वप्नमयो जीवो जायते म्रियतेऽपि च । तथा जीवा अमी सर्वे भवन्ति न भवन्ति
    च ॥ ६८॥ यथा मायामयो जीवो जायते म्रियतेऽपि च । तथा जीवा अमी सर्वे भवन्ति न भवन्ति च ॥ ६९॥ यथा निर्मितको
    जीवो जायते म्रियतेऽपि वा । तथा जीवा अमी सर्वे भवन्ति न भवन्ति च ॥ ७०॥ न कश्चिज्जायते जीवः सम्भवोऽस्य
    न विद्यते । एतत्तदुत्तमं सत्यं यत्र किञ्चिन्न जायते ॥ ७१॥ चित्तस्पन्दितमेवेदं ग्राह्यग्राहकवद्द्वयम्
    । चित्तं निर्विषयं नित्यमसङ्गं तेन कीर्तितम् ॥ ७२॥ योऽस्ति कल्पितसंवृत्या परमार्थेन नास्त्यसौ । परतन्त्राभिसंवृत्या
    स्यान्नास्ति परमार्थतः ॥ ७३॥ अजः कल्पितसंवृत्या परमार्थेन नाप्यजः । परतन्त्राभिनिष्पत्त्या संवृत्या
    जायते तु सः ॥ ७४॥ अभूताभिनिवेशोऽस्ति द्वयं तत्र न विद्यते । द्वयाभावं स बुद्ध्वैव निर्निमित्तो न जायते
    ॥ ७५॥ यदा न लभते हेतूनुत्तमाधममध्यमान् । तदा न जायते चित्तं हेत्वभावे फलं कुतः ॥ ७६॥ अनिमित्तस्य चित्तस्य
    याऽनुत्पत्तिः समाऽद्वया । अजातस्यैव सर्वस्य चित्तदृश्यं हि तद्यतः ॥ ७७॥ बुध्द्वाऽनिमित्ततां सत्यां
    हेतुं पृथगनाप्नुवन् । वीतशोकं तथा काममभयं पदमश्नुते ॥ ७८॥ अभूताभिनिवेशाद्धि सदृशे तत्प्रवर्तते । वस्त्वभावं
    स बुद्ध्वैव निःसङ्गं विनिवर्तते ॥ ७९॥ निवृत्तस्याप्रवृत्तस्य निश्चला हि तदा स्थितिः । विषयः स हि बुद्धानां
    तत्साम्यमजमद्वयम् ॥ ८०॥ अजमनिद्रमस्वप्नं प्रभातं भवति स्वयम् । सकृद्विभातो ह्येवैष धर्मो धातुस्वभावतः
    ॥ ८१॥ सुखमाव्रियते नित्यं दुःखं विव्रियते सदा । यस्य कस्य च धर्मस्य ग्रहेण भगवानसौ ॥ ८२॥ अस्ति नास्त्यस्ति
    नास्तीति नास्ति नास्तीति वा पुनः । चलस्थिरोभयाभावैरावृणोत्येव बालिशः ॥ ८३॥ कोट्यश्चतस्र एतास्तु ग्रहैर्यासां
    सदाऽऽवृतः । भगवानाभिरस्पृष्टो येन दृष्टः स सर्वदृक् ॥ ८४॥ प्राप्य सर्वज्ञतां कृत्स्नां ब्राह्मण्यं
    पदमद्वयम् । अनापन्नादिमध्यान्तं किमतः परमीहते ॥ ८५॥ विप्राणां विनयो ह्येष शमः प्राकृत उच्यते । दमः
    प्रकृतिदान्तत्वादेवं विद्वाञ्शमं व्रजेत् ॥ ८६॥ सवस्तु सोपलम्भं च द्वयं लौकिकमिष्यते । अवस्तु सोपलम्भं
    च शुद्धं लौकिकमिष्यते ॥ ८७॥ अवस्त्वनुपलम्भं च लोकोत्तरमिति स्मृतम् । ज्ञानं ज्ञेयं च विज्ञेयं सदा
    बुद्धैः प्रकीर्तितम् ॥ ८८॥ ज्ञाने च त्रिविधे ज्ञेये क्रमेण विदिते स्वयम् । सर्वज्ञता हि सर्वत्र भवतीह
    महाधियः ॥ ८९॥ हेयज्ञेयाप्यपाक्यानि विज्ञेयान्यग्रयाणतः । तेषामन्यत्र विज्ञेयादुपलम्भस्त्रिषु स्मृतः
    ॥ ९०॥ प्रकृत्याऽऽकाशवज्ज्ञेयाः सर्वे धर्मा अनादयः । विद्यते न हि नानात्वं तेषां क्वचन किञ्चन ॥ ९१॥
    आदिबुद्धाः प्रकृत्यैव सर्वे धर्माः सुनिश्चिताः । यस्यैवं भवति क्षान्तिः सोऽमृतत्वाय कल्पते ॥ ९२॥ आदिशान्ता
    ह्यनुत्पन्नाः प्रकृत्यैव सुनिर्वृताः । सर्वे धर्माः समाभिन्ना अजं साम्यं विशारदम् ॥ ९३॥ वैशारद्यं
    तु वै नास्ति भेदे विचरतां सदा । भेदनिम्नाः पृथग्वादास्तस्मात्ते कृपणाः स्मृताः ॥ ९४॥ अजे साम्ये तु
    ये केचिद्भविष्यन्ति सुनिश्चिताः । ते हि लोके महाज्ञानास्तच्च लोको न गाहते ॥ ९५॥ अजेष्वजमसङ्क्रान्तं
    धर्मेषु ज्ञानमिष्यते । यतो न क्रमते ज्ञानमसङ्गं तेन कीर्तितम् ॥ ९६॥ अणुमात्रेऽपि वैधर्मे जायमानेऽविपश्चितः
    । असङ्गता सदा नास्ति किमुताऽऽवरणच्युतिः ॥ ९७॥ अलब्धावरणाः सर्वे धर्माः प्रकृतिनिर्मलाः । आदौ बुद्धास्तथा
    मुक्ता बुध्यन्त इति नायकाः ॥ ९८॥ क्रमते न हि बुद्धस्य ज्ञानं धर्मेषु तायिनः । सर्वे धर्मास्तथा ज्ञानं
    नैतद्बुद्धेन भाषितम् ॥ ९९॥ दुर्दर्शमतिगम्भीरमजं साम्यं विशारदम् । बुद्ध्वा पदमनानात्वं नमस्कुर्मो
    यथाबलम् ॥ १००॥ इति गौडपादाचर्यकृता माण्डूक्योपनिषत्कारिकाः सम्पूर्णाः ॥ ॐ तत्सत् ॥
