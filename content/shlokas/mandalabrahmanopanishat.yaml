id: mandalabrahmanopanishat
category: upanishad
name:
  english: mandalabrahmanopanishat
  devanagari: मण्डलब्राह्मणोपनिषत्
content:
  english: '|| savishayam mano bandhaya nirvishayam muktaye bhavati ||1|| atah sarvam jagaccittagocaram
    | tadeva cittam nirashrayam manonmanyavasthaparipakvam layayogyam bhavati ||2|| tallayam paripurne
    mayi samabhyaset | manolayakaranamahameva ||3|| anahatasya shabdasya tasya shabdasya yo dhvanih |
    dhvanerantargatam jyotirjyotirantargatam manah ||4|| yanmanastrijagatsrishtisthitivyasanakarmakrit
    | tanmano vilayam yati tadvishnoh paramam padam ||5|| tallayacchuddhadvaitasiddhirbhedabhavat | etadeva
    paramatattvam ||6|| sa tajjno balonmattapishacavajjadavrittya lokamacaret ||7|| evamamanaskabhyasenaivanityatriptiralpamutrapurishamitabhojanadridhangajadyanidradrigvayucalanabhavabrahmadarshanajjnatasukhasvarupasiddhirbhavati
    ||8|| evam cirasamadhijanitabrahmamritapanaparayano''sau samnyasi paramahamsa avadhuto bhavati | taddarshanena
    sakalam jagatpavitram bhavati | tatsevaparo''jno''pi mukto bhavati | tatkulamekottarashatam tarayati
    | tanmatripitrijayapatyavargam ca muktam bhavatityupanishat || om purnamadah purnamidam purnatpurnamudacyate
    | purnasya purnamadaya purnamevavashishyate || om shantih shantih shantih || iti mandalabrahmanopanishatsamapta
    || adhikadhyayanaya'
  devanagari: ॥ सविषयं मनो बन्धाय निर्विषयं मुक्तये भवति ॥१॥ अतः सर्वं जगच्चित्तगोचरम् । तदेव चित्तं निराश्रयं
    मनोन्मन्यवस्थापरिपक्वं लययोग्यं भवति ॥२॥ तल्लयं परिपूर्णे मयि समभ्यसेत् । मनोलयकारणमहमेव ॥३॥ अनाहतस्य
    शब्दस्य तस्य शब्दस्य यो ध्वनिः । ध्वनेरन्तर्गतं ज्योतिर्ज्योतिरन्तर्गतं मनः ॥४॥ यन्मनस्त्रिजगत्सृष्टिस्थितिव्यसनकर्मकृत्
    । तन्मनो विलयं याति तद्विष्णोः परमं पदम् ॥५॥ तल्लयाच्छुद्धाद्वैतसिद्धिर्भेदाभावात् । एतदेव परमतत्त्वम्
    ॥६॥ स तज्ज्ञो बालोन्मत्तपिशाचवज्जडवृत्त्या लोकमाचरेत् ॥७॥ एवममनस्काभ्यासेनैवनित्यतृप्तिरल्पमूत्रपुरीषमितभोजनदृढाङ्गाजाड्यनिद्रादृग्वायुचलनाभावब्रह्मदर्शनाज्ज्ञातसुखस्वरूपसिद्धिर्भवति
    ॥८॥ एवं चिरसमाधिजनितब्रह्मामृतपानपरायणोऽसौ संन्यासी परमहंस अवधूतो भवति । तद्दर्शनेन सकलं जगत्पवित्रं
    भवति । तत्सेवापरोऽज्ञोऽपि मुक्तो भवति । तत्कुलमेकोत्तरशतं तारयति । तन्मातृपितृजायापत्यवर्गं च मुक्तं
    भवतीत्युपनिषत् ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते
    ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ इति मण्डलब्राह्मणोपनिषत्समाप्ता ॥ अधिकाध्ययनाय
