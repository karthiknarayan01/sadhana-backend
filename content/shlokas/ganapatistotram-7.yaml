id: ganapatistotram-7
category: stotram
name:
  english: ganapatistotram 7
  devanagari: गणपतिस्तोत्रम् ७
content:
  english: parimaladishe dattavridam bhajami gajananam || 25|| sarvagarjitamadadvipacchatanirvivadagajarajasampade
    | nirvritipriyatamaya tejase sarvalokasuhride namo namah || 26|| namastrilokitilakankuraya karagravinyastasamastalakshmai
    | karindravaktraya surendramaulimalavalidhaprapadaya dhamne || 27|| sindhurabandhuravadanam simashyamabhiramashishirarucam
    | bandhurabandhujananam bahumukhamabhimukhamaho maho jayati || 28|| dinakarakaraparirambhavijrimbhavilasitam
    shilpavikalpam | samadrishi drishi sutaramabhiramam madagajamukhamadhidaivamudiyam || 29|| tvamekamavalambyaiva
    svarajyam gamita vayam | mamekamavalambyaiva karunyam gamito bhavan || 30|| avikalakripapangakridatarangitadinmukham
    madagajamukhakaram mandetarasphutadaibhavam | bhavatu nibhritasheshashreyashshrayam niyataspadam tribhuvanadrisham
    driptam bhagyadbhutam vijayaya vah || 31|| bhramadbhramaramandalikalakalaravadambara
  devanagari: परिमलदिशे दत्तव्रीडं भजामि गजाननम् ॥ २५॥ सर्वगर्जितमदद्विपच्छटानिर्विवादगजराजसम्पदे । निर्वृतिप्रियतमाय
    तेजसे सर्वलोकसुहृदे नमो नमः ॥ २६॥ नमस्त्रिलोकीतिलकाङ्कुराय कराग्रविन्यस्तसमस्तलक्ष्मै । करीन्द्रवक्त्राय
    सुरेन्द्रमौलिमालावलीढप्रपदाय धाम्ने ॥ २७॥ सिन्धुरबन्धुरवदनं सीमश्यामाभिरामशिशिररुचाम् । बन्धुरबन्धुजनानां
    बहुमुखमभिमुखमहो महो जयति ॥ २८॥ दिनकरकरपरिरम्भाविजृम्भाविलसितं शिल्पविकल्पम् । समदृशि दृशि सुतरामभिरामं
    मदगजमुखमधिदैवमुदीयाम् ॥ २९॥ त्वामेकमवलम्ब्यैव स्वाराज्यं गमिता वयम् । मामेकमवलम्ब्यैव कारुण्यं गमितो
    भवान् ॥ ३०॥ अविकलकृपापाङ्गक्रीडातरङ्गितदिङ्मुखं मदागजमुखाकारं मन्देतरस्फुटदैभवम् । भवतु निभृताशेषश्रेयश्श्रयां
    नियतास्पदं त्रिभुवनदृशां दृप्तं भाग्याद्भुतं विजयाय वः ॥ ३१॥ भ्रमद्भ्रमरमण्डलीकलकलारवाडम्बर
