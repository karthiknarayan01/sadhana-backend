    || 182|| iti shrutva mahadevi tada vismitamanasa | pujayamasa vidhivadganeshvarapadadvayam || 183||
    || iti shrirudrayamale mahaguptasare shivaparvatisamvade gakaradi shriganapatisahasranamastotram sampurnam
    ||
  devanagari: गकारादि श्रीगणपतिसहस्रनामस्तोत्रम् ॐ अस्य श्रीगणपतिगकारादिसहस्रनाममालामन्त्रस्य । दुर्वासा
    ऋषिः । अनुष्टुप् छन्दः । श्रीगणपतिर्देवता । गं बीजम् । स्वाहा शक्तिः । ग्लौं कीलकम् । मम सकलाभीष्टसिद्ध्यर्थे
    जपे विनियोगः ॥ ॥ करन्यासः ॥ ॐ अङ्गुष्ठाभ्यां नमः । श्रीं तर्जनीभ्यां नमः । ह्रीं मध्यमाभ्यां नमः ।
    क्लीं अनामिकाभ्यां नमः । ग्लौं कनिष्ठिकाभ्यां नमः । गं करतलकरपृष्ठाभ्यां नमः । एवं हृदयादिन्यासः ।
    अथवा षड्दीर्ङभाजागमितिबीजेन कराङ्गन्यासः ॥ ॥ ध्यानम् ॥ ओङ्कार सन्निभमिभाननमिन्दुभालम् मुक्ताग्रबिन्दुममलद्युतिमेकदन्तम्
    । लम्बोदरं कलचतुर्भुजमादिदेवं ध्यायेन्महागणपतिं मतिसिद्धिकान्तम् ॥ वन्दे नित्यं गणेशं परगुणयुतं ध्यानसंस्थं
    त्रिनेत्रं एकं देवं त्वनेकं परमसुखयुतं देवदेवं प्रसन्नम् । शुण्डादण्डाढ्यगण्डोद्गलितमदजलोल्लोमत्तालिजालं
    श्रीमन्तं विघ्नराजं सकलसुखकरं श्रीगणेशं नमामि ॥ ॥ अथ स्तोत्रम् ॥ ॐ गणेश्वरो गणाध्यक्षो गणाराध्यो गणप्रियः
    । गणनाथो गणस्वामी गणेशो गणनायकः ॥ १॥ गणमूर्तिर्गणपतिर्गणत्राता गणञ्जयः । गणपोऽथ गणक्रीडो गणदेवो गणाधिपः
    ॥ २॥ गणज्येष्ठो गणश्रेष्ठो गणप्रेष्ठो गणाधिराट् । गणराड् गणगोप्ताथ् गणाङ्गो गणदैवतम् ॥ ३॥ गणबन्धुर्गणसुहृद्
    गणाधीशो गणप्रथः । गणप्रियसखः शश्वद् गणप्रियसुहृत् तथा ॥ ४॥ गणप्रियरतो नित्यं गणप्रीतिविवर्धनः । गणमण्डलमध्यस्थो
    गणकेलिपरायणः ॥ ५॥ गणाग्रणीर्गणेशानो गणगीतो गणोच्छ्रयः । गण्यो गणहितो गर्जद्गणसेनो गणोद्धतः ॥ ६॥ गणभीतिप्रमथनो
    गणभीत्यपहारकः । गणनार्हो गणप्रौढो गणभर्ता गणप्रभुः ॥ ७॥ गणसेनो गणचरो गणप्रज्ञो गणैकराट् । गणाग्र्यो
    गणनामा च गणपालनतत्परः ॥ ८॥ गणजिद्गणगर्भस्थो गणप्रवणमानसः । गणगर्वपरीहर्ता गणो गणनमस्कृतः ॥ ९॥ गणार्चिताङ्घ्रियुगळो
    गणरक्षणकृत् सदा । गणध्यातो गणगुरुर्गणप्रणयतत्परः ॥ १०॥ गणागणपरित्राता गणाधिहरणोद्धुरः । गणसेतुर्गणनुतो
    गणकेतुर्गणाग्रगः ॥ ११॥ गणहेतुर्गणग्राही गणानुग्रहकारकः । गणागणानुग्रहभूर्गणागणवरप्रदः ॥ १२॥ गणस्तुतो
    गणप्राणो गणसर्वस्वदायकः । गणवल्लभमूर्तिश्च गणभूतिर्गणेष्टदः ॥ १३॥ गणसौख्यप्रदाता च गणदुःखप्रणाशनः
    । गणप्रथितनामा च गणाभीष्टकरः सदा ॥ १४॥ गणमान्यो गणख्यातो गणवीतो गणोत्कटः । गणपालो गणवरो गणगौरवदायकः
    ॥ १५॥ गणगर्जितसन्तुष्टो गणस्वच्छन्दगः सदा । गणराजो गणश्रीदो गणाभयकरः क्षणात् ॥ १६॥ गणमूर्धाभिषिक्तश्च
    गणसैन्यपुरस्सरः । गुणातीतो गुणमयो गुणत्रयविभागकृत् ॥ १७॥ गुणी गुणाकृतिधरो गुणशाली गुणप्रियः । गुणपूर्णो
    गुणाम्भोधिर्गुणभाग् गुणदूरगः ॥ १८॥ गुणागुणवपुर्गौणशरीरो गुणमण्डितः । गुणस्त्रष्टा गुणेशानो गुणेशोऽथ
    गुणेश्वरः ॥ १९॥ गुणसृष्टजगत्सङ्घो गुणसङ्घो गुणैकराट् । गुणप्रवृष्टो गुणभूर्गुणीकृतचराचरः ॥ २०॥ गुणप्रवणसन्तुष्टो
    गुणहीनपराङ्मुखः । गुणैकभूर्गुणश्रेष्ठो गुणज्येष्ठो गुणप्रभुः ॥ २१॥ गुणज्ञो गुणसम्पूज्यो गुणैकसदनं
    सदा । गुणप्रणयवान् गौणप्रकृतिर्गुणभाजनम् ॥ २२॥ गुणिप्रणतपादाब्जो गुणिगीतो गुणोज्ज्वलः । गुणवान् गुणसम्पन्नो
    गुणानन्दितमानसः ॥ २३॥ गुणसञ्चारचतुरो गुणसञ्चयसुन्दरः । गुणगौरो गुणाधारो गुणसंवृतचेतनः ॥ २४॥ गुणकृद्गुणभृन्नित्यं
    गुणाग्र्यो गुणपारदृक् । गुणप्रचारी गुणयुग् गुणागुणविवेककृत् ॥ २५॥ गुणाकरो गुणकरो गुणप्रवणवर्धनः ।
    गुणगूढचरो गौणसर्वसंसारचेष्टितः ॥ २६॥ गुणदक्षिणसौहार्दो गुणलक्षणतत्त्ववित् । गुणहारी गुणकलो गुणसङ्घसखः
    सदा ॥ २७॥ गुणसंस्कृतसंसारो गुणतत्त्वविवेचकः । गुणगर्वधरो गौणसुखदुःखोदयो गुणः ॥ २८॥ गुणाधीशो गुणलयो
    गुणवीक्षणलालसः । गुणगौरवदाता च गुणदाता गुणप्रदः ॥ २९॥ गुणकृद्गुणसम्बन्धो गुणभृद्गुणबन्धनः । गुणहृद्यो
    गुणस्थायी गुणदायी गुणोत्कटः ॥ ३०॥ गुणचक्रधरो गौणावतारो गुणबान्धवः । गुणबन्धुर्गुणप्रज्ञो गुणप्राज्ञो
    गुणालयः ॥ ३१॥ गुणधाता गुणप्राणो गुणगोपो गुणाश्रयः । गुणयायी गुणाधायी गुणपो गुणपालकः ॥ ३२॥ गुणाहृततनुर्गौणो
    गीर्वाणो गुणगौरवः । गुणवत्पूजितपदो गुणवत्प्रीतिदायकः ॥ ३३॥ गुणवद्गीतकीर्तिष्च गुणवद्बद्धसौहृदः । गुणवद्वरदो
    नित्यं गुणवत्प्रतिपालकः ॥ ३४॥ गुणवद्गुणसन्तुष्टो गुणवद्रचितस्तवः । गुणवद्रक्षणपरो गुणवत्प्रणयप्रियः
    ॥ ३५॥ गुणवच्चक्रसञ्चारो गुणवत्कीर्तिवर्धनः । गुणवद्गुणचित्तस्थो गुणवद्गुणरक्षकः ॥ ३६॥ गुणवत्पोषणकरो
    गुनवच्छत्रुसूदनः । गुणवत्सिद्धिदाता च गुणवद्गौरवप्रदः ॥ ३७॥ गुणवत्प्रवणस्वान्तो गुणवद्गुणभूषणः । गुणवत्कुलविद्वेषिविनाषकरणक्षमः
    ॥ ३८॥ गुणिस्तुतगुणो गर्जप्रलयाम्बुदनिःस्वनः । गजो गजपतिर्गर्जद्गजयुद्धविषारदः ॥ ३९॥ गजास्यो गजकर्णोऽथ
    गजराजो गजाननः । गजरूपधरो गर्जद्गजयूथोद्धुरध्वनिः ॥ ४०॥ गजाधीषो गजाधारो गजासुरजयोद्धुरः । गजदन्तो गजवरो
    गजकुम्भो गजध्वनिः ॥ ४१॥ गजमायो गजमयो गजश्रीर्गजगर्जितः । गजामयहरो नित्यं गजपुष्टिप्रदायकः ॥ ४२॥ गजोत्पत्तिर्गजत्राता
    गजहेतुर्गजाधिपः । गजमुख्यो गजकुलप्रवरो गजदैत्यहा ॥ ४३॥ गजकेतुर्गजाध्यक्षो गजसेतुर्गजाकृतिः । गजवन्द्यो
    गजप्राणो गजसेव्यो गजप्रभुः ॥ ४४॥ गजमत्तो गजेशानो गजेशो गजपुङ्गवः । गजदन्तधरो गुञ्जन्मधुपो गजवेषभृत्
    ॥ ४५॥ गजच्छन्नो गजाग्रस्थो गजयायी गजाजयः । गजराड्गजयूथस्थो गजगञ्जकभञ्जकः ॥ ४६॥ गर्जितोज्ञितदैत्यासुर्गर्जितत्रातविष्टपः
    । गानज्ञो गानकुशलो गानतत्त्वविवेचकः ॥ ४७॥ गानश्लाघी गानरसो गानज्ञानपरायणः । गानागमज्ञो गानाङ्गो गानप्रवणचेतनः
    ॥ ४८॥ गानकृद्गानचतुरो गानविद्याविशारदः । गानध्येयो गानगम्यो गानध्यानपरायणः ॥ ४९॥ गानभूर्गानशीलश्च
    गानशाली गतश्रमः । गानविज्ञानसम्पन्नो गानश्रवणलालसः ॥ ५०॥ गानयत्तो गानमयो गानप्रणयवान् सदा । गानध्याता
    गानबुद्धिर्गानोत्सुकमनाः पुनः ॥ ५१॥ गानोत्सुको गानभूमिर्गानसीमा गुणोज्ज्वलः । गानङ्गज्ञानवान् गानमानवान्
    गानपेशलः ॥ ५२॥ गानवत्प्रणयो गानसमुद्रो गानभूषणः । गानसिन्धुर्गानपरो गानप्राणो गणाश्रयः ॥ ५३॥ गानैकभूर्गानहृष्टो
    गानचक्षुर्गाणैकदृक् । गानमत्तो गानरुचिर्गानविद्गानवित्प्रियः ॥ ५४॥ गानान्तरात्मा गानाढ्यो गानभ्राजत्सभः
    सदा । गानमयो गानधरो गानविद्याविशोधकः ॥ ५५॥ गानाहितघ्रो गानेन्द्रो गानलीनो गतिप्रियः । गानाधीशो गानलयो
    गानाधारो गतीश्वरः ॥ ५६॥ गानवन्मानदो गानभूतिर्गानैकभूतिमान् । गानतानततो गानतानदानविमोहितः ॥ ५७॥ गुरुर्गुरुदरश्रोणिर्गुरुतत्त्वार्थदर्शनः
    । गुरुस्तुतो गुरुगुणो गुरुमायो गुरुप्रियः ॥ ५८॥ गुरुकीर्तिर्गुरुभुजो गुरुवक्षा गुरुप्रभः । गुरुलक्षणसम्पन्नो
    गुरुद्रोहपराङ्मुखः ॥ ५९॥ गुरुविद्यो गुरुप्राणो गुरुबाहुबलोच्छ्रयः । गुरुदैत्यप्राणहरो गुरुदैत्यापहारकः
    ॥ ६०॥ गुरुगर्वहरो गुह्यप्रवरो गुरुदर्पहा । गुरुगौरवदायी च गुरुभीत्यपहारकः ॥ ६१॥ गुरुशुण्डो गुरुस्कन्धो
    गुरुजङ्घो गुरुप्रथः । गुरुभालो गुरुगलो गुरुश्रीर्गुरुगर्वनुत् ॥ ६२॥ गुरूरुगुरुपीनांसो गुरुप्रणयलालसः
    । गुरुमुख्यो गुरुकुलस्थायी गुरुगुणः सदा ॥ ६३॥ गुरुसंशयभेत्ता च गुरुमानप्रदायकः । गुरुधर्मसदाराध्यो
    गुरुधर्मनिकेतनः ॥ ६४॥ गुरुदैत्यकुलच्छेत्ता गुरुसैन्यो गुरुद्युतिः । गुरुधर्माग्रगण्योऽथ गुरुधर्मधुरन्धरः
    । गरिष्ठो गुरुसन्तापशमनो गुरुपूजितः ॥ ६५॥ गुरुधर्मधरो गौरधर्माधारो गदापहः । गुरुशास्त्रविचारज्ञो गुरुशास्त्रकृतोद्यमः
    ॥ ६६॥ गुरुशास्त्रार्थनिलयो गुरुशास्त्रालयः सदा । गुरुमन्त्रो गुरुशेष्ठो गुरुमन्त्रफलप्रदः ॥ ६७॥ गुरुस्त्रीगमनोद्दामप्रायश्चित्तनिवारकः
    । गुरुसंसारसुखदो गुरुसंसारदुःखभित् ॥ ६८॥ गुरुश्लाघापरो गौरभानुखण्डावतंसभृत् । गुरुप्रसन्नमूर्तिश्च
    गुरुशापविमोचकः ॥ ६९॥ गुरुकान्तिर्गुरुमयो गुरुशासनपालकः । गुरुतन्त्रो गुरुप्रज्ञो गुरुभो गुरुदैवतम्
    ॥ ७०॥ गुरुविक्रमसञ्चारो गुरुदृग्गुरुविक्रमः । गुरुक्रमो गुरुप्रेष्ठो गुरुपाखण्डखण्डकः ॥ ७१॥ गुरुगर्जितसम्पूर्णब्रह्माण्डो
    गुरुगर्जितः । गुरुपुत्रप्रियसखो गुरुपुत्रभयापहः ॥ ७२॥ गुरुपुत्रपरित्राता गुरुपुत्रवरप्रदः । गुरुपुत्रार्तिशमनो
    गुरुपुत्राधिनाशनः ॥ ७३॥ गुरुपुत्रप्राणदाता गुरुभक्तिपरायणः । गुरुविज्ञानविभवो गौरभानुवरप्रदः ॥ ७४॥
    गौरभानुस्तुतो गौरभानुत्रासापहारकः । गौरभानुप्रियो गौरभानुर्गौरववर्धनः ॥ ७५॥ गौरभानुपरित्राता गौरभानुसखः
    सदा । गौरभानुर्प्रभुर्गौरभानुभीतिप्रणशनः ॥ ७६॥ गौरीतेजःसमुत्पन्नो गौरीहृदयनन्दनः । गौरीस्तनन्धयो गौरीमनोवाञ्छितसिद्धिकृत्
    ॥ ७७॥ गौरो गौरगुणो गौरप्रकाशो गौरभैरवः । गौरीशनन्दनो गौरीप्रियपुत्रो गदाधरः ॥ ७८॥ गौरीवरप्रदो गौरीप्रणयो
    गौरसच्छविः । गौरीगणेश्वरो गौरीप्रवणो गौरभावनः ॥ ७९॥ गौरात्मा गौरकीर्तिश्च गौरभावो गरिष्ठदृक् । गौतमो
    गौतमीनाथो गौतमीप्राणवल्लभः ॥ ८०॥ गौतमाभीष्टवरदो गौतमाभयदायकः । गौतमप्रणयप्रह्वो गौतमाश्रमदुःखहा ॥
    ८१॥ गौतमीतीरसञ्चारी गौतमीतीर्थनायकः । गौतमापत्परिहारो गौतमाधिविनाशनः ॥ ८२॥ गोपतिर्गोधनो गोपो गोपालप्रियदर्शनः
    । गोपालो गोगणाधीशो गोकश्मलनिवर्तकः ॥ ८३॥ गोसहस्रो गोपवरो गोपगोपीसुखावहः । गोवर्धनो गोपगोपो गोपो गोकुलवर्धनः
    ॥ ८४॥ गोचरो गोचराध्यक्षो गोचरप्रीतिवृद्धिकृत् । गोमी गोकष्टसन्त्राता गोसन्तापनिवर्तकः ॥ ८५॥ गोष्ठो
    गोष्ठाश्रयो गोष्ठपतिर्गोधनवर्धनः । गोष्ठप्रियो गोष्ठमयो गोष्ठामयनिवर्तकः ॥ ८६॥ गोलोको गोलको गोभृद्गोभर्ता
    गोसुखावहः । गोधुग्गोधुग्गणप्रेष्ठो गोदोग्धा गोमयप्रियः ॥ ८७॥ गोत्रं गोत्रपतिर्गोत्रप्रभुर्गोत्रभयापहः
    । गोत्रवृद्धिकरो गोत्रप्रियो गोत्रार्तिनाशनः ॥ ८८॥ गोत्रोद्धारपरो गोत्रप्रवरो गोत्रदैवतम् । गोत्रविख्यातनामा
    च गोत्री गोत्रप्रपालकः ॥ ८९॥ गोत्रसेतुर्गोत्रकेतुर्गोत्रहेतुर्गतक्लमः । गोत्रत्राणकरो गोत्रपतिर्गोत्रेशपूजितः
    ॥ ९०॥ गोत्रभिद्गोत्रभित्त्राता गोत्रभिद्वरदायकः । गोत्रभित्पूजितपदो गोत्रभिच्छत्रुसूदनः ॥ ९१॥ गोत्रभित्प्रीतिदो
    नित्यं गोत्रभिद्गोत्रपालकः । गोत्रभिद्गीतचरितो गोत्रभिद्राज्यरक्षकः ॥ ९२॥ गोत्रभिज्जयदायी च गोत्रभित्प्रणयः
    सदा । गोत्रभिद्भयसम्भेत्ता गोत्रभिन्मानदायकः ॥ ९३॥ गोत्रभिद्गोपनपरो गोत्रभित्सैन्यनायकः । गोत्राधिपप्रियो
    गोत्रपुत्रीपुत्रो गिरिप्रियः ॥ ९४॥ ग्रन्थज्ञो ग्रन्थकृद्ग्रन्थग्रन्थिभिद्ग्रन्थविघ्नहा । ग्रन्थादिर्ग्रन्थसञ्चारो
    ग्रन्थश्रवणलोलुपः ॥ ९५॥ ग्रन्थादीनक्रियो ग्रन्थप्रियो ग्रन्थार्थतत्त्ववित् । ग्रन्थसंशयसञ्छेदी ग्रन्थवक्ता
    ग्रहाग्रणीः ॥ ९६॥ ग्रन्थगीतगुणो ग्रन्थगीतो ग्रन्थादिपूजितः । ग्रन्थारम्भस्तुतो ग्रन्थग्राही ग्रन्थार्थपारदृक्
    ॥ ९७॥ ग्रन्थदृग्ग्रन्थविज्ञानो ग्रन्थसन्दर्भषोधकः । ग्रन्थकृत्पूजितो ग्रन्थकरो ग्रन्थपरायणः ॥ ९८॥
    ग्रन्थपारायणपरो ग्रन्थसन्देहभञ्जकः । ग्रन्थकृद्वरदाता च ग्रन्थकृद्वन्दितः सदा ॥ ९९॥ ग्रन्थानुरक्तो
    ग्रन्थज्ञो ग्रन्थानुग्रहदायकः । ग्रन्थान्तरात्मा ग्रन्थार्थपण्डितो ग्रन्थसौहृदः ॥ १००॥ ग्रन्थपारङ्गमो
    ग्रन्थगुणविद्ग्रन्थविग्रहः । ग्रन्थसेतुर्ग्रन्थहेतुर्ग्रन्थकेतुर्ग्रहाग्रगः ॥ १०१॥ ग्रन्थपूज्यो ग्रन्थगेयो
    ग्रन्थग्रथनलालसः । ग्रन्थभूमिर्ग्रहश्रेष्ठो ग्रहकेतुर्ग्रहाश्रयः ॥ १०२॥ ग्रन्थकारो ग्रन्थकारमान्यो
    ग्रन्थप्रसारकः । ग्रन्थश्रमज्ञो ग्रन्थाङ्गो ग्रन्थभ्रमनिवारकः ॥ १०३॥ ग्रन्थप्रवणसर्वाङ्गो ग्रन्थप्रणयतत्परः
    । गीतं गीतगुणो गीतकीर्तिर्गीतविशारदः ॥ १०४॥ गीतस्फीतयशा गीतप्रणयो गीतचञ्चुरः । गीतप्रसन्नो गीतात्मा
    गीतलोलो गतस्पृहः ॥ १०५॥ गीताश्रयो गीतमयो गीततत्त्वार्थकोविदः । गीतसंशयसञ्छेत्ता गीतसङ्गीतशाशनः ॥ १०६॥
    गीतार्थज्ञो गीततत्त्वो गीतातत्त्वं गताश्रयः । गीतासारोऽथ गीताकृद्गीताकृद्विघ्ननाशनः ॥ १०७॥ गीताशक्तो
    गीतलीनो गीताविगतसञ्ज्वरः । गीतैकदृग्गीतभूतिर्गीतप्रीतो गतालसः ॥ १०८॥ गीतवाद्यपटुर्गीतप्रभुर्गीतार्थतत्त्ववित्
    । गीतागीतविवेकज्ञो गीताप्रवणचेतनः ॥ १०९॥ गतभीर्गतविद्वेषो गतसंसारबन्धनः । गतमायो गतत्रासो गतदुःखो
    गतज्वरः ॥ ११०॥ गतासुहृद्गतज्ञानो गतदुष्टाशयो गतः । गतार्तिर्गतसङ्कल्पो गतदुष्टविचेष्टितः ॥ १११॥ गताहङ्कारसञ्चारो
    गतदर्पो गताहितः । गतविघ्नो गतभयो गतागतनिवारकः ॥ ११२॥ गतव्यथो गतापायो गतदोषो गतेः परः । गतसर्वविकारोऽथ
    गतगञ्जितकुञ्जरः ॥ ११३॥ गतकम्पितभूपृष्ठो गतरुग्गतकल्मषः । गतदैन्यो गतस्तैन्यो गतमानो गतश्रमः ॥ ११४॥
    गतक्रोधो गतग्लानिर्गतम्लानो गतभ्रमः । गताभावो गतभवो गततत्त्वार्थसंशयः ॥ ११५॥ गयासुरशिरश्छेत्ता गयासुरवरप्रदः
    । गयावासो गयानाथो गयावासिनमस्कृतः ॥ ११६॥ गयातीर्थफलाध्यक्षो गयायात्राफलप्रदः । गयामयो गयाक्षेत्रं
    गयाक्षेत्रनिवासकृत् ॥ ११७॥ गयावासिस्तुतो गयान्मधुव्रतलसत्कटः । गायको गायकवरो गायकेष्टफलप्रदः ॥ ११८॥
    गायकप्रणयी गाता गायकाभयदायकः । गायकप्रवणस्वान्तो गायकः प्रथमः सदा ॥ ११९॥ गायकोद्गीतसम्प्रीतो गायकोत्कटविघ्नहा
    । गानगेयो गानकेशो गायकान्तरसञ्चरः ॥ १२०॥ गायकप्रियदः शश्वद्गायकाधीनविग्रहः । गेयो गेयगुणो गेयचरितो
    गेयतत्त्ववित् ॥ १२१॥ गायकत्रासहा ग्रन्थो ग्रन्थतत्त्वविवेचकः । गाढानुरागो गाढाङ्गो गाढागङ्गाजलोऽन्वहम्
    ॥ १२२॥ गाढावगाढजलधिर्गाढप्रज्ञो गतामयः । गाढप्रत्यर्थिसैन्योऽथ गाढानुग्रहतत्परः ॥ १२३॥ गाढश्लेषरसाभिज्ञो
    गाढनिर्वृतिसाधकः । गङ्गाधरेष्टवरदो गङ्गाधरभयापहः ॥ १२४॥ गङ्गाधरगुरुर्गङ्गाधरध्यातपदः सदा । गङ्गाधरस्तुतो
    गङ्गाधराराध्यो गतस्मयः ॥ १२५॥ गङ्गाधरप्रियो गङ्गाधरो गङ्गाम्बुसुन्दरः । गङ्गाजलरसास्वादचतुरो गाङ्गतीरयः
    ॥ १२६॥ गङ्गाजलप्रणयवान् गङ्गातीरविहारकृत् । गङ्गाप्रियो गङ्गाजलावगाहनपरः सदा ॥ १२७॥ गन्धमादनसंवासो
    गन्धमादनकेलिकृत् । गन्धानुलिप्तसर्वाङ्गो गन्धलुब्धमधुव्रतः ॥ १२८॥ गन्धो गन्धर्वराजोऽथ गन्धर्वप्रियकृत्
    सदा । गन्धर्वविद्यातत्त्वज्ञो गन्धर्वप्रीतिवर्धनः ॥ १२९॥ गकारबीजनिलयो गकारो गर्विगर्वनुत् । गन्धर्वगणसंसेव्यो
    गन्धर्ववरदायकः ॥ १३०॥ गन्धर्वो गन्धमातङ्गो गन्धर्वकुलदैवतम् । गन्धर्वगर्वसञ्छेत्ता गन्धर्ववरदर्पहा
    ॥ १३१॥ गन्धर्वप्रवणस्वान्तो गन्धर्वगणसंस्तुतः । गन्धर्वार्चितपादाब्जो गन्धर्वभयहारकः ॥ १३२॥ गन्धर्वाभयदः
    शश्वद् गन्धर्वप्रतिपालकः । गन्धर्वगीतचरितो गन्धर्वप्रणयोत्सुकः ॥ १३३॥ गन्धर्वगानश्रवणप्रणयी गर्वभञ्जनः
    । गन्धर्वत्राणसन्नद्धो गन्धर्वसमरक्षमः ॥ १३४॥ गन्धर्वस्त्रीभिराराध्यो गानं गानपटुः सदा । गच्छो गच्छपतिर्गच्छनायको
    गच्छगर्वहा ॥ १३५॥ गच्छराजोऽथ गच्छेशो गच्छराजनमस्कृतः । गच्छप्रियो गच्छगुरुर्गच्छत्राणकृतोद्यमः ॥ १३६॥
    गच्छप्रभुर्गच्छचरो गच्छप्रियकृतोद्यमः । गच्छगीतगुणो गच्छमर्यादाप्रतिपालकः ॥ १३७॥ गच्छधाता गच्छभर्ता
    गच्छवन्द्यो गुरोर्गुरुः । गृत्सो गृत्समदो गृत्समदाभीष्टवरप्रदः ॥ १३८॥ गीर्वाणगीतचरितो गीर्वाणगणसेवितः
    । गीर्वाणवरदाता च गीर्वाणभयनाशकृत् ॥ १३९॥ गीर्वाणगुणसंवीतो गीर्वाणारातिसूदनः । गीर्वाणधाम गीर्वाणगोप्ता
    गीर्वाणगर्वहृत् ॥ १४०॥ गीर्वाणार्तिहरो नित्यं गीर्वाणवरदायकः । गीर्वाणशरणं गीतनामा गीर्वाणसुन्दरः
    ॥ १४१॥ गीर्वाणप्राणदो गन्ता गीर्वाणानीकरक्षकः । गुहेहापूरको गन्धमत्तो गीर्वाणपुष्टिदः ॥ १४२॥ गीर्वाणप्रयुतत्राता
    गीतगोत्रो गताहितः । गीर्वाणसेवितपदो गीर्वाणप्रथितो गलत् ॥ १४३॥ गीर्वाणगोत्रप्रवरो गीर्वाणफलदायकः ।
    गीर्वाणप्रियकर्ता च गीर्वाणागमसारवित् ॥ १४४॥ गीर्वाणागमसम्पत्तिर्गीर्वाणव्यसनापहह् । गीर्वाणप्रणयो
    गीतग्रहणोत्सुकमानसः ॥ १४५॥ गीर्वाणभ्रमसम्भेत्ता गीर्वाणगुरुपूजितः । ग्रहो ग्रहपतिर्ग्राहो ग्रहपीडाप्रणाशनः
    ॥ १४६॥ ग्रहस्तुतो ग्रहाध्यक्षो ग्रहेशो ग्रहदैवतम् । ग्रहकृद्ग्रहभर्ता च ग्रहेशानो ग्रहेश्वरः ॥ १४७॥
    ग्रहाराध्यो ग्रहत्राता ग्रहगोप्ता ग्रहोत्कटः । ग्रहगीतगुणो ग्रन्थप्रणेता ग्रहवन्दितः ॥ १४८॥ गवी गवीश्वरो
    गर्वी गर्विष्ठो गर्विगर्वहा । गवाम्प्रियो गवान्नाथो गवीशानो गवाम्पती ॥ १४९॥ गव्यप्रियो गवाङ्गोप्ता
    गविसम्पत्तिसाधकः । गविरक्षणसन्नद्धो गवाम्भयहरः क्षणात् ॥ १५०॥ गविगर्वहरो गोदो गोप्रदो गोजयप्रदः ।
    गजायुतबलो गण्डगुञ्जन्मत्तमधुव्रतः ॥ १५१॥ गण्डस्थललसद्दानमिळन्मत्ताळिमण्डितः । गुडो गुडप्रियो गुण्डगळद्दानो
    गुडाशनः ॥ १५२॥ गुडाकेशो गुडाकेशसहायो गुडलड्डुभुक् । गुडभुग्गुडभुग्गणयो गुडाकेशवरप्रदः ॥ १५३॥ गुडाकेशार्चितपदो
    गुडाकेशसखः सदा । गदाधरार्चितपदो गदाधरवरप्रदः ॥ १५४॥ गदायुधो गदापाणिर्गदायुद्धविशारदः । गदहा गददर्पघ्नो
    गदगर्वप्रणाशनः ॥ १५५॥ गदग्रस्तपरित्राता गदाडम्बरखण्डकः । गुहो गुहाग्रजो गुप्तो गुहाशायी गुहाशयः ॥
    १५६॥ गुहप्रीतिकरो गूढो गूढगुल्फो गुणैकदृक् । गीर्गीष्पतिर्गिरीशानो गीर्देवीगीतसद्गुणः ॥ १५७॥ गीर्देवो
    गीष्प्रियो गीर्भूर्गीरात्मा गीष्प्रियङ्करः । गीर्भूमिर्गीरसन्नोऽथ गीःप्रसन्नो गिरीश्वरः ॥ १५८॥ गिरीशजो
    गिरौशायी गिरिराजसुखावहः । गिरिराजार्चितपदो गिरिराजनमस्कृतः ॥ १५९॥ गिरिराजगुहाविष्टो गिरिराजाभयप्रदः
    । गिरिराजेष्टवरदो गिरिराजप्रपालकः ॥ १६०॥ गिरिराजसुतासूनुर्गिरिराजजयप्रदः । गिरिव्रजवनस्थायी गिरिव्रजचरः
    सदा ॥ १६१॥ गर्गो गर्गप्रियो गर्गदेहो गर्गनमस्कृतः । गर्गभीतिहरो गर्गवरदो गर्गसंस्तुतः ॥ १६२॥ गर्गगीतप्रसन्नात्मा
    गर्गानन्दकरः सदा । गर्गप्रियो गर्गमानप्रदो गर्गारिभञ्जकः ॥ १६३॥ गर्गवर्गपरित्राता गर्गसिद्धिप्रदायकः
    । गर्गग्लानिहरो गर्गभ्रमहृद्गर्गसङ्गतः ॥ १६४॥ गर्गाचार्यो गर्गमुनिर्गर्गसम्मानभाजनः । गम्भीरो गणितप्रज्ञो
    गणितागमसारवित् ॥ १६५॥ गणको गणकश्लाघ्यो गणकप्रणयोत्सुकः । गणकप्रवणस्वान्तो गणितो गणितागमः ॥ १६६॥ गद्यं
    गद्यमयो गद्यपद्यविद्याविशारदः । गललग्नमहानागो गलदर्चिर्गलसन्मदः ॥ १६७॥ गलत्कुष्ठिव्यथाहन्ता गलत्कुष्ठिसुखप्रदः
    । गम्भीरनाभिर्गम्भीरस्वरो गम्भीरलोचनः ॥ १६८॥ गम्भीरगुणसम्पन्नो गम्भीरगतिशोभनः । गर्भप्रदो गर्भरूपो
    गर्भापद्विनिवारकः ॥ १६९॥ गर्भागमनसन्नाशो गर्भदो गर्भशोकनुत् । गर्भत्राता गर्भगोप्त गर्भपुष्टिकरः सदा
    ॥ १७०॥ गर्भाश्रयो गर्भमयो गर्भामयनिवारकः । गर्भाधारो गर्भधरो गर्भसन्तोषसाधकः ॥ १७१॥ गर्भगौरवसन्धानसन्धानं
    गर्भवर्गहृत् । गरीयान् गर्वनुद्गर्वमर्दी गरदमर्दकः ॥ १७२॥ गरसन्तापशमनो गुरुराज्यसुखप्रदः । ॥ फलश्रुतिः
    ॥ नाम्नां सहस्रमुदितं महद्गणपतेरिदम् ॥ १७४॥ गकारादि जगद्वन्द्यं गोपनीयं प्रयत्नतः । य इदं प्रयतः प्रातस्त्रिसन्ध्यं
    वा पठेन्नरः ॥ १७३॥ वाञ्छितं समवाप्नोति नात्र कार्या विचारणा । पुत्रार्थी लभते पुत्रान् धनार्थी लभते
    धनम् ॥ १७४॥ विद्यार्थी लभते विद्यां सत्यं सत्यं न संशयः । भूर्जत्वचि समालिख्य कुङ्कुमेन समाहितः ॥
    १७५॥ चतुर्थां भौमवारो च चन्द्रसूर्योपरागके । पूजयित्वा गणधीशं यथोक्तविधिना पुरा ॥ १७६॥ पूजयेद् यो
    यथाशक्त्या जुहुयाच्च शमीदलैः । गुरुं सम्पूज्य वस्त्राद्यैः कृत्वा चापि प्रदक्षिणम् ॥ १७७॥ धारयेद्
    यः प्रयत्नेन स साक्षाद्गणनायकः । सुराश्चासुरवर्याश्च पिशाचाः किन्नरोरगः ॥ १७८॥ प्रणमन्ति सदा तं वै
    दुष्ट्वां विस्मितमानसाः । राजा सपदि वश्यः स्यात् कामिन्यस्तद्वशो स्थिराः ॥ १७९॥ तस्य वंशो स्थिरा लक्ष्मीः
    कदापि न विमुञ्चति । निष्कामो यः पठेदेतद् गणेश्वरपरायणः ॥ १८०॥ स प्रतिष्ठां परां प्राप्य निजलोकमवाप्नुयात्
    । इदं ते कीर्तितं नाम्नां सहस्रं देवि पावनम् ॥ १८१॥ न देयं कृपणयाथ शठाय गुरुविद्विषे । दत्त्वा च भ्रंशमाप्नोति
    देवतायाः प्रकोपतः ॥ १८२॥ इति श्रुत्वा महादेवी तदा विस्मितमानसा । पूजयामास विधिवद्गणेश्वरपदद्वयम् ॥
    १८३॥ ॥ इति श्रीरुद्रयामले महागुप्तसारे शिवपार्वतीसंवादे गकारादि श्रीगणपतिसहस्रनामस्तोत्रं सम्पूर्णम्
    ॥
