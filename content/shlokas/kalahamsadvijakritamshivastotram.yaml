id: kalahamsadvijakritamshivastotram
category: stotram
name:
  english: kalahamsadvijakritamshivastotram
  devanagari: कलहंसद्विजकृतंशिवस्तोत्रम्
content:
  english: kalahamsadvijakritam shivastotram shankarastu drutam tatra sakshat hasan samayayau | kalahamso
    namashcakre stotum samupacakrame || 9|| namo bhaktakripayukta mahadeva namo'stu te | namah shivaya
    bhaktanamishtapradaya te namah || 10|| bhavasagaramagnanamuddharakaya te namah | parabrahmasvarupaya
    vaishnavagryaya te namah || 11|| om namah shrikrishnanarayanatmakaya te namah | parvatipataye prabhasvamidevaya
    te namah || narayanisharupaya jayadhyakshaya te namah | sarvabijasvarupaya karanaya namo namah ||
    13|| shambhuh stotram shubham shrutva varam vrinu jagada tam | kalahamseshvaram tirtham vavre ca rishisattamah
    || 14|| tatra pranairviyuktanam moksham vavre shubham varam | shambhuh praha tathaiva'stu cante muktistava'stu
    ca || 15|| antardhanam yayavuktva kalahamso'pi sarvatha | bhajitva narmadam tirtham cante brahmapadam
    yayau || 16|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane 558
  devanagari: कलहंसद्विजकृतं शिवस्तोत्रम् शङ्करस्तु द्रुतं तत्र साक्षात् हसन् समाययौ । कलहंसो नमश्चक्रे
    स्तोतुं समुपचक्रमे ॥ ९॥ नमो भक्तकृपायुक्त महादेव नमोऽस्तु ते । नमः शिवाय भक्तानामिष्टप्रदाय ते नमः
    ॥ १०॥ भवसागरमग्नानामुद्धारकाय ते नमः । परब्रह्मस्वरूपाय वैष्णवाग्र्याय ते नमः ॥ ११॥ ॐ नमः श्रीकृष्णनारायणात्मकाय
    ते नमः । पार्वतीपतये प्रभास्वामिदेवाय ते नमः ॥ नारायणीशरूपाय जयाध्यक्षाय ते नमः । सर्वबीजस्वरूपाय
    कारणाय नमो नमः ॥ १३॥ शम्भुः स्तोत्रं शुभं श्रूत्वा वरं वृणु जगाद तम् । कलहंसेश्वरं तीर्थं वव्रे च
    ऋषिसत्तमः ॥ १४॥ तत्र प्राणैर्वियुक्तानां मोक्षं वव्रे शुभं वरम् । शम्भुः प्राह तथैवाऽस्तु चान्ते मुक्तिस्तवाऽस्तु
    च ॥ १५॥ अन्तर्धानं ययावुक्त्वा कलहंसोऽपि सर्वथा । भजित्वा नार्मदं तीर्थं चान्ते ब्रह्मपदं ययौ ॥ १६॥
    इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने ५५८
meaning: {}
