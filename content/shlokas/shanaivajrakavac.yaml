id: shanaivajrakavac
category: kavacha
name:
  english: shanaivajrakavac
  devanagari: शनैवज्रकवच्
content:
  english: rinudhvamrishayah sarve shanipidaharam mahat | kavacam shanirajasya saureridamanuttamam ||
    2|| kavacam devatavasam vajrapamjarasamjnakam | shanaishcarapritikaram sarvasaubhagyadayakam || 3||
    om shrishanaishcarah patu bhalam me suryanandanah | netre chayatmajah patu patu karnau yamanujah ||
    4|| nasam vaivasvatah patu mukham me bhaskarah sada | snigdhakanthashca me kantham bhujau patu mahabhujah
    || 5|| skandhau patu shanishcaiva karau patu
  devanagari: ृणुध्वमृषयः सर्वे शनिपीडाहरं महत् । कवचं शनिराजस्य सौरेरिदमनुत्तमम् ॥ २॥ कवचं देवतावासं
    वज्रपंजरसंज्ञकम् । शनैश्चरप्रीतिकरं सर्वसौभाग्यदायकम् ॥ ३॥ ॐ श्रीशनैश्चरः पातु भालं मे सूर्यनन्दनः
    । नेत्रे छायात्मजः पातु पातु कर्णौ यमानुजः ॥ ४॥ नासां वैवस्वतः पातु मुखं मे भास्करः सदा । स्निग्धकण्ठश्च
    मे कण्ठं भुजौ पातु महाभुजः ॥ ५॥ स्कन्धौ पातु शनिश्चैव करौ पातु
meaning: {}
