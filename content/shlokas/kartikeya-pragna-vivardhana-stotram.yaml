id: kartikeya-pragna-vivardhana-stotram
category: stotram
name:
  english: Kartikeya Pragna Vivardhana Stotram
content:
  english: skanda uvaca | yogishvaro mahasenah kartikeyo'gninandanah | skandah kumarah senanih svami shankarasambhavah
    || || gangeyastamracudashca brahmacari shikhidhvajah | tarakarirumaputrah krauncarishca shadananah
    || || shabdabrahmasamudrashca siddhah sarasvato guhah | sanatkumaro bhagavan bhogamokshaphalapradah
    || || sharajanma ganadhishapurvajo muktimargakrit | sarvagamapraneta ca vanchitarthapradarshanah ||
    || ashtavimshatinamani madiyaniti yah pathet | pratyushe shraddhaya yukto muko vacaspatirbhavet ||
    || mahamantramayaniti mama namanukirtanam | mahaprajnamavapnoti natra karya vicarana || || iti shrirudrayamale
    prajnavivardhanakhyam shrimatkartikeyastotram ||
  devanagari: स्कन्द उवाच । योगीश्वरो महासेनः कार्तिकेयोऽग्निनन्दनः । स्कन्दः कुमारः सेनानीः स्वामी शङ्करसम्भवः
    ॥ ॥ गाङ्गेयस्ताम्रचूडश्च ब्रह्मचारी शिखिध्वजः । तारकारिरुमापुत्रः क्रौञ्चारिश्च षडाननः ॥ ॥ शब्दब्रह्मसमुद्रश्च
    सिद्धः सारस्वतो गुहः । सनत्कुमारो भगवान् भोगमोक्षफलप्रदः ॥ ॥ शरजन्मा गणाधीशपूर्वजो मुक्तिमार्गकृत्
    । सर्वागमप्रणेता च वाञ्छितार्थप्रदर्शनः ॥ ॥ अष्टाविंशतिनामानि मदीयानीति यः पठेत् । प्रत्यूषे श्रद्धया
    युक्तो मूको वाचस्पतिर्भवेत् ॥ ॥ महामन्त्रमयानीति मम नामानुकीर्तनम् । महाप्रज्ञामवाप्नोति नात्र कार्या
    विचारणा ॥ ॥ इति श्रीरुद्रयामले प्रज्ञाविवर्धनाख्यं श्रीमत्कार्तिकेयस्तोत्रम् ॥
