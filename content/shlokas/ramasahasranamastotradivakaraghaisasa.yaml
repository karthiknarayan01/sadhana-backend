id: ramasahasranamastotradivakaraghaisasa
category: sahasranama
name:
  english: ramasahasranamastotradivakaraghaisasa
  devanagari: रामसहस्रनामस्तोत्रदिवाकरघैसास
content:
  english: rinu namani ramasya sahasrani yathakramam || 7|| stotrametatpathitva hi bhakto jnasyati sarvatha
    | raghavasya gunan mukhyan dhyatva shantim nigacchati || 8|| atha stotram | om aryashreshtho dharapalah
    saketapurapalakah | ekabano dharmavetta satyasandho'parajitah || 1|| ikshvakukulasambhuto raghunathah
    sadashrayah | aghadhvamsi mahapunyo manasvi mohanashanah || 2|| aprameyo mahabhagah sitasaundaryavardhanah
    | ahalyoddharakah shasta kuladipah prabhakarah || 3|| apadvinashi guhyajnah sitavirahavyakulah | antarjnani
    mahajnani shuddhasanjno'nujapriyah || 4|| asadhyasadhako bhimo mitabhashi vidam varah | avatirnah
    samuttaro dashasyandanamanadah || 5|| atmaramo vimanarho harshamarshasusangatah | abhigamyo vishalatma
    viramashcintanatmakah || 6|| advitiyo mahayogi sadhucetah prasadanah | ugrashrirantakastejastarano
    bhurisangrahah || 7|| ekadarah sattvanidhih sannidhih smritirupavan | uttamalankritah karta upamarahitah
    kriti || 8|| ajanubahurakshubdhah kshubdhasagaradarpaha | adityakulasantano vamshocitaparakramah ||
    9|| anukulah satam sadbhirbhavabaddhakaraih stutah | upadeshta nripotkrishto bhujamata khagapriyah
    || 10|| ojorashirnidhih sakshatkshanadrishtatmacetanah | umaparikshito mukah sandhijno ravanantakah
    || 11|| alaukiko lokapalastrailokyavyaptavaibhavah | anujashvasitah shishto varishthashcapadharishu
    || 12|| udyami buddhiman gupto yuyutsuh sarvadarshanah | aikshvako lakshyanaprano lakshmivan bhargavapriyah
    || 13|| ishtadah satyadidrikshurdigjayi dakshinayanah | ananyavrittirudyogi candrashekharashantidah
    || 14|| anujarthasamutkanthah suratranah surakritih | ashvamedhi yashovriddhastarunastaranekshanah
    || 15|| aprakritah pratijnata varaprapto varapradah | abhutapurvo'dbhutadhyeyo rudrapremi sushitalah
    || 16|| antahsprik dhanuhsprikcaiva bharataprishtakaushalah | atmasamstho manahsamsthah sattvasamstho
    ranasthitah || 17|| irshyahino mahashaktih suryavamshi janastutah | asanastho bandhavasthah shraddhasthanam
    gunasthitah || 18|| indramitro'shubhaharo mayavimrigaghatakah | amogheshuh svabhavajno namoccaranasamsmritah
    || 19|| aranyarudanakranto bashpasankulalocanah | amoghashirvaco'mando vidvadvandyo vanecarah || 20||
    indradidevatatoshah samyami vratadharakah | antaryami vinashtarirdambhahino ravidyutih || 21|| kakutstho
    girigambhirastatakapranakarshanah | kandamulannasantushto dandakaranyashodhanah || 22|| kartavyadakshah
    snehardrah snehakritkamasundarah | kaikeyilinapravrittirnivrittirnamakirtitah || 23|| kabandhaghno
    bhayatrano bharadvajakritadarah | karunah purushashreshthah purushah paramarthavit|| 24|| kevalah
    sutasangitakarshito rishisangatah | kavyatma nayavinmanyo muktatma guruvikramah || 25|| kramajnah
    karmashastrajnah sambandhajnah sulakshah | kishkindheshahitakankshi laghuvakyavisharadah || 26|| kapishreshthasamayuktah
    pracino valkalavritah | kakapreritabrahmastrah saptatalavibhanjanah || 27|| kapatajnah kapipritah
    kavisphurtipradayakah | kimvadantidvidhavrittirnidharadrirvidhipriyah || 28|| kalamitrah kalakarta
    kaladigdarshitantavit | krantadarshi vinishkranto nitishastrapurahsarah || 29|| kundalalankritashrotro
    bhrantiha bhramanashakah | kamalayataksho nirogah subaddhango mridusvanah || 30|| kravyadaghno vadanyatma
    samshayapannamanasah | kausalyakrodavishramah kakapakshadharah shubhah || 31|| khalakshayo'khilashreshthah
    prithukhyatipuraskritah | guhakapremabhagdevo manavesho mahidharah || 32|| gudhatma jagadadharah kalatravirahaturah
    | gudhacaro naravyaghro budho buddhipracodanah || 33|| gunabhridgunasanghatah samajonnatikaranah |
    gridhrahridgatasankalpo nalanilangadapriyah || 34|| grihastho vipinasthayi margastho munisangatah
    | gudhajatrurvrishaskangho mahodarah shamaspadah || 35|| caravrittantasandishto duravasthasahah sakha
    | caturdashasahasraghno nanasuranishudanah || 36|| caitreyashcitracaritah camatkarakshamo'laghuh |
    caturo bandhavo bharta gururatmaprabodhanah || 37|| janakikanta anando vatsalyabahulah pita | jatayusevitah
    saumyo muktidhama parantapah || 38|| janasangrahakritsukshmashcaranashritakomalah | janakanandasankalpah
    sitapiranayotsukah || 39|| tapasvi dandanadharo devasuravilakshanah | tribandhurvijayakankshi pratijnaparago
    mahan || 40|| tvarito dveshahinecchah svasthah svagatatatparah | jananijanasaujanyah parivaragranirguruh
    || 41|| tattvavittattvasandeshta tattvacari vicaravan | tikshnabanashcapapanih sitapanigrahi yuva
    || 42|| tikshnashugah sarittirno langhitoccamahidharah | devatasangato'sango ramaniyo dayamayah ||
    43|| divyo dedipyamanabho darunarinishudanah | durdharsho dakshino daksho dikshito'moghaviryavan ||
    44|| data duragatakhyatirniyanta lokasamshrayah | dushkirtishankito viro nishpapo divyadarshanah ||
    45|| dehadhari brahmavetta vijigishurgunakarah | daityaghati banapanirbrahyastradhyo gunanvitah ||
    46|| divyabharanaliptango divyamalyasupujitah | daivajno devataradhyo devakaryasamutsukah || 47||
    dridhapratijno dirghayurdushtadandanapanditah | dandakaranyasancari caturdigvijayi jayah || 48|| divyajanma
    indriyeshah svalpasantushtamanasah | devasampujito ramyo dinadurbalarakshakah || 49|| dashasyahanano'durah
    sthanusadrishanishcayah | doshaha sevakaramah sitasantapanashanah || 50|| dushanaghnah kharadhvamsi
    samagranripanayakah | durdharo durlabho dipto durdinahatavaibhavah || 51|| dinanatho divyarathah sajjanatmamanorathah
    | dilipakulasandipo raghuvamshasushobhanah || 52|| dirghabahurduradarshi vicari vidhipanditah | dhanurdharo
    dhani dantastapaso niyatatmavan || 53|| dharmaseturdharmamargah setubandhanasadhanah | dharmoddharo
    manorupo manohari mahadhanah || 54|| dhyatridhyeyatmako madhyo mohalobhapratikriyah | dhamamuk puramugvakta
    deshatyagi munivrati || 55|| dhyanashaktirdhyanamurtirdhyatrirupo vidhayakah | dharmabhiprayavijnani
    dridho duhsvapnanashanah || 56|| dhurandharo dharabharta prashastah punyabandhavah | nilabho nishcalo
    raja kausalyeyo raghuttamah || 57|| nilanirajasankakashah karkasho vishakarshanah | nirantarah samaradhyah
    senadhyakshah sanatanah || 58|| nishacarabhayavarto vartamanastrikalavit | nitijno rajanitijno dharmanitijna
    atmavan || 59|| nayakah sayakotsari vipakshasuvikarshanah | naukagami kusheshayi tapodhamartarakshanah
    || 60|| nihsprihah sprihaniyashrirnijanando vitandritah | nityopayo vanopeto guhakah shreyasam nidhih
    || 61|| nishthavannipuno dhuryo dhritimanuttamasvarah | nanarishimakhahuto yajamano yashaskarah ||
    62|| maithilidushitartantahkarano vibudhapriyah | nityanityaviveki satkaryasajjah saduktiman || 63||
    purusharthadarshako vagmi hanumatsevitah prabhuh | praudhaprabhavo bhavajno bhaktadhino rishipriyah
    || 64|| pavano rajakaryajno vasishthanandakaranah | parnagehi vigudhatma kutajnah kamalekshanah ||
    65|| priyarhah priyasankalpah priyamodanapanditah | paraduhkhartaceta durvyasane'calanishcayah ||
    66|| pramanah premasamvedyo munimanasacintanah | pritiman ritavan vidvan kirtiman yugadharanah ||
    67|| prerakashcandravaccarurjagritah sajjakarmukah | pujyah pavitrah sarvatma pujaniyah priyamvadah
    || 68|| prapyah prapto'navadyah svarnilayo nilavigrahi | paratattvarthasanmurtih satkritah kritavidvarah
    || 69|| prasannah prayatah pritah priyaprayah pratikshitah | papaha shakradattastrah shakradattarathasthitah
    || 70|| pratardhyeyah sadabhadro bhayabhanjanakovidah | punyasmaranah sannaddhah punyapushtiparayanah
    || 71|| putrayugmaparisprishto vishvasah shantivardhanah | paricaryaparamarshi bhumijapatirishvarah
    || 72|| padukado'nujapremi rijunamabhayapradah | putradharmavisheshajnah samarthah sangarapriyah ||
    73|| pushpavarshavashubhrango jayavanamarastutah | punyashlokah prashantarcishcandanangavilepanah
    || 74|| pauranuranjanah shuddhah sugrivakritasangatih | parthivah svarthasanyasi suvrittah paracittavit
    || pushpakarudhavaidehisamlapasnehavardhanah | pitrimodakaro'ruksho nashtarakshasavalganah || 76||
    pravrinmeghasamodarah shishirah shatrukalanah | pauranugamano'vadhyo vairividhvamsanavrati || 77||
    pinakimanasahlado valukalingapujakah | purastho vijanasthayi hridayastho giristhitah || 78|| punyasparshah
    sukhasparshah padasamsprishtaprastarah | pratipannasamagrashrih satprapannah pratapavan || 79|| pranipataprasannatma
    candanadbhutashitalah | punyanamasmrito nityo manujo divyatam gatah || 80|| bandhacchedi vanacchandah
    svacchandashchadano dhruvah | bandhutrayasamayukto hrinnidhano manomayah || 81|| vibhishanasharanyah
    shriyuktah shrivardhanah parah | bandhunikshiptarajyasvah sitamocanadhorani || 82|| bhavyabhalah samunnasah
    kiritankitamastakah | bhavabdhitarano bodho dhanamanavilakshanah || 83|| bhuribhridbhavyasankalpo
    bhuteshatma vibodhanah | bhaktacatakameghardro medhavi vardhitashrutih || 84|| bhayanishkasano'jeyo
    nirjarashaprapurakah | bhavasaro bhavasaro bhaktasarvasvarakshakah || 85|| bhargavaujah samutkarsho
    ravanasvasrimohanah | bharatanyastarajyashrirjanakisukhasagarah || 86|| mithileshvarajamata janakihridayeshvarah
    | matribhakto hyanantashrih pitrisandishtakarmakrit|| 87|| maryadapurushah shantah shyamo nirajalocanah
    | meghavarno vishalakshah sharavarshavabhishanah || 88|| mantravidgadhijadishto gautamashramapavanah
    | madhuro'mandagah sattvah sattviko mridulo bali || 89|| mandasmitamukho'lubdho vishramah sumanoharah
    | manavendrah sabhasajjo ghanagambhiragarjanah || 90|| maithilimohano mani garvaghnah punyaposhanah
    | madhujo madhurakaro madhuvanmadhurananah || 91|| mahakarma viradhaghno vighnashantirarindamah |
    marmasparshi navonmeshah kshatriyah purushottamah || 92|| maricavancito bharyapriyakritpranayotkatah
    | mahatyagi ratharudhah padagami bahushrutah || 93|| mahavego mahaviryo viro matalisarathih | makhatrata
    sadacari harakarmukabhanjanah || 94|| mahaprayasah pramanyagrahi sarvasvadayakah | munivighnantakah
    shastri shapasambhrantalocanah || 95|| malahari kalavijno manojnah paramarthavit | mitahari sahishnurbhupalakah
    paraviraha || 96|| matrisnehi sutasnehi snigdhangah snigdhadarshanah | matripitripadasparshi ashmasparshi
    manogatah || 97|| mridusparsha ishusparshi sitasammitavigrahah | matripramodano japyo vanaprasthah
    pragalbhadhih || 98|| yajnasamrakshanah sakshi adharo vedavinnripah | yojanacaturah svami dirghanveshi
    subahuha || 99|| yugendro bharatadarshah sukshmadarshi rijusvanah | yadricchalabhalaghvashi mantrarashmiprabhakarah
    || 100|| yajnahutanripavrindo rikshavanarasevitah | yajnadatto yajnakarta yajnavetta yashomayah ||
    101|| yatendriyo yati yukto rajayogi harapriyah | raghavo ravivamshadhyo ramacandro'rimardanah ||
    1 0 2|| rucirashcirasandheyah sangharshajno nareshvarah | rucirasmitashobhadyo dridhorasko mahabhujah
    || 103|| rajyahinah puratyagi bashpasankulalocanah | rishisammanitah simaparino rajasattamah || 104||
    ramo dasharathih shreyan paramatmasamo bhuvi | lankeshakshobhano dhanyashcetohari svayandhanah ||
    105|| lavanyakhanirakhyatah pramukhah kshatrarakshanah | lankapatibhayodrekah suputro vimalantarah
    || 106|| viveki komalah kantah kshamavan duritantakah | vanavasi sukhatyagi sukhakritsundaro vashi
    || 107|| viragi gauravo dhirah shuro rakshasaghatakah | vardhishnurvijayi prajno rahasyajno vimarshavit||
    108|| valmikipratibhasrotah sadhukarma satam gatih | vinayi nyayavijnata prajaranjanadharmavit ||
    109|| vimalo matimanneta netranandapradayakah | vinito vriddhasaujanyo vrikshabhit cetasa rijuh ||
    110|| vatsalo mitrahrinmodah sugrivahitakridvibhuh | valinirdalano'sahyo rikshasahyo mahamatih ||
    111|| vrikshalinganalilavinmunimokshapatuh sudhih | varenyah paramodyogo nigrahi ciravigrahi || 112||
    vasavopamasamarthyo jyasanghatogranihsvanah | vishvamitraparamrishtah purno balasamayutah || 113||
    vaidehipranasantoshah sharanagatavatsalah | vinamrah svabhimanarhah parnashalasamashritah || 114||
    vrittagandah shubhradanti samabhrudvayashobhitah | vikasatpankajabhasyah premadrishtih sulocanah ||
    115|| vaishnavo narashardulo bhagavan bhaktarakshanah | vasishthapriyashishyashcitsvarupashcetanatmakah
    || 116|| vividhapatparakranto vanarotkarshakaranah | vitaragi sharmadayi munimantavyasadhanah || 117||
    virahi harasankalpo harshotphullavarananah | vrittijno vyavaharajnah kshemakari pridhuprabhah || 118||
    viprapremi vanakrantah phalabhuk phaladayakah | vipanmitram mahamantrah shaktiyukto jatadharah ||
    119|| vyayamavyayatakaro vidam vishramasambhavah | vanyamanavakalyanah kulacaravicakshanah || 120||
    vipakshorahpraharajnashcapadharibahukritah | vipallanghi ghanashyamo ghorakridrakshasasahah || 121||
    vamankashrayinisitamukhadarshanatatparah | vividhashramasampujyah sharabhangakritadarah || 122|| vishnucapadharah
    kshatro dhanurdharashiromanih | vanagami padatyagi padacari vratasthitah || 123|| vijitasho mahaviro
    dakshinyanavanirjharah | vishnutejom'sasambhutah satyapremi dridhavratah || 124 || vanararamado namro
    mridubhashi mahamanah | shatruha vighnahanta sallokasammanatatparah || 125|| shatrughnagrajanih shriman
    sagaradarapujakah | shokakarta shokaharta shilavan hridayangamah || 126|| shubhakricchubhasankalpah
    kritanto dridhasangarah | shokahanta vishesharhah sheshasangatajivanah || 127|| shatrujitsarvakalyano
    mohajitsarvamangalah | shambukavadhako'bhishto yugadharmagrahi yamah || 128|| shaktiman ranamedhavi
    shreshthah samarthyasamyutah | shivasvah shivacaitanyah shivatma shivabodhanah || 129|| shabaribhavanamugdhah
    sarvamardavasundarah | shami dami samasinah karmayogi susadhakah || 130|| shakabhuk kshepanastrajno
    nyayarupo nrinam varah | shunyashramah shunyamanah latapadapapricchakah || 131|| shapoktirahitodgaro
    nirmalo namapavanah | shuddhantahkaranah preshtho nishkalanko'vikampanah || 132|| shreyaskarah pridhuskandho
    bandhanasih surarcitah | shraddheyah shilasampannah sujanah sajjanantikah || 133|| shramikah shrantavaidehivishramah
    shrutiparagah | shraddhalurnitisiddhanti sabhyah samanyavatsalah || 134|| sumitrasutasevarthi bharatadishtavaibhavah
    | sadhyah svadhyayavijneyah shabdapalah paratparah || 135|| sanjivano jivasakha dhanurvidyavisharadah
    | sukshmabuddhirmahatejah anasaktah priyavahah || 136|| siddhah sarvangasampurnah karunyardrapayonidhih
    | sushilah shivacittajnah shivadhyeyah shivaspadah || 137|| samadarshi dhanurbhangi samshayocchedanah
    shucih | satyavadi karyavahashcaitanyah susamahitah || 138|| sanmitro vayuputresho vibhishanakritanatih
    | sagunah sarvatha''ramo nirdvandvah satyamasthitah || 139|| samakriddandaviddandi kodandi candavikramah
    | sadhukshemo ranaveshi ranakarta dayarnavah || 140|| sattvamurtih paranjyotih jyeshthaputro niramayah
    | svakiyabhyantaravishto'vikari nabhasandrishah || 141|| saralah sarasarvasvah satam sankalpasaurabhah
    | surasanghasamuddharta cakravarti mahipatih || 142|| sujnah svabhavavijnani titikshuh shatrutapanah
    | samadhisthah shastrasajjah pitrajnapalanapriyah || 143|| samakarnah suvakyajno gandharekhitabhalakah
    | skandhasthapitatuniro dhanurdharanadhorani || 144|| sarvasiddhisamavesho viravesho ripukshayah |
    sankalpasadhako'klishto ghorasuravimardanah || 145|| samudraparago jeta jitakrodho janapriyah | samskritah
    sushamah shyamah samutkrantah sada shucih || 146|| saddharmaprerako dharmo dharmasamrakshanotsukah
    | bhayanishkasane nah sa sambhavetpunaratmani || 147|| || iti shrianantasuta shridivakaraviracitam
    shriramasahasranamastotram sampurnam ||
  devanagari: ृणु नामानि रामस्य सहस्रणि यथाक्रमम् ॥ ७॥ स्तोत्रमेतत्पठित्वा हि भक्तो ज्ञास्यति सर्वथा ।
    राघवस्य गुणान् मुख्यान् ध्यात्वा शान्तिं निगच्छति ॥ ८॥ अथ स्तोत्रम् । ॐ आर्यश्रेष्ठो धरापालः साकेतपुरपालकः
    । एकबाणो धर्मवेत्ता सत्यसन्धोऽपराजितः ॥ १॥ इक्ष्वाकुकुलसम्भूतो रघुनाथः सदाश्रयः । अघध्वंसी महापुण्यो
    मनस्वी मोहनाशनः ॥ २॥ अप्रमेयो महाभागः सीतासौन्दर्यवर्धनः । अहल्योद्धारकः शास्ता कुलदीपः प्रभाकरः ॥
    ३॥ आपद्विनाशी गुह्यज्ञः सीताविरहव्याकुलः । अन्तर्ज्ञानी महाज्ञानी शुद्धसञ्ज्ञोऽनुजप्रियः ॥ ४॥ असाध्यसाधको
    भीमो मितभाषी विदां वरः । अवतीर्णः समुत्तारो दशस्यन्दनमानदः ॥ ५॥ आत्मारामो विमानार्हो हर्षामर्षसुसङ्गतः
    । अभिगम्यो विशालात्मा विरामश्चिन्तनात्मकः ॥ ६॥ अद्वितीयो महायोगी साधुचेताः प्रसादनः । उग्रश्रीरन्तकस्तेजस्तारणो
    भूरिसङ्ग्रहः ॥ ७॥ एकदारः सत्त्वनिधिः सन्निधिः स्मृतिरूपवान् । उत्तमालङ्कृतः कर्ता उपमारहितः कृती ॥
    ८॥ आजानुबाहुरक्षुब्धः क्षुब्धसागरदर्पहा । आदित्यकुलसन्तानो वंशोचितपराक्रमः ॥ ९॥ अनुकूलः सतां सद्भिर्भावबद्धकरैः
    स्तुतः । उपदेष्टा नृपोत्कृष्टो भूजामाता खगप्रियः ॥ १०॥ ओजोराशिर्निधिः साक्षात्क्षणदृष्टात्मचेतनः ।
    उमापरीक्षितो मूकः सन्धिज्ञो रावणान्तकः ॥ ११॥ अलौकिको लोकपालस्त्रैलोक्यव्याप्तवैभवः । अनुजाश्वासितः
    शिष्टो वरिष्ठश्चापधारिषु ॥ १२॥ उद्यमी बुद्धिमान् गुप्तो युयुत्सुः सर्वदर्शनः । ऐक्ष्वाको लक्ष्यणप्राणो
    लक्ष्मीवान् भार्गवप्रियः ॥ १३॥ इष्टदः सत्यदिदृक्षुर्दिग्जयी दक्षिणायनः । अनन्यवृत्तिरुद्योगी चन्द्रशेखरशान्तिदः
    ॥ १४॥ अनुजार्थसमुत्कण्ठः सुरत्राणः सुराकृतिः । अश्वमेधी यशोवृद्धस्तरुणस्तारणेक्षणः ॥ १५॥ अप्राकृतः
    प्रतिज्ञाता वरप्राप्तो वरप्रदः । अभूतपूर्वोऽद्भुतध्येयो रुद्रप्रेमी सुशीतलः ॥ १६॥ अन्तःस्पृक् धनुःस्पृक्चैव
    भरतापृष्टकौशलः । आत्मसंस्थो मनःसंस्थः सत्त्वसंस्थो रणस्थितः ॥ १७॥ ईर्ष्याहीनो महाशक्तिः सूर्यवंशी
    जनस्तुतः । आसनस्थो बान्धवस्थः श्रद्धास्थानं गुणस्थितः ॥ १८॥ इन्द्रमित्रोऽशुभहरो मायाविमृगघातकः । अमोघेषुः
    स्वभावज्ञो नामोच्चारणसंस्मृतः ॥ १९॥ अरण्यरुदनाक्रान्तो बाष्पसङ्कुललोचनः । अमोघाशीर्वचोऽमन्दो विद्वद्वन्द्यो
    वनेचरः ॥ २०॥ इन्द्रादिदेवतातोषः संयमी व्रतधारकः । अन्तर्यामी विनष्टारिर्दम्भहीनो रविद्युतिः ॥ २१॥
    काकुत्स्थो गिरिगम्भीरस्ताटकाप्राणकर्षणः । कन्दमूलान्नसन्तुष्टो दण्डकारण्यशोधनः ॥ २२॥ कर्तव्यदक्षः
    स्नेहार्द्रः स्नेहकृत्कामसुन्दरः । कैकेयीलीनप्रवृत्तिर्निवृत्तिर्नामकीर्तितः ॥ २३॥ कबन्धघ्नो भयत्राणो
    भरद्वाजकृतादरः । करुणः पुरुषश्रेष्ठः पुरुषः परमार्थवित्॥ २४॥ केवलः सुतसङ्गीताकर्षितो ऋषिसङ्गतः । काव्यात्मा
    नयविन्मान्यो मुक्तात्मा गुरुविक्रमः ॥ २५॥ क्रमज्ञः कर्मशास्त्रज्ञः सम्बन्धज्ञः सुलक्षः । किष्किन्धेशहिताकाङ्क्षी
    लघुवाक्यविशारदः ॥ २६॥ कपिश्रेष्ठसमायुक्तः प्राचीनो वल्कलावृतः । काकप्रेरितब्रह्मास्त्रः सप्ततालविभञ्जनः
    ॥ २७॥ कपटज्ञः कपिप्रीतः कविस्फूर्तिप्रदायकः । किंवदन्तीद्विधावृत्तिर्निधाराद्रिर्विधिप्रियः ॥ २८॥
    कालमित्रः कालकर्ता कालदिग्दर्शितान्तवित् । क्रान्तदर्शी विनिष्क्रान्तो नीतिशास्त्रपुरःसरः ॥ २९॥ कुण्डलालङ्कृतश्रोत्रो
    भ्रान्तिहा भ्रमनाशकः । कमलायताक्षो नीरोगः सुबद्धाङ्गो मृदुस्वनः ॥ ३०॥ क्रव्यादघ्नो वदान्यात्म संशयापन्नमानसः
    । कौसल्याक्रोडविश्रामः काकपक्षधरः शुभः ॥ ३१॥ खलक्षयोऽखिलश्रेष्ठः पृथुख्यातिपुरस्कृतः । गुहकप्रेमभाग्देवो
    मानवेशो महीधरः ॥ ३२॥ गूढात्मा जगदाधारः कलत्रविरहातुरः । गूढाचारो नरव्याघ्रो बुधो बुद्धिप्रचोदनः ॥
    ३३॥ गुणभृद्गुणसङ्घातः समाजोन्नतिकारणः । गृध्रहृद्गतसङ्कल्पो नलनीलाङ्गदप्रियः ॥ ३४॥ गृहस्थो विपिनस्थायी
    मार्गस्थो मुनिसङ्गतः । गूढजत्रुर्वृषस्कङ्घो महोदारः शमास्पदः ॥ ३५॥ चारवृत्तान्तसन्दिष्टो दुरवस्थासहः
    सखा । चतुर्दशसहस्रघ्नो नानासुरनिषूदनः ॥ ३६॥ चैत्रेयश्चित्रचरितः चमत्कारक्षमोऽलघुः । चतुरो बान्धवो
    भर्ता गुरुरात्मप्रबोधनः ॥ ३७॥ जानकीकान्त आनन्दो वात्सल्यबहुलः पिता । जटायुसेवितः सौम्यो मुक्तिधाम
    परन्तपः ॥ ३८॥ जनसङ्ग्रहकृत्सूक्ष्मश्चरणाश्रितकोमलः । जनकानन्दसङ्कल्पः सीतापीरणयोत्सुकः ॥ ३९॥ तपस्वी
    दण्डनाधारो देवासुरविलक्षणः । त्रिबन्धुर्विजयाकाङ्क्षी प्रतिज्ञापारगो महान् ॥ ४०॥ त्वरितो द्वेषहीनेच्छः
    स्वस्थः स्वागततत्परः । जननीजनसौजन्यः परिवाराग्रणीर्गुरुः ॥ ४१॥ तत्त्ववित्तत्त्वसन्देष्टा तत्त्वाचारी
    विचारवान् । तीक्ष्णबाणश्चापपाणिः सीतापाणिग्रही युवा ॥ ४२॥ तीक्ष्णाशुगः सरित्तीर्णो लङ्घितोच्चमहीधरः
    । देवतासङ्गतोऽसङ्गो रमणीयो दयामयः ॥ ४३॥ दिव्यो देदीप्यमानाभो दारुणारिनिषूदनः । दुर्धर्षो दक्षिणो दक्षो
    दीक्षितोऽमोघवीर्यवान् ॥ ४४॥ दाता दूरगताख्यातिर्नियन्ता लोकसंश्रयः । दुष्कीर्तिशङ्कितो वीरो निष्पापो
    दिव्यदर्शनः ॥ ४५॥ देहधारी ब्रह्मवेत्ता विजिगीषुर्गुणाकरः । दैत्यघाती बाणपाणिर्ब्रह्यास्त्राढ्यो गुणान्वितः
    ॥ ४६॥ दिव्याभरणलिप्ताङ्गो दिव्यमाल्यसुपूजितः । दैवज्ञो देवताराध्यो देवकार्यसमुत्सुकः ॥ ४७॥ दृढप्रतिज्ञो
    दीर्घायुर्दुष्टदण्डनपण्डितः । दण्डकारण्यसञ्चारी चतुर्दिग्विजयी जयः ॥ ४८॥ दिव्यजन्मा इन्द्रियेशः स्वल्पसन्तुष्टमानसः
    । देवसम्पूजितो रम्यो दीनदुर्बलरक्षकः ॥ ४९॥ दशास्यहननोऽदूरः स्थाणुसदृशनिश्चयः । दोषहा सेवकारामः सीतासन्तापनाशनः
    ॥ ५०॥ दूषणघ्नः खरध्वंसी समग्रनृपनायकः । दुर्धरो दुर्लभो दीप्तो दुर्दिनाहतवैभवः ॥ ५१॥ दीननाथो दिव्यरथः
    सज्जनात्ममनोरथः । दिलीपकुलसन्दीपो रघुवंशसुशोभनः ॥ ५२॥ दीर्घबाहुर्दूरदर्शी विचारी विधिपण्डितः । धनुर्धरो
    धनी दान्तस्तापसो नियतात्मवान् ॥ ५३॥ धर्मसेतुर्धर्ममार्गः सेतुबन्धनसाधनः । धर्मोद्धारो मनोरूपो मनोहारी
    महाधनः ॥ ५४॥ ध्यातृध्येयात्मको मध्यो मोहलोभप्रतिक्रियः । धाममुक् पुरमुग्वक्ता देशत्यागी मुनिव्रती
    ॥ ५५॥ ध्यानशक्तिर्ध्यानमूर्तिर्ध्यातृरूपो विधायकः । धर्माभिप्रायविज्ञानी दृढो दुःस्वप्ननाशनः ॥ ५६॥
    धुरन्धरो धराभर्ता प्रशस्तः पुण्यबान्धवः । नीलाभो निश्चलो राजा कौसल्येयो रघूत्तमः ॥ ५७॥ नीलनीरजसङ्काकाशः
    कर्कशो विषकर्षणः । निरन्तरः समाराध्यः सेनाध्यक्षः सनातनः ॥ ५८॥ निशाचरभयावर्तो वर्तमानस्त्रिकालवित्
    । नीतिज्ञो राजनीतिज्ञो धर्मनीतिज्ञ आत्मवान् ॥ ५९॥ नायकः सायकोत्सारी विपक्षासुविकर्षणः । नौकागामी कुशेशायी
    तपोधामार्तरक्षणः ॥ ६०॥ निःस्पृहः स्पृहणीयश्रीर्निजानन्दो वितन्द्रितः । नित्योपायो वनोपेतो गुहकः श्रेयसां
    निधिः ॥ ६१॥ निष्ठावान्निपुणो धुर्यो धृतिमानुत्तमस्वरः । नानाऋषिमखाहूतो यजमानो यशस्करः ॥ ६२॥ मैथिलीदूषितार्तान्तःकरणो
    विबुधप्रियः । नित्यानित्यविवेकी सत्कार्यसज्जः सदुक्तिमान् ॥ ६३॥ पुरुषार्थदर्शको वाग्मी हनुमत्सेवितः
    प्रभुः । प्रौढप्रभावो भावज्ञो भक्ताधीनो ऋषिप्रियः ॥ ६४॥ पावनो राजकार्यज्ञो वसिष्ठानन्दकारणः । पर्णगेही
    विगूढात्मा कूटज्ञः कमलेक्षणः ॥ ६५॥ प्रियार्हः प्रियसङ्कल्पः प्रियामोदनपण्डितः । परदुःखार्तचेता दुर्व्यसनेऽचलनिश्चयः
    ॥ ६६॥ प्रमाणः प्रेमसंवेद्यो मुनिमानसचिन्तनः । प्रीतिमान् ऋतवान् विद्वान् कीर्तिमान् युगधारणः ॥ ६७॥
    प्रेरकश्चन्द्रवच्चारुर्जागृतः सज्जकार्मुकः । पूज्यः पवित्रः सर्वात्मा पूजनीयः प्रियंवदः ॥ ६८॥ प्राप्यः
    प्राप्तोऽनवद्यः स्वर्निलयो नीलविग्रही । परतत्त्वार्थसन्मूर्तिः सत्कृतः कृतविद्वरः ॥ ६९॥ प्रसन्नः प्रयतः
    प्रीतः प्रियप्रायः प्रतीक्षितः । पापहा शक्रदत्तास्त्रः शक्रदत्तरथस्थितः ॥ ७०॥ प्रातर्ध्येयः सदाभद्रो
    भयभञ्जनकोविदः । पुण्यस्मरणः सन्नद्धः पुण्यपुष्टिपरायणः ॥ ७१॥ पुत्रयुग्मपरिस्पृष्टो विश्वासः शान्तिवर्धनः
    । परिचर्यापरामर्शी भूमिजापतिरीश्वरः ॥ ७२॥ पादुकादोऽनुजप्रेमी ऋजुनामाभयप्रदः । पुत्रधर्मविशेषज्ञः समर्थः
    सङ्गरप्रियः ॥ ७३॥ पुष्पवर्षावशुभ्राङ्गो जयवानमरस्तुतः । पुण्यश्लोकः प्रशान्तार्चिश्चन्दनाङ्गविलेपनः
    ॥ ७४॥ पौरानुरञ्जनः शुद्धः सुग्रीवकृतसङ्गतिः । पार्थिवः स्वार्थसन्यासी सुवृत्तः परचित्तवित् ॥ पुष्पकारूढवैदेहीसंलापस्नेहवर्धनः
    । पितृमोदकरोऽरूक्षो नष्टराक्षसवल्गनः ॥ ७६॥ प्रावृण्मेघसमोदारः शिशिरः शत्रुकालनः । पौरानुगमनोऽवध्यो
    वैरिविध्वंसनव्रती ॥ ७७॥ पिनाकिमानसाह्लादो वालुकालिङ्गपूजकः । पुरस्थो विजनस्थायी हृदयस्थो गिरिस्थितः
    ॥ ७८॥ पुण्यस्पर्शः सुखस्पर्शः पदसंस्पृष्टप्रस्तरः । प्रतिपन्नसमग्रश्रीः सत्प्रपन्नः प्रतापवान् ॥ ७९॥
    प्रणिपातप्रसन्नात्मा चन्दनाद्भुतशीतलः । पुण्यनामस्मृतो नित्यो मनुजो दिव्यतां गतः ॥ ८०॥ बन्धच्छेदी
    वनच्छन्दः स्वच्छन्दश्छादनो ध्रुवः । बन्धुत्रयसमायुक्तो हृन्निधानो मनोमयः ॥ ८१॥ विभीषणशरण्यः श्रीयुक्तः
    श्रीवर्धनः परः । बन्धुनिक्षिप्तराज्यस्वः सीतामोचनधोरणी ॥ ८२॥ भव्यभालः समुन्नासः किरीटाङ्कितमस्तकः
    । भवाब्धितरणो बोधो धनमानविलक्षणः ॥ ८३॥ भूरिभृद्भव्यसङ्कल्पो भूतेशात्मा विबोधनः । भक्तचातकमेघार्द्रो
    मेधावी वर्धितश्रुतिः ॥ ८४॥ भयनिष्कासनोऽजेयो निर्जराशाप्रपूरकः । भवसारो भावसारो भक्तसर्वस्वरक्षकः ॥
    ८५॥ भार्गवौजाः समुत्कर्षो रावणस्वसृमोहनः । भरतन्यस्तराज्यश्रीर्जानकीसुखसागरः ॥ ८६॥ मिथिलेश्वरजामाता
    जानकीहृदयेश्वरः । मातृभक्तो ह्यनन्तश्रीः पितृसन्दिष्टकर्मकृत्॥ ८७॥ मर्यादापुरुषः शान्तः श्यामो नीरजलोचनः
    । मेघवर्णो विशालाक्षः शरवर्षावभीषणः ॥ ८८॥ मन्त्रविद्गाधिजादिष्टो गौतमाश्रमपावनः । मधुरोऽमन्दगः सत्त्वः
    सात्त्विको मृदुलो बली ॥ ८९॥ मन्दस्मितमुखोऽलुब्धो विश्रामः सुमनोहरः । मानवेन्द्रः सभासज्जो घनगम्भीरगर्जनः
    ॥ ९०॥ मैथिलीमोहनो मानी गर्वघ्नः पुण्यपोषणः । मधुजो मधुराकारो मधुवाङ्मधुराननः ॥ ९१॥ महाकर्मा विराधघ्नो
    विघ्नशान्तिररिन्दमः । मर्मस्पर्शी नवोन्मेषः क्षत्रियः पुरुषोत्तमः ॥ ९२॥ मारीचवञ्चितो भार्याप्रियकृत्प्रणयोत्कटः
    । महात्यागी रथारूढः पदगामी बहुश्रुतः ॥ ९३॥ महावेगो महावीर्यो वीरो मातलिसारथिः । मखत्राता सदाचारी हरकार्मुकभञ्जनः
    ॥ ९४॥ महाप्रयासः प्रामाण्यग्राही सर्वस्वदायकः । मुनिविघ्नान्तकः शस्त्री शापसम्भ्रान्तलोचनः ॥ ९५॥ मलहारी
    कलाविज्ञो मनोज्ञः परमार्थवित् । मिताहारी सहिष्णुर्भूपालकः परवीरहा ॥ ९६॥ मातृस्नेही सुतस्नेही स्निग्धाङ्गः
    स्निग्धदर्शनः । मातृपितृपदस्पर्शी अश्मस्पर्शी मनोगतः ॥ ९७॥ मृदुस्पर्श इषुस्पर्शी सीतासम्मितविग्रहः
    । मातृप्रमोदनो जप्यो वनप्रस्थः प्रगल्भधीः ॥ ९८॥ यज्ञसंरक्षणः साक्षी आधारो वेदविन्नृपः । योजनाचतुरः
    स्वामी दीर्घान्वेषी सुबाहुहा ॥ ९९॥ युगेन्द्रो भारतादर्शः सूक्ष्मदर्शी ऋजुस्वनः । यदृच्छालाभलघ्वाशी
    मन्त्ररश्मिप्रभाकरः ॥ १००॥ यज्ञाहूतनृपवृन्दो ऋक्षवानरसेवितः । यज्ञदत्तो यज्ञकर्ता यज्ञवेत्ता यशोमयः
    ॥ १०१॥ यतेन्द्रियो यती युक्तो राजयोगी हरप्रियः । राघवो रविवंशाढ्यो रामचन्द्रोऽरिमर्दनः ॥ १ ० २॥ रुचिरश्चिरसन्धेयः
    सङ्घर्षज्ञो नरेश्वरः । रुचिरस्मितशोभाड्यो दृढोरस्को महाभुजः ॥ १०३॥ राज्यहीनः पुरत्यागी बाष्पसङ्कुललोचनः
    । ऋषिसम्मानितः सीमापारीणो राजसत्तमः ॥ १०४॥ रामो दाशरथिः श्रेयान् परमात्मसमो भुवि । लङ्केशक्षोभणो धन्यश्चेतोहारी
    स्वयन्धनः ॥ १०५॥ लावण्यखनिराख्यातः प्रमुखः क्षत्ररक्षणः । लङ्कापतिभयोद्रेकः सुपुत्रो विमलान्तरः ॥
    १०६॥ विवेकी कोमलः कान्तः क्षमावान् दुरितान्तकः । वनवासी सुखत्यागी सुखकृत्सुन्दरो वशी ॥ १०७॥ विरागी
    गौरवो धीरः शूरो राक्षसघातकः । वर्धिष्णुर्विजयी प्राज्ञो रहस्यज्ञो विमर्शवित्॥ १०८॥ वाल्मीकिप्रतिभास्रोतः
    साधुकर्मा सतां गतिः । विनयी न्यायविज्ञाता प्रजारञ्जनधर्मवित् ॥ १०९॥ विमलो मतिमान्नेता नेत्रानन्दप्रदायकः
    । विनीतो वृद्धसौजन्यो वृक्षभित् चेतसा ऋजुः ॥ ११०॥ वत्सलो मित्रहृन्मोदः सुग्रीवहितकृद्विभुः । वालिनिर्दलनोऽसह्यो
    ऋक्षसाह्यो महामतिः ॥ १११॥ वृक्षालिङ्गनलीलाविन्मुनिमोक्षपटुः सुधीः । वरेण्यः परमोद्योगो निग्रही चिरविग्रही
    ॥ ११२॥ वासवोपमसामर्थ्यो ज्यासङ्घातोग्रनिःस्वनः । विश्वामित्रपरामृष्टः पूर्णो बलसमायुतः ॥ ११३॥ वैदेहीप्राणसन्तोषः
    शरणागतवत्सलः । विनम्रः स्वाभिमानार्हः पर्णशालासमाश्रितः ॥ ११४॥ वृत्तगण्डः शुभ्रदन्ती समभ्रूद्वयशोभितः
    । विकसत्पङ्कजाभास्यः प्रेमदृष्टिः सुलोचनः ॥ ११५॥ वैष्णवो नरशार्दूलो भगवान् भक्तरक्षणः । वसिष्ठप्रियशिष्यश्चित्स्वरूपश्चेतनात्मकः
    ॥ ११६॥ विविधापत्पराक्रान्तो वानरोत्कर्षकारणः । वीतरागी शर्मदायी मुनिमन्तव्यसाधनः ॥ ११७॥ विरही हरसङ्कल्पो
    हर्षोत्फुल्लवराननः । वृत्तिज्ञो व्यवहारज्ञः क्षेमकारी पृधुप्रभः ॥ ११८॥ विप्रप्रेमी वनक्रान्तः फलभुक्
    फलदायकः । विपन्मित्रं महामन्त्रः शक्तियुक्तो जटाधरः ॥ ११९॥ व्यायामव्यायताकारो विदां विश्रामसम्भवः
    । वन्यमानवकल्याणः कुलाचारविचक्षणः ॥ १२०॥ विपक्षोरःप्रहारज्ञश्चापधारिबहूकृतः । विपल्लङ्घी घनश्यामो
    घोरकृद्राक्षसासहः ॥ १२१॥ वामाङ्काश्रयिणीसीतामुखदर्शनतत्परः । विविधाश्रमसम्पूज्यः शरभङ्गकृतादरः ॥ १२२॥
    विष्णुचापधरः क्षत्रो धनुर्धरशिरोमणिः । वनगामी पदत्यागी पादचारी व्रतस्थितः ॥ १२३॥ विजिताशो महावीरो
    दाक्षिण्यनवनिर्झरः । विष्णुतेजोंऽससम्भूतः सत्यप्रेमी दृढव्रतः ॥ १२४ ॥ वानरारामदो नम्रो मृदुभाषी महामनाः
    । शत्रुहा विघ्नहन्ता सल्लोकसम्मानतत्परः ॥ १२५॥ शत्रुघ्नाग्रजनिः श्रीमान् सागरादरपूजकः । शोककर्ता शोकहर्ता
    शीलवान् हृदयङ्गमः ॥ १२६॥ शुभकृच्छुभसङ्कल्पः कृतान्तो दृढसङ्गरः । शोकहन्ता विशेषार्हः शेषसङ्गतजीवनः
    ॥ १२७॥ शत्रुजित्सर्वकल्याणो मोहजित्सर्वमङ्गलः । शम्बूकवधकोऽभीष्टो युगधर्माग्रही यमः ॥ १२८॥ शक्तिमान्
    रणमेधावी श्रेष्ठः सामर्थ्यसंयुतः । शिवस्वः शिवचैतन्यः शिवात्मा शिवबोधनः ॥ १२९॥ शबरीभावनामुग्धः सर्वमार्दवसुन्दरः
    । शमी दमी समासीनः कर्मयोगी सुसाधकः ॥ १३०॥ शाकभुक् क्षेपणास्त्रज्ञो न्यायरूपो नृणां वरः । शून्याश्रमः
    शून्यमनाः लतापादपपृच्छकः ॥ १३१॥ शापोक्तिरहितोद्गारो निर्मलो नामपावनः । शुद्धान्तःकरणः प्रेष्ठो निष्कलङ्कोऽविकम्पनः
    ॥ १३२॥ श्रेयस्करः पृधुस्कन्धो बन्धनासिः सुरार्चितः । श्रद्धेयः शीलसम्पन्नः सुजनः सज्जनान्तिकः ॥ १३३॥
    श्रमिकः श्रान्तवैदेहीविश्रामः श्रुतिपारगः । श्रद्धालुर्नीतिसिद्धान्ती सभ्यः सामान्यवत्सलः ॥ १३४॥ सुमित्रासुतसेवार्थी
    भरतादिष्टवैभवः । साध्यः स्वाध्यायविज्ञेयः शब्दपालः परात्परः ॥ १३५॥ सञ्जीवनो जीवसखा धनुर्विद्याविशारदः
    । सूक्ष्मबुद्धिर्महातेजाः अनासक्तः प्रियावहः ॥ १३६॥ सिद्धः सर्वाङ्गसम्पूर्णः कारुण्यार्द्रपयोनिधिः
    । सुशीलः शिवचित्तज्ञः शिवध्येयः शिवास्पदः ॥ १३७॥ समदर्शी धनुर्भङ्गी संशयोच्छेदनः शुचिः । सत्यवादी
    कार्यवाहश्चैतन्यः सुसमाहितः ॥ १३८॥ सन्मित्रो वायुपुत्रेशो विभीषणकृतानतिः । सगुणः सर्वथाऽऽरामो निर्द्वन्द्वः
    सत्यमास्थितः ॥ १३९॥ सामकृद्दण्डविद्दण्डी कोदण्डी चण्डविक्रमः । साधुक्षेमो रणावेशी रणकर्ता दयार्णवः
    ॥ १४०॥ सत्त्वमूर्तिः परञ्ज्योतिः ज्येष्ठपुत्रो निरामयः । स्वकीयाभ्यन्तराविष्टोऽविकारी नभसन्दृशः ॥
    १४१॥ सरलः सारसर्वस्वः सतां सङ्कल्पसौरभः । सुरसङ्घसमुद्धर्ता चक्रवर्ती महीपतिः ॥ १४२॥ सुज्ञः स्वभावविज्ञानी
    तितिक्षुः शत्रुतापनः । समाधिस्थः शस्त्रसज्जः पित्राज्ञापालनप्रियः ॥ १४३॥ समकर्णः सुवाक्यज्ञो गन्धरेखितभालकः
    । स्कन्धस्थापिततूणीरो धनुर्धारणधोरणी ॥ १४४॥ सर्वसिद्धिसमावेशो वीरवेषो रिपुक्षयः । सङ्कल्पसाधकोऽक्लिष्टो
    घोरासुरविमर्दनः ॥ १४५॥ समुद्रपारगो जेता जितक्रोधो जनप्रियः । संस्कृतः सुषमः श्यामः समुत्क्रान्तः सदा
    शुचिः ॥ १४६॥ सद्धर्मप्रेरको धर्मो धर्मसंरक्षणोत्सुकः । भयनिष्कासने नः स सम्भवेत्पुनरात्मनि ॥ १४७॥
    ॥ इति श्रीअनन्तसुत श्रीदिवाकरविरचितं श्रीरामसहस्रनामस्तोत्रं सम्पूर्णम् ॥
