id: candrakavacam
category: kavacha
name:
  english: candrakavacam
  devanagari: चन्द्रकवचम्
content:
  english: candraprityartham jape viniyogah | samam caturbhujam vande keyuramukutojjvalam | vasudevasya
    nayanam shankarasya ca bhushanam || 1|| evam dhyatva japennityam shashinah kavacam shubham | shashi
    patu shirodesham bhalam patu kalanidhih || 2|| cakshushi candramah patu shruti patu nishapatih | pranam
    kshapakarah patu mukham kumudabandhavah || 3|| patu kantham ca me somah skandhe jaivatrikastatha |
    karau sudhakarah patu vakshah patu nishakarah || 4|| hridayam patu me candro nabhim shankarabhushanah
    | madhyam patu surashreshthah katim patu sudhakarah || 5|| uru tarapatih patu mriganko januni sada
    | abdhijah patu me janghe patu padau vidhuh sada || 6|| sarvanyanyani cangani patu candu'khilam vapuh
    | etaddhi kavacam divyam bhuktimuktipradayakam | yah pathecchrinuyadvapi sarvatra vijayi bhavet ||
    7|| || iti shricandrakavacam sampurnam ||
  devanagari: चन्द्रप्रीत्यर्थं जपे विनियोगः । समं चतुर्भुजं वन्दे केयूरमुकुटोज्ज्वलम् । वासुदेवस्य नयनं
    शङ्करस्य च भूषणम् ॥ १॥ एवं ध्यात्वा जपेन्नित्यं शशिनः कवचं शुभम् । शशी पातु शिरोदेशं भालं पातु कलानिधिः
    ॥ २॥ चक्षुषी चन्द्रमाः पातु श्रुती पातु निशापतिः । प्राणं क्षपाकरः पातु मुखं कुमुदबान्धवः ॥ ३॥ पातु
    कण्ठं च मे सोमः स्कन्धे जैवातृकस्तथा । करौ सुधाकरः पातु वक्षः पातु निशाकरः ॥ ४॥ हृदयं पातु मे चन्द्रो
    नाभिं शङ्करभूषणः । मध्यं पातु सुरश्रेष्ठः कटिं पातु सुधाकरः ॥ ५॥ ऊरू तारापतिः पातु मृगाङ्को जानुनी
    सदा । अब्धिजः पातु मे जङ्घे पातु पादौ विधुः सदा ॥ ६॥ सर्वाण्यन्यानि चाङ्गानि पातु चन्दूऽखिलं वपुः
    । एतद्धि कवचं दिव्यं भुक्तिमुक्तिप्रदायकम् । यः पठेच्छृणुयाद्वापि सर्वत्र विजयी भवेत् ॥ ७॥ ॥ इति श्रीचन्द्रकवचं
    सम्पूर्णम् ॥
