id: shivastutih-3
category: stotram
name:
  english: shivastutih
  devanagari: शिवस्तुतिः
content:
  english: tkanjavasa bhagavan prasida mam || 69|| bhava bhavabhayahara bhima bhavatmaka bhavahridantarasundaravigraha
    | pahi shivavyaya deva dayakara shankara sukhakara sham kuru me sada || 70|| stavenanena deveshi stuvita
    parameshvaram | jyeshthe masi visheshena naktabhakto'tha havyabhuk || 71|| ekavaram dvivaram va trivaram
    va yajecchivam | jyeshthayamatha paurnamyam homah karyo yathavidhi || 72|| dadyadgomithunam tebhyah
    savatsam ca sadakshinam | dinanathan bhojayitva svayam bhunjita bandhubhih || 73|| jyeshthamasarcanam
    devi kathitam te samasatah | yatkritva manujah sadyo labhetphalamanuttamam || 74|| shivalaye lingamaulau
    grishme hridyam galantikam | masadvayam tu shitena gandhitena jalena ca || 75|| sacchidram karayetkumbham
    dharayettadaharnisham | kritvaivam yati sadanam madanantasya me shive || 76|| vamshasahasrasahito
    vimanenarkarocisha || 77|| || iti shivarahasyantargate ishvaraproktam jyeshthamasakrite shivastutih
    sampurna ||
  devanagari: त्कञ्जवास भगवन् प्रसीद माम् ॥ ६९॥ भव भवभयहर भीम भवात्मक भावहृदन्तरसुन्दरविग्रह । पाहि शिवाव्यय
    देव दयाकर शङ्कर सुखकर शं कुरु मे सदा ॥ ७०॥ स्तवेनानेन देवेशि स्तुवीत परमेश्वरम् । ज्येष्ठे मासि विशेषेण
    नक्तभक्तोऽथ हव्यभुक् ॥ ७१॥ एकवारं द्विवारं वा त्रिवारं वा यजेच्छिवम् । ज्येष्ठायामथ पौर्णम्यां होमः
    कार्यो यथाविधि ॥ ७२॥ दद्याद्गोमिथुनं तेभ्यः सवत्सं च सदक्षिणम् । दीनानाथान् भोजयित्वा स्वयं भुञ्जीत
    बन्धुभिः ॥ ७३॥ ज्येष्ठमासार्चनं देवि कथितं ते समासतः । यत्कृत्वा मनुजः सद्यो लभेत्फलमनुत्तमम् ॥ ७४॥
    शिवालये लिङ्गमौलौ ग्रीष्मे हृद्यां गलन्तिकाम् । मासद्वयं तु शीतेन गन्धितेन जलेन च ॥ ७५॥ सच्छिद्रं
    कारयेत्कुम्भं धारयेत्तदहर्निशम् । कृत्वैवं याति सदनं मदनान्तस्य मे शिवे ॥ ७६॥ वंशसाहस्रसहितो विमानेनार्करोचिषा
    ॥ ७७॥ ॥ इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तं ज्येष्ठमासकृते शिवस्तुतिः सम्पूर्णा ॥
