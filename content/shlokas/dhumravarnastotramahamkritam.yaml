id: dhumravarnastotramahamkritam
category: stotram
name:
  english: dhumravarnastotramahamkritam
  devanagari: धूम्रवर्णस्तोत्रमहंकृतं
content:
  english: ahamkritam dhumravarnastotram || shriganeshaya namah || ahamuvaca | dhumravarnaya vai tubhyam
    ganeshaya paratmane | avyaktayadibijaya pareshaya namo namah || 14|| lambodaraya devaya daityanathaya
    te namah | herambaya maheshanam palakaya namo namah || 15|| karmane karmarupaya nanakarmapracarine
    | jnanaya jnanadatre te jnanajnanaya vai namah || 16|| caraya cararupaya jangamasthaya te namah |
    sthavaraya sada tadrupaya tadrupadharine || 17|| sthavarajangamabhyam ca hinaya te namo namah | yogaya
    yoganathaya yogine yogadayine || 18|| yogebhyo yogadatre te namashcintamane namah | shantaya shantacittaistu
    prapyaya shantamurtaye || 19|| brahmanam pataye tubhyam brahmane siddhibuddhida | siddhinathaya buddhisha
    tayoryogaya te namah || 20|| mushakopari samsthaya mushakadhvajadharine | caturbhujaya svanandapataye
    te namo namah || 21|| kim staumi tvam ganadhisha dhumravarnasvarupinam | avyaktam vedavadeshu kathitam
    satatam prabho || 22|| svarupam te kathayitum veda dhumrayita babhuh | yogashantidharaste kathayitum
    dhruvamakshamah || 23|| atastvam dhumravarnakhyam vadante vedavadinah | pashyami tam dhumravarnameva'ham
    yogidurlabham || 24|| dhanyo'ham sakulo natha tvadanghriyugadarshanat | evamuktva nanarta'sau bhaktiyukto
    mahasurah || 25|| nimagnam tam bhaktirase drishtva devo gajananah | jagada tam mahabhagam premayuktam
    prasasvaje || 26||
  devanagari: अहंकृतं धूम्रवर्णस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ अहमुवाच । धूम्रवर्णाय वै तुभ्यं गणेशाय परात्मने
    । अव्यक्तायादिबीजाय परेशाय नमो नमः ॥ १४॥ लम्बोदराय देवाय दैत्यनाथाय ते नमः । हेरम्बाय महेशानां पालकाय
    नमो नमः ॥ १५॥ कर्मणे कर्मरूपाय नानाकर्मप्रचारिणे । ज्ञानाय ज्ञानदात्रे ते ज्ञानज्ञानाय वै नमः ॥ १६॥
    चराय चररूपाय जङ्गमस्थाय ते नमः । स्थावराय सदा तद्रूपाय तद्रूपधारिणे ॥ १७॥ स्थावरजङ्गमाभ्यां च हीनाय
    ते नमो नमः । योगाय योगनाथाय योगिने योगदायिने ॥ १८॥ योगेभ्यो योगदात्रे ते नमश्चिन्तामणे नमः । शान्ताय
    शान्तचित्तैस्तु प्राप्याय शान्तमूर्तये ॥ १९॥ ब्रह्मणां पतये तुभ्यं ब्रह्मणे सिद्धिबुद्धिद । सिद्धिनाथाय
    बुद्धीश तयोर्योगाय ते नमः ॥ २०॥ मूषकोपरि संस्थाय मूषकध्वजधारिणे । चतुर्भुजाय स्वानन्दपतये ते नमो नमः
    ॥ २१॥ किं स्तौमि त्वां गणाधीश धूम्रवर्णस्वरूपिणम् । अव्यक्तं वेदवादेषु कथितं सततं प्रभो ॥ २२॥ स्वरूपं
    ते कथयितुं वेदा धूम्रायिता बभुः । योगशान्तिधरास्ते कथयितुं ध्रुवमक्षमाः ॥ २३॥ अतस्त्वां धूम्रवर्णाख्यं
    वदन्ते वेदवादिनः । पश्यामि तं धूम्रवर्णमेवाऽहं योगिदुर्लभम् ॥ २४॥ धन्योऽहं सकुलो नाथ त्वदङ्घ्रियुगदर्शनात्
    । एवमुक्त्वा ननर्ताऽसौ भक्तियुक्तो महासुरः ॥ २५॥ निमग्नं तं भक्तिरसे दृष्ट्वा देवो गजाननः । जगाद तं
    महाभागं प्रेमयुक्तं प्रसस्वजे ॥ २६॥
