id: manidweepa-varnana-2-devi-bhagavatham
category: stotram
name:
  english: Manidweepa Varnana - 2 (Devi Bhagavatham)
content:
  english: vyasa uvaca | pushparagamayadagre kunkumarunavigrahah | padmaragamayah salo madhye bhushcaivatadrishi
    || || dashayojanavandairghye gopuradvarasamyutah | tanmanistambhasamyukta mandapah shatasho nripa
    || || madhye bhuvisamasinashcatuhshashtimitah kalah | nanayudhadharavira ratnabhushanabhushitah ||
    || pratyekalokastasam tu tattallokasyanayakah | samantatpadmaragasya parivaryasthitah sada || || svasvalokajanairjushtah
    svasvavahanahetibhih | tasam namani vakshyami shrinu tvam janamejaya || || pingalakshi vishalakshi
    samriddhi vriddhireva ca | shraddha svaha svadhabhikhya maya sanjna vasundhara || || trilokadhatri
    savitri gayatri tridasheshvari | surupa bahurupa ca skandamata'cyutapriya || || vimala camala tadvadaruni
    punararuni | prakritirvikritih srishtih sthitih samhritireva ca || || sandhyamata sati hamsi mardika
    vajrika para | devamata bhagavati devaki kamalasana || || trimukhi saptamukhyanya surasuravimardini
    | lamboshti cordhvakeshi ca bahushirsha vrikodari || || ratharekhahvaya pashcacchashirekha tatha para
    | gaganavega pavanavega caiva tatah param || || agre bhuvanapala syattatpashcanmadanatura | ananganangamathana
    tathaivanangamekhala || || anangakusuma pashcadvishvarupa suradika | kshayankari bhavecchakti rakshobhya
    ca tatah param || || satyavadinyatha prokta bahurupa shucivrata | udarakhya ca vagishi catushshashtimitah
    smritah || || jvalajjihvananah sarvavamantyo vahnimulbanam | jalam pibamah sakalam samharamovibhavasum
    || || pavanam stambhayamodya bhakshayamo'khilam jagat | iti vacam sangirate krodha samraktalocanah
    || || capabanadharah sarvayuddhayaivotsukah sada | damshtra katakataravairbadhirikrita dinmukhah ||
    || pingordhvakeshyah samproktashcapabanakarah sada | shatakshauhinika senapyekaikasyah prakirtita
    || || ekaika shakteh samarthyam lakshabrahmandanashane | shatakshauhinikasena tadrishi nripa sattama
    || || kim na kuryajjagatyasminnashakyam vaktumeva tat | sarvapi yuddhasamagri tasminsale sthita mune
    || || rathanam ganana nasti hayanam karinam tatha || shastranam ganana tadvadgananam ganana tatha
    || || padmaragamayadagre gomedamaninirmitah | dashayojanadairghyena prakaro vartate mahan || || bhasvajjapaprasunabho
    madhyabhustasya tadrishi | gomedakalpitanyeva tadvasi sadanani ca || || pakshinah stambhavaryashca
    vrikshavapyah saramsi ca | gomedakalpita eva kunkumarunavigrahah || || tanmadhyastha mahadevyo dvatrimshacchaktayah
    smritah | nana shastrapraharana gomedamanibhushitah || || pratyeka loka vasinyah parivarya samantatah
    | gomedasale sannaddha pishacavadana nripa || || svarlokavasibhirnityam pujitashcakrabahavah | krodharaktekshana
    bhindhi paca cchindhi daheti ca || || vadanti satatam vacam yuddhotsukahridantarah | ekaikasya mahashakterdashakshauhinika
    mata || || sena tatrapyekashaktirlakshabrahmandanashini | tadrishinam mahasena varnaniya katham nripa
    || || rathanam naiva ganana vahananam tathaiva ca | sarvayuddhasamarambhastatra devya virajate ||
    || tasam namani vakshyami papanashakarani ca | vidya hri pushta yah prajna sinivali kuhustatha ||
    || rudravirya prabhananda poshini riddhida shubha | kalaratrirmaharatrirbhadrakali kapardini || ||
    vikritirdandimundinyau sendukhanda shikhandini | nishumbhashumbhamathini mahishasuramardini || ||
    indrani caiva rudrani shankarardhasharirini | nari narayani caiva trishulinyapi palini || || ambikahladini
    pashcadityevam shaktayah smritah | yadyetah kupita devyastada brahmandanashanam || || parajayo na
    caitasam kadacitkvacidasti hi | gomedakamayadagre sadvajramaninirmitah || || dashayojana tungo'sau
    gopuradvarasamyutah | kapatashrinkhalabaddho navavriksha samujjvalah || || salastanmadhyabhumyadi
    sarvam hiramayam smritam | grihanivithayo rathya mahamargam ganani ca || || vrikshalavala taravah
    saranga api tadrishah | dirghikashrenayovapyastadagah kupa samyutah || || tatra shribhuvaneshvarya
    vasanti paricarikah | ekaika lakshadasibhih sevita madagarvitah || || talavrintadharah kashciccashakadhya
    karambujah | kashcittambulapatrani dharayantyo'tigarvitah || || kashcittacchatradharinyashcamaranam
    vidharikah | nana vastradharah kashcitkashcitpushpa karambujah || || nanadarshakarah kashcitkashcitkunkumalepanam
    | dharayantyah kajjalam ca sindura cashakam parah || || kashciccitraka nirmatryah pada samvahane ratah
    | kashcittu bhushakarinyo nana bhushadharah parah || || pushpabhushana nirmatryah pushpashringarakarikah
    | nana vilasacatura bahvya evam vidhah parah || || nibaddha paridhaniya yuvatyah sakala api | devi
    kripa leshavashattucchikrita jagattrayah || || eta dutyah smrita devyah shringaramadagarvitah | tasam
    namani vakshyami shrinu me nripasattama || || anangarupa prathamapyanangamadana para | tritiyatu tatah
    prokta sundari madanatura || || tato bhuvanavegasyattatha bhuvanapalika | syatsarvashishiranangavedananangamekhala
    || || vidyuddamasamanangyah kvanatkancigunanvitah | rananmanjiracarana bahirantaritastatah || || dhavamanastu
    shobhante sarva vidyullatopamah | kushalah sarvakaryeshu vetrahastah samantatah || || ashtadikshutathaitasam
    prakaradbahireva ca | sadanani virajante nana vahanahetibhih || || vajrasaladagrabhage salo vaiduryanirmitah
    | dashayojanatungo'sau gopuradvarabhushitah || || vaiduryabhumih sarvapigrihani vividhani ca | vithyo
    rathya mahamargah sarve veduryanirmitah || || vapi kupa tadagashca sravantinam tatani ca | valuka
    caiva sarva'pi vaiduryamaninirmita || || tatrashtadikshuparito brahmyadinam ca mandalam | nijairganaih
    parivritam bhrajate nripasattama || || pratibrahmandamatrinam tah samashtaya iritah | brahmi maheshvari
    caiva kaumari vaishnavi tatha || || varahi ca tathendrani camundah saptamatarah | ashtami tu mahalakshmirnamna
    proktastu matarah || || brahmarudradidevanam samakara stutah smritah | jagatkalyanakarinyah svasvasenasamavritah
    || || tatsalasya caturdvarshu vahanani maheshituh | sajjani nripate santi salankarani nityashah ||
    || dantinah kotisho vahah kotishah shibikastatha | hamsah simhashca garuda mayura vrishabhastatha
    || || tairyuktah syandanastadvatkotisho nripanandana | parshnigrahasamayukta dhvajairakashacumbinah
    || || kotishastu vimanani nana cihnanvitani ca | nana vaditrayuktani mahadhvajayutani ca || || vaiduryamani
    salasyapyagre salah parah smritah | dashayojana tungo'savindranilashmanirmitah || || tanmadhya bhustatha
    vithyo mahamarga grihani ca | vapi kupa tadagashca sarve tanmaninirmitah || || tatra padma tu samproktam
    bahuyojana vistritam | shodasharam dipyamanam sudarshanamivaparam || || tatra shodashashaktinam sthanani
    vividhani ca | sarvopaskarayuktani samriddhani vasanti hi || || tasam namani vakshyami shrinu me nripasattama
    | karali vikarali ca tathoma ca sarasvati || || shri durgosha tatha lakshmih shrutishcaiva smritirdhritih
    | shraddha medha matih kantirarya shodashashaktayah || || nilajimutasankashah karavala karambujah
    | samah khetakadharinyo yuddhopakranta manasah || || senanyah sakala etah shridevya jagadishituh |
    pratibrahmandasamsthanam shaktinam nayikah smritah || || brahmandakshobhakarinyo devi shaktyupabrimhitah
    | nana rathasamarudha nana shaktibhiranvitah || || etatparakramam vaktum sahasrasyo'pi na kshamah
    | indranilamahasaladagre tu bahuvistritah || || muktaprakara udito dashayojana dairghyavan | madhyabhuh
    purvavatprokta tanmadhye'shtadalambujam || || muktamaniganakirnam vistritam tu sakesaram | tatra devisamakara
    devyayudhadharah sada || || samprokta ashtamantrinyo jagadvartaprabodhikah | devisamanabhogasta ingitajnastupanditah
    || || kushalah sarvakaryeshu svamikaryaparayanah | devyabhipraya bodhyastashcatura atisundarah ||
    || nana shaktisamayuktah pratibrahmandavartinam | praninam tah samacaram jnanashaktyavidanti ca ||
    || tasam namani vakshyami mattah shrinu nripottama | anangakusuma proktapyanangakusumatura || || anangamadana
    tadvadanangamadanatura | bhuvanapala gaganavega caiva tatah param || || shashirekha ca gaganarekha
    caiva tatah param | pashankushavarabhitidhara arunavigrahah || || vishvasambandhinim vartam bodhayanti
    pratikshanam | muktasaladagrabhage mahamarakato parah || || salottamah samuddishto dashayojana dairghyavan
    | nana saubhagyasamyukto nana bhogasamanvitah || || madhyabhustadrishi prokta sadanani tathaiva ca
    | shatkonamatravistirnam konastha devatah shrinuh || || purvakone caturvaktro gayatri sahito vidhih
    | kundikakshagunabhiti dandayudhadharah parah || || tadayudhadhara devi gayatri paradevata | vedah
    sarve murtimantah shastrani vividhani ca || || smritayashca puranani murtimanti vasanti hi | ye brahmavigrahah
    santi gayatrivigrahashca ye || || vyahritinam vigrahashca te nityam tatra santi hi | rakshah kone
    shankhacakragadambuja karambuja || || savitri vartate tatra mahavishnushca tadrishah | ye vishnuvigrahah
    santi matsyakurmadayokhilah || || savitri vigraha ye ca te sarve tatra santi hi | vayukone parashvakshamalabhayavaranvitah
    || || maharudro vartate'tra sarasvatyapi tadrishi | ye ye tu rudrabhedah syurdakshinasyadayo nripa
    || || gauri bhedashca ye sarve te tatra nivasanti hi | catuhshashtyagama ye ca ye canyepyagamah smritah
    || || te sarve murtimantashca tatra vai nivasanti hi | agnikone ratnakumbham tatha manikarandakam
    || || dadhano nijahastabhyam kubero dhanadayakah | nana vithi samayukto mahalakshmisamanvitah || ||
    devya nidhipatistvaste svagunaih pariveshtitah | varune tu mahakone madano ratisamyutah || || pashankushadhanurbanadharo
    nityam virajate | shringaramurtimantastu tatra sannihitah sada || || ishanakone vighnesho nityam pushtisamanvitah
    | pashankushadharo viro vighnaharta virajate || || vibhutayo ganeshasya yayah santi nripottama | tah
    sarva nivasantyatra mahaishvaryasamanvitah || || pratibrahmandasamsthanam brahmadinam samashtayah
    | ete brahmadayah proktah sevante jagadishvarim || || mahamarakatasyagre shatayojana dairghyavan |
    pravalashalostyaparah kunkumarunavigrahah || || madhyabhustadrishi prokta sadanani ca purvavat | tanmadhye
    pancabhutanam svaminyah panca santi ca || || hrillekha gagana rakta caturthi tu karalika | mahocchushma
    pancami ca pancabhutasamaprabhah || || pashankushavarabhitidharinyomitabhushanah | devi samanaveshadhya
    navayauvanagarvitah || || pravalashaladagre tu navaratna vinirmitah | bahuyojanavistirno mahashalo'sti
    bhumipa || || tatra camnayadevinam sadanani bahunyapi | navaratnamayanyeva tadagashca saramsi ca ||
    || shridevya ye'vatarah syuste tatra nivasanti hi | mahavidya mahabhedah santi tatraiva bhumipa ||
    || nijavaranadevibhirnijabhushanavahanaih | sarvadevyo virajante kotisuryasamaprabhah || || saptakoti
    mahamantradevatah santi tatra hi | navaratnamayadagre cintamanigriham mahat || || tatra tyam vastu
    matram tu cintamani vinirmitam | suryodgaropalaistadvaccandrodgaropalaistatha || || vidyutprabhopalaih
    stambhah kalpitastu sahasrashah | yesham prabhabhirantastham vastu kincinna drishyate || || iti shridevibhagavate
    mahapurane dvadashaskandhe ekadasho'dhyayah |
  devanagari: व्यास उवाच । पुष्परागमयादग्रे कुङ्कुमारुणविग्रहः । पद्मरागमयः सालो मध्ये भूश्चैवतादृशी ॥
    ॥ दशयोजनवान्दैर्घ्ये गोपुरद्वारसंयुतः । तन्मणिस्तम्भसंयुक्ता मण्डपाः शतशो नृप ॥ ॥ मध्ये भुविसमासीनाश्चतुःषष्टिमिताः
    कलाः । नानायुधधरावीरा रत्नभूषणभूषिताः ॥ ॥ प्रत्येकलोकस्तासां तु तत्तल्लोकस्यनायकाः । समन्तात्पद्मरागस्य
    परिवार्यस्थिताः सदा ॥ ॥ स्वस्वलोकजनैर्जुष्टाः स्वस्ववाहनहेतिभिः । तासां नामानि वक्ष्यामि शृणु त्वं
    जनमेजय ॥ ॥ पिङ्गलाक्षी विशालाक्षी समृद्धि वृद्धिरेव च । श्रद्धा स्वाहा स्वधाभिख्या माया सञ्ज्ञा वसुन्धरा
    ॥ ॥ त्रिलोकधात्री सावित्री गायत्री त्रिदशेश्वरी । सुरूपा बहुरूपा च स्कन्दमाताऽच्युतप्रिया ॥ ॥ विमला
    चामला तद्वदरुणी पुनरारुणी । प्रकृतिर्विकृतिः सृष्टिः स्थितिः संहृतिरेव च ॥ ॥ सन्ध्यामाता सती हंसी
    मर्दिका वज्रिका परा । देवमाता भगवती देवकी कमलासना ॥ ॥ त्रिमुखी सप्तमुख्यन्या सुरासुरविमर्दिनी । लम्बोष्टी
    चोर्ध्वकेशी च बहुशीर्षा वृकोदरी ॥ ॥ रथरेखाह्वया पश्चाच्छशिरेखा तथा परा । गगनवेगा पवनवेगा चैव ततः परम्
    ॥ ॥ अग्रे भुवनपाला स्यात्तत्पश्चान्मदनातुरा । अनङ्गानङ्गमथना तथैवानङ्गमेखला ॥ ॥ अनङ्गकुसुमा पश्चाद्विश्वरूपा
    सुरादिका । क्षयङ्करी भवेच्छक्ति रक्षोभ्या च ततः परम् ॥ ॥ सत्यवादिन्यथ प्रोक्ता बहुरूपा शुचिव्रता ।
    उदाराख्या च वागीशी चतुष्षष्टिमिताः स्मृताः ॥ ॥ ज्वलज्जिह्वाननाः सर्वावमन्त्यो वह्निमुल्बणम् । जलं
    पिबामः सकलं संहरामोविभावसुम् ॥ ॥ पवनं स्तम्भयामोद्य भक्षयामोऽखिलं जगत् । इति वाचं सङ्गिरते क्रोध संरक्तलोचनाः
    ॥ ॥ चापबाणधराः सर्वायुद्धायैवोत्सुकाः सदा । दंष्ट्रा कटकटारावैर्बधिरीकृत दिङ्मुखाः ॥ ॥ पिङ्गोर्ध्वकेश्यः
    सम्प्रोक्ताश्चापबाणकराः सदा । शताक्षौहिणिका सेनाप्येकैकस्याः प्रकीर्तिता ॥ ॥ एकैक शक्तेः सामर्थ्यं
    लक्षब्रह्माण्डनाशने । शताक्षौहिणिकासेना तादृशी नृप सत्तम ॥ ॥ किं न कुर्याज्जगत्यस्मिन्नशक्यं वक्तुमेव
    तत् । सर्वापि युद्धसामग्री तस्मिन्साले स्थिता मुने ॥ ॥ रथानां गणना नास्ति हयानां करिणां तथा ॥ शस्त्राणां
    गणना तद्वद्गणानां गणना तथा ॥ ॥ पद्मरागमयादग्रे गोमेदमणिनिर्मितः । दशयोजनदैर्घ्येण प्राकारो वर्तते
    महान् ॥ ॥ भास्वज्जपाप्रसूनाभो मध्यभूस्तस्य तादृशी । गोमेदकल्पितान्येव तद्वासि सदनानि च ॥ ॥ पक्षिणः
    स्तम्भवर्याश्च वृक्षावाप्यः सरांसि च । गोमेदकल्पिता एव कुङ्कुमारुणविग्रहाः ॥ ॥ तन्मध्यस्था महादेव्यो
    द्वात्रिंशच्छक्तयः स्मृताः । नाना शस्त्रप्रहरणा गोमेदमणिभूषिताः ॥ ॥ प्रत्येक लोक वासिन्यः परिवार्य
    समन्ततः । गोमेदसाले सन्नद्धा पिशाचवदना नृप ॥ ॥ स्वर्लोकवासिभिर्नित्यं पूजिताश्चक्रबाहवः । क्रोधरक्तेक्षणा
    भिन्धि पच च्छिन्धि दहेति च ॥ ॥ वदन्ति सततं वाचं युद्धोत्सुकहृदन्तराः । एकैकस्या महाशक्तेर्दशाक्षौहिणिका
    मता ॥ ॥ सेना तत्राप्येकशक्तिर्लक्षब्रह्माण्डनाशिनी । तादृशीनां महासेना वर्णनीया कथं नृप ॥ ॥ रथानां
    नैव गणाना वाहनानां तथैव च । सर्वयुद्धसमारम्भस्तत्र देव्या विराजते ॥ ॥ तासां नामानि वक्ष्यामि पापनाशकराणि
    च । विद्या ह्री पुष्ट यः प्रज्ञा सिनीवाली कुहूस्तथा ॥ ॥ रुद्रावीर्या प्रभानन्दा पोषिणी ऋद्धिदा शुभा
    । कालरात्रिर्महारात्रिर्भद्रकाली कपर्दिनी ॥ ॥ विकृतिर्दण्डिमुण्डिन्यौ सेन्दुखण्डा शिखण्डिनी । निशुम्भशुम्भमथिनी
    महिषासुरमर्दिनी ॥ ॥ इन्द्राणी चैव रुद्राणी शङ्करार्धशरीरिणी । नारी नारायणी चैव त्रिशूलिन्यपि पालिनी
    ॥ ॥ अम्बिकाह्लादिनी पश्चादित्येवं शक्तयः स्मृताः । यद्येताः कुपिता देव्यस्तदा ब्रह्माण्डनाशनम् ॥ ॥
    पराजयो न चैतासां कदाचित्क्वचिदस्ति हि । गोमेदकमयादग्रे सद्वज्रमणिनिर्मितः ॥ ॥ दशयोजन तुङ्गोऽसौ गोपुरद्वारसंयुतः
    । कपाटशृङ्खलाबद्धो नववृक्ष समुज्ज्वलः ॥ ॥ सालस्तन्मध्यभूम्यादि सर्वं हीरमयं स्मृतम् । गृहाणिवीथयो
    रथ्या महामार्गां गणानि च ॥ ॥ वृक्षालवाल तरवः सारङ्गा अपि तादृशाः । दीर्घिकाश्रेणयोवाप्यस्तडागाः कूप
    संयुताः ॥ ॥ तत्र श्रीभुवनेश्वर्या वसन्ति परिचारिकाः । एकैका लक्षदासीभिः सेविता मदगर्विताः ॥ ॥ तालवृन्तधराः
    काश्चिच्चषकाढ्य कराम्बुजाः । काश्चित्ताम्बूलपात्राणि धारयन्त्योऽतिगर्विताः ॥ ॥ काश्चित्तच्छत्रधारिण्यश्चामराणां
    विधारिकाः । नाना वस्त्रधराः काश्चित्काश्चित्पुष्प कराम्बुजाः ॥ ॥ नानादर्शकराः काश्चित्काश्चित्कुङ्कुमलेपनम्
    । धारयन्त्यः कज्जलं च सिन्दूर चषकं पराः ॥ ॥ काश्चिच्चित्रक निर्मात्र्यः पाद संवाहने रताः । काश्चित्तु
    भूषाकारिण्यो नाना भूषाधराः पराः ॥ ॥ पुष्पभूषण निर्मात्र्यः पुष्पशृङ्गारकारिकाः । नाना विलासचतुरा बह्व्य
    एवं विधाः पराः ॥ ॥ निबद्ध परिधानीया युवत्यः सकला अपि । देवी कृपा लेशवशात्तुच्छीकृत जगत्त्रयाः ॥ ॥
    एता दूत्यः स्मृता देव्यः शृङ्गारमदगर्विताः । तासां नामानि वक्ष्यामि शृणु मे नृपसत्तम ॥ ॥ अनङ्गरूपा
    प्रथमाप्यनङ्गमदना परा । तृतीयातु ततः प्रोक्ता सुन्दरी मदनातुरा ॥ ॥ ततो भुवनवेगास्यात्तथा भुवनपालिका
    । स्यात्सर्वशिशिरानङ्गवेदनानङ्गमेखला ॥ ॥ विद्युद्दामसमानाङ्ग्यः क्वणत्काञ्चीगुणान्विताः । रणन्मञ्जीरचरणा
    बहिरन्तरितस्ततः ॥ ॥ धावमानास्तु शोभन्ते सर्वा विद्युल्लतोपमाः । कुशलाः सर्वकार्येषु वेत्रहस्ताः समन्ततः
    ॥ ॥ अष्टदिक्षुतथैतासां प्राकाराद्बहिरेव च । सदनानि विराजन्ते नाना वाहनहेतिभिः ॥ ॥ वज्रसालादग्रभागे
    सालो वैदूर्यनिर्मितः । दशयोजनतुङ्गोऽसौ गोपुरद्वारभूषितः ॥ ॥ वैदूर्यभूमिः सर्वापिगृहाणि विविधानि च
    । वीथ्यो रथ्या महामार्गाः सर्वे वेदूर्यनिर्मिताः ॥ ॥ वापी कूप तडागाश्च स्रवन्तीनां तटानि च । वालुका
    चैव सर्वाऽपि वैदूर्यमणिनिर्मिता ॥ ॥ तत्राष्टदिक्षुपरितो ब्राह्म्यादीनां च मण्डलम् । निजैर्गणैः परिवृतं
    भ्राजते नृपसत्तम ॥ ॥ प्रतिब्रह्माण्डमातृणां ताः समष्टय ईरिताः । ब्राह्मी माहेश्वरी चैव कौमारी वैष्णवी
    तथा ॥ ॥ वाराही च तथेन्द्राणी चामुण्डाः सप्तमातरः । अष्टमी तु महालक्ष्मीर्नाम्ना प्रोक्तास्तु मातरः
    ॥ ॥ ब्रह्मरुद्रादिदेवानां समाकारा स्तुताः स्मृताः । जगत्कल्याणकारिण्यः स्वस्वसेनासमावृताः ॥ ॥ तत्सालस्य
    चतुर्द्वार्षु वाहनानि महेशितुः । सज्जानि नृपते सन्ति सालङ्काराणि नित्यशः ॥ ॥ दन्तिनः कोटिशो वाहाः
    कोटिशः शिबिकास्तथा । हंसाः सिंहाश्च गरुडा मयूरा वृषभास्तथा ॥ ॥ तैर्युक्ताः स्यन्दनास्तद्वत्कोटिशो
    नृपनन्दन । पार्ष्णिग्राहसमायुक्ता ध्वजैराकाशचुम्बिनः ॥ ॥ कोटिशस्तु विमानानि नाना चिह्नान्वितानि च
    । नाना वादित्रयुक्तानि महाध्वजयुतानि च ॥ ॥ वैदूर्यमणि सालस्याप्यग्रे सालः परः स्मृतः । दशयोजन तुङ्गोऽसाविन्द्रनीलाश्मनिर्मितः
    ॥ ॥ तन्मध्य भूस्तथा वीथ्यो महामार्गा गृहाणि च । वापी कूप तडागाश्च सर्वे तन्मणिनिर्मिताः ॥ ॥ तत्र पद्म
    तु सम्प्रोक्तं बहुयोजन विस्तृतम् । षोडशारं दीप्यमानं सुदर्शनमिवापरम् ॥ ॥ तत्र षोडशशक्तीनां स्थानानि
    विविधानि च । सर्वोपस्करयुक्तानि समृद्धानि वसन्ति हि ॥ ॥ तासां नामानि वक्ष्यामि शृणु मे नृपसत्तम ।
    कराली विकराली च तथोमा च सरस्वती ॥ ॥ श्री दुर्गोषा तथा लक्ष्मीः श्रुतिश्चैव स्मृतिर्धृतिः । श्रद्धा
    मेधा मतिः कान्तिरार्या षोडशशक्तयः ॥ ॥ नीलजीमूतसङ्काशाः करवाल कराम्बुजाः । समाः खेटकधारिण्यो युद्धोपक्रान्त
    मानसाः ॥ ॥ सेनान्यः सकला एताः श्रीदेव्या जगदीशितुः । प्रतिब्रह्माण्डसंस्थानां शक्तीनां नायिकाः स्मृताः
    ॥ ॥ ब्रह्माण्डक्षोभकारिण्यो देवी शक्त्युपबृंहिताः । नाना रथसमारूढा नाना शक्तिभिरन्विताः ॥ ॥ एतत्पराक्रमं
    वक्तुं सहस्रास्योऽपि न क्षमः । इन्द्रनीलमहासालादग्रे तु बहुविस्तृतः ॥ ॥ मुक्ताप्राकार उदितो दशयोजन
    दैर्घ्यवान् । मध्यभूः पूर्ववत्प्रोक्ता तन्मध्येऽष्टदलाम्बुजम् ॥ ॥ मुक्तामणिगणाकीर्णं विस्तृतं तु सकेसरम्
    । तत्र देवीसमाकारा देव्यायुधधराः सदा ॥ ॥ सम्प्रोक्ता अष्टमन्त्रिण्यो जगद्वार्ताप्रबोधिकाः । देवीसमानभोगास्ता
    इङ्गितज्ञास्तुपण्डिताः ॥ ॥ कुशलाः सर्वकार्येषु स्वामिकार्यपरायणाः । देव्यभिप्राय बोध्यस्ताश्चतुरा
    अतिसुन्दराः ॥ ॥ नाना शक्तिसमायुक्ताः प्रतिब्रह्माण्डवर्तिनाम् । प्राणिनां ताः समाचारं ज्ञानशक्त्याविदन्ति
    च ॥ ॥ तासां नामानि वक्ष्यामि मत्तः शृणु नृपोत्तम । अनङ्गकुसुमा प्रोक्ताप्यनङ्गकुसुमातुरा ॥ ॥ अनङ्गमदना
    तद्वदनङ्गमदनातुरा । भुवनपाला गगनवेगा चैव ततः परम् ॥ ॥ शशिरेखा च गगनरेखा चैव ततः परम् । पाशाङ्कुशवराभीतिधरा
    अरुणविग्रहाः ॥ ॥ विश्वसम्बन्धिनीं वार्तां बोधयन्ति प्रतिक्षणम् । मुक्तासालादग्रभागे महामारकतो परः
    ॥ ॥ सालोत्तमः समुद्दिष्टो दशयोजन दैर्घ्यवान् । नाना सौभाग्यसंयुक्तो नाना भोगसमन्वितः ॥ ॥ मध्यभूस्तादृशी
    प्रोक्ता सदनानि तथैव च । षट्कोणमत्रविस्तीर्णं कोणस्था देवताः शृणुः ॥ ॥ पूर्वकोणे चतुर्वक्त्रो गायत्री
    सहितो विधिः । कुण्डिकाक्षगुणाभीति दण्डायुधधरः परः ॥ ॥ तदायुधधरा देवी गायत्री परदेवता । वेदाः सर्वे
    मूर्तिमन्तः शास्त्राणि विविधानि च ॥ ॥ स्मृतयश्च पुराणानि मूर्तिमन्ति वसन्ति हि । ये ब्रह्मविग्रहाः
    सन्ति गायत्रीविग्रहाश्च ये ॥ ॥ व्याहृतीनां विग्रहाश्च ते नित्यं तत्र सन्ति हि । रक्षः कोणे शङ्खचक्रगदाम्बुज
    कराम्बुजा ॥ ॥ सावित्री वर्तते तत्र महाविष्णुश्च तादृशः । ये विष्णुविग्रहाः सन्ति मत्स्यकूर्मादयोखिलाः
    ॥ ॥ सावित्री विग्रहा ये च ते सर्वे तत्र सन्ति हि । वायुकोणे परश्वक्षमालाभयवरान्वितः ॥ ॥ महारुद्रो
    वर्ततेऽत्र सरस्वत्यपि तादृशी । ये ये तु रुद्रभेदाः स्युर्दक्षिणास्यादयो नृप ॥ ॥ गौरी भेदाश्च ये सर्वे
    ते तत्र निवसन्ति हि । चतुःषष्ट्यागमा ये च ये चान्येप्यागमाः स्मृताः ॥ ॥ ते सर्वे मूर्तिमन्तश्च तत्र
    वै निवसन्ति हि । अग्निकोणे रत्नकुम्भं तथा मणिकरण्डकम् ॥ ॥ दधानो निजहस्ताभ्यां कुबेरो धनदायकः । नाना
    वीथी समायुक्तो महालक्ष्मीसमन्वितः ॥ ॥ देव्या निधिपतिस्त्वास्ते स्वगुणैः परिवेष्टितः । वारुणे तु महाकोणे
    मदनो रतिसंयुतः ॥ ॥ पाशाङ्कुशधनुर्बाणधरो नित्यं विराजते । शृङ्गारमूर्तिमन्तस्तु तत्र सन्निहिताः सदा
    ॥ ॥ ईशानकोणे विघ्नेशो नित्यं पुष्टिसमन्वितः । पाशाङ्कुशधरो वीरो विघ्नहर्ता विराजते ॥ ॥ विभूतयो गणेशस्य
    यायाः सन्ति नृपोत्तम । ताः सर्वा निवसन्त्यत्र महैश्वर्यसमन्विताः ॥ ॥ प्रतिब्रह्माण्डसंस्थानां ब्रह्मादीनां
    समष्टयः । एते ब्रह्मादयः प्रोक्ताः सेवन्ते जगदीश्वरीम् ॥ ॥ महामारकतस्याग्रे शतयोजन दैर्घ्यवान् । प्रवालशालोस्त्यपरः
    कुङ्कुमारुणविग्रहः ॥ ॥ मध्यभूस्तादृशी प्रोक्ता सदनानि च पूर्ववत् । तन्मध्ये पञ्चभूतानां स्वामिन्यः
    पञ्च सन्ति च ॥ ॥ हृल्लेखा गगना रक्ता चतुर्थी तु करालिका । महोच्छुष्मा पञ्चमी च पञ्चभूतसमप्रभाः ॥ ॥
    पाशाङ्कुशवराभीतिधारिण्योमितभूषणाः । देवी समानवेषाढ्या नवयौवनगर्विताः ॥ ॥ प्रवालशालादग्रे तु नवरत्न
    विनिर्मितः । बहुयोजनविस्तीर्णो महाशालोऽस्ति भूमिप ॥ ॥ तत्र चाम्नायदेवीनां सदनानि बहून्यपि । नवरत्नमयान्येव
    तडागाश्च सरांसि च ॥ ॥ श्रीदेव्या येऽवताराः स्युस्ते तत्र निवसन्ति हि । महाविद्या महाभेदाः सन्ति तत्रैव
    भूमिप ॥ ॥ निजावरणदेवीभिर्निजभूषणवाहनैः । सर्वदेव्यो विराजन्ते कोटिसूर्यसमप्रभाः ॥ ॥ सप्तकोटि महामन्त्रदेवताः
    सन्ति तत्र हि । नवरत्नमयादग्रे चिन्तामणिगृहं महत् ॥ ॥ तत्र त्यं वस्तु मात्रं तु चिन्तामणि विनिर्मितम्
    । सूर्योद्गारोपलैस्तद्वच्चन्द्रोद्गारोपलैस्तथा ॥ ॥ विद्युत्प्रभोपलैः स्तम्भाः कल्पितास्तु सहस्रशः
    । येषां प्रभाभिरन्तस्थं वस्तु किञ्चिन्न दृश्यते ॥ ॥ इति श्रीदेवीभागवते महापुराणे द्वादशस्कन्धे एकादशोऽध्यायः
    ।
