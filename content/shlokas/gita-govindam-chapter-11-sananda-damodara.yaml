id: gita-govindam-chapter-11-sananda-damodara
category: stotram
name:
  english: Gita Govindam Chapter 11 - Sananda Damodara
content:
  english: '|| ekadashah sargah || || sanandadamodarah || suciramanunayane prinayitva mrigakshim gatavati
    kritaveshe keshave kunjashayyam | racitarucirabhusham drishtimoshe pradoshe sphurati niravasadam kapi
    radham jagada || || viracitacatuvacanaracanam carane racitapranipatam | samprati manjulavanjulasimani
    kelishayanamanuyatam || mugdhe madhumathanamanugatamanusara radhike || || ghanajaghanastanabharabhare
    daramantharacaranaviharam | mukharitamanimanjiramupaihi vidhehi maralavikaram || || shrinu ramaniyataram
    tarunijanamohanamadhupaviravam | kusumasharasanashasanabandini pikanikare bhaja bhavam || || anilataralakisalayanikarena
    karena latanikurambam | preranamiva karabhoru karoti gatim pratimunca vilambam || || sphuritamanangatarangavashadiva
    sucitahariparirambham | priccha manoharaharavimalajaladharamamum kucakumbham || || adhigatamakhilasakhibhiridam
    tava vapurapi ratiranasajjam | candi rasitarashanaravadindimamabhisara sarasamalajjam || || smarasharasubhaganakhena
    karena sakhimavalambya salilam | cala valayakvanitairavabodhaya haramapi nijagatishilam || || shrijayadevabhanitamadharikritaharamudasitavamam
    | harivinihitamanasamadhitishthatu kanthatatimaviramam || || sa mam drakshyati vakshyati smarakatham
    pratyangamalinganaih pritim yasyati ramyate sakhi samagatyeti cintakulah | sa tvam pashyati vepate
    pulakayatyanandati svidyati pratyudgacchati murcchati sthiratamahpunje nikunje priyah || || akshnornikshipadanjanam
    shravanayostapicchagucchavalim murdhni shyamasarojadama kucayoh kasturikapatrakam | dhurtanamabhisarasatvarahridam
    vishvannikunje sakhi dhvantam nilanicolacaru sadrisham pratyangamalingati || || kashmiragauravapushamabhisarikanam
    abaddharekhamabhito rucimanjaribhih | etattamaladalanilatamam tamishram tatpremahemanikashopalatam
    tanoti || || haravalitaralakancanakancidama keyurakankanamanidyutidipitasya | dvare nikunjanilayasyaharim
    nirikshya vridavatimatha sakhi nijagaha radham || || manjutarakunjatalakelisadane | vilasa ratirabhasahasitavadane
    || pravisha radhe madhavasamipamiha || || navabhavadashokadalashayanasare | vilasa kucakalashataralahare
    || || kusumacayaracitashucivasagehe | vilasa kusumasukumaradehe || || calamalayavanapavanasurabhishite
    | vilasa rasavalitalalitagite || || madhumuditamadhupakulakalitarave | vilasa madanarasasarasabhave
    || || madhutaralapikanikaraninadamukhare | vilasa dashanarucirucirashikhare || || vitata bahuvallinavapallavaghane
    | vilasa ciramalasapinajaghane || || vihitapadmavatisukhasamaje | bhanati jayadevakaviraje || || tvam
    cittena ciram vahannayamatishranto bhrisham tapitah kandarpena tu patumicchati sudhasambadhabimbadharam
    | asyangam tadalankuru kshanamiha bhrukshepalakshmilava krite dasa ivopasevitapadambhoje kutah sambhramah
    || || sa sasadhvasasanandam govinde lolalocana | sinjanamanjumanjiram pravivesha niveshanam || ||
    radhavadanavilokanavikasitavividhavikaravibhangam | jalanidhimiva vidhumandaladarshanataralitatungatarangam
    || harimekarasam ciramabhilashitavilasam sa dadarsha guruharshavashamvadavadanamananganivasam || ||
    haramamalatarataramurasi dadhatam parirabhya viduram | sphutataraphenakadambakarambitamiva yamunajalapuram
    || || shyamalamridulakalevaramandalamadhigatagauradukulam | nilanalinamiva pitaparagapatalabharavalayitamulam
    || || taraladrigancalacalanamanoharavadanajanitaratiragam | sphutakamalodarakhelitakhanjanayugamiva
    sharadi tadagam || || vadanakamalaparishilanamilitamihirasamakundalashobham | smitarucirucirasamullasitadharapallavakritaratilobham
    || || shashikiranacchuritodarajaladharasundarasakusumakesham | timiroditavidhumandalanirmalamalayajatilakanivesham
    || || vipulapulakabharadanturitam ratikelikalabhiradhiram | maniganakiranasamuhasamujjvalabhushanasubhagashariram
    || || shrijayadevabhanitavibhavadvigunikritabhushanabharam | pranamata hridi suciram vinidhaya harim
    sukritodayasaram || || atikramyapangam shravanapathaparyantagamana prayasenevakshnostaralatarataram
    patitayoh | idanim radhayah priyatamasamalokasamaye papata svedambuprasara iva harshashrunikarah ||
    || bhavantyastalpantam kritakapatakandutipihita smitam yate gehadbahiravahitaliparijane | priyasyam
    pashyantyah smarasharasamakulasubhagam salajja lajjapi vyagamadiva duram mrigadrishah || || || iti
    shrigitagovinde radhikamilane sanandadamodaro namaikadashah sargah ||'
  devanagari: ॥ एकादशः सर्गः ॥ ॥ सानन्ददामोदरः ॥ सुचिरमनुनयने प्रीणयित्वा मृगाक्षीं गतवति कृतवेशे केशवे
    कुञ्जशय्याम् । रचितरुचिरभूषां दृष्टिमोषे प्रदोषे स्फुरति निरवसादां कापि राधां जगाद ॥ ॥ विरचितचाटुवचनरचनं
    चरणे रचितप्रणिपातम् । सम्प्रति मञ्जुलवञ्जुलसीमनि केलिशयनमनुयातम् ॥ मुग्धे मधुमथनमनुगतमनुसर राधिके
    ॥ ॥ घनजघनस्तनभारभरे दरमन्थरचरणविहारम् । मुखरितमणीमञ्जीरमुपैहि विधेहि मरालविकारम् ॥ ॥ शृणु रमणीयतरं
    तरुणीजनमोहनमधुपविरावम् । कुसुमशरासनशासनबन्दिनि पिकनिकरे भज भावम् ॥ ॥ अनिलतरलकिसलयनिकरेण करेण लतानिकुरम्बम्
    । प्रेरणमिव करभोरु करोति गतिं प्रतिमुञ्च विलम्बम् ॥ ॥ स्फुरितमनङ्गतरङ्गवशादिव सूचितहरिपरिरम्भम् ।
    पृच्छ मनोहरहारविमलजलधारममुं कुचकुम्भम् ॥ ॥ अधिगतमखिलसखीभिरिदं तव वपुरपि रतिरणसज्जम् । चण्डि रसितरशनारवडिण्डिममभिसर
    सरसमलज्जम् ॥ ॥ स्मरशरसुभगनखेन करेण सखीमवलम्ब्य सलीलम् । चल वलयक्वणीतैरवबोधय हरमपि निजगतिशीलम् ॥ ॥
    श्रीजयदेवभणितमधरीकृतहारमुदासितवामम् । हरिविनिहितमनसामधितिष्ठतु कण्ठतटीमविरामम् ॥ ॥ सा मां द्रक्ष्यति
    वक्ष्यति स्मरकथां प्रत्यङ्गमालिङ्गनैः प्रीतिं यास्यति रम्यते सखि समागत्येति चिन्ताकुलः । स त्वां पश्यति
    वेपते पुलकयत्यानन्दति स्विद्यति प्रत्युद्गच्छति मूर्च्छति स्थिरतमःपुञ्जे निकुञ्जे प्रियः ॥ ॥ अक्ष्णोर्निक्षिपदञ्जनं
    श्रवणयोस्तापिच्छगुच्छावलीं मूर्ध्नि श्यामसरोजदाम कुचयोः कस्तूरिकापात्रकम् । धूर्तानामभिसारसत्वरहृदां
    विष्वङ्निकुञ्जे सखि ध्वान्तं नीलनिचोलचारु सदृशां प्रत्यङ्गमालिङ्गति ॥ ॥ काश्मीरगौरवपुषामभिसारिकाणां
    आबद्धरेखमभितो रुचिमञ्जरीभिः । एतत्तमालदलनीलतमं तमिश्रं तत्प्रेमहेमनिकषोपलतां तनोति ॥ ॥ हारावलीतरलकाञ्चनकाञ्चिदाम
    केयूरकङ्कणमणिद्युतिदीपितस्य । द्वारे निकुञ्जनिलयस्यहरिं निरीक्ष्य व्रीडावतीमथ सखी निजगाह राधाम् ॥
    ॥ मञ्जुतरकुञ्जतलकेलिसदने । विलस रतिरभसहसितवदने ॥ प्रविश राधे माधवसमीपमिह ॥ ॥ नवभवदशोकदलशयनसारे । विलस
    कुचकलशतरलहारे ॥ ॥ कुसुमचयरचितशुचिवासगेहे । विलस कुसुमसुकुमारदेहे ॥ ॥ चलमलयवनपवनसुरभिशीते । विलस रसवलितललितगीते
    ॥ ॥ मधुमुदितमधुपकुलकलितरावे । विलस मदनरससरसभावे ॥ ॥ मधुतरलपिकनिकरनिनदमुखरे । विलस दशनरुचिरुचिरशिखरे
    ॥ ॥ वितत बहुवल्लिनवपल्लवघने । विलस चिरमलसपीनजघने ॥ ॥ विहितपद्मावतीसुखसमाजे । भणति जयदेवकविराजे ॥ ॥
    त्वां चित्तेन चिरं वहन्नयमतिश्रान्तो भृशं तापितः कन्दर्पेण तु पातुमिच्छति सुधासम्बाधबिम्बाधरम् । अस्याङ्गं
    तदलङ्कुरु क्षणमिह भ्रूक्षेपलक्ष्मीलव क्रीते दास इवोपसेवितपदाम्भोजे कुतः सम्भ्रमः ॥ ॥ सा ससाध्वससानन्दं
    गोविन्दे लोललोचना । सिञ्जानमञ्जुमञ्जीरं प्रविवेश निवेशनम् ॥ ॥ राधावदनविलोकनविकसितविविधविकारविभङ्गम्
    । जलनिधिमिव विधुमण्डलदर्शनतरलिततुङ्गतरङ्गम् ॥ हरिमेकरसं चिरमभिलषितविलासं सा ददार्श गुरुहर्षवशंवदवदनमनङ्गनिवासम्
    ॥ ॥ हारममलतरतारमुरसि दधतं परिरभ्य विदूरम् । स्फुटतरफेनकदम्बकरम्बितमिव यमुनाजलपूरम् ॥ ॥ श्यामलमृदुलकलेवरमण्डलमधिगतगौरदुकूलम्
    । नीलनलिनमिव पीतपरागपतलभरवलयितमूलम् ॥ ॥ तरलदृगञ्चलचलनमनोहरवदनजनितरतिरागम् । स्फुटकमलोदरखेलितखञ्जनयुगमिव
    शरदि तडागम् ॥ ॥ वदनकमलपरिशीलनमिलितमिहिरसमकुण्डलशोभम् । स्मितरुचिरुचिरसमुल्लसिताधरपल्लवकृतरतिलोभम्
    ॥ ॥ शशिकिरणच्छुरितोदरजलधरसुन्दरसकुसुमकेशम् । तिमिरोदितविधुमण्दलनिर्मलमलयजतिलकनिवेशम् ॥ ॥ विपुलपुलकभरदन्तुरितं
    रतिकेलिकलाभिरधीरम् । मणिगणकिरणसमूहसमुज्ज्वलभूषणसुभगशरीरम् ॥ ॥ श्रीजयदेवभणितविभवद्विगुणीकृतभूषणभारम्
    । प्रणमत हृदि सुचिरं विनिधाय हरिं सुकृतोदयसारम् ॥ ॥ अतिक्रम्यापाङ्गं श्रवणपथपर्यन्तगमन प्रयासेनेवाक्ष्णोस्तरलतरतारं
    पतितयोः । इदानीं राधायाः प्रियतमसमालोकसमये पपात स्वेदाम्बुप्रसर इव हर्षाश्रुनिकरः ॥ ॥ भवन्त्यास्तल्पान्तं
    कृतकपटकण्डूतिपिहित स्मितं याते गेहाद्बहिरवहितालीपरिजने । प्रियास्यं पश्यन्त्याः स्मरशरसमाकूलसुभगं
    सलज्जा लज्जापि व्यगमदिव दूरं मृगदृशः ॥ ॥ ॥ इति श्रीगीतगोविन्दे राधिकामिलने सानन्ददामोदरो नामैकादशः
    सर्गः ॥
