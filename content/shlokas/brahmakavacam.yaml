id: brahmakavacam
category: kavacha
name:
  english: brahmakavacam
  devanagari: ब्रह्मकवचम्
content:
  english: rinu carvangi jaganmangalanamakam | pathanaddharanadyasya brahmajno jayate dhruvam || 1|| paramatma
    shirah patu hridayam parameshvarah | kantham patu jagattrata vadanam sarvadrigvibhuh || 2|| karau
    me patu vishvatma padau rakshatu cinmayah | sarvangam sarvada patu parabrahma sanatanam || 3|| shrijaganmangalasyasya
    kavacasya sadashivah | rishishchando'nushtubiti parabrahma ca devata || 4|| caturvargaphalavaptyai
    viniyogah prakirtitah | yah pathedbrahmakavacam rishinyasapurahsaram || 5|| sa brahmajnanamasadya
    sakshadbrahmamayo bhavet | bhurje vilikhya gutikam svarnastham dharayedyadi || 6|| kanthe va dakshine
    bahau sarvasiddhishvaro bhavet | ityetat paramam brahmakavacam te prakashitam || 7|| dadyat priyaya
    shishyaya gurubhaktaya dhimate | pathitva stotrakavacam pranametsadhakagranih || 8|| om namaste paramam
    brahma namaste paramatmane | nirgunaya namastubhyam sadrupaya namo namah || 9|| om shribrahmane namah
    | om shribrahmane namah | om shribrahmane namah | || iti shribrahmakavacam sampurnam || || shubhamastu
    ||
  devanagari: ृणु चार्वङ्गि जगन्मङ्गलनामकम् । पठनाद्धारणाद्यस्य ब्रह्मज्ञो जायते ध्रुवम् ॥ १॥ परमात्मा
    शिरः पातु हृदयं परमेश्वरः । कण्ठं पातु जगत्त्राता वदनं सर्वदृग्विभुः ॥ २॥ करौ मे पातु विश्वात्मा पादौ
    रक्षतु चिन्मयः । सर्वाङ्गं सर्वदा पातु परब्रह्म सनातनम् ॥ ३॥ श्रीजगन्मङ्गलस्यास्य कवचस्य सदाशिवः ।
    ऋषिश्छन्दोऽनुष्टुबिति परब्रह्म च देवता ॥ ४॥ चतुर्वर्गफलावाप्त्यै विनियोगः प्रकीर्तितः । यः पठेद्ब्रह्मकवचं
    ऋषिन्यासपुरःसरम् ॥ ५॥ स ब्रह्मज्ञानमासाद्य साक्षाद्ब्रह्ममयो भवेत् । भूर्जे विलिख्य गुटिकां स्वर्णस्थां
    धारायेद्यदि ॥ ६॥ कण्ठे वा दक्षिणे बाहौ सर्वसिद्धीश्वरो भवेत् । इत्येतत् परमं ब्रह्मकवचं ते प्रकाशितम्
    ॥ ७॥ दद्यात् प्रियाय शिष्याय गुरुभक्ताय धीमते । पठित्वा स्तोत्रकवचं प्रणमेत्साधकाग्रणीः ॥ ८॥ ॐ नमस्ते
    परमं ब्रह्म नमस्ते परमात्मने । निर्गुणाय नमस्तुभ्यं सद्रूपाय नमो नमः ॥ ९॥ ॐ श्रीब्रह्मणे नमः । ॐ श्रीब्रह्मणे
    नमः । ॐ श्रीब्रह्मणे नमः । ॥ इति श्रीब्रह्मकवचं सम्पूर्णम् ॥ ॥ शुभमस्तु ॥
