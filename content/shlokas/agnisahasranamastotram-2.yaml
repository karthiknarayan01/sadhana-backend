id: agnisahasranamastotram-2
category: sahasranama
name:
  english: agnisahasranamastotram
  devanagari: अग्निसहस्रनामस्तोत्रम्
content:
  english: hiranyayah anushatyah krishnajamhah shatanitho'pratishkutah | iḻayah putra iḻenyo viceta vaghatamushik
    || 29|| vito'rko manusho'jasro viprah shrotorviya vrishah | ayoyuvana abadho viḻujambho harivratah
    || 30|| divahketurbhuvomurdha saranyandurdabhah suruk | divyena shocisha rajansuditirishiro brihat
    || 31|| sudrishiko vishanketuh puruhuta upasthasad | puroyava purvaniko'nivritah satpatirdyuman ||
    32|| yajnasya vidvanavyathyo durvarturbhurjayannapat | amritah saubhagasyeshah svarajyo devahutamah
    || 33|| kilalapa vitihotro ghritanirnik sanashrutah | shucivarnastuvigrivo bharati shocishaspatih
    || 34|| somaprishtho hirishmashrurbhadrashocirjugurvanih | ritvik purvebhirrishibhiridyashcitrashravastamah
    || 35|| bhimah stiyanam vrishabho nutanairidya asurah | stabhuyamano'dhvaranam gopa vishpatirasmayuh
    || 36|| ritasya gopa jirashvo johutro dampatih kavih | ritajato dyukshavaca juhvasyo'mivacatanah ||
    37|| somagopah shuktrashocirghritahavana ayajih | asanditah satyadharma shashamanah shushukvanih ||
    38|| vatajuto vishvarupastvashta carutamo mahan | iḻa sarasvati harshantistro devyo mayobhuvah ||
    39|| arva supeshasau devyau hotarau svarpatih subhah | devirdvaro jarabodho huyamano vibhavasuh ||
    40|| sahasavan marmrijenyo himstro'mritasya rakshita | dravinoda bhrajamano dhrishnururjampatih pita
    || 41|| sadayavishtho varuno varenyo bhajayuh prithuh | vandyodhvaranam samrajan sushevo dhirrishih
    shivah || 42|| prithupragama vishvayurmidhvanyanta shucat sakha | anavadyah paprathanah stavamano
    vibhuh shayuh || 43|| shvaitreyah prathamo dyuksho brihaduksha sukrittarah | vayaskridagnittokasya
    trata prito vidushtarah || 44|| tigmaniko hotravaho vigahah svatavanbhrimih | jujushanah saptarashmirrishikritturvanih
    shucih || 45|| bhurijanma samanagah prashasto vishvatasprithuh | vajasya raja shrutyasya raja vishvabhara
    vrisha || 46|| satyatatirjatavedastvashto'martyo vasushravah | satyashushmo bharijiko'dhvarashrih
    saprathastamah || 47|| pururupo brihadbhanurvishvadevo marutsakhah | rushadurmirjehamano bhrigavan
    vritraha kshayah || 48|| vamasyaratih krishtinam raja rudrah shacivasuh | dakshaih sudaksha indhano
    vishvakrishtirbrihaspatih || 49|| apamsadhastho vasuvidranvo bhujma vishampatih | sahasravalsho dharuno
    vahnih shambhuh sahantamah || 50|| acchidrotishcitrashocirhrishivanatithirvisham | durdharituh saparyenyo
    vedishaccitra atanih || 51|| daivyahketustigmahetih kaninanjara anavah | urjahutirritashcetyah prajanansarpirasutih
    || 52|| guhacatancitramaha dvrannah suro nitoshanah | kratvacetishtha ritacittrivaruthah sahasrajit
    || 53|| sandrigjurnih kshodayurusharbhudvajasatamah | nityah sunurjanya ritaprajato vritrahantamah
    || 54|| varshishthah sprihayadvarno ghrinirjato yashastamah | vaneshu jayuh putrahsanpita shuktro
    duronayuh || 55|| ashuhemah kshayadghoro devanam keturahnayah | durokashocih palitah suvarca bahulo'dbhutah
    || 56|| raja rayinam nishatto dhurshadruksho dhruvo harih | dharmo dvijanma sutukah shushukvanjara
    ukshitah || 57|| nadyah sishnurdadhih simha urdhvarocirananatah | shevah pitunam svadma''havo'psu
    simha iva shritah || 58|| garbho vananancaratham garbho yajnah puruvasuh | kshapavannripatirmedhyo
    vishvah shveto'parivritah || 59|| sthatam garbhah shukravarcastasthivan parame pade | vidvanmartagumshca
    devanam janma shyetah shucivratah || 60|| ritapravitah subrahma savita cittirapsushad | candrah purasturnitamah
    spandro deveshu jagrivih || 61|| pura eta satyatara ritava devavahanah | atandra indrah rituvicchocishthah
    shucidacchitah || 62|| hiranyakeshah suprito vasunam janita'surah | ribhva susharma devavirdadhadratnani
    dashushe || 63|| purvo dadhrigdivaspayuh pota dhirah sahasrasah | sumriḻiko devakamo navajato dhananjayah
    || 64|| shashvattamo nilaprishtha rishvo mandrataro'griyah | svarciramsho darurasricchitiprishtho
    namovahan || 65|| panyamsastarunah samrat carshaninam vicakshanah | svangah suvirah krishnadhva supraturtiriḻo
    mahi || 66|| yavishthyo dakshushavriko vashimanavano ghritam | ivanasta vishvavarashcitrabhanurapam
    napat || 67|| nricaksha urjayancchirah sahoja adbhutaktratuh | bahunamavamo'bhidyurbhanurmitramaho
    bhagah || 68|| vrishcadvano rorucanah prithivyah patiradhrishah | divah sunurdasmavarca yanturo dushtaro
    jayan || 69|| svarvidganashrirathiro nakah shubhro'pturah sasah | hirishipro vishvaminvo bhrigunam
    ratiradvayan || 70|| suhota suranah sudyaurmandhata svavasah puman | ashvadava shreshthashociryajiyanharyato'rnavah
    || 71|| supratikashcitrayamah svabhishtishcakshanirushan | brihatsurah prishtabandhuh shacivansamyatashcikit
    || 72|| vishamidyo'himsyamano vayodha girvanastapuh | vashanna ugro'dvayavi tridhatustaranih svayuh
    || 73|| trayayayyashcarshaninam hota viḻuh prajapatih | guhamano nirmathitah sudanurishito yajan ||
    74|| medhakaro vipravirah kshitinam vrishabho'ratih | vajintamah kanvatamo jarita mitriyo'jarah ||
    75|| rayaspatih kucidarthi krishnayamo divikshayah | ghritapratikashcetishthah purukshuh satvano'kshitah
    || 76|| nityahota putadakshah kakudman kravyavahanah | didhishayyo didyutanah sudyotma dasyuhantamah
    || 77|| puruvarah purutamo jarhrishanah purohitah | shucijihvo jarbhurano rejamanastanunapat || 78||
    aditeyo devatamo dirghatantuh purandarah | diviyonirdarshatashrirjaramanah purupriyah || 79|| jrayasanah
    purupraisho vishvaturtih pitushpita | sahasanah sancikitvan daivodasah sahovridhah || 80|| shocishkesho
    dhrishadvarnah sujatah purucetanah | vishvashrushtirvishvavarya ayajishthah sadanavah || 81|| neta
    kshitinam daivinam vishvadah purushobhanah | yajnavanyurvahnitamo ramsujihvo guhahitah || 82|| trishadhastho
    vishvadhaya hotravidvishvadarshatah | citraradhah sunritavan sadyojatah parishkritah || 83|| citrakshatro
    vriddhashocirvanishto brahmanaspatih | babhrih paraspa ushasamighanah sasahih sadrik || 84|| vaji
    prashamsyo madhuprik cikitro nakshyah sudaksho'dripito vasishthah | divyo jushano raghuyatprayajyuh
    duryah suradhah prayato'pramrishyah || 85|| vatopadhuto mahinadrishenyah shrinamudaro dharuno rayinam
    | didyadrurukvvandravinasyuratyah shriyamvasanah pravapanyajishthah || 86|| vasyo vidano divijah panishtho
    damyah parijma suhavo virupah | jamirjananam vishito vapushyah shukrebhirangairaja atatanvan || 87||
    adhrugvaruthyah sudrishikarupah brahma vividvancikiturvibhanuh |
  devanagari: हिरण्ययः अनुषत्यः कृष्णजंहाः शतनीथोऽप्रतिष्कुतः । इळायाः पुत्र ईळेन्यो विचेता वाघतामुशिक्
    ॥ २९॥ वीतोऽर्को मानुषोऽजस्रो विप्रः श्रोतोर्विया वृषः । आयोयुवान आबाधो वीळुजम्भो हरिव्रतः ॥ ३०॥ दिवःकेतुर्भुवोमूर्धा
    सरण्यन्दुर्दभः सुरुक् । दिव्येन शोचिषा राजन्सुदीतिरिषिरो बृहत् ॥ ३१॥ सुदृशीको विशाङ्केतुः पुरुहूत
    उपस्थसद् । पुरोयावा पुर्वणीकोऽनिवृतः सत्पतिर्द्युमान् ॥ ३२॥ यज्ञस्य विद्वानव्यथ्यो दुर्वर्तुर्भूर्जयन्नपात्
    । अमृतः सौभगस्येशः स्वराज्यो देवहूतमः ॥ ३३॥ कीलालपा वीतिहोत्रो घृतनिर्णिक् सनश्रुतः । शुचिवर्णस्तुविग्रीवो
    भारती शोचिषस्पतिः ॥ ३४॥ सोमपृष्ठो हिरिश्मश्रुर्भद्रशोचिर्जुगुर्वणिः । ऋत्विक् पूर्वेभिरृषिभिरीड्यश्चित्रश्रवस्तमः
    ॥ ३५॥ भीमः स्तियानां वृषभो नूतनैरीड्य आसुरः । स्तभूयमानोऽध्वराणां गोपा विश्पतिरस्मयुः ॥ ३६॥ ऋतस्य
    गोपा जीराश्वो जोहूत्रो दम्पतिः कविः । ऋतजातो द्युक्षवचा जुह्वास्योऽमीवचातनः ॥ ३७॥ सोमगोपाः शुक्त्रशोचिर्घृताहवन
    आयजिः । असन्दितः सत्यधर्मा शशमानः शुशुक्वनिः ॥ ३८॥ वातजूतो विश्वरूपस्त्वष्टा चारुतमो महान् । इळा सरस्वती
    हर्षन्तिस्त्रो देव्यो मयोभुवः ॥ ३९॥ अर्वा सुपेशसौ देव्यौ होतारौ स्वर्पतिः सुभाः । देवीर्द्वारो जराबोधो
    हूयमानो विभावसुः ॥ ४०॥ सहसावान् मर्मृजेन्यो हिंस्त्रोऽमृतस्य रक्षिता । द्रविणोदा भ्राजमानो धृष्णुरूर्जाम्पतिः
    पिता ॥ ४१॥ सदायविष्ठो वरुणो वरेण्यो भाजयुः पृथुः । वन्द्योध्वराणां सम्राजन् सुशेवो धीरृषिः शिवः ॥
    ४२॥ पृथुप्रगामा विश्वायुर्मीढ्वान्यन्ता शुचत् सखा । अनवद्यः पप्रथानः स्तवमानो विभुः शयुः ॥ ४३॥ श्वैत्रेयः
    प्रथमो द्युक्षो बृहदुक्षा सुकृत्तरः । वयस्कृदग्नित्तोकस्य त्राता प्रीतो विदुष्टरः ॥ ४४॥ तिग्मानीको
    होत्रवाहो विगाहः स्वतवान्भृमिः । जुजुषाणः सप्तरश्मिरृषिकृत्तुर्वणिः शुचिः ॥ ४५॥ भूरिजन्मा समनगाः प्रशस्तो
    विश्वतस्पृथुः । वाजस्य राजा श्रुत्यस्य राजा विश्वभरा वृषा ॥ ४६॥ सत्यतातिर्जातवेदास्त्वाष्टोऽमर्त्यो
    वसुश्रवाः । सत्यशुष्मो भाऋजीकोऽध्वरश्रीः सप्रथस्तमः ॥ ४७॥ पुरुरूपो बृहद्भानुर्विश्वदेवो मरुत्सखः ।
    रुशदूर्मिर्जेहमानो भृगवान् वृत्रहा क्षयः ॥ ४८॥ वामस्यरातिः कृष्टीनां राजा रुद्रः शचीवसुः । दक्षैः
    सुदक्ष इन्धानो विश्वकृष्टिर्बृहस्पतिः ॥ ४९॥ अपांसधस्थो वसुविद्रण्वो भुज्म विशाम्पतिः । सहस्रवल्शो
    धरुणो वह्निः शम्भुः सहन्तमः ॥ ५०॥ अच्छिद्रोतिश्चित्रशोचिर्हृषीवानतिथिर्विशाम् । दुर्धरीतुः सपर्येण्यो
    वेदिषच्चित्र आतनिः ॥ ५१॥ दैव्यःकेतुस्तिग्महेतिः कनीनाञ्जार आनवः । ऊर्जाहुतिरृतश्चेत्यः प्रजानन्सर्पिरासुतिः
    ॥ ५२॥ गुहाचतञ्चित्रमहा द्व्रन्नः सूरो नितोशनः । क्रत्वाचेतिष्ठ ऋतचित्त्रिवरूथः सहस्रजित् ॥ ५३॥ सन्दृग्जूर्णिः
    क्षोदायुरुषर्भुद्वाजसातमः । नित्यः सूनुर्जन्य ऋतप्रजातो वृत्रहन्तमः ॥ ५४॥ वर्षिष्ठः स्पृहयद्वर्णो
    घृणिर्जातो यशस्तमः । वनेषु जायुः पुत्रःसन्पिता शुक्त्रो दुरोणयुः ॥ ५५॥ आशुहेमः क्षयद्घोरो देवानां
    केतुरह्नयः । दुरोकशोचिः पलितः सुवर्चा बहुलोऽद्भुतः ॥ ५६॥ राजा रयीणां निषत्तो धूर्षद्रूक्षो ध्रुवो
    हरिः । धर्मो द्विजन्मा सुतुकः शुशुक्वाञ्जार उक्षितः ॥ ५७॥ नाद्यः सिष्णुर्दधिः सिंह ऊर्ध्वरोचिरनानतः
    । शेवः पितूनां स्वाद्माऽऽहावोऽप्सु सिंह इव श्रितः ॥ ५८॥ गर्भो वनानाञ्चरथां गर्भो यज्ञः पुरूवसुः ।
    क्षपावान्नृपतिर्मेध्यो विश्वः श्वेतोऽपरीवृतः ॥ ५९॥ स्थातां गर्भः शुक्रवर्चास्तस्थिवान् परमे पदे ।
    विद्वान्मर्तागुंश्च देवानां जन्म श्येतः शुचिव्रतः ॥ ६०॥ ऋतप्रवीतः सुब्रह्मा सविता चित्तिरप्सुषद् ।
    चन्द्रः पुरस्तूर्णितमः स्पन्द्रो देवेषु जागृविः ॥ ६१॥ पुर एता सत्यतर ऋतावा देववाहनः । अतन्द्र इन्द्रः
    ऋतुविच्छोचिष्ठः शुचिदच्छितः ॥ ६२॥ हिरण्यकेशः सुप्रीतो वसूनां जनिताऽसुरः । ऋभ्वा सुशर्मा देवावीर्दधद्रत्नानि
    दाशुषे ॥ ६३॥ पूर्वो दधृग्दिवस्पायुः पोता धीरः सहस्रसाः । सुमृळीको देवकामो नवजातो धनञ्जयः ॥ ६४॥ शश्वत्तमो
    नीलपृष्ठ ऋष्वो मन्द्रतरोऽग्रियः । स्वर्चिरंशो दारुरस्रिच्छितिपृष्ठो नमोवहन् ॥ ६५॥ पन्यांसस्तरुणः सम्राट्
    चर्षणीनां विचक्षणः । स्वङ्गः सुवीरः कृष्णाध्वा सुप्रतूर्तिरिळो मही ॥ ६६॥ यविष्ठ्यो दक्षुषवृको वाशीमानवनो
    घृतम् । ईवानस्ता विश्ववाराश्चित्रभानुरपां नपात् ॥ ६७॥ नृचक्षा ऊर्जयञ्च्छीरः सहोजा अद्भुतक्त्रतुः ।
    बहुनामवमोऽभिद्युर्भानुर्मित्रमहो भगः ॥ ६८॥ वृश्चद्वनो रोरुचानः पृथिव्याः पतिराधृषः । दिवः सूनुर्दस्मवर्चा
    यन्तुरो दुष्टरो जयन् ॥ ६९॥ स्वर्विद्गणश्रीरथिरो नाकः शुभ्रोऽप्तुरः ससः । हिरिशिप्रो विश्वमिन्वो भृगूणां
    रातिरद्वयन् ॥ ७०॥ सुहोता सुरणः सुद्यौर्मन्धाता स्ववसः पुमान् । अश्वदावा श्रेष्ठशोचिर्यजीयान्हर्यतोऽर्णवः
    ॥ ७१॥ सुप्रतीकश्चित्रयामः स्वभिष्टिश्चक्षणीरुशन् । बृहत्सूरः पृष्टबन्धुः शचीवान्संयतश्चिकित् ॥ ७२॥
    विशामीड्योऽहिंस्यमानो वयोधा गिर्वणास्तपुः । वशान्न उग्रोऽद्वयावी त्रिधातुस्तरणिः स्वयुः ॥ ७३॥ त्रययाय्यश्चर्षणीनां
    होता वीळुः प्रजापतिः । गुहमानो निर्मथितः सुदानुरिषितो यजन् ॥ ७४॥ मेधाकारो विप्रवीरः क्षितीनां वृषभोऽरतिः
    । वाजिन्तमः कण्वतमो जरिता मित्रियोऽजरः ॥ ७५॥ रायस्पतिः कूचिदर्थी कृष्णयामो दिविक्षयः । घृतप्रतीकश्चेतिष्ठः
    पुरुक्षुः सत्वनोऽक्षितः ॥ ७६॥ नित्यहोता पूतदक्षः ककुद्मान् क्रव्यवाहनः । दिधिषाय्यो दिद्युतानः सुद्योत्मा
    दस्युहन्तमः ॥ ७७॥ पुरुवारः पुरुतमो जर्हृषाणः पुरोहितः । शुचिजिह्वो जर्भुराणो रेजमानस्तनूनपात् ॥ ७८॥
    आदितेयो देवतमो दीर्घतन्तुः पुरन्दरः । दिवियोनिर्दर्शतश्रीर्जरमाणः पुरुप्रियः ॥ ७९॥ ज्रयसानः पुरुप्रैषो
    विश्वतूर्तिः पितुष्पिता । सहसानः सञ्चिकित्वान् दैवोदासः सहोवृधः ॥ ८०॥ शोचिष्केशो धृषद्वर्णः सुजातः
    पुरुचेतनः । विश्वश्रुष्टिर्विश्ववर्य आयजिष्ठः सदानवः ॥ ८१॥ नेता क्षितीनां दैवीनां विश्वादः पुरुशोभनः
    । यज्ञवन्युर्वह्नितमो रंसुजिह्वो गुहाहितः ॥ ८२॥ त्रिषधस्थो विश्वधाया होत्राविद्विश्वदर्शतः । चित्रराधाः
    सूनृतावान् सद्योजातः परिष्कृतः ॥ ८३॥ चित्रक्षत्रो वृद्धशोचिर्वनिष्टो ब्रह्मणस्पतिः । बभ्रिः परस्पा
    उषसामिघानः सासहिः सदृक् ॥ ८४॥ वाजी प्रशंस्यो मधुपृक् चिकित्रो नक्ष्यः सुदक्षोऽदृपितो वसिष्ठः । दिव्यो
    जुषाणो रघुयत्प्रयज्युः दुर्यः सुराधाः प्रयतोऽप्रमृष्यः ॥ ८५॥ वातोपधूतो महिनादृशेन्यः श्रीणामुदारो
    धरुणो रयीणाम् । दीद्यद्रुरुक्व्वान्द्रविणस्युरत्यः श्रियंवसानः प्रवपन्यजिष्ठः ॥ ८६॥ वस्यो विदानो दिविजः
    पनिष्ठो दम्यः परिज्मा सुहवो विरूपः । जामिर्जनानां विषितो वपुष्यः शुक्रेभिरङ्गैरज आततन्वान् ॥ ८७॥ अध्रुग्वरूथ्यः
    सुदृशीकरूपः ब्रह्मा विविद्वाञ्चिकितुर्विभानुः ।
