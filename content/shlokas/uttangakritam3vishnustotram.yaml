id: uttangakritam3vishnustotram
category: stotram
name:
  english: uttangakritam3vishnustotram
  devanagari: उत्तन्गकृतं३विष्णुस्तोत्रम्
content:
  english: uttangakritam 3 vishnustotram uttanka uvaca | nato'smi narayanamadidevam jagannivasam jagadekabandhum
    | cakrabjasharngasidharam mahantam smritartinighnam sharanam prapadye || 3|| yannabhijabjaprabhavo
    vidhata srijatyamum lokasamuccayam ca | yatkrodhato hanti jagacca rudrastamadidevam pranato'smi vishnum
    || 4|| padmapatim padmadalayataksham vicitraviryam nikhilaikahetum | vedantavedyam purusham puranam
    tejonidhim vishnumaham prapannah || 5|| atmaksharah sarvagato'cyutakhyo jnanatmako jnanavidam sharanyah
    | jnanaikavedyo bhagavananadih prasidatam vyashtisamashtirupah || 6|| anantaviryo gunajatihino gunatmako
    jnanavidam varishthah | nityah prapannartiharah paratma dayambudhirme varadastu bhuyat || 7|| yah
    sthulasukshmadivisheshabhedairjagadyathavatsvakritam pravishtah | tvameva tatsarvamanantasaram tvattah
    param nasti yatah paratman || 8|| agocaram yattava shuddharupam mayavihinam gunajatihinam | niranjanam
    nirmalamaprameyam pashyanti santah paramarthasamjnam || 9|| ekena hemnaiva vibhushanani yatani bhedatvamupadhibhedat
    | tathaiva sarveshvara eka eva pradrishyate bhinna ivakhilatma || 10|| yanmayaya mohitacetasastam
    pashyanti natmanamapi prasiddham | ta eva mayarahitastadeva pashyanti sarvatmakamatmarupam || 11||
    vibhum jyotiranaupamyam vishnusamjnam namamyaham | samastametadudbhutam yato yatra pratishthitam ||
    12|| yatashcaitanyamayatam yadrupam tasya vai namah | aprameyamanadharamadharadheyarupakam || 13||
    paramanandacinmatram vasudevam nato'smyaham | hridguhanilayam devam yogibhih parisevitam || 14|| yoganamadibhutam
    tam namami pranavasthitam | nadatmakam nadabijam pranavatmakamavyayam || 15|| sadbhavam saccidanandam
    tam vande tigmacakrinam | ajaram sakshinam tvasya hyavanmanasagocaram || 16|| niranjanamanantakhyam
    vishnurupam nato'smyaham | indriyani mano buddhih sattvam tejo balam dhritih || 17|| vasudevatmakanyahuh
    kshetram kshetrajnameva ca | vidyavidyatmakam prahuh paratparataram tatha || 18|| anadinidhanam shantam
    sarvadhataramacyutam | ye prapanna mahatmanastesham maktirhi shashvati || 19|| varam varenyam varadam
    puranam sanatanam sarvagatam samastam | nato'smi bhuyo'pi nato'smi bhuyo nato'smi bhuyo'pi nato'smi
    bhuyah || 20|| yatpadatoyam bhavarogavaidyo yatpadapamsurvimalatvasiddhyai | yannama dushkarmanivaranaya
    tamaprameyam purusham bhajami || 21|| sadrupam tamasadrupam sadasadrupamavyayam | tattadvilakshanam
    shreshtham shreshthacchreshthataram bhaje || 22|| niranjanam nirakaram purnamakashamadhyagam | param
    ca vidyavidyabhyam hridambujanivasinam || 23|| svaprakashamanirdeshyam mahatam ca mahattaram | anoraniyamsamajam
    sarvopadhivivarjitam || 24|| yannityam paramanandam param brahma sanatanam | vishnusamjnam jagaddhama
    tamasmi sharanam gatah || 25|| yam bhajanti kriyanishtha yam pashyanti ca yoginah | pujyatpujyataram
    shantam gato'smi sharanam prabhum || 26|| yam na pashyanti vidvamso ya etadvyapya tishthati | sarvasmadadhikam
    nityam nato'smi vibhumavyayam || 27|| antahkaranasamyogajjiva ityucyate ca yah | avidyakaryarahitah
    paramatmeti giyate || 28|| sarvatmakam sarvahetum sarvakarmaphalapradam | varam varenyamajanam pranato'smi
    paratparam || 29|| sarvajnam sarvagam shantam sarvantaryaminam harim | jnanatmakam jnananidhim jnanasamstham
    vibhum bhaje || 30|| namamyaham vedanidhim murarim vedantavijnanasunishcitartham | suryenduvat projjvalanetramindram
    khagasvarupam vapatisvarupam || 31|| sarveshvaram sarvagatam mahantam vedatmakam vedavidam varishtham
    | tam vanmano'cintyamanantashaktim jnanaikavedyam purusham bhajami || 32|| indragnikalasurapashivayusomeshamarttandapurandaradyaih
    | yah pati lokan paripurnabhavastamaprameyam sharanam prapadye || 33|| sahasrashirsham ca sahasrapadam
    sahasrabahum ca sahasranetram | samastayajnaih parijushtamadyam nato'smi tushtipradamugraviryam ||
    34|| kalatmakam kalavibhagahetum gunatrayatitamaham gunajnam | gunapriyam kamadamastasangamatindriyam
    vishvabhujam vitrishnam || 35|| nirihamagryam manasapyagamyam manomayam cannamayam nirudham | vijnanabhedapratipannakalpam
    na vanmayam pranamayam bhajami || 36|| na yasya rupam na balaprabhave na yasya karmani na yatpramanam
    | jananti devah kamalodbhavadyah stoshyamyaham tam kathamatmarupam || 37|| samsarasindhau patitam
    kadaryam mohakulam kamashatena baddham | akirtibhajam pishunam kritaghnam sadashucim paparatam pramanyum
    | dayambudhe pahi bhayakulam mam punah punastvam sharanam prapadye || 38|| iti naradapurane purvabhage
    ashtatrimshadhyayantargatam uttangakritam vishnustotram samaptam | brihannaradiyapurana | purvabhaga
    | adhyaya 38
  devanagari: उत्तङ्गकृतं ३ विष्णुस्तोत्रम् उत्तङ्क उवाच । नतोऽस्मि नारायणमादिदेवं जगन्निवासं जगदेकबन्धुम्
    । चक्राब्जशार्ङ्गासिधरं महान्तं स्मृतार्तिनिघ्नं शरणं प्रपद्ये ॥ ३॥ यन्नाभिजाब्जप्रभवो विधाता सृजत्यमुं
    लोकसमुच्चयं च । यत्क्रोधतो हन्ति जगच्च रुद्रस्तमादिदेवं प्रणतोऽस्मि विष्णुम् ॥ ४॥ पद्मापतिं पद्मदलायताक्षं
    विचित्रवीर्यं निखिलैकहेतुम् । वेदान्तवेद्यं पुरुषं पुराणं तेजोनिधिं विष्णुमहं प्रपन्नः ॥ ५॥ आत्माक्षरः
    सर्वगतोऽच्युताख्यो ज्ञानात्मको ज्ञानविदां शरण्यः । ज्ञानैकवेद्यो भगवाननादिः प्रसीदतां व्यष्टिसमष्टिरूपः
    ॥ ६॥ अनन्तवीर्यो गुणजातिहीनो गुणात्मको ज्ञानविदां वरिष्ठः । नित्यः प्रपन्नार्तिहरः परात्मा दयाम्बुधिर्मे
    वरदस्तु भूयात् ॥ ७॥ यः स्थूलसूक्ष्मादिविशेषभेदैर्जगद्यथावत्स्वकृतं प्रविष्टः । त्वमेव तत्सर्वमनन्तसारं
    त्वत्तः परं नास्ति यतः परात्मन् ॥ ८॥ अगोचरं यत्तव शुद्धरूपं मायाविहीनं गुणजातिहीनम् । निरञ्जनं निर्मलमप्रमेयं
    पश्यन्ति सन्तः परमार्थसंज्ञम् ॥ ९॥ एकेन हेम्नैव विभूषणानि यातानि भेदत्वमुपाधिभेदात् । तथैव सर्वेश्वर
    एक एव प्रदृश्यते भिन्न इवाखिलात्मा ॥ १०॥ यन्मायया मोहितचेतसस्तं पश्यन्ति नात्मानमपि प्रसिद्धम् । त
    एव मायारहितास्तदेव पश्यन्ति सर्वात्मकमात्मरूपम् ॥ ११॥ विभुं ज्योतिरनौपम्यं विष्णुसंज्ञं नमाम्यहम्
    । समस्तमेतदुद्भूतं यतो यत्र प्रतिष्ठितम् ॥ १२॥ यतश्चैतन्यमायातं यद्रूपं तस्य वै नमः । अप्रमेयमनाधारमाधाराधेयरूपकम्
    ॥ १३॥ परमानन्दचिन्मात्रं वासुदेवं नतोऽस्म्यहम् । हृद्गुहानिलयं देवं योगिभिः परिसेवितम् ॥ १४॥ योगानामादिभूतं
    तं नमामि प्रणवस्थितम् । नादात्मकं नादबीजं प्रणवात्मकमव्ययम् ॥ १५॥ सद्भावं सच्चिदानन्दं तं वन्दे तिग्मचक्रिणम्
    । अजरं साक्षिणं त्वस्य ह्यवाङ्मनसगोचरम् ॥ १६॥ निरञ्जनमनन्ताख्यं विष्णुरूपं नतोऽस्म्यहम् । इन्द्रियाणि
    मनो बुद्धिः सत्त्वं तेजो बलं धृतिः ॥ १७॥ वासुदेवात्मकान्याहुः क्षेत्रं क्षेत्रज्ञमेव च । विद्याविद्यात्मकं
    प्राहुः परात्परतरं तथा ॥ १८॥ अनादिनिधनं शान्तं सर्वधातारमच्युतम् । ये प्रपन्ना महात्मानस्तेषां मक्तिर्हि
    शाश्वती ॥ १९॥ वरं वरेण्यं वरदं पुराणं सनातनं सर्वगतं समस्तम् । नतोऽस्मि भूयोऽपि नतोऽस्मि भूयो नतोऽस्मि
    भूयोऽपि नतोऽस्मि भूयः ॥ २०॥ यत्पादतोयं भवरोगवैद्यो यत्पादपांसुर्विमलत्वसिद्ध्यै । यन्नाम दुष्कर्मनिवारणाय
    तमप्रमेयं पुरुषं भजामि ॥ २१॥ सद्रूपं तमसद्रूपं सदसद्रूपमव्ययम् । तत्तद्विलक्षणं श्रेष्ठं श्रेष्ठाच्छ्रेष्ठतरं
    भजे ॥ २२॥ निरञ्जनं निराकारं पूर्णमाकाशमध्यगम् । परं च विद्याविद्याभ्यां हृदम्बुजनिवासिनम् ॥ २३॥ स्वप्रकाशमनिर्देश्यं
    महतां च महत्तरम् । अणोरणीयांसमजं सर्वोपाधिविवर्जितम् ॥ २४॥ यन्नित्यं परमानन्दं परं ब्रह्म सनातनम्
    । विष्णुसंज्ञं जगद्धाम तमस्मि शरणं गतः ॥ २५॥ यं भजन्ति क्रियानिष्ठा यं पश्यन्ति च योगिनः । पूज्यात्पूज्यतरं
    शान्तं गतोऽस्मि शरणं प्रभुम् ॥ २६॥ यं न पश्यन्ति विद्वांसो य एतद्व्याप्य तिष्ठति । सर्वस्मादधिकं नित्यं
    नतोऽस्मि विभुमव्ययम् ॥ २७॥ अन्तःकरणसंयोगाज्जीव इत्युच्यते च यः । अविद्याकार्यरहितः परमात्मेति गीयते
    ॥ २८॥ सर्वात्मकं सर्वहेतुं सर्वकर्मफलप्रदम् । वरं वरेण्यमजनं प्रणतोऽस्मि परात्परम् ॥ २९॥ सर्वज्ञं
    सर्वगं शान्तं सर्वान्तर्यामिणं हरिम् । ज्ञानात्मकं ज्ञाननिधिं ज्ञानसंस्थं विभुं भजे ॥ ३०॥ नमाम्यहं
    वेदनिधिं मुरारिं वेदान्तविज्ञानसुनिश्चितार्थम् । सूर्येन्दुवत् प्रोज्ज्वलनेत्रमिन्द्रं खगस्वरूपं वपतिस्वरूपम्
    ॥ ३१॥ सर्वेश्वरं सर्वगतं महान्तं वेदात्मकं वेदविदां वरिष्ठम् । तं वाङ्मनोऽचिन्त्यमनन्तशक्तिं ज्ञानैकवेद्यं
    पुरुषं भजामि ॥ ३२॥ इन्द्राग्निकालासुरपाशिवायुसोमेशमार्त्तण्डपुरन्दराद्यैः । यः पाति लोकान् परिपूर्णभावस्तमप्रमेयं
    शरणं प्रपद्ये ॥ ३३॥ सहस्रशीर्षं च सहस्रपादं सहस्राबाहुं च सहस्रनेत्रम् । समस्तयज्ञैः परिजुष्टमाद्यं
    नतोऽस्मि तुष्टिप्रदमुग्रवीर्यम् ॥ ३४॥ कालात्मकं कालविभागहेतुं गुणत्रयातीतमहं गुणज्ञम् । गुणप्रियं
    कामदमस्तसङ्गमतीन्द्रियं विश्वभुजं वितृष्णम् ॥ ३५॥ निरीहमग्र्यं मनसाप्यगम्यं मनोमयं चान्नमयं निरूढम्
    । विज्ञानभेदप्रतिपन्नकल्पं न वाङ्मयं प्राणमयं भजामि ॥ ३६॥ न यस्य रूपं न बलप्रभावे न यस्य कर्माणि न
    यत्प्रमाणम् । जानन्ति देवाः कमलोद्भवाद्याः स्तोष्याम्यहं तं कथमात्मरूपम् ॥ ३७॥ संसारसिन्धौ पतितं कदर्यं
    मोहाकुलं कामशतेन बद्धम् । अकीर्तिभाजं पिशुनं कृतघ्नं सदाशुचिं पापरतं प्रमन्युम् । दयाम्बुधे पाहि भयाकुलं
    मां पुनः पुनस्त्वां शरणं प्रपद्ये ॥ ३८॥ इति नारदपुराणे पूर्वभागे अष्टत्रिंशाध्यायान्तर्गतं उत्तङ्गकृतं
    विष्णुस्तोत्रं समाप्तम् । बृहन्नारदीयपुराण । पूर्वभाग । अध्याय ३८
