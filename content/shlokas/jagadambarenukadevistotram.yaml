id: jagadambarenukadevistotram
category: stotram
name:
  english: jagadambarenukadevistotram
  devanagari: जगदम्बारेणुकादेवीस्तोत्रम्
content:
  english: tyaho karmajalam phalam va tadiyam | na caivam na shaivam jagannaiva mayam cidekasvarupam bhaje
    renukam tam || 4|| anekantikam sarvabhedadigamyam tamo'jnanaduhkhantigam shuddharupam | sada'dhyatmavidyapradanaikashilam
    bhaje renukam muktisaukhyadhidevim || 5|| tritapaprashantyai samaradhyate ya sada jivaloke svasaukhyapradatri
    | bhavambhodhisetum cidanandakandam bhaje renukam jnanamudraikalakshyam || 6|| sada bhaktahritkaumudim
    bhadrabhadram samonkaravacyam varenyam sharanyam | svabhaktartinasham shubhangam gunadhyam bhaje renukam
    bhaktabhagyam surupam || 7|| sada bhaktavatsalyapurnam suramyam surendradibhih stuyamanam susuktaih
    | sada bhaktavrindaishca samsevyamanam bhaje renukam bhaktabhagyam bhavanim || 8|| pathedyo sada bhaktiyukto
    vishuddhah svavarnashramacarato nityayuktah | sa muktah kriti renukayah prasadat sada rajate rajate
    lokapujyah || 9|| iti shrimat paramahamsaparivrajakacarya sadguru bhagavan shridharasvamimaharajaviracitam
    shrijagadambarenukadevistotram sampurnam | racanasthanam
  devanagari: त्यहो कर्मजालं फलं वा तदीयम् । न चैवं न शैवं जगन्नैव मायां चिदेकस्वरूपां भजे रेणुकां ताम्
    ॥ ४॥ अनेकान्तिकां सर्वभेदादिगम्यां तमोऽज्ञानदुःखान्तिगां शुद्धरूपाम् । सदाऽध्यात्मविद्याप्रदानैकशीलां
    भजे रेणुकां मुक्तिसौख्याधिदेवीम् ॥ ५॥ त्रितापप्रशान्त्यै समाराध्यते या सदा जीवलोके स्वसौख्यप्रदात्री
    । भवाम्भोधिसेतुं चिदानन्दकन्दां भजे रेणुकां ज्ञानमुद्रैकलक्ष्याम् ॥ ६॥ सदा भक्तहृत्कौमुदीं भद्रभद्रां
    समोङ्कारवाच्यां वरेण्यां शरण्याम् । स्वभक्तार्तिनाशां शुभाङ्गां गुणाढ्यां भजे रेणुकां भक्तभाग्यां
    सुरूपाम् ॥ ७॥ सदा भक्तवात्सल्यपूर्णां सुरम्यां सुरेन्द्रादिभिः स्तूयमानां सुसूक्तैः । सदा भक्तवृन्दैश्च
    संसेव्यमानां भजे रेणुकां भक्तभाग्यां भवानीम् ॥ ८॥ पठेद्यो सदा भक्तियुक्तो विशुद्धः स्ववर्णाश्रमाचारतो
    नित्ययुक्तः । स मुक्तः कृती रेणुकायाः प्रसादात् सदा राजते राजते लोकपूज्यः ॥ ९॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य
    सद्गुरु भगवान् श्रीधरस्वामीमहाराजविरचितं श्रीजगदम्बारेणुकादेवीस्तोत्रं सम्पूर्णम् । रचनास्थानं
