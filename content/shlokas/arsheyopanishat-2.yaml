id: arsheyopanishat-2
category: upanishad
name:
  english: arsheyopanishat
  devanagari: आर्षेयोपनिषत्
content:
  english: arsheyopanishat om rishayo vai brahmodyamahvayitava ucuh parasparamivanubruvanah | tesham vishvamitro
    vijitiyamiva manyamana uvaca | yadetadantare dyavaprithivi anashnuvadiva sarvamashnavadyadidamakashamivetashcetashca
    stanayanti vidyotamana ivavasphurjayamana iva tadbrahmeti | tasyopavyakhyanam | yadidamagnibhirjvalayanti
    popluyayantyadbhirabhishivayanti vaddhibhirabhigrathnanti varatrabhirabhighnamtyayoghanairvidhyamti
    sucibhih nikhanayamti shamkubhirabhitrindanti par̤vishikabhirabhilimpanti mritsnaya takshnuvamti vasibhih
    krishnamti phalibhirnahaiva shaknuvata iti nasyeshimahi nainamatiyimahi || tadu ha jamadagnirnanumene
    artamiva va esha tanmene yadidamantarenainadupayamti paryasa ivaisha divasprithivyoriti | sa hovaca
    antariksham va etadyadidamitthetthopavyakhye iti | mahimanam tvamushyeha pashyamiti yadidamasminnanvayattamiti
    | sa yadidametasminnanvayattam vedatha tathopaste'nvayatto haivasmin bhavati | tadetadavidvanevasminnanvayattamupaste
    vivapadyat artimricchet | tasmadevamevopasita || tamitarah papraccha | katamat tvamanartam manyasa
    iti | tam hovaca | yadidamiti dyavaprithivyoranarambhamiva nopayanti nabhicakshate nashnuvanti | tasyopavyakhyanam
    | yadidamitashcetashcandakosha udayanti napadyanta iva na visramsanta iva na skhalamtiva na paryavartanta
    iva | na ha va enatkecidupadhavanto vindanti nabhipashyanti | yadidameka idapa evahustama eke jyotireke'vakashameke
    paramam vyomaika atmanameka iti || tadu ha bharadvajo nanumene| yadiha sarve vetthettheti dyudire
    nasya tadrupam paryaptamiti | sa hovaca | artamivedam te vijnanamapi svidenadrodasyoreva paryayenopavanvimahi
    yadidamitthetthopavyakhyasyama iti | mahimanam tvevasyopase| yadidamatranvayattamiti | sa yadidamatranvayattam
    vedatha tathaivopaste'traivanvayatto bhavati | sa ya ihanvayattamidamavidvanevaitadupaste papiyan
    bhavatyartimarcchatyavamriyate yadevametadanvayattamupaste sarvamayureti vasiyan bhavati | sa ya etadenamupaste
    || tamitarah papraccha | katamat tvamanartam manyasa iti | sa hovaca | yadetasmin mandale'cirdipyate
    bambhramyamanamiva cakashyamanamiva jajvalyamanamiva dedipyamanamiva lelihanam tadeva me brahma |
    tasyopavyakhyanam yadidamaddhaiva parah paravato'bhipadyate sampannamevaitat sammitameva yathopayatamatmaivabhicakshata
    iti | ya etadabhipadyeva grihniyadatho visphurantiva dhavantivotplavamtivopashlishyamtiva na haivabhipadyante
    | tadidamantike daviyo nediya iva durato na va asya mahimanam kashcidetiti tadu ha na mene gautamo
    yadidamartamiva stimitamiva paryayena pashyantivemam mogham samvidana iti | ya ime pundrah suhmah
    kulumbha darada barbara iti | na ha va asamvidana eva dragivabhi tatpadyanta iti | mahimanam tvevasyopase
    | ya etadasminnantare hiranmayah purusho hiranyavarno hiranyashmashruranakhagrebhyo dipyamana iva
    | sa ya evamenamupaste'tiva sarvabhutani tishthamti sarvamayureti vasiyan bhavati | na ha va esha
    paramativodeti | yastvenam paramativodyantam pashyannupaste papiyan bhavati vivapadyata artimricchati
    | yastvenam paramanudyantam vedatha tathopaste param jyotirupasampadyate sarvamayureti vasiyan bhavati
    | sa ya evamenamupaste || tamitarah papraccha| katamat tvamanartam manyasa iti | tam hovaca | visphuramtirevema
    lelayantiriva samjihana iva nediyasitama iva daviyasitama eva daviyasitama iva nediyasitama eveti
    | yadapi bahudhacakshiranna kinca pratipadyata iti tanme brahmeti || tadu ha vasishtho nanumene |
    yadima visphurjayata evabhipadyante vivayanti mithu ceti vicakshate'kanda ivema na ha vai paramittha
    kashcanashnotyasamvidana iva | apa ye samvidrate tadetadantarvicakshata iti | mahimnah pashyema vijana
    iti | sa ya evamima mahimna evasya pashyannupaste mahimna evashnoti sarvamayureti vasiyan bhavati
    | yastvima avayatirevopaste na para sampadyamana no eva pareti papiyan bhavati vivapadyate pramiyate
    | atha ya imah para sampadyamana evopaste paraiva sampadyate sarvamayureti vasiyan bhavati | tamitarah
    papraccha | katamat tvamanartam manyasa iti | mahavijnanamiva pratipadenadhyavasayamiva yatraitaditthetthetyabhipashyati
    | atha neti netyetaditthettheti | sa va ayamatma ananto'jaro'paro na va are bahyo nantarah sarvavidbharupo
    vighasah prasarano'ntarjyotirvishvabhuk sarvasya vashi sarvasyeshanah sarvamamikshipanna tamashnoti
    kashcana || parovariyamsamabhipranutyamantarjushanam bhuvanani vishva | yamashnavanna kushikaso agnim
    vaishvanaramritajatam gamadhyayi ||1|| bharebhareshu tamupahvayama prasasahim yudhmamindram varenyam
    | satrasa
  devanagari: आर्षेयोपनिषत् ॐ ऋषयो वै ब्रह्मोद्यमाह्वयितवा ऊचुः परस्परमिवानुब्रुवाणाः । तेषां विश्वामित्रो
    विजितीयमिव मन्यमान उवाच । यदेतदन्तरे द्यावापृथिवी अनश्नुवदिव सर्वमश्नवद्यदिदमाकाशमिवेतश्चेतश्च स्तनयन्ति
    विद्योतमाना इवावस्फूर्जयमाना इव तद्ब्रह्मेति । तस्योपव्याख्यानम् । यदिदमग्निभिर्ज्वलयन्ति पोप्लूययन्त्यद्भिरभिषीवयन्ति
    वद्धीभिरभिग्रथ्नन्ति वरत्राभिरभिघ्नंत्ययोघनैर्विध्यंति सूचीभिः निखानयंति शंकुभिरभितृन्दन्ति पड़्वीशिकाभिरभिलिम्पन्ति
    मृत्स्नया तक्ष्णुवंति वासीभिः कृष्णंति फलिभिर्नहैव शक्नुवत इति नास्येशीमहि नैनमतीयीमहि ॥ तदु ह जमदग्निर्नानुमेने
    आर्तमिव वा एष तन्मेने यदिदमन्तरेणैनदुपयंति पर्यास इवैष दिवस्पृथिव्योरिति । स होवाच अन्तरिक्षं वा एतद्यदिदमित्थेत्थोपव्याख्ये
    इति । महिमानं त्वमुष्येह पश्यामीति यदिदमस्मिन्नन्वायत्तमिति । स यदिदमेतस्मिन्नन्वायत्तं वेदाथ तथोपास्तेऽन्वायत्तो
    हैवास्मिन् भवति । तदेतदविद्वानेवास्मिन्नन्वायत्तमुपास्ते वीवपद्यत् आर्तिमृच्छेत् । तस्मादेवमेवोपासीत
    ॥ तमितरः पप्रच्छ । कतमत् त्वमनार्तं मन्यस इति । तं होवाच । यदिदमिति द्यावापृथिव्योरनारंभमिव नोपयन्ति
    नाभिचक्षते नाश्नुवन्ति । तस्योपव्याख्यानम् । यदिदमितश्चेतश्चाण्डकोशा उदयन्ति नापद्यन्त इव न विस्रंसन्त
    इव न स्खलंतीव न पर्यावर्तन्त इव । न ह वा एनत्केचिदुपधावन्तो विन्दन्ति नाभिपश्यन्ति । यदिदमेक इदप एवाहुस्तम
    एके ज्योतिरेकेऽवकाशमेके परमं व्योमैक आत्मानमेक इति ॥ तदु ह भरद्वाजो नानुमेने। यदिह सर्वे वेत्थेत्थेति
    द्यूदिरे नास्य तद्रूपं पर्याप्तमिति । स होवाच । आर्तमिवेदं ते विज्ञानमपि स्विदेनद्रोदस्योरेव पर्यायेणोपवन्वीमहि
    यदिदमित्थेत्थोपव्याख्यास्याम इति । महिमानं त्वेवास्योपासे। यदिदमत्रान्वायत्तमिति । स यदिदमत्रान्वायत्तं
    वेदाथ तथैवोपास्तेऽत्रैवान्वायत्तो भवति । स य इहान्वायत्तमिदमविद्वानेवैतदुपास्ते पापीयान् भवत्यार्तिमार्च्छत्यवम्रियते
    यदेवमेतदन्वायत्तमुपास्ते सर्वमायुरेति वसीयान् भवति । स य एतदेनमुपास्ते ॥ तमितरः पप्रच्छ । कतमत् त्वमनार्तं
    मन्यस इति । स होवाच । यदेतस्मिन् मण्डलेऽचिर्दीप्यते बंभ्रम्यमाणमिव चाकश्यमानमिव जाज्वल्यमानमिव देदीप्यमानमिव
    लेलिहानं तदेव मे ब्रह्म । तस्योपव्याख्यानं यदिदमद्धैव पराः परावतोऽभिपद्यते संपन्नमेवैतत् संमितमेव
    यथोपयातमात्मैवाभिचक्षत इति । य एतदभिपद्येव गृह्णीयादथो विस्फुरन्तीव धावन्तीवोत्प्लवंतीवोपश्लिष्यंतीव
    न हैवाभिपद्यन्ते । तदिदमन्तिके दवीयो नेदीय इव दूरतो न वा अस्य महिमानं कश्चिदेतीति तदु ह न मेने गौतमो
    यदिदमार्तमिव स्तिमितमिव पर्यायेण पश्यन्तीवेमं मोघं संविदाना इति । य इमे पुण्ड्राः सुह्माः कुलुम्भा
    दरदा बर्बरा इति । न ह वा असंविदाना एव द्रागिवाभि तत्पद्यन्त इति । महिमानं त्वेवास्योपासे । य एतदस्मिन्नन्तरे
    हिरण्मयः पुरुषो हिरण्यवर्णो हिरण्यश्मश्रुरानखाग्रेभ्यो दीप्यमान इव । स य एवमेनमुपास्तेऽतीव सर्वभूतानि
    तिष्ठंति सर्वमायुरेति वसीयान् भवति । न ह वा एष परमतीवोदेति । यस्त्वेनं परमतीवोद्यन्तं पश्यन्नुपास्ते
    पापीयान् भवति वीवपद्यत आर्तिमृच्छति । यस्त्वेनं परमनूद्यन्तं वेदाथ तथोपास्ते परं ज्योतिरुपसंपद्यते
    सर्वमायुरेति वसीयान् भवति । स य एवमेनमुपास्ते ॥ तमितरः पप्रच्छ। कतमत् त्वमनार्तं मन्यस इति । तं होवाच
    । विस्फुरंतीरेवेमा लेलायन्तीरिव संजिहाना इव नेदीयसितमा इव दवीयसितमा एव दवीयसितमा इव नेदीयसितमा एवेति
    । यदपि बहुधाचक्षीरन्न किञ्च प्रतिपद्यत इति तन्मे ब्रह्मेति ॥ तदु ह वसिष्ठो नानुमेने । यदिमा विस्फूर्जयत
    एवाभिपद्यन्ते वीवयन्ति मिथु चेति विचक्षतेऽकाण्ड इवेमा न ह वै परमित्था कश्चनाश्नोत्यसंविदान इव । अप
    ये संविद्रते तदेतदन्तर्विचक्षत इति । महिम्नः पश्येमा विजान इति । स य एवमिमा महिम्न एवास्य पश्यन्नुपास्ते
    महिम्न एवाश्नोति सर्वमायुरेति वसीयान् भवति । यस्त्विमा अवयतीरेवोपास्ते न परा संपद्यमाना नो एव परेति
    पापीयान् भवति वीवपद्यते प्रमीयते । अथ य इमाः परा संपद्यमाना एवोपास्ते परैव संपद्यते सर्वमायुरेति वसीयान्
    भवति । तमितरः पप्रच्छ । कतमत् त्वमनार्तं मन्यस इति । महाविज्ञानमिव प्रतिपदेनाध्यवसायमिव यत्रैतदित्थेत्थेत्यभिपश्यति
    । अथ नेति नेत्येतदित्थेत्थेति । स वा अयमात्मा अनन्तोऽजरोऽपारो न वा अरे बाह्यो नान्तरः सर्वविद्भारूपो
    विघसः प्रसरणोऽन्तर्ज्योतिर्विश्वभुक् सर्वस्य वशी सर्वस्येशानः सर्वममिक्षिपन्न तमश्नोति कश्चन ॥ परोवरीयांसमभिप्रणुत्यमन्तर्जुषाणं
    भुवनानि विश्वा । यमश्नवन्न कुशिकासो अग्निं वैश्वानरमृतजातं गमध्ययी ॥१॥ भरेभरेषु तमुपह्वयाम प्रसासहिं
    युध्ममिन्द्रं वरेण्यम् । सत्रासा
