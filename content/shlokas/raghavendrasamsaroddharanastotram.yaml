id: raghavendrasamsaroddharanastotram
category: stotram
name:
  english: raghavendrasamsaroddharanastotram
  devanagari: राघवेन्द्रसंसारोद्धरणस्तोत्रम्
content:
  english: shriraghavendrasamsaroddharanastotram shritalokamarabhuruhasadrishanghre kripaya bhoh | gururajoddhara
    mam pratipatitam samsritikupe || 1|| ramani rai suta mohita manasam modada bho bhoh | gururajoddhara
    mam pratipatitam samsritikupe || 2|| ghanasacchitsukhapurita karunasagara bho bhoh | gururajoddhara
    mam pratipatitam samsritikupe || 3|| varadeshamita citracarita bhubhasura bho bhoh | gururajoddhara
    mam pratipatitam samsritikupe || 4|| daracakrankita kanthaga tulasimalika bho bhoh | gururajoddhara
    mam pratipatitam samsritikupe || 5|| yativaramitabodha sumatavistaraka bho bho | gururajoddhara mam
    pratipatitam samsritikupe || 6|| namatamishtada kushthamukha mahakashtahara bho bhoh | gururajoddhara
    mam pratipatitam samsritikupe || 7|| mamata bhaktajane suta iva jagrati te bho bhoh | gururajoddhara
    mam pratipatitam samsritikupe || 8|| stavanam krishnavadhutaracitam yah pathatidam | gururajoddhara
    mam pratipatitam samsritikupe || 9|| iti shrikrishnavadhutaviracite shriraghavendratantre navamapatale
    samsaroddharanastotram nama pancamo'dhyayah sampurnah |
  devanagari: श्रीराघवेन्द्रसंसारोद्धरणस्तोत्रम् श्रितलोकामरभूरुहसदृशाङ्घ्रे कृपया भोः । गुरुराजोद्धर
    मां प्रतिपतितं संसृतिकूपे ॥ १॥ रमणी रै सुत मोहित मनसं मोदद भो भोः । गुरुराजोद्धर मां प्रतिपतितं संसृतिकूपे
    ॥ २॥ घनसच्छित्सुखपूरित करुणासागर भो भोः । गुरुराजोद्धर मां प्रतिपतितं संसृतिकूपे ॥ ३॥ वरदेशामित चित्रचरित
    भूभासुर भो भोः । गुरुराजोद्धर मां प्रतिपतितं संसृतिकूपे ॥ ४॥ दरचक्राङ्कित कण्ठग तुलसीमालिक भो भोः
    । गुरुराजोद्धर मां प्रतिपतितं संसृतिकूपे ॥ ५॥ यतिवरामितबोध सुमतविस्तारक भो भो । गुरुराजोद्धर मां प्रतिपतितं
    संसृतिकूपे ॥ ६॥ नमतामिष्टद कुष्ठमुख महाकष्टहर भो भोः । गुरुराजोद्धर मां प्रतिपतितं संसृतिकूपे ॥ ७॥
    ममता भक्तजने सुत इव जाग्रति ते भो भोः । गुरुराजोद्धर मां प्रतिपतितं संसृतिकूपे ॥ ८॥ स्तवनं कृष्णावधूतरचितं
    यः पठतीदम् । गुरुराजोद्धर मां प्रतिपतितं संसृतिकूपे ॥ ९॥ इति श्रीकृष्णावधूतविरचिते श्रीराघवेन्द्रतन्त्रे
    नवमपटले संसारोद्धरणस्तोत्रं नाम पञ्चमोऽध्यायः सम्पूर्णः ।
