id: namavali-59
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: om vishveshaya namah | om khandaparashave namah | om shivaya namah | om shitamshubhushanaya
    namah | om akhandanagakodandaya namah | om candikeshapriyaya namah | om haraya namah | om gambhiraya
    namah | om gaganantasthaya namah | om sthanave namah | 10 || om sarvashariragaya namah | om urdhvaretaya
    namah | om mahaviryaya namah | om gananathaya namah | om ambikapriyaya namah | om jatadharaya namah
    | om andhakaharaya namah | om trishuline namah | om nilalohitaya namah | om garadanaya namah | 20
    || om virupakshaya namah | om bhavaya namah | om samsararogahrite namah | om vasanashaya namah | om
    bhagakshighnaya namah | om vamanaya namah | om manmathantakaya namah | om bhavamayaharaya namah |
    om yogine namah | om kartre namah | 30 || om sarvasvatantravate namah | om anoraniyase namah | om
    varadaya namah | om mahataya namah | om mahattaraya namah | om sarvartukarakaya namah | om dhanvine
    namah | om kanjajatottamangadhrite namah | om vishnunetraprapujyanghraye namah | om madhusudanasudanaya
    namah | 40 || om vicararahitaya namah | om manine namah | om manasvine namah | om kalanashanaya namah
    | om somasuryagninayanaya namah | om bhimaya namah | om bhavyaya namah | om yugantakrite namah | om
    sarasyaya namah | om dhumrakeshangaya namah | 50 || om babhrushaya namah | om bhayaharakaya namah
    | om vatashanadharaya namah | om gartaya namah | om kailasanilayaya namah | om svaraje namah | om
    turashatpujitapadaya namah | om vedavaji
  devanagari: ॐ विश्वेशाय नमः । ॐ खण्डपरशवे नमः । ॐ शिवाय नमः । ॐ शीतांशुभूषणाय नमः । ॐ अखण्डनगकोदण्डाय
    नमः । ॐ चण्डिकेशप्रियाय नमः । ॐ हराय नमः । ॐ गम्भीराय नमः । ॐ गगनान्तस्थाय नमः । ॐ स्थाणवे नमः । १०
    ॥ ॐ सर्वशरीरगाय नमः । ॐ ऊर्ध्वरेताय नमः । ॐ महावीर्याय नमः । ॐ गणनाथाय नमः । ॐ अम्बिकाप्रियाय नमः
    । ॐ जटाधराय नमः । ॐ अन्धकहराय नमः । ॐ त्रिशूलिने नमः । ॐ नीललोहिताय नमः । ॐ गरादनाय नमः । २० ॥ ॐ विरूपाक्षाय
    नमः । ॐ भवाय नमः । ॐ संसाररोगहृते नमः । ॐ वसनाशाय नमः । ॐ भगाक्षिघ्नाय नमः । ॐ वामनाय नमः । ॐ मन्मथान्तकाय
    नमः । ॐ भवामयहराय नमः । ॐ योगिने नमः । ॐ कर्त्रे नमः । ३० ॥ ॐ सर्वस्वतन्त्रवते नमः । ॐ अणोरणीयसे नमः
    । ॐ वरदाय नमः । ॐ महताय नमः । ॐ महत्तराय नमः । ॐ सर्वर्तुकारकाय नमः । ॐ धन्विने नमः । ॐ कञ्जजातोत्तमाङ्गधृते
    नमः । ॐ विष्णुनेत्रप्रपूज्याङ्घ्रये नमः । ॐ मधुसूदनसूदनाय नमः । ४० ॥ ॐ विचाररहिताय नमः । ॐ मानिने
    नमः । ॐ मनस्विने नमः । ॐ कालनाशनाय नमः । ॐ सोमसूर्याग्निनयनाय नमः । ॐ भीमाय नमः । ॐ भव्याय नमः । ॐ
    युगान्तकृते नमः । ॐ सरस्याय नमः । ॐ धूम्रकेशाङ्गाय नमः । ५० ॥ ॐ बभ्रुशाय नमः । ॐ भयहारकाय नमः । ॐ
    वाताशनधराय नमः । ॐ गर्ताय नमः । ॐ कैलासनिलयाय नमः । ॐ स्वराजे नमः । ॐ तुराषाट्पूजितपदाय नमः । ॐ वेदवाजि
