id: tarasaropanishat
category: upanishad
name:
  english: tarasaropanishat
  devanagari: तारसारोपनिषत्
content:
  english: ghchettadeva manyeteti | idam vai kurukshetram devanam devayajanam sarvesham bhutanam brahmasadanam
    | atra hi jantoh praneshutkramamaneshu rudrastarakam brahma vyacashte yenasavamritibhutva mokshi bhavati
    | tasmadavimuktameva nisheveta | avimuktam na vimuncet | evamevaisha bhagavanniti vai yajnavalkyah
    || 1|| atha hainam bharadvajah papraccha yajnavalkyam kim tarakam | kim tarayatiti | sa hovaca yajnavalkyah
    | om namo narayanayeti tarakam cidatmakamityupasitavyam | omityekaksharamatmasvarupam | nama iti dvyaksharam
    prakritisvarupam | narayanayeti pancaksharam parambrahmasvarupam | iti ya evam veda | so'mrito bhavati
    | omiti brahma bhavati | nakaro vishnurbhavati | makaro rudro bhavati | nakara ishvaro bhavati | rakaro'ndam
    virad bhavati | yakarah purusho bhavati | nakaro bhagavanbhavati | yakarah paramatma bhavati | etadvai
    narayanasyashtaksharam veda paramapurusho bhavati | ayamrigvedah prathamah padah || 1|| omityetadaksharam
    param brahma | tadevopasitavyam | etadeva sukshmashtaksharam bhavati | tadetadashtatmako'shtadha bhavati
    | akarah prathamaksharo bhavati | ukaro dvitiyaksharo bhavati | makarastritiyaksharo bhavati | bindusturiyaksharo
    bhavati | nadah pancamaksharo bhavati | kala shashthaksharo bhavati | kalatita saptamaksharo bhavati
    | tatparashcashtamaksharo bhavati | tarakattvattarako bhavati | tadeva tarakam brahma tvam viddhi
    | tadevopasitavyam || atraite shloka bhavanti || akaradabhavadbrahma jambavanitisamjnakah | ukaraksharasambhuta
    upendro harinayakah || 1|| makaraksharasambhutah shivastu hanumansmritah | bindurishvarasamjnastu
    shatrughnashcakrarat svayam || 2|| nado mahaprabhurjneyo bharatah shankhanamakah | kalayah purushah
    sakshallakshmano dharanidharah || 3|| kalatita bhagavati svayam siteti samjnita | tatparah paramatma
    ca shriramah purushottamah || 4|| omityetadaksharamidam sarvam | tasyopavyakhyanam bhutam bhavyam
    bhavishyadyaccanyattattvamantravarnadevatachando rikkalashaktisrishtyatmakamiti | ya evam veda | yajurvedo
    dvitiyah padah || 2|| atha hainam bharadvajo yajnavalkyamuvacatha kairmantraih paramatma prito bhavati
    svatmanam darshayati tanno bruhi bhagava iti | sa hovaca yajnavalkyah | om yo ha vai shriparamatma
    narayanah sa bhagavanakaravacyo jambavanbhurbhuvah suvastasmai vai namonamah || 1|| om yo ha vai shriparamatma
    narayanah sa bhagavanukaravacya upendrasvarupo harinayako bhurbhuvah suvastasmai vai namonamah ||
    2|| om yo ha vai shriparamatma narayanah sa bhagavanmakaravacyah shivasvarupo hanumanbhurbhuvah suvastasmai
    namonamah || 3|| om yo ha vai shriparamatma narayanah sa bhagavanbindusvarupah shatrughno bhurbhuvah
    suvastasmai vai namonamah || 4|| om yo ha vai shriparamatma narayanah sa bhagavannadasvarupo bharato
    bhurbhuvah suvastasmai vai namonamah || 5|| om yo ha vai shriparamatma narayanah sa bhagavankalasvarupo
    lakshmano bhurbhuvah suvastasmai vai namonamah || 6|| om yo ha vai shriparamatma narayanah sa bhagavankalatita
    bhagavati sita citsvarupa bhurbhuvah suvastasmai vai namonamah || 7|| yatha prathamamantroktavadyantau
    tatha sarvamantreshu drashtavyam | ukaravacya upendrasvarupo harinayakah 2 makaravacyah shivasvarupo
    hanuman 3 bindusvarupah shatrughnah 4 nadasvarupo bharatah 5 kalasvarupo lakshmanah 6 kalatita bhagavati
    sita citsvarupa 7 om yo ha vai shriparamatma narayanah sa bhagavamstatparah paramapurushah puranapurushottamo
    nityashuddhabuddhamuktasatya paramanantadvayaparipurnah paramatma brahmaivaham ramo'smi bhurbhuvah
    suvastasmai namonamah || 8|| etadashtavidhamantram yo'dhite so'gniputo bhavati | sa vayuputo bhavati
    | sa adityaputo bhavati | sa sthanuputo bhavati | sa sarvairdevairjnato bhavati | tenetihasapurananam
    rudranam shatasahasrani japtani phalani bhavanti | shrimannarayanashtaksharanusmaranena gayatryah
    shatasahasram japtam bhavati | pranavanamayutam japtam bhavati | dashapurvandashottaranpunati | narayanapadamavapnoti
    ya evam veda | tadvishnoh paramam padam sada pashyanti surayah | diviva cakshuratatam | tadvipraso
    vipanyavo jagrivamsah samindhate | vishnoryatparamam padam || ityupanishat || samavedastritiyah padah
    || 3|| om purnamadah purnamidam purnatpurnamudacyate | purnasya purnamadaya purnamevavashishyate ||
    om shantih shantih shantih || iti tarasaropanishatsamapta || adhikadhyayanaya
  devanagari: घ्च्हेत्तदेव मन्येतेति । इदं वै कुरुक्शेत्रं देवानां देवयजनं सर्वेषां भूतानां ब्रह्मसदनम्
    । अत्र हि जन्तोः प्राणेषूत्क्रममाणेषु रुद्रस्तारकं ब्रह्म व्याचष्टे येनासावमृतीभूत्वा मोक्शी भवति
    । तस्मादविमुक्तमेव निषेवेत । अविमुक्तं न विमुञ्चेत् । एवमेवैष भगवन्निति वै याज्ञवल्क्यः ॥ १॥ अथ हैनं
    भारद्वाजः पप्रच्च्ह याज्ञवल्क्यं किं तारकम् । किं तारयतीति । स होवाच याज्ञवल्क्यः । ॐ नमो नारायणायेति
    तारकं चिदात्मकमित्युपासितव्यम् । ओमित्येकाक्शरमात्मस्वरूपम् । नम इति द्व्यक्शरं प्रकृतिस्वरूपम् ।
    नारायणायेति पञ्चाक्शरं परंब्रह्मस्वरूपम् । इति य एवं वेद । सोऽमृतो भवति । ओमिति ब्रह्मा भवति । नकारो
    विष्णुर्भवति । मकारो रुद्रो भवति । नकार ईश्वरो भवति । रकारोऽण्डं विराड् भवति । यकारः पुरुषो भवति ।
    णकारो भगवान्भवति । यकारः परमात्मा भवति । एतद्वै नारायणस्याष्टाक्शरं वेद परमपुरुषो भवति । अयमृग्वेदः
    प्रथमः पादः ॥ १॥ ॐइत्येतदक्शरं परं ब्रह्म । तदेवोपासितव्यम् । एतदेव सूक्श्माष्टाक्शरं भवति । तदेतदष्टात्मकोऽष्टधा
    भवति । अकारः प्रथमाक्शरो भवति । उकारो द्वितीयाक्शरो भवति । मकारस्तृतीयाक्शरो भवति । बिन्दुस्तुरीयाक्शरो
    भवति । नादः पञ्चमाक्शरो भवति । कला षष्ठाक्शरो भवति । कलातीता सप्तमाक्शरो भवति । तत्परश्चाष्टमाक्शरो
    भवति । तारकत्त्वात्तारको भवति । तदेव तारकं ब्रह्म त्वं विद्धि । तदेवोपासितव्यम् ॥ अत्रैते श्लोका भवन्ति
    ॥ अकारादभवद्ब्रह्मा जाम्बवानितिसंज्ञकः । उकाराक्शरसंभूत उपेन्द्रो हरिनायकः ॥ १॥ मकाराक्शरसंभूतः शिवस्तु
    हनुमान्स्मृतः । बिन्दुरीश्वरसंज्ञस्तु शत्रुघ्नश्चक्रराट् स्वयम् ॥ २॥ नादो महाप्रभुर्ज्ञेयो भरतः शङ्खनामकः
    । कलायाः पुरुषः साक्शाल्लक्श्मणो धरणीधरः ॥ ३॥ कलातीता भगवती स्वयं सीतेति संज्ञिता । तत्परः परमात्मा
    च श्रीरामः पुरुषोत्तमः ॥ ४॥ ओमित्येतदक्शरमिदं सर्वम् । तस्योपव्याख्यानं भूतं भव्यं भविष्यद्यच्चान्यत्तत्त्वमन्त्रवर्णदेवताच्हन्दो
    ऋक्कलाशक्तिसृष्ट्यात्मकमिति । य एवं वेद । यजुर्वेदो द्वितीयः पादः ॥ २॥ अथ हैनं भारद्वाजो याज्ञवल्क्यमुवाचाथ
    कैर्मन्त्रैः परमात्मा प्रीतो भवति स्वात्मानं दर्शयति तन्नो ब्रूहि भगव इति । स होवाच याज्ञवल्क्यः ।
    ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवानकारवाच्यो जाम्बवान्भूर्भुवः सुवस्तस्मै वै नमोनमः ॥ १॥ ॐ यो ह
    वै श्रीपरमात्मा नारायणः स भगवानुकारवाच्य उपेन्द्रस्वरूपो हरिनायको भूर्भुवः सुवस्तस्मै वै नमोनमः ॥
    २॥ ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवान्मकारवाच्यः शिवस्वरूपो हनूमान्भूर्भुवः सुवस्तस्मै नमोनमः
    ॥ ३॥ ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवान्बिन्दुस्वरूपः शत्रुघ्नो भूर्भुवः सुवस्तस्मै वै नमोनमः
    ॥ ४॥ ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवान्नादस्वरूपो भरतो भूर्भुवः सुवस्तस्मै वै नमोनमः ॥ ५॥ ॐ यो
    ह वै श्रीपरमात्मा नारायणः स भगवान्कलास्वरूपो लक्श्मणो भूर्भुवः सुवस्तस्मै वै नमोनमः ॥ ६॥ ॐ यो ह वै
    श्रीपरमात्मा नारायणः स भगवान्कलातीता भगवती सीता चित्स्वरूपा भूर्भुवः सुवस्तस्मै वै नमोनमः ॥ ७॥ यथा
    प्रथममन्त्रोक्तावाद्यन्तौ तथा सर्वमन्त्रेषु द्रष्टव्यम् । उकारवाच्य उपेन्द्रस्वरूपो हरिनायकः २ मकारवाच्यः
    शिवस्वरूपो हनुमान् ३ बिन्दुस्वरूपः शत्रुघ्नः ४ नादस्वरूपो भरतः ५ कलास्वरूपो लक्श्मणः ६ कलातीता भगवती
    सीता चित्स्वरूपा ७ ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवांस्तत्परः परमपुरुषः पुराणपुरुषोत्तमो नित्यशुद्धबुद्धमुक्तसत्य
    परमानन्ताद्वयपरिपूर्णः परमात्मा ब्रह्मैवाहं रामोऽस्मि भूर्भुवः सुवस्तस्मै नमोनमः ॥ ८॥ एतदष्टविधमन्त्रं
    योऽधीते सोऽग्निपूतो भवति । स वायुपूतो भवति । स आदित्यपूतो भवति । स स्थाणुपूतो भवति । स सर्वैर्देवैर्ज्ञातो
    भवति । तेनेतिहासपुराणानं रुद्राणां शतसहस्राणि जप्तानि फलानि भवन्ति । श्रीमन्नारायणाष्टाक्शरानुस्मरणेन
    गायत्र्याः शतसहस्रं जप्तं भवति । प्रणवानामयुतं जप्तं भवति । दशपूर्वान्दशोत्तरान्पुनाति । नारायणपदमवाप्नोति
    य एवं वेद । तद्विष्णोः परमं पदं सदा पश्यन्ति सूरयः । दिवीव चक्शुराततम् । तद्विप्रासो विपन्यवो जागृवांसः
    समिन्धते । विष्णोर्यत्परमं पदम् ॥ इत्युपनिषत् ॥ सामवेदस्तृतीयः पादः ॥ ३॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात्पूर्णमुदच्यते
    । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ इति तारसारोपनिषत्समाप्ता ॥ अधिकाध्ययनाय
