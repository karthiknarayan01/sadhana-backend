id: dvadashanamastotram
category: stotram
name:
  english: dvadashanamastotram
  devanagari: द्वादशनामस्तोत्रम्
content:
  english: rinudhvam munayah sarve gopalasya mahatmanah | anantasyaprameyasya namadvadashakam stavam ||
    1|| arjunaya pura gitam gopalena mahatmana | dvarakayam prarthayate yashodayashca sannidhau || 2||
    asya shridivyadvadashanamastotramahamantrasya phalgunarishih anushtupchandah shrikrishnah paramatma
    devata om bijam svaheti shaktih shrigopalakrishnaprityarthe jape viniyogah | atha dhyanam | janubhyamapi
    dhavantam bahubhyamatisundaram | sakundalalakam balam gopalam cintayedbudhah || 1|| prathamam tu harim
    vandyam dvitiyam keshavam tatha | tritiyam padmanabham tu caturtham vamanam tatha || 2|| pancamam
    vedagarbham ca shashtham tu madhusudanam | saptamam vasudevam ca varaham cashtamam tatha || 3|| navamam
    pundarikaksham dashamam tu janardanam | krishnamekadasham proktam dvadasham shridharam tatha || 4||
    etaddvadashanamani maya proktani phalguna | kalatraye pathedyastu tasya punyaphalam sha
  devanagari: ृणुध्वं मुनयः सर्वे गोपालस्य महात्मनः । अनन्तस्याप्रमेयस्य नामद्वादशकं स्तवम् ॥ १॥ अर्जुनाय
    पुरा गीतं गोपालेन महात्मना । द्वारकायां प्रार्थयते यशोदायाश्च सन्निधौ ॥ २॥ अस्य श्रीदिव्यद्वादशनामस्तोत्रमहामन्त्रस्य
    फाल्गुनऋषिः अनुष्टुप्छन्दः श्रीकृष्णः परमात्मा देवता ॐ बीजं स्वाहेति शक्तिः श्रीगोपालकृष्णप्रीत्यर्थे
    जपे विनियोगः । अथ ध्यानम् । जानुभ्यामपि धावन्तं बाहुभ्यामतिसुन्दरम् । सकुण्डलालकं बालं गोपालं चिन्तयेद्बुधः
    ॥ १॥ प्रथमं तु हरिं वन्द्यं द्वितीयं केशवं तथा । तृतीयं पद्मनाभं तु चतुर्थं वामनं तथा ॥ २॥ पञ्चमं
    वेदगर्भं च षष्ठं तु मधुसूदनम् । सप्तमं वासुदेवं च वाराहं चाष्टमं तथा ॥ ३॥ नवमं पुण्डरीकाक्षं दशमं
    तु जनार्दनम् । कृष्णमेकादशं प्रोक्तं द्वादशं श्रीधरं तथा ॥ ४॥ एतद्द्वादशनामानि मया प्रोक्तानि फाल्गुन
    । कालत्रये पठेद्यस्तु तस्य पुण्यफलं श
meaning: {}
