id: ashtavakra-gita-chapter-20
category: stotram
name:
  english: Ashtavakra Gita Chapter 20
content:
  english: janaka uvaca || kva bhutani kva deho va kvendriyani kva va manah | kva shunyam kva ca nairashyam
    matsvarupe niranjane || || kva shastram kvatmavijnanam kva va nirvishayam manah | kva triptih kva
    vitrishnatvam gatadvandvasya me sada || || kva vidya kva ca vavidya kvaham kvedam mama kva va | kva
    bandhah kva ca va mokshah svarupasya kva rupita || || kva prarabdhani karmani jivanmuktirapi kva va
    | kva tad videhakaivalyam nirvisheshasya sarvada || || kva karta kva ca va bhokta nishkriyam sphuranam
    kva va | kvaparoksham phalam va kva nihsvabhavasya me sada || || kva lokam kva mumukshurva kva yogi
    jnanavan kva va | kva baddhah kva ca va muktah svasvarupe'hamadvaye || || kva srishtih kva ca samharah
    kva sadhyam kva ca sadhanam | kva sadhakah kva siddhirva svasvarupe'hamadvaye || || kva pramata pramanam
    va kva prameyam kva ca prama | kva kincit kva na kincid va sarvada vimalasya me || || kva vikshepah
    kva caikagryam kva nirbodhah kva mudhata | kva harshah kva vishado va sarvada nishkriyasya me || ||
    kva caisha vyavaharo va kva ca sa paramarthata | kva sukham kva ca va duhkham nirvimarshasya me sada
    || || kva maya kva ca samsarah kva pritirviratih kva va | kva jivah kva ca tadbrahma sarvada vimalasya
    me || || kva pravrittirnirvrittirva kva muktih kva ca bandhanam | kutasthanirvibhagasya svasthasya
    mama sarvada || || kvopadeshah kva va shastram kva shishyah kva ca va guruh | kva casti purushartho
    va nirupadheh shivasya me || || kva casti kva ca va nasti kvasti caikam kva ca dvayam | bahunatra
    kimuktena kincinnottishthate mama || || iti ashtavakragita samapta | || om tatsat ||
  devanagari: जनक उवाच ॥ क्व भूतानि क्व देहो वा क्वेन्द्रियाणि क्व वा मनः । क्व शून्यं क्व च नैराश्यं
    मत्स्वरूपे निरञ्जने ॥ ॥ क्व शास्त्रं क्वात्मविज्ञानं क्व वा निर्विषयं मनः । क्व तृप्तिः क्व वितृष्णात्वं
    गतद्वन्द्वस्य मे सदा ॥ ॥ क्व विद्या क्व च वाविद्या क्वाहं क्वेदं मम क्व वा । क्व बन्धः क्व च वा मोक्षः
    स्वरूपस्य क्व रूपिता ॥ ॥ क्व प्रारब्धानि कर्माणि जीवन्मुक्तिरपि क्व वा । क्व तद् विदेहकैवल्यं निर्विशेषस्य
    सर्वदा ॥ ॥ क्व कर्ता क्व च वा भोक्ता निष्क्रियं स्फुरणं क्व वा । क्वापरोक्षं फलं वा क्व निःस्वभावस्य
    मे सदा ॥ ॥ क्व लोकं क्व मुमुक्षुर्वा क्व योगी ज्ञानवान् क्व वा । क्व बद्धः क्व च वा मुक्तः स्वस्वरूपेऽहमद्वये
    ॥ ॥ क्व सृष्टिः क्व च संहारः क्व साध्यं क्व च साधनम् । क्व साधकः क्व सिद्धिर्वा स्वस्वरूपेऽहमद्वये
    ॥ ॥ क्व प्रमाता प्रमाणं वा क्व प्रमेयं क्व च प्रमा । क्व किञ्चित् क्व न किञ्चिद् वा सर्वदा विमलस्य
    मे ॥ ॥ क्व विक्षेपः क्व चैकाग्र्यं क्व निर्बोधः क्व मूढता । क्व हर्षः क्व विषादो वा सर्वदा निष्क्रियस्य
    मे ॥ ॥ क्व चैष व्यवहारो वा क्व च सा परमार्थता । क्व सुखं क्व च वा दुःखं निर्विमर्शस्य मे सदा ॥ ॥ क्व
    माया क्व च संसारः क्व प्रीतिर्विरतिः क्व वा । क्व जीवः क्व च तद्ब्रह्म सर्वदा विमलस्य मे ॥ ॥ क्व प्रवृत्तिर्निर्वृत्तिर्वा
    क्व मुक्तिः क्व च बन्धनम् । कूटस्थनिर्विभागस्य स्वस्थस्य मम सर्वदा ॥ ॥ क्वोपदेशः क्व वा शास्त्रं क्व
    शिष्यः क्व च वा गुरुः । क्व चास्ति पुरुषार्थो वा निरुपाधेः शिवस्य मे ॥ ॥ क्व चास्ति क्व च वा नास्ति
    क्वास्ति चैकं क्व च द्वयम् । बहुनात्र किमुक्तेन किञ्चिन्नोत्तिष्ठते मम ॥ ॥ इति अष्टावक्रगीता समाप्ता
    । ॥ ॐ तत्सत् ॥
