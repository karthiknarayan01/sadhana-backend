id: narayanopanishat
category: upanishad
name:
  english: narayanopanishat
  devanagari: नारायणोपनिषत्
content:
  english: pancamahapatakopapatakat pramucyate | sarva veda parayana punyam labhate | narayanasayujyamavapnoti
    narayana sayujyamavapnoti | ya evam veda | ityupanishat || om saha navavatu saha nau bhunaktu | saha
    viryam karavavahai | tejasvinavadhitamastu | ma vidvishavahai || om shantih shantih shantih || shantakaram
    bhujagashayanam padmanabham suresham vishvadharam gaganasadrisham meghavarnam shubhangam | lakshmikantam
    kamalanayanam yogibhirdhyanagamyam vande vishnum bhavabhayaharam sarvalokaikanatham ||
  devanagari: पञ्चमहापातकोपपातकात् प्रमुच्यते । सर्व वेद पारायण पुण्यं लभते । नारायणसायुज्यमवाप्नोति नारायण
    सायुज्यमवाप्नोति । य एवं वेद । इत्युपनिषत् ॥ ॐ सह नाववतु सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु
    । मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ शान्ताकारं भुजगशयनं पद्मनाभं सुरेशं विश्वाधारं गगनसदृशं
    मेघवर्णं शुभाङ्गम् । लक्ष्मीकान्तं कमलनयनं योगिभिर्ध्यानगम्यं वन्दे विष्णुं भवभयहरं सर्वलोकैकनाथम्
    ॥
meaning: {}
