id: gopalastotram-3
category: stotram
name:
  english: gopalastotram
  devanagari: गोपालस्तोत्रम्
content:
  english: shrigopalastotram vakshasthale manimayabharanabhirame kalyanakalpalatikam kamalam vahantam
    | vaktre dadhanamatisundaramandahasam sancintayami nripagopakumaravesham || 1|| vedantamastakagiram
    prathamabhidheyam gopalabalavanitabhavane nidheyam | nandangananayanapankajabhagadheyam sancintayami
    nripagopakumaravesham || 2|| kancikalapakamaniyakatipradesham kantasahasrakucamandalamandaniyam |
    kamam vishalanayanam karunaikasindhum sancintayami nripagopakumaravesham || 3|| ajanudirghabhujamancitakanjanabham
    alolanetramasitotpalakarnapuram | arudhapakshipatimashritakalamegham sancintayami nripagopakumaravesham
    || 4|| phullatasikusumakantimusham kumaram saundaryashevadhimudaragunabhiramam | lakshmyalayam kalitakaustubhamambujaksham
    sancintayami nripagopakumaravesham || 5|| hastaravindayugalidhritashankhacakram pitambaram makarakundaladiptagandam
    | harabhiramamabhiramakaranguliyam sancintayami nripagopakumaravesham || 6|| kandarpakantimarunadharamayataksham
    kasturikatilakashobhitaphalabhagam | purnendubimbavadanam madhuravalokam sancintayami nripagopakumaravesham
    || 7|| balam balam balameva smaramah nilam nilam nilamalokayamah | gopam gopam gopamevashrayamah balam
    nilam gopavesham bhajamah || 8|| viksha nila lakavritamukham tava kundalashri
  devanagari: श्रीगोपालस्तोत्रम् वक्षस्थले मणिमयाभरणाभिरामे कल्याणकल्पलतिकां कमलां वहन्तम् । वक्त्रे दधानमतिसुन्दरमन्दहासं
    सञ्चिन्तयामि नृपगोपकुमारवेषम् ॥ १॥ वेदान्तमस्तकगिरां प्रथमाभिधेयं गोपालबालवनिताभवने निधेयम् । नन्दाङ्गनानयनपङ्कजभागधेयं
    सञ्चिन्तयामि नृपगोपकुमारवेषम् ॥ २॥ काञ्चीकलापकमनीयकटिप्रदेशं कान्तासहस्रकुचमण्डलमण्डनीयम् । कामं विशालनयनं
    करुणैकसिन्धुं सञ्चिन्तयामि नृपगोपकुमारवेषम् ॥ ३॥ आजानुदीर्घभुजमञ्चितकञ्जनाभं आलोलनेत्रमसितोत्पलकर्णपूरम्
    । आरूढपक्षिपतिमाश्रितकालमेघं सञ्चिन्तयामि नृपगोपकुमारवेषम् ॥ ४॥ फुल्लातसीकुसुमकान्तिमुषं कुमारं सौन्दर्यशेवधिमुदारगुणाभिरामम्
    । लक्ष्म्यालयं कलितकौस्तुभमम्बुजाक्षं सञ्चिन्तयामि नृपगोपकुमारवेषम् ॥ ५॥ हस्तारविन्दयुगलीधृतशङ्खचक्रं
    पीताम्बरं मकरकुण्डलदीप्तगण्डम् । हाराभिराममभिरामकराङ्गुलीयं सञ्चिन्तयामि नृपगोपकुमारवेषम् ॥ ६॥ कन्दर्पकान्तिमरुणाधरमायताक्षं
    कस्तूरिकातिलकशोभितफालभागम् । पूर्णेन्दुबिम्बवदनं मधुरावलोकं सञ्चिन्तयामि नृपगोपकुमारवेषम् ॥ ७॥ बालं
    बालं बालमेव स्मरामः नीलं नीलं नीलमालोकयामः । गोपं गोपं गोपमेवाश्रयामः बालं नीलं गोपवेषं भजामः ॥ ८॥
    वीक्षा नीला लकावृतमुखं तव कुण्डलश्री
