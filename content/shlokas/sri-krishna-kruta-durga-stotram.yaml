id: sri-krishna-kruta-durga-stotram
category: stotram
name:
  english: Sri Krishna Kruta Durga Stotram
content:
  english: shrikrishna uvaca | tvameva sarvajanani mulaprakritirishvari | tvamevadya srishtividhau svecchaya
    trigunatmika || || karyarthe saguna tvam ca vastuto nirguna svayam | parabrahmasvarupa tvam satya
    nitya sanatani || || tejah svarupa parama bhaktanugravigraha | sarvasvarupa sarvesha sarvadhara paratpara
    || || sarvabijasvarupa ca sarvapujya nirashraya | sarvajna sarvatobhadra sarvamangalamangala || ||
    sarvabuddhisvarupa ca sarvashaktisvarupini | sarvajnanaprada devi sarvajna sarvabhavini || || tvam
    svaha devadane ca pitridane svadha svayam | dakshina sarvadane ca sarvashaktisvarupini || || nidra
    tvam ca daya tvam ca trishna tvam catmanah priya | kshut kshantih shantirisha ca kantistushtishca
    shashvati || || shraddha pushtishca tandra ca lajja shobha daya tatha | satam sampatsvarupa shrirvipattirasatamiha
    || || pritirupa punyavatam papinam kalahankura | shashvatkarmamayi shaktih sarvada sarvajivinam ||
    || devebhyah svapado datri dhaturdhatri kripamayi | hitaya sarvadevanam sarvasuravinashini || || yoginidra
    yogarupa yogadatri ca yoginam | siddhisvarupa siddhanam siddhida siddhayogini || || maheshvari ca
    brahmani vishnumaya ca vaishnavi | bhadrada bhadrakali ca sarvalokabhayankari || || grame grame gramadevi
    grihadevi grihe grihe | satam kirtih pratishtha ca ninda tvamasatam sada || || mahayuddhe mahamari
    dushtasamhararupini | rakshasvarupa shishtanam mateva hitakarini || || vandya pujya stuta tvam ca
    brahmadinam ca sarvada | brahmanyarupa vipranam tapasya ca tapasvinam || || vidya vidyavatam tvam
    ca buddhirbuddhimatam satam | medha smritisvarupa ca pratibha pratibhavatam || || rajnam prataparupa
    ca visham vanijyarupini | srishtau srishtisvarupa tvam raksharupa ca palane || || tathante tvam mahamari
    vishve vishvaishca pujite | kalaratrirmaharatrirmoharatrishca mohini || || duratyaya me maya tvam
    yaya sammohitam jagat | yaya mugdho hi vidvamshca mokshamargam na pashyati || || ityatmana kritam
    stotram durgaya durganashanam | pujakale pathedyo hi siddhirbhavati vanchita || || iti shribrahmavaivarte
    mahapurane dvitiye prakritikhande naradanarayanasamvade durgopakhyane shatshashtitamo'dhyaye shri
    durga stotram |
  devanagari: श्रीकृष्ण उवाच । त्वमेव सर्वजननी मूलप्रकृतिरीश्वरी । त्वमेवाद्या सृष्टिविधौ स्वेच्छया त्रिगुणात्मिका
    ॥ ॥ कार्यार्थे सगुणा त्वं च वस्तुतो निर्गुणा स्वयम् । परब्रह्मस्वरूपा त्वं सत्या नित्या सनातनी ॥ ॥
    तेजः स्वरूपा परमा भक्तानुग्रविग्रहा । सर्वस्वरूपा सर्वेशा सर्वाधारा परात्परा ॥ ॥ सर्वबीजस्वरूपा च
    सर्वपूज्या निराश्रया । सर्वज्ञा सर्वतोभद्रा सर्वमङ्गलमङ्गला ॥ ॥ सर्वबुद्धिस्वरूपा च सर्वशक्तिस्वरूपिणी
    । सर्वज्ञानप्रदा देवी सर्वज्ञा सर्वभाविनी ॥ ॥ त्वं स्वाहा देवदाने च पितृदाने स्वधा स्वयम् । दक्षिणा
    सर्वदाने च सर्वशक्तिस्वरूपिणी ॥ ॥ निद्रा त्वं च दया त्वं च तृष्णा त्वं चात्मनः प्रिया । क्षुत् क्षान्तिः
    शान्तिरीशा च कान्तिस्तुष्टिश्च शाश्वती ॥ ॥ श्रद्धा पुष्टिश्च तन्द्रा च लज्जा शोभा दया तथा । सतां सम्पत्स्वरूपा
    श्रीर्विपत्तिरसतामिह ॥ ॥ प्रीतिरूपा पुण्यवतां पापिनां कलहाङ्कुरा । शश्वत्कर्ममयी शक्तिः सर्वदा सर्वजीविनाम्
    ॥ ॥ देवेभ्यः स्वपदो दात्री धातुर्धात्री कृपामयी । हिताय सर्वदेवानां सर्वासुरविनाशिनी ॥ ॥ योगिनिद्रा
    योगरूपा योगदात्री च योगिनाम् । सिद्धिस्वरूपा सिद्धानां सिद्धिदा सिद्धयोगिनी ॥ ॥ माहेश्वरी च ब्रह्माणी
    विष्णुमाया च वैष्णवी । भद्रदा भद्रकाली च सर्वलोकभयङ्करी ॥ ॥ ग्रामे ग्रामे ग्रामदेवी गृहदेवी गृहे गृहे
    । सतां कीर्तिः प्रतिष्ठा च निन्दा त्वमसतां सदा ॥ ॥ महायुद्धे महामारी दुष्टसंहाररूपिणी । रक्षास्वरूपा
    शिष्टानां मातेव हितकारिणी ॥ ॥ वन्द्या पूज्या स्तुता त्वं च ब्रह्मादीनां च सर्वदा । ब्रह्मण्यरूपा विप्राणां
    तपस्या च तपस्विनाम् ॥ ॥ विद्या विद्यावतां त्वं च बुद्धिर्बुद्धिमतां सताम् । मेधा स्मृतिस्वरूपा च प्रतिभा
    प्रतिभावताम् ॥ ॥ राज्ञां प्रतापरूपा च विशां वाणिज्यरूपिणी । सृष्टौ सृष्टिस्वरूपा त्वं रक्षारूपा च
    पालने ॥ ॥ तथान्ते त्वं महामारी विश्वे विश्वैश्च पूजिते । कालरात्रिर्महारात्रिर्मोहरात्रिश्च मोहिनी
    ॥ ॥ दुरत्यया मे माया त्वं यया सम्मोहितं जगत् । यया मुग्धो हि विद्वांश्च मोक्षमार्गं न पश्यति ॥ ॥ इत्यात्मना
    कृतं स्तोत्रं दुर्गाया दुर्गनाशनम् । पूजाकाले पठेद्यो हि सिद्धिर्भवति वाञ्छिता ॥ ॥ इति श्रीब्रह्मवैवर्ते
    महापुराणे द्वितीये प्रकृतिखण्डे नारदनारायणसंवादे दुर्गोपाख्याने षट्षष्टितमोऽध्याये श्री दुर्गा स्तोत्रम्
    ।
