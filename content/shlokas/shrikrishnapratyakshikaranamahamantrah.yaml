id: shrikrishnapratyakshikaranamahamantrah
category: mantra
name:
  english: shrikrishnapratyakshikaranamahamantrah
  devanagari: श्रीकृष्णप्रत्यक्षीकरणमहामन्त्रः
content:
  english: premabhaktisamriddhyartham ca jape viniyogah || || rishyadinyasah || naradarishaye namah shirasi
    | gayatrichandase namah mukhe | shrishyamasundaradevatayai namah hridi | klim bijaya namah guhye |
    hrim shaktaye namah nabhau | shrim kilakaya namah padayoh | viniyogaya namah sarvange || || karanyasah
    || om klam angushthabhyam namah | om klim tarjanibhyam namah | om klum madhyamabhyam namah | om klaim
    anamikabhyam namah | om klaum kanishthikabhyam namah | om klah karatalakaraprishthabhyam namah ||
    || shadanganyasah || om klam hridayaya namah | om klim shirase svaha | om klum shikhayai vashat |
    om klaim kavacaya hum | om klaum netratrayaya vaushat | om klah astraya phat || || dhyanam || vrindavanantarvihitasanastham
    venum vahantam navanilamegham | radhasamalingitavamabhagam vande mukundam madhuradhipam tam || barhavatamsam
    vanamalyashobham pitambaram kaustubharatnadiptam | mandasmitam padmadalayataksham dhyayetsada shyamasundaramidyam
    || || mantrah || om hrim shrim klim shyamasundara govinda gopijanavallabha mama hridaye sannidhehi
    sannidhehi | avirbhavaya avirbhavaya | prakashaya prakashaya | darshaya darshaya | bodhaya bodhaya
    | premna puraya puraya | moham hara hara | ajnanam bhinddhi bhinddhi | bhaktim dehi dehi | kripam
    kuru kuru | he nandanandana
  devanagari: प्रेमभक्तिसमृद्ध्यर्थं च जपे विनियोगः ॥ ॥ ऋष्यादिन्यासः ॥ नारदऋषये नमः शिरसि । गायत्रीछन्दसे
    नमः मुखे । श्रीश्यामसुन्दरदेवतायै नमः हृदि । क्लीं बीजाय नमः गुह्ये । ह्रीं शक्तये नमः नाभौ । श्रीं
    कीलकाय नमः पादयोः । विनियोगाय नमः सर्वाङ्गे ॥ ॥ करन्यासः ॥ ॐ क्लां अङ्गुष्ठाभ्यां नमः । ॐ क्लीं तर्जनीभ्यां
    नमः । ॐ क्लूं मध्यमाभ्यां नमः । ॐ क्लैं अनामिकाभ्यां नमः । ॐ क्लौं कनिष्ठिकाभ्यां नमः । ॐ क्लः करतलकरपृष्ठाभ्यां
    नमः ॥ ॥ षडङ्गन्यासः ॥ ॐ क्लां हृदयाय नमः । ॐ क्लीं शिरसे स्वाहा । ॐ क्लूं शिखायै वषट् । ॐ क्लैं कवचाय
    हुं । ॐ क्लौं नेत्रत्रयाय वौषट् । ॐ क्लः अस्त्राय फट् ॥ ॥ ध्यानम् ॥ वृन्दावनान्तर्विहितासनस्थं वेणुं
    वहन्तं नवनीलमेघम् । राधासमालिङ्गितवामभागं वन्दे मुकुन्दं मधुराधिपं तम् ॥ बर्हावतंसं वनमाल्यशोभं पीताम्बरं
    कौस्तुभरत्नदीप्तम् । मन्दस्मितं पद्मदलायताक्षं ध्यायेत्सदा श्यामसुन्दरमीड्यम् ॥ ॥ मन्त्रः ॥ ॐ ह्रीं
    श्रीं क्लीं श्यामसुन्दर गोविन्द गोपीजनवल्लभ मम हृदये सन्निधेहि सन्निधेहि । आविर्भावय आविर्भावय । प्रकाशय
    प्रकाशय । दर्शय दर्शय । बोधय बोधय । प्रेम्णा पूरय पूरय । मोहं हर हर । अज्ञानं भिन्द्धि भिन्द्धि ।
    भक्तिं देहि देहि । कृपां कुरु कुरु । हे नन्दनन्दन
