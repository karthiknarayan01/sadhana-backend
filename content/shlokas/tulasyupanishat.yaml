id: tulasyupanishat
category: upanishad
name:
  english: tulasyupanishat
  devanagari: तुलस्युपनिषत्
content:
  english: mulamrillepanat mahapapabhanjinim ghranatarpanat antarmalanashinim ya evam veda sa vaishnavo
    bhavati | vritha na chindyat | drishtva pradakshinam kuryat | dvadashyam na sprishet | parvani na
    vicinvet | yadi vicanvati sa vishnuha bhavati | shri tulasyai svaha | vishnupriyayai svaha | amritayai
    svaha | shri tulasyai vidmahe vishnupriyayai dhimahi | tanno amrita pracodayat | amrite'mritarupa'si
    amritatvapradayini | tvam mamuddhara samsarat kshirasagara kanyake || 1 shrisakhi tvam sadanande mukundasya
    sada priye | varadabhayahastabhyam mam vilokaya durlabhe || 2 avrikshavriksharupa'si vrikshatcam me
    vinashaya | tulasyatularupa'si tulakotinibhe'jare || 3 atule tvattulayam hi harireko'sti nanyatha
    | tvameva jagatam dhatri tvameva vishnuvallabha || 4 tvameva surasamsevya tvameva mokshadayini | tvacchayayam
    vasellakshmih tcanmule vishnuravyayah | samantad devatah sarvah siddhacaranapannagah || 5 yanmule
    sarvatirthani yanmadhye brahma devatah | yadayre vedashasrani tulasim tam namamyaham || 6 tulasi shrisakhi
    shubhe papaharini punyade | namaste naradanute narayanamanah priye || 7 brahmanandashrusanjate vrindavananivasini
    | sarvavayasampurne amritopanishadrase || 8 tvam mamuddhara kalyani mahapapabdhidustarat | sarveshamapi
    papanam prayashcittam tvameva hi || devanam ca rishinam ca pitrinam tvam sada priya || 9 vina shritulasim
    vipra ye'pi shraddham prakurvate | vritha bhavati tacchraddham pitrinam nopagacchati || 10 tulasipatramutsrijya
    yadi pujam karoti vai | asuri sa bhavetpuja vishnupritikari na ca || 11 yajnam danam japam tirtham
    shraddham vai devatarcanam | tarpanam marjanam canyanna kuryat tulasim vina || 12 tulasidarumanibhirjapah
    sarvarthasadhakah | evam na veda yah kashcit sa viprah shvapacadhamah || 13 ityaha bhagavan brahmanam
    narayanah
  devanagari: मूलमृल्लेपनात् महापापभञ्जिनीं घ्राणतर्पणात् अन्तर्मलनाशिनीं य एवं वेद स वैष्णवो भवति । वृथा
    न छिन्द्यात् । दृष्ट्वा प्रदक्षिणं कुर्यात् । द्वादश्यां न स्पृशेत् । पर्वणि न विचिन्वेत् । यदि विचन्वति
    स विष्णुहा भवति । श्री तुलस्यै स्वाहा । विष्णुप्रियायै स्वाहा । अमृतायै स्वाहा । श्री तुलस्यै विद्महे
    विष्णुप्रियायै धीमहि । तन्नो अमृता प्रचोदयात् । अमृतेऽमृतरूपाऽसि अमृतत्वप्रदायिनि । त्वं मामुद्धर
    संसारात् क्षीरसागर कन्यके ॥ १ श्रीसखि त्वं सदानन्दे मुकुन्दस्य सदा प्रिये । वरदाभयहस्ताभ्यां मां विलोकय
    दुर्लभे ॥ २ अवृक्षवृक्षरूपाऽसि वृक्षत्चं मे विनाशय । तुलस्यतुलरूपाऽसि तुलाकोटिनिभेऽजरे ॥ ३ अतुले त्वत्तुलायां
    हि हरिरेकोऽस्ति नान्यथा । त्वमेव जगतां धात्री त्वमेव विष्णुवल्लभा ॥ ४ त्वमेव सुरसंसेव्या त्वमेव मोक्षदायिनी
    । त्वच्छायायां वसेल्लक्ष्मीः त्चन्मूले विष्णुरव्ययः । समन्ताद् देवताः सर्वाः सिद्धचारणपन्नगाः ॥ ५
    यन्मूले सर्वतीर्थानि यन्मध्ये ब्रह्म देवताः । यदय्रे वेदशास्राणि तुलसीं तां नमाम्यहम् ॥ ६ तुलसि श्रीसखि
    शुभे पापहारिणि पुण्यदे । नमस्ते नारदनुते नारायणमनः प्रिये ॥ ७ ब्रह्मानन्दाश्रुसञ्जाते वृन्दावननिवासिनि
    । सर्वावयसम्पूर्णे अमृतोपनिषद्रसे ॥ ८ त्वं मामुद्धर कल्याणि महापापाब्धिदुस्तरात् । सर्वेषामपि पापानां
    प्रायश्चित्तं त्वमेव हि ॥ देवानां च ऋषीणां च पितॄणां त्वं सदा प्रिया ॥ ९ विना श्रीतुलसीं विप्रा येऽपि
    श्राद्धं प्रकुर्वते । वृथा भवति तच्छ्राद्धं पितॄणां नोपगच्छति ॥ १० तुलसीपत्रमुत्सृज्य यदि पूजां करोति
    वै । आसुरी सा भवेत्पूजा विष्णुप्रीतिकरी न च ॥ ११ यज्ञं दानं जपं तीर्थं श्राद्धं वै देवतार्चनम् । तर्पणं
    मार्जनं चान्यन्न कुर्यात् तुलसीं विना ॥ १२ तुलसीदारुमणिभिर्जपः सर्वार्थसाधकः । एवं न वेद यः कश्चित्
    स विप्रः श्वपचाधमः ॥ १३ इत्याह भगवान् ब्रह्माणं नारायणः
