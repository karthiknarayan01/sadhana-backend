    यज॑मानो॒ वँथ्स॒रो वा ए॒ष यद॒ग्निस्तस्य॑ त्रेधाविहि॒ता इष्ट॑काः प्राजाप॒त्या वै ऽस्य॑ प्राजाप॒त्या
