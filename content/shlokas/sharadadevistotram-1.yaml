id: sharadadevistotram-1
category: stotram
name:
  english: sharadadevistotram 1
  devanagari: शारदादेवीस्तोत्रम् १
content:
  english: prakritim paramamabhayam varadam nararupadharam janatapaharam | sharanagata sevakatoshakarim
    pranamami param jananim jagatam || 1|| gunahinasutanaparadhayutan kripaya'dya samuddhara mohagatan
    | taranim bhavasagaraparakarim pranamami param jananim jagatam || 2|| vishayam kusumam parihritya
    sada caranamburuhamrita shantisudham | piba bhringamano bhavarogaharam pranamami param jananim jagatam
    || 3|| kripam kuru mahadevi suteshu pranateshu ca | caranashraya danena kripamayi namo'stute || 4||
    lajjapatavrite nityam sharade jnanadayike | papebhyo nah sada raksha kripamayi namo'stute || 5|| ramakrishnagata
    pranam tannamashravanapriyam | tadbhavaranjitakaram pranamami muhurmuhuh || 6|| pavitram caritam yasyah
    pavitram jivanam tatha pavitrata svarupinyai tasyai kurmo namo namah || 7|| devim prasannam pranatartihantrim
  devanagari: प्रकृतिं परमामभयां वरदां नररूपधरां जनतापहराम् । शरणागत सेवकतोषकरीं प्रणमामि परां जननीं जगताम्
    ॥ १॥ गुणहीनसुतानपराधयुतान् कृपयाऽद्य समुद्धर मोहगतान् । तरणीं भवसागरपारकरीं प्रणमामि परां जननीं जगताम्
    ॥ २॥ विषयं कुसुमं परिहृत्य सदा चरणाम्बुरुहामृत शान्तिसुधाम् । पिब भृङ्गमनो भवरोगहरां प्रणमामि परां
    जननीं जगताम् ॥ ३॥ कृपां कुरु महादेवि सुतेषु प्रणतेषु च । चरणाश्रय दानेन कृपामयि नमोऽस्तुते ॥ ४॥ लज्जापटावृते
    नित्यं शारदे ज्ञानदायिके । पापेभ्यो नः सदा रक्ष कृपामयि नमोऽस्तुते ॥ ५॥ रामकृष्णगत प्राणां तन्नामश्रवणप्रियाम्
    । तद्भावरञ्जिताकारां प्रणमामि मुहुर्मुहुः ॥ ६॥ पवित्रं चरितं यस्याः पवित्रं जीवनं तथा पवित्रता स्वरूपिण्यै
    तस्यै कुर्मो नमो नमः ॥ ७॥ देवीं प्रसन्नां प्रणतार्तिहन्त्रीं
