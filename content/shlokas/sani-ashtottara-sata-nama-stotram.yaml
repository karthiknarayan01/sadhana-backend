id: sani-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Sani Ashtottara Sata Nama Stotram
content:
  english: shanaishcaraya shantaya sarvabhishtapradayine | sharanyaya varenyaya sarveshaya namo namah
    || || saumyaya suravandyaya suralokaviharine | sukhasanopavishtaya sundaraya namo namah || || ghanaya
    ghanarupaya ghanabharanadharine | ghanasaravilepaya khadyotaya namo namah || || mandaya mandaceshtaya
    mahaniyagunatmane | martyapavanapadaya maheshaya namo namah || || chayaputraya sharvaya sharatuniradharine
    | carasthirasvabhavaya cancalaya namo namah || || nilavarnaya nityaya nilanjananibhaya ca | nilambaravibhushaya
    nishcalaya namo namah || || vedyaya vidhirupaya virodhadharabhumaye | bhedaspadasvabhavaya vajradehaya
    te namah || || vairagyadaya viraya vitarogabhayaya ca | vipatparampareshaya vishvavandyaya te namah
    || || gridhnavahaya gudhaya kurmangaya kurupine | kutsitaya gunadhyaya gocaraya namo namah || || avidyamulanashaya
    vidya'vidyasvarupine | ayushyakaranaya''paduddhartre ca namo namah || || vishnubhaktaya vashine vividhagamavedine
    | vidhistutyaya vandyaya virupakshaya te namah || || varishthaya garishthaya vajrankushadharaya ca
    | varada'bhayahastaya vamanaya namo namah || || jyeshthapatnisametaya shreshthaya mitabhashine | kashtaughanashakaryaya
    pushtidaya namo namah || || stutyaya stotragamyaya bhaktivashyaya bhanave | bhanuputraya bhavyaya
    pavanaya namo namah || || dhanurmandalasamsthaya dhanadaya dhanushmate | tanuprakashadehaya tamasaya
    namo namah || || asheshajanavandyaya visheshaphaladayine | vashikritajaneshaya pashunam pataye namah
    || || khecaraya khageshaya ghananilambaraya ca | kathinyamanasaya''ryaganastutyaya te namah || ||
    nilacchatraya nityaya nirgunaya gunatmane | niramayaya nindyaya vandaniyaya te namah || || dhiraya
    divyadehaya dinartiharanaya ca | dainyanashakaraya''ryajanaganyaya te namah || || kruraya kruraceshtaya
    kamakrodhakaraya ca | kalatraputrashatrutvakaranaya namo namah || || pariposhitabhaktaya parabhitiharaya
    ca | bhaktasanghamano'bhishtaphaladaya namo namah || || ittham shanaishcarayedam namnamashtottaram
    shatam | pratyaham prajapanmartyo dirghamayuravapnuyat || || iti shri shani ashtottarashatanama stotram
    |
  devanagari: शनैश्चराय शान्ताय सर्वाभीष्टप्रदायिने । शरण्याय वरेण्याय सर्वेशाय नमो नमः ॥ ॥ सौम्याय सुरवन्द्याय
    सुरलोकविहारिणे । सुखासनोपविष्टाय सुन्दराय नमो नमः ॥ ॥ घनाय घनरूपाय घनाभरणधारिणे । घनसारविलेपाय खद्योताय
    नमो नमः ॥ ॥ मन्दाय मन्दचेष्टाय महनीयगुणात्मने । मर्त्यपावनपादाय महेशाय नमो नमः ॥ ॥ छायापुत्राय शर्वाय
    शरतूणीरधारिणे । चरस्थिरस्वभावाय चञ्चलाय नमो नमः ॥ ॥ नीलवर्णाय नित्याय नीलाञ्जननिभाय च । नीलाम्बरविभूषाय
    निश्चलाय नमो नमः ॥ ॥ वेद्याय विधिरूपाय विरोधाधारभूमये । भेदास्पदस्वभावाय वज्रदेहाय ते नमः ॥ ॥ वैराग्यदाय
    वीराय वीतरोगभयाय च । विपत्परम्परेशाय विश्ववन्द्याय ते नमः ॥ ॥ गृध्नवाहाय गूढाय कूर्माङ्गाय कुरूपिणे
    । कुत्सिताय गुणाढ्याय गोचराय नमो नमः ॥ ॥ अविद्यामूलनाशाय विद्याऽविद्यास्वरूपिणे । आयुष्यकारणायाऽऽपदुद्धर्त्रे
    च नमो नमः ॥ ॥ विष्णुभक्ताय वशिने विविधागमवेदिने । विधिस्तुत्याय वन्द्याय विरूपाक्षाय ते नमः ॥ ॥ वरिष्ठाय
    गरिष्ठाय वज्राङ्कुशधराय च । वरदाऽभयहस्ताय वामनाय नमो नमः ॥ ॥ ज्येष्ठापत्नीसमेताय श्रेष्ठाय मितभाषिणे
    । कष्टौघनाशकर्याय पुष्टिदाय नमो नमः ॥ ॥ स्तुत्याय स्तोत्रगम्याय भक्तिवश्याय भानवे । भानुपुत्राय भव्याय
    पावनाय नमो नमः ॥ ॥ धनुर्मण्डलसंस्थाय धनदाय धनुष्मते । तनुप्रकाशदेहाय तामसाय नमो नमः ॥ ॥ अशेषजनवन्द्याय
    विशेषफलदायिने । वशीकृतजनेशाय पशूनां पतये नमः ॥ ॥ खेचराय खगेशाय घननीलाम्बराय च । काठिन्यमानसायाऽऽर्यगणस्तुत्याय
    ते नमः ॥ ॥ नीलच्छत्राय नित्याय निर्गुणाय गुणात्मने । निरामयाय निन्द्याय वन्दनीयाय ते नमः ॥ ॥ धीराय
    दिव्यदेहाय दीनार्तिहरणाय च । दैन्यनाशकरायाऽऽर्यजनगण्याय ते नमः ॥ ॥ क्रूराय क्रूरचेष्टाय कामक्रोधकराय
    च । कलत्रपुत्रशत्रुत्वकारणाय नमो नमः ॥ ॥ परिपोषितभक्ताय परभीतिहराय च । भक्तसङ्घमनोऽभीष्टफलदाय नमो
    नमः ॥ ॥ इत्थं शनैश्चरायेदं नाम्नामष्टोत्तरं शतम् । प्रत्यहं प्रजपन्मर्त्यो दीर्घमायुरवाप्नुयात् ॥
    ॥ इति श्री शनि अष्टोत्तरशतनाम स्तोत्रम् ।
