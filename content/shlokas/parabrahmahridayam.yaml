id: parabrahmahridayam
category: hridaya
name:
  english: parabrahmahridayam
  devanagari: परब्रह्महृदयम्
content:
  english: rinu narada vakshyami hridayam paramadbhutam | guhyadguhyataram divyam brahmanah paramatmanah
    || 3|| punyam sarvarthasiddhyartham sarvaduhkhavinashanam | sarvashantikaram nityam sarvamangalakaranam
    || 4|| sarvavidyapratishthanam sarvarahasyagocaram | ajnanadhvantasamhartri paramanandavardhanam ||
    5|| yena vijnanamatrena na samsheta punarbhavah | na bandho na ca moksho'sti kevalam brahma drishyate
    || 6|| tadekam parabrahma tvam dhyayasva susamahitah | hridaye sarvalokanam nityam bhati niramayam
    || 7|| sarvadevamayam shantam sarvavedantanishcayam | sarvatattvamayam nityam sarvabhutantarasthitam
    || 8|| tadeva karanam sukshmam tadeva paramam mahat | tadeva bhasate nityam tadeva hridayam param
    || 9|| tadeva kalah sakalastadeva divaso nisha | tadeva bhutabhavyam ca tadevaksharamavyayam || 10||
    tadeva brahma vishnushca tadeva rudra ishvarah | tadevendro varunashca somo vahnih prajapatih || 11||
    tadeva kali tarini durga sundari para | radhika bhairavi caiva bagalamba sarasvati || 12|| tadeva
    vedo vedangam tadevagamasancayah | tadeva yoginam dhyeyam tadeva hridayam mahat || 13|| niranjanamanantam
    tanniradharam niramayam | svayamprakashamavyaktam svayamsiddham sanatanam || 14|| ya etaddhridayam
    nityam dharayenmanase budhah | tasya citte svayam brahma sphurati svarnadidhitih || 15|| tasya hrinmadhyadeshe
    tu trikonam paramam smritam | yatra shaktiparam tattvam svayameva prakashate || 16|| caturasram tadaveshtya
    bhuvanatrayakaranam | bindunadakalatitam cinmatraikaprakashakam || 17|| navayonivibhagena navadhashaktirucyate
    | navavaranamadhyastham param dhama niranjanam || 18|| prathamavarane devah sthavarajangamatmakah
    | dvitiye tattvavargashca tritiye gunamandalam || 19|| caturthe shaktisanghatah pancame jnanavigrahah
    | shashthe devaganah sukshmah saptame yogino matah || 20|| ashtame nadarupani navame paramam padam
    | yatra liyanti vishvani bindau brahmani kevalam || 21|| shricakram na tu citram syat na rekhamatrakalpana
    | cidakashe svayam jatam brahmandasya sharirakam || 22|| yatra triputivibhago'pi svayameva viliyate
    | jnata jnanam jneyarupam yatraikatvam prapadyate || 23|| bindum tu paramam vidyat sarvakaranakaranam
    | nadam tasya prasaram tu kalam tasya vibhutayah || 24|| adharadheyabhavena natra kashcitprakalpyate
    | svaprakashasvarupasya svayameva pratishthitih || 25|| yatra shrividyaya sukshma vidyashaktih pravartate
    | yatra kalo'pi vishramam labhate cidrasambudhau || 26|| na tatra bhedarekhasti na varno na ca samsthitih
    | tathapi bhaktibhavena drishyate vishvarupini || 27|| shricakrasya rahasyam yat tadeva hridayam param
    | hridayasya rahasyam yat tadeva parabrahma ca || 28|| yah pashyati na cakshurbhyam yah sha
  devanagari: ृणु नारद वक्ष्यामि हृदयं परमाद्भुतम् । गुह्याद्गुह्यतरं दिव्यं ब्रह्मणः परमात्मनः ॥ ३॥ पुण्यं
    सर्वार्थसिद्ध्यर्थं सर्वदुःखविनाशनम् । सर्वशान्तिकरं नित्यं सर्वमङ्गलकारणम् ॥ ४॥ सर्वविद्याप्रतिष्ठानं
    सर्वरहस्यगोचरम् । अज्ञानध्वान्तसंहर्तृ परमानन्दवर्धनम् ॥ ५॥ येन विज्ञानमात्रेण न संशेत पुनर्भवः ।
    न बन्धो न च मोक्षोऽस्ति केवलं ब्रह्म दृश्यते ॥ ६॥ तदेकं परब्रह्म त्वं ध्यायस्व सुसमाहितः । हृदये सर्वलोकानां
    नित्यं भाति निरामयम् ॥ ७॥ सर्वदेवमयं शान्तं सर्ववेदान्तनिश्चयम् । सर्वतत्त्वमयं नित्यं सर्वभूतान्तरस्थितम्
    ॥ ८॥ तदेव कारणं सूक्ष्मं तदेव परमं महत् । तदेव भासते नित्यं तदेव हृदयं परम् ॥ ९॥ तदेव कालः सकलस्तदेव
    दिवसो निशा । तदेव भूतभव्यं च तदेवाक्षरमव्ययम् ॥ १०॥ तदेव ब्रह्मा विष्णुश्च तदेव रुद्र ईश्वरः । तदेवेन्द्रो
    वरुणश्च सोमो वह्निः प्रजापतिः ॥ ११॥ तदेव काली तारिणी दुर्गा सुन्दरी परा । राधिका भैरवी चैव बगलाम्बा
    सरस्वती ॥ १२॥ तदेव वेदो वेदाङ्गं तदेवागमसञ्चयः । तदेव योगिनां ध्येयं तदेव हृदयं महत् ॥ १३॥ निरञ्जनमनन्तं
    तन्निराधारं निरामयम् । स्वयम्प्रकाशमव्यक्तं स्वयंसिद्धं सनातनम् ॥ १४॥ य एतद्धृदयं नित्यं धारयेन्मानसे
    बुधः । तस्य चित्ते स्वयं ब्रह्म स्फुरति स्वर्णदीधितिः ॥ १५॥ तस्य हृन्मध्यदेशे तु त्रिकोणं परमं स्मृतम्
    । यत्र शक्तिपरं तत्त्वं स्वयमेव प्रकाशते ॥ १६॥ चतुरस्रं तदावेष्ट्य भुवनत्रयकारणम् । बिन्दुनादकलातीतं
    चिन्मात्रैकप्रकाशकम् ॥ १७॥ नवयोनिविभागेन नवधाशक्तिरुच्यते । नवावरणमध्यस्थं परं धाम निरञ्जनम् ॥ १८॥
    प्रथमावरणे देवाः स्थावरजङ्गमात्मकाः । द्वितीये तत्त्ववर्गाश्च तृतीये गुणमण्डलम् ॥ १९॥ चतुर्थे शक्तिसङ्घाताः
    पञ्चमे ज्ञानविग्रहाः । षष्ठे देवगणाः सूक्ष्माः सप्तमे योगिनो मताः ॥ २०॥ अष्टमे नादरूपाणि नवमे परमं
    पदम् । यत्र लीयन्ति विश्वानि बिन्दौ ब्रह्मणि केवलम् ॥ २१॥ श्रीचक्रं न तु चित्रं स्यात् न रेखामात्रकल्पना
    । चिदाकाशे स्वयं जातं ब्रह्माण्डस्य शरीरकम् ॥ २२॥ यत्र त्रिपुटिविभागोऽपि स्वयमेव विलीयते । ज्ञाता
    ज्ञानं ज्ञेयरूपं यत्रैकत्वं प्रपद्यते ॥ २३॥ बिन्दुं तु परमं विद्यात् सर्वकारणकारणम् । नादं तस्य प्रसारं
    तु कलां तस्य विभूतयः ॥ २४॥ आधाराधेयभावेन नात्र कश्चित्प्रकल्प्यते । स्वप्रकाशस्वरूपस्य स्वयमेव प्रतिष्ठितिः
    ॥ २५॥ यत्र श्रीविद्यया सूक्ष्मा विद्याशक्तिः प्रवर्तते । यत्र कालोऽपि विश्रामं लभते चिद्रसाम्बुधौ
    ॥ २६॥ न तत्र भेदरेखास्ति न वर्णो न च संस्थितिः । तथापि भक्तिभावेन दृश्यते विश्वरूपिणी ॥ २७॥ श्रीचक्रस्य
    रहस्यं यत् तदेव हृदयं परम् । हृदयस्य रहस्यं यत् तदेव परब्रह्म च ॥ २८॥ यः पश्यति न चक्षुर्भ्यां यः
    श
