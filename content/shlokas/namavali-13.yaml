id: namavali-13
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: om cintamanisuracitarajamudranguliyakaya namah | om cintamanikanthabhushaya namah | om ratnaharasamanvitaya
    namah | om cintamanyagrasamyuktakatisutravirajitaya namah | om shinjanamanimanjiraratnapadukasamyutaya
    namah | om durvashamyarkamandarakusumaih suvirajitaya namah | om sarvabharanashobhadhyaya namah |
    om sugandhitilakojjvalaya namah | om raktagandhaviliptangaya namah | om raktamandaramalikaya namah
    |
  devanagari: ॐ चिन्तामणीसुरचितराजमुद्राङ्गुलीयकाय नमः । ॐ चिन्तामणीकण्ठभूषाय नमः । ॐ रत्नहारसमन्विताय
    नमः । ॐ चिन्तामण्यग्रसंयुक्तकटिसूत्रविराजिताय नमः । ॐ शिञ्जानमणिमञ्जीररत्नपादुकसंयुताय नमः । ॐ दूर्वाशम्यर्कमन्दारकुसुमैः
    सुविराजिताय नमः । ॐ सर्वाभरणशोभाढ्याय नमः । ॐ सुगन्धितिलकोज्ज्वलाय नमः । ॐ रक्तगन्धविलिप्ताङ्गाय नमः
    । ॐ रक्तमन्दारमालिकाय नमः ।
meaning: {}
