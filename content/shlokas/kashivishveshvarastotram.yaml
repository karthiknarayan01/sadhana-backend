id: kashivishveshvarastotram
category: stotram
name:
  english: kashivishveshvarastotram
  devanagari: काशीविश्वेश्वरस्तोत्रम्
content:
  english: kashivishveshvarastotram shrivasudevanandasarasvati kashivishveshvarastotram shrivasudevanandasarasvati
    kashivishveshvarastotram ya shodashakala kashi tanurupa prakashate|| jnanagamganvita yatra shambhuratma
    pratishthitah||1|| vishvanathah sattvikadhirbhavanyalimgitah sada|| yaddarshananna punaravrittih kalpashatairapi||2||
    iti shri pa
  devanagari: काशीविश्वेश्वरस्तोत्रम् श्रीवासुदेवानन्दसरस्वती काशीविश्वेश्वरस्तोत्रम् श्रीवासुदेवानन्दसरस्वती
    काशीविश्वेश्वरस्तोत्रम् या षोडशकला काशी तनुरूपा प्रकाशते।। ज्ञानगंगान्विता यत्र शंभुरात्मा प्रतिष्ठितः।।१।।
    विश्वनाथः सात्त्विकधीर्भवान्यालिंगितः सदा।। यद्दर्शनान्न पुनरावृत्तिः कल्पशतैरपि।।२।। इति श्री प
