id: shriganeshabhajanavalih
category: stotram
name:
  english: shriganeshabhajanavalih
  devanagari: श्रीगणेशभजनावलिः
content:
  english: jayagajanana shri ganesha bhajanavalih jayatu jayatu shri siddhiganesha jayatu jayatu shri
    shaktiganesha akshararupa siddhiganesha akshayadayaka siddhiganesha arkavinayaka siddhiganesha amaradhishvara
    siddhiganesha ashapuraka siddhiganesha aryaposhita siddhiganesha ibhamukharamjita siddhiganesha ikshucapadhara
    siddhiganesha ishvaratanaya siddhiganesha ipsitadayaka siddhiganesha 10 uddanda vighnapa siddhiganesha
    umayapalita siddhiganesha ucchishtaganapa siddhiganesha utsahavardhaka siddhiganesha ushmalavarjita
    siddhiganesha urjitashasana siddhiganesha rinatrayamocaka siddhiganesha rishiganavandita siddhiganesha
    ekadantadhara siddhiganesha ekadhuravaha siddhiganesha 20 aihika phalada siddhiganesha aishvaryadayaka
    siddhiganesha omkararupa siddhiganesha ojovardhaka siddhiganesha aunnatyarahita siddhiganesha audharyamurte
    siddhiganesha amkushadharin siddhiganesha ambalalita siddhiganesha kamalabhavastuta siddhiganesha
    karunasagara siddhiganesha 30 kapardhiganapa siddhiganesha kalibhayavarana siddhiganesha khadgakhetadhara
    siddhiganesha khalajanasudhana siddhiganesha kharjurapriya siddhiganesha gamkaravacya siddhiganesha
    gamgadharasuta sddhiganesha gagananandada siddhiganesha ganitajnanada siddhiganesha garalapurasthita
    siddhiganesha 40 ghatitarthavidhayaka siddhiganesha ghanadivyodara siddhiganesha cakradhararcita siddhiganesha
    carvanalalasa siddhiganesha chamdovigraha siddhiganesha chalanirmulana siddhiganesha chatralamkruta
    siddhiganesha jaganmohana siddhiganesha jagadujjivana siddhiganesha jagadadharaka siddhiganesha 50
    jhampalayapada siddhiganesha jhana jhana nartaka siddhiganesha tamkaritakarmuka siddhiganesha tamkruti
    ghoshana siddhiganesha thavarnavarjita siddhiganesha dambhavinashana siddhiganesha damarugadharasuta
    siddhiganesha dhakkaravahita siddhiganesha dhumdivinayaka siddhiganesha navarnaramjita siddhiganesha
    60 tarunemdupriya siddhiganesha tanudhanarakshaka siddhiganesha thaḻathaḻalocana siddhiganesha thakathaka
    nartana siddhiganesha navadurvapriya siddhiganesha navanitavilepana siddhiganesha pamcasyaganapa siddhiganesha
    pashupasha vimocaka siddhiganesha pranatajnanada siddhiganesha phalabhakshanapatu siddhiganesha 70
    phanipati bhushana siddhiganesha badariphalahita siddhiganesha bakuḻa sumarcita siddhiganesha bhavabhayanashaka
    siddhiganesha bhaktoddharaka siddhiganesha manoratha siddhida siddhiganesha mahimanvitavara siddhiganesha
    manonmanisuta siddhiganesha yajnaphalaprada siddhiganesha yamasutavandita siddhiganesha 80 ratnagarbhavara
    siddhiganesha raghuramarcita siddhiganesha ramayasamstuta siddhiganesha rajanishavishapada siddhiganesha
    lalana pujita siddhiganesha lalitanamdada siddhiganesha lakshmyalimgita siddhiganesha varada bhayakara
    siddhiganesha vara mushakavahana siddhiganesha shamidaḻarcita siddhiganesha 90 shama dama karana siddhiganesha
    shashidharalalita siddhiganesha shanmukha sodara siddhiganesha shatkonarcita siddhiganesha shadgunamamdita
    siddhiganesha shadurmibhamjaka siddhiganesha saptadashakshara siddhiganesha sarvagrapujya siddhiganesha
    samkashtaharana siddhiganesha santanaprada siddhiganesha 100 sajjanarakshaka siddhiganesha sakaleshtarthada
    siddhiganesha samgitapriya siddhiganesha haridraganapa siddhiganesha hariharapujita siddhiganesha
    harshapradayaka siddhiganesha kshatadantayudha siddhiganesha kshamayapalaya siddhiganesha 108 jayatu
    jayatu shri siddhiganesha jayatu jayatu shri shaktiganesha
  devanagari: जयगजानन श्री गणेश भजनावलिः जयतु जयतु श्री सिद्धिगणेश जयतु जयतु श्री शक्तिगणेश अक्षररूपा
    सिद्धिगणेश अक्षयदायक सिद्धिगणेश अर्कविनायक सिद्धिगणेश अमराधीश्वर सिद्धिगणेश आशापूरक सिद्धिगणेश आर्यापोषित
    सिद्धिगणेश इभमुखरंजित सिद्धिगणेश इक्षुचापधर सिद्धिगणेश ईश्वरतनया सिद्धिगणेश ईप्सितदायक सिद्धिगणेश
    १० उद्दण्ड विघ्नप सिद्धिगणेश उमयापालित सिद्धिगणेश उच्छिष्टगणप सिद्धिगणेश उत्साहवर्धक सिद्धिगणेश ऊष्मलवर्जित
    सिद्धिगणेश ऊर्जितशासन सिद्धिगणेश ऋणत्रयमोचक सिद्धिगणेश ऋषिगणवन्दित सिद्धिगणेश एकदन्तधर सिद्धिगणेश
    एकधुरावह सिद्धिगणेश २० ऐहिक फलद सिद्धिगणेश ऐश्वर्यदायक सिद्धिगणेश ओंकाररूप सिद्धिगणेश ओजोवर्धक सिद्धिगणेश
    औन्नत्यरहित सिद्धिगणेश औधार्यमूर्ते सिद्धिगणेश अंकुषधारिन् सिद्धिगणेश अंबालालित सिद्धिगणेश कमलभवस्तुत
    सिद्धिगणेश करुणासागर सिद्धिगणेश ३० कपर्धिगणप सिद्धिगणेश कलिभयवारण सिद्धिगणेश खड्गखेटधर सिद्धिगणेश
    खलजनसूधन सिद्धिगणेश खर्जूरप्रिय सिद्धिगणेश गंकारवाच्य सिद्धिगणेश गंगाधरसुत स्द्धिगणेश गगनानन्दद सिद्धिगणेश
    गणितज्ञानद सिद्धिगणेश गरलपुरस्थित सिद्धिगणेश ४० घटितार्थविधायक सिद्धिगणेश घनदिव्योदर सिद्धिगणेश चक्रधरार्चित
    सिद्धिगणेश चर्वणलालस सिद्धिगणेश छंदोविग्रह सिद्धिगणेश छलनिर्मूलन सिद्धिगणेश छत्रालंक्रुत सिद्धिगणेश
    जगन्मोहन सिद्धिगणेश जगदुज्जीवन सिद्धिगणेश जगदाधारक सिद्धिगणेश ५० झंपालयपद सिद्धिगणेश झण झण नर्तक सिद्धिगणेश
    टंकारितकार्मुक सिद्धिगणेश टंक्रुति घोशण सिद्धिगणेश ठवर्णवर्जित सिद्धिगणेश डम्भविनाशन सिद्धिगणेश डमरुगधरसुत
    सिद्धिगणेश ढक्कारवहित सिद्धिगणेश ढुंडिविनायक सिद्धिगणेश णवर्णरंजित सिद्धिगणेश ६० तरुणेंदुप्रिय सिद्धिगणेश
    तनुधनरक्षक सिद्धिगणेश थळथळलोचन सिद्धिगणेश थकथक नर्तन सिद्धिगणेश नवदूर्वाप्रिय सिद्धिगणेश नवनीतविलेपन
    सिद्धिगणेश पंचास्यगणप सिद्धिगणेश पशुपाश विमोचक सिद्धिगणेश प्रणतज्ञानद सिद्धिगणेश फलभक्षणपटु सिद्धिगणेश
    ७० फणिपति भूशण सिद्धिगणेश बदरीफलहित सिद्धिगणेश बकुळ सुमार्चित सिद्धिगणेश भवभयनाशक सिद्धिगणेश भक्तोद्धारक
    सिद्धिगणेश मनोरथ सिद्धिद सिद्धिगणेश महिमान्वितवर सिद्धिगणेश मनोन्मनीसुत सिद्धिगणेश यज्ञफलप्रद सिद्धिगणेश
    यमसुतवन्दित सिद्धिगणेश ८० रत्नगर्भवर सिद्धिगणेश रघुरामर्चित सिद्धिगणेश रमयासंस्तुत सिद्धिगणेश रजनीशविशापद
    सिद्धिगणेश ललना पूजित सिद्धिगणेश ललितानंदद सिद्धिगणेश लक्ष्म्यालिंगित सिद्धिगणेश वरदा भयकर सिद्धिगणेश
    वर मूषकवाहन सिद्धिगणेश शमीदळार्चित सिद्धिगणेश ९० शम दम कारण सिद्धिगणेश शशिधरलालित सिद्धिगणेश षण्मुख
    सोदर सिद्धिगणेश षट्कोणार्चित सिद्धिगणेश षड्गुणमंडित सिद्धिगणेश षडूर्मिभंजक सिद्धिगणेश सप्तदशाक्षर
    सिद्धिगणेश सर्वाग्रपूज्य सिद्धिगणेश संकश्टहरण सिद्धिगणेश सन्तानप्रद सिद्धिगणेश १०० सज्जनरक्षक सिद्धिगणेश
    सकलेष्टार्थद सिद्धिगणेश संगीतप्रिय सिद्धिगणेश हरिद्रागणप सिद्धिगणेश हरिहरपूजित सिद्धिगणेश हर्षप्रदायक
    सिद्धिगणेश क्षतदन्तायुध सिद्धिगणेश क्षमयापालय सिद्धिगणेश १०८ जयतु जयतु श्री सिद्धिगणेश जयतु जयतु श्री
    शक्तिगणेश
