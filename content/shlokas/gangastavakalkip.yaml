id: gangastavakalkip
category: stotram
name:
  english: gangastavakalkiP
  devanagari: गन्गास्तवकल्कीP
content:
  english: pranamagunakirtanadishu jagatsu samrajate || 5|| mahabhishasutangana himagirishakutastana saphenajalahasini
    sitamaralasaccarini | calallaharisatkara varasarojamaladhara rasollasitagamini jaladhikamini rajate
    || 6|| kvacinmuniganaih stuta kvacidanantasampujita kvacitkalakalasvana kvacidadhirayadogana | kvacidravikarojjvala
    kvacidudagrapatakula kvacijjanavigahita jayati bhishmamata sati || 7|| sa eva kushali janah pranamatiha
    bhagirathim sa eva tapasam nidhirjapati jahnavimadarat | sa eva purushottamah smarati sadhu mandakinim
    sa eva vijayi prabhuh surataranginim sevate || 8|| tavamalajalacitam khagasrigalaminakshatam calallaharilolitam
    ruciratirajambalitam | kada nijavapurmuda suranaroragaih samstuto'pyaham tripathagamini priyamativa
    pashyamyaho || 9|| tvattire vasatim tavamalajalasnanam tava prekshanam tvannamasmaranam tavodayakathasamlapanam
    pavanam | gange me tava sevanaikanipuno'pyananditashcadritah stutva codgatapatako bhuvi kada shantashcarishyamyaham
    || 10|| ityetadrishibhih proktam gangastavanamuttamam | svargyam yashsyamayushyam pathanacchravanadapi
    || 11|| sarvapapaharam pumsam balamayurvivardhanam | pratarmadhyahnasayahne gangasannidhyata bhavet
    || 12|| ityetadbhargavakhyanam shukadevanmaya shrutam | pathitam shravitam catra punyam dhanyam yashaskaram
    || 13|| avataram mahavishnoh kalkeh paramamadbhutam | pathatam sha
  devanagari: प्रणामगुणकीर्तनादिषु जगत्सु संराजते ॥ ५॥ महाभिषसुताङ्गना हिमगिरीशकूटस्तना सफेनजलहासिनी सितमरालसच्चारिणी
    । चलल्लहरिसत्करा वरसरोजमालाधरा रसोल्लसितगामिनी जलधिकामिनी राजते ॥ ६॥ क्वचिन्मुनिगणैः स्तुता क्वचिदनन्तसम्पूजिता
    क्वचित्कलकलस्वना क्वचिदधीरयादोगणा । क्वचिद्रविकरोज्ज्वला क्वचिदुदग्रपाताकुला क्वचिज्जनविगाहिता जयति
    भीष्ममाता सती ॥ ७॥ स एव कुशली जनः प्रणमतीह भागीरथीं स एव तपसां निधिर्जपति जाह्नवीमादरात् । स एव पुरुषोत्तमः
    स्मरति साधु मन्दाकिनीं स एव विजयी प्रभुः सुरतरङ्गिणीं सेवते ॥ ८॥ तवामलजलाचितं खगसृगालमीनक्षतं चलल्लहरिलोलितं
    रुचिरतीरजम्बालितम् । कदा निजवपुर्मुदा सुरनरोरगैः संस्तुतोऽप्यहं त्रिपथगामिनि प्रियमतीव पश्याम्यहो
    ॥ ९॥ त्वत्तीरे वसतिं तवामलजलस्नानं तव प्रेक्षणं त्वन्नामस्मरणं तवोदयकथासंलापनं पावनम् । गङ्गे मे तव
    सेवनैकनिपुणोऽप्यानन्दितश्चादृतः स्तुत्वा चोद्गतपातको भुवि कदा शान्तश्चरिष्याम्यहम् ॥ १०॥ इत्येतदृषिभिः
    प्रोक्तं गङ्गास्तवनमुत्तमम् । स्वर्ग्यं यश्स्यमायुष्यं पठनाच्छ्रवणादपि ॥ ११॥ सर्वपापहरं पुंसां बलमायुर्विवर्धनम्
    । प्रातर्मध्याह्नसायाह्ने गङ्गासान्निध्यता भवेत् ॥ १२॥ इत्येतद्भार्गवाख्यानं शुकदेवान्मया श्रुतम्
    । पठितं श्रावितं चात्र पुण्यं धन्यं यशस्करम् ॥ १३॥ अवतारं महाविष्णोः कल्केः परममद्भुतम् । पठतां श
