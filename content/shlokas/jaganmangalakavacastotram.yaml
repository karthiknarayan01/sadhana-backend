id: jaganmangalakavacastotram
category: kavacha
name:
  english: jaganmangalakavacastotram
  devanagari: जगन्मन्गलकवचस्तोत्रम्
content:
  english: rinu vakshyami viprendra kavacam paramadbhutam | shrikrishnenaiva kathitam mahyam ca kripaya
    pura || 2|| maya dattam ca dharmaya tena narayanarshaye | rishina tena taddattam subhadraya mahatmane
    || 3|| atiguhyatamam shuddham param snehadvadamyaham | yaddhritva pathanatsiddhah siddhyadi prapnuvanti
    ca || 4|| evamindradayah sarve sarvaishvaryamavapnuyuh | rishishchandashca savitri devo narayanah
    svayam || 5|| dharmarthakamamoksheshu viniyogah prakirtitah | om radhesho me shirah patu kantham radheshvarah
    svayam || 6|| gopishashcakshushi patu talum ca bhagavansvayam | gandayugmam ca govindah karnayugmam
    ca keshavah || 7|| galam gadadharah patu skandham krishnah svayamprabhuh | vakshahsthalam vasudevashcodaram
    capi so'cyutah || 8|| nabhim patu padmanabhah kankalam kamsasudanah | purushottamah patu prishtham
    nityanando nitambakam || 9|| pundarikah padayugmam hastayugmam harih svayam | nasam ca nakharam patu
    narasimhah svayamprabhuh || 10|| sarveshvarashca sarvangam satatam madhusudanah | pracyam patu ca
    ramashca vahnau vamshidharah svayam || 11|| patu damodaro dakshe nairritye ca narottamah | pashcime
    pundarikaksho vayavyam vamanah svayam || 12|| anantashcottare patu aishanyamishvarah svayam | jale
    sthale cantarikshe svapne jagarane tatha || 13|| patu vrindavaneshashca mam bhaktam sharanagatam |
    iti te kathitam vatsa kavacam paramadbhutam || 14|| sukhadam mokshadam saram sarvasiddhipradam satam
    | idam kavacamishtam ca pujakale ca yah pathet || 15|| haridasyamavapnoti goloke vasamuttamam | ihaiva
    haribhaktim ca jivanmukto bhavennarah || 16|| iti shrinaradapancaratre jnanamritasare prathamaikaratre
    brahmanaradasamvade jaganmangalakavacam samaptam |
  devanagari: ृणु वक्ष्यामि विप्रेन्द्र कवचं परमाद्भुतम् । श्रीकृष्णेनैव कथितं मह्यं च कृपया पुरा ॥ २॥
    मया दत्तं च धर्माय तेन नारायणर्षये । ऋषिणा तेन तद्दत्तं सुभद्राय महात्मने ॥ ३॥ अतिगुह्यतमं शुद्धं
    परं स्नेहाद्वदाम्यहम् । यद्धृत्वा पठनात्सिद्धाः सिद्ध्यादि प्राप्नुवन्ति च ॥ ४॥ एवमिन्द्रादयः सर्वे
    सर्वैश्वर्यमवाप्नुयुः । ऋषिश्छन्दश्च सावित्री देवो नारायणः स्वयम् ॥ ५॥ धर्मार्थकाममोक्षेषु विनियोगः
    प्रकीर्तितः । ओं राधेशो मे शिरः पातु कण्ठं राधेश्वरः स्वयम् ॥ ६॥ गोपीशश्चक्षुषी पातु तालुं च भगवान्स्वयम्
    । गण्डयुग्मं च गोविन्दः कर्णयुग्मं च केशवः ॥ ७॥ गलं गदाधरः पातु स्कन्धं कृष्णः स्वयम्प्रभुः । वक्षःस्थलं
    वासुदेवश्चोदरं चापि सोऽच्युतः ॥ ८॥ नाभिं पातु पद्मनाभः कङ्कालं कंससूदनः । पुरुषोत्तमः पातु पृष्ठं
    नित्यानन्दो नितम्बकम् ॥ ९॥ पुण्डरीकः पादयुग्मं हस्तयुग्मं हरिः स्वयम् । नासां च नखरं पातु नरसिंहः
    स्वयम्प्रभुः ॥ १०॥ सर्वेश्वरश्च सर्वाङ्गं सततं मधुसूदनः । प्राच्यां पातु च रामश्च वह्नौ वंशीधरः स्वयम्
    ॥ ११॥ पातु दामोदरो दक्षे नैरृत्ये च नरोत्तमः । पश्चिमे पुण्डरीकाक्षो वायव्यां वामनः स्वयम् ॥ १२॥ अनन्तश्चोत्तरे
    पातु ऐशान्यामीश्वरः स्वयम् । जले स्थले चान्तरिक्षे स्वप्ने जागरणे तथा ॥ १३॥ पातु वृन्दावनेशश्च मां
    भक्तं शरणागतम् । इति ते कथितं वत्स कवचं परमाद्भुतम् ॥ १४॥ सुखदं मोक्षदं सारं सर्वसिद्धिप्रदं सताम्
    । इदं कवचमिष्टं च पूजाकाले च यः पठेत् ॥ १५॥ हरिदास्यमवाप्नोति गोलोके वासमुत्तमम् । इहैव हरिभक्तिं
    च जीवन्मुक्तो भवेन्नरः ॥ १६॥ इति श्रीनारदपञ्चरात्रे ज्ञानामृतसारे प्रथमैकरात्रे ब्रह्मनारदसंवादे जगन्मङ्गलकवचं
    समाप्तम् ।
