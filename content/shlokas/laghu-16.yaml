id: laghu-16
category: stotram
name:
  english: laghu 16
  devanagari: लघु १६
content:
  english: pyanandamritavarinahamabhishincabhyadaradambike || 7|| kalpaya kalpakavrikshasambhavamahatkausumbhavastradvayam
    nanaratnavicitramamba paramapritya katham te maya | vyapinyai jagatam tathapi vimalenacchadaye tvam
    param vijnanatmakavasasa parashive grihnishva tat prititah || 8|| hamsasphatikakundasundaratarashrimurtimarye
    shive karpuragarukunkumadimilitairgandhaih katham lepaye | shrutyuktam tava sarvagandhatanugam nirlepanam
    nishkalam brahmatmaikyabhavanubhutivimalajnanakhyagandhaih param || 9|| lagnendujjvalarekhamamba makutam
    manikyadiptyujjvalam kalonmilitacampakambujamahadbilvidalanam sraja | samveshtyahamakhandanirmalaparanandambudhau
    va kada majje manmathavairibhamini vada svanandavaramnidhe || 10|| hrimkarim nigamagamantaviditam
    bhaktya katham tarpaye dhupairguggulusambhavairjagadidam samvyapya nityam sthitam | shrimurtyudbhavavasanabhiradhuna
    divyabhiraradhaye samvidvahnisamarpitakhilajagatkalagarordhupakaih || 11|| sarvajne sakaleshtadananirate
    samadibhih samstute tubhyam kalpayitum pradipamarune sajyam katham shaknuyam | balarkayutakotisundaratano
    bhaktya tathapyancite vijnanatmakadipadiptibhiraham samtarpayamyambike || 12|| kalyanyamba katham
    niveditumaham naivedyamarye shubhe taptashtapadabhajanojjvalamume bhakshyadibhih samyutam | shakshye
    sambhritasarvalokajatharayai tubhyamatyujjvalam vishvasena samarpayami jagadatmaikyannamanandadam
    || 13|| lakshmivanditapadapadmayugale lakshmidhavadyarcite karpurajyalasatsuvarnakalashaprodbhasi
    nirajanam | nanashobhanagitanrittasahitam divyanganabhirdhritam vikshyadyamba mudam prayahi kripaya
    shrikamarajeshvari || 14|| hrimhrimityanubhavyatam hritatamahpunje samastarthade tvatpadabjayuge bhavatvanudinam
    bilvambujarcavidhih | hrimkararnamanuprayuktamarune matsvantajaih svanubhu
  devanagari: प्यानन्दामृतवारिणाहमभिषिञ्चाभ्यादरादम्बिके ॥ ७॥ कल्पय कल्पकवृक्षसम्भवमहत्कौसुम्भवस्त्रद्वयं
    नानारत्नविचित्रमम्ब परमप्रीत्या कथं ते मया । व्यापिन्यै जगतां तथापि विमलेनाच्छादये त्वां परं विज्ञानात्मकवाससा
    परशिवे गृह्णीष्व तत् प्रीतितः ॥ ८॥ हंसस्फाटिककुन्दसुन्दरतरश्रीमूर्तिमार्ये शिवे कर्पूरागरुकुङ्कुमादिमिलितैर्गन्धैः
    कथं लेपये । श्रुत्युक्तां तव सर्वगन्धतनुगां निर्लेपनां निष्कलां ब्रह्मात्मैक्यभवानुभूतिविमलज्ञानाख्यगन्धैः
    परम् ॥ ९॥ लग्नेन्दूज्ज्वलरेखमम्ब मकुटं माणिक्यदीप्त्युज्ज्वलं कालोन्मीलितचम्पकाम्बुजमहद्बिल्वीदलानां
    स्रजा । संवेष्ट्याहमखण्डनिर्मलपरानन्दाम्बुधौ वा कदा मज्जे मन्मथवैरिभामिनि वद स्वानन्दवारांनिधे ॥ १०॥
    ह्रींकारीं निगमागमान्तविदितां भक्त्या कथं तर्पये धूपैर्गुग्गुलुसम्भवैर्जगदिदं संव्याप्य नित्यं स्थितम्
    । श्रीमूर्त्युद्भववासनाभिरधुना दिव्याभिराराधये संविद्वह्निसमर्पिताखिलजगत्कालागरोर्धूपकैः ॥ ११॥ सर्वज्ञे
    सकलेष्टदाननिरते सामादिभिः संस्तुते तुभ्यं कल्पयितुं प्रदीपमरुणे साज्यं कथं शक्नुयाम् । बालार्कायुतकोटिसुन्दरतनो
    भक्त्या तथाप्यञ्चिते विज्ञानात्मकदीपदीप्तिभिरहं संतर्पयाम्यम्बिके ॥ १२॥ कल्याण्यम्ब कथं निवेदितुमहं
    नैवेद्यमार्ये शुभे तप्ताष्टापदभाजनोज्ज्वलमुमे भक्ष्यादिभिः संयुतम् । शक्ष्ये सम्भृतसर्वलोकजठरायै तुभ्यमत्युज्ज्वलं
    विश्वासेन समर्पयामि जगदात्मैक्यान्नमानन्ददम् ॥ १३॥ लक्ष्मीवन्दितपादपद्मयुगले लक्ष्मीधवाद्यर्चिते कर्पूराज्यलसत्सुवर्णकलशप्रोद्भासि
    नीराजनम् । नानाशोभनगीतनृत्तसहितं दिव्याङ्गनाभिर्धृतं वीक्ष्याद्याम्ब मुदं प्रयाहि कृपया श्रीकामराजेश्वरि
    ॥ १४॥ ह्रींह्रीमित्यनुभाव्यतां हृततमःपुञ्जे समस्तार्थदे त्वत्पादाब्जयुगे भवत्वनुदिनं बिल्वाम्बुजार्चाविधिः
    । ह्रींकारार्णमनुप्रयुक्तमरुणे मत्स्वान्तजैः स्वानुभू
