id: annapurnaashtottarashatanamastotram-shivaproktam-shivarahasyantargatam
category: stotram
name:
  english: annapurnaashtottarashatanamastotram shivaproktam (shivarahasyantargatam)
  devanagari: अन्नपूर्णाअष्टोत्तरशतनामस्तोत्रम् शिवप्रोक्तं (शिवरहस्यान्तर्गतम्)
content:
  english: carucandrakaladhara | vishalakshi vishvamata vishvavandya vilasini || 632|| arya kalyananilaya
    rudrani kamalasana | shubhaprada shubha varta vrittapinapayodhara || 633|| amba samsaramathani mrijani
    sarvamangala | vishnusamsevita shuddha brahmadisurasevita || 634|| paramanandada shantih paramanandarupini
    | paramanandajanani paramannapradayini || 635|| paropakaranirata parama bhaktavatsala | purnacandrabhavadana
    purnacandranibhamshuka || 636|| shubhalakshanasampanna shubhanantagunarnava | shubhasaubhagyanilaya
    shubhacararatapriya || 637|| candika candamathani candadarpanivarini | candamartandanayana candragninayana
    sati || 638|| pundarikapura punya punyada punyarupini | punyajneya punyavandya punyamurtih puratana
    || 639|| anavadya vedavedya vedavedantarupini | mayatita srishtamaya srishtadharmatmavandita || 640||
    asrishta sangarahita srishtihetuh kapardini | vrisharudha shulahasta sthitisamharakarini || 641||
    mandasmita shuddharupa shuddhacittamunistuta | mahabhagapati daksha dakshadhvaravinashini || 642||
    aparna'nanyasharana bhaktabhishtaphalaprada | nityasundarasarvangi saccidanandalakshana || 643|| namnamashtottarashatamambayah
    punyakaranam | sarvasaubhagyasidhyartham japaniyam prayatnatah || 644|| idam svastyayanam dhanyam
    mahapatakanashanam | sarvabhishtapradam punyam nityamangaladayakam || 645|| || iti shivarahasyantargate
    shivaproktam annapurna ashtottarashatanamastotram sampurnam ||
  devanagari: चारुचन्द्रकलाधरा । विशालाक्षी विश्वमाता विश्ववन्द्या विलासिनी ॥ ६३२॥ आर्या कल्याणनिलया रुद्राणी
    कमलासना । शुभप्रदा शुभा वार्ता वृत्तपीनपयोधरा ॥ ६३३॥ अम्बा संसारमथनी मृजनी सर्वमङ्गला । विष्णुसंसेविता
    शुद्धा ब्रह्मादिसुरसेविता ॥ ६३४॥ परमानन्ददा शान्तिः परमानन्दरूपिणी । परमानन्दजननी परमान्नप्रदायिनी
    ॥ ६३५॥ परोपकारनिरता परमा भक्तवत्सला । पूर्णचन्द्राभवदना पूर्णचन्द्रनिभांशुका ॥ ६३६॥ शुभलक्षणसम्पन्ना
    शुभानन्तगुणार्णवा । शुभसौभाग्यनिलया शुभाचाररतप्रिया ॥ ६३७॥ चण्डिका चण्डमथनी चण्डदर्पनिवारिणी । चण्डमार्ताण्डनयना
    चन्द्राग्निनयना सती ॥ ६३८॥ पुण्डरीकपुरा पुण्या पुण्यदा पुण्यरूपिणी । पुण्यज्ञेया पुण्यवन्द्या पुण्यमूर्तिः
    पुरातना ॥ ६३९॥ अनवद्या वेदवेद्या वेदवेदान्तरूपिणी । मायातीता सृष्टमाया सृष्टधर्मात्मवन्दिता ॥ ६४०॥
    असृष्टा सङ्गरहिता सृष्टिहेतुः कपर्दिनी । वृषारूढा शूलहस्ता स्थितिसंहारकारिणी ॥ ६४१॥ मन्दस्मिता शुद्धरूपा
    शुद्धचित्तमुनिस्तुता । महाभागपती दक्षा दक्षाध्वरविनाशिनी ॥ ६४२॥ अपर्णाऽनन्यशरणा भक्ताभीष्टफलप्रदा
    । नित्यसुन्दरसर्वाङ्गी सच्चिदानन्दलक्षणा ॥ ६४३॥ नाम्नामष्टोत्तरशतमम्बायाः पुण्यकारणम् । सर्वसौभाग्यसिध्यर्थं
    जपनीयं प्रयत्नतः ॥ ६४४॥ इदं स्वस्त्ययनं धन्यं महापातकनाशनम् । सर्वाभीष्टप्रदं पुण्यं नित्यमङ्गलदायकम्
    ॥ ६४५॥ ॥ इति शिवरहस्यान्तर्गते शिवप्रोक्तं अन्नपूर्णा अष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥
