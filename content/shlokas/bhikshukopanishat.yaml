id: bhikshukopanishat
category: upanishad
name:
  english: bhikshukopanishat
  devanagari: भिक्षुकोपनिषत्
content:
  english: ajayajnavalkyavasishta prabhritayo'shtau grasamshvaranto yogamarge mokshameva prarthayante
    | atha bahudaka nama tridandakamandalushikha yajnopavitakashayavastradharino brahmarshigrihe madhumamsam
    varjayitvashtau grasanbhaikshacaranam kritva yogamarge mokshameva prarthayante | atha hamsa nama grama
    ekaratram nagare pancaratram kshetre saptaratram tadupari na vaseyuh | gomutragomayaharino nityam
    candrayanaparayana yogamarge mokshameva prarthayante | atha paramahamsa nama samvartakarunishvetaketujadabharata
    dattatreyashukavamadevaharitakaprabhritayo'shtau grasamshvaranto yogamarge mokshameva prarthayante
    | vrikshamule shunyagrihe shmashanavasino va sambara va digambara va | na tesham dharmadharmau labhalabhau
    shuddhashuddhau dvaitavarjita samaloshtashmakancanah sarvavarneshu bhaikshacaranam kritva sarvatratmaiveti
    pashyanti | atha jatarupadhara nirdvandva nishparigrahah shukladhyanaparayana atmanishtah pranasamdharanarthe
    yathoktakale bhaikshamacarantah shunyagaradevagriha trinakutavalmikavrikshamulakulalashalagnihotrashalanadipulina
    girikandarakuharakotaranirjharasthandile tatra brahmamarge samyaksampannah shuddhamanasah paramahamsacaranena
    samnyasena dehatyagam kurvanti te paramahamsa nametyupanishat || om purnamadah purnamidam purnat purnamudacyate
    | purnasya purnamadaya purnamevavashishyate || om shantih shantih shantih || iti bhikshukopanishatsamapta
    || adhikadhyayanaya
  devanagari: आजयाज्ञवल्क्यवसिष्ट प्रभृतयोऽष्टौ ग्रासांश्वरन्तो योगमार्गे मोक्षमेव प्रार्थयन्ते । अथ बहूदका
    नाम त्रिदण्डकमण्डलुशिखा यज्ञोपवीतकाषायवस्त्रधारिणो ब्रह्मर्षिगृहे मधुमांसं वर्जयित्वाष्टौ ग्रासान्भैक्षाचरणं
    कृत्वा योगमार्गे मोक्षमेव प्रार्थयन्ते । अथ हंसा नाम ग्राम एकरात्रं नगरे पञ्चरात्रं क्षेत्रे सप्तरात्रं
    तदुपरि न वसेयुः । गोमूत्रगोमयाहारिणो नित्यं चान्द्रायणपरायणा योगमार्गे मोक्षमेव प्रार्थयन्ते । अथ
    परमहंसा नाम संवर्तकारुणिश्वेतकेतुजडभरत दत्तात्रेयशुकवामदेवहारीतकप्रभृतयोऽष्टौ ग्रासांश्वरन्तो योगमार्गे
    मोक्षमेव प्रार्थयन्ते । वृक्षमूले शून्यगृहे श्मशानवासिनो वा साम्बरा वा दिगम्बरा वा । न तेषां धर्माधर्मौ
    लाभालाभौ शुद्धाशुद्धौ द्वैतवर्जिता समलोष्टाश्मकाञ्चनाः सर्ववर्णेषु भैक्षाचरणं कृत्वा सर्वत्रात्मैवेति
    पश्यन्ति । अथ जातरूपधरा निर्द्वन्द्वा निष्परिग्रहाः शुक्लध्यानपरायणा आत्मनिष्टाः प्राणसंधारणार्थे
    यथोक्तकाले भैक्षमाचरन्तः शून्यागारदेवगृह तृणकूटवल्मीकवृक्षमूलकुलालशालाग्निहोत्रशालानदीपुलिन गिरिकन्दरकुहरकोटरनिर्झरस्थण्डिले
    तत्र ब्रह्ममार्गे सम्यक्संपन्नाः शुद्धमानसाः परमहंसाचरणेन संन्यासेन देहत्यागं कुर्वन्ति ते परमहंसा
    नामेत्युपनिषत् ॥ ॐ पूर्णमदः पूर्णमिदं पूर्णात् पूर्णमुदच्यते । पूर्णस्य पूर्णमादाय पूर्णमेवावशिष्यते
    ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ इति भिक्षुकोपनिषत्समाप्ता ॥ अधिकाध्ययनाय
