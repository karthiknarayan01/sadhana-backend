id: sri-shanmukha-shatkam
category: stotram
name:
  english: Sri Shanmukha Shatkam
content:
  english: giritanayasuta gangapayodita gandhasuvasita balatano gunaganabhushana komalabhashana krauncavidarana
    kundatano | gajamukhasodara durjayadanavasanghavinashaka divyatano jaya jaya he guha shanmukha sundara
    dehi ratim tava padayuge || || pratigirisamsthita bhaktahridisthita putradhanaprada ramyatano bhavabhayamocaka
    bhagyavidhayaka bhusutavara supujyatano | bahubhujashobhita bandhavimocaka bodhaphalaprada bodhatano
    jaya jaya he guha shanmukha sundara dehi ratim tava padayuge || || shamadhanamanita maunihridalaya
    mokshakridalaya mugdhatano shatamakhapalaka shankaratoshaka shankhasuvadaka shaktitano | dashashatamanmatha
    sannibhasundara kundalamandita karnavibho jaya jaya he guha shanmukha sundara dehi ratim tava padayuge
    || || guha tarunarunacelaparishkrita tarakamaraka maratano jalanidhitirasushobhivaralaya shankarasannuta
    devaguro | vihitamahadhvarasamanimantrita saumyahridantara somatano jaya jaya he guha shanmukha sundara
    dehi ratim tava padayuge || || lavalikaya saha kelikalapara devasutarpita malyatano gurupadasamsthita
    shankaradarshita tattvamayapranavarthavibho | vidhiharipujita brahmasutarpita bhagyasupuraka yogitano
    jaya jaya he guha shanmukha sundara dehi ratim tava padayuge || || kalijanapalana kanjasulocana kukkutaketana
    kelitano kritabalipalana barhinavahana phalavilocanashambhutano | sharavanasambhava shatrunibarhana
    candrasamanana sharmatano jaya jaya he guha shanmukha sundara dehi ratim tava padayuge || || sukhadamanantapadanvita
    ramasudikshita satkavipadyamidam sharavana sambhava toshadamishtadamashtasusiddhidamartiharam | pathati
    shrinoti ca bhaktiyuto yadi bhagyasamriddhimatho labhate jaya jaya he guha shanmukha sundara dehi
    ratim tava padayuge || || iti shrianantaramadikshita kritam shanmukha shatkam ||
  devanagari: गिरितनयासुत गाङ्गपयोदित गन्धसुवासित बालतनो गुणगणभूषण कोमलभाषण क्रौञ्चविदारण कुन्दतनो । गजमुखसोदर
    दुर्जयदानवसङ्घविनाशक दिव्यतनो जय जय हे गुह षण्मुख सुन्दर देहि रतिं तव पादयुगे ॥ ॥ प्रतिगिरिसंस्थित
    भक्तहृदिस्थित पुत्रधनप्रद रम्यतनो भवभयमोचक भाग्यविधायक भूसुतवार सुपूज्यतनो । बहुभुजशोभित बन्धविमोचक
    बोधफलप्रद बोधतनो जय जय हे गुह षण्मुख सुन्दर देहि रतिं तव पादयुगे ॥ ॥ शमधनमानित मौनिहृदालय मोक्षकृदालय
    मुग्धतनो शतमखपालक शङ्करतोषक शङ्खसुवादक शक्तितनो । दशशतमन्मथ सन्निभसुन्दर कुण्डलमण्डित कर्णविभो जय
    जय हे गुह षण्मुख सुन्दर देहि रतिं तव पादयुगे ॥ ॥ गुह तरुणारुणचेलपरिष्कृत तारकमारक मारतनो जलनिधितीरसुशोभिवरालय
    शङ्करसन्नुत देवगुरो । विहितमहाध्वरसामनिमन्त्रित सौम्यहृदन्तर सोमतनो जय जय हे गुह षण्मुख सुन्दर देहि
    रतिं तव पादयुगे ॥ ॥ लवलिकया सह केलिकलापर देवसुतार्पित माल्यतनो गुरुपदसंस्थित शङ्करदर्शित तत्त्वमयप्रणवार्थविभो
    । विधिहरिपूजित ब्रह्मसुतार्पित भाग्यसुपूरक योगितनो जय जय हे गुह षण्मुख सुन्दर देहि रतिं तव पादयुगे
    ॥ ॥ कलिजनपालन कञ्जसुलोचन कुक्कुटकेतन केलितनो कृतबलिपालन बर्हिणवाहन फालविलोचनशम्भुतनो । शरवणसम्भव शत्रुनिबर्हण
    चन्द्रसमानन शर्मतनो जय जय हे गुह षण्मुख सुन्दर देहि रतिं तव पादयुगे ॥ ॥ सुखदमनन्तपदान्वित रामसुदीक्षित
    सत्कविपद्यमिदं शरवण सम्भव तोषदमिष्टदमष्टसुसिद्धिदमार्तिहरम् । पठति शृणोति च भक्तियुतो यदि भाग्यसमृद्धिमथो
    लभते जय जय हे गुह षण्मुख सुन्दर देहि रतिं तव पादयुगे ॥ ॥ इति श्रीअनन्तरामदीक्षित कृतं षण्मुख षट्कम्
    ॥
