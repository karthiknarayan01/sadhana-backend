id: sri-dattatreya-vajra-kavacham
category: stotram
name:
  english: Sri Dattatreya Vajra Kavacham
content:
  english: rishaya ucuh | katham sankalpasiddhih syadvedavyasa kalauyuge | dharmarthakamamokshanam sadhanam
    kimudahritam || || vyasa uvaca | shrinvantu rishayassarve shighram sankalpasadhanam | sakriduccaramatrena
    bhogamokshapradayakam || || gaurishringe himavatah kalpavrikshopashobhitam | dipte divyamaharatna
    hemamandapamadhyagam || || ratnasimhasanasinam prasannam parameshvaram | mandasmitamukhambhojam shankaram
    praha parvati || || shridevi uvaca | devadeva mahadeva lokashankara shankara | mantrajalani sarvani
    yantrajalani kritsnashah || || tantrajalanyanekani maya tvattah shrutani vai | idanim drashtumicchami
    visheshena mahitalam || || ityudiritamakarnya parvatya parameshvarah | karenamrijya santoshat parvatim
    pratyabhashata || || mayedanim tvaya sardham vrishamaruhya gamyate | ityuktva vrishamaruhya parvatya
    saha shankarah || || yayau bhumandalam drashtum gauryashcitrani darshayan | kvacit vindhyacalaprante
    maharanye sudurgame || || tatra vyahartumayantam bhillam parashudharinam | vadhyamanam mahavyaghram
    nakhadamshtrabhiravritam || || ativa citracaritryam vajrakayasamayutam | aprayatnamanayasamakhinnam
    sukhamasthitam || || palayantam mrigam pashcadvyaghro bhitya palayatah | etadashcaryamalokya parvati
    praha shankaram || || shri parvatyuvaca | kimashcaryam kimashcaryamagre shambho nirikshyatam | ityuktah
    sa tatah shambhurdrishtva praha puranavit || || shri shankara uvaca | gauri vakshyami te citramavanmanasagocaram
    | adrishtapurvamasmabhirnasti kincinna kutracit || || maya samyak samasena vakshyate shrinu parvati
    | ayam durashrava nama bhillah paramadharmikah || || samitkushaprasunani kandamulaphaladikam | pratyaham
    vipinam gatva samadaya prayasatah || || priye purvam munindrebhyah prayacchati na vanchati | te'pi
    tasminnapi dayam kurvate sarvamauninah || || daladano mahayogi vasanneva nijashrame | kadacidasmarat
    siddham dattatreyam digambaram || || dattatreyah smartrigami cetihasam parikshitum | tat kshanat so'pi
    yogindro dattatreyah samutthitah || || tam drishtvashcaryatoshabhyam daladanamahamunih | sampujyagre
    vishidantam dattatreyamuvaca tam || || mayopahutah samprapto dattatreya mahamune | smartrigami tvamityetat
    kim vadanti parikshitum || || mayadya samsmrito'si tvamaparadham kshamasva me | dattatreyo munim praha
    mama prakritiridrishi || || abhaktya va subhaktya va yah smarennamananyadhih | tadanim tamupagamya
    dadami tadabhipsitam || || dattatreyo munim praha daladanamunishvaram | yadishtam tadvrinishva tvam
    yat prapto'ham tvaya smritah || || dattatreyam munim praha maya kimapi nocyate | tvaccitte yat sthitam
    tanme prayaccha munipungava || || shri dattatreya uvaca | mamasti vajrakavacam grihanetyavadanmunim
    | tathetyangikritavate daladamunaye munih || || svavajrakavacam praha rishicchandah purassaram | nyasam
    dhyanam phalam tatra prayojanamasheshatah || || asya shridattatreya vajrakavaca stotramantrasya kiratarupi
    maharudrrishih shridattatreyo devata om atmane namah om drim manase namah om am drim shrim sauh om
    klam klim klum klaim klaum klah shri dattatreya prasada siddhyarthe jape viniyogah karanyasah | om
    dram angushthabhyam namah | om drim tarjanibhyam namah | om drum madhyamabhyam namah | om draim anamikabhyam
    namah | om draum kanishthikabhyam namah | om drah karatalakaraprishthabhyam namah | hridayadinyasah
    | om dram hridayaya namah | om drim shirase svaha | om drum shikhayai vashat | om draim kavacaya hum
    | om draum netratrayaya vaushat | om drah astraya phat | om bhurbhuvassuvaromiti digbandhah | dhyanam
    | jagadankurakandaya saccidanandamurtaye | dattatreyaya yogindracandraya paramatmane || || kada yogi
    kada bhogi kada nagnah pishacavat | dattatreyo harih sakshat bhuktimuktipradayakah || || varanasipurasnayi
    kòlhapurajapadarah | mahuripurabhikshashi sahyashayi digambarah || || indranila samakarah candrakantisamadyutih
    | vaidhurya sadrishasphurtih calatkincijjatadharah || || snigdhadhavalya yuktaksho'tyantanila kaninikah
    | bhruvakshahshmashrunilankah shashankasadrishananah || || hasanirjita niharah kanthanirjita kambukah
    | mamsalamso dirghabahuh paninirjitapallavah || || vishalapinavakshashca tamrapanirdalodarah | prithulashronilalito
    vishalajaghanasthalah || || rambhastambhopamanoruh janupurvaikajanghakah | gudhagulphah kurmaprishtho
    lasatvadoparisthalah || || raktaravindasadrisha ramaniya padadharah | carmambaradharo yogi smartrigami
    kshanekshane || || jnanopadeshanirato vipaddharanadikshitah | siddhasanasamasina rijukayo hasanmukhah
    || || vamahastena varado dakshinenabhayankarah | balonmatta pishacibhih kvacid yuktah parikshitah
    || || tyagi bhogi mahayogi nityanando niranjanah | sarvarupi sarvadata sarvagah sarvakamadah || ||
    bhasmoddhulita sarvango mahapatakanashanah | bhuktiprado muktidata jivanmukto na samshayah || || evam
    dhyatva'nanyacitto madvajrakavacam pathet | mameva pashyansarvatra sa maya saha sancaret || || digambaram
    bhasmasugandha lepanam cakram trishulam dhamarum gadayudham | padmasanam yogimunindravanditam dattetinamasmaranena
    nityam || || pancopacarapuja | om lam prithivitattvatmane shridattatreyaya namah | gandham parikalpayami|
    om ham akashatattvatmane shridattatreyaya namah | pushpam parikalpayami | om yam vayutattvatmane shridattatreyaya
    namah | dhupam parikalpayami | om ram vahnitattvatmane shridattatreyaya namah | dipam parikalpayami
    | om vam amrita tattvatmane shridattatreyaya namah | amritanaivedyam parikalpayami | om sam sarvatattvatmane
    shridattatreyaya namah | tambuladisarvopacaran parikalpayami | iti mulamantram ashtottarashatavaram
    atha vajrakavacam | om dattatreyaya shirahpatu sahasrabjeshu samsthitah | phalam patvanasuyeyah candramandalamadhyagah
    || || kurcam manomayah patu ham ksham dvidalapadmabhuh | jyotirupo'kshinipatu patu shabdatmakah shruti
    || || nasikam patu gandhatma mukham patu rasatmakah | jihvam vedatmakah patu dantoshthau patu dharmikah
    || || kapolavatribhuh patu patvashesham mamatmavit | sarvatma shodasharabjasthitah svatma'vatad galam
    || || skandhau candranujah patu bhujau patu kritadibhuh | jatruni shatrujit patu patu vakshasthalam
    harih || || kadithantadvadasharapadmago marudatmakah | yogishvareshvarah patu hridayam hridayasthitah
    || || parshve harih parshvavarti patu parshvasthitah smritah | hathayogadiyogajnah kukshim patu kripanidhih
    || || dakaradi phakaranta dasharasarasiruhe | nabhisthale vartamano nabhim vahnyatmako'vatu || ||
    vahnitattvamayo yogi rakshatanmanipurakam | katim katisthabrahmandavasudevatmako'vatu || || vakaradi
    lakaranta shatpatrambujabodhakah | jalatattvamayo yogi svadhishthanam mamavatu || || siddhasana samasina
    uru siddheshvaro'vatu | vadisanta catushpatrasaroruha nibodhakah || || muladharam mahirupo rakshatad
    viryanigrahi | prishtham ca sarvatah patu janunyastakarambujah || || janghe patvavadhutendrah patvanghri
    tirthapavanah | sarvangam patu sarvatma romanyavatu keshavah || || carma carmambarah patu raktam bhaktipriyo'vatu
    | mamsam mamsakarah patu majjam majjatmako'vatu || || asthini sthiradhih payanmedham vedhah prapalayet
    | shukram sukhakarah patu cittam patu dridhakritih || || manobuddhimahankaram hrishikeshatmako'vatu
    | karmendriyani patvishah patu jnanendriyanyajah || || bandhun bandhuttamah payacchatrubhyah patu
    shatrujit | griharamadhanakshetraputradin shankaro'vatu || || bharyam prakritivit patu pashvadin patu
    shar ngabhrit | pranan patu pradhanajno bhakshyadin patu bhaskarah || || sukham candratmakah patu
    duhkhat patu purantakah | pashun pashupatih patu bhutim bhuteshvaro mama || || pracyam vishaharah
    patu patvagneyyam makhatmakah | yamyam dharmatmakah patu nairrityam sarvavairihrit || || varahah patu
    varunyam vayavyam pranado'vatu | kauberyam dhanadah patu patvaishanyam mahaguruh || || urdhvam patu
    mahasiddhah patvadhastajjatadharah | rakshahinam tu yat sthanam rakshatvadimunishvarah || || karanyasah
    | om dram angushthabhyam namah | om drim tarjanibhyam namah | om drum madhyamabhyam namah | om draim
    anamikabhyam namah | om draum kanishthikabhyam namah | om drah karatalakaraprishthabhyam namah | hridayadinyasah
    | om dram hridayaya namah | om drim shirase svaha | om drum shikhayai vashat | om draim kavacaya hum
    | om draum netratrayaya vaushat | om drah astraya phat | om bhurbhuvassuvaromiti digvimokah | phalashriti
    || etanme vajrakavacam yah pathet shrinuyadapi | vajrakayashciranjivi dattatreyo'hamabruvam || ||
    tyagi bhogi mahayogi sukhaduhkhavivarjitah | sarvatra siddhasankalpo jivanmukto'dyavartate || || ityuktvantardadhe
    yogi dattatreyo digambarah | daladano'pi tajjaptva jivanmuktah sa vartate || || bhillo durashrava
    nama tadanim shrutavanidam | sakricchravanamatrena vajrango'bhavadapyasau || || ityetad vajrakavacam
    dattatreyasya yoginah | shrutva shesham shambhumukhat punarapyaha parvati || || shri parvatyuvaca
    | etat kavaca mahatmyam vada vistarato mama | kutra kena kada japyam kiyajjapyam katham katham ||
    || uvaca shambhustat sarvam parvatya vinayoditam | shriparameshvara uvaca | shrinu parvati vakshyami
    samahitamanavilam || || dharmarthakamamokshanamidameva parayanam | hastyashvarathapadati sarvaishvarya
    pradayakam || || putramitrakalatradi sarvasantoshasadhanam | vedashastradividyanam vidhanam paramam
    hi tat || || sangita shastra sahitya satkavitva vidhayakam | buddhi vidya smriti prajna mati praudhipradayakam
    || || sarvasantoshakaranam sarvaduhkhanivaranam | shatrusamharakam shighram yashahkirtivivardhanam
    || || ashtasankhya maharogah sannipatastrayodasha | shannavatyakshirogashca vimshatirmeharogakah ||
    || ashtadashatu kushthani gulmanyashtavidhanyapi | ashitirvatarogashca catvarimshattu paittikah ||
    || vimshatih shleshmarogashca kshayacaturthikadayah | mantrayantrakuyogadyah kalpatantradinirmitah
    || || brahmarakshasa vetalakushmandadi grahodbhavah | sangaja deshakalasthastapatrayasamutthitah ||
    || navagrahasamudbhuta mahapataka sambhavah | sarve rogah pranashyanti sahasravartanad dhruvam ||
    || ayutavrittimatrena vandhya putravati bhavet | ayutadvitayavrittya hyapamrityujayo bhavet || ||
    ayutatritayaccaiva khecaratvam prajayate | sahasrayutadarvak sarvakaryani sadhayet || || lakshavrittya
    sarvasiddhirbhavatyeva na samshayah || || vishavrikshasya muleshu tishthan vai dakshinamukhah | kurute
    masamatrena vairinam vikalendriyam || || audumbaratarormule vriddhikamena japyate | shrivrikshamule
    shrikami tintrini shantikarmani || || ojaskamo'shvatthamule strikamaih sahakarake | jnanarthi tulasimule
    garbhagehe sutarthibhih || || dhanarthibhistu sukshetre pashukamaistu goshthake | devalaye sarvakamaistatkale
    sarvadarshitam || || nabhimatrajale sthitva bhanumalokya yo japet | yuddhe va shastravade va sahasrena
    jayo bhavet || || kanthamatre jale sthitva yo ratrau kavacam pathet | jvarapasmarakushthadi tapajvaranivaranam
    || || yatra yat syat sthiram yadyat prasaktam tannivartate | tena tatra hi japtavyam tatah siddhirbhaveddhruvam
    || || ityuktavan shivo gaurvai rahasyam paramam shubham | yah pathet vajrakavacam dattatreya samo
    bhavet || || evam shivena kathitam himavatsutayai proktam daladamunaye'trisutena purvam | yah ko'pi
    vajrakavacam pathatiha loke dattopamashcarati yogivarashcirayuh || || iti shri rudrayamale himavatkhande
    mantrashastre umamaheshvarasamvade shri dattatreya vajrakavacastotram sampurnam ||
  devanagari: ऋषय ऊचुः । कथं सङ्कल्पसिद्धिः स्याद्वेदव्यास कलौयुगे । धर्मार्थकाममोक्षाणां साधनं किमुदाहृतम्
    ॥ ॥ व्यास उवाच । शृण्वन्तु ऋषयस्सर्वे शीघ्रं सङ्कल्पसाधनम् । सकृदुच्चारमात्रेण भोगमोक्षप्रदायकम् ॥
    ॥ गौरीशृङ्गे हिमवतः कल्पवृक्षोपशोभितम् । दीप्ते दिव्यमहारत्न हेममण्डपमध्यगम् ॥ ॥ रत्नसिंहासनासीनं
    प्रसन्नं परमेश्वरम् । मन्दस्मितमुखाम्भोजं शङ्करं प्राह पार्वती ॥ ॥ श्रीदेवी उवाच । देवदेव महादेव लोकशङ्कर
    शङ्कर । मन्त्रजालानि सर्वाणि यन्त्रजालानि कृत्स्नशः ॥ ॥ तन्त्रजालान्यनेकानि मया त्वत्तः श्रुतानि वै
    । इदानीं द्रष्टुमिच्छामि विशेषेण महीतलम् ॥ ॥ इत्युदीरितमाकर्ण्य पार्वत्या परमेश्वरः । करेणामृज्य सन्तोषात्
    पार्वतीं प्रत्यभाषत ॥ ॥ मयेदानीं त्वया सार्धं वृषमारुह्य गम्यते । इत्युक्त्वा वृषमारुह्य पार्वत्या
    सह शङ्करः ॥ ॥ ययौ भूमण्डलं द्रष्टुं गौर्याश्चित्राणि दर्शयन् । क्वचित् विन्ध्याचलप्रान्ते महारण्ये
    सुदुर्गमे ॥ ॥ तत्र व्याहर्तुमायान्तं भिल्लं परशुधारिणम् । वध्यमानं महाव्याघ्रं नखदंष्ट्राभिरावृतम्
    ॥ ॥ अतीव चित्रचारित्र्यं वज्रकायसमायुतम् । अप्रयत्नमनायासमखिन्नं सुखमास्थितम् ॥ ॥ पलायन्तं मृगं पश्चाद्व्याघ्रो
    भीत्या पलायतः । एतदाश्चर्यमालोक्य पार्वती प्राह शङ्करम् ॥ ॥ श्री पार्वत्युवाच । किमाश्चर्यं किमाश्चर्यमग्रे
    शम्भो निरीक्ष्यताम् । इत्युक्तः स ततः शम्भुर्दृष्ट्वा प्राह पुराणवित् ॥ ॥ श्री शङ्कर उवाच । गौरि वक्ष्यामि
    ते चित्रमवाङ्मानसगोचरम् । अदृष्टपूर्वमस्माभिर्नास्ति किञ्चिन्न कुत्रचित् ॥ ॥ मया सम्यक् समासेन वक्ष्यते
    शृणु पार्वति । अयं दूरश्रवा नाम भिल्लः परमधार्मिकः ॥ ॥ समित्कुशप्रसूनानि कन्दमूलफलादिकम् । प्रत्यहं
    विपिनं गत्वा समादाय प्रयासतः ॥ ॥ प्रिये पूर्वं मुनीन्द्रेभ्यः प्रयच्छति न वाञ्छति । तेऽपि तस्मिन्नपि
    दयां कुर्वते सर्वमौनिनः ॥ ॥ दलादनो महायोगी वसन्नेव निजाश्रमे । कदाचिदस्मरत् सिद्धं दत्तात्रेयं दिगम्बरम्
    ॥ ॥ दत्तात्रेयः स्मर्तृगामी चेतिहासं परीक्षितुम् । तत् क्षणात् सोऽपि योगीन्द्रो दत्तात्रेयः समुत्थितः
    ॥ ॥ तं दृष्ट्वाश्चर्यतोषाभ्यां दलादनमहामुनिः । सम्पूज्याग्रे विषीदन्तं दत्तात्रेयमुवाच तम् ॥ ॥ मयोपहूतः
    सम्प्राप्तो दत्तात्रेय महामुने । स्मर्तृगामी त्वमित्येतत् किं वदन्ती परीक्षितुम् ॥ ॥ मयाद्य संस्मृतोऽसि
    त्वमपराधं क्षमस्व मे । दत्तात्रेयो मुनिं प्राह मम प्रकृतिरीदृशी ॥ ॥ अभक्त्या वा सुभक्त्या वा यः स्मरेन्नामनन्यधीः
    । तदानीं तमुपागम्य ददामि तदभीप्सितम् ॥ ॥ दत्तात्रेयो मुनिं प्राह दलादनमुनीश्वरम् । यदिष्टं तद्वृणीष्व
    त्वं यत् प्राप्तोऽहं त्वया स्मृतः ॥ ॥ दत्तात्रेयं मुनिं प्राह मया किमपि नोच्यते । त्वच्चित्ते यत्
    स्थितं तन्मे प्रयच्छ मुनिपुङ्गव ॥ ॥ श्री दत्तात्रेय उवाच । ममास्ति वज्रकवचं गृहाणेत्यवदन्मुनिम् ।
    तथेत्यङ्गीकृतवते दलादमुनये मुनिः ॥ ॥ स्ववज्रकवचं प्राह ऋषिच्छन्दः पुरस्सरम् । न्यासं ध्यानं फलं तत्र
    प्रयोजनमशेषतः ॥ ॥ अस्य श्रीदत्तात्रेय वज्रकवच स्तोत्रमन्त्रस्य किरातरूपी महारुद्रृषिः श्रीदत्तात्रेयो
    देवता ॐ आत्मने नमः ॐ द्रीं मनसे नमः ॐ आं द्रीं श्रीं सौः ॐ क्लां क्लीं क्लूं क्लैं क्लौं क्लः श्री
    दत्तात्रेय प्रसाद सिद्ध्यर्थे जपे विनियोगः करन्यासः । ॐ द्रां अङ्गुष्ठाभ्यां नमः । ॐ द्रीं तर्जनीभ्यां
    नमः । ॐ द्रूं मध्यमाभ्यां नमः । ॐ द्रैं अनामिकाभ्यां नमः । ॐ द्रौं कनिष्ठिकाभ्यां नमः । ॐ द्रः करतलकरपृष्ठाभ्यां
    नमः । हृदयादिन्यासः । ॐ द्रां हृदयाय नमः । ॐ द्रीं शिरसे स्वाहा । ॐ द्रूं शिखायै वषट् । ॐ द्रैं कवचाय
    हुम् । ॐ द्रौं नेत्रत्रयाय वौषट् । ॐ द्रः अस्त्राय फट् । ॐ भूर्भुवस्सुवरोमिति दिग्बन्धः । ध्यानम्
    । जगदङ्कुरकन्दाय सच्चिदानन्दमूर्तये । दत्तात्रेयाय योगीन्द्रचन्द्राय परमात्मने ॥ ॥ कदा योगी कदा भोगी
    कदा नग्नः पिशाचवत् । दत्तात्रेयो हरिः साक्षात् भुक्तिमुक्तिप्रदायकः ॥ ॥ वाराणसीपुरस्नायी कॊल्हापुरजपादरः
    । माहुरीपुरभीक्षाशी सह्यशायी दिगम्बरः ॥ ॥ इन्द्रनील समाकारः चन्द्रकान्तिसमद्युतिः । वैढूर्य सदृशस्फूर्तिः
    चलत्किञ्चिज्जटाधरः ॥ ॥ स्निग्धधावल्य युक्ताक्षोऽत्यन्तनील कनीनिकः । भ्रूवक्षःश्मश्रुनीलाङ्कः शशाङ्कसदृशाननः
    ॥ ॥ हासनिर्जित निहारः कण्ठनिर्जित कम्बुकः । मांसलांसो दीर्घबाहुः पाणिनिर्जितपल्लवः ॥ ॥ विशालपीनवक्षाश्च
    ताम्रपाणिर्दलोदरः । पृथुलश्रोणिललितो विशालजघनस्थलः ॥ ॥ रम्भास्तम्भोपमानोरुः जानुपूर्वैकजङ्घकः । गूढगुल्फः
    कूर्मपृष्ठो लसत्वादोपरिस्थलः ॥ ॥ रक्तारविन्दसदृश रमणीय पदाधरः । चर्माम्बरधरो योगी स्मर्तृगामी क्षणेक्षणे
    ॥ ॥ ज्ञानोपदेशनिरतो विपद्धरणदीक्षितः । सिद्धासनसमासीन ऋजुकायो हसन्मुखः ॥ ॥ वामहस्तेन वरदो दक्षिणेनाभयङ्करः
    । बालोन्मत्त पिशाचीभिः क्वचिद् युक्तः परीक्षितः ॥ ॥ त्यागी भोगी महायोगी नित्यानन्दो निरञ्जनः । सर्वरूपी
    सर्वदाता सर्वगः सर्वकामदः ॥ ॥ भस्मोद्धूलित सर्वाङ्गो महापातकनाशनः । भुक्तिप्रदो मुक्तिदाता जीवन्मुक्तो
    न संशयः ॥ ॥ एवं ध्यात्वाऽनन्यचित्तो मद्वज्रकवचं पठेत् । मामेव पश्यन्सर्वत्र स मया सह सञ्चरेत् ॥ ॥
    दिगम्बरं भस्मसुगन्ध लेपनं चक्रं त्रिशूलं ढमरुं गदायुधम् । पद्मासनं योगिमुनीन्द्रवन्दितं दत्तेतिनामस्मरणेन
    नित्यम् ॥ ॥ पञ्चोपचारपूजा । ॐ लं पृथिवीतत्त्वात्मने श्रीदत्तात्रेयाय नमः । गन्धं परिकल्पयामि। ॐ हं
    आकाशतत्त्वात्मने श्रीदत्तात्रेयाय नमः । पुष्पं परिकल्पयामि । ॐ यं वायुतत्त्वात्मने श्रीदत्तात्रेयाय
    नमः । धूपं परिकल्पयामि । ॐ रं वह्नितत्त्वात्मने श्रीदत्तात्रेयाय नमः । दीपं परिकल्पयामि । ॐ वं अमृत
    तत्त्वात्मने श्रीदत्तात्रेयाय नमः । अमृतनैवेद्यं परिकल्पयामि । ॐ सं सर्वतत्त्वात्मने श्रीदत्तात्रेयाय
    नमः । ताम्बूलादिसर्वोपचारान् परिकल्पयामि । इति मूलमन्त्रं अष्टोत्तरशतवारं अथ वज्रकवचम् । ॐ दत्तात्रेयाय
    शिरःपातु सहस्राब्जेषु संस्थितः । फालं पात्वानसूयेयः चन्द्रमण्डलमध्यगः ॥ ॥ कूर्चं मनोमयः पातु हं क्षं
    द्विदलपद्मभूः । ज्योतिरूपोऽक्षिणीपातु पातु शब्दात्मकः श्रुती ॥ ॥ नासिकां पातु गन्धात्मा मुखं पातु
    रसात्मकः । जिह्वां वेदात्मकः पातु दन्तोष्ठौ पातु धार्मिकः ॥ ॥ कपोलावत्रिभूः पातु पात्वशेषं ममात्मवित्
    । सर्वात्मा षोडशाराब्जस्थितः स्वात्माऽवताद् गलम् ॥ ॥ स्कन्धौ चन्द्रानुजः पातु भुजौ पातु कृतादिभूः
    । जत्रुणी शत्रुजित् पातु पातु वक्षस्थलं हरिः ॥ ॥ कादिठान्तद्वादशारपद्मगो मरुदात्मकः । योगीश्वरेश्वरः
    पातु हृदयं हृदयस्थितः ॥ ॥ पार्श्वे हरिः पार्श्ववर्ती पातु पार्श्वस्थितः स्मृतः । हठयोगादियोगज्ञः कुक्षिं
    पातु कृपानिधिः ॥ ॥ डकारादि फकारान्त दशारसरसीरुहे । नाभिस्थले वर्तमानो नाभिं वह्न्यात्मकोऽवतु ॥ ॥ वह्नितत्त्वमयो
    योगी रक्षतान्मणिपूरकम् । कटिं कटिस्थब्रह्माण्डवासुदेवात्मकोऽवतु ॥ ॥ वकारादि लकारान्त षट्पत्राम्बुजबोधकः
    । जलतत्त्वमयो योगी स्वाधिष्ठानं ममावतु ॥ ॥ सिद्धासन समासीन ऊरू सिद्धेश्वरोऽवतु । वादिसान्त चतुष्पत्रसरोरुह
    निबोधकः ॥ ॥ मूलाधारं महीरूपो रक्षताद् वीर्यनिग्रही । पृष्ठं च सर्वतः पातु जानुन्यस्तकराम्बुजः ॥ ॥
    जङ्घे पात्ववधूतेन्द्रः पात्वङ्घ्री तीर्थपावनः । सर्वाङ्गं पातु सर्वात्मा रोमाण्यवतु केशवः ॥ ॥ चर्म
    चर्माम्बरः पातु रक्तं भक्तिप्रियोऽवतु । मांसं मांसकरः पातु मज्जां मज्जात्मकोऽवतु ॥ ॥ अस्थीनि स्थिरधीः
    पायान्मेधां वेधाः प्रपालयेत् । शुक्रं सुखकरः पातु चित्तं पातु दृढाकृतिः ॥ ॥ मनोबुद्धिमहङ्कारं हृषीकेशात्मकोऽवतु
    । कर्मेन्द्रियाणि पात्वीशः पातु ज्ञानेन्द्रियाण्यजः ॥ ॥ बन्धून् बन्धूत्तमः पायाच्छत्रुभ्यः पातु शत्रुजित्
    । गृहारामधनक्षेत्रपुत्रादीन् शङ्करोऽवतु ॥ ॥ भार्यां प्रकृतिवित् पातु पश्वादीन् पातु शार् ङ्गभृत् ।
    प्राणान् पातु प्रधानज्ञो भक्ष्यादीन् पातु भास्करः ॥ ॥ सुखं चन्द्रात्मकः पातु दुःखात् पातु पुरान्तकः
    । पशून् पशुपतिः पातु भूतिं भूतेश्वरो मम ॥ ॥ प्राच्यां विषहरः पातु पात्वाग्नेय्यां मखात्मकः । याम्यां
    धर्मात्मकः पातु नैरृत्यां सर्ववैरिहृत् ॥ ॥ वराहः पातु वारुण्यां वायव्यां प्राणदोऽवतु । कौबेर्यां धनदः
    पातु पात्वैशान्यां महागुरुः ॥ ॥ ऊर्ध्वं पातु महासिद्धः पात्वधस्ताज्जटाधरः । रक्षाहीनं तु यत् स्थानं
    रक्षत्वादिमुनीश्वरः ॥ ॥ करन्यासः । ॐ द्रां अङ्गुष्ठाभ्यां नमः । ॐ द्रीं तर्जनीभ्यां नमः । ॐ द्रूं
    मध्यमाभ्यां नमः । ॐ द्रैं अनामिकाभ्यां नमः । ॐ द्रौं कनिष्ठिकाभ्यां नमः । ॐ द्रः करतलकरपृष्ठाभ्यां
    नमः । हृदयादिन्यासः । ॐ द्रां हृदयाय नमः । ॐ द्रीं शिरसे स्वाहा । ॐ द्रूं शिखायै वषट् । ॐ द्रैं कवचाय
    हुम् । ॐ द्रौं नेत्रत्रयाय वौषट् । ॐ द्रः अस्त्राय फट् । ॐ भूर्भुवस्सुवरोमिति दिग्विमोकः । फलशृति
    ॥ एतन्मे वज्रकवचं यः पठेत् शृणुयादपि । वज्रकायश्चिरञ्जीवी दत्तात्रेयोऽहमब्रुवम् ॥ ॥ त्यागी भोगी महायोगी
    सुखदुःखविवर्जितः । सर्वत्र सिद्धसङ्कल्पो जीवन्मुक्तोऽद्यवर्तते ॥ ॥ इत्युक्त्वान्तर्दधे योगी दत्तात्रेयो
    दिगम्बरः । दलादनोऽपि तज्जप्त्वा जीवन्मुक्तः स वर्तते ॥ ॥ भिल्लो दूरश्रवा नाम तदानीं श्रुतवानिदम् ।
    सकृच्छ्रवणमात्रेण वज्राङ्गोऽभवदप्यसौ ॥ ॥ इत्येतद् वज्रकवचं दत्तात्रेयस्य योगिनः । श्रुत्वा शेषं शम्भुमुखात्
    पुनरप्याह पार्वती ॥ ॥ श्री पार्वत्युवाच । एतत् कवच माहात्म्यं वद विस्तरतो मम । कुत्र केन कदा जाप्यं
    कियज्जाप्यं कथं कथम् ॥ ॥ उवाच शम्भुस्तत् सर्वं पार्वत्या विनयोदितम् । श्रीपरमेश्वर उवाच । शृणु पार्वति
    वक्ष्यामि समाहितमनाविलम् ॥ ॥ धर्मार्थकाममोक्षाणामिदमेव परायणम् । हस्त्यश्वरथपादाति सर्वैश्वर्य प्रदायकम्
    ॥ ॥ पुत्रमित्रकलत्रादि सर्वसन्तोषसाधनम् । वेदशास्त्रादिविद्यानां विधानं परमं हि तत् ॥ ॥ सङ्गीत शास्त्र
    साहित्य सत्कवित्व विधायकम् । बुद्धि विद्या स्मृति प्रज्ञा मति प्रौढिप्रदायकम् ॥ ॥ सर्वसन्तोषकरणं सर्वदुःखनिवारणम्
    । शत्रुसंहारकं शीघ्रं यशःकीर्तिविवर्धनम् ॥ ॥ अष्टसङ्ख्या महारोगाः सन्निपातास्त्रयोदश । षण्णवत्यक्षिरोगाश्च
    विंशतिर्मेहरोगकाः ॥ ॥ अष्टादशतु कुष्ठानि गुल्मान्यष्टविधान्यपि । अशीतिर्वातरोगाश्च चत्वारिंशत्तु पैत्तिकाः
    ॥ ॥ विंशतिः श्लेष्मरोगाश्च क्षयचातुर्थिकादयः । मन्त्रयन्त्रकुयोगाद्याः कल्पतन्त्रादिनिर्मिताः ॥ ॥
    ब्रह्मराक्षस वेतालकूष्माण्डादि ग्रहोद्भवाः । सङ्गजा देशकालस्थास्तापत्रयसमुत्थिताः ॥ ॥ नवग्रहसमुद्भूता
    महापातक सम्भवाः । सर्वे रोगाः प्रणश्यन्ति सहस्रावर्तनाद् ध्रुवम् ॥ ॥ अयुतावृत्तिमात्रेण वन्ध्या पुत्रवती
    भवेत् । अयुतद्वितयावृत्त्या ह्यपमृत्युजयो भवेत् ॥ ॥ अयुतत्रितयाच्चैव खेचरत्वं प्रजायते । सहस्रायुतदर्वाक्
    सर्वकार्याणि साधयेत् ॥ ॥ लक्षावृत्त्या सर्वसिद्धिर्भवत्येव न संशयः ॥ ॥ विषवृक्षस्य मूलेषु तिष्ठन्
    वै दक्षिणामुखः । कुरुते मासमात्रेण वैरिणं विकलेन्द्रियम् ॥ ॥ औदुम्बरतरोर्मूले वृद्धिकामेन जाप्यते
    । श्रीवृक्षमूले श्रीकामी तिन्त्रिणी शान्तिकर्मणि ॥ ॥ ओजस्कामोऽश्वत्थमूले स्त्रीकामैः सहकारके । ज्ञानार्थी
    तुलसीमूले गर्भगेहे सुतार्थिभिः ॥ ॥ धनार्थिभिस्तु सुक्षेत्रे पशुकामैस्तु गोष्ठके । देवालये सर्वकामैस्तत्काले
    सर्वदर्शितम् ॥ ॥ नाभिमात्रजले स्थित्वा भानुमालोक्य यो जपेत् । युद्धे वा शास्त्रवादे वा सहस्रेण जयो
    भवेत् ॥ ॥ कण्ठमात्रे जले स्थित्वा यो रात्रौ कवचं पठेत् । ज्वरापस्मारकुष्ठादि तापज्वरनिवारणम् ॥ ॥ यत्र
    यत् स्यात् स्थिरं यद्यत् प्रसक्तं तन्निवर्तते । तेन तत्र हि जप्तव्यं ततः सिद्धिर्भवेद्ध्रुवम् ॥ ॥
    इत्युक्तवान् शिवो गौर्वै रहस्यं परमं शुभम् । यः पठेत् वज्रकवचं दत्तात्रेय समो भवेत् ॥ ॥ एवं शिवेन
    कथितं हिमवत्सुतायै प्रोक्तं दलादमुनयेऽत्रिसुतेन पूर्वम् । यः कोऽपि वज्रकवचं पठतीह लोके दत्तोपमश्चरति
    योगिवरश्चिरायुः ॥ ॥ इति श्री रुद्रयामले हिमवत्खण्डे मन्त्रशास्त्रे उमामहेश्वरसंवादे श्री दत्तात्रेय
    वज्रकवचस्तोत्रं सम्पूर्णम् ॥
