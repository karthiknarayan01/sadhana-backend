id: prahladakritamnrisimhastotram
category: stotram
name:
  english: prahladakritamnrisimhastotram
  devanagari: प्रह्लादकृतंनृसिंहस्तोत्रम्
content:
  english: prahladakritam nrisimhastotram nrisimham hridye dhyatva'staushiddharim samahitah | namo devadhidevaya
    sattvavilinamurtaye || 81|| brahmadayo bibhyati yadrupattadrupine namah | ghana'bhijanasaundaryatapahshrutabaladibhih
    || 82|| smriddhivakpatutabhishca'tushyate te namo namah | tava'nghrivimukho vipro yamaishca niyamairyutah
    || 83|| bhaktashvadat kaniyansa bhaktahrishtaya te namah | manahinaya dinaya tushyate te namo namah
    || 84|| bhaktimargashritasaukhyakartre te haraye namah | rakshavibhutisampatsusaukhyadatre punarnamah
    || 85|| brahmadayo'pi devashca shantadarshanakankshinah | stuvanti tvam paratmanam shantarupam tatah
    kuru || 86|| na'ham bibhaimi devesha krurannrisimharupanat | bibhemi kamaroshadestato raksham vidhehi
    me || 87|| asuradrakshanam tattu dehasya rakshanam kritam | tadvai me rakshanam nasti tasmanmadrakshanam
    kuru || 88|| kleshakarmavipakaderajaya bandhanat khalu | rakshanam kuru vishvesha tanmatam rakshanam
    bhavet || 89|| ihah putrakalatraderdhanaishvaryadivaspateh | kadapi naiva puryante tabhyo me rakshanam
    kuru || 90|| daityendrasya maya drishtah smriddhayasta na rakshikah | aishvaryani maya drishtanyetanyavanti
    naiva hi || 91|| siddhayashcapi devanam raksham kurvanti naiva ca | bhaktanam tvam rakshanaya bahurupi
    bhavasyatha || 92|| uddharayasi vishvatman tathoddharam ca me kuru | rajyam tu bandhanam proktam papam
    papataram mahat || 93|| yatsatam sevane vighnam manasattadidushanaih | dinatve tapa asthaya vancchanti
    kamanamayan || 94|| bhoganasadya pashcattvam vismarantiti kilbisham | tato devadhidevatvam darasattadhanadishu
    || 95|| ma yogam me dehi natha dehi tvaccaranambuje | tava dasasya dasanam madhye yogam pradehi me
    || 96|| ime devastava rupam saumyam kankshanti darshane | tasmatsaumyam sukhadam vai rupam darshaya
    madhava || 97|| ityarthitah sa bhagavan tejastadatibhishanam | roshanvitam tu samhritya babhuva sukhadarshanah
    || 98|| sharatkotindusankashah pundarikanibhekshanah | sudhamayasatapunjavidyutkotinibhaprabhah ||
    99|| sadratnadhyakatakakeyurormikadibhushitah | shankhacakragrihitabhyamudbahubhyam virajitah || 100||
    varada'bhayahastabhyamitarabhyam sushobhitah | shrivatsakaustubhorasko vanamalavibhushitah || 101||
    kundalahararashanamanisvarnavirajitah | savyangasthashriya yukto'bhavattada nrikesari || 102|| lakshminrisimham
    tam drishtva devatah samaharshayah | anandashrujalaih siktva namashcakrurnirantaram || 103|| iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 140
  devanagari: प्रह्लादकृतं नृसिंहस्तोत्रम् नृसिंहं हृद्ये ध्यात्वाऽस्तौषीद्धरिं समाहितः । नमो देवाधिदेवाय
    सत्त्वविलीनमूर्तये ॥ ८१॥ ब्रह्मादयो बिभ्यति यद्रूपात्तद्रूपिणे नमः । घनाऽभिजनसौन्दर्यतपःश्रुतबलादिभिः
    ॥ ८२॥ स्मृद्धिवाक्पटुताभिश्चाऽतुष्यते ते नमो नमः । तवाऽङ्घ्रिविमुखो विप्रो यमैश्च नियमैर्युतः ॥ ८३॥
    भक्तश्वादात् कनीयान्स भक्तहृष्टाय ते नमः । मानहीनाय दीनाय तुष्यते ते नमो नमः ॥ ८४॥ भक्तिमार्गाश्रितसौख्यकर्त्रे
    ते हरये नमः । रक्षाविभूतिसम्पत्सुसौख्यदात्रे पुनर्नमः ॥ ८५॥ ब्रह्मादयोऽपि देवाश्च शान्तदर्शनकाङ्क्षिणः
    । स्तुवन्ति त्वां परात्मानं शान्तरूपं ततः कुरु ॥ ८६॥ नाऽहं बिभैमि देवेश क्रूरान्नृसिंहरूपणात् । बिभेमि
    कामरोषादेस्ततो रक्षां विधेहि मे ॥ ८७॥ असुराद्रक्षणां तत्तु देहस्य रक्षणं कृतम् । तद्वै मे रक्षणं नास्ति
    तस्मान्मद्रक्षणं कुरु ॥ ८८॥ क्लेशकर्मविपाकादेरजाया बन्धनात् खलु । रक्षणं कुरु विश्वेश तन्मतं रक्षणं
    भवेत् ॥ ८९॥ ईहाः पुत्रकलत्रादेर्धनैश्वर्यदिवस्पतेः । कदापि नैव पूर्यन्ते ताभ्यो मे रक्षणं कुरु ॥ ९०॥
    दैत्येन्द्रस्य मया दृष्टाः स्मृद्धयस्ता न रक्षिकाः । ऐश्वर्याणि मया दृष्टान्येतान्यवन्ति नैव हि ॥
    ९१॥ सिद्धयश्चापि देवानां रक्षां कुर्वन्ति नैव च । भक्तानां त्वं रक्षणाय बहुरूपी भवस्यथ ॥ ९२॥ उद्धारयसि
    विश्वात्मन् तथोद्धारं च मे कुरु । राज्यं तु बन्धनं प्रोक्तं पापं पापतरं महत् ॥ ९३॥ यत्सतां सेवने विघ्नं
    मानसत्तादिदूषणैः । दीनत्वे तप आस्थाय वाञ्च्छन्ति कामनामयान् ॥ ९४॥ भोगानासाद्य पश्चात्त्वां विस्मरन्तीति
    किल्बिषम् । ततो देवाधिदेवत्वं दारासत्ताधनादिषु ॥ ९५॥ मा योगं मे देहि नाथ देहि त्वच्चरणाम्बुजे । तव
    दासस्य दासानां मध्ये योगं प्रदेहि मे ॥ ९६॥ इमे देवास्तव रूपं सौम्यं काङ्क्षन्ति दर्शने । तस्मात्सौम्यं
    सुखदं वै रूपं दर्शय माधव ॥ ९७॥ इत्यर्थितः स भगवान् तेजस्तदतिभीषणम् । रोषान्वितं तु संहृत्य बभूव सुखदर्शनः
    ॥ ९८॥ शरत्कोटीन्दुसङ्काशः पुण्डरीकनिभेक्षणः । सुधामयसटापुञ्जविद्युत्कोटिनिभप्रभः ॥ ९९॥ सद्रत्नाढ्यकटककेयूरोर्मिकादिभूषितः
    । शङ्खचक्रगृहीताभ्यामुद्बाहुभ्यां विराजितः ॥ १००॥ वरदाऽभयहस्ताभ्यामितराभ्यां सुशोभितः । श्रीवत्सकौस्तुभोरस्को
    वनमालाविभूषितः ॥ १०१॥ कुण्डलहाररशनामणिस्वर्णविराजितः । सव्याङ्गस्थश्रिया युक्तोऽभवत्तदा नृकेसरी ॥
    १०२॥ लक्ष्मीनृसिंहं तं दृष्ट्वा देवताः समहर्षयः । आनन्दाश्रुजलैः सिक्त्वा नमश्चक्रुर्निरन्तरम् ॥ १०३॥
    इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने १४०
