id: yamakritamjagannathastotram
category: stotram
name:
  english: yamakritamjagannathastotram
  devanagari: यमकृतंजगन्नाथस्तोत्रम्
content:
  english: 20|| bhavasantapaniharabhanave dinabandhave | svamayaracitasheshavibhave gunarajjave || 21||
    namah kamalakinjalkapitanirmalavasase | mahahavaripuskandha krintacakraya cakrine || 22|| damshtroddhrita
    kshitibhrite trayimurtimate namah | namo yajnavarahaya candrasuryagnicakshushe || 23|| narasimhaya
    damshtrogramurtidravitashatrave | yadapangavilasaikasrishtisthityupasamhritih || 24|| uccavacatmako
    hyesha bhavah sambhavate muhuh | tamamum nilameghabham nilashmamanivigraham || 25|| nilacalaguhavasam
    pranamami kripanidhim | shankhacakragadapadmadharinam shubhadayinam || 26|| pranatasheshapapaughadarinam
    muravairinam | namaste kamalapanga sangasamskaracakshushe || 27|| shrivatsakaustubhodbhasi manohridvyudhavakshase
    | yatpadapankajadvandvasamshrayaishvaryabhagini || 28|| shrih samshrita janaih shashvatprithagaishvaryadayini
    | ya paraparasambhinna prakritiste sisrikshaya || 29|| nirvikaram param brahma vikari sasrijem'jasa
    | sarvalakshanasampurna lakshitam shubhalakshanaih | lakshmishorasi nityastha lakshmim tam pranamamyaham
    || 2
  devanagari: २०॥ भवसन्तापनीहारभानवे दीनबन्धवे । स्वमायारचिताशेषविभवे गुणरज्जवे ॥ २१॥ नमः कमलकिञ्जल्कपीतनिर्मलवाससे
    । महाहवरिपुस्कन्ध कृन्तचक्राय चक्रिणे ॥ २२॥ दंष्ट्रोद्धृत क्षितिभृते त्रयीमूर्तिमते नमः । नमो यज्ञवराहाय
    चन्द्रसूर्याग्निचक्षुषे ॥ २३॥ नरसिंहाय दंष्ट्रोग्रमूर्तिद्रावितशत्रवे । यदपाङ्गविलासैकसृष्टिस्थित्युपसंहृतिः
    ॥ २४॥ उच्चावचात्मको ह्येष भवः सम्भवते मुहुः । तममुं नीलमेघाभं नीलाश्ममणिविग्रहम् ॥ २५॥ नीलाचलगुहावासं
    प्रणमामि कृपानिधिम् । शङ्खचक्रगदापद्मधारिणं शुभदायिनम् ॥ २६॥ प्रणताशेषपापौघदारिणं मुरवैरिणम् । नमस्ते
    कमलापाङ्ग सङ्गसंस्कारचक्षुषे ॥ २७॥ श्रीवत्सकौस्तुभोद्भासि मनोहृद्व्यूढवक्षसे । यत्पादपङ्कजद्वन्द्वसंश्रयैश्वर्यभागिनी
    ॥ २८॥ श्रीः संश्रिता जनैः शश्वत्पृथगैश्वर्यदायिनी । या परापरसम्भिन्ना प्रकृतिस्ते सिसृक्षया ॥ २९॥
    निर्विकारं परं ब्रह्म विकारि ससृजेंऽजसा । सर्वलक्षणसम्पूर्णा लक्षितां शुभलक्षणैः । लक्ष्मीशोरसि नित्यस्था
    लक्ष्मीं तां प्रणमाम्यहम् ॥ २
