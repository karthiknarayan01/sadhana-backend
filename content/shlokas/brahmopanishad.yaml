id: brahmopanishad
category: upanishad
name:
  english: brahmopanishad
  devanagari: ब्रह्मोपनिषद्
content:
  english: ya evam veda sa param brahma dham kshetrajnamupaiti || 1 || athasya purushasya catvari sthanani
    bhavanti nabhirhridayam kantham murdheti | tatra catushpadam brahma vibhati | jagaritam svapnam sushuptam
    turiyamiti | jagarite brahma svapne vishnuh sushuptau rudrasturiyam paramaksharam adityashca vishnushceshvarashca
    sa purushah sa pranah sa jivah so'gnih seshvarashca jagrattesham madhye yatparam brahma vibhati |
    svayamamanaskamashrotramapanipadam jyotirvarjitam na tatra loka na loka veda na veda deva na deva
    yajna na yajna mata na mata pita na pita snusha na snusha candalo na candalah pailkaso na pailkasah
    shramano na shramanah pashavo na pashavastapaso na tapasa ityekameva param brahma vibhati | hridyakashe
    tadvijnanamakasham tatsushiramakasham tadvedyam hridyakasham yasminnidam samcarati vacarati yasminnidam
    sarvamotam protam | sam vibhoh praja jnayeran | na tatra deva rishayah pitara rishate pratibuddhah
    sarvaviditi || 2 || hridistha devathah sarva hridi pranah pratishthitah | hridi pranashca jyotishca
    trivritsutram ca yanmahat || hridi caitanye tishthati yajnopavitam paramam pavitram prajapateryatsahajam
    purastat | ayushyamagrapam pratimunca shubhram yajnopavitam balamastu tejah || sashikham vapanam kritva
    bahihsutram tyajedbudhah | yadaksharam param brahma tatsutramiti dharayet || sucanatsutramityahuh
    sutram nama param padam | tatsutram viditam yena sa vipro vedaparagah || tena sarvamidam protam sutre
    manigana iva | tatsutram dharayedyogi yogavittattvadarshivan || bahihsutram tyajedvidvanyogamuttamamasthitah
    | brahmabhavamayam sutram dharayedyah sa cetanah || dharanattasya sutrasya nocchishtho nashucirbhavet
    | sutramantargatam yesham jnanayajnopavitinam || te cai sutravido loke te ca yajnopavitinah | jnanashikhino
    jnananishtha jnanayajnopavitihah || jnanameva param tesham pavitram jnanamuttamam | agneriva shikha
    nanya yasya jnanamayi shikha || sa shikhityucyate vidvanitare keshadharinah || 3 || karmanyadhikrita
    ye tu vaidike brahmanadayah | taih samdharyamida sutram kriyangam taddhi vai smritam || shikha jnanamayi
    yasya upavitam ca tanmayam | brahmanyam sakalam tasya iti brahmavido viduh || idam yajnopavitam tu
    pavitram yatparayanam | sa vidvanyajnopaviti syatsa yajnah sa ca yajnavit || eko devah sarvabhuteshu
    gudhah sarvavyapi sarvabhutantaratma | karmadhyakshah sarvabhutadhivasah sakshi ceta kevalo nirgunashca
    || eko manishi nishkiyanam bahunamekam santam bahudha yah karoti | tamatmastham ye'nupashyanti dhirastesham
    shantih shashvati netaresham || atmanamaranim kritva pranavam cottararanim | dhyananirmathanabhyasaddevam
    pashyennigudhavat || tileshu tailam dadhiniva sarpirapah srotahsvaranishu cagnih | evamatma''tmani
    grihmate'sau satyenainam tapasa yo'nupashyati || urnanabhiryatha tantunsrijate samharatyapi | jagratsvapne
    tatha jivo gacchatyagacchate punah || padmakoshapratikasham sushiram capyadhomukham | hridayam tadvijaniyadvishvasya''yatanam
    mahat || netrastham jagratam vidyatkanthe svapnam vinirdishet | sushuptam hridayastham tu turiyam
    murdhni samsthitam || yadatma prajnaya''tmanam samdhatte paramatmani | tena samdhya dhyanameva tasmatsandhyabhivandanam
    || nirodakadhyanasamdhya vakkayakleshavarjita | samdhini sarvabhutanam sa samdhya hyekadandinam ||
    yato vaco nivartante aprapya manasa saha | annandametajjivasya yam jnatva mucyate budhah || sarvavyapinamatmanam
    kshire sarpirivarpitam | atmavidyatapomulam tadbrahmopanishatparam | sarvatmaikatvarupena tadbrahmopanishatparamiti
    || 4 || ityatharvavede brahmopanishatsamapta || adhikadhyayanaya
  devanagari: य एवं वेद स परं ब्रह्म धं क्षेत्रज्ञमुपैति ॥ १ ॥ अथास्य पुरुषस्य चत्वारि स्थानानि भवन्ति
    नाभिर्हृदयं कण्ठं मूर्धेति । तत्र चतुष्पादं ब्रह्म विभाति । जागरितं स्वप्नं सुषुप्तं तुरीयमिति । जागरिते
    ब्रह्मा स्वप्ने विष्णुः सुषुप्तौ रुद्रस्तुरीयं परमाक्षरं आदित्यश्च विष्णुश्चेश्वरश्च स पुरुषः स प्राणः
    स जीवः सोऽग्निः सेश्वरश्च जाग्रत्तेषां मध्ये यत्परं ब्रह्म विभाति । स्वयममनस्कमश्रोत्रमपाणिपादं ज्योतिर्वर्जितं
    न तत्र लोका न लोका वेदा न वेदा देवा न देवा यज्ञा न यज्ञ माता न माता पिता न पिता स्नुष न स्नुष चाण्डालो
    न चाण्डालः पैल्कसो न पैल्कसः श्रमणो न श्रमणः पशवो न पशवस्तापसो न तापस इत्येकमेव परं ब्रह्म विभाति
    । हृद्याकाशे तद्विज्ञानमाकाशं तत्सुषिरमाकाशं तद्वेद्यं हृद्याकाशं यस्मिन्निदं संचरति वचरति यस्मिन्निदं
    सर्वमोतं प्रोतं । सं विभोः प्रजा ज्ञायेरन् । न तत्र देवा ऋषयः पितर रिशते प्रतिबुद्धः सर्वविदिति ॥
    २ ॥ हृदिस्था देवथाः सर्वा हृदि प्राणाः प्रतिष्ठिताः । हृदि प्राणश्च ज्योतिश्च त्रिवृत्सूत्रं च यन्महत्
    ॥ हृदि चैतन्ये तिष्ठति यज्ञोपवीतं परमं पवित्रं प्रजापतेर्यत्सहजं पुरस्तात् । आयुष्यमग्रपं प्रतिमुञ्च
    शुभ्रं यज्ञोपवीतं बलमस्तु तेजः ॥ सशिखं वपनं कृत्वा बहिःसूत्रं त्यजेद्बुधः । यदक्षरं परं ब्रह्म तत्सूत्रमिति
    धारयेत् ॥ सूचनात्सूत्रमित्याहुः सूत्रं नाम परं पदम् । तत्सूत्रं विदितं येन स विप्रो वेदपारगः ॥ तेन
    सर्वमिदं प्रोतं सूत्रे मणिगणा इव । तत्सूत्रं धारयेद्योगी योगवित्तत्त्वदर्शिवान् ॥ बहिःसूत्रं त्यजेद्विद्वान्योगमुत्तममास्थितः
    । ब्रह्मभावमयं सूत्रं धारयेद्यः स चेतनः ॥ धारणात्तस्य सूत्रस्य नोच्छिष्ठो नाशुचिर्भवेत् । सूत्रमन्तर्गतं
    येषां ज्ञानयज्ञोपवीतिनाम् ॥ ते चै सूत्रविदो लोके ते च यज्ञोपवीतिनः । ज्ञानशिखिनो ज्ञाननिष्ठा ज्ञानयज्ञोपवीतिहः
    ॥ ज्ञानमेव परं तेषां पवित्रं ज्ञानमुत्तमम् । अग्नेरिव शिखा नान्या यस्य ज्ञानमयी शिखा ॥ स शिखीत्युच्यते
    विद्वानितरे केशधारिणः ॥ ३ ॥ कर्मण्यधिकृता ये तु वैदिके ब्राह्मणादयः । तैः संधार्यमिद सूत्रं क्रियाङ्गं
    तद्धि वै स्मृतम् ॥ शिखा ज्ञानमयी यस्य उपवीतं च तन्मयम् । ब्राह्मण्यं सकलं तस्य इति ब्रह्मविदो विदुः
    ॥ इदं यज्ञोपवीतं तु पवित्रं यत्परायणम् । स विद्वान्यज्ञोपवीती स्यात्स यज्ञः स च यज्ञवित् ॥ एको देवः
    सर्वभूतेषु गूढः सर्वव्यापी सर्वभूतान्तरात्मा । कर्माध्यक्षः सर्वभूताधिवासः साक्षी चेता केवलो निर्गुणश्च
    ॥ एको मनीषी निष्कियाणां बहूनामेकं सन्तं बहुधा यः करोति । तमात्मस्थं येऽनुपश्यन्ति धीरास्तेषां शान्तिः
    शाश्वती नेतरेषाम् ॥ आत्मानमरणिं कृत्वा प्रणवं चोत्तरारणिम् । ध्याननिर्मथनाभ्यासाद्देवं पश्येन्निगूढवत्
    ॥ तिलेषु तैलं दधिनीव सर्पिरापः स्रोतःस्वरणीषु चाग्निः । एवमात्माऽऽत्मनि गृह्मतेऽसौ सत्येनैनं तपसा
    योऽनुपश्यति ॥ ऊर्णनाभिर्यथा तन्तून्सृजते संहरत्यपि । जाग्रत्स्वप्ने तथा जीवो गच्छत्यागच्छते पुनः ॥
    पद्मकोशप्रतीकाशं सुषिरं चाप्यधोमुखम् । हृदयं तद्विजानीयाद्विश्वस्याऽऽयतनं महत् ॥ नेत्रस्थं जाग्रतं
    विद्यात्कण्ठे स्वप्नं विनिर्दिषेत् । सुषुप्तं हृदयस्थं तु तुरीयं मूर्ध्नि संस्थितम् ॥ यदात्मा प्रज्ञयाऽऽत्मानं
    संधत्ते परमात्मनि । तेन संध्या ध्यानमेव तस्मात्सन्ध्याभिवन्दनम् ॥ निरोदकाध्यानसंध्या वाक्कायक्लेशवर्जिता
    । संधिनी सर्वभूतानां सा संध्या ह्येकदण्डिनाम् ॥ यतो वाचो निवर्तन्ते अप्राप्य मनसा सह । आन्नन्दमेतज्जीवस्य
    यं ज्ञात्वा मुच्यते बुधः ॥ सर्वव्यापिनमात्मानं क्षीरे सर्पिरिवार्पितम् । आत्मविद्यातपोमूलं तद्ब्रह्मोपनिषत्परम्
    । सर्वात्मैकत्वरूपेण तद्ब्रह्मोपनिषत्परमिति ॥ ४ ॥ इत्यथर्ववेदे ब्रह्मोपनिषत्समाप्ता ॥ अधिकाध्ययनाय
