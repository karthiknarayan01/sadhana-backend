id: k-ishnastavah1gargasamhita
category: stotram
name:
  english: kṟishnastavah1gargasamhita
  devanagari: क्ऱिष्णस्तवः१गर्गसम्हिता
content:
  english: raveshapurnasahitaishca parasya yasya | sargadayah kila bhavanti tameva krishnam purnatparam
    tu paripurnatamam natah smah || 3|| manvantareshu ca yugeshu gatagateshu kalpeshu camshakalaya svavapurbibharshi
    | adyaiva dhama paripurnatamam tanoshi dharmam vidhaya bhuvi mangalamatanoshi || 4|| yaddurlabham
    vishadayogibhirapyagamyam gamyam dravadbhiramalashayabhaktiyogaih | anandakanda caratastava mandayanam
    padaravindamakarandarajo dadhamah || 5|| purvam tathatra kamaniyavapushmayam tvam kandarpakotishatamohanamadbhutam
    ca | golokadhamadhishanadyutimadadhanam radhapatim dharanidhuryadhanam dadhamah || 6|| iti gargasamhitayam
    golokakhande ekadashadhyayantargatah shrikrishnajananatpurvam devaih kritah shrikrishnastavah sampurnah
    |
  devanagari: रावेशपूर्णसहितैश्च परस्य यस्य । सर्गादयः किल भवन्ति तमेव कृष्णं पूर्णात्परं तु परिपूर्णतमं
    नताः स्मः ॥ ३॥ मन्वन्तरेषु च युगेषु गतागतेषु कल्पेषु चांशकलया स्ववपुर्बिभर्षि । अद्यैव धाम परिपूर्णतमं
    तनोषि धर्मं विधाय भुवि मङ्गलमातनोषि ॥ ४॥ यद्दुर्लभं विशदयोगिभिरप्यगम्यं गम्यं द्रवद्भिरमलाशयभक्तियोगैः
    । आनन्दकन्द चरतस्तव मन्दयानं पादारविन्दमकरन्दरजो दधामः ॥ ५॥ पूर्वं तथात्र कमनीयवपुष्मयं त्वां कन्दर्पकोटिशतमोहनमद्भुतं
    च । गोलोकधामधिषणद्युतिमादधानं राधापतिं धरणिधुर्यधनं दधामः ॥ ६॥ इति गर्गसंहितायां गोलोकखण्डे एकादशाध्यायान्तर्गतः
    श्रीकृष्णजननात्पूर्वं देवैः कृतः श्रीकृष्णस्तवः सम्पूर्णः ।
