id: dhruvakritamvishnustotram
category: stotram
name:
  english: dhruvakritamvishnustotram
  devanagari: ध्रुवकृतंविष्णुस्तोत्रम्
content:
  english: 30|| dhatunam hatakamasi sphatikashcopaleshvasi | nilotpalam prasuneshu vriksheshu tulasi bhavan
    || 31|| sarvapujyashilanam vai shalagramashila bhavan | muktikshetreshu kashi tvam prayagastirthapanktishu
    || 32|| varneshu shvetavarno'si dvipadam brahmano bhavan | garudo'syandajeshvisha vyavahareshu vagbhavan
    || 33|| vedeshupanishadrupo mantranam pranavohyasi | aksharanamakaro'si yajvanam somarupadhrik ||
    34|| pratapinamagnirasi kshama'si tvam kshamavatam | datrinamasi parjanyah pavitranam parohyasi ||
    35|| capo'si sarvashastranam vato vegavatamasi | mano'sindriyavargeshu nirbhayanam karohyasi || 36||
    vyoma vyaptimatam tvam vai paramatma'si catmanam | sandhyopastirbhavandeva sarvanityeshu karmasu ||
    37|| kratunamashvamedho'si dananamabhayam bhavan | labhanam putralabho'si vasantastvamritushvaho ||
    38|| yuganam prathamo'si tvam tithinam tvam kuhurhyasi | pushyo'si nakshatragane sankramah sarvaparvasu
    || 39|| yogeshu vyatipatastvam trineshu hi kusho bhavan | udyamanam hi sarvesham nirvanam tvamasi
    prabho || 1
  devanagari: ३०॥ धातूनां हाटकमसि स्फटिकश्चोपलेष्वसि । नीलोत्पलं प्रसूनेषु वृक्षेषु तुलसी भवान् ॥ ३१॥
    सर्वपूज्यशिलानां वै शालग्रामशिला भवान् । मुक्तिक्षेत्रेषु काशी त्वं प्रयागस्तीर्थपङ्क्तिषु ॥ ३२॥ वर्णेषु
    श्वेतवर्णोऽसि द्विपदां ब्राह्मणो भवान् । गरुडोऽस्यण्डजेष्वीश व्यवहारेषु वाग्भवान् ॥ ३३॥ वेदेषूपनिषद्रूपो
    मन्त्राणां प्रणवोह्यसि । अक्षराणामकारोऽसि यज्वनां सोमरूपधृक् ॥ ३४॥ प्रतापिनामग्निरसि क्षमाऽसि त्वं
    क्षमावताम् । दातॄणामसि पर्जन्यः पवित्राणां परोह्यसि ॥ ३५॥ चापोऽसि सर्वशस्त्राणां वातो वेगवतामसि ।
    मनोऽसीन्द्रियवर्गेषु निर्भयाणां करोह्यसि ॥ ३६॥ व्योम व्याप्तिमतां त्वं वै परमात्माऽसि चात्मनाम् ।
    सन्ध्योपास्तिर्भवान्देव सर्वनित्येषु कर्मसु ॥ ३७॥ क्रतूनामश्वमेधोऽसि दानानामभयं भवान् । लाभानां पुत्रलाभोऽसि
    वसन्तस्त्वमृतुष्वहो ॥ ३८॥ युगानां प्रथमोऽसि त्वं तिथीनां त्वं कुहूर्ह्यसि । पुष्योऽसि नक्षत्रगणे सङ्क्रमः
    सर्वपर्वसु ॥ ३९॥ योगेषु व्यतिपातस्त्वं तृणेषु हि कुशो भवान् । उद्यमानां हि सर्वेषां निर्वाणं त्वमसि
    प्रभो ॥ १
