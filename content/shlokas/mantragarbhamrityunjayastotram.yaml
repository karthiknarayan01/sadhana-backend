id: mantragarbhamrityunjayastotram
category: mantra
name:
  english: mantragarbhamrityunjayastotram
  devanagari: मन्त्रगर्भमृत्युन्जयस्तोत्रम्
content:
  english: bhikshushca munishashca janadhipah | bamdhuro vikayanashca nedishtho rajasarasah || 11|| dhanurvidya
    kritotsaho balarupah suduhsahah | natyagen yam gaccheddha laghvashi kharamardanah || 12|| mrityormrityur
    vaidyarajah pinaki samhatipriyah | yor kaprabhavo yogi ca shakahari ca saradah || 13|| mukundo nayanaramash
    candrarkaksho ranajitah | kshinapto rajarajendro jnatajnato bhasucakah || 14|| yakshadhipo yakshmahanta
    narmado yatamanasah | maladharo nodadharma sagaro nagarah shucih || 15|| mrigankito harah sakshad
    galanilah shashankabhrita | tatkaddharihsada payad ranganatho narakritih || 16|| mrityunjayastotramidam
    samantram yo vai pathennityamatandritah san | bhaktya bhavedashu sa vajradehi phalanupraptih khalu
    nishcayena || 17|| bhagne sutantau prabhavenna vaidyo rasayanam yacchivabhaktishunyam | trishacchivannanya
    ihasti trata nanakritermrityumukhat pramokta || 18|| iti shridattapadaravindamilinda brahmacari
  devanagari: भिक्षुश्च मुनीशश्च जनाधिपः । बम्धूरो वीकयानश्च नेदिष्ठो राजसारसः ॥ ११॥ धनुर्विद्या कृतोत्साहो
    बालरूपः सुदुःसहः । नात्यागेन् यं गच्छेद्ध लघ्वाशी खरमर्दनः ॥ १२॥ मृत्योर्मृत्युर् वैद्यराजः पिनाकी
    संहतिप्रियः । योर् कप्रभावो योगी च शाकाहारी च सारदः ॥ १३॥ मुकुन्दो नयनारामश् चन्द्रार्काक्षो रणाजितः
    । क्षीणाप्तो राजराजेन्द्रो ज्ञाताज्ञातो भसूचकः ॥ १४॥ यक्षाधिपो यक्ष्महन्ता नर्मदो यतमानसः । मालाधरो
    णोदधर्मा सागरो नागरः शुचिः ॥ १५॥ मृगाङ्कितो हरः साक्षाद् गलनीलः शशाङ्कभृत । तात्काद्धरिःसदा पायाद्
    रङ्गनाथो नराकृतिः ॥ १६॥ मृत्युञ्जयस्तोत्रमिदं समन्त्रं यो वै पठेन्नित्यमतन्द्रितः सन् । भक्त्या भवेदाशु
    स वज्रदेही फलानुप्राप्तिः खलु निश्चयेन ॥ १७॥ भग्ने सुतन्तौ प्रभवेन्न वैद्यो रसायनं यच्छिवभक्तिशून्यम्
    । त्रीशाच्छिवान्नान्य ईहास्ति त्राता नानाकृतेर्मृत्युमुखात् प्रमोक्ता ॥ १८॥ इति श्रीदत्तपादारविन्दमिलिन्द
    ब्रह्मचारि
meaning: {}
