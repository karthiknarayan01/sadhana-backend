id: ekadashamukhahanumatkavacam
category: stotram
name:
  english: ekadashamukhahanumatkavacam
  devanagari: एकादशमुखहनुमत्कवचम्
content:
  english: shriganeshaya namah | lopamudra uvaca | kumbhodbhava dayasindho shrutam hanumatah param | yantramantradikam
    sarvam tvanmukhodiritam maya || 1|| dayam kuru mayi prananatha veditumutsahe | kavacam vayuputrasya
    ekadashamukhatmanah || 2|| ityevam vacanam shrutva priyayah prashrayanvitam | vaktum pracakrame tatra
    lopamudram prati prabhuh || 3|| agastya uvaca | namaskritva ramadutam hanumantam mahamatim | brahmaproktam
    tu kavacam shrrinu sundari sadaram || 4|| sanandanaya sumahaccaturananabhashitam | kavacam kamadam
    divyam rakshahkulanibarhanam || 5|| sarvasampatpradam punyam martyanam madhurasvare | om asya shrikavacasyaikadashavaktrasya
    dhimatah || 6|| hanumatstutimantrasya sanandana rishih smritah | prasannatma hanumamshca devata parikirtita
    || 7|| chando'nushtup samakhyatam bijam vayusutastatha | mukhyah pranah shaktiriti viniyogah prakirtitah
    || 8|| sarvakamarthasiddhayartham japa evamudirayet | om sphrembijam shaktidhrik patu shiro me pavanatmajah
    || 9|| kraumbijatma nayanayoh patu mam vanareshvarah | kshambijarupah karnau me sitashokavinashanah
    || 10|| glaumbijavacyo nasam me lakshmanapranadayakah | vambijarthashca kantham me patu cakshayakarakah
    || 11|| aimbijavacyo hridayam patu me kapinayakah | vambijakirtitah patu bahu me canjanisutah || 12||
    hrambijo rakshasendrasya darpaha patu codaram | hrasaumbijamayo madhyam patu lankavidahakah || 13||
    hrimbijadharah patu guhyam devendravanditah | rambijatma sada patu coru vardhilamghanah || 14|| sugrivasacivah
    patu januni me manojavah | padau padatale patu dronacaladharo harih || 15|| apadamastakam patu ramaduto
    mahabalah | purve vanaravaktro mamagneyyam kshatriyantakrit || 16|| dakshine narasimhastu nairirtyam
    gananayakah | varunyam dishi mamavyatkhagavaktro harishvarah || 17|| vayavyam bhairavamukhah kauberyam
    patu mam sada | krodasyah patu mam nityamaishanyam rudrarupadhrik || 18|| urdhvam hayananah patu guhyadhah
    sumukhastatha | ramasyah patu sarvatra saumyarupo mahabhujah || 19|| ityevam ramadutasya kavacam yah
    pathetsada | ekadashamukhasyaitadgopyam vai kirtitam maya || 20|| rakshoghnam kamadam saumyam sarvasampadvidhayakam
    | putradam dhanadam cograshatrusamghavimardanam || 21|| svargapavargadam divyam cintitarthapradam
    shubham | etatkavacamajnatva mantrasiddhirna jayate || 22|| catvarimshatsahasrani pathecchuddhatmako
    narah | ekavaram pathennityam kavacam siddhidam puman || 23|| dvivaram va trivaram va pathannayushyamapnuyat
    | kramadekadashadevamavartanajapatsudhih || 24|| varshante darshanam sakshallabhate natra samshayah
    | yam yam cintayate cartham tam tam prapnoti purushah || 25|| brahmodiritametaddhi tavagre kathitam
    mahata || 26|| ityevamuktva vacanam maharshistushnim babhuvendumukhim nirikshya | samhrishtacittapi
    tada tadiyapada nanamatimuda svabhartuh || 27|| || ityagastyasarasamhitayamekadashamukhahanumatkavacam
    sampurnam ||
  devanagari: श्रीगणेशाय नमः । लोपामुद्रा उवाच । कुम्भोद्भव दयासिन्धो श्रुतं हनुमतः परम् । यन्त्रमन्त्रादिकं
    सर्वं त्वन्मुखोदीरितं मया ॥ १॥ दयां कुरु मयि प्राणनाथ वेदितुमुत्सहे । कवचं वायुपुत्रस्य एकादशमुखात्मनः
    ॥ २॥ इत्येवं वचनं श्रुत्वा प्रियायाः प्रश्रयान्वितम् । वक्तुं प्रचक्रमे तत्र लोपामुद्रां प्रति प्रभुः
    ॥ ३॥ अगस्त्य उवाच । नमस्कृत्वा रामदूतां हनुमन्तं महामतिम् । ब्रह्मप्रोक्तं तु कवचं श्रृणु सुन्दरि
    सादरम् ॥ ४॥ सनन्दनाय सुमहच्चतुराननभाषितम् । कवचं कामदं दिव्यं रक्षःकुलनिबर्हणम् ॥ ५॥ सर्वसम्पत्प्रदं
    पुण्यं मर्त्यानां मधुरस्वरे । ॐ अस्य श्रीकवचस्यैकादशवक्त्रस्य धीमतः ॥ ६॥ हनुमत्स्तुतिमन्त्रस्य सनन्दन
    ऋषिः स्मृतः । प्रसन्नात्मा हनूमांश्च देवता परिकीर्तिता ॥ ७॥ छन्दोऽनुष्टुप् समाख्यातं बीजं वायुसुतस्तथा
    । मुख्यः प्राणः शक्तिरिति विनियोगः प्रकीर्तितः ॥ ८॥ सर्वकामार्थसिद्धयर्थं जप एवमुदीरयेत् । ॐ स्फ्रेंबीजं
    शक्तिधृक् पातु शिरो मे पवनात्मजः ॥ ९॥ क्रौंबीजात्मा नयनयोः पातु मां वानरेश्वरः । क्षंबीजरूपः कर्णौ
    मे सीताशोकविनाशनः ॥ १०॥ ग्लौंबीजवाच्यो नासां मे लक्ष्मणप्राणदायकः । वंबीजार्थश्च कण्ठं मे पातु चाक्षयकारकः
    ॥ ११॥ ऐंबीजवाच्यो हृदयं पातु मे कपिनायकः । वंबीजकीर्तितः पातु बाहू मे चाञ्जनीसुतः ॥ १२॥ ह्रांबीजो
    राक्षसेन्द्रस्य दर्पहा पातु चोदरम् । ह्रसौंबीजमयो मध्यं पातु लङ्काविदाहकः ॥ १३॥ ह्रींबीजधरः पातु गुह्यं
    देवेन्द्रवन्दितः । रंबीजात्मा सदा पातु चोरू वार्धिलंघनः ॥ १४॥ सुग्रीवसचिवः पातु जानुनी मे मनोजवः ।
    पादौ पादतले पातु द्रोणाचलधरो हरिः ॥ १५॥ आपादमस्तकं पातु रामदूतो महाबलः । पूर्वे वानरवक्त्रो मामाग्नेय्यां
    क्षत्रियान्तकृत् ॥ १६॥ दक्षिणे नारसिंहस्तु नैऋर्त्यां गणनायकः । वारुण्यां दिशि मामव्यात्खगवक्त्रो
    हरीश्वरः ॥ १७॥ वायव्यां भैरवमुखः कौबेर्यां पातु मां सदा । क्रोडास्यः पातु मां नित्यमैशान्यं रुद्ररूपधृक्
    ॥ १८॥ ऊर्ध्वं हयाननः पातु गुह्याधः सुमुखस्तथा । रामास्यः पातु सर्वत्र सौम्यरूपो महाभुजः ॥ १९॥ इत्येवं
    रामदूतस्य कवचं यः पठेत्सदा । एकादशमुखस्यैतद्गोप्यं वै कीर्तितं मया ॥ २०॥ रक्षोघ्नं कामदं सौम्यं सर्वसम्पद्विधायकम्
    । पुत्रदं धनदं चोग्रशत्रुसंघविमर्दनम् ॥ २१॥ स्वर्गापवर्गदं दिव्यं चिन्तितार्थप्रदं शुभम् । एतत्कवचमज्ञात्वा
    मन्त्रसिद्धिर्न जायते ॥ २२॥ चत्वारिंशत्सहस्राणि पठेच्छुद्धात्मको नरः । एकवारं पठेन्नित्यं कवचं सिद्धिदं
    पुमान् ॥ २३॥ द्विवारं वा त्रिवारं वा पठन्नायुष्यमाप्नुयात् । क्रमादेकादशादेवमावर्तनजपात्सुधीः ॥ २४॥
    वर्षान्ते दर्शनं साक्षाल्लभते नात्र संशयः । यं यं चिन्तयते चार्थं तं तं प्राप्नोति पूरुषः ॥ २५॥ ब्रह्मोदीरितमेतद्धि
    तवाग्रे कथितं महत ॥ २६॥ इत्येवमुक्त्वा वचनं महर्षिस्तूष्णीं बभूवेन्दुमुखीं निरीक्ष्य । संहृष्टचित्तापि
    तदा तदीयपादा ननामातिमुदा स्वभर्तुः ॥ २७॥ ॥ इत्यगस्त्यसारसंहितायामेकादशमुखहनुमत्कवचं सम्पूर्णम् ॥
