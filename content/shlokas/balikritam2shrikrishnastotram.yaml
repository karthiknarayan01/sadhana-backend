id: balikritam2shrikrishnastotram
category: stotram
name:
  english: balikritam2shrikrishnastotram
  devanagari: बलिकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: balikritam 2 shrikrishnastotram baliruvaca | namo'nantaya brihate namah krishnaya vedhase |
    sankhyayogavitanaya brahmane paramatmane || 39|| darshanam vam hi bhutanam dushprapam capyadurlabham
    | rajastamahsvabhavanam yannah praptau yadricchaya || 40|| daityadanavagandharvah siddhavidyadhracaranah
    | yaksharakshahpishacashca bhutapramathanayakah || 41|| vishuddhasattvadhamnyaddha tvayi shastrasharirini
    | nityam nibaddhavairaste vayam canye ca tadrishah || 42|| kecanodbaddhavairena bhaktya kecana kamatah
    | na tatha sattvasamrabdhah sannikrishtah suradayah || 43|| idamitthamiti prayastava yogeshvareshvara
    | na vidantyapi yogesha yogamayam kuto vayam || 44|| tannah prasida nirapekshavimrigyayushmat padaravindadhishananyagrihandhakupat
    | nishkramya vishvasharananghryupalabdhavrittih shanto yathaika uta sarvasakhaishcarami || 45|| shadhyasmanishitavyesha
    nishpapan kuru nah prabho | puman yacchraddhaya''tishthamshcodanaya vimucyate || 46|| iti shrimadbhagavatamahapurane
    dashamaskandhe uttarardhe pancashititamadhyayantargatam balikritam shrikrishnastotram samaptam | bhagavatapurana
    | adhyaya 10
  devanagari: बलिकृतं २ श्रीकृष्णस्तोत्रम् बलिरुवाच । नमोऽनन्ताय बृहते नमः कृष्णाय वेधसे । साङ्ख्ययोगवितानाय
    ब्रह्मणे परमात्मने ॥ ३९॥ दर्शनं वां हि भूतानां दुष्प्रापं चाप्यदुर्लभम् । रजस्तमःस्वभावानां यन्नः
    प्राप्तौ यदृच्छया ॥ ४०॥ दैत्यदानवगन्धर्वाः सिद्धविद्याध्रचारणाः । यक्षरक्षःपिशाचाश्च भूतप्रमथनायकाः
    ॥ ४१॥ विशुद्धसत्त्वधाम्न्यद्धा त्वयि शास्त्रशरीरिणि । नित्यं निबद्धवैरास्ते वयं चान्ये च तादृशाः ॥
    ४२॥ केचनोद्बद्धवैरेण भक्त्या केचन कामतः । न तथा सत्त्वसंरब्धाः सन्निकृष्टाः सुरादयः ॥ ४३॥ इदमित्थमिति
    प्रायस्तव योगेश्वरेश्वर । न विदन्त्यपि योगेशा योगमायां कुतो वयम् ॥ ४४॥ तन्नः प्रसीद निरपेक्षविमृग्ययुष्मत्
    पादारविन्दधिषणान्यगृहान्धकूपात् । निष्क्रम्य विश्वशरणाङ्घ्र्युपलब्धवृत्तिः शान्तो यथैक उत सर्वसखैश्चरामि
    ॥ ४५॥ शाध्यस्मानीशितव्येश निष्पापान् कुरु नः प्रभो । पुमान् यच्छ्रद्धयाऽऽतिष्ठंश्चोदनाया विमुच्यते
    ॥ ४६॥ इति श्रीमद्भागवतमहापुराणे दशमस्कन्धे उत्तरार्धे पञ्चाशीतितमाध्यायान्तर्गतं बलिकृतं श्रीकृष्णस्तोत्रं
    समाप्तम् । भागवतपुराण । अध्याय १०
