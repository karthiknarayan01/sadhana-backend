id: paramakrishnakavacam
category: kavacha
name:
  english: paramakrishnakavacam
  devanagari: परमकृष्णकवचम्
content:
  english: shriparamakrishnakavacam asya shriparamakrishnakavacamantrasya yajnopurusharishih anushtupchandah
    shriparamakrishnadevata sarvabhishtasiddhyarthe pathe viniyogah || || dhyanam || vande navajaladharashyamam
    pitambaradharam harim | venuvadanatatpremna gopicittaikajivanam || shrivatsakaustubhopetam barhicudavibhushitam
    | radhasametam govindam sarvarakshakaram bhaje || || atha kavacam || om shrikrishnah shiro'vyat
  devanagari: श्रीपरमकृष्णकवचम् अस्य श्रीपरमकृष्णकवचमन्त्रस्य यज्ञोपुरुषऋषिः अनुष्टुप्छन्दः श्रीपरमकृष्णदेवता
    सर्वाभीष्टसिद्ध्यर्थे पाठे विनियोगः ॥ ॥ ध्यानम् ॥ वन्दे नवजलधरश्यामं पीताम्बरधरं हरिम् । वेणुवादनतत्प्रेम्णा
    गोपीचित्तैकजीवनम् ॥ श्रीवत्सकौस्तुभोपेतं बर्हिचूडाविभूषितम् । राधासमेतं गोविन्दं सर्वरक्षाकरं भजे
    ॥ ॥ अथ कवचम् ॥ ॐ श्रीकृष्णः शिरोऽव्यात्
meaning: {}
