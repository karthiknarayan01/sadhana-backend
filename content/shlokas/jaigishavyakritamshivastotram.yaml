id: jaigishavyakritamshivastotram
category: stotram
name:
  english: jaigishavyakritamshivastotram
  devanagari: जैगीषव्यकृतंशिवस्तोत्रम्
content:
  english: 40|| candrardhashuddhabhushaya candrasuryagnicakshushe | namaste carmavasana namo digvasanaya
    te || 41|| jagadishaya jirnaya jarajanmaharaya te | jivaya te namastubhyam janjapukadiharine || 42||
    namo damaruhastaya dhanurhastaya te namah | trinetraya namastubhyam jagannetraya te namah || 43||
    trishulavyagrahastaya namastripathagadhara | trivishtapadhinathaya trivedipathitaya ca || 44|| trayimayaya
    tushtaya bhaktatushtipradaya ca | dikshitaya namastubhyam devadevaya te namah || 45|| daritasheshapapaya
    namaste dirghadarshine | duraya duravapyaya doshanirdalanaya ca || 46|| doshakarakaladhara tyaktadoshagamaya
    ca | namo dhurjataye tubhyam dhatturakusumapriya || 47|| namo dhiraya dharmaya dharmapalaya te namah
    | nilagriva namastubhyam namaste nilalohita || 48|| namamatrasmritikritam trailokyaishvaryapuraka
    | namah pramathanathaya pinakodyatapanaye || 49|| pashupashavimokshaya pashunam pataye namah | namoccaranamatrena
    mahapatakaharine || 2
  devanagari: ४०॥ चन्द्रार्धशुद्धभूषाय चन्द्रसूर्याग्निचक्षुषे । नमस्ते चर्मवसन नमो दिग्वसनाय ते ॥ ४१॥
    जगदीशाय जीर्णाय जराजन्महराय ते । जीवाय ते नमस्तुभ्यं जञ्जपूकादिहारिणे ॥ ४२॥ नमो डमरुहस्ताय धनुर्हस्ताय
    ते नमः । त्रिनेत्राय नमस्तुभ्यं जगन्नेत्राय ते नमः ॥ ४३॥ त्रिशूलव्यग्रहस्ताय नमस्त्रिपथगाधर । त्रिविष्टपाधिनाथाय
    त्रिवेदीपठिताय च ॥ ४४॥ त्रयीमयाय तुष्टाय भक्ततुष्टिप्रदाय च । दीक्षिताय नमस्तुभ्यं देवदेवाय ते नमः
    ॥ ४५॥ दारिताशेषपापाय नमस्ते दीर्घदर्शिने । दूराय दुरवाप्याय दोषनिर्दलनाय च ॥ ४६॥ दोषाकरकलाधार त्यक्तदोषागमाय
    च । नमो धूर्जटये तुभ्यं धत्तूरकुसुमप्रिय ॥ ४७॥ नमो धीराय धर्माय धर्मपालाय ते नमः । नीलग्रीव नमस्तुभ्यं
    नमस्ते नीललोहित ॥ ४८॥ नाममात्रस्मृतिकृतां त्रैलोक्यैश्वर्यपूरक । नमः प्रमथनाथाय पिनाकोद्यतपाणये ॥
    ४९॥ पशुपाशविमोक्षाय पशूनां पतये नमः । नामोच्चारणमात्रेण महापातकहारिणे ॥ २
