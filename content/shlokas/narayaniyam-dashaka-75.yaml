id: narayaniyam-dashaka-75
category: stotram
name:
  english: Narayaniyam Dashaka 75
content:
  english: pratah santrastabhojakshitipativacasa prastute mallaturye sanghe rajnam ca mancanabhiyayushi
    gate nandagope'pi harmyam | kamse saudhadhirudhe tvamapi sahabalah sanugashcaruvesho rangadvaram gato'bhuh
    kupitakuvalayapidanagavalidham || || papishthapehi margaddrutamiti vacasa nishthurakruddhabuddhe rambashthasya
    pranodadadhikajavajusha hastina grihyamanah | kelimukto'tha gopikucakalashaciraspardhinam kumbhamasya
    vyahatyaliyathastvam caranabhuvi punarnirgato valguhasi || || hastaprapyo'pyagamyo jhatiti munijanasyeva
    dhavan gajendram kridannapatya bhumau punarabhipatatastasya dantam sajivam | muladunmulya tanmulagamahitamahamauktikanyatmamitre
    pradastvam haramebhirlalitaviracitam radhikayai disheti || || grihnanam dantamamse yutamatha halina
    rangamangavishantam tvam mangalyangabhangirabhasahritamanolocana vikshya lokah | hamho dhanyo hi nando
    nahi nahi pashupalangana no yashoda no no dhanyekshanah smastrijagati vayameveti sarve shashamsuh
    || || purnam brahmaiva sakshanniravadhi paramanandasandraprakasham gopeshu tvam vyalasirna khalu bahujanaistavadavedito'bhuh
    | drishtva'tha tvam tadedamprathamamupagate punyakale janaughah purnananda vipapah sarasamabhijagustvatkritani
    smritani || || canuro mallavirastadanu nripagira mushtiko mushtishali tvam ramam cabhipede jhatajhatiti
    mitho mushtipatatiruksham | utpatapatanakarshanavividharananyasatam tatra citram mrityoh prageva mallaprabhuragamadayam
    bhurisho bandhamokshan || || ha dhik kashtam kumarau sulalitavapushau mallavirau kathorau na drakshyamo
    vrajamastvaritamiti jane bhashamane tadanim | canuram tam karodbhramanavigaladasum pothayamasithorvyam
    pishto'bhunmushtiko'pi drutamatha halina nashtashishtairdadhave || || kamsa samvarya turyam khalamatiravidan
    karyamaryan pitrimsta nahantum vyaptamurtestava ca samashishadduramutsaranaya | rushto dushtoktibhistvam
    garuda iva girim mancamancannudancat khadgavyavalgadussangrahamapi ca hathat pragrahiraugrasenim ||
    || sadyo nishpishtasandhim bhuvi narapatimapatya tasyoparishta ttvayyapatye tadaiva tvadupari patita
    nakinam pushpavrishtih | kim kim brumastadanim satatamapi bhiya tvadgatatma sa bheje sayujyam tvadvadhottha
    parama paramiyam vasana kalanemeh || || tadbhratrinashta pishtva drutamatha pitarau sannamannugrasenam
    kritva rajanamuccairyadukulamakhilam modayan kamadanaih | bhaktanamuttamam coddhavamamaraguroraptanitim
    sakhayam labdhva tushto nagaryam pavanapurapate rundhi me sarvarogan ||
  devanagari: प्रातः सन्त्रस्तभोजक्षितिपतिवचसा प्रस्तुते मल्लतूर्ये सङ्घे राज्ञां च मञ्चानभिययुषि गते
    नन्दगोपेऽपि हर्म्यम् । कंसे सौधाधिरूढे त्वमपि सहबलः सानुगश्चारुवेषो रङ्गद्वारं गतोऽभूः कुपितकुवलयापीडनागावलीढम्
    ॥ ॥ पापिष्ठापेहि मार्गाद्द्रुतमिति वचसा निष्ठुरक्रुद्धबुद्धे रम्बष्ठस्य प्रणोदादधिकजवजुषा हस्तिना
    गृह्यमाणः । केलीमुक्तोऽथ गोपीकुचकलशचिरस्पर्धिनं कुम्भमस्य व्याहत्यालीयथास्त्वं चरणभुवि पुनर्निर्गतो
    वल्गुहासी ॥ ॥ हस्तप्राप्योऽप्यगम्यो झटिति मुनिजनस्येव धावन् गजेन्द्रं क्रीडन्नापात्य भूमौ पुनरभिपततस्तस्य
    दन्तं सजीवम् । मूलादुन्मूल्य तन्मूलगमहितमहामौक्तिकान्यात्ममित्रे प्रादास्त्वं हारमेभिर्ललितविरचितं
    राधिकायै दिशेति ॥ ॥ गृह्णानं दन्तमंसे युतमथ हलिना रङ्गमङ्गाविशन्तं त्वां मङ्गल्याङ्गभङ्गीरभसहृतमनोलोचना
    वीक्ष्य लोकाः । हंहो धन्यो हि नन्दो नहि नहि पशुपालाङ्गना नो यशोदा नो नो धन्येक्षणाः स्मस्त्रिजगति
    वयमेवेति सर्वे शशंसुः ॥ ॥ पूर्णं ब्रह्मैव साक्षान्निरवधि परमानन्दसान्द्रप्रकाशं गोपेशु त्वं व्यलासीर्न
    खलु बहुजनैस्तावदावेदितोऽभूः । दृष्ट्वाऽथ त्वां तदेदम्प्रथममुपगते पुण्यकाले जनौघाः पूर्णानन्दा विपापाः
    सरसमभिजगुस्त्वत्कृतानि स्मृतानि ॥ ॥ चाणूरो मल्लवीरस्तदनु नृपगिरा मुष्टिको मुष्टिशाली त्वां रामं चाभिपेदे
    झटझटिति मिथो मुष्टिपातातिरूक्षम् । उत्पातापातनाकर्षणविविधरणान्यासतां तत्र चित्रं मृत्योः प्रागेव मल्लप्रभुरगमदयं
    भूरिशो बन्धमोक्षान् ॥ ॥ हा धिक् कष्टं कुमारौ सुललितवपुषौ मल्लवीरौ कठोरौ न द्रक्ष्यामो व्रजामस्त्वरितमिति
    जने भाषमाणे तदानीम् । चाणूरं तं करोद्भ्रामणविगलदसुं पोथयामासिथोर्व्यां पिष्टोऽभून्मुष्टिकोऽपि द्रुतमथ
    हलिना नष्टशिष्टैर्दधावे ॥ ॥ कंस संवार्य तूर्यं खलमतिरविदन् कार्यमार्यान् पितृंस्ता नाहन्तुं व्याप्तमूर्तेस्तव
    च समशिषद्दूरमुत्सारणाय । रुष्टो दुष्टोक्तिभिस्त्वं गरुड इव गिरिं मञ्चमञ्चन्नुदञ्चत् खड्गव्यावल्गदुस्सङ्ग्रहमपि
    च हठात् प्राग्रहीरौग्रसेनिम् ॥ ॥ सद्यो निष्पिष्टसन्धिं भुवि नरपतिमापात्य तस्योपरिष्टा त्त्वय्यापात्ये
    तदैव त्वदुपरि पतिता नाकिनां पुष्पवृष्टिः । किं किं ब्रूमस्तदानीं सततमपि भिया त्वद्गतात्मा स भेजे सायुज्यं
    त्वद्वधोत्था परम परमियं वासना कालनेमेः ॥ ॥ तद्भ्रातृनष्ट पिष्ट्वा द्रुतमथ पितरौ सन्नमन्नुग्रसेनं कृत्वा
    राजानमुच्चैर्यदुकुलमखिलं मोदयन् कामदानैः । भक्तानामुत्तमं चोद्धवममरगुरोराप्तनीतिं सखायं लब्ध्वा तुष्टो
    नगर्यां पवनपुरपते रुन्धि मे सर्वरोगान् ॥
