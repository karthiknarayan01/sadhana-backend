id: sri-rama-charita-manasa-uttara-kanda
category: stotram
name:
  english: Sri Rama Charita Manasa - Uttara Kanda
content:
  english: shri ganeshaya namah shrijanakivallabho vijayate shriramacaritamanasa saptama sopana kekikanthabhanilam
    suravaravilasadviprapadabjacihnam shobhadhyam pitavastram sarasijanayanam sarvada suprasannam| panau
    naracacapam kapinikarayutam bandhuna sevyamanam naumidyam janakisham raghuvaramanisham pushpakarudharamam
    || || kosalendrapadakanjamanjulau komalavajamaheshavanditau| janakikarasarojalalitau cintakasya manabhringasadginau
    || || kundindudaragaurasundaram ambikapatimabhishtasiddhidam| karunikakalakanjalocanam naumi shankaramanangamocanam
    || raha eka dina avadhi kara ati arata pura loga| jaha~ taha~ socahim nari nara krisa tana rama biyoga
    || saguna hohim sundara sakala mana prasanna saba kera| prabhu agavana janava janu nagara ramya cahu~
    phera || kausalyadi matu saba mana ananda asa hoi| ayu prabhu shri anuja juta kahana cahata aba koi
    || bharata nayana bhuja dacchina pharakata barahim bara| jani saguna mana harasha ati lage karana
    bicara || raheu eka dina avadhi adhara| samujhata mana dukha bhayu apara || karana kavana natha nahim
    ayu| jani kutila kidhaum mohi bisarayu || ahaha dhanya lachimana barabhagi| rama padarabindu anuragi
    || kapati kutila mohi prabhu cinha| tate natha sanga nahim linha || jaum karani samujhai prabhu mori|
    nahim nistara kalapa sata kori || jana avaguna prabhu mana na k | dina bandhu ati mridula subh ||
    mori jiya~ bharosa drirha soi| milihahim rama saguna subha hoi || bitem avadhi rahahi jaum prana|
    adhama kavana jaga mohi samana || do rama biraha sagara maha~ bharata magana mana hota| bipra rupa
    dhari pavana suta ai gayu janu pota || || baithi dekhi kusasana jata mukuta krisa gata| rama rama
    raghupati japata stravata nayana jalajata || || dekhata hanumana ati harasheu| pulaka gata locana
    jala barasheu || mana maha~ bahuta bha~ti sukha mani| boleu shravana sudha sama bani || jasu biraha~
    socahu dina rati| ratahu nirantara guna gana pa~ti || raghukula tilaka sujana sukhadata| ayu kusala
    deva muni trata || ripu rana jiti sujasa sura gavata| sita sahita anuja prabhu avata || sunata bacana
    bisare saba dukha| trishavanta jimi pai piyusha || ko tumha tata kaha~ te ae| mohi parama priya bacana
    sunae || maruta suta maim kapi hanumana| namu mora sunu kripanidhana || dinabandhu raghupati kara
    kinkara| sunata bharata bhenteu uthi sadara || milata prema nahim hridaya~ samata| nayana stravata
    jala pulakita gata || kapi tava darasa sakala dukha bite| mile aju mohi rama pirite || bara bara bujhi
    kusalata| to kahu~ deu~ kaha sunu bhrata || ehi sandesa sarisa jaga mahim| kari bicara dekheu~ kachu
    nahim || nahina tata urina maim tohi| aba prabhu carita sunavahu mohi || taba hanumanta nai pada matha|
    kahe sakala raghupati guna gatha || kahu kapi kabahu~ kripala gosaim| sumirahim mohi dasa ki naim
    || cham nija dasa jyom raghubamsabhushana kabahu~ mama sumirana kar yo| suni bharata bacana binita
    ati kapi pulakita tana carananhi par yo || raghubira nija mukha jasu guna gana kahata aga jaga natha
    jo| kahe na hoi binita parama punita sadaguna sindhu so || do rama prana priya natha tumha satya bacana
    mama tata| puni puni milata bharata suni harasha na hridaya~ samata || bharata carana siru nai turita
    gayu kapi rama pahim| kahi kusala saba jai harashi caleu prabhu jana carhai || || harashi bharata
    kosalapura ae| samacara saba gurahi sunae || puni mandira maha~ bata janai| avata nagara kusala raghurai
    || sunata sakala jananim uthi dhaim| kahi prabhu kusala bharata samujhai || samacara purabasimha pae|
    nara aru nari harashi saba dhae || dadhi durba rocana phala phula| nava tulasi dala mangala mula ||
    bhari bhari hema thara bhamini| gavata calim sindhu sindhuragamini || je jaisehim taisehim uti dhavahim|
    bala briddha kaha~ sanga na lavahim || eka ekanha kaha~ bujhahim bhai| tumha dekhe dayala raghurai
    || avadhapuri prabhu avata jani| bhi sakala sobha kai khani || bahi suhavana tribidha samira| bhi
    saraju ati nirmala nira || do harashita gura parijana anuja bhusura brinda sameta| cale bharata mana
    prema ati sanmukha kripaniketa || || bahutaka carhai atarinha nirakhahim gagana bimana| dekhi madhura
    sura harashita karahim sumangala gana || || raka sasi raghupati pura sindhu dekhi harashana| barhayo
    kolahala karata janu nari taranga samana || || iha~ bhanukula kamala divakara| kapinha dekhavata nagara
    manohara || sunu kapisa angada lankesa| pavana puri rucira yaha desa || jadyapi saba baikuntha bakhana|
    beda purana bidita jagu jana || avadhapuri sama priya nahim sou| yaha prasanga jani kau kou || janmabhumi
    mama puri suhavani| uttara disi baha saraju pavani || ja majjana te binahim prayasa| mama samipa nara
    pavahim basa || ati priya mohi iha~ ke basi| mama dhamada puri sukha rasi || harashe saba kapi suni
    prabhu bani| dhanya avadha jo rama bakhani || do avata dekhi loga saba kripasindhu bhagavana| nagara
    nikata prabhu prereu utareu bhumi bimana || || utari kaheu prabhu pushpakahi tumha kubera pahim jahu|
    prerita rama caleu so harashu birahu ati tahu || || ae bharata sanga saba loga| krisa tana shriraghubira
    biyoga || bamadeva basishtha muninayaka| dekhe prabhu mahi dhari dhanu sayaka || dhai dhare gura carana
    saroruha| anuja sahita ati pulaka tanoruha || bhenti kusala bujhi muniraya| hamarem kusala tumharihim
    daya || sakala dvijanha mili nayu matha| dharma dhurandhara raghukulanatha || gahe bharata puni prabhu
    pada pankaja| namata jinhahi sura muni sankara aja || pare bhumi nahim uthata uthae| bara kari kripasindhu
    ura lae || syamala gata roma bhe tharhae| nava rajiva nayana jala barhae || cham rajiva locana stravata
    jala tana lalita pulakavali bani| ati prema hridaya~ lagai anujahi mile prabhu tribhuana dhani ||
    prabhu milata anujahi soha mo pahim jati nahim upama kahi| janu prema aru singara tanu dhari mile
    bara sushama lahi || || bujhata kripanidhi kusala bharatahi bacana begi na avi| sunu siva so sukha
    bacana mana te bhinna jana jo pavi || aba kusala kausalanatha arata jani jana darasana diyo| burata
    biraha barisa kripanidhana mohi kara gahi liyo || puni prabhu harashi satruhana bhente hridaya~ lagai|
    lachimana bharata mile taba parama prema dau bhai || || bharatanuja lachimana puni bhente| dusaha
    biraha sambhava dukha mete || sita carana bharata siru nava| anuja sameta parama sukha pava || prabhu
    biloki harashe purabasi| janita biyoga bipati saba nasi || prematura saba loga nihari| kautuka kinha
    kripala kharari || amita rupa pragate tehi kala| jathajoga mile sabahi kripala || kripadrishti raghubira
    biloki| kie sakala nara nari bisoki || chana mahim sabahi mile bhagavana| uma marama yaha kahu~ na
    jana || ehi bidhi sabahi sukhi kari rama| agem cale sila guna dhama || kausalyadi matu saba dhai|
    nirakhi baccha janu dhenu lavai || cham janu dhenu balaka baccha taji griha~ carana bana parabasa
    gim| dina anta pura rukha stravata thana hunkara kari dhavata bhi || ati prema saba matu bhetim bacana
    mridu bahubidhi kahe| gi bishama biyoga bhava tinha harasha sukha aganita lahe || do bheteu tanaya
    sumitra~ rama carana rati jani| ramahi milata kaikei hridaya~ bahuta sakucani || || lachimana saba
    matanha mili harashe asisha pai| kaikei kaha~ puni puni mile mana kara chobhu na jai || || sasunha
    sabani mili baidehi| carananhi lagi harashu ati tehi || dehim asisa bujhi kusalata| hoi acala tumhara
    ahivata || saba raghupati mukha kamala bilokahim| mangala jani nayana jala rokahim || kanaka thara
    arati utarahim| bara bara prabhu gata niharahim || nana bha~ti nichavari karahim| paramananda harasha
    ura bharahim || kausalya puni puni raghubirahi| citavati kripasindhu ranadhirahi || hridaya~ bicarati
    barahim bara| kavana bha~ti lankapati mara || ati sukumara jugala mere bare| nisicara subhata mahabala
    bhare || do lachimana aru sita sahita prabhuhi bilokati matu| paramananda magana mana puni puni pulakita
    gatu || || lankapati kapisa nala nila| jamavanta angada subhasila || hanumadadi saba banara bira|
    dhare manohara manuja sarira || bharata saneha sila brata nema| sadara saba baranahim ati prema ||
    dekhi nagarabasimha kai riti| sakala sarahahi prabhu pada priti || puni raghupati saba sakha bolae|
    muni pada lagahu sakala sikhae || gura basishta kulapujya hamare| inha ki kripa~ danuja rana mare
    || e saba sakha sunahu muni mere| bhe samara sagara kaha~ bere || mama hita lagi janma inha hare|
    bharatahu te mohi adhika piare || suni prabhu bacana magana saba bhe| nimisha nimisha upajata sukha
    ne || do kausalya ke carananhi puni tinha nayu matha || asisha dinhe harashi tumha priya mama jimi
    raghunatha || || sumana brishti nabha sankula bhavana cale sukhakanda| carhai atarinha dekhahim nagara
    nari nara brinda || || kancana kalasa bicitra sa~vare| sabahim dhare saji nija nija dvare || bandanavara
    pataka ketu| sabanhi banae mangala hetu || bithim sakala sugandha sincai| gajamani raci bahu cauka
    purai || nana bha~ti sumangala saje| harashi nagara nisana bahu baje || jaha~ taha~ nari nichavara
    karahim| dehim asisa harasha ura bharahim || kancana thara arati nana| jubati sajem karahim subha
    gana || karahim arati aratihara kem| raghukula kamala bipina dinakara kem || pura sobha sampati kalyana|
    nigama sesha sarada bakhana || teu yaha carita dekhi thagi rahahim| uma tasu guna nara kimi kahahim
    || do nari kumudinim avadha sara raghupati biraha dinesa| asta bhe~ bigasata bhim nirakhi rama rakesa
    || || hohim saguna subha bibidha bidhi bajahim gagana nisana| pura nara nari sanatha kari bhavana
    cale bhagavana || || prabhu jani kaikei lajani| prathama tasu griha ge bhavani || tahi prabodhi bahuta
    sukha dinha| puni nija bhavana gavana hari kinha || kripasindhu jaba mandira ge| pura nara nari sukhi
    saba bhe || gura basishta dvija lie bulai| aju sughari sudina samudai || saba dvija dehu harashi anusasana|
    ramacandra baithahim singhasana || muni basishta ke bacana suhae| sunata sakala bipranha ati bhae
    || kahahim bacana mridu bipra aneka| jaga abhirama rama abhisheka || aba munibara bilamba nahim kije|
    maharaja kaha~ tilaka karijai || do taba muni kaheu sumantra sana sunata caleu harashai| ratha aneka
    bahu baji gaja turata sa~vare jai || || jaha~ taha~ dhavana pathi puni mangala drabya magai| harasha
    sameta basishta pada puni siru nayu ai || athava~ vishrama avadhapuri ati rucira banai| devanha sumana
    brishti jhari lai || rama kaha sevakanha bulai| prathama sakhanha anhavavahu jai || sunata bacana
    jaha~ taha~ jana dhae| sugrivadi turata anhavae || puni karunanidhi bharatu ha~kare| nija kara rama
    jata niruare || anhavae prabhu tiniu bhai| bhagata bachala kripala raghurai || bharata bhagya prabhu
    komalatai| sesha koti sata sakahim na gai || puni nija jata rama bibarae| gura anusasana magi nahae
    || kari majjana prabhu bhushana saje| anga ananga dekhi sata laje || do sasunha sadara janakihi majjana
    turata karai| dibya basana bara bhushana a~ga a~ga saje banai || || rama bama disi sobhati rama rupa
    guna khani| dekhi matu saba harashim janma suphala nija jani || || sunu khagesa tehi avasara brahma
    siva muni brinda| carhai bimana ae saba sura dekhana sukhakanda || || prabhu biloki muni mana anuraga|
    turata dibya singhasana maga || rabi sama teja so barani na jai| baithe rama dvijanha siru nai ||
    janakasuta sameta raghurai| pekhi praharashe muni samudai || beda mantra taba dvijanha ucare| nabha
    sura muni jaya jayati pukare || prathama tilaka basishta muni kinha| puni saba bipranha ayasu dinha
    || suta biloki harashim mahatari| bara bara arati utari || bipranha dana bibidha bidhi dinhe| jacaka
    sakala ajacaka kinhe || singhasana para tribhuana sai| dekhi suranha dundubhim bajaim || cham nabha
    dundubhim bajahim bipula gandharba kinnara gavahim| nacahim apachara brinda paramananda sura muni
    pavahim || bharatadi anuja bibhishanangada hanumadadi sameta te| gahem chatra camara byajana dhanu
    asi carma sakti birajate || || shri sahita dinakara bamsa bushana kama bahu chabi sohi| nava ambudhara
    bara gata ambara pita sura mana mohi || mukutangadadi bicitra bhushana anga anganhi prati saje| ambhoja
    nayana bisala ura bhuja dhanya nara nirakhanti je || vaha sobha samaja sukha kahata na bani khagesa|
    baranahim sarada sesha shruti so rasa jana mahesa || || bhinna bhinna astuti kari ge sura nija nija
    dhama| bandi besha beda taba ae jaha~ shrirama || || prabhu sarbagya kinha ati adara kripanidhana|
    lakheu na kahu~ marama kachu lage karana guna gana || jaya saguna nirguna rupa anupa bhupa siromane|
    dasakandharadi pracanda nisicara prabala khala bhuja bala hane || avatara nara samsara bhara bibhanji
    daruna dukha dahe| jaya pranatapala dayala prabhu sanjukta sakti namamahe || || tava bishama maya
    basa surasura naga nara aga jaga hare| bhava pantha bhramata amita divasa nisi kala karma gunani bhare
    || je natha kari karuna biloke tribidhi dukha te nirbahe| bhava kheda chedana daccha hama kahu~ raccha
    rama namamahe || || je gyana mana bimatta tava bhava harani bhakti na adari| te pai sura durlabha
    padadapi parata hama dekhata hari || bisvasa kari saba asa parihari dasa tava je hoi rahe| japi nama
    tava binu shrama tarahim bhava natha so samaramahe || || je carana siva aja pujya raja subha parasi
    munipatini tari| nakha nirgata muni bandita treloka pavani surasari || dhvaja kulisa ankusa kanja
    juta bana phirata kantaka kina lahe| pada kanja dvanda mukunda rama ramesa nitya bhajamahe || || abyaktamulamanadi
    taru tvaca cari nigamagama bhane| shata kandha sakha panca bisa aneka parna sumana ghane || phala
    jugala bidhi katu madhura beli akeli jehi ashrita rahe| pallavata phulata navala nita samsara bitapa
    namamahe || || je brahma ajamadvaitamanubhavagamya manapara dhyavahim| te kahahu~ janahu~ natha hama
    tava saguna jasa nita gavahim || karunayatana prabhu sadagunakara deva yaha bara magahim| mana bacana
    karma bikara taji tava carana hama anuragahim || saba ke dekhata bedanha binati kinhi udara| antardhana
    bhe puni ge brahma agara || || bainateya sunu sambhu taba ae jaha~ raghubira| binaya karata gadagada
    gira purita pulaka sarira || jaya rama ramaramanam samanam| bhava tapa bhayakula pahi janam || avadhesa
    suresa ramesa bibho| saranagata magata pahi prabho || || dasasisa binasana bisa bhuja| krita duri
    maha mahi bhuri ruja || rajanicara brinda patanga rahe| sara pavaka teja pracanda dahe || || mahi
    mandala mandana carutaram| dhrita sayaka capa nishanga baram || mada moha maha mamata rajani| tama
    punja divakara teja ani || || manajata kirata nipata kie| mriga loga kubhoga sarena hie || hati natha
    anathani pahi hare| bishaya bana pava~ra bhuli pare || || bahu roga biyoganhi loga he| bhavadanghri
    niradara ke phala e || bhava sindhu agadha pare nara te| pada pankaja prema na je karate || || ati
    dina malina dukhi nitahim| jinha ke pada pankaja priti nahim || avalamba bhavanta katha jinha ke ||
    priya santa ananta sada tinha kem || || nahim raga na lobha na mana mada || tinha kem sama baibhava
    va bipada || ehi te tava sevaka hota muda| muni tyagata joga bharosa sada || || kari prema nirantara
    nema lie~| pada pankaja sevata suddha hie~ || sama mani niradara adarahi| saba santa sukhi bicaranti
    mahi || || muni manasa pankaja bhringa bhaje| raghubira maha ranadhira aje || tava nama japami namami
    hari| bhava roga mahagada mana ari || || guna sila kripa paramayatanam| pranamami nirantara shriramanam
    || raghunanda nikandaya dvandvaghanam| mahipala bilokaya dina janam || bara bara bara magu~ harashi
    dehu shriranga| pada saroja anapayani bhagati sada satasanga || || barani umapati rama guna harashi
    ge kailasa| taba prabhu kapinha divae saba bidhi sukhaprada basa || || sunu khagapati yaha katha pavani|
    tribidha tapa bhava bhaya davani || maharaja kara subha abhisheka| sunata lahahim nara birati bibeka
    || je sakama nara sunahim je gavahim| sukha sampati nana bidhi pavahim || sura durlabha sukha kari
    jaga mahim| antakala raghupati pura jahim || sunahim bimukta birata aru bishi| lahahim bhagati gati
    sampati ni || khagapati rama katha maim barani| svamati bilasa trasa dukha harani || birati bibeka
    bhagati drirha karani| moha nadi kaha~ sundara tarani || nita nava mangala kausalapuri| harashita
    rahahim loga saba kuri || nita ni priti rama pada pankaja| sabakem jinhahi namata siva muni aja ||
    mangana bahu prakara pahirae| dvijanha dana nana bidhi pae || do brahmananda magana kapi saba kem
    prabhu pada priti| jata na jane divasa tinha ge masa shata biti || || bisare griha sapanehu~ sudhi
    nahim| jimi paradroha santa mana mahi || taba raghupati saba sakha bolae| ai sabanhi sadara siru nae
    || parama priti samipa baithare| bhagata sukhada mridu bacana ucare || tumha ati kinha mori sevakai|
    mukha para kehi bidhi karaum baraai || tate mohi tumha ati priya lage| mama hita lagi bhavana sukha
    tyage || anuja raja sampati baidehi| deha geha parivara sanehi || saba mama priya nahim tumhahi samana|
    mrisha na kahu~ mora yaha bana || saba ke priya sevaka yaha niti| morem adhika dasa para priti ||
    do aba griha jahu sakha saba bhajehu mohi drirha nema| sada sarbagata sarbahita jani karehu ati prema
    || || suni prabhu bacana magana saba bhe| ko hama kaha~ bisari tana ge || ekataka rahe jori kara age|
    sakahim na kachu kahi ati anurage || parama prema tinha kara prabhu dekha| kaha bibidha bidhi gyana
    bisesha || prabhu sanmukha kachu kahana na parahim| puni puni carana saroja niharahim || taba prabhu
    bhushana basana magae| nana ranga anupa suhae || sugrivahi prathamahim pahirae| basana bharata nija
    hatha banae || prabhu prerita lachimana pahirae| lankapati raghupati mana bhae || angada baitha raha
    nahim dola| priti dekhi prabhu tahi na bola || do jamavanta niladi saba pahirae raghunatha| hiya~
    dhari rama rupa saba cale nai pada matha || || taba angada uthi nai siru sajala nayana kara jori|
    ati binita boleu bacana manahu~ prema rasa bori || || sunu sarbagya kripa sukha sindho| dina dayakara
    arata bandho || marati bera natha mohi bali| gayu tumharehi konchem ghali || asarana sarana biradu
    sambhari| mohi jani tajahu bhagata hitakari || morem tumha prabhu gura pitu mata| jau~ kaha~ taji
    pada jalajata || tumhahi bicari kahahu naranaha| prabhu taji bhavana kaja mama kaha || balaka gyana
    buddhi bala hina| rakhahu sarana natha jana dina || nici tahala griha kai saba karihu~| pada pankaja
    biloki bhava tarihu~ || asa kahi carana pareu prabhu pahi| aba jani natha kahahu griha jahi || do
    angada bacana binita suni raghupati karuna simva| prabhu uthai ura layu sajala nayana rajiva || ||
    nija ura mala basana mani balitanaya pahirai| bida kinhi bhagavana taba bahu prakara samujhai || ||
    bharata anuja saumitra sameta| pathavana cale bhagata krita ceta || angada hridaya~ prema nahim thora|
    phiri phiri citava rama kim ora || bara bara kara danda pranama| mana asa rahana kahahim mohi rama
    || rama bilokani bolani calani| sumiri sumiri socata ha~si milani || prabhu rukha dekhi binaya bahu
    bhashi| caleu hridaya~ pada pankaja rakhi || ati adara saba kapi pahu~cae| bhainha sahita bharata
    puni ae || taba sugriva carana gahi nana| bha~ti binaya kinhe hanumana || dina dasa kari raghupati
    pada seva| puni tava carana dekhihu~ deva || punya punja tumha pavanakumara| sevahu jai kripa agara
    || asa kahi kapi saba cale turanta| angada kahi sunahu hanumanta || do kahehu dandavata prabhu saim
    tumhahi kahu~ kara jori| bara bara raghunayakahi surati karaehu mori || || asa kahi caleu balisuta
    phiri ayu hanumanta| tasu priti prabhu sana kahi magana bhe bhagavanta || || kulisahu cahi kathora
    ati komala kusumahu cahi| citta khagesa rama kara samujhi pari kahu kahi || || puni kripala liyo boli
    nishada| dinhe bhushana basana prasada || jahu bhavana mama sumirana karehu| mana krama bacana dharma
    anusarehu || tumha mama sakha bharata sama bhrata| sada rahehu pura avata jata || bacana sunata upaja
    sukha bhari| pareu carana bhari locana bari || carana nalina ura dhari griha ava| prabhu subhau parijananhi
    sunava || raghupati carita dekhi purabasi| puni puni kahahim dhanya sukharasi || rama raja bainthem
    treloka| harashita bhe ge saba soka || bayaru na kara kahu sana koi| rama pratapa bishamata khoi ||
    do baranashrama nija nija dharama banirata beda patha loga| calahim sada pavahim sukhahi nahim bhaya
    soka na roga || || daihika daivika bhautika tapa| rama raja nahim kahuhi byapa || saba nara karahim
    paraspara priti| calahim svadharma nirata shruti niti || cariu carana dharma jaga mahim| puri raha
    sapanehu~ agha nahim || rama bhagati rata nara aru nari| sakala parama gati ke adhikari || alpamrityu
    nahim kavaniu pira| saba sundara saba biruja sarira || nahim daridra kau dukhi na dina| nahim kau
    abudha na lacchana hina || saba nirdambha dharmarata puni| nara aru nari catura saba guni || saba
    gunagya pandita saba gyani| saba kritagya nahim kapata sayani || do rama raja nabhagesa sunu sacaracara
    jaga mahim || kala karma subhava guna krita dukha kahuhi nahim || || bhumi sapta sagara mekhala| eka
    bhupa raghupati kosala || bhuana aneka roma prati jasu| yaha prabhuta kachu bahuta na tasu || so mahima
    samujhata prabhu keri| yaha baranata hinata ghaneri || sau mahima khagesa jinha jani| phiri ehim carita
    tinhahu~ rati mani || sau jane kara phala yaha lila| kahahim maha munibara damasila || rama raja kara
    sukha sampada| barani na saki phanisa sarada || saba udara saba para upakari| bipra carana sevaka
    nara nari || ekanari brata rata saba jhari| te mana baca krama pati hitakari || do danda jatinha kara
    bheda jaha~ nartaka nritya samaja| jitahu manahi sunia asa ramacandra kem raja || || phulahim pharahim
    sada taru kanana| rahahi eka sa~ga gaja pancanana || khaga mriga sahaja bayaru bisarai| sabanhi paraspara
    priti barhaai || kujahim khaga mriga nana brinda| abhaya carahim bana karahim ananda || sitala surabhi
    pavana baha manda| gunjata ali lai cali makaranda || lata bitapa magem madhu cavahim| manabhavato
    dhenu paya stravahim || sasi sampanna sada raha dharani| treta~ bhi kritajuga kai karani || pragatim
    girinha bibidha mani khani| jagadatama bhupa jaga jani || sarita sakala bahahim bara bari| sitala
    amala svada sukhakari || sagara nija marajada~ rahahim| darahim ratna tatanhi nara lahahim || sarasija
    sankula sakala taraaga| ati prasanna dasa disa bibhaga || do bidhu mahi pura mayukhanhi rabi tapa
    jetanehi kaja| magem barida dehim jala ramacandra ke raja || || kotinha bajimedha prabhu kinhe| dana
    aneka dvijanha kaha~ dinhe || shruti patha palaka dharma dhurandhara| gunatita aru bhoga purandara
    || pati anukula sada raha sita| sobha khani susila binita || janati kripasindhu prabhutai| sevati
    carana kamala mana lai || jadyapi griha~ sevaka sevakini| bipula sada seva bidhi guni || nija kara
    griha paricaraja kari| ramacandra ayasu anusari || jehi bidhi kripasindhu sukha mani| soi kara shri
    seva bidhi jani || kausalyadi sasu griha mahim| sevi sabanhi mana mada nahim || uma rama brahmadi
    bandita| jagadamba santatamanindita || do jasu kripa katacchu sura cahata citava na soi| rama padarabinda
    rati karati subhavahi khoi || || sevahim sanakula saba bhai| rama carana rati ati adhikai || prabhu
    mukha kamala bilokata rahahim| kabahu~ kripala hamahi kachu kahahim || rama karahim bhratanha para
    priti| nana bha~ti sikhavahim niti || harashita rahahim nagara ke loga| karahim sakala sura durlabha
    bhoga || ahanisi bidhihi manavata rahahim| shriraghubira carana rati cahahim || dui suta sundara sita~
    jae| lava kusa beda purananha gae || dau biji bini guna mandira| hari pratibimba manahu~ ati sundara
    || dui dui suta saba bhratanha kere| bhe rupa guna sila ghanere || do gyana gira gotita aja maya mana
    guna para| soi saccidananda ghana kara nara carita udara || || pratakala saru kari majjana| baithahim
    sabha~ sanga dvija sajjana || beda purana basishta bakhanahim| sunahim rama jadyapi saba janahim ||
    anujanha sanjuta bhojana karahim| dekhi sakala jananim sukha bharahim || bharata satruhana donu bhai|
    sahita pavanasuta upabana jai || bujhahim baithi rama guna gaha| kaha hanumana sumati avagaha || sunata
    bimala guna ati sukha pavahim| bahuri bahuri kari binaya kahavahim || saba kem griha griha hohim purana|
    ramacarita pavana bidhi nana || nara aru nari rama guna ganahim| karahim divasa nisi jata na janahim
    || do avadhapuri basimha kara sukha sampada samaja| sahasa sesha nahim kahi sakahim jaha~ nripa rama
    biraja || || naradadi sanakadi munisa| darasana lagi kosaladhisa || dina prati sakala ajodhya avahim|
    dekhi nagaru biragu bisaravahim || jatarupa mani racita atarim| nana ranga rucira gaca dharim || pura
    cahu~ pasa kota ati sundara| race ka~gura ranga ranga bara || nava graha nikara anika banai| janu
    gheri amaravati ai || mahi bahu ranga racita gaca ka~ca| jo biloki munibara mana naca || dhavala dhama
    upara nabha cumbata| kalasa manahu~ rabi sasi duti nindata || bahu mani racita jharokha bhrajahim|
    griha griha prati mani dipa birajahim || cham mani dipa rajahim bhavana bhrajahim deharim bidruma
    raci| mani khambha bhiti biranci biraci kanaka mani marakata khaci || sundara manohara mandirayata
    ajira rucira phatika race| prati dvara dvara kapata purata banai bahu bajranhi khace || do caru citrasala
    griha griha prati likhe banai| rama carita je nirakha muni te mana lehim corai || || sumana batika
    sabahim lagai| bibidha bha~ti kari jatana banai || lata lalita bahu jati suhai| phulahim sada bamsata
    ki nai || gunjata madhukara mukhara manohara| maruta tribidha sada baha sundara || nana khaga balakanhi
    jiae| bolata madhura uraata suhae || mora hamsa sarasa paravata| bhavanani para sobha ati pavata ||
    jaha~ taha~ dekhahim nija parichahim| bahu bidhi kujahim nritya karahim || suka sarika parhaavahim
    balaka| kahahu rama raghupati janapalaka || raja duara sakala bidhi caru| bithim cauhata rucira bajaru
    || cham bajara rucira na bani baranata bastu binu gatha paie| jaha~ bhupa ramanivasa taha~ ki sampada
    kimi gaie || baithe bajaja sarapha banika aneka manahu~ kubera te| saba sukhi saba saccarita sundara
    nari nara sisu jaratha je || do uttara disi saraju baha nirmala jala gambhira| ba~dhe ghata manohara
    svalpa panka nahim tira || || duri pharaka rucira so ghata| jaha~ jala piahim baji gaja thata || panighata
    parama manohara nana| taha~ na purusha karahim asnana || rajaghata saba bidhi sundara bara| majjahim
    taha~ barana cariu nara || tira tira devanha ke mandira| cahu~ disi tinha ke upabana sundara || kahu~
    kahu~ sarita tira udasi| basahim gyana rata muni sannyasi || tira tira tulasika suhai| brinda brinda
    bahu muninha lagai || pura sobha kachu barani na jai| bahera nagara parama rucirai || dekhata puri
    akhila agha bhaga| bana upabana bapika taraaga || cham bapim taraaga anupa kupa manoharayata sohahim|
    sopana sundara nira nirmala dekhi sura muni mohahim || bahu ranga kanja aneka khaga kujahim madhupa
    gunjarahim| arama ramya pikadi khaga rava janu pathika hankarahim || do ramanatha jaha~ raja so pura
    barani ki jai| animadika sukha sampada rahim avadha saba chai || || jaha~ taha~ nara raghupati guna
    gavahim| baithi parasapara ihi sikhavahim || bhajahu pranata pratipalaka ramahi| sobha sila rupa guna
    dhamahi || jalaja bilocana syamala gatahi| palaka nayana iva sevaka tratahi || dhrita sara rucira
    capa tunirahi| santa kanja bana rabi ranadhirahi || kala karala byala khagarajahi| namata rama akama
    mamata jahi || lobha moha mrigajutha kiratahi| manasija kari hari jana sukhadatahi || samsaya soka
    nibira tama bhanuhi| danuja gahana ghana dahana krisanuhi || janakasuta sameta raghubirahi| kasa na
    bhajahu bhanjana bhava bhirahi || bahu basana masaka hima rasihi| sada ekarasa aja abinasihi || muni
    ranjana bhanjana mahi bharahi| tulasidasa ke prabhuhi udarahi || do ehi bidhi nagara nari nara karahim
    rama guna gana| sanukula saba para rahahim santata kripanidhana || || jaba te rama pratapa khagesa|
    udita bhayu ati prabala dinesa || puri prakasa raheu tihu~ loka| bahutenha sukha bahutana mana soka
    || jinhahi soka te kahu~ bakhani| prathama abidya nisa nasani || agha uluka jaha~ taha~ lukane| kama
    krodha kairava sakucane || bibidha karma guna kala subh | e cakora sukha lahahim na k || matsara mana
    moha mada cora| inha kara hunara na kavanihu~ ora || dharama taraaga gyana bigyana| e pankaja bikase
    bidhi nana || sukha santosha biraga bibeka| bigata soka e koka aneka || do yaha pratapa rabi jakem
    ura jaba kari prakasa| pachile barhahim prathama je kahe te pavahim nasa || || bhratanha sahita ramu
    eka bara| sanga parama priya pavanakumara || sundara upabana dekhana ge| saba taru kusumita pallava
    ne || jani samaya sanakadika ae| teja punja guna sila suhae || brahmananda sada layalina| dekhata
    balaka bahukalina || rupa dharem janu cariu beda| samadarasi muni bigata bibheda || asa basana byasana
    yaha tinhahim| raghupati carita hoi taha~ sunahim || taha~ rahe sanakadi bhavani| jaha~ ghatasambhava
    munibara gyani || rama katha munibara bahu barani| gyana joni pavaka jimi arani || do dekhi rama muni
    avata harashi dandavata kinha| svagata pu~chi pita pata prabhu baithana kaha~ dinha || || kinha dandavata
    tiniu~ bhai| sahita pavanasuta sukha adhikai || muni raghupati chabi atula biloki| bhe magana mana
    sake na roki || syamala gata saroruha locana| sundarata mandira bhava mocana || ekataka rahe nimesha
    na lavahim| prabhu kara jorem sisa navavahim || tinha kai dasa dekhi raghubira| stravata nayana jala
    pulaka sarira || kara gahi prabhu munibara baithare| parama manohara bacana ucare || aju dhanya maim
    sunahu munisa| tumharem darasa jahim agha khisa || barae bhaga paiba satasanga| binahim prayasa hohim
    bhava bhanga || do santa sanga apabarga kara kami bhava kara pantha| kahahi santa kabi kobida shruti
    purana sadagrantha || || suni prabhu bacana harashi muni cari| pulakita tana astuti anusari || jaya
    bhagavanta ananta anamaya| anagha aneka eka karunamaya || jaya nirguna jaya jaya guna sagara| sukha
    mandira sundara ati nagara || jaya indira ramana jaya bhudhara| anupama aja anadi sobhakara || gyana
    nidhana amana manaprada| pavana sujasa purana beda bada || tagya kritagya agyata bhanjana| nama aneka
    anama niranjana || sarba sarbagata sarba uralaya| basasi sada hama kahu~ paripalaya || dvanda bipati
    bhava phanda bibhanjaya| hradi basi rama kama mada ganjaya || do paramananda kripayatana mana paripurana
    kama| prema bhagati anapayani dehu hamahi shrirama || || dehu bhagati raghupati ati pavani| tribidha
    tapa bhava dapa nasavani || pranata kama suradhenu kalapataru| hoi prasanna dijai prabhu yaha baru
    || bhava baridhi kumbhaja raghunayaka| sevata sulabha sakala sukha dayaka || mana sambhava daruna
    dukha daraya| dinabandhu samata bistaraya || asa trasa irishadi nivaraka| binaya bibeka birati bistaraka
    || bhupa mauli mana mandana dharani| dehi bhagati samsriti sari tarani || muni mana manasa hamsa nirantara|
    carana kamala bandita aja sankara || raghukula ketu setu shruti racchaka| kala karama subhau guna
    bhacchaka || tarana tarana harana saba dushana| tulasidasa prabhu tribhuvana bhushana || do bara bara
    astuti kari prema sahita siru nai| brahma bhavana sanakadi ge ati abhishta bara pai || || sanakadika
    bidhi loka sidhae| bhratanha rama carana siru nae || puchata prabhuhi sakala sakucahim| citavahim
    saba marutasuta pahim || suni cahahim prabhu mukha kai bani| jo suni hoi sakala bhrama hani || antarajami
    prabhu sabha jana| bujhata kahahu kaha hanumana || jori pani kaha taba hanumanta| sunahu dinadayala
    bhagavanta || natha bharata kachu pu~chana cahahim| prasna karata mana sakucata ahahim || tumha janahu
    kapi mora subh | bharatahi mohi kachu antara k || suni prabhu bacana bharata gahe carana| sunahu natha
    pranatarati harana || do natha na mohi sandeha kachu sapanehu~ soka na moha| kevala kripa tumharihi
    kripananda sandoha || || karu~ kripanidhi eka dhithai| maim sevaka tumha jana sukhadai || santanha
    kai mahima raghurai| bahu bidhi beda purananha gai || shrimukha tumha puni kinhi baraai| tinha para
    prabhuhi priti adhikai || suna cahu~ prabhu tinha kara lacchana| kripasindhu guna gyana bicacchana
    || santa asanta bheda bilagai| pranatapala mohi kahahu bujhai || santanha ke lacchana sunu bhrata|
    aganita shruti purana bikhyata || santa asantanhi kai asi karani| jimi kuthara candana acarani ||
    kati parasu malaya sunu bhai| nija guna dei sugandha basai || do tate sura sisanha carhata jaga ballabha
    shrikhanda| anala dahi pitata ghanahim parasu badana yaha danda || || bishaya alampata sila gunakara|
    para dukha dukha sukha sukha dekhe para || sama abhutaripu bimada biragi| lobhamarasha harasha bhaya
    tyagi || komalacita dinanha para daya| mana baca krama mama bhagati amaya || sabahi manaprada apu
    amani| bharata prana sama mama te prani || bigata kama mama nama parayana| santi birati binati muditayana
    || sitalata saralata mayatri| dvija pada priti dharma janayatri || e saba lacchana basahim jasu ura|
    janehu tata santa santata phura || sama dama niyama niti nahim dolahim| parusha bacana kabahu~ nahim
    bolahim || do ninda astuti ubhaya sama mamata mama pada kanja| te sajjana mama pranapriya guna mandira
    sukha punja || || sanahu asantanha kera subh | bhulehu~ sangati karia na k || tinha kara sanga sada
    dukhadai| jimi kalapahi ghali harahai || khalanha hridaya~ ati tapa biseshi| jarahim sada para sampati
    dekhi || jaha~ kahu~ ninda sunahim parai| harashahim manahu~ pari nidhi pai || kama krodha mada lobha
    parayana| nirdaya kapati kutila malayana || bayaru akarana saba kahu som| jo kara hita anahita tahu
    som || jhuthi lena jhuthi dena| jhuthi bhojana jhutha cabena || bolahim madhura bacana jimi mora|
    khai maha ati hridaya kathora || do para drohi para dara rata para dhana para apabada| te nara pa~vara
    papamaya deha dharem manujada || || lobhi orhana lobhi dasana| sistrodara para jamapura trasa na ||
    kahu ki jaum sunahim baraai| svasa lehim janu jurai ai || jaba kahu kai dekhahim bipati| sukhi bhe
    manahu~ jaga nripati || svaratha rata parivara birodhi| lampata kama lobha ati krodhi || matu pita
    gura bipra na manahim| apu ge aru ghalahim anahim || karahim moha basa droha parava| santa sanga hari
    katha na bhava || avaguna sindhu mandamati kami| beda bidushaka paradhana svami || bipra droha para
    droha bisesha| dambha kapata jiya~ dharem subesha || do aise adhama manuja khala kritajuga treta nahim|
    dvapara kachuka brinda bahu hoihahim kalijuga mahim || || para hita sarisa dharma nahim bhai| para
    piraa sama nahim adhamai || nirnaya sakala purana beda kara| kaheu~ tata janahim kobida nara || nara
    sarira dhari je para pira| karahim te sahahim maha bhava bhira || karahim moha basa nara agha nana|
    svaratha rata paraloka nasana || kalarupa tinha kaha~ maim bhrata| subha aru asubha karma phala data
    || asa bicari je parama sayane| bhajahim mohi samsrita dukha jane || tyagahim karma subhasubha dayaka|
    bhajahim mohi sura nara muni nayaka || santa asantanha ke guna bhashe| te na parahim bhava jinha lakhi
    rakhe || do sunahu tata maya krita guna aru dosha aneka| guna yaha ubhaya na dekhiahim dekhia so abibeka
    || || shrimukha bacana sunata saba bhai| harashe prema na hridaya~ samai || karahim binaya ati barahim
    bara| hanumana hiya~ harasha apara || puni raghupati nija mandira ge| ehi bidhi carita karata nita
    ne || bara bara narada muni avahim| carita punita rama ke gavahim || nita nava carana dekhi muni jahim|
    brahmaloka saba katha kahahim || suni biranci atisaya sukha manahim| puni puni tata karahu guna ganahim
    || sanakadika naradahi sarahahim| jadyapi brahma nirata muni ahahim || suni guna gana samadhi bisari
    || sadara sunahim parama adhikari || do jivanamukta brahmapara carita sunahim taji dhyana| je hari
    katha~ na karahim rati tinha ke hiya pashana || || eka bara raghunatha bolae| gura dvija purabasi
    saba ae || baithe gura muni aru dvija sajjana| bole bacana bhagata bhava bhanjana || sanahu sakala
    purajana mama bani| kahu~ na kachu mamata ura ani || nahim aniti nahim kachu prabhutai| sunahu karahu
    jo tumhahi sohai || soi sevaka priyatama mama soi| mama anusasana manai joi || jaum aniti kachu bhashaum
    bhai| taum mohi barajahu bhaya bisarai || baraem bhaga manusha tanu pava| sura durlabha saba granthinha
    gava || sadhana dhama moccha kara dvara| pai na jehim paraloka sa~vara || do so paratra dukha pavi
    sira dhuni dhuni pachitai| kalahi karmahi isvarahi mithya dosha lagai || || ehi tana kara phala bishaya
    na bhai| svargu svalpa anta dukhadai || nara tanu pai bishaya~ mana dehim| palati sudha te satha bisha
    lehim || tahi kabahu~ bhala kahi na koi| gunja grahi parasa mani khoi || akara cari laccha caurasi|
    joni bhramata yaha jiva abinasi || phirata sada maya kara prera| kala karma subhava guna ghera ||
    kabahu~ka kari karuna nara dehi| deta isa binu hetu sanehi || nara tanu bhava baridhi kahu~ bero|
    sanmukha maruta anugraha mero || karanadhara sadagura drirha nava| durlabha saja sulabha kari pava
    || do jo na tarai bhava sagara nara samaja asa pai| so krita nindaka mandamati atmahana gati jai ||
    || jaum paraloka iha~ sukha cahahu| suni mama bacana hrridaya~ drirha gahahu || sulabha sukhada maraga
    yaha bhai| bhagati mori purana shruti gai || gyana agama pratyuha aneka| sadhana kathina na mana kahu~
    teka || karata kashta bahu pavi kou| bhakti hina mohi priya nahim sou || bhakti sutantra sakala sukha
    khani| binu satasanga na pavahim prani || punya punja binu milahim na santa| satasangati samsriti
    kara anta || punya eka jaga mahu~ nahim duja| mana krama bacana bipra pada puja || sanukula tehi para
    muni deva| jo taji kapatu kari dvija seva || do auru eka guputa mata sabahi kahu~ kara jori| sankara
    bhajana bina nara bhagati na pavi mori || || kahahu bhagati patha kavana prayasa| joga na makha japa
    tapa upavasa || sarala subhava na mana kutilai| jatha labha santosha sadai || mora dasa kahai nara
    asa| kari tau kahahu kaha bisvasa || bahuta kahu~ ka katha barhaai| ehi acarana basya maim bhai ||
    baira na bigraha asa na trasa| sukhamaya tahi sada saba asa || anarambha aniketa amani| anagha arosha
    daccha bigyani || priti sada sajjana samsarga| trina sama bishaya svarga apabarga || bhagati paccha
    hatha nahim sathatai| dushta tarka saba duri bahai || do mama guna grama nama rata gata mamata mada
    moha| ta kara sukha soi jani parananda sandoha || || sunata sudhasama bacana rama ke| gahe sabani
    pada kripadhama ke || janani janaka gura bandhu hamare| kripa nidhana prana te pyare || tanu dhanu
    dhama rama hitakari| saba bidhi tumha pranatarati hari || asi sikha tumha binu dei na kou| matu pita
    svaratha rata ou || hetu rahita jaga juga upakari| tumha tumhara sevaka asurari || svaratha mita sakala
    jaga mahim| sapanehu~ prabhu paramaratha nahim || sabake bacana prema rasa sane| suni raghunatha hridaya~
    harashane || nija nija griha ge ayasu pai| baranata prabhu batakahi suhai || do uma avadhabasi nara
    nari kritaratha rupa| brahma saccidananda ghana raghunayaka jaha~ bhupa || || eka bara basishta muni
    ae| jaha~ rama sukhadhama suhae || ati adara raghunayaka kinha| pada pakhari padodaka linha || rama
    sunahu muni kaha kara jori| kripasindhu binati kachu mori || dekhi dekhi acarana tumhara| hota moha
    mama hridaya~ apara || mahima amita beda nahim jana| maim kehi bha~ti kahu~ bhagavana || uparohitya
    karma ati manda| beda purana sumriti kara ninda || jaba na leu~ maim taba bidhi mohi| kaha labha agem
    suta tohi || paramatama brahma nara rupa| hoihi raghukula bhushana bhupa || do taba maim hridaya~
    bicara joga jagya brata dana| ja kahu~ karia so paihu~ dharma na ehi sama ana || || japa tapa niyama
    joga nija dharma| shruti sambhava nana subha karma || gyana daya dama tiratha majjana| jaha~ lagi
    dharma kahata shruti sajjana || agama nigama purana aneka| parhae sune kara phala prabhu eka || taba
    pada pankaja priti nirantara| saba sadhana kara yaha phala sundara || chuti mala ki malahi ke dhoe~|
    ghrita ki pava koi bari biloe~ || prema bhagati jala binu raghurai| abhiantara mala kabahu~ na jai
    || soi sarbagya tagya soi pandita| soi guna griha bigyana akhandita || daccha sakala lacchana juta
    soi| jakem pada saroja rati hoi || do natha eka bara magu~ rama kripa kari dehu| janma janma prabhu
    pada kamala kabahu~ ghatai jani nehu || || asa kahi muni basishta griha ae| kripasindhu ke mana ati
    bhae || hanumana bharatadika bhrata| sanga lie sevaka sukhadata || puni kripala pura bahera ge| gaja
    ratha turaga magavata bhe || dekhi kripa kari sakala sarahe| die ucita jinha jinha tei cahe || harana
    sakala shrama prabhu shrama pai| ge jaha~ sitala ava~rai || bharata dinha nija basana dasai| baithe
    prabhu sevahim saba bhai || marutasuta taba maruta kari| pulaka bapusha locana jala bhari || hanumana
    sama nahim barabhagi| nahim kau rama carana anuragi || girija jasu priti sevakai| bara bara prabhu
    nija mukha gai || do tehim avasara muni narada ae karatala bina| gavana lage rama kala kirati sada
    nabina || || mamavalokaya pankaja locana| kripa bilokani soca bimocana || nila tamarasa syama kama
    ari| hridaya kanja makaranda madhupa hari || jatudhana barutha bala bhanjana| muni sajjana ranjana
    agha ganjana || bhusura sasi nava brinda balahaka| asarana sarana dina jana gahaka || bhuja bala bipula
    bhara mahi khandita| khara dushana biradha badha pandita || ravanari sukharupa bhupabara| jaya dasaratha
    kula kumuda sudhakara || sujasa purana bidita nigamagama| gavata sura muni santa samagama || karunika
    byalika mada khandana| saba bidhi kusala kosala mandana || kali mala mathana nama mamatahana| tulasidasa
    prabhu pahi pranata jana || do prema sahita muni narada barani rama guna grama| sobhasindhu hridaya~
    dhari ge jaha~ bidhi dhama || || girija sunahu bisada yaha katha| maim saba kahi mori mati jatha ||
    rama carita sata koti apara| shruti sarada na baranai para || rama ananta ananta gunani| janma karma
    ananta namani || jala sikara mahi raja gani jahim| raghupati carita na barani sirahim || bimala katha
    hari pada dayani| bhagati hoi suni anapayani || uma kahiu~ saba katha suhai| jo bhusundi khagapatihi
    sunai || kachuka rama guna kaheu~ bakhani| aba ka kahaum so kahahu bhavani || suni subha katha uma
    harashani| boli ati binita mridu bani || dhanya dhanya maim dhanya purari| suneu~ rama guna bhava
    bhaya hari || do tumhari kripa~ kripayatana aba kritakritya na moha| janeu~ rama pratapa prabhu cidananda
    sandoha || || natha tavanana sasi sravata katha sudha raghubira| shravana putanhi mana pana kari nahim
    aghata matidhira || || rama carita je sunata aghahim| rasa bisesha jana tinha nahim || jivanamukta
    mahamuni jeu| hari guna sunahim nirantara teu || bhava sagara caha para jo pava| rama katha ta kaha~
    drirha nava || bishinha kaha~ puni hari guna grama| shravana sukhada aru mana abhirama || shravanavanta
    asa ko jaga mahim| jahi na raghupati carita sohahim || te jara jiva nijatmaka ghati| jinhahi na raghupati
    katha sohati || haricaritra manasa tumha gava| suni maim natha amiti sukha pava || tumha jo kahi yaha
    katha suhai| kagabhasundi garura prati gai || do birati gyana bigyana drirha rama carana ati neha|
    bayasa tana raghupati bhagati mohi parama sandeha || || nara sahasra maha~ sunahu purari| kau eka
    hoi dharma bratadhari || dharmasila kotika maha~ koi| bishaya bimukha biraga rata hoi || koti birakta
    madhya shruti kahi| samyaka gyana sakrita kau lahi || gyanavanta kotika maha~ kou| jivanamukta sakrita
    jaga sou || tinha sahasra mahu~ saba sukha khani| durlabha brahmalina bigyani || dharmasila birakta
    aru gyani| jivanamukta brahmapara prani || saba te so durlabha suraraya| rama bhagati rata gata mada
    maya || so haribhagati kaga kimi pai| bisvanatha mohi kahahu bujhai || do rama parayana gyana rata
    gunagara mati dhira| natha kahahu kehi karana payu kaka sarira || || yaha prabhu carita pavitra suhava|
    kahahu kripala kaga kaha~ pava || tumha kehi bha~ti suna madanari| kahahu mohi ati kautuka bhari ||
    garura mahagyani guna rasi| hari sevaka ati nikata nivasi || tehim kehi hetu kaga sana jai| suni katha
    muni nikara bihai || kahahu kavana bidhi bha sambada| dau haribhagata kaga uragada || gauri gira suni
    sarala suhai| bole siva sadara sukha pai || dhanya sati pavana mati tori| raghupati carana priti nahim
    thori || sunahu parama punita itihasa| jo suni sakala loka bhrama nasa || upaji rama carana bisvasa|
    bhava nidhi tara nara binahim prayasa || do aisia prasna bihangapati kinha kaga sana jai| so saba
    sadara kahihu~ sunahu uma mana lai || || maim jimi katha suni bhava mocani| so prasanga sunu sumukhi
    sulocani || prathama daccha griha tava avatara| sati nama taba raha tumhara || daccha jagya taba bha
    apamana| tumha ati krodha taje taba prana || mama anucaranha kinha makha bhanga| janahu tumha so sakala
    prasanga || taba ati soca bhayu mana morem| dukhi bhayu~ biyoga priya torem || sundara bana giri sarita
    taraaga| kautuka dekhata phiru~ beraga || giri sumera uttara disi duri| nila saila eka sundara bhuri
    || tasu kanakamaya sikhara suhae| cari caru more mana bhae || tinha para eka eka bitapa bisala| bata
    pipara pakari rasala || sailopari sara sundara soha| mani sopana dekhi mana moha || do sitala amala
    madhura jala jalaja bipula bahuranga| kujata kala rava hamsa gana gunjata majumla bhringa || || tehim
    giri rucira basi khaga soi| tasu nasa kalpanta na hoi || maya krita guna dosha aneka| moha manoja
    adi abibeka || rahe byapi samasta jaga mahim| tehi giri nikata kabahu~ nahim jahim || taha~ basi harihi
    bhaji jimi kaga| so sunu uma sahita anuraga || pipara taru tara dhyana so dhari| japa jagya pakari
    tara kari || a~ba chaha~ kara manasa puja| taji hari bhajanu kaju nahim duja || bara tara kaha hari
    katha prasanga| avahim sunahim aneka bihanga || rama carita bicitra bidhi nana| prema sahita kara
    sadara gana || sunahim sakala mati bimala marala| basahim nirantara je tehim tala || jaba maim jai
    so kautuka dekha| ura upaja ananda bisesha || do taba kachu kala marala tanu dhari taha~ kinha nivasa|
    sadara suni raghupati guna puni ayu~ kailasa || || girija kaheu~ so saba itihasa| maim jehi samaya
    gayu~ khaga pasa || aba so katha sunahu jehi hetu| gayu kaga pahim khaga kula ketu || jaba raghunatha
    kinhi rana kriraa| samujhata carita hoti mohi briraa || indrajita kara apu ba~dhayo| taba narada muni
    garura pathayo || bandhana kati gayo uragada| upaja hridaya~ pracanda bishada || prabhu bandhana samujhata
    bahu bha~ti| karata bicara uraga arati || byapaka brahma biraja bagisa| maya moha para paramisa ||
    so avatara suneu~ jaga mahim| dekheu~ so prabhava kachu nahim || do bhava bandhana te chutahim nara
    japi ja kara nama| kharca nisacara ba~dheu nagapasa soi rama || || nana bha~ti manahi samujhava| pragata
    na gyana hridaya~ bhrama chava || kheda khinna mana tarka barhaai| bhayu mohabasa tumharihim nai ||
    byakula gayu devarishi pahim| kahesi jo samsaya nija mana mahim || suni naradahi lagi ati daya| sunu
    khaga prabala rama kai maya || jo gyaninha kara cita apahari| bariai bimoha mana kari || jehim bahu
    bara nacava mohi| soi byapi bihangapati tohi || mahamoha upaja ura torem| mitihi na begi kahem khaga
    morem || caturanana pahim jahu khagesa| soi karehu jehi hoi nidesa || do asa kahi cale devarishi karata
    rama guna gana| hari maya bala baranata puni puni parama sujana || || taba khagapati biranci pahim
    gayu| nija sandeha sunavata bhayu || suni biranci ramahi siru nava| samujhi pratapa prema ati chava
    || mana mahu~ kari bicara bidhata| maya basa kabi kobida gyata || hari maya kara amiti prabhava| bipula
    bara jehim mohi nacava || aga jagamaya jaga mama uparaja| nahim acaraja moha khagaraja || taba bole
    bidhi gira suhai| jana mahesa rama prabhutai || bainateya sankara pahim jahu| tata anata puchahu jani
    kahu || taha~ hoihi tava samsaya hani| caleu bihanga sunata bidhi bani || do paramatura bihangapati
    ayu taba mo pasa| jata raheu~ kubera griha rahihu uma kailasa || || tehim mama pada sadara siru nava|
    puni apana sandeha sunava || suni ta kari binati mridu bani| parema sahita maim kaheu~ bhavani ||
    milehu garura maraga maha~ mohi| kavana bha~ti samujhavaum tohi || tabahi hoi saba samsaya bhanga|
    jaba bahu kala karia satasanga || sunia taha~ hari katha suhai| nana bha~ti muninha jo gai || jehi
    mahu~ adi madhya avasana| prabhu pratipadya rama bhagavana || nita hari katha hota jaha~ bhai| pathavu~
    taha~ sunahi tumha jai || jaihi sunata sakala sandeha| rama carana hoihi ati neha || do binu satasanga
    na hari katha tehi binu moha na bhaga| moha ge~ binu rama pada hoi na drirha anuraga || || milahim
    na raghupati binu anuraga| kie~ joga tapa gyana biraga || uttara disi sundara giri nila| taha~ raha
    kakabhusundi susila || rama bhagati patha parama prabina| gyani guna griha bahu kalina || rama katha
    so kahi nirantara| sadara sunahim bibidha bihangabara || jai sunahu taha~ hari guna bhuri| hoihi moha
    janita dukha duri || maim jaba tehi saba kaha bujhai| caleu harashi mama pada siru nai || tate uma
    na maim samujhava| raghupati kripa~ maramu maim pava || hoihi kinha kabahu~ abhimana| so khauvai caha
    kripanidhana || kachu tehi te puni maim nahim rakha| samujhi khaga khagahi kai bhasha || prabhu maya
    balavanta bhavani| jahi na moha kavana asa gyani || do gyani bhagata siromani tribhuvanapati kara
    jana| tahi moha maya nara pava~ra karahim gumana || atthaisava~ vishrama siva biranci kahu~ mohi ko
    hai bapura ana| asa jiya~ jani bhajahim muni maya pati bhagavana || || gayu garura jaha~ basi bhusunda|
    mati akuntha hari bhagati akhanda || dekhi saila prasanna mana bhayu| maya moha soca saba gayu ||
    kari taraaga majjana jalapana| bata tara gayu hridaya~ harashana || briddha briddha bihanga taha~
    ae| sunai rama ke carita suhae || katha arambha karai soi caha| tehi samaya gayu khaganaha || avata
    dekhi sakala khagaraja| harasheu bayasa sahita samaja || ati adara khagapati kara kinha| svagata puchi
    suasana dinha || kari puja sameta anuraga| madhura bacana taba boleu kaga || do natha kritaratha bhayu~
    maim tava darasana khagaraja| ayasu dehu so karaum aba prabhu ayahu kehi kaja || || sada kritaratha
    rupa tumha kaha mridu bacana khagesa| jehi kai astuti sadara nija mukha kinhi mahesa || || sunahu
    tata jehi karana ayu~| so saba bhayu darasa tava payu~ || dekhi parama pavana tava ashrama| gayu moha
    samsaya nana bhrama || aba shrirama katha ati pavani| sada sukhada dukha punja nasavani || sadara
    tata sunavahu mohi| bara bara binavu~ prabhu tohi || sunata garura kai gira binita| sarala suprema
    sukhada supunita || bhayu tasu mana parama uchaha| laga kahai raghupati guna gaha || prathamahim ati
    anuraga bhavani| ramacarita sara kahesi bakhani || puni narada kara moha apara| kahesi bahuri ravana
    avatara || prabhu avatara katha puni gai| taba sisu carita kahesi mana lai || do balacarita kahim
    bibidha bidhi mana maha~ parama uchaha| rishi agavana kahesi puni shri raghubira bibaha || || bahuri
    rama abhisheka prasanga| puni nripa bacana raja rasa bhanga || purabasimha kara biraha bishada| kahesi
    rama lachimana sambada || bipina gavana kevata anuraga| surasari utari nivasa prayaga || balamika
    prabhu milana bakhana| citrakuta jimi base bhagavana || sacivagavana nagara nripa marana| bharatagavana
    prema bahu barana || kari nripa kriya sanga purabasi| bharata ge jaha~ prabhu sukha rasi || puni raghupati
    bahu bidhi samujhae| lai paduka avadhapura ae || bharata rahani surapati suta karani| prabhu aru atri
    bhenta puni barani || do kahi biradha badha jehi bidhi deha taji sarabhanga || barani sutichana priti
    puni prabhu agasti satasanga || || kahi dandaka bana pavanatai| gidha mitri puni tehim gai || puni
    prabhu pancavatim krita basa| bhanji sakala muninha ki trasa || puni lachimana upadesa anupa| supanakha
    jimi kinhi kurupa || khara dushana badha bahuri bakhana| jimi saba maramu dasanana jana || dasakandhara
    marica batakahim| jehi bidhi bhi so saba tehim kahi || puni maya sita kara harana| shriraghubira biraha
    kachu barana || puni prabhu gidha kriya jimi kinhi| badhi kabandha sabarihi gati dinhi || bahuri biraha
    baranata raghubira| jehi bidhi ge sarobara tira || do prabhu narada sambada kahi maruti milana prasanga|
    puni sugriva mitai bali prana kara bhanga || || kapihi tilaka kari prabhu krita saila prabarashana
    basa| baranana barsha sarada aru rama rosha kapi trasa || || jehi bidhi kapipati kisa pathae| sita
    khoja sakala disi dhae || bibara prabesa kinha jehi bha~ti| kapinha bahori mila sampati || suni saba
    katha samirakumara| naghata bhayu payodhi apara || lanka~ kapi prabesa jimi kinha| puni sitahi dhiraju
    jimi dinha || bana ujari ravanahi prabodhi| pura dahi nagheu bahuri payodhi || ae kapi saba jaha~
    raghurai| baidehi ki kusala sunai || sena sameti jatha raghubira| utare jai barinidhi tira || mila
    bibhishana jehi bidhi ai| sagara nigraha katha sunai || do setu ba~dhi kapi sena jimi utari sagara
    para| gayu basithi birabara jehi bidhi balikumara || || nisicara kisa larai baranisi bibidha prakara|
    kumbhakarana ghananada kara bala paurusha sanghara || || nisicara nikara marana bidhi nana| raghupati
    ravana samara bakhana || ravana badha mandodari soka| raja bibhishana deva asoka || sita raghupati
    milana bahori| suranha kinha astuti kara jori || puni pushpaka carhai kapinha sameta| avadha cale
    prabhu kripa niketa || jehi bidhi rama nagara nija ae| bayasa bisada carita saba gae || kahesi bahori
    rama abhishaika| pura baranata nripaniti aneka || katha samasta bhusunda bakhani| jo maim tumha sana
    kahi bhavani || suni saba rama katha khaganaha| kahata bacana mana parama uchaha || so gayu mora sandeha
    suneu~ sakala raghupati carita| bhayu rama pada neha tava prasada bayasa tilaka || || mohi bhayu ati
    moha prabhu bandhana rana mahu~ nirakhi| cidananda sandoha rama bikala karana kavana| || dekhi carita
    ati nara anusari| bhayu hridaya~ mama samsaya bhari || soi bhrama aba hita kari maim mana| kinha anugraha
    kripanidhana || jo ati atapa byakula hoi| taru chaya sukha jani soi || jaum nahim hota moha ati mohi|
    milateu~ tata kavana bidhi tohi || sunateu~ kimi hari katha suhai| ati bicitra bahu bidhi tumha gai
    || nigamagama purana mata eha| kahahim siddha muni nahim sandeha || santa bisuddha milahim pari tehi|
    citavahim rama kripa kari jehi || rama kripa~ tava darasana bhayu| tava prasada saba samsaya gayu
    || do suni bihangapati bani sahita binaya anuraga| pulaka gata locana sajala mana harasheu ati kaga
    || || shrota sumati susila suci katha rasika hari dasa| pai uma ati gopyamapi sajjana karahim prakasa
    || || boleu kakabhasunda bahori| nabhaga natha para priti na thori || saba bidhi natha pujya tumha
    mere| kripapatra raghunayaka kere || tumhahi na samsaya moha na maya| mo para natha kinha tumha daya
    || pathi moha misa khagapati tohi| raghupati dinhi baraai mohi || tumha nija moha kahi khaga saim|
    so nahim kachu acaraja gosaim || narada bhava biranci sanakadi| je muninayaka atamabadi || moha na
    andha kinha kehi kehi| ko jaga kama nacava na jehi || trisna~ kehi na kinha bauraha| kehi kara hridaya
    krodha nahim daha || do gyani tapasa sura kabi kobida guna agara| kehi kai laubha bidambana kinhi
    na ehim samsara || || shri mada bakra na kinha kehi prabhuta badhira na kahi| mrigalocani ke naina
    sara ko asa laga na jahi || || guna krita sanyapata nahim kehi| kau na mana mada tajeu nibehi || jobana
    jvara kehi nahim balakava| mamata kehi kara jasa na nasava || macchara kahi kalanka na lava| kahi
    na soka samira dolava || cinta sa~pini ko nahim khaya| ko jaga jahi na byapi maya || kita manoratha
    daru sarira| jehi na laga ghuna ko asa dhira || suta bita loka ishana tini| kehi ke mati inha krita
    na malini || yaha saba maya kara parivara| prabala amiti ko baranai para || siva caturanana jahi derahim|
    apara jiva kehi lekhe mahim || do byapi raheu samsara mahu~ maya kataka pracanda || senapati kamadi
    bhata dambha kapata pashanda || || so dasi raghubira kai samujhem mithya sopi| chuta na rama kripa
    binu natha kahu~ pada ro'pi || || jo maya saba jagahi nacava| jasu carita lakhi kahu~ na pava || soi
    prabhu bhru bilasa khagaraja| naca nati iva sahita samaja || soi saccidananda ghana rama| aja bigyana
    rupo bala dhama || byapaka byapya akhanda ananta| akhila amoghasakti bhagavanta || aguna adabhra gira
    gotita| sabadarasi anavadya ajita || nirmama nirakara niramoha| nitya niranjana sukha sandoha || prakriti
    para prabhu saba ura basi| brahma niriha biraja abinasi || iha~ moha kara karana nahim| rabi sanmukha
    tama kabahu~ ki jahim || do bhagata hetu bhagavana prabhu rama dhareu tanu bhupa| kie carita pavana
    parama prakrita nara anurupa || || jatha aneka besha dhari nritya kari nata koi| soi soi bhava dekhavi
    apuna hoi na soi || || asi raghupati lila uragari| danuja bimohani jana sukhakari || je mati malina
    bishayabasa kami| prabhu moha dharahim imi svami || nayana dosha ja kaha~ jaba hoi| pita barana sasi
    kahu~ kaha soi || jaba jehi disi bhrama hoi khagesa| so kaha pacchima uyu dinesa || naukarurha calata
    jaga dekha| acala moha basa apuhi lekha || balaka bhramahim na bhramahim grihadim| kahahim paraspara
    mithyabadi || hari bishika asa moha bihanga| sapanehu~ nahim agyana prasanga || mayabasa matimanda
    abhagi| hridaya~ jamanika bahubidhi lagi || te satha hatha basa samsaya karahim| nija agyana rama
    para dharahim || do kama krodha mada lobha rata grihasakta dukharupa| te kimi janahim raghupatihi
    murha pare tama kupa || || nirguna rupa sulabha ati saguna jana nahim koi| sugama agama nana carita
    suni muni mana bhrama hoi || || sunu khagesa raghupati prabhutai| kahu~ jathamati katha suhai || jehi
    bidhi moha bhayu prabhu mohi| sau saba katha sunavu~ tohi || rama kripa bhajana tumha tata| hari guna
    priti mohi sukhadata || tate nahim kachu tumhahim duravu~| parama rahasya manohara gavu~ || sunahu
    rama kara sahaja subh | jana abhimana na rakhahim k || samsrita mula sulaprada nana| sakala soka dayaka
    abhimana || tate karahim kripanidhi duri| sevaka para mamata ati bhuri || jimi sisu tana brana hoi
    gosai| matu cirava kathina ki naim || do jadapi prathama dukha pavi rovi bala adhira| byadhi nasa
    hita janani ganati na so sisu pira || || timi raghupati nija dasakara harahim mana hita lagi| tulasidasa
    aise prabhuhi kasa na bhajahu bhrama tyagi || || rama kripa apani jaratai| kahu~ khagesa sunahu mana
    lai || jaba jaba rama manuja tanu dharahim| bhakta hetu lila bahu karahim || taba taba avadhapuri
    maim za ~| balacarita biloki harash ~ || janma mahotsava dekhu~ jai| barasha pa~ca taha~ rahu~ lobhai
    || ishtadeva mama balaka rama| sobha bapusha koti sata kama || nija prabhu badana nihari nihari| locana
    suphala karu~ uragari || laghu bayasa bapu dhari hari sanga| dekhu~ balacarita bahuranga || do larikaim
    jaha~ jaha~ phirahim taha~ taha~ sanga uraau~| juthani pari ajira maha~ so uthai kari khau~ || ||
    eka bara atisaya saba carita kie raghubira| sumirata prabhu lila soi pulakita bhayu sarira || || kahi
    bhasunda sunahu khaganayaka| ramacarita sevaka sukhadayaka || nripamandira sundara saba bha~ti| khacita
    kanaka mani nana jati || barani na jai rucira a~ganai| jaha~ khelahim nita cariu bhai || balabinoda
    karata raghurai| bicarata ajira janani sukhadai || marakata mridula kalevara syama| anga anga prati
    chabi bahu kama || nava rajiva aruna mridu carana| padaja rucira nakha sasi duti harana || lalita
    anka kulisadika cari| nupura caru madhura ravakari || caru purata mani racita banai| kati kinkina
    kala mukhara suhai || do rekha traya sundara udara nabhi rucira ga~bhira| ura ayata bhrajata bibidha
    bala bibhushana cira || || aruna pani nakha karaja manohara| bahu bisala bibhushana sundara || kandha
    bala kehari dara griva| caru cibuka anana chabi simva || kalabala bacana adhara arunare| dui dui dasana
    bisada bara bare || lalita kapola manohara nasa| sakala sukhada sasi kara sama hasa || nila kanja
    locana bhava mocana| bhrajata bhala tilaka gorocana || bikata bhrikuti sama shravana suhae| kuncita
    kaca mecaka chabi chae || pita jhini jhaguli tana sohi| kilakani citavani bhavati mohi || rupa rasi
    nripa ajira bihari| nacahim nija pratibimba nihari || mohi sana karahim bibidha bidhi kriraa| baranata
    mohi hoti ati briraa || kilakata mohi dharana jaba dhavahim| calu~ bhagi taba pupa dekhavahim || do
    avata nikata ha~sahim prabhu bhajata rudana karahim| jau~ samipa gahana pada phiri phiri citi parahim
    || || prakrita sisu iva lila dekhi bhayu mohi moha| kavana caritra karata prabhu cidananda sandoha
    || || etana mana anata khagaraya| raghupati prerita byapi maya || so maya na dukhada mohi kahim| ana
    jiva iva samsrita nahim || natha iha~ kachu karana ana| sunahu so savadhana harijana || gyana akhanda
    eka sitabara| maya basya jiva sacaracara || jaum saba kem raha gyana ekarasa| isvara jivahi bheda
    kahahu kasa || maya basya jiva abhimani| isa basya maya gunakhani || parabasa jiva svabasa bhagavanta|
    jiva aneka eka shrikanta || mudha bheda jadyapi krita maya| binu hari jai na koti upaya || do ramacandra
    ke bhajana binu jo caha pada nirbana| gyanavanta api so nara pasu binu pu~cha bishana || || rakapati
    shorasa uahim taragana samudai || sakala girinha dava laia binu rabi rati na jai || || aisehim hari
    binu bhajana khagesa| miti na jivanha kera kalesa || hari sevakahi na byapa abidya| prabhu prerita
    byapi tehi bidya || tate nasa na hoi dasa kara| bheda bhagati bharhai bihangabara || bhrama te cakita
    rama mohi dekha| biha~se so sunu carita bisesha || tehi kautuka kara maramu na kahu~| jana anuja na
    matu pitahu~ || janu pani dhae mohi dharana| syamala gata aruna kara carana || taba maim bhagi caleu~
    uragami| rama gahana kaha~ bhuja pasari || jimi jimi duri uraau~ akasa| taha~ bhuja hari dekhu~ nija
    pasa || do brahmaloka lagi gayu~ maim citayu~ pacha uraata| juga angula kara bica saba rama bhujahi
    mohi tata || || saptabarana bheda kari jaha~ lagem gati mori| gayu~ taha~ prabhu bhuja nirakhi byakula
    bhayu~ bahori || || mudeu~ nayana trasita jaba bhayu~| puni citavata kosalapura gayu~ || mohi biloki
    rama musukahim| biha~sata turata gayu~ mukha mahim || udara majha sunu andaja raya| dekheu~ bahu brahmanda
    nikaya || ati bicitra taha~ loka aneka| racana adhika eka te eka || kotinha caturanana gaurisa| aganita
    udagana rabi rajanisa || aganita lokapala jama kala| aganita bhudhara bhumi bisala || sagara sari
    sara bipina apara| nana bha~ti srishti bistara || sura muni siddha naga nara kinnara| cari prakara
    jiva sacaracara || do jo nahim dekha nahim suna jo manahu~ na samai| so saba adbhuta dekheu~ barani
    kavani bidhi jai || || eka eka brahmanda mahu~ rahu~ barasha sata eka| ehi bidhi dekhata phiru~ maim
    anda kataha aneka || || ehi bidhi dekhata phiru~ maim anda kataha aneka || || loka loka prati bhinna
    bidhata| bhinna bishnu siva manu disitrata || nara gandharba bhuta betala| kinnara nisicara pasu khaga
    byala || deva danuja gana nana jati| sakala jiva taha~ anahi bha~ti || mahi sari sagara sara giri
    nana| saba prapanca taha~ ani ana || andakosa prati prati nija rupa| dekheu~ jinasa aneka anupa ||
    avadhapuri prati bhuvana ninari| saraju bhinna bhinna nara nari || dasaratha kausalya sunu tata| bibidha
    rupa bharatadika bhrata || prati brahmanda rama avatara| dekhu~ balabinoda apara || do bhinna bhinna
    mai dikha sabu ati bicitra harijana| aganita bhuvana phireu~ prabhu rama na dekheu~ ana || || soi
    sisupana soi sobha soi kripala raghubira| bhuvana bhuvana dekhata phiru~ prerita moha samira || bhramata
    mohi brahmanda aneka| bite manahu~ kalpa sata eka || phirata phirata nija ashrama ayu~| taha~ puni
    rahi kachu kala gava~yu~ || nija prabhu janma avadha suni payu~| nirbhara prema harashi uthi dhayu~
    || dekhu~ janma mahotsava jai| jehi bidhi prathama kaha maim gai || rama udara dekheu~ jaga nana|
    dekhata bani na jai bakhana || taha~ puni dekheu~ rama sujana| maya pati kripala bhagavana || karu~
    bicara bahori bahori| moha kalila byapita mati mori || ubhaya ghari maha~ maim saba dekha| bhayu~
    bhramita mana moha bisesha || do dekhi kripala bikala mohi biha~se taba raghubira| biha~satahim mukha
    bahera ayu~ sunu matidhira || || soi larikai mo sana karana lage puni rama| koti bha~ti samujhavu~
    manu na lahi bishrama || || dekhi carita yaha so prabhutai| samujhata deha dasa bisarai || dharani
    pareu~ mukha ava na bata| trahi trahi arata jana trata || premakula prabhu mohi biloki| nija maya
    prabhuta taba roki || kara saroja prabhu mama sira dhareu| dinadayala sakala dukha hareu || kinha
    rama mohi bigata bimoha| sevaka sukhada kripa sandoha || prabhuta prathama bicari bicari| mana maha~
    hoi harasha ati bhari || bhagata bachalata prabhu kai dekhi| upaji mama ura priti biseshi || sajala
    nayana pulakita kara jori| kinhiu~ bahu bidhi binaya bahori || do suni saprema mama bani dekhi dina
    nija dasa| bacana sukhada gambhira mridu bole ramanivasa || || kakabhasundi magu bara ati prasanna
    mohi jani| animadika sidhi apara ridhi moccha sakala sukha khani || || gyana bibeka birati bigyana|
    muni durlabha guna je jaga nana || aju deu~ saba samsaya nahim| magu jo tohi bhava mana mahim || suni
    prabhu bacana adhika anurageu~| mana anumana karana taba lageu~ || prabhu kaha dena sakala sukha sahi|
    bhagati apani dena na kahi || bhagati hina guna saba sukha aise| lavana bina bahu binjana jaise ||
    bhajana hina sukha kavane kaja| asa bicari boleu~ khagaraja || jaum prabhu hoi prasanna bara dehu|
    mo para karahu kripa aru nehu || mana bhavata bara magu~ svami| tumha udara ura antarajami || do abirala
    bhagati bisudhda tava shruti purana jo gava| jehi khojata jogisa muni prabhu prasada kau pava || ||
    bhagata kalpataru pranata hita kripa sindhu sukha dhama| soi nija bhagati mohi prabhu dehu daya kari
    rama || || evamastu kahi raghukulanayaka| bole bacana parama sukhadayaka || sunu bayasa taim sahaja
    sayana| kahe na magasi asa baradana || saba sukha khani bhagati taim magi| nahim jaga kau tohi sama
    barabhagi || jo muni koti jatana nahim lahahim| je japa joga anala tana dahahim || rijheu~ dekhi tori
    caturai| magehu bhagati mohi ati bhai || sunu bihanga prasada aba morem| saba subha guna basihahim
    ura torem || bhagati gyana bigyana biraga| joga caritra rahasya bibhaga || janaba taim sabahi kara
    bheda| mama prasada nahim sadhana kheda || dommaya sambhava bhrama saba aba na byapihahim tohi| janesu
    brahma anadi aja aguna gunakara mohi || || mohi bhagata priya santata asa bicari sunu kaga| kaya~
    bacana mana mama pada karesu acala anuraga || || aba sunu parama bimala mama bani| satya sugama nigamadi
    bakhani || nija siddhanta sunavu~ tohi| sunu mana dharu saba taji bhaju mohi || mama maya sambhava
    samsara| jiva caracara bibidhi prakara || saba mama priya saba mama upajae| saba te adhika manuja
    mohi bhae || tinha maha~ dvija dvija maha~ shrutidhari| tinha mahu~ nigama dharama anusari || tinha
    maha~ priya birakta puni gyani| gyanihu te ati priya bigyani || tinha te puni mohi priya nija dasa|
    jehi gati mori na dusari asa || puni puni satya kahu~ tohi pahim| mohi sevaka sama priya kau nahim
    || bhagati hina biranci kina hoi| saba jivahu sama priya mohi soi || bhagativanta ati nicu prani|
    mohi pranapriya asi mama bani || do suci susila sevaka sumati priya kahu kahi na laga| shruti purana
    kaha niti asi savadhana sunu kaga || || eka pita ke bipula kumara| hohim prithaka guna sila acara
    || kau pandinta kau tapasa gyata| kau dhanavanta sura kau data || kau sarbagya dharmarata koi| saba
    para pitahi priti sama hoi || kau pitu bhagata bacana mana karma| sapanehu~ jana na dusara dharma
    || so suta priya pitu prana samana| jadyapi so saba bha~ti ayana || ehi bidhi jiva caracara jete|
    trijaga deva nara asura samete || akhila bisva yaha mora upaya| saba para mohi barabari daya || tinha
    maha~ jo parihari mada maya| bhajai mohi mana baca aru kaya || do purusha napumsaka nari va jiva caracara
    koi| sarba bhava bhaja kapata taji mohi parama priya soi || satya kahu~ khaga tohi suci sevaka mama
    pranapriya| asa bicari bhaju mohi parihari asa bharosa saba || || kabahu~ kala na byapihi tohi| sumiresu
    bhajesu nirantara mohi || prabhu bacanamrita suni na agh ~| tanu pulakita mana ati harash ~ || so
    sukha jani mana aru kana| nahim rasana pahim jai bakhana || prabhu sobha sukha janahim nayana| kahi
    kimi sakahim tinhahi nahim bayana || bahu bidhi mohi prabodhi sukha dei| lage karana sisu kautuka
    tei || sajala nayana kachu mukha kari rukha| citi matu lagi ati bhukha || dekhi matu atura uthi dhai|
    kahi mridu bacana lie ura lai || goda rakhi karava paya pana| raghupati carita lalita kara gana ||
    so jehi sukha lagi purari asubha besha krita siva sukhada| avadhapuri nara nari tehi sukha mahu~ santata
    magana || || soi sukha lavalesa jinha baraka sapanehu~ laheu| te nahim ganahim khagesa brahmasukhahi
    sajjana sumati || || maim puni avadha raheu~ kachu kala| dekheu~ balabinoda rasala || rama prasada
    bhagati bara payu~| prabhu pada bandi nijashrama ayu~ || taba te mohi na byapi maya| jaba te raghunayaka
    apanaya || yaha saba gupta carita maim gava| hari maya~ jimi mohi nacava || nija anubhava aba kahu~
    khagesa| binu hari bhajana na jahi kalesa || rama kripa binu sunu khagarai| jani na jai rama prabhutai
    || janem binu na hoi paratiti| binu paratiti hoi nahim priti || priti bina nahim bhagati dirhaai|
    jimi khagapati jala kai cikanai || so binu gura hoi ki gyana gyana ki hoi biraga binu| gavahim beda
    purana sukha ki lahia hari bhagati binu || || kau bishrama ki pava tata sahaja santosha binu| calai
    ki jala binu nava koti jatana paci paci maria || || binu santosha na kama nasahim| kama achata sukha
    sapanehu~ nahim || rama bhajana binu mitahim ki kama| thala bihina taru kabahu~ ki jama || binu bigyana
    ki samata avi| kau avakasa ki nabha binu pavi || shraddha bina dharma nahim hoi| binu mahi gandha
    ki pavi koi || binu tapa teja ki kara bistara| jala binu rasa ki hoi samsara || sila ki mila binu
    budha sevakai| jimi binu teja na rupa gosai || nija sukha binu mana hoi ki thira| parasa ki hoi bihina
    samira || kavaniu siddhi ki binu bisvasa| binu hari bhajana na bhava bhaya nasa || do binu bisvasa
    bhagati nahim tehi binu dravahim na ramu| rama kripa binu sapanehu~ jiva na laha bishramu || asa bicari
    matidhira taji kutarka samsaya sakala| bhajahu rama raghubira karunakara sundara sukhada || || nija
    mati sarisa natha maim gai| prabhu pratapa mahima khagarai || kaheu~ na kachu kari juguti biseshi|
    yaha saba maim nija nayananhi dekhi || mahima nama rupa guna gatha| sakala amita ananta raghunatha
    || nija nija mati muni hari guna gavahim| nigama sesha siva para na pavahim || tumhahi adi khaga masaka
    prajanta| nabha uraahim nahim pavahim anta || timi raghupati mahima avagaha| tata kabahu~ kau pava
    ki thaha || ramu kama sata koti subhaga tana| durga koti amita ari mardana || sakra koti sata sarisa
    bilasa| nabha sata koti amita avakasa || do maruta koti sata bipula bala rabi sata koti prakasa| sasi
    sata koti susitala samana sakala bhava trasa || || kala koti sata sarisa ati dustara durga duranta|
    dhumaketu sata koti sama duradharasha bhagavanta || || prabhu agadha sata koti patala| samana koti
    sata sarisa karala || tiratha amita koti sama pavana| nama akhila agha puga nasavana || himagiri koti
    acala raghubira| sindhu koti sata sama gambhira || kamadhenu sata koti samana| sakala kama dayaka
    bhagavana || sarada koti amita caturai| bidhi sata koti srishti nipunai || bishnu koti sama palana
    karta| rudra koti sata sama samharta || dhanada koti sata sama dhanavana| maya koti prapanca nidhana
    || bhara dharana sata koti ahisa| niravadhi nirupama prabhu jagadisa || cham nirupama na upama ana
    rama samana ramu nigama kahai| jimi koti sata khadyota sama rabi kahata ati laghuta lahai || ehi bha~ti
    nija nija mati bilasa munisa harihi bakhanahim| prabhu bhava gahaka ati kripala saprema suni sukha
    manahim || do ramu amita guna sagara thaha ki pavi koi| santanha sana jasa kichu suneu~ tumhahi sunayu~
    soi || bhava basya bhagavana sukha nidhana karuna bhavana| taji mamata mada mana bhajia sada sita
    ravana || || suni bhusundi ke bacana suhae| harashita khagapati pankha phulae || nayana nira mana
    ati harashana| shriraghupati pratapa ura ana || pachila moha samujhi pachitana| brahma anadi manuja
    kari mana || puni puni kaga carana siru nava| jani rama sama prema barhaava || gura binu bhava nidhi
    tari na koi| jaum biranci sankara sama hoi || samsaya sarpa graseu mohi tata| dukhada lahari kutarka
    bahu brata || tava sarupa garurai raghunayaka| mohi jiayu jana sukhadayaka || tava prasada mama moha
    nasana| rama rahasya anupama jana || do tahi prasamsi bibidha bidhi sisa nai kara jori| bacana binita
    saprema mridu boleu garura bahori || || prabhu apane abibeka te bujhu~ svami tohi| kripasindhu sadara
    kahahu jani dasa nija mohi || || tumha sarbagya tanya tama para| sumati susila sarala acara || gyana
    birati bigyana nivasa| raghunayaka ke tumha priya dasa || karana kavana deha yaha pai| tata sakala
    mohi kahahu bujhai || rama carita sara sundara svami| payahu kaha~ kahahu nabhagami || natha suna
    maim asa siva pahim| maha pralayahu~ nasa tava nahim || mudha bacana nahim isvara kahi| sau morem
    mana samsaya ahi || aga jaga jiva naga nara deva| natha sakala jagu kala kaleva || anda kataha amita
    laya kari| kalu sada duratikrama bhari || so tumhahi na byapata kala ati karala karana kavana| mohi
    so kahahu kripala gyana prabhava ki joga bala || prabhu tava ashrama ae~ mora moha bhrama bhaga| karana
    kavana so natha saba kahahu sahita anuraga || || garura gira suni harasheu kaga| boleu uma parama
    anuraga || dhanya dhanya tava mati uragari| prasna tumhari mohi ati pyari || suni tava prasna saprema
    suhai| bahuta janama kai sudhi mohi ai || saba nija katha kahu~ maim gai| tata sunahu sadara mana
    lai || japa tapa makha sama dama brata dana| birati bibeka joga bigyana || saba kara phala raghupati
    pada prema| tehi binu kau na pavi chema || ehi tana rama bhagati maim pai| tate mohi mamata adhikai
    || jehi tem kachu nija svaratha hoi| tehi para mamata kara saba koi || so pannagari asi niti shruti
    sammata sajjana kahahim| ati nicahu sana priti karia jani nija parama hita || || pata kita tem hoi
    tehi tem patambara rucira| krimi pali sabu koi parama apavana prana sama || || svaratha sa~ca jiva
    kahu~ eha| mana krama bacana rama pada neha || soi pavana soi subhaga sarira| jo tanu pai bhajia raghubira
    || rama bimukha lahi bidhi sama dehi| kabi kobida na prasamsahim tehi || rama bhagati ehim tana ura
    jami| tate mohi parama priya svami || taju~ na tana nija iccha marana| tana binu beda bhajana nahim
    barana || prathama moha~ mohi bahuta bigova| rama bimukha sukha kabahu~ na sova || nana janama karma
    puni nana| kie joga japa tapa makha dana || kavana joni janameu~ jaha~ nahim| maim khagesa bhrami
    bhrami jaga mahim || dekheu~ kari saba karama gosai| sukhi na bhayu~ abahim ki nai || sudhi mohi natha
    janma bahu keri| siva prasada mati moha~ na gheri || do prathama janma ke carita aba kahu~ sunahu
    bihagesa| suni prabhu pada rati upaji jatem mitahim kalesa || || puruba kalpa eka prabhu juga kalijuga
    mala mula || nara aru nari adharma rata sakala nigama pratikula || || tehi kalijuga kosalapura jai|
    janmata bhayu~ sudra tanu pai || siva sevaka mana krama aru bani| ana deva nindaka abhimani || dhana
    mada matta parama bacala| ugrabuddhi ura dambha bisala || jadapi raheu~ raghupati rajadhani| tadapi
    na kachu mahima taba jani || aba jana maim avadha prabhava| nigamagama purana asa gava || kavanehu~
    janma avadha basa joi| rama parayana so pari hoi || avadha prabhava jana taba prani| jaba ura basahim
    ramu dhanupani || so kalikala kathina uragari| papa parayana saba nara nari || do kalimala grase dharma
    saba lupta bhe sadagrantha| dambhinha nija mati kalpi kari pragata kie bahu pantha || || bhe loga
    saba mohabasa lobha grase subha karma| sunu harijana gyana nidhi kahu~ kachuka kalidharma || || barana
    dharma nahim ashrama cari| shruti birodha rata saba nara nari || dvija shruti becaka bhupa prajasana|
    kau nahim mana nigama anusasana || maraga soi ja kahu~ joi bhava| pandita soi jo gala bajava || mithyarambha
    dambha rata joi| ta kahu~ santa kahi saba koi || soi sayana jo paradhana hari| jo kara dambha so bara
    acari || jau kaha jhu~tha masakhari jana| kalijuga soi gunavanta bakhana || niracara jo shruti patha
    tyagi| kalijuga soi gyani so biragi || jakem nakha aru jata bisala| soi tapasa prasiddha kalikala
    || do asubha besha bhushana dharem bhacchabhaccha je khahim| tei jogi tei siddha nara pujya te kalijuga
    mahim || je apakari cara tinha kara gaurava manya tei| mana krama bacana labara tei bakata kalikala
    mahu~ || || nari bibasa nara sakala gosai| nacahim nata markata ki nai || sudra dvijanha upadesahim
    gyana| meli janeu lehim kudana || saba nara kama lobha rata krodhi| deva bipra shruti santa birodhi
    || guna mandira sundara pati tyagi| bhajahim nari para purusha abhagi || saubhaginim bibhushana hina|
    bidhavanha ke singara nabina || gura sisha badhira andha ka lekha| eka na suni eka nahim dekha ||
    hari sishya dhana soka na hari| so gura ghora naraka mahu~ pari || matu pita balakanhi bolabahim|
    udara bharai soi dharma sikhavahim || do brahma gyana binu nari nara kahahim na dusari bata| kaurai
    lagi lobha basa karahim bipra gura ghata || || badahim sudra dvijanha sana hama tumha te kachu ghati|
    jani brahma so biprabara a~khi dekhavahim dati || || para triya lampata kapata sayane| moha droha
    mamata lapatane || tei abhedabadi gyani nara| dekha mem caritra kalijuga kara || apu ge aru tinhahu
    ghalahim| je kahu~ sata maraga pratipalahim || kalpa kalpa bhari eka eka naraka| parahim je dushahim
    shruti kari taraka || je baranadhama teli kumhara| svapaca kirata kola kalavara || nari mui griha
    sampati nasi| mura muraai hohim sanyasi || te bipranha sana apu pujavahim| ubhaya loka nija hatha
    nasavahim || bipra niracchara lolupa kami| niracara satha brishali svami || sudra karahim japa tapa
    brata nana| baithi barasana kahahim purana || saba nara kalpita karahim acara| jai na barani aniti
    apara || do bhe barana sankara kali bhinnasetu saba loga| karahim papa pavahim dukha bhaya ruja soka
    biyoga || || shruti sammata hari bhakti patha sanjuta birati bibeka| tehi na calahim nara moha basa
    kalpahim pantha aneka || bahu dama sa~varahim dhama jati| bishaya hari linhi na rahi birati || tapasi
    dhanavanta daridra grihi| kali kautuka tata na jata kahi || kulavanti nikarahim nari sati| griha anihim
    ceri niberi gati || suta manahim matu pita taba laum| abalanana dikha nahim jaba laum || sasurari
    piari lagi jaba tem| riparupa kutumba bhe taba tem || nripa papa parayana dharma nahim| kari danda
    bidamba praja nitahim || dhanavanta kulina malina api| dvija cinha janeu ughara tapi || nahim mana
    purana na bedahi jo| hari sevaka santa sahi kali so| kabi brinda udara duni na suni| guna dushaka
    brata na ko'pi guni || kali barahim bara dukala parai| binu anna dukhi saba loga marai || do sunu
    khagesa kali kapata hatha dambha dvesha pashanda| mana moha maradi mada byapi rahe brahmanda || ||
    tamasa dharma karahim nara japa tapa brata makha dana| deva na barashahim dharanim be na jamahim dhana
    || abala kaca bhushana bhuri chudha| dhanahina dukhi mamata bahudha || sukha cahahim murha na dharma
    rata| mati thori kathori na komalata || || nara piraita roga na bhoga kahim| abhimana birodha akaranahim
    || laghu jivana sambatu panca dasa| kalapanta na nasa gumanu asa || || kalikala bihala kie manuja|
    nahim manata kvau anuja tanuja| nahim tosha bicara na sitalata| saba jati kujati bhe magata || ||
    irisha parushacchara lolupata| bhari puri rahi samata bigata || saba loga biyoga bisoka hue| baranashrama
    dharma acara ge || || dama dana daya nahim janapani| jarata parabancanatati ghani || tanu poshaka
    nari nara sagare| paranindaka je jaga mo bagare || sunu byalari kala kali mala avaguna agara| gunu~
    bahuta kalijuga kara binu prayasa nistara || || kritajuga treta dvapara puja makha aru joga| jo gati
    hoi so kali hari nama te pavahim loga || || kritajuga saba jogi bigyani| kari hari dhyana tarahim
    bhava prani || treta~ bibidha jagya nara karahim| prabhuhi samarpi karma bhava tarahim || dvapara
    kari raghupati pada puja| nara bhava tarahim upaya na duja || kalijuga kevala hari guna gaha| gavata
    nara pavahim bhava thaha || kalijuga joga na jagya na gyana| eka adhara rama guna gana || saba bharosa
    taji jo bhaja ramahi| prema sameta gava guna gramahi || soi bhava tara kachu samsaya nahim| nama pratapa
    pragata kali mahim || kali kara eka punita pratapa| manasa punya hohim nahim papa || do kalijuga sama
    juga ana nahim jaum nara kara bisvasa| gai rama guna gana bimala~ bhava tara binahim prayasa || ||
    pragata cari pada dharma ke kalila mahu~ eka pradhana| jena kena bidhi dinhem dana kari kalyana ||
    || nita juga dharma hohim saba kere| hridaya~ rama maya ke prere || suddha satva samata bigyana| krita
    prabhava prasanna mana jana || satva bahuta raja kachu rati karma| saba bidhi sukha treta kara dharma
    || bahu raja svalpa satva kachu tamasa| dvapara dharma harasha bhaya manasa || tamasa bahuta rajoguna
    thora| kali prabhava birodha cahu~ ora || budha juga dharma jani mana mahim| taji adharma rati dharma
    karahim || kala dharma nahim byapahim tahi| raghupati carana priti ati jahi || nata krita bikata kapata
    khagaraya| nata sevakahi na byapi maya || do hari maya krita dosha guna binu hari bhajana na jahim|
    bhajia rama taji kama saba asa bicari mana mahim || || tehi kalikala barasha bahu baseu~ avadha bihagesa|
    pareu dukala bipati basa taba maim gayu~ bidesa || || gayu~ ujeni sunu uragari| dina malina daridra
    dukhari || ge~ kala kachu sampati pai| taha~ puni karu~ sambhu sevakai || bipra eka baidika siva puja|
    kari sada tehi kaju na duja || parama sadhu paramaratha bindaka| sambhu upasaka nahim hari nindaka
    || tehi sevu~ maim kapata sameta| dvija dayala ati niti niketa || bahija namra dekhi mohi saim| bipra
    parhaava putra ki naim || sambhu mantra mohi dvijabara dinha| subha upadesa bibidha bidhi kinha ||
    japu~ mantra siva mandira jai| hridaya~ dambha ahamiti adhikai || do maim khala mala sankula mati
    nica jati basa moha| hari jana dvija dekhem jaru~ karu~ bishnu kara droha || gura nita mohi prabodha
    dukhita dekhi acarana mama| mohi upaji ati krodha dambhihi niti ki bhavi || || eka bara gura linha
    bolai| mohi niti bahu bha~ti sikhai || siva seva kara phala suta soi| abirala bhagati rama pada hoi
    || ramahi bhajahim tata siva dhata| nara pava~ra kai ketika bata || jasu carana aja siva anuragi|
    tatu droha~ sukha cahasi abhagi || hara kahu~ hari sevaka gura kaheu| suni khaganatha hridaya mama
    daheu || adhama jati maim bidya pae~| bhayu~ jatha ahi dudha piae~ || mani kutila kubhagya kujati|
    gura kara droha karu~ dinu rati || ati dayala gura svalpa na krodha| puni puni mohi sikhava subodha
    || jehi te nica baraai pava| so prathamahim hati tahi nasava || dhuma anala sambhava sunu bhai| tehi
    bujhava ghana padavi pai || raja maga pari niradara rahi| saba kara pada prahara nita sahi || maruta
    uraava prathama tehi bhari| puni nripa nayana kiritanhi pari || sunu khagapati asa samujhi prasanga|
    budha nahim karahim adhama kara sanga || kabi kobida gavahim asi niti| khala sana kalaha na bhala
    nahim priti || udasina nita rahia gosaim| khala pariharia svana ki naim || maim khala hridaya~ kapata
    kutilai| gura hita kahi na mohi sohai || do eka bara hara mandira japata raheu~ siva nama| gura ayu
    abhimana tem uthi nahim kinha pranama || || so dayala nahim kaheu kachu ura na rosha lavalesa| ati
    agha gura apamanata sahi nahim sake mahesa || || mandira majha bhi nabha bani| re hatabhagya agya
    abhimani || jadyapi tava gura kem nahim krodha| ati kripala cita samyaka bodha || tadapi sapa satha
    daihu~ tohi| niti birodha sohai na mohi || jaum nahim danda karaum khala tora| bhrashta hoi shrutimaraga
    mora || je satha gura sana irisha karahim| raurava naraka koti juga parahim || trijaga joni puni dharahim
    sarira| ayuta janma bhari pavahim pira || baitha rahesi ajagara iva papi| sarpa hohi khala mala mati
    byapi || maha bitapa kotara mahu~ jai || rahu adhamadhama adhagati pai || do hahakara kinha gura daruna
    suni siva sapa || kampita mohi biloki ati ura upaja paritapa || || kari dandavata saprema dvija siva
    sanmukha kara jori| binaya karata gadagada svara samujhi ghora gati mori || || namamishamishana nirvanarupam|
    vimbhum byapakam brahma vedasvarupam| nijam nirgunam nirvikalpam nirimha| cidakashamakashavasam bhaje'ham
    || nirakaramonkaramulam turiyam| gira gyana gotitamisham girisham || karalam mahakala kalam kripalam|
    gunagara samsaraparam nato'ham || tusharadri sankasha gauram gabhiram| manobhuta koti prabha shri
    shariram || sphuranmauli kallolini caru ganga| lasadbhalabalendu kanthe bhujanga || calatkundalam
    bhru sunetram vishalam| prasannananam nilakantham dayalam || mrigadhishacarmambaram mundamalam| priyam
    shankaram sarvanatham bhajami || pracandam prakrishtam pragalbham paresham| akhandam ajam bhanukotiprakasham
    || trayahshula nirmulanam shulapanim| bhaje'ham bhavanipatim bhavagamyam || kalatita kalyana kalpantakari|
    sada sajjanandadata purari || cidanandasandoha mohapahari| prasida prasida prabho manmathari || na
    yavad umanatha padaravindam| bhajantiha loke pare va naranam || na tavatsukham shanti santapanasham|
    prasida prabho sarvabhutadhivasam || na janami yogam japam naiva pujam| nato'ham sada sarvada shambhu
    tubhyam || jara janma duhkhaugha tatapyamanam| prabho pahi apannamamisha shambho || shloka rudrashtakamidam
    proktam viprena haratoshaye| ye pathanti nara bhaktya tesham shambhuh prasidati || suni binati sarbagya
    siva dekhi bripra anuragu| puni mandira nabhabani bhi dvijabara bara magu || || jaum prasanna prabhu
    mo para natha dina para nehu| nija pada bhagati dei prabhu puni dusara bara dehu || || tava maya basa
    jiva jara santata phiri bhulana| tehi para krodha na karia prabhu kripa sindhu bhagavana || || sankara
    dinadayala aba ehi para hohu kripala| sapa anugraha hoi jehim natha thorehim kala || || ehi kara hoi
    parama kalyana| soi karahu aba kripanidhana || bipragira suni parahita sani| evamastu iti bhi nabhabani
    || jadapi kinha ehim daruna papa| maim puni dinha kopa kari sapa || tadapi tumhara sadhuta dekhi|
    karihu~ ehi para kripa biseshi || chamasila je para upakari| te dvija mohi priya jatha kharari ||
    mora shrapa dvija byartha na jaihi| janma sahasa avasya yaha paihi || janamata marata dusaha dukha
    hoi| ahi svalpu nahim byapihi soi || kavaneu~ janma mitihi nahim gyana| sunahi sudra mama bacana pravana
    || raghupati purim janma taba bhayu| puni taim mama seva~ mana dayu || puri prabhava anugraha morem|
    rama bhagati upajihi ura torem || sunu mama bacana satya aba bhai| haritoshana brata dvija sevakai
    || aba jani karahi bipra apamana| janehu santa ananta samana || indra kulisa mama sula bisala| kaladanda
    hari cakra karala || jo inha kara mara nahim mari| bipradroha pavaka so jari || asa bibeka rakhehu
    mana mahim| tumha kaha~ jaga durlabha kachu nahim || auru eka asisha mori| apratihata gati hoihi tori
    || do suni siva bacana harashi gura evamastu iti bhashi| mohi prabodhi gayu griha sambhu carana ura
    rakhi || || prerita kala bidhi giri jai bhayu~ maim byala| puni prayasa binu so tanu jajeu~ ge~ kachu
    kala || || joi tanu dharu~ taju~ puni anayasa harijana| jimi nutana pata pahiri nara parihari purana
    || || siva~ rakhi shruti niti aru maim nahim pava klesa| ehi bidhi dhareu~ bibidha tanu gyana na gayu
    khagesa || || trijaga deva nara joi tanu dharu~| taha~ taha~ rama bhajana anusaru~ || eka sula mohi
    bisara na k | gura kara komala sila subh || carama deha dvija kai maim pai| sura durlabha purana shruti
    gai || khelu~ tahu~ balakanha mila| karu~ sakala raghunayaka lila || praurha bhe~ mohi pita parhaava|
    samajhu~ sunu~ gunu~ nahim bhava || mana te sakala basana bhagi| kevala rama carana laya lagi || kahu
    khagesa asa kavana abhagi| khari seva suradhenuhi tyagi || prema magana mohi kachu na sohai| hareu
    pita parhaai parhaai || bhe kalabasa jaba pitu mata| maim bana gayu~ bhajana janatrata || jaha~ jaha~
    bipina munisvara pavu~| ashrama jai jai siru navu~ || bujhata tinhahi rama guna gaha| kahahim sunu~
    harashita khaganaha || sunata phiru~ hari guna anubada| abyahata gati sambhu prasada || chuti tribidha
    ishana garhai| eka lalasa ura ati barhai || rama carana barija jaba dekhaum| taba nija janma saphala
    kari lekhaum || jehi pu~chu~ soi muni asa kahi| isvara sarba bhutamaya ahi || nirguna mata nahim mohi
    sohai| saguna brahma rati ura adhikai || do gura ke bacana surati kari rama carana manu laga| raghupati
    jasa gavata phiru~ chana chana nava anuraga || || meru sikhara bata chaya~ muni lomasa asina| dekhi
    carana siru nayu~ bacana kaheu~ ati dina || || suni mama bacana binita mridu muni kripala khagaraja|
    mohi sadara pu~chata bhe dvija ayahu kehi kaja || || taba maim kaha kripanidhi tumha sarbagya sujana|
    saguna brahma avaradhana mohi kahahu bhagavana || || taba munisha raghupati guna gatha| kahe kachuka
    sadara khaganatha || brahmagyana rata muni bigyani| mohi parama adhikari jani || lage karana brahma
    upadesa| aja adveta aguna hridayesa || akala aniha anama arupa| anubhava gamya akhanda anupa || mana
    gotita amala abinasi| nirbikara niravadhi sukha rasi || so taim tahi tohi nahim bheda| bari bici iva
    gavahi beda || bibidha bha~ti mohi muni samujhava| nirguna mata mama hridaya~ na ava || puni maim
    kaheu~ nai pada sisa| saguna upasana kahahu munisa || rama bhagati jala mama mana mina| kimi bilagai
    munisa prabina || soi upadesa kahahu kari daya| nija nayananhi dekhaum raghuraya || bhari locana biloki
    avadhesa| taba sunihu~ nirguna upadesa || muni puni kahi harikatha anupa| khandi saguna mata aguna
    nirupa || taba maim nirguna mata kara duri| saguna nirupu~ kari hatha bhuri || uttara pratiuttara
    maim kinha| muni tana bhe krodha ke cinha || sunu prabhu bahuta avagya kie~| upaja krodha gyaninha
    ke hie~ || ati sangharashana jaum kara koi| anala pragata candana te hoi || do barambara sakopa muni
    kari nirupana gyana| maim apanem mana baitha taba karu~ bibidha anumana || || krodha ki dvetabuddhi
    binu dvaita ki binu agyana| mayabasa parichinna jara jiva ki isa samana || || kabahu~ ki dukha saba
    kara hita takem| tehi ki daridra parasa mani jakem || paradrohi ki hohim nisanka| kami puni ki rahahim
    akalanka || bamsa ki raha dvija anahita kinhem| karma ki hohim svarupahi cinhem || kahu sumati ki
    khala sa~ga jami| subha gati pava ki paratriya gami || bhava ki parahim paramatma bindaka| sukhi ki
    hohim kabahu~ harinindaka || raju ki rahi niti binu janem| agha ki rahahim haricarita bakhanem ||
    pavana jasa ki punya binu hoi| binu agha ajasa ki pavi koi || labhu ki kichu hari bhagati samana|
    jehi gavahim shruti santa purana || hani ki jaga ehi sama kichu bhai| bhajia na ramahi nara tanu pai
    || agha ki pisunata sama kachu ana| dharma ki daya sarisa harijana || ehi bidhi amiti juguti mana
    gunu~| muni upadesa na sadara sunu~ || puni puni saguna paccha maim ropa| taba muni boleu bacana sakopa
    || murha parama sikha deu~ na manasi| uttara pratiuttara bahu anasi || satya bacana bisvasa na karahi|
    bayasa iva sabahi te darahi || satha svapaccha taba hridaya~ bisala| sapadi hohi pacchi candala ||
    linha shrapa maim sisa carhaai| nahim kachu bhaya na dinata ai || do turata bhayu~ maim kaga taba
    puni muni pada siru nai| sumiri rama raghubamsa mani harashita caleu~ uraai || || uma je rama carana
    rata bigata kama mada krodha || nija prabhumaya dekhahim jagata kehi sana karahim birodha || || sunu
    khagesa nahim kachu rishi dushana| ura preraka raghubamsa bibhushana || kripasindhu muni mati kari
    bhori| linhi prema pariccha mori || mana baca krama mohi nija jana jana| muni mati puni pheri bhagavana
    || rishi mama mahata silata dekhi| rama carana bisvasa biseshi || ati bisamaya puni puni pachitai|
    sadara muni mohi linha bolai || mama paritosha bibidha bidhi kinha| harashita ramamantra taba dinha
    || balakarupa rama kara dhyana| kaheu mohi muni kripanidhana || sundara sukhada mihi ati bhava| so
    prathamahim maim tumhahi sunava || muni mohi kachuka kala taha~ rakha| ramacaritamanasa taba bhasha
    || sadara mohi yaha katha sunai| puni bole muni gira suhai || ramacarita sara gupta suhava| sambhu
    prasada tata maim pava || tohi nija bhagata rama kara jani| tate maim saba kaheu~ bakhani || rama
    bhagati jinha kem ura nahim| kabahu~ na tata kahia tinha pahim || muni mohi bibidha bha~ti samujhava|
    maim saprema muni pada siru nava || nija kara kamala parasi mama sisa| harashita asisha dinha munisa
    || rama bhagati abirala ura torem| basihi sada prasada aba morem || do sada rama priya hohu tumha
    subha guna bhavana amana| kamarupa icdhamarana gyana biraga nidhana || || jemhim ashrama tumha basaba
    puni sumirata shribhagavanta| byapihi taha~ na abidya jojana eka prajanta || || kala karma guna dosha
    subh | kachu dukha tumhahi na byapihi k || rama rahasya lalita bidhi nana| gupta pragata itihasa purana
    || binu shrama tumha janaba saba sou| nita nava neha rama pada hou || jo iccha karihahu mana mahim|
    hari prasada kachu durlabha nahim || suni muni asisha sunu matidhira| brahmagira bhi gagana ga~bhira
    || evamastu tava baca muni gyani| yaha mama bhagata karma mana bani || suni nabhagira harasha mohi
    bhayu| prema magana saba samsaya gayu || kari binati muni ayasu pai| pada saroja puni puni siru nai
    || harasha sahita ehim ashrama ayu~| prabhu prasada durlabha bara payu~ || iha~ basata mohi sunu khaga
    isa| bite kalapa sata aru bisa || karu~ sada raghupati guna gana| sadara sunahim bihanga sujana ||
    jaba jaba avadhapurim raghubira| dharahim bhagata hita manuja sarira || taba taba jai rama pura rahu~|
    sisulila biloki sukha lahu~ || puni ura rakhi rama sisurupa| nija ashrama avu~ khagabhupa || katha
    sakala maim tumhahi sunai| kaga deha jehim karana pai || kahiu~ tata saba prasna tumhari| rama bhagati
    mahima ati bhari || do tate yaha tana mohi priya bhayu rama pada neha| nija prabhu darasana payu~
    ge sakala sandeha || untisava~ vishrama bhagati paccha hatha kari raheu~ dinhi maharishi sapa| muni
    durlabha bara payu~ dekhahu bhajana pratapa || || je asi bhagati jani pariharahim| kevala gyana hetu
    shrama karahim || te jara kamadhenu griha~ tyagi| khojata aku phirahim paya lagi || sunu khagesa hari
    bhagati bihai| je sukha cahahim ana upai || te satha mahasindhu binu tarani| pairi para cahahim jara
    karani || suni bhasundi ke bacana bhavani| boleu garura harashi mridu bani || tava prasada prabhu
    mama ura mahim| samsaya soka moha bhrama nahim || suneu~ punita rama guna grama| tumhari kripa~ laheu~
    bishrama || eka bata prabhu pu~chu~ tohi| kahahu bujhai kripanidhi mohi || kahahim santa muni beda
    purana| nahim kachu durlabha gyana samana || soi muni tumha sana kaheu gosaim| nahim adarehu bhagati
    ki naim || gyanahi bhagatihi antara keta| sakala kahahu prabhu kripa niketa || suni uragari bacana
    sukha mana| sadara boleu kaga sujana || bhagatihi gyanahi nahim kachu bheda| ubhaya harahim bhava
    sambhava kheda || natha munisa kahahim kachu antara| savadhana sau sunu bihangabara || gyana biraga
    joga bigyana| e saba purusha sunahu harijana || purusha pratapa prabala saba bha~ti| abala abala sahaja
    jara jati || do purusha tyagi saka narihi jo birakta mati dhira || na tu kami bishayabasa bimukha
    jo pada raghubira || sau muni gyananidhana mriganayani bidhu mukha nirakhi| bibasa hoi harijana nari
    bishnu maya pragata || || iha~ na pacchapata kachu rakhu~| beda purana santa mata bhashu~ || moha
    na nari nari kem rupa| pannagari yaha riti anupa || maya bhagati sunahu tumha dou| nari barga jani
    saba kou || puni raghubirahi bhagati piari| maya khalu nartaki bicari || bhagatihi sanukula raghuraya|
    tate tehi darapati ati maya || rama bhagati nirupama nirupadhi| basi jasu ura sada abadhi || tehi
    biloki maya sakucai| kari na saki kachu nija prabhutai || asa bicari je muni bigyani| jacahim bhagati
    sakala sukha khani || do yaha rahasya raghunatha kara begi na jani koi| jo jani raghupati kripa~ sapanehu~
    moha na hoi || || auru gyana bhagati kara bheda sunahu suprabina| jo suni hoi rama pada priti sada
    abichina || || sunahu tata yaha akatha kahani| samujhata bani na jai bakhani || isvara amsa jiva abinasi|
    cetana amala sahaja sukha rasi || so mayabasa bhayu gosaim| ba~dhyo kira marakata ki nai || jara cetanahi
    granthi pari gi| jadapi mrisha chutata kathini || taba te jiva bhayu samsari| chuta na granthi na
    hoi sukhari || shruti purana bahu kaheu upai| chuta na adhika adhika arujhai || jiva hridaya~ tama
    moha biseshi| granthi chuta kimi pari na dekhi || asa sanjoga isa jaba kari| tabahu~ kadacita so niruari
    || sattvika shraddha dhenu suhai| jaum hari kripa~ hridaya~ basa ai || japa tapa brata jama niyama
    apara| je shruti kaha subha dharma acara || tei trina harita carai jaba gai| bhava baccha sisu pai
    penhai || noi nibritti patra bisvasa| nirmala mana ahira nija dasa || parama dharmamaya paya duhi
    bhai| avatai anala akama bihai || tosha maruta taba chama~ juraavai| dhriti sama javanu dei jamavai
    || mudita~ mathaim bicara mathani| dama adhara raju satya subani || taba mathi karhai lei navanita|
    bimala biraga subhaga supunita || do joga agini kari pragata taba karma subhasubha lai| buddhi siravaim
    gyana ghrita mamata mala jari jai || || taba bigyanarupini buddhi bisada ghrita pai| citta dia bhari
    dharai drirha samata diati banai || || tini avastha tini guna tehi kapasa tem karhai| tula turiya
    sa~vari puni bati karai sugarhai || ehi bidhi lesai dipa teja rasi bigyanamaya || jatahim jasu samipa
    jarahim madadika salabha saba || || sohamasmi iti britti akhanda| dipa sikha soi parama pracanda ||
    atama anubhava sukha suprakasa| taba bhava mula bheda bhrama nasa || prabala abidya kara parivara|
    moha adi tama miti apara || taba soi buddhi pai u~jiara| ura griha~ baithi granthi niruara || chorana
    granthi pava jaum soi| taba yaha jiva kritaratha hoi || chorata granthi jani khagaraya| bighna aneka
    kari taba maya || riddhi siddhi preri bahu bhai| buddhahi lobha dikhavahim ai || kala bala chala kari
    jahim samipa| ancala bata bujhavahim dipa || hoi buddhi jaum parama sayani| tinha tana citava na anahita
    jani || jaum tehi bighna buddhi nahim badhi| tau bahori sura karahim upadhi || indrim dvara jharokha
    nana| taha~ taha~ sura baithe kari thana || avata dekhahim bishaya bayari| te hathi dehi kapata ughari
    || jaba so prabhanjana ura griha~ jai| tabahim dipa bigyana bujhai || granthi na chuti mita so prakasa|
    buddhi bikala bhi bishaya batasa || indrinha suranha na gyana sohai| bishaya bhoga para priti sadai
    || bishaya samira buddhi krita bhori| tehi bidhi dipa ko bara bahori || do taba phiri jiva bibidha
    bidhi pavi samsriti klesa| hari maya ati dustara tari na jai bihagesa || || kahata kathina samujhata
    kathina sadhana kathina bibeka| hoi ghunacchara nyaya jaum puni pratyuha aneka || || gyana pantha
    kripana kai dhara| parata khagesa hoi nahim bara || jo nirbighna pantha nirbahi| so kaivalya parama
    pada lahi || ati durlabha kaivalya parama pada| santa purana nigama agama bada || rama bhajata soi
    mukuti gosai| anicchita avi bariai || jimi thala binu jala rahi na sakai| koti bha~ti kau karai upai
    || tatha moccha sukha sunu khagarai| rahi na saki hari bhagati bihai || asa bicari hari bhagata sayane|
    mukti niradara bhagati lubhane || bhagati karata binu jatana prayasa| samsriti mula abidya nasa ||
    bhojana karia tripiti hita lagi| jimi so asana pacavai jatharagi || asi haribhagati sugama sukhadai|
    ko asa murha na jahi sohai || do sevaka sebya bhava binu bhava na taria uragari || bhajahu rama pada
    pankaja asa siddhanta bicari || || jo cetana kaha~ zara kari zarahi kari caitanya| asa samartha raghunayakahim
    bhajahim jiva te dhanya || || kaheu~ gyana siddhanta bujhai| sunahu bhagati mani kai prabhutai ||
    rama bhagati cintamani sundara| basi garura jake ura antara || parama prakasa rupa dina rati| nahim
    kachu cahia dia ghrita bati || moha daridra nikata nahim ava| lobha bata nahim tahi bujhava || prabala
    abidya tama miti jai| harahim sakala salabha samudai || khala kamadi nikata nahim jahim| basi bhagati
    jake ura mahim || garala sudhasama ari hita hoi| tehi mani binu sukha pava na koi || byapahim manasa
    roga na bhari| jinha ke basa saba jiva dukhari || rama bhagati mani ura basa jakem| dukha lavalesa
    na sapanehu~ takem || catura siromani tei jaga mahim| je mani lagi sujatana karahim || so mani jadapi
    pragata jaga ahi| rama kripa binu nahim kau lahi || sugama upaya paibe kere| nara hatabhagya dehim
    bhatamere || pavana parbata beda purana| rama katha rucirakara nana || marmi sajjana sumati kudari|
    gyana biraga nayana uragari || bhava sahita khoji jo prani| pava bhagati mani saba sukha khani ||
    morem mana prabhu asa bisvasa| rama te adhika rama kara dasa || rama sindhu ghana sajjana dhira| candana
    taru hari santa samira || saba kara phala hari bhagati suhai| so binu santa na kahu~ pai || asa bicari
    joi kara satasanga| rama bhagati tehi sulabha bihanga || do brahma payonidhi mandara gyana santa sura
    ahim| katha sudha mathi karhahim bhagati madhurata jahim || || birati carma asi gyana mada lobha moha
    ripu mari| jaya paia so hari bhagati dekhu khagesa bicari || || puni saprema boleu khagar | jaum kripala
    mohi upara bh || natha mohi nija sevaka jani| sapta prasna kahahu bakhani || prathamahim kahahu natha
    matidhira| saba te durlabha kavana sarira || bara dukha kavana kavana sukha bhari| sau sanchepahim
    kahahu bicari || santa asanta marama tumha janahu| tinha kara sahaja subhava bakhanahu || kavana punya
    shruti bidita bisala| kahahu kavana agha parama karala || manasa roga kahahu samujhai| tumha sarbagya
    kripa adhikai || tata sunahu sadara ati priti| maim sanchepa kahu~ yaha niti || nara tana sama nahim
    kavaniu dehi| jiva caracara jacata tehi || naraka svarga apabarga niseni| gyana biraga bhagati subha
    deni || so tanu dhari hari bhajahim na je nara| hohim bishaya rata manda manda tara || ka~ca kirica
    badalem te lehi| kara te dari parasa mani dehim || nahim daridra sama dukha jaga mahim| santa milana
    sama sukha jaga nahim || para upakara bacana mana kaya| santa sahaja subhau khagaraya || santa sahahim
    dukha parahita lagi| paradukha hetu asanta abhagi || bhurja taru sama santa kripala| parahita niti
    saha bipati bisala || sana iva khala para bandhana kari| khala karhaai bipati sahi mari || khala binu
    svaratha para apakari| ahi mushaka iva sunu uragari || para sampada binasi nasahim| jimi sasi hati
    hima upala bilahim || dushta udaya jaga arati hetu| jatha prasiddha adhama graha ketu || santa udaya
    santata sukhakari| bisva sukhada jimi indu tamari || parama dharma shruti bidita ahimsa| para ninda
    sama agha na garisa || hara gura nindaka dadura hoi| janma sahasra pava tana soi || dvija nindaka
    bahu naraka bhogakari| jaga janami bayasa sarira dhari || sura shruti nindaka je abhimani| raurava
    naraka parahim te prani || hohim uluka santa ninda rata| moha nisa priya gyana bhanu gata || saba
    ke ninda je jara karahim| te camagadura hoi avatarahim || sunahu tata aba manasa roga| jinha te dukha
    pavahim saba loga || moha sakala byadhinha kara mula| tinha te puni upajahim bahu sula || kama bata
    kapha lobha apara| krodha pitta nita chati jara || priti karahim jaum tiniu bhai| upaji sanyapata
    dukhadai || bishaya manoratha durgama nana| te saba sula nama ko jana || mamata dadu kandu irashai|
    harasha bishada garaha bahutai || para sukha dekhi jarani soi chi| kushta dushtata mana kutili ||
    ahankara ati dukhada damarua| dambha kapata mada mana neharua || trisna udarabriddhi ati bhari| tribidha
    ishana taruna tijari || juga bidhi jvara matsara abibeka| kaha~ lagi kahaum kuroga aneka || do eka
    byadhi basa nara marahim e asadhi bahu byadhi| pirahim santata jiva kahu~ so kimi lahai samadhi ||
    || nema dharma acara tapa gyana jagya japa dana| bheshaja puni kotinha nahim roga jahim harijana ||
    || ehi bidhi sakala jiva jaga rogi| soka harasha bhaya priti biyogi || manaka roga kachuka maim gae|
    hahim saba kem lakhi biralenha pae || jane te chijahim kachu papi| nasa na pavahim jana paritapi ||
    bishaya kupathya pai ankure| munihu hridaya~ ka nara bapure || rama kripa~ nasahi saba roga| jaum
    ehi bha~ti banai samyoga || sadagura baida bacana bisvasa| sanjama yaha na bishaya kai asa || raghupati
    bhagati sajivana muri| anupana shraddha mati puri || ehi bidhi bhalehim so roga nasahim| nahim ta
    jatana koti nahim jahim || jania taba mana biruja gosa~i| jaba ura bala biraga adhikai || sumati chudha
    barhai nita ni| bishaya asa durbalata gi || bimala gyana jala jaba so nahai| taba raha rama bhagati
    ura chai || siva aja suka sanakadika narada| je muni brahma bicara bisarada || saba kara mata khaganayaka
    eha| karia rama pada pankaja neha || shruti purana saba grantha kahahim| raghupati bhagati bina sukha
    nahim || kamatha pitha jamahim baru bara| bandhya suta baru kahuhi mara || phulahim nabha baru bahubidhi
    phula| jiva na laha sukha hari pratikula || trisha jai baru mrigajala pana| baru jamahim sasa sisa
    bishana || andhakaru baru rabihi nasavai| rama bimukha na jiva sukha pavai || hima te anala pragata
    baru hoi| bimukha rama sukha pava na koi || do bari mathem ghrita hoi baru sikata te baru tela| binu
    hari bhajana na bhava taria yaha siddhanta apela || || masakahi kari bimranci prabhu ajahi masaka
    te hina| asa bicari taji samsaya ramahi bhajahim prabina || vinicshritam vadami te na anyatha vacamsi
    me| harim nara bhajanti ye'tidustaram taranti te || || kaheu~ natha hari carita anupa| byasa samasa
    svamati anurupa || shruti siddhanta ihi uragari| rama bhajia saba kaja bisari || prabhu raghupati
    taji seia kahi| mohi se satha para mamata jahi || tumha bigyanarupa nahim moha| natha kinhi mo para
    ati choha || puchihu~ rama katha ati pavani| suka sanakadi sambhu mana bhavani || sata sangati durlabha
    samsara| nimisha danda bhari eku bara || dekhu garura nija hridaya~ bicari| maim raghubira bhajana
    adhikari || sakunadhama saba bha~ti apavana| prabhu mohi kinha bidita jaga pavana || do aju dhanya
    maim dhanya ati jadyapi saba bidhi hina| nija jana jani rama mohi santa samagama dina || || natha
    jathamati bhasheu~ rakheu~ nahim kachu goi| carita sindhu raghunayaka thaha ki pavi koi || || sumiri
    rama ke guna gana nana| puni puni harasha bhusundi sujana || mahima nigama neti kari gai| atulita
    bala pratapa prabhutai || siva aja pujya carana raghurai| mo para kripa parama mridulai || asa subhau
    kahu~ sunu~ na dekhu~| kehi khagesa raghupati sama lekhu~ || sadhaka siddha bimukta udasi| kabi kobida
    kritagya sannyasi || jogi sura sutapasa gyani| dharma nirata pandita bigyani || tarahim na binu si~
    mama svami| rama namami namami namami || sarana ge~ mo se agha rasi| hohim suddha namami abinasi ||
    do jasu nama bhava bheshaja harana ghora traya sula| so kripalu mohi to para sada rahu anukula ||
    || suni bhusundi ke bacana subha dekhi rama pada neha| boleu prema sahita gira garura bigata sandeha
    || || mai kritkritya bhayu~ tava bani| suni raghubira bhagati rasa sani || rama carana nutana rati
    bhi| maya janita bipati saba gi || moha jaladhi bohita tumha bhe| mo kaha~ natha bibidha sukha de
    || mo pahim hoi na prati upakara| bandu~ tava pada barahim bara || purana kama rama anuragi| tumha
    sama tata na kau barabhagi || santa bitapa sarita giri dharani| para hita hetu sabanha kai karani
    || santa hridaya navanita samana| kaha kabinha pari kahai na jana || nija paritapa dravi navanita|
    para dukha dravahim santa supunita || jivana janma suphala mama bhayu| tava prasada samsaya saba gayu
    || janehu sada mohi nija kinkara| puni puni uma kahi bihangabara || do tasu carana siru nai kari prema
    sahita matidhira| gayu garura baikuntha taba hridaya~ rakhi raghubira || || girija santa samagama
    sama na labha kachu ana| binu hari kripa na hoi so gavahim beda purana || || kaheu~ parama punita
    itihasa| sunata shravana chutahim bhava pasa || pranata kalpataru karuna punja| upaji priti rama pada
    kanja || mana krama bacana janita agha jai| sunahim je katha shravana mana lai || tirthatana sadhana
    samudai| joga biraga gyana nipunai || nana karma dharma brata dana| sanjama dama japa tapa makha nana
    || bhuta daya dvija gura sevakai| bidya binaya bibeka baraai || jaha~ lagi sadhana beda bakhani| saba
    kara phala hari bhagati bhavani || so raghunatha bhagati shruti gai| rama kripa~ kahu~ eka pai ||
    do muni durlabha hari bhagati nara pavahim binahim prayasa| je yaha katha nirantara sunahim mani bisvasa
    || || soi sarbagya guni soi gyata| soi mahi mandita pandita data || dharma parayana soi kula trata|
    rama carana ja kara mana rata || niti nipuna soi parama sayana| shruti siddhanta nika tehim jana ||
    soi kabi kobida soi ranadhira| jo chala charai bhaji raghubira || dhanya desa so jaha~ surasari| dhanya
    nari patibrata anusari || dhanya so bhupu niti jo kari| dhanya so dvija nija dharma na tari || so
    dhana dhanya prathama gati jaki| dhanya punya rata mati soi paki || dhanya ghari soi jaba satasanga|
    dhanya janma dvija bhagati abhanga || do so kula dhanya uma sunu jagata pujya supunita| shriraghubira
    parayana jehim nara upaja binita || || mati anurupa katha maim bhashi| jadyapi prathama gupta kari
    rakhi || tava mana priti dekhi adhikai| taba maim raghupati katha sunai || yaha na kahia sathahi hathasilahi|
    jo mana lai na suna hari lilahi || kahia na lobhihi krodhahi kamihi| jo na bhaji sacaracara svamihi
    || dvija drohihi na sunaia kabahu~| surapati sarisa hoi nripa jabahu~ || rama katha ke tei adhikari|
    jinha kem satasangati ati pyari || gura pada priti niti rata jei| dvija sevaka adhikari tei || ta
    kaha~ yaha bisesha sukhadai| jahi pranapriya shriraghurai || do rama carana rati jo caha athava pada
    nirbana| bhava sahita so yaha katha karu shravana puta pana || || rama katha girija maim barani| kali
    mala samani manomala harani || samsriti roga sajivana muri| rama katha gavahim shruti suri || ehi
    maha~ rucira sapta sopana| raghupati bhagati kera panthana || ati hari kripa jahi para hoi| pau~ dei
    ehim maraga soi || mana kamana siddhi nara pava| je yaha katha kapata taji gava || kahahim sunahim
    anumodana karahim| te gopada iva bhavanidhi tarahim || suni saba katha hridaya~ ati bhai| girija boli
    gira suhai || natha kripa~ mama gata sandeha| rama carana upajeu nava neha || do maim kritakritya
    bhiu~ aba tava prasada bisvesa| upaji rama bhagati drirha bite sakala kalesa || || yaha subha sambhu
    uma sambada| sukha sampadana samana bishada || bhava bhanjana ganjana sandeha| jana ranjana sajjana
    priya eha || rama upasaka je jaga mahim| ehi sama priya tinha ke kachu nahim || raghupati kripa~ jathamati
    gava| maim yaha pavana carita suhava || ehim kalikala na sadhana duja| joga jagya japa tapa brata
    puja || ramahi sumiria gaia ramahi| santata sunia rama guna gramahi || jasu patita pavana bara bana|
    gavahim kabi shruti santa purana || tahi bhajahi mana taji kutilai| rama bhajem gati kehim nahim pai
    || cham pai na kehim gati patita pavana rama bhaji sunu satha mana| ganika ajamila byadha gidha gajadi
    khala tare ghana || abhira jamana kirata khasa svapacadi ati agharupa je| kahi nama baraka tepi pavana
    hohim rama namami te || || raghubamsa bhushana carita yaha nara kahahim sunahim je gavahim| kali mala
    manomala dhoi binu shrama rama dhama sidhavahim || sata panca caupaim manohara jani jo nara ura dharai|
    daruna abidya panca janita bikara shriraghubara harai || || sundara sujana kripa nidhana anatha para
    kara priti jo| so eka rama akama hita nirbanaprada sama ana ko || jaki kripa lavalesa te matimanda
    tulasidasahu~| payo parama bishramu rama samana prabhu nahim kahu~ || mo sama dina na dina hita tumha
    samana raghubira| asa bicari raghubamsa mani harahu bishama bhava bhira || || kamihi nari piari jimi
    lobhahi priya jimi dama| timi raghunatha nirantara priya lagahu mohi rama || yatpurva prabhuna kritam
    sukavina shrishambhuna durgamam shrimadramapadabjabhaktimanisham praptyai tu ramayanam| matva tadraghunathamaniratam
    svantastamahshantaye bhashabaddhamidam cakara tulasidasastatha manasam || || punyam papaharam sada
    shivakaram vijnanabhaktipradam mayamohamalapaham suvimalam premambupuram shubham| shrimadramacaritramanasamidam
    bhaktyavagahanti ye te samsarapatangaghorakiranairdahyanti no manavah || tisava~ vishrama navanhaparayana
    iti shrimadramacaritamanase sakalakalikalushavidhvamsane saptamah sopanah samaptah| arati shriramayanaji
    ki| kirati kalita lalita siya pi ki || gavata brahmadika muni narada| balamika bigyana bisarada| suka
    sanakadi sesha aru sarada| barani pavanasuta kirati niki || || gavata beda purana ashtadasa| cho sastra
    saba granthana ko rasa| muni jana dhana santana ko sarabasa| sara amsa sammata sabahi ki || || gavata
    santata sambhu bhavani| aru ghatasambhava muni bigyani| byasa adi kabibarja bakhani| kagabhusundi
    garuda ke hi ki || || kalimala harani bishaya rasa phiki| subhaga singara mukti jubati ki| dalana
    roga bhava muri ami ki| tata mata saba bidhi tulasi ki ||
  devanagari: श्री गणेशाय नमः श्रीजानकीवल्लभो विजयते श्रीरामचरितमानस सप्तम सोपान केकीकण्ठाभनीलं सुरवरविलसद्विप्रपादाब्जचिह्नं
    शोभाढ्यं पीतवस्त्रं सरसिजनयनं सर्वदा सुप्रसन्नम्। पाणौ नाराचचापं कपिनिकरयुतं बन्धुना सेव्यमानं नौमीड्यं
    जानकीशं रघुवरमनिशं पुष्पकारूढरामम् ॥ ॥ कोसलेन्द्रपदकञ्जमञ्जुलौ कोमलावजमहेशवन्दितौ। जानकीकरसरोजलालितौ
    चिन्तकस्य मनभृङ्गसड्गिनौ ॥ ॥ कुन्दिन्दुदरगौरसुन्दरं अम्बिकापतिमभीष्टसिद्धिदम्। कारुणीककलकञ्जलोचनं
    नौमि शङ्करमनङ्गमोचनम् ॥ रहा एक दिन अवधि कर अति आरत पुर लोग। जहँ तहँ सोचहिं नारि नर कृस तन राम बियोग
    ॥ सगुन होहिं सुन्दर सकल मन प्रसन्न सब केर। प्रभु आगवन जनाव जनु नगर रम्य चहुँ फेर ॥ कौसल्यादि मातु
    सब मन अनन्द अस होइ। आयु प्रभु श्री अनुज जुत कहन चहत अब कोइ ॥ भरत नयन भुज दच्छिन फरकत बारहिं बार। जानि
    सगुन मन हरष अति लागे करन बिचार ॥ रहेउ एक दिन अवधि अधारा। समुझत मन दुख भयु अपारा ॥ कारन कवन नाथ नहिं
    आयु। जानि कुटिल किधौं मोहि बिसरायु ॥ अहह धन्य लछिमन बड़भागी। राम पदारबिन्दु अनुरागी ॥ कपटी कुटिल मोहि
    प्रभु चीन्हा। ताते नाथ सङ्ग नहिं लीन्हा ॥ जौं करनी समुझै प्रभु मोरी। नहिं निस्तार कलप सत कोरी ॥ जन
    अवगुन प्रभु मान न क् । दीन बन्धु अति मृदुल सुभ् ॥ मोरि जियँ भरोस दृढ़ सोई। मिलिहहिं राम सगुन सुभ होई
    ॥ बीतें अवधि रहहि जौं प्राना। अधम कवन जग मोहि समाना ॥ दो राम बिरह सागर महँ भरत मगन मन होत। बिप्र रूप
    धरि पवन सुत आइ गयु जनु पोत ॥ ॥ बैठि देखि कुसासन जटा मुकुट कृस गात। राम राम रघुपति जपत स्त्रवत नयन
    जलजात ॥ ॥ देखत हनूमान अति हरषेउ। पुलक गात लोचन जल बरषेउ ॥ मन महँ बहुत भाँति सुख मानी। बोलेउ श्रवन
    सुधा सम बानी ॥ जासु बिरहँ सोचहु दिन राती। रटहु निरन्तर गुन गन पाँती ॥ रघुकुल तिलक सुजन सुखदाता। आयु
    कुसल देव मुनि त्राता ॥ रिपु रन जीति सुजस सुर गावत। सीता सहित अनुज प्रभु आवत ॥ सुनत बचन बिसरे सब दूखा।
    तृषावन्त जिमि पाइ पियूषा ॥ को तुम्ह तात कहाँ ते आए। मोहि परम प्रिय बचन सुनाए ॥ मारुत सुत मैं कपि हनुमाना।
    नामु मोर सुनु कृपानिधाना ॥ दीनबन्धु रघुपति कर किङ्कर। सुनत भरत भेण्टेउ उठि सादर ॥ मिलत प्रेम नहिं
    हृदयँ समाता। नयन स्त्रवत जल पुलकित गाता ॥ कपि तव दरस सकल दुख बीते। मिले आजु मोहि राम पिरीते ॥ बार
    बार बूझी कुसलाता। तो कहुँ देउँ काह सुनु भ्राता ॥ एहि सन्देस सरिस जग माहीं। करि बिचार देखेउँ कछु नाहीम्
    ॥ नाहिन तात उरिन मैं तोही। अब प्रभु चरित सुनावहु मोही ॥ तब हनुमन्त नाइ पद माथा। कहे सकल रघुपति गुन
    गाथा ॥ कहु कपि कबहुँ कृपाल गोसाईं। सुमिरहिं मोहि दास की नाईम् ॥ छं निज दास ज्यों रघुबंसभूषन कबहुँ
    मम सुमिरन कर् यो। सुनि भरत बचन बिनीत अति कपि पुलकित तन चरनन्हि पर् यो ॥ रघुबीर निज मुख जासु गुन गन
    कहत अग जग नाथ जो। काहे न होइ बिनीत परम पुनीत सदगुन सिन्धु सो ॥ दो राम प्रान प्रिय नाथ तुम्ह सत्य बचन
    मम तात। पुनि पुनि मिलत भरत सुनि हरष न हृदयँ समात ॥ भरत चरन सिरु नाइ तुरित गयु कपि राम पहिं। कही कुसल
    सब जाइ हरषि चलेउ प्रभु जान चढ़इ ॥ ॥ हरषि भरत कोसलपुर आए। समाचार सब गुरहि सुनाए ॥ पुनि मन्दिर महँ बात
    जनाई। आवत नगर कुसल रघुराई ॥ सुनत सकल जननीं उठि धाईं। कहि प्रभु कुसल भरत समुझाई ॥ समाचार पुरबासिंह
    पाए। नर अरु नारि हरषि सब धाए ॥ दधि दुर्बा रोचन फल फूला। नव तुलसी दल मङ्गल मूला ॥ भरि भरि हेम थार भामिनी।
    गावत चलिं सिन्धु सिन्धुरगामिनी ॥ जे जैसेहिं तैसेहिं उटि धावहिं। बाल बृद्ध कहँ सङ्ग न लावहिम् ॥ एक
    एकन्ह कहँ बूझहिं भाई। तुम्ह देखे दयाल रघुराई ॥ अवधपुरी प्रभु आवत जानी। भी सकल सोभा कै खानी ॥ बहि सुहावन
    त्रिबिध समीरा। भि सरजू अति निर्मल नीरा ॥ दो हरषित गुर परिजन अनुज भूसुर बृन्द समेत। चले भरत मन प्रेम
    अति सन्मुख कृपानिकेत ॥ ॥ बहुतक चढ़ई अटारिन्ह निरखहिं गगन बिमान। देखि मधुर सुर हरषित करहिं सुमङ्गल
    गान ॥ ॥ राका ससि रघुपति पुर सिन्धु देखि हरषान। बढ़यो कोलाहल करत जनु नारि तरङ्ग समान ॥ ॥ इहाँ भानुकुल
    कमल दिवाकर। कपिन्ह देखावत नगर मनोहर ॥ सुनु कपीस अङ्गद लङ्केसा। पावन पुरी रुचिर यह देसा ॥ जद्यपि सब
    बैकुण्ठ बखाना। बेद पुरान बिदित जगु जाना ॥ अवधपुरी सम प्रिय नहिं सोऊ। यह प्रसङ्ग जानि कौ कोऊ ॥ जन्मभूमि
    मम पुरी सुहावनि। उत्तर दिसि बह सरजू पावनि ॥ जा मज्जन ते बिनहिं प्रयासा। मम समीप नर पावहिं बासा ॥ अति
    प्रिय मोहि इहाँ के बासी। मम धामदा पुरी सुख रासी ॥ हरषे सब कपि सुनि प्रभु बानी। धन्य अवध जो राम बखानी
    ॥ दो आवत देखि लोग सब कृपासिन्धु भगवान। नगर निकट प्रभु प्रेरेउ उतरेउ भूमि बिमान ॥ ॥ उतरि कहेउ प्रभु
    पुष्पकहि तुम्ह कुबेर पहिं जाहु। प्रेरित राम चलेउ सो हरषु बिरहु अति ताहु ॥ ॥ आए भरत सङ्ग सब लोगा। कृस
    तन श्रीरघुबीर बियोगा ॥ बामदेव बसिष्ठ मुनिनायक। देखे प्रभु महि धरि धनु सायक ॥ धाइ धरे गुर चरन सरोरुह।
    अनुज सहित अति पुलक तनोरुह ॥ भेण्टि कुसल बूझी मुनिराया। हमरें कुसल तुम्हारिहिं दाया ॥ सकल द्विजन्ह
    मिलि नायु माथा। धर्म धुरन्धर रघुकुलनाथा ॥ गहे भरत पुनि प्रभु पद पङ्कज। नमत जिन्हहि सुर मुनि सङ्कर
    अज ॥ परे भूमि नहिं उठत उठाए। बर करि कृपासिन्धु उर लाए ॥ स्यामल गात रोम भे ठाढ़ए। नव राजीव नयन जल बाढ़ए
    ॥ छं राजीव लोचन स्त्रवत जल तन ललित पुलकावलि बनी। अति प्रेम हृदयँ लगाइ अनुजहि मिले प्रभु त्रिभुअन धनी
    ॥ प्रभु मिलत अनुजहि सोह मो पहिं जाति नहिं उपमा कही। जनु प्रेम अरु सिङ्गार तनु धरि मिले बर सुषमा लही
    ॥ ॥ बूझत कृपानिधि कुसल भरतहि बचन बेगि न आवी। सुनु सिवा सो सुख बचन मन ते भिन्न जान जो पावी ॥ अब कुसल
    कौसलनाथ आरत जानि जन दरसन दियो। बूड़त बिरह बारीस कृपानिधान मोहि कर गहि लियो ॥ पुनि प्रभु हरषि सत्रुहन
    भेण्टे हृदयँ लगाइ। लछिमन भरत मिले तब परम प्रेम दौ भाइ ॥ ॥ भरतानुज लछिमन पुनि भेण्टे। दुसह बिरह सम्भव
    दुख मेटे ॥ सीता चरन भरत सिरु नावा। अनुज समेत परम सुख पावा ॥ प्रभु बिलोकि हरषे पुरबासी। जनित बियोग
    बिपति सब नासी ॥ प्रेमातुर सब लोग निहारी। कौतुक कीन्ह कृपाल खरारी ॥ अमित रूप प्रगटे तेहि काला। जथाजोग
    मिले सबहि कृपाला ॥ कृपादृष्टि रघुबीर बिलोकी। किए सकल नर नारि बिसोकी ॥ छन महिं सबहि मिले भगवाना। उमा
    मरम यह काहुँ न जाना ॥ एहि बिधि सबहि सुखी करि रामा। आगें चले सील गुन धामा ॥ कौसल्यादि मातु सब धाई।
    निरखि बच्छ जनु धेनु लवाई ॥ छं जनु धेनु बालक बच्छ तजि गृहँ चरन बन परबस गीं। दिन अन्त पुर रुख स्त्रवत
    थन हुङ्कार करि धावत भी ॥ अति प्रेम सब मातु भेटीं बचन मृदु बहुबिधि कहे। गि बिषम बियोग भव तिन्ह हरष
    सुख अगनित लहे ॥ दो भेटेउ तनय सुमित्राँ राम चरन रति जानि। रामहि मिलत कैकेई हृदयँ बहुत सकुचानि ॥ ॥ लछिमन
    सब मातन्ह मिलि हरषे आसिष पाइ। कैकेइ कहँ पुनि पुनि मिले मन कर छोभु न जाइ ॥ ॥ सासुन्ह सबनि मिली बैदेही।
    चरनन्हि लागि हरषु अति तेही ॥ देहिं असीस बूझि कुसलाता। होइ अचल तुम्हार अहिवाता ॥ सब रघुपति मुख कमल
    बिलोकहिं। मङ्गल जानि नयन जल रोकहिम् ॥ कनक थार आरति उतारहिं। बार बार प्रभु गात निहारहिम् ॥ नाना भाँति
    निछावरि करहीं। परमानन्द हरष उर भरहीम् ॥ कौसल्या पुनि पुनि रघुबीरहि। चितवति कृपासिन्धु रनधीरहि ॥ हृदयँ
    बिचारति बारहिं बारा। कवन भाँति लङ्कापति मारा ॥ अति सुकुमार जुगल मेरे बारे। निसिचर सुभट महाबल भारे
    ॥ दो लछिमन अरु सीता सहित प्रभुहि बिलोकति मातु। परमानन्द मगन मन पुनि पुनि पुलकित गातु ॥ ॥ लङ्कापति
    कपीस नल नीला। जामवन्त अङ्गद सुभसीला ॥ हनुमदादि सब बानर बीरा। धरे मनोहर मनुज सरीरा ॥ भरत सनेह सील ब्रत
    नेमा। सादर सब बरनहिं अति प्रेमा ॥ देखि नगरबासिंह कै रीती। सकल सराहहि प्रभु पद प्रीती ॥ पुनि रघुपति
    सब सखा बोलाए। मुनि पद लागहु सकल सिखाए ॥ गुर बसिष्ट कुलपूज्य हमारे। इन्ह की कृपाँ दनुज रन मारे ॥ ए
    सब सखा सुनहु मुनि मेरे। भे समर सागर कहँ बेरे ॥ मम हित लागि जन्म इन्ह हारे। भरतहु ते मोहि अधिक पिआरे
    ॥ सुनि प्रभु बचन मगन सब भे। निमिष निमिष उपजत सुख ने ॥ दो कौसल्या के चरनन्हि पुनि तिन्ह नायु माथ ॥
    आसिष दीन्हे हरषि तुम्ह प्रिय मम जिमि रघुनाथ ॥ ॥ सुमन बृष्टि नभ सङ्कुल भवन चले सुखकन्द। चढ़ई अटारिन्ह
    देखहिं नगर नारि नर बृन्द ॥ ॥ कञ्चन कलस बिचित्र सँवारे। सबहिं धरे सजि निज निज द्वारे ॥ बन्दनवार पताका
    केतू। सबन्हि बनाए मङ्गल हेतू ॥ बीथीं सकल सुगन्ध सिञ्चाई। गजमनि रचि बहु चौक पुराई ॥ नाना भाँति सुमङ्गल
    साजे। हरषि नगर निसान बहु बाजे ॥ जहँ तहँ नारि निछावर करहीं। देहिं असीस हरष उर भरहीम् ॥ कञ्चन थार आरती
    नाना। जुबती सजें करहिं सुभ गाना ॥ करहिं आरती आरतिहर कें। रघुकुल कमल बिपिन दिनकर केम् ॥ पुर सोभा सम्पति
    कल्याना। निगम सेष सारदा बखाना ॥ तेउ यह चरित देखि ठगि रहहीं। उमा तासु गुन नर किमि कहहीम् ॥ दो नारि
    कुमुदिनीं अवध सर रघुपति बिरह दिनेस। अस्त भेँ बिगसत भीं निरखि राम राकेस ॥ ॥ होहिं सगुन सुभ बिबिध बिधि
    बाजहिं गगन निसान। पुर नर नारि सनाथ करि भवन चले भगवान ॥ ॥ प्रभु जानी कैकेई लजानी। प्रथम तासु गृह गे
    भवानी ॥ ताहि प्रबोधि बहुत सुख दीन्हा। पुनि निज भवन गवन हरि कीन्हा ॥ कृपासिन्धु जब मन्दिर गे। पुर नर
    नारि सुखी सब भे ॥ गुर बसिष्ट द्विज लिए बुलाई। आजु सुघरी सुदिन समुदाई ॥ सब द्विज देहु हरषि अनुसासन।
    रामचन्द्र बैठहिं सिङ्घासन ॥ मुनि बसिष्ट के बचन सुहाए। सुनत सकल बिप्रन्ह अति भाए ॥ कहहिं बचन मृदु बिप्र
    अनेका। जग अभिराम राम अभिषेका ॥ अब मुनिबर बिलम्ब नहिं कीजे। महाराज कहँ तिलक करीजै ॥ दो तब मुनि कहेउ
    सुमन्त्र सन सुनत चलेउ हरषाइ। रथ अनेक बहु बाजि गज तुरत सँवारे जाइ ॥ ॥ जहँ तहँ धावन पठि पुनि मङ्गल द्रब्य
    मगाइ। हरष समेत बसिष्ट पद पुनि सिरु नायु आइ ॥ आठवाँ विश्राम अवधपुरी अति रुचिर बनाई। देवन्ह सुमन बृष्टि
    झरि लाई ॥ राम कहा सेवकन्ह बुलाई। प्रथम सखन्ह अन्हवावहु जाई ॥ सुनत बचन जहँ तहँ जन धाए। सुग्रीवादि तुरत
    अन्हवाए ॥ पुनि करुनानिधि भरतु हँकारे। निज कर राम जटा निरुआरे ॥ अन्हवाए प्रभु तीनिउ भाई। भगत बछल कृपाल
    रघुराई ॥ भरत भाग्य प्रभु कोमलताई। सेष कोटि सत सकहिं न गाई ॥ पुनि निज जटा राम बिबराए। गुर अनुसासन मागि
    नहाए ॥ करि मज्जन प्रभु भूषन साजे। अङ्ग अनङ्ग देखि सत लाजे ॥ दो सासुन्ह सादर जानकिहि मज्जन तुरत कराइ।
    दिब्य बसन बर भूषन अँग अँग सजे बनाइ ॥ ॥ राम बाम दिसि सोभति रमा रूप गुन खानि। देखि मातु सब हरषीं जन्म
    सुफल निज जानि ॥ ॥ सुनु खगेस तेहि अवसर ब्रह्मा सिव मुनि बृन्द। चढ़इ बिमान आए सब सुर देखन सुखकन्द ॥
    ॥ प्रभु बिलोकि मुनि मन अनुरागा। तुरत दिब्य सिङ्घासन मागा ॥ रबि सम तेज सो बरनि न जाई। बैठे राम द्विजन्ह
    सिरु नाई ॥ जनकसुता समेत रघुराई। पेखि प्रहरषे मुनि समुदाई ॥ बेद मन्त्र तब द्विजन्ह उचारे। नभ सुर मुनि
    जय जयति पुकारे ॥ प्रथम तिलक बसिष्ट मुनि कीन्हा। पुनि सब बिप्रन्ह आयसु दीन्हा ॥ सुत बिलोकि हरषीं महतारी।
    बार बार आरती उतारी ॥ बिप्रन्ह दान बिबिध बिधि दीन्हे। जाचक सकल अजाचक कीन्हे ॥ सिङ्घासन पर त्रिभुअन
    साई। देखि सुरन्ह दुन्दुभीं बजाईम् ॥ छं नभ दुन्दुभीं बाजहिं बिपुल गन्धर्ब किन्नर गावहीं। नाचहिं अपछरा
    बृन्द परमानन्द सुर मुनि पावहीम् ॥ भरतादि अनुज बिभीषनाङ्गद हनुमदादि समेत ते। गहें छत्र चामर ब्यजन धनु
    असि चर्म सक्ति बिराजते ॥ ॥ श्री सहित दिनकर बंस बूषन काम बहु छबि सोही। नव अम्बुधर बर गात अम्बर पीत
    सुर मन मोही ॥ मुकुटाङ्गदादि बिचित्र भूषन अङ्ग अङ्गन्हि प्रति सजे। अम्भोज नयन बिसाल उर भुज धन्य नर
    निरखन्ति जे ॥ वह सोभा समाज सुख कहत न बनि खगेस। बरनहिं सारद सेष श्रुति सो रस जान महेस ॥ ॥ भिन्न भिन्न
    अस्तुति करि गे सुर निज निज धाम। बन्दी बेष बेद तब आए जहँ श्रीराम ॥ ॥ प्रभु सर्बग्य कीन्ह अति आदर कृपानिधान।
    लखेउ न काहूँ मरम कछु लगे करन गुन गान ॥ जय सगुन निर्गुन रूप अनूप भूप सिरोमने। दसकन्धरादि प्रचण्ड निसिचर
    प्रबल खल भुज बल हने ॥ अवतार नर संसार भार बिभञ्जि दारुन दुख दहे। जय प्रनतपाल दयाल प्रभु सञ्जुक्त सक्ति
    नमामहे ॥ ॥ तव बिषम माया बस सुरासुर नाग नर अग जग हरे। भव पन्थ भ्रमत अमित दिवस निसि काल कर्म गुननि भरे
    ॥ जे नाथ करि करुना बिलोके त्रिबिधि दुख ते निर्बहे। भव खेद छेदन दच्छ हम कहुँ रच्छ राम नमामहे ॥ ॥ जे
    ग्यान मान बिमत्त तव भव हरनि भक्ति न आदरी। ते पाइ सुर दुर्लभ पदादपि परत हम देखत हरी ॥ बिस्वास करि सब
    आस परिहरि दास तव जे होइ रहे। जपि नाम तव बिनु श्रम तरहिं भव नाथ सो समरामहे ॥ ॥ जे चरन सिव अज पूज्य
    रज सुभ परसि मुनिपतिनी तरी। नख निर्गता मुनि बन्दिता त्रेलोक पावनि सुरसरी ॥ ध्वज कुलिस अङ्कुस कञ्ज जुत
    बन फिरत कण्टक किन लहे। पद कञ्ज द्वन्द मुकुन्द राम रमेस नित्य भजामहे ॥ ॥ अब्यक्तमूलमनादि तरु त्वच चारि
    निगमागम भने। षट कन्ध साखा पञ्च बीस अनेक पर्न सुमन घने ॥ फल जुगल बिधि कटु मधुर बेलि अकेलि जेहि आश्रित
    रहे। पल्लवत फूलत नवल नित संसार बिटप नमामहे ॥ ॥ जे ब्रह्म अजमद्वैतमनुभवगम्य मनपर ध्यावहीं। ते कहहुँ
    जानहुँ नाथ हम तव सगुन जस नित गावहीम् ॥ करुनायतन प्रभु सदगुनाकर देव यह बर मागहीं। मन बचन कर्म बिकार
    तजि तव चरन हम अनुरागहीम् ॥ सब के देखत बेदन्ह बिनती कीन्हि उदार। अन्तर्धान भे पुनि गे ब्रह्म आगार ॥
    ॥ बैनतेय सुनु सम्भु तब आए जहँ रघुबीर। बिनय करत गदगद गिरा पूरित पुलक सरीर ॥ जय राम रमारमनं समनं। भव
    ताप भयाकुल पाहि जनम् ॥ अवधेस सुरेस रमेस बिभो। सरनागत मागत पाहि प्रभो ॥ ॥ दससीस बिनासन बीस भुजा। कृत
    दूरि महा महि भूरि रुजा ॥ रजनीचर बृन्द पतङ्ग रहे। सर पावक तेज प्रचण्ड दहे ॥ ॥ महि मण्डल मण्डन चारुतरं।
    धृत सायक चाप निषङ्ग बरम् ॥ मद मोह महा ममता रजनी। तम पुञ्ज दिवाकर तेज अनी ॥ ॥ मनजात किरात निपात किए।
    मृग लोग कुभोग सरेन हिए ॥ हति नाथ अनाथनि पाहि हरे। बिषया बन पावँर भूलि परे ॥ ॥ बहु रोग बियोगन्हि लोग
    हे। भवदङ्घ्रि निरादर के फल ए ॥ भव सिन्धु अगाध परे नर ते। पद पङ्कज प्रेम न जे करते ॥ ॥ अति दीन मलीन
    दुखी नितहीं। जिन्ह के पद पङ्कज प्रीति नहीम् ॥ अवलम्ब भवन्त कथा जिन्ह के ॥ प्रिय सन्त अनन्त सदा तिन्ह
    केम् ॥ ॥ नहिं राग न लोभ न मान मदा ॥ तिन्ह कें सम बैभव वा बिपदा ॥ एहि ते तव सेवक होत मुदा। मुनि त्यागत
    जोग भरोस सदा ॥ ॥ करि प्रेम निरन्तर नेम लिएँ। पद पङ्कज सेवत सुद्ध हिएँ ॥ सम मानि निरादर आदरही। सब सन्त
    सुखी बिचरन्ति मही ॥ ॥ मुनि मानस पङ्कज भृङ्ग भजे। रघुबीर महा रनधीर अजे ॥ तव नाम जपामि नमामि हरी। भव
    रोग महागद मान अरी ॥ ॥ गुन सील कृपा परमायतनं। प्रनमामि निरन्तर श्रीरमनम् ॥ रघुनन्द निकन्दय द्वन्द्वघनं।
    महिपाल बिलोकय दीन जनम् ॥ बार बार बर मागुँ हरषि देहु श्रीरङ्ग। पद सरोज अनपायनी भगति सदा सतसङ्ग ॥ ॥
    बरनि उमापति राम गुन हरषि गे कैलास। तब प्रभु कपिन्ह दिवाए सब बिधि सुखप्रद बास ॥ ॥ सुनु खगपति यह कथा
    पावनी। त्रिबिध ताप भव भय दावनी ॥ महाराज कर सुभ अभिषेका। सुनत लहहिं नर बिरति बिबेका ॥ जे सकाम नर सुनहिं
    जे गावहिं। सुख सम्पति नाना बिधि पावहिम् ॥ सुर दुर्लभ सुख करि जग माहीं। अन्तकाल रघुपति पुर जाहीम् ॥
    सुनहिं बिमुक्त बिरत अरु बिषी। लहहिं भगति गति सम्पति नी ॥ खगपति राम कथा मैं बरनी। स्वमति बिलास त्रास
    दुख हरनी ॥ बिरति बिबेक भगति दृढ़ करनी। मोह नदी कहँ सुन्दर तरनी ॥ नित नव मङ्गल कौसलपुरी। हरषित रहहिं
    लोग सब कुरी ॥ नित नि प्रीति राम पद पङ्कज। सबकें जिन्हहि नमत सिव मुनि अज ॥ मङ्गन बहु प्रकार पहिराए।
    द्विजन्ह दान नाना बिधि पाए ॥ दो ब्रह्मानन्द मगन कपि सब कें प्रभु पद प्रीति। जात न जाने दिवस तिन्ह
    गे मास षट बीति ॥ ॥ बिसरे गृह सपनेहुँ सुधि नाहीं। जिमि परद्रोह सन्त मन माही ॥ तब रघुपति सब सखा बोलाए।
    आइ सबन्हि सादर सिरु नाए ॥ परम प्रीति समीप बैठारे। भगत सुखद मृदु बचन उचारे ॥ तुम्ह अति कीन्ह मोरि सेवकाई।
    मुख पर केहि बिधि करौं बड़आई ॥ ताते मोहि तुम्ह अति प्रिय लागे। मम हित लागि भवन सुख त्यागे ॥ अनुज राज
    सम्पति बैदेही। देह गेह परिवार सनेही ॥ सब मम प्रिय नहिं तुम्हहि समाना। मृषा न कहुँ मोर यह बाना ॥ सब
    के प्रिय सेवक यह नीती। मोरें अधिक दास पर प्रीती ॥ दो अब गृह जाहु सखा सब भजेहु मोहि दृढ़ नेम। सदा सर्बगत
    सर्बहित जानि करेहु अति प्रेम ॥ ॥ सुनि प्रभु बचन मगन सब भे। को हम कहाँ बिसरि तन गे ॥ एकटक रहे जोरि
    कर आगे। सकहिं न कछु कहि अति अनुरागे ॥ परम प्रेम तिन्ह कर प्रभु देखा। कहा बिबिध बिधि ग्यान बिसेषा ॥
    प्रभु सन्मुख कछु कहन न पारहिं। पुनि पुनि चरन सरोज निहारहिम् ॥ तब प्रभु भूषन बसन मगाए। नाना रङ्ग अनूप
    सुहाए ॥ सुग्रीवहि प्रथमहिं पहिराए। बसन भरत निज हाथ बनाए ॥ प्रभु प्रेरित लछिमन पहिराए। लङ्कापति रघुपति
    मन भाए ॥ अङ्गद बैठ रहा नहिं डोला। प्रीति देखि प्रभु ताहि न बोला ॥ दो जामवन्त नीलादि सब पहिराए रघुनाथ।
    हियँ धरि राम रूप सब चले नाइ पद माथ ॥ ॥ तब अङ्गद उठि नाइ सिरु सजल नयन कर जोरि। अति बिनीत बोलेउ बचन
    मनहुँ प्रेम रस बोरि ॥ ॥ सुनु सर्बग्य कृपा सुख सिन्धो। दीन दयाकर आरत बन्धो ॥ मरती बेर नाथ मोहि बाली।
    गयु तुम्हारेहि कोञ्छें घाली ॥ असरन सरन बिरदु सम्भारी। मोहि जनि तजहु भगत हितकारी ॥ मोरें तुम्ह प्रभु
    गुर पितु माता। जाउँ कहाँ तजि पद जलजाता ॥ तुम्हहि बिचारि कहहु नरनाहा। प्रभु तजि भवन काज मम काहा ॥ बालक
    ग्यान बुद्धि बल हीना। राखहु सरन नाथ जन दीना ॥ नीचि टहल गृह कै सब करिहुँ। पद पङ्कज बिलोकि भव तरिहुँ
    ॥ अस कहि चरन परेउ प्रभु पाही। अब जनि नाथ कहहु गृह जाही ॥ दो अङ्गद बचन बिनीत सुनि रघुपति करुना सींव।
    प्रभु उठाइ उर लायु सजल नयन राजीव ॥ ॥ निज उर माल बसन मनि बालितनय पहिराइ। बिदा कीन्हि भगवान तब बहु प्रकार
    समुझाइ ॥ ॥ भरत अनुज सौमित्र समेता। पठवन चले भगत कृत चेता ॥ अङ्गद हृदयँ प्रेम नहिं थोरा। फिरि फिरि
    चितव राम कीं ओरा ॥ बार बार कर दण्ड प्रनामा। मन अस रहन कहहिं मोहि रामा ॥ राम बिलोकनि बोलनि चलनी। सुमिरि
    सुमिरि सोचत हँसि मिलनी ॥ प्रभु रुख देखि बिनय बहु भाषी। चलेउ हृदयँ पद पङ्कज राखी ॥ अति आदर सब कपि पहुँचाए।
    भाइन्ह सहित भरत पुनि आए ॥ तब सुग्रीव चरन गहि नाना। भाँति बिनय कीन्हे हनुमाना ॥ दिन दस करि रघुपति पद
    सेवा। पुनि तव चरन देखिहुँ देवा ॥ पुन्य पुञ्ज तुम्ह पवनकुमारा। सेवहु जाइ कृपा आगारा ॥ अस कहि कपि सब
    चले तुरन्ता। अङ्गद कहि सुनहु हनुमन्ता ॥ दो कहेहु दण्डवत प्रभु सैं तुम्हहि कहुँ कर जोरि। बार बार रघुनायकहि
    सुरति कराएहु मोरि ॥ ॥ अस कहि चलेउ बालिसुत फिरि आयु हनुमन्त। तासु प्रीति प्रभु सन कहि मगन भे भगवन्त
    ॥ ॥ कुलिसहु चाहि कठोर अति कोमल कुसुमहु चाहि। चित्त खगेस राम कर समुझि परि कहु काहि ॥ ॥ पुनि कृपाल लियो
    बोलि निषादा। दीन्हे भूषन बसन प्रसादा ॥ जाहु भवन मम सुमिरन करेहू। मन क्रम बचन धर्म अनुसरेहू ॥ तुम्ह
    मम सखा भरत सम भ्राता। सदा रहेहु पुर आवत जाता ॥ बचन सुनत उपजा सुख भारी। परेउ चरन भरि लोचन बारी ॥ चरन
    नलिन उर धरि गृह आवा। प्रभु सुभाउ परिजनन्हि सुनावा ॥ रघुपति चरित देखि पुरबासी। पुनि पुनि कहहिं धन्य
    सुखरासी ॥ राम राज बैण्ठें त्रेलोका। हरषित भे गे सब सोका ॥ बयरु न कर काहू सन कोई। राम प्रताप बिषमता
    खोई ॥ दो बरनाश्रम निज निज धरम बनिरत बेद पथ लोग। चलहिं सदा पावहिं सुखहि नहिं भय सोक न रोग ॥ ॥ दैहिक
