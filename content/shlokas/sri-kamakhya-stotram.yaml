id: sri-kamakhya-stotram
category: stotram
name:
  english: Sri Kamakhya Stotram
content:
  english: jaya kameshi camunde jaya bhutapaharini | jaya sarvagate devi kameshvari namo'stu te || ||
    vishvamurte shubhe shuddhe virupakshi trilocane | bhimarupe shive vidye kameshvari namo'stu te ||
    || malajaye jaye jambhe bhutakshi kshubhite'kshaye | mahamaye maheshani kameshvari namo'stu te ||
    || bhimakshi bhishane devi sarvabhutakshayankari | kali ca vikarali ca kameshvari namo'stu te || ||
    kali karalavikrante kameshvari harapriye | sarvashastrasarabhute kameshvari namo'stu te || || kamarupapradipe
    ca nilakutanivasini | nishumbhashumbhamathani kameshvari namo'stu te || || kamakhye kamarupasthe kameshvari
    haripriye | kamanam dehi me nityam kameshvari namo'stu te || || vapanadhyamahavaktre tatha tribhuvaneshvari
    | mahishasuravadhe devi kameshvari namo'stu te || || chagatushte mahabhime kamakhye suravandite |
    jaya kamaprade tushte kameshvari namo'stu te || || bhrashtarajyo yada raja navamyam niyatah shucih
    | ashtamyam ca caturdashyamupavasi narottamah || || samvatsarena labhate rajyam nishkantakam punah
    | ya idam shrinuyadbhaktya tava devi samudbhavam | sarvapapavinirmuktah param nirvanamricchati ||
    || shrikamarupeshvari bhaskaraprabheprakashitambhojanibhayatanane | surarirakshahstutipatanotsuketrayimaye
    devanute namami || || sitasite raktapishangavigraherupani yasyah pratibhanti tani | vikararupa ca
    vikalpitanishubhashubhanamapi tam namami || || kamarupasamudbhute kamapithavatamsake | vishvadhare
    mahamaye kameshvari namo'stu te || || avyaktavigrahe shante santate kamarupini | kalagamye pare shante
    kameshvari namo'stu te || || ya sushumnantaralastha cintyate jyotirupini | pranato'smi param viram
    kameshvari namo'stu te || || damshtrakaralavadane mundamalopashobhite | sarvatah sarvage devi kameshvari
    namo'stu te || || camunde ca mahakali kali kapalaharini | pashahaste dandahaste kameshvari namo'stu
    te || || camunde kulamalasye tikshnadamshtre mahabale | shavayanasthite devi kameshvari namo'stu te
    || || iti shri kamakhya stotram |
  devanagari: जय कामेशि चामुण्डे जय भूतापहारिणि । जय सर्वगते देवि कामेश्वरि नमोऽस्तु ते ॥ ॥ विश्वमूर्ते
    शुभे शुद्धे विरूपाक्षि त्रिलोचने । भीमरूपे शिवे विद्ये कामेश्वरि नमोऽस्तु ते ॥ ॥ मालाजये जये जम्भे
    भूताक्षि क्षुभितेऽक्षये । महामाये महेशानि कामेश्वरि नमोऽस्तु ते ॥ ॥ भीमाक्षि भीषणे देवि सर्वभूतक्षयङ्करि
    । कालि च विकरालि च कामेश्वरि नमोऽस्तु ते ॥ ॥ कालि करालविक्रान्ते कामेश्वरि हरप्रिये । सर्वशास्त्रसारभूते
    कामेश्वरि नमोऽस्तु ते ॥ ॥ कामरूपप्रदीपे च नीलकूटनिवासिनि । निशुम्भशुम्भमथनि कामेश्वरि नमोऽस्तु ते
    ॥ ॥ कामाख्ये कामरूपस्थे कामेश्वरि हरिप्रिये । कामनां देहि मे नित्यं कामेश्वरि नमोऽस्तु ते ॥ ॥ वपानाढ्यमहावक्त्रे
    तथा त्रिभुवनेश्वरि । महिषासुरवधे देवि कामेश्वरि नमोऽस्तु ते ॥ ॥ छागतुष्टे महाभीमे कामाख्ये सुरवन्दिते
    । जय कामप्रदे तुष्टे कामेश्वरि नमोऽस्तु ते ॥ ॥ भ्रष्टराज्यो यदा राजा नवम्यां नियतः शुचिः । अष्टम्यां
    च चतुर्दश्यामुपवासी नरोत्तमः ॥ ॥ संवत्सरेण लभते राज्यं निष्कण्टकं पुनः । य इदं शृणुयाद्भक्त्या तव
    देवि समुद्भवम् । सर्वपापविनिर्मुक्तः परं निर्वाणमृच्छति ॥ ॥ श्रीकामरूपेश्वरि भास्करप्रभेप्रकाशिताम्भोजनिभायतानने
    । सुरारिरक्षःस्तुतिपातनोत्सुकेत्रयीमये देवनुते नमामि ॥ ॥ सितासिते रक्तपिशङ्गविग्रहेरूपाणि यस्याः प्रतिभान्ति
    तानि । विकाररूपा च विकल्पितानिशुभाशुभानामपि तां नमामि ॥ ॥ कामरूपसमुद्भूते कामपीठावतंसके । विश्वाधारे
    महामाये कामेश्वरि नमोऽस्तु ते ॥ ॥ अव्यक्तविग्रहे शान्ते सन्तते कामरूपिणि । कालगम्ये परे शान्ते कामेश्वरि
    नमोऽस्तु ते ॥ ॥ या सुषुम्नान्तरालस्था चिन्त्यते ज्योतिरूपिणी । प्रणतोऽस्मि परां वीरां कामेश्वरि नमोऽस्तु
    ते ॥ ॥ दंष्ट्राकरालवदने मुण्डमालोपशोभिते । सर्वतः सर्वगे देवि कामेश्वरि नमोऽस्तु ते ॥ ॥ चामुण्डे च
    महाकालि कालि कपालहारिणी । पाशहस्ते दण्डहस्ते कामेश्वरि नमोऽस्तु ते ॥ ॥ चामुण्डे कुलमालास्ये तीक्ष्णदंष्ट्रे
    महाबले । शवयानस्थिते देवि कामेश्वरि नमोऽस्तु ते ॥ ॥ इति श्री कामाख्या स्तोत्रम् ।
