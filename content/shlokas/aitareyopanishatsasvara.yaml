id: aitareyopanishatsasvara
category: upanishad
name:
  english: aitareyopanishatsasvara
  devanagari: ऐतरेयोपनिषत्सस्वरा
content:
  english: se bha̱vatah || 5|| || iti dvitiya khanda || atha tritiyah khandah sa ikshateme nu lokashca
    lokapalashcannamebhyah sri̭ja i̱ti || 1|| so'pobhya̭tapattabhyo'bhitaptabhyo murtira̭jaya̱ta yo vai
    sa murtirajayata'nnam vai̱ tat || 2|| tadetadabhisrishtam paranatyajighamsattadva̱ca jighrikshatta̱nna
    shaknodva̱ca gra̭hitum | sa yaddhainadva̱ca'grahaishyada̱bhivyahritya hai̱vanna̭matra̱psyat || 3||
    tatpra̱nenajighrikshatta̱nnashaknot pra̱nena gra̭hitum | sa yaddhainatpra̱nenagra̭haishyada̱bhipranya
    hai̱vanna̭matra̱psyat || 4|| tacca̱kshusha'jighrikshatta̱nnashaknocca̱kshusha gra̭hitum | sa yaddhainacca̱kshusha'gra̭haishyad
    dri̱shtva haivanna̭matra̱psyat || 5|| tacchro̱trenajighrikshatta̱nnashaknocchro̱trena gra̭hitum |
    sa yaddhaina̱cchrotrenagrahaishyacchru̱tva hai̱vanna̭matra̱psyat || 6|| tattva̱ca'jighrikshatta̱nnashaknot
    tva̱ca gra̭hitum | sa yaddhainatva̱ca'grahaishyatspri̱shtva hai̱vanna̭matra̱psyat || 7|| tanma̱nasa'jighrikshattannashaknonma̱nasa
    gra̭hitum | sa yaddhainanma̱nasa'grahaishyaddhaya̱tva hai̱vanna̭matra̱psyat || 8|| tacchi̱shnenajighrikshatta̱nnashaknocchi̱shnena
    gra̭hitum | sa yaddhainacchi̱shnenagrahaishyadvi̱srijya hai̱vanna̭matrapsyat || 9|| tada̱panenajighrikshatta̱davayat
    | sa esho'nnasya graho yadvayurannamayurva e̱sha ya̱dvayuh || 10|| sa ikshata katham nvidam madrite
    syadi̱ti sa ikshata katarena prapadya i̱ti | sa ikshata yadi va̱ca'bhivyahritam yadi pra̱nenabhipranitam
    yadi ca̱kshusha dri̱shtam yadi shro̱trena shru̱tam yadi tva̱ca spri̱shtam yadi ma̱nasa dhya̱tam yadya̱panenabhyapanitam
    yadi shi̱shnena visrishtamatha ko
  devanagari: से भ॒वतः ॥ ५॥ ॥ इति द्वितीय खण्ड ॥ अथ तृतीयः खण्डः स ईक्षतेमे नु लोकाश्च लोकपालाश्चान्नमेभ्यः
    सृ॑जा इ॒ति ॥ १॥ सोऽपोभ्य॑तपत्ताभ्योऽभितप्ताभ्यो मूर्तिर॑जाय॒त यो वै सा मूर्तिरजायताऽन्नं वै॒ तत् ॥
    २॥ तदेतदभिसृष्टं पराङत्यजिघांसत्तद्वा॒चा जिघृक्षत्त॒न्ना शक्नोद्वा॒चा ग्र॑हीतुम् । स यद्धैनद्वा॒चाऽग्रहैष्यद॒भिव्याहृत्य
    है॒वान्न॑मत्र॒प्स्यत् ॥ ३॥ तत्प्रा॒णेनाजिघृक्षत्त॒न्नाशक्नोत् प्रा॒णेन ग्र॑हीतुम् । स यद्धैनत्प्रा॒णेनाग्र॑हैष्यद॒भिप्राण्य
    है॒वान्न॑मत्र॒प्स्यत् ॥ ४॥ तच्च॒क्षुषाऽजिघृक्षत्त॒न्नाशक्नोच्च॒क्षुषा ग्र॑हीतुम् । स यद्धैनच्च॒क्षुषाऽग्र॑हैष्यद्
    दृ॒ष्ट्वा हैवान्न॑मत्र॒प्स्यत् ॥ ५॥ तच्छ्रो॒त्रेणाजिघृक्षत्त॒न्नाशक्नोच्छ्रो॒त्रेण ग्र॑हीतुम् । स
    यद्धैन॒च्छ्रोत्रेणाग्रहैष्यच्छ्रु॒त्वा है॒वान्न॑मत्र॒प्स्यत् ॥ ६॥ तत्त्व॒चाऽजिघृक्षत्त॒न्नाशक्नोत्
    त्व॒चा ग्र॑हीतुम् । स यद्धैनत्व॒चाऽग्रहैष्यत्स्पृ॒ष्ट्वा है॒वान्न॑मत्र॒प्स्यत् ॥ ७॥ तन्म॒नसाऽजिघृक्षत्तन्नाशक्नोन्म॒नसा
    ग्र॑हीतुम् । स यद्धैनन्म॒नसाऽग्रहैष्यद्धया॒त्वा है॒वान्न॑मत्र॒प्स्यत् ॥ ८॥ तच्छि॒श्नेनाजिघृक्षत्त॒न्नाशक्नोच्छि॒श्नेन
    ग्र॑हीतुम् । स यद्धैनच्छि॒श्नेनाग्रहैष्यद्वि॒सृज्य है॒वान्न॑मत्रप्स्यत् ॥ ९॥ तद॒पानेनाजिघृक्षत्त॒दावयत्
    । स एषोऽन्नस्य ग्रहो यद्वायुरन्नमायुर्वा ए॒ष य॒द्वायुः ॥ १०॥ स ईक्षत कथं न्विदं मदृते स्यादि॒ति स
    ईक्षत कतरेण प्रपद्या इ॒ति । स ईक्षत यदि वा॒चाऽभिव्याहृतं यदि प्रा॒णेनाभिप्राणितं यदि च॒क्षुषा दृ॒ष्टं
    यदि श्रो॒त्रेण श्रु॒तं यदि त्व॒चा स्पृ॒ष्टं यदि म॒नसा ध्या॒तं यद्य॒पानेनाभ्यपानितं यदि शि॒श्नेन विसृष्टमथ
    को
