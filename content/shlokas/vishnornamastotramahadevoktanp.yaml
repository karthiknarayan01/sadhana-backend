id: vishnornamastotramahadevoktanp
category: stotram
name:
  english: vishnornamastotramahadevoktanP
  devanagari: विष्णोर्नामस्तोत्रमहादेवोक्तण्P
content:
  english: vishnurjishnurvibhurdevo yajnesho yajnapalakah | prabhavishnurgrasishnushca lokatma lokapalakah
    || 1|| keshavah keshiha kalpah sarvakaranakaranam | karmakrida vamanadhisho vasudevah purushtutah
    || 2|| adikarta varahashca madhavo madhusudanah | narayano naro hamso vishnuseno hutashanah || 3||
    jyotishman dyutiman shriman ayushman purushottamah | vaikunthah pundarikakshah krishnah suryah surarcitah
    || 4|| narasimho mahabhimo vajradamshtro nakhayudhah | adidevo jagatkarta yogesho garudadhvajah ||
    5|| govindo gopatirgopta bhupatirbhuvaneshvarah | padmanabho hrishikesho vibhurdamodaro harih || 6||
    trivikramastrilokesho brahmeshah pritivardhanah | vamano dushtadamano govindo gopavallabhah || 7||
    bhaktipriyo'cyutah satyah satyakirtirdhruvah shucih | karunyah karuno vyasah papaha shantivardhanah
    || 8|| samnyasi shastratattvajno mandaragiriketanah | badarinilayah shantastapasvi vaidyutaprabhah
    || 9|| bhutavaso guhavasah shrinivasah shriyah patih | tapovaso damo vasah satyavasah sanatanah ||
    10|| purushah pushkalah punyah pushkaraksho maheshvarah | purnah purtih puranajnah punyajnah punyavarddhanah
    || 11|| shankhi cakri gadi sharngi langali mushali hali | kiriti kundali hari mekhali kavaci dhvaji
    || 12|| jishnurjeta mahavirah shatrughnah shatrutapanah | shantah shantikarah shasta shankarah shamtanustutah
    || 13|| sarathih sattvikah svami samavedapriyah samah | savanah sahasi sattvah sampurnamshah samriddhiman
    || 14|| svargadah kamadah shridah kirtidah kirtinashanah | mokshadah pundarikakshah kshirabdhikritaketanah
    || 15|| stutah surasurairisha prerakah papanashanah | tvam yajnastvam vashatkarastvamomkarastvamagnayah
    || 16|| tvam svaha tvam svadha deva tvam sudha purushottama | namo devadidevaya vishnave shashvataya
    ca || 17|| anantayaprameyaya namaste garudadhvaja | markandeya uvaca ityetairnamabhirdivyaih samstuto
    madhusudanah || 18|| uvaca prakatibhutva devan sarvanidam vacah | iti | narasimhapurana adhyaya 40
    stotrasamkhya 61 shrinarasimhapurane vishnornamastotram nama catvarimsho'dhyayah || 40||
  devanagari: विष्णुर्जिष्णुर्विभुर्देवो यज्ञेशो यज्ञपालकः । प्रभविष्णुर्ग्रसिष्णुश्च लोकात्मा लोकपालकः
    ॥ १॥ केशवः केशिहा कल्पः सर्वकारणकारणम् । कर्मकृद वामनाधीशो वासुदेवः पुरुष्टुतः ॥ २॥ आदिकर्ता वराहश्च
    माधवो मधुसूदनः । नारायणो नरो हंसो विष्णुसेनो हुताशनः ॥ ३॥ ज्योतिष्मान् द्युतिमान् श्रीमान् आयुष्मान्
    पुरुषोत्तमः । वैकुण्ठः पुण्डरीकाक्षः कृष्णः सूर्यः सुरार्चितः ॥ ४॥ नरसिंहो महाभीमो वज्रदंष्ट्रो नखायुधः
    । आदिदेवो जगत्कर्ता योगेशो गरुडध्वजः ॥ ५॥ गोविन्दो गोपतिर्गोप्ता भूपतिर्भुवनेश्वरः । पद्मनाभो हृषीकेशो
    विभुर्दामोदरो हरिः ॥ ६॥ त्रिविक्रमस्त्रिलोकेशो ब्रह्मेशः प्रीतिवर्धनः । वामनो दुष्टदमनो गोविन्दो गोपवल्लभः
    ॥ ७॥ भक्तिप्रियोऽच्युतः सत्यः सत्यकीर्तिर्ध्रुवः शुचिः । कारुण्यः करुणो व्यासः पापहा शान्तिवर्धनः
    ॥ ८॥ संन्यासी शास्त्रतत्त्वज्ञो मन्दारगिरिकेतनः । बदरीनिलयः शान्तस्तपस्वी वैद्युतप्रभः ॥ ९॥ भूतावासो
    गुहावासः श्रीनिवासः श्रियः पतिः । तपोवासो दमो वासः सत्यवासः सनातनः ॥ १०॥ पुरुषः पुष्कलः पुण्यः पुष्कराक्षो
    महेश्वरः । पूर्णः पूर्तिः पुराणज्ञः पुण्यज्ञः पुण्यवर्द्धनः ॥ ११॥ शङ्खी चक्री गदी शार्ङ्गी लाङ्गली
    मुशली हली । किरीटी कुण्डली हारी मेखली कवची ध्वजी ॥ १२॥ जिष्णुर्जेता महावीरः शत्रुघ्नः शत्रुतापनः ।
    शान्तः शान्तिकरः शास्ता शङ्करः शंतनुस्तुतः ॥ १३॥ सारथिः सात्त्विकः स्वामी सामवेदप्रियः समः । सावनः
    साहसी सत्त्वः सम्पूर्णांशः समृद्धिमान् ॥ १४॥ स्वर्गदः कामदः श्रीदः कीर्तिदः कीर्तिनाशनः । मोक्षदः
    पुण्डरीकाक्षः क्षीराब्धिकृतकेतनः ॥ १५॥ स्तुतः सुरासुरैरीश प्रेरकः पापनाशनः । त्वं यज्ञस्त्वं वषट्कारस्त्वमोंकारस्त्वमग्नयः
    ॥ १६॥ त्वं स्वाहा त्वं स्वधा देव त्वं सुधा पुरुषोत्तम । नमो देवादिदेवाय विष्णवे शाश्वताय च ॥ १७॥ अनन्तायाप्रमेयाय
    नमस्ते गरुडध्वज । मार्कण्डेय उवाच इत्येतैर्नामभिर्दिव्यैः संस्तुतो मधुसूदनः ॥ १८॥ उवाच प्रकटीभूत्वा
    देवान् सर्वानिदं वचः । इति । नरसिंहपुराण अध्याय ४० स्तोत्रसंख्या ६१ श्रीनरसिंहपुराणे विष्णोर्नामस्तोत्रं
    नाम चत्वारिंशोऽध्यायः ॥ ४०॥
