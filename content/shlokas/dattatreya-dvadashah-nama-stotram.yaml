id: dattatreya-dvadashah-nama-stotram
category: stotram
name:
  english: dattatreya dvadashah nama stotram
  devanagari: दत्तात्रेय द्वादशः नाम स्तोत्रम्
content:
  english: '| vidyarthi labhate vidyam rogi rogat pramucyate| aputro labhate putram daridri labhate dhanam|
    abharyo labhate bharyam sukharthi labhate sukham| mucyate sarva papebhyo sarvatra vijayi bhavet||
    iti shri dattatreya dvadasha nama stotram sampurnam|| shri dattatreyarpanamastu||'
  devanagari: । विद्यार्थी लभते विद्यां रोगी रोगात् प्रमुच्यते। अपुत्रो लभते पुत्रं दरिद्रि लभते धनम्।
    अभार्यो लभते भार्याम् सुखार्थी लभते सुखम्। मुच्यते सर्व पापेभ्यो सर्वत्र विजयी भवेत्।। इति श्री दत्तात्रेय
    द्वादश नाम स्तोत्रम् संपूर्णम्।। श्री दत्तात्रेयार्पणमस्तु।।
meaning: {}
