id: sri-madhvacharya-kruta-dwadasha-stotra-12
category: stotram
name:
  english: Sri Madhvacharya Kruta Dwadasha Stotra - 12
content:
  english: atha dvadashastotram anandamukunda aravindanayana | anandatirtha paranandavarada || || sundarimandiragovinda
    vande | anandatirtha paranandavarada || || candrakamandiranandaka vande | anandatirtha paranandavarada
    || || candrasurendrasuvandita vande | anandatirtha paranandavarada || || mandarasunasucarcita vande
    | anandatirtha paranandavarada || || vrindara vrinda suvandita vande | anandatirtha paranandavarada
    || || indira'nandaka sundara vande | anandatirtha paranandavarada || || mandirasyandanasyandaka vande
    | anandatirtha paranandavarada || || anandacandrikasyandaka vande | anandatirtha paranandavarada ||
    || iti shrimadanandatirthabhagavatpadacarya viracitam dvadashastotreshu dvadasham stotram sampurnam
    || bharatiramanamukhyapranantargata shrikrishnarpanamastu||
  devanagari: अथ द्वादशस्तोत्रम् आनन्दमुकुन्द अरविन्दनयन । आनन्दतीर्थ परानन्दवरद ॥ ॥ सुन्दरीमन्दिरगोविन्द
    वन्दे । आनन्दतीर्थ परानन्दवरद ॥ ॥ चन्द्रकमन्दिरनन्दक वन्दे । आनन्दतीर्थ परानन्दवरद ॥ ॥ चन्द्रसुरेन्द्रसुवन्दित
    वन्दे । आनन्दतीर्थ परानन्दवरद ॥ ॥ मन्दारसूनसुचर्चित वन्दे । आनन्दतीर्थ परानन्दवरद ॥ ॥ वृन्दार वृन्द
    सुवन्दित वन्दे । आनन्दतीर्थ परानन्दवरद ॥ ॥ इन्दिराऽनन्दक सुन्दर वन्दे । आनन्दतीर्थ परानन्दवरद ॥ ॥
    मन्दिरस्यन्दनस्यन्दक वन्दे । आनन्दतीर्थ परानन्दवरद ॥ ॥ आनन्दचन्द्रिकास्यन्दक वन्दे । आनन्दतीर्थ परानन्दवरद
    ॥ ॥ इति श्रीमदानन्दतीर्थभगवत्पादाचार्य विरचितं द्वादशस्तोत्रेषु द्वादशं स्तोत्रं सम्पूर्णम् ॥ भारतीरमणमुख्यप्राणान्तर्गत
    श्रीकृष्णार्पणमस्तु॥
