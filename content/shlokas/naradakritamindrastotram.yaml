id: naradakritamindrastotram
category: stotram
name:
  english: naradakritamindrastotram
  devanagari: नारदकृतंइन्द्रस्तोत्रम्
content:
  english: naradakritam indrastotram mahasuro hatah shakra namucirdarunastvaya | shambarashca balashcaiva
    tathobhau ghoravikramau || 14|| shatakrato vivardhasva sarvanshatrunnishudaya | uttishtha vajrinsampashya
    devarshimshca samagatan || 15|| mahendra danavanhatva lokastratastvaya vibho | apam phenam samasadya
    vishnutejopabrimhitam || 16|| tvaya vritro hatah purvam devaraja jagatpate || 16|| tvam sarvabhuteshu
    varenya idya stvaya samam vidyate neha bhutam | tvaya dharyante sarvabhutani shakra tvam devanam mahimanam
    cakartha || 17|| pahi devansalokamshca mahendra balamapnuhi | evam samstuyamanashca so'vardhata shanaih
    shanaih || 18|| iti mahabharate udyogaparvani 16 adhyayantargatam naradakritam indrastotram sampurnam
    | mahabharata | udyogaparva | adhyaya 16
  devanagari: नारदकृतं इन्द्रस्तोत्रम् महासुरो हतः शक्र नमुचिर्दारुणस्त्वया । शम्बरश्च बलश्चैव तथोभौ घोरविक्रमौ
    ॥ १४॥ शतक्रतो विवर्धस्व सर्वाञ्शत्रून्निषूदय । उत्तिष्ठ वज्रिन्सम्पश्य देवर्षींश्च समागतान् ॥ १५॥
    महेन्द्र दानवान्हत्वा लोकास्त्रातास्त्वया विभो । अपां फेनं समासाद्य विष्णुतेजोपबृंहितम् ॥ १६॥ त्वया
    वृत्रो हतः पूर्वं देवराज जगत्पते ॥ १६॥ त्वं सर्वभूतेषु वरेण्य ईड्य स्त्वया समं विद्यते नेह भूतम् ।
    त्वया धार्यन्ते सर्वभूतानि शक्र त्वं देवानां महिमानं चकर्थ ॥ १७॥ पाहि देवान्सलोकांश्च महेन्द्र बलमाप्नुहि
    । एवं संस्तूयमानश्च सोऽवर्धत शनैः शनैः ॥ १८॥ इति महाभारते उद्योगपर्वणि १६ अध्यायान्तर्गतं नारदकृतं
    इन्द्रस्तोत्रं सम्पूर्णम् । महाभारत । उद्योगपर्व । अध्याय १६
