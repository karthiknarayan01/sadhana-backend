id: sree-ramaashtottara-sata-nama-stotram
category: stotram
name:
  english: Sree Ramaashtottara Sata Nama Stotram
content:
  english: '|| shri rama ashtottara shatanamastotram || shriramo ramabhadrashca ramacandrashca shashvatah
    | rajivalocanah shriman rajendro raghupungavah || || janakivallabho jaitro jitamitro janardanah |
    vishvamitrapriyo dantah sharanatranatatparah || || valipramathano vagmi satyavak satyavikramah | satyavrato
    vratadharah sada hanumadashrita || ka''usalyeyah kharadhvamsi viradhavadhapanditah | vibhishanaparitrata
    harakodandakhandanah || || saptatalaprabhetta ca dashagrivashiroharah | jamadagvyamahadarpadalanastatakantakah
    || || vedantasaro vedatma bhavarogasya bheshajam | dushanatrishirohanta trimurtistrigunatmakah ||
    || trivikramastrilokatma punyacaritrakirtanah | trilokarakshako dhanvi dandakaranyakarshanah || ||
    ahalyashapashamanah pitribhakto varapradah | jitendriyo jitakrodho jitavadyo jagadguruh || || rikshavanarasanghati
    citrakutasamashrayah | jayantatranavaradah sumitraputrasevitah || || sarvadevadhidevashcamritavanarajivanah
    | mayamaricahanta ca mahadevo mahabhujah || || sarvadevastutah sa''umyo brahmanyo munisamstutah |
    mahayogi mahodarah sugrivepsitarajyadah || || sarvapunyadhikaphalah smritasarvaghanashanah | adipurushah
    paramapurusho mahapurusha eva ca || || punyodayo dayasarah puranapurushottamah | smitavaktro mitabhashi
    purvabhashi ca raghavah || || anantagunagambhiro dhirodattagunottamah | mayamanushacaritro mahadevadipujitah
    || || setukrijjitavarashih sarvatirthamayo harih | shyamangah sundarah shurah pitavasa dhanurdharah
    || || sarvayajnadhipo yajva jaramaranavarjitah | vibhishanapratishthata sarvapagunavarjitah || ||
    paramatma param brahma saccidanandavigrahah | paranjyotih parandhama parakashah paratparah | pareshah
    paragah parah sarvadevatmakah parah || || shriramashtottarashatam bhavatapanivarakam | sampatkaram
    trisandhyasu pathatam bhaktipurvakam || || ramaya ramabhadraya ramacandraya vedhase | raghunathaya
    nathaya sitayahpataye namah || || || iti shriskandapuṟane shrirama ashtottara shatanamastotram ||'
  devanagari: ॥ श्री राम अष्टोत्तर शतनामस्तोत्रम् ॥ श्रीरामो रामभद्रश्च रामचन्द्रश्च शाश्वतः । राजीवलोचनः
    श्रीमान् राजेन्द्रो रघुपुङ्गवः ॥ ॥ जानकीवल्लभो जैत्रो जितामित्रो जनार्दनः । विश्वामित्रप्रियो दान्तः
    शरणत्राणतत्परः ॥ ॥ वालिप्रमथनो वाग्मी सत्यवाक् सत्यविक्रमः । सत्यव्रतो व्रतधरः सदा हनुमदाश्रित ॥ कऽउसल्येयः
    खरध्वंसी विराधवधपण्डितः । विभीषणपरित्राता हरकोदण्डखण्डनः ॥ ॥ सप्ततालप्रभेत्ता च दशग्रीवशिरोहरः । जामदग्व्यमहादर्पदलनस्ताटकान्तकः
    ॥ ॥ वेदान्तसारो वेदात्मा भवरोगस्य भेषजम् । दूषणत्रिशिरोहन्ता त्रिमूर्तिस्त्रिगुणात्मकः ॥ ॥ त्रिविक्रमस्त्रिलोकात्मा
    पुण्यचारित्रकीर्तनः । त्रिलोकरक्षको धन्वी दण्डकारण्यकर्षणः ॥ ॥ अहल्याशापशमनः पितृभक्तो वरप्रदः । जितेन्द्रियो
    जितक्रोधो जितावद्यो जगद्गुरुः ॥ ॥ ऋक्षवानरसङ्घाती चित्रकूटसमाश्रयः । जयन्तत्राणवरदः सुमित्रापुत्रसेवितः
    ॥ ॥ सर्वदेवाधिदेवश्चमृतवानरजीवनः । मायामारीचहन्ता च महादेवो महाभुजः ॥ ॥ सर्वदेवस्तुतः सऽउम्यो ब्रह्मण्यो
    मुनिसंस्तुतः । महायोगी महोदारः सुग्रीवेप्सितराज्यदः ॥ ॥ सर्वपुण्याधिकफलः स्मृतसर्वाघनाशनः । आदिपुरुषः
    परमपुरुषो महापुरुष एव च ॥ ॥ पुण्योदयो दयासारः पुराणपुरुषोत्तमः । स्मितवक्त्रो मिताभाषी पूर्वभाषी च
    राघवः ॥ ॥ अनन्तगुणगम्भीरो धीरोदात्तगुणोत्तमः । मायामानुषचारित्रो महादेवादिपूजितः ॥ ॥ सेतुकृज्जितवाराशिः
    सर्वतीर्थमयो हरिः । श्यामाङ्गः सुन्दरः शूरः पीतवासा धनुर्धरः ॥ ॥ सर्वयज्ञाधिपो यज्वा जरामरणवर्जितः
    । विभीषणप्रतिष्ठाता सर्वापगुणवर्जितः ॥ ॥ परमात्मा परं ब्रह्म सच्चिदानन्दविग्रहः । परञ्ज्योतिः परन्धाम
    पराकाशः परात्परः । परेशः पारगः पारः सर्वदेवात्मकः परः ॥ ॥ श्रीरामाष्टोत्तरशतं भवतापनिवारकम् । सम्पत्करं
    त्रिसन्ध्यासु पठतां भक्तिपूर्वकम् ॥ ॥ रामाय रामभद्राय रामचन्द्राय वेधसे । रघुनाथाय नाथाय सीतायाःपतये
    नमः ॥ ॥ ॥ इति श्रीस्कन्दपुऱाणे श्रीराम अष्टोत्तर शतनामस्तोत्रम् ॥
