id: daridrya-dahana-shiva-stotram
category: stotram
name:
  english: Daridrya Dahana Shiva Stotram
content:
  english: vishveshvaraya narakarnava taranaya karnamritaya shashishekhara dharanaya | karpurakanti dhavalaya
    jatadharaya daridryaduhkha dahanaya namashshivaya || || gauripriyaya rajanisha kaladharaya kalantakaya
    bhujagadhipa kankanaya | gangadharaya gajaraja vimardhanaya daridryaduhkha dahanaya namashshivaya
    || bhavaroga bhayapahaya ugraya duhkha bhavasagara taranaya | jyotirmayaya gunanama sunrityakaya daridryaduhkha
    dahanaya namashshivaya || || carmambaraya shavabhasma vilepanaya phalekshanaya manikundala manditaya
    | manjirapadayugalaya jatadharaya daridryaduhkha dahanaya namashshivaya || || pancananaya phaniraja
    vibhushanaya hemankushaya bhuvanatraya manditaya ananda bhumi varadaya tamopayaya | daridryaduhkha
    dahanaya namashshivaya || || bhanupriyaya bhavasagara taranaya kalantakaya kamalasana pujitaya | netratrayaya
    shubhalakshana lakshitaya daridryaduhkha dahanaya namashshivaya || || ramapriyaya raghunatha varapradaya
    nagapriyaya narakarnava taranaya | punyaya punyabharitaya surarcitaya daridryaduhkha dahanaya namashshivaya
    || || mukteshvaraya phaladaya ganeshvaraya gitapriyaya vrishabheshvara vahanaya | matangacarma vasanaya
    maheshvaraya daridryaduhkha dahanaya namashshivaya || || vasishthena kritam stotram sarvaroga nivaranam
    | sarvasampatkaram shighram putrapautradi vardhanam | shubhadam kamadam hridyam dhanadhanya pravardhanam
    trisandhyam yah pathennityam sa hi svarga mavapnuyat || || || iti shri vasishtha viracitam daridryadahana
    shivastotram sampurnam || gaurivilasa bhuvanaya maheshvaraya pancananaya sharanagata kalpadaya | sharvaya
    sarvajagatamadhipaya tasmai daridrya duhkhadahanaya namah shivaya ||
  devanagari: विश्वेश्वराय नरकार्णव तारणाय कर्णामृताय शशिशेखर धारणाय । कर्पूरकान्ति धवलाय जटाधराय दारिद्र्यदुःख
    दहनाय नमश्शिवाय ॥ ॥ गौरीप्रियाय रजनीश कलाधराय कालान्तकाय भुजगाधिप कङ्कणाय । गङ्गाधराय गजराज विमर्धनाय
    दारिद्र्यदुःख दहनाय नमश्शिवाय ॥ भवरोग भयापहाय उग्राय दुःख भवसागर तारणाय । ज्योतिर्मयाय गुणनाम सुनृत्यकाय
    दारिद्र्यदुःख दहनाय नमश्शिवाय ॥ ॥ चर्माम्बराय शवभस्म विलेपनाय फालेक्षणाय मणिकुण्डल मण्डिताय । मञ्जीरपादयुगलाय
    जटाधराय दारिद्र्यदुःख दहनाय नमश्शिवाय ॥ ॥ पञ्चाननाय फणिराज विभूषणाय हेमाङ्कुशाय भुवनत्रय मण्डिताय
    आनन्द भूमि वरदाय तमोपयाय । दारिद्र्यदुःख दहनाय नमश्शिवाय ॥ ॥ भानुप्रियाय भवसागर तारणाय कालान्तकाय
    कमलासन पूजिताय । नेत्रत्रयाय शुभलक्षण लक्षिताय दारिद्र्यदुःख दहनाय नमश्शिवाय ॥ ॥ रामप्रियाय रघुनाथ
    वरप्रदाय नागप्रियाय नरकार्णव तारणाय । पुण्याय पुण्यभरिताय सुरार्चिताय दारिद्र्यदुःख दहनाय नमश्शिवाय
    ॥ ॥ मुक्तेश्वराय फलदाय गणेश्वराय गीताप्रियाय वृषभेश्वर वाहनाय । मातङ्गचर्म वसनाय महेश्वराय दारिद्र्यदुःख
    दहनाय नमश्शिवाय ॥ ॥ वसिष्ठेन कृतं स्तोत्रं सर्वरोग निवारणम् । सर्वसम्पत्करं शीघ्रं पुत्रपौत्रादि वर्धनम्
    । शुभदं कामदं हृद्यं धनधान्य प्रवर्धनम् त्रिसन्ध्यं यः पठेन्नित्यं स हि स्वर्ग मवाप्नुयात् ॥ ॥ ॥ इति
    श्री वसिष्ठ विरचितं दारिद्र्यदहन शिवस्तोत्रं सम्पूर्णम् ॥ गौरीविलास भुवनाय महेश्वराय पञ्चाननाय शरणागत
    कल्पदाय । शर्वाय सर्वजगतामधिपाय तस्मै दारिद्र्य दुःखदहनाय नमः शिवाय ॥
