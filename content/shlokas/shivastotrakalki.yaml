id: shivastotrakalki
category: stotram
name:
  english: shivastotrakalki
  devanagari: शिवस्तोत्रकल्कि
content:
  english: shrishivastotram kalkikritam shriganeshaya namah | gaurinatham vishvanatham sharanyam bhutavasam
    vasukikanthabhusham | tryaksham pancasyadidevam puranam vande sandranandasandohadaksham || 1|| yogadhisham
    kamanasham karalam gangasangaklinnamurdhanamisham | jatajutatoparikshiptabhavam mahakalam candrabhalam
    namami || 2|| shmashanastham bhutavetalasangam nanashastraih sangashuladibhishca | vyagratyugra bahavo
    lokanashe yasya krodhodbhutaloko'stameti || 3|| yo bhutadih pancabhutaih sisrikshustanmatratma kalakarmasvabhavaih
    | prahrityedam prapya jivatvamisho brahmanande kridate tam namami || 4|| sthitau vishnuh sarvajishnuh
    suratma lokansadhun dharmasetunbibharti | brahmadyamshe yo'bhimani gunatma shabdadyangaistam paresham
    namami || 5|| yasyajnaya vayavo vanti loke jvalatyagnih savita yati tapyan | shitamshuh khe tarakasamgrahashca
    pravartante tam paresham prapadye || 6|| yasya shvasatsarvadhatri dharitri devo varshatyambukalah
    pramata | merurmadhye bhuvananam ca bharta tamishanam vishvarupam namami || 7|| iti shrikalkipurane
    kalkikritam shivastotram sampurnam |
  devanagari: श्रीशिवस्तोत्रं कल्किकृतम् श्रीगणेशाय नमः । गौरीनाथं विश्वनाथं शरण्यं भूतावासं वासुकीकण्ठभूषम्
    । त्र्यक्षं पञ्चास्यादिदेवं पुराणं वन्दे सान्द्रानन्दसन्दोहदक्षम् ॥ १॥ योगाधीशं कामनाशं करालं गङ्गासङ्गक्लिन्नमूर्धानमीशम्
    । जटाजूटाटोपरिक्षिप्तभावं महाकालं चन्द्रभालं नमामि ॥ २॥ श्मशानस्थं भूतवेतालसङ्गं नानाशस्त्रैः सङ्गशूलादिभिश्च
    । व्यग्रात्युग्रा बाहवो लोकनाशे यस्य क्रोधोद्भूतलोकोऽस्तमेति ॥ ३॥ यो भूतादिः पञ्चभूतैः सिसृक्षुस्तन्मात्रात्मा
    कालकर्मस्वभावैः । प्रहृत्येदं प्राप्य जीवत्वमीशो ब्रह्मानन्दे क्रीडते तं नमामि ॥ ४॥ स्थितौ विष्णुः
    सर्वजिष्णुः सुरात्मा लोकान्साधून् धर्मसेतून्बिभर्ति । ब्रह्माद्यंशे योऽभिमानी गुणात्मा शब्दाद्यङ्गैस्तं
    परेशं नमामि ॥ ५॥ यस्याज्ञया वायवो वान्ति लोके ज्वलत्यग्निः सविता याति तप्यन् । शीतांशुः खे तारकासंग्रहश्च
    प्रवर्तन्ते तं परेशं प्रपद्ये ॥ ६॥ यस्य श्वासात्सर्वधात्री धरित्री देवो वर्षत्यम्बुकालः प्रमाता ।
    मेरुर्मध्ये भूवनानां च भर्ता तमीशानं विश्वरूपं नमामि ॥ ७॥ इति श्रीकल्किपुराणे कल्किकृतं शिवस्तोत्रं
    सम्पूर्णम् ।
