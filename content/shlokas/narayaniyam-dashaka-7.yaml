id: narayaniyam-dashaka-7
category: stotram
name:
  english: Narayaniyam Dashaka 7
content:
  english: evam deva caturdashatmakajagadrupena jatah puna stasyordhvam khalu satyalokanilaye jato'si
    dhata svayam | yam shamsanti hiranyagarbhamakhilatrailokyajivatmakam yo'bhut sphitarajovikaravikasannanasisriksharasah
    || || so'yam vishvavisargadattahridayah sampashyamanah svayam bodham khalvanavapya vishvavishayam
    cintakulastasthivan | tavattvam jagatam pate tapa tapetyevam hi vaihayasim vanimenamashishravah shrutisukham
    kurvamstapahpreranam || || ko'sau mamavadat pumaniti jalapurne jaganmandale dikshudvikshya kimapyanikshitavata
    vakyarthamutpashyata | divyam varshasahasramattatapasa tena tvamaradhita stasmai darshitavanasi svanilayam
    vaikunthamekadbhutam || || maya yatra kadapi no vikurute bhate jagadbhyo bahih shokakrodhavimohasadhvasamukha
    bhavastu duram gatah | sandranandajhari ca yatra paramajyotihprakashatmake tatte dhama vibhavitam
    vijayate vaikuntharupam vibho || || yasminnama caturbhuja harimanishyamavadatatvisho nanabhushanaratnadipitadisho
    rajadvimanalayah | bhaktipraptatathavidhonnatapada divyanti divya jana tatte dhama nirastasarvashamalam
    vaikuntharupam jayet || || nanadivyavadhujanairabhivrita vidyullatatulyaya vishvonmadanahridyagatralataya
    vidyotitashantara | tvatpadambujasaurabhaikakutukallakshmih svayam lakshyate yasmin vismayaniyadivyavibhavam
    tatte padam dehi me || || tatraivam pratidarshite nijapade ratnasanadhyasitam bhasvatkotilasatkiritakatakadyakalpadiprakriti
    | shrivatsankitamattakaustubhamanicchayarunam karanam vishvesham tava rupamaikshata vidhistatte vibho
    bhatu me || || kalambhodakalayakomalarucicakrena cakram disha mavrinvanamudaramandahasitasyandaprasannananam
    | rajatkambugadaripankajadharashrimadbhujamandalam srashtustushtikaram vapustava vibho madrogamudvasayet
    || || drishtva sambhritasambhramah kamalabhustvatpadapathoruhe harshaveshavashamvado nipatitah pritya
    kritarthibhavan | janasyeva manishitam mama vibho jnanam tadapadaya dvaitadvaitabhavatsvarupaparamityacashta
    tam tvam bhaje || || atamre carane vinamramatha tam hastena haste sprishan bodhaste bhavita na sargavidhibhirbandho'pi
    sanjayate | ityabhashya giram pratoshya nitaram taccittagudhah svayam srishtau tam samudairayah sa
    bhagavannullasayollaghatam ||
  devanagari: एवं देव चतुर्दशात्मकजगद्रूपेण जातः पुन स्तस्योर्ध्वं खलु सत्यलोकनिलये जातोऽसि धाता स्वयम्
    । यं शंसन्ति हिरण्यगर्भमखिलत्रैलोक्यजीवात्मकं योऽभूत् स्फीतरजोविकारविकसन्नानासिसृक्षारसः ॥ ॥ सोऽयं
    विश्वविसर्गदत्तहृदयः सम्पश्यमानः स्वयं बोधं खल्वनवाप्य विश्वविषयं चिन्ताकुलस्तस्थिवान् । तावत्त्वं
    जगतां पते तप तपेत्येवं हि वैहायसीं वाणीमेनमशिश्रवः श्रुतिसुखां कुर्वंस्तपःप्रेरणाम् ॥ ॥ कोऽसौ मामवदत्
    पुमानिति जलापूर्णे जगन्मण्डले दिक्षूद्वीक्ष्य किमप्यनीक्षितवता वाक्यार्थमुत्पश्यता । दिव्यं वर्षसहस्रमात्ततपसा
    तेन त्वमाराधित स्तस्मै दर्शितवानसि स्वनिलयं वैकुण्ठमेकाद्भुतम् ॥ ॥ माया यत्र कदापि नो विकुरुते भाते
    जगद्भ्यो बहिः शोकक्रोधविमोहसाध्वसमुखा भावास्तु दूरं गताः । सान्द्रानन्दझरी च यत्र परमज्योतिःप्रकाशात्मके
    तत्ते धाम विभावितं विजयते वैकुण्ठरूपं विभो ॥ ॥ यस्मिन्नाम चतुर्भुजा हरिमणिश्यामावदातत्विषो नानाभूषणरत्नदीपितदिशो
    राजद्विमानालयाः । भक्तिप्राप्ततथाविधोन्नतपदा दीव्यन्ति दिव्या जना तत्ते धाम निरस्तसर्वशमलं वैकुण्ठरूपं
    जयेत् ॥ ॥ नानादिव्यवधूजनैरभिवृता विद्युल्लतातुल्यया विश्वोन्मादनहृद्यगात्रलतया विद्योतिताशान्तरा ।
    त्वत्पादाम्बुजसौरभैककुतुकाल्लक्ष्मीः स्वयं लक्ष्यते यस्मिन् विस्मयनीयदिव्यविभवं तत्ते पदं देहि मे
    ॥ ॥ तत्रैवं प्रतिदर्शिते निजपदे रत्नासनाध्यासितं भास्वत्कोटिलसत्किरीटकटकाद्याकल्पदीप्राकृति । श्रीवत्साङ्कितमात्तकौस्तुभमणिच्छायारुणं
    कारणं विश्वेषां तव रूपमैक्षत विधिस्तत्ते विभो भातु मे ॥ ॥ कालाम्भोदकलायकोमलरुचीचक्रेण चक्रं दिशा मावृण्वानमुदारमन्दहसितस्यन्दप्रसन्नाननम्
    । राजत्कम्बुगदारिपङ्कजधरश्रीमद्भुजामण्डलं स्रष्टुस्तुष्टिकरं वपुस्तव विभो मद्रोगमुद्वासयेत् ॥ ॥ दृष्ट्वा
    सम्भृतसम्भ्रमः कमलभूस्त्वत्पादपाथोरुहे हर्षावेशवशंवदो निपतितः प्रीत्या कृतार्थीभवन् । जानास्येव मनीषितं
    मम विभो ज्ञानं तदापादय द्वैताद्वैतभवत्स्वरूपपरमित्याचष्ट तं त्वां भजे ॥ ॥ आताम्रे चरणे विनम्रमथ तं
    हस्तेन हस्ते स्पृशन् बोधस्ते भविता न सर्गविधिभिर्बन्धोऽपि सञ्जायते । इत्याभाष्य गिरं प्रतोष्य नितरां
    तच्चित्तगूढः स्वयं सृष्टौ तं समुदैरयः स भगवन्नुल्लासयोल्लाघताम् ॥
