id: tait
category: upanishad
name:
  english: tait
  devanagari: तैत्
content:
  english: hi bhutanam jyeshtham | tasmat sarvaushadhamucyate | annad bhutani jayante | jatanyannena vardhante
    | adyate'tti ca bhutani | tasmadannam taducyata iti | tasmadva etasmadannarasamayat | anyo'ntara atma
    pranamayah | tenaisha purnah | sa va esha purushavidha eva | tasya purushavidhatam | anvayam purushavidhah
    | tasya prana eva shirah | vyano dakshinah pakshah | apana uttarah pakshah | akasha atma | prithivi
    puccham pratishtha | tadapyesha shloko bhavati || 1|| iti dvitiyo'nuvakah || pranam deva anu prananti
    | manushyah pashavashca ye | prano hi bhutanamayuh | tasmat sarvayushamucyate | sarvameva ta ayuryanti
    | ye pranam brahmopasate | prano hi bhutanamayuh | tasmat sarvayushamucyata iti | tasyaisha eva sharira
    atma | yah purvasya | tasmadva etasmat pranamayat | anyo'ntara atma manomayah | tenaisha purnah |
    sa va esha purushavidha eva | tasya purushavidhatam | anvayam purushavidhah | tasya yajureva shirah
    | rigdakshinah pakshah | samottarah pakshah | adesha atma | atharvangirasah puccham pratishtha | tadapyesha
    shloko bhavati || 1|| iti tritiyo'nuvakah || yato vaco nivartante | aprapya manasa saha | anandam
    brahmano vidvan | na bibheti kadacaneti | tasyaisha eva sharira atma | yah purvasya | tasmadva etasmanmanomayat
    | anyo'ntara atma vijnanamayah | tenaisha purnah | sa va esha purushavidha eva | tasya purushavidhatam
    | anvayam purushavidhah | tasya shraddhaiva shirah | ritam dakshinah pakshah | satyamuttarah pakshah
    | yoga atma | mahah puccham pratishtha | tadapyesha shloko bhavati || 1|| iti caturtho'nuvakah ||
    vijnanam yajnam tanute | karmani tanute'pi ca | vijnanam devah sarve | brahma jyeshthamupasate | vijnanam
    brahma cedveda | tasmaccenna pramadyati | sharire papmano hitva | sarvankaman samashnuta iti | tasyaisha
    eva sharira atma | yah purvasya | tasmadva etasmadvijnanamayat | anyo'ntara atma''nandamayah | tenaisha
    purnah | sa va esha purushavidha eva | tasya purushavidhatam | anvayam purushavidhah | tasya priyameva
    shirah | modo dakshinah pakshah | pramoda uttarah pakshah | ananda atma | brahma puccham pratishtha
    | tadapyesha shloko bhavati || 1|| iti pancamo'nuvakah || asanneva sa bhavati | asadbrahmeti veda
    cet | asti brahmeti cedveda | santamenam tato viduriti | tasyaisha eva sharira atma | yah purvasya
    | athato'nuprashnah | utavidvanamum lokam pretya | kashcana gacchati3
  devanagari: हि भूतानां ज्येष्ठम् । तस्मात् सर्वौषधमुच्यते । अन्नाद् भूतानि जायन्ते । जातान्यन्नेन वर्धन्ते
    । अद्यतेऽत्ति च भूतानि । तस्मादन्नं तदुच्यत इति । तस्माद्वा एतस्मादन्नरसमयात् । अन्योऽन्तर आत्मा प्राणमयः
    । तेनैष पूर्णः । स वा एष पुरुषविध एव । तस्य पुरुषविधताम् । अन्वयं पुरुषविधः । तस्य प्राण एव शिरः ।
    व्यानो दक्षिणः पक्षः । अपान उत्तरः पक्षः । आकाश आत्मा । पृथिवी पुच्छं प्रतिष्ठा । तदप्येष श्लोको भवति
    ॥ १॥ इति द्वितीयोऽनुवाकः ॥ प्राणं देवा अनु प्राणन्ति । मनुष्याः पशवश्च ये । प्राणो हि भूतानामायुः
    । तस्मात् सर्वायुषमुच्यते । सर्वमेव त आयुर्यन्ति । ये प्राणं ब्रह्मोपासते । प्राणो हि भूतानामायुः
    । तस्मात् सर्वायुषमुच्यत इति । तस्यैष एव शारीर आत्मा । यः पूर्वस्य । तस्माद्वा एतस्मात् प्राणमयात्
    । अन्योऽन्तर आत्मा मनोमयः । तेनैष पूर्णः । स वा एष पुरुषविध एव । तस्य पुरुषविधताम् । अन्वयं पुरुषविधः
    । तस्य यजुरेव शिरः । ऋग्दक्षिणः पक्षः । सामोत्तरः पक्षः । आदेश आत्मा । अथर्वाङ्गिरसः पुच्छं प्रतिष्ठा
    । तदप्येष श्लोको भवति ॥ १॥ इति तृतीयोऽनुवाकः ॥ यतो वाचो निवर्तन्ते । अप्राप्य मनसा सह । आनन्दं ब्रह्मणो
    विद्वान् । न बिभेति कदाचनेति । तस्यैष एव शारीर आत्मा । यः पूर्वस्य । तस्माद्वा एतस्मान्मनोमयात् ।
    अन्योऽन्तर आत्मा विज्ञानमयः । तेनैष पूर्णः । स वा एष पुरुषविध एव । तस्य पुरुषविधताम् । अन्वयं पुरुषविधः
    । तस्य श्रद्धैव शिरः । ऋतं दक्षिणः पक्षः । सत्यमुत्तरः पक्षः । योग आत्मा । महः पुच्छं प्रतिष्ठा ।
    तदप्येष श्लोको भवति ॥ १॥ इति चतुर्थोऽनुवाकः ॥ विज्ञानं यज्ञं तनुते । कर्माणि तनुतेऽपि च । विज्ञानं
    देवाः सर्वे । ब्रह्म ज्येष्ठमुपासते । विज्ञानं ब्रह्म चेद्वेद । तस्माच्चेन्न प्रमाद्यति । शरीरे पाप्मनो
    हित्वा । सर्वान्कामान् समश्नुत इति । तस्यैष एव शारीर आत्मा । यः पूर्वस्य । तस्माद्वा एतस्माद्विज्ञानमयात्
    । अन्योऽन्तर आत्माऽऽनन्दमयः । तेनैष पूर्णः । स वा एष पुरुषविध एव । तस्य पुरुषविधताम् । अन्वयं पुरुषविधः
    । तस्य प्रियमेव शिरः । मोदो दक्षिणः पक्षः । प्रमोद उत्तरः पक्षः । आनन्द आत्मा । ब्रह्म पुच्छं प्रतिष्ठा
    । तदप्येष श्लोको भवति ॥ १॥ इति पञ्चमोऽनुवाकः ॥ असन्नेव स भवति । असद्ब्रह्मेति वेद चेत् । अस्ति ब्रह्मेति
    चेद्वेद । सन्तमेनं ततो विदुरिति । तस्यैष एव शारीर आत्मा । यः पूर्वस्य । अथातोऽनुप्रश्नाः । उताविद्वानमुं
    लोकं प्रेत्य । कश्चन गच्छती३
