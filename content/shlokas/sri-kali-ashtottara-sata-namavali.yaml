    ॐ कमनीयस्वभाविन्यै नमः । ॐ कुलीनायै नमः । ॐ कुलकर्त्र्यै नमः । ॐ कुलवर्त्मप्रकाशिन्यै नमः । ॐ कस्तूरीरसनीलायै
    नमः । ॐ काम्यायै नमः । ॐ कामस्वरूपिण्यै नमः । ॐ ककारवर्णनिलयायै नमः । ॐ कामधेनवे नमः । ॐ करालिकायै
    नमः । । ॐ कुलकान्तायै नमः । ॐ करालास्यायै नमः । ॐ कामार्तायै नमः । ॐ कलावत्यै नमः । ॐ कृशोदर्यै नमः
    । ॐ कामाख्यायै नमः । ॐ कौमार्यै नमः । ॐ कुलपालिन्यै नमः । ॐ कुलजायै नमः । ॐ कुलकन्यायै नमः । । ॐ कुलहायै
    नमः । ॐ कुलपूजितायै नमः । ॐ कामेश्वर्यै नमः । ॐ कामकान्तायै नमः । ॐ कुञ्जरेश्वरगामिन्यै नमः । ॐ कामदात्र्यै
    नमः । ॐ कामहर्त्र्यै नमः । ॐ कृष्णायै नमः । ॐ कपर्दिन्यै नमः । ॐ कुमुदायै नमः । । ॐ कृष्णदेहायै नमः
    । ॐ कालिन्द्यै नमः । ॐ कुलपूजितायै नमः । ॐ काश्यप्यै नमः । ॐ कृष्णमात्रे नमः । ॐ कुलिशाङ्ग्यै नमः
    । ॐ कलायै नमः । ॐ क्रीं रूपायै नमः । ॐ कुलगम्यायै नमः । ॐ कमलायै नमः । । ॐ कृष्णपूजितायै नमः । ॐ कृशाङ्ग्यै
    नमः । ॐ किन्नर्यै नमः । ॐ कर्त्र्यै नमः । ॐ कलकण्ठ्यै नमः । ॐ कार्तिक्यै नमः । ॐ कम्बुकण्ठ्यै नमः
    । ॐ कौलिन्यै नमः । ॐ कुमुदायै नमः । ॐ कामजीविन्यै नमः । । ॐ कुलस्त्रियै नमः । ॐ कीर्तिकायै नमः । ॐ
    कृत्यायै नमः । ॐ कीर्त्यै नमः । ॐ कुलपालिकायै नमः । ॐ कामदेवकलायै नमः । ॐ कल्पलतायै नमः । ॐ कामाङ्गवर्धिन्यै
    नमः । ॐ कुन्तायै नमः । ॐ कुमुदप्रीतायै नमः । । ॐ कदम्बकुसुमोत्सुकायै नमः । ॐ कादम्बिन्यै नमः । ॐ कमलिन्यै
    नमः । ॐ कृष्णानन्दप्रदायिन्यै नमः । ॐ कुमारीपूजनरतायै नमः । ॐ कुमारीगणशोभितायै नमः । ॐ कुमारीरञ्जनरतायै
    नमः । ॐ कुमारीव्रतधारिण्यै नमः । ॐ कङ्काल्यै नमः । ॐ कमनीयायै नमः । । ॐ कामशास्त्रविशारदायै नमः ।
    ॐ कपालखट्वाङ्गधरायै नमः । ॐ कालभैरवरूपिण्यै नमः । ॐ कोटर्यै नमः । ॐ कोटराक्ष्यै नमः । ॐ काशीवासिन्यै
    नमः । ॐ कैलासवासिन्यै नमः । ॐ कात्यायन्यै नमः । ॐ कार्यकर्यै नमः । ॐ काव्यशास्त्रप्रमोदिन्यै नमः ।
    । ॐ कामाकर्षणरूपायै नमः । ॐ कामपीठनिवासिन्यै नमः । ॐ कङ्किन्यै नमः । ॐ काकिन्यै नमः । ॐ क्रीडायै नमः
    । ॐ कुत्सितायै नमः । ॐ कलहप्रियायै नमः । ॐ कुण्डगोलोद्भवप्राणायै नमः । ॐ कौशिक्यै नमः । ॐ कीर्तिवर्धिन्यै
    नमः । । ॐ कुम्भस्तन्यै नमः । ॐ कटाक्षायै नमः । ॐ काव्यायै नमः । ॐ कोकनदप्रियायै नमः । ॐ कान्तारवासिन्यै
    नमः । ॐ कान्त्यै नमः । ॐ कठिनायै नमः । ॐ कृष्णवल्लभायै नमः । इति ककारादि श्री काली अष्टोत्तरशतनामावलिः
    ।
