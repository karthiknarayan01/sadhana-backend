    अमृत लेहिं बिषु मागी ॥ तेउ न पाइ अस समु चुकाहीं। देखु बिचारि मातु मन माहीम् ॥ अम्ब एक दुखु मोहि बिसेषी।
    निपट बिकल नरनायकु देखी ॥ थोरिहिं बात पितहि दुख भारी। होति प्रतीति न मोहि महतारी ॥ राउ धीर गुन उदधि
