id: markandeyakritam1vishnustotram
category: stotram
name:
  english: markandeyakritam1vishnustotram
  devanagari: मार्कण्डेयकृतं१विष्णुस्तोत्रम्
content:
  english: markandeyakritam 1 vishnustotram markandeya uvaca | sahasrashirasam devam narayanamanamayam
    | vasudevamanadharam pranato'smi janardanam || 36|| ame'yamajaram nityam sadanandaikavigraham | apratarkyamanirddeshyam
    pranato'smi janardanam || 37|| aksharam paramam nityam vishvaksham vishvasambhavam | sarvatattvamayam
    shantam pranato'smi janardanam || 38|| puranam purusham siddham sarvajnanaikabhajanam | paratparataram
    rupam pranato'smi janardanam || 39|| param jyotih param dhama pavitram paramam padam | sarvaikarupam
    paramam pranato'smi janardanam || 40|| tam sadanandacinmatram paranam paramam padam | sarvam sanatanam
    shreshtham pranato'smi janardanam || 41|| sagunam nirgunam shantam maya'titam sumayinam | arupam bahurupam
    tam pranato'smi janardanam || 42|| yatra tadbhagavan vishvam srijatyavati hanti ca | tamadidevamishanam
    pranato'smi janardanam || 43|| paresha paramananda sharanagatavatsala | trahi mam karunasindho mano'tita
    namo'stu te || 44|| iti naradapurane purvabhage pancamadhyayantargatam markandeyakritam vishnustotram
    samaptam | brihannaradiyapurana | purvabhaga | adhyaya 5
  devanagari: मार्कण्डेयकृतं १ विष्णुस्तोत्रम् मार्कण्डेय उवाच । सहस्रशिरसं देवं नारायणमनामयम् । वासुदेवमनाधारं
    प्रणतोऽस्मि जनार्दनम् ॥ ३६॥ अमेऽयमजरं नित्यं सदानन्दैकविग्रहम् । अप्रतर्क्यमनिर्द्देश्यं प्रणतोऽस्मि
    जनार्दनम् ॥ ३७॥ अक्षरं परमं नित्यं विश्वाक्षं विश्वसम्भवम् । सर्वतत्त्वमयं शान्तं प्रणतोऽस्मि जनार्दनम्
    ॥ ३८॥ पुराणं पुरुषं सिद्धं सर्वज्ञानैकभाजनम् । परात्परतरं रूपं प्रणतोऽस्मि जनार्दनम् ॥ ३९॥ परं ज्योतिः
    परं धाम पवित्रं परमं पदम् । सर्वैकरूपं परमं प्रणतोऽस्मि जनार्दनम् ॥ ४०॥ तं सदानन्दचिन्मात्रं पराणां
    परमं पदम् । सर्वं सनातनं श्रेष्ठं प्रणतोऽस्मि जनार्दनम् ॥ ४१॥ सगुणं निर्गुणं शान्तं मायाऽतीतं सुमायिनम्
    । अरूपं बहुरूपं तं प्रणतोऽस्मि जनार्दनम् ॥ ४२॥ यत्र तद्भगवान् विश्वं सृजत्यवति हन्ति च । तमादिदेवमीशानं
    प्रणतोऽस्मि जनार्दनम् ॥ ४३॥ परेश परमानन्द शरणागतवत्सल । त्राहि मां करुणासिन्धो मनोऽतीत नमोऽस्तु ते
    ॥ ४४॥ इति नारदपुराणे पूर्वभागे पञ्चमाध्यायान्तर्गतं मार्कण्डेयकृतं विष्णुस्तोत्रं समाप्तम् । बृहन्नारदीयपुराण
    । पूर्वभाग । अध्याय ५
