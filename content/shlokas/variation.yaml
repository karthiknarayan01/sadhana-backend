id: variation
category: stotram
name:
  english: variation
  devanagari: वरिअतिओन्
content:
  english: om kshram amgushthabhyam namah | om kshrim tarjanibhyam namah | om kshrum madhyamabhyam namah
    | om kshraim anamikabhyam namah | om kshraum kanishthikabhyam namah | om kshrah karatalakaraprishthabhyam
    namah || om kshram hridayaya namah | om kshrim shirase svaha | om kshrum shikhayai vashat | om kshraim
    kavacaya hum | om kshraum netratrayaya vaushat | om kshrah astraya phat | atha dhyanam | lakshmishobhitavamabhagamamalam
    simhasane sumdaram savye cakradharam ca nirbhayakaram vamena capam varam | sarvadhishakritantapatramamalam
    shrivatsavakshahsthalam vande devamunindravanditapadam lakshminrisimham vibhum || prathamam tu mahajvalo
    dvitiyam tugrakesari | tritiyam vajradamshtrashca caturtham tu visharadah || 1|| pancamam narasimhashca
    shashthah kashyapamardanah | saptamo yatuhanta ca ashtamo devavallabhah || 2|| nava prahladavarado
    dashamo'nantahastakah | ekadasho maharudro dvadasho darunastatha || 3|| dvadashaitani namani nrisimhasya
    mahatmanah | mantrarajeti vikhyatam sarvapapavinashanam || 4|| kshayapasmarakushthaditapajvaranivaranam
    | rajadvare mahaghore sangrame ca jalantare || 5|| girigahvara aranye vyaghracoramayadishu | rane
    ca marane caiva shamadam paramam shubham || 6|| shatamavartayedyastu mucyate vyadhibandhanat | avartayetsahasram
    tu labhate vanchitam phalam || 7|| iti shribrahmapurane brahmanaradasamvade shrilakshminrisimhadvadashanamastotram
    sampurnam |
  devanagari: ॐ क्ष्रां अंगुष्ठाभ्यां नमः । ॐ क्ष्रीं तर्जनीभ्यां नमः । ॐ क्ष्रूं मध्यमाभ्यां नमः । ॐ
    क्ष्रैं अनामिकाभ्यां नमः । ॐ क्ष्रौं कनिष्ठिकाभ्यां नमः । ॐ क्ष्रः करतलकरपृष्ठाभ्यां नमः ॥ ॐ क्ष्रां
    हृदयाय नमः । ॐ क्ष्रीं शिरसे स्वाहा । ॐ क्ष्रूं शिखायै वषट् । ॐ क्ष्रैं कवचाय हुं । ॐ क्ष्रौं नेत्रत्रयाय
    वौषट् । ॐ क्ष्रः अस्त्राय फट् । अथ ध्यानम् । लक्ष्मीशोभितवामभागममलं सिंहासने सुंदरं सव्ये चक्रधरं
    च निर्भयकरं वामेन चापं वरम् । सर्वाधीशकृतान्तपत्रममलं श्रीवत्सवक्षःस्थलं वन्दे देवमुनीन्द्रवन्दितपदं
    लक्ष्मीनृसिंहं विभुम् ॥ प्रथमं तु महाज्वालो द्वितीयं तूग्रकेसरी । तृतीयं वज्रदंष्ट्रश्च चतुर्थं तु
    विशारदः ॥ १॥ पञ्चमं नारसिंहश्च षष्ठः कश्यपमर्दनः । सप्तमो यातुहन्ता च अष्टमो देववल्लभः ॥ २॥ नव प्रह्लादवरदो
    दशमोऽनन्तहस्तकः । एकादशो महारुद्रो द्वादशो दारुणस्तथा ॥ ३॥ द्वादशैतानि नामानि नृसिंहस्य महात्मनः ।
    मन्त्रराजेति विख्यातं सर्वपापविनाशनम् ॥ ४॥ क्षयापस्मारकुष्ठादितापज्वरनिवारणम् । राजद्वारे महाघोरे
    सङ्ग्रामे च जलान्तरे ॥ ५॥ गिरिगह्वार आरण्ये व्याघ्रचोरामयादिषु । रणे च मरणे चैव शमदं परमं शुभम् ॥
    ६॥ शतमावर्तयेद्यस्तु मुच्यते व्याधिबन्धनात् । आवर्तयेत्सहस्रं तु लभते वाञ्छितं फलम् ॥ ७॥ इति श्रीब्रह्मपुराणे
    ब्रह्मनारदसंवादे श्रीलक्ष्मीनृसिंहद्वादशनामस्तोत्रं सम्पूर्णम् ।
