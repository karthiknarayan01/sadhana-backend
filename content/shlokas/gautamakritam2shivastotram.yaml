id: gautamakritam2shivastotram
category: stotram
name:
  english: gautamakritam2shivastotram
  devanagari: गौतमकृतं२शिवस्तोत्रम्
content:
  english: gautamakritam 2 shivastotram astaushamadimam lingamarunadrimayam mahat || 9|| adyena brahmana
    purvamarcitam divyacakshusha | asau yastamro aruna uta babhruh sumangalah || 10|| iti veda stuvanti
    tvamarunadrisha santatam | namastamraya carunaya shivaya paramatmane || 11|| sarvavedasvarupaya nityayamritamurttaye
    | kalaya karunardraya drishtipeyamritabdhaye || 12|| bhaktavatsalyapurnaya punyaya purabhedine | darshanam
    tava devesha sarvadharmaphalapradam || 13|| bhuvi labdhavata bhuyo nanyatkaryam tapah kvacit | bhavata
    karmabhuresha vartate'dya nirodhita || 14|| prarthayante svayam vasandevashcatra tvadashraye | kalasangrahasanjatam
    phalam labdham mayadhuna || 15|| anyatkritam tapah sarvam tvaddarshanaphalam mama | idrisham tava
    devesha rupamatyadbhutodayam || 16|| ekamadrimayam lingam na kvaciddrishtavanbhuvi | suryendvagnisusamyuktakonatrayamanoharam
    || 17|| trimurtirupa devesha drishyate te vapurmahat | shaktitrayasvarupena kalatrayavidhanakam ||
    18|| trivedatmam trikonangam lingam te drishtamadbhutam | trailokyarakshanarthaya vitatam rupamasthitah
    || 19|| drishyate vasudhabhage shonadririti vishrutah | ajanatam ca martyanam samalokanamatratah ||
    20|| vitaratyakhilanbhoganavyajakarunanidhih | arcaya rahitam lingamanyam shunyamudahritam || 21||
    idam tu pujitam devaih sada sarvavarapradam | prasida karunapurna shonacalamaheshvara || 22|| trayasva
    bhavabhitam mam prapannam bhaktavatsala | drashtavyam drashtametatte rupamatyadbhutam mahat || 23||
    kritarthaya kripasindho sharanya sharanagatam || iti shriskandapurane maheshvarakhande
  devanagari: गौतमकृतं २ शिवस्तोत्रम् अस्तौषमादिमं लिङ्गमरुणाद्रिमयं महत् ॥ ९॥ आद्येन ब्रह्मणा पूर्वमर्चितं
    दिव्यचक्षुषा । असौ यस्ताम्रो अरुण उत बभ्रुः सुमङ्गलः ॥ १०॥ इति वेदा स्तुवन्ति त्वामरुणाद्रीश सन्ततम्
    । नमस्ताम्राय चारुणाय शिवाय परमात्मने ॥ ११॥ सर्ववेदस्वरूपाय नित्यायामृतमूर्त्तये । कालाय करुणार्द्राय
    दृष्टिपेयामृताब्धये ॥ १२॥ भक्तवात्सल्यपूर्णाय पुण्याय पुरभेदिने । दर्शनं तव देवेश सर्वधर्मफलप्रदम्
    ॥ १३॥ भुवि लब्धवता भूयो नान्यत्कार्यं तपः क्वचित् । भवता कर्मभूरेषा वर्ततेऽद्य निरोधिता ॥ १४॥ प्रार्थयन्ते
    स्वयं वासान्देवाश्चात्र त्वदाश्रये । कालसङ्ग्रहसञ्जातं फलं लब्धं मयाधुना ॥ १५॥ अन्यत्कृतं तपः सर्वं
    त्वद्दर्शनफलं मम । ईदृशं तव देवेश रूपमत्यद्भुतोदयम् ॥ १६॥ एकमद्रिमयं लिङ्गं न क्वचिद्दृष्टवान्भुवि
    । सूर्येन्द्वग्निसुसंयुक्तकोणत्रयमनोहरम् ॥ १७॥ त्रिमूर्तिरूप देवेश दृश्यते ते वपुर्महत् । शक्तित्रयस्वरूपेण
    कालत्रयविधानकम् ॥ १८॥ त्रिवेदात्मं त्रिकोणाङ्गं लिङ्गं ते दृष्टमद्भुतम् । त्रैलोक्यरक्षणार्थाय विततं
    रूपमास्थितः ॥ १९॥ दृश्यते वसुधाभागे शोणाद्रिरिति विश्रुतः । अजानतां च मर्त्यानां समालोकनमात्रतः ॥
    २०॥ वितरत्यखिलान्भोगानव्याजकरुणानिधिः । अर्चया रहितं लिङ्गमन्यं शून्यमुदाहृतम् ॥ २१॥ इदं तु पूजितं
    देवैः सदा सर्ववरप्रदम् । प्रसीद करुणापूर्ण शोणाचलमहेश्वर ॥ २२॥ त्रायस्व भवभीतं मां प्रपन्नं भक्तवत्सल
    । द्रष्टव्यं द्रष्टमेतत्ते रूपमत्यद्भुतं महत् ॥ २३॥ कृतार्थय कृपासिन्धो शरण्य शरणागतम् ॥ इति श्रीस्कन्दपुराणे
    माहेश्वरखण्डे
