id: subradhyanam
category: stotram
name:
  english: subradhyanam
  devanagari: सुब्रध्यनम्
content:
  english: ringara sarodayam || 6|| dhyayedipsitasiddhitam shivasutam shridvadashaksham guham bananketakamankushancavaradam
    pasham dhanuhshakrakam vajramshaktimasintrishulamabhayam dorbhirdhritam shanmukham bhasvacchatramayuravahasubhagam
    citrambaralamkritam || 7|| gangeyam vahnigarbham sharavanajanitam jnanashaktim kumaram subrahmanyam
    suresham guhamacaladidam rudratejasvarupam senanyam tarakaghnam gajamukhasahajam kartikeyam shadasyam
    subrahmanyam mayuradhvajarathasahitam devadevam namami || 8|| shanmukham dvadashabhujam dvadashaksham
    shikhidhvajam | shaktidvayasamayuktam vamadakshinaparshvayoh || 9|| shaktimshulam tatha khadgam khetancapamsharam
    tatha | ghantam ca kukkutancaivapashancaivatathankusham || 10|| abhayam varadancaiva dharayantam karambujaih
    | mahabalam mahaviryam shikhivaham shikhiprabham || 11|| kiritakundalopetam khanditoddandatarakam
    | mandalikritakodandam kandaihkrauncadharadharam || 12|| darayantam duradharsham daityadanavarakshasaih
    | devasenapatim devakaryaikaniratam prabhum || 13|| mahadevatanujatam madanayutasundaram | cintaye
    hridayambhoje kumaramamitejasam || 14|| || iti shri subrahmanyadhyanam samaptam ||
  devanagari: ृङ्गार सारोदयम् ॥ ६॥ ध्यायेदीप्सितसिद्धितं शिवसुतं श्रीद्वादशाक्षं गुहं बाणङ्केटकमङ्कुशञ्चवरदं
    पाशं धनुःशक्रकं वज्रंशक्तिमसिन्त्रिशूलमभयं दोर्भिर्धृतं षण्मुखं भास्वच्छत्रमयूरवाहसुभगं चित्राम्बरालंकृतम्
    ॥ ७॥ गाङ्गेयं वह्निगर्भं शरवणजनितं ज्ञानशक्तिं कुमारं सुब्रह्मण्यं सुरेशं गुहमचलदिदं रुद्रतेजस्वरूपं
    सेनान्यं तारकघ्नं गजमुखसहजं कार्तिकेयं षडास्यं सुब्रह्मण्यं मयूरध्वजरथसहितं देवदेवं नमामि ॥ ८॥ षण्मुखं
    द्वादशभुजं द्वादशाक्षं शिखिध्वजम् । शक्तिद्वयसमायुक्तं वामदक्षिणपार्श्वयोः ॥ ९॥ शक्तिंशूलं तथा खड्गं
    खेटञ्चापंशरं तथा । घण्टां च कुक्कुटञ्चैवपाशञ्चैवतथाङ्कुशम् ॥ १०॥ अभयं वरदञ्चैव धारयान्तं कराम्बुजैः
    । महाबलं महावीर्यं शिखिवाहं शिखिप्रभम् ॥ ११॥ किरीटकुण्डलोपेतं खण्डितोद्दण्डतारकम् । मण्डलीकृतकोदण्डं
    काण्डैःक्रौञ्चधराधरम् ॥ १२॥ दारयन्तं दुराधर्षं दैत्यदानवराक्षसैः । देवसेनापतिं देवकार्यैकनिरतं प्रभुम्
    ॥ १३॥ महादेवतनूजातं मदनायुतसुन्दरम् । चिन्तये हृदयाम्भोजे कुमारममितेजसम् ॥ १४॥ ॥ इति श्री सुब्रह्मण्यध्यानं
    समाप्तम् ॥
