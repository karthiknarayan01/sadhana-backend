id: ganapati-mala-mantra
category: stotram
name:
  english: Ganapati Mala Mantra
  devanagari: गणपतिमालामन्त्राः
content:
  english: om klim hrim shrim aim glaum om hrim kraum gam om namo bhagavate mahaganapataye smaranamatrasantushtaya
    sarvavidyaprakashaya sarvakamapradaya bhavabandhavimocanaya hrim sarvabhutabandhanaya krom sadhyakarshanaya
    klim jagattraya vashikaranaya sauh sarvamanahkshobhanaya shrim mahasampatpradaya glaum bhumandaladhipatyapradaya
    mahajnanapradaya cidanandatmane gaurinandanaya mahayogine shivapriyaya sarvanandavardhanaya sarvavidyaprakashanapradaya
    dram ciranjivine blum sammohanaya om mokshapradaya, phat vashikuru vashikuru, vaushadakarshanaya hum
    vidveshanaya vidveshaya vidveshaya, phat uccatayoccataya, thah thah stambhaya stambhaya, khem khem
    maraya maraya, shoshaya shoshaya, paramantrayantratantrani chedaya chedaya, dushtagrahannivaraya nivaraya,
    duhkham hara hara, vyadhim nashaya nashaya, namah sampannaya sampannaya svaha, sarvapallavasvarupaya
    mahavidyaya gam ganapataye svaha, yanmantre kshitalanchitabhamanagham mrityushca vajrashisho bhutapretapishacakah
    pratihata nirghatapatadiva, utpannam ca samastaduhkhaduritam hyuccatanotpadakam vande'bhishtaganadhipam
    bhayaharam vighnaughanasham param, om gam ganapataye namah | (vanadurgopanishadi) om namo mahaganapataye,
    mahaviraya, dashabhujaya, madanakalavinashana, mrityum hana hana, yama yama, mada mada, kalam samhara
    samhara, sarvagrahan curnaya curnaya, nagan mudhaya mudhaya, rudrarupa, tribhuvaneshvara, sarvatomukha
    hum phat svaha | om namo ganapataye, shvetarkaganapataye, shvetarkamulanivasaya, vasudevapriyaya,
    dakshaprajapatirakshakaya, suryavaradaya, kumaragurave, brahmadisurasuravanditaya, sarpabhushanaya,
    shashankashekharaya, sarpamala'lankritadehaya, dharmadhvajaya, dharmavahanaya, trahi trahi, dehi dehi,
    avatara avatara, gam ganapataye, vakratundaganapataye, varavarada, sarvapurushavashankara, sarvadushtamrigavashankara,
    sarvasvavashankara, vashikuru vashikuru, sarvadoshan bandhaya bandhaya, sarvavyadhin nikrintaya nikrintaya,
    sarvavishani samhara samhara, sarvadaridryam mocaya mocaya, sarvavighnan chindhi chindhi, sarva vajrani
    sphotaya sphotaya, sarvashatrun uccataya uccataya, sarvasiddhim kuru kuru, sarvakaryani sadhaya sadhaya,
    gam gim gum gaim gaum gam ganapataye hum phat svaha | om namo ganapate mahavira dashabhuja madanakalavinashana
    mrityum hana hana, kalam samhara samhara, dhama dhama, matha matha, trailokyam mohaya mohaya, brahmavishnurudran
    mohaya mohaya, acintya bala parakrama, sarvavyadhin vinashaya, sarvagrahan curnaya curnaya, nagan
    motaya motaya, tribhuvaneshvara sarvatomukha hum phat svaha | om namo ganapate mahavira dashabhuja
    madanakalavinashana mrityum hana hana, dhama dhama, matha matha, kalam samhara samhara, sarvagrahan
    curnaya curnaya, nagan motaya motaya, rudrarupa, tribhuvaneshvara, sarvatomukha hum phat svaha | (bhutavishadi
    damano'yam)
  devanagari: ॐ क्लीं ह्रीं श्रीं ऐं ग्लौं ॐ ह्रीं क्रौं गं ॐ नमो भगवते महागणपतये स्मरणमात्रसन्तुष्टाय
    सर्वविद्याप्रकाशाय सर्वकामप्रदाय भवबन्धविमोचनाय ह्रीं सर्वभूतबन्धनाय क्रों साध्याकर्षणाय क्लीं जगत्त्रय
    वशीकरणाय सौः सर्वमनःक्षोभणाय श्रीं महासम्पत्प्रदाय ग्लौं भूमण्डलाधिपत्यप्रदाय महाज्ञानप्रदाय चिदानन्दात्मने
    गौरीनन्दनाय महायोगिने शिवप्रियाय सर्वानन्दवर्धनाय सर्वविद्याप्रकाशनप्रदाय द्रां चिरञ्जीविने ब्लूं
    सम्मोहनाय ॐ मोक्षप्रदाय, फट् वशीकुरु वशीकुरु, वौषडाकर्षणाय हुं विद्वेषणाय विद्वेषय विद्वेषय, फट् उच्चाटयोच्चाटय,
    ठः ठः स्तम्भय स्तम्भय, खें खें मारय मारय, शोषय शोषय, परमन्त्रयन्त्रतन्त्राणि छेदय छेदय, दुष्टग्रहान्निवारय
    निवारय, दुःखं हर हर, व्याधिं नाशय नाशय, नमः सम्पन्नाय सम्पन्नाय स्वाहा, सर्वपल्लवस्वरुपाय महाविद्याय
    गं गणपतये स्वाहा, यन्मन्त्रे क्षितलाञ्छिताभमनघं मृत्युश्च वज्राशिषो भूतप्रेतपिशाचकाः प्रतिहता निर्घातपातादिव,
    उत्पन्नं च समस्तदुःखदुरितं ह्युच्चाटनोत्पादकं वन्देऽभीष्टगणाधिपं भयहरं विघ्नौघनाशं परम्, ॐ गं गणपतये
    नमः । (वनदुर्गोपनिषदि) ॐ नमो महागणपतये, महावीराय, दशभुजाय, मदनकालविनाशन, मृत्युं हन हन, यम यम, मद
    मद, कालं संहर संहर, सर्वग्रहान् चूर्णय चूर्णय, नागान् मूढय मूढय, रुद्ररूप, त्रिभुवनेश्वर, सर्वतोमुख
    हुं फट् स्वाहा । ॐ नमो गणपतये, श्वेतार्कगणपतये, श्वेतार्कमूलनिवासाय, वासुदेवप्रियाय, दक्षप्रजापतिरक्षकाय,
    सूर्यवरदाय, कुमारगुरवे, ब्रह्मादिसुरासुरवन्दिताय, सर्पभूषणाय, शशाङ्कशेखराय, सर्पमालाऽलङ्कृतदेहाय,
    धर्मध्वजाय, धर्मवाहनाय, त्राहि त्राहि, देहि देहि, अवतर अवतर, गं गणपतये, वक्रतुण्डगणपतये, वरवरद, सर्वपुरुषवशङ्कर,
    सर्वदुष्टमृगवशङ्कर, सर्वस्ववशङ्कर, वशीकुरु वशीकुरु, सर्वदोषान् बन्धय बन्धय, सर्वव्याधीन् निकृन्तय
    निकृन्तय, सर्वविषाणी संहर संहर, सर्वदारिद्र्यं मोचय मोचय, सर्वविघ्नान् छिन्धि छिन्धि, सर्व वज्राणि
    स्फोटय स्फोटय, सर्वशत्रून् उच्चाटय उच्चाटय, सर्वसिद्धिं कुरु कुरु, सर्वकार्याणि साधय साधय, गां गीं
    गूं गैं गौं गं गणपतये हुं फट् स्वाहा । ॐ नमो गणपते महावीर दशभुज मदनकालविनाशन मृत्युं हन हन, कालं संहर
    संहर, धम धम, मथ मथ, त्रैलोक्यं मोहय मोहय, ब्रह्मविष्णुरूद्रान् मोहय मोहय, अचिन्त्य बल पराक्रम, सर्वव्याधीन्
    विनाशाय, सर्वग्रहान् चूर्णय चूर्णय, नागान् मोटय मोटय, त्रिभुवनेश्वर सर्वतोमुख हुं फट् स्वाहा । ॐ नमो
    गणपते महावीर दशभुज मदनकालविनाशन मृत्युं हन हन, धम धम, मथ मथ, कालं संहर संहर, सर्वग्रहान् चूर्णय चूर्णय,
    नागान् मोटय मोटय, रुद्ररूप, त्रिभुवनेश्वर, सर्वतोमुख हुं फट् स्वाहा । (भूतविषादि दमनोऽयम्)
