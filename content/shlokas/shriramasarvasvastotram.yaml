id: shriramasarvasvastotram
category: kavacha
name:
  english: shriramasarvasvastotram
  devanagari: श्रीरामसर्वस्वस्तोत्रम्
content:
  english: shriramasarvasvastotram || atha shriramasarvasvastotram || ramo mata matpitaramacandro bhrataramo
    matsakha ramacandrah | ramah svami rama evarthadata ramadanyam naiva jane na jane || 1|| ramah sevyo
    vandaniyo'pi ramo ramonityam madrishaishcitaniyah | ramo jnanam dhyanagamyo'pi ramo ramadanyam naiva
    jane na jane || 2|| ramo bhuktirmuktidata ca ramo ramo'smakam rajate rajarajah | loke'smabhirlokyate
    ramacandro ramadanyam naiva jane na jane || 3|| ramodharmah karmaramo madiyam ramomahyam karmasiddhipradata
    | ramo'jasrah karmasiddhisvarupi ramadanyam naiva jane na jane || 4|| ramo'smabhih pujaniyonitantam
    ramo'smabhih pratyaham kirtaniyah | ramo'smabhirgopaniyo guhante ramadanyam naiva jane na jane ||
    5|| ramo'smakam duhkhaharta trilokyam ramo'smakam karmakarta sadaiva | ramo'smakam karmabhuto vibhati
    ramadanyam naiva jane na jane || 6|| ramojnatih khyatirapyeva ramo ramah kirtih purtirapyeva ramah
    | sarvasvam me ramacandro'vanindro ramadanyam naiva jane na jane || 7|| grameranye jagare svapnakale
    marge durge gacchato'gacchato me | shashvalloke rakshakastveva ramo ramadanyam naiva jane na jane
    || 8|| ye vai trisandhyam prapathanti nityam shriramasarvasvamananya bhaktya | shriramaramena kritam
    kritarthaste'pyacyutam ramapadam prayanti || 9|| iti shriramasarvasvastotram sampurnam ||
  devanagari: श्रीरामसर्वस्वस्तोत्रम् ॥ अथ श्रीरामसर्वस्वस्तोत्रम् ॥ रामो माता मत्पितारामचन्द्रो भ्रातारामो
    मत्सखा रामचन्द्रः । रामः स्वामी राम एवार्थदाता रामादन्यं नैव जाने न जाने ॥ १॥ रामः सेव्यो वन्दनीयोऽपि
    रामो रामोनित्यं मादृशैश्चितनीयः । रामो ज्ञानं ध्यानगम्योऽपि रामो रामादन्यं नैव जाने न जाने ॥ २॥ रामो
    भुक्तिर्मुक्तिदाता च रामो रामोऽस्माकं राजते राजराजः । लोकेऽस्माभिर्लोक्यते रामचन्द्रो रामादन्यं नैव
    जाने न जाने ॥ ३॥ रामोधर्मः कर्मरामो मदीयं रामोमह्यं कर्मसिद्धिप्रदाता । रामोऽजस्रः कर्मसिद्धिस्वरूपी
    रामादन्यं नैव जाने न जाने ॥ ४॥ रामोऽस्माभिः पूजनीयोनितान्तं रामोऽस्माभिः प्रत्यहं कीर्तनीयः । रामोऽस्माभिर्गोपनीयो
    गुहान्ते रामदन्यं नैव जाने न जाने ॥ ५॥ रामोऽस्माकं दुःखहर्ता त्रिलोक्यां रामोऽस्माकं कर्मकर्ता सदैव
    । रामोऽस्माकं कर्मभूतो विभाति रामादन्यं नैव जाने न जाने ॥ ६॥ रामोज्ञातिः ख्यातिरप्येव रामो रामः कीर्तिः
    पूर्तिरप्येव रामः । सर्वस्वं मे रामचन्द्रोऽवनीन्द्रो रामादन्यं नैव जाने न जाने ॥ ७॥ ग्रामेरण्ये जागरे
    स्वप्नकाले मार्गे दुर्गे गच्छतोऽगच्छतो मे । शश्वल्लोके रक्षकस्त्वेव रामो रामादन्यं नैव जाने न जाने
    ॥ ८॥ ये वै त्रिसन्ध्यं प्रपठन्ति नित्यं श्रीरामसर्वस्वमनन्य भक्त्या । श्रीरामरामेण कृतं कृतार्थास्तेऽप्यच्युतं
    रामपदं प्रयान्ति ॥ ९॥ इति श्रीरामसर्वस्वस्तोत्रं सम्पूर्णम् ॥
