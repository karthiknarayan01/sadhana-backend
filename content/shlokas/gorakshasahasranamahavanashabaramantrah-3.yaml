    om nathapantha ke arbhibhavi nirmana namo svaha | om sabhi jisake vrini ho namo svaha | om asankhya
    marga dvara se atma darshana atmajnana pragata karta namo svaha | om shiva goraksha yogi namo svaha
    | 1000|| havana kriya ke pashcata sadhaka yogeshvara ne agni devata ko belapatri pushpa ashtagandha
    akshada ityadi samopacare ya pancopacara ya shodashopacara ya yatha labdhopacara se pujana kare tatha
    nimna panca agni patha padhakara havana kare | panca agnipatha tatha havana havana
