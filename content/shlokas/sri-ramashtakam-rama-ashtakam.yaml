id: sri-ramashtakam-rama-ashtakam
category: stotram
name:
  english: Sri Ramashtakam (Rama Ashtakam)
content:
  english: bhaje visheshasundaram samastapapakhandanam | svabhaktacittaranjanam sadaiva ramamadvayam ||
    || jatakalapashobhitam samastapapanashakam | svabhaktabhitibhanjanam bhaje ha ramamadvayam || || nijasvarupabodhakam
    kripakaram bhava'paham | samam shivam niranjanam bhaje ha ramamadvayam || || sada prapancakalpitam
    hyanamarupavastavam | nirakritim niramayam bhaje ha ramamadvayam || || nishprapanca nirvikalpa nirmalam
    niramayam | cidekarupasantatam bhaje ha ramamadvayam || || bhavabdhipotarupakam hyasheshadehakalpitam
    | gunakaram kripakaram bhaje ha ramamadvayam || || mahasuvakyabodhakairvirajamanavakpadaih | param
    ca brahma vyapakam bhaje ha ramamadvayam || || shivapradam sukhapradam bhavacchidam bhramapaham |
    virajamanadaishikam bhaje ha ramamadvayam || || ramashtakam pathati yah sukhadam supunyam vyasena
    bhashitamidam shrinute manushyah | vidyam shriyam vipulasaukhyamanantakirtim samprapya dehavilaye
    labhate ca moksham || || iti shrivyasa prokta shriramashtakam |
  devanagari: भजे विशेषसुन्दरं समस्तपापखण्डनम् । स्वभक्तचित्तरञ्जनं सदैव राममद्वयम् ॥ ॥ जटाकलापशोभितं
    समस्तपापनाशकम् । स्वभक्तभीतिभञ्जनं भजे ह राममद्वयम् ॥ ॥ निजस्वरूपबोधकं कृपाकरं भवाऽपहम् । समं शिवं
    निरञ्जनं भजे ह राममद्वयम् ॥ ॥ सदा प्रपञ्चकल्पितं ह्यनामरूपवास्तवम् । निराकृतिं निरामयं भजे ह राममद्वयम्
    ॥ ॥ निष्प्रपञ्च निर्विकल्प निर्मलं निरामयम् । चिदेकरूपसन्ततं भजे ह राममद्वयम् ॥ ॥ भवाब्धिपोतरूपकं
    ह्यशेषदेहकल्पितम् । गुणाकरं कृपाकरं भजे ह राममद्वयम् ॥ ॥ महासुवाक्यबोधकैर्विराजमानवाक्पदैः । परं च
    ब्रह्म व्यापकं भजे ह राममद्वयम् ॥ ॥ शिवप्रदं सुखप्रदं भवच्छिदं भ्रमापहम् । विराजमानदैशिकं भजे ह राममद्वयम्
    ॥ ॥ रामाष्टकं पठति यः सुखदं सुपुण्यं व्यासेन भाषितमिदं शृणुते मनुष्यः । विद्यां श्रियं विपुलसौख्यमनन्तकीर्तिं
    सम्प्राप्य देहविलये लभते च मोक्षम् ॥ ॥ इति श्रीव्यास प्रोक्त श्रीरामाष्टकम् ।
