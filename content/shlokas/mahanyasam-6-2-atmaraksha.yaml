id: mahanyasam-6-2-atmaraksha
category: stotram
name:
  english: Mahanyasam - 6.2. Atmaraksha
content:
  english: tman vadasrijata | tadakamayata | samatmana padyeyeti | atmanna mantrayata | tasmai dashamagm
    hutah pratyashrinot | sa dashahuto 'bhavat | dashahuto havai namaishah | tam m | dashahotetya cakshate
    parokshena | parokshapriya iva hi devah || mantrayata | tasmai saptamagm hutah pratyashrinot | sa
    saptahuto 'bhavat | saptahuto havai namaishah | tam va~ etagm saptahutagm santa m | saptahotetya cakshate
    parokshena | parokshapriya iva hi devah || mantrayata | tasmai shashthagm hutah pratyashrinot | sa
    shaddhuto 'bhavat | shaddhuto havai namaishah | tam va~ etagm shaddhutagm santa m | shaddhotetya cakshate
    parokshena | parokshapriya iva hi devah || mantrayata | tasmai pancamagm hutah pratyashrinot | sa
    pancahuto 'bhavat | pancahuto havai namaishah | tam mpancahutagm santa m | pancahotetya cakshate parokshena
    | parokshapriya iva hi devah || mantrayata | tasmai caturthagm hutah pratyashrinot | sa catur huto
    havai namaishah | tam hotetya cakshate parokshena | parokshapriya iva hi devah || vai~ me nedishthagm
    hutah pratyashraushih | tvayai nanakhyatara iti | tasmannuhainag hotara ityacakshate | tasma cchushrushuh
    putranagm hridyatamah | nedishtho hridyatamah | nedishtho brahmano bhavati | ya evam guhyadi mastakanta
    shadanganyasa
  devanagari: त्म॒न् वद॑सृजत । तद॑कामयत । समा॒त्मना॑ पद्ये॒येति॑ । आत्म॒न्ना म॑न्त्रयत । तस्मै॑ दश॒मग्ं
    हू॒तः प्रत्य॑शृणोत् । स दश॑हूतो ऽभवत् । दश॑हूतो ह॒वै नामै॒षः । तं म् । दश॑हो॒तेत्या च॑क्षते प॒रोक्षे॑ण
    । प॒रोक्ष॑प्रिया इव॒ हि दे॒वाः ॥ म॑न्त्रयत । तस्मै॑ सप्त॒मग्ं हू॒तः प्रत्य॑शृणोत् । स स॒प्तहू॑तो ऽभवत्
    । स॒प्तहू॑तो ह॒वै नामै॒षः । तं वाँ ए॒तग्ं स॒प्तहू॑त॒ग्ं॒ सन्त म् । स॒प्तहो॒तेत्या च॑क्षते प॒रोक्षे॑ण
    । प॒रोक्ष॑प्रिया इव॒ हि दे॒वाः ॥ म॑न्त्रयत । तस्मै॑ ष॒ष्ठग्ं हू॒तः प्रत्य॑शृणोत् । स षड्ढू॑तो ऽभवत्
    । षड्ढू॑तो ह॒वै नामै॒षः । तं वाँ ए॒तग्ं षड्ढू॑त॒ग्ं॒ सन्त म् । षड्ढो॒तेत्या च॑क्षते प॒रोक्षे॑ण । प॒रोक्ष॑प्रिया
    इव॒ हि दे॒वाः ॥ म॑न्त्रयत । तस्मै॑ पञ्च॒मग्ं हू॒तः प्रत्य॑शृणोत् । स पञ्च॑हूतो ऽभवत् । पञ्च॑हूतो ह॒वै
    नामै॒षः । तं म्पञ्च॑हूत॒ग्ं॒ सन्त म् । पञ्च॑हो॒तेत्या च॑क्षते प॒रोक्षे॑ण । प॒रोक्ष॑प्रिया इव॒ हि दे॒वाः
    ॥ म॑न्त्रयत । तस्मै॑ चतु॒र्थग्ं हू॒तः प्रत्य॑शृणोत् । स चतु॑र् हूतो ह॒वै नामै॒षः । तं हो॒तेत्या च॑क्षते
    प॒रोक्षे॑ण । प॒रोक्ष॑प्रिया इव॒ हि दे॒वाः ॥ वैँ मे॒ नेदि॑ष्ठग्ं हू॒तः प्रत्य॑श्रौषीः । त्वयै॑ नानाख्या॒तार॒
    इति॑ । तस्मा॒न्नुहै॑ना॒ग्॒ होतार॒ इत्याच॑क्षते । तस्मा च्छुश्रू॒षुः पु॒त्राणा॒ग्ं॒ हृद्य॑तमः । नेदि॑ष्ठो॒
    हृद्य॑तमः । नेदि॑ष्ठो॒ ब्रह्म॑णो भवति । य ए॒वं गुह्यादि मस्तकान्त षडङ्गन्यास
