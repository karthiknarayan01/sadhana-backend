id: yugalatilakamantrah
category: mantra
name:
  english: yugalatilakamantrah
  devanagari: युगलतिलकमन्त्रः
content:
  english: shrisvadharmabodhe shriyugalatilaka mantrahsankshepatah om kam keshavaya kirtyai namo namah
    | angulacatvari lalate || 1|| om nannarayanaya kirtyai namo namah | anguladasha nabhau || 2|| om mam
    madhavaya tushtyai namo namah | angulashta hridaye || 3|| om go govindaya tushtyai namo namah | angulacatushtayam
    kanthe || 4|| om vim vishnave dhrityai namo namah | anguladasha dakshinakukshau || 5|| om mam madhusudanaya
    shantyai namo namah | angula ashtadakshine bahau || 6|| om trim trivikramaya kriyayai namo namah |
    angulacatushtayam dakshinakandhare || 7|| om vam vamanaya hridayaya namo namah | anguladasha vamakukshau
    || 8|| om shrim shridharaya medhayai namo namah | angula ashta vamabahau || 9|| om hrim hrishikeshaya
    mayavine namo namah | angulacatushtayam vamakandhare || 10|| om padmanabhaya shraddhayai namo namah
    | angulacatushtayam prishthe || 11|| om dam damodaraya lajjayai namo namah | angulacatushtayam katyam
    || 12|| tatprajnanatoyena || om vasudevaya shriyai namo namah murdhni || om klim rasarasavilasinau
    shriradhakrishnau svaha || iti mantrena dvadashatilakamadhye samasukshmam muktakaram dharayet || iti
    shrinimbadityaprakashitasvadharmodbodhoyugma tilakamantrah sampurtimagat || shrikrishnarpanamastu
    ||
  devanagari: श्रीस्वधर्माबोधे श्रीयुगलतिलक मन्त्रःसङ्क्षेपतः ॐ कं केशवाय कीर्त्यै नमो नमः । अङ्गुलचत्वारि
    ललाटे ॥ १॥ ॐ नान्नारायणाय कीर्त्यै नमो नमः । अङ्गुलदश नाभौ ॥ २॥ ॐ मां माधवाय तुष्ट्यै नमो नमः । अङ्गुलाष्ट
    हृदये ॥ ३॥ ॐ गो गोविन्दाय तुष्ट्यै नमो नमः । अङ्गुलचतुष्टयं कण्ठे ॥ ४॥ ॐ विं विष्णवे धृत्यै नमो नमः
    । अङ्गुलदश दक्षिणकुक्षौ ॥ ५॥ ॐ मं मधुसूदनाय शान्त्यै नमो नमः । अङ्गुल अष्टदक्षिणे बाहौ ॥ ६॥ ॐ त्रिं
    त्रिविक्रमाय क्रियायै नमो नमः । अङ्गुलचतुष्टयं दक्षिणकन्धरे ॥ ७॥ ॐ वां वामनाय हृदयाय नमो नमः । अङ्गुलदश
    वामकुक्षौ ॥ ८॥ ॐ श्रीं श्रीधराय मेधायै नमो नमः । अङ्गुल अष्ट वामबाहौ ॥ ९॥ ॐ हृं हृषीकेशाय मायाविने
    नमो नमः । अङ्गुलचतुष्टयं वामकन्धरे ॥ १०॥ ॐ पद्मनाभाय श्रद्धायै नमो नमः । अङ्गुलचतुष्टयं पृष्ठे ॥ ११॥
    ॐ दां दामोदराय लज्जायै नमो नमः । अङ्गुलचतुष्टयं कट्याम् ॥ १२॥ तत्प्रज्ञानतोयेन ॥ ॐ वासुदेवाय श्रियै
    नमो नमः मूर्ध्नि ॥ ॐ क्लीं रासरसविलासिनौ श्रीराधाकृष्णौ स्वाहा ॥ इति मन्त्रेण द्वादशतिलकमध्ये समासूक्ष्मं
    मुक्ताकारं धारयेत् ॥ इति श्रीनिम्बादित्यप्रकाशितस्वधर्मोद्बोधोयुग्म तिलकमन्त्रः सम्पूर्तिमगात् ॥ श्रीकृष्णार्पणमस्तु
    ॥
