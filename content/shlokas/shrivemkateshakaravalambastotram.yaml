id: shrivemkateshakaravalambastotram
category: stotram
name:
  english: shrivemkateshakaravalambastotram
  devanagari: श्रीवेंकटेशकरावलम्बस्तोत्रम्
content:
  english: divyangaragaparicarcita komalanga pitambaravritatano tarunarka bhasa satyamca nabha paridhana
    supattu bandha shri venkatesha mama dehi karavalambam
  devanagari: दिव्याङ्गरागपरिचर्चित कोमलाङ्ग पीताम्बरावृततनो तरुणार्क भास सत्यांच नाभ परिधान सुपत्तु बन्ध
    श्री वेङ्कटेश मम देहि करावलम्बम्
meaning: {}
