id: shivaramakrishnasudhikritamjalakantheshvarashatakam
category: shataka
name:
  english: shivaramakrishnasudhikritamjalakantheshvarashatakam
  devanagari: शिवरामकृष्णसुधीकृतंजलकण्ठेश्वरशतकम्
content:
  english: lokaya sphutamurdhvalokamakhilam gatvapi bhuyah patan | bhrashyatketakasangato'nritagira sthanarcanairvarjito
    vande tam jalakanthadevamanisham vandarucintamanim || 16|| yah sarvam sacaracaram jagadidam nirmati
    narmani ca prapayyavati tat punashca samaye yah samharatyantatah | srishtyaditrayasakshimatrakataya
    yah kevalo vartate vande tam jalakanthadevamanisham vandarucintamanim || 17|| yashcaiko'khilabhutasantatiguhagridhah
    prakashatmako 'pyuccairvyapya jaganti rajati paricchinno'pi yah pranishu | karmadhyakshataya sthito
    bhavati yah sakshi param nirguno vande tam jalakanthadevamanisham vandarucintamanim || 18|| drashtapi
    svayamasya yastu jagatah sarvasya no drishyate manta yastu na manyate'pi vibudhaih shrotapi na shruyate
    | cakta na sphutamucyate kvacidapi jnatapi na jnayate vande tam jalakanthadevamanisham vandarucintamanim
    || 19|| rigbhiryam makhino makheshu niyatah shamsanti mantraih punah sadravyairyajusham yajanti vilasadganaishca
    yam samabhih | brahmadyah kila samstuvanti yadanudhyanadapastaihika vande tam jalakanthadevamanisham
    vandarucintamanim || 20|| yo'ntah sthavarajangameshu ca bahishcordhvam virajatyadhah karta karayita
    kriyapi ca havirboddha ca bodhyashca yah | bodhashca prabhavantyamandamatayo yadvedanaprodyama vande
    tam jalakanthadevamanisham vandarucintamanim || 21|| yadbodhaya kilacaranti sumahat tivram tapo yogino
    yagam bhuparicankramam nirashanam tirthabhishekam muhuh | danani prathitani shodasha maharajashca
    bhogatyajo vande tam jalakanthadevamanisham vandarucintamanim || 22|| keciddhanyatamah sthira api
    grihe saddeshikoktya sphutam shrutyantarthamanantasaukhyagamakam bhuyastaram janate | gahante'pi ca
    punyatirthanikaram yasya prasadat param vande tam jalakanthadevamanisham vandarucintamanim || 23||
    yam dhyayan manasi kshanam girijaya gadhopagudham prabhum saskandam savinayakam suraganadhyaksham
    mahokshashrayam | svarajyam ca caracarasya bhajate sargadishu prabhavam vande tam jalakanthadevamanisham
    vandarucintamanim || 24|| yatpadamburuharcanam savinayam svasyekshanambhoruha padmasthanajusha vidhaya
    bhagavan narayanastarakshanat | bhaktagresaratamavapya sarasijatakshatamabhyagat vande tam jalakanthadevamanisham
    vandarucintamanim || 25|| vedanta nikhila yameva paramatmanam samacakshate yattattvavagamaya nishcitadhiyo
    muhyanti nanagira | shuddham buddhamanantamujjhitagunam shamsanti yam cagama vande tam jalakanthadevamanisham
    candarucintamanim || 26|| kopavyakulitena darukavane samsthasnuna bhusura
  devanagari: लोकाय स्फुटमूर्ध्वलोकमखिलं गत्वापि भूयः पतन् । भ्रश्यत्केतकसङ्गतोऽनृतगिरा स्थानार्चनैर्वर्जितो
    वन्दे तं जलकण्ठदेवमनिशं वन्दारुचिन्तामणिम् ॥ १६॥ यः सर्वं सचराचरं जगदिदं निर्माति नर्माणि च प्रापय्यावति
    तत् पुनश्च समये यः संहरत्यन्ततः । सृष्ट्यादित्रयसाक्षिमात्रकतया यः केवलो वर्तते वन्दे तं जलकण्ठदेवमनिशं
    वन्दारुचिन्तामणिम् ॥ १७॥ यश्चैकोऽखिलभूतसन्ततिगुहागृढः प्रकाशात्मको ऽप्युच्चैर्व्याप्य जगन्ति राजति
    परिच्छिन्नोऽपि यः प्राणिषु । कर्माध्यक्षतया स्थितो भवति यः साक्षी परं निर्गुणो वन्दे तं जलकण्ठदेवमनिशं
    वन्दारुचिन्तामणिम् ॥ १८॥ द्रष्टापि स्वयमस्य यस्तु जगतः सर्वस्य नो दृश्यते मन्ता यस्तु न मन्यतेऽपि
    विबुधैः श्रोतापि न श्रूयते । चक्ता न स्फुटमुच्यते क्वचिदपि ज्ञातापि न ज्ञायते वन्दे तं जलकण्ठदेवमनिशं
    वन्दारुचिन्तामणिम् ॥ १९॥ ऋग्भिर्यं मखिनो मखेषु नियताः शंसन्ति मन्त्रैः पुनः सद्रव्यैर्यजुषां यजन्ति
    विलसद्गानैश्च यं सामभिः । ब्रह्माद्याः किल संस्तुवन्ति यदनुध्यानादपास्तैहिका वन्दे तं जलकण्ठदेवमनिशं
    वन्दारुचिन्तामणिम् ॥ २०॥ योऽन्तः स्थावरजङ्गमेषु च बहिश्चोर्ध्वं विराजत्यधः कर्ता कारयिता क्रियापि
    च हविर्बोद्धा च बोध्यश्च यः । बोधश्च प्रभवन्त्यमन्दमतयो यद्वेदनप्रोद्यमा वन्दे तं जलकण्ठदेवमनिशं वन्दारुचिन्तामणिम्
    ॥ २१॥ यद्बोधाय किलाचरन्ति सुमहत् तीव्रं तपो योगिनो यागं भूपरिचङ्क्रमं निरशनं तीर्थाभिषेकं मुहुः ।
    दानानि प्रथितानि षोडश महाराजाश्च भोगत्यजो वन्दे तं जलकण्ठदेवमनिशं वन्दारुचिन्तामणिम् ॥ २२॥ केचिद्धन्यतमाः
    स्थिरा अपि गृहे सद्देशिकोक्त्या स्फुटं श्रुत्यन्तार्थमनन्तसौख्यगमकं भूयस्तरां जानते । गाहन्तेऽपि च
    पुण्यतीर्थनिकरं यस्य प्रसादात् परं वन्दे तं जलकण्ठदेवमनिशं वन्दारुचिन्तामणिम् ॥ २३॥ यं ध्यायन् मनसि
    क्षणं गिरिजया गाढोपगूढं प्रभुं सस्कन्दं सविनायकं सुरगणाध्यक्षं महोक्षाश्रयम् । स्वाराज्यं च चराचरस्य
    भजते सर्गादिषु प्राभवं वन्दे तं जलकण्ठदेवमनिशं वन्दारुचिन्तामणिम् ॥ २४॥ यत्पादाम्बुरुहार्चनं सविनयं
    स्वस्येक्षणाम्भोरुहा पद्मस्थानजुषा विधाय भगवान् नारायणस्तरक्षणात् । भक्ताग्रेसरतामवाप्य सरसीजाताक्षतामभ्यगात्
    वन्दे तं जलकण्ठदेवमनिशं वन्दारुचिन्तामणिम् ॥ २५॥ वेदान्ता निखिला यमेव परमात्मानं समाचक्षते यत्तत्त्वावगमाय
    निश्चितधियो मुह्यन्ति नानागिरा । शुद्धं बुद्धमनन्तमुज्झितगुणं शंसन्ति यं चागमा वन्दे तं जलकण्ठदेवमनिशं
    चन्दारुचिन्तामणिम् ॥ २६॥ कोपव्याकुलितेन दारुकवने संस्थास्नुना भूसुर
