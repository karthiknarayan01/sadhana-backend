id: batukabhairavasahasranamastotram-4
category: sahasranama
name:
  english: batukabhairavasahasranamastotram 4
  devanagari: बटुकभैरवसहस्रनामस्तोत्रम् ४
content:
  english: shribatukabhairavasahasranamastotram 4 shiva uvaca | evam shribatukam dhyayetridha bhinnam
    gunaih kramat | shantike sattvikam dhyanam vashyadau rajasam matam || 1|| maranadau tamasam taddevam
    dhyayenmaheshvaram | evam dhyatva prasannatma stotrametatpathennarah || 2|| atha namani | om batuko
    batukadhisho vatapritirvateshayah | vipanirvajrapanishca vajrabho vajravallabhah || 3|| vamacarapriyo
    vakro vakragraso visharadah | vishapo vighnaharta ca vetaladhyo vicakshanah || 4|| vishvavyapi vishvanatho
    vishvo balaparakramah | vishvavandyo vishvarupo vishvadharo vikiranah || 5|| vaidyo balo virad vishnurvyomakeshashca
    vashyakrit | balibhugbalibhunnatho bahunetro baro bali || 6|| vyadhighati vyadhikaro vyadhyatma vyadhivepanah
    | kankaladhari kandarpa kami kantah kalanidhih || 7|| kamarupah kamacari kalpavitkaminipriyah | kotareshah
    kotapatih kamaniyah kapalabhrit || 8|| kankalah kruradrikkalah karalah kokilasvanah | kapardi kambukanthashca
    kambumali kaladharah || 9|| kaminivashakritkaulah kulinah kularakshakah | kapalamali kubjashca kanvah
    kanthiravah kavih || 10|| kalakashthatanuh kalashamanah kambukundali | kurangi kapilah kiri kumarah
    kopanah kavih || 11|| kankali kapishah keshi keshari kesharapriyah | kaupinadhari kitavah kitavaghnah
    kaladharah || 12|| kamalavallabhah kuthah kathorakiranah kshanah | kaushikah kaushikadharah kushabhritkushatalpagah
    || 13|| kushali kashmalakarshi kashmiri kararatnabhrit | kritaghnashca kritajnashca kritaviryah kapidhvajah
    || 14|| kushilavah kushilashca ketaki ketakipriyah | kadambariyah kadambah kalakanthah kapinjali ||
    15|| kaitabharih kamsamarddi kurangavadanah kushah | bhudharo bhudharadhisho bhairavo bhairavipriyah
    || 16|| bhutatma bhutapo bhubhrit bhrigujo bhudharatmajah | bhavasunurbhavo bhirurbhramaro bhutasambhavah
    || 17|| bhishano bhairavinatho bhagavanbhogibhushanah | bhasmadhari bhramaharo bhutadhyakshashca bhikshukah
    || 18|| bhrunaha bhutaha bhuto bhito'bhito'bhayankarah | kharantakritkharparashih khadgapanih khalapriyah
    || 19|| khandabhuh khandaparashuh khadgi khatvangabhritkhalah | khecarah khecari nathah khapurah khaganayakah
    || 20|| khelapriyah khatakirtih kharanadah kharavratah | khecarikrit khetakabhrit khatitah khandavashanah
    || 21|| gandharvagito gangesho gopatirgopikapatih | garvishtho garvaha geyo gauro gaurisuto guruh
    || 22|| girvanagito girvano gadho gadhandhakaraha | geyo garudago go'vo gupto gopta garashanah ||
    23|| gajakrittidharo gunjo gunjaharadharo gajah | geyapriyo gahvarago gunjastho gunjagayakah || 24||
    govarddhanadharo goshtharakshako gokulapriyah | gambhiro godhano gopo godhabhridgirijatmajah || 25||
    jagadisho janadhyaksho jivano jivanapriyah | jivanujivanacchedi jivitatma janardanah || 26|| jrimbhanashca
    javi jivo jaino jainajayankara | japapriyo japasakto japako japakarthakrit || 27|| jambushyamo jitakrodho
    jitaratirjitasurah | jambuko janakijanirjatilo janamejayah || 28|| jirno jirnojjvalannetro jamadagnyo
    jayapradah | jhashaketurjhashaharo jhintisho jhashabhojitah || 29|| jhankarakari jhampi ca jhashavanjhashavallabhah
    | madhuro madiramatto meghanado mrigadhipah || 30|| madhumatto madyagandho medasvi meghadidhitih |
    modano medininatho maghava mandabhushanah || 31|| madhukaripriyo matto medhavi madhusudanah | madano
    madanaprito mukundo madano marut || 32|| atha navashlokah kshepakah | makaro madhavo mino minaketurmaheshvarah
    | maheshurmadano mantho mithunesho'maradhipah || 33|| maricirmanjulo moho mohaha mohamardanah | mohako
    mohano meghapriyo mohavinayakah || 34|| mahipatirmahishano mahirajo manoharah | mahishvaro mahipalo
    mahinatho mahipriyah || 35|| mahidharo mahadevo manurajo munipriyah | mani maunadharo megho mandiro
    mativarddhanah || 36|| matido mantharo mantro mantrisho mantranayakah | medhavi manado mani manaha
    manamardanah || 37|| minago makaradhisho madhuro maniranjitah | maniramyo manibhrata manimandanamanditah
    || 38|| mantrapo mantrado mugdho mokshado mokshavallabhah | mallo mallapriyo manco mallako melanaprabhuh
    || 39|| malliko mallikagandhi mallikakusumapriyah | malatisho maghanatho'moghamurtimagheshvarah ||
    40|| yacako yajniko yajno yajnesho yajnavarddhanah | ramapatirramadhisho ramesho ramavallabhah ||
    41|| iti kshepakah | dhanesho dhruvadhurdhimandhishano dhumralocanah | data dapayita durgo danto dantashayo
    damah || 42|| devo devadhipo davo duhkhaha duhkhasevitah | daridro darado daro devatatma dami dayi
    || 43|| dandakriddandaha dipto diptakesho dayanvitah | darvikaro dari dirgho dipano dipavallabhah
    || 44|| digambaro dirghadamshtro dakshino dakshinodarah | damshtri damshtripriyo daityo divyo divyaparakramah
    || 45|| daityaha dakshinarhashca dirghaprishtho divakarah | ghantavadi ghanaravo ghanabho ghutkaro
    ghanah || 46|| ghantapathi ghato ghuko ghadhvakaraparivaritah | ghani gharmamshuraghaha ghataha ghatakarakah
    || 47|| ghoro ghanaghano'rghisho ghasmaro ghoraghoshavan | chagalandashchalacchetta chatri chatachavishchali
    || 48|| chagalaksho chado chinnashchucchurikashchidankurah | chandashchandapriyashchandashchidurashchadmahochritah
    || 49|| tapaniyaprabhajatastarunastarunipriyah | tundilastapanasteyastomarastomarapriyah || 50|| tushkasturushkastilabhuk
    trimurtistripurantakah | trishuladhari trishirshi tripurashca trilokapah || 51|| trinetrastripuravasastejasvi
    tridivaspatih | trivikramastrinavarttastriptastriptipriyastamah || 52|| tamopahastimistreshastridashastrishvarastapah
    | trinetratanayastigmastamomurtistamomayah || 53|| tapanastodanastreta taranathastrilocanah | nityo
    niranjano neta nitijno nayavallabhah || 54|| nandano nipuno namronamro'nemirnimirnayah | nagaharo
    nagapasho nityakamo natipriyah || 55|| nirmamo namano nanyo naigamo naigameshvarah | nityaklinno nityanavo
    niruddho nandadipakah || 56|| nirmalo nirmalakaro nyastanindo nadishvarah | nakshatranatho nigamo
    nigamarambhako navah || 57|| nidhisho nirahankaro nanarupi namerukah | nastikari nastikaha nishcito
    nishcitashayah || 58|| nishcalo'nekavadano natho narayano nakhi | narakaghno narakado nilo nilalako'nalah
    || 59|| nilambaro nilakantho nilajimutasannibhah | panditah pancavadanah pancamah pancamapriyah ||
    60|| pancayajnah pancavatah pancavittah pavipriyah | pancashleshma pancabanah pancasthanah parantapah
    || 61|| paramayuh parah padmi padmeshah padmavallabhah | padmanabhah padmamukhah padmah padmasanasthitah
    || 62|| padmajah padmanilayah padmagandhah paratparah | parvatah parvatadharah paradah paradapriyah
    || 63|| paradaraparah praudhah patuh panduralocanah || 64|| petabhritpetakritpeti pannagi pannageshvarah
    | panduha pandurah pindi pancabhutaprashasanah || 65|| patangah pakshirajashca paralokapradah prabhuh
    | panadah panapah pani panarunavilocanah || 66|| pishacaghnah pishaceshah pishitashi pitamahah | pita
    pratapavanpashi pashinathah pashupriyah || 67|| pashubhokta pashupatih pashupreshtha pashudarah |
    pinasarih pipasarttah pidakritpidanashanah || 68|| pretaghnah pretakulapah pretavahah prakampanah
    | pretanathah pretapujyah pitavasah prajagarah || 69|| prajapatih prajanathah paripurnah priyo'priyah
    | parjanyakritprashamanah paramah paramaspadah || 70|| prasannagah praticchannah pratibhakritprapujitah
    | pramehaghnah pramehi ca pramehakridathaprabhah || 71|| pramah pramadaha praudhah praudhidah praudhivallabhah
    | premadah pramadapremi pramadah pramadapriyah || 72|| prakamadah prakameshah pranadah pranavallabhah
    | pranadharah prayagashca prayaganilayapradah || 73|| paricarah parivarah prashantah pratibhanavan
    | preyah preyaviyogi ca pramathashca priyamvadah || 74|| sarameyanugah sidhuh sidhuh sidhupavallabhah
    | savadhanah sadhupujyah sarameyadharah samah || 75|| sarvapattaranah siddhah siddhidah siddhisevitah
    | samantabhadrah santoshi satyah satyaparakramah || 76|| satyasandhah satyavakta satpadah satyavallabhah
    | satyabhamapatih shurah sampannahsampadalayah || 77|| sarasvan sagarah setuh setukritsetupalakah
    | samudrasimasamantah smararih satyasangarah || 78|| smarah smarapriyah smerah smaradah smarasundarah
    | samiddhah sammadah sindhuh samagah samagarcitah || 79|| samayah samayacarah shankarapriyabandhavah
    | sammohadah samshayadah samshayaghnah samuddhatah || 80|| somah somadharah saumyah saumyah shantajanapriyah
    | sundarah sundaradharah surapah surasah surah || 81|| surasaktah sugamodi surapalah suratriyah |
    svargah svargapatih svargi svargadah svargavallabhah || 82|| sukhi sukhakarah saukhyasindhuh sindhuranayakah
    | sarasvatah svanubhavah svanubhavasvanudhru
  devanagari: श्रीबटुकभैरवसहस्रनामस्तोत्रम् ४ शिव उवाच । एवं श्रीबटुकं ध्यायेत्रिधा भिन्नं गुणैः क्रमात्
    । शान्तिके सात्त्विकं ध्यानं वश्यादौ राजसं मतम् ॥ १॥ मारणादौ तामसं तद्देवं ध्यायेन्महेश्वरम् । एवं
    ध्यात्वा प्रसन्नात्मा स्तोत्रमेतत्पठेन्नरः ॥ २॥ अथ नामानि । ॐ बटुको बटुकाधीशो वटप्रीतिर्वटेशयः । विपाणिर्वज्रपाणिश्च
    वज्राभो वज्रवल्लभः ॥ ३॥ वामाचारप्रियो वक्रो वक्रग्रासो विशारदः । विशापो विघ्नहर्ता च वेतालाढ्यो विचक्षणः
    ॥ ४॥ विश्वव्यापी विश्वनाथो विश्वो बालपराक्रमः । विश्ववन्द्यो विश्वरूपो विश्वाधारो विकीरणः ॥ ५॥ वैद्यो
    बालो विराड् विष्णुर्व्योमकेशश्च वश्यकृत् । बलिभुग्बलिभुङ्नाथो बहुनेत्रो बरो बली ॥ ६॥ व्याधिघाती व्याधिकरो
    व्याध्यात्मा व्याधिवेपनः । कङ्कालधारी कन्दर्प कामी कान्तः कलानिधिः ॥ ७॥ कामरूपः कामचारी कल्पवित्कामिनीप्रियः
    । कोटरेशः कोटपतिः कमनीयः कपालभृत् ॥ ८॥ कङ्कालः क्रूरदृक्कालः करालः कोकिलस्वनः । कपर्दी कम्बुकण्ठश्च
    कम्बुमाली कलाधरः ॥ ९॥ कामिनीवशकृत्कौलः कुलीनः कुलरक्षकः । कपालमाली कुब्जश्च कण्वः कण्ठीरवः कविः ॥
    १०॥ कलाकाष्ठातनुः कालशमनः कम्बुकुण्डली । कुरङ्गी कपिलः कीरी कुमारः कोपनः कविः ॥ ११॥ कङ्काली कपिशः
    केशी केशरी केशरप्रियः । कौपीनधारी कितवः कितवघ्नः कलाधरः ॥ १२॥ कमलावल्लभः कुठः कठोरकिरणः क्षणः । कौशिकः
    कौशिकधरः कुशभृत्कुशतल्पगः ॥ १३॥ कुशली कश्मलाकर्षी काश्मिरी कररत्नभृत् । कृतघ्नश्च कृतज्ञश्च कृतवीर्यः
    कपिध्वजः ॥ १४॥ कुशीलवः कुशीलश्च केतकी केतकीप्रियः । कादम्बरीयः कादम्बः कलकण्ठः कपिञ्जली ॥ १५॥ कैटभारिः
    कंसमर्द्दी कुरङ्गवदनः कुशः । भूधरो भूधराधीशो भैरवो भैरवीप्रियः ॥ १६॥ भूतात्मा भूतपो भूभृत् भृगुजो
    भूधरात्मजः । भवसूनुर्भवो भीरुर्भ्रामरो भूतसम्भवः ॥ १७॥ भीषणो भैरवीनाथो भगवान्भोगिभूषणः । भस्मधारी
    भ्रमहरो भूताध्यक्षश्च भिक्षुकः ॥ १८॥ भ्रूणहा भूतहा भूतो भीतोऽभीतोऽभयङ्करः । खरान्तकृत्खर्पराशिः खड्गपाणिः
    खलाप्रियः ॥ १९॥ खण्डभूः खण्डपरशुः खड्गी खट्वाङ्गभृत्खलः । खेचरः खेचरी नाथः खपुरः खगनायकः ॥ २०॥ खेलाप्रियः
    खातकीर्तिः खरनादः खरव्रतः । खेचरीकृत् खेटकभृत् खातीतः खाण्डवाशनः ॥ २१॥ गन्धर्वगीतो गङ्गेशो गोपतिर्गोपिकापतिः
    । गर्विष्ठो गर्वहा गेयो गौरो गौरीसुतो गुरुः ॥ २२॥ गीर्वाणगीतो गीर्वाणो गाढो गाढान्धकारहा । गेयो गरुडगो
    गोऽवो गुप्तो गोप्ता गराशनः ॥ २३॥ गजकृत्तिधरो गुञ्जो गुञ्जाहारधरो गजः । गेयप्रियो गह्वरगो गुञ्जस्थो
    गुञ्जगायकः ॥ २४॥ गोवर्द्धनधरो गोष्ठरक्षको गोकुलप्रियः । गम्भीरो गोधनो गोपो गोधाभृद्गिरिजात्मजः ॥ २५॥
    जगदीशो जनाध्यक्षो जीवनो जीवनप्रियः । जीवानुजीवनच्छेदी जीवितात्मा जनार्दनः ॥ २६॥ जृम्भणश्च जवी जीवो
    जैनो जैनजयङ्कर । जपप्रियो जपासक्तो जापको जपकार्थकृत् ॥ २७॥ जम्बूश्यामो जितक्रोधो जितारातिर्जितासुरः
    । जम्बुको जानकीजानिर्जटिलो जनमेजयः ॥ २८॥ जीर्णो जीर्णोज्ज्वलन्नेत्रो जामदग्न्यो जयप्रदः । झषकेतुर्झषहरो
    झिण्टीशो झषभोजितः ॥ २९॥ झङ्कारकारी झम्पी च झषवान्झषवल्लभः । मधुरो मदिरामत्तो मेघनादो मृगाधिपः ॥ ३०॥
    मधुमत्तो मद्यगन्धो मेदस्वी मेघदीधितिः । मोदनो मेदिनीनाथो मघवा मण्डभूषणः ॥ ३१॥ माधुकरीप्रियो मत्तो
    मेधावी मधुसूदनः । मदनो मदनप्रीतो मुकुन्दो मादनो मरुत् ॥ ३२॥ अथ नवश्लोकाः क्षेपकाः । मकरो माधवो मीनो
    मीनकेतुर्महेश्वरः । महेषुर्मदनो मन्थो मिथुनेशोऽमराधिपः ॥ ३३॥ मरीचिर्मञ्जुलो मोहो मोहहा मोहमर्दनः ।
    मोहको मोहनो मेघप्रियो मोहविनायकः ॥ ३४॥ महीपतिर्महीशानो महीराजो मनोहरः । महीश्वरो महीपालो महीनाथो महीप्रियः
    ॥ ३५॥ महीधरो महादेवो मनुराजो मुनिप्रियः । मानी मौनधरो मेघो मन्दिरो मतिवर्द्धनः ॥ ३६॥ मतिदो मन्थरो
    मन्त्रो मन्त्रीशो मन्त्रनायकः । मेधावी मानदो मानी मानहा मानमर्दनः ॥ ३७॥ मीनगो मकराधीशो मधुरो मणिरञ्जितः
    । मणिरम्यो मणिभ्राता मणिमण्डनमण्डितः ॥ ३८॥ मन्त्रपो मन्त्रदो मुग्धो मोक्षदो मोक्षवल्लभः । मल्लो मल्लप्रियो
    मञ्चो मल्लको मेलनप्रभुः ॥ ३९॥ मल्लिको मल्लिकागन्धी मल्लिकाकुसुमप्रियः । मालतीशो मघानाथोऽमोघमूर्तिमघेश्वरः
    ॥ ४०॥ याचको याज्ञिको यज्ञो यज्ञेशो यज्ञवर्द्धनः । रमापतिर्रमाधीशो रमेशो रामवल्लभः ॥ ४१॥ इति क्षेपकाः
    । धनेशो ध्रुवधूर्धीमान्धिषणो धूम्रलोचनः । दाता दापयिता दुर्गो दान्तो दान्ताशयो दमः ॥ ४२॥ देवो देवाधिपो
    दावो दुःखहा दुःखसेवितः । दरिद्रो दारदो दारो देवतात्मा दमी दयी ॥ ४३॥ दण्डकृद्दण्डहा दीप्तो दीप्तकेशो
    दयान्वितः । दार्वीकरो दरी दीर्घो दीपनो दीपवल्लभः ॥ ४४॥ दिगम्बरो दीर्घदंष्ट्रो दक्षिणो दक्षिणोदरः ।
    दंष्ट्री दंष्ट्रिप्रियो दैत्यो दिव्यो दिव्यपराक्रमः ॥ ४५॥ दैत्यहा दक्षिणार्हश्च दीर्घपृष्ठो दिवाकरः
    । घण्टावादी घनरवो घनाभो घूत्करो घनः ॥ ४६॥ घण्टापथी घटो घूको घध्वकरपरिवारितः । घणी घर्मांशुरघहा घातहा
    घातकारकः ॥ ४७॥ घोरो घनाघनोऽर्घीशो घस्मरो घोरघोषवान् । छगलण्डश्छलच्छेत्ता छत्री छातछविश्छली ॥ ४८॥ छगलाक्षो
    छदो छिन्नश्छुच्छुरीकश्छिदाङ्कुरः । छन्दश्छन्दप्रियश्छन्दश्छिदुरश्छद्महोछ्रितः ॥ ४९॥ तपनीयप्रभजटस्तरुणस्तरुणीप्रियः
    । तुन्दिलस्तपनस्तेयस्तोमरस्तोमरप्रियः ॥ ५०॥ तुष्कस्तुरुष्कस्तिलभुक् त्रिमूर्तिस्त्रिपुरान्तकः । त्रिशूलधारी
    त्रिशीर्षी त्रिपुरश्च त्रिलोकपः ॥ ५१॥ त्रिनेत्रस्त्रिपुरावासस्तेजस्वी त्रिदिवस्पतिः । त्रिविक्रमस्तृणावर्त्तस्तृप्तस्तृप्तिप्रियस्तमः
    ॥ ५२॥ तमोपहस्तिमिस्त्रेशस्त्रिदशस्त्रीश्वरस्तपः । त्रिनेत्रतनयस्तिग्मस्तमोमूर्तिस्तमोमयः ॥ ५३॥ तापनस्तोदनस्त्रेता
    तारानाथस्त्रिलोचनः । नित्यो निरञ्जनो नेता नीतिज्ञो नयवल्लभः ॥ ५४॥ नन्दनो निपुणो नम्रोनम्रोऽनेमिर्निमिर्नयः
    । नागहारो नागपाशो नित्यकामो नतिप्रियः ॥ ५५॥ निर्ममो नमनो नान्यो नैगमो नैगमेश्वरः । नित्यक्लिन्नो नित्यनवो
    निरुद्धो नन्ददीपकः ॥ ५६॥ निर्मलो निर्मलाकारो न्यस्तनिन्दो नदीश्वरः । नक्षत्रनाथो निगमो निगमारम्भको
    नवः ॥ ५७॥ निधीशो निरहङ्कारो नानारूपी नमेरुकः । नास्तिकारी नास्तिकहा निश्चितो निश्चिताशयः ॥ ५८॥ निश्चलोऽनेकवदनो
    नाथो नारायणो नखी । नरकघ्नो नरकदो नीलो नीलालकोऽनलः ॥ ५९॥ नीलाम्बरो नीलकण्ठो नीलजीमूतसन्निभः । पण्डितः
    पञ्चवदनः पञ्चमः पञ्चमप्रियः ॥ ६०॥ पञ्चयज्ञः पञ्चवातः पञ्चवित्तः पविप्रियः । पञ्चश्लेष्मा पञ्चबाणः
    पञ्चस्थानः परन्तपः ॥ ६१॥ परमायुः परः पद्मी पद्मेशः पद्मवल्लभः । पद्मनाभः पद्ममुखः पद्मः पद्मासनस्थितः
    ॥ ६२॥ पद्मजः पद्मनिलयः पद्मगन्धः परात्परः । पर्वतः पर्वताधारः पारदः पारदप्रियः ॥ ६३॥ परदारपरः प्रौढः
    पटुः पाण्डुरलोचनः ॥ ६४॥ पेटभृत्पेटकृत्पेटी पन्नगी पन्नगेश्वरः । पाण्डुहा पाण्डुरः पिण्डी पञ्चभूतप्रशासनः
    ॥ ६५॥ पतङ्गः पक्षिराजश्च परलोकप्रदः प्रभुः । पानदः पानपः पानी पानारुणविलोचनः ॥ ६६॥ पिशाचघ्नः पिशाचेशः
    पिशिताशी पितामहः । पिता प्रतापवान्पाशी पाशिनाथः पशुप्रियः ॥ ६७॥ पशुभोक्ता पशुपतिः पशुप्रेष्ठ पशूदरः
    । पीनसारिः पिपासार्त्तः पीडाकृत्पीडनाशनः ॥ ६८॥ प्रेतघ्नः प्रेतकुलपः प्रेतवाहः प्रकम्पनः । प्रेतनाथः
    प्रेतपूज्यः पीतवासाः प्रजागरः ॥ ६९॥ प्रजापतिः प्रजानाथः परिपूर्णः प्रियोऽप्रियः । पर्जन्यकृत्प्रशमनः
    परमः परमास्पदः ॥ ७०॥ प्रसन्नगः प्रतिच्छन्नः प्रतिभाकृत्प्रपूजितः । प्रमेहघ्नः प्रमेही च प्रमेहकृदथप्रभः
    ॥ ७१॥ प्रमः प्रमादहा प्रौढः प्रौढिदः प्रौढिवल्लभः । प्रेमदः प्रमदाप्रेमी प्रमदः प्रमदाप्रियः ॥ ७२॥
    प्रकामदः प्रकामेशः प्राणदः प्राणवल्लभः । प्राणाधारः प्रयागश्च प्रयागनिलयप्रदः ॥ ७३॥ परिचारः परिवरः
    प्रशान्तः प्रतिभानवान् । प्रेयः प्रेयवियोगी च प्रमथश्च प्रियंवदः ॥ ७४॥ सारमेयानुगः सीधुः सीधुः सीधुपवल्लभः
    । सावधानः साधुपूज्यः सारमेयधरः समः ॥ ७५॥ सर्वापत्तारणः सिद्धः सिद्धिदः सिद्धिसेवितः । सामन्तभद्रः
    सन्तोषी सत्यः सत्यपराक्रमः ॥ ७६॥ सत्यसन्धः सत्यवक्ता सत्पदः सत्यवल्लभः । सत्यभामापतिः शूरः सम्पन्नःसम्पदालयः
    ॥ ७७॥ सरस्वान् सागरः सेतुः सेतुकृत्सेतुपालकः । समुद्रसीमासामन्तः स्मरारिः सत्यसङ्गरः ॥ ७८॥ स्मरः स्मरप्रियः
    स्मेरः स्मरदः स्मरसुन्दरः । समिद्धः सम्मदः सिन्धुः सामगः सामगार्चितः ॥ ७९॥ समयः समयाचारः शङ्करप्रियबान्धवः
    । सम्मोहदः संशयदः संशयघ्नः समुद्धतः ॥ ८०॥ सोमः सोमधरः सौम्यः सौम्यः शान्तजनप्रियः । सुन्दरः सुन्दराधारः
    सुरापः सुरसः सुरः ॥ ८१॥ सुरासक्तः सुगमोदी सुरापालः सुरात्रियः । स्वर्गः स्वर्गपतिः स्वर्गी स्वर्गदः
    स्वर्गवल्लभः ॥ ८२॥ सुखी सुखाकरः सौख्यसिन्धुः सिन्धुरनायकः । सारस्वतः स्वानुभवः स्वानुभावस्वानुध्रु
