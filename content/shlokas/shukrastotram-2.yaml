id: shukrastotram-2
category: stotram
name:
  english: shukrastotram 2
  devanagari: शुक्रस्तोत्रम् २
content:
  english: shukrastotram 2 shriganeshaya namah | shukrah kavyah shukrareta shuklambaradharah sudhih |
    himabhah kuntadhavalah shubhramshuh shuklabhushanah || 1|| nitijno nitikrinnitimargagami grahadhipah
    | ushana vedavedangaparagah kaviratmavit || 2|| bhargavah karunah sindhurjnanagamyah sutapradah |
    shukrasyaitani namani shukram smritva tu yah pathet || 3|| ayurdhanam sukham putram lakshmimvasatimuttamam
    | vidyam caiva svayam tasmai shukrastushtodadati ca || 4|| iti shriskandapurane shukrastotram sampurnam
    |
  devanagari: शुक्रस्तोत्रम् २ श्रीगणेशाय नमः । शुक्रः काव्यः शुक्ररेता शुक्लाम्बरधरः सुधीः । हिमाभः कुन्तधवलः
    शुभ्रांशुः शुक्लभूषणः ॥ १॥ नीतिज्ञो नीतिकृन्नीतिमार्गगामी ग्रहाधिपः । उशना वेदवेदाङ्गपारगः कविरात्मवित्
    ॥ २॥ भार्गवः करुणाः सिन्धुर्ज्ञानगम्यः सुतप्रदः । शुक्रस्यैतानि नामानि शुक्रं स्मृत्वा तु यः पठेत्
    ॥ ३॥ आयुर्धनं सुखं पुत्रं लक्ष्मींवसतिमुत्तमाम् । विद्यां चैव स्वयं तस्मै शुक्रस्तुष्टोददाति च ॥ ४॥
    इति श्रीस्कन्दपुराणे शुक्रस्तोत्रं सम्पूर्णम् ।
meaning: {}
