id: niti
category: shataka
name:
  english: niti
  devanagari: नीति
content:
  english: raho vitatamurjitam bharasaham ca sindhorvapuh || 77|| trishnam chindhi bhaja kshamam jahi
    madam pape ratim ma krithah satyam bruhyanuyahi sadhupadavim sevasva vidvajjanam | manyan manaya vidvisho'pyanunaya
    prakhyapaya prashrayam kirtim palaya duhkhite kuru dayametat satam ceshtitam || 78|| manasi vacasi
    kaye punyapiyushapurnah tribhuvanamupakarashrenibhih prinayantah | paragunaparamanun parvatikritya
    nityam nijahridi vikasantah santi santah kiyantah || 79|| kim tena hemagirina rajatadrina va yatrashritashca
    taravastaravanta eva | manyamahe malayameva yadashrayena kankolanimbakutaja api candanah syuh || 80||
    ratnairmaharhaistutushurna deva na bhejire bhimavishena bhitim | sudham vina na prayayurviramam na
    nishcitarthadviramanti dhirah || 81|| kvacit prithvishayyah kvacidapi ca paryankashayanah kvacicchakaharah
    kvacidapi ca shalyodanarucih | kvacit kanthadhari kvacidapi ca divyambaradharo manasvi karyarthi na
    ganayati ca duhkham na ca sukham || 82|| aishvaryasya vibhushanam sujanata shauryasya vaksamyamo jnanasyopashamah
    shrutasya vinayo vittasya patre vyayah | akrodhastapasah kshama prabhaviturdharmasya nirvyajata sarveshamapi
    sarvakaranamidam shilam param bhushanam || 83|| nindantu nitinipuna yadi va stuvantu lakshmih samavishatu
    gacchatu va yatheshtam | adyaiva va maranamastu yugantare va nyayyatpathah pravicalanti padam na dhirah
    || 84|| patito'pi karaghatairutpatatyeva kandukah | prayena sadhuvrittanamasthayinyo vipattayah ||
    85|| alasyam hi manushyanam sharirastho maharipuh | nastyudyamasamo bandhuh kurvano navasidati ||
    86|| chinno'pi rohati tarushcandrah kshino'pi vardhate loke | iti vimrishantah santah santapyante
    na loke'smin || 87|| neta yasya brihaspatih praharanam vajram surah sainikah svargo durgamanugrahah
    khalu harerairavato varanah | ityaishvaryabalanvito'pi balabhidbhagnah paraih sangare tadvyaktam nanu
    daivameva sharanam dhigdhigvritha paurusham || 88|| bhagnashasya karandapinditatanormlanendriyasya
    kshudha kritvakhurvivaram svayam nipatito naktam mukhe bhoginah | triptastatpishitena satvaramasau
    tenaiva yatah patha lokah pashyata daivameva hi nrinam vriddhau kshaye karanam || 89|| karmayattam
    phalam pumsam buddhih karmanusarini | tathapi sudhiya bhavyam suvicaryaiva kurvata || 90|| khalvato
    divaseshvarasya kiranaih santapito mastake vanchandeshamanatapam vidhivashattalasya mulam gatah |
    tatroccairmahata phalena patata bhagnam sashabdam shirah prayo gacchati yatra bhagyarahitastatrapadam
    bhajanam || 91|| ravinishakarayorgrahapidanam gajabhujangamayorapi bandhanam | matimatam ca vilokya
    daridratam vidhiraho balavaniti me matih || 92|| srijati tavadasheshagunakaram purusharatnamalankaranam
    bhuvah | tadapi tatkshanabhangi karoti cedahaha kashtamapanditata vidheh || 93|| patram naiva yada
    kariravitape dosho vasantasya kim noluko'pyavalokate yadi diva suryasya kim dushanam | dhara naiva
    patanti catakamukhe meghasya kim dushanam yatpurvam vidhina lalatalikhitam tanmarjitum kah kshamah
    || 94|| namasyamo devannanu hatavidheste'pi vashaga vidhirvandyah so'pi pratiniyatakarmaikaphaladah
    | phalam karmayattam yadi kimamaraih kinca vidhina namastatkarmabhyo vidhirapi na yebhyah prabhavati
    || 95|| brahma yena kulalavanniyamito brahmandabhandodare vishnuryena dashavataragahane kshipto mahasankate
    | rudro yena kapalapaniputake bhikshatanam karitah suryo bhramyati nityameva gagane tasmai namah karmane
    || 96|| naivakritih phalati naiva kulam na shilam vidyapi naiva na ca yatnakritapi seva | bhagyani
    purvatapasa khalu sancitani kale phalanti purushasya yathaiva vrikshah || 97|| vane rane shatrujalagnimadhye
    maharnave parvatamastake va | suptam pramattam vishamasthitam va rakshanti punyani pura kritani ||
    98|| ya sadhumshca khalan karoti vidusho murkhan hitan dveshinah pratyaksham kurute parokshamamritam
    halahalam tatkshanat | tamaradhaya satkriyam bhagavatim bhoktum phalam vanchitam he sadho vyasanairguneshu
    vipuleshvastham vritha ma krithah || 99|| gunavadagunavadva kurvata karyajatam parinatiravadharya
    yatnatah panditena | atirabhasakritanam karmanamavipatte
  devanagari: रहो विततमूर्जितं भारसहं च सिन्धोर्वपुः ॥ ७७॥ तृष्णां छिन्धि भज क्षमां जहि मदं पापे रतिं
    मा कृथाः सत्यं ब्रूह्यनुयाहि साधुपदवीं सेवस्व विद्वज्जनम् । मान्यान् मानय विद्विषोऽप्यनुनय प्रख्यापय
    प्रश्रयं कीर्तिं पालय दुःखिते कुरु दयामेतत् सतां चेष्टितम् ॥ ७८॥ मनसि वचसि काये पुण्यपीयूषपूर्णाः
    त्रिभुवनमुपकारश्रेणिभिः प्रीणयन्तः । परगुणपरमाणून् पर्वतीकृत्य नित्यं निजहृदि विकसन्तः सन्ति सन्तः
    कियन्तः ॥ ७९॥ किं तेन हेमगिरिणा रजताद्रिणा वा यत्राश्रिताश्च तरवस्तरवन्त एव । मन्यामहे मलयमेव यदाश्रयेण
    कङ्कोलनिम्बकुटजा अपि चन्दनाः स्युः ॥ ८०॥ रत्नैर्महार्हैस्तुतुषुर्न देवा न भेजिरे भीमविषेण भीतिम् ।
    सुधां विना न प्रययुर्विरामं न निश्चितार्थाद्विरमन्ति धीराः ॥ ८१॥ क्वचित् पृथ्वीशय्यः क्वचिदपि च पर्यङ्कशयनः
    क्वचिच्छाकाहारः क्वचिदपि च शाल्योदनरुचिः । क्वचित् कण्ठाधारी क्वचिदपि च दिव्याम्बरधरो मनस्वी कार्यार्थी
    न गणयति च दुःखं न च सुखम् ॥ ८२॥ ऐश्वर्यस्य विभूषणं सुजनता शौर्यस्य वाक्संयमो ज्ञानस्योपशमः श्रुतस्य
    विनयो वित्तस्य पात्रे व्ययः । अक्रोधस्तपसः क्षमा प्रभवितुर्धर्मस्य निर्व्याजता सर्वेषामपि सर्वकारणमिदं
    शीलं परं भूषणम् ॥ ८३॥ निन्दन्तु नीतिनिपुणा यदि वा स्तुवन्तु लक्ष्मीः समाविशतु गच्छतु व यथेष्टम् ।
    अद्यैव वा मरणमस्तु युगान्तरे वा न्याय्यात्पथः प्रविचलन्ति पदं न धीराः ॥ ८४॥ पातितोऽपि कराघातैरुत्पतत्येव
    कन्दुकः । प्रायेण साधुवृत्तनामस्थायिन्यो विपत्तयः ॥ ८५॥ आलस्यं हि मनुष्याणां शरीरस्थो महारिपुः । नास्त्युद्यमसमो
    बन्धुः कुर्वाणो नावसीदति ॥ ८६॥ छिन्नोऽपि रोहति तरुश्चन्द्रः क्षीणोऽपि वर्धते लोके । इति विमृशन्तः
    सन्तः सन्तप्यन्ते न लोकेऽस्मिन् ॥ ८७॥ नेता यस्य बृहस्पतिः प्रहरणं वज्रं सुराः सैनिकाः स्वर्गो दुर्गमनुग्रहः
    खलु हरेरैरावतो वारणः । इत्यैश्वर्यबलान्वितोऽपि बलभिद्भग्नः परैः सङ्गरे तद्व्यक्तं ननु दैवमेव शरणं
    धिग्धिग्वृथा पौरुषम् ॥ ८८॥ भग्नाशस्य करण्डपिण्डिततनोर्म्लानेन्द्रियस्य क्षुधा कृत्वाखुर्विवरं स्वयं
    निपतितो नक्तं मुखे भोगिनः । तृप्तस्तत्पिशितेन सत्वरमसौ तेनैव यातः पथा लोकाः पश्यत दैवमेव हि नृणां
    वृद्धौ क्षये कारणम् ॥ ८९॥ कर्मायत्तं फलं पुंसां बुद्धिः कर्मानुसारिणी । तथापि सुधिया भाव्यं सुविचार्यैव
    कुर्वता ॥ ९०॥ खल्वाटो दिवसेश्वरस्य किरणैः सन्तापितो मस्तके वाञ्छन्देशमनातपं विधिवशात्तालस्य मूलं गतः
    । तत्रोच्चैर्महता फलेन पतता भग्नं सशब्दं शिरः प्रायो गच्छति यत्र भाग्यरहितस्तत्रापदां भाजनम् ॥ ९१॥
    रविनिशाकरयोर्ग्रहपीडनं गजभुजङ्गमयोरपि बन्धनम् । मतिमतां च विलोक्य दरिद्रतां विधिरहो बलवानिति मे मतिः
    ॥ ९२॥ सृजति तावदशेषगुणाकरं पुरुषरत्नमलङ्करणं भुवः । तदपि तत्क्षणभङ्गि करोति चेदहह कष्टमपण्डितता विधेः
    ॥ ९३॥ पत्रं नैव यदा करीरविटपे दोषो वसन्तस्य किं नोलूकोऽप्यवलोकते यदि दिवा सूर्यस्य किं दूषणम् । धारा
    नैव पतन्ति चातकमुखे मेघस्य किं दूषणं यत्पूर्वं विधिना ललाटलिखितं तन्मार्जितुं कः क्षमः ॥ ९४॥ नमस्यामो
    देवान्ननु हतविधेस्तेऽपि वशगा विधिर्वन्द्यः सोऽपि प्रतिनियतकर्मैकफलदः । फलं कर्मायत्तं यदि किममरैः
    किञ्च विधिना नमस्तत्कर्मभ्यो विधिरपि न येभ्यः प्रभवति ॥ ९५॥ ब्रह्मा येन कुलालवन्नियमितो ब्रह्माण्डभाण्डोदरे
    विष्णुर्येन दशावतारगहने क्षिप्तो महासङ्कटे । रुद्रो येन कपालपाणिपुटके भिक्षाटनं कारितः सूर्यो भ्राम्यति
    नित्यमेव गगने तस्मै नमः कर्मणे ॥ ९६॥ नैवाकृतिः फलति नैव कुलं न शीलं विद्यापि नैव न च यत्नकृतापि सेवा
    । भाग्यानि पूर्वतपसा खलु सञ्चितानि काले फलन्ति पुरुषस्य यथैव वृक्षाः ॥ ९७॥ वने रणे शत्रुजलाग्निमध्ये
    महार्णवे पर्वतमस्तके वा । सुप्तं प्रमत्तं विषमस्थितं वा रक्षन्ति पुण्यानि पुरा कृतानि ॥ ९८॥ या साधूंश्च
    खलान् करोति विदुषो मूर्खान् हितान् द्वेषिणः प्रत्यक्षं कुरुते परोक्षममृतं हालाहलं तत्क्षणात् । तामाराधय
    सत्क्रियां भगवतीं भोक्तुं फलं वाञ्छितं हे साधो व्यसनैर्गुणेषु विपुलेष्वास्थां वृथा मा कृथाः ॥ ९९॥
    गुणवदगुणवद्वा कुर्वता कार्यजातं परिणतिरवधार्या यत्नतः पण्डितेन । अतिरभसकृतानां कर्मणामाविपत्ते
