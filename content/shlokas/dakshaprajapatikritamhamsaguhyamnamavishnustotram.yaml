id: dakshaprajapatikritamhamsaguhyamnamavishnustotram
category: stotram
name:
  english: dakshaprajapatikritamhamsaguhyamnamavishnustotram
  devanagari: दक्षप्रजापतिकृतंहंसगुह्यंनामविष्णुस्तोत्रम्
content:
  english: tsa vai gunapayavisargalakshanah || 29|| yasmin yato yena ca yasya yasmai yadyo yatha kurute
    karyate ca | paravaresham paramam prakprasiddham tadbrahma taddheturananyadekam || 30|| yacchaktayo
    vadatam vadinam vai vivadasamvadabhuvo bhavanti | kurvanti caisham muhuratmamoham tasmai namo'nantagunaya
    bhumne || 31|| astiti nastiti ca vastunishthayo
  devanagari: त्स वै गुणापायविसर्गलक्षणः ॥ २९॥ यस्मिन् यतो येन च यस्य यस्मै यद्यो यथा कुरुते कार्यते च
    । परावरेषां परमं प्राक्प्रसिद्धं तद्ब्रह्म तद्धेतुरनन्यदेकम् ॥ ३०॥ यच्छक्तयो वदतां वादिनां वै विवादसंवादभुवो
    भवन्ति । कुर्वन्ति चैषां मुहुरात्ममोहं तस्मै नमोऽनन्तगुणाय भूम्ने ॥ ३१॥ अस्तीति नास्तीति च वस्तुनिष्ठयो
meaning: {}
