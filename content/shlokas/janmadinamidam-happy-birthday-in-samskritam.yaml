id: janmadinamidam-happy-birthday-in-samskritam
category: stotram
name:
  english: Janmadinamidam (Happy Birthday in Samskritam)
content:
  english: janmadinamidam ayi priya sakhe | sham tanotu te sarvada mudam || || prarthayamahe bhava shatayushi
    | ishvarassada tvam ca rakshatu || || punya karmana kirtimarjaya | jivanam tava bhavatu sarthakam
    ||
  devanagari: जन्मदिनमिदं अयि प्रिय सखे । शं तनोतु ते सर्वदा मुदम् ॥ ॥ प्रार्थयामहे भव शतायुषी । ईश्वरस्सदा
    त्वां च रक्षतु ॥ ॥ पुण्य कर्मणा कीर्तिमर्जय । जीवनं तव भवतु सार्थकम् ॥
