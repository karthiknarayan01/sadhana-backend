id: madanagopalastotram-2
category: stotram
name:
  english: madanagopalastotram 2
  devanagari: मदनगोपालस्तोत्रम् २
content:
  english: rinu devi pravakshyami rahasyam bhuvaneshvari | tavaiva paurusham rupam gopikanayanamritam
    || 1|| sada nishevitam ragadbhavadvirahabhirubhih | satyabhamadirupabhirmayamurtibhirashtabhih ||
    2|| khyatam madanagopalasamjnaya bhuvanatraye | tasya dhyanam pravakshyami sarvapapapranashanam ||
    3|| sarvamohamayam sarvasampatpradamanuttamam | animadimahaishvaryapradamayuhpravardhanam || 4|| saubhagyadayakam
    nrinam strinam caiva visheshatah | kimatra bahunoktena dhyanenanena bhamini | yadyadicchati tatsarvam
    narah prapnotyasamshayah || 5|| shrimadbalarkasankasham padmaragamaniprabham | bandhukabandhuralokasandhyaragarunadyutim
    || 6|| makutanekamanikyaprabhapallavitambaram | kiritopantavinyastabarhibarhavatamsakam || 7|| kasturitilakakrantakamaniyalakasthalam
    | nistalasthulamanikyacarumauktikamandalam || 8|| dantamshukusumashlishtacibukoddeshashobhitam | shashankabimbalankarashlaghatankakarananam
    || 9|| anardharatnagraiveyavilasatkambukandharam | udamshumauktikairharairvaijayantya ca malaya ||
    10|| shrivatsakaustubhabhyam ca parishkritabhujantaram | chatram pushpam sharam padmam srinim shankhekshukarmuke
    || 11|| gadam pasham ca muralim bibhranam mohanakritim | nimnanabhim romarajivilasatpallavodaram ||
    12|| visankatakatideshavacalamanimekhalam | spuratsaudamanichayadayadakanakambaram || 13|| manimanjirakiranakinjalkitapadambujam
    | shanollidhamanishreniramyanghrinakhamandalam || 14|| apadakanthamayuktabhushashatamanoharam | kalpakanokaharamamahite
    manimandape || 15|| cintamanimahapithamadhye hemasaroruhe | karnikaparisandiptashrimancakrasane shubhe
    || 16|| tishthantam devadevesham tribhangilalitakritim | vamamsashikharopantavyalolamanikundalam ||
    17|| akuncitabhruvam kincitkuncitadharapallavam | ganamritarasasvadanishpandanikhilendriyaih || 18||
    upasyamanamanandat sadarairdivishadvaraih | sauradundubhinirghoshairmuktaprasavavrishtibhih || 19||
    dhyayenmadanagopalam mantri shuciralankritam |
  devanagari: ृणु देवि प्रवक्ष्यामि रहस्यं भुवनेश्वरि । तवैव पौरुषं रूपं गोपिकानयनामृतम् ॥ १॥ सदा निषेवितं
    रागाद्भवद्विरहभीरुभिः । सत्यभामादिरूपाभिर्मायामूर्तिभिरष्टभिः ॥ २॥ ख्यातं मदनगोपालसंज्ञया भुवनत्रये
    । तस्य ध्यानं प्रवक्ष्यामि सर्वपापप्रणाशनम् ॥ ३॥ सर्वमोहमयं सर्वसम्पत्प्रदमनुत्तमम् । अणिमादिमहैश्वर्यप्रदमायुःप्रवर्धनम्
    ॥ ४॥ सौभाग्यदायकं नॄणां स्त्रीणां चैव विशेषतः । किमत्र बहुनोक्तेन ध्यानेनानेन भामिनि । यद्यदिच्छति
    तत्सर्वं नरः प्राप्नोत्यसंशयः ॥ ५॥ श्रीमद्बालार्कसङ्काशं पद्मरागमणिप्रभम् । बन्धूकबन्धुरालोकसन्ध्यारागारुणद्युतिम्
    ॥ ६॥ मकुटानेकमाणिक्यप्रभापल्लविताम्बरम् । किरीटोपान्तविन्यस्तबर्हिबर्हावतंसकम् ॥ ७॥ कस्तूरीतिलकाक्रान्तकमनीयालकस्थलम्
    । निस्तलस्थूलमाणिक्यचारुमौक्तिकमण्डलम् ॥ ८॥ दन्तांशुकुसुमाश्लिष्टचिबुकोद्देशशोभितम् । शशाङ्कबिम्बालङ्कारश्लाघातङ्ककराननम्
    ॥ ९॥ अनर्धरत्नग्रैवेयविलसत्कम्बुकन्धरम् । उदंशुमौक्तिकैर्हारैर्वैजयन्त्या च मालया ॥ १०॥ श्रीवत्सकौस्तुभाभ्यां
    च परिष्कृतभुजान्तरम् । छत्रं पुष्पं शरं पद्मं सृणिं शङ्खेक्षुकार्मुके ॥ ११॥ गदां पाशं च मुरलीं बिभ्राणं
    मोहनाकृतिम् । निम्ननाभिं रोमराजीविलसत्पल्लवोदरम् ॥ १२॥ विसङ्कटकटीदेशवाचालमणिमेखलम् । स्पुरत्सौदामनीछायादायादकनकाम्बरम्
    ॥ १३॥ मणिमञ्जीरकिरणकिञ्जल्कितपदाम्बुजम् । शाणोल्लीढमणिश्रेणिरम्याङ्घ्रिनखमण्डलम् ॥ १४॥ आपादकण्ठमायुक्तभूषाशतमनोहरम्
    । कल्पकानोकहाराममहिते मणिमण्डपे ॥ १५॥ चिन्तामणिमहापीठमध्ये हेमसरोरुहे । कर्णिकापरिसन्दीप्तश्रीमञ्चक्रासने
    शुभे ॥ १६॥ तिष्ठन्तं देवदेवेशं त्रिभङ्गीललिताकृतिम् । वामांसशिखरोपान्तव्यालोलमणिकुण्डलम् ॥ १७॥ आकुञ्चितभ्रुवं
    किञ्चित्कुञ्चिताधरपल्लवम् । गानामृतरसास्वादनिष्पन्दनिखिलेन्द्रियैः ॥ १८॥ उपास्यमानमानन्दात् सदारैर्दिविषद्वरैः
    । सौरदुन्दुभिनिर्घोषैर्मुक्तप्रसववृष्टिभिः ॥ १९॥ ध्यायेन्मदनगोपालं मन्त्री शुचिरलङ्कृतम् ।
