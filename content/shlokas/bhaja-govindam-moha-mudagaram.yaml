id: bhaja-govindam-moha-mudagaram
category: stotram
name:
  english: Bhaja Govindam (Moha Mudagaram)
  devanagari: भज गोविन्दम्
content:
  english: bhaja govindam bhaja govindam samprapte sannihite kale na hi na hi rakshati dukrin karane mudha
    jahihi dhanagamatrishnam kuru sadbuddhim manasi vitrishnam yallabhase nijakarmopattam vittam tena
    vinodaya cittam drishtva ma ga mohavesham etanmamsavasadi vikaram manasi vicintaya varam varam tadvajjivitamatishayacapalam
    viddhi vyadhyabhimanagrastam lokam shokahatam ca samastam pashcajjivati jarjaradehe vartam ko'pi na
    pricchati gehe yavat pavano nivasati dehe tavat pricchati kushalam gehe bharya bibhyati tasmin kaye
    balastavatkridasaktah tarunastavattarunisaktah vriddhastavaccintasaktah pare brahmani ko'pi na saktah
    ka te kanta kaste putrah samsaro'yamativa vicitrah kasya tvam kah kuta ayatah tattvam cintaya tadiha
    bhratah satsangatve nihsangatvam nihsangatve nirmohatvam nirmohatve nishcalitattvam vayasi gate kah
    kamavikarah shushke nire kah kasarah kshine vitte kah parivarah jnate tattve kah samsarah ma kuru
    dhanajanayauvanagarvam harati nimeshat kalah sarvam mayamayamidamakhilam hitva brahmapadam tvam pravisha
    viditva dinayaminyau sayam pratah shishiravasantau punarayatah kalah kridati gacchatyayuh tadapi na
    muncatyashavayuh dvadashamanjarikabhirasheshah upadesho bhudvidyanipunaih shrimacchankarabhagavaccharanaih
    ka te kanta dhanagatacinta vatula kim tava nasti niyanta trijagati sajjanasangatireka bhavati bhavarnavatarane
    nauka jatilo mundi lunchitakeshah kashayambarabahukritaveshah pashyannapi cana pashyati mudhah udaranimittam
    bahukritaveshah angam galitam palitam mundam dashanavihinam jatam tundam vriddho yati grihitva dandam
    tadapi na muncatyashapindam agre vahnih prishthe bhanuh ratrau cubukasamarpitajanuh karatalabhikshastarutalavasah
    tadapi na muncatyashapashah kurute gangasagaragamanam vrataparipalanamathava danam jnanavihinah sarvamatena
    muktim na bhajati janmashatena shayya bhutalamajinam vasah kasya sukham na karoti viragah sangarato
    va sangavihinah yasya brahmani ramate cittam nandati nandati nandatyeva bhagavadgita kincidadhita
    sakridapi yena murari samarca kriyate tasya yamena na carca punarapi jananam punarapi maranam iha
    samsare bahudustare kripaya'pare pahi murare yogi yoganiyojita citto kastvam ko'ham kuta ayatah ka
    me janani ko me tatah iti paribhavaya sarvamasaram vishvam tyaktva svapnavicaram tvayi mayi canyatraiko
    vishnuh vyartham kupyasi mayyasahishnuh sarvasminnapi pashyatmanam sarvatrotsrija bhedajnanam shatrau
    mitre putre bandhau ma kuru yatnam vigrahasandhau bhava samacittah sarvatra tvam vanchasyaciradyadi
    vishnutvam kamam krodham lobham moham tyaktva''tmanam bhavaya ko'ham atmajnanavihina mudhah te pacyante
    narakanigudhah deyam dinajanaya ca vittam sukhatah kriyate ramabhogah pashcaddhanta sharire rogah
    yadyapi loke maranam sharanam tadapi na muncati papacaranam arthamanartham bhavaya nityam nasti tatah
    sukhaleshah satyam putradapi dhanabhajam bhitih sarvatraisha vihita ritih pranayamam pratyaharam kurvavadhanam
    mahadavadhanam samsaradaciradbhava muktah drakshyasi nijahridayastham devam bodhita asicchodhitakaranah
    bhaja govindam bhaja govindam ||iti shrimatparamahamsaparivrajakacaryasya shri shishyasya shrimacchankarabhagavatah
    kritau bhaja govindam sampurnam||
  devanagari: भज गोविन्दं भज गोविन्दं सम्प्राप्ते सन्निहिते काले न हि न हि रक्षति डुकृञ् करणे मूढ जहीहि
    धनागमतृष्णां कुरु सद्बुद्धिं मनसि वितृष्णाम् यल्लभसे निजकर्मोपात्तं वित्तं तेन विनोदय चित्तम् दृष्ट्वा
    मा गा मोहावेशम् एतन्मांसावसादि विकारं मनसि विचिन्तय वारं वारम् तद्वज्जीवितमतिशयचपलम् विद्धि व्याध्यभिमानग्रस्तं
    लोकं शोकहतं च समस्तम् पश्चाज्जीवति जर्जरदेहे वार्तां कोऽपि न पृच्छति गेहे यावत् पवनो निवसति देहे तावत्
    पृच्छति कुशलं गेहे भार्या बिभ्यति तस्मिन् काये बालस्तावत्क्रीडासक्तः तरुणस्तावत्तरुणीसक्तः वृद्धस्तावच्चिन्तासक्तः
    परे ब्रह्मणि कोऽपि न सक्तः का ते कान्ता कस्ते पुत्रः संसारोऽयमतीव विचित्रः कस्य त्वं कः कुत आयातः
    तत्त्वं चिन्तय तदिह भ्रातः सत्सङ्गत्वे निःसङ्गत्वं निःसङ्गत्वे निर्मोहत्वम् निर्मोहत्वे निश्चलितत्त्वं
    वयसि गते कः कामविकारः शुष्के नीरे कः कासारः क्षीणे वित्ते कः परिवारः ज्ञाते तत्त्वे कः संसारः मा कुरु
    धनजनयौवनगर्वं हरति निमेषात् कालः सर्वम् मायामयमिदमखिलं हित्वा ब्रह्मपदं त्वं प्रविश विदित्वा दिनयामिन्यौ
    सायं प्रातः शिशिरवसन्तौ पुनरायातः कालः क्रीडति गच्छत्यायुः तदपि न मुञ्चत्याशावायुः द्वादशमञ्जरिकाभिरशेषः
    उपदेशो भूद्विद्यानिपुणैः श्रीमच्छङ्करभगवच्छरणैः का ते कान्ता धनगतचिन्ता वातुल किं तव नास्ति नियन्ता
    त्रिजगति सज्जनसङ्गतिरेका भवति भवार्णवतरणे नौका जटिलो मुण्डी लुञ्छितकेशः काषायाम्बरबहुकृतवेषः पश्यन्नपि
    चन पश्यति मूढः उदरनिमित्तं बहुकृतवेषः अङ्गं गलितं पलितं मुण्डं दशनविहीनं जातं तुण्डम् वृद्धो याति
    गृहीत्वा दण्डं तदपि न मुञ्चत्याशापिण्डम् अग्रे वह्निः पृष्ठे भानुः रात्रौ चुबुकसमर्पितजानुः करतलभिक्षस्तरुतलवासः
    तदपि न मुञ्चत्याशापाशः कुरुते गङ्गासागरगमनं व्रतपरिपालनमथवा दानम् ज्ञानविहीनः सर्वमतेन मुक्तिं न भजति
    जन्मशतेन शय्या भूतलमजिनं वासः कस्य सुखं न करोति विरागः सङ्गरतो वा सङ्गविहीनः यस्य ब्रह्मणि रमते चित्तं
    नन्दति नन्दति नन्दत्येव भगवद्गीता किञ्चिदधीता सकृदपि येन मुरारि समर्चा क्रियते तस्य यमेन न चर्चा पुनरपि
    जननं पुनरपि मरणं इह संसारे बहुदुस्तारे कृपयाऽपारे पाहि मुरारे योगी योगनियोजित चित्तो कस्त्वं कोऽहं
    कुत आयातः का मे जननी को मे तातः इति परिभावय सर्वमसारं विश्वं त्यक्त्वा स्वप्नविचारम् त्वयि मयि चान्यत्रैको
    विष्णुः व्यर्थं कुप्यसि मय्यसहिष्णुः सर्वस्मिन्नपि पश्यात्मानं सर्वत्रोत्सृज भेदाज्ञानम् शत्रौ मित्रे
    पुत्रे बन्धौ मा कुरु यत्नं विग्रहसन्धौ भव समचित्तः सर्वत्र त्वं वाञ्छस्यचिराद्यदि विष्णुत्वम् कामं
    क्रोधं लोभं मोहं त्यक्त्वाऽऽत्मानं भावय कोऽहम् आत्मज्ञानविहीना मूढाः ते पच्यन्ते नरकनिगूढाः देयं दीनजनाय
    च वित्तम् सुखतः क्रियते रामाभोगः पश्चाद्धन्त शरीरे रोगः यद्यपि लोके मरणं शरणं तदपि न मुञ्चति पापाचरणम्
    अर्थमनर्थं भावय नित्यं नास्ति ततः सुखलेशः सत्यम् पुत्रादपि धनभाजां भीतिः सर्वत्रैषा विहिता रीतिः प्राणायामं
    प्रत्याहारं कुर्ववधानं महदवधानम् संसारादचिराद्भव मुक्तः द्रक्ष्यसि निजहृदयस्थं देवम् बोधित आसिच्छोधितकरणः
    भज गोविन्दं भज गोविन्दं ॥इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्री शिष्यस्य श्रीमच्छङ्करभगवतः कृतौ
    भज गोविन्दं सम्पूर्णम्॥
