id: b-ihaspatikavac
category: kavacha
name:
  english: bṟihaspatikavac
  devanagari: ब्ऱिहस्पतिकवच्
content:
  english: guruprityartham jape viniyogah | abhishtaphaladam devam sarvajnam surapujitam | akshamaladharam
    shantam pranamami brihaspatim || 1|| brihaspatih shirah patu lalatam patu me guruh | karnau suraguruh
    patu netre me'bhishtadayakah || 2|| jihvam patu suracaryo nasam me vedaparagah | mukham me patu sarvajno
    kantham me devataguruh || 3|| bhujavangirasah patu karau patu shubhapradah | stanau me patu vagishah
    kukshim me shubhalakshanah || 4|| nabhim devaguruh patu madhyam patu sukhapradah | katim patu jagadvandya
    uru me patu vakpatih || 5|| janujanghe suracaryo padau vishvatmakastatha | anyani yani cangani rakshenme
    sarvato guruh || 6|| ityetatkavacam divyam trisandhyam yah pathennarah | sarvankamanavapnoti sarvatra
    vijayi bhavet || 7|| || iti shribrahmayamaloktam brihaspatikavacam sampurnam ||
  devanagari: गुरुप्रीत्यर्थं जपे विनियोगः । अभीष्टफलदं देवं सर्वज्ञं सुरपूजितम् । अक्षमालाधरं शान्तं
    प्रणमामि बृहस्पतिम् ॥ १॥ बृहस्पतिः शिरः पातु ललाटं पातु मे गुरुः । कर्णौ सुरगुरुः पातु नेत्रे मेऽभीष्टदायकः
    ॥ २॥ जिह्वां पातु सुराचार्यो नासां मे वेदपारगः । मुखं मे पातु सर्वज्ञो कण्ठं मे देवतागुरुः ॥ ३॥ भुजावाङ्गिरसः
    पातु करौ पातु शुभप्रदः । स्तनौ मे पातु वागीशः कुक्षिं मे शुभलक्षणः ॥ ४॥ नाभिं देवगुरुः पातु मध्यं
    पातु सुखप्रदः । कटिं पातु जगद्वन्द्य ऊरू मे पातु वाक्पतिः ॥ ५॥ जानुजङ्घे सुराचार्यो पादौ विश्वात्मकस्तथा
    । अन्यानि यानि चाङ्गानि रक्षेन्मे सर्वतो गुरुः ॥ ६॥ इत्येतत्कवचं दिव्यं त्रिसन्ध्यं यः पठेन्नरः ।
    सर्वान्कामानवाप्नोति सर्वत्र विजयी भवेत् ॥ ७॥ ॥ इति श्रीब्रह्मयामलोक्तं बृहस्पतिकवचं सम्पूर्णम् ॥
