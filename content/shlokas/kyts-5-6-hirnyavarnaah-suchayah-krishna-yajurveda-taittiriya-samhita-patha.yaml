    तदुप॑ धत्ते॒ यदिष्ट॑काभिर॒ग्नि वैँ वि॒श्वक॑र्मा वैश्वकर्म॒णीरे॒व तदुप॑ धत्ते॒ तस्मा॑ स्त्रि॒वृद॒ग्निरिति॒
    तं यँज॑मान ए॒व चि॑न्वीत॒ यद॑स्या॒न्य श्चि॑नु॒याद्य न्दक्षि॑णाभि॒र्न रा॒धये॑द॒ग्निम॑स्य वृञ्जीत॒ यो
    न्दक्षि॑णाभी राधयेद॒ग्निमे॒व त वँ॑स॒न्तेनै॒वास्य॑ पूर्वा॒र्धम॑चिनुत ग्री॒ष्मेण॒ दक्षि॑ण वँ॒र्॒षाभिः॒
    पुच्छग्ं॑ श॒रदोत्त॑र म्प॒क्षग्ं हे॑म॒न्तेन॒ मद्ध्य॒ म्ब्रह्म॑णा॒ वा अ॑स्य॒ त र्वा॒र्धम॑चिनुत क्ष॒त्रेण॒
