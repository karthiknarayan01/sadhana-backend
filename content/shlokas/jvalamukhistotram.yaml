id: jvalamukhistotram
category: stotram
name:
  english: jvalamukhistotram
  devanagari: ज्वालामुखीस्तोत्रम्
content:
  english: shrijvalamukhistotram shriganeshaya namah | shribhairava uvaca | taram yo bhajate matarbijam
    tava sudhakaram | paravarasuta nityam nishcala tadgrihe vaset || 1|| shunyam yo dahanadhirudhamamalam
    vamakshisamsevitam sendum binduyutam bhavani varade svante smaret sadhakah | mukasyapi surendrasindhujalavadvagdevata
    bharati gadyah padyamayim nirargalatara matarmukhe tishthati || 2|| shubham vahnyarudham matiyutamanalpeshtaphaladam
    sabindvindum mando yadi japati bijam tava priyam | tada matah svahstrijanaviharanakleshasahitah sukhamindrodyane
    svapiti sa bhavetpujanaratah || 3|| jvalamukhiti japate tava namavarnan yah sadhako girishapatni subhaktipurvam
    | tasyanghripadmayugalam suranathaveshyah simantaratnakiranairanuranjayanti || 4|| pashambujabhayadhare
    mama sarvashatrun shabdam tviti smarati yastava mantramadhye | tasyadriputri caranau bahupamsuyuktau
    prakshalayantyarivadhunayanashrupatat || 5|| bhakshayadvayamidam yadi bhaktya sadhako japati cetasi
    matah | sa smaraririva tvatprasadatastvatpadam ca labhate divanisham || 6|| kurcabijamanagham yadi
    dhyayet sadhakastava maheshvari yo'ntah | ashta hastakamaleshu suvashyastasya tryambakasamastasiddhayah
    || 7|| thadvayam tava manuttarasthitam yo japettu paramaprabhavadam | tasya devi harishankaradayah
    pujayanti caranau divaukasah || 8|| om hrim shrim tryakshare devi surasuranisudini | trailokyabhayade
    matarjvalamukhi namo'stu te || 9|| uditarkadyute lakshmi lakshminathasamarcite | varambujabhayadhare
    jvalamukhi namo'stu te || 10|| sarvasaramayi sarve sarvamaranamaskrite | satye sati sadacare jvalamukhi
    namo'stu te || 11|| yasya murdhni shashi trilocanagata yasya ravindvagnayah pashambhojavarabhayah
    karatalambhojeshu saddhetayah | gatre kunkumasannibha dyutirahiryasyagale bhushanam
  devanagari: श्रीज्वालामुखीस्तोत्रम् श्रीगणेशाय नमः । श्रीभैरव उवाच । तारं यो भजते मातर्बीजं तव सुधाकरम्
    । पारावारसुता नित्यं निश्चला तद्गृहे वसेत् ॥ १॥ शून्यं यो दहनाधिरूढममलं वामाक्षिसंसेवितं सेन्दुं बिन्दुयुतं
    भवानि वरदे स्वान्ते स्मरेत् साधकः । मूकस्यापि सुरेन्द्रसिन्धुजलवद्वाग्देवता भारती गद्यः पद्यमयीं निरर्गलतरा
    मातर्मुखे तिष्ठति ॥ २॥ शुभं वह्न्यारूढं मतियुतमनल्पेष्टफलदं सबिन्द्वीन्दुं मन्दो यदि जपति बीजं तव
    प्रियम् । तदा मातः स्वःस्त्रीजनविहरणक्लेशसहितः सुखमिन्द्रोद्याने स्वपिति स भवेत्पूजनरतः ॥ ३॥ ज्वालामुखीति
    जपते तव नामवर्णान् यः साधको गिरिशपत्नि सुभक्तिपूर्वम् । तस्याङ्घ्रिपद्मयुगलं सुरनाथवेश्याः सीमन्तरत्नकिरणैरनुरञ्जयन्ति
    ॥ ४॥ पाशाम्बुजाभयधरे मम सर्वशत्रून् शब्दं त्विति स्मरति यस्तव मन्त्रमध्ये । तस्याद्रिपुत्रि चरणौ बहुपांसुयुक्तौ
    प्रक्षालयन्त्यरिवधूनयनाश्रुपातात् ॥ ५॥ भक्षयद्वयमिदं यदि भक्त्या साधको जपति चेतसि मातः । स स्मरारिरिव
    त्वत्प्रसादतस्त्वत्पदं च लभते दिवानिशम् ॥ ६॥ कूर्चबीजमनघं यदि ध्यायेत् साधकस्तव महेश्वरि योऽन्तः ।
    अष्ट हस्तकमलेषु सुवश्यास्तस्य त्र्यम्बकसमस्तसिद्धयः ॥ ७॥ ठद्वयं तव मनूत्तरस्थितं यो जपेत्तु परमप्रभावदम्
    । तस्य देवि हरिशङ्करादयः पूजयन्ति चरणौ दिवौकसः ॥ ८॥ ॐ ह्रीं श्रीं त्र्यक्षरे देवि सुरासुरनिसूदिनि
    । त्रैलोक्याभयदे मातर्ज्वालामुखि नमोऽस्तु ते ॥ ९॥ उदितार्कद्युते लक्ष्मि लक्ष्मीनाथसमर्चिते । वराम्बुजाभयधरे
    ज्वालामुखि नमोऽस्तु ते ॥ १०॥ सर्वसारमयि सर्वे सर्वामरनमस्कृते । सत्ये सति सदाचारे ज्वालामुखि नमोऽस्तु
    ते ॥ ११॥ यस्या मूर्ध्नि शशी त्रिलोचनगता यस्या रवीन्द्वग्नयः पाशाम्भोजवराभयाः करतलाम्भोजेषु सद्धेतयः
    । गात्रे कुङ्कुमसन्निभा द्युतिरहिर्यस्यागले भूषणं
