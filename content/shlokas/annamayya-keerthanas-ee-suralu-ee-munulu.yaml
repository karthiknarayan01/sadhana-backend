id: annamayya-keerthanas-ee-suralu-ee-munulu
category: stotram
name:
  english: Annamayya Keerthanas Ee Suralu Ee Munulu
content:
  english: i suralimunu licaracaramulu | yisakalamantayu nidi yèvvaru || ènnika namamu litu nivai yundaga
    | yinni namamu litu nivai yundaga | vunnacotane nivu vunducunduga mari | yinnita diruguva ridi yèvvaru
    || vòkkarupai nivu vunducundaga mari | takkina yirupamulu tamèvvaru | yikkadanakkada nivu yitu atmalalonunda
    | makkuva nunduvaru mari yèvvaru || shrivenkatadripai cèlagi ni vundaga | daivambulanuvaru tamèvvaru
    | kavalasinacota kaligi nivundaga | yivishvaparipunu lidi yèvvaru ||
  devanagari: ई सुरलीमुनु लीचराचरमुलु । यिसकलमन्तयु निदि यॆव्वरु ॥ ऎन्निक नाममु लिटु नीवै युण्डग । यिन्नि
    नाममु लिटु नीवै युण्डग । वुन्नचोटने नीवु वुण्डुचुण्डुग मरि । यिन्निटा दिरुगुवा रिदि यॆव्वरु ॥ वॊक्करूपै
    नीवु वुण्डुचुण्डग मरि । तक्किन यीरूपमुलु तामॆव्वरु । यिक्कडनक्कड नीवु यिटु आत्मललोनुण्ड । मक्कुव नुण्डुवारु
    मरि यॆव्वरु ॥ श्रीवेङ्कटाद्रिपै चॆलगि नी वुण्डगा । दैवम्बुलनुवारु तामॆव्वरु । कावलसिनचोट कलिगि नीवुण्डग
    । यीविश्वपरिपूणु लिदि यॆव्वरु ॥
