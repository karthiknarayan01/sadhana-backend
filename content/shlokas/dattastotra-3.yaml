id: dattastotra-3
category: stotram
name:
  english: dattastotra 3
  devanagari: दत्तस्तोत्र ३
content:
  english: shridattatreyastotram 3 || om || shri gurudevaya namah | shrigurudattatreyaya namah | shridattatreya
    jaya dattatreya jaya paramatman karunasagara | jaya jagadishvara jaya vishvambhara jaya dattatreya
    datta digambara || 1|| anusuyatmaja hariharabrahman batuveshita sukumara manohara | atritanaya jaya
    patitapavana jaya dattatreya jaya dattatreya || 2|| he trigunatmaka trigunarahita jaya tribhuvananayaka
    jaya bhavataraka | kritamtabhayahara dinadayaghana jaya dattatreya jaya dattatreya || 3|| kaupinadharin
    jatamukutadhara damdakamamdalumamditakara jaya | vatamulasthita smitamukhanirmala jaya dattatreya
    jaya dattatreya || 4|| camdanacarcita bhasmavilepita siddhasanayuta jaya yogeshvara | jaya shripadashrivallabha
    jaya jaya dattatreya jaya dattatreya || 5|| dhyanamagna jaya munivara mamgala navanirajasamamilitalocana
    | navanathapriya alakhaniramjana jaya dattatreya jaya dattatreya || 6|| jnanasudharasavarshan jaya
    jaya shrinrisimha jaya rajakoddharaka | siddhapurusha jaya samarthasvamin jaya dattatreya jaya dattatreya
    || 7|| parabrahma vishvatmaka jaya he eka nitya jaya anamta jaya jaya vedanivedita neti neti jaya
    jaya dattatreya jaya dattatreya || 8|| jyotirmaya jaya tejogiri jaya anamdaghana saccidananda jaya
    | pranavatmaka jaya hritkamalasthita dattasvamin jaya dattatreya || 9|| he shashvata vishveshvara
    bhagavan muktipradata mahadeva jaya | shridattatreya jaya dattatreya || jaya jaya dattatreya dattatreya
    || 10|| || om namo bhagavate dattatreyaya ||
  devanagari: श्रीदत्तात्रेयस्तोत्रं ३ ॥ ॐ ॥ श्री गुरूदेवाय नमः । श्रीगुरूदत्तात्रेयाय नमः । श्रीदत्तात्रेय
    जय दत्तात्रेय जय परमात्मन् करुणासागर । जय जगदीश्वर जय विश्वंभर जय दत्तात्रेय दत्त दिगंबर ॥ १॥ अनुसूयात्मज
    हरिहरब्रह्मन् बटुवेषित सुकुमार मनोहर । अत्रितनय जय पतितपावन जय दत्तात्रेय जय दत्तात्रेय ॥ २॥ हे त्रिगुणात्मक
    त्रिगुणरहित जय त्रिभुवननायक जय भवतारक । कृतांतभयहर दीनदयाघन जय दत्तात्रेय जय दत्तात्रेय ॥ ३॥ कौपिनधारिन्
    जटामुकुटधर दंडकमंडलुमंडितकर जय । वटमूलस्थित स्मितमुखनिर्मल जय दत्तात्रेय जय दत्तात्रेय ॥ ४॥ चंदनचर्चित
    भस्मविलेपित सिद्धासनयुत जय योगेश्वर । जय श्रीपादश्रीवल्लभ जय जय दत्तात्रेय जय दत्तात्रेय ॥ ५॥ ध्यानमग्न
    जय मुनिवर मंगल नवनीरजसममिलीतलोचन । नवनाथप्रिय अलखनिरंजन जय दत्तात्रेय जय दत्तात्रेय ॥ ६॥ ज्ञानसुधारसवर्षन्
    जय जय श्रीनृसिंह जय रजकोद्धारक । सिद्धपुरूष जय समर्थस्वामिन् जय दत्तात्रेय जय दत्तात्रेय ॥ ७॥ परब्रह्म
    विश्वात्मक जय हे एक नित्य जय अनंत जय जय वेदनिवेदित नेति नेति जय जय दत्तात्रेय जय दत्तात्रेय ॥ ८॥ ज्योतिर्मय
    जय तेजोगिरि जय आनंदघन सच्चिदानन्द जय । प्रणवात्मक जय हृत्कमलस्थित दत्तस्वामिन् जय दत्तात्रेय ॥ ९॥
    हे शाश्वत विश्वेश्वर भगवन् मुक्तिप्रदाता महादेव जय । श्रीदत्तात्रेय जय दत्तात्रेय ॥ जय जय दत्तात्रेय
    दत्तात्रेय ॥ १०॥ ॥ ॐ नमो भगवते दत्तात्रेयाय ॥
