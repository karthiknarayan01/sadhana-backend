id: annamayya-keerthanas-itarulaku-ninu
category: stotram
name:
  english: Annamayya Keerthanas Itarulaku Ninu
content:
  english: capu pallavi itarulaku ninu nèrugadarama || satatasatyavratulu sampurnamohavira hitulèruguduru
    ninu nindiraramana || caranam nari kataksha patu naraca bhayarahita shurulèruguduru ninu juceti cupu
    | òrasamsara sankula paricchedulagu dhirulèruguduru nidivya vigrahamu || itarulaku ninu nèrugadarama
    ragabhogavidura ranjitatmulu maha bhagulèruguduru ninu branutincuvidhamu | agamoktaprakarabhigamyulu
    maha yogulèruguduru nivundetivuniki || itarulaku ninu nèrugadarama paramabhagavata padapadmasevanija
    bharanu lèruguduru nipaliketipaluku | paragunityananda paripurnamanasa sthiru lèruguduru ninu diruvenkatesha
    || itarulaku ninu nèrugadarama || satatasatyavratulu sampurnamohavira hitulèruguduru ninu nindiraramana
    ||
  devanagari: चापु पल्लवि इतरुलकु निनु नॆरुगदरमा ॥ सततसत्यव्रतुलु सम्पूर्णमोहविर हितुलॆरुगुदुरु निनु निन्दिरारमणा
    ॥ चरणं नारी कटाक्ष पटु नाराच भयरहित शूरुलॆरुगुदुरु निनु जूचेटि चूपु । ऒरसंसार सङ्कुल परिच्छेदुलगु
    धीरुलॆरुगुदुरु नीदिव्य विग्रहमु ॥ इतरुलकु निनु नॆरुगदरमा रागभोगविदूर रञ्जितात्मुलु महा भागुलॆरुगुदुरु
    निनु ब्रणुतिञ्चुविधमु । आगमोक्तप्रकाराभिगम्युलु महा योगुलॆरुगुदुरु नीवुण्डेटिवुनिकि ॥ इतरुलकु निनु
    नॆरुगदरमा परमभागवत पदपद्मसेवानिजा भरणु लॆरुगुदुरु नीपलिकेटिपलुकु । परगुनित्यानन्द परिपूर्णमानस स्थिरु
    लॆरुगुदुरु निनु दिरुवेङ्कटेश ॥ इतरुलकु निनु नॆरुगदरमा ॥ सततसत्यव्रतुलु सम्पूर्णमोहविर हितुलॆरुगुदुरु
    निनु निन्दिरारमणा ॥
