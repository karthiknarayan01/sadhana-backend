id: trailokyamohanakalikavacam
category: kavacha
name:
  english: trailokyamohanakalikavacam
  devanagari: त्रैलोक्यमोहनकालीकवचम्
content:
  english: pradayini || 20|| patu gudam krim krim dakshine kalike hrim hrim svaha | dvadashi ca mahavidya
    raghavenarcita sada || 21|| januni patu om krim krim dakshine kalike svaha | ekadashi mahavidya meghanadena
    sevita || 22|| krim krim dakshine kalike hrim hrim svaha janghe'vatu dvadashi ca mahavidya prahladena
    ca sevita || 23|| krim hu~ hrim dakshine kalike krim hu~ hrim svaha'vatu | caturdashi padayugmam gurudevena
    sevita || 24|| krim hu~ hrim dakshine kalike krim hu~ hrim tatha'ngulih | patu me dvadashi kali kshetrapalena
    sevita || 25|| om krim hu~ hrim dakshine kalike krim hu~ hrim svaha ca | nakhansarvansada patu pancadashi
    graheshvari || 26|| krim krim krim hu~ hu~ hrim hrim dakshine kalike krim krim krim | mama prishthe
    sada patu shodashi parameshvari || 27|| krim krim krim patu romani hu~ hu~ rakshatu varmani | mamsam
    patu sada hrim hrim raktam dakshinakalika || 28|| krim krim krim patu me casthi majjam hu~ hu~ sada'vatu
    | hrim hrim shukram sada patu ramdhram svaha mama'vatu || 29|| dvavimshatyakshari vidya sarvalokeshu
    durlabha | mahavidyeshvari vidya sarvatantreshu gopita || 30|| suryavamshena somena ramena jamadagnina
    | jayantena sunandena balina naradena ca || 31|| vibhishanena banena bhriguna kashyapena ca | kapilena
    vasishthena dhaumyena tripurena ca || 32|| markandayena dhruvenaiva dronena satyabhamaya | rishyasha
  devanagari: प्रदायिनी ॥ २०॥ पातु गुदं क्रीं क्रीं दक्षिणे कालिके ह्रीं ह्रीं स्वाहा । द्वादशी च महाविद्या
    राघवेणार्चिता सदा ॥ २१॥ जानुनी पातु ॐ क्रीं क्रीं दक्षिणे कालिके स्वाहा । एकादशी महाविद्या मेघनादेन
    सेविता ॥ २२॥ क्रीं क्रीं दक्षिणे कालिके ह्रीं ह्रीं स्वाहा जङ्घेऽवतु द्वादशी च महाविद्या प्रह्लादेन
    च सेविता ॥ २३॥ क्रीं हूँ ह्रीं दक्षिणे कालिके क्रीं हूँ ह्रीं स्वाहाऽवतु । चतुर्दशी पादयुग्मं गुरुदेवेन
    सेविता ॥ २४॥ क्रीं हूँ ह्रीं दक्षिणे कालिके क्रीं हूँ ह्रीं तथाऽङ्गुलीः । पातु मे द्वादशी काली क्षेत्रपालेन
    सेविता ॥ २५॥ ॐ क्रीं हूँ ह्रीं दक्षिणे कालिके क्रीं हूँ ह्रीं स्वाहा च । नखान्सर्वान्सदा पातु पञ्चदशी
    ग्रहेश्वरी ॥ २६॥ क्रीं क्रीं क्रीं हूँ हूँ ह्रीं ह्रीं दक्षिणे कालिके क्रीं क्रीं क्रीं । मम पृष्ठे
    सदा पातु षोडशी परमेश्वरी ॥ २७॥ क्रीं क्रीं क्रीं पातु रोमाणि हूँ हूँ रक्षतु वर्मणि । मांसं पातु सदा
    ह्रीं ह्रीं रक्तं दक्षिणकालिका ॥ २८॥ क्रीं क्रीं क्रीं पातु मे चास्थि मज्जां हूँ हूँ सदाऽवतु । ह्रीं
    ह्रीं शुक्रं सदा पातु रंध्रं स्वाहा ममाऽवतु ॥ २९॥ द्वाविंशत्यक्षरी विद्या सर्वलोकेषु दुर्लभा । महाविद्येश्वरी
    विद्या सर्वतन्त्रेषु गोपिता ॥ ३०॥ सूर्यवंशेन सोमेन रामेण जमदग्निना । जयन्तेन सुनन्देन बलिना नारदेन
    च ॥ ३१॥ विभीषणेन बाणेन भृगुणा कश्यपेन च । कपिलेन वसिष्ठेन धौम्येन त्रिपुरेण च ॥ ३२॥ मार्कण्डयेन ध्रुवेणैव
    द्रोणेन सत्यभामया । ऋष्यश
