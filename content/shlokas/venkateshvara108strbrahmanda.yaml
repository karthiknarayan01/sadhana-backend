id: venkateshvara108strbrahmanda
category: stotram
name:
  english: venkateshvara108strbrahmanda
  devanagari: वेन्कटेश्वर१०८स्त्र्ब्रह्माण्ड
content:
  english: shrivenkateshvarashtottarashatanamastotram shri venkateshah shrinivaso lakshmipatiranamayah
    amritamsho jagadvandyogovindashshashvatah prabhum sheshadri nilayo devah keshavo madhusudanah | amritomadhavah
    krishnam shriharirjnanapanjara || 1|| shri vatsavakshasarvesho gopalah purushottamah | gopishvarah
    paranjyotirvaikuntha patiravyayah || 2|| sudhatanaryadavendro nityayauvanarupavan | caturvedatmako
    vishnu racyutah padminipriyah || 3|| dharapatissurapatirnirmalo devapujitah | caturbhuja shcakradhara
    stridhama trigunashrayah || 4|| nirvikalpo nishkaḻanko nirantako niranjanah | nirabhaso nityatripto
    nirgunonirupadravah || 5|| gadadhara sharngapanirnandaki shankhadharakah | anekamurtiravyaktah katihasto
    varapradah || 6|| anekatma dinabandhurartalokabhayapradah | akasharajavarado yogihritpadma mandirah
    || 7|| damodaro jagatpalah papaghnobhaktavatsalah | trivikramashimshumaro jatamakutashobhitah || 8||
    shankhamadhyollasanmanjukinkinyadhyakarandakah | nilameghashyamatanurbilvapatrarcana priyah || 9||
    jagadvyapi jagatkarta jagatsakshi jagatpatih | cintitarthaprado jishnurdasharathe dasharupavan ||
    10|| devakinandana shauri hayagrivo janardhanah | kanyashravanatarejya pitambaronaghah || 11|| vanamalipadmanabha
    mrigayasakta manasah | ashvarudham khadgadharidhanarjana samutsukah || 12|| ghanasarasanmadhyakasturitilakojjvalah
    | saccidanandarupashca jaganmangaḻadayakah || 13|| yajnarupo yajnabhokta cinmayah parameshvarah |
    paramarthaprada shshantashshriman dordhanda vikramah || 14|| paratparah parabrahma shrivibhurjagadishvarah
    | evam shri venkateshasyanamnam ashtottaram shatam || 15|| pathyatam sha
  devanagari: श्रीवेङ्कटेश्वराष्टोत्तरशतनामस्तोत्रम् श्री वेङ्कटेशः श्रीनिवासो लक्ष्मीपतिरनामयः अमृतांशो
    जगद्वन्द्योगोविन्दश्शाश्वतः प्रभुं शेषाद्रि निलयो देवः केशवो मधुसूदनः । अमृतोमाधवः कृष्णं श्रीहरिर्ज्ञानपञ्जर
    ॥ १॥ श्री वत्सवक्षसर्वेशो गोपालः पुरुषोत्तमः । गोपीश्वरः परञ्ज्योतिर्वैकुण्ठ पतिरव्ययः ॥ २॥ सुधातनर्यादवेन्द्रो
    नित्ययौवनरूपवान् । चतुर्वेदात्मको विष्णु रच्युतः पद्मिनीप्रियः ॥ ३॥ धरापतिस्सुरपतिर्निर्मलो देवपूजितः
    । चतुर्भुज श्चक्रधर स्त्रिधामा त्रिगुणाश्रयः ॥ ४॥ निर्विकल्पो निष्कळङ्को निरान्तको निरञ्जनः । निराभासो
    नित्यतृप्तो निर्गुणोनिरुपद्रवः ॥ ५॥ गदाधर शार्ङ्गपाणिर्नन्दकी शङ्खधारकः । अनेकमूर्तिरव्यक्तः कटिहस्तो
    वरप्रदः ॥ ६॥ अनेकात्मा दीनबन्धुरार्तलोकाभयप्रदः । आकाशराजवरदो योगिहृत्पद्म मन्दिरः ॥ ७॥ दामोदरो जगत्पालः
    पापघ्नोभक्तवत्सलः । त्रिविक्रमशिंशुमारो जटामकुटशोभितः ॥ ८॥ शङ्खमध्योल्लसन्मञ्जूकिङ्किण्याध्यकरन्दकः
    । नीलमेघश्यामतनुर्बिल्वपत्रार्चन प्रियः ॥ ९॥ जगद्व्यापी जगत्कर्ता जगत्साक्षी जगत्पतिः । चिन्तितार्थप्रदो
    जिष्णुर्दाशरथे दशरूपवान् ॥ १०॥ देवकीनन्दन शौरि हयग्रीवो जनार्धनः । कन्याश्रवणतारेज्य पीताम्बरोनघः
    ॥ ११॥ वनमालीपद्मनाभ मृगयासक्त मानसः । अश्वारूढं खड्गधारीधनार्जन समुत्सुकः ॥ १२॥ घनसारसन्मध्यकस्तूरीतिलकोज्ज्वलः
    । सच्चिदानन्दरूपश्च जगन्मङ्गळदायकः ॥ १३॥ यज्ञरूपो यज्ञभोक्ता चिन्मयः परमेश्वरः । परमार्थप्रद श्शान्तश्श्रीमान्
    दोर्धण्ड विक्रमः ॥ १४॥ परात्परः परब्रह्मा श्रीविभुर्जगदीश्वरः । एवं श्री वेङ्कटेशस्यनाम्नां अष्टोत्तरं
    शतम् ॥ १५॥ पठ्यतां श
