id: amba-stavam
category: stotram
name:
  english: Amba Stavam
  devanagari: अम्बास्तवम् (वासुदेवन् एलयथेन विरचितम्)
content:
  english: ambike! pranamami tvamayare gramadevate | sarvashakte, prasida tvam saccidanandarupini || 1||
    gramarakshabaddhadikshe, gramapushtipradayini! | apannivarake devi! dayamayi, namo'stu te || 2|| prasannakarunapurnavilolanayanambujam
    | akuncitamanoharisphuraccillimatlikam || 3|| sinduratilakodbhasivishalanitilancitam | kapolabimbitaramyamanikundalabhushitam
    || 4|| mandasmitamanohari madhuradharashobhitam | anilapattavasanasamavritakalevaram || 5|| prashantadivyamahasa
    pariveshitavigraham | dhyayami tvam mahadevim shrividyashaktirupinim || 6|| prasida tvam shive, devi,
    lakshmi, durge, sarasvati | ramyam bhavadrupamidam bhasatam hridaye sada || 7|| vipadastrahi no devi!
    sampado dehi nah shive! | asmasu dhehi karunam bhaktan nah pahi sarvada || 8|| gramambikastotramidam
    ye pathanti samahitah | shrinvanti va tatha teshu prasidati maheshvari! || 9|| iti shrivasudevan elayathena
    viracitam ambastavam sampurnam |
  devanagari: अम्बिके! प्रणमामि त्वामायरे ग्रामदेवते । सर्वशक्ते, प्रसीद त्वं सच्चिदानन्दरूपिणि ॥ १॥ ग्रामरक्षाबद्धदीक्षे,
    ग्रामपुष्टिप्रदायिनि! । आपन्निवारके देवि! दयामयि, नमोऽस्तु ते ॥ २॥ प्रसन्नकरुणापूर्णविलोलनयनाम्बुजाम्
    । आकुञ्चितमनोहारिस्फुरच्चिल्लीमत्लिकाम् ॥ ३॥ सिन्दूरतिलकोद्भासिविशालनिटिलाञ्चिताम् । कपोलबिम्बितारम्यमणिकुण्डलभूषिताम्
    ॥ ४॥ मन्दस्मितमनोहारि मधुराधरशोभिताम् । आनीलपट्टवसनसमावृतकलेवराम् ॥ ५॥ प्रशान्तदिव्यमहसा परिवेषितविग्रहाम्
    । ध्यायामि त्वां महादेवीं श्रीविद्याशक्तिरूपिणीम् ॥ ६॥ प्रसीद त्वं शिवे, देवि, लक्ष्मि, दुर्गे, सरस्वति
    । रम्यं भवद्रूपमिदं भासतां हृदये सदा ॥ ७॥ विपदस्त्राहि नो देवि! सम्पदो देहि नः शिवे! । अस्मासु धेहि
    करुणां भक्तान् नः पाहि सर्वदा ॥ ८॥ ग्रामाम्बिकास्तोत्रमिदं ये पठन्ति समाहिताः । शृण्वन्ति वा तथा तेषु
    प्रसीदति महेश्वरी! ॥ ९॥ इति श्रीवासुदेवन् एलयथेन विरचितं अम्बास्तवं सम्पूर्णम् ।
