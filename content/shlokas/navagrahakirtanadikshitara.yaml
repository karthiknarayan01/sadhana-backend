id: navagrahakirtanadikshitara
category: stotram
name:
  english: navagrahakirtanadikshitara
  devanagari: नवग्रहकीर्तनदिक्षितार
content:
  english: catushrajati rupaka angarakamashrayamyaham vinatashritajanamandaram mangaḻavaram bhumikumaram
    varam varam | bringarakameshavrishcikarashyadhipatim raktangam raktambaradidharam shaktishuladharam
    mangaḻam kambugaḻam manjuḻatarakarayugaḻam mangaḻadayakameshaturangam makarottungam | danavasurasevitam
    mandasmitavilasitavaktram dharanipradam bhratrikarakam raktanetram dinarakshakam pujitavaidyanathakshetram
    divyaughadiguruguhakatakshanugrahapatram bhanucandragurumitram bhasamanasukaḻatram janusthahastacitram
    caturbhujamativicitram || angarakam ashrayami aham
  devanagari: चतुश्रजाति रूपक अङ्गारकमाश्रयाम्यहं विनताश्रितजनमन्दारं मङ्गळवारं भूमिकुमारं वारं वारम्
    । बृङ्गारकमेषवॄश्चिकराश्यधिपतिं रक्ताङ्गं रक्ताम्बरादिधरं शक्तिशूलधरं मङ्गळं कम्बुगळं मञ्जुळतरकरयुगळं
    मङ्गळदायकमेषतुरङ्गं मकरोत्तुङ्गम् । दानवसुरसेवितं मन्दस्मितविलसितवक्त्रं धरणीप्रदं भ्रातृकारकं रक्तनेत्रं
    दीनरक्षकं पूजितवैद्यनाथक्षेत्रं दिव्यौघादिगुरुगुहकटाक्षानुग्रहपात्रं भानुचन्द्रगुरुमित्रं भासमानसुकळत्रं
    जानुस्थहस्तचित्रं चतुर्भुजमतिविचित्रम् ॥ अङ्गारकं आश्रयामि अहं
meaning: {}
