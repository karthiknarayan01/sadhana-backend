id: yamunastavamgargasamhita
category: stotram
name:
  english: yamunastavamgargasamhita
  devanagari: यमुनास्तवम्गर्गसम्हिता
content:
  english: rinu mahamate | sarvasiddhikaram bhumau caturvargyaphalapradam || 2|| krishnavamamsabhutayai
    krishnayai satatam namah | namah shrikrishnarupinyai krishne tubhyam namo namah || 3|| yah papapankambukalankakutsitah
    kami kudhih satsu kalim karoti hi | vrindavanam dhama dadati tasmai nadanmilindadi kalindanandini
    || 4|| krishne sakshatkrishnarupa tvameva vegavarte vartase matsyarupi | urmavurmau kurmarupi sada
    te bindau bindau bhati govindadevah || 5|| vande lilavatim tvam saghanaghananibham krishnavamamsabhutam
    vegam vai vairajakhyam sakalajalacayam khandayantim balatsvat | chitva brahmandamaratsuranagaranagan
    gandashailadidurgan bhitva bhukhandamadhye tatanidhritavatimurmimalam prayantim || 6|| divyam kau
    namadheyam shrutamatha yamune dandayatyadritulyam papavyuham tvakhandam vasatu mama giram mandale
    tu kshanam tat | dandyamshcakaryadandya sakridapi vacasa khanditam yadgrihitam bhraturmartandasunoratati
    puri dridhaste pracando'tidandah || 7|| rajjurva vishayandhakupatarane papakhudarvikari | venyushnik
    ca virajamurtishiraso malasti va sundari | dhanyam bhagyamatah param bhuvi nrinam yatradikridvallabha
    | goloke'pyatidurlabhatishubhaga bhatyadvitiya nadi || 8|| gopigokulagopakelikalite kalindi krishnaprabhe
    tvatkule jalalolagolavicalatkallolakolahalah | tvatkantarakutuhalalikulakrijjhankarakekakulah kujatkokilasankulo
    vrajalatalankarabhritpatu mam || 9|| bhavanti jihvastanuromatulya giro yada bhusikata ivashu | tadapyalam
    yanti na te gunantam santo mahantah kila sheshatulyah || 10|| kalindagirinandinistava ushasyayam vaparah
    shrutashca yadi pathito bhuvi tanoti sanmangalam | jano'pi yadi dharayetkila pathecca yo nityashah
    sa yati paramam padam nijanikunjalilavritam || 11|| iti shrigargasamhitayam madhuryakhande shrinaradabahulashvasamvade
    shrisaubharimandhatrisamvade shriyamunastavo nama saptadasho'dhyayah || 17||
  devanagari: ृणु महामते । सर्वसिद्धिकरं भूमौ चातुर्वर्ग्यफलप्रदम् ॥ २॥ कृष्णवामांसभूतायै कृष्णायै सततं
    नमः । नमः श्रीकृष्णरूपिण्यै कृष्णे तुभ्यं नमो नमः ॥ ३॥ यः पापपङ्काम्बुकलङ्ककुत्सितः कामी कुधीः सत्सु
    कलिं करोति हि । वृन्दावनं धाम ददाति तस्मै नदन्मिलिन्दादि कलिन्दनन्दिनी ॥ ४॥ कृष्णे साक्षात्कृष्णरूपा
    त्वमेव वेगावर्ते वर्तसे मत्स्यरूपी । ऊर्मावूर्मौ कूर्मरूपी सदा ते बिन्दौ बिन्दौ भाति गोविन्ददेवः ॥
    ५॥ वन्दे लीलावतीं त्वां सघनघननिभां कृष्णवामांसभूतां वेगं वै वैरजाख्यं सकलजलचयं खण्डयन्तीं बलात्स्वात्
    । छित्वा ब्रह्माण्डमारात्सुरनगरनगान् गण्डशैलादिदुर्गान् भित्वा भूखण्डमध्ये तटनिधृतवतीमूर्मिमालां प्रयान्तीम्
    ॥ ६॥ दिव्यं कौ नामधेयं श्रुतमथ यमुने दण्डयत्यद्रितुल्यं पापव्यूहं त्वखण्डं वसतु मम गिरां मण्डले तु
    क्षणं तत् । दण्ड्यांश्चाकार्यदण्ड्या सकृदपि वचसा खण्डितं यद्गृहीतं भ्रातुर्मार्तण्डसूनोरटति पुरि दृढस्ते
    प्रचण्डोऽतिदण्डः ॥ ७॥ रज्जुर्वा विषयान्धकूपतरणे पापाखुदर्वीकरी । वेण्युष्णिक् च विराजमूर्तिशिरसो मालास्ति
    वा सुन्दरी । धन्यं भाग्यमतः परं भुवि नृणां यत्रादिकृद्वल्लभा । गोलोकेऽप्यतिदुर्लभातिशुभगा भात्यद्वितीया
    नदी ॥ ८॥ गोपीगोकुलगोपकेलिकलिते कालिन्दि कृष्णप्रभे त्वत्कूले जललोलगोलविचलत्कल्लोलकोलाहलः । त्वत्कान्तारकुतूहलालिकुलकृज्झङ्कारकेकाकुलः
    कूजत्कोकिलसङ्कुलो व्रजलतालङ्कारभृत्पातु माम् ॥ ९॥ भवन्ति जिह्वास्तनुरोमतुल्या गिरो यदा भूसिकता इवाशु
    । तदप्यलं यान्ति न ते गुणान्तं सन्तो महान्तः किल शेषतुल्याः ॥ १०॥ कलिन्दगिरिनन्दिनीस्तव उषस्ययं वापरः
    श्रुतश्च यदि पाठितो भुवि तनोति सन्मङ्गलम् । जनोऽपि यदि धारयेत्किल पठेच्च यो नित्यशः स याति परमं पदं
    निजनिकुञ्जलीलावृतम् ॥ ११॥ इति श्रीगर्गसंहितायां माधुर्यखण्डे श्रीनारदबहुलाश्वसंवादे श्रीसौभरिमान्धातृसंवादे
    श्रीयमुनास्तवो नाम सप्तदशोऽध्यायः ॥ १७॥
