id: amjaneya-dvadashanamastotram
category: stotram
name:
  english: amjaneya dvadashanamastotram
  devanagari: आंजनेय द्वादशनामस्तोत्रम्
content:
  english: '|| shriamjaneya dvadashanamastotram || hanumanamjanasunuh vayuputro mahabalah | rameshtah
    phalgunasakhah pimgaksho''mitavikramah || 1|| udadhikramanashcaiva sitashokavinashakah | lakshmana
    pranadataca dashagrivasya darpaha || 2|| dvadashaitani namani kapimdrasya mahatmanah | svapakale pathennityam
    yatrakale visheshatah | tasyamrityu bhayamnasti sarvatra vijayi bhavet ||'
  devanagari: ॥ श्रीआंजनेय द्वादशनामस्तोत्रम् ॥ हनुमानंजनासूनुः वायुपुत्रो महाबलः । रामेष्टः फल्गुणसखः
    पिंगाक्षोऽमितविक्रमः ॥ १॥ उदधिक्रमणश्चैव सीताशोकविनाशकः । लक्ष्मण प्राणदाताच दशग्रीवस्य दर्पहा ॥ २॥
    द्वादशैतानि नामानि कपींद्रस्य महात्मनः । स्वापकाले पठेन्नित्यं यात्राकाले विशेषतः । तस्यमृत्यु भयंनास्ति
    सर्वत्र विजयी भवेत् ॥
meaning: {}
