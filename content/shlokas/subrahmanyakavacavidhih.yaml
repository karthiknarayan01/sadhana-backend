id: subrahmanyakavacavidhih
category: kavacha
name:
  english: subrahmanyakavacavidhih
  devanagari: सुब्रह्मण्यकवचविधिः
content:
  english: sindurarunamindukanti vadanam keyuraharadibhih divyairabharanairvibhushitatanuh svargasya saukhyapradam
    | ambhojabhayashaktikukkutadharam raktangaragojvalam subrahmanyamupasmahe pranamatam bhitipranashodyatam
    || 3|| subrahmanyo'gratah patu senanih patu prishthatah | guho mam dakshine patu bhupatih patu vamatah
    || 4|| shirah patu mahasenah skando rakshellalatakam | netrayordvadashakshashca shrotram rakshatu
    vishvabhuh || 5|| mukham me shanmukhah patu nasikam makaratmajah | oshtham vallipatih patu jihvam
    patu shadaksharah || 6|| devasenapatirdantan cibukam bahulasutah | kantham tarakajitpatu bahum dvadashabahuman
    || 7|| hastau shaktidharah patu vakshah patu sharodbhavah | hridayam brahmabhuh patu kukshim patvambikasutah
    || 8|| nabhim shambhusutah patu katim patu haratmajah | urum patu gajarudho janu dve jahnavisutah
    || 9|| janghe vishakho me patu padayoh shikhivahanah | sarvanyangani bhuteshah saptadhatumshca shanmukhah
    || 10|| sandhyakale nishithinyam madhyahne dustare jale | durgame ca maharanye rajadvare sahayake
    || 11|| tumule ranamadhye ca sarpadushtamrigadishu | coradisadhvase'bhedye jvaradivyadhipidite ||
    12|| dushtagrahadibhitau ca durnimittadibhishane | astrashastranighateshu tratu mam krauncarandhrakrit
    || 13|| subrahmanyasyakavacamishtasiddhiphalam bhavet | tasya tapatrayam nasti satyam satyam vadamyaham
    || 14|| dharmarthi labhate dharmanartharthi carthamapnuyat | kamarthi labhate kaman moksharthi mokshamapnuyat
    || 15|| yatra yatra japet tatra tatra sannihito guhah | pujapratishthakale ca japakale pathedidam
    || 16|| teshameva phalavaptyai mahapatakanashanam | yah pathecchrinuyadbhaktya nityam devasya sannnidhau
    | sarvan kamaniha prapya so'nte skandapuram vrajet || 17|| iti shrikumaratantre subrahmanyakavacavidhirnama
    ashtacatvarimshatpatalah | 48
  devanagari: सिन्दूरारुणमिन्दुकान्ति वदनं केयूरहारादिभिः दिव्यैराभरणैर्विभूषिततनुः स्वर्गस्य सौख्यप्रदम्
    । अम्भोजाभयशक्तिकुक्कुटधरं रक्ताङ्गरागोज्वलं सुब्रह्मण्यमुपास्महे प्रणमतां भीतिप्रणाशोद्यतम् ॥ ३॥
    सुब्रह्मण्योऽग्रतः पातु सेनानीः पातु पृष्ठतः । गुहो मां दक्षिणे पातु भूपतिः पातु वामतः ॥ ४॥ शिरः पातु
    महासेनः स्कन्दो रक्षेल्ललाटकम् । नेत्रयोर्द्वादशाक्षश्च श्रोत्रं रक्षतु विश्वभूः ॥ ५॥ मुखं मे षण्मुखः
    पातु नासिकां मकरात्मजः । ओष्ठं वल्लीपतिः पातु जिह्वां पातु षडक्षरः ॥ ६॥ देवसेनापतिर्दन्तान् चिबुकं
    बहुलासुतः । कण्ठं तारकजित्पातु बाहुं द्वादशबाहुमान् ॥ ७॥ हस्तौ शक्तिधरः पातु वक्षः पातु शरोद्भवः ।
    हृदयं ब्रह्मभूः पातु कुक्षिं पात्वम्बिकासुतः ॥ ८॥ नाभिं शम्भुसुतः पातु कटिं पातु हरात्मजः । ऊरुं पातु
    गजारूढो जानू द्वे जाह्नवीसुतः ॥ ९॥ जङ्घे विशाखो मे पातु पादयोः शिखिवाहनः । सर्वाण्यङ्गानि भूतेशः सप्तधातूंश्च
    षण्मुखः ॥ १०॥ सन्ध्याकाले निशीथिन्यां मध्याह्ने दुस्तरे जले । दुर्गमे च महारण्ये राजद्वारे सहायके
    ॥ ११॥ तुमुले रणमध्ये च सर्पदुष्टमृगादिषु । चोरादिसाध्वसेऽभेद्ये ज्वरादिव्याधिपीडिते ॥ १२॥ दुष्टग्रहादिभीतौ
    च दुर्निमित्तादिभीषणे । अस्त्रशस्त्रनिघातेषु त्रातु मां क्रौञ्चरन्ध्रकृत् ॥ १३॥ सुब्रह्मण्यस्यकवचमिष्टसिद्धिफलं
    भवेत् । तस्य तापत्रयं नास्ति सत्यं सत्यं वदाम्यहम् ॥ १४॥ धर्मार्थी लभते धर्मानर्थार्थी चार्थमाप्नुयात्
    । कामार्थी लभते कामान् मोक्षार्थी मोक्षमाप्नुयात् ॥ १५॥ यत्र यत्र जपेत् तत्र तत्र सन्निहितो गुहः ।
    पूजाप्रतिष्ठाकाले च जपकाले पठेदिदम् ॥ १६॥ तेषामेव फलावाप्त्यै महापातकनाशनम् । यः पठेच्छृणुयाद्भक्त्या
    नित्यं देवस्य सन्न्निधौ । सर्वान् कामानिह प्राप्य सोऽन्ते स्कन्दपुरं व्रजेत् ॥ १७॥ इति श्रीकुमारतन्त्रे
    सुब्रह्मण्यकवचविधिर्नाम अष्टचत्वारिंशत्पटलः । ४८
