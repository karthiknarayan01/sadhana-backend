id: yatindrashtaksharastotram
category: stotram
name:
  english: yatindrashtaksharastotram
  devanagari: यतीन्द्राष्टाक्षरस्तोत्रम्
content:
  english: yatindrashtaksharastotram punyasadyasutah punyah sushilanandavardhanah | yah shriramavatarah
    sa yatindrah sharanam mama || 1| yah shrimadraghavanandacaryashishyo jagaduruh | ramabrahmopadeshta
    sa yatindrah sharanam mama || 2|| vedarntashekshako yah shrivaishnavadharmarakshakah | sampradayabdhicandrah
    sa yatindrah sharanam mama || 3|| vishishtadvaitasidvantarakshadakshah sudeshikah | bodhayananuyayi
    sa yatindrah sharanam mama || 4|| vadivaranashardulah sudhirdigvijayo mahan | anandabhashyakarta sa
    yatindrah sharanam mama || 5|| sidghedevainripaliryah panditendreshca pujitah | sitshyavdhidivyadehah
    sa yatindrah sharanam mama || 6|| ramabhaktipradanena sadbhaktimuktidashca yah | ramanando mahacaryo
    yatindrah sharanam mama || 7|| vaishnava bhashyakara shri vaishnavacaryanirmitam | yatindarashtaksharastotram
    sarvabhitivinashakam || 8|| iti yatindrashtaksharastotram sampurnam |
  devanagari: यतीन्द्राष्टाक्षरस्तोत्रम् पुण्यसद्यसुतः पुण्यः सुशीलानन्दवर्धनः । यः श्रीरामावतारः स यतीन्द्रः
    शरणं मम ॥ १। यः श्रीमद्राघवानन्दाचार्यशिष्यो जगदुरुः । रामब्रह्मोपदेष्टा स यतीन्द्रः शरणं मम ॥ २॥
    वेदार्न्ताशेक्षको यः श्रीवैष्णवधर्मरक्षकः । सम्प्रदायाब्धिचन्द्रः स यतीन्द्रः शरणं मम ॥ ३॥ विशिष्टाद्वैतसिद्वान्तरक्षादक्षः
    सुदेशिकः । बोधायनानुयायी स यतीन्द्रः शरणं मम ॥ ४॥ वादिवारणशार्दूलः सुधीर्दिग्विजयो महान् । आनन्दभाष्यकर्ता
    स यतीन्द्रः शरणं मम ॥ ५॥ सिद्घेदेवैनृपालीर्यः पण्डितेन्द्रेश्च पूजितः । सित्ष्यव्धिदिव्यदेहः स यतीन्द्रः
    शरणं मम ॥ ६॥ रामभक्तिप्रदानेन सद्भक्तिमुक्तिदश्च यः । रामानन्दो महाचार्यो यतीन्द्रः शरणं मम ॥ ७॥ वैष्णव
    भाष्यकार श्री वैष्णावाचार्यनिर्मितम् । यतीन्दराष्टाक्षरस्तोत्रं सर्वभीतिविनाशकम् ॥ ८॥ इति यतीन्द्राष्टाक्षरस्तोत्रं
    सम्पूर्णम् ।
meaning: {}
