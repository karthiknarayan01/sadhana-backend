id: shakyasimhastotram-3
category: stotram
name:
  english: shakyasimhastotram 3
  devanagari: शाक्यसिंहस्तोत्रम् ३
content:
  english: shakyasimhastotram 3 om namah shakyasimhaya | namaste shakyasimhaya dharmacakrapravartaka |
    traidhatukam jagatsarvam shodhayet sarvadurgatim || 1|| namaste vajroshnishaya dharmadhatusvabhavaka
    | sarvasattvahitarthaya atmatattvapradeshaka || 2|| namaste ratnoshnishaya samantattattvabhavanaih
    | traidhatukam sthitam sarvamabhishekapradayaka || 3|| namaste padmoshnishaya svabhavapratyabhashaka
    | ashvasayanyah sattveshu dharmamritam pravartayet || 4|| namaste vishvoshnishaya svabhavakritamanusthita
    | vishvakarmakaro hyesha sattvanam duhkhashantaye || 5|| namaste tejoshnishaya traidhatukamabhashaka
    | sarvasattva upayeshu sattvadrishtam karishyate || 6|| namaste dhvajoshnishaya cintamanidhvajadhara
    | danena sarvasattvanam sarvashaparipuraka || 7|| namaste trishnoshnishaya kleshopakleshachedana |
    caturmarabalam bhagnam sattvanam bodhipraptaye || 8|| namaste chatroshnishaya atapatram sushobhanam
    | traidhatuka jagatsarvam dharmarajatvaprapakam || 9|| lasya mala tatha gita nritya devicatushtayam
    | pushpa dhupa ca dipa ca gandhadevi namo'stu te || 10|| dvaramadhyasthita ye ca ankushapashaphotakah
    | shraddhabhavavinirjnatam dvarapala namo'stu te || 11|| vedikadau sthita ye ca catasro dvarapalikah
    | muditadau dasha sthitva bodhisattva namo'stu te || 12|| brahmendrarudracandrarka lokapalashcaturdisham
    | agni rakshasavayushca bhutadhipate namo'stu te || 13|| anena stotrarajena samsthito mandalagratah
    | vajraghantagharo mantri idam stotramudaharet || 14|| iti durgatiparishodhanoddhritam shrishakyasimhastotram
    sampurnam ||
  devanagari: शाक्यसिंहस्तोत्रम् ३ ॐ नमः शाक्यसिंहाय । नमस्ते शाक्यसिंहाय धर्मचक्रप्रवर्तक । त्रैधातुकं
    जगत्सर्वं शोधयेत् सर्वदुर्गतिम् ॥ १॥ नमस्ते वज्रोष्णीषाय धर्मधातुस्वभावक । सर्वसत्त्वहितार्थाय आत्मतत्त्वप्रदेशक
    ॥ २॥ नमस्ते रत्नोष्णीषाय समन्तात्तत्त्वभावनैः । त्रैधातुकं स्थितं सर्वमभिषेकप्रदायक ॥ ३॥ नमस्ते पद्मोष्णीषाय
    स्वभावप्रत्यभाषक । आश्वासयन्यः सत्त्वेषु धर्मामृतं प्रवर्तयेत् ॥ ४॥ नमस्ते विश्वोष्णीषाय स्वभावकृतमनुस्थित
    । विश्वकर्मकरो ह्येष सत्त्वानां दुःखशान्तये ॥ ५॥ नमस्ते तेजोष्णीषाय त्रैधातुकमभाषक । सर्वसत्त्व उपायेषु
    सत्त्वदृष्टं करिष्यते ॥ ६॥ नमस्ते ध्वजोष्णीषाय चिन्तामणिध्वजाधर । दानेन सर्वसत्त्वानां सर्वाशापरिपूरक
    ॥ ७॥ नमस्ते तृष्णोष्णीषाय क्लेशोपक्लेशछेदन । चतुर्मारबलं भग्नं सत्त्वानां बोधिप्राप्तये ॥ ८॥ नमस्ते
    छत्रोष्णीषाय आतपत्रं सुशोभनम् । त्रैधातुक जगत्सर्वं धर्मराजत्वप्रापकम् ॥ ९॥ लास्या माला तथा गीता नृत्या
    देवीचतुष्टयम् । पुष्पा धूपा च दीपा च गन्धादेवी नमोऽस्तु ते ॥ १०॥ द्वारमध्यस्थिता ये च अङ्कुशपाशफोटकाः
    । श्रद्धाभावविनिर्ज्ञातं द्वारपाल नमोऽस्तु ते ॥ ११॥ वेदिकादौ स्थिता ये च चतस्रो द्वारपालिकाः । मुदितादौ
    दश स्थित्वा बोधिसत्त्व नमोऽस्तु ते ॥ १२॥ ब्रह्मेन्द्ररुद्रचन्द्रार्का लोकपालाश्चतुर्दिशम् । अग्नी
    राक्षसवायुश्च भूताधिपते नमोऽस्तु ते ॥ १३॥ अनेन स्तोत्रराजेन संस्थितो मण्डलाग्रतः । वज्रघण्टाघरो मन्त्री
    इदं स्तोत्रमुदाहरेत् ॥ १४॥ इति दुर्गतिपरिशोधनोद्धृतं श्रीशाक्यसिंहस्तोत्रं सम्पूर्णम् ॥
