id: durga-108
category: stotram
name:
  english: durga 108
  devanagari: दुर्ग १०८
content:
  english: rinushva kamalanane | yasya prasadamatrena durga prita bhavet sati || 1|| om sati sadhvi bhavaprita
    bhavani bhavamocani | arya durga jaya cadya trinetra shuladharini || 2|| pinakadharini citra candaghanta
    mahatapah | mano buddhirahankara cittarupa cita citih || 3|| sarvamantramayi satta satyanandasvarupini
    | ananta bhavini bhavya bhavyabhavya sadagatih || 4|| shambhavi devamata ca cinta ratnapriya sada
    | sarvavidya dakshakanya dakshayajnavinashini || 5|| aparnanekavarna ca patala patalavati | pattambara
    paridhana kalamanjiraranjini || 6|| ameyavikrama krura sundari surasundari | vanadurga ca matangi
    matangamunipujita || 7|| brahmi maheshvari caindri kaumari vaishnavi tatha | camunda caiva varahi
    lakshmishca purushakritih || 8|| vimalotkarshini jnana kriya nitya ca buddhida | bahula bahulaprema
    sarvavahana vahana || 9|| nishumbhashumbhahanani mahishasuramardini | madhukaitabhahantri ca candamundavinashini
    || 10|| sarvasuravinasha ca sarvadanavaghatini | sarvashastramayi satya sarvastradharini tatha ||
    11|| anekashastrahasta ca anekastrasya dharini | kumari caikakanya ca kaishori yuvati yatih || 12||
    apraudha caiva praudha ca vriddhamata balaprada | mahodari muktakeshi ghorarupa mahabala || 13|| agnijvala
    raudramukhi kalaratristapasvini | narayani bhadrakali vishnumaya jalodari || 14|| shivaduti karali
    ca ananta parameshvari | katyayani ca savitri pratyaksha brahmavadini || 15|| ya idam prapathennityam
    durganamashatashtakam | nasadhyam vidyate devi trishu lokeshu parvati || 16|| dhanam dhanyam sutam
    jayam hayam hastinameva ca | caturvargam tatha cante labhenmuktim ca shashvatim || 17|| kumarim pujayitva
    tu dhyatva devim sureshvarim | pujayet paraya bhaktya pathennamashatashtakam || 18|| tasya siddhirbhaved
    devi sarvaih suravarairapi | rajano dasatam yanti rajyashriyamavapnuyat || 19|| gorocanalaktakakunkumeva
    sindhurakarpuramadhutrayena | vilikhya yantram vidhina vidhijno bhavet sada dharayate purarih || 20||
    bhaumavasyanishamagre candre shatabhisham gate | vilikhya prapathet stotram sa bhavet sampadam padam
    || 21|| || iti shrivishvasaratantre durgashtottarashatanamastotram samaptam ||
  devanagari: ृणुष्व कमलानने । यस्य प्रसादमात्रेण दुर्गा प्रीता भवेत् सती ॥ १॥ ॐ सती साध्वी भवप्रीता भवानी
    भवमोचनी । आर्या दुर्गा जया चाद्या त्रिनेत्रा शूलधारिणी ॥ २॥ पिनाकधारिणी चित्रा चण्डघण्टा महातपाः ।
    मनो बुद्धिरहङ्कारा चित्तरूपा चिता चितिः ॥ ३॥ सर्वमन्त्रमयी सत्ता सत्यानन्दस्वरूपिणी । अनन्ता भाविनी
    भाव्या भव्याभव्या सदागतिः ॥ ४॥ शाम्भवी देवमाता च चिन्ता रत्नप्रिया सदा । सर्वविद्या दक्षकन्या दक्षयज्ञविनाशिनी
    ॥ ५॥ अपर्णानेकवर्णा च पाटला पाटलावती । पट्टाम्बर परीधाना कलमञ्जीररञ्जिनी ॥ ६॥ अमेयविक्रमा क्रुरा सुन्दरी
    सुरसुन्दरी । वनदुर्गा च मातङ्गी मतङ्गमुनिपूजिता ॥ ७॥ ब्राह्मी माहेश्वरी चैन्द्री कौमारी वैष्णवी तथा
    । चामुण्डा चैव वाराही लक्ष्मीश्च पुरुषाकृतिः ॥ ८॥ विमलोत्कर्षिणी ज्ञाना क्रिया नित्या च बुद्धिदा ।
    बहुला बहुलप्रेमा सर्ववाहन वाहना ॥ ९॥ निशुम्भशुम्भहननी महिषासुरमर्दिनी । मधुकैटभहन्त्री च चण्डमुण्डविनाशिनी
    ॥ १०॥ सर्वासुरविनाशा च सर्वदानवघातिनी । सर्वशास्त्रमयी सत्या सर्वास्त्रधारिणी तथा ॥ ११॥ अनेकशस्त्रहस्ता
    च अनेकास्त्रस्य धारिणी । कुमारी चैककन्या च कैशोरी युवती यतिः ॥ १२॥ अप्रौढा चैव प्रौढा च वृद्धमाता
    बलप्रदा । महोदरी मुक्तकेशी घोररूपा महाबला ॥ १३॥ अग्निज्वाला रौद्रमुखी कालरात्रिस्तपस्विनी । नारायणी
    भद्रकाली विष्णुमाया जलोदरी ॥ १४॥ शिवदूती कराली च अनन्ता परमेश्वरी । कात्यायनी च सावित्री प्रत्यक्षा
    ब्रह्मवादिनी ॥ १५॥ य इदं प्रपठेन्नित्यं दुर्गानामशताष्टकम् । नासाध्यं विद्यते देवि त्रिषु लोकेषु पार्वति
    ॥ १६॥ धनं धान्यं सुतं जायां हयं हस्तिनमेव च । चतुर्वर्गं तथा चान्ते लभेन्मुक्तिं च शाश्वतीम् ॥ १७॥
    कुमारीं पूजयित्वा तु ध्यात्वा देवीं सुरेश्वरीम् । पूजयेत् परया भक्त्या पठेन्नामशताष्टकम् ॥ १८॥ तस्य
    सिद्धिर्भवेद् देवि सर्वैः सुरवरैरपि । राजानो दासतां यान्ति राज्यश्रियमवाप्नुयात् ॥ १९॥ गोरोचनालक्तककुङ्कुमेव
    सिन्धूरकर्पूरमधुत्रयेण । विलिख्य यन्त्रं विधिना विधिज्ञो भवेत् सदा धारयते पुरारिः ॥ २०॥ भौमावास्यानिशामग्रे
    चन्द्रे शतभिषां गते । विलिख्य प्रपठेत् स्तोत्रं स भवेत् सम्पदां पदम् ॥ २१॥ ॥ इति श्रीविश्वसारतन्त्रे
    दुर्गाष्टोत्तरशतनामस्तोत्रं समाप्तम् ॥
