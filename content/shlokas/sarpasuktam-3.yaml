id: sarpasuktam-3
category: sukta
name:
  english: sarpasuktam 3
  devanagari: सर्पसूक्तम् ३
content:
  english: sarpasuktam 3 namo̭ astu sa̱rpebhyo̱ ye ke ca̭ prithi̱vimanṷ | ye a̱ntari̭kshe̱ ye di̱vi tebhya̭h
    sa̱rpebhyo̱ nama̭h || yḙ'do ro̭ca̱ne di̱vo ye va̱ surya̭sya ra̱shmishṷ | yesha̭ma̱psu sada̭h kri̱tam
    tebhya̭h sa̱rpebhyo̱ nama̭h || ya isha̭vo yatu̱dhana̭na̱m ye va̱ vana̱spati̱
  devanagari: सर्पसूक्तम् ३ नमो॑ अस्तु स॒र्पेभ्यो॒ ये के च॑ पृथि॒वीमनु॑ । ये अ॒न्तरि॑क्षे॒ ये दि॒वि तेभ्यः॑
    स॒र्पेभ्यो॒ नमः॑ ॥ ये॑ऽदो रो॑च॒ने दि॒वो ये वा॒ सूर्य॑स्य र॒श्मिषु॑ । येषा॑म॒प्सु सदः॑ कृ॒तं तेभ्यः॑
    स॒र्पेभ्यो॒ नमः॑ ॥ या इष॑वो यातु॒धाना॑नां॒ ये वा॒ वन॒स्पती॒
meaning: {}
