id: gauridashakam
category: stotram
name:
  english: gauridashakam
  devanagari: गौरीदशकम्
content:
  english: iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya shrimacchamkarabhagavatah
    kritau gauridashakam sampurnam
  devanagari: इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छंकरभगवतः कृतौ
    गौरीदशकम् संपूर्णम्
meaning: {}
