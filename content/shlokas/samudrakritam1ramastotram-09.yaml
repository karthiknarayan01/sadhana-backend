id: samudrakritam1ramastotram-09
category: stotram
name:
  english: samudrakritam1ramastotram 09
  devanagari: समुद्रकृतं१रामस्तोत्रम् ०९
content:
  english: samudrakritam 1 ramastotram 9 samudra uvaca | namami te raghava padapankajam sitapate saukhyada
    padasevanat | namami te gautamadaramokshajam shripadarenum suravrindasevyam || 76|| sundapriyadehavidarine
    namo namo'stu te kaushikayagarakshine | namo mahadevasharasabhedine namo namo rakshasasanghanashine
    || 76|| rama rama namasyami bhaktanamishtadayinam | avatirno raghukule devakaryacikirshaya || 77||
    narayanamanadyantam mokshadam shivamacyutam | rama rama mahabaho raksha mam sharanagatam || 78|| kopam
    samhara rajendra kshamasva karunalaya | bhumirvato viyaccapo jyotimshi ca raghudvaha || 79|| yatsvabhavani
    srishtani brahmana parameshthina | vartante tatsvabhavani svabhavo me hyagadhata || 1
  devanagari: समुद्रकृतं १ रामस्तोत्रम् ९ समुद्र उवाच । नमामि ते राघव पादपङ्कजं सीतापते सौख्यद पादसेवनात्
    । नमामि ते गौतमदारमोक्षजं श्रीपादरेणुं सुरवृन्दसेव्यम् ॥ ७६॥ सुन्दप्रियादेहविदारिणे नमो नमोऽस्तु ते
    कौशिकयागरक्षिणे । नमो महादेवशरासभेदिने नमो नमो राक्षससङ्घनाशिने ॥ ७६॥ राम राम नमस्यामि भक्तानामिष्टदायिनम्
    । अवतीर्णो रघुकुले देवकार्यचिकीर्षया ॥ ७७॥ नारायणमनाद्यन्तं मोक्षदं शिवमच्युतम् । राम राम महाबाहो
    रक्ष मां शरणागतम् ॥ ७८॥ कोपं संहर राजेन्द्र क्षमस्व करुणालय । भूमिर्वातो वियच्चापो ज्योतींषि च रघूद्वह
    ॥ ७९॥ यत्स्वभावानि सृष्टानि ब्रह्मणा परमेष्ठिना । वर्तन्ते तत्स्वभावानि स्वभावो मे ह्यगाधता ॥ १
