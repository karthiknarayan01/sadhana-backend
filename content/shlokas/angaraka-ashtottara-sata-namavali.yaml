    ॐ गोत्राधिदेवाय नमः । ॐ गोमध्यचराय नमः । ॐ गुणविभूषणाय नमः । ॐ असृजे नमः । ॐ अङ्गारकाय नमः ॥ ॥ ॐ अवन्तीदेशाधीशाय
