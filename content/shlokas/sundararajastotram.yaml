id: sundararajastotram
category: stotram
name:
  english: sundararajastotram
  devanagari: सुन्दरराजस्तोत्रम्
content:
  english: statkale hyasuram nihatya bhagavan narayano vatsalah | karunyena dadati vedamakhilam tasmajjagannayakah
    ko va shamsata pakshapatarahita yuyam budhah kevalam || 8|| ishanah kamalasanasya shirasah chedadabhut
    pataki prayashcittamayam dadhara shirasa vaikunthapadodakam | tasmadeva hi pavanatvamagamadgangadharakhyam
    tatah ko va shamsata pakshapatarahita yuyam budha ishvarah || 9|| brahmanam srijati sma vai sa bhagavan
    shrinabhipankeruhat rudram so'pi pitamahashca sa harah pancananah shanmukham | tasmadvedapuranaratnaviditannarayanat
    kah prabhuh | yuyam shamsata pakshapatarahita vidvadvara ishvarah || 10|| ittham vedapuranashastravacanaih
    shripancaratradikaih shriramayanabharatadivacanaih shrivishnucitto guruh | tadgoshthayam paratattvanirnayamaho
    kritva budhan panditan jitva tatra javena sarvaviditam ciccheda shulkam muda || 11|| ityashcaryacaritramasya
    vibudhah sarve mahapanditah sampatpurnaguruttamashca jagatam rajadhirajah prabhuh | drishtva tatra
    mahavabodhavibhavam shrivishnucittam muda kurvanti stutimangalam pulakitah kalyanashankhadhvanim ||
    12|| shriman bhuvalayadhirajaviditah shrivallabhakhyah prabhuh goshthayam tatkritatattvanirnayamahasantoshapurnashayah
    | sampatpurnaguruttamadivibudhaih sakam mahapanditaih sammanam kurute mahotsavamiva shrivishnucittaprabhoh
    || 13|| skandharudhamimam gajasya ca mahavithim valantam stutam bherikahalashankhagitavilasatkolahalaprojjvalam
    | shrishrivallabhadevamukhyavibudhairlokaih samastairvritam vaikunthah sa ca vikshate sma ramaya shrivishnucittam
    muda || 14|| akashe garude lasantamamalam lakshmipatim sadaram drishtva tatsukumaravigrahamahasaundaryamalokayan
    | asthane bhayashankaya bhagavatah shrivishnucitto guru
  devanagari: स्तत्काले ह्यसुरं निहत्य भगवान् नारायणो वत्सलः । कारुण्येन ददाति वेदमखिलं तस्माज्जगन्नायकः
    को वा शंसत पक्षपातरहिता यूयं बुधाः केवलम् ॥ ८॥ ईशानः कमलासनस्य शिरसः छेदादभूत् पातकी प्रायश्चित्तमयं
    दधार शिरसा वैकुण्ठपादोदकम् । तस्मादेव हि पावनत्वमगमद्गङ्गाधराख्यां ततः को वा शंसत पक्षपातरहिता यूयं
    बुधा ईश्वरः ॥ ९॥ ब्रह्माणं सृजति स्म वै स भगवान् श्रीनाभिपङ्केरुहात् रुद्रं सोऽपि पितामहश्च स हरः
    पञ्चाननः षण्मुखम् । तस्माद्वेदपुराणरत्नविदितान्नारायणात् कः प्रभुः । यूयं शंसत पक्षपातरहिता विद्वद्वरा
    ईश्वरः ॥ १०॥ इत्थं वेदपुराणशास्त्रवचनैः श्रीपाञ्चरात्रादिकैः श्रीरामायणभारतादिवचनैः श्रीविष्णुचित्तो
    गुरुः । तद्गोष्ठयां परतत्त्वनिर्णयमहो कृत्वा बुधान् पण्डितान् जित्वा तत्र जवेन सर्वविदितं चिच्छेद
    शुल्कं मुदा ॥ ११॥ इत्याश्चर्यचरित्रमस्य विबुधाः सर्वे महापण्डिताः सम्पत्पूर्णगुरूत्तमश्च जगतां राजाधिराजः
    प्रभुः । दृष्ट्वा तत्र महावबोधविभवं श्रीविष्णुचित्तं मुदा कुर्वन्ति स्तुतिमङ्गलं पुलकिताः कल्याणशङ्खध्वनिम्
    ॥ १२॥ श्रीमान् भूवलयाधिराजविदितः श्रीवल्लभाख्यः प्रभुः गोष्ठयां तत्कृततत्त्वनिर्णयमहासन्तोषपूर्णाशयः
    । सम्पत्पूर्णगुरूत्तमादिविबुधैः साकं महापण्डितैः सम्मानं कुरुते महोत्सवमिव श्रीविष्णुचित्तप्रभोः ॥
    १३॥ स्कन्धारूढमिमं गजस्य च महावीथिं वलन्तं स्तुतं भेरीकाहलशङ्खगीतविलसत्कोलाहलप्रोज्ज्वलम् । श्रीश्रीवल्लभदेवमुख्यविबुधैर्लोकैः
    समस्तैर्वृतं वैकुण्ठः स च वीक्षते स्म रमया श्रीविष्णुचित्तं मुदा ॥ १४॥ आकाशे गरुडे लसन्तममलं लक्ष्मीपतिं
    सादरं दृष्ट्वा तत्सुकुमारविग्रहमहासौन्दर्यमालोकयन् । अस्थाने भयशङ्कया भगवतः श्रीविष्णुचित्तो गुरु
