id: ghatikadrinathashatakam
category: shataka
name:
  english: ghatikadrinathashatakam
  devanagari: घटिकाद्रिनाथशतकम्
content:
  english: smaranavisheshena toshitanangam | kamalalayantarangam kalaye ghatikadrikalpatarubhringam ||
    28|| durgatiduhkhitacittan dushkarayogan vimucya sukhasevyam | prajnah prayanti nityam nibhritim ghathikadribhupamalambya
    || 29|| kalayanti naiva santah kapurushadvari varanakadanam | ghatikashikharimukundam kamapi nidhim
    sulabhamanavadhim labdhva || 30|| makaramayakurmarupam varashankham padmamapi mahapadmam | kundamasitam
    mukundam ko va ghatikadrinavanidhim na bhajet || 31|| kancanamaye sphurantam kancana ghatikamahibhritah
    katake | krishnamanimargharahitam ke va na vidanti kritsnatah shlaghyam || 32|| samsaranasaranipanthastapatrayataranikiranasantaptah
    | ashvasita ghatikadrau haricandanametya shitalacchayam || 33|| muktam niranjanabaddham mulam jagatam
    phalam ca ghatikadrau | akalayatadbhutam mahadakantham manujamanane simham || 34|| pashyanti nayanaharinah
    spashtam ghatikadrilubdhakam yavat | parisaracaraistu tavat patakapatagaih palayitam kvapi || 35||
    vimalamanihemakatakam vikasitavanamalamullasanmaulim | ghatikadrisuhridamide kancanapitamshukavritam
    pramshum || 36|| sadbhih parigatamamalaih samshritasarvasaham hiranyakritam | ghatikadripam sumerum
    kalaye sarvottaram suraih sevyam || 37|| sarasamaviplutavelam sambhritamanirajasarasijashankham |
    gambhiramamitamamalam gahe ghatikacaleshakalashabdhim || 38|| vigatattamograhamacalam vriddhikshayarahitamanudayastamayam
    | vikasitamanasakamalam vikshe ghatikadrividhumaho vimalam || 39|| niravadhikanityamahasa nirmalamuktanubandhasubhagena
    | ghatikadrimakutabhaja manina mama manasi varitam timiram || 40|| aviralavisrimarasrinina harimanina
    satatamahitaujjvalyah | ghanakanakakalpito'yam katako ghatikamahibhrito bhati || 41|| sumanobhritena
    madhuna sutaram madhurena shuddhigunabhaja | mama ghatikacalajanusha manasanama samutsuko bhringah
    || 42|| anutaramapi svamanyanarpayatah satatamaptukamena | ghatikacalapranayina vipulam vihitam hiranyadanamaho
    || 43|| ananugunavishayavikshamanidamprathamam sarasvatim muktva | ghatikacalapranayina ghatayati
    drishtim ghananuragamayim || 44|| drishyena daivayogad divyanmahasanjanadyatitena | sadhayati siddhimakhilam
    sango ghatikadriyogipurushena || 45|| prabalairmamendriyashcaih paritushto vishamavishayakantare |
    padavim manorathagryam prapto ghatikadriparthasarathina || 46|| ativelavilasintormeravagahavatamadhogamanahetoh
    | prapto'smi bhavapayodheh param ghatikaniyamakenaham || 47|| ghatika yadi gunaghatita ghatikacalacakrikalpita
    na syuh | bhavakupato jalanam bhavyah ko va samuddharanahetuh || 48|| kalayanti ye svayatram ghatikacalavaidyakalpitena
    patha | bhavarogato'cirat te muktah snanam caranti virajayam || 49|| dadato jagatyudaran svapekshitamarthamarthinah
    prahuh | adadatah punararthanukta ghatikacalarthinodarah || 50|| data hi laukiko'rthan svavyatiriktan
    dadati natmanam | svo'pi svasamshritebhyo datto ghatikadrinriharina datra || 51|| himsitadanavakarine
    hridayaguhavihitabahuviharaya | vikramavate saparyam vidadhe ghatikadrivirasimhaya || 52|| shrutiparagaya
    vidyasutigrihaya svadharmanirataya | svasvocitam pradanam sudhiyam ghatikadribhumidevaya || 53|| mahaniyavrittavarna
    mahitanvayavatyalankrita kritina | suktisutanuh pradeya shuddha ghatikadrisuravaraya shubha || 54||
    gam yo dadati sartham galadamitapremadharaya sahitam | ghatikacalapranayine ghatate kim tasya kankshitam
    nalam || 55|| kalushapi ghatakavakyaih kshalitavaimukhyakalmasha dhishana | prithugunabhrite madiya
    sprihayati ghatikacalapriyaya bhrisham || 56|| anvicchatanyamathava trishnimadhvam surarshipitrimukhyah
    | tatkinkaro'rpito'ham tajjnairghatikadribhribhuje sacivaih || 57|| krudhyantyanarthakam ye goptre
    ghatikamahibhrito haraye | manye mandadhiyastan matanganeva madajushah kalushan || 58|| dushtan nigrihya
    tarasa shishtanakhilamshcirena palayate | svasti suhride gunanam bhutyai ghatikadribhubhuje bhuyat
    || 59|| mridulam bhavagnipakad vyaptam gunato vishuddhamahamannam | bhojyam samarpaye svam bhoktre
    ghatinkacalasya susneham || 60|| nityashriye gunanam nidhaye nishthyutanikhiladoshaya | prajnarpita
    mayaisha bhartre ghatikacalasya bhagyavashat || 61|| patre samashritanam shastre satpurupa vidvisham
    satatam | datre sakalaphalanam netre jagatam namo nrisimhaya || 62|| sumanahsamuhabhavyacchukamukhasevyat
    sushitalacchayat | ghatikadritatavirudhat kalpataroh kasya kankshitam na phalam || 63|| aviratahitapravritterapadi
    sahitadakritrimasnehat | mama ghatikacalabandhormanyadanyena kena kim karyam || 64|| ghanakarunamritapurairghatikacalakrishnameghato
    janitaih | papatavi pradagdha bhajate citram bhavambudhih shosham || 65|| gobhih prakashitarthad gopturghatikabhidhanavadryuditat
    | jagarti satatanidram saviturjagatam manahsarojam me || 66|| rushtena yena raudro rugno dharanim
    jagama sharabho'pi | sa na duritadantino'smad ghatikadrihareh katham na bibhyati me || 67|| avyahatapracaradavamatamantraushadhat
    sahasrasyat | patakamushakanivahat payat ghatikadribhoginah ko va || 68|| kalitapurusharthasarthad
    ghatikaghatitat sanatanad dharmat | kim va pramadyatam syat kshemam hyatrapyamutra va pumsam || 69||
    ghanasamayanirvyapekshad ghatikacalabhumibharturudbhruta | kshalayati kalushamalinam kacana karunatarangini
    bhuvanam || 70|| sannihitashankhapadmat sarvasakhat sakalapunyajanasevyat | ghatikadrirajarajat ka
    va na syat samashrita sampat || 71|| vrijinavishanalamurcchavimushitacittan bhavoragagrastan | kurvita
    labdhasattan ko va ghatikadrigarudikato'nyah || 72|| nityannirastadoshanniyatapadat punyakirtanashravanat
    | vinatocittabhidhanad brahmana evadhigamyate sakalam || 73|| shuddhimupajanayato'gryam svalokenaiva
    cakshusho jagatam | ghatikadrimitrato'nyam kalaye'khilalokabandhavam naham || 74|| amritapravahasahajairalokairamalashitalaih
    snapitah | vividhan bhavadavadahan vijahati ghatikadrivilasitasya vidhoh || 75|| dharmottaram dvipadreh
    shanke ghatikadrimatra na vivadah | kenangyakari nasmin krishnamrigasyasya niyatasamvasah || 76||
    amritarpanam shritanamabhidurarasanatvamarjavam gamane | kathamiva ca garudasakhyam ghatikacalakrishnabhogino
    ghatate || 77|| agahsu samshritanamanabhijnasyatmasamyadasyaham | niyamena sevakah syam nityam ghatikadribhumipalasya
    || 78|| sattvottarasya danam sadbhyo ghatikadribhubhrito yuktam | sutaram paparatanam yujyeta katham
    suradvisham danam || 79|| ghatikadrikamasurabheh kankshapadasakalaphaladuho jagatam | maturgavam mayi
    syad vatse bahulam katham na vatsalyam || 80|| hanta na jahatyamoghamashishamayuh shriyam prayunjanah
    | ghatikacalaharicandanaparshvamahinah supavanaharah || 81|| sadamritaphalasya ghatikashailagasalasya
    savidhagasyapi | shabdadinimbasevam santyajatim na hantu hridayakamo || 82|| amalanuragasalilairabhilashamalanyapohya
    sakalani | kusumairahimsanadyaih kuryam ghatikadvidaivatasyarcam || 83|| dhanadadyairapi na paraih
    sadhyam sumahaddhiranyadanam tat | sukarena kritavatah syat tulyo ghatikadribhubhritah ko va || 84||
    janayatyavati ca sakalamjnapayati yo hitahite shastrat | samye tu tasya ko va jnani ghatikadrisarvajanakasya
    || 85|| doshakare viragam suryaloke vikasamamodam | padmakhyamapi vahato yuktam ghatikadripasya kesarita
    || 86|| tantri mayadya labdha tapasa vipulena bhaktikanyeyam | bhajatamavyabhicaram bhavam ghatikadrimartari
    praudha || 87|| bhasvati surasuragurau bhogini va ndarusaumyamandare | ghatatamamayaghatite ghatikadvividhau
    katham grahaih pida || 88|| samavartini bhuvaneshe punyajane pavake jagatprane | shride shive'pi ghatikashailaharau
    sati kimanyadikpalaih || 89|| yasyodayah parartho yasyalokena yatyagham vilayam | kale ca bodhayati
    yo ghatikamitre'tra ko viragi syat || 90|| sarase jagrati ghatikashailagate sarasijalaye mohat | viraseshu
    cittanama vishayaksharakeshu vibhramati bhringah || 91|| bibhrati sadaiva lakshmim vibhramyati mitramandale
    vidusham | ghatikadvisarvabhaume ghatate kim va na samshritabhimatam || 92|| shritaghatikacalashikhare
    sthirakarunapuranirbhare shishire | divyanti vimalapaksha divye kamalalaye ciram hamsah || 93|| viharati
    bahugunajale vire ghatikadrikrishnavartmanibhe | vijahati samastatapan vijayante mrityumapi vimohamaho
    || 94|| kanakamayakatakashobham kalayati ghatikamahibhrito rucire | diptimati krishnaratne drishte
    trasalavamanubhavet ko va || 95|| saptarshisevyamane santatasumanaskrite sahasrakshe | ramatam mano
    harau me rajati ghatikadriratnasanutate || 96|| padasparshanavibhavat pavitabhuvane prabodhitatmane
    | bhajati ghatikadrimitre bhagavati bhavam manahsarojam me || 97|| tushte'lpatah sushile sugunagrihite
    sulakshane sudridhe | aropito madiyo bhadre ghatikadrighurvahe bharah || 98|| ananugunamapi vanimagahsandohamandamatikalitam
    | angikarotu bhagavanashritadoshavalokanakalyah || 99|| svamina eva kritirme suktistoshaya tadapi
    tasyaisha | svoktamanuvadati bale sutaram tato hi toshamupayati || 100|| bhaktocitopayuktam bhaktya
    saumyavarakinkaropahritam | amritaphalavalimanagham mridulamasvadya mrityumatiyanti || 101|| iti shrighatikadrinathashatakam
    sampurnam | stotrasamuccayah 2
  devanagari: स्मरणविशेषेण तोषितानङ्गम् । कमलालयान्तरङ्गं कलये घटिकाद्रिकल्पतरुभृङ्गम् ॥ २८॥ दुर्गतिदुःखितचित्तान्
    दुष्करयोगान् विमुच्य सुखसेव्याम् । प्राज्ञाः प्रयान्ति नित्यां निभृतिं घठिकाद्रिभूपमालम्ब्य ॥ २९॥
    कलयन्ति नैव सन्तः कापुरुषद्वारि वारणाकदनम् । घटिकाशिखरिमुकुन्दं कमपि निधिं सुलभमनवधिं लब्ध्वा ॥ ३०॥
    मकरमयकूर्मरूपं वरशङ्खं पद्ममपि महापद्मम् । कुन्दमसितं मुकुन्दं को वा घटिकाद्रिनवनिधिं न भजेत् ॥ ३१॥
    काञ्चनमये स्फुरन्तं कञ्चन घटिकामहीभृतः कटके । कृष्णमणिमर्घरहितं के वा न विदन्ति कृत्स्नतः श्लाघ्यम्
    ॥ ३२॥ संसरणसरणिपान्थास्तापत्रयतरणिकिरणसन्तप्ताः । आश्वसिता घटिकाद्रौ हरिचन्दनमेत्य शीतलच्छायम् ॥ ३३॥
    मुक्तं निरञ्जनबद्धं मूलं जगतां फलं च घटिकाद्रौ । आकलयताद्भुतं महदाकण्ठं मनुजमानने सिंहम् ॥ ३४॥ पश्यन्ति
    नयनहरिणाः स्पष्टं घटिकाद्रिलुब्धकं यावत् । परिसरचरैस्तु तावत् पातकपतगैः पलायितं क्वापि ॥ ३५॥ विमलमणिहेमकटकं
    विकसितवनमालमुल्लसन्मौलिम् । घटिकाद्रिसुहृदमीडे काञ्चनपीतांशुकावृतं प्रांशुम् ॥ ३६॥ सद्भिः परिगतममलैः
    संश्रितसर्वसहं हिरण्यकृतम् । घटिकाद्रिपं सुमेरुं कलये सर्वोत्तरं सुरैः सेव्यम् ॥ ३७॥ सरसमविप्लुतवेलं
    सम्भृतमणिराजसरसिजाशङ्खम् । गम्भीरममितममलं गाहे घटिकाचलेशकलशाब्धिम् ॥ ३८॥ विगतत्तमोग्रहमचलं वृद्धिक्षयरहितमनुदयास्तमयम्
    । विकसितमानसकमलं वीक्षे घटिकाद्रिविधुमहो विमलम् ॥ ३९॥ निरवधिकनित्यमहसा निर्मलमुक्तानुबन्धसुभगेन ।
    घटिकाद्रिमकुटभाजा मणिना मम मनसि वारितं तिमिरम् ॥ ४०॥ अविरलविसृमरसृणिना हरिमणिना सततमाहितौज्ज्वल्यः
    । घनकनककल्पितोऽयं कटको घटिकामहीभृतो भाति ॥ ४१॥ सुमनोभृतेन मधुना सुतरां मधुरेण शुद्धिगुणभाजा । मम घटिकाचलजनुषा
    मानसनामा समुत्सुको भृङ्गः ॥ ४२॥ अणुतरमपि स्वमन्यानर्पयतः सततमाप्तुकामेन । घटिकाचलप्रणयिना विपुलं विहितं
    हिरण्यदानमहो ॥ ४३॥ अननुगुणविषयवीक्षामनिदम्प्रथमां सरस्वतीं मुक्त्वा । घटिकाचलप्रणयिना घटयति दृष्टिं
    घनानुरागमयीम् ॥ ४४॥ दृश्येन दैवयोगाद् दीव्यन्महसाञ्जनाद्यतीतेन । साधयति सिद्धिमखिलां सङ्गो घटिकाद्रियोगिपुरुषेण
    ॥ ४५॥ प्रबलैर्ममेन्द्रियाश्चैः परितुष्टो विषमविषयकान्तारे । पदवीं मनोरथाग्र्यां प्राप्तो घटिकाद्रिपार्थसारथिना
    ॥ ४६॥ अतिवेलविलसिन्तोर्मेरवगाहवतामधोगमनहेतोः । प्राप्तोऽस्मि भवपयोधेः पारं घटिकानियामकेनाहम् ॥ ४७॥
    घटिका यदि गुणघटिता घटिकाचलचक्रिकल्पिता न स्युः । भवकूपतो जलानां भव्यः को वा समुद्धरणहेतुः ॥ ४८॥ कलयन्ति
    ये स्वयात्रां घटिकाचलवैद्यकल्पितेन पथा । भवरोगतोऽचिरात् ते मुक्ताः स्नानं चरन्ति विरजायाम् ॥ ४९॥ ददतो
    जगत्युदारान् स्वापेक्षितमर्थमर्थिनः प्राहुः । आददतः पुनरर्थानुक्ता घटिकाचलार्थिनोदाराः ॥ ५०॥ दाता
    हि लौकिकोऽर्थान् स्वव्यतिरिक्तान् ददाति नात्मानम् । स्वोऽपि स्वसंश्रितेभ्यो दत्तो घटिकाद्रिनृहरिणा
    दात्रा ॥ ५१॥ हिंसितदानवकरिणे हृदयगुहाविहितबहुविहाराय । विक्रमवते सपर्यां विदधे घटिकाद्रिवीरसिंहाय
    ॥ ५२॥ श्रुतिपारगाय विद्यासूतिगृहाय स्वधर्मनिरताय । स्वस्वोचितं प्रदानं सुधियां घटिकाद्रिभूमिदेवाय
    ॥ ५३॥ महनीयवृत्तवर्णा महितान्वयवत्यलङ्कृता कृतिना । सूक्तिसुतनुः प्रदेया शुद्धा घटिकाद्रिसुरवराय शुभा
    ॥ ५४॥ गां यो ददाति सार्थां गलदमितप्रेमधारया सहिताम् । घटिकाचलप्रणयिने घटते किं तस्य काङ्क्षितं नालम्
    ॥ ५५॥ कलुषापि घटकवाक्यैः क्षालितवैमुख्यकल्मषा धिषणा । पृथुगुणभृते मदीया स्पृहयति घटिकाचलप्रियाय भृशम्
    ॥ ५६॥ अन्विच्छतान्यमथवा तृष्णीमाध्वं सुरर्षिपितृमुख्याः । तत्किङ्करोऽर्पितोऽहं तज्ज्ञैर्घटिकाद्रिभृभुजे
    सचिवैः ॥ ५७॥ क्रुध्यन्त्यनर्थकं ये गोप्त्रे घटिकामहीभृतो हरये । मन्ये मन्दधियस्तान् मातङ्गानेव मदजुषः
    कलुषान् ॥ ५८॥ दुष्टान् निगृह्य तरसा शिष्टानखिलांश्चिरेण पालयते । स्वस्ति सुहृदे गुणानां भूत्यै घटिकाद्रिभूभुजे
    भूयात् ॥ ५९॥ मृदुलं भवाग्निपाकाद् व्याप्तं गुणतो विशुद्धमहमन्नम् । भोज्यं समर्पये स्वं भोक्त्रे घटिङ्काचलस्य
    सुस्नेहम् ॥ ६०॥ नित्यश्रिये गुणानां निधये निष्ठ्यूतनिखिलदोषाय । प्रज्ञार्पिता मयैषा भर्त्रे घटिकाचलस्य
    भाग्यवशात् ॥ ६१॥ पात्रे समाश्रितानां शास्त्रे सत्पुरुप विद्विषां सततम् । दात्रे सकलफलानां नेत्रे जगतां
    नमो नृसिंहाय ॥ ६२॥ सुमनःसमूहभव्याच्छुकमुखसेव्यात् सुशीतलच्छायात् । घटिकाद्रितटविरूढात् कल्पतरोः कस्य
    काङ्क्षितं न फलम् ॥ ६३॥ अविरतहितप्रवृत्तेरापदि सहितादकृत्रिमस्नेहात् । मम घटिकाचलबन्धोर्मान्यादन्येन
    केन किं कार्यम् ॥ ६४॥ घनकरुणामृतपूरैर्घटिकाचलकृष्णमेघतो जनितैः । पापाटवी प्रदग्धा भजते चित्रं भवाम्बुधिः
    शोषम् ॥ ६५॥ गोभिः प्रकाशितार्थाद् गोप्तुर्घटिकाभिधानवाद्र्युदितात् । जागर्ति सततनिद्रं सवितुर्जगतां
    मनःसरोजं मे ॥ ६६॥ रुष्टेन येन रौद्रो रुग्णो धरणिं जगाम शरभोऽपि । स न दुरितदन्तिनोऽस्माद् घटिकाद्रिहरेः
    कथं न बिभ्यति मे ॥ ६७॥ अव्याहतप्रचारादवमतमन्त्रौषधात् सहस्रास्यात् । पातकमूषकनिवहात् पायात् घटिकाद्रिभोगिनः
    को वा ॥ ६८॥ कलितपुरुषार्थसार्थाद् घटिकाघटितात् सनातनाद् धर्मात् । किं वा प्रमाद्यतां स्यात् क्षेमं
    ह्यत्राप्यमुत्र वा पुंसाम् ॥ ६९॥ घनसमयनिर्व्यपेक्षाद् घटिकाचलभूमिभर्तुरुद्भ्रूता । क्षालयति कलुषमलिनं
    काचन करुणातरङ्गिणी भुवनम् ॥ ७०॥ सन्निहितशङ्खपद्मात् सर्वसखात् सकलपुण्यजनसेव्यात् । घटिकाद्रिराजराजात्
    का वा न स्यात् समाश्रिता सम्पत् ॥ ७१॥ वृजिनविषानलमूर्च्छाविमुषितचित्तान् भवोरगग्रस्तान् । कुर्वीत
    लब्धसत्तान् को वा घटिकाद्रिगारुडिकतोऽन्यः ॥ ७२॥ नित्यान्निरस्तदोषान्नियतपदात् पुण्यकीर्तनश्रवणात्
    । विनतोचित्ताभिधानाद् ब्रह्मण एवाधिगम्यते सकलम् ॥ ७३॥ शुद्धिमुपजनयतोऽग्र्यां स्वालोकेनैव चक्षुषो जगताम्
    । घटिकाद्रिमित्रतोऽन्यं कलयेऽखिललोकबान्धवं नाहम् ॥ ७४॥ अमृतप्रवाहसहजैरालोकैरमलशीतलैः स्नपिताः । विविधान्
    भवदवदाहान् विजहति घटिकाद्रिविलसितस्य विधोः ॥ ७५॥ धर्मोत्तरं द्विपाद्रेः शङ्के घटिकाद्रिमत्र न विवादः
    । केनाङ्ग्यकारि नास्मिन् कृष्णमृगस्यास्य नियतसंवासः ॥ ७६॥ अमृतार्पणं श्रितानामभिदुररसनत्वमार्जवं गमने
    । कथमिव च गरुडसख्यं घटिकाचलकृष्णभोगिनो घटते ॥ ७७॥ आगःसु संश्रितानामनभिज्ञस्यात्मसाम्यदस्याहम् । नियमेन
    सेवकः स्यां नित्यं घटिकाद्रिभूमिपालस्य ॥ ७८॥ सत्त्वोत्तरस्य दानं सद्भ्यो घटिकाद्रिभूभृतो युक्तम् ।
    सुतरां पापरतानां युज्येत कथं सुरद्विषां दानम् ॥ ७९॥ घटिकाद्रिकामसुरभेः काङ्क्षापदसकलफलदुहो जगताम्
    । मातुर्गवां मयि स्याद् वत्से बहुलं कथं न वात्सल्यम् ॥ ८०॥ हन्त न जहत्यमोघामाशिषमायुः श्रियं प्रयुञ्जानाः
    । घटिकाचलहरिचन्दनपार्श्वमहीनाः सुपावनाहाराः ॥ ८१॥ सदमृतफलस्य घटिकाशैलगसालस्य सविधगस्यापि । शब्दादिनिम्बसेवां
    सन्त्यजतिं न हन्तु हृदयकामो ॥ ८२॥ अमलानुरागसलिलैरभिलाषमलान्यपोह्य सकलानि । कुसुमैरहिंसनाद्यैः कुर्यां
    घटिकाद्विदैवतस्यार्चाम् ॥ ८३॥ धनदाद्यैरपि न परैः साध्यं सुमहद्धिरण्यदानं तत् । सुकरेण कृतवतः स्यात्
    तुल्यो घटिकाद्रिभूभृतः को वा ॥ ८४॥ जनयत्यवति च सकलांज्ञापयति यो हिताहिते शास्त्रात् । साम्ये तु तस्य
    को वा ज्ञानी घटिकाद्रिसर्वजनकस्य ॥ ८५॥ दोषाकरे विरागं सूर्यालोके विकासमामोदम् । पद्माख्यामपि वहतो
    युक्तं घटिकाद्रिपस्य केसरिता ॥ ८६॥ तन्त्री मयाद्य लब्धा तपसा विपुलेन भक्तिकन्येयम् । भजतामव्यभिचारं
    भावं घटिकाद्रिमर्तरि प्रौढा ॥ ८७॥ भास्वति सुरासुरगुरौ भोगिनि व न्दारुसौम्यमन्दारे । घटताममायघटिते
    घटिकाद्विविधौ कथं ग्रहैः पीडा ॥ ८८॥ समवर्तिनि भुवनेशे पुण्यजने पावके जगत्प्राणे । श्रीदे शिवेऽपि घटिकाशैलहरौ
    सति किमन्यदिक्पालैः ॥ ८९॥ यस्योदयः परार्थो यस्यालोकेन यात्यघं विलयम् । काले च बोधयति यो घटिकामित्रेऽत्र
    को विरागी स्यात् ॥ ९०॥ सरसे जाग्रति घटिकाशैलगते सरसिजालये मोहात् । विरसेषु चित्तनामा विषयक्षरकेषु
    विभ्रमति भृङ्गः ॥ ९१॥ बिभ्रति सदैव लक्ष्मीं विभ्राम्यति मित्रमण्डले विदुषाम् । घटिकाद्विसार्वभौमे
    घटते किं वा न संश्रिताभिमतम् ॥ ९२॥ श्रितघटिकाचलशिखरे स्थिरकरुणापूरनिर्भरे शिशिरे । दीव्यन्ति विमलपक्षा
    दिव्ये कमलालये चिरं हंसाः ॥ ९३॥ विहरति बहुगुणजाले वीरे घटिकाद्रिकृष्णवर्त्मनिभे । विजहति समस्ततापान्
    विजयन्ते मृत्युमपि विमोहमहो ॥ ९४॥ कनकमयकटकशोभां कलयति घटिकामहीभृतो रुचिरे । दीप्तिमति कृष्णरत्ने दृष्टे
    त्रासलवमनुभवेत् को वा ॥ ९५॥ सप्तर्षिसेव्यमाने सन्ततसुमनस्कृते सहस्राक्षे । रमतां मनो हरौ मे राजति
    घटिकाद्रिरत्नसानुतटे ॥ ९६॥ पादस्पर्शनविभवात् पावितभुवने प्रबोधितात्मणे । भजति घटिकाद्रिमित्रे भगवति
    भावं मनःसरोजं मे ॥ ९७॥ तुष्टेऽल्पतः सुशीले सुगुणगृहीते सुलक्षणे सुदृढे । आरोपितो मदीयो भद्रे घटिकाद्रिघूर्वहे
    भारः ॥ ९८॥ अननुगुणामपि वाणीमागःसन्दोहमन्दमतिकलिताम् । अङ्गीकरोतु भगवानाश्रितदोषावलोकनाकल्यः ॥ ९९॥
    स्वामिन एव कृतिर्मे सूक्तिस्तोषाय तदपि तस्यैषा । स्वोक्तमनुवदति बाले सुतरां तातो हि तोषमुपयाति ॥ १००॥
    भक्तोचितोपयुक्तां भक्त्या सौम्यवरकिङ्करोपहृताम् । अमृतफलावलिमनघां मृदुलामास्वाद्य मृत्युमतियन्ति ॥
    १०१॥ इति श्रीघटिकाद्रिनाथशतकं सम्पूर्णम् । स्तोत्रसमुच्चयः २
