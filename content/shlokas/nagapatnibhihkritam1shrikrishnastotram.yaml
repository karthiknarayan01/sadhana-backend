id: nagapatnibhihkritam1shrikrishnastotram
category: stotram
name:
  english: nagapatnibhihkritam1shrikrishnastotram
  devanagari: नागपत्नीभिःकृतं१श्रीकृष्णस्तोत्रम्
content:
  english: nagapatnibhih kritam 1 shrikrishnastotram nagapatnya ucuh | jnato'si devadevesha sarveshastvamanuttama
    | param jyotiracintyam yattadamshah parameshvarah || 39|| na samarthah sura stotum yamananyabhavam
    prabhum | svarupavarnanam tasya katham yoshitkarishyati || 40|| yasyakhilamahivyomajalagnipavanatmakam
    | brahmandamalpakamshamshah stoshyamastam katham vayam || 41|| tatah kuru jagatsvamin prasadamavasidatah
    | pranamstyajati nago'yam bhartribhiksha pradiyatam || 42|| iti brahmapurane pantashityadhikashatatamadhyayantargatam
    nagapatnibhih kritam shrikrishnastotram samaptam | brahmapurana | adhyaya 185
  devanagari: नागपत्नीभिः कृतं १ श्रीकृष्णस्तोत्रम् नागपत्न्य ऊचुः । ज्ञातोऽसि देवदेवेश सर्वेशस्त्वमनुत्तम
    । परं ज्योतिरचिन्त्यं यत्तदंशः परमेश्वरः ॥ ३९॥ न समर्थाः सुर स्तोतुं यमनन्यभवं प्रभुम् । स्वरूपवर्णनं
    तस्य कथं योषित्करिष्यति ॥ ४०॥ यस्याखिलमहीव्योमजलाग्निपवनात्मकम् । ब्रह्माण्डमल्पकांशांशः स्तोष्यामस्तं
    कथं वयम् ॥ ४१॥ ततः कुरु जगत्स्वामिन् प्रसादमवसीदतः । प्राणांस्त्यजति नागोऽयं भर्तृभिक्षा प्रदीयताम्
    ॥ ४२॥ इति ब्रह्मपुराणे पञ्ताशीत्यधिकशततमाध्यायान्तर्गतं नागपत्निभिः कृतं श्रीकृष्णस्तोत्रं समाप्तम्
    । ब्रह्मपुराण । अध्याय १८५
