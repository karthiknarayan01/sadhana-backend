id: arjunakritam2shrikrishnastotram
category: stotram
name:
  english: arjunakritam2shrikrishnastotram
  devanagari: अर्जुनकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: arjunakritam 2 shrikrishnastotram arjuna uvaca | dasha varshasahasrani yatra sayam griho munih
    vyacarastvam pura krishna parvate gandhamadane || 10|| dasha varshasahasrani dasha varshashatani ca
    | pushkareshvavasah krishna tvamapo bhakshayanpura || 11|| urdhvabahurvishalayam badaryam madhusudana
    | atishtha ekapadena vayubhakshah shatam samah || 12|| apakrishtottarasangah krisho dhamanisantatah
    | asih krishna sarasvatyam satre dvadashavarshike || 13|| prabhasam capyathasadya tirtham punyajanocitam
    tatha krishna mahateja divyam varshasahasrakam atishthastapa ekena padena niyame sthitah || 14|| kshetrajnah
    sarvabhutanamadirantashca keshava | nidhanam tapasam krishna yajnastvam ca sanatanah || 15|| nihatya
    narakam bhaumamahritya manikundale | prathamotpaditam krishna medhyamashvamavasrijah || 16|| kritva
    tatkarma lokanamrishabhah sarvalokajit | avadhistvam rane sarvansametandaityadanavan || 17|| tatah
    sarveshvaratvam ca sampradaya shacipateh | manusheshu mahabaho pradurbhuto'si keshava || 18|| sa tvam
    narayano bhutva harirasih parantapa | brahma somashca suryashca dharmo dhata yamo'nalah || 19|| vayurvaishravano
    rudrah kalah kham prithivi dishah | ajashcaracaraguruh srashta tvam purushottama || 20|| turayanadibhirdeva
    kratubhirbhuridakshinaih | ayajo bhuriteja vai krishna caitrarathe vane || 21|| shatam shatasahasrani
    suvarnasya janardana | ekaikasmimstada yajne paripurnani bhagashah || 22|| aditerapi putratvametya
    yadavanandana | tvam vishnuriti vikhyata indradavarajo bhuvi || 23|| shishurbhutva divam kham ca prithivim
    ca parantapa | tribhirvikramanaih krishna krantavanasi tejasa || 24|| samprapya divamakashamadityasadane
    sthitah | atyarocashca bhutatmanbhaskaram svena tejasa || 25|| sadita mauravah pasha nisundanarakau
    hatau | kritah kshemah punah panthah puram pragjyotisham prati || 26|| jaruthyamahutih krathah shishupalo
    janaih saha | bhimasenashca shaibyashca shatadhanva ca nirjitah || 27|| tatha parjanyaghoshena rathenadityavarcasa
    | avakshirmahishim bhojyam rane nirjitya rukminam || 28|| indradyumno hatah kopadyavanashca kasheruman
    | hatah saubhapatih shalvastvaya saubham ca patitam || 29|| iravatyam tatha bhojah kartaviryasamo
    yudhi | gopatistalaketushca tvaya vinihatavubhau || 30|| tam ca bhogavatim punyamrishikantam janardana
    | dvarakamatmasatkritva samudram gamayishyasi || 31|| na krodho na ca matsaryam nanritam madhusudana
    | tvayi tishthati dasharha na nrishamsyam kuto'nriju || 32|| asinam cittamadhye tvam dipyamanam svatejasa
    | agamya rishayah sarve'yacantabhayamacyuta || 33|| yugante sarvabhutani sankshipya madhusudana |
    atmanyevatmasatkritva jagadasse parantapa || 34|| naivam purve napare va karishyanti kritani te |
    karmani yani deva tvam bala eva mahadyute || 35|| kritavanpundarikaksha baladevasahayavan | vairajabhavane
    capi brahmana nyavasah saha || 36|| iti mahabharate aranyaparvani 13 adhyayantargatam arjunakritam
    shrikrishnastotram sampurnam | mahabharata | aranyakaparva | adhyaya 13
  devanagari: अर्जुनकृतं २ श्रीकृष्णस्तोत्रम् अर्जुन उवाच । दश वर्षसहस्राणि यत्र सायं गृहो मुनिः व्यचरस्त्वं
    पुरा कृष्ण पर्वते गन्धमादने ॥ १०॥ दश वर्षसहस्राणि दश वर्षशतानि च । पुष्करेष्ववसः कृष्ण त्वमपो भक्षयन्पुरा
    ॥ ११॥ ऊर्ध्वबाहुर्विशालायां बदर्यां मधुसूदन । अतिष्ठ एकपादेन वायुभक्षः शतं समाः ॥ १२॥ अपकृष्टोत्तरासङ्गः
    कृशो धमनिसन्ततः । आसीः कृष्ण सरस्वत्यां सत्रे द्वादशवार्षिके ॥ १३॥ प्रभासं चाप्यथासाद्य तीर्थं पुण्यजनोचितं
    तथा कृष्ण महातेजा दिव्यं वर्षसहस्रकं आतिष्ठस्तप एकेन पादेन नियमे स्थितः ॥ १४॥ क्षेत्रज्ञः सर्वभूतानामादिरन्तश्च
    केशव । निधानं तपसां कृष्ण यज्ञस्त्वं च सनातनः ॥ १५॥ निहत्य नरकं भौममाहृत्य मणिकुण्डले । प्रथमोत्पादितं
    कृष्ण मेध्यमश्वमवासृजः ॥ १६॥ कृत्वा तत्कर्म लोकानामृषभः सर्वलोकजित् । अवधीस्त्वं रणे सर्वान्समेतान्दैत्यदानवान्
    ॥ १७॥ ततः सर्वेश्वरत्वं च सम्प्रदाय शचीपतेः । मानुषेषु महाबाहो प्रादुर्भूतोऽसि केशव ॥ १८॥ स त्वं नारायणो
    भूत्वा हरिरासीः परन्तप । ब्रह्मा सोमश्च सूर्यश्च धर्मो धाता यमोऽनलः ॥ १९॥ वायुर्वैश्रवणो रुद्रः कालः
    खं पृथिवी दिशः । अजश्चराचरगुरुः स्रष्टा त्वं पुरुषोत्तम ॥ २०॥ तुरायणादिभिर्देव क्रतुभिर्भूरिदक्षिणैः
    । अयजो भूरितेजा वै कृष्ण चैत्ररथे वने ॥ २१॥ शतं शतसहस्राणि सुवर्णस्य जनार्दन । एकैकस्मिंस्तदा यज्ञे
    परिपूर्णानि भागशः ॥ २२॥ अदितेरपि पुत्रत्वमेत्य यादवनन्दन । त्वं विष्णुरिति विख्यात इन्द्रादवरजो भुवि
    ॥ २३॥ शिशुर्भूत्वा दिवं खं च पृथिवीं च परन्तप । त्रिभिर्विक्रमणैः कृष्ण क्रान्तवानसि तेजसा ॥ २४॥ सम्प्राप्य
    दिवमाकाशमादित्यसदने स्थितः । अत्यरोचश्च भूतात्मन्भास्करं स्वेन तेजसा ॥ २५॥ सादिता मौरवाः पाशा निसुन्दनरकौ
    हतौ । कृतः क्षेमः पुनः पन्थाः पुरं प्राग्ज्योतिषं प्रति ॥ २६॥ जारूथ्यामाहुतिः क्राथः शिशुपालो जनैः
    सह । भीमसेनश्च शैब्यश्च शतधन्वा च निर्जितः ॥ २७॥ तथा पर्जन्यघोषेण रथेनादित्यवर्चसा । अवाक्षीर्महिषीं
    भोज्यां रणे निर्जित्य रुक्मिणम् ॥ २८॥ इन्द्रद्युम्नो हतः कोपाद्यवनश्च कशेरुमान् । हतः सौभपतिः शाल्वस्त्वया
    सौभं च पातितम् ॥ २९॥ इरावत्यां तथा भोजः कार्तवीर्यसमो युधि । गोपतिस्तालकेतुश्च त्वया विनिहतावुभौ ॥
    ३०॥ तां च भोगवतीं पुण्यामृषिकान्तां जनार्दन । द्वारकामात्मसात्कृत्वा समुद्रं गमयिष्यसि ॥ ३१॥ न क्रोधो
    न च मात्सर्यं नानृतं मधुसूदन । त्वयि तिष्ठति दाशार्ह न नृशंस्यं कुतोऽनृजु ॥ ३२॥ आसीनं चित्तमध्ये त्वां
    दीप्यमानं स्वतेजसा । आगम्य ऋषयः सर्वेऽयाचन्ताभयमच्युत ॥ ३३॥ युगान्ते सर्वभूतानि सङ्क्षिप्य मधुसूदन
    । आत्मन्येवात्मसात्कृत्वा जगदास्से परन्तप ॥ ३४॥ नैवं पूर्वे नापरे वा करिष्यन्ति कृतानि ते । कर्माणि
    यानि देव त्वं बाल एव महाद्युते ॥ ३५॥ कृतवान्पुण्डरीकाक्ष बलदेवसहायवान् । वैराजभवने चापि ब्रह्मणा न्यवसः
    सह ॥ ३६॥ इति महाभारते आरण्यपर्वणि १३ अध्यायान्तर्गतं अर्जुनकृतं श्रीकृष्णस्तोत्रं सम्पूर्णम् । महाभारत
    । आरण्यकपर्व । अध्याय १३
