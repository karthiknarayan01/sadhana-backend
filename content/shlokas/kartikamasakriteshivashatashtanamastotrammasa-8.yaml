id: kartikamasakriteshivashatashtanamastotrammasa-8
category: stotram
name:
  english: kartikamasakriteshivashatashtanamastotrammasa 8
  devanagari: कार्तिकमासकृतेशिवशताष्टनामस्तोत्रम्मास ८
content:
  english: vishvadhikaya vedyaya vedantanirataya ca || 39|| paravaraya viryaya sharvayatha kapardine |
    umadhavaya devaya tamrayatharunaya ca || 40|| babhrave nilakanthaya ghantahastaya shambhave | rudrayamoghaviryaya
    sarvadaya pinakine || 41|| jatukarnaya somaya bhavaya bhavahetave | ugraya ghorarupaya vamadevaya
    mundine || 42|| khagamaya shamayatha sannagordhvavilasine | asannajanapalaya nilagrivaya vedhase ||
    43|| amoghabalaviryaya shatavartaya ragine | hiranyavaraviryaya rasendravaravijine || 44|| dhvajine
    garjamanaya hunkarayorutejase | tigmayudhaya yodhaya rathadhipataye namah || 45|| bilmine bilvapujyaya
    prasannaya kapaline | bhikshave yakshapujyaya tryakshaya pramathaya ca || 46|| ushnishine makutine
    gadahastaya vajrine | khadgakhetakarayatha bhishagvaryaya te namah || 47|| bhargaya sahamanaya yugavartaya
    bhavine | jvalajjvalaya tushtaya hrishtapushaya dhrishnave || 48|| gunapriyaya gadyaya parnashadyaya
    vaidyute | vamadevaya jataya sadyojataya pavine || 49|| varshate grasate caiva avarshyayarvataya ca
    | katyaya ca prapathyaya vastupaya garadine || 50|| balapramathanayatha sarvabhutadamaya ca | kalanashaya
    devaya bhalanetraya dantine || 51|| hanahanaya punyaya punyavasaya te namah | purushaya puranaya rishaye
    vedamurtaye || 52|| annadhipataye caiva sarvesham pataye namah | vitihotraya patraya sutramne bhudharaya
    ca || 53|| parameshaya bhidyaya akhidyaya suraya ca | brahmakandharamalaya vamanagadharaya ca || 54||
    vishnuraktaprapanaya narasihmaharaya ca | || iti shivarahasyantargate ishvaraproktam kartikamasakrite
    shivashatashtanamastotram sampurnam ||
  devanagari: विश्वाधिकाय वेद्याय वेदान्तनिरताय च ॥ ३९॥ परावराय वीर्याय शर्वायाथ कपर्दिने । उमाधवाय देवाय
    ताम्रायाथारुणाय च ॥ ४०॥ बभ्रवे नीलकण्ठाय घण्टाहस्ताय शम्भवे । रुद्रायामोघवीर्याय सर्वदाय पिनाकिने
    ॥ ४१॥ जातुकर्णाय सोमाय भवाय भवहेतवे । उग्राय घोररूपाय वामदेवाय मुण्डिने ॥ ४२॥ खगमाय शमायाथ सन्नगोर्ध्वविलासिने
    । आसन्नजनपालाय नीलग्रीवाय वेधसे ॥ ४३॥ अमोघबलवीर्याय शतावर्ताय रागिणे । हिरण्यवरवीर्याय रसेन्द्रवरवीजिने
    ॥ ४४॥ ध्वजिने गर्जमानाय हुङ्कारायोरुतेजसे । तिग्मायुधाय योधाय रथाधिपतये नमः ॥ ४५॥ बिल्मिने बिल्वपूज्याय
    प्रसन्नाय कपालिने । भिक्षवे यक्षपूज्याय त्र्यक्षाय प्रमथाय च ॥ ४६॥ उष्णीषिणे मकुटिने गदाहस्ताय वज्रिणे
    । खड्गखेटकरायाथ भिषग्वर्याय ते नमः ॥ ४७॥ भर्गाय सहमानाय युगावर्ताय भाविने । ज्वलज्ज्वालाय तुष्टाय
    हृष्टपूषाय धृष्णवे ॥ ४८॥ गुणप्रियाय गद्याय पर्णशद्याय वैद्युते । वामदेवाय जाताय सद्योजाताय पाविने
    ॥ ४९॥ वर्षते ग्रसते चैव अवर्ष्यायार्वटाय च । काट्याय च प्रपथ्याय वास्तुपाय गरादिने ॥ ५०॥ बलप्रमथनायाथ
    सर्वभूतदमाय च । कालनाशाय देवाय भालनेत्राय दन्तिने ॥ ५१॥ हनाहनाय पुण्याय पुण्यावासाय ते नमः । पुरुषाय
    पुराणाय ऋषये वेदमूर्तये ॥ ५२॥ अन्नाधिपतये चैव सर्वेषां पतये नमः । वीतिहोत्राय पात्राय सुत्राम्णे भूधराय
    च ॥ ५३॥ परमेशाय भिद्याय अखिद्याय सुराय च । ब्रह्मकन्धरमालाय वामनागधराय च ॥ ५४॥ विष्णुरक्तप्रपानाय
    नरसिह्महराय च । ॥ इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तं कार्तिकमासकृते शिवशताष्टनामस्तोत्रं सम्पूर्णम्
    ॥
