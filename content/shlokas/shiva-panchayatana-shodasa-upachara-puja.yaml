    t || iti japitva athainamashishamashaste | ste | suprajastvamasha ste | sajatavanasyamasha ste | bhuyo
    havishkaranamasha ste | yadanena havisha ste | tadasyattadridhyat | tadasmai deva rasantam | tadagnirdevo
    devebhyo vanate | vayamagnermanushah | ishta nca | ubhe ca no dyavaprithivi agmhasa sspatam | iha
    gatirvamasyeda nca | namo devebhyah || upacarapujah punah puja nkarishye | chatramacchadayami | camarairvijayami
    | nritya shayami | gitam shravayami | andolikanarohayami | ashvanarohayami | gajanarohayami | samasta
    rajopacara devopacara bhaktyupacara shaktyupacara mantropacara pujassamarpayami || lingashtakam ||
    bilvashtakam || kshamaprarthana karacaranakritam 'paradham | vihitamavihitam va~ sarvametatkshmasva
    shiva shiva karunabdhe shrimahadeva shambho || || yasya smritya ca namoktya tapah puja kriyadishu
    | nyunam sampurnatam ya~ti sadyovande maheshvaram || mantrahina mmaheshvara | yatpujita ntadastu te
    || anaya sadyojata vidhina dhyanavahanadi shodashopacara pujaya bhagavan sarvatmaka shshri umamaheshvarasvami
    suprita ssuprasanno varado bhavatu | etatphalam shri parameshvararpanamastu || uttaratashcandishvaraya
    namah nirmalyam vi~srijya || tirtham akalamrityuharanam sarvavyadhi nivaranam | samastapapakshayakaram
    shivapadodaka mpavanam shubham || iti trivara mpitva shiva nirmalya rupa bilvadalam va~ dakshine karne
