id: sarpaihkritamshivastotram
category: stotram
name:
  english: sarpaihkritamshivastotram
  devanagari: सर्पैःकृतंशिवस्तोत्रम्
content:
  english: sarpaih kritam shivastotram dipadanadinaivedyaistambulamatha dakshinah | karpurartikarah sarve
    mahadevamupagatah | stutimarebhire kartum sudhakamastadoragah || 34|| sarpa ucuh | namo'nantaya brihate
    sarvadeva namo namah | candramaule namaste'stu kapardinparamatmane | vrishadhvaja namaste'stu trishulavaradharine
    || 35|| tryambakaya namaste'stu jatamukutadharine | sheshahara namaste'stu citabhasmangadharine ||
    36|| krittivasa namaste'stu girishaya namo namah | tripuraghna namaste'stu smarantaka namo'stu te
    || 37|| mrigavyadha namaste'stu ghasmaraya namo namah | shankaratmannamaste'stu sarvakamaphalaprada
    || 38|| sarvasakshinnamaste'stu sarvabhutashayakrite | sarvadhara namaste'stu sarvashaktidharaya ca
    || 39|| sarvabhoga namaste'stu sarvabijasamudbhava | divyahasa namaste'stu namo'mritasravaya ca ||
    1
  devanagari: सर्पैः कृतं शिवस्तोत्रम् दीपदानादिनैवेद्यैस्ताम्बूलमथ दक्षिणाः । कर्पूरार्तिकराः सर्वे महादेवमुपागताः
    । स्तुतिमारेभिरे कर्तुं सुधाकामास्तदोरगाः ॥ ३४॥ सर्पा उचुः । नमोऽनन्ताय बृहते सर्वदेव नमो नमः । चन्द्रमौले
    नमस्तेऽस्तु कपर्दिन्परमात्मने । वृषध्वज नमस्तेऽस्तु त्रिशूलवरधारिणे ॥ ३५॥ त्र्यम्बकाय नमस्तेऽस्तु
    जटामुकुटधारिणे । शेषहार नमस्तेऽस्तु चिताभस्माङ्गधारिणे ॥ ३६॥ कृत्तिवास नमस्तेऽस्तु गिरीशाय नमो नमः
    । त्रिपुरघ्न नमस्तेऽस्तु स्मरान्तक नमोऽस्तु ते ॥ ३७॥ मृगव्याध नमस्तेऽस्तु घस्मराय नमो नमः । शङ्करात्मन्नमस्तेऽस्तु
    सर्वकामफलप्रद ॥ ३८॥ सर्वसाक्षिन्नमस्तेऽस्तु सर्वभूताशयाकृते । सर्वाधार नमस्तेऽस्तु सर्वशक्तिधराय च
    ॥ ३९॥ सर्वभोग नमस्तेऽस्तु सर्वबीजसमुद्भव । दिव्यहास नमस्तेऽस्तु नमोऽमृतस्रवाय च ॥ १
