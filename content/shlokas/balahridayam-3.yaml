id: balahridayam-3
category: hridaya
name:
  english: balahridayam 3
  devanagari: बालाहृदयम् ३
content:
  english: araktam shashikhandamanditajatajutanubaddhasrajam bandhukaprasavarunam baradharam raktambujadhyasinim
    | tvam dhyayami caturbhujam trinayanamapinaramyastanim madhye nimnavalitrayankitatanum tvadrupasampattaye
    || lamityadi panca puja | am hrim krom aim klim sauh shrim hrim bale parameshvari aveshaya aveshaya
  devanagari: आरक्तां शशिखण्डमण्डितजटाजूटानुबद्धस्रजं बन्धूकप्रसवारुणां बरधरां रक्ताम्बुजाध्यासिनीम् ।
    त्वां ध्यायामि चतुर्भुजां त्रिणयनामापीनरम्यस्तनीं मध्ये निम्नवलित्रयाङ्किततनुं त्वद्रूपसम्पत्तये ॥
    लमित्यादि पञ्च पूजा । आं ह्रीं क्रों ऐं क्लीं सौः श्रीं ह्रीं बाले परमेश्वरि आवेशय आवेशय
meaning: {}
