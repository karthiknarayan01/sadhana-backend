name:
  english: Carnatic Music Geethams - Sri Ramachandra Srita Parijata
content:
  english: catusra jati dhruva talam angah samskritam sahityam shri ramacandra shrita parijata samasta
    kalyana gunabhi rama sita mukhamboruha sancarika nirantaram mangala matanotu svarah ga ri ga ma |
    pa sta || sa ri sa pa | ma pa | ga ri ga ma | ga ga ri sa || kal ma || ri ri ga ga | ma ma | ga ga
    ri ga | ma pa ma ma || si
  devanagari: चतुस्र जाति ध्रुव तालम् अङ्गाः संस्कृतम् साहित्यम् श्री रामचन्द्र श्रित पारिजात समस्त कल्याण
    गुणाभि राम सीता मुखाम्बोरुह सञ्चरीक निरन्तरं मङ्गल मातनोतु स्वराः ग रि ग म । प स्त ॥ स रि स प । म
    प । ग रि ग म । ग ग रि स ॥ कल् म ॥ रि रि ग ग । म म । ग ग रि ग । म प म म ॥ सी
