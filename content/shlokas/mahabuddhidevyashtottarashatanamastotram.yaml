id: mahabuddhidevyashtottarashatanamastotram
category: stotram
name:
  english: mahabuddhidevyashtottarashatanamastotram
  devanagari: महाबुद्धिदेव्यष्टोत्तरशतनामस्तोत्रम्
content:
  english: mulavahnisamudbhuta mulajnanavinashini | nirupadhimahamaya sharada pranavatmika || 1|| sushumnamukhamadhyastha
    cinmayi nadarupini | nadatita brahmavidya mulavidya paratpara || 2|| sakamadayinipithamadhyastha bodharupini
    | muladharasthaganapadakshinankanivasini || 3|| vishvadhara brahmarupa niradhara niramaya | sarvadhara
    sakshibhuta brahmamula sadashraya || 4|| vivekalabhyavedantagocara mananatiga | svanandayogasamlabhya
    nididhyasasvarupini || 5|| vivekadibhrityayuta shamadikinkaranvita | bhaktyadikinkarijushta svanandeshasamanvita
    || 6|| mahavakyarthasamlabhya ganeshapranavallabha | tamastirodhanakari svanandeshapradarshini ||
    7|| svadhishthanagata vani rajogunavinashini | ragadidoshashamani karmajnanapradayini || 8|| manipurajnanilaya
    tamogunavinashini | anahataikanilaya gunasatvaprakashini || 9|| ashtangayogaphalada tapomargaprakashini
    | vishuddhisthananilaya hridayagranthibhedini || 10|| vivekajanani prajna dhyanayogaprabodhini | ajnacakrasamasina
    nirgunabrahmasamyuta || 11|| brahmarandhrapadmagata jagadbhavapranashini | dvadashantaikanilaya svasvanandapradayini
    || 12|| piyushavarshini buddhissvanandeshaprakashini | ikshusagaramadhyastha nijalokanivasini || 13||
    vainayaki vighnahantri svanandabrahmarupini | sudhamurtissudharnava kevala hridguhamayi || 14|| shubhravastra
    pinakuca kalyani hemakancuka | vikacambhoruhadalalocana jnanarupini || 15|| ratnatatankayugala bhadra
    campakanasika | ratnadarpanasankashakapola nirgunatmika || 16|| tambulapuritasmeravadana satyarupini
    | kambukanthi subimboshthi vinapustakadharini || 17|| ganeshajnatasaubhagyamardavorudvayanvita | kaivalyajnanasukhadapadabja
    bharati matih || 18|| vajramanikyakatakakirita manjubhashini | vighneshabaddhamangalyasutrashobhitakandhara
    || 19|| anekakotikesharkayugmasevitapaduka | vagishvari lokamata mahabuddhissarasvati || 20|| catushpashtikotividyakalalakshminishevita
    | katakshakinkaribhutakeshavrindasamanvita || 21|| brahavishnvishashaktinam drisha shasanakarini |
    pancacittavrittimayi taramantrasvarupini || 22|| varada bhaktivashaga bhaktabhishtapradayini | brahmashaktirmahamaya
    jagadbrahmasvarupini || 23|| ashtottarashatanamnam mahabuddhervarantagam | yah pathedbhaktibhavena
    vidyam buddhim shriyam balam | samprapya jnanamatulam brahmabhuyamavapnuyat || 24|| iti mahabuddhyashtottarashatanamastotram
    sampurna |
  devanagari: मूलवह्निसमुद्भूता मूलाज्ञानविनाशिनी । निरुपाधिमहामाया शारदा प्रणवात्मिका ॥ १॥ सुषुम्नामुखमध्यस्था
    चिन्मयी नादरूपिणी । नादातीता ब्रह्मविद्या मूलविद्या परात्परा ॥ २॥ सकामदायिनीपीठमध्यस्था बोधरूपिणी
    । मूलाधारस्थगणपदक्षिणाङ्कनिवासिनी ॥ ३॥ विश्वाधारा ब्रह्मरूपा निराधारा निरामया । सर्वाधारा साक्षिभूता
    ब्रह्ममूला सदाश्रया ॥ ४॥ विवेकलभ्यवेदान्तगोचरा मननातिगा । स्वानन्दयोगसंलभ्या निदिध्यासस्वरूपिणी ॥
    ५॥ विवेकादिभृत्ययुता शमादिकिङ्करान्विता । भक्त्यादिकिङ्करीजुष्टा स्वानन्देशसमन्विता ॥ ६॥ महावाक्यार्थसंलभ्या
    गणेशप्राणवल्लभा । तमस्तिरोधानकरी स्वानन्देशप्रदर्शिनी ॥ ७॥ स्वाधिष्ठानगता वाणी रजोगुणविनाशिनी । रागादिदोषशमनी
    कर्मज्ञानप्रदायिनी ॥ ८॥ मणिपूराज्ञनिलया तमोगुणविनाशिनी । अनाहतैकनिलया गुणसत्वप्रकाशिनी ॥ ९॥ अष्टाङ्गयोगफलदा
    तपोमार्गप्रकाशिनी । विशुद्धिस्थाननिलया हृदयग्रन्थिभेदिनी ॥ १०॥ विवेकजननी प्रज्ञा ध्यानयोगप्रबोधिनी
    । आज्ञाचक्रसमासीना निर्गुणब्रह्मसंयुता ॥ ११॥ ब्रह्मरन्ध्रपद्मगता जगद्भावप्रणाशिनी । द्वादशान्तैकनिलया
    स्वस्वानन्दप्रदायिनी ॥ १२॥ पीयूषवर्षिणी बुद्धिस्स्वानन्देशप्रकाशिनी । इक्षुसागरमध्यस्था निजलोकनिवासिनी
    ॥ १३॥ वैनायकी विघ्नहन्त्री स्वानन्दब्रह्मरूपिणी । सुधामूर्तिस्सुधार्णवा केवला हृद्गुहामयी ॥ १४॥ शुभ्रवस्त्रा
    पीनकुचा कल्याणी हेमकञ्चुका । विकचाम्भोरुहदललोचना ज्ञानरूपिणी ॥ १५॥ रत्नताटङ्कयुगला भद्रा चम्पकनासिका
    । रत्नदर्पणसङ्काशकपोला निर्गुणात्मिका ॥ १६॥ ताम्बूलपूरितस्मेरवदना सत्यरूपिणी । कम्बुकण्ठी सुबिम्बोष्ठी
    वीणापुस्तकधारिणी ॥ १७॥ गणेशज्ञातसौभाग्यमार्दवोरुद्वयान्विता । कैवल्यज्ञानसुखदपदाब्जा भारती मतिः ॥
    १८॥ वज्रमाणिक्यकटककिरीटा मञ्जुभाषिणी । विघ्नेशबद्धमाङ्गल्यसूत्रशोभितकन्धरा ॥ १९॥ अनेककोटिकेशार्कयुग्मसेवितपादुका
    । वागीश्वरी लोकमाता महाबुद्धिस्सरस्वती ॥ २०॥ चतुष्पष्टिकोटिविद्याकलालक्ष्मीनिषेविता । कटाक्षकिङ्करीभूतकेशवृन्दसमन्विता
    ॥ २१॥ ब्रहाविष्ण्वीशशक्तीनां दृशा शासनकारिणी । पञ्चचित्तवृत्तिमयी तारमन्त्रस्वरूपिणी ॥ २२॥ वरदा भक्तिवशगा
    भक्ताभीष्टप्रदायिनी । ब्रह्मशक्तिर्महामाया जगद्ब्रह्मस्वरूपिणी ॥ २३॥ अष्टोत्तरशतनाम्नां महाबुद्धेर्वरान्तगम्
    । यः पठेद्भक्तिभावेन विद्यां बुद्धिं श्रियं बलम् । सम्प्राप्य ज्ञानमतुलं ब्रह्मभूयमवाप्नुयात् ॥ २४॥
    इति महाबुद्ध्यष्टोत्तरशतनामस्तोत्रं सम्पूर्णा ।
