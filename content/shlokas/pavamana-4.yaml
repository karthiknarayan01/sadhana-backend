id: pavamana-4
category: veda
name:
  english: pavamana
  devanagari: पवमन
content:
  english: '| sham catṷshpade | om shanti̱shshanti̱shshanti̭h | pavamanasuktam athava punyahavacanam
    svararahitam taittiriya samhita | kandam 5 prapathakah 6 anuvakah 1 taittiriya brahmanam | ashtakam
    1 prashnah 4 anuvakah 8 om taccham yoravrinimahe | gatum yajnaya | gatum yajnapataye | daivissvastirastu
    nah | svastirmanushebhyah | urdhvam jigatu bheshajam | shanno astu dvipade | sham catushpade | om
    shantishshantishshantih | om || hiranyavarnah shucayah pavaka yasu jatah kashyapo yasvindrah | agnim
    ya garbham dadhire virupasta na apashsha'
  devanagari: । शं चतु॑ष्पदे । ॐ शान्ति॒श्शान्ति॒श्शान्तिः॑ । पवमानसूक्तम् अथवा पुण्याहवाचनम् स्वररहितम्
    तैत्तिरीय संहिता । काण्डम् ५ प्रपाठकः ६ अनुवाकः १ तैत्तिरीय ब्राह्मणम् । अष्टकम् १ प्रश्नः ४ अनुवाकः
    ८ ॐ तच्छं योरावृणीमहे । गातुं यज्ञाय । गातुं यज्ञपतये । दैवीस्स्वस्तिरस्तु नः । स्वस्तिर्मानुषेभ्यः
    । ऊर्ध्वं जिगातु भेषजम् । शन्नो अस्तु द्विपदे । शं चतुष्पदे । ॐ शान्तिश्शान्तिश्शान्तिः । ॐ ॥ हिरण्यवर्णाः
    शुचयः पावका यासु जातः कश्यपो यास्विन्द्रः । अग्निं या गर्भं दधिरे विरूपास्ता न आपश्श
meaning: {}
