id: vajravilasinistotram
category: stotram
name:
  english: vajravilasinistotram
  devanagari: वज्रविलासिनीस्तोत्रम्
content:
  english: bhaktam | bhavabhavasamastakashavyapi bhavati sa tattvavikashah || 20|| udbhavanti tata eva
    vimoksha bodhipakshanikhilapratipakshah | buddhanamavenikadharmah sattvarashiparipacitakarmah || 21||
    yadva yanatrayaniryanam dhumadikamapi caparimanam | tvadbhaktya yadalambhi shubham me bhavatu mano
    bhavatiparamam me | sakalakalusharahitam gunasindhustvatparamam hyata eva na bandhuh || 22|| guhyasamayasadhanatantre
    shrivajravilasinistotram sampurnam | iti mahapanditavibhuticandrapadakritam vajravilasinistotram sampurnam
    ||
  devanagari: भक्तम् । भावाभावसमस्ताकाशव्यापी भवति स तत्त्वविकाशः ॥ २०॥ उद्भवन्ति तत एव विमोक्षा बोधिपक्षनिखिलप्रतिपक्षाः
    । बुद्धानामावेणिकधर्मः सत्त्वराशिपरिपाचितकर्मः ॥ २१॥ यद्वा यानत्रयनिर्याणं धूमादिकमपि चापरिमाणम् ।
    त्वद्भक्त्या यदलम्भि शुभं मे भवतु मनो भवतीपरमं मे । सकलकलुषरहितं गुणसिन्धुस्त्वत्परमं ह्यत एव न बन्धुः
    ॥ २२॥ गुह्यसमयसाधनतन्त्रे श्रीवज्रविलासिनीस्तोत्रं सम्पूर्णम् । इति महापण्डितविभूतिचन्द्रपादकृतं वज्रविलासिनीस्तोत्रं
    सम्पूर्णम् ॥
meaning: {}
