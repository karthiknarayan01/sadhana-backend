id: vishnu-padadi-keshanta-varnana-stotram
category: stotram
name:
  english: Vishnu Padadi Keshanta Varnana Stotram
content:
  english: lakshmibharturbhujagre kritavasati sitam yasya rupam vishalam niladrestungashringasthitamiva
    rajaninathabimbam vibhati | payannah pancajanyah sa ditisutakulatrasanaih purayansvai rnidhvanairniradaughadhvaniparibhavadairambaram
    kamburajah || || ahuryasya svarupam kshanamukhamakhilam surayah kalametam dhvantasyaikantamantam yadapi
    ca paramam sarvadhamnam ca dhama | cakram taccakrapanerditijatanugaladraktadharaktadharam shashvanno
    vishvavandyam vitaratu vipulam sharma dharmamshushobham || || avyannirghataghoro haribhujapavanamarshanadhmatamurte
    rasmanvismeranetratridashanutivacahsadhukaraih sutarah | sarvam samhartumicchorarikulabhuvana spharavishpharanadah
    samyatkalpantasindhau sharasalilaghatavarmucah karmukasya || || jimutashyamabhasa muhurapi bhagavadbahuna
    mohayanti yuddheshuddhuyamana jhatiti tatidivalakshyate yasya murtih | so'sistrasakulakshatridasharipuvapuhshonitasvadatripto
    nityanandaya bhuyanmadhumathanamanonandano nandako nah || || kamrakara murareh karakamalatalenanuragadgrihita
    samyagvritta sthitagre sapadi na sahate darshanam ya paresham | rajanti daityajivasavamadamudita lohitalepanardra
    kamam diptamshukanta pradishatu dayitevasya kaumodaki nah || || yo vishvapranabhutastanurapi ca hareryanaketusvarupo
    yam sancintyaiva sadyah svayamuragavadhuvargagarbhah patanti | cancaccandorutundatrutitaphanivasaraktapankankitasyam
    vande chandomayam tam khagapatimamalasvarnavarnam suparnam || || vishnorvishveshvarasya pravarashayanakritsarvalokaikadharta
    so'nantah sarvabhutah prithuvimalayashah sarvavedaishca vedyah | pata vishvasya shashvatsakalasuraripudhvamsanah
    papahanta sarvajnah sarvasakshi sakalavishabhayatpatu bhogishvaro nah || || vagbhugairyadibhedairviduriha
    munayo yam yadiyaishca pumsam karunyardraih katakshaih sakridapi patitaih sampadah syuh samagrah |
    kundendusvacchamandasmitamadhuramukhambhoruham sundarangim vande vandyamasheshairapi murabhiduromandiramindiram
    tam || || ya sute sattvajalam sakalamapi sada sannidhanena pumso dhatte ya tattvayogaccaramacaramidam
    bhutaye bhutajatam | dhatrim sthatrim janitrim prakritimavikritim vishvashaktim vidhatrim vishnorvishvatmanastam
    vipulagunamayim prananatham pranaumi || || yebhyo'suyadbhiruccaih sapadi padamuru tyajyate daityavargai
    ryebho dhartum ca murdhna sprihayati satatam sarvagirvanavargah | nityam nirmulayeyurnicitataramami
    bhaktinighnatmanam nah padmakshasyanghripadmadvayatalanilayah pamsavah papapankam || || rekha lekhadivandyashcaranatalagatashcakramatsyadirupah
    snigdhah sukshmah sujata mridulalitatarakshaumasutrayamanah | dadyurno mangalani bhramarabharajusha
    komalenabdhijayah kamrenamredyamanah kisalayamriduna panina cakrapaneh || || yasmadakramato dyam garudamanishilaketudandayamana
    dashcyotanti babhase surasaridamala vaijayantiva kanta | bhumishtho yastathanyo bhuvanagrihabrihat
    stambhashobham dadhau nah patametau payojodaralalitatalau pankajakshasya padau || || akramadbhyam
    trilokimasurasurapati tatkshanadeva nitau yabhyam vairocanindrau yugapadapi vipatsampadorekadhamah
    | tabhyam tamrodarabhyam muhurahamajitasyancitabhyamubhabhyam prajyaishvaryapradabhyam pranatimupagatah
    padapankeruhabhyam || || yebhyo varnashcaturthashcaramata udabhudadisarge prajanam sahasri capi sankhya
    prakatamabhihita sarvavedeshu yesham | prapta vishvambhara yairativitatatanorvishvamurtervirajo vishnostebhyo
    mahadbhyah satatamapi namo'stvanghripankeruhebhyah || || vishnoh padadvayagre vimalanakhamanibhrajita
    rajate ya rajivasyeva ramya himajalakanikalankritagra dalali | asmakam vismayarhanyakhilajanamana
    prarthaniya hi seyam dadyadadyanavadya tatiratirucira mangalanyangulinam || || yasyam drishtvamalayam
    pratikritimamarah sambhavantyanamantah sendrah sandrikritershyastvaparasurakulashankayatankavantah
    | sa sadyah satirekam sakalasukhakarim sampadam sadhayenna shcancaccarvamshucakra carananalinayoshcakrapanernakhali
    || || padambhojanmasevasamavanatasuravratabhasvatkirita pratyuptoccavacashmapravarakaraganaishcintitam
    yadvibhati | namranganam harerno haridupalamahakurmasaundaryahari cchayam shreyahpradayi prapadayugamidam
    prapayetpapamantam || || shrimatyau caruvritte karaparimalananandahrishte ramayah saundaryadhyendranilopalaracitamahadandayoh
    kanticore | surindraih stuyamane surakulasukhade suditaratisanghe janghe narayaniye muhurapi jayatamasmadamho
    harantyau || || samyaksahyam vidhatum samamiva satatam janghayoh khinnayorye bharibhutorudandadvayabharanakritottambhabhavam
    bhajete | cittadarsham nidhatum mahitamiva satam te samudrayamane vrittakare vidhattam hyadi mudamajitasyanisham
    januni nah || || devo bhitim vidhatuh sapadi vidadhatau kaitabhakhyam madhum ca pyaropyarudhagarvavadhijaladhi
    yayoradidaityau jaghana | vrittavanyonyatulyau caturamupacayam bibhratavabhranila vuru caru harestau
    mudamatishayinim manase no vidhattam || || pitena dyotate yaccaturaparihitenambarenatyudaram jatalankarayogam
    jalamiva jaladherbadabagniprabhabhih | etatpatityadanno jaghanamatighanadenaso mananiyam satatyenaiva
    cetovishayamavataratpatu pitambarasya || || yasya damna tridhamno jaghanakalitaya bhrajate'ngam yathabdhe
    rmadhyastho mandaradrirbhujagapatimahabhogasannaddhamadhyah | kanci sa kancanabha manivarakiranairullasadbhih
    pradipta kalyam kalyanadatrim mama matimanisham kamrarupam karotu || || unnamram kamramuccairupacitamudabhudyatra
    patrairvicitraih purvam girvanapujyam kamalajamadhupasyaspadam tatpayojam | yasminnilashmanilaistaralarucijalaih
    purite kelibuddhya nalikakshasya nabhisarasi vasatu nashcittahamsashciraya || || patalam yasya nalam
    valayamapi disham patrapanktirnagendra nvidvamsah kesaralirviduriha vipulam karnikam svarnashailam
    | bhuyadgayatsvayambhumadhukarabhavanam bhumayam kamadam no nalikam nabhipadmakarabhavamuru tannagashayyasya
    shaureh || || adau kalpasya yasmatprabhavati vitatam vishvametadvikalpaih kalpante yasya canta pravishati
    sakalam sthavaram jangamam ca | atyantacintyamurteshcirataramajitasyantarikshasvarupe tasminnasmakamantahkaranamatimuda
    kridatatkrodabhage || || kantyambhahpurapurne lasadasitavalibhangabhasvattarange gambhirakaranabhicaturataramahavartashobhinyudare
    | kridatvanadvahemodaranahanamahabadabagniprabhadhye kamam damodariyodarasalilanidhau cittamatsyashciram
    nah || || nabhinalikamuladadhikaparimalonmohitanamalinam mala nileva yanti sphurati rucimati vaktrapadmonmukhi
    ya | ramya sa romarajirmahitarucikari madhyabhagasya vishno shcittastha ma viramsiccirataramucitam
    sadhayanti shriyam nah || || samstirnam kaustubhamshuprasarakisalayairmugdhamuktaphaladhyam shrivatsollasi
    phullapratinavavanamalanki rajadbhujantam | vakshah shrivrikshakantam madhukaranikarashyamalam sharngapaneh
    samsaradhvashramartairupavanamiva yatsevitam tatprapadye || || kantam vaksho nitantam vidadhadiva
    galam kalima kalashatro rindorbimbam yathanko madhupa iva tarormanjarim rajate yah | shrimannityam
    vidheyadaviralamilitah kaustubhashripratanaih shrivatsah shripateh sa shriya iva dayito vatsa uccaihshriyam
    nah || || sambhuyambhodhimadhyatsapadi sahajaya yah shriya sannidhatte nile narayanorahsthalagaganatale
    harataropasevye | ashah sarvah prakasha vidadhadapidadhaccatmabhasanyateja syashcaryasyakaro no dyumaniriva
    manih kaustubhah so'stubhutyai || || ya vayavanukulyatsarati maniruca bhasamana samana sakam sakampamamse
    vasati vidadhati vasubhadram subhadram | saram sarangasanghairmukharitakusuma mecakanta ca kanta mala
    malalitasmanna viramatu sukhairyojayanti jayanti || || harasyoruprabhabhih pratinavavanamalashubhih
    pramshurupaih shribhishcapyangadanam kabalitaruci yannishkabhabhishca bhati | bahulyenaiva baddhanjaliputamajitasyabhiyacamahe
    ta dvandhartim badhatam no bahuvihatikarim bandhuram bahumulam || || vishvatranaikadikshastadanugunagunakshatranirmanadakshah
    kartaro durnirupasphutagunayashasa karmanamadbhutanam | sharngam banam kripanam phalakamarigade padmashankhau
    sahasram bibhranah shastrajalam mama dadhatu harerbahavo mohahanim || || kanthakalpodgatairyah kanakamayalasatkundalotthairudarai
    rudyotaih kaustubhasyapyurubhirupacitashcitravarno vibhati | kanthashleshe ramayah karavalayapadairmudrite
    bhadrarupe vaikunthiye'tra kanthe vasatu mama matih kunthabhavam vihaya || || padmanandapradata parilasadarunashriparitagrabhagah
    kale kale ca kambupravarashashadharapurane yah pravinah | vaktrakashantarasthastirayati nitaram dantataraughashobham
    shribharturdantavasodyumaniraghatamonashanayastvasau nah || || nityam snehatirekannijakamituralam
    viprayogakshama ya vaktrendorantarale kritavasatirivabhati nakshatrarajih | lakshmikantasya kantakritirativilasanmugdhamuktavalishri
    rdantali santatam sa natinutiniratanakshatanrakshatannah || || brahmanbrahmanyajihmam matimapi kurushe
    deva sambhavaye tvam shambho shakra trilokimavasi kimamarairnaradadyah sukham vah | ittham sevavanamram
    suramuninikaram vikshya vishnoh prasanna syasyendorasravanti varavacanasudhahladayenmanasam nah ||
    || karnasthasvarnakamrojjvalamakaramahakundalaprotadipya nmanikyashripratanaih parimilitamalishyamalam
    komalam yat | prodyatsuryamshurajanmarakatamukurakaracoram murare rgadhamagaminim nah shamayatu vipadam
    gandayormandalam tat || || vaktrambhoje lasantam muhuradharamanim pakvabimbabhiramam drishtva drashtum
    shukasya sphutamavataratastundadandayate yah | ghonah shonikritatma shravanayugalasatkundalosrairmurareh
    pranakhyasyanilasya prasaranasaranih pranadanaya nah syat || || dikkalau vedayantau jagati muhurimau
    sancarantau ravindu trailokyalokadipavabhidadhati yayoreva rupam munindrah | asmanabjaprabhe te pracuratarakripanirbharam
    prekshamane patamatamrashuklasitarucirucire padmanetrasya netre || || patatpatalapatatpatagapatigaterbhruyugam
    bhugnamadhyam yeneshaccalitena svapadaniyamitah sasura devasanghah | nrityallalatarange rajanikaratanorardhakhandavadate
    kalavyaladvayam va vilasati samaya valikamataram nah || || lakshmakaralakalisphuradalikashashankardhasandarshamila
    nnetrambhojaprabodhotsukanibhritataralinabhringacchatabhe | lakshminathasya lakshyikritavibudhaganapangabanasanardha
    cchaye no bhuribhutiprasavakushalate bhrulate palayetam || || rukshasmarekshucapacyutasharanikarakshinalakshmikataksha
    protphullatpadmamalavilasitamahitasphatikaishanalingam | bhuyadbhuyo vibhutyai mama bhuvanapaterbhrulatadvandvamadhya
    duttham tatpundramurdhvam janimaranatamahkhandanam mandanam ca || || pithibhutalakante kritamakutamahadevalingapratishthe
    lalate natyarange vikatataratate kaitabhareshciraya | proddhatyaivatmatandriprakatapatakutim prasphurantim
    sphutangam patviyam bhavanakhyam catulamatinati natikam natayennah || || malalivalidhamnah kuvalayakalita
    shripateh kuntalali kalindyaruhya murdhno galati harashirahsvardhunispardhaya nu | rahurva yati vaktram
    sakalashashikalabhrantilolantaratma lokairalokyate ya pradishatu satatam sakhilam mangalam nah ||
    || suptakarah prasupte bhagavati vibudhairapyadrishtasvarupa vyaptavyomantaralastaralamaniruca ranjitah
    spashtabhasah | dehacchayodgamabha ripuvapuraguruplosharoshagnidhumyah keshah keshidvisho no vidadhatu
    vipulakleshapashapranasham || || yatra pratyuptaratnapravaraparilasadbhurirocishpratana sphurtyam
    murtirmurarerdyumanishatacitavyomavaddurnirikshya | kurvatparepayodhi jvaladakrishashikhabhasvadaurvagnishankam
    shashvannah sharma dishyatkalikalushatamahpatanam tatkiritam || || bhrantva bhrantva yadantastribhuvanagururapyabdakotiraneka
    gantum nantam samartho bhramara iva punarnabhinalikanalat | unmajjannurjitashristribhuvanamaparam
    nirmame tatsadriksham dehambhodhih sa deyanniravadhiramritam daityavidveshino nah || || matsyah kurmo
    varaho naraharinapatirvamano jamadagnyah kakutsthah kamsaghati manasijavijayi yashca kalkirbhavishyan
    | vishnoramshavatara bhuvanahitakara dharmasamsthapanarthah payasurmam ta ete gurutarakarunabharakhinnashaya
    ye || || yasmadvaco nivrittah samamapi manasa lakshanamikshamanah svarthalabhatpararthavyapagamakathanashlaghino
    vedavadah | nityanandam svasamvinniravadhivimalasvantasankrantabimba cchayapatyapi nityam sukhayati
    yamino yattadavyanmaho nah || || apadada ca shirshadvapuridamanagham vaishnavam yah svacitte dhatte
    nityam nirastakhilakalikalusha santatantah pramodam | juhvajjihvakrishanau haricaritahavih stotramantranupathai
    statpadambhoruhabhyam satatamapi namaskurmahe nirmalabhyam || || modatpadadikeshastutimitiracita kirtayitva
    tridhamna padabjadvandvasevasamayanatamatirmastakenanamedya | unmucyaivatmanainonicayakavacaka pancatametya
    bhano rbimbantargocara sa pravishati paramanandamatmasvarupam || || iti shrimatparamahamsaparivrajakacaryasya
    shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah kritau shri vishnu padadikeshantavarnana
    stotram sampurnam |
  devanagari: लक्ष्मीभर्तुर्भुजाग्रे कृतवसति सितं यस्य रूपं विशालं नीलाद्रेस्तुङ्गशृङ्गस्थितमिव रजनीनाथबिम्बं
    विभाति । पायान्नः पाञ्चजन्यः स दितिसुतकुलत्रासनैः पूरयन्स्वै र्निध्वानैर्नीरदौघध्वनिपरिभवदैरम्बरं
    कम्बुराजः ॥ ॥ आहुर्यस्य स्वरूपं क्षणमुखमखिलं सूरयः कालमेतं ध्वान्तस्यैकान्तमन्तं यदपि च परमं सर्वधाम्नां
    च धाम । चक्रं तच्चक्रपाणेर्दितिजतनुगलद्रक्तधाराक्तधारं शश्वन्नो विश्ववन्द्यं वितरतु विपुलं शर्म धर्मांशुशोभम्
    ॥ ॥ अव्यान्निर्घातघोरो हरिभुजपवनामर्शनाध्मातमूर्ते रस्मान्विस्मेरनेत्रत्रिदशनुतिवचःसाधुकारैः सुतारः
    । सर्वं संहर्तुमिच्छोररिकुलभुवन स्फारविष्फारनादः संयत्कल्पान्तसिन्धौ शरसलिलघटावार्मुचः कार्मुकस्य
    ॥ ॥ जीमूतश्यामभासा मुहुरपि भगवद्बाहुना मोहयन्ती युद्धेषूद्धूयमाना झटिति तटिदिवालक्ष्यते यस्य मूर्तिः
    । सोऽसिस्त्रासाकुलाक्षत्रिदशरिपुवपुःशोणितास्वादतृप्तो नित्यानन्दाय भूयान्मधुमथनमनोनन्दनो नन्दको नः
    ॥ ॥ कम्राकारा मुरारेः करकमलतलेनानुरागाद्गृहीता सम्यग्वृत्ता स्थिताग्रे सपदि न सहते दर्शनं या परेषाम्
    । राजन्ती दैत्यजीवासवमदमुदिता लोहितालेपनार्द्रा कामं दीप्तांशुकान्ता प्रदिशतु दयितेवास्य कौमोदकी नः
    ॥ ॥ यो विश्वप्राणभूतस्तनुरपि च हरेर्यानकेतुस्वरूपो यं सञ्चिन्त्यैव सद्यः स्वयमुरगवधूवर्गगर्भाः पतन्ति
    । चञ्चच्चण्डोरुतुण्डत्रुटितफणिवसारक्तपङ्काङ्कितस्यं वन्दे छन्दोमयं तं खगपतिममलस्वर्णवर्णं सुपर्णम्
    ॥ ॥ विष्णोर्विश्वेश्वरस्य प्रवरशयनकृत्सर्वलोकैकधर्ता सोऽनन्तः सर्वभूतः पृथुविमलयशाः सर्ववेदैश्च वेद्यः
    । पाता विश्वस्य शश्वत्सकलसुररिपुध्वंसनः पापहन्ता सर्वज्ञः सर्वसाक्षी सकलविषभयात्पातु भोगीश्वरो नः
    ॥ ॥ वाग्भूगैर्यादिभेदैर्विदुरिह मुनयो यां यदीयैश्च पुंसां कारुण्यार्द्रैः कटाक्षैः सकृदपि पतितैः सम्पदः
    स्युः समग्राः । कुन्देन्दुस्वच्छमन्दस्मितमधुरमुखाम्भोरुहां सुन्दराङ्गीं वन्दे वन्द्यामशेषैरपि मुरभिदुरोमन्दिरामिन्दिरां
    ताम् ॥ ॥ या सूते सत्त्वजालं सकलमपि सदा सन्निधानेन पुंसो धत्ते या तत्त्वयोगाच्चरमचरमिदं भूतये भूतजातम्
    । धात्रीं स्थात्रीं जनित्रीं प्रकृतिमविकृतिं विश्वशक्तिं विधात्रीं विष्णोर्विश्वात्मनस्तां विपुलगुणमयीं
    प्राणनाथां प्रणौमि ॥ ॥ येभ्योऽसूयद्भिरुच्चैः सपदि पदमुरु त्यज्यते दैत्यवर्गै र्येभो धर्तुं च मूर्ध्ना
    स्पृहयति सततं सर्वगीर्वाणवर्गः । नित्यं निर्मूलयेयुर्निचिततरममी भक्तिनिघ्नात्मनां नः पद्माक्षस्याङ्घ्रिपद्मद्वयतलनिलयाः
    पांसवः पापपङ्कम् ॥ ॥ रेखा लेखादिवन्द्याश्चरणतलगताश्चक्रमत्स्यादिरूपाः स्निग्धाः सूक्ष्माः सुजाता मृदुललिततरक्षौमसूत्रायमाणाः
    । दद्युर्नो मङ्गलानि भ्रमरभरजुषा कोमलेनाब्धिजायाः कम्रेणाम्रेड्यमानाः किसलयमृदुना पाणिना चक्रपाणेः
    ॥ ॥ यस्मादाक्रामतो द्यां गरुडमणिशिलाकेतुदण्डायमाना दाश्च्योतन्ती बभासे सुरसरिदमला वैजयन्तीव कान्ता
    । भूमिष्ठो यस्तथान्यो भुवनगृहबृहत् स्तम्भशोभां दधौ नः पातामेतौ पायोजोदरललिततलौ पङ्कजाक्षस्य पादौ ॥
    ॥ आक्रामद्भ्यां त्रिलोकीमसुरसुरपती तत्क्षणादेव नीतौ याभ्यां वैरोचनीन्द्रौ युगपदपि विपत्सम्पदोरेकधामः
    । ताभ्यां ताम्रोदराभ्यां मुहुरहमजितस्याञ्चिताभ्यामुभाभ्यां प्राज्यैश्वर्यप्रदाभ्यां प्रणतिमुपगतः पादपङ्केरुहाभ्याम्
    ॥ ॥ येभ्यो वर्णश्चतुर्थश्चरमत उदभूदादिसर्गे प्रजानां साहस्री चापि सङ्ख्या प्रकटमभिहिता सर्ववेदेषु
    येषाम् । प्राप्ता विश्वम्भरा यैरतिवितततनोर्विश्वमूर्तेर्विराजो विष्णोस्तेभ्यो महद्भ्यः सततमपि नमोऽस्त्वङ्घ्रिपङ्केरुहेभ्यः
    ॥ ॥ विष्णोः पादद्वयाग्रे विमलनखमणिभ्राजिता राजते या राजीवस्येव रम्या हिमजलकणिकालङ्कृताग्रा दलाली ।
    अस्माकं विस्मयार्हाण्यखिलजनमन प्रार्थनीया हि सेयं दद्यादाद्यानवद्या ततिरतिरुचिरा मङ्गलान्यङ्गुलीनाम्
    ॥ ॥ यस्यां दृष्ट्वामलायां प्रतिकृतिममराः सम्भवन्त्यानमन्तः सेन्द्राः सान्द्रीकृतेर्ष्यास्त्वपरसुरकुलाशङ्कयातङ्कवन्तः
    । सा सद्यः सातिरेकां सकलसुखकरीं सम्पदं साधयेन्न श्चञ्चच्चार्वंशुचक्रा चरणनलिनयोश्चक्रपाणेर्नखाली ॥
    ॥ पादाम्भोजन्मसेवासमवनतसुरव्रातभास्वत्किरीट प्रत्युप्तोच्चावचाश्मप्रवरकरगणैश्चिन्तितं यद्विभाति ।
    नम्राङ्गानां हरेर्नो हरिदुपलमहाकूर्मसौन्दर्यहारि च्छायं श्रेयःप्रदायि प्रपदयुगमिदं प्रापयेत्पापमन्तम्
    ॥ ॥ श्रीमत्यौ चारुवृत्ते करपरिमलनानन्दहृष्टे रमायाः सौन्दर्याढ्येन्द्रनीलोपलरचितमहादण्डयोः कान्तिचोरे
    । सूरीन्द्रैः स्तूयमाने सुरकुलसुखदे सूदितारातिसङ्घे जङ्घे नारायणीये मुहुरपि जयतामस्मदंहो हरन्त्यौ
    ॥ ॥ सम्यक्साह्यं विधातुं सममिव सततं जङ्घयोः खिन्नयोर्ये भारीभूतोरुदण्डद्वयभरणकृतोत्तम्भभावं भजेते
    । चित्तादर्शं निधातुं महितमिव सतां ते समुद्रायमाने वृत्ताकारे विधत्तां ह्यदि मुदमजितस्यानिशं जानुनी
    नः ॥ ॥ देवो भीतिं विधातुः सपदि विदधतौ कैटभाख्यं मधुं चा प्यारोप्यारूढगर्वावधिजलधि ययोरादिदैत्यौ जघान
    । वृत्तावन्योन्यतुल्यौ चतुरमुपचयं बिभ्रतावभ्रनीला वूरू चारू हरेस्तौ मुदमतिशयिनीं मानसे नो विधत्ताम्
    ॥ ॥ पीतेन द्योतते यच्चतुरपरिहितेनाम्बरेणात्युदारं जातालङ्कारयोगं जलमिव जलधेर्बाडबाग्निप्रभाभिः । एतत्पातित्यदान्नो
    जघनमतिघनादेनसो माननीयं सातत्येनैव चेतोविषयमवतरत्पातु पीताम्बरस्य ॥ ॥ यस्या दाम्ना त्रिधाम्नो जघनकलितया
    भ्राजतेऽङ्गं यथाब्धे र्मध्यस्थो मन्दराद्रिर्भुजगपतिमहाभोगसन्नद्धमध्यः । काञ्ची सा काञ्चनाभा मणिवरकिरणैरुल्लसद्भिः
    प्रदीप्ता कल्यां कल्याणदात्रीं मम मतिमनिशं कम्ररूपां करोतु ॥ ॥ उन्नम्रं कम्रमुच्चैरुपचितमुदभूद्यत्र
    पत्रैर्विचित्रैः पूर्वं गीर्वाणपूज्यं कमलजमधुपस्यास्पदं तत्पयोजम् । यस्मिन्नीलाश्मनीलैस्तरलरुचिजलैः
    पूरिते केलिबुद्ध्या नालीकाक्षस्य नाभीसरसि वसतु नश्चित्तहंसश्चिराय ॥ ॥ पातालं यस्य नालं वलयमपि दिशां
    पत्रपङ्क्तीर्नगेन्द्रा न्विद्वांसः केसरालीर्विदुरिह विपुलां कर्णिकां स्वर्णशैलम् । भूयाद्गायत्स्वयम्भूमधुकरभवनं
    भूमयं कामदं नो नालीकं नाभिपद्माकरभवमुरु तन्नागशय्यस्य शौरेः ॥ ॥ आदौ कल्पस्य यस्मात्प्रभवति विततं विश्वमेतद्विकल्पैः
    कल्पान्ते यस्य चान्त प्रविशति सकलं स्थावरं जङ्गमं च । अत्यन्ताचिन्त्यमूर्तेश्चिरतरमजितस्यान्तरिक्षस्वरूपे
    तस्मिन्नस्माकमन्तःकरणमतिमुदा क्रीडतात्क्रोडभागे ॥ ॥ कान्त्यम्भःपूरपूर्णे लसदसितवलीभङ्गभास्वत्तरङ्गे
    गम्भीराकारनाभीचतुरतरमहावर्तशोभिन्युदारे । क्रीडत्वानद्वहेमोदरनहनमहाबाडबाग्निप्रभाढ्ये कामं दामोदरीयोदरसलिलनिधौ
    चित्तमत्स्यश्चिरं नः ॥ ॥ नाभीनालीकमूलादधिकपरिमलोन्मोहितानामलीनां माला नीलेव यान्ती स्फुरति रुचिमती
    वक्त्रपद्मोन्मुखी या । रम्या सा रोमराजिर्महितरुचिकरी मध्यभागस्य विष्णो श्चित्तस्था मा विरंसीच्चिरतरमुचितां
    साधयन्ती श्रियं नः ॥ ॥ संस्तीर्णं कौस्तुभांशुप्रसरकिसलयैर्मुग्धमुक्ताफलाढ्यं श्रीवत्सोल्लासि फुल्लप्रतिनववनमालाङ्कि
    राजद्भुजान्तम् । वक्षः श्रीवृक्षकान्तं मधुकरनिकरश्यामलं शार्ङ्गपाणेः संसाराध्वश्रमार्तैरुपवनमिव यत्सेवितं
    तत्प्रपद्ये ॥ ॥ कान्तं वक्षो नितान्तं विदधदिव गलं कालिमा कालशत्रो रिन्दोर्बिम्बं यथाङ्को मधुप इव तरोर्मञ्जरीं
    राजते यः । श्रीमान्नित्यं विधेयादविरलमिलितः कौस्तुभश्रीप्रतानैः श्रीवत्सः श्रीपतेः स श्रिय इव दयितो
    वत्स उच्चैःश्रियं नः ॥ ॥ सम्भूयाम्भोधिमध्यात्सपदि सहजया यः श्रिया सन्निधत्ते नीले नारायणोरःस्थलगगनतले
    हारतारोपसेव्ये । आशाः सर्वाः प्रकाशा विदधदपिदधच्चात्मभासान्यतेजा स्याश्चर्यस्याकरो नो द्युमणिरिव मणिः
    कौस्तुभः सोऽस्तुभूत्यै ॥ ॥ या वायावानुकूल्यात्सरति मणिरुचा भासमाना समाना साकं साकम्पमंसे वसति विदधती
    वासुभद्रं सुभद्रम् । सारं सारङ्गसङ्घैर्मुखरितकुसुमा मेचकान्ता च कान्ता माला मालालितास्मान्न विरमतु
    सुखैर्योजयन्ती जयन्ती ॥ ॥ हारस्योरुप्रभाभिः प्रतिनववनमालाशुभिः प्रांशुरूपैः श्रीभिश्चाप्यङ्गदानां
    कबलितरुचि यन्निष्कभाभिश्च भाति । बाहुल्येनैव बद्धाञ्जलिपुटमजितस्याभियाचामहे त द्वन्धार्तिं बाधतां
    नो बहुविहतिकरीं बन्धुरं बाहुमूलम् ॥ ॥ विश्वत्राणैकदीक्षास्तदनुगुणगुणक्षत्रनिर्माणदक्षाः कर्तारो दुर्निरूपस्फुटगुणयशसा
    कर्मणामद्भुतानाम् । शार्ङ्गं बाणं कृपाणं फलकमरिगदे पद्मशङ्खौ सहस्रं बिभ्राणाः शस्त्रजालं मम दधतु हरेर्बाहवो
    मोहहानिम् ॥ ॥ कण्ठाकल्पोद्गतैर्यः कनकमयलसत्कुण्डलोत्थैरुदारै रुद्योतैः कौस्तुभस्याप्युरुभिरुपचितश्चित्रवर्णो
    विभाति । कण्ठाश्लेषे रमायाः करवलयपदैर्मुद्रिते भद्ररूपे वैकुण्ठीयेऽत्र कण्ठे वसतु मम मतिः कुण्ठभावं
    विहाय ॥ ॥ पद्मानन्दप्रदाता परिलसदरुणश्रीपरीताग्रभागः काले काले च कम्बुप्रवरशशधरापूरणे यः प्रवीणः ।
    वक्त्राकाशान्तरस्थस्तिरयति नितरां दन्ततारौघशोभां श्रीभर्तुर्दन्तवासोद्युमणिरघतमोनाशनायास्त्वसौ नः
    ॥ ॥ नित्यं स्नेहातिरेकान्निजकमितुरलं विप्रयोगाक्षमा या वक्त्रेन्दोरन्तराले कृतवसतिरिवाभाति नक्षत्रराजिः
    । लक्ष्मीकान्तस्य कान्ताकृतिरतिविलसन्मुग्धमुक्तावलिश्री र्दन्ताली सन्ततं सा नतिनुतिनिरतानक्षतान्रक्षतान्नः
    ॥ ॥ ब्रह्मन्ब्रह्मण्यजिह्मां मतिमपि कुरुषे देव सम्भावये त्वां शम्भो शक्र त्रिलोकीमवसि किममरैर्नारदाद्याः
    सुखं वः । इत्थं सेवावनम्रं सुरमुनिनिकरं वीक्ष्य विष्णोः प्रसन्न स्यास्येन्दोरास्रवन्ती वरवचनसुधाह्लादयेन्मानसं
    नः ॥ ॥ कर्णस्थस्वर्णकम्रोज्ज्वलमकरमहाकुण्डलप्रोतदीप्य न्माणिक्यश्रीप्रतानैः परिमिलितमलिश्यामलं कोमलं
    यत् । प्रोद्यत्सूर्यांशुराजन्मरकतमुकुराकारचोरं मुरारे र्गाढामागामिनीं नः शमयतु विपदं गण्डयोर्मण्डलं
    तत् ॥ ॥ वक्त्राम्भोजे लसन्तं मुहुरधरमणिं पक्वबिम्बाभिरामं दृष्ट्वा द्रष्टुं शुकस्य स्फुटमवतरतस्तुण्डदण्डायते
    यः । घोणः शोणीकृतात्मा श्रवणयुगलसत्कुण्डलोस्रैर्मुरारेः प्राणाख्यस्यानिलस्य प्रसरणसरणिः प्राणदानाय
    नः स्यात् ॥ ॥ दिक्कालौ वेदयन्तौ जगति मुहुरिमौ सञ्चरन्तौ रवीन्दू त्रैलोक्यालोकदीपावभिदधति ययोरेव रूपं
    मुनीन्द्राः । अस्मानब्जप्रभे ते प्रचुरतरकृपानिर्भरं प्रेक्षमाणे पातामाताम्रशुक्लासितरुचिरुचिरे पद्मनेत्रस्य
    नेत्रे ॥ ॥ पातात्पातालपातात्पतगपतिगतेर्भ्रूयुगं भुग्नमध्यं येनेषच्चालितेन स्वपदनियमिताः सासुरा देवसङ्घाः
    । नृत्यल्लालाटरङ्गे रजनिकरतनोरर्धखण्डावदाते कालव्यालद्वयं वा विलसति समया वालिकामातरं नः ॥ ॥ लक्ष्माकारालकालिस्फुरदलिकशशाङ्कार्धसन्दर्शमील
    न्नेत्राम्भोजप्रबोधोत्सुकनिभृततरालीनभृङ्गच्छटाभे । लक्ष्मीनाथस्य लक्ष्यीकृतविबुधगणापाङ्गबाणासनार्ध
    च्छाये नो भूरिभूतिप्रसवकुशलते भ्रूलते पालयेताम् ॥ ॥ रूक्षस्मारेक्षुचापच्युतशरनिकरक्षीणलक्ष्मीकटाक्ष
    प्रोत्फुल्लत्पद्ममालाविलसितमहितस्फाटिकैशानलिङ्गम् । भूयाद्भूयो विभूत्यै मम भुवनपतेर्भ्रूलताद्वन्द्वमध्या
    दुत्थं तत्पुण्ड्रमूर्ध्वं जनिमरणतमःखण्डनं मण्डनं च ॥ ॥ पीठीभूतालकान्ते कृतमकुटमहादेवलिङ्गप्रतिष्ठे
    लालाटे नाट्यरङ्गे विकटतरतटे कैटभारेश्चिराय । प्रोद्धाट्यैवात्मतन्द्रीप्रकटपटकुटीं प्रस्फुरन्तीं स्फुटाङ्गं
    पट्वीयं भावनाख्यां चटुलमतिनटी नाटिकां नाटयेन्नः ॥ ॥ मालालीवालिधाम्नः कुवलयकलिता श्रीपतेः कुन्तलाली
    कालिन्द्यारुह्य मूर्ध्नो गलति हरशिरःस्वर्धुनीस्पर्धया नु । राहुर्वा याति वक्त्रं सकलशशिकलाभ्रान्तिलोलान्तरात्मा
    लोकैरालोक्यते या प्रदिशतु सततं साखिलं मङ्गलं नः ॥ ॥ सुप्ताकाराः प्रसुप्ते भगवति विबुधैरप्यदृष्टस्वरूपा
    व्याप्तव्योमान्तरालास्तरलमणिरुचा रञ्जिताः स्पष्टभासः । देहच्छायोद्गमाभा रिपुवपुरगुरुप्लोषरोषाग्निधूम्याः
    केशाः केशिद्विषो नो विदधतु विपुलक्लेशपाशप्रणाशम् ॥ ॥ यत्र प्रत्युप्तरत्नप्रवरपरिलसद्भूरिरोचिष्प्रतान
    स्फूर्त्यां मूर्तिर्मुरारेर्द्युमणिशतचितव्योमवद्दुर्निरीक्ष्या । कुर्वत्पारेपयोधि ज्वलदकृशशिखाभास्वदौर्वाग्निशङ्कां
    शश्वन्नः शर्म दिश्यात्कलिकलुषतमःपाटनं तत्किरीटम् ॥ ॥ भ्रान्त्वा भ्रान्त्वा यदन्तस्त्रिभुवनगुरुरप्यब्दकोटीरनेका
    गन्तुं नान्तं समर्थो भ्रमर इव पुनर्नाभिनालीकनालात् । उन्मज्जन्नूर्जितश्रीस्त्रिभुवनमपरं निर्ममे तत्सदृक्षं
    देहाम्भोधिः स देयान्निरवधिरमृतं दैत्यविद्वेषिणो नः ॥ ॥ मत्स्यः कूर्मो वराहो नरहरिणपतिर्वामनो जामदग्न्यः
    काकुत्स्थः कंसघाती मनसिजविजयी यश्च कल्किर्भविष्यन् । विष्णोरंशावतरा भुवनहितकरा धर्मसंस्थापनार्थाः
    पायासुर्मां त एते गुरुतरकरुणाभारखिन्नाशया ये ॥ ॥ यस्माद्वाचो निवृत्ताः सममपि मनसा लक्षणामीक्षमाणाः
    स्वार्थालाभात्परार्थव्यपगमकथनश्लाघिनो वेदवादाः । नित्यानन्दं स्वसंविन्निरवधिविमलस्वान्तसङ्क्रान्तबिम्ब
    च्छायापत्यापि नित्यं सुखयति यमिनो यत्तदव्यान्महो नः ॥ ॥ आपादादा च शीर्षाद्वपुरिदमनघं वैष्णवं यः स्वचित्ते
    धत्ते नित्यं निरस्ताखिलकलिकलुष सन्ततान्तः प्रमोदम् । जुह्वज्जिह्वाकृशानौ हरिचरितहविः स्तोत्रमन्त्रानुपाठै
    स्तत्पादाम्भोरुहाभ्यां सततमपि नमस्कुर्महे निर्मलाभ्याम् ॥ ॥ मोदात्पादादिकेशस्तुतिमितिरचिता कीर्तयित्वा
    त्रिधाम्न पादाब्जद्वन्द्वसेवासमयनतमतिर्मस्तकेनानमेद्य । उन्मुच्यैवात्मनैनोनिचयकवचक पञ्चतामेत्य भानो
    र्बिम्बान्तर्गोचर स प्रविशति परमानन्दमात्मस्वरूपम् ॥ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य
    श्रीमच्छङ्करभगवतः कृतौ श्री विष्णु पादादिकेशान्तवर्णण स्तोत्रं सम्पूर्णम् ।
