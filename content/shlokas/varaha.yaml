id: varaha
category: upanishad
name:
  english: varaha
  devanagari: वरह
content:
  english: stabhyam vina muktibhajo na santi | shukamargam ye'nusaranti dhirah sadyo muktaste bhavantiha
    loke || 34|| vamadevam ye'nusaranti nityam mritva janitva ca punahpunastat | te vai loke kramamukta
    bhavanti yogaih sankhyaih karmabhih sattvayuktaih || 35|| shukashca vamadevashca dve sriti devanirmite
    | shukah vihangamah prokto vamadevah pipilika || 36|| atadvyavrittirupena sakshadvidhimukhena va |
    mahavakyavicarena sankhyayogasamadhina || 37|| viditva svatmano rupam samprajnatasamadhitah | shukamargena
    virajah prayanti paramam padam || 38|| yamadyasanajayasahathabhyasatpunahpunah | vighnabahulyasanjata
    animadivashadiha || 39|| alabdhvapi phalam samyakpunarbhutva mahakule | punarvasanayaivayam yogabhyasam
    punashcaran || 40|| anekajanmabhyasena vamadevena vai patha | so'pi muktim samapnoti tadvishnoh paramam
    padam || 41|| dvavimavapi panthanau brahmapraptikarau shivau | sadyomuktipradashcaikah kramamuktipradah
    parah | atra ko mohah kah shoka ekatvamanupashyatah || 42|| yasyanubhavaparyanta buddhistattve pravartate
    | taddrishtigocarah sarve mucyante sarvapatakaih || 43|| khecara bhucarah sarve brahmaviddrishtigocarah
    | sadya eva vimucyante kotijanmarjitairaghaih || 44|| iti|| iti caturtho'dyayah || 4|| atha hainam
    ribhum bhagavantam nidaghah papraccha yogabhyasavidhimanubruhiti | tatheti sa hovaca | pancabhutatmako
    dehah pancamandalapuritah | kathinyam prithivimeka paniyam taddravakriti || 1|| dipanam ca bhavettejah
    pracaro vayulakshanam | akashah sattvatah sarvam jnatavyam yogamicchata || 2|| shatshatanyadhikanyatra
    sahasranyekavimshatih | ahoratravahih shvasairvayumandalaghatatah || 3|| tatprithvimandale kshine
    valirayati dehinam | tadvadapo ganapaye keshah syuh pandurah kramat || 4|| tejahkshaye kshudha kantirnashyate
    marutakshaye | vepathuh sambhavennityam nambhasenaiva jivati || 5|| itthambhutam kshayannityam jivitam
    bhutadharanam | uddyanam kurute yasmadavishrantam mahakhagah || 6|| uddiyanam tadeva syattatra bandho'bhidhiyate
    | uddiyano hyasau bandho mrityumatangakeshari || 7|| tasya muktistanoh kayattasya bandho hi dushkarah
    | agnau tu calite kukshau vedana jayate bhrisham || 8|| na karya kshudhi tenapi napi vinmutravegina
    | hitam mitam ca bhoktavyam stokam stokamanekadha || 9|| mridumadhyamamantreshu kramanmantram layam
    hatham | layamantrahatha yoga yogo hyashtangasamyutah || 10|| yamashca niyamashcaiva tatha casanameva
    ca | pranayamastatha pashcatpratyaharastatha param || 11|| dharana ca tatha dhyanam samadhishcashtamo
    bhavet | ahimsa satyamasteyam brahmacaryam dayarjavam || 12|| kshama dhritirmitaharah shaucam ceti
    yama dasha | tapah santoshamastikyam danamishvarapujanam || 13|| siddhantashravanam caiva hrirmatishca
    japo vratam | ete hi niyamah prokta dashadhaiva mahamate || 14|| ekadashasanani syushcakradi munisattama
    | cakram padmasanam kurmam mayuram kukkutam tatha || 15|| virasanam svastikam ca bhadram simhasanam
    tatha | muktasanam gomukham ca kirtitam yogavittamaih || 16|| savyoru dakshine gulphe dakshinam dakshinetare
    | nidadhyadrijukayastu cakrasanamidam matam || 17|| purakah kumbhakastadvadrecakah purakah punah |
    pranayamah svanadibhistasmannadih pracakshate || 18|| shariram sarvajantunam shannavatyangulatmakam
    | tanmadhye payudeshattu dvyangulatparatah param || 19|| medhradeshadadhastattu dvyangulanmadhyamucyate
    | medhrannavanguladurdhvam nadinam kandamucyate || 20|| caturangulamutsedham caturangulamayatam |
    andakaram parivritam medomajjasthishonitaih || 21|| tatraiva nadicakram tu dvadasharam pratishthitam
    | shariram dhriyate yena vartate tatra kundali || 22|| brahmarandhram sushumna ya vadanena pidhaya
    sa | alambusa sushumnayah kuhurnadi vasatyasau || 23|| anantararayugme tu varuna ca yashasvini | dakshinare
    sushumnayah pingala vartate kramat || 24|| tadantararayoh pusha vartate ca payasvini | sushumna pashcime
    care sthita nadi sarasvati || 25|| shankhini caiva gandhari tadanantarayoh sthite | uttare tu sushumnaya
    idakhya nivasatyasau || 26|| anantaram hastijihva tato vishvodari sthita | pradakshinakramenaiva cakrasyareshu
    nadayah || 27|| vartante dvadasha hyeta dvadashanilavahakah | patavatsamsthita nadyo nanavarnah samiritah
    || 28|| patamadhyam tu yatsthanam nabhicakram taducyate | nadadhara samakhyata jvalanti nadarupini
    || 29|| pararandhra sushumna ca catvaro ratnapuritah | kundalya pihitam shashvadbrahmarandhrasya madhyamam
    || 30|| evametasu nadishu dharanti dashavayavah | evam nadigatim vayugatim jnatva vicakshanah || 31||
    samagrivashirah kayah samvritasyah sunishcalah | nasagre caiva hrinmadhye bindumadhye turiyakam ||
    32|| sravantamamritam pashyennetrabhyam susamahitah | apanam mukulikritya payumakrishya conmukham
    || 33|| pranavena samutthapya shribijena nivartayet | svatmanam ca shriyam dhyayedamritaplavanam tatha
    || 34|| kalavancanametaddhi sarvamukhyam pracakshate | manasa cintita karyam manasa yena sidhyati
    || 35|| jale'gnijvalanacchakhapallavani bhavanti hi | nadhanyam jagatam vakyam viparita bhavetkriya
    || 36|| marge bindum samabadhya vahnim prajvalya jivane | shoshayitva tu salilam tena kayam dridham
    bhavet || 37|| gudayonisamayukta akuncatyekakalatah | apanamurdhvagam kritva samanonne niyojayet ||
    38|| svatmanam ca shriyam dhyayedamritaplavanam tatah | balam samarabhedyogam madhyamadvarabhagatah
    || 39|| bhavayedurdhvagatyartham pranapanasuyogatah | esha yogo varo dehe siddhimargaprakashakah ||
    40|| yathaivapangatah setuh pravahasya nirodhakah | tatha shariraga cchaya jnatavya yogibhih sada
    || 41|| sarvasameva nadinamesha bandhah prakirtitah | bandhasyasya prasadena sphutibhavati devata
    || 42|| evam catushpatho bandho margatrayanirodhakah | ekam vikasayanmargam yena siddhah susangatah
    || 43|| udanamurdhvagam kritva pranena saha vegatah | bandho'yam sarvanadinamurdhvam yati nirodhakah
    || 44|| ayam ca samputo yogo mulabandho'pyayam matah | bandhatrayamanenaiva siddhyatyabhyasayogatah
    || 45|| divaratramavicchinnam yameyame yada yada | anenabhyasayogena vayurabhyasito bhavet || 46||
    vayavabhyasite vahnih pratyaham vardhate tanau | vahnau vivardhamane tu sukhamannadi jiryate || 47||
    annasya paripakena rasavriddhih prajayate | rase vriddhim gate nityam vardhante dhatavastatha || 48||
    dhatunam vardhanenaiva prabodho vartate tanau | dahyante sarvapapani janmakotyarjitani ca || 49||
    gudamedhrantaralastham muladharam trikonakam | shivasya bindurupasya sthanam taddhi prakashakam ||
    50|| yatra kundalini nama para shaktih pratishthita | yasmadutpadyate vayuryasmadvahnih pravardhate
    || 51|| yasmadutpadyate binduryasmannadah pravardhate | yasmadutpadyate hamso yasmadutpadyate manah
    || 52|| muladharadishatcakram shaktisthanamudiritam | kanthadupari murdhantam shambhavam sthanamucyate
    || 53|| nadinamashrayah pindo nadyah pranasya cashrayah | jivasya nilayah prano jivo hamsasya cashrayah
    || 54|| hamsah shakteradhishthanam caracaramidam jagat | nirvikalpah prasannatma pranayam samabhyaset
    || 55|| samyagbandhatrayastho'pi lakshyalakshanakaranam | vedyam samuddharennityam satyasandhanamanasah
    || 56|| recakam purakam caiva kumbhamadhye nirodhayet | drishyamane pare lakshye brahmani svayamashritah
    || 57|| bahyasthavishayam sarvam recakah samudahritah | purakam shastravijnanam kumbhakam svagatam
    smritam || 58|| evamabhyasacittashcetsamukto natra samshayah | kumbhakena samaropya kumbhakena purayet
    || 59|| kumbhena kumbhayetkumbham tadantasthah param shivam | punarasphalayedadya susthiram kanthamudraya
    || 60|| vayunam gatimavritya dhritva purakakumbhakau | samahastayugam bhumau samam padayugam tatha
    || 61|| vedhakakramayogena catushpitham tu vayuna | asphalayenmahamerum vayuvaktre prakotibhih ||
    62|| putadvayam samakrishya vayuh sphurati satvaram | somasuryagnisambadhajjaniyadamritaya vai ||
    63|| merumadhyagata devashcalante merucalanat | adau sanjayate kshipram vedho'sya brahmagranthitah
    || 64|| brahmagranthim tato bhittva vishnugranthim bhinattyasau | vishnugranthim tato bhittva rudragranthim
    bhinattyasau || 65|| rudragranthim tato bhittva chitva mohamalam tatha | anekajanmasamskaragurudevaprasadatah
    || 66|| yogabhyasattato vedho jayate tasya yoginah | idapingalayormadhye sushumnanadimandale || 67||
    mudrabandhavisheshena vayumurdhvam ca karayet | ṟhasvo dahati papani dirgho mokshapradayakah || 68||
    apyayanah pluto vapi trividhoccaranena tu | tailadharamivacchinnam dirghaghantaninadavat || 69|| avacyam
    pranavasyagram yastam veda sa vedavit | ṟhasvam bindugatam dairghyam brahmarandhragatam plutam | dvadashantagatam
    mantram prasadam mantrasiddhaye || 70 sarvavighnaharashcayam pranavah sarvadoshaha | arambhashca ghatashcaiva
    punah paricayastatha || 71|| nishpattishceti kathitashcatasrastasya bhumikah | karanatrayasambhutam
    bahyam karma parityajan || 72|| antaram karma kurute yatrarambhah sa ucyate | vayuh pashcimato vedham
    kurvannapurya susthiram || 73|| yatra tishthati sa prokta ghatakhya bhumika budhaih | na sajivo na
    nirjivah kaye tishthati nishcalam | yatra vayuh sthirah khe syatseyam prathamabhumika || 74|| yatratmana
    srishtilayau jivanmuktidashagatah | sahajah kurute yogam seyam nishpattibhumika || 75|| iti|| etadupanishadam
    yo'dhite so'gniputo bhavati | sa vayuputo bhavati | surapanatputo bhavati | svarnasteyatputo bhavati
    | sa jivanmukto bhavati | tadetadricabhyuktam | tadvishnoh paramam padam sada pashyanti surayah |
    diviva cakshuratatam | tadvipraso vipanyavo jagrivamsah samindhate | vishnoryatparamam padamityupanishat
    || iti pancamo'dhyayah || 5|| om saha navavatu saha nau bhunaktu saha viryam karavavahai | tejasvinavadhi
    tamastu ma vidvishavahai | om shantih shantih shantih || harih om tatsat || iti varahopanishatsamapta
    ||
  devanagari: स्ताभ्यां विना मुक्तिभाजो न सन्ति । शुकमार्गं येऽनुसरन्ति धीराः सद्यो मुक्तास्ते भवन्तीह
    लोके ॥ ३४॥ वामदेवं येऽनुसरन्ति नित्यं मृत्वा जनित्वा च पुनःपुनस्तत् । ते वै लोके क्रममुक्ता भवन्ति
    योगैः साङ्ख्यैः कर्मभिः सत्त्वयुक्तैः ॥ ३५॥ शुकश्च वामदेवश्च द्वे सृती देवनिर्मिते । शुकः विहङ्गमः
    प्रोक्तो वामदेवः पिपीलिका ॥ ३६॥ अतद्व्यावृत्तिरूपेण साक्षाद्विधिमुखेन वा । महावाक्यविचारेण साङ्ख्ययोगसमाधिना
    ॥ ३७॥ विदित्वा स्वात्मनो रूपं सम्प्रज्ञातसमाधितः । शुकमार्गेण विरजाः प्रयान्ति परमं पदम् ॥ ३८॥ यमाद्यासनजायासहठाभ्यासात्पुनःपुनः
    । विघ्नबाहुल्यसञ्जात अणिमादिवशादिह ॥ ३९॥ अलब्ध्वापि फलं सम्यक्पुनर्भूत्वा महाकुले । पुनर्वासनयैवायं
    योगाभ्यासं पुनश्चरन् ॥ ४०॥ अनेकजन्माभ्यासेन वामदेवेन वै पथा । सोऽपि मुक्तिं समाप्नोति तद्विष्णोः परमं
    पदम् ॥ ४१॥ द्वाविमावपि पन्थानौ ब्रह्मप्राप्तिकरौ शिवौ । सद्योमुक्तिप्रदश्चैकः क्रममुक्तिप्रदः परः
    । अत्र को मोहः कः शोक एकत्वमनुपश्यतः ॥ ४२॥ यस्यानुभवपर्यन्ता बुद्धिस्तत्त्वे प्रवर्तते । तद्दृष्टिगोचराः
    सर्वे मुच्यन्ते सर्वपातकैः ॥ ४३॥ खेचरा भूचराः सर्वे ब्रह्मविद्दृष्टिगोचराः । सद्य एव विमुच्यन्ते कोटिजन्मार्जितैरघैः
    ॥ ४४॥ इति॥ इति चतुर्थोऽद्यायः ॥ ४॥ अथ हैनं ऋभुं भगवन्तं निदाघः पप्रच्छ योगाभ्यासविधिमनुब्रूहीति ।
    तथेति स होवाच । पञ्चभूतात्मको देहः पञ्चमण्डलपूरितः । काठिन्यं पृथिवीमेका पानीयं तद्द्रवाकृति ॥ १॥
    दीपनं च भवेत्तेजः प्रचारो वायुलक्षणम् । आकाशः सत्त्वतः सर्वं ज्ञातव्यं योगमिच्छता ॥ २॥ षट्शतान्यधिकान्यत्र
    सहस्राण्येकविंशतिः । अहोरात्रवहिः श्वासैर्वायुमण्डलघाततः ॥ ३॥ तत्पृथ्वीमण्डले क्षीणे वलिरायाति देहिनाम्
    । तद्वदापो गणापाये केशाः स्युः पाण्डुराः क्रमात् ॥ ४॥ तेजःक्षये क्षुधा कान्तिर्नश्यते मारुतक्षये ।
    वेपथुः संभवेन्नित्यं नाम्भसेनैव जीवति ॥ ५॥ इत्थंभूतं क्षयान्नित्यं जीवितं भूतधारणम् । उड्ड्याणं कुरुते
    यस्मादविश्रान्तं महाखगः ॥ ६॥ उड्डियाणं तदेव स्यात्तत्र बन्धोऽभिधीयते । उड्डियाणो ह्यसौ बन्धो मृत्युमातङ्गकेशरी
    ॥ ७॥ तस्य मुक्तिस्तनोः कायात्तस्य बन्धो हि दुष्करः । अग्नौ तु चालिते कुक्षौ वेदना जायते भृशम् ॥ ८॥
    न कार्या क्षुधि तेनापि नापि विण्मूत्रवेगिना । हितं मितं च भोक्तव्यं स्तोकं स्तोकमनेकधा ॥ ९॥ मृदुमध्यममन्त्रेषु
    क्रमान्मन्त्रं लयं हठम् । लयमन्त्रहठा योगा योगो ह्यष्टाङ्गसंयुतः ॥ १०॥ यमश्च नियमश्चैव तथा चासनमेव
    च । प्राणायमस्तथा पश्चात्प्रत्याहारस्तथा परम् ॥ ११॥ धारणा च तथा ध्यानं समधिश्चाष्टमो भवेत् । अहिंसा
    सत्यमस्तेयं ब्रह्मचर्यं दयार्जवम् ॥ १२॥ क्षमा धृतिर्मिताहारः शौचं चेति यमा दश । तपः सन्तोषमास्तिक्यं
    दानमीश्वरपूजनम् ॥ १३॥ सिद्धान्तश्रवणं चैव ह्रीर्मतिश्च जपो व्रतम् । एते हि नियमाः प्रोक्ता दशधैव महामते
    ॥ १४॥ एकादशासनानि स्युश्चक्रादि मुनिसत्तम । चक्रं पद्मासनं कूर्मं मयूरं कुक्कुटं तथा ॥ १५॥ वीरासनं
    स्वस्तिकं च भद्रं सिंहासनं तथा । मुक्तासनं गोमुखं च कीर्तितं योगवित्तमैः ॥ १६॥ सव्योरु दक्षिणे गुल्फे
    दक्षिणं दक्षिणेतरे । निदध्यादृजुकायस्तु चक्रासनमिदं मतम् ॥ १७॥ पूरकः कुम्भकस्तद्वद्रेचकः पूरकः पुनः
    । प्राणायामः स्वनाडीभिस्तस्मान्नाडीः प्रचक्षते ॥ १८॥ शरीरं सर्वजन्तूनां षण्णवत्यङ्गुलात्मकम् । तन्मध्ये
    पायुदेशात्तु द्व्यङ्गुलात्परतः परम् ॥ १९॥ मेढ्रदेशादधस्तात्तु द्व्यङ्गुलान्मध्यमुच्यते । मेढ्रान्नवाङ्गुलादूर्ध्वं
    नाडीनां कन्दमुच्यते ॥ २०॥ चतुरङ्गुलमुत्सेधं चतुरङ्गुलमायतम् । अण्डाकारं परिवृतं मेदोमज्जास्थिशोणितैः
    ॥ २१॥ तत्रैव नाडीचक्रं तु द्वादशारं प्रतिष्ठितम् । शरीरं ध्रियते येन वर्तते तत्र कुण्डली ॥ २२॥ ब्रह्मरन्ध्रं
    सुषुम्णा या वदनेन पिधाय सा । अलम्बुसा सुषुम्णायाः कुहूर्नाडी वसत्यसौ ॥ २३॥ अनन्तरारयुग्मे तु वारुणा
    च यशस्विनी । दक्षिणारे सुषुम्णायाः पिङ्गला वर्तते क्रमात् ॥ २४॥ तदन्तरारयोः पूषा वर्तते च पयस्विनी
    । सुषुम्ना पश्चिमे चारे स्थिता नाडी सरस्वती ॥ २५॥ शङ्खिनी चैव गान्धारी तदनन्तरयोः स्थिते । उत्तरे
    तु सुषुम्नाया इडाख्या निवसत्यसौ ॥ २६॥ अनन्तरं हस्तिजिह्वा ततो विश्वोदरी स्थिता । प्रदक्षिणक्रमेणैव
    चक्रस्यारेषु नाडयः ॥ २७॥ वर्तन्ते द्वादश ह्येता द्वादशानिलवाहकाः । पटवत्संस्थिता नाड्यो नानावर्णाः
    समीरिताः ॥ २८॥ पटमध्यं तु यत्स्थानं नाभिचक्रं तदुच्यते । नादाधारा समाख्याता ज्वलन्ती नादरूपिणी ॥ २९॥
    पररन्ध्रा सुषुम्ना च चत्वारो रत्नपूरिताः । कुण्डल्या पिहितं शश्वद्ब्रह्मरन्ध्रस्य मध्यमम् ॥ ३०॥ एवमेतासु
    नाडीषु धरन्ति दशवायवः । एवं नाडीगतिं वायुगतिं ज्ञात्वा विचक्षणः ॥ ३१॥ समग्रीवशिरः कायः संवृतास्यः
    सुनिश्चलः । नासाग्रे चैव हृन्मध्ये बिन्दुमध्ये तुरीयकम् ॥ ३२॥ स्रवन्तममृतं पश्येन्नेत्राभ्यां सुसमाहितः
    । अपानं मुकुलीकृत्य पायुमाकृष्य चोन्मुखम् ॥ ३३॥ प्रणवेन समुत्थाप्य श्रीबीजेन निवर्तयेत् । स्वात्मानं
    च श्रियं ध्यायेदमृतप्लावनं तथा ॥ ३४॥ कालवञ्चनमेतद्धि सर्वमुख्यं प्रचक्षते । मनसा चिन्तिता कार्यं मनसा
    येन सिध्यति ॥ ३५॥ जलेऽग्निज्वलनाच्छाखापल्लवानि भवन्ति हि । नाधन्यं जागतं वाक्यं विपरीता भवेत्क्रिया
    ॥ ३६॥ मार्गे बिन्दुं समाबध्य वह्निं प्रज्वाल्य जीवने । शोषयित्वा तु सलिलं तेन कायं दृढं भवेत् ॥ ३७॥
    गुदयोनिसमायुक्त आकुञ्चत्येककालतः । अपानमूर्ध्वगं कृत्वा समानोन्ने नियोजयेत् ॥ ३८॥ स्वात्मानं च श्रियं
    ध्यायेदमृतप्लावनं ततः । बलं समारभेद्योगं मध्यमद्वारभागतः ॥ ३९॥ भावयेदूर्ध्वगत्यर्थं प्राणापानसुयोगतः
    । एष योगो वरो देहे सिद्धिमार्गप्रकाशकः ॥ ४०॥ यथैवापाङ्गतः सेतुः प्रवाहस्य निरोधकः । तथा शरीरगा च्छाया
    ज्ञातव्या योगिभिः सदा ॥ ४१॥ सर्वासामेव नाडीनामेष बन्धः प्रकीर्तितः । बन्धस्यास्य प्रसादेन स्फुटीभवति
    देवता ॥ ४२॥ एवं चतुष्पथो बन्धो मार्गत्रयनिरोधकः । एकं विकासयन्मार्गं येन सिद्धाः सुसङ्गताः ॥ ४३॥ उदानमूर्ध्वगं
    कृत्वा प्राणेन सह वेगतः । बन्धोऽयं सर्वनाडीनामूर्ध्वं याति निरोधकः ॥ ४४॥ अयं च सम्पुटो योगो मूलबन्धोऽप्ययं
    मतः । बन्धत्रयमनेनैव सिद्ध्यत्यभ्यासयोगतः ॥ ४५॥ दिवारात्रमविच्छिन्नं यामेयामे यदा यदा । अनेनाभ्यासयोगेन
    वायुरभ्यसितो भवेत् ॥ ४६॥ वायावभ्यसिते वह्निः प्रत्यहं वर्धते तनौ । वह्नौ विवर्धमाने तु सुखमन्नादि
    जीर्यते ॥ ४७॥ अन्नस्य परिपाकेन रसवृद्धिः प्रजायते । रसे वृद्धिं गते नित्यं वर्धन्ते धातवस्तथा ॥ ४८॥
    धातूनां वर्धनेनैव प्रबोधो वर्तते तनौ । दह्यन्ते सर्वपापानि जन्मकोट्यर्जितानि च ॥ ४९॥ गुदमेढ्रान्तरालस्थं
    मूलाधारं त्रिकोणकम् । शिवस्य बिन्दुरूपस्य स्थानं तद्धि प्रकाशकम् ॥ ५०॥ यत्र कुण्डलिनी नाम परा शक्तिः
    प्रतिष्ठिता । यस्मादुत्पद्यते वायुर्यस्माद्वह्निः प्रवर्धते ॥ ५१॥ यस्मादुत्पद्यते बिन्दुर्यस्मान्नादः
    प्रवर्धते । यस्मादुत्पद्यते हंसो यस्मादुत्पद्यते मनः ॥ ५२॥ मूलाधारादिषट्चक्रं शक्तिस्थानमुदीरितम्
    । कण्ठादुपरि मूर्धान्तं शांभवं स्थानमुच्यते ॥ ५३॥ नाडीनामाश्रयः पिण्डो नाड्यः प्राणस्य चाश्रयः । जीवस्य
    निलयः प्राणो जीवो हंसस्य चाश्रयः ॥ ५४॥ हंसः शक्तेरधिष्ठानं चराचरमिदं जगत् । निर्विकल्पः प्रसन्नात्मा
    प्राणायां समभ्यसेत् ॥ ५५॥ सम्यग्बन्धत्रयस्थोऽपि लक्ष्यलक्षणकारणम् । वेद्यं समुद्धरेन्नित्यं सत्यसन्धानमानसः
    ॥ ५६॥ रेचकं पूरकं चैव कुम्भमध्ये निरोधयेत् । दृश्यमाने परे लक्ष्ये ब्रह्मणि स्वयमाश्रितः ॥ ५७॥ बाह्यस्थविषयं
    सर्वं रेचकः समुदाहृतः । पूरकं शास्त्रविज्ञानं कुम्भकं स्वगतं स्मृतम् ॥ ५८॥ एवमभ्यासचित्तश्चेत्समुक्तो
    नात्र संशयः । कुम्भकेन समारोप्य कुम्भकेन पूरयेत् ॥ ५९॥ कुम्भेन कुम्भयेत्कुम्भं तदन्तस्थः परं शिवम्
    । पुनरास्फालयेदद्य सुस्थिरं कण्ठमुद्रया ॥ ६०॥ वायूनां गतिमावृत्य धृत्वा पूरककुम्भकौ । समहस्तयुगं भूमौ
    समं पादयुगं तथा ॥ ६१॥ वेधकक्रमयोगेन चतुष्पीठं तु वायुना । आस्फालयेन्महामेरुं वायुवक्त्रे प्रकोटिभिः
    ॥ ६२॥ पुटद्वयं समाकृष्य वायुः स्फुरति सत्वरम् । सोमसूर्याग्निसंबधाज्जानीयादमृताय वै ॥ ६३॥ मेरुमध्यगता
    देवाश्चलन्ते मेरुचालनात् । आदौ सञ्जायते क्षिप्रं वेधोऽस्य ब्रह्मग्रन्थितः ॥ ६४॥ ब्रह्मग्रन्थिं ततो
    भित्त्वा विष्णुग्रन्थिं भिनत्त्यसौ । विष्णुग्रन्थिं ततो भित्त्वा रुद्रग्रन्थिं भिनत्त्यसौ ॥ ६५॥ रुद्रग्रन्थिं
    ततो भित्त्वा छित्वा मोहमलं तथा । अनेकजन्मसंस्कारगुरुदेवप्रसादतः ॥ ६६॥ योगाभ्यासात्ततो वेधो जायते तस्य
    योगिनः । इडापिङ्गलयोर्मध्ये सुषुम्नानाडिमण्डले ॥ ६७॥ मुद्राबन्धविशेषेण वायुमूर्ध्वं च कारयेत् । ऱ्हस्वो
    दहति पापानि दीर्घो मोक्षप्रदायकः ॥ ६८॥ आप्यायनः प्लुतो वापि त्रिविधोच्चारणेन तु । तैलधारामिवच्छिन्नं
    दीर्घघण्टानिनादवत् ॥ ६९॥ अवाच्यं प्रणवस्याग्रं यस्तं वेद स वेदवित् । ऱ्हस्वं बिन्दुगतं दैर्घ्यं ब्रह्मरन्ध्रगतं
    प्लुतम् । द्वादशान्तगतं मन्त्रं प्रसादं मन्त्रसिद्धये ॥ ७० सर्वविघ्नहरश्चायं प्रणवः सर्वदोषहा । आरंभश्च
    घटश्चैव पुनः परिचयस्तथा ॥ ७१॥ निष्पत्तिश्चेति कथिताश्चतस्रस्तस्य भूमिकाः । कारणत्रयसंभूतं बाह्यं कर्म
    परित्यजन् ॥ ७२॥ आन्तरं कर्म कुरुते यत्रारंभः स उच्यते । वायुः पश्चिमतो वेधं कुर्वन्नापूर्य सुस्थिरम्
    ॥ ७३॥ यत्र तिष्ठति सा प्रोक्ता घटाख्या भूमिका बुधैः । न सजीवो न निर्जीवः काये तिष्ठति निश्चलम् । यत्र
    वायुः स्थिरः खे स्यात्सेयं प्रथमभूमिका ॥ ७४॥ यत्रात्मना सृष्टिलयौ जीवन्मुक्तिदशागतः । सहजः कुरुते
    योगं सेयं निष्पत्तिभूमिका ॥ ७५॥ इति॥ एतदुपनिषदं योऽधीते सोऽग्निपूतो भवति । स वायुपूतो भवति । सुरापानात्पूतो
    भवति । स्वर्णस्तेयात्पूतो भवति । स जीवन्मुक्तो भवति । तदेतदृचाभ्युक्तम् । तद्विष्णोः परमं पदं सदा
    पश्यन्ति सूरयः । दिवीव चक्षुराततम् । तद्विप्रासो विपन्यवो जागृवांसः समिन्धते । विष्णोर्यत्परमं पदमित्युपनिषत्
    ॥ इति पञ्चमोऽध्यायः ॥ ५॥ ॐ सह नाववतु सह नौ भुनक्तु सह वीर्यं करवावहै । तेजस्विनावधी तमस्तु मा विद्विषावहै
    । ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ तत्सत् ॥ इति वराहोपनिषत्समाप्ता ॥
