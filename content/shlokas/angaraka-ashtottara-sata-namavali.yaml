id: angaraka-ashtottara-sata-namavali
category: stotram
name:
  english: Angaraka Ashtottara Sata Namavali
content:
  english: om mahisutaya namah | om mahabhagaya namah | om mangalaya namah | om mangalapradaya namah |
    om mahaviraya namah | om mahashuraya namah | om mahabalaparakramaya namah | om maharaudraya namah
    | om mahabhadraya namah | om mananiyaya namah || || om dayakaraya namah | om manadaya namah | om amarshanaya
    namah | om kruraya namah | om tapapapavivarjitaya namah | om supratipaya namah | om sutamrakshaya
    namah | om subrahmanyaya namah | om sukhapradaya namah | om vakrastambhadigamanaya namah || || om
    varenyaya namah | om varadaya namah | om sukhine namah | om virabhadraya namah | om virupakshaya namah
    | om vidurasthaya namah | om vibhavasave namah | om nakshatracakrasancarine namah | om kshatrapaya
    namah | om kshatravarjitaya namah || || om kshayavriddhivinirmuktaya namah | om kshamayuktaya namah
    | om vicakshanaya namah | om akshinaphaladaya namah | om cakshurgocaraya namah | om shubhalakshanaya
    namah | om vitaragaya namah | om vitabhayaya namah | om vijvaraya namah | om vishvakaranaya namah
    || || om nakshatrarashisancaraya namah | om nanabhayanikrintanaya namah | om kamaniyaya namah | om
    dayasaraya namah | om kanatkanakabhushanaya namah | om bhayaghnaya namah | om bhavyaphaladaya namah
    | om bhaktabhayavarapradaya namah | om shatruhantre namah | om shamopetaya namah || || om sharanagataposhakaya
    namah | om sahasine namah | om sadgunaya namah om adhyakshaya namah | om sadhave namah | om samaradurjayaya
    namah | om dushtaduraya namah | om shishtapujyaya namah | om sarvakashtanivarakaya namah | om dushceshtavarakaya
    namah || || om duhkhabhanjanaya namah | om durdharaya namah | om haraye namah | om duhsvapnahantre
    namah | om durdharshaya namah | om dushtagarvavimocakaya namah | om bharadvajakulodbhutaya namah |
    om bhusutaya namah | om bhavyabhushanaya namah | om raktambaraya namah || || om raktavapushe namah
    | om bhaktapalanatatparaya namah | om caturbhujaya namah | om gadadharine namah | om meshavahaya namah
    | om mitashanaya namah | om shaktishuladharaya namah | om shaktaya namah | om shastravidyavisharadaya
    namah | om tarkikaya namah || || om tamasadharaya namah | om tapasvine namah | om tamralocanaya namah
    | om taptakancanasankashaya namah | om raktakinjalkasannibhaya namah | om gotradhidevaya namah | om
    gomadhyacaraya namah | om gunavibhushanaya namah | om asrije namah | om angarakaya namah || || om
    avantideshadhishaya namah | om janardanaya namah | om suryayamyapradeshasthaya namah | om yauvanaya
    namah | om yamyadinmukhaya namah | om trikonamandalagataya namah | om tridashadhipasannutaya namah
    | om shucaye namah | om shucikaraya namah | om shuraya namah || || om shucivashyaya namah | om shubhavahaya
    namah | om meshavrishcikarashishaya namah | om medhavine namah | om mitabhashanaya namah | om sukhapradaya
    namah | om surupakshaya namah | om sarvabhishtaphalapradaya namah ||
  devanagari: ॐ महीसुताय नमः । ॐ महाभागाय नमः । ॐ मङ्गलाय नमः । ॐ मङ्गलप्रदाय नमः । ॐ महावीराय नमः । ॐ
    महाशूराय नमः । ॐ महाबलपराक्रमाय नमः । ॐ महारौद्राय नमः । ॐ महाभद्राय नमः । ॐ माननीयाय नमः ॥ ॥ ॐ दयाकराय
    नमः । ॐ मानदाय नमः । ॐ अमर्षणाय नमः । ॐ क्रूराय नमः । ॐ तापपापविवर्जिताय नमः । ॐ सुप्रतीपाय नमः ।
    ॐ सुताम्राक्षाय नमः । ॐ सुब्रह्मण्याय नमः । ॐ सुखप्रदाय नमः । ॐ वक्रस्तम्भादिगमनाय नमः ॥ ॥ ॐ वरेण्याय
    नमः । ॐ वरदाय नमः । ॐ सुखिने नमः । ॐ वीरभद्राय नमः । ॐ विरूपाक्षाय नमः । ॐ विदूरस्थाय नमः । ॐ विभावसवे
    नमः । ॐ नक्षत्रचक्रसञ्चारिणे नमः । ॐ क्षत्रपाय नमः । ॐ क्षात्रवर्जिताय नमः ॥ ॥ ॐ क्षयवृद्धिविनिर्मुक्ताय
    नमः । ॐ क्षमायुक्ताय नमः । ॐ विचक्षणाय नमः । ॐ अक्षीणफलदाय नमः । ॐ चक्षुर्गोचराय नमः । ॐ शुभलक्षणाय
    नमः । ॐ वीतरागाय नमः । ॐ वीतभयाय नमः । ॐ विज्वराय नमः । ॐ विश्वकारणाय नमः ॥ ॥ ॐ नक्षत्रराशिसञ्चाराय
