id: brahmadibhihkritamsuryastotram-12
category: stotram
name:
  english: brahmadibhihkritamsuryastotram 12
  devanagari: ब्रह्मादिभिःकृतंसूर्यस्तोत्रम् १२
content:
  english: rinushvaikamana rajanyatha devo divaspatih | brahmadibhih stuto devairrishibhishca pura'nagha
    || 2|| brahmadaya ucuh | prayatnatah pranatahitanukampine svarupato lokavibhavine namah | divaspate
    kamalakulavabodhine namastamah patalapatavapayine || 3|| pavanatishayapunyakarmane naikakamavibhavapradayine
    | bhasuramalamayukhamaline sarvalokahitakarine namah || 4|| ajaya lokatrayabhavanaya bhutatmane gopataye
    priyaya | namo mahakarunikottamaya suryaya lokatrayabhavanaya || 5|| vivasvate jnanakritantaratmane
    jagatpratishthaya jagaddhitaishine | svayambhuve lokasamastacakshushe surottamayamitatejase namah
    || 6|| nijodayaya suraganamaulimane jagatastvam mahitaistvamurumayukhasahasratapah | jagati vibho
    vatamasatuda vanatimirasavapavana madadbhavati vilohitavigrahatatimiravinashinamugram sutaram tribhuvanabhaprakaraih
    || 7|| rathamaruhya samamayam bhramasi sada jagato hitadah || 8|| ityevam samstuto devo bhaskaro vedhasa
    pura | daivataishca mahabaho shivavishnvadibhirnripa || 9|| iti shribhavishyapurane brahme parvani
    dvavimshatyadhikashatatamadhyayantargatam brahmadibhih kritam adityastotram samaptam | bhavishyapurana
    | brahmaparva | adhyaya 122
  devanagari: ृणुष्वैकमना राजन्यथा देवो दिवस्पतिः । ब्रह्मादिभिः स्तुतो देवैरृषिभिश्च पुराऽनघ ॥ २॥ ब्रह्मादय
    ऊचुः । प्रयत्नतः प्रणतहितानुकम्पिने स्वरूपतो लोकविभाविने नमः । दिवस्पते कमलकुलावबोधिने नमस्तमः पटलपटावपायिने
    ॥ ३॥ पावनातिशयपुण्यकर्मणे नैककामविभवप्रदायिने । भासुरामलमयूखमालिने सर्वलोकहितकारिणे नमः ॥ ४॥ अजाय
    लोकत्रयभावनाय भूतात्मने गोपतये प्रियाय । नमो महाकारुणिकोत्तमाय सूर्याय लोकत्रयभावनाय ॥ ५॥ विवस्वते
    ज्ञानकृतान्तरात्मने जगत्प्रतिष्ठाय जगद्धितैषिणे । स्वयम्भुवे लोकसमस्तचक्षुषे सुरोत्तमायामिततेजसे नमः
    ॥ ६॥ निजोदयाय सुरगणमौलिमणे जगतस्त्वं महितैस्त्वमुरुमयूखसहस्रतपाः । जगति विभो वतमसतुद वनतिमिरासवपावन
    मदाद्भवति विलोहितविग्रहतातिमिरविनाशिनमुग्रं सुतरां त्रिभुवनभाप्रकरैः ॥ ७॥ रथामारुह्य समामयं भ्रमसि
    सदा जगतो हितदः ॥ ८॥ इत्येवं संस्तुतो देवो भास्करो वेधसा पुरा । दैवतैश्च महाबाहो शिवविष्ण्वादिभिर्नृप
    ॥ ९॥ इति श्रीभविष्यपुराणे ब्राह्मे पर्वणि द्वाविंशत्यधिकशततमाध्यायान्तर्गतं ब्रह्मादिभिः कृतं आदित्यस्तोत्रं
    समाप्तम् । भविष्यपुराण । ब्राह्मपर्व । अध्याय १२२
