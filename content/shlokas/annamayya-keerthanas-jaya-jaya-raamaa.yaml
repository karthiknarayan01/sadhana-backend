id: annamayya-keerthanas-jaya-jaya-raamaa
category: stotram
name:
  english: Annamayya Keerthanas Jaya Jaya Raamaa
content:
  english: adi pallavi jaya jaya rama samaravijaya rama | bhayahara nijabhaktaparina rama || jaladhi bandhincina
    saumitrirama sèlavillu viracina sitarama | kaligi yajnamugace kausalyarama || jaya jaya rama samaravijaya
    rama ariravanantaka adityakularama gurumaunulanugane kodandarama | dhara nahalyapaliti dasharatharama
    haruraninutula lokabhirama || jaya jaya rama samaravijaya rama atipratapamula mayamrigantaka rama
    sutakushalavapriya sugunarama | vitata mahimala shrivenkatadrirama matilonabayani manuvamsharama ||
    jaya jaya rama samaravijaya rama bhayahara nijabhaktaparina rama ||
  devanagari: आदि पल्लवि जय जय रामा समरविजय रामा । भयहर निजभक्तपारीण रामा ॥ जलधि बन्धिञ्चिन सौमित्रिरामा
    सॆलविल्लु विरचिन सीतारामा । कलिगि यज्ञमुगाचे कौसल्यरामा ॥ जय जय रामा समरविजय रामा अरिरावणान्तक आदित्यकुलरामा
    गुरुमौनुलनुगाने कोदण्डरामा । धर नहल्यपालिटि दशरथरामा हरुराणिनुतुल लोकाभिरामा ॥ जय जय रामा समरविजय
    रामा अतिप्रतापमुल मायामृगान्तक रामा सुतकुशलवप्रिय सुगुणरामा । वितत महिमल श्रीवेङ्कटाद्रिरामा मतिलोनबायनि
    मनुवंशरामा ॥ जय जय रामा समरविजय रामा भयहर निजभक्तपारीण रामा ॥
