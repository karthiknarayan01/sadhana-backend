id: mahendra-kruta-mahalakshmi-stotram
category: stotram
name:
  english: Mahendra Kruta Mahalakshmi Stotram
content:
  english: mahendra uvaca namah kamalavasinyai narayanyai namo namah | krishnapriyayai sarayai padmayai
    ca namo namah || || padmapatrekshanayai ca padmasyayai namo namah | padmasanayai padminyai vaishnavyai
    ca namo namah || || sarvasampatsvarupayai sarvadatryai namo namah | sukhadayai mokshadayai siddhidayai
    namo namah || || haribhaktipradatryai ca harshadatryai namo namah | krishnavakshahsthitayai ca krishneshayai
    namo namah || || krishnashobhasvarupayai ratnadhyayai namo namah | sampatyadhishthatridevyai mahadevyai
    namo namah || || sasyadhishthatridevyai ca sasyalakshmyai namo namah | namo buddhisvarupayai buddhidayai
    namo namah || || vaikunthe ca mahalakshmirlakshmih kshirodasagare | svargalakshmirindragehe rajalakshmirnripalaye
    || || grihalakshmishca grihinam gehe ca grihadevata | surabhih sa gavam mata dakshina yajnakamini
    || || aditirdevamata tvam kamala kamalalaye | svaha tvam ca havirdane kavyadane svadha smrita || ||
    tvam hi vishnusvarupa ca sarvadhara vasundhara | shuddhasattvasvarupa tvam narayanaparayana || ||
    krodhahimsavarjita ca varada ca shubhanana | paramarthaprada tvam ca haridasyaprada para || || yaya
    vina jagatsarvam bhasmibhutamasarakam | jivanmritam ca vishvam ca shavatulyam yaya vina || || sarvesham
    ca para tvam hi sarvabandhavarupini | yaya vina na sambhashyo bandhavairbandhavah sada || || tvaya
    hino bandhuhinastvaya yuktah sabandhavah | dharmarthakamamokshanam tvam ca karanarupini || || stanandhayanam
    tvam mata shishunam shaishave yatha | tatha tvam sarvada mata sarvesham sarvavishvatah || || tyaktastano
    matrihinah sa cejjivati daivatah | tvaya hino janah ko'pi na jivatyeva nishcitam || || suprasannasvarupa
    tvam me prasanna bhavambike | vairigrastam ca vishayam dehi mahyam sanatani || || vayam yavattvaya
    hina bandhuhinashca bhikshukah | sarvasampadvihinashca tavadeva haripriye || || rajyam dehi shriyam
    dehi balam dehi sureshvari | kirtim dehi dhanam dehi putranmahyam ca dehi vai || || kamam dehi matim
    dehi bhogan dehi haripriye | jnanam dehi ca dharmam ca sarvasaubhagyamipsitam || || sarvadhikaramevam
    vai prabhavam ca pratapakam | jayam parakramam yuddhe paramaishvaryamaiva ca || || ityuktva tu mahendrashca
    sarvaih suraganaih saha | nanama sashrunetro'yam murdhna caiva punah punah || || brahma ca shankarashcaiva
    shesho dharmashca keshavah | sarve cakruh pariharam surarthe ca punah punah || || devebhyashca varam
    dattva pushpamalam manoharam | keshavaya dadau lakshmih santushta surasamsadi || || yayurdaivashca
    santushtah svam svam sthanam ca narada | devi yayau hareh krodam hrishta kshirodashayinah || || yayatustau
    svasvagriham brahmeshanau ca narada | dattva shubhashisham tau ca devebhyah pritipurvakam || || idam
    stotram mahapunyam trisandhyam yah pathennarah | kuberatulyah sa bhavedrajarajeshvaro mahan || ||
    siddhastotram yadi pathet so'pi kalpatarurnarah | pancalakshajapenaiva stotrasiddhirbhavennrinam ||
    || siddhastotram yadi pathenmasamekam ca samyatah | mahasukhi ca rajendro bhavishyati na samshayah
    || || iti shribrahmavaivarte mahapurane dvitiye prakritikhande naradanarayanasamvade ekonacatvarimshattamo'dhyaye
    mahendra krita shri mahalakshmi stotram |
  devanagari: महेन्द्र उवाच नमः कमलवासिन्यै नारायण्यै नमो नमः । कृष्णप्रियायै सारायै पद्मायै च नमो नमः
    ॥ ॥ पद्मपत्रेक्षणायै च पद्मास्यायै नमो नमः । पद्मासनायै पद्मिन्यै वैष्णव्यै च नमो नमः ॥ ॥ सर्वसम्पत्स्वरूपायै
    सर्वदात्र्यै नमो नमः । सुखदायै मोक्षदायै सिद्धिदायै नमो नमः ॥ ॥ हरिभक्तिप्रदात्र्यै च हर्षदात्र्यै
    नमो नमः । कृष्णवक्षःस्थितायै च कृष्णेशायै नमो नमः ॥ ॥ कृष्णशोभास्वरूपायै रत्नाढ्यायै नमो नमः । सम्पत्यधिष्ठातृदेव्यै
    महादेव्यै नमो नमः ॥ ॥ सस्याधिष्ठातृदेव्यै च सस्यलक्ष्म्यै नमो नमः । नमो बुद्धिस्वरूपायै बुद्धिदायै
    नमो नमः ॥ ॥ वैकुण्ठे च महालक्ष्मीर्लक्ष्मीः क्षीरोदसागरे । स्वर्गलक्ष्मीरिन्द्रगेहे राजलक्ष्मीर्नृपालये
    ॥ ॥ गृहलक्ष्मीश्च गृहिणां गेहे च गृहदेवता । सुरभिः सा गवां माता दक्षिणा यज्ञकामिनी ॥ ॥ अदितिर्देवमाता
    त्वं कमला कमलालये । स्वाहा त्वं च हविर्दाने कव्यदाने स्वधा स्मृता ॥ ॥ त्वं हि विष्णुस्वरूपा च सर्वाधारा
    वसुन्धरा । शुद्धसत्त्वस्वरूपा त्वं नारायणपरायाणा ॥ ॥ क्रोधहिंसावर्जिता च वरदा च शुभानना । परमार्थप्रदा
    त्वं च हरिदास्यप्रदा परा ॥ ॥ यया विना जगत्सर्वं भस्मीभूतमसारकम् । जीवन्मृतं च विश्वं च शवतुल्यं यया
    विना ॥ ॥ सर्वेषां च परा त्वं हि सर्वबान्धवरूपिणी । यया विना न सम्भाष्यो बान्धवैर्बान्धवः सदा ॥ ॥ त्वया
    हीनो बन्धुहीनस्त्वया युक्तः सबान्धवः । धर्मार्थकाममोक्षाणां त्वं च कारणरूपिणी ॥ ॥ स्तनन्धयानां त्वं
    माता शिशूनां शैशवे यथा । तथा त्वं सर्वदा माता सर्वेषां सर्वविश्वतः ॥ ॥ त्यक्तस्तनो मातृहीनः स चेज्जीवति
    दैवतः । त्वया हीनो जनः कोऽपि न जीवत्येव निश्चितम् ॥ ॥ सुप्रसन्नस्वरूपा त्वं मे प्रसन्ना भवाम्बिके
    । वैरिग्रस्तं च विषयं देहि मह्यं सनातनि ॥ ॥ वयं यावत्त्वया हीना बन्धुहीनाश्च भिक्षुकाः । सर्वसम्पद्विहीनाश्च
    तावदेव हरिप्रिये ॥ ॥ राज्यं देहि श्रियं देहि बलं देहि सुरेश्वरि । कीर्तिं देहि धनं देहि पुत्रान्मह्यं
    च देहि वै ॥ ॥ कामं देहि मतिं देहि भोगान् देहि हरिप्रिये । ज्ञानं देहि च धर्मं च सर्वसौभाग्यमीप्सितम्
    ॥ ॥ सर्वाधिकारमेवं वै प्रभावां च प्रतापकम् । जयं पराक्रमं युद्धे परमैश्वर्यमैव च ॥ ॥ इत्युक्त्वा तु
    महेन्द्रश्च सर्वैः सुरगणैः सह । ननाम साश्रुनेत्रोऽयं मूर्ध्ना चैव पुनः पुनः ॥ ॥ ब्रह्मा च शङ्करश्चैव
    शेषो धर्मश्च केशवः । सर्वे चक्रुः परीहारं सुरार्थे च पुनः पुनः ॥ ॥ देवेभ्यश्च वरं दत्त्वा पुष्पमालां
    मनोहराम् । केशवाय ददौ लक्ष्मीः सन्तुष्टा सुरसंसदि ॥ ॥ ययुर्दैवाश्च सन्तुष्टाः स्वं स्वं स्थानं च नारद
    । देवी ययौ हरेः क्रोडं हृष्टा क्षीरोदशायिनः ॥ ॥ ययतुस्तौ स्वस्वगृहं ब्रह्मेशानौ च नारद । दत्त्वा शुभाशिषं
    तौ च देवेभ्यः प्रीतिपूर्वकम् ॥ ॥ इदं स्तोत्रं महापुण्यं त्रिसन्ध्यं यः पठेन्नरः । कुबेरतुल्यः स भवेद्राजराजेश्वरो
    महान् ॥ ॥ सिद्धस्तोत्रं यदि पठेत् सोऽपि कल्पतरुर्नरः । पञ्चलक्षजपेनैव स्तोत्रसिद्धिर्भवेन्नृणाम् ॥
    ॥ सिद्धस्तोत्रं यदि पठेन्मासमेकं च संयतः । महासुखी च राजेन्द्रो भविष्यति न संशयः ॥ ॥ इति श्रीब्रह्मवैवर्ते
    महापुराणे द्वितीये प्रकृतिखण्डे नारदनारायणसंवादे एकोनचत्वारिंशत्तमोऽध्याये महेन्द्र कृत श्री महालक्ष्मी
    स्तोत्रम् ।
