id: sri-dakshina-murthy-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Sri Dakshina Murthy Ashtottara Sata Nama Stotram
content:
  english: dhyanam vyakhyarudrakshamale kalashasurabhite bahubhirvamapadam bibhrano janumurdhna vatatarunivritavasyadho
    vidyamanah | sauvarne yogapithe lipimayakamale supavishtastrinetrah kshirabhashcandramaulirvitaratu
    nitaram shuddhabuddhim shivo nah || stotram vidyarupi mahayogi shuddhajnani pinakadhrit | ratnalankritasarvango
    ratnamali jatadharah || || gangadharyacalavasi sarvajnani samadhidhrit | aprameyo yoganidhistarako
    bhaktavatsalah || || brahmarupi jagadvyapi vishnumurtih purantakah | ukshavahashcarmavasah pitambaravibhushanah
    || || mokshasiddhirmokshadayi danavarirjagatpatih | vidyadhari shuklatanuh vidyadayi ganadhipah ||
    || papapasmritisamharta shashimaulirmahasvanah | samapriyah svayam sadhuh sarvadevairnamaskritah ||
    || hastavahnidharah shriman mrigadhari ca shankarah | yajnanathah kratudhvamsi yajnabhokta yamantakah
    || || bhaktanugrahamurtishca bhaktasevyo vrishadhvajah | bhasmoddhulitasarvango'pyakshamaladharo mahan
    || || trayimurtih param brahma nagarajairalankritah | shantarupo mahajnani sarvalokavibhushanah ||
    || ardhanarishvaro devo munisevyah surottamah | vyakhyanadevo bhagavan agnicandrarkalocanah || ||
    jagatsrashta jagadgopta jagaddhvamsi trilocanah | jagadgururmahadevo mahanandaparayanah || || jatadhari
    mahaviro jnanadevairalankritah | vyomagangajalasnata siddhasanghasamarcitah || || tattvamurtirmahayogi
    mahasarasvatapradah | vyomamurtishca bhaktanamishtakamaphalapradah || || viramurtirvirupi ca tejomurtiranamayah
    | vedavedangatattvajnashcatushshashtikalanidhih || || bhavarogabhayadhvamsi bhaktanamabhayapradah
    | nilagrivo lalataksho gajacarma ca jnanadah || || arogi kamadahanastapasvi vishnuvallabhah | brahmacari
    ca sannyasi grihasthashramakaranah || || dantashamavatam shreshthah sattvarupadayanidhih | yogapattabhiramashca
    vinadhari vicetanah || || mantraprajnanugacaro mudrapustakadharakah | ragahikkadiroganam vinihanta
    sureshvarah || || iti shri dakshinamurtyashtottarashatanama stotram ||
  devanagari: ध्यानं व्याख्यारुद्राक्षमाले कलशसुरभिते बाहुभिर्वामपादं बिभ्राणो जानुमूर्ध्ना वटतरुनिवृतावस्यधो
    विद्यमानः । सौवर्णे योगपीठे लिपिमयकमले सूपविष्टस्त्रिणेत्रः क्षीराभश्चन्द्रमौलिर्वितरतु नितरां शुद्धबुद्धिं
    शिवो नः ॥ स्तोत्रं विद्यारूपी महायोगी शुद्धज्ञानी पिनाकधृत् । रत्नालङ्कृतसर्वाङ्गो रत्नमाली जटाधरः
    ॥ ॥ गङ्गाधार्यचलावासी सर्वज्ञानी समाधिधृत् । अप्रमेयो योगनिधिस्तारको भक्तवत्सलः ॥ ॥ ब्रह्मरूपी जगद्व्यापी
    विष्णुमूर्तिः पुरान्तकः । उक्षवाहश्चर्मवासाः पीताम्बरविभूषणः ॥ ॥ मोक्षसिद्धिर्मोक्षदायी दानवारिर्जगत्पतिः
    । विद्याधारी शुक्लतनुः विद्यादायी गणाधिपः ॥ ॥ पापापस्मृतिसंहर्ता शशिमौलिर्महास्वनः । सामप्रियः स्वयं
    साधुः सर्वदेवैर्नमस्कृतः ॥ ॥ हस्तवह्निधरः श्रीमान् मृगधारी च शङ्करः । यज्ञनाथः क्रतुध्वंसी यज्ञभोक्ता
    यमान्तकः ॥ ॥ भक्तानुग्रहमूर्तिश्च भक्तसेव्यो वृषध्वजः । भस्मोद्धूलितसर्वाङ्गोऽप्यक्षमालाधरो महान्
    ॥ ॥ त्रयीमूर्तिः परं ब्रह्म नागराजैरलङ्कृतः । शान्तरूपो महाज्ञानी सर्वलोकविभूषणः ॥ ॥ अर्धनारीश्वरो
    देवो मुनिसेव्यः सुरोत्तमः । व्याख्यानदेवो भगवान् अग्निचन्द्रार्कलोचनः ॥ ॥ जगत्स्रष्टा जगद्गोप्ता जगद्ध्वंसी
    त्रिलोचनः । जगद्गुरुर्महादेवो महानन्दपरायणः ॥ ॥ जटाधारी महावीरो ज्ञानदेवैरलङ्कृतः । व्योमगङ्गाजलस्नाता
    सिद्धसङ्घसमर्चितः ॥ ॥ तत्त्वमूर्तिर्महायोगी महासारस्वतप्रदः । व्योममूर्तिश्च भक्तानामिष्टकामफलप्रदः
    ॥ ॥ वीरमूर्तिर्विरूपी च तेजोमूर्तिरनामयः । वेदवेदाङ्गतत्त्वज्ञश्चतुष्षष्टिकलानिधिः ॥ ॥ भवरोगभयध्वंसी
    भक्तानामभयप्रदः । नीलग्रीवो ललाटाक्षो गजचर्मा च ज्ञानदः ॥ ॥ अरोगी कामदहनस्तपस्वी विष्णुवल्लभः । ब्रह्मचारी
    च सन्न्यासी गृहस्थाश्रमकारणः ॥ ॥ दान्तशमवतां श्रेष्ठः सत्त्वरूपदयानिधिः । योगपट्टाभिरामश्च वीणाधारी
    विचेतनः ॥ ॥ मन्त्रप्रज्ञानुगाचारो मुद्रापुस्तकधारकः । रागहिक्कादिरोगाणां विनिहन्ता सुरेश्वरः ॥ ॥ इति
    श्री दक्षिणामूर्त्यष्टोत्तरशतनाम स्तोत्रम् ॥
