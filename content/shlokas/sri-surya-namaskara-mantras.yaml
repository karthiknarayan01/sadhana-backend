id: sri-surya-namaskara-mantras
category: stotram
name:
  english: Sri Surya Namaskara Mantras
content:
  english: dhyeyah sada savitrimandalamadhyavarti narayanah sarasijasana sannivishtah | keyuravan makarakundalavan
    kiriti hari hiranmayavapuh dhritashankhacakrah || om mitraya namah | om hiranyagarbhaya namah | adityasya
    namaskaran ye kurvanti dine dine | ayuh prajnam balam viryam tejastesham ca jayate ||
  devanagari: ध्येयः सदा सवितृमण्डलमध्यवर्ती नारायणः सरसिजासन सन्निविष्टः । केयूरवान् मकरकुण्डलवान् किरीटी
    हारी हिरण्मयवपुः धृतशङ्खचक्रः ॥ ॐ मित्राय नमः । ॐ हिरण्यगर्भाय नमः । आदित्यस्य नमस्कारान् ये कुर्वन्ति
    दिने दिने । आयुः प्रज्ञां बलं वीर्यं तेजस्तेषां च जायते ॥
