    दुख सुख सब रोवहिं रानी ॥ कहहिं भरतु मुनि कहा सो कीन्हे। फलु जग जीवन्ह अभिमत दीन्हे ॥ कानन करुँ जनम
    भरि बासू। एहिं तें अधिक न मोर सुपासू ॥ दो अँतरजामी रामु सिय तुम्ह सरबग्य सुजान। जो फुर कहहु त नाथ
    निज कीजिअ बचनु प्रवान ॥ ॥ भरत बचन सुनि देखि सनेहू। सभा सहित मुनि भे बिदेहू ॥ भरत महा महिमा जलरासी।
    मुनि मति ठाढ़इ तीर अबला सी ॥ गा चह पार जतनु हियँ हेरा। पावति नाव न बोहितु बेरा ॥ औरु करिहि को भरत
    बड़आई। सरसी सीपि कि सिन्धु समाई ॥ भरतु मुनिहि मन भीतर भाए। सहित समाज राम पहिँ आए ॥ प्रभु प्रनामु करि
    दीन्ह सुआसनु। बैठे सब सुनि मुनि अनुसासनु ॥ बोले मुनिबरु बचन बिचारी। देस काल अवसर अनुहारी ॥ सुनहु राम
    सरबग्य सुजाना। धरम नीति गुन ग्यान निधाना ॥ दो सब के उर अन्तर बसहु जानहु भाउ कुभाउ। पुरजन जननी भरत
    हित होइ सो कहिअ उपाउ ॥ ॥ आरत कहहिं बिचारि न क् । सूझ जूआरिहि आपन द् ॥ सुनि मुनि बचन कहत रघुर् । नाथ
    तुम्हारेहि हाथ उप् ॥ सब कर हित रुख राउरि राखेँ। आयसु किएँ मुदित फुर भाषेम् ॥ प्रथम जो आयसु मो कहुँ
    होई। माथेँ मानि करौ सिख सोई ॥ पुनि जेहि कहँ जस कहब गोसाईँ। सो सब भाँति घटिहि सेवकाईँ ॥ कह मुनि राम
    सत्य तुम्ह भाषा। भरत सनेहँ बिचारु न राखा ॥ तेहि तें कहुँ बहोरि बहोरी। भरत भगति बस भि मति मोरी ॥ मोरेँ
    जान भरत रुचि राखि। जो कीजिअ सो सुभ सिव साखी ॥ दो भरत बिनय सादर सुनिअ करिअ बिचारु बहोरि। करब साधुमत
    लोकमत नृपनय निगम निचोरि ॥ ॥ गुरु अनुराग भरत पर देखी। राम ह्दयँ आनन्दु बिसेषी ॥ भरतहि धरम धुरन्धर जानी।
    निज सेवक तन मानस बानी ॥ बोले गुर आयस अनुकूला। बचन मञ्जु मृदु मङ्गलमूला ॥ नाथ सपथ पितु चरन दोहाई। भयु
    न भुअन भरत सम भाई ॥ जे गुर पद अम्बुज अनुरागी। ते लोकहुँ बेदहुँ बड़भागी ॥ राउर जा पर अस अनुरागू। को
    कहि सकि भरत कर भागू ॥ लखि लघु बन्धु बुद्धि सकुचाई। करत बदन पर भरत बड़आई ॥ भरतु कहहीं सोइ किएँ भलाई।
    अस कहि राम रहे अरगाई ॥ दो तब मुनि बोले भरत सन सब सँकोचु तजि तात। कृपासिन्धु प्रिय बन्धु सन कहहु हृदय
    कै बात ॥ ॥ सुनि मुनि बचन राम रुख पाई। गुरु साहिब अनुकूल अघाई ॥ लखि अपने सिर सबु छरु भारू। कहि न सकहिं
    कछु करहिं बिचारू ॥ पुलकि सरीर सभाँ भे ठाढें। नीरज नयन नेह जल बाढ़एम् ॥ कहब मोर मुनिनाथ निबाहा। एहि
    तें अधिक कहौं मैं काहा। मैं जानुँ निज नाथ सुभ् । अपराधिहु पर कोह न क् ॥ मो पर कृपा सनेह बिसेषी। खेलत
    खुनिस न कबहूँ देखी ॥ सिसुपन तेम परिहरेउँ न सङ्गू। कबहुँ न कीन्ह मोर मन भङ्गू ॥ मैं प्रभु कृपा रीति
    जियँ जोही। हारेहुँ खेल जितावहिं मोही ॥ दो महूँ सनेह सकोच बस सनमुख कही न बैन। दरसन तृपित न आजु लगि
    पेम पिआसे नैन ॥ ॥ बिधि न सकेउ सहि मोर दुलारा। नीच बीचु जननी मिस पारा। यहु कहत मोहि आजु न सोभा। अपनीं
    समुझि साधु सुचि को भा ॥ मातु मन्दि मैं साधु सुचाली। उर अस आनत कोटि कुचाली ॥ फरि कि कोदव बालि सुसाली।
    मुकुता प्रसव कि सम्बुक काली ॥ सपनेहुँ दोसक लेसु न काहू। मोर अभाग उदधि अवगाहू ॥ बिनु समुझें निज अघ
    परिपाकू। जारिउँ जायँ जननि कहि काकू ॥ हृदयँ हेरि हारेउँ सब ओरा। एकहि भाँति भलेहिं भल मोरा ॥ गुर गोसाइँ
    साहिब सिय रामू। लागत मोहि नीक परिनामू ॥ दो साधु सभा गुर प्रभु निकट कहुँ सुथल सति भाउ। प्रेम प्रपञ्चु
    कि झूठ फुर जानहिं मुनि रघुराउ ॥ ॥ भूपति मरन पेम पनु राखी। जननी कुमति जगतु सबु साखी ॥ देखि न जाहि बिकल
    महतारी। जरहिं दुसह जर पुर नर नारी ॥ महीं सकल अनरथ कर मूला। सो सुनि समुझि सहिउँ सब सूला ॥ सुनि बन गवनु
    कीन्ह रघुनाथा। करि मुनि बेष लखन सिय साथा ॥ बिनु पानहिन्ह पयादेहि पाएँ। सङ्करु साखि रहेउँ एहि घाएँ
    ॥ बहुरि निहार निषाद सनेहू। कुलिस कठिन उर भयु न बेहू ॥ अब सबु आँखिन्ह देखेउँ आई। जिअत जीव जड़ सबि सहाई
    ॥ जिन्हहि निरखि मग साँपिनि बीछी। तजहिं बिषम बिषु तामस तीछी ॥ दो तेइ रघुनन्दनु लखनु सिय अनहित लागे
    जाहि। तासु तनय तजि दुसह दुख दैउ सहावि काहि ॥ ॥ सुनि अति बिकल भरत बर बानी। आरति प्रीति बिनय नय सानी
    ॥ सोक मगन सब सभाँ खभारू। मनहुँ कमल बन परेउ तुसारू ॥ कहि अनेक बिधि कथा पुरानी। भरत प्रबोधु कीन्ह मुनि
    ग्यानी ॥ बोले उचित बचन रघुनन्दू। दिनकर कुल कैरव बन चन्दू ॥ तात जाँय जियँ करहु गलानी। ईस अधीन जीव गति
    जानी ॥ तीनि काल तिभुअन मत मोरें। पुन्यसिलोक तात तर तोरे ॥ उर आनत तुम्ह पर कुटिलाई। जाइ लोकु परलोकु
    नसाई ॥ दोसु देहिं जननिहि जड़ तेई। जिन्ह गुर साधु सभा नहिं सेई ॥ दो मिटिहहिं पाप प्रपञ्च सब अखिल अमङ्गल
    भार। लोक सुजसु परलोक सुखु सुमिरत नामु तुम्हार ॥ ॥ कहुँ सुभाउ सत्य सिव साखी। भरत भूमि रह राउरि राखी
    ॥ तात कुतरक करहु जनि जाएँ। बैर पेम नहि दुरि दुराएँ ॥ मुनि गन निकट बिहग मृग जाहीं। बाधक बधिक बिलोकि
    पराहीम् ॥ हित अनहित पसु पच्छिउ जाना। मानुष तनु गुन ग्यान निधाना ॥ तात तुम्हहि मैं जानुँ नीकें। करौं
    काह असमञ्जस जीकेम् ॥ राखेउ रायँ सत्य मोहि त्यागी। तनु परिहरेउ पेम पन लागी ॥ तासु बचन मेटत मन सोचू।
    तेहि तें अधिक तुम्हार सँकोचू ॥ ता पर गुर मोहि आयसु दीन्हा। अवसि जो कहहु चहुँ सोइ कीन्हा ॥ दो मनु प्रसन्न
    करि सकुच तजि कहहु करौं सोइ आजु। सत्यसन्ध रघुबर बचन सुनि भा सुखी समाजु ॥ ॥ सुर गन सहित सभय सुरराजू।
    सोचहिं चाहत होन अकाजू ॥ बनत उपाउ करत कछु नाहीं। राम सरन सब गे मन माहीम् ॥ बहुरि बिचारि परस्पर कहहीं।
    रघुपति भगत भगति बस अहहीं। सुधि करि अम्बरीष दुरबासा। भे सुर सुरपति निपट निरासा ॥ सहे सुरन्ह बहु काल
    बिषादा। नरहरि किए प्रगट प्रहलादा ॥ लगि लगि कान कहहिं धुनि माथा। अब सुर काज भरत के हाथा ॥ आन उपाउ न
    देखिअ देवा। मानत रामु सुसेवक सेवा ॥ हियँ सपेम सुमिरहु सब भरतहि। निज गुन सील राम बस करतहि ॥ दो सुनि
    सुर मत सुरगुर कहेउ भल तुम्हार बड़ भागु। सकल सुमङ्गल मूल जग भरत चरन अनुरागु ॥ ॥ सीतापति सेवक सेवकाई।
    कामधेनु सय सरिस सुहाई ॥ भरत भगति तुम्हरें मन आई। तजहु सोचु बिधि बात बनाई ॥ देखु देवपति भरत प्रभ् ।
    सहज सुभायँ बिबस रघुर् ॥ मन थिर करहु देव डरु नाहीं। भरतहि जानि राम परिछाहीम् ॥ सुनो सुरगुर सुर सम्मत
    सोचू। अन्तरजामी प्रभुहि सकोचू ॥ निज सिर भारु भरत जियँ जाना। करत कोटि बिधि उर अनुमाना ॥ करि बिचारु
    मन दीन्ही ठीका। राम रजायस आपन नीका ॥ निज पन तजि राखेउ पनु मोरा। छोहु सनेहु कीन्ह नहिं थोरा ॥ दो कीन्ह
    अनुग्रह अमित अति सब बिधि सीतानाथ। करि प्रनामु बोले भरतु जोरि जलज जुग हाथ ॥ ॥ कहौं कहावौं का अब स्वामी।
    कृपा अम्बुनिधि अन्तरजामी ॥ गुर प्रसन्न साहिब अनुकूला। मिटी मलिन मन कलपित सूला ॥ अपडर डरेउँ न सोच समूलें।
    रबिहि न दोसु देव दिसि भूलेम् ॥ मोर अभागु मातु कुटिलाई। बिधि गति बिषम काल कठिनाई ॥ पाउ रोऽपि सब मिलि
    मोहि घाला। प्रनतपाल पन आपन पाला ॥ यह नि रीति न राउरि होई। लोकहुँ बेद बिदित नहिं गोई ॥ जगु अनभल भल
    एकु गोसाईं। कहिअ होइ भल कासु भलाईम् ॥ देउ देवतरु सरिस सुभ् । सनमुख बिमुख न काहुहि क् जाइ निकट पहिचानि
    तरु छाहँ समनि सब सोच। मागत अभिमत पाव जग राउ रङ्कु भल पोच ॥ ॥ लखि सब बिधि गुर स्वामि सनेहू। मिटेउ छोभु
    नहिं मन सन्देहू ॥ अब करुनाकर कीजिअ सोई। जन हित प्रभु चित छोभु न होई ॥ जो सेवकु साहिबहि सँकोची। निज
    हित चहि तासु मति पोची ॥ सेवक हित साहिब सेवकाई। करै सकल सुख लोभ बिहाई ॥ स्वारथु नाथ फिरें सबही का।
    किएँ रजाइ कोटि बिधि नीका ॥ यह स्वारथ परमारथ सारु। सकल सुकृत फल सुगति सिङ्गारु ॥ देव एक बिनती सुनि
    मोरी। उचित होइ तस करब बहोरी ॥ तिलक समाजु साजि सबु आना। करिअ सुफल प्रभु जौं मनु माना ॥ दो सानुज पठिअ
    मोहि बन कीजिअ सबहि सनाथ। नतरु फेरिअहिं बन्धु दौ नाथ चलौं मैं साथ ॥ ॥ नतरु जाहिं बन तीनिउ भाई। बहुरिअ
    सीय सहित रघुराई ॥ जेहि बिधि प्रभु प्रसन्न मन होई। करुना सागर कीजिअ सोई ॥ देवँ दीन्ह सबु मोहि अभारु।
    मोरें नीति न धरम बिचारु ॥ कहुँ बचन सब स्वारथ हेतू। रहत न आरत कें चित चेतू ॥ उतरु देइ सुनि स्वामि रजाई।
    सो सेवकु लखि लाज लजाई ॥ अस मैं अवगुन उदधि अगाधू। स्वामि सनेहँ सराहत साधू ॥ अब कृपाल मोहि सो मत भावा।
    सकुच स्वामि मन जाइँ न पावा ॥ प्रभु पद सपथ कहुँ सति भ् । जग मङ्गल हित एक उप् प्रभु प्रसन्न मन सकुच
    तजि जो जेहि आयसु देब। सो सिर धरि धरि करिहि सबु मिटिहि अनट अवरेब ॥ ॥ भरत बचन सुचि सुनि सुर हरषे। साधु
    सराहि सुमन सुर बरषे ॥ असमञ्जस बस अवध नेवासी। प्रमुदित मन तापस बनबासी ॥ चुपहिं रहे रघुनाथ सँकोची। प्रभु
    गति देखि सभा सब सोची ॥ जनक दूत तेहि अवसर आए। मुनि बसिष्ठँ सुनि बेगि बोलाए ॥ करि प्रनाम तिन्ह रामु
    निहारे। बेषु देखि भे निपट दुखारे ॥ दूतन्ह मुनिबर बूझी बाता। कहहु बिदेह भूप कुसलाता ॥ सुनि सकुचाइ नाइ
    महि माथा। बोले चर बर जोरें हाथा ॥ बूझब राउर सादर साईं। कुसल हेतु सो भयु गोसाईम् ॥ दो नाहि त कोसल नाथ
    कें साथ कुसल गि नाथ। मिथिला अवध बिसेष तें जगु सब भयु अनाथ ॥ ॥ कोसलपति गति सुनि जनकौरा। भे सब लोक सोक
    बस बौरा ॥ जेहिं देखे तेहि समय बिदेहू। नामु सत्य अस लाग न केहू ॥ रानि कुचालि सुनत नरपालहि। सूझ न कछु
    जस मनि बिनु ब्यालहि ॥ भरत राज रघुबर बनबासू। भा मिथिलेसहि हृदयँ हराँसू ॥ नृप बूझे बुध सचिव समाजू। कहहु
    बिचारि उचित का आजू ॥ समुझि अवध असमञ्जस दोऊ। चलिअ कि रहिअ न कह कछु कोऊ ॥ नृपहि धीर धरि हृदयँ बिचारी।
    पठे अवध चतुर चर चारी ॥ बूझि भरत सति भाउ कुभ् । आएहु बेगि न होइ लख् गे अवध चर भरत गति बूझि देखि करतूति।
