id: brahmanakritamshivalingastotram
category: stotram
name:
  english: brahmanakritamshivalingastotram
  devanagari: ब्रह्मणाकृतंशिवलिन्गस्तोत्रम्
content:
  english: brahmakritam shivalingastotram brahmovaca | namaste divyarupaya namaste bahurupine | namo'vishahyaviryaya
    namo vishvakriyatmane || 21|| namah pingakaparddaya namah khandendudharine | namah kanakavarnaya namo
    vananivasine || 22|| vande tvam bhutabharttaram sada shatruvinashanam | ranatkanakakeyuram dhritapurnendumandalam
    || 23|| vande tvam tridashadhyaksham vishvadhyaksham maheshvaram | kshinasamsaraduhkhaugham munidhyatapadam
    sada || 24|| vande tvam sarvada devam daityasanghatanashanam | tankapattishashulagradhanuhkhadgagadadharam
    || 25|| iti shriskandapurane avantyakhande caturashitilingamahatmye pancashashtitamadhyayantargatam
    brahmakritam shivalingastotram samaptam | skandapurana | avantyakhanda | caturashitikhanda | adhyaya
    65
  devanagari: ब्रह्मकृतं शिवलिङ्गस्तोत्रम् ब्रह्मोवाच । नमस्ते दिव्यरूपाय नमस्ते बहुरूपिणे । नमोऽविषह्यवीर्याय
    नमो विश्वक्रियात्मने ॥ २१॥ नमः पिङ्गकपर्द्दाय नमः खण्डेन्दुधारिणे । नमः कनकवर्णाय नमो वननिवासिने ॥
    २२॥ वन्दे त्वां भूतभर्त्तारं सदा शत्रुविनाशनम् । रणत्कनककेयूरं धृतपूर्णेन्दुमण्डलम् ॥ २३॥ वन्दे त्वां
    त्रिदशाध्यक्षं विश्वाध्यक्षं महेश्वरम् । क्षीणसंसारदुःखौघं मुनिध्यातपदं सदा ॥ २४॥ वन्दे त्वां सर्वदा
    देवं दैत्यसङ्घातनाशनम् । टङ्कपट्टिशशूलाग्रधनुःखड्गगदाधरम् ॥ २५॥ इति श्रीस्कन्दपुराणे आवन्त्यखण्डे
    चतुरशीतिलिङ्गमाहात्म्ये पञ्चषष्टितमाध्यायान्तर्गतं ब्रह्मकृतं शिवलिङ्गस्तोत्रं समाप्तम् । स्कन्दपुराण
    । आवन्त्यखण्ड । चतुरशीतिखण्ड । अध्याय ६५
