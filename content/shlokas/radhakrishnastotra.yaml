id: radhakrishnastotra
category: stotram
name:
  english: radhakrishnastotra
  devanagari: राधक्रिश्नस्तोत्र
content:
  english: shriradhakrishnastotram || atha brahmadikritam shriradhakrishnastotram || brahmovaca | tava
    caranasaroje manmanashcariko bhramatu satatamisha premabhaktya saroje | bhavanamaranarogat pahi shantyaushadhena
    sudridhasuparipakvam dehi bhaktim ca dasyam || 1|| shamkara uvaca | bhavajalanidhimagnashcittamino
    madiyo bhramati satatamasmin ghorsamsarkupe | vishayamativinindyam srishtisamhararupam
  devanagari: श्रीराधाकृष्णस्तोत्रम् ॥ अथ ब्रह्मादिकृतं श्रीराधाकृष्णस्तोत्रम् ॥ ब्रह्मोवाच । तव चरणसरोजे
    मन्मनश्चरीको भ्रमतु सततमीश प्रेमभक्त्या सरोजे । भवनमरणरोगात् पाहि शान्त्यौषधेन सुदृढसुपरिपक्वाम् देहि
    भक्तिं च दास्यम् ॥ १॥ शंकर उवाच । भवजलनिधिमग्नश्चित्तमीनो मदीयो भ्रमति सततमस्मिन् घोर्संसार्कूपे ।
    विषयमतिविनिन्द्यं सृष्टिसंहाररूपम्
meaning: {}
