id: ashtalakshmyashtottarashatanamavalih
category: stotram
name:
  english: ashtalakshmyashtottarashatanamavalih
  devanagari: अष्टलक्ष्म्यष्टोत्तरशतनामावलिः
content:
  english: shrim hrim klim mahalakshmyai namah mantralakshmyai namah mayalakshmyai namah matipradayai
    namah medhalakshmyai namah mokshalakshmyai namah mahipradayai namah vittalakshmyai namah mitralakshmyai
    namah madhulakshmyai namah kantilakshmyai namah karyalakshmyai namah kirtilakshmyai namah karapradayai
    namah kanyalakshmyai namah koshalakshmyai namah kavyalakshmyai namah kalapradayai namah gajalakshmyai
    namah gandhalakshmyai namah grihalakshmyai namah gunapradayai namah jayalakshmyai namah jivalakshmyai
    namah jayapradayai namah danalakshmyai namah divyalakshmyai namah dvipalakshmyai namah dayapradayai
    namah dhanalakshmyai namah dhenulakshmyai namah dhanapradayai namah dharmalakshmyai namah dhairyalakshmyai
    namah dravyalakshmyai namah dhritipradayai namah nabholakshmyai namah nadalakshmyai namah netralakshmyai
    namah nayapradayai namah natyalakshmyai namah nitilakshmyai namah nityalakshmyai namah nidhipradayai
    namah purnalakshmyai namah pushpalakshmyai namah pashupradayai namah pushtilakshmyai namah padmalakshmyai
    namah putalakshmyai namah prajapradayai namah pranalakshmyai namah prabhalakshmyai namah prajnalakshmyai
    namah phalapradayai namah budhalakshmyai namah buddhilakshmyai namah balalakshmyai namah bahupradayai
    namah bhagyalakshmyai namah bhogalakshmyai namah bhujalakshmyai namah bhaktipradayai namah bhavalakshmyai
    namah bhimalakshmyai namah bhurlakshmyai namah bhushanapradayai namah rupalakshmyai namah rajyalakshmyai
    namah rajalakshmyai namah ramapradayai namah viralakshmyai namah vardhikalakshmyai namah vidyalakshmyai
    namah varalakshmyai namah varshalakshmyai namah vanalakshmyai namah vadhupradayai namah varnalakshmyai
    namah vashyalakshmyai namah vaglakshmyai namah vaibhavapradayai namah shauryalakshmyai namah shamtilakshmyai
    namah shaktilakshmyai namah shubhapradayai namah shrutilakshmyai namah shastralakshmyai namah shrilakshmyai
    namah shobhanapradayai namah sthiralakshmyai namah siddhilakshmyai namah satyalakshmyai namah sudhapradayai
    namah sainyalakshmyai namah samalakshmyai namah sasyalakshmyai namah sutapradayai namah samrajyalakshmyai
    namah sallakshmyai namah hrilakshmyai namah adhyalakshmyai namah ayurlakshmyai namah arogyadayai namah
    shri mahalakshmyai namah
  devanagari: श्रीं ह्रीं क्लीं महालक्ष्म्यै नमः मन्त्रलक्ष्म्यै नमः मायालक्ष्म्यै नमः मतिप्रदायै नमः
    मेधालक्ष्म्यै नमः मोक्षलक्ष्म्यै नमः महीप्रदायै नमः वित्तलक्ष्म्यै नमः मित्रलक्ष्म्यै नमः मधुलक्ष्म्यै
    नमः कान्तिलक्ष्म्यै नमः कार्यलक्ष्म्यै नमः कीर्तिलक्ष्म्यै नमः करप्रदायै नमः कन्यालक्ष्म्यै नमः कोशलक्ष्म्यै
    नमः काव्यलक्ष्म्यै नमः कलाप्रदायै नमः गजलक्ष्म्यै नमः गन्धलक्ष्म्यै नमः गृहलक्ष्म्यै नमः गुणप्रदायै
    नमः जयलक्ष्म्यै नमः जीवलक्ष्म्यै नमः जयप्रदायै नमः दानलक्ष्म्यै नमः दिव्यलक्ष्म्यै नमः द्वीपलक्ष्म्यै
    नमः दयाप्रदायै नमः धनलक्ष्म्यै नमः धेनुलक्ष्म्यै नमः धनप्रदायै नमः धर्मलक्ष्म्यै नमः धैर्यलक्ष्म्यै
    नमः द्रव्यलक्ष्म्यै नमः धृतिप्रदायै नमः नभोलक्ष्म्यै नमः नादलक्ष्म्यै नमः नेत्रलक्ष्म्यै नमः नयप्रदायै
    नमः नाट्यलक्ष्म्यै नमः नीतिलक्ष्म्यै नमः नित्यलक्ष्म्यै नमः निधिप्रदायै नमः पूर्णलक्ष्म्यै नमः पुष्पलक्ष्म्यै
    नमः पशुप्रदायै नमः पुष्टिलक्ष्म्यै नमः पद्मलक्ष्म्यै नमः पूतलक्ष्म्यै नमः प्रजाप्रदायै नमः प्राणलक्ष्म्यै
    नमः प्रभालक्ष्म्यै नमः प्रज्ञालक्ष्म्यै नमः फलप्रदायै नमः बुधलक्ष्म्यै नमः बुद्धिलक्ष्म्यै नमः बललक्ष्म्यै
    नमः बहुप्रदायै नमः भाग्यलक्ष्म्यै नमः भोगलक्ष्म्यै नमः भुजलक्ष्म्यै नमः भक्तिप्रदायै नमः भावलक्ष्म्यै
    नमः भीमलक्ष्म्यै नमः भूर्लक्ष्म्यै नमः भूषणप्रदायै नमः रूपलक्ष्म्यै नमः राज्यलक्ष्म्यै नमः राजलक्ष्म्यै
    नमः रमाप्रदायै नमः वीरलक्ष्म्यै नमः वार्धिकलक्ष्म्यै नमः विद्यालक्ष्म्यै नमः वरलक्ष्म्यै नमः वर्षलक्ष्म्यै
    नमः वनलक्ष्म्यै नमः वधूप्रदायै नमः वर्णलक्ष्म्यै नमः वश्यलक्ष्म्यै नमः वाग्लक्ष्म्यै नमः वैभवप्रदायै
    नमः शौर्यलक्ष्म्यै नमः शांतिलक्ष्म्यै नमः शक्तिलक्ष्म्यै नमः शुभप्रदायै नमः श्रुतिलक्ष्म्यै नमः शास्त्रलक्ष्म्यै
    नमः श्रीलक्ष्म्यै नमः शोभनप्रदायै नमः स्थिरलक्ष्म्यै नमः सिद्धिलक्ष्म्यै नमः सत्यलक्ष्म्यै नमः सुधाप्रदायै
    नमः सैन्यलक्ष्म्यै नमः सामलक्ष्म्यै नमः सस्यलक्ष्म्यै नमः सुतप्रदायै नमः साम्राज्यलक्ष्म्यै नमः सल्लक्ष्म्यै
    नमः ह्रीलक्ष्म्यै नमः आढ्यलक्ष्म्यै नमः आयुर्लक्ष्म्यै नमः आरोग्यदायै नमः श्री महालक्ष्म्यै नमः
