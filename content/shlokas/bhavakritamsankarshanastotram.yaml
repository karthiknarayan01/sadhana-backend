id: bhavakritamsankarshanastotram
category: stotram
name:
  english: bhavakritamsankarshanastotram
  devanagari: भवकृतंसन्कर्षणस्तोत्रम्
content:
  english: rnirikshato hyanvapi drishtirajyate | ishe yatha no'jitamanyuramhasam kastam na manyeta jigishuratmanah
    || 19|| asaddrisho yah pratibhati mayaya kshibeva madhvasavatamralocanah | na nagavadhvo'rhana ishire
    hriya yatpadayoh sparshanadharshitendriyah || 20|| yamahurasya sthitijanmasamyamam tribhirvihinam
    yamanantamrishayah | na veda siddharthamiva kvacitsthitam bhumandalam murdhasahasradhamasu || 21||
    yasyadya asidgunavigraho mahan vijnanadhishnyo bhagavanajah kila | yatsambhavo'ham trivrita svatejasa
    vaikarikam tamasamaindriyam srije || 22|| ete vayam yasya vashe mahatmanah sthitah shakunta iva sutrayantritah
    | mahanaham vaikritatamasendriyah srijama sarve yadanugrahadidam || 23|| yannirmitam karhyapi karmaparvanim
    mayam jano'yam gunasargamohitah | na veda nistaranayogamanjasa tasmai namaste vilayodayatmane || 24||
    iti shrimadbhagavatamahapurane pancamaskandhe saptadashadhyayantargatam bhavakritam sankarshanastotram
    samaptam | bhagavatapurana | adhyaya 5
  devanagari: र्निरीक्षतो ह्यण्वपि दृष्टिरज्यते । ईशे यथा नोऽजितमन्युरंहसां कस्तं न मन्येत जिगीषुरात्मनः
    ॥ १९॥ असद्दृशो यः प्रतिभाति मायया क्षीबेव मध्वासवताम्रलोचनः । न नागवध्वोऽर्हण ईशिरे ह्रिया यत्पादयोः
    स्पर्शनधर्षितेन्द्रियाः ॥ २०॥ यमाहुरस्य स्थितिजन्मसंयमं त्रिभिर्विहीनं यमनन्तमृषयः । न वेद सिद्धार्थमिव
    क्वचित्स्थितं भूमण्डलं मूर्धसहस्रधामसु ॥ २१॥ यस्याद्य आसीद्गुणविग्रहो महान् विज्ञानधिष्ण्यो भगवानजः
    किल । यत्सम्भवोऽहं त्रिवृता स्वतेजसा वैकारिकं तामसमैन्द्रियं सृजे ॥ २२॥ एते वयं यस्य वशे महात्मनः
    स्थिताः शकुन्ता इव सूत्रयन्त्रिताः । महानहं वैकृततामसेन्द्रियाः सृजाम सर्वे यदनुग्रहादिदम् ॥ २३॥ यन्निर्मितां
    कर्ह्यपि कर्मपर्वणीं मायां जनोऽयं गुणसर्गमोहितः । न वेद निस्तारणयोगमञ्जसा तस्मै नमस्ते विलयोदयात्मने
    ॥ २४॥ इति श्रीमद्भागवतमहापुराणे पञ्चमस्कन्धे सप्तदशाध्यायान्तर्गतं भवकृतं सङ्कर्षणस्तोत्रं समाप्तम्
    । भागवतपुराण । अध्याय ५
