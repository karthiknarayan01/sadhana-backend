id: dattatreyanushtupmantravidhanam
category: mantra
name:
  english: dattatreyanushtupmantravidhanam
  devanagari: दत्तात्रेयानुष्टुप्मन्त्रविधानम्
content:
  english: om asya shridattatreyanushtupmantrasya bhagavan shiva rishih | anushtupchandah | shadbhujah
    shridattatreyo devata | tatprityarthe jape viniyogah || rishyadinyasah | bhagavate shivarishaye namah
    shirasi | anushtupchandase namah mukhe | shadbhujashridattatreyadevatayai namah hridi | tatprityarthe
    jape viniyogaya namah sarvange || karanyasah | dattatreya angushthabhyam namah | hare krishna tarjanibhyam
    svaha | unmattanandadayaka madhyamabhyam vashat | digambara mune anamikabhyam hum | bala pishaca kanishthikabhyam
    vaushat | jnanasagara karatalakaraprishthabhyam phat || shadanganyasah | dattatreya hridayaya namah
    | hare krishna shirase svaha | unmattanandadayaka shikhayai vashat | digambara mune kavacaya hum |
    bala pishaca netratrayaya vaushat | jnanasagara astraya phat || dhyanam
  devanagari: ॐ अस्य श्रीदत्तात्रेयानुष्टुप्मन्त्रस्य भगवान् शिव ऋषिः । अनुष्टुप्छन्दः । षड्भुजः श्रीदत्तात्रेयो
    देवता । तत्प्रीत्यर्थे जपे विनियोगः ॥ ऋष्यादिन्यासः । भगवते शिवऋषये नमः शिरसि । अनुष्टुप्छन्दसे नमः
    मुखे । षड्भुजश्रीदत्तात्रेयदेवतायै नमः हृदि । तत्प्रीत्यर्थे जपे विनियोगाय नमः सर्वाङ्गे ॥ करन्यासः
    । दत्तात्रेय अङ्गुष्ठाभ्यां नमः । हरे कृष्ण तर्जनीभ्यां स्वाहा । उन्मत्तानन्ददायक मध्यमाभ्यां वषट्
    । दिगम्बर मुने अनामिकाभ्यां हुम् । बाल पिशाच कनिष्ठिकाभ्यां वौषट् । ज्ञानसागर करतलकरपृष्ठाभ्यां फट्
    ॥ षडङ्गन्यासः । दत्तात्रेय हृदयाय नमः । हरे कृष्ण शिरसे स्वाहा । उन्मत्तानन्ददायक शिखायै वषट् । दिगम्बर
    मुने कवचाय हुम् । बाल पिशाच नेत्रत्रयाय वौषट् । ज्ञानसागर अस्त्राय फट् ॥ ध्यानम्
