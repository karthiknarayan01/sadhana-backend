id: narayaniyam-dashaka-54
category: stotram
name:
  english: Narayaniyam Dashaka 54
content:
  english: tvatsevotkassaubharirnama purvam kalindyantardvadashabdam tapasyan | minavrate snehavan bhogalole
    tarkshyam sakshadaikshatagre kadacit || || tvadvaham tam sakshudham trikshasunum minam kancijjakshatam
    lakshayan sah | taptashcitte shaptavanatra cettvam jantun bhokta jivitam capi mokta || || tasmin kale
    kaliyah kshveladarpat sarparateh kalpitam bhagamashnan | tena krodhattvatpadambhojabhaja pakshakshiptastaddurapam
    payo'gat || || ghore tasmin surajaniravase tire vriksha vikshatah kshvelavegat | pakshivratah peturabhre
    patantah karunyardram tvanmanastena jatam || || kale tasminnekada sirapanim muktva yate yamunam kananantam
    | tvayyuddamagrishmabhishmoshmatapta gogopala vyapiban kshvelatoyam || || nashyajjivan vicyutan kshmatale
    tan vishvan pashyannacyuta tvam dayardrah | prapyopantam jivayamasitha drak piyushambhovarshibhih
    shrikatakshaih || || kim kim jato harshavarshatirekah sarvangeshvityutthita gopasanghah | drishtva'gre
    tvam tvatkritam tadvidanta stvamalingan drishtananaprabhavah || || gavashcaivam labdhajivah kshanena
    sphitanandastvam ca drishtva purastat | dragavavruh sarvato harshabashpam vyamuncantyo mandamudyanninadah
    || || romanco'yam sarvato nah sharire bhuyasyantah kacidanandamurcha | ashcaryo'yam kshvelavego mukunde
    tyukto gopairnandito vandito'bhuh || || evam bhaktan muktajivanapi tvam mugdhapangairastarogamstanoshi
    | tadrigbhutasphitakarunyabhuma rogat paya vayugehadhivasa ||
  devanagari: त्वत्सेवोत्कस्सौभरिर्नाम पूर्वं कालिन्द्यन्तर्द्वादशाब्दं तपस्यन् । मीनव्राते स्नेहवान्
    भोगलोले तार्क्ष्यं साक्षादैक्षताग्रे कदाचित् ॥ ॥ त्वद्वाहं तं सक्षुधं तृक्षसूनुं मीनं कञ्चिज्जक्षतं
    लक्षयन् सः । तप्तश्चित्ते शप्तवानत्र चेत्त्वं जन्तून् भोक्ता जीवितं चापि मोक्ता ॥ ॥ तस्मिन् काले कालियः
    क्ष्वेलदर्पात् सर्पारातेः कल्पितं भागमश्नन् । तेन क्रोधात्त्वत्पदाम्भोजभाजा पक्षक्षिप्तस्तद्दुरापं
    पयोऽगात् ॥ ॥ घोरे तस्मिन् सूरजानीरवासे तीरे वृक्षा विक्षताः क्ष्वेलवेगात् । पक्षिव्राताः पेतुरभ्रे
    पतन्तः कारुण्यार्द्रं त्वन्मनस्तेन जातम् ॥ ॥ काले तस्मिन्नेकदा सीरपाणिं मुक्त्वा याते यामुनं काननान्तम्
    । त्वय्युद्दामग्रीष्मभीष्मोष्मतप्ता गोगोपाला व्यापिबन् क्ष्वेलतोयम् ॥ ॥ नश्यज्जीवान् विच्युतान् क्ष्मातले
    तान् विश्वान् पश्यन्नच्युत त्वं दयार्द्रः । प्राप्योपान्तं जीवयामासिथ द्राक् पीयूषाम्भोवर्षिभिः श्रीकटक्षैः
    ॥ ॥ किं किं जातो हर्षवर्षातिरेकः सर्वाङ्गेष्वित्युत्थिता गोपसङ्घाः । दृष्ट्वाऽग्रे त्वां त्वत्कृतं
    तद्विदन्त स्त्वामालिङ्गन् दृष्टनानाप्रभावाः ॥ ॥ गावश्चैवं लब्धजीवाः क्षणेन स्फीतानन्दास्त्वां च दृष्ट्वा
    पुरस्तात् । द्रागावव्रुः सर्वतो हर्षबाष्पं व्यामुञ्चन्त्यो मन्दमुद्यन्निनादाः ॥ ॥ रोमाञ्चोऽयं सर्वतो
    नः शरीरे भूयस्यन्तः काचिदानन्दमूर्छा । आश्चर्योऽयं क्ष्वेलवेगो मुकुन्दे त्युक्तो गोपैर्नन्दितो वन्दितोऽभूः
    ॥ ॥ एवं भक्तान् मुक्तजीवानपि त्वं मुग्धापाङ्गैरस्तरोगांस्तनोषि । तादृग्भूतस्फीतकारुण्यभूमा रोगात्
    पाया वायुगेहाधिवास ॥
