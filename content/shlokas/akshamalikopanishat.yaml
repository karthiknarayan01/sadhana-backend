id: akshamalikopanishat
category: upanishad
name:
  english: akshamalikopanishat
  devanagari: अक्षमालिकोपनिषत्
content:
  english: upanishad akshamalikopanishat akaradikshakarantavarnajatakalevaram | vikalevarakaivalyam ramacandrapadam
    bhaje || om vanme manasi pratishthita mano me vaci pratishthitamaviravirma edhi || vedasya ma anisthah
    shrutam me ma prahasiranenadhitenaratransandadhamyritam vadishyami satyam vadishyami || tanmamavatu
    tadvaktaramavatu avatu mamavatu vaktaramavatu vaktaram || om shantih shantih shantih || harih om |
    atha prajapatirguham papraccha bho brahmannakshamalabhedavidhim bruhiti | sa kim lakshana kati bheda
    asyah kati sutrani katham ghatanaprakarah ke varnah ka pratishtha kaishadhidevata kim phalam ceti
    | tam guhah pratyuvaca pravalamauktikasphatikashankharajatashtapadacandanaputrajivikabje rudraksha
    iti | adikshantamurtih savadhanabhava | sauvarnam rajatam tamram tanmukhe mukham tatpucche puccham
    tadantaravartanakramena yojayet | yadasyantaram sutram tadbrahma | yaddakshaparshve tacchaivam | yadvame
    tadvaishnavam | yanmukham sa sarasvati | yatpuccham sa gayatri | yatsushiram sa vidya | ya granthih
    sa prakritih | ye svaraste dhavalah | ye sparshaste pitah | ye paraste raktah | atha tam pancabhirgandhairamritaih
    pancabhirgavyaistanubhih shodhayitva pancabhirgavyairgandhodakena samsnapya tasmatsonkarena patrakurcena
    snapayitva shtabhirgandhairalipya sumanahsthale niveshyakshatapushpairaradhya pratyakshamadikshantairvarnairbhavayet
    | omankara mrityunjaya sarvavyapaka prathame'kshe pratitishtha | omankarakarshanatmakasarvagata dvitiye'kshe
    pratitishtha | ominkarapushtidakshobhakara tritiye'kshe pratitishtha | ominkara vakprasadakara nirmala
    caturthe'kshe pratitishtha | omunkara sarvabalaprada saratara pancame'kshe pratitishtha | omunkaroccatana
    duhsaha shashthe'kshe pratitishtha | omrinkakara samkshobhakara cancala saptame'kshe pratitishtha
    | omrinkara sammohanakarojavalashtame'kshe pratitishtha | omlrinkaravidveshanakara mohaka navame'kshe
    pratitishtha | omlrinkara mohakara dashame'kshe pratitishtha | omenkara sarvavashyakara shuddhasattvaikadashe'kshe
    pratitishtha | omainkara shuddhasattvika purushavashyakara dvadashe'kshe pratitishtha | omonkarakhilavanmaya
    nityashuddha trayodashe'kshe pratitishtha | omaunkara sarvavanmaya vashyakara caturdashe'kshe pratitishtha
    | omankara gajadivashyakara mohana pancadashe'kshe pratitishtha | omahkara mrityunashanakara raudra
    shodashe'kshe pratitishtha | om kankara sarvavishahara kalyanada saptadashe'kshe pratitishtha | om
    khankara sarvakshobhakara vyapakashtadashe'kshe pratitishtha | om gankara sarvavighnashamana mahattaraikonavimshe'kshe
    pratitishtha | om ghankara saubhagyada stambhanakara vimshe'kshe pratitishtha | om nakara sarvavishanashakarograikavimshe'kshe
    pratitishtha | om cankarabhicaraghna krura dvavimshe'kshe pratitishtha | om chankara bhutanashakara
    bhishana trayovimshe'kshe pratitishtha | om jankara krityadinashakara durdharsha caturvimshe'kshe
    pratitishtha | om jhankara bhutanashakara pancavimshe'kshe pratitishtha | om nakara mrityupramathana
    shadvimshe'kshe pratitishtha | om tankara sarvavyadhihara subhaga saptavimshe'kshe pratitishtha |
    om thankara candrarupashtavimshe'kshe pratitishtha | om dankara garudatmaka vishaghna shobhanaikonatrimshe'kshe
    pratitishtha | om dhankara sarvasampatprada subhaga trimshe'kshe pratitishtha | om nankara sarvasiddhiprada
    mohakaraikatrimshe'kshe pratitishtha | om tankara dhanadhanyadisampatprada prasanna dvatrimshe'kshe
    pratitishtha | om thankara dharmapraptikara nirmala trayastrimshe'kshe pratitishtha | om dankara pushtivriddhikara
    priyadarshana catustrimshe'kshe pratitishtha | om dhankara vishajvaranighna vipula pancatrimshe'kshe
    pratitishtha | om nankara bhuktimuktiprada shanta shattrimshe'kshe pratitishtha | om pankara vishavighnanashana
    bhavya saptatrimshe'kshe pratitishtha | om phankaranimadisiddhiprada jyotirupashtatrimshe'kshe pratitishtha
    | om bankara sarvadoshahara shobhanaikonacatvarimshe'kshe pratitishtha | om bhankara bhutaprashantikara
    bhayanaka catvarimshe'kshe pratitishtha | om mankara vidveshimohanakaraikacatvarimshe'kshe pratitishtha
    | om yankara sarvavyapaka pavana dvicatvarimshe'kshe pratitishtha | om rankara dahakara vikrita tricatvarimshe'kshe
    pratitishtha | om lankara vishvambhara bhasura catushcatvarimshe'kshe pratitishtha | om vankara sarvapyayanakara
    nirmala pancacatvarimshe'kshe pratitishtha | om shankara sarvaphalaprada pavitra shatcatvarimshe'kshe
    pratitishtha | om shankara dharmarthakamada dhavala saptacatvarimshe'kshe pratitishtha | om sankara
    sarvakarana sarvavarnikashtacatvarimshe'kshe pratitishtha | om hankara sarvavanmaya nirmalaikonapancashadakshe
    pratitishtha | om ḻankara sarvashaktiprada pradhana pancashadakshe pratitishtha | om kshankara paraparatattvajnapaka
    paramjyotirupa shikhamanau pratitishtha | athovaca ye devah prithivipadastebhyo namo bhagavanto'numadantu
    shobhayai pitaro'numadantu shobhayai jnanamayimakshamalikam | athovaca ye deva antarikshasadastebhyah
    om namo bhagavanto'numadantu shobhayai pitaro'numadantu shobhayaijnanamayimakshamalikam | athovaca
    ye deva divishadastebhyo namo bhagavanto'numadantu shobhayai pitaro'numadantu shobhayai jnanamayimakshamalikam
    | athovaca ye mantra ya vidyastebhyo namastabhyashconnamastacchaktirasyah pratishthapayati | athovaca
    ye brahmavishnurudrastebhyah sagunebhya om namastadviryamasyah pratishthapayati | athovaca ye sankhyaditattvabhedastebhyo
    namo vartadhvam virodhe'nuvartadhvam | athovaca ye shaiva vaishnavah shaktah shatasahasrashastebhyo
    namonamo bhagavanto'numadantvanugrihnantu | athovaca yashca mrityoh pranavatyastabhyo namonamastenaitam
    mridayata mridayata | punaretasyam sarvatmakatvam bhavayitva bhavena purvamalikamutpadyarabhya tanmayim
    mahopaharairupahritya adikshantairaksharairakshamalamashtottarashatam sprishet | atha punarutthapya
    pradakshinikrityom namaste bhagavati mantramatrike'kshamale sarvavashankaryomnamaste bhagavati mantramatrike'kshamalike
    sheshastambhinyom namaste bhagavati mantramatrike'kshamale uccatanyomnamaste bhagavati mantramatrike'kshamale
    vishvamrityo mrityunjayasvarupini sakalalokoddipini sakalalokarakshadhike sakalalokojjivike sakalalokotpadike
    divapravartike ratripravartike nadyantaram yasi deshantaram yasi dvipantaram yasi lokantaram yasi
    sarvada sphurasi sarvahridi vasasi | namaste pararupe namaste pashyantirupe namaste madhyamarupe namaste
    vaikharirupe sarvatattvatmike sarvavidyatmike sarvashaktyatmike sarvadevatmike vasishthena muninaradhite
    vishvamitrena muninopajivyamane namaste namaste | caturatra
  devanagari: उपनिषद् अक्षमालिकोपनिषत् अकारादिक्षकारान्तवर्णजातकलेवरम् । विकलेवरकैवल्यं रामचन्द्रपदं भजे
    ॥ ॐ वाङ्मे मनसि प्रतिष्ठिता मनो मे वाचि प्रतिष्ठितमाविरावीर्म एधि ॥ वेदस्य म आणीस्थः श्रुतं मे मा
    प्रहासीरनेनाधीतेनारात्रान्सन्दधाम्यृतं वदिष्यामि सत्यं वदिष्यामि ॥ तन्मामवतु तद्वक्तारमवतु अवतु मामवतु
    वक्तारमवतु वक्तारम् ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ । अथ प्रजापतिर्गुहं पप्रच्छ भो ब्रह्मन्नक्षमालाभेदविधिं
    ब्रूहीति । सा किं लक्षणा कति भेदा अस्याः कति सूत्राणि कथं घटनाप्रकारः के वर्णाः का प्रतिष्ठा कैषाधिदेवता
    किं फलं चेति । तं गुहः प्रत्युवाच प्रवालमौक्तिकस्फटिकशङ्खरजताष्टापदचन्दनपुत्रजीविकाब्जे रुद्राक्षा
    इति । आदिक्षान्तमूर्तिः सावधानभावा । सौवर्णं राजतं ताम्रं तन्मुखे मुखं तत्पुच्छे पुच्छं तदन्तरावर्तनक्रमेण
    योजयेत् । यदस्यान्तरं सूत्रं तद्ब्रह्म । यद्दक्षपार्श्वे तच्छैवम् । यद्वामे तद्वैष्णवम् । यन्मुखं
    सा सरस्वती । यत्पुच्छं सा गायत्री । यत्सुषिरं सा विद्या । या ग्रन्थिः सा प्रकृतिः । ये स्वरास्ते धवलाः
    । ये स्पर्शास्ते पीताः । ये परास्ते रक्ताः । अथ तां पञ्चभिर्गन्धैरमृतैः पञ्चभिर्गव्यैस्तनुभिः शोधयित्वा
    पञ्चभिर्गव्यैर्गन्धोदकेन संस्नाप्य तस्मात्सोङ्कारेण पत्रकूर्चेन स्नपयित्वा ष्टभिर्गन्धैरालिप्य सुमनःस्थले
    निवेश्याक्षतपुष्पैराराध्य प्रत्यक्षमादिक्षान्तैर्वर्णैर्भावयेत् । ओमङ्कार मृत्युञ्जय सर्वव्यापक प्रथमेऽक्षे
    प्रतितिष्ठ । ओमाङ्काराकर्षणात्मकसर्वगत द्वितीयेऽक्षे प्रतितिष्ठ । ओमिङ्कारपुष्टिदाक्षोभकर तृतीयेऽक्षे
    प्रतितिष्ठ । ओमीङ्कार वाक्प्रसादकर निर्मल चतुर्थेऽक्षे प्रतितिष्ठ । ओमुङ्कार सर्वबलप्रद सारतर पञ्चमेऽक्षे
    प्रतितिष्ठ । ओमूङ्कारोच्चाटन दुःसह षष्ठेऽक्षे प्रतितिष्ठ । ओमृङ्काकार संक्षोभकर चञ्चल सप्तमेऽक्षे
    प्रतितिष्ठ । ओमॄङ्कार संमोहनकरोजवलाष्टमेऽक्षे प्रतितिष्ठ । ओम्लृङ्कारविद्वेषणकर मोहक नवमेऽक्षे प्रतितिष्ठ
    । ओम्लॄङ्कार मोहकर दशमेऽक्षे प्रतितिष्ठ । ओमेङ्कार सर्ववश्यकर शुद्धसत्त्वैकादशेऽक्षे प्रतितिष्ठ ।
    ओमैङ्कार शुद्धसात्त्विक पुरुषवश्यकर द्वादशेऽक्षे प्रतितिष्ठ । ओमोङ्काराखिलवाङ्मय नित्यशुद्ध त्रयोदशेऽक्षे
    प्रतितिष्ठ । ओमौङ्कार सर्ववाङ्मय वश्यकर चतुर्दशेऽक्षे प्रतितिष्ठ । ओमङ्कार गजादिवश्यकर मोहन पञ्चदशेऽक्षे
    प्रतितिष्ठ । ओमःकार मृत्युनाशनकर रौद्र षोडशेऽक्षे प्रतितिष्ठ । ॐ कङ्कार सर्वविषहर कल्याणद सप्तदशेऽक्षे
    प्रतितिष्ठ । ॐ खङ्कार सर्वक्षोभकर व्यापकाष्टादशेऽक्षे प्रतितिष्ठ । ॐ गङ्कार सर्वविघ्नशमन महत्तरैकोनविंशेऽक्षे
    प्रतितिष्ठ । ॐ घङ्कार सौभाग्यद स्तम्भनकर विंशेऽक्षे प्रतितिष्ठ । ॐ ङकार सर्वविषनाशकरोग्रैकविंशेऽक्षे
    प्रतितिष्ठ । ॐ चङ्काराभिचारघ्न क्रूर द्वाविंशेऽक्षे प्रतितिष्ठ । ॐ छङ्कार भूतनाशकर भीषण त्रयोविंशेऽक्षे
    प्रतितिष्ठ । ॐ जङ्कार कृत्यादिनाशकर दुर्धर्ष चतुर्विंशेऽक्षे प्रतितिष्ठ । ॐ झङ्कार भूतनाशकर पञ्चविंशेऽक्षे
    प्रतितिष्ठ । ॐ ञकार मृत्युप्रमथन षड्विंशेऽक्षे प्रतितिष्ठ । ॐ टङ्कार सर्वव्याधिहर सुभग सप्तविंशेऽक्षे
    प्रतितिष्ठ । ॐ ठङ्कार चन्द्ररूपाष्टाविंशेऽक्षे प्रतितिष्ठ । ॐ डङ्कार गरुडात्मक विषघ्न शोभनैकोनत्रिंशेऽक्षे
    प्रतितिष्ठ । ॐ ढङ्कार सर्वसंपत्प्रद सुभग त्रिंशेऽक्षे प्रतितिष्ठ । ॐ णङ्कार सर्वसिद्धिप्रद मोहकरैकत्रिंशेऽक्षे
    प्रतितिष्ठ । ॐ तङ्कार धनधान्यादिसंपत्प्रद प्रसन्न द्वात्रिंशेऽक्षे प्रतितिष्ठ । ॐ थङ्कार धर्मप्राप्तिकर
    निर्मल त्रयस्त्रिंशेऽक्षे प्रतितिष्ठ । ॐ दङ्कार पुष्टिवृद्धिकर प्रियदर्शन चतुस्त्रिंशेऽक्षे प्रतितिष्ठ
    । ॐ धङ्कार विषज्वरनिघ्न विपुल पञ्चत्रिंशेऽक्षे प्रतितिष्ठ । ॐ नङ्कार भुक्तिमुक्तिप्रद शान्त षट्त्रिंशेऽक्षे
    प्रतितिष्ठ । ॐ पङ्कार विषविघ्ननाशन भव्य सप्तत्रिंशेऽक्षे प्रतितिष्ठ । ॐ फङ्काराणिमादिसिद्धिप्रद ज्योतीरूपाष्टत्रिंशेऽक्षे
    प्रतितिष्ठ । ॐ बङ्कार सर्वदोषहर शोभनैकोनचत्वारिंशेऽक्षे प्रतितिष्ठ । ॐ भङ्कार भूतप्रशान्तिकर भयानक
    चत्वारिंशेऽक्षे प्रतितिष्ठ । ॐ मङ्कार विद्वेषिमोहनकरैकचत्वारिंशेऽक्षे प्रतितिष्ठ । ॐ यङ्कार सर्वव्यापक
    पावन द्विचत्वारिंशेऽक्षे प्रतितिष्ठ । ॐ रङ्कार दाहकर विकृत त्रिचत्वारिंशेऽक्षे प्रतितिष्ठ । ॐ लङ्कार
    विश्वंभर भासुर चतुश्चत्वारिंशेऽक्षे प्रतितिष्ठ । ॐ वङ्कार सर्वाप्यायनकर निर्मल पञ्चचत्वारिंशेऽक्षे
    प्रतितिष्ठ । ॐ शङ्कार सर्वफलप्रद पवित्र षट्चत्वारिंशेऽक्षे प्रतितिष्ठ । ॐ षङ्कार धर्मार्थकामद धवल
    सप्तचत्वारिंशेऽक्षे प्रतितिष्ठ । ॐ सङ्कार सर्वकारण सार्ववर्णिकाष्टचत्वारिंशेऽक्षे प्रतितिष्ठ । ॐ हङ्कार
    सर्ववाङ्मय निर्मलैकोनपञ्चाशदक्षे प्रतितिष्ठ । ॐ ळङ्कार सर्वशक्तिप्रद प्रधान पञ्चाशदक्षे प्रतितिष्ठ
    । ॐ क्षङ्कार परापरतत्त्वज्ञापक परंज्योतीरूप शिखामणौ प्रतितिष्ठ । अथोवाच ये देवाः पृथिवीपदस्तेभ्यो
    नमो भगवन्तोऽनुमदन्तु शोभायै पितरोऽनुमदन्तु शोभायै ज्ञानमयीमक्षमालिकाम् । अथोवाच ये देवा अन्तरिक्षसदस्तेभ्यः
    ॐ नमो भगवन्तोऽनुमदन्तु शोभायै पितरोऽनुमदन्तु शोभायैज्ञानमयीमक्षमालिकाम् । अथोवाच ये देवा दिविषदस्तेभ्यो
    नमो भगवन्तोऽनुमदन्तु शोभायै पितरोऽनुमदन्तु शोभायै ज्ञानमयीमक्षमालिकाम् । अथोवाच ये मन्त्रा या विद्यास्तेभ्यो
    नमस्ताभ्यश्चोन्नमस्तच्छक्तिरस्याः प्रतिष्ठापयति । अथोवाच ये ब्रह्मविष्णुरुद्रास्तेभ्यः सगुणेभ्य ॐ
    नमस्तद्वीर्यमस्याः प्रतिष्ठापयति । अथोवाच ये साङ्ख्यादितत्त्वभेदास्तेभ्यो नमो वर्तध्वं विरोधेऽनुवर्तध्वम्
    । अथोवाच ये शैवा वैष्णवाः शाक्ताः शतसहस्रशस्तेभ्यो नमोनमो भगवन्तोऽनुमदन्त्वनुगृह्णन्तु । अथोवाच याश्च
    मृत्योः प्राणवत्यस्ताभ्यो नमोनमस्तेनैतं मृडयत मृडयत । पुनरेतस्यां सर्वात्मकत्वं भावयित्वा भावेन पूर्वमालिकामुत्पाद्यारभ्य
    तन्मयीं महोपहारैरुपहृत्य आदिक्षान्तैरक्षरैरक्षमालामष्टोत्तरशतं स्पृशेत् । अथ पुनरुत्थाप्य प्रदक्षिणीकृत्यों
    नमस्ते भगवति मन्त्रमातृकेऽक्षमाले सर्ववशङ्कर्योंनमस्ते भगवति मन्त्रमातृकेऽक्षमालिके शेषस्तम्भिन्यों
    नमस्ते भगवति मन्त्रमातृकेऽक्षमाले उच्चाटन्योंनमस्ते भगवति मन्त्रमातृकेऽक्षमाले विश्वामृत्यो मृत्युञ्जयस्वरूपिणि
    सकललोकोद्दीपिनि सकललोकरक्षाधिके सकललोकोज्जीविके सकललोकोत्पादिके दिवाप्रवर्तिके रात्रिप्रवर्तिके नद्यन्तरं
    यासि देशान्तरं यासि द्वीपान्तरं यासि लोकान्तरं यासि सर्वदा स्फुरसि सर्वहृदि वाससि । नमस्ते परारूपे
    नमस्ते पश्यन्तीरूपे नमस्ते मध्यमारूपे नमस्ते वैखरीरूपे सर्वतत्त्वात्मिके सर्वविद्यात्मिके सर्वशक्त्यात्मिके
    सर्वदेवात्मिके वसिष्ठेन मुनिनाराधिते विश्वामित्रेण मुनिनोपजीव्यमाने नमस्ते नमस्ते । चतूरात्र
