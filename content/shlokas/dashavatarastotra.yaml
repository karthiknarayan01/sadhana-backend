id: dashavatarastotra
category: stotram
name:
  english: dashavatarastotra
  devanagari: दशावतारस्तोत्र
content:
  english: dashavatarastotram namo'stu narayanamandiraya namo'stu harayanakandharaya | namo'stu matsyaya
    layabdhigaya namo'stu kurmaya payobdhigaya | namo varahaya dharadharaya namo nrisimhaya paratparaya
    || 2|| namo'stu shakrashraya
  devanagari: दशावतारस्तोत्रम् नमोऽस्तु नारायणमन्दिराय नमोऽस्तु हारायणकन्धराय । नमोऽस्तु मत्स्याय लयाब्धिगाय
    नमोऽस्तु कूर्माय पयोब्धिगाय । नमो वराहाय धराधराय नमो नृसिंहाय परात्पराय ॥ २॥ नमोऽस्तु शक्राश्रय
meaning: {}
