id: suryakritamnarayanastotram
category: stotram
name:
  english: suryakritamnarayanastotram
  devanagari: सूर्यकृतंनारायणस्तोत्रम्
content:
  english: ringa ayaso bhanti varshane | ishanishu tadisheshu yasya bhrajyo'nvayam yayuh || 30|| namo
    bhrajishnave tasmai gomate goprasarine | hrittamodravine divyasaya devaya te namah || 31|| prakashayitrisamraje
    svaprakashakrine namah | namo bhavittivipraya jnanaprabodhasurine || 32|| namah shranavidhataste nama
    atmasadatmane | namo rajishnave divyan saptabhajanudayine || 33|| namo bhaumaya raktaya namo divyaya
    vidyute | namah suryaya cograya namo hiranmayaya te || 34|| namah khaneyasaddhemne nama udaryatejase
    | nama udupabhavaya namo yavatprabhatmane || 35|| namah karyasvarupaya namah karanarupine | hiranmayaya
    devaya brahmane paramatmane || 36|| tvam srashta tvam poshayita samharta'pi tvameva vai | tvameva
    paramam tejastejasvinam drigagrajam || 37|| sada tejahpradanena raksha mam parameshvara | cakshushmantashca
    yavanto bhajishyanti prabhaprabhum || 38|| tvameva bhagavan bhavan prabhavaॅmshca prabhasvarah | tvameva
    netravan trata''matrata ca'vanishvarah || 39|| mahashcakshuh svargacakshurbhuvashcakshustvameva hi
    | bhaumacakshuh sarvacakshushcakshusham cakshushe namah || 40|| om om om bhurbhuvah svastat om tatsaviturvarenyam
    | bhargo devasya dhimahi dhiyo yo nah pracodayat || 41|| iti mantram tu yah ko'pi japeddhyayedatandritah
    | hiranmayah paro devah sakshadyati tadagratah || 42|| ayutam japanattasya svayam suryo mahanprabhuh
    | varado bhavate tasya bhagavattvam dadati ca || 43|| divyam karoti taccakshurudghatayati cantaram
    | uttejayati catmanam sampadayati brahma tat || 44|| tasmaddhyanaparo bhutva japetsvashreyase sada
    | stotram suryakritam svopastyartham hiranmayasya vai || 45|| iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 42
  devanagari: ृङ्गा अयासो भान्ति वर्षणे । ईशनीषु तदीशेषु यस्य भ्राज्योऽन्वयं ययुः ॥ ३०॥ नमो भ्राजिष्णवे
    तस्मै गोमते गोप्रसारिणे । हृत्तमोद्राविणे दिव्यासाय देवाय ते नमः ॥ ३१॥ प्रकाशयितृसंराजे स्वप्रकाशकृणे
    नमः । नमो भावित्तिविप्राय ज्ञानप्रबोधसूरिणे ॥ ३२॥ नमः श्राणविधातस्ते नम आत्मसदात्मने । नमो राजिष्णवे
    दीव्यन् सप्तभाजनुदायिने ॥ ३३॥ नमो भौमाय रक्ताय नमो दिव्याय विद्युते । नमः सूर्याय चोग्राय नमो हिरण्मयाय
    ते ॥ ३४॥ नमः खानेयसद्धेम्ने नम उदर्यतेजसे । नम उडुपभावाय नमो यावत्प्रभात्मने ॥ ३५॥ नमः कार्यस्वरूपाय
    नमः कारणरूपिणे । हिरण्मयाय देवाय ब्रह्मणे परमात्मने ॥ ३६॥ त्वं स्रष्टा त्वं पोषयिता संहर्ताऽपि त्वमेव
    वै । त्वमेव परमं तेजस्तेजस्विनां दृगग्रजम् ॥ ३७॥ सदा तेजःप्रदानेन रक्ष मां परमेश्वर । चक्षुष्मन्तश्च
    यावन्तो भजिष्यन्ति प्रभाप्रभुम् ॥ ३८॥ त्वमेव भगवान् भावान् प्रभावाॅंश्च प्रभास्वरः । त्वमेव नेत्रवान्
    त्राताऽऽमत्राता चाऽवनीश्वरः ॥ ३९॥ महश्चक्षुः स्वर्गचक्षुर्भुवश्चक्षुस्त्वमेव हि । भौमचक्षुः सर्वचक्षुश्चक्षुषां
    चक्षुषे नमः ॥ ४०॥ ॐ ॐ ॐ भूर्भुवः स्वस्तत् ॐ तत्सवितुर्वरेण्यम् । भर्गो देवस्य धीमहि धियो यो नः प्रचोदयात्
    ॥ ४१॥ इति मन्त्रं तु यः कोऽपि जपेद्ध्यायेदतन्द्रितः । हिरण्मयः परो देवः साक्षाद्याति तदग्रतः ॥ ४२॥
    अयुतं जपनात्तस्य स्वयं सूर्यो महान्प्रभुः । वरदो भवते तस्य भगवत्त्वं ददाति च ॥ ४३॥ दिव्यं करोति तच्चक्षुरुद्घाटयति
    चान्तरम् । उत्तेजयति चात्मानं सम्पादयति ब्रह्म तत् ॥ ४४॥ तस्माद्ध्यानपरो भूत्वा जपेत्स्वश्रेयसे सदा
    । स्तोत्रं सूर्यकृतं स्वोपास्त्यर्थं हिरण्मयस्य वै ॥ ४५॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने
    ४२
