id: shridharakavacastotram
category: kavacha
name:
  english: shridharakavacastotram
  devanagari: श्रीधरकवचस्तोत्रम्
content:
  english: dhyayed brahmasanatanam guruvaram mokshashriyadharinam brahmanandarasarnavam sukhadhanam bhakteshtakalpadrumam
    | ajnanandhanivaranam gunanidhim bhaktapriyam sundaram jivanam taranarthameva satatam jnanapradam
    shridharam || iti dhyanam | shridharah patu murdhanam sahasrarena shobhitah | bhalam patu gururdevah
    candramandalamanditam || 1|| akshaupatvakshayah shriman acyutanantarupakah | bhumadhyam patu sarvajnah
    mokshanandasvarupinah || 2|| onkaratmashrutih patu shrutisiddhantagocarah | nasikam patu vishvatma
    vishvatitah paratmanah || 3|| mukham muktikarah patu bhaktakairavacandramah | cibuka cinmayah patu
    cidanandasvayamprabhah || 4|| jivham vedanidhih patu vedavedantagocarah | dantanpatu danavari dharmarakshanadakshakah
    || 5|| oshtham patu parivrajah vairagyajnanasagarah | kapolam shrikarah patu kamalambatanobhavah ||
    6|| kantham dandadharah patu jnanadandasushobhita || skandhau candrananah patu candrakotiprakashakah
    || 7|| bhumanandarbhujau patu brahmanandapradayakah | karo karunikah patu kamandaludharah prabhuh
    || 8|| vakshasthalam harih patu sarvapapapranashanah | hridayam shriguruh patu mokshashridharanadipah
    || 9|| udaram varadah patu brahmandodaravyapakah | nabhim patu narakaro namarupavivarjitah || 10||
    guhyam patu guhyarupah hridayabjanivasinah | uru guruvarah patu uhaposhavivarjitah || 11|| janghe
    jnananidhih patu jnanamatraikanirmalah | muladharam guruh patu maya'vidyavinashakah || 12|| padau
    patu pujyapadah papavidhvamsarupakah | carma carmambarah patu carukashayabhushanah || 13|| angulindeshikah
    patu mokshapani gurottamah | raktam bhaktapriyah patu bhaktanugrahashilakah || 14 mamsam mimamsakah
    patu matrivatsalavatsitah | majjantu ajarah patu janmakarmanivartakah || 15|| asthini sthiradhih patu
    kutasthamacaladhruvah | medo vedantinah patu medhabuddhipradipakah || 16|| shukra sukhakarah patu
    sukhashantipracodakah | mano buddhimahankaram rakshayedantaratmanah || 17|| karmendriyani patvishah
    kaivalyasukhadeshvarah | jnanendriyanyajah patu avyajakarunakarah || 18|| prananpatu pradhanajno puranapurushottamah
    | savangam patu sarvatma saccidanandavigrahah || 19|| griharamadhanakshetraputradin raksha me dvibhuh
    | bhumyadin patu dharmajnah dharmoddharavatarakah || 20|| atmanandah sukham patu svanandamritatriptakah
    | duhkhapatu nijanandah brahmanandasvarupakah || 12|| pracyam patu parabrahma patvagneyam paratmanah
    | yamyam dharmatmakah patu nairrityam patu vishvajit || 22|| praticyam purushah patu vayavyam patu
    pranadah | kauberyam bhagavanpatu patveshanyam sadashivah ||| 53|| urdhvadhodeshakah patu trimurtisvasvarupakah
    | pancabhutatmakah patu pancabhutani bhititah || 24|| diva cidambarah patu ratrau candranibhananah
    | yaksharakshasabhutadyat patu mam shridhareshvarah || 25|| sarvajnah patu sarvatra sarvamangaladayakah
    | shadbhavavikritim patu shadurmirahitah parah || 26|| shannamarinam vargam ca patu jnaneshvarah puman
    | roganniramayah patu nityashuddhaniranjanah || 27|| dvandvaduhkhadvibhuh patu dvandvatityekamadvayah
    | vyaghracoradibhitishca patu mam sarvarupakah || 28|| shridharanugrahaduktam maya kavacamuttamam
    | samsaramayataptanam shashvatam mokshadam shubham || 29|| yah sada dharayet bhaktya stotram kavacamuttamam
    | na tasya jayate kvapi ashubham gurvanugrahat || 30|| dharmarthakamamokshanam idamevaparayanam |
    putramitrakalatradi sarvasantoshasadhakam || 31|| trisandhyam pathatiyastu shraddhabhaktyamatandritah
    | sarvarogah pranashyanti sarvabadhavinashyati || 32|| bahuna kimihoktena yadyanmanasivartate | shriguronugrahadeva
    tattatsarvam bhavediha || 33|| iti shrimat paramahamsa paravrajakacarya shrisaccidanandasvamina viracitam
    bhagavan sadguru shri shridharakavacastotram sampurnam || shridhara sandesha
  devanagari: ध्यायेद् ब्रह्मसनातनं गुरुवरं मोक्षश्रियाधारिणं ब्रह्मानन्दरसार्णवं सुखधनं भक्तेष्टकल्पद्रुमम्
    । अज्ञानान्धनिवारणं गुणनिधिं भक्तप्रियं सुन्दरं जीवानां तरणार्थमेव सततं ज्ञानप्रदं श्रीधरम् ॥ इति
    ध्यानम् । श्रीधरः पातु मूर्धानं सहस्रारेण शोभितः । भालं पातु गुरुर्देवः चन्द्रमण्डलमण्डितम् ॥ १॥ अक्षौपात्वक्षयः
    श्रीमान् अच्युतानन्तरूपकः । भूमध्यं पातु सर्वज्ञः मोक्षानन्दस्वरूपिणः ॥ २॥ ओङ्कारात्मश्रुतिः पातु
    श्रुतिसिद्धान्तगोचरः । नासिकां पातु विश्वात्मा विश्वातीतः परात्मनः ॥ ३॥ मुखं मुक्तिकरः पातु भक्तकैरवचन्द्रमाः
    । चिबुक चिन्मयः पातु चिदानन्दस्वयंप्रभः ॥ ४॥ जिव्हां वेदनिधिः पातु वेदवेदान्तगोचरः । दन्तान्पातु दानवारि
    धर्मरक्षणदक्षकः ॥ ५॥ ओष्ठं पातु परिव्राजः वैराग्यज्ञानसागरः । कपोलं श्रीकरः पातु कमलाम्बातनोभवः ॥
    ६॥ कण्ठं दण्डधरः पातु ज्ञानदण्डसुशोभित ॥ स्कन्धौ चन्द्राननः पातु चन्द्रकोटिप्रकाशकः ॥ ७॥ भूमानन्दर्भुजौ
    पातु ब्रह्मानन्दप्रदायकः । करो कारुणिकः पातु कमण्डलुधरः प्रभुः ॥ ८॥ वक्षस्थलं हरिः पातु सर्वपापप्रणाशनः
    । हृदयं श्रीगुरुः पातु मोक्षश्रीधारणादीपः ॥ ९॥ उदरं वरदः पातु ब्रह्माण्डोदरव्यापकः । नाभिं पातु नराकारो
    नामरूपविवर्जितः ॥ १०॥ गुह्यं पातु गुह्यरूपः हृदयाब्जनिवासिनः । ऊरू गुरुवरः पातु ऊहापोषविवर्जितः ॥
    ११॥ जङ्घे ज्ञाननिधिः पातु ज्ञानमात्रैकनिर्मलः । मूलाधारं गुरुः पातु मायाऽविद्याविनाशकः ॥ १२॥ पादौ
    पातु पूज्यपादः पापविध्वंसरूपकः । चर्म चर्माम्बरः पातु चारुकाषायभूषणः ॥ १३॥ अङ्गुलीन्देशिकः पातु मोक्षपाणि
    गुरोत्तमः । रक्तं भक्तप्रियः पातु भक्तानुग्रहशीलकः ॥ १४ मांसं मीमांसकः पातु मातृवत्सलवत्सितः । मज्जान्तु
    अजरः पातु जन्मकर्मनिवर्तकः ॥ १५॥ अस्थीनि स्थिरधीः पातु कूटस्थमचलध्रुवः । मेदो वेदान्तिनः पातु मेधाबुद्धिप्रदीपकः
    ॥ १६॥ शुक्र सुखकरः पातु सुखशान्तिप्रचोदकः । मनो बुद्धिमहङ्कारं रक्षयेदन्तरात्मनः ॥ १७॥ कर्मेन्द्रियाणि
    पात्वीशः कैवल्यसुखदेश्वरः । ज्ञानेन्द्रियाण्यजः पातु अव्याजकरुणाकरः ॥ १८॥ प्राणान्पातु प्रधानज्ञो
    पुराणपुरुषोत्तमः । सवाङ्गं पातु सर्वात्मा सच्चिदानन्दविग्रहः ॥ १९॥ गृहारामधनक्षेत्रपुत्रादीन् रक्ष
    मे द्विभुः । भूम्यादीन् पातु धर्मज्ञः धर्मोद्धारावतारकः ॥ २०॥ आत्मानन्दः सुखं पातु स्वानन्दामृततृप्तकः
    । दुःखापातु निजानन्दः ब्रह्मानन्दस्वरूपकः ॥ १२॥ प्राच्यां पातु परब्रह्म पात्वाग्नेयां परात्मनः । याम्यां
    धर्मात्मकः पातु नैरृत्यां पातु विश्वजित् ॥ २२॥ प्रतीच्यां पुरुषः पातु वायव्यां पातु प्राणदः । कौबेर्यां
    भगवान्पातु पात्वेशान्यां सदाशिवः ॥। ५३॥ ऊर्ध्वाधोदेशकः पातु त्रिमूर्तिस्वस्वरूपकः । पञ्चभूतात्मकः
    पातु पञ्चभूतानि भीतितः ॥ २४॥ दिवा चिदम्बरः पातु रात्रौ चन्द्रनिभाननः । यक्षराक्षसभूताद्यात् पातु मां
    श्रीधरेश्वरः ॥ २५॥ सर्वज्ञः पातु सर्वत्र सर्वमङ्गलदायकः । षड्भावविकृतिं पातु षडूर्मिरहितः परः ॥ २६॥
    षण्णामरीणां वर्गं च पातु ज्ञानेश्वरः पुमान् । रोगान्निरामयः पातु नित्यशुद्धनिरञ्जनः ॥ २७॥ द्वन्द्वदुःखाद्विभुः
    पातु द्वन्द्वातीत्येकमद्वयः । व्याघ्रचोरादिभीतीश्च पातु मां सर्वरूपकः ॥ २८॥ श्रीधरानुग्रहादुक्तं मया
    कवचमुत्तमम् । संसारामयतप्तानां शाश्वतं मोक्षदं शुभम् ॥ २९॥ यः सदा धारयेत् भक्त्या स्तोत्रं कवचमुत्तमम्
    । न तस्य जायते क्वापि अशुभं गुर्वनुग्रहात् ॥ ३०॥ धर्मार्थकाममोक्षाणां इदमेवपरायणम् । पुत्रमित्रकलत्रादि
    सर्वसन्तोषसाधकम् ॥ ३१॥ त्रिसन्ध्यां पठतीयस्तु श्रद्धाभक्त्यामतन्द्रितः । सर्वरोगाः प्रणश्यन्ति सर्वाबाधाविनश्यति
    ॥ ३२॥ बहुना किमिहोक्तेन यद्यन्मनसिवर्तते । श्रीगुरोनुग्रहादेव तत्तत्सर्वं भवेदिह ॥ ३३॥ इति श्रीमत्
    परमहंस परव्राजकाचार्य श्रीसच्चिदानन्दस्वामिना विरचितं भगवान् सद्गुरु श्री श्रीधरकवचस्तोत्रं सम्पूर्णम्
    ॥ श्रीधर सन्देश
