  devanagari: अर्धनारीश्वरसहस्रनामस्तोत्रम् ॐ । अखण्डमण्डलाकारश्चाखिलाण्डैकनायिका । अमरेन्द्रार्चितपदश्चामरारिनिषूदिनी
    ॥ १॥ अनादिनिधनोऽनन्तकोटिसूर्यसमप्रभा । अनन्तोऽनन्तभूतेशी चाजितोऽमितविक्रमा ॥ २॥ अविनाशपदस्थेमा चावाङ्मनसगोचरा
    । अनन्तकोटिकल्याणगुणोऽनन्तगुणाश्रया ॥ ३॥ अघहा चाघसंहर्त्री चावेद्योऽदितिवन्दिता । अपवर्गप्रदाता चैवाखिलाभीष्टदायिनी
    ॥ ४॥ आदिमध्यान्तरहित आदित्यायुतभासुरा । आगमाभ्यर्चितपद आम्नायार्थविलासिनी ॥ ५॥ आखण्डलमुखस्तुत्य आत्मानन्दविधायिनी
    । आशापालसमाराध्य आधिव्याधिविनाशिनी ॥ ६॥ आपदद्रीन्द्रदम्भोलिरापन्नार्तिप्रभञ्जना । आदित्यमण्डलान्तःस्थ
    आदिशक्तिस्वरूपिणी ॥ ७॥ आशावराम्बरधर आशान्तैश्वर्यदायिनी । आनन्दलहरीपूर्ण आनन्दोल्लासशालिनी ॥ ८॥ आचान्तदुरितस्तोम
    आधाराधेयरूपिणी । आध्यात्मिकाधिशमन आगोवृन्दनिवारिणी ॥ ९॥ इन्दिरापतिपूज्याङ्घ्रिरिन्द्रादिस्तुतवैभवा
    । इभचर्माम्बरधर इभकुम्भनिभस्तनी ॥ १०॥ इभवक्त्रमहासेनजनकश्चेष्टदायिनी । इष्टिघ्न इष्टिकर्त्री चैवेयत्तातीतविक्रमः
    ॥ ११॥ इच्छाज्ञानक्रियाशक्तिरिच्छाकलितविग्रहः । इन्दिरा भारती दत्तहस्तयुग्मोल्लसत्करा ॥ १२॥ इन्द्रयज्ञसुखाराध्य
    इडापिङ्गलमध्यगा । इहामुत्रसुखाराध्य इन्दुबिम्बसमानना ॥ १३॥ इनेन्दुवह्निनयन इन्दुचूडकुटुम्बिनी । इन्द्रियादिगुणातीत
    इन्द्राणीस्तुतिमोदिता ॥ १४॥ ईषत्स्मितमुखाम्भोज ईश्वरार्धशरीरिणी । ईश्वरश्चेशवनिता ईड्य ईशित्वसिद्धिदा
    ॥ १५॥ ईशानादिब्रह्मरूप ईहाधिकफलप्रदा । ईकारार्थरहस्यज्ञ ईकारार्थस्वरूपिणी ॥ १६॥ ईतिबाधाप्रशमन ईशमायाविलासिनी
    । ईड्यस्तयेशजीवातुरीषणात्यक्तचेतनः ॥ १७॥ तथेदृगित्यसंवेधा ईषणोर्जितदानवः । ईशित्री चेप्सितकर ईश्वरत्वविधायिनी
    ॥ १८॥ उक्षेन्द्रवाहनारूढ उत्पत्तिलयवर्जिता । उन्नतैश्वर्यसम्पन्न उत्सेधपददायिनी ॥ १९॥ उषापतिसमाराध्य
    उषाकोटिसमर्चिता । उषर्बुधाक्षिनिर्दग्धानङ्गश्चोरुपराक्रमा ॥ २०॥ उग्र उग्रप्रतापा चैवोमापतिरुदारधीः
    । उद्यद्भानुप्रतीकाश उन्नतस्तनमण्डला ॥ २१॥ उग्रदानवसंहर्ता चोत्सवप्रियमानसा । उष्णिक्छन्दःस्वरूपाढ्यश्चोरगाद्रिनिवासिनी
    ॥ २२॥ उदग्रश्रीरुपनिषदुद्यानचरकोकिला । ऊर्वशीगीतसन्तुष्ट ऊर्ध्वाम्नायनिवासिनी ॥ २३॥ ऊर्ध्वरेता ऊर्ध्वगतिरूनाधिकविवर्जितः
    । ऊर्ध्वाण्डजन्मधरिणी ऊर्जिताखिलशत्रुकः ॥ २४॥ ऊष्माग्निकणसन्तप्तदिनेशाग्नीन्दुभालका । ऊचिरूचिष्मतीचोर्म्या
    ऊरुदेशान्तमार्दवा ॥ २५॥ ऊरव्योत्तमवेषश्च ऊर्ध्वयोगातिगामिनी । ऊनवाच्य ऊनसाम्या ऊर्ध्वताण्डवपण्डितः
    ॥ २६॥ ऊर्ध्वलास्यसहाया च ऊरीकृतसमस्तदः । ऊर्जस्वन्मणिमालाढ्या ऋग्यजुःसामगायनः ॥ २७॥ ऋभुक्षास्तुतपादाब्जा
    ऋषिपत्नीसमर्चितः । ऋषिराजर्षिसंसेव्या ऋषिरृणविमोचिनी ॥ २८॥ ऋग्यजुःसामसारज्ञः ऋचां प्राचीति सन्नुता
    । रुद्राक्षमालिकाभूषो रुद्राणीकोटिसेविता ॥ २९॥ रुद्रकोटिजितामित्रः ऋतुशोणाम्बरावृता । ऋतुलक्ष्मीसहस्रेश
    ऋक्षराजसमानना ॥ ३०॥ ऋणत्रयविमुक्तश्च ऋणपातकनाशिनी । ऋगादिवेदविनुतः ऋग्वेदार्यस्वरूपिणी ॥ ३१॥ ऋतुनाथसखारातिः
    ऋतुकालमहोज्ज्वला । क्रूरपापपरीहारः क्रूरलोकपराङ्मुखी ॥ ३२॥ रूपनिर्जितकन्दर्पो रूपलावण्यवारिधिः । रूप्याचलनिवासश्च
    रूपयौवनशालिनी ॥ ३३॥ भ्रूणयोगिगणाराध्यो भ्रूणहार्तिविनाशिनी । भ्रूभङ्गविलसद्वक्त्रा भ्रूजितेन्द्रशरासना
    ॥ ३४॥ लुप्तकन्दर्पगात्रश्च श्लिष्टकान्तकलेवरा । लुण्ठितारिपुरश्चैव क्लृप्तवृत्तिसुराङ्गना ॥ ३५॥ लब्धभक्तिजनप्रेयान्
    लब्धभोगविडम्बिनी । लुलायवाहनारातिः लुलायासुरमर्दिनी ॥ ३६॥ लुब्धभस्माङ्गरागाढ्यः क्लृप्ताकल्पसमुज्ज्वला
    । लूनब्रह्मशिरालीढमदिरामोदविह्वला ॥ ३७॥ क्लीब्यः क्लीङ्कारनिलया श्लाघ्यः श्लाघ्यगुणाश्रया । म्लानेतरमुखाम्भोजो
    ब्लूम्बीजार्थस्वरूपिणी ॥ ३८॥ एणारचूड एकाक्षर्यैक एकान्तवासिनी । एषणारहितश्चैणलोचना चैधितोत्सवः ॥ ३९॥
    एकान्तपूजनप्रीता एकान्तध्यानतत्परः । एकभोगा एकसौख्यः एकैश्वर्यप्रदायिनी ॥ ४०॥ एकभक्त एकगुणा एकान्ताध्वरदीक्षितः
    । एकवीरप्रभापूरनिमज्जत्प्रियमानसा ॥ ४१॥ एनःकान्तारदावाग्निरेकप्राभवशालिनी । एकसिद्ध एकक्लृप्तिः एकसृष्टिस्तथैधिता
    ॥ ४२॥ एलाकर्पूरताम्बूलप्रीत एकान्तपूजिता । एकविद्य एककान्ता एकभक्तिमदर्चितः ॥ ४३॥ ऐङ्कारबीजमात्राढ्या
    ऐरावतपतिस्तुतः । ऐरावतसमारूढा ऐन्द्रलोकसमाश्रयः ॥ ४४॥ ऐङ्कारशुक्तिकामुक्तामणिरैरावणार्चितः । ऐङ्कारादर्शबिम्बश्रीरैङ्कारप्रतिभूमिकः
    ॥ ४५॥ ऐङ्कारमन्त्रसर्वस्वं ऐश्वर्याधिकशोभनः । ऐन्द्रलोकविधात्री च ऐश्वर्याष्टकदायकः ॥ ४६॥ ऐं ऐम्पदजपप्रीत
    ऐङ्कारमनुजापिका । ओङ्काररूप ओङ्कारनिलया ओम्पदाभिधः ॥ ४७॥ ओजोवती तथौजस्वी ओतप्रोतविवर्जिता । ओषधीशार्धचूडश्च
    ओषधीफलदायिनी ॥ ४८॥ ओड्डामरेश्वराराध्य ओड्याणाभरणोज्ज्वला । ॐ तद्ब्रह्मपदस्थोमा ओड्याणपीठवासिनी ॥ ४९॥
    ओमित्येकाक्षरपद ओषधीशसमानना । ओघीकृतमहातेजा ओघत्रयविलासिनी ॥ ५०॥ ओङ्कारमूलिकाकन्द ओकारा वालवल्लरी
    । ओङ्कारगिरिहर्यृक्ष ओन्नमस्कारवाच्यका ॥ ५१॥ ओमापोज्योतिरादित्य ओड्डीशानन्दरूपिणी । औपम्यरहित औदार्यशालिन्यौपद्रवापहः
    ॥ ५२॥ औङ्कार्यौर्वानलरुचिरौन्नत्यपददायिनी । औपासनपरश्चौपनिषदर्थस्वरूपिणी ॥ ५३॥ अम्बिकापतिरम्बाच अन्तर्याम्यन्तरात्मिका
    । अण्डकोटिसहस्रेशश्चाण्डाद्बाह्यनिकेतना ॥ ५४॥ अन्धकासुरसंहारी चान्तस्तिमिरभेदिनी । अन्तकारिरनन्तश्रीरनन्तोऽनन्तपूजिता
    ॥ ५५॥ अञ्जनातनयाराध्यश्चाञ्जनार्थविधायिनी । अङ्गीकृतमहाक्ष्वेलश्चाङ्कारोपितषण्मुखा ॥ ५६॥ अंशुमानंशुमत्सेव्या
    चान्तकारारातिरङ्गना । अष्टविद्येश्वराराध्यश्चाष्टसिद्धिविधायिनी ॥ ५७॥ अष्टमूर्तिरष्टलक्ष्मीसेविताङ्घ्रिसरोरुहा
    । अष्टाविंशागमस्तुत्यश्चाष्टत्रिंशत्कलात्मिका ॥ ५८॥ अष्टदिक्पालसेव्याङ्घ्रिरष्टाष्टककलात्मिका । अष्टादशपुराणज्ञश्चाष्टादशपुरीश्वरी
    ॥ ५९॥ अष्टदिग्गजसंवीतश्चाष्टवर्णविलासिनी । अष्टापदाद्रिकोदण्डश्चाष्टैश्वर्यप्रदायिनी ॥ ६०॥ अष्टभैरवसंवीतश्चाष्टद्वयवयोज्ज्वला
    । अष्टाक्षरीजपपरश्चाष्टवाग्देवतावृता ॥ ६१॥ अर्धादिशिखरावासश्चार्धनारीश्वरप्रिया । अष्टाङ्गयोगनिरतश्चाष्टशक्तिपरीवृता
    ॥ ६२॥ अष्टापदमहापीठ अष्टापदगिरिस्थिता । आश्चर्यशील आश्चर्यनिलयाऽऽश्चर्य एव च ॥ ६३॥ आश्चर्यजनिराश्चर्यनिष्ठ
    आश्चर्यदायिनी । आर्तिघ्न आर्तिसंहर्त्री आकस्मिकमहोज्ज्वलः ॥ ६४॥ कल्याणीकलिताकल्पः कल्याणाचलवासिनी
    । कमनीयगुणावासः कमलाक्षसहोदरी ॥ ६५॥ कञ्जभूजनकः कञ्जनेत्री कर्मफलप्रदः । कर्मकर्त्रीकालकालः कन्दर्पावहदर्शना
    ॥ ६६॥ कन्दर्पकोटिलावण्यः कमलाक्षी कपालभृत् । कात्यायनी कालकालः काव्यालापविनोदिनी ॥ ६७॥ काट्यः कपर्दिसुखदा
    कैलासशिखरालयः । कामेश्वरालिङ्गिताङ्गी कामदः कलिनाशिनी ॥ ६८॥ कर्मी कामकला चैव कामकेलिविनोदनः । कदम्बवाटीमध्यस्था
    कदम्बवननायकः ॥ ६९॥ खट्वाङ्गादिप्रहरणा खड्गखेटकधारकः । खगवाहद्वयादृश्या खगराजपराक्रमः ॥ ७०॥ खगानेकप्रभा
    खेलाक्लृप्तब्रह्माण्डमण्डलः । खेदध्नखेचरीयोगदायिनी खेचरेश्वरः ॥ ७१॥ खञ्जरीटसमच्छाया खललोकपराङ्मुखः
    । खश्यामा खगतिस्तुत्यः खातपातविनाशिनी ॥ ७२॥ खमूर्धजः खगगतिः खगः खगविधायिनी । खड्गरावणपूज्याङ्घ्रिः
    खगचारुपयोधरा ॥ ७३॥ खण्डिताशेषपाषण्डः खिन्नाभीष्टप्रदायिनी । गङ्गाधरो गिरिसुता गजास्यासुरसूदनः ॥ ७४॥
    गम्भीरा गगनाकारो गजकुम्भनिभस्तनी । गजचर्मपरीधानो गन्धर्वकुलसेविता ॥ ७५॥ गिरीन्द्रचापो गीर्वाणसन्नुता
    गानलोलुपः । गुहेभवक्त्रजननी गुह्यकेशसखो गुरुः ॥ ७६॥ गुह्यकाराध्यचरणो गणनाथा गभीरधीः । गण्या गुरुर्गुणातीता
    गुणज्ञो गुणमातृका ॥ ७७॥ गोविन्दो गोपिकाराध्या गोपतिर्गोमती तथा । गन्धर्वरूपो गन्धर्वकन्याकोटिसमर्चिता
    ॥ ७८॥ घनो घनागमश्यामा घनप्रौढो घनस्तनी । घृणी घृणानिधिर्घ्राणो घृताचीपूज्यपादुकः ॥ ७९॥ घण्टामुखसुसंप्रीतो
    घण्टारवविनोदिनी । घनीभूतप्रभापूरो घळङ्घलितमेखला ॥ ८०॥ घनसारविलिप्ताङ्गो घनसारसवर्णिनी । घूर्णमानजगत्प्राणो
    चूर्णितारक्तलोचना ॥ ८१॥ घटोद्भवमुनिस्तुत्यो घटोद्भवकृतानतिः । घटोद्भवकृतस्नेहो घटाकारकुचद्वया ॥ ८२॥
    घोरदंष्ट्राकरालास्यो घोरघोरस्वरूपिणी । घोषपालसहस्रेशो घोषान्तःपुरचारिणी ॥ ८३॥ घोषितागमसर्वस्वो घोषिताम्नायवेदिता
    । घोरपापाटवीदावो घोरपातकनाशिनी ॥ ८४॥ धर्मादित्यप्रतीकाशो धर्मसन्तापचन्द्रिका । धर्माग्निहोत्रसुप्रीतो
    घर्माहुतिफलप्रदा ॥ ८५॥ चतुरश्रगृहावासश्चतुरङ्गबलेश्वरी । चतुश्चक्रसमाराध्यश्चतुर्वर्गफलप्रदा ॥ ८६॥
    चातुर्यशाली चतुरा चतुराननदेशिकः । चतुष्षष्टिमहादूती योगिनीगणसेविता ॥ ८७॥ चन्द्रचूडश्चन्द्रमुखी चन्द्रादित्याग्निलोचनः
    । चामीकराचलावासा चामीकरमहासनः ॥ ८८॥ चारुचामरहस्तश्री शारदापरिवीजिता । चन्द्रिकाधवलाकारश्चक्रवाकनिभस्तनी
    ॥ ८९॥ चापीकृतमहामेरुश्चापबाणलसत्करा । चक्रवालाद्रिनिलयश्चक्रवाकप्रियङ्करी ॥ ९०॥ चक्रदानरतश्चैव चक्रराजनिकेतना
    । चारुहासमुखश्चैव चारुचन्द्रकलाधरा ॥ ९१॥ चिच्छक्तिश्चिद्घनश्चैव चिन्ताशोकविवर्जिता । चित्राम्बरश्चित्रवेषा
    चित्रकृत्यश्चिदाकृतिः ॥ ९२॥ चर्माम्बरश्चक्रहस्ता चक्रपाणिर्वरप्रदः । चैतन्यकुसुमप्रीता चैतन्यश्चारुवादिनी
    ॥ ९३॥ चमूरुपाणिश्चाम्पेयनासिका चम्पकप्रियः । चञ्चलाक्षी चञ्चलात्मा चञ्चरीककुलालका ॥ ९४॥ चतुरास्यशिरश्छेत्ता
    चण्डासुरनिषूदिनी । चण्डेश्वरश्चण्डिकाच चित्रकृत्यविशारदः ॥ ९५॥ चित्ररूपा चित्तजारिः चितिश्चिन्तितदायकः
    । छन्दोग्या छन्दसाऽऽराध्यः छन्दोराशिश्छविच्छदः ॥ ९६॥ छन्दोगा छान्दसाऽऽराध्यः छत्रिणी छविपञ्जरः । छायापतिसमाराध्या
    छन्दश्छायानुसारिणी ॥ ९७॥ छन्दोऽभ्यासैकनिरतश्छन्दोगस्तुतिमोदिनी । छिन्नारिवर्गसङ्घातश्छन्नपातकनाशिनी
    ॥ ९८॥ छनदैत्यकुलच्छेत्ता छायामण्डललक्षिता । छायातपत्रसंवीतश्छनवीरपरिष्कृता ॥ ९९॥ जननी जनको जेत्री
    जित्वरो जितमत्सरा । जगदुज्जीवनकरो जराध्यान्तरविप्रभा ॥ १००॥ जगत्प्राणो जगत्कर्त्री जगदाह्लाददायकः
    । जनविश्रान्तिदात्री च जितकामो जयार्चिता ॥ १०१॥ जमदग्निसमाराध्यो जमदग्निवरप्रदा । जङ्गमाजङ्गमोत्सन्नो
    जङ्गमस्थावरात्मिका ॥ १०२॥ जितामित्रो जितक्रोधा जातिवर्णविवर्जितः । जातीचम्पकपुन्नागविलसन्नीलकुन्तला
    ॥ १०३॥ साक्षी जाग्रदवस्थायाः जगद्रक्षणजाग्रती । जम्भारिप्रमुखाराध्यो जम्भारिमणिमण्डिता ॥ १०४॥ जातरूपाचलधनुः
    जगत्प्रलयसाक्षिणी । झषादिरूपदशकसेविताङ्घ्रिसरोरुहः ॥ १०५॥ झषाक्षी झषकेत्वङ्गदाहको झम्पदाभिधा । झर्झरारावरसिको
    झल्लरीवाद्यकोविदा ॥ १०६॥ झटित्यभीष्टदाता च झलज्झलितमेखला । झषकेत्वङ्गजनको झरीकृतसुभाषणा ॥ १०७॥ ज्ञानज्ञप्तिर्ज्ञानरूपो
    ज्ञानज्ञेयविलासिनी । ज्ञानवेद्यो ज्ञानगम्या ज्ञानदो ज्ञानसिद्धिदा ॥ १०८॥ ज्ञानाधारो ज्ञानमुद्रा ज्ञानयज्ञपरायणः
    । ज्ञानदृष्टिप्रतीता च ज्ञानदृष्टिप्रकाशकः ॥ १०९॥ ज्ञाननिष्ठा ज्ञाननिधिः ज्ञातव्यार्थप्रकाशिनी । ज्ञातिहीनो
    ज्ञानयज्ञदीक्षिता ज्ञानवृद्धिदः ॥ ११०॥ ज्ञाननिष्ठजनप्रीता ज्ञानशास्त्रप्रवर्तकः । ज्ञानाम्बुनिधिपूर्णेन्दुः
    ज्ञानामृतमहोदधिः ॥ १११॥ ज्ञानज्ञेयज्ञातृरूपत्रिपुटीवीक्षणातिगा । टङ्काद्यायुधसम्पन्नः टङ्काराक्षररूपिणी
    ॥ ११२॥ टङ्काराकारचन्द्रश्रीः टङ्कारामृतवर्षिणी । डाकिनीशक्तिसंयुक्तो डाकिन्यादिपरीवृता ॥ ११३॥ डिण्डिमध्वनिसुप्रीतो
    डाडिमीकुसुमप्रभा । ढक्कावाद्यविशेषज्ञः ढकाराक्षररूपिणी ॥ ११४॥ ताम्रस्ताम्राधरा तत्त्वं तटिद्गौरी तमोनुदः
    । तरुणार्कप्रतीकाशा तरुणेन्दुशिखामणिः ॥ ११५॥ तापत्रयाग्निशमना तारकस्ताम्रलोचना । तरुणस्तरुणी चैव तपोमूर्तिस्त्रयीमयी
    ॥ ११६॥ तापसान्तरसञ्चारी तापसीवेषधारिणी । तारस्वरूपस्तारेशवदना ताण्डवप्रियः ॥ ११७॥ तन्वी ताम्रजटाजूटस्तमालश्यामलाकृतिः
    । त्र्यम्बकश्च त्रिकोणेशी त्रिमूर्तिस्त्रिपुराम्बिका ॥ ११८॥ त्रिकूटज्ञस्त्रिकूटेशी त्रिविष्टपपदप्रदः
    । त्र्यक्षरी त्रिगुणातीतस्त्रिदशश्रीसमावृता ॥ ११९॥ त्रिकालज्ञस्त्रिलोकेशी त्रेताग्निस्त्रिपदात्मिका
    । देवेशो दक्षिणामूर्तिर्दक्षयज्ञविनाशिनी ॥ १२०॥ देवदानवसेव्याङ्घ्रिर्दरस्मेरमुखाम्बुजा । दर्वीकरेन्द्रभूषाढ्यो
    दरान्दोलितलोचना ॥ १२१॥ दिगम्बरो दयामूर्तिर्देशिको दीनवत्सला । देशकालपरिज्ञाता देशोपद्रवनाशिनी ॥ १२२॥
    दीक्षितो दण्डनीतिस्था देवर्षिगणसेवितः । दहराकाशनिलया दुष्टदूरो दुरासदा ॥ १२३॥ दुःखदारिद्र्यशमनो दुराचारपराङ्मुखी
    । दिनारम्भार्ककोटिश्रीः दिव्यज्ञानसुधानिधिः ॥ १२४॥ धनेश्वरसखो धन्या धनुष्मान्धनशेवधिः । धर्माधारो
    धर्मपरा धर्मो धर्मकृदाश्रया ॥ १२५॥ धीरो धैर्यगुणोपेतो धीरोदात्तगुणोत्तरः । धीमती धैर्यनिलयो धराधरसुता
    धनी ॥ १२६॥ धर्मेतराटवीदावपावका धर्मविग्रहः । धैर्यदात्री धैर्यशीलो धौरेयजनवत्सला ॥ १२७॥ नागाचलेन्द्रनिलयो
    नागकन्यासमर्चिता । नागेन्द्रकुण्डलधरो नागराजसुपूजिता ॥ १२८॥ नागचर्मपरीधानो नागाननगुहप्रसूः । नागेन्द्रहारवलयो
    नागमाणिक्यमण्डिता ॥ १२९॥ नागेशाद्यमरस्तुत्यो नागस्त्रीकोटिसन्नुता । नागारिवाहजनको नागकुम्भनिभस्तनी
    ॥ १३०॥ नागेन्द्रशिखरोत्तंसो नागेन्द्रप्रियनन्दिनी । नारायणप्रियसखो नारसिंहवपुर्धरा ॥ १३१॥ नारदादिमुनिस्तुत्यो
    नामपारायणप्रिया । निर्जरारिगणध्वंसी नित्ययौवनशालिनी ॥ १३२॥ पञ्चब्रह्ममयः पञ्चब्रह्ममञ्चाधिशायिनी ।
    पञ्चयज्ञपरप्रीतः पञ्चकृत्यपरायणा ॥ १३३॥ पञ्चाक्षरमनुप्रीतः श्रीमत्पञ्चदशाक्षरी । पञ्चभूतनिवासश्च पञ्चपातकनाशिनी
    ॥ १३४॥ पञ्चेन्द्रियविलासश्च पञ्चबाधानिवारिणी । पञ्चपञ्चावतारश्च पञ्चाशद्वर्णरूपिणी ॥ १३५॥ पञ्चवक्त्रः
    पार्वती च पञ्चवज्रासनस्थितः । प्रपञ्चकोटिजननी प्रपञ्चोत्पत्तिवर्जितः ॥ १३६॥ पञ्चाशत्पीठनिलया परब्रह्म
    परात्परा । पञ्चयज्ञपरावासः पञ्चसङ्ख्योपचारिणी ॥ १३७॥ भालनेत्रः फलाधारा फलवान्फलरूपिणी । फुल्लारविन्दनयनः
    फुल्लेन्दीवरलोचना ॥ १३८॥ भालमध्यलसन्नेत्रदहनालीढमन्मथः । भालचन्द्रकलङ्कश्रीकस्तूरीतिलकोज्ज्वला ॥ १३९॥
    स्फटिकाद्रिसवर्णाभः स्फटिकाक्षलसत्करा । स्फारकीर्तिः स्फुरत्कान्तिः स्फुटगङ्गाजटाधरः ॥ १४०॥ स्फुरन्मङ्गलसूत्राढ्या
    स्फुरत्ताटङ्गमण्डितः । स्फुटाट्टहासवदनतोषितेशमनोरथा ॥ १४१॥ फाल्गुनास्त्रोद्भिन्नशिराः फाल्गुनास्त्रप्रदायिनी
    । बलभद्रार्चितो बाला बलवान् बलतोषिता ॥ १४२॥ बलीवर्दसमारूढो बालार्ककिरणारुणा । बडवाग्निप्रतीकाशो बाहुलेयप्रियङ्करी
    ॥ १४३॥ बिल्वकान्तारमध्यस्थो बिसतन्तुसमाकृतिः । बाणासुरार्चनप्रीतो बाणचापलसत्करा ॥ १४४॥ बिन्दुमण्डलमध्यस्थो
    बिन्दुनादस्वरूपिणी । बहुरूपश्च बिम्बोष्ठी बुद्धिज्ञेयो बुधार्चिता ॥ १४५॥ बुध्यो बुद्धिप्रदा बुद्धिधनदो
    बिन्दुमालिनी । भस्मोद्धूलितसर्वाङ्गो भक्तानुग्रहतत्परा ॥ १४६॥ भवो भवानी भर्गश्च भवघ्नी भवनाशनः । भद्रमूर्तिर्भाग्यनिधिर्भक्ताभीष्टप्रदायिनी
    ॥ १४७॥ भिषग्भेषजरूपा च भक्तहार्दतमोनुदः । भूतिदात्री भूतिभूषो भूतधात्री भवोद्भवः ॥ १४८॥ भुवनेशी भोगिभूषो
    भद्रकाली भगाक्षिभित् । महादेवी महाराज्ञी महान्मङ्गलरूपिणी ॥ १४९॥ महामृत्युप्रशमनो महाताण्डवसाक्षिणी
    । मन्त्रवेद्यो मन्त्रमयी मित्रेशो मित्ररूपिणी ॥ १५०॥ मन्दस्मितमुखाम्भोजो मदिरामोदविह्वला । मत्तेभचर्मवसनो
    मत्तमातङ्गगामिनी ॥ १५१॥ मीढुष्टमश्च मीनाक्षी मुदितो मुक्तिदायिनी । मूलमन्त्रस्वरूपज्ञो मूर्तिन्यासाधिदेवता
    ॥ १५२॥ मृगपाणिर्मृगमदालिप्ताङ्गी मृत्युभञ्जनः । मेनकानन्दिनीमेध्यो मेघश्यामलकुन्तला ॥ १५३॥ यक्षराजप्रियसखो
    यक्षस्त्रीकोटिसेविता । यज्ञप्रियो यज्ञभोक्त्री यज्वा याज्यश्च याजकः ॥ १५४॥ यमादिनियमप्रीता याम्यो
    यमभयापहा । योगी योगप्रदा योग्यो योगिवृन्दसमर्चिता ॥ १५५॥ यमारातिर्यायजूकवत्सला युगनायकः । यशस्विनी
    यजुर्वेदस्तुत्यो योषामणिस्तथा ॥ १५६॥ यक्षराक्षसवेतालभयघ्नो यक्षिणीश्वरी । रक्ताद्रिशिखरावासो रक्ताक्षी
    रम्यभूषणः ॥ १५७॥ रमणीयगुणस्तोमा राकाचन्द्रनिभाननः । राजीवदलनेत्री च रूपवान् रोगवर्जिता ॥ १५८॥ रूपयौवनसम्पन्नो
    रूढयौवनशालिनी । रेवतीपतिपूज्याङ्घ्रिः रेणुकास्तुतिमोदिनी ॥ १५९॥ रोमहर्षणसर्वाङ्गो रोगारण्यकुठारिका
    । रूप्याचलेन्द्रनिलयो रणन्मञ्जीरनूपुरा ॥ १६०॥ रम्भानाट्यप्रियश्चैव रम्भास्तम्भोरुशालिनी । रसप्रियो
    रसावासा रसिको रसरूपिणी ॥ १६१॥ ललाटाक्षो ललामश्री विडम्बिमुकुरप्रभा । लास्यप्रियो लास्यकर्त्री लाभालाभविवर्जितः
    ॥ १६२॥ लकुली लिङ्गरूपश्च लावण्यामृतवारिधिः । लब्धभाग्यो लब्धपतिर्लब्धसौख्यो लसत्तनुः ॥ १६३॥ लोकालोकाचलावासो
    लोकपालसमर्चिता । लक्ष्मीनारायणस्तुत्यो लीलाशुककरोज्ज्वला ॥ १६४॥ लोकरक्षकनिरतो लाकिन्यादिपरीवृता ।
    लङ्कापतिसमाराध्यपादुको ललिताम्बिका ॥ १६५॥ वामदेवो विशालाक्षी विषकण्ठो विराण्मयी
