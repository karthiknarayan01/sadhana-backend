    | mahamahavidye | mahamahashakte | mahamahashraye | mahamahabhoge | mahamahayoge | mahamahakalyani
    | mahamahamangale | mahamahamangalamurte | mahamahasaubhagyadayini | mahamahasiddhidayini | mahamahavagishvari
    | mahamahalekheshvari | mahamahaguhye | mahamaharahasye | mahamahaparadevate | mahamahaparashakte
    | mahamahaparameshvari | mahamahamatrike | mahamahagayatri | mahamahatripure | mahamahabhuvaneshvari
    | mahamahacidambareshvari | mahamahabrahmavidye | mahamahapurnanande | mahamahamuktidayini | mahamahakarunamayi
    | mahamahajnanasvarupini | mahamahashriparabrahmabindo | shrimannagaranilaye | shrianantakotibrahmandanayike
    mahamahashrimaharajni | namaste namaste namaste namah | om aim hrim shrim lim svaha || ityetat kathitam
    devi shrilekhinyah param mahat | khadgamalamayam divyam rahasyanamapi rahah || naitat vedairna shastraishca
    na puranashatairapi | labhyate tapasa ghore gurubhaktyaiva labhyate || gopaniyam prayatnena svayoniriva
    parvati | abhaktaya na datavyam nindakaya kadacana || bhaktaya gurubhaktaya shantacittaya yogine |
    dadyat parikshya vidhina sarvasiddhipradam param || yah pathennityakalam tu shraddhabhaktisamanvitah
    | tasya bhagyalipirdivya svayam devi pralikhyate || durbhagyarekhah sarvastu kshiyante kshanamatratah
    | saubhagyasancayo nityam vardhate ca dine dine || alikhitam likhitam caiva dushtalekham vinashyati
    | daivarekha shubha bhutva prasanna jayate dhruvam || daridro dhanavan bhuyadavidvan vedaparagah |
    mukah syadvakpatih sadyo nirbalah simhavikramah || akirtirvipulam kirtim nirlakshmirlabhate shriyam
    | aputrah putramapnoti nirgriho mandiram labhet || gadyapadyaprabandheshu svatantram jayate manah
    | alikhito'pi grantharthah svayameva prakashate || vagdevi tasya jihvagre nityavasam prapadyate |
    lekhini hastapadme ca nrityativa muhurmuhuh || yatraitatpathyate nityam pujyate va samahitaih | tatra
    lakshmirdhruva nityam jayashrirnapasarpati || bhurjapatre samalikhya gorocanakunkumaih | dharayedyadi
    bhaktya vai sarvarakshakaram param || rajadvare sabhamadhye sangrame shatrusankate | vane jale girau
    durge na bhayam tasya jayate || bhutapretapishacadya dakinyo yoginiganah | drishtvaiva durato yanti
    khadgamalaprabhavatah || yaksharakshograhavyadhidaridryopadravastatha | nashyanti smaranadasya vahnau
    tulamiva kshanat || anima mahima caiva garima laghima tatha | praptih prakamyamishitvam vashitvam
    ca prasidyati || trikalajnanasampattirduradrishtirmanorathah | paracittavabodhashca gurupadaprasadatah
    || catuhshashtikalah sarva vidyashcashtadasha smritah | anayasena siddhyanti lekhiniparitoshatah ||
    na mantrah sadrisho'syasti na vidya na ca devata | na tirtham na tapo danam na yogo na ca sadhanam
    || yatra gayatryadhishthanam yatra shritripura svayam | yatra brahma param jyotistatra lekhinyavasthitih
    || yatra lekhinyadhishthanam tatra vedashcaturdasha | tatra sarvani tantrani tatra sarva mahavidyah
    || yatra sa paramalekha tatra shriparabrahma tat | yatra parabrahma tatraiva na punarjanma vidyate
    || idam stotram mahaguhyam khadgamalamanuttamam | sarvamantreshu mantrendram sarvatantreshu tantrarat
    || lekhinipritidam nityam brahmasamrajyadayakam | bhuktim muktim ca vijnanam svayameva prayacchati
    || || iti shrisiddhashramokte guptayamale shrilekhinirahasye shribhairavabhairavisamvade parabrahma
    mahagayatri khadgamala stotram sampurnam || gayatri yantra stotram athava gayatri siddha shakti malamantram
    ca
