id: sankata-nashana-ganesha-stotram
category: stotram
name:
  english: Sankata Nashana Ganesha Stotram
  devanagari: सङ्कटनाशनगणेशस्तोत्रम्
content:
  english: sankatanashanaganeshastotram naradapuranam 1953 sankatanashanaganeshastotram naradapuranam
    1953 || sankatanashanaganeshastotram || pranamya shirasa devam gauriputram vinayakam | bhaktavasam
    smarenityamayukamarthasiddhaye || prathamam vakratundam ca ekadantam dvitiyakam | tritiyam krishnapingaksham
    gajavakra caturthakam || lambodaram pancamai ca shashtham vikatameva ca | saptamam vighnarajam ca
    dhumravarna tathashtamam || navamam phalacandram ca dashamam tu vinayakam | ekadasham ganapati dvadasham
    tu gajananam || dvadashetani namani trisandhyam ya pathennarah| nava vighnabhayam tasya sarvasiddhikaram
    prabho || vidyarthi labhate vidyam dhanarthi lamate dhanam | putrarthi labhate putranmoksharthi labhate
    gatim || japedganapatistotram shabhirmasai phalam labhet | samvatsarena siddhim ca labhate natra samshayah
    ||7 ashtabhyo brahmanebhyashca likhitva yah samarpayet | tasya vidya bhavetsarva ganeshasya prasadatah
    ||8 iti shrinaradapurane sankatanashana nama ganeshastotra || sampurnam ||
  devanagari: सङ्कटनाशनगणेशस्तोत्रम् नारदपुराणम् १९५३ सङ्कटनाशनगणेशस्तोत्रम् नारदपुराणम् १९५३ ॥ सङ्कटनाशनगणेशस्तोत्रम्
    ॥ प्रणम्य शिरसा देवं गौरीपुत्रं विनायकम् । भक्तावासं स्मरेनित्यमायुकामार्थसिद्धये ॥ प्रथमं वक्रतुण्डं
    च एकदन्तं द्वितीयकम् । तृतीयं कृष्णपिङ्गाक्षं गजवक्र चतुर्थकम् ॥ लम्बोदरं पञ्चमै च षष्ठं विकटमेव च
    । सप्तमं विघ्नराजं च धूम्रवर्ण तथाष्टमम् ॥ नवमं फालचन्द्रं च दशमं तु विनायकम् । एकादशं गणपति द्वादशं
    तु गजाननम् ॥ द्वादशेतानि नामानि त्रिसन्ध्यं य पठेन्नरः। नव विघ्नभयं तस्य सर्वसिद्धिकरं प्रभो ॥ विद्यार्थी
    लभते विद्यां धनार्थी लमते धनम् । पुत्रार्थी लभते पुत्रान्मोक्षार्थी लभते गतिम् ॥ जपेद्गणपतिस्तोत्रं
    षभिर्मासै फलं लभेत् । संवत्सरेण सिद्धिं च लभते नात्र संशयः ॥७ अष्टभ्यो ब्राह्मणेभ्यश्च लिखित्वा यः
    समर्पयेत् । तस्य विद्या भवेत्सर्वा गणेशस्य प्रसादतः ॥८ इति श्रीनारदपुराणे सङ्कटनाशन नाम गणेशस्तोत्र
    ॥ सम्पूर्णम् ॥
