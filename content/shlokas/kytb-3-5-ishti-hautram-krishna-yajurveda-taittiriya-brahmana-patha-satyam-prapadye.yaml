id: kytb-3-5-ishti-hautram-krishna-yajurveda-taittiriya-brahmana-patha-satyam-prapadye
category: stotram
name:
  english: KYTB 3.5 Ishti Hautram - Krishna Yajurveda Taittiriya Brahmana Patha - Satyam Prapadye
content:
  english: krishna yajurvediya taittiriya brahmane tritiyashtake pancamah prapathakah shri gurubhyo namah
    | harih om || anuvakam thsamidheninam satya mprapadye | amrita mprapadye | prajapateh priya mprapadye
    | idamaha mpancadashena vajrena | dvishanta mbhratrivyamavakramami | yo ndvishmah | bhurbhuva samidhenimranvaha
    pra vo vaja abhidyavah | havishmanto ghritacya | devanjigati sumnayuh || agna ayahi vitaye | grinano
    havyadataye | ni hota sathsi barahishi || ta ntva samidbhirangirah | ghritena vardhayamasi | brihacchoca
    yavishthya || sa nah prithu shravayya || accha deva vivasasi | brihadagne suvirya m || idenyo namasyastirah
    | tamagmsi dar shatah | samagniriddhyate vrisha ssamiddhyate | ashvo na devavahanah | tagm havishmanta
    idate || vrishana vi~shvavedasam | asya yajnasya sukratu m || samiddhyamano addhvare | agnih pavaka
    idyah | shocishkeshastamimahe || samiddho agna ahuta | devan yakshi svaddhvara | tvagm hi havyavadasi
    || ajuhota duvasyata | agni mprayatyaddhvare | vriniddhvagm havyavahanam || tvam va~runa uta mitro
    agne | tvam va~rdhanti matibhirvasishthah | tve vasu sushananani santu | yuya 'nucya devata avahayati
    agne mahagm asi brahmana bharata | asavasau || deveddho manviddhah | rishishtuto vipranumaditah |
    kavishasto brahmasagmshito ghritahavanah | prani m | rathiraddhvarana havyavat | aspatra || camaso
    devapanah | aragm ivagne nemirdevag mparibhurasi | avaha devan yajamanaya || agnimagna avaha | somamavaha
    | agnimavaha | prajapatimavaha | agnishomavavaha | indragni avaha | indramavaha | mahendramavaha |
    devagm a jyapagm avaha | agnigm hotrayavaha | sva mmahimanamavaha | a ca vaha | suyaja ca yaja jatavedah
    || mindramavaha shatca srucavadapayati agnir hota vetvagnih | hotram ttu pravitram | smo vayam | sadhu
    te yajamana devata maddhvaryo srucama 'syasva | devayuvam vi~shvavaram | idamahai devagm idenyan |
    namasyama namasyan | yajama yajniyan || prayajah samidho agna ajyasya viyantu | tanunapadagna ajyasya
    vetu | ido agna ajyasya viyantu | barhiragna ajyasya vetu | svaha 'gnim | svaha soma prajapatim |
    svaha ndragni | svahendra m | svaha mahendram | svaha devagm a 'gnigm hotrajjushanah | agna ajyasya
    viyantu || indragni panca ca ajyabhagayoh puronuvakye agni rvritrani janghanat | dravinasyu shshukra
    ahutah | jushano agnirajyasya vetu | tvagm somasi satpatih | tvagm rajota vritraha | tva mbhadro asi
    kratuh | jushana ssoma ajyasya havisho vetu | agnih pratnena janmana | shumbhanastanuvagg svam | kavi
    rviprena vavridhe | jushano agnirajyasya vetu | soma girbhishtva vayam | vardhayamo vacovidah | sumridiko
    na avisha | jushana ssoma ajyasya havisho vetu || ya~jyanuvakyah agni rmurdha divah kakut | patih
    prithivya ayam | apagm retagmsi jinvati | bhuvo yajnasya rajasashca neta | yatra niyudbhi ssacase
    shivabhih | divi murdhana ndadhishe suvarsham | jihvamagne cakrishe havyavaha m | prajapate na tvadetanyanyah
    | vishva jatani pari ta babhuva | yat kamaste juhumastanno astu || syama patayo rayinam | sa veda
    putrah pitaragm sa matara m | sa sunurbhuvathsa bhuvatpunarmaghah | sa dyamaurnodantarikshagm sa suvah
    | sa vishva bhuvo abhavathsa a 'bhavat | agnishoma savedasa | sahuti vanata ndevatra babhuvathuh |
    yuvametani divi rocanani | agnishca soma sakratu adhattam || || yuvagm sindhugm rabhishaste ravadyat
    | agnishoma ngribhitan | indra gni rocana divah | pari vajeshu bhushathah | tadva m | shnathadvritramuta
    sanoti vaja m | indra yo agni sahuri saparyat | irajyanta vasavyasya bhureh | sahastama sahasa vajayanta
    | endra sanasigm rayim || || sajitvanagm sadasaha shishthamutaye bhara | prasasahishe puruhuta shatrun
    | jyeshthaste shushma iha ratirastu | indrabhara dakshinena vasuni | pati ssindhunamasi revatinam
    | mahagm indro ya ojasa | parjanyo vrishtimagm iva | stomai rvathsasya vavridhe | maha indrogm nrivadacar
    ssahobhih | asmadriyagvavridhe viryaya | uruh prithu ssukritah kartribhirbhut | piprihi devagm ushato
    yavishtha | vidvagm ritugmr ritupate yajeha | ye daivya ritvijastebhiragne | tvagm hotrinamasyayajishthah
    || agnigg m | ayadagniragneh priya dhamani | ayatthsomasya priya dhamani || || ayadagneh priya dhamani
    | aya tprajapateh priya dhamani | ayadagnishomayoh priya dhamani | ayadindragniyoh priya dhamani |
    ayadindrasya priya dhamani | aya nmahendrasya priya dhamani | aya mpriya dhamani | yakshadagner hotuh
    priya dhamani | yakshathsva m | ayajatamejya ishah | krinotu so addhvara jatavedah | jushatagm havih
    | agne yadadya visho addhvarasya hotah | pavaka shoce veshtvagm hi yajva | rita yajasi mahina vi yadbhuh
    | havya vaha yavishtha ya te adya || somasya priya dhama idopahvanam upahutagm rathantaragm saha prithivya
    | upa ma rathantaragm saha prithivya hvayatam | upahutam va~madevyagm sahantarikshena | upa ma vamadevyagm
    sahantarikshena hvayatam | upa huta mbrihathsaha diva | upa ma brihathsaha diva hvayatam | upahuta
    | upa ma sapta hotra hvayantam | upahuta dhenu hvayatam | upahuta~ ho | idopahuta | upahuteda | upo
    asmagm ida hvayatam | idopahuta | upahuteda | manavi ghritapadi maitravaruni | brahma devakritamupahutam
    || || daivya addhvaryava upahutah | upahuta manushyah ya~jnamavan | ye yajnapatim va~rdhan | upahute
    dyavaprithivi | purvaje ritavari | devi devaputre | upahuto ya~jamanah | uttarasya mupahutah | bhuyasi
    havishkarana upahutah | divye dhamannupahutah | ida mme deva havirjushantamiti tasminnupahutah | vishvamasya
    priyamupahutam | vishvasya priyasyopahutasyopahutah || havishkarana upahutashcatvari ca mbarhih |
    vasuvane vasudheyasya vetu | devo narashagm sah | vasuvane vasudheyasya vetu | devo agni ssvishtakrit
    | sudravina mandrah kavih | satyamanma hoturayajiyan | agne yan t | yagm apipreh | ye te hotre amathsata
    | tagm sasanushigm hotra ngamam | divi deveshu yajnamerayemam | svishtakriccagne hota | vasuvane vasudheyasya
    namovake vihi || ndyavaprithivi bhadramabhut | ardhma suktavakam | uta namovakam | riddhyasma suktocyamagne
    | tvagm su ktavagasi | upashrito divah prithivyoh | omanvati te yajne yajamana dyavaprithivi sta m
    | shagamye jiradanu | atrasnu apravede | urugavyuti abhaya || vrishtidyava rityapa | shambhuvau mayobhuvau
    | urjasvati ca payasvati ca | supacarana ca svadhicarana ca | tayoravidi || agniridagm havirajushata
    | avivridhata maho jyayo 'krita | soma idagm havirajushata | avivridhata maho jyayo 'krita | agniridagm
    havirajushata || || avivridhata maho jyayo 'krita | prajapatiridagm havirajushata | avivridhata maho
    jyayo 'krita | agnishomavidagm havirajushetam | avivridheta 'kratam | indragni idagm havirajushetam
    | avivridheta 'kratam | indra idagm havirajushata | avivridhata maho jyayo 'krita | mahendra idagm
    havirajushata || || avivridhata maho jyayo jyapa ajyamajushanta | avivridhanta maho jyayo hotrenedagm
    havirajushata | avivridhata maho jyayo ste | suprajastva ste | sajatavanasya ste | bhuyo havishkarana
    ste | yadanena havisha ''sha tadriddhyat | tadasmai deva rasantam | tadagni rdevo devebhyo vanate
    | vayamagne nca | ubhe ca no dyavaprithivi agmhasaspatam | iha gati nca | namo devebhyah || tagniridagm
    havirajushata mahendra idagm havirajushata yo~ra vrinimahe | gatum svastirastu nah | svasti rmanushebhyah
    | urdhva njigatu bheshajam | sha nno astu dvipade ya~jyanuvakyah a pyayasva sametu te vishvatah soma
    vrishniyam | bhava vajasya sangathe || sa nte payagm si samu yantu vaja nyabhimatishahah | apyayamano
    amritaya soma divi shravagsyuttamani dhishva || || iha tvashtaramagriyam vi~shvarupamupa hvaye | asmakamastu
    kevalah || tannasturipamadha poshayitnu deva tvashtarvi rarana ssyasva | yato virah karmanyah sudaksho
    yuktagrava jayate devakamah || || devana mpatnirushatiravantu nah | pravantu nastujaye vajasataye
    | yah parthivaso ya apamapi vrate | ta no devi shsharma yacchata || uta gna viyantu devapatnih | indranyagnayyashvini
    rat | a rodasi varunani shrinotu | viyantu devirya riturjaninam || | vishva veda janima jatavedah
    | devanamuta yo martyanam | yajishtha || vayamu tva grihapate jananam | agne akarma samidha brihanta
    m | asthurino gar hapatyani santu | tigmena nastejasa sagmshishadhi || ya~je somahvanam upahutagm
    rathantaragm saha prithivya | upa ma rathantaragm saha prithivya hvayatam | upahutam va~madevyagm
    sahantarikshena | upa ma vamadevyagm sahantarikshena hvayatam | upahuta mbrihathsaha diva | upa ma
    brihathsaha diva hvayatam | upahuta | upa ma sapta hotra hvayantam | upahuta dhenu hvayatam | upahuta~
    ho | idopahuta | upahuteda | upo asmagm ida hvayatam | idopahuta | upahuteda | manavi ghritapadi maitravaruni
    | brahma devakritamupahutam || || daivya addhvaryava upahutah | upahuta manushyah ya~jnamavan | ye
    yajnapatnim va~rdhan | upahute dyavaprithivi | purvaje ritavari | devi devaputre | upahuteyam ya~jamana
    | indranivavidhava | aditiriva suputra | uttarasya mupahuta | bhuyasi havishkarana upahuta | divye
    dhamannupahuta | ida rjushantamiti tasmi nnupahuta | vishvamasyah priyamupahutam | vishvasya priyasyopahutasyopahuta
    || vrishtidyava trigmshat || harih om || || krishna yajurvediya taittiriya brahmane tritiyashtake
    pancama prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे तृतीयाष्टके पञ्चमः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ अनुवाकं थ्सामिधेनीनाम् स॒त्य म्प्रप॑द्ये । अ॒मृत॒ म्प्रप॑द्ये । प्र॒जाप॑तेः प्रि॒या म्प्रप॑द्ये
    । इ॒दम॒ह म्प॑ञ्चद॒शेन॒ वज्रे॑ण । द्वि॒षन्त॒ म्भ्रातृ॑व्य॒मव॑क्रामामि । यो न्द्वि॒ष्मः । भूर्भुव॒ सामिधेनीम्रन्वाह
    प्र वो॒ वाजा॑ अ॒भिद्य॑वः । ह॒विष्म॑न्तो घृ॒ताच्या । दे॒वाञ्जि॑गाति सुम्न॒युः ॥ अग्न॒ आया॑हि वी॒तये
    । गृ॒णा॒नो ह॒व्यदा॑तये । नि होता॑ सथ्सि ब॒र॒ःइषि॑ ॥ त न्त्वा॑ स॒मिद्भि॑रङ्गिरः । घृ॒तेन॑ वर्धयामसि
    । बृ॒हच्छो॑चा यविष्ठ्य ॥ स नः॑ पृ॒थु श्र॒वाय्य ॥ अच्छा॑ देव विवाससि । बृ॒हद॑ग्ने सु॒वीर्य म् ॥ ई॒डेन्यो॑
    नम॒स्य॑स्ति॒रः । तमाग्ं॑सि दर् श॒तः । सम॒ग्निरि॑द्ध्यते॒ वृषा स्समि॑द्ध्यते । अश्वो॒ न दे॑व॒वाह॑नः
    । तग्ं ह॒विष्म॑न्त ईडते ॥ वृष॑ण विँ॒श्ववे॑दसम् । अ॒स्य य॒ज्ञस्य॑ सु॒क्रतु म् ॥ स॒मि॒द्ध्यमा॑नो अद्ध्व॒रे
    । अ॒ग्निः पा॑व॒क ईड्यः॑ । शो॒चिष्के॑श॒स्तमी॑महे ॥ समि॑द्धो अग्न आहुत । दे॒वान् य॑क्षि स्वद्ध्वर ।
    त्वग्ं हि ह॑व्य॒वाडसि॑ ॥ आजु॑होत दुव॒स्यत॑ । अ॒ग्नि म्प्र॑य॒त्य॑द्ध्व॒रे । वृ॒णी॒द्ध्वग्ं ह॑व्य॒वाह॑नम्
    ॥ त्वं वँरु॑ण उ॒त मि॒त्रो अ॑ग्ने । त्वां वँ॑र्धन्ति म॒तिभि॒र्वसि॑ष्ठाः । त्वे वसु॑ सुषण॒नानि॑ सन्तु
    । यू॒य ऽनूच्य देवता आवाहयति अग्ने॑ म॒हाग्ं अ॑सि ब्राह्मण भारत । असा॒वसौ ॥ दे॒वेद्धो॒ मन्वि॑द्धः ।
    ऋषि॑ष्टुतो॒ विप्रा॑नुमदितः । क॒वि॒श॒स्तो ब्रह्म॑सग्ंशितो घृ॒ताह॑वनः । प्र॒णी म् । र॒थीर॑द्ध्व॒राणा
    हव्य॒वाट् । आस्पात्र॑ ॥ च॒म॒सो दे॑व॒पानः॑ । अ॒राग्ं इ॑वाग्ने ने॒मिर्दे॒वाग् म्प॑रि॒भूर॑सि । आव॑ह दे॒वान्
    यज॑मानाय ॥ अ॒ग्निम॑ग्न॒ आव॑ह । सोम॒माव॑ह । अ॒ग्निमाव॑ह । प्र॒जाप॑ति॒माव॑ह । अ॒ग्नीषोमा॒वाव॑ह । इ॒न्द्रा॒ग्नी
    आव॑ह । इन्द्र॒माव॑ह । म॒हे॒न्द्रमाव॑ह । दे॒वाग्ं आ ज्य॒पाग्ं आव॑ह । अ॒ग्निग्ं हो॒त्रायाव॑ह । स्व म्म॑हि॒मान॒माव॑ह
    । आ चा वह॑ । सु॒यजा॑ च यज जातवेदः ॥ मिन्द्र॒माव॑ह॒ षट्च॑ स्रुचावादापयति अ॒ग्निर् होता॒ वेत्व॒ग्निः
    । हो॒त्रं त्तु प्रावि॒त्रम् । स्मो व॒यम् । सा॒धु ते॑ यजमान दे॒वता मद्ध्वर्यो॒ स्रुच॒मा ऽस्य॑स्व ।
    दे॒वा॒युवं॑ विँ॒श्ववा॑राम् । ईडा॑महै दे॒वाग्ं ई॒डेन्यान्॑ । न॒म॒स्याम॑ नम॒स्यान्॑ । यजा॑म य॒ज्ञियान्॑
    ॥ प्रयाजाः स॒मिधो॑ अग्न॒ आज्य॑स्य वियन्तु । तनू॒नपा॑दग्न॒ आज्य॑स्य वेतु । इ॒डो अ॑ग्न॒ आज्य॑स्य वियन्तु
    । ब॒र्॒हिर॑ग्न॒ आज्य॑स्य वेतु । स्वाहा॒ ऽग्निम् । स्वाहा॒ सोम प्र॒जाप॑तिम् । स्वाहा॒ न्द्रा॒ग्नी ।
    स्वाहेन्द्र म् । स्वाहा॑ महे॒न्द्रम् । स्वाहा॑ दे॒वाग्ं आ ऽग्निग्ं हो॒त्राज्जु॑षा॒णाः । अग्न॒ आज्य॑स्य
    वियन्तु ॥ इ॒न्द्रा॒ग्नी पञ्च॑ च अज्यभागयोः पुरोनुवाक्ये अ॒ग्नि र्वृ॒त्राणि॑ जङ्घनत् । द्र॒वि॒ण॒स्यु
    श्शु॒क्र आहु॑तः । जु॒षा॒णो अ॒ग्निराज्य॑स्य वेतु । त्वग्ं सो॑मासि॒ सत्प॑तिः । त्वग्ं राजो॒त वृ॑त्र॒हा
    । त्व म्भ॒द्रो अ॑सि॒ क्रतुः॑ । जु॒षा॒ण स्सोम॒ आज्य॑स्य ह॒विषो॑ वेतु । अ॒ग्निः प्र॒त्नेन॒ जन्म॑ना ।
    शुम्भा॑नस्त॒नुव॒ग्ग्॒ स्वाम् । क॒वि र्विप्रे॑ण वावृधे । जु॒षा॒णो अ॒ग्निराज्य॑स्य वेतु । सोम॑ गी॒र्भिष्ट्वा॑
    व॒यम् । व॒र्धया॑मो वचो॒विदः॑ । सु॒मृ॒डी॒को न॒ आवि॑श । जु॒षा॒ण स्सोम॒ आज्य॑स्य ह॒विषो॑ वेतु ॥ याँज्यानुवाक्याः
    अ॒ग्नि र्मू॒र्धा दि॒वः क॒कुत् । पतिः॑ पृथि॒व्या अ॒यम् । अ॒पाग्ं रेताग्ं॑सि जिन्वति । भुवो॑ य॒ज्ञस्य॒
    रज॑सश्च ने॒ता । यत्रा॑ नि॒युद्भि॒ स्सच॑से शि॒वाभिः॑ । दि॒वि मू॒र्धान॑ न्दधिषे सुव॒र्॒षाम् । जि॒ह्वाम॑ग्ने
    चकृषे हव्य॒वाह म् । प्रजा॑पते॒ न त्वदे॒तान्य॒न्यः । विश्वा॑ जा॒तानि॒ परि॒ ता ब॑भूव । यत् का॑मास्ते
    जुहु॒मस्तन्नो॑ अस्तु ॥ स्या॑म॒ पत॑यो रयी॒णाम् । स वे॑द पु॒त्रः पि॒तर॒ग्ं॒ स मा॒तर म् । स सू॒नुर्भु॑व॒थ्स
    भु॑व॒त्पुन॑र्मघः । स द्यामौर्णो॑द॒न्तरि॑क्ष॒ग्ं॒ स सुवः॑ । स विश्वा॒ भुवो॑ अभव॒थ्स आ ऽभ॑वत् । अग्नी॑षोमा॒
    सवे॑दसा । सहू॑ती वनत॒ न्दे॑व॒त्रा ब॑भूवथुः । यु॒वमे॒तानि॑ दि॒वि रो॑च॒नानि॑ । अ॒ग्निश्च॑ सोम॒ सक्र॑तू
