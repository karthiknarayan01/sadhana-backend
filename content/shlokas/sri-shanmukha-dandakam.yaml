id: sri-shanmukha-dandakam
category: stotram
name:
  english: Sri Shanmukha Dandakam
content:
  english: tvatpadapankeja sevarato'ham tvadiyam nutim devabhashagatam kartumarabdhavanasmi sankalpasiddhim
    kritartham kuru tvam | bhaje tvam sadanandarupam kalatrollasatparshvayugmam dvishadbahu samshobhitam
    naradagastyakanvatrijabalivalmikivyasadi sankirtitam devaratputrikalingitangam mahadevavaktrabjabhanum
    padambhojaseva samayata bhaktali samrakshanayatta cittam uma sharva gangagni shatkrittika vishnu brahmendra
    dikpala samputasadyatna nirvartitotkrishta sushritapoyajna samlabdharupam jagajjala nirmana sampalanaharyakaram
    svabhaktantarangabja sancarashilam susaundaryagambhirya susthairyayuktam dvishadbahu sankhyayudha
    shreniramyam bhavadhvantanashayasuryam daronmilitambhojanetram suhastadhritanekashastram niralambamabhasamatram
    shikhamadhyavasam bhaktakaryarthasampadakam sutarunyalavanyakarunyarupam sahasrarka sankasha sauvarnaharali
    samshobhitam kundalanam virajatsukantyam cittergandabhagaih susamshobhitam kripavarikallola bhasvatkataksham
    samsarapankabdhi sammagnamajnaninam papabhuyishthamarge caram papashilam pavitram kuru tvam prabho
    tvatkripavikshanairmam prasida prasida prapannartiharaya samsiddha param tvam bhaje'ham bhaje'ham
    bhaje'ham | iti shri shanmukha dandakam ||
  devanagari: त्वत्पादपङ्केज सेवारतोऽहं त्वदीयां नुतिं देवभाषागतां कर्तुमारब्धवानस्मि सङ्कल्पसिद्धिं कृतार्थं
    कुरु त्वम् । भजे त्वां सदानन्दरूपं कलत्रोल्लसत्पार्श्वयुग्मं द्विषड्बाहु संशोभितं नारदागस्त्यकण्वात्रिजाबालिवाल्मीकिव्यासादि
    सङ्कीर्तितं देवराट्पुत्रिकालिङ्गिताङ्गं महादेववक्त्राब्जभानुं पदाम्भोजसेवा समायात भक्तालि संरक्षणायत्त
    चित्तं उमा शर्व गङ्गाग्नि षट्कृत्तिका विष्णु ब्रह्मेन्द्र दिक्पाल सम्पूतसद्यत्न निर्वर्तितोत्कृष्ट
    सुश्रीतपोयज्ञ संलब्धरूपं जगज्जाल निर्माण सम्पालनाहार्यकारं स्वभाक्तान्तरङ्गाब्ज सञ्चारशीलं सुसौन्दर्यगाम्भीर्य
    सुस्थैर्ययुक्तं द्विषड्बाहु सङ्ख्यायुध श्रेणिरम्यं भवध्वान्तनाशायसूर्यं दरोन्मीलिताम्भोजनेत्रं सुहस्ताधृतानेकशस्त्रं
    निरालम्बमाभासमात्रं शिखामध्यवासं भक्तकार्यार्थसम्पादकं सुतारुण्यलावण्यकारुण्यरूपं सहस्रार्क सङ्काश
    सौवर्णहारालि संशोभितं कुण्डलानां विराजत्सुकान्त्यं चित्तेर्गण्डभागैः सुसंशोभितं कृपावारिकल्लोल भास्वत्कटाक्षं
    संसारपङ्काब्धि सम्मग्नमज्ञानिनं पापभूयिष्ठमार्गे चरं पापशीलं पवित्रं कुरु त्वं प्रभो त्वत्कृपावीक्षणैर्मां
    प्रसीद प्रसीद प्रपन्नार्तिहाराय संसिद्ध परं त्वां भजेऽहं भजेऽहं भजेऽहम् । इति श्री षण्मुख दण्डकम्
    ॥
