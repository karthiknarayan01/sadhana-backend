id: ganeshamahimnastotra
category: stotram
name:
  english: ganeshamahimnastotra
  devanagari: गणेशमहिम्नस्तोत्र
content:
  english: digakhilallolamanuvag dhritih paduh khadgo'njanarasabalah siddhaya imah | sada prishthe tishtantyanimishidrishastanmukhalaya
    ganesham sevante'tyatinikatasupayanakarah || 19|| mrigamkasya rambhaprabhritiganika yasya puratah
    susamgita kurvantyapi kutukagandharvasahitah | mudah paro na'tretyanupamapade dorvigalita sthiram
    jatam cittam caranamavalokyasya vimalam || 20|| harena'yam dhyatastripuramathane ca'suravadhe ganeshah
    parvatya balivijayakale'pi harina | vidhatra samsrishtavuragapatina kshonidharane naraih siddhau muktau
    tribhuvanajaye pushpadhanusha || 21|| ayam suprasade sura iva nijanandabhuvane mahan shrimanadyo laghutaragrihe
    ramkasadrishah | shivadvare dvahstho nripa iva sada bhupatigrihe sthito bhutvomamke shishuganapatirlalanaparah
    || 22|| amushmin santushte gajavadana evapi vibudhe tataste santushtastribhuvanagatah syurbudhaganah
    | dayalurherambo na ca bhavati yasmimshca purushe vritha sarvam tasya prajananamatah sandratamasi
    || 23|| varenyo bhushundirbhrigu
  devanagari: दिगखिलाल्लोलमनुवाग् धृतिः पादूः खड्गोऽञ्जनरसबलाः सिद्धय इमाः । सदा पृष्ठे तिष्टन्त्यानिमिषिदृशस्तन्मुखलया
    गणेशं सेवन्तेऽत्यतिनिकटसूपायनकराः ॥ १९॥ मृगांकास्या रम्भाप्रभृतिगणिका यस्य पुरतः सुसंगीत कुर्वन्त्यपि
    कुतुकगन्धर्वसहिताः । मुदः पारो नाऽत्रेत्यनुपमपदे दोर्विगलिता स्थिरं जातं चित्तं चरणमवलोक्यास्य विमलम्
    ॥ २०॥ हरेणाऽयं ध्यातस्त्रिपुरमथने चाऽसुरवधे गणेशः पार्वत्या बलिविजयकालेऽपि हरिणा । विधात्रा संसृष्टावुरगपतिना
    क्षोणिधरणे नरैः सिद्धौ मुक्तौ त्रिभुवनजये पुष्पधनुषा ॥ २१॥ अयं सुप्रासादे सुर इव निजानन्दभुवने महान्
    श्रीमानाद्यो लघुतरगृहे रंकसदृशः । शिवद्वारे द्वाःस्थो नृप इव सदा भूपतिगृहे स्थितो भूत्वोमांके शिशुगणपतिर्लालनपरः
    ॥ २२॥ अमुष्मिन् सन्तुष्टे गजवदन एवापि विबुधे ततस्ते सन्तुष्टास्त्रिभुवनगताः स्युर्बुधगणाः । दयालुर्हेरम्बो
    न च भवति यस्मिंश्च पुरुषे वृथा सर्वं तस्य प्रजननमतः सान्द्रतमसि ॥ २३॥ वरेण्यो भूशुण्डिर्भृगु
