id: vrindavanastotram-2
category: stotram
name:
  english: vrindavanastotram 2
  devanagari: वृन्दावनस्तोत्रम् २
content:
  english: rinvan gitam bhati gopishvarakhyah || 14|| kimatra bahunoktena nihshreyasavidhih svayam | nihshreyasavanam
    gatva yatra rebhe rabhasakhah || 15|| tadetadamritasyandi bundavanamaho drishoh | cirotkranditamagamya
    janmanah phalamapnumah || 16|| vande vanamidam murdhna yatra citram jagatprabhoh | prapya pratipadam
    reje sthalapadmapadam padam || 17|| api va bhuvanollangisaubhagyam vikshya cakrina | padamudrapadeshena
    yaccakrenatmasatkritam || 18|| jagajjanmasthitilaya lila yasya jagatprabhoh | tasyasya krishnadevasya
    lilodyanamidam kiyat || 19|| vrindadevya baddharaksham tadetat vrindaranyam punyabhajo bhajante |
    gopirupairyatra lakshmisahasraih devah svairam sevito daivataishca || 20|| vande bhagavatim vrindam
    vanasyaitasya rakshinim | yatra dattakaharah svairam cikridati jagatprabhuh || 21|| vande vrindavanendrasya
    vishvanathasya shaishavam | vaibhavodgandhimangalyakatakshokshitadinmukham || 22|| vande kandarpasamrajyavrindavanavanecaram
    | vrindairindivarakshinam vanditam tamitastatah || 23|| tavakam bhagavan bhatu tattvamastamitopamam
    | nistaranganiratankanirandhrasukhasankulam || 24|| bhagavan pundarikaksho bhasatam mama manase |
    mrigalanchanavamshasya manilanchanatam gatah || 25|| madhurabhijanam dhama madhuradharapallavam |
    hridayangasamabhyetu hridayam galitopamam || 26|| devakivasudevabhyam dattva netrotsavam sakrit |
    dadau nandayashodabhyam yattatputrotsavotsavan || 27|| tadetadavalibhyadau balalilah sahasrashah |
  devanagari: ृण्वन् गीतं भाति गोपीश्वराख्यः ॥ १४॥ किमत्र बहुनोक्तेन निःश्रेयसविधिः स्वयम् । निःश्रेयसवनं
    गत्वा यत्र रेभे रभासखः ॥ १५॥ तदेतदमृतस्यन्दि बुन्दावनमहो दृशोः । चिरोत्क्रन्दितमागम्य जन्मनः फलमाप्नुमः
    ॥ १६॥ वन्दे वनमिदं मूर्ध्ना यत्र चित्रं जगत्प्रभोः । प्राप्य प्रतिपदं रेजे स्थलपद्मपदं पदम् ॥ १७॥
    अपि वा भुवनोल्लङ्गिसौभाग्यं वीक्ष्य चक्रिणा । पादमुद्रापदेशेन यच्चक्रेणात्मसात्कृतम् ॥ १८॥ जगज्जन्मस्थितिलया
    लीला यस्य जगत्प्रभोः । तस्यास्य कृष्णदेवस्य लीलोद्यानमिदं कियत् ॥ १९॥ वृन्दादेव्या बद्धरक्षं तदेतत्
    वृन्दारण्यं पुण्यभाजो भजन्ते । गोपीरूपैर्यत्र लक्ष्मीसहस्रैः देवः स्वैरं सेवितो दैवतैश्च ॥ २०॥ वन्दे
    भगवतीं वृन्दां वनस्यैतस्य रक्षिणीम् । यत्र दत्तकहरः स्वैरं चिक्रीडति जगत्प्रभुः ॥ २१॥ वन्दे वृन्दावनेन्द्रस्य
    विश्वनाथस्य शैशवम् । वैभवोद्गन्धिमङ्गल्यकटाक्षोक्षितदिङ्मुखम् ॥ २२॥ वन्दे कन्दर्पसाम्रज्यवृन्दावनवनेचरम्
    । वृन्दैरिन्दीवराक्षीणां वन्दितं तमितस्ततः ॥ २३॥ तावकं भगवन् भातु तत्त्वमस्तमितोपमम् । निस्तरङ्गनिरातङ्कनीरन्ध्रसुखसङ्कुलम्
    ॥ २४॥ भगवान् पुण्डरीकाक्षो भासतां मम मानसे । मृगलाञ्छनवंशस्य मणिलाञ्छनतां गतः ॥ २५॥ मधुराभिजनं धाम
    मधुराधरपल्लवम् । हृदयङ्गसमभ्येतु हृदयं गलितोपमम् ॥ २६॥ देवकीवसुदेवाभ्यां दत्त्वा नेत्रोत्सवं सकृत्
    । ददौ नन्दयशोदाभ्यां यत्तत्पुत्रोत्सवोत्सवान् ॥ २७॥ तदेतदवलिभ्यादौ बाललीलाः सहस्रशः ।
