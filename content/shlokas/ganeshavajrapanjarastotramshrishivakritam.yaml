id: ganeshavajrapanjarastotramshrishivakritam
category: stotram
name:
  english: ganeshavajrapanjarastotramshrishivakritam
  devanagari: गणेशवज्रपन्जरस्तोत्रम्श्रीशिवकृतं
content:
  english: shrishivakritam shriganeshavajrapanjarastotram || shriganeshaya namah || shrishiva uvaca |
    ganeshaya namastubhyam vighnarajaya dhundhaye | pareshaya ca herambaya pashine namo namah || 19||
    mushakavahanayaiva namah parashupanaye | dantabhayadharayaiva trinetraya namo namah || 20|| shurpakarnaya
    viraya candrarekhadharaya te | sindurabhushanayaiva raktarangaya te namah || 21|| herambaya mahavighnavaranaya
    gajanana | adipujyaya sarvesham pujyaya te namo namah || 22|| svanandavasine tubhyam svanandamayamurtaye
    | sarvakaraya sarvesham matre pitre namo namah || 23|| anantodarabhavaya brahmanam pataye namah |
    brahmabhutaya devaya daityadanavamardine || 24|| anantavibhavayaiva bhaktapalanadharmine | abhaktanam
    vinashaya khelakaya namo namah || 25|| yogaya yoganathaya yogine yogadayine | sada shantisvarupaya
    shantishataya te namah || 26|| kim staumi tvam ganeshana brahmanaspatirupinam | yogino vedavedantah
    shantim yatra bhajanti ca || 27|| dhanyo'ham devapairdevairmunibhirgananayaka | darshanatte'dya padasya
    paratparatarasya ca || 28|| samarthyam dehi vighnesha jnanarupam tvayi sthitam | ajnanandhakanashartham
    bhaktim te'vyabhicarinim || 29|| evamuktva nanarta'sau mahadevah surarshibhih | tam jagada ganadhisho
    bhaktam bhaktajanapriyah || 30||
  devanagari: श्रीशिवकृतं श्रीगणेशवज्रपञ्जरस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ श्रीशिव उवाच । गणेशाय नमस्तुभ्यं
    विघ्नराजाय ढुण्ढये । परेशाय च हेरम्बाय पाशिने नमो नमः ॥ १९॥ मूषकवाहनायैव नमः परशुपाणये । दन्ताभयधरायैव
    त्रिनेत्राय नमो नमः ॥ २०॥ शूर्पकर्णाय वीराय चन्द्ररेखाधराय ते । सिन्दूरभूषणायैव रक्तरङ्गाय ते नमः
    ॥ २१॥ हेरम्बाय महाविघ्नवारणाय गजानन । आदिपूज्याय सर्वेषां पूज्याय ते नमो नमः ॥ २२॥ स्वानन्दवासिने
    तुभ्यं स्वानन्दमयमूर्तये । सर्वाकाराय सर्वेषां मात्रे पित्रे नमो नमः ॥ २३॥ अनन्तोदरभावाय ब्रह्मणां
    पतये नमः । ब्रह्मभूताय देवाय दैत्यदानवमर्दिने ॥ २४॥ अनन्तविभवायैव भक्तपालनधर्मिणे । अभक्तानां विनाशाय
    खेलकाय नमो नमः ॥ २५॥ योगाय योगनाथाय योगिने योगदायिने । सदा शान्तिस्वरूपाय शान्तिशाताय ते नमः ॥ २६॥
    किं स्तौमि त्वां गणेशान ब्रह्मणस्पतिरूपिणम् । योगिनो वेदवेदान्ताः शान्तिं यत्र भजन्ति च ॥ २७॥ धन्योऽहं
    देवपैर्देवैर्मुनिभिर्गणनायक । दर्शनात्तेऽद्य पादस्य परात्परतरस्य च ॥ २८॥ सामर्थ्यं देहि विघ्नेश ज्ञानरूपं
    त्वयि स्थितम् । आज्ञानान्धकनाशार्थं भक्तिं तेऽव्यभिचारिणीम् ॥ २९॥ एवमुक्त्वा ननर्ताऽसौ महादेवः सुरर्षिभिः
    । तं जगाद गणाधीशो भक्तं भक्तजनप्रियः ॥ ३०॥
