id: sri-hayagriva-sahasra-nama-stotram
category: stotram
name:
  english: Sri Hayagriva Sahasra Nama Stotram
content:
  english: '|| shrih || shuklambaradharam vishnum shashivarnam caturbhujam prasannavadanam dhyayetsarvavighnopashantaye
    | yasya dviradavakradyah parishadyah parashshatam vighnam nighnanti satatam vishvaksenam tamashraye
    | shrikashyapah | tata me shrihayagrivanamnam sahasramuttamam | adhyetum jayate kanksha tatprasida
    mayi prabho || || itiprishtastatovaca brahma loka pitamahah | shreyasamapi ca shreyah kashyapeha vishampate
    || || amatya vihitam papam mulato hi vinashyati | rahasyanam rahasyam ca pavananam ca pavanam || ||
    prayashcitte krite tasya kartana nirayi bhavet | kamatastu krite pape prayashcittashatena ca || ||
    tanna nashyati tatkarta vyavaharyastu jayate | evam durapanodanam buddhipurvamahamhasam || || avarjanakaranamapyante
    nishkritiririta | pranamya manavataya mantraratnanukirtanam || || hamsanamasahasrasyapathanam shirasanvaham
    | pranamya bhagavadbhaktapadodaka nishevanam || || tadetatttritayam sarvapapasanghatanashanam | itidam
    paramam guhyam hamso hayashiraharih || || vedopadeshasamaye mam nibodhyopadishtavana | anena mantraratnena
    mahashvashiraso hareh || || sahasranamabhistulya nishkritirnetaramhasam | ananyabhagavadbhaktapadodakanishevanam
    || || etaddvayopadeshangamadau svikaryamishyate | ityuktva''nantagarudavishvaksenapadodakam || ||
    adau mam prashayannante parishoshyekritamhasi | atmano namasahasram sarshicchando''dhidaivatam ||
    || sanyasamudrikabhedam mahyam sangamupadishat | yathavattadidam vatsa dadyam te shrinu tattvatah
    || || yatprapyatyantiki vrittya nivrittya mokshameshyati | hayasyanamasahasrastotrarajasya vaibhavam
    || || rishishshriman hayagrivo vidyamurtissvayam harih | devata ca sa evasya chandonushtubiti shrutam
    || || hamso hamso''hamityete bijam shaktistukilakam | hamsim hamso''hamityete prajnapya manavastrayah
    || || ekaikasya dashavrittiritisankhyavidhiyate | pranavatrayamantram syatkavacam shrishshriyo bhavet
    || || shrivibhushana ityetaddhridayam parikirtitam | parorajah param brahmetyapi yonirudahrita ||
    || vidyamurtiriti dhyanam vishvatmeti ca gadyate | vishvamangalanamno''sya viniyogo yatharuci || ||
    bhrunetrashrotranasahanvoshthatalurade kramat | shodashasvaravinyaso dakshinarambhamishyate || ||
    jihvatale''pi tanmule svaravantyau ca vinyaset | tada taludvayanyasasakhayostu parityajet || || ayam
    hi vidyakamanamadyastvanya phalaishinam | dohpatsakthyangulishirshe vargankacatatannyaset || || parshvayostu
    vaphau prishtodarayostu babhau nyaset | makaram hridaye nyasya jive va pancavimshake || || nabhipayudare
    guhye yaralavanvinikshipet | shashau kundalayoshshirsham hare ca katisutrake || || sahau hridabje
    harde ca lamapadashikhe nyaset | kshanca shirshadi padantam matrikanyasa esha tu || || asya shrihayagrivasahasranama
    stotramahamantrasya shrihayagriva rishih | anushtup chandah shrihayagriva paramatma devata hamsa iti
    bijam | hamsohamiti shaktih hamsam hamsimiti kilakam om om omityastram | shrih shriyah iti kavacam
    shrivibhushana iti hridayam | parorajah param brahmeti yonih vidyamurtirvishvatma iti dhyanam | hamsamangushthabhyam
    namah hamsim tarjanibhyam namah | hamsum madhyamabhyam namah hamsom anamikabhyam namah | hamsaum kanishthikabhyam
    namah hamsah karatalakaraprishthabhyam namah | evam hridayadinyasah | hamsam jnanaya hridayaya namah
    hamsim aishvaryaya shirase svaha | hamsum shaktayai shikhayai vashat hamsom balaya kavacaya hum |
    hamsaum tejase netrabhyam vaushat | hamsah viryayastraya phat omiti digbandhah | atha matrikanyasah
    | om am am bhruvoh rim rim nasikayoh | lrim lrim kapolayoh om om dantapanktyoh | am jihvatale ah jihvamule
    | kavargam dakshine bahumule kurpare manibandhe karatale hastagre | cavargam vame bahumule kurpare
    manibandhe karatale hastagre | tavargam dakshine padamule januni padaparshnau padatale padagre | tavargam
    vame padamule januni padaparshnau padatale padagre | paphau parshvayoh mam hridi | yam ram lam vam
    nabhau payau udare guhye shashau hastayoh | sahau shirshe katyam lakshau hridabje harde uti matrikanyasah
    | vidyamurtimakhandacandravalayashvetaravindasthitam hridyabham sphatikadrinirmalatanum vidyotamanamshriya
    | vamankasthitavallabham prati sadavyakhyantamamnayava garthanadimapurusham hayamukham dhyayami hamsatmakam
    || || vishvatma vishadaprabhapratilasadvagdevatamandalo devo dakshinapaniyugmavilasadbodhankacakrayudhah
    | vamodagrakare daram taditarenashlishya doshna ramam hastagre dhritapustakassa dayatam hamso hiranyacchadah
    || || atha sahasranamastotraprarambhah | om shrim hamso hamai mom klim shrishshriyashshrivibhushanah
    | parorajah param brahma bhurbhuvassuvaradimah || || bhasvanbhagashca bhagavansvastisvaha namassvadha
    | shraushadvaushadhalam hum phat hum hrim krom hlaum yatha tatha || || karkagrivah kalanathah kamadah
    karunakarah | kamaladhyushitotsangah kshaye kalivashanugah || || nishacchopanishaccatha nicairuccaissamam
    saha | shashvadyugapadahvaya shanaireko bahudhruvah || || bhutabhridbhuridassakshi bhutadih punyakirtanah
    | bhuma bhumiradhonnaddhah puruhutah purushtutah || || praphullapundarikakshah parameshthi prabhavanah
    | prabhurbhagahsatam bandhurbhayadhvamsi bhavapanah || || udyannurushayahum kridurugaya urukramah
    | udarastriyugastryatma nidanam nalayo harih || || hiranyagarbho hemango hiranyashmashrurishita |
    hiranyakesho himaha hemavasa hitaishanah || || adityamandalantastho modamanassamuhanah | sarvatma
    jagadadharassannidhissaravansvabhuh || || gopatirgohito gomi keshavah kinnareshvarah | mayi mayavikritikrinmaheshano
    mahamahah || || mama mimi mumu mrimrim mlumlum memaim tathaiva ca | momaum bindurvisargashca hrasvodirghah
    plutassvarah || || udattashcanudattashca svaritah pracayastatha | kam kham gam gham mam ca cam cham
    jam jham nam tam thameva ca || || dam dham nam tam tham ca dam ca dham nam pam pham bameva ca bham
    mam yam ram lam ca vam ca sham sham sam ham lameva ca || || ksham yamom vyanjano jihvamuliyo''rdhavisargavan
    | upadhmaniya iti ca samyuktakshara eva ca || || padam kriya karakashca nipato gatiravyayah | sannidhiryogyata''kanksha
    parasparasamanvayah || || vakyam padyam sampradayo bhavashshabdarthalalitah | vyanjana lakshana shaktih
    pako ritiralankritih || || shayya phraudhadhvanistadvatkavyam sargah kriya rucih | nanarupaprabandhashca
    yashah punyam mahaddhanam || || vyavaharaparijnanam shivetaraparikshayah | sadah paramanirvanam priyapathyopadeshakah
    || || samskarah pratibha shiksha grahanam dharanam shramah | asutasvadima citram vistarashcitrasamvidhih
    || || puranamitihasashca smritisutram ca samhita | acara atmana tushtiracaryajnanatikramah || || shrimanshrigihshriyah
    kantashshrinidhishshriniketanah | shreyanhayananashridashshrimayashshritavatsalah || || hamsashshucishadadityo
    vasushcandro''ntarikshasat | hota ca vedishadyoniratithirdronasaddhavih || || nrishanmrityushca varasadamritam
    cartasadvrishah | vyomasadvividhaskotashabdarthavyangyavaibhavah || || abja rasasvadutamo goja geyo
    manoharah | ritajassakalam bhadramadrijasthairyamuttamam || || ritam samajnatvanritam brihatsukshmavashanugah
    | satyam jnanamanantam yattatsadbrahmamayo''cyutah || || agrebhavannago nityah paramah purushottamah
    | yoganidraparassvami nidhyanavaranirvrinah || || raso rasyo rasayita rasavan rasikapriyah | anando
    nandayansarvananandi hayakandharah || || kalah kalyashca kalatma kalabhyutthitajagarah | kalasacivyakritkantakathitavyadhikaryakah
    || || drinnyancanodancanodyallayasargo laghukriyah | vidyasahayo vagisho matrikamandalikutah || ||
    hiranyam hamsamithunamishanashshaktiman jayi | grahamethi guni shribhunilalilaikalalasa || || ankenoduhya
    vagdevimacaryakamupashrayah | vedavedantashastrarthatattvavyakhyanatatparah || || lhaum hlam ham ham
    hayo ham sum hamsam hamsim hasum hasaum | hasum ham harino hari harikesho hareditah || || sanatano
    nirbijassannavyakto hridayeshayah | aksharah ksharajiveshah kshami kshayakaro''cyutah || || kartakarayita''karyam
    karanam prakritih kritih | kshayakshayamanamartho vishnurjishnurjaganmayah || || sankucanvikacansthanunirvikaro
    niramayah | shuddho buddhah prabuddhashca snigdho mugdhassamuddhatah || || sankalpado bahubhavatsarvatma
    sarvanamabhrit | sahasrashirshassarvajnassahasrakshassahasrapat || || vyaktoviratsvaratsamradvishvagrupavapurvidhuh
    | mayavi paramanando manyo mayatigo mahan || || vatapatrashayo balo lalannamnayasucakah | mukhanyastakaragrastapadagrapatalah
    prabhuh || || naidrihasashvasambhutajnajnasatvikatamasah | maharnavambuparyankah padmanabhah paratparah
    || || brahmabhurbrahmabhayahriddhariromupadeshakrit | madhukaitabhanirmata mattabrahmamadapahah ||
    || vedhovilasavaganirdayasaro mrisharthadah | narayanastranirmatamadhukaitabhamardanah || || vedakarta
    vedabharta vedaharta vidamvarah | punkhanupunkhaheshadhyah purnashadgunyavigrahah || || lalamritakanavyajavantanirdoshavarnakah
    | ullolasvanadhirodyaduccairhalahaladhvanih || || karnadarabhya kalkyatma kavih kshirarnavopamah |
    shankha cakragadi khadgi sharngi nirbhayamudrakah || || cinmudracihnito hastatalavinyastapustakah
    | vidyanamnim shriyam shishyam vedayannijavaibhavam || || ashtarnyamyo''shtabhujovyashtisrishtikarah
    pita | ashtaishvaryapradohrishyadashtamurtipitristutah || || anitavedapurusho vidhivedopadeshakrit
    | vedavedangavedantapuranasmritimurtiman || || sarvakarmasamaradhyassarvavedamayo vibhuh | sarvarthatattvavyakhyata
    catushshashtikaladhipah || || shubhayuksumukhashshuddhassurupassugatassudhih | suvratissamhritishshurassutapah
    sushtutissuhrit || || sundarassubhagassaumyassukhadassuhridam priyah | sucaritrassukhatarashshuddhasatvapradayakah
    || || rajastamoharo virovishvarakshadhurandharah | naranarayanakritya gurushishyatvamasthitah || ||
    paravaratma prabalah pavanah papanashanah | dayaghanah kshamasaro vatsalyaikavibhushanah || || adikurmo
    jagadbharta mahapotri mahidharah | stadbhitsvami hariryaksho hiranyaripuraicchikah || || prahladapalakassarvabhayaharta
    priyamvadah | shrimukhalokanasramsatkrauncakah kuhakancanah || || chatri kamandaludharo vamano vadatam
    varah | pishunatma shanodrishtilopano balimardanah || || uruktamo balishironyastanghrirbalimardanah
    | jamadagnyah parashubhritkrittakshattrakulottamah || || ramo''bhiramashshantatma harakodandakhandanah
    | sharanagatasantrata sarvayodhyakamuktidah || || sankarshanomadodagro balavanmusalayudhah | krishnakleshaharah
    krishno mahavyasanashantidah || || angaritottaragarbhapranadah parthasarathih | gitacaryo dharabharahari
    shatpuramardanah || || kalki vishnuyashassunuh kalikalushyanashanah | sadhudushkritparitranavinashavihitodayah
    || || vaikunthe parame tishthan sukumarayuvakritih | vishvodayasthitidhvamsasankalpena svayam prabhuh
    || || madananam ca madano manikotiramanitah | mandaramalikapido manikundalamanditah || || susnigdhanilakutilakuntalah
    komalakritih | sulalatasstutilakassubhrukassukapolakah || || siddhasadasadalokasudhasyandiradacchadah
    | tarakakorakakaravinirmitaradacchadah || || sudhavartiparisphurtishobhamanaradacchadah | vishtabdhovipulagrivonibhritoccaishshravasthitih
    || || samavrittavadatorumuktapralambabhushanah | ratnangadi vajranishki nilaratnankakankanah || ||
    harinmaniganabaddhashrinkhalakankanormikah | sitopavitasamshlishyatpadmakshamanimalikah || || shricurnavaddvadashordhvapundrarekhaparishkritah
    | pattatantugrathanavatpavitranarashobhitah || || pinavakshamahaskandho vipulorukatitatah | kaustubhi
    vanamali ca kantyacandrayutopamah || || mandaramalikamodi manjuvagamalacchavih | divyagandho divyaraso
    divyateja divaspatih || || vacalo vakpatirvakta vyakhyata vadinam priyah | bhaktahrinmadhuro vadijihvabhadrananasthitih
    || || smritisannihitassnigdhassiddhidasiddhisannutah | mulakandomukundoglaussvayambhushambhuraindavah
    || || ishto manuryamah kalakalyah kambukalanidhih | kalyah kamayita bhimah kataryaharanah kritih ||
    || sampriyah pakkanastarkacarcanirdharanadayah | vyatireko vivekashca pravekah prakramah kramah ||
    || pramana pratibhuh prajnah prajnapatthyacadharanah | vidhirvidhata vyavadhirudbhavah prabhavasthitih
    || || vishayassamshayah purvah pakshah kakshyopapadakah | raddhanto vihito nyayaphalanishpattirudbhavah
    || || nanarupani tantrani vyavaharyo vyavasthitih | sarvasadharano devassadhvasadhuhite ratah || ||
    sandha sanatano dharmo dharmairarcya mahatmabhih | chandomayastridhamatma svacchandashchandaseditah
    || || yajno yajnatmako yashta yajnango''paghanohavih | samidajyam purodashashshala sthali sruvassruca
    || || pragvamsho devayajanah paridhishca paristarah | vedirviharanam treta pashuh pashashca samskritih
    || || vidhirmantro''rthavadashca dravyamangam ca daivatam | stotram shastram sama gitirudgithassarvasadhanam
    || || yajya puronukavya ca samidheni samuhanam | prayoktarah prayogashca prapancah prashubha shramah
    || || shraddha pradhvamsana tushtih pushtih punyam pratirbhavah | sadassadasyasampatah prashnah prativacasthitih
    || || prayashcittam parishkaro dhritirnirvahanam phalam | niyogo bhavana bhavyam hiranyam dakshina
    nutih || || ashirabhyupapattishca triptissvam sharma kevalama | punyakshayah punah patabhayam shikshashugardanah
    || || karpanyam yatanam cinta nirvedashca vihastata | dehabhritkarmasampatah kincitkarmanukulakah
    || || ahetukataya prema sammukhyam capyanugrahah | shucishshrimatkulajano neta sattvabhimanavan ||
    || antarayaharah pitroradushtaharadayakah | shuddhaharanurupangaparinamavidhayakah || || sravapatadivipadam
    pariharta parayanah | shirahpanyadisandhata kshemakritpranadah prabhu || || anirghrinashcavishamashshaktitritayadayakah
    | svecchaprasangasampattivyajaharshavisheshavan || || samvitsandhayakassarvajanmakleshasmritipradah
    | vivakeshokavairagyabhavabhitividhayakah || || garbhasyapyanukuladinasantadhyavasayadah | shubhavaijananopetasadanehojanipradah
    || || uttamayuhprado brahmanishthanugrahakarakah | svadasajananistirnatadvamshajaparamparah || ||
    shrivaishnavotpadakritasvastikavanimandalah | adharvanoktaikashatamrityudurakriyaparah || || dayadyashtagunadhata
    tattatsamskritisadhakah | medhavidhata shraddhakrit sausthyado jamitaharah || || vighnanudvijayi dhata
    deshakalanukulyakrit | vineta satpathaneta doshahricchubhadassakha || || hrido bhido rucikaro vishvo
    vishvahite ratah | pramadahritpraptakari pradyumno balavattarah || || sangavedasamayokta sarvashastrarthavittidah
    | brahmacaryantarayaghnah priyakriddhitakritparah || || cittashuddhipradashchinnakshacapalyah kshamavahah
    | indriyartharaticchetta vidyaikavyasanavahah || || atmanukulyarucikridakhilartivinashakah | titirshuhrittvaravedi
    gurusadbhaktitejasah || || gurusambandhaghatako guruvishvasavardhanah | gurupasanasandhata gurupremapravardhanah
    || || acaryabhimatairyokta pancasamskritibhavanah | guruktavrittinaishcalyasandhata''vahitasthitih
    || || apannakhilaraksharthamacaryakamupashritah | shastrapanipradanena bhavamagnansamuddharan || ||
    pancakalikadharmeshu naishcalyam pratipadayan | svadasaradhanadyarthashuddhadravyapradayakah || ||
    nyasavidyavinirvodha nyastatmabhararakshakah | svakainkaryaikarucidassvadasyapremavardhanah || ||
    acaryarthakhiladravyasambhrityarpanarocakah | acaryasya svasacchishyojjivanaikarucipradah || || agatyayojayanasahitaikakritijagarah
    | brahmavidyasamasvadasuhitah kritisamskritih || || satkare vishadhidata tarunyam shavabuddhidah |
    sabhampratyayayanvyalim sarvatra samabuddhidah || || sambhavitasheshadoshahritpunarnyasarocakah |
    mahavishvasasandhata sthairyadata madapahah || || nadavyakhyasvasiddhantarakshahetusvamantradah |
    svamantrajapasamsiddhijanghalakavitodayah || || adushtagunavatkavyabandhavyamugdhacetanah | vyangyapradhanarasavadgadyapadyadinirmitih
    || || svabhaktastutisantushto bhuyobhaktipradayakah | satvikatyagasampannasatkarmakridatipriyah ||
    || nirantaranusmarananijadasaivadasyakrit | nishkamavatsalo naicyabhavaneshu vinirvishan || || sarvabhutabhavadbhavam
    sampashyatsusadasthitah | karanatrayasarupyakalyanapatisadarah || || kada kadeti kainkaryakaminam
    sheshitambhajana | paravyuhadinirdoshashubhashrayaparigrahah || || candramandalamadhyasya shvetambhoruhavishtarah
    | jyotsnayamanangarucinirdhutantarbahistamah || || bhavyo bhavayita bhadram parijatavanalayah | kshirabdhimadhyamadvipapalakah
    prapitamahah || || nirantaranamovakashuddhayajihadashrayah | muktidashvetamridrupashvetadvipavibhavanah
    || || garudaharitashvetamritputayadubhudharah | bhadrashvavarshanilayo bhayahari shubhashrayah ||
    || bhadrashrivatsaharadhyah pancaratrapravartakah | bhaktatmabhavabhavano hardo''ngushthapramanavan
    || || svadasasatkritakritye tanmitrarishu yojayan | prananutkramayannurikritaprarabdhalopanah || ||
    ladhvyaiva shikshayapapamasheshamapi nirnudan | tristhunakshobhato bhutasukshmyaissukshmavapussrijan
    || || nirankushakripapuro nityakalyanakarakah | murdhanyanadya svandasanbrahmarandhradudancayan ||
    || upasanaparansarvan prarabdhamanubhavayan | sarvaprarabdhadehante''pyantimasmaranam dishan || ||
    prapeyusham bhejusham ca yamadrishtimabhavayan | divyadehapradassuryam dvarayanmokshameyusham || ||
    ativahikasatkaranadhvanyapadya manayan | sarvankratubhujashshashvatprabhritani pradapayan || || durantamayakantaram
    drutam yogen langhayan | sphayatsudarshavividhavithyantenadhvana nayan || || simantasindhuvirajam
    yogenottarayanvashi | amanavasya devasya karam shirasi dharayan || || anadivasanam dhunvan vaikunthaptya
    salokayan | aheyamangalodaratanudanatsarupayana || || surijushtam sukhaikantam paramam padamapayan
    | araranyamritambhodhi darshayan shramanashanah || || divyodyanasarovapisarinmaninagannayana | airammadamritasarogamayansupabrimhanah
    || || ashvattham somasavanam prapayanvishtarashravah | divyapsarassamanitabrahmalankaradayakah ||
    || divyavaso''njanakshaumamalyaissvanbahumanayan | sviyamayodhyam nagarim sadaram sampraveshayan ||
    || dasandivyarasalokagandhamsalasharirayan | svadasansurivargena sasneham bahumanayan || || surisevoditanandanaicyansvanatishayayan
    | vacayansvam namovipsam kurvanprahvankritanjalin || || prakaragopuraramaprasadebhyah pranamayan |
    indraprajapatidvarapalasammanamapayan || || malikancanmaharajavithimadhyam nivasayan | shrivaikunthapurandhribhirnanasatkarakarakah
    || || divyam vimanam gamayan brahmakantyabhipurayan | mahanandatmakashrimanmanimandapamapayan || ||
    hrishyatkumudacandadyairvishvaksenantikam nayan | seneshacoditasthananayako hetinayakah || || prapayandivyamasthanam
    vainateyam pranamayan | shrimatsundarasurindradivyapanktim pranamayan || || bhasvarasanaparyankaprapanena
    kritarthayan | paryankavidyasamsiddhasarvavaibhavasangatah || || svatmanameva shrikantam sadaram bhuri
    darshayan | sheshataikaratim shesham shayyatmanam pranamayan || || anantakshidvisahasrasadaralokapatrayan
    | akumarayuvakaram shrikantam sampranamayan || || atatanandato heto rancayankilikincitam | dasanatyutthitamuhuhkritisrishtiprasannahrit
    || || shriyam prapasvayam tatam jivam putram praharshayan | majjayan svamukhambhodhau svakam kirtirucim
    dishan || || dayardragangavalanakritahladaih kritarthayan | paryankarohanaprahvam samam lakshmyopapadayan
    || || kastvamityanuyunjano daso''smityuktivismitah | aprithaktvaprakaro''smi vacasvashritavadbhavan
    || || vidusham tatkratunayaddhayasyavapushabhavan | vasudevatmana bhuyo bhavanvaikunthanayakah ||
    || yatha tathaiva svam rupam jaganmohanamurtiman | dvimurti bahumurtishca atmanashca prakashayan ||
    || yugapatsakalam sakshatsvatah kartum samarthayan | kavinamadishannityam muktanamadimah kavih ||
