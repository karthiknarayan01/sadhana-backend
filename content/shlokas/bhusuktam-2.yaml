id: bhusuktam-2
category: sukta
name:
  english: bhusuktam
  devanagari: भूसूक्तम्
content:
  english: shaddhama̱ vira̭jati̱ vakpa̭ta̱ngaya̭ shishriye | praṱyasya vaha̱ dyubhi̭h|| a̱sya pra̱nada̭pana̱tya̭ntashca̭rati
    roca̱na | vya̭khyan mahi̱shah suva̭h|| yatt
  devanagari: शद्धाम॒ विरा॑जति॒ वाक्प॑त॒ङ्गाय॑ शिश्रिये । प्रत्॑यस्य वह॒ द्युभिः॑॥ अ॒स्य प्रा॒णाद॑पान॒त्य॑न्तश्च॑रति
    रोच॒ना । व्य॑ख्यन् महि॒षः सुवः॑॥ यत्त्
meaning: {}
