id: parabrahmopanishat
category: upanishad
name:
  english: parabrahmopanishat
  devanagari: परब्रह्मोपनिषत्
content:
  english: sastanubhih || vyashema devahitam yadayuh || svasti na indro vriddhashravah || svasti nah pusha
    vishvavedah || svasti nastarkshyo arishtanemih || svasti no brihaspatirdadhatu || om shantih shantih
    shantih || harih om || atha hainam mahashalah shaunako'ngirasam bhagavantam pippaladam vidhivadupasannah
    papraccha divye brahmapure ke sampratishthita bhavanti | katham srijyante | nityatmana esha mahima
    | vibhajya esha mahima vibhuh | ka eshah | tasmai sa hovaca | etatsatyam yatprabravimi brahmavidyam
    varishtham devebhyah pranebhyah | parabrahmapure virajam nishkalam shubhamaksharam virajam vibhati
    | sa niyacchati madhukarah shveva vikarmakah | akarma svamiva sthitah | karmatarah karshakavatphalamanubhavati
    | karmamarmajnata karma karoti | karmamarma jnatva karma kuryat | ko jalam vikshipedeko nainamapakarshatyapakarshati
    | pranadeva shcatvarah | tah sarva nadyah sushuptashyenakashavat | yatha shyenah khamashritya yati
    svamalayam kulayam | evam sushuptam bruta | ayam ca parashca sa sarvatra hiranmaye pare koshe | amrita
    hyesha nadi trayam samcarati | tasya tripadam brahma | eshatreshya tato'nutishthati | anyatra bruta
    | ayam ca param ca sarvatra hiranmaye koshe | yathaisha devadatto yashtya ca tadyamano naivaiti |
    evamishtapurtakarmashubhashubhairna lipyate | yatha kumarako nishkama anandamabhiyati | tathaisha
    devah svapna anandamabhiyati veda eva param jyotih | jyotishama jyotiranandayatyevameva | tatparam
    yaccittam paramatmana manandayati | shubhravarnamajayateshvarat | bhuyastenaiva margena svapnasthanam
    niyacchati | jalukabhavavadyatha kamamajayateshvarat | tavatatmanamanandayati | parasandhi yadaparasandhiti
    | tatparam naparam tyajati | tadaiva kapalashtakam sandhaya ya esha stana ivavalambate sendrayonih
    sa vedayoniriti | atra jagrati | shubhashubhatiriktah shubhashubhairapi karmabhirna lipyate | ya esha
    devo'nyadevasya samprasado'ntaryamyasangacidrupah purushah | pranavahamsah param brahma | na pranahamsah
    | pranavo jivah | adya devata nivedayati | ya evam veda | tatkatham nivedayate | jivasya brahmatvamapadayati
    | sattvamathasya purushasyantah shikhopavitatvam brahmanasya | mumukshorantah shikhopavitadharanam
    | bahirlakshyamanashikhayajnopavitadharanam karmino grihasthasya | antarupavitalakshanam tu bahistantuvadavyaktamantastattvamelanam
    | na sannasanna sadasadbhinnabhinnam na cobhayam | na sabhagam na nirbhagam na capyubhayarupakam ||
    brahmatmaikatvavijnanam heyam mithyatvakaranaditi | pancapadbrahmano na kimcana | catushpadantarvartino'nta
    rjivabrahmanashcatvari sthanani | nabhihridayakanthamurdhasu jagratsvapnasushuptituriyavasthah | ahavaniyagarhapatya
    dakshinasabhyagnishu | jagarite brahma svapne vishnuh sushuptau rudrasturiyamaksharam cinmayam | tasmaccaturavastha
    | caturangulaveshtanamiva shannavatitattvani tantuvadvibhajya tada hitam trigunikritya dvatrimshattattvanishkarshamapadya
    jnanaputam trigunasvarupam trimurtitvam prithagvijnaya navabrahmakhyanavagunopetam jnatva navamanamitastrigunikritya
    suryendvagnikalasvarupatvenaikikrityadyantarekatvamapi madhye triravritya brahmavishnumaheshvaratvamanusamdhayadyantamekikritya
    cidgranthavadvaitagranthim kritva nabhyadibrahmabilapramanam prithak prithak saptavimshatitattvasambandham
    trigunopetam trimurtilakshanalakshitamapyekatvamapadya vamamsadidakshinakanthyantam vibhavyadyantagrahasammelanamekam
    jnatva mulamekam satyam mrinmayam vijnatam syadvacarambhanam vikaro namadheyam mrittiketyeva satyam
    | hamseti varnadvayenantah shikhopavititvam nishcitya brahmanatvam brahmadhyanarhatvam yatitvamalakshitantahshikhopavititvamevam
    bahirlakshitakarmashikha jnanopavitam grihasthasyabhasabrahmanatvasya keshasamuhashikhapratyakshakarpasatantu
    kritopavitatvam caturgunikritya caturvimshatitattvapadanatantukrittvam navatattvamekameva || parambrahma
    tatpratisarayogyatvadbahumargapravrittim kalpayanti | sarvesham brahmadinam devarshinam manushyanam
    murtireka | brahmaikameva | brahmanatvamekameva | varnashramacaravisheshah prithakprithak shikhavarnashraminamekakaiva
    | apavargasya yateh shikhayajnopavitamulam pranavamekameva vadanti | hamsah shikha | pranava upavitam
    | nadah samdhanam | esha dharmo netaro dharmah | tatkathamiti | pranavahamso nadastrivritsutram svahridi
    caitanye tishthati trividham brahma | tadviddhi prapancikashikhopavitam tyajet | sashikham vapanam
    kritva bahihsutram tyajedbudhah | yadaksharam parambrahma tatsutramiti dharayet || 1|| punarjanmanivrityartham
    mokshasyaharnisham smaret | sucanatsutramityuktam sutram nama param padam || 2|| tatsutram viditam
    yena sa mumukshuh sa bhikshukah | sa vedavitsadacarah sa viprah panktipavanah || 3|| yena sarvamidam
    protam sutre manigana iva | tatsutram dharayedyogi yogavidbrahmano yatih || 4|| bahihsutram tyajedvipro
    yogavijnanatatparah | brahmabhavamidam sutram dharayedyah sa muktibhak || 5|| nashucitvam na cocchishtam
    tasya sutrasya dharanat | sutramantargatam yesham jnanayajnopavitinam || 6|| ye tu sutravido loke
    te ca yajnopavitinah | jnanashikhino jnananishtha jnanayajnopavitinah | jnanameva param tesham pavitram
    jnanamiritam || 7|| agneriva shikha nanya yasya jnanamayi shikha | sa shikhityucyate vidvannetare
    keshadharinah || 8|| karmanyadhikritah ye tu vaidike laukike'pi va | brahmanabhasamatrena jivante
    kukshipurakah | vrajante nirayam te tu punarjanmani janmani || 9|| vamamsadakshakanthyantam brahmasutram
    tu savyatah | antarbahirivatyartham tattvatantusamanvitam || 10|| nabhyadibrahmarandhrantapramanam
    dharayetsudhih | tebhirdharyamidam sutram kriyangam tantunirmitam || 11|| shikha jnanamayi yasya upavitam
    ca tanmayam | brahmanyam sakalam tasya netaresham tu kimcana || 12|| idam yajnopavitam tu paramam
    yatparayanam | vidvanyajnopaviti samdharayedyah sa muktibhak || 13|| bahirantashcopaviti viprah samnyastumarhati
    | ekayajnopaviti tu naiva samnyastumarhati || 14|| tasmatsarvaprayatnena mokshapekshi bhavedyatih
    | bahihsutram parityajya svantahsutram tu dharayet || 15|| bahihprapancashikhopavititvamanadritya
    pranavahamsashikhopavititvamavalambya mokshasadhanam kuryadityaha bhagavanchaunaka ityupanishat ||
    om bhadram karnebhih shrinuyama devah || bhadram pashyemakshabhiryajatrah || sthirairangaistushtuva
  devanagari: सस्तनूभिः ॥ व्यशेम देवहितं यदायुः ॥ स्वस्ति न इन्द्रो वृद्धश्रवाः ॥ स्वस्ति नः पूषा विश्ववेदाः
    ॥ स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः ॥ स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः
    ॐ ॥ अथ हैनं महाशालः शौनकोऽङ्गिरसं भगवन्तं पिप्पलादं विधिवदुपसन्नः पप्रच्च्ह दिव्ये ब्रह्मपुरे के संप्रतिष्ठिता
    भवन्ति । कथं सृज्यन्ते । नित्यात्मन एष महिमा । विभज्य एष महिमा विभुः । क एषः । तस्मै स होवाच । एतत्सत्यं
    यत्प्रब्रवीमि ब्रह्मविद्यां वरिष्ठां देवेभ्यः प्राणेभ्यः । परब्रह्मपुरे विरजं निष्कलं शुभमक्षरं विरजं
    विभाति । स नियच्च्हति मधुकरः श्वेव विकर्मकः । अकर्मा स्वामीव स्थितः । कर्मतरः कर्षकवत्फलमनुभवति ।
    कर्ममर्मज्ञाता कर्म करोति । कर्ममर्म ज्ञात्वा कर्म कुर्यात् । को जालं विक्षिपेदेको नैनमपकर्षत्यपकर्षति
    । प्राणदेवा श्चत्वारः । ताः सर्वा नाड्यः सुषुप्तश्येनाकाशवत् । यथा श्येनः खमाश्रित्य याति स्वमालयं
    कुलायम् । एवं सुषुप्तं ब्रूत । अयं च परश्च स सर्वत्र हिरण्मये परे कोशे । अमृता ह्येषा नाडी त्रयं संचरति
    । तस्य त्रिपादं ब्रह्म । एषात्रेष्य ततोऽनुतिष्ठति । अन्यत्र ब्रूत । अयं च परं च सर्वत्र हिरण्मये कोशे
    । यथैष देवदत्तो यष्ट्या च ताड्यमानो नैवैति । एवमिष्टापूर्तकर्मशुभाशुभैर्न लिप्यते । यथा कुमारको निष्काम
    आनन्दमभियाति । तथैष देवः स्वप्न आनन्दमभियाति वेद एव परं ज्योतिः । ज्योतिषामा ज्योतिरानन्दयत्येवमेव
    । तत्परं यच्चित्तं परमात्मान मानन्दयति । शुभ्रवर्णमाजायतेश्वरात् । भूयस्तेनैव मार्गेण स्वप्नस्थानं
    नियच्च्हति । जलूकाभाववद्यथा काममाजायतेश्वरात् । तावतात्मानमानन्दयति । परसन्धि यदपरसन्धीति । तत्परं
    नापरं त्यजति । तदैव कपालष्टकं सन्धाय य एष स्तन इवावलम्बते सेन्द्रयोनिः स वेदयोनिरिति । अत्र जाग्रति
    । शुभाशुभातिरिक्तः शुभाशुभैरपि कर्मभिर्न लिप्यते । य एष देवोऽन्यदेवास्य संप्रसादोऽन्तर्याम्यसङ्गचिद्रूपः
    पुरुषः । प्रणवहंसः परं ब्रह्म । न प्राणहंसः । प्रणवो जीवः । आद्या देवता निवेदयति । य एवं वेद । तत्कथं
    निवेदयते । जीवस्य ब्रह्मत्वमापादयति । सत्त्वमथास्य पुरुषस्यान्तः शिखोपवीतत्वं ब्राह्मणस्य । मुमुक्षोरन्तः
    शिखोपवीतधारणम् । बहिर्लक्ष्यमाणशिखायज्ञोपवीतधारणं कर्मिणो गृहस्थस्य । अन्तरुपवीतलक्षणं तु बहिस्तन्तुवदव्यक्तमन्तस्तत्त्वमेलनम्
    । न सन्नासन्न सदसद्भिन्नाभिन्नं न चोभयम् । न सभागं न निर्भागं न चाप्युभयरूपकम् ॥ ब्रह्मात्मैकत्वविज्ञानं
    हेयं मिथ्यत्वकारणादिति । पञ्चपाद्ब्रह्मणो न किंचन । चतुष्पादन्तर्वर्तिनोऽन्त र्जीवब्रह्मणश्चत्वारि
    स्थानानि । नाभिहृदयकण्ठमूर्धसु जाग्रत्स्वप्नसुषुप्तितुरीयावस्थाः । आहवनीयगार्हपत्य दक्षिणसभ्याग्निषु
    । जागरिते ब्रह्मा स्वप्ने विष्णुः सुषुप्तौ रुद्रस्तुरीयमक्षरं चिन्मयम् । तस्माच्चतुरवस्था । चतुरङ्गुलवेष्टनमिव
    षण्णवतितत्त्वानि तन्तुवद्विभज्य तदा हितं त्रिगुणीकृत्य द्वात्रिंशत्तत्त्वनिष्कर्षमापाद्य ज्ञानपूतं
    त्रिगुणस्वरूपं त्रिमूर्तित्वं पृथग्विज्ञाय नवब्रह्माख्यनवगुणोपेतं ज्ञात्वा नवमानमितस्त्रिगुणीकृत्य
    सूर्येन्द्वग्निकलास्वरूपत्वेनैकीकृत्याद्यन्तरेकत्वमपि मध्ये त्रिरावृत्य ब्रह्मविष्णुमहेश्वरत्वमनुसंधायाद्यन्तमेकीकृत्य
    चिद्ग्रन्थावद्वैतग्रन्थिं कृत्वा नाभ्यादिब्रह्मबिलप्रमाणं पृथक् पृथक् सप्तविंशतितत्त्वसंबन्धं त्रिगुणोपेतं
    त्रिमूर्तिलक्षणलक्षितमप्येकत्वमापाद्य वामांसादिदक्षिणकण्ठ्यन्तं विभाव्याद्यन्तग्रहसंमेलनमेकं ज्ञात्वा
    मूलमेकं सत्यं मृण्मयं विज्ञातं स्याद्वाचारम्भणं विकारो नामधेयं मृत्तिकेत्येव सत्यम् । हंसेति वर्णद्वयेनान्तः
    शिखोपवीतित्वं निश्चित्य ब्राह्मणत्वं ब्रह्मध्यानार्हत्वं यतित्वमलक्षितान्तःशिखोपवीतित्वमेवं बहिर्लक्षितकर्मशिखा
    ज्ञानोपवीतं गृहस्थस्याभासब्रह्मणत्वस्य केशसमूहशिखाप्रत्यक्षकार्पासतन्तु कृतोपवीतत्वं चतुर्गुणीकृत्य
    चतुर्विंशतितत्त्वापादनतन्तुकृत्त्वं नवतत्त्वमेकमेव ॥ परंब्रह्म तत्प्रतिसरयोग्यत्वाद्बहुमार्गप्रवृत्तिं
    कल्पयन्ति । सर्वेषां ब्रह्मादीनां देवर्षीणां मनुष्याणां मूर्तिरेका । ब्रह्मैकमेव । ब्राह्मणत्वमेकमेव
    । वर्णाश्रमाचारविशेषाः पृथक्पृथक् शिखावर्णाश्रमिणामेककैव । अपवर्गस्य यतेः शिखायज्ञोपवीतमूलं प्रणवमेकमेव
    वदन्ति । हंसः शिखा । प्रणव उपवीतम् । नादः संधानम् । एष धर्मो नेतरो धर्मः । तत्कथमिति । प्रणवहंसो नादस्त्रिवृत्सूत्रं
    स्वहृदि चैतन्ये तिष्ठति त्रिविधं ब्रह्म । तद्विद्धि प्रापञ्चिकशिखोपवीतं त्यजेत् । सशिखं वपनं कृत्वा
    बहिःसूत्रं त्यजेद्बुधः । यदक्षरं परंब्रह्म तत्सूत्रमिति धारयेत् ॥ १॥ पुनर्जन्मनिवृत्यर्थं मोक्षस्याहर्निशं
    स्मरेत् । सूचनात्सूत्रमित्युक्तं सूत्रं नाम परं पदम् ॥ २॥ तत्सूत्रं विदितं येन स मुमुक्षुः स भिक्षुकः
    । स वेदवित्सदाचारः स विप्रः पङ्क्तिपावनः ॥ ३॥ येन सर्वमिदं प्रोतं सूत्रे मणिगणा इव । तत्सूत्रं धारयेद्योगी
    योगविद्ब्राह्मणो यतिः ॥ ४॥ बहिःसूत्रं त्यजेद्विप्रो योगविज्ञानतत्परः । ब्रह्मभावमिदं सूत्रं धारयेद्यः
    स मुक्तिभाक् ॥ ५॥ नाशुचित्वं न चोच्च्हिष्टं तस्य सूत्रस्य धारणात् । सूत्रमन्तर्गतं येषां ज्ञानयज्ञोपवीतिनाम्
    ॥ ६॥ ये तु सूत्रविदो लोके ते च यज्ञोपवीतिनः । ज्ञानशिखिनो ज्ञाननिष्ठा ज्ञानयज्ञोपवीतिनः । ज्ञानमेव
    परं तेषां पवित्रं ज्ञानमीरितम् ॥ ७॥ अग्नेरिव शिखा नान्या यस्य ज्ञानमयी शिखा । स शिखीत्युच्यते विद्वान्नेतरे
    केशधारिणः ॥ ८॥ कर्मण्यधिकृतः ये तु वैदिके लौकिकेऽपि वा । ब्राह्मणाभासमात्रेण जीवन्ते कुक्षिपूरकाः
    । व्रजन्ते निरयं ते तु पुनर्जन्मनि जन्मनि ॥ ९॥ वामांसदक्षकण्ठ्यन्तं ब्रह्मसूत्रं तु सव्यतः । अन्तर्बहिरिवात्यर्थं
    तत्त्वतन्तुसमन्वितम् ॥ १०॥ नाभ्यादिब्रह्मरन्ध्रान्तप्रमाणं धारयेत्सुधीः । तेभिर्धार्यमिदं सूत्रं क्रियाङ्गं
    तन्तुनिर्मितम् ॥ ११॥ शिखा ज्ञानमयी यस्य उपवीतं च तन्मयम् । ब्राह्मण्यं सकलं तस्य नेतरेषां तु किंचन
    ॥ १२॥ इदं यज्ञोपवीतं तु परमं यत्परायणम् । विद्वान्यज्ञोपवीती संधारयेद्यः स मुक्तिभाक् ॥ १३॥ बहिरन्तश्चोपवीती
    विप्रः संन्यस्तुमर्हति । एकयज्ञोपवीती तु नैव संन्यस्तुमर्हति ॥ १४॥ तस्मात्सर्वप्रयत्नेन मोक्षापेक्षी
    भवेद्यतिः । बहिःसूत्रं परित्यज्य स्वान्तःसूत्रं तु धारयेत् ॥ १५॥ बहिःप्रपञ्चशिखोपवीतित्वमनादृत्य प्रणवहंसशिखोपवीतित्वमवलम्ब्य
    मोक्षसाधनं कुर्यादित्याह भगवाञ्च्हौनक इत्युपनिषत् ॥ ॐ भद्रं कर्णेभिः शृणुयाम देवाः ॥ भद्रं पश्येमाक्षभिर्यजत्राः
    ॥ स्थिरैरङ्गैस्तुष्टुवा
