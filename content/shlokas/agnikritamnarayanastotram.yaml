id: agnikritamnarayanastotram
category: stotram
name:
  english: agnikritamnarayanastotram
  devanagari: अग्निकृतंनारायणस्तोत्रम्
content:
  english: agnikritam narayanastotram agniruvaca | vishuddhavijnanaghanam puranam sanatanam vishvasrijam
    patim gurum | anekamekam jagadekanatham namamyanantashritashuddhabuddhim || 33|| mayamayim shaktimupetya
    vishvakarttaramuddishya rajopayuktam | sattvena casya sthitihetumugramatho tamobhigrasitaramide ||
    34|| avidyaya vishvavimohitatma vidyaikarupam vitatam trilokyam | vidya''shritatvatsakalajnamisham
    tvavidyaya jivamaham prapadye || 35|| bhaktecchaya''vishkritadehayogamabhogabhogarpitayogayogam |
    kausheyapitambarajushtashaktim vicitrashaktyashtamayeshtamide || 36|| iti shriskandapurane vaishnavakhande
    badarikashramamahatmye dvitiyadhyayantargatam agnikritam narayanastotram samaptam | skandapurana |
    vaishnavakhanda | badarikakhanda | adhyaya 2
  devanagari: अग्निकृतं नारायणस्तोत्रम् अग्निरुवाच । विशुद्धविज्ञानघनं पुराणं सनातनं विश्वसृजां पतिं गुरुम्
    । अनेकमेकं जगदेकनाथं नमाम्यनन्ताश्रितशुद्धबुद्धिम् ॥ ३३॥ मायामयीं शक्तिमुपेत्य विश्वकर्त्तारमुद्दिश्य
    रजोपयुक्तम् । सत्त्वेन चास्य स्थितिहेतुमुग्रमथो तमोभिग्रसितारमीडे ॥ ३४॥ अविद्यया विश्वविमोहितात्मा
    विद्यैकरूपं विततं त्रिलोक्याम् । विद्याऽऽश्रितत्वात्सकलज्ञमीशं त्वविद्यया जीवमहं प्रपद्ये ॥ ३५॥ भक्तेच्छयाऽऽविष्कृतदेहयोगमाभोगभोगार्पितयोगयोगम्
    । कौशेयपीताम्बरजुष्टशक्तिं विचित्रशक्त्यष्टमयेष्टमीडे ॥ ३६॥ इति श्रीस्कन्दपुराणे वैष्णवखण्डे बदरिकाश्रममाहात्म्ये
    द्वितीयाध्यायान्तर्गतं अग्निकृतं नारायणस्तोत्रं समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । बदरिकाखण्ड ।
    अध्याय २
