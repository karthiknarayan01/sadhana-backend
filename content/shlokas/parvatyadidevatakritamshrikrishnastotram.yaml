id: parvatyadidevatakritamshrikrishnastotram
category: stotram
name:
  english: parvatyadidevatakritamshrikrishnastotram
  devanagari: पार्वत्यादिदेवताकृतंश्रीकृष्णस्तोत्रम्
content:
  english: 100|| munaya ucuh | vedanpathitva vidvamso vayam kim vedakaranam | stotumisha na vani ca tvam
    vanmanasayoh param || 101|| sarasvatyuvaca | vagadhishthatridevim mam vadante vedavadinah | kincinna
    shakta tvam stotumaho vanmanasoh param || 102|| savitryuvaca | vedaprasuraham natha srishtva tvatkalaya
    pura | kim staumi strisvabhavena sarvakaranakaranam || 103|| lakshmi uvaca | tvadamshavishnukantaham
    jagatposhanakarini | kim staumi tvatkalasrishta jagatam bijakaranam || 104|| himalaya uvaca | hasanti
    santo mam natha karmana sthavaram param | stotum samudyatam kshudrah kim staumi stotumakshamah ||
    105|| kramena sarve tam stutva deva viraramurmune | devyashca munayah sarve parvati stotumudyata ||
    106|| dhautavastra jatabharam bibhrati suvrata vrate | prerita paramatmanam vrataradhyam shivena ca
    || 107|| jvaladagnishikharupa tejomurtimati sati | tapasam phalada mata jagatam sarvakarmanam || 108||
    parvatyuvaca | krishna janasi mam bhadra naham tvam jnatumishvari | ke va jananti vedajna veda va
    vedakarakah || 109|| tvadamshastvam na jananti katham jnasyanti te kalah | tvam capi tattvam janasi
    kimanye jnatumishvarah || 7
  devanagari: १००॥ मुनय उचुः । वेदान्पठित्वा विद्वांसो वयं किं वेदकारणम् । स्तोतुमीशा न वाणी च त्वां वाङ्मनसयोः
    परम् ॥ १०१॥ सरस्वत्युवाच । वागधिष्ठातृदेवीं मां वदन्ते वेदवादिनः । किञ्चिन्न शक्ता त्वां स्तोतुमहो
    वाङ्मनसोः परम् ॥ १०२॥ सावित्र्युवाच । वेदप्रसूरहं नाथ सृष्ट्वा त्वत्कलया पुरा । किं स्तौमि स्त्रीस्वभावेन
    सर्वकारणकारणम् ॥ १०३॥ लक्ष्मी उवाच । त्वदंशविष्णुकान्ताहं जगत्पोषणकारिणी । किं स्तौमि त्वत्कलासृष्टा
    जगतां बीजकारणम् ॥ १०४॥ हिमालय उवाच । हसन्ति सन्तो मां नाथ कर्मणा स्थावरं परम् । स्तोतुं समुद्यतं क्षुद्रः
    किं स्तौमि स्तोतुमक्षमः ॥ १०५॥ क्रमेण सर्वे तं स्तुत्वा देवा विररमुर्मुने । देव्यश्च मुनयः सर्वे पार्वती
    स्तोतुमुद्यता ॥ १०६॥ धौतवस्त्रा जटाभारं बिभ्रती सुव्रता व्रते । प्रेरिता परमात्मानं व्रताराध्यं शिवेन
    च ॥ १०७॥ ज्वलदग्निशिखारूपा तेजोमूर्तिमती सती । तपसां फलदा माता जगतां सर्वकर्मणाम् ॥ १०८॥ पार्वत्युवाच
    । कृष्ण जानासि मां भद्र नाहं त्वां ज्ञातुमीश्वरी । के वा जानन्ति वेदज्ञा वेदा वा वेदकारकाः ॥ १०९॥
    त्वदंशास्त्वां न जानन्ति कथं ज्ञास्यन्ति ते कलाः । त्वं चापि तत्त्वं जानासि किमन्ये ज्ञातुमीश्वराः
    ॥ ७
