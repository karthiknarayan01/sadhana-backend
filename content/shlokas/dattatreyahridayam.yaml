id: dattatreyahridayam
category: hridaya
name:
  english: dattatreyahridayam
  devanagari: दत्तात्रेयहृदयम्
content:
  english: rinu bhagavatottama || 7|| mandah svajno bhramamstrishnanadyemam lokamagatah | karmayogena
    muktisvarmohadvaram yadricchaya || 8|| nivritto'smyatra yatatam vyatyayam vikshya sharmane | atmano'sya
    sukham rupam klishte nashte svayam prabham || 9|| jnatva samsparshajanbhoganduhkhatsvapsyami daivabhuk
    | vismrityamum janah svartham santam yatyugrasamsritim || 10|| svartham mayavritam tyaktva tadarthyanyatra
    dhavati | shaivalachannakam tyaktva yathambvarthi maricikam || 11|| abhagyasya kriya moghah sukhapraptyai
    prayojitah | tatsaphalye'pyasadbhih kim karyam matryasya kricchrajaih || 12|| kamartecchormohashokaragadveshashramadayah
    | yato'jitatmano naiti nidrapi bhayashankaya || 13|| pranartheccha hi madhukricchikshitena mayojhjhita
    | rajarthihimsracoradvitkalebhyo na bibhemyatah || 14|| niricchah paritushtatma yadricchalabhato'smi
    san | bahukalam shaye no cedvidvan dhairyanmahahivat || 15|| bhuryalpam svadu va'svadu kadannam manavarjitam
    | samanam kvapi bhunje'hni nishi bhuktvapi va na va || 16|| haratyanyah patim hatva kricchraptam madhuvaddhanam
    | shikshitam madhukritto'to virakto'smyaparigrahah || 17|| daivaptam carma valkam va vastram kshaumam
    vase na va | kvacicchaye'shmabhasmadau kashipau va jane vane || 18|| kvacitsnato'lankrito'ham sragvi
    suvasano na va | rathebhashvaushcare kvapi munivatkvapi mugdhavat || 19|| naham ninde na ca staumi
    svabhavavishamam naram | etesham shreya ashasa utaikatmyamathatmani || 20|| brahmasakto brahmanishtho
    brahmatma brahmadhiraham | samskrite brahmane'ntye va samadriggavi shunyapi || 21|| samasamabhyam
    vishamasame pujata odanam | nadyadityajnagrihino dosho na samadrigyateh || 22|| svarupe'vasanastishthamyanvikshikya'naya
    divi | yo'mumicchettu tasyayamupayo vidushah sukhah || 23|| hunedvikalpam cittau tam manasyarthabhrame
    tu tat | vaikarike tam mayayam tam svasminviramettatah || 24|| shuddhah so'ham paratmaika iti dardhye
    vimucyate | hridayam me suguptam te proktam tattvam vicaraya || 25|| itishenopadishtah sa jnatvatmanam
    prapujya ca | tadajnapto yayau rajyam kurvannapi sa daivabhuk || 26|| rajyashriputradaradhyo'liptah
    svatmadriksada | bhuktvarabdham ciram rajyam datva putre virocane || 27|| muktasangashcacara kshmam
    samadriksa guruktavat || iti shrivasudevanandasarasvativiracitam shridattapuranantargatam shridattatreyahridayam
    sampurnam |
  devanagari: ृणु भागवतोत्तम ॥ ७॥ मन्दः स्वज्ञो भ्रमंस्तृष्णानद्येमं लोकमागतः । कर्मयोगेन मुक्तिस्वर्मोहद्वारं
    यदृच्छया ॥ ८॥ निवृत्तोऽस्म्यत्र यततां व्यत्ययं वीक्ष्य शर्मणे । आत्मनोऽस्य सुखं रूपं क्लिष्टे नष्टे
    स्वयं प्रभम् ॥ ९॥ ज्ञात्वा संस्पर्शजान्भोगान्दुःखात्स्वप्स्यामि दैवभुक् । विस्मृत्यामुं जनः स्वार्थं
    सन्तं यात्युग्रसंसृतिम् ॥ १०॥ स्वार्थं मायावृतं त्यक्त्वा तदर्थ्यन्यत्र धावति । शैवालछन्नकं त्यक्त्वा
    यथाम्ब्वर्थी मरीचिकाम् ॥ ११॥ अभाग्यस्य क्रिया मोघाः सुखप्राप्त्यै प्रयोजिताः । तत्साफल्येऽप्यसद्भिः
    किं कार्यं मत्र्यस्य कृच्छ्रजैः ॥ १२॥ कामार्तेच्छोर्मोहशोकरागद्वेषश्रमादयः । यतोऽजितात्मनो नैति निद्रापि
    भयशङ्कया ॥ १३॥ प्राणार्थेच्छा हि मधुकृच्छिक्षितेन मयोझ्झिता । राजार्थिहिंस्रचोरद्विट्कालेभ्यो न बिभेम्यतः
    ॥ १४॥ निरिच्छः परितुष्टात्मा यदृच्छालाभतोऽस्मि सन् । बहुकालं शये नो चेद्विद्वान् धैर्यान्महाहिवत्
    ॥ १५॥ भूर्यल्पं स्वादु वाऽस्वादु कदन्नं मानवर्जितम् । समानं क्वापि भुञ्जेऽह्नि निशि भुक्त्वापि वा
    न वा ॥ १६॥ हरत्यन्यः पतिं हत्वा कृच्छ्राप्तं मधुवद्धनम् । शिक्षितं मधुकृत्तोऽतो विरक्तोऽस्म्यपरिग्रहः
    ॥ १७॥ दैवाप्तं चर्म वल्कं वा वस्त्रं क्षौमं वसे न वा । क्वचिच्छयेऽश्मभस्मादौ कशिपौ वा जने वने ॥ १८॥
    क्वचित्स्नातोऽलङ्कृतोऽहं स्रग्वी सुवसनो न वा । रथेभाश्वौश्चरे क्वापि मुनिवत्क्वापि मुग्धवत् ॥ १९॥
    नाहं निन्दे न च स्तौमि स्वभावविषमं नरम् । एतेषां श्रेय आशास उतैकात्म्यमथात्मनि ॥ २०॥ ब्रह्मासक्तो
    ब्रह्मनिष्ठो ब्रह्मात्मा ब्रह्मधीरहम् । संस्कृते ब्राह्मणेऽन्त्ये वा समदृग्गवि शुन्यपि ॥ २१॥ समासमाभ्यां
    विषमसमे पूजात ओदनम् । नाद्यादित्यज्ञगृहिणो दोषो न समदृग्यतेः ॥ २२॥ स्वरूपेऽवासनस्तिष्ठाम्यान्वीक्षिक्याऽनया
    दिवि । योऽमुमिच्छेत्तु तस्यायमुपायो विदुषः सुखः ॥ २३॥ हुनेद्विकल्पं चित्तौ तां मनस्यर्थभ्रमे तु तत्
    । वैकारिके तं मायायां तां स्वस्मिन्विरमेत्ततः ॥ २४॥ शुद्धः सोऽहं परात्मैक इति दार्ढ्ये विमुच्यते ।
    हृदयं मे सुगुप्तं ते प्रोक्तं तत्त्वं विचारय ॥ २५॥ इतीशेनोपदिष्टः स ज्ञात्वात्मानं प्रपूज्य च । तदाज्ञप्तो
    ययौ राज्यं कुर्वन्नपि स दैवभुक् ॥ २६॥ राज्यश्रीपुत्रदाराढ्योऽलिप्तः स्वात्मदृक्सदा । भुक्त्वारब्धं
    चिरं राज्यं दत्वा पुत्रे विरोचने ॥ २७॥ मुक्तसङ्गश्चचार क्ष्मां समदृक्स गुरूक्तवत् ॥ इति श्रीवासुदेवानन्दसरस्वतीविरचितं
    श्रीदत्तपुराणान्तर्गतं श्रीदत्तात्रेयहृदयं सम्पूर्णम् ।
