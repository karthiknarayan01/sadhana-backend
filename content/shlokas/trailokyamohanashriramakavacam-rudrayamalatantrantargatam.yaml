id: trailokyamohanashriramakavacam-rudrayamalatantrantargatam
category: kavacha
name:
  english: trailokyamohanashriramakavacam (rudrayamalatantrantargatam)
  devanagari: त्रैलोक्यमोहनश्रीरामकवचम् (रुद्रयामलतन्त्रान्तर्गतम्)
content:
  english: rinu vakshyami deveshi kavacam paramadbhutam | atyantam gopanam guhyam brahmamantraughavigraham
    || 3|| om pranavo me shirah patu tarako brahmarupakah | ananto'gnyasanah sendurnasamekaksharo'vatu
    || 1|| om ram ramaya namah patu bhadvarno bhuktimuktidah | bhalam payannetrayugmam ramo dvayaksharasamjnakah
    || 2|| om klim payacchrotrayugmam hyakaksharavimohanah | om hrim shrim klim namo ramaya mukham me
    parirakshatu || 3|| om namah shri raghavendraya kantham patu manustvayam | om klim shrim ram ramaya
    namah skandhau patu kharantakah || 4|| om namo ram ramacandraya mantrah patu bhujadvayam | om shrimadramabhadraya
    karau patu manusvarat || 5|| om shriramacandraya rakshoghnaya namo mantro'yam dvadashaksharah | hridayam
    me sada patu raghuvamshasamudbhavah || 6|| om klim ramabhadraya namah patu nabhim dushtantakah prabhuh
    | om namah shriramacandraya katimashtaksharo'vatu || 7|| sakthini satatam patu rakshasendra vimarda
    kah | om hrim ramacandraya namah patu me uruyugmakam || 8|| om pranavo ramacandraya namo vasvaksharah
    svarat | januni me sada patu rakshahkulavinashakah || 9|| om pranavo ramabhadraya namo'shtaksharasvayam
    | padayugmam sada patu vanarendrashriyah pradah || 10|| om namo ramabhadraya sarvanga patu sarvatah
    | om hrim sitapataye namah pracyam mam sarvadavatu || 11|| om him janakivallabhaya dakshine patu sarvada
    | om klim janakishaya namo varunyam mam sadavatu || 12|| om shrim raghunathaya namah kauberya dishi
    rakshatu | om hrim janakivallabhaya agneyam mam sadavatu || 13|| om hrim klim bharatagrajaya patu
    mam nairityam dishi | om shrim janakivallabhaya vayavyam mam sadavatu || 14|| om shrim hrim klim dasharathaya
    ceshanyam raksha mam sada | om namo bhagavate raghunandanaya rakshoghnavishadaya madhuraprasannavadanaya
    amitatejase balaya ramaya vishnave namah || 15|| pranavadinamo'nto'yam malamantra udiritah | rajyasthane
    sada patu raghuvamshasamudbhavah || 16|| om namo bhagavate shriramaya mahapurushaya namah | ashtadashaksharo
    mantro mameva sarvadavatu || 17|| dhyayeddhritpundarikaksham paranjyotih paratparam | ramameva param
    brahma saccidanandalakshanam || 18|| iti dhyatva japenmantram bhuktimuktipradayakam | om dasharathaya
    vidmahe sitapriyaya dhimahi | tanno ramah pracodayat || 19|| ityevam ramagayatri bhaktiviryapravardhini
    | gayatri japamatrena bhuktimuktipradayani || 20|| iti te kathitam devi
  devanagari: ृणु वक्ष्यामि देवेशि कवचं परमाद्भुतम् । अत्यन्तं गोपनं गुह्यं ब्रह्ममन्त्रौघविग्रहम् ॥ ३॥
    ॐ प्रणवो मे शिरः पातु तारको ब्रह्मरूपकः । अनन्तोऽग्न्यासनः सेन्दुर्नासामेकाक्षरोऽवतु ॥ १॥ ॐ रां रामाय
    नमः पातु भाड्वर्णो भुक्तिमुक्तिदः । भालं पायान्नेत्रयुग्मं रामो द्वयक्षरसंज्ञकः ॥ २॥ ॐ क्लीं पायाच्छ्रोत्रयुग्मं
    ह्यकाक्षरविमोहनः । ॐ ह्रीं श्रीं क्लीं नमो रामाय मुखं मे परिरक्षतु ॥ ३॥ ॐ नमः श्री राघवेन्द्राय कण्ठं
    पातु मनुस्त्वयम् । ॐ क्लीं श्रीं रां रामाय नमः स्कन्धौ पातु खरान्तकः ॥ ४॥ ॐ नमो रां रामचन्द्राय मन्त्रः
    पातु भुजद्वयम् । ॐ श्रीमद्रामभद्राय करौ पातु मनुस्वराट् ॥ ५॥ ॐ श्रीरामचन्द्राय रक्षोघ्नाय नमो मन्त्रोऽयं
    द्वादशाक्षरः । हृदयं मे सदा पातु रघुवंशसमुद्भवः ॥ ६॥ ॐ क्लीं रामभद्राय नमः पातु नाभिं दुष्टान्तकः
    प्रभुः । ॐ नमः श्रीरामचन्द्राय कटिमष्टाक्षरोऽवतु ॥ ७॥ सक्थिनी सततं पातु राक्षसेन्द्र विमर्द कः । ॐ
    ह्रीं रामचन्द्राय नमः पातु मे ऊरूयुग्मकम् ॥ ८॥ ॐ प्रणवो रामचन्द्राय नमो वस्वक्षरः स्वराट् । जानुनी
    मे सदा पातु रक्षःकुलविनाशकः ॥ ९॥ ॐ प्रणवो रामभद्राय नमोऽष्टाक्षरस्वयम् । पादयुग्मं सदा पातु वानरेन्द्रश्रियः
    प्रदः ॥ १०॥ ॐ नमो रामभद्राय सर्वाङ्ग पातु सर्वतः । ॐ ह्रीं सीतापतये नमः प्राच्यां मां सर्वदावतु ॥
    ११॥ ॐ हीं जानकीवल्लभाय दक्षिणे पातु सर्वदा । ॐ क्लीं जानकीशाय नमो वारुण्यां मां सदावतु ॥ १२॥ ॐ श्रीं
    रघुनाथाय नमः कौबेर्या दिशि रक्षतु । ॐ ह्रीं जानकीवल्लभाय आग्नेयां मां सदावतु ॥ १३॥ ॐ ह्रीं क्लीं भरताग्रजाय
    पातु मां नैऋत्यां दिशि । ॐ श्रीं जानकीवल्लभाय वायव्यां मां सदावतु ॥ १४॥ ॐ श्रीं ह्रीं क्लीं दाशरथाय
    चेशान्यां रक्ष मां सदा । ॐ नमो भगवते रघुनन्दनाय रक्षोघ्नविषदाय मधुरप्रसन्नवदनाय अमिततेजसे बलाय रामाय
    विष्णवे नमः ॥ १५॥ प्रणवादिनमोऽन्तोऽयं मालामन्त्र उदीरितः । राज्यस्थाने सदा पातु रघुवंशसमुद्भवः ॥ १६॥
    ॐ नमो भगवते श्रीरामाय महापुरुषाय नमः । अष्टादशाक्षरो मन्त्रो मामेव सर्वदावतु ॥ १७॥ ध्यायेद्धृत्पुण्डरीकाक्षं
    परञ्ज्योतिः परात्परम् । राममेव परं ब्रह्म सच्चिदानन्दलक्षणम् ॥ १८॥ इति ध्यात्वा जपेन्मन्त्रं भुक्तिमुक्तिप्रदायकम्
    । ॐ दाशरथाय विद्महे सीताप्रियाय धीमहि । तन्नो रामः प्रचोदयात् ॥ १९॥ इत्येवं रामगायत्री भक्तिवीर्यप्रवर्धिनी
    । गायत्री जपमात्रेण भुक्तिमुक्तिप्रदायनी ॥ २०॥ इति ते कथितं देवि
