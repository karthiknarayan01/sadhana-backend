id: galavakritamsudarshanacakrastotram
category: stotram
name:
  english: galavakritamsudarshanacakrastotram
  devanagari: गालवकृतंसुदर्शनचक्रस्तोत्रम्
content:
  english: galavakritam sudarshanacakrastotram galava uvaca | vishnucakram namaste'stu vishvarakshanadikshita
    | narayanakarambhojabhushanaya namo'stu te || 98|| yuddheshvasurasamharakushalaya maharava | sudarshana
    namastubhyam bhaktanamartinashine || 99|| raksha mam bhayasamvignam sarvasmadapi kalmashat | svaminsudarshana
    vibho dharmartirthe sada bhavan || 1
  devanagari: गालवकृतं सुदर्शनचक्रस्तोत्रम् गालव उवाच । विष्णुचक्रं नमस्तेऽस्तु विश्वरक्षणदीक्षित । नारायणकराम्भोजभूषणाय
    नमोऽस्तु ते ॥ ९८॥ युद्धेष्वसुरसंहारकुशलाय महारव । सुदर्शन नमस्तुभ्यं भक्तानामार्तिनाशिने ॥ ९९॥ रक्ष
    मां भयसंविग्नं सर्वस्मादपि कल्मषात् । स्वामिन्सुदर्शन विभो धर्मर्तीर्थे सदा भवान् ॥ १
meaning: {}
