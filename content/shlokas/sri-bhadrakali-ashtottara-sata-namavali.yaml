id: sri-bhadrakali-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Bhadrakali Ashtottara Sata Namavali
content:
  english: om bhadrakalyai namah | om kamarupayai namah | om mahavidyayai namah | om yashasvinyai namah
    | om mahashrayayai namah | om mahabhagayai namah | om dakshayagavibhedinyai namah | om rudrakopasamudbhutayai
    namah | om bhadrayai namah | om mudrayai namah | | om shivankaryai namah | om candrikayai namah |
    om candravadanayai namah | om roshatamrakshashobhinyai namah | om indradidamanyai namah | om shantayai
    namah | om candralekhavibhushitayai namah | om bhaktartiharinyai namah | om muktayai namah | om candikanandadayinyai
    namah | | om saudaminyai namah | om sudhamurtyai namah | om divyalankarabhushitayai namah | om suvasinyai
    namah | om sunasayai namah | om trikalajnayai namah | om dhurandharayai namah | om sarvajnayai namah
    | om sarvalokeshyai namah | om devayonaye namah | | om ayonijayai namah | om nirgunayai namah | om
    nirahankarayai namah | om lokakalyanakarinyai namah | om sarvalokapriyayai namah | om gauryai namah
    | om sarvagarvavimardinyai namah | om tejovatyai namah | om mahamatre namah | om kotisuryasamaprabhayai
    namah | | om virabhadrakritanandabhoginyai namah | om virasevitayai namah | om naradadimunistutyayai
    namah | om nityayai namah | om satyayai namah | om tapasvinyai namah | om jnanarupayai namah | om
    kalatitayai namah | om bhaktabhishtaphalapradayai namah | om kailasanilayayai namah | | om shubhrayai
    namah | om kshamayai namah | om shriyai namah | om sarvamangalayai namah | om siddhavidyayai namah
    | om mahashaktyai namah | om kaminyai namah | om padmalocanayai namah | om devapriyayai namah | om
    daityahantryai namah | | om dakshagarvapaharinyai namah | om shivashasanakartryai namah | om shaivanandavidhayinyai
    namah | om bhavapashanihantryai namah | om savanangasukarinyai namah | om lambodaryai namah | om mahakalyai
    namah | om bhishanasyayai namah | om sureshvaryai namah | om mahanidrayai namah | | om yoganidrayai
    namah | om prajnayai namah | om vartayai namah | om kriyavatyai namah | om putrapautrapradayai namah
    | om sadhvyai namah | om senayuddhasukankshinyai namah | om shambhave icchayai namah | om kripasindhave
    namah | om candyai namah | | om candaparakramayai namah | om shobhayai namah | om bhagavatyai namah
    | om mayayai namah | om durgayai namah | om nilayai namah | om manogatyai namah | om khecaryai namah
    | om khadginyai namah | om cakrahastayai namah | om shulavidharinyai namah | om subanayai namah |
    om shaktihastayai namah | om padasancarinyai namah | om parayai namah | om tapahsiddhipradayai namah
    | om devyai namah | om virabhadrasahayinyai namah | om dhanadhanyakaryai namah | om vishvayai namah
    | | om manomalinyaharinyai namah | om sunakshatrodbhavakaryai namah | om vamshavriddhipradayinyai
    namah | om brahmadisurasamsevyayai namah | om shankaryai namah | om priyabhashinyai namah | om bhutapretapishacadiharinyai
    namah | om sumanasvinyai namah | om punyakshetrakritavasayai namah | om pratyakshaparameshvaryai namah
    | iti shri bhadrakali ashtottarashatanamavalih |
  devanagari: ॐ भद्रकाल्यै नमः । ॐ कामरूपायै नमः । ॐ महाविद्यायै नमः । ॐ यशस्विन्यै नमः । ॐ महाश्रयायै
    नमः । ॐ महाभागायै नमः । ॐ दक्षयागविभेदिन्यै नमः । ॐ रुद्रकोपसमुद्भूतायै नमः । ॐ भद्रायै नमः । ॐ मुद्रायै
    नमः । । ॐ शिवङ्कर्यै नमः । ॐ चन्द्रिकायै नमः । ॐ चन्द्रवदनायै नमः । ॐ रोषताम्राक्षशोभिन्यै नमः । ॐ
    इन्द्रादिदमन्यै नमः । ॐ शान्तायै नमः । ॐ चन्द्रलेखाविभूषितायै नमः । ॐ भक्तार्तिहारिण्यै नमः । ॐ मुक्तायै
    नमः । ॐ चण्डिकानन्ददायिन्यै नमः । । ॐ सौदामिन्यै नमः । ॐ सुधामूर्त्यै नमः । ॐ दिव्यालङ्कारभूषितायै
    नमः । ॐ सुवासिन्यै नमः । ॐ सुनासायै नमः । ॐ त्रिकालज्ञायै नमः । ॐ धुरन्धरायै नमः । ॐ सर्वज्ञायै नमः
    । ॐ सर्वलोकेश्यै नमः । ॐ देवयोनये नमः । । ॐ अयोनिजायै नमः । ॐ निर्गुणायै नमः । ॐ निरहङ्कारायै नमः
    । ॐ लोककल्याणकारिण्यै नमः । ॐ सर्वलोकप्रियायै नमः । ॐ गौर्यै नमः । ॐ सर्वगर्वविमर्दिन्यै नमः । ॐ तेजोवत्यै
    नमः । ॐ महामात्रे नमः । ॐ कोटिसूर्यसमप्रभायै नमः । । ॐ वीरभद्रकृतानन्दभोगिन्यै नमः । ॐ वीरसेवितायै
    नमः । ॐ नारदादिमुनिस्तुत्यायै नमः । ॐ नित्यायै नमः । ॐ सत्यायै नमः । ॐ तपस्विन्यै नमः । ॐ ज्ञानरूपायै
    नमः । ॐ कलातीतायै नमः । ॐ भक्ताभीष्टफलप्रदायै नमः । ॐ कैलासनिलयायै नमः । । ॐ शुभ्रायै नमः । ॐ क्षमायै
    नमः । ॐ श्रियै नमः । ॐ सर्वमङ्गलायै नमः । ॐ सिद्धविद्यायै नमः । ॐ महाशक्त्यै नमः । ॐ कामिन्यै नमः
    । ॐ पद्मलोचनायै नमः । ॐ देवप्रियायै नमः । ॐ दैत्यहन्त्र्यै नमः । । ॐ दक्षगर्वापहारिण्यै नमः । ॐ शिवशासनकर्त्र्यै
    नमः । ॐ शैवानन्दविधायिन्यै नमः । ॐ भवपाशनिहन्त्र्यै नमः । ॐ सवनाङ्गसुकारिण्यै नमः । ॐ लम्बोदर्यै नमः
    । ॐ महाकाल्यै नमः । ॐ भीषणास्यायै नमः । ॐ सुरेश्वर्यै नमः । ॐ महानिद्रायै नमः । । ॐ योगनिद्रायै नमः
    । ॐ प्रज्ञायै नमः । ॐ वार्तायै नमः । ॐ क्रियावत्यै नमः । ॐ पुत्रपौत्रप्रदायै नमः । ॐ साध्व्यै नमः
    । ॐ सेनायुद्धसुकाङ्क्षिण्यै नमः । ॐ शम्भवे इच्छायै नमः । ॐ कृपासिन्धवे नमः । ॐ चण्ड्यै नमः । । ॐ चण्डपराक्रमायै
    नमः । ॐ शोभायै नमः । ॐ भगवत्यै नमः । ॐ मायायै नमः । ॐ दुर्गायै नमः । ॐ नीलायै नमः । ॐ मनोगत्यै नमः
    । ॐ खेचर्यै नमः । ॐ खड्गिन्यै नमः । ॐ चक्रहस्तायै नमः । ॐ शूलविधारिण्यै नमः । ॐ सुबाणायै नमः । ॐ शक्तिहस्तायै
    नमः । ॐ पादसञ्चारिण्यै नमः । ॐ परायै नमः । ॐ तपःसिद्धिप्रदायै नमः । ॐ देव्यै नमः । ॐ वीरभद्रसहायिन्यै
    नमः । ॐ धनधान्यकर्यै नमः । ॐ विश्वायै नमः । । ॐ मनोमालिन्यहारिण्यै नमः । ॐ सुनक्षत्रोद्भवकर्यै नमः
    । ॐ वंशवृद्धिप्रदायिन्यै नमः । ॐ ब्रह्मादिसुरसंसेव्यायै नमः । ॐ शाङ्कर्यै नमः । ॐ प्रियभाषिण्यै नमः
    । ॐ भूतप्रेतपिशाचादिहारिण्यै नमः । ॐ सुमनस्विन्यै नमः । ॐ पुण्यक्षेत्रकृतावासायै नमः । ॐ प्रत्यक्षपरमेश्वर्यै
    नमः । इति श्री भद्रकाली अष्टोत्तरशतनामावलिः ।
