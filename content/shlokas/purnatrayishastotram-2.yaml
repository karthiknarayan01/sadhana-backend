id: purnatrayishastotram-2
category: stotram
name:
  english: purnatrayishastotram 2
  devanagari: पूर्णत्रयीशस्तोत्रम् २
content:
  english: '|| 40|| krishnashlakshnavatarat prabhriti nijapadapraptiparyantalilah pratah kale pathed yah
    prashamitakaranah so''pi vaikunthamiyat | ittham vyasoktito''ham caritamakaravam tavakam sangrahena
    stotram bhuyanmadiyam bhavabhayashamanam tvatprasadadihaitat || 41|| viprat tvam sanjanishyasyatulasukritinah
    shambhalagramamukhyad vikhyatah kalkinamna turagamurujavam yo''dhiruhyattakhadgah | durvrittan sarvamartyan
    jhatiti patutaya pothayitva prithivyam dharmam samsthapayishyasyapi vipulatamam pahi purnatrayisha'
  devanagari: ॥ ४०॥ कृष्णश्लक्ष्णावतारात् प्रभृति निजपदप्राप्तिपर्यन्तलीलाः प्रातः काले पठेद् यः प्रशमितकरणः
    सोऽपि वैकुण्ठमीयात् । इत्थं व्यासोक्तितोऽहं चरितमकरवं तावकं सङ्ग्रहेण स्तोत्रं भुयान्मदीयं भवभयशमनं
    त्वत्प्रसादादिहैतत् ॥ ४१॥ विप्रात् त्वं सञ्जनिष्यस्यतुलसुकृतिनः शम्भलग्राममुख्याद् विख्यातः कल्किनाम्ना
    तुरगमुरुजवं योऽधिरुह्यात्तखड्गः । दुर्वृत्तान् सर्वमर्त्यान् झटिति पटुतया पोथयित्वा पृथिव्यां धर्मं
    संस्थापयिष्यस्यपि विपुलतमं पाहि पूर्णत्रयीश
meaning: {}
