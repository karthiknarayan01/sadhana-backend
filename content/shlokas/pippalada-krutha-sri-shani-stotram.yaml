id: pippalada-krutha-sri-shani-stotram
category: stotram
name:
  english: Pippalada Krutha Sri Shani Stotram
content:
  english: namo'stu konasamsthaya pingalaya namo'stu te | namaste babhrurupaya krishnaya ca namo'stu te
    || || namaste raudradehaya namaste cantakaya ca | namaste yamasanjnaya namaste sauraye vibho || ||
    namaste mandasanjnaya shanaishcara namo'stu te | prasadam kuru devesha dinasya pranatasya ca || ||
    iti pippalada krita shri shani stotram |
  devanagari: नमोऽस्तु कोणसंस्थाय पिङ्गलाय नमोऽस्तु ते । नमस्ते बभ्रुरूपाय कृष्णाय च नमोऽस्तु ते ॥ ॥ नमस्ते
    रौद्रदेहाय नमस्ते चान्तकाय च । नमस्ते यमसञ्ज्ञाय नमस्ते सौरये विभो ॥ ॥ नमस्ते मन्दसञ्ज्ञाय शनैश्चर
    नमोऽस्तु ते । प्रसादं कुरु देवेश दीनस्य प्रणतस्य च ॥ ॥ इति पिप्पलाद कृत श्री शनि स्तोत्रम् ।
