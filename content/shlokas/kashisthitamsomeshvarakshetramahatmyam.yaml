id: kashisthitamsomeshvarakshetramahatmyam
category: raksha
name:
  english: kashisthitamsomeshvarakshetramahatmyam
  devanagari: काशीस्थितंसोमेश्वरक्षेत्रमाहात्म्यम्
content:
  english: lingadeshe manohare || 522|| tatra shankarasannidhyam bhavanyashca sada dhruvam | tadrishi
    yatnatah sadhya shila shankarasamshraya || 523|| tatrarcito mahadevah prito bhavati sarvatha | tatralpapi
    krita puja shraddhaya tu shivarcakaih || 524|| sarvapapahara bhavya saiva''nantyaya kalpate | shuddhena
    bhasmana nityam navabilvadalairapi || 525|| puja karya prayatnena tatra shaivaih shivarcakaih | sa
    shila shivanamakhya iti vedaishca giyate || 526|| tadeva vimalam lingam maya sampujyate sada | yastvetallingapujayam
    prayato'tra vasennarah || 527|| na tasya yatana ghora bhairavi sa bhavishyati | kashmiralingapramukhanyanekanyamalani
    ca || 528|| santi tanyapi pujyani muktikamo yathocitam | mamatvatraiva satatam pritistishthatyanamaya
    || 529|| mayaitadeva vimalam pujyate lingamuttamam | idrisham durlabham loke lingam mokshapradayakam
    || 530|| mayapyetatprayatnena labdham lingamidam pura | idrisham prapyate loke kenacitapaso balat
    || 531|| idrishani tu lingani durlabhanyeva sarvatha | etallingasya pujayamadhikari jitendriyah ||
    532|| shivaikasharanah shaivastadanyo naiva sarvatha | atrabhishekah kartavyo rudrasuktairaghapahaih
    || 533|| bilvapatrairnavaih shuddhaih puja karya prayatnatah | dhupadipadikam sarvam shaktya karyam
    prayatnatah || 534|| pujante japaniyo'yam shaivah pancaksharah sada | idrisham lingamabhyarcya yatra
    tishthati shankarah || 535|| tatra vishveshvaro nityam nrityatyambasamanvitah | || iti shivarahasyantargate
    vishnuproktam shivamantramahimavarnanam sampurnam ||
  devanagari: लिङ्गदेशे मनोहरे ॥ ५२२॥ तत्र शङ्करसान्निध्यं भवान्याश्च सदा ध्रुवम् । तादृशी यत्नतः साध्या
    शिला शङ्करसंश्रया ॥ ५२३॥ तत्रार्चितो महादेवः प्रीतो भवति सर्वथा । तत्राल्पापि कृता पूजा श्रद्धया तु
    शिवार्चकैः ॥ ५२४॥ सर्वपापहरा भव्या सैवाऽऽनन्त्याय कल्पते । शुद्धेन भस्मना नित्यं नवबिल्वदलैरपि ॥ ५२५॥
    पूजा कार्या प्रयत्नेन तत्र शैवैः शिवार्चकैः । सा शिला शिवनामाख्या इति वेदैश्च गीयते ॥ ५२६॥ तदेव विमलं
    लिङ्गं मया सम्पूज्यते सदा । यस्त्वेतल्लिङ्गपूजायां प्रयतोऽत्र वसेन्नरः ॥ ५२७॥ न तस्य यातना घोरा भैरवी
    सा भविष्यति । काश्मीरलिङ्गप्रमुखान्यनेकान्यमलानि च ॥ ५२८॥ सन्ति तान्यपि पूज्यानि मुक्तिकामो यथोचितम्
    । ममत्वत्रैव सततं प्रीतिस्तिष्ठत्यनामया ॥ ५२९॥ मयैतदेव विमलं पूज्यते लिङ्गमुत्तमम् । ईदृशं दुर्लभं
    लोके लिङ्गं मोक्षप्रदायकम् ॥ ५३०॥ मयाप्येतत्प्रयत्नेन लब्धं लिङ्गमिदं पुरा । ईदृशं प्राप्यते लोके
    केनचितपसो बलात् ॥ ५३१॥ ईदृशानि तु लिङ्गानि दुर्लभान्येव सर्वथा । एतल्लिङ्गस्य पूजायामधिकारी जितेन्द्रियः
    ॥ ५३२॥ शिवैकशरणः शैवस्तदन्यो नैव सर्वथा । अत्राभिषेकः कर्तव्यो रुद्रसूक्तैरघापहैः ॥ ५३३॥ बिल्वपत्रैर्नवैः
    शुद्धैः पूजा कार्या प्रयत्नतः । धूपदीपादिकं सर्वं शक्त्या कार्यं प्रयत्नतः ॥ ५३४॥ पूजान्ते जपनीयोऽयं
    शैवः पञ्चाक्षरः सदा । ईदृशं लिङ्गमभ्यर्च्य यत्र तिष्ठति शाङ्करः ॥ ५३५॥ तत्र विश्वेश्वरो नित्यं नृत्यत्यम्बासमन्वितः
    । ॥ इति शिवरहस्यान्तर्गते विष्णुप्रोक्तं शिवमन्त्रमहिमावर्णनं सम्पूर्णम् ॥
