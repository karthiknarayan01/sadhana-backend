id: aparadha-kshamapana-stotram-devi
category: stotram
name:
  english: Aparadha Kshamapana Stotram (Devi)
content:
  english: aparadhasahasrani kriyante'harnisham maya | daso'yamiti mam matva kshamasva parameshvari ||
    || avahanam na janami na janami visarjanam | pujam caiva na janami kshamyatam parameshvari || || mantrahinam
    kriyahinam bhaktihinam sureshvari | yatpujitam maya devi paripurnam tadastu me || || aparadhashatam
    kritva jagadambeti coccaret | yam gatim samavapnoti na tam brahmadayah surah || || saparadho'smi sharanam
    praptastvam jagadambike | idanimanukampyo'ham yathecchasi tatha kuru || || ajnanadvismriterbhrantya
    yannyunamadhikam kritam | viparitam ca tatsarvam kshamasva parameshvari || || kameshvari jaganmatah
    saccidanandavigrahe | grihanarcamimam pritya prasida parameshvari || || yadaksharapadabhrashtam matrahinam
    ca yadbhavet | tatsarvam kshamyatam devi prasida parameshvari || || guhyatiguhyagoptri tvam grihanasmatkritam
    japam | siddhirbhavatu me devi tvatprasadanmaheshvari || || sarvarupamayi devi sarvam devimayam jagat
    | ato'ham vishvarupam tvam namami parameshvarim || || iti aparadhakshamapanastotram samaptam ||
  devanagari: अपराधसहस्राणि क्रियन्तेऽहर्निशं मया । दासोऽयमिति मां मत्वा क्षमस्व परमेश्वरि ॥ ॥ आवाहनं
    न जानामि न जानामि विसर्जनम् । पूजां चैव न जानामि क्षम्यतां परमेश्वरि ॥ ॥ मन्त्रहीनं क्रियाहीनं भक्तिहीनं
    सुरेश्वरि । यत्पूजितं मया देवि परिपूर्णं तदस्तु मे ॥ ॥ अपराधशतं कृत्वा जगदम्बेति चोच्चरेत् । यां गतिं
    समवाप्नोति न तां ब्रह्मादयः सुराः ॥ ॥ सापराधोऽस्मि शरणं प्राप्तस्त्वां जगदम्बिके । इदानीमनुकम्प्योऽहं
    यथेच्छसि तथा कुरु ॥ ॥ अज्ञानाद्विस्मृतेर्भ्रान्त्या यन्न्यूनमधिकं कृतम् । विपरीतं च तत्सर्वं क्षमस्व
    परमेश्वरि ॥ ॥ कामेश्वरि जगन्मातः सच्चिदानन्दविग्रहे । गृहाणार्चामिमां प्रीत्या प्रसीद परमेश्वरि ॥
    ॥ यदक्षरपदभ्रष्टं मात्राहीनं च यद्भवेत् । तत्सर्वं क्षम्यतां देवि प्रसीद परमेश्वरि ॥ ॥ गुह्यातिगुह्यगोप्त्री
    त्वं गृहाणास्मत्कृतं जपम् । सिद्धिर्भवतु मे देवि त्वत्प्रसादान्महेश्वरि ॥ ॥ सर्वरूपमयी देवी सर्वं
    देवीमयं जगत् । अतोऽहं विश्वरूपां त्वां नमामि परमेश्वरीम् ॥ ॥ इति अपराधक्षमापणस्तोत्रं समाप्तम् ॥
