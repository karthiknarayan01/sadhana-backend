id: acyutashatakam
category: shataka
name:
  english: acyutashatakam
  devanagari: अच्युतशतकम्
content:
  english: rinkhala tava rashana || 40|| dasanam satya drishyate danavaviranam dirghanidrashayanam | tavodarasthitatribhuvanaprasadastambhasacchayamuruyugam
    || 41|| janumanidarpanena ca janghamarakatakalacikaya ca dhanya | acyuta na muncati kantah lakshmiriva
    sarojalanchanau tava caranau || 42|| shrutisimantaprasunam shobhate natasatya tava sarvasharanyam
    | kramanakshanajanitasuranadiprashamitatrailokyapatakam padapadmam || 43|| iti tribhuvanaikamulamasvadayantyanagha
    amritasvadurasam | oshadhimahidharaparshva uditam tvamoshadhimiva dasarujam || 44|| siddhanjanamiva
    shyamam tava tanum nijavilocaneshu kshipantah | acyuta lakshminivasam nityanigudham nidhimiva pashyanti
    tvam || 45|| vighatita nibidandhakaro ghatamanajyotistrilokaikagrahapatih | drishtagato yesham tvam
    namatsatya na khalu tesham mohatriyama || 46|| vishayarase viraktah vikarajananairapi ca na khalu
    vikriyamanah | jivanmuktasadrisha acyuta drishyante pavanastava bhaktah || 47|| gandharvanagarasvapnasadrikshanam
    shriyam vanasaritam | na smarati tvadgrihitah sharanagatasadamado jivagajah || 48|| na mahayanti jnanavantah
    tarangadindirabudbudasadrikshani | vidhipramukhanam padani ghanakandalikanda kadalistambhasamani ||
    49|| drishtasvaparasvabhavah purusha grihitva svaminastava shilam | natha natasatya saghrinah na muncati
    kathamapi sarvajanasauhardam || 50|| manamadershyamatsaradambhasuyabhayamarshalobhamukhah | drishyante
    na mohasutah dosha dasanam satya tava bhaktanam || 51|| yesham matiritaramukhi kalah sakalo'pi tesham
    kalivistarah | ye tava pade pravanah nasti kalirnagapatinagarapate tesham || 52|| atyasannavinashah
    acyuta pashyanti tavake bhaktajane | moksharucinam mudha divasakaramandala iva cchidram || 53|| nitrutitadurmanaghanah
    nirmalagunaghatitatarakapragbharah | bhasamanabhaktijyotsnah natasatya sphuranti nabhonibhastava bhaktah
    || na khalu yamavishaye gatirnatasatya padambujam tava prapannanam | skhalitanamapi yathayogyam shiksha
    shuddhantakinkaranamiva laghvi || 55|| karmagatidoshaduhkhitah kritantabhrukutibhujangidarshanatrastah
    | arcanti tava caranau acyuta prabhrashtamanmatharasasvadah || 56|| alagati tava caranau acyuta vidhina'pyarcana''carita
    | yaikantaprayukta sheshamiva svayam shirasa pratigrihnasi tam || 57|| tava mukhajyotsna dravitamanasashashikantapravahasannibhabashpan
    | acyuta na muncasi bhaktan kadambagolanibhakantakayamananijangan || sarve'pi nirvairah sharanagatasatya
    grihitashashvatadharmah | gatasangastava bhaktah yanti tvameva durlabhamitaraih || 59|| ahipatinagarendra
    tvam asannamapi gaganamiva sada durgraham | vishayeshu vilagantah tvaramana api na labhante dolayamanamanasah
    || 60|| bhaktastavakasevarasabharitah sakalarakshanotsukarucina | karanani dharanti ciram kankshitamoksha
    apyacyuta tvaya sthapitah || sthiragunagirijanitaih santarayasi natasatya nijabhaktaih | janmaparipatijaladhim
    jangamasthirasetudarshaniyairjanan || 62|| prashamitabhavantarabhayah praptam praptam hitamiti paripashyantah
    | bhavayanti tava bhaktah priyatithimiva natasatya pashcimadivasam || 63|| prakatatimire bhuvane patrapratishthapitaparamajnanapradipah
    | niyante'cyuta tvaya nijam padam sada svayamprabham kritakaryah || 64|| dridhativrabhaktinayanah
    paripashyanto'hindrapuranatha tvam | praptastava sayujyam panktim purayanti pannagendramukhanam ||
    65|| sannatasulabhamacyuta samadhisopanakramavilambavimukhitah | sharanam gatva tvam mukta mucukunda
    kshatrabandhupramukhah || 66|| devanam pashusamano janturgatva devanatha tava padam | taireva sarvaih
    samsaramanairbhavati sada dattabalih || 67|| mohandhakaramaharnavamurcchitamayamaharajanipratyushah
    | acyuta tava kataksho vimuktiprasthanaprathamaparikarabandhah || 68|| mokshasukhavrikshamulam mohajaraturamaharasayanapravaram
    | sakalakushalaikakshetram kinkarasatya tava kirtanamamritanibham || 69|| nastyabhikramanasho vicchede'pi
    pratyavayaprasangah | svalpa'pi tava saparya rakshatyacyuta mahattaradbhayat || 70|| aprasade aprasannastava
    prasade dasasatya prasannah | aradhya bhavanti pare kim taih prasangalambhitaprabhavaih || 71|| itaratridashah
    prasannah kinkarasatya mama kim nu karishyanti hitam | niharaghanashatairna khalu puryate kathamapi
    catakatrishna || 72|| anugatasukhamrigatrishna acyuta vishramyati tava mamakatrishna | pravaheshu
    prasritayah ashritapravahaddhanakripasaritah || 73|| vikalasakalangavishaman dharman natasatya dhvajanibhan
    dharayan | kantarapanthaka iva skhalaccarano'smi kataravishiryamanah || 74|| sthiradharmavarmasthagitam
    adharmapravananamagraskandhapravrittam | aghatamanavipratisaramacyuta mam hasasi nunam lakshmisamaksham
    || 75|| taritumacyuta duritamasmin deha eka divase'pi kritam | kalo'lam na sakalah karunayastava purnapatramasmyayam
    || 76|| acyuta tava gunanam mama doshanamapi nasti kutrapi ganana | tathapi jayah prathamanamadhikam
    linanam bhavati na khalu daurbalyam || 77|| ratrim divasamacyuta trutitah patantyayurdrumakhandani
    | drishtvapi driptamanasam balamidanimapi bharasva mamapramattah || 78|| nishvasashankaniye dehe patalantasalilabindusadrikshe
    | janasi natasatya tvam jaratkarane'pi dirghayauvanatrishnam || 79|| ajnatanijakartavyam yadricchaya
    jnateshu mamapi pratikulagatim | iti nijasvabhavavrilitam hatum dasanam satya na khalu tava yuktam
    || 80|| ko'ham kim karaniyam pariharaniyamapi kimiti janasi sarvam | shaknoshi ca taddhitam mama tridasheshvara
    kurushva nijahridayanikshiptam || 81|| idanimuparyapyayam gunagrihito daruputraka iva paravashah |
    tasyapi mama tridasheshvara trishvapi karaneshu bhava sukhasankalpah || 82|| nijakarmanigalayugalamacyuta
    kritva mama priyapriyavarge | kada ghorakalevarakaragrihakuharanirgatam karishyasi mam || 83|| harde
    tvayi kada vishrantam brahmadhamanimargam gamishyantam | dinakaradattagrakaramacyuta drakshyasi dayita
    dimbhamiva mam || 84|| kada amanavantah agnimukha ativahikastava purushah | atilanghayishyanti mamacyuta
    tamogahanatrigunamarukantaram || 85|| langhitavirajasaritam lambhita sada shuddhasattvamaya saumyatanum
    | kritabrahmalankaram karishyasi natasatya kinkaram kada mam || 86|| samsarasagaradutkshiptam tridashanatha
    sphuritalokam | kada karishyasi hridaye kaustubhamanidarpanamiva lakshmipulakitam || 87|| kada tava
    padapadme bhavishyami natasatya kelikranta tribhuvane madanaripumakutamandanasurasaritsrotah sucitamadhupravahe
    || 88|| upanishacchirah kusumamuttamsayitva tava padambujayugaḻam | dayito bhavishyami kada daso dasanam
    satya surisadrikshah || 89|| apunarnivrittiyogyamavataraviharasahacaratvadhanyam | atmasamabhogamatramanubhavishyasi
    devanatha kada nu mam || 90|| iti sphutamanoratham mametadrishavacanamatrasaram vashagam | kurushva
    nijagunaganaih satyam dasanam satya sada svacchandah || 91|| balaplavaga iva taraḻo marutijatiriti
    sagaram taritumanah | prarthaye tvamacyuta kankshitapadapadma kshamasva mama kapeyam || 92|| acyutavishayakrantam
    bhavarnavavartabhrami nistrutyamanam | janani stanandhayamiva mamuddhritya sevasva svayam pathyam
    || 93|| karmamayagharmataptam sukhamrigatrishnabhih kada'pyatrishnakam | karaya nirvritam mam karakashishirairacyuta
    katakshaih || 94|| tava cintanavimukhanam drishtavishanamiva darshananmocayan | amritamukhanamiva
    mamacyuta bhaktanam nayasva nayanasaram || 95|| vishamilitamadhunibheshu ca trinapratimeshu ca pratigraheshu
    praluthitam | amritanidhavivacyuta sthapaya tvayi nirmamam mama hridayam || 96|| nityamasmin kripane
    nikshipa namatsatya nidhisadrikshau | pravahannakhaprabhajharaprashamitapranamatsanjvarau tava caranau
    || 97|| sharanagata iti janite janavade'pi yadyacyuta na rakshasi mam | bhavetkhalu sagaraghoshah
    sagarapuline tadrisham tava vacanam || 98|| nikshipto'smi cagatih nipunaistvayi natha karunikaih |
    tamstava drishtva priyan bhritam natasatya bharasvatmano bharam || 99|| natasatya pakkananitagalitakiratabhramanijakumaramiva
    nripah | bhavishyadyauvanavadhum vara iva mam labhasva mantrajanavijnapitam || 100|| iti kavitarkikakesari
    vedantacarya venkateshaviracitam | subhagamacyutashatakam sahridayahridayeshu shobhatam samagragunam
    || 101|| iti vedantadeshikaviracitam acyutashatakam sampurnam |
  devanagari: ृङ्खला तव रशना ॥ ४०॥ दासानां सत्य दृश्यते दानववीराणां दीर्घनिद्राशयनम् । तवोदरस्थितत्रिभुवनप्रासादस्तम्भसच्छायमूरुयुगम्
    ॥ ४१॥ जानुमणिदर्पणेन च जङ्घामरकतकलाचिकया च धन्या । अच्युत न मुञ्चति कान्तः लक्ष्मीरिव सरोजलाञ्छनौ
    तव चरणौ ॥ ४२॥ श्रुतिसीमन्तप्रसूनं शोभते नतसत्य तव सर्वशरण्यम् । क्रमणक्षणजनितसुरनदीप्रशमितत्रैलोक्यपातकं
    पदपद्मम् ॥ ४३॥ इति त्रिभुवनैकमूलमास्वादयन्त्यनघा अमृतस्वादुरसम् । ओषधिमहीधरपार्श्व उदितं त्वामोषधिमिव
    दासरुजाम् ॥ ४४॥ सिद्धाञ्जनमिव श्यामां तव तनुं निजविलोचनेषु क्षिपन्तः । अच्युत लक्ष्मीनिवासं नित्यनिगूढं
    निधिमिव पश्यन्ति त्वाम् ॥ ४५॥ विघटित निबिडान्धकारो घटमानज्योतिस्त्रिलोकैकग्रहपतिः । दृष्टगतो येषां
    त्वं नमत्सत्य न खलु तेषां मोहत्रियामा ॥ ४६॥ विषयरसे विरक्ताः विकारजननैरपि च न खलु विक्रियमाणाः । जीवन्मुक्तसदृशा
    अच्युत दृश्यन्ते पावनास्तव भक्ताः ॥ ४७॥ गन्धर्वनगरस्वप्नसदृक्षाणां श्रियां वनसरिताम् । न स्मरति त्वद्गृहीतः
    शरणागतसदामदो जीवगजः ॥ ४८॥ न महयन्ति ज्ञानवन्तः तरङ्गडिण्डीरबुद्बुदसदृक्षाणि । विधिप्रमुखाणां पदानि
    घनकन्दलीकन्द कदलीस्तम्भसमानि ॥ ४९॥ दृष्टस्वपरस्वभावाः पुरुषा गृहीत्वा स्वामिनस्तव शीलम् । नाथ नतसत्य
    सघृणाः न मुञ्चति कथमपि सर्वजनसौहार्दम् ॥ ५०॥ मानमदेर्ष्यामत्सरदम्भासूयाभयामर्षलोभमुखाः । दृश्यन्ते
    न मोहसुताः दोषा दासानां सत्य तव भक्तानाम् ॥ ५१॥ येषां मतिरितरमुखी कालः सकलोऽपि तेषां कलिविस्तारः ।
    ये तव पदे प्रवणाः नास्ति कलिर्नागपतिनगरपते तेषाम् ॥ ५२॥ अत्यासन्नविनाशाः अच्युत पश्यन्ति तावके भक्तजने
    । मोक्षरुचीनां मूढा दिवसकरमण्डल इव च्छिद्रम् ॥ ५३॥ नित्रुटितदुर्मानघनाः निर्मलगुणघटिततारकाप्राग्भाराः
    । भासमानभक्तिज्योत्स्नाः नतसत्य स्फुरन्ति नभोनिभास्तव भक्ताः ॥ न खलु यमविषये गतिर्नतसत्य पदाम्बुजं
    तव प्रपन्नानाम् । स्खलितानामपि यथायोग्यं शिक्षा शुद्धान्तकिङ्कराणामिव लघ्वी ॥ ५५॥ कर्मगतिदोषदुःखिताः
    कृतान्तभ्रुकुटीभुजङ्गीदर्शनत्रस्ताः । अर्चन्ति तव चरणौ अच्युत प्रभ्रष्टमन्मथरसास्वादाः ॥ ५६॥ आलगति
    तव चरणौ अच्युत विधिनाऽप्यर्चनाऽऽचरिता । यैकान्तप्रयुक्ता शेषामिव स्वयं शिरसा प्रतिगृह्णासि ताम् ॥
    ५७॥ तव मुखज्योत्स्ना द्रावितमानसशशिकान्तप्रवाहसन्निभबाष्पान् । अच्युत न मुञ्चसि भक्तान् कदम्बगोलनिभकण्टकायमाननिजाङ्गान्
    ॥ सर्वेऽपि निर्वैराः शरणागतसत्य गृहीतशाश्वतधर्माः । गतसङ्गास्तव भक्ताः यान्ति त्वामेव दुर्लभमितरैः
    ॥ ५९॥ अहिपतिनगरेन्द्र त्वां आसन्नमपि गगनमिव सदा दुर्ग्रहम् । विषयेषु विलगन्तः त्वरमाणा अपि न लभन्ते
    डोलायमानमनसः ॥ ६०॥ भक्तास्तावकसेवारसभरिताः सकलरक्षणोत्सुकरुचिना । करणानि धरन्ति चिरं काङ्क्षितमोक्षा
    अप्यच्युत त्वया स्थापिताः ॥ स्थिरगुणगिरिजनितैः सन्तारयसि नतसत्य निजभक्तैः । जन्मपरिपाटीजलधिं जङ्गमस्थिरसेतुदर्शनीयैर्जनान्
    ॥ ६२॥ प्रशमितभवान्तरभयाः प्राप्तं प्राप्तं हितमिति परिपश्यन्तः । भावयन्ति तव भक्ताः प्रियातिथिमिव
    नतसत्य पश्चिमदिवसम् ॥ ६३॥ प्रकटतिमिरे भुवने पात्रप्रतिष्ठापितपरमज्ञानप्रदीपाः । नीयन्तेऽच्युत त्वया
    निजं पदं सदा स्वयम्प्रभं कृतकार्याः ॥ ६४॥ दृढतीव्रभक्तिनयनाः परिपश्यन्तोऽहीन्द्रपुरनाथ त्वाम् । प्राप्तास्तव
    सायुज्यं पङ्क्तिं पूरयन्ति पन्नगेन्द्रमुखानाम् ॥ ६५॥ सन्नतसुलभमच्युत समाधिसोपानक्रमविलम्बविमुखिताः
    । शरणं गत्वा त्वां मुक्ता मुचुकुन्द क्षत्रबन्धुप्रमुखाः ॥ ६६॥ देवानां पशुसमानो जन्तुर्गत्वा देवनाथ
    तव पदम् । तैरेव सर्वैः संसरमाणैर्भवति सदा दत्तबलिः ॥ ६७॥ मोहान्धकारमहार्णवमूर्च्छितमायामहारजनिप्रत्यूषः
    । अच्युत तव कटाक्षो विमुक्तिप्रस्थानप्रथमपरिकरबन्धः ॥ ६८॥ मोक्षसुखवृक्षमूलं मोहजरातुरमहारसायनप्रवरम्
    । सकलकुशलैकक्षेत्रं किङ्करसत्य तव कीर्तनममृतनिभम् ॥ ६९॥ नास्त्यभिक्रमनाशो विच्छेदेऽपि प्रत्यवायप्रसङ्गः
    । स्वल्पाऽपि तव सपर्या रक्षत्यच्युत महत्तराद्भयात् ॥ ७०॥ अप्रसादे अप्रसन्नास्तव प्रसादे दाससत्य प्रसन्नाः
    । आराध्या भवन्ति परे किं तैः प्रसङ्गलम्भितप्रभावैः ॥ ७१॥ इतरत्रिदशाः प्रसन्नाः किङ्करसत्य मम किं नु
    करिष्यन्ति हितम् । नीहारघनशतैर्न खलु पूर्यते कथमपि चातकतृष्णा ॥ ७२॥ अनुगतसुखमृगतृष्णा अच्युत विश्राम्यति
    तव मामकतृष्णा । प्रवाहेषु प्रसृतायाः आश्रितप्रवहद्धनकृपासरितः ॥ ७३॥ विकलसकलाङ्गविषमान् धर्मान् नतसत्य
    ध्वजनिभान् धारयन् । कान्तारपान्थक इव स्खलच्चरणोऽस्मि कातरविशीर्यमाणः ॥ ७४॥ स्थिरधर्मवर्मस्थगितं अधर्मप्रवणानामग्रस्कन्धप्रवृत्तम्
    । अघटमानविप्रतीसारमच्युत मां हससि नूनं लक्ष्मीसमक्षम् ॥ ७५॥ तरितुमच्युत दुरितमस्मिन् देह एक दिवसेऽपि
    कृतम् । कालोऽलं न सकलः करुणायास्तव पूर्णपात्रमस्म्ययम् ॥ ७६॥ अच्युत तव गुणानां मम दोषाणामपि नास्ति
    कुत्रापि गणना । तथापि जयः प्रथमानामधिकं लीनानां भवति न खलु दौर्बल्यम् ॥ ७७॥ रात्रिं दिवसमच्युत त्रुटितः
    पतन्त्यायुर्द्रुमखण्डानि । दृष्ट्वापि दृप्तमनसं बालमिदानीमपि भरस्व मामप्रमत्तः ॥ ७८॥ निश्वासशङ्कनीये
    देहे पटलान्तसलिलबिन्दुसदृक्षे । जानासि नतसत्य त्वं जरत्करणेऽपि दीर्घयौवनतृष्णम् ॥ ७९॥ अज्ञातनिजकर्तव्यं
    यदृच्छया ज्ञातेषु मामपि प्रतिकूलगतिम् । इति निजस्वभावव्रीलितं हातुं दासानां सत्य न खलु तव युक्तम्
    ॥ ८०॥ कोऽहं किं करणीयं परिहरणीयमपि किमिति जानासि सर्वम् । शक्नोषि च तद्धितं मम त्रिदशेश्वर कुरुष्व
    निजहृदयनिक्षिप्तम् ॥ ८१॥ इदानीमुपर्यप्ययं गुणगृहीतो दारुपुत्रक इव परवशः । तस्यापि मम त्रिदशेश्वर त्रिष्वपि
    करणेषु भव सुखसङ्कल्पः ॥ ८२॥ निजकर्मनिगलयुगलमच्युत कृत्वा मम प्रियाप्रियवर्गे । कदा घोरकलेवरकारागृहकुहरनिर्गतं
    करिष्यसि माम् ॥ ८३॥ हार्दे त्वयि कदा विश्रान्तं ब्रह्मधमनिमार्गं गमिष्यन्तम् । दिनकरदत्ताग्रकरमच्युत
    द्रक्ष्यसि दयित डिम्भमिव माम् ॥ ८४॥ कदा अमानवान्ताः अग्निमुखा आतिवाहिकास्तव पुरुषाः । अतिलङ्घयिष्यन्ति
    मामच्युत तमोगहनत्रिगुणमरुकान्तारम् ॥ ८५॥ लङ्घितविरजासरितं लम्भित सदा शुद्धसत्त्वमय सौम्यतनुम् । कृतब्रह्मालङ्कारं
    करिष्यसि नतसत्य किङ्करं कदा माम् ॥ ८६॥ संसारसागरादुत्क्षिप्तं त्रिदशनाथ स्फुरितालोकम् । कदा करिष्यसि
    हृदये कौस्तुभमणिदर्पणमिव लक्ष्मीपुलकितम् ॥ ८७॥ कदा तव पादपद्मे भविष्यामि नतसत्य केलिक्रान्त त्रिभुवने
    मदनरिपुमकुटमण्डनसुरसरित्स्रोतः सूचितमधुप्रवाहे ॥ ८८॥ उपनिषच्छिरः कुसुममुत्तंसयित्वा तव पदाम्बुजयुगळम्
    । दयितो भविष्यामि कदा दासो दासानां सत्य सूरिसदृक्षः ॥ ८९॥ अपुनर्निवृत्तियोग्यमवतारविहारसहचरत्वधन्यम्
    । आत्मसमभोगमात्रमनुभविष्यसि देवनाथ कदा नु माम् ॥ ९०॥ इति स्फुटमनोरथं मामेतादृशवचनमात्रसारं वशगम् ।
    कुरुष्व निजगुणगणैः सत्यं दासानां सत्य सदा स्वच्छन्दः ॥ ९१॥ बालप्लवग इव तरळो मारुतिजातिरिति सागरं तरितुमनाः
    । प्रार्थये त्वामच्युत काङ्क्षितपदपद्म क्षमस्व मम कापेयम् ॥ ९२॥ अच्युतविषयाक्रान्तं भवार्णवावर्तभ्रमि
    निस्त्रुट्यमानम् । जननी स्तनन्धयमिव मामुद्धृत्य सेवस्व स्वयं पथ्यम् ॥ ९३॥ कर्ममयघर्मतप्तं सुखमृगतृष्णाभिः
    कदाऽप्यतृष्णाकम् । कारय निर्वृतं मां करकाशिशिरैरच्युत कटाक्षैः ॥ ९४॥ तव चिन्तनविमुखानां दृष्टविषाणामिव
    दर्शनान्मोचयन् । अमृतमुखानामिव मामच्युत भक्तानां नयस्व नयनासारम् ॥ ९५॥ विषमिलितमधुनिभेषु च तृणप्रतिमेषु
    च प्रतिग्रहेषु प्रलुठितम् । अमृतनिधाविवाच्युत स्थापय त्वयि निर्ममं मम हृदयम् ॥ ९६॥ नित्यमस्मिन् कृपणे
    निक्षिप नमत्सत्य निधिसदृक्षौ । प्रवहन्नखप्रभाझरप्रशमितप्रणमत्सञ्ज्वरौ तव चरणौ ॥ ९७॥ शरणागत इति जनिते
    जनवादेऽपि यद्यच्युत न रक्षसि माम् । भवेत्खलु सागरघोषः सागरपुलिने तादृशं तव वचनम् ॥ ९८॥ निक्षिप्तोऽस्मि
    चागतिः निपुणैस्त्वयि नाथ कारुणिकैः । तांस्तव दृष्ट्वा प्रियान् भृतं नतसत्य भरस्वात्मनो भरम् ॥ ९९॥
    नतसत्य पक्कणानीतगलितकिरातभ्रमनिजकुमारमिव नृपः । भविष्यद्यौवनवधूं वर इव मां लभस्व मन्त्रजनविज्ञापितम्
    ॥ १००॥ इति कवितार्किककेसरि वेदान्ताचार्य वेङ्कटेशविरचितम् । सुभगमच्युतशतकं सहृदयहृदयेषु शोभतां समग्रगुणम्
    ॥ १०१॥ इति वेदान्तदेशिकविरचितं अच्युतशतकं सम्पूर्णम् ।
