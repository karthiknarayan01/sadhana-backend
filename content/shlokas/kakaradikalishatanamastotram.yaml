id: kakaradikalishatanamastotram
category: stotram
name:
  english: kakaradikalishatanamastotram
  devanagari: ककारादिकालीशतनामस्तोत्रम्
content:
  english: rahasyam kim vadishyami pancavaktrairmaheshvari | jihvakotisahasraistu vaktrakotishatairapi
    || 3|| vaktum na shakyate tasya mahatmyam vai kathancana | tasya rahasyam gopyanca kim na janasi shamkari
    || 4|| svasyaiva caritam vaktum samartha svayameva hi | anyatha naiva deveshi jnayate tat kathancana
    || 5|| kalikayah shatam nama nana tantre tvaya shrutam | rahasyam gopaniyanca tatre'smin jagadambike
    || 6|| karalavadana kali kamini kamala kala | kriyavati kotarakshi kamakshya kamasundari || 7|| kapala
    ca karala ca kali katyayani kuhuh | kankala kaladamana karuna kamalarccita || 8|| kadambari kalahara
    kautuki karanapriya | krishna krishnapriya krishnapujita krishnavallabha || 9|| krishnaparajita krishnapriya
    ca krishnarupini | kalika kalaratrishca kulaja kulapandita || 10|| kuladharmapriya kama kamyakarmavibhushita
    | kulapriya kularata kulinaparipujita || 11|| kulajna kamalapujya kailasanagabhushita | kutaja keshini
    kamya kamada kamapandita || 12|| karalasya ca kandarpakamini rupashobhita | kolambaka kolarata keshini
    keshabhushita || 13|| keshavasyapriya kasha kashmira keshavarccita | kameshvari kamarupa kamadanavibhushita
    || 14|| kalahantri kurmamamsapriya kurmadipujita | kolini karakakara karakarmanishevini || 15|| katakeshvaramadhyastha
    kataki katakarccita | katapriya katarata katakarmanishevini || 16|| kumaripujanarata kumariganasevita
    | kulacarapriya kaulapriya kaulanishevini || 17|| kulina kuladharmajna kulabhitivimarddini | kaladharmapriya
    kamya
  devanagari: रहस्यं किं वदिष्यामि पञ्चवक्त्रैर्महेश्वरी । जिह्वाकोटिसहस्रैस्तु वक्त्रकोटिशतैरपि ॥ ३॥
    वक्तुं न शक्यते तस्य माहात्म्यं वै कथञ्चन । तस्या रहस्यं गोप्यञ्च किं न जानासि शंकरी ॥ ४॥ स्वस्यैव
    चरितं वक्तुं समर्था स्वयमेव हि । अन्यथा नैव देवेशि ज्ञायते तत् कथञ्चन ॥ ५॥ कालिकायाः शतं नाम नाना
    तन्त्रे त्वया श्रुतम् । रहस्यं गोपनीयञ्च तत्रेऽस्मिन् जगदम्बिके ॥ ६॥ करालवदना काली कामिनी कमला कला
    । क्रियावती कोटराक्षी कामाक्ष्या कामसुन्दरी ॥ ७॥ कपाला च कराला च काली कात्यायनी कुहुः । कङ्काला कालदमना
    करुणा कमलार्च्चिता ॥ ८॥ कादम्बरी कालहरा कौतुकी कारणप्रिया । कृष्णा कृष्णप्रिया कृष्णपूजिता कृष्णवल्लभा
    ॥ ९॥ कृष्णापराजिता कृष्णप्रिया च कृष्णरूपिनी । कालिका कालरात्रीश्च कुलजा कुलपण्डिता ॥ १०॥ कुलधर्मप्रिया
    कामा काम्यकर्मविभूषिता । कुलप्रिया कुलरता कुलीनपरिपूजिता ॥ ११॥ कुलज्ञा कमलापूज्या कैलासनगभूषिता ।
    कूटजा केशिनी काम्या कामदा कामपण्डिता ॥ १२॥ करालास्या च कन्दर्पकामिनी रूपशोभिता । कोलम्बका कोलरता केशिनी
    केशभूषिता ॥ १३॥ केशवस्यप्रिया काशा काश्मीरा केशवार्च्चिता । कामेश्वरी कामरुपा कामदानविभूषिता ॥ १४॥
    कालहन्त्री कूर्ममांसप्रिया कूर्मादिपूजिता । कोलिनी करकाकारा करकर्मनिषेविणी ॥ १५॥ कटकेश्वरमध्यस्था
    कटकी कटकार्च्चिता । कटप्रिया कटरता कटकर्मनिषेविणी ॥ १६॥ कुमारीपूजनरता कुमारीगणसेविता । कुलाचारप्रिया
    कौलप्रिया कौलनिषेविणी ॥ १७॥ कुलीना कुलधर्मज्ञा कुलभीतिविमर्द्दिनी । कालधर्मप्रिया काम्य
