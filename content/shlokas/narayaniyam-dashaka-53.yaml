id: narayaniyam-dashaka-53
category: stotram
name:
  english: Narayaniyam Dashaka 53
content:
  english: atitya balyam jagatam pate tvamupetya paugandavayo manojnam | upekshya vatsavanamutsavena pravartatha
    goganapalanayam || || upakramasyanugunaiva seyam marutpuradhisha tava pravrittih | gotraparitranakrite'vatirnastadeva
    deva''rabhathastada yat || || kadapi ramena samam vanante vanashriyam vikshya caran sukhena | shridamanamnah
    svasakhasya vaca modadaga dhenukakananam tvam || || uttalatalinivahe tvaduktya balena dhute'tha balena
    dorbhyam | mriduh kharashcabhyapatatpurastat phalotkaro dhenukadanavo'pi || || samudyato dhainukapalane'ham
    katham vadham dhainukamadya kurve | itiva matva dhruvamagrajena suraughayoddharamajighanastvam ||
    || tadiyabhrityanapi jambukatvenopagatanagrajasamyutastvam | jambuphalaniva tada nirasthastaleshu
    khelan bhagavan nirasthah || || vinighnati tvayyatha jambukaugham sanamakatvadvarunastadanim | bhayakulo
    jambukanamadheyam shrutiprasiddham vyadhiteti manye || || tavavatarasya phalam murare sanjatamadyeti
    surairnutastvam | satyam phalam jatamiheti hasi balaih samam talaphalanyabhunkthah || || madhudravasrunti
    brihanti tani phalani medobharabhrinti bhuktva | triptaishca driptairbhavanam phalaugham vahadbhiragah
    khalu balakaistvam || || hato hato dhenuka ityupetya phalanyadadbhirmadhurani lokaih | jayeti jiveti
    nuto vibho tvam marutpuradhishvara pahi rogat ||
  devanagari: अतीत्य बाल्यं जगतां पते त्वमुपेत्य पौगण्डवयो मनोज्ञम् । उपेक्ष्य वत्सावनमुत्सवेन प्रावर्तथा
    गोगणपालनायाम् ॥ ॥ उपक्रमस्यानुगुणैव सेयं मरुत्पुराधीश तव प्रवृत्तिः । गोत्रापरित्राणकृतेऽवतीर्णस्तदेव
    देवाऽऽरभथास्तदा यत् ॥ ॥ कदापि रामेण समं वनान्ते वनश्रियं वीक्ष्य चरन् सुखेन । श्रीदामनाम्नः स्वसखस्य
    वाचा मोदादगा धेनुककाननं त्वम् ॥ ॥ उत्तालतालीनिवहे त्वदुक्त्या बलेन धूतेऽथ बलेन दोर्भ्याम् । मृदुः
    खरश्चाभ्यपतत्पुरस्तात् फलोत्करो धेनुकदानवोऽपि ॥ ॥ समुद्यतो धैनुकपालनेऽहं कथं वधं धैनुकमद्य कुर्वे
    । इतीव मत्वा ध्रुवमग्रजेन सुरौघयोद्धारमजीघनस्त्वम् ॥ ॥ तदीयभृत्यानपि जम्बुकत्वेनोपागतानग्रजसंयुतस्त्वम्
    । जम्बूफलानीव तदा निरास्थस्तालेषु खेलन् भगवन् निरास्थः ॥ ॥ विनिघ्नति त्वय्यथ जम्बुकौघं सनामकत्वाद्वरुणस्तदानीम्
    । भयाकुलो जम्बुकनामधेयं श्रुतिप्रसिद्धं व्यधितेति मन्ये ॥ ॥ तवावतारस्य फलं मुरारे सञ्जातमद्येति सुरैर्नुतस्त्वम्
    । सत्यं फलं जातमिहेति हासी बालैः समं तालफलान्यभुङ्क्थाः ॥ ॥ मधुद्रवस्रुन्ति बृहन्ति तानि फलानि मेदोभरभृन्ति
    भुक्त्वा । तृप्तैश्च दृप्तैर्भवनं फलौघं वहद्भिरागाः खलु बालकैस्त्वम् ॥ ॥ हतो हतो धेनुक इत्युपेत्य
    फलान्यदद्भिर्मधुराणि लोकैः । जयेति जीवेति नुतो विभो त्वं मरुत्पुराधीश्वर पाहि रोगात् ॥
