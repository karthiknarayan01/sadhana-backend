id: annamayya-keerthanas-kondalalo-nelakonna
category: stotram
name:
  english: Annamayya Keerthanas Kondalalo Nelakonna
content:
  english: adi pallavi kòndalalo nèlakònna koneti rayadu vadu kòndalanta varamulu guppèdu vadu || kummara
    dasudaina kuruvarati nambi immanna varamulèlla iccinavadu | dòmmulu sesina yatti tòndaman cakkuravarti
    rammanna cotiki vacci nammina vadu || kòndalalo nèlakònna koneti rayadu vadu kòndalanta varamulu guppèdu
    vadu || accapu vedukatoda nanantalvaruki muccili vèttiki manni mosinavadu | maccika dòlaka tirunambi
    toduta nicca nicca mataladi nòccinavadu || caranam kancilona nunda dirukaccinambi mida karuninci tana
    yèdaku rappincina vadu | yènci èkkudaina venkateshudu manalaku mancivadai karuna balincina vadu ||
    kòndalalo nèlakònna koneti rayadu vadu kòndalanta varamulu guppèdu vadu
  devanagari: आदि पल्लवि कॊण्डललो नॆलकॊन्न कोनेटि रायडु वाडु कॊण्डलन्त वरमुलु गुप्पॆडु वाडु ॥ कुम्मर दासुडैन
    कुरुवरति नम्बि इम्मन्न वरमुलॆल्ल इच्चिनवाडु । दॊम्मुलु सेसिन यट्टि तॊण्डमान् चक्कुरवर्ति रम्मन्न चोटिकि
    वच्चि नम्मिन वाडु ॥ कॊण्डललो नॆलकॊन्न कोनेटि रायडु वाडु कॊण्डलन्त वरमुलु गुप्पॆडु वाडु ॥ अच्चपु वेडुकतोड
    ननन्ताल्वारुकि मुच्चिलि वॆट्टिकि मन्नि मोसिनवाडु । मच्चिक दॊलक तिरुनम्बि तोडुत निच्च निच्च माटलाडि
    नॊच्चिनवाडु ॥ चरणं कञ्चिलोन नुण्ड दिरुकच्चिनम्बि मीद करुणिञ्चि तन यॆडकु रप्पिञ्चिन वाडु । यॆञ्चि ऎक्कुडैन
    वेङ्कटेशुडु मनलकु मञ्चिवाडै करुण बालिञ्चिन वाडु ॥ कॊण्डललो नॆलकॊन्न कोनेटि रायडु वाडु कॊण्डलन्त वरमुलु
    गुप्पॆडु वाडु
