id: bashkalpanishat
category: upanishad
name:
  english: bashkalpanishat
  devanagari: बाष्कल्पनिषत्
content:
  english: bashkalamantropanishat savrittika atha bashkalamantropanishat | medhatithim kanvamindro jahara
    dya meshabhuyopagato vidanah | tamanya ittamanam pariprat pada enam niyuyuje parasmin || 1|| ko ha
    smaisha bhavasi vyavayo navayo ma iha shashvadasti | sushevamiccankramasi prapashyannittha na kashcoranamacacakshe
    || 2|| nemamasprikshadidudasyamanah ko addhamumabhicankramiti | tadicchadhi yo asi sarvavittamo na
    tvashnavadbrahma risha mayasvi || indro nricaksha vrishabhasturashat prasasahistapasa ma vicakshe
    | sa iddevo ritamanvayantam prabhimakarma tavaso'paviddhat || 4|| kuheva mavashamito nayatai kuheva
    te citratamapratishtha | kuhacidesha svapita pita no yo na veda na hritam harantam || 5|| pratyannavanpranitarau
    ca neha nahamenananupatasthiraddha | na mamime nunamittha patho vidurye ma na yanti mithu cakashanah
    || 6|| parah smiyano avivarasya shukam kim simiccharanam manyamanah | na ha tvahamapraniya svavishthamittha
    jahami shapamanaminnu || 7|| ahamasmi jaritrinamu dava ahamashiramahamidam dadhagvan | aham vishva
    bhuvana vicakshannaham devanamasannavo'dah || 8|| mama pratishtha bhuva andakosha vi caimi sam ca
    hi nu yo virashpi | aham nvahim parvate shishriyanamugro nvaham tavasavasyuraddha || 9|| pravankshana
    abhidam parvatanam yatsimindra akarodanikaih| ko addha veda ka iha pravocat ko ashnavadabhimatim vijaghnushah
    || 10|| ko me avo dashusho vishvagutirittha dadashre bhuvanadhi vishva | rupam rupam janusha bobhavimi
    mayabhireko abhicakashanah || 11|| vishvam vicakshe yamayannabhiko neshe me kashca mahimanamanyah
    | aham dyavaprithivi atatano bibharmi dharmamavase jananam || 12|| ahamu ha pravatim yajniyamiyam
    aham veda bhuvanasya nabhim | apih pita surahamasya vishvan aham divya antarikshyastuka vaham || 13||
    aham vedanamuta yajnanamaham chandasamavidam rayinam | aham pacami sarasah parasya yadidetiva sarirasya
    madhye || 14|| ahaminnu paramo jataveda yamadhvaryurabhilokam prinaidhit | yamanvaha nabhaso na pakshi
    kashtha bhindan gobhirito'mutashca || 15|| ahamu yannapatata rathena dvishadarena pradhinaikacakrah
    | ahaminnu didyutano dive dive tanvam pupushyanamritam vahami || 16|| aham disha pradisha adishashca
    vishvak punanah paryemi lokam | aham vishva oshadhirgarbha adham yabhiridam dhinuyurdashushah prajah
    || 17|| aha carami bhuvanasya madhye punaruccavacam vyashnuvanah | yo ma veda nihitam guha cit sa
    idittha shebhavidashayadhyai || 18|| aham pancadha dashadha caikadha ca sahasradha naikadha casamatra
    | maya tatamitidamashnute tadanyathasadyadi me asadviduh || 19|| na mamashnoti jarita na kashcana
    na mamashnoti pari gobhirabhih | na me'nashvanuta dashvanajagrabhit sarva inmamupayanti vishvatah
    || 20|| kva shararuh kva srimarah kva nuranah sarvamidam tvattvadito vahami | yanmadime bibhyati tanma
    ekam te me akshannahamu tananuksham || 21|| yattapyatha bahudha me pura cittannu bhuve'hamurano bobhuve
    | ritasya panthamasi hi prapanno'yase sa me satyamidekamehi || 22|| aham jyotirahamritam vinaddhiraham
    jatam jani janishyamanam | aham tvamahamaham tvaminnu tvamaham cakshva vicikitsirma rijva || 23||
    vishvashasta vidharano vishvarupo rudrah praniti tamanah prajapatih | hamso vishoko ajarah purana
    ritiyamano ahamasmi nama || 24|| ahamasmi jarita sarvatomukhah paryaranah parameshthi nricakshah |
    aham vishvannahamasmi prasatvanahameko'smi yadidam nu kim ca || 25|| iti bashkalamantropanishat samapta
    | atha bashkalamantropanishat savrittika | medhatithim kanvamindro jahara ityadya bashkalanam mantropanishat
    | tasyashceyamalpakshara vrittirarabhyate | medhatithinamanamrishim kanvasya putram samavedabrahmanaprasiddhamindrah
    jahara | dya meshabhuyopagato vidanah | meshabhuyam meshabhavam | bhuvah kyap | upagatah praptah |
    samavedabrahmanaprasiddhakhyayikah | dyah svargalokan pratiti vivakshitam jahara hritavan | vidanah
    jnani || tamanya ittamanam pariprat | tam indram anyah medhatithih iditi nirarthako nipatah | tamanam
    haranena glanipadam | paripricchatiti pariprat | medhatithih pada enam niyuyuje parasmin || 1|| parasmin
    pade jneye tatsvarupe padarthe niyuyuje niyuktavan | vilakshanameshibhutendrakartrikavilakshanakriyadarshanat
    apatato vilakshanah paro devah kashcinna tu me mesha iti tatvikatatsvarupajnanaya vakshyamanaprashnena
    param padam jneyam svasvarupam kathayeti prashnena niyojitavanityarthah | prashnamevaha shrutih |
    ko ha smaisha bhavasi vyavayah | ha iti purvavrittavadyotako nipatah | smeti nirarthakam | esha pratyakshah
    | vyavayo jneyah | vyavapurvasyaiterghani rupam | kaccit jnatum yogyastvamasi | navayo ma iha shashvadasti
    | me mama shashvaditi dhruvartham avayo jnanam nasti kastvamiti | drishyamane meshasvarupe kathamevam
    samshaya iti cet | tatraha | sushevamiccankramasi | shobhanameva cankramanam karoshi | prapashyan
    ittha na kashcoranamacacakshe || 2|| ittha na | harathamiva | nakara ivarthah | ko va ittham kramamanam
    prapashyan uranam mesham acacakshe | uktavan | drishtavan va | ittham kramamana urano na kenaciddrishta
    iti bhavah kramena vailakshanyamevaha | nemamasprikshadidudasyamanah | imam prithivim udasyamanah
    | it evarthe | kurdanneva na asprikshat na sprishatiti lakaravyatyayah | naitavata vailakshanyamata
    aha | ko addhamumabhicankramiti | addha sakshat | anenaiva sharirena | amum dyam | kah abhicankramiti
    abhikramati | prashnamupasamharati | tadicchadhi yo asi sarvavittamah | tat tasmat shadhi | idityanarthakam
    | shikshaya yastvam sarvavittamah sarvajnatamah asi tatsvarupam kathayeti bhava | akayane'nishta sabhavyate
    | tanma bhavatvityaha | na tvashnavadbrahma risha mayasvi || 3|| mayasvi tejasvi brahma brahmanya
    risha krodhana tva tva na ashnavat na ashnoti na vyapnot | asmadiyakrodhavyapagavipaya ma bhudityabhiprayah
    | kutastavaiva balamata aha | indro nricaksha vrishabhasturapat | indra parameshvara nricaksha sarvajagatkarmasakshi
    vrishabha kamapradasturapat tura parabala sahata abhibhavatiti sahe chandasiti nvi | prasasahistapasa
    ma vicakshe | prasasahi prasahanashila | tapasa upalakshane tritiya | ma ma vicaksha pashyati | ata
    satyamakathayata ishvaradbhayamapyaha | sa ihevo ritapranvayantam | ita evarthe | sa ita sa eva deva
    rita satya anu lakshikritya ayanta agacchata satyena patha agacchanta satyamabruvanamiti yavat | prabhimakarma
    tavaso'paviddhat || 4|| apaviddhat kshiptat tavaso vaktrata prabhi prakrishta bhaya ma aka karshit
    | prashtavyamaha | kuheva mavashamito nayatai | kutreva ma ma avasha ita asmat sthanat nayata nayasi
    | kim ca | kuheva te citratamapratishtha | spashtam | idriklashte kayavanmananirnishavitamishvara
    smarati | kuhacidesha svapita pita nah | esha manasapratyaksha na pita ishvara kuhacit kutra svapita
    svapiti | yo na veda na hrita harantam || 5|| ya hrita ma na veda na va haranta vadatyanvaya | kim
    ca itara pyatanmanishavita deva na matsahaya ityaha | pratyannvanprantara ca neha | pancasu dikshu
    tatra tatra vartamana pranapancaka
  devanagari: बाष्कलमन्त्रोपनिषत् सवृत्तिका अथ बाष्कलमन्त्रोपनिषत् । मेधातिथिं काण्वमिन्द्रो जहार द्या
    मेषभूयोपगतो विदानः । तमन्य इत्तमनं परिप्राट् पद एनं नियुयुजे परस्मिन् ॥ १॥ को ह स्मैष भवसि व्यवायो
    नावायो म इह शश्वदस्ति । सुशेवमिच्चङ्क्रमसि प्रपश्यन्नित्था न कश्चोरणमाचचक्षे ॥ २॥ नेमामस्पृक्षदिदुदस्यमानः
    को अद्धामूमभिचङ्क्रमीति । तदिच्छाधि यो असि सर्ववित्तमो न त्वाश्नवद्ब्रह्म रिषा मयस्वि ॥ इन्द्रो नृचक्षा
    वृषभस्तुराषाट् प्रसासहिस्तपसा मा विचक्षे । स इद्देवो ऋतमन्वयन्तं प्रभीमकर्मा तवसोऽपविद्धात् ॥ ४॥ कुहेव
    मावशमितो नयातै कुहेव ते चित्रतमप्रतिष्ठा । कुहाचिदेष स्वपिता पिता नो यो न वेद न हृतं हरन्तम् ॥ ५॥
    प्रत्यङ्ङवाङ्प्राङितरौ च नेह नाहमेनाननुपतस्थिरद्धा । न मामिमे नूनमित्था पथो विदुर्ये मा न यन्ति मिथु
    चाकशानाः ॥ ६॥ परः स्मियानो अविवरस्य शूकं किं सीमिच्छरणं मन्यमानः । न ह त्वाहमप्रणीय स्वविष्ठामित्था
    जहामि शपमानमिन्नु ॥ ७॥ अहमस्मि जरितॄणामु दावा अहमाशिरमहमिदं दधग्वान् । अहं विश्वा भुवना विचक्षन्नहं
    देवानामासन्नवोऽदः ॥ ८॥ मम प्रतिष्ठा भुव आण्डकोशा वि चैमि सं च हि नु यो विरश्पी । अहं न्वहिं पर्वते
    शिश्रियाणमुग्रो न्वहं तवसावस्युरद्धा ॥ ९॥ प्रवङ्क्षणा अभिदं पर्वतानां यत्सीमिन्द्रा अकरोदनीकैः। को
    अद्धा वेद क इह प्रवोचत् को अश्नवदभिमातिं विजघ्नुषः ॥ १०॥ को मे अवो दाशुषो विष्वगूतीरित्था ददश्रे भुवनाधि
    विश्वा । रूपं रूपं जनुषा बोभवीमि मायाभिरेको अभिचाकशानः ॥ ११॥ विश्वं विचक्षे यमयन्नभीको नेशे मे कश्च
    महिमानमन्यः । अहं द्यावापृथिवी आततानो बिभर्मि धर्ममवसे जनानाम् ॥ १२॥ अहमु ह प्रवतिं यज्ञियामियां अहं
    वेद भुवनस्य नाभिम् । आपिः पिता सूरहमस्य विष्वङ् अहं दिव्या आन्तरिक्ष्यास्तुका वहम् ॥ १३॥ अहं वेदानामुत
    यज्ञानामहं छन्दसामविदं रयीणाम् । अहं पचामि सरसः परस्य यदिदेतीव सरिरस्य मध्ये ॥ १४॥ अहमिन्नु परमो जातवेदा
    यमध्वर्युरभिलोकं पृणैधीत् । यमन्वाह नभसो न पक्षी काष्ठा भिन्दन् गोभिरितोऽमुतश्च ॥ १५॥ अहमु यन्नपतता
    रथेन द्विषडारेण प्रधिनैकचक्रः । अहमिन्नु दिद्युतानो दिवे दिवे तन्वं पुपुष्यानमृतं वहामि ॥ १६॥ अहं
    दिश प्रदिश आदिशश्च विष्वक् पुनानः पर्येमि लोकम् । अहं विश्वा ओषधीर्गर्भ आधां याभिरिदं धिनुयुर्दाशुषः
    प्रजाः ॥ १७॥ अह चरामि भुवनस्य मध्ये पुनरुच्चावचं व्यश्नुवानः । यो मा वेद निहितं गुहा चित् स इदित्था
    शेभवीदाशयध्यै ॥ १८॥ अहं पञ्चधा दशधा चैकधा च सहस्रधा नैकधा चासमत्र । मया ततमितीदमश्नुते तदन्यथासद्यदि
    मे असद्विदुः ॥ १९॥ न मामश्नोति जरिता न कश्चन न मामश्नोति परि गोभिराभिः । न मेऽनाश्वानुत दाश्वानजग्रभीत्
    सर्व इन्मामुपयन्ति विश्वतः ॥ २०॥ क्व शरारुः क्व सृमरः क्व नूरणः सर्वमिदं त्वत्त्वदितो वहामि । यन्मदिमे
    बिभ्यति तन्म एकं ते मे अक्षन्नहमु ताननुक्षम् ॥ २१॥ यत्तप्यथा बहुधा मे पुरा चित्तन्नु भुवेऽहमुरणो बोभुवे
    । ऋतस्य पन्थामसि हि प्रपन्नोऽयसे स मे सत्यमिदेकमेहि ॥ २२॥ अहं ज्योतिरहमृतं विनद्धिरहं जातं जनि जनिष्यमाणम्
    । अहं त्वमहमहं त्वमिन्नु त्वमहं चक्ष्व विचिकित्सीर्म ऋज्वा ॥ २३॥ विश्वशास्ता विधरणो विश्वरूपो रुद्रः
    प्रणीती तमनः प्रजापतिः । हंसो विशोको अजरः पुराण ऋतीयमानो अहमस्मि नाम ॥ २४॥ अहमस्मि जरिता सर्वतोमुखः
    पर्यारणः परमेष्ठी नृचक्षाः । अहं विष्वङ्ङहमस्मि प्रसत्वानहमेकोऽस्मि यदिदं नु किं च ॥ २५॥ इति बाष्कलमन्त्रोपनिषत्
    समाप्ता । अथ बाष्कलमन्त्रोपनिषत् सवृत्तिका । मेधातिथिं काण्वमिन्द्रो जहार इत्याद्या बाष्कलानां मन्त्रोपनिषत्
    । तस्याश्चेयमल्पाक्षरा वृत्तिरारभ्यते । मेधातिथिनामानमृषिं कण्वस्य पुत्रं सामवेदब्राह्मणप्रसिद्धमिन्द्रः
    जहार । द्या मेषभूयोपगतो विदानः । मेषभूयं मेषभावम् । भुवः क्यप् । उपगतः प्राप्तः । सामवेदब्राह्मणप्रसिद्धाख्यायिकः
    । द्याः स्वर्गलोकान् प्रतीति विवक्षितं जहार हृतवान् । विदानः ज्ञानी ॥ तमन्य इत्तमनं परिप्राट् । तं
    इन्द्रं अन्यः मेधातिथिः इदिति निरर्थको निपातः । तमनं हरणेन ग्लानिपदम् । परिपृच्छतीति परिप्राट् । मेधातिथिः
    पद एनं नियुयुजे परस्मिन् ॥ १॥ परस्मिन् पदे ज्ञेये तत्स्वरूपे पदार्थे नियुयुजे नियुक्तवान् । विलक्षणमेषीभूतेन्द्रकर्तृकविलक्षणक्रियादर्शनात्
    आपाततो विलक्षणः परो देवः कश्चिन्न तु मे मेष इति तात्विकतत्स्वरूपज्ञानाय वक्ष्यमाणप्रश्नेन परं पदं
    ज्ञेयं स्वस्वरूपं कथयेति प्रश्नेन नियोजितवानित्यर्थः । प्रश्नमेवाह श्रुतिः । को ह स्मैष भवसि व्यवायः
    । ह इति पूर्ववृत्तावद्योतको निपातः । स्मेति निरर्थकम् । एष प्रत्यक्षः । व्यवायो ज्ञेयः । व्यवपूर्वस्यैतेर्घञि
    रूपम् । कच्चित् ज्ञातुं योग्यस्त्वमसि । नावायो म इह शश्वदस्ति । मे मम शश्वदिति ध्रुवार्थं आवायो ज्ञानं
    नास्ति कस्त्वमिति । दृश्यमाने मेषस्वरूपे कथमेवं संशय इति चेत् । तत्राह । सुशेवमिच्चङ्क्रमसि । शोभनमेव
    चङ्क्रमणं करोषि । प्रपश्यन् इत्था न कश्चोरणमाचचक्षे ॥ २॥ इत्था न । हरथमिव । नकार इवार्थः । को वा इत्थं
    क्रममाणं प्रपश्यन् उरणं मेषं आचचक्षे । उक्तवान् । दृष्टवान् वा । इत्थं क्रममाण उरणो न केनचिद्दृष्ट
    इति भावः क्रमेण वैलक्षण्यमेवाह । नेमामस्पृक्षदिदुदस्यमानः । इमां पृथिवीं उदस्यमानः । इत् एवार्थे ।
    कूर्दन्नेव न अस्पृक्षत् न स्पृशतीति लकारव्यत्ययः । नैतावता वैलक्षण्यमत आह । को अद्धामूमभिचङ्क्रमीति
    । अद्धा साक्षात् । अनेनैव शरीरेण । अमूं द्याम् । कः अभिचङ्क्रमीति अभिक्रामति । प्रश्नमुपसंहरति । तदिच्छाधि
    यो असि सर्ववित्तमः । तत् तस्मात् शाधि । इदित्यनर्थकम् । शिक्षय यस्त्वं सर्ववित्तमः सर्वज्ञतमः असि
    तत्स्वरूपं कथयेति भाव । अकयनेऽनिष्ट सभाव्यते । तन्मा भवत्वित्याह । न त्वाश्नवद्ब्रह्म रिषा मयस्वि
    ॥ ३॥ मयस्वि तेजस्वि ब्रह्म ब्राह्मण्य रिषा क्रोधन त्वा त्वा न अश्नवत् न अश्नोति न व्याप्नोत् । अस्मदीयक्रोधव्यापागविपया
    मा भूदित्यभिप्रायः । कुतस्तवैव बलमत आह । इन्द्रो नृचक्षा वृषभस्तुरापाट् । इन्द्र परमेश्वर नृचक्षा
    सर्वजगत्कर्मसाक्षी वृषभ कामप्रदस्तुरपाट् तुर परबल सहत अभिभवतीति सहे छन्दसीति ण्वि । प्रसासहिस्तपसा
    मा विचक्षे । प्रसासहि प्रसहनशील । तपसा उपलक्षणे तृतीया । मा मा विचक्ष पश्यति । अत सत्यमकथयत ईश्वराद्भयमप्याह
    । स इहेवो ऋतप्रन्वयन्तम् । इत एवार्थे । स इत स एव देव ऋत सत्य अनु लक्षीकृत्य अयन्त अगच्छट सत्येन पथा
    अगच्छन्त सत्यमब्रुवाणमिति यावत् । प्रभीमकर्मा तवसोऽपविद्धात् ॥ ४॥ अपविद्धात् क्षिप्तात् तवसो वक्त्रात
    प्रभी प्रकृष्ट भय मा अक कार्षीत् । प्रष्टव्यमाह । कुहेव मावशमितो नयातै । कुत्रेव मा मा अवशा इत अस्मात्
    स्थानात् नयात नायसि । किं च । कुहेव ते चित्रतमप्रतिष्ठा । स्पष्टम् । ईदृक्लष्टे कायवाङ्मनानिर्निषवितमीश्वर
    स्मरति । कुहाचिदेष स्वपिता पिता नः । एष मानसप्रत्यक्षा न पिता ईश्वर कुहाचित् कुत्र स्वपिता स्वपिति
    । यो न वेद न हृत हरन्तम् ॥ ५॥ य हृत मा न वेद न वा हरन्त वदत्यन्वय । किं च इतर प्यातन्मनिषविता देवा
    न मत्सहाया इत्याह । प्रत्यङ्ङ्वाङ्प्राङ्तरा च नेह । पञ्चसु दिक्षु तत्र तत्र वर्तमाना प्राणपञ्चका
