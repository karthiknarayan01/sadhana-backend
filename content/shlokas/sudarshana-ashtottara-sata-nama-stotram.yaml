id: sudarshana-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Sudarshana Ashtottara Sata Nama Stotram
content:
  english: sudarshanashcakrarajah tejovyuho mahadyutih | sahasrabahu rdiptangah arunakshah pratapavan
    || || anekadityasankashah prodyajjvalabhiranjitah | saudamini || pancabhutamanorupo shatkonantara
    samsthitah | harantah karanodbhuta || haripanilasatpadmavihararamanoharah | shrakararupassarvajnah
    sarvalokarcitaprabhuh || || caturdashasahasrarah caturvedamayo 'nalah | bhaktacandramasajyotih bhavaroga
    || rephatmako makarashca rakshosrigrushitangakah | sarvadaityagrivanala || bhimadamshtrojjvalakaro
    bhimakarma vilocanah | nilavartma nityasukho nirmalashri || raktamalyambaradharo raktacandanarushitah
    | rajogunakritishshuro rakshahkula || nityakshemakarah prajnah pashandajanakhandanah | narayanajnanuvarti
    naigamantahprakashakah || khandano vijayakritih | mitrabhavi sarvamayo tamovidhvamsakastatha || ||
    rajassattvatamodvarti trigunatma trilokadhrit | harimayagunopeto || paramatma paranjyotih pancakritya
    || sadasatparamah purno vanmayo varado'cyutah | jivo gururhamsarupah pancashatpitharupakah || || matrikamandaladhyaksho
    madhudhvamsi manomayah | buddhirupashcittasakshi saro hamsaksharadvayah || mayo vibhuh | srashta kriyaspada
    || nirayudho hyasamrambhah sarvayudha samanvitah | omkararupi purnatma ankarassadhya || ainkaro vakprado
    vagmi shrinkaraishvaryavardhanah | klinkaramohanakaro humphatkshobhanakritih || nashakah | viraradhyo
    vishvarupah vaishnavo vishnurupakah || || satyavratah satyadharah satyadharmanushangakah || || shri
    sudarshanashtottarashatanama stotram sampurnam||
  devanagari: सुदर्शनश्चक्रराजः तेजोव्यूहो महाद्युतिः । सहस्रबाहु र्दीप्ताङ्गः अरुणाक्षः प्रतापवान् ॥
    ॥ अनेकादित्यसङ्काशः प्रोद्यज्ज्वालाभिरञ्जितः । सौदामिनी ॥ पञ्चभूतमनोरूपो षट्कोणान्तर संस्थितः । हरान्तः
    करणोद्भूत ॥ हरिपाणिलसत्पद्मविहारारमनोहरः । श्राकाररूपस्सर्वज्ञः सर्वलोकार्चितप्रभुः ॥ ॥ चतुर्दशसहस्रारः
    चतुर्वेदमयो ऽनलः । भक्तचान्द्रमसज्योतिः भवरोग ॥ रेफात्मको मकारश्च रक्षोसृग्रूषिताङ्गकः । सर्वदैत्यग्रीवनाल
    ॥ भीमदंष्ट्रोज्ज्वलाकारो भीमकर्मा विलोचनः । नीलवर्त्मा नित्यसुखो निर्मलश्री ॥ रक्तमाल्याम्बरधरो रक्तचन्दनरूषितः
    । रजोगुणाकृतिश्शूरो रक्षःकुल ॥ नित्यक्षेमकरः प्राज्ञः पाषण्डजनखण्डनः । नारायणाज्ञानुवर्ती नैगमान्तःप्रकाशकः
    ॥ खण्डनो विजयाकृतिः । मित्रभावी सर्वमयो तमोविध्वंसकस्तथा ॥ ॥ रजस्सत्त्वतमोद्वर्ती त्रिगुणात्मा त्रिलोकधृत्
    । हरिमायागुणोपेतो ॥ परमात्मा परञ्ज्योतिः पञ्चकृत्य ॥ सदसत्परमः पूर्णो वाङ्मयो वरदोऽच्युतः । जीवो गुरुर्हंसरूपः
    पञ्चाशत्पीठरूपकः ॥ ॥ मातृकामण्डलाध्यक्षो मधुध्वंसी मनोमयः । बुद्धिरूपश्चित्तसाक्षी सारो हंसाक्षरद्वयः
    ॥ मयो विभुः । स्रष्टा क्रियास्पद ॥ निरायुधो ह्यसंरम्भः सर्वायुध समन्वितः । ओम्काररूपी पूर्णात्मा आङ्कारस्साध्य
    ॥ ऐङ्कारो वाक्प्रदो वग्मी श्रीङ्कारैश्वर्यवर्धनः । क्लीङ्कारमोहनाकारो हुम्फट्क्षोभणाकृतिः ॥ नाशकः
    । वीराराध्यो विश्वरूपः वैष्णवो विष्णुरूपकः ॥ ॥ सत्यव्रतः सत्यधरः सत्यधर्मानुषङ्गकः ॥ ॥ श्री सुदर्शनाष्टोत्तरशतनाम
    स्तोत्रं सम्पूर्णम्॥
