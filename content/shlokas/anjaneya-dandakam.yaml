id: anjaneya-dandakam
category: stotram
name:
  english: Anjaneya Dandakam
content:
  english: shri anjaneyam prasannanjaneyam prabhadivyakayam prakirti pradayam bhaje vayuputram bhaje valagatram
    bhajeham pavitram bhaje suryamitram bhaje rudrarupam bhaje brahmatejam batancun prabhatambu sayantramun
    ninamasankirtanal jesi ni rupu varninci nimida ne dandakam bòkkatin jeya nohinci ni murtigavinci nisundaram
    bènci ni dasadasundanai ramabhaktundanai ninnu negòlcèdan nan katakshambunan jucite vedukal cesite
    na mòralincite nannu rakshincite anjanadevi garbhanvaya deva ninnènca nenèntavadan dayashalivai juciyun
    datavai brociyun daggaran nilciyun dòlli sugrivukun mantrivai svami karyarthamai yegi shrirama saumitrulam
    juci varinvicarinci sarveshu bujinci yabbhanujum bantu gavinci yavvalinin jampinci kakutthsa tilakun
    dayadrishti vikshinci kishkindhaketènci shrirama karyarthamai lanka ketènciyun lankinin jampiyun lankanun
    galciyun yabhbhumijam juci yanandamuppòngi yayungarambicci yaratnamun dècci shriramunakunnicci santoshamun
    jesi sugrivunin yangadun jambavantu viradhulan gudi yasetuvun dati vanarul daityulan druncaga ravanundanta
    kalagni rudrunduga kori brahmandamainatti ya shaktinin vaici yalakshanun murchanòndimpaga nappude
    poyi dècci saumitrikinnicci pranambu rakshimpaga kumbhakarnadula nvirulam bora shrirama banagni varandarin
    ravanun jampaga nanta lokambu lanandamai yunda navvelanu nvibhishunun vedukan dodukan vacci pattabhishekambu
    ceyinci sitamahadevinin dècci jòcci pattabhishekambu samrambhamaiyunna nikanna nakèvvarun gurmi lerancu
    mannincinan shriramabhakti prashastambuga ninnu ninama sankirtanal cesiti papamul lbayune bhayamulun
    dirune bhagyamul galgune sakala samrajyamul galgu sampattulun kalguno vanarakara yo bhakta mandara
    yo punya sancara yo dhira yo vira nive samastambu nive mahaphalamuga vèlasi yataraka brahma mantrambu
    sandhanamun ceyucu sthirammugan vajradehambunun dalci shrirama shriramayancun manahputamaina èppudun
    tappakan talatuna jihvayandundi ni dirghadehammu trailokya sancarivai ramanamankita dhyanivai brahmavai
    brahmatejambunan raudranijvala kallola havira hanumanta onkara shabdambulan krurakarma graha bhuta
    pretambulan bèn pishacambulan shakini dhakini mohini tyadulan galidayyambulan nidu valambunan jutti
    nelambadam gòtti nimushti ghatambulan bahudandambulan romakhandambulan drunci kalagni rudrundavai
    nivu brahma prabhabhasitambaina nidivya tejambunun juci rara namuddu narasimha yan cun dayadrishti
    vikshinci nannelu nasvamiyo yanjaneya namaste sada brahmacari namaste vratapurnahari namaste namovayuputra
    namaste namo namah
  devanagari: श्री आञ्जनेयं प्रसन्नाञ्जनेयं प्रभादिव्यकायं प्रकीर्ति प्रदायं भजे वायुपुत्रं भजे वालगात्रं
    भजेहं पवित्रं भजे सूर्यमित्रं भजे रुद्ररूपं भजे ब्रह्मतेजं बटञ्चुन् प्रभातम्बु सायन्त्रमुन् नीनामसङ्कीर्तनल्
    जेसि नी रूपु वर्णिञ्चि नीमीद ने दण्डकं बॊक्कटिन् जेय नोहिन्चि नी मूर्तिगाविञ्चि नीसुन्दरं बॆञ्चि नी
    दासदासुण्डनै रामभक्तुण्डनै निन्नु नेगॊल्चॆदन् नन् कटाक्षम्बुनन् जूचिते वेडुकल् चेसिते ना मॊरालिञ्चिते
    नन्नु रक्षिञ्चिते अञ्जनादेवि गर्भान्वया देव निन्नॆञ्च नेनॆन्तवाडन् दयाशालिवै जूचियुन् दातवै ब्रोचियुन्
    दग्गरन् निल्चियुन् दॊल्लि सुग्रीवुकुन् मन्त्रिवै स्वामि कार्यार्थमै येगि श्रीराम सौमित्रुलं जूचि वारिन्विचारिञ्चि
    सर्वेशु बूजिञ्चि यब्भानुजुं बण्टु गाविञ्चि यव्वालिनिन् जम्पिञ्चि काकुत्थ्स तिलकुन् दयादृष्टि वीक्षिञ्चि
    किष्किन्धकेतॆञ्चि श्रीराम कार्यार्थमै लङ्क केतॆञ्चियुन् लङ्किणिन् जम्पियुन् लङ्कनुन् गाल्चियुन् यभ्भूमिजं
    जूचि यानन्दमुप्पॊङ्गि यायुङ्गरम्बिच्चि यारत्नमुन् दॆच्चि श्रीरामुनकुन्निच्चि सन्तोषमुन् जेसि सुग्रीवुनिन्
    यङ्गदुन् जाम्बवन्तु वीराधुलन् गूडि यासेतुवुन् दाटि वानरुल् दैत्युलन् द्रुञ्चगा रावणुण्डन्त कालाग्नि
    रुद्रुण्डुगा कोरि ब्रह्माण्डमैनट्टि या शक्तिनिन् वैचि यालक्षणुन् मूर्छनॊन्दिम्पगा नप्पुडे पोयि दॆच्चि
    सौमित्रिकिन्निच्चि प्राणम्बु रक्षिम्पग कुम्भकर्णादुल न्वीरुलं बोर श्रीराम बाणाग्नि वारन्दरिन् रावणुन्
    जम्पगा नन्त लोकम्बु लानन्दमै युण्ड नव्वेलनु न्विभीषुणुन् वेडुकन् दोडुकन् वच्चि पट्टाभिषेकम्बु चेयिञ्चि
    सीतामहादेविनिन् दॆच्चि जॊच्चि पट्टाभिषेकम्बु संरम्भमैयुन्न नीकन्न नाकॆव्वरुन् गूर्मि लेरञ्चु मन्निञ्चिनन्
    श्रीरामभक्ति प्रशस्तम्बुगा निन्नु नीनाम सङ्कीर्तनल् चेसिति पापमुल् ल्बायुने भयमुलुन् दीरुने भाग्यमुल्
    गल्गुने सकल साम्राज्यमुल् गल्गु सम्पत्तुलुन् कल्गुनो वानराकार यो भक्त मन्दार यो पुण्य सञ्चार यो धीर
    यो वीर नीवे समस्तम्बु नीवे महाफलमुगा वॆलसि यातारक ब्रह्म मन्त्रम्बु सन्धानमुन् चेयुचु स्थिरम्मुगन्
    वज्रदेहम्बुनुन् दाल्चि श्रीराम श्रीरामयञ्चुन् मनःपूतमैन ऎप्पुडुन् तप्पकन् तलतुना जिह्वयन्दुण्डि नी
    दीर्घदेहम्मु त्रैलोक्य सञ्चारिवै रामनामाङ्कित ध्यानिवै ब्रह्मवै ब्रह्मतेजम्बुनन् रौद्रनीज्वाल कल्लोल
    हावीर हनुमन्त ओङ्कार शब्दम्बुलन् क्रूरकर्म ग्रह भूत प्रेतम्बुलन् बॆन् पिशाचम्बुलन् शाकिनी ढाकिनी मोहिनि
    त्यादुलन् गालिदय्यम्बुलन् नीदु वालम्बुनन् जुट्टि नेलम्बडं गॊट्टि नीमुष्टि घातम्बुलन् बाहुदण्डम्बुलन्
    रोमखण्डम्बुलन् द्रुञ्चि कालाग्नि रुद्रुण्डवै नीवु ब्रह्म प्रभाभासितम्बैन नीदिव्य तेजम्बुनुन् जूचि
    रारा नामुद्दु नरसिंह यन् चुन् दयादृष्टि वीक्षिञ्चि नन्नेलु नास्वामियो याञ्जनेया नमस्ते सदा ब्रह्मचारी
    नमस्ते व्रतपूर्णहारि नमस्ते नमोवायुपुत्रा नमस्ते नमो नमः
