id: gopala-sahasra-nama-stotram
category: stotram
name:
  english: Gopala Sahasra Nama Stotram
content:
  english: kailasashikhare ramye gauri papraccha shankaram | brahmandakhilanathastvam srishtisamharakarakah
    || || tvameva pujyase lokairbrahmavishnusuradibhih | nityam pathasi devesha kasya stotram maheshvara
    || || ashcaryamidamatyantam jayate mama shankara | tatpranesha mahaprajna samshayam chindhi me prabho
    || dhanyasi kritapunyasi parvati pranavallabhe | rahasyatirahasyam ca yatpricchasi varanane || ||
    strisvabhavanmahadevi punastvam paripricchasi | gopaniyam gopaniyam gopaniyam prayatnatah || || datte
    ca siddhihanih syattasmadyatnena gopayet | idam rahasyam paramam purusharthapradayakam || || dhanaratnaughamanikyam
    turangam ca gajadikam | dadati smaranadeva mahamokshapradayakam || || tatte'ham sampravakshyami shrinushvavahita
    priye | yo'sau niranjano devashcitsvarupi janardanah || || samsarasagarottarakaranaya nrinam sada
    | shrirangadikarupena trailokyam vyapya tishthati || || tato loka mahamudha vishnubhaktivivarjitah
    | nishcayam nadhigacchanti punarnarayano harih || || niranjano nirakaro bhaktanam pritikamadah | brindavanaviharaya
    gopalam rupamudvahan || || muralivadanadhari radhayai pritimavahan | amshamshebhyah samunmilya purnarupakalayutah
    || || shrikrishnacandro bhagavan nandagopavarodyatah | dharanirupini mata yashoda nandagehini || ||
    dvabhyam prayacito natho devakyam vasudevatah | brahmana'bhyarthito devo devairapi sureshvarah ||
    || jato'vanyam ca mudito muralivacanecchaya | shriya sardham vacah kritva tato jato mahitale || ||
    samsarasarasarvasvam shyamalam mahadujjvalam | etajjyotiraham vandyam cintayami sanatanam || || gauratejo
    vina yastu shyamatejassamarcayet | japedva dhyayate vapi sa bhavetpataki shive || || sa brahmaha surapi
    ca svarnasteyi ca pancamah | etairdoshairvilipyeta tejobhedanmahishvari || || tasmajjyotirabhuddvedha
    radhamadhavarupakam | tasmadidam mahadevi gopalenaiva bhashitam || || durvasaso munermohe kartikyam
    rasamandale | tatah prishtavati radha sandeham bhedamatmanah || || niranjanatsamutpannam mayatitam
    jaganmayam | shrikrishnena tatah proktam radhayai naradaya ca || || tato naradatassarvam virala vaishnavastatha
    | kalau jananti deveshi gopaniyam prayatnatah || || shathaya kripanayatha dambhikaya sureshvari |
    brahmahatyamavapnoti tasmadyatnena gopayet || || om asya shrigopalasahasranamastotra mahamantrasya
    shrinarada rishih shrikrishnacandra bhaktirupaphalapraptaye shrigopalasahasranamastotrajape viniyogah
    | om aim klim bijam shri brindavananivasah kilakam shriradhapriyam param brahmeti mantrah dharmadi
    caturvidha purusharthasiddhyarthe jape viniyogah | nyasah | om narada rishaye namah shirasi | anushtup
    chandase namah mukhe | shrigopaladevatayai namah hridaye | klim kilakaya namah nabhau | hrim shaktaye
    namah guhye | shrim kilakaya namah phalayoh | om klim krishnaya govindaya gopijanavallabhaya svaha
    iti mulamantrah | karanyasah | om klam angushthabhyam namah | om klim tarjanibhyam namah | om klum
    madhyamabhyam namah | om klaim anamikabhyam namah | om klaum kanishthikabhyam namah | om klah karatalakaraprishthabhyam
    namah | hridayadinyasah | om klam hridayaya namah | om klim shirase svaha | om klum shikhayai vashat
    | om klaim kavacaya hum | om klaum netratrayaya vaushat | om klah astraya phat | mulamantranyasah
    | klim angushthabhyam namah | krishnaya tarjanibhyam namah | govindaya madhyamabhyam namah | gopijana
    anamikabhyam namah | vallabhaya kanishthikabhyam namah | svaha karatalakaraprishthabhyam namah | klim
    hridayaya namah | krishnaya shirase svaha | govindaya shikhayai vashat | gopijana kavacaya hum | vallabhaya
    netratrayaya vaushat | svaha astraya phat | dhyanam | phullendivarakantiminduvadanam barhavatamsapriyam
    shrivatsankamudarakaustubhadharam pitambaram sundaram | gopinam nayanotpalarcitatanum gogopasanghavritam
    govindam kalavenuvadanaparam divyangabhusham bhaje || || kasturitilakam lalataphalake vakshassthale
    kaustubham nasagre varamauktikam karatale venum kare kankanam | sarvange haricandanam ca kalayan kanthe
    ca muktavalim gopastripariveshtito vijayate gopalacudamanih || || om klim devah kamadevah kamabijashiromanih
    | shrigopalo mahipalo vedavedangaparagah || || krishnah kamalapatrakshah pundarikah sanatanah | gopatirbhupatih
    shasta praharta vishvatomukhah || || adikarta mahakarta mahakalah pratapavan | jagajjivo jagaddhata
    jagadbharta jagadvasuh || || matsyo bhimah kuhubharta harta varahamurtiman | narayano hrishikesho
    govindo garudadhvajah || || gokulesho mahacandrah sharvaripriyakarakah | kamalamukhalolakshah pundarikah
    shubhavahah || || durvasah kapilo bhaumah sindhusagarasangamah | govindo gopatirgotrah kalindipremapurakah
    || || gopasvami gokulendrah govardhanavarapradah | nandadigokulatrata data daridryabhanjanah || ||
    sarvamangaladata ca sarvakamavarapradah | adikarta mahibharta sarvasagarasindhujah || || gajagami
    gajoddhari kami kamakalanidhih | kalankarahitashcandro bimbasyo bimbasattamah || || malakarah kripakarah
    kokilasvarabhushanah | ramo nilambaro dehi hali dvividamardanah || || sahasrakshapuribhetta mahamarivinashanah
    | shivah shivatamo bhetta balaratiprapujakah || || kumarivaradayi ca varenyo minaketanah | naro narayano
    dhiro dharapatirudaradhih || || shripatih shrinidhih shriman mapatih pratirajaha | brindapatih kulam
    grami dhama brahmasanatanah || || revatiramano ramah priyashcancalalocanah | ramayanasharirashca ramo
    ramah shriyahpatih || || sharvarah sharvari sharvah sarvatra shubhadayakah | radharadhayitaradhi radhacittapramodakah
    || || radharatisukhopeto radhamohanatatparah | radhavashikaro radhahridayambhojashatpadah || || radhalinganasammodo
    radhanartanakautukah | radhasanjatasamprito radhakamaphalapradah || || brindapatih kokanidhih kokashokavinashanah
    | candrapatishcandrapatishcandakodandabhanjanah || || ramo dasharathi ramo bhriguvamshasamudbhavah
    | atmaramo jitakrodho moho mohandhabhanjanah || || vrishabhanubhavo bhavi kashyapih karunanidhih |
    kolahalo halo hali hali haladharapriyah || || radhamukhabjamartando bhaskaro ravijo vidhuh | vidhirvidhata
    varuno varuno varunipriyah || || rohinihridayanandi vasudevatmajo balih | nilambaro rauhineyo jarasandhavadho'malah
    || || nago javambho virudo viraha varado bali | gopado vijayi vidvan shipivishtah sanatanah || ||
    parashuramavacograhi varagrahi srigalaha | damaghoshopadeshta ca rathagrahi sudarshanah || || virapatniyashastrata
    jaravyadhivighatakah | dvarakavasatattvajno hutashanavarapradah || || yamunavegasamhari nilambaradharah
    prabhuh | vibhuh sharasano dhanvi ganesho gananayakah || || lakshmano lakshano lakshyo rakshovamshavinashakah
    | vamano vamanibhuto vamano vamanaruhah || || yashodanandanah karta yamalarjunamuktidah | ulukhali
    mahamano damabaddhahvayi shami || || bhaktanukari bhagavan keshavo'caladharakah | keshiha madhuha
    mohi vrishasuravighatakah || || aghasuravighati ca putanamokshadayakah | kubjavinodi bhagavan kamsamrityurmahamukhi
    || || ashvamedho vajapeyo gomedho naramedhavan | kandarpakotilavanyashcandrakotisushitalah || || ravikotipratikasho
    vayukotimahabalah | brahma brahmandakarta ca kamalavanchitapradah || || kamali kamalakshashca kamalamukhalolupah
    | kamalavratadhari ca kamalabhah purandarah || || saubhagyadhikacittashca mahamayi madotkatah | tatakarih
    suratrata maricakshobhakarakah || || vishvamitrapriyo danto ramo rajivalocanah | lankadhipakuladhvamsi
    vibhishanavarapradah || || sitanandakaro ramo viro varidhibandhanah | kharadushanasamhari saketapuravasavan
    || || candravalipatih kulah keshikamsavadho'marah | madhavo madhuha madhvi madhviko madhavi vibhuh
    || || munjatavigahamano dhenukarirdashatmajah | vamshivatavihari ca govardhanavanashrayah || || tatha
    talavanoddeshi bhandiravanashankarah | trinavartakripakari vrishabhanusutapatih || || radhapranasamo
    radhavadanabjamadhutkatah | gopiranjanadaivajnah lilakamalapujitah || || kridakamalasandoho gopikapritiranjanah
    | ranjako ranjano rango rangi rangamahiruhah || || kamah kamaribhaktashca puranapurushah kavih | narado
    devalo bhimo balo balamukhambujah || || ambujo brahmasakshi ca yogi dattavaro munih | rishabhah parvato
    gramo nadipavanavallabhah || || padmanabhah surajyeshtho brahma rudro'hibhushitah | gananam tranakarta
    ca ganesho grahilo grahih || || ganashrayo ganadhyaksho krodikritajagattrayah | yadavendro dvarakendro
    mathuravallabho dhuri || || bhramarah kuntali kuntisutarakshi mahamanah | yamunavaradata ca kashyapasya
    varapradah || || shankhacudavadhoddamo gopirakshanatatparah | pancajanyakaro rami trirami vanajo jayah
    || || phalgunah phalgunasakho viradhavadhakarakah | rukminiprananathashca satyabhamapriyankarah ||
    || kalpavriksho mahavriksho danavriksho mahaphalah | ankusho bhusuro bhavo bhamako bhramako harih
    || || saralah shashvato viro yaduvamshashivatmakah | pradyumno balakarta ca praharta daityaha prabhuh
    || || mahadhano mahaviro vanamalavibhushanah | tulasidamashobhadhyo jalandharavinashanah || || surah
    suryo mrikandushca bhasvaro vishvapujitah | ravistamoha vahnishca badabo badabanalah || || daityadarpavinashi
    ca garudo garudagrajah | gopinatho mahinatho brindanatho'varodhakah || || prapanci pancarupashca latagulmashca
    gomatih | ganga ca yamunarupo goda vetravati tatha || || kaveri narmada tapi gandaki sarayu rajah
    | rajasastamasassattvi sarvangi sarvalocanah || || sudhamayo'mritamayo yoginam vallabhah shivah |
    buddho buddhimatam shreshtho vishnurjishnuh shacipatih || || vamshi vamshadharo loko viloko mohanashanah
    | ravaravo ravo ravo valo valo valahakah || || shivo rudro nalo nilo langali langalashrayah | paradah
    pavano hamso hamsarudho jagatpatih || || mohinimohano mayi mahamayo mahasukhi | vrisho vrishakapih
    kalah kalidamanakarakah || || kubjabhagyaprado viro rajakakshayakarakah | komalo varuni raja jalajo
    jaladharakah || || harakah sarvapapaghnah parameshthi pitamahah | khadgadhari kripakari radharamanasundarah
    || || dvadasharanyasambhogi sheshanagaphanalayah | kamah shyamah sukhashridah shripatih shrinidhih
    kritih || || harirharo naro naro narottama ishupriyah | gopalacittaharta ca karta samsaratarakah ||
    || adidevo mahadevo gaurigururanashrayah | sadhurmadhurvidhurdhata trata'kruraparayanah || || rolambi
    ca hayagrivo vanararirvanashrayah | vanam vani vanadhyaksho mahavandyo mahamunih || || syamantakamaniprajnah
    vijno vighnavighatakah | govardhano vardhaniyo vardhani vardhanapriyah || || vardhanyo vardhano vardhi
    vardhishnastu sukhapriyah | vardhito vardhako vriddho brindarakajanapriyah || || gopalaramanibharta
    sambakushthavinashanah | rukminiharanaprema premi candravalipatih || || shrikarta vishvabharta ca
    narayana naro bali | gano ganapatishcaiva dattatreyo mahamunih || || vyaso narayano divyo bhavyo bhavukadharakah
    | shvahshreyasam shivam bhadram bhavukam bhavukam shubham || || shubhatmakah shubhah shasta prashasto
    meghanadaha | brahmanyadevo dinanamuddharakaranakshamah || || krishnah kamalapatrakshah krishnah kamalalocanah
    | krishnah kami sada krishnah samastapriyakarakah || || nando nandi mahanandi madi madanakah kili
    | mili hili gili goli golo golalayo guli || || gugguli maraki shakhi vatah pippalakah kriti | mlecchaha
    kalaharta ca yashoda yasha eva ca || || acyutah keshavo vishnuh harih satyo janardanah | hamso narayano
    nilo lino bhaktiparayanah || || janakivallabho ramo viramo vishanashanah | simhabhanurmahabhanu rvirabhanurmahodadhih
    || || samudro'bdhirakuparah paravarah saritpatih | gokulanandakari ca pratijnaparipalakah || || sadaramah
    kriparamo maharamo dhanurdharah | parvatah parvatakaro gayo geyo dvijapriyah || || kamalashvataro
    ramo ramayanapravartakah | dyaurdivo divaso divyo bhavyo bhagi bhayapahah || || parvatibhagyasahito
    bharta lakshmisahayavan | vilasi sahasi sarvi garvi garvitalocanah || || surarirlokadharmajno jivano
    jivanantakah | yamo yamariryamano yami yamavighatakah || || vamshuli pamshuli pamsuh pandurarjunavallabhah
    | lalita candrikamala mali malambujashrayah || || ambujaksho mahayaksho dakshashcintamaniprabhuh |
    manirdinamanishcaiva kedaro badarishrayah || || badarivanasamprito vyasah satyavatisutah | amararinihanta
    ca sudhasindhuvidhudayah || || candro ravih shivah shuli cakri caiva gadadharah | shrikarta shripatih
    shridah shridevo devakisutah || || shripatih pundarikakshah padmanabho jagatpatih | vasudevo'prameyatma
    keshavo garudadhvajah || || narayanah param dhama devadevo maheshvarah | cakrapanih kalapurno vedavedyo
    dayanidhih || || bhagavan sarvabhutesho gopalah sarvapalakah | ananto nirguno nityo nirvikalpo niranjanah
    || || niradharo nirakaro nirabhaso nirashrayah | purushah pranavatito mukundah parameshvarah || ||
    kshanavanih sarvabhaumo vaikuntho bhaktavatsalah | vishnurdamodarah krishno madhavo mathurapatih ||
    || devakigarbhasambhuto yashodavatsalo harih | shivah sankarshanah shambhurbhutanatho divaspatih ||
    || avyayah sarvadharmajno nirmalo nirupadravah | nirvananayako nityo nilajimutasannibhah || || kalakshayashca
    sarvajnah kamalarupatatparah | hrishikeshah pitavasa vasudevapriyatmajah || || nandagopakumararyo
    navanitashano vibhuh | puranah purushashreshthah shankhapanih suvikramah || || aniruddhashcakradharah
    sharngapanishcaturbhujah | gadadharah surartighno govindo nandakayudhah || || brindavanacarah shaurirvenuvadyavisharadah
    | trinavartantako bhimasahaso bahuvikramah || || shakatasurasamhari bakasuravinashanah | dhenukasurasamhari
    putanarirnrikesari || || pitamaho gurussakshi pratyagatma sadashivah | aprameyah prabhuh prajno'pratarkyah
    svapnavardhanah || || dhanyo manyo bhavo bhavo dhirah shanto jagadguruh | antaryamishvaro divyo daivajno
    devasamstutah || || kshirabdhishayano dhata lakshmivan lakshmanagrajah | dhatripatirameyatma candrashekharapujitah
    || || lokasakshi jagaccakshuh punyacaritrakirtanah | kotimanmathasaundaryo jaganmohanavigrahah ||
    || mandasmitatanurgopagopikapariveshtitah | phullaravindanayanashcanurandhranishudanah || || indivaradalashyamo
    barhibarhavatamsakah | muralininadahlado divyamalambaravritah || || sukapolayugah subhruyugalah sulalatakam
    | kambugrivo vishalaksho lakshmivanchubhalakshanah || || pinavakshashcaturbahushcaturmurtistrivikramah
    | kalankarahitah shuddho dushtashatrunibarhanah || || kiritakundaladharah katakangadamanditah | mudrikabharanopetah
    katisutravirajitah || || manjiraranjitapadah sarvabharanabhushitah | vinyastapadayugalo divyamangalavigrahah
    || || gopikanayananandah purnacandranibhananah | samastajagadanandah sundaro lokanandanah || || yamunatirasancari
    radhamanmathavaibhavah | gopanaripriyo danto gopivastrapaharakah || || shringaramurtih shridhama tarako
    mulakaranam | srishtisamrakshanopayah krurasuravibhanjanah || || narakasurasamhari murarirvairimardanah
    | aditeyapriyo daityabhikaro yadushekharah || || jarasandhakuladhvamsi kamsaratih suvikramah | punyashlokah
    kirtaniyo yadavendro jagannutah || || rukminiramanah satyabhamajambavatipriyah | mitravindanagnajitilakshmanasamupasitah
    || || sudhakarakule jato'nantah prabalavikramah | sarvasaubhagyasampanno dvarakapattanasthitah ||
    || bhadrasuryasutanatho lilamanushavigrahah | sahasrashodashastrisho bhogamokshaikadayakah || || vedantavedyah
    samvedyo vaidyo brahmandanayakah | govardhanadharo nathah sarvajivadayaparah || || murtiman sarvabhutatma
    artatranaparayanah | sarvajnah sarvasulabhah sarvashastravisharadah || || shadgunaishvaryasampannah
    purnakamo dhurandharah | mahanubhavah kaivalyadayako lokanayakah || || adimadhyantarahitah shuddhasattvikavigrahah
    | asamanah samastatma sharanagatavatsalah || || utpattisthitisamharakaranam sarvakaranam | gambhirah
    sarvabhavajnah saccidanandavigrahah || || vishvaksenah satyasandhah satyavak satyavikramah | satyavratah
    satyaratah satyadharmaparayanah || || apannartiprashamanah draupadimanarakshakah | kandarpajanakah
    prajno jagannatakavaibhavah || || bhaktivashyo gunatitah sarvaishvaryapradayakah | damaghoshasutadveshi
    banabahuvikhandanah || || bhishmabhaktiprado divyah kauravanvayanashanah | kaunteyapriyabandhushca
    parthasyandanasarathih || || narasimho mahavirah stambhajato mahabalah | prahladavaradah satyo devapujyo'bhayankarah
    || || upendra indravarajo vamano balibandhanah | gajendravaradah svami sarvadevanamaskritah || ||
    sheshaparyankashayano vainateyaratho jayi | avyahatabalaishvaryasampannah purnamanasah || || yogishvareshvarah
    sakshi kshetrajno jnanadayakah | yogihritpankajavaso yogamayasamanvitah || || nadabindukalatitashcaturvargaphalapradah
    | sushumnamargasancari dehasyantarasamsthitah || || dehendriyamanahpranasakshi cetahprasadakah | sukshmah
    sarvagato dehi jnanadarpanagocarah || || tattvatrayatmako'vyaktah kundali samupashritah | brahmanyah
    sarvadharmajnah shanto danto gataklamah || || shrinivasah sadanando vishvamurtirmahaprabhuh | sahasrashirsha
    purushah sahasrakshah sahasrapat || || samastabhuvanadharah samastapranarakshakah | samastassarvabhavajno
    gopikapranavallabhah || || nityotsavo nityasaukhyo nityashrirnityamangalam | vyuharcito jagannathah
    shrivaikunthapuradhipah || || purnanandaghanibhuto gopaveshadharo harih | kalapakusumashyamah komalah
    shantavigrahah || || gopanganavrito'nanto brindavanasamashrayah | venunadaratah shreshtho devanam
    hitakarakah || || jalakridasamasakto navanitasya taskarah | gopalakaminijarashcorajarashikhamanih
    || || paranjyotih parakashah paravasah parisphutah | ashtadashaksharo mantro vyapako lokapavanah ||
    || saptakotimahamantrashekharo devashekharah | vijnanajnanasandhanastejorashirjagatpatih || || bhaktalokaprasannatma
    bhaktamandaravigrahah | bhaktadaridryashamano bhaktanam pritidayakah || || bhaktadhinamanah pujyo
    bhaktalokashivankarah | bhaktabhishtapradah sarvabhaktaghaughanikrintakah || || aparakarunasindhurbhagavan
    bhaktatatparah || iti shriradhikanatha namnam sahasramiritam | smaranatpaparashinam khandanam mrityunashanam
    || || vaishnavanam priyakaram mahadaridryanashanam | brahmahatyasurapanam parastrigamanam tatha ||
    || paradravyapaharanam paradveshasamanvitam | manasam vacikam kayam yatpapam papasambhavam || || sahasranamapathanatsarve
    nashyanti tatkshanat | mahadaridryayukto vai vaishnavo vishnubhaktiman || || kartikyam yah pathedratrau
    shatamashtottaram kramat | pitambaradharo dhiman sugandhi pushpacandanaih || || pustakam pujayitva
    ca naivedyadibhireva ca | radhadhyanankito dhiro vanamalavibhushitah || || shatamashtottaram devi
    pathennamasahasrakam | caitre krishne ca shukle ca kuhusankrantivasare || || pathitavyam prayatnena
    trailokyam mohayet kshanat | tulasimalaya yukto vaishnavo bhaktitatparah || || ravivare ca shukre
    ca dvadashyam shraddhavasare | brahmanam pujayitva ca bhojayitva vidhanatah || || pathennamasahasram
    ca tatah siddhih prajayate | mahanishayam satatam vaishnavo yah pathetsada || || deshantaragata lakshmih
    samayati na samshayah | trailokye tu mahadevi sundaryah kamamohitah || || mugdhah svayam samayanti
    vaishnavam ca bhajanti tah | rogi rogatpramucyeta baddho mucyeta bandhanat || || garbhini janayetputram
    kanya vindati satpatim | rajano vashatam yanti kim punah kshudramanushah || || sahasranamashravanat
    pathanat pujanat priye | dharanat sarvamapnoti vaishnavo natra samshayah || || vamshivate canyavate
    tatha pippalake'tha va | kadambapadapatale shrigopalasya sannidhau || || yah pathedvaishnavo nityam
    sa yati harimandiram | krishnenoktam radhikayai taya proktam pura shive || || naradaya maya proktam
    naradena prakashitam | maya tava vararohe proktametatsudurlabham || || gopaniyam prayatnena na prakashyam
    kadacana | shathaya papine caiva lampataya visheshatah || || na datavyam na datavyam na datavyam kadacana
    | deyam shantaya shishyaya vishnubhaktirataya ca || || godanabrahmayajnadervajapeyashatasya ca | ashvamedhasahasrasya
    phalam pathe bhaveddhruvam || || mohanam stambhanam caiva maranoccatanadikam | yadyadvanchati cittena
    tattatprapnoti vaishnavah || || ekadashyam narah snatva sugandhadravyatailakaih | aharam brahmane
    dattva dakshinam svarnabhushanam || || tatah prarambhakartasau sarvam prapnoti manavah | shatavritta
    sahasram ca yah pathedvaishnavo janah || || shribrindavanacandrasya prasadatsarvamapnuyat | yadgrihe
    pustakam devi pujitam caiva tishthati || || na mari na ca durbhiksham nopasargabhayam kvacit | sarpadibhutayakshadya
    nashyante natra samshayah || || shrigopalo mahadevi vasettasya grihe sada | yadgrihe ca sahasram ca
    namnam tishthati pujitam || || iti shrisammohanatantre haragaurisamvade shrigopala sahasranamastotram
    |
  devanagari: कैलासशिखरे रम्ये गौरी पप्रच्छ शङ्करम् । ब्रह्माण्डाखिलनाथस्त्वं सृष्टिसंहारकारकः ॥ ॥ त्वमेव
    पूज्यसे लोकैर्ब्रह्मविष्णुसुरादिभिः । नित्यं पठसि देवेश कस्य स्तोत्रं महेश्वर ॥ ॥ आश्चर्यमिदमत्यन्तं
    जायते मम शङ्कर । तत्प्राणेश महाप्राज्ञ संशयं छिन्धि मे प्रभो ॥ धन्यासि कृतपुण्यासि पार्वति प्राणवल्लभे
    । रहस्यातिरहस्यं च यत्पृच्छसि वरानने ॥ ॥ स्त्रीस्वभावान्महादेवि पुनस्त्वं परिपृच्छसि । गोपनीयं गोपनीयं
    गोपनीयं प्रयत्नतः ॥ ॥ दत्ते च सिद्धिहानिः स्यात्तस्माद्यत्नेन गोपयेत् । इदं रहस्यं परमं पुरुषार्थप्रदायकम्
    ॥ ॥ धनरत्नौघमाणिक्यं तुरङ्गं च गजादिकम् । ददाति स्मरणादेव महामोक्षप्रदायकम् ॥ ॥ तत्तेऽहं सम्प्रवक्ष्यामि
    शृणुष्वावहिता प्रिये । योऽसौ निरञ्जनो देवश्चित्स्वरूपी जनार्दनः ॥ ॥ संसारसागरोत्तारकारणाय नृणां सदा
    । श्रीरङ्गादिकरूपेण त्रैलोक्यं व्याप्य तिष्ठति ॥ ॥ ततो लोका महामूढा विष्णुभक्तिविवर्जिताः । निश्चयं
    नाधिगच्छन्ति पुनर्नारायणो हरिः ॥ ॥ निरञ्जनो निराकारो भक्तानां प्रीतिकामदः । बृन्दावनविहाराय गोपालं
    रूपमुद्वहन् ॥ ॥ मुरलीवादनाधारी राधायै प्रीतिमावहन् । अंशांशेभ्यः समुन्मील्य पूर्णरूपकलायुतः ॥ ॥ श्रीकृष्णचन्द्रो
    भगवान् नन्दगोपवरोद्यतः । धरणीरूपिणी माता यशोदा नन्दगेहिनी ॥ ॥ द्वाभ्यां प्रयाचितो नाथो देवक्यां वसुदेवतः
    । ब्रह्मणाऽभ्यर्थितो देवो देवैरपि सुरेश्वरः ॥ ॥ जातोऽवन्यां च मुदितो मुरलीवाचनेच्छया । श्रिया सार्धं
    वचः कृत्वा ततो जातो महीतले ॥ ॥ संसारसारसर्वस्वं श्यामलं महदुज्ज्वलम् । एतज्ज्योतिरहं वन्द्यं चिन्तयामि
    सनातनम् ॥ ॥ गौरतेजो विना यस्तु श्यामतेजस्समर्चयेत् । जपेद्वा ध्यायते वापि स भवेत्पातकी शिवे ॥ ॥ स
    ब्रह्महा सुरापी च स्वर्णस्तेयी च पञ्चमः । एतैर्दोषैर्विलिप्येत तेजोभेदान्महीश्वरि ॥ ॥ तस्माज्ज्योतिरभूद्द्वेधा
    राधामाधवरूपकम् । तस्मादिदं महादेवि गोपालेनैव भाषितम् ॥ ॥ दुर्वाससो मुनेर्मोहे कार्तिक्यां रासमण्डले
    । ततः पृष्टवती राधा सन्देहं भेदमात्मनः ॥ ॥ निरञ्जनात्समुत्पन्नं मायातीतं जगन्मयम् । श्रीकृष्णेन ततः
    प्रोक्तं राधायै नारदाय च ॥ ॥ ततो नारदतस्सर्वं विरला वैष्णवास्तथा । कलौ जानन्ति देवेशि गोपनीयं प्रयत्नतः
    ॥ ॥ शठाय कृपणायाथ डाम्भिकाय सुरेश्वरि । ब्रह्महत्यामवाप्नोति तस्माद्यत्नेन गोपयेत् ॥ ॥ ॐ अस्य श्रीगोपालसहस्रनामस्तोत्र
    महामन्त्रस्य श्रीनारद ऋषिः श्रीकृष्णचन्द्र भक्तिरूपफलप्राप्तये श्रीगोपालसहस्रनामस्तोत्रजपे विनियोगः
    । ॐ ऐं क्लीं बीजं श्री बृन्दावननिवासः कीलकं श्रीराधाप्रियं परं ब्रह्मेति मन्त्रः धर्मादि चतुर्विध
    पुरुषार्थसिद्ध्यर्थे जपे विनियोगः । न्यासः । ॐ नारद ऋषये नमः शिरसि । अनुष्टुप् छन्दसे नमः मुखे । श्रीगोपालदेवतायै
    नमः हृदये । क्लीं कीलकाय नमः नाभौ । ह्रीं शक्तये नमः गुह्ये । श्रीं कीलकाय नमः फालयोः । ॐ क्लीं कृष्णाय
    गोविन्दाय गोपीजनवल्लभाय स्वाहा इति मूलमन्त्रः । करन्यासः । ॐ क्लां अङ्गुष्ठाभ्यां नमः । ॐ क्लीं तर्जनीभ्यां
    नमः । ॐ क्लूं मध्यमाभ्यां नमः । ॐ क्लैं अनामिकाभ्यां नमः । ॐ क्लौं कनिष्ठिकाभ्यां नमः । ॐ क्लः करतलकरपृष्ठाभ्यां
    नमः । हृदयादिन्यासः । ॐ क्लां हृदयाय नमः । ॐ क्लीं शिरसे स्वाहा । ॐ क्लूं शिखायै वषट् । ॐ क्लैं कवचाय
    हुम् । ॐ क्लौं नेत्रत्रयाय वौषट् । ॐ क्लः अस्त्राय फट् । मूलमन्त्रन्यासः । क्लीं अङ्गुष्ठाभ्यां नमः
    । कृष्णाय तर्जनीभ्यां नमः । गोविन्दाय मध्यमाभ्यां नमः । गोपीजन अनामिकाभ्यां नमः । वल्लभाय कनिष्ठिकाभ्यां
    नमः । स्वाहा करतलकरपृष्ठाभ्यां नमः । क्लीं हृदयाय नमः । कृष्णाय शिरसे स्वाहा । गोविन्दाय शिखायै वषट्
    । गोपीजन कवचाय हुम् । वल्लभाय नेत्रत्रयाय वौषट् । स्वाहा अस्त्राय फट् । ध्यानम् । फुल्लेन्दीवरकान्तिमिन्दुवदनं
    बर्हावतंसप्रियं श्रीवत्साङ्कमुदारकौस्तुभधरं पीताम्बरं सुन्दरम् । गोपीनां नयनोत्पलार्चिततनुं गोगोपसङ्घावृतं
    गोविन्दं कलवेणुवादनपरं दिव्याङ्गभूषं भजे ॥ ॥ कस्तूरीतिलकं ललाटफलके वक्षस्स्थले कौस्तुभं नासाग्रे वरमौक्तिकं
    करतले वेणुं करे कङ्कणम् । सर्वाङ्गे हरिचन्दनं च कलयन् कण्ठे च मुक्तावलिं गोपस्त्रीपरिवेष्टितो विजयते
    गोपालचूडामणिः ॥ ॥ ॐ क्लीं देवः कामदेवः कामबीजशिरोमणिः । श्रीगोपालो महीपालो वेदवेदाङ्गपारगः ॥ ॥ कृष्णः
    कमलपत्राक्षः पुण्डरीकः सनातनः । गोपतिर्भूपतिः शास्ता प्रहर्ता विश्वतोमुखः ॥ ॥ आदिकर्ता महाकर्ता महाकालः
    प्रतापवान् । जगज्जीवो जगद्धाता जगद्भर्ता जगद्वसुः ॥ ॥ मत्स्यो भीमः कुहूभर्ता हर्ता वाराहमूर्तिमान्
    । नारायणो हृषीकेशो गोविन्दो गरुडध्वजः ॥ ॥ गोकुलेशो महाचन्द्रः शर्वरीप्रियकारकः । कमलामुखलोलाक्षः पुण्डरीकः
    शुभावहः ॥ ॥ दुर्वासाः कपिलो भौमः सिन्धुसागरसङ्गमः । गोविन्दो गोपतिर्गोत्रः कालिन्दीप्रेमपूरकः ॥ ॥
    गोपस्वामी गोकुलेन्द्रः गोवर्धनवरप्रदः । नन्दादिगोकुलत्राता दाता दारिद्र्यभञ्जनः ॥ ॥ सर्वमङ्गलदाता
    च सर्वकामवरप्रदः । आदिकर्ता महीभर्ता सर्वसागरसिन्धुजः ॥ ॥ गजगामी गजोद्धारी कामी कामकलानिधिः । कलङ्करहितश्चन्द्रो
    बिम्बास्यो बिम्बसत्तमः ॥ ॥ मालाकारः कृपाकारः कोकिलस्वरभूषणः । रामो नीलाम्बरो देही हली द्विविदमर्दनः
    ॥ ॥ सहस्राक्षपुरीभेत्ता महामारीविनाशनः । शिवः शिवतमो भेत्ता बलारातिप्रपूजकः ॥ ॥ कुमारीवरदायी च वरेण्यो
    मीनकेतनः । नरो नारायणो धीरो धरापतिरुदारधीः ॥ ॥ श्रीपतिः श्रीनिधिः श्रीमान् मापतिः प्रतिराजहा । बृन्दापतिः
    कुलं ग्रामी धाम ब्रह्मसनातनः ॥ ॥ रेवतीरमणो रामः प्रियश्चञ्चललोचनः । रामायणशरीरश्च रामो रामः श्रियःपतिः
    ॥ ॥ शर्वरः शर्वरी शर्वः सर्वत्र शुभदायकः । राधाराधयिताराधी राधाचित्तप्रमोदकः ॥ ॥ राधारतिसुखोपेतो राधामोहनतत्परः
    । राधावशीकरो राधाहृदयाम्भोजषट्पदः ॥ ॥ राधालिङ्गनसम्मोदो राधानर्तनकौतुकः । राधासञ्जातसम्प्रीतो राधाकामफलप्रदः
    ॥ ॥ बृन्दापतिः कोकनिधिः कोकशोकविनाशनः । चन्द्रापतिश्चन्द्रपतिश्चण्डकोदण्डभञ्जनः ॥ ॥ रामो दाशरथी रामो
    भृगुवंशसमुद्भवः । आत्मारामो जितक्रोधो मोहो मोहान्धभञ्जनः ॥ ॥ वृषभानुभवो भावी काश्यपिः करुणानिधिः ।
    कोलाहलो हलो हाली हली हलधरप्रियः ॥ ॥ राधामुखाब्जमार्ताण्डो भास्करो रविजो विधुः । विधिर्विधाता वरुणो
    वारुणो वारुणीप्रियः ॥ ॥ रोहिणीहृदयानन्दी वसुदेवात्मजो बलिः । नीलाम्बरो रौहिणेयो जरासन्धवधोऽमलः ॥ ॥
    नागो जवाम्भो विरुदो वीरहा वरदो बली । गोपदो विजयी विद्वान् शिपिविष्टः सनातनः ॥ ॥ परशुरामवचोग्राही वरग्राही
    सृगालहा । दमघोषोपदेष्टा च रथग्राही सुदर्शनः ॥ ॥ वीरपत्नीयशस्त्राता जराव्याधिविघातकः । द्वारकावासतत्त्वज्ञो
    हुताशनवरप्रदः ॥ ॥ यमुनावेगसंहारी नीलाम्बरधरः प्रभुः । विभुः शरासनो धन्वी गणेशो गणनायकः ॥ ॥ लक्ष्मणो
    लक्षणो लक्ष्यो रक्षोवंशविनाशकः । वामनो वामनीभूतो वमनो वमनारुहः ॥ ॥ यशोदानन्दनः कर्ता यमलार्जुनमुक्तिदः
    । उलूखली महामानो दामबद्धाह्वयी शमी ॥ ॥ भक्तानुकारी भगवान् केशवोऽचलधारकः । केशिहा मधुहा मोही वृषासुरविघातकः
    ॥ ॥ अघासुरविघाती च पूतनामोक्षदायकः । कुब्जाविनोदी भगवान् कंसमृत्युर्महामुखी ॥ ॥ अश्वमेधो वाजपेयो गोमेधो
    नरमेधवान् । कन्दर्पकोटिलावण्यश्चन्द्रकोटिसुशीतलः ॥ ॥ रविकोटिप्रतीकाशो वायुकोटिमहाबलः । ब्रह्मा ब्रह्माण्डकर्ता
    च कमलावाञ्छितप्रदः ॥ ॥ कमली कमलाक्षश्च कमलामुखलोलुपः । कमलाव्रतधारी च कमलाभः पुरन्दरः ॥ ॥ सौभाग्याधिकचित्तश्च
    महामायी मदोत्कटः । ताटकारिः सुरत्राता मारीचक्षोभकारकः ॥ ॥ विश्वामित्रप्रियो दान्तो रामो राजीवलोचनः
    । लङ्काधिपकुलध्वंसी विभीषणवरप्रदः ॥ ॥ सीतानन्दकरो रामो वीरो वारिधिबन्धनः । खरदूषणसंहारी साकेतपुरवासवान्
    ॥ ॥ चन्द्रावलिपतिः कूलः केशिकंसवधोऽमरः । माधवो मधुहा माध्वी माध्वीको माधवी विभुः ॥ ॥ मुञ्जाटवीगाहमानो
    धेनुकारिर्दशात्मजः । वंशीवटविहारी च गोवर्धनवनाश्रयः ॥ ॥ तथा तालवनोद्देशी भाण्डीरवनशङ्करः । तृणावर्तकृपाकारी
    वृषभानुसुतापतिः ॥ ॥ राधाप्राणसमो राधावदनाब्जमधूत्कटः । गोपीरञ्जनदैवज्ञः लीलाकमलपूजितः ॥ ॥ क्रीडाकमलसन्दोहो
    गोपिकाप्रीतिरञ्जनः । रञ्जको रञ्जनो रङ्गो रङ्गी रङ्गमहीरुहः ॥ ॥ कामः कामारिभक्तश्च पुराणपुरुषः कविः
    । नारदो देवलो भीमो बालो बालमुखाम्बुजः ॥ ॥ अम्बुजो ब्रह्मसाक्षी च योगी दत्तवरो मुनिः । ऋषभः पर्वतो
    ग्रामो नदीपवनवल्लभः ॥ ॥ पद्मनाभः सुरज्येष्ठो ब्रह्मा रुद्रोऽहिभूषितः । गणानां त्राणकर्ता च गणेशो ग्रहिलो
    ग्रहिः ॥ ॥ गणाश्रयो गणाध्यक्षो क्रोडीकृतजगत्त्रयः । यादवेन्द्रो द्वारकेन्द्रो मथुरावल्लभो धुरी ॥ ॥
    भ्रमरः कुन्तली कुन्तीसुतरक्षी महामनाः । यमुनावरदाता च काश्यपस्य वरप्रदः ॥ ॥ शङ्खचूडवधोद्दामो गोपीरक्षणतत्परः
    । पाञ्चजन्यकरो रामी त्रिरामी वनजो जयः ॥ ॥ फाल्गुणः फल्गुनसखो विराधवधकारकः । रुक्मिणीप्राणनाथश्च सत्यभामाप्रियङ्करः
    ॥ ॥ कल्पवृक्षो महावृक्षो दानवृक्षो महाफलः । अङ्कुशो भूसुरो भावो भामको भ्रामको हरिः ॥ ॥ सरलः शाश्वतो
    वीरो यदुवंशशिवात्मकः । प्रद्युम्नो बलकर्ता च प्रहर्ता दैत्यहा प्रभुः ॥ ॥ महाधनो महावीरो वनमालाविभूषणः
    । तुलसीदामशोभाढ्यो जालन्धरविनाशनः ॥ ॥ सूरः सूर्यो मृकण्डुश्च भास्वरो विश्वपूजितः । रविस्तमोहा वह्निश्च
    बाडबो बडबानलः ॥ ॥ दैत्यदर्पविनाशी च गरुडो गरुडाग्रजः । गोपीनाथो महीनाथो बृन्दानाथोऽवरोधकः ॥ ॥ प्रपञ्ची
    पञ्चरूपश्च लतागुल्मश्च गोमतिः । गङ्गा च यमुनारूपो गोदा वेत्रवती तथा ॥ ॥ कावेरी नर्मदा तापी गण्डकी
    सरयू रजः । राजसस्तामसस्सत्त्वी सर्वाङ्गी सर्वलोचनः ॥ ॥ सुधामयोऽमृतमयो योगिनां वल्लभः शिवः । बुद्धो
    बुद्धिमतां श्रेष्ठो विष्णुर्जिष्णुः शचीपतिः ॥ ॥ वंशी वंशधरो लोको विलोको मोहनाशनः । रवरावो रवो रावो
    वलो वालो वलाहकः ॥ ॥ शिवो रुद्रो नलो नीलो लाङ्गली लाङ्गलाश्रयः । पारदः पावनो हंसो हंसारूढो जगत्पतिः
    ॥ ॥ मोहिनीमोहनो मायी महामायो महासुखी । वृषो वृषाकपिः कालः कालीदमनकारकः ॥ ॥ कुब्जाभाग्यप्रदो वीरो रजकक्षयकारकः
    । कोमलो वारुणी राजा जलजो जलधारकः ॥ ॥ हारकः सर्वपापघ्नः परमेष्ठी पितामहः । खड्गधारी कृपाकारी राधारमणसुन्दरः
    ॥ ॥ द्वादशारण्यसम्भोगी शेषनागफणालयः । कामः श्यामः सुखश्रीदः श्रीपतिः श्रीनिधिः कृतिः ॥ ॥ हरिर्हरो
    नरो नारो नरोत्तम इषुप्रियः । गोपालचित्तहर्ता च कर्ता संसारतारकः ॥ ॥ आदिदेवो महादेवो गौरीगुरुरनाश्रयः
    । साधुर्मधुर्विधुर्धाता त्राताऽक्रूरपरायणः ॥ ॥ रोलम्बी च हयग्रीवो वानरारिर्वनाश्रयः । वनं वनी वनाध्यक्षो
    महावन्द्यो महामुनिः ॥ ॥ स्यमन्तकमणिप्राज्ञः विज्ञो विघ्नविघातकः । गोवर्धनो वर्धनीयो वर्धनी वर्धनप्रियः
    ॥ ॥ वार्धन्यो वर्धनो वर्धी वर्धिष्णस्तु सुखप्रियः । वर्धितो वर्धको वृद्धो बृन्दारकजनप्रियः ॥ ॥ गोपालरमणीभर्ता
    साम्बकुष्ठविनाशनः । रुक्मिणीहरणप्रेमा प्रेमी चन्द्रावलीपतिः ॥ ॥ श्रीकर्ता विश्वभर्ता च नारायण नरो
    बली । गणो गणपतिश्चैव दत्तात्रेयो महामुनिः ॥ ॥ व्यासो नारायणो दिव्यो भव्यो भावुकधारकः । श्वःश्रेयसं
    शिवं भद्रं भावुकं भवुकं शुभम् ॥ ॥ शुभात्मकः शुभः शास्ता प्रशस्तो मेघनादहा । ब्रह्मण्यदेवो दीनानामुद्धारकरणक्षमः
    ॥ ॥ कृष्णः कमलपत्राक्षः कृष्णः कमललोचनः । कृष्णः कामी सदा कृष्णः समस्तप्रियकारकः ॥ ॥ नन्दो नन्दी महानन्दी
    मादी मादनकः किली । मीली हिली गिली गोली गोलो गोलालयो गुली ॥ ॥ गुग्गुली मारकी शाखी वटः पिप्पलकः कृती
    । म्लेच्छहा कालहर्ता च यशोदा यश एव च ॥ ॥ अच्युतः केशवो विष्णुः हरिः सत्यो जनार्दनः । हंसो नारायणो
    नीलो लीनो भक्तिपरायणः ॥ ॥ जानकीवल्लभो रामो विरामो विषनाशनः । सिंहभानुर्महाभानु र्वीरभानुर्महोदधिः
    ॥ ॥ समुद्रोऽब्धिरकूपारः पारावारः सरित्पतिः । गोकुलानन्दकारी च प्रतिज्ञापरिपालकः ॥ ॥ सदारामः कृपारामो
    महारामो धनुर्धरः । पर्वतः पर्वताकारो गयो गेयो द्विजप्रियः ॥ ॥ कमलाश्वतरो रामो रामायणप्रवर्तकः । द्यौर्दिवो
    दिवसो दिव्यो भव्यो भागी भयापहः ॥ ॥ पार्वतीभाग्यसहितो भर्ता लक्ष्मीसहायवान् । विलासी साहसी सर्वी गर्वी
    गर्वितलोचनः ॥ ॥ सुरारिर्लोकधर्मज्ञो जीवनो जीवनान्तकः । यमो यमारिर्यमनो यमी यामविघातकः ॥ ॥ वंशुली पांशुली
    पांसुः पाण्डुरर्जुनवल्लभः । ललिता चन्द्रिकामाला माली मालाम्बुजाश्रयः ॥ ॥ अम्बुजाक्षो महायक्षो दक्षश्चिन्तामणिप्रभुः
    । मणिर्दिनमणिश्चैव केदारो बदरीश्रयः ॥ ॥ बदरीवनसम्प्रीतो व्यासः सत्यवतीसुतः । अमरारिनिहन्ता च सुधासिन्धुविधूदयः
    ॥ ॥ चन्द्रो रविः शिवः शूली चक्री चैव गदाधरः । श्रीकर्ता श्रीपतिः श्रीदः श्रीदेवो देवकीसुतः ॥ ॥ श्रीपतिः
    पुण्डरीकाक्षः पद्मनाभो जगत्पतिः । वासुदेवोऽप्रमेयात्मा केशवो गरुडध्वजः ॥ ॥ नारायणः परं धाम देवदेवो
    महेश्वरः । चक्रपाणिः कलापूर्णो वेदवेद्यो दयानिधिः ॥ ॥ भगवान् सर्वभूतेशो गोपालः सर्वपालकः । अनन्तो
    निर्गुणो नित्यो निर्विकल्पो निरञ्जनः ॥ ॥ निराधारो निराकारो निराभासो निराश्रयः । पुरुषः प्रणवातीतो
    मुकुन्दः परमेश्वरः ॥ ॥ क्षणावनिः सार्वभौमो वैकुण्ठो भक्तवत्सलः । विष्णुर्दामोदरः कृष्णो माधवो मथुरापतिः
    ॥ ॥ देवकीगर्भसम्भूतो यशोदावत्सलो हरिः । शिवः सङ्कर्षणः शम्भुर्भूतनाथो दिवस्पतिः ॥ ॥ अव्ययः सर्वधर्मज्ञो
    निर्मलो निरुपद्रवः । निर्वाणनायको नित्यो नीलजीमूतसन्निभः ॥ ॥ कलाक्षयश्च सर्वज्ञः कमलारूपतत्परः । हृषीकेशः
    पीतवासा वसुदेवप्रियात्मजः ॥ ॥ नन्दगोपकुमारार्यो नवनीताशनो विभुः । पुराणः पुरुषश्रेष्ठः शङ्खपाणिः सुविक्रमः
    ॥ ॥ अनिरुद्धश्चक्रधरः शार्ङ्गपाणिश्चतुर्भुजः । गदाधरः सुरार्तिघ्नो गोविन्दो नन्दकायुधः ॥ ॥ बृन्दावनचरः
    शौरिर्वेणुवाद्यविशारदः । तृणावर्तान्तको भीमसाहसो बहुविक्रमः ॥ ॥ शकटासुरसंहारी बकासुरविनाशनः । धेनुकासुरसंहारी
    पूतनारिर्नृकेसरी ॥ ॥ पितामहो गुरुस्साक्षी प्रत्यगात्मा सदाशिवः । अप्रमेयः प्रभुः प्राज्ञोऽप्रतर्क्यः
    स्वप्नवर्धनः ॥ ॥ धन्यो मान्यो भवो भावो धीरः शान्तो जगद्गुरुः । अन्तर्यामीश्वरो दिव्यो दैवज्ञो देवसंस्तुतः
    ॥ ॥ क्षीराब्धिशयनो धाता लक्ष्मीवान् लक्ष्मणाग्रजः । धात्रीपतिरमेयात्मा चन्द्रशेखरपूजितः ॥ ॥ लोकसाक्षी
    जगच्चक्षुः पुण्यचारित्रकीर्तनः । कोटिमन्मथसौन्दर्यो जगन्मोहनविग्रहः ॥ ॥ मन्दस्मिततनुर्गोपगोपिकापरिवेष्टितः
    । फुल्लारविन्दनयनश्चाणूरान्ध्रनिषूदनः ॥ ॥ इन्दीवरदलश्यामो बर्हिबर्हावतंसकः । मुरलीनिनदाह्लादो दिव्यमालाम्बरावृतः
    ॥ ॥ सुकपोलयुगः सुभ्रूयुगलः सुललाटकम् । कम्बुग्रीवो विशालाक्षो लक्ष्मीवाञ्छुभलक्षणः ॥ ॥ पीनवक्षाश्चतुर्बाहुश्चतुर्मूर्तिस्त्रिविक्रमः
    । कलङ्करहितः शुद्धो दुष्टशत्रुनिबर्हणः ॥ ॥ किरीटकुण्डलधरः कटकाङ्गदमण्डितः । मुद्रिकाभरणोपेतः कटिसूत्रविराजितः
    ॥ ॥ मञ्जीररञ्जितपदः सर्वाभरणभूषितः । विन्यस्तपादयुगलो दिव्यमङ्गलविग्रहः ॥ ॥ गोपिकानयनानन्दः पूर्णचन्द्रनिभाननः
    । समस्तजगदानन्दः सुन्दरो लोकनन्दनः ॥ ॥ यमुनातीरसञ्चारी राधामन्मथवैभवः । गोपनारीप्रियो दान्तो गोपीवस्त्रापहारकः
    ॥ ॥ शृङ्गारमूर्तिः श्रीधामा तारको मूलकारणम् । सृष्टिसंरक्षणोपायः क्रूरासुरविभञ्जनः ॥ ॥ नरकासुरसंहारी
    मुरारिर्वैरिमर्दनः । आदितेयप्रियो दैत्यभीकरो यदुशेखरः ॥ ॥ जरासन्धकुलध्वंसी कंसारातिः सुविक्रमः । पुण्यश्लोकः
    कीर्तनीयो यादवेन्द्रो जगन्नुतः ॥ ॥ रुक्मिणीरमणः सत्यभामाजाम्बवतीप्रियः । मित्रविन्दानाग्नजितीलक्ष्मणासमुपासितः
    ॥ ॥ सुधाकरकुले जातोऽनन्तः प्रबलविक्रमः । सर्वसौभाग्यसम्पन्नो द्वारकापट्टणस्थितः ॥ ॥ भद्रासूर्यसुतानाथो
    लीलामानुषविग्रहः । सहस्रषोडशस्त्रीशो भोगमोक्षैकदायकः ॥ ॥ वेदान्तवेद्यः संवेद्यो वैद्यो ब्रह्माण्डनायकः
    । गोवर्धनधरो नाथः सर्वजीवदयापरः ॥ ॥ मूर्तिमान् सर्वभूतात्मा आर्तत्राणपरायणः । सर्वज्ञः सर्वसुलभः सर्वशास्त्रविशारदः
    ॥ ॥ षड्गुणैश्वर्यसम्पन्नः पूर्णकामो धुरन्धरः । महानुभावः कैवल्यदायको लोकनायकः ॥ ॥ आदिमध्यान्तरहितः
    शुद्धसात्त्विकविग्रहः । असमानः समस्तात्मा शरणागतवत्सलः ॥ ॥ उत्पत्तिस्थितिसंहारकारणं सर्वकारणम् । गम्भीरः
    सर्वभावज्ञः सच्चिदानन्दविग्रहः ॥ ॥ विष्वक्सेनः सत्यसन्धः सत्यवाक् सत्यविक्रमः । सत्यव्रतः सत्यरतः
    सत्यधर्मपरायणः ॥ ॥ आपन्नार्तिप्रशमनः द्रौपदीमानरक्षकः । कन्दर्पजनकः प्राज्ञो जगन्नाटकवैभवः ॥ ॥ भक्तिवश्यो
    गुणातीतः सर्वैश्वर्यप्रदायकः । दमघोषसुतद्वेषी बाणबाहुविखण्डनः ॥ ॥ भीष्मभक्तिप्रदो दिव्यः कौरवान्वयनाशनः
    । कौन्तेयप्रियबन्धुश्च पार्थस्यन्दनसारथिः ॥ ॥ नारसिंहो महावीरः स्तम्भजातो महाबलः । प्रह्लादवरदः सत्यो
    देवपूज्योऽभयङ्करः ॥ ॥ उपेन्द्र इन्द्रावरजो वामनो बलिबन्धनः । गजेन्द्रवरदः स्वामी सर्वदेवनमस्कृतः ॥
    ॥ शेषपर्यङ्कशयनो वैनतेयरथो जयी । अव्याहतबलैश्वर्यसम्पन्नः पूर्णमानसः ॥ ॥ योगीश्वरेश्वरः साक्षी क्षेत्रज्ञो
    ज्ञानदायकः । योगिहृत्पङ्कजावासो योगमायासमन्वितः ॥ ॥ नादबिन्दुकलातीतश्चतुर्वर्गफलप्रदः । सुषुम्नामार्गसञ्चारी
    देहस्यान्तरसंस्थितः ॥ ॥ देहेन्द्रियमनःप्राणसाक्षी चेतःप्रसादकः । सूक्ष्मः सर्वगतो देही ज्ञानदर्पणगोचरः
    ॥ ॥ तत्त्वत्रयात्मकोऽव्यक्तः कुण्डली समुपाश्रितः । ब्रह्मण्यः सर्वधर्मज्ञः शान्तो दान्तो गतक्लमः ॥
    ॥ श्रीनिवासः सदानन्दो विश्वमूर्तिर्महाप्रभुः । सहस्रशीर्षा पुरुषः सहस्राक्षः सहस्रपात् ॥ ॥ समस्तभुवनाधारः
    समस्तप्राणरक्षकः । समस्तस्सर्वभावज्ञो गोपिकाप्राणवल्लभः ॥ ॥ नित्योत्सवो नित्यसौख्यो नित्यश्रीर्नित्यमङ्गलम्
    । व्यूहार्चितो जगन्नाथः श्रीवैकुण्ठपुराधिपः ॥ ॥ पूर्णानन्दघनीभूतो गोपवेषधरो हरिः । कलापकुसुमश्यामः
    कोमलः शान्तविग्रहः ॥ ॥ गोपाङ्गनावृतोऽनन्तो बृन्दावनसमाश्रयः । वेणुनादरतः श्रेष्ठो देवानां हितकारकः
    ॥ ॥ जलक्रीडासमासक्तो नवनीतस्य तस्करः । गोपालकामिनीजारश्चोरजारशिखामणिः ॥ ॥ परञ्ज्योतिः पराकाशः परावासः
    परिस्फुटः । अष्टादशाक्षरो मन्त्रो व्यापको लोकपावनः ॥ ॥ सप्तकोटिमहामन्त्रशेखरो देवशेखरः । विज्ञानज्ञानसन्धानस्तेजोराशिर्जगत्पतिः
    ॥ ॥ भक्तलोकप्रसन्नात्मा भक्तमन्दारविग्रहः । भक्तदारिद्र्यशमनो भक्तानां प्रीतिदायकः ॥ ॥ भक्ताधीनमनाः
    पूज्यो भक्तलोकशिवङ्करः । भक्ताभीष्टप्रदः सर्वभक्ताघौघनिकृन्तकः ॥ ॥ अपारकरुणासिन्धुर्भगवान् भक्ततत्परः
    ॥ इति श्रीराधिकानाथ नाम्नां साहस्रमीरितम् । स्मरणात्पापराशीनां खण्डनं मृत्युनाशनम् ॥ ॥ वैष्णवानां
    प्रियकरं महादारिद्र्यनाशनम् । ब्रह्महत्यासुरापानं परस्त्रीगमनं तथा ॥ ॥ परद्रव्यापहरणं परद्वेषसमन्वितम्
    । मानसं वाचिकं कायं यत्पापं पापसम्भवम् ॥ ॥ सहस्रनामपठनात्सर्वे नश्यन्ति तत्क्षणात् । महादारिद्र्ययुक्तो
    वै वैष्णवो विष्णुभक्तिमान् ॥ ॥ कार्तिक्यां यः पठेद्रात्रौ शतमष्टोत्तरं क्रमात् । पीताम्बरधरो धीमान्
    सुगन्धी पुष्पचन्दनैः ॥ ॥ पुस्तकं पूजयित्वा च नैवेद्यादिभिरेव च । राधाध्यानाङ्कितो धीरो वनमालाविभूषितः
    ॥ ॥ शतमष्टोत्तरं देवि पठेन्नामसहस्रकम् । चैत्रे कृष्णे च शुक्ले च कुहूसङ्क्रान्तिवासरे ॥ ॥ पठितव्यं
    प्रयत्नेन त्रैलोक्यं मोहयेत् क्षणात् । तुलसीमालया युक्तो वैष्णवो भक्तितत्परः ॥ ॥ रविवारे च शुक्रे
    च द्वादश्यां श्राद्धवासरे । ब्राह्मणं पूजयित्वा च भोजयित्वा विधानतः ॥ ॥ पठेन्नामसहस्रं च ततः सिद्धिः
    प्रजायते । महानिशायां सततं वैष्णवो यः पठेत्सदा ॥ ॥ देशान्तरगता लक्ष्मीः समायाति न संशयः । त्रैलोक्ये
    तु महादेवि सुन्दर्यः काममोहिताः ॥ ॥ मुग्धाः स्वयं समायान्ति वैष्णवं च भजन्ति ताः । रोगी रोगात्प्रमुच्येत
    बद्धो मुच्येत बन्धनात् ॥ ॥ गर्भिणी जनयेत्पुत्रं कन्या विन्दति सत्पतिम् । राजानो वशतां यान्ति किं पुनः
    क्षुद्रमानुषाः ॥ ॥ सहस्रनामश्रवणात् पठनात् पूजनात् प्रिये । धारणात् सर्वमाप्नोति वैष्णवो नात्र संशयः
    ॥ ॥ वंशीवटे चान्यवटे तथा पिप्पलकेऽथ वा । कदम्बपादपतले श्रीगोपालस्य सन्निधौ ॥ ॥ यः पठेद्वैष्णवो नित्यं
    स याति हरिमन्दिरम् । कृष्णेनोक्तं राधिकायै तया प्रोक्तं पुरा शिवे ॥ ॥ नारदाय मया प्रोक्तं नारदेन प्रकाशितम्
    । मया तव वरारोहे प्रोक्तमेतत्सुदुर्लभम् ॥ ॥ गोपनीयं प्रयत्नेन न प्रकाश्यं कदाचन । शठाय पापिने चैव
    लम्पटाय विशेषतः ॥ ॥ न दातव्यं न दातव्यं न दातव्यं कदाचन । देयं शान्ताय शिष्याय विष्णुभक्तिरताय च ॥
    ॥ गोदानब्रह्मयज्ञादेर्वाजपेयशतस्य च । अश्वमेधसहस्रस्य फलं पाठे भवेद्ध्रुवम् ॥ ॥ मोहनं स्तम्भनं चैव
    मारणोच्चाटनादिकम् । यद्यद्वाञ्छति चित्तेन तत्तत्प्राप्नोति वैष्णवः ॥ ॥ एकादश्यां नरः स्नात्वा सुगन्धद्रव्यतैलकैः
    । आहारं ब्राह्मणे दत्त्वा दक्षिणां स्वर्णभूषणम् ॥ ॥ ततः प्रारम्भकर्तासौ सर्वं प्राप्नोति मानवः । शतावृत्त
    सहस्रं च यः पठेद्वैष्णवो जनः ॥ ॥ श्रीबृन्दावनचन्द्रस्य प्रसादात्सर्वमाप्नुयात् । यद्गृहे पुस्तकं देवि
    पूजितं चैव तिष्ठति ॥ ॥ न मारी न च दुर्भिक्षं नोपसर्गभयं क्वचित् । सर्पादिभूतयक्षाद्या नश्यन्ते नात्र
    संशयः ॥ ॥ श्रीगोपालो महादेवि वसेत्तस्य गृहे सदा । यद्गृहे च सहस्रं च नाम्नां तिष्ठति पूजितम् ॥ ॥ इति
    श्रीसम्मोहनतन्त्रे हरगौरीसंवादे श्रीगोपाल सहस्रनामस्तोत्रम् ।
