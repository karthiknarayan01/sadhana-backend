id: vasudeva-stotram-mahabharatam
category: stotram
name:
  english: Vasudeva Stotram (Mahabharatam)
content:
  english: shrimahabharate bhishmaparvani pancashashtitamo'dhyaye shlo vishvavasurvishvamurtirvishvesho
    vishvakseno vishvakarma vashi ca | vishveshvaro vasudevo'si tasma dyogatmanam daivatam tvamupaimi
    || || jaya vishva mahadeva jaya lokahiterata | jaya yogishvara vibho jaya yogaparavara || || padmagarbha
    vishalaksha jaya lokeshvareshvara | bhutabhavyabhavannatha jaya saumyatmajatmaja || || asankhyeyagunadhara
    jaya sarvaparayana | narayana sudushpara jaya sharngadhanurdhara || || jaya sarvagunopeta vishvamurte
    niramaya | vishveshvara mahabaho jaya lokarthatatpara || || mahoragavarahadya harikesha vibho jaya
    | harivasa dishamisha vishvavasamitavyaya || || vyaktavyaktamitasthana niyatendriya satkriya | asankhyeyatmabhavajna
    jaya gambhirakamada || || anantavidita brahman nityabhutavibhavana | kritakarya kritaprajna dharmajna
    vijayavaha || || guhyatman sarvayogatman sphuta sambhuta sambhava | bhutadya lokatattvesha jaya bhutavibhavana
    || || atmayone mahabhaga kalpasankshepatatpara | udbhavanamanobhava jaya brahmajanapriya || || nisargasarganirata
    kamesha parameshvara | amritodbhava sadbhava muktatman vijayaprada || || prajapatipate deva padmanabha
    mahabala | atmabhuta mahabhuta satvatman jaya sarvada || || padau tava dhara devi disho bahu divam
    shirah | murtiste'ham surah kayashcandradityau ca cakshushi || || balam tapashca satyam ca karma dharmatmajam
    tava | tejo'gnih pavanah shvasa apaste svedasambhavah || || ashvinau shravanau nityam devi jihva sarasvati
    | vedah samskaranishtha hi tvayidam jagadashritam || || na sankhya na parimanam na tejo na parakramam
    | na balam yogayogisha janimaste na sambhavam || || tvadbhaktinirata deva niyamaistvam samashritah
    | arcayamah sada vishno paramesham maheshvaram || || rishayo devagandharva yaksharakshasapannagah
    | pishaca manushashcaiva mrigapakshisarisripah || || evamadi maya srishtam prithivyam tvatprasadajam
    | padmanabha vishalaksha krishna duhkhapranashana || || tvam gatih sarvabhutanam tvam neta tvam jagadguruh
    | tvatprasadena devesha sukhino vibudhah sada || || prithivi nirbhaya deva tvatprasadatsada'bhavat
    | tasmadbhava vishalaksha yaduvamshavivardhanah || || dharmasamsthapanarthaya daityanam ca vadhaya
    ca | jagato dharanarthaya vijnapyam kuru me prabho || || yattatparamakam guhyam tvatprasadadidam vibho
    | vasudeva tadetatte mayodgitam yathatatham || || srishtva sankarshanam devam svayamatmanamatmana
    | krishna tvamatmano sakshi pradyumnam catmasambhavam || || pradyumnadaniruddham tvam yam vidurvishnumavyayam
    | aniruddho'srijanmam vai brahmanam lokadharinam || || vasudevamayah so'ham tvayaivasmi vinirmitah
    | tasmadyacami lokesha caturatmanamatmana| vibhajya bhagasho''tmanam vraja manushatam vibho || ||
    tatrasuravadham kritva sarvalokasukhaya vai | dharmam prapya yashah prapya yogam prapsyasi tattvatah
    || || tvam hi brahmarshayo loke devashcamitavikrama | taistairhi namabhiryukta gayanti paramatmakam
    || || sthitashca sarve tvayi bhutasanghah kritvashrayam tvam varadam subaho | anadimadhyantamaparayogam
    lokasya setum pravadanti viprah || || iti shrimahabharate bhishmaparvani pancashashtitamo'dhyaye vasudeva
    stotram |
  devanagari: श्रीमहाभारते भीष्मपर्वणि पञ्चषष्टितमोऽध्याये श्लो विश्वावसुर्विश्वमूर्तिर्विश्वेशो विष्वक्सेनो
    विश्वकर्मा वशी च । विश्वेश्वरो वासुदेवोऽसि तस्मा द्योगात्मानं दैवतं त्वामुपैमि ॥ ॥ जय विश्व महादेव
    जय लोकहितेरत । जय योगीश्वर विभो जय योगपरावर ॥ ॥ पद्मगर्भ विशालाक्ष जय लोकेश्वरेश्वर । भूतभव्यभवन्नाथ
    जय सौम्यात्मजात्मज ॥ ॥ असङ्ख्येयगुणाधार जय सर्वपरायण । नारायण सुदुष्पार जय शार्ङ्गधनुर्धर ॥ ॥ जय सर्वगुणोपेत
    विश्वमूर्ते निरामय । विश्वेश्वर महाबाहो जय लोकार्थतत्पर ॥ ॥ महोरगवराहाद्य हरिकेश विभो जय । हरिवास
    दिशामीश विश्वावासामिताव्यय ॥ ॥ व्यक्ताव्यक्तामितस्थान नियतेन्द्रिय सत्क्रिय । असङ्ख्येयात्मभावज्ञ
    जय गम्भीरकामद ॥ ॥ अनन्तविदित ब्रह्मन् नित्यभूतविभावन । कृतकार्य कृतप्रज्ञ धर्मज्ञ विजयावह ॥ ॥ गुह्यात्मन्
    सर्वयोगात्मन् स्फुट सम्भूत सम्भव । भूताद्य लोकतत्त्वेश जय भूतविभावन ॥ ॥ आत्मयोने महाभाग कल्पसङ्क्षेपतत्पर
    । उद्भावनमनोभाव जय ब्रह्मजनप्रिय ॥ ॥ निसर्गसर्गनिरत कामेश परमेश्वर । अमृतोद्भव सद्भाव मुक्तात्मन्
    विजयप्रद ॥ ॥ प्रजापतिपते देव पद्मनाभ महाबल । आत्मभूत महाभूत सत्वात्मन् जय सर्वदा ॥ ॥ पादौ तव धरा देवी
    दिशो बाहु दिवं शिरः । मूर्तिस्तेऽहं सुराः कायश्चन्द्रादित्यौ च चक्षुषी ॥ ॥ बलं तपश्च सत्यं च कर्म
    धर्मात्मजं तव । तेजोऽग्निः पवनः श्वास आपस्ते स्वेदसम्भवाः ॥ ॥ अश्विनौ श्रवणौ नित्यं देवी जिह्वा सरस्वती
    । वेदाः संस्कारनिष्ठा हि त्वयीदं जगदाश्रितम् ॥ ॥ न सङ्ख्या न परीमाणं न तेजो न पराक्रमम् । न बलं योगयोगीश
    जानीमस्ते न सम्भवम् ॥ ॥ त्वद्भक्तिनिरता देव नियमैस्त्वां समाश्रिताः । अर्चयामः सदा विष्णो परमेशं महेश्वरम्
    ॥ ॥ ऋषयो देवगन्धर्वा यक्षराक्षसपन्नगाः । पिशाचा मानुषाश्चैव मृगपक्षिसरीसृपाः ॥ ॥ एवमादि मया सृष्टं
    पृथिव्यां त्वत्प्रसादजम् । पद्मनाभ विशालाक्ष कृष्ण दुःखप्रणाशन ॥ ॥ त्वं गतिः सर्वभूतानां त्वं नेता
    त्वं जगद्गुरुः । त्वत्प्रसादेन देवेश सुखिनो विबुधाः सदा ॥ ॥ पृथिवी निर्भया देव त्वत्प्रसादात्सदाऽभवत्
    । तस्माद्भव विशालाक्ष यदुवंशविवर्धनः ॥ ॥ धर्मसंस्थापनार्थाय दैत्यानां च वधाय च । जगतो धारणार्थाय विज्ञाप्यं
    कुरु मे प्रभो ॥ ॥ यत्तत्परमकं गुह्यं त्वत्प्रसादादिदं विभो । वासुदेव तदेतत्ते मयोद्गीतं यथातथम् ॥
    ॥ सृष्ट्वा सङ्कर्षणं देवं स्वयमात्मानमात्मना । कृष्ण त्वमात्मनो साक्षी प्रद्युम्नं चात्मसम्भवम् ॥
    ॥ प्रद्युम्नादनिरुद्धं त्वं यं विदुर्विष्णुमव्ययम् । अनिरुद्धोऽसृजन्मां वै ब्रह्माणं लोकधारिणम् ॥
    ॥ वासुदेवमयः सोऽहं त्वयैवास्मि विनिर्मितः । तस्माद्याचामि लोकेश चतुरात्मानमात्मना। विभज्य भागशोऽऽत्मानं
    व्रज मानुषतां विभो ॥ ॥ तत्रासुरवधं कृत्वा सर्वलोकसुखाय वै । धर्मं प्राप्य यशः प्राप्य योगं प्राप्स्यसि
    तत्त्वतः ॥ ॥ त्वां हि ब्रह्मर्षयो लोके देवाश्चामितविक्रम । तैस्तैर्हि नामभिर्युक्ता गायन्ति परमात्मकम्
    ॥ ॥ स्थिताश्च सर्वे त्वयि भूतसङ्घाः कृत्वाश्रयं त्वां वरदं सुबाहो । अनादिमध्यान्तमपारयोगं लोकस्य सेतुं
    प्रवदन्ति विप्राः ॥ ॥ इति श्रीमहाभारते भीष्मपर्वणि पञ्चषष्टितमोऽध्याये वासुदेव स्तोत्रम् ।
