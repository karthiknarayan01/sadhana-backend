id: laghu-vayu-stuti
category: stotram
name:
  english: laghu vayu stuti
  devanagari: लघु वायु स्तुति
content:
  english: laghu vayustuti || laghuvayustutih || vasudevam sadanamdatirthanamdasamdohasamdanashilam |
    svaminam saccidanamdarupam namdayamovayam namdasunum || 1|| shrihanumamtamekamtabhajam raghavashripadambhojabhringam
    | marutim praninam pranabhutam namdayamovayam namditirtham || 2|| bhimarupam paro peyivamsam bharatam
    bharatashrilalamam | bhubharadhvamsinam bharatisham namdayamovayam namditirtham || 3|| devacudamanim
    purnabodham krishnapadaravimdaikadasam | cittacimtamanim punyabhajam namdayamovayam namditirtham ||
    4|| mayigomayumayamdhakara dhvamsamartanda murtiyamanam | sajjananamdasamdohadhenum namdayamovayam
    namditirtham || 5|| imdiranamdamanamdamurtim sumdarimamdiramimdukamtim | dasamekam tatha tattvarupam
    namdayamovayam namditirtham || 6|| iti shrikalyanidevi viracitam laghuvayustutih sampurnam || bharatiramanamukhyapranamtargata
    shrikrishnarpanamastu ||
  devanagari: लघु वायुस्तुती ॥ लघुवायुस्तुतिः ॥ वासुदेवं सदानंदतीर्थानंदसंदोहसंदानशीलम् । स्वामिनं सच्चिदानंदरूपं
    नंदयामोवयं नंदसूनुम् ॥ १॥ श्रीहनूमंतमेकांतभाजं राघवश्रीपदांभोजभृङ्गम् । मारुतिं प्राणिनां प्राणभूतं
    नंदयामोवयं नंदितीर्थम् ॥ २॥ भीमरूपं परो पेयिवांसं भारतं भारतश्रीललामम् । भूभरध्वंसिनां भारतीशं नंदयामोवयं
    नंदितीर्थम् ॥ ३॥ देवचूडामणिं पूर्णबोधं कृष्णपादारविंदैकदासम् । चित्तचिंतामणिं पुण्यभाजां नंदयामोवयं
    नंदितीर्थम् ॥ ४॥ मायिगोमायुमायांधकार ध्वंसमार्ताण्ड मूर्तीयमानम् । सज्जनानंदसंदोहधेनुं नंदयामोवयं
    नंदितीर्थम् ॥ ५॥ इंदिरानंदमानंदमूर्तिं सुंदरीमंदिरामिंदुकांतिम् । दासमेकं तथा तत्त्वरूपं नंदयामोवयं
    नंदितीर्थम् ॥ ६॥ इति श्रीकल्याणीदेवी विरचितं लघुवायुस्तुतिः सम्पूर्णम् ॥ भारतीरमणमुख्यप्राणांतर्गत
    श्रीकृष्णार्पणमस्तु ॥
