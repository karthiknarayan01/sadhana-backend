id: kubjikasahasranamastotram
category: sahasranama
name:
  english: kubjikasahasranamastotram
  devanagari: कुब्जिकासहस्रनामस्तोत्रम्
content:
  english: tam drishtva mahadashraryya jyotirupam bhagatmika | aradhayenmambhadrani sahasranama stotrakaih
    || kubjika kubjini kubja yonimadhyapracarini | lambodari dirghajihva kubjini kubjamalini || 1|| kubjabhava
    kubjananda kubjeshi kubjanayika | kubjasmika kubjavasa kubja kubji nivasini || 2|| kubjavaha kubjaradhya
    kubjadya kubjavahini | kubjini kujani kubja kujesha kubjigehini || 3|| kubja kujabhogarata kubjayonih
    kujalaya | kubjamala kujarama kujamoda kujarasa || 4|| kubjamata kujakura kujaguha kujeshvari | kubjagiha
    kujageha kubjayonih kujarasa || 5|| shriphala shivada shishya shrimayi shivarupini | yayokurupini
    kubja kutila kutilanana || 6|| ugratmika padmavatidhurjari cakradharini | aghora mantravarada bhavini
    bhavarupini || 7|| kankala kali kalindi kaumari kamavallabha | vagishvari yonimudra trikhanda siddhivaditta
    || 8|| guhyeshvari gunakara saguna gunarupini | vidyadhari lokadhatri shivamalasvarupini || 9|| narmada
    sarvada guhya sarpini tryaksharatmika | rakini ramani rama rajani rajanikari || 10|| kakini kamalavasa
    parvati pararupini | hakini bharini hasya rohini rogaharini || 11|| shrikari shrimati shreya shrayaniyakhileshvari
    | usha sakarshani dhruma dhumini nagini shiva || 12|| nirvanadayini shreshtha sharmishtha sharadashriya
    | mahalakshmirmahashaktirmahadevasvarupini || 13|| anathanatharninaya aghora ghorarupini | bhumadhyanilaya
    nishthanirguni gunavardhini || 14|| kameshi kamakarunya bindunadasvarupini | suprabha kumudi kanta
    kamada kamadurvara || 15|| unmadini mahaduti bhavani vahnivasini | arunatarunivaya suprasanna surarcita
    || 16|| vasini vasini vani paramartharupini | paramanandini sandra varuni varunapriya || 17|| manojna
    surasaramya nitya nityasanatani | caitanyarupini nitya ambika lalita shiva || 18|| surabhuta mahabhuta
    varenya varadarshabha | jvala sujvalini maya muladharanivasini || 19|| mantratmika mantramata mantragamya
    sumantrini | suprakasha mahabhasa vidhi vishnugra vandita || 20|| vishnupatni vishnubharya bhasvati
    nadasvarupini | shrisara shrishada shri shri shri kashthaghanta mohini || 21|| adisatvodbhada satva
    shrikara shrikarashraya | yogalakshmi mahalakshmirgomukhi gomatidhruva || 22|| vajrini damshtrini
    bhadra bhogalakshmi kapalini | vyapini mandini tivrarayah purnasvarupini || 23|| suvarna varna sankirtih
    sakini matrisakini | tara sutara tarani tarini tararupini || 24|| mahodara mahirupa parvati pararupini
    | kakini kamalavasa mahima mahitta mahi || 25|| kuleshi kulamargastha shankari shava shankari | cinta
    vinayiki cinta madhyavadi gatipriya || 26|| bhavani bhavani bhama sarvam saubhagyavardhini | surananda
    surairvodhya bhasvati bhutabhavini || 27|| trikodastha trim trividha bhairavi kubjisundari | tripura
    shri trijanani trisvara tripurambika || 28|| kanti kantamati kanta matsyarupa mahoshkara | madhavi
    malini madhvi aviroma manohara || 29|| kala kalavati rakta vanmayi vadi savanda | sambhavi bajida
    vandya sushumna brahmacarini || 30|| madalkinna madonmanna madabinduklitodara | madatmika madasara
    manani manavardhini || 31|| rasatmika rasasara camunda mundamalini | bherunda candika candi rasamada
    rasavaha || 32|| nadarashava nilaya dakini dakinipriya | uddishakhadgakhadgagi narayanamanohara ||
    33|| maheshvari mahananda matangi madiratmika | manonmani mahamaya mahanansavidhayini || 34|| anandakanda
    vijaya bhuteshi bhuvaneshvari | annapurna maharupa vaidyeshi citsvarupini || 35|| vicitra citra khatvangi
    candrajyotsana sushitala | suramasajnini sita hetugarbha kuleshvari || 36|| hrinkari kundalidhatri
    siddhidhasiddhisammanta | siddharcita siddhi vidya dharitri bhutasambhava || 37|| sarvada sarvajanani
    sushumnam somabhushana | surabhi sumana surya sarvada sarva rajani || 38|| khecara khecarimudra nirdvandva
    nirgunatmika | nirananda nikshepaya khecari yogarupini || 39|| siddha siddheshvari siddhirmadavamsa
    madrashraya | modini madini madya siddhiryavasiddhinayika || 40|| kaulini kamala kamsi kamala kamasvarupini
    | kartinisyandini kashya kamala kamalavasini || 41|| mangalyadayini malyapurna mangalarupini | rudratmika
    rudramata vishvadya vishvabhushita || 42|| vidyotara vicitrarthi rudrajanma rajasvala | mokshamargavidhanajna
    shaktisthashilarupini || 43|| lalallila shilavati vicintyapatra bhumika | sha
  devanagari: तां दृष्ट्वा महदाश्रर्य्य ज्योतिरूपां भगात्मिका । आराधयेन्माम्भद्राणी सहस्रनाम स्तोत्रकैः
    ॥ कुब्जिका कुब्जिनी कुब्जा योनिमध्यप्रचारिणी । लम्बोदरी दीर्घजिह्वा कुब्जिनी कुब्जमालिनी ॥ १॥ कुब्जभाव
    कुब्जनन्दा कुब्जेशी कुब्जनायिका । कुब्जास्मिका कुब्जवासा कुब्ज कुब्जि निवासिनी ॥ २॥ कुब्जवाहा कुब्जराध्या
    कुब्जाद्या कुब्जवाहिनी । कुब्जिनी कुजनी कुब्जा कुजेशा कुब्जिगेहिनी ॥ ३॥ कुब्जा कुजाभोगरता कुब्जयोनिः
    कुजालया । कुब्जमाला कुजारामा कुजामोदा कुजारसा ॥ ४॥ कुब्जमाता कुजाकुरा कुजागुहा कुजेश्वरी । कुब्जगिहा
    कुजागेहा कुब्जयोनिः कुजारसा ॥ ५॥ श्रीफला शिवदा शिष्या श्रीमयी शिवरूपिणी । ययोकुरूपिणी कुब्जा कुटिला
    कुटिलानना ॥ ६॥ उग्रात्मिका पद्मवतीधूर्जरी चक्रधारिणी । अघोरा मन्त्रवरदा भाविनी भावरूपिणी ॥ ७॥ कङ्काल
    काली कालिन्दी कौमारी कामवल्लभा । वागीश्वरी योनिमुद्रा त्रिखण्डा सिद्धिवदित्ता ॥ ८॥ गुह्येश्वरी गुणाकारा
    सगुणा गुणरूपिणी । विद्याधरी लोकधात्री शिवमालास्वरूपिणी ॥ ९॥ नर्मदा सर्वदा गुह्या सर्पिणी त्र्यक्षरात्मिका
    । राकिनी रमणी रामा रजनी रजनीकरी ॥ १०॥ काकिनी कमलावासा पार्वती पाररूपिणी । हाकिनी भारिणी हस्या रोहिणी
    रोगहारिणी ॥ ११॥ श्रीकरी श्रीमति श्रेया श्रयणीयाखिलेश्वरी । ऊषा सकर्षणी ध्रूमा धूमिनी नागिनी शिवा ॥
    १२॥ निर्वाणदायिनी श्रेष्ठा शर्मिष्ठा शारदाश्रिया । महालक्ष्मीर्महाशक्तिर्महादेवस्वरूपिणी ॥ १३॥ अनाथनाथर्निणाया
    अघोरा घोररूपिणी । भूमध्यनिलया निष्ठानिर्गुणी गुणवर्धिनी ॥ १४॥ कामेशी कामकारुण्या बिन्दुनादस्वरूपिणी
    । सुप्रभा कुमुदी कान्ता कामदा कामदुर्वरा ॥ १५॥ उन्मादिनी महादूती भावनी वह्निवासिनी । अरुणातरुणीवाया
    सुप्रसन्ना सुरार्चिता ॥ १६॥ वासिनी वसिनी वाणी परमार्थरूपिणी । परमानन्दिनी सान्द्रा वारुणी वारुणप्रिया
    ॥ १७॥ मनोज्ञा सुरसारम्या नित्या नित्यसनातनी । चैतन्यरूपिणी नित्या अम्बिका ललिता शिवा ॥ १८॥ सुरभूता
    महाभूता वारेण्या वरदर्षभा । ज्वाला सुज्वालिनी माया मूलाधारनिवासिनी ॥ १९॥ मन्त्रात्मिका मन्त्रमाता
    मन्त्रगम्या सुमन्त्रिणी । सुप्रकाशा महाभासा विधि विष्णुग्र वन्दिता ॥ २०॥ विष्णुपत्नी विष्णुभार्या
    भास्वती नादस्वरूपिणी । श्रीसारा श्रीषदा श्री श्री श्री काष्ठाघण्टा मोहिनी ॥ २१॥ आदिसत्वोद्भदा सत्वा
    श्रीकरा श्रीकराश्रया । योगलक्ष्मी महालक्ष्मीर्गोमुखी गोमतीध्रुवा ॥ २२॥ वज्रिणी दंष्ट्रिणी भद्रा भोगलक्ष्मी
    कपालिनी । व्यापिनी मन्दिनी तिव्रारयः पूर्णास्वरूपिणी ॥ २३॥ सुवर्णा वर्णा सङ्कीर्तीः साकिनी मातृसाकिनी
    । तारा सुतारा तरणी तारिणी ताररूपिणी ॥ २४॥ महोदरा महीरूपा पार्वती पाररूपिणी । काकिनी कमलावासा महिमा
    महित्ता मही ॥ २५॥ कुलेशी कुलमार्गस्था शङ्करी शव शङ्करी । चिन्ता विनायिकी चिन्ता मध्यवादि गतिप्रिया
    ॥ २६॥ भवानी भावनी भामा सर्वं सौभाग्यवर्धिनी । सुरानन्दा सुरैर्वोध्या भास्वती भूतभाविनी ॥ २७॥ त्रिकोदस्था
    त्रिं त्रिविधा भैरवी कुब्जिसुन्दरी । त्रिपुरा श्री त्रिजननी त्रिस्वरा त्रिपुराम्बिका ॥ २८॥ कान्ती
    कान्तामती कान्ता मत्स्यरूपा महोष्करा । माधवी मालिनी माध्वी अवीरोमा मनोहरा ॥ २९॥ कला कलावती रक्ता वाङ्मयी
    वादि सवन्दा । साम्भवी बजिदा वन्द्या सुषुम्णा ब्रह्माचारिणी ॥ ३०॥ मदल्किन्ना मदोन्मन्ना मदबिन्दुक्लितोदरा
    । मदात्मिका मदासारा माननी मानवर्धिनी ॥ ३१॥ रसात्मिका रसासारा चामुण्डा मुण्डमालिनी । भेरुण्डा चण्डिका
    चण्डी रसामदा रसावहा ॥ ३२॥ नादराशाव निलया डाकिनी डाकिनीप्रिया । उड्डीशाखड्गखड्गागी नारायणमनोहरा ॥ ३३॥
    महेश्वरी महानन्दा मातङ्गी मदिरात्मिका । मनोन्मनी महामाया महानन्साविधायिनी ॥ ३४॥ आनन्दकन्दा विजया भूतेशी
    भुवनेश्वरी । अन्नपूर्णा महारूपा वैद्येशी चित्स्वरूपिणी ॥ ३५॥ विचित्रा चित्रा खट्वाङ्गी चन्द्रज्योत्सना
    सुशीतला । सुरामासाज्ञिनी सीता हेतुगर्भा कुलेश्वरी ॥ ३६॥ ह्रीङ्कारी कुण्डलीधात्री सिद्धिधासिद्धिसम्मन्ता
    । सिद्धार्चिता सिद्धि विद्या धारित्री भूतसम्भवा ॥ ३७॥ सर्वदा सर्वजननी सुषुम्णां सोमभूषणा । सुरभी सुमना
    सूर्या सर्वदा सर्व रजनी ॥ ३८॥ खेचरा खेचरीमुद्रा निर्द्वन्द्वा निर्गुणात्मिका । निरानन्दा निक्षेपाय
    खेचरी योगरूपिणी ॥ ३९॥ सिद्धा सिद्धेश्वरी सिद्धिर्मदावांसा मद्राश्रया । मोदिनी मादिनी माद्या सिद्धिर्यवासिद्धिनायिका
    ॥ ४०॥ कौलिनी कमला कांसी कमला कामस्वरूपिणी । कार्तिनीस्यान्दिनी काश्या कमला कमलवासिनी ॥ ४१॥ माङ्गल्यदायिनी
    माल्यपूर्णा मङ्गलरूपिणी । रुद्रात्मिका रुद्रामाता विश्वाद्या विश्वभूषिता ॥ ४२॥ विद्योतरा विचित्रार्थी
    रुद्रजन्मा रजस्वला । मोक्षमार्गविधानज्ञा शक्तिस्थाशीलरूपिणी ॥ ४३॥ ललल्लीला शीलवती विचिन्त्यापत्र भूमिका
    । श
