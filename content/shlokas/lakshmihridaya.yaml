id: lakshmihridaya
category: hridaya
name:
  english: lakshmihridaya
  devanagari: लक्ष्मीह्रिदय
content:
  english: ghrah || tavannityam mamangeshu kshirabdhau shrikala vaset | suryacandramasau yavadyavallakshmipatih
    shriyau || 24|| sarvamangalasampurna sarvaishvaryasamanvita | adya''dishrirmahalakshmistvatkala mayi
    tishthatu || 25|| ajnanatimiram hantum shuddhajnanaprakashika | sarvaishvaryaprada me'stu tvatkala
    mayi samsthita || 26|| alakshmim haratu kshipram tamah suryaprabha yatha | vitanotu mama shreyastvatkala
    mayi samsthita || 27|| aishvaryamangalotpattih tvatkalayam nidhiyate | mayi tasmatkritartho'smi patramasmi
    sthitestava || 28|| bhavadaveshabhagyarho bhagyavanasmi bhargavi | tvatprasadatpavitro'ham lokamatarnamo'stu
    te || 29|| punasi mam tvatkalayaiva yasmat atassamagaccha mamagratastvam | param padam shrirbhava
    suprasanna mayyacyutena pravishadilakshmih || 30|| shrivaikunthasthite lakshmi samagaccha mamagratah
    | narayanena saha mam kripadrishtya'valokaya || 31|| satyalokasthite lakshmi tvam mamagaccha sannidhim
    | vasudevena sahita prasida varada bhava || 32|| shvetadvipasthite lakshmi shighramagaccha suvrate
    | vishnuna sahita devi jaganmatah prasida me || 33|| kshirambudhisthite lakshmi samagaccha samadhave
    | tvatkripadrishtisudhaya satatam mam vilokaya || 34|| ratnagarbhasthite lakshmi paripurnahiranmayi
    | samagaccha samagaccha sthitva''shu purato mama || 35|| sthira bhava mahalakshmi nishcala bhava nirmale
    | prasannakamale devi prasannahridaya bhava || 36|| shridhare shrimahalakshmi tvadantahstham mahanidhim
    | shighramuddhritya puratah pradarshaya samarpaya || 37|| vasundhare shrivasudhe vasudogdhri kripamayi
    | tvatkukshigatasarvasvam shighram me sampradarshaya || 38|| vishnupriye ratnagarbhe samastaphalade
    shive | tvadgarbhagatahemadin sampradarshaya darshaya || 39|| rasatalagate lakshmi shighramagaccha
    me purah | na jane paramam rupam matarme sampradarshaya || 40|| avirbhava manovegat shighramagaccha
    me purah | ma vatsa bhairihetyuktva kamam gauriva raksha mam || 41|| devi shighram samagaccha dharanigarbhasamsthite
    | matastvadbhrityabhrityo'ham mrigaye tvam kutuhalat || 42|| uttishtha jagrihi tvam me samuttishtha
    sujagrihi | akshayan hemakalashan suvarnena supuritan || 43|| nikshepanme samakrishya samuddhritya
    mamagratah | samunnatanana bhutva samyagdhehi dharatalat || 44|| matsannidhim samagaccha madahitakriparasat
    | prasida shreyasam dogdhri lakshmi me nayanagratah || 45|| atropavishya lakshmi tvam sthira bhava
    hiranmayi | susthira bhava sampritya prasanna varada bhava || 46|| anitamstu tvaya devi nidhinme sampradarshaya
    | adya kshanena sahasa dattva samraksha mam sada || 47|| mayi tishtha tatha nityam yathendradishu
    tishthasi | abhayam kuru me devi mahalakshmi namo'stu te || 48|| samagaccha mahalakshmi shuddhajambunada
  devanagari: घ्रः ॥ तावन्नित्यं ममाङ्गेषु क्षीराब्धौ श्रीकला वसेत् । सूर्याचन्द्रमसौ यावद्यावल्लक्ष्मीपतिः
    श्रियौ ॥ २४॥ सर्वमङ्गलसम्पूर्णा सर्वैश्वर्यसमन्विता । आद्याऽऽदिश्रीर्महालक्ष्मीस्त्वत्कला मयि तिष्ठतु
    ॥ २५॥ अज्ञानतिमिरं हन्तुं शुद्धज्ञानप्रकाशिका । सर्वैश्वर्यप्रदा मेऽस्तु त्वत्कला मयि संस्थिता ॥ २६॥
    अलक्ष्मीं हरतु क्षिप्रं तमः सूर्यप्रभा यथा । वितनोतु मम श्रेयस्त्वत्कला मयि संस्थिता ॥ २७॥ ऐश्वर्यमङ्गलोत्पत्तिः
    त्वत्कलायां निधीयते । मयि तस्मात्कृतार्थोऽस्मि पात्रमस्मि स्थितेस्तव ॥ २८॥ भवदावेशभाग्यार्हो भाग्यवानस्मि
    भार्गवि । त्वत्प्रसादात्पवित्रोऽहं लोकमातर्नमोऽस्तु ते ॥ २९॥ पुनासि मां त्वत्कलयैव यस्मात् अतस्समागच्छ
    ममाग्रतस्त्वम् । परं पदं श्रीर्भव सुप्रसन्ना मय्यच्युतेन प्रविशादिलक्ष्मीः ॥ ३०॥ श्रीवैकुण्ठस्थिते
    लक्ष्मि समागच्छ ममाग्रतः । नारायणेन सह मां कृपादृष्ट्याऽवलोकय ॥ ३१॥ सत्यलोकस्थिते लक्ष्मि त्वं ममागच्छ
    सन्निधिम् । वासुदेवेन सहिता प्रसीद वरदा भव ॥ ३२॥ श्वेतद्वीपस्थिते लक्ष्मि शीघ्रमागच्छ सुव्रते । विष्णुना
    सहिता देवि जगन्मातः प्रसीद मे ॥ ३३॥ क्षीराम्बुधिस्थिते लक्ष्मि समागच्छ समाधवे । त्वत्कृपादृष्टिसुधया
    सततं मां विलोकय ॥ ३४॥ रत्नगर्भस्थिते लक्ष्मि परिपूर्णहिरण्मयि । समागच्छ समागच्छ स्थित्वाऽऽशु पुरतो
    मम ॥ ३५॥ स्थिरा भव महालक्ष्मि निश्चला भव निर्मले । प्रसन्नकमले देवि प्रसन्नहृदया भव ॥ ३६॥ श्रीधरे
    श्रीमहालक्ष्मि त्वदन्तःस्थं महानिधिम् । शीघ्रमुद्धृत्य पुरतः प्रदर्शय समर्पय ॥ ३७॥ वसुन्धरे श्रीवसुधे
    वसुदोग्ध्रि कृपामयि । त्वत्कुक्षिगतसर्वस्वं शीघ्रं मे सम्प्रदर्शय ॥ ३८॥ विष्णुप्रिये रत्नगर्भे समस्तफलदे
    शिवे । त्वद्गर्भगतहेमादीन् सम्प्रदर्शय दर्शय ॥ ३९॥ रसातलगते लक्ष्मि शीघ्रमागच्छ मे पुरः । न जाने परमं
    रूपं मातर्मे सम्प्रदर्शय ॥ ४०॥ आविर्भव मनोवेगात् शीघ्रमागच्छ मे पुरः । मा वत्स भैरिहेत्युक्त्वा कामं
    गौरिव रक्ष माम् ॥ ४१॥ देवि शीघ्रं समागच्छ धरणीगर्भसंस्थिते । मातस्त्वद्भृत्यभृत्योऽहं मृगये त्वां
    कुतूहलात् ॥ ४२॥ उत्तिष्ठ जागृहि त्वं मे समुत्तिष्ठ सुजागृहि । अक्षयान् हेमकलशान् सुवर्णेन सुपूरितान्
    ॥ ४३॥ निक्षेपान्मे समाकृष्य समुद्धृत्य ममाग्रतः । समुन्नतानना भूत्वा सम्यग्धेहि धरातलात् ॥ ४४॥ मत्सन्निधिं
    समागच्छ मदाहितकृपारसात् । प्रसीद श्रेयसां दोग्ध्रि लक्ष्मि मे नयनाग्रतः ॥ ४५॥ अत्रोपविश्य लक्ष्मि
    त्वं स्थिरा भव हिरण्मयी । सुस्थिरा भव सम्प्रीत्या प्रसन्ना वरदा भव ॥ ४६॥ आनीतांस्तु त्वया देवि निधीन्मे
    सम्प्रदर्शय । अद्य क्षणेन सहसा दत्त्वा संरक्ष मां सदा ॥ ४७॥ मयि तिष्ठ तथा नित्यं यथेन्द्रादिषु तिष्ठसि
    । अभयं कुरु मे देवि महालक्ष्मि नमोऽस्तु ते ॥ ४८॥ समागच्छ महालक्ष्मि शुद्धजाम्बूनद
