    ma ga || pa ma ga ri | ga ma | pa ma ga ma | pa ma ga ri || ma ga ri sa | ri ga | ma ga ri ga | ma
    ga ri sa || caturasra jati matya talam kala sa ri ga ri | sa ri | sa ri ga ma || ri ga ma ga | ri
    ga | ri ga ma pa || ga ma pa ma | ga ma | ga ma pa da || ma pa da pa | ma pa | ma pa da ni || pa da
    ni da | pa da | pa da ni sa ni da pa || ni da pa da | ni da | ni da pa ma || da pa ma pa | da pa |
