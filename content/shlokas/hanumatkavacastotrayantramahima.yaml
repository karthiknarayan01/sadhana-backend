id: hanumatkavacastotrayantramahima
category: stotram
name:
  english: hanumatkavacastotrayantramahima
  devanagari: हनुमत्कवचस्तोत्रयन्त्रमहिमा
content:
  english: om namo ramadutaya | ashtaksharaya | hanumate namah | shadaksharo'yam | dishamaindrim bhavatu
    me anjanapriyanandanah | dishamavatu agneyyam lankaprasadabhanjanah || 1|| yamyam dishirakshatu me
    kesaripriyanandanah | nairritim dishapakshaghnah patu me plavagadhipah || 2|| patu shrivayuputro me
    varunim dishamavyayah | sugrivasacivo nityam patum me vayuvim disham || 3|| rudravataro'vatu me kauberi
    dishamakshaha | shriramaduto'vatu me ishanyam dishamavyayah || 4|| athastatpatume nityam valastro
    varado harih | urdhvam dishi rakshatu me shankaro'mitavikramah || 5|| antariksham disham patu nitijno
    me mahakapih | bahyabhyantardishau patu pingakshome'bdhilanghanah || 6|| sushirome shirah patu phalam
    me patu pavanih | drishau me patu sudrisho kanau patu sukarnavan || 7|| sughranah patu ghranam me
    mukham tu plavagananah | sujihvah patu jihvam me kantham patu sukantharah || 8|| suskandhah patu me
    skandho subhujo'vatu me bhujau | sukarome karau patu hridayam suhridomama || 9|| sumadhyah patu me
    madhyam nabhim tu sunabhivan | katim me sukatim patu uru sururuman mama || 10|| sujanuh januni patu
    janghe patu sujanghavan | supadah patu me padau sunakho me nakhani ca || 11|| anukta sandhinipatu
    sarvada ca susandhiman | sarvangani ca me patu sarvavayavashobhitah || 12|| sankate vishame durge
    bhaye pare mahahave | nishayam sandhyayoh patu hanuman sarvatassada || 13|| jalehyagnau sthite caiva
    vayuvyanca guhantare | nadyam shaile ca vipine davagnau cora sankate || 14|| rajadvare sabhasthane
    shatrudvare ca kritrime | patu shriramaduto'sau sada mam bhaktavatsalah || 15|| sarpavrishcikalutadi
    vishebhyah patu mam sada | sthavaram jangamam caiva kritrimamshca harishvarah || 16|| naravanarasimhebha
    tarukshu vyaghrabhallukat | hrimsrradvanacaradhyaksha draksho gandharvakinnarat || 17|| bhutapretaganashcaiva
    pishacabrahmarakshasat | vetaladanujatpatu sitashokavinashanah || 18|| duhsvapnatsalilatpatu dushkritadaduhkha
    sankulat | ajnanatkarmalopacca patu mam brahmapavanih || 19|| paradaratparadravyatparadana parigrahat
    | paracinta paradhyanam paravyadhi bhayacca mam || 20|| patu pracanda dordanda anjaneyo mahabalah
    | karmalopatkriyalopadbuddhijadyacca camcalat || 21|| ayudhatkandanadastratkaragaracca sha
  devanagari: ॐ नमो रामदुताय । अष्टाक्षराय । हनुमते नमः । षडक्षरोऽयम् । दिशमैन्द्रीं भवतु मे अञ्जनाप्रियनन्दनः
    । दिशमवतु आग्नेय्यां लङ्काप्रासादभञ्जनः ॥ १॥ याम्यां दिशिरक्षतु मे केसरीप्रियनन्दनः । नैरृतीं दिशपक्षघ्नः
    पातु मे प्लवगाधिपः ॥ २॥ पातु श्रीवायुपुत्रो मे वारुणीं दिशमव्ययः । सुग्रीवसचिवो नित्यं पातुम् मे वायुवीं
    दिशम् ॥ ३॥ रुद्रावतारोऽवतु मे कौबेरी दिशमक्षहा । श्रीरामदूतोऽवतु मे ईशान्यां दिशमव्ययः ॥ ४॥ अथस्तात्पातुमे
    नित्यं वालास्त्रो वरदो हरिः । ऊर्ध्वं दिशि रक्षतु मे शङ्करोऽमितविक्रमः ॥ ५॥ अन्तरिक्षं दिशं पातु नीतिज्ञो
    मे महाकपिः । बाह्याभ्यन्तर्दिशौ पातु पिङ्गाक्षोमेऽब्धिलङ्घनः ॥ ६॥ सुशिरोमे शिरः पातु फालं मे पातु
    पावनिः । दृशौ मे पातु सुदृशो कणौ पातु सुकर्णवान् ॥ ७॥ सुघ्राणः पातु घ्राणं मे मुखं तु प्लवगाननः ।
    सुजिह्वः पातु जिह्वां मे कण्ठं पातु सुकन्थरः ॥ ८॥ सुस्कन्धः पातु मे स्कन्धो सुभुजोऽवतु मे भुजौ । सुकरोमे
    करौ पातु हृदयं सुहृदोमम ॥ ९॥ सुमध्यः पातु मे मध्यं नाभिं तु सुनाभिवान् । कटिं मे सुकटिं पातु ऊरू सुरूरुमान्
    मम ॥ १०॥ सुजानुः जानुनी पातु जङ्घे पातु सुजङ्घवान् । सुपादः पातु मे पादौ सुनखो मे नखानि च ॥ ११॥ अनुक्त
    सन्धिनीपातु सर्वदा च सुसन्धिमान् । सर्वाङ्गानि च मे पातु सर्वावयवशोभितः ॥ १२॥ सङ्कटे विषमे दुर्गे
    भये पारे महाहवे । निशायां सन्ध्ययोः पातु हनुमान् सर्वतस्सदा ॥ १३॥ जलेह्यग्नौ स्थिते चैव वायुव्यञ्च
    गुहान्तरे । नद्यां शैले च विपिने दावाग्नौ चोर सङ्कटे ॥ १४॥ राजद्वारे सभास्थाने शत्रुद्वारे च कृत्रिमे
    । पातु श्रीरामदूतोऽसौ सदा मां भक्तवत्सलः ॥ १५॥ सर्पवृश्चिकलूतादि विषेभ्यः पातु मां सदा । स्थावरं जङ्गमं
    चैव कृत्रिमांश्च हरीश्वरः ॥ १६॥ नरवानरसिंहेभ तरुक्षु व्याघ्रभल्लुकात् । ह्रिंस्र्राद्वनचराध्यक्षा
    द्रक्षो गन्धर्वकिन्नरात् ॥ १७॥ भूतप्रेतगणाश्चैव पिशाचब्रह्मराक्षसात् । वेतालदनुजात्पातु सीताशोकविनाशनः
    ॥ १८॥ दुःस्वप्नात्सलिलात्पातु दुष्कृताददुःख सङ्कुलात् । अज्ञानात्कर्मलोपाच्च पातु मां ब्रह्मपावनिः
    ॥ १९॥ परदारात्परद्रव्यात्परदान परिग्रहात् । परचिन्ता परध्यानं परव्याधि भयाच्च माम् ॥ २०॥ पातु प्रचण्ड
    दोर्दण्ड आञ्जनेयो महाबलः । कर्मलोपात्क्रियालोपाद्बुद्धिजाड्याच्च चंचलात् ॥ २१॥ आयुधात्कन्दनादस्त्रात्कारागाराच्च
    श
