id: indradyumnakritam3vishnustotram
category: stotram
name:
  english: indradyumnakritam3vishnustotram
  devanagari: इन्द्रद्युम्नकृतं३विष्णुस्तोत्रम्
content:
  english: indradyumnakritam 3 vishnustotram indradyumna uvaca | jayakhilajagatsrishtisthitisamharashilpakrit
    | lilavishvavapurlomasankhyabrahmandabharabhrit || 48|| antaryaminnasheshanam pranatartihara prabho
    | brahmendra rudramukutakirmiritapadambuja || 49|| dinanathavipannaikasatatatranatatpara | nirvyajakarunavariparavara
    paratpara || 2
  devanagari: इन्द्रद्युम्नकृतं ३ विष्णुस्तोत्रम् इन्द्रद्युम्न उवाच । जयाखिलजगत्सृष्टिस्थितिसंहारशिल्पकृत्
    । लीलाविश्ववपुर्लोमासङ्ख्यब्रह्माण्डभारभृत् ॥ ४८॥ अन्तर्यामिन्नशेषाणां प्रणतार्तिहर प्रभो । ब्रह्मेन्द्र
    रुद्रमुकुटकिर्मीरितपदाम्बुज ॥ ४९॥ दीनानाथविपन्नैकसततत्राणतत्पर । निर्व्याजकरुणावारिपारावार परात्पर
    ॥ २
meaning: {}
