id: brahmanakritam6vishnustotram
category: stotram
name:
  english: brahmanakritam6vishnustotram
  devanagari: ब्रह्मणाकृतं६विष्णुस्तोत्रम्
content:
  english: rinoshyakarnah paripashyasi tvamacakshurupo bahuruparupah | apadahasto javano grahita tvam
    vetsi sarvam na ca sarvavedyah || 41|| anoraniyamsamasatsvarupam tvam pashyato jnananivrittiragrya
    | dhirasya dhirasya bibhartti nanyadvarenyarupatparatah paratman || 42|| tvam vishvanabhirbhuvanasya
    gopta sarvani bhutani tavantarani | yadbhutabhavyam yadanoraniyah pumamstvamekah prakriteh parastat
    || 43|| ekashcaturddha bhagavanhutasho varcovibhutim jagato dadasi | tvam vishvatashcakshuranantamurtte
    tredha padam tvam nidadhasi dhatah || 44|| yathagnireko bahudha samidhyate vikarabhedairavikararupah
    | tatha bhavansarvagataikarupi rupanyashshanyanupushyatisha || 45|| ekam tavagryam paramam padam yatpashyanti
    tvam surayo jnanadrishyam | tvatto nanyatkincidasti svarupam yadva bhutam yacca bhavyam paratman ||
    46|| vyaktavyaktasvarupastvam samashtivyashtirupavan | sarvajnassarvavitsarvashaktijnanabalarddhiman
    || 47|| anyunashcapyavriddhishca svadhino nadimanvashi | klamatandribhayakrodhakamadibhirasamyutah
    || 48|| niravadyah parah prapterniradhishtho'ksharah kramah | sarveshvarah paradharo dhamnam dhamatmako'kshayah
    || 49|| sakalavarananitaniralambanabhavana | mahavibhutisamsthana namaste purushottama || 50|| nakaranatkaranadva
    karanakarananna ca | shariragrahanam vapi dharmatranaya kevalam || 51|| iti vishnupurane pancamabhage
    prathamadhyayantargatam brahmana kritam vishnustotram samaptam | vishnupurana | adhyaya 5
  devanagari: ृणोष्यकर्णः परिपश्यसि त्वमचक्षुरूपो बहुरूपरूपः । अपादहस्तो जवनो ग्रहीता त्वं वेत्सि सर्वं
    न च सर्ववेद्यः ॥ ४१॥ अणोरणीयांसमसत्स्वरूपं त्वां पश्यतो ज्ञाननिवृत्तिरग्र्या । धीरस्य धीरस्य बिभर्त्ति
    नान्यद्वरेण्यरूपात्परतः परात्मन् ॥ ४२॥ त्वं विश्वनाभिर्भुवनस्य गोप्ता सर्वाणि भूतानि तवान्तराणि ।
    यद्भूतभव्यं यदणोरणीयः पुमांस्त्वमेकः प्रकृतेः परस्तात् ॥ ४३॥ एकश्चतुर्द्धा भगवान्हुताशो वर्चोविभूतिं
    जगतो ददासि । त्वं विश्वतश्चक्षुरनन्तमूर्त्ते त्रेधा पदं त्वं निदधासि धातः ॥ ४४॥ यथाग्निरेको बहुधा
    समिध्यते विकारभेदैरविकाररूपः । तथा भवान्सर्वगतैकरूपी रूपाण्यश्षाण्यनुपुष्यतीश ॥ ४५॥ एकं तवाग्र्यं
    परमं पदं यत्पश्यन्ति त्वां सूरयो ज्ञानदृश्यम् । त्वत्तो नान्यत्किञ्चिदस्ति स्वरूपं यद्वा भूतं यच्च
    भव्यं परात्मन् ॥ ४६॥ व्यक्ताव्यक्तस्वरूपस्त्वं समष्टिव्यष्टिरूपवान् । सर्वज्ञस्सर्ववित्सर्वशक्तिज्ञानबलर्द्धिमान्
    ॥ ४७॥ अन्यूनश्चाप्यवृद्धिश्च स्वाधीनो नादिमान्वशी । क्लमतन्द्रीभयक्रोधकामादिभिरसंयुतः ॥ ४८॥ निरवद्यः
    परः प्राप्तेर्निरधिष्ठोऽक्षरः क्रमः । सर्वेश्वरः पराधारो धाम्नां धामात्मकोऽक्षयः ॥ ४९॥ सकलावरणानीतनिरालम्बनभावन
    । महाविभूतिसंस्थान नमस्ते पुरुषोत्तम ॥ ५०॥ नाकारणात्कारणाद्वा कारणाकारणान्न च । शरीरग्रहणं वापि धर्मत्राणाय
    केवलम् ॥ ५१॥ इति विष्णुपुराणे पञ्चमभागे प्रथमाध्यायान्तर्गतं ब्रह्मणा कृतं विष्णुस्तोत्रं समाप्तम्
    । विष्णुपुराण । अध्याय ५
