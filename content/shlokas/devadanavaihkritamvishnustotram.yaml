id: devadanavaihkritamvishnustotram
category: stotram
name:
  english: devadanavaihkritamvishnustotram
  devanagari: देवदानवैःकृतंविष्णुस्तोत्रम्
content:
  english: devadanavaih kritam vishnustotram devadanava ucuh | namo lokatrayadhyaksha tejasa jitabhaskara
    | namo vishno namo jishno namaste kaitabhardana || 37|| namah sargakriyakartre jagatyalayate namah
    | rudrarupaya sharvaya namah samharakarine || 38|| namah shulayudhadhrishya namo danavaghatine | namah
    kramatrayakranta trailokyayabhavaya ca || 39|| namah pracandadaityendrakulakalamahanala | namo nabhihradodbhutapadmagarbha
    mahabala || 40|| padmabhuta mahabhuta kartre hartre jagatpriya | janita sarvalokesha kriyakaranakarine
    || 41|| amararivinashaya mahasamarashaline | lakshmimukhabjamadhupa namah kirtinivasine || 42|| asmakamamaratvaya
    dhriyatam dhriyatamayam | mandarah sarvashailanamayutayutavistritah || 43|| anantabalabahubhyamavashthabhyaikapanina
    | mathyatamamritam deva svadhasvaharthakaminam || 44|| iti matsyapurane ekonapancashadadhikadvishatatamadhyayantargatam
    devadanavaih kritam vishnustotram samaptam | matsyapurana | adhyaya 249
  devanagari: देवदानवैः कृतं विष्णुस्तोत्रम् देवदानवा ऊचुः । नमो लोकत्रयाध्यक्ष तेजसा जितभास्कर । नमो
    विष्णो नमो जिष्णो नमस्ते कैटभार्दन ॥ ३७॥ नमः सर्गक्रियाकर्त्रे जगत्यालयते नमः । रुद्ररूपाय शर्वाय
    नमः संहारकारिणे ॥ ३८॥ नमः शूलायुधाधृष्य नमो दानवघातिने । नमः क्रमत्रयाक्रान्त त्रैलोक्यायाभवाय च ॥
    ३९॥ नमः प्रचण्डदैत्येन्द्रकुलकालमहानल । नमो नाभिह्रदोद्भूतपद्मगर्भ महाबल ॥ ४०॥ पद्मभूत महाभूत कर्त्रे
    हर्त्रे जगत्प्रिय । जनिता सर्वलोकेश क्रियाकारणकारिणे ॥ ४१॥ अमरारिविनाशाय महासमरशालिने । लक्ष्मीमुखाब्जमधुप
    नमः कीर्तिनिवासिने ॥ ४२॥ अस्माकममरत्वाय ध्रियतां ध्रियतामयम् । मन्दरः सर्वशैलानामयुतायुतविस्तृतः ॥
    ४३॥ अनन्तबलबाहुभ्यामवष्ठभ्यैकपाणिना । मथ्यताममृतं देव स्वधास्वाहार्थकामिनाम् ॥ ४४॥ इति मत्स्यपुराणे
    एकोनपञ्चाशदधिकद्विशततमाध्यायान्तर्गतं देवदानवैः कृतं विष्णुस्तोत्रं समाप्तम् । मत्स्यपुराण । अध्याय
    २४९
