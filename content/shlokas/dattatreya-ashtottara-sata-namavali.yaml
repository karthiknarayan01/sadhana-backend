id: dattatreya-ashtottara-sata-namavali
category: stotram
name:
  english: Dattatreya Ashtottara Sata Namavali
  devanagari: दत्तात्रेयाष्टोत्तरशतनामावली ५ (श्रीदत्ताय देवदत्ताय ब्रह्मदत्ताय)
content:
  english: om shridattaya namah | om devadattaya namah | om brahmadattaya namah | om vishnudattaya namah
    | om shivadattaya namah | om atridattaya namah | om atreyaya namah | om atrivaradaya namah | om anusuyaya
    namah | om anasuyasunave namah | || 10|| om avadhutaya namah | om dharmaya namah | om dharmaparayanaya
    namah | om dharmapataye namah | om siddhaya namah | om siddhidaya namah | om siddhipataye namah |
    om siddhasevitaya namah | om gurave namah | om gurugamyaya namah | || 20|| om gurorgurutaraya namah
    | om garishthaya namah | om varishthaya namah | om mahishthaya namah | om mahatmane namah | om yogaya
    namah | om yogagamyaya namah | om yogideshakaraya namah | om yogarataye namah | om yogishaya namah
    | || 30|| om yogadhishaya namah | om yogaparayanaya namah | om yogidhyeyanghripankajaya namah | om
    digambaraya namah | om divyambaraya namah | om pitambaraya namah | om shvetambaraya namah | om citrambaraya
    namah | om balaya namah | om balaviryaya namah | || 40|| om kumaraya namah | om kishoraya namah |
    om kandarpamohanaya namah | om ardhangalingitanganaya namah | om suragaya namah | om viragaya namah
    | om vitaragaya namah | om amritavarshine namah | om ugraya namah | om anugrarupaya namah | || 50||
    om sthaviraya namah | om sthaviyase namah | om shantaya namah | om aghoraya namah | om gudhaya namah
    | om urdhvaretase namah | om ekavaktraya namah | om anekavaktraya namah | om dvinetraya namah | om
    trinetraya namah | || 60|| om dvibhujaya namah | om shadbhujaya namah | om akshamaline namah | om
    kamandaludharine namah | om shuline namah | om damarudharine namah | om shankhine namah | om gadine
    namah | om munaye namah | om mauline namah | || 70|| om virupaya namah | om svarupaya namah | om sahasrashirase
    namah | om sahasrakshaya namah | om sahasrabahave namah | om sahasrayudhaya namah | om sahasrapadaya
    namah | om sahasrapadmarcitaya namah | om padmahastaya namah | om padmapadaya namah | || 80|| om padmanabhaya
    namah | om padmamaline namah | om padmagarbharunakshaya namah | om padmakinjalkavarcase namah | om
    jnanine namah | om jnanagamyaya namah | om jnanavijnanamurtaye namah | om dhyanine namah | om dhyananishthaya
    namah | om dhyanastimitamurtaye namah | || 90|| om dhulidhusaritangaya namah | om candanaliptamurtaye
    namah | om bhasmoddhulitadehaya namah | om divyagandhanulepine namah | om prasannaya namah | om pramattaya
    namah | om prakrishtarthapradaya namah | var pradhanaya om ashtaishvaryapradaya namah | om varadaya
    namah | om variyase namah | || 100|| om brahmane namah | om brahmarupaya namah | om vishnave namah
    | om vishvarupine namah | om shankaraya namah | om atmane namah | om antaratmane namah | om paramatmane
    namah | || 108||
  devanagari: ॐ श्रीदत्ताय नमः । ॐ देवदत्ताय नमः । ॐ ब्रह्मदत्ताय नमः । ॐ विष्णुदत्ताय नमः । ॐ शिवदत्ताय
    नमः । ॐ अत्रिदत्ताय नमः । ॐ आत्रेयाय नमः । ॐ अत्रिवरदाय नमः । ॐ अनुसूयाय नमः । ॐ अनसूयासूनवे नमः ।
    ॥ १०॥ ॐ अवधूताय नमः । ॐ धर्माय नमः । ॐ धर्मपरायणाय नमः । ॐ धर्मपतये नमः । ॐ सिद्धाय नमः । ॐ सिद्धिदाय
    नमः । ॐ सिद्धिपतये नमः । ॐ सिद्धसेविताय नमः । ॐ गुरवे नमः । ॐ गुरुगम्याय नमः । ॥ २०॥ ॐ गुरोर्गुरुतराय
    नमः । ॐ गरिष्ठाय नमः । ॐ वरिष्ठाय नमः । ॐ महिष्ठाय नमः । ॐ महात्मने नमः । ॐ योगाय नमः । ॐ योगगम्याय
    नमः । ॐ योगीदेशकराय नमः । ॐ योगरतये नमः । ॐ योगीशाय नमः । ॥ ३०॥ ॐ योगाधीशाय नमः । ॐ योगपरायणाय नमः
    । ॐ योगिध्येयाङ्घ्रिपङ्कजाय नमः । ॐ दिगम्बराय नमः । ॐ दिव्याम्बराय नमः । ॐ पीताम्बराय नमः । ॐ श्वेताम्बराय
