id: ayyappa-pancha-ratnam
category: stotram
name:
  english: Ayyappa Pancha Ratnam
content:
  english: lokaviram mahapujyam sarvarakshakaram vibhum | parvati hridayanandam shastaram pranamamyaham
    || || viprapujyam vishvavandyam vishnushambhoh priyam sutam | kshipraprasadaniratam shastaram pranamamyaham
    || || mattamatangagamanam karunyamritapuritam | sarvavighnaharam devam shastaram pranamamyaham ||
    || asmatkuleshvaram devam asmacchatru vinashanam | asmadishtapradataram shastaram pranamamyaham ||
    || pandyeshavamshatilakam kerale kelivigraham | artatranaparam devam shastaram pranamamyaham || ||
    pancaratnakhyametadyo nityam shuddhah pathennarah | tasya prasanno bhagavan shasta vasati manase ||
    iti shri shasta pancaratnam | atha shasta namaskara shlokah | trayambakapuradhisham ganadhipasamanvitam
    | gajarudhamaham vande shastaram pranamamyaham || || shivaviryasamudbhutam shrinivasatanudbhavam |
    shikhivahanujam vande shastaram pranamamyaham || || yasya dhanvantarirmata pita devo maheshvarah |
    tam shastaramaham vande maharoganivaranam || || bhutanatha sadananda sarvabhutadayapara | raksha raksha
    mahabaho shastre tubhyam namo namah ||
  devanagari: लोकवीरं महापूज्यं सर्वरक्षाकरं विभुम् । पार्वती हृदयानन्दं शास्तारं प्रणमाम्यहम् ॥ ॥ विप्रपूज्यं
    विश्ववन्द्यं विष्णुशम्भोः प्रियं सुतम् । क्षिप्रप्रसादनिरतं शास्तारं प्रणमाम्यहम् ॥ ॥ मत्तमातङ्गगमनं
    कारुण्यामृतपूरितम् । सर्वविघ्नहरं देवं शास्तारं प्रणमाम्यहम् ॥ ॥ अस्मत्कुलेश्वरं देवम् अस्मच्छत्रु
    विनाशनम् । अस्मदिष्टप्रदातारं शास्तारं प्रणमाम्यहम् ॥ ॥ पाण्ड्येशवंशतिलकं केरले केलिविग्रहम् । आर्तत्राणपरं
    देवं शास्तारं प्रणमाम्यहम् ॥ ॥ पञ्चरत्नाख्यमेतद्यो नित्यं शुद्धः पठेन्नरः । तस्य प्रसन्नो भगवान् शास्ता
    वसति मानसे ॥ इति श्री शास्ता पञ्चरत्नम् । अथ शास्ता नमस्कार श्लोकाः । त्रयम्बकपुराधीशं गणाधिपसमन्वितम्
    । गजारूढमहं वन्दे शास्तारं प्रणमाम्यहम् ॥ ॥ शिववीर्यसमुद्भूतं श्रीनिवासतनूद्भवम् । शिखिवाहानुजं वन्दे
    शास्तारं प्रणमाम्यहम् ॥ ॥ यस्य धन्वन्तरिर्माता पिता देवो महेश्वरः । तं शास्तारमहं वन्दे महारोगनिवारणम्
    ॥ ॥ भूतनाथ सदानन्द सर्वभूतदयापर । रक्ष रक्ष महाबाहो शास्त्रे तुभ्यं नमो नमः ॥
