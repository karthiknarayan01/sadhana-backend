id: brihaspatikritam2shivastotram
category: stotram
name:
  english: brihaspatikritam2shivastotram
  devanagari: बृहस्पतिकृतं२शिवस्तोत्रम्
content:
  english: brihaspatikritam 2 shivastotram brihaspatistada shambhum jnatva sattvadhiya hi tam || 34||
    baddhanjalirnanamesham papata dandavadbhuvi | sabhayena hridayena haram stotum pracakrame || 35||
    namo'gamyasvarupaya svatantraya kapardine | tryambakaya maheshaya digambaraya te namah || 36|| namo
    raudraya devaya dinanathaya shambhave | virupakshaya shantaya bhaktatratre namo namah || 37|| virupaya'titejasvisvarupaya
    ca te namah | kalantakaya sharvaya namaste paramatmane || 38|| tvamagnistvam mahavayurvyoma tvam salilam
    dhara | suryastvam candramastvam ca nakshatrani tvameva ha || 39|| jyotishcakam tvayi caste vishnurbrahma
    tvameva vai | indro brihaspatishcanye tvadaradhanatah sada || 40|| sukhinah sampadam bhoktarashcopadravavarjitah
    | bhavanti tatkatham natha stambho'tra suranayake || 41|| iti shrilakshminarayaniyasamhitayam prathame
    kritayugasantane 324
  devanagari: बृहस्पतिकृतं २ शिवस्तोत्रम् बृहस्पतिस्तदा शम्भुं ज्ञात्वा सत्त्वधिया हि तम् ॥ ३४॥ बद्धाञ्जलिर्ननामेशं
    पपात दण्डवद्भुवि । सभयेन हृदयेन हरं स्तोतुं प्रचक्रमे ॥ ३५॥ नमोऽगम्यस्वरूपाय स्वतन्त्राय कपर्दिने
    । त्र्यम्बकाय महेशाय दिगम्बराय ते नमः ॥ ३६॥ नमो रौद्राय देवाय दीननाथाय शम्भवे । विरूपाक्षाय शान्ताय
    भक्तत्रात्रे नमो नमः ॥ ३७॥ विरूपायाऽतितेजस्विस्वरूपाय च ते नमः । कालान्तकाय शर्वाय नमस्ते परमात्मने
    ॥ ३८॥ त्वमग्निस्त्वं महावायुर्व्योम त्वं सलिलं धरा । सूर्यस्त्वं चन्द्रमास्त्वं च नक्षत्राणि त्वमेव
    ह ॥ ३९॥ ज्योतिश्चकं त्वयि चास्ते विष्णुर्ब्रह्मा त्वमेव वै । इन्द्रो बृहस्पतिश्चान्ये त्वदाराधनतः
    सदा ॥ ४०॥ सुखिनः सम्पदां भोक्तारश्चोपद्रववर्जिताः । भवन्ति तत्कथं नाथ स्तम्भोऽत्र सुरनायके ॥ ४१॥ इति
    श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने ३२४
