id: sri-rama-charita-manasa-aranya-kanda
category: stotram
name:
  english: Sri Rama Charita Manasa - Aranya Kanda
content:
  english: shri ganeshaya namah shri janakivallabho vijayate shri ramacaritamanasa tritiya sopana mulam
    dharmatarorvivekajaladheh purnendumanandadam vairagyambujabhaskaram hyaghaghanadhvantapaham tapaham|
    mohambhodharapugapatanavidhau svahsambhavam shankaram vande brahmakulam kalankashamanam shriramabhupapriyam
    || || sandranandapayodasaubhagatanum pitambaram sundaram panau banasharasanam katilasattunirabharam
    varam rajivayatalocanam dhritajatajutena samshobhitam sitalakshmanasamyutam pathigatam ramabhiramam
    bhaje || uma rama guna gurha pandita muni pavahim birati| pavahim moha bimurha je hari bimukha na
    dharma rati || pura nara bharata priti maim gai| mati anurupa anupa suhai || aba prabhu carita sunahu
    ati pavana| karata je bana sura nara muni bhavana || eka bara cuni kusuma suhae| nija kara bhushana
    rama banae || sitahi pahirae prabhu sadara| baithe phatika sila para sundara || surapati suta dhari
    bayasa besha| satha cahata raghupati bala dekha || jimi pipilika sagara thaha| maha mandamati pavana
    caha || sita carana caunca hati bhaga| murha mandamati karana kaga || cala rudhira raghunayaka jana|
    sinka dhanusha sayaka sandhana || do ati kripala raghunayaka sada dina para neha| ta sana ai kinha
    chalu murakha avaguna geha || || prerita mantra brahmasara dhava| cala bhaji bayasa bhaya pava ||
    dhari nija rupa gayu pitu pahim| rama bimukha rakha tehi nahim || bha nirasa upaji mana trasa| jatha
    cakra bhaya rishi durbasa || brahmadhama sivapura saba loka| phira shramita byakula bhaya soka ||
    kahu~ baithana kaha na ohi| rakhi ko saki rama kara drohi || matu mrityu pitu samana samana| sudha
    hoi bisha sunu harijana || mitra kari sata ripu kai karani| ta kaha~ bibudhanadi baitarani || saba
    jagu tahi analahu te tata| jo raghubira bimukha sunu bhrata || narada dekha bikala jayanta| lagi daya
    komala cita santa || pathava turata rama pahim tahi| kahesi pukari pranata hita pahi || atura sabhaya
    gahesi pada jai| trahi trahi dayala raghurai || atulita bala atulita prabhutai| maim matimanda jani
    nahim pai || nija krita karma janita phala payu~| aba prabhu pahi sarana taki ayu~ || suni kripala
    ati arata bani| ekanayana kari taja bhavani || so kinha moha basa droha jadyapi tehi kara badha ucita|
    prabhu charaeu kari choha ko kripala raghubira sama || || raghupati citrakuta basi nana| carita kie
    shruti sudha samana || bahuri rama asa mana anumana| hoihi bhira sabahim mohi jana || sakala muninha
    sana bida karai| sita sahita cale dvau bhai || atri ke ashrama jaba prabhu gayu| sunata mahamuni harashita
    bhayu || pulakita gata atri uthi dhae| dekhi ramu atura cali ae || karata dandavata muni ura lae|
    prema bari dvau jana anhavae || dekhi rama chabi nayana juraane| sadara nija ashrama taba ane || kari
    puja kahi bacana suhae| die mula phala prabhu mana bhae || so prabhu asana asina bhari locana sobha
    nirakhi| munibara parama prabina jori pani astuti karata || namami bhakta vatsalam| kripalu shila
    komalam || bhajami te padambujam| akaminam svadhamadam || nikama shyama sundaram| bhavambunatha mandaram
    || praphulla kanja locanam| madadi dosha mocanam || pralamba bahu vikramam| prabho'prameya vaibhavam
    || nishanga capa sayakam| dharam triloka nayakam || dinesha vamsha mandanam| mahesha capa khandanam
    || munindra santa ranjanam| surari vrinda bhanjanam || manoja vairi vanditam| ajadi deva sevitam ||
    vishuddha bodha vigraham| samasta dushanapaham || namami indira patim| sukhakaram satam gatim || bhaje
    sashakti sanujam| shaci patim priyanujam || tvadanghri mula ye narah| bhajanti hina matsara || patanti
    no bhavarnave| vitarka vici sankule || vivikta vasinah sada| bhajanti muktaye muda || nirasya indriyadikam|
    prayanti te gatim svakam || tamekamabhdutam prabhum| nirihamishvaram vibhum || jagadgurum ca shashvatam|
    turiyameva kevalam || bhajami bhava vallabham| kuyoginam sudurlabham || svabhakta kalpa padapam| samam
    susevyamanvaham || anupa rupa bhupatim| nato'hamurvija patim || prasida me namami te| padabja bhakti
    dehi me || pathanti ye stavam idam| naradarena te padam || vrajanti natra samshayam| tvadiya bhakti
    samyuta || do binati kari muni nai siru kaha kara jori bahori| carana saroruha natha jani kabahu~
    tajai mati mori || || shri ganeshaya namah shri janakivallabho vijayate shri ramacaritamanasa shloka
    mulam dharmatarorvivekajaladheh purnendumanandadam vairagyambujabhaskaram hyaghaghanadhvantapaham
    tapaham| mohambhodharapugapatanavidhau svahsambhavam shankaram vande brahmakulam kalankashamanam shriramabhupapriyam
    || || sandranandapayodasaubhagatanum pitambaram sundaram panau banasharasanam katilasattunirabharam
    varam rajivayatalocanam dhritajatajutena samshobhitam sitalakshmanasamyutam pathigatam ramabhiramam
