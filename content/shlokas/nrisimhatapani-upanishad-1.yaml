id: nrisimhatapani-upanishad-1
category: upanishad
name:
  english: nrisimhatapani upanishad-1
  devanagari: नृसिंहतापनी उपनिषद्-1
content:
  english: kamastadagre samavartatadhi manaso retah prathamam yadasit | sato bandhumasati niravindanhridi
    pratishya kavayo manisheti upainam tadupanamati yatkamo bhavati ya evam veda || 1 || sa tapo'tapyata
    sa tapastaptva sa etam mantrarajam narasimhamanushtubhamapashyattena vai sarvamidamasrijata yadidam
    kinca | tasmatsarvamanushtubhamityacakshate yadidam kinca | anushtubho va imani bhutani jayante |
    anushtubha jatani jivanti | anushtubham prayantyabhisamvishanti tasyaisha bhavati anushtupprathama
    bhavati anushtubuttama bhavati vagva anushtup vacaiva prayanti vacodyanti parama va esha chandasam
    yadanushtubiti || 2 || sasagaram saparvatam saptadvipam vasundharam tatsamnah prathamam padam janiyat
    | yakshagandharvapsaroganasevitamantariksham tatsamno dvitiyam padam janiyadvasurudradityaih sarvairdevaih
    sevitam divam tatsamnastritiyam padam janiyat | brahmasvarupam niranjanam paramam vyomakam tatsamnashcaturtham
    padam janiyadyo janite so'mritatvam ca gacchati || 3 || rigyajuhsamatharvanashcatvaro vedah sangah
    sashakhashcatvarah pada bhavanti || 4 || kim dhyanam kim daivatam kanyangani kani daivatani kim chandah
    ka rishiriti || 5 || sa hovaca prajapatih sa yo ha vai savitryasyashtaksharam padam shriyabhishiktam
    tatsamno'ngam veda shriya haivabhishicyate | sarve vedah pranavadikastam pranavam tatsamno'ngam veda
    sa trimllokanjayati caturvimshatyakshara mahalakshmiryajustatsamno'ngam veda sa ayuryashahkirtijnanaishvairyavanbhavati
    | tasmadidam sangam sama janiyadyo janite so'mritatvam ca gacchati || 6 || savitrim pranavam yajurlakshmim
    strishudraya necchanti | dvatrimshadaksharam sama janiyadyo janite so'mritatvam ca gacchati | savitrim
    lakshmim yajuh pranavam yadi janiyat stri shudrah sa mrito'dho gacchati tasmatsarvada nacashte yadyacashte
    sa acaryastenaiva sa mrito'dho gacchati || 7 || sa hovaca prajapatih agnirvai deva idam sarvam vishva
    bhutani prana va indriyani pashavo'nnamabhritam samrat svaradvirat tatsamnah prathamam padam janiyat
    | rigyajuhsamatharvarupah suryo'ntaraditye hiranmayah purushastatsamno dvitiyam padam janiyat | ya
    oshadhinam prabhurbhavati taradhipatih somastatsamnastritiyam padam janiyat | sa brahma sa shivah
    sa harih sendrah so'ksharah paramah svarat tatsamnashcaturtham padam janiyadyo janite so'mritatvam
    ca gacchati || 8 || ugram prathamasyadyam jvalam dvitiyasyadyam nrisimham tritiyasyadyam mrityum caturthasyadyam
    sama janiyadyo janite so'mritatvam ca gacchati | tasmadidam sama yatra kutracinnacashte yadi datumapekshate
    putraya shushrushave dasyatyanyasmai shishyaya va ceti || 9 || kshirodarnavashayinam nrikesarivigraham
    yogidhyeyam param padam sama janiyadyo janite so'mritatvam ca gacchati || 10 || viram prathamasyadyardhyantyam
    tam sa dvitiyasyadyardhyantyam ham bhi tritiyasyadyardhyantyam mrityum caturthasyadyardhyantyam sama
    tu janiyadyo janite so'mritatvam ca gacchati | tasmadidam sama yena kenacidacaryamukhena yo janite
    sa tenaiva sharirena samsaranmucyate mocayati mumukshurbhavati | japattenaiva sharirena devatadarshanam
    karoti tasmadidameva mukhyadvaram kalau nanyesham bhavati tasmadidam sangam sama janiyadyo janite
    so'mritatvam ca gacchati || 11 || ritam satyam param brahma purusham krishnapingalam | urdhvaretam
    virupaksham shankaram nilalohitam | umapatih pashupatih pinaki hyamitadyutih | ishanah sarvavidyanamishvarah
    sarvabhutanam brahmadhipatirbrahmano'dhipatiryo vai yajurvedavacyastvam sama janiyadyo janite so'mritatvam
    ca gacchati || 12 || mahaprathamantardhasyadyantavato dvitiyantardhasyadyam shanam tritiyantardhasyadyam
    nama caturthantardhasyadyam sama janiyadyò janite so'mritatvam ca gacchati | tasmadidam sama saccidanandamayam
    param brahma tamevavamvidvanamrita iha bhavati tasmadidam sangam sama janiyadyo janite so'mritatvam
    ca gacchati || 13 || vishvasrija etena vai vishvamidamasrijanta yadvishvamasrijanta tasmadvishvasrijo
    vishvamenananu prajayate brahmanah salokatam sarshtitam sayujyam yanti tasmadidam sangam sama janiyadyo
    janite so'mritatvam ca gacchati || 14 || vishnum prathamantyam mukham dvitiyantyam bhadram tritiyantyam
    myaham caturthyantam sama janiyadyo janite so'mritatvam ca gacchati | yo'sau yadidam kincatmani brahmanyevanushtubham
    janiyadyo janite sò'mritatvam ca gacchati || ya ihaiva sthatumapekshate tasmai sarvaishvairyam dadati
    | yatra kutrapi mriyate dehante devah paramam brahma tarakam vyacashte yenasavamritibhutva so'mritatvam
    ca gacchati || 15 || tasmadidam samamadhyagam japati tasmadidam samangam prajapatistasmadidam samangam
    prajapatirya evam vedeti mahopanishat | ya etam mahopanishadam veda sa kritapurashcarano mahavishnurbhavati
    mahavishnurbhavati || 16 || || dvitiyò'panishat || deva ha vai mrityoh papmabhyah samsaracca bibhiyuste
    prajapatimupadhavamstebhya etam mantrarajam narasimhamanushtubham prayacchattena vai te mrityumajayan
    papmanam cataransamsaram cataramstasmadyo mrityoh papmabhyah samsaracca bibhiyatsa etam mantrarajam
    narasimhamanushtubham pratigrihniyatsa mrityum tarati sa papmanam tarati sa samsaram tarati || 1 ||
    tasya ha vai pranavasya ya purva matra prithivyakarah sa rigbhirrigvedo brahma vasavo gayatri garhapatyah
    sa samnah prathamah pado bhavati | dvitiyantariksham sa ukarah sa yajubhiryajurvedo vishnurudrastrishtubdakshinagnih
    sa samno dvitiyah pado bhavati | tritiya dyauh sa makarah sa samabhih samavedo rudra aditya jagatyahavaniyah
    sa samnastritiyah pado bhavati | yavasane'sya caturthyardhamatra sa somaloka onkarah so'tharvanairmantrairatharvavedah
    samvartako'gnirmaruto viradekarshirbhasvati smrita sa samnashcaturthah pado bhavati || 2 || ashtaksharah
    prathamah pado bhavatyashtaksharastrayah pada bhavantyevam dvatrimshadaksharani sampadyante dvatrimshadakshara
    va anushtubbhavatyanushtubha sarvamidam srishtamanushtubha sarvamupasamhritam || 3 || tasya haitasya
    pancangani bhavanti catvarah padashcatvarangani bhavanti sapranavam sarvam pancamam bhavati hridayaya
    namah shirase svaha shikhayai vashat kavacaya hum astraya phaditi prathamam prathamena samyujyate
    dvitiyam dvitiyena tritiyam tritiyena caturtham caturthena pancamam pancamena vyatishajati vyatishikta
    va ime lokastasmadvyatishiktanyangani bhavanti || 4 || omityetadaksharamidam sarvam tasmatpratyaksharamubhayata
    onkaro bhavati | aksharanam nyasamupadishanti brahmavadinah || 5 || tasya ha va ugram prathamam sthanam
    janiyadyo janite so'mritatvam ca gacchati viram dvitiyam sthanam mahavishnum tritiyam sthanam jvalantam
    caturtham sthanam sarvatomukham pancamam sthanam nrisimham shashtham sthanam bhishanam saptamam sthanam
    bhadramashtamam sthanam mrityumrityum navamam sthanam namami dashamam sthanamamekadasham sthanam janiyadyo
    janite so'mritatvam ca gacchati || 6 || ekadashapada va anushtubbhavatyanushtubha sarvamidam srishtamanushtubha
    sarvamidamupasamhritam tasmatsarvanushtubham janiyadyo janite so'mritatvam ca gacchati || 7 || deva
    ha vai prajapatimabruvannatha kasmaducyata ugramiti | sa hovaca prajapatiryasmatsvamahimna sarvamllokansarvandevansarvanatmanah
    sarvani bhutanyudgrihnatyajasram srijati visrijati vasayattyudgrahyata udgrihyate stuhi shrutam gartasadam
    yuvanam mrigam na bhimamupahantrumugram | mrida jaritre rudrastavano anyante asmannivapantu senah
    tasmaducyata ugramiti || 8 || atha kasmaducyate viramiti | yasmatsvamahimna sarvamllokansarvandevansarvanatmanah
    sarvani bhutani viramati viramayatyajasram srijati visrijati vasayati | yato virah karmanyah sudriksho
    yuktagrava jayate devakamastasmaducyate viramiti || 9 || atha kasmaducyate mahavishnumiti | yasmatsvamahimna
    sarvamllokansarvandevansarvanatmanah sarvani bhutani vyapnoti vyapayati sneho yatha palalapindam shantamulamotam
    protamanuvyasam vyatishikto vyapayate | yasmanna jatah paro anyo asti ya avivesha bhuvanani vishva
    | prajapatih prajaya samvidanah trini jyotimshi sacate sa shodashim tasmaducyate mahavishnumiti ||
    10 || atha kasmaducyate jvalantamiti | yasmatsvamahimna sarvamllokansarvandevansarvanatmanah sarvani
    bhutani svatejasa jvalati jvalayati jvalyate jvalayate | savita prasavita dipto dipayandipyamanah
    jvalanjvalita tapanvitapantsamtapanrocano rocamanah shobhanah shobhamanah kalyanastasmaducyate jvalantamiti
    || 11 || atha kasmaducyate sarvatomukhamiti | yasmatsvamahimna sarvamllokansarvandevansarvanatmanah
    sarvani bhutani svayamanindriyo'pi sarvatah pashyati sarvatah shrinoti sarvato gacchati sarvata adatte
    sarvagah sarvagatastishthati | ekah purastadya idam babhuva yato babhuva bhuvanasya gopah | yamapyeti
    bhuvanam samparaye namami tamaham sarvatomukhamiti tasmaducyate sarvatomukhamiti || 12 || atha kasmaducyate
    nrisimhamiti | yasmatsarvesham bhutanam na viryatamah shreshthatamashca simho viryatamah shreshthatamashca
    | tasmannrisimha asitparameshvaro jagaddhitam va etadrupam yadaksharam bhavati | pratadvishnustavate
    viryaya mrigo na bhimah kucaro girishthah | yasyorushu trishu vikramaneshvadhikshiyanti bhuvanani
    vishva | tasmaducyate nrisimhamiti || 13 || atha kasmaducyate bhishanamiti | yasmadbhishanam yasya
    rupam drishtva sarve lokah sarve devah sarvani bhutani bhitya palayante svayam yatah kutashca na bibheti
    | bhishasmatdvatah pavate bhishodeti suryah | bhishasmadagnishcendrasya mrityurdhavati pancama iti
    tasmaducyate bhishanamiti || 14 || atha kasmaducyate bhadramiti | yasmatsvayam bhadro bhutva sarvada
    bhadram dadati | rocano rocamanah shobhanah shobhamanah kalyanah | bhadram karnebhih shrinuyama devah
    bhadram pashyemakshabhiryajatrah | sthirairangaistushtuva~sastanubhirvyashema devahitam yadayuh |
    tasmaducyate bhadramiti || 15 || atha kasmaducyate mrityumrityumiti | yasmatsvamahimna svabhaktanam
    smrita eva mrityumapamrityum ca marayati | ya atmada balada yasya vishva upasate prashisham yasya
    devah | yasya chayamritam yo mrityumrityuh kasmai devaya havisha vidhema tasmaducyate mrityumrityumiti
    || 16 || atha kasmaducyate namamiti | yasmadyam sarve deva namanti mumukshavo brahmavadinashca | pra
    nunam brahmanaspatirmantram vadatyukthyam yasminnindro varuno mitro aryama deva okamsi cakrire tasmaducyate
    namamiti || 17 || atha kasmaducyate'hamiti | ahamasmi prathamaja ritasya purvam devebhyo amritasya
    nabhih | yo ma dadati sa i devamavah ahamannamannamadantamadmi | aham vishvam bhuvanamabhyabhavam
    suvarnajyotirya evam vedeti mahopanishat || 4 || || tritiyo'panishat || deva ha vai prajapatimabruvannanushtubhasya
    mantrarajasya narasimhasya shaktim bijam no bruhi bhagavanniti || 1 || sa hovaca prajapatirmaya va
    esha narasimhi sarvamidam srijati sarvamidam rakshati sarvamidam samharati | tasmanmayametam shaktim
    vidyadya etam mayam shaktim veda sa papmanam tarati sa mrityum tarati sa samsaram tarati so'mritatvam
    ca gacchati mahatim shriyamashnute || 2 || mimamsante brahmavadino hrasva dirgha pluta ceti | yadi
    hrasva bhavati sarvam papmanam dahatyamritatvam ca gacchati yadi dirgha bhavati mahatim shriyamapnotyamritatvam
    ca gacchati yadi pluta bhavati jnanavanbhavatyamritatvam ca gacchati || 3 || tadetadrishinoktam nidarshanam
    sa im pahi ya rijishi tarutrah shriyam lakshmimaupalamambikam gam shashthim ca yamindrasenetyudahuh
    tam vidyam brahmayonim sarupamihayushe sharanamaham prapadye || 4 || sarvesham va etadbhutanamakashah
    parayanam sarvani ha va imani bhutanyakashadeva jayanta akashadeva jatani jivantyakasham prayatyabhisamvishanti
    tasmadakasham bijam vidyat || 5 || tadetadrishinoktam nidarshanam hamsah shucishadvasurantarikshasaddhota
    vedishadatithirduronasat | nrishadvarasadritasadvyomasadabjagoja ritaja adrija ritam brihat | ya evam
    vedeti mahopanishat || 6 || || caturtho'panishat || deva ha vai prajapatimabruvannanushtubhasya mantrarajasya
    narasimhasyangamantranno bruhi bhagava iti || 1 || sa hovaca prajapatih pranavam savitrim yajurlakshmim
    nrisimhagayatrimityangani janiyadyo janite so'mritatvam ca gacchati || 2 || omityetadaksharamidam
    sarvam tasyopavyakhyanam bhutam bhavadbhavishyaditi sarvamonkara eva yaccanyattrikalatitam tadapyonkara
    eva | sarvam hyetadbrahmayamatma brahma so'yamatma catushpat || 3 || jagaritasthano bahihprajnah saptanga
    ekonavimshatimukhah sthulabhugvaishvanarah prathamah padah || 4 || svapnasthano'ntahprajnah saptanga
    ekonavimshatimukhah praviviktabhuktaijaso dvitiyah padah || 5 || yatra supto na kancana kamam kamayate
    na kancana svapnam pashyati tatsushuptam | sushuptasthana ekibhutah prajnanaghana ekanandamayo hyanandabhuk
    cetomukhah prajnastritiyo padah | esha sarveshvara esha sarvajna esho'ntaryamyesha yonih sarvasya
    prabhavapyayau hi bhutanam || 6 || nantahprajnam na bahihprajnam nobhayatahprajnam na prajnam naprajnam
    na prajnanaghanamadrishtamavyavaharyamagrahyamalakshanamacintyamavyapadeshyamaikatmyapratyayasaram
    prapancopashamam shantam shivamadvaitam caturtham manyante sa atma sa vijneyah || 7 || atha savitri
    gayatrya yajusha prokta taya sarvamidam vyaptam ghriniriti dve akshare surya iti trini aditya iti
    trini | etadvai savitrasyashtaksharam padam shriyabhishiktam ya evam veda shriya haivabhishicyate
    || 8 || tadetadricabhyuktam rico akshare parame vyomanyasmindeva adhivishve nisheduh| yastanna veda
    kimrica karishyati ya ittadvidusta ime samasata iti || 9 || na ha va etasyarca na yajusha na samnartho'sti
    yah savitram vedeti || 10 || om bhurlakshmirbhuvarlakshmih svarlakshmih kalakarni tanno mahalakshmih
    pracodayat ityesha vai mahalakshmiryajurgayatri caturvimshatyakshara bhavati || 11 || gayatri va idam
    sarvam yadidam kinca tasmadya etam mahalakshmim yajushim veda mahatim shriyamashnute || 12 || om nrisimhaya
    vidmahe vajranakhaya dhimahi | tannah simhah pracodayat ityesha vai nrisimhagayatri devanam vedanam
    nidanam bhavati ya evam veda nidanavanbhavati || 13 || deva ha vai prajapatimabruvannatha kairmantraih
    stuto devah prito bhavati svatmanam darshayati tanno bruhi bhagavanniti || 14 || sa hovaca prajapatih
    | om yo ha vai nrisimho devo bhagavanyashca brahma burbhuvah svastasmai vai namo namah || 1 ||
  devanagari: कामस्तदग्रे समवर्तताधि मनसो रेतः प्रथमं यदासीत् । सतो बन्धुमसति निरविन्दन्हृदि प्रतीष्या
    कवयो मनीषेति उपैनं तदुपनमति यत्कामो भवति य एवं वेद ॥ १ ॥ स तपोऽतप्यत स तपस्तप्त्वा स एतं मन्त्रराजं
    नारसिंहमानुष्टुभमपश्यत्तेन वै सर्वमिदमसृजत यदिदं किञ्च । तस्मात्सर्वमानुष्टुभमित्याचक्षते यदिदं किञ्च
    । अनुष्टुभो वा इमानि भूतानि जायन्ते । अनुष्टुभा जातानि जीवन्ति । अनुष्टुभं प्रयन्त्यभिसंविशन्ति तस्यैषा
    भवति अनुष्टुप्प्रथमा भवति अनुष्टुबुत्तमा भवति वाग्वा अनुष्टुप् वाचैव प्रयन्ति वाचोद्यन्ति परमा वा
    एषा छन्दसां यदनुष्टुबिति ॥ २ ॥ ससागरां सपर्वतां सप्तद्वीपां वसुन्धरां तत्साम्नः प्रथमं पादं जानीयात्
    । यक्षगन्धर्वाप्सरोगणसेवितमन्तरिक्षं तत्साम्नो द्वितीयं पादं जानीयाद्वसुरुद्रादित्यैः सर्वैर्देवैः
    सेवितं दिवं तत्साम्नस्तृतीयं पादं जानीयात् । ब्रह्मस्वरूपं निरञ्जनं परमं व्योमकं तत्साम्नश्चतुर्थं
    पादं जानीयाद्यो जानीते सोऽमृतत्वं च गच्छति ॥ ३ ॥ ऋग्यजुःसामाथर्वाणश्चत्वारो वेदाः साङ्गाः सशाखाश्चत्वारः
    पादा भवन्ति ॥ ४ ॥ किं ध्यानं किं दैवतं कान्यङ्गानि कानि दैवतानि किं छन्दः क ऋषिरिति ॥ ५ ॥ स होवाच
    प्रजापतिः स यो ह वै सावित्र्यस्याष्टाक्षरं पदं श्रियाभिषिक्तं तत्साम्नोऽङ्गं वेद श्रिया हैवाभिषिच्यते
    । सर्वे वेदाः प्रणवादिकास्तं प्रणवं तत्साम्नोऽङ्गं वेद स त्रींल्लोकाञ्जयति चतुर्विंशत्यक्षरा महालक्ष्मीर्यजुस्तत्साम्नोऽङ्गं
    वेद स आयुर्यशःकीर्तिज्ञानैश्वैर्यवान्भवति । तस्मादिदं साङ्गं साम जानीयाद्यो जानीते सोऽमृतत्वं च गच्छति
    ॥ ६ ॥ सावित्रीं प्रणवं यजुर्लक्ष्मीं स्त्रीशूद्राय नेच्छन्ति । द्वात्रिंशदक्षरं साम जानीयाद्यो जानीते
    सोऽमृतत्वं च गच्छति । सावित्रीं लक्ष्मीं यजुः प्रणवं यदि जानीयात् स्त्री शूद्रः स मृतोऽधो गच्छति तस्मात्सर्वदा
    नाचष्टे यद्याचष्टे स आचार्यस्तेनैव स मृतोऽधो गच्छति ॥ ७ ॥ स होवाच प्रजापतिः अग्निर्वै देवा इदं सर्वं
    विश्वा भूतानि प्राणा वा इन्द्रियाणि पशवोऽन्नमभृतं सम्राट् स्वराड्विराट् तत्साम्नः प्रथमं पादं जानीयात्
    । ऋग्यजुःसामाथर्वरूपः सूर्योऽन्तरादित्ये हिरण्मयः पुरुषस्तत्साम्नो द्वितीयं पादं जानीयात् । य ओषधीनां
    प्रभुर्भवति ताराधिपतिः सोमस्तत्साम्नस्तृतीयं पादं जानीयात् । स ब्रह्मा स शिवः स हरिः सेन्द्रः सोऽक्षरः
    परमः स्वराट् तत्साम्नश्चतुर्थं पादं जानीयाद्यो जानीते सोऽमृतत्वं च गच्छति ॥ ८ ॥ उग्रं प्रथमस्याद्यं
    ज्वलं द्वितीयस्याद्यं नृसिंहं तृतीयस्याद्यं मृत्युं चतुर्थस्याद्यं साम जानीयाद्यो जानीते सोऽमृतत्वं
    च गच्छति । तस्मादिदं साम यत्र कुत्रचिन्नाचष्टे यदि दातुमपेक्षते पुत्राय शुश्रूषवे दास्यत्यन्यस्मै
    शिष्याय वा चेति ॥ ९ ॥ क्षीरोदार्णवशायिनं नृकेसरिविग्रहं योगिध्येयं परं पदं साम जानीयाद्यो जानीते सोऽमृतत्वं
    च गच्छति ॥ १० ॥ वीरं प्रथमास्याद्यार्ध्यान्त्यं तं स द्वितीयस्याद्यार्ध्यान्त्यं हं भी तृतीयस्याद्यार्ध्यान्त्यं
    मृत्युं चतुर्थस्याद्यार्ध्यान्त्यं साम तु जानीयाद्यो जानीते सोऽमृतत्वं च गच्छति । तस्मादिदं साम येन
    केनचिदाचार्यमुखेन यो जानीते स तेनैव शरीरेण संसारान्मुच्यते मोचयति मुमुक्षुर्भवति । जपात्तेनैव शरीरेण
    देवतादर्शनं करोति तस्मादिदमेव मुख्यद्वारं कलौ नान्येषां भवति तस्मादिदं साङ्गं साम जानीयाद्यो जानीते
    सोऽमृतत्वं च गच्छति ॥ ११ ॥ ऋतं सत्यं परं ब्रह्म पुरुषं कृष्णपिङ्गलम् । ऊर्ध्वरेतं विरूपाक्षं शङ्करं
    नीललोहितम् । उमापतिः पशुपतिः पिनाकी ह्यमितद्युतिः । ईशानः सर्वविद्यानामीश्वरः सर्वभूतानां ब्रह्माधिपतिर्ब्रह्मणोऽधिपतिर्यो
    वै यजुर्वेदवाच्यस्त्वं साम जानीयाद्यो जानीते सोऽमृतत्वं च गच्छति ॥ १२ ॥ महाप्रथमान्तार्धस्याद्यन्तवतो
    द्वितीयान्तार्धस्याद्यं षणं तृतीयान्तार्धस्याद्यं नाम चतुर्थान्तर्धस्याद्यं साम जानीयाद्यॊ जानीते
    सोऽमृतत्वं च गच्छति । तस्मादिदं साम सच्चिदानन्दमयं परं ब्रह्म तमेववंविद्वानमृत इह भवति तस्मादिदं साङ्गं
    साम जानीयाद्यो जानीते सोऽमृतत्वं च गच्छति ॥ १३ ॥ विश्वसृज एतेन वै विश्वमिदमसृजन्त यद्विश्वमसृजन्त
    तस्माद्विश्वसृजो विश्वमेनाननु प्रजायते ब्रह्मणः सलोकतां सार्ष्टितां सायुज्यं यान्ति तस्मादिदं साङ्गं
    साम जानीयाद्यो जानीते सोऽमृतत्वं च गच्छति ॥ १४ ॥ विष्णुं प्रथमान्त्यं मुखं द्वितीयान्त्यं भद्रं तृतीयान्त्यं
    म्यहं चतुर्थ्यान्तं साम जानीयाद्यो जानीते सोऽमृतत्वं च गच्छति । योऽसौ यदिदं किञ्चात्मनि ब्रह्मण्येवानुष्टुभं
    जानीयाद्यो जानीते सॊऽमृतत्वं च गच्छति ॥ य इहैव स्थातुमपेक्षते तस्मै सर्वैश्वैर्यं ददाति । यत्र कुत्रापि
    म्रियते देहान्ते देवः परमं ब्रह्म तारकं व्याचष्टे येनासावमृतीभूत्वा सोऽमृतत्वं च गच्छति ॥ १५ ॥ तस्मादिदं
    साममध्यगं जपति तस्मादिदं सामाङ्गं प्रजापतिस्तस्मादिदं सामाङ्गं प्रजापतिर्य एवं वेदेति महोपनिषत् ।
    य एतां महोपनिषदं वेद स कृतपुरश्चरणो महाविष्णुर्भवति महाविष्णुर्भवति ॥ १६ ॥ ॥ द्वितीयॊऽपनिषत् ॥ देवा
    ह वै मृत्योः पाप्मभ्यः संसाराच्च बिभीयुस्ते प्रजापतिमुपाधावंस्तेभ्य एतं मन्त्रराजं नारसिंहमानुष्टुभं
    प्रायच्छत्तेन वै ते मृत्युमजयन् पाप्मानं चातरन्संसारं चातरंस्तस्माद्यो मृत्योः पाप्मभ्यः संसाराच्च
    बिभीयात्स एतं मन्त्रराजं नारसिंहमानुष्टुभं प्रतिगृह्णीयात्स मृत्युं तरति स पाप्मानं तरति स संसारं
    तरति ॥ १ ॥ तस्य ह वै प्रणवस्य या पूर्वा मात्रा पृथिव्यकारः स ऋग्भिर्ऋग्वेदो ब्रह्मा वसवो गायत्री गार्हपत्यः
    सा साम्नः प्रथमः पादो भवति । द्वितीयान्तरिक्षं स उकारः स यजुभिर्यजुर्वेदो विष्णुरुद्रास्त्रिष्टुब्दक्षिणाग्निः
    सा साम्नो द्वितीयः पादो भवति । तृतीया द्यौः स मकारः स सामभिः सामवेदो रुद्रा आदित्या जगत्याहवनीयः सा
    साम्नस्तृतीयः पादो भवति । यावसानेऽस्य चतुर्थ्यर्धमात्रा स सोमलोक ओङ्कारः सोऽथर्वणैर्मन्त्रैरथर्ववेदः
    संवर्तकोऽग्निर्मरुतो विराडेकर्षिर्भास्वती स्मृता सा साम्नश्चतुर्थः पादो भवति ॥ २ ॥ अष्टाक्षरः प्रथमः
    पादो भवत्यष्टाक्षरास्त्रयः पादा भवन्त्येवं द्वात्रिंशदक्षराणि संपद्यन्ते द्वात्रिंशदक्षरा वा अनुष्टुब्भवत्यनुष्टुभा
    सर्वमिदं सृष्टमनुष्टुभा सर्वमुपसंहृतम् ॥ ३ ॥ तस्य हैतस्य पञ्चाङ्गानि भवन्ति चत्वारः पादाश्चत्वाराङ्गानि
    भवन्ति सप्रणवं सर्वं पञ्चमं भवति हृदयाय नमः शिरसे स्वाहा शिखायै वषट् कवचाय हुं अस्त्राय फडिति प्रथमं
    प्रथमेन संयुज्यते द्वितीयं द्वितीयेन तृतीयं तृतीयेन चतुर्थं चतुर्थेन पञ्चमं पञ्चमेन व्यतिषजति व्यतिषिक्ता
    वा इमे लोकास्तस्माद्व्यतिषिक्तान्यङ्गानि भवन्ति ॥ ४ ॥ ओमित्येतदक्षरमिदं सर्वं तस्मात्प्रत्यक्षरमुभयत
    ओङ्कारो भवति । अक्षराणां न्यासमुपदिशन्ति ब्रह्मवादिनः ॥ ५ ॥ तस्य ह वा उग्रं प्रथमं स्थानं जानीयाद्यो
    जानीते सोऽमृतत्वं च गच्छति वीरं द्वितीयं स्थानं महाविष्णुं तृतीयं स्थानं ज्वलन्तं चतुर्थं स्थानं सर्वतोमुखं
    पञ्चमं स्थानं नृसिंहं षष्ठं स्थानं भीषणं सप्तमं स्थानं भद्रमष्टमं स्थानं मृत्युमृत्युं नवमं स्थानं
    नमामि दशमं स्थानममेकादशं स्थानं जानीयाद्यो जानीते सोऽमृतत्वं च गच्छति ॥ ६ ॥ एकादशपदा वा अनुष्टुब्भवत्यनुष्टुभा
    सर्वमिदं सृष्टमनुष्टुभा सर्वमिदमुपसंहृतं तस्मात्सर्वानुष्टुभं जानीयाद्यो जानीते सोऽमृतत्वं च गच्छति
    ॥ ७ ॥ देव ह वै प्रजापतिमब्रुवन्नथ कस्मादुच्यत उग्रमिति । स होवाच प्रजापतिर्यस्मात्स्वमहिम्ना सर्वांल्लोकान्सर्वान्देवान्सर्वानात्मनः
    सर्वाणि भूतान्युद्गृह्णात्यजस्रं सृजति विसृजति वासयत्त्युद्ग्राह्यत उद्गृह्यते स्तुहि श्रुतं गर्तसदं
    युवानं मृगं न भीममुपहन्त्रुमुग्रम् । मृडा जरित्रे रुद्रस्तवानो अन्यन्ते अस्मन्निवपन्तु सेनाः तस्मादुच्यत
    उग्रमिति ॥ ८ ॥ अथ कस्मादुच्यते वीरमिति । यस्मात्स्वमहिम्ना सर्वांल्लोकान्सर्वान्देवान्सर्वानात्मनः
    सर्वाणि भूतानि विरमति विरामयत्यजस्रं सृजति विसृजति वासयति । यतो वीरः कर्मण्यः सुदृक्षो युक्तग्राव
    जायते देवकामस्तस्मादुच्यते वीरमिति ॥ ९ ॥ अथ कस्मादुच्यते महाविष्णुमिति । यस्मात्स्वमहिम्ना सर्वांल्लोकान्सर्वान्देवान्सर्वानात्मनः
    सर्वाणि भूतानि व्याप्नोति व्यापयति स्नेहो यथा पललपिण्डं शान्तमूलमोतं प्रोतमनुव्यासं व्यतिषिक्तो व्यापयते
    । यस्मान्न जातः परो अन्यो अस्ति य आविवेश भुवनानि विश्वा । प्रजापतिः प्रजया संविदानः त्रीणि ज्योतींषि
    सचते स षोडषीं तस्मादुच्यते महाविष्णुमिति ॥ १० ॥ अथ कस्मादुच्यते ज्वलन्तमिति । यस्मात्स्वमहिम्ना सर्वांल्लोकान्सर्वान्देवान्सर्वानात्मनः
    सर्वाणि भूतानि स्वतेजसा ज्वलति ज्वालयति ज्वाल्यते ज्वालयते । सविता प्रसविता दीप्तो दीपयन्दीप्यमानः
    ज्वलञ्ज्वलिता तपन्वितपन्त्संतपन्रोचनो रोचमानः शोभनः शोभमानः कल्याणस्तस्मादुच्यते ज्वलन्तमिति ॥ ११
    ॥ अथ कस्मादुच्यते सर्वतोमुखमिति । यस्मात्स्वमहिम्ना सर्वांल्लोकान्सर्वान्देवान्सर्वानात्मनः सर्वाणि
    भूतानि स्वयमनिन्द्रियोऽपि सर्वतः पश्यति सर्वतः शृणोति सर्वतो गच्छति सर्वत आदत्ते सर्वगः सर्वगतस्तिष्ठति
    । एकः पुरस्ताद्य इदं बभूव यतो बभूव भुवनस्य गोपाः । यमप्येति भुवनं सांपराये नमामि तमहं सर्वतोमुखमिति
    तस्मादुच्यते सर्वतोमुखमिति ॥ १२ ॥ अथ कस्मादुच्यते नृसिंहमिति । यस्मात्सर्वेषां भूतानां ना वीर्यतमः
    श्रेष्ठतमश्च सिंहो वीर्यतमः श्रेष्ठतमश्च । तस्मान्नृसिंह आसीत्परमेश्वरो जगद्धितं वा एतद्रूपं यदक्षरं
    भवति । प्रतद्विष्णुस्तवते वीर्याय मृगो न भीमः कुचरो गिरिष्ठाः । यस्योरुषु त्रिषु विक्रमणेष्वधिक्षियन्ति
    भुवनानि विश्वा । तस्मादुच्यते नृसिंहमिति ॥ १३ ॥ अथ कस्मादुच्यते भीषणमिति । यस्माद्भीषणं यस्य रूपं
    दृष्ट्वा सर्वे लोकाः सर्वे देवाः सर्वाणि भूतानि भीत्या पलायन्ते स्वयं यतः कुतश्च न बिभेति । भीषास्मत्द्वातः
    पवते भीषोदेति सूर्यः । भीषास्मादग्निश्चेन्द्रस्य मृत्युर्धावति पञ्चम इति तस्मादुच्यते भीषणमिति ॥ १४
    ॥ अथ कस्मादुच्यते भद्रमिति । यस्मात्स्वयं भद्रो भूत्वा सर्वदा भद्रं ददाति । रोचनो रोचमानः शोभनः शोभमानः
    कल्याणः । भद्रं कर्णेभिः शृणुयाम देवाः भद्रं पश्येमाक्षभिर्यजत्राः । स्थिरैरङ्गैस्तुष्टुवाँसस्तनूभिर्व्यशेम
    देवहितं यदायुः । तस्मादुच्यते भद्रमिति ॥ १५ ॥ अथ कस्मादुच्यते मृत्युमृत्युमिति । यस्मात्स्वमहिम्ना
    स्वभक्तानां स्मृत एव मृत्युमपमृत्युं च मारयति । य आत्मदा बलदा यस्य विश्व उपासते प्रशिषं यस्य देवाः
    । यस्य छायामृतं यो मृत्युमृत्युः कस्मै देवाय हविषा विधेम तस्मादुच्यते मृत्युमृत्युमिति ॥ १६ ॥ अथ कस्मादुच्यते
    नमामीति । यस्माद्यं सर्वे देवा नमन्ति मुमुक्षवो ब्रह्मवादिनश्च । प्र नूनं ब्रह्मणस्पतिर्मन्त्रं वदत्युक्थ्यं
    यस्मिन्निन्द्रो वरुणो मित्रो अर्यमा देवा ओकांसि चक्रिरे तस्मादुच्यते नमामीति ॥ १७ ॥ अथ कस्मादुच्यतेऽहमिति
    । अहमस्मि प्रथमजा ऋतस्य पूर्वं देवेभ्यो अमृतस्य नाभिः । यो मा ददाति स इ देवमावाः अहमन्नमन्नमदन्तमद्मि
    । अहं विश्वं भुवनमभ्यभवां सुवर्णज्योतिर्य एवं वेदेति महोपनिषत् ॥ ४ ॥ ॥ तृतीयोऽपनिषत् ॥ देवा ह वै प्रजापतिमब्रुवन्नानुष्टुभस्य
    मन्त्रराजस्य नारसिंहस्य शक्तिं बीजं नो ब्रूहि भगवन्निति ॥ १ ॥ स होवाच प्रजापतिर्माया वा एषा नारसिंही
    सर्वमिदं सृजति सर्वमिदं रक्षति सर्वमिदं संहरति । तस्मान्मायामेतां शक्तिं विद्याद्य एतां मायां शक्तिं
    वेद स पाप्मानं तरति स मृत्युं तरति स संसारं तरति सोऽमृतत्वं च गच्छति महतीं श्रियमश्नुते ॥ २ ॥ मीमांसन्ते
    ब्रह्मवादिनो ह्रस्वा दीर्घा प्लुता चेति । यदि ह्रस्वा भवति सर्वं पाप्मानं दहत्यमृतत्वं च गच्छति यदि
    दीर्घा भवति महतीं श्रियमाप्नोत्यमृतत्वं च गच्छति यदि प्लुता भवति ज्ञानवान्भवत्यमृतत्वं च गच्छति ॥
    ३ ॥ तदेतदृषिणोक्तं निदर्शनं स ईं पाहि य ऋजीषी तरुत्रः श्रियं लक्ष्मीमौपलामम्बिकां गां षष्ठीं च यामिन्द्रसेनेत्युदाहुः
    तां विद्यां ब्रह्मयोनिं सरूपामीहायुषे शरणमहं प्रपद्ये ॥ ४ ॥ सर्वेषां वा एतद्भूतानामाकाशः परायणं सर्वाणि
    ह वा इमानि भूतान्याकाशादेव जायन्त आकाशादेव जातानि जीवन्त्याकाशं प्रयत्यभिसंविशन्ति तस्मादाकाशं बीजं
    विद्यात् ॥ ५ ॥ तदेतदृषिणोक्तं निदर्शनं हंसः शुचिषद्वसुरन्तरिक्षसद्धोत वेदिषदतिथिर्दुरोणसत् । नृषद्वरसदृतसद्व्योमसदब्जागोजा
    ऋतजा अद्रिजा ऋतं बृहत् । य एवं वेदेति महोपनिषत् ॥ ६ ॥ ॥ चतुर्थोऽपनिषत् ॥ देवा ह वै प्रजापतिमब्रुवन्ननुष्टुभस्य
    मन्त्रराजस्य नारसिंहस्याङ्गमन्त्रान्नो ब्रूहि भगव इति ॥ १ ॥ स होवाच प्रजापतिः प्रणवं सावित्रीं यजुर्लक्ष्मीं
    नृसिंहगायत्रीमित्यङ्गानि जानीयाद्यो जानीते सोऽमृतत्वं च गच्छति ॥ २ ॥ ओमित्येतदक्षरमिदं सर्वं तस्योपव्याख्यानं
    भूतं भवद्भविष्यदिति सर्वमोङ्कार एव यच्चान्यत्त्रिकालातीतं तदप्योङ्कार एव । सर्वं ह्येतद्ब्रह्मायमात्मा
    ब्रह्म सोऽयमात्मा चतुष्पात् ॥ ३ ॥ जागरितस्थानो बहिःप्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः स्थूलभुग्वैश्वानरः
    प्रथमः पादः ॥ ४ ॥ स्वप्नस्थानोऽन्तःप्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः प्रविविक्तभुक्तैजसो द्वितीयः पादः
    ॥ ५ ॥ यत्र सुप्तो न कञ्चन कामं कामयते न कञ्चन स्वप्नं पश्यति तत्सुषुप्तम् । सुषुप्तस्थान एकीभूतः प्रज्ञानघन
    एकानन्दमयो ह्यानन्दभुक् चेतोमुखः प्राज्ञस्तृतीयो पादः । एष सर्वेश्वर एष सर्वज्ञ एषोऽन्तर्याम्येष योनिः
    सर्वस्य प्रभवाप्ययौ हि भूतानाम् ॥ ६ ॥ नान्तःप्रज्ञं न बहिःप्रज्ञं नोभयतःप्रज्ञं न प्रज्ञं नाप्रज्ञं
    न प्रज्ञानघनमदृष्टमव्यवहार्यमग्राह्यमलक्षणमचिन्त्यमव्यपदेश्यमैकात्म्यप्रत्ययसारं प्रपञ्चोपशमं शान्तं
    शिवमद्वैतं चतुर्थं मन्यन्ते स आत्मा स विज्ञेयः ॥ ७ ॥ अथ सावित्री गायत्र्या यजुषा प्रोक्ता तया सर्वमिदं
    व्याप्तं घृणिरिति द्वे अक्षरे सूर्य इति त्रीणि आदित्य इति त्रीणि । एतद्वै सावित्रस्याष्टाक्षरं पदं
    श्रियाभिषिक्तं य एवं वेद श्रिया हैवाभिषिच्यते ॥ ८ ॥ तदेतदृचाभ्युक्तम् ऋचो अक्षरे परमे व्योमन्यस्मिन्देवा
    अधिविश्वे निषेदुः। यस्तन्न वेद किमृचा करिष्यति य इत्तद्विदुस्त इमे समासत इति ॥ ९ ॥ न ह वा एतस्यर्चा
    न यजुषा न साम्नार्थोऽस्ति यः सावित्रं वेदेति ॥ १० ॥ ॐ भूर्लक्ष्मीर्भुवर्लक्ष्मीः स्वर्लक्ष्मीः कालकर्णी
    तन्नो महालक्ष्मीः प्रचोदयात् इत्येषा वै महालक्ष्मीर्यजुर्गायत्री चतुर्विंशत्यक्षरा भवति ॥ ११ ॥ गायत्री
    वा इदं सर्वं यदिदं किञ्च तस्माद्य एतां महालक्ष्मीं याजुषीं वेद महतीं श्रियमश्नुते ॥ १२ ॥ ॐ नृसिंहाय
    विद्महे वज्रनखाय धीमहि । तन्नः सिंहः प्रचोदयात् इत्येषा वै नृसिंहगायत्री देवानां वेदानां निदानं भवति
    य एवं वेद निदानवान्भवति ॥ १३ ॥ देवा ह वै प्रजापतिमब्रुवन्नथ कैर्मन्त्रैः स्तुतो देवः प्रीतो भवति स्वात्मानं
    दर्शयति तन्नो ब्रूहि भगवन्निति ॥ १४ ॥ स होवाच प्रजापतिः । ॐ यो ह वै नृसिंहो देवो भगवान्यश्च ब्रह्मा
    बूर्भुवः स्वस्तस्मै वै नमो नमः ॥ १ ॥
