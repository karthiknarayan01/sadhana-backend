id: vaishnavakavacastotramgarudapurana
category: kavacha
name:
  english: vaishnavakavacastotramgarudapurana
  devanagari: वैष्णवकवचस्तोत्रम्गरुडपुराण
content:
  english: sarvavyadhihara athava roganashanavaishnavakavacam hariruvaca | sarvavyadhiharam vakshye vaishnavam
    kavacam shubham | yena raksha krita shambhordaityankshapayatah pura || 1|| shambhornatra karya vicarana
    pranamya devamishanamajam nityamanamayam | devam sarveshvaram vishnum sarvavyapinamavyayam || 2||
    badhnamyaham pratisaram namaskritya janardanam | pratikaram amoghapratimam sarvam sarvaduhkhanivaranam
    || 3|| vishnurmamagratah patu krishno rakshatu prishthatah | harirme rakshatu shiro hridayanca janardanah
    || 4|| mano mama hrishikesho jihvam rakshatu keshavah | pratu netre vasudevah shrotre sankarshano
    vibhuh || 5|| pradyumnah patu me ghranamaniruddhastu carma ca | vanamali galasyantam shrivatso rakshatamadhah
    || 6|| parshvam rakshatu me cakram vamam daityanivaranam | dakshinantu gadadevi sarvasuranivarini
    || 7|| udaram musalam patu prishtham me patu langalam | urdhvam rakshatu me sharngam janghe rakshatu
    nandakah || 8|| parshni rakshatu shankhashca padmam me caranavubhau | sarvakaryarthasiddhyartham patu
    mam garudah sada || 9|| varaho rakshatu jale vishameshu ca vamanah | atavyam narasimhashca sarvatah
    patu keshavah || 10|| hiranyagarbho bhagavanhiranyam me prayacchatu | sankhyacaryastu kapilo dhatusamyam
    karotu me || 11|| shvetadvipanivasi ca shvetadvipam nayatvajah | sarvansudayatam shatrunmadhukaitabhamardanah
    || 12|| sudanah sadakarshatu vishnushca kilbisham mama vigrahat | hamso matsyastatha kurmah patu mam
    sarvato disham || 13|| trivikramastu me devah sarvapapani krintatu | sarvapapannigrihnatu tatha narayano
    devo buddhim palayatam mama || 14|| shesho me nirmalam jnanam karotvajnananashanam | vadavamukho nashayatam
    kalmasham yatkritam maya || 15|| padbhyam dadatu paramam sukham murdhni mama prabhuh | dattatreyah
    prakurutam saputrapashubandhavam || 16|| dattatreyah kalayatu sarvanarinnashayatu ramah parashuna
    mama | rakshoghnastu dasharathih patu nityam mahabhujah || 17|| shatrunhalena me hanyadramo yadavanandanah
    | pralambakeshicanuraputanakamsanashanah | krishnasya yo balabhavah sa me kamanprayacchatu || 18||
    andhakaratamoghoram purusham krishnapingalam | pashyami bhayasantrastah pashahastamivantakam || 19||
    tato'ham pundarikakshamacyutam sharanam gatah | dhanyo'ham nirbhayo nityam yasya me bhagavanharih
    || 20|| dhyatva narayanam devam sarvopadravanashanam | vaishnavam kavacam baddhva vicarami mahitale
    || 21|| apradhrishyo'smi bhutanam sarvadevamayo hyaham | smaranaddevadevasya vishnoramitatejasah ||
    22|| siddhirbhavatu me nityam yatha mantramudahritam | yo mam pashyati cakshurbhyam yancah pashyami
    cakshusha | sarvesham papadushtanam vishnurbadhnatu cakshushi || 23|| vasudevasya yaccakram tasya
    cakrasya ye tvarah | te hi chindantu papanme mama himsantu himsakan || 24|| papani rakshaseshu pishaceshu
    kantareshvatavishu ca | vivade rajamargeshu dyuteshu kalaheshu ca || 25|| nadisantarane ghore samprapte
    pranasamshaye | agnicauranipateshu sarvagrahanivarane || 26|| vidyutsarpavishodvege roge vai vighnasankate
    | japyametajjapennityam sharire bhayamagate || 27|| ayam bhagavato mantro mantranam paramo mahan |
    vikhyatam kavacam guhyam sarpapapapranashanam | svamayakritinirmanam kalpantagahanam mahat || 28||
    om anadyanta jagadbija padmanabha namo'stu te | om kalaya svaha | om kalapurushaya svaha | om krishnaya
    svaha | om krishnarupaya svaha | om candaya svaha | om candarupaya svaha | om pracandaya svaha | om
    pracandarupaya svaha | om sarvaya svaha | om sarvarupaya svaha | om namo bhuvaneshaya trilokadhatre
    iha viti siviti siviti svaha | om namah ayokhetaye ye ye samjnapaya
  devanagari: सर्वव्याधिहर अथवा रोगनाशनवैष्णवकवचम् हरिरुवाच । सर्वव्याधिहरं वक्ष्ये वैष्णवं कवचं शुभम्
    । येन रक्षा कृता शम्भोर्दैत्यान्क्षपयतः पुरा ॥ १॥ शम्भोर्नात्र कार्या विचारणा प्रणम्य देवमीशानमजं
    नित्यमनामयम् । देवं सर्वेश्वरं विष्णुं सर्वव्यापिनमव्ययम् ॥ २॥ बध्नाम्यहं प्रतिसरं नमस्कृत्य जनार्दनम्
    । प्रतीकारं अमोघाप्रतिमं सर्वं सर्वदुःखनिवारणम् ॥ ३॥ विष्णुर्मामग्रतः पातु कृष्णो रक्षतु पृष्ठतः ।
    हरिर्मे रक्षतु शिरो हृदयञ्च जनार्दनः ॥ ४॥ मनो मम हृषीकेशो जिह्वां रक्षतु केशवः । प्रातु नेत्रे वासुदेवः
    श्रोत्रे सङ्कर्षणो विभुः ॥ ५॥ प्रद्युम्नः पातु मे घ्राणमनिरुद्धस्तु चर्म च । वनमाली गलस्यान्तं श्रीवत्सो
    रक्षतामधः ॥ ६॥ पार्श्वं रक्षतु मे चक्रं वामं दैत्यनिवारणम् । दक्षिणन्तु गदादेवी सर्वासुरनिवारिणी ॥
    ७॥ उदरं मुसलं पातु पृष्ठं मे पातु लाङ्गलम् । ऊर्ध्वं रक्षतु मे शार्ङ्गं जङ्घे रक्षतु नन्दकः ॥ ८॥ पार्ष्णी
    रक्षतु शङ्खश्च पद्मं मे चरणावुभौ । सर्वकार्यार्थसिद्ध्यर्थं पातु मां गरुडः सदा ॥ ९॥ वराहो रक्षतु जले
    विषमेषु च वामनः । अटव्यां नारसिंहश्च सर्वतः पातु केशवः ॥ १०॥ हिरण्यगर्भो भगवान्हिरण्यं मे प्रयच्छतु
    । साङ्ख्याचार्यस्तु कपिलो धातुसाम्यं करोतु मे ॥ ११॥ श्वेतद्वीपनिवासी च श्वेतद्वीपं नयत्वजः । सर्वान्सूदयतां
    शत्रून्मधुकैटभमर्दनः ॥ १२॥ सूदनः सदाकर्षतु विष्णुश्च किल्बिषं मम विग्रहात् । हंसो मत्स्यस्तथा कूर्मः
    पातु मां सर्वतो दिशम् ॥ १३॥ त्रिविक्रमस्तु मे देवः सर्वपापानि कृन्ततु । सर्वपापान्निगृह्णतु तथा नारायणो
    देवो बुद्धिं पालयतां मम ॥ १४॥ शेषो मे निर्मलं ज्ञानं करोत्वज्ञाननाशनम् । वडवामुखो नाशयतां कल्मषं यत्कृतं
    मया ॥ १५॥ पद्भ्यां ददातु परमं सुखं मूर्ध्नि मम प्रभुः । दत्तात्रेयः प्रकुरुतां सपुत्रपशुबान्धवम् ॥
    १६॥ दत्तात्रेयः कलयतु सर्वानरीन्नाशयतु रामः परशुना मम । रक्षोघ्नस्तु दशरथिः पातु नित्यं महाभुजः ॥
    १७॥ शत्रून्हलेन मे हन्याद्रमो यादवनन्दनः । प्रलम्बकेशिचाणूरपूतनाकंसनाशनः । कृष्णस्य यो बालभावः स मे
    कामान्प्रयच्छतु ॥ १८॥ अन्धकारतमोघोरं पुरुषं कृष्णपिङ्गलम् । पश्यामि भयसन्त्रस्तः पाशहस्तमिवान्तकम्
    ॥ १९॥ ततोऽहं पुण्डरीकाक्षमच्युतं शरणं गतः । धन्योऽहं निर्भयो नित्यं यस्य मे भगवान्हरिः ॥ २०॥ ध्यात्वा
    नारायणं देवं सर्वोपद्रवनाशनम् । वैष्णवं कवचं बद्ध्वा विचरामि महीतले ॥ २१॥ अप्रधृष्योऽस्मि भूतानां
    सर्वदेवमयो ह्यहम् । स्मरणाद्देवदेवस्य विष्णोरमिततेजसः ॥ २२॥ सिद्धिर्भवतु मे नित्यं यथा मन्त्रमुदाहृतम्
    । यो मां पश्यति चक्षुर्भ्यां यञ्चः पश्यामि चक्षुषा । सर्वेषां पापदुष्टानां विष्णुर्बध्नातु चक्षुषी
    ॥ २३॥ वासुदेवस्य यच्चक्रं तस्य चक्रस्य ये त्वराः । ते हि छिन्दन्तु पापान्मे मम हिंसन्तु हिंसकान् ॥
    २४॥ पापानि राक्षसेषु पिशाचेषु कान्तारेष्वटवीषु च । विवादे राजमार्गेषु द्यूतेषु कलहेषु च ॥ २५॥ नदीसन्तारणे
    घोरे सम्प्राप्ते प्राणसंशये । अग्निचौरनिपातेषु सर्वग्रहनिवारणे ॥ २६॥ विद्युत्सर्पविषोद्वेगे रोगे वै
    विघ्नसङ्कटे । जप्यमेतज्जपेन्नित्यं शरीरे भयमागते ॥ २७॥ अयं भगवतो मन्त्रो मन्त्राणां परमो महान् । विख्यातं
    कवचं गुह्यं सर्पपापप्रणाशनम् । स्वमायाकृतिनिर्माणं कल्पान्तगहनं महत् ॥ २८॥ ॐ अनाद्यन्त जगद्बीज पद्मनाभ
    नमोऽस्तु ते । ॐ कालाय स्वाहा । ॐ कालपुरुषाय स्वाहा । ॐ कृष्णाय स्वाहा । ॐ कृष्णरूपाय स्वाहा । ॐ चण्डाय
    स्वाहा । ॐ चण्डरूपाय स्वाहा । ॐ प्रचण्डाय स्वाहा । ॐ प्रचण्डरूपाय स्वाहा । ॐ सर्वाय स्वाहा । ॐ सर्वरूपाय
    स्वाहा । ॐ नमो भुवनेशाय त्रिलोकधात्रे इह विटि सिविटि सिविटि स्वाहा । ॐ नमः अयोखेतये ये ये संज्ञापय
