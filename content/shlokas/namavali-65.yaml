id: namavali-65
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: shrishivasahasranamavali om shri ganeshaya namah | om asya shrishivasahasranamastotramahamantrasya
    shambhurrishih | anushtup chandah | paramatma shrisadashivo devata | maheshvara iti bijam | gauri
    shaktih | mahesha eva samsevyah sarvairiti kilakam | shrisambasadashiva prityarthe mukhyasahasranamajape
    viniyogah | || dhyanam || shantam padmasanastham shashidharamakutam pancavaktram trinetram shulam
    vajram ca khadgam parashumabhayadam dakshabhage vahantam | nagam pasham ca ghantam varadamaruyutam
    cankusham vamabhage nanalankarayuktam sphatikamaninibham parvatisham namami || om namo bhagavate rudraya
    | atha shri shiva sahasra namavalih | 1
  devanagari: श्रीशिवसहस्रनामावली ॐ श्री गणेशाय नमः । ॐ अस्य श्रीशिवसहस्रनामस्तोत्रमहामन्त्रस्य शम्भुरृषिः
    । अनुष्टुप् छन्दः । परमात्मा श्रीसदाशिवो देवता । महेश्वर इति बीजम् । गौरी शक्तिः । महेश एव संसेव्यः
    सर्वैरिति कीलकम् । श्रीसाम्बसदाशिव प्रीत्यर्थे मुख्यसहस्रनामजपे विनियोगः । ॥ ध्यानम् ॥ शान्तं पद्मासनस्थं
    शशिधरमकुटं पञ्चवक्त्रं त्रिनेत्रं शूलं वज्रं च खड्गं परशुमभयदं दक्षभागे वहन्तम् । नागं पाशं च घण्टां
    वरडमरुयुतं चाङ्कुशं वामभागे नानालङ्कारयुक्तं स्फटिकमणिनिभं पार्वतीशं नमामि ॥ ॐ नमो भगवते रुद्राय ।
    अथ श्री शिव सहस्र नामावलिः । १
meaning: {}
