    दीन्ह अस्त रबि जानी। पुनि तापस बोलेउ मृदु बानी ॥ को तुम्ह कस बन फिरहु अकेलें। सुन्दर जुबा जीव परहेलेम्
    ॥ चक्रबर्ति के लच्छन तोरें। देखत दया लागि अति मोरेम् ॥ नाम प्रतापभानु अवनीसा। तासु सचिव मैं सुनहु
