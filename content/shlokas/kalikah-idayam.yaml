id: kalikah-idayam
category: hridaya
name:
  english: kalikahṟidayam
  devanagari: कालिकाह्ऱिदयम्
content:
  english: rinu param devyah sarvarthasiddhidayakam | gopyam gopyataram gopyam gopyam gopyataram mahat
    || 10|| trikonam pancakam cashtakamalam bhupuranvitam | mundapanktim ca jvalam ca kaliyantram susiddhidam
    || 11|| mantram tu purvakathitam dharayasva sada priye | devya dakshinakalyastu namamalam nishamaya
    || 12|| kali dakshinakali ca krishnarupa paratmika | mundamala vishalakshi srishtisamharakarika ||
    13 || sthitirupa mahamaya yoganidra bhagatmika | bhagasarpihpanarata bhagodyota bhagangaja || 14 ||
    adya sada nava ghora mahatejah karalika | pretavaha siddhilakshmiraniruddha sarasvati || 15|| etani
    namamalyani ye pathanti dine dine | tesham dasasya daso'ham satyam satyam maheshvari || 16|| om kalim
    kalaharam devi kankalabijarupinim | kalarupam kalatitam kalikam dakshinam bhaje || 17|| kundagolapriyam
    devim khayambhukusume ratam | ratipriyam maharaudrim kalikam pranamamyaham || 18|| dutipriyam mahadutim
    dutiyogeshvarim param | dutoyogodbhavaratam dutirupam namamyaham || 19|| krimmantrena jalam japtva
    saptadha secanena tu | sarve roga vinashyanti natra karya vicarana || 20|| krimsvahantairmahamantraishcandanam
    sadhayettatah | tilakam kriyate prajnairloko vashyo bhavetsada || 21|| krim hum hrim mantrajaptaishca
    hyakshataih saptabhih priye | mahabhayavinashashca jayate natra samshayah || 22|| krim hrim hrum svaha
    mantrena shmashanagnim ca mantrayet | shatrorgrihe pratikshiptva shatrormrityurbhavishyati || 23||
    hrum hrim krim caiva uccate pushpam samshodhya saptadha | ripunam caiva coccatam nayatyeva na samshayah
    || 24|| akarshane ca krim krim krim japtva'kshatan pratikshipet | sahasrayojanastha ca shighramagacchati
    priye || 25|| krim krim krim hrum hrum hrim hrim ca kajjalam shodhitam tatha | tilakena jaganmohah
    saptadha mantramacaret || 26|| hridayam parameshani sarvapapaharam param | ashvamedhadiyajnanam kotikotigunottaram
    || 27|| kanyadanadidananam kotikotigunam phalam | dutiyagadiyaganam kotikotiphalam smritam || 28||
    gangadisarvatirthanam phalam kotigunam smritam | ekadha pathamatrena satyam satyam mayoditam || 29||
    kaumarisveshtarupena pujam kritva vidhanatah | pathetstotram maheshani jivanmuktah sa ucyate || 30||
    rajasvalabhagam drishtva pathedekagramanasah | labhate paramam sthanam deviloke varanane || 31|| mahaduhkhe
    maharoge mahasankatake dine | mahabhaye mahaghore pathetastotram mahottamam | satyam satyam punah
    satyam gopayenmatrijaravat || 32|| iti kalirahasye shrikalihridayam samaptam || dakshinakalikahridayam
    ca
  devanagari: ृणु परं देव्याः सर्वार्थसिद्धिदायकम् । गोप्यं गोप्यतरं गोप्यं गोप्यं गोप्यतरं महत् ॥ १०॥
    त्रिकोणं पञ्चकं चाष्टकमलं भूपुरान्वितम् । मुण्डपङ्क्तिं च ज्वालां च कालीयन्त्रं सुसिद्धिदम् ॥ ११॥
    मन्त्रं तु पूर्वकथितं धारयस्व सदा प्रिये । देव्या दक्षिणकाल्यास्तु नाममालां निशामय ॥ १२॥ काली दक्षिणकाली
    च कृष्णरूपा परात्मिका । मुण्डमाला विशालाक्षी सृष्टिसंहारकारिका ॥ १३ ॥ स्थितिरूपा महामाया योगनिद्रा
    भगात्मिका । भगसर्पिःपानरता भगोद्योता भगाङ्गजा ॥ १४ ॥ आद्या सदा नवा घोरा महातेजाः करालिका । प्रेतवाहा
    सिद्धिलक्ष्मीरनिरुद्धा सरस्वती ॥ १५॥ एतानि नाममाल्यानि ये पठन्ति दिने दिने । तेषां दासस्य दासोऽहं
    सत्यं सत्यं महेश्वरि ॥ १६॥ ॐ कालीं कालहरां देवी कङ्कालबीजरूपिणीम् । कालरूपां कलातीतां कालिकां दक्षिणां
    भजे ॥ १७॥ कुण्डगोलप्रियां देवीं खयम्भूकुसुमे रताम् । रतिप्रियां महारौद्रीं कालिकां प्रणमाम्यहम् ॥
    १८॥ दूतीप्रियां महादूतीं दूतीयोगेश्वरीं पराम् । दूतोयोगोद्भवरतां दूतीरूपां नमाम्यहम् ॥ १९॥ क्रींमन्त्रेण
    जलं जप्त्वा सप्तधा सेचनेन तु । सर्वे रोगा विनश्यन्ति नात्र कार्या विचारणा ॥ २०॥ क्रींस्वाहान्तैर्महामन्त्रैश्चन्दनं
    साधयेत्ततः । तिलकं क्रियते प्राज्ञैर्लोको वश्यो भवेत्सदा ॥ २१॥ क्रीं हूं ह्रीं मन्त्रजप्तैश्च ह्यक्षतैः
    सप्तभिः प्रिये । महाभयविनाशश्च जायते नात्र संशयः ॥ २२॥ क्रीं ह्रीं ह्रूं स्वाहा मन्त्रेण श्मशानाग्निं
    च मन्त्रयेत् । शत्रोर्गृहे प्रतिक्षिप्त्वा शत्रोर्मृत्युर्भविष्यति ॥ २३॥ ह्रूं ह्रीं क्रीं चैव उच्चाटे
    पुष्पं संशोध्य सप्तधा । रिपूणां चैव चोच्चाटं नयत्येव न संशयः ॥ २४॥ आकर्षणे च क्रीं क्रीं क्रीं जप्त्वाऽक्षतान्
    प्रतिक्षिपेत् । सहस्रयोजनस्था च शीघ्रमागच्छति प्रिये ॥ २५॥ क्रीं क्रीं क्रीं ह्रूं ह्रूं ह्रीं ह्रीं
    च कज्जलं शोधितं तथा । तिलकेन जगन्मोहः सप्तधा मन्त्रमाचरेत् ॥ २६॥ हृदयं परमेशानि सर्वपापहरं परम् ।
    अश्वमेधादियज्ञानां कोटिकोटिगुणोत्तरम् ॥ २७॥ कन्यादानादिदानानां कोटिकोटिगुणं फलम् । दूतीयागादियागानां
    कोटिकोटिफलं स्मृतम् ॥ २८॥ गङ्गादिसर्वतीर्थानां फलं कोटिगुणं स्मृतम् । एकधा पाठमात्रेण सत्यं सत्यं
    मयोदितम् ॥ २९॥ कौमारीस्वेष्टरूपेण पूजां कृत्वा विधानतः । पठेत्स्तोत्रं महेशानि जीवन्मुक्तः स उच्यते
    ॥ ३०॥ रजस्वलाभगं दृष्ट्वा पठेदेकाग्रमानसः । लभते परमं स्थानं देवीलोके वरानने ॥ ३१॥ महादुःखे महारोगे
    महासङ्कटके दिने । महाभये महाघोरे पठेतस्तोत्रं महोत्तमम् । सत्यं सत्यं पुनः सत्यं गोपायेन्मातृजारवत्
    ॥ ३२॥ इति कालीरहस्ये श्रीकालीहृदयं समाप्तम् ॥ दक्षिणकालिकाहृदयं च
