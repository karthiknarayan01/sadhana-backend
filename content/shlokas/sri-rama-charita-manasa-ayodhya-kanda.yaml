    अनुसासन पाइ। मातु नहानीं जानि सब डेरा चले लवाइ ॥ ॥ जहँ तहँ लोगन्ह डेरा कीन्हा। भरत सोधु सबही कर लीन्हा
    ॥ सुर सेवा करि आयसु पाई। राम मातु पहिं गे दौ भाई ॥ चरन चाँपि कहि कहि मृदु बानी। जननीं सकल भरत सनमानी
    ॥ भाइहि सौम्पि मातु सेवकाई। आपु निषादहि लीन्ह बोलाई ॥ चले सखा कर सों कर जोरें। सिथिल सरीर सनेह न थोरेम्
    ॥ पूँछत सखहि सो ठाउँ देख् । नेकु नयन मन जरनि जुड़ ॥ जहँ सिय रामु लखनु निसि सोए। कहत भरे जल लोचन कोए
    ॥ भरत बचन सुनि भयु बिषादू। तुरत तहाँ लि गयु निषादू ॥ दो जहँ सिंसुपा पुनीत तर रघुबर किय बिश्रामु। अति
    सनेहँ सादर भरत कीन्हेउ दण्ड प्रनामु ॥ निहारि सुहाई। कीन्ह प्रनामु प्रदच्छिन जाई ॥ चरन रेख रज आँखिन्ह
    लाई। बनि न कहत प्रीति अधिकाई ॥ कनक बिन्दु दुइ चारिक देखे। राखे सीस सीय सम लेखे ॥ सजल बिलोचन हृदयँ
    गलानी। कहत सखा सन बचन सुबानी ॥ श्रीहत सीय बिरहँ दुतिहीना। जथा अवध नर नारि बिलीना ॥ पिता जनक देउँ पटतर
    केही। करतल भोगु जोगु जग जेही ॥ ससुर भानुकुल भानु भुआलू। जेहि सिहात अमरावतिपालू ॥ प्राननाथु रघुनाथ
    गोसाई। जो बड़ होत सो राम बड़आई ॥ दो पति देवता सुतीय मनि सीय साँथरी देखि। बिहरत ह्रदु न हहरि हर पबि
    तें कठिन बिसेषि ॥ ॥ लालन जोगु लखन लघु लोने। भे न भाइ अस अहहिं न होने ॥ पुरजन प्रिय पितु मातु दुलारे।
    सिय रघुबरहि प्रानपिआरे ॥ मृदु मूरति सुकुमार सुभ् । तात बाउ तन लाग न क् ॥ ते बन सहहिं बिपति सब भाँती।
    निदरे कोटि कुलिस एहिं छाती ॥ राम जनमि जगु कीन्ह उजागर। रूप सील सुख सब गुन सागर ॥ पुरजन परिजन गुर पितु
    माता। राम सुभाउ सबहि सुखदाता ॥ बैरिउ राम बड़आई करहीं। बोलनि मिलनि बिनय मन हरहीम् ॥ सारद कोटि कोटि
    सत सेषा। करि न सकहिं प्रभु गुन गन लेखा ॥ दो सुखस्वरुप रघुबंसमनि मङ्गल मोद निधान। ते सोवत कुस डासि
    महि बिधि गति अति बलवान ॥ ॥ राम सुना दुखु कान न क् । जीवनतरु जिमि जोगवि र् ॥ पलक नयन फनि मनि जेहि भाँती।
    जोगवहिं जननि सकल दिन राती ॥ ते अब फिरत बिपिन पदचारी। कन्द मूल फल फूल अहारी ॥ धिग कैकेई अमङ्गल मूला।
    भिसि प्रान प्रियतम प्रतिकूला ॥ मैं धिग धिग अघ उदधि अभागी। सबु उतपातु भयु जेहि लागी ॥ कुल कलङ्कु करि
    सृजेउ बिधाताँ। साइँदोह मोहि कीन्ह कुमाताँ ॥ सुनि सप्रेम समुझाव निषादू। नाथ करिअ कत बादि बिषादू ॥ राम
    तुम्हहि प्रिय तुम्ह प्रिय रामहि। यह निरजोसु दोसु बिधि बामहि ॥ छं बिधि बाम की करनी कठिन जेंहिं मातु
    कीन्ही बावरी। तेहि राति पुनि पुनि करहिं प्रभु सादर सरहना रावरी ॥ तुलसी न तुम्ह सो राम प्रीतमु कहतु
    हौं सौहें किएँ। परिनाम मङ्गल जानि अपने आनिए धीरजु हिएँ ॥ सो अन्तरजामी रामु सकुच सप्रेम कृपायतन। चलिअ
    करिअ बिश्रामु यह बिचारि दृढ़ आनि मन ॥ ॥ सखा बचन सुनि उर धरि धीरा। बास चले सुमिरत रघुबीरा ॥ यह सुधि
    पाइ नगर नर नारी। चले बिलोकन आरत भारी ॥ परदखिना करि करहिं प्रनामा। देहिं कैकिहि खोरि निकामा ॥ भरी भरि
    बारि बिलोचन लेंहीं। बाम बिधाताहि दूषन देहीम् ॥ एक सराहहिं भरत सनेहू। कौ कह नृपति निबाहेउ नेहू ॥ निन्दहिं
    आपु सराहि निषादहि। को कहि सकि बिमोह बिषादहि ॥ एहि बिधि राति लोगु सबु जागा। भा भिनुसार गुदारा लागा
    ॥ गुरहि सुनावँ चढ़आइ सुहाईं। नीं नाव सब मातु चढ़आईम् ॥ दण्ड चारि महँ भा सबु पारा। उतरि भरत तब सबहि
    सँभारा ॥ दो प्रातक्रिया करि मातु पद बन्दि गुरहि सिरु नाइ। आगें किए निषाद गन दीन्हेउ कटकु चलाइ ॥ ॥
    कियु निषादनाथु अगुआईं। मातु पालकीं सकल चलाईम् ॥ साथ बोलाइ भाइ लघु दीन्हा। बिप्रन्ह सहित गवनु गुर कीन्हा
    ॥ आपु सुरसरिहि कीन्ह प्रनामू। सुमिरे लखन सहित सिय रामू ॥ गवने भरत पयोदेहिं पाए। कोतल सङ्ग जाहिं डोरिआए
    ॥ कहहिं सुसेवक बारहिं बारा। होइअ नाथ अस्व असवारा ॥ रामु पयोदेहि पायँ सिधाए। हम कहँ रथ गज बाजि बनाए
    ॥ सिर भर जाउँ उचित अस मोरा। सब तें सेवक धरमु कठोरा ॥ देखि भरत गति सुनि मृदु बानी। सब सेवक गन गरहिं
    गलानी ॥ दो भरत तीसरे पहर कहँ कीन्ह प्रबेसु प्रयाग। कहत राम सिय राम सिय उमगि उमगि अनुराग ॥ ॥ झलका झलकत
    पायन्ह कैंसें। पङ्कज कोस ओस कन जैसेम् ॥ भरत पयादेहिं आए आजू। भयु दुखित सुनि सकल समाजू ॥ खबरि लीन्ह
    सब लोग नहाए। कीन्ह प्रनामु त्रिबेनिहिं आए ॥ सबिधि सितासित नीर नहाने। दिए दान महिसुर सनमाने ॥ देखत
    स्यामल धवल हलोरे। पुलकि सरीर भरत कर जोरे ॥ सकल काम प्रद तीरथर् । बेद बिदित जग प्रगट प्रभ् ॥ मागुँ
    भीख त्यागि निज धरमू। आरत काह न करि कुकरमू ॥ अस जियँ जानि सुजान सुदानी। सफल करहिं जग जाचक बानी ॥ दो
    अरथ न धरम न काम रुचि गति न चहुँ निरबान। जनम जनम रति राम पद यह बरदानु न आन ॥ ॥ जानहुँ रामु कुटिल करि
    मोही। लोग कहु गुर साहिब द्रोही ॥ सीता राम चरन रति मोरें। अनुदिन बढ़उ अनुग्रह तोरेम् ॥ जलदु जनम भरि
    सुरति बिसारु। जाचत जलु पबि पाहन डारु ॥ चातकु रटनि घटें घटि जाई। बढ़ए प्रेमु सब भाँति भलाई ॥ कनकहिं
    बान चढ़इ जिमि दाहें। तिमि प्रियतम पद नेम निबाहेम् ॥ भरत बचन सुनि माझ त्रिबेनी। भि मृदु बानि सुमङ्गल
    देनी ॥ तात भरत तुम्ह सब बिधि साधू। राम चरन अनुराग अगाधू ॥ बाद गलानि करहु मन माहीं। तुम्ह सम रामहि
    कौ प्रिय नाहीम् ॥ दो तनु पुलकेउ हियँ हरषु सुनि बेनि बचन अनुकूल। भरत धन्य कहि धन्य सुर हरषित बरषहिं
    फूल ॥ ॥ प्रमुदित तीरथराज निवासी। बैखानस बटु गृही उदासी ॥ कहहिं परसपर मिलि दस पाँचा। भरत सनेह सीलु
    सुचि साँचा ॥ सुनत राम गुन ग्राम सुहाए। भरद्वाज मुनिबर पहिं आए ॥ दण्ड प्रनामु करत मुनि देखे। मूरतिमन्त
    भाग्य निज लेखे ॥ धाइ उठाइ लाइ उर लीन्हे। दीन्हि असीस कृतारथ कीन्हे ॥ आसनु दीन्ह नाइ सिरु बैठे। चहत
    सकुच गृहँ जनु भजि पैठे ॥ मुनि पूँछब कछु यह बड़ सोचू। बोले रिषि लखि सीलु सँकोचू ॥ सुनहु भरत हम सब सुधि
    पाई। बिधि करतब पर किछु न बसाई ॥ दो तुम्ह गलानि जियँ जनि करहु समुझी मातु करतूति। तात कैकिहि दोसु नहिं
    गी गिरा मति धूति ॥ ॥ यहु कहत भल कहिहि न कोऊ। लोकु बेद बुध सम्मत दोऊ ॥ तात तुम्हार बिमल जसु गाई। पाइहि
    लोकु बेदु बड़आई ॥ लोक बेद सम्मत सबु कही। जेहि पितु देइ राजु सो लही ॥ राउ सत्यब्रत तुम्हहि बोलाई। देत
    राजु सुखु धरमु बड़आई ॥ राम गवनु बन अनरथ मूला। जो सुनि सकल बिस्व भि सूला ॥ सो भावी बस रानि अयानी। करि
    कुचालि अन्तहुँ पछितानी ॥ तहँउँ तुम्हार अलप अपराधू। कहै सो अधम अयान असाधू ॥ करतेहु राजु त तुम्हहि न
    दोषू। रामहि होत सुनत सन्तोषू ॥ दो अब अति कीन्हेहु भरत भल तुम्हहि उचित मत एहु। सकल सुमङ्गल मूल जग रघुबर
    चरन सनेहु ॥ ॥ सो तुम्हार धनु जीवनु प्राना। भूरिभाग को तुम्हहि समाना ॥ यह तम्हार आचरजु न ताता। दसरथ
    सुअन राम प्रिय भ्राता ॥ सुनहु भरत रघुबर मन माहीं। पेम पात्रु तुम्ह सम कौ नाहीम् ॥ लखन राम सीतहि अति
    प्रीती। निसि सब तुम्हहि सराहत बीती ॥ जाना मरमु नहात प्रयागा। मगन होहिं तुम्हरें अनुरागा ॥ तुम्ह पर
    अस सनेहु रघुबर कें। सुख जीवन जग जस जड़ नर केम् ॥ यह न अधिक रघुबीर बड़आई। प्रनत कुटुम्ब पाल रघुराई
    ॥ तुम्ह तौ भरत मोर मत एहू। धरें देह जनु राम सनेहू ॥ दो तुम्ह कहँ भरत कलङ्क यह हम सब कहँ उपदेसु। राम
    भगति रस सिद्धि हित भा यह समु गनेसु ॥ ॥ नव बिधु बिमल तात जसु तोरा। रघुबर किङ्कर कुमुद चकोरा ॥ उदित
    सदा अँथिहि कबहूँ ना। घटिहि न जग नभ दिन दिन दूना ॥ कोक तिलोक प्रीति अति करिही। प्रभु प्रताप रबि छबिहि
    न हरिही ॥ निसि दिन सुखद सदा सब काहू। ग्रसिहि न कैकि करतबु राहू ॥ पूरन राम सुपेम पियूषा। गुर अवमान
    दोष नहिं दूषा ॥ राम भगत अब अमिअँ अघाहूँ। कीन्हेहु सुलभ सुधा बसुधाहूँ ॥ भूप भगीरथ सुरसरि आनी। सुमिरत
    सकल सुम्मगल खानी ॥ दसरथ गुन गन बरनि न जाहीं। अधिकु कहा जेहि सम जग नाहीम् ॥ दो जासु सनेह सकोच बस राम
    प्रगट भे आइ ॥ जे हर हिय नयननि कबहुँ निरखे नहीं अघाइ ॥ ॥ कीरति बिधु तुम्ह कीन्ह अनूपा। जहँ बस राम पेम
    मृगरूपा ॥ तात गलानि करहु जियँ जाएँ। डरहु दरिद्रहि पारसु पाएँ ॥ ॥ सुनहु भरत हम झूठ न कहहीं। उदासीन
    तापस बन रहहीम् ॥ सब साधन कर सुफल सुहावा। लखन राम सिय दरसनु पावा ॥ तेहि फल कर फलु दरस तुम्हारा। सहित
    पयाग सुभाग हमारा ॥ भरत धन्य तुम्ह जसु जगु जयू। कहि अस पेम मगन पुनि भयू ॥ सुनि मुनि बचन सभासद हरषे।
    साधु सराहि सुमन सुर बरषे ॥ धन्य धन्य धुनि गगन पयागा। सुनि सुनि भरतु मगन अनुरागा ॥ दो पुलक गात हियँ
    रामु सिय सजल सरोरुह नैन। करि प्रनामु मुनि मण्डलिहि बोले गदगद बैन ॥ ॥ मुनि समाजु अरु तीरथराजू। साँचिहुँ
    सपथ अघाइ अकाजू ॥ एहिं थल जौं किछु कहिअ बनाई। एहि सम अधिक न अघ अधमाई ॥ तुम्ह सर्बग्य कहुँ सतिभ् । उर
    अन्तरजामी रघुर् ॥ मोहि न मातु करतब कर सोचू। नहिं दुखु जियँ जगु जानिहि पोचू ॥ नाहिन डरु बिगरिहि परलोकू।
    पितहु मरन कर मोहि न सोकू ॥ सुकृत सुजस भरि भुअन सुहाए। लछिमन राम सरिस सुत पाए ॥ राम बिरहँ तजि तनु छनभङ्गू।
    भूप सोच कर कवन प्रसङ्गू ॥ राम लखन सिय बिनु पग पनहीं। करि मुनि बेष फिरहिं बन बनही ॥ दो अजिन बसन फल
    असन महि सयन डासि कुस पात। बसि तरु तर नित सहत हिम आतप बरषा बात ॥ ॥ एहि दुख दाहँ दहि दिन छाती। भूख न
    बासर नीद न राती ॥ एहि कुरोग कर औषधु नाहीं। सोधेउँ सकल बिस्व मन माहीम् ॥ मातु कुमत बढ़ई अघ मूला। तेहिं
    हमार हित कीन्ह बँसूला ॥ कलि कुकाठ कर कीन्ह कुजन्त्रू। गाड़इ अवधि पढ़इ कठिन कुमन्त्रु ॥ मोहि लगि यहु
    कुठाटु तेहिं ठाटा। घालेसि सब जगु बारहबाटा ॥ मिटि कुजोगु राम फिरि आएँ। बसि अवध नहिं आन उपाएँ ॥ भरत
    बचन सुनि मुनि सुखु पाई। सबहिं कीन्ह बहु भाँति बड़आई ॥ तात करहु जनि सोचु बिसेषी। सब दुखु मिटहि राम
    पग देखी ॥ दो करि प्रबोध मुनिबर कहेउ अतिथि पेमप्रिय होहु। कन्द मूल फल फूल हम देहिं लेहु करि छोहु ॥
    ॥ सुनि मुनि बचन भरत हिँय सोचू। भयु कुअवसर कठिन सँकोचू ॥ जानि गरुइ गुर गिरा बहोरी। चरन बन्दि बोले कर
    जोरी ॥ सिर धरि आयसु करिअ तुम्हारा। परम धरम यहु नाथ हमारा ॥ भरत बचन मुनिबर मन भाए। सुचि सेवक सिष निकट
    बोलाए ॥ चाहिए कीन्ह भरत पहुनाई। कन्द मूल फल आनहु जाई ॥ भलेहीं नाथ कहि तिन्ह सिर नाए। प्रमुदित निज
    निज काज सिधाए ॥ मुनिहि सोच पाहुन बड़ नेवता। तसि पूजा चाहिअ जस देवता ॥ सुनि रिधि सिधि अनिमादिक आई।
