id: sudarshanastotram-3
category: stotram
name:
  english: sudarshanastotram 3
  devanagari: सुदर्शनस्तोत्रम् ३
content:
  english: '|| 4|| lokasya dvaramityetadvakyam tatraiva coditam | camu shu ceti yadvakyam tatroktamrici
    samni ca || 5|| maitravarunashakhayam pathyate sumahatmabhih | cakram bibhartityrigvede khile samyak
    prakirtitam || 6|| atharvanopanishadi hyebhirvayamiti smritam | rici paushkalashakhayam prativishno
    itiritam || 7|| dhritordhvapundramiti yadatha shakhoditam hi tat | dakshine tviti yadvakyam mahopanishadi
    sthitam || 8|| vashat iti ca yadvakyam kathavallyam tadiritam | tapaniye tu tam praptamiti mantramudahritam
    || 9|| yajnopavitityarabhya ye va shunyam ta ityapi | sudarshanopanishadi vedavidbhistu pathyate ||
    10|| tasmadbrahmanavakyam tu shvetashvataracoditam | tatropavitadi panca kathyate sumahatmabhih ||
    11|| katyayaneti hovacetyevam shatapatheritam | tatraiva kathitam cakram dvibhuje dharyamityapi ||
    12|| tatraiva dashaparyayaih kathitam cakradharanam | devasa iti vakyam ca tatraiva parikathyate ||
    13|| vivasvata iti hyetadvakyam tatraiva samsthitam | cakramadayeti vakyam sthitam yattadatharvane
    || 14|| tathaiva pancajanyam ca pathyate vedavittamaih | agnineti tatha vakyam tatraiva paripathyate
    || 15|| ityevam taptacakrasya dharanam shruticoditam | tasmat sarvaprayatnena dharyam mokshaphalepsubhih
    || 16|| brahmacari grihi vanaprastha ityashramaistatha | brahmanaih kshatriyairvaishyaih shudraishcapi
    tatha paraih || 17|| anulomairvilomaishca bhaktishraddhasamanvitaih | suvasinibhirnaribhirvidhavabhistathaiva
    ca || 18|| vishnoh sudarshanam dharyam vedavedantagocaram | iti saudarshanam stotramakarodramadeshikah
    || 19|| iti shrisudarshanastotram sampurnam |'
  devanagari: ॥ ४॥ लोकस्य द्वारमित्येतद्वाक्यं तत्रैव चोदितम् । चमू षु चेति यद्वाक्यं तत्रोक्तमृचि साम्नि
    च ॥ ५॥ मैत्रावरुणशाखायां पठ्यते सुमहात्मभिः । चक्रं बिभर्तीत्यृग्वेदे खिले सम्यक् प्रकीर्तितम् ॥ ६॥
    अथर्वणोपनिषदि ह्येभिर्वयमिति स्मृतम् । ऋचि पौष्कलशाखायां प्रतिविष्णो इतीरितम् ॥ ७॥ धृतोर्ध्वपुण्ड्रमिति
    यदथ शाखोदितं हि तत् । दक्षिणे त्विति यद्वाक्यं महोपनिषदि स्थितम् ॥ ८॥ वषट् इति च यद्वाक्यं कठवल्ल्यां
    तदीरितम् । तापनीये तु तं प्राप्तमिति मन्त्रमुदाहृतम् ॥ ९॥ यज्ञोपवीतीत्यारभ्य ये वा शून्यं त इत्यपि
    । सुदर्शनोपनिषदि वेदविद्भिस्तु पठ्यते ॥ १०॥ तस्माद्ब्राह्मणवाक्यं तु श्वेताश्वतरचोदितम् । तत्रोपवीतादि
    पञ्च कथ्यते सुमहात्मभिः ॥ ११॥ कात्यायनेति होवाचेत्येवं शतपथेरितम् । तत्रैव कथितं चक्रं द्विभुजे धार्यमित्यपि
    ॥ १२॥ तत्रैव दशपर्यायैः कथितं चक्रधारणम् । देवास इति वाक्यं च तत्रैव परिकथ्यते ॥ १३॥ विवस्वत इति ह्येतद्वाक्यं
    तत्रैव संस्थितम् । चक्रमादायेति वाक्यं स्थितं यत्तदथर्वणे ॥ १४॥ तथैव पाञ्चजन्यं च पठ्यते वेदवित्तमैः
    । अग्निनेति तथा वाक्यं तत्रैव परिपठ्यते ॥ १५॥ इत्येवं तप्तचक्रस्य धारणं श्रुतिचोदितम् । तस्मात् सर्वप्रयत्नेन
    धार्यं मोक्षफलेप्सुभिः ॥ १६॥ ब्रह्मचारी गृही वानप्रस्थ इत्याश्रमैस्तथा । ब्राह्मणैः क्षत्रियैर्वैश्यैः
    शूद्रैश्चापि तथा परैः ॥ १७॥ अनुलोमैर्विलोमैश्च भक्तिश्रद्धासमन्वितैः । सुवासिनीभिर्नारीभिर्विधवाभिस्तथैव
    च ॥ १८॥ विष्णोः सुदर्शनं धार्यं वेदवेदान्तगोचरम् । इति सौदर्शनं स्तोत्रमकरोद्रामदेशिकः ॥ १९॥ इति श्रीसुदर्शनस्तोत्रं
    सम्पूर्णम् ।
