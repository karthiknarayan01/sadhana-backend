id: dhaumyaproktamsuryashtottarashatanamastotram
category: stotram
name:
  english: dhaumyaproktamsuryashtottarashatanamastotram
  devanagari: धौम्यप्रोक्तंसूर्याष्टोत्तरशतनामस्तोत्रम्
content:
  english: rinushvavahito rajanshucirbhutva samahitah | kshanam ca kuru rajendra sarvam vakshyamyasheshatah
    || 16|| dhaumyena tu yatha proktam parthaya sumahatmane | namnamashtashatam punyam tacchrinushva mahamate
    || 17|| om suryo'ryama bhagastvashta pusharkah savita ravih | gabhastimanajah kalo mrityurdhata prabhakarah
    || 18|| prithivyapashca tejashca kham vayushca parayanam | somo brihaspatih shukro budho'ngaraka eva
    ca || 19|| indro vivasvandiptamshuh shucih shaurih shanaishcarah | brahma vishnushca rudrashca skando
    vaishravano yamah || 20|| vaidyuto jatharashcagniraindhanastejasam patih | dharmadhvajo vedakarta
    vedango vedavahanah || 21|| kritam treta dvaparashca kalih sarvamarashrayah | kala kashtha muhurtashca
    paksha masa ritustatha || 22|| samvatsarakaro'shvatthah kalacakro vibhavasuh | purushah shashvato
    yogi vyaktavyaktah sanatanah || 23|| lokadhyakshah prajadhyaksho vishvakarma tamonudah | varunah sagarom'shushca
    jimuto jivano'riha || 24|| bhutashrayo bhutapatih sarvabhutanishevitah | manih suvarno bhutadih kamadah
    sarvatomukhah || 25|| jayo vishalo varadah shighragah pranadharanah | dhanvantarirdhumaketuradidevo'diteh
    sutah || 26|| dvadashatmaravindakshah pita mata pitamahah | svargadvaram prajadvaram mokshadvaram
    trivishtapam || 27|| dehakarta prashantatma vishvatma vishvatomukhah | caracaratma sukshmatma maitrena
    vapushanvitah || 28|| etadvai kirtaniyasya suryasyaiva mahatmanah | namnamashtashatam punyam shakrenoktam
    mahatmana || 29|| iti mahabharate aranyaparvani 3 adhyayantargatam dhaumyaproktam suryashtottarashatanamastotram
    sampurnam | mahabharata | aranyaparva | adhyaya 3
  devanagari: ृणुष्वावहितो राजञ्शुचिर्भूत्वा समाहितः । क्षणं च कुरु राजेन्द्र सर्वं वक्ष्याम्यशेषतः ॥
    १६॥ धौम्येन तु यथा प्रोक्तं पार्थाय सुमहात्मने । नाम्नामष्टशतं पुण्यं तच्छृणुष्व महामते ॥ १७॥ ॐ सूर्योऽर्यमा
    भगस्त्वष्टा पूषार्कः सविता रविः । गभस्तिमानजः कालो मृत्युर्धाता प्रभाकरः ॥ १८॥ पृथिव्यापश्च तेजश्च
    खं वायुश्च परायणम् । सोमो बृहस्पतिः शुक्रो बुधोऽङ्गारक एव च ॥ १९॥ इन्द्रो विवस्वान्दीप्तांशुः शुचिः
    शौरिः शनैश्चरः । ब्रह्मा विष्णुश्च रुद्रश्च स्कन्दो वैश्रवणो यमः ॥ २०॥ वैद्युतो जाठरश्चाग्निरैन्धनस्तेजसां
    पतिः । धर्मध्वजो वेदकर्ता वेदाङ्गो वेदवाहनः ॥ २१॥ कृतं त्रेता द्वापरश्च कलिः सर्वामराश्रयः । कला काष्ठा
    मुहूर्ताश्च पक्षा मासा ऋतुस्तथा ॥ २२॥ संवत्सरकरोऽश्वत्थः कालचक्रो विभावसुः । पुरुषः शाश्वतो योगी व्यक्ताव्यक्तः
    सनातनः ॥ २३॥ लोकाध्यक्षः प्रजाध्यक्षो विश्वकर्मा तमोनुदः । वरुणः सागरोंऽशुश्च जीमूतो जीवनोऽरिहा ॥
    २४॥ भूताश्रयो भूतपतिः सर्वभूतनिषेवितः । मणिः सुवर्णो भूतादिः कामदः सर्वतोमुखः ॥ २५॥ जयो विशालो वरदः
    शीघ्रगः प्राणधारणः । धन्वन्तरिर्धूमकेतुरादिदेवोऽदितेः सुतः ॥ २६॥ द्वादशात्मारविन्दाक्षः पिता माता
    पितामहः । स्वर्गद्वारं प्रजाद्वारं मोक्षद्वारं त्रिविष्टपम् ॥ २७॥ देहकर्ता प्रशान्तात्मा विश्वात्मा
    विश्वतोमुखः । चराचरात्मा सूक्ष्मात्मा मैत्रेण वपुषान्वितः ॥ २८॥ एतद्वै कीर्तनीयस्य सूर्यस्यैव महात्मनः
    । नाम्नामष्टशतं पुण्यं शक्रेणोक्तं महात्मना ॥ २९॥ इति महाभारते आरण्यपर्वणि ३ अध्यायान्तर्गतं धौम्यप्रोक्तं
    सूर्याष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् । महाभारत । अरण्यपर्व । अध्याय ३
