id: surya-sahasra-nama-stotram
category: stotram
name:
  english: Surya Sahasra Nama Stotram
content:
  english: asya shri surya sahasranama stotrasya vedavyasa rishih anushtupchandah savita devata sarvabhishta
    siddhyarthe jape viniyogah | dhyanam | dhyeyah sada savitrimandalamadhyavarti narayanah sarasijasanasannivishtah
    | keyuravan makarakundalavan kiriti hari hiranmayavapurdhritashankhacakrah || stotram | om vishvavidvishvajitkarta
    vishvatma vishvatomukhah | vishveshvaro vishvayonirniyatatma jitendriyah || || kalashrayah kalakarta
    kalaha kalanashanah | mahayogi mahasiddhirmahatma sumahabalah || || prabhurvibhurbhutanatho bhutatma
    bhuvaneshvarah | bhutabhavyo bhavitatma bhutantahkaranam shivah || || sharanyah kamalanando nandano
    nandavardhanah | varenyo varado yogi susamyuktah prakashakah || || praptayanah parapranah putatma
    priyatah priyah | nayah sahasrapat sadhurdivyakundalamanditah || || avyangadhari dhiratma savita vayuvahanah
    | samahitamatirdata vidhata kritamangalah || || kapardi kalpapadrudrah sumana dharmavatsalah | samayukto
    vimuktatma kritatma kritinam varah || || avicintyavapuh shreshtho mahayogi maheshvarah | kantah kamariradityo
    niyatatma nirakulah || || kamah karunikah karta kamalakarabodhanah | saptasaptiracintyatma mahakarunikottamah
    || || sanjivano jivanatho jayo jivo jagatpatih | ayukto vishvanilayah samvibhagi vrishadhvajah ||
    || vrishakapih kalpakarta kalpantakarano ravih | ekacakraratho mauni suratho rathinam varah || ||
    sakrodhano rashmimali tejorashirvibhavasuh | divyakriddinakriddevo devadevo divaspatih || || dinanatho
    haro hota divyabahurdivakarah | yajno yajnapatih pusha svarnaretah paravarah || || paraparajnastaraniramshumali
    manoharah | prajnah prajnapatih suryah savita vishnuramshuman || || sadagatirgandhavaho vihito vidhirashugah
    | patangah patagah sthanurvihango vihago varah || || haryashvo haritashvashca haridashvo jagatpriyah
    | tryambakah sarvadamano bhavitatma bhishagvarah || || alokakrillokanatho lokalokanamaskritah | kalah
    kalpantako vahnistapanah sampratapanah || || vilocano virupakshah sahasrakshah purandarah | sahasrarashmirmihiro
    vividhambarabhushanah || || khagah pratardano dhanyo hayago vagvisharadah | shrimanashishiro vagmi
    shripatih shriniketanah || || shrikanthah shridharah shriman shrinivaso vasupradah | kamacari mahamayo
    mahogro'viditamayah || || tirthakriyavan sunayo vibhakto bhaktavatsalah | kirtih kirtikaro nityah
    kundali kavaci rathi || || hiranyaretah saptashvah prayatatma parantapah | buddhimanamarashreshtho
    rocishnuh pakashasanah || || samudro dhanado dhata mandhata kashmalapahah | tamoghno dhvantaha vahnirhota'ntahkarano
    guhah || || pashuman prayatanando bhuteshah shrimatam varah | nityo'dito nityarathah sureshah surapujitah
    || || ajito vijito jeta jangamasthavaratmakah | jivanando nityagami vijeta vijayapradah || || parjanyo'gnih
    sthitih stheyah sthaviro'tha niranjanah | pradyotano ratharudhah sarvalokaprakashakah || || dhruvo
    meshi mahaviryo hamsah samsaratarakah | srishtikarta kriyaheturmartando marutam patih || || marutvan
    dahanastvashta bhago bhargo'ryama kapih | varunesho jagannathah kritakrityah sulocanah || || vivasvan
    bhanuman karyah karanastejasam nidhih | asangagami tigmamshurdharmamshurdiptadidhitih || || sahasradidhitirbradhnah
    sahasramshurdivakarah | gabhastiman didhitiman sragvi manikuladyutih || || bhaskarah surakaryajnah
    sarvajnastikshnadidhitih | surajyeshthah surapatirbahujno vacasam patih || || tejonidhirbrihatteja
    brihatkirtirbrihaspatih | ahimanurjito dhimanamuktah kirtivardhanah || || mahavaidyo ganapatirdhanesho
    gananayakah | tivrapratapanastapi tapano vishvatapanah || || kartasvaro hrishikeshah padmanando'tinanditah
    | padmanabho'mritaharah sthitiman ketuman nabhah || || anadyanto'cyuto vishvo vishvamitro ghrinirvirat
    | amuktakavaco vagmi kancuki vishvabhavanah || || animittagatih shreshthah sharanyah sarvatomukhah
    | vigahi venurasahah samayuktah samakratuh || || dharmaketurdharmaratih samharta samyamo yamah | pranatartiharo
    vayuh siddhakaryo janeshvarah || || nabho vigahanah satyah savitatma manoharah | hari harirharo vayurrituh
    kalanaladyutih || || sukhasevyo mahateja jagatamekakaranam | mahendro vishtutah stotram stutihetuh
    prabhakarah || || sahasrakara ayushman aroshah sukhadah sukhi | vyadhiha sukhadah saukhyam kalyanah
    kalatam varah || || arogyakaranam siddhirriddhirvriddhirbrihaspatih | hiranyareta arogyam vidvan bradhno
    budho mahan || || pranavan dhritiman gharmo gharmakarta rucipradah | sarvapriyah sarvasahah sarvashatruvinashanah
    || || pramshurvidyotano dyotah sahasrakiranah kriti | keyuri bhushanodbhasi bhasito bhasano'nalah
    || || sharanyartiharo hota khadyotah khagasattamah | sarvadyoto bhavadyotah sarvadyutikaro matah ||
    || kalyanah kalyanakarah kalyah kalyakarah kavih | kalyanakrit kalyavapuh sarvakalyanabhajanam ||
    || shantipriyah prasannatma prashantah prashamapriyah | udarakarma sunayah suvarca varcasojjvalah
    || || varcasvi varcasamishastrailokyesho vashanugah | tejasvi suyasha varshmi varnadhyaksho balipriyah
    || || yashasvi tejonilayastejasvi prakritisthitah | akashagah shighragatirashugo gatiman khagah ||
    || gopatirgrahadevesho gomanekah prabhanjanah | janita prajano jivo dipah sarvaprakashakah || || sarvasakshi
    yoganityo nabhasvanasurantakah | rakshoghno vighnashamanah kiriti sumanahpriyah || || maricimali sumatih
    kritabhikhyavisheshakah | shishtacarah shubhacarah svacaracaratatparah || || mandaro matharo venuh
    kshudhapah kshmapatirguruh | suvishishto vishishtatma vidheyo jnanashobhanah || || mahashvetah priyo
    jneyah samago mokshadayakah | sarvavedapragitatma sarvavedalayo mahan || || vedamurtishcaturvedo vedabhridvedaparagah
    | kriyavanasito jishnurvariyamshurvarapradah || || vratacari vratadharo lokabandhuralankritah | alankaraksharo
    vedyo vidyavan viditashayah || || akaro bhushano bhushyo bhushnurbhuvanapujitah | cakrapanirdhvajadharah
    suresho lokavatsalah || || vagmipatirmahabahuh prakritirvikritirgunah | andhakarapahah shreshtho yugavarto
    yugadikrit || || aprameyah sadayogi nirahankara ishvarah | shubhapradah shubhah shasta shubhakarma
    shubhapradah || || satyavan shrutimanuccairnakaro vriddhido'nalah | balabhridbalado bandhurmatiman
    balinam varah || || anango nagarajendrah padmayonirganeshvarah | samvatsara riturneta kalacakrapravartakah
    || || padmekshanah padmayonih prabhavanamarah prabhuh | sumurtih sumatih somo govindo jagadadijah
    || || pitavasah krishnavasa digvasastvindriyatigah | atindriyo'nekarupah skandah parapuranjayah ||
    || shaktiman jaladhrigbhasvan mokshaheturayonijah | sarvadarshi jitadarsho duhsvapnashubhanashanah
    || || mangalyakarta taranirvegavan kashmalapahah | spashtaksharo mahamantro vishakho yajanapriyah
    || || vishvakarma mahashaktirdyutirisho vihangamah | vicakshano daksha indrah pratyushah priyadarshanah
    || || akhinno vedanilayo vedavidviditashayah | prabhakaro jitaripuh sujano'runasarathih || || kunashi
    suratah skando mahito'bhimato guruh | graharajo grahapatirgrahanakshatramandalah || || bhaskarah satatanando
    nandano naravahanah | mangalo'tha mangalavan mangalyo mangalavahah || || mangalyacarucaritah shirnah
    sarvavrato vrati | caturmukhah padmamali putatma pranatartiha || || akincanah satamisho nirguno gunavanchucih
    | sampurnah pundarikaksho vidheyo yogatatparah || || sahasramshuh kratumatih sarvajnah sumatih suvak
    | suvahano malyadama kritaharo haripriyah || || brahma pracetah prathitah prayatatma sthiratmakah
    | shatavinduh shatamukho gariyananalaprabhah || || dhiro mahattaro viprah puranapurushottamah | vidyarajadhirajo
    hi vidyavan bhutidah sthitah || || anirdeshyavapuh shriman vipapma bahumangalah | svahsthitah surathah
    svarno mokshado baliketanah || || nirdvandvo dvandvaha svargah sarvagah samprakashakah | dayaluh sukshmadhih
    kshantih kshemakshemasthitipriyah || || bhudharo bhupatirvakta pavitratma trilocanah | mahavarahah
    priyakriddata bhokta'bhayapradah || || cakravarti dhritikarah sampurno'tha maheshvarah | caturvedadharo'cintyo
    vinindyo vividhashanah || || vicitraratha ekaki saptasaptih paratparah | sarvodadhisthitikarah sthitistheyah
    sthitipriyah || || nishkalah pushkalo vibhurvasuman vasavapriyah | pashuman vasavasvami vasudhama
    vasupradah || || balavan jnanavamstattvamonkarastrishusamsthitah | sankalpayonirdinakridbhagavan karanapahah
    || || nilakantho dhanadhyakshashcaturvedapriyamvadah | vashatkarodgata hota svahakaro hutahutih ||
    || janardano jananando naro narayano'mbudah | sandehanashano vayurdhanvi suranamaskritah || || vigrahi
    vimalo vindurvishoko vimaladyutih | dyutiman dyotano vidyudvidyavan vidito bali || || gharmado himado
    hasah krishnavartma sutajitah | savitribhavito raja vishvamitro ghrinirvirat || || saptarcih saptaturagah
    saptalokanamaskritah | sampurno'tha jagannathah sumanah shobhanapriyah || || sarvatma sarvakrit srishtih
    saptiman saptamipriyah | sumedha medhiko medhyo medhavi madhusudanah || || angirahpatih kalajno dhumaketuh
    suketanah | sukhi sukhapradah saukhyah kantih kantipriyo munih || || santapanah santapana atapastapasam
    patih | umapatih sahasramshuh priyakari priyankarah || || pritirvimanyurambhotthah khanjano jagatam
    patih | jagatpita pritamanah sarvah kharvo guho'calah || || sarvago jagadanando jaganneta surariha
    | shreyah shreyaskaro jyayan mahanuttama udbhavah || || uttamo merumeyo'tha dharano dharanidharah
    | dharadhyaksho dharmarajo dharmadharmapravartakah || || rathadhyaksho rathagatistarunastanito'nalah
    | uttaro'nuttarastapi avakpatirapam patih || || punyasankirtanah punyo heturlokatrayashrayah | svarbhanurvigatanando
    vishishtotkrishtakarmakrit || || vyadhipranashanah kshemah shurah sarvajitam varah | ekaratho rathadhishah
    pita shanaishcarasya hi || || vaivasvatagururmrityurdharmanityo mahavratah | pralambaharasancari pradyoto
    dyotitanalah || || santapahrit paro mantro mantramurtirmahabalah | shreshthatma supriyah shambhurmarutamishvareshvarah
    || || samsaragativiccetta samsararnavatarakah | saptajihvah sahasrarci ratnagarbho'parajitah || ||
    dharmaketurameyatma dharmadharmavarapradah | lokasakshi lokagururlokeshashcandavahanah || || dharmayupo
    yupavriksho dhanushpanirdhanurdharah | pinakadhrinmahotsaho mahamayo mahashanah || || virah shaktimatam
    shreshthah sarvashastrabhritam varah | jnanagamyo duraradhyo lohitango vivardhanah || || khago'ndho
    dharmado nityo dharmakriccitravikramah | bhagavanatmavan mantrastryaksharo nilalohitah || || eko'nekastrayi
    kalah savita samitinjayah | sharngadhanva'nalo bhimah sarvapraharanayudhah || || sukarma parameshthi
    ca nakapali divisthitah | vadanyo vasukirvaidya atreyo'tha parakramah || || dvaparah paramodarah paramo
    brahmacaryavan | udicyavesho mukuti padmahasto himamshubhrit || || sitah prasannavadanah padmodaranibhananah
    | sayam diva divyavapuranirdeshyo mahalayah || || maharatho mahanishah sheshah sattvarajastamah |
    dhritatapatrapratimo vimarshi nirnayah sthitah || || ahimsakah shuddhamatiradvitiyo vivardhanah |
    sarvado dhanado moksho vihari bahudayakah || || caruratriharo natho bhagavan sarvago'vyayah | manoharavapuh
    shubhrah shobhanah suprabhavanah || || suprabhavah supratapah sunetro digvidikpatih | rajnipriyah
    shabdakaro graheshastimirapahah || || saimhikeyaripurdevo varado varanayakah | caturbhujo mahayogi
    yogishvarapatistatha || || anadirupo'ditijo ratnakantih prabhamayah | jagatpradipo vistirno mahavistirnamandalah
    || || ekacakrarathah svarnarathah svarnashariradhrik | niralambo gaganago dharmakarmaprabhavakrit
    || || dharmatma karmanam sakshi pratyakshah parameshvarah | merusevi sumedhavi merurakshakaro mahan
    || || adharabhuto ratimamstatha ca dhanadhanyakrit | papasantapaharta ca manovanchitadayakah || ||
    rogaharta rajyadayi ramaniyaguno'nrini | kalatrayanantarupo munivrindanamaskritah || || sandhyaragakarah
    siddhah sandhyavandanavanditah | samrajyadananiratah samaradhanatoshavan || || bhaktaduhkhakshayakaro
    bhavasagaratarakah | bhayapaharta bhagavanaprameyaparakramah | manusvami manupatirmanyo manvantaradhipah
    || || phalashrutih | etatte sarvamakhyatam yanmam tvam paripricchasi | namnam sahasram savituh parasharyo
    yadaha me || || dhanyam yashasyamayushyam duhkhaduhsvapnanashanam | bandhamokshakaram caiva bhanornamanukirtanat
    || || yastvidam shrinuyannityam pathedva prayato narah | akshayam sukhamannadyam bhavettasyopasadhitam
    || || nripagnitaskarabhayam vyadhito na bhayam bhavet | vijayi ca bhavennityamashrayam paramapnuyat
    || || kirtiman subhago vidvan sa sukhi priyadarshanah | jivedvarshashatayushca sarvavyadhivivarjitah
    || || namnam sahasramidamamshumatah pathedyah pratah shucirniyamavan susamriddhiyuktah | durena tam
    pariharanti sadaiva rogah bhutah suparnamiva sarvamahoragendrah || || iti shri bhavishyapurane saptamakalpe
    shribhagavatsuryasya sahasranamastotram sampurnam ||
  devanagari: अस्य श्री सूर्य सहस्रनाम स्तोत्रस्य वेदव्यास ऋषिः अनुष्टुप्छन्दः सविता देवता सर्वाभीष्ट
    सिद्ध्यर्थे जपे विनियोगः । ध्यानम् । ध्येयः सदा सवितृमण्डलमध्यवर्ती नारायणः सरसिजासनसन्निविष्टः ।
    केयूरवान् मकरकुण्डलवान् किरीटी हारी हिरण्मयवपुर्धृतशङ्खचक्रः ॥ स्तोत्रम् । ॐ विश्वविद्विश्वजित्कर्ता
    विश्वात्मा विश्वतोमुखः । विश्वेश्वरो विश्वयोनिर्नियतात्मा जितेन्द्रियः ॥ ॥ कालाश्रयः कालकर्ता कालहा
    कालनाशनः । महायोगी महासिद्धिर्महात्मा सुमहाबलः ॥ ॥ प्रभुर्विभुर्भूतनाथो भूतात्मा भुवनेश्वरः । भूतभव्यो
    भावितात्मा भूतान्तःकरणं शिवः ॥ ॥ शरण्यः कमलानन्दो नन्दनो नन्दवर्धनः । वरेण्यो वरदो योगी सुसंयुक्तः
    प्रकाशकः ॥ ॥ प्राप्तयानः परप्राणः पूतात्मा प्रियतः प्रियः । नयः सहस्रपात् साधुर्दिव्यकुण्डलमण्डितः
    ॥ ॥ अव्यङ्गधारी धीरात्मा सविता वायुवाहनः । समाहितमतिर्दाता विधाता कृतमङ्गलः ॥ ॥ कपर्दी कल्पपाद्रुद्रः
    सुमना धर्मवत्सलः । समायुक्तो विमुक्तात्मा कृतात्मा कृतिनां वरः ॥ ॥ अविचिन्त्यवपुः श्रेष्ठो महायोगी
    महेश्वरः । कान्तः कामारिरादित्यो नियतात्मा निराकुलः ॥ ॥ कामः कारुणिकः कर्ता कमलाकरबोधनः । सप्तसप्तिरचिन्त्यात्मा
    महाकारुणिकोत्तमः ॥ ॥ सञ्जीवनो जीवनाथो जयो जीवो जगत्पतिः । अयुक्तो विश्वनिलयः संविभागी वृषध्वजः ॥ ॥
    वृषाकपिः कल्पकर्ता कल्पान्तकरणो रविः । एकचक्ररथो मौनी सुरथो रथिनां वरः ॥ ॥ सक्रोधनो रश्मिमाली तेजोराशिर्विभावसुः
    । दिव्यकृद्दिनकृद्देवो देवदेवो दिवस्पतिः ॥ ॥ दीननाथो हरो होता दिव्यबाहुर्दिवाकरः । यज्ञो यज्ञपतिः
    पूषा स्वर्णरेताः परावरः ॥ ॥ परापरज्ञस्तरणिरंशुमाली मनोहरः । प्राज्ञः प्राज्ञपतिः सूर्यः सविता विष्णुरंशुमान्
    ॥ ॥ सदागतिर्गन्धवहो विहितो विधिराशुगः । पतङ्गः पतगः स्थाणुर्विहङ्गो विहगो वरः ॥ ॥ हर्यश्वो हरिताश्वश्च
    हरिदश्वो जगत्प्रियः । त्र्यम्बकः सर्वदमनो भावितात्मा भिषग्वरः ॥ ॥ आलोककृल्लोकनाथो लोकालोकनमस्कृतः
    । कालः कल्पान्तको वह्निस्तपनः सम्प्रतापनः ॥ ॥ विलोचनो विरूपाक्षः सहस्राक्षः पुरन्दरः । सहस्ररश्मिर्मिहिरो
    विविधाम्बरभूषणः ॥ ॥ खगः प्रतर्दनो धन्यो हयगो वाग्विशारदः । श्रीमानशिशिरो वाग्मी श्रीपतिः श्रीनिकेतनः
    ॥ ॥ श्रीकण्ठः श्रीधरः श्रीमान् श्रीनिवासो वसुप्रदः । कामचारी महामायो महोग्रोऽविदितामयः ॥ ॥ तीर्थक्रियावान्
    सुनयो विभक्तो भक्तवत्सलः । कीर्तिः कीर्तिकरो नित्यः कुण्डली कवची रथी ॥ ॥ हिरण्यरेताः सप्ताश्वः प्रयतात्मा
    परन्तपः । बुद्धिमानमरश्रेष्ठो रोचिष्णुः पाकशासनः ॥ ॥ समुद्रो धनदो धाता मान्धाता कश्मलापहः । तमोघ्नो
    ध्वान्तहा वह्निर्होताऽन्तःकरणो गुहः ॥ ॥ पशुमान् प्रयतानन्दो भूतेशः श्रीमतां वरः । नित्योऽदितो नित्यरथः
    सुरेशः सुरपूजितः ॥ ॥ अजितो विजितो जेता जङ्गमस्थावरात्मकः । जीवानन्दो नित्यगामी विजेता विजयप्रदः ॥
    ॥ पर्जन्योऽग्निः स्थितिः स्थेयः स्थविरोऽथ निरञ्जनः । प्रद्योतनो रथारूढः सर्वलोकप्रकाशकः ॥ ॥ ध्रुवो
    मेषी महावीर्यो हंसः संसारतारकः । सृष्टिकर्ता क्रियाहेतुर्मार्तण्डो मरुतां पतिः ॥ ॥ मरुत्वान् दहनस्त्वष्टा
    भगो भर्गोऽर्यमा कपिः । वरुणेशो जगन्नाथः कृतकृत्यः सुलोचनः ॥ ॥ विवस्वान् भानुमान् कार्यः कारणस्तेजसां
    निधिः । असङ्गगामी तिग्मांशुर्धर्मांशुर्दीप्तदीधितिः ॥ ॥ सहस्रदीधितिर्ब्रध्नः सहस्रांशुर्दिवाकरः ।
    गभस्तिमान् दीधितिमान् स्रग्वी मणिकुलद्युतिः ॥ ॥ भास्करः सुरकार्यज्ञः सर्वज्ञस्तीक्ष्णदीधितिः । सुरज्येष्ठः
    सुरपतिर्बहुज्ञो वचसां पतिः ॥ ॥ तेजोनिधिर्बृहत्तेजा बृहत्कीर्तिर्बृहस्पतिः । अहिमानूर्जितो धीमानामुक्तः
    कीर्तिवर्धनः ॥ ॥ महावैद्यो गणपतिर्धनेशो गणनायकः । तीव्रप्रतापनस्तापी तापनो विश्वतापनः ॥ ॥ कार्तस्वरो
    हृषीकेशः पद्मानन्दोऽतिनन्दितः । पद्मनाभोऽमृताहारः स्थितिमान् केतुमान् नभः ॥ ॥ अनाद्यन्तोऽच्युतो विश्वो
    विश्वामित्रो घृणिर्विराट् । आमुक्तकवचो वाग्मी कञ्चुकी विश्वभावनः ॥ ॥ अनिमित्तगतिः श्रेष्ठः शरण्यः
    सर्वतोमुखः । विगाही वेणुरसहः समायुक्तः समाक्रतुः ॥ ॥ धर्मकेतुर्धर्मरतिः संहर्ता संयमो यमः । प्रणतार्तिहरो
    वायुः सिद्धकार्यो जनेश्वरः ॥ ॥ नभो विगाहनः सत्यः सवितात्मा मनोहरः । हारी हरिर्हरो वायुरृतुः कालानलद्युतिः
    ॥ ॥ सुखसेव्यो महातेजा जगतामेककारणम् । महेन्द्रो विष्टुतः स्तोत्रं स्तुतिहेतुः प्रभाकरः ॥ ॥ सहस्रकर
    आयुष्मान् अरोषः सुखदः सुखी । व्याधिहा सुखदः सौख्यं कल्याणः कलतां वरः ॥ ॥ आरोग्यकारणं सिद्धिरृद्धिर्वृद्धिर्बृहस्पतिः
    । हिरण्यरेता आरोग्यं विद्वान् ब्रध्नो बुधो महान् ॥ ॥ प्राणवान् धृतिमान् घर्मो घर्मकर्ता रुचिप्रदः
    । सर्वप्रियः सर्वसहः सर्वशत्रुविनाशनः ॥ ॥ प्रांशुर्विद्योतनो द्योतः सहस्रकिरणः कृती । केयूरी भूषणोद्भासी
    भासितो भासनोऽनलः ॥ ॥ शरण्यार्तिहरो होता खद्योतः खगसत्तमः । सर्वद्योतो भवद्योतः सर्वद्युतिकरो मतः ॥
    ॥ कल्याणः कल्याणकरः कल्यः कल्यकरः कविः । कल्याणकृत् कल्यवपुः सर्वकल्याणभाजनम् ॥ ॥ शान्तिप्रियः प्रसन्नात्मा
    प्रशान्तः प्रशमप्रियः । उदारकर्मा सुनयः सुवर्चा वर्चसोज्ज्वलः ॥ ॥ वर्चस्वी वर्चसामीशस्त्रैलोक्येशो
    वशानुगः । तेजस्वी सुयशा वर्ष्मी वर्णाध्यक्षो बलिप्रियः ॥ ॥ यशस्वी तेजोनिलयस्तेजस्वी प्रकृतिस्थितः
    । आकाशगः शीघ्रगतिराशुगो गतिमान् खगः ॥ ॥ गोपतिर्ग्रहदेवेशो गोमानेकः प्रभञ्जनः । जनिता प्रजनो जीवो दीपः
    सर्वप्रकाशकः ॥ ॥ सर्वसाक्षी योगनित्यो नभस्वानसुरान्तकः । रक्षोघ्नो विघ्नशमनः किरीटी सुमनःप्रियः ॥
    ॥ मरीचिमाली सुमतिः कृताभिख्यविशेषकः । शिष्टाचारः शुभाचारः स्वचाराचारतत्परः ॥ ॥ मन्दारो माठरो वेणुः
    क्षुधापः क्ष्मापतिर्गुरुः । सुविशिष्टो विशिष्टात्मा विधेयो ज्ञानशोभनः ॥ ॥ महाश्वेतः प्रियो ज्ञेयः
    सामगो मोक्षदायकः । सर्ववेदप्रगीतात्मा सर्ववेदलयो महान् ॥ ॥ वेदमूर्तिश्चतुर्वेदो वेदभृद्वेदपारगः ।
    क्रियावानसितो जिष्णुर्वरीयांशुर्वरप्रदः ॥ ॥ व्रतचारी व्रतधरो लोकबन्धुरलङ्कृतः । अलङ्काराक्षरो वेद्यो
    विद्यावान् विदिताशयः ॥ ॥ आकारो भूषणो भूष्यो भूष्णुर्भुवनपूजितः । चक्रपाणिर्ध्वजधरः सुरेशो लोकवत्सलः
    ॥ ॥ वाग्मिपतिर्महाबाहुः प्रकृतिर्विकृतिर्गुणः । अन्धकारापहः श्रेष्ठो युगावर्तो युगादिकृत् ॥ ॥ अप्रमेयः
    सदायोगी निरहङ्कार ईश्वरः । शुभप्रदः शुभः शास्ता शुभकर्मा शुभप्रदः ॥ ॥ सत्यवान् श्रुतिमानुच्चैर्नकारो
    वृद्धिदोऽनलः । बलभृद्बलदो बन्धुर्मतिमान् बलिनां वरः ॥ ॥ अनङ्गो नागराजेन्द्रः पद्मयोनिर्गणेश्वरः ।
    संवत्सर ऋतुर्नेता कालचक्रप्रवर्तकः ॥ ॥ पद्मेक्षणः पद्मयोनिः प्रभावानमरः प्रभुः । सुमूर्तिः सुमतिः
    सोमो गोविन्दो जगदादिजः ॥ ॥ पीतवासाः कृष्णवासा दिग्वासास्त्विन्द्रियातिगः । अतीन्द्रियोऽनेकरूपः स्कन्दः
    परपुरञ्जयः ॥ ॥ शक्तिमान् जलधृग्भास्वान् मोक्षहेतुरयोनिजः । सर्वदर्शी जितादर्शो दुःस्वप्नाशुभनाशनः
    ॥ ॥ माङ्गल्यकर्ता तरणिर्वेगवान् कश्मलापहः । स्पष्टाक्षरो महामन्त्रो विशाखो यजनप्रियः ॥ ॥ विश्वकर्मा
    महाशक्तिर्द्युतिरीशो विहङ्गमः । विचक्षणो दक्ष इन्द्रः प्रत्यूषः प्रियदर्शनः ॥ ॥ अखिन्नो वेदनिलयो वेदविद्विदिताशयः
    । प्रभाकरो जितरिपुः सुजनोऽरुणसारथिः ॥ ॥ कुनाशी सुरतः स्कन्दो महितोऽभिमतो गुरुः । ग्रहराजो ग्रहपतिर्ग्रहनक्षत्रमण्डलः
    ॥ ॥ भास्करः सततानन्दो नन्दनो नरवाहनः । मङ्गलोऽथ मङ्गलवान् माङ्गल्यो मङ्गलावहः ॥ ॥ मङ्गल्यचारुचरितः
    शीर्णः सर्वव्रतो व्रती । चतुर्मुखः पद्ममाली पूतात्मा प्रणतार्तिहा ॥ ॥ अकिञ्चनः सतामीशो निर्गुणो गुणवाञ्छुचिः
    । सम्पूर्णः पुण्डरीकाक्षो विधेयो योगतत्परः ॥ ॥ सहस्रांशुः क्रतुमतिः सर्वज्ञः सुमतिः सुवाक् । सुवाहनो
    माल्यदामा कृताहारो हरिप्रियः ॥ ॥ ब्रह्मा प्रचेताः प्रथितः प्रयतात्मा स्थिरात्मकः । शतविन्दुः शतमुखो
    गरीयाननलप्रभः ॥ ॥ धीरो महत्तरो विप्रः पुराणपुरुषोत्तमः । विद्याराजाधिराजो हि विद्यावान् भूतिदः स्थितः
    ॥ ॥ अनिर्देश्यवपुः श्रीमान् विपाप्मा बहुमङ्गलः । स्वःस्थितः सुरथः स्वर्णो मोक्षदो बलिकेतनः ॥ ॥ निर्द्वन्द्वो
    द्वन्द्वहा स्वर्गः सर्वगः सम्प्रकाशकः । दयालुः सूक्ष्मधीः क्षान्तिः क्षेमाक्षेमस्थितिप्रियः ॥ ॥ भूधरो
    भूपतिर्वक्ता पवित्रात्मा त्रिलोचनः । महावराहः प्रियकृद्दाता भोक्ताऽभयप्रदः ॥ ॥ चक्रवर्ती धृतिकरः सम्पूर्णोऽथ
    महेश्वरः । चतुर्वेदधरोऽचिन्त्यो विनिन्द्यो विविधाशनः ॥ ॥ विचित्ररथ एकाकी सप्तसप्तिः परात्परः । सर्वोदधिस्थितिकरः
    स्थितिस्थेयः स्थितिप्रियः ॥ ॥ निष्कलः पुष्कलो विभुर्वसुमान् वासवप्रियः । पशुमान् वासवस्वामी वसुधामा
    वसुप्रदः ॥ ॥ बलवान् ज्ञानवांस्तत्त्वमोङ्कारस्त्रिषुसंस्थितः । सङ्कल्पयोनिर्दिनकृद्भगवान् कारणापहः
    ॥ ॥ नीलकण्ठो धनाध्यक्षश्चतुर्वेदप्रियंवदः । वषट्कारोद्गाता होता स्वाहाकारो हुताहुतिः ॥ ॥ जनार्दनो
    जनानन्दो नरो नारायणोऽम्बुदः । सन्देहनाशनो वायुर्धन्वी सुरनमस्कृतः ॥ ॥ विग्रही विमलो विन्दुर्विशोको
    विमलद्युतिः । द्युतिमान् द्योतनो विद्युद्विद्यावान् विदितो बली ॥ ॥ घर्मदो हिमदो हासः कृष्णवर्त्मा
    सुताजितः । सावित्रीभावितो राजा विश्वामित्रो घृणिर्विराट् ॥ ॥ सप्तार्चिः सप्ततुरगः सप्तलोकनमस्कृतः
    । सम्पूर्णोऽथ जगन्नाथः सुमनाः शोभनप्रियः ॥ ॥ सर्वात्मा सर्वकृत् सृष्टिः सप्तिमान् सप्तमीप्रियः । सुमेधा
    मेधिको मेध्यो मेधावी मधुसूदनः ॥ ॥ अङ्गिरःपतिः कालज्ञो धूमकेतुः सुकेतनः । सुखी सुखप्रदः सौख्यः कान्तिः
    कान्तिप्रियो मुनिः ॥ ॥ सन्तापनः सन्तपन आतपस्तपसां पतिः । उमापतिः सहस्रांशुः प्रियकारी प्रियङ्करः ॥
    ॥ प्रीतिर्विमन्युरम्भोत्थः खञ्जनो जगतां पतिः । जगत्पिता प्रीतमनाः सर्वः खर्वो गुहोऽचलः ॥ ॥ सर्वगो
    जगदानन्दो जगन्नेता सुरारिहा । श्रेयः श्रेयस्करो ज्यायान् महानुत्तम उद्भवः ॥ ॥ उत्तमो मेरुमेयोऽथ धरणो
    धरणीधरः । धराध्यक्षो धर्मराजो धर्माधर्मप्रवर्तकः ॥ ॥ रथाध्यक्षो रथगतिस्तरुणस्तनितोऽनलः । उत्तरोऽनुत्तरस्तापी
    अवाक्पतिरपां पतिः ॥ ॥ पुण्यसङ्कीर्तनः पुण्यो हेतुर्लोकत्रयाश्रयः । स्वर्भानुर्विगतानन्दो विशिष्टोत्कृष्टकर्मकृत्
    ॥ ॥ व्याधिप्रणाशनः क्षेमः शूरः सर्वजितां वरः । एकरथो रथाधीशः पिता शनैश्चरस्य हि ॥ ॥ वैवस्वतगुरुर्मृत्युर्धर्मनित्यो
    महाव्रतः । प्रलम्बहारसञ्चारी प्रद्योतो द्योतितानलः ॥ ॥ सन्तापहृत् परो मन्त्रो मन्त्रमूर्तिर्महाबलः
    । श्रेष्ठात्मा सुप्रियः शम्भुर्मरुतामीश्वरेश्वरः ॥ ॥ संसारगतिविच्चेत्ता संसारार्णवतारकः । सप्तजिह्वः
    सहस्रार्ची रत्नगर्भोऽपराजितः ॥ ॥ धर्मकेतुरमेयात्मा धर्माधर्मवरप्रदः । लोकसाक्षी लोकगुरुर्लोकेशश्चण्डवाहनः
    ॥ ॥ धर्मयूपो यूपवृक्षो धनुष्पाणिर्धनुर्धरः । पिनाकधृङ्महोत्साहो महामायो महाशनः ॥ ॥ वीरः शक्तिमतां
    श्रेष्ठः सर्वशस्त्रभृतां वरः । ज्ञानगम्यो दुराराध्यो लोहिताङ्गो विवर्धनः ॥ ॥ खगोऽन्धो धर्मदो नित्यो
    धर्मकृच्चित्रविक्रमः । भगवानात्मवान् मन्त्रस्त्र्यक्षरो नीललोहितः ॥ ॥ एकोऽनेकस्त्रयी कालः सविता समितिञ्जयः
    । शार्ङ्गधन्वाऽनलो भीमः सर्वप्रहरणायुधः ॥ ॥ सुकर्मा परमेष्ठी च नाकपाली दिविस्थितः । वदान्यो वासुकिर्वैद्य
    आत्रेयोऽथ पराक्रमः ॥ ॥ द्वापरः परमोदारः परमो ब्रह्मचर्यवान् । उदीच्यवेषो मुकुटी पद्महस्तो हिमांशुभृत्
    ॥ ॥ सितः प्रसन्नवदनः पद्मोदरनिभाननः । सायं दिवा दिव्यवपुरनिर्देश्यो महालयः ॥ ॥ महारथो महानीशः शेषः
    सत्त्वरजस्तमः । धृतातपत्रप्रतिमो विमर्षी निर्णयः स्थितः ॥ ॥ अहिंसकः शुद्धमतिरद्वितीयो विवर्धनः । सर्वदो
    धनदो मोक्षो विहारी बहुदायकः ॥ ॥ चारुरात्रिहरो नाथो भगवान् सर्वगोऽव्ययः । मनोहरवपुः शुभ्रः शोभनः सुप्रभावनः
    ॥ ॥ सुप्रभावः सुप्रतापः सुनेत्रो दिग्विदिक्पतिः । राज्ञीप्रियः शब्दकरो ग्रहेशस्तिमिरापहः ॥ ॥ सैंहिकेयरिपुर्देवो
    वरदो वरनायकः । चतुर्भुजो महायोगी योगीश्वरपतिस्तथा ॥ ॥ अनादिरूपोऽदितिजो रत्नकान्तिः प्रभामयः । जगत्प्रदीपो
    विस्तीर्णो महाविस्तीर्णमण्डलः ॥ ॥ एकचक्ररथः स्वर्णरथः स्वर्णशरीरधृक् । निरालम्बो गगनगो धर्मकर्मप्रभावकृत्
    ॥ ॥ धर्मात्मा कर्मणां साक्षी प्रत्यक्षः परमेश्वरः । मेरुसेवी सुमेधावी मेरुरक्षाकरो महान् ॥ ॥ आधारभूतो
    रतिमांस्तथा च धनधान्यकृत् । पापसन्तापहर्ता च मनोवाञ्छितदायकः ॥ ॥ रोगहर्ता राज्यदायी रमणीयगुणोऽनृणी
    । कालत्रयानन्तरूपो मुनिवृन्दनमस्कृतः ॥ ॥ सन्ध्यारागकरः सिद्धः सन्ध्यावन्दनवन्दितः । साम्राज्यदाननिरतः
    समाराधनतोषवान् ॥ ॥ भक्तदुःखक्षयकरो भवसागरतारकः । भयापहर्ता भगवानप्रमेयपराक्रमः । मनुस्वामी मनुपतिर्मान्यो
    मन्वन्तराधिपः ॥ ॥ फलश्रुतिः । एतत्ते सर्वमाख्यातं यन्मां त्वं परिपृच्छसि । नाम्नां सहस्रं सवितुः पराशर्यो
    यदाह मे ॥ ॥ धन्यं यशस्यमायुष्यं दुःखदुःस्वप्ननाशनम् । बन्धमोक्षकरं चैव भानोर्नामानुकीर्तनात् ॥ ॥ यस्त्विदं
    शृणुयान्नित्यं पठेद्वा प्रयतो नरः । अक्षयं सुखमन्नाद्यं भवेत्तस्योपसाधितम् ॥ ॥ नृपाग्नितस्करभयं व्याधितो
    न भयं भवेत् । विजयी च भवेन्नित्यमाश्रयं परमाप्नुयात् ॥ ॥ कीर्तिमान् सुभगो विद्वान् स सुखी प्रियदर्शनः
    । जीवेद्वर्षशतायुश्च सर्वव्याधिविवर्जितः ॥ ॥ नाम्नां सहस्रमिदमंशुमतः पठेद्यः प्रातः शुचिर्नियमवान्
    सुसमृद्धियुक्तः । दूरेण तं परिहरन्ति सदैव रोगाः भूताः सुपर्णमिव सर्वमहोरगेन्द्राः ॥ ॥ इति श्री भविष्यपुराणे
    सप्तमकल्पे श्रीभगवत्सूर्यस्य सहस्रनामस्तोत्रं सम्पूर्णम् ॥
