id: taittiriya-upanishad-shiksha-valli
category: stotram
name:
  english: Taittiriya Upanishad - Shiksha Valli
content:
  english: om shri gurubhyo namah | harih om || om sha nno bhavatvaryama | sha nna indro brihaspatih |
    sha nno vishnururukramah | namo brahmane | namaste vayo | tvameva pratyaksha mbrahmasi | tvameva pratyaksha
    mbrahma vadishyami | ritam va~dishyami | satyam va~dishyami | tanmamavatu | tadvaktaramavatu | avatu
    mam | avatu vaktaram khyasyamah | varnassvarah | matra balam | sama santanah | ityuktashshi 'nuvakah
    || saha nau yashah | saha nau brahmavarcasam | athatassagmhitaya upanishadam khyasyamah | pancasvadhikaraneshu
    | adhilokamadhijyautishamadhividyamadhiprajamadhyatmam | ta mahasagmhita ityacakshate | athadhilokam
    | prithivi pu rvarupam | dyauruttararupam | akashassandhih || || vayussandhanam | ityadhilokam | athadhijyautisham
    | agnih pu rvarupam | aditya uttararupam | apassandhih | vaidyutassandhanam | ityadhijyautisham |
    athadhividyam | acaryah pu || antevasyuttararupam | vidya sandhih | pravacanagm sandhanam | ityadhividyam
    | athadhiprajam | mata pu rvarupam | pitottararupam | praja sandhih | prajananagm sandhanam | ityadhiprajam
    || || athadhyatmam | adhara hanuh pu rvarupam | uttara hanuruttararupam | vaksandhih | jihva sandhanam
    | ityadhyatmam | itima mahasagmhitah | ya evameta mahasagmhita vyakhyata veda | sandhiyate prajaya
    pashubhih | brahmavarcasenannadyena suvargyena lokena || 'nuvakah || yashchandasamrishabho vishvarupah
    | chandobhyo mbabhuva | sa mendro medhaya sprinotu | amritasya deva dharano bhuyasam | sharira shanam
    | jihva me madhumattama | karna mbhuri vishruvam | brahmanah kosho mme gopaya | avahanti vitanvana
    || || kurvana ciramatmanah | vasagmsi mama gavashca | annapane ca sarvada | tato me shriyamavaha |
    lomasha mpashubhissaha svaha | ama yantu brahmacarinassvaha ''yantu brahmacarinassvaha ''yantu brahmacarinassvaha
    | damayantu brahmacarinassvaha | shamayantu brahmacarinassvaha ntva bhaga pravishani svaha | sa ma
    bhaga pravisha svaha thsahasrashakhe | nibhagaha ntvayi mrije svaha ''yanti | yatha masa aharjaram
    | eva mbrahmacarinah | dhatarayantu sarvatassvaha 'si pramabhahi pramapadyasva || 'nuvakah || bhurbhuvassuvariti
    va etastisro vyahritayah | tasamuhasmai ta ncaturthim | mahacamasyah pravedayate | maha iti | tadbrahma
    | sa atma | anga lo~kah | bhuva ityantariksham | suvarityasau lokah || || maha ityadityah | adityena
    vava sarve loka mahiyante | bhuriti va agnih | bhuva iti vayuh | suvarityadityah | maha iti candramah
    | candramasa vava sarvani jyotigmshi mahiyante | bhuriti va ricah | bhuva iti samani | suvariti yajugmshi
    || || maha iti brahma | brahmana vava sarve veda mahiyante | bhuriti vai pranah | bhuva ityapanah
    | suvariti vyanah | maha ityannam | annena vava sarve prana mahiyante | ta va etashcatasrashcaturdha
    | catasrashcatasro vyahritayah | ta yo veda | sa veda brahma | sarve 'smai deva balimavahanti || 'ntarahridaya
    akashah | tasminnaya mpurusho manomayah | amrito hiranmayah | antarena taluke | ya eshastana ivavalambate
    | se ndrayonih | yatrasau keshanto vivartate | vyapohya shir shakapale | bhurityagnau pratitishthati
    | bhuva iti vayau || || suvarityaditye | maha iti brahmani | apnoti svara jyam | apnoti manasaspatim
    | vakpatishcakshushpatih | shrotrapatirvijnanapatih | etattato bhavati | akashasharira mbrahma | satyatma
    pranarama mmana anandam | shantisamriddhamamritam | iti pracina yogyopa 'nuvakah || prithivyantariksha
    'vantaradishah | agnirvayuradityashcandrama nakshatrani | apa oshadhayo vanaspataya akasha atma |
    ityadhibhutam | athadhyatmam | prano vyano 'pana udanassamanah | cakshushshrotra mmano vaktvak | carmamagmsagg
    snavasthi majja | etadadhividhaya rishiravocat | panktam | panktenaiva panktagg sprinotiti || 'nuvakah
    || omiti brahma | omitidagm sarvam | omityetadanukritir ha sma va apyo shravayetyashravayanti | omiti
    samani gayanti | ogm shomiti shastrani shagmsanti | omityadhvaryuh pratigara mpratigrinati | omiti
    brahma prasauti | omityagnihotramanujanati | omiti brahmanah pravakshyannaha brahmopa pnavaniti |
    brahmaivopa nca svadhyayapravacane ca | satya nca svadhyayapravacane ca | tapashca svadhyayapravacane
    ca | damashca svadhyayapravacane ca | shamashca svadhyayapravacane ca | agnayashca svadhyayapravacane
    ca | agnihotra nca svadhyayapravacane ca | atithayashca svadhyayapravacane ca | manusha nca svadhyayapravacane
    ca | praja ca svadhyayapravacane ca | prajanashca svadhyayapravacane ca | prajatishca svadhyayapravacane
    ca | satyamiti satyavaca rathitarah | tapa iti taponityah paurushishtih | svadhyayapravacane eveti
    nako maudgalyah | taddhi tapastaddhi tapah || vri~kshasya reriva | kirtih prishtha ngireriva | urdhvapavitro
    vajiniva svamritamasmi | dravinagm savarcasam | sumedha amritokshitah | iti trishankorvedanuvacanam
    || 'nuvakah || vedamanucyacaryo 'ntevasinamanushasti | satyam nma pramadah | acaryaya priya ndhanamahritya
    prajatantu mma vyavacchetsih | satyanna pramaditavyam | dharmanna pramaditavyam | kushalanna pramaditavyam
    | bhutyai na pramaditavyam | svadhyayapravacanabhya nna pramaditavyam || nna pramaditavyam | matridevo
    bhava | pitridevo bhava | acaryadevo bhava | atithidevo bhava | yanyanavadyani karmani | tani sevitavyani
    | no itarani | yanyasmakagm sucaritani | tani tvayopasyani || || no itarani | ye ke carumacchreyagmso
    brahmanah | tesha ''sane na prashvasitavyam | shraddhaya deyam | ashraddhaya 'deyam | shriya deyam
    | hriya deyam | bhiya deyam | sam vi~da deyam | atha yadi te karmavicikitsa va vrittavicikitsa va
    syat || shinah | yukta ayuktah | aluksha dharmakamassyuh | yatha te tatra varterann | tatha tatra
    vartethah | athabhya khyateshu | ye tatra brahmana shinah | yukta ayuktah | aluksha dharmakamassyuh
    | yatha te teshu varterann | tatha teshu vartethah | esha adeshah | esha upadeshah | esha vedopanishat
    | etadanushasanam | evamupasitavyam | evamu caitadupasyam || nno bhavatvaryama | sha nna indro brihaspatih
    | sha nno vishnururukramah | namo brahmane | namaste vayo | tvameva pratyaksha mbrahmasi | tvameva
    pratyaksha mbrahmavadisham | ritamavadisham | satyamavadisham | tanmamavit | tadvaktaramavit | avinmam
    | avi 'nuvakah || || harih om || || shri krishnarpanamastu ||
  devanagari: ॐ श्री गुरुभ्यो नमः । हरिः ओम् ॥ ॐ श न्नो॑ भवत्वर्य॒मा । श न्न॒ इन्द्रो॒ बृह॒स्पतिः॑ । श
    न्नो॒ विष्णु॑रुरुक्र॒मः । नमो॒ ब्रह्म॑णे । नम॑स्ते वायो । त्वमे॒व प्र॒त्यक्ष॒ म्ब्रह्मा॑सि । त्वामे॒व
    प्र॒त्यक्ष॒ म्ब्रह्म॑ वदिष्यामि । ऋ॒तं वँ॑दिष्यामि । स॒त्यं वँ॑दिष्यामि । तन्माम॑वतु । तद्व॒क्तार॑मवतु
    । अव॑तु॒ माम् । अव॑तु व॒क्तारम् ख्यास्या॒मः । वर्ण॒स्स्वरः । मात्रा॒ बलम् । साम॑ सन्ता॒नः । इत्युक्तश्शी
    ऽनुवाकः ॥ स॒ह नौ॒ यशः । स॒ह नौ ब्र॑ह्मव॒र्चसम् । अथातस्सग्ंहिताया उपनिषदं ख्यास्या॒मः । पञ्चस्वधिक॑रणे॒षु
    । अधिलोकमधिज्यौतिषमधिविद्यमधिप्रज॑मध्या॒त्मम् । ता महासग्ंहिता इ॑त्याच॒क्षते । अथा॑धिलो॒कम् । पृथिवी
    पू र्वरू॒पम् । द्यौरुत्त॑ररू॒पम् । आका॑शस्स॒न्धिः ॥ ॥ वायु॑स्सन्धा॒नम् । इत्य॑धिलो॒कम् । अथा॑धिज्यौ॒तिषम्
    । अग्निः पू र्वरू॒पम् । आदित्य उत्त॑ररू॒पम् । आ॑पस्स॒न्धिः । वैद्युत॑स्सन्धा॒नम् । इत्य॑धिज्यौ॒तिषम्
    । अथा॑धिवि॒द्यम् । आचार्यः पू ॥ अन्तेवास्युत्त॑ररू॒पम् । वि॑द्या स॒न्धिः । प्रवचनग्ं॑ सन्धा॒नम् ।
    इत्य॑धिवि॒द्यम् । अथाधि॒प्रजम् । माता पू र्वरू॒पम् । पितोत्त॑ररू॒पम् । प्र॑जा स॒न्धिः । प्रजननग्ं॑
    सन्धा॒नम् । इत्यधि॒प्रजम् ॥ ॥ अथाध्या॒त्मम् । अधरा हनुः पू र्वरू॒पम् । उत्तरा हनुरुत्त॑ररू॒पम् । वाक्स॒न्धिः
    । जिह्वा॑ सन्धा॒नम् । इत्यध्या॒त्मम् । इतीमा म॑हास॒ग्ं॒हिताः । य एवमेता महासग्ंहिता व्याख्या॑ता वे॒द
    । सन्धीयते प्रज॑या प॒शुभिः । ब्रह्मवर्चसेनान्नाद्येन सुवर्ग्येण॑ लोके॒न ॥ ऽनुवाकः ॥ यश्छन्द॑सामृष॒भो
    वि॒श्वरू॑पः । छन्दो॒भ्यो म्ब॒भूव॑ । स मेन्द्रो॑ मे॒धया स्पृणोतु । अ॒मृत॑स्य देव॒ धार॑णो भूयासम् ।
    शरी॑र षणम् । जि॒ह्वा मे॒ मधु॑मत्तमा । कर्णा म्भूरि॒ विश्रु॑वम् । ब्रह्म॑णः को॒शो॑ म्मे॑ गोपाय । आ॒वह॑न्ती
    वितन्वा॒ना ॥ ॥ कु॒र्वा॒णा चीर॑मा॒त्मनः॑ । वासाग्ं॑सि॒ मम॒ गाव॑श्च । अ॒न्न॒पा॒ने च॑ सर्व॒दा । ततो॑
    मे॒ श्रिय॒माव॑ह । लो॒म॒शा म्प॒शुभि॑स्स॒ह स्वाहा । आमा॑ यन्तु ब्रह्मचा॒रिण॒स्स्वाहा ऽऽयन्तु ब्रह्मचा॒रिण॒स्स्वाहा
    ऽऽयन्तु ब्रह्मचा॒रिण॒स्स्वाहा । दमा॑यन्तु ब्रह्मचा॒रिण॒स्स्वाहा । शमा॑यन्तु ब्रह्मचा॒रिण॒स्स्वाहा
    न्त्वा॑ भग॒ प्रवि॑शानि॒ स्वाहा । स मा॑ भग॒ प्रवि॑श॒ स्वाहा थ्स॒हस्र॑शाखे । निभ॑गा॒ह न्त्वयि॑ मृजे॒
    स्वाहा ऽऽयन्ति॑ । यथा॒ मासा॑ अहर्ज॒रम् । ए॒व म्ब्र॑ह्मचा॒रिणः॑ । धात॒राय॑न्तु स॒र्वत॒स्स्वाहा ऽसि॒
    प्रमा॑भाहि॒ प्रमा॑पद्यस्व ॥ ऽनुवाकः ॥ भूर्भुव॒स्सुव॒रिति॒ वा ए॒तास्ति॒स्रो व्याहृ॑तयः । तासा॑मुहस्मै॒
    ता ञ्च॑तु॒र्थीम् । माहा॑चमस्यः॒ प्रवे॑दयते । मह॒ इति॑ । तद्ब्रह्म॑ । स आ॒त्मा । अङ्गा लोँ॒कः । भुव॒
    इत्य॒न्तरि॑क्षम् । सुव॒रित्य॒सौ लो॒कः ॥ ॥ मह॒ इत्या॑दि॒त्यः । आ॒दि॒त्येन॒ वाव सर्वे॑ लो॒का मही॑यन्ते
    । भूरिति॒ वा अ॒ग्निः । भुव॒ इति॑ वा॒युः । सुव॒रित्या॑दि॒त्यः । मह॒ इति॑ च॒न्द्रमाः । च॒न्द्रम॑सा॒
    वाव सर्वा॑णि॒ ज्योतीग्ं॑षि॒ मही॑यन्ते । भूरिति॒ वा ऋचः॑ । भुव॒ इति॒ सामा॑नि । सुव॒रिति॒ यजूग्ं॑षि
    ॥ ॥ मह॒ इति॒ ब्रह्म॑ । ब्रह्म॑णा॒ वाव सर्वे॑ वे॒दा मही॑यन्ते । भूरिति॒ वै प्रा॒णः । भुव॒ इत्य॑पा॒नः
    । सुव॒रिति॑ व्या॒नः । मह॒ इत्यन्नम् । अन्ने॑न॒ वाव सर्वे प्रा॒णा मही॑यन्ते । ता वा ए॒ताश्चत॑स्रश्चतु॒र्धा
    । चत॑स्रश्चतस्रो॒ व्याहृ॑तयः । ता यो वेद॑ । स वे॑द॒ ब्रह्म॑ । सर्वे ऽस्मै दे॒वा ब॒लिमाव॑हन्ति ॥ ऽन्तरहृ॑दय
    आका॒शः । तस्मि॑न्न॒य म्पुरु॑षो मनो॒मयः॑ । अमृ॑तो हिर॒ण्मयः॑ । अन्त॑रेण॒ तालु॑के । य ए॒षस्तन॑ इवाव॒लम्ब॑ते
    । से न्द्रयो॒निः । यत्रा॒सौ के॑शा॒न्तो वि॒वर्त॑ते । व्य॒पोह्य॑ शीर् षकपा॒ले । भूरित्य॒ग्नौ प्रति॑तिष्ठति
    । भुव॒ इति॑ वा॒यौ ॥ ॥ सुव॒रित्या॑दि॒त्ये । मह॒ इति॒ ब्रह्म॑णि । आ॒प्नोति॒ स्वारा ज्यम् । आ॒प्नोति॒
    मन॑स॒स्पतिम् । वाक्प॑ति॒श्चक्षु॑ष्पतिः । श्रोत्र॑पतिर्वि॒ज्ञान॑पतिः । ए॒तत्ततो॑ भवति । आ॒का॒शश॑रीर॒
    म्ब्रह्म॑ । स॒त्यात्म॑ प्रा॒णारा॑म॒ म्मन॑ आनन्दम् । शान्ति॑समृद्धम॒मृतम् । इति॑ प्राचीन यो॒ग्योपा
    ऽनुवाकः ॥ पृ॒थि॒व्य॑न्तरि॑क्ष॒ ऽवान्तरदि॒शाः । अ॒ग्निर्वा॒युरा॑दि॒त्यश्च॒न्द्रमा॒ नक्ष॑त्राणि । आप॒
    ओष॑धयो॒ वन॒स्पत॑य आका॒श आ॒त्मा । इत्य॑धिभू॒तम् । अथाध्या॒त्मम् । प्रा॒णो व्या॒नो॑ ऽपा॒न उ॑दा॒नस्स॑मा॒नः
    । चक्षु॒श्श्रोत्र॒ म्मनो॒ वाक्त्वक् । चर्म॑मा॒ग्ं॒सग्ग् स्नावास्थि॑ म॒ज्जा । ए॒तद॑धिवि॒धाय॒ ऋषि॒रवो॑चत्
    । पाङ्क्तं॒ । पाङ्क्ते॑नै॒व पाङ्क्तग्ग्॑ स्पृणो॒तीति॑ ॥ ऽनुवाकः ॥ ओमिति॒ ब्रह्म॑ । ओमिती॒दग्ं सर्वम्
    । ओमित्ये॒तद॑नुकृतिर् ह स्म॒ वा अ॒प्यो श्रा॑व॒येत्याश्रा॑वयन्ति । ओमिति॒ सामा॑नि गायन्ति । ओग्ं शोमिति॑
    श॒स्त्राणि॑ शग्ंसन्ति । ओमित्य॑ध्व॒र्युः प्र॑तिग॒र म्प्रति॑गृणाति । ओमिति॒ ब्रह्मा॒ प्रसौ॑ति । ओमित्य॑ग्निहो॒त्रमनु॑जानाति
    । ओमिति॑ ब्राह्म॒णः प्र॑व॒क्ष्यन्ना॑ह॒ ब्रह्मोपा प्नवा॒नीति॑ । ब्रह्मै॒वोपा ञ्च स्वाध्यायप्रव॑चने॒
    च । सत्य ञ्च स्वाध्यायप्रव॑चने॒ च । तपश्च स्वाध्यायप्रव॑चने॒ च । दमश्च स्वाध्यायप्रव॑चने॒ च । शमश्च
    स्वाध्यायप्रव॑चने॒ च । अग्नयश्च स्वाध्यायप्रव॑चने॒ च । अग्निहोत्र ञ्च स्वाध्यायप्रव॑चने॒ च । अतिथयश्च
    स्वाध्यायप्रव॑चने॒ च । मानुष ञ्च स्वाध्यायप्रव॑चने॒ च । प्रजा च स्वाध्यायप्रव॑चने॒ च । प्रजनश्च स्वाध्यायप्रव॑चने॒
    च । प्रजातिश्च स्वाध्यायप्रव॑चने॒ च । सत्यमिति सत्यवचा॑ राथी॒तरः । तप इति तपोनित्यः पौ॑रुशि॒ष्टिः
    । स्वाध्यायप्रवचने एवेति नाको॑ मौद्ग॒ल्यः । तद्धि तप॑स्तद्धि॒ तपः ॥ वृँ॒क्षस्य॒ रेरि॑वा । की॒र्तिः
    पृ॒ष्ठ ङ्गि॒रेरि॑व । ऊ॒र्ध्वप॑वित्रो वा॒जिनी॑व स्व॒मृत॑मस्मि । द्रवि॑ण॒ग्ं॒ सव॑र्चसम् । सुमेधा अ॑मृतो॒क्षितः
    । इति त्रिशङ्कोर्वेदा॑नुव॒चनम् ॥ ऽनुवाकः ॥ वेदमनूच्याचार्यो ऽन्तेवासिनम॑नुशा॒स्ति । सत्यं॒ न्मा प्र॒मदः
    । आचार्याय प्रिय न्धनमाहृत्य प्रजातन्तु म्मा व्य॑वच्छे॒त्सीः । सत्यान्न प्रम॑दित॒व्यम् । धर्मान्न
    प्रम॑दित॒व्यम् । कुशलान्न प्रम॑दित॒व्यम् । भूत्यै न प्रम॑दित॒व्यम् । स्वाध्यायप्रवचनाभ्या न्न प्रम॑दित॒व्यम्
    ॥ न्न प्रम॑दित॒व्यम् । मातृ॑देवो॒ भव । पितृ॑देवो॒ भव । आचार्य॑देवो॒ भव । अतिथि॑देवो॒ भव । यान्यनवद्यानि॑
