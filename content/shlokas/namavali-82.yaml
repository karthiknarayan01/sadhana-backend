id: namavali-82
category: mantra
name:
  english: namavali
  devanagari: नामावली
content:
  english: karunyavarshikaya | namadbrahmadikotiranavaratnojjvalanghrikaya namah || 40|| om mayatitaya
    namah | mahamayine | manovacamagocaraya | manjulangaya | mahayogine | mahamerusharasanaya | manmathadhvamsakaya
    | maunine | madhudharatibhashakaya | mahirathaya | mahadevaya | mahokshavaravahanaya | madhuryajahnavivicisamplavitajatatataya
    | manorathaphalatitavarapradapadambujaya | mahapralayasancarine | mahakalaya | mahanataya | madhurapuramadhyasthavimanantaravasakaya
    | martandakotisadrishaya | mayapuranivasakaya namah || 60|| om shivakritaye namah | shivakaraya |
    shivanandavapurdharaya shivapriyaya | shivajneyaya | shivayogavaneshvaraya | shivadharaya | shivamayaya
    | shivasaktahridambujaya | shivangikritavamangaya | shivalokeshvaraya | shivaya | shivasahayaya |
    shikhidrishe | shikhandine | shivalokadaya | shivakshetravilasine | shikharindraniketanaya | shivabhaktahridambhojanivasine
    | shivapuhpataye namah || 80|| om vagmine namah | varishthaya | varadaya | vatashavilasatkaraya |
    vasupradaya | vasudevavaryacakrayudhapradaya | varakundadrumavasine | vatamulatatashrayaya | vasundharamarakaraya
    | vandyaya | vatsalyavaridhaye | vamadevaya | varyavaryaya | varabhayakarambujaya | vasuretase | varenyaya
    | vasavadyamararcitaya | vashikritakhilandaya | vakpradaya | varadeshikaya namah || 100|| om yajnakrite
    namah | yajnahride | yajnadhvamsine | yajneshvaraya | yamine | yamadyashtangasandrishyaya | yantre
    | yajnaviduttamaya | yathecchasrishtabhuvanaya | yatharthajanavatsalaya | yathashritajanakleshaya
    | yajnasandrishyavigrahaya | yamaprahartre | yaksheshasakhaya | yatugunantakaya | yajnamrigyaya |
    yajnasadhyaya | yajnavishrantibhuruhaya | yatishaya | yaticittaravindanrittavidhayakaya namah || 120||
    om atmane namah | antaratmane | paramatmane | adikailasanayakaya | atmanathaya | tirthanathaya | shabdanathaya
    | sadashivaya namah || 128|| iti mantrarajashatanamavalih samapta |
  devanagari: कारुण्यवार्षिकाय । नमद्ब्रह्मादिकोटीरनवरत्नोज्ज्वलाङ्घ्रिकाय नमः ॥ ४०॥ ॐ मायातीताय नमः ।
    महामायिने । मनोवाचामगोचराय । मञ्जुलाङ्गाय । महायोगिने । महामेरुशरासनाय । मन्मथध्वंसकाय । मौनिने ।
    मधुधारातिभाषकाय । महीरथाय । महादेवाय । महोक्षवरवाहनाय । माधुर्यजाह्नवीवीचीसम्प्लावितजटातटाय । मनोरथफलातीतवरप्रदपदाम्बुजाय
    । महाप्रलयसञ्चारिणे । महाकालाय । महानटाय । मधुरापुरमध्यस्थविमानान्तरवासकाय । मार्ताण्डकोटिसदृशाय ।
    मायापुरनिवासकाय नमः ॥ ६०॥ ॐ शिवाकृतये नमः । शिवाकाराय । शिवानन्दवपुर्धराय शिवाप्रियाय । शिवाज्ञेयाय
    । शिवयोगवनेश्वराय । शिवाधाराय । शिवमयाय । शिवासक्तहृदम्बुजाय । शिवाङ्गीकृतवामाङ्गाय । शिवलोकेश्वराय
    । शिवाय । शिवासहायाय । शिखिदृशे । शिखण्डिने । शिवलोकदाय । शिवक्षेत्रविलासिने । शिखरीन्द्रनिकेतनाय
    । शिवभक्तहृदम्भोजनिवासिने । शिवपूःपतये नमः ॥ ८०॥ ॐ वाग्मिने नमः । वरिष्ठाय । वरदाय । वाताशविलसत्कराय
    । वसुप्रदाय । वासुदेववर्यचक्रायुधप्रदाय । वरकुन्दद्रुमावासिने । वटमूलतटाश्रयाय । वसुन्धरामराकाराय
    । वन्द्याय । वात्सल्यवारिधये । वामदेवाय । वर्यवर्याय । वराभयकराम्बुजाय । वसुरेतसे । वरेण्याय । वासवाद्यमरार्चिताय
    । वशीकृताखिलाण्डाय । वाक्प्रदाय । वरदेशिकाय नमः ॥ १००॥ ॐ यज्ञकृते नमः । यज्ञहृदे । यज्ञध्वंसिने ।
    यज्ञेश्वराय । यमिने । यमाद्यष्टाङ्गसन्दृश्याय । यन्त्रे । यज्ञविदुत्तमाय । यथेच्छासृष्टभुवनाय । यथार्थजनवत्सलाय
    । यथाश्रितजनक्लेशाय । यज्ञसन्दृश्यविग्रहाय । यमप्रहर्त्रे । यक्षेशसखाय । यातुगुणान्तकाय । यज्ञमृग्याय
    । यज्ञसाध्याय । यज्ञविश्रान्तिभूरुहाय । यतीशाय । यतिचित्तारविन्दनृत्तविधायकाय नमः ॥ १२०॥ ॐ आत्मने
    नमः । अन्तरात्मने । परमात्मने । आदिकैलासनायकाय । आत्मनाथाय । तीर्थनाथाय । शब्दनाथाय । सदाशिवाय नमः
    ॥ १२८॥ इति मन्त्रराजशतनामावलिः समाप्ता ।
