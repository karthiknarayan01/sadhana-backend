id: devaihkritam02devistotram
category: stotram
name:
  english: devaihkritam02devistotram
  devanagari: देवैःकृतं०२देवीस्तोत्रम्
content:
  english: rinu suprita yasya dasassadambike | tava devi mahadevi hinato varnayamahe || 13|| pura dakshasuta
    bhutva sanjata haravallabha | brahmanashca paresham va nashayatvamakam mahat || 14|| pitrito'nadaram
    prapyatyajah panavashattanum | svalokamagamastvam calabhadduhkham haro'pi hi || 15|| na hi jatamprapurnam
    taddevakaryam maheshvari | vyakula munayo devashsharanam tvam gata vayam || 16|| purnam kuru maheshani
    nirjaranam manoratham | sanatkumaravacanam saphalam syadyatha shive || 17|| avatirya kshitau devi
    rudrapatni punarbhava | lilam kuru yathayogyam prapnuyurnirjarassukham || 18|| sukhi syaddevi rudro'pi
    kailasacalasamsthitah | sarve bhavantu sukhino duhkham nashyatu kritsnashah || 19|| iti shivapurane
    rudrasamhitayam parvatikhande caturthadhyayantargatam devaih kritam devistotram samaptam | shivapurana
    | rudrasamhita | parvatikhanda | adhyaya 4
  devanagari: ृणु सुप्रीता यस्या दासास्सदाम्बिके । तव देवि महादेवि हीनतो वर्णयामहे ॥ १३॥ पुरा दक्षसुता
    भूत्वा सञ्जाता हरवल्लभा । ब्रह्मणश्च परेषां वा नाशयत्वमकं महत् ॥ १४॥ पितृतोऽनादरं प्राप्यात्यजः पणवशात्तनुम्
    । स्वलोकमगमस्त्वं चालभद्दुःखं हरोऽपि हि ॥ १५॥ न हि जातम्प्रपूर्णं तद्देवकार्यं महेश्वरि । व्याकुला
    मुनयो देवाश्शरणं त्वां गता वयम् ॥ १६॥ पूर्णं कुरु महेशानि निर्जराणां मनोरथम् । सनत्कुमारवचनं सफलं
    स्याद्यथा शिवे ॥ १७॥ अवतीर्य क्षितौ देवि रुद्रपत्नी पुनर्भव । लीलां कुरु यथायोग्यं प्राप्नुयुर्निर्जरास्सुखम्
    ॥ १८॥ सुखी स्याद्देवि रुद्रोऽपि कैलासाचलसंस्थितः । सर्वे भवन्तु सुखिनो दुःखं नश्यतु कृत्स्नशः ॥ १९॥
    इति शिवपुराणे रुद्रसंहितायां पार्वतीखण्डे चतुर्थाध्यायान्तर्गतं देवैः कृतं देवीस्तोत्रं समाप्तम् ।
    शिवपुराण । रुद्रसंहिता । पार्वतीखण्ड । अध्याय ४
