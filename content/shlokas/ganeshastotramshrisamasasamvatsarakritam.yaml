id: ganeshastotramshrisamasasamvatsarakritam
category: stotram
name:
  english: ganeshastotramshrisamasasamvatsarakritam
  devanagari: गणेशस्तोत्रम्श्रीसमाससंवत्सरकृतं
content:
  english: shrisamasasamvatsarakritam shriganeshastotram || shriganeshaya namah || samasasamvatsara uvaca
    | namaste dhumravarnaya vakratundaya dhundhaye | herambaya pareshaya vighneshaya namo namah || 9||
    shurpakarnaya sarvesham pujyaya paramatmane | lambodaraya sarvadipujyaya tu namo namah || 10|| anathanam
    sunathaya patre hartre namo namah | kartre trigunarupaya gunahinaya te namah || 11|| adimadhyantasamsthayadimadhyantavivarjita
    | ganeshaya gananam te calakaya namo namah || 12|| brahmanam pataye tubhyam brahmabhyo brahmadayine
    | brahmane brahmabhutaya brahmishthaya namo namah || 13|| siddhibuddhipradatre te siddhibuddhimayaya
    ca | siddhibuddhipate tubhyam sarveshaya namo namah || 14|| anantavibhavayaivanantamayapracarine |
    mayine mayinam mohadatre mayasvarupine || 15|| shantiyogamayayaiva shantiyogadharaya te | shantiyogapradatre
    ca yogeshaya namo namah || 16|| kim staumi tvam ganadhisha cintamanisvarupine | yoginah shantimapanna
    veda yatra visheshatah || 17|| ato namamyaham natha tena tushto bhava prabho | varan dehi svakaryanam
    siddhidan sukhadayakan || 18|| bhaktim te carane nityam dehi sarvabhayapaham | kalamanakaram dhundhe
    viryam dehi svabhavajam || 19|| karma masadishu prajnaih kritam tacchubhadam bhavet | sakshitvam karmanam
    dehi sadhupadaprapujanam || 20|| evamuktva pranemustam masah samvatsaranvitah | tanuvaca ganadhyaksho
    vacah stotrena toshitah || 21||
  devanagari: श्रीसमाससंवत्सरकृतं श्रीगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ समाससंवत्सर उवाच । नमस्ते धूम्रवर्णाय
    वक्रतुण्डाय ढुण्ढये । हेरम्बाय परेशाय विघ्नेशाय नमो नमः ॥ ९॥ शूर्पकर्णाय सर्वेषां पूज्याय परमात्मने
    । लम्बोदराय सर्वादिपूज्याय तु नमो नमः ॥ १०॥ अनाथानां सुनाथाय पात्रे हर्त्रे नमो नमः । कर्त्रे त्रिगुणरूपाय
    गुणहीनाय ते नमः ॥ ११॥ आदिमध्यान्तसंस्थायादिमध्यान्तविवर्जित । गणेशाय गणानां ते चालकाय नमो नमः ॥ १२॥
    ब्रह्मणां पतये तुभ्यं ब्रह्मभ्यो ब्रह्मदायिने । ब्रह्मणे ब्रह्मभूताय ब्रह्मिष्ठाय नमो नमः ॥ १३॥ सिद्धिबुद्धिप्रदात्रे
    ते सिद्धिबुद्धिमयाय च । सिद्धिबुद्धिपते तुभ्यं सर्वेशाय नमो नमः ॥ १४॥ अनन्तविभवायैवानन्तमायाप्रचारिणे
    । मायिने मायिनां मोहदात्रे मायास्वरूपिणे ॥ १५॥ शान्तियोगमयायैव शान्तियोगधराय ते । शान्तियोगप्रदात्रे
    च योगेशाय नमो नमः ॥ १६॥ किं स्तौमि त्वां गणाधीश चिन्तामणिस्वरूपिणे । योगिनः शान्तिमापन्ना वेदा यत्र
    विशेषतः ॥ १७॥ अतो नमाम्यहं नाथ तेन तुष्टो भव प्रभो । वरान् देहि स्वकार्याणां सिद्धिदान् सुखदायकान्
    ॥ १८॥ भक्तिं ते चरणे नित्यं देहि सर्वभयापहाम् । कालमानकरं ढुण्ढे वीर्यं देहि स्वभावजम् ॥ १९॥ कर्म
    मासादिषु प्राज्ञैः कृतं तच्छुभदं भवेत् । साक्षित्वं कर्मणां देहि साधुपादप्रपूजनम् ॥ २०॥ एवमुक्त्वा
    प्रणेमुस्तं मासाः संवत्सरान्विताः । तानुवाच गणाध्यक्षो वचः स्तोत्रेण तोषितः ॥ २१॥
