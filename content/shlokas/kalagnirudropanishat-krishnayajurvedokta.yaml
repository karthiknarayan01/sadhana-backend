id: kalagnirudropanishat-krishnayajurvedokta
category: upanishad
name:
  english: kalagnirudropanishat (krishnayajurvedokta)
  devanagari: कालाग्निरुद्रोपनिषत् (कृष्णयजुर्वेदोक्त)
content:
  english: kalagnirudropanishat 30 brahmajnanopayataya yadvibhutih prakirtita | tamaham kalagnirudram
    bhajatam svatmadam bhaje || om saha navavatu saha nau bhunaktu sahaviryam karavavahai tejasvinavadhitamastu
    ma vidvishavahai om shantih shantih shantih || om atha kalagnirudropanishadah samvartako'gnirrishiranushtupchandah
    shrikalagnirudro devata shrikalagnirudraprityarthe bhasmatripundradharane viniyogah || atha kalagnirudram
    bhagavantam sanatkumarah papraccha adhihi bhagavamstripundravidhim satattvam kim dravyam kiyatsthanam
    katipramanam ka rekha ke mantrah ka shaktih kim daivatam kah karta kim phalamiti ca | tam hovaca bhagavankalagnirudrah
    yaddravyam tadagneyam bhasma sadyojatadipancabrahmamantraih parigrihyagniriti bhasma vayuriti bhasma
    jalamiti bhasma sthalamiti bhasma vyometi bhasmetyanenabhimantrya manastoka iti samuddhritya ma no
    mahantamiti jalena samsrijya triyayushamiti shirolalatavakshahskandheshu triyayushaistryambakaistrishaktibhistiryaktisro
    rekhah prakurvita vratametacchambhavam sarveshu deveshu vedavadibhiruktam bhavati tasmattatsamacarenmumukshurna
    punarbhavaya || atha sanatkumarah papraccha pramanamasya tripundradharanasya tridha rekha bhavatyalalatadacakshushoramurdhnorabhruvormadhyatashca
    yasya prathama rekha sa garhapatyashcakaro rajobhurlokah svatma kriyashaktirrigvedah pratahsavanam
    maheshvaro devateti yasya dvitiya rekha sa dakshinagnirukarah satvamantarikshamantaratma
  devanagari: कालाग्निरुद्रोपनिषत् ३० ब्रह्मज्ञानोपायतया यद्विभूतिः प्रकीर्तिता । तमहं कालाग्निरुद्रं
    भजतां स्वात्मदं भजे ॥ ॐ सह नाववतु सह नौ भुनक्तु सहवीर्यं करवावहै तेजस्विनावधीतमस्तु मा विद्विषावहै
    ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ अथ कालाग्निरुद्रोपनिषदः संवर्तकोऽग्निरृषिरनुष्टुप्छन्दः श्रीकालाग्निरुद्रो
    देवता श्रीकालाग्निरुद्रप्रीत्यर्थे भस्मत्रिपुण्ड्रधारणे विनियोगः ॥ अथ कालाग्निरुद्रं भगवन्तं सनत्कुमारः
    पप्रच्छ अधीहि भगवंस्त्रिपुण्ड्रविधिं सतत्त्वं किं द्रव्यं कियत्स्थानं कतिप्रमाणं का रेखा के मन्त्राः
    का शक्तिः किं दैवतं कः कर्ता किं फलमिति च । तं होवाच भगवान्कालाग्निरुद्रः यद्द्रव्यं तदाग्नेयं भस्म
    सद्योजातादिपञ्चब्रह्ममन्त्रैः परिगृह्याग्निरिति भस्म वायुरिति भस्म जलमिति भस्म स्थलमिति भस्म व्योमेति
    भस्मेत्यनेनाभिमन्त्र्य मानस्तोक इति समुद्धृत्य मा नो महान्तमिति जलेन संसृज्य त्रियायुषमिति शिरोललाटवक्षःस्कन्धेषु
    त्रियायुषैस्त्र्यम्बकैस्त्रिशक्तिभिस्तिर्यक्तिस्रो रेखाः प्रकुर्वीत व्रतमेतच्छाम्भवं सर्वेषु देवेषु
    वेदवादिभिरुक्तं भवति तस्मात्तत्समाचरेन्मुमुक्षुर्न पुनर्भवाय ॥ अथ सनत्कुमारः पप्रच्छ प्रमाणमस्य त्रिपुण्ड्रधारणस्य
    त्रिधा रेखा भवत्याललाटादाचक्षुषोरामूर्ध्नोराभ्रुवोर्मध्यतश्च यास्य प्रथमा रेखा सा गार्हपत्यश्चाकारो
    रजोभूर्लोकः स्वात्मा क्रियाशक्तिरृग्वेदः प्रातःसवनं महेश्वरो देवतेति यास्य द्वितीया रेखा सा दक्षिणाग्निरुकारः
    सत्वमन्तरिक्षमन्तरात्मा
