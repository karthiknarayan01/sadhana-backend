id: indekshed
category: stotram
name:
  english: indekshed
  devanagari: इन्देक्षेद्
content:
  english: narayaniyam om namo bhagavate vasudevaya | om namo narayanaya | parayanasankalpam shuklambaradharam
    vishnum shashivarnam caturbhujam | prasannavadanam dhyayetsarvavighnopashantaye || narayana narayana
    narayana narayana | narayana narayana narayana narayana || dhyanam pitambaram karavirajitashankhacakrakaumodakisarasijam
    karunasamudram | radhasahayamatisundaramandahasam vatalayeshamanisham hridi bhavayami || mukam karoti
    vacalam pangum langhayate girim | yatkripa tamaham vande paramanandamadhavam || vande nandavrajastrinam
    padarenumabhikshnashah | yasam harikathodgitam punati bhuvanatrayam || komaḻam kujayan venum shyamaḻo'yam
    kumarakah | vedavedyam param brahma bhasatam purato mama || dhyanashlokani om namahshriganeshasharadagurubhyo
    namah | avighnamastu | agajananapadmarkam gajananamaharnisham | anekadantam bhaktanamekadantamupasmahe
    || shrimahaganapataye namah | gurave sarvalokanam bhishaje bhavaroginam | nidhayo sarvavidyanam shridakshinamurtaye
    namah || asmadgurucaranaravindabhyam namah | jnananandamayam devam nirmalasphatikakritim | adharam
    sarvavidyanam hayagrivamupasmahe || shrihayagrivamurtaye namah | sarasvati namastubhyam varade kamarupini
    | vidyarambham karishyami siddhirbhavatu me sada || shrimahasarasvatyai namah | umakomaḻahastabjasambhavitalalatakam
    | hiranyakundalam vande kumaram pushkalasrajam || shaktidharashrisubrahmanyasvamine namah | bhutanatha
    sadananda sarvabhutadayapara | raksha raksha mahabaho shastre tubhyam namo namah || svami shrishabarishashastaram
    sharanam gacchami | komaḻam kujayan venum shyamaḻo'yam kumarakah | vedavedyam param brahma bhasatam
    purato mama || yam brahma varunendrarudramarutah stunvanti divyaih stavaih vedaissangapadakramopanishadairgayanti
    yam samagah | dhyanavasthitatadgatenamanasa pashyanti yam yogino yasyantam na viduh surasuraganah
    devaya tasmai namah || krishnaya vasudevaya devakinandanaya ca | nandagopakumaraya govindaya namo
    namah || sayankale vanante kusumitasamaye saikate candrikayam trailokyakarshanangam suravaraganikamohanapangamurtim
    | sevyam sha
  devanagari: नारायणीयम् ॐ नमो भगवते वासुदेवाय । ॐ नमो नारायणाय । पारायणसङ्कल्पम् शुक्लाम्बरधरं विष्णुं
    शशिवर्णं चतुर्भुजम् । प्रसन्नवदनं ध्यायेत्सर्वविघ्नोपशान्तये ॥ नारायण नारायण नारायण नारायण । नारायण
    नारायण नारायण नारायण ॥ ध्यानम् पीताम्बरं करविराजितशङ्खचक्रकौमोदकीसरसिजं करुणासमुद्रम् । राधासहायमतिसुन्दरमन्दहासं
    वातालयेशमनिशं हृदि भावयामि ॥ मूकं करोति वाचालं पङ्गुं लङ्घयते गिरिम् । यत्कृपा तमहं वन्दे परमानन्दमाधवम्
    ॥ वन्दे नन्दव्रजस्त्रीणां पादरेणुमभीक्ष्णशः । यासां हरिकथोद्गीतं पुनाति भुवनत्रयम् ॥ कोमळं कूजयन्
    वेणुं श्यामळोऽयं कुमारकः । वेदवेद्यं परं ब्रह्म भासतां पुरतो मम ॥ ध्यानश्लोकानि ॐ नमःश्रीगणेशशारदागुरुभ्यो
    नमः । अविघ्नमस्तु । अगजाननपद्मार्कं गजाननमहर्निशम् । अनेकदन्तं भक्तानामेकदन्तमुपास्महे ॥ श्रीमहागणपतये
    नमः । गुरवे सर्वलोकानां भिषजे भवरोगिणाम् । निधयो सर्वविद्यानां श्रीदक्षिणामूर्तये नमः ॥ अस्मद्गुरुचरणारविन्दाभ्यां
    नमः । ज्ञानानन्दमयं देवं निर्मलस्फटिकाकृतिम् । आधारं सर्वविद्यानां हयग्रीवमुपास्महे ॥ श्रीहयग्रीवमूर्तये
    नमः । सरस्वति नमस्तुभ्यं वरदे कामरूपिणि । विद्यारम्भं करिष्यामि सिद्धिर्भवतु मे सदा ॥ श्रीमहासरस्वत्यै
    नमः । उमाकोमळहस्ताब्जसम्भावितललाटकम् । हिरण्यकुण्डलं वन्दे कुमारं पुष्कलस्रजम् ॥ शक्तिधरश्रीसुब्रह्मण्यस्वामिने
    नमः । भूतनाथ सदानन्द सर्वभूतदयापर । रक्ष रक्ष महाबाहो शास्त्रे तुभ्यं नमो नमः ॥ स्वामि श्रीशबरीशशास्तारं
    शरणं गच्छामि । कोमळं कूजयन् वेणुं श्यामळोऽयं कुमारकः । वेदवेद्यं परं ब्रह्म भासतां पुरतो मम ॥ यं ब्रह्मा
    वरुणेन्द्ररुद्रमरुतः स्तुन्वन्ति दिव्यैः स्तवैः वेदैस्साङ्गपदक्रमोपनिषदैर्गायन्ति यं सामगाः । ध्यानावस्थिततद्गतेनमनसा
    पश्यन्ति यं योगिनो यस्यान्तं न विदुः सुरासुरगणाः देवाय तस्मै नमः ॥ कृष्णाय वासुदेवाय देवकीनन्दनाय
    च । नन्दगोपकुमाराय गोविन्दाय नमो नमः ॥ सायङ्काले वनान्ते कुसुमितसमये सैकते चन्द्रिकायां त्रैलोक्याकर्षणाङ्गं
    सुरवरगणिकामोहनापाङ्गमूर्तिम् । सेव्यं श
