id: sharabhasahasranamastotra
category: sahasranama
name:
  english: sharabhasahasranamastotra
  devanagari: शरभसहस्रनामस्तोत्र
content:
  english: nimattashca nandirnadakaro harih | nadishvarashca nandi ca nandino nandivarddhanah || 45||
    bhagahari nihanta ca kalo brahma pitamahah | caturmukho mahalingashcaturlingasthaiva ca || 46|| lingadhyakshah
    suradhyaksho yogadhyaksho yugavahah | bijadhyaksho bijakartta adhyatmanugato balah || 47|| itihasah
    sakalpashca gautamotha nishakarah | dabhohyadabho vaidambho vashyo vashyakarah kalih || 48|| lokakarta
    pashupatirmahakarta hyanaushadhah | aksharam paramam brahma valatacchanna eva ca || 49|| nitirhyanitih
    shuddhatma shuddho manyo gatagatih | bahuprasada susvapno darpanothatvamitrajit || 50|| vedakaro mantrakaro
    vidvansamaramardanah | mahamoghanivasi ca mahaghoro vashikarah || 51|| agnijvalo mahajvalo atidhumro
    huto havih | vrishalah shankaro nityo varcasi dhumralocanah || 52|| nilastathangalubdhashca shobhano
    niravagrahah | svastidah svastibhavashca bhogi bhogakaro laghuh || 53|| utsangashca mahangashca mahabhogo
    parayanah | krishnavarnah suvarnashca indriyam sarvadehinam || 54|| mahapado mahahasto mahakayo mahayashah
    | mahamurddha mahamatro mahanetro nishalayah || 55|| mahantako mahakarno mahokshashca mahahanuh |
    mahanano mahakamvurmahagrivah shmashanabhak || 56|| mahavaksha mahorasko hyantarama mrigalayah | lambito
    lambitoshtashca mahamaya payonidhi || 57|| mahadanto mahadamshtro mahajihvo mahamukhah | mahanakho
    maharoma mahakesho mahajarah || 58|| prasannashca prasadashca pratayo yogisadhanah | snehanotishubhasnehah
    ajitashca mahamunih || 59|| vrikshakaro vrikshaketuh analo vayuvahanah | mandali dhamashca devadhipatireva
    ca || 60|| atharvashirshah samasyah rik sahasra mitekshanah | yajuh padabhujaguhyah prakasho jangamastatha
    || 61|| amodharthaprasadashca atigamyah sudarshanah | upakarapriyah sarvah kanakah kancanasthitah
    || 62|| nabhirnadikaro bhavah pushkarasya patisthirah | dvadashastramasashvagho yajno yajnasamahitah
    || 63|| naktam kalishca kalashca kakarah kalapujitah | savano ganakarashca bhutavahanasarathih ||
    64|| bhasmashayi bhasmagopta bhasmabhutastamogunah | lokapalastatha loko mahatma sarvapujitah || 65||
    shuklastrishuklasampannah shucirbhutanishevitah | ashramasthah kriyavastho vishvakarma matirvarah
    || 66|| vishalashakhastamroshtohyambujalah sunishcalah | kapilah kapilah shukla ayushcaiva parovarah
    || 67|| gandharvo hyaditistarkshyah suvijneyah susharadah | parashvadhayudho deva andhakarih suvandhavah
    || 68|| tumbavino mahakrodha urdhvamreta jaleshayah | ugro vamshakaro dvamsho vamshanadohyaninditah
    || 69|| sarvangarupo mayavi suhyadohyanilonalah | bandhano bandhakarta ca subadhuravimocanah || 70||
    meshajarih sukarmarirmahadamshtrasamo yudhi | bahusvanirmitah sarvah shankarah shankaro varah || 71||
    amaresho mahadevo vishvadevah surariha | nisangashcahirbudhynashcakitaksho haristatha || 72|| ajaikapalapalica
    trishankurajitah shivah | dhanvatarirdhumraketuh skando vaishravanastatha || 73|| dhata shakrashca
    vishvashca mitrastvashthadhruvo vasuh | prabhavah sarvago vayuraryamasavitarathih || 74|| ugradamshtro
    vidhata ca mandhata bhutabhavanah | ratistirthashca vagmi ca sarvakarmagunavaha || 75|| padmavakro
    mahavakrashcandravakro manoramah | valayanyashca shantashca puranah punyavarcasah || 76|| kurukarta
    kalarupi kurubhuto maheshvarah | sharvo sarvo darbhashayi sarvesham praninam patih || 77|| devadeva
    sukhashaktah sadasatsamvararatnavit | kailasashikhiravasi himavadgirisamshrayah || 78|| kulahari kulakartta
    bahubijo bahupradah | vanijo varddhano daksho nakulashcadanashchadah || 79|| saragrivi mahajanturatnakashca
    mahaushadhih | siddharthakari siddharthah chando vyakaranani ca || 80|| simhanadah simhadamshtrah
    simhagah simhavahanah | prabhavatma jarastalollokahitantakah || 81|| sarago'sukhavakranta ketumali
    svabhavatah | bhutashrayo bhutapatirahoratramanindakah || 82|| asanah sarvabhutanam nilayah vibhubhairavah
    | amoghasarvabhushasyo yajanah pranaharakah || 83|| dhritiman jnatiman dakshah satkritashca yugadhipah
    | gopalo gopatirgopta goshcavasano harah || 84|| hiranyabahushca tatha guhayakalah praveshakah | pratishthayam
    mahaharshonjitakamo jitendriyah || 85|| gandharashca sushilashca tapah karmaratirdhanah | mahagito
    mahabrahmarhmaksharo ganasevitah || 86|| mahaketuh karmadhatanaikatanashcaracarah | avedaniya aveshah
    sarvagandhasukhavahah || 87|| toranastarano vayuh paridhavati caitakah | samyogo varddhano vriddho
    mahavriddho ganadhipah || 88|| nityo dharmasahayashca devasurapatih patih | amukto mustabahushca dvividhashca
    suparvanah || 89|| ashadhashca sukhadhyashca dhruvo harihayo harih | vasuravarttano nityo vasushreshtho
    mahamadah || 90|| shirohari ca varshi ca sarvalakshanabhushitah | aksharashcakshayo yogi sarvayogi
    mahavalah || 91|| samamnayo'samamnayastirthadevo mahadyutih | nirbijo jivano mantro anagho bahukarkashah
    || 92|| raktaprabhuto raktango maharnavaninadakrit | mulo vishakho yamritoktayaktovyah sanatanah ||
    93|| arohano niramhashca shailahari mahatapah | senakalpo mahakalpo yugo yugankaro harih || 94|| yugarupo
    maharupo pavano gahano nagah | nyayanirvapano nadah panditohyacalopamah || 95|| bahumalo mahamalah
    sumalo bahulocanah | vistaro lavanah krurah ritumasaphalodayah || 96|| vrishabho vrishabhagango manibandhurjatadharah
    | indro visargah sumukhah surah sarvayudhah sahah || 97|| niveshanah sudhanva ca pugagandho mahahanuh
    | gandhamali ca bhagavan sanandah sarvakarmanam || 98|| matmano bahulo bahuh sakalah sarvalocanah
    | rudrastalikarastali urdhvasamhatalocanah || 99|| chatrapadmah suvikhyatah sarvalokashrayo mahan
    | mundo virupo bahulo dandi mundo vikundalah || 100|| haryakshah kakubhoka vajri diptavarcah sahasrapat
    | sahasramurddha devedrah sarvabhutamayo hari || 101|| sahasrabahuh sarvangah sharanyah sarvakarmakrit
    | pavitrah snigdhayurmantrah kanishthah krishnapingalah || 102|| brahmadandavinirvatah sharaghnah
    sharatapadhrik | padmagarbho mahagarbho padmagarbho jalodbhava || 103|| gabhastirbrahmakrit brahma
    brahmakrid brahmano gati | anantarupo naikatma tagmatejatmasambhavah || 104|| urdhvagatma pashupatih
    vituranga manojavah | vandani padmamali ca gunajno svagunottarah || 105|| karnikaro mahasragvi nilamauli
    pinakadhrik | umapatirumakanto jahnavihridayangamah || 106|| viro varaho varado vareshashca mahamana
    | mahaprabhavastvanaghah shatruha shvetapingalah || 107|| pritatma prayattatma ca samyatatma pradhanadhrik
    | sarvaparshvastutastarkshyo dharmah sadharano varah || 108|| caracaratma sukshmatma govrisho govrisheshcarah
    | sadhyarshirvasuradityo vivasvan savita mrigah || 109|| vyasah sarvasya sankshepo vistarah paryayonayah
    | rituh samvatsaro masah pakshah sankhya parayanah || 110|| kala kashta layo matra muhurtah pakshapakshanah
    | vishvakshetram prajabijam lingamadyastvaninditah || 111|| sadvyavatamavyakta pita mata pitamahah
    | svargadvaram prajadvaram mokshadvaram trivishtapam || 112|| nirvanam jnanadam caiva brahmaloka paragatih
    | devasuragururdevo devasuranamaskritah || 113|| devasuramahamatro devasurasamashraya | devasuraganadhyaksho
    devasuraganadhipah || 114|| devasureshvaro devo devasuramaheshvarah | sarvadevamayo cintyo devanamatmasambhavah
    || 115|| udbhijjastrikramo vaidyo virajo varado varah | ijyo hastimukho vyaghri devasimho nararshabhah
    || 116|| vibudhagravarashreshthah sarvadevottamottamah | guruh kanto nijah sarvah pavitrah sarvavahanah
    || 117|| prayuktah shobhano vajra ishanah prabhuravyayah | bhrigi bhringapriyo babhru rajarajo niramayah
    || 118|| aviramah susharano viramah sarvasadhanah | lalataksho vishvadeho harino brahmavarcasi ||
    119|| sthavaranam patishcaiva niyamendriyavarddhanah | siddharthah sarvasiddharthonityah satyavratah
    shucih || 120|| vratadiryatparam brahma muktanam paramagatih | vimukto dirghatejashca shriman shrivarddhano
    jagat || 121|| yatha prasado bhagavaniti bhaktya stuto maya | yanna brahmadayo deva viduryanna maharshayah
    || 122|| tamstavimyahamadyam ca kastoshyati jagatprabhum | bhaktishcaiva puraskritya maya yajnapatirvasuh
    || 123|| tato'nujnapayamasastuto matimatam gatih | shiva evam stuto devaih namabhih pushtivarddhanaih
    || 124|| nityayuktah shucirbhutva prapnyotyatmanamatmanah | etaddhiparamam brahma svayangitam svayambhuva
    || 125|| rishayashcaiva devashca stuvantyete nu tatparam | stuyamano mahadevah priyate catmanapatih
    || 126|| bhaktanukampi bhagavanatmasamsthan karoti tan | tathaiva ca manushyeshu yatra kutra pradhanatah
    || 127|| astikah shraddadhanashca bahubhirjanmabhih stavaih | jagratotha svapatashca vrajanto gatisamsthitah
    || 128|| stuvanti stuyamane ca catushpathi ramanti ca | janmakotisahasreshu nanasamsarayonishu ||
    129|| jantorvishuddhapapasya bhave bhaktih prajayate | utpanna ca bhave bhaktirananya sarvabhavatah
    || 130|| etaddeveshu duhprapo manusheshu na labhyate | nirvighna nishcala bhadre bhaktiravyabhicarini
    || 131|| tasyaiva ca prasadena bhaktirutpadyate nripa | yaya yati param siddhim tadbhagavatamanasah
    || 132|| ye sarvabhavopahatah paratvenanubhavitah | prapannavatsala devah samsarattan samuddharet
    || 133|| evamanyepi kurvanti devah samsaramocanam | manushyanam mahadevadanyatrapi tapobalat || 134||
    iti tenedam kalyayaya bhagavan sadasat patih | krittivasa dhuvam purvam tadita shuddhabuddhayah ||
    135|| stavamenam bhagavati brahmo svayamadharayat | brahma provaca shakraya shakrah provaca mrityave
    || 136|| mrityuh provaca rudrebhyo rudrebhyastandimagayat | mahata tapasa praptastandina brahma sammatih
    || 137|| standih provaca shukraya gautamayaha bhargavah | vaivasvataya bhagavan gautamah praha sadhave
    || 138|| narayanaya sadhyaya manurishtaya dhimate | yamaya praha bhagavan sadhyo narayanovyayah ||
    139|| naciketaya bhagavanaha vaivasvato yamah | markandeyaya varshneya naciketabhyabhashata || 140||
    tathapyahamamitraghnastavanddhadya vishrutam | svargyamarogayamayushyam dhanyam vedaishca sammitam
    || 141|| nasya vighnani kurvanti danava yaksharakshasah | pishaca yatudhantashca guhyaka bhujaga api
    || 142|| ya pathetprayatah pratarbrahmacari jitendriya | abhinnayogo varshantu ashvamedhaphalam labhet
    || 143|| ityakasha bhairavatantre hariharabrahmaviracite | sharabhasahasranamastotram sampurnam ||
    144|| || iti akashabhairavatantre hariharaviracitam shrisharabhasahasranamastotram sampurnam ||
  devanagari: निमत्तश्च नन्दिर्नादकरो हरिः । नदीश्वरश्च नन्दी च नन्दिनो नन्दिवर्द्धनः ॥ ४५॥ भगहारी निहन्ता
    च कालो ब्रह्मा पितामहः । चतुर्मुखो महालिङ्गश्चतुर्लिङ्गस्थैव च ॥ ४६॥ लिङ्गाध्यक्षः सुराध्यक्षो योगाध्यक्षो
    युगावहः । बीजाध्यक्षो बीजकर्त्ता अध्यात्मानुगतो बलः ॥ ४७॥ इतिहासः सकल्पश्च गौतमोथ निशाकरः । दभोह्यदभो
    वैदम्भो वश्यो वश्यकरः कलिः ॥ ४८॥ लोककर्ता पशुपतिर्महाकर्ता ह्यनौषधः । अक्षरं परमं ब्रह्म वलटाच्छन्न
    एव च ॥ ४९॥ नीतिर्ह्यनीतिः शुद्धात्मा शुद्धो मान्यो गतागतिः । बहुप्रसाद सुस्वप्नो दर्पणोथत्वमित्रजित्
    ॥ ५०॥ वेदकारो मन्त्रकारो विद्वान्समरमर्दनः । महामोघनिवासी च महाघोरो वशीकरः ॥ ५१॥ अग्निज्वालो महाज्वालो
    अतिधूम्रो हुतो हविः । वृषलः शङ्करो नित्यो वर्चसी धूम्रलोचनः ॥ ५२॥ नीलस्तथाङ्गलुब्धश्च शोभनो निरवग्रहः
    । स्वस्तिदः स्वस्तिभावश्च भोगी भोगकरो लघुः ॥ ५३॥ उत्सङ्गश्च महाङ्गश्च महाभोगो परायणः । कृष्णवर्णः
    सुवर्णश्च इन्द्रियं सर्वदेहिनाम् ॥ ५४॥ महापादो महाहस्तो महाकायो महायशाः । महामूर्द्धा महामात्रो महानेत्रो
    निशालयः ॥ ५५॥ महान्तको महाकर्णो महोक्षश्च महाहनुः । महाननो महाकंवुर्महाग्रीवः श्मशानभाक् ॥ ५६॥ महावक्षा
    महोरस्को ह्यन्तरामा मृगालयः । लम्बितो लम्बितोष्टश्च महामाया पयोनिधि ॥ ५७॥ महादन्तो महादंष्ट्रो महाजिह्वो
    महामुखः । महानखो महारोमा महाकेशो महाजरः ॥ ५८॥ प्रसन्नश्च प्रसादश्च प्रतयो योगिसाधनः । स्नेहनोतिशुभस्नेहः
    अजितश्च महामुनिः ॥ ५९॥ वृक्षकारो वृक्षकेतुः अनलो वायुवाहनः । मण्डली धामश्च देवाधिपतिरेव च ॥ ६०॥ अथर्वशीर्षः
    सामास्यः ऋक् साहस्र मितेक्षणः । यजुः पादभुजागुह्यः प्रकाशो जङ्गमस्तथा ॥ ६१॥ अमोधार्थप्रसादश्च अतिगम्यः
    सुदर्शनः । उपकारप्रियः सर्वः कनकः काञ्चनस्थितः ॥ ६२॥ नाभिर्नदिकरो भावः पुष्करस्य पतिस्थिरः । द्वादशास्त्रमसश्वाघो
    यज्ञो यज्ञसमाहितः ॥ ६३॥ नक्तं कलिश्च कालश्च ककारः कालपूजितः । सवाणो गणकारश्च भूतवाहनसारथिः ॥ ६४॥ भस्मशायी
    भस्मगोप्ता भस्मभूतस्तमोगुणः । लोकपालस्तथा लोको महात्मा सर्वपूजितः ॥ ६५॥ शुक्लस्त्रिशुक्लसम्पन्नः शुचिर्भूतनिषेवितः
    । आश्रमस्थः क्रियावस्थो विश्वकर्मा मतिर्वरः ॥ ६६॥ विशालशाखस्ताम्रोष्टोह्यम्बुजालः सुनिश्चलः । कपिलः
    कपिलः शुक्ल आयुश्चैव परोवरः ॥ ६७॥ गन्धर्वो ह्यदितिस्तार्क्ष्यः सुविज्ञेयः सुशारदः । परश्वधायुधो देव
    अन्धकारिः सुवान्धवः ॥ ६८॥ तुम्बवीणो महाक्रोध ऊर्ध्वंरेता जलेशयः । उग्रो वंशकरो द्वंशो वंशनादोह्यनिन्दितः
    ॥ ६९॥ सर्वाङ्गरूपो मायावी सुह्यदोह्यनिलोनलः । बन्धनो बन्धकर्ता च सुबधुरविमोचनः ॥ ७०॥ मेषजारिः सुकर्मारिर्महादंष्ट्रसमो
    युधि । बहुस्वनिर्मितः सर्वः शङ्करः शङ्करो वरः ॥ ७१॥ अमरेशो महादेवो विश्वदेवः सुरारिहा । निसङ्गश्चाहिर्बुध्य्नश्चाकिताक्षो
    हरिस्तथा ॥ ७२॥ अजैकपालपालीच त्रिशङ्कुरजितः शिवः । धन्वतरिर्धूम्रकेतुः स्कन्दो वैश्रवणस्तथा ॥ ७३॥ धाता
    शक्रश्च विश्वश्च मित्रस्त्वष्ठाध्रुवो वसुः । प्रभावः सर्वगो वायुरर्यमासवितारथिः ॥ ७४॥ उग्रदंष्ट्रो
    विधाता च मान्धाता भूतभावनः । रतिस्तीर्थश्च वाग्मी च सर्वकर्मगुणावह ॥ ७५॥ पद्मवक्रो महावक्रश्चन्द्रवक्रो
    मनोरमः । वलयान्यश्च शान्तश्च पुराणः पुण्यवर्चसः ॥ ७६॥ कुरुकर्ता कालरूपी कुरुभूतो महेश्वरः । शर्वो
    सर्वो दर्भशायी सर्वेषां प्राणिनां पतिः ॥ ७७॥ देवदेव सुखाशक्तः सदसत्संवररत्नवित् । कैलासशिखिरावासी
    हिमवद्गिरिसंश्रयः ॥ ७८॥ कूलहारी कूलकर्त्ता बहुबीजो बहुप्रदः । वनिजो वर्द्धनो दक्षो नकुलश्चदनश्छदः
    ॥ ७९॥ सारग्रीवी महाजन्तुरत्नकश्च महौषधिः । सिद्धार्थकारी सिद्धार्थः छन्दो व्याकरणानि च ॥ ८०॥ सिंहनादः
    सिंहदंष्ट्रः सिंहगः सिंहवाहनः । प्रभावात्मा जरास्तालोल्लोकाहितान्तकः ॥ ८१॥ सारगोऽसुखवक्रान्त केतुमाली
    स्वभावतः । भूताश्रयो भूतपतिरहोरात्रमनिन्दकः ॥ ८२॥ आसनः सर्वभूतानां निलयः विभुभैरवः । अमोघसर्वभूषास्यो
    याजनः प्राणहारकः ॥ ८३॥ धृतिमान् ज्ञातिमान् दक्षः सत्कृतश्च युगाधिपः । गोपालो गोपतिर्गोप्ता गोश्चवसनो
    हरः ॥ ८४॥ हिरण्यबाहुश्च तथा गुहयकालः प्रवेशकः । प्रतिष्ठायां महाहर्षोञ्जितकामो जितेन्द्रियः ॥ ८५॥
    गान्धारश्च सुशीलश्च तपः कर्मरतिर्धनः । महागीतो महाब्रह्मार्ह्मक्षरो गणसेवितः ॥ ८६॥ महाकेतुः कर्मधातनैकतानश्चराचरः
    । अवेदनीय आवेशः सर्वगन्धसुखावहः ॥ ८७॥ तोरणास्तरणो वायुः परिधावति चैतकः । संयोगो वर्द्धनो वृद्धो महावृद्धो
    गणाधिपः ॥ ८८॥ नित्यो धर्मसहायश्च देवासुरपतिः पतिः । अमुक्तो मुस्तबाहुश्च द्विविधश्च सुपर्वणः ॥ ८९॥
    आषाढश्च सुखाढ्यश्च ध्रुवो हरिहयो हरिः । वसुरावर्त्तनो नित्यो वसुश्रेष्ठो महामदः ॥ ९०॥ शिरोहारी च वर्षी
    च सर्वलक्षणभूषितः । अक्षरश्चाक्षयो योगी सर्वयोगी महावलः ॥ ९१॥ समाम्नायोऽसमाम्नायस्तीर्थदेवो महाद्युतिः
    । निर्बीजो जीवनो मन्त्रो अनघो बहुकर्कशः ॥ ९२॥ रक्तप्रभूतो रक्ताङ्गो महार्णवनिनादकृत् । मूलो विशाखो
    यमृतोक्तयक्तोव्यः सनातनः ॥ ९३॥ आरोहणो निरंहश्च शैलहारी महातपाः । सेनाकल्पो महाकल्पो युगो युगङ्करो
    हरिः ॥ ९४॥ युगरूपो महारूपो पवनो गहनो नगः । न्यायनिर्वापणो नादः पण्डितोह्यचलोपमः ॥ ९५॥ बहुमालो महामालः
    सुमालो बहुलोचनः । विस्तारो लवणः क्रूरः ऋतुमासफलोदयः ॥ ९६॥ वृषभो वृषभागाङ्गो मणिबन्धुर्जटाधरः । इन्द्रो
    विसर्गः सुमुखः सुरः सर्वायुधः सहः ॥ ९७॥ निवेशनः सुधन्वा च पूगगन्धो महाहनुः । गन्धमाली च भगवान् सानन्दः
    सर्वकर्मणाम् ॥ ९८॥ मात्मनो बाहुलो बाहुः सकलः सर्वलोचनः । रुद्रस्तालीकरस्ताली ऊर्ध्वसंहतलोचनः ॥ ९९॥
    छत्रपद्मः सुविख्यातः सर्वलोकाश्रयो महान् । मुण्डो विरूपो बहुलो दण्डी मुण्डो विकुण्डलः ॥ १००॥ हर्यक्षः
    ककुभोक वज्री दीप्तावर्चः सहस्रपात् । सहस्रमूर्द्धा देवेद्रः सर्वभूतमयो हरि ॥ १०१॥ सहस्रबाहुः सर्वाङ्गः
    शरण्यः सर्वकर्मकृत् । पवित्रः स्निग्धयुर्मन्त्रः कनिष्ठः कृष्णपिङ्गलः ॥ १०२॥ ब्रह्मदण्डविनिर्वातः
    शरघ्नः शरतापधृक् । पद्मगर्भो महागर्भो पद्मगर्भो जलोद्भव ॥ १०३॥ गभस्तिर्ब्रह्मकृत् ब्रह्म ब्रह्मकृद्
    ब्राह्मणो गति । अनन्तरूपो नैकात्मा तग्मतेजात्मसम्भवः ॥ १०४॥ ऊर्ध्वगात्मा पशुपतिः वीतुरङ्गा मनोजवः
    । वन्दनी पद्ममाली च गुणज्ञो स्वगुणोत्तरः ॥ १०५॥ कर्णिकारो महास्रग्वी नीलमौली पिनाकधृक् । उमापतिरुमाकान्तो
    जाह्नवीहृदयङ्गमः ॥ १०६॥ वीरो वराहो वरदो वरेशश्च महामना । महाप्रभावस्त्वनघः शत्रुहा श्वेतपिङ्गलः ॥
    १०७॥ प्रीतात्मा प्रयत्तात्मा च संयतात्मा प्रधानधृक् । सर्वपार्श्वस्तुतस्तार्क्ष्यो धर्मः साधारणो वरः
    ॥ १०८॥ चराचरात्मा सूक्ष्मात्मा गोवृषो गोवृषेश्चरः । साध्यर्षिर्वसुरादित्यो विवस्वान् सविता मृगः ॥
    १०९॥ व्यासः सर्वस्य सङ्क्षेपो विस्तारः पर्ययोनयः । ऋतुः संवत्सरो मासः पक्षः सङ्ख्या परायणः ॥ ११०॥
    कला काष्टा लयो मात्रा मुहूर्तः पक्षपाक्षणः । विश्वक्षेत्रं प्रजाबीजं लिङ्गमाद्यस्त्वनिन्दितः ॥ १११॥
    सद्व्यवतमव्यक्त पिता माता पितामहः । स्वर्गद्वारं प्रजाद्वारं मोक्षद्वारं त्रिविष्टपम् ॥ ११२॥ निर्वाणं
    ज्ञानदं चैव ब्रह्मलोक परागतिः । देवासुरगुरुर्देवो देवासुरनमस्कृतः ॥ ११३॥ देवासुरमहामात्रो देवासुरसमाश्रय
    । देवासुरगणाध्यक्षो देवासुरगणाधिपः ॥ ११४॥ देवासुरेश्वरो देवो देवासुरमहेश्वरः । सर्वदेवमयो चिन्त्यो
    देवानामात्मसम्भवः ॥ ११५॥ उद्भिज्जस्त्रिक्रमो वैद्यो विराजो वरदो वरः । ईज्यो हस्तिमुखो व्याघ्री देवसिंहो
    नरर्षभः ॥ ११६॥ विबुधाग्रवरश्रेष्ठः सर्वदेवोत्तमोत्तमः । गुरुः कान्तो निजः सर्वः पवित्रः सर्ववाहनः
    ॥ ११७॥ प्रयुक्तः शोभनो वज्र ईशानः प्रभुरव्ययः । भृगी भृङ्गप्रियो बभ्रू राजराजो निरामयः ॥ ११८॥ अविरामः
    सुशरणो विरामः सर्वसाधनः । ललाटाक्षो विश्वदेहो हारिणो ब्रह्मवर्चसी ॥ ११९॥ स्थावराणां पतिश्चैव नियमेन्द्रियवर्द्धनः
    । सिद्धार्थः सर्वसिद्धार्थोनित्यः सत्यव्रतः शुचिः ॥ १२०॥ व्रतादिर्यत्परं ब्रह्म मुक्तानां परमागतिः
    । विमुक्तो दीर्घतेजाश्च श्रीमान् श्रीवर्द्धनो जगत् ॥ १२१॥ यथा प्रसादो भगवानिति भक्त्या स्तुतो मया
    । यन्न ब्रह्मादयो देवा विदुर्यन्न महर्षयः ॥ १२२॥ तंस्तवीम्यहमाद्यं च कस्तोष्यति जगत्प्रभुम् । भक्तिश्चैव
    पुरस्कृत्य मया यज्ञपतिर्वसुः ॥ १२३॥ ततोऽनुज्ञापयामासस्तुतो मतिमतां गतिः । शिव एवं स्तुतो देवैः नामभिः
    पुष्टिवर्द्धनैः ॥ १२४॥ नित्ययुक्तः शुचिर्भूत्वा प्राप्न्योत्यात्मानमात्मनः । एतद्धिपरमं ब्रह्मा स्वयङ्गीतं
    स्वयम्भुवा ॥ १२५॥ ऋषयश्चैव देवाश्च स्तुवन्त्येते नु तत्परम् । स्तूयमानो महादेवः प्रीयते चात्मनापतिः
    ॥ १२६॥ भक्तानुकम्पी भगवानात्मसंस्थान् करोति तान् । तथैव च मनुष्येषु यत्र कुत्र प्रधानतः ॥ १२७॥ आस्तिकः
    श्रद्दधानश्च बहुभिर्जन्मभिः स्तवैः । जाग्रतोथ स्वपतश्च व्रजन्तो गतिसंस्थिताः ॥ १२८॥ स्तुवन्ति स्तूयमाने
    च चतुष्पथि रमन्ति च । जन्मकोटिसहस्रेषु नानासंसारयोनिषु ॥ १२९॥ जन्तोर्विशुद्धपापस्य भवे भक्तिः प्रजायते
    । उत्पन्ना च भवे भक्तिरनन्या सर्वभावतः ॥ १३०॥ एतद्देवेषु दुःप्रापो मानुषेषु न लभ्यते । निर्विघ्ना
    निश्चला भद्रे भक्तिरव्यभिचारिणी ॥ १३१॥ तस्यैव च प्रसादेन भक्तिरुत्पद्यते नृप । यया याति परां सिद्धिं
    तद्भागवतमानसः ॥ १३२॥ ये सर्वभावोपहताः परत्वेनानुभाविताः । प्रपन्नवत्सला देवः संसारात्तान् समुद्धरेत्
    ॥ १३३॥ एवमन्येपि कुर्वन्ति देवाः संसारमोचनम् । मनुष्याणां महादेवादन्यत्रापि तपोबलात् ॥ १३४॥ इति तेनेदं
    कल्यायाय भगवान् सदसत् पतिः । कृत्तिवासा धुवं पूर्वं ताडिता शुद्धबुद्धयः ॥ १३५॥ स्तवमेनं भगवति ब्रह्मो
    स्वयमधारयत् । ब्रह्मा प्रोवाच शक्राय शक्रः प्रोवाच मृत्यवे ॥ १३६॥ मृत्युः प्रोवाच रुद्रेभ्यो रुद्रेभ्यस्तण्डिमागयत्
    । महता तपसा प्राप्तस्तण्डिना ब्रह्म सम्मतिः ॥ १३७॥ स्तण्डीः प्रोवाच शुक्राय गौतमायाह भार्गवः । वैवस्वताय
    भगवान् गौतमः प्राह साधवे ॥ १३८॥ नारायणाय साध्याय मनुरिष्टाय धीमते । यमाय प्राह भगवान् साध्यो नारायणोव्ययः
    ॥ १३९॥ नाचिकेताय भगवानाह वैवस्वतो यमः । मार्कण्डेयाय वार्ष्णेय नाचिकेताभ्यभाषत ॥ १४०॥ तथाप्यहममित्रघ्नस्तावन्द्धाद्य
    विश्रुतम् । स्वर्ग्यमारोगयमायुष्यं धन्यं वेदैश्च सम्मितम् ॥ १४१॥ नास्य विघ्नानि कुर्वन्ति दानवा यक्षराक्षसाः
    । पिशाचा यातुधान्ताश्च गुह्यका भुजगा अपि ॥ १४२॥ य पठेत्प्रयतः प्रातर्ब्रह्माचारी जितेन्द्रिय । अभिन्नयोगो
    वर्षन्तु अश्वमेधफलं लभेत् ॥ १४३॥ इत्याकाश भैरवतन्त्रे हरिहरब्रह्मविरचिते । शरभसहस्रनामस्तोत्रं सम्पूर्णम्
    ॥ १४४॥ ॥ इति आकाशभैरवतन्त्रे हरिहरविरचितम् श्रीशरभसहस्रनामस्तोत्रं सम्पूर्णम् ॥
