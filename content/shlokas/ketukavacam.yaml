id: ketukavacam
category: kavacha
name:
  english: ketukavacam
  devanagari: केतुकवचम्
content:
  english: ketuprasadasiddhyarthe jape viniyogah | shriganeshaya namah | ketum karalavadanam citravarnam
    kiritinam | pranamami sada ketum dhvajakaram graheshvaram || 1|| citravarnah shirah patu bhalam dhumrasamadyutih
    | patu netre pingalakshah shruti me raktalocanah || 2|| ghranam patu suvarnabhashcibukam simhikasutah
    | patu kantham ca me ketuh skandhau patu grahadhipah || 3|| hastau patu surashreshthah kukshim patu
    mahagrahah | simhasanah katim patu madhyam patu mahasurah || 4|| uru patu mahashirsho januni me'tikopanah
    | patu padau ca me krurah sarvangam narapingalah || 5|| ya idam kavacam divyam sarvarogavinashanam
    | sarvashatruvinasham ca dharanadvijayi bhavet || 6|| || iti shribrahmandapurane ketukavacam sampurnam
    ||
  devanagari: केतुप्रसादसिद्ध्यर्थे जपे विनियोगः । श्रीगणेशाय नमः । केतुं करालवदनं चित्रवर्णं किरीटिनम्
    । प्रणमामि सदा केतुं ध्वजाकारं ग्रहेश्वरम् ॥ १॥ चित्रवर्णः शिरः पातु भालं धूम्रसमद्युतिः । पातु नेत्रे
    पिङ्गलाक्षः श्रुती मे रक्तलोचनः ॥ २॥ घ्राणं पातु सुवर्णाभश्चिबुकं सिंहिकासुतः । पातु कण्ठं च मे केतुः
    स्कन्धौ पातु ग्रहाधिपः ॥ ३॥ हस्तौ पातु सुरश्रेष्ठः कुक्षिं पातु महाग्रहः । सिंहासनः कटिं पातु मध्यं
    पातु महासुरः ॥ ४॥ ऊरू पातु महाशीर्षो जानुनी मेऽतिकोपनः । पातु पादौ च मे क्रूरः सर्वाङ्गं नरपिङ्गलः
    ॥ ५॥ य इदं कवचं दिव्यं सर्वरोगविनाशनम् । सर्वशत्रुविनाशं च धारणाद्विजयी भवेत् ॥ ६॥ ॥ इति श्रीब्रह्माण्डपुराणे
    केतुकवचं सम्पूर्णम् ॥
