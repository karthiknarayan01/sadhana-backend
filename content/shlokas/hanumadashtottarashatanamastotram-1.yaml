id: hanumadashtottarashatanamastotram-1
category: stotram
name:
  english: hanumadashtottarashatanamastotram 1
  devanagari: हनुमदष्टोत्तरशतनामस्तोत्रम् १
content:
  english: narada uvaca | sarvashastrarthatattvajna sarvadevanamaskrita | yattvaya kathitam purvam ramacandrena
    dhimata || 1|| stotram samastapapaghnam shrutva dhanyo'smi padmaja | idanim shrotumicchami lokanam
    hitakamyaya || 2|| vayoramshavataranamahatmyam sarvakamadam | vada me vistaradbrahman devaguhyamanuttamam
    || 3|| iti prishto naradena brahma lokapitamahah | namaskritya jagannatham lakshmikantam paratparam
    || 4|| provaca vayormahatmyam naradaya mahatmane | yacchrutva sarvasaubhagyam prapnuvanti janah sada
    || 5|| brahmovaca | idam rahasyam papaghnam vayorashtottaram shatam | vishnuna lokanathena ramayai
    kathitam pura || 6|| rama mamaha yaddivyam tatte vakshyami narada | idam pavitram papaghnam shraddhaya
    hridi dharaya || 7|| om hanumananjanaputro vayusunurmahabalah | ramaduto harishreshthah suri kesarinandanah
    || suryashreshtho mahakayo vajri vajrapraharavan | mahasattvo maharupo brahmanyo brahmanapriyah ||
    9|| mukhyaprano mahabhimah purnaprajno mahaguruh | brahmacari vrikshadharah punyah shriramakinkarah
    || 10|| sitashokavinashi ca simhikaprananashakah | mainakagarvabhangashca chayagrahanivarakah || 11||
    lankamokshaprado devah sitamarganatatparah | ramangulipradata ca sitaharshavivardhanah || 12|| maharupadharo
    divyo hyashokavananashakah | mantriputraharo virah pancasenagramardanah || 13|| dashakanthasutaghnashca
    brahmastravashago'vyayah | dashasyasallapaparo lankapuravidahakah || 14|| tirnabdhih kapirajashca
    kapiyuthapraranjakah | cudamanipradata ca shrivashyah priyadarshakah || 15|| kaupinakundaladharah
    kanakangadabhushanah | sarvashastrasusampannah sarvajno jnanadottamah || 16|| mukhyaprano mahavegah
    shabdashastravisharadah | buddhiman sarvalokeshah suresho lokaranjakah || 17|| lokanatho mahadarpah
    sarvabhutabhayapahah | ramavahanarupashca sanjivacalabhedakah || 18|| kapinam pranadata ca lakshmanapranarakshakah
    | ramapadasamipastho lohitasyo mahahanuh || 19|| ramasandeshakarta ca bharatanandavardhanah | ramabhishekalolashca
    ramakaryadhurandharah || 20|| kuntigarbhasamutpanno bhimo bhimaparakramah | lakshagrihadvinirmukto
    hidimbasuramardanah || 21|| dharmanujah panduputro dhananjayasahayavan | bakasuravadhodyuktastadgramaparirakshakah
    || 22|| bhikshahararato nityam kulalagrihamadhyagah | pancalyudvahasanjatasammodo bahukantiman ||
    23|| viratanagare gudhacarah kicakamardanah | duryodhananihanta ca jarasandhavimardanah || 24|| saugandhikapaharta
    ca draupadipranavallabhah | purnabodho vyasashishyo yatirupo mahamatih || 25|| durvadigajasimhasya
    tarkashastrasya khandakah | bauddhagamavibhetta ca sankhyashastrasya dushakah || 26|| dvaitashastrapraneta
    ca vedavyasamatanugah | purnanandah purnasatvah purnavairagyasagarah || 27|| iti shrutva naradastu
    vayoshcaritamadbhutam | muda paramaya yuktah stotum samupacakrame || 28|| ramavatarajataya hanumadrupine
    namah | vasudevasya bhaktaya bhimasenaya te namah || 29|| vedavyasamatoddharakartre purnasukhaya ca
    | durvadidhvantacandraya purnabodhaya te namah || 30|| gururajaya dhanyaya kanjanetraya te namah |
    divyarupaya shantaya namaste yatirupine || 31|| svantasthavasudevaya saccittaya namo namah | ajnanatimirarkaya
    vyasashishyaya te namah || 32|| athabhivandya pitaram brahmanam narado munih | parikramya viniryato
    vasudevam harim smaran || 33|| ashtottarashatam divyam vayusunormahatmanah | yah pathecchraddhaya
    nityam sarvabandhat pramucyate || 34|| sarvarogavinirmuktah sarvapapairna lipyate | rajavashyam bhavennityam
    stotrasyasya prabhavatah || 35|| bhutagrahanivrittishca prajavriddhishca jayate | ayurarogyamaishvaryam
    balam kirtim labhet puman || 36|| yah pathedvayucaritam bhaktya paramaya yutah | sarvajnanasamayuktah
    sa yati paramam padam || 36|| iti shripadmottarakhandatah shrihanumadashtottarashatanamastotram sampurnam
    |
  devanagari: नारद उवाच । सर्वशास्त्रार्थतत्त्वज्ञ सर्वदेवनमस्कृत । यत्त्वया कथितं पूर्वं रामचन्द्रेण
    धीमता ॥ १॥ स्तोत्रं समस्तपापघ्नं श्रुत्वा धन्योऽस्मि पद्मज । इदानीं श्रोतुमिच्छामि लोकानां हितकाम्यया
    ॥ २॥ वायोरंशावतरणमाहात्म्यं सर्वकामदम् । वद मे विस्तराद्ब्रह्मन् देवगुह्यमनुत्तमम् ॥ ३॥ इति पृष्टो
    नारदेन ब्रह्मा लोकपितामहः । नमस्कृत्य जगन्नाथं लक्ष्मीकान्तं परात्परम् ॥ ४॥ प्रोवाच वायोर्माहात्म्यं
    नारदाय महात्मने । यच्छ्रुत्वा सर्वसौभाग्यं प्राप्नुवन्ति जनाः सदा ॥ ५॥ ब्रह्मोवाच । इदं रहस्यं पापघ्नं
    वायोरष्टोत्तरं शतम् । विष्णुना लोकनाथेन रमायै कथितं पुरा ॥ ६॥ रमा मामाह यद्दिव्यं तत्ते वक्ष्यामि
    नारद । इदं पवित्रं पापघ्नं श्रद्धया हृदि धारय ॥ ७॥ ॐ हनुमानञ्जनापुत्रो वायुसूनुर्महाबलः । रामदूतो
    हरिश्रेष्ठः सूरी केसरीनन्दनः ॥ सूर्यश्रेष्ठो महाकायो वज्री वज्रप्रहारवान् । महासत्त्वो महारूपो ब्रह्मण्यो
    ब्राह्मणप्रियः ॥ ९॥ मुख्यप्राणो महाभीमः पूर्णप्रज्ञो महागुरुः । ब्रह्मचारी वृक्षधरः पुण्यः श्रीरामकिङ्करः
    ॥ १०॥ सीताशोकविनाशी च सिंहिकाप्राणनाशकः । मैनाकगर्वभङ्गश्च छायाग्रहनिवारकः ॥ ११॥ लङ्कामोक्षप्रदो देवः
    सीतामार्गणतत्परः । रामाङ्गुलिप्रदाता च सीताहर्षविवर्धनः ॥ १२॥ महारूपधरो दिव्यो ह्यशोकवननाशकः । मन्त्रिपुत्रहरो
    वीरः पञ्चसेनाग्रमर्दनः ॥ १३॥ दशकण्ठसुतघ्नश्च ब्रह्मास्त्रवशगोऽव्ययः । दशास्यसल्लापपरो लङ्कापुरविदाहकः
    ॥ १४॥ तीर्णाब्धिः कपिराजश्च कपियूथप्ररञ्जकः । चूडामणिप्रदाता च श्रीवश्यः प्रियदर्शकः ॥ १५॥ कौपीनकुण्डलधरः
    कनकाङ्गदभूषणः । सर्वशास्त्रसुसम्पन्नः सर्वज्ञो ज्ञानदोत्तमः ॥ १६॥ मुख्यप्राणो महावेगः शब्दशास्त्रविशारदः
    । बुद्धिमान् सर्वलोकेशः सुरेशो लोकरञ्जकः ॥ १७॥ लोकनाथो महादर्पः सर्वभूतभयापहः । रामवाहनरूपश्च सञ्जीवाचलभेदकः
    ॥ १८॥ कपीनां प्राणदाता च लक्ष्मणप्राणरक्षकः । रामपादसमीपस्थो लोहितास्यो महाहनुः ॥ १९॥ रामसन्देशकर्ता
    च भरतानन्दवर्धनः । रामाभिषेकलोलश्च रामकार्यधुरन्धरः ॥ २०॥ कुन्तीगर्भसमुत्पन्नो भीमो भीमपराक्रमः ।
    लाक्षागृहाद्विनिर्मुक्तो हिडिम्बासुरमर्दनः ॥ २१॥ धर्मानुजः पाण्डुपुत्रो धनञ्जयसहायवान् । बकासुरवधोद्युक्तस्तद्ग्रामपरिरक्षकः
    ॥ २२॥ भिक्षाहाररतो नित्यं कुलालगृहमध्यगः । पाञ्चाल्युद्वाहसञ्जातसम्मोदो बहुकान्तिमान् ॥ २३॥ विराटनगरे
    गूढचरः कीचकमर्दनः । दुर्योधननिहन्ता च जरासन्धविमर्दनः ॥ २४॥ सौगन्धिकापहर्ता च द्रौपदीप्राणवल्लभः ।
    पूर्णबोधो व्यासशिष्यो यतिरूपो महामतिः ॥ २५॥ दुर्वादिगजसिंहस्य तर्कशास्त्रस्य खण्डकः । बौद्धागमविभेत्ता
    च साङ्ख्यशास्त्रस्य दूषकः ॥ २६॥ द्वैतशास्त्रप्रणेता च वेदव्यासमतानुगः । पूर्णानन्दः पूर्णसत्वः पूर्णवैराग्यसागरः
    ॥ २७॥ इति श्रुत्वा नारदस्तु वायोश्चरितमद्भुतम् । मुदा परमया युक्तः स्तोतुं समुपचक्रमे ॥ २८॥ रामावतारजाताय
    हनुमद्रूपिणे नमः । वासुदेवस्य भक्ताय भीमसेनाय ते नमः ॥ २९॥ वेदव्यासमतोद्धारकर्त्रे पूर्णसुखाय च ।
    दुर्वादिध्वान्तचन्द्राय पूर्णबोधाय ते नमः ॥ ३०॥ गुरुराजाय धन्याय कञ्जनेत्राय ते नमः । दिव्यरूपाय शान्ताय
    नमस्ते यतिरूपिणे ॥ ३१॥ स्वान्तस्थवासुदेवाय सच्चित्ताय नमो नमः । अज्ञानतिमिरार्काय व्यासशिष्याय ते
    नमः ॥ ३२॥ अथाभिवन्द्य पितरं ब्रह्माणं नारदो मुनिः । परिक्रम्य विनिर्यातो वासुदेवं हरिं स्मरन् ॥ ३३॥
    अष्टोत्तरशतं दिव्यं वायुसूनोर्महात्मनः । यः पठेच्छ्रद्धया नित्यं सर्वबन्धात् प्रमुच्यते ॥ ३४॥ सर्वरोगविनिर्मुक्तः
    सर्वपापैर्न लिप्यते । राजवश्यं भवेन्नित्यं स्तोत्रस्यास्य प्रभावतः ॥ ३५॥ भूतग्रहनिवृत्तिश्च प्रजावृद्धिश्च
    जायते । आयुरारोग्यमैश्वर्यं बलं कीर्तिं लभेत् पुमान् ॥ ३६॥ यः पठेद्वायुचरितं भक्त्या परमया युतः ।
    सर्वज्ञानसमायुक्तः स याति परमं पदम् ॥ ३६॥ इति श्रीपद्मोत्तरखण्डतः श्रीहनुमदष्टोत्तरशतनामस्तोत्रं सम्पूर्णम्
    ।
