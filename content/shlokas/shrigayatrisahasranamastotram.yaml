  devanagari: रक्तश्वेतहिरण्यनीलधवलैर्युक्ता त्रिनेएत्रोज्ज्वलां रक्तां रक्तनवस्रजं मणिगणैर्युक्तां कुमारीमिमाम्
meaning: {}
