id: mahalakshmistotra
category: stotram
name:
  english: mahalakshmistotra
  devanagari: महालक्ष्मीस्तोत्र
content:
  english: rinvatam sarvadevanam sarvabhutasthita dvija || 19|| shriruvaca paritushtasmi devesha stotrenanena
    te hare | varam vrinishva yastvishto varada'ham tavagata || 20|| indra uvaca varada yadimedevi vararho
    yadi va'pyaham | trailokyam na tvaya tyajyamesha me'stu varah parah || 21|| stotrena yastathaitena
    tvam stoshyatyabdhisambhave | sa tvaya na parityajyo dvitiyo'stu varo mama || 22|| shriruvaca trailokyam
    tridashashreshtha na santyakshyami vasava | datto varo maya'yam te stotraradhanatushtaya || 23|| yashca
    sayam tatha pratah stotrenanena manavah | stoshyate cenna tasyaham bhavishyami parangmukhi || 24||
    shriparashara uvaca evam varam dadau devi devarajaya vai pura | maitreya shrirmahabhaga stotraradhanatoshita
    || 25|| bhrigoh khyatyam samutpanna shrih purvamudadheh punah | devadanavayatnena prasuta'mritamanthane
    || 26|| evam yada jagatsvami devarajo janardanah | avatarah karotyesha tada shristatsahayini || 27||
    punashcapadma sambhuta yada'dityo'bhavaddharih | yada ca bhargavo ramastadabhuddharanitviyam || 28||
    raghavatve'bhavatsita rukmini krishnajanmani | anyeshu cavatareshu vishnorekha'napayini || 29|| devatve
    devadeheyam manushatve ca manushi | vishnordehanurupam vai karotyesha''tmanastanum || 30|| yashcaitasha
  devanagari: ृण्वतां सर्वदेवानां सर्वभूतस्थिता द्विज ॥ १९॥ श्रीरुवाच परितुष्टास्मि देवेश स्तोत्रेणानेन
    ते हरे । वरं वृणीष्व यस्त्विष्टो वरदाऽहं तवागता ॥ २०॥ इन्द्र उवाच वरदा यदिमेदेवि वरार्हो यदि वाऽप्यहम्
    । त्रैलोक्यं न त्वया त्याज्यमेष मेऽस्तु वरः परः ॥ २१॥ स्तोत्रेण यस्तथैतेन त्वां स्तोष्यत्यब्धिसम्भवे
    । स त्वया न परित्याज्यो द्वितीयोऽस्तु वरो मम ॥ २२॥ श्रीरुवाच त्रैलोक्यं त्रिदशश्रेष्ठ न सन्त्यक्ष्यामि
    वासव । दत्तो वरो मयाऽयं ते स्तोत्राराधनतुष्टया ॥ २३॥ यश्च सायं तथा प्रातः स्तोत्रेणानेन मानवः । स्तोष्यते
    चेन्न तस्याहं भविष्यामि पराङ्ग्मुखी ॥ २४॥ श्रीपाराशर उवाच एवं वरं ददौ देवी देवराजाय वै पुरा । मैत्रेय
    श्रीर्महाभागा स्तोत्राराधनतोषिता ॥ २५॥ भृगोः ख्यात्यां समुत्पन्ना श्रीः पूर्वमुदधेः पुनः । देवदानवयत्नेन
    प्रसूताऽमृतमन्थने ॥ २६॥ एवं यदा जगत्स्वामी देवराजो जनार्दनः । अवतारः करोत्येषा तदा श्रीस्तत्सहायिनी
    ॥ २७॥ पुनश्चपद्मा सम्भूता यदाऽदित्योऽभवद्धरिः । यदा च भार्गवो रामस्तदाभूद्धरणीत्वियम् ॥ २८॥ राघवत्वेऽभवत्सीता
    रुक्मिणी कृष्णजन्मनि । अन्येषु चावतारेषु विष्णोरेखाऽनपायिनी ॥ २९॥ देवत्वे देवदेहेयं मानुषत्वे च मानुषी
    । विष्णोर्देहानुरुपां वै करोत्येषाऽऽत्मनस्तनुम् ॥ ३०॥ यश्चैतश
