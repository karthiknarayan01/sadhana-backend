id: bhava
category: upanishad
name:
  english: bhava
  devanagari: भाव
content:
  english: pancadashatithirupena kalasya parinamavalokanasthitih pancadashanityah | shraddhanurupa dhirdevata
    | tayoh kameshvari sadanandaghana paripurnasvatmaikyarupa devata | salilamiti lauhityakaranam sattvam
    | kartavyamakartavyamiti bhavanayukta upacarah | asti nastiti kartavyatanupacarah | bahyabhyantahkarananam
    rupagrahanayogyatasttvityavahanam | tasya bahyabhyantahkarananamekarupavishayagrahanamasanam | raktashuklapadaikikaranam
    padyam | ujjvaladamodanandasanadanamarghyam | svaccham svatahsiddhamityacamaniyam | ciccandramayiti
    sarvangasravanam snanam | cidagnisvarupaparamanandashaktisphuranam vastram | pratyekam saptavimshatidha
    bhinnatvenecchajnanakriyatmakabrahmagranthimadrasatantubrahmanadi brahmasutram | svavyatiriktavastusangarahitasmaranam
    vibhushanam | saccitsukhaparipurnatasmaranam gandhah | samastavishayanam manasah sthairyenanusamdhanam
    kusumam | teshameva sarvada svikaranam dhupah | pavanavacchinnotdhvajvalanasaccidulkakashadeho dipah
    | samastayatayatavarjyam naivedyam | avasthatrayanamekikaranam tambulam | muladharadabrahmarandhraparyantam
    brahmarandhradamuladharaparyantam gatagatarupena pradakshinyam | turyavastha namaskarah | dehashunyapramatritanimajjanam
    baliharanam | satyamasti lartavyamakartavyamaudasinyanityatmavilapanam homah | svayam tatpadukanimajjanam
    paripurnadhyanam | evam muhurtatrayam
  devanagari: पञ्चदशतिथिरूपेण कालस्य परिणामावलोकनस्थितिः पञ्चदशनित्याः । श्रद्धानुरूपा धीर्देवता । तयोः
    कामेश्वरी सदानन्दघना परिपूर्णस्वात्मैक्यरूपा देवता । सलिलमिति लौहित्यकारणं सत्त्वम् । कर्तव्यमकर्तव्यमिति
    भावनायुक्त उपचारः । अस्ति नास्तीति कर्तव्यतानूपचारः । बाह्याभ्यन्तःकरणानां रूपग्रहणयोग्यतास्त्त्वित्यावाहनम्
    । तस्य बाह्याभ्यन्तःकरणानामेकरूपविषयग्रहणमासनम् । रक्तशुक्लपदैकीकरणं पाद्यम् । उज्ज्वलदामोदानन्दासनदानमर्घ्यम्
    । स्वच्छं स्वतःसिद्धमित्याचमनीयम् । चिच्चन्द्रमयीति सर्वाङ्गस्रवणं स्नानम् । चिदग्निस्वरूपपरमानन्दशक्तिस्फुरणं
    वस्त्रम् । प्रत्येकं सप्तविंशतिधा भिन्नत्वेनेच्छाज्ञानक्रियात्मकब्रह्मग्रन्थिमद्रसतन्तुब्रह्मनाडी
    ब्रह्मसूत्रम् । स्वव्यतिरिक्तवस्तुसङ्गरहितस्मरणां विभूषणम् । सच्चित्सुखपरिपूर्णतास्मरणं गन्धः । समस्तविषयाणां
    मनसः स्थैर्येणानुसंधानं कुसुमम् । तेषामेव सर्वदा स्वीकरणं धूपः । पवनावच्छिन्नोत्ध्वज्वलनसच्चिदुल्काकाशदेहो
    दीपः । समस्तयातायातवर्ज्यं नैवेद्यम् । अवस्थात्रयाणामेकीकरणं ताम्बूलम् । मूलाधारादाब्रह्मरन्ध्रपर्यन्तं
    ब्रह्मरन्ध्रादामूलाधारपर्यन्तं गतागतरूपेण प्रादक्षिण्यम् । तुर्यावस्था नमस्कारः । देहशून्यप्रमातृतानिमज्जनं
    बलिहरणम् । सत्यमस्ति लर्तव्यमकर्तव्यमौदासीन्यनित्यात्मविलापनं होमः । स्वयं तत्पादुकानिमज्जनं परिपूर्णध्यानम्
    । एवं मुहूर्तत्रयं
