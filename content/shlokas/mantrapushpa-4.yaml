id: mantrapushpa-4
category: veda
name:
  english: mantrapushpa
  devanagari: मन्त्रपुष्प
content:
  english: mantrapushpamjali om yo'pam pushpam veda | pushpavan prajavan pashuman bhavati | camdra ma
    va apam pushpam | pushpavan prajavan pashuman bhavati | ya evam veda | yo'pamayatanam veda | ayatanavan
    bhavati || 1|| agnirva apamayatanam | ayatanavan bhavati | yo'gnerayatanam veda | ayatanavan bhavati
    | apo va agnerayatanam | ayatanavan bhavati | ya evam veda | yo'pamayatanam veda | ayatanavan bhavati
    || 2|| vayurva apamayatanam | ayatanavan bhavati | yo vayorayatanam veda | ayatanavan bhavati | apo
    vai vayorayatanam | ayatanavan bhavati | ya evam veda | yo'pamayatanam veda | ayatanavan bhavati ||
    3|| asau vai tapannapamayatanam | ayatanavan bhavati | yo'mushya tapata ayatanam veda | ayatanavan
    bhavati | apo va'mushya tapata ayatanam | ayatanavan bhavati | ya evam veda | yo'pamayatanam veda
    | ayatanavan bhavati || 4|| camdrama va apamayatanam | ayatanavan bhavati | yashcamdramasa ayatanam
    veda | ayatanavan bhavati | apo vai camdramasa ayatanam | ayatanavan bhavati | ya evam veda | yo'pamayatanam
    veda | ayatanavan bhavati || 5|| nakshatrani va apamayatanam | ayatanavan bhavati | yo nakshatranamayatanam
    veda | ayatanavan bhavati | apo vai nakshatranamayatanam | ayatanavan bhavati | ya evam veda | yo'pamayatanam
    veda | ayatanavan bhavati || 6|| parjanyo va apamayatanam | ayatanavan bhavati | yah parjanyasyayatanam
    veda | ayatanavan bhavati | apo vai parjanyasyayatanam | ayatanavan bhavati | ya evam veda | yo'pamayatanam
    veda | ayatanavan bhavati || 7|| samvatsaro va apamayatanam | ayatanavan bhavati | yassamvatsarasyayatanam
    veda | ayatanavan bhavati | apo vai samvatsarasyayatanam | ayatanavan bhavati | ya evam veda | yo'psunavam
    pratishthitam veda | pratyeva tishthati || 8||
  devanagari: मन्त्रपुष्पांजलि ॐ योऽपां पुष्पं वेद । पुष्पवान् प्रजावान् पशुमान् भवति । चंद्र मा वा अपां
    पुष्पम् । पुष्पवान् प्रजावान् पशुमान् भवति । य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ १॥ अग्निर्वा
    अपामायतनम् । आयतनवान् भवति । योऽग्नेरायतनं वेद । आयतनवान् भवति । आपो वा अग्नेरायतनम् । आयतनवान् भवति
    । य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ २॥ वायुर्वा अपामायतनम् । आयतनवान् भवति । यो वायोरायतनं
    वेद । आयतनवान् भवति । आपो वै वायोरायतनम् । आयतनवान् भवति । य एवं वेद । योऽपामायतनं वेद । आयतनवान्
    भवति ॥ ३॥ असौ वै तपन्नपामायतनम् । आयतनवान् भवति । योऽमुष्य तपत आयतनं वेद । आयतनवान् भवति । आपो वाऽमुष्य
    तपत आयतनम् । आयतनवान् भवति । य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ ४॥ चंद्रमा वा अपामायतनम्
    । आयतनवान् भवति । यश्चंद्रमस आयतनं वेद । आयतनवान् भवति । आपो वै चंद्रमस आयतनम् । आयतनवान् भवति । य
    एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ ५॥ नक्षत्राणि वा अपामायतनम् । आयतनवान् भवति । यो नक्षत्राणामायतनं
    वेद । आयतनवान् भवति । आपो वै नक्षत्राणामायतनम् । आयतनवान् भवति । य एवं वेद । योऽपामायतनं वेद । आयतनवान्
    भवति ॥ ६॥ पर्जन्यो वा अपामायतनम् । आयतनवान् भवति । यः पर्जन्यस्यायतनं वेद । आयतनवान् भवति । आपो वै
    पर्जन्यस्यायतनम् । आयतनवान् भवति । य एवं वेद । योऽपामायतनं वेद । आयतनवान् भवति ॥ ७॥ संवत्सरो वा अपामायतनम्
    । आयतनवान् भवति । यस्संवत्सरस्यायतनं वेद । आयतनवान् भवति । आपो वै संवत्सरस्यायतनम् । आयतनवान् भवति
    । य एवं वेद । योऽप्सुनावं प्रतिष्ठितां वेद । प्रत्येव तिष्ठति ॥ ८॥
