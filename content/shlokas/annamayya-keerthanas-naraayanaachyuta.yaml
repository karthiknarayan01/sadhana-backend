id: annamayya-keerthanas-naraayanaachyuta
category: stotram
name:
  english: Annamayya Keerthanas Naraayanaachyuta
content:
  english: adi pallavi narayanacyutananta govinda hari | saramuga niku ne sharanantini || caluvayunu vediyunu
    natala samsarambu tòlaku sukhamòkavela duhkhamòkavela | phalamulivè yi rèndu papamulu punyamulu pulupu
    dipunu galapi bhujiyincinatlu || narayanacyutananta govinda hari pagalu ratrulariti bahujanma maranalu
    tagumenu pòdacupu tanudanè tòlagu | nagiyincu nòkavela nalagincu nòkavela vògaru karapu vidèmu ubbincinatlu
    || narayanacyutananta govinda hari ihamu paramunu valènè yèditikallayu nijamu viharincu bhrantiyunu
    vibhrantiyunu matini | sahaja shri venkateshvara nannu karunimpa bahuvidhambula nannu palincave ||
    narayanacyutananta govinda hari saramuga niku ne sharanantini ||
  devanagari: आदि पल्लवि नारायणाच्युतानन्त गोविन्द हरि । सारमुग नीकु ने शरणण्टिनि ॥ चलुवयुनु वेडियुनु
    नटल संसारम्बु तॊलकु सुखमॊकवेल दुःखमॊकवेल । फलमुलिवॆ यी रॆण्डु पापमुलु पुण्यमुलु पुलुपु दीपुनु गलपि
    भुजियिञ्चिनट्लु ॥ नारायणाच्युतानन्त गोविन्द हरि पगलु रात्रुलरीति बहुजन्म मरणालु तगुमेनु पॊडचूपु तनुदानॆ
    तॊलगु । नगियिञ्चु नॊकवेल नलगिञ्चु नॊकवेल वॊगरु कारपु विडॆमु उब्बिञ्चिनट्लु ॥ नारायणाच्युतानन्त गोविन्द
    हरि इहमु परमुनु वलॆनॆ यॆदिटिकल्लयु निजमु विहरिञ्चु भ्रान्तियुनु विभ्रान्तियुनु मतिनि । सहज श्री वेङ्कटेश्वर
    नन्नु करुणिम्प बहुविधम्बुल नन्नु पालिञ्चवे ॥ नारायणाच्युतानन्त गोविन्द हरि सारमुग नीकु ने शरणण्टिनि
    ॥
