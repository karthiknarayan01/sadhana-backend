id: shukrakritam2shivastotram
category: stotram
name:
  english: shukrakritam2shivastotram
  devanagari: शुक्रकृतं२शिवस्तोत्रम्
content:
  english: shukrakritam 2 shivastotram shukra uvaca | balo'ham balabuddhishca balacandradhara prabho |
    naham janami te kincitstutim kartum namo'stu te || 18|| parityaktasya guruna na mamasti suhritsakha
    | tvam prabhuh sarvabhavena jagannatha namo'stu te || 19|| gururgurumatam deva mahatam ca mahanasi
    | ahamalpataro balo jaganmaya namo'stu te || 20|| vidyartham hi sureshana naham vedmi bhavadgatim
    | mam tvam ca kripaya pashya lokasakshinnamo'stu te || 21|| iti brahmapurane pancanavatitamadhyayantargatam
    shukrakritam shivastotram samaptam | brahmapurana | adhyaya 95
  devanagari: शुक्रकृतं २ शिवस्तोत्रम् शुक्र उवाच । बालोऽहं बालबुद्धिश्च बालचन्द्रधर प्रभो । नाहं जानामि
    ते किञ्चित्स्तुतिं कर्तुं नमोऽस्तु ते ॥ १८॥ परित्यक्तस्य गुरुणा न ममास्ति सुहृत्सखा । त्वं प्रभुः
    सर्वभावेन जगन्नाथ नमोऽस्तु ते ॥ १९॥ गुरुर्गुरुमतां देव महतां च महानसि । अहमल्पतरो बालो जगन्मय नमोऽस्तु
    ते ॥ २०॥ विद्यार्थं हि सुरेशान नाहं वेद्मि भवद्गतिम् । मां त्वं च कृपया पश्य लोकसाक्षिन्नमोऽस्तु ते
    ॥ २१॥ इति ब्रह्मपुराणे पञ्चनवतितमाध्यायान्तर्गतं शुक्रकृतं शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय
    ९५
