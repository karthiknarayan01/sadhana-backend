id: ramanujavaibhavastotram
category: stotram
name:
  english: ramanujavaibhavastotram
  devanagari: रामानुजवैभवस्तोत्रम्
content:
  english: bhavajalanidhipate pavanam pavananam | paramapurushadhamaprapakam svashritanam yatipati padapadmam
    shreyase samshrayami || 12|| namami ramanujapadapankajam vadami ramanujanama nirmalam | smarami ramanujadivyavigraham
    karomi ramanujadasadasatam || 13|| ramanujasya padapankajamashrayami ramanujasya karunamanusandadhami
    | ramanujasya janapadarajo vahami ramanujaya nama ityanisham vadami || 14|| bauddhandhakarapariharadivakaraya
    shrivaishnavambunidhipurnanishakaraya | advaitavadikariyuthamrigadhipaya tasmai namo'stu satatam yatipungavaya
    || 15|| lokanuddharttukamo dhritamanujavapurbhutale yo'vatirno nirjityasheshadushtan kumatimataparanvaishnavankarmatene
    | brahmeshanadyalabhyam nikhilapatipadam dattavamshcashritanam shriman ramanujo no bhavabhujagamukhatpatu
    nityam dayaluh || 16|| svapadambujasamshritapapaharam sakalashrutisarayatharthakaram | jayanadivinashanadandadharam
    pranamami yatishvaramadigurum || 17|| prakatikritamadhavabhaktipatham kalipatakamocanapunyakatham
    | paribhutanirishvaravadimatam yatirajagurum pranamami sada || 18|| krimikanthanareshanishudakaram
    bhavarogavinashanavaidyavaram | sharanagatavatsalavarinidhimpranamami sadayatibhumipatim || 19|| namo
    ramanujaryaya kalyanagunasindhave | kripamatraprasannaya dinanirvyajabandhave || 20|| prathamo'nantarupashca
    dvitiyo lakshmanastatha | tritiyo balaramashca kalau ramanujo munih || 21|| dvaparante kaleradau pakhandapracure
    jane | ramanujeti bhavita vishnudharmapravarttakah || 22|| sarvalokasamuddhartre krimikanthavinashine
    | narayanapratishthatre prapannasurasakshine || 23|| tridandahastam sitayajnasutram kashayavastram
    lasadurdhvapundram | rathangashankhankitabahumulam ramanujaryam sharanam prapadye || 24|| iti shribrahmasamhitayam
    ramanujavaibhavastotram sampurnam ||
  devanagari: भवजलनिधिपाते पावनं पावनानाम् । परमपुरुषधामप्रापकं स्वाश्रितानां यतिपति पदपद्मं श्रेयसे संश्रयामि
    ॥ १२॥ नमामि रामानुजपादपङ्कजं वदामि रामानुजनाम निर्मलम् । स्मरामि रामानुजदिव्यविग्रहं करोमि रामानुजदासदासताम्
    ॥ १३॥ रामानुजस्य पदपङ्कजमाश्रयामि रामानुजस्य करुणामनुसन्दधामि । रामानुजस्य जनपादरजो वहामि रामानुजाय
    नम इत्यनिशं वदामि ॥ १४॥ बौद्धान्धकारपरिहारदिवाकराय श्रीवैष्णवाम्बुनिधिपूर्णनिशाकराय । अद्वैतवादिकरियूथमृगाधिपाय
    तस्मै नमोऽस्तु सततं यतिपुङ्गवाय ॥ १५॥ लोकानुद्धर्त्तुकामो धृतमनुजवपुर्भूतले योऽवतीर्णो निर्जित्याशेषदुष्टान्
    कुमतिमतपरान्वैष्णवङ्कर्मतेने । ब्रह्मेशानाद्यलभ्यं निखिलपतिपदं दत्तवांश्चाश्रितानां श्रीमान् रामानुजो
    नो भवभुजगमुखात्पातु नित्यं दयालुः ॥ १६॥ स्वपदाम्बुजसंश्रितपापहरं सकलश्रुतिसारयथार्थकरम् । जयनादिविनाशनदण्डधरं
    प्रणमामि यतीश्वरमादिगुरुम् ॥ १७॥ प्रकटीकृतमाधवभक्तिपथं कलिपातकमोचनपुण्यकथम् । परिभूतनिरीश्वरवादिमतं
    यतिराजगुरुं प्रणमामि सदा ॥ १८॥ कृमिकण्ठनरेशनिषूदकरं भवरोगविनाशनवैद्यवरम् । शरणागतवत्सलवारिनिधिम्प्रणमामि
    सदायतिभूमिपतिम् ॥ १९॥ नमो रामानुजार्याय कल्याणगुणसिन्धवे । कृपामात्रप्रसन्नाय दीननिर्व्याजबन्धवे ॥
    २०॥ प्रथमोऽनन्तरूपश्च द्वितीयो लक्ष्मणस्तथा । तृतीयो बलरामश्च कलौ रामानुजो मुनिः ॥ २१॥ द्वापरान्ते
    कलेरादौ पाखण्डप्रचुरे जने । रामानुजेति भविता विष्णुधर्मप्रवर्त्तकः ॥ २२॥ सर्वलोकसमुद्धर्त्रे कृमिकण्ठविनाशिने
    । नारायणप्रतिष्ठात्रे प्रपन्नसुरसाक्षिणे ॥ २३॥ त्रिदण्डहस्तं सितयज्ञसूत्रं काषायवस्त्रं लसदूर्ध्वपुण्ड्रम्
    । रथाङ्गशङ्खाङ्कितबाहुमूलं रामानुजार्यं शरणं प्रपद्ये ॥ २४॥ इति श्रीब्रह्मसंहितायां रामानुजवैभवस्तोत्रं
    सम्पूर्णम् ॥
