id: saubhagya108str
category: stotram
name:
  english: saubhagya108str
  devanagari: सौभाग्य१०८स्त्र्
content:
  english: rinu bhargava | sahasrashatasankhyani puraneshvagameshu ca || 7|| teshu saratamam hyetatsaubhagya'shtottara''tmakam
    | yaduvaca shivah purvam bhavanyai bahudha'rthitah || 8|| saubhagya'shtottarashatanamastotrasya bhargava
    | rishiruktah shivashchando'nushtup shrilalita'mbika || 9|| devata vinyasetkutatrayena''vartya sarvatah
    | dhyatva sampujya manasa stotrametadudirayet || 10|| || tripurambikayai namah || om kameshvari kamashaktih
    kamasaubhagyadayini| kamarupa kamakala kamini kamala''sana || 11|| kamala kalpanahina kamaniyakalavati
    | kamala bharatisevya kalpita'sheshasamsritih || 12|| anuttara'nagha'nanta'dbhutarupa'nalodbhava |
    atilokacaritra'tisundaryatishubhaprada || 13|| aghahantryativistara'rcanatushta'mitaprabha | ekarupaikaviraikanathaikanta'rcanapriya
    || 14|| ekaikabhavatushtaikarasaikantajanapriya | edhamanaprabhavaidhadbhaktapatakanashini || 15||
    elamodamukhaino'drishakrayudhasamasthitih | ihashunyepsiteshadisevyeshanavarangana || 16|| ishvara''jnapikekarabhavyepsitaphalaprada
    | ishanetihareksheshadarunakshishvareshvari || 17|| lalita lalanarupa layahina lasattanuh | layasarva
    layakshonirlayakarni layatmika || 18|| laghima laghumadhya''dhya lalamana laghudruta | haya''rudha
    hata'mitra harakanta haristuta || 19|| hayagriveshtada halapriya harshasamuddhata | harshana hallakabhangi
    hastyantaishvaryadayini || 20|| halahasta'rcitapada havirdanaprasadini | ramarama'rcita rajni ramya
    ravamayi ratih || 21|| rakshiniramaniraka ramanimandalapriya | rakshita'khilalokesha rakshogananishudini
    || 22|| ambantakarinyambhojapriya'ntakabhayankari | amburupa'mbujakara'mbujajatavaraprada || 23||
    antahpujapriya'ntahsvarupinyantarvacomayi | antaka'rativamankasthita'ntahsukharupini || 24|| sarvajna
    sarvaga sara sama samasukha sati | santatih santata soma sarva sankhya sanatani || 25|| || phalashrutih||
    etatte kathitam rama namnamashtottaram shatam | atigopyamidam namnah sarvatah saramuddhritam || 26||
    etasya sadrisham stotram trishu lokeshu durlabham | aprakashyamabhaktanam purato devatadvisham ||
    27|| etat sadashivo nityam pathantyanye haradayah | etatprabhavatkandarpastrailokyam jayati kshanat
    || 28|| saubhagya'shtottarashatanamastotram manoharam | yastrisandhyam pathennityam na tasya bhuvi
    durlabham || 29|| shrividyopasanavatametadavashyakam matam | sakridetatprapathatam na'nyatkarma vilupyate
    || 30|| apathitva stotramidam nityam naimittikam kritam | vyarthibhavati nagnena kritam karma yatha
    tatha || 31|| sahasranamapathadavashaktastvetadirayet | sahasranamapathasya phalam shatagunam bhavet
    || 32|| sahasradha pathitva tu vikshanannashayedripun | karaviraraktapushpairhutva lokan vasham nayet
    || 33|| stambheyat shvetakusumairnilairuccatayedripun | maricairvidveshenaya lavangairvyadhinashane
    || 34|| suvasinirbrahmanan va bhojayedyastu namabhih | yashca pushpaih phalairvapi pujayet pratinamabhih
    || 35|| cakraraje'thava'nyatra sa vasecchripure ciram | yah sada vartayannaste nama'shtashatamuttamam
    || 36|| tasya shrilalita rajni prasanna vanchitaprada||
  devanagari: ृणु भार्गव । सहस्रशतसङ्ख्यानि पुराणेष्वागमेषु च ॥ ७॥ तेषु सारतमं ह्येतत्सौभाग्याऽष्टोत्तराऽऽत्मकम्
    । यदुवाच शिवः पूर्वं भवान्यै बहुधाऽर्थितः ॥ ८॥ सौभाग्याऽष्टोत्तरशतनामस्तोत्रस्य भार्गव । ऋषिरुक्तः
    शिवश्छन्दोऽनुष्टुप् श्रीललिताऽम्बिका ॥ ९॥ देवता विन्यसेत्कूटत्रयेणाऽऽवर्त्य सर्वतः । ध्यात्वा सम्पूज्य
    मनसा स्तोत्रमेतदुदीरयेत् ॥ १०॥ ॥ त्रिपुराम्बिकायै नमः ॥ ॐ कामेश्वरी कामशक्तिः कामसौभाग्यदायिनी। कामरूपा
    कामकला कामिनी कमलाऽऽसना ॥ ११॥ कमला कल्पनाहीना कमनीयकलावती । कमला भारतीसेव्या कल्पिताऽशेषसंसृतिः ॥
    १२॥ अनुत्तराऽनघाऽनन्ताऽद्भुतरूपाऽनलोद्भवा । अतिलोकचरित्राऽतिसुन्दर्यतिशुभप्रदा ॥ १३॥ अघहन्त्र्यतिविस्ताराऽर्चनतुष्टाऽमितप्रभा
    । एकरूपैकवीरैकनाथैकान्ताऽर्चनप्रिया ॥ १४॥ एकैकभावतुष्टैकरसैकान्तजनप्रिया । एधमानप्रभावैधद्भक्तपातकनाशिनी
    ॥ १५॥ एलामोदमुखैनोऽद्रिशक्रायुधसमस्थितिः । ईहाशून्येप्सितेशादिसेव्येशानवराङ्गना ॥ १६॥ ईश्वराऽऽज्ञापिकेकारभाव्येप्सितफलप्रदा
    । ईशानेतिहरेक्षेषदरुणाक्षीश्वरेश्वरी ॥ १७॥ ललिता ललनारूपा लयहीना लसत्तनुः । लयसर्वा लयक्षोणिर्लयकर्णी
    लयात्मिका ॥ १८॥ लघिमा लघुमध्याऽऽढ्या ललमाना लघुद्रुता । हयाऽऽरूढा हताऽमित्रा हरकान्ता हरिस्तुता ॥
    १९॥ हयग्रीवेष्टदा हालाप्रिया हर्षसमुद्धता । हर्षणा हल्लकाभाङ्गी हस्त्यन्तैश्वर्यदायिनी ॥ २०॥ हलहस्ताऽर्चितपदा
    हविर्दानप्रसादिनी । रामरामाऽर्चिता राज्ञी रम्या रवमयी रतिः ॥ २१॥ रक्षिणीरमणीराका रमणीमण्डलप्रिया ।
    रक्षिताऽखिललोकेशा रक्षोगणनिषूदिनी ॥ २२॥ अम्बान्तकारिण्यम्भोजप्रियाऽन्तकभयङ्करी । अम्बुरूपाऽम्बुजकराऽम्बुजजातवरप्रदा
    ॥ २३॥ अन्तःपूजाप्रियाऽन्तःस्वरूपिण्यन्तर्वचोमयी । अन्तकाऽरातिवामाङ्कस्थिताऽन्तःसुखरूपिणी ॥ २४॥ सर्वज्ञा
    सर्वगा सारा समा समसुखा सती । सन्ततिः सन्तता सोमा सर्वा साङ्ख्या सनातनी ॥ २५॥ ॥ फलश्रुतिः॥ एतत्ते कथितं
    राम नाम्नामष्टोत्तरं शतम् । अतिगोप्यमिदं नाम्नः सर्वतः सारमुद्धृतम् ॥ २६॥ एतस्य सदृशं स्तोत्रं त्रिषु
    लोकेषु दुर्लभम् । अप्राकश्यमभक्तानां पुरतो देवताद्विषाम् ॥ २७॥ एतत् सदाशिवो नित्यं पठन्त्यन्ये हरादयः
    । एतत्प्रभावात्कन्दर्पस्त्रैलोक्यं जयति क्षणात् ॥ २८॥ सौभाग्याऽष्टोत्तरशतनामस्तोत्रं मनोहरम् । यस्त्रिसन्ध्यं
    पठेन्नित्यं न तस्य भुवि दुर्लभम् ॥ २९॥ श्रीविद्योपासनवतामेतदावश्यकं मतम् । सकृदेतत्प्रपठतां नाऽन्यत्कर्म
    विलुप्यते ॥ ३०॥ अपठित्वा स्तोत्रमिदं नित्यं नैमित्तिकं कृतम् । व्यर्थीभवति नग्नेन कृतं कर्म यथा तथा
    ॥ ३१॥ सहस्रनामपाठादावशक्तस्त्वेतदीरयेत् । सहस्रनामपाठस्य फलं शतगुणं भवेत् ॥ ३२॥ सहस्रधा पठित्वा तु
    वीक्षणान्नाशयेद्रिपून् । करवीररक्तपुष्पैर्हुत्वा लोकान् वशं नयेत् ॥ ३३॥ स्तम्भेयत् श्वेतकुसुमैर्नीलैरुच्चाटयेद्रिपून्
    । मरिचैर्विद्वेषेणाय लवङ्गैर्व्याधिनाशने ॥ ३४॥ सुवासिनीर्ब्राह्मणान् वा भोजयेद्यस्तु नामभिः । यश्च
    पुष्पैः फलैर्वापि पूजयेत् प्रतिनामभिः ॥ ३५॥ चक्रराजेऽथवाऽन्यत्र स वसेच्छ्रीपुरे चिरम् । यः सदा वर्तयन्नास्ते
    नामाऽष्टशतमुत्तमम् ॥ ३६॥ तस्य श्रीललिता राज्ञी प्रसन्ना वाञ्छितप्रदा॥
