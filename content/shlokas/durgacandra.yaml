id: durgacandra
category: stotram
name:
  english: durgacandra
  devanagari: दुर्गाचन्द्र
content:
  english: koshodita kuvalayacchavicarudeha | narayani namadabhipsitakalpavalli supritimavahatu shumbhanishumbhahantri
    || 4|| vishveshvariti mahishantakariti yasyah narayanityapi ca namabhirankitani | suktani pankajabhuva
    ca surarshibhishca drishtani pavakamukhaishca shivam bhaje tam || 5|| utpattidaityahananastavanatmakani
    samrakshakanyakhilabhutahitaya yasyah | suktanyasheshanigamantavidah pathanti tam vishvamataramajasramabhishtavimi
    || 6|| ye vaipracittapunarutthitashumbhamukhyaih durbhikshaghorasamayena ca karitasu | avishkritastrijagadartishu
    rupabhedah tairambika samabhirakshatu mam vipadbhyah || 7|| suktam yadiyamaravindabhavadidrishtam
    avartya devyanupadam surathah samadhih | dvavapyavapaturabhishtamananyalabhyam tamadidevatarunim pranamami
    devim || 8|| mahishmatitanubhavam ca rurum ca hantum avishkritairnijarasadavatarabhedaih | ashtadashahatanavahatakotisamkhyaih
    amba sada samabhirakshatu mam vipadbhyah || 9|| etaccaritramakhilam likhitam hi yasyah sampujitam
    sadana eva niveshitam va | durgam ca tarayati dustaramapyashesham shreyah prayacchati ca sarvamumam
    bhaje tam || 10|| yatpujanastutinamaskritibhirbhavanti pritah pitamaharameshaharastrayo'pi | teshamapi
    svakagunairdadatim vapumshi tamishvarasya tarunim sharanam prapadye || 11|| kantaramadhyadridhalagnataya'vasannah
    magnashca varidhijale ripubhishca ruddhah | yasyah prapadya caranau vipadastaranti sa me sada'stu
    hridi sarvajagatsavitri || 12|| bandhe vadhe mahati mrityubhaye prasakte vittakshaye ca vividhe ca
    mahopatape | yatpadapujanamiha pratikaramahuh sa me samastajanani sharanam bhavani || 13|| banasuraprahitapannagabandhamokshah
    tadbahudarpadalanadushaya ca yogah | pradyumnina drutamalabhyata yatprasadat sa me shiva sakalamapyashubham
    kshinotu || 14|| papah pulastyatanayah punarutthito mam adyapi hartumayamagata ityuditam | yatsevanena
    bhayamindiraya'vadhutam tamadidevatarunim sharanam gato'smi || 15|| yaddhyanajam sukhamavapyamanantapunyaih
    sakshattamacyutaparigrahamashvavapuh | gopanganah kila yadarcanapunyamatrat sa me sada bhagavati bhavatu
    prasanna || 16|| ratrim prapadya iti mantravidah prapannan udbodhya mrityavadhimanyaphalaih pralobhya
    | buddhva ca tadvimukhatam pratanam nayantim akashamadijananim jagatam bhaje tam || 17|| deshakaleshu
    dushteshu durgacandrakalastutih | sandhyayoranusandheya sarvapadvinivrittaye || 18|| iti shrimadapayyadikshitaviracita
    durgacandrakalastutih samapta |
  devanagari: कोशोदिता कुवलयच्छविचारुदेहा । नारायणी नमदभीप्सितकल्पवल्ली सुप्रीतिमावहतु शुम्भनिशुम्भहन्त्री
    ॥ ४॥ विश्वेश्वरीति महिषान्तकरीति यस्याः नारायणीत्यपि च नामभिरङ्कितानि । सूक्तानि पङ्कजभुवा च सुरर्षिभिश्च
    दृष्टानि पावकमुखैश्च शिवां भजे ताम् ॥ ५॥ उत्पत्तिदैत्यहननस्तवनात्मकानि संरक्षकाण्यखिलभूतहिताय यस्याः
    । सूक्तान्यशेषनिगमान्तविदः पठन्ति तां विश्वमातरमजस्रमभिष्टवीमि ॥ ६॥ ये वैप्रचित्तपुनरुत्थितशुम्भमुख्यैः
    दुर्भिक्षघोरसमयेन च कारितासु । आविष्कृतास्त्रिजगदार्तिषु रूपभेदाः तैरम्बिका समभिरक्षतु मां विपद्भ्यः
    ॥ ७॥ सूक्तं यदीयमरविन्दभवादिदृष्टं आवर्त्य देव्यनुपदं सुरथः समाधिः । द्वावप्यवापतुरभीष्टमनन्यलभ्यं
    तामादिदेवतरुणीं प्रणमामि देवीम् ॥ ८॥ माहिष्मतीतनुभवं च रुरुं च हन्तुं आविष्कृतैर्निजरसादवतारभेदैः
    । अष्टादशाहतनवाहतकोटिसंख्यैः अम्बा सदा समभिरक्षतु मां विपद्भ्यः ॥ ९॥ एतच्चरित्रमखिलं लिखितं हि यस्याः
    सम्पूजितं सदन एव निवेशितं वा । दुर्गं च तारयति दुस्तरमप्यशेषं श्रेयः प्रयच्छति च सर्वमुमां भजे ताम्
    ॥ १०॥ यत्पूजनस्तुतिनमस्कृतिभिर्भवन्ति प्रीताः पितामहरमेशहरास्त्रयोऽपि । तेषामपि स्वकगुणैर्ददतीं वपूंषि
    तामीश्वरस्य तरुणीं शरणं प्रपद्ये ॥ ११॥ कान्तारमध्यदृढलग्नतयाऽवसन्नाः मग्नाश्च वारिधिजले रिपुभिश्च
    रुद्धाः । यस्याः प्रपद्य चरणौ विपदस्तरन्ति सा मे सदाऽस्तु हृदि सर्वजगत्सवित्री ॥ १२॥ बन्धे वधे महति
    मृत्युभये प्रसक्ते वित्तक्षये च विविधे च महोपतापे । यत्पादपूजनमिह प्रतिकारमाहुः सा मे समस्तजननी शरणं
    भवानी ॥ १३॥ बाणासुरप्रहितपन्नगबन्धमोक्षः तद्बाहुदर्पदलनादुषया च योगः । प्राद्युम्निना द्रुतमलभ्यत
    यत्प्रसादात् सा मे शिवा सकलमप्यशुभं क्षिणोतु ॥ १४॥ पापः पुलस्त्यतनयः पुनरुत्थितो मां अद्यापि हर्तुमयमागत
    इत्युदीतम् । यत्सेवनेन भयमिन्दिरयाऽवधूतं तामादिदेवतरुणीं शरणं गतोऽस्मि ॥ १५॥ यद्ध्यानजं सुखमवाप्यमनन्तपुण्यैः
    साक्षात्तमच्युतपरिग्रहमाश्ववापुः । गोपाङ्गनाः किल यदर्चनपुण्यमात्रात् सा मे सदा भगवती भवतु प्रसन्ना
    ॥ १६॥ रात्रिं प्रपद्य इति मन्त्रविदः प्रपन्नान् उद्बोध्य मृत्यवधिमन्यफलैः प्रलोभ्य । बुद्ध्वा च तद्विमुखतां
    प्रतनं नयन्तीं आकाशमादिजननीं जगतां भजे ताम् ॥ १७॥ देशकालेषु दुष्टेषु दुर्गाचन्द्रकलास्तुतिः । सन्ध्ययोरनुसन्धेया
    सर्वापद्विनिवृत्तये ॥ १८॥ इति श्रीमदपय्यदीक्षितविरचिता दुर्गाचन्द्रकलास्तुतिः समाप्ता ।
