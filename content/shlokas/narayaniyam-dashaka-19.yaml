id: narayaniyam-dashaka-19
category: stotram
name:
  english: Narayaniyam Dashaka 19
content:
  english: prithostu napta prithudharmakarmathah pracinabarhiryuvatau shatadrutau | pracetaso nama sucetasah
    suta najijanattvatkarunankuraniva || || pituh sisrikshaniratasya shasanad bhavattapasyabhirata dashapi
    te payonidhim pashcimametya tattate sarovaram sandadrishurmanoharam || || tada bhavattirthamidam samagato
    bhavo bhavatsevakadarshanadritah | prakashamasadya purah pracetasa mupadishat bhaktatamastava stavam
    || || stavam japantastamami jalantare bhavantamasevishatayutam samah | bhavatsukhasvadarasadamishviyan
    babhuva kalo dhruvavanna shighrata || || tapobhireshamatimatravardhibhih sa yajnahimsanirato'pi pavitah
    | pita'pi tesham grihayatanarada pradarshitatma bhavadatmatam yayau || || kripabalenaiva purah pracetasam
    prakashamagah patagendravahanah | viraji cakradivarayudhamshubhi rbhujabhirashtabhirudancitadyutih
    || || pracetasam tavadayacatamapi tvameva karunyabharadvaranadah | bhavadvicinta'pi shivaya dehinam
    bhavatvasau rudranutishca kamada || || avapya kantam tanayam mahiruham taya ramadhvam dashalakshavatsarim
    | suto'stu daksho nanu tatkshanacca mam prayasyatheti nyagado mudaiva tan || || tatashca te bhutalarodhinastarun
    krudha dahanto druhinena varitah | drumaishca dattam tanayamavapya tam tvaduktakalam sukhino'bhiremire
    || || avapya daksham ca sutam kritadhvarah pracetaso naradalabdhaya dhiya | avapuranandapadam tathavidha
    stvamisha vatalayanatha pahi mam ||
  devanagari: पृथोस्तु नप्ता पृथुधर्मकर्मठः प्राचीनबर्हिर्युवतौ शतद्रुतौ । प्रचेतसो नाम सुचेतसः सुता नजीजनत्त्वत्करुणाङ्कुरानिव
    ॥ ॥ पितुः सिसृक्षानिरतस्य शासनाद् भवत्तपस्याभिरता दशापि ते पयोनिधिं पश्चिममेत्य तत्तटे सरोवरं सन्ददृशुर्मनोहरम्
    ॥ ॥ तदा भवत्तीर्थमिदं समागतो भवो भवत्सेवकदर्शनादृतः । प्रकाशमासाद्य पुरः प्रचेतसा मुपादिशत् भक्ततमस्तव
    स्तवम् ॥ ॥ स्तवं जपन्तस्तममी जलान्तरे भवन्तमासेविषतायुतं समाः । भवत्सुखास्वादरसादमीष्वियान् बभूव कालो
    ध्रुववन्न शीघ्रता ॥ ॥ तपोभिरेषामतिमात्रवर्धिभिः स यज्ञहिंसानिरतोऽपि पावितः । पिताऽपि तेषां गृहयातनारद
    प्रदर्शितात्मा भवदात्मतां ययौ ॥ ॥ कृपाबलेनैव पुरः प्रचेतसां प्रकाशमागाः पतगेन्द्रवाहनः । विराजि चक्रादिवरायुधांशुभि
    र्भुजाभिरष्टाभिरुदञ्चितद्युतिः ॥ ॥ प्रचेतसां तावदयाचतामपि त्वमेव कारुण्यभराद्वरानदाः । भवद्विचिन्ताऽपि
    शिवाय देहिनां भवत्वसौ रुद्रनुतिश्च कामदा ॥ ॥ अवाप्य कान्तां तनयां महीरुहां तया रमध्वं दशलक्षवत्सरीम्
    । सुतोऽस्तु दक्षो ननु तत्क्षणाच्च मां प्रयास्यथेति न्यगदो मुदैव तान् ॥ ॥ ततश्च ते भूतलरोधिनस्तरून्
    क्रुधा दहन्तो द्रुहिणेन वारिताः । द्रुमैश्च दत्तां तनयामवाप्य तां त्वदुक्तकालं सुखिनोऽभिरेमिरे ॥ ॥
    अवाप्य दक्षं च सुतं कृताध्वराः प्रचेतसो नारदलब्धया धिया । अवापुरानन्दपदं तथाविध स्त्वमीश वातालयनाथ
    पाहि माम् ॥
