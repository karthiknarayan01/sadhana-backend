id: mahamrityunjaya-mantra
category: mantra
name:
  english: Mahamrityunjaya Mantra
  devanagari: महामृत्युञ्जय मन्त्र
content:
  english: >-
    om tryambakam yajamahe sugandhim pushti-vardhanam, urvarukam iva
    bandhanan mrityor mukshiya mamritat
  devanagari: >-
    ॐ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् । उर्वारुकमिव बन्धनान्
    मृत्योर्मुक्षीय मामृतात् ॥
meaning:
  english: >-
    We worship the three-eyed one who nourishes all life; may we be
    freed from death as a ripe cucumber falls easily from its vine,
    and not from immortality itself.
source_attribution:
  text_source: Rigveda 7.59.12
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
