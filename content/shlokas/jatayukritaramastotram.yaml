id: jatayukritaramastotram
category: stotram
name:
  english: jatayukritaramastotram
  devanagari: जटायुकृतरामस्तोत्रम्
content:
  english: jatayuruvaca aganitagunamaprameyamadyam sakalajagatsthitisamyamadihetum | uparamaparamam paratmabhutam
    satatamaham pranato'smi ramacandram || 1|| niravadhisukhamindirakataksham kshapitasurendracaturmukhadiduhkham
    | naravaramanisham nato'smi ramam varadamaham varacapabanahastam || 2|| tribhuvanakamaniyarupamidyam
    ravishatabhasuramihitapradanam | sharanadamanisham suragamule kritanilayam raghunandanam prapadye
    || 3|| bhavavipinadavagninamadheyam bhavamukhadaivatadaivatam dayalum | danujapatisahasrakotinasham
    ravitanayasadrisham harim prapadye || 4|| aviratabhavabhavanatiduram bhavavimukhairmunibhih sadaiva
    drishyam | bhavajaladhisutarananghripotam sharanamaham raghunandanam prapadye || 5|| girishagirisutamanonivasam
    girivaradharinamihitabhiramam | suravaradanujendrasevitanghrim suravaradam raghunayakam prapadye ||
    6|| paradhanaparadaravarjitanam paragunabhutishu tushtamanasanam | parahitaniratatmanam susevyam raghuvaramambujalocanam
    prapadye || 7|| smitaruciravikasitananabjamatisulabham surarajanilanilam | sitajalaruhacarunetrashobham
    raghupatimishagurorgurum prapadye || 8|| harikamalajashambhurupabhedattvamiha vibhasi gunatrayanuvrittah
    | raviriva jalapuritodapatreshvamarapatistutipatramishamide || 9|| ratipatishatakotisundarangam shatapathagocarabhavanaviduram
    | yatipatihridaye sada vibhatam raghupatimartiharam prabhum prapadye || 10|| ityevam stuvatastasya
    prasanno'bhudraghuttamah | uvaca gaccha bhadram te mama vishnoh param padam || 11|| shrinoti ya idam
    stotram likhedva niyatah pathet | sa yati mama sarupyam marane matsmritim labhet || 12|| iti raghavabhashitam
    tada shrutavan harshasamakulo dvijah || raghunandanasamyamasthitah prayayau brahmasupujitam padam
    || 13|| || iti shrimadadhyatmaramayane aranyakande'shtame sarge jatayukritam shriramastotra ||
  devanagari: जटायुरुवाच अगणितगुणमप्रमेयमाद्यं सकलजगत्स्थितिसंयमादिहेतुम् । उपरमपरमं परात्मभूतं सततमहं
    प्रणतोऽस्मि रामचन्द्रम् ॥ १॥ निरवधिसुखमिन्दिराकटाक्षं क्षपितसुरेन्द्रचतुर्मुखादिदुःखम् । नरवरमनिशं
    नतोऽस्मि रामं वरदमहं वरचापबाणहस्तम् ॥ २॥ त्रिभुवनकमनीयरूपमीड्यं रविशतभासुरमीहितप्रदानम् । शरणदमनिशं
    सुरागमूले कृतनिलयं रघुनन्दनं प्रपद्ये ॥ ३॥ भवविपिनदवाग्निनामधेयं भवमुखदैवतदैवतं दयालुम् । दनुजपतिसहस्रकोटिनाशं
    रवितनयासदृशं हरिं प्रपद्ये ॥ ४॥ अविरतभवभावनातिदूरं भवविमुखैर्मुनिभिः सदैव दृश्यम् । भवजलधिसुतारणाङ्घ्रिपोतं
    शरणमहं रघुनन्दनं प्रपद्ये ॥ ५॥ गिरिशगिरिसुतामनोनिवासं गिरिवरधारिणमीहिताभिरामम् । सुरवरदनुजेन्द्रसेविताङ्घ्रिं
    सुरवरदं रघुनायकं प्रपद्ये ॥ ६॥ परधनपरदारवर्जितानां परगुणभूतिषु तुष्टमानसानाम् । परहितनिरतात्मनां सुसेव्यं
    रघुवरमम्बुजलोचनं प्रपद्ये ॥ ७॥ स्मितरुचिरविकासिताननाब्जमतिसुलभं सुरराजनीलनीलम् । सितजलरुहचारुनेत्रशोभं
    रघुपतिमीशगुरोर्गुरुं प्रपद्ये ॥ ८॥ हरिकमलजशम्भुरूपभेदात्त्वमिह विभासि गुणत्रयानुवृत्तः । रविरिव जलपूरितोदपात्रेष्वमरपतिस्तुतिपात्रमीशमीडे
    ॥ ९॥ रतिपतिशतकोटिसुन्दराङ्गं शतपथगोचरभावनाविदूरम् । यतिपतिहृदये सदा विभातं रघुपतिमार्तिहरं प्रभुं
    प्रपद्ये ॥ १०॥ इत्येवं स्तुवतस्तस्य प्रसन्नोऽभूद्रघूत्तमः । उवाच गच्छ भद्रं ते मम विष्णोः परं पदम्
    ॥ ११॥ शृणोति य इदं स्तोत्रं लिखेद्वा नियतः पठेत् । स याति मम सारूप्यं मरणे मत्स्मृतिं लभेत् ॥ १२॥
    इति राघवभाषितं तदा श्रुतवान् हर्षसमाकुलो द्विजः ॥ रघुनन्दनसाम्यमास्थितः प्रययौ ब्रह्मसुपूजितं पदम्
    ॥ १३॥ ॥ इति श्रीमदध्यात्मरामायणे अरण्यकाण्डेऽष्टमे सर्गे जटायुकृतं श्रीरामस्तोत्र ॥
