id: vishnustotramnarakaihkritam
category: stotram
name:
  english: vishnustotramnarakaihkritam
  devanagari: विष्णुस्तोत्रंनारकैःकृतम्
content:
  english: namah krishnaya haraye vishnave jishnave namah | hrishikeshaya devaya jagaddhatre'cyutaya ca
    || 38|| namah pankajanetraya namah pankajanabhaye | janardanaya shrishaya shripate pitavasase || 39||
    govindaya namo nityam namashcodadhishayine | namah karalavaktraya nrisimhayatinadine || 40|| sharngine
    dhritakhadgaya shankhacakragadadhrite | namo vamanarupaya krantalokatrayaya ca || 41|| varaharupaya
    tatha namo yajnangadharine | vyaptasheshadigantaya shantaya paramatmane || 42|| vasudeva namastubhyam
    namah kaitabhasudana | keshavaya namo vyapinnamaste'stu mahidhara || 43|| iti vishnudharmeshu ashtasaptatitamo'dhyayantargatam
    narakaih kritam vishnustotram sampurnam |
  devanagari: नमः कृष्णाय हरये विष्णवे जिष्णवे नमः । हृषीकेशाय देवाय जगद्धात्रेऽच्युताय च ॥ ३८॥ नमः पङ्कजनेत्राय
    नमः पङ्कजनाभये । जनार्दनाय श्रीशाय श्रीपते पीतवाससे ॥ ३९॥ गोविन्दाय नमो नित्यं नमश्चोदधिशायिने । नमः
    करालवक्त्राय नृसिंहायातिनादिने ॥ ४०॥ शार्ङ्गिणे धृतखड्गाय शङ्खचक्रगदाधृते । नमो वामनरूपाय क्रान्तलोकत्रयाय
    च ॥ ४१॥ वराहरूपाय तथा नमो यज्ञाङ्गधारिणे । व्याप्ताशेषदिगन्ताय शान्ताय परमात्मने ॥ ४२॥ वासुदेव नमस्तुभ्यं
    नमः कैटभसूदन । केशवाय नमो व्यापिन्नमस्तेऽस्तु महीधर ॥ ४३॥ इति विष्णुधर्मेषु अष्टसप्ततितमोऽध्यायान्तर्गतं
    नारकैः कृतं विष्णुस्तोत्रं सम्पूर्णम् ।
