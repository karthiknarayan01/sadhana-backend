    | om kalakalaya namah | om kripanidhaye namah | 30 om bhimaya namah | om parashuhastaya namah | om
    mrigapanaye namah | om jatadharaya namah | om kailasavasine namah | om kavacine namah | om kathoraya
    namah | om tripurantakaya namah | om vrishankaya namah | om vrishabharudhaya namah | 40 om bhasmoddhulitavigrahaya
    namah | om samapriyaya namah | om svaramayaya namah | om trayimurtaye namah | om anishvaraya namah
    | om sarvajnaya namah | om paramatmane namah | om somasuryagnilocanaya namah | om havishe namah |
    om yajnamayaya namah | 50 om somaya namah | om pancavaktraya namah | om sadashivaya namah | om vishveshvaraya
    namah | om virabhadraya namah | om gananathaya namah | om prajapataye namah | om hiranyaretase namah
    | om durdharshaya namah | om girishaya namah | 60 om girishaya namah | om anaghaya namah | om bhujangabhushanaya
    namah | om bhargaya namah | om giridhanvane namah | om giripriyaya namah | om krittivasase namah |
    om purarataye namah | om bhagavate namah | om pramathadhipaya namah | 70 om mrityunjayaya namah |
    om sukshmatanave namah | om jagadvyapine namah | om jagadgurave namah | om vyomakeshaya namah | om
    mahasenajanakaya namah | om caruvikramaya namah | om rudraya namah | om bhutapataye namah | om sthanave
    namah | 80 om ahirbudhnyaya
