id: andhakakritam7shivastotram
category: stotram
name:
  english: andhakakritam7shivastotram
  devanagari: अन्धककृतं७शिवस्तोत्रम्
content:
  english: andhakakritam 7 shivastotram andhaka uvaca | namaste jagatam dhatre sharvaya trigunatmane |
    vrishabhasanasamsthaya shashankakritabhushana || 26|| namah khatvangahastaya namah shuladharaya ca
    | namo damarukodandakapalanaladharine || 27|| smaradehavinashaya murtyashtakamayatmane | namah svarupadehaya
    hyarupabahurupine || 28|| uttamangavinashaya virinceh srishtikarine | shmashanavasine nityam namo
    bhairavarupine || 29|| sarvagah sarvakarta ca tvam harta nanya eva hi | tvam bhumistvam rajashcaiva
    tvam jyotistvam tamastatha || 30|| tvam vapuh sarvabhutanam jivabhuto maheshvara | astaudevam danavendro
    devashulagrasamsthitah || 31|| iti shriskandapurane nagarakhande ekapancashattamadhikashatatamadhyayantargatam
    andhakakritam shivastotram samaptam | skandapurana | nagarakhanda | adhyaya 151
  devanagari: अन्धककृतं ७ शिवस्तोत्रम् अन्धक उवाच । नमस्ते जगतां धात्रे शर्वाय त्रिगुणात्मने । वृषभासनसंस्थाय
    शशाङ्ककृतभूषण ॥ २६॥ नमः खट्वाङ्गहस्ताय नमः शूलधराय च । नमो डमरुकोदण्डकपालानलधारिणे ॥ २७॥ स्मरदेहविनाशाय
    मूर्त्यष्टकमयात्मने । नमः स्वरूपदेहाय ह्यरूपबहुरूपिणे ॥ २८॥ उत्तमाङ्गविनाशाय विरिञ्चेः सृष्टिकारिणे
    । श्मशानवासिने नित्यं नमो भैरवरूपिणे ॥ २९॥ सर्वगः सर्वकर्ता च त्वं हर्ता नान्य एव हि । त्वं भूमिस्त्वं
    रजश्चैव त्वं ज्योतिस्त्वं तमस्तथा ॥ ३०॥ त्वं वपुः सर्वभूतानां जीवभूतो महेश्वर । अस्तौदेवं दानवेन्द्रो
    देवशूलाग्रसंस्थितः ॥ ३१॥ इति श्रीस्कन्दपुराणे नागरखण्डे एकपञ्चाशत्तमाधिकशततमाध्यायान्तर्गतं अन्धककृतं
    शिवस्तोत्रं समाप्तम् । स्कन्दपुराण । नागरखण्ड । अध्याय १५१
