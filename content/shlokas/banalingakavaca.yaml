id: banalingakavaca
category: kavacha
name:
  english: banalingakavaca
  devanagari: बाणलिन्गकवच
content:
  english: mamabhishta siddhyartham jape viniyogah || om karo me shirah patu namah patu lalatakam | shivasya
    kanthadesham me vakshodesham shadaksharam || 1|| baneshvarah katim patu dvavuru candrashekharah |
    padau vishveshvarah sakshat sarvangam lingarupadhrik || 2|| itidam kavacam purvvam banalingasya kante
    pathati yadi manushyah pranjalih shuddhacittah | vrajati shivasamipam rogoshokapramukto bahudhanasukhabhogi
    banalinga prasadatah || 3|| iti banalinga kavacam samaptam ||
  devanagari: ममाभीष्ट सिद्ध्यर्थं जपे विनियोगः ॥ ॐ कारो मे शिरः पातु नमः पातु ललाटकम् । शिवस्य कण्ठदेशं
    मे वक्षोदेशं षडक्षरम् ॥ १॥ बाणेश्वरः कटीं पातु द्वावूरू चन्द्रशेखरः । पादौ विश्वेश्वरः साक्षात् सर्वाङ्गं
    लिङ्गरूपधृक् ॥ २॥ इतिदं कवचं पूर्व्वं बाणलिङ्गस्य कान्ते पठति यदि मनुष्यः प्राञ्जलिः शुद्धचित्तः ।
    व्रजति शिवसमीपं रोगोशोकप्रमुक्तो बहुधनसुखभोगी बाणलिङ्ग प्रसादतः ॥ ३॥ इति बाणलिङ्ग कवचं समाप्तम् ॥
