id: batukabhairavakavacam
category: kavacha
name:
  english: batukabhairavakavacam
  devanagari: बटुकभैरवकवचम्
content:
  english: rinu prajna batukakavacam shubham || 3|| gopaniyam prayatnena matrikajarajo yatha | om asya
    shri batukabhairavakavacasya anandabhairava rishistrishtupchandah shribatukabhairavo devata bam bijam
    hrim shaktih om batukayeti kilakam mamabhishtasiddhyarthe jape viniyogah | om sahasrare mahacakre
    karpuradhavale guruh || 4|| patu mam batuko devo bhairavah sarvakarmasu | purvasyamasitango mam dishi
    rakshatu sarvada || 5|| agneyam ca ruruh patu dakshine candabhairavah | nairrityam krodhanah patu
    unmattah patu pashcime || 6|| vayavyam mam kapali ca nityam payatsureshvarah | bhishano bhairavah
    patu uttarasyam tu sarvada || 7|| samharabhairavah payadishanyam ca maheshvarah | urdhvam patu vidhata
    ca patale nandako vibhuh || 8|| sadyojatastu mam payatsarvato devasevitah | vamadevo vanante ca vane
    ghorastatha'vatu || 9|| jale tatpurushah patu sthale ishana eva ca | dakiniputrakah patu putran mem
    sarvatah prabhuh || 10|| hakini putrakah patu daramstulakinisutah | patu shakinikaputrah sainyam vai
    kalabhairavah || 11|| maliniputrakah patu pashunashvan gajamstatha | mahakalo'vatu kshetram shriyam
    me sarvato gira || 12|| vadyam vadyapriyah patu bhairavo nityasampada | etatkavacamishana tava snehatprakashitam
    || 13|| nakhyeyam naralokeshu sarabhutam surapriyam | yasmai kasmai na datavyam kavacam suradurlabham
    || 14|| na deyam parishishyebhyo kripanebhyashca shankara | yo dadati nishiddhebhyah sarvabhrashto
    bhavetkila || 15|| anena kavacenaiva raksham kritva vicakshanah | vicaranyatra kutrapi na vighnaih
    paribhuyate || 16|| mantrena rakshate yogi kavacam rakshakam yatah | tasmatsarvaprayatnena durlabham
    papacetasam || 17|| bhurje rambhatvaci vapi likhitva vidhivatprabho | kunkumenashtagandhena gorocanaishca
    kesaraih || 18|| dharayetpathayedvapi sampathedvapi nityashah | samprapnoti phalam sarvam natra karya
    vicarana || 19|| satatam pathyate yatra tatra bhairavasamsthitih | na shaknomi prabhavam vai kavacasyasya
    varnitum || 20|| namo bhairavadevaya sarvabhutaya vai namah | namastrailokyanathaya nathanathaya vai
    namah || 21|| iti shriharikrishnavinirmite brihajjyotisharnave dharmaskandhe upasanastavake shribatukabhairavopasanadhyaye
    bhairava tantre devirahasyoktam shribatukabhairavakavacanirupanam sampurnam ||
  devanagari: ृणु प्राज्ञ बटुककवचं शुभम् ॥ ३॥ गोपनीयं प्रयत्नेन मातृकाजारजो यथा । ॐ अस्य श्री बटुकभैरवकवचस्य
    आनन्दभैरव ऋषिस्त्रिष्टुप्छन्दः श्रीबटुकभैरवो देवता बं बीजं ह्रीं शक्तिः ॐ बटुकायेति कीलकं ममाभीष्टसिद्ध्यर्थे
    जपे विनियोगः । ॐ सहस्रारे महाचक्रे कर्पूरधवले गुरुः ॥ ४॥ पातु मां बटुको देवो भैरवः सर्वकर्मसु । पूर्वस्यामसिताङ्गो
    मां दिशि रक्षतु सर्वदा ॥ ५॥ आग्नेयां च रुरुः पातु दक्षिणे चण्डभैरवः । नैरृत्यां क्रोधनः पातु उन्मत्तः
    पातु पश्चिमे ॥ ६॥ वायव्यां मां कपाली च नित्यं पायात्सुरेश्वरः । भीषणो भैरवः पातु उत्तरास्यां तु सर्वदा
    ॥ ७॥ संहारभैरवः पायादीशान्यां च महेश्वरः । ऊर्ध्वं पातु विधाता च पाताले नन्दको विभुः ॥ ८॥ सद्योजातस्तु
    मां पायात्सर्वतो देवसेवितः । वामदेवो वनान्ते च वने घोरस्तथाऽवतु ॥ ९॥ जले तत्पुरुषः पातु स्थले ईशान
    एव च । डाकिनीपुत्रकः पातु पुत्रान् में सर्वतः प्रभुः ॥ १०॥ हाकिनी पुत्रकः पातु दारांस्तुलाकिनीसुतः
    । पातु शाकिनिकापुत्रः सैन्यं वै कालभैरवः ॥ ११॥ मालिनीपुत्रकः पातु पशूनश्वान् गजांस्तथा । महाकालोऽवतु
    क्षेत्रं श्रियं मे सर्वतो गिरा ॥ १२॥ वाद्यं वाद्यप्रियः पातु भैरवो नित्यसम्पदा । एतत्कवचमीशान तव स्नेहात्प्रकाशितम्
    ॥ १३॥ नाख्येयं नरलोकेषु सारभूतं सुरप्रियम् । यस्मै कस्मै न दातव्यं कवचं सुरदुर्लभम् ॥ १४॥ न देयं परिशिष्येभ्यो
    कृपणेभ्यश्च शङ्कर । यो ददाति निषिद्धेभ्यः सर्वभ्रष्टो भवेत्किल ॥ १५॥ अनेन कवचेनैव रक्षां कृत्वा विचक्षणः
    । विचरन्यत्र कुत्रापि न विघ्नैः परिभूयते ॥ १६॥ मन्त्रेण रक्षते योगी कवचं रक्षकं यतः । तस्मात्सर्वप्रयत्नेन
    दुर्लभं पापचेतसाम् ॥ १७॥ भूर्जे रम्भात्वचि वापि लिखित्वा विधिवत्प्रभो । कुङ्कुमेनाष्टगन्धेन गोरोचनैश्च
    केसरैः ॥ १८॥ धारयेत्पाठायेद्वापि सम्पठेद्वापि नित्यशः । सम्प्राप्नोति फलं सर्वं नात्र कार्या विचारणा
    ॥ १९॥ सततं पठ्यते यत्र तत्र भैरवसंस्थितिः । न शक्नोमि प्रभावं वै कवचस्यास्य वर्णितुम् ॥ २०॥ नमो भैरवदेवाय
    सर्वभूताय वै नमः । नमस्त्रैलोक्यनाथाय नाथनाथाय वै नमः ॥ २१॥ इति श्रीहरिकृष्णविनिर्मिते बृहज्ज्योतिषार्णवे
    धर्मस्कन्धे उपासनास्तवके श्रीबटुकभैरवोपासनाध्याये भैरव तन्त्रे देवीरहस्योक्तं श्रीबटुकभैरवकवचनिरूपणं
    सम्पूर्णम् ॥
