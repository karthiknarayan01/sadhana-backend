id: sudarshanashatakam
category: shataka
name:
  english: sudarshanashatakam
  devanagari: सुदर्शनशतकम्
content:
  english: kasturikarpura gorocana mauktika curnamishrita lakshmihastanirmitasvarnapatrasthita shridharacarvanasheshavitikam
    samarpayami || 5|| || iti pancopacarapujanam || atha dashadigbandhanam om namo bhagavate jvalacakraya
    aindrim disham cakrena badhnami | om namo bhagavate jvalacakrayagneyim disham cakrena badhnami | om
    namo bhagavate jvalacakraya dakshinam disham cakrena badhnami | om namo bhagavate jvalacakraya nairritim
    disham cakrena badhnami | om namo bhagavate jvalacakraya varunim disham cakrena badhnami | om namo
    bhagavate jvalacakraya vayavyadisham cakrena badhnami | om namo bhagavate jvalacakraya kauverim disham
    cakrena badhnami | om namo bhagavate jvalacakraya ishanadisham cakrena badhnami | om namo bhagavate
    jvalacakraya urdhvadisham cakrena badhnami | om namo bhagavate jvalacakraya adhodisham cakrena badhnami
    | om namo bhagavate kotisuryaprakashaya bhurbhuvahsvaromiti sarvadigbandhanam kuryat || sahasrara
    hum phat iti shadaksharamashtottara
  devanagari: कस्तूरीकर्पूर गोरोचन मौक्तिक चूर्णमिश्रित लक्ष्मीहस्तनिर्मितस्वर्णपात्रस्थित श्रीधरचर्वणशेषवीटिकां
    समर्पयामि ॥ ५॥ ॥ इति पञ्चोपचारपूजनम् ॥ अथ दशदिग्बन्धनं ॐ नमो भगवते ज्वालाचक्राय ऐन्द्रीं दिशं चक्रेण
    बध्नामि । ॐ नमो भगवते ज्वालाचक्रायाग्नेयीं दिशं चक्रेण बध्नामि । ॐ नमो भगवते ज्वालाचक्राय दक्षिणां
    दिशं चक्रेण बध्नामि । ॐ नमो भगवते ज्वालाचक्राय नैरृतीं दिशं चक्रेण बध्नामि । ॐ नमो भगवते ज्वालाचक्राय
    वारुणीं दिशं चक्रेण बध्नामि । ॐ नमो भगवते ज्वालाचक्राय वायव्यदिशं चक्रेण बध्नामि । ॐ नमो भगवते ज्वालाचक्राय
    कौवेरीं दिशं चक्रेण बध्नामि । ॐ नमो भगवते ज्वालाचक्राय ईशानदिशं चक्रेण बध्नामि । ॐ नमो भगवते ज्वालाचक्राय
    ऊर्ध्वदिशं चक्रेण बध्नामि । ॐ नमो भगवते ज्वालाचक्राय अधोदिशं चक्रेण बध्नामि । ॐ नमो भगवते कोटिसूर्यप्रकाशाय
    भूर्भुवःस्वरोमिति सर्वदिग्बन्धनं कुर्यात् ॥ सहस्रार हुं फट् इति षडक्षरमष्टोत्तर
