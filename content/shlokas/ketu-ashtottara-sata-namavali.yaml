id: ketu-ashtottara-sata-namavali
category: stotram
name:
  english: Ketu Ashtottara Sata Namavali
content:
  english: om ketave namah | om sthulashirase namah | om shiromatraya namah | om dhvajakritaye namah |
    om navagrahayutaya namah | om simhikasurigarbhasambhavaya namah | om mahabhitikaraya namah | om citravarnaya
    namah | om pingalakshakaya namah | om phalodhumrasankashaya namah || || om tikshnadamshtraya namah
    | om mahoragaya namah | om raktanetraya namah | om citrakarine namah | om tivrakopaya namah | om mahasuraya
    namah | om krurakanthaya namah | om krodhanidhaye namah | om chayagrahavisheshakaya namah | om antyagrahaya
    namah || || om mahashirshaya namah | om suryaraye namah | om pushpavadgrahine namah | om varadahastaya
    namah | om gadapanaye namah | om citravastradharaya namah | om citradhvajapatakaya namah | om ghoraya
    namah | om citrarathaya namah | om shikhine namah || || om kulutthabhakshakaya namah | om vaiduryabharanaya
    namah | om utpatajanakaya namah | om shukramitraya namah | om mandasakhaya namah | om gadadharaya
    namah | om nakapataye namah | om antarvedishvaraya namah | om jaiminigotrajaya namah | om citraguptatmane
    namah || || om dakshinamukhaya namah | om mukundavarapatraya namah | om mahasurakulodbhavaya namah
    | om ghanavarnaya namah | om lambadehaya namah | om mrityuputraya namah | om utpatarupadharine namah
    | om adrishyaya namah | om kalagnisannibhaya namah | om nripidaya namah || || om grahakarine namah
    | om sarvopadravakarakaya namah | om citraprasutaya namah | om analaya namah | om sarvavyadhivinashakaya
    namah | om apasavyapracarine namah | om navame papadayakaya namah | om pancame shokadaya namah | om
    uparagakhecaraya namah | om atipurushakarmane namah || || om turiye sukhapradaya namah | om tritiye
    vairadaya namah | om papagrahaya namah | om sphotakakarakaya namah | om prananathaya namah | om pancame
    shramakarakaya namah | om dvitiye'sphutavagdatre namah | om vishakulitavaktrakaya namah | om kamarupine
    namah | om simhadantaya namah || || om satye anritavate namah | om caturthe matrinashaya namah | om
    navame pitrinashakaya namah | om antye vairapradaya namah | om sutanandanabandhakaya namah | om sarpakshijataya
    namah | om anangaya namah | om karmarashyudbhavaya namah | om upante kirtidaya namah | om saptame
    kalahapradaya namah || || om ashtame vyadhikartre namah | om dhane bahusukhapradaya namah | om janane
    rogadaya namah | om urdhvamurdhajaya namah | om grahanayakaya namah | om papadrishtaye namah | om
    khecaraya namah | om shambhavaya namah | om asheshapujitaya namah | om shashvataya namah || || om
    nataya namah | om shubha'shubhaphalapradaya namah | om dhumraya namah | om sudhapayine namah | om
    ajitaya namah | om bhaktavatsalaya namah | om simhasanaya namah | om ketumurtaye namah | om ravindudyutinashakaya
    namah | om amaraya namah || || om pidakaya namah | om amartyaya namah | om vishnudrishtaya namah |
    om asureshvaraya namah | om bhaktarakshaya namah | om vaicitryakapatasyandanaya namah | om vicitraphaladayine
    namah | om bhaktabhishtaphalapradaya namah ||
  devanagari: ॐ केतवे नमः । ॐ स्थूलशिरसे नमः । ॐ शिरोमात्राय नमः । ॐ ध्वजाकृतये नमः । ॐ नवग्रहयुताय नमः
    । ॐ सिंहिकासुरीगर्भसम्भवाय नमः । ॐ महाभीतिकराय नमः । ॐ चित्रवर्णाय नमः । ॐ पिङ्गलाक्षकाय नमः । ॐ फलोधूम्रसङ्काशाय
    नमः ॥ ॥ ॐ तीक्ष्णदंष्ट्राय नमः । ॐ महोरगाय नमः । ॐ रक्तनेत्राय नमः । ॐ चित्रकारिणे नमः । ॐ तीव्रकोपाय
    नमः । ॐ महासुराय नमः । ॐ क्रूरकण्ठाय नमः । ॐ क्रोधनिधये नमः । ॐ छायाग्रहविशेषकाय नमः । ॐ अन्त्यग्रहाय
    नमः ॥ ॥ ॐ महाशीर्षाय नमः । ॐ सूर्यारये नमः । ॐ पुष्पवद्ग्रहिणे नमः । ॐ वरदहस्ताय नमः । ॐ गदापाणये
    नमः । ॐ चित्रवस्त्रधराय नमः । ॐ चित्रध्वजपताकाय नमः । ॐ घोराय नमः । ॐ चित्ररथाय नमः । ॐ शिखिने नमः
    ॥ ॥ ॐ कुलुत्थभक्षकाय नमः । ॐ वैडूर्याभरणाय नमः । ॐ उत्पातजनकाय नमः । ॐ शुक्रमित्राय नमः । ॐ मन्दसखाय
    नमः । ॐ गदाधराय नमः । ॐ नाकपतये नमः । ॐ अन्तर्वेदीश्वराय नमः । ॐ जैमिनिगोत्रजाय नमः । ॐ चित्रगुप्तात्मने
    नमः ॥ ॥ ॐ दक्षिणामुखाय नमः । ॐ मुकुन्दवरपात्राय नमः । ॐ महासुरकुलोद्भवाय नमः । ॐ घनवर्णाय नमः । ॐ
    लम्बदेहाय नमः । ॐ मृत्युपुत्राय नमः । ॐ उत्पातरूपधारिणे नमः । ॐ अदृश्याय नमः । ॐ कालाग्निसन्निभाय
