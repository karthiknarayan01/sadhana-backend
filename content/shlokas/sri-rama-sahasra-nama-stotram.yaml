id: sri-rama-sahasra-nama-stotram
category: stotram
name:
  english: Sri Rama Sahasra Nama Stotram
content:
  english: asya shriramasahasranamastotra mahamantrasya shriramah paramatma devata shrimanmahavishnuriti
    bijam gunabhrinnirguno mahaniti shaktih samsaratarako rama iti mantrah saccidanandavigraha iti kilakam
    akshayah purushah sakshiti kavacam ajeyah sarvabhutanam ityastram rajivalocanah shrimaniti dhyanam
    shriramaprityarthe divyasahasranamajape viniyogah | dhyanam shriraghavam dasharathatmajamaprameyam
    sitapatim raghukulanvayaratnadipam | ajanubahumaravindadalayataksham ramam nishacaravinashakaram namami
    || nilam bhujashyamala komalangam sita samaropita vamabhagam | panau mahasayaka caru capam namami
    ramam raghuvamshanatham || lokabhiramam ranarangadhiram rajivanetram raghuvamshanatham | karunyarupam
    karunakaram tam shri ramacandram sharanam prapadye || dhyayedajanubahum dhritasharadhanusham baddhapadmasanastham
    pitam vaso vasanam navakaladalaspardhinetram prasannam | vamankarudhasitamukhakamalamilalocanam niradabham
    nanalankaradiptam dadhatamurujatamandalam ramacandram || nilambhodarakanti kantamanusham virasanadhyasinam
    mudram jnanamayim dadhanamaparam hastambujam januni | sitam parshvagatam saroruhakaram vidyunnibham
    raghavam pashyantim mukutangadadi vividha kalpojjvalangam bhaje || stotram rajivalocanah shriman shriramo
    raghupungavah | ramabhadrah sadacaro rajendro janakipatih || || agraganyo varenyashca varadah parameshvarah
    | janardano jitamitrah pararthaikaprayojanah || || vishvamitrapriyo dantah shatrujicchatrutapanah
    | sarvajnah sarvadevadih sharanyo valimardanah || || jnanabhavyo'paricchedyo vagmi satyavratah shucih
    | jnanagamyo dridhaprajnah kharadhvamsi pratapavan || || dyutimanatmavanviro jitakrodho'rimardanah
    | vishvarupo vishalakshah prabhuh parivridho dridhah || || ishah khadgadharah shriman kausaleyo'nasuyakah
    | vipulamso mahoraskah parameshthi parayanah || || satyavratah satyasandho guruh paramadharmikah |
    lokajno lokavandyashca lokatma lokakritparah || || anadirbhagavan sevyo jitamayo raghudvahah | ramo
    dayakaro dakshah sarvajnah sarvapavanah || || brahmanyo nitiman gopta sarvadevamayo harih | sundarah
    pitavasashca sutrakarah puratanah || || saumyo maharshih kodandi sarvajnah sarvakovidah | kavih sugrivavaradah
    sarvapunyadhikapradah || || bhavyo jitarishadvargo mahodaro'ghanashanah | sukirtiradipurushah kantah
    punyakritagamah || || akalmashashcaturbahuh sarvavaso durasadah | smitabhashi nivrittatma smritiman
    viryavan prabhuh || || dhiro danto ghanashyamah sarvayudhavisharadah | adhyatmayoganilayah sumana
    lakshmanagrajah || || sarvatirthamayah shurah sarvayajnaphalapradah | yajnasvarupi yajnesho jaramaranavarjitah
    || || varnashramakaro varni shatrujit purushottamah | vibhishanapratishthata paramatma paratparah
    || || pramanabhuto durjneyah purnah parapuranjayah | anantadrishtiranando dhanurvedo dhanurdharah
    || || gunakaro gunashreshthah saccidanandavigrahah | abhivandyo mahakayo vishvakarma visharadah ||
    || vinitatma vitaragah tapasvisho janeshvarah | kalyanaprakritih kalpah sarveshah sarvakamadah ||
    || akshayah purushah sakshi keshavah purushottamah | lokadhyaksho mahamayo vibhishanavarapradah ||
    || anandavigraho jyotirhanumatprabhuravyayah | bhrajishnuh sahano bhokta satyavadi bahushrutah ||
    || sukhadah karanam karta bhavabandhavimocanah | devacudamanirneta brahmanyo brahmavardhanah || ||
    samsarottarako ramah sarvaduhkhavimokshakrit | vidvattamo vishvakarta vishvaharta ca vishvadhrit ||
    || nityo niyatakalyanah sitashokavinashakrit | kakutsthah pundarikaksho vishvamitrabhayapahah || ||
    maricamathano ramo viradhavadhapanditah | dussvapnanashano ramyah kiriti tridashadhipah || || mahadhanurmahakayo
    bhimo bhimaparakramah | tattvasvarupi tattvajnah tattvavadi suvikramah || || bhutatma bhutakritsvami
    kalajnani mahapatuh | anirvinno gunagrahi nishkalankah kalankaha || || svabhavabhadrah shatrughnah
    keshavah sthanurishvarah | bhutadih shambhuradityah sthavishthah shashvato dhruvah || || kavaci kundali
    cakri khadgi bhaktajanapriyah | amrityurjanmarahitah sarvajitsarvagocarah || || anuttamo'prameyatma
    sarvadirgunasagarah | samah samatma samago jatamukutamanditah || || ajeyah sarvabhutatma vishvakseno
    mahatapah | lokadhyaksho mahabahuramrito vedavittamah || || sahishnuh sadgatih shasta vishvayonirmahadyutih
    | atindra urjitah pramshurupendro vamano bali || || dhanurvedo vidhata ca brahma vishnushca shankarah
    | hamso maricirgovindo ratnagarbho mahamatih || || vyaso vacaspatih sarvadarpita'suramardanah | janakivallabhah
    pujyah prakatah pritivardhanah || || sambhavo'tindriyo vedyo'nirdesho jambavatprabhuh | madano mathano
    vyapi vishvarupo niranjanah || || narayano'granih sadhurjatayupritivardhanah | naikarupo jagannathah
    surakaryahitah svabhuh || || jitakrodho jitaratih plavagadhiparajyadah | vasudah subhujo naikamayo
    bhavyapramodanah || || candamshuh siddhidah kalpah sharanagatavatsalah | agado rogaharta ca mantrajno
    mantrabhavanah || || saumitrivatsalo dhuryo vyaktavyaktasvarupadhrik | vasishtho gramanih shrimananukulah
    priyamvadah || || atulah sattviko dhirah sharasanavisharadah | jyeshthah sarvagunopetah shaktimamstatakantakah
    || || vaikunthah praninam pranah kamathah kamalapatih | govardhanadharo matsyarupah karunyasagarah
    || || kumbhakarnaprabhetta ca gopigopalasamvritah | mayavi svapano vyapi rainukeyabalapahah || ||
    pinakamathano vandyah samartho garudadhvajah | lokatrayashrayo lokabharito bharatagrajah || || shridharah
    sadgatirlokasakshi narayano budhah | manovegi manorupi purnah purushapungavah || || yadushreshtho
    yadupatirbhutavasah suvikramah | tejodharo dharadharashcaturmurtirmahanidhih || || canuramardano divyah
    shanto bharatavanditah | shabdatigo gabhiratma komalangah prajagarah || || lokagarbhah sheshashayi
    kshirabdhinilayo'malah | atmayoniradinatma sahasrakshah sahasrapat || || amritamshurmahagarbho nivrittavishayasprihah
    | trikalajno munih sakshi vihayasagatih kriti || || parjanyah kumudo bhutavasah kamalalocanah | shrivatsavakshah
    shrivaso viraha lakshmanagrajah || || lokabhiramo lokarimardanah sevakapriyah | sanatanatamo meghashyamalo
    rakshasantakrit || || divyayudhadharah shrimanaprameyo jitendriyah | bhudevavandyo janakapriyakritprapitamahah
    || || uttamah satvikah satyah satyasandhastrivikramah | suvratah sulabhah sukshmah sughoshah sukhadah
    sudhih || || damodaro'cyutah sharngi vamano madhuradhipah | devakinandanah shaurih shurah kaitabhamardanah
    || || saptatalaprabhetta ca mitravamshapravardhanah | kalasvarupi kalatma kalah kalyanadah kavih |
    samvatsara rituh paksho hyayanam divaso yugah || || stavyo vivikto nirlepah sarvavyapi nirakulah |
    anadinidhanah sarvalokapujyo niramayah || || raso rasajnah sarajno lokasaro rasatmakah | sarvaduhkhatigo
    vidyarashih paramagocarah || || shesho vishesho vigatakalmasho raghunayakah | varnashreshtho varnavahyo
    varnyo varnyagunojjvalah || || karmasakshyamarashreshtho devadevah sukhapradah | devadhidevo devarshirdevasuranamaskritah
    || || sarvadevamayashcakri sharngapaniranuttamah | mano buddhirahankarah prakritih purusho'vyayah
    || || ahalyapavanah svami pitribhakto varapradah | nyayo nyayi nayi shrimannayo nagadharo dhruvah
    || || lakshmivishvambharabharta devendro balimardanah | vanarimardano yajvanuttamo munisevitah ||
    || devagranih shivadhyanatatparah paramah parah | samaganapriyo'krurah punyakirtih sulocanah || ||
    punyah punyadhikah purvah purnah purayita ravih | jatilah kalmashadhvantaprabhanjanavibhavasuh ||
    || avyaktalakshano'vyakto dashasyadvipakesari | kalanidhih kalarupo kamalanandavardhanah || || jayo
    jitarih sarvadih shamano bhavabhanjanah | alankarishnuracalo rocishnurvikramottamah || || amshuh shabdapatih
    shabdagocaro ranjano raghuh | nishshabdah pranavo mali sthulah sukshmo vilakshanah || || atmayonirayonishca
    saptajihvah sahasrapat | sanatanatamah sragvi peshalo javinam varah || || shaktiman shankhabhrinnathah
    gadapadmarathangabhrit | niriho nirvikalpashca cidrupo vitasadhvasah || || shatananah sahasrakshah
    shatamurtirghanaprabhah | hritpundarikashayanah kathino drava eva ca || || ugro grahapatih krishno
    samartho'narthanashanah | adharmashatruh rakshoghnah puruhutah purushtutah || || brahmagarbho brihadgarbho
    dharmadhenurdhanagamah | hiranyagarbho jyotishman sulalatah suvikramah || || shivapujaratah shriman
    bhavanipriyakridvashi | naro narayanah shyamah kapardi nilalohitah || || rudrah pashupatih sthanurvishvamitro
    dvijeshvarah | matamaho matarishva virinco vishtarashravah || || akshobhyah sarvabhutanam candah satyaparakramah
    | valakhilyo mahakalpah kalpavrikshah kaladharah || || nidaghastapano'moghah shlakshnah parabalapahrit
    | kabandhamathano divyah kambugrivah shivapriyah || || shankho'nilah sunishpannah sulabhah shishiratmakah
    | asamsrishto'tithih shurah pramathi papanashakrit || || vasushravah kavyavahah pratapto vishvabhojanah
    | ramo nilotpalashyamo jnanaskandho mahadyutih || || pavitrapadah paparirmanipuro nabhogatih | uttarano
    dushkritiha durdharsho dussaho'bhayah || || amritesho'mritavapurdharmi dharmah kripakarah | bhargo
    vivasvanadityo yogacaryo divaspatih || || udarakirtirudyogi vanmayah sadasanmayah | nakshatramali
    nakeshah svadhishthanashadashrayah || || caturvargaphalo varni shaktitrayaphalam nidhih | nidhanagarbho
    nirvyajo girisho vyalamardanah || || shrivallabhah shivarambhah shantirbhadrah samanjasah | bhushayo
    bhutikridbhutirbhushano bhutavahanah || || akayo bhaktakayasthah kalajnani mahavatuh | pararthavrittiracalo
    viviktah shrutisagarah || || svabhavabhadro madhyasthah samsarabhayanashanah | vedyo vaidyo viyadgopta
    sarvamaramunishvarah || || surendrah karanam karma karmakritkarmyadhokshajah | dhyeyo dhuryo dharadhishah
    sankalpah sharvaripatih || || paramarthagururvriddhah shucirashritavatsalah | vishnurjishnurvibhuryajno
    yajnesho yajnapalakah || || prabhavishnurgrasishnushca lokatma lokabhavanah | keshavah keshiha kavyah
    kavih karanakaranam || || kalakarta kalashesho vasudevah purushtutah | adikarta varahashca madhavo
    madhusudanah || || narayano naro hamso vishvakseno janardanah | vishvakarta mahayajno jyotishman purushottamah
    || || vaikunthah pundarikakshah krishnah suryah surarcitah | narasimho mahabhimo vakradamshtro nakhayudhah
    || || adidevo jagatkarta yogisho garudadhvajah | govindo gopatirgopta bhupatirbhuvaneshvarah || ||
    padmanabho hrishikesho dhata damodarah prabhuh | trivikramastrilokesho brahmeshah pritivardhanah ||
    || vamano dushtadamano govindo gopavallabhah | bhaktapriyo'cyutah satyah satyakirtirdhritih smritih
    || || karunyam karuno vyasah papaha shantivardhanah | sannyasi shastratattvajno mandaradriniketanah
    || || badarinilayah shantastapasvi vaidyutaprabhah | bhutavaso guhavasah shrinivasah shriyah patih
    || || tapovaso mudavasah satyavasah sanatanah | purushah pushkarah punyah pushkaraksho maheshvarah
    || || purnamurtih puranajnah punyadah punyavardhanah | shankhi cakri gadi sharngi langali musali hali
    || || kiriti kundali hari mekhali kavaci dhvaji | yoddha jeta mahaviryah shatrujicchatrutapanah ||
    || shasta shastrakarah shastram shankara shankarastutah | sarathih sattvikah svami samavedapriyah
    samah || || pavanah sahasah shaktih sampurnangah samriddhiman | svargadah kamadah shridah kirtido'kirtinashanah
    || || mokshadah pundarikakshah kshirabdhikritaketanah | sarvatma sarvalokeshah prerakah papanashanah
    || || sarvadevo jagannathah sarvalokamaheshvarah | sargasthityantakriddevah sarvalokasukhavahah ||
    || akshayyah shashvato'nantah kshayavriddhivivarjitah | nirlepo nirgunah sukshmo nirvikaro niranjanah
    || || sarvopadhivinirmuktah sattamatravyavasthitah | adhikari vibhurnityah paramatma sanatanah ||
    || acalo nirmalo vyapi nityatripto nirashrayah | shyamo yuva lohitaksho diptasyo mitabhashanah ||
    || ajanubahuh sumukhah simhaskandho mahabhujah | satyavan gunasampannah svayantejah sudiptiman ||
    || kalatma bhagavan kalah kalacakrapravartakah | narayanah paranjyotih paramatma sanatanah || || vishvasridvishvagopta
    ca vishvabhokta ca shashvatah | vishveshvaro vishvamurtirvishvatma vishvabhavanah || || sarvabhutasuhricchantah
    sarvabhutanukampanah | sarveshvareshvarah sarvah shrimanashritavatsalah || || sarvagah sarvabhuteshah
    sarvabhutashayasthitah | abhyantarasthastamasashchetta narayanah parah || || anadinidhanah srashta
    prajapatipatirharih | narasimho hrishikeshah sarvatma sarvadrigvashi || || jagatastasthushashcaiva
    prabhurneta sanatanah | karta dhata vidhata ca sarvesham prabhurishvarah || || sahasramurdha vishvatma
    vishnurvishvadrigavyayah | puranapurushah srashta sahasrakshah sahasrapat || || tattvam narayano vishnurvasudevah
    sanatanah | paramatma param brahma saccidanandavigrahah || || paranjyotih parandhamah parakashah paratparah
    | acyutah purushah krishnah shashvatah shiva ishvarah || || nityah sarvagatah sthanurugrah sakshi
    prajapatih | hiranyagarbhah savita lokakrillokabhridvibhuh || || ramah shriman mahavishnurjishnurdevahitavahah
    | tattvatma tarakam brahma shashvatah sarvasiddhidah || || akaravacyo bhagavan shrirbhunilapatih puman
    | sarvalokeshvarah shriman sarvajnah sarvatomukhah || || svami sushilah sulabhah sarvajnah sarvashaktiman
    | nityah sampurnakamashca naisargikasuhritsukhi || || kripapiyushajaladhih sharanyah sarvadehinam
    | shrimannarayanah svami jagatam patirishvarah || || shrishah sharanyo bhutanam samshritabhishtadayakah
    | anantah shripati ramo gunabhrinnirguno mahan || || || iti anandaramayane valmikiye shriramasahasranamastotram
    ||
  devanagari: अस्य श्रीरामसहस्रनामस्तोत्र महामन्त्रस्य श्रीरामः परमात्मा देवता श्रीमान्महाविष्णुरिति बीजं
    गुणभृन्निर्गुणो महानिति शक्तिः संसारतारको राम इति मन्त्रः सच्चिदानन्दविग्रह इति कीलकं अक्षयः पुरुषः
    साक्षीति कवचं अजेयः सर्वभूतानां इत्यस्त्रं राजीवलोचनः श्रीमानिति ध्यानं श्रीरामप्रीत्यर्थे दिव्यसहस्रनामजपे
    विनियोगः । ध्यानं श्रीराघवं दशरथात्मजमप्रमेयं सीतापतिं रघुकुलान्वयरत्नदीपम् । आजानुबाहुमरविन्ददलायताक्षं
    रामं निशाचरविनाशकरं नमामि ॥ नीलां भुजश्यामल कोमलाङ्गं सीता समारोपित वामभागम् । पाणौ महासायक चारु चापं
    नमामि रामं रघुवंशनाथम् ॥ लोकाभिरामं रणरङ्गधीरं राजीवनेत्रं रघुवंशनाथम् । कारुण्यरूपं करुणाकरं तं श्री
    रामचन्द्रं शरणं प्रपद्ये ॥ ध्यायेदाजानुबाहुं धृतशरधनुषं बद्धपद्मासनस्थं पीतं वासो वसानं नवकलदलस्पर्धिनेत्रं
    प्रसन्नम् । वामाङ्कारूढसीतामुखकमलमिललोचनं नीरदाभं नानालङ्कारदीप्तं दधतमुरुजटामण्डलं रामचन्द्रम् ॥
    नीलाम्भोदरकान्ति कान्तमनुषं वीरासनाध्यासिनं मुद्रां ज्ञानमयीं दधानमपरं हस्ताम्बुजं जानुनि । सीतां
    पार्श्वगतां सरोरुहकरां विद्युन्निभां राघवं पश्यन्तीं मुकुटाङ्गदादि विविध कल्पोज्ज्वलाङ्गं भजे ॥ स्तोत्रं
    राजीवलोचनः श्रीमान् श्रीरामो रघुपुङ्गवः । रामभद्रः सदाचारो राजेन्द्रो जानकीपतिः ॥ ॥ अग्रगण्यो वरेण्यश्च
    वरदः परमेश्वरः । जनार्दनो जितामित्रः परार्थैकप्रयोजनः ॥ ॥ विश्वामित्रप्रियो दान्तः शत्रुजिच्छत्रुतापनः
    । सर्वज्ञः सर्वदेवादिः शरण्यो वालिमर्दनः ॥ ॥ ज्ञानभाव्योऽपरिच्छेद्यो वाग्मी सत्यव्रतः शुचिः । ज्ञानगम्यो
    दृढप्रज्ञः खरध्वंसी प्रतापवान् ॥ ॥ द्युतिमानात्मवान्वीरो जितक्रोधोऽरिमर्दनः । विश्वरूपो विशालाक्षः
    प्रभुः परिवृढो दृढः ॥ ॥ ईशः खड्गधरः श्रीमान् कौसलेयोऽनसूयकः । विपुलांसो महोरस्कः परमेष्ठी परायणः ॥
    ॥ सत्यव्रतः सत्यसन्धो गुरुः परमधार्मिकः । लोकज्ञो लोकवन्द्यश्च लोकात्मा लोककृत्परः ॥ ॥ अनादिर्भगवान्
    सेव्यो जितमायो रघूद्वहः । रामो दयाकरो दक्षः सर्वज्ञः सर्वपावनः ॥ ॥ ब्रह्मण्यो नीतिमान् गोप्ता सर्वदेवमयो
    हरिः । सुन्दरः पीतवासाश्च सूत्रकारः पुरातनः ॥ ॥ सौम्यो महर्षिः कोदण्डी सर्वज्ञः सर्वकोविदः । कविः
    सुग्रीववरदः सर्वपुण्याधिकप्रदः ॥ ॥ भव्यो जितारिषड्वर्गो महोदारोऽघनाशनः । सुकीर्तिरादिपुरुषः कान्तः
    पुण्यकृतागमः ॥ ॥ अकल्मषश्चतुर्बाहुः सर्वावासो दुरासदः । स्मितभाषी निवृत्तात्मा स्मृतिमान् वीर्यवान्
    प्रभुः ॥ ॥ धीरो दान्तो घनश्यामः सर्वायुधविशारदः । अध्यात्मयोगनिलयः सुमना लक्ष्मणाग्रजः ॥ ॥ सर्वतीर्थमयः
    शूरः सर्वयज्ञफलप्रदः । यज्ञस्वरूपी यज्ञेशो जरामरणवर्जितः ॥ ॥ वर्णाश्रमकरो वर्णी शत्रुजित् पुरुषोत्तमः
    । विभीषणप्रतिष्ठाता परमात्मा परात्परः ॥ ॥ प्रमाणभूतो दुर्ज्ञेयः पूर्णः परपुरञ्जयः । अनन्तदृष्टिरानन्दो
    धनुर्वेदो धनुर्धरः ॥ ॥ गुणाकरो गुणश्रेष्ठः सच्चिदानन्दविग्रहः । अभिवन्द्यो महाकायो विश्वकर्मा विशारदः
    ॥ ॥ विनीतात्मा वीतरागः तपस्वीशो जनेश्वरः । कल्याणप्रकृतिः कल्पः सर्वेशः सर्वकामदः ॥ ॥ अक्षयः पुरुषः
    साक्षी केशवः पुरुषोत्तमः । लोकाध्यक्षो महामायो विभीषणवरप्रदः ॥ ॥ आनन्दविग्रहो ज्योतिर्हनुमत्प्रभुरव्ययः
    । भ्राजिष्णुः सहनो भोक्ता सत्यवादी बहुश्रुतः ॥ ॥ सुखदः कारणं कर्ता भवबन्धविमोचनः । देवचूडामणिर्नेता
    ब्रह्मण्यो ब्रह्मवर्धनः ॥ ॥ संसारोत्तारको रामः सर्वदुःखविमोक्षकृत् । विद्वत्तमो विश्वकर्ता विश्वहर्ता
    च विश्वधृत् ॥ ॥ नित्यो नियतकल्याणः सीताशोकविनाशकृत् । काकुत्स्थः पुण्डरीकाक्षो विश्वामित्रभयापहः ॥
    ॥ मारीचमथनो रामो विराधवधपण्डितः । दुस्स्वप्ननाशनो रम्यः किरीटी त्रिदशाधिपः ॥ ॥ महाधनुर्महाकायो भीमो
    भीमपराक्रमः । तत्त्वस्वरूपी तत्त्वज्ञः तत्त्ववादी सुविक्रमः ॥ ॥ भूतात्मा भूतकृत्स्वामी कालज्ञानी महापटुः
    । अनिर्विण्णो गुणग्राही निष्कलङ्कः कलङ्कहा ॥ ॥ स्वभावभद्रः शत्रुघ्नः केशवः स्थाणुरीश्वरः । भूतादिः
    शम्भुरादित्यः स्थविष्ठः शाश्वतो ध्रुवः ॥ ॥ कवची कुण्डली चक्री खड्गी भक्तजनप्रियः । अमृत्युर्जन्मरहितः
    सर्वजित्सर्वगोचरः ॥ ॥ अनुत्तमोऽप्रमेयात्मा सर्वादिर्गुणसागरः । समः समात्मा समगो जटामुकुटमण्डितः ॥
    ॥ अजेयः सर्वभूतात्मा विष्वक्सेनो महातपः । लोकाध्यक्षो महाबाहुरमृतो वेदवित्तमः ॥ ॥ सहिष्णुः सद्गतिः
    शास्ता विश्वयोनिर्महाद्युतिः । अतीन्द्र ऊर्जितः प्रांशुरुपेन्द्रो वामनो बली ॥ ॥ धनुर्वेदो विधाता च
    ब्रह्मा विष्णुश्च शङ्करः । हंसो मरीचिर्गोविन्दो रत्नगर्भो महामतिः ॥ ॥ व्यासो वाचस्पतिः सर्वदर्पिताऽसुरमर्दनः
    । जानकीवल्लभः पूज्यः प्रकटः प्रीतिवर्धनः ॥ ॥ सम्भवोऽतीन्द्रियो वेद्योऽनिर्देशो जाम्बवत्प्रभुः । मदनो
    मथनो व्यापी विश्वरूपो निरञ्जनः ॥ ॥ नारायणोऽग्रणीः साधुर्जटायुप्रीतिवर्धनः । नैकरूपो जगन्नाथः सुरकार्यहितः
    स्वभूः ॥ ॥ जितक्रोधो जितारातिः प्लवगाधिपराज्यदः । वसुदः सुभुजो नैकमायो भव्यप्रमोदनः ॥ ॥ चण्डांशुः
    सिद्धिदः कल्पः शरणागतवत्सलः । अगदो रोगहर्ता च मन्त्रज्ञो मन्त्रभावनः ॥ ॥ सौमित्रिवत्सलो धुर्यो व्यक्ताव्यक्तस्वरूपधृक्
    । वसिष्ठो ग्रामणीः श्रीमाननुकूलः प्रियंवदः ॥ ॥ अतुलः सात्त्विको धीरः शरासनविशारदः । ज्येष्ठः सर्वगुणोपेतः
    शक्तिमांस्ताटकान्तकः ॥ ॥ वैकुण्ठः प्राणिनां प्राणः कमठः कमलापतिः । गोवर्धनधरो मत्स्यरूपः कारुण्यसागरः
    ॥ ॥ कुम्भकर्णप्रभेत्ता च गोपीगोपालसंवृतः । मायावी स्वापनो व्यापी रैणुकेयबलापहः ॥ ॥ पिनाकमथनो वन्द्यः
    समर्थो गरुडध्वजः । लोकत्रयाश्रयो लोकभरितो भरताग्रजः ॥ ॥ श्रीधरः सद्गतिर्लोकसाक्षी नारायणो बुधः । मनोवेगी
    मनोरूपी पूर्णः पुरुषपुङ्गवः ॥ ॥ यदुश्रेष्ठो यदुपतिर्भूतावासः सुविक्रमः । तेजोधरो धराधारश्चतुर्मूर्तिर्महानिधिः
    ॥ ॥ चाणूरमर्दनो दिव्यः शान्तो भरतवन्दितः । शब्दातिगो गभीरात्मा कोमलाङ्गः प्रजागरः ॥ ॥ लोकगर्भः शेषशायी
    क्षीराब्धिनिलयोऽमलः । आत्मयोनिरदीनात्मा सहस्राक्षः सहस्रपात् ॥ ॥ अमृतांशुर्महागर्भो निवृत्तविषयस्पृहः
    । त्रिकालज्ञो मुनिः साक्षी विहायसगतिः कृती ॥ ॥ पर्जन्यः कुमुदो भूतावासः कमललोचनः । श्रीवत्सवक्षाः
    श्रीवासो वीरहा लक्ष्मणाग्रजः ॥ ॥ लोकाभिरामो लोकारिमर्दनः सेवकप्रियः । सनातनतमो मेघश्यामलो राक्षसान्तकृत्
    ॥ ॥ दिव्यायुधधरः श्रीमानप्रमेयो जितेन्द्रियः । भूदेववन्द्यो जनकप्रियकृत्प्रपितामहः ॥ ॥ उत्तमः सात्विकः
    सत्यः सत्यसन्धस्त्रिविक्रमः । सुव्रतः सुलभः सूक्ष्मः सुघोषः सुखदः सुधीः ॥ ॥ दामोदरोऽच्युतः शार्ङ्गी
    वामनो मधुराधिपः । देवकीनन्दनः शौरिः शूरः कैटभमर्दनः ॥ ॥ सप्ततालप्रभेत्ता च मित्रवंशप्रवर्धनः । कालस्वरूपी
    कालात्मा कालः कल्याणदः कविः । संवत्सर ऋतुः पक्षो ह्ययनं दिवसो युगः ॥ ॥ स्तव्यो विविक्तो निर्लेपः सर्वव्यापी
    निराकुलः । अनादिनिधनः सर्वलोकपूज्यो निरामयः ॥ ॥ रसो रसज्ञः सारज्ञो लोकसारो रसात्मकः । सर्वदुःखातिगो
    विद्याराशिः परमगोचरः ॥ ॥ शेषो विशेषो विगतकल्मषो रघुनायकः । वर्णश्रेष्ठो वर्णवाह्यो वर्ण्यो वर्ण्यगुणोज्ज्वलः
    ॥ ॥ कर्मसाक्ष्यमरश्रेष्ठो देवदेवः सुखप्रदः । देवाधिदेवो देवर्षिर्देवासुरनमस्कृतः ॥ ॥ सर्वदेवमयश्चक्री
    शार्ङ्गपाणिरनुत्तमः । मनो बुद्धिरहङ्कारः प्रकृतिः पुरुषोऽव्ययः ॥ ॥ अहल्यापावनः स्वामी पितृभक्तो वरप्रदः
    । न्यायो न्यायी नयी श्रीमान्नयो नगधरो ध्रुवः ॥ ॥ लक्ष्मीविश्वम्भराभर्ता देवेन्द्रो बलिमर्दनः । वाणारिमर्दनो
    यज्वानुत्तमो मुनिसेवितः ॥ ॥ देवाग्रणीः शिवध्यानतत्परः परमः परः । सामगानप्रियोऽक्रूरः पुण्यकीर्तिः
    सुलोचनः ॥ ॥ पुण्यः पुण्याधिकः पूर्वः पूर्णः पूरयिता रविः । जटिलः कल्मषध्वान्तप्रभञ्जनविभावसुः ॥ ॥
    अव्यक्तलक्षणोऽव्यक्तो दशास्यद्वीपकेसरी । कलानिधिः कलारूपो कमलानन्दवर्धनः ॥ ॥ जयो जितारिः सर्वादिः
    शमनो भवभञ्जनः । अलङ्करिष्णुरचलो रोचिष्णुर्विक्रमोत्तमः ॥ ॥ अंशुः शब्दपतिः शब्दगोचरो रञ्जनो रघुः ।
    निश्शब्दः प्रणवो माली स्थूलः सूक्ष्मो विलक्षणः ॥ ॥ आत्मयोनिरयोनिश्च सप्तजिह्वः सहस्रपात् । सनातनतमः
    स्रग्वी पेशलो जविनां वरः ॥ ॥ शक्तिमान् शङ्खभृन्नाथः गदापद्मरथाङ्गभृत् । निरीहो निर्विकल्पश्च चिद्रूपो
    वीतसाध्वसः ॥ ॥ शताननः सहस्राक्षः शतमूर्तिर्घनप्रभः । हृत्पुण्डरीकशयनः कठिनो द्रव एव च ॥ ॥ उग्रो ग्रहपतिः
    कृष्णो समर्थोऽनर्थनाशनः । अधर्मशत्रुः रक्षोघ्नः पुरुहूतः पुरुष्टुतः ॥ ॥ ब्रह्मगर्भो बृहद्गर्भो धर्मधेनुर्धनागमः
    । हिरण्यगर्भो ज्योतिष्मान् सुललाटः सुविक्रमः ॥ ॥ शिवपूजारतः श्रीमान् भवानीप्रियकृद्वशी । नरो नारायणः
    श्यामः कपर्दी नीललोहितः ॥ ॥ रुद्रः पशुपतिः स्थाणुर्विश्वामित्रो द्विजेश्वरः । मातामहो मातरिश्वा विरिञ्चो
    विष्टरश्रवाः ॥ ॥ अक्षोभ्यः सर्वभूतानां चण्डः सत्यपराक्रमः । वालखिल्यो महाकल्पः कल्पवृक्षः कलाधरः ॥
    ॥ निदाघस्तपनोऽमोघः श्लक्ष्णः परबलापहृत् । कबन्धमथनो दिव्यः कम्बुग्रीवः शिवप्रियः ॥ ॥ शङ्खोऽनिलः सुनिष्पन्नः
    सुलभः शिशिरात्मकः । असंसृष्टोऽतिथिः शूरः प्रमाथी पापनाशकृत् ॥ ॥ वसुश्रवाः कव्यवाहः प्रतप्तो विश्वभोजनः
    । रामो नीलोत्पलश्यामो ज्ञानस्कन्धो महाद्युतिः ॥ ॥ पवित्रपादः पापारिर्मणिपूरो नभोगतिः । उत्तारणो दुष्कृतिहा
    दुर्धर्षो दुस्सहोऽभयः ॥ ॥ अमृतेशोऽमृतवपुर्धर्मी धर्मः कृपाकरः । भर्गो विवस्वानादित्यो योगाचार्यो दिवस्पतिः
    ॥ ॥ उदारकीर्तिरुद्योगी वाङ्मयः सदसन्मयः । नक्षत्रमाली नाकेशः स्वाधिष्ठानषडाश्रयः ॥ ॥ चतुर्वर्गफलो
    वर्णी शक्तित्रयफलं निधिः । निधानगर्भो निर्व्याजो गिरीशो व्यालमर्दनः ॥ ॥ श्रीवल्लभः शिवारम्भः शान्तिर्भद्रः
    समञ्जसः । भूशयो भूतिकृद्भूतिर्भूषणो भूतवाहनः ॥ ॥ अकायो भक्तकायस्थः कालज्ञानी महावटुः । परार्थवृत्तिरचलो
    विविक्तः श्रुतिसागरः ॥ ॥ स्वभावभद्रो मध्यस्थः संसारभयनाशनः । वेद्यो वैद्यो वियद्गोप्ता सर्वामरमुनीश्वरः
    ॥ ॥ सुरेन्द्रः करणं कर्म कर्मकृत्कर्म्यधोक्षजः । ध्येयो धुर्यो धराधीशः सङ्कल्पः शर्वरीपतिः ॥ ॥ परमार्थगुरुर्वृद्धः
    शुचिराश्रितवत्सलः । विष्णुर्जिष्णुर्विभुर्यज्ञो यज्ञेशो यज्ञपालकः ॥ ॥ प्रभविष्णुर्ग्रसिष्णुश्च लोकात्मा
    लोकभावनः । केशवः केशिहा काव्यः कविः कारणकारणम् ॥ ॥ कालकर्ता कालशेषो वासुदेवः पुरुष्टुतः । आदिकर्ता
    वराहश्च माधवो मधुसूदनः ॥ ॥ नारायणो नरो हंसो विष्वक्सेनो जनार्दनः । विश्वकर्ता महायज्ञो ज्योतिष्मान्
    पुरुषोत्तमः ॥ ॥ वैकुण्ठः पुण्डरीकाक्षः कृष्णः सूर्यः सुरार्चितः । नारसिंहो महाभीमो वक्रदंष्ट्रो नखायुधः
    ॥ ॥ आदिदेवो जगत्कर्ता योगीशो गरुडध्वजः । गोविन्दो गोपतिर्गोप्ता भूपतिर्भुवनेश्वरः ॥ ॥ पद्मनाभो हृषीकेशो
    धाता दामोदरः प्रभुः । त्रिविक्रमस्त्रिलोकेशो ब्रह्मेशः प्रीतिवर्धनः ॥ ॥ वामनो दुष्टदमनो गोविन्दो गोपवल्लभः
    । भक्तप्रियोऽच्युतः सत्यः सत्यकीर्तिर्धृतिः स्मृतिः ॥ ॥ कारुण्यं करुणो व्यासः पापहा शान्तिवर्धनः ।
    सन्न्यासी शास्त्रतत्त्वज्ञो मन्दराद्रिनिकेतनः ॥ ॥ बदरीनिलयः शान्तस्तपस्वी वैद्युतप्रभः । भूतावासो
    गुहावासः श्रीनिवासः श्रियः पतिः ॥ ॥ तपोवासो मुदावासः सत्यवासः सनातनः । पुरुषः पुष्करः पुण्यः पुष्कराक्षो
    महेश्वरः ॥ ॥ पूर्णमूर्तिः पुराणज्ञः पुण्यदः पुण्यवर्धनः । शङ्खी चक्री गदी शार्ङ्गी लाङ्गली मुसली हली
    ॥ ॥ किरीटी कुण्डली हारी मेखली कवची ध्वजी । योद्धा जेता महावीर्यः शत्रुजिच्छत्रुतापनः ॥ ॥ शास्ता शास्त्रकरः
    शास्त्रं शङ्कर शङ्करस्तुतः । सारथिः सात्त्विकः स्वामी सामवेदप्रियः समः ॥ ॥ पवनः साहसः शक्तिः सम्पूर्णाङ्गः
    समृद्धिमान् । स्वर्गदः कामदः श्रीदः कीर्तिदोऽकीर्तिनाशनः ॥ ॥ मोक्षदः पुण्डरीकाक्षः क्षीराब्धिकृतकेतनः
    । सर्वात्मा सर्वलोकेशः प्रेरकः पापनाशनः ॥ ॥ सर्वदेवो जगन्नाथः सर्वलोकमहेश्वरः । सर्गस्थित्यन्तकृद्देवः
    सर्वलोकसुखावहः ॥ ॥ अक्षय्यः शाश्वतोऽनन्तः क्षयवृद्धिविवर्जितः । निर्लेपो निर्गुणः सूक्ष्मो निर्विकारो
    निरञ्जनः ॥ ॥ सर्वोपाधिविनिर्मुक्तः सत्तामात्रव्यवस्थितः । अधिकारी विभुर्नित्यः परमात्मा सनातनः ॥ ॥
    अचलो निर्मलो व्यापी नित्यतृप्तो निराश्रयः । श्यामो युवा लोहिताक्षो दीप्तास्यो मितभाषणः ॥ ॥ आजानुबाहुः
    सुमुखः सिंहस्कन्धो महाभुजः । सत्यवान् गुणसम्पन्नः स्वयन्तेजाः सुदीप्तिमान् ॥ ॥ कालात्मा भगवान् कालः
    कालचक्रप्रवर्तकः । नारायणः परञ्ज्योतिः परमात्मा सनातनः ॥ ॥ विश्वसृड्विश्वगोप्ता च विश्वभोक्ता च शाश्वतः
    । विश्वेश्वरो विश्वमूर्तिर्विश्वात्मा विश्वभावनः ॥ ॥ सर्वभूतसुहृच्छान्तः सर्वभूतानुकम्पनः । सर्वेश्वरेश्वरः
    सर्वः श्रीमानाश्रितवत्सलः ॥ ॥ सर्वगः सर्वभूतेशः सर्वभूताशयस्थितः । अभ्यन्तरस्थस्तमसश्छेत्ता नारायणः
    परः ॥ ॥ अनादिनिधनः स्रष्टा प्रजापतिपतिर्हरिः । नरसिंहो हृषीकेशः सर्वात्मा सर्वदृग्वशी ॥ ॥ जगतस्तस्थुषश्चैव
    प्रभुर्नेता सनातनः । कर्ता धाता विधाता च सर्वेषां प्रभुरीश्वरः ॥ ॥ सहस्रमूर्धा विश्वात्मा विष्णुर्विश्वदृगव्ययः
    । पुराणपुरुषः स्रष्टा सहस्राक्षः सहस्रपात् ॥ ॥ तत्त्वं नारायणो विष्णुर्वासुदेवः सनातनः । परमात्मा
    परं ब्रह्म सच्चिदानन्दविग्रहः ॥ ॥ परञ्ज्योतिः परन्धामः पराकाशः परात्परः । अच्युतः पुरुषः कृष्णः शाश्वतः
    शिव ईश्वरः ॥ ॥ नित्यः सर्वगतः स्थाणुरुग्रः साक्षी प्रजापतिः । हिरण्यगर्भः सविता लोककृल्लोकभृद्विभुः
    ॥ ॥ रामः श्रीमान् महाविष्णुर्जिष्णुर्देवहितावहः । तत्त्वात्मा तारकं ब्रह्म शाश्वतः सर्वसिद्धिदः ॥
    ॥ अकारवाच्यो भगवान् श्रीर्भूनीलापतिः पुमान् । सर्वलोकेश्वरः श्रीमान् सर्वज्ञः सर्वतोमुखः ॥ ॥ स्वामी
    सुशीलः सुलभः सर्वज्ञः सर्वशक्तिमान् । नित्यः सम्पूर्णकामश्च नैसर्गिकसुहृत्सुखी ॥ ॥ कृपापीयूषजलधिः
    शरण्यः सर्वदेहिनाम् । श्रीमान्नारायणः स्वामी जगतां पतिरीश्वरः ॥ ॥ श्रीशः शरण्यो भूतानां संश्रिताभीष्टदायकः
    । अनन्तः श्रीपती रामो गुणभृन्निर्गुणो महान् ॥ ॥ ॥ इति आनन्दरामायणे वाल्मीकीये श्रीरामसहस्रनामस्तोत्रम्
    ॥
