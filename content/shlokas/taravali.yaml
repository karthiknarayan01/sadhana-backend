id: taravali
category: stotram
name:
  english: taravali
  devanagari: तारावलि
content:
  english: taravalistotram niravadhikarunardrairnihnutasheshadoshaih amritarasajharanam antarangairapangaih
    | aghamakhilamapasyan asya dimbhasya shambhuh sakalabhayanivrittim sambamurtirvidhattam || 1|| shriyamavanatibhajam
    shreyasamadadhanaih amritarasatarangashridhurinairapangaih | aghamakhilamapasyan asya dimbhasya shambhuh
    sakalabhayanivrittim sambamurtirvidhattam || 2|| gajamukhasharajanmapremagadhopagudhaih nagaduhituramandanandamulairapangaih
    | aghamakhilamapasyan asya dimbhasya shambhuh sakalabhayanivrittim sambamurtirvidhattam || 3|| girivaratanayayah
    kelikope natastat carananakharucishrivarmitairikshanairdrak | aghamakhilamapasyan asya dimbhasya shambhuh
    sakalabhayanivrittim sambamurtirvidhattam || 4|| smaraharadayaniyasmityumayam vadantyam darahasitamukhendustamapangaih
    pibadbhih | aghamakhilamapasyan asya dimbhasya shambhuh sakalabhayanivrittim sambamurtirvidhattam
    || 5|| namadamarakiritakridaduddandashunda
  devanagari: तारावलिस्तोत्रम् निरवधिकरुणार्द्रैर्निह्नुताशेषदोषैः अमृतरसझराणां अन्तरङ्गैरपाङ्गैः । अघमखिलमपास्यन्
    अस्य डिम्भस्य शम्भुः सकलभयनिवृत्तिं साम्बमूर्तिर्विधत्ताम् ॥ १॥ श्रियमवनतिभाजां श्रेयसामादधानैः अमृतरसतरङ्गश्रीधुरीणैरपाङ्गैः
    । अघमखिलमपास्यन् अस्य डिम्भस्य शम्भुः सकलभयनिवृत्तिं साम्बमूर्तिर्विधत्ताम् ॥ २॥ गजमुखशरजन्मप्रेमगाढोपगूढैः
    नगदुहितुरमन्दानन्दमूलैरपाङ्गैः । अघमखिलमपास्यन् अस्य डिम्भस्य शम्भुः सकलभयनिवृत्तिं साम्बमूर्तिर्विधत्ताम्
    ॥ ३॥ गिरिवरतनयायाः केलिकोपे नतस्तत् चरणनखरुचिश्रीवर्मितैरीक्षणैर्द्राक् । अघमखिलमपास्यन् अस्य डिम्भस्य
    शम्भुः सकलभयनिवृत्तिं साम्बमूर्तिर्विधत्ताम् ॥ ४॥ स्मरहरदयनीयास्मीत्युमायां वदन्त्यां दरहसितमुखेन्दुस्तामपाङ्गैः
    पिबद्भिः । अघमखिलमपास्यन् अस्य डिम्भस्य शम्भुः सकलभयनिवृत्तिं साम्बमूर्तिर्विधत्ताम् ॥ ५॥ नमदमरकिरीटक्रीडदुद्दण्डशुण्डा
