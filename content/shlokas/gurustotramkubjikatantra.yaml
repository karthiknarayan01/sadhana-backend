id: gurustotramkubjikatantra
category: stotram
name:
  english: gurustotramkubjikatantra
  devanagari: गुरुस्तोत्रम्कुब्जिकातन्त्र
content:
  english: shrigurustotram kubjikatantrokta om namastubhyam mahamantradayine shivarupine | brahmajnanaprakashaya
    samsaraduhkhatarine || 1|| atisaumyaya divyaya viraya jnanaharine | namaste kulanathaya kula kaulinyadayine
    || 2|| shivatattvaprabodhaya brahmatattvaprakashine | namaste gurave tubhyam sadhakabhayadayine ||
    3|| anacaracarabhavabodhaya bhaktahetave | bhavabhavavinirmuktaya muktidatre namo namah || 4|| namaste
    shambhave tubhyam divyabhavaprakashine | jnananandasvarupaya vibhavaya namo namah || 5|| shivaya shaktinathaya
    saccidanandarupine | kamarupaya kamaya kalakelikalatmane || 6|| kulapujopadeshaya kulacarasvarupine
    | araktalasacchaktaye samabhagavibhutaye || namaste'stu maheshaya namaste'stu namo namah ||7|| idam
    stotram pathennittyam sadhako gurudinmukhah | pratarutthaya deveshi
  devanagari: श्रीगुरुस्तोत्रम् कुब्जिकातन्त्रोक्त ॐ नमस्तुभ्यं महामन्त्रदायिने शिवरूपिणे । ब्रह्मज्ञानप्रकाशाय
    संसारदुःखतारिणे ॥ १॥ अतिसौम्याय दिव्याय वीराय ज्ञानहारिणे । नमस्ते कुलनाथाय कुल कौलिन्यदायिने ॥ २॥
    शिवतत्त्वप्रबोधाय ब्रह्मतत्त्वप्रकाशिने । नमस्ते गुरवे तुभ्यं साधकाभयदायिने ॥ ३॥ अनाचाराचारभावबोधाय
    भक्तहेतवे । भावाभावविनिर्मुक्ताय मुक्तिदात्रे नमो नमः ॥ ४॥ नमस्ते शम्भवे तुभ्यं दिव्यभावप्रकाशिने
    । ज्ञानानन्दस्वरूपाय विभवाय नमो नमः ॥ ५॥ शिवाय शक्तिनाथाय सच्चिदानन्दरूपिणे । कामरूपाय कामाय कालकेलिकलात्मने
    ॥ ६॥ कुलपूजोपदेशाय कुलाचारस्वरूपिणे । आरक्तलसच्छक्तये समभागविभूतये ॥ नमस्तेऽस्तु महेशाय नमस्तेऽस्तु
    नमो नमः ॥७॥ इदं स्तोत्रं पठेन्नित्त्यं साधको गुरुदिङ्मुखः । प्रातरुत्थाय देवेशि
