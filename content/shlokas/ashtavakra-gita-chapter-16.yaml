id: ashtavakra-gita-chapter-16
category: stotram
name:
  english: Ashtavakra Gita Chapter 16
content:
  english: ashtavakra uvaca || acakshva shrinu va tata nanashastranyanekashah | tathapi na tava svasthyam
    sarvavismaranadrite || || bhogam karma samadhim va kuru vijna tathapi te | cittam nirastasarvashamatyartham
    rocayishyati || || ayasatsakalo duhkhi nainam janati kashcana | anenaivopadeshena dhanyah prapnoti
    nirvritim || || vyapare khidyate yastu nimeshonmeshayorapi | tasyalasya dhurinasya sukham nanyasya
    kasyacit || || idam kritamidam neti dvandvairmuktam yada manah | dharmarthakamamoksheshu nirapeksham
    tada bhavet || || virakto vishayadveshta ragi vishayalolupah | grahamokshavihinastu na virakto na
    ragavan || || heyopadeyata tavatsamsaravitapankurah | spriha jivati yavad vai nirvicaradashaspadam
    || || pravrittau jayate rago nirvrittau dvesha eva hi | nirdvandvo balavad dhiman evameva vyavasthitah
    || || hatumicchati samsaram ragi duhkhajihasaya | vitarago hi nirduhkhastasminnapi na khidyati ||
    || yasyabhimano mokshe'pi dehe'pi mamata tatha | na ca jnani na va yogi kevalam duhkhabhagasau ||
    || haro yadyupadeshta te harih kamalajo'pi va | tathapi na tava svasthyam sarvavismaranadrite ||
  devanagari: अष्टावक्र उवाच ॥ आचक्ष्व शृणु वा तात नानाशास्त्राण्यनेकशः । तथापि न तव स्वास्थ्यं सर्वविस्मरणादृते
    ॥ ॥ भोगं कर्म समाधिं वा कुरु विज्ञ तथापि ते । चित्तं निरस्तसर्वाशमत्यर्थं रोचयिष्यति ॥ ॥ आयासात्सकलो
    दुःखी नैनं जानाति कश्चन । अनेनैवोपदेशेन धन्यः प्राप्नोति निर्वृतिम् ॥ ॥ व्यापारे खिद्यते यस्तु निमेषोन्मेषयोरपि
    । तस्यालस्य धुरीणस्य सुखं नान्यस्य कस्यचित् ॥ ॥ इदं कृतमिदं नेति द्वन्द्वैर्मुक्तं यदा मनः । धर्मार्थकाममोक्षेषु
    निरपेक्षं तदा भवेत् ॥ ॥ विरक्तो विषयद्वेष्टा रागी विषयलोलुपः । ग्रहमोक्षविहीनस्तु न विरक्तो न रागवान्
    ॥ ॥ हेयोपादेयता तावत्संसारविटपाङ्कुरः । स्पृहा जीवति यावद् वै निर्विचारदशास्पदम् ॥ ॥ प्रवृत्तौ जायते
    रागो निर्वृत्तौ द्वेष एव हि । निर्द्वन्द्वो बालवद् धीमान् एवमेव व्यवस्थितः ॥ ॥ हातुमिच्छति संसारं
    रागी दुःखजिहासया । वीतरागो हि निर्दुःखस्तस्मिन्नपि न खिद्यति ॥ ॥ यस्याभिमानो मोक्षेऽपि देहेऽपि ममता
    तथा । न च ज्ञानी न वा योगी केवलं दुःखभागसौ ॥ ॥ हरो यद्युपदेष्टा ते हरिः कमलजोऽपि वा । तथापि न तव स्वास्थ्यं
    सर्वविस्मरणादृते ॥
