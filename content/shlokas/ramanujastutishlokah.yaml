id: ramanujastutishlokah
category: stotram
name:
  english: ramanujastutishlokah
  devanagari: रामानुजस्तुतिश्लोकाः
content:
  english: iti shrishrivatsacihnamishraih anugrihitah shriramanujastutishlokah sampurnah | arvanco yatpadasarasijadvandvamashritya
    purvai murdhna yasyanvayamupara ta deshika muktimapuh | so'yam ramanujamunirapi sviyamuktim karastham
    yatsambandhadamanuta katham varnyate kuranathah || 5|| || shrishrivatsacihnamishrebhyo namah ||
  devanagari: इति श्रीश्रीवत्सचिह्नमिश्रैः अनुगृहीताः श्रीरामानुजस्तुतिश्लोकाः सम्पूर्णाः । अर्वाञ्चो
    यत्पदसरसिजद्वन्द्वमाश्रित्य पूर्वै मूर्ध्ना यस्यान्वयमुपर ता देशिका मुक्तिमापुः । सोऽयं रामानुजमुनिरपि
    स्वीयमुक्तिं करस्थां यत्सम्बन्धादमनुत कथं वर्ण्यते कूरनाथः ॥ ५॥ ॥ श्रीश्रीवत्सचिह्नमिश्रेभ्यो नमः
    ॥
meaning: {}
