id: gangastotram-2
category: stotram
name:
  english: gangastotram 2
  devanagari: गन्गास्तोत्रम् २
content:
  english: shivasangitasammugdhashrikrishnangasamudbhavam | radhanga iva samyuktam tam gangam pranamamyaham
    || 2|| yajjanma srishteradau ca goloke rasamandale | satridhane shankarasya tam gangam pranamamyaham
    || 3|| gopairgompibhirakirne shubhe radhamahotsave | kartikipurnimajatam tam gangam pranamamyaham
    || 4|| kotiyojanavistirnam daiyairlakshaguna tatah | samavrita ya golokam tam gangam pranamamyaham
    || 5|| shashtilakshayojana ya tato daidhye caturguna | samavrita ya vaikuntham tam gangam pranamamyaham
    || 6|| trimshallakshayojana ya daidhyem pancaguna tatah | pravrita shivalokam ya tam gangam pranamamyaham
    || 7|| lakshayojanavistirna daidhyem saptaguna tatah | avrita dhruvalokam ya tam gangam pranamamyaham
    || 8|| lakshayojanavistirna daidhyem dashaguna tatah | avrita candralokam ya tam gangam pranamamyaham
    || 9|| shashtisahasrayojana ya daidhyem dashaguna tatah | avrita suryalokam ya tam gangam pranamamyaham
    || 10|| lakshayojanavistirna daidhyem pancaguna tatah | avrita satyalokam ya tam gangam pranamamyaham
    || 11|| dashalakshayojana ya daidhyem pancaguna tatah | avrita tapolokam ya tam gangam pranamamyaham
    || 12|| sahasrayojana ya daidhyem dashaguna tatah | avrita janalokam ya tam gangam pranamamyaham ||
    13|| sahasrayojanayama daidhyem saptaguna tatah | avrita ya ca kailasam tam gangam pranamamyaham ||
    14|| shatayojanavistirna daidhyem dashaguna tatah | mandakini yendralokam tam gangam pranamamyaham
    || 15|| patale ya bhogavati vistirna dashayojana | tato dashaguna dighim tam gangam pranamamyaham
    || 16|| kroshaikamatravistirna tatah kshina ca kutracit | kshitau ya'lakanandakhya tam gangam pranamamyaham
    || 17|| satye ya kshiravarna ca tretayam kshirasatribha | dvapare candanabha ca tam gangam pranamamyaham
    | jalaprabha kalau ya ca nanyatra prithivitale || 18|| svarge ca nityam kshirabha tam gangam pranamamyaham
    | yasya prabhavamatulam purane ca shrutau shrutam || 19|| ya punyada papahantri tam gangam pranamamyaham
    | yattoyakanikasparsha papinam ca pitamaha | brahmahatyadikam papam kotijanmarjitam dahet || 20||
    ityevam kathitam brahman gangapadyaikavimshatih | stotrarupam ca paramam ya punyam punyabijakam ||
    21|| nityam yo hi pathedbhaktya sampujya ca sureshvarim | so'shvamedhaphalam nityam labhate natra
    samshayah || 22|| aputro labhate putram bharyahino labhetpriyam | rogatpramucyate rogi bandhanmukto
    bhaveddhavam || 23|| aspashtakirtih suyasha mukhom bhavati panditah | yah pathetpratarutthaya nityam
    stotramidam shubham || 24|| shubham bhavecca duhsvapno gangasnanaphalam labhet | iti shrinanapuranasaroddhare
    gangabhaktiprakashe brahmavaivokta gangastotram sampurnam |
  devanagari: शिवसङ्गीतसम्मुग्धश्रीकृष्णाङ्गसमुद्भवाम् । राधाङ्ग इव संयुक्तां तां गङ्गां प्रणमाम्यहम्
    ॥ २॥ यज्जन्म सृष्टेरादौ च गोलोके रासमण्डले । सत्रिधाने शङ्करस्य तां गङ्गां प्रणमाम्यहम् ॥ ३॥ गोपैर्गोम्पिभिराकीर्णे
    शुभे राधामहोत्सवे । कार्तिकीपूर्णिमाजातां तां गङ्गां प्रणमाम्यहम् ॥ ४॥ कोटियोजनविस्तीर्णां दैयैर्लक्षगुणा
    ततः । समावृता या गोलोकं तां गङ्गां प्रणमाम्यहम् ॥ ५॥ षष्टिलक्षयोजना या ततो दैध्ये चतुर्गुणा । समावृता
    या वैकुण्ठं तां गङ्गां प्रणमाम्यहम् ॥ ६॥ त्रिंशल्लक्षयोजना या दैध्यें पञ्चगुणा ततः । प्रावृता शिवलोकं
    या तां गङ्गां प्रणमाम्यहम् ॥ ७॥ लक्षयोजनविस्तीर्णा दैध्यें सप्तगुणा ततः । आवृता ध्रुवलोकं या तां गङ्गां
    प्रणमाम्यहम् ॥ ८॥ लक्षयोजनविस्तीर्णा दैध्यें दशगुणा ततः । आवृता चन्द्रलोकं या तां गङ्गां प्रणमाम्यहम्
    ॥ ९॥ षष्टिसहस्रयोजना या दैध्यें दशगुणा ततः । आवृता सूर्यलोकं या तां गङ्गां प्रणमाम्यहम् ॥ १०॥ लक्षयोजनविस्तीर्णा
    दैध्यें पञ्चगुणा ततः । आवृता सत्यलोकं या तां गङ्गां प्रणमाम्यहम् ॥ ११॥ दशलक्षयोजना या दैध्यें पञ्चगुणा
    ततः । आवृता तपोलोकं या तां गङ्गां प्रणमाम्यहम् ॥ १२॥ सहस्रयोजना या दैध्यें दशगुणा ततः । आवृता जनलोकं
    या तां गङ्गां प्रणमाम्यहम् ॥ १३॥ सहस्रयोजनायामा दैध्यें सप्तगुणा ततः । आवृता या च कैलासं तां गङ्गां
    प्रणमाम्यहम् ॥ १४॥ शतयोजनविस्तीर्णा दैध्यें दशगुणा ततः । मन्दाकिनी येन्द्रलोकं तां गङ्गां प्रणमाम्यहम्
    ॥ १५॥ पाताले या भोगवती विस्तीर्णा दशयोजना । ततो दशगुणा दीघीं तां गङ्गां प्रणमाम्यहम् ॥ १६॥ क्रोशैकमात्रविस्तीर्णा
    ततः क्षीणा च कुत्रचित् । क्षितौ याऽलकनान्दाख्या तां गङ्गां प्रणमाम्यहम् ॥ १७॥ सत्ये या क्षीरवर्णा
    च त्रेतायां क्षीरसत्रिभा । द्वापरे चन्दनाभा च तां गङ्गां प्रणमाम्यहम् । जलप्रभा कलौ या च नान्यत्र
    पृथिवीतले ॥ १८॥ स्वर्गे च नित्यं क्षीराभा तां गङ्गां प्रणमाम्यहम् । यस्या प्रभावमतुलं पुराणे च श्रुतौ
    श्रुतम् ॥ १९॥ या पुण्यदा पापहन्त्री तां गङ्गां प्रणमाम्यहम् । यत्तोयकणिकास्पर्श पापिनां च पितामह ।
    ब्रह्महत्यादिकं पापं कोटिजन्मार्जितं दहेत् ॥ २०॥ इत्येवं कथितं ब्रह्मन् गङ्गापद्यैकविंशतिः । स्तोत्ररूपं
    च परमं या पुण्यं पुण्यबीजकम् ॥ २१॥ नित्यं यो हि पठेद्भक्त्या सम्पूज्य च सुरेश्वरीम् । सोऽश्वमेधफलं
    नित्यं लभते नात्र संशयः ॥ २२॥ अपुत्रो लभते पुत्रं भार्याहीनो लभेत्प्रियाम् । रोगात्प्रमुच्यते रोगी
    बन्धान्मुक्तो भवेद्धवम् ॥ २३॥ अस्पष्टकीर्तिः सुयशा मूखों भवति पण्डितः । यः पठेत्प्रातरुत्थाय नित्यं
    स्तोत्रमिदं शुभम् ॥ २४॥ शुभं भवेच्च दुःस्वप्नो गङ्गास्नानफलं लभेत् । इति श्रीनानापुराणसारोद्धारे गङ्गाभक्तिप्रकाशे
    ब्रह्मवैवोक्त गङ्गास्तोत्रं सम्पूर्णम् ।
