id: yada-yada-hi-dharmasya
category: gita_shloka
name:
  english: Yada Yada Hi Dharmasya
  devanagari: यदा यदा हि धर्मस्य
content:
  english: >-
    yada yada hi dharmasya glanir bhavati bharata, abhyutthanam
    adharmasya tadatmanam srijamy aham
  devanagari: >-
    यदा यदा हि धर्मस्य ग्लानिर्भवति भारत । अभ्युत्थानमधर्मस्य
    तदात्मानं सृजाम्यहम् ॥
meaning:
  english: >-
    Whenever righteousness declines and unrighteousness rises, O
    Bharata, I manifest myself.
source_attribution:
  text_source: Bhagavad Gita, Chapter 4, Verse 7
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
