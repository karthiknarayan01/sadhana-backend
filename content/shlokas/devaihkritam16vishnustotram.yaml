id: devaihkritam16vishnustotram
category: stotram
name:
  english: devaihkritam16vishnustotram
  devanagari: देवैःकृतं१६विष्णुस्तोत्रम्
content:
  english: devaih kritam 16 vishnustotram sarvantaryamine tasmai shayanaya namo namah | kalakritam mahaduhkham
    devanam samupasthitam || 27|| pravidhotum ca duhkham tattvameva'si balanvitah | devadeva jagattratah
    paramatmannamo'stu te || 28|| kripalurbhagavan bhutva raksha suransvakandrutam | guroravajnaya capi
    durvasaso'vamananat || 29|| shatakraturbhrashtarajyo'bhavattam vai samuddhara | iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 90
  devanagari: देवैः कृतं १६ विष्णुस्तोत्रम् सर्वान्तर्यामिणे तस्मै शयानाय नमो नमः । कालकृतं महादुःखं देवानां
    समुपस्थितम् ॥ २७॥ प्रविधोतुं च दुःखं तत्त्वमेवाऽसि बलान्वितः । देवदेव जगत्त्रातः परमात्मन्नमोऽस्तु
    ते ॥ २८॥ कृपालुर्भगवन् भूत्वा रक्ष सुरान्स्वकान्द्रुतम् । गुरोरवज्ञया चापि दुर्वाससोऽवमाननात् ॥ २९॥
    शतक्रतुर्भ्रष्टराज्योऽभवत्तं वै समुद्धर । इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने ९०
meaning: {}
