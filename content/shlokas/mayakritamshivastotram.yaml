id: mayakritamshivastotram
category: stotram
name:
  english: mayakritamshivastotram
  devanagari: मयकृतंशिवस्तोत्रम्
content:
  english: mayakritam shivastotram maya uvaca | devadeva mahadeva bhaktavatsala shankarah | kalpavrikshasvarupo'si
    sarvapakshavivarjitah || 4|| jyotirupo namaste'stu vishvarupa namo'stu te | namah putatmane tubhyam
    pavanaya namo namah || 5|| citrarupaya nityaya rupatitaya te namah | divyarupaya divyaya sudivyakritaye
    namah || 6|| namah pranatasarvartinashakaya shivatmane | kartre bhartre ca samhartre trilokanam namo
    namah || 7|| bhaktigamyaya bhaktanam namastubhyam kripalave | tapassatphaladatre te shivakanta shiveshvara
    || 8|| na janami stutim kartum stutipriya pareshvara | prasanno bhava sarvesha pahi mam sharanagatam
    || 9|| iti shivapurane rudrasamhitayam yuddhakhande dvadashadhyayantargatam mayakritam shivastotram
    samaptam | shivapurana | rudrasamhita | yuddhakhanda | adhyaya 12
  devanagari: मयकृतं शिवस्तोत्रम् मय उवाच । देवदेव महादेव भक्तवत्सल शङ्करः । कल्पवृक्षस्वरूपोऽसि सर्वपक्षविवर्जितः
    ॥ ४॥ ज्योतीरूपो नमस्तेऽस्तु विश्वरूप नमोऽस्तु ते । नमः पूतात्मने तुभ्यं पावनाय नमो नमः ॥ ५॥ चित्ररूपाय
    नित्याय रूपातीताय ते नमः । दिव्यरूपाय दिव्याय सुदिव्याकृतये नमः ॥ ६॥ नमः प्रणतसर्वार्तिनाशकाय शिवात्मने
    । कर्त्रे भर्त्रे च संहर्त्रे त्रिलोकानां नमो नमः ॥ ७॥ भक्तिगम्याय भक्तानां नमस्तुभ्यं कृपालवे । तपस्सत्फलदात्रे
    ते शिवाकान्त शिवेश्वर ॥ ८॥ न जानामि स्तुतिं कर्तुं स्तुतिप्रिय परेश्वर । प्रसन्नो भव सर्वेश पाहि मां
    शरणागतम् ॥ ९॥ इति शिवपुराणे रुद्रसंहितायां युद्धखण्डे द्वादशाध्यायान्तर्गतं मयकृतं शिवस्तोत्रं समाप्तम्
    । शिवपुराण । रुद्रसंहिता । युद्धखण्ड । अध्याय १२
