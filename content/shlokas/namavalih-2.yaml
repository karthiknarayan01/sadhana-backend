id: namavalih-2
category: sahasranama
name:
  english: namavalih
  devanagari: नामावलिः
content:
  english: '| shantamanase namah | 900 om shamaya namah | shikhiyanaya | shikhine | shailagarbhavasine
    | shivatmajaya | shalyaharine | shulapanaye | shilabhuve | shularogahrite | shalyastutaya | sharasangadhutaraye
    | shavalaya | shamine | shashaya | shankarakirtaye | shantatmane | shambalapahaya | shambalagramavasine
    | shamvahaya | shamabhuve namah | 920 om shishave namah | shmashananilayaya | shvetacchavaye | shaktishayaya
    | shivaya | shanipidapahaya | shankukiline | shavarastutaya | shanmaturaya | shadvaktraya | sahanaya
    | sahajaya | suhride | sahasradaya | sahasrakshaya | sadbhutaye | sadgataye | sadase | senabhatre
    | sabharatnaya namah | 940 om sarvabhutavasanabhuve namah | sarvaya | sargaya | sanmatraya | siddhasevitapadyugaya
    | siddhidaya | sadhakaya | siddhaya | surasuranamaskritaya | surasurabalatratre | surasurabalapahaya
    | saptasvararcyakirttaye | saptalokaikasamshrayaya | saptasaptisutejase | sukalaya | sakalatihrite
    | sarvavasaya | sarvabijaya | sindhushayine | svadaya namah | 960 om svabhuve namah | sadodyogine
    | sulilaya | sadbhutaye | sargabhavanaya | svabhavaya | sarvagaya | sandhaye | sadasatpataye | samodaya
    | subhagaya | satyaya | sarvadharine | sabhutapaya | sadevasurasanghataya | sahasramshukiritadhrite
    | sajjaya | sankalitalokaya | sarvabhutasamashrayaya | sadbhoganilayaya namah | 980 om sandhaye namah
    | sangitagamavishrutaya | sahityamritatriptaya | sauhityashine | sureshvaraya | sattvavandyaya | sattvadhamne
    | sarvamangalasamshrayaya | sudhiye | satsulabhaya | sangavikalaya | suvisharadaya | haratmajaya |
    hatashankaya | haryashvaya | halipujitaya | hanumatsamstutaya | halapanasaktaya | harishvaraya | hiranyakavacaya
    namah | 1000 om apadam hantre namah | habhaya | hatasvaraya | hetihastaya | hayaya | halaya | hayagaya'
  devanagari: । शान्तमनसे नमः । ९०० ॐ शमाय नमः । शिखियानाय । शिखिने । शैलगर्भवासिने । शिवात्मजाय । शल्यहारिणे
