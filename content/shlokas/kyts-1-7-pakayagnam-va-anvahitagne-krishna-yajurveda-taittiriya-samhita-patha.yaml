id: kyts-1-7-pakayagnam-va-anvahitagne-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 1.7 Pakayagnam Va Anvahitagne - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya mprathamakande saptamah prashnah shri gurubhyo namah
    | harih om || pakayajnam va~ anvahitagneh pashava upa tishthanta ida khalu vai pakayajna 'ntara prayajanuyajan
    hriyamanamabhi mantrayeta surupavar shavarna ehiti pashavo va ida pashunevopa hvayate yajnam 'sura
    jnadugdhah para yo vai yajnasya doham nduhe sa me satya ''shirasya yajnasya bhuyadityahaisha vai yajnasya
    dohastenaivaina nduhe pratta vai gaurduhe pratteda yajamanaya duha ete va idayai stana idopahuteti
    vayurvathso yar hi hotedamupahvayeta tar hi yajamano hotaramikshamano vayu mupavasrijati sarvena vai
    yajnena deva npakayajnena manurashramyathseda manumupavartata ta ndevasura vyahvayanta pratici ndevah
    paracimasura ssa devanupavartata pashavo vai ta ssyaditi paraci ntasyedamupa hvayetapashureva bhavati
    yam thsyaditi pratici mupa hvayeta pashumaneva bhavati brahmavadino vadanti sa tva idamupa hvayeta
    ya ida mupahvayeteti sa nah priya supratu midayamupa hvayate vyastamiva va eta dyajnasya yadida sami
    prashnanti tprati va asuranam ya~jno vyacchidyata brahmana deva nna ityaha brahma vai devana rbrahmanaiva
    yajnagm sa ndadhati vicchinnam ndadhatvityaha santatyai vishve deva iha madayantamityaha santatyaiva
    yajna ndadati tamasya pashavo nkramanti sa esha ijano rbhavuko yajamanena khalu vai tatkarya ryatha
    devatra datta nramayeteti braddhna pinvasvetyaha yajno vai braddhno yajnameva tanmahayatyatho devatraiva
    datta nramayate dadato me ma kshayityahakshiti mevopaiti kurvato me mopa dasadityaha bhumanamevopaiti
    || ekannavigmshatishca shrava ha sauvarcanasah tuminjamaupoditi muvaca yathsatrinagm hota hva iti
    hovaca ya pranena deva ndadhara vyanena manushyanapanena pitriniti chinatti sa na chinatti iti chinattiti
    hovaca shariram hvatha iti hovaca gaurva ya~ yajne diyate sa pranena deva ndadhara yaya manushya jivanti
    sa vyanena manushyan ya mpitribhyo ghnanti sa nbhavatyatha vai tamupa hva iti hovaca ya prajah prabhavantih
    pratyabhavatityannam ~va asyai ta hvatha iti hovacaushadhayo va asya annamoshadhayo vai prajah prabhavantih
    pratya bhavanti ya evam nnado bhavatyatha vai tamupa hva iti hovaca ya prajah parabhavanti ranugrihnati
    pratyabhavanti rgrihnatiti pratishtham hvatha iti hovaceyam va~ asyai pratishthe vai~ prajah parabhavantiranu
    grihnati pratyabhavanti ve~da pratyeva tishthatyatha vai tamupa hva iti hovaca yasyai nikramane ghrita
    ssanjivantih pibantiti chinatti sa na chinatti iti na chinattiti hovaca pra tu janayatityesha va idamupa
    hvatha iti hovaca vrishtirva ida vrishtyai vai nikramane ghrita ssanjivantih pibanti ya evam va~ anye
    deva ijyante dyajate ya eva devah parokshamijyante taneva ta dyajati yadanvaharya maharatyete vai
    devah pratyaksham hmanastaneva tena prinatyatho dakshinaivasyaisha 'tho yajnasyaiva chidramapi dadhati
    yadvai yajnasya kruram ntadanvaharyena 'nvaharati tadanvaharyasya ndevaduta va ete yad ritvijo yadanvaharya
    maharati devadutaneva prinati prajapati rdevebhyo yajnan vyadisha 'manyata sa etamanvaharya ttamatmannadhattasa
    va esha prajapatyo yadanvaharyo yasyaivam 'nvaharya ahriyate sakshadeva prajapati mriddhnotyaparimitonirupyo
    'parimitah prajapatih prajapate raptyai deva vai ya 'kurvata tadasura akurvata te deva eta ntamanvaharanta
    tato deva abhava nparasura yasyaivam 'nvaharya ahriyate bhavatyatmana para sya bhratrivyo bhavati
    yajnena va ishti pakvena purti yasyaivam 'nvaharya ahriyate sa tveveshtapurti prajapaterbhago tyaha
    prajapatimeva bhagadheyena samardhayatyurjasva npayasvanityahorja npayo dadhati pranapanau me pahi
    samanavyanau me pahityaha ''shishamevaitama shaste 'kshito 'syakshityai tva ma me ksheshtha amutramushmin
    ~loka ityaha kshiyate va amushmin ~loke mitahpradanagg hyamushmin ~loke praja upajivanti yadeva dgamayati
    nasyamushmin ~loke hyamushmin ~loke nbhuyasamityaha barhisha vai prajapatih praja asrijata tenaiva
    praja ssrijate narashagmsasyaha ndevayajyaya pashuma nbhuyasamityaha narashagmsena vai prajapatih
    pashunasrijata tenaiva pashun ndhatte prati yajnena tishthati dar rvai deva ujjiti shapurnamasayoreva
    devatanam ya~jamana ujjitimanujjayati dar mbhratrivyanapa nudate vajavatibhyam 'nnamevava rundhe dvabhya
    mpratishthityai yo vai yajnasya dvau dohau vidvan yajata ubhayata ccoparishtaccaisha va anyo yajnasya
    doha idayamanyo yar hi hota yajamanasya nama grihniya hi bruyadema agmannashisho dohakama iti sagg
    stuta eva devata duhe 'tho ubhayata eva yajna ccoparishtacca rohitena tva ngamayatvityahaite vai devashva
    yajamanah prastaro yadetaih prastara mpraharati devashvaireva yajamanagm suvargam ngamayati vi te
    muncami rashana vi rashminityahaisha va agnervimokaste ndevayajyaya yajnena pratishtha ngameyamityaha
    yajno vai vishnu ryajna evantatah prati tishthati somasyaha ndevayajyaya sureta reto dhishiyetyaha
    somo vai retodhastenaiva reta atma ndhatte tvashturaha ndevayajyaya pashunagm rupa mpusheyamityaha
    tvashta vai pashuna mmithunanagm rupakrittenaiva pashunagm rupamatma ndevayajyaya mithunena prabhuyasa
    'jayata tasmadeva yajamano mithunena prajayate vedo 'si vittirasi videyetyaha vedena vai deva asuranam
    dbhratrivyasyabhiddhyaye ttasya nama grihniya nkulayinagm rayasposhagm sahasrinam ve~do dadatu vajinamityaha
    prasahasra pnotya sya prajayam va~ji jayate ya evam darshapurnamasayo mpraja dhruvamapyayamanam 'nva
    pyayate yajnam ndhruva ghritenetyaha dhruvameva '' pyayayati tamapyayamanam 'nva pyayate yajnam mprajah
    prajapate rvibhannama lokastasmiggstva dadhami saha yajamanene rvibhannama lokastasmi ndadhati saha
    yajamanena ricyata iva va eta mprashnatyatmanameva prinatyetavan yajamanabhago yajno yajamano ya mprashnati
    yajna eva yajna mprati shthapayatyetadvai suyavasagm sodakam mantarvedi ninayati sva eva ''yatane
    suyavasagm sodaka nkurute sadasi sanme bhuya ityaha ndhatte sarvani vai bhutani vrata manupa yanti
    pracya ndishi deva ritvijo marjayanta mbhutani vratamupayanta manupayanti taireva sahavabhrithamavaiti
    vishnumukha vai deva shchandobhiriman ~loka nanapajayyamabhyajayan dvishnukraman kramate vishnureva
    bhutva yajamanashchandobhiriman ~loka nanapajayyamabhi jayati vishnoh kramo 'syabhimatihetyaha gayatri
    vai prithivi traishtubhamantariksha njagati dyauranushtubhi rdisha shchandobhireveman ~lokan yathapurvamabhi
    jayati || ssuvaraganmetyaha suvargameva lokameti sandrishaste ma chithsi yatte tapastasmai te ma ''
    vrikshityaha yathayaju thsubhurasi shreshtho rashminamayurdha asyayurme dhehityaha 'sman ~lokaccyavate
    yo vishnukraman kramate vishnukraman kramate suvargaya hi lokaya vishnukramah kramyante brahmavadino
    vadanti sa tvai vishnukraman krameta ya iman ~loka mpratyavarohedityesha va asya lokasya pratyavaroho
    yadahedamahamamu mbhratrivyamabhyo digbhyo 'syai diva itimaneva loka mpratyavarohati sam 'bhuvamityahasminneva
    'bhuvamityahasminneva loke prati tishthatyaindri manvavarta ityahasau va aditya indrastasyaiva ''vritamanu
    paryavartate dakshina paryavartate svameva viryamanu paryavartate tasma 'rdha atmano viryavattaro
    ''vritamanu paryavartate samaha ste samiddho agne me didihi sameddha te agne didyasamityaha yathayaju
    hapatyasyante mishramiva caryata agnipavamanibhya hapatyamupa tishthate punatyevagni mpratishthitya
    agne grihapata ityaha yathayajurevaitacchatagm yathayajurevaitacchatagm hima ityaha shata ntva hemantanindhishiyeti
    vavaitadaha putrasya nama grihnatyannadamevaina nkaroti tamashishama shase tantave jyotishmatimiti
    bruya ttejasvyevasya brahmavarcasi putro jayate tamashishama shase 'mushmai jyotishmatimiti bruya
    ssyatteja evasmi ndadhati yo vai yajna mprayujya na vimuncatyapratishthano vai sa bhavati kastva yunakti
    sa tva vi muncatvityaha prajapati rvai kah prajapatinaivainam yu~nakti prajapatina vi muncati pratishthitya
    ishvaram vratapate vratamacarishamityaha vratameva vi srijate shantya apradahaya parama vava yajna
    eti na ni vartate punaryo vai yajnasya punaralambham yajate tamabhi ni vartate yajno babhuva sa a
    babhuvetyahaisha vai yajnasya punaralambha 'navaruddha va etasya virad ya ahitagni ssannasabhah pashavah
    khalu vai bra hmanasya sabheshtva pramutkramya bruya 'vimagm ashvi yajna ityava sabhagm rundhe pra
    sahasra mushmai jyotishmatimiti bruya deva savitah pra suva yajna mpra suva yajnapati mbhagaya divyo
    gandharvah | ketapuh keta nnah punatu vacaspati rvacamadya svadati nah || indrasya vajro 'si vartraghnastvaya
    va~ddhyat || vajasya nu prasave matara nnama vacasa karamahe | yasyamidam ssavita dharma savishat
    || a phsvantaramritamaphsu bheshajamapamuta prashastishvashva bhavatha vajinah || vayu ssaptavigmshatih
    | te agre ashvamayunjante asminjavama rvajasatamastenayam va~jagm set || vishnoh kramo krantamasi
    vishno ntamasyankau nyanka vabhito ratham va~tagramanu sancarantau dureheti 'gnayah paprayah parayantu
    || devasyahagm savituh prasave brihaspatina vajajita vaja ndevasyahagm savituh prasave brihaspatina
    vajajita var nnakagm ruheyamindraya vacam njapayatendro vajamajayit || ashvajani vajini vajeshu vajinivatyashva
    thsamathsu vajaya || arva 'si saptirasi vajyasi vajino vaja mprasave jayata vi yojana mimiddhvamaddhvana
    'vata vajino no dhaneshu vipra amrita ritajnah || asya maddhvah pibata madayaddhva ntripta yata pathibhi
    || te no arvanto havanashruto havam vi~shve shrinvantu vajinah || mitadrava ssahasrasa medhasata sanishyavah
    | maho ye ratnagm samitheshu jabhrire shanno bhavantu vajino haveshu ||devatata mitadrava ssvarkah
    | jambhayanto vri~kagm rakshagmsi sane nnamivah || esha sya vaji kshipani nturanyati grivaya mbaddho
    apikaksha asani | kratu ndadhikra anu santavi tpathamankagsyanvapaniphanat ||uta sma ranu vati pragardhinah
    | shyenasyeva dhrajato ankasa nnah sahorja taritratah || a ma vajasya prasavo jagamyada dyavaprithivi
    vishvashambhu | a ma ganta '' ma somo amritatvaya gamyat || vajino vajajito vajagm sarishyanto vaja
    njeshyanto brihaspate rbhagamava jighrata vajino vajajito vajagm sasrivagmso vaja njigivagmso brihaspate
    rbhage ni mridhvamiyam 'bhudyamindrena samadhaddhva majijipata vanaspataya indram kshatrasyolaggmasi
    kshatrasya yonirasi jaya ehi suvo rohava rohava hi suvaraha ssuvo rokshyami vajashca prasavashcapijashca
    kratushca suvashca murdha ca vyashnniyashca ''ntyayana shcantyashca bhauvanashca bhuvanashcadhipatishca
    | ayu mprano yajnena kalpatamapano vya~no yajnena kalpata ryajnena kalpatag shrotram mmano yajnena
    kalpatam va~g yajnena kalpata matma yajnena kalpatam ya~jno yajnena kalpatagm suva rdevagm aganmamrita
    abhuma prajapateh praja abhuma samaha praja samahagm rayasposhena sa 'nnadyaya tva vajaya tva vajajityayai
    tva 'mritamasi pushtirasi prajananamasi || ssushuve agre somagm rajanamoshadhishvaphsu | ta asmabhya
    rbhavantu vayagm rashtre ja griyama purohitah | vajasyeda mprasava a babhuvema ca vishva bhuvanani
    sarvatah | sa viraja va~rdhayamano asme | vajasyema shshishriye divamima ca vishva bhuvanani samrat
    | adithsanta nni yacchatu || agne accha vadeha nah prati na ssumana bhava | pra no yaccha bhuvaspate
    dhanada asi nastvam || pra no yacchatvaryama pra bhagah pra brihaspatih | pra devah prota sunrita
    pra vag devi dadatu nah || aryamana mbrihaspatimindra ndanaya codaya | vacam vi~shnugm sarasvatigm
    savitaram m || somagm rajanam manvarabhamahe | adityan vishnugm surya m || devasya tva savituh prasave
    bhyagm sarasvatyai vaco yantu ryantrenagnestva amra jyenabhishincamindrasya brihaspate jyenabhishincami
    || ksharena vacamudajayadashvinau dvyaksharena pranapanavudajayatam vi~shnustyraksharena trin ~lokanudajaya
    thsomashcaturaksharena catushpadah pashunudajaya ksharena panktimudajaya ddhata shadaksharena shad
    nmarutah saptaksharena saptapadagm shakvarimudajaya rashtaksharena gayatrimudajaya ksharena trivritagg
    stomamudajaya mudajayadindra ekadashaksharena trishtubha dvishve deva dvadashaksharena jagatimudajayan
    vasavastrayo dashaksharena trayodashagg nrudrashcaturdashaksharena caturdashagg stomamudajayannadityah
    pancadashaksharena pancadashagg stomamudajayannaditi shshodashaksharena shodashagg ssaptadashaksharena
    saptadashagg trivritagg stomamudajaya thshatcatvarigmshacca mbhuvanasadamindraya jushta ngrihnamyesha
    te yonirindraya tvopayamagrihito vyo~masadamindraya jushta ngrihnamyesha te yonirindraya tvopayamagrihito
    nnakasadamindraya jushta ngrihnamyesha te yonirindraya tva || ye grahah ntisrah paramajah | daivyah
    kosha ssamubjitah | tesham mishamurjagm samagrabhi mesha te yonirindraya tva || apagm rasamudvayasagm
    suryarashmigm samabhritam | apagm rasasya yo rasastam vo~ grihnamyuttamamesha te yonirindraya tva
    || aya vishtha janayan karvarani sa hi ghriniruru rvaraya gatuh | sa pratyudai ddharuno maddhvo agragg
    svayam ntanumairayata | upayamagrihito 'si prajapataye tva jushta ngrihnamyesha te yonih prajapataye
    tva || anvaha masa anvidvananyanvoshadhiranu parvatasah | anvindragm rodasi vavashane anvapo ajihata
    jayamanam || anu te dayi maha indriyaya satra te vishvamanu vritrahatye | anu kshatramanu saho yajatrendra
    devebhiranu te nrishahye || indranimasu narishu supatni mahamashravam | na hyasya apara marate patih
    || nahamindrani rarana sakhyu rite | yasyedamapyagm havih priya ndeveshu gacchati ||yo jata eva prathamo
    manasva ndevo devan kratuna paryabhushat | yasya shushmadrodasi abhyaseta nnrimnasya mahna sa janasa
    indrah || a te maha indrotyugra samanyavo ya | patati didyunnaryasya bahuvo mano vishvadriyag vi carit
    || ma no mardhira bhara daddhi tannah pra dashushe datave bhuri ya | navye deshne shaste asmi nta
    ukthe pra bravama vayamindra stuvantah || a tu bhara makireta dvidma hi tva vasupatim va~sunam | indra
    ya pra yandhi || pradataragm havamaha indrama havisha vayam | ubha hi hasta vasuna prinasva '' pra
    yaccha dakshinadota savyat || pradata vajri vrishabhasturashatchushmi raja vritraha somapava yajne
    barhishya nishadyatha bhava yajamanaya sham yoh ~|| indrah sutrama svavagm avobhi ssumridiko bhavatu
    vishvavedah | badhata nkrinotu suviryasya ssyama || tasya vayagm sumatau yajniyasyapi bhadre saumanase
    syama | sa sutrama svavagm indro asme aracci ssadhamada indre santu tuvivajah | kshumanto yabhi rmadema
    || proshvasmai purorathamindraya shushamarcata | abhike cidu lokakri thsange samathsu vritraha | asmaka
    mbodhi codita nabhanta m | jyaka adhi dhanvasu || || hari om || || krishna yajurvediya taittiriya
    samhitaya mprathamakande saptamah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया म्प्रथमकाण्डे सप्तमः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ पा॒क॒य॒ज्ञं वाँ अन्वाहि॑ताग्नेः प॒शव॒ उप॑ तिष्ठन्त॒ इडा॒ खलु॒ वै पा॑कय॒ज्ञ ऽन्त॒रा प्र॑याजानूया॒जान्
    ह्रि॒यमा॑णाम॒भि म॑न्त्रयेत॒ सुरू॑पवर् षवर्ण॒ एहीति॑ प॒शवो॒ वा इडा॑ प॒शूने॒वोप॑ ह्वयते य॒ज्ञं ऽसु॑रा
    ॒ज्ञदु॑ग्धाः॒ परा॑ यो वै य॒ज्ञस्य॒ दोहं॑ न्दुहे॒ सा मे॑ स॒त्या ऽऽशीर॒स्य य॒ज्ञस्य॑ भूया॒दित्या॑है॒ष
    वै य॒ज्ञस्य॒ दोह॒स्तेनै॒वैन॑ न्दुहे॒ प्रत्ता॒ वै गौर्दु॑हे॒ प्रत्तेडा॒ यज॑मानाय दुह ए॒ते वा इडा॑यै॒
    स्तना॒ इडोप॑हू॒तेति॑ वा॒युर्व॒थ्सो यर् हि॒ होतेडा॑मुप॒ह्वये॑त॒ तर् हि॒ यज॑मानो॒ होता॑र॒मीक्ष॑माणो
    वा॒यु मु॒पाव॑सृजति॒ सर्वे॑ण॒ वै य॒ज्ञेन॑ दे॒वा न्पाकय॒ज्ञेन॒ मनु॑रश्राम्य॒थ्सेडा॒ मनु॑मु॒पाव॑र्तत॒
    ता न्दे॑वासु॒रा व्य॑ह्वयन्त प्र॒तीची न्दे॒वाः परा॑ची॒मसु॑रा॒ स्सा दे॒वानु॒पाव॑र्तत प॒शवो॒ वै त स्स्या॒दिति॒
    परा॑ची॒ न्तस्येडा॒मुप॑ ह्वयेताप॒शुरे॒व भ॑वति॒ यं थ्स्या॒दिति॑ प्र॒तीची॒ मुप॑ ह्वयेत पशु॒माने॒व भ॑वति
    ब्रह्मवा॒दिनो॑ वदन्ति॒ स त्वा इडा॒मुप॑ ह्वयेत॒ य इडा॑ मुप॒ह्वये॒तेति॒ सा नः॑ प्रि॒या सु॒प्रतू मिडा॑या॒मुप॑
    ह्वयते॒ व्य॑स्तमिव॒ वा ए॒त द्य॒ज्ञस्य॒ यदिडा॑ सा॒मि प्रा॒श्ञन्ति॑ त्प्रति॒ वा असु॑राणां यँ॒ज्ञो व्य॑च्छिद्यत॒
    ब्रह्म॑णा दे॒वा न्न॒ इत्या॑ह॒ ब्रह्म॒ वै दे॒वाना॒ र्ब्रह्म॑णै॒व य॒ज्ञग्ं स न्द॑धाति॒ विच्छि॑न्नं न्द॑धा॒त्वित्या॑ह॒
    सन्त॑त्यै॒ विश्वे॑ दे॒वा इ॒ह मा॑दयन्ता॒मित्या॑ह स॒न्तत्यै॒व य॒ज्ञ न्ददा॑ति॒ ताम॑स्य प॒शवो ङ्क्रा॑मन्ति॒
    स ए॒ष ई॑जा॒नो॑ र्भावु॑को॒ यज॑मानेन॒ खलु॒ वै तत्का॒र्य॑ र्यथा॑ देव॒त्रा द॒त्त न्र॒मये॒तेति॒ ब्रद्ध्न॒
    पिन्व॒स्वेत्या॑ह य॒ज्ञो वै ब्र॒द्ध्नो य॒ज्ञमे॒व तन्म॑हय॒त्यथो॑ देव॒त्रैव द॒त्त न्र॑मयते॒ दद॑तो मे॒
    मा क्षा॒यीत्या॒हाक्षि॑ति मे॒वोपै॑ति कुर्व॒तो मे॒ मोप॑ दस॒दित्या॑ह भू॒मान॑मे॒वोपै॑ति ॥ एका॒न्नविग्ं॑श॒तिश्च॑
