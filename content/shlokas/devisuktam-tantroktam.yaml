id: devisuktam-tantroktam
category: sukta
name:
  english: devisuktam (tantroktam)
  devanagari: देवीसूक्तम् (तन्त्रोक्तम्)
content:
  english: atha tantroktam devisuktam shriganeshaya namah | namo devyai mahadevyai shivayai satatam namah
    | namah prakrityai bhadrayai niyatah pranatah sma tam || 1|| raudrayai namo nityayai gauryai dhatryai
    namo namah | jyotsnayai cendurupinyai sukhayai satatam namah || 2|| kalyanyai pranatam vriddhyai siddhyai
    kurmo namo namah | nairrityai bhubhritam lakshmyai sharvanyai te namo namah || 3|| durgayai durgaparayai
    sarayai sarvakarinyai | khyatyai tathaiva krishnayai dhumrayai satatam namah || 4|| atisaumyatiraudrayai
    natastasyai namo namah | namo jagatpratishthayai devyai krityai namo namah || 5|| ya devi sarvabhuteshu
    vishnumayeti shabdita | namastasyai namastasyai namastasyai namo namah || 6|| ya devi sarvabhuteshu
    cetanetyabhidhiyate | namastasyai namastasyai namastasyai namo namah || 7|| ya devi sarvabhuteshu
    buddhirupena samsthita | namastasyai namastasyai namastasyai namo namah || 8|| ya devi sarvabhuteshu
    nidrarupena samsthita | namastasyai namastasyai namastasyai namo namah || 9|| ya devi sarvabhuteshu
    kshudharupena samsthita | namastasyai namastasyai namastasyai namo namah || 10|| ya devi sarvabhuteshu
    chayarupena samsthita | namastasyai namastasyai namastasyai namo namah || 11|| ya devi sarvabhuteshu
    shaktirupena samsthita | namastasyai namastasyai namastasyai namo namah || 12|| ya devi sarvabhuteshu
    trishnarupena samsthita | namastasyai namastasyai namastasyai namo namah || 13|| ya devi sarvabhuteshu
    kshantirupena samsthita | namastasyai namastasyai namastasyai namo namah || 14|| ya devi sarvabhuteshu
    jatirupena samsthita | namastasyai namastasyai namastasyai namo namah || 15|| ya devi sarvabhuteshu
    lajjarupena samsthita | namastasyai namastasyai namastasyai namo namah || 16|| ya devi sarvabhuteshu
    shantirupena samsthita | namastasyai namastasyai namastasyai namo namah || 17|| ya devi sarvabhuteshu
    shraddharupena samsthita | namastasyai namastasyai namastasyai namo namah || 18|| ya devi sarvabhuteshu
    kantirupena samsthita | namastasyai namastasyai namastasyai namo namah || 19|| ya devi sarvabhuteshu
    lakshmirupena samsthita | namastasyai namastasyai namastasyai namo namah || 20|| ya devi sarvabhuteshu
    vrittirupena samsthita | namastasyai namastasyai namastasyai namo namah || 21|| ya devi sarvabhuteshu
    smritirupena samsthita | namastasyai namastasyai namastasyai namo namah || 22|| ya devi sarvabhuteshu
    dayarupena samsthita | namastasyai namastasyai namastasyai namo namah || 23|| ya devi sarvabhuteshu
    tushtirupena samsthita | namastasyai namastasyai namastasyai namo namah || 24|| ya devi sarvabhuteshu
    matrirupena samsthita | namastasyai namastasyai namastasyai namo namah || 25|| ya devi sarvabhuteshu
    bhrantirupena samsthita | namastasyai namastasyai namastasyai namo namah || 26|| indriyanamadhishthatri
    bhutanam cakhileshu ya | bhuteshu satatam tasyai vyaptyai daivyai namo namah || 27|| cittirupena ya
    kritsnametadvyapya sthitam jagat | namastasyai namastasyai namastasyai namo namah || 28|| stuta suraih
    purvamabhishtasamshrayattatha surendrena dineshu sevita || karotu sa nah shubhaheturishvari shubhani
    bhadranyabhihantu capadah || 29|| ya sampratam coddhatadaityatapitairasmabhirisha ca surairnamasyate
    | ya ca smrita tatkshanameva hanti nah sarvapado bhaktivinamramurtibhih || 30||
  devanagari: अथ तन्त्रोक्तं देवीसूक्तम् श्रीगणेशाय नमः । नमो देव्यै महादेव्यै शिवायै सततं नमः । नमः प्रकृत्यै
    भद्रायै नियताः प्रणताः स्म ताम् ॥ १॥ रौद्रायै नमो नित्यायै गौर्यै धात्र्यै नमो नमः । ज्योत्स्नायै
    चेन्दुरूपिण्यै सुखायै सततं नमः ॥ २॥ कल्याण्यै प्रणतां वृद्ध्यै सिद्ध्यै कुर्मो नमो नमः । नैरृत्यै
    भूभृतां लक्ष्म्यै शर्वाण्यै ते नमो नमः ॥ ३॥ दुर्गायै दुर्गपारायै सारायै सर्वकारिण्यै । ख्यात्यै तथैव
    कृष्णायै धूम्रायै सततं नमः ॥ ४॥ अतिसौम्यातिरौद्रायै नतास्तस्यै नमो नमः । नमो जगत्प्रतिष्ठायै देव्यै
    कृत्यै नमो नमः ॥ ५॥ या देवी सर्वभूतेषु विष्णुमायेति शब्दिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः
    ॥ ६॥ या देवी सर्वभूतेषु चेतनेत्यभिधीयते । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ७॥ या देवी सर्वभूतेषु
    बुद्धिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ८॥ या देवी सर्वभूतेषु निद्रारूपेण संस्थिता
    । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ ९॥ या देवी सर्वभूतेषु क्षुधारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै
    नमस्तस्यै नमो नमः ॥ १०॥ या देवी सर्वभूतेषु छायारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो
    नमः ॥ ११॥ या देवी सर्वभूतेषु शक्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १२॥ या
    देवी सर्वभूतेषु तृष्णारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १३॥ या देवी सर्वभूतेषु
    क्षान्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १४॥ या देवी सर्वभूतेषु जातिरूपेण
    संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १५॥ या देवी सर्वभूतेषु लज्जारूपेण संस्थिता । नमस्तस्यै
    नमस्तस्यै नमस्तस्यै नमो नमः ॥ १६॥ या देवी सर्वभूतेषु शान्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै
    नमो नमः ॥ १७॥ या देवी सर्वभूतेषु श्रद्धारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १८॥
    या देवी सर्वभूतेषु कान्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ १९॥ या देवी सर्वभूतेषु
    लक्ष्मीरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २०॥ या देवी सर्वभूतेषु वृत्तिरूपेण
    संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २१॥ या देवी सर्वभूतेषु स्मृतिरूपेण संस्थिता । नमस्तस्यै
    नमस्तस्यै नमस्तस्यै नमो नमः ॥ २२॥ या देवी सर्वभूतेषु दयारूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै
    नमो नमः ॥ २३॥ या देवी सर्वभूतेषु तुष्टिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २४॥
    या देवी सर्वभूतेषु मातृरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २५॥ या देवी सर्वभूतेषु
    भ्रान्तिरूपेण संस्थिता । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २६॥ इन्द्रियाणामधिष्ठात्री भूतानां
    चाखिलेषु या । भूतेषु सततं तस्यै व्याप्त्यै दैव्यै नमो नमः ॥ २७॥ चित्तिरूपेण या कृत्स्नमेतद्व्याप्य
    स्थितां जगत् । नमस्तस्यै नमस्तस्यै नमस्तस्यै नमो नमः ॥ २८॥ स्तुता सुरैः पूर्वमभीष्टसंश्रयात्तथा सुरेन्द्रेण
    दिनेषु सेविता ॥ करोतु सा नः शुभहेतुरीश्वरी शुभानि भद्राण्यभिहन्तु चापदः ॥ २९॥ या साम्प्रतं चोद्धतदैत्यतापितैरस्माभिरीशा
    च सुरैर्नमस्यते । या च स्मृता तत्क्षणमेव हन्ति नः सर्वापदो भक्तिविनम्रमूर्तिभिः ॥ ३०॥
