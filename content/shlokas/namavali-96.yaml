  devanagari: श्यामां पूर्णेन्दुवदनां श्वेताम्बरधरां शिवाम् । महामेघनिनादान्तां निर्वाते दीपवत् स्थिराम्
    । भुजाष्टकयुतां बाणचापशूलगदाधराम् । खड्गं शङ्खं तथा चक्रं वरदां भयहारिणीम् ॥ १॥ शङ्करप्रियवामाङ्के
