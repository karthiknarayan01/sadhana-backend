id: gandabherundanrisimhamalamantravidhih
category: mantra
name:
  english: gandabherundanrisimhamalamantravidhih
  devanagari: गण्डभेरुण्डनृसिंहमालामन्त्रविधिः
content:
  english: kalpantashani visphulinga hutabhuk jajvalyanetratrayam tivra vajrasamanatumdanakhabhih damshtrabhi
    jihvananam | pakshau maruta saptaghatataranim ashtananam bhishanam dhyayedudandaraudram sharabhamadaharam
    gandabherundasimham || 2|| ashtasya vahnidrishtiminduvaranakhavidyutajvalajihva | mari bhima ca pakshau
    hridayajatharagau ashtakalpagnidurga | uru dvau rudrakalam khagamriganriharirgandabherundarupah vidhvastah
    sharabhadi bhairavaganan shatrun sacakro harih || 3|| pancopacaraih sampujya japet | om namo bhagavate
    ashtamukhagandabherunda aghoraya mahapakshirajaya indramandale gajarudhaya vajrahastaya indradisham
    bandha bandha mam raksha raksha sarvabhutebhyo hum phat svaha || 4|| om namo bhagavate ashtamukhagandabherunda
    aghoraviranarasimhaya agnimandale mesharudhaya shaktihastaya agnayediya ashtamahasarpavishabhakshanaya
    jaramaranavarjitaya jagadishvaraya mam raksha raksha sarvabhutebhyah || 5|| om namo bhagavate ashtamukhagandabherunda
    aghoramahabhallukarajaya mahabhayanivaranaya bhaktapriyaya bhaktaprasannamukhaya bhaktagrihanivasaya
    mam raksha raksha sarvabhutebhyah || 6|| atha malamantrah | om namo bhagavate ashtamukhagandabherunda
    aghorapakshamahapakshirajaya aghoraviranrisimhaya aghora vyaghrarajaya aghorahayagrivaya aghora adivarahaya
    aghoradivanarendraya aghorapakshimahagarudaya aghora adibhallukarajaya mahabalaparakramaya kotisuryaprakashaya
    vadavanalamukhaya karalavadanaya vajrashariraya vajrashikhaya vajratundaya vajradamshtraya vajradantaya
    vajrabhujaya vajrahastaya vajranakhaya vajrapakshaya vajrapucchaya vajrapadaya durnirikshaya anivaritakopaya
    aparimitashtahasaya anekakotibrahmandabhasmaddhulitashariraya anekakotibrahmandodaraya anekakotibrahmamdodaramauktikalankritangaya
    anekakotibrahmandanayakaya anekakotishirshaya anekakotibhujaya anekakotihastaya anekakotidivyayudhadharaya
    anekakotipadaya anekakotikanakagirinavaratnamukutalankritamastakaya || 7|| om namo bhagavate ashtamukhagandabherunda
    aghoraviratapurushaya patalamandale shesharudhaya sarpahastaya pataladisham bandha bandha mam raksha
    raksha sarvabhutebhyah | iti digbandhah || 8|| athatmaraksha | om namo bhagavate ashtamukhagandabherunda
    aghorapa kshamahapakshirajaya sharabhashalveshvara pranapaharaya sakalashatrusamharakaranaya sakalashunyanivaranaya
    mam raksha raksha sarvabhutebhyo hum phata svahah || 1|| om namo bhagavate ashtamukhagandabherunda
    aghoraviranrisimha aghoravirabhadrapranapaharaya sakalaroganivaranaya sakalarogyakaraya mam raksha
    raksha sarvabhutebhyah || 2|| om namo bhagavate ashtamukhagandabherunda aghoravyaghrarajaya mahisharakshasapranapaharaya
    mahamadonmattaya mahavyalaya mahadiptaya mam raksha raksha sarvabhutebhyah || 3|| om namo bhagavate
    ashtamukhagandabherunda aghora adihayagrivaya sakalamukattvavimocanaya sakalaveda sakalashastrasakalavidyapradaya
    sakalashatrumana kshobhanaya sakalakaryapradaya mam raksha raksha sarvabhutebhyah || 4|| om namo bhagavate
    ashtamukhagandabherunda aghora adivarahaya daridryadhvamsakaya ashtaishvaryakarshanaya ashtaputrapradaya
    akhilaishvaryaya mam raksha raksha sarvabhutebhyah || 5|| om namo bhagavate ashtamukhagandabherunda
    aghora vanarendraya sakalagrahoccatanaya sakalarakshasasamharakaranaya sakalasurasuravanditaya sakalajivanivasaya
    mam raksha raksha sarvabhutebhyah || 6|| om namo bhagavate ashtamukhagandabherunda aghora pakshimahagarudaya
    mahanagakritantakaya kotikanakagiri navaratnamakarakundalankritakarnaya anekakotikanakagirinavaratna
    kankanalankritakaraya anekakotikanakagirinupuralankritapadaya anekakoti yamaganashariraromalankritaya
    anekakotisharabhashalveshvarapranapaharaya ekadasharudragarvapaharaya ashtabhairavaprabhanjanaya jaganmukhantakaya
    aghoravirabhadrapranapaharaya mahanandimardanaya ehi ehi agaccha agaccha avatara avatara garja garja
    garja bhishaya bhishaya sphura sphura aghoratanu rusha rusha canda canda pracanda pracanda prahara
    prahara pralaya pralaya jvala jvala prajvala prajvala daha daha paca paca hana hana turu turu ghuru
    ghuru acakrandaya cakrandaya pariveshaya pariveshaya purvapashcima dakshinottara ishanyagneya niritivayavyordhvontarikshasarvadiksandhisarvadisham
    jvalasudarshanacakrena bandhaya bandhaya asminbhutamandalam praveshaya praveshaya am am bhutamandalam
    yamapashena bandhaya bandhaya hrim hrim bhutamandalam mohanastrena mohaya mohaya stambhanastrena stambhaya
    stambhaya kraum kraum pralayankushenakarshaya akarshaya tham thah bhutamandalam stambhanastrena keshadipadaparyantam
    stambhaya stambhaya hrim hrim bhutamandalam brahmastrena jihvam kilaya kilaya ram ram bhutamandalam
    nashaya nashaya bhutapretapishacoragadakinishakinikaminimohiniyaksharakshasakubhandavaitala brahmarakshasamarimahamaribhasurirenukakalaratrikalamrityumapamrityupralayakala
    pralayagnirudrabhayayamadutabhayabhedyagraha asadhyagrahabhayani bhedaya bhedaya bam bandhaya bandhaya
    gham ghataya ghataya sham shoshaya shoshaya tram trotaya trotaya bhram bhramaya bhramaya rim rotaya
    rotaya mam motaya motaya gam gala gala gum gujum gujum tum turu turu mim mili mili mum muru muru him
    hili hili mim mli mli vam vajrapatena mardaya mardaya mum mushalena tadaya tadaya gam gadapatena curnaya
    curnaya vam gli vam vajrapatena mardaya mardaya mum mushalena tadaya tadaya gam gadapatena curnaya
    curnaya vam vajranakhena klantaya klantaya kham khadgena khandaya khandaya cam cakrena chedaya chedaya
    mam maraya maraya gham ashtamukhagandabherunda mahapakshirajaya raum raum aghoraviranarasimhaya hraum
    hraum adihayagrivaya hum hum adivarahaya hum ghraum aghoravanarendraya kshim kshim aghorapakshimahagarudaya
    haum haum aghoramahabhallukarajaya sarvajanamanoharaya sarvamukharanjanaya sarvarajavashikaraya sarvadaridrayabhedakaya
    sakalavidyapradaya sakalavijnanapradaya trimurtrijanakaya nirgunasvarupaya niranjanaya sagunasvarupaya
    samarapriyaya aghora viratapurushaya aghora aghora vishveshvara manoharaya aghoranarayanaya aghoralakshmipriyaya
    svaha || 1234 aksharasankhya || shloka 38|| iti malamantrah samaptah || om ghraum kshraum hraum kshraum
    kshraum shthraum kshraum kshrim hrim hrim phat gandabherundanrisimhaya mahasharabhantakaya hum phat
    jvala jvala prajvala prajvala sarvashatrun hana hana hum phat svaha || shrilakshminrisimharpanamastu
    || om namo bhagavate amritodbhavaya mama dehe amritam kuru kuru svaha | deharakshanarthe surataru
    kalpavriksha mantrarajah | kauberam te mukham raudram nanditananditam bahu | mrityubhayam mahaghoram
    jvaram nashaya me jvara || 1|| iti shlokatmakam mantram sarvajvaravinashanam | jalanjali mantrakshepa
    satyam satyam shivabhatilam || 2||
  devanagari: कल्पान्ताशनि विस्फुलिङ्ग हुतभुक् जाज्वल्यनेत्रत्रयं तीव्रा वज्रसमानतुंडनखभिः दंष्ट्राभि
    जिह्वाननम् । पक्षौ मारुत सप्तघाततरणीं अष्टाननं भीषणं ध्यायेदुदण्डरौद्रं शरभमदहरं गण्डभेरुण्डसिंहम्
    ॥ २॥ अष्टास्या वह्निदृष्टिमीन्दुवरनखाविद्युतज्वालजिह्वा । मारी भीमा च पक्षौ हृदयजठरगौ अष्टकल्पाग्निदुर्गा
    । ऊरू द्वौ रुद्रकालं खगमृगनृहरिर्गण्डभेरुण्डरूपः विध्वस्तः शरभादि भैरवगणान् शत्रून् सचक्रो हरिः ॥
    ३॥ पञ्चोपचारैः सम्पूज्य जपेत् । ॐ नमो भगवते अष्टमुखगण्डभेरुण्ड अघोराय महापक्षिराजाय इन्द्रमण्डले गजारूढाय
    वज्रहस्ताय इन्द्रदिशं बन्ध बन्ध मां रक्ष रक्ष सर्वभूतेभ्यो हुं फट् स्वाहा ॥ ४॥ ॐ नमो भगवते अष्टमुखगण्डभेरुण्ड
    अघोरवीरनरसिंहाय अग्निमण्डले मेषारूढाय शक्तिहस्ताय अग्नयेदिय अष्टमहासर्पविषभक्षणाय जरामरणवर्जिताय जगदीश्वराय
    मां रक्ष रक्ष सर्वभूतेभ्यः ॥ ५॥ ॐ नमो भगवते अष्टमुखगण्डभेरुण्ड अघोरमहाभल्लूकराजाय महाभयनिवारणाय भक्तप्रियाय
    भक्तप्रसन्नमुखाय भक्तगृहनिवासाय मां रक्ष रक्ष सर्वभूतेभ्यः ॥ ६॥ अथ मालामन्त्रः । ॐ नमो भगवते अष्टमुखगण्डभेरूण्ड
    अघोरपक्षमहापक्षिराजाय अघोरवीरनृसिंहाय अघोर व्याघ्रराजाय अघोरहयग्रीवाय अघोर आदिवराहाय अघोरादिवानरेन्द्राय
    अघोरपक्षीमहागरुडाय अघोर आदिभल्लूकराजाय महाबलपराक्रमाय कोटिसूर्यप्रकाशाय वडवानलमुखाय करालवदनाय वज्रशरीराय
    वज्रशिखाय वज्रतुण्डाय वज्रदंष्ट्राय वज्रदन्ताय वज्रभुजाय वज्रहस्ताय वज्रनखाय वज्रपक्षाय वज्रपुच्छाय
    वज्रपादाय दुर्निरीक्षाय अनिवारितकोपाय अपरिमिताष्टहासाय अनेककोटिब्रह्माण्डभस्माद्धूलितशरीराय अनेककोटिब्रह्माण्डोदराय
    अनेककोटिब्रह्मांडोदरमौक्तिकालङ्कृताङ्गाय अनेककोटिब्रह्माण्डनायकाय अनेककोटिशीर्षाय अनेककोटिभुजाय अनेककोटिहस्ताय
    अनेककोटिदिव्यायुधधराय अनेककोटिपादाय अनेककोटिकनकगिरिनवरत्नमुकुटालङ्कृतमस्तकाय ॥ ७॥ ॐ नमो भगवते अष्टमुखगण्डभेरुण्ड
    अघोरविराटपुरुषाय पातालमण्डले शेषारूढाय सर्पहस्ताय पातालदिशं बन्ध बन्ध मां रक्ष रक्ष सर्वभूतेभ्यः ।
    इति दिग्बन्धः ॥ ८॥ अथात्मरक्षा । ॐ नमो भगवते अष्टमुखगण्डभेरुण्ड अघोरप क्षमहापक्षिराजाय शरभशाल्वेश्वर
    प्राणापहराय सकलशत्रुसंहारकारणाय सकलशून्यनिवारणाय मां रक्ष रक्ष सर्वभूतेभ्यो हुं फट स्वाहाः ॥ १॥ ॐ
    नमो भगवते अष्टमुखगण्डभेरुण्ड अघोरवीरनृसिंह अघोरवीरभद्रप्राणापहराय सकलरोगनिवारणाय सकलारोग्यकराय मां
    रक्ष रक्ष सर्वभूतेभ्यः ॥ २॥ ॐ नमो भगवते अष्टमुखगण्डभेरुण्ड अघोरव्याघ्रराजाय महिषराक्षसप्राणापहराय
    महामदोन्मत्ताय महाव्यालाय महादीप्ताय मां रक्ष रक्ष सर्वभूतेभ्यः ॥ ३॥ ॐ नमो भगवते अष्टमुखगण्डभेरुण्ड
    अघोर आदिहयग्रीवाय सकलमुकत्त्वविमोचनाय सकलवेद सकलशास्त्रसकलविद्याप्रदाय सकलशत्रुमन क्षोभनाय सकलकार्यप्रदाय
    मां रक्ष रक्ष सर्वभूतेभ्यः ॥ ४॥ ॐ नमो भगवते अष्टमुखगण्डभेरुण्ड अघोर आदिवराहाय दारिद्र्यध्वंसकाय अष्टैश्वर्याकर्षणाय
    अष्टपुत्रप्रदाय अखिलैश्वर्याय मां रक्ष रक्ष सर्वभूतेभ्यः ॥ ५॥ ॐ नमो भगवते अष्टमुखगण्डभेरुण्ड अघोर
    वानरेन्द्राय सकलग्रहोच्चाटनाय सकलराक्षससंहारकरणाय सकलसुरासुरवन्दिताय सकलजीवनिवासाय मां रक्ष रक्ष सर्वभूतेभ्यः
    ॥ ६॥ ॐ नमो भगवते अष्टमुखगण्डभेरुण्ड अघोर पक्षिमहागरुडाय महानागकृतान्तकाय कोटिकनकगिरि नवरत्नमकरकुण्डलाङ्कृतकर्णाय
    अनेककोटिकनकगिरिनवरत्न कङ्कणालङ्कृतकराय अनेककोटिकनकगिरिनूपुरालङ्कृतपादाय अनेककोटि यमगणशरीररोमालङ्कृताय
    अनेककोटिशरभशाल्वेश्वरप्राणापहराय एकादशरुद्रगर्वापहराय अष्टभैरवप्रभञ्जनाय जगन्मुखान्तकाय अघोरवीरभद्रप्राणापहराय
    महानन्दीमर्दनाय एहि एहि आगच्छ आगच्छ अवतर अवतर गर्ज गर्ज गर्ज भीषय भीषय स्फुर स्फुर अघोरतनु रुष रुष
    चण्ड चण्ड प्रचण्ड प्रचण्ड प्रहर प्रहर प्रलय प्रलय ज्वल ज्वल प्रज्वल प्रज्वल दह दह पच पच हन हन तुरु
    तुरु घुरु घुरु आचक्रन्दय चक्रन्दय परिवेशय परिवेशय पूर्वपश्चिम दक्षिणोत्तर ईशान्याग्नेय निऋतिवायव्योर्ध्वोन्तरिक्षसर्वदिक्सन्धिसर्वदिशां
    ज्वालासुदर्शनचक्रेण बन्धय बन्धय अस्मिन्भूतमण्डलं प्रवेशय प्रवेशय आं आं भूतमण्डलं यमपाशेन बन्धय बन्धय
    ह्रीं ह्रीं भूतमण्डलं मोहनास्त्रेण मोहय मोहय स्तम्भनास्त्रेण स्तम्भय स्तम्भय क्रौं क्रौं प्रलयाङ्कुशेनाकर्षय
    आकर्षय ठं ठः भूतमण्डलं स्तम्भनास्त्रेण केशादिपादपर्यन्तं स्तम्भय स्तम्भय ह्रीं ह्रीं भूतमण्डलं ब्रह्मास्त्रेण
    जिह्वां कीलय कीलय रं रं भूतमण्डलं नाशय नाशय भूतप्रेतपिशाचोरगडाकिनीशाकिनीकामिनीमोहिनीयक्षराक्षसकूभाण्डवैताल
    ब्रह्मराक्षसमारीमहामारीभासुरीरेणुकाकालरात्रिकालमृत्युमपमृत्युप्रलयकाल प्रलयाग्निरुद्रभययमदूतभयाभेद्यग्रह
    असाध्यग्रहभयानि भेदय भेदय बं बन्धय बन्धय घं घातय घातय शं शोषय शोषय त्रं त्रोटय त्रोटय भ्रां भ्रामय
    भ्रामय रीं रोटय रोटय मं मोटय मोटय गं गल गल गुं गुजुं गुजुं तुं तुरु तुरु मिं मिलि मिलि मुं मुरु मुरु
    हिं हिलि हिलि मिं म्लि म्लि वं वज्रपातेन मर्दय मर्दय मुं मुशलेन ताडय ताडय गं गदापातेन चूर्णय चूर्णय
    वं ग्लि वं वज्रपातेन मर्दय मर्दय मुं मुशलेन ताडय ताडय गं गदापातेन चूर्णय चूर्णय वं वज्रनखेन क्लन्तय
    क्लन्तय खं खड्गेन खण्डय खण्डय चं चक्रेण छेदय छेदय मं मारय मारय घां अष्टमुखगण्डभेरुण्ड महापक्षिराजाय
    रौं रौं अघोरवीरनारसिंहाय ह्रौं ह्रौं आदिहयग्रीवाय हुं हुं आदिवराहाय हुं घ्रौं अघोरवानरेन्द्राय क्षीं
    क्षीं अघोरपक्षिमहागरुडाय हौं हौं अघोरमहाभल्लुकराजाय सर्वजनमनोहराय सर्वमुखरञ्जनाय सर्वराजवशीकराय सर्वदारिद्रयभेदकाय
    सकलविद्याप्रदाय सकलविज्ञानप्रदाय त्रिमूर्त्रिजनकाय निर्गुणस्वरूपाय निरञ्जनाय सगुणस्वरूपाय समरप्रियाय
    अघोर विराटपुरुषाय अघोर अघोर विश्वेश्वर मनोहराय अघोरनारायणाय अघोरलक्ष्मीप्रियाय स्वाहा ॥ १२३४ अक्षरसङ्ख्या
    ॥ श्लोक ३८॥ इति मालामन्त्रः समाप्तः ॥ ॐ घ्रौं क्ष्रौं ह्रौं क्ष्रौं क्ष्रौं ष्ठ्रौं क्ष्रौं क्ष्रीं
    ह्रीं ह्रीं फट् गण्डभेरुण्डनृसिंहाय महाशरभान्तकाय हुं फट् ज्वल ज्वल प्रज्वल प्रज्वल सर्वशत्रून् हन
    हन हुं फट् स्वाहा ॥ श्रीलक्ष्मीनृसिंहार्पणमस्तु ॥ ॐ नमो भगवते अमृतोद्भवाय मम देहे अमृतं कुरु कुरु
    स्वाहा । देहरक्षणार्थे सुरतरु कल्पवृक्ष मन्त्रराजः । कौबेरं ते मुखं रौद्रं नन्दितानन्दितं बहु । मृत्युभयं
    महाघोरं ज्वरं नाशय मे ज्वर ॥ १॥ इति श्लोकात्मकं मन्त्रं सर्वज्वरविनाशानम् । जलाञ्जलि मन्त्रक्षेपा
    सत्यं सत्यं शिवभातिलम् ॥ २॥
