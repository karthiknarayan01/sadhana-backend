id: harivarasanam-hariharatmaja-ashtakam
category: stotram
name:
  english: Harivarasanam (Hariharatmaja Ashtakam)
content:
  english: harivarasanam vishvamohanam haridadhishvaram aradhyapadukam | arivimardanam nityanartanam hariharatmajam
    devamashraye || || sharanakirtanam bhaktamanasam bharanalolupam nartanalasam | arunabhasuram bhutanayakam
    hariharatmajam devamashraye || || pranayasatyakam prananayakam pranatakalpakam suprabhancitam | pranavamandiram
    kirtanapriyam hariharatmajam devamashraye || || turagavahanam sundarananam varagadayudham vedavarnitam
    | gurukripakaram kirtanapriyam hariharatmajam devamashraye || || tribhuvanarcitam devatatmakam trinayanaprabhum
    divyadeshikam | tridashapujitam cintitapradam hariharatmajam devamashraye || || bhavabhayapaham bhavukavakam
    bhuvanamohanam bhutibhushanam | dhavalavahanam divyavaranam hariharatmajam devamashraye || || kalamridusmitam
    sundarananam kalabhakomalam gatramohanam | kalabhakesarivajivahanam hariharatmajam devamashraye ||
    || shritajanapriyam cintitapradam shrutivibhushanam sadhujivanam | shrutimanoharam gitalalasam hariharatmajam
    devamashraye || || sharanam ayyappa svami sharanam ayyappa | sharanam ayyappa svami sharanam ayyappa
    ||
  devanagari: हरिवरासनं विश्वमोहनम् हरिदधीश्वरं आराध्यपादुकम् । अरिविमर्दनं नित्यनर्तनम् हरिहरात्मजं देवमाश्रये
    ॥ ॥ शरणकीर्तनं भक्तमानसम् भरणलोलुपं नर्तनालसम् । अरुणभासुरं भूतनायकम् हरिहरात्मजं देवमाश्रये ॥ ॥ प्रणयसत्यकं
    प्राणनायकम् प्रणतकल्पकं सुप्रभाञ्चितम् । प्रणवमन्दिरं कीर्तनप्रियम् हरिहरात्मजं देवमाश्रये ॥ ॥ तुरगवाहनं
    सुन्दराननम् वरगदायुधं वेदवर्णितम् । गुरुकृपाकरं कीर्तनप्रियम् हरिहरात्मजं देवमाश्रये ॥ ॥ त्रिभुवनार्चितं
    देवतात्मकम् त्रिनयनप्रभुं दिव्यदेशिकम् । त्रिदशपूजितं चिन्तितप्रदम् हरिहरात्मजं देवमाश्रये ॥ ॥ भवभयापहं
    भावुकावकम् भुवनमोहनं भूतिभूषणम् । धवलवाहनं दिव्यवारणम् हरिहरात्मजं देवमाश्रये ॥ ॥ कलमृदुस्मितं सुन्दराननम्
    कलभकोमलं गात्रमोहनम् । कलभकेसरीवाजिवाहनम् हरिहरात्मजं देवमाश्रये ॥ ॥ श्रितजनप्रियं चिन्तितप्रदम् श्रुतिविभूषणं
    साधुजीवनम् । श्रुतिमनोहरं गीतलालसम् हरिहरात्मजं देवमाश्रये ॥ ॥ शरणं अय्यप्पा स्वामि शरणं अय्यप्पा
    । शरणं अय्यप्पा स्वामि शरणं अय्यप्पा ॥
