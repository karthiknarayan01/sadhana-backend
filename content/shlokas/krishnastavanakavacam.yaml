id: krishnastavanakavacam
category: kavacha
name:
  english: krishnastavanakavacam
  devanagari: कृष्णस्तवनकवचम्
content:
  english: 7|| shrivishnoradbhutakarmano brahmarshistrishtupchandah shrivishnuh shrikrishnah shrinarayano
    devata sarvastotrasarakavacamantrasiddhyarthe viniyogah || shri krishnam jagatamadhishamanagham dhyanatsiddhipradam
    govindam bhavasindhuparakaranam santaranam karanam | shri vishnum vanamalinam naraharim narayanam
    gokulam yogendram naranathamadipurusham vrindavane bhavayet || 39
  devanagari: ७॥ श्रीविष्णोरद्भुतकर्मणो ब्रह्मर्षिस्त्रिष्टुप्छन्दः श्रीविष्णुः श्रीकृष्णः श्रीनारायणो
    देवता सर्वस्तोत्रसारकवचमन्त्रसिद्ध्यर्थे विनियोगः ॥ श्री कृष्णं जगतामधीशमनघं ध्यानात्सिद्धिप्रदं गोविन्दं
    भवसिन्धुपारकरणं सन्तारणं कारणम् । श्री विष्णुं वनमालिनं नरहरिं नारायणं गोकुलं योगेन्द्रं नरनाथमादिपुरुषं
    वृन्दावने भावयेत् ॥ ३९
meaning: {}
