id: argalastotra
category: stotram
name:
  english: argalastotra
  devanagari: अर्गलास्तोत्र
content:
  english: shrijagadambapritaye saptashatipathangatvena jape viniyogah | om namashcandikayai markandeya
    uvaca | om jaya tvam devi camunde jaya bhutapaharini | jaya sarvagate devi kalaratri namo'stu te ||
    1|| jayanti mangala kali bhadrakali kapalini | durga shiva kshama dhatri svaha svadha namo'stu te
    || 2|| madhukaitabhavidhvamsi vidhatrivarade namah | rupam dehi jayam dehi yasho dehi dvisho jahi
    || 3|| mahishasuranirnashi bhaktanam sukhade namah | rupam dehi jayam dehi yasho dehi dvisho jahi
    || 4|| dhumranetravadhe devi dharmakamarthadayini | rupam dehi jayam dehi yasho dehi dvisho jahi ||
    5|| raktabijavadhe devi candamundavinashini | rupam dehi jayam dehi yasho dehi dvisho jahi || 6||
    nishumbhashumbhanirnashi trilokyashubhade namah | rupam dehi jayam dehi yasho dehi dvisho jahi ||
    7|| vanditanghriyuge devi sarvasaubhagyadayini | rupam dehi jayam dehi yasho dehi dvisho jahi || 8||
    acintyarupacarite sarvashatruvinashini | rupam dehi jayam dehi yasho dehi dvisho jahi || 9|| natebhyah
    sarvada bhaktya caparne duritapahe | rupam dehi jayam dehi yasho dehi dvisho jahi || 10|| stuvadbhyo
    bhaktipurvam tvam candike vyadhinashini | rupam dehi jayam dehi yasho dehi dvisho jahi || 11|| candike
    satatam yuddhe jayanti papanashini | rupam dehi jayam dehi yasho dehi dvisho jahi || 12|| dehi saubhagyamarogyam
    dehi devi param sukham | rupam dehi jayam dehi yasho dehi dvisho jahi || 13|| vidhehi devi kalyanam
    vidhehi vipulam shriyam | rupam dehi jayam dehi yasho dehi dvisho jahi || 14|| vidhehi dvishatam nasham
    vidhehi balamuccakaih | rupam dehi jayam dehi yasho dehi dvisho jahi || 15|| surasurashiroratnanighrishtacarane'mbike
    | rupam dehi jayam dehi yasho dehi dvisho jahi || 16|| vidyavantam yashasvantam lakshmivantanca mam
    kuru | rupam dehi jayam dehi yasho dehi dvisho jahi || 17|| devi pracandadordandadaityadarpanishudini
    | rupam dehi jayam dehi yasho dehi dvisho jahi || 18|| pracandadaityadarpaghne candike pranataya me
    | rupam dehi jayam dehi yasho dehi dvisho jahi || 19|| caturbhuje caturvaktrasamstute parameshvari
    | rupam dehi jayam dehi yasho dehi dvisho jahi || 20|| krishnena samstute devi shashvadbhaktya sadambike
    | rupam dehi jayam dehi yasho dehi dvisho jahi || 21|| himacalasutanathasamstute parameshvari | rupam
    dehi jayam dehi yasho dehi dvisho jahi || 22|| indranipatisadbhavapujite parameshvari | rupam dehi
    jayam dehi yasho dehi dvisho jahi || 23|| devi bhaktajanoddamadattanandodaye'mbike | rupam dehi jayam
    dehi yasho dehi dvisho jahi || 24|| bharyam manoramam dehi manovrittanusarinim | rupam dehi jayam
    dehi yasho dehi dvisho jahi || 25|| tarini durgasamsarasagarasyacalodbhave | rupam dehi jayam dehi
    yasho dehi dvisho jahi || 26|| idam stotram pathitva tu mahastotram pathennarah | saptashatim samaradhya
    varamapnoti durlabham || 27|| || iti shrimarkandeyapurane argalastotram samaptam ||
  devanagari: श्रीजगदम्बाप्रीतये सप्तशतिपाठाङ्गत्वेन जपे विनियोगः । ॐ नमश्चण्डिकायै मार्कण्डेय उवाच ।
    ॐ जय त्वं देवि चामुण्डे जय भूतापहारिणि । जय सर्वगते देवि कालरात्रि नमोऽस्तु ते ॥ १॥ जयन्ती मङ्गला
    काली भद्रकाली कपालिनी । दुर्गा शिवा क्षमा धात्री स्वाहा स्वधा नमोऽस्तु ते ॥ २॥ मधुकैटभविध्वंसि विधातृवरदे
    नमः । रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ ३॥ महिषासुरनिर्नाशि भक्तानां सुखदे नमः । रूपं देहि
    जयं देहि यशो देहि द्विषो जहि ॥ ४॥ धूम्रनेत्रवधे देवि धर्मकामार्थदायिनि । रूपं देहि जयं देहि यशो देहि
    द्विषो जहि ॥ ५॥ रक्तबीजवधे देवि चण्डमुण्डविनाशिनि । रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ ६॥ निशुम्भशुम्भनिर्नाशि
    त्रिलोक्यशुभदे नमः । रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ ७॥ वन्दिताङ्घ्रियुगे देवि सर्वसौभाग्यदायिनि
    । रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ ८॥ अचिन्त्यरूपचरिते सर्वशत्रुविनाशिनि । रूपं देहि जयं देहि
    यशो देहि द्विषो जहि ॥ ९॥ नतेभ्यः सर्वदा भक्त्या चापर्णे दुरितापहे । रूपं देहि जयं देहि यशो देहि द्विषो
    जहि ॥ १०॥ स्तुवद्भ्यो भक्तिपूर्वं त्वां चण्डिके व्याधिनाशिनि । रूपं देहि जयं देहि यशो देहि द्विषो
    जहि ॥ ११॥ चण्डिके सततं युद्धे जयन्ति पापनाशिनि । रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ १२॥ देहि
    सौभाग्यमारोग्यं देहि देवि परं सुखम् । रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ १३॥ विधेहि देवि कल्याणं
    विधेहि विपुलां श्रियम् । रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ १४॥ विधेहि द्विषतां नाशं विधेहि
    बलमुच्चकैः । रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ १५॥ सुरासुरशिरोरत्ननिघृष्टचरणेऽम्बिके । रूपं
    देहि जयं देहि यशो देहि द्विषो जहि ॥ १६॥ विद्यावन्तं यशस्वन्तं लक्ष्मीवन्तञ्च मां कुरु । रूपं देहि
    जयं देहि यशो देहि द्विषो जहि ॥ १७॥ देवि प्रचण्डदोर्दण्डदैत्यदर्पनिषूदिनि । रूपं देहि जयं देहि यशो
    देहि द्विषो जहि ॥ १८॥ प्रचण्डदैत्यदर्पघ्ने चण्डिके प्रणताय मे । रूपं देहि जयं देहि यशो देहि द्विषो
    जहि ॥ १९॥ चतुर्भुजे चतुर्वक्त्रसंस्तुते परमेश्वरि । रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ २०॥ कृष्णेन
    संस्तुते देवि शश्वद्भक्त्या सदाम्बिके । रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ २१॥ हिमाचलसुतानाथसंस्तुते
    परमेश्वरि । रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ २२॥ इन्द्राणीपतिसद्भावपूजिते परमेश्वरि । रूपं
    देहि जयं देहि यशो देहि द्विषो जहि ॥ २३॥ देवि भक्तजनोद्दामदत्तानन्दोदयेऽम्बिके । रूपं देहि जयं देहि
    यशो देहि द्विषो जहि ॥ २४॥ भार्यां मनोरमां देहि मनोवृत्तानुसारिणीम् । रूपं देहि जयं देहि यशो देहि द्विषो
    जहि ॥ २५॥ तारिणि दुर्गसंसारसागरस्याचलोद्भवे । रूपं देहि जयं देहि यशो देहि द्विषो जहि ॥ २६॥ इदं स्तोत्रं
    पठित्वा तु महास्तोत्रं पठेन्नरः । सप्तशतीं समाराध्य वरमाप्नोति दुर्लभम् ॥ २७॥ ॥ इति श्रीमार्कण्डेयपुराणे
    अर्गलास्तोत्रं समाप्तम् ॥
