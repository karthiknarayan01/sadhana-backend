    kamyayai namah | om kumaryai namah | om kutilayai namah | 50 om kumarambayai namah om kuleshvaryai
    namah | om mridanyai namah | om mrigashavakshyai namah | om mridudehayai namah | om mrigapriyayai
    namah | om mrikandupujitayai namah | om madhvipriyayai namah | om matriganeditayai namah | om matrikayai
    namah | 60 om madhavyai namah | om madyanmanasayai namah | om madirekshanayai namah | om modarupayai
    namah | om modakaryai namah | om munidhyeyayai namah | om manonmanyai namah | om parvatasthayai namah
