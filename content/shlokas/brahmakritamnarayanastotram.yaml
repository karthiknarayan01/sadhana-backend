id: brahmakritamnarayanastotram
category: stotram
name:
  english: brahmakritamnarayanastotram
  devanagari: ब्रह्मकृतंनारायणस्तोत्रम्
content:
  english: brahmakritam narayanastotram namo'nantasvarupaya namo dharmadharaya ca || 9|| namah sthulasvarupaya
    namah sukshmasvarupine | namo'nvayasvarupaya sarvantaryamine namah || 10|| namo'ksharasvarupaya namo
    muktatmakaya te | namo vyuhasvarupaya namah kalasvarupine || 11|| namah krishnadirupaya namo hiranmayaya
    ca | namo vairajarupaya namo golokavasine || 12|| namo vaikunthavasaya namo'vyakritavartine | namo
    devaya shantaya sukshmatatvantaratmane || 13|| namah karyasvarupaya namah karanarupine | namo narisvarupaya
    namo bijapradayine || 14|| namah prithusvarupaya namah salilashayine | namo'gnyarkasvarupaya namo
    yajnamayaya ca || 15|| kripam kuru kripanatha jalatsthaulyam vibhavaya | iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 50
  devanagari: ब्रह्मकृतं नारायणस्तोत्रम् नमोऽनन्तस्वरूपाय नमो धर्मधराय च ॥ ९॥ नमः स्थूलस्वरूपाय नमः सूक्ष्मस्वरूपिणे
    । नमोऽन्वयस्वरूपाय सर्वान्तर्यामिणे नमः ॥ १०॥ नमोऽक्षरस्वरूपाय नमो मुक्तात्मकाय ते । नमो व्यूहस्वरूपाय
    नमः कालस्वरूपिणे ॥ ११॥ नमः कृष्णादिरूपाय नमो हिरण्मयाय च । नमो वैराजरूपाय नमो गोलोकवासिने ॥ १२॥ नमो
    वैकुण्ठवासाय नमोऽव्याकृतवर्तिने । नमो देवाय शान्ताय सूक्ष्मतत्वान्तरात्मने ॥ १३॥ नमः कार्यस्वरूपाय
    नमः कारणरूपिणे । नमो नारीस्वरूपाय नमो बीजप्रदायिने ॥ १४॥ नमः पृथुस्वरूपाय नमः सलिलशायिने । नमोऽग्न्यर्कस्वरूपाय
    नमो यज्ञमयाय च ॥ १५॥ कृपां कुरु कृपानाथ जलात्स्थौल्यं विभावय । इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे
    कृतयुगसन्ताने ५०
