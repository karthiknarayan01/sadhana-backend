id: mahapratisarastotram
category: stotram
name:
  english: mahapratisarastotram
  devanagari: महाप्रतिसरास्तोत्रम्
content:
  english: mahapratisarastotram om namah shrimahapratisarayai | yasyah smaranamatrena sarve papah kshayam
    gatah | yaya yukto vajrakayo namastasyai namo namah || 1|| yam smaran rakshasah kruro matharam kukshisamsthitam
    | prakshipad govisham nadyam namastasyai namo namah || 2|| ya'rakshat vanijah putram krurasarpad vadhodyatat
    | vishadahamumurshum ca namastasyai namo namah || 3|| brahmadatto maharajo yaya rakshitamastakah |
    ripum jitva virajo'bhunnamastasyai namo namah || 4|| bhikshurduhshilako rogi yaya kanthe prabandhitah
    | prananmuktva yayau svargam namastasyai namo namah || 5|| samudre potasamkshubdhe vanijam pranarakshakah
    | yam smaran sarthavaho'bhunnamastasyai namo namah || 6|| yasyam ca pratibaddhayam bharyayam sutamaptavan
    | prasaritabhujo raja namastasyai namo namah || 7|| daridro yam prati smritva dinaran pradadau jine
    | raja'bhishtapradata'bhunnamastasyai namo namah || 8|| yam prabaddhva'surairyuddham shakrashcudamanau
    prabhuh | labdhavan vijayam vajri namastasyai namo namah || 9|| yasya mantrabalenaiva purya paramitashca
    shat | mara jita jinairbuddhairnamastasyai namo namah || 10|| apadhiro vadharho'pi prakshiptah sarvasankate
    | yam smritva parimukto'bhunnamastasyai namo namah || 11|| yaya bandhitakanthashca mukto'bhut papasankatat
    | nagare nayako'bhucca namastasyai namo namah || 12|| ya ca'parajita vidya sarvabuddhaishca dharita
    | mudrita bhashita nityam pathita parideshita || 13|| likhita modita sattvahitaya pujita sada | smrita
    kayagata kritva namastasyai namo namah || 14|| yasyah smaranamatranna durlabham bhuvanatraye | pathasvadhyayanadvapi
    namastasyai namo namah || 15|| ya vidya durlabha buddhairvyakrita suptashamsita | mahati dharani khyata
    sarvapapakshayankari || 16|| mahabala mahavirya mahateja mahatprabha | mahagunavati vidya sarvabharavidarani
    || 17|| papasandhisamudghati marabandhapramocani | janani bodhisattvanam sarvadushtavinashini || 18||
    rakshani poshani dhatri paramantravighatini | karkhodavishayoganam vidhvamsanakari shiva || 19|| mahadhyanaratanam
    ca grihnatam likhatam sada | pathadhyayanakritam nityam dadhatam sha
  devanagari: महाप्रतिसरास्तोत्रम् ॐ नमः श्रीमहाप्रतिसरायै । यस्याः स्मरणमात्रेण सर्वे पापाः क्षयं गताः
    । यया युक्तो वज्रकायो नमस्तस्यै नमो नमः ॥ १॥ यां स्मरन् राक्षसः क्रूरो माठरं कुक्षिसंस्थितम् । प्राक्षिपद्
    गोविषं नद्यां नमस्तस्यै नमो नमः ॥ २॥ याऽरक्षत् वणिजः पुत्रं क्रूरसर्पाद् वधोद्यतात् । विषदाहमुमूर्षुं
    च नमस्तस्यै नमो नमः ॥ ३॥ ब्रह्मदत्तो महाराजो यया रक्षितमस्तकः । रिपुं जित्वा विराजोऽभून्नमस्तस्यै
    नमो नमः ॥ ४॥ भिक्षुर्दुःशीलको रोगी यया कण्ठे प्रबन्धितः । प्राणान्मुक्त्वा ययौ स्वर्गं नमस्तस्यै नमो
    नमः ॥ ५॥ समुद्रे पोतसंक्षुब्धे वणिजां प्राणरक्षकः । यां स्मरन् सार्थवाहोऽभून्नमस्तस्यै नमो नमः ॥ ६॥
    यस्यां च प्रतिबद्धायां भार्यायां सुतमाप्तवान् । प्रसारितभुजो राजा नमस्तस्यै नमो नमः ॥ ७॥ दरिद्रो यां
    प्रति स्मृत्वा दीनारान् प्रददौ जिने । राजाऽभीष्टप्रदाताऽभून्नमस्तस्यै नमो नमः ॥ ८॥ यां प्रबद्ध्वाऽसुरैर्युद्धं
    शक्रश्चूडामणौ प्रभुः । लब्धवान् विजयं वज्री नमस्तस्यै नमो नमः ॥ ९॥ यस्या मन्त्रबलेनैव पूर्य पारमिताश्च
    षट् । मारा जिता जिनैर्बुद्धैर्नमस्तस्यै नमो नमः ॥ १०॥ अपधीरो वधार्होऽपि प्रक्षिप्तः सर्वसङ्कटे । यां
    स्मृत्वा परिमुक्तोऽभून्नमस्तस्यै नमो नमः ॥ ११॥ यया बन्धितकण्ठश्च मुक्तोऽभूत् पापसङ्कटात् । नगरे नायकोऽभूच्च
    नमस्तस्यै नमो नमः ॥ १२॥ या चाऽपराजिता विद्या सर्वबुद्धैश्च धारिता । मुद्रिता भाषिता नित्यं पठिता परिदेशिता
    ॥ १३॥ लिखिता मोदिता सत्त्वहिताय पूजिता सदा । स्मृता कायगता कृत्वा नमस्तस्यै नमो नमः ॥ १४॥ यस्याः स्मरणमात्रान्न
    दुर्लभं भुवनत्रये । पाठस्वाध्यायनाद्वापि नमस्तस्यै नमो नमः ॥ १५॥ या विद्या दुर्लभा बुद्धैर्व्याकृता
    सुप्तशंसिता । महती धारणी ख्याता सर्वपापक्षयङ्करी ॥ १६॥ महाबला महावीर्या महातेजा महत्प्रभा । महागुणवती
    विद्या सर्वभारविदारणी ॥ १७॥ पापसन्धिसमुद्घाती मारबन्धप्रमोचनी । जननी बोधिसत्त्वानां सर्वदुष्टविनाशिनी
    ॥ १८॥ रक्षणी पोषणी धात्री परमन्त्रविघातिनी । कार्खोदविषयोगानां विध्वंसनकरी शिवा ॥ १९॥ महाध्यानरतानां
    च गृह्णतां लिखतां सदा । पाठाध्ययनकृतां नित्यं दधतां श
