id: sudarshanacakrakritamvishnustotram
category: stotram
name:
  english: sudarshanacakrakritamvishnustotram
  devanagari: सुदर्शनचक्रकृतंविष्णुस्तोत्रम्
content:
  english: sudarshanacakrakritam vishnustotram namaste devadevesha vasudevaya vishnave | narayanaya nalikanayanaya
    namo namah || 40|| natha narayana vibho nalinayatalocana | prasida karunamurte prasida jagatam guro
    || 41|| yamekamishamadyantamanantamakutobhayam | aksharamanirdeshyam sharanam yami shashvatam || 42||
    puranamadyam purusham vrishasenam vrishakapim | vedantavedyam vishvasya janitaramupasmahe || 43||
    tarakah paramo yogi yogidhyeyanghripankajah | sa me gatiranantatma sarvasakshi jagadguruh || 44||
    gunatitah parah shuddho hamsakhyah prapitamahah | shrutikarmah puman sakshadavirastu puro harih ||
    45|| anoraniyanatma ca mahato'pi mahan mahan | mamaiva drishi sambhuyanmohandhadhvantabhaskarah ||
    46|| shyamo hiranyaparidhih vanamalavibhushitam | shripatim sharanam yami vishvasyasyaivahetukam ||
    47|| alolatulasidamamarudhavinatasutam | jyotirindivarashyamamavirastu mamagratah || 48|| namo namah
    puranaya purushayadivedhase | satam sanmargabandhunam paritranaya sadhave || 49|| sattvamekaksharam
    jyotirakarah khagarupakah | yattamantassmaramyetat pancamasvaramaksharah || 50|| khago bhokta ca karmatma
    purusho vyanjanatmakah | urdhvatiryaggatah svantah keshavo dayito mama || 51|| sheshankashayinamasheshagurum
    puranam narayanam trijagatam pranatapavargam | natham vrajami sharanam karunamritabdhim nastyatra
    me vishati cittamidam mukundat || 52|| ittham stuvati vai tasmin cakraraje sudarshane | pradurbabhuva
    bhagavan prasannatma janardanah || 53|| iti tamraparnimahatmye 59
  devanagari: सुदर्शनचक्रकृतं विष्णुस्तोत्रम् नमस्ते देवदेवेश वासुदेवाय विष्णवे । नारायणाय नालीकनयनाय
    नमो नमः ॥ ४०॥ नाथ नारायण विभो नलिनायतलोचन । प्रसीद करुणामूर्ते प्रसीद जगतां गुरो ॥ ४१॥ यमेकमीशमाद्यन्तमनन्तमकुतोभयम्
    । अक्षरमनिर्देश्यं शरणं यामि शाश्वतम् ॥ ४२॥ पुराणमाद्यं पुरुषं वृषसेनं वृषाकपिम् । वेदान्तवेद्यं विश्वस्य
    जनितारमुपास्महे ॥ ४३॥ तारकः परमो योगी योगिध्येयाङ्घ्रिपङ्कजः । स मे गतिरनन्तात्मा सर्वसाक्षी जगद्गुरुः
    ॥ ४४॥ गुणातीतः परः शुद्धो हंसाख्यः प्रपितामहः । श्रुतिकर्मः पुमान् साक्षादाविरस्तु पुरो हरिः ॥ ४५॥
    अणोरणीयानात्मा च महतोऽपि महान् महान् । ममैव दृशि सम्भूयान्मोहान्धध्वान्तभास्करः ॥ ४६॥ श्यामो हिरण्यपरिधिः
    वनमालाविभूषितम् । श्रीपतिं शरणं यामि विश्वस्यास्यैवहेतुकम् ॥ ४७॥ आलोलतुलसीदाममारूढविनतासुतम् । ज्योतिरिन्दीवरश्याममाविरस्तु
    ममाग्रतः ॥ ४८॥ नमो नमः पुराणाय पुरुषायादिवेधसे । सतां सन्मार्गबन्धूनां परित्राणाय साधवे ॥ ४९॥ सत्त्वमेकाक्षरं
    ज्योतिराकारः खगरूपकः । यत्तमन्तस्स्मराम्येतत् पञ्चमस्वरमक्षरः ॥ ५०॥ खगो भोक्ता च कर्मात्मा पुरुषो
    व्यञ्जनात्मकः । ऊर्ध्वतिर्यग्गतः स्वान्तः केशवो दयितो मम ॥ ५१॥ शेषाङ्कशायिनमशेषगुरुं पुराणं नारायणं
    त्रिजगतां प्रणतापवर्गम् । नाथं व्रजामि शरणं करुणामृताब्धिं नास्त्यत्र मे विशति चित्तमिदं मुकुन्दात्
    ॥ ५२॥ इत्थं स्तुवति वै तस्मिन् चक्रराजे सुदर्शने । प्रादुर्बभूव भगवान् प्रसन्नात्मा जनार्दनः ॥ ५३॥
    इति ताम्रपर्णीमाहात्म्ये ५९
