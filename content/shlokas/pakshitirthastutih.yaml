id: pakshitirthastutih
category: stotram
name:
  english: pakshitirthastutih
  devanagari: पक्षितीर्थस्तुतिः
content:
  english: 89 yatra shankhabhidham tirtham yatra vedagirirmahan | bhaktavatsala ishashca pakshitirtham
    taduttamam || 1|| vidheh sutau shambhushapadvidheh kankatvametyasau | bhaktadattam grihnato'mbho bhaktamanvahamatra
    hi || 2|| pramshuvedagireh shishrnam nishevya brahmacaryatah | shivamatmanamiva yah pashyetsa gatimapnuyat
    || 3|| iti shrivasudevanandasarasvativiracita pakshitirthastutih samapta |
  devanagari: ८९ यत्र शङ्खाभिधं तीर्थं यत्र वेदगिरिर्महान् । भक्तवत्सल ईशश्च पक्षितीर्थं तदुत्तमम् ॥ १॥
    विधेः सुतौ शम्भुशापाद्विधेः कङ्कत्वमेत्यसौ । भक्तदत्तं गृह्णतोऽम्भो भक्तमन्वहमत्र हि ॥ २॥ प्रांशुवेदगिरेः
    शीष्र्णं निषेव्य ब्रह्मचर्यतः । शिवमात्मानमिव यः पश्येत्स गतिमाप्नुयात् ॥ ३॥ इति श्रीवासुदेवानन्दसरस्वतीविरचिता
    पक्षितीर्थस्तुतिः समाप्ता ।
meaning: {}
