  devanagari: ृणुध्वं मुनिपुंगवाः ॥ १२।११॥ शान्तिर्विद्या प्रतिष्ठा च निवृत्तिश्चेति ताः स्मृताः । चतुर्व्यूहस्ततो
    देवः प्रोच्यते परमेश्वरः ॥ १२।१२॥ अनया परया देवः स्वात्मानन्दं समश्नुते । चतुर्ष्वपि च वेदेषु चतुर्मूर्तिर्महेश्वरः
    ॥ १२।१३॥ अस्यास्त्वनादिसंसिद्धमैश्वर्यमतुलं महत् । तत्सम्बन्धादनन्ताया रुद्रेण परमात्मना ॥ १२।१४॥
    सैषा सर्वेश्वरी देवी सर्वभूतप्रवर्तिका । प्रोच्यते भगवान् कालो हरिः प्राणो महेश्वरः ॥ १२।१५॥ तत्र
    सर्वमिदं प्रोतमोतंचैवाखिलं जगत् । स कालोऽग्निर्हरो रुद्रो गीयते वेदवादिभिः ॥ १२।१६॥ कालः सृजति भूतानि
    कालः संहरते प्रजाः । सर्वे कालस्य वशगा न कालः कस्यचिद् वशे ॥ १२।१७॥ प्रधानं पुरुषस्तत्त्वं महानात्मा
    त्वहंकृतिः । कालेनान्यानि तत्त्वानि समाविष्टानि योगिना ॥ १२।१८॥ तस्य सर्वजगन्मूर्तिः शक्तिर्मायेति
    विश्रुता । तदेयं भ्रामयेदीशो मायावी पुरुषोत्तमः ॥ १२।१९॥ सैषा मायात्मिका शक्तिः सर्वाकारा सनातनी ।
    वैश्वरूपं महेशस्य सर्वदा सम्प्रकाशयेत् ॥ १२।२०॥ अन्याश्च शक्तयो मुख्यास्तस्य देवस्य निर्मिताः । ज्ञानशक्तिः
    क्रियाशक्तिः प्राणशक्तिरिति त्रयम् ॥ १२।२१॥ सर्वासामेव शक्तीनां शक्तिमन्तो विनिर्मिताः । माययैवाथ
    विप्रेन्द्राः सा चानादिरनश्वराः ॥ १२।२२॥ सर्वशक्त्यात्मिका माया दुर्निवारा दुरत्यया । मायावी सर्वशक्तीशः
    कालः कालकारः प्रभुः ॥ १२।२३॥ करोति कालः सकलं संहरेत् काल एव हि । कालः स्थापयते विश्वं कालाधीनमिदं
    जगत् ॥ १२।२४॥ लब्ध्वा देवाधिदेवस्य सन्निधिं परमेष्ठिनः । अनन्तस्याखिलेशस्य शंभोः कालात्मनः प्रभोः
    ॥ १२।२५॥ प्रधानं पुरुषो माया माया चैवं प्रपद्यते । एका सर्वगतानन्ता केवला निष्कला शिवा ॥ १२।२६॥ एका
    शक्तिः शिवैकोऽपि शक्तिमानुच्यते शिवः । शक्तयः शक्तिमन्तोऽन्ये सर्वशक्तिसमुद्भवाः ॥ १२।२७॥ शक्तिशक्तिमतोर्भेदं
    वदन्ति परमार्थतः । अभेदंचानुपश्यन्ति योगिनस्तत्त्वचिन्तकाः ॥ १२।२८॥ शक्तयो गिरजा देवी शक्तिमानथ शंकरः
    । विशेषः कथ्यते चायं पुराणे ब्रह्मवादिभिः ॥ १२।२९॥ भोग्या विश्वेश्वरी देवी महेश्वरपतिव्रता । प्रोच्यते
    भगवान् भोक्ता कपर्दी नीललोहितः ॥ १२।३०॥ मन्ता विश्वेश्वरो देवः शंकरो मन्मथान्तकः । प्रोच्यते मतिरीशानी
    मन्तव्या च विचारतः ॥ १२।३१॥ इत्येतदखिलं विप्राः शक्तिशक्तिमदुद्भवम् । प्रोच्यते सर्ववेदेषु मुनिभिस्तत्त्वदर्शिभिः
    ॥ १२।३२॥ एतत्प्रदर्शितं दिव्यं देव्या माहात्म्यमुत्तमम् । सर्ववेदान्तवीदेषु निश्चितं ब्रह्मवादिभिः
    ॥ १२।३३॥ एकं सर्वगतं सूक्ष्मं कूटस्थमचलं ध्रुवम् । योगिनस्तत्प्रपश्यन्ति महादेव्याः परं पदम् ॥ १२।३४॥
    आनन्दमक्षरं ब्रह्म केवलं निष्कलं परम् । योगिनस्तत्प्रपश्यन्ति महादेव्याः परं पदम् ॥ १२।३५॥ परात्परतरं
    तत्त्वं शाश्वतं शिवमच्युतम् । अनन्तप्रकृतौ लीनं देव्यास्तत्परमं पदम् ॥ १२।३६॥ शुभं निरञ्जनं शुद्धं
    निर्गुणं द्वैतवर्जितम् । आत्मोपलब्धिविषयं देव्यास्ततपरमं पदम् ॥ १२।३७॥ सैषा धात्री विधात्री च परमानन्दमिच्छताम्
    । संसारतापानखिलान्निहन्तीश्वरसंश्रया ॥ १२।३८॥ तस्माद्विमुक्तिमन्विच्छन् पार्वतीं परमेश्वरीम् । आश्रयेत्सर्वभूतानामात्मभूतां
    शिवात्मिकाम् ॥ १२।३९॥ लब्ध्वा च पुत्रीं शर्वाणीं तपस्तप्त्वा सुदुश्चरन् । सभार्यः शरणं यातः पार्वतीं
    परमेश्वरीम् ॥ १२।४०॥ तां दृष्ट्वा जायमानां च स्वेच्छयैव वराननाम् । मेना हिमवतः पत्नी प्राहेदं पर्वतेश्वरम्
    ॥ १२।४१॥ मेनोवाच पश्य बालामिमां राजन्राजीवसदृशाननाम् । हिताय सर्वभूतानां जाता च तपसावयोः ॥ १२।४२॥
    सोऽपि दृष्ट्वा ततः देवीं तरुणादित्यसन्निभाम् । कपर्दिनीं चतुर्वक्रां त्रिनेत्रामतिलालसाम् ॥ १२।४३॥
    अष्टहस्तां विशालाक्षीं चन्द्रावयवभूषणाम् । निर्गुणां सगुणां साक्षात्सदसद्व्यक्तिवर्जिताम् ॥ १२।४४॥
    प्रणम्य शिरसा भूमौ तेजसा चातिविह्वलः । भीतः कृताञ्जलिस्तस्याः प्रोवाच परमेश्वरीम् ॥ १२।४५॥ हिमवानुवाच
    का त्वं देवि विशालाक्षि शशाङ्कावयवाङ्किते । न जाने त्वामहं वत्से यथावद्ब्रूहि पृच्छते ॥ १२।४६॥ गिरीन्द्रवचनं
    श्रुत्वा ततः सा परमेश्वरी । व्याजहार महाशैलं योगिनामभयप्रदा ॥ १२।४७॥ देव्युवाच मां विद्धि परमां शक्तिं
    परमेश्वरसमाश्रयाम् ॥ १२।४८॥ अनन्यामव्ययामेकां यां पश्यन्ति मुमुक्षवः । अहं वै सर्वभावानात्मा सर्वान्तरा
    शिवा ॥ १२।४९॥ शाश्वतैश्वर्यविज्ञानमूर्तिः सर्वप्रवर्तिका । अनन्ताऽनन्तमहिमा संसारार्णवतारिणी ॥ १२।५०॥
    दिव्यं ददामि ते चक्षुः पश्य मे रूपमैश्वरम् । एतावदुक्त्वा विज्ञानं दत्त्वा हिमवते स्वयम् ॥ १२।५१॥
    स्वं रूपं दर्शयामास दिव्यं तत् पारमेश्वरम् । कोटिसूर्यप्रितीकाशं तेजोबिम्बं निराकुलम् ॥ १२।५२॥ ज्वालामालासहस्राढ्यं
    कालानलशतोपमम् । दंष्ट्राकरालं दुर्द्धर्षं जटामणडलमण्डितम् ॥ १२।५३॥ किरीटिनं गदाहस्तं शङ्कचक्रधरं तथा
    । त्रिशूलवरहस्तं च घोररूपं भयानकम् ॥ १२।५४॥ प्रशान्तं सोम्यवदनमनन्ताश्चर्यसंयुतम् । चन्द्रावयवलक्ष्माणं
    चन्द्रकोटिसमप्रभम् ॥ १२।५५॥ किरीटिनं गदाहस्तं नूपुरैरुपशोभितम् । दिव्यमाल्याम्बरधरं दिव्यगन्धानुलेपनम्
    ॥ १२।५६॥ शङ्खचक्रधरं काम्यं त्रिनेत्रं कृत्तिवाससम् । अण्डस्थं चाण्डबाह्यस्थं बाह्यमाभ्यन्तरं परम्
    ॥ १२।५७॥ सर्वशक्तिमयं शुभ्रं सर्वाकारं सनातनम् । ब्रह्मोन्द्रोपेन्द्रयोगीन्द्रैर्वन्द्यमानपदाम्बुजम्
    ॥ १२।५८॥ सर्वतः पाणिपादान्तं सर्वतोऽक्षिशिरोमुखम् । सर्वमावृत्य तिष्ठन्तं ददर्श परमेश्वरम् ॥ १२।५९॥
    दृष्ट्वा तदीदृशं रूपं देव्या माहेश्वरं परम् । भयेन च समाविष्टः स राजा हृष्टमानसः ॥ १२।६०॥ आत्मन्याधाय
    चात्मानमोङ्कारं समनुस्मरन् । नाम्नामष्टसहस्रेण तुष्टाव परमेश्वरीम् ॥ १२।६१॥ हिमवानुवाच शिवोमा परमा
    शक्तिरनन्ता निष्कलामला । शान्ता माहेश्वरी नित्या शाश्वती परमाक्षरा ॥ १२।६२॥ अचिन्त्या केवलाऽनन्त्या
    शिवात्मा परमात्मिका । अनादिरव्यया शुद्धा देवात्मा सर्वगाऽचला ॥ १२।६३॥ एकानेकविभागस्था मायातीता सुनिर्मला
    । महामाहेश्वरी सत्या महादेवी निरञ्जना ॥ १२।६४॥ काष्ठा सर्वान्तरस्था च चिच्छक्तिरतिलालसा । नन्दा सर्वात्मिका
    विद्या ज्योतीरूपाऽमृताक्षरा ॥ १२।६५॥ शान्तिः प्रतिष्ठा सर्वेषां निवृत्तिरमृतप्रदा । व्योममूर्तिर्व्योमलया
    व्योमाधाराऽच्युताऽमरा ॥ १२।६६॥ अनादिनिधनाऽमोघा कारणात्माकुलाकुला । स्वतः प्रथमजानाभिरमृतस्यात्मसंश्रया
    ॥ १२।६७॥ प्राणेश्वरप्रिया माता महामहिषघातिनी । प्राणेश्वरी प्राणरूपा प्रधानपुरुषेश्वरी ॥ १२।६८॥ महामाया
    सुदुष्पूरा मूलप्रकृतिरीश्वरी सर्वशक्तिकलाकारा ज्योत्स्ना द्योर्महिमास्पदा ॥ १२।६९॥ सर्वकार्यनियन्त्री
    च सर्वभूतेश्वरेश्वरी । संसारयोनिः सकला सर्वशक्तिसमुद्भवा ॥ १२।७०॥ संसारपोता दुर्वारा दुर्निरीक्ष्य
    दुरासदा । प्राणशक्तिः प्राणविद्या योगनीपरमा कला ॥ १२।७१॥ महविभूतिदुर्दर्षा मूलप्रकृतिसम्भवा । अनाद्यनन्तविभवा
    परमाद्यापकर्षिणी ॥ १२।७२॥ सर्गस्थित्यन्तकरणी सुदुर्वाच्यादुरत्यया । शब्दयोनिः शब्दमयी नादाख्या नादविग्रहा
    ॥ १२।७३॥ अनादिरव्यक्तगुणा महानन्दा सनातनी । आकाशयोनिर्योगस्था महायोगेश्वरेश्वरी ॥ १२।७४॥ महामाया सुदुष्पारा
    मूलप्रकृतिरीश्वरी प्रधानपुरुषातीता प्रधानपुरुषात्मिका ॥ १२।७५॥ पुराणी चिन्मयी पुंसामादिः पुरुषरूपिणी
    । भूतान्तरात्मा कूटस्था महापुरुषसंज्ञिता ॥ १२।७६॥ जन्ममृत्युजरातीता सर्वशक्तिसमन्विता । व्यापिनी चानवच्छिन्ना
    प्रधानानुप्रवेशिनी ॥ १२।७७॥ क्षेत्रज्ञशक्तिरव्यक्तलक्षणा मलवर्जिता । अनादिमायासंभिन्ना त्रितत्त्वा
    प्रकृतिग्रहा ॥ १२।७८॥ महामायासमुत्पन्ना तामसी पौरुषी ध्रुवा । व्यक्ताव्यक्तात्मिका कृष्णा रक्ता शुक्ला
    प्रसूतिका ॥ १२।७९॥ अकार्या कार्यजननी नित्यं प्रसवधर्मिणी । सर्गप्रलयनिर्मुक्ता सृष्टिस्थित्यन्तधर्मिणी
    ॥ १२।८०॥ ब्रह्मगर्भा चतुर्विशा पद्मनाभाऽच्युतात्मिका । वैद्युती शाश्वती योनिर्जगन्मातेश्वरप्रिया ॥
    १२।८१॥ सर्वाधारा महारूपा सर्वैश्वर्यसमन्विता । विश्वरूपा महागर्भा विश्वेशेच्छानुवर्तिनी ॥ १२।८२॥ महीयसी
    ब्रह्मयोनिः महालक्ष्मीसमुद्भवा महाविमानमध्यस्था महानिद्रात्महेतुका ॥ १२।८३॥ सर्वसाधारणी सूक्ष्मा ह्यविद्या
    पारमार्थिका । अनन्तरूपाऽनन्तस्था देवी पुरुषमोहिनी ॥ १२।८४॥ अनेकाकारसंस्थाना कालत्रयविवर्जिता । ब्रह्मजन्मा
    हरेर्मूर्तिर्ब्रह्मविष्णुशिवात्मिका ॥ १२।८५॥ ब्रह्मेशविष्णुजननी ब्रह्माख्या ब्रह्मसंश्रया । व्यक्ता
    प्रथमजा ब्राह्मी महती ज्ञानरूपिणी ॥ १२।८६॥ वैराग्यैश्वर्यधर्मात्मा ब्रह्ममूर्तिर्हृदिस्थिता । अपांयोनिः
    स्वयंभूतिर्मानसी तत्त्वसंभवा ॥ १२।८७॥ ईश्वराणी च शर्वाणी शंकरार्द्धशरीरिणी । भवानी चैव रुद्राणी महालक्ष्मीरथाम्बिका
    ॥ १२।८८॥ महेश्वरसमुत्पन्ना भुक्तिमुक्तिफलप्रदा । सर्वेश्वरी सर्ववन्द्या नित्यं मुदितमानसा ॥ १२।८९॥
    ब्रह्मेन्द्रोपेन्द्रनमिता शंकरेच्छानुवर्तिनी । ईश्वरार्द्धासनगता महेश्वरपतिव्रता ॥ १२।९०॥ सकृद्विभाता
    सर्वार्ति समुद्रपरिशोषिणी । पार्वती हिमवत्पुत्री परमानन्ददायिनी ॥ १२।९१॥ गुणाढ्या योगजा योग्या ज्ञानमूर्तिर्विकासिनी
    । सावित्रीकमला लक्ष्मीः श्रीरनन्तोरसि स्थिता ॥ १२।९२॥ सरोजनिलया मुद्रा योगनिद्रा सुरार्दिनी । सरस्वती
    सर्वविद्या जगज्ज्येष्ठा सुमङ्गला ॥ १२।९३॥ वाग्देवी वरदा वाच्या कीर्तिः सर्वार्थसाधिका । योगीश्वरी
    ब्रह्मविद्या महाविद्या सुशोभना ॥ १२।९४॥ गुह्यविद्यात्मविद्या च धर्मविद्यात्मभाविता । स्वाहा विश्वंभरा
    सिद्धिः स्वधा मेधा धृतिः श्रुतिः ॥ १२।९५॥ नीतिः सुनीतिः सुकृतिर्माधवी नरवाहिनी । पूज्या विभावरी सौम्या
    भोगिनी भोगशायिनी ॥ १२।९६॥ शोभा वंशकरी लोला मालिनी परमेष्ठिनी । त्रैलोक्यसुन्दरी रम्या सुन्दरी कामचारिणी
    ॥ १२।९७॥ महानुभावा सत्त्वस्था महामहिषमर्दिनी । पद्ममाला पापहरा विचित्रा मुकुटानना ॥ १२।९८॥ कान्ता
    चित्राम्बरधरा दिव्याबरणभूषिता । हंसाख्या व्योमनिलया जगत्सृष्टिविवर्द्धिनी ॥ १२।९९॥ निर्यन्त्रा यन्त्रवाहस्था
    नन्दिनी भद्रकालिका । आदित्यवर्णा कौमारी मयूरवरवाहना ॥ १२।१००॥ वृषासनगता गौरी महाकाली सुरार्चिता ।
    अदितिर्नियता रौद्रा पद्मगर्भा विवाहना ॥ १२।१०१॥ विरूपाक्षी लेलिहाना महापुरनिवासिनी । महाफलाऽनवद्याङ्गी
    कामरुपा विभावरी ॥ १२।१०२॥ विचित्ररत्नमुकुटा प्रणतार्तिप्रभञ्जनी । कौशिकी कर्षणी रात्रिस्त्रिदशार्तिविनाशिनी
    ॥ १२।१०३॥ बहुरूपा स्वरूपा च विरूपा रूपवर्जिता । भक्तार्तिशमनी भव्या भवभारविनाशनी ॥ १२।१०४॥ निर्गुणा
    नित्यविभवा निःसारा निरपत्रपा । यशस्विनी सामगीतिर्भवाङ्गनिलयालया ॥ १२।१०५॥ दीक्षा विद्याधरी दीप्ता
    महेन्द्रविनिपातिनी । सर्वातिशायिनी विश्वा सर्वसिद्धिप्रदायिनी ॥ १२।१०६॥ सर्वेश्वरप्रिया भार्या समुद्रान्तरवासिनी
    । अकलङ्का निराधारा नित्यसिद्धा निरामया ॥ १२।१०७॥ कामधेनुर्बृहद्गर्भा धीमती मोहनाशिनी । निःसङ्कल्पा
    निरातङ्का विनया विनयप्रिया ॥ १२।१०८॥ ज्वालामालासहस्राढ्या देवदेवी मनोमयी । महाभगवती भर्गा वासुदेवसमुद्भवा
    ॥ १२।१०९॥ महेन्द्रोपेन्द्रभगिनी भक्तिगम्या परावरा । ज्ञानज्ञेया जरातीता वेदान्तविषया गतिः ॥ १२।११०॥
    दक्षिणा दहना माया सर्वभूतनमस्कृता । योगमाया विभागज्ञा महामोहा महीयसी ॥ १२।१११॥ संध्या सर्वसमुद्भूतिर्ब्रह्मवृक्षाश्रयानतिः
    । बीजाङ्कुरसमुद्भूतिर्महाशक्तिर्महामतिः ॥ १२।११२॥ ख्यातिः प्रज्ञा चितिः संच्चिन्महाभोगीन्द्रशायिनी
    । विकृतिः शांसरी शास्तिर्गणगन्धर्वसेविता ॥ १२।११३॥ वैश्वानरी महाशाला देवसेना गुहप्रिया । महारात्रिः
    शिवामन्दा शची दुःस्वप्ननाशिनी ॥ १२।११४॥ इज्या पूज्या जगद्धात्री दुर्विज्ञेया सुरूपिणी । तपस्विनी समाधिस्था
    त्रिनेत्रा दिवि संस्थिता ॥ १२।११५॥ गुहाम्बिका गुणोत्पत्तिर्महापीठा मरुत्सुता । हव्यवाहान्तरागादिः
    हव्यवाहसमुद्भवा ॥ १२।११६॥ जगद्योनिर्जगन्माता जन्ममृत्युजरातिगा । बुद्धिमाता बुद्धिमती पुरुषान्तरवासिनी
    ॥ १२।११७॥ तरस्विनी समाधिस्था त्रिनेत्रा दिविसंस्थिता । सर्वेन्द्रियमनोमाता सर्वभूतहृदि स्थिता ॥ १२।११८॥
    संसारतारिणी विद्या ब्रह्मवादिमनोलया । ब्रह्माणी बृहती ब्राह्मी ब्रह्मभूता भवारणी ॥ १२।११९॥ हिरण्मयी
    महारात्रिः संसारपरिवर्त्तिका । सुमालिनी सुरूपा च भाविनी तारिणी प्रभा ॥ १२।१२०॥ उन्मीलनी सर्वसहा सर्वप्रत्ययसाक्षिणी
    । सुसौम्या चन्द्रवदना ताण्डवासक्तमानसा ॥ १२।१२१॥ सत्त्वशुद्धिकरी शुद्धिर्मलत्रयविनाशिनी । जगत्प्रिया
    जगन्मूर्तिस्त्रिमूर्तिरमृताश् ॥ १२।१२२॥ निराश्रया निराहारा निरङ्कुरवनोद्भवा । चन्द्रहस्ता विचित्राङ्गी
    स्रग्विणी पद्मधारिणी ॥ १२।१२३॥ परावरविधानज्ञा महापुरुषपूर्वजा । विद्येश्वरप्रिया विद्या विद्युज्जिह्वा
    जितश्रमा ॥ १२।१२४॥ विद्यामयी सहस्राक्षी सहस्रवदनात्मजा । सहस्ररश्मिः सत्त्वस्था महेश्वरपदाश्रया ॥
    १२।१२५॥ क्षालिनी सन्मयी व्याप्ता तैजसी पद्मबोधिका । महामायाश्रया मान्या महादेवमनोरमा ॥ १२।१२६॥ व्योमलक्ष्मीः
    सिहरथा चेकितानामितप्रभा । वीरेश्वरी विमानस्था विशोकाशोकनाशिनी ॥ १२।१२७॥ अनाहता कुण्डलिनी नलिनी पद्मवासिनी
    । सदानन्दा सदाकीर्तिः सर्वभूताश्रयस्थिता ॥ १२।१२८॥ वाग्देवता ब्रह्मकला कलातीता कलारणी । ब्रह्मश्रीर्ब्रह्महृदया
    ब्रह्मविष्णुशिवप्रिया ॥ १२।१२९॥ व्योमशक्तिः क्रियाशक्तिर्ज्ञानशक्तिः परागतिः । क्षोभिका बन्धिका भेद्या
    भेदाभेदविवर्जिता ॥ १२।१३०॥ अभिन्नाभिन्नसंस्थाना वंशिनी वंशहारिणी । गुह्यशक्तिर्गुणातीता सर्वदा सर्वतोमुखी
    ॥ १२।१३१॥ भगिनी भगवत्पत्नी सकला कालकारिणी । सर्ववित् सर्वतोभद्रा गुह्यातीता गुहावलिः ॥ १२।१३२॥ प्रक्रिया
    योगमाता च गङ्गा विश्वेश्वरेश्वरी । कपिला कापिला कान्ताकनकाभाकलान्तरा ॥ १२।१३३॥ पुण्या पुष्करिणी भोक्त्री
    पुरंदरपुरस्सरा । पोषणी परमैश्वर्यभूतिदा भूतिभूषणा ॥ १२।१३४॥ पञ्चब्रह्मसमुत्पत्तिः परमार्थार्थविग्रहा
    । धर्मोदया भानुमती योगिज्ञेय मनोजवा ॥ १२।१३५॥ मनोहरा मनोरस्था तापसी वेदरूपिणी । वेदशक्तिर्वेदमाता
    वेदविद्याप्रकाशिनी ॥ १२।१३६॥ योगेश्वरेश्वरी माता महाशक्तिर्मनोमयी । विश्वावस्था वियन्मूर्त्तिर्विद्युन्माला
    विहायसी ॥ १२।१३७॥ किंनरी सुरभिर्वन्द्या नन्दिनी नन्दिवल्लभा । भारती परमानन्दा परापरविभेदिका ॥ १२।१३८॥
    सर्वप्रहरणोपेता काम्या कामेश्वरेश्वरी । अचिन्त्याऽचिन्त्यविभवा हृल्लेखा कनकप्रभा १२।१३९॥ कूष्माण्डी
    धनरत्नाढ्या सुगन्धा गन्धायिनी । त्रिविक्रमपदोद्भूता धनुष्पाणिः शिवोदया ॥ १२।१४०॥ सुदुर्लभा धनाद्यक्षा
    धन्या पिङ्गललोचना । शान्तिः प्रभावती दीप्तिः पङ्कजायतलोचना ॥ १२।१४१॥ आद्या हृत्कमलोद्भूता गवां मता
    रणप्रिया । सत्क्रिया गिरिजा शुदिर्नित्यपुष्टा निरन्तरा ॥ १२।१४२॥ दुर्गाकात्यायनीचण्डी चर्चिका शान्तविग्रहा
    । हिरण्यवर्णा रजनी जगद्यन्त्रप्रवर्तिका ॥ १२।१४३॥ मन्दराद्रिनिवासा च शारदा स्वर्णमालिनी । रत्नमाला
    रत्नगर्भा पृथ्वी विश्वप्रमाथिनी ॥ १२।१४४॥ पद्मानना पद्मनिभा नित्यतुष्टाऽमृतोद्भवा । धुन्वती दुःप्रकम्पा
    च सूर्यमाता दृषद्वती ॥ १२।१४५॥ महेन्द्रभगिनी मान्या वरेण्या वरदयिका । कल्याणी कमलावासा पञ्चचूडा वरप्रदा
    ॥ १२।१४६॥ वाच्या वरेश्वरी वन्द्या दुर्जया दुरतिक्रमा । कालरात्रिर्महावेगा वीरभद्रप्रिया हिता ॥ १२।१४७॥
    भद्रकाली जगन्माता भक्तानां भद्रदायिनी । कराला पिङ्गलाकारा कामभेदाऽमहामदा ॥ १२।१४८॥ यशस्विनी यशोदा
    च षडध्वपरिवर्त्तिका । शङ्खिनी पद्मिनी सांख्या सांख्ययोगप्रवर्तिका ॥ १२।१४९॥ चैत्रा संवत्सरारूढा जगत्सम्पूरणीध्वजा
    । शुम्भारिः खेचरीस्वस्था कम्बुग्रीवाकलिप्रिया ॥ १२।१५०॥ खगध्वजा खगारूढा परार्या परमालिनी । ऐश्वर्यपद्मनिलया
    विरक्ता गरुडासना ॥ १२।१५१॥ जयन्ती हृद्गुहा गम्या गह्वरेष्ठा गणाग्रणीः । संकल्पसिद्धा साम्यस्था सर्वविज्ञानदायिनी
    ॥ १२।१५२॥ कलिकल्पविहन्त्री च गुह्योपनिषदुत्तमा । निष्ठा दृष्टिः स्मृतिर्व्याप्तिः पुष्टिस्तुष्टिः
    क्रियावती ॥ १२।१५३॥ विश्वामरेश्वरेशाना भुक्तिर्मुक्तिः शिवाऽमृता । लोहिता सर्पमाला च भीषणी वनमालिनी
    ॥ १२।१५४॥ अनन्तशयनाऽनन्ता नरनारायणोद्भवा । नृसिंही दैत्यमथनी शङ्खचक्रगदाधरा ॥ १२।१५५॥ संकर्षणसमुत्पत्तिरम्बिकापादसंश्रया
    । महाज्वाला महामूर्त्तिः सुमूर्त्तिः सर्वकामधुक् ॥ १२।१५६॥ सुप्रभा सुस्तना सौरी धर्मकामार्थमोक्षदा
    । भ्रूमध्यनिलया पूर्वा पुराणपुरुषारणिः ॥ १२।१५७॥ महाविभूतिदा मध्या सरोजनयना समा । अष्टादशभुजानाद्या
    नीलोत्पलदलप्रभ१२।१५८॥ सर्वशक्त्यासनारूढा सर्वधर्मार्थवर्जिता । वैराग्यज्ञाननिरता निरालोका निरिन्द्रिया
    ॥ १२।१५९॥ विचित्रगहनाधारा शाश्वतस्थानवासिनी । स्थानेश्वरी निरानन्दा त्रिशूलवरधारिणी ॥ १२।१६०॥ अशेषदेवतामूर्त्तिर्देवता
    वरदेवता । गणाम्बिका गिरेः पुत्री निशुम्भविनिपातिनी ॥ १२।१६१॥ अवर्णा वर्णरहिता त्रिवर्णा जीवसंभवा ।
    अनन्तवर्णाऽनन्यस्था शंकरी शान्तमानसा ॥ १२।१६२॥ अगोत्रा गोमती गोप्त्री गुह्यरूपा गुणोत्तरा । गौर्गीर्गव्यप्रिया
    गौणी गणेश्वरनमस्कृता ॥ १२।१६३॥ सत्यमाता सत्यसंधा त्रिसंध्या संधिवर्जिता । सर्ववादाश्रया सांख्या सांख्ययोगसमुद्भवा
    ॥ १२।१६४॥ असंख्येयाऽप्रमेयाख्या शून्या शुद्धकुलोद्भवा । बिन्दुनादसमुत्पत्तिः शंभुवामा शशिप्रभा ॥ १२।१६५॥
    पिषङ्गा भेदरहिता मनोज्ञा मधुसूदनी । महाश्रीः श्रीसमुत्पत्तिस्तमःपारे प्रतिष्ठिता ॥ १२।१६६॥ त्रितत्त्वमाता
    त्रिविधा सुसूक्ष्मपदसंश्रया । शन्ता भीता मलातीता निर्विकारा निराश्रया ॥ १२।१६७॥ शिवाख्या चित्तनिलया
    शिवज्ञानस्वरूपिणी । दैत्यदानवनिर्मात्री काश्यपी कालकर्णिका ॥ १२।१६८॥ शास्त्रयोनिः क्रियामूर्तिश्चतुर्वर्गप्रदर्शिका
    । नारायणी नरोद्भूतिः कौमुदी लिङ्गधारिणी ॥ १२।१६९॥ कामुकी ललिताभावा परापरविभूतिदा । परान्तजातमहिमा
    बडवा वामलोचना ॥ १२।१७०॥ सुभद्रा देवकी सीता वेदवेदाङ्गपारगा । मनस्विनी मन्युमाता महामन्युसमुद्भवा ॥
    १२।१७१॥ अमृत्युरमृतास्वादा पुरुहूता पुरुष्टुता । अशोच्या भिन्नविषया हिरण्यरजतप्रिया ॥ १२।१७२॥ हिरण्या
    राजती हैमा हेमाभरणभूषिता । विभ्राजमाना दुर्ज्ञेया ज्योतिष्टोमफलप्रदा ॥ १२।१७३॥ महानिद्रासमुद्भूतिरनिद्रा
    सत्यदेवता । दीर्घाककुद्मिनी हृद्या शान्तिदा शान्तिवर्द्धिनी ॥ १२।१७४॥ लक्ष्म्यादिशक्तिजननी शक्तिचक्रप्रवर्तिका
    । त्रिशक्तिजननी जन्या षडूर्मिपरिवर्जिता ॥ १२।१७५॥ सुधामा कर्मकरणी युगान्तदहनात्मिका । संकर्षणी जगद्धात्री
    कामयोनिः किरीटिनी ॥ १२।१७६॥ ऐन्द्री त्रैलोक्यनमिता वैष्णवी परमेश्वरी । प्रद्युम्नदयिता दात्री युग्मदृष्टिस्त्रिलोचना
    ॥ १२।१७७॥ मदोत्कटा हंसगतिः प्रचण्डा चण्डविक्रमा । वृषावेशा वियन्माता विन्ध्यपर्वतवासिनी ॥ १२।१७८॥
    हिमवन्मेरुनिलया कैलासगिरिवासिनी । चाणूरहन्तृतनया नीतिज्ञा कामरूपिणी ॥ १२।१७९॥ वेदविद्याव्रतस्नाता
    धर्मशीलाऽनिलाशना । वीरभद्रप्रिया वीरा महाकामसमुद्भवा ॥ १२।१८०॥ विद्याधरप्रिया सिद्धा विद्याधरनिराकृतिः
    । आप्यायनी हरन्ती च पावनी पोषणी कला ॥ १२।१८१॥ मातृका मन्मथोद्भूता वारिजा वाहनप्रिया । करीषिणी सुधावाणी
    वीणावादनतत्परा ॥ १२।१८२॥ सेविता सेविका सेव्या सिनीवाली गरुत्मती । अरुन्धती हिरण्याक्षी मृगांका मानदायिनी
    ॥ १२।१८३॥ वसुप्रदा वसुमती वसोर्द्धारा वसुंधरा । धाराधरा वरारोहा वरावरसहस्रदा ॥ १२।१८४॥ श्रीफला श्रीमती
    श्रीशा श्रीनिवासा शिवप्रिया । श्रीधरा श्रीकरी कल्या श्रीधरार्द्धशरीरिणी ॥ १२।१८५॥ अनन्तदृष्टिरक्षुद्रा
    धात्रीशा धनदप्रिया । निहन्त्री दैत्यसङ्घानां सिहिका सिहवाहना ॥ १२।१८६॥ सुषेणा चन्द्रनिलया सुकीर्तिश्छिन्नसंशया
    । रसज्ञा रसदा रामा लेलिहानामृतस्रवा ॥ १२।१८७॥ नित्योदिता स्वयंज्योतिरुत्सुका मृतजीवना । वज्रदण्डा
    वज्रजिह्वा वैदेही वज्रविग्रहा ॥ १२।१८८॥ मङ्गल्या मङ्गला माला मलिना मलहारिणी । गान्धर्वी गारुडी चान्द्री
    कम्बलाश्वतरप्रिया ॥ १२।१८९॥ सौदामिनी जनानन्दा भ्रुकुटीकुटिलानना । कर्णिकारकरा कक्ष्या कंसप्राणापहारिणी
    ॥ १२।१९०॥ युगंधरा युगावर्त्ता त्रिसंध्या हर्षवर्द्धनी । प्रत्यक्षदेवता दिव्या दिव्यगन्धा दिवा परा
    ॥ १२।१९१॥ शक्रासनगता शाक्री सान्ध्या चारुशरासना । इष्टा विशिष्टा शिष्टेष्टा शिष्टाशिष्टप्रपूजिता ॥
    १२।१९२॥ शतरूपा शतावर्त्ता विनता सुरभिः सुरा । सुरेन्द्रमाता सुद्युम्ना सुषुम्ना सूर्यसंस्थिता ॥ १२।१९३॥
    समीक्ष्या सत्प्रतिष्ठा च निवृत्तिर्ज्ञानपारगा । धर्मशास्त्रार्थकुशला धर्मज्ञा धर्मवाहना ॥ १२।१९४॥
    धर्माधर्मविनिर्मात्री धार्मिकाणां शिवप्रदा । धर्मशक्तिर्धर्ममयी विधर्मा विश्वधर्मिणी ॥ १२।१९५॥ धर्मान्तरा
    धर्ममयी धर्मपूर्वा धनावहा । धर्मोपदेष्ट्री धर्मत्मा धर्मगम्या धराधरा ॥ १२।१९६॥ कापाली शकला मूर्त्तिः
    कला कलितविग्रहा । सर्वशक्तिविनिर्मुक्ता सर्वशक्त्याश्रयाश्रया ॥ १२।१९७॥ सर्वा सर्वेश्वरी सूक्ष्मा
    सूक्ष्माज्ञानस्वरूपिणी । प्रधानपुरुषेशेषा महादेवैकसाक्षिणी ॥ १२।१९८॥ सदाशिवा वियन्मूर्त्तिर्विश्वमूर्त्तिरमूर्त्तिका
    । एवं नाम्नां सहस्रेण स्तुत्वाऽसौ हिमवान् गिरिः ॥ १२।१९९॥ भूयः प्रणम्य भीतात्मा प्रोवाचेदं कृताञ्जलिः
    । यदेतदैश्वरं रूपं घोरं ते परमेश्वरि ॥ १२।२००॥ भीतोऽस्मि साम्प्रतं दृष्ट्वा रूपमन्यत् प्रदर्शय । एवमुक्ताऽथ
    सा देवी तेन शैलेन पार्वती ॥ १२।२०१॥ संहृत्य दर्शयामास स्वरूपमपरं पुनः । नीलोत्पलदलप्रख्यं नीलोत्पलसुगन्धिकम्
    ॥ १२।२०२॥ द्विनेत्रं द्विभुजं सौम्यं नीलालकविभूषितम् । रक्तपादाम्बुजतलं सुरक्तकरपल्लवम् ॥ १२।२०३॥
    श्रीमद्विशालसंवृत्तंललाटतिलकोज्ज्वलम् । भूषितं चारुसर्वाङ्गं भूषणैरतिकोमलम् ॥ १२।२०४॥ दधानमुरसा मालां
    विशालां हेमनिर्मिताम् । ईषत्स्मितं सुबिम्बोष्ठं नूपुरारावसंयुतम् ॥ १२।२०५॥ प्रसन्नवदनं दिव्यमनन्तमहिमास्पदम्
    । तदीदृशं समालोक्य स्वरूपं शैलसत्तमः ॥ १२।२०६॥ भीतिं संत्यज्य हृष्टात्मा बभाषे परमेश्वरीम् । हिमवानुवाच
    अद्य मे सफलं जन्म अद्य मे सफलं तपः ॥ १२।२०७॥ यन्मे साक्षात्त्वमव्यक्ता प्रसन्ना दृष्टिगोचरा । त्वया
    सृष्टं जगत् सर्वं प्रधानाद्यं त्वयि स्थितम् ॥ १२।२०८॥ त्वय्येव लीयते देवि त्वमेव च परा गतिः । वदन्ति
    केचित् त्वामेव प्रकृतिं प्रकृतेः पराम् ॥ १२।२०९॥ अपरे परमार्थज्ञाः शिवेति शिवसंश्रयात् । त्वयि प्रधानं
    पुरुषो महान् ब्रह्मा तथेश्वरः ॥ १२।२१०॥ अविद्या नियतिर्माया कलाद्याः शतशोऽभवन् । त्वं हि सा परमा शक्तिरनन्ता
    परमेष्ठिनी ॥ १२।२११॥ सर्वभेदविनिर्मुक्ता सर्वेभेदाश्रयाश्रया । त्वामधिष्ठाय योगेशि महादेवो महेश्वरः
    ॥ १२।२१२॥ प्रधानाद्यं जगत् कृत्स्नं करोति विकरोति च । त्वयैव संगतो देवः स्वमानन्दं समश्नुते ॥ १२।२१३॥
    त्वमेव परमानन्दस्त्वमेवानन्ददायिनी । त्वमक्षरं परं व्योम महज्ज्योतिर्निरञ्जनम् ॥ १२।२१४॥ शिवं सर्वगतं
    सूक्ष्मं परं ब्रह्म सनातनम् । त्वं शक्रः सर्वदेवानां ब्रह्मा ब्रह्मविदामसि ॥ १२।२१५॥ वायुर्बलवतां
    देवि योगिनां त्वं कुमारकः । ऋषीणां च वसिष्ठस्त्वं व्यासो वेदविदामसि ॥ १२।२१६॥ सांख्यानां कपिलो देवो
    रुद्राणामसि शंकरः । आदित्यानामुपेन्द्रस्त्वं वसूनां चैव पावकः ॥ १२।२१७॥ वेदानां सामवेदस्त्वं गायत्री
    छन्दसामसि । अध्यात्मविद्या विद्यानां गतीनां परमा गतिः ॥ १२।२१८॥ माया त्वं सर्वशक्तीनां कालः कलयतामसि
    । ओङ्कारः सर्वगुह्यानां वर्णानां च द्विजात्तमः ॥ १२।२१९॥ आश्रमाणां च गार्हस्थ्यमीश्वराणां महेश्वरः
    । पुंसां त्वमेकः पुरुषः सर्वभूतहृदि स्थितः ॥ १२।२२०॥ सर्वोपनिषदां देवि गुह्योपनिषदुच्यते । ईशानश्चासि
    कल्पानां युगानां कृतमेव च ॥ १२।२२१॥ आदित्यः सर्वमार्गाणां वाचां देवि सरस्वती । त्वं लक्ष्मीश्चारुरूपाणां
    विष्णुर्मायाविनामसि ॥ १२।२२२॥ अरुन्धती सतीनां त्वं सुपर्णः पततामसि । सूक्तानां पौरुषं सूक्तं साम ज्येष्टं
    च सामसु ॥ १२।२२३॥ सावित्री चासि जाप्यानां यजुषां शतरुद्रियम् । पर्वतानां महामेरुरनन्तो भोगिनामसि ॥
    १२।२२४॥ सर्वेषां त्वं परं ब्रह्म त्वन्मयं सर्वमेव हि ॥ १२।२२५॥ रूपं तवाशेषकलाविहीन
