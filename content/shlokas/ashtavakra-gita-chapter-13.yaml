id: ashtavakra-gita-chapter-13
category: stotram
name:
  english: Ashtavakra Gita Chapter 13
content:
  english: janaka uvaca || akincanabhavam svasthyam kaupinatve'pi durlabham | tyagadane vihayasmadahamase
    yathasukham || || kutrapi khedah kayasya jihva kutrapi khidyate | manah kutrapi tattyaktva purusharthe
    sthitah sukham || || kritam kimapi naiva syad iti sancintya tattvatah | yada yatkartumayati tat kritvase
    yathasukham || || karmanaishkarmyanirbandhabhava dehasthayoginah | samyogayogavirahadahamase yathasukham
    || || arthanarthau na me sthitya gatya na shayanena va | tishthan gacchan svapan tasmadahamase yathasukham
    || || svapato nasti me hanih siddhiryatnavato na va | nashollasau vihayasmadahamase yathasukham ||
    || sukhadirupa niyamam bhaveshvalokya bhurishah | shubhashubhe vihayasmadahamase yathasukham ||
  devanagari: जनक उवाच ॥ अकिञ्चनभवं स्वास्थ्यं कौपीनत्वेऽपि दुर्लभम् । त्यागादाने विहायास्मादहमासे यथासुखम्
    ॥ ॥ कुत्रापि खेदः कायस्य जिह्वा कुत्रापि खिद्यते । मनः कुत्रापि तत्त्यक्त्वा पुरुषार्थे स्थितः सुखम्
    ॥ ॥ कृतं किमपि नैव स्याद् इति सञ्चिन्त्य तत्त्वतः । यदा यत्कर्तुमायाति तत् कृत्वासे यथासुखम् ॥ ॥ कर्मनैष्कर्म्यनिर्बन्धभावा
    देहस्थयोगिनः । संयोगायोगविरहादहमासे यथासुखम् ॥ ॥ अर्थानर्थौ न मे स्थित्या गत्या न शयनेन वा । तिष्ठन्
    गच्छन् स्वपन् तस्मादहमासे यथासुखम् ॥ ॥ स्वपतो नास्ति मे हानिः सिद्धिर्यत्नवतो न वा । नाशोल्लासौ विहायास्मादहमासे
    यथासुखम् ॥ ॥ सुखादिरूपा नियमं भावेष्वालोक्य भूरिशः । शुभाशुभे विहायास्मादहमासे यथासुखम् ॥
