id: vishvamitraproktamskandashtottarashatanamastotram
category: stotram
name:
  english: vishvamitraproktamskandashtottarashatanamastotram
  devanagari: विश्वामित्रप्रोक्तंस्कन्दाष्टोत्तरशतनामस्तोत्रम्
content:
  english: rinu tvam tani phalguna | japena yesham papani yanti jnanamavapnuyat || 124|| om tvam brahmavadi
    tvam brahma brahmanavatsalah | brahmanyo brahmadevashca brahmado brahmasangrahah || 125|| tvam param
    paramam tejo mangalanam ca mangalam | aprameyagunashcaiva mantranam mantrago bhavan || 126|| tvam
    savitrimayo deva sarvatraivaparajitah | mantra sharvatmako devah shadaksharavatam varah || 127|| mali
    mauli pataki ca jati mundi shikhandyapi | kundali langali balah kumarah pravaro varah || 128|| gavamputrah
    surarighnah sambhavo bhavabhavanah | pinaki shatruha shveto gudhah skandah karagranih || 129|| dvadasho
    bhurbhuvo bhavi bhuvah putro namaskritah | nagarajah sudharmatma nakaprishthah sanatanah || 130||
    tvam bharta sarvabhutatma tvam trata tvam sukhavahah | sharadakshah shikhi jeta shadvaktro bhayanashanah
    || 131|| hemagarbho mahagarbho jayashca vijayeshvarah | tvam karta tvam vidhata ca nityo nityarimardanah
    || 132|| mahaseno mahateja virasenashca bhupatih | siddhasanah suradhyaksho bhimaseno niramayah ||
    133|| shauriryadurmahateja viryavansatyavikramah | tejogarbho'suraripuh suramurtih surorjjitah ||
    134|| kritajno varadah satyah sharanyah sadhuvatsalah | suvratah suryasankasho vahnigarbhah kano bhuvah
    || 135|| pippali shighrago raudri gangeyo ripudaranah | karttikeyah prabhuh kshanta niladamshtro mahamanah
    || 136|| nigraho nigrahanam ca neta tvam suranandanah | pragrahah paramanandah krodhaghnastara ucchritah
    || 137|| kukkuti bahuli divyah kamado bhurivardhanah | amogho'mritado hyagnih shatrughnah sarvamodanah
    || 138|| avyayo hyamarah shrimanunnato hyagnisambhavah | pishacarajah suryabhah shivatma shivanandanah
    || 139|| aparaparo durjneyah sarvabhutahite ratah | agrahyah karanam karta parameshthi param padam
    || 140|| acintyah sarvabhutatma sarvatma tvam sanatanah | evam sa sarvabhutanam samstutah parameshvarah
    || 141|| namnamashtashatenayam vishvamitramaharshina | prasannamurtirahedam munindram vriyatamiti
    || 142|| mama tvaya dvijashreshtha stutiresha nirupita | bhavishyati mano'bhishtapraptaye praninam
    bhuvi || 143|| vivardhate kule lakshmistasya yah prapathedimam | na rakshasah pishaca va na bhutani
    na capadah || 144|| vighnakarini tadgehe yatraiva samstuvanti mam | duhsvapnam ca na pashyetsa baddho
    mucyate bandhanat || 145|| stavasyasya prabhavena divyabhavah pumanbhavet || iti shriskandapurane
    maheshvarakhande
  devanagari: ृणु त्वं तानि फाल्गुन । जपेन येषां पापानि यान्ति ज्ञानमवाप्नुयात् ॥ १२४॥ ॐ त्वं ब्रह्मवादी
    त्वं ब्रह्मा ब्राह्मणवत्सलः । ब्रह्मण्यो ब्रह्मदेवश्च ब्रह्मदो ब्रह्मसङ्ग्रहः ॥ १२५॥ त्वं परं परमं
    तेजो मङ्गलानां च मङ्गलम् । अप्रमेयगुणश्चैव मन्त्राणां मन्त्रगो भवान् ॥ १२६॥ त्वं सावित्रीमयो देव सर्वत्रैवापराजितः
    । मन्त्र शर्वात्मको देवः षडक्षरवतां वरः ॥ १२७॥ माली मौली पताकी च जटी मुण्डी शिखण्ड्यपि । कुण्डली लाङ्गली
    बालः कुमारः प्रवरो वरः ॥ १२८॥ गवाम्पुत्रः सुरारिघ्नः सम्भवो भवभावनः । पिनाकी शत्रुहा श्वेतो गूढः स्कन्दः
    कराग्रणीः ॥ १२९॥ द्वादशो भूर्भुवो भावी भुवः पुत्रो नमस्कृतः । नागराजः सुधर्मात्मा नाकपृष्ठः सनातनः
    ॥ १३०॥ त्वं भर्ता सर्वभूतात्मा त्वं त्राता त्वं सुखावहः । शरदक्षः शिखी जेता षड्वक्त्रो भयनाशनः ॥ १३१॥
    हेमगर्भो महागर्भो जयश्च विजयेश्वरः । त्वं कर्ता त्वं विधाता च नित्यो नित्यारिमर्दनः ॥ १३२॥ महासेनो
    महातेज वीरसेनश्च भूपतिः । सिद्धासनः सुराध्यक्षो भीमसेनो निरामयः ॥ १३३॥ शौरिर्यदुर्महातेजा वीर्यवान्सत्यविक्रमः
    । तेजोगर्भोऽसुररिपुः सुरमूर्तिः सुरोर्ज्जितः ॥ १३४॥ कृतज्ञो वरदः सत्यः शरण्यः साधुवत्सलः । सुव्रतः
    सूर्यसङ्काशो वह्निगर्भः कणो भुवः ॥ १३५॥ पिप्पली शीघ्रगो रौद्री गाङ्गेयो रिपुदारणः । कार्त्तिकेयः प्रभुः
    क्षन्ता नीलदंष्ट्रो महामनाः ॥ १३६॥ निग्रहो निग्रहाणां च नेता त्वं सुरनन्दनः । प्रग्रहः परमानन्दः क्रोधघ्नस्तार
    उच्छ्रितः ॥ १३७॥ कुक्कुटी बहुली दिव्यः कामदो भूरिवर्धनः । अमोघोऽमृतदो ह्यग्निः शत्रुघ्नः सर्वमोदनः
    ॥ १३८॥ अव्ययो ह्यमरः श्रीमानुन्नतो ह्यग्निसम्भवः । पिशाचराजः सूर्याभः शिवात्मा शिवनन्दनः ॥ १३९॥ अपारपारो
    दुर्ज्ञेयः सर्वभूतहिते रतः । अग्राह्यः कारणं कर्ता परमेष्ठी परं पदम् ॥ १४०॥ अचिन्त्यः सर्वभूतात्मा
    सर्वात्मा त्वं सनातनः । एवं स सर्वभूतानां संस्तुतः परमेश्वरः ॥ १४१॥ नाम्नामष्टशतेनायं विश्वामित्रमहर्षिणा
    । प्रसन्नमूर्तिराहेदं मुनीन्द्रं व्रियतामिति ॥ १४२॥ मम त्वया द्विजश्रेष्ठ स्तुतिरेषा निरूपिता । भविष्यति
    मनोऽभीष्टप्राप्तये प्राणिनां भुवि ॥ १४३॥ विवर्धते कुले लक्ष्मीस्तस्य यः प्रपठेदिमम् । न राक्षसाः पिशाचा
    वा न भूतानि न चापदः ॥ १४४॥ विघ्नकारीणि तद्गेहे यत्रैव संस्तुवन्ति माम् । दुःस्वप्नं च न पश्येत्स बद्धो
    मुच्यते बन्धनात् ॥ १४५॥ स्तवस्यास्य प्रभावेण दिव्यभावः पुमान्भवेत् ॥ इति श्रीस्कन्दपुराणे माहेश्वरखण्डे
