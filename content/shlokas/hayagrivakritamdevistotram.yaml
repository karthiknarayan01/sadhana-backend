id: hayagrivakritamdevistotram
category: stotram
name:
  english: hayagrivakritamdevistotram
  devanagari: हयग्रीवकृतंदेवीस्तोत्रम्
content:
  english: hayagrivakritam devistotram hayagriva uvaca | namo devyai mahamaye srishtisthityantakarini
    | bhaktanugrahacature kamade mokshade shive || 93|| dharambutejahpavanakhapancanam ca karanam | tvam
    gandharasarupanam karanam sparshashabdayoh || 94|| ghranam ca rasana cakshustvakshrotramindriyani
    ca | karmendriyani canyani tvattah sarvam maheshvari || 95|| iti devibhagavate prathamaskandhe pancamadhyayantargatam
    hayagrivakritam devistotram sampurnam | devibhagavatam | skandha 1| adhyaya 5
  devanagari: हयग्रीवकृतं देवीस्तोत्रम् हयग्रीव उवाच । नमो देव्यै महामाये सृष्टिस्थित्यन्तकारिणि । भक्तानुग्रहचतुरे
    कामदे मोक्षदे शिवे ॥ ९३॥ धराम्बुतेजःपवनखपञ्चानां च कारणम् । त्वं गन्धरसरूपाणां कारणं स्पर्शशब्दयोः
    ॥ ९४॥ घ्राणं च रसना चक्षुस्त्वक्श्रोत्रमिन्द्रियाणि च । कर्मेन्द्रियाणि चान्यानि त्वत्तः सर्वं महेश्वरि
    ॥ ९५॥ इति देवीभागवते प्रथमस्कन्धे पञ्चमाध्यायान्तर्गतं हयग्रीवकृतं देवीस्तोत्रं सम्पूर्णम् । देवीभागवतम्
    । स्कन्ध १। अध्याय ५
meaning: {}
