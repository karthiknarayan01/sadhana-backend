id: caturvimshatyavatarastotram-3
category: stotram
name:
  english: caturvimshatyavatarastotram 3
  devanagari: चतुर्विंशत्यवतारस्तोत्रम् ३
content:
  english: shricaturvimshatyavatarastotram 3 bhagavatapuranantargatam sargah 2 adhyayah 7 brahmovaca |
    yatrodyatah kshititaloddharanaya bibhrat kraudim tanum sakalayajnamayimanantah | antarmaharnava upagatamadidaityam
    tam damshtrayadrimiva vajradharo dadara || 1|| jato rucerajanayatsuyamansuyajna akutisunuramaranatha
    dakshinayam | lokatrayasya mahatimaharadyadartim svayambhuvena manuna harirityanuktah || 2|| jajne
    ca kardamagrihe dvija devahutyam stribhih samam navabhiratmagatim svamatre | uce yayatmashamalam gunasangapankam
    asminvidhuya kapilasya gatim prapede || 3|| atrerapatyamabhikankshata aha tushto datto mayahamiti
    yadbhagavansa dattah | yatpadapankajaparagapavitradeha yogarddhimapurubhayim yaduhaihayadyah || 4||
    taptam tapo vividhalokasisrikshaya me adau sanatsvatapasah sa catuhsano'bhut | prakkalpasamplavavinashtamihatmatattvam
    samyagjagada munayo yadacakshatatman || 5|| dharmasya dakshaduhitaryajanishta murtyam narayano nara
    iti svatapahprabhavah | drishtva''tmano bhagavato niyamavalopam devyastvanangapritana ghatitum na
    shekuh || 6|| kamam dahanti kritino nanu roshadrishtya rosham dahantamuta te na dahantyasahyam | so'yam
    yadantaramalam pravishanbibheti kamah katham nu punarasya manah shrayeta || 7|| viddhah sapatnyuditapatribhiranti
    rajno balo'pi sannupagatastapase vanani | tasma adaddhruvagatim grinate prasanno divyah stuvanti munayo
    yaduparyadhastat || 8|| yadvenamutpathagatam dvijavakyavajra
  devanagari: श्रीचतुर्विंशत्यवतारस्तोत्रम् ३ भागवतपुराणान्तर्गतम् सर्गः २ अध्यायः ७ ब्रह्मोवाच । यत्रोद्यतः
    क्षितितलोद्धरणाय बिभ्रत् क्रौडीं तनुं सकलयज्ञमयीमनन्तः । अन्तर्महार्णव उपागतमादिदैत्यं तं दंष्ट्रयाद्रिमिव
    वज्रधरो ददार ॥ १॥ जातो रुचेरजनयत्सुयमान्सुयज्ञ आकूतिसूनुरमरानथ दक्षिणायाम् । लोकत्रयस्य महतीमहरद्यदार्तिं
    स्वायम्भुवेन मनुना हरिरित्यनूक्तः ॥ २॥ जज्ञे च कर्दमगृहे द्विज देवहूत्यां स्त्रीभिः समं नवभिरात्मगतिं
    स्वमात्रे । ऊचे ययात्मशमलं गुणसङ्गपङ्कं अस्मिन्विधूय कपिलस्य गतिं प्रपेदे ॥ ३॥ अत्रेरपत्यमभिकाङ्क्षत
    आह तुष्टो दत्तो मयाहमिति यद्भगवान्स दत्तः । यत्पादपङ्कजपरागपवित्रदेहा योगर्द्धिमापुरुभयीं यदुहैहयाद्याः
    ॥ ४॥ तप्तं तपो विविधलोकसिसृक्षया मे आदौ सनात्स्वतपसः स चतुःसनोऽभूत् । प्राक्कल्पसम्प्लवविनष्टमिहात्मतत्त्वं
    सम्यग्जगाद मुनयो यदचक्षतात्मन् ॥ ५॥ धर्मस्य दक्षदुहितर्यजनिष्ट मूर्त्यां नारायणो नर इति स्वतपःप्रभावः
    । दृष्ट्वाऽऽत्मनो भगवतो नियमावलोपं देव्यस्त्वनङ्गपृतना घटितुं न शेकुः ॥ ६॥ कामं दहन्ति कृतिनो ननु
    रोषदृष्ट्या रोषं दहन्तमुत ते न दहन्त्यसह्यम् । सोऽयं यदन्तरमलं प्रविशन्बिभेति कामः कथं नु पुनरस्य
    मनः श्रयेत ॥ ७॥ विद्धः सपत्न्युदितपत्रिभिरन्ति राज्ञो बालोऽपि सन्नुपगतस्तपसे वनानि । तस्मा अदाद्ध्रुवगतिं
    गृणते प्रसन्नो दिव्याः स्तुवन्ति मुनयो यदुपर्यधस्तात् ॥ ८॥ यद्वेनमुत्पथगतं द्विजवाक्यवज्र
