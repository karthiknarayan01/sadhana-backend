id: yati-panchakam-kaupeena-panchakam
category: stotram
name:
  english: Yati Panchakam (Kaupeena Panchakam)
content:
  english: vedantavakyeshu sada ramantah bhikshannamatrena ca tushtimantah | vishokamantahkarane ramantah
    kaupinavantah khalu bhagyavantah || || mulam taroh kevalamashrayantah panidvayam bhoktumamantrayantah
    | shriyam ca kanthamiva kutsayantah kaupinavantah khalu bhagyavantah || || dehadibhavam parimarjayantah
    atmanamatmanyavalokayantah | nantam na madhyam na bahih smarantah kaupinavantah khalu bhagyavantah
    || || svanandabhave paritushtimantah samshantasarvendriyadrishtimantah | aharnisham brahmani ye ramantah
    kaupinavantah khalu bhagyavantah || || brahmaksharam pavanamuccarantah patim pashunam hridi bhavayantah
    | bhikshashana dikshu paribhramantah kaupinavantah khalu bhagyavantah || || kaupinapancaratnasya mananam
    yati yo narah | viraktim dharmavijnanam labhate natra samshayah || iti shri shankarabhagavatpada viracitam
    yatipancakam ||
  devanagari: वेदान्तवाक्येषु सदा रमन्तः भिक्षान्नमात्रेण च तुष्टिमन्तः । विशोकमन्तःकरणे रमन्तः कौपीनवन्तः
    खलु भाग्यवन्तः ॥ ॥ मूलं तरोः केवलमाश्रयन्तः पाणिद्वयं भोक्तुममन्त्रयन्तः । श्रियं च कन्थामिव कुत्सयन्तः
    कौपीनवन्तः खलु भाग्यवन्तः ॥ ॥ देहादिभावं परिमार्जयन्तः आत्मानमात्मन्यवलोकयन्तः । नान्तं न मध्यं न
    बहिः स्मरन्तः कौपीनवन्तः खलु भाग्यवन्तः ॥ ॥ स्वानन्दभावे परितुष्टिमन्तः संशान्तसर्वेन्द्रियदृष्टिमन्तः
    । अहर्निशं ब्रह्मणि ये रमन्तः कौपीनवन्तः खलु भाग्यवन्तः ॥ ॥ ब्रह्माक्षरं पावनमुच्चरन्तः पतिं पशूनां
    हृदि भावयन्तः । भिक्षाशना दिक्षु परिभ्रमन्तः कौपीनवन्तः खलु भाग्यवन्तः ॥ ॥ कौपीनपञ्चरत्नस्य मननं याति
    यो नरः । विरक्तिं धर्मविज्ञानं लभते नात्र संशयः ॥ इति श्री शङ्करभगवत्पाद विरचितं यतिपञ्चकम् ॥
