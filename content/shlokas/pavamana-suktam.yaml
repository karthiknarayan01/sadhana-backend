id: pavamana-suktam
category: stotram
name:
  english: Pavamana Suktam
content:
  english: shshucayah pavaka yasu jatah kashyapo yasvindrah | agnim ndadhire virupasta na apashshagg syona
    bhavantu || yasagm raja varuno yati madhye satyanrite avapashya njananam | madhushcutashshucayo yah
    pavakasta na apashshagg syona bhavantu || yasa ndeva divi krinvanti bhaksham ya antarikshe bahudha
    bhavanti | yah prithivi mpayasondanti shukrasta na apashshagg syona bhavantu || shivena ma cakshusha
    pashyatapashshivaya tanuvopa sprishata tvacao me | sarvago agnigm rapsushado huve vo mayi varco balamojo
    nidhatta || pavamanassuvarjanah | pavitrena vicar shanih | yah pota sa punatu ma | punantu ma devajanah
    | punantu manavo dhiya | punantu vishva ayavah | jatavedah pavitravat | pavitrena punahi ma | shukrena
    devadidyat | agne kratva kratugm ranu | yatte pavitramarcishi | agne vitatamantara | brahma tena punimahe
    | ubhabhya ndevasavitah | pavitrena savena ca | ida mbrahma punimahe | vaishvadevi punati devyaga
    t | yasyai bahvistanuvo vitaprishthah | taya madanta ssadhamadyeshu | vayagg syama patayo rayinam
    | vaishvanaro rashmibhirma punatu | vatah praneneshiro mayo bhuh | dyavaprithivi payasa payobhih |
    ritavari yajniye ma punitam || brihadbhih savitastribhih | var shishthairdevamanmabhih | agne dakshaih
    punahi ma | yena deva apunata | yenapo divyankashah | tena divyena brahmana | ida mbrahma punimahe
    | yah pavamaniraddhyeti | rishibhissambhritagm rasam | sarvagm sa putamashnati | svadita mmatarishvana
    | pavamaniryo adhyeti | rishibhissambhritagm rasam | tasmai sarasvati duhe | kshiragm sarpirmadhudakam
    || pavamanissvastyayanih | sudughahi payasvatih | rishibhissambhrito rasah | brahmaneshvamritago hitam
    | pavamanirdishantu nah | imam lo~kamatho amum | kaman thsamardhayantu nah | devi ssamabhritah | pavamanissvastyayanih
    | sudughahi ghritashcutah | rishibhi ssambhrito rasah | brahmaneshvamritago hitam | yena devah pavitrena
    | atmana | tena sahasradharena | pavamanyah punantu ma | prajapatya | shatodyamagm hiranmayam | tena
    brahma vido vayam | puta mbrahma punimahe | indrassuniti sahama punatu | somassvastya varunassamicya
    pramrinabhih punatu ma | jataveda morjayantya punatu | bhurbhuvassuvah || o yo~ravrinimahe | gatum
    ssvastirastu nah | svastirmanushebhyah | urdhva njigatu bheshajam | shanno astu dvipade ncatushpade
    || om shanti
  devanagari: श्शुच॑यः पाव॒का यासु॑ जा॒तः क॒श्यपो॒ यास्विन्द्रः॑ । अ॒ग्निं न्दधि॒रे विरू॑पा॒स्ता न॒ आप॒श्शग्ग्
    स्यो॒ना भ॑वन्तु ॥ यासा॒ग्ं॒ राजा॒ वरु॑णो॒ याति॒ मध्ये॑ सत्यानृ॒ते अ॑व॒पश्य॒ ञ्जना॑नाम् । म॒धु॒श्चुत॒श्शुच॑यो॒
    याः पा॑व॒कास्ता न॒ आप॒श्शग्ग् स्यो॒ना भ॑वन्तु ॥ यासा न्दे॒वा दि॒वि कृ॒ण्वन्ति॑ भ॒क्षं या अ॒न्तरि॑क्षे
    बहु॒धा भव॑न्ति । याः पृ॑थि॒वी म्पय॑सो॒न्दन्ति शु॒क्रास्ता न॒ आप॒श्शग्ग् स्यो॒ना भ॑वन्तु ॥ शि॒वेन॑
    मा॒ चक्षु॑षा पश्यतापश्शि॒वया॑ त॒नुवोप॑ स्पृशत॒ त्वच॑ओ मे । सर्वाग्॑ओ अ॒ग्नीग्ं र॑प्सु॒षदो॑ हुवे वो॒
    मयि॒ वर्चो॒ बल॒मोजो॒ निध॑त्त ॥ पव॑मान॒स्सुव॒र्जनः॑ । प॒वित्रे॑ण॒ विच॑र् षणिः । यः पोता॒ स पु॑नातु
    मा । पु॒नन्तु॑ मा देवज॒नाः । पु॒नन्तु॒ मन॑वो धि॒या । पु॒नन्तु॒ विश्व॑ आ॒यवः॑ । जात॑वेदः प॒वित्र॑वत्
    । प॒वित्रे॑ण पुनाहि मा । शु॒क्रेण॑ देव॒दीद्य॑त् । अग्ने॒ क्रत्वा॒ क्रतू॒ग्ं॒ रनु॑ । यत्ते॑ प॒वित्र॑म॒र्चिषि॑
    । अग्ने॒ वित॑तमन्त॒रा । ब्रह्म॒ तेन॑ पुनीमहे । उ॒भाभ्या न्देवसवितः । प॒वित्रे॑ण स॒वेन॑ च । इ॒द म्ब्रह्म॑
    पुनीमहे । वै॒श्व॒दे॒वी पु॑न॒ती दे॒व्यागा त् । यस्यै॑ ब॒ह्वीस्त॒नुवो॑ वी॒तपृ॑ष्ठाः । तया॒ मद॑न्त स्सध॒माद्ये॑षु
    । व॒यग्ग् स्या॑म॒ पत॑यो रयी॒णाम् । वै॒श्वा॒न॒रो र॒श्मिभि॑र्मा पुनातु । वातः॑ प्रा॒णेने॑षि॒रो म॑यो॒
    भूः । द्यावा॑पृथि॒वी पय॑सा॒ पयो॑भिः । ऋ॒ताव॑री य॒ज्ञिये॑ मा पुनीताम् ॥ बृ॒हद्भिः॑ सवित॒स्तृभिः॑ ।
    वर् षि॑ष्ठैर्देव॒मन्म॑भिः । अग्ने॒ दक्षैः पुनाहि मा । येन॑ दे॒वा अपु॑नत । येनापो॑ दि॒व्यङ्कशः॑ । तेन॑
    दि॒व्येन॒ ब्रह्म॑णा । इ॒द म्ब्रह्म॑ पुनीमहे । यः पा॑वमा॒नीर॒द्ध्येति॑ । ऋषि॑भि॒स्सम्भृ॑त॒ग्ं॒ रसम्
    । सर्व॒ग्ं॒ स पू॒तम॑श्नाति । स्व॒दि॒त म्मा॑त॒रिश्व॑ना । पा॒व॒मा॒नीर्यो अ॒ध्येति॑ । ऋषि॑भि॒स्सम्भृ॑त॒ग्ं॒
    रसम् । तस्मै॒ सर॑स्वती दुहे । क्षी॒रग्ं स॒र्पिर्मधू॑द॒कम् ॥ पा॒व॒मा॒नीस्स्व॒स्त्यय॑नीः । सु॒दुघा॒हि
    पय॑स्वतीः । ऋषि॑भि॒स्सम्भृ॑तो॒ रसः॑ । ब्रा॒ह्म॒णेष्व॒मृतग्॑ओ हि॒तम् । पा॒व॒मा॒नीर्दि॑शन्तु नः । इ॒मं
    लोँ॒कमथो॑ अ॒मुम् । कामा॒न् थ्सम॑र्धयन्तु नः । दे॒वी स्स॒माभृ॑ताः । पा॒व॒मा॒नीस्स्व॒स्त्यय॑नीः । सु॒दुघा॒हि
    घृ॑त॒श्चुतः॑ । ऋषि॑भि॒ स्सम्भृ॑तो॒ रसः॑ । ब्रा॒ह्म॒णेष्व॒मृतग्॑ओ हि॒तम् । येन॑ दे॒वाः प॒वित्रे॑ण ।
    आ॒त्मान॑ । तेन॑ स॒हस्र॑धारेण । पा॒व॒मा॒न्यः पु॑नन्तु मा । प्रा॒जा॒प॒त्य । श॒तोद्या॑मग्ं हिर॒ण्मयम्
    । तेन॑ ब्रह्म॒ विदो॑ व॒यम् । पू॒त म्ब्रह्म॑ पुनीमहे । इन्द्र॑स्सुनी॒ती स॒हमा॑ पुनातु । सोम॑स्स्व॒स्त्या
    व॑रुणस्स॒मीच्या प्रमृ॒णाभिः॑ पुनातु मा । जा॒तवे॑दा मो॒र्जय॑न्त्या पुनातु । भूर्भुव॒स्सुवः॑ ॥ ओ योँरावृ॑णीमहे
    । गा॒तुं स्स्व॒स्तिर॑स्तु नः । स्व॒स्तिर्मानु॑षेभ्यः । ऊ॒र्ध्व ञ्जि॑गातु भेष॒जम् । शन्नो॑ अस्तु द्वि॒पदे
    ञ्चतु॑ष्पदे ॥ ॐ शान्ति॒
