id: lakinisahasra-2
category: sahasranama
name:
  english: lakinisahasra
  devanagari: लाकिनीसहस्र
content:
  english: rinushva paramananda yogendra candrashekhara || 3|| tavahladapranayanat sarvasampattipraptaye
    | maniyogasusiddhyartham savadhana'vadharaya || 4|| ashtottarasahasranamamangalasya kahoda rishirgayatricchando
    maharudramrityunjayalakini sarasvatidevata sarvabhishtashacipithayogasiddhyarthe viniyogah | om mrityunjaya
    rudradi lakinyadi sarasvati | mrityujeta maharaudri maharudrasarasvati || 5|| maharaudro mrityuharo
    mahamanivibhushita | mahadevo mahavaktro mahamaya maheshvari || 6|| mahaviro mahakalo mahacandeshvari
    snusha | mahavato mahabhedo virabhadra mahatura || 7|| mahacandeshvaro mino manipuraprakashika | mahamatto
    maharatro mahavirasanasthita || 8|| mayavi marahanta ca matangi mangaleshvari | mrityuhari munishreshtha
    manohari manoyava || 9|| mandalastho manilango manya mohanamaulini | mattavesho mahabano mahabala
    mahalaya || 10|| mari hari mahamari madiramattagamini | mahamayashrayo mauni mahamaya marutpriya ||
    11|| mudrashi madirapi ca manoyoga mahodaya | mamsashi minabhakshashca mohini meghavahana || 12||
    manabhangapriyo manya mahamanyo mahabala | mahabanadharo mukhyo mahavidya mahiryasi || 13|| mahashuladharo'nanto
    mahabali mahakula | malayadrinivasi ca matirmalasanapriya || 14|| mayapatirmaharudro marunahatakarini
    | maladhari shankhamali manjari mamsabhakshini || 15|| mahalakshanasampanno mahalakshanalakshana |
    mahajnani mahavegi maushali mushalapriya || 16|| mahokhyo malininatho mandaradrinivasini | mauninamantarasthashca
    manabhanga manahsvini || 17|| mahavidyapatirmadhyo madhye parvatavasini | madirapo mandaharo madanamadanasana
    || 18|| madanastho madakshetro mahahimanivasini | mahan mahatma mangalyo mahamangaladharini || 19||
    mahahinasharirashca manoharatadudbhava | mayashaktipatirmoha mahamohanivasini || 20|| mahaccito nirmalatma
    mahatamashucisthita | mattakunjaraprishthastho mattakunjaragamini || 21|| makaro marutanando makari
    mrigapujita | manipujya manorupi medamamsavibhojini || 22|| mahakami mahadhiro mahamahishamardini
    | mahishasurabuddhistho mahishasuranashini || 23|| mahishastho maheshastho madhukaitabhanashini |
    madhunathashca madhupo madhumamsadisiddhida || 24|| mahabhairavapujyashca mahabhairavapujita | mahakanti
    priyanando mahakantisthita'mara || 25|| malakotidharo malo mundamalavibhushita | mandalajnananirato
    manimandalavasini || 26|| mahavibhutikrodhastho mithyadoshasarasvati | merustho merunilaya menakanujarupini
    || 27|| mahashailasana merumohini meghavahini | manjughosho manjunatho mohamudgaradharini || 28||
    medhrastho manipithastho mularupa manohara | mangalartho mahayogi mattamehasamudbhava || 29|| matisthita
    manomano manomata mahonmani | mandabuddhiharo mrityurmrityuhantri manahpriya || 30|| mahabhakto mahashakto
    mahashaktirmadatura | manipuraprakashashca manipuravibhedini || 31|| makarakutanilayo mana manamanohari
    | maksharo matrikavarnom matrikabijamalini || 32|| mahateja maharashmirmanyuga syan madhupriya | madhumamsasamutpanno
    madhumamsaviharini || 33|| maithunanandanirato maithunalapamohini | muraripremasamtushto murarikarasevita
    || 34|| malyacandanadigdhango malini mantrajivika | mantrajalasthito mantri mantrinammantrasiddhida
    || 35|| mantracaitanyakari ca mantrasiddhipriya sati | mahatirthapriyo mesho mahasimhasanasthita ||
    36|| mahakrodhasamutpanno mahati buddhidayini | maranajnanarahito mahamarananashini || 37|| maranodbhutahanta
    ca mahamudranvita muda | mahamodakaro maro marastha maranashini || 38|| mahahetuharo harta mahapuranivasini
    | mahakaulikapalashca mahadaityanivarini || 39|| martandakotikirano mritihantri mritisthita | mahashailo'malo
    mayi mahakalagunodaya || 40|| mahajayo maharudro maharudrarunakara | manovarnamrijomakhyo mudra tarunarupini
    || 41|| mundamaladharo maryo maryapushpamrijamani | mangalapremabhavastha mahavidyutprabha'cala ||
    42|| mudradhari matasthairyo matabhedaprakarini | mahapuranavetta ca mahapauranika'mrita || 43|| maunavidyo
    mahavidya mahadhananivasini | maghava maghamadhyastha mahasainya mahoraga || 44|| mahaphanidharo matra
    matrika mantravasini | mahavibhutidanadhya meruvahanavahana || 45|| mahahlado mahamitro mahamaitreyapujita
    | markandeyasiddhidata markandeyayushisthita || 46|| markandeyo muhuhprito matrikamandaleshvari |
    manasamstho manadata manodharanatatpara || 47|| mayadanavacittastho mayadanavacitrini | mahagunadharanando
    mahalingaviharini || 48|| maheshvarasthito mulo mulavidyakulodaya | mayapo mohanonmadi mahagurunivasini
    || 49|| mahashuklambaradharo malayagurudhupita | madhupini madhullaso madhvirasasamashraya || 50||
    mahagururmahadeho mahotsaha mahotpala | madhyapankajasamsthata madhyambujanivasini || 51|| maribhayaharo
    mallo mallagrahavirodhini | mahamundalayonmadi madaghurnitalocana || 52|| mahasadyojatakalo mahakapilavartini
    | meghavaho mahavaktro manasamanidharini || 53|| maranashrayahanta ca mahagurviganasthita | mahapadmasthito
    mantro mantravidyanidhishvari || 54|| makarasanasamsthata mahamrityuvinashini | mohano mohininatho
    mattanartanavasini || 55|| mahakalakulollasi mahakamadinashini | mulapadmanivasi ca mahamulakulodaya
    || 56|| masakhyo mamsanilaya mangalastha mahaguna | mayachannataro mino mimamsagunavadini || 57||
    mimamsakarako mayi marjarasiddhidayini | medinivallabhakshemo medinijnanamodini || 58|| maushalisha
    mrisharthastho manakalpitakeshari | manasa shridharo japo mandahasasushobhita || 59|| mainako menakaputro
    mayachanna mahakriya | mahakriya ca lomando mandalasanashobhita || 60|| mayadharanakarta ca mahadveshavinashini
    | muktakeshi muktadeho muktida muktimanini || 61|| muktaharadharo mukto muktimargaprakashini | mahamuktikriyacchanno
    mahoccagirinandini || 62|| mushaladyastrahanta ca mahagaurimanahkriya | mahadhani mahamani manomatta
    manolaya || 63|| maharanagata santo mahavinavinodini | mahashatrunihanta ca mahastrajalamalini ||
    64|| shivo rudro valishani kitavamodavardhini | candracudadharo vedo madonmatta mahojjvala || 65||
    vigalatkoticandrabho vidhukotisamodaya | agnijvaladharo viro jvalamalasahasradha || 66|| bhargapriyakaro
    dharmo mahadharmikatatpara | dharmadhvajo dharmakarta dharmagupti prasrittvari || 67|| mahavidrumapurastho
    vidrumabhayutaprabha | pushpamaladharo manyo shatrunam kulanashini || 68|| kojagaro visargastho bijamalavibhushita
    | bijacandro bijapuro bijabha vighnanashini || 69|| vishishto vidhimokshastho vedangaparipurini |
    kiratinipati shriman vijnavijnajanapriya || 70|| vardhastho vardhasampanno varnamalavibhushita | mahadrumagata
    shuro vilasatkoticandrabha || 71|| mahakumaranilayo mahakamakumarika | kamajalakriyanatho vikala kamalasana
    || 72|| khandabuddhiharo bhavo bhavatiti durasana | asamkhyako rupasamkhyo namasamkhyadipurani ||
    73|| sadmanadyamana koshakinkinijalamalini | candrayutamukhambhojo vibhayutasamanana || 74|| kalabuddhiharo
    balo bhagavatyambika'ndaja | mundahastashcaturadyah vivadarahita'vrita || 75|| pancamacarakushalo
    mahapancamalalasa | vikarashunyo durdharsho dvipada manushakriya || 76|| mayadanavakarmastho vidhatrikarmabodhini
    | kalikalakriyarudha vayavighargharadhvani || 77|| sarvasancarakarta ca sarvasancarakartrika | mandamandagatiprema
    mandamandagatisthita || 78|| sattahaso vidhukala caghoraghorayatana | mahanarakaharta ca narakadivipakaha
    || 79|| pancarashmisamudbhuto nagadibalaghatini | garudasanasampujyo garudapremavardhini || 80|| ashvatthavrikshanilayo
    vatavrikshatalasthita | cirango prathamabuddhi prapancasarasangati || 81|| sthitikarta sthiticchaya
    vimada chatradharini | dadimabhasakusumo dadimodbhavapushpika || 82|| dradhyo dravibharatika ratikalapavardhini
    | ratnagarbho ratnamala ratneshvara ivagati || 83|| prasiddhah pavani puccha pucchasustha parapara
    | khecari khecara svastho mahakhadgadhara jaya || 84|| kishorabhavakhelastho vikhanadiprakarika |
    mahashabdaprakashashca mahashabdaprakashika || 85|| caruhaso vipadhanta shatrumitraganasthita | vajradandadharo
    vyaghro viyatkhelanakhanjana || 86|| gadadhara shiladhari shashikarpuraga'bala | vasanasanakari ca
    vasanavasanapriya || 87|| mahavidyadharo gupto vishishtagopanakriya | guptagitagayanastho guptashastragalaprada
    || 88|| yogavidyapuranashca yagavidya vibhakala | ekakalo dvikalashcatra kalaphalambuja || 89|| ashtadashabhujo
    raudri bhujaga vighnanashini | vidyagopanakari ca vidyasiddhipradayini || 90|| vijayanandago mando
    mahakalamaheshvari | bhutidanarato margom mahadgitaprakashini || 91|| keshadyaveshasantano mangalabha
    kulantara | dvibhujo vedabahushca shadbhuja kamacarini || 92|| candrakantamalyadharo lokatilokaragini
    | tribhangadehanikaro vibhangastha vinodini || 93|| trikutasthastribhavasthastrisharira trikalaja
    | ekavaktro dvivaktrashca vaktrashunya shishupriya || 94|| shri vidyamantrajalastho vijnani kushaleshvari
    | ghatasaragato gaura gauravi gaurika'cala || 95|| gurujnanagato gandho gandhabhogya giridhvaja |
    chayamandalamadhyastho vikata pushkaranana || 96|| kamakhyo nirahankara kamarupanripangaja | sulabho
    durlabho duhkhi sukshmatisukshmarupini || 97|| bijajapapasho kruro vimohagunanashini | ardharo nipunollasho
    vibhurupa sarasvati || 98|| anantaghoshanilayo vihangaganagamini | acyutesha prakandastha pracandaphalavahini
    || 99|| abhranto bhrantirahita shranto yanti pratishthita | avyartho vyarthavakyastho vishankashankayanvita
    || 100|| yamunapatipa pino mahakalavasavaha | jambudvipeshvara para paravarakritasani || 101|| vajradandadhara
    shanto mithyagatiratindriya | anantashayano nyunah paramahladavardhini || 102|| shishtashranilayo
    vyakhyo vasantakalasupriya | virajandolito bhinno vishuddhagunamandita || 103|| anjaneshah khanjanesha
    palalasavabhakshini | angabhashakritisnata sudharasaphalatura || 104|| phalabijadharo daurgo dvarapalanapallava
    | pippaladah karanashca vikhyatirativallabha || 105|| samharavigraho vipro vishanna kamarupini | avalapo
    napanapo viklripta kamsanashini || 106|| hathatkarenato camo nacamo vinayakriya | sarva sarvasukhacchanno
    jitajitagunodaya || 107|| bhasvatkirito rankari varuneshitalantara | amulyaratnadanadhyo divaratristrikhandaja
    || 108|| marabijamahamano harabijadisamsthita | anantavasukishano lakini kakini dvidha || 109|| kotidhvajo
    brihadgargashcamunda ranacandika | umesho ratnamaleshi vikumbhaganapujita || 110|| nikumbhapujita
    krishno vishnupatni sudhatmika | alpakalaharah kunto mahakuntastradharini || 111|| brahmastradharaka
    kshipto vanamalavibhushita | ekakshara dvayaksharashca shodashaksharasambhava || 112|| atigambhiravatastho
    mahagambhiravadyaga | trividhatma trideshatma tritiyatranakarini || 113|| kiyatkalacalanando vihangagamanasana
    | girvana banahanta ca banahasta vidhucchala || 114|| bindudharmojjvalodaro viyajjvalanakarini | vivasa
    vyasapujyashca navadeshipradhanika || 115|| vilolavadano vamo viroma modakarini | hiranyaharabhushangah
    kalinganandinishaga || 116|| ananyakshinavakshashca kshitikshobhavinashika | kshanakshetraprasadango
    vashishthadirishishvari || 117|| revatiranivasi ca gangatiranivasini | cangeshah pushkareshashca vyasabhashavisheshika
    || 118|| amalanathasamjnashca rameshvarasupujita | ramanatha prabhu prapti kirtidurgabhidhanika ||
    119|| lambodara premakalo lambodarakulapriya | svargadeho dhyanamano locanayatadharini || 120|| avyarthavacanaprakshyo
    vidyavagishvarapriya | abdamanasmritiprana kalinganagareshvari || 121|| atiguhyatarajnani guptacandratmika'vyaya
    | maninagagato ganta vagishani balaprada || 122|| kulasanagato nasho vinasha nashasupriya | vinashamulah
    kulasthah samharakulakeshvari || 123|| trivakyagunaviprendro mahadashcaryacitrini | ashutoshagunacchanna
    madavihvalamandala || 124|| virupakshi lelihashca mahamudraprakashini | ashtadashaksharo rudro makarandasubinduga
    || 125|| chatracamaradhari ca chatradatri tripaundraja | indratmako vidhata ca dhanada nadakarini
    || 126|| kundaliparamanando madhupushpasamudbhava | bilvavrikshasthito rudro nayanambujavasini ||
    127|| hiranyagarbha kaumaro virupaksha ritupriya | shrivrikshanilayashyamo mahakulatarudbhava || 128||
    kulavrikshasthito vidvan hiranyarajatapriya | kulapah pranapa prana pancacudadharadhara || 129|| ushati
    vedikanatho narmadharmavivecika | shitalapta shitahino manahsthairyakari kshaya || 130|| kukshistha
    kshanabhangastho giripithanivasini | ardhakayah prasannatma prasannavanavasini || 131|| pratishthesha
    pranadharma jyotirupa ritupriya | dharmadhvajapatakesho balaka rasavarddhini || 132|| merusha
  devanagari: ृणुष्व परमानन्द योगेन्द्र चन्द्रशेखर ॥ ३॥ तवाह्लादप्रणयनात् सर्वसम्पत्तिप्राप्तये । मणियोगसुसिद्ध्यर्थं
    सावधानाऽवधारय ॥ ४॥ अष्टोत्तरसहस्रनाममङ्गलस्य कहोड ऋषिर्गायत्रीच्छन्दो महारुद्रमृत्युञ्जयलाकिनी सरस्वतीदेवता
    सर्वाभीष्टशचीपीठयोगसिद्ध्यर्थे विनियोगः । ॐ मृत्युञ्जय रुद्रादि लाकिन्यादि सरस्वती । मृत्युजेता महारौद्री
    महारुद्रसरस्वती ॥ ५॥ महारौद्रो मृत्युहरो महामणिविभूषिता । महादेवो महावक्त्रो महामाया महेश्वरी ॥ ६॥
    महावीरो महाकालो महाचण्डेश्वरी स्नुषा । महावातो महाभेदो वीरभद्रा महातुरा ॥ ७॥ महाचण्डेश्वरो मीनो मणिपूरप्रकाशिका
    । महामत्तो महारात्रो महावीरासनस्थिता ॥ ८॥ मायावी मारहन्ता च मातङ्गी मङ्गलेश्वरी । मृत्युहारी मुनिश्रेष्ठा
    मनोहारी मनोयवा ॥ ९॥ मण्डलस्थो मनीलाङ्गो मान्या मोहनमौलिनी । मत्तवेशो महाबाणो महाबला महालया ॥ १०॥ मारी
    हारी महामारी मदिरामत्तगामिनी । महामायाश्रयो मौनी महामाया मरुत्प्रिया ॥ ११॥ मुद्राशी मदिरापी च मनोयोगा
    महोदया । मांसाशी मीनभक्षश्च मोहिनी मेघवाहना ॥ १२॥ मानभङ्गप्रियो मान्या महामान्यो महाबला । महाबाणधरो
    मुख्यो महाविद्या महीर्यसी ॥ १३॥ महाशूलधरोऽनन्तो महाबली महाकुला । मलयाद्रिनिवासी च मतिर्मालासनप्रिया
    ॥ १४॥ मायापतिर्महारुद्रो मरुणाहतकारिणी । मालाधारी शङ्खमाली मञ्जरी मांसभक्षिणी ॥ १५॥ महालक्षणसम्पन्नो
    महालक्षणलक्षणा । महाज्ञानी महावेगी मौषली मुषलप्रिया ॥ १६॥ महोख्यो मालिनीनाथो मन्दराद्रिनिवासिनी ।
    मौनीनामन्तरस्थश्च मानभङ्गा मनःस्विनी ॥ १७॥ महाविद्यापतिर्मध्यो मध्ये पर्वतवासिनी । मदिरापो मन्दहरो
    मदनामदनासना ॥ १८॥ मदनस्थो मदक्षेत्रो महाहिमनिवासिनी । महान् महात्मा माङ्गल्यो महामङ्गलधारिणी ॥ १९॥
    महाहीनशरीरश्च मनोहरतदुद्भवा । मायाशक्तिपतिर्मोहा महामोहनिवासिनी ॥ २०॥ महच्चितो निर्मलात्मा महतामशुचिस्थित
    । मत्तकुञ्जरपृष्ठस्थो मत्तकुञ्जरगामिनी ॥ २१॥ मकरो मरुतानन्दो माकरी मृगपूजिता । मणीपूज्या मनोरूपी मेदमांसविभोजिनी
    ॥ २२॥ महाकामी महाधीरो महामहिषमर्दिनी । महिषासुरबुद्धिस्थो महिषासुरनाशिनी ॥ २३॥ महिषस्थो महेशस्थो मधुकैटभनाशिनी
    । मधुनाथश्च मधुपो मधुमांसादिसिद्धिदा ॥ २४॥ महाभैरवपूज्यश्च महाभैरवपूजिता । महाकान्ति प्रियानन्दो महाकान्तिस्थिताऽमरा
    ॥ २५॥ मालाकोटिधरो मालो मुण्डमालाविभूषिता । मण्डलज्ञाननिरतो मणिमण्डलवासिनी ॥ २६॥ महाविभूतिक्रोधस्थो
    मिथ्यादोषसरस्वती । मेरुस्थो मेरुनिलय मेनकानुजरूपिणि ॥ २७॥ महाशैलासन मेरुमोहिनी मेघवाहिनी । मञ्जुघोषो
    मञ्जुनाथो मोहमुद्गरधारिणी ॥ २८॥ मेढ्रस्थो मणिपीठस्थो मूलरूपा मनोहरा । मङ्गलार्थो महायोगी मत्तमेहसमुद्भवा
    ॥ २९॥ मतिस्थित मनोमानो मनोमाता महोन्मनी । मन्दबुद्धिहरो मृत्युर्मृत्युहन्त्री मनःप्रिया ॥ ३०॥ महाभक्तो
    महाशक्तो महाशक्तिर्मदातुरा । मणिपुरप्रकाशश्च मणिपुरविभेदिनी ॥ ३१॥ मकारकूटनिलयो माना मानमनोहरी । माक्षरो
    मातृकावर्णों मातृकाबीजमालिनी ॥ ३२॥ महातेजा महारश्मिर्मन्युग स्यान् मधुप्रिया । मधुमांससमुत्पन्नो मधुमांसविहारिणी
    ॥ ३३॥ मैथुनानन्दनिरतो मैथुनालापमोहिनी । मुरारिप्रेमसंतुष्टो मुरारिकरसेविता ॥ ३४॥ माल्यचन्दनदिग्धाङ्गो
    मालिनी मन्त्रजीविका । मन्त्रजालस्थितो मन्त्री मन्त्रिणांमन्त्रसिद्धिदा ॥ ३५॥ मन्त्रचैतन्यकारी च मन्त्रसिद्धिप्रिया
    सती । महातीर्थप्रियो मेषो महासिंहासनस्थिता ॥ ३६॥ महाक्रोधसमुत्पन्नो महती बुद्धिदायिनी । मरणज्ञानरहितो
    महामरणनाशिनी ॥ ३७॥ मरणोद्भूतहन्ता च महामुद्रान्विता मुदा । महामोदकरो मारो मारस्था मारनाशिनी ॥ ३८॥
    महाहेतुहरो हर्ता महापुरनिवासिनी । महाकौलिकपालश्च महादैत्यनिवारिणी ॥ ३९॥ मार्तण्डकोटिकिरणो मृतिहन्त्री
    मृतिस्थिता । महाशैलोऽमलो मायी महाकालगुणोदया ॥ ४०॥ महाजयो महारुद्रो महारुद्रारुणाकरा । मनोवर्णमृजोमाख्यो
    मुद्रा तरुणरूपिणी ॥ ४१॥ मुण्डमालाधरो मार्यो मार्यपुष्पमृजामनी । मङ्गलप्रेमभावस्था महाविद्युत्प्रभाऽचला
    ॥ ४२॥ मुद्राधारी मतस्थैर्यो मतभेदप्रकारिणी । महापुराणवेत्ता च महापौराणिकाऽमृता ॥ ४३॥ मौनविद्यो महाविद्या
    महाधननिवासिनी । मघवा माघमध्यस्था महासैन्या महोरगा ॥ ४४॥ महाफणिधरो मात्रा मातृका मन्त्रवासिनी । महाविभूतिदानाढ्या
    मेरुवाहनवाहना ॥ ४५॥ महाह्लादो महामित्रो महामैत्रेयपूजिता । मार्कण्डेयसिद्धिदाता मार्कण्डेयायुषिस्थिता
    ॥ ४६॥ मार्कण्डेयो मुहुःप्रीतो मातृकामण्डलेश्वरी । मानसंस्थो मानदाता मनोधारणतत्परा ॥ ४७॥ मयदानवचित्तस्थो
    मयदानवचित्रिणी । महागुणधरानन्दो महालिङ्गविहारिणी ॥ ४८॥ महेश्वरस्थितो मूलो मूलविद्याकुलोदया । मायापो
    मोहनोन्मादी महागुरुनिवासिनी ॥ ४९॥ महाशुक्लाम्बरधरो मलयागुरुधूपिता । मधूपिनी मधूल्लासो माध्वीरससमाश्रया
    ॥ ५०॥ महागुरुर्महादेहो महोत्साहा महोत्पला । मध्यपङ्कजसंस्थाता मध्याम्बुजनिवासिनी ॥ ५१॥ मारीभयहरो मल्लो
    मल्लग्रहविरोधिनी । महामुण्डलयोन्मादी मदघूर्णीतलोचना ॥ ५२॥ महासद्योजातकालो महाकपिलवर्तीनी । मेघवाहो
    महावक्त्रो मनसामणिधारिणी ॥ ५३॥ मरणाश्रयहन्ता च महागुर्वीगणस्थिता । महापद्मस्थितो मन्त्रो मन्त्रविद्यानिधीश्वरी
    ॥ ५४॥ मकरासनसंस्थाता महामृत्युविनाशिनी । मोहनो मोहिनीनाथो मत्तनर्तनवासिनी ॥ ५५॥ महाकालकुलोल्लासी महाकामादिनाशिनी
    । मूलपद्मनिवासी च महामूलकुलोदया ॥ ५६॥ मासाख्यो मांसनिलया मङ्गलस्था महागुणा । मायाछन्नतरो मीनो मीमांसागुणवादिनी
    ॥ ५७॥ मीमांसाकारको मायी मार्जारसिद्धिदायिनी । मेदिनीवल्लभक्षेमो मेदिनीज्ञानमोदिनी ॥ ५८॥ मौषलीश मृषार्थस्थो
    मनकल्पितकेशरी । मनस श्रीधरो जापो मन्दहाससुशोभिता ॥ ५९॥ मैनाको मेनकापुत्रो मायाछन्ना महाक्रिया । महाक्रिया
    च लोमाण्डो मण्डलासनशोभिता ॥ ६०॥ मायाधारणकर्ता च महाद्वेषविनाशिनी । मुक्तकेशी मुक्तदेहो मुक्तिदा मुक्तिमानिनी
    ॥ ६१॥ मुक्ताहारधरो मुक्तो मुक्तिमार्गप्रकाशिनी । महामुक्तिक्रियाच्छन्नो महोच्चगिरिनन्दिनी ॥ ६२॥ मूषलाद्यस्त्रहन्ता
    च महागौरीमनःक्रिया । महाधनी महामानी मनोमत्ता मनोलया ॥ ६३॥ महारणगत सान्तो महावीणाविनोदिनी । महाशत्रुनिहन्ता
    च महास्त्रजालमालिनी ॥ ६४॥ शिवो रुद्रो वलीशानी कितवामोदवर्धीनी । चन्द्रचूडाधरो वेदो मदोन्मत्ता महोज्ज्वला
    ॥ ६५॥ विगलत्कोटिचन्द्राभो विधुकोटिसमोदया । अग्निज्वालाधरो वीरो ज्वालामालासहस्रधा ॥ ६६॥ भर्गप्रियकरो
    धर्मो महाधार्मीकतत्परा । धर्मध्वजो धर्मकर्ता धर्मगुप्ति प्रसृत्त्वरी ॥ ६७॥ महाविद्रुमपूरस्थो विद्रुमाभायुतप्रभा
    । पुष्पमालाधरो मान्यो शत्रूणां कुलनाशिनी ॥ ६८॥ कोजागरो विसर्गस्थो बीजमालाविभूषिता । बीजचन्द्रो बीजपूरो
    बीजाभा विघ्ननाशिनी ॥ ६९॥ विशिष्टो विधिमोक्षस्थो वेदाङ्गपरिपूरिणी । किरातिनीपति श्रीमान् विज्ञाविज्ञजनप्रिया
    ॥ ७०॥ वर्धस्थो वर्धसम्पन्नो वर्णमालाविभूषिता । महाद्रुमगत शूरो विलसत्कोटिचन्द्रभा ॥ ७१॥ महाकुमारनिलयो
    महाकामकुमारिका । कामजालक्रियानाथो विकला कमलासना ॥ ७२॥ खण्डबुद्धिहरो भावो भवतीति दुरासना । असंख्यको
    रूपसंख्यो नामसंख्यादिपूरणी ॥ ७३॥ सद्मनाद्यमना कोषकिङ्किणीजालमालिनी । चन्द्रायुतमुखाम्भोजो विभायुतसमानना
    ॥ ७४॥ कालबुद्धिहरो बालो भगवत्यम्बिकाऽण्डजा । मुण्डहस्तश्चातुराद्यः विवादरहिताऽवृता ॥ ७५॥ पञ्चमाचारकुशलो
    महापञ्चमलालसा । विकारशून्यो दुर्धर्षो द्विपदा मानुषक्रिया ॥ ७६॥ मयदानवकर्मस्थो विधातृकर्मबोधिनी ।
    कलिकालक्रियारूढ वायवीघर्घरध्वनि ॥ ७७॥ सर्वसञ्चारकर्ता च सर्वसञ्चारकर्त्रीका । मन्दमन्दगतिप्रेमा मन्दमन्दगतिस्थिता
    ॥ ७८॥ साट्टहासो विधुकला चाघोराघोरयातना । महानरकहर्ता च नरकादिविपाकहा ॥ ७९॥ पञ्चरश्मिसमुद्भूतो नगादिबलघातिनी
    । गरुडासनसम्पूज्यो गरुडप्रेमवर्धीनी ॥ ८०॥ अश्वत्थवृक्षनिलयो वटवृक्षतलस्थिता । चिराङ्गो प्रथमाबुद्धि
    प्रपञ्चसारसङ्गति ॥ ८१॥ स्थितिकर्ता स्थितिच्छाया विमदा छत्रधारिणी । दाडिमाभासकुसुमो दाडिमोद्भवपुष्पिका
    ॥ ८२॥ द्राढ्यो द्रवीभरतिका रतिकालापवर्धीनी । रत्नगर्भो रत्नमाला रत्नेश्वर इवागति ॥ ८३॥ प्रसिद्धः पावनी
    पुच्छा पुच्छसुस्थ परापरा । खेचरी खेचर स्वस्थो महाखड्गधरा जया ॥ ८४॥ किशोरभावखेलस्थो विखनादिप्रकारिका
    । महाशब्दप्रकाशश्च महाशब्दप्रकाशिका ॥ ८५॥ चारुहासो विपधन्ता शत्रुमित्रगणस्थिता । वज्रदण्डधरो व्याघ्रो
    वियत्खेलनखञ्जना ॥ ८६॥ गदाधर शीलधारी शशिकर्पूरगाऽबला । वसनासनकारी च वसनावसनप्रिया ॥ ८७॥ महाविद्याधरो
    गुप्तो विशिष्टगोपनक्रिया । गुप्तगीतागायनस्थो गुप्तशास्त्रगलप्रदा ॥ ८८॥ योगविद्यापुराणश्च यागविद्या
    विभाकला । एककालो द्विकालश्चात्र कालफलाम्बुजा ॥ ८९॥ अष्टादशभुजो रौद्री भुजगा विघ्ननाशिनी । विद्यागोपनकारी
    च विद्यासिद्धिप्रदायिनी ॥ ९०॥ विजयानन्दगो मन्दो महाकालमहेश्वरी । भूतिदानरतो मार्गों महद्गीताप्रकाशिनी
    ॥ ९१॥ केशाद्यावेशसन्तानो मङ्गलाभा कुलान्तरा । द्विभुजो वेदबाहुश्च षड्भुजा कामचारिणी ॥ ९२॥ चन्द्रकान्तमाल्यधरो
    लोकातिलोकरागिणी । त्रिभङ्गदेहनिकरो विभाङ्गस्था विनोदिनी ॥ ९३॥ त्रिकूटस्थस्त्रिभावस्थस्त्रिशरीरा त्रिकालजा
    । एकवक्त्रो द्विवक्त्रश्च वक्त्रशून्या शिशुप्रिया ॥ ९४॥ श्री विद्यामन्त्रजालस्थो विज्ञानी कुशलेश्वरी
    । घटासरगतो गौरा गौरवी गौरिकाऽचला ॥ ९५॥ गुरुज्ञानगतो गन्धो गन्धभोग्या गिरिध्वजा । छायामण्डलमध्यस्थो
    विकटा पुष्करानना ॥ ९६॥ कामाख्यो निरहङ्कार कामरूपनृपाङ्गजा । सुलभो दुर्लभो दुःखी सूक्ष्मातिसूक्ष्मरूपिणी
    ॥ ९७॥ बीजजापपशो क्रूरो विमोहगुणनाशिनी । अर्धरो निपुणोल्लाशो विभुरूपा सरस्वती ॥ ९८॥ अनन्तघोषनिलयो विहङ्गगणगामिनी
    । अच्युतेश प्रकाण्डस्थ प्रचण्डफालवाहिनी ॥ ९९॥ अभ्रान्तो भ्रान्तिरहिता श्रान्तो यान्ति प्रतिष्ठिता
    । अव्यर्थो व्यर्थवाक्यस्थो विशङ्काशङ्कयान्विता ॥ १००॥ यमुनापतिप पीनो महाकालवसावहा । जम्बूद्वीपेश्वर
    पार पारावारकृतासनी ॥ १०१॥ वज्रदण्डधर शान्तो मिथ्यागतिरतीन्द्रिया । अनन्तशयनो न्यूनः परमाह्लादवर्धीनी
    ॥ १०२॥ शिष्टाश्रणिलयो व्याख्यो वसन्तकालसुप्रिया । विरजान्दोलितो भिन्नो विशुद्धगुणमण्डिता ॥ १०३॥ अञ्जनेशः
    खञ्जनेश पललासवभक्षिणी । अङ्गभाषाकृतिस्नाता सुधारसफलातुरा ॥ १०४॥ फलबीजधरो दौर्गो द्वारपालनपल्लवा ।
    पिप्पलादः कारणश्च विख्यातिरतिवल्लभा ॥ १०५॥ संहारविग्रहो विप्रो विषण्णा कामरूपिणी । अवलापो नापनापो
    विक्लृप्ता कंसनाशिनी ॥ १०६॥ हठात्कारेणतो चामो नाचामो विनयक्रिया । सर्व सर्वसुखाच्छन्नो जिताजितगुणोदया
    ॥ १०७॥ भास्वत्किरीटो राङ्कारी वरुणेशीतलान्तरा । अमूल्यरत्नदानाढ्यो दिवारात्रिस्त्रिखण्डजा ॥ १०८॥ मारबीजमहामानो
    हरबीजादिसंस्थिता । अनन्तवासुकीशानो लाकिनी काकिनी द्विधा ॥ १०९॥ कोटिध्वजो बृहद्गर्गश्चामुण्डा रणचण्डिका
    । उमेशो रत्नमालेशी विकुम्भगणपूजिता ॥ ११०॥ निकुम्भपूजित कृष्णो विष्णुपत्नी सुधात्मिका । अल्पकालहरः
    कुन्तो महाकुन्तास्त्रधारिणी ॥ १११॥ ब्रह्मास्त्रधारक क्षिप्तो वनमालाविभूषिता । एकाक्षर द्वयक्षरश्च
    षोडशाक्षरसम्भवा ॥ ११२॥ अतिगम्भीरवातस्थो महागम्भीरवाद्यगा । त्रिविधात्मा त्रिदेशात्मा तृतीयात्राणकारिणी
    ॥ ११३॥ कियत्कालचलानन्दो विहङ्गगमनासना । गीर्वाण बाणहन्ता च बाणहस्ता विधूच्छला ॥ ११४॥ बिन्दुधर्मोज्ज्वलोदारो
    वियज्ज्वलनकारिणी । विवासा व्यासपूज्यश्च नवदेशीप्रधानिका ॥ ११५॥ विलोलवदनो वामो विरोमा मोदकारिणी । हिरण्यहारभूषाङ्गः
    कलिङ्गनन्दिनीशगा ॥ ११६॥ अनन्यक्षीणवक्षश्च क्षितिक्षोभविनाशिका । क्षणक्षेत्रप्रसादाङ्गो वशिष्ठादिऋषीश्वरी
    ॥ ११७॥ रेवातीरनिवासी च गङ्गातीरनिवासिनी । चाङ्गेशः पुष्करेशश्च व्यासभाषाविशेषिका ॥ ११८॥ अमलानाथसंज्ञश्च
    रामेश्वरसुपूजिता । रमानाथ प्रभु प्राप्ति कीर्तीदुर्गाभिधानिका ॥ ११९॥ लम्बोदर प्रेमकालो लम्बोदरकुलप्रिया
    । स्वर्गदेहो ध्यानमानो लोचनायतधारिणी ॥ १२०॥ अव्यर्थवचनप्रक्ष्यो विद्यावागीश्वरप्रिया । अब्दमानस्मृतिप्राण
    कलिङ्गनगरेश्वरी ॥ १२१॥ अतिगुह्यतरज्ञानी गुप्तचन्द्रात्मिकाऽव्यया । मणिनागगतो गन्ता वागीशानी बलप्रदा
    ॥ १२२॥ कुलासनगतो नाशो विनाशा नाशसुप्रिया । विनाशमूलः कूलस्थः संहारकुलकेश्वरी ॥ १२३॥ त्रिवाक्यगुणविप्रेन्द्रो
    महदाश्चर्यचित्रिणी । आशुतोषगुणाच्छन्न मदविह्वलमण्डला ॥ १२४॥ विरूपाक्षी लेलिहश्च महामुद्राप्रकाशिनी
    । अष्टादशाक्षरो रुद्रो मकरन्दसुबिन्दुगा ॥ १२५॥ छत्रचामरधारी च छत्रदात्री त्रिपौण्ड्रजा । इन्द्रात्मको
    विधाता च धनदा नादकारिणी ॥ १२६॥ कुण्डलीपरमानन्दो मधुपुष्पसमुद्भवा । बिल्ववृक्षस्थितो रुद्रो नयनाम्बुजवासिनी
    ॥ १२७॥ हिरण्यगर्भ कौमारो विरूपाक्षा ऋतुप्रिया । श्रीवृक्षनिलयश्यामो महाकुलतरूद्भवा ॥ १२८॥ कुलवृक्षस्थितो
    विद्वान् हिरण्यरजतप्रिया । कुलपः प्राणप प्राणा पञ्चचूडधराधरा ॥ १२९॥ उषती वेदिकानाथो नर्मधर्मविवेचिका
    । शीतलाप्त शीतहीनो मनःस्थैर्यकरी क्षया ॥ १३०॥ कुक्षिस्थ क्षणभङ्गस्थो गिरिपीठनिवासिनी । अर्धकायः प्रसन्नात्मा
    प्रसन्नवनवासिनी ॥ १३१॥ प्रतिष्ठेश प्राणधर्मा ज्योतीरूपा ऋतुप्रिया । धर्मध्वजपताकेशो बलाका रसवर्द्धीनी
    ॥ १३२॥ मेरुश
