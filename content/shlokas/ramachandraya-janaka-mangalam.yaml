id: ramachandraya-janaka-mangalam
category: stotram
name:
  english: Ramachandraya Janaka (Mangalam)
content:
  english: ramacandraya janakarajaja manoharaya mamakabhishtadaya mahita mangalam || kosaleshaya mandahasa
    dasaposhanaya vasavadi vinuta sadvarada mangalam || || caru kunkumo peta candanadi carcitaya harakataka
    shobhitaya bhuri mangalam || || lalita ratnakundalaya tulasivanamalikaya jalada sadrusha dehaya caru
    mangalam || || devakiputraya deva devottamaya capa jata guru varaya bhavya mangalam || || pundarikakshaya
    purnacandrananaya andajatavahanaya atula mangalam || || vimalarupaya vividha vedantavedyaya sujana
    citta kamitaya shubhaga mangalam || || ramadasa mridula hridaya tamarasa nivasaya svami bhadragirivaraya
    sarva mangalam ||
  devanagari: रामचन्द्राय जनकराजजा मनोहराय मामकाभीष्टदाय महित मङ्गलम् ॥ कोसलेशाय मन्दहास दासपोषणाय वासवादि
    विनुत सद्वरद मङ्गलम् ॥ ॥ चारु कुङ्कुमो पेत चन्दनादि चर्चिताय हारकटक शोभिताय भूरि मङ्गलम् ॥ ॥ ललित
    रत्नकुण्डलाय तुलसीवनमालिकाय जलद सद्रुश देहाय चारु मङ्गलम् ॥ ॥ देवकीपुत्राय देव देवोत्तमाय चाप जात
    गुरु वराय भव्य मङ्गलम् ॥ ॥ पुण्डरीकाक्षाय पूर्णचन्द्राननाय अण्डजातवाहनाय अतुल मङ्गलम् ॥ ॥ विमलरूपाय
    विविध वेदान्तवेद्याय सुजन चित्त कामिताय शुभग मङ्गलम् ॥ ॥ रामदास मृदुल हृदय तामरस निवासाय स्वामि भद्रगिरिवराय
    सर्व मङ्गलम् ॥
