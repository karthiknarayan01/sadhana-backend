id: vallisahasranamastotra-2
category: sahasranama
name:
  english: vallisahasranamastotra
  devanagari: वल्लीसहस्रनामस्तोत्र
content:
  english: ringaberapurashrita | shritabhishtaprada shridya shrija shrimantravadini || 63|| shrividya
    shripara shrisha shrimayi shrigiristhita | shonadhara shobhanangi shobhana shobhanaprada || 64|| sheshahina
    sheshapujya sheshatalpasamudbhava | shurasena shurapadmakuladhumapatakika || 65|| shunyapaya shunyakatih
    shunyasimhasanasthita | shunyalinga shunya shunya shaurija shauryavardhini || 66|| sharanekasyutakayabhaktasanghashritalaya
    | shashvadvaivadhikastutya sharanya sharanaprada || 67|| arigandadibhayakridyantrodvahijanarcita |
    kalakanthasnusha kalakesha kalabhayankari || 68|| ajavaha cajamitra cajasurahara hyaja | ajamukhisutaratipujita
    cajara'mara || 69|| ajanapavana'dvaita asamudrakshitishvari | asetuhimashailarcya akuncita shiroruha
    || 70|| ahararasika cadya ashcaryanilaya tatha | adhara ca tatha''dheya tathacadheyavarjita || 71||
    anupurviklriptaratha cashapalasupujita | umasnusha umasunupriya cotsavamodita || 72|| urdhvaga riddhida
    riddha aushadhishatishayini | aupamyahina cautsukyakari caudaryashalini || 73|| shricakravalatapatra
    shrivatsankitabhushana | shrikantabhagineyeshta shrimukhabdadhidevata || 74|| iyam nari varanuta pinonnatakucadvaya
    | shyama yauvanamadhyastha ka jata sa grihadrita || 75|| esha sammohini devi priyalakshya varashrita
    | kama'nubhukta mrigayasakta''vedya guhashrita || 76|| pulindavanitanita rahah kantanusarini | nisha
    cakridita''bodhya nirnidra purushayita || 77|| svayamvrita sudrik sukshma subrahmanyamanohara | paripurnacalarudha
    shabaranumata'nagha || 78|| candrakanta candramukhi candanagarucarcita | catupriyoktimudita shreyodatri
    vicintita || 79|| murdhasphatipuradhisha murdharudhapadambuja | muktida mudita mugdha muhurdhyeya
    manonmani || 80|| citritatmapriyakara cidambaraviharini | caturvedasvararava cintaniya cirantani ||
    81|| kartikeyapriya kamasahaja kaminivrita | kancanadristhita kantimati sadhuvicintita || 82|| narayanasamudbhuta
    nagaratnavibhushana | naradoktapriyodanta namya kalyanadayini || 83|| naradabhishtajanani nakalokanivasini
    | nityananda niratishaya namasahasrapujita || 84|| pitamaheshtada pita pitambarasamudbhava | pitambarojjvala
    pinanitamba prarthita para || 85|| ganya ganeshvari gamya gahanastha gajapriya | gajarudha gajagatih
    gajananavinodini || 86|| agajananapadmarka gajananasudhakara | gandharvavandya gandharvatantra gandhavinodini
    || 87|| gandharvodvahita gita gayatri ganatatpara | gatirgahanasambhuta gadhashlishtashivatmaja ||
    88|| gudha gudhacara guhya guhyakeshta guhashrita | gurupriya gurustutya gunya guniganashrita || 89||
    gunaganya gudharatih girgirvinutavaibhava | girvani gitamahima girvaneshvarasannuta || 90|| girvanadrikritavasa
    gajavalli gajashrita | gangeyavanita gangasunukanta girishvari || 91|| devasenasapatni ya devendranujasambhava
    | devarebhabhayavishta sarastiraluthadgatih || 92|| vriddhaveshaguhaklishta bhita sarvangasundari
    | nishasamanakabari nishakarasamanana || 93|| nirnidritakshikamala nishthyutarunabhadhara | shivacaryasati
    shita shitala shitalekshana || 94|| kimetaditi sashankabhata dhammillamargita | dhammillasundari dhartri
    dhatri dhatrivimocini || 95|| dhanada dhanadaprita dhaneshi dhanadeshvari | dhanya dhyanapara dhara
    dharadhara dharadhara || 96|| dhara dharadharodbhuta dhira dhirasamarcita | kim karoshiti samprishtaguha
    sakutabhashini || 97|| raho bhavatu tadbhuyat shamityuktapriya smita | kumarajnata kathinyakuca'rdhorulasatkati
    || 98|| kancuki kancukacchanna kancipattaparishkrita | vyatyastakaccha vinyastadakshinamsamshuka'tula
    || 99|| bandhotsukitakantanta purushayitakautuka | puta putavati prishta putanarisamarcita || 100||
    kantakopanahonnrityadbhakta dandattahasini | akashanilaya cakasha akashayitamadhyama || 101|| alolalola''lola
    calolotsaritandaja | rambhoruyugala rambhapujita ratiranjani || 102|| arambhavadavimukha celakshepapriyasaha
    | anyasangapriyodvigna abhirama hyanuttama || 103|| satvara tvarita turya tarini turagasana | hamsarudha
    vyaghragata simharudha''runadhara || 104|| krittikavratasamprita kartikeyavimohini | karandamakuta
    kamadogdhri kalpadrusamsthita || 105|| vartavyangyavinodeshta vancita vancanapriya | svabhadiptaguha
    svabhabimbiteshta svayangraha || 106|| murdhabhishiktavanita maralagatirishvari | manini manita manahina
    matamahedita || 107|| mitakshari mitahara mitavada'mitaprabha | minakshi mugdhahasana mugdha murtimati
    matih || 108|| mata matrisakhananda maravidya'mritakshara | apancikritabhuteshi pancikrita vasundhara
    || 109|| viphalikritakalpadruraphalikritadanava | anadishatkavipula cadishatkangamalini || 110 | navakakshayitabhata
    navavirasamarcita | rasakridapriya radhavinuta radheyavandita || 111|| rajacakradhara rajni rajivakshasuta
    rama | rama ramadrita ramya ramananda manorama || 112|| rahasyajna rahodhyeya rangastha renukapriya
    | rainukeyanuta revavihara roganashini || 113|| vitanka vigatatanka vitapayitashanmukha | vitipriya
    viruddhvaja virutpritamrigavrita || 114|| visharudha visharatnaprabha'viditavaibhava | citra citraratha
    citrasena citritavigraha || 115|| citrasenanuta citravasana citrita citih | citraguptarcita catuvacana
    carubhushana || 116|| camatkritishcamatkarabhramiteshta calatkaca | chayapatangabimbasya chavinirjitabhaskara
    || 117|| chatradhvajadibiruda chatrahina chavishvari | janani janakananda jahnavitanayapriya || 118||
    jahnavitiraga janapadastha'janimarana | jambhabhedisutananda jambharivinuta jaya || 119 | jayavaha
    jayakari jayashila jayaprada | jinahantri jainahantri jaiminiyaprakirtita || 120|| jvaraghni jvalita
    jvalamala jajvalyabhushana | jvalamukhi jvalatkesha jvaladvallisamudbhava || 121|| jvalatkundantavataradbhakta
    jvalanabhajana | jvalanoddhupitamoda jvaladdiptadharavrita || 122|| jajvalyamana jayini jitamitra
    jitapriya | cintamanishvari chinnamasta cheditadanava || 123|| khadgadharonnataddasa khadgaravanapujita
    | khadgasiddhiprada khetahasta khetaviharini || 124|| khatvangadharajaprita khadirasana samsthita
    | khadini khaditaratih khanishi khanidayini || 125|| ankolitantaraguha ankuradantapanktika | nyankudarasamudbhuta'bhangurapangavikshana
    || 126|| pitrisvamisakhi pativararudha pativrata | prakashita paradristha jayantipurapalini || 127||
    phaladristha phalaprita pandyabhupalavandita | aphala saphala phaladrikkumaratapahphala || 128|| kumarakoshthaga
    kuntashakticihnadharavrita | smarabanayitaloka smaravidyohitakritih || 129|| kalameghayitakaca kamasaubhagya
    varidhih | kantalakanta kamedya karakonnartana priya || 130|| paunah punyapriyalaya pampavadyapriyadhika
    | ramaniya smaraniya bhajaniya paratpara || 131|| nilavajigata nilakhadga nilamshuka'nila | ratrirnidra
    bhagavati nidrakartri vibhavari || 132|| shukayamanakayoktih kimshukabhadharambara | shukamanitacidrupa
    samshukantaprasadhini || 133|| gudhokta gudhagadita guhasanketita'gaga | dhairya dhairyavati dhatripreshita'vaptakamana
    || 134|| sandrishta kukkutaravadhvastadhammillajivini | bhadra bhadraprada bhaktavatsala bhadradayini
    || 135|| bhanukotipratikasha candrakotisushitala | jvalanantahsthita bhaktavinuta bhaskaredita ||
    136|| abhangura bharahina bharati bharatidita | bharatedya bharateshi bhuvaneshi bhayapaha || 137||
    bhairavi bhairavisevya bhoktri bhogindrasevita | bhogedita bhogakari bherunda bhagamalini || 138||
    bhagaradhya bhagavatapragita'bhedavadini | anya'nanya nijananya svananya'nanyakamini || 139|| yajneshvari
    yagashila yajnodgitaguhanuga | subrahmanyaganarata subrahmanyasukhaspada || 140|| kumbhajedya kutukita
    kausumbhambaramandita | samskrita samskritarava sarvavayavasundari || 141|| bhuteshi bhutida bhutih
    bhutaveshanivarini | bhushanayitabhutanda bhucakra bhudharashrita || 142|| bhulokadevata bhuma bhumida
    bhumikanyaka | bhusuredya bhusurarivimukha bhanubimbaga || 143|| puratana'bhutapurva'vijatiya'dhunatana
    | apara svagatabheda sajatiyavibhedini || 144|| anantara'ravindabha hridya hridayasamsthita | hrimati
    hridayasakta hrishta hrinmohabhaskara || 145|| harini harini hara harayitavilasini | hararavapramudita
    hirada hirabhushana || 146|| hirabhridvinuta hema hemacalanivasini | homapriya hautrapara hunkara
    humphadujjvala || 147|| hutashanedita helamudita hemabhushana | jnaneshvari jnatatattva jneya jneyavivarjita
    || 148|| jnanam jnanakritirjnanivinuta jnativarjita | jnatakhila jnanadatri jnatajnatavivarjita ||
    149|| jneyananya jneyaguha vijneya'jneyavarjita | ajnakari parajnata prajna prajnavasheshita || 150||
    svajnadhinamara'nujnakankshonnrityatsurangana | sagaja agajananda saguha aguhantara || 151|| sadhara
    ca niradhara bhudharastha'tibhudhara | saguna cagunakara nirguna ca gunadhika || 152|| ashesha cavisheshedya
    shubhada cashubhapaha | atarkya vyakrita nyayakovida tattvabodhini || 153|| sankhyokta kapilananda
    vaisheshikavinishcita | puranaprathita'parakaruna vakpradayini || 154|| sankhyavihina'sankhyeya susmrita
    vismritapaha | virabahunuta virakesariditavaibhava || 155|| viramahendravinuta viramaheshvararcita
    | virarakshasasampujya viramartandavandita || 156|| virantakastuta virapurandarasamarcita | viradhirarcitapada
    navavirasamashrita || 157|| bhairavashtakasamsevya brahmadyashtakasevita | indradyashtakasampujya
    vajradyayudhashobhita || 158|| angavaranasamyukta canangamritavarshini | tamohantri tapolabhya tamalarucira'bala
    || 159|| sananda sahajananda guhanandavivardhini | parananda shivananda saccidanandarupini || 160||
    putrada vasuda saukhyadatri sarvarthadayini | yogarudha yogivandya yogada guhayogini || 161|| pramada
    pramadakara pramadatri pramamayi | bhramapaha bhramayitri pradhana prabala prama || 162|| prashanta
    pramitananda paramanandanirbhara | paravara parotkarsha parvatitanayapriya || 163|| prasadhita prasannasya
    pranayamapararcita | pujita sadhuvinuta surasasvadita sudha || 164|| svamini svamivanita samanistha
    samanita | sarvasammohini vishvajanani shaktirupini || 165|| kumaradakshinotsangavasini bhogamokshada
    || om | evam namasahasram te proktam narada shobhanam || 166|| subrahmanyasya kantaya vallidevyah
    priyankaram | nityam sankirtayedetatsarvankamanavapnuyat || 167|| shukravare bhaumavare shashthyam
    va krittikasyapi | sankramadishu kaleshu grahane candrasuryayoh || 168|| pathedidam visheshena sarvasiddhimavapnuyat
    | ebhirnamabhirambam yah kunkumadibhirarcayet || 169|| yadyadvanchati tatsarvamacirajjayate dhruvam
    | subrahmanyo'pi satatam pritah sarvarthado bhavet || 170|| putrapautradidam sarvasampatprada maghapaham
    | vidyapradam visheshena sarvaroganivartakam || 171|| dushtarishtaprashamanam grahashantikaram varam
    | japadasya prabhavena sarvah siddhyanti siddhayah | gopaniyam patha tvam ca sarvamapnuhi narada ||
    172|| || skande shankarasamhitatah ||
  devanagari: ृङ्गबेरपुराश्रिता । श्रिताभीष्टप्रदा श्रीड्या श्रीजा श्रीमन्त्रवादिनी ॥ ६३॥ श्रीविद्या श्रीपरा
    श्रीशा श्रीमयी श्रीगिरिस्थिता । शोणाधरा शोभनाङ्गी शोभना शोभनप्रदा ॥ ६४॥ शेषहीना शेषपूज्या शेषतल्पसमुद्भवा
    । शूरसेना शूरपद्मकुलधूमपताकिका ॥ ६५॥ शून्यापाया शून्यकटिः शून्यसिंहासनस्थिता । शून्यलिङ्गा शून्य शून्या
    शौरिजा शौर्यवर्धिनी ॥ ६६॥ शरानेकस्यूतकायभक्तसङ्घाश्रितालया । शश्वद्वैवधिकस्तुत्या शरण्या शरणप्रदा
    ॥ ६७॥ अरिगण्डादिभयकृद्यन्त्रोद्वाहिजनार्चिता । कालकण्ठस्नुषा कालकेशा कालभयङ्करी ॥ ६८॥ अजावाहा चाजामित्रा
    चाजासुरहरा ह्यजा । अजामुखीसुतारातिपूजिता चाजराऽमरा ॥ ६९॥ आजानपावनाऽद्वैता आसमुद्रक्षितीश्वरी । आसेतुहिमशैलार्च्या
    आकुञ्चित शिरोरुहा ॥ ७०॥ आहाररसिका चाद्या आश्चर्यनिलया तथा । आधारा च तथाऽऽधेया तथाचाधेयवर्जिता ॥ ७१॥
    आनुपूर्वीक्लृप्तरथा चाशापालसुपूजिता । उमास्नुषा उमासूनुप्रिया चोत्सवमोदिता ॥ ७२॥ ऊर्ध्वगा ऋद्धिदा
    ऋद्धा औषधीशातिशायिनी । औपम्यहीना चौत्सुक्यकरी चौदार्यशालिनी ॥ ७३॥ श्रीचक्रवालातपत्रा श्रीवत्साङ्कितभूषणा
    । श्रीकान्तभागिनेयेष्टा श्रीमुखाब्दाधिदेवता ॥ ७४॥ इयं नारी वरनुता पीनोन्नतकुचद्वया । श्यामा यौवनमध्यस्था
    का जाता सा गृहादृता ॥ ७५॥ एषा सम्मोहिनी देवी प्रियलक्ष्या वराश्रिता । कामाऽनुभुक्ता मृगयासक्ताऽऽवेद्या
    गुहाश्रिता ॥ ७६॥ पुलिन्दवनितानीता रहः कान्तानुसारिणी । निशा चाक्रीडिताऽऽबोध्या निर्निद्रा पुरुषायिता
    ॥ ७७॥ स्वयंवृता सुदृक् सूक्ष्मा सुब्रह्मण्यमनोहरा । परिपूर्णाचलारूढा शबरानुमताऽनघा ॥ ७८॥ चन्द्रकान्ता
    चन्द्रमुखी चन्दनागरुचर्चिता । चाटुप्रियोक्तिमुदिता श्रेयोदात्री विचिन्तिता ॥ ७९॥ मूर्धास्फाटिपुराधीशा
    मूर्धारूढपदाम्बुजा । मुक्तिदा मुदिता मुग्धा मुहुर्ध्येया मनोन्मनी ॥ ८०॥ चित्रितात्मप्रियाकारा चिदम्बरविहारिणी
    । चतुर्वेदस्वरारावा चिन्तनीया चिरन्तनी ॥ ८१॥ कार्तिकेयप्रिया कामसहजा कामिनीवृता । काञ्चनाद्रिस्थिता
    कान्तिमती साधुविचिन्तिता ॥ ८२॥ नारायणसमुद्भूता नागरत्नविभूषणा । नारदोक्तप्रियोदन्ता नम्या कल्याणदायिनी
    ॥ ८३॥ नारदाभीष्टजननी नाकलोकनिवासिनी । नित्यानन्दा निरतिशया नामसाहस्रपूजिता ॥ ८४॥ पितामहेष्टदा पीता
    पीताम्बरसमुद्भवा । पीताम्बरोज्ज्वला पीननितम्बा प्रार्थिता परा ॥ ८५॥ गण्या गणेश्वरी गम्या गहनस्था गजप्रिया
    । गजारूढा गजगतिः गजाननविनोदिनी ॥ ८६॥ अगजाननपद्मार्का गजाननसुधाकरा । गन्धर्ववन्द्या गन्धर्वतन्त्रा
    गन्धविनोदिनी ॥ ८७॥ गान्धर्वोद्वाहिता गीता गायत्री गानतत्परा । गतिर्गहनसम्भूता गाढाश्लिष्टशिवात्मजा
    ॥ ८८॥ गूढा गूढचरा गुह्या गुह्यकेष्टा गुहाश्रिता । गुरुप्रिया गुरुस्तुत्य गुण्या गुणिगणाश्रिता ॥ ८९॥
    गुणगण्या गूढरतिः गीर्गीर्विनुतवैभवा । गीर्वाणी गीतमहिमा गीर्वाणेश्वरसन्नुता ॥ ९०॥ गीर्वाणाद्रिकृतावासा
    गजवल्ली गजाश्रिता । गाङ्गेयवनिता गङ्गासूनुकान्ता गिरीश्वरी ॥ ९१॥ देवसेनासपत्नी या देवेन्द्रानुजसम्भवा
    । देवरेभभयाविष्टा सरस्तीरलुठद्गतिः ॥ ९२॥ वृद्धवेषगुहाक्लिष्टा भीता सर्वाङ्गसुन्दरी । निशासमानकबरी
    निशाकरसमानना ॥ ९३॥ निर्निद्रिताक्षिकमला निष्ठ्यूतारुणभाधरा । शिवाचार्यसती शीता शीतला शीतलेक्षणा ॥
    ९४॥ किमेतदिति साशङ्कभटा धम्मिल्लमार्गिता । धम्मिल्लसुन्दरी धर्त्री धात्री धातृविमोचिनी ॥ ९५॥ धनदा
    धनदप्रीता धनेशी धनदेश्वरी । धन्या ध्यानपरा धारा धराधारा धराधरा ॥ ९६॥ धरा धराधरोद्भूता धीरा धीरसमर्चिता
    । किं करोषीति सम्पृष्टगुहा साकूतभाषिणी ॥ ९७॥ रहो भवतु तद्भूयात् शमित्युक्तप्रिया स्मिता । कुमारज्ञात
    काठिन्यकुचाऽर्धोरुलसत्कटी ॥ ९८॥ कञ्चुकी कञ्चुकाच्छन्ना काञ्चीपट्टपरिष्कृता । व्यत्यस्तकच्छा विन्यस्तदक्षिणांसांशुकाऽतुला
    ॥ ९९॥ बन्धोत्सुकितकान्तान्ता पुरुषायितकौतुका । पूता पूतवती पृष्टा पूतनारिसमर्चिता ॥ १००॥ कण्टकोपानहोन्नृत्यद्भक्ता
    दण्डाट्टहासिनी । आकाशनिलया चाकाशा आकाशायितमध्यमा ॥ १०१॥ आलोललोलाऽऽलोला चालोलोत्सारिताण्डजा । रम्भोरुयुगला
    रम्भापूजिता रतिरञ्जनी ॥ १०२॥ आरम्भवादविमुखा चेलाक्षेपप्रियासहा । अन्यासङ्गप्रियोद्विग्ना अभिरामा ह्यनुत्तमा
    ॥ १०३॥ सत्वरा त्वरिता तुर्या तारिणी तुरगासना । हंसारूढा व्याघ्रगता सिंहारूढाऽऽरुणाधरा ॥ १०४॥ कृत्तिकाव्रतसम्प्रीता
    कार्तिकेयविमोहिनी । करण्डमकुटा कामदोग्ध्री कल्पद्रुसंस्थिता ॥ १०५॥ वार्ताव्यङ्ग्यविनोदेष्टा वञ्चिता
    वञ्चनप्रिया । स्वाभादीप्तगुहा स्वाभाबिम्बितेष्टा स्वयङ्ग्रहा ॥ १०६॥ मूर्धाभिषिक्तवनिता मरालगतिरीश्वरी
    । मानिनी मानिता मानहीना मातामहेडिता ॥ १०७॥ मिताक्षरी मिताहारा मितवादाऽमितप्रभा । मीनाक्षी मुग्धहसना
    मुग्धा मूर्तिमती मतिः ॥ १०८॥ माता मातृसखानन्दा मारविद्याऽमृताक्षरा । अपञ्चीकृतभूतेशी पञ्चीकृत वसुन्धरा
    ॥ १०९॥ विफलीकृतकल्पद्रुरफलीकृतदानवा । अनादिषट्कविपुला चादिषट्काङ्गमालिनी ॥ ११० । नवकक्षायितभटा नववीरसमर्चिता
    । रासक्रीडाप्रिया राधाविनुता राधेयवन्दिता ॥ १११॥ राजचक्रधरा राज्ञी राजीवाक्षसुता रमा । रामा रामादृता
    रम्या रामानन्दा मनोरमा ॥ ११२॥ रहस्यज्ञा रहोध्येया रङ्गस्था रेणुकाप्रिया । रैणुकेयनुता रेवाविहारा रोगनाशिनी
    ॥ ११३॥ विटङ्का विगताटङ्का विटपायितषण्मुखा । वीटिप्रिया वीरुड्ध्वजा वीरुट्प्रीतमृगावृता ॥ ११४॥ वीशारूढा
    वीशरत्नप्रभाऽविदितवैभवा । चित्रा चित्ररथा चित्रसेना चित्रितविग्रहा ॥ ११५॥ चित्रसेननुता चित्रवसना चित्रिता
    चितिः । चित्रगुप्तार्चिता चाटुवचना चारुभूषणा ॥ ११६॥ चमत्कृतिश्चमत्कारभ्रमितेष्टा चलत्कचा । छायापतङ्गबिम्बास्या
    छविनिर्जितभास्करा ॥ ११७॥ छत्रध्वजादिबिरुदा छात्रहीना छवीश्वरी । जननी जनकानन्दा जाह्नवीतनयप्रिया ॥
    ११८॥ जाह्नवीतीरगा जानपदस्थाऽजनिमारणा । जम्भभेदिसुतानन्दा जम्भारिविनुता जया ॥ ११९ । जयावहा जयकरी जयशीला
    जयप्रदा । जिनहन्त्री जैनहन्त्री जैमिनीयप्रकीर्तिता ॥ १२०॥ ज्वरघ्नी ज्वलिता ज्वालामाला जाज्वल्यभूषणा
    । ज्वालामुखी ज्वलत्केशा ज्वलद्वल्लीसमुद्भवा ॥ १२१॥ ज्वलत्कुण्डान्तावतरद्भक्ता ज्वलनभाजना । ज्वलनोद्धूपितामोदा
    ज्वलद्दीप्तधरावृता ॥ १२२॥ जाज्वल्यमाना जयिनी जितामित्रा जितप्रिया । चिन्तामणीश्वरी छिन्नमस्ता छेदितदानवा
    ॥ १२३॥ खड्गधारोन्नटद्दासा खड्गरावणपूजिता । खड्गसिद्धिप्रदा खेटहस्ता खेटविहारिणी ॥ १२४॥ खट्वाङ्गधरजप्रीता
    खादिरासन संस्थिता । खादिनी खादितारातिः खनीशी खनिदायिनी ॥ १२५॥ अङ्कोलितान्तरगुहा अङ्कुरदन्तपङ्क्तिका
    । न्यङ्कूदरसमुद्भूताऽभङ्गुरापाङ्गवीक्षणा ॥ १२६॥ पितृस्वामिसखी पतिवरारूढा पतिव्रता । प्रकाशिता पराद्रिस्था
    जयन्तीपुरपालिनी ॥ १२७॥ फलाद्रिस्था फलप्रीता पाण्ड्यभूपालवन्दिता । अफला सफला फालदृक्कुमारतपःफला ॥ १२८॥
    कुमारकोष्ठगा कुन्तशक्तिचिह्नधरावृता । स्मरबाणायितालोका स्मरविद्योहिताकृतिः ॥ १२९॥ कालमेघायितकचा कामसौभाग्य
    वारिधिः । कान्तालकान्ता कामेड्या करकोन्नर्तन प्रिया ॥ १३०॥ पौनः पुन्यप्रियालाया पम्पावाद्यप्रियाधिका
    । रमणीया स्मरणीया भजनीया परात्परा ॥ १३१॥ नीलवाजिगता नीलखड्गा नीलांशुकाऽनिला । रात्रिर्निद्रा भगवती
    निद्राकर्त्री विभावरी ॥ १३२॥ शुकायमानकायोक्तिः किंशुकाभाधराम्बरा । शुकमानितचिद्रूपा संशुकान्तप्रसाधिनी
    ॥ १३३॥ गूढोक्ता गूढगदिता गुहसङ्केतिताऽगगा । धैर्या धैर्यवती धात्रीप्रेषिताऽवाप्तकामना ॥ १३४॥ सन्दृष्टा
    कुक्कुटारावध्वस्तधम्मिल्लजीविनी । भद्रा भद्रप्रदा भक्तवत्सला भद्रदायिनी ॥ १३५॥ भानुकोटिप्रतीकाशा चन्द्रकोटिसुशीतला
    । ज्वलनान्तःस्थिता भक्तविनुता भास्करेडिता ॥ १३६॥ अभङ्गुरा भारहीना भारती भारतीडिता । भरतेड्या भारतेशी
    भुवनेशी भयापहा ॥ १३७॥ भैरवी भैरवीसेव्या भोक्त्री भोगीन्द्रसेविता । भोगेडिता भोगकरी भेरुण्डा भगमालिनी
    ॥ १३८॥ भगाराध्या भागवतप्रगीताऽभेदवादिनी । अन्याऽनन्या निजानन्या स्वानन्याऽनन्यकामिनी ॥ १३९॥ यज्ञेश्वरी
    यागशीला यज्ञोद्गीतगुहानुगा । सुब्रह्मण्यगानरता सुब्रह्मण्यसुखास्पदा ॥ १४०॥ कुम्भजेड्या कुतुकिता कौसुम्भाम्बरमण्डिता
    । संस्कृता संस्कृतारावा सर्वावयवसुन्दरी ॥ १४१॥ भूतेशी भूतिदा भूतिः भूतावेशनिवारिणी । भूषणायितभूताण्डा
    भूचक्रा भूधराश्रिता ॥ १४२॥ भूलोकदेवता भूमा भूमिदा भूमिकन्यका । भूसुरेड्या भूसुरारिविमुखा भानुबिम्बगा
    ॥ १४३॥ पुरातनाऽभूतपूर्वाऽविजातीयाऽधुनातना । अपरा स्वगताभेदा सजातीयविभेदिनी ॥ १४४॥ अनन्तराऽरविन्दाभा
    हृद्या हृदयसंस्थिता । ह्रीमती हृदयासक्ता हृष्टा हृन्मोहभास्करा ॥ १४५॥ हारिणी हरिणी हारा हारायितविलासिनी
    । हरारावप्रमुदिता हीरदा हीरभूषणा ॥ १४६॥ हीरभृद्विनुता हेमा हेमाचलनिवासिनी । होमप्रिया हौत्रपरा हुङ्कारा
    हुम्फडुज्ज्वला ॥ १४७॥ हुताशनेडिता हेलामुदिता हेमभूषणा । ज्ञानेश्वरी ज्ञाततत्त्वा ज्ञेया ज्ञेयविवर्जिता
    ॥ १४८॥ ज्ञानं ज्ञानाकृतिर्ज्ञानिविनुता ज्ञातिवर्जिता । ज्ञाताखिला ज्ञानदात्री ज्ञाताज्ञातविवर्जिता
    ॥ १४९॥ ज्ञेयानन्या ज्ञेयगुहा विज्ञेयाऽज्ञेयवर्जिता । आज्ञाकरी पराज्ञाता प्राज्ञा प्रज्ञावशेषिता ॥
    १५०॥ स्वाज्ञाधीनामराऽनुज्ञाकाङ्क्षोन्नृत्यत्सुराङ्गना । सगजा अगजानन्दा सगुहा अगुहान्तरा ॥ १५१॥ साधारा
    च निराधारा भूधरस्थाऽतिभूधरा । सगुणा चागुणाकारा निर्गुणा च गुणाधिका ॥ १५२॥ अशेषा चाविशेषेड्या शुभदा
    चाशुभापहा । अतर्क्या व्याकृता न्यायकोविदा तत्त्वबोधिनी ॥ १५३॥ साङ्ख्योक्ता कपिलानन्दा वैशेषिकविनिश्चिता
    । पुराणप्रथिताऽपारकरुणा वाक्प्रदायिनी ॥ १५४॥ सङ्ख्याविहीनाऽसङ्ख्येया सुस्मृता विस्मृतापहा । वीरबाहुनुता
    वीरकेसरीडितवैभवा ॥ १५५॥ वीरमाहेन्द्रविनुता वीरमाहेश्वरार्चिता । वीरराक्षससम्पूज्या वीरमार्तण्डवन्दिता
    ॥ १५६॥ वीरान्तकस्तुता वीरपुरन्दरसमर्चिता । वीरधीरार्चितपदा नववीरसमाश्रिता ॥ १५७॥ भैरवाष्टकसंसेव्या
    ब्रह्माद्यष्टकसेविता । इन्द्राद्यष्टकसम्पूज्या वज्राद्यायुधशोभिता ॥ १५८॥ अङ्गावरणसंयुक्ता चानङ्गामृतवर्षिणी
    । तमोहन्त्री तपोलभ्या तमालरुचिराऽबला ॥ १५९॥ सानन्दा सहजानन्दा गुहानन्दविवर्धिनी । परानन्दा शिवानन्दा
    सच्चिदानन्दरूपिणी ॥ १६०॥ पुत्रदा वसुदा सौख्यदात्री सर्वार्थदायिनी । योगारूढा योगिवन्द्या योगदा गुहयोगिनी
    ॥ १६१॥ प्रमदा प्रमदाकारा प्रमादात्री प्रमामयी । भ्रमापहा भ्रामयित्री प्रधाना प्रबला प्रमा ॥ १६२॥ प्रशान्ता
    प्रमितानन्दा परमानन्दनिर्भरा । पारावारा परोत्कर्षा पार्वतीतनयप्रिया ॥ १६३॥ प्रसाधिता प्रसन्नास्या
    प्राणायामपरार्चिता । पूजिता साधुविनुता सुरसास्वादिता सुधा ॥ १६४॥ स्वामिनी स्वामिवनिता समनीस्था समानिता
    । सर्वसम्मोहिनी विश्वजननी शक्तिरूपिणी ॥ १६५॥ कुमारदक्षिणोत्सङ्गवासिनी भोगमोक्षदा ॥ ॐ । एवं नामसहस्रं
    ते प्रोक्तं नारद शोभनम् ॥ १६६॥ सुब्रह्मण्यस्य कान्ताया वल्लीदेव्याः प्रियङ्करम् । नित्यं सङ्कीर्तयेदेतत्सर्वान्कामानवाप्नुयात्
    ॥ १६७॥ शुक्रवारे भौमवारे षष्ठ्यां वा कृत्तिकास्यपि । सङ्क्रमादिषु कालेषु ग्रहणे चन्द्रसूर्ययोः ॥ १६८॥
    पठेदिदं विशेषेण सर्वसिद्धिमवाप्नुयात् । एभिर्नामभिरम्बां यः कुङ्कुमादिभिरर्चयेत् ॥ १६९॥ यद्यद्वाञ्छति
    तत्सर्वमचिराज्जायते ध्रुवम् । सुब्रह्मण्योऽपि सततं प्रीतः सर्वार्थदो भवेत् ॥ १७०॥ पुत्रपौत्रादिदं
    सर्वसम्पत्प्रद मघापहम् । विद्याप्रदं विशेषेण सर्वरोगनिवर्तकम् ॥ १७१॥ दुष्टारिष्टप्रशमनं ग्रहशान्तिकरं
    वरम् । जपादस्य प्रभावेण सर्वाः सिद्ध्यन्ति सिद्धयः । गोपनीयं पठ त्वं च सर्वमाप्नुहि नारद ॥ १७२॥ ॥
    स्कान्दे शङ्करसंहितातः ॥
