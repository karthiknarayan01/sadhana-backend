id: m-ityunjayastotram2np
category: stotram
name:
  english: mṟityunjayastotram2nP
  devanagari: म्ऱित्युन्जयस्तोत्रम्२ण्P
content:
  english: namo'stu te devadeva mahacitta mahakaya mahaprajna mahadeva mahakirte brahmendracandrarudrarcita
    padayugala shripadmahasta sammarditadaityadeha || 33|| anantabhogashayanarpitasarvanga sanakasanandanasanatkumaradyairyogibhirnasagranyastalocanairanavaratamabhicintitamokshatattva
    | gandharvavidyadharayakshakinnarakimpurushairaharahogiyamanadivyayashah || 34|| nrisimha narayana
    padmanabha govinda govardhanaguhanivasa yogishvara yogadhara deveshvara jaleshvara maheshvara || 35||
    yogadhara mahamayadhara vidyadhara yashodhara kirtidhara trigunanivasa tritattvadhara tretagnidhara
    || 36|| trivedabhak triniketa trisuparna tridandadhara || 37|| snigdhameghabharcitadyutivirajita pitambaradhara
    kiritakatakakeyuraharamaniratnamshudiptividyotitasarvadisha || 38|| kanakamanikundalamanditagandasthala
    madhusudana vishvamurte || 39|| lokanatha yajneshvara yajnapriya tejomaya bhaktipriya vasudeva duritapahararadhya
    purushottama namo'stu te || 40|| iti | narasimhapurana adhyaya 10 shlokasamkhya 52 shrinarasimhapurane
    markandeyacaritre dashamo'dhyayah || 10||
  devanagari: नमोऽस्तु ते देवदेव महाचित्त महाकाय महाप्राज्ञ महादेव महाकीर्ते ब्रह्मेन्द्रचन्द्ररुद्रार्चित
    पादयुगल श्रीपद्महस्त सम्मर्दितदैत्यदेह ॥ ३३॥ अनन्तभोगशयनार्पितसर्वाङ्ग सनकसनन्दनसनत्कुमाराद्यैर्योगिभिर्नासाग्रन्यस्तलोचनैरनवरतमभिचिन्तितमोक्षतत्त्व
    । गन्धर्वविद्याधरयक्षकिन्नरकिम्पुरुषैरहरहोगीयमानदिव्ययशः ॥ ३४॥ नृसिंह नारायण पद्मनाभ गोविन्द गोवर्धनगुहानिवास
    योगीश्वर योगधर देवेश्वर जलेश्वर महेश्वर ॥ ३५॥ योगधर महामायाधर विद्याधर यशोधर कीर्तिधर त्रिगुणनिवास
    त्रितत्त्वधर त्रेताग्निधर ॥ ३६॥ त्रिवेदभाक् त्रिनिकेत त्रिसुपर्ण त्रिदण्डधर ॥ ३७॥ स्निग्धमेघाभार्चितद्युतिविराजित
    पीताम्बरधर किरीटकटककेयूरहारमणिरत्नांशुदीप्तिविद्योतितसर्वदिश ॥ ३८॥ कनकमणिकुण्डलमण्डितगण्डस्थल मधुसूदन
    विश्वमूर्ते ॥ ३९॥ लोकनाथ यज्ञेश्वर यज्ञप्रिय तेजोमय भक्तिप्रिय वासुदेव दुरितापहाराराध्य पुरुषोत्तम
    नमोऽस्तु ते ॥ ४०॥ इति । नरसिंहपुराण अध्याय १० श्लोकसंख्या ५२ श्रीनरसिंहपुराणे मार्कण्डेयचरित्रे दशमोऽध्यायः
    ॥ १०॥
