id: aravindopanishat
category: upanishad
name:
  english: aravindopanishat
  devanagari: अरविन्दोपनिषत्
content:
  english: tatheha jagadbrahma satyaprakasho bhagavatah na svaprah na mayanvitam nalika bhatih satah satyaprakashastu
    tad na svayam bhagavan tathapi svayameva sah | esha para mayaisha yogamahatmyam rahasyamayasya yogeshvarasya
    krishnasyaisha cicchaktya anandamayi lila parasyatarkya gatih | sarvamidamarthatah satyam pararthatah
    asatyamiti manastushtyartham vijnanarthamucyatam na hi kincidapyasatyam satye brahmani | evam yat
    prakashate jagadananda eva tat | om tatsat yacca saccideva tadyacca cit sa anandah | yattu niranandamiti
    bhasate duh khamiti durbalamityajnanamiti tadanandasya vikara anandasya krida | yo hi jivah sa anandamayah
    pracchanno bhagavan svaprakashamayam jagadbrahma bhoktumavatirnah | ya esha duhkhabhogah sa bhoga
    evanandamayastasyanandamevanandamayo bhunkte | ko hi niranandam bhoktumutsaheta yah sarvanandamayah
    sa evotsahate nirandamayastu niranandam bhunjanah na bhunjitanandam vina pranashyet | ko durbalo bhavitum
    shaknuyadyah sarvashaktiman sa eva shaknuyad durbalo hyakranto durbalatvena na tishthecchaktim vina
    pranashyet | ko'jnanam praveshtum samartho yah sarvajnanamayah sa eva samartho'jnastu tasmimstimire
    na dhriyetasattvasadeva bhaved jnanam vina pranashyet | jnanasya kridajnanam svasminnatmagopanam shakteh
    krida daurbalyam niranandamanandasya kridatmagopanam svatmani | sanandam hasati jivah sanandam krandatyashruni
    muncati tamomaya anande bhasamana iva yatanabhishceshtamanah sanandam sphurati sanandam sphurati ceshtamanah
    pracandabhi ratibhih | purnabhogartham tasyanandasya tamasasyamshasya tamaso bhutvanandam gopayati
    | ajnanam mulametasya bhavasya santa evahamityashakto durbalo duhkhi maya kartavyam jnatavyam labdhavyam
    prayasena tapah kshayena mrityuna sa tvamesho'ham yattvam na tadaham yattava shubham tanmamashubham
    yena tava labhastena mama hanih tvameva hanyam sukhi bhavishyami naiva sattviko'ham tvameva sukhinam
    karomi svaduhkhena svahanya svamrityunetyadyajnanasya svarupam manasi | ahankara eva bijamahankaramokshadajnanamokshah
    ajnanamokshad duhkhanmucyate anandamayo'ham so'hameko'hamananto'ham sarvo'hamiti vijnayanandamayo
    bhavatyanando bhavati | esha eva mokshah | sa muktah sarvesham bhogan bhunkte sarvananandananantam
    bhunjano na santairviyujyate santani bhunjano nanantena hiyate sa eko bhavati bahurbhavati sa hyajo
    jayata iva jayamano'pi na jayate na badhyate na janma tasya vidyate atmanyatmatmana prakashayamyatmanamiti
    jnanad vimuktah kridate | lilartham hi jagadanandartham lilamaya iti lilam kurutanandasya putrah yuktah
    kridatanandam bhunghvamekam bhogyam bhagavantam prapya bhunghvam sarvavastushu | anandam hi pravakshyami
    bhagavatadishtah | tamasamapavrityanandah prakashatam tasya putrah |
  devanagari: तथेह जगद्ब्रह्म सत्यप्रकाशो भगवतः न स्वप्रः न मायान्वितं नालीका भातिः सतः सत्यप्रकाशस्तु
    तद् न स्वयं भगवान् तथापि स्वयमेव सः । एषा परा मायैषा योगमाहात्म्यं रहस्यमयस्य योगेश्वरस्य कृष्णस्यैषा
    चिच्छक्त्या आनन्दमयी लीला परस्यातर्क्या गतिः । सर्वमिदमर्थतः सत्यं परार्थतः असत्यमिति मनस्तुष्ट्यर्थं
    विज्ञानार्थमुच्यतां न हि किञ्चिदप्यसत्यं सत्ये ब्रह्मणि । एवं यत् प्रकाशते जगदानन्द एव तत् । ओं तत्सत्
    यच्च सच्चिदेव तद्यच्च चित् स आनन्दः । यत्तु निरानन्दमिति भासते दुः खमिति दुर्बलमित्यज्ञानमिति तदानन्दस्य
    विकार आनन्दस्य क्रीडा । यो हि जीवः स आनन्दमयः प्रच्छन्नो भगवान् स्वप्रकाशमयं जगद्ब्रह्म भोक्तुमवतीर्णः
    । य एष दुःखभोगः स भोग एवानन्दमयस्तस्यानन्दमेवानन्दमयो भुङ्क्ते । को हि निरानन्दं भोक्तुमुत्सहेत यः
    सर्वानन्दमयः स एवोत्सहते निरान्दमयस्तु निरानन्दं भुञ्जानः न भुञ्जीतानन्दं विना प्रणश्येत् । को दुर्बलो
    भवितुं शक्नुयाद्यः सर्वशक्तिमान् स एव शक्नुयाद् दुर्बलो ह्याक्रान्तो दुर्बलत्वेन न तिष्ठेच्छक्तिं
    विना प्रणश्येत् । कोऽज्ञानं प्रवेष्टुं समर्थो यः सर्वज्ञानमयः स एव समर्थोऽज्ञस्तु तस्मिंस्तिमिरे न
    ध्रियेतासत्त्वसदेव भवेद् ज्ञानं विना प्रणश्येत् । ज्ञानस्य क्रीडाज्ञानं स्वस्मिन्नात्मगोपनं शक्तेः
    क्रीडा दौर्बल्यं निरानन्दमानन्दस्य क्रीडात्मगोपनं स्वात्मनि । सानन्दं हसति जीवः सानन्दं क्रन्दत्यश्रूणि
    मुञ्चति तमोमय आनन्दे भासमान इव यातनाभिश्चेष्टमानः सानन्दं स्फुरति सानन्दं स्फुरति चेष्टमानः प्रचण्डाभी
    रतिभिः । पूर्णभोगार्थं तस्यानन्दस्य तामसस्यांशस्य तामसो भूत्वानन्दं गोपयति । अज्ञानं मूलमेतस्य भावस्य
    सान्त एवाहमित्यशक्तो दुर्बलो दुःखी मया कर्तव्यं ज्ञातव्यं लब्धव्यं प्रयासेन तपः क्षयेण मृत्युना स
    त्वमेषोऽहं यत्त्वं न तदहं यत्तव शुभं तन्ममाशुभं येन तव लाभस्तेन मम हानिः त्वामेव हन्यां सुखी भविष्यामि
    नैव सात्त्विकोऽहं त्वामेव सुखिनं करोमि स्वदुःखेन स्वहान्या स्वमृत्युनेत्याद्यज्ञानस्य स्वरूपं मनसि
    । अहङ्कार एव बीजमहङ्कारमोक्षादज्ञानमोक्षः अज्ञानमोक्षाद् दुःखान्मुच्यते आनन्दमयोऽहं सोऽहमेकोऽहमनन्तोऽहं
    सर्वोऽहमिति विज्ञायानन्दमयो भवत्यानन्दो भवति । एष एव मोक्षः । स मुक्तः सर्वेषां भोगान् भुङ्क्ते सर्वानानन्दाननन्तं
    भुञ्जानो न सान्तैर्वियुज्यते सान्तानि भुञ्जानो नानन्तेन हीयते स एको भवति बहुर्भवति स ह्यजो जायत इव
    जायमानोऽपि न जायते न बध्यते न जन्म तस्य विद्यते आत्मन्यात्मात्मना प्रकाशयाम्यात्मानमिति ज्ञानाद् विमुक्तः
    क्रीडते । लीलार्थं हि जगदानन्दार्थं लीलामय इति लीलां कुरुतानन्दस्य पुत्राः युक्ताः क्रीडतानन्दं भुङ्घ्वमेकं
    भोग्यं भगवन्तं प्राप्य भुङ्घ्वं सर्ववस्तुषु । आनन्दं हि प्रवक्ष्यामि भगवतादिष्टः । तामसमपावृत्यानन्दः
    प्रकाशतां तस्य पुत्राः ।
