id: maa-telugu-talliki-malle-poodanda
category: stotram
name:
  english: Maa Telugu Talliki Malle Poodanda
content:
  english: ma tèlugu talliki mallèpudanda ma kanna talliki mangalaratulu kadupulo bangaru kanucupulo karuna
    cirunavvulo sirulu dòralincu matalli gala gala godari kadali potuntenu bira bira krishnamma parugulidutuntenu
    bangaru pantale pandutayi muripala mutyalu dòralutayi amaravati nagara apurupa shilpalu tyagayya gòntulo
    taradu nadalu tikkayya kalamulo tiyyandanalu nityamai nikhilamai nilaciyundedaka rudramma bhuja shakti
    mallamma pati bhakti timmarusu dhiyukti krishnarayala kirti ma cèvulu ringumani marumrogedaka ni atale
    adutam ni patale padutam jai tèlugu talli
  devanagari: मा तॆलुगु तल्लिकि मल्लॆपूदण्ड मा कन्न तल्लिकि मङ्गलारतुलु कडुपुलो बङ्गारु कनुचूपुलो करुण
    चिरुनव्वुलो सिरुलु दॊरलिञ्चु मातल्लि गल गला गोदारि कदलि पोतुण्टेनु बिर बिरा कृष्णम्म परुगुलिडुतुण्टेनु
    बङ्गारु पण्टले पण्डुतायि मुरिपाल मुत्यालु दॊरलुतायि अमरावती नगर अपुरूप शिल्पालु त्यागय्य गॊन्तुलो
    ताराडु नादालु तिक्कय्य कलमुलो तिय्यन्दनालु नित्यमै निखिलमै निलचियुण्डेदाक रुद्रम्म भुज शक्ति मल्लम्म
    पति भक्ति तिम्मरुसु धीयुक्ति कृष्णरायल कीर्ति मा चॆवुलु रिङ्गुमनि मारुम्रोगेदाक नी आटले आडुतां नी
    पाटले पाडुतां जै तॆलुगु तल्ली
