id: kyts-jata-6-6-suvargaaya-vaa-etaani-lokaaya-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 6.6 Suvargaaya Vaa Etaani Lokaaya - Krishna Yajurveda Taittiriya Samhita
content:
  english: suvargaya vai vai suvargaya suvargaya vai | va eta nyetani vai va etani | etani lokaya loka
    yaita nyetani lokaya | lokaya huyante huyante lokaya lokaya huyante | dyaddhuyante huyante yat | kshinani
    dakshinani ya dakshinani dvabhya ndakshinani dakshinani dvabhya hapatye juhoti juhoti gar ddvipaj
    juhoti juhoti dvipat | dyajamano yajamano dvipa yajamanah pratishthityai pratishthityai yajamano yajamanah
    pratishthityai | pratishthitya agni ddhre pratishthityai pratishthitya agni pratishthitya iti prati
    ddhre juhoti juho tyagni juho tyantarikshe 'ntarikshe juhoti juho tyantarikshe | antariksha evaivantarikshe
    'ntariksha eva | a kramate kramata a kramate | ssadah kramate kramate sadah | eti suvargagm suvarga
    me suvarga mevaiva suvargagm suvarga meva | evaina mena mevai vaina enam ~lokam ~loka mena menam ~lokam
    | ngamayati gamayati lokam ~loka gamayati sauribhyagm sauribhya ngamayati gamayati sauribhya sauribhya
    mrigbhya mrigbhyagm sauribhyagm sauribhya mrigbhyam | hapatya rigbhya mrigbhya hapatye juhoti juhoti
    gar njuhoti juho tyamum | amu mevai vamu mamu meva | evaina mena mevai vaina enam ~lokam ~loka mena
    menam ~lokam | lokagm samarohayati samarohayati lokam ~lokagm samarohayati | samarohayati nayavatya
    nayavatya samarohayati samarohayati nayavatya | ca nayavatya nayavatya r ddhre juhoti juho tyagni
    juhoti suvargasya suvargasya juhoti juhoti suvargasya | suvargasya lokasya lokasya suvargasya suvargasya
    lokasya | suvargasyeti suvah tyai lokasya lokasya bhini rgaccha gaccha suvah | patetiti pata pateti
    | iti hiranyagm hiranya mititi hiranyam | hiranyagm hutva hutva hiranyagm hiranyagm hutva | || hutvo
    duddhutva hutvot | dgrihnati grihna tyudu grihnati suvargagm suvarga ngrihnati grihnati suvargam |
    suvarga mevaiva suvargagm suvarga meva | evaina mena mevai vaina enam ~lokam ~loka mena menam ~lokam
    | ngamayati gamayati lokam ~loka gamayati rupena rupena gamayati gamayati rupena | rupena vo vo rupena
    rupena vah | rupa mabhyabhi rupagm rupa mabhi | ityahahe tityaha | aha rupena rupena haha rupena |
    rupena hi hi rupena rupena hi | hyasa masagm hi hyasam | asagm rupagm rupa masa masagm rupam | rupa
    mabhyabhi rupagm rupa mabhi | yaddhiranyena hiranyena ya hiranyena tutha stutho hiranyena hiranyena
    tuthah | tutho vo va stutha stutho vah | vo vishvaveda vishvaveda vo vo vishvavedah | vishvaveda vi
    vi vishvaveda vishvaveda vi | vishvaveda iti vishva vi bhajatu bhajatu vi vi bhajatu | bhajatvititi
    bhajatu bhajatviti | ityahahe tityaha | aha tutha stutha ahaha tuthah | tutho ha ha tutha stutho ha
    | ha sma sma ha ha sma | sma vai vai sma sma vai | vai vishvaveda vishvaveda vai vai vishvavedah |
    vi~shvaveda vishvaveda devana vishvaveda iti vishva ndakshina dakshina devana dakshina vi vi dakshina
    dakshina vi | vi bhajati bhajati vi vi bhajati | bhajati tena tena bhajati bhajati tena | tenai vaiva
    tena tenaiva | evaina ena evai vainah ena vi vyena ena vi | vi bhajati bhajati vi vi bhajati | dbhajati
    bhaja tyetat | te agne 'gne te te agne | 'gne 'gne radhah | radha a radho radha a | || eti somacyutagm
    somacyuta metyeti somacyutam | somacyuta mititi somacyutagm somacyuta miti | somacyutamiti soma ityahahe
    tityaha | aha somacyutagm somacyuta mahaha somacyutam | somacyutagm hi hi somacyutagm somacyutagm
    hi | somacyutamiti soma hyasyasya hi hyasya | radha a radho radha a | nmitrasya mitrasya ta mitrasya
    patha patha mitrasya mitrasya patha | patha naya naya patha patha naya | nayetiti naya nayeti | ityahahe
    tityaha | aha shantyai shantya ahaha shantyai shantya ritasya r tasya shantyai shantya ritasya | patha
    pra pra patha patha pra | preteta pra preta | ita candradakshina shcandradakshina iteta candradakshinah
    | candradakshina ititi candradakshina shcandradakshina iti | candradakshina iti candra ityahahe tityaha
    | aha satyagm satya mahaha satyam | vai~ vai satyagm satyam ritagm satyena satyena r ta mritagm satyena
    | satyenaivaiva satyena satyenaiva | evaina ena evai vainah tenaina ena ritena | ritena vi vyritena
    r vi bhajati bhajati vi vi bhajati | bhajati yajnasya yajnasya bhajati bhajati yajnasya | yajnasya
    patha patha yajnasya yajnasya patha | patha suvita suvita patha patha suvita | ssuvita suvita nayantih
    | nayanti rititi nayanti ityahahe tityaha | aha yajnasya yajna syahaha yajnasya | yajnasya hi hi yajnasya
    yajnasya hi | hyeta eta hi hyetah | etah patha pathaita etah patha | patha yanti yanti patha patha
    yanti | dyanti yanti yat | ddakshina dakshina ya ndakshina dakshina brahmanam | brahmana madyadya
    bra ddhyasagm raddhyasa madyadya ra raddhyasa mrishi mrishigm raddhyasagm raddhyasa mrishi sheya mrishi
    mrishi mar arsheya mitityar ityahahe tityaha | ahaisha esha aha haishah | esha vai va esha esha vai
    | brahmana rishir rishi sheya rishir rishi rar arsheyo yo ya ar eva maha haiva meva maha | aha vi
    vyahaha vi | suvah pashya pashya suva pashya vi vi pashya pashya vi | vyantariksha mantariksham vi~
    vyantariksham | antariksha miti tyantariksha mantariksha miti | ityahahe tityaha | aha suvargagm suvarga
    mahaha suvargam | suvarga mevaiva suvargagm suvarga meva | evaina mena mevai vaina enam ~lokam ~loka
    mena menam ~lokam | ngamayati gamayati lokam ~loka gamayati yatasva yatasva gamayati gamayati yatasva
    | ryatasva yatasva sadasyaih sadasyai rititi sadasyai ityahahe tityaha | aha mitratvaya mitratva yahaha
    mitratvaya | mitratva yasmadda tra mitratvaya mitratva yasmadda mitratvayeti mitra tra devatra devatra
    'smadda devatra gacchata gacchata devatra devatra gacchata | rgacchata gacchata madhumatih | rmadhumatih
    pradatara pradatara ma pradatara pradataramiti pra a vishata vishata vishata | vishatetiti vishata
    vishateti | ityahahe tityaha | iha pradatarah pradatara iheha pradatarah | ssmah pradatarah pradatara
    pradatara iti pra asma namutra mutra smanasma namutra | rmadhumati ramutra mutra madhumatih | a vishata
    vishata vishata | vishatetiti vishata vishateti | iti vava vave titi vava | || eta daha haita deta
    daha | aha hiranyagm hiranya mahaha hiranyam | ndadati dadati hiranyagm hiranya rdadati dadati jyotih
    | vai hiranyagm hiranyam rjyotir hiranyagm hiranya jyoti revaiva jyoti tpurasta devaiva purasta ddhatte
    dhatte purasta dhatte suvargasya suvargasya dhatte dhatte suvargasya | suvargasya lokasya lokasya
    suvargasya suvargasya lokasya | suvargasyeti suvah lokasyanu khyatya anukhyatyai lokasya lokasya nukhyatyai
    | anukhyatya agnidhe 'gnidhe 'nukhyatya anukhyatya agnidhe anukhyatya ityanu agnidhe dadati dada tyagnidhe
    'gnidhe dadati | dada tyagnimukha nagnimukha ndadati dada tyagnimukhan | agnimukha nevai vagnimukha
    nagnimukha neva | agnimukhanityagni nprinati prina tyritu nritu prinati brahmane prinati prinati brahmane
    brahmane dadati dadati brahmane tyai dadati dadati prasu tyai hotre hotre prasu hotre dadati dadati
    hotre hotre dadati | dada tyatma ''tma dadati dada tyatma | atma vai va atma ''tma vai | va esha esha
    vai va eshah | esha yajnasya yajna syaisha esha yajnasya | dyajnasya yajnasya yat | hota ''tmana matmanagm
    hota hota ''tmana atmana mevai vatmana matmana meva | eva yajnasya yajna syaivaiva yajnasya | yajnasya
    dakshinabhi ryajnasya yajnasya dakshinabhih | sa mardhaya tyardhayati sagm sa mardhayati | ardhayatityardhayati
    | || samishtayajugmshi juhoti juhoti samishtayajugmshi samishtayajugmshi juhoti | samishtayajugmshiti
    samishta juhoti yajnasya yajnasya juhoti juhoti yajnasya | yajnasya samishtyai samishtyai yajnasya
    yajnasya samishtyai | thsamishtyai samishtyai yat | vai yajnasya yajnasya vai vai yajnasya | ya~jnasya
    yajnasya kruram | yadatye tyatyeti ya dyadatye tyatyeti yat | natyetya tyeti na natyeti | dyadatye
    tyatyeti yat | yadatikaro tyatikaroti ya dyadatikaro tyatikaroti yat | api karoti karo tyapyapi karoti
    | tkaroti karoti tat | eva tai stai revaiva taih | taih prinati prinati tai staih prinati | prinati
    nava nava prinati prinati nava | nava juhoti juhoti nava nava juhoti | juhoti nava nava juhoti juhoti
    nava | nava vai vai nava nava vai | vai purushe purushe vai vai purushe | purushe pranah pranah purushe
    purushe pranah | pranah purushena purushena pranah pranah purushena | purushena yajno yajnah purushena
    purushena yajnah | ssammito yajno yajna ssammito yavan | yavane vaiva yavan eva yajno yajna evaiva
    yajnah | ya~jno yajna stam | mprinati prinati ta tthshat prinati prinati shat | shadrigmiya nyrigmiyani
    sha rigmiyani juhoti juho tyrigmiya nyrigmiyani juhoti | djuhoti juhoti shat | va ritava ritavo vai
    va ritavah | ritava ritu nritu nritava ritava ritun | ritu nevaiva rtu nritu neva | eva prinati prina
    tyevaiva prinati | prinati trini trini prinati prinati trini | trini yajugmshi yajugmshi trini trini
    yajugmshi | yajugmshi traya strayo yajugmshi yajugmshi trayah | || traya ima ime traya straya ime
    | ime loka loka ima ime lokah | loka ima niman ~loka loka iman | ima nevaive ma nima neva | eva lokan
    ~loka nevaiva lokan | nprinati prinati lokan ~loka prinati yajna yajna prinati prinati yajna | ya~jna
    yajna yajnam | ngaccha gaccha yajnapatim | ngaccha gaccha yajnapatim yajnapatimiti yajna gacchetiti
    gaccha gaccheti | ityahahe tityaha | ya~jnapati mahaha yajnapatim | yajnapati mevaiva yajnapatim yajnapatimiti
    yajna evaina mena mevai vaina ngamayati gamaya tyena mena ngamayati gamayati svam | gacchetiti gaccha
    gaccheti | ityahahe tityaha | sva mahaha svam | evaina mena mevai vaina ngamayati gamayati yonim gamaya
    tyesha esha gamayati gamaya tyeshah | esha te ta esha esha te te yajno yajna ste te yajnah | yajno
    yajnapate yajnapate yajno yajno yajnapate | ktavako yajnapate yajnapate sahasu yajnapata iti yajna
    ssuvirah suvirah sahasu suvira ititi suvirah suvira iti | ityahahe tityaha | aha yajamane yajamana
    ahaha yajamane | yajamana evaiva yajamane yajamana eva | vi~rya mevaiva virya ndadhati dadhati viryam
    dadhati vasishtho vasishtho dadhati dadhati vasishthah | vasishtho ha ha vasishtho vasishtho ha |
    tyahavyo ha ha satyahavyah | satyahavyo devabhaga tyahavyo devabhagam | satyahavya iti satya mpapraccha
    papraccha devabhaga tpapraccha papraccha yat | nbahuyajino bahuyajina bahuyajino 'yiyajo 'yiyajo bahuyajino
    bahuyajino 'yiyajah | bahuyajina iti bahu ayiyajo yajne yajne 'yiyajo 'yiyajo yajne | ya~jne yajne
    yajnam | || mprati prati yajnam h prati pratyatishthipa iti sa sa ititi sah | hovaco vaca ha hovaca
    | uvaca yajnapatau yajnapata vuva covaca yajnapatau | yajnapata vititi yajnapatau yajnapata viti |
    yajnapataviti yajna thsatya dititi satyat | ssrinjaya vai vai srinjayah | srinjayah para para srinjaya
    rbabhuvuh para para babhuvuh | babhuvu rititi babhuvu hova covaca ha hovaca | uvaca yajne yajna uva
    covaca yajne | yajne vava vava yajne yajne vava | vava yajno yajno vava vava yajnah | yajnah pratishthapyah
    pratishthapyo yajno yajnah pratishthapyah | pratishthapya asidasi tpratishthapyah pratishthapya asit
    | pratishthapya iti prati dyajamanasya yajamana syasi dasi yajamanasya parabhavaya parabhavaya yajamanasya
    yajamanasya parabhavaya | aparabhavaye tityaparabhavaya parabhavayeti | iti deva deva ititi devah
    deva gatuvido gatuvido deva deva gatuvidah | ngatuvido gatuvido gatum | gatuvida iti gatu vi~ttva
    vittva gatu vi~ttva vittva gatum | ite titite teti | ityahahe tityaha | aha yajne yajna ahaha yajne
    | yajna evaiva yajne yajna eva | ya~jna mevaiva yajnam | mprati prati yajnam prati shthapayati sthapayati
    prati prati shthapayati | sthapayati yajamanasya yajamanasya sthapayati sthapayati yajamanasya | yajamanasya
    parabhavaya parabhavaya yajamanasya yajamanasya parabhavaya | avabhrithayajugmshi juhoti juho tyavabhrithayajug
    shyavabhrithayajugmshi juhoti | avabhrithayajugmshityavabhritha dyaj juhoti juhoti yat | evarvacina
    marvacina mevai varvacina arvacina mekahayana dekahayana darvacina marvacina mekahayanat | ekahayana
    dena ena ekahayana dekahayana denah | enah karoti karo tyena enah karoti | tkaroti karoti tat | eva
    tai stai revaiva taih | taira vava tai stai rava | ava yajate yajate 'vava yajate | yajate 'po 'po
    yajate yajate 'pah | apo 'vabhritha mavabhritha mapo avabhritha mavava vabhritha mavabhritha mava
    | aphsu vai va aphsvaphsu vai | vai varuno varuno vai vai varunah | saksha devaiva saksha va~runa
    mevaiva varunam | varuna mavava varunam ava yajate yajate 'vava yajate | yajate vartmana vartmana
    yajate yajate vartmana | vartmana vai vai vartmana vartmana vai | va anvitya nvitya vai va anvitya
    | ya~jna manvitya nvitya yajnam | yajnagm rakshagmsi rakshagmsi yajnam ya~jnagm rakshagmsi | rakshagmsi
    jighagmsanti jighagmsanti rakshagmsi rakshagmsi jighagmsanti | jighagmsanti samna samna jighagmsanti
    jighagmsanti samna prastota prastota samna samna tyanvavaiti prastota prastota 'nvavaiti | anvavaiti
    sama samanvavai tyanvavaiti sama | sama vai vai sama sama vai | vai rakshoha rakshoha vai vai rakshoha
    | rakshoha rakshasagm rakshasagm rakshoha rakshoha rakshasam | rakshasa mapahatya apahatyai rakshasagm
    rakshasa mapahatyai | apahatyai tri stri rapahatya apahatyai trih | nidhana mupopa nidhana eti traya
    straya etyeti trayah | traya ima ime traya straya ime | ime loka loka ima ime lokah | loka ebhya ebhyo
    loka loka ebhyah | ebhya evai vaibhya ebhya eva | eva lokebhyo lokebhya evaiva lokebhyah | lokebhyo
    rakshagmsi rakshagmsi lokebhyo lokebhyo rakshagmsi | rakshag syapapa rakshagmsi rakshag syapa | ||
    apa hanti hantyapapa hanti | hanti purushahpurushah purushahpurusho hanti hanti purushahpurushah |
    purushahpurusho nidhana mpurushahpurushah purushahpurusho nidhana purushahpurusha iti purushah nidhana
    mupopa nidhana eti purushahpurushah purushahpurusha etyeti purushahpurushah | purushahpurusho hi hi
    purushahpurushah purushahpurusho hi | purushahpurusha iti purushah hi rakshasvi rakshasvi hi hi rakshasvi
    | rakshasvi rakshasagm rakshasagm rakshasvi rakshasvi rakshasam | rakshasa mapahatya apahatyai rakshasagm
    rakshasa mapahatyai | apahatya uru muru mapahatya apahatya urum | urugm hi hyuru murugm hi | hi raja
    raja hi hi raja raja varuno varuno raja raja varunah | varuna shcakara cakara varuno varuna shcakara
    | cakaretiti cakara cakareti | ityahahe tityaha | aha pratishthityai pratishthitya ahaha pratishthityai
    | pratishthityai shatagm shata mpratishthityai pratishthityai shatam | pratishthitya iti prati nte
    te rajann | nbhishajo bhishajo raja bhishajah sahasragm sahasra mbhishajo bhishajah sahasra sahasra
    mititi sahasragm sahasra miti | ityahahe tityaha | mbheshaja mahaha bheshajam | bheshaja mevaiva bheshaja
    evasma asma evai vasmai asmai karoti karo tyasma asmai karoti | karo tyabhishthito 'bhishthitah karoti
    karo tyabhishthitah | abhishthito varunasya varunasya bhishthito 'bhishthito varunasya | varunasya
    pashah pasho varunasya varunasya pashah | pasha ititi pashah pasha iti | ityahahe tityaha | va~runapasha
    mahaha varunapasham | varunapasha mevaiva varunapasham varunapashamiti varuna abhi tishthati tishtha
    tyabhyabhi tishthati | rbarhi stishthati tishthati barhih | barhi rabhyabhi barhi abhi juhoti juho
    tyabhyabhi juhoti | juho tyahutina mahutina njuhoti juho tyahutinam | mpratishthityai pratishthitya
    ahutina mahutina pratishthitya atho atho pratishthityai pratishthitya atho pratishthitya iti prati
    atho agniva tyagniva tyatho atho agnivati | agniva tyevai vagniva tyagniva tyeva | eva juhoti juho
    tyevaiva juhoti | hisho juhoti juho tyapabar yajati prajah praja yajati yajati prajah | praja vai
    vai prajah praja vai | barhih prajah praja barhi rbarhih prajah | praja evaiva prajah praja eva |
    dvarunapasha devaiva varunapashat | nmuncati muncati varunapasha varunapashaditi varuna munca tyajyabhaga
    vajyabhagau muncati munca tyajyabhagau | ajyabhagau yajati yaja tyajyabhaga vajyabhagau yajati | ajyabhagavityajya
    yajati yajnasya yajnasya yajati yajati yajnasya | yajna syaivaiva yajnasya yajna syaiva | eva cakshushi
    cakshushi evaiva cakshushi | cakshushi na na cakshushi cakshushi na | cakshushi iti cakshushi | tye
    tyanta ranta reti | va~runa metyeti varunam | yajati varunapasha dyajati yajati varunapashat | varunapasha
    devaiva varunapasha varunapashaditi varuna evaina mena mevai vaina mmuncati munca tyena mena munca
    tyagnivaruna vagnivarunau muncati munca tyagnivarunau | agnivarunau yajati yaja tyagnivaruna vagnivarunau
    yajati | agnivarunavityagni dyajati yajati sakshat | saksha devaiva saksha evaina mena mevai vaina
    dvarunapasha dena menam nmuncati muncati varunapasha varunapashaditi varuna hishau muncati munca tyapabar
    hisha vanuyaja vanuyaja vapabar anuyajau yajati yaja tyanuyaja vanuyajau yajati | yajati prajah praja
    yajati yajati prajah | praja vai vai prajah praja vai | barhih prajah praja barhi rbarhih prajah |
    praja evaiva prajah praja eva | dvarunapasha devaiva varunapashat | nmuncati muncati varunapasha varunapashaditi
    varuna muncati catura shcaturo muncati muncati caturah | shcatura shcaturah prayajan | yajati dvau
    dvau yajati yajati dvau | dva vanuyaja vanuyajau dvau dva vanuyajau | tthshadanuyaja vanuyajau shat
    | mpadyante padyante sagm sa tthshat padyante padyante shat | va ritava ritavo vai va ritavah | ritava
    ritush vritush vritava ritava ritushu | || eva prati pratye vaiva prati | prati tishthati tishthati
    prati prati tishthati | tishtha tyavabhritha vabhritha tishthati tishtha tyavabhritha | avabhritha
    nicankuna nicankuna vabhritha vabhritha nicankuna | nicanku netiti nicankuna nicankuneti | ityahahe
    tityaha | ya~thodita mahaha yathoditam | yathodita mevaiva yathoditam va~runa mevaiva varunam | varuna
    mavava varunam ava yajate yajate 'vava yajate | yajate samudre samudre yajate yajate samudre | samudre
    te te samudre samudre te te hridayagm hridaya hridaya maphsvaphsu hridayagm hridaya maphsu | aphsvanta
    ranta raphsva anta riti tyanta ranta riti | ityahahe tityaha | aha samudre samudra ahaha samudre |
    samudre hi hi samudre samudre hi | rvaruno varuno 'nta ranta tva vishantu vishantu tva tva vishantu
    | visha ntvoshadhi roshadhi rvishantu visha ntvoshadhih | oshadhi ruto taushadhi roshadhi ruta | utapa
    apa uto tapah | apa itityapa apa iti | ityahahe tityaha | ahadbhi radbhi raha hadbhih | adbhi revai
    vadbhi radbhi reva | evaina mena mevai vaina ena moshadhibhi roshadhibhi rena mena moshadhibhih |
    ssamyancagm samyanca moshadhibhi roshadhibhi ndadhati dadhati samyancagm samyanca rdadhati dadhati
    devih devi rapa apo devi apa esha esha apa apa eshah | esha vo va esha esha vah | vo garbho garbho
    vo vo garbhah | garbha ititi garbho garbha iti | ityahahe tityaha | ryathayaju rahaha yathayajuh |
    yathayaju revaiva yathayaju evaita deta devai vaitat | tpashavah pashava eta deta pashavo vai vai
