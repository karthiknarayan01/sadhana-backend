id: vedasarashivasahasranamastotrampadmapurana
category: kavacha
name:
  english: vedasarashivasahasranamastotrampadmapurana
  devanagari: वेदसारशिवसहस्रनामस्तोत्रम्पद्मपुराण
content:
  english: rinkhalaya darpaya namaste vishayatmane || 137|| anavadyaya shastraya svatantrayamritaya ca
    | namah praudhaya prajnaya yogarudhaya te namah || 138|| mantrajnaya pragalbhaya pradipavimalaya ca
    | vishvavasaya dakshaya vedanihshvasitaya ca || 139|| yajnangaya suviraya nagacudaya te namah | vyaghraya
    banahastaya skandaya dakshine namah || 140|| kshetrajnaya rahasyaya svasthanaya variyase | gahanaya
    viramaya siddhantaya namo namah || 141|| mahidharaya grihyaya vatavrikshaya te namah | jnanadipaya
    durgaya siddhantairnishcitaya ca || 142|| shrimate muktibijaya kushalaya vivasine | prerakaya vishokaya
    havirdhanaya te namah || 143|| gambhiraya sahayaya bhojanaya subhogine | mahayajnaya tikshnaya namaste
    bhutacarine || 144|| namah pratishthitayatha mahotsahaya te namah | paramarthaya shishave pramshave
    ca kapaline || 145|| sahajaya grihasthaya sandhyanathaya vishnave | sadbhih sampujitayatha vitalasuraghatine
    || 146|| janadhipaya yogyaya kameshaya kiritine | amoghavikramayatha nagnaya dalaghatine || 147||
    sangramaya nareshaya namaste shucibhasmane | bhutipriyaya bhumne te senaya caturaya ca || 148|| manushyabahyagataye
    kritajnaya shikhandine | nirlepaya jatardraya mahakalaya merave || 149|| namo viruparupaya shaktigamyaya
    te namah | namah sarvaya sadasatsatyaya suvrataya ca || 150|| namo bhaktipriyayatha shvetarakshaparaya
    ca | sukumaramahapapaharaya rathine namah || 151|| namaste dharmarajaya dhanadhyakshaya siddhaye |
    mahabhutaya kalpaya kalpanarahitaya ca || 152|| khyataya jitavishvaya gokarnaya sucarave | shrotriyaya
    vadanyaya durlabhaya kutumbine || 153|| virajaya sugandhaya namo vishvambharaya ca | bhavatitaya tishyaya
    namaste samagaya ca || 154|| advaitaya dvitiyaya kalparajaya bhogine | cinmayaya namah shuklajyotishe
    kshetragaya ca || 155|| sarvabhogasamriddhaya samparayaya te namah | namaste svaprakashaya svacchandaya
    sutantave || 156|| sarvajnamurtaye tubhyam guhyeshaya sushantaye | sharadaya sushilaya kaushikaya
    dhanaya ca || 157|| abhiramaya tattvaya vyalakalpaya te namah | arishtamathanayatha supratikaya te
    namah || 158|| ashave brahmagarbhaya varunayadraye namah | namah kalagnirudraya shyamaya sujanaya
    ca || 159|| ahirbudhnyaya jaraya dushtanam pataye namah | namah samayanathaya samayaya guhaya ca ||
    160|| durlanghyaya namastubhyam chandahsaraya damshtrine | jyotirlingaya mitraya jagatam hitakarine
    || 161|| namah karunyanidhaye shlokaya jayashaline | jnanodayaya bijaya jagadvibhramahetave || 162||
    avadhutaya shishtaya chandasam pataye namah | namah phenyaya guhyaya sarvabandhavimocine || 163||
    udarakirtaye shashvatprasannavadanaya ca | vasave vedakaraya namo bhrajishnujishnave || 164|| cakrine
    devadevaya gadahastaya putrine | parijatasupushpaya ganadhipataye namah || 165|| sarvashakhadhipataye
    prajaneshaya te namah | sukshmapramanabhutaya suraparshvagataya ca || 166|| asharirashariraya apragalbhaya
    te namah | sukeshaya supushpaya shrutaye pushpamaline || 167|| munidhyeyaya munaye bijasamsthamaricaye
    | camundajanakayatha namaste krittivasase || 168|| vyuptakeshaya yogyaya dharmapithaya te namah |
    mahaviryaya diptaya buddhayashanaye namah || 169|| vishishteshtaya senanye dvipade karanaya ca | karananam
    bhagavate banadarpaharaya ca || 170|| atindriyaya ramyaya jananandakaraya ca | sadashivaya saumyaya
    cintyaya shashimaulaye || 171|| namaste jatukarnyaya suryadhyakshaya te namah | jyotishe kundalishasya
    varadayabhayaya ca || 172|| vasantaya surabhaye jayarimathanaya ca | premne puranjayayatha prishadashvaya
    te namah || 173|| rocishnave'surajite shvetapitaya te namah | namaste cancarikaya tamisramathanaya
    ca || 174|| pramathine nidaghaya citragarbhaya te namah | shivalayaya stutyaya tirthadevaya te namah
    || 175|| pattinam pataye tubhyam vicitragataye namah |
  devanagari: ृङ्खलाय दर्पाय नमस्ते विषयात्मने ॥ १३७॥ अनवद्याय शास्त्राय स्वतन्त्रायामृताय च । नमः प्रौढाय
    प्राज्ञाय योगारूढाय ते नमः ॥ १३८॥ मन्त्रज्ञाय प्रगल्भाय प्रदीपविमलाय च । विश्ववासाय दक्षाय वेदनिःश्वसिताय
    च ॥ १३९॥ यज्ञाङ्गाय सुवीराय नागचूडाय ते नमः । व्याघ्राय बाणहस्ताय स्कन्दाय दक्षिणे नमः ॥ १४०॥ क्षेत्रज्ञाय
    रहस्याय स्वस्थानाय वरीयसे । गहनाय विरामाय सिद्धान्ताय नमो नमः ॥ १४१॥ महीधराय गृह्याय वटवृक्षाय ते
    नमः । ज्ञानदीपाय दुर्गाय सिद्धान्तैर्निश्चिताय च ॥ १४२॥ श्रीमते मुक्तिबीजाय कुशलाय विवासिने । प्रेरकाय
    विशोकाय हविर्धानाय ते नमः ॥ १४३॥ गम्भीराय सहायाय भोजनाय सुभोगिने । महायज्ञाय तीक्ष्णाय नमस्ते भूतचारिणे
    ॥ १४४॥ नमः प्रतिष्ठितायाथ महोत्साहाय ते नमः । परमार्थाय शिशवे प्रांशवे च कपालिने ॥ १४५॥ सहजाय गृहस्थाय
    सन्ध्यानाथाय विष्णवे । सद्भिः सम्पूजितायाथ वितलासुरघातिने ॥ १४६॥ जनाधिपाय योग्याय कामेशाय किरीटिने
    । अमोघविक्रमायाथ नग्नाय दलघातिने ॥ १४७॥ सङ्ग्रामाय नरेशाय नमस्ते शुचिभस्मने । भूतिप्रियाय भूम्ने ते
    सेनाय चतुराय च ॥ १४८॥ मनुष्यबाह्यगतये कृतज्ञाय शिखण्डिने । निर्लेपाय जटार्द्राय महाकालाय मेरवे ॥ १४९॥
    नमो विरूपरूपाय शक्तिगम्याय ते नमः । नमः सर्वाय सदसत्सत्याय सुव्रताय च ॥ १५०॥ नमो भक्तिप्रियायाथ श्वेतरक्षापराय
    च । सुकुमारमहापापहराय रथिने नमः ॥ १५१॥ नमस्ते धर्मराजाय धनाध्यक्षाय सिद्धये । महाभूताय कल्पाय कल्पनारहिताय
    च ॥ १५२॥ ख्याताय जितविश्वाय गोकर्णाय सुचारवे । श्रोत्रियाय वदान्याय दुर्लभाय कुटुम्बिने ॥ १५३॥ विरजाय
    सुगन्धाय नमो विश्वम्भराय च । भवातीताय तिष्याय नमस्ते सामगाय च ॥ १५४॥ अद्वैताय द्वितीयाय कल्पराजाय
    भोगिने । चिन्मयाय नमः शुक्लज्योतिषे क्षेत्रगाय च ॥ १५५॥ सर्वभोगसमृद्धाय साम्परायाय ते नमः । नमस्ते
    स्वप्रकाशाय स्वच्छन्दाय सुतन्तवे ॥ १५६॥ सर्वज्ञमूर्तये तुभ्यं गुह्येशाय सुशान्तये । शारदाय सुशीलाय
    कौशिकाय धनाय च ॥ १५७॥ अभिरामाय तत्त्वाय व्यालकल्पाय ते नमः । अरिष्टमथनायाथ सुप्रतीकाय ते नमः ॥ १५८॥
    आशवे ब्रह्मगर्भाय वरुणायाद्रये नमः । नमः कालाग्निरुद्राय श्यामाय सुजनाय च ॥ १५९॥ अहिर्बुध्न्याय जाराय
    दुष्टानां पतये नमः । नमः समयनाथाय समयाय गुहाय च ॥ १६०॥ दुर्लङ्घ्याय नमस्तुभ्यं छन्दःसाराय दंष्ट्रिणे
    । ज्योतिर्लिङ्गाय मित्राय जगतां हितकारिणे ॥ १६१॥ नमः कारुण्यनिधये श्लोकाय जयशालिने । ज्ञानोदयाय बीजाय
    जगद्विभ्रमहेतवे ॥ १६२॥ अवधूताय शिष्टाय छन्दसां पतये नमः । नमः फेन्याय गुह्याय सर्वबन्धविमोचिने ॥ १६३॥
    उदारकीर्तये शश्वत्प्रसन्नवदनाय च । वसवे वेदकाराय नमो भ्राजिष्णुजिष्णवे ॥ १६४॥ चक्रिणे देवदेवाय गदाहस्ताय
    पुत्रिणे । पारिजातसुपुष्पाय गणाधिपतये नमः ॥ १६५॥ सर्वशाखाधिपतये प्रजनेशाय ते नमः । सूक्ष्मप्रमाणभूताय
    सुरपार्श्वगताय च ॥ १६६॥ अशरीरशरीराय अप्रगल्भाय ते नमः । सुकेशाय सुपुष्पाय श्रुतये पुष्पमालिने ॥ १६७॥
    मुनिध्येयाय मुनये बीजसंस्थमरीचये । चामुण्डाजनकायाथ नमस्ते कृत्तिवाससे ॥ १६८॥ व्युप्तकेशाय योग्याय
    धर्मपीठाय ते नमः । महावीर्याय दीप्ताय बुद्धायाशनये नमः ॥ १६९॥ विशिष्टेष्टाय सेनान्ये द्विपदे कारणाय
    च । कारणानां भगवते बाणदर्पहराय च ॥ १७०॥ अतीन्द्रियाय रम्याय जनानन्दकराय च । सदाशिवाय सौम्याय चिन्त्याय
    शशिमौलये ॥ १७१॥ नमस्ते जातूकर्ण्याय सूर्याध्यक्षाय ते नमः । ज्योतिषे कुण्डलीशस्य वरदायाभयाय च ॥ १७२॥
    वसन्ताय सुरभये जयारिमथनाय च । प्रेम्णे पुरञ्जयायाथ पृषदश्वाय ते नमः ॥ १७३॥ रोचिष्णवेऽसुरजिते श्वेतपीताय
    ते नमः । नमस्ते चञ्चरीकाय तमिस्रमथनाय च ॥ १७४॥ प्रमाथिने निदाघाय चित्रगर्भाय ते नमः । शिवालयाय स्तुत्याय
    तीर्थदेवाय ते नमः ॥ १७५॥ पत्तीनां पतये तुभ्यं विचित्रगतये नमः ।
