id: sri-gurugita-chapter-1
category: stotram
name:
  english: Sri Gurugita Chapter 1
content:
  english: shrigurubhyo namah | harih om | dhyanam hamsabhyam parivrittapatrakamalairdivyairjagatkaranam
    vishvotkirnamanekadehanilayam svacchandamanandakam | adyantaikamakhandacidghanarasam purnam hyanantam
    shubham pratyakshaksharavigraham gurupadam dhyayedvibhum shashvatam || atha prathamo'dhyayah || acintyavyaktarupaya
    nirgunaya ganatmane | samastajagadadharamurtaye brahmane namah || || rishaya ucuh | suta suta mahaprajna
    nigamagamaparaga | gurusvarupamasmakam bruhi sarvamalapaham || || yasya shravanamatrena dehi duhkhadvimucyate
    | yena margena munayah sarvajnatvam prapedire || || yatprapya na punaryati narah samsarabandhanam
    | tathavidham param tattvam vaktavyamadhuna tvaya || || guhyadguhyatamam saram gurugita visheshatah
    | tvatprasadacca shrotavya tatsarvam bruhi suta nah || || iti samprarthitah suto munisanghairmuhurmuhuh
    || kutuhalena mahata provaca madhuram vacah || || suta uvaca | shrunudhvam munayah sarve shraddhaya
    paraya muda | vadami bhavarogaghnim gitam matrisvarupinim || || pura kailasashikhare siddhagandharvasevite
    | tatra kalpalatapushpamandire'tyantasundare || || vyaghrajine samasinam shukadimunivanditam | bodhayantam
    param tattvam madhye munigane kvacit || || pranamravadana shashvannamaskurvantamadarat | drishtva
    vismayamapanna parvati paripricchati || || parvatyuvaca | om namo deva devesha paratpara jagadguro
    | tvam namaskurvate bhaktya surasuranarah sada || || vidhivishnumahendradyairvandyah khalu sada bhavan
    | namaskaroshi kasmai tvam namaskarashrayah kila || || drishtvaitatkarma vipulamashcarya pratibhati
    me | kimetanna vijane'ham kripaya vada me prabho || || bhagavan sarvadharmajna vratanam vratanayakam
    | bruhi me kripaya shambho gurumahatmyamuttamam || || kena margena bho svamin dehi brahmamayo bhavet
    | tatkripam kuru me svamin namami caranau tava || || iti samprarthitah shashvanmahadevo maheshvarah
    | anandabharitah svante parvatimidamabravit || || shri mahadeva uvaca | na vaktavyamidam devi rahasyatirahasyakam
    | na kasyapi pura proktam tvadbhaktyartham vadami tat || || mama rupa'si devi tvamatastatkathayami
    te | lokopakarakah prashno na kenapi kritah pura || || yasya deve para bhaktiryatha deve tatha gurau
    | tasyaite kathita hyarthah prakashante mahatmanah || || yo guruh sa shivah prokto yah shivah sa guruh
    smritah | vikalpam yastu kurvita sa naro gurutalpagah || || durlabham trishu lokeshu tacchrinushva
    vadamyaham | gurubrahma vina nanyah satyam satyam varanane || || vedashastrapuranani cetihasadikani
    ca | mantrayantradividyanam mohanoccatanadikam || || shaivashaktagamadini hyanye ca bahavo matah |
    apabhramshah samastanam jivanam bhrantacetasam || || japastapo vratam tirtham yajno danam tathaiva
    ca | gurutattvamavijnaya sarvam vyartham bhavetpriye || || gurubuddhyatmano nanyat satyam satyam varanane
    | tallabhartham prayatnastu kartavyashca manishibhih || || gudhavidya jaganmaya dehashcajnanasambhavah
    | vijnanam yatprasadena gurushabdena kathyate || || yadanghrikamaladvandvam dvandvatapanivarakam |
    tarakam bhavasindhoshca tam gurum pranamamyaham || || dehi brahma bhavedyasmat tvatkripartham vadami
    tat | sarvapapavishuddhatma shriguroh padasevanat || || sarvatirthavagahasya samprapnoti phalam narah
    | guroh padodakam pitva shesham shirasi dharayan || || shoshanam papapankasya dipanam jnanatejasah
    | guroh padodakam samyak samsararnavatarakam || || ajnanamulaharanam janmakarmanivarakam | jnanavairagyasiddhyartham
    guroh padodakam pibet || || gurupadodakam panam gurorucchishtabhojanam | gurumurteh sada dhyanam gurornama
    sada japah || || svadeshikasyaiva ca namakirtanam bhavedanantasya shivasya kirtanam | svadeshikasyaiva
    ca namacintanam bhavedanantasya shivasya cintanam || || yatpadambujarenurvai ko'pi samsaravaridhau
    | setubandhayate natham deshikam tamupasmahe || || yadanugrahamatrena shokamohau vinashyatah | tasmai
    shrideshikendraya namo'stu paramatmane || || yasmadanugraham labdhva mahadajnanamutsrijet | tasmai
    shrideshikendraya namashcabhishtasiddhaye || || kashikshetram nivasashca jahnavi caranodakam | gururvishveshvarah
    sakshat tarakam brahmanishcayah || || guruseva gaya prokta dehah syadakshayo vatah | tatpadam vishnupadam
    syat tatra dattamanastatam || || gurumurtim smarennityam gurornama sada japet | gurorajnam prakurvita
    guroranyam na bhavayet || || guruvaktre sthitam brahma prapyate tatprasadatah | gurordhyanam sada
    kuryat kulastri svapatim yatha || || svashramam ca svajatim ca svakirtim pushtivardhanam | etatsarvam
    parityajya gurumeva samashrayet || || ananyashcintayanto ye sulabham paramam sukham | tasmatsarvaprayatnena
    guroraradhanam kuru || || guruvaktre sthita vidya gurubhaktya ca labhyate | trailokye sphutavaktaro
    devarshipitrimanavah || || gukarashcandhakaro hi rukarasteja ucyate | ajnanagrasakam brahma gurureva
    na samshayah || || gukarashcandhakarastu rukarastannirodhakrit | andhakaravinashitvadgururityabhidhiyate
    || gukaro bhavarogah syat rukarastannirodhakrit | bhavarogaharatvacca gururityabhidhiyate || || gukarashca
    gunatito rupatito rukarakah | gunarupavihinatvat gururityabhidhiyate || || gukarah prathamo varno
    mayadigunabhasakah | rukaro'sti param brahma mayabhrantivimocakam || || evam gurupadam shreshtham
    devanamapi durlabham | hahahuhuganaishcaiva gandharvadyaishca pujitam || || dhruvam tesham ca sarvesham
    nasti tattvam guroh param | guroraradhanam kuryat svajivatvam nivedayet || || asanam shayanam vastram
    vahanam bhushanadikam | sadhakena pradatavyam gurusantoshakaranam || || karmana manasa vaca sarvada''radhayedgurum
    | dirghadandam namaskritya nirlajjo gurusannidhau || || shariramindriyam pranamarthasvajanabandhavan
    | atmadaradikam sarvam sadgurubhyo nivedayet || || gurureko jagatsarvam brahmavishnushivatmakam |
    guroh parataram nasti tasmatsampujayedgurum || || sarvashrutishiroratnavirajitapadambujam | vedantarthapravaktaram
    tasmat sampujayedgurum || || yasya smaranamatrena jnanamutpadyate svayam | sa eva sarvasampattih tasmatsampujayedgurum
    || krimikotibhiravishtam durgandhamalamutrakam | shleshmaraktatvacamamsairnaddham caitadvaranane ||
    krimikotibhiravishtam durgandhakuladushitam | anityam duhkhanilayam deham viddhi varanane || || samsaravrikshamarudhah
    patanti narakarnave | yastanuddharate sarvan tasmai shrigurave namah || || gururbrahma gururvishnurgururdevo
    maheshvarah | gurussakshat parabrahma tasmai shrigurave namah || || ajnanatimirandhasya jnananjanashalakaya
    | cakshurunmilitam yena tasmai shrigurave namah || || akhandamandalakaram vyaptam yena caracaram |
    tatpadam darshitam yena tasmai shrigurave namah || || sthavaram jangamam vyaptam yatkincitsacaracaram
    | tvam padam darshitam yena tasmai shrigurave namah || || cinmayavyapitam sarvam trailokyam sacaracaram
    | asitvam darshitam yena tasmai shrigurave namah || || nimishannimishardhadva yadvakyadvai vimucyate
    | svatmanam shivamalokya tasmai shrigurave namah || || caitanyam shashvatam shantam vyomatitam niranjanam
    | nadabindukalatitam tasmai shrigurave namah || || nirgunam nirmalam shantam jangamam sthirameva ca
    | vyaptam yena jagatsarvam tasmai shrigurave namah || || sa pita sa ca me mata sa bandhuh sa ca devata
    | samsaramohanashaya tasmai shrigurave namah || || yatsattvena jagatsattvam yatprakashena bhati tat
    | yadanandena nandanti tasmai shrigurave namah || || yasmin sthitamidam sarvam bhati yadbhanarupatah
    | priyam putradi yatpritya tasmai shrigurave namah || || yenedam darshitam tattvam cittacaityadikam
    tatha | jagratsvapnasushuptyadi tasmai shrigurave namah || || yasya jnanamidam vishvam na drishyam
    bhinnabhedatah | sadaikaruparupaya tasmai shrigurave namah || || yasya jnatam matam tasya matam yasya
    na veda sah | ananyabhavabhavaya tasmai shrigurave namah || || yasmai karanarupaya karyarupena bhati
    yat | karyakaranarupaya tasmai shrigurave namah || || nanarupamidam vishvam na kenapyasti bhinnata
    | karyakaranarupaya tasmai shrigurave namah || || jnanashaktisamarudhatattvamalavibhushine | bhuktimuktipradatre
    ca tasmai shrigurave namah || || anekajanmasampraptakarmabandhavidahine | jnananalaprabhavena tasmai
    shrigurave namah || || shoshanam bhavasindhoshca dipanam ksharasampadam | guroh padodakam yasya tasmai
    shrigurave namah || || na guroradhikam tattvam na guroradhikam tapah | na guroradhikam jnanam tasmai
    shrigurave namah || || mannathah shrijagannatho madguruh shrijagadguruh | mama''tma sarvabhutatma
    tasmai shrigurave namah || || gururadiranadishca guruh paramadaivatam | gurumantrasamo nasti tasmai
    shrigurave namah || || eka eva paro bandhurvishame samupasthite | guruh sakaladharmatma tasmai shrigurave
    namah || || gurumadhye sthitam vishvam vishvamadhye sthito guruh | gururvishvam na canyo'sti tasmai
    shrigurave namah || || bhavaranyapravishtasya dinmohabhrantacetasah | yena sandarshitah panthah tasmai
    shrigurave namah || || tapatrayagnitaptanamashantapraninam mude | gurureva para ganga tasmai shrigurave
    namah || ajnanenahina grastah praninastan cikitsakah | vidyasvarupo bhagavamstasmai shrigurave namah
    || ajnanasarpadashtanam praninam kashcikitsakah | samyag jnanamahamantravedinam sadguru vina || ||
    hetave jagatameva samsararnavasetave | prabhave sarvavidyanam shambhave gurave namah || || dhyanamulam
    gurormurtih pujamulam guroh padam | mantramulam gurorvakyam muktimulam guroh kripa || || saptasagaraparyantatirthasnanaphalam
    tu yat | guroh padodabindoshca sahasramshe na tatphalam || || shive rushte gurustrata gurau rushte
    na kashcana | labdhva kulagurum samyaggurumeva samashrayet || || madhulubdho yatha bhringah pushpatpushpantaram
    vrajet | jnanalubdhastatha shishyo gurorgurvantaram vrajet || || vande gurupadadvandvam vanmanatitagocaram
    | shvetaraktaprabhabhinnam shivashaktyatmakam param || || gukaram ca gunatitam rukaram rupavarjitam
    | gunatitamarupam ca yo dadyatsa guruh smritah || || atrinetrah shivah sakshat dvibahushca harih smritah
    | yo'caturvadano brahma shriguruh kathitah priye || || ayam mayanjalirbaddho dayasagarasiddhaye |
    yadanugrahato jantushcitrasamsaramuktibhak || || shriguroh paramam rupam vivekacakshuragratah | mandabhagya
    na pashyanti andhah suryodayam yatha || || kulanam kulakotinam tarakastatra tat kshanat | atastam
    sadgurum jnatva trikalamabhivadayet || || shrinathacaranadvandvam yasyam dishi virajate | tasyam dishi
    namaskuryat bhaktya pratidinam priye || || sashtangapranipatena stuvannityam gurum bhajet | bhajanat
    sthairyamapnoti svasvarupamayo bhavet || || dorbhyam padbhyam ca janubhyamurasa shirasa drisha | manasa
    vacasa ceti pranamo'shtanga ucyate || || tasyai dishe satatamanjaliresha nityam prakshipyatam mukharitairmadhuraih
    prasunaih | jagarti yatra bhagavan gurucakravarti vishvasthitipralayanatakanityasakshi || || abhyastaih
    kimu dirghakalavimalairvyadhipradairdushkaraih pranayamashatairanekakaranairduhkhatmakairdurjayaih
    | yasminnabhyudite vinashyati bali vayuh svayam tat kshanat praptum tatsahajasvabhavamanisham seveta
    caikam gurum || || jnanam vina muktipadam labhyate gurubhaktitah | gurossamanato nanyat sadhanam gurumarginam
    || || yasmatparataram nasti neti netiti vai shrutih | manasa vacasa caiva satyamaradhayedgurum ||
    || guroh kripaprasadena brahmavishnumaheshvarah | samarthyamabhajan sarve srishtisthityantakarmani
    || || devakinnaragandharvah pitriyakshastu tumburah | munayo'pi na jananti gurushushrushane vidhim
    || || tarkikashchandasashcaiva daivajnah karmathah priye | laukikaste na jananti gurutattvam nirakulam
    || || mahahankaragarvena tatovidyabalena ca | bhramanti casmin samsare ghatiyantram yatha punah ||
    || yajnino'pi na muktah syuh na mukta yoginastatha | tapasa api no mukta gurutattvatparanmukhah ||
    || na muktastu ca gandharvah pitriyakshastu caranah | rishayah siddhadevadya gurusevaparanmukhah ||
    || iti shriskandapurane uttarakhande umamaheshvara samvade shri gurugitayam prathamo'dhyayah ||
  devanagari: श्रीगुरुभ्यो नमः । हरिः ओम् । ध्यानम् हंसाभ्यां परिवृत्तपत्रकमलैर्दिव्यैर्जगत्कारणं विश्वोत्कीर्णमनेकदेहनिलयं
    स्वच्छन्दमानन्दकम् । आद्यन्तैकमखण्डचिद्घनरसं पूर्णं ह्यनन्तं शुभं प्रत्यक्षाक्षरविग्रहं गुरुपदं ध्यायेद्विभुं
    शाश्वतम् ॥ अथ प्रथमोऽध्यायः ॥ अचिन्त्याव्यक्तरूपाय निर्गुणाय गणात्मने । समस्तजगदाधारमूर्तये ब्रह्मणे
    नमः ॥ ॥ ऋषय ऊचुः । सूत सूत महाप्राज्ञ निगमागमपारग । गुरुस्वरूपमस्माकं ब्रूहि सर्वमलापहम् ॥ ॥ यस्य
    श्रवणमात्रेण देही दुःखाद्विमुच्यते । येन मार्गेण मुनयः सर्वज्ञत्वं प्रपेदिरे ॥ ॥ यत्प्राप्य न पुनर्याति
    नरः संसारबन्धनम् । तथाविधं परं तत्त्वं वक्तव्यमधुना त्वया ॥ ॥ गुह्याद्गुह्यतमं सारं गुरुगीता विशेषतः
    । त्वत्प्रसादाच्च श्रोतव्या तत्सर्वं ब्रूहि सूत नः ॥ ॥ इति सम्प्रार्थितः सूतो मुनिसङ्घैर्मुहुर्मुहुः
    ॥ कुतूहलेन महता प्रोवाच मधुरं वचः ॥ ॥ सूत उवाच । श्रुणुध्वं मुनयः सर्वे श्रद्धया परया मुदा । वदामि
    भवरोगघ्नीं गीतां मातृस्वरूपिणीम् ॥ ॥ पुरा कैलासशिखरे सिद्धगन्धर्वसेविते । तत्र कल्पलतापुष्पमन्दिरेऽत्यन्तसुन्दरे
    ॥ ॥ व्याघ्राजिने समासीनं शुकादिमुनिवन्दितम् । बोधयन्तं परं तत्त्वं मध्ये मुनिगणे क्वचित् ॥ ॥ प्रणम्रवदना
    शश्वन्नमस्कुर्वन्तमादरात् । दृष्ट्वा विस्मयमापन्न पार्वती परिपृच्छति ॥ ॥ पार्वत्युवाच । ॐ नमो देव
    देवेश परात्पर जगद्गुरो । त्वां नमस्कुर्वते भक्त्या सुरासुरनराः सदा ॥ ॥ विधिविष्णुमहेन्द्राद्यैर्वन्द्यः
    खलु सदा भवान् । नमस्करोषि कस्मै त्वं नमस्काराश्रयः किल ॥ ॥ दृष्ट्वैतत्कर्म विपुलमाश्चर्य प्रतिभाति
    मे । किमेतन्न विजानेऽहं कृपया वद मे प्रभो ॥ ॥ भगवन् सर्वधर्मज्ञ व्रतानां व्रतनायकम् । ब्रूहि मे कृपया
    शम्भो गुरुमाहात्म्यमुत्तमम् ॥ ॥ केन मार्गेण भो स्वामिन् देही ब्रह्ममयो भवेत् । तत्कृपां कुरु मे स्वामिन्
    नमामि चरणौ तव ॥ ॥ इति सम्प्रार्थितः शश्वन्महादेवो महेश्वरः । आनन्दभरितः स्वान्ते पार्वतीमिदमब्रवीत्
    ॥ ॥ श्री महादेव उवाच । न वक्तव्यमिदं देवि रहस्यातिरहस्यकम् । न कस्यापि पुरा प्रोक्तं त्वद्भक्त्यर्थं
    वदामि तत् ॥ ॥ मम रूपाऽसि देवि त्वमतस्तत्कथयामि ते । लोकोपकारकः प्रश्नो न केनापि कृतः पुरा ॥ ॥ यस्य
    देवे परा भक्तिर्यथा देवे तथा गुरौ । तस्यैते कथिता ह्यर्थाः प्रकाशन्ते महात्मनः ॥ ॥ यो गुरुः स शिवः
    प्रोक्तो यः शिवः स गुरुः स्मृतः । विकल्पं यस्तु कुर्वीत स नरो गुरुतल्पगः ॥ ॥ दुर्लभं त्रिषु लोकेषु
    तच्छृणुष्व वदाम्यहम् । गुरुब्रह्म विना नान्यः सत्यं सत्यं वरानने ॥ ॥ वेदशास्त्रपुराणानि चेतिहासादिकानि
    च । मन्त्रयन्त्रादिविद्यानां मोहनोच्चाटनादिकम् ॥ ॥ शैवशाक्तागमादीनि ह्यन्ये च बहवो मताः । अपभ्रंशाः
    समस्तानां जीवानां भ्रान्तचेतसाम् ॥ ॥ जपस्तपो व्रतं तीर्थं यज्ञो दानं तथैव च । गुरुतत्त्वमविज्ञाय सर्वं
    व्यर्थं भवेत्प्रिये ॥ ॥ गुरुबुद्ध्यात्मनो नान्यत् सत्यं सत्यं वरानने । तल्लाभार्थं प्रयत्नस्तु कर्तव्यश्च
    मनीषिभिः ॥ ॥ गूढाविद्या जगन्माया देहश्चाज्ञानसम्भवः । विज्ञानं यत्प्रसादेन गुरुशब्देन कथ्यते ॥ ॥ यदङ्घ्रिकमलद्वन्द्वं
    द्वन्द्वतापनिवारकम् । तारकं भवसिन्धोश्च तं गुरुं प्रणमाम्यहम् ॥ ॥ देही ब्रह्म भवेद्यस्मात् त्वत्कृपार्थं
    वदामि तत् । सर्वपापविशुद्धात्मा श्रीगुरोः पादसेवनात् ॥ ॥ सर्वतीर्थावगाहस्य सम्प्राप्नोति फलं नरः ।
    गुरोः पादोदकं पीत्वा शेषं शिरसि धारयन् ॥ ॥ शोषणं पापपङ्कस्य दीपनं ज्ञानतेजसः । गुरोः पादोदकं सम्यक्
    संसारार्णवतारकम् ॥ ॥ अज्ञानमूलहरणं जन्मकर्मनिवारकम् । ज्ञानवैराग्यसिद्ध्यर्थं गुरोः पादोदकं पिबेत्
    ॥ ॥ गुरुपादोदकं पानं गुरोरुच्छिष्टभोजनम् । गुरुमूर्तेः सदा ध्यानं गुरोर्नाम सदा जपः ॥ ॥ स्वदेशिकस्यैव
    च नामकीर्तनं भवेदनन्तस्य शिवस्य कीर्तनम् । स्वदेशिकस्यैव च नामचिन्तनं भवेदनन्तस्य शिवस्य चिन्तनम्
    ॥ ॥ यत्पादाम्बुजरेणुर्वै कोऽपि संसारवारिधौ । सेतुबन्धायते नाथं देशिकं तमुपास्महे ॥ ॥ यदनुग्रहमात्रेण
    शोकमोहौ विनश्यतः । तस्मै श्रीदेशिकेन्द्राय नमोऽस्तु परमात्मने ॥ ॥ यस्मादनुग्रहं लब्ध्वा महदज्ञानमुत्सृजेत्
    । तस्मै श्रीदेशिकेन्द्राय नमश्चाभीष्टसिद्धये ॥ ॥ काशीक्षेत्रं निवासश्च जाह्नवी चरणोदकम् । गुरुर्विश्वेश्वरः
    साक्षात् तारकं ब्रह्मनिश्चयः ॥ ॥ गुरुसेवा गया प्रोक्ता देहः स्यादक्षयो वटः । तत्पादं विष्णुपादं स्यात्
    तत्र दत्तमनस्ततम् ॥ ॥ गुरुमूर्तिं स्मरेन्नित्यं गुरोर्नाम सदा जपेत् । गुरोराज्ञां प्रकुर्वीत गुरोरन्यं
    न भावयेत् ॥ ॥ गुरुवक्त्रे स्थितं ब्रह्म प्राप्यते तत्प्रसादतः । गुरोर्ध्यानं सदा कुर्यात् कुलस्त्री
    स्वपतिं यथा ॥ ॥ स्वाश्रमं च स्वजातिं च स्वकीर्तिं पुष्टिवर्धनम् । एतत्सर्वं परित्यज्य गुरुमेव समाश्रयेत्
    ॥ ॥ अनन्याश्चिन्तयन्तो ये सुलभं परमं सुखम् । तस्मात्सर्वप्रयत्नेन गुरोराराधनं कुरु ॥ ॥ गुरुवक्त्रे
    स्थिता विद्या गुरुभक्त्या च लभ्यते । त्रैलोक्ये स्फुटवक्तारो देवर्षिपितृमानवाः ॥ ॥ गुकारश्चान्धकारो
    हि रुकारस्तेज उच्यते । अज्ञानग्रासकं ब्रह्म गुरुरेव न संशयः ॥ ॥ गुकारश्चान्धकारस्तु रुकारस्तन्निरोधकृत्
    । अन्धकारविनाशित्वाद्गुरुरित्यभिधीयते ॥ गुकारो भवरोगः स्यात् रुकारस्तन्निरोधकृत् । भवरोगहरत्वाच्च
    गुरुरित्यभिधीयते ॥ ॥ गुकारश्च गुणातीतो रूपातीतो रुकारकः । गुणरूपविहीनत्वात् गुरुरित्यभिधीयते ॥ ॥ गुकारः
    प्रथमो वर्णो मायादिगुणभासकः । रुकारोऽस्ति परं ब्रह्म मायाभ्रान्तिविमोचकम् ॥ ॥ एवं गुरुपदं श्रेष्ठं
    देवानामपि दुर्लभम् । हाहाहूहूगणैश्चैव गन्धर्वाद्यैश्च पूजितम् ॥ ॥ ध्रुवं तेषां च सर्वेषां नास्ति तत्त्वं
    गुरोः परम् । गुरोराराधनं कुर्यात् स्वजीवत्वं निवेदयेत् ॥ ॥ आसनं शयनं वस्त्रं वाहनं भूषणादिकम् । साधकेन
    प्रदातव्यं गुरुसन्तोषकारणम् ॥ ॥ कर्मणा मनसा वाचा सर्वदाऽऽराधयेद्गुरुम् । दीर्घदण्डं नमस्कृत्य निर्लज्जो
    गुरुसन्निधौ ॥ ॥ शरीरमिन्द्रियं प्राणमर्थस्वजनबान्धवान् । आत्मदारादिकं सर्वं सद्गुरुभ्यो निवेदयेत्
    ॥ ॥ गुरुरेको जगत्सर्वं ब्रह्मविष्णुशिवात्मकम् । गुरोः परतरं नास्ति तस्मात्सम्पूजयेद्गुरुम् ॥ ॥ सर्वश्रुतिशिरोरत्नविराजितपदाम्बुजम्
    । वेदान्तार्थप्रवक्तारं तस्मात् सम्पूजयेद्गुरुम् ॥ ॥ यस्य स्मरणमात्रेण ज्ञानमुत्पद्यते स्वयम् । स
    एव सर्वसम्पत्तिः तस्मात्सम्पूजयेद्गुरुम् ॥ कृमिकोटिभिराविष्टं दुर्गन्धमलमूत्रकम् । श्लेष्मरक्तत्वचामांसैर्नद्धं
    चैतद्वरानने ॥ कृमिकोटिभिराविष्टं दुर्गन्धकुलदूषितम् । अनित्यं दुःखनिलयं देहं विद्धि वरानने ॥ ॥ संसारवृक्षमारूढाः
    पतन्ति नरकार्णवे । यस्तानुद्धरते सर्वान् तस्मै श्रीगुरवे नमः ॥ ॥ गुरुर्ब्रह्मा गुरुर्विष्णुर्गुरुर्देवो
    महेश्वरः । गुरुस्साक्षात् परब्रह्म तस्मै श्रीगुरवे नमः ॥ ॥ अज्ञानतिमिरान्धस्य ज्ञानाञ्जनशलाकया । चक्षुरुन्मीलितं
    येन तस्मै श्रीगुरवे नमः ॥ ॥ अखण्डमण्डलाकारं व्याप्तं येन चराचरम् । तत्पदं दर्शितं येन तस्मै श्रीगुरवे
    नमः ॥ ॥ स्थावरं जङ्गमं व्याप्तं यत्किञ्चित्सचराचरम् । त्वं पदं दर्शितं येन तस्मै श्रीगुरवे नमः ॥ ॥
    चिन्मयव्यापितं सर्वं त्रैलोक्यं सचराचरम् । असित्वं दर्शितं येन तस्मै श्रीगुरवे नमः ॥ ॥ निमिषान्निमिषार्धाद्वा
    यद्वाक्याद्वै विमुच्यते । स्वात्मानं शिवमालोक्य तस्मै श्रीगुरवे नमः ॥ ॥ चैतन्यं शाश्वतं शान्तं व्योमातीतं
    निरञ्जनम् । नादबिन्दुकलातीतं तस्मै श्रीगुरवे नमः ॥ ॥ निर्गुणं निर्मलं शान्तं जङ्गमं स्थिरमेव च । व्याप्तं
    येन जगत्सर्वं तस्मै श्रीगुरवे नमः ॥ ॥ स पिता स च मे माता स बन्धुः स च देवता । संसारमोहनाशाय तस्मै
    श्रीगुरवे नमः ॥ ॥ यत्सत्त्वेन जगत्सत्त्वं यत्प्रकाशेन भाति तत् । यदानन्देन नन्दन्ति तस्मै श्रीगुरवे
    नमः ॥ ॥ यस्मिन् स्थितमिदं सर्वं भाति यद्भानरूपतः । प्रियं पुत्रादि यत्प्रीत्या तस्मै श्रीगुरवे नमः
    ॥ ॥ येनेदं दर्शितं तत्त्वं चित्तचैत्यादिकं तथा । जाग्रत्स्वप्नसुषुप्त्यादि तस्मै श्रीगुरवे नमः ॥ ॥
    यस्य ज्ञानमिदं विश्वं न दृश्यं भिन्नभेदतः । सदैकरूपरूपाय तस्मै श्रीगुरवे नमः ॥ ॥ यस्य ज्ञातं मतं तस्य
    मतं यस्य न वेद सः । अनन्यभावभावाय तस्मै श्रीगुरवे नमः ॥ ॥ यस्मै कारणरूपाय कार्यरूपेण भाति यत् । कार्यकारणरूपाय
    तस्मै श्रीगुरवे नमः ॥ ॥ नानारूपमिदं विश्वं न केनाप्यस्ति भिन्नता । कार्यकारणरूपाय तस्मै श्रीगुरवे
    नमः ॥ ॥ ज्ञानशक्तिसमारूढतत्त्वमालाविभूषिणे । भुक्तिमुक्तिप्रदात्रे च तस्मै श्रीगुरवे नमः ॥ ॥ अनेकजन्मसम्प्राप्तकर्मबन्धविदाहिने
    । ज्ञानानलप्रभावेन तस्मै श्रीगुरवे नमः ॥ ॥ शोषणं भवसिन्धोश्च दीपनं क्षरसम्पदाम् । गुरोः पादोदकं यस्य
    तस्मै श्रीगुरवे नमः ॥ ॥ न गुरोरधिकं तत्त्वं न गुरोरधिकं तपः । न गुरोरधिकं ज्ञानं तस्मै श्रीगुरवे नमः
    ॥ ॥ मन्नाथः श्रीजगन्नाथो मद्गुरुः श्रीजगद्गुरुः । ममाऽऽत्मा सर्वभूतात्मा तस्मै श्रीगुरवे नमः ॥ ॥ गुरुरादिरनादिश्च
    गुरुः परमदैवतम् । गुरुमन्त्रसमो नास्ति तस्मै श्रीगुरवे नमः ॥ ॥ एक एव परो बन्धुर्विषमे समुपस्थिते ।
    गुरुः सकलधर्मात्मा तस्मै श्रीगुरवे नमः ॥ ॥ गुरुमध्ये स्थितं विश्वं विश्वमध्ये स्थितो गुरुः । गुरुर्विश्वं
    न चान्योऽस्ति तस्मै श्रीगुरवे नमः ॥ ॥ भवारण्यप्रविष्टस्य दिङ्मोहभ्रान्तचेतसः । येन सन्दर्शितः पन्थाः
    तस्मै श्रीगुरवे नमः ॥ ॥ तापत्रयाग्नितप्तानामशान्तप्राणिनां मुदे । गुरुरेव परा गङ्गा तस्मै श्रीगुरवे
    नमः ॥ अज्ञानेनाहिना ग्रस्ताः प्राणिनस्तान् चिकित्सकः । विद्यास्वरूपो भगवांस्तस्मै श्रीगुरवे नमः ॥
    अज्ञानसर्पदष्टानां प्राणिनां कश्चिकित्सकः । सम्यग् ज्ञानमहामन्त्रवेदिनं सद्गुरु विना ॥ ॥ हेतवे जगतामेव
    संसारार्णवसेतवे । प्रभवे सर्वविद्यानां शम्भवे गुरवे नमः ॥ ॥ ध्यानमूलं गुरोर्मूर्तिः पूजामूलं गुरोः
    पदम् । मन्त्रमूलं गुरोर्वाक्यं मुक्तिमूलं गुरोः कृपा ॥ ॥ सप्तसागरपर्यन्ततीर्थस्नानफलं तु यत् । गुरोः
    पादोदबिन्दोश्च सहस्रांशे न तत्फलम् ॥ ॥ शिवे रुष्टे गुरुस्त्राता गुरौ रुष्टे न कश्चन । लब्ध्वा कुलगुरुं
    सम्यग्गुरुमेव समाश्रयेत् ॥ ॥ मधुलुब्धो यथा भृङ्गः पुष्पात्पुष्पान्तरं व्रजेत् । ज्ञानलुब्धस्तथा शिष्यो
    गुरोर्गुर्वन्तरं व्रजेत् ॥ ॥ वन्दे गुरुपदद्वन्द्वं वाङ्मनातीतगोचरम् । श्वेतरक्तप्रभाभिन्नं शिवशक्त्यात्मकं
    परम् ॥ ॥ गुकारं च गुणातीतं रूकारं रूपवर्जितम् । गुणातीतमरूपं च यो दद्यात्स गुरुः स्मृतः ॥ ॥ अत्रिनेत्रः
    शिवः साक्षात् द्विबाहुश्च हरिः स्मृतः । योऽचतुर्वदनो ब्रह्मा श्रीगुरुः कथितः प्रिये ॥ ॥ अयं मयाञ्जलिर्बद्धो
    दयासागरसिद्धये । यदनुग्रहतो जन्तुश्चित्रसंसारमुक्तिभाक् ॥ ॥ श्रीगुरोः परमं रूपं विवेकचक्षुरग्रतः ।
    मन्दभाग्या न पश्यन्ति अन्धाः सूर्योदयं यथा ॥ ॥ कुलानां कुलकोटीनां तारकस्तत्र तत् क्षणात् । अतस्तं
    सद्गुरुं ज्ञात्वा त्रिकालमभिवादयेत् ॥ ॥ श्रीनाथचरणद्वन्द्वं यस्यां दिशि विराजते । तस्यां दिशि नमस्कुर्यात्
    भक्त्या प्रतिदिनं प्रिये ॥ ॥ साष्टाङ्गप्रणिपातेन स्तुवन्नित्यं गुरुं भजेत् । भजनात् स्थैर्यमाप्नोति
    स्वस्वरूपमयो भवेत् ॥ ॥ दोर्भ्यां पद्भ्यां च जानुभ्यामुरसा शिरसा दृशा । मनसा वचसा चेति प्रणामोऽष्टाङ्ग
    उच्यते ॥ ॥ तस्यै दिशे सततमञ्जलिरेष नित्यं प्रक्षिप्यतां मुखरितैर्मधुरैः प्रसूनैः । जागर्ति यत्र भगवान्
    गुरुचक्रवर्ती विश्वस्थितिप्रलयनाटकनित्यसाक्षी ॥ ॥ अभ्यस्तैः किमु दीर्घकालविमलैर्व्याधिप्रदैर्दुष्करैः
    प्राणायामशतैरनेककरणैर्दुःखात्मकैर्दुर्जयैः । यस्मिन्नभ्युदिते विनश्यति बली वायुः स्वयं तत् क्षणात्
    प्राप्तुं तत्सहजस्वभावमनिशं सेवेत चैकं गुरुम् ॥ ॥ ज्ञानं विना मुक्तिपदं लभ्यते गुरुभक्तितः । गुरोस्समानतो
    नान्यत् साधनं गुरुमार्गिणाम् ॥ ॥ यस्मात्परतरं नास्ति नेति नेतीति वै श्रुतिः । मनसा वचसा चैव सत्यमाराधयेद्गुरुम्
    ॥ ॥ गुरोः कृपाप्रसादेन ब्रह्मविष्णुमहेश्वराः । सामर्थ्यमभजन् सर्वे सृष्टिस्थित्यन्तकर्मणि ॥ ॥ देवकिन्नरगन्धर्वाः
    पितृयक्षास्तु तुम्बुरः । मुनयोऽपि न जानन्ति गुरुशुश्रूषणे विधिम् ॥ ॥ तार्किकाश्छान्दसाश्चैव दैवज्ञाः
    कर्मठाः प्रिये । लौकिकास्ते न जानन्ति गुरुतत्त्वं निराकुलम् ॥ ॥ महाहङ्कारगर्वेण ततोविद्याबलेन च ।
    भ्रमन्ति चास्मिन् संसारे घटीयन्त्रं यथा पुनः ॥ ॥ यज्ञिनोऽपि न मुक्ताः स्युः न मुक्ता योगिनस्तथा ।
    तापसा अपि नो मुक्ता गुरुतत्त्वात्पराङ्मुखाः ॥ ॥ न मुक्तास्तु च गन्धर्वाः पितृयक्षास्तु चारणाः । ऋषयः
    सिद्धदेवाद्या गुरुसेवापराङ्मुखाः ॥ ॥ इति श्रीस्कन्दपुराणे उत्तरखण्डे उमामहेश्वर संवादे श्री गुरुगीतायां
    प्रथमोऽध्यायः ॥
