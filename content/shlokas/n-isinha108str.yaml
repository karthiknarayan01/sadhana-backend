id: n-isinha108str
category: stotram
name:
  english: nṟisinha108str
  devanagari: न्ऱिसिन्ह१०८स्त्र्
content:
  english: sadashivah | gunabhadro mahabhadro balabhadrassubhadrakah || 5|| karaḻo vikaraḻashca gatayussarvakartrikah
    | bhairavadambaro divyashcagamyassarvashatrujit || 6|| amoghastrashshastradharah savyajutassureshvarah
    | sahasrabahurvajranakhassarvasiddhirjanardanah || 7|| ananto bhagavan sthulashcagamyashca paravarah
    | sarvamantraikarupashca sarvayantravidharanah || 8|| avyayah paramanandah kalajit khagavahanah |
    bhaktativatsalo'vyaktassuvyaktassulabhashshucih || 9|| lokaikanayakassarvashsharanagatavatsalah |
    dhiro dharashca sarvajno bhimo bhimaparakramah || 10|| devapriyo nutah pujyo bhavahrit parameshvarah
    | shrivatsavakshah shrivaso vibhussankarshanah prabhuh || 11|| trivikramastrilokatma kamassarveshvareshvarah
    | vishvambharah sthirabhashca'cyutah purushottamah || 12|| adhokshajo'kshayassevyo vanamali prakampanah
    | gururlokagurussrashta paramjyotih parayanah || 13|| jvalahobilamalola
  devanagari: सदाशिवः । गुणभद्रो महाभद्रो बलभद्रस्सुभद्रकः ॥ ५॥ कराळो विकराळश्च गतायुस्सर्वकर्तृकः । भैरवाडंबरो
    दिव्यश्चागम्यस्सर्वशत्रुजित् ॥ ६॥ अमोघास्त्रश्शस्त्रधरः सव्यजूटस्सुरेश्वरः । सहस्रबाहुर्वज्रनखस्सर्वसिद्धिर्जनार्दनः
    ॥ ७॥ अनन्तो भगवान् स्थूलश्चागम्यश्च परावरः । सर्वमन्त्रैकरूपश्च सर्वयन्त्रविधारणः ॥ ८॥ अव्ययः परमानन्दः
    कालजित् खगवाहनः । भक्तातिवत्सलोऽव्यक्तस्सुव्यक्तस्सुलभश्शुचिः ॥ ९॥ लोकैकनायकस्सर्वश्शरणागतवत्सलः ।
    धीरो धरश्च सर्वज्ञो भीमो भीमपराक्रमः ॥ १०॥ देवप्रियो नुतः पूज्यो भवहृत् परमेश्वरः । श्रीवत्सवक्षाः
    श्रीवासो विभुस्सङ्कर्षणः प्रभुः ॥ ११॥ त्रिविक्रमस्त्रिलोकात्मा कामस्सर्वेश्वरेश्वरः । विश्वंभरः स्थिराभश्चाऽच्युतः
    पुरुषोत्तमः ॥ १२॥ अधोक्षजोऽक्षयस्सेव्यो वनमाली प्रकंपनः । गुरुर्लोकगुरुस्स्रष्टा परंज्योतिः परायणः
    ॥ १३॥ ज्वालाहोबिलमालोल
