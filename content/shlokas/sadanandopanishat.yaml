id: sadanandopanishat
category: upanishad
name:
  english: sadanandopanishat
  devanagari: सदानन्दोपनिषत्
content:
  english: adhare dahare'vyakte svarnasphatikavaidrumam | nirantaranusandhanat tadantardharane viduh ||
    caturdalam dvadasharam dvyashramavyaktakam shivam | dahare'ngushthamatram tamumakantamaharnisham |
    anirakaramatmanam dhritva yanti param padam || parat parataro brahma tatparat parato harih | tatparat
    parato'dhishastasmat syaduttarah shivah || jatavedasamavyaktam vyaktavyaktam param sada | tamatmastham
    ye'nupashyanti dhirah | tesham shantih shashvati netaresham || antardharanashaktena hyashaktena dvijottamah
    | santkritya guruna dattam shaivam lingamurahsthale | dharyam viprena muktyarthe shivatattvavido viduh
    || yenaciratsarvapapam vyapohya paratparam purushamupaiti vidvan | asya matra akaro brahmarupa ukaro
    vishnurupo makarah kalakalah ardhamatra paramashivah onkaro lingam || yo'sau sarvaishu vedeshu pathyate
    hyaja ishvarah | tasmattaddharanadetallingadehamalaukikam | mrite'pi tanna dahyeta bile caitadvinikshipeta
    || ne karmana na prajaya dhanena tyagenaike'mritatvamanashuh || yo va svahastarcitalingamekam paratpara
    dharayate naro va | tasyaiva labhyah parameshvaro'sau niranjanam samyamupaiti divyam || shivalingadharam
    vipram vipannam ta na dahayet | yadi va dahayettasya brahmahatya tada bhavet || yadidam lingam sakaḻam
    sakaḻanishkaḻam nishkalam ca sthulam sukshmam ca tatparam sthule sthulam sukshme sukshmam karane tatparam
    ca || atmanabharanim kritva pranavam cottararanim | dhyananirmathanadeva pasham dahati manavah | antarbahishca
    tallingam vidhatte yastu shashvatam || avidya''varanam bhittva brahmanah sayujyam salokatamapnoti
    | tadidam lingam prim | tadidam om satyam | yo vidvan brahmacari grihi vanaprastho yatirva sadanandopanishadam
    pathati so'gniputo bhavati | sa satyaputo bhavati | svarnasteyat puto bhavati | brahmahatyayah puto
    bhavati | sa sakalabhogabhuk deham tyaktva shivasayujyameti | ityupanishat ||
  devanagari: आधारे दहरेऽव्यक्ते स्वर्णस्फाटिकवैद्रुमम् । निरन्तरानुसन्धानात् तदन्तर्धारणे विदुः ॥ चतुर्दलं
    द्वादशारं द्व्यश्रमव्यक्तकं शिवम् । दहरेऽङ्गुष्ठमात्रं तमुमाकान्तमहर्निशम् । अनिराकारमात्मानं धृत्वा
    यान्ति परं पदम् ॥ परात् परतरो ब्रह्मा तत्परात् परतो हरिः । तत्परात् परतोऽधीशस्तस्मात् स्यादुत्तरः
    शिवः ॥ जातवेदसमव्यक्तं व्यक्ताव्यक्तं परं सदा । तमात्मस्थं येऽनुपश्यन्ति धीराः । तेषां शान्तिः शाश्वती
    नेतरेषाम् ॥ अन्तर्धारणशक्तेन ह्यशक्तेन द्विजोत्तमाः । सन्त्कृत्य गुरुणा दत्तं शैवं लिङ्गमुरःस्थले
    । धार्यं विप्रेण मुक्त्यर्थे शिवतत्त्वविदो विदुः ॥ येनाचिरात्सर्वपापं व्यपोह्य परात्परं पुरुषमुपैति
    विद्वान् । अस्य मात्रा अकारो ब्रह्मरूप उकारो विष्णुरूपो मकारः कालकालः अर्धमात्रा परमशिवः ओङ्कारो लिङ्गम्
    ॥ योऽसौ सर्वैषु वेदेषु पठ्यते ह्यज ईश्वरः । तस्मात्तद्धारणादेतल्लिङ्गदेहमलौकिकम् । मृतेऽपि तन्न दह्येत
    बिले चैतद्विनिक्षिपेत ॥ ने कर्मणा न प्रजया धनेन त्यागेनैकेऽमृतत्वमानशुः ॥ यो वा स्वहस्तार्चितलिङ्गमेकं
    परात्पर धारयते नरो वा । तस्यैव लभ्यः परमेश्वरोऽसौ निरञ्जनं साम्यमुपैति दिव्यम् ॥ शिवलिङ्गधरं विप्रं
    विपन्नं त न दाहयेत् । यदि वा दाहयेत्तस्य ब्रह्महत्या तदा भवेत् ॥ यदिदं लिङ्गं सकळं सकळनिष्कळं निष्कलं
    च स्थूलं सूक्ष्मं च तत्परं स्थूले स्थूलं सूक्ष्मे सूक्ष्मं कारणे तत्परं च ॥ आत्मानभरणिं कृत्वा प्रणवं
    चोत्तरारणिम् । ध्याननिर्मथनादेव पाशं दहति मानवः । अन्तर्बहिश्च तल्लिङ्गं विधत्ते यस्तु शाश्वतम् ॥
    अविद्याऽऽवरणं भित्त्वा ब्रह्मणः सायुज्यं सलोकतामाप्नोति । तदिदं लिङ्गं प्रीम् । तदिदं ॐ सत्यम् । यो
    विद्वान् ब्रह्मचारी गृही वानप्रस्थो यतिर्वा सदानन्दोपनिषदं पठति सोऽग्निपूतो भवति । स सत्यपूतो भवति
    । स्वर्णस्तेयात् पूतो भवति । ब्रह्महत्यायाः पूतो भवति । स सकलभोगभुक् देहं त्यक्त्वा शिवसायुज्यमेति
    । इत्युपनिषत् ॥
