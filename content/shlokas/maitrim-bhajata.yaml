id: maitrim-bhajata
category: stotram
name:
  english: Maitrim Bhajata
content:
  english: maitrim bhajata akhilahrijjetrim atmavadeva paranapi pashyata | yuddham tyajata spardham tyajata
    tyajata pareshu akramamakramanam || janani prithivi kamadugha''ste janako devah sakaladayaluh | damyata
    datta dayadhvam janatah shreyo bhuyat sakalajananam ||
  devanagari: मैत्रीं भजत अखिलहृज्जेत्रीम् आत्मवदेव परानपि पश्यत । युद्धं त्यजत स्पर्धां त्यजत त्यजत परेषु
    अक्रममाक्रमणम् ॥ जननी पृथिवी कामदुघाऽऽस्ते जनको देवः सकलदयालुः । दाम्यत दत्त दयध्वं जनताः श्रेयो भूयात्
    सकलजनानाम् ॥
