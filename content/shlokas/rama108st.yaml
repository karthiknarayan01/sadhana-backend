id: rama108st
category: stotram
name:
  english: rama108st
  devanagari: राम१०८स्त्
content:
  english: shriraghavam dasharathatmajamaprameyam sitapatim raghukulanvayaratnadipam | ajanubahumaravindadalayataksham
    ramam nishacaravinashakaram namami || vaidehisahitam suradrumatale haime mahamandape madhye pushpakamasane
    manimaye virasane susthitam | agre vacayati prabhanjanasute tattvam munibhyah param vyakhyantam bharatadibhih
    parivritam ramam bhaje shyamalam || om shriramo ramabhadrashca ramacandrashca shashvatah | rajivalocanah
    shriman rajendro raghupungavah || 1|| janakivallabho jaitro jitamitro janardanah | vishvamitrapriyo
    dantah shatrujicchatrutapanah || 2|| valipramathano vagmi satyavak satyavikramah | satyavrato vratadharah
    sada hanumadashritah || 3|| kausaleyah kharadhvamsi viradhavadhapanditah | vibhishanaparitrata harakodandakhandanah
    || 4|| saptatalaprabhetta ca dashagrivashiroharah | jamadagnyamahadarpadalanastatakantakah || 5||
    vedantasaro vedatma bhavarogasya bheshajam | dushanatrishiro hanta trimurtistrigunatmakah || 6|| trivikramastrilokatma
    punyacaritrakirtanah | trilokarakshako dhanvi dandakaranyapavanah || 7|| ahalyashapashamanah pitribhakto
    varapradah | jitendriyo jitakrodho jitamitro jagadguruh || 8|| rikshavanarasamghati citrakutasamashrayah
    | jayantatranavaradah sumitraputrasevitah || 9|| sarvadevadidevashca mritavanarajivanah | mayamaricahanta
    ca mahadevo mahabhujah || 10|| sarvadevastutah saumyo brahmanyo munisamstutah | mahayogi mahodarah
    sugrivepsitarajyadah || 11|| sarvapunyadhikaphalah smritasarvaghanashanah | adidevo mahadevo mahapurusha
    eva ca || 12|| punyodayo dayasarah puranapurushottamah | smitavaktro mitabhashi purvabhashi ca raghavah
    || 13|| anantagunagambhiro dhirodattagunottamah | mayamanushacaritro mahadevadipujitah || 14|| setukrijjitavarishah
    sarvatirthamayo harih | shyamangah sundarah shurah pitavasa dhanurdharah || 15|| sarvayajnadhipo yajva
    jaramaranavarjitah | shivalingapratishthata sarvavagunavarjitah || 16|| paramatma param brahma saccidanandavigrahah
    | param jyotih paramdhama parakashah paratparah || 17|| pareshah paragah parah sarvadevatmakah parah
    || || iti shriramashtottarashatanamastotram sampurnam ||
  devanagari: श्रीराघवं दशरथात्मजमप्रमेयं सीतापतिं रघुकुलान्वयरत्नदीपम् । आजानुबाहुमरविन्ददलायताक्षं रामं
    निशाचरविनाशकरं नमामि ॥ वैदेहीसहितं सुरद्रुमतले हैमे महामण्डपे मध्ये पुष्पकमासने मणिमये वीरासने सुस्थितम्
    । अग्रे वाचयति प्रभञ्जनसुते तत्त्वं मुनिभ्यः परं व्याख्यान्तं भरतादिभिः परिवृतं रामं भजे श्यामलम्
    ॥ ॐ श्रीरामो रामभद्रश्च रामचन्द्रश्च शाश्वतः । राजीवलोचनः श्रीमान् राजेन्द्रो रघुपुङ्गवः ॥ १॥ जानकीवल्लभो
    जैत्रो जितामित्रो जनार्दनः । विश्वामित्रप्रियो दान्तः शत्रुजिच्छत्रुतापनः ॥ २॥ वालिप्रमथनो वाग्मी
    सत्यवाक् सत्यविक्रमः । सत्यव्रतो व्रतधरः सदा हनुमदाश्रितः ॥ ३॥ कौसलेयः खरध्वंसी विराधवधपण्डितः । विभीषणपरित्राता
    हरकोदण्डखण्डनः ॥ ४॥ सप्ततालप्रभेत्ता च दशग्रीवशिरोहरः । जामदग्न्यमहादर्पदलनस्ताटकान्तकः ॥ ५॥ वेदान्तसारो
    वेदात्मा भवरोगस्य भेषजम् । दूषणत्रिशिरो हन्ता त्रिमूर्तिस्त्रिगुणात्मकः ॥ ६॥ त्रिविक्रमस्त्रिलोकात्मा
    पुण्यचारित्रकीर्तनः । त्रिलोकरक्षको धन्वी दण्डकारण्यपावनः ॥ ७॥ अहल्याशापशमनः पितृभक्तो वरप्रदः । जितेन्द्रियो
    जितक्रोधो जितामित्रो जगद्गुरुः ॥ ८॥ ऋक्षवानरसंघाती चित्रकूटसमाश्रयः । जयन्तत्राणवरदः सुमित्रापुत्रसेवितः
    ॥ ९॥ सर्वदेवादिदेवश्च मृतवानरजीवनः । मायामारीचहन्ता च महादेवो महाभुजः ॥ १०॥ सर्वदेवस्तुतः सौम्यो ब्रह्मण्यो
    मुनिसंस्तुतः । महायोगी महोदारः सुग्रीवेप्सितराज्यदः ॥ ११॥ सर्वपुण्याधिकफलः स्मृतसर्वाघनाशनः । आदिदेवो
    महादेवो महापूरुष एव च ॥ १२॥ पुण्योदयो दयासारः पुराणपुरुषोत्तमः । स्मितवक्त्रो मिताभाषी पूर्वभाषी च
    राघवः ॥ १३॥ अनन्तगुणगम्भीरो धीरोदात्तगुणोत्तमः । मायामानुषचारित्रो महादेवादिपूजितः ॥ १४॥ सेतुकृज्जितवारीशः
    सर्वतीर्थमयो हरिः । श्यामाङ्गः सुन्दरः शूरः पीतवासा धनुर्धरः ॥ १५॥ सर्वयज्ञाधिपो यज्वा जरामरणवर्जितः
    । शिवलिङ्गप्रतिष्ठाता सर्वावगुणवर्जितः ॥ १६॥ परमात्मा परं ब्रह्म सच्चिदानन्दविग्रहः । परं ज्योतिः
    परंधाम पराकाशः परात्परः ॥ १७॥ परेशः पारगः पारः सर्वदेवात्मकः परः ॥ ॥ इति श्रीरामाष्टोत्तरशतनामस्तोत्रं
    सम्पूर्णम् ॥
