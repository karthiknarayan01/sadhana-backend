id: sri-rama-charita-manasa-ayodhya-kanda
category: stotram
name:
  english: Sri Rama Charita Manasa - Ayodhya Kanda
content:
  english: shriganeshayanamah shrijanakivallabho vijayate shriramacaritamanasa dvitiya sopana yasyanke
    ca vibhati bhudharasuta devapaga mastake bhale balavidhurgale ca garalam yasyorasi vyalarat| so'yam
    bhutivibhushanah suravarah sarvadhipah sarvada sharvah sarvagatah shivah shashinibhah shrishankarah
    patu mam || || prasannatam ya na gatabhishekatastatha na mamle vanavasaduhkhatah| mukhambujashri raghunandanasya
    me sadastu sa manjulamangalaprada || || nilambujashyamalakomalangam sitasamaropitavamabhagam| panau
    mahasayakacarucapam namami ramam raghuvamshanatham || shriguru carana saroja raja nija manu mukuru
    sudhari| baranu~ raghubara bimala jasu jo dayaku phala cari || jaba tem ramu byahi ghara ae| nita
    nava mangala moda badhae || bhuvana caridasa bhudhara bhari| sukrita megha barashahi sukha bari ||
    ridhi sidhi sampati nadim suhai| umagi avadha ambudhi kahu~ ai || manigana pura nara nari sujati|
    suci amola sundara saba bha~ti || kahi na jai kachu nagara bibhuti| janu etania biranci karatuti ||
    saba bidhi saba pura loga sukhari| ramacanda mukha candu nihari || mudita matu saba sakhim saheli|
    phalita biloki manoratha beli || rama rupu gunasilu subh | pramudita hoi dekhi suni r saba kem ura
    abhilashu asa kahahim manai mahesu| apa achata jubaraja pada ramahi deu naresu || || eka samaya saba
    sahita samaja| rajasabha~ raghuraju biraja || sakala sukrita murati naranahu| rama sujasu suni atihi
    uchahu || nripa saba rahahim kripa abhilashem| lokapa karahim priti rukha rakhem || tibhuvana tini
    kala jaga mahim| bhuri bhaga dasaratha sama nahim || mangalamula ramu suta jasu| jo kachu kahija thora
    sabu tasu || raya~ subhaya~ mukuru kara linha| badanu biloki mukuta sama kinha || shravana samipa
    bhe sita kesa| manahu~ jarathapanu asa upadesa || nripa jubaraja rama kahu~ dehu| jivana janama lahu
    kina lehu || do yaha bicaru ura ani nripa sudinu suavasaru pai| prema pulaki tana mudita mana gurahi
    sunayu jai || || kahi bhualu sunia muninayaka| bhe rama saba bidhi saba layaka || sevaka saciva sakala
    purabasi| je hamare ari mitra udasi || sabahi ramu priya jehi bidhi mohi| prabhu asisa janu tanu dhari
    sohi || bipra sahita parivara gosaim| karahim chohu saba raurihi nai || je gura carana renu sira dharahim|
    te janu sakala bibhava basa karahim || mohi sama yahu anubhayu na dujem| sabu payu~ raja pavani pujem
    || aba abhilashu eku mana morem| pujahi natha anugraha torem || muni prasanna lakhi sahaja sanehu|
    kaheu naresa rajayasu dehu || do rajana raura namu jasu saba abhimata datara| phala anugami mahipa
    mani mana abhilashu tumhara || || saba bidhi guru prasanna jiya~ jani| boleu rau raha~si mridu bani
    || natha ramu kariahim jubaraju| kahia kripa kari karia samaju || mohi achata yahu hoi uchahu| lahahim
    loga saba locana lahu || prabhu prasada siva sabi nibahim| yaha lalasa eka mana mahim || puni na soca
    tanu rahu ki j | jehim na hoi pachem pachit || suni muni dasaratha bacana suhae| mangala moda mula
    mana bhae || sunu nripa jasu bimukha pachitahim| jasu bhajana binu jarani na jahim || bhayu tumhara
    tanaya soi svami| ramu punita prema anugami || do begi bilambu na karia nripa sajia sabui samaju|
    sudina sumangalu tabahim jaba ramu hohim jubaraju || || mudita mahipati mandira ae| sevaka saciva
    sumantru bolae || kahi jayajiva sisa tinha nae| bhupa sumangala bacana sunae || jaum pa~cahi mata
    lagai nika| karahu harashi hiya~ ramahi tika || mantri mudita sunata priya bani| abhimata birava~
    pareu janu pani || binati saciva karahi kara jori| jiahu jagatapati barisa karori || jaga mangala
    bhala kaju bicara| begia natha na laia bara || nripahi modu suni saciva subhasha| barhata baunra janu
    lahi susakha || do kaheu bhupa muniraja kara joi joi ayasu hoi| rama raja abhisheka hita begi karahu
    soi soi || || harashi munisa kaheu mridu bani| anahu sakala sutiratha pani || aushadha mula phula
    phala pana| kahe nama gani mangala nana || camara carama basana bahu bha~ti| roma pata pata aganita
    jati || manigana mangala bastu aneka| jo jaga jogu bhupa abhisheka || beda bidita kahi sakala bidhana|
    kaheu racahu pura bibidha bitana || saphala rasala pugaphala kera| ropahu bithinha pura cahu~ phera
    || racahu manju mani caukem caru| kahahu banavana begi bajaru || pujahu ganapati gura kuladeva| saba
    bidhi karahu bhumisura seva || do dhvaja pataka torana kalasa sajahu turaga ratha naga| sira dhari
    munibara bacana sabu nija nija kajahim laga || || jo munisa jehi ayasu dinha| so tehim kaju prathama
    janu kinha || bipra sadhu sura pujata raja| karata rama hita mangala kaja || sunata rama abhisheka
    suhava| baja gahagaha avadha badhava || rama siya tana saguna janae| pharakahim mangala anga suhae
    || pulaki saprema parasapara kahahim| bharata agamanu sucaka ahahim || bhe bahuta dina ati avaseri|
    saguna pratiti bhenta priya keri || bharata sarisa priya ko jaga mahim| ihi saguna phalu dusara nahim
    || ramahi bandhu soca dina rati| andanhi kamatha hradu jehi bha~ti || do ehi avasara mangalu parama
    suni raha~seu ranivasu| sobhata lakhi bidhu barhata janu baridhi bici bilasu || || prathama jai jinha
    bacana sunae| bhushana basana bhuri tinha pae || prema pulaki tana mana anuragim| mangala kalasa sajana
    saba lagim || caukem caru sumitra~ puri| manimaya bibidha bha~ti ati ruri || ana~da magana rama mahatari|
    die dana bahu bipra ha~kari || pujim gramadebi sura naga| kaheu bahori dena balibhaga || jehi bidhi
    hoi rama kalyanu| dehu daya kari so baradanu || gavahim mangala kokilabayanim| bidhubadanim mrigasavakanayanim
    || do rama raja abhisheku suni hiya~ harashe nara nari| lage sumangala sajana saba bidhi anukula bicari
    || || taba naranaha~ basishthu bolae| ramadhama sikha dena pathae || gura agamanu sunata raghunatha|
    dvara ai pada nayu matha || sadara aragha dei ghara ane| soraha bha~ti puji sanamane || gahe carana
    siya sahita bahori| bole ramu kamala kara jori || sevaka sadana svami agamanu| mangala mula amangala
    damanu || tadapi ucita janu boli sapriti| pathia kaja natha asi niti || prabhuta taji prabhu kinha
    sanehu| bhayu punita aju yahu gehu || ayasu hoi so karaum gosai| sevaka lahi svami sevakai || do suni
    saneha sane bacana muni raghubarahi prasamsa| rama kasa na tumha kahahu asa hamsa bamsa avatamsa ||
    || barani rama guna silu subh | bole prema pulaki munir || bhupa sajeu abhisheka samaju| cahata dena
    tumhahi jubaraju || rama karahu saba sanjama aju| jaum bidhi kusala nibahai kaju || guru sikha dei
    raya pahim gayu| rama hridaya~ asa bisamu bhayu || janame eka sanga saba bhai| bhojana sayana keli
    larikai || karanabedha upabita biaha| sanga sanga saba bhe uchaha || bimala bamsa yahu anucita eku|
    bandhu bihai baraehi abhisheku || prabhu saprema pachitani suhai| haru bhagata mana kai kutilai ||
    do tehi avasara ae lakhana magana prema ananda| sanamane priya bacana kahi raghukula kairava canda
    || || bajahim bajane bibidha bidhana| pura pramodu nahim jai bakhana || bharata agamanu sakala manavahim|
    avahu~ begi nayana phalu pavahim || hata bata ghara galim athai| kahahim parasapara loga logai ||
    kali lagana bhali ketika bara| pujihi bidhi abhilashu hamara || kanaka singhasana siya sameta| baithahim
    ramu hoi cita ceta || sakala kahahim kaba hoihi kali| bighana manavahim deva kucali || tinhahi sohai
    na avadha badhava| corahi candini rati na bhava || sarada boli binaya sura karahim| barahim bara paya
    lai parahim || do bipati hamari biloki barai matu karia soi aju| ramu jahim bana raju taji hoi sakala
    surakaju || || suni sura binaya tharhai pachitati| bhiu~ saroja bipina himarati || dekhi deva puni
    kahahim nihori| matu tohi nahim thoriu khori || bisamaya harasha rahita raghur | tumha janahu saba
    rama prabh || jiva karama basa sukha dukha bhagi| jaia avadha deva hita lagi || bara bara gahi carana
    sa~kocau| cali bicari bibudha mati poci || u~ca nivasu nici karatuti| dekhi na sakahim parai bibhuti
    || agila kaju bicari bahori| karahahim caha kusala kabi mori || harashi hridaya~ dasaratha pura ai|
    janu graha dasa dusaha dukhadai || do namu manthara mandamati ceri kaikei keri| ajasa petari tahi
    kari gi gira mati pheri || || dikha manthara nagaru banava| manjula mangala baja badhava || puchesi
    loganha kaha uchahu| rama tilaku suni bha ura dahu || kari bicaru kubuddhi kujati| hoi akaju kavani
    bidhi rati || dekhi lagi madhu kutila kirati| jimi gava~ taki leu~ kehi bha~ti || bharata matu pahim
    gi bilakhani| ka anamani hasi kaha ha~si rani || utaru dei na lei usasu| nari carita kari dhari a~su
    || ha~si kaha rani galu bara torem| dinha lakhana sikha asa mana morem || tabahu~ na bola ceri barai
    papini| charai svasa kari janu sa~pini || do sabhaya rani kaha kahasi kina kusala ramu mahipalu| lakhanu
    bharatu ripudamanu suni bha kubari ura salu || || kata sikha dei hamahi kau mai| galu karaba kehi
    kara balu pai || ramahi charai kusala kehi aju| jehi janesu dei jubaraju || bhayu kausilahi bidhi
    ati dahina| dekhata garaba rahata ura nahina || dekhehu kasa na jai saba sobha| jo avaloki mora manu
    chobha || putu bidesa na socu tumharem| janati hahu basa nahu hamarem || nida bahuta priya seja turai|
    lakhahu na bhupa kapata caturai || suni priya bacana malina manu jani| jhuki rani aba rahu aragani
    || puni asa kabahu~ kahasi gharaphori| taba dhari jibha karhaavu~ tori || do kane khore kubare kutila
    kucali jani| tiya biseshi puni ceri kahi bharatamatu musukani || || priyabadini sikha dinhiu~ tohi|
    sapanehu~ to para kopu na mohi || sudinu sumangala dayaku soi| tora kaha phura jehi dina hoi || jetha
    svami sevaka laghu bhai| yaha dinakara kula riti suhai || rama tilaku jaum sa~cehu~ kali| deu~ magu
    mana bhavata ali || kausalya sama saba mahatari| ramahi sahaja subhaya~ piari || mo para karahim sanehu
    biseshi| maim kari priti paricha dekhi || jaum bidhi janamu dei kari chohu| hohu~ rama siya puta putohu
    || prana tem adhika ramu priya morem| tinha kem tilaka chobhu kasa torem || do bharata sapatha tohi
    satya kahu parihari kapata durau| harasha samaya bisamu karasi karana mohi sunau || || ekahim bara
    asa saba puji| aba kachu kahaba jibha kari duji || phorai jogu kaparu abhaga| bhaleu kahata dukha
    rurehi laga || kahahim jhuthi phuri bata banai| te priya tumhahi karui maim mai || hamahu~ kahabi
    aba thakurasohati| nahim ta mauna rahaba dinu rati || kari kurupa bidhi parabasa kinha| bava so lunia
    lahia jo dinha || kau nripa hau hamahi ka hani| ceri charai aba hoba ki rani || jarai jogu subhau
    hamara| anabhala dekhi na jai tumhara || tatem kachuka bata anusari| chamia debi barai cuka hamari
    || do gurha kapata priya bacana suni tiya adharabudhi rani| suramaya basa bairinihi suhda jani patiani
    || || sadara puni puni pu~chati ohi| sabari gana mrigi janu mohi || tasi mati phiri ahi jasi bhabi|
    rahasi ceri ghata janu phabi || tumha pu~chahu maim kahata der ~| dhareu mora gharaphori n ~ || saji
    pratiti bahubidhi garhai choli| avadha sarhasati taba boli || priya siya ramu kaha tumha rani| ramahi
    tumha priya so phuri bani || raha prathama aba te dina bite| samu phirem ripu hohim pimrite || bhanu
    kamala kula poshanihara| binu jala jari kari soi chara || jari tumhari caha savati ukhari| ru~dhahu
    kari upau bara bari || do tumhahi na socu sohaga bala nija basa janahu rau| mana malina muha mitha
    nripa raura sarala subhau || || catura ga~bhira rama mahatari| bicu pai nija bata sa~vari || pathe
    bharatu bhupa naniaurem| rama matu mata janava rurem || sevahim sakala savati mohi nikem| garabita
    bharata matu bala pi kem || salu tumhara kausilahi mai| kapata catura nahim hoi janai || rajahi tumha
    para premu biseshi| savati subhau saki nahim dekhi || raci prampacu bhupahi apanai| rama tilaka hita
    lagana dharai || yaha kula ucita rama kahu~ tika| sabahi sohai mohi suthi nika || agili bata samujhi
    daru mohi| deu daiu phiri so phalu ohi || do raci paci kotika kutilapana kinhesi kapata prabodhu ||
    kahisi katha sata savati kai jehi bidhi barha birodhu || || bhavi basa pratiti ura ai| pu~cha rani
    puni sapatha devai || ka puchahu~ tumha abahu~ na jana| nija hita anahita pasu pahicana || bhayu pakhu
    dina sajata samaju| tumha pai sudhi mohi sana aju || khaia pahiria raja tumharem| satya kahem nahim
    doshu hamarem || jaum asatya kachu kahaba banai| tau bidhi deihi hamahi sajai || ramahi tilaka kali
    jaum bhayu| tumha kahu~ bipati biju bidhi bayu || rekha kha~cai kahu~ balu bhashi| bhamini bhihu dudha
    ki makhi || jaum suta sahita karahu sevakai| tau ghara rahahu na ana upai || do kadru~ binatahi dinha
    dukhu tumhahi kausila~ deba| bharatu bandigriha seihahim lakhanu rama ke neba || || kaikayasuta sunata
    katu bani| kahi na saki kachu sahami sukhani || tana paseu kadali jimi ka~pi| kubarim dasana jibha
    taba ca~pi || kahi kahi kotika kapata kahani| dhiraju dharahu prabodhisi rani || phira karamu priya
    lagi kucali| bakihi sarahi mani marali || sunu manthara bata phuri tori| dahini a~khi nita pharaki
    mori || dina prati dekhu~ rati kusapane| kahu~ na tohi moha basa apane || kaha karau sakhi sudha subh
    | dahina bama na janu~ k apane calata na aju lagi anabhala kahuka kinha| kehim agha ekahi bara mohi
    daia~ dusaha dukhu dinha || || naihara janamu bharaba baru jai| jiata na karabi savati sevakai ||
    ari basa daiu jiavata jahi| maranu nika tehi jivana cahi || dina bacana kaha bahubidhi rani| suni
    kubarim tiyamaya thani || asa kasa kahahu mani mana una| sukhu sohagu tumha kahu~ dina duna || jehim
    raura ati anabhala taka| soi paihi yahu phalu paripaka || jaba tem kumata suna maim svamini| bhukha
    na basara ninda na jamini || pu~cheu guninha rekha tinha kha~ci| bharata bhuala hohim yaha sa~ci ||
    bhamini karahu ta kahaum up | hai tumharim seva basa r paru~ kupa tua bacana para saku~ puta pati
    tyagi| kahasi mora dukhu dekhi bara kasa na karaba hita lagi || || kubarim kari kabuli kaikei| kapata
    churi ura pahana tei || lakhi na rani nikata dukhu kaimse| cari harita tina balipasu jaisem || sunata
    bata mridu anta kathori| deti manahu~ madhu mahura ghori || kahi ceri sudhi ahi ki nahi| svamini kahihu
    katha mohi pahim || dui baradana bhupa sana thati| magahu aju juraavahu chati || sutahi raju ramahi
    banavasu| dehu lehu saba savati hulasu || bhupati rama sapatha jaba kari| taba magehu jehim bacanu
    na tari || hoi akaju aju nisi bitem| bacanu mora priya manehu ji tem || do bara kughatu kari patakini
    kahesi kopagriha~ jahu| kaju sa~varehu sajaga sabu sahasa jani patiahu || || kubarihi rani pranapriya
    jani| bara bara barai buddhi bakhani || tohi sama hita na mora samsara| bahe jata ki bhisi adhara
    || jaum bidhi puraba manorathu kali| karaum tohi cakha putari ali || bahubidhi cerihi adaru dei| kopabhavana
    gavani kaikei || bipati biju barasha ritu ceri| bhui~ bhi kumati kaikei keri || pai kapata jalu ankura
    jama| bara dau dala dukha phala parinama || kopa samaju saji sabu soi| raju karata nija kumati bigoi
    || raura nagara kolahalu hoi| yaha kucali kachu jana na koi || do pramudita pura nara nari| saba sajahim
    sumangalacara| eka prabisahim eka nirgamahim bhira bhupa darabara || || bala sakha suna hiya~ harashahim|
    mili dasa pa~ca rama pahim jahim || prabhu adarahim premu pahicani| pu~chahim kusala khema mridu bani
    || phirahim bhavana priya ayasu pai| karata parasapara rama baraai || ko raghubira sarisa samsara|
    silu saneha nibahanihara| jemhi jemhi joni karama basa bhramahim| taha~ taha~ isu deu yaha hamahim
    || sevaka hama svami siyanahu| hau nata yaha ora nibahu || asa abhilashu nagara saba kahu| kaikayasuta
    hdaya~ ati dahu || ko na kusangati pai nasai| rahi na nica matem caturai || do sa~sa samaya sananda
    nripu gayu kaikei geha~| gavanu nithurata nikata kiya janu dhari deha saneha~ || || kopabhavana suni
    sakuceu rau| bhaya basa agahura pari na p || surapati basi baha~bala jake| narapati sakala rahahim
    rukha takem || so suni tiya risa gayu sukhai| dekhahu kama pratapa baraai || sula kulisa asi a~gavanihare|
    te ratinatha sumana sara mare || sabhaya naresu priya pahim gayu| dekhi dasa dukhu daruna bhayu ||
    bhumi sayana patu mota purana| die dari tana bhushana nana || kumatihi kasi kubeshata phabi| ana ahivatu
    suca janu bhabi || jai nikata nripu kaha mridu bani| pranapriya kehi hetu risani || cham kehi hetu
    rani risani parasata pani patihi nevari| manahu~ sarosha bhuanga bhamini bishama bha~ti nihari ||
    dau basana rasana dasana bara marama thaharu dekhi| tulasi nripati bhavatabyata basa kama kautuka
    lekhi || so bara bara kaha rau sumukhi sulocini pikabacani| karana mohi sunau gajagamini nija kopa
    kara || || anahita tora priya kei~ kinha| kehi dui sira kehi jamu caha linha || kahu kehi rankahi
    karau naresu| kahu kehi nripahi nikasaum desu || saku~ tora ari amaru mari| kaha kita bapure nara
    nari || janasi mora subhau baroru| manu tava anana canda cakoru || priya prana suta sarabasu morem|
    parijana praja sakala basa torem || jaum kachu kahau kapatu kari tohi| bhamini rama sapatha sata mohi
    || bihasi magu manabhavati bata| bhushana sajahi manohara gata || ghari kughari samujhi jiya~ dekhu|
    begi priya pariharahi kubeshu || do yaha suni mana guni sapatha barai bihasi uthi matimanda| bhushana
    sajati biloki mrigu manahu~ kiratini phanda || || puni kaha rau suhrada jiya~ jani| prema pulaki mridu
    manjula bani || bhamini bhayu tora manabhava| ghara ghara nagara ananda badhava || ramahi deu~ kali
    jubaraju| sajahi sulocani mangala saju || dalaki utheu suni hradu kathoru| janu chui gayu paka baratoru
    || aisiu pira bihasi tehi goi| cora nari jimi pragati na roi || lakhahim na bhupa kapata caturai|
    koti kutila mani guru parhaai || jadyapi niti nipuna naranahu| naricarita jalanidhi avagahu || kapata
    sanehu barhaai bahori| boli bihasi nayana muhu mori || do magu magu pai kahahu piya kabahu~ na dehu
    na lehu| dena kahehu baradana dui teu pavata sandehu || || janeu~ maramu rau ha~si kahi| tumhahi kohaba
    parama priya ahi || thati rakhi na magihu k | bisari gayu mohi bhora subh || jhuthehu~ hamahi doshu
    jani dehu| dui kai cari magi maku lehu || raghukula riti sada cali ai| prana jahu~ baru bacanu na
    jai || nahim asatya sama pataka punja| giri sama hohim ki kotika gunja || satyamula saba sukrita suhae|
    beda purana bidita manu gae || tehi para rama sapatha kari ai| sukrita saneha avadhi raghurai || bata
    drirhaai kumati ha~si boli| kumata kubihaga kulaha janu kholi || do bhupa manoratha subhaga banu sukha
    subihanga samaju| bhillani jimi charana cahati bacanu bhayankaru baju || terahava~ vishrama sunahu
    pranapriya bhavata ji ka| dehu eka bara bharatahi tika || magu~ dusara bara kara jori| puravahu natha
    manoratha mori || tapasa besha biseshi udasi| caudaha barisa ramu banabasi || suni mridu bacana bhupa
    hiya~ soku| sasi kara chuata bikala jimi koku || gayu sahami nahim kachu kahi ava| janu sacana bana
    jhapateu lava || bibarana bhayu nipata narapalu| damini haneu manahu~ taru talu || mathe hatha mudi
    dau locana| tanu dhari socu laga janu socana || mora manorathu surataru phula| pharata karini jimi
    hateu samula || avadha ujari kinhi kaikeim| dinhasi acala bipati kai neim || do kavanem avasara ka
    bhayu gayu~ nari bisvasa| joga siddhi phala samaya jimi jatihi abidya nasa || || ehi bidhi rau manahim
