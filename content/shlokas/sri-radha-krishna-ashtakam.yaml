id: sri-radha-krishna-ashtakam
category: stotram
name:
  english: Sri Radha Krishna Ashtakam
content:
  english: yah shrigovardhanadrim sakalasurapatimstatragogopabrindam sviyam samrakshitum cetyamarasukhakaram
    mohayan sandadhara | tanmanam khandayitva vijitaripukulo niladharadharabhah krishno radhasameto vilasatu
    hridaye so'smadiye sadaiva || || yam drishtva kamsabhupah svakritakritimaho samsmaranmantrivaryan
    kim va purvam mayedam kritamiti vacanam duhkhitah pratyuvaca | ajnapto naradena smitayutavadanah purayansarvakaman
    krishno radhasameto vilasatu hridaye so'smadiye sadaiva || || yena prodyatpratapa nripatikulabhavah
    pandavah kauravabdhim tirtva param tadiyam jagadakhilanrinam dustaranceti jagmuh | tatpatniciravriddhipraviditamahima
    bhutale bhupatishah krishno radhasameto vilasatu hridaye so'smadiye sadaiva || || yasmai coddhritya
    patraddadhiyutanavanitam karairgopikabhi rdattam tadbhavapurtau vinihitahridayassatyamevam tirodhat
    | muktagunjavalibhih pracuratamarucih kundalakrantagandah krishno radhasameto vilasatu hridaye so'smadiye
    sadaiva || || yasmadvishvabhiramadiha jananavidhau sarvanandadigopah samsarartervimuktah sakalasukhakarah
    sampadah prapureva | ittham purnenduvaktrah kalakamaladrishah sviyajanma stuvantah krishno radhasameto
    vilasatu hridaye so'smadiye sadaiva || || yasya shrinandasunoh vrajayuvatijanashcagata bhartriputram
    styaktva shrutva samipe vicakitanayanah sapramodah svagehe | rantum rasadilila manasijadalita venunadam
    ca ramyam krishno radhasameto vilasatu hridaye so'smadiye sadaiva || || yasmin drishte samaste jagati
    yuvatayah prananathavrataya sta apyevam hi nunam kimapi ca hridaye kamabhavam dadhatyah | tatsnehabdhim
    vapushcedaviditadharanau suryabimbasvarupah krishno radhasameto vilasatu hridaye so'smadiye sadaiva
    || || yah sviye gokule'sminviditanijakulodbhutabalaih sameto mataryevam cakara prasritatamagunanbalalilavilasan
    | hatva vatsapralambadvividabakakharangopabrindam jugopa krishno radhasameto vilasatu hridaye so'smadiye
    sadaiva || || krishnaradhashtakam pratarutthaya prapathennarah | ya evam sarvada nunam sa prapnoti
    param gatim || || iti shriraghunathacarya viracitam shriradhakrishnashtakam |
  devanagari: यः श्रीगोवर्धनाद्रिं सकलसुरपतींस्तत्रगोगोपबृन्दं स्वीयं संरक्षितुं चेत्यमरसुखकरं मोहयन्
    सन्दधार । तन्मानं खण्डयित्वा विजितरिपुकुलो नीलधाराधराभः कृष्णो राधासमेतो विलसतु हृदये सोऽस्मदीये सदैव
    ॥ ॥ यं दृष्ट्वा कंसभूपः स्वकृतकृतिमहो संस्मरन्मन्त्रिवर्यान् किं वा पूर्वं मयेदं कृतमिति वचनं दुःखितः
    प्रत्युवाच । आज्ञप्तो नारदेन स्मितयुतवदनः पूरयन्सर्वकामान् कृष्णो राधासमेतो विलसतु हृदये सोऽस्मदीये
    सदैव ॥ ॥ येन प्रोद्यत्प्रतापा नृपतिकुलभवाः पाण्डवाः कौरवाब्धिं तीर्त्वा पारं तदीयं जगदखिलनृणां दुस्तरञ्चेति
    जग्मुः । तत्पत्नीचीरवृद्धिप्रविदितमहिमा भूतले भूपतीशः कृष्णो राधासमेतो विलसतु हृदये सोऽस्मदीये सदैव
    ॥ ॥ यस्मै चोद्धृत्य पात्राद्दधियुतनवनीतं करैर्गोपिकाभि र्दत्तं तद्भावपूर्तौ विनिहितहृदयस्सत्यमेवं
    तिरोधात् । मुक्तागुञ्जावलीभिः प्रचुरतमरुचिः कुण्डलाक्रान्तगण्डः कृष्णो राधासमेतो विलसतु हृदये सोऽस्मदीये
    सदैव ॥ ॥ यस्माद्विश्वाभिरामादिह जननविधौ सर्वनन्दादिगोपाः संसारार्तेर्विमुक्ताः सकलसुखकराः सम्पदः प्रापुरेव
    । इत्थं पूर्णेन्दुवक्त्रः कलकमलदृशः स्वीयजन्म स्तुवन्तः कृष्णो राधासमेतो विलसतु हृदये सोऽस्मदीये सदैव
    ॥ ॥ यस्य श्रीनन्दसूनोः व्रजयुवतिजनाश्चागता भर्तृपुत्रां स्त्यक्त्वा श्रुत्वा समीपे विचकितनयनाः सप्रमोदाः
    स्वगेहे । रन्तुं रासादिलीला मनसिजदलिता वेणुनादं च रम्यं कृष्णो राधासमेतो विलसतु हृदये सोऽस्मदीये सदैव
    ॥ ॥ यस्मिन् दृष्टे समस्ते जगति युवतयः प्राणनाथव्रताया स्ता अप्येवं हि नूनं किमपि च हृदये कामभावं दधत्यः
    । तत्स्नेहाब्धिं वपुश्चेदविदितधरणौ सूर्यबिम्बस्वरूपाः कृष्णो राधासमेतो विलसतु हृदये सोऽस्मदीये सदैव
    ॥ ॥ यः स्वीये गोकुलेऽस्मिन्विदितनिजकुलोद्भूतबालैः समेतो मातर्येवं चकार प्रसृततमगुणान्बाललीलाविलासान्
    । हत्वा वत्सप्रलम्बद्विविदबकखरान्गोपबृन्दं जुगोप कृष्णो राधासमेतो विलसतु हृदये सोऽस्मदीये सदैव ॥ ॥
    कृष्णाराधाष्टकं प्रातरुत्थाय प्रपठेन्नरः । य एवं सर्वदा नूनं स प्राप्नोति परां गतिम् ॥ ॥ इति श्रीरघुनाथचार्य
    विरचितं श्रीराधाकृष्णाष्टकम् ।
