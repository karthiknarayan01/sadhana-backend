id: narayaniyam-dashaka-6
category: stotram
name:
  english: Narayaniyam Dashaka 6
content:
  english: evam caturdashajaganmayatam gatasya patalamisha tava padatalam vadanti | padordhvadeshamapi
    deva rasatalam te gulphadvayam khalu mahatalamadbhutatman || || janghe talatalamatho sutalam ca janu
    kincorubhagayugalam vitalatale dve | kshonitalam jaghanamambaramanga nabhi rvakshashca shakranilayastava
    cakrapane || || griva mahastava mukham ca janastapastu phalam shirastava samastamayasya satyam | evam
    jaganmayatano jagadashritaira pyanyairnibaddhavapushe bhagavannamaste || || tvadbrahmarandhrapadamishvara
    vishvakanda chandamsi keshava ghanastava keshapashah | ullasicilliyugalam druhinasya geham pakshmani
    ratridivasau savita ca netrai || || nishsheshavishvaracana ca katakshamokshah karnau disho'shviyugalam
    tava nasike dve | lobhatrape ca bhagavannadharottaroshthau taraganashca dashanah shamanashca damshtra
    || || maya vilasahasitam shvasitam samiro jihva jalam vacanamisha shakuntapanktih | siddhadayah svaragana
    mukharandhramagni rdeva bhujah stanayugam tava dharmadevah || || prishtham tvadharma iha deva manah
    sudhamshu ravyaktameva hridayambujamambujaksha | kukshih samudranivaha vasanam tu sandhye shephah
    prajapatirasau vrishanau ca mitrah || || shronisthalam mrigaganah padayornakhaste hastyushtrasaindhavamukha
    gamanam tu kalah | vipradivarnabhavanam vadanabjabahu caruruyugmacaranam karunambudhe te || || samsaracakramayi
    cakradhara kriyaste viryam mahasuragano'sthikulani shailah | nadyassaritsamudayastaravashca roma jiyadidam
    vapuranirvacaniyamisha || || idrigjaganmayavapustava karmabhajam karmavasanasamaye smaraniyamahuh
    | tasyantaratmavapushe vimalatmane te vatalayadhipa namo'stu nirundhi rogan ||
  devanagari: एवं चतुर्दशजगन्मयतां गतस्य पातालमीश तव पादतलं वदन्ति । पादोर्ध्वदेशमपि देव रसातलं ते गुल्फद्वयं
    खलु महातलमद्भुतात्मन् ॥ ॥ जङ्घे तलातलमथो सुतलं च जानू किञ्चोरुभागयुगलं वितलातले द्वे । क्षोणीतलं जघनमम्बरमङ्ग
    नाभि र्वक्षश्च शक्रनिलयस्तव चक्रपाणे ॥ ॥ ग्रीवा महस्तव मुखं च जनस्तपस्तु फालं शिरस्तव समस्तमयस्य सत्यम्
    । एवं जगन्मयतनो जगदाश्रितैर प्यन्यैर्निबद्धवपुषे भगवन्नमस्ते ॥ ॥ त्वद्ब्रह्मरन्ध्रपदमीश्वर विश्वकन्द
    छन्दांसि केशव घनास्तव केशपाशाः । उल्लासिचिल्लियुगलं द्रुहिणस्य गेहं पक्ष्माणि रात्रिदिवसौ सविता च
    नेत्रै ॥ ॥ निश्शेषविश्वरचना च कटाक्षमोक्षः कर्णौ दिशोऽश्वियुगलं तव नासिके द्वे । लोभत्रपे च भगवन्नधरोत्तरोष्ठौ
    तारागणाश्च दशनाः शमनश्च दंष्ट्रा ॥ ॥ माया विलासहसितं श्वसितं समीरो जिह्वा जलं वचनमीश शकुन्तपङ्क्तिः
    । सिद्धादयः स्वरगणा मुखरन्ध्रमग्नि र्देवा भुजाः स्तनयुगं तव धर्मदेवः ॥ ॥ पृष्ठं त्वधर्म इह देव मनः
    सुधांशु रव्यक्तमेव हृदयम्बुजमम्बुजाक्ष । कुक्षिः समुद्रनिवहा वसनं तु सन्ध्ये शेफः प्रजापतिरसौ वृषणौ
    च मित्रः ॥ ॥ श्रोणीस्थलं मृगगणाः पदयोर्नखास्ते हस्त्युष्ट्रसैन्धवमुखा गमनं तु कालः । विप्रादिवर्णभवनं
    वदनाब्जबाहु चारूरुयुग्मचरणं करुणाम्बुधे ते ॥ ॥ संसारचक्रमयि चक्रधर क्रियास्ते वीर्यं महासुरगणोऽस्थिकुलानि
    शैलाः । नाड्यस्सरित्समुदयस्तरवश्च रोम जीयादिदं वपुरनिर्वचनीयमीश ॥ ॥ ईदृग्जगन्मयवपुस्तव कर्मभाजां कर्मावसानसमये
    स्मरणीयमाहुः । तस्यान्तरात्मवपुषे विमलात्मने ते वातालयाधिप नमोऽस्तु निरुन्धि रोगान् ॥
