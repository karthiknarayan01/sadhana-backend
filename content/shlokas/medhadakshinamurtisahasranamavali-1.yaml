  devanagari: श्रीमेधादक्षिणामूर्तिसहस्रनामावलिः १ श्रीः अस्य श्री मेधादक्षिणामूर्तिसहस्रनामस्तोत्रस्य
    ब्रह्मा ऋषिः । गायत्री छन्दः । दक्षिणामूर्तिर्देवता । ओं बीजम् । स्वाहा शक्तिः । नमः कीलकम् । मेधादक्षिणामूर्तिप्रसादसिद्ध्यर्थे
    जपे विनियोगः । ह्राम् इत्यादिना अङ्गन्यासः । ध्यानम् । सिद्धितोयनिधेर्मध्ये रत्नग्रीवे मनोरमे । कदम्बवनिकामध्ये
    श्रीमद्वटतरोरधः ॥ १॥ आसीनमाद्यं पुरुषमादिमध्यान्तवर्जितम् । शुद्धस्फटिकगोक्षीरशरत्पूर्णेन्दुशेखरम्
    ॥ २॥ दक्षिणे चाक्षमालां च वह्निं वै वामहस्तके । जटामण्डलसंलग्नशीताम्शुकरमण्डितम् ॥ ३॥ नागहारधरं चारुकङ्कणैः
    कटिसूत्रकैः । विराजमानवृषभं व्याघ्रचर्माम्बरावृतम् ॥ ४॥ चिन्तामणिमहावृन्दैः कल्पकैः कामधेनुभिः । चतुष्षष्टिकलाविद्यामूर्तिभिः
