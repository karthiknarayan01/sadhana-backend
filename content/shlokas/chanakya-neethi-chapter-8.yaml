id: chanakya-neethi-chapter-8
category: stotram
name:
  english: Chanakya Neethi - Chapter 8
content:
  english: adhama dhanamicchanti dhanamanau ca madhyamah | uttama manamicchanti mano hi mahatam dhanam
    || || ikshurapah payo mulam tambulam phalamaushadham | bhakshayitvapi kartavyah snanadanadikah kriyah
    || || dipo bhakshayate dhvantam kajjalam ca prasuyate | yadannam bhakshayate nityam jayate tadrishi
    praja || || vittam dehi gunanviteshu matimannanyatra dehi kvacit praptam varinidherjalam ghanamukhe
    madhuryayuktam sada | jivansthavarajangamamshca sakalansanjivya bhumandalam bhuyah pashya tadeva kotigunitam
    gacchantamambhonidhim || || candalanam sahasraishca suribhistattvadarshibhih | eko hi yavanah prokto
    na nico yavanatparah || || tailabhyange citadhume maithune kshaurakarmani | tavadbhavati candalo yavatsnanam
    na cacaret || || ajirne bheshajam vari jirne vari balapradam | bhojane camritam vari bhojanante vishapaham
    || || hatam jnanam kriyahinam hatashcajnanato narah | hatam nirnayakam sainyam striyo nashta hyabhartrikah
    || || vriddhakale mrita bharya bandhuhastagatam dhanam | bhojanam ca paradhinam tisrah pumsam vidambanah
    || || nagnihotram vina veda na ca danam vina kriya | na bhavena vina siddhistasmadbhavo hi karanam
    || || na devo vidyate kashthe na pashane na mrinmaye | na bhavena vina siddhistasmadbhavo hi karanam
    || || kashthapashanadhatunam kritva bhavena sevanam | shraddhaya ca tatha siddhistasya vishnuprasadatah
    || || na devo vidyate kashthe na pashane na mrinmaye | bhave hi vidyate devastasmadbhavo hi karanam
    || || shantitulyam tapo nasti na santoshatparam sukham | apatyam ca kalatram ca satam sangatireva
    ca || || guno bhushayate rupam shilam bhushayate kulam | prasadashikharastho'pi kakah kim garudayate
    || || nirgunasya hatam rupam duhshilasya hatam kulam | asiddhasya hata vidya hyabhogena hatam dhanam
    || || shuddham bhumigatam toyam shuddha nari pativrata | shucih kshemakaro raja santosho brahmanah
    shucih || || asantushta dvija nashtah santushtashca mahibhritah | salajja ganika nashta nirlajjashca
    kulangana || || kim kulena vishalena vidyahinena dehinam | dushkulam capi vidusho devairapi sa pujyate
    || || vidvanprashasyate loke vidvan sarvatra pujyate | vidyaya labhate sarvam vidya sarvatra pujyate
    || || mamsabhakshyaih surapanairmukhaishcaksharavarjitaih | pashubhih purushakarairbharakranta hi
    medini || || annahino dahedrashtram mantrahinashca ritvijah | yajamanam danahino nasti yajnasamo ripuh
    ||
  devanagari: अधमा धनमिच्छन्ति धनमानौ च मध्यमाः । उत्तमा मानमिच्छन्ति मानो हि महतां धनम् ॥ ॥ इक्षुरापः
    पयो मूलं ताम्बूलं फलमौषधम् । भक्षयित्वापि कर्तव्याः स्नानदानादिकाः क्रियाः ॥ ॥ दीपो भक्षयते ध्वान्तं
    कज्जलं च प्रसूयते । यदन्नं भक्षयते नित्यं जायते तादृशी प्रजा ॥ ॥ वित्तं देहि गुणान्वितेषु मतिमन्नान्यत्र
    देहि क्वचित् प्राप्तं वारिनिधेर्जलं घनमुखे माधुर्ययुक्तं सदा । जीवान्स्थावरजङ्गमांश्च सकलान्सञ्जीव्य
    भूमण्डलं भूयः पश्य तदेव कोटिगुणितं गच्छन्तमम्भोनिधिम् ॥ ॥ चाण्डालानां सहस्रैश्च सूरिभिस्तत्त्वदर्शिभिः
    । एको हि यवनः प्रोक्तो न नीचो यवनात्परः ॥ ॥ तैलाभ्यङ्गे चिताधूमे मैथुने क्षौरकर्मणि । तावद्भवति चाण्डालो
    यावत्स्नानं न चाचरेत् ॥ ॥ अजीर्णे भेषजं वारि जीर्णे वारि बलप्रदम् । भोजने चामृतं वारि भोजनान्ते विषापहम्
    ॥ ॥ हतं ज्ञानं क्रियाहीनं हतश्चाज्ञानतो नरः । हतं निर्णायकं सैन्यं स्त्रियो नष्टा ह्यभर्तृकाः ॥ ॥
    वृद्धकाले मृता भार्या बन्धुहस्तगतं धनम् । भोजनं च पराधीनं तिस्रः पुंसां विडम्बनाः ॥ ॥ नाग्निहोत्रं
    विना वेदा न च दानं विना क्रिया । न भावेन विना सिद्धिस्तस्माद्भावो हि कारणम् ॥ ॥ न देवो विद्यते काष्ठे
    न पाषाणे न मृण्मये । न भावेन विना सिद्धिस्तस्माद्भावो हि कारणम् ॥ ॥ काष्ठपाषाणधातूनां कृत्वा भावेन
    सेवनम् । श्रद्धया च तथा सिद्धिस्तस्य विष्णुप्रसादतः ॥ ॥ न देवो विद्यते काष्ठे न पाषाणे न मृन्मये ।
    भावे हि विद्यते देवस्तस्माद्भावो हि कारणम् ॥ ॥ शान्तितुल्यं तपो नास्ति न सन्तोषात्परं सुखम् । अपत्यं
    च कलत्रं च सतां सङ्गतिरेव च ॥ ॥ गुणो भूषयते रूपं शीलं भूषयते कुलम् । प्रासादशिखरस्थोऽपि काकः किं गरुडायते
    ॥ ॥ निर्गुणस्य हतं रूपं दुःशीलस्य हतं कुलम् । असिद्धस्य हता विद्या ह्यभोगेन हतं धनम् ॥ ॥ शुद्धं भूमिगतं
    तोयं शुद्धा नारी पतिव्रता । शुचिः क्षेमकरो राजा सन्तोषो ब्राह्मणः शुचिः ॥ ॥ असन्तुष्टा द्विजा नष्टाः
    सन्तुष्टाश्च महीभृतः । सलज्जा गणिका नष्टा निर्लज्जाश्च कुलाङ्गना ॥ ॥ किं कुलेन विशालेन विद्याहीनेन
    देहिनाम् । दुष्कुलं चापि विदुषो देवैरपि स पूज्यते ॥ ॥ विद्वान्प्रशस्यते लोके विद्वान् सर्वत्र पूज्यते
    । विद्यया लभते सर्वं विद्या सर्वत्र पूज्यते ॥ ॥ मांसभक्ष्यैः सुरापानैर्मुखैश्चाक्षरवर्जितैः । पशुभिः
    पुरुषाकारैर्भाराक्रान्ता हि मेदिनी ॥ ॥ अन्नहीनो दहेद्राष्ट्रं मन्त्रहीनश्च ऋत्विजः । यजमानं दानहीनो
    नास्ति यज्ञसमो रिपुः ॥
