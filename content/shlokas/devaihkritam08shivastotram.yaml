id: devaihkritam08shivastotram
category: stotram
name:
  english: devaihkritam08shivastotram
  devanagari: देवैःकृतं०८शिवस्तोत्रम्
content:
  english: 50|| trilokakaranayathapavargaya namo namah | apavargapradayashu sharanagatatarine || 51||
    sarvamnayagamanam codadhaye parameshthine | parayanaya bhaktanam gunanam ca namo'stu te || 52|| namo
    gunaranicchanna cidushmaya maheshvara | mudhadushpraptarupaya jnanihridvasine sada || 53|| pashupashavimokshaya
    bhaktasanmuktidaya ca | svaprakashaya nityaya'vyayayajasrasamvide || 54|| pratyagdrashtre'vikaraya
    paramaishvaryadharine | yam bhajanti caturvarge kamayantishtasadgatim | so'bhudakarunastvam nah prasanno
    bhava te namah || 55|| ekantinah kancanartham bhakta vanchanti yasya na | kevalam caritam te te gayanti
    paramangalam || 56|| aksharam paramam brahma tamavyaktakritim vibhum | adhyatmayogagamyam tvam paripurnam
    stumo vayam || 57|| atindriyamanadharam sarvadharamahetukam | anantamadyam sukshmam tvam pranamamo'khileshvaram
    || 58|| haryadayo'khila devastatha lokashcaracarah | namarupavibhedena phalgvya ca kalaya kritah ||
    59|| yatharcisho'gnessavituryanti niryanti vasakrit | gabhastayastathayam vai pravaho gauna ucyate
    || 2
  devanagari: ५०॥ त्रिलोककारणायाथापवर्गाय नमो नमः । अपवर्गप्रदायाशु शरणागततारिणे ॥ ५१॥ सर्वाम्नायागमानां
    चोदधये परमेष्ठिने । परायणाय भक्तानां गुणानां च नमोऽस्तु ते ॥ ५२॥ नमो गुणारणिच्छन्न चिदूष्माय महेश्वर
    । मूढदुष्प्राप्तरूपाय ज्ञानिहृद्वासिने सदा ॥ ५३॥ पशुपाशविमोक्षाय भक्तसन्मुक्तिदाय च । स्वप्रकाशाय
    नित्यायाऽव्ययायाजस्रसंविदे ॥ ५४॥ प्रत्यग्द्रष्ट्रेऽविकाराय परमैश्वर्यधारिणे । यं भजन्ति चतुर्वर्गे
    कामयन्तीष्टसद्गतिम् । सोऽभूदकरुणस्त्वं नः प्रसन्नो भव ते नमः ॥ ५५॥ एकान्तिनः कञ्चनार्थं भक्ता वाञ्छन्ति
    यस्य न । केवलं चरितं ते ते गायन्ति परमङ्गलम् ॥ ५६॥ अक्षरं परमं ब्रह्म तमव्यक्ताकृतिं विभुम् । अध्यात्मयोगगम्यं
    त्वां परिपूर्णं स्तुमो वयम् ॥ ५७॥ अतीन्द्रियमनाधारं सर्वाधारमहेतुकम् । अनन्तमाद्यं सूक्ष्मं त्वां
    प्रणमामोऽखिलेश्वरम् ॥ ५८॥ हर्यादयोऽखिला देवास्तथा लोकाश्चराचराः । नामरूपविभेदेन फल्ग्व्या च कलया कृताः
    ॥ ५९॥ यथार्चिषोऽग्नेस्सवितुर्यान्ति निर्यान्ति वासकृत् । गभस्तयस्तथायं वै प्रवाहो गौण उच्यते ॥ २
