id: gayatrimantrah-devanagari
category: mantra
name:
  english: gayatrimantrah devanagari
  devanagari: गायत्रीमन्त्राः देवनगरि
content:
  english: soma candra om nishakaraya vidmahe kalanathaya dhimahi tannah somah pracodayat || candra om
    kshiraputraya vidmahe amritatattvaya dhimahi tannashcandrah pracodayat || candra om kshiraputraya
    vidmahe mahakalaya dhimahi tannashcandrah pracodayat || candra om somatmajaya vidmahe amritatattvaya
    dhimahi tannah somah pracodayat || candra om atriputraya vidmahe sagarodbhavaya dhimahi tannashcandrah
    pracodayat || chinnamasta chinnamasta om vairocanyai ca vidmahe chinnamastayai dhimahi tanno devi
    pracodayat || jayadurga jayadurga om narayanyai vidmahe durgayai ca dhimahi tanno gauri pracodayat
    || jala jala om jalabimbaya vidmahe nilapurushaya dhimahi tannastvambu pracodayat || jala om hrim
    jalabimbaya vidmahe minapurushaya dhimahi tanno vishnuh pracodayat || janaki janaki om janakajayai
    vidmahe ramapriyayai dhimahi tannah sita pracodayat || tara tara om tarayai ca vidmahe mahograyai
    dhimahi tanno devi pracodayat || tulasi tulasi om tulasidevyai ca vidmahe vishnupriyayai ca dhimahi
    tanno vrindah pracodayat || tulasi om shritripuraya vidmahe tulasipatraya dhimahi tannastulasi pracodayat
    || tvarita tvarita om tvaritadevyai vidmahe mahanityayai dhimahi tanno devi pracodayat || dakshinamurti
    dakshinamurti om dakshinamurtaye vidmahe dhyanasthaya dhimahi tanno dhishah pracodayat || dattatreya
    dattatreya om dattatreyaya vidmahe avadhutaya dhimahi tanno dattah pracodayat || dattatreya om dattatreyaya
    vidmahe yogishvaraya dhimahi tanno dattah pracodayat || dattatreya om dattatreyaya vidmahe digambaraya
    dhimahi tanno dattah pracodayat || dattatreya om dattatreyaya vidmahe atriputraya dhimahi tanno dattah
    pracodayat || dattatreya om digambaraya vidmahe yogishvaraya dhimahi tanno dattah pracodayat || durga
    durga om katyayanaya vidmahe kanyakumari ca dhimahi tanno durga pracodayat || durga om katyayanyai
    vidmahe kanyakumaryai dhimahi tanno durga pracodayat || durga om girijayai ca vidmahe shivapriyayai
    ca dhimahi tanno durga pracodayat || durga om mahadevyai ca vidmahe durgayai ca dhimahi tanno devi
    pracodayat || durga om mahashulinyai vidmahe mahadurgayai dhimahi tanno bhagavati pracodayat || devi
    devi om devyaibrahmanyai vidmahe mahashaktyai ca dhimahi tanno devi pracodayat || devi om mahashulinyai
    ca vidmahe mahadurgayai dhimahi tanno bhagavati pracodayat || devi om vagdevyai ca vidmahe kamarajnai
    ca dhimahi tanno devi pracodayat || dhumavati dhumavati om dhumavatyai ca vidmahe samharinyai ca dhimahi
    tanno dhuma pracodayat || nandikeshvara nandikeshvara om tatpurushaya vidmahe nandikeshvaraya dhimahi
    tanno vrishabhah pracodayat || nandi nandi om tatpurushaya vidmahe cakratundaya dhimahi tanno nandih
    pracodayat || nandi om harivaktraya vidmahe rudravaktraya dhimahi tanno nandih pracodayat || narayana
  devanagari: सोम चन्द्र ॐ निशाकराय विद्महे कलानाथाय धीमहि तन्नः सोमः प्रचोदयात् ॥ चन्द्र ॐ क्षीरपुत्राय
    विद्महे अमृततत्त्वाय धीमहि तन्नश्चन्द्रः प्रचोदयात् ॥ चन्द्र ॐ क्षीरपुत्राय विद्महे महाकालाय धीमहि
    तन्नश्चन्द्रः प्रचोदयात् ॥ चन्द्र ॐ सोमात्मजाय विद्महे अमृततत्त्वाय धीमहि तन्नः सोमः प्रचोदयात् ॥
    चन्द्र ॐ अत्रिपुत्राय विद्महे सागरोद्भवाय धीमहि तन्नश्चन्द्रः प्रचोदयात् ॥ छिन्नमस्ता छिन्नमस्ता ॐ
    वैरोचन्यै च विद्महे छिन्नमस्तायै धीमहि तन्नो देवी प्रचोदयात् ॥ जयदुर्गा जयदुर्गा ॐ नारायण्यै विद्महे
    दुर्गायै च धीमहि तन्नो गौरी प्रचोदयात् ॥ जल जल ॐ जलबिम्बाय विद्महे नीलपुरुषाय धीमहि तन्नस्त्वम्बु
    प्रचोदयात् ॥ जल ॐ ह्रीं जलबिम्बाय विद्महे मीनपुरुषाय धीमहि तन्नो विष्णुः प्रचोदयात् ॥ जानकी जानकी
    ॐ जनकजायै विद्महे रामप्रियायै धीमहि तन्नः सीता प्रचोदयात् ॥ तारा तारा ॐ तारायै च विद्महे महोग्रायै
    धीमहि तन्नो देवी प्रचोदयात् ॥ तुलसी तुलसी ॐ तुलसीदेव्यै च विद्महे विष्णुप्रियायै च धीमहि तन्नो वृन्दः
    प्रचोदयात् ॥ तुलसी ॐ श्रीत्रिपुराय विद्महे तुलसीपत्राय धीमहि तन्नस्तुलसी प्रचोदयात् ॥ त्वरिता त्वरिता
    ॐ त्वरितादेव्यै विद्महे महानित्यायै धीमहि तन्नो देवी प्रचोदयात् ॥ दक्षिणामूर्ति दक्षिणामूर्ति ॐ दक्षिणामूर्तये
    विद्महे ध्यानस्थाय धीमहि तन्नो धीशः प्रचोदयात् ॥ दत्तात्रेय दत्तात्रेय ॐ दत्तात्रेयाय विद्महे अवधूताय
    धीमहि तन्नो दत्तः प्रचोदयात् ॥ दत्तात्रेय ॐ दत्तात्रेयाय विद्महे योगीश्वराय धीमहि तन्नो दत्तः प्रचोदयात्
    ॥ दत्तात्रेय ॐ दत्तात्रेयाय विद्महे दिगम्बराय धीमहि तन्नो दत्तः प्रचोदयात् ॥ दत्तात्रेय ॐ दत्तात्रेयाय
    विद्महे अत्रीपुत्राय धीमहि तन्नो दत्तः प्रचोदयात् ॥ दत्तात्रेय ॐ दिगम्बराय विद्महे योगीश्वराय धीमहि
    तन्नो दत्तः प्रचोदयात् ॥ दुर्गा दुर्गा ॐ कात्यायनाय विद्महे कन्यकुमारी च धीमहि तन्नो दुर्गा प्रचोदयात्
    ॥ दुर्गा ॐ कात्यायन्यै विद्महे कन्याकुमार्यै धीमहि तन्नो दुर्गा प्रचोदयात् ॥ दुर्गा ॐ गिरिजायै च विद्महे
    शिवप्रियायै च धीमहि तन्नो दुर्गा प्रचोदयात् ॥ दुर्गा ॐ महादेव्यै च विद्महे दुर्गायै च धीमहि तन्नो
    देवी प्रचोदयात् ॥ दुर्गा ॐ महाशूलिन्यै विद्महे महादुर्गायै धीमहि तन्नो भगवती प्रचोदयात् ॥ देवी देवी
    ॐ देव्यैब्रह्माण्यै विद्महे महाशक्त्यै च धीमहि तन्नो देवी प्रचोदयात् ॥ देवी ॐ महाशूलिन्यै च विद्महे
    महादुर्गायै धीमहि तन्नो भगवती प्रचोदयात् ॥ देवी ॐ वाग्देव्यै च विद्महे कामराज्ञै च धीमहि तन्नो देवी
    प्रचोदयात् ॥ धूमावती धूमावती ॐ धूमावत्यै च विद्महे संहारिण्यै च धीमहि तन्नो धूमा प्रचोदयात् ॥ नन्दिकेश्वर
    नन्दिकेश्वर ॐ तत्पुरुषाय विद्महे नन्दिकेश्वराय धीमहि तन्नो वृषभः प्रचोदयात् ॥ नन्दी नन्दी ॐ तत्पुरुषाय
    विद्महे चक्रतुण्डाय धीमहि तन्नो नन्दीः प्रचोदयात् ॥ नन्दी ॐ हरिवक्त्राय विद्महे रुद्रवक्त्राय धीमहि
    तन्नो नन्दीः प्रचोदयात् ॥ नारायण
