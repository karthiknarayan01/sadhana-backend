id: shriramovijayetetaramastotram
category: mantra
name:
  english: shriramovijayetetaramastotram
  devanagari: श्रीरामोविजयेतेतरामस्तोत्रम्
content:
  english: tarakamantratmakam | shriramah shrikarah shridah shrisevyah shriniketanah | rakshasantakaro
    dhiro bhaktabhagyavivardhanah || 1|| mareti vyastamyannama japan vyadho'bhavadrishih | janmaduhkhanudam
    kavyam divyam vyaracayanmahat || 2|| yada yada bhavedglanirdharmasya sa tada tada | rakshasantakaro
    ramo sambhavatyatmamayaya || 3|| mahamohakari maya yatprasadadvinashyati | jaghanya api pujyashca
    pavana bahavo'bhavan || 4|| yasya prasadato jato hanuman mahato mahan | janmamrityujaraduhkhanmukto'dyapi
    virajate || 5|| yasmatparatarannasti yasya nama mahadyashah | ramam lokabhiramam tam vrajamah sharanam
    muda || 6|| maitayiti nah sarvan samsarattarayishyati | shri rama jayarameti jayajayeti japaddhruvam
    || 7|| rama eva parambrahma rama eva paragatih | manah shantikaroramo manmathari namaskritah || 8||
    jayatrayayutah shreshtho ramatrayayuto manuh | yatra shriramamahima trisatyamiti varnyate || 9|| ramah
    shrisitaya yuktah sarvaishvaryav ityapi | mahatvamasyanantam yat tacchriramapade sthitam || 10|| jaya
    ramapadenayam jayarupa itiryate | yato'sau jayarupo hi jayarho jayadastatha || 11|| jayajayeti pade'rtho'yam
    dyotate sarvasiddhidah | ya sminna maya navidyam tasminmohahkatham bhavet || 12|| ramatraye dasharathishcesho
    brahmeti kathyate | marudatmajasantrata mocayenmandanadapi || 13|| shri rameti padam purvam jayarameti
    vai tatah | ramo'tra dvirjayatpashcadvartate manurajake || 14|| mahasamsaravyamohanmocayatyashvayam
    manuh | japaniyah kirtaniyo muda sarvaishca sarvada || 15|| yajnarakshasabhutadya pida'nena vinashyati
    | ramo dhanurdharo nityam samrakshati pade pade || 16|| madonmattanaraishcapi na duhkha labhate kada
    | janmasantapacandro'yam jnanavijnanado manuh || 17|| yatrakutrapijapyo'yam shucirvapyashucistatha
    | japatahshantimapnoti prashasto'sminkalaumatah || 18|| yajnanam japayajno'smi bhagavadvakyamidrisham
    | ramenaiva puradishtah shadangadivivarjitah || 19|| marutsutavataraya ramadasaya dhimate | shriramavarayukto'yam
    sulabho'pi phaladhikah || 20|| trailokyapavani punya muktidaraghavastutih | bhadram tanotu lokeshu
    gangeva kila sarvada || iti shrimat paramahamsa parivrajakacarya sadaguru bhagavana shri shridharasvamimaharajaviracitam
    shriramovijayatetaramastotram athava shriramamantrarajastotram sampurnam || racanasthala ayodhya
  devanagari: तारकमन्त्रात्मकम् । श्रीरामः श्रीकरः श्रीदः श्रीसेव्यः श्रीनिकेतनः । राक्षसान्तकरो धीरो
    भक्तभाग्यविवर्धनः ॥ १॥ मरेति व्यस्तंयन्नाम जपन् व्याधोऽभवदृषिः । जन्मदुःखनुदं काव्यं दिव्यं व्यरचयन्महत्
    ॥ २॥ यदा यदा भवेद्ग्लानिर्धर्मस्य स तदा तदा । राक्षसान्तकरो रामो सम्भवत्यात्ममायया ॥ ३॥ महामोहकरी
    माया यत्प्रसादाद्विनश्यति । जघन्या अपि पूज्याश्च पावना बहवोऽभवन् ॥ ४॥ यस्य प्रसादतो जातो हनूमान् महतो
    महान् । जन्ममृत्युजरादुःखान्मुक्तोऽद्यापि विराजते ॥ ५॥ यस्मात्परतरन्नास्ति यस्य नाम महद्यशः । रामं
    लोकाभिरामं तं व्रजामः शरणं मुदा ॥ ६॥ मैतयिति नः सर्वान् संसारात्तारयिष्यति । श्री राम जयरामेति जयजयेति
    जपाद्ध्रुवम् ॥ ७॥ राम एव परम्ब्रह्म राम एव परागतिः । मनः शान्तिकरोरामो मन्मथारि नमस्कृतः ॥ ८॥ जयत्रययुतः
    श्रेष्ठो रामत्रययुतो मनुः । यत्र श्रीराममहिमा त्रिसत्यमिति वर्ण्यते ॥ ९॥ रामः श्रीसीतया युक्तः सर्वैश्वर्यव्
    इत्यपि । महत्वमस्यानन्तं यत् तच्छ्रीरामपदे स्थितम् ॥ १०॥ जय रामपदेनायं जयरूप इतीर्यते । यतोऽसौ जयरूपो
    हि जयार्हो जयदस्तथा ॥ ११॥ जयजयेति पदेऽर्थोऽयं द्योतते सर्वसिद्धिदः । य स्मिन्न माया नाविद्यां तस्मिन्मोहःकथं
    भवेत् ॥ १२॥ रामत्रये दाशरथिश्चेशो ब्रह्मेति कथ्यते । मरूदात्मजसन्त्राता मोचयेन्मन्दनादपि ॥ १३॥ श्री
    रामेति पदं पूर्वं जयरामेति वै ततः । रामोऽत्र द्विर्जयात्पश्चाद्वर्तते मनुराजके ॥ १४॥ महासंसारव्यामोहान्मोचयत्याश्वयं
    मनुः । जपनीयः कीर्तनीयो मुदा सर्वैश्च सर्वदा ॥ १५॥ यज्ञराक्षसभूताद्या पीडाऽनेन विनश्यति । रामो धनुर्धरो
    नित्यं संरक्षति पदे पदे ॥ १६॥ मदोन्मत्तनरैश्चापि न दुःख लभते कदा । जन्मसन्तापचन्द्रोऽयं ज्ञानविज्ञानदो
    मनुः ॥ १७॥ यत्रकुत्रापिजप्योऽयं शुचिर्वाप्यशुचिस्तथा । जपतःशान्तिमाप्नोति प्रशस्तोऽस्मिन्कलौमतः ॥
    १८॥ यज्ञानां जपयज्ञोऽस्मि भगवद्वाक्यमीदृशम् । रामेणैव पुरादिष्टः षडङ्गादिविवर्जितः ॥ १९॥ मरूत्सुतावताराय
    रामदासाय धीमते । श्रीरामवरयुक्तोऽयं सुलभोऽपि फलाधिकः ॥ २०॥ त्रैलोक्यपावनी पुण्या मुक्तिदाराघवस्तुतिः
    । भद्रं तनोतु लोकेषु गङ्गेव किल सर्वदा ॥ इति श्रीमत् परमहंस परिव्राजकाचार्य सदगुरू भगवान श्री श्रीधरस्वामीमहाराजविरचीतं
    श्रीरामोविजयतेतरामस्तोत्रं अथवा श्रीराममन्त्रराजस्तोत्रं सम्पूर्णम् ॥ रचनास्थल अयोध्या
