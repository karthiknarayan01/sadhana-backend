id: devasenasahasranamastotram
category: sahasranama
name:
  english: devasenasahasranamastotram
  devanagari: देवसेनासहस्रनामस्तोत्रम्
content:
  english: raktabham raktavastram manimayakhacitanekabhushabhiramam devim mahendramanyam madhuripunayanadudbhavam
    devasenam | kalharam dakshahaste taditarakaravaram lambitam sandadhanam samstham skandasya vame samudamapi
    guham lokayantim bhaje'ham || evam dhyatva samabhyarcya manasa sadaram narah | pathennamasahasram
    tatstavarajamanuttamam | om devasena devarajatanaya devavandita | devi devishvari devavanita devatarcita
    || 1|| devara devararadhya devamanasahamsika | devadaruvanantah stha devata devamohini || 2|| devarivimukha
    devamunidya devadeshika | daityaritanaya daityakantaki daityamardini || 3|| daivya dainyaparadhina
    daivajna daivyabhakshini | dordvaya doshahinangi doshabha dordhritambuja || 4|| doshakarasamanasya
    doshakarasamarcita | doshaghni dorlata dolacela dolaviharini || 5|| dandini dandanitistha dandayudhapativrata
    | dandakaranyanilaya danditasuravikrama || 6|| daksha dakshayaniprata dakshina dakshinashrita | dakshajna
    dakshinavartakambukanthi dayanidhih || 7|| dayamurtirdaridrishya daridrayabhayanashini | dashasyandanasampujya
    dashanajitacandrika || 8|| dambha dambavihinedya dantivaktranujapriya | datri danavadarpaghni damodaramanohara
    || 9|| divya divishadishana divishatpatipujita | divyaughamandala divyamalini divyavigraha || 10||
    divyambaradhara dinarakshika dinakrinnuta | dikshita dikshitaradhya dipta diptavibhushana || 11||
    dushtadura duraradhya duhkhaghni duritantaki | duti dutakulabhishta durvasastutavaibhava || 12|| duradura
    duragantri durvadalasamaprabha | drishya drigjalasambhuta drikprada driktamopaha || 13|| dravini dravidadhisha
    dronapujya drumashrita | dhanda dharmini dharmavinuta darmavardhini || 14|| dhatri dhatriphalaprita
    dhishanadhipapujita | dhishaneshi dhiranuta dhiravadavilasini || 15|| dhumrakeshi dhupamoda dhurtaghni
    dhritimatpriya | dhyeya dhyeyatiga dhaumyavasana dhaumyapujita || 16|| namya nagodbhavasunupriya narayanatmaja
    | narayanakshijalaja narayanagururnata || 17|| nati nateshvarananda nandini nandagopamut | nitya nityashrita
    nityapatirnityapativrata || 18|| niranjana nirakara nirvikara nirargala | niharadrikritavasha niharadrisutasnusha
    || 19|| nipya nipasumaprita nupuraravakomala | nutna nutanabhushadhya nyunahina naredita || 20|| naukarudha
    navarasa navavaditramedura | navavirasamaradhya navanagavareshvari || 21|| navagrahavara navya navyambhojadhara
    nisha | padmakshi padmasankasha padmaja padmabhasura || 22|| paracalakritodvaha paracalaviharini |
    padmanabhasuta padma padmini padmamalini || 23|| parijatasumaprita pashaghni papanashini | pathinavahasampujya
    parvatisutakamini || 24|| pinastani pinaprishtha pushpakomala | pushkara pushkararadhya pushkarakshetradevata
    || 25|| pulindinisapatni ca puruhutatmasambhava | pujya puta putanarivinuta purvagamini || 26|| pushtendunayana
    purna peshala peshalasana | phanadharamaniprakhya phanirajasupujita || 27|| phullapadmadhara phulladrishtih
    phalanagashrita | bhalanetrasutananda bhalanetrapriyankari || 28|| bala balarija bala balarishtavinashini
    | balakhilyanuta banahasta banasurantaki || 29|| bimbadhara bindumadhyasthita budhavararcita | bodhayanamuniprita
    bodhada bodharupini || 30|| bandhukakusumaprita bandhukasumasannibha | bhamini bharati bhama bhaskarendusupujita
    || 31|| bhima bhimeshvari bhuma bhutida bhupatipriya | bhuvaneshi bhogavati bhogada bhogavardhini
    || 32|| bhogirajanuta bhogya bhimasenasamarcita | bhaimi bhetalanatanarasika bhishmasevita || 33||
    mantrini mantrasarajna mantravarnakritirmatih | manucakradhara manya manimalavibhushita || 34|| manini
    madhavasuta madhuprita manasvini | madhuralapamuditagirijatanuja mahi || 35|| matrikavarna sankliptatanurmandhatripujita
    | mahadevasnusha minalocana muktidayini || 36|| manjukeshi manjuhasa mayuravaravahana | mararatisnusha
    marasuravada manimandana || 37|| meshavaha meghavahatanuja mohitapriya | marutsaptakasamsevya mainakanilayashrita
    || 38|| yakshini yajnasambhuta yamini yamalodbhava | yantreshvari yamaradhya yayajukasamarcita ||
    39|| yanarudha yajnashila yuvatiryauvanarcita | yogini yogada yogya yogindrakulavandita || 40|| rakshohantri
    ranatpadanupura raghavarcita | renuka ranasannaha ranatkinkinimekhala || 41|| ravanantakari rajni
    rajarajasamarcita | rimbija rupini rupya ramani ramanotsuka || 42|| rasayanakari radha radheyi rathasamsthita
    | rohinishamukha rogahina rogavinashini || 43|| rocanatilaka raudri raudramantravisharada | lakshmipatisuta
    lakshmirlambavamakarambuja || 44|| lampata lakuli lila lokalokaviharini | lokeshvari lokapujya latakara
    lalatkaca || 45|| lolambacela lolakshi laghima likucapriya | lobhahina labdhakama latanilayasamsthita
    || 46|| vanita vanitaradhya vandya vandasuvatsala | vama vamasthita vani vakprda varijapriya || 47||
    varijasanasandrishtamantra vanchasuradruma | vishnupatni vishahara vinalapavinodini || 48|| venibandha
    vanulola venugopalasundari | vanchakalpalata vishvavandita vishvatomukhi || 49|| vighneshadevara visha
    vishavaha virocini | vairocananuta vairihina virendravandita || 50|| vimana vimanodura vimanastha
    virat priya | vajrini vajritanaya vajrabhusha vidhidita || 51|| vishalakshi vitashoka vanastha vanadevata
    | varuni vanajarudha vama vamangasundari || 52|| vallisapatni vamorurvasishthadimapujita | shaktih
    shacisuta shaktidhara shakteyakamini || 53|| shyama shakkaraga shrija tatha shrih shivamanasa | shivasnusha
    shubhakara shuddha shailaviharini || 54|| shailendrajajanijeshtaprada shailadisannuta | shambhavi
    shankarananda shankari shashishekhara || 55|| sharada sharadaradhya sharajanmasati shiva | shashthi
    shashthishvari shashthidevi shashthayadhidevata || 56|| shadananapritikartri shadguna shanmukhapriya
    | shadadharaikanilaya shodhanyasamayakritih || 57|| shadvidhaikyanusandhanaprita shadrasamishrita
    | samrajni sakala sadhvi samanisthanaga sati || 58|| sangitarasika sara sarvakara sanatana | sanatanapriya
    satya satyadharma sarasvati || 59|| sahasranamasampujya sahasramshusamaprabha | skandotsahakari skandavamotsanganivasini
    || 60|| simhavaktrantakakari simharudha smitanana | svargastha surasampujya sundari sudati sura ||
    61|| sureshvari suracaryapujita sukritidita | suradrunilaya sauramandalastha sukhaprada || 62|| saudamininibhasubhruh
    saundaryacitahritpriya | suradruhasuhritsomayajipujya sumarcita || 63|| sumeshuvarada saumya skandantahpuravasini
    | skandakoshthagata skandavamabhagasthita sama || 64|| skandashlishta skandadrishtih skandayattamanasvini
    | sanakadihita sanga sayudha suravamshaja || 65|| suravalli suralata suralokanivasini | subrahmanyasakhi
    sena somavamshyanripedita || 66|| sutaprada sutavayuh surasainyasurakshika | sarvadhara sarvabhusha
    sarveshi sarvapujita || 67|| sarasa sadara sama svamini svamimohini | svamyadrinilaya svaccha svatantra
    svastida svadha || 68|| svahakritih svadushila svaraprastaravittama | harasnusha harananda harinetrasamudbhava
    || 69|| harinakshi hariprema haridashvavivardhita | harasunupriya harabhasura hirabhushana || 70||
    hemambujadhara hemakanci hemabjasamsthita | hemadrinilaya helamuditasvapnakamini || 71|| herambadevara
    homapriya hotri hiranyada | hiranyagarbhopajnatamantra hanivivarjita || 72|| himacalasthita hantri
    haryakshasanasamsthita | hamsavaha hamsagatirhamsi hamsamanupriya || 73|| hastapadma hastayuga hasita
    hasitanana | hridya hrinmohasamhartri hridayastha hatasura || 74|| hakini hakinipujya hita hitakari
    hara | haridramudita harmyasamstha haladharedita || 75|| halahalaprashamani halakrishtajagattrya |
    hallisamudita heyavarjita harakomala || 76|| kshama kshamakari kshamamadhya kshamavinashini | kshamadivinuta
    kshipra kshanikacalasamsthita || 77|| kshapeshatulyavadana kshapacaravinashini | kshiprasiddhiprada
    kshemakarini kshetrarupini || 78|| kshetreshvari kshetrapalapujita kshudranashini | kshudragrahartishamani
    kshaudra kshodrambaravrita || 79|| kshirannarasika kshira kshudraghanta kshitishvari | kshitishavinuta
    kshatra kshatramandalavandita || 80|| kshayahina kshayavyadhinashini kshamanapaha | ksharakshara kshataratimandala
    kshipragamini || 81|| kshanada kshanadaradhya kshanadakutilalaka | kshinadosha kshitiruha kshititattva
    kshamamayi || 82|| amara camaradhishatanaya caparajita | aparakaruna'dvaita annada'nneshvari aja ||
    83|| ajarudha ajaradhya arjunaradhita'jara | arishtasamani caccha adbhuta amriteshvari || 84|| amritabdhikritavasa
    amritasarashitala | amritanandita'nadiramrita amritodbhava || 85|| anadimadhya avadhih anaupamyagunashrita
    | adharahina cadhara adharadheyavarjita || 86|| adityamandalantastha ashritakhilasiddhida | asumohitashadvaktra
    ashapalasupujita || 87|| aragvadhapriya''rartimudita''carashalini | ayuh prada''rogyakartri aradhya''harabhakshini
    || 88|| indrasena indranuta indravarajasambhava | indiraramanaprita indranikritalalana || 89|| indivarakshi
    indrakshi irammadasamaprabha | itihasashrutakatha ishta ceshtarthadayini || 90|| ikshvakuvamshyasampujya
    ijyashilavaraprada | ishvari ceshatanayagrihini ceshvarapriya || 91|| itibadhahara cedya ishanarahitashrita
    | umasutapriya codyadravitulya umapriya || 92|| udara codyama codyatkirana uruvikrama | uruprabhava
    corvibhrinnilaya coduganashrita || 93|| urunyastakara cordhvalokastha urdhvagamini | riddhida riddhavinuta
    rinahantri rijupriya || 94|| enankashekharasutagadhashlishtavapurdhara | enakshi cainamudita airammadasamambara
    || 95|| oshadhiprasthanilaya oshadhishanasevita | omishvari aupalamba autsukyavaradayini || 96|| audaryashila
    cambotkimudita''pannivarini | kanjakshi kanjavinuta kambukanthi kavipriya || 97|| kamala kamalaradhya
    kanatkanakavigriha | kamini kamavinuta kamaratiyutapriya || 98|| kamanganedita kamya kamalola kalavati
    | kankshahina kamakala kimshukabharadacchada || 99|| kala kuvamayananda kuruvindamaniprabha | kukkutadhvanamudita
    kukkutadhvajakomala || 100|| kurmasanagata kurmaprishthabhaprapadanvita | krittikatanayaprita krittikamandalavrita
    || 101|| krittikabhapriya krittidhara kedaravasini | kevala kevalananda kekimoda karadvaya || 102||
    kekivaha keshaveshta kailasacalavasini | kaivalyadatri kaivalya komala komalakritih || 103|| konastha
    kopavimukha kaundinyamunipujita | kripapurna kripaloka kripacaryasamarcita || 104|| kritantabhayada
    krishnanuta krishnajinasana | kalihantri kalishani kalikalmashanashini || 105|| kaveratanayatiravasini
    kamalasana | khadgahasta khadyalola khanditaratimandala || 106|| ganya ganapriya gadyapadya gananavarjita
    | ganeshavarajaprema ganikamandalotsuka || 107|| ganesharadhanodyukta gayatri ganalolupa | gathaneka
    galavarcya gangeyasumanohara || 108|| gangeyalingita tanuh gangeyaparamotsuka | girigamya girinuta
    girisha girishasnusha || 109|| girijajanijajaya girisaudha girishthita | girvanavinuta gita gitagandharvamandala
    || 110|| girvaneshatapolabdha girvani gishpatidita | guhya guhyatama gunya guhyakadisamarcita || 111||
    gurupriya gudhagatirguhananda guhapriya | guheshta guhasammoha guhananya guhotsuka || 112|| guhashrirguhasarajna
    guhashlishtakalovara | gudha gudhatama gudhavidya govindasambhava || 113|| govindasahajasunukalatram
    gopikanuta | gopalasundari gopanuta gokulanayika || 114|| gotrabhittanaya gotra gotrajna gopatisthita
    | gauravi gauravarnangi gauri gauryarcanapriya || 115|| gandakitiraga gandabherunda gandabhairavi
    | gandamala gandabhusha gandamangalyabhushana || 116|| ghatargala ghatarava ghatatulyastanadvaya |
    ghatanarahita ghantamanirghantaravapriya || 117|| ghatika ghatikashunya ghrinapurna ghrinipriya |
    ghatodbhavamunistutya ghutikasiddhidayini || 118|| ghurnakshi ghritakathinya ghritasuktanuvadita |
    ghritahutipriya ghrishtirghrishtakartri ghrinanidhih || 119|| ghorakritya ghorakrityavimukha ghanamurdhaja
    | cancala capala canda cadula cadulekshana || 120|| candapracanda candisha caracaravinodini | catura
    caturashrankacakra cakradharatmaja || 121|| cakrini cakra kabari cakravartisamarcita | candrakasha
    candramukhi candrahasa camatkrita || 122|| candrahasadhara cakravakastanabhujantara | cakravalasthita
    cakragatishcandanacarcita || 123|| carubhusha carumukhi carukantishcarupriya | carvakaduraga capadhara
    campeyagandhini || 124|| citra citraratha cintya cirantana | cinambara cinadeshya cidambaraviharini
    || 125|| cikura cikurabaddha ciranjivitvadayini | cintitarthaprada cintaniya cintamanishvari || 126||
    cintamanimayakalpa cinmayi cintita citih | cyutihina cutakunja coraghni coranashini || 127|| caturananasampujya
    camaragrahinivrita | cakshushmati cakshuroga harini canakapriya || 128|| candisunumanah pritikarini
    curnakuntala | curnapriya calaccela carukkanitakankana || 129|| camikaraprabha camikarabhairavamohini
    | camikaradrinilaya caturyoktijitapriya || 130|| catvara catvaragatishcaturvidhapumarthada | chatrini
    chatravirendra chavidiptadigantara || 131|| chayahina chaviccha
  devanagari: रक्ताभां रक्तवस्त्रां मणिमयखचितानेकभूषाभिरामां देवीं माहेन्द्रमान्यां मधुरिपुनयनादुद्भवां
    देवसेनाम् । कल्हारं दक्षहस्ते तदितरकरवरं लम्बितं सन्दधानां संस्थां स्कन्दस्य वामे समुदमपि गुहं लोकयन्तीं
    भजेऽहम् ॥ एवं ध्यात्वा समभ्यर्च्य मनसा सादरं नरः । पठेन्नामसहस्रं तत्स्तवराजमनुत्तमम् । ॐ देवसेना
    देवराजतनया देववन्दिता । देवी देवीश्वरी देववनिता देवतार्चिता ॥ १॥ देवरा देवराराध्या देवमानसहंसिका ।
    देवदारुवनान्तः स्था देवता देवमोहिनी ॥ २॥ देवारिविमुखा देवमुनीड्या देवदेशिका । दैत्यारितनया दैत्यकण्टकी
    दैत्यमर्दिनी ॥ ३॥ दैव्या दैन्यपराधीना दैवज्ञा दैव्यभक्षिणी । दोर्द्वया दोषहीनाङ्गी दोषाभा दोर्धृताम्बुजा
    ॥ ४॥ दोषाकरसमानास्या दोषाकरसमर्चिता । दोषघ्नी दोर्लता दोलचेला दोलविहारिणी ॥ ५॥ दण्डिणी दण्डनीतिस्था
    दण्डायुधपतिव्रता । दण्डकारण्यनिलया दण्डितासुरविक्रमा ॥ ६॥ दक्षा दाक्षायणीप्रता दक्षिणा दक्षिणाश्रिता
    । दक्षज्ञा दक्षिणावर्तकम्बुकण्ठी दयानिधिः ॥ ७॥ दयामूर्तिर्दरीदृश्या दारीद्रयभयनाशिनी । दशस्यन्दनसम्पूज्या
    दशनाजितचन्द्रिका ॥ ८॥ दम्भा दम्बविहीनेड्या दन्तिवक्त्रानुजप्रिया । दात्री दानवदर्पघ्नी दामोदरमनोहरा
    ॥ ९॥ दिव्या दिविषदीशाना दिविषत्पतिपूजिता । दिव्यौघमण्डला दिव्यमालिनी दिव्यविग्रहा ॥ १०॥ दिव्याम्बरधरा
    दीनरक्षिका दीनकृन्नुता । दीक्षिता दीक्षिताराध्या दीप्ता दीप्तविभूषणा ॥ ११॥ दुष्टदूरा दुराराध्या दुःखघ्नी
    दुरितान्तकी । दूती दूतकुलाभीष्टा दूर्वासस्तुतवैभवा ॥ १२॥ दूरदूरा दूरगन्त्री दूर्वादलसमप्रभा । दृश्या
    दृग्जलसम्भूता दृक्प्रदा दृक्तमोपहा ॥ १३॥ द्राविणी द्राविडाधीशा द्रोणपूज्या द्रुमाश्रिता । धन्दा धर्मिणी
    धर्मविनुता दर्मवर्धिनी ॥ १४॥ धात्री धात्रीफलप्रीता धिषणाधिपपूजिता । धिषणेशी धीरनुता धीरवादविलासिनी
    ॥ १५॥ धूम्रकेशी धूपमोदा धूर्तघ्नी धृतिमत्प्रिया । ध्येया ध्येयातिगा धौम्यवसना धौम्यपूजिता ॥ १६॥ नम्या
    नगोद्भवासूनुप्रिया नारायणात्मजा । नारायणाक्षिजलजा नारायणगुरुर्नता ॥ १७॥ नटी नटेश्वरानन्दा नन्दिनी
    नन्दगोपमुत् । नित्या नित्याश्रिता नित्यपतिर्नित्यपतिव्रता ॥ १८॥ निरञ्जना निराकारा निर्विकारा निरर्गला
    । नीहाराद्रिकृतावाशा नीहाराद्रिसुतास्नुषा ॥ १९॥ नीप्या नीपसुमप्रिता नूपुरारावकोमला । नूत्ना नूतनभूषाढ्या
    न्यूनहीना नरेडिता ॥ २०॥ नौकारूढा नवरसा नववादित्रमेदुरा । नववीरसमारध्या नवनागवरेश्वरी ॥ २१॥ नवग्रहवरा
    नव्या नव्याम्भोजधरा निशा । पद्माक्षी पद्मसङ्काशा पद्मजा पद्मभासुरा ॥ २२॥ पराचलकृतोद्वाहा पराचलविहारिणी
    । पद्मनाभसुता पद्मा पद्मिनी पद्ममालिनी ॥ २३॥ पारिजातसुमप्रीता पाशघ्नी पापनाशिनी । पाठीनवाहसम्पूज्या
    पार्वतीसुतकामिनी ॥ २४॥ पीनस्तनी पीनपृष्ठा पुष्पकोमला । पुष्करा पुष्कराराध्या पुष्करक्षेत्रदेवता ॥
    २५॥ पुलिन्दिनीसपत्नी च पुरुहूतात्मसम्भवा । पूज्या पूता पूतनारिविनुता पूर्वगामिनी ॥ २६॥ पुष्टेन्दुनयना
    पूर्णा पेशला पेशलासना । फणाधरमणिप्रख्या फणिराजसुपूजिता ॥ २७॥ फुल्लपद्मधरा फुल्लदृष्टिः फलनगाश्रिता
    । भालनेत्रसुतानन्दा भालनेत्रप्रियङ्करी ॥ २८॥ बला बलारिजा बाला बालारिष्टविनाशिनी । बालखिल्यनुता बाणाहस्ता
    बाणासुरान्तकी ॥ २९॥ बिम्बाधरा बिन्दुमध्यस्थिता बुधवरार्चिता । बोधायनमुनिप्रीता बोधदा बोधरूपिणी ॥ ३०॥
    बन्धुककुसुमप्रीता बन्धूकसुमसन्निभा । भामिनी भारती भामा भास्करेन्दुसुपूजिता ॥ ३१॥ भीमा भीमेश्वरी भूमा
    भूतिदा भूपतिप्रिया । भुवनेशी भोगवति भोगदा भोगवर्धिनी ॥ ३२॥ भोगिराजनुता भोग्या भीमसेनसमर्चिता । भैमी
    भेतालनटनरसिका भीष्मसेविता ॥ ३३॥ मन्त्रिणी मन्त्रसारज्ञा मन्त्रवर्णाकृतिर्मतिः । मनुचक्रधरा मान्या
    मणिमालविभूषिता ॥ ३४॥ मानिनी माधवसुता मधुप्रीता मनस्विनी । मधुरालापमुदितगिरिजातनुजा मही ॥ ३५॥ मातृकावर्ण
    सङ्कॢप्ततनुर्मान्धातृपूजिता । महादेवस्नुषा मीनलोचना मुक्तिदायिनी ॥ ३६॥ मञ्जुकेशी मञ्जुहासा मयूरवरवाहना
    । मारारातिस्नुषा मारसुरवदा मणिमण्डना ॥ ३७॥ मेषवाहा मेघवाहतनुजा मोहितप्रिया । मरुत्सप्तकसंसेव्या मैनाकनिलयाश्रिता
    ॥ ३८॥ यक्षिणी यज्ञसम्भूता यामिनी यमलोद्भवा । यन्त्रेश्वरी यमाराध्या यायजूकसमर्चिता ॥ ३९॥ यानारूढा
    यज्ञशीला युवतिर्यौवनार्चिता । योगिनी योगदा योग्या योगीन्द्रकुलवन्दिता ॥ ४०॥ रक्षोहन्त्री रणत्पादनूपुरा
    राघवार्चिता । रेणुका रणसन्नाहा रणत्किङ्किणिमेखला ॥ ४१॥ रावणान्तकरी राज्ञी राजराजसमर्चिता । रीम्बीजा
    रूपिणी रूप्या रमणी रमणोत्सुका ॥ ४२॥ रसायनकरी राधा राधेयी रथसंस्थिता । रोहिणीशमुखा रोगहीना रोगविनाशिनी
    ॥ ४३॥ रोचनातिलका रौद्री रौद्रमन्त्रविशारदा । लक्ष्मीपतिसुता लक्ष्मीर्लम्बवामकराम्बुजा ॥ ४४॥ लम्पटा
    लकुली लीला लोकालोकविहारिणी । लोकेश्वरी लोकपूज्या लताकारा ललत्कचा ॥ ४५॥ लोलम्बचेला लोलक्षी लघिमा लिकुचप्रिया
    । लोभहीना लब्धकामा लतानिलयसंस्थिता ॥ ४६॥ वनिता वनितारध्या वन्द्या वन्दासुवत्सला । वामा वामस्थिता वाणी
    वाक्प्र्दा वारिजप्रिया ॥ ४७॥ वारिजासनसन्दृष्टमन्त्रा वाञ्छासुरद्रुमा । विष्णुपत्नी विषहरा वीणालापविनोदिनी
    ॥ ४८॥ वेणीबन्धा वणुलोला वेणुगोपालसुन्दरी । वाञ्छाकल्पलता विश्ववन्दिता विश्वतोमुखी ॥ ४९॥ विघ्नेशदेवरा
    वीशा वीशवाहा विरोचिनी । वैरोचननुता वैरिहीना वीरेन्द्रवन्दिता ॥ ५०॥ विमाना विमनोदूरा विमानस्था विरट्
    प्रिया । वज्रिणी वज्रितनया वज्रभूषा विधीडिता ॥ ५१॥ विशालाक्षी वीतशोका वनस्था वनदेवता । वारुणी वनजारूढा
    वामा वामाङ्गसुन्दरी ॥ ५२॥ वल्लीसपत्नी वामोरुर्वसिष्ठादिमपूजिता । शक्तिः शचीसुता शक्तिधरा शाक्तेयकामिनी
    ॥ ५३॥ श्यामा शाक्करगा श्रीजा तथा श्रीः शिवमानसा । शिवस्नुषा शुभाकारा शुद्धा शैलविहारिणी ॥ ५४॥ शैलेन्द्रजाजानिजेष्टप्रदा
    शैलादिसन्नुता । शाम्भवी शङ्करानन्दा शङ्करी शशिशेखरा ॥ ५५॥ शारदा शारदाराध्या शरजन्मसती शिवा । षष्ठी
    षष्ठीश्वरी षष्ठिदेवी षष्ठयधिदेवता ॥ ५६॥ षडाननप्रीतिकर्त्री षड्गुणा षण्मुखप्रिया । षडाधारैकनिलया षोढान्यासमयाकृतिः
    ॥ ५७॥ षड्विधैक्यानुसन्धानप्रीता षड्रसमिश्रिता । साम्राज्ञी सकला साध्वी समनीस्थानगा सती ॥ ५८॥ सङ्गीतरसिका
    सारा सर्वाकरा सनातना । सनातनप्रिया सत्या सत्यधर्मा सरस्वती ॥ ५९॥ सहस्रनामसम्पूज्या सहस्रांशुसमप्रभा
    । स्कन्दोत्साहकरी स्कन्दवामोत्सङ्गनिवासिनी ॥ ६०॥ सिंहवक्त्रान्तककरी सिंहारूढा स्मितानना । स्वर्गस्था
    सुरसम्पूज्या सुन्दरी सुदती सुरा ॥ ६१॥ सुरेश्वरी सुराचार्यपूजिता सुकृतीडिता । सुरद्रुनिलया सौरमण्डलस्था
    सुखप्रदा ॥ ६२॥ सौदामिनीनिभासुभ्रूः सौन्दर्यचितहृत्प्रिया । सुरद्रुहासुहृत्सोमयाजिपूज्या सुमार्चिता
    ॥ ६३॥ सुमेषुवरदा सौम्या स्कन्दान्तःपुरवासिनी । स्कन्दकोष्ठगता स्कन्दवामभागस्थिता समा ॥ ६४॥ स्कन्दाश्लिष्टा
    स्कन्ददृष्टिः स्कन्दायत्तमनस्विनी । सनकादिहिता साङ्गा सायुधा सुरवंशजा ॥ ६५॥ सुरवल्ली सुरलता सुरलोकनिवासिनी
    । सुब्रह्मण्यसखी सेना सोमवंश्यनृपेडिता ॥ ६६॥ सुतप्रदा सूतवायुः सुरसैन्यसुरक्षिका । सर्वाधारा सर्वभूषा
    सर्वेशी सर्वपूजिता ॥ ६७॥ सरसा सादरा सामा स्वामिनी स्वामिमोहिनी । स्वाम्यद्रिनिलया स्वच्छा स्वतन्त्रा
    स्वस्तिदा स्वधा ॥ ६८॥ स्वाहाकृतिः स्वादुशीला स्वरप्रस्तारवित्तमा । हरस्नुषा हरानन्दा हरिनेत्रसमुद्भवा
    ॥ ६९॥ हरिणाक्षी हरिप्रेमा हरिदश्वविवर्धिता । हरसूनुप्रिया हरभासुरा हीरभूषणा ॥ ७०॥ हेमाम्बुजधरा हेमकाञ्ची
    हेमाब्जसंस्थिता । हेमाद्रिनिलया हेलामुदितास्वप्नकामिनी ॥ ७१॥ हेरम्बदेवरा होमप्रिया होत्री हिरण्यदा
    । हिरण्यगर्भोपज्ञातमन्त्रा हानिविवर्जिता ॥ ७२॥ हिमाचलस्थिता हन्त्री हर्यक्षासनसंस्थिता । हंसवाहा हंसगतिर्हंसी
    हंसमनुप्रिया ॥ ७३॥ हस्तपद्मा हस्तयुगा हसिता हसितानना । हृद्या हृन्मोहसंहर्त्री हृदयस्था हतासुरा ॥
    ७४॥ हाकिनी हाकिनीपूज्या हिता हितकरी हरा । हरिद्रामुदिता हर्म्यसंस्था हलधरेडिता ॥ ७५॥ हालाहलप्रशमनी
    हलाकृष्टजगत्त्र्या । हल्लीसमुदिता हेयवर्जिता हरकोमला ॥ ७६॥ क्षमा क्षमाकरी क्षाममध्या क्षामविनाशिनी
    । क्षामादिविनुता क्षिप्रा क्षणिकाचलसंस्थिता ॥ ७७॥ क्षपेशतुल्यवदना क्षपाचरविनाशिनी । क्षिप्रसिद्धिप्रदा
    क्षेमकारिणी क्षेत्ररूपिणी ॥ ७८॥ क्षेत्रेश्वरी क्षेत्रपालपूजिता क्षुद्रनाशिनी । क्षुद्रग्रहार्तिशमनी
    क्षौद्रा क्षोद्राम्बरावृता ॥ ७९॥ क्षीरान्नरसिका क्षीरा क्षुद्रघण्टा क्षितीश्वरी । क्षितीशविनुता क्षत्रा
    क्षत्रमण्डलवन्दिता ॥ ८०॥ क्षयहीना क्षयव्याधिनाशिनी क्षमणापहा । क्षराक्षरा क्षतारातिमण्डला क्षिप्रगामिनी
    ॥ ८१॥ क्षणदा क्षणदाराध्या क्षणदाकुटिलालका । क्षीणदोषा क्षितिरुहा क्षितितत्त्वा क्षमामयी ॥ ८२॥ अमरा
    चामराधीशतनया चापराजिता । अपारकरुणाऽद्वैता अन्नदाऽन्नेश्वरी अजा ॥ ८३॥ अजारूढा अजारध्या अर्जुनाराधिताऽजरा
    । अरिष्टसमनी चाच्छा अद्भुता अमृतेश्वरी ॥ ८४॥ अमृताब्धिकृतावासा अमृतासारशीतला । अमृतानन्दिताऽनादिरमृता
    अमृतोद्भवा ॥ ८५॥ अनादिमध्या अवधिः अनौपम्यगुणाश्रिता । आधारहीना चाधारा आधाराधेयवर्जिता ॥ ८६॥ आदित्यमण्डलान्तस्था
    आश्रिताखिलसिद्धिदा । आसुमोहितषड्वक्त्रा आशापालसुपूजिता ॥ ८७॥ आरग्वधप्रियाऽऽरार्तिमुदिताऽऽचरशालिनी
    । आयुः प्रदाऽऽरोग्यकर्त्री आरध्याऽऽहारभक्षिणी ॥ ८८॥ इन्द्रसेना इन्द्रनुता इन्द्रावरजसम्भवा । इन्दिरारमणप्रीता
    इन्द्राणीकृतलालना ॥ ८९॥ इन्दीवराक्षी इन्द्रक्षी इरम्मदसमप्रभा । इतिहासश्रुतकथा इष्टा चेष्टार्थदायिनी
    ॥ ९०॥ इक्ष्वाकुवंश्यसम्पूज्या इज्याशीलवरप्रदा । ईश्वरी चेशातनयगृहिणी चेश्वरप्रिया ॥ ९१॥ ईतिबाधाहरा
    चेड्या ईषणारहिताश्रिता । उमासुतप्रिया चोद्यद्रवितुल्या उमाप्रिया ॥ ९२॥ उदारा चोद्यमा चोद्यत्किरणा
    उरुविक्रमा । उरुप्रभावा चोर्वीभृन्निलया चोडुगणाश्रिता ॥ ९३॥ ऊरुन्यस्तकरा चोर्ध्वलोकस्था ऊर्ध्वगामिनी
    । ऋद्धिदा ऋद्धविनुता ऋणहन्त्री ऋजुप्रिया ॥ ९४॥ एणाङ्कशेखरसुतगाढाश्लिष्टवपुर्धरा । एणाक्षी चैणमुदिता
    ऐरम्मदसमाम्बरा ॥ ९५॥ ओषधिप्रस्थनिलया ओषधीशानसेविता । ओमीश्वरी औपलाम्बा औत्सुक्यवरदायिनी ॥ ९६॥ औदार्यशीला
    चाम्बोत्किमुदिताऽऽपन्निवरिणी । कञ्जाक्षी कञ्जविनुता कम्बुकण्ठी कविप्रिया ॥ ९७॥ कमला कमलाराध्या कनत्कनकविग्रिहा
    । कामिनी कामविनुता कामारातियुतप्रिया ॥ ९८॥ कामाङ्गनेडिता काम्या कामलोला कलावती । काङ्क्षाहीना कामकला
    किंशुकाभरदच्छदा ॥ ९९॥ कला कुवमयानन्दा कुरुविन्दमणिप्रभा । कुक्कुटध्वानमुदिता कुक्कुटध्वजकोमला ॥ १००॥
    कूर्मासनगता कूर्मपृष्ठाभप्रपदान्विता । कृत्तिकातनयप्रीता कृत्तिकामण्डलावृता ॥ १०१॥ कृत्तिकाभप्रिया
    कृत्तिधरा केदारवासिनी । केवला केवलानन्दा केकिमोदा करद्वया ॥ १०२॥ केकिवाहा केशवेष्टा कैलासाचलवासिनी
    । कैवल्यदात्री कैवल्या कोमला कोमलाकृतिः ॥ १०३॥ कोणस्था कोपविमुखा कौण्डिन्यमुनिपूजिता । कृपापूर्णा
    कृपालोका कृपाचार्यसमर्चिता ॥ १०४॥ कृतान्ताभयदा कृष्णनुता कृष्णाजिनासना । कलिहन्त्री कलीशानी कलिकल्मषनाशिनी
    ॥ १०५॥ कवेरतनयातीरवासिनी कमलासना । खड्गहस्ता खाद्यलोला खण्डितारातिमण्डला ॥ १०६॥ गण्या गणप्रिया गद्यापद्या
    गणनवर्जिता । गणेशावरजप्रेमा गणिकामण्डलोत्सुका ॥ १०७॥ गणेशाराधनोद्युक्ता गायत्री गानलोलुपा । गाथानेका
    गालवार्च्या गाङ्गेयसुमनोहरा ॥ १०८॥ गाङ्गेयालिङ्गित तनुः गाङ्गेयपरमोत्सुका । गिरिगम्या गिरिनुता गिरीशा
    गिरिशस्नुषा ॥ १०९॥ गिरिजाजानिजजया गिरिसौधा गिरिश्थिता । गीर्वाणविनुता गीता गीतगन्धर्वमण्डला ॥ ११०॥
    गीर्वाणेशतपोलब्धा गीर्वाणी गीष्पतीडिता । गुह्या गुह्यतमा गुण्या गुह्यकादिसमार्चिता ॥ १११॥ गुरुप्रिया
    गूढगतिर्गुहानन्दा गुहप्रिया । गुहेष्टा गुहसम्मोहा गुहानन्या गुहोत्सुका ॥ ११२॥ गुहश्रीर्गुहसारज्ञा
    गुहाश्लिष्टकलोवरा । गूढा गूढतमा गूढविद्या गोविन्दसम्भवा ॥ ११३॥ गोविन्दसहजासूनुकलत्रं गोपिकानुता ।
    गोपालसुन्दरी गोपनुता गोकुलनायिका ॥ ११४॥ गोत्रभित्तनया गोत्रा गोत्रज्ञा गोपतिस्थिता । गौरवी गौरवर्णाङ्गी
    गौरी गौर्यर्चनप्रिया ॥ ११५॥ गण्डकीतीरगा गण्डभेरुण्डा गण्डभैरवी । गण्डमाला गण्डभूषा गण्डमाङ्गल्यभूषणा
    ॥ ११६॥ घटार्गला घटरवा घटतुल्यस्तनद्वया । घटनारहिता घण्टामणिर्घण्टारवप्रिया ॥ ११७॥ घटिका घटिकाशून्या
    घृणापूर्णा घृणिप्रिया । घटोद्भवमुनिस्तुत्या घुटिकासिद्धिदायिनी ॥ ११८॥ घूर्णाक्षी घृतकाठिन्या घृतसूक्तानुवादिता
    । घृताहुतिप्रिया घृष्टिर्घृष्टकर्त्री घृणानिधिः ॥ ११९॥ घोरकृत्या घोरकृत्यविमुखा घनमूर्धजा । चञ्चला
    चपला चण्डा चदुला चदुलेक्षणा ॥ १२०॥ चण्डप्रचण्डा चण्डीशा चरचरविनोदिनी । चतुरा चतुरश्राङ्कचक्रा चक्रधरात्मजा
    ॥ १२१॥ चक्रिणी चक्र कबरी चक्रवर्तिसमर्चिता । चन्द्रकाशा चन्द्रमुखी चन्द्रहासा चमत्कृता ॥ १२२॥ चन्द्रहासधरा
    चक्रवाकस्तनभुजान्तरा । चक्रवालस्थिता चक्रगतिश्चन्दनचर्चिता ॥ १२३॥ चारुभूषा चारुमुखी चारुकान्तिश्चरुप्रिया
    । चार्वाकदूरगा चपधरा चाम्पेयगन्धिनी ॥ १२४॥ चित्रा चित्ररथा चिन्त्या चिरन्तना । चीनाम्बरा चीनदेश्या
    चिदम्बरविहारिणी ॥ १२५॥ चिकुरा चिकुराबद्धा चिरञ्जीवित्वदायिनी । चिन्तितार्थप्रदा चिन्तनीया चिन्तामणीश्वरी
    ॥ १२६॥ चिन्तामणिमयाकल्पा चिन्मयी चिन्तिता चितिः । च्युतिहीना चूतकुञ्जा चोरघ्नी चोरनाशिनी ॥ १२७॥ चतुराननसम्पूज्या
    चामरग्राहिणीवृता । चक्षुष्मती चक्षूरोग हारिणी चणकप्रिया ॥ १२८॥ चण्डीसूनुमनः प्रीतिकारिणी चूर्णकुन्तला
    । चूर्णप्रिया चलच्चेला चारुक्कणितकङ्कणा ॥ १२९॥ चामीकरप्रभा चामीकरभैरवमोहिनी । चामीकराद्रिनिलया चातुर्योक्तिजितप्रिया
    ॥ १३०॥ चत्वरा चत्वरगतिश्चतुर्विधपुमर्थदा । छत्रिणी छत्रवीरेन्द्रा छविदीप्तदिगन्तरा ॥ १३१॥ छायाहीना
    छविच्छ
