id: navagraha-suktam
category: stotram
name:
  english: Navagraha Suktam
content:
  english: om asatyena rajasa vartamano niveshayannamrita mmartyanca | hiranyayena savita rathena 'devo
    yati bhuvana vipashyann || vi~shvavedasam | asya yajnasya sukratu yeshamishe pashupatih pashunam catushpadamuta
    ca dvipada mbhagametu rayasposha yajamanasya santu || om adhidevata pratyadhidevata sahitaya bhagavate
    adityaya namah om agnirmurddha divah kakutpatih prithivya ayam | apagm retagmsi jinvati || syona prithivi
    bhava 'nrikshara niveshani | yacchana kshetrasya patina vayagm hiteneva jayamasi | gamashva mposhayitnva
    sa no mridati om adhidevata pratyadhidevata sahitaya bhagavate ankrakaya namah mpravashshukraya bhanave
    bharadhvagm havya ncagnaye suputam | yo daivyani manusha janug shyantar vishvani vidmana jigati ||
    indrani masu narishu supatni mahamashravam | na hyasya aparancana jarasa marate patih || vo~ vishvataspari
    havamahe jane bhyah | asmakamastu kevalah || om adhidevata pratyadhidevata sahitaya bhagavate shukraya
    namah om apyayasva sametu te vishvata ssoma vrishniyam | bhava vajasya sangathe || aphsume somo abravidantar
    vishvani bheshaja | agninca vishvashabhum mapashca vishvabheshajih || gauri mimaya salilani takshatyekapadi
    dvipadi sa catushpadi | ashtapadi navapadi babhuvushi sahasra kshara parame vyomann || om adhidevata
    pratyadhidevata sahitaya bhagavate somaya namah om udbuddhyasvagne pratijagrihyena mishtapurte sagm
    srijetha mayanca | punah krinvagg manvatagmsi tvayi tantumetam || vi~shnur vicakrame tredha nidadhe
    padam | samudhamasya pagm sure || vishno raratamasi vishnoh stho vishno ssyurasi vishno r dhruvamasi
    vaishnavamasi vishnave tva || om adhidevata pratyadhidevata sahitaya bhagavate budhaya namah mbrihaspate
    ati yadaryo ar dvibhati kratu majjaneshu | yaddida yaccha vasarta prajata tadasmasu dravina indramarutva
    iha pahi somam ya~tha sharyate apibassutasya | tava praniti tava shura sharmanna vivasanti kavayah
    suyajnah || mpurastad visimata ssuruco vena avah | sabuddhniya upama asya vishthassatashca yonima
    om adhidevata pratyadhidevata sahitaya bhagavate brihaspataye namah rabhishtaya apo bhavantu pitaye
    prajapate na tvadeta nyanyo vishva jatani parita babhuva | yatkamaste juhumastanno astu vayagg syama
    patayo rayinam || ya~ma prastaramahi sidankirobhih pitribhih sam vi~danah | atva mantrah kavishasta
    vahantvena rajan havisha madayasva || om adhidevata pratyadhidevata sahitaya bhagavate shanaishcaraya
    namah nkaya nashcitra abhuvaduti sadavridha ssakha | kaya shacishthaya vrita || 'yankauh prishnirakrami
    mpunah | pitaranca prayan riti rababandha dama grivasva vicartyam | idante tadvishya myayusho na maddhya
    datha jivah pitumaddhi pramuktah || om adhidevata pratyadhidevata sahitaya bhagavate rahave namah
    nkrinvannaketave pesho marya apeshase | samushadbhirajayathah || m | shyeno griddhranag svadhitir
    vananagm somah pavitra matyeti rebhann || masme citrakshatra citratamam va~yodham | candram rayi om
    adhidevata pratyadhidevata sahitebhyo bhagavadbhyah ketubhyo namah || om adityadi navagraha devatabhyo
    namo namah|| om shanti
  devanagari: ॐ आस॒त्येन॒ रज॑सा॒ वर्त॑मानो निवे॒शय॑न्न॒मृत॒ म्मर्त्य॑ञ्च । हि॒र॒ण्यये॑न सवि॒ता रथे॒ना
    ऽदे॒वो या॑ति॒ भुव॑ना वि॒पश्यन्न्॑ ॥ विँ॒श्ववे॑दसम् । अ॒स्य य॒ज्ञस्य॑ सु॒क्रतु येषा॒मीशे॑ पशु॒पतिः॑
    पशू॒नां चतु॑ष्पदामु॒त च॑ द्वि॒पदा म्भा॒गमे॑तु रा॒यस्पोषा॒ यज॑मानस्य सन्तु ॥ ॐ अधिदेवता प्रत्यधिदेवता
    सहिताय भगवते आदि॑त्याय॒ नमः॑ ॐ अ॒ग्निर्मू॒र्द्धा दि॒वः क॒कुत्पतिः॑ पृथि॒व्या अ॒यम् । अ॒पाग्ं रेताग्ं॑सि
    जिन्वति ॥ स्यो॒ना पृ॑थिवि॒ भवा॑ ऽनृक्ष॒रा नि॒वेश॑नी । यच्छा॑न॒ क्षेत्र॑स्य॒ पति॑ना व॒यग्ं हि॒तेने॑व
    जयामसि । गामश्व॑ म्पोषयि॒त्न्वा स नो॑ मृडाती॒ ॐ अधिदेवता प्रत्यधिदेवता सहिताय भगवते अङ्क्रका॑य॒ नमः॑
    म्प्रव॑श्शु॒क्राय॑ भा॒नवे॑ भरध्वग्ं ह॒व्य ञ्चा॒ग्नये॒ सुपू॑तम् । यो दैव्या॑नि॒ मानु॑षा ज॒नूग् ष्य॒न्तर्
    विश्वा॑नि वि॒द्मना॒ जिगा॑ति ॥ इ॒न्द्रा॒णी मा॒सु नारि॑षु सु॒पत्नी॑ म॒हम॑श्रवम् । न ह्य॑स्या अप॒रञ्च॒न
    ज॒रसा॒ मर॑ते॒ पतिः॑ ॥ वोँ वि॒श्वत॒स्परि॒ हवा॑महे॒ जने भ्यः । अ॒स्माक॑मस्तु॒ केव॑लः ॥ ॐ अधिदेवता प्रत्यधिदेवता
    सहिताय भगवते शुक्रा॑य॒ नमः॑ ॐ आप्या॑यस्व॒ समे॑तु ते वि॒श्वत॑ स्सोम॒ वृष्णि॑यम् । भवा॒ वाज॑स्य सङ्ग॒थे
    ॥ अ॒फ्सुमे॒ सोमो॑ अब्रवीद॒न्तर् विश्वा॑नि भेष॒जा । अ॒ग्निञ्च॑ वि॒श्वश॑भुं माप॑श्च वि॒श्वभे॑षजीः ॥
    गौ॒री मि॑माय सलि॒लानि॒ तक्ष॒त्येक॑पदी द्वि॒पदी॒ सा चतु॑ष्पदी । अ॒ष्टाप॑दी॒ नव॑पदी बभू॒वुषी॑ स॒हस्रा
    क्षरा पर॒मे व्यो॑मन्न् ॥ ॐ अधिदेवता प्रत्यधिदेवता सहिताय भगवते सोमा॑य॒ नमः॑ ॐ उद्बु॑द्ध्यस्वाग्ने॒
    प्रति॑जागृह्येन मिष्टापू॒र्ते सग्ं सृ॑जेथा म॒यञ्च॑ । पुनः॑ कृ॒ण्वग्ग् म॒न्वाताग्ं॑सी॒ त्वयि॒ तन्तु॑मे॒तम्
    ॥ विँष्णु॒र् विच॑क्रमे त्रे॒धा निद॑धे प॒दम् । समू॑ढमस्य पाग्ं सु॒रे ॥ विष्णो॑ र॒राट॑मसि॒ विष्णोः स्थो॒
    विष्णो॒ स्स्यूर॑सि॒ विष्णो र् ध्रु॒वम॑सि वैष्ण॒वम॑सि॒ विष्ण॑वे त्वा ॥ ॐ अधिदेवता प्रत्यधिदेवता सहिताय
    भगवते बुधा॑य॒ नमः॑ म्बृह॑स्पते॒ अति॒ यद॒र्यो अर् द्वि॒भाति॒ क्रतु॑ म॒ज्जने॑षु । यद्दी॒द य॒च्छ व॑सर्त
    प्रजात॒ तद॒स्मासु॒ द्रवि॑ण इन्द्र॑मरुत्व इ॒ह पा॑हि॒ सोमं॒ यँथा॑ शार्या॒ते अपि॑बस्सु॒तस्य॑ । तव॒ प्रणी॑ती॒
    तव॑ शूर॒ शर्म॒न्ना वि॑वासन्ति क॒वयः॑ सुय॒ज्ञाः ॥ म्पु॒रस्ता॒द् विसी॑म॒त स्सु॒रुचो॑ वे॒न आ॑वः । सबु॒द्ध्निया॑
    उप॒मा अ॑स्य वि॒ष्ठास्स॒तश्च॒ योनि॒म ॐ अधिदेवता प्रत्यधिदेवता सहिताय भगवते बृह॒स्पत॑ये॒ नमः॑ र॒भिष्ट॑य॒
    आपो॑ भवन्तु पी॒तये प्रजा॑पते॒ न त्वदे॒ता न्य॒न्यो विश्वा॑ जा॒तानि॒ परि॒ता ब॑भूव । यत्का॑मास्ते जुहु॒मस्तन्नो॑
    अस्तु व॒यग्ग् स्या॑म॒ पत॑यो रयी॒णाम् ॥ यँ॑म प्रस्त॒रमाहि सीदाङ्कि॑रोभिः पि॒तृभिः॑ सं विँदा॒नः । आत्वा॒
    मन्त्राः कविश॒स्ता व॑हन्त्वे॒ना रा॑जन् ह॒विषा॑ मादयस्व ॥ ॐ अधिदेवता प्रत्यधिदेवता सहिताय भगवते शनैश्च॑राय॒
    नमः॑ ङ्कया॑ नश्चि॒त्र आभु॑वदू॒ती स॒दावृ॑ध॒ स्सखा । कया॒ शचि॑ष्ठया वृ॒ता ॥ ऽयङ्कौः पृश्नि॑रक्रमी॒ म्पुनः॑
    । पि॒तर॑ञ्च प्र॒यन् ऋति॑ राब॒बन्ध॒ दाम॑ ग्री॒वास्व॑ विच॒र्त्यम् । इ॒दन्ते॒ तद्विष्या॒ म्यायु॑षो॒ न
    मद्ध्या॒ दथा॑ जी॒वः पि॒तुम॑द्धि॒ प्रमु॑क्तः ॥ ॐ अधिदेवता प्रत्यधिदेवता सहिताय भगवते राह॑वे॒ नमः॑ ङ्कृ॒ण्वन्न॑के॒तवे॒
    पेशो॑ मर्या अपे॒शसे । समु॒षद्भि॑रजायथाः ॥ म् । श्ये॒नो गृद्ध्रा॑णा॒ग्॒ स्वधि॑ति॒र् वना॑ना॒ग्ं॒ सोमः॑
    प॒वित्र॒ मत्ये॑ति॒ रेभन्न्॑ ॥ म॒स्मे चित्र॑क्षत्र चि॒त्रत॑मं वँयो॒धाम् । च॒न्द्रं र॒यि ॐ अधिदेवता
    प्रत्यधिदेवता सहितेभ्यो भगवद्भ्यः केतु॑भ्यो॒ नमः॑ ॥ ॐ आदित्यादि नवग्रह देव॑ताभ्यो॒ नमो॒ नमः॑॥ ॐ शान्ति॒
