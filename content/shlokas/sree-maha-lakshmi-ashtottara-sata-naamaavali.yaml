id: sree-maha-lakshmi-ashtottara-sata-naamaavali
category: stotram
name:
  english: Sree Maha Lakshmi Ashtottara Sata Naamaavali
content:
  english: om prakrityai namah om vikrityai namah om vidyayai namah om sarvabhuta hitapradayai namah om
