id: lalitakavacamnaradapurana
category: kavacha
name:
  english: lalitakavacamnaradapurana
  devanagari: ललिताकवचम्नारदपुराण
content:
  english: atha te kavacam devya vakshye navaratatmakam | yena devasuranarajayi syatsadhakah sada || 1||
    sarvatah sarvada''tmanam lalita patu sarvaga | kameshi puratah patu bhagamali tvanantaram || 2|| disham
    patu tatha dakshaparshvam me patu sarvada | nityaklinnatha bherunda disham me patu kaunapim || 3||
    tathaiva pashcimam bhagam rakshatadvahnivasini | mahavajreshvari nitya vayavye mam sadavatu || 4||
    vamaparshvam sada patu itimelarita tatah | maheshvari disham patu tvaritam siddhadayini || 5|| patu
    mamurdhvatah shashvaddevata kulasundari | adho nilapatakakhya vijaya sarvatashca mam || 6|| karotu
    me mangalani sarvada sarvamangala | dehendriyamanahprananjvalamalinivigraha || 7|| palayatvanisham
    citta cittam me sarvadavatu | kamatkrodhattatha lobhanmohanmananmadadapi || 8|| papanmam sarvatah
    shokatsankshayatsarvatah sada | asatyatkruracintato himsatashcauratastatha | staimityacca sada patu
    prerayantyah shubham prati || 9|| nityah shodasha mam patu gajarudhah svashaktibhih | tatha hayasamarudhah
    patu mam sarvatah sada || 10|| simharudhastatha patu patu rikshagata api | ratharudhashca mam patu
    sarvatah sarvada rane || 11|| tarkshyarudhashca mam patu tatha vyomagatashca tah | bhutagah sarvagah
    patu patu devyashca sarvada || 12|| bhutapretapishacashca parakrityadikan gadan | dravayantu svashaktinam
    bhushanairayudhairmama || 13|| gajashvadvipipancasyatarkshyarudhakhilayudhah | asankhyah shaktayo
    devyah patu mam sarvatah sada || 14|| sayam pratarjapannityakavacam sarvarakshakam | kadacinnashubham
    pashyetsarvadanandamasthitah || 15|| ityetatkavacam proktam lalitayah shubhavaham | yasya sandharananmartyo
    nirbhayo vijayi sukhi || 16|| || iti shribrihannaradiyapurane purvabhage tritiyapade brihadupakhyane
    shrilalitakavacam sampurnam || adhyayah 89||
  devanagari: अथ ते कवचं देव्या वक्ष्ये नवरतात्मकम् । येन देवासुरनरजयी स्यात्साधकः सदा ॥ १॥ सर्वतः सर्वदाऽऽत्मानं
    ललिता पातु सर्वगा । कामेशी पुरतः पातु भगमाली त्वनन्तरम् ॥ २॥ दिशं पातु तथा दक्षपार्श्वं मे पातु सर्वदा
    । नित्यक्लिन्नाथ भेरुण्डा दिशं मे पातु कौणपीम् ॥ ३॥ तथैव पश्चिमं भागं रक्षताद्वह्निवासिनी । महावज्रेश्वरी
    नित्या वायव्ये मां सदावतु ॥ ४॥ वामपार्श्वं सदा पातु इतीमेलरिता ततः । माहेश्वरी दिशं पातु त्वरितं सिद्धदायिनी
    ॥ ५॥ पातु मामूर्ध्वतः शश्वद्देवता कुलसुन्दरी । अधो नीलपताकाख्या विजया सर्वतश्च माम् ॥ ६॥ करोतु मे
    मङ्गलानि सर्वदा सर्वमङ्गला । देहेन्द्रियमनःप्राणाञ्ज्वालामालिनिविग्रहा ॥ ७॥ पालयत्वनिशं चित्ता चित्तं
    मे सर्वदावतु । कामात्क्रोधात्तथा लोभान्मोहान्मानान्मदादपि ॥ ८॥ पापान्मां सर्वतः शोकात्सङ्क्षयात्सर्वतः
    सदा । असत्यात्क्रूरचिन्तातो हिंसातश्चौरतस्तथा । स्तैमित्याच्च सदा पातु प्रेरयन्त्यः शुभं प्रति ॥ ९॥
    नित्याः षोडश मां पातु गजारूढाः स्वशक्तिभिः । तथा हयसमारूढाः पातु मां सर्वतः सदा ॥ १०॥ सिंहारूढास्तथा
    पातु पातु ऋक्षगता अपि । रथारूढाश्च मां पातु सर्वतः सर्वदा रणे ॥ ११॥ तार्क्ष्यारूढाश्च मां पातु तथा
    व्योमगताश्च ताः । भूतगाः सर्वगाः पातु पातु देव्यश्च सर्वदा ॥ १२॥ भूतप्रेतपिशाचाश्च परकृत्यादिकान्
    गदान् । द्रावयन्तु स्वशक्तीनां भूषणैरायुधैर्मम ॥ १३॥ गजाश्वद्वीपिपञ्चास्यतार्क्ष्यारूढाखिलायुधाः ।
    असङ्ख्याः शक्तयो देव्यः पातु मां सर्वतः सदा ॥ १४॥ सायं प्रातर्जपन्नित्याकवचं सर्वरक्षकम् । कदाचिन्नाशुभं
    पश्येत्सर्वदानन्दमास्थितः ॥ १५॥ इत्येतत्कवचं प्रोक्तं ललितायाः शुभावहम् । यस्य सन्धारणान्मर्त्यो निर्भयो
    विजयी सुखी ॥ १६॥ ॥ इति श्रीबृहन्नारदीयपुराणे पूर्वभागे तृतीयपादे बृहदुपाख्याने श्रीललिताकवचं सम्पूर्णम्
    ॥ अध्यायः ८९॥
