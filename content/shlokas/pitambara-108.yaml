id: pitambara-108
category: stotram
name:
  english: pitambara 108
  devanagari: पीताम्बरा १०८
content:
  english: rinushva gaditam mama || 1|| om pitambara shulahasta vajra vajrasharirini | tushtipushtikari
    shantirbrahmani brahmavadini || 2|| sarvalokananetra ca sarvarogaharapi ca | mangala mangalasnata
    nishkalanka nirakula || 3|| vishveshvari vishvamata lalita lalitakritih | sadashivaikagrahani candika
    candavikrama || 4|| sarvadevamayi sakshatsarvagamanirupita | brahmeshavishnunamita sarvakalyanakarini
    || 5|| yogamargaparayogiyaugidhyeyapadambuja | yogendra yoginipujya yogasuryanganandini || 6|| indradidevatavrindastuyamanatmavaibhava
    | vishuddhida bhayahara bhaktadveshikshayankari || 7|| bhavapashavinirmukta bherunda bhairavarcita
    | balabhadrapriyakarahalamadarasodhrita || 8|| pancabhutasharirastha pancakoshaprapancahrit | simhavaha
    manomoha mohapashanikrintani || 9|| madira madironmadamudra mudgaradharini | savitri prasavitri ca
    parapriyavinayaka || 10|| yamaduti pinganetra vaishnavi shankari tatha | candrapriya candanastha candanaranyavasini
    || 11|| vadanenduprabhapura purnabrahmandamandala | gandharvi yakshashaktishca kairati rakshasi tatha
    || 12|| papaparvatadambholirbhayadhvantaprabhakara | srishtisthityupasamharakarini kanakaprabha ||
    13|| lokanam devatananca yoshitam hitakarini | brahmanandaikarasika mahavidya balonnata || 14|| mahatejovati
    sukshma mahendraparipujita | paraparavati prana trailokyakarshakarini || 15|| kiritangadakeyuramala
    manjirabhushita | suvarnamalasanjaptaharidrasrak nishevita || 16|| ugravighnaprashamani daridryadrumabhanjini
    | rajacoranripavyalabhutapretabhayapaha || 17|| stambhini parasainyanam mohini parayoshitam | trasini
    sarvadushtanam grasini daityarakshasam || 18|| akarshini narendranam vashini prithivimritam | marini
    madamattanam dveshini dvishitam balat || 19|| kshobhini shatrusanghanam rodhini shastrapaninam | bhramini
    girikutanam rajnam vijaya varddhini || 20|| hlim kara bija sanjapta hlim kara paribhushita | bagala
    bagalavaktra pranavankura matrika || 21|| pratyaksha devata divya kalau kalpadrumopama | kirttakalyana
    kantinam kalanam ca kulalaya || 22|| sarva mantraika nilaya sarvasamrajya shalini | catuhshashthi
    mahamantra prativarna nirupita || 23|| smarana deva sarvesham duhkhapasha nikrintini | mahapralaya
    sanghata sankatadruma bhedini || 24|| itite kathitam brahmannamasahasramuttamam | ashtottarashatam
    capi namnamante nirupitam || 25|| kashmira kerala proktam sampradayanusaratah | namanijagadambayah
    pathasvakamalasana || 26|| tenemaudanavauviraustabdha shakti bhavishyatah | nanayorvidyate brahmanubhayam
    vidya prabhavatah || 27|| ishvara uvaca | ityuktah satadabrahma pathannamasahasrakam | stambhayamasa
    sahasa tayih shaktiparakramat || 28|| itite kathitam devi namasahasramuttamam | param brahmastra vidyaya
    bhukti mukti phalapradam || 29|| yah pathetpathayedvapi sha
  devanagari: ृणुष्व गदितं मम ॥ १॥ ॐ पीताम्बरा शूलहस्ता वज्रा वज्रशरीरिणी । तुष्टिपुष्टिकरी शान्तिर्ब्रह्माणी
    ब्रह्मवादिनी ॥ २॥ सर्वालोकननेत्रा च सर्वरोगहरापि च । मङ्गला मङ्गलास्नाता निष्कलङ्का निराकुला ॥ ३॥
    विश्वेश्वरी विश्वमाता ललिता ललिताकृतिः । सदाशिवैकग्रहणी चण्डिका चण्डविक्रमा ॥ ४॥ सर्वदेवमयी साक्षात्सर्वागमनिरूपिता
    । ब्रह्मेशविष्णुनमिता सर्वकल्याणकारिणी ॥ ५॥ योगमार्गपरायोगीयौगिध्येयपदाम्बुजा । योगेन्द्रा योगिनीपूज्या
    योगसूर्याङ्गनन्दिनी ॥ ६॥ इन्द्रादिदेवतावृन्दस्तूयमानात्मवैभवा । विशुद्धिदा भयहरा भक्तद्वेषीक्षयङ्करी
    ॥ ७॥ भवपाशविनिर्मुक्ता भेरुण्डा भैरवार्चिता । बलभद्रप्रियाकाराहालामदरसोधृता ॥ ८॥ पञ्चभूतशरीरस्था पञ्चकोशप्रपञ्चहृत्
    । सिंहवाहा मनोमोहा मोहपाशनिकृन्तनी ॥ ९॥ मदिरा मदिरोन्मादमुद्रा मुद्गरधारिणी । सावित्री प्रसावित्री
    च परप्रियविनायका ॥ १०॥ यमदूती पिङ्गनेत्रा वैष्णवी शाङ्करी तथा । चन्द्रप्रिया चन्दनस्था चन्दनारण्यवासिनी
    ॥ ११॥ वदनेन्दुप्रभापूर पूर्णब्रह्माण्डमण्डला । गान्धर्वी यक्षशक्तिश्च कैराती राक्षसी तथा ॥ १२॥ पापपर्वतदम्भोलिर्भयध्वान्तप्रभाकरा
    । सृष्टिस्थित्युपसंहारकारिणि कनकप्रभा ॥ १३॥ लोकानां देवतानाञ्च योषितां हितकारिणी । ब्रह्मानन्दैकरसिका
    महाविद्या बलोन्नता ॥ १४॥ महातेजोवती सूक्ष्मा महेन्द्रपरिपूजिता । परापरवती प्राणा त्रैलोक्याकर्षकारिणी
    ॥ १५॥ किरीटाङ्गदकेयूरमाला मञ्जिरभूषिता । सुवर्णमालासञ्जप्ताहरिद्रास्रक् निषेविता ॥ १६॥ उग्रविघ्नप्रशमनी
    दारिद्र्यद्रुमभञ्जिनी । राजचोरनृपव्यालभूतप्रेतभयापहा ॥ १७॥ स्तम्भिनी परसैन्यानां मोहिनी परयोषिताम्
    । त्रासिनी सर्वदुष्टानां ग्रासिनी दैत्यराक्षसाम् ॥ १८॥ आकर्षिणी नरेन्द्राणां वशिनी पृथिवीमृताम् ।
    मारिणी मदमत्तानां द्वेषिणी द्विषितां बलात् ॥ १९॥ क्षोभिणि शत्रुसङ्घानां रोधिनी शस्त्रपाणिनाम् । भ्रामिणी
    गिरिकूटानां राज्ञां विजय वर्द्धिनी ॥ २०॥ ह्लीं कार बीज सञ्जाप्ता ह्लीं कार परिभूषिता । बगला बगलावक्त्रा
    प्रणवाङ्कुर मातृका ॥ २१॥ प्रत्यक्ष देवता दिव्या कलौ कल्पद्रुमोपमा । कीर्त्तकल्याण कान्तीनां कलानां
    च कुलालया ॥ २२॥ सर्व मन्त्रैक निलया सर्वसाम्राज्य शालिनी । चतुःषष्ठी महामन्त्र प्रतिवर्ण निरूपिता
    ॥ २३॥ स्मरणा देव सर्वेषां दुःखपाश निकृन्तिनी । महाप्रलय सङ्घात सङ्कटद्रुम भेदिनी ॥ २४॥ इतिते कथितं
    ब्रह्मन्नामसाहस्रमुत्तमम् । अष्टोत्तरशतं चापि नाम्नामन्ते निरूपितम् ॥ २५॥ काश्मीर केरल प्रोक्तं सम्प्रदायानुसारतः
    । नामानिजगदम्बायाः पठस्वकमलासन ॥ २६॥ तेनेमौदानवौवीरौस्तब्ध शक्ति भविष्यतः । नानयोर्विद्यते ब्रह्मनूभयं
    विद्या प्रभावतः ॥ २७॥ ईश्वर उवाच । इत्युक्तः सतदाब्रह्मा पठन्नामसहस्रकम् । स्तम्भयामास सहसा तयीः शक्तिपराक्रमात्
    ॥ २८॥ इतिते कथितं देवि नामसाहस्रमुत्तमम् । परं ब्रह्मास्त्र विद्याया भुक्ति मुक्ति फलप्रदम् ॥ २९॥
    यः पठेत्पाठयेद्वापि श
