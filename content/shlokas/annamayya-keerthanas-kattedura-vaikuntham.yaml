id: annamayya-keerthanas-kattedura-vaikuntham
category: stotram
name:
  english: Annamayya Keerthanas Kattedura Vaikuntham
content:
  english: kattèdura vaikunthamu kanacayina kònda tèttaraya mahimale tirumala kònda || vedamule shilalai
    vèlasinadi kònda yedèsa bunyarasule yerulainadi kònda | gadili brahmadi lokamula kònalu kònda shridevu
    dundeti sheshadri kònda || sarvadevatalu mrigajatulai carince kònda nirvahinci jaladhule nittacarulaina
    kònda | vurvi dapasule taruvulai nilacina kònda purva tanjanadri yi pòdavati kònda || varamulu kòtaruga
    vakkaninci pènce kònda paragu lakshmikantu sobanapu gònda | kurisi sampadalèlla guhala nindina kònda
    virivaina dadivo shri venkatapu gònda ||
  devanagari: कट्टॆदुर वैकुण्ठमु काणाचयिन कॊण्ड तॆट्टराय महिमले तिरुमल कॊण्ड ॥ वेदमुले शिललै वॆलसिनदि
    कॊण्ड येदॆस बुण्यरासुले येरुलैनदि कॊण्ड । गादिलि ब्रह्मादि लोकमुल कॊनलु कॊण्ड श्रीदेवु डुण्डेटि शेषाद्रि
    कॊण्ड ॥ सर्वदेवतलु मृगजातुलै चरिञ्चे कॊण्ड निर्वहिञ्चि जलधुले निट्टचरुलैन कॊण्ड । वुर्वि दपसुले तरुवुलै
    निलचिन कॊण्ड पूर्व टञ्जनाद्रि यी पॊडवाटि कॊण्ड ॥ वरमुलु कॊटारुगा वक्काणिञ्चि पॆञ्चे कॊण्ड परगु लक्ष्मीकान्तु
    सोबनपु गॊण्ड । कुरिसि सम्पदलॆल्ल गुहल निण्डिन कॊण्ड विरिवैन ददिवो श्री वेङ्कटपु गॊण्ड ॥
