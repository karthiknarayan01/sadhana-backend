id: shakyasimhastotram-1
category: stotram
name:
  english: shakyasimhastotram 1
  devanagari: शाक्यसिंहस्तोत्रम् १
content:
  english: prajatam | svabhavato janmajarantakarine namo'stu tubhyam jagadekanatha || 6|| traidhatulokeshu
    vikasitum tam sambodhicaryamapavargasetum | tushitayuto janma cakara martye namo'stu tubhyam varabodhiraja
    || 7|| samyak pratijnam pratikritya yena sampreshyate mokshapure janaughah | tadarthamayasi ca martyaloke
    namo'stu tubhyam sumahatpratijna || 8|| yashcashtakam brahmakritam supunyam pathishyati shakyavaragratah
    sthah | duhkham mahapapabhayam ca hitva shrishrighane yasyati pattane muda || 9|| iti brahmana kritam
    shrishakyasimhastotram sampurnam ||
  devanagari: प्रजातम् । स्वभावतो जन्मजरान्तकारिणे नमोऽस्तु तुभ्यं जगदेकनाथ ॥ ६॥ त्रैधातुलोकेषु विकासितुं
    तां सम्बोधिचर्यामपवर्गसेतुम् । तुषितायुतो जन्म चकार मर्त्ये नमोऽस्तु तुभ्यं वरबोधिराज ॥ ७॥ सम्यक्
    प्रतिज्ञां प्रतिकृत्य येन संप्रेष्यते मोक्षपुरे जनौघः । तदर्थमायासि च मर्त्यलोके नमोऽस्तु तुभ्यं सुमहत्प्रतिज्ञ
    ॥ ८॥ यश्चाष्टकं ब्रह्मकृतं सुपुण्यं पठिष्यति शाक्यवराग्रतः स्थः । दुःखं महापापभयं च हित्वा श्रीश्रीघने
    यास्यति पत्तने मुदा ॥ ९॥ इति ब्रह्मणा कृतं श्रीशाक्यसिंहस्तोत्रं सम्पूर्णम् ॥
