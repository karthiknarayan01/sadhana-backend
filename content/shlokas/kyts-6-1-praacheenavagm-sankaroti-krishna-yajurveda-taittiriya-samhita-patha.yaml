    त्तद॑भी॒षहा॒ पुन॒रा द॑दीत॒ तेज॑ ए॒वा ऽस्मे ज्योतिः॑ सोमविक्र॒यिणि॒ तम॒ इत्या॑ह॒ ज्योति॑रे॒व यज॑माने
    दधाति॒ तम॑सा सोमविक्र॒यिण॑मर्पयति॒ यदनु॑पग्रथ्य ह॒न्या द्द॑न्द॒शूका॒स्ताग्ं समाग्ं॑ स॒र्पा स्स्यु॑रि॒दम॒हग्ं
    स॒र्पाणा ङ्ग्री॒वा उप॑ ग्रथ्ना॒मीत्या॒हा द॑न्दशूका॒स्ताग्ं समाग्ं॑ स॒र्पा भ॑वन्ति॒ तम॑सा सोमविक्र॒यिणं॑
    भ्राजेत्या॑है॒ते वा अ॒मुष्मि॑न् ँलो॒के सोम॑मरक्ष॒ यदे॒तेभ्यः॑ सोम॒क्रय॑णा॒ न्नानु॑दि॒शेदक्री॑तो ऽस्य॒
    सोमः॑ स्या॒न्नास्यै॒ते॑ ऽमुष्मि॑न् ँलो॒के सोमग्ं॑ रक्षेयु॒र्यदे॒तेभ्यः॑ सोम॒क्रय॑णाननुदि॒शति॑ क्री॒तो
    ऽस्य॒ सोमो॑ भवत्ये॒ते ऽस्या॒मुष्मि॑न् ँलो॒के सोमग्ं॑ रक्षन्ति ॥ इति॒ येन॒ हिर॑ण्येन॒ चतु॑श्चत्वारिग्ंशच्च
    स्सोम॒ उप॑नद्धो मि॒त्रो न॒ एहि॒ सुमि॑त्रधा॒ इत्या॑ह॒ शान्त्या॒ इन्द्र॑स्यो॒रुमा वि॑श॒ दक्षि॑ण॒मित्या॑ह
    दे॒वा वै यग्ं सोम॒मक्री॑ण न्तमिन्द्र॑स्यो॒रौ दक्षि॑ण॒ आ ऽसा॑दयन्ने॒ष खलु॒ वा ए॒तर् हीन्द्रो॒ यो यज॑ते॒
    तस्मा॑दे॒वमा॒होदायु॑षा स्वा॒युषेत्या॑ह दे॒वता॑ ए॒वा स्सद॒ आ सी॒देत्या॑ह यथाय॒जुरे॒वैत द्वि वा ए॑नमे॒तद॑र्धयति॒
    य ङ्क॒रोति॑ वारु॒ण्यर्चा ऽऽ सा॑दयति॒ स्वयै॒वैन॑ न्दे॒वत॑या॒ सम॑र्धयति॒ वास॑सा प॒र्यान॑ह्यति सर्वदेव॒त्यं॑
    स्सम॑र्धय॒त्यथो॒ रक्ष॑सा॒मप॑हत्यै॒ वने॑षु॒ व्य॑न्तरि॑क्ष न्तता॒नेत्या॑ह॒ वने॑षु॒ हि व्य॑न्तरि॑क्ष
    न्त॒तान॒ वाज॒मर्व॒थ्स्वित्या॑ह॒ वाज॒ग्ग्॒ ह्यर्व॑थ्सु॒ पयो॑ अघ्नि॒यास्वित्या॑ह॒ पयो॒ ह्य॑घ्नि॒यासु॑
    हृ॒थ्सु क्रतु॒मित्या॑ह हृ॒थ्सु हि क्रतुं॒ वँरु॑णो वि॒क्ष्व॑ग्निमित्या॑ह॒ वरु॑णो॒ हि वि॒क्ष्व॑ग्नि
    मित्या॑ह दि॒वि हि सूर्य॒ग्ं॒ सोम॒मद्रा॒वित्या॑ह॒ ग्रावा॑णो॒ वा अद्र॑य॒स्तेषु॒ वा ए॒ष सोम॑ न्दधाति॒
    यो यज॑ते॒ तस्मा॑दे॒वमा॒होदु॒ त्य ञ्जा॒तवे॑दस॒मिति॑ सौ॒र्यर्चा कृ॑ष्णाजि॒न म्प्र॒त्यान॑ह्यति॒ रक्ष॑सा॒मप॑हत्या॒
    उस्रा॒वेत॑ षाहा॒वित्या॑ह यथाय॒जुरे॒वैत त्प्र च्य॑वस्व भुवस्पत॒ इत्या॑ह भू॒ताना॒ग्॒ ह्ये॑ न्य॒भि धामा॒नीत्या॑ह॒
    विश्वा॑नि॒ ह्ये ऽभि धामा॑नि प्र॒च्यव॑ते॒ मा त्वा॑ परिप॒री वि॑द॒दित्या॑ह॒ यदे॒वाद ङ्गन्ध॒र्वो वि॒श्वाव॑सुः
    प॒र्यमु॑ष्णा॒ दे॒वमा॒हाप॑रिमोषाय॒ यज॑मानस्य स्व॒स्त्यय॑न्य॒सीत्या॑ह॒ यज॑मानस्यै॒वैष य॒ज्ञस्या न्वार॒भों
    ऽन॑वच्छित्त्यै॒ वरु॑णो॒ वा ए॒ष यज॑मानम॒भ्यैति॒ य स्सोम॒ उप॑नद्धो॒ नमो॑ स्सोम॒ उप॑नद्धो॒ नमो॑ मि॒त्रस्य॒
    वरु॑णस्य॒ चक्ष॑स॒ इत्या॑ह॒ शान्त्या॒ आ सोमं॒ वँह॑न्त्य॒ग्निना॒ प्रति॑ तिष्ठते॒ तौ स॒भं वँ॑न्तौ॒ यज॑मानम॒भि
    स म्भ॑वतः पु॒रा खलु॒ वावैष मेधा॑या॒ ऽऽत्मान॑मा॒रभ्य॑ चरति॒ यो दी क्षि॒तो यद॑ग्नीषो॒मीय॑ म्प॒शुमा॒लभ॑त
    आत्मनि॒ष्क्रय॑ण ए॒वास्य॒ स तस्मा॒ म्पुरुषनि॒ष्क्रय॑ण इव॒ ह्यथो॒ खल्वा॑हु र॒ग्नीषोमा वाँ इन्द्रो॑ वृ॒त्रम॑ह॒न्निति॒
    यद॑ग्नीषो॒मीय॑ म्प॒शुमा॒लभ॑त॒ वार्त्र॑घ्न ए॒वास्य॒ स तस्मा वाँरु॒ण्यर्चा परि॑ चरति॒ स्वयै॒वैन॑ न्दे॒वत॑या॒
    परि॑ चरति ॥ ब्रह्मवा॒दिनो॑ वि॒चित्यो॒ प्रा॒चीन॑वग्ंश॒ग्ग्॒ ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय
    संहितायां षष्ठकाण्डे प्रथमः प्रश्न
