id: kashyapakritam1shivastotram
category: stotram
name:
  english: kashyapakritam1shivastotram
  devanagari: कश्यपकृतं१शिवस्तोत्रम्
content:
  english: kashyapakritam 1 shivastotram kashyapa uvaca | lokatrayaikadhipaterna yasya kutrapi vastunyabhimanaleshah
    | sa siddhanatho'khilavishvakarta bharta shivaya bhavatu prasannah || 19|| tapatrayoshnadyutitapitanamitastato
    vai paridhavatam ca | sharirinam sthavarajangamanam tvameva duhkhavyapanodadakshah || 20|| sattvadiyogastrividho'pi
    yasya shakradibhirvaktumashakya eva | vicitravrittim paricintya somam sukhi sada danaparo varenyah
    || 21|| iti brahmapurane shatatamadhyayantargatam kashyapakritam shivastotram samaptam | brahmapurana
    | adhyaya 100
  devanagari: कश्यपकृतं १ शिवस्तोत्रम् कश्यप उवाच । लोकत्रयैकाधिपतेर्न यस्य कुत्रापि वस्तुन्यभिमानलेशः
    । स सिद्धनाथोऽखिलविश्वकर्ता भर्ता शिवाया भवतु प्रसन्नः ॥ १९॥ तापत्रयोष्णद्युतितापितानामितस्ततो वै
    परिधावतां च । शरीरिणां स्थावरजङ्गमानां त्वमेव दुःखव्यपनोददक्षः ॥ २०॥ सत्त्वादियोगस्त्रिविधोऽपि यस्य
    शक्रादिभिर्वक्तुमशक्य एव । विचित्रवृत्तिं परिचिन्त्य सोमं सुखी सदा दानपरो वरेण्यः ॥ २१॥ इति ब्रह्मपुराणे
    शततमाध्यायान्तर्गतं कश्यपकृतं शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय १००
