id: sree-purushottama-sahasra-nama-stotram
category: stotram
name:
  english: Sree Purushottama Sahasra Nama Stotram
content:
  english: viniyogah puranapurusho vishnuh purushottama ucyate | namnam sahasram vakshyami tasya bhagavatoddhritam
    || || yasya prasadadvagishah prajesha vibhavonnatah | kshudra api bhavantyashu shrikrishnam tam nato'smyaham
    || || ananta eva krishnasya lila namapravartikah | ukta bhagavate guhah prakata api kutracit || ||
    atastani pravakshyami namani muravairinah | sahasram yaistu pathitaih pathitam syacchukamritam ||
    || krishnanamasahasrasya rishiragnirnirupitah | gayatri ca tatha chando devata purushottamah || ||
    viniyogah samasteshu purushartheshu vai matah | bijam bhaktapriyah shaktih satyavagucyate harih ||
    || bhaktoddharanayatnastu mantro'tra paramo matah | avataritabhaktamshah kilakam parikirtitam || ||
    astram sarvasamarthashca govindah kavacam matam | purusho dhyanamatroktah siddhih sharanasamsmritih
    || || adhikaralila shrikrishnah saccidanando nityalilavinodakrit | sarvagamavinodi ca lakshmishah
    purushottamah || || adikalah sarvakalah kalatma mayayavritah | bhaktoddharaprayatnatma jagatkarta
    jaganmayah || || namalilaparo vishnurvyasatma shukamokshadah | vyapivaikunthadata ca shrimadbhagavatagamah
    || || shukavagamritabdhinduh shaunakadyakhileshtadah | bhaktipravartakastrata vyasacintavinashakah
    || || sarvasiddhantavagatma naradadyakhileshtadah | antaratma dhyanagamyo bhaktiratnapradayakah ||
    || muktopasripyah purnatma muktanam rativardhanah | bhaktakaryaikanirato draunyastravinivarakah ||
    || bhaktasmayapraneta ca bhaktavakparipalakah | brahmanyadevo dharmatma bhaktanam ca parikshakah ||
    || asannahitakarta ca mayahitakarah prabhuh | uttarapranadata ca brahmastravinivarakah || || sarvatah
    panavapatih parikshicchuddhikaranam | guhatma sarvavedeshu bhaktaikahridayangamah || || kuntistutyah
    prasannatma paramadbhutakaryakrit | bhishmamuktipradah svami bhaktamohanivarakah || || sarvavasthasu
    samsevyah samah sukhahitapradah | kritakrityah sarvasakshi bhaktastrirativardhanah || || sarvasaubhagyanilayah
    paramashcaryarupadhrik | ananyapurushasvami dvarakabhagyabhajanam || || bijasamskarakarta ca parikshijjanaposhakah
    | sarvatrapurnagunakah sarvabhushanabhushitah || || sarvalakshanadata ca dhritarashtravimuktidah |
    sanmargarakshako nityam vidurapritipurakah || || lilavyamohakarta ca kaladharmapravartakah | panavanam
    mokshadata parikshidbhagyavardhanah || || kalinigrahakarta ca dharmadinam ca poshakah | satsangajanahetushca
    shribhagavatakaranam || || prakritadrishtamargashca|||||||||||| continued jnana lila ||||||||||||||||||||||||
    shrotavyah sakalagamaih | kirtitavyah shuddhabhavaih smartavyashcatmavittamaih || || anekamargakarta
    ca nanavidhagatipradah | purushah sakaladharah sattvaikanilayatmabhuh || || sarvadhyeyo yogagamyo
    bhaktya grahyah surapriyah | janmadisarthakakritirlilakarta patih satam || || adikarta tattvakarta
    sarvakarta visharadah | nanavatarakarta ca brahmavirbhavakaranam || || dashalilavinodi ca nanasrishtipravartakah
    | anekakalpakarta ca sarvadoshavivarjitah || || sargalila vairagyahetustirthatma sarvatirthaphalapradah
    | tirthashuddhaikanilayah svamargapariposhakah || || tirthakirtirbhaktagamyo bhaktanushayakaryakrit
    | bhaktatulyah sarvatulyah svecchasarvapravartakah || || gunatito'navadyatma sargalilapravartakah
    | sakshatsarvajagatkarta mahadadipravartakah || || mayapravartakah sakshi mayarativivardhanah | akashatma
    caturmurtishcaturdha bhutabhavanah || || rajahpravartako brahma maricyadipitamahah | vedakarta yajnakarta
    sarvakarta'mitatmakah || || anekasrishtikarta ca dashadhasrishtikarakah | yajnango yajnavaraho bhudharo
    bhumipalakah || || seturvidharano jaitro hiranyakshantakah surah | ditikashyapakamaikahetusrishtipravartakah
    || || devabhayapradata ca vaikunthadhipatirmahan | sarvagarvaprahari ca sanakadyakhilarthadah || ||
    sarvashvasanakarta ca bhaktatulyahavapradah | kalalakshanahetushca sarvarthajnapakah parah || || bhaktonnatikarah
    sarvaprakarasukhadayakah | nanayuddhapraharano brahmashapavimocakah || || pushtisargapraneta ca gunasrishtipravartakah
    | kardameshtapradata ca devahutyakhilarthadah || || shuklanarayanah satyakaladharmapravartakah | jnanavatarah
    shantatma kapilah kalanashakah || || trigunadhipatih sankhyashastrakarta visharadah | sargadushanahari
    ca pushtimokshapravartakah || || laukikanandadata ca brahmanandapravartakah | bhaktisiddhantavakta
    ca sagunajnanadipakah || || atmapradah purnakamo yogatma yogabhavitah | jivanmuktipradah shrimananyabhaktipravartakah
    || || kalasamarthyadata ca kaladoshanivarakah | garbhottamajnanadata karmamarganiyamakah || || sarvamarganirakarta
    bhaktimargaikaposhakah | siddhihetuh sarvahetuh sarvashcaryaikakaranam || || cetanacetanapatih samudraparipujitah
    | sankhyacaryastutah siddhapujitah sarvapujitah || || visargalila visargakarta sarveshah kotisuryasamaprabhah
    | anantagunagambhiro mahapurushapujitah || || anantasukhadata ca brahmakotiprajapatih | sudhakotisvasthyahetuh
    kamadhukkotikamadah || || samudrakotigambhirastirthakotisamahvayah | sumerukotinishkampah kotibrahmandavigrahah
    || || kotyashvamedhapapaghno vayukotimahabalah | kotindujagadanandi shivakotiprasadakrit || || sarvasadgunamahatmyah
    sarvasadgunabhajanam | manvadiprerako dharmo yajnanarayanah parah || || akutisunurdevendro rucijanma'bhayapradah
    | dakshinapatirojasvi kriyashaktih parayanah || || dattatreyo yogapatiryogamargapravartakah | anasuyagarbharatnamrishivamshavivardhanah
    || || gunatrayavibhagajnashcaturvargavisharadah | narayano dharmasunurmurtipunyayashaskarah || ||
    sahasrakavacacchedi tapahsaro narapriyah | vishvanandapradah karmasakshi bharatapujitah || || anantadbhutamahatmyo
    badaristhanabhushanam | jitakamo jitakrodho jitasango jitendriyah || || urvashiprabhavah svargasukhadayi
    sthitipradah | amani manado gopta bhagavacchastrabodhakah || || brahmadivandyo hamsashrirmayavaibhavakaranam
    | vividhanantasargatma vishvapuranatatparah || || yajnajivanahetushca yajnasvamishtabodhakah | nanasiddhantagamyashca
    saptatantushca shadgunah || || pratisargajagatkarta nanalilavisharadah | dhruvapriyo dhruvasvami cintitadhikadayakah
    || || durlabhanantaphalado dayanidhiramitraha | angasvami kripasaro vainyo bhuminiyamakah || || bhumidogdha
    prajapranapalanaikaparayanah | yashodata jnanadata sarvadharmapradarshakah || || puranjano jaganmitram
    visargantapradarshakah | pracetasam patishcitrabhaktiheturjanardanah || || smritihetubrahmabhavasayujyadipradah
    shubhah | vijayi |||||||||||||||||||| continued sthanalila |||| sthitililabdhiracyuto vijayapradah
    || || svasamarthyaprado bhaktakirtiheturadhokshajah | priyavratapriyasvami svecchavadavisharadah ||
    || sangyagamyah svaprakashah sarvasangavivarjitah | icchayam ca samaryadastyagamatropalambhanah ||
    || acintyakaryakarta ca tarkagocarakaryakrit | sha ringararasamaryada agnidhrarasabhajanam || || nabhishtapurakah
    karmamaryadadarshanotsukah | sarvarupo'dbhutatamo maryadapurushottamah || || sarvarupeshu satyatma
    kalasakshi shashiprabhah | merudevivrataphalamrishabho bhagalakshanah || || jagatsantarpako megharupi
    devendradarpaha | jayantipatiratyantapramanasheshalaukikah || || shatadhanyastabhutatma shatanando
    gunaprasuh | vaishnavotpadanaparah sarvadharmopadeshakah || || parahamsakriyagopta yogacaryapradarshakah
    | caturthashramanirneta sadanandashariravan || || pradarshitanyadharmashca bharatasvamyaparakrit |
    yathavatkarmakarta ca sanganishtapradarshakah || || avashyakapunarjanmakarmamargapradarshakah | yajnarupamrigah
    shantah sahishnuh satparakramah || || rahuganagatijnashca rahuganavimocakah | bhavatavitattvavakta
    bahirmukhahite ratah || || gayasvami sthanavamshakarta sthanavibhedakrit | purushavayavo bhumivisheshavinirupakah
    || || jambudvipapatirmerunabhipadmaruhashrayah | nanavibhutililadhyo gangotpattinidanakrit || || gangamahatmyahetushca
    gangarupo'tigudhakrit | vaikunthadehahetvambujanmakrit sarvapavanah || || shivasvami shivopasyo gudhah
    sankarshanatmakah | sthanaraksharthamatsyadirupah sarvaikapujitah || || upasyananarupatma jyotirupo
    gatipradah | suryanarayano vedakantirujjvalaveshadhrik || || hamso'ntarikshagamanah sarvaprasavakaranam
    | anandakarta vasudo budho vakpatirujjvalah || || kalatma kalakalashca kalacchedakriduttamah | shishumarah
    sarvamurtiradhidaivikarupadhrik || || anantasukhabhogadhyo vivaraishvaryabhajanam | sankarshano daityapatih
    sarvadharo brihadvapuh || || anantanarakacchedi smritimatrartinashanah | sarvanugrahakarta ca ||||||||||||||||||||
    continued poshana lila |||||||||||||||| maryadabhinnashastrakrit || || kalantakabhayacchedi namasamarthyarupadhrik
    | uddharanarhagoptratma namadiprerakottamah || || ajamilamahadushtamocako'ghavimocakah | dharmavakta'klishtavakta
    vishnudharmasvarupadhrik || || sanmargaprerako dharta tyagaheturadhokshajah | vaikunthapuraneta ca
    dasasamvriddhikarakah || || dakshaprasadakriddhamsaguhyastutivibhavanah | svabhiprayapravakta ca muktajivaprasutikrit
    || || naradapreranatma ca haryashvabrahmabhavanah | shabalashvahito gudhavakyarthajnapanakshamah ||
    || gudharthajnapanah sarvamokshanandapratishthitah | pushtiprarohahetushca dasaikajnatahridgatah ||
    || shantikarta suhitakrit striprasuh sarvakamadhuk | pushtivamshapraneta ca vishvarupeshtadevata ||
    || kavacatma palanatma varmopacitikaranam | vishvarupashirashchedi tvashtrayajnavinashakah || || vritrasvami
    vritragamyo vritravrataparayanah | vritrakirtirvritramoksho maghavatpranarakshakah || || ashvamedhahavirbhokta
    devendramivanashakah | samsaramocakashcitraketubodhanatatparah || || mantrasiddhih siddhihetuh susiddhiphaladayakah
    | mahadevatiraskarta bhaktyai purvarthanashakah || || devabrahmanavidveshavaimukhyajnapakah shivah
    | adityo daityarajashca mahatpatiracintyakrit || || marutam bhedakastrata vratatma pumprasutikrit
    | utilila karmatma vasanatma ca utililaparayanah || || samadaityasurah svatma vaishamyajnanasamshrayah
    | dehadyupadhirahitah sarvajnah sarvahetuvid || || brahmavaksthapanaparah svajanmavadhikaryakrit |
    sadasadvasanahetustrisatyo bhaktamocakah || || hiranyakashipudveshi pravishtatma'tibhishanah | shantijnanadihetushca
    prahladotpattikaranam || || daityasiddhantasadvakta tapahsara udaradhih | daityahetuprakatano bhakticihnaprakashakah
    || || saddveshahetuh saddveshavasanatma nirantarah | naishthuryasima prahladavatsalah sangadoshaha
    || || mahanubhavah sakarah sarvakarah pramanabhuh | stambhaprasutirnriharirnrisimho bhimavikramah
    || || vikatasyo lalajjihvo nakhashastro javotkatah | hiranyakashipucchedi kruradaityanivarakah ||
    || simhasanasthah krodhatma lakshmibhayavivardhanah | brahmadyatyantabhayabhurapurvacintyarupadhrik
    || || bhaktaikashantahridayo bhaktastutyah stutipriyah | bhaktangalehanoddhutakrodhapunjah prashantadhih
    || || smritimatrabhayatrata brahmabuddhipradayakah | gorupadharyamritapah shivakirtivivardhanah ||
    || dharmatma sarvakarmatma visheshatma''shramaprabhuh | samsaramagnasvoddharta sanmargakhilatattvavak
    || || acaratma sadacarah |||||||||||||||||| continued manvantaralila ||||||||||||||||||||manvantaravibhavanah
    | smritya'sheshashubhaharo gajendrasmritikaranam || || jatismaranahetvaikapujabhaktisvarupadah | yajno
    bhayanmanutrata vibhurbrahmavratashrayah || || satyaseno dushtaghati harirgajavimocakah | vaikuntho
    lokakarta ca ajito'mritakaranam || || urukramo bhumiharta sarvabhaumo balipriyah | vibhuh sarvahitaikatma
    vishvaksenah shivapriyah || || dharmaseturlokadhritih sudhamantarapalakah | upaharta yogapatirbrihadbhanuh
    kriyapatih || || caturdashapramanatma dharmo manvadibodhakah | lakshmibhogaikanilayo devamantrapradayakah
    || || daityavyamohakah sakshadgarudaskandhasamshrayah | lilamandaradhari ca daityavasukipujitah ||
    || samudronmathanayatto'vighnakarta svavakyakrit | adikurmah pavitratma mandaragharshanotsukah ||
    || shvasaijadabdhivarvicih kalpantavadhikaryakrit | caturdashamaharatno lakshmisaubhagyavardhanah
    || || dhanvantarih sudhahasto yajnabhokta''rtinashanah | ayurvedapraneta ca devadaityakhilarcitah
    || || buddhivyamohako devakaryasadhanatatparah | strirupo mayaya vakta daityantahkaranapriyah || ||
    payitamritadevamsho yuddhahetusmritipradah | sumalimalivadhakrinmalyavatpranaharakah || || kalanemishirashchedi
    daityayajnavinashakah | indrasamarthyadata ca daityasheshasthitipriyah || || shivavyamohako mayi bhrigumantrasvashaktidah
    | balijivanakarta ca svargaheturvratarcitah || || adityanandakarta ca kashyapaditisambhavah | upendra
    indravarajo vamanabrahmarupadhrik || || brahmadisevitavapuryajnapavanatatparah | yacnopadeshakarta
    ca jnapitasheshasamsthitih || || satyarthaprerakah sarvaharta garvavinashakah | trivikramastrilokatma
    vishvamurtih prithushravah || || pashabaddhabalih sarvadaityapakshopamardakah | sutalasthapitabalih
    svargadhikasukhapradah || || karmasampurtikarta ca svargasamsthapitamarah | jnatatrividhadharmatma
    mahamino'bdhisamshrayah || || satyavratapriyo gopta matsyamurtidhritashrutih | sha ringabaddhadhritakshonih
    sarvarthajnapako guruh || || ishanukathalila ishasevakalilatma suryavamshapravartakah | somavamshodbhavakaro
    manuputragatipradah || || ambarishapriyah sadhurdurvasogarvanashakah | brahmashapopasamharta bhaktakirtivivardhanah
    || || ikshvakuvamshajanakah sagaradyakhilarthadah | bhagirathamahayatno gangadhautanghripankajah ||
    || brahmasvami shivasvami sagaratmajamuktidah | khatvangamokshahetushca raghuvamshavivardhanah ||
    || raghunatho ramacandro ramabhadro raghupriyah | anantakirtih punyatma punyashlokaikabhaskarah ||
    || koshalendrah pramanatma sevyo dasharathatmajah | lakshmano bharatashcaiva shatrughno vyuhavigrahah
    || || vishvamitrapriyo dantastadakavadhamokshadah | vayavyastrabdhinikshiptamaricashca subahuha ||
    || vrishadhvajadhanurbhangapraptasitamahotsavah | sitapatirbhrigupatigarvaparvatanashakah || || ayodhyasthamahabhogayuktalakshmivinodavan
    | kaikeyivakyakarta ca pitrivakparipalakah || || vairagyabodhako'nanyasattvikasthanabodhakah | ahalyaduhkhahari
    ca guhasvami salakshmanah || || citrakutapriyasthano dandakaranyapavanah | sharabhangasutikshnadipujito'gastyabhagyabhuh
    || || rishisamprarthitakritirviradhavadhapanditah | chinnashurpanakhanasah kharadushanaghatakah ||
    || ekabanahatanekasahasrabalarakshasah | maricaghati niyatasitasambandhashobhitah || || sitaviyoganatyashca
    jatayurvadhamokshadah | shabaripujito bhaktahanumatpramukhavritah || || dundubhyasthipraharanah saptatalavibhedanah
    | sugrivarajyado valighati sagarashoshanah || || setubandhanakarta ca vibhishanahitapradah | ravanadishirashchedi
    rakshasaghaughanashakah || || sita'bhayapradata ca pushpakagamanotsukah | ayodhyapatiratyantasarvalokasukhapradah
    || || mathurapuranirmata sukritajnasvarupadah | janakajnanagamyashca ailantaprakatashrutih || || haihayantakaro
    ramo dushtakshatravinashakah | somavamshahitaikatma yaduvamshavivardhanah || || nirodhalila parabrahmavataranah
    keshavah kleshanashanah | bhumibharavatarano bhaktarthakhilamanasah || || sarvabhaktanirodhatma lilanantanirodhakrit
    | bhumishthaparamanando devakishuddhikaranam || || vasudevajnananishthasamajivanivarakah | sarvavairagyakaranasvaliladharashodhakah
    || || mayajnapanakarta ca sheshasambharasambhritih | bhaktakleshaparijnata tannivaranatatparah ||
    || avishtavasudevamsho devakigarbhabhushanam | purnatejomayah purnah kamsadhrishyapratapavan || ||
    vivekajnanadata ca brahmadyakhilasamstutah | satyo jagatkalpatarurnanarupavimohanah || || bhaktimargapratishthata
    vidvanmohapravartakah | mulakalagunadrashta nayananandabhajanam || || vasudevasukhabdhishca devakinayanamritam
    | pitrimatristutah purvasarvavrittantabodhakah || || gokulagatililaptavasudevakarasthitih | sarveshatvaprakatano
    mayavyatyayakarakah || || jnanamohitadushteshah prapancasmritikaranam | yashodanandano nandabhagyabhugokulotsavah
    || || nandapriyo nandasunuryashodayah stanandhayah | putanasupayahpata mugdhabhavatisundarah || ||
    sundarihridayanando gopimantrabhimantritah | gopalashcaryarasakrit shakatasurakhandanah || || nandavrajajananandi
    nandabhagyamahodayah | trinavartavadhotsaho yashodajnanavigrahah || || balabhadrapriyah krishnah sankarshanasahayavan
    | ramanujo vasudevo goshthanganagatipriyah || || kinkiniravabhavajno vatsapucchavalambanah | navanitapriyo
    gopimohasamsaranashakah || || gopabalakabhavajnashcauryavidyavisharadah | mritsnabhakshanalilasyamahatmyajnanadayakah
    || || dharadronapritikarta dadhibhandavibhedanah | damodaro bhaktavashyo yamalarjunabhanjanah || ||
    brihadvanamahashcaryo vrindavanagatipriyah | vatsaghati balakelirbakasuranishudanah || || aranyabhokta'pyathava
    balalilaparayanah | protsahajanakashcaivamaghasuranishudanah || || vyalamokshapradah pushto brahmamohapravardhanah
    | anantamurtih sarvatma jangamasthavarakritih || || brahmamohanakarta ca stutya atma sadapriyah |
    paugandalilabhiratirgocaranaparayanah || || vrindavanalatagulmavriksharupanirupakah | nadabrahmaprakatano
    vayahpratikritisvanah || || barhinrityanukarano gopalanukritisvanah | sadacarapratishthata balashramanirakritih
    || || tarumulakritasheshatalpashayi sakhistutah | gopalasevitapadah shrilalitapadambujah || || gopasamprarthitaphaladananashitadhenukah
    | kaliyaphanimanikyaranjitashripadambujah || || drishtisanjivitasheshagopagogopikapriyah | lilasampitadavagnih
    pralambavadhapanditah || || davagnyavritagopaladrishtyacchadanavahnipah | varshasharadvibhutishrirgopikamaprabodhakah
    || || gopiratnastutasheshavenuvadyavisharadah | katyayanivratavyajasarvabhavashritanganah || || satsangatistutivyajastutavrindavananghripah
    | gopakshucchantisamvyajaviprabharyaprasadakrit || || hetupraptendrayagasvakaryagosavabodhakah | shailarupakritashesharasabhogasukhavahah
    || || lilagovardhanoddharapalitasvavrajapriyah | gopasvacchandalilarthagargavakyarthabodhakah || ||
    indradhenustutipraptagovindendrabhidhanavan | vratadidharmasamsaktanandakleshavinashakah || || nandadigopamatreshtavaikunthagatidayakah
    | venuvadasmarakshobhamattagopivimuktidah || || sarvabhavapraptagopisukhasamvardhanakshamah | gopigarvapranasharthatirodhanasukhapradah
    || || krishnabhavavyaptavishvagopibhavitaveshadhrik | radhavisheshasambhogapraptadoshanivarakah ||
    || paramapritisangitasarvadbhutamahagunah | manapanodanakrandagopidrishtimahotsavah || || gopikavyaptasarvangah
    strisambhashavisharadah | rasotsavamahasaukhyagopisambhogasagarah || || jalasthalarativyaptagopidrishtyabhipujitah
    | shastranapekshakamaikamuktidvaravivardhanah || || sudarshanamahasarpagrastanandavimocakah | gitamohitagopidhrikshankhacudavinashakah
    || || gunasangitasantushtirgopisamsaravismritih | arishtamathano daityabuddhivyamohakarakah || ||
    keshighati naradeshto vyomasuravinashakah | akrurabhaktisamraddhapadarenumahanidhih || || rathavarohashuddhatma
    gopimanasaharakah | hradasandarshitasheshavaikunthakrurasamstutah || || mathuragamanotsaho mathurabhagyabhajanam
    | mathuranagarishobhadarshanotsukamanasah || || dushtaranjakaghati ca vayakarcitavigrahah | vastramalasushobhangah
    kubjalepanabhushitah || || kubjasurupakarta ca kubjarativarapradah | prasadarupasantushtaharakodandakhandanah
    || || shakalahatakamsaptadhanurakshakasainikah | jagratsvapnabhayavyaptamrityulakshanabodhakah ||
