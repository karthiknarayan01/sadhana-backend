id: lomashaproktamshrisvamikavacam
category: kavacha
name:
  english: lomashaproktamshrisvamikavacam
  devanagari: लोमशप्रोक्तंश्रीस्वामिकवचम्
content:
  english: lomashaproktam shrisvamikavacam stribhih sakam suyoddhavyam stribhireva hi dharmatah | bhavatyah
    kanyakah sarva dharayantu hi varma ca || 46|| shastranimani sarvani dharayantu yathayatham | mantran
    divyan dharayantu nashayantu ca ta drutam || 47|| ityuktva lomashah shighram patyarthapranarakshikah
    | kanyakah shravayamasa shrisvamikavacam tada || 48|| triracamya harim dhyatva prananayamya tristatha
    | mastake me harerastu mastakam ca mukhe mukham || 49|| netrayorme'sya netre stam shravasorme'sya
    vai shravau | mama kanthe hareh kantho hastayorme hareh karau || 50|| vakshasi stanayorme ca harervakshahstanau
    tatha | udare me harerastudaram katyam hareh katih || 51|| prishthe prishtham nitambayorme nitambau
    harestatha | gupte guptam tatha sakthnoh sakthini padayoh pade || 52|| sarva murtirharerastu mayi
    sarvangamurtike | iti nyasan vidhayaiva svamikavacamuccaret || 53|| om anadishrikrishnanarayanah sarvaprahetiman
    | divyavimanamarudhah sarvaraksham karotu nah || 54|| shankhacakragadapadmacarmasicapapashavan | dhanustrishulasharavan
    shastrebhyo'vatu no harih || 55|| vyomni divyakramo'vyanno'nale krishnanarayanah | vayau pranapatih
    payajjale svami paratparah || 56|| prithvyamavyadbalakrishno yuddhe'vyatpurushottamah | shastrastramantrapatebhyo'vyannah
    patih phalasthitah || 57|| indrajaladimayabhyo'ntaratma'vyat shriyah patih | priyasvami krishnanarayano'vyatkalavegatah
    || 58|| rakshasibhyah krishnakantashcavyadanavadhanatah | mrityuroga'cintyabhibhyah patu na krishnavallabhah
    || 59|| bhautikebhyo vikarebhyah patu no'ksharadhamapah | sarvavasthasu sarvebhyah patu tvantaragah
    prabhuh || 60|| samhara rakshasisainyam rakshaya kanyakakulam | anandaya tato nashca jayam dehi pareshvara
    || 61|| omanadikrishnanarayano'sya devata'vatu | lomashaya namah svamikavacasyarshaye sada || 62||
    kambharashrimahalakshmyai rakshakartryai namo'vatu | narayanaya gopalakrishnaya ca namo'vatu || 63||
    ityuccavitamevaitatkavacam kotirupadhrika | kshanadajayata kotisuryavartulamujjvalam || 64|| kanyasta
    dharayamasu radhike ca tvaya saha | manjula parvati lakshmih prabha hamsa ca maniki || 65|| kotikotyah
    svarnavarnam dadhyustacchedavarjitam | avrinam ca'viyuktam ca varma varshmasu puritam || 66|| komalam
    nishthuram capi sukhasparsham ca rakshakam | dhritva jalena sakam ca shastrastramantrakan papuh ||
    67|| kanyakavarmamantradhya yugapat kripaya'bhavan |
  devanagari: लोमशप्रोक्तं श्रीस्वामिकवचम् स्त्रीभिः साकं सुयोद्धव्यं स्त्रीभिरेव हि धर्मतः । भवत्यः कन्यकाः
    सर्वा धारयन्तु हि वर्म च ॥ ४६॥ शस्त्राणीमानि सर्वाणि धारयन्तु यथायथम् । मन्त्रान् दिव्यान् धारयन्तु
    नाशयन्तु च ता द्रुतम् ॥ ४७॥ इत्युक्त्वा लोमशः शीघ्रं पत्यर्थप्राणरक्षिकाः । कन्यकाः श्रावयामास श्रीस्वामिकवचं
    तदा ॥ ४८॥ त्रिराचम्य हरिं ध्यात्वा प्राणानायम्य त्रिस्तथा । मस्तके मे हरेरस्तु मस्तकं च मुखे मुखम्
    ॥ ४९॥ नेत्रयोर्मेऽस्य नेत्रे स्तां श्रवसोर्मेऽस्य वै श्रवौ । मम कण्ठे हरेः कण्ठो हस्तयोर्मे हरेः करौ
    ॥ ५०॥ वक्षसि स्तनयोर्मे च हरेर्वक्षःस्तनौ तथा । उदरे मे हरेरस्तूदरं कट्यां हरेः कटिः ॥ ५१॥ पृष्ठे
    पृष्ठं नितम्बयोर्मे नितम्बौ हरेस्तथा । गुप्ते गुप्तं तथा सक्थ्नोः सक्थिनी पादयोः पदे ॥ ५२॥ सर्वा मूर्तिर्हरेरस्तु
    मयि सर्वाङ्गमूर्तिके । इति न्यासान् विधायैव स्वामिकवचमुच्चरेत् ॥ ५३॥ ॐ अनादिश्रीकृष्णनारायणः सर्वप्रहेतिमान्
    । दिव्यविमानमारूढः सर्वरक्षां करोतु नः ॥ ५४॥ शङ्खचक्रगदापद्मचर्मासिचापपाशवान् । धनुस्त्रिशूलशरवान्
    शस्त्रेभ्योऽवतु नो हरिः ॥ ५५॥ व्योम्नि दिव्यक्रमोऽव्यान्नोऽनले कृष्णनरायणः । वायौ प्राणपतिः पायाज्जले
    स्वामी परात्परः ॥ ५६॥ पृथ्व्यामव्याद्बालकृष्णो युद्धेऽव्यात्पुरुषोत्तमः । शस्त्रास्त्रमन्त्रपातेभ्योऽव्यान्नः
    पतिः फलस्थितः ॥ ५७॥ इन्द्रजालादिमायाभ्योऽन्तरात्माऽव्यात् श्रियः पतिः । प्रियस्वामी कृष्णनारायणोऽव्यात्कालवेगतः
    ॥ ५८॥ राक्षसीभ्यः कृष्णकान्तश्चाव्यादनवधानतः । मृत्युरोगाऽचिन्त्यभीभ्यः पातु न कृष्णवल्लभः ॥ ५९॥ भौतिकेभ्यो
    विकारेभ्यः पातु नोऽक्षरधामपः । सर्वावस्थासु सर्वेभ्यः पातु त्वन्तरगः प्रभुः ॥ ६०॥ संहर राक्षसीसैन्यं
    रक्षय कन्यकाकुलम् । आनन्दय ततो नश्च जयं देहि परेश्वर ॥ ६१॥ ओमनादिकृष्णनारायणोऽस्य देवताऽवतु । लोमशाय
    नमः स्वामिकवचस्यर्षये सदा ॥ ६२॥ कम्भराश्रीमहालक्ष्म्यै रक्षाकर्त्र्यै नमोऽवतु । नारायणाय गोपालकृष्णाय
    च नमोऽवतु ॥ ६३॥ इत्युच्चावितमेवैतत्कवचं कोटिरूपधृक । क्षणादजायत कोटिसूर्यवर्तुलमुज्ज्वलम् ॥ ६४॥ कन्यास्ता
    धारयामासू राधिके च त्वया सह । मञ्जुला पार्वती लक्ष्मीः प्रभा हंसा च माणिकी ॥ ६५॥ कोटिकोट्यः स्वर्णवर्णं
    दध्युस्तच्छेदवर्जितम् । अवृणं चाऽवियुक्तं च वर्म वर्ष्मसु पूरितम् ॥ ६६॥ कोमलं निष्ठुरं चापि सुखस्पर्शं
    च रक्षकम् । धृत्वा जलेन साकं च शस्त्रास्त्रमन्त्रकान् पपुः ॥ ६७॥ कन्यकावर्ममन्त्राढ्या युगपत् कृपयाऽभवन्
    ।
