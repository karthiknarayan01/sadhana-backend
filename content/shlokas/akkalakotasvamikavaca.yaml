id: akkalakotasvamikavaca
category: kavacha
name:
  english: akkalakotasvamikavaca
  devanagari: अक्कलकोटस्वामीकवच
content:
  english: shriakkalakotasvamikavacamstotram om | asya shri svami kavaca stotramamtrasya | suvrata rishih
    | anushtup chamdah | svami samartha devata | shankararaje shaktih | baḻappa kilakam | mama sakalabhishtapraptyartham
    pathe viniyogah | | atha karanyasah | om hram angushthabhyam namah || om hrim tarjanibhyam namah ||
    om hrum madhyamabhyam namah || om hraim anamikabhyam namah || om hraum kanishthikabhyam namah || om
    hrah karatalakaraprishthabhyam namah || || atha shadanganyasah || om hram hridayaya namah || om hrim
    shirase svaha || om hrum shikhayai vashat || om hraim kavacaya hum || om hraum netratrayaya vaushat
    || om hrah astraya phat || || atha dhyanam || bhumanamdam sahajasukhadam kevalam brahmamurtim | vishvatitam
    vimalahridayam vedavedanta vedyam || 1|| shantam dantam saralamanasam sarvasamarthyarupam | m sarvatitam
    hyamaramacalam svaminam tam namami || 2|| om shirsham me patu svami vai | bhalam netre ca sadguruh
    || 1|| kantham mukhanca patu me | svamisamartha deshikah || 2|| skandhau me patu svami vai | bahu
    patu tu sadguruh || 3|| karau me patu svami ca | angulayashca deshikah || 4|| prajnaprakaravasi vai
    | hridayam patu me sada || 5|| urah sthalanca svami vai | katim madhyam hi sadguruh || 6|| nabhim
    janghe ca svami vai | guhyam patu ca deshikah || 7|| uru janu samarthashca | padau svami ca patu me
    || 8|| deham manashca prajnanca | prajnapurasthitah sada || 9|| dashadikshu sa patu mam | svamisamartha
    sadguruh || 10|| utpatantrividhannityam | nashtan kurvantu sadguruh || 11|| samkatanadhivyadhimshca
    | nashyantu deshikah sada || 12|| nanapidamshca badhamshca jaramaranayatanah | pratikulyadivighnamshca
    nashyantu sadguruh sada || 13|| bhutapretapishacamshca vetalabrahmarakshasan | shakinidakinyadimshca
    nashyantu svamisamarthah || 14|| mahapapamshca ghoramshca brahmahatyadidurdharan | samulanpatakannityam
    nashyantu sadgurustatha || 15|| svami samartha tejashca rakshatu manca sarvada | bhutva tatkavacam
    me ca abhedyam tatbhavetsada || 16|| vajrakavacamidam vai ca yah pathedbhaktimannarah | tirtva ca
    samkatanghoran sarvatah sukhamapnuyat || 17|| pratidinam pathedyo bhakto bhavapuritacittatah | samsarasagaram
    tirtva bhuktim muktinca vindati || 18|| sadhako yo yadicchecca gurubhakto hi vartate | prasanno tasminhi
    bhutva ca kripalurbhavati shighratah || 19|| svamisamarthaprasadashca kavacam janayed budhah || sacchishyaya
    bhaktaya datavyam na ca karhicit || 20|| atidivyam kavacam shreshtham dattam me svamina'dhuna | aham
    dadami shishyaya prakashaya priyaya ca || 21|| idam kavacam tasmai vai shubham karoti sarvada | sarvesham
    mamgalam bhuyat divyam kavacameva ca || 22|| sadiccham prakatikritva samapanam karomyaham | nattva
    svamisamartham ca namami shridharam gurum || 23|| prakashasya nimittena prakashitamidam stavah | tarhi
    tatprati cashimshca dadami ca punah punah || 24|| akkalakotavasi ca svamisamartha sadguruh | bhuyat
    sarvamamgalyam sarveshamiti prarthaye || 25|| || iti suvrataviracitam svamisamarthavajrakavacam samaptam
    ||
  devanagari: श्रीअक्कलकोटस्वामीकवचम्स्तोत्रम् ॐ । अस्य श्री स्वामी कवच स्तोत्रमंत्रस्य । सुव्रत ऋषिः
    । अनुष्टुप् छंदः । स्वामी समर्थ देवता । शङ्करराजे शक्तिः । बाळाप्पा कीलकम् । मम सकलाभीष्टप्राप्त्यर्थं
    पाठे विनियोगः । । अथ करन्यासः । ॐ ह्रां अङ्गुष्ठाभ्यां नमः ॥ ॐ ह्रीं तर्जनीभ्यां नमः ॥ ॐ ह्रूं मध्यमाभ्यां
    नमः ॥ ॐ ह्रैं अनामिकाभ्यां नमः ॥ ॐ ह्रौं कनिष्ठिकाभ्यां नमः ॥ ॐ ह्रः करतलकरपृष्ठाभ्यां नमः ॥ ॥ अथ
    षडङ्गन्यासः ॥ ॐ ह्रां हृदयाय नमः ॥ ॐ ह्रीं शिरसे स्वाहा ॥ ॐ ह्रूं शिखायै वषट् ॥ ॐ ह्रैं कवचाय हुं
    ॥ ॐ ह्रौं नेत्रत्रयाय वौषट् ॥ ॐ ह्रः अस्त्राय फट् ॥ ॥ अथ ध्यानम् ॥ भूमानंदं सहजसुखदं केवलं ब्रह्ममूर्तिम्
    । विश्वातीतं विमलहृदयं वेदवेदान्त वेद्यम् ॥ १॥ शान्तं दान्तं सरलमनसं सर्वसामर्थ्यरूपम् । ं सर्वातीतं
    ह्यमरमचलं स्वामिनं तं नमामि ॥ २॥ ॐ शीर्षं मे पातु स्वामी वै । भालं नेत्रे च सद्गुरुः ॥ १॥ कण्ठं मुखञ्च
    पातु मे । स्वामीसमर्थ देशिकः ॥ २॥ स्कन्धौ मे पातु स्वामी वै । बाहू पातु तु सद्गुरुः ॥ ३॥ करौ मे पातु
    स्वामी च । अङ्गुलयश्च देशिकः ॥ ४॥ प्रज्ञाप्राकारवासी वै । हृदयं पातु मे सदा ॥ ५॥ उरः स्थलञ्च स्वामी
    वै । कटिं मध्यं हि सद्गुरुः ॥ ६॥ नाभिं जङ्घे च स्वामी वै । गुह्यं पातु च देशिकः ॥ ७॥ ऊरू जानु समर्थश्च
    । पादौ स्वामी च पातु मे ॥ ८॥ देहं मनश्च प्रज्ञाञ्च । प्रज्ञापुरस्थितः सदा ॥ ९॥ दशदिक्षु स पातु मां
    । स्वामीसमर्थ सद्गुरुः ॥ १०॥ उत्पातान्त्रिविधान्नित्यं । नष्टान् कुर्वन्तु सद्गुरुः ॥ ११॥ संकटानाधिव्याधींश्च
    । नश्यन्तु देशिकः सदा ॥ १२॥ नानापीडांश्च बाधांश्च जरामरणयातनाः । प्रातिकूल्यादिविघ्नांश्च नश्यन्तु
    सद्गुरुः सदा ॥ १३॥ भूतप्रेतपिशाचांश्च वेतालब्रह्मराक्षसान् । शाकिनिडाकिन्यादींश्च नश्यन्तु स्वामीसमर्थः
    ॥ १४॥ महापापांश्च घोरांश्च ब्रह्महत्यादिदुर्धरान् । समूलान्पातकान्नित्यं नश्यन्तु सद्गुरुस्तथा ॥ १५॥
    स्वामी समर्थ तेजश्च रक्षतु माञ्च सर्वदा । भूत्वा तत्कवचं मे च अभेद्यं तत्भवेत्सदा ॥ १६॥ वज्रकवचमिदं
    वै च यः पठेद्भक्तिमान्नरः । तीर्त्वा च संकटान्घोरान् सर्वतः सुखमाप्नुयात् ॥ १७॥ प्रतिदिनं पठेद्यो
    भक्तो भावपूरितचित्ततः । संसारसागरं तीर्त्वा भुक्तिं मुक्तिञ्च विन्दति ॥ १८॥ साधको यो यदिच्छेच्च गुरुभक्तो
    हि वर्तते । प्रसन्नो तस्मिन्हि भूत्वा च कृपालुर्भवति शीघ्रतः ॥ १९॥ स्वामीसमर्थप्रसादश्च कवचं जानयेद्
    बुधः ॥ सच्छिष्याय भक्ताय दातव्यं न च कर्हिचित् ॥ २०॥ अतिदिव्यं कवचं श्रेष्ठं दत्तं मे स्वामिनाऽधुना
    । अहं ददामि शिष्याय प्रकाशाय प्रियाय च ॥ २१॥ इदं कवचं तस्मै वै शुभं करोति सर्वदा । सर्वेषां मंगलं
    भूयात् दिव्यं कवचमेव च ॥ २२॥ सदिच्छां प्रकटीकृत्वा समापनं करोम्यहम् । नत्त्वा स्वामीसमर्थं च नमामि
    श्रीधरं गुरुम् ॥ २३॥ प्रकाशस्य निमित्तेन प्रकाशितमिदं स्तवः । तर्हि तत्प्रति चाशींश्च ददामि च पुनः
    पुनः ॥ २४॥ अक्कलकोटवासी च स्वामीसमर्थ सद्गुरुः । भूयात् सर्वमांगल्यं सर्वेषामिति प्रार्थये ॥ २५॥ ॥
    इति सुव्रतविरचितं स्वामीसमर्थवज्रकवचं समाप्तम् ॥
