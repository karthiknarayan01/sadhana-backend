id: candrashekharendrasarasvatistuti
category: stotram
name:
  english: candrashekharendrasarasvatistuti
  devanagari: चन्द्रशेखरेन्द्रसरस्वतिस्तुति
content:
  english: shricandrashekharendrasarasvatistuti shrutismritipuranoktadharmamargaratam gurum | bhaktanam
    hitavaktaram namaste cittashuddhaye || 1|| advaitanandabharitam sadhunamupakarinam | sarvashastravidam
    shantam namaste cittashuddhaye || 2|| dharmabhaktijnanamargapracare baddhakankanam | anugrahapradataram
    namaste cittashuddhaye || 3|| bhagavatpadapadabjaviniveshitacetasah | shricandrashekharaguroh prasado
    mayi jayatam || 4|| kshetratirthakathabhijnah saccidanandavigrahah | candrashekharavaryo me sannidhatta
    sada hridi || 5|| poshane vedashastranam dattacittamaharnisham | kshetrayatraratam vande sadgurum
    candrashekharam || 6|| vedajnan vedabhashyajnan kartum yasya samudyamah | gururyasya mahadevah tam
    vande candrashekharam || 7|| manivacakagodadi bhaktivagamritairbhrisham | balanam bhagavadbhaktim
    vardhayamtam gurum bhaje || 8|| laghupadeshairnastikyabhavamardana kovidam | shivam smitamukham shantam
    pranato'smi jagadgurum || 9|| vinayena prarthaye'ham vidyam bodhaya me guro | margamanyam na jane'ham
    bhavantam sharanam gatah || 10|| iti shri vijayendrasarasvati racitam shri candrashekharendra sarasvati
    stuti sampurnam||
  devanagari: श्रीचन्द्रशेखरेन्द्रसरस्वतीस्तुती श्रुतिस्मृतिपुराणोक्तधर्ममार्गरतं गुरुम् । भक्तानां हितवक्तारं
    नमस्ते चित्तशुद्धये ॥ १॥ अद्वैतानन्दभरितं साधूनामुपकारिणम् । सर्वशास्त्रविदं शान्तं नमस्ते चित्तशुद्धये
    ॥ २॥ धर्मभक्तिज्ञानमार्गप्रचारे बद्धकङ्कणम् । अनुग्रहप्रदातारं नमस्ते चित्तशुद्धये ॥ ३॥ भगवत्पादपादाब्जविनिवेशितचेतसः
    । श्रीचन्द्रशेखरगुरोः प्रसादो मयि जायताम् ॥ ४॥ क्षेत्रतीर्थकथाभिज्ञः सच्चिदानन्दविग्रहः । चन्द्रशेखरवर्यो
    मे सन्निधत्ता सदा हृदि ॥ ५॥ पोषणे वेदशास्त्राणां दत्तचित्तमहर्निशम् । क्षेत्रयात्रारतं वन्दे सद्गुरुं
    चन्द्रशेखरम् ॥ ६॥ वेदज्ञान् वेदभाष्यज्ञान् कर्तुं यस्य समुद्यमः । गुरुर्यस्य महादेवः तं वन्दे चन्द्रशेखरम्
    ॥ ७॥ मणिवाचकगोदादि भक्तिवागमृतैर्भृशम् । बालानां भगवद्भक्तिं वर्धयंतं गुरुं भजे ॥ ८॥ लघूपदेशैर्नास्तिक्यभावमर्दन
    कोविदम् । शिवं स्मितमुखं शान्तं प्रणतोऽस्मि जगद्गुरुम् ॥ ९॥ विनयेन प्रार्थयेऽहं विद्यां बोधय मे गुरो
    । मार्गमन्यं न जानेऽहं भवन्तं शरणं गतः ॥ १०॥ इति श्री विजयेन्द्रसरस्वति रचितम् श्री चन्द्रशेखरेन्द्र
    सरस्वती स्तुति सम्पूर्णम्॥
