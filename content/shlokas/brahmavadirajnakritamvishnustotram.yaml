id: brahmavadirajnakritamvishnustotram
category: stotram
name:
  english: brahmavadirajnakritamvishnustotram
  devanagari: ब्रह्मवादीराज्नाकृतंविष्णुस्तोत्रम्
content:
  english: rajovaca | ksharaksharam kshirasamudrashayinam kshitidharam murtimatam param padam | atindriyam
    vishvabhujam purah kritam nirakritam staumi janardanam prabhum || 31|| tvamadidevah paramartharupi
    vibhuh puranah purushottamashca | atindriyo vedavidam pradhanah prapahi mam shankhagadastrapane ||
    32|| kritam tvaya deva surasuranam sankirtyate'sau ca anantamurte | srishtyarthametattava deva vishno
    na ceshtitam kutagatasya tatsyat || 33|| tathaiva kurmatvamrigatvamuccaistvaya kritam rupamanekarupa
    | sarvajnabhavadasakricca janma sankirttyate te'cyuta naitadasti || 34|| nrisimha namo vamana jamadagninama
    dashasyagotrantaka vasudeva | namo'stu te buddha kalkin khagesha shambho namaste vibudharinashana
    || 35|| namo'stu narayana padmanabha namo namaste purushottamaya | namah samastamarasanghapujya namo'stu
    te sarvavidam pradhana || 36|| namah karalasya nrisimhamurtte namo vishaladrisamana kurma | namah
    samudrapratimana matsya namami tvam krodarupinnananta || 37|| srishtyarthametat tava deva ceshtitam
    na mukhyapakshe tava murttita vibho | ajanata dhyanamidam prakashitam naibhirvina lakshyase tvam purana
    || 38|| adyo makhastvam svayameva vishno makhangabhuto'si havistvameva | pashurbhavan ritvigijyam
    tvameva tvam devasangha munayo yajanti || 39|| yadetasmin jagaddhruvam calacalam suradikalanalasamsthamuttamam
    | na tvam vibhakto'si janardanesha prayaccha siddhim hridayepsitam me || 40|| namah kamalapatraksha
    murttamurtta namo hare | sharanam tvam prapanno'smi samsaranmam samuddhara || 41|| iti varahapurane
    pancapancashattamadhyayantargatam
  devanagari: राजोवाच । क्षराक्षरं क्षीरसमुद्रशायिनं क्षितीधरं मूर्तिमतां परं पदम् । अतीन्द्रियं विश्वभुजां
    पुरः कृतं निराकृतं स्तौमि जनार्दनं प्रभुम् ॥ ३१॥ त्वमादिदेवः परमार्थरूपी विभुः पुराणः पुरुषोत्तमश्च
    । अतीन्द्रियो वेदविदां प्रधानः प्रपाहि मां शङ्खगदास्त्रपाणे ॥ ३२॥ कृतं त्वया देव सुरासुराणां सङ्कीर्त्यतेऽसौ
    च अनन्तमूर्ते । सृष्ट्यर्थमेतत्तव देव विष्णो न चेष्टितं कूटगतस्य तत्स्यात् ॥ ३३॥ तथैव कूर्मत्वमृगत्वमुच्चैस्त्वया
    कृतं रूपमनेकरूप । सर्वज्ञभावादसकृच्च जन्म सङ्कीर्त्त्यते तेऽच्युत नैतदस्ति ॥ ३४॥ नृसिंह नमो वामन जमदग्निनाम
    दशास्यगोत्रान्तक वासुदेव । नमोऽस्तु ते बुद्ध कल्किन् खगेश शम्भो नमस्ते विबुधारिनाशन ॥ ३५॥ नमोऽस्तु
    नारायण पद्मनाभ नमो नमस्ते पुरुषोत्तमाय । नमः समस्तामरसङ्घपूज्य नमोऽस्तु ते सर्वविदां प्रधान ॥ ३६॥
    नमः करालास्य नृसिंहमूर्त्ते नमो विशालाद्रिसमान कूर्म । नमः समुद्रप्रतिमान मत्स्य नमामि त्वां क्रोडरूपिन्ननन्त
    ॥ ३७॥ सृष्ट्यर्थमेतत् तव देव चेष्टितं न मुख्यपक्षे तव मूर्त्तिता विभो । अजानता ध्यानमिदं प्रकाशितं
    नैभिर्विना लक्ष्यसे त्वं पुराण ॥ ३८॥ आद्यो मखस्त्वं स्वयमेव विष्णो मखाङ्गभूतोऽसि हविस्त्वमेव । पशुर्भवान्
    ऋत्विगिज्यं त्वमेव त्वां देवसङ्घा मुनयो यजन्ति ॥ ३९॥ यदेतस्मिन् जगद्ध्रुवं चलाचलं सुरादिकालानलसंस्थमुत्तमम्
    । न त्वं विभक्तोऽसि जनार्दनेश प्रयच्छ सिद्धिं हृदयेप्सितां मे ॥ ४०॥ नमः कमलपत्राक्ष मूर्त्तामूर्त्त
    नमो हरे । शरणं त्वां प्रपन्नोऽस्मि संसारान्मां समुद्धर ॥ ४१॥ इति वराहपुराणे पञ्चपञ्चाशत्तमाध्यायान्तर्गतं
