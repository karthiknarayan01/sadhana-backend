id: vairagyashatakam-2
category: shataka
name:
  english: vairagyashatakam 2
  devanagari: वैराग्यशतकम् २
content:
  english: '|| shrih || aste kashcana bhikshuh sangrihnannavyayani dasha | na mametyavyayayugalam yacamastam
    kimastyanyat || 1|| dhisacivam dhairyabalam sankalpavirodhi shantidhanam | vishvatrayavishayamidam
    vairagyam nama samrajyam || 2|| rajno bibhyati loka rajanah punarito''pi vairibhyah | a brahmanah
    kritantadakutobhayamaspriharajyam || 3|| bhikshaprada jananyah pitaro guravah kumarakah shishyah |
    ekantaramanahetuh shantirdayita viraktasya || 4|| kimapi na ye ceshtante karyapratikaryayorvirahat
    | santasta eva muktah sandehe gautamah sakshi || 5|| patatu nabhah sphutatu mahi calantu girayo milantu
    varidhayah | adharottaramastu jagatka hanirvitaragasya || 6|| ke corah ke pishunah ke ripavah ke ca
    dayadah | jagadakhilam tasya vashe yasya vashe hatamidam cetah || 7|| vishaya upatishthantam vishayairva
    samavayantu karanani | antaramekam karanam shantam yadi ka tatashcinta || 8|| kim vishayanparihartum
    vastavyam merukandareshvabudhaih | na hyadbhiranasaktum pamsushu rohanti padmani || 9|| ajnanamiha
    nidanam pragrupam jananameva bhavaroge | paripakah samsaranam bhaishajyam naishthiki shantih || 10||
    svenaiva bhuktamartham sukarajatismaro manushya iva | dure jugupsamano dhiro vairagyamadriyate ||
    11|| shaishavamiva kaumare tattarunimniva sa iva vriddhatve | na svadate dhiranam kamasya viceshtitam
    shantau || 12|| shatashah parikshya vishayansadyo jahati kacitkvaciddhanyah | kaka iva vantashanamanye
    taneva sevante || 13|| caramau matapitarau carama grihini sutashcaramah | kartavye''tipremani kathamiha
    dhira virajyante || 14|| trinavaddhamanti capalah strinamani candamarute calite | dharanidhara iva
    santastatra na kincitprakampante || 15|| kamijanaparamabhogye kamasukhe dharayanti bibhatsam | santah
    shamasukharasikah sudhashanah sukaranna iva || 16|| vikshepamatrabhajo vikasakashthagata jnanah |
    svasyapi ceshtitani svayamikshante parasyeva || 17|| asthane''bhinivishtanmurkhanasthana eva santushtan
    | anuvartante dhirah pitara iva kridato balan || 18|| pushnati purushe salilairmushnati pushpam phalam
    ca tarava iva | vartante santah samamupakartari capakartari ca || 19|| nityanityavivekah sarvesham
    ghataghatatvayoraste | sa viveko yah shantikridaviveko''nyah samasto''pi || anadhigate kamasukhe kalena
    yatha pravartate tarunah | evam brahmasukhe''pi pravartate ko''pi bhagyavashat || 21|| putragunah
    svatantrye daragunashcadhivedanavasare | bhratriguna dayavidhau drashtavya mokshyamanena || 22|| ka
    me gatiriti pricchati caramashvase''pi yah svartham || tasya janasyapi krite papah papani kurvanti
    || 23|| pitribhih kalahayante putranadhyapayanti pitribhaktim | paradaranupayantah pathanti shastrani
    dareshu || 24|| shantiralabhyaduparatirapatrabhavah pratigrahanivrittih | kshantirdurbalateti ca nivrittidharmah
    kalavete || 25|| nitijna niyatijna vedajna api bhavanti shastrajnah | brahmajna api labhyah svajnanajnanino
    viralah || 26|| kalikalushe manasi sve kathamiva jagadarjavam labhatam | cakshurdoshe jagrati candram
    dvitvam kuto yatu || 27|| vishayananukulayitum vishayini hridaye vidhiyatam yatnah | drishi deyamaushadham
    ko drishye dattva kriti bhavati || 28|| darah putreshu ratah putrah pitridhanaparigrahavyagrah | rodanasharana
    janani paralokagatasya ko bandhuh || 29|| pashyanti mriyamananmarishyato''numimate smaranti mritan
    || kathayanti caivamasakricceshtante nityavattu param || 30|| kalahayante mudhah kah pratibhuh shvah
    prabhata iti || tasyameva rajanyam kah pratibhuh svasya sattayam || 31|| aprapadamashiraspadamantah
    kalimalamalimase vapushi | viphalam gangajalamapi madyaghate darbhamushtiriva || 32|| dandyam yatsukhahetoh
    pushnanti janah katham tadeva vapuh | na hi sharkarabhilashibhirikshoh kandani pujyante || 33|| kulyah
    krita vishalah kudyanyupalairnibaddhani | krita balino mahishah kritakrityah sma iti manyante || 34||
    prayo muhyati cetah pranabhritah prananirgamavasare | punyena yadi na muhyati putraneva smaranmriyate
    || 35|| shamayitumaudaramagnim samsare sagare nimajjanti | tuhinavyathanivrittyai na hi veshmani pavako
    deyah || 36|| arthanamadhikanam rajna corena va dhruvo nashah | anne khalvatibhukte vamanam va syadvireko
    va || 37|| ahritya parityakta janayantyarthah sukhabhasam | atyantaparityaktah paramanandaya kalpante
    || 38|| pranamati parisantvayati pralapati yacati paribhramati | avishta iva pishacya purushastrishnavasham
    yatah || 39|| jananadrishtatpitarau putra jamataro vyayadrishtat | kalahadrishtajjnataya iti nirnite
    kimeshtavyam || 40|| svapituh paralokaya svayamanudivasam yadacarati | kriyatamidamupamanam kim nalam
    putravairagye || 41|| ananugate daridrye kimanugatam lakshanam drishtam | kamasyaparipurtau kripanam
    jagada caturvadanat || 42|| na khalu dhanatvam jatiryasya yadishtam tadeva tasya dhanam | tattadiva
    pamaranamakincanyam dhanam vidusham || 43|| svikriyate yadi trishna svikartavyam jagatsamastamapi
    | svikriyate yadi shantih svatmapi svasya bhavati na va || 44|| yaddataram vashayati yatparijanamasya
    santvayati | yadapatrapate nantarbhavi labhah sa kasya samah || 45|| pradeshamatramudaram paripurayitum
    kiyanayam yatnah | culakenambhah patum khanitavyah kim tadago''pi || 46|| yamardhamasamskaradyamadvayamanashanacca
    suvyakte | sharire saundarye''bhinivishante kiyanmudhah || 47|| vandhyetyahustarunim jaratiti parityajanti
    bahuputram | api nindantyalpasutam ka grihini kaminam hridya || 48|| yanti shucamakritadara dve bharye
    neti kritadarah | te paradara neti stribhistritanna pashyamah || 49|| madanasyajnakarane manye jagadakhilamekarupamidam
    | tiryanca iti nara iti deva ityanyato bhedah || 50|| shuklavimokasthanam malamutratyagadeshavatkimapi
    | striya iti vidhina vihitam kiyadatra jana nimajjanti || vedanadhitya vidhivanmimamsitva tadartham
    ca | darah kartavya iti kenedam prahasanam kathitam || 52|| duhkhenoparjyante palyante pratyaham ca
    lalyante | vamah striyo vimudherupabhunjanah sukham dvigunam || 53|| ashnita pibata khadata jagrita
    samvishata calata tishthata va | sakridapi cintayatantah savadhiko dehabandha iti || 54| || kim vijitaya
    prithivya kim kancanabhubhrita karasthena | kim divyabhih stribhirmartavye brahmana likhite || 55||
    jivati katicinnimishankaticitteshu shrutiradhita iva | tavatyevakulayati tantrani navani catanute
    || 56|| svalpo jivanakalah svalpa dhih paricayah svalpah | tadapi tarema kathancicchrutayo yadi nopajayante
    || 57|| kuta agatam na jane kva nu va gantavyamidamapi na jane | sancarasi kvedanim samsarapathe mahatamasi
    || 58|| tamasavritashcarantah savidhe dure ca navayantyarthan | avayanti tu vispashtam taditi shirasyabhihate
    mudhah || 59|| nimishantyatra tarunyastatra tarunyo na nimishanti | idriksho hi visheshah svargah
    svarga iti kim tatra || 60|| kopo maitravaruneh shapo va tarkikasya muneh | samsmaryate yadi sakricchatrorapi
    mastu shakrapadam || 61|| gacchatvamaravatyam gacchatu caturananasya va nagare | punaragantavyam yadi
    pumsa kim sadhitam bhavati || 62|| bhukta bahavo dara labdhah putrashca pautrashca | nitam shatamapyayuh
    satyam vada martumasti manah || 63|| vishleshanasvabhavanvishayanpashyankaroti ko mamatam | nashyavasthapannam
    kah krinite dhanairashvam || 64|| annabhave mrityuh shalibhirannani shalayo vrishtaya | vrishtistapaseti
    vadannamrityave tattapashcaratu || 65|| kim na nigrihanti manah kim na bhajante janah shivam sharanam
    | abhisandhibhedamatranmokshopayena badhyante || 66|| bhogaya pamaranam yogaya vivekinam shariramidam
    | bhogaya ca yogaya ca na kalpate durvidagdhanam || 67|| brahmanacandala ityaha manuryanmahapathikan
    | bhavamargamahapathikanadhikrityaiva pravrittam tat || 68|| ekadvah kshitipatishu dvitra deveshu
    pancasha druhine | etavanto jagati brahmanandarnavasya kanah || 69|| ajnanenapihite vijnane karma
    kim kurute | vikale cakshushi tamasa vyadaya mukham kimeksheta || 70|| atikalushamashunashvaramapatasphuranamanabhilapakaram
    | api hrishyanti janah kathamavalambya jnanakhadyotam || 71|| prayutam niyutam vapi pradishanti prakritaya
    bhogaya | krinanti na bilvadalaih kaivalyam pancashairmudhah || 72|| yavatkila ceshtante tavatpashena
    badhyate granthih | nibhritam yadi vartante kalena sramsate pashah || 73|| uparundhanti shvasanmunayo
    nashnanti na pibanti | stuyante kim munayah kanthe kurvanti kanakapashamime || 74|| kamam janah smayante
    kailasavilasavarnanavasare | sadhanakathanavasare sacikurvanti vakrani || 75|| vangah kathamangah
    kathamityanuyunkte vritha deshan | kidrikkritantapuramiti ko''pi na jijnasate lokah || 76|| tyaktavyo
    mamakarastyaktum yadi shakyate nasau | kartavyo mamakarah kim tu sa sarvatra kartavyah || 77|| putra
    iti dara iti poshyanmurkho bahirjananbrute | andhe tamasi nimanjanatma poshya iti navaiti || 78||
    yancintitamadhigarbham yanca ciram cintitam narake | vishayanilasamsarganmamrije tatsarvamekapade
    || 79|| bahyagatagatashila pranasya shvasalakshana vrittih | karshati manaso vrittim kulateva kulastriyam
    mugdham || 80|| atigambhiramanavilamakshobhyamadrishtaparamavilanghayam | aviralatarangasankulamaikshishi
    vijnanasagaram mahatam || 89|| ghoram bhavamapahatum katicidaghoram bhavam prapadyante | samsaranakataranam
    samsaranam shambhavi bhaktih || 82|| pasho yadi moktavyah pashupatirevanusartavyah | na khalu vyatimucyante
    pashavah pashena sambaddhah || 83|| alamalamanubhutabhirmatribhiralamastu pitribhishca | bhavitavyam
    yadi nityavadardham matuh pitushcastu || 84|| dhanyaste bahudevah svamini yesham na durbhiksham |
    jatu na janimo vayamekamapi svaminam purnam || 85|| santu brihanto devah kim tu na tannantumihate
    cetah | adhyavadanyanyayadantakajitameva cintayate || 86|| nidhyayasi vishayasukham na dhyayasi vishamamasya
    paripakam | bandhum tameva cintaya banddhum moktum ca yah kshamate || 87|| sadanam gurupasadanam caranam
    pancaksharipurashcaranam | dhanamabhilashanirodhanamatyashramavartinam pumsam || 88|| sa vidhiryatte
    vidadhati sa pratishedho yato nivartante | sopanishadyadbruvate shaivashramavartino dhirah || 89||
    kau pitarau yau jagatam kah svami yah prapancamya | pratyastamite bhede tatkimidam kimiti kah prashnah
    || 90|| tyaja samsaramasaram bhaja sharanam parvatiramanam | vishvasihi shrutishikharam vishvamidam
    tava nideshakaram || 91|| bhavyamabhavyam va nah pralikhatu vedhah sudurmedhah | savyamasavyam va
    nashcaranam sharanam maheshasya || 92|| vedhah katham harih kathamiti tu prashne vayam mukah | shivamekam
    janimastasmadanyam na janimah || 93|| darunamasipatravanam darunatamamandhatamisram | ka va tatah
    kshatirnah shaiva vayama caturvadanat || 94|| kritadiksho ghoramakhe kulakutastho bharadvajah | vidyeshvareshu
    kashcana pitamaho na iti visrambhah || 95|| kalahah kadapi mastviti kalitashariraikyayoh shivayoh
    | ahamasmyahamasmiti praptah kalaho mama trane || 96|| narakayapi na bhogannaradhamayapi nanyasuran
    | manyante katicidami maheshvaramashrita yogam || 97|| jnatum hatum vishayam shrotum mantum grahitumatmanam
    | vatsa yadi na hi ghatate tatsadhayatavimuktaya || 98|| sankhyam yogo niyama bhaktih karma prapattiriti
    | ekatra sakalametatkevalamavimuktamekatra || 99|| baddhah kaste vakshyati mukto muktim na janati
    | yasyasi cedavimuktam jnasyasi vishveshvarasya mukhat || 100|| na grahitam shrutihridayam na ca nigrihitam
    pariplavam hridayam | icchami ca dhama param gacchami ca vishvanathapuram || 101|| iti shrimadappayyadikshitaviracitam
    vairagyashatakam sampurnam || iti shrimadnarayanapanditadikshitaviracitam vairagyashatakam sampurnam
    ||'
  devanagari: ॥ श्रीः ॥ आस्ते कश्चन भिक्षुः सङ्गृह्णन्नव्ययानि दश । न ममेत्यव्यययुगलं याचामस्तं किमस्त्यन्यत्
    ॥ १॥ धीसचिवं धैर्यबलं सङ्कल्पविरोधि शान्तिधनम् । विश्वत्रयविषयमिदं वैराग्यं नाम साम्राज्यम् ॥ २॥ राज्ञो
    बिभ्यति लोका राजानः पुनरितोऽपि वैरिभ्यः । आ ब्रह्मणः कृतान्तादकुतोभयमस्पृहाराज्यम् ॥ ३॥ भिक्षाप्रदा
    जनन्यः पितरो गुरवः कुमारकाः शिष्याः । एकान्तरमणहेतुः शान्तिर्दयिता विरक्तस्य ॥ ४॥ किमपि न ये चेष्टन्ते
    कार्यप्रतिकार्ययोर्विरहात् । सन्तस्त एव मुक्ताः सन्देहे गौतमः साक्षी ॥ ५॥ पततु नभः स्फुटतु मही चलन्तु
    गिरयो मिलन्तु वारिधयः । अधरोत्तरमस्तु जगत्का हानिर्वीतरागस्य ॥ ६॥ के चोराः के पिशुनाः के रिपवः के
    च दायादाः । जगदखिलं तस्य वशे यस्य वशे हतमिदं चेतः ॥ ७॥ विषया उपतिष्ठन्तां विषयैर्वा समवयन्तु करणानि
    । आन्तरमेकं करणं शान्तं यदि का ततश्चिन्ता ॥ ८॥ किं विषयान्परिहर्तुं वस्तव्यं मेरुकन्दरेष्वबुधैः ।
    न ह्यद्भिरनासक्तुं पांसुषु रोहन्ति पद्मानि ॥ ९॥ अज्ञानमिह निदानं प्राग्रूपं जननमेव भवरोगे । परिपाकः
    संसरणं भैषज्यं नैष्ठिकी शान्तिः ॥ १०॥ स्वेनैव भुक्तमर्थं सूकरजातिस्मरो मनुष्य इव । दूरे जुगुप्समानो
    धीरो वैराग्यमाद्रियते ॥ ११॥ शैशवमिव कौमारे तत्तरुणिम्नीव स इव वृद्धत्वे । न स्वदते धीराणां कामस्य
    विचेष्टितं शान्तौ ॥ १२॥ शतशः परीक्ष्य विषयान्सद्यो जहति कचित्क्वचिद्धन्याः । काका इव वान्ताशनमन्ये
    तानेव सेवन्ते ॥ १३॥ चरमौ मातापितरौ चरमा गृहिणी सुताश्चरमाः । कर्तव्येऽतिप्रेमणि कथमिह धीरा विरज्यन्ते
    ॥ १४॥ तृणवद्धमन्ति चपलाः स्त्रीनामनि चण्डमारुते चलिते । धरणिधरा इव सन्तस्तत्र न किञ्चित्प्रकम्पन्ते
    ॥ १५॥ कामिजनपरमभोग्ये कामसुखे धारयन्ति बीभत्सम् । सन्तः शमसुखरसिकाः सुधाशनाः सूकरान्न इव ॥ १६॥ विक्षेपमात्रभाजो
    विकासकाष्ठागत ज्ञानाः । स्वस्यापि चेष्टितानि स्वयमीक्षन्ते परस्येव ॥ १७॥ अस्थानेऽभिनिविष्टान्मूर्खानस्थान
    एव सन्तुष्टान् । अनुवर्तन्ते धीराः पितर इव क्रीडतो बालान् ॥ १८॥ पुष्णति पुरुषे सलिलैर्मुष्णति पुष्पं
    फलं च तरव इव । वर्तन्ते सन्तः सममुपकर्तरि चापकर्तरि च ॥ १९॥ नित्यानित्यविवेकः सर्वेषां घटघटत्वयोरास्ते
    । स विवेको यः शान्तिकृदविवेकोऽन्यः समस्तोऽपि ॥ अनधिगते कामसुखे कालेन यथा प्रवर्तते तरुणः । एवं ब्रह्मसुखेऽपि
    प्रवर्तते कोऽपि भाग्यवशात् ॥ २१॥ पुत्रगुणाः स्वातन्त्र्ये दारगुणाश्चाधिवेदनावसरे । भ्रातृगुणा दायविधौ
    द्रष्टव्या मोक्ष्यमाणेन ॥ २२॥ का मे गतिरिति पृच्छति चरमश्वासेऽपि यः स्वार्थम् ॥ तस्य जनस्यापि कृते
    पापाः पापानि कुर्वन्ति ॥ २३॥ पितृभिः कलहायन्ते पुत्रानध्यापयन्ति पितृभक्तिम् । परदारानुपयन्तः पठन्ति
    शास्त्राणि दारेषु ॥ २४॥ शान्तिरलभ्यादुपरतिरपात्रभावः प्रतिग्रहनिवृत्तिः । क्षान्तिर्दुर्बलतेति च निवृत्तिधर्माः
    कलावेते ॥ २५॥ नीतिज्ञा नियतिज्ञा वेदज्ञा अपि भवन्ति शास्त्रज्ञाः । ब्रह्मज्ञा अपि लभ्याः स्वाज्ञानज्ञानिनो
    विरलाः ॥ २६॥ कलिकलुषे मनसि स्वे कथमिव जगदार्जवं लभताम् । चक्षुर्दोषे जाग्रति चान्द्रं द्वित्वं कुतो
    यातु ॥ २७॥ विषयाननुकूलयितुं विषयिणि हृदये विधीयतां यत्नः । दृशि देयमौषधं को दृश्ये दत्त्वा कृती भवति
    ॥ २८॥ दाराः पुत्रेषु रताः पुत्राः पितृधनपरिग्रहव्यग्राः । रोदनशरणा जननी परलोकगतस्य को बन्धुः ॥ २९॥
    पश्यन्ति म्रियमाणान्मरिष्यतोऽनुमिमते स्मरन्ति मृतान् ॥ कथयन्ति चैवमसकृच्चेष्टन्ते नित्यवत्तु परम्
    ॥ ३०॥ कलहायन्ते मूढाः कः प्रतिभूः श्वः प्रभात इति ॥ तस्यामेव रजन्यां कः प्रतिभूः स्वस्य सत्तायाम्
    ॥ ३१॥ आप्रपदमाशिरस्पदमन्तः कलिमलमलीमसे वपुषि । विफलं गङ्गाजलमपि मद्यघटे दर्भमुष्टिरिव ॥ ३२॥ दण्ड्यं
    यत्सुखहेतोः पुष्णन्ति जनाः कथं तदेव वपुः । न हि शर्कराभिलाषिभिरिक्षोः काण्डानि पूज्यन्ते ॥ ३३॥ कुल्याः
    कृता विशालाः कुड्यान्युपलैर्निबद्धानि । क्रीता बलिनो महिषाः कृतकृत्याः स्म इति मन्यन्ते ॥ ३४॥ प्रायो
    मुह्यति चेतः प्राणभृतः प्राणनिर्गमावसरे । पुण्येन यदि न मुह्यति पुत्रानेव स्मरन्म्रियते ॥ ३५॥ शमयितुमौदरमग्निं
    संसारे सागरे निमज्जन्ति । तुहिनव्यथानिवृत्त्यै न हि वेश्मनि पावको देयः ॥ ३६॥ अर्थानामधिकानां राज्ञा
    चोरेण वा ध्रुवो नाशः । अन्ने खल्वतिभुक्ते वमनं वा स्याद्विरेको वा ॥ ३७॥ आहृत्य परित्यक्ता जनयन्त्यर्थाः
    सुखाभासम् । अत्यन्तपरित्यक्ताः परमानन्दाय कल्पन्ते ॥ ३८॥ प्रणमति परिसान्त्वयति प्रलपति याचति परिभ्रमति
    । आविष्ट इव पिशाच्या पुरुषस्तृष्णावशं यातः ॥ ३९॥ जननादृष्टात्पितरौ पुत्रा जामातरो व्ययादृष्टात् ।
    कलहादृष्टाज्ज्ञातय इति निर्णीते किमेष्टव्यम् ॥ ४०॥ स्वपितुः परलोकाय स्वयमनुदिवसं यदाचरति । क्रियतामिदमुपमानं
    किं नालं पुत्रवैराग्ये ॥ ४१॥ अननुगते दारिद्र्ये किमनुगतं लक्षणं दृष्टम् । कामस्यापरिपूर्तौ कृपणं जगदा
    चतुर्वदनात् ॥ ४२॥ न खलु धनत्वं जातिर्यस्य यदिष्टं तदेव तस्य धनम् । तत्तदिव पामराणामाकिञ्चन्यं धनं
    विदुषाम् ॥ ४३॥ स्वीक्रियते यदि तृष्णा स्वीकर्तव्यं जगत्समस्तमपि । स्वीक्रियते यदि शान्तिः स्वात्मापि
    स्वस्य भवति न वा ॥ ४४॥ यद्दातारं वशयति यत्परिजनमस्य सान्त्वयति । यदपत्रपते नान्तर्भावी लाभः स कस्य
    समः ॥ ४५॥ प्रादेशमात्रमुदरं परिपूरयितुं कियानयं यत्नः । चुलकेनाम्भः पातुं खनितव्यः किं तडागोऽपि ॥
    ४६॥ यामार्धमसंस्काराद्यामद्वयमनशनाच्च सुव्यक्ते । शारीरे सौन्दर्येऽभिनिविशन्ते कियन्मूढाः ॥ ४७॥ वन्ध्येत्याहुस्तरुणीं
    जरतीति परित्यजन्ति बहुपुत्राम् । अपि निन्दन्त्यल्पसुतां का गृहिणी कामिनां हृद्या ॥ ४८॥ यान्ति शुचमकृतदारा
    द्वे भार्ये नेति कृतदाराः । ते परदारा नेति स्त्रीभिस्तृतान्न पश्यामः ॥ ४९॥ मदनस्याज्ञाकरणे मन्ये जगदखिलमेकरूपमिदम्
    । तिर्यञ्च इति नरा इति देवा इत्यन्यतो भेदः ॥ ५०॥ शुक्लविमोकस्थानं मलमूत्रत्यागदेशवत्किमपि । स्त्रिय
    इति विधिना विहितं कियदत्र जना निमज्जन्ति ॥ वेदानधीत्य विधिवन्मीमांसित्वा तदर्थं च । दाराः कर्तव्या
    इति केनेदं प्रहसनं कथितम् ॥ ५२॥ दुःखेनोपार्ज्यन्ते पाल्यन्ते प्रत्यहं च लाल्यन्ते । वामाः स्त्रियो
    विमूढेरुपभुञ्जानाः सुखं द्विगुणम् ॥ ५३॥ अश्नीत पिबत खादत जागृत संविशत चलत तिष्ठत वा । सकृदपि चिन्तयतान्तः
    सावधिको देहबन्ध इति ॥ ५४। ॥ किं विजितया पृथिव्या किं काञ्चनभूभृता करस्थेन । किं दिव्याभिः स्त्रीभिर्मर्तव्ये
    ब्रह्मणा लिखिते ॥ ५५॥ जीवति कतिचिन्निमिषान्कतिचित्तेषु श्रुतीरधीत इव । तावत्येवाकुलयति तन्त्राणि नवानि
    चातनुते ॥ ५६॥ स्वल्पो जीवनकालः स्वल्पा धीः परिचयः स्वल्पः । तदपि तरेम कथञ्चिच्छ्रूतयो यदि नोपजायन्ते
    ॥ ५७॥ कुत आगतं न जाने क्व नु वा गन्तव्यमिदमपि न जाने । सञ्चरसि क्वेदानीं संसारपथे महातमसि ॥ ५८॥ तमसावृताश्चरन्तः
    सविधे दूरे च नावयन्त्यर्थान् । अवयन्ति तु विस्पष्टं तदिति शिरस्यभिहते मूढाः ॥ ५९॥ निमिषन्त्यत्र तरुण्यस्तत्र
    तरुण्यो न निमिषन्ति । ईदृक्षो हि विशेषः स्वर्गः स्वर्ग इति किं तत्र ॥ ६०॥ कोपो मैत्रावरुणेः शापो वा
    तार्किकस्य मुनेः । संस्मर्यते यदि सकृच्छत्रोरपि मास्तु शक्रपदम् ॥ ६१॥ गच्छत्वमरावत्यां गच्छतु चतुराननस्य
    वा नगरे । पुनरागन्तव्यं यदि पुंसा किं साधितं भवति ॥ ६२॥ भुक्ता बहवो दारा लब्धाः पुत्राश्च पौत्राश्च
    । नीतं शतमप्यायुः सत्यं वद मर्तुमस्ति मनः ॥ ६३॥ विश्लेषणस्वभावान्विषयान्पश्यन्करोति को ममताम् । नश्यवस्थापन्नं
    कः क्रीणीते धनैरश्वम् ॥ ६४॥ अन्नाभावे मृत्युः शालिभिरन्नानि शालयो वृष्टया । वृष्टिस्तपसेति वदन्नमृत्यवे
    तत्तपश्चरतु ॥ ६५॥ किं न निगृहन्ति मनः किं न भजन्ते जनाः शिवं शरणम् । अभिसन्धिभेदमात्रान्मोक्षोपायेन
    बध्यन्ते ॥ ६६॥ भोगाय पामराणां योगाय विवेकिनां शरीरमिदम् । भोगाय च योगाय च न कल्पते दुर्विदग्धानाम्
    ॥ ६७॥ ब्राह्मणचण्डाला इत्याह मनुर्यन्महापथिकान् । भवमार्गमहापथिकानधिकृत्यैव प्रवृत्तं तत् ॥ ६८॥ एकद्वाः
    क्षितिपतिषु द्वित्रा देवेषु पञ्चषा द्रुहिणे । एतावन्तो जगति ब्रह्मानन्दार्णवस्य कणाः ॥ ६९॥ अज्ञानेनापिहिते
    विज्ञाने कर्म किं कुरुते । विकले चक्षुषि तमसा व्यादाय मुखं किमेक्षेत ॥ ७०॥ अतिकलुषमाशुनश्वरमापातस्फुरणमनभिलापकरम्
    । अपि हृष्यन्ति जनाः कथमवलम्ब्य ज्ञानखद्योतम् ॥ ७१॥ प्रयुतं नियुतं वापि प्रदिशन्ति प्राकृताय भोगाय
    । क्रीणन्ति न बिल्वदलैः कैवल्यं पञ्चषैर्मूढाः ॥ ७२॥ यावत्किल चेष्टन्ते तावत्पाशेन बध्यते ग्रन्थिः
    । निभृतं यदि वर्तन्ते कालेन स्रंसते पाशः ॥ ७३॥ उपरुन्धन्ति श्वासान्मुनयो नाश्नन्ति न पिबन्ति । स्तूयन्ते
    किं मुनयः कण्ठे कुर्वन्ति कनकपाशमिमे ॥ ७४॥ कामं जनाः स्मयन्ते कैलासविलासवर्णनावसरे । साधनकथनावसरे
    साचीकुर्वन्ति वक्राणि ॥ ७५॥ वङ्गाः कथमङ्गाः कथमित्यनुयुङ्क्ते वृथा देशान् । कीदृक्कृतान्तपुरमिति कोऽपि
    न जिज्ञासते लोकः ॥ ७६॥ त्यक्तव्यो ममकारस्त्यक्तुं यदि शक्यते नासौ । कर्तव्यो ममकारः किं तु स सर्वत्र
    कर्तव्यः ॥ ७७॥ पुत्रा इति दारा इति पोष्यान्मूर्खो बहिर्जनान्ब्रूते । अन्धे तमसि निमञ्जनात्मा पोष्य
    इति नावैति ॥ ७८॥ यञ्चिन्तितमधिगर्भं यञ्च चिरं चिन्तितं नरके । विषयानिलसंसर्गान्ममृजे तत्सर्वमेकपदे
    ॥ ७९॥ बाह्यगतागतशीला प्राणस्य श्वासलक्षणा वृत्तिः । कर्षति मनसो वृत्तिं कुलटेव कुलस्त्रियं मुग्धाम्
    ॥ ८०॥ अतिगम्भीरमनाविलमक्षोभ्यमदृष्टपारमविलङ्घयम् । अविरलतरङ्गसङ्कुलमैक्षिषि विज्ञानसागरं महताम् ॥
    ८९॥ घोरं भवमपहातुं कतिचिदघोरं भवं प्रपद्यन्ते । संसरणकातराणां संसरणं शाम्भवी भक्तिः ॥ ८२॥ पाशो यदि
    मोक्तव्यः पशुपतिरेवानुसर्तव्यः । न खलु व्यतिमुच्यन्ते पशवः पाशेन सम्बद्धाः ॥ ८३॥ अलमलमनुभूताभिर्मातृभिरलमस्तु
    पितृभिश्च । भवितव्यं यदि नित्यवदर्धं मातुः पितुश्चास्तु ॥ ८४॥ धन्यास्ते बहुदेवाः स्वामिनि येषां न
    दुर्भिक्षम् । जातु न जानीमो वयमेकमपि स्वामिनं पूर्णम् ॥ ८५॥ सन्तु बृहन्तो देवाः किं तु न तान्नन्तुमीहते
    चेतः । आढ्यवदान्यन्यायादन्तकजितमेव चिन्तयते ॥ ८६॥ निध्यायसि विषयसुखं न ध्यायसि विषममस्य परिपाकम् ।
    बन्धुं तमेव चिन्तय बन्द्धुं मोक्तुं च यः क्षमते ॥ ८७॥ सदनं गुरूपसदनं चरणं पञ्चाक्षरीपुरश्चरणम् । धनमभिलाषनिरोधनमत्याश्रमवर्तिनां
    पुंसाम् ॥ ८८॥ स विधिर्यत्ते विदधति स प्रतिषेधो यतो निवर्तन्ते । सोपनिषद्यद्ब्रुवते शैवाश्रमवर्तिनो
    धीराः ॥ ८९॥ कौ पितरौ यौ जगतां कः स्वामी यः प्रपञ्चम्य । प्रत्यस्तमिते भेदे तत्किमिदं किमिति कः प्रश्नः
    ॥ ९०॥ त्यज संसारमसारं भज शरणं पार्वतीरमणम् । विश्वसिहि श्रुतिशिखरं विश्वमिदं तव निदेशकरम् ॥ ९१॥ भव्यमभव्यं
    वा नः प्रलिखतु वेधाः सुदुर्मेधाः । सव्यमसव्यं वा नश्चरणं शरणं महेशस्य ॥ ९२॥ वेधाः कथं हरिः कथमिति
    तु प्रश्ने वयं मूकाः । शिवमेकं जानीमस्तस्मादन्यं न जानीमः ॥ ९३॥ दारुणमसिपत्रवनं दारुणतममन्धतामिस्रम्
    । का वा ततः क्षतिर्नः शैवा वयमा चतुर्वदनात् ॥ ९४॥ कृतदीक्षो घोरमखे कुलकूटस्थो भरद्वाजः । विद्येश्वरेषु
    कश्चन पितामहो न इति विस्रम्भः ॥ ९५॥ कलहः कदापि मास्त्विति कलितशरीरैक्ययोः शिवयोः । अहमस्म्यहमस्मीति
    प्राप्तः कलहो मम त्राणे ॥ ९६॥ नरकायापि न भोगान्नराधमायापि नान्यसुरान् । मन्यन्ते कतिचिदमी माहेश्वरमाश्रिता
    योगम् ॥ ९७॥ ज्ञातुं हातुं विषयं श्रोतुं मन्तुं ग्रहीतुमात्मानम् । वत्सा यदि न हि घटते तत्साधयताविमुक्ताय
    ॥ ९८॥ साङ्ख्यं योगो नियमा भक्तिः कर्म प्रपत्तिरिति । एकत्र सकलमेतत्केवलमविमुक्तमेकत्र ॥ ९९॥ बद्धः
    कस्ते वक्ष्यति मुक्तो मुक्तिं न जानाति । यास्यसि चेदविमुक्तं ज्ञास्यसि विश्वेश्वरस्य मुखात् ॥ १००॥
    न ग्रहीतं श्रुतिहृदयं न च निगृहीतं परिप्लवं हृदयम् । इच्छामि च धाम परं गच्छामि च विश्वनाथपुरम् ॥ १०१॥
    इति श्रीमदप्पय्यदीक्षितविरचितं वैराग्यशतकं सम्पूर्णम् ॥ इति श्रीमद्नारायणपण्डितदीक्षितविरचितं वैराग्यशतकं
    सम्पूर्णम् ॥
