id: brahmakritam05vishnustotram
category: stotram
name:
  english: brahmakritam05vishnustotram
  devanagari: ब्रह्मकृतं०५विष्णुस्तोत्रम्
content:
  english: brahmakritam 5 vishnustotram brahmovaca | devadeva jagannatha jagatsrishtamidam tvaya | rite
    tvaya jagadvishno naivavasthatumarhati || 12|| shasta tvamasya vishvasya vishuddhasya ca naparah |
    tvatto'stidam jagatsarvam tasmattvamanushasaya || 13|| devadanavagandharvah sayakshoragarakshasah
    | tvamrite pundarikaksham vyapitasheshavigrahah | parasparam vinighnanti tamshca tvam rakshitum kshamah
    || 14|| tvamasya vishvasya caracarasya | sthiteh sada pranabhridatmarupini || 15|| tvaya dhritam sarvamidam
    jagadvai yatastato'si tvamupendrasamjnah | praveshanam vyaptamidam svadhama yat tvamucyase vishnurato
    munindraih || 16|| nivasitam vishvamidam tvayadya vasashca dhatoriti vasudevah | tavanugam vishvamidam
    vibhustva
  devanagari: ब्रह्मकृतं ५ विष्णुस्तोत्रम् ब्रह्मोवाच । देवदेव जगन्नाथ जगत्सृष्टमिदं त्वया । ऋते त्वया
    जगद्विष्णो नैवावस्थातुमर्हति ॥ १२॥ शास्ता त्वमस्य विश्वस्य विशुद्धस्य च नापरः । त्वत्तोऽस्तीदं जगत्सर्वं
    तस्मात्त्वमनुशासय ॥ १३॥ देवदानवगन्धर्वाः सयक्षोरगराक्षसाः । त्वामृते पुण्डरीकाक्षं व्यापिताशेषविग्रहाः
    । परस्परं विनिघ्नन्ति तांश्च त्वं रक्षितुं क्षमः ॥ १४॥ त्वमस्य विश्वस्य चराचरस्य । स्थितेः सदा प्राणभृदात्मरूपिणी
    ॥ १५॥ त्वया धृतं सर्वमिदं जगद्वै यतस्ततोऽसि त्वमुपेन्द्रसंज्ञः । प्रवेशनं व्याप्तमिदं स्वधाम यत् त्वमुच्यसे
    विष्णुरतो मुनीन्द्रैः ॥ १६॥ निवासितं विश्वमिदं त्वयाद्य वासश्च धातोरिति वासुदेवः । तवानुगं विश्वमिदं
    विभुस्त्व
