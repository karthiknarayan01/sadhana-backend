    यात्रा ॐ श्रीं ऐं यक्षिणी पयः । ॐ श्रीं ऐं सौः च यक्षेशी ॐ यां यक्षेश्वरार्चिता ॥ ७२॥ ऐं सौः युयुत्सवा
    स्वाहा ॐ यां श्रीं क्लीं च यामिनी । ॐ जुं यां श्रीं यज्ञेशी ॐ यां क्लीं यज्ञदक्षिणा ॥ ७३॥ ॐ श्रीं
    ऐं सौः च यज्ञाङ्गी ॐ श्रीं ऐं सौः यशोवती । ॐ श्रीं यशःप्रदा स्वाहा ॐ क्लीं यां याज्ञिकप्रिया ॥ ७४॥
    ॐ क्लीं यां यजमानस्त्री ॐ श्रीं याज्ञिकवल्लभा । ॐ ह्रीं श्रीं क्लीं ह्सौः ऐं सौः यजमानवरप्रदा ॥ ७५॥
    ॐ श्रीं क्लीं यां युधिस्थायी ॐ यां यज्ञभुजाम्प्रिया । ॐ श्रीं यां यज्ञभक्षा च ॐ यां श्रीं यज्ञलालसाः
    ॥ ७६॥ ॐ श्रीं ऐं ईश्वरी स्वाहा इं ईं आं यां यमस्तुता । ॐ श्रीं इं ऐकिकी स्वाहा ॐ श्रीं आयुष्मती तथा
