id: padmavathi-stotram
category: stotram
name:
  english: Padmavathi Stotram
content:
  english: vishnupatni jaganmatah vishnuvakshasthalasthite | padmasane padmahaste padmavati namo'stu te
    || || venkateshapriye pujye kshirabditanaye shubhe | padmerame lokamatah padmavati namo'stu te ||
    || kalyani kamale kante kalyanapuranayike | karunyakalpalatike padmavati namo'stu te || || sahasradalapadmasthe
    koticandranibhanane | padmapatravishalakshi padmavati namo'stu te || || sarvajne sarvavarade sarvamangaladayini
    | sarvasammanite devi padmavati namo'stu te || || sarvahriddaharavase sarvapapabhayapahe | ashtaishvaryaprade
    lakshmi padmavati namo'stu te || || dehi me mokshasamrajyam dehi tvatpadadarshanam | ashtaishvaryam
    ca me dehi padmavati namo'stu te || || nakrashravananakshatre kritodvahamahotsave | kripaya pahi nah
    padme tvadbhaktibharitan rame || || indire hemavarnabhe tvam vande paramatmikam | bhavasagaramagnam
    mam raksha raksha maheshvari || || kalyanapuravasinyai narayanyai shriyai namah | shritistutipragitayai
    devadevyai ca mangalam ||
  devanagari: विष्णुपत्नि जगन्मातः विष्णुवक्षस्थलस्थिते । पद्मासने पद्महस्ते पद्मावति नमोऽस्तु ते ॥ ॥
    वेङ्कटेशप्रिये पूज्ये क्षीराब्दितनये शुभे । पद्मेरमे लोकमातः पद्मावति नमोऽस्तु ते ॥ ॥ कल्याणी कमले
    कान्ते कल्याणपुरनायिके । कारुण्यकल्पलतिके पद्मावति नमोऽस्तु ते ॥ ॥ सहस्रदलपद्मस्थे कोटिचन्द्रनिभानने
    । पद्मपत्रविशालाक्षी पद्मावति नमोऽस्तु ते ॥ ॥ सर्वज्ञे सर्ववरदे सर्वमङ्गलदायिनी । सर्वसम्मानिते देवी
    पद्मावति नमोऽस्तु ते ॥ ॥ सर्वहृद्दहरावासे सर्वपापभयापहे । अष्टैश्वर्यप्रदे लक्ष्मी पद्मावति नमोऽस्तु
    ते ॥ ॥ देहि मे मोक्षसाम्राज्यं देहि त्वत्पाददर्शनम् । अष्टैश्वर्यं च मे देहि पद्मावति नमोऽस्तु ते
    ॥ ॥ नक्रश्रवणनक्षत्रे कृतोद्वाहमहोत्सवे । कृपया पाहि नः पद्मे त्वद्भक्तिभरितान् रमे ॥ ॥ इन्दिरे हेमवर्णाभे
    त्वां वन्दे परमात्मिकाम् । भवसागरमग्नं मां रक्ष रक्ष महेश्वरी ॥ ॥ कल्याणपुरवासिन्यै नारायण्यै श्रियै
    नमः । शृतिस्तुतिप्रगीतायै देवदेव्यै च मङ्गलम् ॥
