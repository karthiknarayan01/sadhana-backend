id: aditya-hrudayam
category: stotram
name:
  english: Aditya Hrudayam
  devanagari: आदित्यहृदयम् (वाल्मिकीरामायणान्तर्गतम्)
content:
  english: introduction || atha sartha adityahridayam || tato yuddhaparishrantam samare cintaya sthitam
    | ravanam cagrato drishtva yuddhaya samupasthitam || 1|| daivataishca samagamya drashtumabhyagato
    ranam | upagamyabravidramamagastyo bhagavanrishih || 2|| rama rama mahabaho shrinu guhyam sanatanam
    | yena sarvanarinvatsa samare vijayishyasi || 3|| adityahridayam punyam sarvashatruvinashanam | jayavaham
    japennityamakshayam paramam shivam || 4|| sarvamangalamangalyam sarvapapapranashanam | cintashokaprashamanam
    ayurvardhanamuttamam || 5|| rashmimantam samudyantam devasuranamaskritam | pujayasva vivasvantam bhaskaram
    bhuvaneshvaram || 6|| universe by vhose efflugence all else brighten| 6 sarvadevatmako hyesha tejasvi
    rashmibhavanah | esha devasuragana~llokan pati gabhastibhih || 7|| esha brahma ca vishnushca shivah
    skandah prajapatih | mahendro dhanadah kalo yamah somo hyapam patih || 8|| pitaro vasavah sadhya hyashvinau
    maruto manuh | vayurvahnih prajaprana ritukarta prabhakarah || 9|| adityah savita suryah khagah pusha
    gabhastiman | suvarnasadrisho bhanurhiranyareta divakarah || 10|| or bhanurvishvareta haridashvah
    sahasrarcih saptasaptirmariciman | timironmathanah shambhustvashta martanda amshuman || 11|| or martanda
    hiranyagarbhah shishirastapano bhaskaro ravih | agnigarbho'diteh putrah shankhah shishiranashanah
    || 12|| vyomanathastamobhedi rigyajuhsamaparagah | ghanavrishtirapam mitro vindhyavithi plavangamah
    || 13|| atapi mandali mrityuh pingalah sarvatapanah | kavirvishvo mahatejah raktah sarvabhavod|hbhavah
    || 14|| nakshatragrahataranamadhipo vishvabhavanah | tejasamapi tejasvi dvadashatmannamo'stu te ||
    15|| namah purvaya giraye pashcimayadraye namah | jyotirgananam pataye dinadhipataye namah || 16||
    jayaya jayabhadraya haryashvaya namo namah | namo namah sahasramsho adityaya namo namah || 17|| nama
    ugraya viraya sarangaya namo namah | namah padmaprabodhaya martandaya namo namah || 18|| or martandaya,
    pracandaya brahmeshanacyuteshaya suryayadityavarcase | bhasvate sarvabhakshaya raudraya vapushe namah
    || 19|| tamoghnaya himaghnaya shatrughnayamitatmane | kritaghnaghnaya devaya jyotisham pataye namah
    || 20|| taptacamikarabhaya vahnaye vishvakarmane | or haraye vishvakarmane namastamo'bhinighnaya rucaye
    lokasakshine || 21|| nashayatyesha vai bhutam tadeva srijati prabhuh | payatyesha tapatyesha varshatyesha
    gabhastibhih || 22|| esha supteshu jagarti bhuteshu parinishthitah | esha evagnihotram ca phalam caivagnihotrinam
    || 23|| vedashca kratavashcaiva kratunam phalameva ca | yani krityani lokeshu sarva esha ravih prabhuh
    || 24|| || phala shrutih || enamapatsu kricchreshu kantareshu bhayeshu ca | kirtayan purushah kashcinnavasidati
    raghava || 25|| pujayasvainamekagro devadevam jagat|hpatim | etat trigunitam japtva yuddheshu vijayishyasi
    || 26|| asminkshane mahabaho ravanam tvam vadhishyasi | evamuktva tada'gastyo jagama ca yathagatam
    || 27|| O mighty armed one, you shall truimph over ṟavana this very moment| having spoken this, agastya
    returned his original place| 27 etacchrutva mahateja nashtashoko'bhavattada | dharayamasa suprito
    raghavah prayatatmavan || 28|| adityam prekshya japtva tu param harshamavaptavan | triracamya shucirbhutva
    dhanuradaya viryavan || 29|| ravanam prekshya hrishtatma yuddhaya samupagamat | sarva yatnena mahata
    vadhe tasya dhrito'bhavat || 30|| atha raviravadannirikshya ramam muditamanah paramam prahrishyamanah
    | nishicarapatisankshayam viditva suraganamadhyagato vacastvareti || 31|| || iti adityahridayam mantram
    || stotrapatha om asya shriadityahridayastotramantrasya shriagastyarishih | anushtupchandah | shriadityahridayabhuto
    bhagavan brahma devatah | om bijam | rashmimateriti shaktih | om tatsaviturityadigayatri kilakam |
    nirastasheshavighnataya brahmavidyasiddhau sarvatra jayasiddhau ca viniyogah | atha rishyadinyasah
    || om agastyarishaye namah shirasi | anushtupchandase namah mukhe | adityahridayabhutabrahmadevatayai
    namah| hridi | om bijaya namah guhye | om rashmimate shaktaye namah padayoh | om tatsaviturityadigayatri
    kilakaya namah nabhau | viniyogaya namah sarvange | iti rishyadinyasah || atha karanyasah || om rashmimate
    angushthabhyam namah | om samudyate tarjanibhyam namah | om devasuranamaskritaya madhyamabhyam namah
    | om vivasvate anamikabhyam namah | om bhaskaraya kanishthikabhyam namah | om bhuvaneshvaraya karatalakaraprishthabhyam
    namah | iti karanyasah || atha hridayadishadanga nyasah || om rashmimate hridayaya namah | om samudyate
    shirase svaha | om devasuranamaskritaya shikhayai vashat | om vivasvate kavacaya hum | om bhaskaraya
    netratrayaya vaushat | om bhuvaneshvaraya astraya phat | iti hridayadishadanga nyasah || || atha adityahridayam
    || tato yuddhaparishrantam samare cintaya sthitam | ravanam cagrato drishtva yuddhaya samupasthitam
    || 1|| daivataishca samagamya drashtumabhyagato ranam | upagamyabravidramamagastyo bhagavanrishih
    || 2|| rama rama mahabaho shrinu guhyam sanatanam | yena sarvanarinvatsa samare vijayishyasi || 3||
    adityahridayam punyam sarvashatruvinashanam | jayavaham japennityamakshayam paramam shivam || 4||
    sarvamangalamangalyam sarvapapapranashanam | cintashokaprashamanam ayurvardhanamuttamam || 5|| rashmimantam
    samudyantam devasuranamaskritam | pujayasva vivasvantam bhaskaram bhuvaneshvaram || 6|| sarvadevatmako
    hyesha tejasvi rashmibhavanah | esha devasuragana~llokan pati gabhastibhih || 7|| esha brahma ca vishnushca
    shivah skandah prajapatih | mahendro dhanadah kalo yamah somo hyapam patih || 8|| pitaro vasavah sadhya
    hyashvinau maruto manuh | vayurvahnih prajaprana ritukarta prabhakarah || 9|| adityah savita suryah
    khagah pusha gabhastiman | suvarnasadrisho bhanurhiranyareta divakarah || 10|| or bhanurvishvareta
    haridashvah sahasrarcih saptasaptirmariciman | timironmathanah shambhustvashta martanda amshuman ||
    11|| or martanda hiranyagarbhah shishirastapano bhaskaro ravih | agnigarbho'diteh putrah shankhah
    shishiranashanah || 12|| vyomanathastamobhedi rigyajuhsamaparagah | ghanavrishtirapam mitro vindhyavithi
    plavangamah || 13|| atapi mandali mrityuh pingalah sarvatapanah | kavirvishvo mahatejah raktah sarvabhavodbhavah
    || 14|| nakshatragrahataranamadhipo vishvabhavanah | tejasamapi tejasvi dvadashatmannamo'stu te ||
    15|| namah purvaya giraye pashcimayadraye namah | jyotirgananam pataye dinadhipataye namah || 16||
    jayaya jayabhadraya haryashvaya namo namah | namo namah sahasramsho adityaya namo namah || 17|| nama
    ugraya viraya sarangaya namo namah | namah padmaprabodhaya martandaya namo namah || 18|| or martandaya,
    pracandaya brahmeshanacyuteshaya suryayadityavarcase | bhasvate sarvabhakshaya raudraya vapushe namah
    || 19|| tamoghnaya himaghnaya shatrughnayamitatmane | kritaghnaghnaya devaya jyotisham pataye namah
    || 20|| taptacamikarabhaya vahnaye vishvakarmane | or haraye vishvakarmane namastamo'bhinighnaya rucaye
    lokasakshine || 21|| nashayatyesha vai bhutam tadeva srijati prabhuh | payatyesha tapatyesha varshatyesha
    gabhastibhih || 22|| esha supteshu jagarti bhuteshu parinishthitah | esha evagnihotram ca phalam caivagnihotrinam
    || 23|| vedashca kratavashcaiva kratunam phalameva ca | yani krityani lokeshu sarva esha ravih prabhuh
    || 24|| || phalashrutih || enamapatsu kricchreshu kantareshu bhayeshu ca | kirtayan purushah kashcinnavasidati
    raghava || 25|| pujayasvainamekagro devadevam jagatpatim | etat trigunitam japtva yuddheshu vijayishyasi
    || 26|| asminkshane mahabaho ravanam tvam vadhishyasi | evamuktva tada'gastyo jagama ca yathagatam
    || 27|| etacchrutva mahateja nashtashoko'bhavattada | dharayamasa suprito raghavah prayatatmavan ||
    28|| adityam prekshya japtva tu param harshamavaptavan | triracamya shucirbhutva dhanuradaya viryavan
    || 29|| ravanam prekshya hrishtatma yuddhaya samupagamat | sarva yatnena mahata vadhe tasya dhrito'bhavat
    || 30|| atha raviravadannirikshya ramam muditamanah paramam prahrishyamanah | nishicarapatisankshayam
    viditva suraganamadhyagato vacastvareti || 31|| iti adityahridayam mantram || ṟamayana (ġita Press,
    1995, 4th edn|) Encoded and translated by m| ġiridhar
  devanagari: ईन्त्रोदुच्तिओन् ॥ अथ सार्थ आदित्यहृदयम् ॥ ततो युद्धपरिश्रान्तं समरे चिन्तया स्थितम् । रावणं
    चाग्रतो दृष्ट्वा युद्धाय समुपस्थितम् ॥ १॥ दैवतैश्च समागम्य द्रष्टुमभ्यागतो रणम् । उपागम्याब्रवीद्राममगस्त्यो
    भगवानृषिः ॥ २॥ राम राम महाबाहो शृणु गुह्यं सनातनम् । येन सर्वानरीन्वत्स समरे विजयिष्यसि ॥ ३॥ आदित्यहृदयं
    पुण्यं सर्वशत्रुविनाशनम् । जयावहं जपेन्नित्यमक्षयं परमं शिवम् ॥ ४॥ सर्वमङ्गलमाङ्गल्यं सर्वपापप्रणाशनम्
    । चिन्ताशोकप्रशमनं आयुर्वर्धनमुत्तमम् ॥ ५॥ रश्मिमन्तं समुद्यन्तं देवासुरनमस्कृतम् । पूजयस्व विवस्वन्तं
    भास्करं भुवनेश्वरम् ॥ ६॥ उनिवेर्से ब्य् व्होसे एफ़्फ़्लुगेन्चे अल्ल् एल्से ब्रिघ्तेन्। ६ सर्वदेवात्मको
    ह्येष तेजस्वी रश्मिभावनः । एष देवासुरगणाँल्लोकान् पाति गभस्तिभिः ॥ ७॥ एष ब्रह्मा च विष्णुश्च शिवः
    स्कन्दः प्रजापतिः । महेन्द्रो धनदः कालो यमः सोमो ह्यपां पतिः ॥ ८॥ पितरो वसवः साध्या ह्यश्विनौ मरुतो
    मनुः । वायुर्वह्निः प्रजाप्राण ऋतुकर्ता प्रभाकरः ॥ ९॥ आदित्यः सविता सूर्यः खगः पूषा गभस्तिमान् । सुवर्णसदृशो
    भानुर्हिरण्यरेता दिवाकरः ॥ १०॥ ओर् भानुर्विश्वरेता हरिदश्वः सहस्रार्चिः सप्तसप्तिर्मरीचिमान् । तिमिरोन्मथनः
    शम्भुस्त्वष्टा मार्ताण्ड अंशुमान् ॥ ११॥ ओर् मार्तण्ड हिरण्यगर्भः शिशिरस्तपनो भास्करो रविः । अग्निगर्भोऽदितेः
    पुत्रः शङ्खः शिशिरनाशनः ॥ १२॥ व्योमनाथस्तमोभेदी ऋग्यजुःसामपारगः । घनवृष्टिरपां मित्रो विन्ध्यवीथी
    प्लवङ्गमः ॥ १३॥ आतपी मण्डली मृत्युः पिङ्गलः सर्वतापनः । कविर्विश्वो महातेजाः रक्तः सर्वभवोद्।ह्भवः
    ॥ १४॥ नक्षत्रग्रहताराणामधिपो विश्वभावनः । तेजसामपि तेजस्वी द्वादशात्मन्नमोऽस्तु ते ॥ १५॥ नमः पूर्वाय
    गिरये पश्चिमायाद्रये नमः । ज्योतिर्गणानां पतये दिनाधिपतये नमः ॥ १६॥ जयाय जयभद्राय हर्यश्वाय नमो नमः
    । नमो नमः सहस्रांशो आदित्याय नमो नमः ॥ १७॥ नम उग्राय वीराय सारङ्गाय नमो नमः । नमः पद्मप्रबोधाय मार्ताण्डाय
    नमो नमः ॥ १८॥ ओर् मार्तण्डाय, प्रचण्डाय ब्रह्मेशानाच्युतेशाय सूर्यायादित्यवर्चसे । भास्वते सर्वभक्षाय
    रौद्राय वपुषे नमः ॥ १९॥ तमोघ्नाय हिमघ्नाय शत्रुघ्नायामितात्मने । कृतघ्नघ्नाय देवाय ज्योतिषां पतये
    नमः ॥ २०॥ तप्तचामीकराभाय वह्नये विश्वकर्मणे । ओर् हरये विश्वकर्मणे नमस्तमोऽभिनिघ्नाय रुचये लोकसाक्षिणे
    ॥ २१॥ नाशयत्येष वै भूतं तदेव सृजति प्रभुः । पायत्येष तपत्येष वर्षत्येष गभस्तिभिः ॥ २२॥ एष सुप्तेषु
    जागर्ति भूतेषु परिनिष्ठितः । एष एवाग्निहोत्रं च फलं चैवाग्निहोत्रिणाम् ॥ २३॥ वेदाश्च क्रतवश्चैव क्रतूनां
    फलमेव च । यानि कृत्यानि लोकेषु सर्व एष रविः प्रभुः ॥ २४॥ ॥ फल श्रुतिः ॥ एनमापत्सु कृच्छ्रेषु कान्तारेषु
    भयेषु च । कीर्तयन् पुरुषः कश्चिन्नावसीदति राघव ॥ २५॥ पूजयस्वैनमेकाग्रो देवदेवं जगत्।ह्पतिम् । एतत्
    त्रिगुणितं जप्त्वा युद्धेषु विजयिष्यसि ॥ २६॥ अस्मिन्क्षणे महाबाहो रावणं त्वं वधिष्यसि । एवमुक्त्वा
    तदाऽगस्त्यो जगाम च यथागतम् ॥ २७॥ O मिघ्त्य् अर्मेद् ओने, योउ शल्ल् त्रुइम्फ् ओवेर् ऱवन थिस् वेर्य्
    मोमेन्त्। ःअविन्ग् स्पोकेन् थिस्, आगस्त्य रेतुर्नेद् हिस् ओरिगिनल् प्लचे। २७ एतच्छ्रुत्वा महातेजा
    नष्टशोकोऽभवत्तदा । धारयामास सुप्रीतो राघवः प्रयतात्मवान् ॥ २८॥ आदित्यं प्रेक्ष्य जप्त्वा तु परं हर्षमवाप्तवान्
    । त्रिराचम्य शुचिर्भूत्वा धनुरादाय वीर्यवान् ॥ २९॥ रावणं प्रेक्ष्य हृष्टात्मा युद्धाय समुपागमत् ।
    सर्व यत्नेन महता वधे तस्य धृतोऽभवत् ॥ ३०॥ अथ रविरवदन्निरीक्ष्य रामं मुदितमनाः परमं प्रहृष्यमाणः ।
    निशिचरपतिसङ्क्षयं विदित्वा सुरगणमध्यगतो वचस्त्वरेति ॥ ३१॥ ॥ इति आदित्यहृदयं मन्त्रम् ॥ स्तोत्रपाठ
    ॐ अस्य श्रीआदित्यहृदयस्तोत्रमन्त्रस्य श्रीअगस्त्यऋषिः । अनुष्टुप्छन्दः । श्रीआदित्यहृदयभूतो भगवान्
    ब्रह्मा देवताः । ॐ बीजम् । रश्मिमतेरिति शक्तिः । ॐ तत्सवितुरित्यादिगायत्री कीलकम् । निरस्ताशेषविघ्नतया
    ब्रह्मविद्यासिद्धौ सर्वत्र जयसिद्धौ च विनियोगः । अथ ऋष्यादिन्यासः ॥ ॐ अगस्त्यऋषये नमः शिरसि । अनुष्टुप्छन्दसे
    नमः मुखे । आदित्यहृदयभूतब्रह्मदेवतायै नमः। हृदि । ॐ बीजाय नमः गुह्ये । ॐ रश्मिमते शक्तये नमः पादयोः
    । ॐ तत्सवितुरित्यादिगायत्री कीलकाय नमः नाभौ । विनियोगाय नमः सर्वाङ्गे । इति ऋष्यादिन्यासः ॥ अथ करन्यासः
    ॥ ॐ रश्मिमते अङ्गुष्ठाभ्यां नमः । ॐ समुद्यते तर्जनीभ्यां नमः । ॐ देवासुरनमस्कृताय मध्यमाभ्यां नमः
    । ॐ विवस्वते अनामिकाभ्यां नमः । ॐ भास्कराय कनिष्ठिकाभ्यां नमः । ॐ भुवनेश्वराय करतलकरपृष्ठाभ्यां नमः
    । इति करन्यासः ॥ अथ हृदयादिषडङ्ग न्यासः ॥ ॐ रश्मिमते हृदयाय नमः । ॐ समुद्यते शिरसे स्वाहा । ॐ देवासुरनमस्कृताय
    शिखायै वषट् । ॐ विवस्वते कवचाय हुम् । ॐ भास्कराय नेत्रत्रयाय वौषट् । ॐ भुवनेश्वराय अस्त्राय फट् ।
    इति हृदयादिषडङ्ग न्यासः ॥ ॥ अथ आदित्यहृदयम् ॥ ततो युद्धपरिश्रान्तं समरे चिन्तया स्थितम् । रावणं चाग्रतो
    दृष्ट्वा युद्धाय समुपस्थितम् ॥ १॥ दैवतैश्च समागम्य द्रष्टुमभ्यागतो रणम् । उपागम्याब्रवीद्राममगस्त्यो
    भगवानृषिः ॥ २॥ राम राम महाबाहो शृणु गुह्यं सनातनम् । येन सर्वानरीन्वत्स समरे विजयिष्यसि ॥ ३॥ आदित्यहृदयं
    पुण्यं सर्वशत्रुविनाशनम् । जयावहं जपेन्नित्यमक्षयं परमं शिवम् ॥ ४॥ सर्वमङ्गलमाङ्गल्यं सर्वपापप्रणाशनम्
    । चिन्ताशोकप्रशमनं आयुर्वर्धनमुत्तमम् ॥ ५॥ रश्मिमन्तं समुद्यन्तं देवासुरनमस्कृतम् । पूजयस्व विवस्वन्तं
    भास्करं भुवनेश्वरम् ॥ ६॥ सर्वदेवात्मको ह्येष तेजस्वी रश्मिभावनः । एष देवासुरगणाँल्लोकान् पाति गभस्तिभिः
    ॥ ७॥ एष ब्रह्मा च विष्णुश्च शिवः स्कन्दः प्रजापतिः । महेन्द्रो धनदः कालो यमः सोमो ह्यपां पतिः ॥ ८॥
    पितरो वसवः साध्या ह्यश्विनौ मरुतो मनुः । वायुर्वह्निः प्रजाप्राण ऋतुकर्ता प्रभाकरः ॥ ९॥ आदित्यः सविता
    सूर्यः खगः पूषा गभस्तिमान् । सुवर्णसदृशो भानुर्हिरण्यरेता दिवाकरः ॥ १०॥ ओर् भानुर्विश्वरेता हरिदश्वः
    सहस्रार्चिः सप्तसप्तिर्मरीचिमान् । तिमिरोन्मथनः शम्भुस्त्वष्टा मार्ताण्ड अंशुमान् ॥ ११॥ ओर् मार्तण्ड
    हिरण्यगर्भः शिशिरस्तपनो भास्करो रविः । अग्निगर्भोऽदितेः पुत्रः शङ्खः शिशिरनाशनः ॥ १२॥ व्योमनाथस्तमोभेदी
    ऋग्यजुःसामपारगः । घनवृष्टिरपां मित्रो विन्ध्यवीथी प्लवङ्गमः ॥ १३॥ आतपी मण्डली मृत्युः पिङ्गलः सर्वतापनः
    । कविर्विश्वो महातेजाः रक्तः सर्वभवोद्भवः ॥ १४॥ नक्षत्रग्रहताराणामधिपो विश्वभावनः । तेजसामपि तेजस्वी
    द्वादशात्मन्नमोऽस्तु ते ॥ १५॥ नमः पूर्वाय गिरये पश्चिमायाद्रये नमः । ज्योतिर्गणानां पतये दिनाधिपतये
    नमः ॥ १६॥ जयाय जयभद्राय हर्यश्वाय नमो नमः । नमो नमः सहस्रांशो आदित्याय नमो नमः ॥ १७॥ नम उग्राय वीराय
    सारङ्गाय नमो नमः । नमः पद्मप्रबोधाय मार्ताण्डाय नमो नमः ॥ १८॥ ओर् मार्तण्डाय, प्रचण्डाय ब्रह्मेशानाच्युतेशाय
    सूर्यायादित्यवर्चसे । भास्वते सर्वभक्षाय रौद्राय वपुषे नमः ॥ १९॥ तमोघ्नाय हिमघ्नाय शत्रुघ्नायामितात्मने
    । कृतघ्नघ्नाय देवाय ज्योतिषां पतये नमः ॥ २०॥ तप्तचामीकराभाय वह्नये विश्वकर्मणे । ओर् हरये विश्वकर्मणे
    नमस्तमोऽभिनिघ्नाय रुचये लोकसाक्षिणे ॥ २१॥ नाशयत्येष वै भूतं तदेव सृजति प्रभुः । पायत्येष तपत्येष वर्षत्येष
    गभस्तिभिः ॥ २२॥ एष सुप्तेषु जागर्ति भूतेषु परिनिष्ठितः । एष एवाग्निहोत्रं च फलं चैवाग्निहोत्रिणाम्
    ॥ २३॥ वेदाश्च क्रतवश्चैव क्रतूनां फलमेव च । यानि कृत्यानि लोकेषु सर्व एष रविः प्रभुः ॥ २४॥ ॥ फलश्रुतिः
    ॥ एनमापत्सु कृच्छ्रेषु कान्तारेषु भयेषु च । कीर्तयन् पुरुषः कश्चिन्नावसीदति राघव ॥ २५॥ पूजयस्वैनमेकाग्रो
    देवदेवं जगत्पतिम् । एतत् त्रिगुणितं जप्त्वा युद्धेषु विजयिष्यसि ॥ २६॥ अस्मिन्क्षणे महाबाहो रावणं त्वं
    वधिष्यसि । एवमुक्त्वा तदाऽगस्त्यो जगाम च यथागतम् ॥ २७॥ एतच्छ्रुत्वा महातेजा नष्टशोकोऽभवत्तदा । धारयामास
    सुप्रीतो राघवः प्रयतात्मवान् ॥ २८॥ आदित्यं प्रेक्ष्य जप्त्वा तु परं हर्षमवाप्तवान् । त्रिराचम्य शुचिर्भूत्वा
    धनुरादाय वीर्यवान् ॥ २९॥ रावणं प्रेक्ष्य हृष्टात्मा युद्धाय समुपागमत् । सर्व यत्नेन महता वधे तस्य
    धृतोऽभवत् ॥ ३०॥ अथ रविरवदन्निरीक्ष्य रामं मुदितमनाः परमं प्रहृष्यमाणः । निशिचरपतिसङ्क्षयं विदित्वा
    सुरगणमध्यगतो वचस्त्वरेति ॥ ३१॥ इति आदित्यहृदयं मन्त्रम् ॥ ऱमयन (ग़ित Pरेस्स्, १९९५, ४थ् एद्न्।) Eन्चोदेद्
    अन्द् त्रन्स्लतेद् ब्य् ं। ग़िरिधर्
