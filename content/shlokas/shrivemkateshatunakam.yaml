id: shrivemkateshatunakam
category: stotram
name:
  english: shrivemkateshatunakam
  devanagari: श्रीवेंकटेशतूणकम्
content:
  english: ringa sanginam bhaje || 3|| kambukanthamambujatadambarambakadvayam shambararitatamenamamburashitalpagam
    | bambhararbhakalibhavyalambamanamaulikam shankhakundadantavantamuttamam bhajamahe || 4|| pankajasanarcatam
    shashankashobhitananam kankanadidivyabhushanankitam varapradam | kunkumankitorasam sashankhacakranandakam
    venkateshamindirapadankitam bhajamahe || 5|| || iti shrivenkateshatunakam ||
  devanagari: ृङ्ग सङ्गिनं भजे ॥ ३॥ कम्बुकण्ठमम्बुजातडम्बराम्बकद्वयं शम्बरारितातमेनमम्बुराशितल्पगम् ।
    बम्भरार्भकालिभव्यलम्बमानमौलिकं शङ्खकुन्ददन्तवन्तमुत्तमं भजामहे ॥ ४॥ पङ्कजासनार्चतं शशाङ्कशोभिताननं
    कङ्कणादिदिव्यभूषणाङ्कितं वरप्रदम् । कुङ्कुमाङ्कितोरसं सशङ्खचक्रनन्दकं वेङ्कटेशमिन्दिरापदाङ्कितं भजामहे
    ॥ ५॥ ॥ इति श्रीवेङ्कटेशतूणकम् ॥
meaning: {}
