id: tyagaraja-keerthanas-nagumomu-ganaleni
category: stotram
name:
  english: Tyagaraja Keerthanas Nagumomu Ganaleni
content:
  english: tèlugu pallavi nagumomu ganaleni najali tèlisi nanu brovaga rada shri raghuvara ni anupallavi
    nagarajadhara nidu paraivara lèlla ògibodhana jese varalu gare yitu lundudurè caranam khagaraju ni
    yanati vini vega canaledo gaganani kilaku bahu durambaninado jagamelè paramatma èvarito mòralidudu
    vaga jupaku talanu nannelukora tyagarajanuta ni
  devanagari: तॆलुगु पल्लवि नगुमोमु गनलेनि नाजालि तॆलिसि ननु ब्रोवग रादा श्री रघुवर नी अनुपल्लवि नगराजधर
    नीदु परैवार लॆल्ल ऒगिबोधन जेसे वारलु गारे यिटु लुण्डुदुरॆ चरणम् खगराजु नी यानति विनि वेग चनलेदो गगनानि
    किलकु बहु दूरम्बनिनादो जगमेलॆ परमात्म ऎवरितो मॊरलिडुदु वग जूपकु तालनु नन्नेलुकोर त्यागराजनुत नी
meaning: {}
