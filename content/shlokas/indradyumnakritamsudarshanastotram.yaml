id: indradyumnakritamsudarshanastotram
category: stotram
name:
  english: indradyumnakritamsudarshanastotram
  devanagari: इन्द्रद्युम्नकृतंसुदर्शनस्तोत्रम्
content:
  english: indradyumnakritam sudarshanastotram cakram sudarshanam vishnoshcaturtham vapurasthitam || 63||
    pranamya paraya bhaktya imam stutimudaharet | sudarshana mahajvala kotisuryasamaprabha || 64|| ajnanatimirandhanam
    vaikunthadhvapradarshaka | namaste nityavilasadvaishnavasvaniketana || 65|| avaryaviryam yadrupam
    vishnostatpranamamyaham || iti shriskandapurane vaishnavakhande purushottamajagannathamahatmye saptavimshadhyayantargatam
    indradyumnakritam sudarshanastotram samaptam | skandapurana | vaishnavakhanda | purushottamakhanda
    | adhyaya 27
  devanagari: इन्द्रद्युम्नकृतं सुदर्शनस्तोत्रम् चक्रं सुदर्शनं विष्णोश्चतुर्थं वपुरास्थितम् ॥ ६३॥ प्रणम्य
    परया भक्त्या इमां स्तुतिमुदाहरेत् । सुदर्शन महाज्वाल कोटिसूर्यसमप्रभ ॥ ६४॥ अज्ञानतिमिरान्धानां वैकुण्ठाध्वप्रदर्शक
    । नमस्ते नित्यविलसद्वैष्णवस्वनिकेतन ॥ ६५॥ अवार्यवीर्यं यद्रूपं विष्णोस्तत्प्रणमाम्यहम् ॥ इति श्रीस्कन्दपुराणे
    वैष्णवखण्डे पुरुषोत्तमजगन्नाथमाहात्म्ये सप्तविंशाध्यायान्तर्गतं इन्द्रद्युम्नकृतं सुदर्शनस्तोत्रं
    समाप्तम् । स्कन्दपुराण । वैष्णवखण्ड । पुरुषोत्तमखण्ड । अध्याय २७
meaning: {}
