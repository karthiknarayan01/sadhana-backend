id: arjuna-kruta-durga-stotram
category: stotram
name:
  english: Arjuna Kruta Durga Stotram
content:
  english: arjuna uvaca | namaste siddhasenani arye mandaravasini | kumari kali kapali kapile krishnapingale
    || || bhadrakali namastubhyam mahakali namo'stu te | candi cande namastubhyam tarini varavarnini ||
    || katyayani mahabhage karali vijaye jaye | shikhipinchadhvajadhare nanabharanabhushite || || attashulapraharane
    khadgakhetakadharini | gopendrasyanuje jyeshthe nandagopakulodbhave || || mahishasrikpriye nityam
    kaushiki pitavasini | attahase kokamukhe namaste'stu ranapriye || || ume shakambhari shvete krishne
    kaitabhanashini | hiranyakshi virupakshi sudhumrakshi namo'stu te || || vedashrutimahapunye brahmanye
    jatavedasi | jambukatakacaityeshu nityam sannihitalaye || || tvam brahmavidya vidyanam mahanidra ca
    dehinam | skandamatarbhagavati durge kantaravasini || || svahakarah svadha caiva kala kashtha sarasvati
    | savitri vedamata ca tatha vedanta ucyate || || kantarabhayadurgeshu bhaktanam calayeshu ca | nityam
    vasasi patale yuddhe jayasi danavan || || tvam jambhani mohini ca maya hrih shristathaiva ca | sandhya
    prabhavati caiva savitri janani tatha || || tushtih pushtirdhritirdiptishcandradityavivardhini | bhutirbhutimatam
    sankhye vikshyase siddhacaranaih || || stutasi tvam mahadevi vishuddhenantaratmana | jayo bhavatu
    me nityam tvatprasadadranajire || || iti shrimanmahabharate bhishmaparvani trayovimsho'dhyaye arjuna
    krita shri durga stotram |
  devanagari: अर्जुन उवाच । नमस्ते सिद्धसेनानि आर्ये मन्दरवासिनि । कुमारि कालि कापालि कपिले कृष्णपिङ्गले
    ॥ ॥ भद्रकालि नमस्तुभ्यं महाकालि नमोऽस्तु ते । चण्डि चण्डे नमस्तुभ्यं तारिणि वरवर्णिनि ॥ ॥ कात्यायनि
    महाभागे करालि विजये जये । शिखिपिञ्छध्वजधरे नानाभरणभूषिते ॥ ॥ अट्टशूलप्रहरणे खड्गखेटकधारिणि । गोपेन्द्रस्यानुजे
    ज्येष्ठे नन्दगोपकुलोद्भवे ॥ ॥ महिषासृक्प्रिये नित्यं कौशिकि पीतवासिनि । अट्टहासे कोकमुखे नमस्तेऽस्तु
    रणप्रिये ॥ ॥ उमे शाकम्भरि श्वेते कृष्णे कैटभनाशिनि । हिरण्याक्षि विरूपाक्षि सुधूम्राक्षि नमोऽस्तु
    ते ॥ ॥ वेदश्रुतिमहापुण्ये ब्रह्मण्ये जातवेदसि । जम्बूकटकचैत्येषु नित्यं सन्निहितालये ॥ ॥ त्वं ब्रह्मविद्या
    विद्यानां महानिद्रा च देहिनाम् । स्कन्दमातर्भगवति दुर्गे कान्तारवासिनि ॥ ॥ स्वाहाकारः स्वधा चैव कला
    काष्ठा सरस्वती । सावित्री वेदमाता च तथा वेदान्त उच्यते ॥ ॥ कान्तारभयदुर्गेषु भक्तानां चालयेषु च ।
    नित्यं वससि पाताले युद्धे जयसि दानवान् ॥ ॥ त्वं जम्भनी मोहिनी च माया ह्रीः श्रीस्तथैव च । सन्ध्या
    प्रभावती चैव सावित्री जननी तथा ॥ ॥ तुष्टिः पुष्टिर्धृतिर्दीप्तिश्चन्द्रादित्यविवर्धिनी । भूतिर्भूतिमतां
    सङ्ख्ये वीक्ष्यसे सिद्धचारणैः ॥ ॥ स्तुतासि त्वं महादेवि विशुद्धेनान्तरात्मना । जयो भवतु मे नित्यं
    त्वत्प्रसादाद्रणाजिरे ॥ ॥ इति श्रीमन्महाभारते भीष्मपर्वणि त्रयोविंशोऽध्याये अर्जुन कृत श्री दुर्गा
    स्तोत्रम् ।
