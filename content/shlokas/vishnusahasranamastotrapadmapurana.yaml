id: vishnusahasranamastotrapadmapurana
category: sahasranama
name:
  english: vishnusahasranamastotrapadmapurana
  devanagari: विष्णुसहस्रनामस्तोत्रपद्मपुरन
content:
  english: nrisimhaya vidmahe shrim shrikanthaya dhimahi | tanno vishnuh pracodayat || om vasudevaya vidmahe
    devakisutaya dhimahi | tannah krishnah pracodayat || om hram hrim hrum hraim hraum hrah klim krishnaya
    govindaya gopijanavallabhaya namah svaha | iti mantram samuccarya yajedva vishnumavyayam | iti va
    mantram yathocitam japtva dhyayet | dhyanam | vishnum bhasvatkiritangadavalayaganakalpaharodaranghrim
    shribhusham shrisuvakshomani makaramahakundalam manditasham | hastodyaccakrashankhambujagalamamalam
    pitakausheyavasam vidyotadbhasamudyaddinakarasadrisham padmasamstham namami || om vasudevah param
    brahma paramatma paratparah | param dhama param jyotih param tattvam param padam || 1|| param shivah
    paro dhyeyah param jnanam para gatih | paramarthah param shreyah paranandah parodayah || 2|| paro'vyaktatparam
    vyoma paramarddhih pareshvarah | niramayo nirvikaro nirvikalpo nirashrayah || 3|| niranjano niratanko
    nirlepo niravagrahah | nirguno nishkalo'nanto'bhayo'cintyo balocitah || 4|| atindriyo'mito'paro'nisho'niho'vyayo'kshayah
    |
  devanagari: नृसिंहाय विद्महे श्रीं श्रीकण्ठाय धीमहि । तन्नो विष्णुः प्रचोदयात् ॥ ॐ वासुदेवाय विद्महे
    देवकीसुताय धीमहि । तन्नः कृष्णः प्रचोदयात् ॥ ॐ ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः क्लीं कृष्णाय गोविन्दाय
    गोपीजनवल्लभाय नमः स्वाहा । इति मन्त्रं समुच्चार्य यजेद्वा विष्नुमव्ययम् । इति वा मन्त्रं यथोचितं जप्त्वा
    ध्यायेत् । ध्यानम् । विष्णुं भास्वत्किरीटाङ्गदवलयगणाकल्पहारोदराङ्घ्रिं श्रीभूषं श्रीसुवक्षोमणि मकरमहाकुण्डलं
    मण्डिताशम् । हस्तोद्यच्चक्रशङ्खाम्बुजगलममलं पीतकौशेयवासं विद्योतद्भासमुद्यद्दिनकरसदृशं पद्मसंस्थं
    नमामि ॥ ॐ वासुदेवः परं ब्रह्म परमात्मा परात्परः । परं धाम परं ज्योतिः परं तत्त्वं परं पदम् ॥ १॥ परं
    शिवः परो ध्येयः परं ज्ञानं परा गतिः । परमार्थः परं श्रेयः परानन्दः परोदयः ॥ २॥ परोऽव्यक्तात्परं व्योम
    परमर्द्धिः परेश्वरः । निरामयो निर्विकारो निर्विकल्पो निराश्रयः ॥ ३॥ निरञ्जनो निरातङ्को निर्लेपो निरवग्रहः
    । निर्गुणो निष्कलोऽनन्तोऽभयोऽचिन्त्यो बलोचितः ॥ ४॥ अतीन्द्रियोऽमितोऽपारोऽनीशोऽनीहोऽव्ययोऽक्षयः ।
