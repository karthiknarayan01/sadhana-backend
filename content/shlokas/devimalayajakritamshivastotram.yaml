id: devimalayajakritamshivastotram
category: stotram
name:
  english: devimalayajakritamshivastotram
  devanagari: देवीमलयजाकृतंशिवस्तोत्रम्
content:
  english: devi malayajakritam shivastotram devyuvaca | bhavaya bhavanashaya namah papapaharine | paripurnaya
    purnenduvadanaya namo namah || 68|| namo vishvaya pataye vishvarakshavinodine | vedavedantavedyaya
    namaste viditatmane || 69|| sharvaya nirvikaraya shambhave vedhase namah | gangadharaya gauraya girishaya
    namo namah || 70|| papaghnaya bhayaghnaya paranjotisvarupine | virupakshaya viraya vidhatre brahmane
    namah || 71|| avyaktavyaktarupaya vyaktivinyasasakshine | vishvarakshadhvaraikantadikshitaya namo
    namah || 72|| namah somavatamsaya dhatre bhasmangaragine | girishayakhileshaya papanashaya te namah
    || 73|| karmane nirmitasheshabhuvanaghnaya harine | vishvatranaya viraya kalarudraya te namah || 74||
    namah papavinashaya papanashaya shambhave | patakadhvantaravaye shivaya''shlishta murtaye || 75||
    namo namo namastubhyam namastubhyam pinakine | namastubhyam namastubhyam namastubhyam namo namah ||
    76|| shivashambho mahadeva devadeva sadashiva | jagannatha jagannatha papanasha namo namah || 77||
    itham stuvantyam tamrayam vismiteshu janeshvapi | tallinganmurtimanagre pratyadrishyata shankarah
    || 78|| iti tamraparnimahatmye ekavimshadhyayantargatam devi malayajakritam shivastotram sampurnam
    | tamraparnimahatmya | adhyaya 21
  devanagari: देवी मलयजाकृतं शिवस्तोत्रम् देव्युवाच । भवाय भवनाशाय नमः पापापहारिणे । परिपूर्णाय पूर्णेन्दुवदनाय
    नमो नमः ॥ ६८॥ नमो विश्वाय पतये विश्वरक्षाविनोदिने । वेदवेदान्तवेद्याय नमस्ते विदितात्मने ॥ ६९॥ शर्वाय
    निर्विकाराय शम्भवे वेधसे नमः । गङ्गाधराय गौराय गिरीशाय नमो नमः ॥ ७०॥ पापघ्नाय भयघ्नाय परञ्जोतिस्वरूपिणे
    । विरूपाक्षाय वीराय विधात्रे ब्रह्मणे नमः ॥ ७१॥ अव्यक्तव्यक्तरूपाय व्यक्तिविन्याससाक्षिणे । विश्वरक्षाध्वरैकान्तदीक्षिताय
    नमो नमः ॥ ७२॥ नमः सोमावतंसाय धात्रे भस्माङ्गरागिणे । गिरीशायाखिलेशाय पापनाशाय ते नमः ॥ ७३॥ कर्मणे
    निर्मिताशेषभुवनघ्नाय हारिणे । विश्वत्राणाय वीराय कालरुद्राय ते नमः ॥ ७४॥ नमः पापविनाशाय पापनाशाय शम्भवे
    । पातकध्वान्तरवये शिवयाऽऽश्लिष्ट मूर्तये ॥ ७५॥ नमो नमो नमस्तुभ्यं नमस्तुभ्यं पिनाकिने । नमस्तुभ्यं
    नमस्तुभ्यं नमस्तुभ्यं नमो नमः ॥ ७६॥ शिवशम्भो महादेव देवदेव सदाशिव । जगन्नाथ जगन्नाथ पापनाश नमो नमः
    ॥ ७७॥ इथं स्तुवन्त्यां ताम्रायां विस्मितेषु जनेष्वपि । तल्लिङ्गान्मूर्तिमानग्रे प्रत्यदृश्यत शङ्करः
    ॥ ७८॥ इति ताम्रपर्णीमाहात्म्ये एकविंशाध्यायान्तर्गतं देवी मलयजाकृतं शिवस्तोत्रं सम्पूर्णम् । ताम्रपर्णीमाहात्म्य
    । अध्याय २१
