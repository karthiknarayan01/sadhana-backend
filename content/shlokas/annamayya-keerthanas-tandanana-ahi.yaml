id: annamayya-keerthanas-tandanana-ahi
category: stotram
name:
  english: Annamayya Keerthanas Tandanana Ahi
content:
  english: adi pallavi brahma mòkate tandanana purè tandanana bhala kanduvagu hinadhikamu lindu levu andariki
    shrihare antaratma | indulo jantukula manta òkate andariki shrihare antaratma || tandanana purè tandanana
    bhala nindara raju nidrincu nidrayunòkate andane bantu nidra mèndaina brahmanudu mèttu bhumiyòkate
    candaludundeti saribhumi yòkate || tandanana purè tandanana bhala anugu devatalakunu ala kama sukha
    mòkate ghana kita pashuvulaku kama sukha mòkate | dina mahoratramulu tègi dhanadhyuna kòkateranam
    vònara nirupedakunu òkkate aviyu || caranam kòrali shishtannamulu tunu naka lòkate tirugu dushtannamulu
    tinu naka lòkate | paraga durgandhamulapai vayu vòkate varasa parimalamupai vayu vòkate || caranama
    kadagi enugu mida kayu èndòkate pudami shunakamu mida bòlayu nèndòkate | papa karmulanu sari gava
    jadiyu shri venkateshvaru nama mòkate || tandanana purè tandanana bhala tandanana brahma mòkate tandanana
    purè tandanana bhala
  devanagari: आदि पल्लवि ब्रह्म मॊकटे तन्दनान पुरॆ तन्दनान भला कन्दुवगु हीनाधिकमु लिन्दु लेवु अन्दरिकि
    श्रीहरे अन्तरात्म । इन्दुलो जन्तुकुल मन्ता ऒकटे अन्दरिकी श्रीहरे अन्तरात्म ॥ तन्दनान पुरॆ तन्दनान
    भला निण्डार राजु निद्रिञ्चु निद्रयुनॊकटे अण्डने बण्टु निद्र मॆण्डैन ब्राह्मणुडु मॆट्टु भूमियॊकटे चण्डालुडुण्डेटि
    सरिभूमि यॊकटे ॥ तन्दनान पुरॆ तन्दनान भला अनुगु देवतलकुनु अल काम सुख मॊकटे घन कीट पशुवुलकु काम सुख
    मॊकटे । दिन महोरात्रमुलु तॆगि धनाढ्युन कॊकटेरणम् वॊनर निरुपेदकुनु ऒक्कटे अवियु ॥ चरणं कॊरलि शिष्टान्नमुलु
    तुनु नाक लॊकटे तिरुगु दुष्टान्नमुलु तिनु नाक लॊकटे । परग दुर्गन्धमुलपै वायु वॊकटे वरस परिमलमुपै वायु
    वॊकटे ॥ चरणम कडगि एनुगु मीद कायु ऎण्डॊकटे पुडमि शुनकमु मीद बॊलयु नॆण्डॊकटे । पाप कर्मुलनु सरि गाव
    जडियु श्री वेङ्कटेश्वरु नाम मॊकटे ॥ तन्दनान पुरॆ तन्दनान भला तन्दनान ब्रह्म मॊकटे तन्दनान पुरॆ तन्दनान
    भला
