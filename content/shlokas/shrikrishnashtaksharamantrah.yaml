id: shrikrishnashtaksharamantrah
category: mantra
name:
  english: shrikrishnashtaksharamantrah
  devanagari: श्रीकृष्णाष्टाक्षरमन्त्रः
content:
  english: shrikrishnashtaksharamantrah || viniyogah || asya shrikrishnashtaksharamantrasya narada rishih
    | anushtupchandah | shrikrishno devata | shrim bijam | hrim shaktih | klim kilakam | sarvabhishtasiddhyarthe
    jape viniyogah || || rishyadinyasah || naradarishaye namah shirasi | anushtupchandase namah mukhe
    | shrikrishnadevatayai namah hridi | shrim bijaya namah guhye | hrim shaktaye namah nabhau | klim
    kilakaya namah padayoh | viniyogaya namah sarvange || || karanyasah || om klam angushthabhyam namah
    | om klim tarjanibhyam namah | om klum madhyamabhyam namah | om klaim anamikabhyam namah | om klaum
    kanishthikabhyam namah | om klah karatalakaraprishthabhyam namah || || shadanganyasah || om klam hridayaya
    namah | om klim shirase svaha | om klum shikhayai vashat | om klaim kavacaya hum | om klaum netratrayaya
    vaushat | om klah astraya phat || || dhyanam || kalapakusumashyamam vrindavanagatam harim | gopagopigavavitam
    pitavastrayugavritam || nanalankarasubhagam kaustubhodbhasivakshasam | sanakadimunishreshthaih samstutam
    paraya muda || shankhacakralasadbahum venuhastadvayeritam | mandasmitamukhambhojam nilameghanibhaprabham
    || barhapidakritottamsam vanamalavirajitam | shrivatsankitavakshaskam bhaktanugrahakarakam || radhalingitavamangam
    gopijanamanoharam | vrindavanaviharinam vande nandatmajam harim || || mantrah || shrim hrim klim krishnaya
    svaha || iti shrikrishnashtaksharamantrah mantrah |
  devanagari: श्रीकृष्णाष्टाक्षरमन्त्रः ॥ विनियोगः ॥ अस्य श्रीकृष्णाष्टाक्षरमन्त्रस्य नारद ऋषिः । अनुष्टुप्छन्दः
    । श्रीकृष्णो देवता । श्रीं बीजम् । ह्रीं शक्तिः । क्लीं कीलकम् । सर्वाभीष्टसिद्ध्यर्थे जपे विनियोगः
    ॥ ॥ ऋष्यादिन्यासः ॥ नारदऋषये नमः शिरसि । अनुष्टुप्छन्दसे नमः मुखे । श्रीकृष्णदेवतायै नमः हृदि । श्रीं
    बीजाय नमः गुह्ये । ह्रीं शक्तये नमः नाभौ । क्लीं कीलकाय नमः पादयोः । विनियोगाय नमः सर्वाङ्गे ॥ ॥ करन्यासः
    ॥ ॐ क्लां अङ्गुष्ठाभ्यां नमः । ॐ क्लीं तर्जनीभ्यां नमः । ॐ क्लूं मध्यमाभ्यां नमः । ॐ क्लैं अनामिकाभ्यां
    नमः । ॐ क्लौं कनिष्ठिकाभ्यां नमः । ॐ क्लः करतलकरपृष्ठाभ्यां नमः ॥ ॥ षडङ्गन्यासः ॥ ॐ क्लां हृदयाय नमः
    । ॐ क्लीं शिरसे स्वाहा । ॐ क्लूं शिखायै वषट् । ॐ क्लैं कवचाय हुं । ॐ क्लौं नेत्रत्रयाय वौषट् । ॐ क्लः
    अस्त्राय फट् ॥ ॥ ध्यानम् ॥ कलापकुसुमश्यामं वृन्दावनगतं हरिम् । गोपगोपीगवावीतं पीतवस्त्रयुगावृतम् ॥
    नानालङ्कारसुभगं कौस्तुभोद्भासिवक्षसम् । सनकादिमुनिश्रेष्ठैः संस्तुतं परया मुदा ॥ शङ्खचक्रलसद्बाहुं
    वेणुहस्तद्वयेरितम् । मन्दस्मितमुखाम्भोजं नीलमेघनिभप्रभम् ॥ बर्हापीडकृतोत्तंसं वनमालाविराजितम् । श्रीवत्साङ्कितवक्षस्कं
    भक्तानुग्रहकारकम् ॥ राधालिङ्गितवामाङ्गं गोपीजनमनोहरम् । वृन्दावनविहारिणं वन्दे नन्दात्मजं हरिम् ॥
    ॥ मन्त्रः ॥ श्रीं ह्रीं क्लीं कृष्णाय स्वाहा ॥ इति श्रीकृष्णाष्टाक्षरमन्त्रः मन्त्रः ।
