id: narayaniya
category: stotram
name:
  english: narayaniya
  devanagari: नरयनिय
content:
  english: kancitkancinakancilacchitalasatpitambaralambiniim alambe vimalambujadyutipadam murtim tavarticchidam
    ||
  devanagari: काञ्चित्काञ्चिनकाञ्चिलाच्छितलसत्पीताम्बरालम्बिनीइम् आलम्बे विमलाम्बुजद्युतिपदां मूर्तिं
    तवार्तिच्छिदम् ॥
