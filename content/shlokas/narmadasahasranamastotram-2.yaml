id: narmadasahasranamastotram-2
category: sahasranama
name:
  english: narmadasahasranamastotram 2
  devanagari: नर्मदासहस्रनामस्तोत्रम् २
content:
  english: '|| 29|| pundarikavishalakshi pundradharanapundini | putana putrapali ca purusharthaprasadhini
    || 30|| padastha papadamani padapankajasevita | phalada phalarupa ca phaleshi phalavardhini || 31||
    phunkari phanipali ca phaneshi pannageshvari | phutkari phalada pheki phaleshi phalaposhini || 32||
    phatakara phanadarshi phalguni phalasadhini | phalguni phalgunaprita phalguh phalguphalatmika || 33||
    phunkari phaladatri ca nihsphulinga sphulingini | balika balikamala bala buddhivivardhini || 34||
    varada vararupa ca varamata vareshvari | bagala vagvilasi ca vacani vacanapriya || 35|| vatsala vatsaleshi
    ca vajrini vajradharini | balika balikavastha bahudandavilasini || 36|| bahuni bahuvarada vartini
    vartula bala | vithini vidhika vici vikata vikateshvari || 37|| brahmarupa vishnuprita brahmavishnushivatmika
    | varakshi vamana vama vamika varadayika || 38|| brahmi bala varahica varakshi vikritanana | vasishtha
    vadini vakya vadyarupa vareshvari || 39|| bashatkara vakeshi ca bakadalabhyapalika | vaguri vikasaddaktra
    vakrini vakrakarini || 40|| vakrarupa vakradhara vakreshi vakrabhashini | vyakta''vyaktaca balada
    balesha brahmacarini || 41|| badarashramasamstha ca badarashramavasini | badariphalasantushta badari
    badarishvari || 42|| badariphalasandoha badariphalabhavini | badariphalasampujya badariphalatoshita
    || 43|| badariphalasamsneha badariphalabhavini | varada varadeshi ca vasishthadyaissupujita || 44||
    vishvamitrasadapali vishvambhari vicakshani | vishvambhara vishvarupa vishvatma vishvapalini || 45||
    vishveshi vishvahantri ca vishvatma vishvaposhini | viraha virata vira bibhishanavaraprada || 46||
    vishvamitrabrihatsneha vishvaha vishvarupini | bhavani bhutabhavya ca bhavapashavimocani || 47|| bhogini
    bhogakari ca bhogada bhogavardhini | bhishana bhishaneshi ca bhima bhimaparakrama || 48|| bhikshukapalini
    bhuti bhudhara bhudharatmaja | bhushana bhutapali ca bhujeshi bhoganayini || 49|| bhutatma bhutasamrakshi
    bhutida bhutibhushana | bhavada bhavahantri ca bhavashoka vinashini || 50|| bhramari bhramarakara
    bhutabhavanabhavini | bharadvajasadapujya bhushita bhushiteshvari || 51|| bhakshini bhalluka bhisha
    bhairavi bhavanashini | bhanupujya bhanurata bhavani bhuvaneshvari || 52|| bhutala bhutaleshi ca bhutali
    bhutalatmika | bhogini bhogadatri ca bhogada bhogavardhini || 53|| bhagatmika bhagavati bhageshi bhagapujita
    | bhaskari bhaskaraprita bhasvati bhasakarini || 54|| bhashani bhashini bhama bhajani bhavarupadhrik
    | bhattini bhattasampujya bhattanam buddhivardhini || 55|| bhupashrirbhupasamrakshi bhupatma bhupapalika
    | bhupasakshi bhuparata bhumipa bhumidharini || 56|| bhumibhogarata maya bhaumapujyasanatani | bhumida
    bhumijanani bhumisthita bhayapaha || 57|| bhavuka bhavanasha ca bhurida bhumipalika | bhuvana bhuvanesha
    ca bhuvanaikasupalika || 59|| bhuripujarata nitya bhurida bhuribhogini | bhutanathasadaprita bhutanathasupujita
    || 60|| bhutanathasadapali bhutanathapraharshini | bhairavapritimapanna bhairavanandavardhini || 61||
    bhikshupali bhikshukeshi bhikshuda bhikshurakshini | bhedakari ca bhedeshi bhitida bhitighatini ||
    62|| bhitirakshakaritamba bhitirupa bhayatmika | bhasmacandanasamyukta bhalaraksha ca bhalini || 63||
    bhalapritikari bhalla bhallantakavidarini | mohini mehanesha ca mahila madanasura || 64|| mahamaya
    mahadevi mahamohavinashini | mahayogarata reva madira madirekshana || 65|| makharupa makheshi ca makhaga
    makhadharini | manini manada manya moharatri maheshvari || 66|| margani marganaprita margada margarakshini
    | mantrarupa mantrakari mancali mancaleshvari || 67|| mokshada mohadatri ca mokshaha mokshakarini
    | matsara matsaraprita matsaratma makhantakrit || 68|| marjani marjanarata marjana marjaneshvari |
    mihika medhrini meha medhra medhravivardhani || 69|| manorupa manastha ca manasi manamohini | manasvini
    manasthairya manaka manamanini || 70|| manorupa manabhava manabhavavidarini | mantrini mantramaya
    ca mantratma mantrapalini || 71|| mantraha mantrasamprita mantriki mantrakarini | makheshi makhakari
    ca makharupa makheshvari || 72|| manthini manthanadhisha manthane shasyapalika | madana madarupa ca
    madaha madabhanjani || 73|| medura medurakshi ca meduratma madeshvari | mararupa marakari martandi
    maravardhini || 74|| marashantikari maya manasaika manasvini | mangala mangalakara mangalatma mahasuri
    || 75|| madhyanilambamadhyastha madhyama madhyarakshini | mahati manjana mota mataka maratatmika ||
    76|| malaha malavidhvamsa malasantoshakarini | janani ca jagaddhatri jahnavi jagadambika || 77|| yogamaya
    jagajjetri janitri janani jara | jathara yogasiddha ca yogakshi yogavardhini || 78|| yogasamrakshini
    yogya yoginam gatidayini | yogasamrakshanaprita jagattrayaviharini || 79|| yogarakshakari yogya yogasammohakarini
    | yogini yogisamsevya yogaha yogapalika || 80|| jagadatma jagadrupa jaganti jagati jagat | jaghana
    jaghaneshi ca yakshini yakshapalika || 81|| yakshasammohanirata yakshatma yakshabhedini | tryakshari
    tryakshareshi ca yakshada yakshakarini || 84|| yakshada yakshamata ca yakshasampritivardhini | jagaddhatri
    jagajjetri jayakrit jayadayini || 83|| yamuna yamunapali yamashankanivarini | yogeshi yogamaya ca
    jahnavi jatharatmika || 84|| yantrarupa yantramayi janabhaktivivardhini | janeshi janasamrakshi janaki
    jagadambika || 85|| yuddhaniyuddhaprita ca yuddhabhaktipravardhini | yodhani yodhasamprita yuddhakaryapradarshini
    || 86|| yuddhariryuddhamata ca yuddhatma yuddhabhavini | jagadranjanakari ca janata janakatmika ||
    87|| yogarupa yogadhara yogini yogamanini | jayarupa jayamayi jayatma jayaneshvari || 88|| jayaha
    jayasamrakshi jayasammohadharini | jivanti yuvatirjiva jivani jivarakshika || 89|| jivapali jivabhedi
    jivaha jivapalika | jiveshi jivasammoha jivakautukadharini || 90|| jivana jivanarambha jivani jagaduhini
    | ramani rankini reva renuka ranarakshini || 91|| rajakarmarata''nanta rakshana rakshaneshvari | rakshika
    rakshasabhakshya rakshasadivimardini || 92|| rogaha rogakari ca rogatma roganashini | raghurajasadapujya
    raghuvamshavivardhini || 93|| ramakaryakari rama ramarajyapratishthita | ramani ramani rajni rajyashri
    rajyabhanjini || 94|| rakshini rakshikaraksha raksheshi rakshanatmika | rajaki rajika rajya rajayogavilasini
    || 95|| rathini rathasamprita rathatma rathakarini | ratirupa rupadhari rupatma rupadharini || 96||
    rupaha rupasambhedi rupakshi rupakarika | rakapatisadabhita rakapativibhedini || 97|| rakapatisadalina
    rakapatisupujita | rasabhi rasabhaprota rasabha rasamandini || 98|| rajakelisamakranta ramarajyapratishthita
    | ranjani rangarupa ca rahudharmakari sada || 99|| rahushirshacchida roha rahurupapradharshini | ramani
    revati ramya rohini ratibhogini || 100|| ratipujyatama loke ratimanavibhedini | lolakshi lakshana
    lakshmi lokapala lakavali || 101|| lankapali ca lankeshi lokalokaprapujita | lolekshana lomapali lomeshi
    lokapalika || 102|| laksha laksharuna laksha lakshana lakshyagocari | lalitangi lolaratirlilabalaviharini
    || 103|| lalasarunaliptangi lalita lalaneshvari | lokeshi lokapali ca lokatma lokarakshini || 104||
    lokastha lokasakshi ca lokalokavilasini | rocani rocana lola lilalasyaviharini || 105|| lakshana lakshita
    lakshya lakshagrahavinashini | lajjamayi lokalajja lajjotpattipracarini || 106|| lopamudra lomaki
    ca lipsa collipsita sada || lavanabdhitari lanka lankeshi lankapalika || 107|| lobhada lobhahantri
    ca lobhamohapraharini | lobhashantikarimantra lomeshi lomashatmika || 108|| lalasavardhini lasya lakshika
    lakshyadayini | vantikavaradaprokta viryada viryavardhini || 109|| vikalavasthini vandya vandanapriyavandana
    | vasita vasitagara viphala vyomadharini || 110|| savitri sharada sandhya shambhavi shankari shiva
    | sukeshi shobhana saumya satviki satyadharini || 111|| satya satyatmika shesha raka shashisvaratmika
    | shokada shokanashi ca shokaha shokavardhini || 112|| saguna shokahantri ca sakshini sukshmarupabhak
    | svaksha svakshavinikshipta shinjana shinjanavati || 113|| shatini shatashubhra ca shaureyi shekhareshvari
    | satyaha satyapali ca shatruha shatrunashini || 114|| shatrusammohini satya shatrunam buddhinashini
    | susthala susthali svastha sundari sundara sada || 115|| sudhana shuddhamanasya sudharnavanivasini
    | sudhasagarasambhuta sudhashi shuddhacandika || 116|| shunyarupa shunyamayi shunyashunyanivasini
    | sarpabhusha sarpadhari sapeshi sarpaharini || 117|| svapnavati sushuptistha sarvastha sarvapalini
    | sarvangi sadhushila ca sushila sulabhavati || 118| saphala shobhana shobha subhama shubhaga shubha
    | somodbhava somasuta somatma somakanyaka || 119|| somaja samata soma saumya saumyaviharini | surajya
    surata surya sureshi suratih svara || 120|| suratmaja surasuta suratha shuravardhini | shulaha shulabhricchrilabhitshuladhritambara
    || 121|| shulaja shulaja shula sushila ca sulocana | sharvari sharvaraprita shayana shayaneshvari
    || 122|| sahaja simlhika simhi simhika simhapalini | khangini khangika khangi khageshi khagagamini
    || 123|| khalaghni khalasammoha khalarupa khalapriya | khalaja sadhushila ca shabari shabaratmika
    || 124|| shankari shankaraprita shankarapriyakarika | saundari sundari saudha sudhasindhunivasini
    || 125|| sarvada sarvamanya ca sarvatma sarvabhogini | savara sarvada sarva sarvastha sarvabhushani
    || 126|| sarvarudha suvarta ca suvartavacaneshvari | sakshini dharmasetunam sadhini sarvakarmanam
    || 127|| supta suptotthita shyama shyamala saukhyakarini | saukhyada saukhyapali ca saukhyaghna saukhyabhogini
    || 128|| sudati sumukhi smera suvasa sharadambika | sarita sharada saura saureyi somakarini || 129||
    suvacassukhada svaksha svakshani svakshaneshvari | hasini harshini hamsi hamsaga hamsadharini || 130||
    hathini harshasamvardhirharaharaviharini | hanumatpritimapanna harirupa haripriya || 131|| haryakshi
    harini hantri heramba haravallabha | hrishikeshi sadasneha halahalavimardini || 132|| halaha halarupa
    ca haraika haratoshini | padmini chedanaprita chandeshi chandakarini || 133|| chalatma chalabhaidi
    ca kshudrabuddhivinashini | chatrini chatrada chatra succhatra chatrakarini || 134|| adirupa adimaya
    adya amba ca ambari | akshanirakshadhari ca adishakti rajeshvari || 135|| aja ca ajani amba ajatma
    ajaposhini | attahasa attarupa agnistha agnirupini || 136|| avartya arbuda oja ashoka shokaharini
    | adistha anjani anja ajaneyambikashini || 137|| ishvari ishapali ca ishana ishavasini | ida ishavilasa
    ca ishastha ishaposhini || 138|| itida itihantri ca itibhitivimardini | uma umapatiprita umapativiharini
    || 139|| aishvaryyadayinyaishvarya ekatmanekasambhava | kalika kamini kanta kamini kamabhogini ||
    140|| kautuki kamala kali kalyani kamaleshvari | kashi kanci ca kaveri kailasi keshavi kavih || 141||
    kamada kantida kantih kartiki krittika kriya | kartaviryavilasa ca kartaviryaprabodhini || 142|| kurukshetranivasa
    ca kurukulla kapalini | kumari kulaja kantih kapali keshapalini || 143|| kaulini kanjadhari ca kanjakshi
    kanjapalini | kanjapushpasadaprita kajjamalaviharini || 144|| kajjastha kanjini kaya kayastha kayasundari'
  devanagari: ॥ २९॥ पुण्डरीकविशालाक्षी पुण्ड्रधारणपुण्डिणी । पूतना पुत्रपाली च पुरुषार्थप्रसाधिनी ॥ ३०॥
    पदस्था पापदमनी पादपङ्कजसेविता । फलदा फलरूपा च फलेशी फलवर्धिनी ॥ ३१॥ फुङ्कारी फणिपाली च फणेशी पन्नगेश्वरी
    । फूत्कारी फलदा फेकी फलेशी फलपोषिणी ॥ ३२॥ फटाकारा फणादर्शी फल्गुनी फलसाधिनी । फल्गुनी फाल्गुनप्रीता
    फल्गुः फल्गुफलात्मिका ॥ ३३॥ फूङ्कारी फलदात्री च निःस्फुलिङ्गा स्फुलिङ्गिनी । बालिका बालिकामाला बाला
    बुद्धिविवर्धिनी ॥ ३४॥ वरदा वररूपा च वरमाता वरेश्वरी । बगला वाग्विलासी च वाचनी वचनप्रिया ॥ ३५॥ वत्सला
    वत्सलेशी च वज्रिणी वज्रधारिणी । बालिका बालिकावस्था बाहुदण्डविलासिनी ॥ ३६॥ बाहुनी बाहुवरदा वर्तिनी
    वर्तुला बला । वीथिनी विधिका वीचि विकटा विकटेश्वरी ॥ ३७॥ ब्रह्मरूपा विष्णुप्रीता ब्रह्मविष्णुशिवात्मिका
    । वराक्षी वामना वामा वामिका वरदायिका ॥ ३८॥ ब्राह्मी बाला वराहीच वराक्षी विकृतानना । वसिष्ठा वादिनी
    वाक्या वाद्यरूपा वरेश्वरी ॥ ३९॥ बषट्कारा वकेशी च बकदालभ्यपालिका । वागुरी विकसद्दक्त्रा वक्रिणी वक्रकारिणी
    ॥ ४०॥ वक्ररूपा वक्रधरा वक्रेशी वक्रभाषिणी । व्यक्ताऽव्यक्ताच बलदा बलेशा ब्रह्मचारिणी ॥ ४१॥ बदराश्रमसंस्था
    च बदराश्रमवासिनी । बदरीफलसन्तुष्टा बदरी बदरीश्वरी ॥ ४२॥ बदरीफलसन्दोहा बदरीफलभाविनी । बदरीफलसम्पूज्या
    बदरीफलतोषिता ॥ ४३॥ बदरीफलसंस्नेहा बदरीफलभाविनी । वरदा वरदेशी च वसिष्ठाद्यैस्सुपूजिता ॥ ४४॥ विश्वामित्रसदापाली
    विश्वम्भरी विचक्षणी । विश्वम्भरा विश्वरूपा विश्वात्मा विश्वपालिनी ॥ ४५॥ विश्वेशी विश्वहन्त्री च विश्वात्मा
    विश्वपोषिणी । वीरहा विरता वीरा बिभीषणवरप्रदा ॥ ४६॥ विश्वामित्रबृहत्स्नेहा विश्वहा विश्वरूपिणी । भवानी
    भूतभव्या च भवपाशविमोचनी ॥ ४७॥ भोगिनी भोगकारी च भोगदा भोगवर्धिनी । भीषणा भीषणेशी च भीमा भीमपराक्रमा
    ॥ ४८॥ भिक्षुकापालिनी भूति भूधरा भूधरात्मजा । भूषणा भूतपाली च भूजेशी भोगनायिनी ॥ ४९॥ भूतात्मा भूतसंरक्षी
    भूतिदा भूतिभूषणा । भवदा भवहन्त्री च भवशोक विनाशिनी ॥ ५०॥ भ्रामरी भ्रमराकारा भूतभावनभाविनी । भारद्वाजसदापूज्या
    भूषिता भूषितेश्वरी ॥ ५१॥ भक्षिणी भल्लुका भीषा भैरवी भवनाशिनी । भानुपूज्या भानुरता भवानी भुवनेश्वरी
    ॥ ५२॥ भूतला भूतलेशी च भूतली भूतलात्मिका । भोगिनी भोगदात्री च भोगदा भोगवर्धिनी ॥ ५३॥ भगात्मिका भगवती
    भगेशी भगपूजिता । भास्करी भास्करप्रीता भास्वती भासकारिणी ॥ ५४॥ भाषणी भाषिणी भामा भजनी भवरूपधृक् । भट्टिनी
    भट्टसम्पूज्या भट्टानां बुद्धिवर्धिनी ॥ ५५॥ भूपश्रीर्भूपसंरक्षी भूपात्मा भूपपालिका । भूपसाक्षी भूपरता
    भूमिपा भूमिधारिणी ॥ ५६॥ भूमिभोगरता माया भौमपूज्यासनातनी । भूमिदा भूमिजननी भूमिस्थिता भयापहा ॥ ५७॥
    भावुका भवनाशा च भूरिदा भूमिपालिका । भुवना भुवनेशा च भुवनैकसुपालिका ॥ ५९॥ भूरिपूजारता नित्या भूरिदा
    भूरिभोगिनी । भूतनाथसदाप्रीता भूतनाथसुपूजिता ॥ ६०॥ भूतनाथसदापाली भूतनाथप्रहर्षिणी । भैरवप्रीतिमापन्ना
    भैरवानन्दवर्धिनी ॥ ६१॥ भिक्षुपाली भिक्षुकेशी भिक्षुदा भिक्षुरक्षिणी । भेदकारी च भेदेशी भीतिदा भीतिघातिनी
    ॥ ६२॥ भीतिरक्षाकरिताम्बा भीतिरूपा भयात्मिका । भस्मचन्दनसंयुक्ता भालरक्षा च भालिनी ॥ ६३॥ भालप्रीतिकरी
    भल्ला भल्लान्तकविदारिणी । मोहिनी मेहनेशा च महिला मदनासुरा ॥ ६४॥ महामाया महादेवी महामोहविनाशिनी । महायोगरता
    रेवा मदिरा मदिरेक्षणा ॥ ६५॥ मखरूपा मखेशी च मखगा मखधारिणी । मानिनी मानदा मान्या मोहरात्रि महेश्वरी
    ॥ ६६॥ मार्गणी मार्गणप्रीता मार्गदा मार्गरक्षिणी । मन्त्ररूपा मन्त्रकरी मञ्चाली मञ्चलेश्वरी ॥ ६७॥ मोक्षदा
    मोहदात्री च मोक्षहा मोक्षकारिणी । मत्सरा मत्सरप्रीता मत्सरात्मा मखान्तकृत् ॥ ६८॥ मार्जनी मार्जनरता
    मार्जना मार्जनेश्वरी । मिहिका मेढ्रिणी मेहा मेढ्रा मेढ्रविवर्धनी ॥ ६९॥ मनोरूपा मनस्था च मानसी मनमोहिनी
    । मनस्विनी मनस्थैर्या मानका मानमानिनी ॥ ७०॥ मनोरूपा मानभावा मानभावविदारिणी । मन्त्रिणी मन्त्रमाया
    च मन्त्रात्मा मन्त्रपालिनी ॥ ७१॥ मन्त्रहा मन्त्रसम्प्रीता मान्त्रिकी मन्त्रकारिणी । मखेशी मखकारी च
    मखरूपा मखेश्वरी ॥ ७२॥ मन्थिनी मन्थनाधीशा मन्थने शस्यपालिका । मदना मदरूपा च मदहा मदभञ्जनी ॥ ७३॥ मेदुरा
    मेदुराक्षी च मेदुरात्मा मदेश्वरी । माररूपा मारकारी मार्तण्डी मारवर्धिनी ॥ ७४॥ मारशान्तिकरी माया मानसैका
    मनस्विनी । मङ्गला मङ्गलाकारा मङ्गलात्मा महासुरी ॥ ७५॥ मध्यनीलम्बमध्यस्था मध्यमा मध्यरक्षिणी । महती
    मञ्जना मोटा मटका मरटात्मिका ॥ ७६॥ मलहा मलविध्वंसा मलसन्तोषकारिणी । जननी च जगद्धात्री जाह्नवी जगदम्बिका
    ॥ ७७॥ योगमाया जगज्जेत्री जनित्री जननी जरा । जठरा योगसिद्धा च योगाक्षी योगवर्धिनी ॥ ७८॥ योगसंरक्षिणी
    योग्या योगिनां गतिदायिनी । योगसंरक्षणप्रीता जगत्त्रयविहारिणी ॥ ७९॥ योगरक्षाकरी योग्या योगसम्मोहकारिणी
    । योगिनी योगिसंसेव्या योगहा योगपालिका ॥ ८०॥ जगदात्मा जगद्रूपा जगन्ती जगती जगत् । जघना जघनेशी च यक्षिणी
    यक्षपालिका ॥ ८१॥ यक्षसम्मोहनिरता यक्षात्मा यक्षभेदिनी । त्र्यक्षरी त्र्यक्षरेशी च यक्षदा यक्षकारिणी
    ॥ ८४॥ यक्षदा यक्षमाता च यक्षसम्प्रीतिवर्धिनी । जगद्धात्री जगज्जेत्री जयकृत् जयदायिनी ॥ ८३॥ यमुना यमुनापाली
    यमशङ्कानिवारिणी । योगेशी योगमाया च जाह्नवी जठरात्मिका ॥ ८४॥ यन्त्ररूपा यन्त्रमयी जनभक्तिविवर्धिनी
    । जनेशी जनसंरक्षी जानकी जगदम्बिका ॥ ८५॥ युद्धनियुद्धप्रीता च युद्धभक्तिप्रवर्धिनी । योधनि योधसम्प्रीता
    युद्धकार्यप्रदर्शिनी ॥ ८६॥ युद्धारिर्युद्धमाता च युद्धात्मा युद्धभाविनी । जगद्रञ्जनकारी च जनता जनकात्मिका
    ॥ ८७॥ योगरूपा योगधरा योगिनी योगमानिनी । जयरूपा जयमयी जयात्मा जयनेश्वरी ॥ ८८॥ जयहा जयसंरक्षी जयसम्मोहधारिणी
    । जीवन्ती युवतिर्जीवा जीवनी जीवरक्षिका ॥ ८९॥ जीवपाली जीवभेदी जीवहा जीवपालिका । जीवेशी जीवसम्मोहा जीवकौतुकधारिणी
    ॥ ९०॥ जीवना जीवनारम्भा जीवनी जगदूहिनी । रमणी रङ्किणी रेवा रेणुका रणरक्षिणी ॥ ९१॥ राजकर्मरताऽनन्ता
    रक्षणा रक्षणेश्वरी । रक्षिका राक्षसाभक्ष्या राक्षसादिविमर्दिनी ॥ ९२॥ रोगहा रोगकारी च रोगात्मा रोगनाशिनी
    । रघुराजसदापूज्या रघुवंशविवर्धिनी ॥ ९३॥ रामकार्यकरी रामा रामराज्यप्रतिष्ठिता । रमणी रामणी राज्ञी राज्यश्री
    राज्यभञ्जिनी ॥ ९४॥ रक्षिणी रक्षिकारक्षा रक्षेशी रक्षणात्मिका । राजकी राजिका राज्या राजयोगविलासिनी
    ॥ ९५॥ रथिनी रथसम्प्रीता रथात्मा रथकारिणी । रतिरूपा रूपधारी रूपात्मा रूपधारिणी ॥ ९६॥ रूपहा रूपसम्भेदी
    रूपाक्षी रूपकारिका । राकापतिसदाभीता राकापतिविभेदिनी ॥ ९७॥ राकापतिसदालीना राकापतिसुपूजिता । रासभी रासभप्रोता
    रासभा रासमण्डिनी ॥ ९८॥ राजकेलीसमाक्रान्ता रामराज्यप्रतिष्ठिता । रञ्जनी रङ्गरूपा च राहुधर्मकरी सदा
    ॥ ९९॥ राहुशीर्षच्छिदा रोहा राहुरूपप्रधर्षिणी । रमणी रेवती रम्या रोहिणी रतिभोगिनी ॥ १००॥ रतिपूज्यतमा
    लोके रतिमानविभेदिनी । लोलाक्षी लक्षणा लक्ष्मी लोकपाला लकावली ॥ १०१॥ लङ्कापाली च लङ्केशी लोकालोकप्रपूजिता
    । लोलेक्षणा लोमपाली लोमेशी लोकपालिका ॥ १०२॥ लाक्षा लाक्षारुणा लक्षा लक्षणा लक्ष्यगोचरी । ललिताङ्गी
    लोलरतिर्लीलाबालविहारिणी ॥ १०३॥ लालसारुणलिप्ताङ्गी लालिता लालनेश्वरी । लोकेशी लोकपाली च लोकात्मा लोकरक्षिणी
    ॥ १०४॥ लोकस्था लोकसाक्षी च लोकालोकविलासिनी । रोचनी रोचना लोला लीलालास्यविहारिणी ॥ १०५॥ लक्षणा लक्षिता
    लक्ष्या लक्षग्रहविनाशिनी । लज्जामयी लोकलज्जा लज्जोत्पत्तिप्रचारिणी ॥ १०६॥ लोपामुद्रा लोमकी च लिप्सा
    चोल्लिप्सिता सदा ॥ लवणाब्धितरी लङ्का लङ्केशी लङ्कपालिका ॥ १०७॥ लोभदा लोभहन्त्री च लोभमोहप्रहारिणी
    । लोभशान्तिकरीमन्त्रा लोमेशी लोमशात्मिका ॥ १०८॥ लालसावर्धिनी लास्या लक्षिका लक्ष्यदायिनी । वन्तिकावरदप्रोक्ता
    वीर्यदा वीर्यवर्धिनी ॥ १०९॥ विकलावस्थिनी वन्द्या वन्दनप्रियवन्दना । वासिता वासितागारा विफला व्योमधारिणी
    ॥ ११०॥ सावित्री शारदा सन्ध्या शाम्भवी शाङ्करी शिवा । सुकेशी शोभना सौम्या सात्विकी सत्यधारिणी ॥ १११॥
    सत्या सत्यात्मिका शेषा राका शशिस्वरात्मिका । शोकदा शोकनाशी च शोकहा शोकवर्धिनी ॥ ११२॥ सगुणा शोकहन्त्री
    च साक्षिणी सूक्ष्मरूपभाक् । स्वक्षा स्वक्षविनिक्षिप्ता शिञ्जना शिञ्जनावती ॥ ११३॥ शाटिनी शाटशुभ्रा
    च शौरेयी शेखरेश्वरी । सत्यहा सत्यपाली च शत्रुहा शत्रुनाशिनी ॥ ११४॥ शत्रुसम्मोहिनी सत्या शत्रूणां बुद्धिनाशिनी
    । सुस्थला सुस्थली स्वस्था सुन्दरी सुन्दरा सदा ॥ ११५॥ सुधना शुद्धमानस्या सुधार्णवनिवासिनी । सुधासागरसम्भूता
    सुधाशी शुद्धचन्दिका ॥ ११६॥ शून्यरूपा शून्यमयी शून्याशून्यनिवासिनी । सर्पभूषा सर्पधरी सपेशी सर्पहारिणी
    ॥ ११७॥ स्वप्नावती सुषुप्तिस्था सर्वस्था सर्वपालिनी । सर्वाङ्गी साधुशीला च सुशीला सुलभावती ॥ ११८। सफला
    शोभना शोभा सुभामा शुभगा शुभा । सोमोद्भवा सोमसुता सोमात्मा सोमकन्यका ॥ ११९॥ सोमजा समता सोमा सौम्या
    सौम्यविहारिणी । सुराज्य सुरता सूर्या सुरेशी सुरतिः स्वरा ॥ १२०॥ सुरात्मजा सुरसुता सुरथा शूरवर्धिनी
    । शूलहा शूलभृच्छृलभित्शूलधृताम्बरा ॥ १२१॥ शूलजा शूलजा शूला सुशिला च सुलोचना । शर्वरी शर्वरप्रीता शयना
    शयनेश्वरी ॥ १२२॥ सहजा सिंल्हिका सिंही सिंहिका सिंहपालिनी । खङ्गिनी खङ्गिका खङ्गी खगेशी खगगामिनी ॥
    १२३॥ खलघ्नी खलसम्मोहा खलरूपा खलप्रिया । खलजा साधुशीला च शबरी शबरात्मिका ॥ १२४॥ शाङ्करी शङ्करप्रीता
    शङ्करप्रियकारिका । सौन्दरी सुन्दरी सौधा सुधासिन्धुनिवासिनी ॥ १२५॥ सर्वदा सर्वमान्या च सर्वात्मा सर्वभोगिनी
    । सवरा सर्वदा सर्वा सर्वस्था सर्वभूषणी ॥ १२६॥ सर्वारूढा सुवार्ता च सुवार्तावचनेश्वरी । साक्षिणी धर्मसेतूनां
    साधिनी सर्वकर्मणाम् ॥ १२७॥ सुप्ता सुप्तोत्थिता श्यामा श्यामला सौख्यकारिणी । सौख्यदा सौख्यपाली च सौख्यघ्ना
    सौख्यभोगिणी ॥ १२८॥ सुदती सुमुखी स्मेरा सुवासा शरदम्बिका । सरिता शारदा सौरा सौरेयी सोमकारिणी ॥ १२९॥
    सुवचास्सुखदा स्वक्षा स्वक्षणी स्वक्षणेश्वरी । हासिनी हर्षिणी हंसी हंसगा हंसधारिणी ॥ १३०॥ हठिनी हर्षसंवर्धिर्हराहरविहारिणी
    । हनूमत्प्रीतीमापन्ना हरिरूपा हरिप्रिया ॥ १३१॥ हर्यक्षी हारिणी हन्त्री हेरम्बा हरवल्लभा । हृशिकेषि
    सदास्नेहा हलाहलविमर्दिनी ॥ १३२॥ हलहा हलरूपा च हरैका हरतोषिणी । पद्मिनी छेदनप्रीता छन्देशी छन्दकारिणी
    ॥ १३३॥ छलात्मा छलभैदी च क्षुद्रबुद्धिविनाशिनी । छत्रिणी छत्रदा छत्रा सुच्छत्रा छत्रकारिणी ॥ १३४॥ आदिरूपा
    आदिमाया आद्या अम्बा च अम्बरी । अक्षनीरक्षधारी च आदिशक्ति राजेश्वरी ॥ १३५॥ अजा च अजनी अम्बा अजात्मा
    अजपोषिणी । अट्टहासा अट्टरूपा अग्निस्था अग्निरूपिणी ॥ १३६॥ अवर्त्या अर्बुदा ओजा अशोका शोकहारिणी । आदिस्था
    अञ्जनी अञ्जा अजानेयाम्बिकाशिनी ॥ १३७॥ ईश्वरी ईशपाली च ईशाना ईशवासिनी । ईडा ईशविलासा च ईशस्था ईशपोषिणी
    ॥ १३८॥ ईतिदा ईतिहन्त्री च ईतिभीतिविमर्दिनी । उमा उमापतिप्रीता उमापतिविहारिणी ॥ १३९॥ ऐश्वर्य्यदायिन्यैश्वर्या
    एकात्मानेकसम्भवा । कलिका कामिनी कान्ता कामिनी कामभोगिनी ॥ १४०॥ कौतुकी कमला काली कल्याणी कमलेश्वरी
    । काशी काञ्ची च कावेरी कैलासी केशवी कविः ॥ १४१॥ कामदा कान्तिदा कान्तिः कार्तिकी कृत्तिका क्रिया ।
    कार्तवीर्यविलासा च कार्तवीर्यप्रबोधिनी ॥ १४२॥ कुरुक्षेत्रनिवासा च कुरुकुल्ला कपालिनी । कुमारी कुलजा
    कान्तिः कपाली केशपालिनी ॥ १४३॥ कौलिनी कञ्जधारी च कञ्जाक्षी कञ्जपालिनी । कञ्जपुष्पसदाप्रीता कज्जमालाविहारिणी
    ॥ १४४॥ कज्जस्था कञ्जिनी काया कायस्था कायसुन्दरी
