id: hanuman-bahuka-batuka-stotram
category: stotram
name:
  english: Hanuman Bahuka (Batuka) Stotram
content:
  english: rabi bala barana tanu | bhuja bisala murati karala kalahu ko kala janu || gahana davana pavanasuva
    || kaha tulasidasa sevata sulabha sevaka hita santata nikata | guna ganata ravi taruna teja ghana
    | ura visala bhuja danda canda nakha bhrikuti karala rasana dasananana | kapisa kesa karakasa langura
    bhanana || kaha tulasidasa basa jasu ura marutasuta murati vikata | santapa papa tehi purusha pahi
    sapanehu chahmukha bhrigu mukhya bhata asura sura sarva sari samara samarattha suro | bankuro bira
    birudaita birudavali beda bandi badata paijapuro || jasu gunagatha raghunatha kaha jasubala bipula
    jala bharita jaga jaladhi jhuro | duvana dala damana ko kauna tulasisa hai pavana ko puta rajaputa
    ruro || || ghanakshari bhanusom padhana hanumana ge bhanumana anumani sisu keli kiyo phera pharaso
    | pachile pagani gama gagana magana mana krama ko na bhrama kapi balaka bihara so || kautuka biloki
    lokapala harihara vidhi locanani cakacaundhi cittani khabara so| bala kaindho bira rasa dhiraja kai
    tulasi sarira dhare sabani sara so || || bharata mem paratha ke ratha kethu kapiraja gajyo suni kururaja
    dala hala bala bho | kahyo drona bhishama samira suta mahabira nidhi jako bala jala bho || banara
    subhaya bala keli bhumi bhanu lagi ga hutem ghati nabha tala bho | nai jori hatha jodha jo haim hanumana
    dekhe jagajivana ko phala bho || holika jyom lai lanka nipata nihsanka para pura gala bala bho | drona
    so pahara liyo khyala hi ukhari kara kanduka jyom kapi khela bela kaiso phala bho || sankata samaja
    asamanjasa bho rama raja kaja juga pugani ko karatala pala bho | sahasi samattha tulasi ko nai ja
    ki ba loka pala palana ko phira thira thala bho || || kamatha ki pithi jake godani ki gadaim mano
    napa ke bhajana bhari jala nidhi jala bho | jatudhana davana paravana ko durga bhayo maha mina basa
    timi tomani ko thala bho || kumbhakarana ravana payoda nada idhana ko tulasi pratapa jako prabala
    anala bho | bhishama kahata mere anumana hanumana sarikho trikala na triloka mahabala bho || || duta
    rama raya ko saputa puta paunako tu anjani ko nandana pratapa bhuri bhanu so | siya sarana aye avana
    lakhana priya prana so || dasamukha dusaha daridra daribe ko bhayo prakata tiloka oka tulasi nidhana
    so | jnana gunavana balavana seva savadhana saheba sujana ura anu hanumana so || || davana duvana
    dala bhuvana bidita bala beda jasa gavata bibudha bandi chora ko | papa tapa timira tuhina nighatana
    patu sevaka saroruha sukhada bhanu bhora ko || loka paraloka tem bisoka sapane na soka tulasi ke hiye
    hai bharoso eka ora ko | rama ko dularo dasa bamadeva ko nivasa| nama kali kamataru kesari kisora
    ko || || mahabala sima maha bhima mahabana ita mahabira bidita barayo raghubira ko | kulisa kathora
    tanu jora parai rora rana karuna kalita mana dharamika dhira ko || durjana ko kalaso karala pala sajjana
    ko sumire harana hara tulasi ki pira ko | siya dayaka dularo raghunayaka ko sevaka sahayaka hai sahasi
    samira ko || || racibe ko bidhi jaise jyaibe ko sudhapana bho | dharibe ko dharani sokhibe krisanu
    poshibe ko hima bhanu bho || khala duhkha doshibe ko gibo malinata ko modaka dudana bho | arata ki
    arati nivaribe ko tihu tulasi ko saheba hathilo hanumana bho || || sevaka syokai jani janakisa manai
    kani sanukula sulapani navai natha na ka ko | devi deva danava dayavane hvai joraim hatha bapure baraka
    kaha aura raja ra ka ko || jagata sovata baithe bagata binoda moda take jo anartha so samartha eka
    a ka ko | saba dina ruro parai puro jaha jake hai bharoso hiye hanumana ha || sanuga sagauri sanukula
    sulapani tahi lokapala sakala lakhana rama janaki | loka paraloka ko bisoka so tiloka tahi tulasi
    tamai kaha kahu bira anaki || kesari kisora bandichora ke nevaje saba kirati bimala kapi karunanidhana
    ki | balaka jyom pali haim kripalu muni siddhata ko || karunanidhana balabuddhi ke nidhana hau mahima
    nidhana gunajnana ke nidhana hau | bama deva rupa bhupa rama ke sanehi leta deta artha dharma kama
    nirabana hau || apane prabhava sitarama ke subhava sila loka beda bidhi ke bidusha hanumana hau |
    mana ki bacana ki karama ki tihu tulasi tiharo tuma saheba sujana hau || || mana ko agama tana sugama
    kiye kapisa kaja maharaja ke samaja saja saje haim | devabandi chora ranarora kesari kisora juga juga
    jaga tere birada biraje haim | bira barajora ghati jora tulasi ki ora suni sakucane sadhu khala gana
    gaje haim | bigari sa vara anjani kumara kije mohim jaise hota aye hanumana ke nivaje haim || || savaiya
    jana siromani ho hanumana sada jana ke mana basa tiharo | dharo bigaro maim kako kaha kehi karana
    khijhata haum to tiharo || saheba sevaka nate to hato kiyo so taham tulasi ko na caro | dosha sunaye
    taim agehu ko hoshiyara hvaim hom mana to hiya haro || || tere thapai uthapai na mahesa thapai thira
    ko kapi je ura ghale | tere nibaje gariba nibaja birajata bairina ke ura sale || sankata soca sabai
    tulasi liye nama phatai makari ke se jale | budha bhaye bali merihim bara ki hari pare bahutai nata
    pale || || sindhu tare bade bira dale khala jare haim lanka se banka mavase | taim rani kehari kehari
    ke bidale ari kunjara chaila chavase || toso samattha susaheba sei sahai tulasi dukha dosha dava se
    | banarabaja lijata kyom na lapeti lavase || || accha vimardana kanana bhani dasanana anana bha na
    niharo | baridanada akampana kumbhakarana se kunjara kehari varo || rama pratapa hutasana samira samira
    dularo | papa te sapa te tapa tihu tem sada tulasi kaha so rakhavaro || || ghanakshari janata jahana
    hanumana ko nivajyo jana mana anumani bali bola na bisariye | seva joga tulasi kabahu saheba subhava
    kapi sahibi sambhariye || aparadhi jani kijai sasati sahasa bhanti modaka marai jo tahi mahura na
    mariye | sahasi samira ke dulare raghubira ju ke ha pira mahabira begi hi nivariye || bali barem tem
    apano kiyo dinabandhu daya kinhim nirupadhi nyariye | ravaro bharoso tulasi ke asa ravariyai dasa
    ravaro vicariye || bado bikarala kali kako na bihala kiyo mathe pagu bali ko nihari so nibariye |
    kesari kisora ranarora barajora bira ha pira rahu matu jyaum pachari mariye || || uthape thapanathira
    thape uthapanahara kesari kumara bala apano sambariye | rama ke gulamani ko kama taru ramaduta mose
    dina dubare ko takiya tihariye || saheba samartha to som tulasi ke mathe para dhi mariye | pokhari
    bisala ba makari jyom pakari ke badana bidariye || soca sankata nivariye | muda marakata roga barinidhi
    heri hare jiva jamavanta ko bharoso tero bhariye || kudiye kripala tulasi suprema pabbayatem suthala
    subela bhalu baithi kai vicariye | mahabira ba lankini jyom lata ghata hi marori mariye || natha hatha
    saba nija mahima bicariye || khasa dasa ravaro deva dukhi dekhiata bhariye | bata tarumula ba upaji
    sakeli kapi keli hi ukhariye || || karama karala kamsa bhumipala ke bharose baki baka bhagini kahu
    tem kaha daraigi | badi bikarala bala ghatini na jata kahi hu bala balaka chabile chote charaigi ||
    ai hai banai besha apa hi bicari dekha papa jaya saba ko guni ke pale paraigi | putana pisacini jyaum
    kapi kanha tulasi ki ha pira mahabira tere mare maraigi || || bhala ki ki kala ki ki rosha ki tridosha
    ki hai bedana bishama papa tapa chala cha ha ki | karamana kuta ki ki jantra mantra buta ki parahi
    jahi papini malina mana ma babari na hohi bani jani kapi na ha ki | ana hanumana ki duhai balavana
    ki sapatha mahabira ki jo rahai pira ba hari bala surasa sudhari chala lankini pachari mari batika
    ujari hai | lanka parajari makari bidari bara bara jatudhana dhari dhuri dhani kari dari hai || tori
    jamakatari mandodari kathori ani ravana ki rani meghanada mahatari hai | bhira ba ha pira ki nipata
    rakhi mahabira kauna ke sakoca tulasi ke soca bhari hai || || tero bali keli bira suni sahamata dhira
    bhulata sarira sudhi sakra ravi rahu ki | teri ba ha basata bisoka loka pala saba tero nama leta rahaim
    arati na kahu ki || sama dama bheda vidhi bedahu labeda sidhi hatha kapinatha hi ke coti cora sahu
    ki | alasa anakha parihasa kai sikhavana hai ete dina rahi pira tulasi ke bahu ki || || tukani ko
    ghara ghara dolata ka bala jyom kripala nata pala pali poso hai | kinhi hai sa apano bisari haim na
    merehu bharoso hai || itano parekho saba bhanti samaratha aju kapiraja sanci kahaum ko tiloka toso
    hai | sasati sahata dasa kije pekhi parihasa ciri ko marana khela balakani koso hai || || apane hi
    papa tem tripata tem ki sapa tem ha bedana kahi na sahi jati hai | aushadha aneka jantra mantra totakadi
    kiye badi bhaye devata manaye adhikati hai || karatara ko hai jagajala jo na manata itati hai | cero
    tero tulasi tu mero kahyo rama duta dhila teri bira mohi pira tem pirati hai || samatva hatha paya
    ko sahaya asahaya ko | ba ki biradavali bidita beda gaiyata ravana so bhata bhayo muthika ke dhaya
    ko || ete bade saheba samartha ko nivajo aja sidata susevaka bacana mana kaya ko | thori ba ha pira
    ki badi galani tulasi ko lopa prakata prabhaya ko || || devi deva danuja manuja muni siddha naga chote
    bade jiva jete cetana aceta haim | putana pisaci jatudhani jatudhana baga rama duta ki rajai mathe
    mani leta haim || ghora jantra mantra kuta kapata kuroga joga hanumana ana suni chadata niketa haim
    | krodha kije karma ko prabodha kije tulasi ko sodha kije tinako jo dosha dukha deta haim || || tere
    bala banara jitaye rana ravana som tere ghale jatudhana bhaye ghara ghara ke | tere bala rama raja
    kiye saba sura kaja sakala samaja saja saje raghubara ke || tero gunagana suni girabana pulakata sajala
    bilocana biranci harihara ke | tulasi ke mathe para hatha phero kisa natha dekhiye na dasa dukhi toso
    kanigara ke || || palo tere tuka ko parehu cuka mukiye na kura kaudi duko haum apani ora heriye |
    bhoranatha bhore hi sarosha hota thore dosha poshi toshi thapi apano na ava deriye || a bu tu haum
    dimbha so na bujhiye bilamba avalamba mere teriye | balaka bikala jani pahi prema pahicani ha para
    lami luma pheriye || basara jalada ghana ghata dhuki dhai hai | barasata bari pira jariye javase jasa
    rosha binu dosha dhuma mula malinai hai || karunanidhana hanumana maha balavana ki phunki phaunjai
    te udai hai | khaye huto tulasi kuroga radha rakasani kesari kisora rakhe bira bariai hai || || savaiya
    rama gulama tu hi hanumana gosa i sada anukulo | palyo haum bala jyom akhara du pitu matu som mangala
    moda samulo || ba ha pagara pukarata arata ana da bhulo | shri raghubira nivariye pira rahaum darabara
    paro lati lulo || || ghanakshari kala ki karalata karama kathinai kidhau papa ke prabhava ki subhaya
    baya bavare | bedana kubha ti so sahi na jati rati dina ha gahi jo gahi samira dabare || layo taru
    tulasi tiharo so nihari bari sinciye malina bho tayo hai tihu tavare | bhutani ki apani paraye ki
    kripa nidhana janiyata sabahi ki riti rama ravare || jara jara sakala pira mi hai | deva bhuta pitara
    karama khala kala graha mohi para davari damanaka si di hai || haum to binu mola ke bikano bali bare
    hitem ota rama nama ki lalata likhi li hai | ku bhaja ke kinkara bikala budhe gokhurani haya rama
    raya aisi hala kahu || bahuka subahu nica licara marica mili ha pira ketuja kuroga jatudhana hai |
    rama nama japa jaga kiyo cahom sanuraga kala kaise duta bhuta kaha mere mana hai || sumire sahaya
    rama lakhana akhara dauu jinake samuha sake jagata jahana hai | tulasi sa bedhe baragada se banai
    banavana hai || || balapane sudhe mana rama sanamukha bhayo gi khata tuka taka haum | parayo loka
    riti mem punita priti rama raya moha basa baitho tori taraki taraka haum || khote khote acarana acarata
    apanayo anjani kumara sodhyo ramapani paka haum | tulasi gusa i bhayo bhonde dina bhula gayo tako
    phala pavata nidana paripaka haum || || asana basana hina bishama bishada lina dekhi dina dubaro karai
    na haya haya ko | tulasi anatha so sanatha raghunatha kiyo diyo phala sila sindhu apane subhaya ko
    || nica yahi bica pati pai bharu haigo bihai prabhu bhajana bacana mana kaya ko | ta tem tanu peshiyata
    ghora baratora misa phuti phuti nikasata lona rama raya ko || || jio jaga janaki jivana ko kahai jana
    maribe ko baranasi bari sura sari ko | tulasi ke dohu jake jiye muye soca karihaim na lari ko || mo
    ko jhu co loga rama kau kahata saba mere mana mana hai na hara ko na hari ko | bhari pira dusaha sarira
    tem bihala hota sou raghubira binu sakai dura kari ko || || sitapati saheba sahaya hanumana nita hita
    upadesha ko mahesa mano guru kai | manasa bacana kaya sarana tihare pa tumhare bharose sura maim na
    jane sura kai || byadhi bhuta janita upadhi kahu khala ki samadhi ki jai tulasi ko jani jana phura
    kai | kapinatha raghunatha bholanatha bhutanatha roga sindhu kyom na dariyata gaya khura kai || ||
    kahom hanumana som sujana rama raya som kripanidhana sankara som savadhana suniye | harasha vishada
    raga rosha guna dosha mi biraci biranci saba dekhiyata duniye || maya jiva kala ke karama ke subhaya
    ke karaiya rama beda kahem sa ci mana guniye | tumha tem kaha na hoya ha ha so bujhaiye mohim rahom
    maunahi vayo so jani luniye ||
  devanagari: रबि बाल बरन तनु । भुज बिसाल मूरति कराल कालहु को काल जनु ॥ गहन दवन पवनसुव ॥ कह तुलसिदास सेवत
    सुलभ सेवक हित सन्तत निकट । गुन गनत रवि तरुन तेज घन । उर विसाल भुज दण्ड चण्ड नख भृकुटी कराल रसना दसनानन
    । कपिस केस करकस लङ्गूर भानन ॥ कह तुलसिदास बस जासु उर मारुतसुत मूरति विकट । सन्ताप पाप तेहि पुरुष पहि
    सपनेहु छःमुख भृगु मुख्य भट असुर सुर सर्व सरि समर समरत्थ सूरो । बाङ्कुरो बीर बिरुदैत बिरुदावली बेद
    बन्दी बदत पैजपूरो ॥ जासु गुनगाथ रघुनाथ कह जासुबल बिपुल जल भरित जग जलधि झूरो । दुवन दल दमन को कौन तुलसीस
    है पवन को पूत रजपूत रुरो ॥ ॥ घनाक्षरी भानुसों पढन हनुमान गे भानुमन अनुमानि सिसु केलि कियो फेर फारसो
    । पाछिले पगनि गम गगन मगन मन क्रम को न भ्रम कपि बालक बिहार सो ॥ कौतुक बिलोकि लोकपाल हरिहर विधि लोचननि
    चकाचौन्धी चित्तनि खबार सो। बल कैन्धो बीर रस धीरज कै तुलसी सरीर धरे सबनि सार सो ॥ ॥ भारत में पारथ के
    रथ केथू कपिराज गाज्यो सुनि कुरुराज दल हल बल भो । कह्यो द्रोन भीषम समीर सुत महाबीर निधि जाको बल जल
    भो ॥ बानर सुभाय बाल केलि भूमि भानु लागि ग हूतें घाटि नभ तल भो । नाई जोरि हाथ जोधा जो हैं हनुमान देखे
    जगजीवन को फल भो ॥ होलिका ज्यों लाई लङ्क निपट निःसङ्क पर पुर गल बल भो । द्रोन सो पहार लियो ख्याल ही
    उखारि कर कन्दुक ज्यों कपि खेल बेल कैसो फल भो ॥ सङ्कट समाज असमञ्जस भो राम राज काज जुग पूगनि को करतल
    पल भो । साहसी समत्थ तुलसी को नाई जा की बा लोक पाल पालन को फिर थिर थल भो ॥ ॥ कमठ की पीठि जाके गोडनि
    की गाडैं मानो नाप के भाजन भरि जल निधि जल भो । जातुधान दावन परावन को दुर्ग भयो महा मीन बास तिमि तोमनि
    को थल भो ॥ कुम्भकरन रावन पयोद नाद ईधन को तुलसी प्रताप जाको प्रबल अनल भो । भीषम कहत मेरे अनुमान हनुमान
    सारिखो त्रिकाल न त्रिलोक महाबल भो ॥ ॥ दूत राम राय को सपूत पूत पौनको तू अञ्जनी को नन्दन प्रताप भूरि
    भानु सो । सीय सरन आये अवन लखन प्रिय प्राण सो ॥ दसमुख दुसह दरिद्र दरिबे को भयो प्रकट तिलोक ओक तुलसी
    निधान सो । ज्ञान गुनवान बलवान सेवा सावधान साहेब सुजान उर आनु हनुमान सो ॥ ॥ दवन दुवन दल भुवन बिदित
    बल बेद जस गावत बिबुध बन्दी छोर को । पाप ताप तिमिर तुहिन निघटन पटु सेवक सरोरुह सुखद भानु भोर को ॥ लोक
    परलोक तें बिसोक सपने न सोक तुलसी के हिये है भरोसो एक ओर को । राम को दुलारो दास बामदेव को निवास। नाम
    कलि कामतरु केसरी किसोर को ॥ ॥ महाबल सीम महा भीम महाबान इत महाबीर बिदित बरायो रघुबीर को । कुलिस कठोर
    तनु जोर परै रोर रन करुना कलित मन धारमिक धीर को ॥ दुर्जन को कालसो कराल पाल सज्जन को सुमिरे हरन हार
    तुलसी की पीर को । सीय दायक दुलारो रघुनायक को सेवक सहायक है साहसी समीर को ॥ ॥ रचिबे को बिधि जैसे ज्याईबे
    को सुधापान भो । धरिबे को धरनि सोखिबे कृसानु पोषिबे को हिम भानु भो ॥ खल दुःख दोषिबे को गिबो मलीनता
    को मोदक दुदान भो । आरत की आरति निवारिबे को तिहु तुलसी को साहेब हठीलो हनुमान भो ॥ ॥ सेवक स्योकाई जानि
    जानकीस मानै कानि सानुकूल सूलपानि नवै नाथ ना क को । देवी देव दानव दयावने ह्वै जोरैं हाथ बापुरे बराक
    कहा और राजा रा क को ॥ जागत सोवत बैठे बागत बिनोद मोद ताके जो अनर्थ सो समर्थ एक आ क को । सब दिन रुरो
    परै पूरो जहा जाके है भरोसो हिये हनुमान हा ॥ सानुग सगौरि सानुकूल सूलपानि ताहि लोकपाल सकल लखन राम जानकी
