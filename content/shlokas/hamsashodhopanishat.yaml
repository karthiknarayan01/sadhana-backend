id: hamsashodhopanishat
category: upanishad
name:
  english: hamsashodhopanishat
  devanagari: हंसषोढोपनिषत्
content:
  english: hamsashodhopanishat athaha vai hamsashodhanyasi shivo bhavet | sarvasiddhishvaro bhavet | etatphalam
    vaktum sadashivo'pi na samarthah | shodhanyasasya virupakshamahakala rishih | anushtup chandah | kali
    devata | kalideharthe viniyogah | hamsenangashatkam | sa nirvanarupo bhavet | hamsah kam kham gam
    gham nam mahamundamaladharini mahakalapriye mam raksha raksha | shatcakravasini vagishvari jihvagre
    vasa | ham namah shirasi protam veda shivo bhavet | hamsah cam cham jam jham nam mahatripurabhairavi
    pustakakshamaladharini shatrumukhastambhanam kuru kuru svaheti mahapadme | hamsah tam tham dam dham
    nam dam dim dam dakini mam raksha raksha svahetyanahate nyaset | tritiyarupo bhavet | hamsah tam tham
    dam dham nam mahamari maraharini hum hum daridryam hara hara svaha | gum nyaset | sa brahmakalitvam
    gacchati | caturthatvam gacchati | hamsah pam pham bam bham mam marjari viravali mamalasyam nashaya
    nashaya | hamsah yam ram lam vam sham sham sam ham lambodari matarmahamangalapriye mama jadyam chedaya
    chedaya | bhramsha bhramsha | bhagavati mam raksha raksha | bhuvanadharini mam dharaya dharaya | svahapadadvayam
    nyasya shivo bhavet | atha vai shashthim nyaset | hamsah lam ksham mahalakshmi rajarajeshvari mahakalapriye
    kalakhandini khandini khandaya khandaya kham khim khum khaim khom khaum khah khanitri same svaheti
    sarvange nyaset | hamsah pancashat vyapakam kuryat | iti shashthi | sa shivo bhavet | sa somayaji
    bhavet | sa virakto bhavet | sa sarvadikshito bhavet | so'mritatvam gacchati | sa sarvakalatvam gacchati
    | sa sarvanyasakari bhavet | anadhitagatirvidyam labhet | kartavyakaranadikarta bhavet | sarvasiddhishvaro
    bhavet | kalirupo bhavet | so'ham hamsa ityaha bhagavan sadashiva iti protam veda ||
  devanagari: हंसषोढोपनिषत् अथाह वै हंसषोढान्यासी शिवो भवेत् । सर्वसिद्धीश्वरो भवेत् । एतत्फलं वक्तुं
    सदाशिवोऽपि न समर्थः । षोढान्यासस्य विरूपाक्षमहाकाल ऋषिः । अनुष्टुप् छन्दः । काली देवता । कालीदेहार्थे
    विनियोगः । हंसेनाङ्गषट्कम् । स निर्वाणरूपो भवेत् । हंसः कं खं गं घं ङं महामुण्डमालाधारिणि महाकालप्रिये
    मां रक्ष रक्ष । षट्चक्रवासिनि वागीश्वरि जिह्वाग्रे वस । हं नमः शिरसि प्रोतं वेद शिवो भवेत् । हंसः
    चं छं जं झं ञं महात्रिपुरभैरवि पुस्तकाक्षमालाधारिणि शत्रुमुखस्तम्भनं कुरु कुरु स्वाहेति महापद्मे ।
    हंसः टं ठं डं ढं णं डां डीं डं डाकिनि मां रक्ष रक्ष स्वाहेत्यनाहते न्यसेत् । तृतीयारूपो भवेत् । हंसः
    तं थं दं धं नं महामारि मारहारिणि हुं हुं दारिद्र्यं हर हर स्वाहा । गुं न्यसेत् । स ब्रह्मकालीत्वं
    गच्छति । चतुर्थत्वं गच्छति । हंसः पं फं बं भं मं मार्जारि वीरावलि ममालस्यं नाशय नाशय । हंसः यं रं
    लं वं शं षं सं हं लम्बोदरि मातर्महामङ्गलप्रिये मम जाड्यं छेदय छेदय । भ्रंश भ्रंश । भगवति मां रक्ष
    रक्ष । भुवनधारिणि मां धारय धारय । स्वाहापदद्वयं न्यस्य शिवो भवेत् । अथ वै षष्ठीं न्यसेत् । हंसः लं
    क्षं महालक्ष्मि राजराजेश्वरि महाकालप्रिये कालखण्डिनि खण्डिनि खण्डय खण्डय खां खीं खूं खैं खों खौं खः
    खनित्रि समे स्वाहेति सर्वाङ्गे न्यसेत् । हंसः पञ्चाशत् व्यापकं कुर्यात् । इति षष्ठी । स शिवो भवेत्
    । स सोमयाजी भवेत् । स विरक्तो भवेत् । स सर्वदीक्षितो भवेत् । सोऽमृतत्वं गच्छति । स सर्वकालत्वं गच्छति
    । स सर्वन्यासकारी भवेत् । अनधीतगतिर्विद्यां लभेत् । कर्तव्याकरणादिकर्ता भवेत् । सर्वसिद्धीश्वरो भवेत्
    । कालीरूपो भवेत् । सोऽहं हंस इत्याह भगवान् सदाशिव इति प्रोतं वेद ॥
