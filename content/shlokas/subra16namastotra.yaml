id: subra16namastotra
category: stotram
name:
  english: subra16namastotra
  devanagari: सुब्र१६नामस्तोत्र
content:
  english: shadvaktram shikhivahanam trinayanam citrambaralankritam shaktim vajramasim trishulamabhayam
    khetam dhanushcakrakam | pasham kukkutamankusham ca varadam dorbhirdadhanam sada dhyayamipsitasiddhidam
    shivasutam skandam suraradhitam || subrahmanyam pranamyaham sarvajnam sarvagam sada | abhipsitartha
    siddhyartham pravakshyenamashodasham || om prathamojnanashaktyatma dvitiyo skanda eva ca | agnigarbhastritiyastu
    bahuleyashcaturthakah || 1|| gangeyah pancamah proktah shashthah sharavanodbhavah |
  devanagari: षड्वक्त्रं शिखिवाहनं त्रिनयनं चित्राम्बरालङ्कृतं शक्तिं वज्रमसिं त्रिशूलमभयं खेटं धनुश्चक्रकम्
    । पाशं कुक्कुटमङ्कुशं च वरदं दोर्भिर्दधानं सदा ध्यायामीप्सितसिद्धिदं शिवसुतं स्कन्दं सुराराधितम् ॥
    सुब्रह्मण्यं प्रणाम्यहं सर्वज्ञं सर्वगं सदा । अभीप्सितार्थ सिद्ध्यर्थं प्रवक्ष्येनामषोडशम् ॥ ॐ प्रथमोज्ञानशक्त्यात्मा
    द्वितीयो स्कन्द एव च । अग्निगर्भस्तृतीयस्तु बाहुलेयश्चतुर्थकः ॥ १॥ गाङ्गेयः पञ्चमः प्रोक्तः षष्ठः
    शरवणोद्भवः ।
meaning: {}
