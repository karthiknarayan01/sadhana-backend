id: uddhava-geetha-chapter-2
category: stotram
name:
  english: Uddhava Geetha - Chapter 2
content:
  english: atha dvitiyo'dhyayah | shrishukah uvaca | govindabhujaguptayam dvaravatyam kurudvaha | avatsit
    naradah abhikshnam krishnaupasanalalasah || || ko nu rajan indriyavan mukundacaranambujam | na bhajet
    sarvatah mrityuh upasyam amarauttamaih || || tam ekada devarshim vasudevah griha agatam | arcitam
    sukham asinam abhivadya idam abravit || || vasudevah uvaca | bhagavan bhavatah yatra svastaye sarvadehinam
    | kripananam yatha pitroh uttamashlokavartmanam || || bhutanam devacaritam duhkhaya ca sukhaya ca
    | sukhaya eva hi sadhunam tvadrisham acyuta atmanam || || bhajanti ye yatha devan devah api tatha
    eva tan | chaya iva karmasacivah sadhavah dinavatsalah || || brahman tatha api pricchamah dharman
    bhagavatan tava | yan shrutva shraddhaya martyah mucyate sarvatah bhayat || || aham kila pura anantam
    prajarthah bhuvi muktidam | apujayam na mokshaya mohitah devamayaya || || yaya vicitravyasanat bhavadbhih
    vishvatah bhayat | mucyema hi anjasa eva addha tatha nah shadhi suvrata || || shrishukah uvaca | rajan
    evam kritaprashnah vasudevena dhimata | pritah tam aha devarshih hareh samsmaritah gunaih || || naradah
    uvaca | samyak etat vyavasitam bhavata satvatarshabha | yat pricchase bhagavatan dharman tvam vishvabhavanan
    || || shrutah anupathitah dhyatah adritah va anumoditah | sadyah punati saddharmah devavishvadruhah
    api || || tvaya paramakalyanah punyashravanakirtanah | smaritah bhagavan adya devah narayanah mama
    || || atra api udaharanti imam itihasam puratanam | arshabhanam ca samvadam videhasya mahatmanah ||
    || priyavratah nama sutah manoh svayambhuvasya yah | tasya agnidhrah tatah nabhih rishabhah tat sutah
    smritah || || tam ahuh vasudevamsham mokshadharmavivakshaya | avatirnam sutashatam tasya asit vedaparagam
    || || tesham vai bharatah jyeshthah narayanaparayanah | vikhyatam varsham etat yat namna bharatam
    adbhutam || || sah bhuktabhogam tyaktva imam nirgatah tapasa harim | upasinah tat padavim lebhe vai
    janmabhih tribhih || || tesham nava navadvipapatayah asya samantatah | karmatantrapranetarah ekashitih
    dvijatayah || || nava abhavan mahabhagah munayah hi arthashamsinah | shramanah vatah ashanah atmavidyavisharadah
    || || kavih harih antarikshah prabuddhah pippalayanah | avirhotrah atha drumilah camasah karabhajanah
    || || ete vai bhagavadrupam vishvam sadasad atmakam | atmanah avyatirekena pashyantah vyacarat mahim
    || || avyahata ishtagatayah surasiddhasiddhasadhya gandharvayakshanarakinnaranagalokan | muktah caranti
    municaranabhutanatha vidyadharadvijagavam bhuvanani kamam || || tah ekada nimeh satram upajagmuh yat
    ricchaya | vitayamanam rishibhih ajanabhe mahatmanah || || tan drishtva suryasankashan mahabhagavatan
    nripah | yajamanah agnayah viprah sarvah eva upatasthire || || videhah tan abhipretya narayanaparayanan
    | pritah sampujayan cakre asanasthan yatha arhatah || || tan rocamanan svaruca brahmaputraupaman nava
    | papraccha paramapritah prashraya avanatah nripah || || videhah uvaca | manye bhagavatah sakshat
    parshadan vah madhudvishah | vishnoh bhutani lokanam pavanaya caranti hi || || durlabhah manushah
    dehah dehinam kshanabhangurah | tatra api durlabham manye vaikunthapriyadarshanam || || atah atyantikam
    kahemam pricchamah bhavatah anaghah | samsare asmin kshanardhah api satsangah shevadhih nrinam ||
    || dharman bhagavatan bruta yadi nah shrutaye kshamam | yaih prasannah prapannaya dasyati atmanam
    api ajah || || shrinaradah uvaca | evam te nimina prishta vasudeva mahattamah | pratipujya abruvan
    pritya sasadasi ritvijam nripam || || kavih uvaca | manye akutashcit bhayam acyutasya padambujaupasanam
    atra nityam | udvignabuddheh asat atmabhavat vishvatmana yatra nivartate bhih || || ye vai bhagavata
    proktah upayah hi atmalabdhaye | anjah pumsam avidusham viddhi bhagavatan hi tan || || yan asthaya
    narah rajan na pramadyeta karhicit | dhavan nimilya va netre na skhalena patet iha || || kayena vaca
    manasa indriyaih va buddhya atmana va anusritasvabhavat | karoti yat yat sakalam parasmai narayanaya
    iti samarpayet tat || || bhayam dvitiyabhiniveshatah syat ishat apetasya viparyayah asmritih | tat
    mayaya atah budhah abhajet tam bhaktya eka isham gurudevatatma || | avidyamanah api avabhati hi dvayoh
    dhyatuh dhiya svapnamanorathau yatha | tat karmasankalpavikalpakam manah budhah nirundhyat abhayam
    tatah syat || || shrunvan subhadrani rathangapaneh janmani karmani ca yani loke | gitani namani tat
    arthakani gayan vilajjah vicaret asangah || || evam vratah svapriyanamakirtya jatanuragah drutacittah
    uccaih | hasati athah roditi rauti gayati unmadavat nrityati lokabahyah || || kham vayum agnim salilam
    mahim ca jyotimshi sattvani dishah drumadin | sarit samudran ca hareh shariram yatkinca bhutam pranamet
    ananyah || || bhaktih paresha anubhavah viraktih anyatra esha trikah ekakalah | prapadyamanasya yatha
    ashnatah syuh tushtih pushtih kshut apayah anughasam || || iti acyuta anghrim bhajatah anuvrittya
    bhaktih viraktih bhagavat prabodhah | bhavanti vai bhagavatasya rajan tatah param shantim upaiti sakshat
    || || raja uvaca | atha bhagavatam bruta yat dharmah yadrishah nrinam | yatha carati yat brute yaih
    lingaih bhagavat priyah || || harih uvaca | sarvabhuteshu yah pashyet bhagavat bhava atmanah | bhutani
    bhagavati atmani esha bhagavatauttamah || || ishvare tat adhineshu balisheshu dvishatsu ca | premamaitrikripaupeksha
    yah karoti sa madhyamah || || arcayam eva haraye pujam yah shraddhaya ihate | na tat bhakteshu ca
    anyeshu sah bhaktah prakritah smritah || || grihitva api indriyaih arthanyah na dveshti na hrishyati
    | vishnoh mayam idam pashyan sah vai bhagavata uttamah || || dehaindriyapranamanahdhiyam yah janmapiayakshut
    bhayatarshakricchraih | samsaradharmaih avimuhyamanah smritya hareh bhagavatapradhanah || || na kamakarmabijanam
    yasya cetasi sambhavah | vasudevekanilayah sah vai bhagavata uttamah || || na yasya janmakarmabhyam
    na varnashramajatibhih | sajjate asmin ahambhavah dehe vai sah hareh priyah || || na yasya svah parah
    iti vitteshu atmani va bhida | sarvabhutasamah shantah sah vau bhagavata uttamah || || tribhuvanavibhavahetave
    api akunthasmritih ajitatmasuradibhih vimrigyat | na calati bhagavat pada aravindat lavanimisha ardham
    api yah sah vaishnava agryah || || bhagavatah uruvikrama anghrishakha nakhamanicandrikaya nirastatape
    | hridi katham upasidatam punah sah prabhavati candrah iva udite arkatapah || || visrijati hridayam
    na yasya sakshat harih avasha abhihitah api aghaughanashah | pranayah ashanaya dhrita anghripadmah
    sah bhavati bhagavatapradhanah uktah || || iti shrimat bhagavate mahapurane paramahamsyam samhitayam
    ekadashaskandhe nimijayantasamvade dvitiyah adhyayah ||
  devanagari: अथ द्वितीयोऽध्यायः । श्रीशुकः उवाच । गोविन्दभुजगुप्तायां द्वारवत्यां कुरूद्वह । अवात्सीत्
    नारदः अभीक्ष्णं कृष्णौपासनलालसः ॥ ॥ को नु राजन् इन्द्रियवान् मुकुन्दचरणाम्बुजम् । न भजेत् सर्वतः मृत्युः
    उपास्यं अमरौत्तमैः ॥ ॥ तं एकदा देवर्षिं वसुदेवः गृह आगतम् । अर्चितं सुखं आसीनं अभिवाद्य इदं अब्रवीत्
    ॥ ॥ वसुदेवः उवाच । भगवन् भवतः यात्रा स्वस्तये सर्वदेहिनाम् । कृपणानां यथा पित्रोः उत्तमश्लोकवर्त्मनाम्
    ॥ ॥ भूतानां देवचरितं दुःखाय च सुखाय च । सुखाय एव हि साधूनां त्वादृशां अच्युत आत्मनाम् ॥ ॥ भजन्ति ये
    यथा देवान् देवाः अपि तथा एव तान् । छाया इव कर्मसचिवाः साधवः दीनवत्सलाः ॥ ॥ ब्रह्मन् तथा अपि पृच्छामः
    धर्मान् भागवतान् तव । यान् श्रुत्वा श्रद्धया मर्त्यः मुच्यते सर्वतः भयात् ॥ ॥ अहं किल पुरा अनन्तं
    प्रजार्थः भुवि मुक्तिदम् । अपूजयं न मोक्षाय मोहितः देवमायया ॥ ॥ यया विचित्रव्यसनात् भवद्भिः विश्वतः
    भयात् । मुच्येम हि अञ्जसा एव अद्धा तथा नः शाधि सुव्रत ॥ ॥ श्रीशुकः उवाच । राजन् एवं कृतप्रश्नः वसुदेवेन
    धीमता । प्रीतः तं आह देवर्षिः हरेः संस्मारितः गुणैः ॥ ॥ नारदः उवाच । सम्यक् एतत् व्यवसितं भवता सात्वतर्षभ
    । यत् पृच्छसे भागवतान् धर्मान् त्वं विश्वभावनान् ॥ ॥ श्रुतः अनुपठितः ध्यातः आदृतः वा अनुमोदितः । सद्यः
    पुनाति सद्धर्मः देवविश्वद्रुहः अपि ॥ ॥ त्वया परमकल्याणः पुण्यश्रवणकीर्तनः । स्मारितः भगवान् अद्य देवः
    नारायणः मम ॥ ॥ अत्र अपि उदाहरन्ति इमं इतिहासं पुरातनम् । आर्षभाणां च संवादं विदेहस्य महात्मनः ॥ ॥
    प्रियव्रतः नाम सुतः मनोः स्वायम्भुवस्य यः । तस्य अग्नीध्रः ततः नाभिः ऋषभः तत् सुतः स्मृतः ॥ ॥ तं आहुः
    वासुदेवांशं मोक्षधर्मविवक्षया । अवतीर्णं सुतशतं तस्य आसीत् वेदपारगम् ॥ ॥ तेषां वै भरतः ज्येष्ठः नारायणपरायणः
    । विख्यातं वर्षं एतत् यत् नाम्ना भारतं अद्भुतम् ॥ ॥ सः भुक्तभोगां त्यक्त्वा इमां निर्गतः तपसा हरिम्
    । उपासीनः तत् पदवीं लेभे वै जन्मभिः त्रिभिः ॥ ॥ तेषां नव नवद्वीपपतयः अस्य समन्ततः । कर्मतन्त्रप्रणेतारः
    एकाशीतिः द्विजातयः ॥ ॥ नव अभवन् महाभागाः मुनयः हि अर्थशंसिनः । श्रमणाः वातः अशनाः आत्मविद्याविशारदाः
    ॥ ॥ कविः हरिः अन्तरिक्षः प्रबुद्धः पिप्पलायनः । आविर्होत्रः अथ द्रुमिलः चमसः करभाजनः ॥ ॥ एते वै भगवद्रूपं
    विश्वं सदसद् आत्मकम् । आत्मनः अव्यतिरेकेण पश्यन्तः व्यचरत् महीम् ॥ ॥ अव्याहत इष्टगतयाः सुरसिद्धसिद्धसाध्य
    गन्धर्वयक्षनरकिन्नरनागलोकान् । मुक्ताः चरन्ति मुनिचारणभूतनाथ विद्याधरद्विजगवां भुवनानि कामम् ॥ ॥ तः
    एकदा निमेः सत्रं उपजग्मुः यत् ऋच्छया । वितायमानं ऋषिभिः अजनाभे महात्मनः ॥ ॥ तान् दृष्ट्वा सूर्यसङ्काशान्
    महाभगवतान् नृपः । यजमानः अग्नयः विप्राः सर्वः एव उपतस्थिरे ॥ ॥ विदेहः तान् अभिप्रेत्य नारायणपरायणान्
    । प्रीतः सम्पूजयान् चक्रे आसनस्थान् यथा अर्हतः ॥ ॥ तान् रोचमानान् स्वरुचा ब्रह्मपुत्रौपमान् नव । पप्रच्छ
    परमप्रीतः प्रश्रय अवनतः नृपः ॥ ॥ विदेहः उवाच । मन्ये भगवतः साक्षात् पार्षदान् वः मधुद्विषः । विष्णोः
    भूतानि लोकानां पावनाय चरन्ति हि ॥ ॥ दुर्लभः मानुषः देहः देहिनां क्षणभङ्गुरः । तत्र अपि दुर्लभं मन्ये
    वैकुण्ठप्रियदर्शनम् ॥ ॥ अतः आत्यन्तिकं कहेमं पृच्छामः भवतः अनघाः । संसारे अस्मिन् क्षणार्धः अपि सत्सङ्गः
    शेवधिः नृणाम् ॥ ॥ धर्मान् भागवतान् ब्रूत यदि नः श्रुतये क्षमम् । यैः प्रसन्नः प्रपन्नाय दास्यति आत्मानं
    अपि अजः ॥ ॥ श्रीनारदः उवाच । एवं ते निमिना पृष्टा वसुदेव महत्तमाः । प्रतिपूज्य अब्रुवन् प्रीत्या ससदसि
    ऋत्विजं नृपम् ॥ ॥ कविः उवाच । मन्ये अकुतश्चित् भयं अच्युतस्य पादाम्बुजौपासनं अत्र नित्यम् । उद्विग्नबुद्धेः
    असत् आत्मभावात् विश्वात्मना यत्र निवर्तते भीः ॥ ॥ ये वै भगवता प्रोक्ताः उपायाः हि आत्मलब्धये । अञ्जः
    पुंसां अविदुषां विद्धि भागवतान् हि तान् ॥ ॥ यान् आस्थाय नरः राजन् न प्रमाद्येत कर्हिचित् । धावन् निमील्य
    वा नेत्रे न स्खलेन पतेत् इह ॥ ॥ कायेन वाचा मनसा इन्द्रियैः वा बुद्ध्या आत्मना वा अनुसृतस्वभावात् ।
    करोति यत् यत् सकलं परस्मै नारायणाय इति समर्पयेत् तत् ॥ ॥ भयं द्वितीयाभिनिवेशतः स्यात् ईशात् अपेतस्य
    विपर्ययः अस्मृतिः । तत् मायया अतः बुधः आभजेत् तं भक्त्या एक ईशं गुरुदेवतात्मा ॥ । अविद्यमानः अपि अवभाति
    हि द्वयोः ध्यातुः धिया स्वप्नमनोरथौ यथा । तत् कर्मसङ्कल्पविकल्पकं मनः बुधः निरुन्ध्यात् अभयं ततः स्यात्
    ॥ ॥ श्रुण्वन् सुभद्राणि रथाङ्गपाणेः जन्मानि कर्माणि च यानि लोके । गीतानि नामानि तत् अर्थकानि गायन्
    विलज्जः विचरेत् असङ्गः ॥ ॥ एवं व्रतः स्वप्रियनामकीर्त्या जातानुरागः द्रुतचित्तः उच्चैः । हसति अथः
    रोदिति रौति गायति उन्मादवत् नृत्यति लोकबाह्यः ॥ ॥ खं वायुं अग्निं सलिलं महीं च ज्योतींषि सत्त्वानि
    दिशः द्रुमादीन् । सरित् समुद्रान् च हरेः शरीरं यत्किञ्च भूतं प्रणमेत् अनन्यः ॥ ॥ भक्तिः परेश अनुभवः
    विरक्तिः अन्यत्र एष त्रिकः एककालः । प्रपद्यमानस्य यथा अश्नतः स्युः तुष्टिः पुष्टिः क्षुत् अपायः अनुघासम्
    ॥ ॥ इति अच्युत अङ्घ्रिं भजतः अनुवृत्त्या भक्तिः विरक्तिः भगवत् प्रबोधः । भवन्ति वै भागवतस्य राजन्
    ततः परां शान्तिं उपैति साक्षात् ॥ ॥ राजा उवाच । अथ भागवतं ब्रूत यत् धर्मः यादृशः नृणाम् । यथा चरति
    यत् ब्रूते यैः लिङ्गैः भगवत् प्रियः ॥ ॥ हरिः उवाच । सर्वभूतेषु यः पश्येत् भगवत् भाव आत्मनः । भूतानि
    भागवति आत्मनि एष भागवतौत्तमः ॥ ॥ ईश्वरे तत् अधीनेषु बालिशेषु द्विषत्सु च । प्रेममैत्रीकृपाउपेक्षा
    यः करोति स मध्यमः ॥ ॥ अर्चायां एव हरये पूजां यः श्रद्धया ईहते । न तत् भक्तेषु च अन्येषु सः भक्तः प्राकृतः
    स्मृतः ॥ ॥ गृहीत्वा अपि इन्द्रियैः अर्थान्यः न द्वेष्टि न हृष्यति । विष्णोः मायां इदं पश्यन् सः वै
    भागवत उत्तमः ॥ ॥ देहैन्द्रियप्राणमनःधियां यः जन्मापिअयक्षुत् भयतर्षकृच्छ्रैः । संसारधर्मैः अविमुह्यमानः
    स्मृत्या हरेः भागवतप्रधानः ॥ ॥ न कामकर्मबीजानां यस्य चेतसि सम्भवः । वासुदेवेकनिलयः सः वै भागवत उत्तमः
    ॥ ॥ न यस्य जन्मकर्मभ्यां न वर्णाश्रमजातिभिः । सज्जते अस्मिन् अहम्भावः देहे वै सः हरेः प्रियः ॥ ॥ न
    यस्य स्वः परः इति वित्तेषु आत्मनि वा भिदा । सर्वभूतसमः शान्तः सः वौ भागवत उत्तमः ॥ ॥ त्रिभुवनविभवहेतवे
    अपि अकुण्ठस्मृतिः अजितात्मसुरादिभिः विमृग्यात् । न चलति भगवत् पद अरविन्दात् लवनिमिष अर्धं अपि यः सः
    वैष्णव अग्र्यः ॥ ॥ भगवतः उरुविक्रम अङ्घ्रिशाखा नखमणिचन्द्रिकया निरस्ततापे । हृदि कथं उपसीदतां पुनः
    सः प्रभवति चन्द्रः इव उदिते अर्कतापः ॥ ॥ विसृजति हृदयं न यस्य साक्षात् हरिः अवश अभिहितः अपि अघौघनाशः
    । प्रणयः अशनया धृत अङ्घ्रिपद्मः सः भवति भागवतप्रधानः उक्तः ॥ ॥ इति श्रीमत् भागवते महापुराणे पारमहंस्यां
    संहितायां एकादशस्कन्धे निमिजायन्तसंवादे द्वितीयः अध्यायः ॥
