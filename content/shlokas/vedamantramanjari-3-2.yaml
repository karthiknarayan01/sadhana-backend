id: vedamantramanjari-3-2
category: sukta
name:
  english: vedamantramanjari 3
  devanagari: वेदमन्त्रमन्जरि ३
content:
  english: va̱h susa̱hasa̭ti || 4 || || om shanti̱h shanti̱h shanti̭h || || shraddha suktam || rishih
    shraddha kamayani chandah anushtup devata shraddha devi om shra̱ddhaya̱gnissami̭dhyate | shra̱ddhaya̭
    vindate ha̱vih | shra̱ddham bhaga̭sya mu̱rdhani̭ | vaca̱sa vḙdayamasi | pri̱yagg shra̭ddhe̱ dada̭tah
    | pri̱yagg shra̭ddhe̱ dida̭satah | pri̱yam bho̱jeshu̱ yajva̭su | i̱dam ma̭ udi̱tam kri̭dhi | yatha̭
    de̱va asṷreshu | shra̱ddhamu̱greshṷ cakri̱re | e̱vam bho̱jeshu̱ yajva̭su | a̱smaka̭mudi̱tam kri̭dhi
    | shra̱ddham dḙva̱ yaja̭manah | va̱yugo̭pa̱ upa̭sate | shra̱ddhagm hri̭da̱yya̭ya'ku
  devanagari: वः॒ सुस॒हास॑ति ॥ ४ ॥ ॥ ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑ ॥ ॥ श्रद्धा सूक्तम् ॥ ऋषिः श्रद्धा कामायनी
    छन्दः अनुष्टुप् देवता श्रद्धा देवी ॐ श्र॒द्धया॒ग्निस्समि॑ध्यते । श्र॒द्धया॑ विन्दते ह॒विः । श्र॒द्धां
    भग॑स्य मू॒र्धनि॑ । वच॒सा वे॑दयामसि । प्रि॒यग्ग् श्र॑द्धे॒ दद॑तः । प्रि॒यग्ग् श्र॑द्धे॒ दिदा॑सतः ।
    प्रि॒यं भो॒जेषु॒ यज्व॑सु । इ॒दं म॑ उदि॒तं कृ॑धि । यथा॑ दे॒वा असु॑रेषु । श्र॒द्धामु॒ग्रेषु॑ चक्रि॒रे
    । ए॒वं भो॒जेषु॒ यज्व॑सु । अ॒स्माक॑मुदि॒तं कृ॑धि । श्र॒द्धां दे॑वा॒ यज॑मानाः । वा॒युगो॑पा॒ उपा॑सते
    । श्र॒द्धाग्ं हृ॑द॒य्य॑याऽकू
