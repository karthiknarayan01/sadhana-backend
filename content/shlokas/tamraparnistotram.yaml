id: tamraparnistotram
category: stotram
name:
  english: tamraparnistotram
  devanagari: ताम्रपर्णीस्तोत्रम्
content:
  english: tamraparnistotram haridrapishtena tamrayah kritva tu pratimam shubham | gandhapushpakshatairlajaih
    dhupanirajanadibhih || 7|| pujayitva yathanyayam naivedyairvividhairapi | namaste devi kalyani mahapatakanashini
    || 8|| tamraparni tvayi snasye trahi mam bhavasagarat | iti mantram samuccarya prarthayitva pranamya
    ca || 9|| pratimamapsu nikshipya punah snatva munishvarah | saha sarvairmuniganairatra vasamakalpayat
    || 10|| iti tamraparnimahatmye pancadashadhyayantargatam tamraparnistotram sampurnam | tamraparnimahatmya
    | adhyaya 5
  devanagari: ताम्रपर्णीस्तोत्रम् हरिद्रापिष्टेन ताम्रायाः कृत्वा तु प्रतिमां शुभाम् । गन्धपुष्पाक्षतैर्लाजैः
    धूपनीराजनादिभिः ॥ ७॥ पूजयित्वा यथान्यायं नैवेद्यैर्विविधैरपि । नमस्ते देवि कल्याणि महापातकनाशिनि ॥
    ८॥ ताम्रपर्णि त्वयि स्नास्ये त्राहि मां भवसागरात् । इति मन्त्रं समुच्चार्य प्रार्थयित्वा प्रणम्य च
    ॥ ९॥ प्रतिमामप्सु निक्षिप्य पुनः स्नात्वा मुनीश्वरः । सह सर्वैर्मुनिगणैरत्र वासमकल्पयत् ॥ १०॥ इति
    ताम्रपर्णीमाहात्म्ये पञ्चदशाध्यायान्तर्गतं ताम्रपर्णीस्तोत्रं सम्पूर्णम् । ताम्रपर्णीमाहात्म्य । अध्याय
    ५
