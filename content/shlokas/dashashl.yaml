id: dashashl
category: stotram
name:
  english: dashashl
  devanagari: दशश्ल्
content:
  english: na jagran na me svapnako va sushuptih na vishvo na va taijasah prajnako va | avidyatmakatvat
    trayanam turiyah tadeko'vashishtah shivah kevalo'ham || 8||
  devanagari: न जाग्रन् न मे स्वप्नको वा सुषुप्तिः न विश्वो न वा तैजसः प्राज्ञको वा । अविद्यात्मकत्वात्
    त्रयाणां तुरीयः तदेकोऽवशिष्टः शिवः केवलोऽहम् ॥ ८॥
meaning: {}
