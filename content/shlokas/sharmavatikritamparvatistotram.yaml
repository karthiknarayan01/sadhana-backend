id: sharmavatikritamparvatistotram
category: stotram
name:
  english: sharmavatikritamparvatistotram
  devanagari: शर्मवतीकृतंपार्वतीस्तोत्रम्
content:
  english: '|| 82|| ityuktva prananamatha parvati tamuvaca ha | paritushta''smi te putri varam prarthaya
    vanchitam || 83|| vishakanya tadovaca sarvam janasi ceshvari | bharturarthe maya sarvah krito''yam
    tapaudyamah || 84|| tatkim tena karishyami sampratam jaraya''''vrita | vasa''tra parvati nityam kanyanam
    shubhada bhava || 85|| ityukta parvati tathastviti praha tatah param | pasparsha panina kanyam cakara
    navayauvanam || 86|| uvaconashodashabdam divya campakasadrishim | vada kanye vararohe kimishyate tatah
    param || 87|| kanya''''ha matah shambhorme darshanam karaya prabhoh | sati praha samagaccha kailasam
    simhasamsthita || 88|| ityukta sa sharmavati yayau kailasameva tu | drishtva ca shankaram sadhvi labdhva
    mantram tu vaishnavam || 89||'
  devanagari: ॥ ८२॥ इत्युक्त्वा प्रणनामाथ पार्वती तामुवाच ह । परितुष्टाऽस्मि ते पुत्रि वरं प्रार्थय वाञ्छितम्
    ॥ ८३॥ विषकन्या तदोवाच सर्वं जानासि चेश्वरि । भर्तुरर्थे मया सर्वः कृतोऽयं तपउद्यमः ॥ ८४॥ तत्किं तेन
    करिष्यामि साम्प्रतं जरयाऽऽवृता । वसाऽत्र पार्वति नित्यं कन्यानां शुभदा भव ॥ ८५॥ इत्युक्ता पार्वती
    तथास्त्विति प्राह ततः परम् । पस्पर्श पाणिना कन्यां चकार नवयौवनाम् ॥ ८६॥ उवाचोनषोडशाब्दां दिव्या चम्पकसदृशीम्
    । वद कन्ये वरारोहे किमिष्यते ततः परम् ॥ ८७॥ कन्याऽऽह मातः शम्भोर्मे दर्शनं कारय प्रभोः । सती प्राह
    समागच्छ कैलासं सिंहसंस्थिता ॥ ८८॥ इत्युक्ता सा शर्मवती ययौ कैलासमेव तु । दृष्ट्वा च शङ्करं साध्वी
    लब्ध्वा मन्त्रं तु वैष्णवम् ॥ ८९॥
