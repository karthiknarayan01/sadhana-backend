id: herambopasthanam-2
category: stotram
name:
  english: herambopasthanam
  devanagari: हेरम्बोपस्थानम्
content:
  english: ekadashanam pravaram sutanam rudrasya mantradhipatim namami | shastrani sarvanyapi yasya kilah
    suryanapohyam timiram haranti || 21|| prajnena buddhaya yadakari padyam sadharanastatra tavopakarah
    | heramba yanmantramrishishcakara vyaktovishishtastava tatra yatra || 22|| jihvasthalam natha vigahamanam
    tvamahurucchishtamayi chaloktya | ucchishtata cettava rudrasuno svadhyayanishthivanatorbhida ka ||
    23|| sarvani dhanyani ca bhakshayantam dantaih shitairdeva sahayavantam | etam bilastham rasanahvayam
    te vaham vido mushikamamananti || 24|| adharacakre vasato ganesha jyotirmayanorjvalatah sadate | ekah
    pacatyannamasheshamushma samprrerayantya imastu vacah || 25|| vaishvanaro'gnih sakalasya jivo vagindriyagnih
    shivanandana tvam | yo veda naiva yuvayorvibhedam pindeshu na muhyati sa prasange || 26|| tvam brahmanaspatyabhidhanamahuh
    kecidvibhorishapadasya putram | anyairbrihaspatyabhidhana ukto dhirairvibhorindrapadasya mantri ||
    27|| jihvaiva vedistava toyaputa lokaprasangastava tatra dhumah | jvala jagannathakatha pavitra ceto
    ghritam juhyati yatra santah || 28|| vidyunmayimurtiragadi jishnorya maunibhih saiva tava svarupam
    | indrasya bhedastava codito yah sa pranavidyuttanubhedamulah || 29|| divyagrigatram dhishana kalatram
    bhargasya putram pranatasya mitram | divyagriruco bhajantametah karindrananamindravajrah || 30|| caturthah
    khandah
  devanagari: एकादशानां प्रवरं सुतानां रुद्रस्य मन्त्रधिपतिं नमामि । शास्त्राणि सर्वाण्यपि यस्य कीलाः
    सूर्यानपोह्यं तिमिरं हरन्ति ॥ २१॥ प्राज्ञेन बुद्धया यदकारि पद्यं सधारणस्तत्र तवोपकारः । हेरम्ब यन्मन्त्रमृषिश्चकार
    व्यक्तोविशिष्टस्तव तत्र यत्र ॥ २२॥ जिह्वास्थलं नाथ विगाहमानं त्वामाहुरुच्छिष्टमयि छलोक्त्या । उच्छिष्टता
    चेत्तव रुद्रसूनो स्वाध्यायनिष्ठीवनतोर्भिदा का ॥ २३॥ सर्वाणि धान्यानि च भक्षयन्तं दन्तैः शितैर्देव
    सहायवन्तम् । एतं बिलस्थं रसनाह्वयं ते वाहं विदो मूषिकमामनन्ति ॥ २४॥ आधारचक्रे वसतो गणेश ज्योतिर्मयाणोर्ज्वलतः
    सदाते । एकः पचत्यन्नमशेषमूष्मा सम्प्र्रेरयन्त्य इमास्तु वाचः ॥ २५॥ वैश्वानरोऽग्निः सकलस्य जीवो वागिन्द्रियाग्निः
    शिवनन्दन त्वम् । यो वेद नैव युवयोर्विभेदं पिण्डेषु ना मुह्यति स प्रसङ्गे ॥ २६॥ त्वां ब्रह्मणस्पत्यभिधानमाहुः
    केचिद्विभोरीशपदस्य पुत्रम् । अन्यैर्बृहस्पत्यभिधान उक्तो धीरैर्विभोरिन्द्रपदस्य मन्त्री ॥ २७॥ जिह्वैव
    वेदिस्तव तोयपूता लोकप्रसङ्गस्तव तत्र धूमः । ज्वाला जगन्नाथकथा पवित्रा चेतो घृतं जुह्यति यत्र सन्तः
    ॥ २८॥ विद्युन्मयीमूर्तिरगादि जिष्णोर्या मौनिभिः सैव तव स्वरूपम् । इन्द्रस्य भेदस्तव चोदितो यः स प्राणविद्युत्तनुभेदमूलः
    ॥ २९॥ दिव्याग्रिगात्रं धिषणा कलत्रं भर्गस्य पुत्रं प्रणतस्य मित्रम् । दिव्याग्रिरुचो भजन्तामेताः करीन्द्राननमिन्द्रवज्राः
    ॥ ३०॥ चतुर्थः खण्दः
