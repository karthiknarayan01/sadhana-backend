id: bhargavakavacam
category: kavacha
name:
  english: bhargavakavacam
  devanagari: भार्गवकवचम्
content:
  english: vira shriparicumbyamanamahitasvabrahmatejonidhim || 13|| om jamadagnyah shirah patu patu murdhanamurdhvadrik
    | lalatam lalitah patu bhruvau bhrityartinashanah || 14|| shravasi sushrava me'vyatkarnau karnantalocanah
    | netre gotrartiha me'vyallocane bhavamocanah || 15|| gande me khandaparashuh kapolau patu shilavan
    | nase sunasah payanme nasike dasavatsalah || 16|| rasanam rasarupo'vyadrasajnam renukasutah | adharau
    patu me nityamadharikritashatravah || 17|| vaktram citracaritro'vyaddantandantindravikramah | cubukam
    ripujitpatu grivam shrivatsalanchanah || 18|| skandhau me skandavijayi kakshe me kshatriyantakah |
    bhujau me satatam patu sahasrabhujashasanah || 19|| karau hitakarah patu pani kshoni bharapahah |
    angulirmangalaguno nakhani makhakrinmama || 20|| vakshah patu mamabhikshnam kshatajabhishavapriyah
    | urah purushaviro me parshvau patu parashvadhi || 21|| udarasthajagatpayadudaram mama sarvada | bhayapaho'vyannabhim
    me madhyam nidhyatavishtapah || 22|| lingam shankarashishyo'vyadupastham nistulaprabhah | payvapanam
    ca me payatsayakasanavansada || 23|| trih saptakritvah kulaha trikam me'vatu sarvada | parameshthyavatatprishtham
    pitharam dridha vikramah || 24|| uru merusamah patu janu me jagatam patih | janghe sanghatahantavyatprapade
    vipadantakah || 25|| padau me padacaryavyaccaranau karananidhih | padangulih papaha me payatpadatale
    parah || 26|| parashvadhadharah payadramah padanakhani me | purvabhibhashi mam payatpurvasyam dishi
    santatam || 27|| dakshinasyamapi dishi dakshayajnantaka priyah | pashcimasyam sada payatpashcatyambudhimardanah
    || 28|| vittesharakshitashayam payanmam sattamarcitah | sarvatah sarvajitpayanmamangani bhayatprabhuh
    || 29|| mano mahendranilayashcittam me driptanashanah | buddhim siddharcitah payadahantamanahankritih
    || 30|| karmani kartaviryarirhelam haihayavamshahah | haratvamoghadrin moham krodham ca krodhadarpaha
    || 31|| shriyam karotu me shrishah pushtim me pushtivardhanah | santanam satatam dadyadbhrigusatanabhuruhah
    || 32|| ayumshi me vitanutadaryah paramapurushah | asham me purayatvashu kashyaparpitavishtapah |
    shrimanparashurayo mam patu sarvatmana sada om || 33|| ityetatkavacam divyamabhedyam mantrayantribhih
    | kathitam devi te guhyam priyeti paramadbhutam || 34|| na nastikaya nadatre na cashraddhalave priye
    | deyannavinitayaitannabhaktaya kadacana || 35|| najapakaya najnatre nasatyavacase kvacit | namalamantrine
    devi pradeyam napyamantrine || 36|| deyam shraddhalave bhaktya pranataya natatmane | gunanvitaya shuddhaya
    mantragoptre ca mantrine || 37|| avashyametajjaptavyam trisandhyam niyamanvitaih | mantravasane mantrajnai
    racitam mantrasiddhaye || 38|| varmaitacca japenmantri japedva satatam manuh | asecitadiva taroh phalam
    napnoti sadrasam || 39|| jayakamo bhurjapatre raktabindubhirujjavalaih | likhitvavartayedratrau kavacamshatasamkhyaya
    || 40|| sampujya dhupadipadyairdhyatva ca hridi bhargavam | haste badhva ranam gatva vijayashriyamapnuyat
    || 41|| evam samprasthitasyasya vidyavade rane'pi va | vacaspatirva shakro va vashyah syatkimutapare
    || 42|| athava tilakam kritva raktakshodena bhamini | kavacenabhijaptena gacchanjayamavapnuyat ||
    43|| shrikamastu mahendradrerdronim gatva manoharam | tatra mandalamasthaya candabhanum vilokayan
    || 44|| japedidam mahadvarma pratyaham shatasamkhyaya | mandalante shriyam shreshtha labhate bhargavajnaya
    || 45|| siddhayo vividhastasya divyajyotirlatalayah | sidhyanti siddhavandyasya kripaya vismayavahah
    || 46|| bhutapretapishacashca rogashca vividhashubhah | dushta nripastaskarashca vyagrasimhagajadayah
    || 47|| shrimadbhrigukulottamsadamshadamshitamadraje | drishtvaiva hi palayante mrityum drishtvaiva
    hi prajah || 48|| jamadagnyasya yo vanchetsannidhyam yogidurlabham | daridryaduhkhashamanam samsarabhayanashanam
    || 49|| sa mahendrasya shikhare snatvopasthaya bhaskaram | tanmadhyavartinam shantam jatamandalamanditam
    || 50|| parashcadhadhanurdandarajitam sadvayanvitam | akshasutram suvibhranam dakshine'ngulipallave
    || 51|| vamajanutalanyastavamapani kusheshayam | unmajjajjvalam grivamamilita vilocanam || 52|| suprasannamukhambhojam
    susmitam pallavadharam | sundaram sundarapangam bhogibhogabhujadvayam || 53|| bhaktanugrahakam devam
    jamadagnyam jagatpatim | dhyayantamatmanatmanam dhyayetpranatavastalam || 54|| atha dvadashabhih punyairnamabhih
    papaharibhih | japatamishtadairbhrityaparijatam samarcayet || 55|| jamadagnyo jananneta brahmanyo
    brahmavatsalah | kirtaviryakulocchetta kshatravamshapratapanah || 56|| vishvajiddikshito ramah kashyapashasuradrumah
    | parashvadhadharah shanto mahendrakritaketanah || 57|| etairdvadashabhirdivyairgopyairabhyarcya namabhih
    | upatishthetpunarguhyairmukhyairnamabhirishvaram | kshipraprasadajananaishcaturvargaphalodayaih ||
    58|| hanta te sampravakshyami tanyapi pranatasi yat | imani gauri namani sugopyani satamapi || 59||
    om hamsastrayimayo dhata yogindrahridalayah | tridhama trigunatitastrimurtistrijaganmayah || 60||
    narayanah param brahma param tattvam paratparah | bhargavo dharmacarano bhargarupah satam gatih ||
    61|| iti shodashabhih stutva namabhirirshipungavam | sarvashisham patim devam sakalabhishtadayakaih
    || 62|| atmanam vinyasedangeshvanena kavacena sah | mrigimudrikaya dhimanvajrasarena saravit || 63||
    dashacaram pratidinam masamekam samacaret | spapne pashyati devesham bhargavam bhrigunandanam || 64||
    cintitarthapradam saumyam cintamanimivaparam | masatrayam tu vinyaste sakshatpashyati japakah || 65||
    manasah samprasadena labdhva varamanuttamam | animadigunairyukto brahmalokamavapnuyat || 66|| athava
    yogasiddhim yo dhatu siddhim ca vacchati | kurukshetre mahendre va japedayutamatmavan || 67|| sarvashcaushadhayastasya
    khecaratvadhisiddhidah | rasasiddhipradashcapi sidhyantyasya na samshayah || 68|| mahendradririva
    kshetram siddhidam nasti bhutale | jamadagnya ivanyo'sti na devo bhrityavatsalah || 69|| prasphuradrunasauvarnarashinam
    janmabhuh parah | tathedamiva varmanyaddharmadiphaladam na hi || 70|| kavace'sminsakrijjapte mantravritti
    sahasrajam | phalamapnotyavikalam tasmannityam japennarah || 71|| amantri vapi mantri va bhargave
    bhaktimannarah | japennityamidam varma mantrasiddhimavapnuyat || 72|| sarasvatamidam devi kavacam
    vakpradam nrinam|| muko'pi vagmi bhavati japannetadrururyatha || 73|| nityam parashvadhabhritah kavacasyasya
    dharanat | sabhasu vadatam shreshtho rajnam bhavati ca priyah || 74|| vaidikam tantrikam caiva mantrikam
    jnanamuttamam | kavacasyasya japi tu brahmajnanam ca vindati || 75|| ityetaduktam kavacam maya haihayavidvishah
    | gopaniyamidam devi mamatmasi maniryatha || 76|| dhanyam yashasyamayushyam shrikaram pushtivardhanam
    | japatam kavacam nityam sarvasaubhagyapuritam || 77|| iti shri vishnuyamale uparibhage jamadagnyadivyanjanasiddhi
  devanagari: वीर श्रीपरिचुम्ब्यमानमहितस्वब्रह्मतेजोनिधिम् ॥ १३॥ ॐ जामदग्न्यः शिरः पातु पातु मूर्धानमूर्ध्वदृक्
    । ललाटं ललितः पातु भ्रुवौ भृत्यार्तिनाशनः ॥ १४॥ श्रवसी सुश्रवा मेऽव्यात्कर्णौ कर्णान्तलोचनः । नेत्रे
    गोत्रार्तिहा मेऽव्याल्लोचने भवमोचनः ॥ १५॥ गण्डे मे खण्डपरशुः कपोलौ पातु शीलवान् । नासे सुनासः पायान्मे
    नासिके दासवत्सलः ॥ १६॥ रसनां रसरूपोऽव्याद्रसज्ञां रेणुकासुतः । अधरौ पातु मे नित्यमधरीकृतशात्रवः ॥
    १७॥ वक्त्रं चित्रचरित्रोऽव्याद्दन्तान्दन्तिन्द्रविक्रमः । चुबुकं रिपुजित्पातु ग्रीवां श्रीवत्सलाञ्छनः
    ॥ १८॥ स्कन्धौ मे स्कन्दविजयी कक्षे मे क्षत्रियान्तकः । भुजौ मे सततं पातु सहस्रभुजशासनः ॥ १९॥ करौ हितकरः
    पातु पाणी क्षोणी भरापहः । अङ्गुलीर्मङ्गलगुणो नखानि मखकृन्मम ॥ २०॥ वक्षः पातु ममाभीक्ष्णं क्षतजाभिषवप्रियः
    । उरः पुरुषवीरो मे पार्श्वौ पातु परश्वधी ॥ २१॥ उदरस्थजगत्पायादुदरं मम सर्वदा । भयापहोऽव्यान्नाभिं
    मे मध्यं निध्यातविष्टपः ॥ २२॥ लिङ्गं शङ्करशिष्योऽव्यादुपस्थं निस्तुलप्रभः । पाय्वपानं च मे पायात्सायकासनवान्सदा
    ॥ २३॥ त्रिः सप्तकृत्वः कुलहा त्रिकं मेऽवतु सर्वदा । परमेष्ठ्यवतात्पृष्ठं पिठरं दृढ विक्रमः ॥ २४॥ ऊरु
    मेरुसमः पातु जानू मे जगतां पतिः । जङ्घे सङ्घातहन्ताव्यात्प्रपदे विपदान्तकः ॥ २५॥ पादौ मे पादचार्यव्याच्चरणौ
    करणानिधिः । पादाङ्गुलीः पापहा मे पायात्पादतले परः ॥ २६॥ परश्वधधरः पायद्रामः पादनखानि मे । पूर्वाभिभाषी
    मां पायात्पूर्वस्यां दिशि सन्ततम् ॥ २७॥ दक्षिणस्यामपि दिशि दक्षयज्ञान्तक प्रियः । पश्चिमस्यां सदा
    पायात्पाश्चात्याम्बुधिमर्दनः ॥ २८॥ वित्तेशरक्षिताशायां पायान्मां सत्तमार्चितः । सर्वतः सर्वजित्पायान्ममाङ्गनि
    भयात्प्रभुः ॥ २९॥ मनो महेन्द्रनिलयश्चित्तं मे दृप्तनाशनः । बुद्धिं सिद्धार्चितः पायादहन्तामनहङ्कृतिः
    ॥ ३०॥ कर्माणि कार्तवीर्यारिर्हेलां हैहयवंशहाः । हरत्वमोघदृङ् मोहं क्रोधं च क्रोधदर्पहा ॥ ३१॥ श्रियं
    करोतु मे श्रीशः पुष्टिं मे पुष्टिवर्धनः । सन्तानं सततं दद्याद्भृगुसतानभूरुहः ॥ ३२॥ आयूंषि मे वितनुतादार्यः
    परमपूरुषः । आशां मे पूरयत्वाशु कश्यपार्पितविष्टपः । श्रीमान्परशुरायो मां पातु सर्वात्मना सदा ॐ ॥ ३३॥
    इत्येतत्कवचं दिव्यमभेद्यं मन्त्रयन्त्रिभिः । कथितं देवि ते गुह्यं प्रियेति परमाद्भुतम् ॥ ३४॥ न नास्तिकाय
    नादात्रे न चाश्रद्धालवे प्रिये । देयान्नाविनीतायैतन्नाभक्ताय कदाचन ॥ ३५॥ नाजापकाय नाज्ञात्रे नासत्यवचसे
    क्वचित् । नामालामन्त्रिणे देवि प्रदेयं नाप्यमन्त्रिणे ॥ ३६॥ देयं श्रद्धालवे भक्त्या प्रणताय नतात्मने
    । गुणान्विताय शुद्धाय मन्त्रगोप्त्रे च मन्त्रिणे ॥ ३७॥ अवश्यमेतज्जप्तव्यं त्रिसन्ध्यं नियमान्वितैः
    । मन्त्रावसाने मन्त्रज्ञै रचितं मन्त्रसिद्धये ॥ ३८॥ वर्मैतच्च जपेन्मन्त्री जपेद्वा सततं मनुः । आसेचितादिव
    तरोः फलं नाप्नोति सद्रसम् ॥ ३९॥ जयकामो भूर्जपत्रे रक्तबिन्दुभिरुज्जवलैः । लिखित्वावर्तयेद्रात्रौ कवचंशतसंख्यया
    ॥ ४०॥ सम्पूज्य धूपदीपाद्यैर्ध्यात्वा च हृदि भार्गवम् । हस्ते बध्वा रणं गत्वा विजयश्रियमाप्नुयात् ॥
    ४१॥ एवं सम्प्रस्थितस्यास्य विद्यावादे रणेऽपि वा । वाचस्पतिर्वा शक्रो वा वश्यः स्यात्किमुतापरे ॥ ४२॥
    अथवा तिलकं कृत्वा रक्तक्षोदेन भामिनी । कवचेनाभिजप्तेन गच्छन्जयमवाप्नुयात् ॥ ४३॥ श्रीकामस्तु महेन्द्राद्रेर्द्रोणिं
    गत्वा मनोहराम् । तत्र मण्डलमास्थाय चण्डभानुं विलोकयन् ॥ ४४॥ जपेदिदं महद्वर्म प्रत्यहं शतसंख्यया ।
    मण्डलान्ते श्रियं श्रेष्ठा लभते भार्गवाज्ञया ॥ ४५॥ सिद्धयो विविधास्तस्य दिव्यज्योतिर्लतालयः । सिध्यन्ति
    सिद्धवन्द्यस्य कृपया विस्मयावहाः ॥ ४६॥ भूतप्रेतपिशाचश्च रोगश्च विविधाशुभाः । दुष्टा नृपास्तस्कराश्च
    व्याग्रसिंहगजादयः ॥ ४७॥ श्रीमद्भृगुकुलोत्तंसदंशदंशितमद्रजे । दृष्ट्वैव हि पलायन्ते मृत्युं दृष्ट्वैव
    हि प्रजाः ॥ ४८॥ जामदग्न्यस्य यो वाञ्छेत्सान्निध्यं योगिदुर्लभम् । दारिद्र्यदुःखशमनं संसारभयनाशनम्
    ॥ ४९॥ स महेन्द्रस्य शिखरे स्नात्वोपस्थाय भास्करम् । तन्मध्यवर्तिनं शान्तं जटामण्डलमण्डितम् ॥ ५०॥ परश्चधधनुर्दण्डराजितां
    सद्वयान्वितम् । अक्षसूत्रं सुविभ्राणं दक्षिणेऽङ्गुलिपल्लवे ॥ ५१॥ वामजानुतलन्यस्तवामपाणि कुशेशयम् ।
    उन्मज्जज्ज्वलं ग्रीवमामीलित विलोचनम् ॥ ५२॥ सुप्रसन्नमुखाम्भोजं सुस्मितं पल्लवाधरम् । सुन्दरं सुन्दरापाङ्गं
    भोगिभोगभुजद्वयम् ॥ ५३॥ भक्तानुग्राहकं देवं जामदग्न्यं जगत्पतिम् । ध्यायन्तमात्मनात्मानं ध्यायेत्प्रणतवस्तलम्
    ॥ ५४॥ अथ द्वादशभिः पुण्यैर्नामभिः पापहारिभिः । जपतामिष्टदैर्भृत्यपारिजातं समर्चयेत् ॥ ५५॥ जामदग्न्यो
    जनन्नेता ब्रह्मण्यो ब्रह्मवत्सलः । कीर्तवीर्यकुलोच्छेत्ता क्षत्रवंशप्रतापनः ॥ ५६॥ विश्वजिद्दीक्षितो
    रामः कश्यपाशासुरद्रुमः । परश्वधधरः शान्तो महेन्द्रकृतकेतनः ॥ ५७॥ एतैर्द्वादशभिर्दिव्यैर्गोप्यैरभ्यर्च्य
    नामभिः । उपतिष्ठेत्पुनर्गुह्यैर्मुख्यैर्नामभिरीश्वरम् । क्षिप्रप्रसादजननैश्चतुर्वर्गफलोदयैः ॥ ५८॥
    हन्त ते सम्प्रवक्ष्यामि तान्यपि प्रणतासि यत् । इमानि गौरि नामानि सुगोप्यानि सतामपि ॥ ५९॥ ॐ हंसस्त्रयीमयो
    धाता योगीन्द्रहृदालयः । त्रिधामा त्रिगुणातीतस्त्रिमूर्तिस्त्रिजगन्मयः ॥ ६०॥ नारायणः परं ब्रह्म परं
    तत्त्वं परात्परः । भार्गवो धर्मचरणो भर्गरूपः सतां गतिः ॥ ६१॥ इति षोडशभिः स्तुत्वा नामभिऋर्षिपुङ्गवम्
    । सर्वाशिषां पतिं देवं सकलाभीष्टदायकैः ॥ ६२॥ आत्मानं विन्यसेदङ्गेष्वनेन कवचेन सः । मृगीमुद्रिकया धीमान्वज्रसारेण
    सारवित् ॥ ६३॥ दशचारं प्रतिदिनं मासमेकं समाचरेत् । स्पप्ने पश्यति देवेशं भार्गवं भृगुनन्दनम् ॥ ६४॥
    चिन्तितार्थप्रदं सौम्यं चिन्तामणिमिवापरम् । मासत्रयं तु विन्यस्ते साक्षात्पश्यति जापकः ॥ ६५॥ मनसः
    सम्प्रसादेन लब्ध्वा वरमनुत्तमम् । अणिमादिगुणैर्युक्तो ब्रह्मलोकमवाप्नुयात् ॥ ६६॥ अथवा योगसिद्धिं यो
    धातु सिद्धिं च वाच्छति । कुरुक्षेत्रे महेन्द्रे वा जपेदयुतमात्मवान् ॥ ६७॥ सर्वाश्चौषधयस्तस्य खेचरत्वाधिसिद्धिदाः
    । रससिद्धिप्रदाश्चापि सिध्यन्त्यस्य न संशयः ॥ ६८॥ महेन्द्राद्रिरिव क्षेत्रं सिद्धिदं नास्ति भूतले
    । जामदग्न्य इवान्योऽस्ति न देवो भृत्यवत्सलः ॥ ६९॥ प्रस्फुरद्रुणसौवर्णराशीनां जन्मभूः परः । तथेदमिव
    वर्मान्यद्धर्मादिफलदं न हि ॥ ७०॥ कवचेऽस्मिन्सकृज्जप्ते मन्त्रावृत्ति सहस्रजम् । फलमाप्नोत्यविकलं तस्मान्नित्यं
    जपेन्नरः ॥ ७१॥ अमन्त्री वापि मन्त्री वा भार्गवे भक्तिमान्नरः । जपेन्नित्यमिदं वर्म मन्त्रसिद्धिमवाप्नुयात्
    ॥ ७२॥ सारस्वतमिदं देवि कवचं वाक्प्रदं नृणाम्॥ मूकोऽपि वाग्मी भवति जपन्नेतद्रुरुर्यथा ॥ ७३॥ नित्यं
    परश्वधभृतः कवचस्यास्य धारणात् । सभासु वदतां श्रेष्ठो राज्ञां भवति च प्रियः ॥ ७४॥ वैदिकं तान्त्रिकं
    चैव मान्त्रिकं ज्ञानमुत्तमम् । कवचस्यास्य जापी तु ब्रह्मज्ञानं च विन्दति ॥ ७५॥ इत्येतदुक्तं कवचं मया
    हैहयविद्विषः । गोपनीयमिदं देवि ममात्मासि मणिर्यथा ॥ ७६॥ धन्यं यशस्यमायुष्यं श्रीकरं पुष्टिवर्धनम्
    । जपतां कवचं नित्यं सर्वसौभाग्यपूरितम् ॥ ७७॥ इति श्री विष्णुयामले उपरिभागे जामदग्न्यदिव्याञ्जनसिद्धि
