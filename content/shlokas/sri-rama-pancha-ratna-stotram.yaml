id: sri-rama-pancha-ratna-stotram
category: stotram
name:
  english: Sri Rama Pancha Ratna Stotram
content:
  english: kanjatapatrayata locanaya karnavatamsojjvala kundalaya karunyapatraya suvamshajaya namostu
    ramayasalakshmanaya || || vidyunnibhambhoda suvigrahaya vidyadharaissamstuta sadgunaya viravataraya
    virodhihartre namostu ramayasalakshmanaya || || samsakta divyayudha karmukaya samudra garvapaharayudhaya
    sugrivamitraya surarihantre namostu ramayasalakshmanaya || || pitambaralankrita madhyakaya pitamahendramara
    vanditaya pitre svabhaktasya janasya matre namostu ramayasalakshmanaya || || namo namaste khila pujitaya
    namo namastendunibhananaya namo namaste raghuvamshajaya namostu ramayasalakshmanaya || || imani pancaratnani
    trisandhyam yah pathennarah sarvapapa vinirmuktah sa yati paramam gatim || iti shrishankaracarya viracita
    shriramapancaratnam sampurnam
  devanagari: कञ्जातपत्रायत लोचनाय कर्णावतंसोज्ज्वल कुण्डलाय कारुण्यपात्राय सुवंशजाय नमोस्तु रामायसलक्ष्मणाय
    ॥ ॥ विद्युन्निभाम्भोद सुविग्रहाय विद्याधरैस्संस्तुत सद्गुणाय वीरावतारय विरोधिहर्त्रे नमोस्तु रामायसलक्ष्मणाय
    ॥ ॥ संसक्त दिव्यायुध कार्मुकाय समुद्र गर्वापहरायुधाय सुग्रीवमित्राय सुरारिहन्त्रे नमोस्तु रामायसलक्ष्मणाय
    ॥ ॥ पीताम्बरालङ्कृत मध्यकाय पितामहेन्द्रामर वन्दिताय पित्रे स्वभक्तस्य जनस्य मात्रे नमोस्तु रामायसलक्ष्मणाय
    ॥ ॥ नमो नमस्ते खिल पूजिताय नमो नमस्तेन्दुनिभाननाय नमो नमस्ते रघुवंशजाय नमोस्तु रामायसलक्ष्मणाय ॥ ॥
    इमानि पञ्चरत्नानि त्रिसन्ध्यं यः पठेन्नरः सर्वपाप विनिर्मुक्तः स याति परमां गतिम् ॥ इति श्रीशङ्कराचार्य
    विरचित श्रीरामपञ्चरत्नं सम्पूर्णं
