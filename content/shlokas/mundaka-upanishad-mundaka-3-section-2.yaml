id: mundaka-upanishad-mundaka-3-section-2
category: stotram
name:
  english: Mundaka Upanishad - Mundaka 3, Section 2
content:
  english: '|| tritiyamundake dvitiyah khandah || sa vedaita mbrahma dhama yatra vishva mbhati shubhram
    | upasate purusham ye~ hyakamaste shukrametadativartanti dhirah || || kaman yah kamayate manyamanah
    sa kamabhirjayate tatra tatra | paryaptakamasya kritatmanastu ihaiva sarve praviliyanti kamah || ||
    nayamatma pravacanena labhyo na medhaya na bahuna shrutena | yamevaisha vrinute tena labhya stasyaisha
    atma vivrinute tanum svam || || nayamatma balahinena labhyo na ca pramada ttapaso vapyalingat | etairupayairyatate
    yastu vidvam stasyaisha atma vishate brahmadhama || || samprapyainamrishayo jnanatriptah kritatmano
    vitaragah prashantah | te sarvagam sarvatah prapya dhira yuktatmana || vedantavijnanasunishcitarthah
    sannyasayogad yataya shshuddhasattvah | te brahmalokeshu parantakale paramritah parimucyanti sarve
    || || gatah kalah pancadasha pratishtha devashca sarve pratidevatasu | karmani vijnanamayashca atma
    pare ''vyaye sarve ekibhavanti || ngacchanti namarupe vihaya | tatha vidva nnamarupadvimuktah paratpara
    mpurushamupaiti divyam || mbrahma veda brahmaiva bhavati nasyabrahmavitkule bhavati | tarati shoka
    nguhagranthibhyo vimukto ''bhyuktam | kriyavanta shshrotriya brahmanishthah svaya shim shraddhayantah
    | teshamevaita vi~dhivad yaistu cirnam || thsatyamrishirangirah purovaca naitadacirnavrato ''dhite
    | namah paramarishibhyo namah paramarishibhyah || || || iti mundakopanishadi tritiyamundake dvitiyah
    khandah || || ityatharvavediya mundakopanishatsamapta || o shshrinuyama devah | bhadra ryajatrah |
    sthirairangai stushtuvagm sastanubhih | vyashema devahitam ya~dayuh | svasti na indro vriddhashravah
    | svasti nah pusha vishvavedah | svasti nastarkshyo arishtanemih | svasti no brihaspati shshantih
    || || om shanti'
  devanagari: ॥ तृतीयमुण्डके द्वितीयः खण्डः ॥ स वेदैत म्ब्रह्म धाम यत्र विश्व म्भाति शुभ्रम् । उपासते
    पुरुषं येँ ह्यकामास्ते शुक्रमेतदतिवर्तन्ति धीराः ॥ ॥ कामान् यः कामयते मन्यमानः स कामभिर्जायते तत्र
    तत्र । पर्याप्तकामस्य कृतात्मनस्तु इहैव सर्वे प्रविलीयन्ति कामाः ॥ ॥ नायमात्मा प्रवचनेन लभ्यो न मेधया
    न बहुना श्रुतेन । यमेवैष वृणुते तेन लभ्य स्तस्यैष आत्मा विवृणुते तनूं स्वाम् ॥ ॥ नायमात्मा बलहीनेन
    लभ्यो न च प्रमादा त्तपसो वाप्यलिङ्गात् । एतैरुपायैर्यतते यस्तु विद्वां स्तस्यैष आत्मा विशते ब्रह्मधाम
    ॥ ॥ सम्प्राप्यैनमृषयो ज्ञानतृप्ताः कृतात्मानो वीतरागाः प्रशान्ताः । ते सर्वगं सर्वतः प्राप्य धीरा
    युक्तात्मान ॥ वेदान्तविज्ञानसुनिश्चितार्थाः सन्न्यासयोगाद् यतय श्शुद्धसत्त्वाः । ते ब्रह्मलोकेषु परान्तकाले
    परामृताः परिमुच्यन्ति सर्वे ॥ ॥ गताः कलाः पञ्चदश प्रतिष्ठा देवाश्च सर्वे प्रतिदेवतासु । कर्माणि विज्ञानमयश्च
    आत्मा परे ऽव्यये सर्वे एकीभवन्ति ॥ ङ्गच्छन्ति नामरूपे विहाय । तथा विद्वा न्नामरूपाद्विमुक्तः परात्पर
    म्पुरुषमुपैति दिव्यम् ॥ म्ब्रह्म वेद ब्रह्मैव भवति नास्याब्रह्मवित्कुले भवति । तरति शोक ङ्गुहाग्रन्थिभ्यो
    विमुक्तो ऽभ्युक्तम् । क्रियावन्त श्श्रोत्रिया ब्रह्मनिष्ठाः स्वय षिं श्रद्धयन्तः । तेषामेवैता विँधिवद्
    यैस्तु चीर्णम् ॥ थ्सत्यमृषिरङ्गिराः पुरोवाच नैतदचीर्णव्रतो ऽधीते । नमः परमऋषिभ्यो नमः परमऋषिभ्यः ॥
    ॥ ॥ इति मुण्डकोपनिषदि तृतीयमुण्डके द्वितीयः खण्डः ॥ ॥ इत्यथर्ववेदीय मुण्डकोपनिषत्समाप्ता ॥ ओ श्शृणु॒याम॑
    देवाः । भ॒द्र र्यज॑त्राः । स्थि॒रैरङ्गै स्तुष्टु॒वाग्ं स॑स्त॒नूभिः॑ । व्यशे॑म दे॒वहि॑तं॒ यँदायुः॑
    । स्व॒स्ति न॒ इन्द्रो॑ वृ॒द्धश्र॑वाः । स्व॒स्ति नः॑ पू॒षा वि॒श्ववे॑दाः । स्व॒स्ति न॒स्तार्क्ष्यो॒
    अरि॑ष्टनेमिः । स्व॒स्ति नो॒ बृह॒स्पति॑ श्शान्तिः॑ ॥ ॥ ॐ शान्ति
