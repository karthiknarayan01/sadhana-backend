id: brahma-samhita
category: stotram
name:
  english: Brahma Samhita
content:
  english: ishvarah paramah krishnah saccidanandavigrahah | anadiradirgovindah sarvakaranakaranam || ||
    sahasrapatrakamalam gokulakhyam mahatpadam | tatkarnikaram taddhama tadanantashasambhavam || || karnikaram
    mahadyantram shatkonam vajrakilakam shadanga shatpadisthanam prakritya purushena ca | premanandamahanandarasenavasthitam
    hi yat jyotirupena manuna kamabijena sangatam || || tatkinjalkam tadamshanam tatpatrani shriyamapi
    || || caturasram tatparitah shvetadvipakhyamadbhutam | caturasram caturmurteshcaturdhama catushkritam
    | caturbhih purusharthaishca caturbhirhetubhirvritam | shulairdashabhiranaddhamurdhvadho digvidikshvapi
    | ashtabhirnidhibhirjushtamashtabhih siddhibhistatha | manurupaishca dashabhirdikpalaih parito vritam
    | shyamairgauraishca raktaishca shuklaishca parshadarshabhaih | shobhitam shaktibhistabhiradbhutabhih
    samantatah || || evam jyotirmayo devah sadanandam paratparah | atmaramasya tasyasti prakritya na samagamah
    || || mayaya'ramamanasya na viyogastaya saha | atmana ramaya reme tyaktakalam sisrikshaya || || niyatih
    sa ramadevi tatpriya tadvasham tada | tallingam bhagavan shambhurjotirupah sanatanah | ya yonih saparashaktih
    kamo bijam mahaddhareh || || lingayonyatmika jata ima maheshvari prajah || || shaktiman purushah so'yam
    lingarupi maheshvarah | tasminnavirabhullinge mahavishnurjagatpatih || || sahasrashirsha purushah
    sahasrakshah sahasrapat | sahasrabahurvishvatma sahasramshah sahasrasuh || || narayanah sa bhagavanapastasmatsanatanat
    | avirasitkaranarno nidhih sankarshanatmakah | yoganidram gatastasmin sahasramshah svayam mahan ||
    || tadromabila jaleshu bijam sankarshanasya ca | haimanyandani jatani mahabhutavritani tu || || pratyandamevamekamshadekamshadvishati
    svayam | sahasramurdha vishvatma mahavishnuh sanatanah || || vamangadasrijadvishnum dakshinangatprajapatim
    | jyotirlingamayam shambhum kurcadeshadavasrijat || || ahankaratmakam vishvam tasmadetadvyajayata
    || || atha taistrividhairveshairlilamudvahatah kila | yoganidra bhagavati tasya shririva sangata ||
    || sasrikshayam tato nabhestasya padmam viniryayau | tannalam hemanalinam brahmano lokamadbhutam ||
    || tattvani purvarudhani karanani parasparam | samavayaprayogacca vibhinnani prithak prithak | cicchaktya
    sajjamano'tha bhagavanadipurushah | yojayanmayaya devo yoganidramakalpayat || || yojayitva tu tanyeva
    pravivesha svayam guham | guham pravishte tasmimstu jivatma pratibudhyate || || sa nityo nityasambandhah
    prakritishca paraiva sa || || evam sarvatmasambandham nabhyam padmam harerabhut | tatra brahmabhavadbhuyashcaturvedi
    caturmukhah || || sa jato bhagavacchaktya tatkalam kila coditah | sisrikshayam matim cakre purvasamskarasamskritah
    | dadarsha kevalam dhvantam nanyatkimapi sarvatah || || uvaca puratastasmai tasya divya sarasvati
    | kamah krishnaya govinda he gopijana ityapi | vallabhaya priya vahnermantram te dasyati priyam ||
    || tapastvam tapa etena tava siddhirbhavishyati || || atha tepe sa suciram prinan govindamavyayam
    | shvetadvipapatim krishnam golokastham paratparam | prakritya gunarupinya rupinya paryupasitam |
    sahasradalasampanne kotikinjalkabrimhite | bhumishcintamanistatra karnikare mahasane | samasinam cidanandam
    jyotirupam sanatanam | shabdabrahmamayam venum vadayantam mukhambuje | vilasiniganavritam svaih svairamshairabhishtutam
    || || atha venuninadasya trayimurtimayi gatih | sphuranti praviveshashu mukhabjani svayambhuvah |
    gayatrim gayatastasmadadhigatya sarojajah | samskritashcadiguruna dvijatamagamattatah || || trayya
    prabuddho'tha vidhirvijnatatattvasagarah | tushtava vedasarena stotrenanena keshavam || || cintamaniprakarasadmasu
    kalpavriksha lakshavriteshu surabhirabhipalayantam | lakshmisahasrashatasambhramasevyamanam govindamadipurusham
    tamaham bhajami || || venum kvanantamaravindadalayataksham barhavatamsamasitambudasundarangam | kandarpakotikamaniyavisheshashobham
    govindamadipurusham tamaham bhajami || || alolacandrakalasadvanamalyavamshi ratnangadam pranayakelikalavilasam
    | shyamam tribhangalalitam niyataprakasham govindamadipurusham tamaham bhajami || || angani yasya
    sakalendriyavrittimanti pashyanti panti kalayanti ciram jaganti | anandacinmayasadujjvalavigrahasya
    govindamadipurusham tamaham bhajami || || advaitamacyutamanadimanantarupam adyam puranapurusham navayauvanam
    ca | vedeshu durlabhamadurlabhamatmabhaktau govindamadipurusham tamaham bhajami || || panthastu kotishatavatsarasampragamyo
    vayorathapi manaso munipungavanam | so'pyasti yatprapadasimnyavicintyatattve govindamadipurusham tamaham
    bhajami || || eko'pyasau racayitum jagadandakotim yacchaktirasti jagadandacaya yadantah | andantarasthaparamanucayantarastham
    govindamadipurusham tamaham bhajami || || yadbhavabhavitadhiyo manujastathaiva samprapya rupamahimasanayanabhushah
    | suktairyameva nigamaprathitaih stuvanti govindamadipurusham tamaham bhajami || || anandacinmayarasapratibhavitabhi
    stabhirya eva nijarupataya kalabhih | goloka eva nivasatyakhilatmabhuto govindamadipurusham tamaham
    bhajami || || premanjanacchuritabhaktivilocanena santah sadaiva hridayeshu vilokayanti | yam shyamasundaramacintyagunasvarupam
    govindamadipurusham tamaham bhajami || || ramadimurtishu kalaniyamena tishthan nanavataramakarodbhuvaneshu
    kintu | krishnah svayam samabhavatparamah puman yo govindamadipurusham tamaham bhajami || || yasya
    prabha prabhavato jagadandakoti kotishvasheshavasudhadi vibhutibhinnam | tadbrahma nishkalamanantamasheshabhutam
    govindamadipurusham tamaham bhajami || || maya hi yasya jagadandashatani sute traigunyatadvishayavedavitayamana
    | sattvavalambiparasattvam vishuddhasattvam govindamadipurusham tamaham bhajami || || anandacinmayarasatmataya
    manahsu yah praninam pratiphalan smaratamupetya | lilayitena bhuvanani jayatyajasram govindamadipurusham
    tamaham bhajami || || golokanamni nijadhamni tale ca tasya devi maheshaharidhamasu teshu teshu | te
    te prabhavanicaya vihitashca yena govindamadipurusham tamaham bhajami || || srishtisthitipralayasadhanashaktireka
    chayeva yasya bhuvanani bibharti durga | icchanurupamapi yasya ca ceshtate sa govindamadipurusham
    tamaham bhajami || || kshiram yatha dadhi vikaravisheshayogat sanjayate na hi tatah prithagasti hetoh
    | yah shambhutamapi tatha samupaiti karya dgovindamadipurusham tamaham bhajami || || diparcireva hi
    dashantaramabhyupetya dipayate vivritahetusamanadharma | yastadrigeva hi ca vishnutaya vibhati govindamadipurusham
    tamaham bhajami || || yah karanarnavajale bhajati sma yoga nidramanantajagadandasaromakupah | adharashaktimavalambya
    param svamurtim govindamadipurusham tamaham bhajami || || yasyaikanishvasitakalamathavalambya jivanti
    lomabilaja jagadandanathah | vishnurmahan sa iha yasya kalavishesho govindamadipurusham tamaham bhajami
    || || bhasvan yathashmashakaleshu nijeshu tejah sviyam kiyatprakatayatyapi tadvadatra | brahma ya
    esha jagadandavidhanakarta govindamadipurusham tamaham bhajami || || yatpadapallavayugam vinidhaya
    kumbha dvandve pranamasamaye sa ganadhirajah | vighnan vihantumalamasya jagattrayasya govindamadipurusham
    tamaham bhajami || || agnirmahi gaganamambu maruddishashca kalastathatmamanasiti jagattrayani | yasmadbhavanti
    vibhavanti vishanti yam ca govindamadipurusham tamaham bhajami || || yaccakshuresha savita sakalagrahanam
    raja samastasuramurtirasheshatejah | yasyajnaya bhramati sambhritakalacakro govindamadipurusham tamaham
    bhajami || || dharmo'tha papanicayah shrutayastapamsi brahmadikitapatagavadhayashca jivah | yaddatamatravibhavaprakataprabhava
    govindamadipurusham tamaham bhajami || || yastvindragopamathavendramaho svakarma bandhanurupaphalabhajanamatanoti
    | karmani nirdahati kintu ca bhaktibhajam govindamadipurusham tamaham bhajami || || yam krodhakamasahajapranayadibhiti
    vatsalyamohagurugauravasevyabhavaih | sancintya tasya sadrishim tanumapurete govindamadipurusham tamaham
    bhajami || || shriyah kantah kantah paramapurushah kalpataravo druma bhumishcintamaniganamayi toyamamritam
    | katha ganam natyam gamanamapi vamshi priyasakhi cidanandam jyotih paramapi tadasvadyamapi ca | sa
    yatra kshirabdhih sravati surabhibhyashca sumahan nimeshardhakhyo va vrajati na hi yatrapi samayah
    | bhaje shvetadvipam tamahamiha golokamiti yam vidantaste santah kshitiviralacarah katipaye || ||
    athovaca mahavishnurbhagavantam prajapatim | brahman mahattvavijnane prajasarge ca cenmatih | pancashlokimimam
    vidyam vatsa dattam nibodha me || || prabuddhe jnanabhaktibhyamatmanyanandacinmayi | udetyanuttama
    bhaktirbhagavatpremalakshana || || pramanaistat sadacaraistadabhyasairnirantaram | bodhayanatmanatmanam
    bhaktimapyuttamam labhet || || yasyah shreyaskaram nasti yaya nirvritimapnuyat | ya sadhayati mameva
    bhaktim tameva sadhayet || || dharmananyan parityajya mamekam bhaja vishvasan | yadrishi yadrishi
    shraddha siddhirbhavati tadrishi | kurvannirantaram karma loko'yamanuvartate | tenaiva karmana dhyayanmam
    param bhaktimicchati || || aham hi vishvasya caracarasya bijam pradhanam prakritih pumamshca | mayahitam
    teja idam bibharshi vidhe vidhehi tvamatho jaganti || || iti shri brahma samhita sampurnam |
  devanagari: ईश्वरः परमः कृष्णः सच्चिदानन्दविग्रहः । अनादिरादिर्गोविन्दः सर्वकारणकारणम् ॥ ॥ सहस्रपत्रकमलं
    गोकुलाख्यं महत्पदम् । तत्कर्णिकारं तद्धाम तदनन्ताशसम्भवम् ॥ ॥ कर्णिकारं महद्यन्त्रं षट्कोणं वज्रकीलकम्
    षडङ्ग षट्पदीस्थानं प्रकृत्या पुरुषेण च । प्रेमानन्दमहानन्दरसेनावस्थितं हि यत् ज्योतीरूपेण मनुना कामबीजेन
    सङ्गतम् ॥ ॥ तत्किञ्जल्कं तदंशानां तत्पत्राणि श्रियामपि ॥ ॥ चतुरस्रं तत्परितः श्वेतद्वीपाख्यमद्भुतम्
    । चतुरस्रं चतुर्मूर्तेश्चतुर्धाम चतुष्कृतम् । चतुर्भिः पुरुषार्थैश्च चतुर्भिर्हेतुभिर्वृतम् । शूलैर्दशभिरानद्धमूर्ध्वाधो
    दिग्विदिक्ष्वपि । अष्टभिर्निधिभिर्जुष्टमष्टभिः सिद्धिभिस्तथा । मनुरूपैश्च दशभिर्दिक्पालैः परितो वृतम्
    । श्यामैर्गौरैश्च रक्तैश्च शुक्लैश्च पार्षदर्षभैः । शोभितं शक्तिभिस्ताभिरद्भुताभिः समन्ततः ॥ ॥ एवं
    ज्योतिर्मयो देवः सदानन्दं परात्परः । आत्मारामस्य तस्यास्ति प्रकृत्या न समागमः ॥ ॥ माययाऽरममाणस्य न
    वियोगस्तया सह । आत्मना रमया रेमे त्यक्तकालं सिसृक्षया ॥ ॥ नियतिः सा रमादेवी तत्प्रिया तद्वशं तदा ।
    तल्लिङ्गं भगवान् शम्भुर्जोतिरूपः सनातनः । या योनिः सापराशक्तिः कामो बीजं महद्धरेः ॥ ॥ लिङ्गयोन्यात्मिका
    जाता इमा माहेश्वरी प्रजाः ॥ ॥ शक्तिमान् पुरुषः सोऽयं लिङ्गरूपी महेश्वरः । तस्मिन्नाविरभूल्लिङ्गे महाविष्णुर्जगत्पतिः
    ॥ ॥ सहस्रशीर्षा पुरुषः सहस्राक्षः सहस्रपात् । सहस्रबाहुर्विश्वात्मा सहस्रांशः सहस्रसूः ॥ ॥ नारायणः
    स भगवानापस्तस्मात्सनातनात् । आविरासीत्कारणार्णो निधिः सङ्कर्षणात्मकः । योगनिद्रां गतस्तस्मिन् सहस्रांशः
    स्वयं महान् ॥ ॥ तद्रोमबिल जालेषु बीजं सङ्कर्षणस्य च । हैमान्यण्डानि जातानि महाभूतावृतानि तु ॥ ॥ प्रत्यण्डमेवमेकांशादेकांशाद्विशति
    स्वयम् । सहस्रमूर्धा विश्वात्मा महाविष्णुः सनातनः ॥ ॥ वामाङ्गादसृजद्विष्णुं दक्षिणाङ्गात्प्रजापतिम्
    । ज्योतिर्लिङ्गमयं शम्भुं कूर्चदेशादवासृजत् ॥ ॥ अहङ्कारात्मकं विश्वं तस्मादेतद्व्यजायत ॥ ॥ अथ तैस्त्रिविधैर्वेशैर्लीलामुद्वहतः
    किल । योगनिद्रा भगवती तस्य श्रीरिव सङ्गता ॥ ॥ ससृक्षायां ततो नाभेस्तस्य पद्मं विनिर्ययौ । तन्नालं
    हेमनलिनं ब्रह्मणो लोकमद्भुतम् ॥ ॥ तत्त्वानि पूर्वरूढानि कारणानि परस्परम् । समवायाप्रयोगाच्च विभिन्नानि
    पृथक् पृथक् । चिच्छक्त्या सज्जमानोऽथ भगवानादिपूरुषः । योजयन्मायया देवो योगनिद्रामकल्पयत् ॥ ॥ योजयित्वा
    तु तान्येव प्रविवेश स्वयं गुहाम् । गुहां प्रविष्टे तस्मिंस्तु जीवात्मा प्रतिबुध्यते ॥ ॥ स नित्यो नित्यसम्बन्धः
    प्रकृतिश्च परैव सा ॥ ॥ एवं सर्वात्मसम्बन्धं नाभ्यां पद्मं हरेरभूत् । तत्र ब्रह्माभवद्भूयश्चतुर्वेदी
    चतुर्मुखः ॥ ॥ स जातो भगवच्छक्त्या तत्कालं किल चोदितः । सिसृक्षायां मतिं चक्रे पूर्वसंस्कारसंस्कृतः
    । ददर्श केवलं ध्वान्तं नान्यत्किमपि सर्वतः ॥ ॥ उवाच पुरतस्तस्मै तस्य दिव्या सरस्वती । कामः कृष्णाय
    गोविन्द हे गोपीजन इत्यपि । वल्लभाय प्रिया वह्नेर्मन्त्रं ते दास्यति प्रियम् ॥ ॥ तपस्त्वं तप एतेन तव
    सिद्धिर्भविष्यति ॥ ॥ अथ तेपे स सुचिरं प्रीणन् गोविन्दमव्ययम् । श्वेतद्वीपपतिं कृष्णं गोलोकस्थं परात्परम्
    । प्रकृत्या गुणरूपिण्या रूपिण्या पर्युपासितम् । सहस्रदलसम्पन्ने कोटिकिञ्जल्कबृंहिते । भूमिश्चिन्तामणिस्तत्र
    कर्णिकारे महासने । समासीनं चिदानन्दं ज्योतिरूपं सनातनम् । शब्दब्रह्ममयं वेणुं वादयन्तं मुखाम्बुजे
    । विलासिनीगणवृतं स्वैः स्वैरंशैरभिष्टुतम् ॥ ॥ अथ वेणुनिनादस्य त्रयीमूर्तिमयी गतिः । स्फुरन्ती प्रविवेशाशु
    मुखाब्जानि स्वयम्भुवः । गायत्रीं गायतस्तस्मादधिगत्य सरोजजः । संस्कृतश्चादिगुरुणा द्विजतामगमत्ततः ॥
    ॥ त्रय्या प्रबुद्धोऽथ विधिर्विज्ञाततत्त्वसागरः । तुष्टाव वेदसारेण स्तोत्रेणानेन केशवम् ॥ ॥ चिन्तामणिप्रकरसद्मसु
    कल्पवृक्ष लक्षावृतेषु सुरभीरभिपालयन्तम् । लक्ष्मीसहस्रशतसम्भ्रमसेव्यमानं गोविन्दमादिपुरुषं तमहं भजामि
    ॥ ॥ वेणुं क्वणन्तमरविन्ददलायताक्षं बर्हावतंसमसिताम्बुदसुन्दराङ्गम् । कन्दर्पकोटिकमनीयविशेषशोभं गोविन्दमादिपुरुषं
    तमहं भजामि ॥ ॥ आलोलचन्द्रकलसद्वनमाल्यवंशी रत्नाङ्गदं प्रणयकेलिकलाविलासम् । श्यामं त्रिभङ्गललितं नियतप्रकाशं
    गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ अङ्गानि यस्य सकलेन्द्रियवृत्तिमन्ति पश्यन्ति पान्ति कलयन्ति चिरं
    जगन्ति । आनन्दचिन्मयसदुज्ज्वलविग्रहस्य गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ अद्वैतमच्युतमनादिमनन्तरूपं
    आद्यं पुराणपुरुषं नवयौवनं च । वेदेषु दुर्लभमदुर्लभमात्मभक्तौ गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ पन्थास्तु
    कोटिशतवत्सरसम्प्रगम्यो वायोरथापि मनसो मुनिपुङ्गवानाम् । सोऽप्यस्ति यत्प्रपदसीम्न्यविचिन्त्यतत्त्वे
    गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ एकोऽप्यसौ रचयितुं जगदण्डकोटिं यच्छक्तिरस्ति जगदण्डचया यदन्तः । अण्डान्तरस्थपरमाणुचयान्तरस्थं
    गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ यद्भावभावितधियो मनुजास्तथैव सम्प्राप्य रूपमहिमासनयानभूषाः । सूक्तैर्यमेव
    निगमप्रथितैः स्तुवन्ति गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ आनन्दचिन्मयरसप्रतिभाविताभि स्ताभिर्य एव निजरूपतया
    कलाभिः । गोलोक एव निवसत्यखिलात्मभूतो गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ प्रेमाञ्जनच्छुरितभक्तिविलोचनेन
    सन्तः सदैव हृदयेषु विलोकयन्ति । यं श्यामसुन्दरमचिन्त्यगुणस्वरूपं गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥
    रामादिमूर्तिषु कलानियमेन तिष्ठन् नानावतारमकरोद्भुवनेषु किन्तु । कृष्णः स्वयं समभवत्परमः पुमान् यो
    गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ यस्य प्रभा प्रभवतो जगदण्डकोटि कोटिष्वशेषवसुधादि विभूतिभिन्नम् । तद्ब्रह्म
    निष्कलमनन्तमशेषभूतं गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ माया हि यस्य जगदण्डशतानि सूते त्रैगुण्यतद्विषयवेदवितायमाना
    । सत्त्वावलम्बिपरसत्त्वं विशुद्धसत्त्वं गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ आनन्दचिन्मयरसात्मतया मनःसु
    यः प्राणिनां प्रतिफलन् स्मरतामुपेत्य । लीलायितेन भुवनानि जयत्यजस्रं गोविन्दमादिपुरुषं तमहं भजामि ॥
    ॥ गोलोकनाम्नि निजधाम्नि तले च तस्य देवि महेशहरिधामसु तेषु तेषु । ते ते प्रभावनिचया विहिताश्च येन गोविन्दमादिपुरुषं
    तमहं भजामि ॥ ॥ सृष्टिस्थितिप्रलयसाधनशक्तिरेका छायेव यस्य भुवनानि बिभर्ति दुर्गा । इच्छानुरूपमपि यस्य
    च चेष्टते सा गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ क्षीरं यथा दधि विकारविशेषयोगात् सञ्जायते न हि ततः पृथगस्ति
    हेतोः । यः शम्भुतामपि तथा समुपैति कार्या द्गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ दीपार्चिरेव हि दशान्तरमभ्युपेत्य
    दीपायते विवृतहेतुसमानधर्मा । यस्तादृगेव हि च विष्णुतया विभाति गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ यः
    कारणार्णवजले भजति स्म योग निद्रामनन्तजगदण्डसरोमकूपः । आधारशक्तिमवलम्ब्य परां स्वमूर्तिं गोविन्दमादिपुरुषं
    तमहं भजामि ॥ ॥ यस्यैकनिश्वसितकालमथावलम्ब्य जीवन्ति लोमबिलजा जगदण्डनाथाः । विष्णुर्महान् स इह यस्य
    कलाविशेषो गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ भास्वान् यथाश्मशकलेषु निजेषु तेजः स्वीयं कियत्प्रकटयत्यपि
    तद्वदत्र । ब्रह्मा य एष जगदण्डविधानकर्ता गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ यत्पादपल्लवयुगं विनिधाय
    कुम्भ द्वन्द्वे प्रणामसमये स गणाधिराजः । विघ्नान् विहन्तुमलमस्य जगत्त्रयस्य गोविन्दमादिपुरुषं तमहं
    भजामि ॥ ॥ अग्निर्मही गगनमम्बु मरुद्दिशश्च कालस्तथात्ममनसीति जगत्त्रयाणि । यस्माद्भवन्ति विभवन्ति विशन्ति
    यं च गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ यच्चक्षुरेष सविता सकलग्रहाणां राजा समस्तसुरमूर्तिरशेषतेजाः ।
    यस्याज्ञया भ्रमति सम्भृतकालचक्रो गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ धर्मोऽथ पापनिचयः श्रुतयस्तपांसि
    ब्रह्मादिकीटपतगावधयश्च जीवाः । यद्दतमात्रविभवप्रकटप्रभावा गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ यस्त्विन्द्रगोपमथवेन्द्रमहो
    स्वकर्म बन्धानुरूपफलभाजनमातनोति । कर्माणि निर्दहति किन्तु च भक्तिभाजां गोविन्दमादिपुरुषं तमहं भजामि
    ॥ ॥ यं क्रोधकामसहजप्रणयादिभीति वात्सल्यमोहगुरुगौरवसेव्यभावैः । सञ्चिन्त्य तस्य सदृशीं तनुमापुरेते
    गोविन्दमादिपुरुषं तमहं भजामि ॥ ॥ श्रियः कान्ताः कान्तः परमपुरुषः कल्पतरवो द्रुमा भूमिश्चिन्तामणिगणमयि
    तोयममृतम् । कथा गानं नाट्यं गमनमपि वंशी प्रियसखि चिदानन्दं ज्योतिः परमपि तदास्वाद्यमपि च । स यत्र
    क्षीराब्धिः स्रवति सुरभीभ्यश्च सुमहान् निमेषार्धाख्यो वा व्रजति न हि यत्रापि समयः । भजे श्वेतद्वीपं
    तमहमिह गोलोकमिति यं विदन्तस्ते सन्तः क्षितिविरलचाराः कतिपये ॥ ॥ अथोवाच महाविष्णुर्भगवन्तं प्रजापतिम्
    । ब्रह्मन् महत्त्वविज्ञाने प्रजासर्गे च चेन्मतिः । पञ्चश्लोकीमिमां विद्यां वत्स दत्तां निबोध मे ॥
    ॥ प्रबुद्धे ज्ञानभक्तिभ्यामात्मन्यानन्दचिन्मयी । उदेत्यनुत्तमा भक्तिर्भगवत्प्रेमलक्षणा ॥ ॥ प्रमाणैस्तत्
    सदाचारैस्तदभ्यासैर्निरन्तरम् । बोधयनात्मनात्मानं भक्तिमप्युत्तमां लभेत् ॥ ॥ यस्याः श्रेयस्करं नास्ति
    यया निर्वृतिमाप्नुयात् । या साधयति मामेव भक्तिं तामेव साधयेत् ॥ ॥ धर्मानन्यान् परित्यज्य मामेकं भज
    विश्वसन् । यादृशी यादृशी श्रद्धा सिद्धिर्भवति तादृशी । कुर्वन्निरन्तरं कर्म लोकोऽयमनुवर्तते । तेनैव
    कर्मणा ध्यायन्मां परां भक्तिमिच्छति ॥ ॥ अहं हि विश्वस्य चराचरस्य बीजं प्रधानं प्रकृतिः पुमांश्च ।
    मयाहितं तेज इदं बिभर्षि विधे विधेहि त्वमथो जगन्ति ॥ ॥ इति श्री ब्रह्म संहिता सम्पूर्णम् ।
