id: maha-shasta-anugraha-kavacham
category: stotram
name:
  english: Maha Shasta Anugraha Kavacham
content:
  english: bhagavan devadevesha sarvajna tripurantaka | prapte kaliyuge ghore mahabhutaih samavrite ||
    mahavyadhi mahavyala ghorarajaih samavrite | duhsvapnashokasantapaih durvinitaih samavrite || svadharmaviratemarge
    pravritte hridi sarvada | tesham siddhim ca muktim ca tvam me bruhi vrishadvaja || shrinu devi mahabhage
    sarvakalyanakarane | mahashastushca deveshi kavacam punyavardhanam || agnistambha jalastambha senastambha
    vidhayakam | mahabhutaprashamanam mahavyadhinivaranam || mahajnanapradam punyam visheshat kalitapaham
    | sarvarakshottamam pumsam ayurarogyavardhanam || kimato bahunoktena yam yam kamayate dvijah | tam
    tamapnotyasandeho mahashastuh prasadanat || kavacasya rishirbrahma gayatrih chanda ucyate | devata
    shrimahashasta devo hariharatmajah || shadangamacaredbhaktya matraya jatiyuktaya | dhyanamasya pravakshyami
    shrinushvavahita priye || asya shri mahashastuh kavacamantrasya | brahma rishih | gayatrih chandah
    | mahashasta devata | hram bijam | hrim shaktih | hrum kilakam | shri mahashastuh prasada siddhyarthe
    jape viniyogah || hram ityadi shadanganyasah || dhyanam tejomandalamadhyagam trinayanam divyambaralankritam
    devam pushpasharekshukarmuka lasanmanikyapatra'bhayam | bibhranam karapankajaih madagaja skandhadhirudham
    vibhum shastaram sharanam bhajami satatam trailokya sammohanam || mahashasta shirah patu phalam hariharatmajah
    | kamarupi drisham patu sarvajno me shrutim sada || ghranam patu kripadhyakshah mukham gauripriyah
    sada | vedadhyayi ca me jihvam patu me cibukam guruh || kantham patu vishuddhatma skandhau patu surarcitah
    | bahu patu virupakshah karau tu kamalapriyah || bhutadhipo me hridayam madhyam patu mahabalah | nabhim
    patu mahavirah kamalaksho'vatu katim || sanipam patu vishveshah guhyam guhyarthavitsada | uru patu
    gajarudhah vajradhari ca januni || janghe patvankushadharah padau patu mahamatih | sarvangam patu
    me nityam mahamayavisharadah || itidam kavacam punyam sarvaghaughanikrintanam | mahavyadhiprashamanam
    mahapatakanashanam || jnanavairagyadam divyamanimadivibhushitam | ayurarogyajananam mahavashyakaram
    param || yam yam kamayate kamam tam tamapnotyasamshayah | trisandhyam yah pathedvidvan sa yati paramam
    gatim || iti shri mahashasta anugraha kavacam |
  devanagari: भगवन् देवदेवेश सर्वज्ञ त्रिपुरान्तक । प्राप्ते कलियुगे घोरे महाभूतैः समावृते ॥ महाव्याधि
    महाव्याल घोरराजैः समावृते । दुःस्वप्नशोकसन्तापैः दुर्विनीतैः समावृते ॥ स्वधर्मविरतेमार्गे प्रवृत्ते
    हृदि सर्वदा । तेषां सिद्धिं च मुक्तिं च त्वं मे ब्रूहि वृषद्वज ॥ शृणु देवि महाभागे सर्वकल्याणकारणे
    । महाशास्तुश्च देवेशि कवचं पुण्यवर्धनम् ॥ अग्निस्तम्भ जलस्तम्भ सेनास्तम्भ विधायकम् । महाभूतप्रशमनं
    महाव्याधिनिवारणम् ॥ महाज्ञानप्रदं पुण्यं विशेषात् कलितापहम् । सर्वरक्षोत्तमं पुंसां आयुरारोग्यवर्धनम्
    ॥ किमतो बहुनोक्तेन यं यं कामयते द्विजः । तं तमाप्नोत्यसन्देहो महाशास्तुः प्रसादनात् ॥ कवचस्य ऋषिर्ब्रह्मा
    गायत्रीः छन्द उच्यते । देवता श्रीमहाशास्ता देवो हरिहरात्मजः ॥ षडङ्गमाचरेद्भक्त्या मात्रया जातियुक्तया
    । ध्यानमस्य प्रवक्ष्यामि शृणुष्वावहिता प्रिये ॥ अस्य श्री महाशास्तुः कवचमन्त्रस्य । ब्रह्मा ऋषिः ।
    गायत्रीः छन्दः । महाशास्ता देवता । ह्रां बीजम् । ह्रीं शक्तिः । ह्रूं कीलकम् । श्री महाशास्तुः प्रसाद
    सिद्ध्यर्थे जपे विनियोगः ॥ ह्रां इत्यादि षडङ्गन्यासः ॥ ध्यानम् तेजोमण्डलमध्यगं त्रिनयनं दिव्याम्बरालङ्कृतं
    देवं पुष्पशरेक्षुकार्मुक लसन्माणिक्यपात्राऽभयम् । बिभ्राणं करपङ्कजैः मदगज स्कन्धाधिरूढं विभुं शास्तारं
    शरणं भजामि सततं त्रैलोक्य सम्मोहनम् ॥ महाशास्ता शिरः पातु फालं हरिहरात्मजः । कामरूपी दृशं पातु सर्वज्ञो
    मे श्रुतिं सदा ॥ घ्राणं पातु कृपाध्यक्षः मुखं गौरीप्रियः सदा । वेदाध्यायी च मे जिह्वां पातु मे चिबुकं
    गुरुः ॥ कण्ठं पातु विशुद्धात्मा स्कन्धौ पातु सुरार्चितः । बाहू पातु विरूपाक्षः करौ तु कमलाप्रियः ॥
    भूताधिपो मे हृदयं मध्यं पातु महाबलः । नाभिं पातु महावीरः कमलाक्षोऽवतु कटिम् ॥ सनीपं पातु विश्वेशः
    गुह्यं गुह्यार्थवित्सदा । ऊरू पातु गजारूढः वज्रधारी च जानुनी ॥ जङ्घे पात्वङ्कुशधरः पादौ पातु महामतिः
    । सर्वाङ्गं पातु मे नित्यं महामायाविशारदः ॥ इतीदं कवचं पुण्यं सर्वाघौघनिकृन्तनम् । महाव्याधिप्रशमनं
    महापातकनाशनम् ॥ ज्ञानवैराग्यदं दिव्यमणिमादिविभूषितम् । आयुरारोग्यजननं महावश्यकरं परम् ॥ यं यं कामयते
    कामं तं तमाप्नोत्यसंशयः । त्रिसन्ध्यं यः पठेद्विद्वान् स याति परमां गतिम् ॥ इति श्री महाशास्ता अनुग्रह
    कवचम् ।
