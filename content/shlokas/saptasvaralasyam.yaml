id: saptasvaralasyam
category: shataka
name:
  english: saptasvaralasyam
  devanagari: सप्तस्वरालास्यम्
content:
  english: ringaparaprashantilaya | 72 nadabrahmaramalayanirdhavitanadaplava | 73 nagashayananamagananaga
    | 74 nagashayanapalitananditaragashayana | 75 nagaratpujitapujananamaganarajan | 76 nadomkaraprabha
    | 77 naktadinanutadhyatashrirama | 78 navanavamanjularagatalanartanagitopasanapritashrirama | 79 navaratnabhakritiratnajalasevitasugunajalashrirama
    | 80 namanandanaditiraghanaganaprashama | 81 nutiganavritanatajanavritashrirama | 82 namoccarananaivedya
    | 83 napyaranimishaparokshanimisha | 84 napyaranimishaikantabhaktaparoksha | 85 nityanaditanamagarjanavarjitabhayadhidurbala
    | 86 namasudharasarasaganarasanaman | 87 naijakritabhimanapuritapujavidhiharitabhimanapuritanaijavidhihridaya
    | 88 nadahimakakudapranimsanaragardrashveta | 89 nutaja | 90 nanditanavaghanashyamanamaghanaghanagana
    | 91 nadaplava | 92 nadavedashastropanishadvido | 93 navanitashashamsana
  devanagari: ृङ्गपारप्रशान्तिलय । ७२ नादब्रह्मरामलयनिर्धावितनादाप्लाव । ७३ नागशयननामगाननाग । ७४ नागशयनपालितानन्दितरागशयन
    । ७५ नागराट्पूजितपूजननामगानराजन् । ७६ नादोंकारप्रभ । ७७ नक्तदिननुतध्यातश्रीराम । ७८ नवनवमञ्जुलरागतालनर्तनगीतोपासनप्रीतश्रीराम
    । ७९ नवरत्नाभकृतिरत्नजालसेवितसुगुणजालश्रीराम । ८० नामानन्दनदीतीरघनगानप्रशम । ८१ नुतिगानावृतनतजनावृतश्रीराम
    । ८२ नामोच्चारणनैवेद्य । ८३ नाप्यरनिमिषपरोक्षनिमिष । ८४ नाप्यरनिमिषैकान्तभक्तपरोक्ष । ८५ नित्यनादितनामगर्जनवर्जितभयाधिदुर्बल
    । ८६ नामसुधारसरसगानरसनामन् । ८७ नैजकृताभिमानपूरितपूजाविधिहारिताभिमानपूरितनैजविधिहृदय । ८८ नादहिमककुदप्रणिंसनरागार्द्रश्वेत
    । ८९ नुताज । ९० नन्दितनवघनश्यामनामघनघनगान । ९१ नादाप्लव । ९२ नादवेदशास्त्रोपनिषद्विदो । ९३ नवनीताशाशंसन
meaning: {}
