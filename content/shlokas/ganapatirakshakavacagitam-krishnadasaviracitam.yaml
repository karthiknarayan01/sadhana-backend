id: ganapatirakshakavacagitam-krishnadasaviracitam
category: kavacha
name:
  english: ganapatirakshakavacagitam (krishnadasaviracitam)
  devanagari: गणपतिरक्षाकवचगीतम् (कृष्णदासविरचितम्)
content:
  english: shriganapatirakshakavacagitam parvateyam mahakayam riddhisiddhivaradayakam ganapatim nidhipatim
    sarvajanalokanayakam rudrapriyam yajnakayam namami he dirghakayakam he gajanana girijanandana raksha
    mam deva raksha mam || 1|| ekadantam kripanantam sarvangasundaradarshanam vakratundam divyarindam
    apurvamangalasparshanam lambodaram pitambaram namami he romaharshanam he gajanana girijanandana raksha
    mam deva raksha mam || 2|| premamurtim kamapurtim caracarahridaspandanam mantramugdham papadagdham
    agrapujyadevavandanam prathamesham shriganesham namami he gaurinandanam he gajanana girijanandana
    raksha mam deva raksha mam || 3|| divyatejam kavirajam yogijanatmakarakam shivanandam paradvandam
    bhavapradapremadharakam vighnanasham dirghashvasam namami he garvamarakam he gajanana girijanandana
    raksha mam deva raksha mam || 4|| prathamam mayureshvaram dvitiyam siddhivinayakam tatashca ballaleshvaram
    asti varadavinayakam pancamam cintamanidevam shashtham ca girijatmajam vighneshvaram mahaganapatim
    namami ashtadevam he gajanana girijanandana raksha mam deva raksha mam || 5|| taruni labhate varam
    ca prityarthi labhate premam vidyarthi labhate vidyam ca moksharthi labhate dhamam artharthi labhate
    artham ca kamarthi labhate kamam he gajanana girijanandana krishnadasah bhajati tvam || 6|| || iti
    shrikrishnadasaviracitam shriganapatirakshakavacagitam sampurnam ||
  devanagari: श्रीगणपतिरक्षाकवचगीतम् पार्वतेयं महाकायं ऋद्धिसिद्धिवरदायकं गणपतिं निधिपतिं सर्वजनलोकनायकं
    रुद्रप्रियं यज्ञकायं नमामि हे दीर्घकायकं हे गजानन गिरिजानन्दन रक्ष मां देव रक्ष माम् ॥ १॥ एकदन्तं
    कृपानन्तं सर्वाङ्गसुन्दरदर्शनं वक्रतुण्डं दिव्यऋण्डं अपूर्वमङ्गलस्पर्शनं लम्बोदरं पीताम्बरं नमामि
    हे रोमहर्षणं हे गजानन गिरिजानन्दन रक्ष मां देव रक्ष माम् ॥ २॥ प्रेममूर्तिं कामपूर्तिं चराचरहृदस्पन्दनं
    मन्त्रमुग्धं पापदग्धं अग्रपूज्यदेववन्दनं प्रथमेशं श्रीगणेशं नमामि हे गौरीनन्दनं हे गजानन गिरिजानन्दन
    रक्ष मां देव रक्ष माम् ॥ ३॥ दिव्यतेजं कविराजं योगीजनात्मकारकं शिवानन्दं पराद्वन्दं भावप्रदप्रेमधारकं
    विघ्ननाशं दीर्घश्वासं नमामि हे गर्वमारकं हे गजानन गिरिजानन्दन रक्ष मां देव रक्ष माम् ॥ ४॥ प्रथमं मयूरेश्वरं
    द्वितीयं सिद्धिविनायकं ततश्च बल्लालेश्वरं अस्ति वरदविनायकं पञ्चमं चिन्तामणिदेवं षष्ठं च गिरिजात्मजं
    विघ्नेश्वरं महागणपतिं नमामि अष्टदेवं हे गजानन गिरिजानन्दन रक्ष मां देव रक्ष माम् ॥ ५॥ तरुणी लभते वरं
    च प्रीत्यार्थी लभते प्रेमं विद्यार्थी लभते विद्यां च मोक्षार्थी लभते धामं अर्थार्थी लभते अर्थं च कामार्थी
    लभते कामं हे गजानन गिरिजानन्दन कृष्णदासः भजति त्वाम् ॥ ६॥ ॥ इति श्रीकृष्णदासविरचितं श्रीगणपतिरक्षाकवचगीतं
    सम्पूर्णम् ॥
