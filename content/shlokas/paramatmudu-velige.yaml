id: paramatmudu-velige
category: stotram
name:
  english: Paramatmudu Velige
content:
  english: adi pallavi paramatmudu vèlige muccata baga tèlusukore anupallavi hariyata harudata surulata
    narulata akhilanda kotulatayandarilo mayamagu mriga khaga naga taru kotulalo vigunamulo satatamu sadhu
    tyagarajadiyashritulalo
  devanagari: आदि पल्लवि परमात्मुडु वॆलिगे मुच्चट बाग तॆलुसुकोरे अनुपल्लवि हरियट हरुडट सुरुलट नरुलट अखिलाण्ड
    कोटुलटयन्दरिलो मयमगु मृग खग नग तरु कोटुललो विगुणमुलो सततमु साधु त्यागराजादियाश्रितुललो
meaning: {}
