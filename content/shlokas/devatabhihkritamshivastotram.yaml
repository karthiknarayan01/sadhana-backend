id: devatabhihkritamshivastotram
category: stotram
name:
  english: devatabhihkritamshivastotram
  devanagari: देवताभिःकृतंशिवस्तोत्रम्
content:
  english: devatabhih kritam shivastotram devata ucuh | jagama devatanikam gananam harshamudvahan | stuvanti
    bhairavam devamantarikshacara janah || 1|| jayananta mahadeva kalamurte sanatana | tvamagnih sarvabhutanamantashcarasi
    nityashah || 2|| tvam yatrajnastvam vashatkarastvam dhata hariravyayah | tvam brahma tvam mahadevastvam
    dhama paramam padam || 3|| onkaramurtiryogatma trayinetrastrilocanah | mahavibhutirdevesho jayasheshajagatpate
    || 4|| tatah kalagnirudro'sau grihitva'ndhakamishvarah | trishulagreshu vinyasya prananarta satam
    gatih || 5|| drishtva'ndhakam devaganah shulaprotam pitamahah | pranemurishvaram devam bhairavam bhavamocakam
    || 6|| iti kurmapurane purvabhage shodashadhyayantargatam devatabhih kritam shivastotram samaptam
    | kurmapurane purvabhage 16
  devanagari: देवताभिः कृतं शिवस्तोत्रम् देवता ऊचुः । जगाम देवतानीकं गणानां हर्षमुद्वहन् । स्तुवन्ति भैरवं
    देवमन्तरिक्षचरा जनाः ॥ १॥ जयानन्त महादेव कालमूर्ते सनातन । त्वमग्निः सर्वभूतानामन्तश्चरसि नित्यशः
    ॥ २॥ त्वं यत्रज्ञस्त्वं वषट्कारस्त्वं धाता हरिरव्ययः । त्वं ब्रह्मा त्वं महादेवस्त्वं धाम परमं पदम्
    ॥ ३॥ ओङ्कारमूर्तिर्योगात्मा त्रयीनेत्रस्त्रिलोचनः । महाविभूतिर्देवेशो जयाशेषजगत्पते ॥ ४॥ ततः कालाग्निरुद्रोऽसौ
    गृहीत्वाऽन्धकमीश्वरः । त्रिशूलाग्रेषु विन्यस्य प्रननर्त सतां गतिः ॥ ५॥ दृष्ट्वाऽन्धकं देवगणाः शूलप्रोतं
    पितामहः । प्रणेमुरीश्वरं देवं भैरवं भवमोचकम् ॥ ६॥ इति कूर्मपुराणे पूर्वभागे षोडशाध्यायान्तर्गतं देवताभिः
    कृतं शिवस्तोत्रं समाप्तम् । कूर्मपुराणे पूर्वभागे १६
