id: devaihkritam07durgastotram-17
category: stotram
name:
  english: devaihkritam07durgastotram 17
  devanagari: देवैःकृतं०७दुर्गास्तोत्रम् १७
content:
  english: devaih kritam 7 durgastotram 17 deva ucuh | jaya durge maheshani jayatmiyajanapriye | trailokyatranakarinyai
    shivayai te namo namah || 3|| namo muktipradayinyai parambayai namo namah | namah samastasamsarotpattisthityantakarike
    || 4|| kalikarupasampanne namaskarakrite namah | chinnamastasvarupayai shrividyayai namo'stu te ||
    5|| bhuvaneshi namastubhyam namaste bhairavakrite | namo'stu bagalamukhyai dhumavatyai namo namah
    || 6|| namastripurasundaryyai matangyai te namonamah | ajitayai namastubhyam vijayayai namo namah
    || 7|| jayayai mangalayai te vilasinyai namo namah | dogdhrirupe namastubhyam namo ghorakrite'stu
    te || 8|| mano'parajitakare nityakare namo namah | sharanagatapalinyai rudranyai te namo namah ||
    9|| namo vedantavedyayai namaste paramatmane | anantakotibrahmandanayikayai namo namah || 10|| iti
    shivapurane umasamhitayam saptacatvarimshadhyayantargatam devaih kritam durgastotram saptam | shivapurana
    | umasamhita | adhyaya 47
  devanagari: देवैः कृतं ७ दुर्गास्तोत्रम् १७ देवा ऊचुः । जय दुर्गे महेशानि जयात्मीयजनप्रिये । त्रैलोक्यत्राणकारिण्यै
    शिवायै ते नमो नमः ॥ ३॥ नमो मुक्तिप्रदायिन्यै पराम्बायै नमो नमः । नमः समस्तसंसारोत्पत्तिस्थित्यन्तकारिके
    ॥ ४॥ कालिकारूपसम्पन्ने नमस्काराकृते नमः । छिन्नमस्तास्वरूपायै श्रीविद्यायै नमोऽस्तु ते ॥ ५॥ भुवनेशि
    नमस्तुभ्यं नमस्ते भैरवाकृते । नमोऽस्तु बगलामुख्यै धूमावत्यै नमो नमः ॥ ६॥ नमस्त्रिपुरसुन्दर्य्यै मातङ्ग्यै
    ते नमोनमः । अजितायै नमस्तुभ्यं विजयायै नमो नमः ॥ ७॥ जयायै मङ्गलायै ते विलासिन्यै नमो नमः । दोग्ध्रीरूपे
    नमस्तुभ्यं नमो घोराकृतेऽस्तु ते ॥ ८॥ मनोऽपराजिताकारे नित्याकारे नमो नमः । शरणागतपालिन्यै रुद्राण्यै
    ते नमो नमः ॥ ९॥ नमो वेदान्तवेद्यायै नमस्ते परमात्मने । अनन्तकोटिब्रह्माण्डनायिकायै नमो नमः ॥ १०॥ इति
    शिवपुराणे उमासंहितायां सप्तचत्वारिंशाध्यायान्तर्गतं देवैः कृतं दुर्गास्तोत्रं साप्तम् । शिवपुराण ।
    उमासंहिता । अध्याय ४७
