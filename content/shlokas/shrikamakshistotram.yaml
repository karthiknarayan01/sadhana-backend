id: shrikamakshistotram
category: stotram
name:
  english: shrikamakshistotram
  devanagari: श्रीकामाक्षिस्तोत्रम्
content:
  english: aishvaryamindumauleh aikatmya prakritikancimadhyagatam aindavakishorashekhara maidamparyam
    cakasti nigamanam
  devanagari: ऐश्वर्यमिन्दुमौलेः ऐकात्म्य प्रकृतिकाञ्चिमध्यगताम् ऐन्दवकिशोरशेखर मैदंपर्यं चकास्ति निगमानाम्
meaning: {}
