id: rasakrida1gargasamhita
category: stotram
name:
  english: rasakrida1gargasamhita
  devanagari: रासक्रीडा१गर्गसम्हिता
content:
  english: rjhankaranupurayutairvishadaih katakshaih | sangitanrityaviditairbhrukutivibhangai radham harim
    ca satatam paritoshayantyah || 40|| tasminnikunjabhavane yamunatate'pi vamshivate vanadharanikate
    harim tam | shriradhaya ca girirajatatam vrajantam nandatmajam ca nataveshadharam smara tvam || 41||
    shripadmaraganakhadiptipadaravindam jhankaranupuradharam sphuradangadesham | kurvantameva tu padarunabhumidesham
    shrimatparagasurucalamitastatastu || 42|| lakshmikarabjaparilalitajanudesham rambhoru pitavasanam
    tu krishodarabham | romavalibhramaranabhisarastrirekham kancidharam bhrigupadam manikaustubhadhyam
    || 43|| shrivatsahararuciram navameghanilam pitambaram karikarasphutabahudandam | ratnangadam ca manikankanapadmahastam
    shrirajahamsavarakandharashobhamanam || 44|| shrikambukanthalalitam vilasatkapolam madhyam tu nimnacibukam
    kila kundadantam | bimbadharam smitalasacchukacancunasam piyushakalpavacanam pracalatkataksham ||
    45|| shripundarikadalanetramanangalilam bhrumandalasmitagunavritakamacapam | vidyucchatocchalitaratnakiritakotim
    martandamandalavikundalamanditabham || 46|| vamshidharam tvahivilolagudalakadhyam radhapatim sajalapadmamukham
    calantam | kandarpakotighanamanaharam krishangam vamshivate natavaram bhaja sarvatha tvam || 47||
    araktaraktanakhacandrapadabjashobham manjiranupuraranatkatikinkinikam | shrighantikakanakakankanashabdamuktam
    radham dadhami tarupunjanikunjamadhye || 48|| nilambaraih kanakarashmitatasphuradbhih shribhanujatatamarudgaticancalangaih
    | sukshmasvarupalalitairatigauravarnam raseshvarim bhaja manoharamandahasam || 49|| balarkamandalamahangadaratnaharam
    tatankatoranamanindramanoharabham | shrikanthabhalasumanonavapancadamnim ratnanguliyalalitam vrajarajapatnim
    || 50|| cudamanidyutilasatsphuradarddhacandram graiveyakalapanapatravicitrarupam | shripattasutramanipattacaladvidamnim
    sphurjjatsahasradalapadmadharam bhajasva || 51|| shribahukankanalasatkucaratnadiptim shrinasikabharanabhushitagandadesham
    | sadyauvanalasagatim kalasarpavenim madhyendukotivadanam sphutacampakabham || 52|| saddhavabhavasahitam
    navapadmanetram sphurjjatsmitadyutikalam pracalatkataksham | krishnapriyam lalitakuntalapunjalabham
    mandaraharamadhurabhramariravadhyam || 53|| shrikhandakunkumamridaguruvarisiktam shribindukirucirapatravicitracitram
    | santanapatraruciramalamanjanabham raseshvarim gajagatim bhaja padminim tam || 54|| etadrishim rativaram
    tu sametya krishno gacchannikunjavanajalavilokanaya | dhavanti tatra manichatradharashca gopyo nitva
    tatha camaracarupatatpatakah || 55|| shadragameva varadhaivatamadhyamadyai
  devanagari: र्झङ्कारनूपुरयुतैर्विशदैः कटाक्षैः । सङ्गीतनृत्यविदितैर्भ्रुकुटीविभङ्गै राधां हरिं च सततं
    परितोषयन्त्यः ॥ ४०॥ तस्मिन्निकुञ्जभवने यमुनातटेऽपि वंशीवटे वनधरानिकटे हरिं तम् । श्रीराधया च गिरिराजतटं
    व्रजन्तं नन्दात्मजं च नटवेषधरं स्मर त्वम् ॥ ४१॥ श्रीपद्मरागनखदीप्तिपदारविन्दं झङ्कारनूपुरधरं स्फुरदङ्गदेशम्
    । कुर्वन्तमेव तु पदारुणभूमिदेशं श्रीमत्परागसुरुचालमितस्ततस्तु ॥ ४२॥ लक्ष्मीकराब्जपरिलालितजानुदेशं
    रम्भोरु पीतवसनं तु कृशोदराभम् । रोमावलिभ्रमरनाभिसरस्त्रिरेखं काञ्चीधरं भृगुपदं मणीकौस्तुभाढ्यम् ॥
    ४३॥ श्रीवत्सहाररुचिरं नवमेघनीलं पीताम्बरं करिकरस्फुटबाहुदण्डम् । रत्नाङ्गदं च मणिकङ्कणपद्महस्तं श्रीराजहंसवरकन्धरशोभमानम्
    ॥ ४४॥ श्रीकम्बुकण्ठललितं विलसत्कपोलं मध्यं तु निम्नचिबुकं किल कुन्ददन्तम् । बिम्बाधरं स्मितलसच्छुकचञ्चुनासं
    पीयूषकल्पवचनं प्रचलत्कटाक्षम् ॥ ४५॥ श्रीपुण्डरीकदलनेत्रमनङ्गलीलं भ्रूमण्डलस्मितगुणावृतकामचापम् । विद्युच्छटोच्छलितरत्नकिरीटकोटिं
    मार्तण्डमण्डलविकुण्डलमण्डिताभम् ॥ ४६॥ वंशीधरं त्वहिविलोलगुडालकाढ्यं राधापतिं सजलपद्ममुखं चलन्तम् ।
    कन्दर्पकोटिघनमानहरं कृशाङ्गं वंशीवटे नटवरं भज सर्वथा त्वम् ॥ ४७॥ आरक्तरक्तनखचन्द्रपदाब्जशोभां मञ्जीरनूपुररणत्कटिकिङ्किणीकाम्
    । श्रीघण्टिकाकनककङ्कणशब्दमुक्तां राधां दधामि तरुपुञ्जनिकुञ्जमध्ये ॥ ४८॥ नीलाम्बरैः कनकरश्मितटस्फुरद्भिः
    श्रीभानुजातटमरुद्गतिचञ्चलाङ्गैः । सूक्ष्मस्वरूपललितैरतिगौरवर्णां रासेश्वरीं भज मनोहरमन्दहासाम् ॥ ४९॥
    बालार्कमण्डलमहाङ्गदरत्नहारां ताटङ्कतोरणमणीन्द्रमनोहराभाम् । श्रीकण्ठभालसुमनोनवपञ्चदाम्नीं रत्नाङ्गुलीयललितां
    व्रजराजपत्नीम् ॥ ५०॥ चूडामणिद्युतिलसत्स्फुरदर्द्धचन्द्रां ग्रैवेयकालपनपत्रविचित्ररूपाम् । श्रीपट्टसूत्रमणीपट्टचलद्विदाम्नीं
    स्फूर्ज्जत्सहस्रदलपद्मधरां भजस्व ॥ ५१॥ श्रीबाहुकङ्कणलसत्कुचरत्नदीप्तिं श्रीनासिकाभरणभूषितगण्डदेशाम्
    । सद्यौवनालसगतिं कलसर्पवेणीं मध्येन्दुकोटिवदनां स्फुटचम्पकाभाम् ॥ ५२॥ सद्धावभावसहितां नवपद्मनेत्रां
    स्फूर्ज्जत्स्मितद्युतिकलां प्रचलत्कटाक्षाम् । कृष्णप्रियां ललितकुन्तलपुञ्जलाभां मन्दारहारमधुरभ्रमरीरवाढ्याम्
    ॥ ५३॥ श्रीखण्डकुङ्कुममृदागुरुवारिसिक्तां श्रीबिन्दुकीरुचिरपत्रविचित्रचित्राम् । सन्तानपत्ररुचिरामलमञ्जनाभां
    रासेश्वरीं गजगतिं भज पद्मिनीं ताम् ॥ ५४॥ एतादृशीं रतिवरां तु समेत्य कृष्णो गच्छन्निकुञ्जवनजालविलोकानाय
    । धावन्ति तत्र मणिछत्रधराश्च गोप्यो नीत्वा तथा चमरचारुपतत्पताकाः ॥ ५५॥ षड्रागमेव वरधैवतमध्यमाद्यै
