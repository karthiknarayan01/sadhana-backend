id: balakrishnaproktamkrishnanarayanastotram
category: stotram
name:
  english: balakrishnaproktamkrishnanarayanastotram
  devanagari: बालकृष्णप्रोक्तंकृष्णनारायणस्तोत्रम्
content:
  english: '| evam sharanamantram carpanamantram ca rakshakam || 42|| manum ca brahmabhavam ca mantram
    svamyanivedakam | sarvasvam ca manum krishnanarayanah pareshvarah || 43|| iti shrilakshminarayaniyasamhita
    | khanda 2| adhyaya 169'
  devanagari: । एवं शरणमन्त्रं चार्पणमन्त्रं च रक्षकम् ॥ ४२॥ मनुं च ब्रह्मभावं च मन्त्रं स्वाम्यनिवेदकम्
    । सर्वस्वं च मनुं कृष्णनारायणः परेश्वरः ॥ ४३॥ इति श्रीलक्ष्मीनारायणीयसंहिता । खण्ड २। अध्याय १६९
meaning: {}
