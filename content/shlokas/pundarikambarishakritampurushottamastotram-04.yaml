id: pundarikambarishakritampurushottamastotram-04
category: stotram
name:
  english: pundarikambarishakritampurushottamastotram 04
  devanagari: पुण्डरीकाम्बरीषकृतंपुरुषोत्तमस्तोत्रम् ०४
content:
  english: '|| 37|| mantraste mokshadashcatipapinam pavako''sti hi | japto bhavan param param prapayatyeva
    tena hi || 38|| tannau prasida devesha dridham bhaktim pradehi nau | ghoraddustarakhatacca samuttaraya
    keshava || 39|| indriyani mano buddhistava murtau vasantu nah | atma samskarasahitashcarpitastava
    padayoh || 40|| prasida deva sarvatmannasankhyeyashirobhuja | asankhyaghrananayanapanipada namo''stu
    te || 41|| shanvimshastvam cantaratman nishprapancah pravartase | catushpumarthamurtistvam jagannatha
    namo''stu te || 42|| tvadaradhanaya krishna bhavanti sarvasiddhayah | yogabhyasam vina casmai krishnaya
    te namo namah || 43|| bhaktim dridham pradehyavam nastyanyatprarthaniyakam | yavatpranandharayavastavadbhaktirdridha
    tvayi || 44|| tatah pare''pi te bhaktim dehi narayanaprabho | agadhabhavapanke''tra nimagnayoh parayanam
    || 45|| dasyam natha sada dehi canukampaya nau vibho | iti stuvantau tau bhaktau petaturdandavat kshitau
    || 46|| prasideti vadantau ca muhushcakraturdarshanam | divyadrishtya vilokyaivam nematushca muhurmuhuh
    || 47|| iti shrilakshminarayaniyasamhitayam prathame kritayugasantane 583'
  devanagari: ॥ ३७॥ मन्त्रस्ते मोक्षदश्चातिपापिनां पावकोऽस्ति हि । जप्तो भवान् परं पारं प्रापयत्येव तेन
    हि ॥ ३८॥ तन्नौ प्रसीद देवेश दृढां भक्तिं प्रदेहि नौ । घोराद्दुस्तरखाताच्च समुत्तारय केशव ॥ ३९॥ इन्द्रियाणि
    मनो बुद्धिस्तव मूर्तौ वसन्तु नः । आत्मा संस्कारसहितश्चार्पितस्तव पादयोः ॥ ४०॥ प्रसीद देव सर्वात्मन्नसङ्ख्येयशिरोभुज
    । असङ्ख्यघ्राणनयनपाणिपाद नमोऽस्तु ते ॥ ४१॥ षङ्विंशस्त्वं चान्तरात्मन् निष्प्रपञ्चः प्रवर्तसे । चतुष्पुमर्थमूर्तिस्त्वं
    जगन्नाथ नमोऽस्तु ते ॥ ४२॥ त्वदाराधनया कृष्ण भवन्ति सर्वसिद्धयः । योगाभ्यासं विना चास्मै कृष्णाय ते
    नमो नमः ॥ ४३॥ भक्तिं दृढां प्रदेह्यावां नास्त्यन्यत्प्रार्थनीयकम् । यावत्प्राणान्धारयावस्तावद्भक्तिर्दृढा
    त्वयि ॥ ४४॥ ततः पारेऽपि ते भक्तिं देहि नारायणप्रभो । अगाधभवपङ्केऽत्र निमग्नयोः परायणम् ॥ ४५॥ दास्यं
    नाथ सदा देहि चानुकम्पय नौ विभो । इति स्तुवन्तौ तौ भक्तौ पेततुर्दण्डवत् क्षितौ ॥ ४६॥ प्रसीदेति वदन्तौ
    च मुहुश्चक्रतुर्दर्शनम् । दिव्यदृष्ट्या विलोक्यैवं नेमतुश्च मुहुर्मुहुः ॥ ४७॥ इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतयुगसन्ताने ५८३
