id: kyts-jata-3-5-purna-paschaaduta-purna-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 3.5 Purna Paschaaduta Purna - Krishna Yajurveda Taittiriya Samhita
content:
  english: tpurna purna pashcat | pashca dutota pashca uta purna purnotota purna | tpurna purna purasta
    nmaddhyato maddhyata udu rnamasi maddhyato maddhyatah pau paurnamasi jigaya jigaya paurnamasi pau
    paurnamasiti paurna ndeva deva stasya deva adhyadhi deva deva adhi | va~santo 'dhyadhi sam va~santa
    uttama uttame sam uttame nake naka uttama uttame nake naka iheha nake naka iha | mmadayanta miheha
    madayantam | madayantamiti madayantam | te deva deva ste te devah | rdeva deva adadhuh | mbhagadheya
    madadhu radadhu bhagadheya mamavasye 'mavasye bhagadheya mbhagadheya mamavasye | va~santo 'mavasye
    'mavasye sam va~santo mahitva mahitva sam mpiprihi piprihi yajnam piprihi vishvavare vishvavare piprihi
    piprihi vishvavare | vishvavare rayigm rayim vi~shvavare vishvavare rayim | vishvavara iti vishva
    nno no rayigm rayi no dhehi dhehi no no dhehi | dhehi subhage subhage dhehi dhehi subhage | subhage
    suviragm suviragm subhage subhage suvira niveshani sangamani sangamani niveshani niveshani sangamani
    | va~sunagm sangamani sangamani vasunam | vi~shva vishva vasunam vishva rupani rupani vishva vishva
    rupani | rupani vasuni vasuni rupani rupani vasuni | nyaveshaya ntyaveshayanti vasuni vasu sahasraposhagm
    subhaga subhaga sahasraposhagm sahasraposhagm subhaga sahasraposhamiti sahasra subhaga rarana rarana
    subhaga subhaga rarana | rarana sa sa rarana rarana sa | gan varcasa varcasa ga vi~dana varcasa varcasa
    sam agnishomau prathamau prathama vagnishoma vagnishomau prathamau | agnishomavityagni prathamau viryena
    viryena prathamau prathamau viryena | viryena viryena vasun | rudra naditya naditya nrudra nadityan
    | aditya nihe haditya naditya niha | njinvata mihe ha jinvatam | jinvatamiti jinvatam | maddhyagm
    hi hi maddhya paurnamasamiti paurna mbrahmana brahmana jushetha brahmana vriddhau vriddhau brahmana
    brahmana vriddhau | vriddhau sukritena sukritena vriddhau vriddhau sukritena | sukritena satau satau
    sukritena sukritena satau | sata vathatha satau sata vatha | athasmabhya masmabhya mathatha smabhya
    asmabhyagm sahaviragm sahavira masmabhya masmabhyagm sahaviram | sahaviragm rayigm rayigm sahaviragm
    sahaviragm rayim | nni ni rayigm rayi yacchatamiti yacchatam | adi tyashca caditya adi tyashca | cangiraso
    'ngirasashca cangirasah | angirasashca cangiraso 'ngirasashca | agni na 'gni nagni na | a 'dadhata
    dadhata 'dadhata | adadhata te te 'dadhata dadhata te | shapurnamasau te te dar darshapurnamasau pra
    pra dar darshapurnamasaviti dar npra praiphsann | tesha mangirasa mangirasa ntesha mangirasam | nnirupta
    mangirasa mangirasa nniruptagm havih | asi dathatha si dasi datha | athaditya aditya athatha dityah
    | aditya eta veta vaditya aditya etau | etau homau homa veta vetau homau homau homa vapashyann | ta
    vajuhavu rajuhavu stau ta vajuhavuh | ajuhavu stata stato 'juhavu rajuhavu statah | tato vai vai tata
    stato vai | shapurnamasau te te dar darshapurnamasau purve purve dar darshapurnamasaviti dar purva
    a purve purva a | a 'labhanta labhanta 'labhanta | alabhanta darshapurnamasau dar shapurnamasa valabhanta
    labhanta dar darshapurnamasa valabhamana alabhamano dar shapurnamasa valabhamanah | darshapurnamasaviti
    dar alabhamana eta veta valabhamana alabhamana etau | etau homau homa veta vetau homau tpurasta ddhomau
    homau purasta thsakshaj juhuyaj juhuya saksha devaiva saksha shapurnamasa vevaiva dar darshapurnamasa
    va dar darshapurnamasaviti dar a labhate labhata a labhate | labhate brahmavadino brahmavadino labhate
    labhate brahmavadinah | brahmavadino vadanti vadanti brahmavadino brahmavadino vadanti | brahmavadina
    iti brahma vadanti sa sa vadanti vadanti sah | shapurnamasau vai vai dar darshapurnamasa va dar darshapurnamasaviti
    dar a labheta labheta labheta | labheta yo yo labheta labheta yah | enayo ranuloma manuloma menayo
    renayo ranulomam | nca canuloma manuloma nca ca pratilomam | pratilomamiti prati dvidyac ca ca vidyat
    | vidya dititi vidya ityamavasyaya amavasyaya iti tyamavasyayah | amavasyaya urdhva murdhva mamavasyaya
    amavasyaya urdhvam | amavasyaya ityama ttadurdhva murdhva rnamasya anuloma manuloma paurnamasyai praticina
    rnamasyai praticina paurnamasya iti paurna pratilomamiti prati paurnamasimiti paurna purva malabheta
    labheta purva mpurva malabheta | mpratiloma malabheta labheta pratilomam | pratiloma mena venau pratiloma
    mpratiloma menau | pratilomamiti prati ena vaina vena va | a labheta labheta labheta | labhetamu mamum
    ~labheta labhetamum | amu mapakshiyamana mapakshiyamana mamu mamu mapakshiyamanam | apakshiyamana
    manvan vapakshiyamana mapakshiyamana manu | apakshiyamanamityapa anva papan vanvapa | apa kshiyeta
    kshiyeta papa kshiyeta | || kshiyeta sarasvatau sarasvatau kshiyeta kshiyeta sarasvatau | sarasvatau
    homau homau sarasvatau sarasvatau homau tpurasta ddhomau homau purasta juhuya damavasya 'mavasya juhuyaj
    juhuya damavasya amavasya vai va amavasya 'mavasya vai | vai sarasvati sarasvati vai vai sarasvati
    | sarasva tyanuloma manulomagm sarasvati sarasva tyanulomam | anuloma mevaivanuloma manuloma meva
    | evaina vena vevai vainau ena vaina vena va | a labhate labhata a labhate | labhate 'mu mamum ~labhate
    labhate 'mum | amu mapyayamana mapyayamana mamu mamu mapyayamanam | apyayamana manvan vapyayamana
    mapyayamana manu | a pyayate pyayata a pyayate | pyayata agnavaishnava ma mpyayate pyayata agnavaishnavam
    | agnavaishnava mekadashakapala mekadashakapala magnavaishnava ma gnavaishnava mekadashakapalam |
    agnavaishnavamitya tpurasta dekadashakapala mekadashakapala ekadashakapalamityekadasha thsarasvatyai
    sarasvatyai vape ncarugm sarasvatyai sarasvatyai carum | carugm sarasvate sarasvate caru ncarugm sarasvate
    | sarasvate dvadashakapala ndvadashakapalagm sarasvate sarasvate dvadashakapalam | dvadashakapalamiti
    dvadasha agneyo bhavati bhava tyagneya a rbhavati bhava tyagnih | rvai va agni ragni vai~ vai yajnamukham
    | yajnamukhamiti yajna yajnamukha mevaiva yajnamukham yajnamukhamiti yajna ddhi mriddhi mevaiva r
    tpurasta driddhi mriddhi ddhatte dhatte purasta ddhatte dhatte yat | vaishnavo bhavati bhavati vaishnavo
    vai bhavati yajno yajno bhavati bhavati yajnah | yajno vai vai yajno yajno vai | evarabhya rabhyai
    vaivarabhya | arabhya pra prarabhya rabhya pra | pra tanute tanute pra pra tanute | tanute sarasvatyai
    sarasvatyai tanute tanute sarasvatyai | sarasvatyai caru shcaru ssarasvatyai sarasvatyai caruh | rbhavati
    bhavati caru shcaru bhavati sarasvate sarasvate bhavati bhavati sarasvate | sarasvate dvadashakapalo
    dvadashakapala ssarasvate sarasvate dvadashakapalah | dvadashakapalo 'mavasya 'mavasya dvadashakapalo
    dvadashakapalo 'mavasya dvadashakapala iti dvadasha amavasya vai va amavasya 'mavasya vai | vai sarasvati
    sarasvati vai vai sarasvati | sarasvati purnamasah purnamasa ssarasvati sarasvati purnamasah | npurnamasah
    purnamasa purnamasa iti purna ta vevaiva tau ta veva | thsaksha devaiva sakshat | a rabhate rabhata
    a rabhate | rabhata riddhno tyriddhnoti rabhate rabhata riddhnoti | bhya mabhya mriddhno tyriddhno
    tya ndvadashakapalo dvadashakapala abhya mabhya ssarasvate sarasvate dvadashakapalo dvadashakapala
    dvadashakapala iti dvadasha sarasvate bhavati bhavati sarasvate sarasvate bhavati | bhavati mithunatvaya
    mithunatvaya bhavati bhavati mithunatvaya | mithunatvaya praja tyai mithunatvaya mithunatvaya praja
    mithunatvayeti mithuna tyai mithunau mithunau praja mithunau gavau gavau mithunau mithunau gavau gavau
    dakshina dakshina gavau gavau dakshina | dakshina samriddhyai samriddhyai dakshina dakshina samriddhyai
    | rishayo vai va rishaya rishayo vai | va indra mindram mpratyaksha mindra mindra pratyakshamiti prati
    va~sishtho vasishtha sta vasishthah pratyaksha va~sishtho vasishthah pratyaksha pratyaksha mapashya
    dapashya mpratyaksha mapashyat | pratyakshamiti prati thsa so 'pashya dapashya mbrahmana mabravi dabravi
    te vakshyami vakshyami te te vakshyami | vakshyami yatha yatha vakshyami vakshyami yatha yatha tvatpurohita
    stvatpurohita yatha yatha tvatpurohitah | tvatpurohitah prajah praja stvatpurohita stvatpurohitah
    prajah | tvatpurohita iti tvat prajah prajanishyante prajah prajah prajanishyante prajanishyante 'thatha
    prajanishyante prajanishyante 'tha | prajanishyanta iti pra atha ma ma 'thatha ma | metarebhya ita
    rebhyo ma meta rebhyah | itarebhya rishibhya rishibhya itarebhya itarebhya rishibhyah | shibhya rishibhyo
    ma | ma pra pra ma ma pra | pra voco vocah pra pra vocah | voca ititi voco voca iti | iti tasmai tasma
    ititi tasmai ntasmai tasma etan | nthstomabhaga neta neta stomabhaga nabravi dabravi nthstomabhaga
    nabravit | stomabhaganiti stoma tato vasishthapurohita vasishthapurohita stata stato vasishthapurohitah
    | vasishthapurohitah prajah praja vasishthapurohita vasishthapurohitah prajah | vasishthapurohita
    iti vasishtha prajah pra pra prajah prajah pra | prajayanta jayanta pra prajayanta | ttasma dajayanta
    jayanta tasma dvasishtho vasishtha stasma vasishtho brahma brahma vasishtho vasishtho brahma | brahma
    karyah karyo brahma brahma karyah | karyah pra pra karyah karyah pra | eva jayate jayata evaiva jayate
    | jayate rashmi rashmi rjayate jayate rashmih | rashmi rasyasi rashmi rashmi rasi | asi kshayaya kshayaya
    syasi kshayaya | kshayaya tva tva kshayaya kshayaya tva | njinva jinva kshaya jinve titi jinva jinveti
    | ityahahe tityaha | || aha deva deva ahaha devah | deva vai vai deva deva vai | kshayo vai vai kshayah
    | kshayo devebhyo devebhyah devebhya evaiva devebhyo devebhya eva | ya~jna mevaiva yajnam | prahaha
    pra praha | aha pretih preti rahaha pretih | preti rasyasi pretih preti rasi | asi dharmaya dharmaya
    syasi dharmaya | dharmaya tva tva dharmaya dharmaya tva | njinva jinva dharma jinve titi jinva jinveti
    | itya hahe tityaha | aha manushya manushya ahaha manushyah manushya vai vai manushya manushya vai
    | vai dharmo dharmo vai vai dharmah | bhyo dharmo dharmo manushye ya~jna mevaiva yajnam | prahaha
    pra praha | aha nviti ranviti rahaha nvitih | anviti rasyasya nviti ranviti rasi | tva dive dive tva
    jinve titi jinva jinveti | ityahahe tityaha | ahaibhya ebhya aha haibhyah | ebhya evaivaibhya ebhya
    eva | eva lokebhyo lokebhya evaiva lokebhyah | ya~jnam ~lokebhyo lokebhyo yajnam | prahaha pra praha
    | aha vishtambho vishtambha ahaha vishtambhah | 'syasi vishtambho vishtambho 'si | asi vrishtyai vrishtya
    asyasi vrishtyai tva tva vrishtyai vrishtyai njinva jinva vrishtim jinve titi jinva jinveti | ityahahe
    tityaha | vri~shti mahaha vrishti vrishti mevaiva vrishtim ava rundhe rundhe 'vava rundhe | || rundhe
    prava prava rundhe rundhe prava | prava 'syasi prava prava 'si | asyanuva 'nuva 'sya syanuva | anuva
    'sya syanuva 'nuva 'si | asiti tyasyasiti | ityahahe tityaha | aha mithunatvaya mithunatvaya haha
    mithunatvaya | mithunatva yoshi gushi mmithunatvaya mithunatva yoshik | mithunatvayeti mithuna ushi
    gasya syushi gushi gasi | asi vasubhyo vasubhyo 'syasi vasubhyah | vasubhya stva tva vasubhyo vasubhya
    stva | ntva tva vasun | n jinva jinva vasun jinve titi jinva jinve ti | ityahahe tityaha | ahashta
    vashta vaha hashtau | ashtau vasavo vasavo 'shta vashtau vasavah | vasava ekada shaikadasha vasavo
    vasava ekadasha | ekadasha rudra rudra ekada shaikadasha rudrah | rudra dvadasha dvadasha rudra rudra
    dvadasha | dvadasha ditya aditya dvadasha dvadasha dityah | aditya etavanta etavanta aditya aditya
    etavantah | etavanto vai va etavanta etavanto vai | vai deva deva vai vai devah | deva stebhya stebhyo
    deva deva stebhyah | tebhya evaiva tebhya stebhya eva | ya~jna mevaiva yajnam | prahaha pra praha
    | ahauja oja aha haujah | 'syasyoja ojo 'si | asi pitribhyah pitribhyo pitribhya stva tva pitribhyah
    pitribhya stva | pitribhya iti pitri pitrin jinva jinva pitri jinve titi jinva jinve ti | itya hahe
    tityaha | ndeva nahaha devan | npitri nevaiva pitrin | anu sagm sa manvanu sam | ntanoti tanoti sagm
    sa tanoti tantu stantu stanoti tanoti tantuh | tantu rasyasi tantu stantu rasi | asi prajabhyah prajabhyo
    'syasi prajabhyah | prajabhya stva tva prajabhyah prajabhya stva | tva prajah praja stva praja jinva
    jinva prajah praja jinva | jinve titi jinva jinveti | || ityahahe tityaha | npitri nahaha pitrin |
    eva prajah praja evaiva prajah | praja anvanu prajah praja anu | anu sagm sa manvanu sam | ntanoti
    tanoti sagm sa tanoti pritanashat pritanasha ttanoti tanoti pritanashat | pritanasha dasyasi pritanashat
    pritanasha dasi | asi pashubhyah pashubhyo pashubhya stva tva pashubhyah pashubhya stva | pashun jinva
    jinva pashu jinve titi jinva jinveti | itya hahe tityaha | aha prajah praja ahaha prajah | praja evaiva
    prajah praja eva | npashu nevaiva pashun | anu sagm sa manvanu sam | ntanoti tanoti sagm sa ttanoti
    tanoti revat | asyoshadhibhya oshadhibhyo 'sya syoshadhibhyah | oshadhibhya stva tvaushadhibhya oshadhibhya
    stva | tvaushadhi roshadhi stva tvaushadhih | rjinva jinvaushadhi roshadhi jinve titi jinva jinve
    ti | itya hahe tityaha | ahaushadhi shvoshadhi shvaha haushadhishu | oshadhi shvevai vaushadhi shvoshadhi
    shveva | npashu nevaiva pashun | nprati prati pashu prati shthapayati sthapayati prati prati shthapayati
    | sthapaya tyabhiji dabhiji thsthapayati sthapaya tyabhijit | abhiji dasya syabhiji dabhiji dasi |
    asi yuktagrava yuktagrava 'syasi yuktagrava | yuktagravendra yendraya yuktagrava yuktagravendraya
    | yuktagraveti yukta indraya tva tvendraye ndraya tva | njinva jinvendra mindra jinve titi jinva jinveti
    | itya hahe tityaha | ahabhijitya abhijitya ahaha bhijityai | abhijitya adhipati radhipati rabhijitya
    abhijitya adhipatih | abhijitya ityabhi adhipati rasya syadhipati radhipati rasi | asi pranaya pranaya
    pranaya tva tva pranaya pranaya tva | njinva jinva prana jinve titi jinva jinveti | itya hahe tityaha
    | aha prajasu praja svahaha prajasu | praja svevaiva prajasu praja sveva | nprana nevaiva pranan |
    ndadhati dadhati prana ddadhati dadhati trivrit | trivri dasyasi trivri tpravri dasyasi pravrit |
    pravri dasyasi pravri asiti tyasyasiti | itya hahe tityaha | aha mithunatvaya mithunatvaya haha mithunatvaya
    | mithunatvaya sagmroha ssagmroho mithunatvaya mithunatvaya sagmrohah | mithunatvayeti mithuna asi
    niroho niroho 'syasi niroho niroho 'si | asiti tyasyasiti | itya hahe tityaha | tyai vasuko vasukah
    praja 'syasi vasuko vasuko 'si | rveshashri rasyasi veshashrih | veshashri rasyasi veshashri rvasyashti
    rasyasi vasyashtih | vasyashti rasyasi vasyashti asiti tyasyasiti | itya hahe tityaha | aha pratishthityai
    pratishthitya ahaha pratishthityai | pratishthitya iti prati agnina devena devenagnina 'gnina devena
    | devena pritanah pritana devena devena pritanah | pritana jayami jayami pritanah pritana jayami |
    jayami gayatrena gayatrena jayami jayami gayatrena | gayatrena chandasa chandasa gayatrena gayatrena
    chandasa | trivrita chandasa chandasa trivrita trivrita stomena stomena trivrita trivrita stomena
    | stomena rathantarena rathantarena stomena stomena rathantarena | rathantarena samna samna rathantarena
    rathantarena samna samna vashatkarena vashatkarena samna samna vashatkarena | vashatkarena vajrena
    vajrena vashatkarena vashatkarena vajrena | vashatkareneti vashat vajrena vajrena purvajan | purvajaniti
    purva bhratrivya nadhara nadhara nbhratrivya nadharan | npadayami padaya myadhara nadhara padaya myavava
    padayami padaya myava | avaina nena navavainan | nbadhe badha ena nena badhe prati prati badhe badhe
    prati | nprati pratyenan | nnude nuda ena nena nnude nude 'sminn | asmin kshaye kshaye 'smi nnasmin
    kshaye kshaye 'sminn | nbhumiloke bhumiloke bhumiloke yo yo bhumiloke bhumiloke yah | bhumiloka iti
    bhumi ndveshti dveshtyasma nasma ndveshti dveshti yam | ndvishmo dvishmo vayam rdvishmo dvishmo vishnoh
    vishnoh kramena kramena vishno rvishnoh kramena | kramena tyati kramena kramenati | atyena nena natya
    tyenan | enan kramami krama myena nenan kramami | krama mindre nendrena kramami krama mindrena | indrena
    devena devenendre nendrena devena | devena pritanah pritana devena devena pritanah | pritana jayami
    jayami pritanah pritana jayami | jayami traishtubhena traishtubhena jayami jayami traishtubhena |
    traishtubhena chandasa chandasa traishtubhena traishtubhena chandasa | chandasa pancadashena pancadashena
    chandasa chandasa pancadashena | pancadashena stomena stomena pancadashena pancadashena stomena |
    pancadasheneti panca stomena brihata brihata stomena stomena brihata | brihata samna samna brihata
    brihata samna samna vashatkarena vashatkarena samna samna vashatkarena | vashatkarena vajrena vajrena
    vashatkarena vashatkarena vajrena | vashatkareneti vashat vajrena vajrena sahajan | || devebhih pritanah
    pritana devebhi rdevebhih pritanah | pritana jayami jayami pritanah pritana jayami | jayami jagatena
    jagatena jayami jayami jagatena | jagatena chandasa chandasa jagatena jagatena chandasa | chandasa
    saptadashena saptadashena chandasa chandasa saptadashena | saptadashena stomena stomena saptadashena
    saptadashena stomena | saptadasheneti sapta stomena vamadevyena vamadevyena stomena stomena vamadevyena
    | vamadevyena samna samna vamadevyena vamadevyena samna vamadevyeneti vama samna vashatkarena vashatkarena
    samna samna vashatkarena | vashatkarena vajrena vajrena vashatkarena vashatkarena vajrena | vashatkareneti
    vashat vajrena paraja naparajan vajrena vajrena parajan | aparaja nindre nendrena paraja naparaja
    nindrena | indrena sayujah sayuja indre nendrena sayujah | va~yagm sayujah sayujo vayam | vayagm sasahyama
    sasahyama vayam va~yagm sasahyama | sasahyama pritanyatah pritanyata ssasahyama sasahyama pritanyatah
    | pritanyata iti pritanyatah | ghnanto vritrani vritrani ghnanto ghnanto vritrani | vritra nyapra
    tyaprati vritrani vritra nyaprati | apratityaprati | te agne 'gne te te agne | 'gne 'gne tejah | teja
    stena tena teja steja stena | ntejasvi tejasvyaha maha ntejasvi tejasvi bhuyasam | te agne 'gne te
    te agne | agne varco varco 'gne 'gne varcah | varca stena tena varco varca stena | va~rcasvi varcasvyaha
    maham va~rcasvi varcasvi bhuyasam | te agne 'gne te te agne | hara stena tena haro hara stena | ahagm
    harasvi harasvyaha mahagm harasvi | mbhuyasagm harasvi harasvi bhuyasam | bhuyasamiti bhuyasam | ||
    ye deva deva ye ye devah | deva yajnahano yajnahano deva deva yajnahanah | yajnahano yajnamusho yajnamusho
    yajnahano yajnahano yajnamushah | yajnamushah prithivya ya~jnamusho yajnamushah prithivyam | yajnamusha
    iti yajna prithivya madhyadhi prithivya adhyasata asate 'dhyadhyasate | rma ma 'gni ragni ma tebhya
    stebhyo ma ma tebhyah | tebhyo rakshatu rakshatu tebhya stebhyo rakshatu | rakshatu gacchema gacchema
    rakshatu rakshatu gacchema | gacchema sukritah sukrito gacchema gacchema sukritah | va~yagm sukritah
    sukrito vayam | a 'ganma ganma 'ganma | aganma mitravaruna mitravaruna 'ganma ganma mitravaruna |
    mitravaruna varenya varenya mitravaruna mitravaruna varenya | mitravaruneti mitra varenya ratrinagm
    ratrinam va~renya varenya ratrinam | mbhago bhago ratrinagm ratrina rbhago bhago yuvayoh yo astyasti
    yo yo asti | ngrihnana grihnana naka ssukritasya sukritasya grihnana grihnana sukritasya loke loke
