id: vighnesvara-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Vighnesvara Ashtottara Sata Nama Stotram
content:
  english: vinayako vighnarajo gauriputro ganeshvarah | skandagrajo'vyayah puto daksho'dhyaksho dvijapriyah
    || || agnigarvacchidindrashriprado vaniprado'vyayah sarvasiddhiprada shsharvatanayah sharvaripriyah
    || || sarvatmakah srishtikarta devo'nekarcitashshivah | shuddho buddhipriya shshanto brahmacari gajananah
    || || dvaimatreyo munistutyo bhaktavighnavinashanah | ekadanta rbrahmaviduttamah | kalo grahapatih
    kami somasuryagnilocanah || shcando gunatito niranjanah | akalmasha ssiddharcitapadambujah || || bijapuraphalasakto
    varada shshashvatah kriti | vidvat priyo vitabhayo gadi cakrikshucapadhrit || || shrido'ja utpalakarah
    shripatih stutiharshitah | kuladribhetta jatilah kalikalmashanashanah || || candracudamanih kantah
    papahari samahitah | ashrita ssaumyo bhaktavanchitadayakah || ssaccidanandavigrahah | jnani dayayuto
    danto brahmadveshavivarjitah || || pramattadaityabhayadah shrikantho vibudheshvarah | ramarcito nidhi
    rnagarajayajnopavitavan || || sthulakanthah svayankarta samaghoshapriyah parah | sthulatundo'grani
    || durvabilvapriyo'vyaktamurti radbhutamurtiman | shailendratanujotsangakhelanotsukamanasah || ||
    svalavanyasudhasarajitamanmathavigrahah | samastajagadadharo mayi mushakavahanah || stushtah prasannatma
    sarvasiddhipradayakah | ashtottarashatenaivam namnam vighneshvaram vibhum || || tushtava shankarah
    putram tripuram hantumudyatah | yah pujayedanenaiva bhaktya siddhivinayakam || rbilvapatraih pushpairva
    candanakshataih | sarvankamanavapnoti sarvavighnaih pramucyate || iti vighneshvarashtottara shatanamastotram
    sampurnam
  devanagari: विनायको विघ्नराजो गौरीपुत्रो गणेश्वरः । स्कन्दाग्रजोऽव्ययः पूतो दक्षोऽध्यक्षो द्विजप्रियः
    ॥ ॥ अग्निगर्वच्छिदिन्द्रश्रीप्रदो वाणीप्रदोऽव्ययः सर्वसिद्धिप्रद श्शर्वतनयः शर्वरीप्रियः ॥ ॥ सर्वात्मकः
    सृष्टिकर्ता देवोऽनेकार्चितश्शिवः । शुद्धो बुद्धिप्रिय श्शान्तो ब्रह्मचारी गजाननः ॥ ॥ द्वैमात्रेयो
    मुनिस्तुत्यो भक्तविघ्नविनाशनः । एकदन्त र्ब्रह्मविदुत्तमः । कालो ग्रहपतिः कामी सोमसूर्याग्निलोचनः ॥
    श्चण्डो गुणातीतो निरञ्जनः । अकल्मष स्सिद्धार्चितपदाम्बुजः ॥ ॥ बीजपूरफलासक्तो वरद श्शाश्वतः कृती ।
    विद्वत् प्रियो वीतभयो गदी चक्रीक्षुचापधृत् ॥ ॥ श्रीदोऽज उत्पलकरः श्रीपतिः स्तुतिहर्षितः । कुलाद्रिभेत्ता
    जटिलः कलिकल्मषनाशनः ॥ ॥ चन्द्रचूडामणिः कान्तः पापहारी समाहितः । अश्रित स्सौम्यो भक्तवाञ्छितदायकः ॥
    स्सच्चिदानन्दविग्रहः । ज्ञानी दयायुतो दान्तो ब्रह्मद्वेषविवर्जितः ॥ ॥ प्रमत्तदैत्यभयदः श्रीकण्ठो विबुधेश्वरः
    । रमार्चितो निधि र्नागराजयज्ञोपवीतवान् ॥ ॥ स्थूलकण्ठः स्वयङ्कर्ता सामघोषप्रियः परः । स्थूलतुण्डोऽग्रणी
    ॥ दूर्वाबिल्वप्रियोऽव्यक्तमूर्ति रद्भुतमूर्तिमान् । शैलेन्द्रतनुजोत्सङ्गखेलनोत्सुकमानसः ॥ ॥ स्वलावण्यसुधासारजितमन्मथविग्रहः
    । समस्तजगदाधारो मायी मूषकवाहनः ॥ स्तुष्टः प्रसन्नात्मा सर्वसिद्धिप्रदायकः । अष्टोत्तरशतेनैवं नाम्नां
    विघ्नेश्वरं विभुम् ॥ ॥ तुष्टाव शङ्करः पुत्रं त्रिपुरं हन्तुमुद्यतः । यः पूजयेदनेनैव भक्त्या सिद्धिविनायकम्
    ॥ र्बिल्वपत्रैः पुष्पैर्वा चन्दनाक्षतैः । सर्वान्कामानवाप्नोति सर्वविघ्नैः प्रमुच्यते ॥ इति विघ्नेश्वराष्टोत्तर
    शतनामस्तोत्रं सम्पूर्णम्
