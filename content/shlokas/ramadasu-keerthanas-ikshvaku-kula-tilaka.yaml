id: ramadasu-keerthanas-ikshvaku-kula-tilaka
category: stotram
name:
  english: Ramadasu Keerthanas Ikshvaku Kula Tilaka
content:
  english: mishracapu pallavi ikshvaku kulatilaka ikanaina palukavè ramacandra nannu rakshimpakunnanu
    rakshakulèvarinka ramacandra bharatunaku ceyisti paccalapatakamu ramacandra a patakamunakubattè padivela
    varahalu ramacandra || ikshvaku kulatilaka || caranam shatrughnunaku nenu ceyisti mòlatradu ramacandra
    a mòlatradunaku battè mòharilu padivelu ramacandra || ikshvaku kulatilaka || caranam lakshmanunaku
    jeyisti mutyalapatakamu ramacandra a patakamunaku battè padivela varahalu ramacandra || ikshvaku kulatilaka
    || caranam sitammaku ceyisti cintaku patakamu ramacandra a patakamunaku battè padivela varahalu ramacandra
    || ikshvaku kulatilaka || caranam kalikiturayi niku pòlupuga jeyisti ramacandra nivu kulukucu dirigèda
    vèvarabbasòmmani ramacandra || ikshvaku kulatilaka || caranam mi tandri dasharathamaharaju pèttèna
    ramacandra leka mimama janakamaharaju pampèna ramacandra || ikshvaku kulatilaka || caranam abba tittitinani
    yayasapadavaddu ramacandra i dèbbalakorvaka abba tittitinayya ramacandra || ikshvaku kulatilaka ||
    caranam bhaktulandarini paripalincèdi shriramacandra nivu kshemamuga ramadasuni nelumu ramacandra
    || ikshvaku kulatilaka || caranam cuttuprakaramulu sòmpuga ceyisti ramacandra a prakaramunaku battè
    padivela varahalu ramacandra || ikshvaku kulatilaka || caranam gopuramantapalu kuduruga gattisti ramacandra
    nanu kròttaga judaka nittaribrovumu ramacandra || ikshvaku kulatilaka || caranam vahanamulu miku varusato
    jeyisti ramacandra jaga nmohana sankèllu vesiri kallaku ramacandra || ikshvaku kulatilaka || caranam
    sarkaru paikamu trinamuganèncaku ramacandra dèbbalakorvanu yappudircumayya ramacandra || ikshvaku
    kulatilaka || caranam etiki jallina nillayè na bratuku ramacandra nenu adhamulandarikantè anyayamaitini
    ramacandra || ikshvaku kulatilaka || caranam kausalyaputruda dasharathatanayuda ramacandra kavu kshemamuga
    bhadradri nèlakònna shriramacandra || ikshvaku kulatilaka ||
  devanagari: मिश्रचापु पल्लवि इक्ष्वाकु कुलतिलक इकनैन पलुकवॆ रामचन्द्रा नन्नु रक्षिम्पकुन्ननु रक्षकुलॆवरिङ्क
    रामचन्द्रा भरतुनकु चेयिस्ति पच्चलपतकमु रामचन्द्रा आ पतकमुनकुबट्टॆ पदिवेल वरहालु रामचन्द्रा ॥ इक्ष्वाकु
    कुलतिलक ॥ चरणं शत्रुघ्नुनकु नेनु चेयिस्ति मॊलत्राडु रामचन्द्रा आ मॊलत्राडुनकु बट्टॆ मॊहरीलु पदिवेलु
    रामचन्द्रा ॥ इक्ष्वाकु कुलतिलक ॥ चरणं लक्ष्मणुनकु जेयिस्ति मुत्यालपतकमु रामचन्द्रा आ पतकमुनकु बट्टॆ
    पदिवेल वरहालु रामचन्द्रा ॥ इक्ष्वाकु कुलतिलक ॥ चरणं सीतम्मकु चेयिस्ति चिन्ताकु पतकमु रामचन्द्रा आ
    पतकमुनकु बट्टॆ पदिवेल वरहालु रामचन्द्रा ॥ इक्ष्वाकु कुलतिलक ॥ चरणं कलिकितुरायि नीकु पॊलुपुग जेयिस्ति
    रामचन्द्रा नीवु कुलुकुचु दिरिगॆद वॆवरब्बसॊम्मनि रामचन्द्रा ॥ इक्ष्वाकु कुलतिलक ॥ चरणं मी तण्ड्रि दशरथमहाराजु
    पॆट्टॆना रामचन्द्रा लेक मीमाम जनकमहाराजु पम्पॆना रामचन्द्रा ॥ इक्ष्वाकु कुलतिलक ॥ चरणं अब्बा तिट्टितिननि
    यायासपडवद्दु रामचन्द्रा ई दॆब्बलकोर्वक अब्ब तिट्टितिनय्य रामचन्द्रा ॥ इक्ष्वाकु कुलतिलक ॥ चरणं भक्तुलन्दरिनि
    परिपालिञ्चॆडि श्रीरामचन्द्रा नीवु क्षेममुग रामदासुनि नेलुमु रामचन्द्रा ॥ इक्ष्वाकु कुलतिलक ॥ चरणं
    चुट्टुप्राकारमुलु सॊम्पुग चेयिस्ति रामचन्द्रा आ प्राकारमुनकु बट्टॆ पदिवेल वरहालु रामचन्द्रा ॥ इक्ष्वाकु
    कुलतिलक ॥ चरणं गोपुरमण्टपालु कुदुरुग गट्टिस्ति रामचन्द्रा ननु क्रॊत्तग जूडक नित्तरिब्रोवुमु रामचन्द्रा
    ॥ इक्ष्वाकु कुलतिलक ॥ चरणं वाहनमुलु मीकु वरुसतो जेयिस्ति रामचन्द्रा जग न्मोहन सङ्कॆल्लु वेसिरि काल्लकु
    रामचन्द्रा ॥ इक्ष्वाकु कुलतिलक ॥ चरणं सर्कारु पैकमु तृणमुगनॆञ्चकु रामचन्द्रा दॆब्बलकोर्वनु यप्पुदीर्चुमय्य
    रामचन्द्रा ॥ इक्ष्वाकु कुलतिलक ॥ चरणं एटिकि जल्लिन नील्लायॆ ना ब्रतुकु रामचन्द्रा नेनु अधमुलन्दरिकण्टॆ
    अन्यायमैतिनि रामचन्द्रा ॥ इक्ष्वाकु कुलतिलक ॥ चरणं कौसल्यपुत्रुड दशरथतनयुड रामचन्द्रा कावु क्षेममुग
    भद्राद्रि नॆलकॊन्न श्रीरामचन्द्रा ॥ इक्ष्वाकु कुलतिलक ॥
