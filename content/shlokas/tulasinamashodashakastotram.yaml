id: tulasinamashodashakastotram
category: stotram
name:
  english: tulasinamashodashakastotram
  devanagari: तुलसीनामषोडशकस्तोत्रम्
content:
  english: shritulasishodashakanamastotram namavalishca tulasi shrimahalakshmih vidya'vidya yashasvini
    | dharmya dharmavanasakta padmini shrirharipriya || lakshmipriyasakhi devi dyaurbhumiracala cala |
    shodashaitani namani tulasyah kirtayennarah | labhate sutaram bhaktim ante vishnupadam labhet || tulasyai
    namah | shrimahalakshmyai namah | vidyayai namah | avidyayai namah | yashasvinyai namah | dharmyayai
    namah | dharmavanasaktayai namah | padminyai namah | shriyai namah | haripriyayai namah | lakshmipriyasakhyai
    namah | devyai namah | dive namah | bhumyai namah | acalayai namah | calayai namah |
  devanagari: श्रीतुलसीषोडशकनामस्तोत्रं नामावलिश्च तुलसी श्रीमहालक्ष्मीः विद्याऽविद्या यशस्विनी । धर्म्या
    धर्मावनासक्ता पद्मिनी श्रीर्हरिप्रिया ॥ लक्ष्मीप्रियसखी देवी द्यौर्भूमिरचला चला । षोडशैतानि नामानि
    तुलस्याः कीर्तयेन्नरः । लभते सुतरां भक्तिं अन्ते विष्णुपदं लभेत् ॥ तुलस्यै नमः । श्रीमहालक्ष्म्यै
    नमः । विद्यायै नमः । अविद्यायै नमः । यशस्विन्यै नमः । धर्म्यायै नमः । धर्मावनासक्तायै नमः । पद्मिन्यै
    नमः । श्रियै नमः । हरिप्रियायै नमः । लक्ष्मीप्रियसख्यै नमः । देव्यै नमः । दिवे नमः । भूम्यै नमः ।
    अचलायै नमः । चलायै नमः ।
meaning: {}
