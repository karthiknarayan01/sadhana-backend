id: adyastotram-2
category: stotram
name:
  english: adyastotram
  devanagari: आद्यास्तोत्रम्
content:
  english: '|| adyastotram || om nama adyayai | shrinu vatsa pravakshyami adya stotram mahaphalam | yah
    pathet satatam bhaktya sa eva vishnuvallabhah || 1|| mrityurvyadhibhayam tasya nasti kincit kalau
    yuge | aputra labhate putram tripaksham shravanam yadi || 2|| dvau masau bandhananmukti vipravaktrat
    shrutam yadi | mritavatsa jivavatsa shanmasam shravanam yadi || 3|| naukayam sankate yuddhe pathanajjayamapnuyat
    | likhitva sthapayedgehe nagnicaurabhayam kvacit || 4|| rajasthane jayi nityam prasannah sarvadevata
    | om hrim brahmani brahmaloke ca vaikunthe sarvamangala || 5|| indrani amaravatyamavika varunalaye|
    yamalaye kalarupa kuberabhavane shubha || 6|| mahanandagnikone ca vayavyam mrigavahini | nairityam
    raktadanta ca aishanyam shuladharini || 7|| patale vaishnavirupa simhale devamohini | surasa ca manidvipe
    lankayam bhadrakalika || 8|| rameshvari setubandhe vimala purushottame | viraja audradeshe ca kamakshya
    nilaparvate || 9|| kalika vangadeshe ca ayodhyayam maheshvari | varanasyamannapurna gayakshetre gayeshvari
    || 10|| kurukshetre bhadrakali vraje katyayani para | dvarakayam mahamaya mathurayam maheshvari ||
    11|| kshudha tvam sarvabhutanam vela tvam sagarasya ca | navami shuklapakshasya krishnasaikadashi
    para || 12|| dakshasa duhita devi dakshayajna vinashini | ramasya janaki tvam hi ravanadhvamsakarini
    || 13|| candamundavadhe devi raktabijavinashini | nishumbhashumbhamathini madhukaitabhaghatini ||
    14|| vishnubhaktiprada durga sukhada mokshada sada | adyastavamimam punyam yah pathet satatam narah
    || 15|| sarvajvarabhayam na syat sarvavyadhivinashanam | kotitirthaphalam tasya labhate natra samshayah
    || 16|| jaya me cagratah patu vijaya patu prishthatah | narayani shirshadeshe sarvange simhavahini
    || 17|| shivaduti ugracanda pratyange parameshvari | vishalakshi mahamaya kaumari sankhini shiva ||
    18|| cakrini jayadhatri ca ranamatta ranapriya | durga jayanti kali ca bhadrakali mahodari || 19||
    narasimhi ca varahi siddhidatri sukhaprada | bhayankari maharaudri mahabhayavinashini || 10|| iti
    brahmayamale brahmanaradasamvade adya stotram samaptam || || om nama adyayai om nama adyayai om nama
    adyayai ||'
  devanagari: ॥ आद्यास्तोत्रम् ॥ ॐ नम आद्यायै । शृणु वत्स प्रवक्ष्यामि आद्या स्तोत्रं महाफलम् । यः पठेत्
    सततं भक्त्या स एव विष्णुवल्लभः ॥ १॥ मृत्युर्व्याधिभयं तस्य नास्ति किञ्चित् कलौ युगे । अपुत्रा लभते
    पुत्रं त्रिपक्षं श्रवणं यदि ॥ २॥ द्वौ मासौ बन्धनान्मुक्ति विप्रवक्त्रात् श्रुतं यदि । मृतवत्सा जीववत्सा
    षण्मासं श्रवणं यदि ॥ ३॥ नौकायां सङ्कटे युद्धे पठनाज्जयमाप्नुयात् । लिखित्वा स्थापयेद्गेहे नाग्निचौरभयं
    क्वचित् ॥ ४॥ राजस्थाने जयी नित्यं प्रसन्नाः सर्वदेवता । ॐ ह्रीं ब्रह्माणी ब्रह्मलोके च वैकुण्ठे सर्वमङ्गला
    ॥ ५॥ इन्द्राणी अमरावत्यामविका वरुणालये। यमालये कालरूपा कुबेरभवने शुभा ॥ ६॥ महानन्दाग्निकोने च वायव्यां
    मृगवाहिनी । नैऋत्यां रक्तदन्ता च ऐशाण्यां शूलधारिणी ॥ ७॥ पाताले वैष्णवीरूपा सिंहले देवमोहिनी । सुरसा
    च मणीद्विपे लङ्कायां भद्रकालिका ॥ ८॥ रामेश्वरी सेतुबन्धे विमला पुरुषोत्तमे । विरजा औड्रदेशे च कामाक्ष्या
    नीलपर्वते ॥ ९॥ कालिका वङ्गदेशे च अयोध्यायां महेश्वरी । वाराणस्यामन्नपूर्णा गयाक्षेत्रे गयेश्वरी ॥
    १०॥ कुरुक्षेत्रे भद्रकाली व्रजे कात्यायनी परा । द्वारकायां महामाया मथुरायां माहेश्वरी ॥ ११॥ क्षुधा
    त्वं सर्वभूतानां वेला त्वं सागरस्य च । नवमी शुक्लपक्षस्य कृष्णसैकादशी परा ॥ १२॥ दक्षसा दुहिता देवी
    दक्षयज्ञ विनाशिनी । रामस्य जानकी त्वं हि रावणध्वंसकारिणी ॥ १३॥ चण्डमुण्डवधे देवी रक्तबीजविनाशिनी ।
    निशुम्भशुम्भमथिनी मधुकैटभघातिनी ॥ १४॥ विष्णुभक्तिप्रदा दुर्गा सुखदा मोक्षदा सदा । आद्यास्तवमिमं पुण्यं
    यः पठेत् सततं नरः ॥ १५॥ सर्वज्वरभयं न स्यात् सर्वव्याधिविनाशनम् । कोटितीर्थफलं तस्य लभते नात्र संशयः
    ॥ १६॥ जया मे चाग्रतः पातु विजया पातु पृष्ठतः । नारायणी शीर्षदेशे सर्वाङ्गे सिंहवाहिनी ॥ १७॥ शिवदूती
    उग्रचण्डा प्रत्यङ्गे परमेश्वरी । विशालाक्षी महामाया कौमारी सङ्खिनी शिवा ॥ १८॥ चक्रिणी जयधात्री च रणमत्ता
    रणप्रिया । दुर्गा जयन्ती काली च भद्रकाली महोदरी ॥ १९॥ नारसिंही च वाराही सिद्धिदात्री सुखप्रदा । भयङ्करी
    महारौद्री महाभयविनाशिनी ॥ १०॥ इति ब्रह्मयामले ब्रह्मनारदसंवादे आद्या स्तोत्रं समाप्तम् ॥ ॥ ॐ नम आद्यायै
    ॐ नम आद्यायै ॐ नम आद्यायै ॥
