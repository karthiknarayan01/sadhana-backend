    ॥ बेगि करहु किन आँखिन्ह ओटा। देखत छोट खोट नृप ढोटा ॥ बिहसे लखनु कहा मन माहीं। मूदें आँखि कतहुँ कौ
    नाहीम् ॥ दो परसुरामु तब राम प्रति बोले उर अति क्रोधु। सम्भु सरासनु तोरि सठ करसि हमार प्रबोधु ॥ ॥ बन्धु
    कहि कटु सम्मत तोरें। तू छल बिनय करसि कर जोरेम् ॥ करु परितोषु मोर सङ्ग्रामा। नाहिं त छाड़ कहाउब रामा
    ॥ छलु तजि करहि समरु सिवद्रोही। बन्धु सहित न त मारुँ तोही ॥ भृगुपति बकहिं कुठार उठाएँ। मन मुसकाहिं
    रामु सिर नाएँ ॥ गुनह लखन कर हम पर रोषू। कतहुँ सुधाइहु ते बड़ दोषू ॥ टेढ़ जानि सब बन्दि काहू। बक्र
    चन्द्रमहि ग्रसि न राहू ॥ राम कहेउ रिस तजिअ मुनीसा। कर कुठारु आगें यह सीसा ॥ जेंहिं रिस जाइ करिअ सोइ
    स्वामी। मोहि जानि आपन अनुगामी ॥ दो प्रभुहि सेवकहि समरु कस तजहु बिप्रबर रोसु। बेषु बिलोकें कहेसि कछु
    बालकहू नहिं दोसु ॥ ॥ देखि कुठार बान धनु धारी। भै लरिकहि रिस बीरु बिचारी ॥ नामु जान पै तुम्हहि न चीन्हा।
    बंस सुभायँ उतरु तेंहिं दीन्हा ॥ जौं तुम्ह औतेहु मुनि की नाईं। पद रज सिर सिसु धरत गोसाईम् ॥ छमहु चूक
    अनजानत केरी। चहिअ बिप्र उर कृपा घनेरी ॥ हमहि तुम्हहि सरिबरि कसि नाथा ॥ कहहु न कहाँ चरन कहँ माथा ॥
    राम मात्र लघु नाम हमारा। परसु सहित बड़ नाम तोहारा ॥ देव एकु गुनु धनुष हमारें। नव गुन परम पुनीत तुम्हारेम्
    ॥ सब प्रकार हम तुम्ह सन हारे। छमहु बिप्र अपराध हमारे ॥ दो बार बार मुनि बिप्रबर कहा राम सन राम। बोले
    भृगुपति सरुष हसि तहूँ बन्धु सम बाम ॥ ॥ निपटहिं द्विज करि जानहि मोही। मैं जस बिप्र सुनावुँ तोही ॥ चाप
    स्त्रुवा सर आहुति जानू। कोप मोर अति घोर कृसानु ॥ समिधि सेन चतुरङ्ग सुहाई। महा महीप भे पसु आई ॥ मै
    एहि परसु काटि बलि दीन्हे। समर जग्य जप कोटिन्ह कीन्हे ॥ मोर प्रभाउ बिदित नहिं तोरें। बोलसि निदरि बिप्र
    के भोरेम् ॥ भञ्जेउ चापु दापु बड़ बाढ़आ। अहमिति मनहुँ जीति जगु ठाढ़आ ॥ राम कहा मुनि कहहु बिचारी। रिस
    अति बड़इ लघु चूक हमारी ॥ छुअतहिं टूट पिनाक पुराना। मैं कहि हेतु करौं अभिमाना ॥ दो जौं हम निदरहिं बिप्र
    बदि सत्य सुनहु भृगुनाथ। तौ अस को जग सुभटु जेहि भय बस नावहिं माथ ॥ ॥ देव दनुज भूपति भट नाना। समबल अधिक
    हौ बलवाना ॥ जौं रन हमहि पचारै कोऊ। लरहिं सुखेन कालु किन होऊ ॥ छत्रिय तनु धरि समर सकाना। कुल कलङ्कु
    तेहिं पावँर आना ॥ कहुँ सुभाउ न कुलहि प्रसंसी। कालहु डरहिं न रन रघुबंसी ॥ बिप्रबंस कै असि प्रभुताई।
    अभय होइ जो तुम्हहि डेराई ॥ सुनु मृदु गूढ़ बचन रघुपति के। उघरे पटल परसुधर मति के ॥ राम रमापति कर धनु
    लेहू। खैञ्चहु मिटै मोर सन्देहू ॥ देत चापु आपुहिं चलि गयू। परसुराम मन बिसमय भयू ॥ दो जाना राम प्रभाउ
    तब पुलक प्रफुल्लित गात। जोरि पानि बोले बचन ह्दयँ न प्रेमु अमात ॥ ॥ जय रघुबंस बनज बन भानू। गहन दनुज
    कुल दहन कृसानु ॥ जय सुर बिप्र धेनु हितकारी। जय मद मोह कोह भ्रम हारी ॥ बिनय सील करुना गुन सागर। जयति
    बचन रचना अति नागर ॥ सेवक सुखद सुभग सब अङ्गा। जय सरीर छबि कोटि अनङ्गा ॥ करौं काह मुख एक प्रसंसा। जय
    महेस मन मानस हंसा ॥ अनुचित बहुत कहेउँ अग्याता। छमहु छमामन्दिर दौ भ्राता ॥ कहि जय जय जय रघुकुलकेतू।
    भृगुपति गे बनहि तप हेतू ॥ अपभयँ कुटिल महीप डेराने। जहँ तहँ कायर गवँहिं पराने ॥ दो देवन्ह दीन्हीं दुन्दुभीं
    प्रभु पर बरषहिं फूल। हरषे पुर नर नारि सब मिटी मोहमय सूल ॥ ॥ अति गहगहे बाजने बाजे। सबहिं मनोहर मङ्गल
    साजे ॥ जूथ जूथ मिलि सुमुख सुनयनीं। करहिं गान कल कोकिलबयनी ॥ सुखु बिदेह कर बरनि न जाई। जन्मदरिद्र मनहुँ
    निधि पाई ॥ गत त्रास भि सीय सुखारी। जनु बिधु उदयँ चकोरकुमारी ॥ जनक कीन्ह कौसिकहि प्रनामा। प्रभु प्रसाद
    धनु भञ्जेउ रामा ॥ मोहि कृतकृत्य कीन्ह दुहुँ भाईं। अब जो उचित सो कहिअ गोसाई ॥ कह मुनि सुनु नरनाथ प्रबीना।
    रहा बिबाहु चाप आधीना ॥ टूटतहीं धनु भयु बिबाहू। सुर नर नाग बिदित सब काहु ॥ दो तदपि जाइ तुम्ह करहु अब
    जथा बंस ब्यवहारु। बूझि बिप्र कुलबृद्ध गुर बेद बिदित आचारु ॥ ॥ दूत अवधपुर पठवहु जाई। आनहिं नृप दसरथहि
    बोलाई ॥ मुदित राउ कहि भलेहिं कृपाला। पठे दूत बोलि तेहि काला ॥ बहुरि महाजन सकल बोलाए। आइ सबन्हि सादर
    सिर नाए ॥ हाट बाट मन्दिर सुरबासा। नगरु सँवारहु चारिहुँ पासा ॥ हरषि चले निज निज गृह आए। पुनि परिचारक
    बोलि पठाए ॥ रचहु बिचित्र बितान बनाई। सिर धरि बचन चले सचु पाई ॥ पठे बोलि गुनी तिन्ह नाना। जे बितान
    बिधि कुसल सुजाना ॥ बिधिहि बन्दि तिन्ह कीन्ह अरम्भा। बिरचे कनक कदलि के खम्भा ॥ दो हरित मनिन्ह के पत्र
    फल पदुमराग के फूल। रचना देखि बिचित्र अति मनु बिरञ्चि कर भूल ॥ ॥ बेनि हरित मनिमय सब कीन्हे। सरल सपरब
    परहिं नहिं चीन्हे ॥ कनक कलित अहिबेल बनाई। लखि नहि परि सपरन सुहाई ॥ तेहि के रचि पचि बन्ध बनाए। बिच
    बिच मुकता दाम सुहाए ॥ मानिक मरकत कुलिस पिरोजा। चीरि कोरि पचि रचे सरोजा ॥ किए भृङ्ग बहुरङ्ग बिहङ्गा।
    गुञ्जहिं कूजहिं पवन प्रसङ्गा ॥ सुर प्रतिमा खम्भन गढ़ई काढ़ई। मङ्गल द्रब्य लिएँ सब ठाढ़ई ॥ चौङ्कें
    भाँति अनेक पुराईं। सिन्धुर मनिमय सहज सुहाई ॥ दो सौरभ पल्लव सुभग सुठि किए नीलमनि कोरि ॥ हेम बौर मरकत
    घवरि लसत पाटमय डोरि ॥ ॥ रचे रुचिर बर बन्दनिबारे। मनहुँ मनोभवँ फन्द सँवारे ॥ मङ्गल कलस अनेक बनाए। ध्वज
    पताक पट चमर सुहाए ॥ दीप मनोहर मनिमय नाना। जाइ न बरनि बिचित्र बिताना ॥ जेहिं मण्डप दुलहिनि बैदेही।
    सो बरनै असि मति कबि केही ॥ दूलहु रामु रूप गुन सागर। सो बितानु तिहुँ लोक उजागर ॥ जनक भवन कै सौभा जैसी।
    गृह गृह प्रति पुर देखिअ तैसी ॥ जेहिं तेरहुति तेहि समय निहारी। तेहि लघु लगहिं भुवन दस चारी ॥ जो सम्पदा
    नीच गृह सोहा। सो बिलोकि सुरनायक मोहा ॥ दो बसि नगर जेहि लच्छ करि कपट नारि बर बेषु ॥ तेहि पुर कै सोभा
    कहत सकुचहिं सारद सेषु ॥ ॥ पहुँचे दूत राम पुर पावन। हरषे नगर बिलोकि सुहावन ॥ भूप द्वार तिन्ह खबरि जनाई।
    दसरथ नृप सुनि लिए बोलाई ॥ करि प्रनामु तिन्ह पाती दीन्ही। मुदित महीप आपु उठि लीन्ही ॥ बारि बिलोचन बाचत
    पाँती। पुलक गात आई भरि छाती ॥ रामु लखनु उर कर बर चीठी। रहि गे कहत न खाटी मीठी ॥ पुनि धरि धीर पत्रिका
    बाँची। हरषी सभा बात सुनि साँची ॥ खेलत रहे तहाँ सुधि पाई। आए भरतु सहित हित भाई ॥ पूछत अति सनेहँ सकुचाई।
    तात कहाँ तें पाती आई ॥ दो कुसल प्रानप्रिय बन्धु दौ अहहिं कहहु केहिं देस। सुनि सनेह साने बचन बाची बहुरि
    नरेस ॥ ॥ सुनि पाती पुलके दौ भ्राता। अधिक सनेहु समात न गाता ॥ प्रीति पुनीत भरत कै देखी। सकल सभाँ सुखु
    लहेउ बिसेषी ॥ तब नृप दूत निकट बैठारे। मधुर मनोहर बचन उचारे ॥ भैया कहहु कुसल दौ बारे। तुम्ह नीकें निज
    नयन निहारे ॥ स्यामल गौर धरें धनु भाथा। बय किसोर कौसिक मुनि साथा ॥ पहिचानहु तुम्ह कहहु सुभ् । प्रेम
    बिबस पुनि पुनि कह र् ॥ जा दिन तें मुनि गे लवाई। तब तें आजु साँचि सुधि पाई ॥ कहहु बिदेह कवन बिधि जाने।
    सुनि प्रिय बचन दूत मुसकाने ॥ दो सुनहु महीपति मुकुट मनि तुम्ह सम धन्य न कौ। रामु लखनु जिन्ह के तनय
    बिस्व बिभूषन दौ ॥ ॥ पूछन जोगु न तनय तुम्हारे। पुरुषसिङ्घ तिहु पुर उजिआरे ॥ जिन्ह के जस प्रताप कें
    आगे। ससि मलीन रबि सीतल लागे ॥ तिन्ह कहँ कहिअ नाथ किमि चीन्हे। देखिअ रबि कि दीप कर लीन्हे ॥ सीय स्वयम्बर
    भूप अनेका। समिटे सुभट एक तें एका ॥ सम्भु सरासनु काहुँ न टारा। हारे सकल बीर बरिआरा ॥ तीनि लोक महँ जे
    भटमानी। सभ कै सकति सम्भु धनु भानी ॥ सकि उठाइ सरासुर मेरू। सौ हियँ हारि गयु करि फेरू ॥ जेहि कौतुक सिवसैलु
    उठावा। सौ तेहि सभाँ पराभु पावा ॥ दो तहाँ राम रघुबंस मनि सुनिअ महा महिपाल। भञ्जेउ चाप प्रयास बिनु जिमि
    गज पङ्कज नाल ॥ ॥ सुनि सरोष भृगुनायकु आए। बहुत भाँति तिन्ह आँखि देखाए ॥ देखि राम बलु निज धनु दीन्हा।
    करि बहु बिनय गवनु बन कीन्हा ॥ राजन रामु अतुलबल जैसें। तेज निधान लखनु पुनि तैसेम् ॥ कम्पहि भूप बिलोकत
    जाकें। जिमि गज हरि किसोर के ताकेम् ॥ देव देखि तव बालक दोऊ। अब न आँखि तर आवत कोऊ ॥ दूत बचन रचना प्रिय
    लागी। प्रेम प्रताप बीर रस पागी ॥ सभा समेत राउ अनुरागे। दूतन्ह देन निछावरि लागे ॥ कहि अनीति ते मूदहिं
    काना। धरमु बिचारि सबहिं सुख माना ॥ दो तब उठि भूप बसिष्ठ कहुँ दीन्हि पत्रिका जाइ। कथा सुनाई गुरहि सब
    सादर दूत बोलाइ ॥ ॥ सुनि बोले गुर अति सुखु पाई। पुन्य पुरुष कहुँ महि सुख छाई ॥ जिमि सरिता सागर महुँ
    जाहीं। जद्यपि ताहि कामना नाहीम् ॥ तिमि सुख सम्पति बिनहिं बोलाएँ। धरमसील पहिं जाहिं सुभाएँ ॥ तुम्ह
    गुर बिप्र धेनु सुर सेबी। तसि पुनीत कौसल्या देबी ॥ सुकृती तुम्ह समान जग माहीं। भयु न है कौ होनेउ नाहीम्
    ॥ तुम्ह ते अधिक पुन्य बड़ काकें। राजन राम सरिस सुत जाकेम् ॥ बीर बिनीत धरम ब्रत धारी। गुन सागर बर बालक
    चारी ॥ तुम्ह कहुँ सर्ब काल कल्याना। सजहु बरात बजाइ निसाना ॥ दो चलहु बेगि सुनि गुर बचन भलेहिं नाथ सिरु
    नाइ। भूपति गवने भवन तब दूतन्ह बासु देवाइ ॥ ॥ राजा सबु रनिवास बोलाई। जनक पत्रिका बाचि सुनाई ॥ सुनि
    सन्देसु सकल हरषानीं। अपर कथा सब भूप बखानीम् ॥ प्रेम प्रफुल्लित राजहिं रानी। मनहुँ सिखिनि सुनि बारिद
    बनी ॥ मुदित असीस देहिं गुरु नारीं। अति आनन्द मगन महतारीम् ॥ लेहिं परस्पर अति प्रिय पाती। हृदयँ लगाइ
    जुड़आवहिं छाती ॥ राम लखन कै कीरति करनी। बारहिं बार भूपबर बरनी ॥ मुनि प्रसादु कहि द्वार सिधाए। रानिन्ह
    तब महिदेव बोलाए ॥ दिए दान आनन्द समेता। चले बिप्रबर आसिष देता ॥ सो जाचक लिए हँकारि दीन्हि निछावरि कोटि
    बिधि। चिरु जीवहुँ सुत चारि चक्रबर्ति दसरत्थ के ॥ ॥ कहत चले पहिरें पट नाना। हरषि हने गहगहे निसाना ॥
    समाचार सब लोगन्ह पाए। लागे घर घर होने बधाए ॥ भुवन चारि दस भरा उछाहू। जनकसुता रघुबीर बिआहू ॥ सुनि सुभ
    कथा लोग अनुरागे। मग गृह गलीं सँवारन लागे ॥ जद्यपि अवध सदैव सुहावनि। राम पुरी मङ्गलमय पावनि ॥ तदपि
    प्रीति कै प्रीति सुहाई। मङ्गल रचना रची बनाई ॥ ध्वज पताक पट चामर चारु। छावा परम बिचित्र बजारू ॥ कनक
    कलस तोरन मनि जाला। हरद दूब दधि अच्छत माला ॥ दो मङ्गलमय निज निज भवन लोगन्ह रचे बनाइ। बीथीं सीचीं चतुरसम
    चौकें चारु पुराइ ॥ ॥ जहँ तहँ जूथ जूथ मिलि भामिनि। सजि नव सप्त सकल दुति दामिनि ॥ बिधुबदनीं मृग सावक
    लोचनि। निज सरुप रति मानु बिमोचनि ॥ गावहिं मङ्गल मञ्जुल बानीं। सुनिकल रव कलकण्ठि लजानीम् ॥ भूप भवन
    किमि जाइ बखाना। बिस्व बिमोहन रचेउ बिताना ॥ मङ्गल द्रब्य मनोहर नाना। राजत बाजत बिपुल निसाना ॥ कतहुँ
    बिरिद बन्दी उच्चरहीं। कतहुँ बेद धुनि भूसुर करहीम् ॥ गावहिं सुन्दरि मङ्गल गीता। लै लै नामु रामु अरु
    सीता ॥ बहुत उछाहु भवनु अति थोरा। मानहुँ उमगि चला चहु ओरा ॥ दो सोभा दसरथ भवन कि को कबि बरनै पार। जहाँ
    सकल सुर सीस मनि राम लीन्ह अवतार ॥ ॥ भूप भरत पुनि लिए बोलाई। हय गय स्यन्दन साजहु जाई ॥ चलहु बेगि रघुबीर
    बराता। सुनत पुलक पूरे दौ भ्राता ॥ भरत सकल साहनी बोलाए। आयसु दीन्ह मुदित उठि धाए ॥ रचि रुचि जीन तुरग
    तिन्ह साजे। बरन बरन बर बाजि बिराजे ॥ सुभग सकल सुठि चञ्चल करनी। अय इव जरत धरत पग धरनी ॥ नाना जाति न
    जाहिं बखाने। निदरि पवनु जनु चहत उड़आने ॥ तिन्ह सब छयल भे असवारा। भरत सरिस बय राजकुमारा ॥ सब सुन्दर
    सब भूषनधारी। कर सर चाप तून कटि भारी ॥ दो छरे छबीले छयल सब सूर सुजान नबीन। जुग पदचर असवार प्रति जे
    असिकला प्रबीन ॥ ॥ बाँधे बिरद बीर रन गाढ़ए। निकसि भे पुर बाहेर ठाढ़ए ॥ फेरहिं चतुर तुरग गति नाना। हरषहिं
    सुनि सुनि पवन निसाना ॥ रथ सारथिन्ह बिचित्र बनाए। ध्वज पताक मनि भूषन लाए ॥ चवँर चारु किङ्किन धुनि करही।
    भानु जान सोभा अपहरहीम् ॥ सावँकरन अगनित हय होते। ते तिन्ह रथन्ह सारथिन्ह जोते ॥ सुन्दर सकल अलङ्कृत
    सोहे। जिन्हहि बिलोकत मुनि मन मोहे ॥ जे जल चलहिं थलहि की नाई। टाप न बूड़ बेग अधिकाई ॥ अस्त्र सस्त्र
    सबु साजु बनाई। रथी सारथिन्ह लिए बोलाई ॥ दो चढ़इ चढ़इ रथ बाहेर नगर लागी जुरन बरात। होत सगुन सुन्दर
    सबहि जो जेहि कारज जात ॥ ॥ कलित करिबरन्हि परीं अँबारीं। कहि न जाहिं जेहि भाँति सँवारीम् ॥ चले मत्तगज
    घण्ट बिराजी। मनहुँ सुभग सावन घन राजी ॥ बाहन अपर अनेक बिधाना। सिबिका सुभग सुखासन जाना ॥ तिन्ह चढ़इ
    चले बिप्रबर वृन्दा। जनु तनु धरें सकल श्रुति छन्दा ॥ मागध सूत बन्दि गुनगायक। चले जान चढ़इ जो जेहि लायक
    ॥ बेसर ऊँट बृषभ बहु जाती। चले बस्तु भरि अगनित भाँती ॥ कोटिन्ह काँवरि चले कहारा। बिबिध बस्तु को बरनै
    पारा ॥ चले सकल सेवक समुदाई। निज निज साजु समाजु बनाई ॥ दो सब कें उर निर्भर हरषु पूरित पुलक सरीर। कबहिं
    देखिबे नयन भरि रामु लखनू दौ बीर ॥ ॥ गरजहिं गज घण्टा धुनि घोरा। रथ रव बाजि हिंस चहु ओरा ॥ निदरि घनहि
    घुर्म्मरहिं निसाना। निज पराइ कछु सुनिअ न काना ॥ महा भीर भूपति के द्वारें। रज होइ जाइ पषान पबारेम्
    ॥ चढ़ई अटारिन्ह देखहिं नारीं। लिँएँ आरती मङ्गल थारी ॥ गावहिं गीत मनोहर नाना। अति आनन्दु न जाइ बखाना
    ॥ तब सुमन्त्र दुइ स्पन्दन साजी। जोते रबि हय निन्दक बाजी ॥ दौ रथ रुचिर भूप पहिं आने। नहिं सारद पहिं
    जाहिं बखाने ॥ राज समाजु एक रथ साजा। दूसर तेज पुञ्ज अति भ्राजा ॥ दो तेहिं रथ रुचिर बसिष्ठ कहुँ हरषि
    चढ़आइ नरेसु। आपु चढ़एउ स्पन्दन सुमिरि हर गुर गौरि गनेसु ॥ ॥ सहित बसिष्ठ सोह नृप कैसें। सुर गुर सङ्ग
    पुरन्दर जैसेम् ॥ करि कुल रीति बेद बिधि र् । देखि सबहि सब भाँति बन् ॥ सुमिरि रामु गुर आयसु पाई। चले
    महीपति सङ्ख बजाई ॥ हरषे बिबुध बिलोकि बराता। बरषहिं सुमन सुमङ्गल दाता ॥ भयु कोलाहल हय गय गाजे। ब्योम
    बरात बाजने बाजे ॥ सुर नर नारि सुमङ्गल गाई। सरस राग बाजहिं सहनाई ॥ घण्ट घण्टि धुनि बरनि न जाहीं। सरव
    करहिं पाइक फहराहीम् ॥ करहिं बिदूषक कौतुक नाना। हास कुसल कल गान सुजाना । दो तुरग नचावहिं कुँअर बर अकनि
    मृदङ्ग निसान ॥ नागर नट चितवहिं चकित डगहिं न ताल बँधान ॥ ॥ बनि न बरनत बनी बराता। होहिं सगुन सुन्दर
    सुभदाता ॥ चारा चाषु बाम दिसि लेई। मनहुँ सकल मङ्गल कहि देई ॥ दाहिन काग सुखेत सुहावा। नकुल दरसु सब काहूँ
    पावा ॥ सानुकूल बह त्रिबिध बयारी। सघट सवाल आव बर नारी ॥ लोवा फिरि फिरि दरसु देखावा। सुरभी सनमुख सिसुहि
    पिआवा ॥ मृगमाला फिरि दाहिनि आई। मङ्गल गन जनु दीन्हि देखाई ॥ छेमकरी कह छेम बिसेषी। स्यामा बाम सुतरु
    पर देखी ॥ सनमुख आयु दधि अरु मीना। कर पुस्तक दुइ बिप्र प्रबीना ॥ दो मङ्गलमय कल्यानमय अभिमत फल दातार।
    जनु सब साचे होन हित भे सगुन एक बार ॥ ॥ मङ्गल सगुन सुगम सब ताकें। सगुन ब्रह्म सुन्दर सुत जाकेम् ॥ राम
    सरिस बरु दुलहिनि सीता। समधी दसरथु जनकु पुनीता ॥ सुनि अस ब्याहु सगुन सब नाचे। अब कीन्हे बिरञ्चि हम
    साँचे ॥ एहि बिधि कीन्ह बरात पयाना। हय गय गाजहिं हने निसाना ॥ आवत जानि भानुकुल केतू। सरितन्हि जनक बँधाए
    सेतू ॥ बीच बीच बर बास बनाए। सुरपुर सरिस सम्पदा छाए ॥ असन सयन बर बसन सुहाए। पावहिं सब निज निज मन भाए
    ॥ नित नूतन सुख लखि अनुकूले। सकल बरातिन्ह मन्दिर भूले ॥ दो आवत जानि बरात बर सुनि गहगहे निसान। सजि गज
    रथ पदचर तुरग लेन चले अगवान ॥ दसवाँ विश्राम कनक कलस भरि कोपर थारा। भाजन ललित अनेक प्रकारा ॥ भरे सुधासम
    सब पकवाने। नाना भाँति न जाहिं बखाने ॥ फल अनेक बर बस्तु सुहाईं। हरषि भेण्ट हित भूप पठाईम् ॥ भूषन बसन
    महामनि नाना। खग मृग हय गय बहुबिधि जाना ॥ मङ्गल सगुन सुगन्ध सुहाए। बहुत भाँति महिपाल पठाए ॥ दधि चिउरा
    उपहार अपारा। भरि भरि काँवरि चले कहारा ॥ अगवानन्ह जब दीखि बराता।उर आनन्दु पुलक भर गाता ॥ देखि बनाव
    सहित अगवाना। मुदित बरातिन्ह हने निसाना ॥ दो हरषि परसपर मिलन हित कछुक चले बगमेल। जनु आनन्द समुद्र दुइ
    मिलत बिहाइ सुबेल ॥ ॥ बरषि सुमन सुर सुन्दरि गावहिं। मुदित देव दुन्दुभीं बजावहिम् ॥ बस्तु सकल राखीं
    नृप आगें। बिनय कीन्ह तिन्ह अति अनुरागेम् ॥ प्रेम समेत रायँ सबु लीन्हा। भै बकसीस जाचकन्हि दीन्हा ॥
    करि पूजा मान्यता बड़आई। जनवासे कहुँ चले लवाई ॥ बसन बिचित्र पाँवड़ए परहीं। देखि धनहु धन मदु परिहरहीम्
    ॥ अति सुन्दर दीन्हेउ जनवासा। जहँ सब कहुँ सब भाँति सुपासा ॥ जानी सियँ बरात पुर आई। कछु निज महिमा प्रगटि
    जनाई ॥ हृदयँ सुमिरि सब सिद्धि बोलाई। भूप पहुनी करन पठाई ॥ दो सिधि सब सिय आयसु अकनि गीं जहाँ जनवास।
    लिएँ सम्पदा सकल सुख सुरपुर भोग बिलास ॥ ॥ निज निज बास बिलोकि बराती। सुर सुख सकल सुलभ सब भाँती ॥ बिभव
    भेद कछु कौ न जाना। सकल जनक कर करहिं बखाना ॥ सिय महिमा रघुनायक जानी। हरषे हृदयँ हेतु पहिचानी ॥ पितु
    आगमनु सुनत दौ भाई। हृदयँ न अति आनन्दु अमाई ॥ सकुचन्ह कहि न सकत गुरु पाहीं। पितु दरसन लालचु मन माहीम्
    ॥ बिस्वामित्र बिनय बड़इ देखी। उपजा उर सन्तोषु बिसेषी ॥ हरषि बन्धु दौ हृदयँ लगाए। पुलक अङ्ग अम्बक जल
    छाए ॥ चले जहाँ दसरथु जनवासे। मनहुँ सरोबर तकेउ पिआसे ॥ दो भूप बिलोके जबहिं मुनि आवत सुतन्ह समेत। उठे
    हरषि सुखसिन्धु महुँ चले थाह सी लेत ॥ ॥ मुनिहि दण्डवत कीन्ह महीसा। बार बार पद रज धरि सीसा ॥ कौसिक राउ
    लिये उर लाई। कहि असीस पूछी कुसलाई ॥ पुनि दण्डवत करत दौ भाई। देखि नृपति उर सुखु न समाई ॥ सुत हियँ लाइ
    दुसह दुख मेटे। मृतक सरीर प्रान जनु भेण्टे ॥ पुनि बसिष्ठ पद सिर तिन्ह नाए। प्रेम मुदित मुनिबर उर लाए
    ॥ बिप्र बृन्द बन्दे दुहुँ भाईं। मन भावती असीसें पाईम् ॥ भरत सहानुज कीन्ह प्रनामा। लिए उठाइ लाइ उर
    रामा ॥ हरषे लखन देखि दौ भ्राता। मिले प्रेम परिपूरित गाता ॥ दो पुरजन परिजन जातिजन जाचक मन्त्री मीत।
    मिले जथाबिधि सबहि प्रभु परम कृपाल बिनीत ॥ ॥ रामहि देखि बरात जुड़आनी। प्रीति कि रीति न जाति बखानी ॥
    नृप समीप सोहहिं सुत चारी। जनु धन धरमादिक तनुधारी ॥ सुतन्ह समेत दसरथहि देखी। मुदित नगर नर नारि बिसेषी
    ॥ सुमन बरिसि सुर हनहिं निसाना। नाकनटीं नाचहिं करि गाना ॥ सतानन्द अरु बिप्र सचिव गन। मागध सूत बिदुष
    बन्दीजन ॥ सहित बरात राउ सनमाना। आयसु मागि फिरे अगवाना ॥ प्रथम बरात लगन तें आई। तातें पुर प्रमोदु अधिकाई
    ॥ ब्रह्मानन्दु लोग सब लहहीं। बढ़हुँ दिवस निसि बिधि सन कहहीम् ॥ दो रामु सीय सोभा अवधि सुकृत अवधि दौ
    राज। जहँ जहँ पुरजन कहहिं अस मिलि नर नारि समाज ॥ । ॥ जनक सुकृत मूरति बैदेही। दसरथ सुकृत रामु धरें देही
    ॥ इन्ह सम काँहु न सिव अवराधे। काहिँ न इन्ह समान फल लाधे ॥ इन्ह सम कौ न भयु जग माहीं। है नहिं कतहूँ
    होनेउ नाहीम् ॥ हम सब सकल सुकृत कै रासी। भे जग जनमि जनकपुर बासी ॥ जिन्ह जानकी राम छबि देखी। को सुकृती
    हम सरिस बिसेषी ॥ पुनि देखब रघुबीर बिआहू। लेब भली बिधि लोचन लाहू ॥ कहहिं परसपर कोकिलबयनीं। एहि बिआहँ
    बड़ लाभु सुनयनीम् ॥ बड़एं भाग बिधि बात बनाई। नयन अतिथि होइहहिं दौ भाई ॥ दो बारहिं बार सनेह बस जनक
    बोलाउब सीय। लेन आइहहिं बन्धु दौ कोटि काम कमनीय ॥ ॥ बिबिध भाँति होइहि पहुनाई। प्रिय न काहि अस सासुर
    माई ॥ तब तब राम लखनहि निहारी। होइहहिं सब पुर लोग सुखारी ॥ सखि जस राम लखनकर जोटा। तैसेइ भूप सङ्ग दुइ
    ढोटा ॥ स्याम गौर सब अङ्ग सुहाए। ते सब कहहिं देखि जे आए ॥ कहा एक मैं आजु निहारे। जनु बिरञ्चि निज हाथ
    सँवारे ॥ भरतु रामही की अनुहारी। सहसा लखि न सकहिं नर नारी ॥ लखनु सत्रुसूदनु एकरूपा। नख सिख ते सब अङ्ग
    अनूपा ॥ मन भावहिं मुख बरनि न जाहीं। उपमा कहुँ त्रिभुवन कौ नाहीम् ॥ छं उपमा न कौ कह दास तुलसी कतहुँ
    कबि कोबिद कहैं। बल बिनय बिद्या सील सोभा सिन्धु इन्ह से एइ अहैम् ॥ पुर नारि सकल पसारि अञ्चल बिधिहि
    बचन सुनावहीम् ॥ ब्याहिअहुँ चारिउ भाइ एहिं पुर हम सुमङ्गल गावहीम् ॥ सो कहहिं परस्पर नारि बारि बिलोचन
    पुलक तन। सखि सबु करब पुरारि पुन्य पयोनिधि भूप दौ ॥ ॥ एहि बिधि सकल मनोरथ करहीं। आनँद उमगि उमगि उर भरहीम्
    ॥ जे नृप सीय स्वयम्बर आए। देखि बन्धु सब तिन्ह सुख पाए ॥ कहत राम जसु बिसद बिसाला। निज निज भवन गे महिपाला
    ॥ गे बीति कुछ दिन एहि भाँती। प्रमुदित पुरजन सकल बराती ॥ मङ्गल मूल लगन दिनु आवा। हिम रितु अगहनु मासु
    सुहावा ॥ ग्रह तिथि नखतु जोगु बर बारू। लगन सोधि बिधि कीन्ह बिचारू ॥ पठै दीन्हि नारद सन सोई। गनी जनक
    के गनकन्ह जोई ॥ सुनी सकल लोगन्ह यह बाता। कहहिं जोतिषी आहिं बिधाता ॥ दो धेनुधूरि बेला बिमल सकल सुमङ्गल
    मूल। बिप्रन्ह कहेउ बिदेह सन जानि सगुन अनुकुल ॥ ॥ उपरोहितहि कहेउ नरनाहा। अब बिलम्ब कर कारनु काहा ॥
    सतानन्द तब सचिव बोलाए। मङ्गल सकल साजि सब ल्याए ॥ सङ्ख निसान पनव बहु बाजे। मङ्गल कलस सगुन सुभ साजे
    ॥ सुभग सुआसिनि गावहिं गीता। करहिं बेद धुनि बिप्र पुनीता ॥ लेन चले सादर एहि भाँती। गे जहाँ जनवास बराती
    ॥ कोसलपति कर देखि समाजू। अति लघु लाग तिन्हहि सुरराजू ॥ भयु समु अब धारिअ प् । यह सुनि परा निसानहिं
    घ् ॥ गुरहि पूछि करि कुल बिधि राजा। चले सङ्ग मुनि साधु समाजा ॥ दो भाग्य बिभव अवधेस कर देखि देव ब्रह्मादि।
    लगे सराहन सहस मुख जानि जनम निज बादि ॥ ॥ सुरन्ह सुमङ्गल अवसरु जाना। बरषहिं सुमन बजाइ निसाना ॥ सिव ब्रह्मादिक
    बिबुध बरूथा। चढ़ए बिमानन्हि नाना जूथा ॥ प्रेम पुलक तन हृदयँ उछाहू। चले बिलोकन राम बिआहू ॥ देखि जनकपुरु
    सुर अनुरागे। निज निज लोक सबहिं लघु लागे ॥ चितवहिं चकित बिचित्र बिताना। रचना सकल अलौकिक नाना ॥ नगर
    नारि नर रूप निधाना। सुघर सुधरम सुसील सुजाना ॥ तिन्हहि देखि सब सुर सुरनारीं। भे नखत जनु बिधु उजिआरीम्
    ॥ बिधिहि भयह आचरजु बिसेषी। निज करनी कछु कतहुँ न देखी ॥ दो सिवँ समुझाए देव सब जनि आचरज भुलाहु। हृदयँ
    बिचारहु धीर धरि सिय रघुबीर बिआहु ॥ ॥ जिन्ह कर नामु लेत जग माहीं। सकल अमङ्गल मूल नसाहीम् ॥ करतल होहिं
    पदारथ चारी। तेइ सिय रामु कहेउ कामारी ॥ एहि बिधि सम्भु सुरन्ह समुझावा। पुनि आगें बर बसह चलावा ॥ देवन्ह
    देखे दसरथु जाता। महामोद मन पुलकित गाता ॥ साधु समाज सङ्ग महिदेवा। जनु तनु धरें करहिं सुख सेवा ॥ सोहत
    साथ सुभग सुत चारी। जनु अपबरग सकल तनुधारी ॥ मरकत कनक बरन बर जोरी। देखि सुरन्ह भै प्रीति न थोरी ॥ पुनि
    रामहि बिलोकि हियँ हरषे। नृपहि सराहि सुमन तिन्ह बरषे ॥ दो राम रूपु नख सिख सुभग बारहिं बार निहारि। पुलक
    गात लोचन सजल उमा समेत पुरारि ॥ ॥ केकि कण्ठ दुति स्यामल अङ्गा। तड़इत बिनिन्दक बसन सुरङ्गा ॥ ब्याह बिभूषन
    बिबिध बनाए। मङ्गल सब सब भाँति सुहाए ॥ सरद बिमल बिधु बदनु सुहावन। नयन नवल राजीव लजावन ॥ सकल अलौकिक
    सुन्दरताई। कहि न जाइ मनहीं मन भाई ॥ बन्धु मनोहर सोहहिं सङ्गा। जात नचावत चपल तुरङ्गा ॥ राजकुअँर बर
    बाजि देखावहिं। बंस प्रसंसक बिरिद सुनावहिम् ॥ जेहि तुरङ्ग पर रामु बिराजे। गति बिलोकि खगनायकु लाजे ॥
    कहि न जाइ सब भाँति सुहावा। बाजि बेषु जनु काम बनावा ॥ छं जनु बाजि बेषु बनाइ मनसिजु राम हित अति सोही।
    आपनें बय बल रूप गुन गति सकल भुवन बिमोही ॥ जगमगत जीनु जराव जोति सुमोति मनि मानिक लगे। किङ्किनि ललाम
    लगामु ललित बिलोकि सुर नर मुनि ठगे ॥ दो प्रभु मनसहिं लयलीन मनु चलत बाजि छबि पाव। भूषित उड़गन तड़इत
    घनु जनु बर बरहि नचाव ॥ ॥ जेहिं बर बाजि रामु असवारा। तेहि सारदु न बरनै पारा ॥ सङ्करु राम रूप अनुरागे।
    नयन पञ्चदस अति प्रिय लागे ॥ हरि हित सहित रामु जब जोहे। रमा समेत रमापति मोहे ॥ निरखि राम छबि बिधि हरषाने।
    आठि नयन जानि पछिताने ॥ सुर सेनप उर बहुत उछाहू। बिधि ते डेवढ़ लोचन लाहू ॥ रामहि चितव सुरेस सुजाना।
    गौतम श्रापु परम हित माना ॥ देव सकल सुरपतिहि सिहाहीं। आजु पुरन्दर सम कौ नाहीम् ॥ मुदित देवगन रामहि
    देखी। नृपसमाज दुहुँ हरषु बिसेषी ॥ छं अति हरषु राजसमाज दुहु दिसि दुन्दुभीं बाजहिं घनी। बरषहिं सुमन
    सुर हरषि कहि जय जयति जय रघुकुलमनी ॥ एहि भाँति जानि बरात आवत बाजने बहु बाजहीं। रानि सुआसिनि बोलि परिछनि
    हेतु मङ्गल साजहीम् ॥ दो सजि आरती अनेक बिधि मङ्गल सकल सँवारि। चलीं मुदित परिछनि करन गजगामिनि बर नारि
    ॥ ॥ बिधुबदनीं सब सब मृगलोचनि। सब निज तन छबि रति मदु मोचनि ॥ पहिरें बरन बरन बर चीरा। सकल बिभूषन सजें
    सरीरा ॥ सकल सुमङ्गल अङ्ग बनाएँ। करहिं गान कलकण्ठि लजाएँ ॥ कङ्कन किङ्किनि नूपुर बाजहिं। चालि बिलोकि
    काम गज लाजहिम् ॥ बाजहिं बाजने बिबिध प्रकारा। नभ अरु नगर सुमङ्गलचारा ॥ सची सारदा रमा भवानी। जे सुरतिय
    सुचि सहज सयानी ॥ कपट नारि बर बेष बनाई। मिलीं सकल रनिवासहिं जाई ॥ करहिं गान कल मङ्गल बानीं। हरष बिबस
    सब काहुँ न जानी ॥ छं को जान केहि आनन्द बस सब ब्रह्मु बर परिछन चली। कल गान मधुर निसान बरषहिं सुमन सुर
    सोभा भली ॥ आनन्दकन्दु बिलोकि दूलहु सकल हियँ हरषित भी ॥ अम्भोज अम्बक अम्बु उमगि सुअङ्ग पुलकावलि छी
    ॥ दो जो सुख भा सिय मातु मन देखि राम बर बेषु। सो न सकहिं कहि कलप सत सहस सारदा सेषु ॥ ॥ नयन नीरु हटि
    मङ्गल जानी। परिछनि करहिं मुदित मन रानी ॥ बेद बिहित अरु कुल आचारू। कीन्ह भली बिधि सब ब्यवहारू ॥ पञ्च
    सबद धुनि मङ्गल गाना। पट पाँवड़ए परहिं बिधि नाना ॥ करि आरती अरघु तिन्ह दीन्हा। राम गमनु मण्डप तब कीन्हा
    ॥ दसरथु सहित समाज बिराजे। बिभव बिलोकि लोकपति लाजे ॥ समयँ समयँ सुर बरषहिं फूला। सान्ति पढ़हिं महिसुर
    अनुकूला ॥ नभ अरु नगर कोलाहल होई। आपनि पर कछु सुनि न कोई ॥ एहि बिधि रामु मण्डपहिं आए। अरघु देइ आसन
    बैठाए ॥ छं बैठारि आसन आरती करि निरखि बरु सुखु पावहीम् ॥ मनि बसन भूषन भूरि वारहिं नारि मङ्गल गावहीम्
    ॥ ब्रह्मादि सुरबर बिप्र बेष बनाइ कौतुक देखहीं। अवलोकि रघुकुल कमल रबि छबि सुफल जीवन लेखहीम् ॥ दो बारी
    भाट नट राम निछावरि पाइ। मुदित असीसहिं नाइ सिर हरषु न हृदयँ समाइ ॥ ॥ मिले जनकु दसरथु अति प्रीतीं। करि
    बैदिक लौकिक सब रीतीम् ॥ मिलत महा दौ राज बिराजे। उपमा खोजि खोजि कबि लाजे ॥ लही न कतहुँ हारि हियँ मानी।
    इन्ह सम एइ उपमा उर आनी ॥ सामध देखि देव अनुरागे। सुमन बरषि जसु गावन लागे ॥ जगु बिरञ्चि उपजावा जब तें।
    देखे सुने ब्याह बहु तब तेम् ॥ सकल भाँति सम साजु समाजू। सम समधी देखे हम आजू ॥ देव गिरा सुनि सुन्दर
    साँची। प्रीति अलौकिक दुहु दिसि माची ॥ देत पाँवड़ए अरघु सुहाए। सादर जनकु मण्डपहिं ल्याए ॥ छं मण्डपु
    बिलोकि बिचीत्र रचनाँ रुचिरताँ मुनि मन हरे ॥ निज पानि जनक सुजान सब कहुँ आनि सिङ्घासन धरे ॥ कुल इष्ट
    सरिस बसिष्ट पूजे बिनय करि आसिष लही। कौसिकहि पूजत परम प्रीति कि रीति तौ न परै कही ॥ दो बामदेव आदिक
    रिषय पूजे मुदित महीस। दिए दिब्य आसन सबहि सब सन लही असीस ॥ ॥ बहुरि कीन्ह कोसलपति पूजा। जानि ईस सम भाउ
    न दूजा ॥ कीन्ह जोरि कर बिनय बड़आई। कहि निज भाग्य बिभव बहुताई ॥ पूजे भूपति सकल बराती। समधि सम सादर
    सब भाँती ॥ आसन उचित दिए सब काहू। कहौं काह मूख एक उछाहू ॥ सकल बरात जनक सनमानी। दान मान बिनती बर बानी
    ॥ बिधि हरि हरु दिसिपति दिनर् । जे जानहिं रघुबीर प्रभ् ॥ कपट बिप्र बर बेष बनाएँ। कौतुक देखहिं अति सचु
    पाएँ ॥ पूजे जनक देव सम जानें। दिए सुआसन बिनु पहिचानेम् ॥ छं पहिचान को केहि जान सबहिं अपान सुधि भोरी
    भी। आनन्द कन्दु बिलोकि दूलहु उभय दिसि आनँद मी ॥ सुर लखे राम सुजान पूजे मानसिक आसन दे। अवलोकि सीलु
