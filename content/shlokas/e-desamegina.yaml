id: e-desamegina
category: stotram
name:
  english: E Desamegina
content:
  english: e deshamegina èndu kalèdina e pithamèkkina pògadara ni talli bhumi bharatini nilapara ni jati
    nindu gauravamu e yoga balamo janiyincinada vi svargakhandamuna e mancipuvulan premincinavo ninu mocè
    i talli kanaka garbhamuna ledura ituvanti bhudevi yèndu lerura manavanti paurulinkèndu suryuni vèluturul
    sokunandaka odala jhandalu adunandaka andaka gala i ananta bhutalini mana bhumi vanti callani talli
    ledu padara ni vira bhava bharatamu tama tapassulu rishul dharavoyanga saurya haramul rajacandrularpimpa
    bhava sutramu kavi prabhuvulallanga raga dugdhamul bhaktaratnamul pidaka dikkulakègadannu tejammu
    vèlaga ralla teniyaluru ragalu saga jagamulanugincu magatanambègaya saundaryamèga boyu sahityamalara
    vèliginadi divya vishvambuputra divincè ni divya deshambu putra pòlamula ratnalu mòlicèra icata vardhilo
    mutyalu pandèra icata prithivi divyaushadhul pidikèra manaku kanala kasturi kacara manaku bharateyudanancu
    bhaktito pada
  devanagari: ए देशमेगिना ऎन्दु कालॆडिना ए पीठमॆक्किना पॊगडरा नी तल्लि भूमि भारतिनि निलपरा नी जाति निण्डु
    गौरवमु ए योग बलमो जनियिञ्चिनाड वी स्वर्गखण्डमुन ए मञ्चिपूवुलन् प्रेमिञ्चिनावो निनु मोचॆ ई तल्लि कनक
    गर्भमुन लेदुरा इटुवण्टि भूदेवि यॆन्दू लेरुरा मनवण्टि पौरुलिङ्कॆन्दु सूर्युनी वॆलुतुरुल् सोकुनन्दाक
    ओडला झण्डालु आडुनन्दाक अन्दाक गल ई अनन्त भूतलिनि मन भूमि वण्टि चल्लनि तल्लि लेदु पाडरा नी वीर भाव
    भारतमु तम तपस्सुलु ऋषुल् धारवोयङ्गा सौर्य हारमुल् राजचन्द्रुलर्पिम्प भाव सूत्रमु कवि प्रभुवुलल्लङ्ग
    राग दुग्धमुल् भक्तरत्नमुल् पिदक दिक्कुलकॆगदन्नु तेजम्मु वॆलग राल्ल तेनियलूरु रागालु सागा जगमुलनूगिञ्चु
    मगतनम्बॆगय सौन्दर्यमॆग बोयु साहित्यमलर वॆलिगिनदी दिव्य विश्वम्बुपुत्र दीविञ्चॆ नी दिव्य देशम्बु पुत्र
    पॊलमुला रत्नालु मॊलिचॆरा इचट वार्धिलो मुत्यालु पण्डॆरा इचट पृथिवि दिव्यौषधुल् पिदिकॆरा मनकू कानला
    कस्तूरि काचरा मनकु भारतेयुडनञ्चु भक्तितो पाड
