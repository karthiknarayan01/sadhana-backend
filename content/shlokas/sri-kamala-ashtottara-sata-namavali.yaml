    नमः । ॐ मधुकैटभमथन्यै नमः । ॐ शुम्भासुरविनाशिन्यै नमः । ॐ निशुम्भादिहरायै नमः । ॐ मात्रे नमः । ॐ हरिशङ्करपूजितायै
    नमः । ॐ सर्वदेवमय्यै नमः । ॐ सर्वायै नमः । ॐ शरणागतपालिन्यै नमः । ॐ शरण्यायै नमः । । ॐ शम्भुवनितायै
    नमः । ॐ सिन्धुतीरनिवासिन्यै नमः । ॐ गन्धार्वगानरसिकायै नमः । ॐ गीतायै नमः । ॐ गोविन्दवल्लभायै नमः
    । ॐ त्रैलोक्यपालिन्यै नमः । ॐ तत्त्वरूपायै नमः । ॐ तारुण्यपूरितायै नमः । ॐ चन्द्रावल्यै नमः । ॐ चन्द्रमुख्यै
    नमः । । ॐ चन्द्रिकायै नमः । ॐ चन्द्रपूजितायै नमः । ॐ चन्द्रायै नमः । ॐ शशाङ्कभगिन्यै नमः । ॐ गीतवाद्यपरायणायै
    नमः । ॐ सृष्टिरूपायै नमः । ॐ सृष्टिकर्यै नमः । ॐ सृष्टिसंहारकारिण्यै नमः । । इति श्री कमलाष्टोत्तरशतनामावलिः
    ॥
