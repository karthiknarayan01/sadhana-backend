id: devi-mahatmyam-durga-saptasati-chapter-4
category: stotram
name:
  english: Devi Mahatmyam Durga Saptasati Chapter 4
content:
  english: shakradistutirnama caturdho'dhyayah || dhyanam kalabhrabham katakshair ari kula bhayadam mauli
    baddhendu rekham shankha cakram kripanam trishikhamapi karai rudvahantim trineṟtram | simha skandadhirudham
    tribhuvana makhilam tejasa purayantim dhyaye ddurgam jayakhyam tridasha parivritam sevitam siddhi
    kamaih || rishiruvaca || || shakradayah suragana nihate'tivirye tasminduratmani suraribale ca devya
    | tam tushtuvuh pranatinamrashirodharamsa vagbhih praharshapulakodgamacarudehah || || devya yaya tatamidam
    jagadatmashaktya nihsheshadevaganashaktisamuhamurtya | tamambikamakhiladevamaharshipujyam bhaktya
    natah sma vidadhatushubhani sa nah || || yasyah prabhavamatulam bhagavanananto brahma harashca nahi
    vaktumalam balam ca | sa candika'khila jagatparipalanaya nashaya cashubhabhayasya matim karotu ||
    || ya shrih svayam sukritinam bhavaneshvalakshmih papatmanam kritadhiyam hridayeshu buddhih | shradtha
    satam kulajanaprabhavasya lajja tam tvam natah sma paripalaya devi vishvam || || kim varnayama tavarupa
    macintyametat kincativiryamasurakshayakari bhuri | kim cahaveshu caritani tavatbhutani sarveshu devyasuradevaganadikeshu
    | || || hetuh samastajagatam trigunapi doshaih na jnayase hariharadibhiravyapara | sarvashrayakhilamidam
    jagadamshabhutam avyakrita hi parama prakritistvamadya || || yasyah samastasurata samudiranena triptim
    prayati sakaleshu makheshu devi | svahasi vai pitri ganasya ca tripti hetu ruccaryase tvamata eva
    janaih svadhaca || || ya muktiheturavicintya mahavrata tvam abhyasyase suniyatendriyatatvasaraih |
    moksharthibhirmunibhirastasamastadoshai rvidya'si sa bhagavati parama hi devi || || shabdatmika suvimalargyajusham
    nidhanam mudgitharamyapadapathavatam ca samnam | devi trayi bhagavati bhavabhavanaya vartasi sarva
    jagatam paramartihantri || || medhasi devi viditakhilashastrasara durga'si durgabhavasagarasanaurasanga
    | shrih kaita bharihridayaikakritadhivasa gauri tvameva shashimaulikrita pratishtha || || ishatsahasamamalam
    paripurna candra bimbanukari kanakottamakantikantam | atyadbhutam prahritamattarusha tathapi vaktram
    vilokya sahasa mahishasurena || || drishtvatu devi kupitam bhrukutikarala mudyacchashankasadrishacchavi
    yanna sadyah | pranan mumoca mahishastadativa citram kairjivyate hi kupitantakadarshanena | || ||
    deviprasida parama bhavati bhavaya sadyo vinashayasi kopavati kulani | vijnatametadadhunaiva yadastametat
    nnitam balam suvipulam mahishasurasya || || te sammata janapadeshu dhanani tesham tesham yashamsi
    na ca sidati dharmavargah | dhanyasta eva nibhritatmajabhrityadara yesham sadabhyudayada bhavati prasanna||
    || dharmyani devi sakalani sadaiva karmani nyatyadritah pratidinam sukriti karoti | svargam prayati
    ca tato bhavati prasada llokatraye'pi phalada nanu devi tena || || durge smrita harasi bhiti mashesha
    jantoh svasthaih smrita matimativa shubham dadasi | daridryaduhkhabhayaharini ka tvadanya sarvopakarakaranaya
    sadardracitta || || ebhirhatairjagadupaiti sukham tathaite kurvantu nama narakaya ciraya papam | sangramamrityumadhigamya
    divamprayantu matveti nunamahitanvinihamsi devi || || drishtvaiva kim na bhavati prakaroti bhasma
    sarvasuranarishu yatprahinoshi shastram | lokanprayantu ripavo'pi hi shastraputa ittham matirbhavati
    teshvahi te'shusadhvi || || khadga prabhanikaravisphuranaistadhograih shulagrakantinivahena drisho'suranam
    | yannagata vilayamamshumadindukhanda yogyananam tava viloka yatam tadetat || || durvritta vritta
    shamanam tava devi shilam rupam tathaitadavicintyamatulyamanyaih | viryam ca hantri hritadevaparakramanam
    vairishvapi prakatitaiva daya tvayettham || || kenopama bhavatu te'sya parakramasya rupam ca shatribhaya
    karyatihari kutra | cittekripa samaranishturata ca drishta tvayyeva devi varade bhuvanatraye'pi ||
    || trailokyametadakhilam ripunashanena tratam tvaya samaramurdhani te'pi hatva | nita divam ripugana
    bhayamapyapastam asmakamunmadasuraribhavam namaste || || shulena pahi no devi pahi khadgena cambhike
    | ghantasvanena nah pahi capajyanisvanena ca || || pracyam raksha praticyam ca candike raksha dakshine
    | bhramanenatmashulasya uttarasyam tatheshvari|| || saumyani yani rupani trailokye vicarantite | yani
    catyanta ghorani tairakshasmamstathabhuvam || || khadgashulagadadini yani castrani te'mbike | karapallavasangini
    tairasmanraksha sarvatah || || evam stuta surairdivyaih kusumairnandanodbhavaih | arcita jagatam dhatri
    tatha gandhanu lepanaih || || bhaktya samastaisri shairdivyairdhupaih sudhupita | praha prasadasumukhi
    samastan pranatan suran| || || vriyatam tridashah sarve yadasmatto'bhivanchitam || || bhagavatya kritam
    sarvam na kincidavashishyate | yadayam nihatah shatru rasmakam mahishasurah || || yadicapi varo deya
    stvaya'smakam maheshvari | samsmrita samsmrita tvam no him sethahparamapadah|| || yashca martyah stavairebhistvam
    stoshyatyamalanane | tasya vittarddhivibhavairdhanadaradi sampadam || || vriddaye' smatprasanna tvam
    bhavethah sarvadambhike || || iti prasadita devairjagato'rthe tathatmanah | tathetyuktva bhadrakali
    babhuvantarhita nripa || || ityetatkathitam bhupa sambhuta sa yathapura | devi devasharirebhyo jagatprayahitaishini
    || || punashca gauri dehatsa samudbhuta yathabhavat | vadhaya dushta daityanam tatha shumbhanishumbhayoh
    || || rakshanaya ca lokanam devanamupakarini | tacchri nushva mayakhyatam yathavatkathayamite hrim
    om || || || jaya jaya shri markandeya purane savarnike manvantare devi mahatmye shakradistutirnama
    caturdho'dhyayah samaptam || ahuti hrim jayanti sangayai sayudhayai sashaktikayai saparivarayai savahanayai
    shri mahalakshmyai lakshmi bijadishtayai mahahutim samarpayami namah svaha ||
  devanagari: शक्रादिस्तुतिर्नाम चतुर्धोऽध्यायः ॥ ध्यानं कालाभ्राभां कटाक्षैर् अरि कुल भयदां मौलि बद्धेन्दु
    रेखां शङ्ख चक्रं कृपाणं त्रिशिखमपि करै रुद्वहन्तीं त्रिनेऱ्त्रम् । सिंह स्कन्दाधिरूढां त्रिभुवन मखिलं
    तेजसा पूरयन्तीं ध्याये द्दुर्गां जयाख्यां त्रिदश परिवृतां सेवितां सिद्धि कामैः ॥ ऋषिरुवाच ॥ ॥ शक्रादयः
    सुरगणा निहतेऽतिवीर्ये तस्मिन्दुरात्मनि सुरारिबले च देव्या । तां तुष्टुवुः प्रणतिनम्रशिरोधरांसा वाग्भिः
    प्रहर्षपुलकोद्गमचारुदेहाः ॥ ॥ देव्या यया ततमिदं जगदात्मशक्त्या निःशेषदेवगणशक्तिसमूहमूर्त्या । तामम्बिकामखिलदेवमहर्षिपूज्यां
    भक्त्या नताः स्म विदधातुशुभानि सा नः ॥ ॥ यस्याः प्रभावमतुलं भगवाननन्तो ब्रह्मा हरश्च नहि वक्तुमलं
    बलं च । सा चण्डिकाऽखिल जगत्परिपालनाय नाशाय चाशुभभयस्य मतिं करोतु ॥ ॥ या श्रीः स्वयं सुकृतिनां भवनेष्वलक्ष्मीः
    पापात्मनां कृतधियां हृदयेषु बुद्धिः । श्रद्था सतां कुलजनप्रभवस्य लज्जा तां त्वां नताः स्म परिपालय
    देवि विश्वम् ॥ ॥ किं वर्णयाम तवरूप मचिन्त्यमेतत् किञ्चातिवीर्यमसुरक्षयकारि भूरि । किं चाहवेषु चरितानि
    तवात्भुतानि सर्वेषु देव्यसुरदेवगणादिकेषु । ॥ ॥ हेतुः समस्तजगतां त्रिगुणापि दोषैः न ज्ञायसे हरिहरादिभिरव्यपारा
    । सर्वाश्रयाखिलमिदं जगदंशभूतं अव्याकृता हि परमा प्रकृतिस्त्वमाद्या ॥ ॥ यस्याः समस्तसुरता समुदीरणेन
    तृप्तिं प्रयाति सकलेषु मखेषु देवि । स्वाहासि वै पितृ गणस्य च तृप्ति हेतु रुच्चार्यसे त्वमत एव जनैः
    स्वधाच ॥ ॥ या मुक्तिहेतुरविचिन्त्य महाव्रता त्वं अभ्यस्यसे सुनियतेन्द्रियतत्वसारैः । मोक्षार्थिभिर्मुनिभिरस्तसमस्तदोषै
    र्विद्याऽसि सा भगवती परमा हि देवि ॥ ॥ शब्दात्मिका सुविमलर्ग्यजुषां निधानं मुद्गीथरम्यपदपाठवतां च साम्नाम्
    । देवी त्रयी भगवती भवभावनाय वार्तासि सर्व जगतां परमार्तिहन्त्री ॥ ॥ मेधासि देवि विदिताखिलशास्त्रसारा
    दुर्गाऽसि दुर्गभवसागरसनौरसङ्गा । श्रीः कैट भारिहृदयैककृताधिवासा गौरी त्वमेव शशिमौलिकृत प्रतिष्ठा ॥
    ॥ ईषत्सहासममलं परिपूर्ण चन्द्र बिम्बानुकारि कनकोत्तमकान्तिकान्तम् । अत्यद्भुतं प्रहृतमात्तरुषा तथापि
    वक्त्रं विलोक्य सहसा महिषासुरेण ॥ ॥ दृष्ट्वातु देवि कुपितं भ्रुकुटीकराल मुद्यच्छशाङ्कसदृशच्छवि यन्न
    सद्यः । प्राणान् मुमोच महिषस्तदतीव चित्रं कैर्जीव्यते हि कुपितान्तकदर्शनेन । ॥ ॥ देविप्रसीद परमा भवती
    भवाय सद्यो विनाशयसि कोपवती कुलानि । विज्ञातमेतदधुनैव यदस्तमेतत् न्नीतं बलं सुविपुलं महिषासुरस्य ॥
    ॥ ते सम्मता जनपदेषु धनानि तेषां तेषां यशांसि न च सीदति धर्मवर्गः । धन्यास्त एव निभृतात्मजभृत्यदारा
    येषां सदाभ्युदयदा भवती प्रसन्ना॥ ॥ धर्म्याणि देवि सकलानि सदैव कर्मानि ण्यत्यादृतः प्रतिदिनं सुकृती
    करोति । स्वर्गं प्रयाति च ततो भवती प्रसादा ल्लोकत्रयेऽपि फलदा ननु देवि तेन ॥ ॥ दुर्गे स्मृता हरसि
    भीति मशेश जन्तोः स्वस्थैः स्मृता मतिमतीव शुभां ददासि । दारिद्र्यदुःखभयहारिणि का त्वदन्या सर्वोपकारकरणाय
    सदार्द्रचित्ता ॥ ॥ एभिर्हतैर्जगदुपैति सुखं तथैते कुर्वन्तु नाम नरकाय चिराय पापम् । सङ्ग्राममृत्युमधिगम्य
    दिवम्प्रयान्तु मत्वेति नूनमहितान्विनिहंसि देवि ॥ ॥ दृष्ट्वैव किं न भवती प्रकरोति भस्म सर्वासुरानरिषु
    यत्प्रहिणोषि शस्त्रम् । लोकान्प्रयान्तु रिपवोऽपि हि शस्त्रपूता इत्थं मतिर्भवति तेष्वहि तेऽषुसाध्वी
    ॥ ॥ खड्ग प्रभानिकरविस्फुरणैस्तधोग्रैः शूलाग्रकान्तिनिवहेन दृशोऽसुराणाम् । यन्नागता विलयमंशुमदिन्दुखण्ड
    योग्याननं तव विलोक यतां तदेतत् ॥ ॥ दुर्वृत्त वृत्त शमनं तव देवि शीलं रूपं तथैतदविचिन्त्यमतुल्यमन्यैः
    । वीर्यं च हन्तृ हृतदेवपराक्रमाणां वैरिष्वपि प्रकटितैव दया त्वयेत्थम् ॥ ॥ केनोपमा भवतु तेऽस्य पराक्रमस्य
    रूपं च शतृभय कार्यतिहारि कुत्र । चित्तेकृपा समरनिष्टुरता च दृष्टा त्वय्येव देवि वरदे भुवनत्रयेऽपि
    ॥ ॥ त्रैलोक्यमेतदखिलं रिपुनाशनेन त्रातं त्वया समरमूर्धनि तेऽपि हत्वा । नीता दिवं रिपुगणा भयमप्यपास्तं
    अस्माकमुन्मदसुरारिभवं नमस्ते ॥ ॥ शूलेन पाहि नो देवि पाहि खड्गेन चाम्भिके । घण्टास्वनेन नः पाहि चापज्यानिस्वनेन
    च ॥ ॥ प्राच्यां रक्ष प्रतीच्यां च चण्डिके रक्ष दक्षिणे । भ्रामणेनात्मशूलस्य उत्तरस्यां तथेश्वरी॥ ॥
    सौम्यानि यानि रूपाणि त्रैलोक्ये विचरन्तिते । यानि चात्यन्त घोराणि तैरक्षास्मांस्तथाभुवम् ॥ ॥ खड्गशूलगदादीनि
    यानि चास्त्राणि तेऽम्बिके । करपल्लवसङ्गीनि तैरस्मान्रक्ष सर्वतः ॥ ॥ एवं स्तुता सुरैर्दिव्यैः कुसुमैर्नन्दनोद्भवैः
    । अर्चिता जगतां धात्री तथा गन्धानु लेपनैः ॥ ॥ भक्त्या समस्तैस्रि शैर्दिव्यैर्धूपैः सुधूपिता । प्राह
    प्रसादसुमुखी समस्तान् प्रणतान् सुरान्। ॥ ॥ व्रियतां त्रिदशाः सर्वे यदस्मत्तोऽभिवाञ्छितम् ॥ ॥ भगवत्या
    कृतं सर्वं न किञ्चिदवशिष्यते । यदयं निहतः शत्रु रस्माकं महिषासुरः ॥ ॥ यदिचापि वरो देय स्त्वयाऽस्माकं
    महेश्वरि । संस्मृता संस्मृता त्वं नो हिं सेथाःपरमापदः॥ ॥ यश्च मर्त्यः स्तवैरेभिस्त्वां स्तोष्यत्यमलानने
    । तस्य वित्तर्द्धिविभवैर्धनदारादि सम्पदाम् ॥ ॥ वृद्दयेऽ स्मत्प्रसन्ना त्वं भवेथाः सर्वदाम्भिके ॥ ॥
    इति प्रसादिता देवैर्जगतोऽर्थे तथात्मनः । तथेत्युक्त्वा भद्रकाली बभूवान्तर्हिता नृप ॥ ॥ इत्येतत्कथितं
    भूप सम्भूता सा यथापुरा । देवी देवशरीरेभ्यो जगत्प्रयहितैषिणी ॥ ॥ पुनश्च गौरी देहात्सा समुद्भूता यथाभवत्
    । वधाय दुष्ट दैत्यानां तथा शुम्भनिशुम्भयोः ॥ ॥ रक्षणाय च लोकानां देवानामुपकारिणी । तच्छृ णुष्व मयाख्यातं
    यथावत्कथयामिते ह्रीं ॐ ॥ ॥ ॥ जय जय श्री मार्कण्डेय पुराणे सावर्निके मन्वन्तरे देवि महत्म्ये शक्रादिस्तुतिर्नाम
    चतुर्धोऽध्यायः समाप्तम् ॥ आहुति ह्रीं जयन्ती साङ्गायै सायुधायै सशक्तिकायै सपरिवारायै सवाहनायै श्री
    महालक्ष्म्यै लक्ष्मी बीजादिष्टायै महाहुतिं समर्पयामि नमः स्वाहा ॥
