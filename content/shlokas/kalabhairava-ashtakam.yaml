id: kalabhairava-ashtakam
category: stotram
name:
  english: Kalabhairava Ashtakam
content:
  english: shekharam kripakaram | naradadi vanditam digambaram kashikapuradhinatha kalabhairavam bhaje
    || bhasvaram bhavabdhitarakam param nilakantha dayakam trilocanam | kalakala maksharam kashikapuradhinatha
    kalabhairavam bhaje || maksharam niramayam | bhimavikramam prabhum vicitra tandava priyam kashikapuradhinatha
    kalabhairavam bhaje || vigraham bhaktavatsalam sthiram samastaloka kashikapuradhinatha kalabhairavam
    bhaje || palakam tvadharmamarga nashakam dayakam vibhum | svarnavarna kashikapuradhinatha kalabhairavam
    bhaje || daivatam niranjanam | mrityudarpa kashikapuradhinatha kalabhairavam bhaje || dharam kashikapuradhinatha
    kalabhairavam bhaje || kovidam puratanam jagatpatim kashikapuradhinatha kalabhairavam bhaje || ||
    kalabhairavashtakam pathanti ye manoharam jnanamukti te prayanti kalabhairavanghri sannidhim dhruvam
    || iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah
    kritau shri kalabhairavashtakam sampurnam |
  devanagari: शेखरं कृपाकरम् । नारदादि वन्दितं दिगम्बरं काशिकापुराधिनाथ कालभैरवं भजे ॥ भास्वरं भवब्धितारकं
    परं नीलकण्ठ दायकं त्रिलोचनम् । कालकाल मक्षरं काशिकापुराधिनाथ कालभैरवं भजे ॥ मक्षरं निरामयम् । भीमविक्रमं
    प्रभुं विचित्र ताण्डव प्रियं काशिकापुराधिनाथ कालभैरवं भजे ॥ विग्रहं भक्तवत्सलं स्थिरं समस्तलोक काशिकापुराधिनाथ
    कालभैरवं भजे ॥ पालकं त्वधर्ममार्ग नाशकं दायकं विभुम् । स्वर्णवर्ण काशिकापुराधिनाथ कालभैरवं भजे ॥ दैवतं
    निरञ्जनम् । मृत्युदर्प काशिकापुराधिनाथ कालभैरवं भजे ॥ धरं काशिकापुराधिनाथ कालभैरवं भजे ॥ कोविदं पुरातनं
    जगत्पतिं काशिकापुराधिनाथ कालभैरवं भजे ॥ ॥ कालभैरवाष्टकं पठन्ति ये मनोहरं ज्ञानमुक्ति ते प्रयान्ति
    कालभैरवाङ्घ्रि सन्निधिं ध्रुवम् ॥ इति श्रीमत्परमहंसपरिव्राजकाचर्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य
    श्रीमच्छङ्करभगवतः कृतौ श्री कालभैरवाष्टकं सम्पूर्णम् ।
