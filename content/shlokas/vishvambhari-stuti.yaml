id: vishvambhari-stuti
category: stotram
name:
  english: Vishvambhari Stuti
content:
  english: vishvambhari akhila vishva tani janeta vidya dhari vadanama vasajo vidhata durbuddhine dura
    kari sadabuddhi apo mama pahi om bhagavati bhava duhkha kapo || || bhulo padayi bhavarane bhataku
    bhavani sujhe nahim lagira koi disha javani bhase bhayankara vali mana na utapo mama pahi om bhagavati
    bhava duhkha kapo || || a rankane ugarava nathi koi aro janmanda chu janani hu grahi bala taro na
    shu suno bhagavati shishu na vilapo mama pahi om bhagavati bhava duhkha kapo || || ma karma janma
    kathani karata vicaru a srushtima tuja vina nathi koi maru kone kahu kathana yoga tano balapo mama
    pahi om bhagavati bhava duhkha kapo || || huvo kama krodha mada moha thaki chakelo adambare ati ghano
    madathi bakelo doshom thaki dushita na kari mafa papo mama pahi om bhagavati bhava duhkha kapo ||
    || na shashtrana shravana nu payapana kidhu na mantra ke stuti katha nathi kai kidhu shraddha dhari
    nathi kara tava nama japo mama pahi om bhagavati bhava duhkha kapo || || re re bhavani bahu bhula
    thi che mari a javoindagi thi mane atishe akari doshom prajali sagala tava chapa chapo mama pahi om
    bhagavati bhava duhkha kapo || || khali na koi sthala che vina apa dharo brahmandama anu anu mahi
    vasa taro shaktina mapa ganava aganita mapom mama pahi om bhagavati bhava duhkha kapo || || pape prapanca
    karava badhi vate puro khoto kharo bhagavati pana hu~ tamaro jadyandhakara dura sadabudhhi apo mama
    pahi om bhagavati bhava duhkha kapo || || shikhe sune rasika candaja eka citte tena thaki vividhah
    tapa taleka cite vadhe vishesha vali amba tana pratapo mama pahi om bhagavati bhava duhkha kapo ||
    || shri sadaguru sharanama rahine bhaju chu ratri dine bhagavati tujane bhaju chu sadabhakta sevaka
    tana paritapa chapo mama pahi om bhagavati bhava duhkha kapo || || antara vishe adhika urmi tata bhavani
    g vo stuti tava bale namine mrigani samsarana sakala roga samula kapo mama pahi om bhagavati bhava
    duhkha kapo ||
  devanagari: विश्वम्भरी अखिल विश्व तनी जनेता विद्या धरी वदनमा वसजो विधाता दुर्बुद्धिने दूर करी सदबुद्धि
    आपो माम पाहि ॐ भगवती भव दुःख कापो ॥ ॥ भूलो पडयी भवरने भटकू भवानी सूझे नहीं लगिर कोई दिशा जवानी भासे
    भयङ्कर वाली मन ना उतापो माम पाहि ॐ भगवती भव दुःख कापो ॥ ॥ आ रङ्कने उगरावा नथी कोई आरो जन्माण्ड छू
    जननी हु ग्रही बाल तारो ना शु सुनो भगवती शिशु ना विलापो माम पाहि ॐ भगवती भव दुःख कापो ॥ ॥ मा कर्म जन्मा
    कथनी करता विचारू आ स्रुष्टिमा तुज विना नथी कोई मारू कोने कहू कथन योग तनो बलापो माम पाहि ॐ भगवती भव
    दुःख कापो ॥ ॥ हूवो काम क्रोध मद मोह थकी छकेलो आदम्बरे अति घनो मदथी बकेलो दोषों थकी दूषित ना करी माफ़
    पापो माम पाहि ॐ भगवती भव दुःख कापो ॥ ॥ ना शाश्त्रना श्रवण नु पयपान किधू ना मन्त्र के स्तुति कथा नथी
    काई किधू श्रद्धा धरी नथी करा तव नाम जापो माम पाहि ॐ भगवती भव दुःख कापो ॥ ॥ रे रे भवानी बहु भूल थी
    छे मारी आ जवोइन्दगी थी मने अतिशे अकारि दोषों प्रजाली सगला तवा छाप छापो माम पाहि ॐ भगवती भव दुःख कापो
    ॥ ॥ खाली न कोई स्थल छे विण आप धारो ब्रह्माण्डमा अणु अणु महि वास तारो शक्तिन माप गणवा अगणीत मापों माम
    पाहि ॐ भगवती भव दुःख कापो ॥ ॥ पापे प्रपञ्च करवा बधी वाते पुरो खोटो खरो भगवती पण हूँ तमारो जद्यान्धकार
    दूर सदबुध्ही आपो माम पाहि ॐ भगवती भव दुःख कापो ॥ ॥ शीखे सुने रसिक चन्दज एक चित्ते तेना थकी विविधः
    ताप तलेक चिते वाधे विशेष वली अम्बा तना प्रतापो माम पाहि ॐ भगवती भव दुःख कापो ॥ ॥ श्री सदगुरु शरणमा
    रहीने भजु छू रात्री दिने भगवती तुजने भजु छू सदभक्त सेवक तना परिताप छापो माम पाहि ॐ भगवती भव दुःख कापो
    ॥ ॥ अन्तर विशे अधिक उर्मी तता भवानी ग् वो स्तुति तव बले नमिने मृगानी संसारना सकल रोग समूल कापो माम
    पाहि ॐ भगवती भव दुःख कापो ॥
