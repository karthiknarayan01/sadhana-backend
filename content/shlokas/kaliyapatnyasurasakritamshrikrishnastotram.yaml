id: kaliyapatnyasurasakritamshrikrishnastotram
category: stotram
name:
  english: kaliyapatnyasurasakritamshrikrishnastotram
  devanagari: कालियपत्न्यासुरसाकृतंश्रीकृष्णस्तोत्रम्
content:
  english: shravanavishayamudha stotumicchami kim tvam || 21|| shayano ratnaparyanke ratnabhushanabhushitah
    | ratnabhushanabhushango radhavakshasi samsthitah || 22|| candanokshitasarvangah smerananasaroruhah
    | prodyatpremarasambhodhau nimagnah satatam sukhat || 23|| mallikamalatimalajalaih shobhitashekharah
    | parijataprasunanam gandhamoditamanasah || 24|| pumskokilakaladhvanairbhramaradhvanisamyutaih | kusumeshu
    vikarena pulakankitavigrahah || 25|| priyapradattatambulam bhuktavanyah sada muda | veda ashakta yam
    stotum jadibhuta vicakshanah || 26|| tamanirvacaniyam ca kim staumi nagavallabha | vande'ham tvatpadambhojam
    brahmeshasheshasevitam || 27|| lakshmisarasvatidurga jahnavi vedamatribhih | sevitam siddhasanghaishca
    munindrairmanubhih sada || 28|| nishkaranayakhilakaranaya sarveshvarayapi paratparaya | svayamprakashaya
    paravaraya paravaranamadhipaya te namah || 29|| he krishna he krishna surasuresha brahmesha sheshesha
    prajapatisha | munisha manvisha caracaresha siddhisha siddhesha ganesha pahi || 30|| dharmesha dharmisha
    shubhashubhesha vedesha vedeshvanirupitashca | sarvesha sarvatmaka sarvabandho jivisha jiveshvara
    pahi matprabhum || 31|| ityevam stavanam kritva bhaktinamratmakandhara | vidhritya caranambhojam tasthau
    nageshavallabha || 32|| nagapatnikritam stotram trisandhyam yah pathennarah | sarvapapatpramuktastu
    yatyante shrihareh padam || 33|| iha loke harerbhaktimante dasyam labheddhruvam | labhate parshado
    bhutva salokyadicatushtayam || 34|| iti shribrahmavaivartapurane shrikrishnajanmakhande purve ekonavimshadhyayantargatam
    vipraih kaliyapatnya surasaya kritam shrikrishnastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: श्रवणविषयमूढा स्तोतुमिच्छामि किं त्वाम् ॥ २१॥ शयानो रत्नपर्यङ्के रत्नभूषणभूषितः । रत्नभूषणभूषाङ्गो
    राधावक्षसि संस्थितः ॥ २२॥ चन्दनोक्षितसर्वाङ्गः स्मेराननसरोरुहः । प्रोद्यत्प्रेमरसाम्भोधौ निमग्नः सततं
    सुखात् ॥ २३॥ मल्लिकामालतीमालाजालैः शोभितशेखरः । पारिजातप्रसूनानां गन्धामोदितमानसः ॥ २४॥ पुंस्कोकिलकलध्वानैर्भ्रमरध्वनिसंयुतैः
    । कुसुमेषु विकारेण पुलकाङ्कितविग्रहः ॥ २५॥ प्रियाप्रदत्तताम्बूलं भुक्तवान्यः सदा मुदा । वेदा अशक्ता
    यं स्तोतुं जडीभूता विचक्षणाः ॥ २६॥ तमनिर्वचनीयं च किं स्तौमि नागवल्लभा । वन्देऽहं त्वत्पदाम्भोजं ब्रह्मेशशेषसेवितम्
    ॥ २७॥ लक्ष्मीसरस्वतीदुर्गा जाह्नवी वेदमातृभिः । सेवितं सिद्धसङ्घैश्च मुनीन्द्रैर्मनुभिः सदा ॥ २८॥
    निष्कारणायाखिलकारणाय सर्वेश्वरायापि परात्पराय । स्वयम्प्रकाशाय परावराय परावराणामधिपाय ते नमः ॥ २९॥
    हे कृष्ण हे कृष्ण सुरासुरेश ब्रह्मेश शेषेश प्रजापतीश । मुनीश मन्वीश चराचरेश सिद्धीश सिद्धेश गणेश पाहि
    ॥ ३०॥ धर्मेश धर्मीश शुभाशुभेश वेदेश वेदेष्वनिरूपितश्च । सर्वेश सर्वात्मक सर्वबन्धो जीवीश जीवेश्वर
    पाहि मत्प्रभुम् ॥ ३१॥ इत्येवं स्तवनं कृत्वा भक्तिनम्रात्मकन्धरा । विधृत्य चरणाम्भोजं तस्थौ नागेशवल्लभा
    ॥ ३२॥ नागपत्नीकृतं स्तोत्रं त्रिसन्ध्यं यः पठेन्नरः । सर्वपापात्प्रमुक्तस्तु यात्यन्ते श्रीहरेः पदम्
    ॥ ३३॥ इह लोके हरेर्भक्तिमन्ते दास्यं लभेद्ध्रुवम् । लभते पार्षदो भूत्वा सालोक्यादिचतुष्टयम् ॥ ३४॥
    इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे पूर्वे एकोनविंशाध्यायान्तर्गतं विप्रैः कालियपत्न्या
    सुरसया कृतं श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
