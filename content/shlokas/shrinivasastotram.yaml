id: shrinivasastotram
category: stotram
name:
  english: shrinivasastotram
  devanagari: श्रीनिवासस्तोत्रम्
content:
  english: rasatalantarvivashabhivishtam | uddharanartham ca varaha asiccaturbhujam tam sharanam prapadye
    || 10|| nakhairvaraistikshnamukhairhiranyamaratimamarditasarvasattvam | vidarayamasa ca yo nrisimho
    hiranyagarbham sharanam prapadye || 11|| mahanma hatvendriyapancabhutatanmatramatraprakritih purani
    | yatah prasuta purushastadatma tamatmanatham sharanam prapadye || 12|| pura ya etastakalam babhuva
    yenapi tadyatra ca linametat | astam yato'nugrahanigrahau ca tam shrinivasam sharanam prapadye ||
    13|| niramayam nishcalanirarashinikashasadrupamayam mahastat | niyantu nirbhatri nihantu nityam nidrantamenam
    sharanam prapadye || 14|| jaganti yah sthavarajangamani samhritya sarvanyudareshayani | ekarnavantarvatapatratalpe
    svapityanantam sharanam prapadye || 15|| nirastaduhkhaughamatindriyam tam nishkaranam nishkalamaprameyam
    | anoraniyamsamanantamantaratmanubhavam sharanam prapadye || 16|| saptambujiranjakarajahasam saptarnavisamsritikarnadharam
    | saptashvabimbashvahiranmayam tam saptarcirangam sharanam prapadye || 17|| niragasam nirmalapurnabimbam
    nishithininathanibhananabham | nirnitanidram nigamantanityam nihshreyasam tam sharanam prapadye ||
    18|| niramayam nirmalamaprameyam nijantararopitavishvabimbam | nissimakalyanagunatmabhutim nidhim
    nidhinam sharanam prapadye || 19|| tvakcarmamamsasthyasrigashrumutrashleshmantravitcchuklasamuccayeshu
    | deheshvasareshu na me sprihaisha dhruvam dhruvam tvam bhagavan prasida || 20|| govinda keshava janardana
    vasudeva vishvesha vishva madhusudana vishvarupa shripadmanabha purushottama pushkaraksha narayanacyuta
    nrisimha namo namaste || 21|| devah samastamarayogimukhyah gandharvavidyadharakinnarashca | yatpadamulam
    satatam namanti tam narasimham sharanam prapadye || 22|| vedan samastan khalu shastragarbhan ayuh
    sthiram kirtimativa lakshmim | yasya prasadat purusha labhante tam narasimham sharanam prapadye ||
    23|| brahma shivastvam purushottamashca narayano'sau marutampatishca | candarkavavyagnimarudganashca
    tvameva nanyat satatam nato'smi || 24|| srashta ca nityam jagatamadhishah trata ca hanta vibhuraprameyah
    ekastvameva trividha vibhinnah tvam simhamurtim satatam nato'smi || 25|| || harih om shubhamastu ||
    || iti shrinivasastotram sampurnam ||
  devanagari: रसातलान्तर्विवशाभिविष्टाम् । उद्धारणार्थं च वराह आसीच्चतुर्भुजं तं शरणं प्रपद्ये ॥ १०॥ नखैर्वरैस्तीक्ष्णमुखैर्हिरण्यमरातिमामर्दितसर्वसत्त्वम्
    । विदारयामास च यो नृसिंहो हिरण्यगर्भं शरणं प्रपद्ये ॥ ११॥ महन्म हत्वेन्द्रियपञ्चभूततन्मात्रमात्रप्रकृतिः
    पुराणी । यतः प्रसूता पुरुषास्तदात्मा तमात्मनाथं शरणं प्रपद्ये ॥ १२॥ पुरा य एतस्तकलं बभूव येनापि तद्यत्र
    च लीनमेतत् । आस्तां यतोऽनुग्रहनिग्रहौ च तं श्रीनिवासं शरणं प्रपद्ये ॥ १३॥ निरामयं निश्चलनीरराशिनीकाशसद्रूपमयं
    महस्तत् । नियन्तु निर्भातृ निहन्तु नित्यं निद्रान्तमेनं शरणं प्रपद्ये ॥ १४॥ जगन्ति यः स्थावरजङ्गमानि
    संहृत्य सर्वाण्युदरेशयानि । एकार्णवान्तर्वटपत्रतल्पे स्वपित्यनन्तं शरणं प्रपद्ये ॥ १५॥ निरस्तदुःखौघमतीन्द्रियं
    तं निष्कारणं निष्कलमप्रमेयम् । अणोरणीयांसमनन्तमन्तरात्मानुभावं शरणं प्रपद्ये ॥ १६॥ सप्ताम्बुजीरञ्जकराजहासं
    सप्तार्णवीसंसृतिकर्णधारम् । सप्ताश्वबिम्बाश्वहिरण्मयं तं सप्तार्चिरङ्गं शरणं प्रपद्ये ॥ १७॥ निरागसं
    निर्मलपूर्णबिम्बं निशीथिनीनाथनिभाननाभम् । निर्णीतनिद्रं निगमान्तनित्यं निःश्रेयसं तं शरणं प्रपद्ये
    ॥ १८॥ निरामयं निर्मलमप्रमेयं निजान्तरारोपितविश्वबिम्बम् । निस्सीमकल्याणगुणात्मभूतिं निधिं निधीनां
    शरणं प्रपद्ये ॥ १९॥ त्वक्चर्ममांसास्थ्यसृगश्रुमूत्रश्लेष्मान्त्रविट्च्छुक्लसमुच्चयेषु । देहेष्वसारेषु
    न मे स्पृहैषा ध्रुवं ध्रुवं त्वं भगवन् प्रसीद ॥ २०॥ गोविन्द केशव जनार्दन वासुदेव विश्वेश विश्व मधुसूदन
    विश्वरूप श्रीपद्मनाभ पुरुषोत्तम पुष्कराक्ष नारायणाच्युत नृसिंह नमो नमस्ते ॥ २१॥ देवाः समस्तामरयोगिमुख्याः
    गन्धर्वविद्याधरकिन्नराश्च । यत्पादमूलं सततं नमन्ति तं नारसिंहं शरणं प्रपद्ये ॥ २२॥ वेदान् समस्तान्
    खलु शास्त्रगर्भान् आयुः स्थिरं कीर्तिमतीव लक्ष्मीम् । यस्य प्रसादात् पुरुषा लभन्ते तं नारसिंहं शरणं
    प्रपद्ये ॥ २३॥ ब्रह्मा शिवस्त्वं पुरुषोत्तमश्च नारायणोऽसौ मरुताम्पतिश्च । चन्दार्कवाव्यग्निमरुद्गणाश्च
    त्वमेव नान्यत् सततं नतोऽस्मि ॥ २४॥ स्रष्टा च नित्यं जगतामधीशः त्राता च हन्ता विभुरप्रमेयः एकस्त्वमेव
    त्रिविधा विभिन्नः त्वां सिंहमूर्तिं सततं नतोऽस्मि ॥ २५॥ ॥ हरिः ॐ शुभमस्तु ॥ ॥ इति श्रीनिवासस्तोत्रं
    सम्पूर्णम् ॥
