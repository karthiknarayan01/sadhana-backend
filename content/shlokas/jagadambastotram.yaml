id: jagadambastotram
category: stotram
name:
  english: jagadambastotram
  devanagari: जगदम्बास्तोत्रम्
content:
  english: shrijagadambastotram varadapuranivasinim niravadhisukharupinim | nigamavanaviharinim munijanajananim
    bhaje || 1|| vimalahridayagahinim vimalamatisuvasinim | sakalavibhavadharinim munijanajananim bhaje
    || 2|| vimalabhajanasevinim tvamiti tadasi bodhinim | bhajakasujanatoshinim munijanajananim bhaje
    || 3|| cidamalatanushobhinim sukritikusumamalinim | sakalasugunasundarim munijanajananim bhaje ||
    4|| nijasujanavibhushanim vimalaviratidayinim | niravadhisukhakarinim munijanajananim bhaje || 5||
    bhajakabhavavinashinim vishayam sukhanivarinim | sakalabhayavighatinim munijanajananim bhaje || 6||
    suranaraparipalinimamritasukhasuvarshinim | kujanakumatinashinim munijanajananim bhaje || 7|| ashubhapadanivarinimashubhagatinirodhinim
    | sakalashubhavivardhinim munijanajananim bhaje || 8|| nigamasugamadharminim shrutikritijanatarinim
    | nigamamatavitarinim munijanajananim bhaje || 9|| acalapadavidhayinimavicalasukhadarshinim | sakalajanahitaishinim
    munijanajananim bhaje || 10|| shridharena kritam stotram vijaya dashamidine | ye pathanti muda bhaktya
    te nara mokshabhaginah || 11|| iti shrimat paramahamsaparivrajakacarya sadguru bhagavan shridharasvamimaharajaviracitam
    shrijagadambastotram sampurnam | racanasthanam
  devanagari: श्रीजगदम्बास्तोत्रम् वरदपुरनिवासिनीं निरवधिसुखरूपिणीम् । निगमवनविहारिणीं मुनिजनजननीं भजे
    ॥ १॥ विमलहृदयगाहिनीं विमलमतिसुवासिनीम् । सकलविभवधारिणीं मुनिजनजननीं भजे ॥ २॥ विमलभजनसेविनीं त्वमिति
    तदसि बोधिनीम् । भजकसुजनतोषिणीं मुनिजनजननीं भजे ॥ ३॥ चिदमलतनुशोभिनीं सुकृतिकुसुममालिनीम् । सकलसुगुणसुन्दरीं
    मुनिजनजननीं भजे ॥ ४॥ निजसुजनविभूषणीं विमलविरतिदायिनीम् । निरवधिसुखकारिणीं मुनिजनजननीं भजे ॥ ५॥ भजकभवविनाशिनीं
    विषयं सुखनिवारिणीम् । सकलभयविघातिनीं मुनिजनजननीं भजे ॥ ६॥ सुरनरपरिपालिनीममृतसुखसुवर्षिणीम् । कुजनकुमतिनाशिनीं
    मुनिजनजननीं भजे ॥ ७॥ अशुभपदनिवारिणीमशुभगतिनिरोधिनीम् । सकलशुभविवर्धिनीं मुनिजनजननीं भजे ॥ ८॥ निगमसुगमधर्मिणीं
    श्रुतिकृतिजनतारिणीम् । निगममतवितारिणीं मुनिजनजननीं भजे ॥ ९॥ अचलपदविधायिनीमविचलसुखदर्शिनीम् । सकलजनहितैषिणीं
    मुनिजनजननीं भजे ॥ १०॥ श्रीधरेण कृतं स्तोत्रं विजया दशमीदिने । ये पठन्ति मुदा भक्त्या ते नरा मोक्षभागिनः
    ॥ ११॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरु भगवान् श्रीधरस्वामीमहाराजविरचितं श्रीजगदम्बास्तोत्रं
    सम्पूर्णम् । रचनास्थानं
