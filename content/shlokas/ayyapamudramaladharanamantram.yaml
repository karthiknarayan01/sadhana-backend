id: ayyapamudramaladharanamantram
category: mantra
name:
  english: ayyapamudramaladharanamantram
  devanagari: अय्यपमुद्रमालाधारणमन्त्रम्
content:
  english: shrimadayyappamudramaladharanamantram jnanamudram shastramudram gurumudram namamyaham | vanamudram
    shuddhamudram rudramudram namamyaham || 1|| shantamudram satyamudram vratamudram namamyaham | shabaryashramasatyena
    mudra patu sadapi mam || 2|| gurudakshinaya purvam tasyanugrahakarine | sharanagatamudrakhyam tvanmudram
    dharayamyaham || 3|| cinmudram khecarimudram bhadramudram namamyaham | shabaryacalamudrayai namastubhyam
    namo namah || 4|| iti shrimadayyappamudramaladharanamantram sampurnam |
  devanagari: श्रीमदय्यप्पमुद्रमालाधारणमन्त्रम् ज्ञानमुद्रां शास्त्रमुद्रां गुरुमुद्रां नमाम्यहम् । वनमुद्रां
    शुद्धमुद्रां रुद्रमुद्रां नमाम्यहम् ॥ १॥ शान्तमुद्रां सत्यमुद्रां व्रतमुद्रां नमाम्यहम् । शबर्याश्रमसत्येन
    मुद्रा पातु सदापि माम् ॥ २॥ गुरुदक्षिणया पूर्वं तस्यानुग्रहकारिणे । शरणागतमुद्राख्यं त्वन्मुद्रां
    धारयाम्यहम् ॥ ३॥ चिन्मुद्रां खेचरीमुद्रां भद्रमुद्रां नमाम्यहम् । शबर्याचलमुद्रायै नमस्तुभ्यं नमो
    नमः ॥ ४॥ इति श्रीमदय्यप्पमुद्रमालाधारणमन्त्रं सम्पूर्णम् ।
