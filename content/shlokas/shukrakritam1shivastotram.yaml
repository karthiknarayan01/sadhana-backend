id: shukrakritam1shivastotram
category: stotram
name:
  english: shukrakritam1shivastotram
  devanagari: शुक्रकृतं१शिवस्तोत्रम्
content:
  english: namo'stu shitikanthaya kapardine ca shambhave || 60|| midhushe vasuviryaya rudraya rohitaya
    te | girishaya'rkanetraya takshakakridanaya ca || 61|| pinakine ca shvetaya bhimayograya te namah
    | mahadevaya sharvaya mrigavyadhaya te namah || 62|| sthanave bahurupaya trinetraya ca mrityave |
    tryambakaya namaste'stu shankaraya shivaya ca || 63|| dhyanine vyapine sadyojatayeshaya te namah |
    vamadevaya ca krittivastraya prabhave namah || 64|| bhaganetravihantre te pashunam pataye namah |
    bhutanam pataye pushahantaghnaya ca te namah || 65|| arkarupaya ca nyagrodhaya kalaya te namah | sankarshanaya
    rudraya vahnaye yogine namah || 66|| prithivyadyashtarupaya lingaya'lingine namah | parvatipataye
    tubhyam gopataye namo namah || 67|| maheshaya ca damaruvaditraya ca te namah | kailasasthaya devanam
    stutyaya te namo namah || 68|| mahavaishnavasannamne gananam pataye namah | brahmishthaya ca shukrasya
    pitre bhuyo namo namah || 69|| iti shrilakshminarayaniyasamhitayah dvaparayugasantanatmakasya tritiyakhande
    100
  devanagari: नमोऽस्तु शितिकण्ठाय कपर्दिने च शम्भवे ॥ ६०॥ मीढुषे वसुवीर्याय रुद्राय रोहिताय ते । गिरीशायाऽर्कनेत्राय
    तक्षकक्रीडनाय च ॥ ६१॥ पिनाकिने च श्वेताय भीमायोग्राय ते नमः । महादेवाय शर्वाय मृगव्याधाय ते नमः ॥
    ६२॥ स्थाणवे बहुरूपाय त्रिनेत्राय च मृत्यवे । त्र्यम्बकाय नमस्तेऽस्तु शङ्कराय शिवाय च ॥ ६३॥ ध्यानिने
    व्यापिने सद्योजातायेशाय ते नमः । वामदेवाय च कृत्तिवस्त्राय प्रभवे नमः ॥ ६४॥ भगनेत्रविहन्त्रे ते पशूनां
    पतये नमः । भूतानां पतये पूषाहन्तघ्नाय च ते नमः ॥ ६५॥ अर्करूपाय च न्यग्रोधाय कालाय ते नमः । सङ्कर्षणाय
    रुद्राय वह्नये योगिने नमः ॥ ६६॥ पृथिव्याद्यष्टरूपाय लिङ्गायाऽलिङ्गिने नमः । पार्वतीपतये तुभ्यं गोपतये
    नमो नमः ॥ ६७॥ महेशाय च डमरूवादित्राय च ते नमः । कैलासस्थाय देवानां स्तुत्याय ते नमो नमः ॥ ६८॥ महावैष्णवसन्नाम्ने
    गणानां पतये नमः । ब्रह्मिष्ठाय च शुक्रस्य पित्रे भूयो नमो नमः ॥ ६९॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः
    द्वापरयुगसन्तानात्मकस्य तृतीयखण्डे १००
