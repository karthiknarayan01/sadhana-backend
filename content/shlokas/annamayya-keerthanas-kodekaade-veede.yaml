id: annamayya-keerthanas-kodekaade-veede
category: stotram
name:
  english: Annamayya Keerthanas Kodekaade Veede
content:
  english: adi pallavi kodèkadè vidè vidè govindudu kudè iddaru satula govindudu || gòllètala valapincè
    govindudu kòllaladè vènnalu govindudu | gulla sanku~jakramula govindudu gòllavarinta pèrigè govindudu
    || kodèkadè vidè vidè govindudu kolace pasulagacè govindudu kulagummè kamsuni govindudu | golayai
    vela kòndèttè govindudu gulèpusatula ma dèccè govindudu || kodèkadè vidè vidè govindudu kundanapu
    celatodi govindudu gòndulu sandulu durè govindudu | kundani shrivenkatadri govindudu gòndi ma dosè
    nasurala govindudu || kodèkadè vidè vidè govindudu kudè iddaru satula govindudu ||
  devanagari: आदि पल्लवि कोडॆकाडॆ वीडॆ वीडॆ गोविन्दुडु कूडॆ इद्दरु सतुल गोविन्दुडु ॥ गॊल्लॆतल वलपिञ्चॆ
    गोविन्दुडु कॊल्ललाडॆ वॆन्नलु गोविन्दुडु । गुल्ल सङ्कुँजक्रमुल गोविन्दुडु गॊल्लवारिण्ट पॆरिगॆ गोविन्दुडु
    ॥ कोडॆकाडॆ वीडॆ वीडॆ गोविन्दुडु कोलचे पसुलगाचॆ गोविन्दुडु कूलगुम्मॆ कंसुनि गोविन्दुडु । गोलयै वेल
    कॊण्डॆत्तॆ गोविन्दुडु गूलॆपुसतुल म दॆच्चॆ गोविन्दुडु ॥ कोडॆकाडॆ वीडॆ वीडॆ गोविन्दुडु कुन्दनपु चेलतोडि
    गोविन्दुडु गॊन्दुलु सन्दुलु दूरॆ गोविन्दुडु । कुन्दनि श्रीवेङ्कटाद्रि गोविन्दुडु गॊन्दि म दोसॆ नसुरल
    गोविन्दुडु ॥ कोडॆकाडॆ वीडॆ वीडॆ गोविन्दुडु कूडॆ इद्दरु सतुल गोविन्दुडु ॥
