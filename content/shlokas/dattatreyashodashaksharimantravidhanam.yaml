id: dattatreyashodashaksharimantravidhanam
category: mantra
name:
  english: dattatreyashodashaksharimantravidhanam
  devanagari: दत्तात्रेयषोडशाक्षरीमन्त्रविधानम्
content:
  english: om asya shridattashodashaksharimantrasya bhagavan sadashiva rishih | gayatri chandah | shridattatreyo
    devata | om bijam | svaha shaktih | dattatreyaya kilakam | caturvidhapurusharthapraptyarthe jape viniyogah
    || rishyadinyasah | sadashivarishaye namah shirasi | gayatrichandase namah mukhe | shridattatreyadevatayai
    namah hridaye | om bijaya namah guhye | svaha shaktaye namah padayoh | dattatreyaya kilakaya namah
    nabhau | caturvidhapurusharthapraptyarthe viniyogaya namah karasampute || prathama karanyasah | om
    angushthabhyam namah | aim tarjanibhyam namah | krom madhyamabhyam namah | klim anamikabhyam namah
    | klum kanishthikabhyam namah | ham him hum sauh dattatreyaya svaha karatalakaraprishthabhyam namah
    || prathama hridayadi
  devanagari: ॐ अस्य श्रीदत्तषोडशाक्षरीमन्त्रस्य भगवान् सदाशिव ऋषिः । गायत्री छन्दः । श्रीदत्तात्रेयो
    देवता । ॐ बीजम् । स्वाहा शक्तिः । दत्तात्रेयाय कीलकम् । चतुर्विधपुरुषार्थप्राप्त्यर्थे जपे विनियोगः
    ॥ ऋष्यादिन्यासः । सदाशिवऋषये नमः शिरसि । गायत्रीछन्दसे नमः मुखे । श्रीदत्तात्रेयदेवतायै नमः हृदये
    । ॐ बीजाय नमः गुह्ये । स्वाहा शक्तये नमः पादयोः । दत्तात्रेयाय कीलकाय नमः नाभौ । चतुर्विधपुरुषार्थप्राप्त्यर्थे
    विनियोगाय नमः करसम्पुटे ॥ प्रथम करन्यासः । ॐ अङ्गुष्ठाभ्यां नमः । ऐं तर्जनीभ्यां नमः । क्रों मध्यमाभ्यां
    नमः । क्लीं अनामिकाभ्यां नमः । क्लूं कनिष्ठिकाभ्यां नमः । हां हीं हूं सौः दत्तात्रेयाय स्वाहा करतलकरपृष्ठाभ्यां
    नमः ॥ प्रथम हृदयादि
