id: varadaganeshakavacam
category: kavacha
name:
  english: varadaganeshakavacam
  devanagari: वरदगणेशकवचम्
content:
  english: vajravidyadisiddhyarthe mahaganapativajrapanjarakavacapathe viniyogah | dhyanam | vighnesham
    vishvavandyam suvipulayashasam lokarakshapradaksham sakshat sarvapadasu prashamanasumatim parvatipranasunum
    | prayah sarvasurendraih sasuramuniganaih sadhakaih pujyamanam karunyenantarayamitabhayashamanam vighnarajam
    namami || 2|| omshrimhrimgam shirah patu mahaganapatih prabhuh | vinayako lalatam me vighnarajo bhruvau
    mama || 3|| patu netre ganadhyaksho nasikam me gajananah | shruti me'vatu herambo gandau modakashanah
    || 4|| dvaimataro mukham patu cadharau patvarindam | dantan mamaikadanto'vyad vakratundo'vatad rasam
    || 5|| gangeyo me galam patu skandhau simhasano'vatu | vighnantako bhujau patu hastau mushakavahanah
    || 6|| uru mamavatannityam devastripuraghatanah | hridayam me kumaro'vyanjayantah parshvayugmakam
    || 7|| pradyumno me'vatat prishtham nabhim shankaranandanah | katim nandiganah patu shishnam vireshvaro'vatu
    || 8|| medhre me'vatu saubhagyo bhringiriti ca guhyakam | viratako'vataduru janu me pushpadantakah
    || 9|| janghe mama vikarto'vyad gulphavantyagano'vatu | padau cittaganah patu padadho lohito'vatu
    || 10|| padaprishtham sundaro'vyad nupuradhyo vapurmama | vicaro jatharam patu bhutani cograrupakah
    || 11|| shirasah padaparyantam vapuh suptagano'vatu | padadimurdhaparyantam vapuh patu vinartakah
    || 12|| vismaritam tu yat sthanam ganeshastat sadavatu | purve mam hrim karalo'vyadagreye vikaralakah
    || 13|| dakshine patu samharo nairrite rurubhairavah | pashcime mam mahakalo vayau kalagnibhairavah
    || 14|| uttare mam sitasyu'vyadaishanyamasitatmakah | prabhate shatapatro'vyat sahasrarastu madhyame
    || 15|| dantamala dinante'vyannishi patram sadavatu | kalasho mam nishithe'vyannishante parashustatha
    || 16|| sarvatra sarvada patu shankhayugmam ca madvapuh | omom rajakule hahaum ranabhaye hrimhrim
    kudyute'vatat shrimshrim shatrugrihe shashaum jalabhaye klimklim vanante'vatu | glaumglumglaimglamgum
    satvabhitishu mahavyadhyartishu glaumgagaum nityam yakshapishacabhutaphanishu glaumgam ganesho'vatu
    || 17|| itidam kavacam guhyam sarvatantreshu gopitam | vajrapanjaranamanam ganeshasya mahatmanah ||
    18|| angabhutam manumayam sarvacaraikasadhanam | vinanena na siddhih syat pujanasya japasya ca ||
    19|| tasmat tu kavacam punyam pathedva dharayet sada | tasya siddhirmahadevi karastha paralaukiki
    || 20|| yamyam kamayate kamam tam tam prapnoti pathatah | ardharatre pathennityam sarvabhishtaphalam
    labhet || 21|| iti guhyam sukavacam mahaganapateh priyam | sarvasiddhimayam divyam gopayet parameshvari
    || 22|| || iti shrirudrayamale tantre shridevirahasye mahaganapatikavacam samaptam ||
  devanagari: वज्रविद्यादिसिद्ध्यर्थे महागणपतिवज्रपञ्जरकवचपाठे विनियोगः । ध्यानम् । विघ्नेशं विश्ववन्द्यं
    सुविपुलयशसं लोकरक्षाप्रदक्षं साक्षात् सर्वापदासु प्रशमनसुमतिं पार्वतीप्राणसूनुम् । प्रायः सर्वासुरेन्द्रैः
    ससुरमुनिगणैः साधकैः पूज्यमानं कारुण्येनान्तरायामितभयशमनं विघ्नराजं नमामि ॥ २॥ ॐश्रींह्रींगं शिरः पातु
    महागणपतिः प्रभुः । विनायको ललाटं मे विघ्नराजो भ्रुवौ मम ॥ ३॥ पातु नेत्रे गणाध्यक्षो नासिकां मे गजाननः
    । श्रुति मेऽवतु हेरम्बो गण्डौ मोदकाशनः ॥ ४॥ द्वैमातरो मुखं पातु चाधरौ पात्वरिन्दम् । दन्तान् ममैकदन्तोऽव्याद्
    वक्रतुण्डोऽवताद् रसाम् ॥ ५॥ गाङ्गेयो मे गलं पातु स्कन्धौ सिंहासनोऽवतु । विघ्नान्तको भुजौ पातु हस्तौ
    मूषकवाहनः ॥ ६॥ ऊरू ममावतान्नित्यं देवस्त्रिपुरघातनः । हृदयं मे कुमारोऽव्याञ्जयन्तः पार्श्वयुग्मकम्
    ॥ ७॥ प्रद्युम्नो मेऽवतात् पृष्ठं नाभिं शङ्करनन्दनः । कटिं नन्दिगणः पातु शिश्नं वीरेश्वरोऽवतु ॥ ८॥
    मेढ्रे मेऽवतु सौभाग्यो भृङ्गिरीटी च गुह्यकम् । विराटकोऽवतादूरू जानू मे पुष्पदन्तकः ॥ ९॥ जङ्घे मम विकर्तोऽव्याद्
    गुल्फावन्त्यगणोऽवतु । पादौ चित्तगणः पातु पादाधो लोहितोऽवतु ॥ १०॥ पादपृष्ठं सुन्दरोऽव्याद् नूपुराढ्यो
    वपुर्मम । विचारो जठरं पातु भूतानि चोग्ररूपकः ॥ ११॥ शिरसः पादपर्यन्तं वपुः सुप्तगणोऽवतु । पादादिमूर्धपर्यन्तं
    वपुः पातु विनर्तकः ॥ १२॥ विस्मारितं तु यत् स्थानं गणेशस्तत् सदावतु । पूर्वे मां ह्रीं करालोऽव्यादाग्रेये
    विकरालकः ॥ १३॥ दक्षिणे पातु संहारो नैरृते रुरुभैरवः । पश्चिमे मां महाकालो वायौ कालाग्निभैरवः ॥ १४॥
    उत्तरे मां सितास्युऽव्यादैशान्यामसितात्मकः । प्रभाते शतपत्रोऽव्यात् सहस्रारस्तु मध्यमे ॥ १५॥ दन्तमाला
    दिनान्तेऽव्यान्निशि पात्रं सदावतु । कलशो मां निशीथेऽव्यान्निशान्ते परशुस्तथा ॥ १६॥ सर्वत्र सर्वदा
    पातु शङ्खयुग्मं च मद्वपुः । ॐॐ राजकुले हहौं रणभये ह्रींह्रीं कुद्यूतेऽवतात् श्रींश्रीं शत्रुगृहे शशौं
    जलभये क्लींक्लीं वनान्तेऽवतु । ग्लौंग्लूंग्लैंग्लंगुं सत्वभीतिषु महाव्याध्यार्तिषु ग्लौंगगौं नित्यं
    यक्षपिशाचभूतफणिषु ग्लौंगं गणेशोऽवतु ॥ १७॥ इतीदं कवचं गुह्यं सर्वतन्त्रेषु गोपितम् । वज्रपञ्जरनामानं
    गणेशस्य महात्मनः ॥ १८॥ अङ्गभूतं मनुमयं सर्वाचारैकसाधनम् । विनानेन न सिद्धिः स्यात् पूजनस्य जपस्य च
    ॥ १९॥ तस्मात् तु कवचं पुण्यं पठेद्वा धारयेत् सदा । तस्य सिद्धिर्महादेवि करस्था पारलौकिकी ॥ २०॥ यंयं
    कामयते कामं तं तं प्राप्नोति पाठतः । अर्धरात्रे पठेन्नित्यं सर्वाभीष्टफलं लभेत् ॥ २१॥ इति गुह्यं सुकवचं
    महागणपतेः प्रियम् । सर्वसिद्धिमयं दिव्यं गोपयेत् परमेश्वरि ॥ २२॥ ॥ इति श्रीरुद्रयामले तन्त्रे श्रीदेवीरहस्ये
    महागणपतिकवचं समाप्तम् ॥
