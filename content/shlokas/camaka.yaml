id: camaka
category: veda
name:
  english: camaka
  devanagari: चमक
content:
  english: ̭shi ca me̱ shari̭rani ca me || 1|| jyaishthya̭m ca ma̱ adhi̭patyam ca me ma̱nyushca̭ me̱ bhama̭shca̱
    me'ma̭shca̱ me'mbha̭shca me je̱ma ca̭ me mahi̱ma ca̭ me vari̱ma ca̭ me prathi̱ma ca̭ me va̱rshma ca̭
    me draghu̱ya ca̭ me vri̱ddham ca̭ me̱ vriddhi̭shca me sa̱tyam ca̭ me shra̱ddha ca̭ me̱ jaga̭cca me̱
    dhana̭m ca me̱ vasha̭shca me̱ tvishi̭shca me kri̱da ca̭ me̱ moda̭shca me ja̱tam ca̭ me jani̱shyama̭nam
    ca me su̱ktam ca̭ me sukri̱tam ca̭ me vi̱ttam ca̭ me̱ vedya̭m ca me bhu̱tam ca̭ me bhavi̱shyacca̭
    me su̱gam ca̭ me su̱patha̭m ca ma ri̱ddham ca̭ ma̱ riddhi̭shca me kli̱ptam ca̭ me̱ klipti̭shca me
    ma̱tishca̭ me suma̱tishca̭ me || 2|| sham ca̭ me̱ maya̭shca me pri̱yam ca̭ me'nuka̱mashca̭ me̱ kama̭shca
    me saumana̱sashca̭ me bha̱dram ca̭ me̱ shreya̭shca me̱ vasya̭shca me̱ yasha̭shca me̱ bhaga̭shca me̱
    dravi̭nam ca me ya̱nta ca̭ me dha̱rta ca̭ me̱ kshema̭shca me̱ dhriti̭shca me̱ vishva̭m ca me̱ maha̭shca
    me sa̱mvicca̭ me̱ jnatra̭m ca me̱ sushca̭ me pra̱sushca̭ me̱ sira̭m ca me la̱yashca̭ ma ri̱tam ca̭
    me̱'mrita̭m ca me'ya̱kshmam ca̱ me'na̭mayacca me ji̱vatṷshca me dirghayu̱tvam ca̭ me'nami̱tram ca̱
    me'bha̭yam ca me su̱gam ca̭ me̱ shaya̭nam ca me su̱sha ca̭ me su̱dina̭m ca me || 3|| urkca̭ me su̱nrita̭
    ca me̱ paya̭shca me̱ rasa̭shca me ghri̱tam ca̭ me̱ madhṷ ca me̱ sagdhi̭shca me̱ sapi̭tishca me kri̱shishca̭
    me̱ vrishti̭shca me̱ jaitra̭m ca ma̱ audbhi̭dyam ca me ra̱yishca̭ me̱ raya̭shca me pu̱shtam ca̭ me̱
    pushti̭shca me vi̱bhu ca̭ me pra̱bhu ca̭ me ba̱hu ca̭ me̱ bhuya̭shca me pu̱rnam ca̭ me pu̱rnata̭ram
    ca̱ me'kshi̭tishca me̱ kuya̭vashca̱ me'nna̭m ca̱ me'kshṷcca me vri̱haya̭shca me̱ yava
  devanagari: ॑षि च मे॒ शरी॑राणि च मे ॥ १॥ ज्यैष्ठ्यं॑ च म॒ आधि॑पत्यं च मे म॒न्युश्च॑ मे॒ भाम॑श्च॒ मेऽम॑श्च॒
    मेऽम्भ॑श्च मे जे॒मा च॑ मे महि॒मा च॑ मे वरि॒मा च॑ मे प्रथि॒मा च॑ मे व॒र्ष्मा च॑ मे द्राघु॒या च॑ मे
    वृ॒द्धं च॑ मे॒ वृद्धि॑श्च मे स॒त्यं च॑ मे श्र॒द्धा च॑ मे॒ जग॑च्च मे॒ धनं॑ च मे॒ वश॑श्च मे॒ त्विषि॑श्च
    मे क्री॒डा च॑ मे॒ मोद॑श्च मे जा॒तं च॑ मे जनि॒ष्यमा॑णं च मे सू॒क्तं च॑ मे सुकृ॒तं च॑ मे वि॒त्तं च॑
    मे॒ वेद्यं॑ च मे भू॒तं च॑ मे भवि॒ष्यच्च॑ मे सु॒गं च॑ मे सु॒पथं॑ च म ऋ॒द्धं च॑ म॒ ऋद्धि॑श्च मे कॢ॒प्तं
    च॑ मे॒ कॢप्ति॑श्च मे म॒तिश्च॑ मे सुम॒तिश्च॑ मे ॥ २॥ शं च॑ मे॒ मय॑श्च मे प्रि॒यं च॑ मेऽनुका॒मश्च॑ मे॒
    काम॑श्च मे सौमन॒सश्च॑ मे भ॒द्रं च॑ मे॒ श्रेय॑श्च मे॒ वस्य॑श्च मे॒ यश॑श्च मे॒ भग॑श्च मे॒ द्रवि॑णं च
    मे य॒न्ता च॑ मे ध॒र्ता च॑ मे॒ क्षेम॑श्च मे॒ धृति॑श्च मे॒ विश्वं॑ च मे॒ मह॑श्च मे सं॒विच्च॑ मे॒ ज्ञात्रं॑
    च मे॒ सूश्च॑ मे प्र॒सूश्च॑ मे॒ सीरं॑ च मे ल॒यश्च॑ म ऋ॒तं च॑ मे॒ऽमृतं॑ च मेऽय॒क्ष्मं च॒ मेऽना॑मयच्च
    मे जी॒वातु॑श्च मे दीर्घायु॒त्वं च॑ मेऽनमि॒त्रं च॒ मेऽभ॑यं च मे सु॒गं च॑ मे॒ शय॑नं च मे सू॒षा च॑ मे
    सु॒दिनं॑ च मे ॥ ३॥ ऊर्क्च॑ मे सू॒नृता॑ च मे॒ पय॑श्च मे॒ रस॑श्च मे घृ॒तं च॑ मे॒ मधु॑ च मे॒ सग्धि॑श्च
    मे॒ सपी॑तिश्च मे कृ॒षिश्च॑ मे॒ वृष्टि॑श्च मे॒ जैत्रं॑ च म॒ औद्भि॑द्यं च मे र॒यिश्च॑ मे॒ राय॑श्च मे
    पु॒ष्टं च॑ मे॒ पुष्टि॑श्च मे वि॒भु च॑ मे प्र॒भु च॑ मे ब॒हु च॑ मे॒ भूय॑श्च मे पू॒र्णं च॑ मे पू॒र्णत॑रं
    च॒ मेऽक्षि॑तिश्च मे॒ कूय॑वाश्च॒ मेऽन्नं॑ च॒ मेऽक्षु॑च्च मे व्री॒हय॑श्च मे॒ यवा
