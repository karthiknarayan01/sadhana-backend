id: saraswati-ashtottara-sata-namavali
category: stotram
name:
  english: Saraswati Ashtottara Sata Namavali
content:
  english: om shri sarasvatyai namah om mahabhadrayai namah om mahamayayai namah om varapradayai namah
    om shripradayai namah om padmanilayayai namah om padmakshyai namah om padmavaktrikayai namah om shivanujayai
    namah om pustakahastayai namah om jnanamudrayai namah om ramayai namah om kamarupayai namah om mahavidyayai
    namah om mahapataka nashinyai namah om mahashrayayai namah om malinyai namah om mahabhogayai namah
    om mahabhujayai namah om mahabhagayai namah om mahotsahayai namah om divyangayai namah om suravanditayai
    namah om mahakalyai namah om mahapashayai namah om mahakarayai namah om mahankushayai namah om sitayai
    namah om vimalayai namah om vishvayai namah om vidyunmalayai namah om vaishnavyai namah om candrikayai
    namah om candralekhavibhushitayai namah om mahaphalayai namah om savitryai namah om surasayai namah
    om devyai namah om divyalankara bhushitayai namah om vagdevyai namah om vasudhayai namah om tivrayai
    namah om mahabhadrayai namah om mahabalayai namah om bhogadayai namah om bharatyai namah om bhamayai
    namah om gomatyai namah om jatilayai namah om vindhyavasayai namah om candikayai namah om subhadrayai
    namah om surapujitayai namah om vinidrayai namah om vaishnavyai namah om brahmyai namah om brahmajnanaikasadhanayai
    namah om saudaminyai namah om sudhamurtaye namah om suvinayai namah om suvasinyai namah om vidyarupayai
    namah om brahmajayayai namah om vishalayai namah om padmalocanayai namah om shumbhasura pramathinyai
    namah om dhumralocana mardinyai namah om sarvatmikayai namah om trayimurtyai namah om shubhadayai
    namah om shastrarupinyai namah om sarvadevastutayai namah om saumyayai namah om surasura namaskritayai
    namah om raktabija nihantryai namah om camundayai namah om mundakambikayai namah om kalaratryai namah
    om praharanayai namah om kaladharayai namah om niranjanayai namah om vararohayai namah om vagdevyai
    namah om varahyai namah om varijasanayai namah om citrambarayai namah om citragandhayai namah om citramalya
    vibhushitayai namah om kantayai namah om kamapradayai namah om vandyayai namah om rupasaubhagyadayinyai
    namah om shvetananayai namah om rakta madhyayai namah om dvibhujayai namah om surapujitayai namah
    om niranjanayai namah om nilajanghayai namah om caturvargaphalapradayai namah om caturanana samrajjyai
    namah om brahmavishnu shivatmikayai namah om hamsasanayai namah om mahavidyayai namah om mantravidyayai
    namah om sarasvatyai namah om mahasarasvatyai namah om vidyayai namah om jnanaikatatparayai namah
    iti shrisarasvatyashtottarashatanamavalih samapta ||
  devanagari: ॐ श्री सरस्वत्यै नमः ॐ महाभद्रायै नमः ॐ महामायायै नमः ॐ वरप्रदायै नमः ॐ श्रीप्रदायै नमः
    ॐ पद्मनिलयायै नमः ॐ पद्माक्ष्यै नमः ॐ पद्मवक्त्रिकायै नमः ॐ शिवानुजायै नमः ॐ पुस्तकहस्तायै नमः ॐ ज्ञानमुद्रायै
    नमः ॐ रमायै नमः ॐ कामरूपायै नमः ॐ महाविद्यायै नमः ॐ महापातक नाशिन्यै नमः ॐ महाश्रयायै नमः ॐ मालिन्यै
    नमः ॐ महाभोगायै नमः ॐ महाभुजायै नमः ॐ महाभागायै नमः ॐ महोत्साहायै नमः ॐ दिव्याङ्गायै नमः ॐ सुरवन्दितायै
    नमः ॐ महाकाल्यै नमः ॐ महापाशायै नमः ॐ महाकारायै नमः ॐ महाङ्कुशायै नमः ॐ सीतायै नमः ॐ विमलायै नमः ॐ
    विश्वायै नमः ॐ विद्युन्मालायै नमः ॐ वैष्णव्यै नमः ॐ चन्द्रिकायै नमः ॐ चन्द्रलेखाविभूषितायै नमः ॐ महाफलायै
    नमः ॐ सावित्र्यै नमः ॐ सुरसायै नमः ॐ देव्यै नमः ॐ दिव्यालङ्कार भूषितायै नमः ॐ वाग्देव्यै नमः ॐ वसुधायै
    नमः ॐ तीव्रायै नमः ॐ महाभद्रायै नमः ॐ महाबलायै नमः ॐ भोगदायै नमः ॐ भारत्यै नमः ॐ भामायै नमः ॐ गोमत्यै
    नमः ॐ जटिलायै नमः ॐ विन्ध्यावासायै नमः ॐ चण्डिकायै नमः ॐ सुभद्रायै नमः ॐ सुरपूजितायै नमः ॐ विनिद्रायै
    नमः ॐ वैष्णव्यै नमः ॐ ब्राह्म्यै नमः ॐ ब्रह्मज्ञानैकसाधनायै नमः ॐ सौदामिन्यै नमः ॐ सुधामूर्तये नमः
    ॐ सुवीणायै नमः ॐ सुवासिन्यै नमः ॐ विद्यारूपायै नमः ॐ ब्रह्मजायायै नमः ॐ विशालायै नमः ॐ पद्मलोचनायै
    नमः ॐ शुम्भासुर प्रमथिन्यै नमः ॐ धूम्रलोचन मर्दिन्यै नमः ॐ सर्वात्मिकायै नमः ॐ त्रयीमूर्त्यै नमः ॐ
    शुभदायै नमः ॐ शास्त्ररूपिण्यै नमः ॐ सर्वदेवस्तुतायै नमः ॐ सौम्यायै नमः ॐ सुरासुर नमस्कृतायै नमः ॐ
    रक्तबीज निहन्त्र्यै नमः ॐ चामुण्डायै नमः ॐ मुण्डकाम्बिकायै नमः ॐ कालरात्र्यै नमः ॐ प्रहरणायै नमः ॐ
    कलाधारायै नमः ॐ निरञ्जनायै नमः ॐ वरारोहायै नमः ॐ वाग्देव्यै नमः ॐ वाराह्यै नमः ॐ वारिजासनायै नमः ॐ
    चित्राम्बरायै नमः ॐ चित्रगन्धायै नमः ॐ चित्रमाल्य विभूषितायै नमः ॐ कान्तायै नमः ॐ कामप्रदायै नमः ॐ
    वन्द्यायै नमः ॐ रूपसौभाग्यदायिन्यै नमः ॐ श्वेताननायै नमः ॐ रक्त मध्यायै नमः ॐ द्विभुजायै नमः ॐ सुरपूजितायै
    नमः ॐ निरञ्जनायै नमः ॐ नीलजङ्घायै नमः ॐ चतुर्वर्गफलप्रदायै नमः ॐ चतुरानन साम्राज्ज्यै नमः ॐ ब्रह्मविष्णु
    शिवात्मिकायै नमः ॐ हंसासनायै नमः ॐ महाविद्यायै नमः ॐ मन्त्रविद्यायै नमः ॐ सरस्वत्यै नमः ॐ महासरस्वत्यै
    नमः ॐ विद्यायै नमः ॐ ज्ञानैकतत्परायै नमः इति श्रीसरस्वत्यष्टोत्तरशतनामावलिः समाप्ता ॥
