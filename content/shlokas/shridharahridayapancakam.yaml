id: shridharahridayapancakam
category: hridaya
name:
  english: shridharahridayapancakam
  devanagari: श्रीधरहृदयपन्चकम्
content:
  english: shridharahridayapancakam avidyamulanirnasham janmakarmanivartakam | akhandanandadataram vande'ham
    shridharam gurum || 1|| bhaktanam bhaktibijam sakalamalaharam saukhyabijam naranam dinanam danabijam
    sakalasukhakaram mokshabijam budhanam | kamyanam kamabijam jagati suratarum shantibijam kshamanam
    arthinamarthabijam sakalajanagurum shridharam tam namami || 2|| samsaratarakam daksha kripapurnam
    nirantaram | satyam varadahastam ca vande'ham shridharam gurum || 3|| yasya prasadamatrena samsaro
    goshpadayate | tasyanugrahalabhartham namami shridharam gurum || 4|| na tirthayatra na ca devayatra
    na dehayatra na ca gehayatra | aharnisham brahma harih subuddho guruh prasevyo nahi sevyamanyat ||
    5|| pancaklokatmakam stotram pancayajnaphalapradam | pancakleshavinasham ca pancakoshavishodhakam
    || 6|| iti shri gajanana parameshvarashastri urakeristha viracitam shridharahridayapancakam sampurnam
    |
  devanagari: श्रीधरहृदयपञ्चकम् अविद्यामूलनिर्णाशं जन्मकर्मनिवर्तकम् । अखण्डानन्ददातारं वन्देऽहं श्रीधरं
    गुरुम् ॥ १॥ भक्तानां भक्तिबीजं सकलमलहरं सौख्यबीजं नराणां दीनानां दानबीजं सकलसुखकरं मोक्षबीजं बुधानाम्
    । काम्यानां कामबीजं जगति सुरतरुं शान्तिबीजं क्षमाणां अर्थीनामर्थबीजं सकलजनगुरुं श्रीधरं तं नमामि ॥
    २॥ संसारतारकं दक्ष कृपापूर्णं निरन्तरम् । सत्यं वरदहस्तं च वन्देऽहं श्रीधरं गुरुम् ॥ ३॥ यस्य प्रसादमात्रेण
    संसारो गोष्पदायते । तस्यानुग्रहलाभार्थं नमामि श्रीधरं गुरुम् ॥ ४॥ न तीर्थयात्रा न च देवयात्रा न देहयात्रा
    न च गेहयात्रा । अहर्निशं ब्रह्म हरिः सुबुद्धो गुरुः प्रसेव्यो नहि सेव्यमन्यत् ॥ ५॥ पञ्चक्लोकात्मकं
    स्तोत्रं पञ्चयज्ञफलप्रदम् । पञ्चक्लेशविनाशं च पञ्चकोशविशोधकम् ॥ ६॥ इति श्री गजानन परमेश्वरशास्त्री
    ऊरकेरीस्थ विरचितं श्रीधरहृदयपञ्चकं सम्पूर्णम् ।
