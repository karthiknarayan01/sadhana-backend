id: arttatranastotram-3
category: stotram
name:
  english: arttatranastotram
  devanagari: आर्त्तत्राणस्तोत्रम्
content:
  english: artatranastotram gangadharastotram ca appayadikshitaviracitam kshirambhonidhimanthanodbhavavishat
    sandahyamanan suran brahmadinavalokya yah karunaya halahalakhyam visham | nishshankam nijalilaya kavalayan
    lokan rarakshadarat artatranaparayanah sa bhagavan gangadharo me gatih || 1|| kshiram svadu nipiya
    matulagrihe gatva svakiyam griham kshiralabhavashena khinnamanase ghoram tapah kurvate | karunyadupamanyave
    niravadhim kshirambudhim dattavan artatranaparayanah sa bhagavan gangadharo me gatih || 2|| mrityum
    vakshasi tadayan nijapadadhyanaikabhaktam munim markandeyamapalayat karunaya lingadvinigatya yah |
    netrambhojasamarpanena haraye'bhishtam rathangam dadau artatranaparayanah sa bhagavan gangadharo me
    gatih || 3|| udham dronajayadrathadirathikaih sainyam mahat kauravam drishtva krishnasahayavantamapi
    tam bhitam prapannartiha | partham rakshitavanamoghavishayam divyastramudghoshayan artatranaparayanah
    sa bhagavan gangadharo me gatih || 4|| balam shaivakulodbhavam parihasatsvajnatipakshakulam khidyantam
    tava murdhni pushpanicayam datum samudhyatkaram | drishtva''namya varinciramyanagare pujam tvadiyam
    bhajan artatranaparayanah sa bhagavan gangadharo me gatih || 5|| santrasteshu pura surasurabhayadindradivrindarake
  devanagari: आर्तत्राणस्तोत्रम् गङ्गाधरस्तोत्रम् च अप्पयदीक्षितविरचितम् क्षीराम्भोनिधिमन्थनोद्भवविषात्
    सन्दह्यमानान् सुरान् ब्रह्मादीनवलोक्य यः करुणया हालाहलाख्यं विषम् । निश्शङ्कं निजलीलया कवलयन् लोकान्
    ररक्षादरात् आर्तत्राणपरायणः स भगवान् गङ्गाधरो मे गतिः ॥ १॥ क्षीरं स्वादु निपीय मातुलगृहे गत्वा स्वकीयं
    गृहं क्षीरालाभवशेन खिन्नमनसे घोरं तपः कुर्वते । कारुण्यादुपमन्यवे निरवधिं क्षीराम्बुधिं दत्तवान् आर्तत्राणपरायणः
    स भगवान् गङ्गाधरो मे गतिः ॥ २॥ मृत्युं वक्षसि ताडयन् निजपदध्यानैकभक्तं मुनिं मार्कण्डेयमपालयत् करुणया
    लिङ्गाद्विनिगत्य यः । नेत्राम्भोजसमर्पणेन हरयेऽभीष्टं रथाङ्गं ददौ आर्तत्राणपरायणः स भगवान् गङ्गाधरो
    मे गतिः ॥ ३॥ ऊढं द्रोणजयद्रथादिरथिकैः सैन्यं महत् कौरवं दृष्ट्वा कृष्णसहायवन्तमपि तं भीतं प्रपन्नार्तिहा
    । पार्थं रक्षितवानमोघविषयं दिव्यास्त्रमुद्घोषयन् आर्तत्राणपरायणः स भगवान् गङ्गाधरो मे गतिः ॥ ४॥ बालं
    शैवकुलोद्भवं परिहसत्स्वज्ञातिपक्षाकुलं खिद्यन्तं तव मूर्ध्नि पुष्पनिचयं दातुं समुध्यत्करम् । दृष्ट्वाऽऽनम्य
    वरिञ्चिरम्यनगरे पूजां त्वदीयां भजन् आर्तत्राणपरायणः स भगवान् गङ्गाधरो मे गतिः ॥ ५॥ सन्त्रस्तेषु पुरा
    सुरासुरभयादिन्द्रादिवृन्दारके
