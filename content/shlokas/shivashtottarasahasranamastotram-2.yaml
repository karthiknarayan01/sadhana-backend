id: shivashtottarasahasranamastotram-2
category: sahasranama
name:
  english: shivashtottarasahasranamastotram
  devanagari: शिवाष्टोत्तरसहस्रनामस्तोत्रम्
content:
  english: bhutibhushanah || 79|| madano madako madyo madaha madhurapriyah | madhurmadhukarah kruro madano
    madanantakah || 80|| niranjano nirakaro nirlupto nirupadhikah | nishprapanco nirakaro niriho nirupadravah
    || 81|| sattvah sattvagunopetah sattvavit sattvavitpriyah | sattvanishthah sattvamurtih sattveshah
    sattvavittamah || 82|| samastajagadadharah samastagunasagarah | samastaduhkhavidhvamsi samastanandakaranah
    || 83|| rudrakshamalabharano rudrakshapriyavatsalah | rudrakshavaksha rudraksharupo rudrakshabhakshakah
    || 84|| vishveshvaro virabhadrah samrat dakshamakhantakah | vidhneshvaro vighnakarta gururdevashikhamanih
    || 85|| bhujagendralasatkantho bhujangabharanapriyah | bhujangavilasatkarno bhujangavalayavritah ||
    86|| munivandyo munishreshtho munivrindanishevitah | munihritpundarikastho munisanghaikajivanah ||
    87|| munimrigyo vedamrigyo mrigahasto munishvarah | mrigendracarmavasano narasihmanipatanah || 88||
    mrityunjayo mrityurmrityurapammrityuvinashakah | dushtamrityuradushteshtah mrityuha mrityupujitah
    || 89|| urvyo hiranyah paramo nidhanesho dhanadhipah | yajurmurtih samamurtih rinmurtirmurtivarjitah
    || 90|| vyakto vyaktatamo'vyakto vyaktavyaktastamo javi | lingamurtiralingatma lingalingatmavigrahah
    || 91|| graho'graho grahadharo grahakaro graheshvarah | grahakridgrahabhidgrahi graho grahavilakshanah
    || 92|| kalpakarah kalpakarta kalpalakshanatatparah | kalpo kalpakritih kalpanashakah kalpakalpakah
    || 93|| paramatma pradhanatma pradhanapurushah shivah | vedyo vaidyo vedavedyo vedavedantasamstutah
    || 94|| vedavaktro vedajihvo vijihvo jihmanashakah | kalyanarupah kalyanah kalyanagunasamshrayah ||
    95|| bhaktakalyanado bhaktakamadhenuh suradhipah | pavanah pavako vamo mahakalo madapahah || 96||
    ghorapatakadavagnirdavabhasmakanapriyah | anantasomasuryagnimandalapratimaprabhah || 97|| jagadekaprabhuhsvami
    jagadvandyo jaganmayah | jagadanandado janmajaramaranavarjitah || 98|| khatvangi nitiman sadyodevatatmatmasambhavah
    | kapalamalabharanah kapali vishnuvallabhah || 99|| kamalasanakalagnih kamalasanapujitah | kaladhishastrikalajno
    dushtavigrahavarakah || 100|| natyakarta nataparo mahanatyavisharadah | viradrupadharo dhiro viro
    vrishabhavahanah || 101|| vrishanko vrishabhavisho vrishatma vrishabhadhvajah | mahonnato mahavakshyo
  devanagari: भूतिभूषणः ॥ ७९॥ मदनो मादको माद्यो मदहा मधुरप्रियः । मधुर्मधुकरः क्रूरो मदनो मदनान्तकः ॥
    ८०॥ निरञ्जनो निराकारो निर्लुप्तो निरुपाधिकः । निष्प्रपञ्चो निराकारो निरीहो निरुपद्रवः ॥ ८१॥ सत्त्वः
    सत्त्वगुणोपेतः सत्त्ववित् सत्त्ववित्प्रियः । सत्त्वनिष्ठः सत्त्वमूर्तिः सत्त्वेशः सत्त्ववित्तमः ॥
    ८२॥ समस्तजगदाधारः समस्तगुणसागरः । समस्तदुःखविध्वंसी समस्तानन्दकारणः ॥ ८३॥ रुद्राक्षमालाभरणो रुद्राक्षप्रियवत्सलः
    । रुद्राक्षवक्षा रुद्राक्षरूपो रुद्राक्षभक्षकः ॥ ८४॥ विश्वेश्वरो वीरभद्रः सम्राट् दक्षमखान्तकः । विध्नेश्वरो
    विघ्नकर्ता गुरुर्देवशिखामणिः ॥ ८५॥ भुजगेन्द्रलसत्कण्ठो भुजङ्गाभरणप्रियः । भुजङ्गविलसत्कर्णो भुजङ्गवलयावृतः
    ॥ ८६॥ मुनिवन्द्यो मुनिश्रेष्ठो मुनिवृन्दनिषेवितः । मुनिहृत्पुण्डरीकस्थो मुनिसङ्घैकजीवनः ॥ ८७॥ मुनिमृग्यो
    वेदमृग्यो मृगहस्तो मुनीश्वरः । मृगेन्द्रचर्मवसनो नरसिह्मनिपातनः ॥ ८८॥ मृत्युञ्जयो मृत्युर्मृत्युरपम्मृत्युविनाशकः
    । दुष्टमृत्युरदुष्टेष्टः मृत्युहा मृत्युपूजितः ॥ ८९॥ उर्व्यो हिरण्यः परमो निधनेशो धनाधिपः । यजुर्मूर्तिः
    साममूर्तिः ऋङ्मूर्तिर्मूर्तिवर्जितः ॥ ९०॥ व्यक्तो व्यक्ततमोऽव्यक्तो व्यक्ताव्यक्तस्तमो जवी । लिङ्गमूर्तिरलिङ्गात्मा
    लिङ्गालिङ्गात्मविग्रहः ॥ ९१॥ ग्रहोऽग्रहो ग्रहाधारो ग्रहाकारो ग्रहेश्वरः । ग्रहकृद्ग्रहभिद्ग्राही ग्रहो
    ग्रहविलक्षणः ॥ ९२॥ कल्पाकारः कल्पकर्ता कल्पलक्षणतत्परः । कल्पो कल्पाकृतिः कल्पनाशकः कल्पकल्पकः ॥ ९३॥
    परमात्मा प्रधानात्मा प्रधानपुरुषः शिवः । वेद्यो वैद्यो वेदवेद्यो वेदवेदान्तसंस्तुतः ॥ ९४॥ वेदवक्त्रो
    वेदजिह्वो विजिह्वो जिह्मनाशकः । कल्याणरूपः कल्याणः कल्याणगुणसंश्रयः ॥ ९५॥ भक्तकल्याणदो भक्तकामधेनुः
    सुराधिपः । पावनः पावको वामो महाकालो मदापहः ॥ ९६॥ घोरपातकदावाग्निर्दवभस्मकणप्रियः । अनन्तसोमसूर्याग्निमण्डलप्रतिमप्रभः
    ॥ ९७॥ जगदेकप्रभुःस्वामी जगद्वन्द्यो जगन्मयः । जगदानन्ददो जन्मजरामरणवर्जितः ॥ ९८॥ खट्वाङ्गी नीतिमान्
    सद्योदेवतात्मात्मसम्भवः । कपालमालाभरणः कपाली विष्णुवल्लभः ॥ ९९॥ कमलासनकालाग्निः कमलासनपूजितः । कालाधीशस्त्रिकालज्ञो
    दुष्टविग्रहवारकः ॥ १००॥ नाट्यकर्ता नटपरो महानाट्यविशारदः । विराड्रूपधरो धीरो वीरो वृषभवाहनः ॥ १०१॥
    वृषाङ्को वृषभावीशो वृषात्मा वृषभध्वजः । महोन्नतो महावक्ष्यो
