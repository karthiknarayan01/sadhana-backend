id: gurukritamshivastotram
category: stotram
name:
  english: gurukritamshivastotram
  devanagari: गुरुकृतंशिवस्तोत्रम्
content:
  english: gurukritam shivastotram gururuvaca | namo devadhidevaya mahadevaya catmane | maheshvaraya prabhave
    tryambakaya kapardine || 22|| dinanathaya vibhave namo'ndhakanishudine | tripuraghnaya sharvaya brahmane
    parameshthine || 23|| virupakshaya rudraya bahurupaya shambhave | virupayatirupaya rupatitaya te namah
    || 24|| yajnavidhvamsakartre ca yajnanam phaladayine | namaste makharupaya parakarmapravartine ||
    25|| kalantakaya kalaya kalabhogidharaya ca | namaste parameshaya sarvatra vyapine namah || 26|| namo
    brahmashirohantre brahmacandrastutaya ca | brahmanyaya namaste'stu namaste paramatmane || 27|| tvamagniranilo
    vyoma tvamevapo vasundhara | tvam suryashcandrama bhani jyotishcakram tvameva hi || 28|| tvameva vishnustvam
    brahma tatstutastvam pareshvarah | munayah sanakadyastvam naradastvam tapodhanah || 29|| tvameva sarvalokeshastvameva
    jagadatmakah | sarvanvayassarvabhinnastvameva prakriteh parah || 5
  devanagari: गुरुकृतं शिवस्तोत्रम् गुरुरुवाच । नमो देवाधिदेवाय महादेवाय चात्मने । महेश्वराय प्रभवे त्र्यम्बकाय
    कपर्दिने ॥ २२॥ दीननाथाय विभवे नमोऽन्धकनिषूदिने । त्रिपुरघ्नाय शर्वाय ब्रह्मणे परमेष्ठिने ॥ २३॥ विरूपाक्षाय
    रुद्राय बहुरूपाय शम्भवे । विरूपायातिरूपाय रूपातीताय ते नमः ॥ २४॥ यज्ञविध्वंसकर्त्रे च यज्ञानां फलदायिने
    । नमस्ते मखरूपाय परकर्मप्रवर्तिने ॥ २५॥ कालान्तकाय कालाय कालभोगिधराय च । नमस्ते परमेशाय सर्वत्र व्यापिने
    नमः ॥ २६॥ नमो ब्रह्मशिरोहन्त्रे ब्रह्मचन्द्रस्तुताय च । ब्रह्मण्याय नमस्तेऽस्तु नमस्ते परमात्मने ॥
    २७॥ त्वमग्निरनिलो व्योम त्वमेवापो वसुन्धरा । त्वं सूर्यश्चन्द्रमा भानि ज्योतिश्चक्रं त्वमेव हि ॥ २८॥
    त्वमेव विष्णुस्त्वं ब्रह्मा तत्स्तुतस्त्वं परेश्वरः । मुनयः सनकाद्यास्त्वं नारदस्त्वं तपोधनः ॥ २९॥
    त्वमेव सर्वलोकेशस्त्वमेव जगदात्मकः । सर्वान्वयस्सर्वभिन्नस्त्वमेव प्रकृतेः परः ॥ ५
