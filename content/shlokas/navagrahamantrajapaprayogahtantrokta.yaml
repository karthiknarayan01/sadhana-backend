id: navagrahamantrajapaprayogahtantrokta
category: mantra
name:
  english: navagrahamantrajapaprayogahtantrokta
  devanagari: नवग्रहमन्त्रजपप्रयोगःतन्त्रोक्त
content:
  english: shriketupritaye jape viniyogah | om brahmarishaye namah shirase | om panktishchandase namah
    mukhe | om keturdevatayai namah hridaye | om kem bijaya namah guhye | om veshah shaktaye namah padayoh
    | iti rishyadinyasah | om kem angushthabhyam namah | om kem tarjanibhyam namah | om kem madhyamabhyam
    namah | om kem anamikabhyam namah | om kem kanishthikabhyam namah | om kem karatalakaraprishthabhyam
    namah | iti karanyasah | om kem hridayaya namah | om kem shirase svaha | om kem shikhayai vashat |
    om kem kavacaya hu~ | om kem netratrayaya vaushat | om kem astraya phat | iti hridayadinyasam kritva
    dhyayet om vande ketum krishnavarnam krishnavastravibhushanam | vamorunyastataddhastam sabhayetarapanikam
    || 2|| evam dhyatva manasopacaraih sampujya japet || iti tantroktanavagrahamantrajapaprayogah sampurnah
    |
  devanagari: श्रीकेतुप्रीतये जपे विनियोगः । ॐ ब्रह्मऋषये नमः शिरसे । ॐ पङ्क्तिश्छन्दसे नमः मुखे । ॐ केतुर्देवतायै
    नमः हृदये । ॐ कें बीजाय नमः गुह्ये । ॐ वेशः शक्तये नमः पादयोः । इति ऋष्यादिन्यासः । ॐ कें अङ्गुष्ठाभ्यां
    नमः । ॐ कें तर्जनीभ्यां नमः । ॐ कें मध्यमाभ्यां नमः । ॐ कें अनामिकाभ्यां नमः । ॐ कें कनिष्ठिकाभ्यां
    नमः । ॐ कें करतलकरपृष्ठाभ्यां नमः । इति करन्यासः । ॐ कें हृदयाय नमः । ॐ कें शिरसे स्वाहा । ॐ कें शिखायै
    वषट् । ॐ कें कवचाय हुँ । ॐ कें नेत्रत्रयाय वौषट् । ॐ कें अस्त्राय फट् । इति हृदयादिन्यासं कृत्वा ध्यायेत्
    ॐ वन्दे केतुं कृष्णवर्णं कृष्णवस्त्रविभूषणम् । वामोरुन्यस्ततद्धस्तं साभयेतरपाणिकम् ॥ २॥ एवं ध्यात्वा
    मानसोपचारैः सम्पूज्य जपेत् ॥ इति तन्त्रोक्तनवग्रहमन्त्रजपप्रयोगः सम्पूर्णः ।
