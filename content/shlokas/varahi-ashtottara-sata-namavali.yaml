id: varahi-ashtottara-sata-namavali
category: stotram
name:
  english: Varahi Ashtottara Sata Namavali
content:
  english: om varahavadanayai namah | om varahyai namah | om vararupinyai namah | om krodananayai namah
    | om kolamukhyai namah | om jagadambayai namah | om tarunyai namah | om vishveshvaryai namah | om
    shankhinyai namah | om cakrinyai namah | om khadgashulagadahastayai namah | om musaladharinyai namah
    | om halasakadi samayuktayai namah | om bhaktanam abhayapradayai namah | om ishtarthadayinyai namah
    | om ghorayai namah | om mahaghorayai namah | om mahamayayai namah | om vartalyai namah | om jagadishvaryai
    namah | om andhe andhinyai namah | om rundhe rundhinyai namah | om jambhe jambhinyai namah | om mohe
    mohinyai namah | om stambhe stambhinyai namah | om deveshyai namah | om shatrunashinyai namah | om
    ashtabhujayai namah | om caturhastayai namah | om unmattabhairavankasthayai namah | om kapilalocanayai
    namah | om pancamyai namah | om lokeshyai namah | om nilamaniprabhayai namah | om anjanadripratikashayai
    namah | om simharudhayai namah | om trilocanayai namah | om shyamalayai namah | om paramayai namah
    | om ishanyai namah | om nilayai namah | om indivarasannibhayai namah | om ghanastanasamopetayai namah
    | om kapilayai namah | om kalatmikayai namah | om ambikayai namah | om jagaddharinyai namah | om bhaktopadravanashinyai
    namah | om sagunayai namah | om nishkalayai namah | om vidyayai namah | om nityayai namah | om vishvavashankaryai
    namah | om maharupayai namah | om maheshvaryai namah | om mahendritayai namah | om vishvavyapinyai
    namah | om devyai namah | om pashunam abhayankaryai namah | om kalikayai namah | om balimamsamahapriyayai
    namah | om jayabhairavyai namah | om krishnangayai namah | om parameshvaravallabhayai namah | om sudhayai
    namah | om stutyai namah | om sureshanyai namah | om brahmadivaradayinyai namah | om svarupinyai namah
    | om suranam abhayapradayai namah | om varahadehasambhutayai namah | om shroni varalase namah | om
    krodhinyai namah | om nilasyayai namah | om shubhadayai namah | om ashubhavarinyai namah | om shatrunam
    vak stambhanakarinyai namah | om shatrunam gatistambhanakarinyai namah | om shatrunam matistambhanakarinyai
    namah | om shatrunam akshistambhanakarinyai namah | om shatrunam mukhastambhinyai namah | om shatrunam
    jihvastambhinyai namah | om shatrunam nigrahakarinyai namah | om shishtanugrahakarinyai namah | om
    sarvashatrukshayankaryai namah | om sarvashatrusadanakarinyai namah | om sarvashatruvidveshanakarinyai
    namah | om bhairavipriyayai namah | om mantratmikayai namah | om yantrarupayai namah | om tantrarupinyai
    namah | om pithatmikayai namah | om devadevyai namah | om shreyaskaryai namah | om cintitarthapradayinyai
    namah | om bhaktalakshmivinashinyai namah | om sampatpradayai namah | om saukhyakarinyai namah | om
    bahuvarahyai namah | om svapnavarahyai namah | om bhagavatyai namah | om ishvaryai namah | om sarvaradhyayai
    namah | om sarvamayayai namah | om sarvalokatmikayai namah | om mahishasanayai namah | om brihadvarahyai
    namah | iti shrivarahyashtottarashatanamavalih |
  devanagari: ॐ वराहवदनायै नमः । ॐ वाराह्यै नमः । ॐ वररूपिण्यै नमः । ॐ क्रोडाननायै नमः । ॐ कोलमुख्यै नमः
    । ॐ जगदम्बायै नमः । ॐ तारुण्यै नमः । ॐ विश्वेश्वर्यै नमः । ॐ शङ्खिन्यै नमः । ॐ चक्रिण्यै नमः । ॐ खड्गशूलगदाहस्तायै
    नमः । ॐ मुसलधारिण्यै नमः । ॐ हलसकादि समायुक्तायै नमः । ॐ भक्तानां अभयप्रदायै नमः । ॐ इष्टार्थदायिन्यै
    नमः । ॐ घोरायै नमः । ॐ महाघोरायै नमः । ॐ महामायायै नमः । ॐ वार्ताल्यै नमः । ॐ जगदीश्वर्यै नमः । ॐ
    अन्धे अन्धिन्यै नमः । ॐ रुन्धे रुन्धिन्यै नमः । ॐ जम्भे जम्भिन्यै नमः । ॐ मोहे मोहिन्यै नमः । ॐ स्तम्भे
    स्तम्भिन्यै नमः । ॐ देवेश्यै नमः । ॐ शत्रुनाशिन्यै नमः । ॐ अष्टभुजायै नमः । ॐ चतुर्हस्तायै नमः । ॐ
    उन्मत्तभैरवाङ्कस्थायै नमः । ॐ कपिललोचनायै नमः । ॐ पञ्चम्यै नमः । ॐ लोकेश्यै नमः । ॐ नीलमणिप्रभायै
    नमः । ॐ अञ्जनाद्रिप्रतीकाशायै नमः । ॐ सिंहारुढायै नमः । ॐ त्रिलोचनायै नमः । ॐ श्यामलायै नमः । ॐ परमायै
    नमः । ॐ ईशान्यै नमः । ॐ नीलायै नमः । ॐ इन्दीवरसन्निभायै नमः । ॐ घनस्तनसमोपेतायै नमः । ॐ कपिलायै नमः
    । ॐ कलात्मिकायै नमः । ॐ अम्बिकायै नमः । ॐ जगद्धारिण्यै नमः । ॐ भक्तोपद्रवनाशिन्यै नमः । ॐ सगुणायै
    नमः । ॐ निष्कलायै नमः । ॐ विद्यायै नमः । ॐ नित्यायै नमः । ॐ विश्ववशङ्कर्यै नमः । ॐ महारूपायै नमः ।
    ॐ महेश्वर्यै नमः । ॐ महेन्द्रितायै नमः । ॐ विश्वव्यापिन्यै नमः । ॐ देव्यै नमः । ॐ पशूनां अभयङ्कर्यै
    नमः । ॐ कालिकायै नमः । ॐ बलिमांसमहाप्रियायै नमः । ॐ जयभैरव्यै नमः । ॐ कृष्णाङ्गायै नमः । ॐ परमेश्वरवल्लभायै
    नमः । ॐ सुधायै नमः । ॐ स्तुत्यै नमः । ॐ सुरेशान्यै नमः । ॐ ब्रह्मादिवरदायिन्यै नमः । ॐ स्वरूपिण्यै
    नमः । ॐ सुराणां अभयप्रदायै नमः । ॐ वराहदेहसम्भूतायै नमः । ॐ श्रोणी वारालसे नमः । ॐ क्रोधिन्यै नमः
    । ॐ नीलास्यायै नमः । ॐ शुभदायै नमः । ॐ अशुभवारिण्यै नमः । ॐ शत्रूणां वाक् स्तम्भनकारिण्यै नमः । ॐ
    शत्रूणां गतिस्तम्भनकारिण्यै नमः । ॐ शत्रूणां मतिस्तम्भनकारिण्यै नमः । ॐ शत्रूणां अक्षिस्तम्भनकारिण्यै
    नमः । ॐ शत्रूणां मुखस्तम्भिन्यै नमः । ॐ शत्रूणां जिह्वास्तम्भिन्यै नमः । ॐ शत्रूणां निग्रहकारिण्यै
    नमः । ॐ शिष्टानुग्रहकारिण्यै नमः । ॐ सर्वशत्रुक्षयङ्कर्यै नमः । ॐ सर्वशत्रुसादनकारिण्यै नमः । ॐ सर्वशत्रुविद्वेषणकारिण्यै
    नमः । ॐ भैरवीप्रियायै नमः । ॐ मन्त्रात्मिकायै नमः । ॐ यन्त्ररूपायै नमः । ॐ तन्त्ररूपिण्यै नमः । ॐ
    पीठात्मिकायै नमः । ॐ देवदेव्यै नमः । ॐ श्रेयस्कर्यै नमः । ॐ चिन्तितार्थप्रदायिन्यै नमः । ॐ भक्तालक्ष्मीविनाशिन्यै
    नमः । ॐ सम्पत्प्रदायै नमः । ॐ सौख्यकारिण्यै नमः । ॐ बाहुवाराह्यै नमः । ॐ स्वप्नवाराह्यै नमः । ॐ भगवत्यै
    नमः । ॐ ईश्वर्यै नमः । ॐ सर्वाराध्यायै नमः । ॐ सर्वमयायै नमः । ॐ सर्वलोकात्मिकायै नमः । ॐ महिषासनायै
    नमः । ॐ बृहद्वाराह्यै नमः । इति श्रीवाराह्यष्टोत्तरशतनामावलिः ।
