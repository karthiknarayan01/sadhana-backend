id: ashta-lakshmi-stotram
category: stotram
name:
  english: Ashta Lakshmi Stotram
content:
  english: adilakshmi sumanasa vandita sundari madhavi candra sahodari hemamaye munigana vandita mokshapradayini
    manjula bhashini vedanute | munigana mandita mokshapradayini manjula bhashini vedanute pankajavasini
    deva supujita sadguna varshini shantiyute jaya jayahe madhusudana kamini adilakshmi paripalaya mam
    || dhanyalakshmi ayikali kalmasha nashini kamini vaidika rupini vedamaye kshira samudbhava mangala
    rupini mantranivasini mantranute | mangaladayini ambujavasini devaganashrita padayute jaya jayahe
    madhusudana kamini dhanyalakshmi sada palaya mam || dhairyalakshmi jayavaravarshini vaishnavi bhargavi
    mantra svarupini mantramaye suragana pujita shighra phalaprada jnana vikasini shastranute | bhavabhayaharini
    papavimocani sadhu janashrita padayute jaya jayahe madhusudana kamini dhairyalakshmi paripalaya mam
    || gajalakshmi jaya jaya durgati nashini kamini sarvaphalaprada shastramaye rathagaja turagapadati
    samavrita parijana mandita lokanute | rathagaja turagapadadi samavrita harihara brahma supujita sevita
    tapa nivarini padayute jaya jayahe madhusudana kamini gajalakshmi rupena palaya mam || || santanalakshmi
    ayikhaga vahini mohini cakrini ragavivardhini jnanamaye gunaganavaridhi lokahitaishini svarasapta
    bhushita gananute | saptasvara bhushita gananute sakala surasura deva munishvara manava vandita padayute
    jaya jayahe madhusudana kamini santanalakshmi tvam palaya mam || vijayalakshmi jaya kamalasini sadgati
    dayini jnanavikasini ganamaye anudina bhushita vasita vadyanute | kanakadharastuti vaibhava vandita
    shankaradeshika manyapade jaya jayahe madhusudana kamini vijayalakshmi sada palaya mam || vidyalakshmi
    pranata sureshvari bharati bhargavi shokavinashini ratnamaye manimaya bhushita karnavibhushana shanti
    samavrita hasyamukhe | navanidhi dayini kalimalaharini kamita phalaprada hastayute jaya jayahe madhusudana
    kamini vidyalakshmi sada palaya mam || || dhanalakshmi dhimidhimi dhindhimi dhindhimi dundhubhi nada
    supurnamaye ghumaghuma ghunghuma ghunghuma ghunghuma shankha ninada suvadyanute | veda puranetihasa
    supujita vaidika marga pradarshayute jaya jayahe madhusudana kamini dhanalakshmi rupena palaya mam
    || || phalashriti shlo|| ashtalakshmi namastubhyam varade kamarupini | vishnuvakshah sthala rudhe
    bhakta moksha pradayini || shlo|| shankha cakragadahaste vishvarupini te jayah | jaganmatre ca mohinyai
    mangalam shubha mangalam ||
  devanagari: आदिलक्ष्मी सुमनस वन्दित सुन्दरि माधवि चन्द्र सहोदरि हेममये मुनिगण वन्दित मोक्षप्रदायिनि
    मञ्जुल भाषिणि वेदनुते । मुनिगण मण्डित मोक्षप्रदायिनि मञ्जुल भाषिणि वेदनुते पङ्कजवासिनि देव सुपूजित
    सद्गुण वर्षिणि शान्तियुते जय जयहे मधुसूदन कामिनि आदिलक्ष्मि परिपालय माम् ॥ धान्यलक्ष्मी अयिकलि कल्मष
    नाशिनि कामिनि वैदिक रूपिणि वेदमये क्षीर समुद्भव मङ्गल रूपिणि मन्त्रनिवासिनि मन्त्रनुते । मङ्गलदायिनि
    अम्बुजवासिनि देवगणाश्रित पादयुते जय जयहे मधुसूदन कामिनि धान्यलक्ष्मि सदा पालय माम् ॥ धैर्यलक्ष्मी
    जयवरवर्षिणि वैष्णवि भार्गवि मन्त्र स्वरूपिणि मन्त्रमये सुरगण पूजित शीघ्र फलप्रद ज्ञान विकासिनि शास्त्रनुते
    । भवभयहारिणि पापविमोचनि साधु जनाश्रित पादयुते जय जयहे मधुसूदन कामिनि धैर्यलक्ष्मि परिपालय माम् ॥ गजलक्ष्मी
    जय जय दुर्गति नाशिनि कामिनि सर्वफलप्रद शास्त्रमये रथगज तुरगपदाति समावृत परिजन मण्डित लोकनुते । रथगज
    तुरगपदादि समावृत हरिहर ब्रह्म सुपूजित सेवित ताप निवारिणि पादयुते जय जयहे मधुसूदन कामिनि गजलक्ष्मि
    रूपेण पालय माम् ॥ ॥ सन्तानलक्ष्मी अयिखग वाहिनि मोहिनि चक्रिणि रागविवर्धिनि ज्ञानमये गुणगणवारिधि लोकहितैषिणि
    स्वरसप्त भूषित गाननुते । सप्तस्वर भूषित गाननुते सकल सुरासुर देव मुनीश्वर मानव वन्दित पादयुते जय जयहे
    मधुसूदन कामिनि सन्तानलक्ष्मि त्वं पालय माम् ॥ विजयलक्ष्मी जय कमलासिनि सद्गति दायिनि ज्ञानविकासिनि
    गानमये अनुदिन भूषित वासित वाद्यनुते । कनकधरास्तुति वैभव वन्दित शङ्करदेशिक मान्यपदे जय जयहे मधुसूदन
    कामिनि विजयलक्ष्मि सदा पालय माम् ॥ विद्यालक्ष्मी प्रणत सुरेश्वरि भारति भार्गवि शोकविनाशिनि रत्नमये
    मणिमय भूषित कर्णविभूषण शान्ति समावृत हास्यमुखे । नवनिधि दायिनि कलिमलहारिणि कामित फलप्रद हस्तयुते जय
    जयहे मधुसूदन कामिनि विद्यालक्ष्मि सदा पालय माम् ॥ ॥ धनलक्ष्मी धिमिधिमि धिन्धिमि धिन्धिमि दुन्धुभि
    नाद सुपूर्णमये घुमघुम घुङ्घुम घुङ्घुम घुङ्घुम शङ्ख निनाद सुवाद्यनुते । वेद पूराणेतिहास सुपूजित वैदिक
    मार्ग प्रदर्शयुते जय जयहे मधुसूदन कामिनि धनलक्ष्मि रूपेण पालय माम् ॥ ॥ फलशृति श्लो॥ अष्टलक्ष्मी नमस्तुभ्यं
    वरदे कामरूपिणि । विष्णुवक्षः स्थला रूढे भक्त मोक्ष प्रदायिनि ॥ श्लो॥ शङ्ख चक्रगदाहस्ते विश्वरूपिणि
    ते जयः । जगन्मात्रे च मोहिन्यै मङ्गलं शुभ मङ्गलम् ॥
