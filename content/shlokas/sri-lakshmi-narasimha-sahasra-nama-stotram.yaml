id: sri-lakshmi-narasimha-sahasra-nama-stotram
category: stotram
name:
  english: Sri Lakshmi Narasimha Sahasra Nama Stotram
content:
  english: '|| purvapithika || markandeya uvaca | evam yuddhamabhudghoram raudram daityabalaih saha |
    nrisimhasyangasambhutairnarasimhairanekashah || || daityakotirhatastatra kecidbhitah palayitah | tam
    drishtvativa sankruddho hiranyakashipuh svayam || || bhutapurvairamrityurme iti brahmavaroddhatah
    | vavarsha sharavarshena narasimho bhrisham bali || || dvandvayuddhamabhudugram divyavarshasahasrakam
    | daityendre sahasam drishtva devashcendrapurogamah || || shreyah kasya bhavedatra iti cintapara bhavan
    | tada kruddho nrisimhastu daityendraprahitanyapi || || vishnucakram mahacakram kalacakram tu vaishnavam
    | raudram pashupatam brahmam kauberam kulishasanam || || agneyam varunam saumyam mohanam sauraparvatam
    | bhargavadi bahunyastranyabhakshayata kopanah || || sandhyakale sabhadvare svanke nikshipya bhairavah
    | tatah khadgadharam daityam jagraha narakesari || || hiranyakashiporvaksho vidaryativa roshitah |
    uddhritya cantramalani nakhairvajrasamaprabhaih || || mene kritarthamatmanam sarvatah paryavaikshata
    | harshita devatah sarvah pushpavrishtimavakiran || || devadundubhayo nedurvimalashca disho''bhavan
    | narasimhamativogram vikirnavadanam bhrisham || || lelihanam ca garjantam kalanalasamaprabham | atiraudram
    mahakayam mahadamshtram maharutam || || mahasimham maharupam drishtva sankshubhitam jagat | sarvadevaganaih
    sartham tatragatya pitamahah || || agantukairbhutapurvairvartamanairanuttamaih | gunairnamasahasrena
    tushtava shrutisammataih || || om namah shrimaddivyalakshminrisimha sahasranamastotramahamantrasya
    brahma rishih shrilakshminrisimho devata shrinrisimhah paramatma bijam lakshmirmaya shaktih om kshraum
    hrim iti bijani om shrim am am iti shaktayah vikirnanakhadamshtrayudhayeti kilakam shrilakshminrisimha
    prasadasiddhyarthe shrilakshminrisimha sahasranamastotra mantrajape viniyogah | nyasah om shrilakshminrisimhaya
    namah angushthabhyam namah | om vajranakhaya namah tarjanibhyam namah | om maharudraya namah madhyamabhyam
    namah | om sarvatomukhaya namah anamikabhyam namah | om vikatasyaya namah kanishthikabhyam namah |
    om viraya namah karatalakaraprishthabhyam namah | evam hridayadinyasah | digbandhah om aindrim disham
    sudarshanena badhnami namashcakraya svaha | om agneyim disham sudarshanena badhnami namashcakraya
    svaha | om yamyam disham sudarshanena badhnami namashcakraya svaha | om nairritim disham sudarshanena
    badhnami namashcakraya svaha | om varunim disham sudarshanena badhnami namashcakraya svaha | om vayavim
    disham sudarshanena badhnami namashcakraya svaha | om kauberim disham sudarshanena badhnami namashcakraya
    svaha | om ishanim disham sudarshanena badhnami namashcakraya svaha | om urdhvam disham sudarshanena
    badhnami namashcakraya svaha | om adhastaddisham disham sudarshanena badhnami namashcakraya svaha
    | om antariksham disham sudarshanena badhnami namashcakraya svaha | atha dhyanam | satyajnanasukhasvarupamamalam
    kshirabdhimadhye sthitam yogarudhamatiprasannavadanam bhushasahasrojvalam | tryaksham cakrapinakasabhayakaran
    bibhranamarkacchavim chatribhutaphanindramindudhavalam lakshminrisimham bhaje || || upasmahe nrisimhakhyam
    brahma vedantagocaram | bhuyolalitasamsaracchedahetum jagadgurum || || atha stotram | brahmovaca |
    om hrim shrim aim kshraum || om namo narasimhaya vajradamshtraya vajrine | vajradehaya vajraya namo
    vajranakhaya ca || || vasudevaya vandyaya varadaya varatmane | varadabhayahastaya varaya vararupine
    || || varenyaya varishthaya shrivaraya namo namah | prahladavaradayaiva pratyakshavaradaya ca || ||
    paratparapareshaya pavitraya pinakine | pavanaya prasannaya pashine papaharine || || purushtutaya
    punyaya puruhutaya te namah | tatpurushaya tathyaya puranapurushaya ca || || purodhase purvajaya pushkarakshaya
    te namah | pushpahasaya hasaya mahahasaya sharngine || || simhaya simharajaya jagadvashyaya te namah
    | attahasaya roshaya jalavasaya te namah || || bhutavasaya bhasaya shrinivasaya khadgine | khadgajihvaya
    simhaya khadgavasaya te namah || || namo muladhivasaya dharmavasaya dhanvine | dhananjayaya dhanyaya
    namo mrityunjayaya ca || || shubhanjayaya sutraya namah shatrunjayaya ca | niranjanaya niraya nirgunaya
    gunaya ca || || nishprapancaya nirvanapradaya nibidaya ca | niralambaya nilaya nishkalaya kalaya ca
    || || nimeshaya nibandhaya nimeshagamanaya ca | nirdvandvaya nirashaya nishcayaya niraya ca || ||
    nirmalaya nibandhaya nirmohaya nirakrite | namo nityaya satyaya satkarmanirataya ca || || satyadhvajaya
    munjaya munjakeshaya keshine | harishaya ca sheshaya gudakeshaya vai namah || || sukeshayordhvakeshaya
    keshisamharakaya ca | jaleshaya sthaleshaya padmeshayograrupine || || kusheshayaya kulaya keshavaya
    namo namah | suktikarnaya suktaya raktajihvaya ragine || || diptarupaya diptaya pradiptaya pralobhine
    | pracchinnaya prabodhaya prabhave vibhave namah || || prabhanjanaya panthaya pramayapramitaya ca
    | prakashaya pratapaya prajvalayojjvalaya ca || || jvalamalasvarupaya jvalajjihvaya jvaline | mahojjvalaya
    kalaya kalamurtidharaya ca || || kalantakaya kalpaya kalanaya krite namah | kalacakraya shakraya vashatcakraya
    cakrine || || akruraya kritantaya vikramaya kramaya ca | krittine krittivasaya kritaghnaya kritatmane
    || || sankramaya ca kruddhaya krantalokatrayaya ca | arupaya svarupaya haraye paramatmane || || ajayayadidevaya
    akshayaya kshayaya ca | aghoraya sughoraya ghoraghorataraya ca || || namo''stvaghoraviryaya lasadghoraya
    te namah | ghoradhyakshaya dakshaya dakshina''''ryaya shambhave || || amoghaya gunaughaya anaghaya''ghaharine
    | meghanadaya nadaya tubhyam meghatmane namah || || meghavahanarupaya meghashyamaya maline | vyalayajnopavitaya
    vyaghradehaya vai namah || || vyaghrapadaya ca vyaghrakarmine vyapakaya ca | vikatasyaya viraya vishtarashravase
    namah || || vikirnanakhadamshtraya nakhadamshtrayudhaya ca | vishvaksenaya senaya vihvalaya balaya
    ca || || virupakshaya viraya visheshakshaya sakshine | vitashokaya vistirnavadanaya namo namah ||
    || vidhanaya vidheyaya vijayaya jayaya ca | vibudhaya vibhavaya namo vishvambharaya ca || || vitaragaya
    vipraya vitankanayanaya ca | vipulaya vinitaya vishvayone namo namah || || vidambanaya vittaya vishrutaya
    viyonaye | vihvalaya vivadaya namo vyahritaye namah || || vilasaya vikalpaya mahakalpaya te namah
    | bahukalpaya kalpaya kalpatitaya shilpine || || kalpanaya svarupaya phanitalpaya vai namah | tatitprabhaya
    tarkshyaya tarunaya tarasvine || || tapanaya tarakshaya tapatrayaharaya ca | tarakaya tamoghnaya tattvaya
    ca tapasvine || || takshakaya tanutraya tatine taralaya ca | shatarupaya shantaya shatadharaya te
    namah || || shatapatrayatakshaya sthitaye shatamurtaye | shatakratusvarupaya shashvataya shatatmane
    || || namah sahasrashirase sahasravadanaya ca | sahasrakshaya devaya dishashrotraya te namah || ||
    namah sahasrajihvaya mahajihvaya te namah | sahasranamadheyaya sahasrakshidharaya ca || || sahasrabahave
    tubhyam sahasracaranaya ca | sahasrarkaprakashaya sahasrayudhadharine || || namah sthulaya sukshmaya
    susukshmaya namo namah | sukshunnaya subhikshaya suradhyakshaya shaurine || || dharmadhyakshaya dharmaya
    lokadhyakshaya vai namah | prajadhyakshaya shikshaya vipakshakshayamurtaye || || kaladhyakshaya tikshnaya
    muladhyakshaya te namah | adhokshajaya mitraya sumitravarunaya ca || || shatrughnaya avighnaya vighnakotiharaya
    ca | rakshoghnaya tamoghnaya bhutaghnaya namo namah || || bhutapalaya bhutaya bhutavasaya bhutine
    | bhutavetalaghataya bhutadhipataye namah || || bhutagrahavinashaya bhutasamyamate namah | mahabhutaya
    bhrigave sarvabhutatmane namah || || sarvarishtavinashaya sarvasampatkaraya ca | sarvadharaya sharvaya
    sarvartiharaye namah || || sarvaduhkhaprashantaya sarvasaubhagyadayine | sarvajnayapyanantaya sarvashaktidharaya
    ca || || sarvaishvaryapradatre ca sarvakaryavidhayine | sarvajvaravinashaya sarvarogapaharine || ||
    sarvabhicarahantre ca sarvaishvaryavidhayine | pingakshayaikashringaya dvishringaya maricaye || ||
    bahushringaya lingaya mahashringaya te namah | mangalyaya manojnaya mantavyaya mahatmane || || mahadevaya
    devaya matulingadharaya ca | mahamayaprasutaya prastutaya ca mayine || || anantanantarupaya mayine
    jalashayine | mahodaraya mandaya madadaya madaya ca || || madhukaitabhahantre ca madhavaya muraraye
    | mahaviryaya dhairyaya citraviryaya te namah || || citrakurmaya citraya namaste citrabhanave | mayatitaya
    mayaya mahaviraya te namah || || mahatejaya bijaya tejodhamne ca bijine | tejomayanrisimhaya namaste
    citrabhanave || || mahadamshtraya tushtaya namah pushtikaraya ca | shipivishtaya hrishtaya pushtaya
    parameshthine || || vishishtaya ca shishtaya garishthayeshtadayine | namo jyeshthaya shreshthaya tushtayamitatejase
    || || ashtanganyastarupaya sarvadushtantakaya ca | vaikunthaya vikunthaya keshikanthaya te namah ||
    || kanthiravaya lunthaya nishshathaya hathaya ca | satvodriktaya rudraya rigyajussamagaya ca || ||
    ritudhvajaya vajraya mantrarajaya mantrine | trinetraya trivargaya tridhamne ca trishuline || || trikalajnanarupaya
    tridehaya tridhatmane | namastrimurtividyaya tritattvajnanine namah || || akshobhyayaniruddhaya aprameyaya
    bhanave | amritaya anantaya amitayamitaujase || || apamrityuvinashaya apasmaravighatine | annadayannarupaya
    annayannabhuje namah || || nadyaya niravadyaya vidyayadbhutakarmane | sadyojataya sanghaya vaidyutaya
    namo namah || || adhvatitaya sattvaya vagatitaya vagmine | vagishvaraya gopaya gohitaya gavam pate
    || || gandharvaya gabhiraya garjitayorjitaya ca | parjanyaya prabuddhaya pradhanapurushaya ca || ||
    padmabhaya sunabhaya padmanabhaya manine | padmanetraya padmaya padmayah pataye namah || || padmodaraya
    putaya padmakalpodbhavaya ca | namo hritpadmavasaya bhupadmoddharanaya ca || || shabdabrahmasvarupaya
    brahmarupadharaya ca | brahmane brahmarupaya padmanetraya te namah || || brahmadaya brahmanaya brahmabrahmatmane
    namah | subrahmanyaya devaya brahmanyaya trivedine || || parabrahmasvarupaya pancabrahmatmane namah
    | namaste brahmashirase tatha''shvashirase namah || || atharvashirase nityamashanipramitaya ca | namaste
    tikshnadamshtraya lolaya lalitaya ca || || lavanyaya lavitraya namaste bhasakaya ca | lakshanajnaya
    lakshaya lakshanaya namo namah || || lasaddiptaya liptaya vishnave prabhavishnave | vrishnimulaya
    krishnaya shrimahavishnave namah || || pashyami tvam mahasimham harinam vanamalinam | kiritinam kundalinam
    sarvangam sarvatomukham || || sarvatah panipadorah sarvato''kshishiromukham | sarveshvaram sadatushtam
    samartham samarapriyam || || bahuyojanavistirnam bahuyojanamayatam | bahuyojanahastanghrim bahuyojananasikam
    || || maharupam mahavaktram mahadamshtram mahabhujam | mahanadam maharaudram mahakayam mahabalam ||
    || anabherbrahmano rupamagaladvaishnavam tatha | ashirshadrudramishanam tadagre sarvatah shivam ||
    || namo''stu narayananarasimha namo''stu narayanavirasimha | namo''stu narayanakrurasimha namo''stu
    narayanadivyasimha || || namo''stu narayanavyaghrasimha namo''stu narayanapucchasimha | namo''stu
    narayanapurnasimha namo''stu narayanaraudrasimha || || namo namo bhishanabhadrasimha namo namo vihvalanetrasimha
    | namo namo brimhitabhutasimha namo namo nirmalacitrasimha || || namo namo nirjitakalasimha namo namah
    kalpitakalpasimha | namo namo kamadakamasimha namo namaste bhuvanaikasimha || || dyavaprithivyoridamantaram
    hi vyaptam tvayaikena dishashca sarvah | drishtvadbhutam rupamugram tavedam lokatrayam pravyathitam
    mahatman || || ami hitva surasangha vishanti kecidbhitah pranjalayo grinanti | svastityuktva munayah
    siddhasanghah stuvanti tvam stutibhih pushkalabhih || || rudradityavasavo ye ca sadhya vishvedeva
    marutashcoshmapashca | gandharvayakshasurasiddhasangha vikshanti tvam vismitashcaiva sarve || || lelihyase
    grasamanah samanta llokan samagranvadanairjvaladbhih | tejobhirapurya jagatsamagram bhasastavograh
    pratapanti vishno || || bhavishnustvam sahishnustvam bhrajishnurjishnureva ca | prithivimantariksham
    tvam parvataranyameva ca || || kalakashthaviliptastvam muhurtapraharadikam | ahoratram trisandhya
    ca pakshamasartuvatsarah || || yugadiryugabhedastvam samyugo yugasandhayah | nityam naimittikam dainam
    mahapralayameva ca || || karanam karanam karta bharta harta tvamishvarah | satkarta satkritirgopta
    saccidanandavigrahah || || pranastvam praninam pratyagatma tvam sarvadehinam | sujyotistvam paranjyotiratmajyotih
    sanatanah || || jyotirlokasvarupastvam jno jyotirjyotisham patih | svahakarah svadhakaro vashatkarah
    kripakarah || || hantakaro nirakaro vegakarashca shankarah | akaradihakaranta onkaro lokakarakah ||
    || ekatma tvamanekatma caturatma caturbhujah | caturmurtishcaturdamshtrashcaturvedamayottamah || ||
    lokapriyo lokagururlokesho lokanayakah | lokasakshi lokapatirlokatma lokalocanah || || lokadharo brihalloko
    lokalokamayo vibhuh | lokakarta vishvakarta kritavartah kritagamah || || anadistvamanantastvamabhuto
    bhutavigrahah | stutih stutyah stavapritah stota neta niyamakah || || tvam gatistvam matirmahyam pita
    mata guruh sakha | suhridashcatmarupastvam tvam vina nasti me gatih || || namaste mantrarupaya astrarupaya
    te namah | bahurupaya rupaya pancarupadharaya ca || || bhadrarupaya rudhaya yogarupaya yogine | samarupaya
    yogaya yogapithasthitaya ca || || yogagamyaya saumyaya dhyanagamyaya dhyayine | dhyeyagamyaya dhamne
    ca dhamadhipataye namah || || dharadharaya dharmaya dharanabhirataya ca | namo dhatre ca sandhatre
    vidhatre ca dharaya ca || || damodaraya dantaya danavantakaraya ca | namah samsaravaidyaya bheshajaya
    namo namah || || siradhvajaya shitaya vatayapramitaya ca | sarasvataya samsaranashanayakshamaline
    || || asicarmadharayaiva shatkarmanirataya ca | vikarmaya sukarmaya parakarmavidhayine || || susharmane
    manmathaya namo varmaya varmine | karicarmavasanaya karalavadanaya ca || || kavaye padmagarbhaya bhutagarbha
    ghrinanidhe | brahmagarbhaya garbhaya brihadgarbhaya dhurjate || || namaste vishvagarbhaya shrigarbhaya
    jitaraye | namo hiranyagarbhaya hiranyakavacaya ca || || hiranyavarnadehaya hiranyakshavinashine |
    hiranyakashiporhantre hiranyanayanaya ca || || hiranyaretase tubhyam hiranyavadanaya ca | namo hiranyashringaya
    nihshringaya ca shringine || || bhairavaya sukeshaya bhishanayantramaline | candaya rundamalaya namo
    dandadharaya ca || || akhandatattvarupaya kamandaludharaya ca | namaste khandasimhaya satyasimhaya
    te namah || || namaste shvetasimhaya pitasimhaya te namah | nilasimhaya nilaya raktasimhaya te namah
    || || namo haridrasimhaya dhumrasimhaya te namah | mulasimhaya mulaya brihatsimhaya te namah || ||
    patalasthitasimhaya namah parvatavasine | namo jalasthasimhaya antarikshasthitaya ca || || kalagnirudrasimhaya
    candasimhaya te namah | anantasimhasimhaya anantagataye namah || || namo vicitrasimhaya bahusimhasvarupine
    | abhayankarasimhaya narasimhaya te namah || || namo''stu simharajaya narasimhaya te namah | saptabdhimekhalayaiva
    satyasatyasvarupine || || saptalokantarasthaya saptasvaramayaya ca | saptarcirupadamshtraya saptashvaratharupine
    || || saptavayusvarupaya saptacchandomayaya ca | svacchaya svaccharupaya svacchandaya ca te namah
    || || shrivatsaya suveshaya shrutaye shrutimurtaye | shucishravaya shuraya suprabhaya sudhanvine ||
    || shubhraya suranathaya suprabhaya shubhaya ca | sudarshanaya sukshmaya niruktaya namo namah || ||
    suprabhaya svabhavaya bhavaya vibhavaya ca | sushakhaya vishakhaya sumukhaya mukhaya ca || || sunakhaya
    sudamshtraya surathaya sudhaya ca | sankhyaya suramukhyaya prakhyataya prabhaya ca || || namah khatvangahastaya
    khetamudgarapanaye | khagendraya mrigendraya nagendraya dridhaya ca || || nagakeyuraharaya nagendrayaghamardine
    | nadivasaya nagnaya nanarupadharaya ca || || nageshvaraya nagaya namitaya naraya ca | nagantakarathayaiva
    naranarayanaya ca || || namo matsyasvarupaya kacchapaya namo namah | namo yajnavarahaya narasimhaya
    te namah || || vikramakrantalokaya vamanaya mahaujase | namo bhargavaramaya ravanantakaraya ca ||
    || namaste balaramaya kamsapradhvamsakarine | buddhaya buddharupaya tikshnarupaya kalkine || || atreyayagninetraya
    kapilaya dvijaya ca | kshetraya pashupalaya pashuvaktraya te namah || || grihasthaya vanasthaya yataye
    brahmacarine | svargapavargadatre ca tadbhoktre ca mumukshave || || shalagramanivasaya kshirabdhishayanaya
    ca | shrishailadrinivasaya shilavasaya te namah || || yogihritpadmavasaya mahahasaya te namah | guhavasaya
    guhyaya guptaya gurave namah || || namo muladhivasaya nilavastradharaya ca | pitavastraya shastraya
    raktavastradharaya ca || || raktamalavibhushaya raktagandhanulepine | dhurandharaya dhurtaya durdharaya
    dharaya ca || || durmadaya durantaya durdharaya namo namah | durnirikshyaya nishthaya durdarshaya
    drumaya ca || || durbhedaya durashaya durlabhaya namo namah | driptaya driptavaktraya adriptanayanaya
    ca || || unmattaya pramattaya namo daityaraye namah | rasajnaya raseshaya araktarasanaya ca || ||
    pathyaya paritoshaya rathyaya rasikaya ca | urdhvakeshordhvarupaya namaste cordhvaretase || || urdhvasimhaya
    simhaya namaste cordhvabahave | parapradhvamsakayaiva shankhacakradharaya ca || || gadapadmadharayaiva
    pancabanadharaya ca | kameshvaraya kamaya kamapalaya kamine || || namah kamaviharaya kamarupadharaya
    ca | somasuryagninetraya somapaya namo namah || || namah somaya vamaya vamadevaya te namah | samasvanaya
    saumyaya bhaktigamyaya vai namah || || kushmandagananathaya sarvashreyaskaraya ca | bhishmaya bhishadayaiva
    bhimavikramanaya ca || || mrigagrivaya jivaya jitayajitakarine | jatine jamadagnyaya namaste jatavedase
    || || japakusumavarnaya japyaya japitaya ca | jarayujayandajaya svedajayodbhijaya ca || || janardanaya
    ramaya jahnavijanakaya ca | jarajanmadiduraya pradyumnaya pramodine || || jihvaraudraya rudraya virabhadraya
    te namah | cidrupaya samudraya kadrudraya pracetase || || indriyayendriyajnaya namo''stvindranujaya
    ca | atindriyaya saraya indirapataye namah || || ishanaya ca idyaya ishitaya inaya ca | vyomatmane
    ca vyomne ca namaste vyomakeshine || || vyomadharaya ca vyomavaktrayasuraghatine | namaste vyomadamshtraya
    vyomavasaya te namah || || sukumaraya ramaya shubhacaraya vai namah | vishvaya vishvarupaya namo vishvatmakaya
    ca || || jnanatmakaya jnanaya vishveshaya paratmane | ekatmane namastubhyam namaste dvadashatmane
    || || caturvimshatirupaya pancavimshatimurtaye | shadvimshakatmane nityam saptavimshatikatmane ||
    || dharmarthakamamokshaya viraktaya namo namah | bhavashuddhaya siddhaya sadhyaya sharabhaya ca ||
    || prabodhaya subodhaya namo buddhipriyaya ca | snigdhaya ca vidagdhaya mugdhaya munaye namah || ||
    priyamvadaya shravyaya sruksruvaya shritaya ca | griheshaya maheshaya brahmeshaya namo namah || ||
    shridharaya sutirthaya hayagrivaya te namah | ugraya ugravegaya ugrakarmarataya ca || || ugranetraya
    vyagraya samagragunashaline | balagrahavinashaya pishacagrahaghatine || || dushtagrahanihantre ca
    nigrahanugrahaya ca | vrishadhvajaya vrishnyaya vrishaya vrishabhaya ca || || ugrashravaya shantaya
    namah shrutidharaya ca | namaste devadevesha namaste madhusudana || || namaste pundarikaksha namaste
    duritakshaya | namaste karunasindho namaste samitinjaya || || namaste narasimhaya namaste garudadhvaja
    | yajnanetra namaste''stu kaladhvaja jayadhvaja || || agninetra namaste''stu namaste hyamarapriya
    | mahanetra namaste''stu namaste bhaktavatsala || || dharmanetra namaste''stu namaste karunakara |
    punyanetra namaste''stu namaste''bhishtadayaka || || namo namaste jayasimharupa namo namaste narasimharupa
    | namo namaste ranasimharupa namo namaste narasimharupa || || uddhritya garvitam daityam nihatyajau
    suradvisham | devakaryam mahatkritva garjase svatmatejasa || || atiraudramidam rupam dussaham duratikramam
    | drishtva tu shankitah sarva devatastvamupagatah || || etanpashya maheshanam brahmanam mam shacipatim
    | dikpalan dvadashadityan rudranuragarakshasan || || sarvan rishiganan saptamatrirgaurim sarasvatim
    | lakshmim nadishca tirthani ratim bhutagananyapi || || prasida tvam mahasimha ugrabhavamimam tyaja
    | prakritistho bhava tvam hi shantibhavam ca dharaya || || ityuktva dandavadbhumau papata sa pitamahah
    | prasida tvam prasida tvam prasideti punah punah || || markandeya uvaca | drishtva tu devatah sarvah
    shrutva tam brahmano giram | stotrenapi ca samhrishtah saumyabhavamadharayat || || abravinnarasimhastu
    vikshya sarvan surottaman | santrastan bhayasamvignan sharanam samupagatan || || shrinrisimha uvaca
    | bho bho devavarah sarve pitamahapurogamah | shrinudhvam mama vakyam ca bhavantu vigatajvarah ||
