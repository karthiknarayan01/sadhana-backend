id: shivamangalastotram
category: stotram
name:
  english: shivamangalastotram
  devanagari: शिवमन्गलस्तोत्रम्
content:
  english: '|| 3|| girindrasya ca menayastrailokyasya tapahphale | parvatya janmadivase tanme bhavatu
    mangalam || 4|| tripuram hantukamasya didhakshorandhakasuram | bhavanya yatkritam bhartustanme bhavatu
    mangalam || 5|| ishvarajnanuyatasya virabhadrasya shulina | yatkritam mangalam karyam tanme bhavatu
    mangalam || 6|| harabhushanakeyuralilabhujagabhushayoh | shivayoh sadrishodvahe tanme bhavatu mangalam
    || 7|| yah shivo namarupabhyam ya devi sarvamangala | tayoh samsaranat pumsam sarvato jayamangalam
    || 8|| || iti shrishivamangalastotram sampurnam ||'
  devanagari: ॥ ३॥ गिरीन्द्रस्य च मेनायास्त्रैलोक्यस्य तपःफले । पार्वत्या जन्मदिवसे तन्मे भवतु मङ्गलम्
    ॥ ४॥ त्रिपुरं हन्तुकामस्य दिधक्षोरन्धकासुरम् । भवान्या यत्कृतं भर्तुस्तन्मे भवतु मङ्गलम् ॥ ५॥ ईश्वराज्ञानुयातस्य
    वीरभद्रस्य शूलिना । यत्कृतं मङ्गलं कार्यं तन्मे भवतु मङ्गलम् ॥ ६॥ हारभूषणकेयूरलीलाभुजगभूषयोः । शिवयोः
    सदृशोद्वाहे तन्मे भवतु मङ्गलम् ॥ ७॥ यः शिवो नामरूपाभ्यां या देवी सर्वमङ्गला । तयोः संसरणात् पुंसां
    सर्वतो जयमङ्गलम् ॥ ८॥ ॥ इति श्रीशिवमङ्गलस्तोत्रं सम्पूर्णम् ॥
