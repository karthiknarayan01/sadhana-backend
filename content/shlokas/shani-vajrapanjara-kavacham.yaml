id: shani-vajrapanjara-kavacham
category: stotram
name:
  english: Shani Vajrapanjara Kavacham
content:
  english: nilambaro nilavapuh kiriti gridhrasthitastrakaro dhanushman | caturbhujah suryasutah prasannah
    sada mamasyadvaradah prashantah || brahma uvaca | shrinudhvam rishayah sarve shani pidaharam mahat
    | kavacam shanirajasya saurairidamanuttamam || kavacam devatavasam vajra panjara samngakam | shanaishcara
    pritikaram sarvasaubhagyadayakam || atha shri shani vajra panjara kavacam | om shri shanaishcarah
    patu phalam me suryanandanah | netre chayatmajah patu patu karnau yamanujah || || nasam vaivasvatah
    patu mukham me bhaskarah sada | snigdhakanthashca me kantham bhujau patu mahabhujah || || skandhau
    patu shanishcaiva karau patu shubhapradah | vakshah patu yamabhrata kukshim patvasitastatha || ||
    nabhim grahapatih patu mandah patu katim tatha | uru mamantakah patu yamo januyugam tatha || || padau
    mandagatih patu sarvangam patu pippalah | angopangani sarvani rakshen me suryanandanah || || phalashrutih
    ityetatkavacam divyam pathetsuryasutasya yah | na tasya jayate pida prito bhavati suryajah || vyayajanmadvitiyastho
    mrityusthanagatopiva | kalatrastho gatovapi supritastu sada shanih || ashtamastho suryasute vyaye
    janmadvitiyage | kavacam pathate nityam na pida jayate kvacit || ityetatkavacam divyam saureryannirmitam
    pura | dvadashashtamajanmasthadoshannashayate sada | janmalagnasthitan doshan sarvannashayate prabhuh
    || iti shri brahmandapurane brahmanaradasamvade shanivajrapanjara kavacam sampurnam ||
  devanagari: नीलाम्बरो नीलवपुः किरीटी गृध्रस्थितास्त्रकरो धनुष्मान् । चतुर्भुजः सूर्यसुतः प्रसन्नः सदा
    ममस्याद्वरदः प्रशान्तः ॥ ब्रह्मा उवाच । शृणुध्वं ऋषयः सर्वे शनि पीडाहरं महत् । कवचं शनिराजस्य सौरैरिदमनुत्तमम्
    ॥ कवचं देवतावासं वज्र पञ्जर संङ्गकम् । शनैश्चर प्रीतिकरं सर्वसौभाग्यदायकम् ॥ अथ श्री शनि वज्र पञ्जर
    कवचम् । ॐ श्री शनैश्चरः पातु फालं मे सूर्यनन्दनः । नेत्रे छायात्मजः पातु पातु कर्णौ यमानुजः ॥ ॥ नासां
    वैवस्वतः पातु मुखं मे भास्करः सदा । स्निग्धकण्ठश्च मे कण्ठं भुजौ पातु महाभुजः ॥ ॥ स्कन्धौ पातु शनिश्चैव
    करौ पातु शुभप्रदः । वक्षः पातु यमभ्राता कुक्षिं पात्वसितस्तथा ॥ ॥ नाभिं ग्रहपतिः पातु मन्दः पातु कटिं
    तथा । ऊरू ममान्तकः पातु यमो जानुयुगं तथा ॥ ॥ पादौ मन्दगतिः पातु सर्वाङ्गं पातु पिप्पलः । अङ्गोपाङ्गानि
    सर्वाणि रक्षेन् मे सूर्यनन्दनः ॥ ॥ फलश्रुतिः इत्येतत्कवचं दिव्यं पठेत्सूर्यसुतस्य यः । न तस्य जायते
    पीडा प्रीतो भवति सूर्यजः ॥ व्ययजन्मद्वितीयस्थो मृत्युस्थानगतोपिवा । कलत्रस्थो गतोवापि सुप्रीतस्तु
    सदा शनिः ॥ अष्टमस्थो सूर्यसुते व्यये जन्मद्वितीयगे । कवचं पठते नित्यं न पीडा जायते क्वचित् ॥ इत्येतत्कवचं
    दिव्यं सौरेर्यन्निर्मितं पुरा । द्वादशाष्टमजन्मस्थदोषान्नाशयते सदा । जन्मलग्नस्थितान् दोषान् सर्वान्नाशयते
    प्रभुः ॥ इति श्री ब्रह्माण्डपुराणे ब्रह्मनारदसंवादे शनिवज्रपञ्जर कवचं सम्पूर्णम् ॥
