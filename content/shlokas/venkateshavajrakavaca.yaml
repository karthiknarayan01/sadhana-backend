id: venkateshavajrakavaca
category: kavacha
name:
  english: venkateshavajrakavaca
  devanagari: वेन्कतेशवज्रकवच
content:
  english: tadeva kavacam mama sahasrashirsha purusho venkateshashshirovatu | praneshah prananilayah pranan
    rakshatu me harih || 2|| akasharat sutanatha atmanam me sadavatu | devadevottamah paya ddeham me venkateshvarah
    || 3|| sarvatra sarvakaleshu mamgambajanirishvarah | palayenmam karmasaphalyam sah prayaccha || 4||
  devanagari: तदेव कवचं मम सहस्रशीर्षा पुरुषो वेङ्कटेशश्शिरोवतु । प्राणेशः प्राणनिलयः प्राणान् रक्षतु
    मे हरिः ॥ २॥ आकाशराट् सुतानाथ आत्मानं मे सदावतु । देवदेवोत्तमः पाया द्देहं मे वेङ्कटेश्वरः ॥ ३॥ सर्वत्र
    सर्वकालेषु मंगांबाजानिरीश्वरः । पालयेन्मां कर्मसाफल्यं सः प्रयच्छ ॥ ४॥
meaning: {}
