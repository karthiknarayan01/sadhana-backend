id: ganeshastotrambanasurakritam
category: stotram
name:
  english: ganeshastotrambanasurakritam
  devanagari: गणेशस्तोत्रम्बाणासुरकृतं
content:
  english: banasurakritam shriganeshastotram || shriganeshaya namah || banasura uvaca | vighneshaya pareshaya
    bhaktavighnavidarine | abhaktavighnakartre te vighnavighnaya vai namah || 49|| vinayakaya devesha
    daityeshanayakaya te | nirankushaya satatyam ganeshaya namo namah || 50|| jyeshtharajaya jyeshthaya
    jyeshthapujyaya te namah | sarvapujyadipujyaya pareshesha namo namah || 51|| lambodaraya sarvaya matre
    pitre tadatmane | adimadhyantahinaya herambaya namo namah || 52|| shurpakarnaya shuraya mohandhakavidarine
    | brahmeshaya sushantaya shantidatre namo namah || 53|| ekadantaya devaya svanande vasakarine | ameyayapratarkyaya
    mayine te namo namah || 54|| mayamayikarupaya mayamayikavarjita | anathanam pranathaya nathanathaya
    te namah || 55|| siddhibuddhipate tubhyam sada yogaparayana | yogindranam suyogaya kuladevaya te namah
    || 56|| tvadadhinamidam sarvam buddhicalakarupine | siddhya sammohitam natha siddhidatre namo namah
    || 57|| shivadayah samarthashca tvadiyakripaya'bhavan | ahankarena yuktashcedbhrashtah svasvadhikaratah
    || 58|| maya te'jnanabhavena tvam tyaktah shivakamyaya | mam shaptva tyajya sah shambhurgatah krodhaparayanah
    || 59|| ato mam raksha vighnesha tvannatham nathavarjitam | aparadhan mahogran me kshantva pahi nirantaram
    || 60|| evam stutva ganeshanam prananama ruroda ca | banah paramaduhkhartah padam grihya mahatmanah
    || 61|| tamutthapya ganadhishastam jagada mahasuram | svamayamohitam dinam svasvaiva sharanarthinam
    || 62||
  devanagari: बाणासुरकृतं श्रीगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ बाणासुर उवाच । विघ्नेशाय परेशाय भक्तविघ्नविदारिणे
    । अभक्तविघ्नकर्त्रे ते विघ्नविघ्नाय वै नमः ॥ ४९॥ विनायकाय देवेश दैत्येशनायकाय ते । निरङ्कुशाय सातत्यं
    गणेशाय नमो नमः ॥ ५०॥ ज्येष्ठराजाय ज्येष्ठाय ज्येष्ठपूज्याय ते नमः । सर्वपूज्यादिपूज्याय परेशेश नमो
    नमः ॥ ५१॥ लम्बोदराय सर्वाय मात्रे पित्रे तदात्मने । आदिमध्यान्तहीनाय हेरम्बाय नमो नमः ॥ ५२॥ शूर्पकर्णाय
    शूराय मोहान्धकविदारिणे । ब्रह्मेशाय सुशान्ताय शान्तिदात्रे नमो नमः ॥ ५३॥ एकदन्ताय देवाय स्वानन्दे
    वासकारिणे । अमेयायाप्रतर्क्याय मायिने ते नमो नमः ॥ ५४॥ मायामायिकरूपाय मायामायिकवर्जित । अनाथानां प्रणाथाय
    नाथनाथाय ते नमः ॥ ५५॥ सिद्धिबुद्धिपते तुभ्यं सदा योगपरायण । योगीन्द्राणां सुयोगाय कुलदेवाय ते नमः
    ॥ ५६॥ त्वदधीनमिदं सर्वं बुद्धिचालकरूपिणे । सिद्ध्या सम्मोहितं नाथ सिद्धिदात्रे नमो नमः ॥ ५७॥ शिवादयः
    समर्थाश्च त्वदीयकृपयाऽभवन् । अहङ्कारेण युक्ताश्चेद्भ्रष्टाः स्वस्वाधिकारतः ॥ ५८॥ मया तेऽज्ञानभावेन
    त्वं त्यक्तः शिवकाम्यया । मां शप्त्वा त्यज्य सः शम्भुर्गतः क्रोधपरायणः ॥ ५९॥ अतो मां रक्ष विघ्नेश
    त्वन्नाथं नाथवर्जितम् । अपराधान् महोग्रान् मे क्षान्त्वा पाहि निरन्तरम् ॥ ६०॥ एवं स्तुत्वा गणेशानं
    प्रणनाम रुरोद च । बाणः परमदुःखार्तः पादं गृह्य महात्मनः ॥ ६१॥ तमुत्थाप्य गणाधीशस्तं जगाद महासुरम्
    । स्वमायामोहितं दीनं स्वस्वैव शरणार्थिनम् ॥ ६२॥
