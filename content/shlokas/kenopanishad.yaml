id: kenopanishad
category: upanishad
name:
  english: kenopanishad
  devanagari: केनोपनिषद्
content:
  english: brahma ha devebhyo vijigye tasya ha brahmano vijaye deva amahiyanta || 1 || ta aikshantasmakamevayam
    vijayo'smakamevayam mahimeti | taddhaisham vijajnau tebhyo ha pradurbabhuva tanna vyajanata kimidam
    yakshamiti || 2 || te'gnimabruvan jataveda etadvijanihi kimidam yakshamiti tatheti || 3 || tadabhyadravattamabhyavadatko'sityagnirva
    ahamasmityabravijjataveda va ahamasmiti || 4 || tasmi~stvayi kim viryamityapida~ sarvam daheyam yadidam
    prithivyamiti || 5 || tasmai trinam nidadhavetaddaheti | tadupapreyaya sarvajavena tanna shashaka
    dagdhum sa tata eva nivavrite naitadashakam vijnatum yadetadyakshamiti || 6 || atha vayumabruvanvayavetadvijanihi
    kimetadyakshamiti tatheti || 7 || tadabhyadravattamabhyavadatko'siti vayurva ahamasmityabravinmatarishva
    va ahamasmiti || 8 || tasmi~stvayi kim viryamityapida~ sarvamadadiya yadidam prithivyamiti || 9 ||
    tasmai trinam nidadhavetadadatsveti tadupapreyaya sarvajavena tanna shashakadatum
  devanagari: ब्रह्म ह देवेभ्यो विजिग्ये तस्य ह ब्रह्मणो विजये देवा अमहीयन्त ॥ १ ॥ त ऐक्षन्तास्माकमेवायं
    विजयोऽस्माकमेवायं महिमेति । तद्धैषां विजज्ञौ तेभ्यो ह प्रादुर्बभूव तन्न व्यजानत किमिदं यक्षमिति ॥
    २ ॥ तेऽग्निमब्रुवन् जातवेद एतद्विजानीहि किमिदं यक्षमिति तथेति ॥ ३ ॥ तदभ्यद्रवत्तमभ्यवदत्कोऽसीत्यग्निर्वा
    अहमस्मीत्यब्रवीज्जातवेदा वा अहमस्मीति ॥ ४ ॥ तस्मिँस्त्वयि किं वीर्यमित्यपीदँ सर्वं दहेयं यदिदं पृथिव्यामिति
    ॥ ५ ॥ तस्मै तृणं निदधावेतद्दहेति । तदुपप्रेयाय सर्वजवेन तन्न शशाक दग्धुं स तत एव निववृते नैतदशकं विज्ञातुं
    यदेतद्यक्षमिति ॥ ६ ॥ अथ वायुमब्रुवन्वायवेतद्विजानीहि किमेतद्यक्षमिति तथेति ॥ ७ ॥ तदभ्यद्रवत्तमभ्यवदत्कोऽसीति
    वायुर्वा अहमस्मीत्यब्रवीन्मातरिश्वा वा अहमस्मीति ॥ ८ ॥ तस्मिँस्त्वयि किं वीर्यमित्यपीदँ सर्वमाददीय
    यदिदं पृथिव्यामिति ॥ ९ ॥ तस्मै तृणं निदधावेतदादत्स्वेति तदुपप्रेयाय सर्वजवेन तन्न शशाकादतुम्
