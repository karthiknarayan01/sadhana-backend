id: kathopanishad-chapter-2-valli-1
category: stotram
name:
  english: Kathopanishad - Chapter 2, Valli 1
content:
  english: parancikhani vyatrinatsvayambhustasmatparanpashyati nantaratman| kashciddhirah pratyagatmanamaikshadavrittacakshuramritatvamicchann
    || || paracah kamananuyanti balaste mrityoryanti vitatasya pasham| atha dhira amritatvam vi~ditva
    dhruvamadhruveshviha na prarthayante || ngandham shabdanspar shamshca maithunan| etenaiva vijanati
    kimatra parishishyate| etadvai tat || ncobhau yenanupashyati| mahantam mmatva dhiro na shocati ||
    njivamantikat| ishana mbhutabhavyasya na tato vijugupsate| etadvai tat || ntapaso jatamadbhyah purvamajayata|
    guha mpravishya tishthantam yo~ bhutebhirvyapashyata| etadvai tat || || ya pranena sambhavatyaditirdevatamayi|
    guha mpravishya tishthantim ya~ bhutebhirvyajayata| etadvai tat || || aranyornihito jataveda garbha
    iva subhrito garbhinibhih| dive dive idyo jagrivadbhir havishmadbhirmanushyebhiragnih| etadvai tat
    || 'rpitastadu natyeti kashcana| etadvai tat || || yadeveha tadamutra yadamutra tadanviha| mrityo
    ssa mrityumapnoti ya iha naneva pashyati || 'sti kincana| mrityo ngacchati ya iha naneva pashyati
    || || angushthamatrah purusho madhya atmani tishthati| ishano bhutabhavyasya na tato vijugupsate|
    etadvai tat || || angushthamatrah purusho jyotirivadhumakah| ishano bhutabhavyasya sa evadya sa u
    shvah| etadvai tat || mparvateshu vidhavati| eva kpashyamstanevanuvidhavati || || yathodakam shuddhe
    shuddhamasikta mmunervijanata atma bhavati gautama ||
  devanagari: पराञ्चिखानि व्यतृणत्स्वयम्भूस्तस्मात्पराङ्पश्यति नान्तरात्मन्। कश्चिद्धीरः प्रत्यगात्मानमैक्षदावृत्तचक्षुरमृतत्वमिच्छन्न्
    ॥ ॥ पराचः कामाननुयन्ति बालास्ते मृत्योर्यन्ति विततस्य पाशम्। अथ धीरा अमृतत्वं विँदित्वा ध्रुवमध्रुवेष्विह
    न प्रार्थयन्ते ॥ ङ्गन्धं शब्दान्स्पर् शांश्च मैथुनान्। एतेनैव विजानाति किमत्र परिशिष्यते। एतद्वै तत्
    ॥ ञ्चोभौ येनानुपश्यति। महान्तं म्मत्वा धीरो न शोचति ॥ ञ्जीवमन्तिकात्। ईशान म्भूतभव्यस्य न ततो विजुगुप्सते।
    एतद्वै तत् ॥ न्तपसो जातमद्भ्यः पूर्वमजायत। गुहा म्प्रविश्य तिष्ठन्तं योँ भूतेभिर्व्यपश्यत। एतद्वै
    तत् ॥ ॥ या प्राणेन सम्भवत्यदितिर्देवतामयी। गुहा म्प्रविश्य तिष्ठन्तीं याँ भूतेभिर्व्यजायत। एतद्वै
    तत् ॥ ॥ अरण्योर्निहितो जातवेदा गर्भ इव सुभृतो गर्भिणीभिः। दिवे दिवे ईड्यो जागृवद्भिर् हविष्मद्भिर्मनुष्येभिरग्निः।
    एतद्वै तत् ॥ ऽर्पितास्तदु नात्येति कश्चन। एतद्वै तत् ॥ ॥ यदेवेह तदमुत्र यदमुत्र तदन्विह। मृत्यो स्स
    मृत्युमाप्नोति य इह नानेव पश्यति ॥ ऽस्ति किञ्चन। मृत्यो ङ्गच्छति य इह नानेव पश्यति ॥ ॥ अङ्गुष्ठमात्रः
    पुरुषो मध्य आत्मनि तिष्ठति। ईशानो भूतभव्यस्य न ततो विजुगुप्सते। एतद्वै तत् ॥ ॥ अङ्गुष्ठमात्रः पुरुषो
    ज्योतिरिवाधूमकः। ईशानो भूतभव्यस्य स एवाद्य स उ श्वः। एतद्वै तत् ॥ म्पर्वतेषु विधावति। एव क्पश्यंस्तानेवानुविधावति
    ॥ ॥ यथोदकं शुद्धे शुद्धमासिक्त म्मुनेर्विजानत आत्मा भवति गौतम ॥
