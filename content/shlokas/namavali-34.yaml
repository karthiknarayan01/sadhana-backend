id: namavali-34
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: namah | shrishyamayai namah | shrishyamangyai namah | shrishyamamurttikayai namah | shrishobhayai
    namah | shrisubhagayai namah | shrishobhanayai namah | shribhuvaneshvaryai namah | 50 shriraktangyai
    namah | shriraktanayanayai namah | shriraktakshyai namah | shriraktalocanayai namah | shrirevatyai
    namah | shrirukminyai namah | shriradhayai namah | shriraudryai namah | shriramayai namah | shrirajogunayai
    namah | 60 shriramyayai namah | shriramaniyayai namah | shriramakridavatyai namah | shriramarcitayai
    namah | shriramapujyayai namah | shriranginyai namah | shriramavallabhayai
  devanagari: नमः । श्रीश्यामायै नमः । श्रीश्यामाङ्ग्यै नमः । श्रीश्याममूर्त्तिकायै नमः । श्रीशोभायै नमः
    । श्रीसुभगायै नमः । श्रीशोभनायै नमः । श्रीभुवनेश्वर्यै नमः । ५० श्रीरक्ताङ्ग्यै नमः । श्रीरक्तनयनायै
    नमः । श्रीरक्ताक्ष्यै नमः । श्रीरक्तलोचनायै नमः । श्रीरेवत्यै नमः । श्रीरुक्मिण्यै नमः । श्रीराधायै
    नमः । श्रीरौद्र्यै नमः । श्रीरामायै नमः । श्रीरजोगुणायै नमः । ६० श्रीरम्यायै नमः । श्रीरमणीयायै नमः
    । श्रीरामक्रीडावत्यै नमः । श्रीरामार्चितायै नमः । श्रीरामपूज्यायै नमः । श्रीरङ्गिन्यै नमः । श्रीरामवल्लभायै
meaning: {}
