id: subrahmanya-stotram-neelakantha-vahanam
category: stotram
name:
  english: Subrahmanya Stotram (Neelakantha Vahanam)
  devanagari: सुब्रह्मण्यस्तोत्रम् २ (शरणागतमातुरम्)
content:
  english: '|| subrahmanyastotram 2 || shriganeshaya namah || sharanagatamaturamadhijitam karunakara kamada
    kamahatam | sharakananasambhavacaruruce paripalaya taraka maraka mam || 1|| harasarasamudbhava haimavatikarapallavalalita
    kamratano | muravairivirincimudambunidhe paripalaya taraka maraka mam || 2|| girijasuta sayakabhinnagire
    surasindhutanuja suvarnaruce | shishijashikhanala vahana he paripalaya taraka maraka mam || 3|| jaya
    viprajanapriya vira namo jaya bhaktajanapriya bhadra namah | jaya deva vishakhakumara namah paripalaya
    taraka maraka mam || 4|| purato bhava me parito bhava me pathi me bhagavan bhava raksha gatam | vitarajishu
    me vijayam bhagavan paripalaya taraka maraka mam || 5|| sharadindusamanashadananaya sarasiruhacaruvilocanaya
    | nirupadhikaya nijabalajaya paripalaya taraka maraka mam || 6|| iti kukkutaketumanusmaratah pathatamapi
    shanmukhashatkamidam | namatamapi nandanamindubhrito na bhayam kvacidasti shariramritam || 7|| iti
    subrahmanyastotram sampurnam ||'
  devanagari: ॥ सुब्रह्मण्यस्तोत्रम् २ ॥ श्रीगणेशाय नमः ॥ शरणागतमातुरमाधिजितं करुणाकर कामद कामहतम् । शरकाननसम्भवचारुरुचे
    परिपालय तारक मारक माम् ॥ १॥ हरसारसमुद्भव हैमवतीकरपल्लवलालित कम्रतनो । मुरवैरिविरिञ्चिमुदम्बुनिधे परिपालय
    तारक मारक माम् ॥ २॥ गिरिजासुत सायकभिन्नगिरे सुरसिन्धुतनूज सुवर्णरुचे । शिशिजाशिखानल वाहन हे परिपालय
    तारक मारक माम् ॥ ३॥ जय विप्रजनप्रिय वीर नमो जय भक्तजनप्रिय भद्र नमः । जय देव विशाखकुमार नमः परिपालय
    तारक मारक माम् ॥ ४॥ पुरतो भव मे परितो भव मे पथि मे भगवन् भव रक्ष गतम् । वितराजिषु मे विजयं भगवन् परिपालय
    तारक मारक माम् ॥ ५॥ शरदिन्दुसमानषडाननया सरसीरुहचारुविलोचनया । निरुपाधिकया निजबालजया परिपालय तारक मारक
    माम् ॥ ६॥ इति कुक्कुटकेतुमनुस्मरतः पठतामपि षण्मुखषट्कमिदम् । नमतामपि नन्दनमिन्दुभृतो न भयं क्वचिदस्ति
    शरीरमृताम् ॥ ७॥ इति सुब्रह्मण्यस्तोत्रं सम्पूर्णम् ॥
