id: ganeshastotramsadhukritam
category: stotram
name:
  english: ganeshastotramsadhukritam
  devanagari: गणेशस्तोत्रम्साधुकृतं
content:
  english: sadhukritam shriganeshastotram || shriganeshaya namah || sadhuruvaca | herambaya namastubhyam
    trinetraya paratmane | anakaraya devaya sakaraya namo namah || 21|| lambodaraya viraya shurpakarnaya
    dhundhaye | anadaye pareshaya ganeshaya namo namah || 22|| svanandavasine tubhyam bhaktabhavasvarupine
    | bhakteshaya subhaktya vai santushtaya namo namah || 23|| sarvakaraya sarvadipujyaya paramatmane
    | brahmeshaya gananam te palakaya namo namah || 24|| nirakaraya sarvesham pujyaya paramapriya | vighneshaya
    mahavighnaharine te namo namah || 25|| matre pitre samastanam tattvarupaya te namah | brahmane vishnave
    tubhyam shankaraya namo namah || 26|| shaktaye suryarupayendraya vayusvarupine | candraya varunayaiva
    yamaya te namo namah || 27|| agnaye nairritayaiva kuberaya dharadhara | naraya pashurupaya namo nagasuraya
    te || 28|| caracaramayayaiva caracaravivarjita | samaya sahajayaiva svasamvedyaya te namah || 29||
    yogaya shantinathaya shantidaya namo namah | kim staumi tvam ganadhisha yogakara namo namah || 30||
    dhanyo'ham sarvabhavena tavanghriyugadarshanat | varam dehi ganeshana tava bhaktim dridhatmikam ||
    31|| evam stutva ganadhisham sadhustam prananama ca | tamuvaca ganeshano bhaktam bhaktajanapriyah
    || 32||
  devanagari: साधुकृतं श्रीगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ साधुरुवाच । हेरम्बाय नमस्तुभ्यं त्रिनेत्राय
    परात्मने । अनाकाराय देवाय साकाराय नमो नमः ॥ २१॥ लम्बोदराय वीराय शूर्पकर्णाय ढुण्ढये । अनादये परेशाय
    गणेशाय नमो नमः ॥ २२॥ स्वानन्दवासिने तुभ्यं भक्तभावस्वरूपिणे । भक्तेशाय सुभक्त्या वै सन्तुष्टाय नमो
    नमः ॥ २३॥ सर्वाकाराय सर्वादिपूज्याय परमात्मने । ब्रह्मेशाय गणानां ते पालकाय नमो नमः ॥ २४॥ निराकाराय
    सर्वेषां पूज्याय परमप्रिय । विघ्नेशाय महाविघ्नहारिणे ते नमो नमः ॥ २५॥ मात्रे पित्रे समस्तानां तत्त्वरूपाय
    ते नमः । ब्रह्मणे विष्णवे तुभ्यं शङ्कराय नमो नमः ॥ २६॥ शक्तये सूर्यरूपायेन्द्राय वायुस्वरूपिणे । चन्द्राय
    वरुणायैव यमाय ते नमो नमः ॥ २७॥ अग्नये नैरृतायैव कुबेराय धराधर । नराय पशुरूपाय नमो नागासुराय ते ॥ २८॥
    चराचरमयायैव चराचरविवर्जित । समाय सहजायैव स्वसंवेद्याय ते नमः ॥ २९॥ योगाय शान्तिनाथाय शान्तिदाय नमो
    नमः । किं स्तौमि त्वां गणाधीश योगाकार नमो नमः ॥ ३०॥ धन्योऽहं सर्वभावेन तवाङ्घ्रियुगदर्शनात् । वरं
    देहि गणेशान तव भक्तिं दृढात्मिकाम् ॥ ३१॥ एवं स्तुत्वा गणाधीशं साधुस्तं प्रणनाम च । तमुवाच गणेशानो
    भक्तं भक्तजनप्रियः ॥ ३२॥
