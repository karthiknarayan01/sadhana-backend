id: shantipatha
category: veda
name:
  english: shantipatha
  devanagari: शान्तिपाथ
content:
  english: sastanubhih | vyashema devahitam yadayuh | svasti na indro vriddhashravah | svasti nah pusha
    vishvavedah | svasti nastarkshyo arishtanemih | svasti no brihaspatirdadhatu | om shantih shantih
    shantih || 4 om namo brahmane namo astvagnaye namah prithivyai nama oshadhibhyah | namo vace namo
    vacaspataye namo vishnave brihate karomi || om shantih shantih shantih || 5 om yashchandasamrishabho
    vishvarupah | chandobhyo'dhyamritathsambabhuva | sa mendro medhaya sprinotu | amritasya devadharano
    bhuyasam | shariram me vicarshanam | jihva me madhumattama | karnabhyam bhurivishruvam | brahmanah
    kosho'si medhaya pihitah | shrutam me gopaya | om shantih shantih shantih || 6 om taccham yoravrinimahe
    | gatum yajnaya | gatum yajnapataye | daivi svastirastu nah | svastirmanushebhyah | urdhvam jigatu
    bheshajam | sham no astu dvipade | sham catushpade || om shantih shantih shantih || 7 om namo vace
    ya codita ya canudita tasyai vace namo namo vace namo vacaspataye nama rishibhyo mantrakridbhyo mantrapatibhyo
    mamamrishayo mantrakrito mantrapatayah paradurma 'hamrishinmantrakrito mantrapatinparadam vaishvadevim
    vacamudyasa
  devanagari: सस्तनूभिः । व्यशेम देवहितं यदायुः । स्वस्ति न इन्द्रो वृद्धश्रवाः । स्वस्ति नः पूषा विश्ववेदाः
    । स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः । स्वस्ति नो बृहस्पतिर्दधातु । ॐ शान्तिः शान्तिः शान्तिः ॥ ४ ॐ
    नमो ब्रह्मणे नमो अस्त्वग्नये नमः पृथिव्यै नम ओषधीभ्यः । नमो वाचे नमो वाचस्पतये नमो विष्णवे बृहते करोमि
    ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ५ ॐ यश्छन्दसामृषभो विश्वरूपः । छन्दोभ्योऽध्यमृताथ्सम्बभूव । स मेन्द्रो
    मेधया स्पृणोतु । अमृतस्य देवधारणो भूयासम् । शरीरं मे विचर्षणम् । जिह्वा मे मधुमत्तमा । कर्णाभ्यां
    भूरिविश्रुवम् । ब्रह्मणः कोशोऽसि मेधया पिहितः । श्रुतं मे गोपाय । ॐ शान्तिः शान्तिः शान्तिः ॥ ६ ॐ
    तच्छं योरावृणीमहे । गातुं यज्ञाय । गातुं यज्ञपतये । दैवी स्वस्तिरस्तु नः । स्वस्तिर्मानुषेभ्यः । ऊर्ध्वं
    जिगातु भेषजम् । शं नो अस्तु द्विपदे । शं चतुष्पदे ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ७ ॐ नमो वाचे या चोदिता
    या चानुदिता तस्यै वाचे नमो नमो वाचे नमो वाचस्पतये नम ऋषिभ्यो मन्त्रकृद्भ्यो मन्त्रपतिभ्यो मामामृषयो
    मन्त्रकृतो मन्त्रपतयः परादुर्मा ऽहमृषीन्मन्त्रकृतो मन्त्रपतीन्परादां वैश्वदेवीं वाचमुद्यास
