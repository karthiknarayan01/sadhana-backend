id: saprayogamahavidyastotram
category: stotram
name:
  english: saprayogamahavidyastotram
  devanagari: सप्रयोगमहाविद्यास्तोत्रम्
content:
  english: vyaghradimrigan badhnami svaha | om shastram badhnami svaha | om astram badhnami svaha | om
    asham badhnami svaha | om sarvam badhnami svaha | om sarvajantun badhnami svaha | om bandha bandha
    mocanam kuru kuru svaha | digbandhanam om namo bhagavate rudraya mahendradishayamairavatarudham hemavarnam
    vajrahastam parivarasahitam indradevatadhipatimaindramandalam badhnami svaha | om aindramandalam bandha
    bandha raksha raksha macala macala makramya makramya svaha | om hra~ hri~ hru~ hrai~ hrau~ hrah svaha
    | om kra~ kri~ kru~ krai~ krau~ krah svaha | om namo bhagavate rudraya svaha | om bhairavaya svaha
    | om namo ganeshvaraya svaha | om namo durgayai svaha | om namo bhagavate rudraya agnidishayam marjararudham
    shaktihastam parivarasahitam digdevatadhipatimagnimandalam badhnami svaha | om agnimandalam bandha
    bandha raksha raksha macala macala makramya makramya svaha | om hra~ hri~ hru~ hrai~ hrau~ hrah svaha
    | om kra~ kri~ kru~ krai~ krau~ krah svaha | om namo bhairavaya svaha | om namo bhagavate rudraya
    svaha | om namo ganeshvaraya svaha | om namo durgayai namah svaha | om namo bhagavate rudraya dakshinadishayam
    mahisharudham krishnavarnam dandahastam parivarasahitam digdevatadhipatim yamamandalam badhnami svaha
    | om yamamandalam bandha bandha raksha raksha macala macala makramya makramya svaha | om hra~ hri~
    hru~ hrai~ hrau~ hrah svaha | om kra~ kri~ kru~ krai~ krau~ krah svaha | om namo bhairavaya svaha
    | om namo bhagavate rudraya svaha | om namo ganeshvaraya svaha | om namo durgayai namah svaha | om
    nairrityadishayam pretarudham khadgahastam parivarasahitam digdevatadhipatim nairrityamandalam badhnami
    svaha | om nairrityamandalam bandha bandha raksha raksha macala macala makramya makramya svaha | om
    hram hrim hrum hraim hraum hrah svaha | om kram krim krum kraim kraum krah svaha | om pashcimadishayam
    makararudham pashahastam parivarasahitam digdevatadhipatim varunamandalam badhnami svaha | om namo
    bhagavate rudraya svaha | om bhairavaya svaha | om namo ganeshvaraya svaha | om namo durgayai namah
    svaha | om varunamandalam bandha bandha raksha raksha macala macala makramya makramya svaha | om hra~
    hri~ hru~ hrai~ hrau~ hrah svaha | om kra~ kri~ kru~ krai~ krau~ krah svaha | om vayavyadishayam mrigarudham
    dhanurhastam parivarasahitam digdevatadhipatim vayavyamandalam badhnami svaha | om namo bhagavate
    rudraya svaha | om bhairavaya svaha | om namo ganeshvaraya svaha | om namo durgayai namah svaha |
    om vayavyamandalam bandha bandha raksha raksha macala macala makramya makramya svaha | om hra~ hri~
    hru~ hrai~ hrau~ hrah svaha | om kra~ kri~ kru~ krai~ krau~ krah svaha | om uttaradishayam yaksharudham
    madahastam parivarasahitam digdevatadhipatim kuberamandalam badhnami svaha | om namo bhagavate rudraya
    svaha | om bhairavaya svaha | om namo ganeshvaraya svaha | om namo durgayai namah svaha | om kuberamandalam
    bandha bandha raksha raksha macala macala makramya makramya svaha | om hra~ hri~ hru~ hrai~ hrau~
    hrah svaha | om kra~ kri~ kru~ krai~ krau~ krah svaha | om agnidishayam kurmarudham loshthabhagam
    kuparighahastam svaparivarasahitam digdevatadhipatim patalamandalam badhnami svaha | om namo bhagavate
    rudraya svaha | om bhairavaya svaha | om ganeshvaraya svaha | om namo durgayai namah svaha | om patalamandalam
    bandha bandha raksha raksha macala macala makramya makramya svaha| om hra~ hri~ hru~ hrai~ hrau~ hrah
    svaha | om kra~ kri~ kru~ krai~ krau~ krah svaha | om durge mahashantika
  devanagari: व्याघ्रादिमृगान् बध्नामि स्वाहा । ॐ शस्त्रं बध्नामि स्वाहा । ॐ अस्त्रं बध्नामि स्वाहा ।
    ॐ आशां बध्नामि स्वाहा । ॐ सर्वं बध्नामि स्वाहा । ॐ सर्वजन्तून् बध्नामि स्वाहा । ॐ बन्ध बन्ध मोचनं
    कुरु कुरु स्वाहा । दिग्बन्धनम् ॐ नमो भगवते रुद्राय महेन्द्रदिशायामैरावतारूढं हेमवर्णं वज्रहस्तं परिवारसहितं
    इन्द्रदेवताधिपतिमैन्द्रमण्डलं बध्नामि स्वाहा । ॐ ऐन्द्रमण्डलं बन्ध बन्ध रक्ष रक्ष माचल माचल माक्रम्य
    माक्रम्य स्वाहा । ॐ ह्राँ ह्रीँ ह्रूँ ह्रैँ ह्रौँ ह्रः स्वाहा । ॐ क्राँ क्रीँ क्रूँ क्रैँ क्रौँ क्रः
    स्वाहा । ॐ नमो भगवते रुद्राय स्वाहा । ॐ भैरवाय स्वाहा । ॐ नमो गणेश्वराय स्वाहा । ॐ नमो दुर्गायै स्वाहा
    । ॐ नमो भगवते रुद्राय अग्निदिशायां मार्जारारूढं शक्तिहस्तं परिवारसहितं दिग्देवताधिपतिमग्निमण्डलं बध्नामि
    स्वाहा । ॐ अग्निमण्डलं बन्ध बन्ध रक्ष रक्ष माचल माचल माक्रम्य माक्रम्य स्वाहा । ॐ ह्राँ ह्रीँ ह्रूँ
    ह्रैँ ह्रौँ ह्रः स्वाहा । ॐ क्राँ क्रीँ क्रूँ क्रैँ क्रौँ क्रः स्वाहा । ॐ नमो भैरवाय स्वाहा । ॐ नमो
    भगवते रुद्राय स्वाहा । ॐ नमो गणेश्वराय स्वाहा । ॐ नमो दुर्गायै नमः स्वाहा । ॐ नमो भगवते रुद्राय दक्षिणदिशायां
    महिषारूढं कृष्णवर्णं दण्डहस्तं परिवारसहितं दिग्देवताधिपतिं यममण्डलं बध्नामि स्वाहा । ॐ यममण्डलं बन्ध
    बन्ध रक्ष रक्ष माचल माचल माक्रम्य माक्रम्य स्वाहा । ॐ ह्राँ ह्रीँ ह्रूँ ह्रैँ ह्रौँ ह्रः स्वाहा ।
    ॐ क्राँ क्रीँ क्रूँ क्रैँ क्रौँ क्रः स्वाहा । ॐ नमो भैरवाय स्वाहा । ॐ नमो भगवते रुद्राय स्वाहा । ॐ
    नमो गणेश्वराय स्वाहा । ॐ नमो दुर्गायै नमः स्वाहा । ॐ नैरृत्यदिशायां प्रेतारूढं खड्गहस्तं परिवारसहितं
    दिग्देवताधिपतिं नैरृत्यमण्डलं बध्नामि स्वाहा । ॐ नैरृत्यमण्डलं बन्ध बन्ध रक्ष रक्ष माचल माचल माक्रम्य
    माक्रम्य स्वाहा । ॐ ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः स्वाहा । ॐ क्रां क्रीं क्रूं क्रैं क्रौं क्रः
    स्वाहा । ॐ पश्चिमदिशायां मकरारूढं पाशहस्तं परिवारसहितं दिग्देवताधिपतिं वरुणमण्डलं बध्नामि स्वाहा ।
    ॐ नमो भगवते रुद्राय स्वाहा । ॐ भैरवाय स्वाहा । ॐ नमो गणेश्वराय स्वाहा । ॐ नमो दुर्गायै नमः स्वाहा
    । ॐ वरुणमण्डलं बन्ध बन्ध रक्ष रक्ष माचल माचल माक्रम्य माक्रम्य स्वाहा । ॐ ह्राँ ह्रीँ ह्रूँ ह्रैँ
    ह्रौँ ह्रः स्वाहा । ॐ क्राँ क्रीँ क्रूँ क्रैँ क्रौँ क्रः स्वाहा । ॐ वायव्यदिशायां मृगारूढं धनुर्हस्तं
    परिवारसहितं दिग्देवताधिपतिं वायव्यमण्डलं बध्नामि स्वाहा । ॐ नमो भगवते रुद्राय स्वाहा । ॐ भैरवाय स्वाहा
    । ॐ नमो गणेश्वराय स्वाहा । ॐ नमो दुर्गायै नमः स्वाहा । ॐ वायव्यमण्डलं बन्ध बन्ध रक्ष रक्ष माचल माचल
    माक्रम्य माक्रम्य स्वाहा । ॐ ह्राँ ह्रीँ ह्रूँ ह्रैँ ह्रौँ ह्रः स्वाहा । ॐ क्राँ क्रीँ क्रूँ क्रैँ
    क्रौँ क्रः स्वाहा । ॐ उत्तरदिशायां यक्षारुढं मदाहस्तं परिवारसहितं दिग्देवताधिपतिं कुबेरमण्डलं बध्नामि
    स्वाहा । ॐ नमो भगवते रुद्राय स्वाहा । ॐ भैरवाय स्वाहा । ॐ नमो गणेश्वराय स्वाहा । ॐ नमो दुर्गायै नमः
    स्वाहा । ॐ कुबेरमण्डलं बन्ध बन्ध रक्ष रक्ष माचल माचल माक्रम्य माक्रम्य स्वाहा । ॐ ह्राँ ह्रीँ ह्रूँ
    ह्रैँ ह्रौँ ह्रः स्वाहा । ॐ क्राँ क्रीँ क्रूँ क्रैँ क्रौँ क्रः स्वाहा । ॐ अग्निदिशायां कूर्मारूढं
    लोष्ठभागं कुपरिघहस्तं स्वपरिवारसहितं दिग्देवतधिपतिं पातालमण्डलं बध्नामि स्वाहा । ॐ नमो भगवते रुद्राय
    स्वाहा । ॐ भैरवाय स्वाहा । ॐ गणेश्वराय स्वाहा । ॐ नमो दुर्गायै नमः स्वाहा । ॐ पातालमण्डलं बन्ध बन्ध
    रक्ष रक्ष माचल माचल माक्रम्य माक्रम्य स्वाहा। ॐ ह्राँ ह्रीँ ह्रूँ ह्रैँ ह्रौँ ह्रः स्वाहा । ॐ क्राँ
    क्रीँ क्रूँ क्रैँ क्रौँ क्रः स्वाहा । ॐ दुर्गे महाशान्तिक
