id: dattatreyopanishat
category: upanishad
name:
  english: dattatreyopanishat
  devanagari: दत्तात्रेयोपनिषत्
content:
  english: marayamaraya namah sampannaya namah sampannaya svaha poshayaposhaya paramantraparayantraparatantramshchindhicchindhi
    grahannivarayanivaraya vyadhinnivarayanivaraya duhkham harayaharaya daridryam vidravayavidravaya deham
    poshayaposhaya cittam toshayatoshayeti sarvamantra
  devanagari: मारयमारय नमः संपन्नाय नमः संपन्नाय स्वाहा पोषयपोषय परमन्त्रपरयन्त्रपरतन्त्रांश्छिन्धिच्छिन्धि
    ग्रहान्निवारयनिवारय व्याधीन्निवारयनिवारय दुःखं हरयहरय दारिद्र्यं विद्रावयविद्रावय देहं पोषयपोषय चित्तं
    तोषयतोषयेति सर्वमन्त्र
meaning: {}
