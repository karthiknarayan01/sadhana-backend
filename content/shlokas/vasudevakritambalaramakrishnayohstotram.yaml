id: vasudevakritambalaramakrishnayohstotram
category: stotram
name:
  english: vasudevakritambalaramakrishnayohstotram
  devanagari: वसुदेवकृतंबलरामकृष्णयोःस्तोत्रम्
content:
  english: vasudevakritam balaramakrishnayoh stotram krishna krishna mahayogin sankarshana sanatana |
    jane vamasya yatsakshatpradhanapurushau parau || 3|| yatra yena yato yasya yasmai yadyadyatha yada
    | syadidam bhagavan sakshatpradhanapurusheshvarah || 4|| etannanavidham vishvamatmasrishtamadhokshaja
    | atmananupravishyatman prano jivo bibharshyaja || 5|| pranadinam vishvasrijam shaktayo yah parasya
    tah | paratantryadvaisadrishyaddvayoshceshtaiva ceshtatam || 6|| kantistejah prabha satta candragnyarkarkshavidyutam
    | yatsthairyam bhubhritam bhumervrittirgandho'rthato bhavan || 7|| tarpanam prananamapam devatvam
    tashca tadrasah | ojah saho balam ceshta gatirvayostaveshvara || 8|| disham tvamavakasho'si dishah
    kham sphota ashrayah | nado varnastvamonkara akritinam prithakkritih || 9|| indriyam tvindriyanam
    tvam devashca tadanugrahah | avabodhobhavanbuddherjivasyanusmritih sati || 10|| bhutanamasi bhutadirindriyanam
    ca taijasah | vaikariko vikalpanam pradhanamanushayinam || 11|| nashvareshviha bhaveshu tadasi tvamanashvaram
    | yatha dravyavikareshu dravyamatram nirupitam || 12|| sattvamrajastama iti gunastadvrittayashca yah
    | tvayyaddha brahmani pare kalpita yogamayaya || 13|| tasmanna santyami bhava yarhi tvayi vikalpitah
    | tvam camishu vikareshu hyanyadavyavaharikah || 14|| gunapravaha etasminnabudhastvakhilatmanah |
    gatim sukshmamabodhena samsarantiha karmabhih || 15|| yadricchaya nritam prapya sukalpamiha durlabham
    | svarthe pramattasya vayo gatam tvanmayayeshvara || 16|| asavahammamaivaite dehe casyanvayadishu
    | snehapashairnibadhnati bhavan sarvamidam jagat || 17|| yuvam na nah sutau sakshatpradhanapurusheshvarau
    | bhubharakshatrakshapana avatirnau tathattha ha || 18|| tatte gato'smyaranamadya padaravinda
  devanagari: वसुदेवकृतं बलरामकृष्णयोः स्तोत्रम् कृष्ण कृष्ण महायोगिन् सङ्कर्षण सनातन । जाने वामस्य यत्साक्षात्प्रधानपुरुषौ
    परौ ॥ ३॥ यत्र येन यतो यस्य यस्मै यद्यद्यथा यदा । स्यादिदं भगवान् साक्षात्प्रधानपुरुषेश्वरः ॥ ४॥ एतन्नानाविधं
    विश्वमात्मसृष्टमधोक्षज । आत्मनानुप्रविश्यात्मन् प्राणो जीवो बिभर्ष्यज ॥ ५॥ प्राणादीनां विश्वसृजां
    शक्तयो याः परस्य ताः । पारतन्त्र्याद्वैसादृश्याद्द्वयोश्चेष्टैव चेष्टताम् ॥ ६॥ कान्तिस्तेजः प्रभा
    सत्ता चन्द्राग्न्यर्कर्क्षविद्युताम् । यत्स्थैर्यं भूभृतां भूमेर्वृत्तिर्गन्धोऽर्थतो भवान् ॥ ७॥ तर्पणं
    प्राणनमपां देवत्वं ताश्च तद्रसः । ओजः सहो बलं चेष्टा गतिर्वायोस्तवेश्वर ॥ ८॥ दिशां त्वमवकाशोऽसि दिशः
    खं स्फोट आश्रयः । नादो वर्णस्त्वमोङ्कार आकृतीनां पृथक्कृतिः ॥ ९॥ इन्द्रियं त्विन्द्रियाणां त्वं देवाश्च
    तदनुग्रहः । अवबोधोभवान्बुद्धेर्जीवस्यानुस्मृतिः सती ॥ १०॥ भूतानामसि भूतादिरिन्द्रियाणां च तैजसः ।
    वैकारिको विकल्पानां प्रधानमनुशायिनम् ॥ ११॥ नश्वरेष्विह भावेषु तदसि त्वमनश्वरम् । यथा द्रव्यविकारेषु
    द्रव्यमात्रं निरूपितम् ॥ १२॥ सत्त्वंरजस्तम इति गुणास्तद्वृत्तयश्च याः । त्वय्यद्धा ब्रह्मणि परे कल्पिता
    योगमायया ॥ १३॥ तस्मान्न सन्त्यमी भावा यर्हि त्वयि विकल्पिताः । त्वं चामीषु विकारेषु ह्यन्यदाव्यावहारिकः
    ॥ १४॥ गुणप्रवाह एतस्मिन्नबुधास्त्वखिलात्मनः । गतिं सूक्ष्मामबोधेन संसरन्तीह कर्मभिः ॥ १५॥ यदृच्छया
    नृतां प्राप्य सुकल्पामिह दुर्लभाम् । स्वार्थे प्रमत्तस्य वयो गतं त्वन्माययेश्वर ॥ १६॥ असावहम्ममैवैते
    देहे चास्यान्वयादिषु । स्नेहपाशैर्निबध्नाति भवान् सर्वमिदं जगत् ॥ १७॥ युवां न नः सुतौ साक्षात्प्रधानपुरुषेश्वरौ
    । भूभारक्षत्रक्षपण अवतीर्णौ तथात्थ ह ॥ १८॥ तत्ते गतोऽस्म्यरणमद्य पदारविन्द
