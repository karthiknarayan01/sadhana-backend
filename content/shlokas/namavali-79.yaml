id: namavali-79
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: hanumadashtottarashatanamavalih 1 om hanumate namah | anjanaputraya | vayusunave | mahabalaya
    | ramadutaya | harishreshthaya | surine | kesarinandanaya | suryashreshthaya | mahakayaya | vajrine
    | vajrapraharavate | mahasattvaya | maharupaya | brahmanyaya | brahmanapriyaya | mukhyapranaya | mahabhimaya
    | purnaprajnaya | mahagurave namah | 20 om brahmacarine namah | vrikshadharaya | punyaya | shriramakinkaraya
    | sitashokavinashine | simhikaprananashakaya | mainakagarvabhangaya | chayagrahanivarakaya | lankamokshapradaya
    | devaya | sitamarganatatparaya | ramangulipradatre | sitaharshavivardhanaya | maharupadharaya | divyaya
    | ashokavananashakaya | mantriputraharaya | viraya | pancasenagramardanaya | dashakanthasutaghnaya
    namah | 40 om brahmastravashagaya namah | avyayaya | dashasyasallapaparaya | lankapuravidahakaya |
    tirnabdhaye | kapirajaya | kapiyuthapraranjakaya | cudamanipradatre | shrivashyaya | priyadarshakaya
    | kaupinakundaladharaya | kanakangadabhushanaya | sarvashastrasusampannaya | sarvajnaya | jnanadottamaya
    | mukhyapranaya | mahavegaya | shabdashastravisharadaya | buddhimate | sarvalokeshaya namah | 60 om
    sureshaya namah | lokaranjakaya | lokanathaya | mahadarpaya | sarvabhutabhayapahaya | ramavahanarupaya
    | sanjivacalabhedakaya | kapinam pranadatre | lakshmanapranarakshakaya | ramapadasamipasthaya | lohitasyaya
    | mahahanave | ramasandeshakartre | bharatanandavardhanaya | ramabhishekalolaya | ramakaryadhurandharaya
    | kuntigarbhasamutpannaya | bhimaya | bhimaparakramaya | lakshagrihadvinirmuktaya namah | 80 om hidimbasuramardanaya
    namah | dharmanujaya | panduputraya | dhananjayasahayavate | balasuravadhodyuktaya | tadgramaparirakshakaya
    | nityam bhikshahararataya | kulalagrihamadhyagaya | pancalyudvahasanjatasammodaya | bahukantimate
    | viratanagare gudhacaraya | kicakamardanaya | duryodhananihantre | jarasandhavimardanaya | saugandhikapahartre
    | draupadipranavallabhaya | purnabodhaya | vyasashishyaya | yatirupaya | mahamataye namah | 100 om
    durvadigajasimhasya tarkashastrasya khandanaya namah | bauddhagamavibhettre | sankhyashastrasya dushakaya
    | dvaitashastrapranetre | vedavyasamatanugaya | purnanandaya | purnasatvaya | purnavairagyasagaraya
    namah | 108
  devanagari: हनुमदष्टोत्तरशतनामावलिः १ ॐ हनुमते नमः । अञ्जनापुत्राय । वायुसूनवे । महाबलाय । रामदूताय
    । हरिश्रेष्ठाय । सूरिणे । केसरीनन्दनाय । सूर्यश्रेष्ठाय । महाकायाय । वज्रिणे । वज्रप्रहारवते । महासत्त्वाय
    । महारूपाय । ब्रह्मण्याय । ब्राह्मणप्रियाय । मुख्यप्राणाय । महाभीमाय । पूर्णप्रज्ञाय । महागुरवे नमः
    । २० ॐ ब्रह्मचारिणे नमः । वृक्षधराय । पुण्याय । श्रीरामकिङ्कराय । सीताशोकविनाशिने । सिंहिकाप्राणनाशकाय
    । मैनाकगर्वभङ्गाय । छायाग्रहनिवारकाय । लङ्कामोक्षप्रदाय । देवाय । सीतामार्गणतत्पराय । रामाङ्गुलिप्रदात्रे
    । सीताहर्षविवर्धनाय । महारूपधराय । दिव्याय । अशोकवननाशकाय । मन्त्रिपुत्रहराय । वीराय । पञ्चसेनाग्रमर्दनाय
    । दशकण्ठसुतघ्नाय नमः । ४० ॐ ब्रह्मास्त्रवशगाय नमः । अव्ययाय । दशास्यसल्लापपराय । लङ्कापुरविदाहकाय
    । तीर्णाब्धये । कपिराजाय । कपियूथप्ररञ्जकाय । चूडामणिप्रदात्रे । श्रीवश्याय । प्रियदर्शकाय । कौपीनकुण्डलधराय
    । कनकाङ्गदभूषणाय । सर्वशास्त्रसुसम्पन्नाय । सर्वज्ञाय । ज्ञानदोत्तमाय । मुख्यप्राणाय । महावेगाय ।
    शब्दशास्त्रविशारदाय । बुद्धिमते । सर्वलोकेशाय नमः । ६० ॐ सुरेशाय नमः । लोकरञ्जकाय । लोकनाथाय । महादर्पाय
    । सर्वभूतभयापहाय । रामवाहनरूपाय । सञ्जीवाचलभेदकाय । कपीनां प्राणदात्रे । लक्ष्मणप्राणरक्षकाय । रामपादसमीपस्थाय
    । लोहितास्याय । महाहनवे । रामसन्देशकर्त्रे । भरतानन्दवर्धनाय । रामाभिषेकलोलाय । रामकार्यधुरन्धराय
    । कुन्तीगर्भसमुत्पन्नाय । भीमाय । भीमपराक्रमाय । लाक्षागृहाद्विनिर्मुक्ताय नमः । ८० ॐ हिडिम्बासुरमर्दनाय
    नमः । धर्मानुजाय । पाण्डुपुत्राय । धनञ्जयसहायवते । बलासुरवधोद्युक्ताय । तद्ग्रामपरिरक्षकाय । नित्यं
    भिक्षाहाररताय । कुलालगृहमध्यगाय । पाञ्चाल्युद्वाहसञ्जातसम्मोदाय । बहुकान्तिमते । विराटनगरे गूढचराय
    । कीचकमर्दनाय । दुर्योधननिहन्त्रे । जरासन्धविमर्दनाय । सौगन्धिकापहर्त्रे । द्रौपदीप्राणवल्लभाय । पूर्णबोधाय
    । व्यासशिष्याय । यतिरूपाय । महामतये नमः । १०० ॐ दुर्वादिगजसिंहस्य तर्कशास्त्रस्य खण्डनाय नमः । बौद्धागमविभेत्त्रे
    । साङ्ख्यशास्त्रस्य दूषकाय । द्वैतशास्त्रप्रणेत्रे । वेदव्यासमतानुगाय । पूर्णानन्दाय । पूर्णसत्वाय
    । पूर्णवैराग्यसागराय नमः । १०८
