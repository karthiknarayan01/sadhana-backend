id: aryatarasragdharastotram
category: stotram
name:
  english: aryatarasragdharastotram
  devanagari: आर्यतारास्रग्धरास्तोत्रम्
content:
  english: shatdanto dantimukhyah shikhigalakarucishyamaroma varashvah | bhasvadbhasvanmayukho maniramalagunah
    koshabhrit svarnakoshah senanirvirasainyo bhavati bhagavati tvatprasadamshaleshat || 24|| svacchandam
    candanambhahsurabhimanishiladattasanketakantah kantakridanuragadabhinavaracitatithyatathyopacarah
    | tvadvidyalabdhasiddhirmalayamadhuvanam yati vidyadharendrah khangamshushyamapinonnatabhujaparighaprollasatpariharyah
    || 25|| harakrantastanantah shravanakuvalayasparddhamanayatakshyo mandarodaravenitarunaparimalamodamadyaddvirephah
    | kancinadanubandhoddhatataracaranodaramanjiraturyas tvannathan prarthayante smaramadamuditah sadara
    devakanyah || 26|| ratnacchannantavapikanakakamalinivajrakinjalkamalam unmajjatparijatadrumamadhupavadhuddhutadhulivitanam
    | vinavenupravinamarapuraramanidattamadhuryaturyam kritva yushmatsaparyamanubhavati ciram nandanodyanayatram
    || 27|| karpurailalavangatvagagurunaladakshodagandhodakayam | kantakandarpadarpotkatakucakuharavartavishrantavicyam
    | mandakinyamamandacchatasalilasaritkridaya sundaribhih kridanti tvadgatantahkaranaparinatottaptapunyaprabhavah
    || 28|| girvanagramanibhirvinayabharanamanmaulibhirvanditajnah svargotsange'dhirudhah surakarini jhanadbhushanodbhasitange
    | shacya dordamadolaviralavalayitoddamaromancamurtih putastvaddrishtipatairavati suramahim hirabhinnaprakoshthah
    || 29|| cudaratnavatamsasanagatasugatavyomalakshmivitanam prodyadbalarkakotipatutarakiranapuryamanatrilokam
    | praudhalidhaikapadakramabharavinamadbrahmarudrendravishnum tvadrupam bhavyamanam bhavati bhavabhayacchittye
    janmabhajam || 30|| pashyantyeke sakopam praharanakiranodgirnadordandakhanda
  devanagari: षट्दन्तो दन्तिमुख्यः शिखिगलकरुचिश्यामरोमा वराश्वः । भास्वद्भास्वन्मयूखो मणिरमलगुणः कोषभृत्
    स्वर्णकोषः सेनानीर्वीरसैन्यो भवति भगवति त्वत्प्रसादांशलेशात् ॥ २४॥ स्वच्छन्दं चन्दनाम्भःसुरभिमणिशिलादत्तसङ्केतकान्तः
    कान्ताक्रीडानुरागादभिनवरचितातिथ्यतथ्योपचारः । त्वद्विद्यालब्धसिद्धिर्मलयमधुवनं याति विद्याधरेन्द्रः
    खङ्गांशुश्यामपीनोन्नतभुजपरिघप्रोल्लसत्पारिहार्यः ॥ २५॥ हाराक्रान्तस्तनान्ताः श्रवणकुवलयस्पर्द्धमानायताक्ष्यो
    मन्दारोदारवेणीतरुणपरिमलामोदमाद्यद्द्विरेफाः । काञ्चीनादानुबन्धोद्धततरचरणोदारमञ्जीरतूर्यास् त्वन्नाथान्
    प्रार्थयन्ते स्मरमदमुदिताः सादरा देवकन्याः ॥ २६॥ रत्नच्छन्नान्तवापीकनककमलिनीवज्रकिञ्जल्कमालां उन्मज्जत्पारिजातद्रुममधुपवधूद्धूतधूलीवितानाम्
    । वीणावेणुप्रवीणामरपुररमणीदत्तमाधुर्यतूर्यां कृत्वा युष्मत्सपर्यामनुभवति चिरं नन्दनोद्यानयात्राम्
    ॥ २७॥ कर्पूरैलालवङ्गत्वगगुरुनलदक्षोदगन्धोदकायाम् । कान्ताकन्दर्पदर्पोत्कटकुचकुहरावर्तविश्रान्तवीच्याम्
    । मन्दाकिन्याममन्दच्छटसलिलसरित्क्रीडया सुन्दरीभिः क्रीडन्ति त्वद्गतान्तःकरणपरिणतोत्तप्तपुण्यप्रभावाः
    ॥ २८॥ गीर्वाणग्रामणीभिर्विनयभरनमन्मौलिभिर्वन्दिताज्ञः स्वर्गोत्सङ्गेऽधिरूढः सुरकरिणि झणद्भूषणोद्भासिताङ्गे
    । शच्या दोर्दामदोलाविरलवलयितोद्दामरोमाञ्चमूर्तिः पूतस्त्वद्दृष्टिपातैरवति सुरमहीं हीरभिन्नप्रकोष्ठः
    ॥ २९॥ चूडारत्नावतंसासनगतसुगतव्योमलक्ष्मीवितानं प्रोद्यद्बालार्ककोटीपटुतरकिरणापूर्यमाणत्रिलोकम् । प्रौढालीढैकपादक्रमभरविनमद्ब्रह्मरुद्रेन्द्रविष्णुं
    त्वद्रूपं भाव्यमानं भवति भवभयच्छित्त्ये जन्मभाजाम् ॥ ३०॥ पश्यन्त्येके सकोपं प्रहरणकिरणोद्गीर्णदोर्दण्डखण्ड
