id: medhadakshinamurtimantravarnapadastutih
category: mantra
name:
  english: medhadakshinamurtimantravarnapadastutih
  devanagari: मेधादक्षिणामूर्तिमन्त्रवर्णपदस्तुतिः
content:
  english: shrimedhadakshinamurtimantravarnapadastutih om namo bhagavate dakshinamurtaye mahyam medham
    prajnam prayaccha svaha | omityekaksharam brahma vyaharanti trayashshikhah | tasmai taratmane medhadakshinamurtaye
    namah || 1|| natvayam munayassarve param yanti durasadam | nakararupine medhadakshinamurtaye namah
    || 2|| mohajalavinirmukto brahmavid yati yatpadam | mokararupine medhadakshinamurtaye namah || 3||
    bhavamashritya yam vidvan bhave nahyabhavat punah | bhakararupine medhadakshinamurtaye namah || 4||
    gaganakaravadbhantamanubhatyakhilam jagat | gakararupine medhadakshinamurtaye namah || 5|| vatamulanivaso
    yo gurunam gururavyayah | vakararupine medhadakshinamurtaye namah || 6|| tejobhiryasya suryo'sau kalakliptikaro
    bhavet | tekararupine medhadakshinamurtaye namah || 7|| dakshatripura kamarih yah kalavishabhanjakah
    | dakararupine medhadakshinamurtaye namah || 8|| kshipram bhavati vaksiddhih yannamasmaranannrinam
    | kshikararupine medhadakshinamurtaye namah || 9|| nakaravacyo vassuptam sandipayati me manah | nakararupine
    medhadakshinamurtaye namah || 10|| murtayohyashtadha yasya jagajjanmadikaranam | mukararupine medhadakshinamurtaye
    namah || 11|| tattvamasitivakyena guruna yatprabodhitah | takararupine medhadakshinamurtaye namah
    || 12|| yeyam viditva brahmadya rishayo yanti nirvritim | yekararupine medhadakshinamurtaye namah
    || 13|| mahamauni kare malam mudram samvinmayim dadhan | makararupine medhadakshinamurtaye namah ||
    14|| hyambikamukhapadmarko heyopadeyavarjitah | hyakararupine medhadakshinamurtaye namah || 15|| medhapradanadakshaya
    merukodandapanaye | mekararupine medhadakshinamurtaye namah || 16|| dhamatrayatmanetradhya dhurjate
    dhavala prabha | dhakararupine medhadakshinamurtaye namah || 17|| prakriteryatparam dhyatva tadatmyam
    yati vai munih | prakararupine medhadakshinamurtaye namah || 18|| jnaninoyamupasyanti tattvatitam
    cidatmakam | jnakararupine medhadakshinamurtaye namah || 19|| prajna sanjayate yasya dhyananamarcanadibhih
    | prakararupine medhadakshinamurtaye namah || 20|| yasya smaranamatrena naromucyeta bandhanat | yakararupine
    medhadakshinamurtaye namah || 21|| channa yasya chavirmeghe suryavanmayaya vibhoh | chakararupine
    medhadakshinamurtaye namah || 22|| svantevidam jadanam yo dure tishthati cinmayah | svakararupine
    medhadakshinamurtaye namah || 23|| hardakashavilasaya hatakabhasharirine | hakararupine medhadakshinamurtaye
    namah || 24|| iti shrimedhadakshinamurtimantravarnapadastutih sampurna |
  devanagari: श्रीमेधादक्षिणामूर्तिमन्त्रवर्णपदस्तुतिः ॐ नमो भगवते दक्षिणामूर्तये मह्यं मेधां प्रज्ञां
    प्रयच्छ स्वाहा । ओमित्येकाक्षरं ब्रह्म व्याहरन्ति त्रयश्शिखाः । तस्मै तारात्मने मेधादक्षिणामूर्तये
    नमः ॥ १॥ नत्वायं मुनयस्सर्वे परं यान्ति दुरासदम् । नकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ २॥ मोहजालविनिर्मुक्तो
    ब्रह्मविद् याति यत्पदम् । मोकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ३॥ भवमाश्रित्य यं विद्वान् भवे नह्यभवत्
    पुनः । भकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ४॥ गगनाकारवद्भान्तमनुभात्यखिलं जगत् । गकाररूपिणे मेधादक्षिणामूर्तये
    नमः ॥ ५॥ वटमूलनिवासो यो गुरूणां गुरुरव्ययः । वकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ६॥ तेजोभिर्यस्य सूर्योऽसौ
    कालकॢप्तिकरो भवेत् । तेकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ७॥ दक्षत्रिपुर कामारिः यः कालविषभञ्जकः ।
    दकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ८॥ क्षिप्रं भवति वाक्सिद्धिः यन्नामस्मरणान्नृणाम् । क्षिकाररूपिणे
    मेधादक्षिणामूर्तये नमः ॥ ९॥ णाकारवाच्यो वस्सुप्तं सन्दीपयति मे मनः । णाकाररूपिणे मेधादक्षिणामूर्तये
    नमः ॥ १०॥ मूर्तयोह्यष्टधा यस्य जगज्जन्मादिकारणम् । मूकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ ११॥ तत्त्वमसीतिवाक्येन
    गुरूणा यत्प्रबोधितः । तकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ १२॥ येयं विदित्वा ब्रह्माद्या ऋषयो यान्ति
    निर्वृतिम् । येकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ १३॥ महामौनी करे मालां मुद्रां संविन्मयीं दधन् ।
    मकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ १४॥ ह्यम्बिकामुखपद्मार्को हेयोपादेयवर्जितः । ह्यकाररूपिणे मेधादक्षिणामूर्तये
    नमः ॥ १५॥ मेधाप्रदानदक्षाय मेरुकोदण्डपाणये । मेकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ १६॥ धामत्रयात्मनेत्राढ्य
    धूर्जटे धवल प्रभ । धाकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ १७॥ प्रकृतेर्यत्परं ध्यात्वा तादात्म्यं याति
    वै मुनिः । प्रकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ १८॥ ज्ञानिनोयमुपास्यन्ति तत्त्वातीतं चिदात्मकम् ।
    ज्ञाकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ १९॥ प्रज्ञा सञ्जायते यस्य ध्याननामार्चनादिभिः । प्रकाररूपिणे
    मेधादक्षिणामूर्तये नमः ॥ २०॥ यस्य स्मरणमात्रेण नरोमुच्येत बन्धनात् । यकाररूपिणे मेधादक्षिणामूर्तये
    नमः ॥ २१॥ छन्ना यस्या छविर्मेघे सूर्यवन्मायया विभोः । छकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ २२॥ स्वान्तेविदां
    जडानां यो दूरे तिष्ठति चिन्मयः । स्वाकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ २३॥ हार्दाकाशविलासाय हाटकाभशरीरिणे
    । हाकाररूपिणे मेधादक्षिणामूर्तये नमः ॥ २४॥ इति श्रीमेधादक्षिणामूर्तिमन्त्रवर्णपदस्तुतिः सम्पूर्णा
    ।
