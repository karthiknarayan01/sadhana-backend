id: sri-bhuvaneshwari-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Bhuvaneshwari Ashtottara Sata Namavali
content:
  english: om mahamayayai namah | om mahavidyayai namah | om mahayogayai namah | om mahotkatayai namah
    | om maheshvaryai namah | om kumaryai namah | om brahmanyai namah | om brahmarupinyai namah | om vagishvaryai
    namah | om yogarupayai namah | | om yoginikotisevitayai namah | om jayayai namah | om vijayayai namah
    | om kaumaryai namah | om sarvamangalayai namah | om hingulayai namah | om vilasyai namah | om jvalinyai
    namah | om jvalarupinyai namah | om ishvaryai namah | | om krurasamharyai namah | om kulamargapradayinyai
    namah | om vaishnavyai namah | om subhagakarayai namah | om sukulyayai namah | om kulapujitayai namah
    | om vamangayai namah | om vamacarayai namah | om vamadevapriyayai namah | om dakinyai namah | | om
    yoginirupayai namah | om bhuteshyai namah | om bhutanayikayai namah | om padmavatyai namah | om padmanetrayai
    namah | om prabuddhayai namah | om sarasvatyai namah | om bhucaryai namah | om khecaryai namah | om
    mayayai namah | | om matangyai namah | om bhuvaneshvaryai namah | om kantayai namah | om pativratayai
    namah | om sakshyai namah | om sucakshushe namah | om kundavasinyai namah | om umayai namah | om kumaryai
    namah | om lokeshyai namah | | om sukeshyai namah | om padmaraginyai namah | om indranyai namah |
    om brahmacandalyai namah | om candikayai namah | om vayuvallabhayai namah | om sarvadhatumayyai namah
    | om murtaye namah | om jalarupayai namah | om jalodaryai namah | | om akashyai namah | om ranagayai
    namah | om nrikapalavibhushanayai namah | om narmadayai namah | om mokshadayai namah | om dharmakamarthadayinyai
    namah | om gayatryai namah | om savitryai namah | om trisandhyayai namah | om tirthagaminyai namah
    | | om ashtamyai namah | om navamyai namah | om dashamyai namah | om ekadashyai namah | om paurnamasyai
    namah | om kuhurupayai namah | om tithimurtisvarupinyai namah | om surarinashakaryai namah | om ugrarupayai
    namah | om vatsalayai namah | | om analayai namah | om ardhamatrayai namah | om arunayai namah | om
    pitalocanayai namah | om lajjayai namah | om sarasvatyai namah | om vidyayai namah | om bhavanyai
    namah | om papanashinyai namah | om nagapashadharayai namah | | om murtaye namah | om agadhayai namah
    | om dhritakundalayai namah | om kshatrarupayai namah | om kshayakaryai namah | om tejasvinyai namah
    | om shucismitayai namah | om avyaktayai namah | om vyaktalokayai namah | om shambhurupayai namah
    | | om manasvinyai namah | om matangyai namah | om mattamatangyai namah | om sadamahadevapriyayai
    namah | om daityaghnyai namah | om varahyai namah | om sarvashastramayyai namah | om shubhayai namah
    | | iti shri bhuvaneshvaryashtottarashatanamavalih |
  devanagari: ॐ महामायायै नमः । ॐ महाविद्यायै नमः । ॐ महायोगायै नमः । ॐ महोत्कटायै नमः । ॐ माहेश्वर्यै
    नमः । ॐ कुमार्यै नमः । ॐ ब्रह्माण्यै नमः । ॐ ब्रह्मरूपिण्यै नमः । ॐ वागीश्वर्यै नमः । ॐ योगरूपायै
    नमः । । ॐ योगिनीकोटिसेवितायै नमः । ॐ जयायै नमः । ॐ विजयायै नमः । ॐ कौमार्यै नमः । ॐ सर्वमङ्गलायै नमः
    । ॐ हिङ्गुलायै नमः । ॐ विलास्यै नमः । ॐ ज्वालिन्यै नमः । ॐ ज्वालरूपिण्यै नमः । ॐ ईश्वर्यै नमः । ।
    ॐ क्रूरसंहार्यै नमः । ॐ कुलमार्गप्रदायिन्यै नमः । ॐ वैष्णव्यै नमः । ॐ सुभगाकारायै नमः । ॐ सुकुल्यायै
    नमः । ॐ कुलपूजितायै नमः । ॐ वामाङ्गायै नमः । ॐ वामचारायै नमः । ॐ वामदेवप्रियायै नमः । ॐ डाकिन्यै नमः
    । । ॐ योगिनीरूपायै नमः । ॐ भूतेश्यै नमः । ॐ भूतनायिकायै नमः । ॐ पद्मावत्यै नमः । ॐ पद्मनेत्रायै नमः
    । ॐ प्रबुद्धायै नमः । ॐ सरस्वत्यै नमः । ॐ भूचर्यै नमः । ॐ खेचर्यै नमः । ॐ मायायै नमः । । ॐ मातङ्ग्यै
    नमः । ॐ भुवनेश्वर्यै नमः । ॐ कान्तायै नमः । ॐ पतिव्रतायै नमः । ॐ साक्ष्यै नमः । ॐ सुचक्षुषे नमः ।
    ॐ कुण्डवासिन्यै नमः । ॐ उमायै नमः । ॐ कुमार्यै नमः । ॐ लोकेश्यै नमः । । ॐ सुकेश्यै नमः । ॐ पद्मरागिण्यै
    नमः । ॐ इन्द्राण्यै नमः । ॐ ब्रह्मचण्डाल्यै नमः । ॐ चण्डिकायै नमः । ॐ वायुवल्लभायै नमः । ॐ सर्वधातुमय्यै
    नमः । ॐ मूर्तये नमः । ॐ जलरूपायै नमः । ॐ जलोदर्यै नमः । । ॐ आकाश्यै नमः । ॐ रणगायै नमः । ॐ नृकपालविभूषणायै
    नमः । ॐ नर्मदायै नमः । ॐ मोक्षदायै नमः । ॐ धर्मकामार्थदायिन्यै नमः । ॐ गायत्र्यै नमः । ॐ सावित्र्यै
    नमः । ॐ त्रिसन्ध्यायै नमः । ॐ तीर्थगामिन्यै नमः । । ॐ अष्टम्यै नमः । ॐ नवम्यै नमः । ॐ दशम्यै नमः ।
    ॐ एकादश्यै नमः । ॐ पौर्णमास्यै नमः । ॐ कुहूरूपायै नमः । ॐ तिथिमूर्तिस्वरूपिण्यै नमः । ॐ सुरारिनाशकार्यै
    नमः । ॐ उग्ररूपायै नमः । ॐ वत्सलायै नमः । । ॐ अनलायै नमः । ॐ अर्धमात्रायै नमः । ॐ अरुणायै नमः । ॐ
    पीतलोचनायै नमः । ॐ लज्जायै नमः । ॐ सरस्वत्यै नमः । ॐ विद्यायै नमः । ॐ भवान्यै नमः । ॐ पापनाशिन्यै
    नमः । ॐ नागपाशधरायै नमः । । ॐ मूर्तये नमः । ॐ अगाधायै नमः । ॐ धृतकुण्डलायै नमः । ॐ क्षत्ररूपायै नमः
    । ॐ क्षयकर्यै नमः । ॐ तेजस्विन्यै नमः । ॐ शुचिस्मितायै नमः । ॐ अव्यक्तायै नमः । ॐ व्यक्तलोकायै नमः
    । ॐ शम्भुरूपायै नमः । । ॐ मनस्विन्यै नमः । ॐ मातङ्ग्यै नमः । ॐ मत्तमातङ्ग्यै नमः । ॐ सदामहादेवप्रियायै
    नमः । ॐ दैत्यघ्न्यै नमः । ॐ वाराह्यै नमः । ॐ सर्वशास्त्रमय्यै नमः । ॐ शुभायै नमः । । इति श्री भुवनेश्वर्यष्टोत्तरशतनामावलिः
    ।
