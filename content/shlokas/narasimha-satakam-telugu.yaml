    चॆवुल कानन्दमै चॆलगुचुण्डु ने मनुजुण्डैन नॆलमि नी शतकम्बु भक्तितो विन्न स त्फलमु गलुगु जॆलगि यी पद्यमुल्
    चेर्चि व्रासिनवारु कमलाक्षुकरुणनु गान्तु रॆपुडु निम्पुगा बुस्तकं बॆपुडु बूजिञ्चिन दुरितजालम्बुलु निद्दि
    पुण्याकरं बनि यॆपुडु जनुलु गषट मॆन्नक पठियिम्प भूषणविकास । श्रीधर्म पुरनिवास । दुष्टसंहार । नरसिंह
