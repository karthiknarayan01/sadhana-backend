id: kashyapakritamgayatrisarasvatistotram
category: stotram
name:
  english: kashyapakritamgayatrisarasvatistotram
  devanagari: काश्यपकृतंगायत्रीसरस्वतीस्तोत्रम्
content:
  english: sarasvati | yuvayordarshanadadya kritartho'bhavamashu vai || 3|| mamadya patakanmuktam snanattirtha
    dvaye'tra tu | svikurvantu munishreshtha brahmana bandhavastatha || 4|| itah param papakritye ma me
    buddhih pravartatam | dharme pravartatam nityamayameva varo mama || 5|| diyatam bho mahadevyau nanyamicchamyaham
    varam || iti shriskandapurane brahmakhande setukhande ekacatvarimsha
  devanagari: सरस्वति । युवयोर्दर्शनादद्य कृतार्थोऽभवमाशु वै ॥ ३॥ मामद्य पातकान्मुक्तं स्नानात्तीर्थ द्वयेऽत्र
    तु । स्वीकुर्वन्तु मुनिश्रेष्ठा ब्राह्मणा बान्धवास्तथा ॥ ४॥ इतः परं पापकृत्ये मा मे बुद्धिः प्रवर्तताम्
    । धर्मे प्रवर्ततां नित्यमयमेव वरो मम ॥ ५॥ दीयतां भो महादेव्यौ नान्यमिच्छाम्यहं वरम् ॥ इति श्रीस्कन्दपुराणे
    ब्रह्मखण्डे सेतुखण्डे एकचत्वारिंशा
meaning: {}
