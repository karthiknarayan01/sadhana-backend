id: asato-ma-sadgamaya
category: shanti_mantra
name:
  english: Asato Ma Sadgamaya
  devanagari: असतो मा सद्गमय
content:
  english: >-
    om asato ma sadgamaya, tamaso ma jyotir gamaya, mrityor ma
    amritam gamaya
  devanagari: >-
    ॐ असतो मा सद्गमय । तमसो मा ज्योतिर्गमय । मृत्योर्मा अमृतं गमय ॥
meaning:
  english: >-
    Lead me from the unreal to the real, from darkness to light,
    from death to immortality.
source_attribution:
  text_source: Brihadaranyaka Upanishad 1.3.28
  translation_source: Original paraphrase written for Sadhana
  license: original_translation
