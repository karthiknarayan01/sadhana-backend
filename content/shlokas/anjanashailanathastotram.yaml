id: anjanashailanathastotram
category: stotram
name:
  english: anjanashailanathastotram
  devanagari: अञ्जनशैलनाथस्तोत्रम्
content:
  english: anjanashailanathastotram pulakini bhujamadhye pujayantam purandhrim bhuvananayanapunyam puritasheshakamam
    | punarapi vrishashaile phullanilotpalabham purushamanubhaveyam pundarikayataksham || 1|| ajanasauhridamaparakripamritabdhim
    avyajavatsalamavelasushilamadyam | anandarashimanuragamayavarodham aradhayami harimanjanashailanatham
    || 2|| atamrapadamavadatasuvarnacelam apinabahushikharojjvalashankhacakram | avissmitananamamandadayakataksham
    aradhayami harimanjanashailanatham || 3|| aprakritavayavasamhitasamnivesham arudhayauvanamahinakumarabhavam
    | amlanakantimativanmanasanubhavam aradhayami harimanjanashailanatham || 4|| ashavakashasamuditvarasarvagandham
    asvadayatsugamasarvarasasvabhavam | ashleshagamyasukhasamsprishanatirekam aradhayami harimanjanashailanatham
    || 5|| adarshayantamatisamkucitakshishaktim ashravayantamakhilan badhiran prakritya | abhashayantamabhito
    natamukavargam aradhayami harimanjanashailanatham || 6|| adhavayantamatimarutameva pangun ajanulambibhujayantamaho
    kubahun | anyamshca kritashirasah pratijivayantam aradhayami harimanjanashailanatham || 7|| ajanmanirdhanajananalakeshayantam
    ajnanapi tridashadeshikadeshyayantam | ahnaya vandhyamapi martyamavandhyayantam aradhayami harimanjanashailanatham
    || 8|| abaddhakankanamasheshasharanyatayam apatsahayamaparadhasaham natanam | asannasamagasukhalasasurivargam
    aradhayami harimanjanashailanatham || 9|| adhyasitasanasarojasanupuran ghrim amuktavirakatakayatavrittajangham
    | ashcaryajanuyugamapratimorukandam aradhayami harimanjanashailanatham || 10|| avartinimnanikhilandanidananabhim
    ayamidorvivarakeligrihavarodham | abaddharatnamayabhushabhujacatushkam aradhayami harimanjanashailanatham
    || 11|| amsavalambimanikundalakantagandam avissmitamshumadhuradharabandhujivam | asyabjasaurabhasamutsukadirghanasam
    aradhayami harimanjanashailanatham || 12|| ardhendubhasvadalikollasadurdhvapundram alolanilakutilalakacaruvaktram
    | avirmayukhamanicudamahakiritam aradhayami harimanjanashailanatham || 13|| vadibhitikararyena racita
    bhavabandha tah shobhate venkatadrishavishaya stutiradbhuta || || iti anjanashailanathastotram sampurnam
    ||
  devanagari: अञ्जनशैलनाथस्तोत्रम् पुलकिनि भुजमध्ये पूजयन्तं पुरन्ध्रीं भुवननयनपुण्यं पूरिताशेषकामम् ।
    पुनरपि वृषशैले फुल्लनीलोत्पलाभं पुरुषमनुभवेयं पुण्डरीकायताक्षम् ॥ १॥ आजानसौहृदमपारकृपामृताब्धिं अव्याजवत्सलमवेलसुशीलमाद्यम्
    । आनन्दराशिमनुरागमयावरोधं आराधयामि हरिमञ्जनशैलनाथम् ॥ २॥ आताम्रपादमवदातसुवर्णचेलं आपीनबाहुशिखरोज्ज्वलशङ्खचक्रम्
    । आविस्स्मिताननममन्ददयाकटाक्षं आराधयामि हरिमञ्जनशैलनाथम् ॥ ३॥ अप्राकृतावयवसंहितसंनिवेशं आरूढयौवनमहीनकुमारभावम्
    । अम्लानकान्तिमतिवाङ्मनसानुभावं आराधयामि हरिमञ्जनशैलनाथम् ॥ ४॥ आशावकाशसमुदित्वरसर्वगन्धं आस्वादयत्सुगमसर्वरसस्वभावम्
    । आश्लेषगम्यसुखसंस्पृशनातिरेकं आराधयामि हरिमञ्जनशैलनाथम् ॥ ५॥ आदर्शयन्तमतिसंकुचिताक्षिशक्तिं आश्रावयन्तमखिलान्
    बधिरान् प्रकृत्या । आभाषयन्तमभितो नतमूकवर्गं आराधयामि हरिमञ्जनशैलनाथम् ॥ ६॥ आधावयन्तमतिमारुतमेव पङ्गून्
    आजानुलम्बिभुजयन्तमहो कुबाहून् । अन्यांश्च कृतशिरसः प्रतिजीवयन्तं आराधयामि हरिमञ्जनशैलनाथम् ॥ ७॥ आजन्मनिर्धनजनानलकेशयन्तं
    अज्ञानपि त्रिदशदेशिकदेश्ययन्तम् । अह्नाय वन्ध्यमपि मर्त्यमवन्ध्ययन्तं आराधयामि हरिमञ्जनशैलनाथम् ॥
    ८॥ आबद्धकङ्कणमशेषशरण्यतायां आपत्सहायमपराधसहं नतानाम् । आसन्नसामगसुखालससूरिवर्गं आराधयामि हरिमञ्जनशैलनाथम्
    ॥ ९॥ अध्यासितासनसरोजसनूपुराङ् घ्रिं आमुक्तवीरकटकायतवृत्तजङ्घम् । आश्चर्यजानुयुगमप्रतिमोरुकाण्डं आराधयामि
    हरिमञ्जनशैलनाथम् ॥ १०॥ आवर्तिनिम्ननिखिलाण्डनिदाननाभिं आयामिदोर्विवरकेलिगृहावरोधम् । आबद्धरत्नमयभूषभुजाचतुष्कं
    आराधयामि हरिमञ्जनशैलनाथम् ॥ ११॥ अंसावलम्बिमणिकुण्डलकान्तगण्डं आविस्स्मितांशुमधुराधरबन्धुजीवम् । आस्याब्जसौरभसमुत्सुकदीर्घनासं
    आराधयामि हरिमञ्जनशैलनाथम् ॥ १२॥ अर्धेन्दुभास्वदलिकोल्लसदूर्ध्वपुण्ड्रं आलोलनीलकुटिलालकचारुवक्त्रम्
    । आविर्मयूखमणिचूडमहाकिरीटं आराधयामि हरिमञ्जनशैलनाथम् ॥ १३॥ वादिभीतिकरार्येण रचिता भावबन्ध तः शोभते
    वेङ्कटाद्रीशविषया स्तुतिरद्भुता ॥ ॥ इति अञ्जनशैलनाथस्तोत्रं संपूर्णम् ॥
