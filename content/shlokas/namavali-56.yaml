id: namavali-56
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: subhase namah | om gandhagarbhaya namah | om bhutaye namah | om lokadhatre namah | om vidhatre
    namah | om patre namah | om netre namah | om pavitrine namah | om kundalishaphanaratnakundalaya namah
    | 20 || om candatandavarupaya namah | om khandakhandaya namah | om mundine namah | om dandine namah
    | om khandine namah | om khadgamamsadanaya namah | om bhumipadadadhomurdhnisiddharupaya namah | om
    shuline namah | om bhasmabhyaktaya namah | om bhadraya namah | 30 || om bhimaya namah | om bhayahetave
    namah | om vaishantaya namah | om shantaya namah | om shamipushpapriyaya namah | om katyaya namah
    | om nipyaya namah | om paryaya namah | om paramatmane namah | om adhishthanaya namah | 40 || om jyeshthaya
    namah | om kanishthaya namah | om prathayishnave namah | om naktancaraya namah | om kupyaya namah
    | om kulalapataye namah | om sangrahitre namah | om prasadaya namah | om padmamaladharaya namah |
    om puranaya namah | 50 || om varenyaya namah | om karunaya namah | om taranathadharaya namah | om
    gajakrittidharaya namah | om padukapadmapadaya namah | om nagahamsakadharine namah | om girishaya
    namah | om girishaya namah | om mahakailasavasine namah | om shvasate namah | 60 || om grasate namah
    | om dhavate namah | om vasate namah | om damshtrakaralaya namah | om karavalakaraya namah | om vyaktavyaktaya
    namah | om muktaya namah | om bhuktimuktipradayine namah | om pashunam pataye namah | om vaidyutaya
    namah | 70 || om balaya namah | om balapramathanayaiva namah | om balapalaya namah | om shuline namah
    | || iti shivarahasyavyutpannam bhadrapadamasakrite shivashatashtanamavalih sampurna ||
  devanagari: सुभासे नमः । ॐ गन्धगर्भाय नमः । ॐ भूतये नमः । ॐ लोकधात्रे नमः । ॐ विधात्रे नमः । ॐ पात्रे
    नमः । ॐ नेत्रे नमः । ॐ पवित्रिणे नमः । ॐ कुण्डलीशफणारत्नकुण्डलाय नमः । २० ॥ ॐ चण्डताण्डवरूपाय नमः
    । ॐ खण्डाखण्डाय नमः । ॐ मुण्डिने नमः । ॐ दण्डिने नमः । ॐ खण्डिने नमः । ॐ खड्गमांसादनाय नमः । ॐ भूमिपादादधोमूर्ध्निसिद्धरूपाय
    नमः । ॐ शूलिने नमः । ॐ भस्माभ्यक्ताय नमः । ॐ भद्राय नमः । ३० ॥ ॐ भीमाय नमः । ॐ भयहेतवे नमः । ॐ वैशन्ताय
    नमः । ॐ शान्ताय नमः । ॐ शमीपुष्पप्रियाय नमः । ॐ काट्याय नमः । ॐ नीप्याय नमः । ॐ पार्याय नमः । ॐ परमात्मने
    नमः । ॐ अधिष्ठानाय नमः । ४० ॥ ॐ ज्येष्ठाय नमः । ॐ कनिष्ठाय नमः । ॐ प्रथयिष्णवे नमः । ॐ नक्तञ्चराय
    नमः । ॐ कूप्याय नमः । ॐ कुलालपतये नमः । ॐ सङ्ग्रहीत्रे नमः । ॐ प्रसादाय नमः । ॐ पद्ममालाधराय नमः ।
    ॐ पुराणाय नमः । ५० ॥ ॐ वरेण्याय नमः । ॐ करुणाय नमः । ॐ तारानाथधराय नमः । ॐ गजकृत्तिधराय नमः । ॐ पादुकापद्मपादाय
    नमः । ॐ नागहंसकधारिणे नमः । ॐ गिरिशाय नमः । ॐ गिरीशाय नमः । ॐ महाकैलासवासिने नमः । ॐ श्वसते नमः ।
    ६० ॥ ॐ ग्रसते नमः । ॐ धावते नमः । ॐ वसते नमः । ॐ दंष्ट्राकरालाय नमः । ॐ करवालकराय नमः । ॐ व्यक्ताव्यक्ताय
    नमः । ॐ मुक्ताय नमः । ॐ भुक्तिमुक्तिप्रदायिने नमः । ॐ पशूनां पतये नमः । ॐ वैद्युताय नमः । ७० ॥ ॐ बलाय
    नमः । ॐ बलप्रमथनायैव नमः । ॐ बालपालाय नमः । ॐ शूलिने नमः । ॥ इति शिवरहस्यव्युत्पन्नं भाद्रपदमासकृते
    शिवशताष्टनामावलिः सम्पूर्णा ॥
