id: ganapati-mala-mantra
category: stotram
name:
  english: Ganapati Mala Mantra
content:
  english: yaha eka aisa adbhuta aura camatkarika mantra hai jisake eka matra patha karane se sadhaka
    ke sabhi sankato ka vinasha ho jata hai | sabhi badhaom mem se mukti prapta kara leta hai | ganesha
    upasaka isaka pratidina nitya puja mem eka patha ka samavesha kara sakate hai | ya sankalpa lekara
    ke eka bara bara isaka patha avashya karana cahie | om klim hrim shrim aim glaum om hrim kraum gam
    om namo bhagavate mahaganapataye smaranamatrasantushtaya sarvavidyaprakashaya sarvakamapradaya bhavabandha
    vimocanaya hrim sarvabhutabandhanaya krom sadhyakarshanaya klim jagat traya vashikaranaya sau sarvamanakshobhanaya
    shrim mahasampatpradaya glaum bhumandaladhipatyapradaya mahajnanapradaya cidanandatmane gaurinandanaya
    mahayogine shivapriyaya sarvanandavardhanaya sarvavidyaprakashanapradaya dram ciranjivine blum sammohanaya
    om mokshapradaya | phat vashikuru | vaushadakarshanaya hum vidveshanaya vidveshaya vidveshaya | phat
    uccataya uccataya | thah thah stambhaya stambhaya | khem khem maraya maraya | shoshaya shoshaya |
    paramantrayantratantrani chedaya chedaya | dushtagrahana nivaraya nivaraya | duhkham hara hara | vyadhim
    nashaya nashaya | namah sampannaya sampannaya svaha | sarvapallavasvarupaya mahavidyaya gam ganapataye
    svaha | yanmantre kshitalanchitabhamanagham mrityushca vajrashisho bhutapretapishacakah pratihata
    nirghatapatadiva | utpannam ca samastadukhaduritam uccatanotpadakam vande'bhishtaganadhipam bhayaharam
    vighnaughanasham parama | om gam ganapataye namah | om namo mahaganapataye sarvagrahana curnaya curnaya
    sarvatomukha hum phat svaha | om namo ganapataye | shvetarka ganapataye | shvetarkamulanivasaya |
    vasudevapriyaya | dakshaprajapatirakshakaya | suryavaradaya | kumaragurave | brahmadisuravanditaya
    | sarpabhushanaya | shashankashekharaya | sarpamala'lankritadehaya | dharmadhvajaya | dharmavahanaya
    | trahi trahi | dehi dehi | avatara avatara | gam ganapataye | vakratundaganapataye | varavarada |
    sarvapurushavashankara | sarvadushtamrigavashankara | sarvasvavashankara | vashikuru vashikuru | sarvadosham
    bandhaya bandhaya | sarvavyadhina nikrintaya nikrintaya | sarvavishani samhara samhara | sarvadaridryam
    mocaya mocaya | sarvavighnana chindhi chindhi | sarva vajrani sphotaya sphotaya | sarvashatruna uccataya
    uccataya | sarvasiddhim kuru kuru | sarvakaryani sadhaya sadhaya | gam gim gum gaim gaum gam ganapataye
    hum phat svaha | om namo ganapate mahavira dashabhuja madanakala vinashana mrityum hana hana | kalam
    samhara samhara | dhama dhama | matha matha | trailokyam mohaya mohaya | brahmavishnurudrana mohaya
    mohaya | acintya bala parakrama | sarvavyadhina vinashaya | sarvagrahana curnaya curnaya | nagan motaya
    motaya | tribhuvaneshvara sarvatomukha hum phat svaha | || astu ||
  devanagari: यह एक ऐसा अद्भुत और चमत्कारिक मन्त्र है जिसके एक मात्र पाठ करने से साधक के सभी सङ्कटो का
    विनाश हो जाता है । सभी बाधाॐ में से मुक्ति प्राप्त कर लेता है । गणेश उपासक इसका प्रतिदिन नित्य पूजा
    में एक पाठ का समावेश कर सकते है । या सङ्कल्प लेकर के एक बार बार इसका पाठ अवश्य करना चाहिए । ॐ क्लीं
    ह्रीं श्रीं ऐं ग्लौं ॐ ह्रीं क्रौं गं ॐ नमो भगवते महागणपतये स्मरणमात्रसन्तुष्टाय सर्वविद्याप्रकाशाय
    सर्वकामप्रदाय भवबन्ध विमोचनाय ह्रीं सर्वभूतबन्धनाय क्रों साध्याकर्षणाय क्लीं जगत् त्रय वशीकरणाय सौ
    सर्वमनक्षोभणाय श्रीं महासम्पत्प्रदाय ग्लौं भूमण्डलाधिपत्यप्रदाय महाज्ञानप्रदाय चिदानन्दात्मने गौरीनन्दनाय
    महायोगिने शिवप्रियाय सर्वानन्दवर्धनाय सर्वविद्याप्रकाशनप्रदाय द्रां चिरञ्जीविने ब्लूं सम्मोहनाय ॐ
    मोक्षप्रदाय । फट् वशीकुरु । वौषडाकर्षणाय हुं विद्वेषणाय विद्वेषय विद्वेषय । फट् उच्चाटय उच्चाटय ।
    ठः ठः स्तम्भय स्तम्भय । खें खें मारय मारय । शोषय शोषय । परमन्त्रयन्त्रतन्त्राणि छेदय छेदय । दुष्टग्रहान
    निवारय निवारय । दुःखं हर हर । व्याधिं नाशय नाशय । नमः सम्पन्नय सम्पन्नय स्वाहा । सर्वपल्लवस्वरुपाय
    महाविद्याय गं गणपतये स्वाहा । यन्मन्त्रे क्षितलान्छितभमनघं मृत्युश्च वज्राशिशो भूतप्रेतपिशाचकाः प्रतिहता
    निर्घातपातादिव । उत्पन्नं च समस्तदुखदुरितं उच्चाटनोत्पादकं वन्देऽभिष्टगणाधिपं भयहरं विघ्नौघनाशं परम
    । ॐ गं गणपतये नमः । ॐ नमो महागणपतये सर्वग्रहान चूर्णय चूर्णय सर्वतोमुख हुं फट् स्वाहा । ॐ नमो गणपतये
    । श्वेतार्क गणपतये । श्वेतार्कमूलनिवासाय । वासुदेवप्रियाय । दक्षप्रजापतिरक्षकाय । सूर्यवरदाय । कुमारगुरवे
    । ब्रह्मादिसुरावन्दिताय । सर्पभूषणाय । शशाङ्कशेखराय । सर्पमालाऽलङ्कृतदेहाय । धर्मध्वजाय । धर्मवाहनाय
    । त्राहि त्राहि । देहि देहि । अवतर अवतर । गं गणपतये । वक्रतुण्डगणपतये । वरवरद । सर्वपुरुषवशङ्कर ।
    सर्वदुष्टमृगवशङ्कर । सर्वस्ववशङ्कर । वशीकुरु वशीकुरु । सर्वदोषां बन्धय बन्धय । सर्वव्याधीन निकृन्तय
    निकृन्तय । सर्वविषाणी संहर संहर । सर्वदारिद्र्यं मोचय मोचय । सर्वविघ्नान छिन्धि छिन्धि । सर्व वज्राणि
    स्फोटय स्फोटय । सर्वशत्रून उच्चाटय उच्चाटय । सर्वसिद्धिं कुरु कुरु । सर्वकार्याणि साधय साधय । गां
    गीं गूं गैं गौं गं गणपतये हुम् फट् स्वाहा । ॐ नमो गणपते महावीर दशभुज मदनकाल विनाशन मृत्युं हन हन ।
    कालं संहर संहर । धम धम । मथ मथ । त्रैलोक्यं मोहय मोहय । ब्रह्मविष्णुरूद्रान मोहय मोहय । अचिन्त्य बल
    पराक्रम । सर्वव्याधीन विनाशाय । सर्वग्रहान चूर्णय चूर्णय । नागान् मोटय मोटय । त्रिभुवनेश्वर सर्वतोमुख
    हुं फट् स्वाहा । ॥ अस्तु ॥
