id: devaihkritam04devistotram
category: stotram
name:
  english: devaihkritam04devistotram
  devanagari: देवैःकृतं०४देवीस्तोत्रम्
content:
  english: devaih kritam 4 devistotram namo'stu sarvage devi namaste sarvapujite | kamage'cintye namaste
    tridashashraye || 16|| namaste paramadevi brahmayone namo namah | ardhamatre'kshare caiva tasyardhardhe
    namo namah || 17|| namaste padmapatrakshi vishvamatarnamonamah | namaste varade devi rajahsattvatamomayi
    || 18|| svasvarupasthite devi tvam ca samsaralakshanam | tvam buddhistvam dhritih kshantistvam svaha
    tvam svadha kshama || 19|| tvam vriddhistvam gatih kartri shaci lakshmishca parvati | savitri tvam
    ca gayatri ajeya papanashini || 3
  devanagari: देवैः कृतं ४ देवीस्तोत्रम् नमोऽस्तु सर्वगे देवि नमस्ते सर्वपूजिते । कामगेऽचिन्त्ये नमस्ते
    त्रिदशाश्रये ॥ १६॥ नमस्ते परमादेवि ब्रह्मयोने नमो नमः । अर्धमात्रेऽक्षरे चैव तस्यार्धार्धे नमो नमः
    ॥ १७॥ नमस्ते पद्मपत्राक्षि विश्वमातर्नमोनमः । नमस्ते वरदे देवि रजःसत्त्वतमोमयि ॥ १८॥ स्वस्वरूपस्थिते
    देवि त्वं च संसारलक्षणम् । त्वं बुद्धिस्त्वं धृतिः क्षान्तिस्त्वं स्वाहा त्वं स्वधा क्षमा ॥ १९॥ त्वं
    वृद्धिस्त्वं गतिः कर्त्री शची लक्ष्मीश्च पार्वती । सावित्री त्वं च गायत्री अजेया पापनाशिनी ॥ ३
meaning: {}
