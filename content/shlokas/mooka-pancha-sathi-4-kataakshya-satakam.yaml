id: mooka-pancha-sathi-4-kataakshya-satakam
category: stotram
name:
  english: Mooka Pancha Sathi 4 - Kataakshya Satakam
content:
  english: mohandhakaranivaham vinihantumide mukatmanamapi mahakavitavadanyan | shrikancideshashishirikritijagarukan
    ekamranathatarunikarunavalokan || || matarjayanti mamatagrahamokshanani mahendranilarucishikshanadakshinani
    | kamakshi kalpitajagattrayarakshanani tvadvikshanani varadanavicakshanani || || anangatantravidhidarshitakaushalanam
    anandamandaparighurnitamantharanam | taralyamamba tava taditakarnasimnam kamakshi khelati katakshanirikshananam
    || || kallolitena karunarasavellitena kalmashitena kamaniyamridusmitena | mamancitena tava kincana
    kuncitena kamakshi tena shishirikuru vikshitena || || sahayyakam gatavati muhurarjanasya mandasmitasya
    paritoshitabhimacetah | kamakshi pandavacamuriva tavakina karnantikam calati hanta katakshalakshmih
    || || astam kshanannayatu me paritapasuryam anandacandramasamanayatam prakasham | kalandhakarasushumam
    kalayandigante kamakshi komalakatakshanishagamaste || || tatankamauktikarucankuradantakantih karunyahastipashikhamaninadhirudhah
    | unmulayatvashubhapadapamasmadiyam kamakshi tavakakatakshamatangajetandrah || || chayabharane jagatam
    paritapahari tatankaratnamanitallajapallavashrih | karunyanama vikiranmakarandajalam kamakshi rajati
    katakshasuradrumaste || || suryashrayapranayini manikundalamshu lauhityakokanadakananamananiya | yanti
    tava smaraharananakantisindhum kamakshi rajati katakshakalindakanya || || prapnoti yam sukritinam
    tava pakshapatat kamakshi vikshanavilasakalapurandhri | sadyastameva kila muktivadhurvrinite tasmannitantamanayoridamaikamatyam
    || || yanti sadaiva marutamanukulabhavam bhruvallishakradhanurullasita rasardra | kamakshi kautukatarangitanilakantha
    kadambiniva tava bhati katakshamala || || gangambhasi smitamaye tapanatmajeva gangadharorasi navotpalamalikeva
    | vaktraprabhasarasi shaivalamandaliva kamakshi rajati kataksharucicchata te || || samskaratah kimapi
    kandalitan rasajna kedarasimni sudhiyamupabhogayogyan | kalyanasuktilaharikalamankurannah kamakshi
    pakshmalayatu tvadapangameghah || || cancalyameva niyatam kalayanprakritya malinyabhuh shratipathakramajagarukah
    | kaivalyameva kimu kalpayate natanam kamakshi citramapi te karunakatakshah || || sanjivane janani
    cutashilimukhasya sammohane shashikishorakashekharasya | samstambhane ca mamatagrahaceshtitasya kamakshi
    vikshanakala paramaushadham te || || nilo'pi ragamadhikam janayanpurareh lolo'pi bhaktimadhikam dridhayannaranam
    | vakro'pi devi namatam samatam vitanvan kamakshi nrityatu mayi tvadapangapatah || || kamadruho hridayayantranajagaruka
    kamakshi cancaladrigancalamekhala te | ashcaryamamba bhajatam jhatiti svakiya samparka eva vidhunoti
    samastabandhan || || kunthikarotu vipadam mama kuncitabhru capancitah shritavidehabhavanuragah | rakshopakaramanisham
    janayanjagatyam kamakshi rama iva te karunakatakshah || || shrikamakoti shivalocanashoshitasya shringarabijavibhavasya
    punahprarohe | premambhasardramaciratpracurena shanke kedaramamba tava kevaladrishtipatam || || mahatmyashevadhirasau
    tava durvilanghya samsaravindhyagirikunthanakelicuncuh | dhairyambudhim pashupateshculakikaroti kamakshi
    vikshanavijrimbhanakumbhajanma || || piyushavarshavashishira sphutadutpalashri maitri nisargamadhura
    kritatarakaptih | kamakshi samshritavati vapurashtamurteh jyotsnayate bhagavati tvadapangamala ||
    || amba smarapratibhatasya vapurmanojnam ambhojakananamivancitakantakabham | bhringiva cumbati sadaiva
    sapakshapata kamakshi komalarucistvadapangamala || || keshaprabhapatalanilavitanajale kamakshi kundalamanicchavidipashobhe
    | shanke kataksharucirangatale kripakhya shailushika natati shankaravallabhe te || || atyantashitalamatandrayatu
    kshanardham astokavibhramamanangavilasakandam | alpasmitadritamaparakripapravaham akshiprarohamaciranmayi
    kamakoti || || mandaksharagataralikritiparatantryat kamakshi mantharataram tvadapangadolam | aruhya
    mandamatikautukashali cakshuh anandameti muhurardhashashankamauleh || || traiyambakam tripurasundari
    harmyabhumi rangam viharasarasi karunapravahah | dasashca vasavamukhah paripalaniyam kamakshi vishvamapi
    vikshanabhubhritaste || || vagishvari sahacari niyamena lakshmih bhruvallarivashakari bhuvanani geham
    | rupam trilokanayanamritamamba tesham kamakshi yeshu tava vikshanaparatantri || || maheshvaram jhatiti
    manasaminamamba kamakshi dhairyajaladhau nitaram nimagnam | jalena shrinkhalayati tvadapanganamna
    vistaritena vishamayudhadashako'sau || || unmathya bodhakamalakaramamba jadya stamberamam mama manovipine
    bhramantam | kunthikurushva tarasa kutilagrasimna kamakshi tavakakatakshamahankushena || || udvellitastabakitairlalitairvilasaih
    utthaya devi tava gadhakatakshakunjat | duram palayayatu mohamrigikulam me kamakshi stavaramanugrahakesarindrah
    || || snehadritam vidalitotpalakanticoram jetarameva jagadishvari jetukamah | manoddhato makaraketurasau
    dhunite kamakshi tavakakatakshakripanavallim || || shrautim vrajannapi sada saranim muninam kamakshi
    santatamapi smritimargagami | kautilyamamba kathamasthiratam ca dhatte cauryam ca pankajarucam tvadapangapatah
    || || nityam shretuh paricitau yatamanameva nilotpalam nijasamipanivasalolam | prityaiva pathayati
    vikshanadeshikendrah kamakshi kintu tava kalimasampradayam || || bhrantva muhuh stabakitasmitaphenarashau
    kamakshi vaktrarucisancayavarirashau | anandati tripuramardananetralakshmih alambya devi tava mandamapangasetum
    || || shyama tava tripurasundari locanashrih kamakshi kandalitameduratarakantih | jyotsnavati smitarucapi
    katham tanoti spardhamaho kuvalayaishca tatha cakoraih || || kalanjanam ca tava devi nirikshanam ca
    kamakshi samyasaranim samupaiti kantya | nishsheshanetrasulabham jagatishu purva manyattrinetrasulabham
    tuhinadrikanye || || dhumankuro makaraketanapavakasya kamakshi netrarucinilimacaturi te | atyantamadbhutamidam
    nayanatrayasya harshodayam janayate harunankamauleh || || arabhbhaleshasamaye tava vikshanassa kamakshi
    mukamapi vikshanamatranamram | sarvajnata sakalalokasamakshameva kirtisvayamvaranamalyavati vrinite
    || || kalambuvaha uva te paritapahari kamakshi pushkaramadhahkurute katakhkshshah | purvah param kshanaruca
    samupaiti maitri tatarucim prakatikaroti || || sukshme'pi durgamatare'pi guruprasada sahayyakena vicarannapavargamarge
    | samsarapankanicaye na patatyamum te kamakshi gadhamavalambya katakshayashtim || || kamakshi santatamasau
    harinilaratna stambhe kataksharucipunjamaye bhavatyah | baddho'pi bhaktinigalairmama cittahasti stambham
    ca bandhamapi muncati hanta citram || || kamakshi kashnaryamapi santatamanjanam ca bibhrannisargataralo'pi
    bhavatkatakshah | vaimalyamanvahamananjanata ca bhuyah sthairyam ca bhaktahridayaya katham dadati
    || || mandasmitastabakitam manikundalamshu stomapravalaruciram shishirikritasham | kamakshi rajati
    kataksharuceh kadambam udyanamamba karunaharinekshanayah || || kamakshi tavakakatakshamahendranila
    simhasanam shritavato makaradhvajasya | samrajyamangalavidhau munikundalashrih nirajanotsavatarangitadipamala
    || || matah kshanam snapaya mam tava vikshitena mandakshitena sujanairaparokshitena | kamakshi karmatimirotkarabhaskarena
    shreyaskarena madhupadyutitaskarena || || premapagapayasi majjanamaracayya yuktah smitamshukritabhasmavilepanena
    | kamakshi kundalamanidyutibhirjatalah shrikanthameva bhajate tava drishtipatah || || kaivalyadaya
    karunarasakinkaraya kamakshi kandalitavibhramashankaraya | alokanaya tava bhaktashivankaraya matarnamo'stu
    paratantritashankaraya || || samrajyamangalavidhau makaradhvajasya lolalakalikritatoranamalyashobhe
    | kameshvari pracaladutpalavaijayanti caturyameti tava cancaladrishtipatah || || margena manjukacakantitamovritena
    mandayamanagamana madanaturasau | kamakshi drishtirayate tava shankaraya sanketabhumimaciradabhisarikeva
    || || vridanuvrittiramanikritasahacarya shaivalitam galaruca shashishekharasya | kamakshi kantisarasim
    tvadapangalakshmih mandam samashrayati majjanakhelanaya || || kashayamamshukamiva prakatam dadhano
    manikyakundalarucim mamatavirodhi | shrutyantasimani ratah sutaram cakasti kamakshi tavakakatakshayatishvaro'sau
    || || pashana eva harinilamanirdineshu pramlanatam kuvalayam prakatikaroti | naumittiko jaladamecakima
    tataste kamakshi shunyamupamanamapangalakshmyah || || shringaravibhramavati sutaram salajja nasagramauktikaruca
    kritamandahasa | shyama katakshasushama tava yuktametat kamakshi cumbati digambaravaktrabimbam ||
    || nilotpalena madhupena ca drishtipatah kamakshi tulya iti te kathamamananti | shaityena nindayati
    yadanvahamindupadan pathoruhena yadasau kalahayate ca || || oshthaprabhapatalavidrumamudrite te bhruvallivicisubhage
    mukhakantisindhau | kamakshi varibharapuranalambamana kalambuvahasaranim labhate katakshah || || mandasmitairdhavalita
    manikundalamshu samparkalohitarucistvadapangadhara | kamakshi mallikusumairnavapallavaishca nilotpalaishca
    raciteva vibhati mala || || kamakshi shitalakriparasanirjharambhah samparkapakshmalarucistvadapangamala
    | gobhih sada purariporabhilashyamana durvakadambakavidambanamatanoti || || hritpankajam mama vikasayatu
    pramushna nnullasamutpalarucestamasam niroddha | doshanushangajadatam jagatam dhunanah kamakshi vikshanavilasadinodayaste
    || || cakshurvimohayati candravibhushanasya kamakshi tavakakatakshatamahprarohah | pratyanmukham tu
    nayanam stimitam muninam prakashyameva nayatiti param vicitram || || kamakshi vikshanaruca yudhi nirjitam
    te nilotpalam niravasheshagatabhimanam | agatya tatparisaram shravanavatamsa vyojena nunamabhayarthanamatanoti
    || || ashcaryamamba madanabhyudayavalambah kamakshi cancalanirikshanavibhramaste | dhairyam vidhuya
    tanute hridi ragabandham shambhostadeva viparitataya muninam || || jantoh sakritpranamato jagadidyatam
    ca tejasvitam ca nishitam ca matim sabhayam | kamakshi makshikajharimiva vaikharim ca lakshmim ca
    pakshmalayati kshanavikshanam te || || kadambini kimayate na jalanushangam bhringavali kimurarikurute
    na padmam | kim va kalindatanaya sahate na bhangam kamakshi nishcayapadam na tavakshilakshmih || ||
    kakolapavakatrinikarane'pi dakshah kamakshi balakasudhakarashekharasya | atyantashitalatamo'pyanuparatam
    te cittam vimohayati citramayam katakshah || || karpanyapuraparivardhitamamba moha kandodgatam bhavamayam
    vishapadapam me | tungam chinattu tuhinadrisute bhavatyah kancipureshvari katakshakutharadhara ||
    || kamakshi ghorabhavarogacikitsanartha mabhyarthya deshikakatakshabhishakprasadat | tatrapi devi
    labhate sukriti kadaci danyasya durlabhamapangamahaushadham te || || kamakshi deshikakripankuramashrayanto
    nanataponiyamanashitapashabandhah | vasalayam tava katakshamamum mahanto labdhva sukham samadhiyo
    vicaranti loke || || sakutasamlapitasambhritamugdhahasam vridanuragasahacari vilokanam te | kamakshi
    kamaparipanthini maravira samrajyavibhramadasham saphalikaroti || || kamakshi vibhramabalaikanidhirvidhaya
    bhruvallicapakutilikritimeva citram | svadhinatam tava ninaya shashankamaule rangardharajyasukhalabhamapangavirah
    || || kamankuraikanilayastava drishtipatah kamakshi bhaktamanasam pradadatu kaman | raganvitah svayamapi
    prakatikaroti vairagyameva kathamesha mahamuninam || || kalambuvahanivahaih kalahayate te kamakshi
    kalimamadena sada katakshah | citram tathapi nitaramamumeva drishtva sotkantha eva ramate kila nilakanthah
    || || kamakshi manmatharipum prati maratapa mohandhakarajaladagamanena nrityan | dushkarmakancukikulam
    kabalikarotu vyamishramecakarucistvadapangakeki || || kamakshi manmathariporavalokaneshu kantam payojamiva
    tavakamakshipatam | premagamo divasavadvikacikaroti lajjabharo rajanivanmukulikaroti || || muko virincati
    param purushah kurupah kandarpati tridasharajati kimpacanah | kamakshi kevalamupakramakala eva lilatarangitakataksharucah
    kshanam te || || nilalaka madhukaranti manojnanasa muktarucah prakatakandabisankuranti | karunyamamba
    makarandati kamakoti manye tatah kamalameva vilocanam te || || akankshyamanaphaladanavicakshanayah
    | kamakshi tavakakatakshakakamadhenoh | samparka eva kathamamba vimuktapasha bandhah sphutam tanubhritah
    pashutam tyajanti || || samsaragharmaparitapajusham naranam kamakshi shitalatarani tavekshitani |
    candratapanti ghanacandanakardamanti muktagunanti himavarinishecananti || || premamburashisatatasnapitani
    citram kamakshi tavakakatakshanirikshanani | sandhukshayanti muhurindhanarashiritya maradruho manasi
    manmathacitrabhanum || || kalanjanapratibhatam kamaniyakantya kandarpatantrakalaya kalitanubhavam
    | kancivihararasike kalusharticoram kallolayasva mayi te karunakataksham || || krantena manmathadena
    vimohyamana svantena cutatarumulagatasya pumsah | kantena kincidavalokaya locanasya prantena mam janani
    kancipurivibhushe || || kamakshi ko'pi sujanastvadapangasange kanthena kandalitakalimasampradayah
    | uttamsakalpitacakorakutumbaposha naktandivasaprasavabhunayana bhavanti || || nilotpalaprasavakantinirdashanena
    karunyavibhramajusha tava vikshanena | kamakshi karmajaladheh kalashisutena pashatrayadvayamami parimocaniyah
    || || atyantacancalamakritrimamanjanam kim jhankarabhangirahita kimu bhringamala | dhumankurah kimu
    hutashanasangahinah kamakshi netrarucinilimakandali te || || kamakshi nityamayamanjalirastu mukti
    bijaya vibhramamadodayaghurnitaya | kandarpadarpapunarudbhavasiddhidaya kalyanadaya tava devi drigancalaya
    || || darpankuro makaraketanavibhramanam nindankuro vidalitotpalacaturinam | dipankuro bhavatamisrakadambakanam
    kamakshi palayatu mam tvadapangapatah || || kaivalyadivyamanirohanaparvatebhyah karunyanirjharapayahkritamanjanebhyah
    | kamakshi kinkaritashankaramanasebhya stebhyo namo'stu tava vikshanavibhramebhyah || || alpiya eva
    navamutpalamamba hina minasya va saraniramburuham ca kim va | dure mrigidrigasamanjasamanjanam ca
    kamakshi vikshanarucau tava tarkayamah || || mishribhavadgaralapankilashankaroras simangane kimapi
    rinkhanamadadhanah | helavadhutalalitashravanotpalo'sau kamakshi bala iva rajati te katakshah || ||
    praudhikaroti vidusham navasuktidhati cutatavishu budhakokilalalyamanam | madhvirasam parimalam ca
    nirargalam te kamakshi vikshanavilasavasantalakshmih || || kulankasham vitanute karunambuvarshi sarasvatam
    sukritinah sulabham pravaham | tucchikaroti yamunambutarangabhangim kamakshi kim tava katakshamahambuvahah
    || || jagarti devi karunashukasundari te tatankaratnarucidadimakhandashone | kamakshi nirbharakatakshamaricipunja
    mahendranilamanipanjaramadhyabhage || || kamakshi satkuvalayasya sagotrabhava dakramati shrutimasau
    tava drishtipatah | kinca sphutam kutilatam prakatikaroti bhruvallariparicitasya phalam kimetat ||
    || esha tavakshisushama vishamayudhasya naracavarshalahari nagarajakanye | shanke karoti shatadha
    hridi dhairyamudram shrikamakoti yadasau shishiramshumauleh || || banena pushpadhanushah parikalpyamana
    tranena bhaktamanasam karunakarena | konena komaladrishastava kamakoti shonena shoshaya shive mama
    shokasindhum || || maradruha mukutasimani lalyamane mandakinipayasi te kutilam carishnuh | kamakshi
    koparabhasadvalamanamina sandehamankurayati kshanamakshipatah || || kamakshi samvalitamauktikakundalamshu
    cancatsitashravanacamaracaturikah | stambhe nirantaramapangamaye bhavatya baddhashcakasti makaradhvajamattahasti
    || || yavatkataksharajanisamayagamaste kamakshi tavadacirannamatam naranam | avirbhavatyamritadidhitibimbamamba
    samvinmayam hridayapurvagirindrashringe || || kamakshi kalpavitapiva bhavatkataksho ditsuh samastavibhavam
    namatam naranam | bhringasya nilanalinasya ca kantisampa tsarvasvameva haratiti param vicitram ||
    || atyantashitalamanargalakarmapaka kakolahari sulabham sumanobhiretat | piyushameva tava vikshanamamba
    kintu kamakshi nilamidamityayameva bhedah || || ajnatabhaktirasamaprasaradviveka matyantagarvamanadhitasamastashastram
    | apraptasatyamasamipagatam ca mukteh kamakshi naiva tava sprihayati drishtipatah || kamakshi mamavatu
    te karunakatakshah patena locanarucestava kamakoti potena patakapayodhibhayaturanam | putena tena
    navakancanakundalamshu vitena shitalaya bhudharakanyake mam || || || iti katakshashatakam sampurnam
    ||
  devanagari: मोहान्धकारनिवहं विनिहन्तुमीडे मूकात्मनामपि महाकवितावदान्यान् । श्रीकाञ्चिदेशशिशिरीकृतिजागरूकान्
    एकाम्रनाथतरुणीकरुणावलोकान् ॥ ॥ मातर्जयन्ति ममताग्रहमोक्षणानि माहेन्द्रनीलरुचिशिक्षणदक्षिणानि । कामाक्षि
    कल्पितजगत्त्रयरक्षणानि त्वद्वीक्षणानि वरदानविचक्षणानि ॥ ॥ आनङ्गतन्त्रविधिदर्शितकौशलानाम् आनन्दमन्दपरिघूर्णितमन्थराणाम्
    । तारल्यमम्ब तव ताडितकर्णसीम्नां कामाक्षि खेलति कटाक्षनिरीक्षणानाम् ॥ ॥ कल्लोलितेन करुणारसवेल्लितेन
    कल्माषितेन कमनीयमृदुस्मितेन । मामञ्चितेन तव किञ्चन कुञ्चितेन कामाक्षि तेन शिशिरीकुरु वीक्षितेन ॥ ॥
    साहाय्यकं गतवती मुहुरर्जनस्य मन्दस्मितस्य परितोषितभीमचेताः । कामाक्षि पाण्डवचमूरिव तावकीना कर्णान्तिकं
    चलति हन्त कटाक्षलक्ष्मीः ॥ ॥ अस्तं क्षणान्नयतु मे परितापसूर्यम् आनन्दचन्द्रमसमानयतां प्रकाशम् । कालान्धकारसुषुमां
    कलयन्दिगन्ते कामाक्षि कोमलकटाक्षनिशागमस्ते ॥ ॥ ताटाङ्कमौक्तिकरुचाङ्कुरदन्तकान्तिः कारुण्यहस्तिपशिखामणिनाधिरूढः
    । उन्मूलयत्वशुभपादपमस्मदीयं कामाक्षि तावककटाक्षमतङ्गजेतन्द्रः ॥ ॥ छायाभरणे जगतां परितापहारी ताटङ्करत्नमणितल्लजपल्लवश्रीः
    । कारुण्यनाम विकिरन्मकरन्दजालं कामाक्षि राजति कटाक्षसुरद्रुमस्ते ॥ ॥ सूर्याश्रयप्रणयिनी मणिकुण्डलांशु
    लौहित्यकोकनदकाननमाननीया । यान्ती तव स्मरहराननकान्तिसिन्धुं कामाक्षि राजति कटाक्षकलिन्दकन्या ॥ ॥ प्राप्नोति
    यं सुकृतिनं तव पक्षपातात् कामाक्षि वीक्षणविलासकलापुरन्ध्री । सद्यस्तमेव किल मुक्तिवधूर्वृणीते तस्मान्नितान्तमनयोरिदमैकमत्यम्
    ॥ ॥ यान्ती सदैव मरुतामनुकूलभावं भ्रूवल्लिशक्रधनुरुल्लसिता रसार्द्रा । कामाक्षि कौतुकतरङ्गितनीलकण्ठा
    कादम्बिनीव तव भाति कटाक्षमाला ॥ ॥ गङ्गाम्भसि स्मितमये तपनात्मजेव गङ्गाधरोरसि नवोत्पलमालिकेव । वक्त्रप्रभासरसि
    शैवलमण्डलीव कामाक्षि राजति कटाक्षरुचिच्छटा ते ॥ ॥ संस्कारतः किमपि कन्दलितान् रसज्ञ केदारसीम्नि सुधियामुपभोगयोग्यान्
    । कल्याणसूक्तिलहरीकलमाङ्कुरान्नः कामाक्षि पक्ष्मलयतु त्वदपाङ्गमेघः ॥ ॥ चाञ्चल्यमेव नियतं कलयन्प्रकृत्या
    मालिन्यभूः श्रतिपथाक्रमजागरूकः । कैवल्यमेव किमु कल्पयते नतानां कामाक्षि चित्रमपि ते करुणाकटाक्षः ॥
    ॥ सञ्जीवने जननि चूतशिलीमुखस्य सम्मोहने शशिकिशोरकशेखरस्य । संस्तम्भने च ममताग्रहचेष्टितस्य कामाक्षि
    वीक्षणकला परमौषधं ते ॥ ॥ नीलोऽपि रागमधिकं जनयन्पुरारेः लोलोऽपि भक्तिमधिकां दृढयन्नराणाम् । वक्रोऽपि
    देवि नमतां समतां वितन्वन् कामाक्षि नृत्यतु मयि त्वदपाङ्गपातः ॥ ॥ कामद्रुहो हृदययन्त्रणजागरूका कामाक्षि
    चञ्चलदृगञ्चलमेखला ते । आश्चर्यमम्ब भजतां झटिति स्वकीय सम्पर्क एव विधुनोति समस्तबन्धान् ॥ ॥ कुण्ठीकरोतु
    विपदं मम कुञ्चितभ्रू चापाञ्चितः श्रितविदेहभवानुरागः । रक्षोपकारमनिशं जनयञ्जगत्यां कामाक्षि राम इव
    ते करुणाकटाक्षः ॥ ॥ श्रीकामकोटि शिवलोचनशोषितस्य शृङ्गारबीजविभवस्य पुनःप्ररोहे । प्रेमाम्भसार्द्रमचिरात्प्रचुरेण
    शङ्के केदारमम्ब तव केवलदृष्टिपातम् ॥ ॥ माहात्म्यशेवधिरसौ तव दुर्विलङ्घ्य संसारविन्ध्यगिरिकुण्ठनकेलिचुञ्चुः
    । धैर्याम्बुधिं पशुपतेश्चुलकीकरोति कामाक्षि वीक्षणविजृम्भणकुम्भजन्मा ॥ ॥ पीयूषवर्षवशिशिरा स्फुटदुत्पलश्री
    मैत्री निसर्गमधुरा कृततारकाप्तिः । कामाक्षि संश्रितवती वपुरष्टमूर्तेः ज्योत्स्नायते भगवति त्वदपाङ्गमाला
    ॥ ॥ अम्ब स्मरप्रतिभटस्य वपुर्मनोज्ञम् अम्भोजकाननमिवाञ्चितकण्टकाभम् । भृङ्गीव चुम्बति सदैव सपक्षपाता
    कामाक्षि कोमलरुचिस्त्वदपाङ्गमाला ॥ ॥ केशप्रभापटलनीलवितानजाले कामाक्षि कुण्डलमणिच्छविदीपशोभे । शङ्के
    कटाक्षरुचिरङ्गतले कृपाख्या शैलूषिका नटति शङ्करवल्लभे ते ॥ ॥ अत्यन्तशीतलमतन्द्रयतु क्षणार्धम् अस्तोकविभ्रममनङ्गविलासकन्दम्
    । अल्पस्मितादृतमपारकृपाप्रवाहम् अक्षिप्ररोहमचिरान्मयि कामकोटि ॥ ॥ मन्दाक्षरागतरलीकृतिपारतन्त्र्यात्
    कामाक्षि मन्थरतरां त्वदपाङ्गडोलाम् । आरुह्य मन्दमतिकौतुकशालि चक्षुः आनन्दमेति मुहुरर्धशशाङ्कमौलेः
    ॥ ॥ त्रैयम्बकं त्रिपुरसुन्दरि हर्म्यभूमि रङ्गं विहारसरसी करुणाप्रवाहः । दासाश्च वासवमुखाः परिपालनीयं
    कामाक्षि विश्वमपि वीक्षणभूभृतस्ते ॥ ॥ वागीश्वरी सहचरी नियमेन लक्ष्मीः भ्रूवल्लरीवशकरी भुवनानि गेहम्
    । रूपं त्रिलोकनयनामृतमम्ब तेषां कामाक्षि येषु तव वीक्षणपारतन्त्री ॥ ॥ माहेश्वरं झटिति मानसमीनमम्ब
    कामाक्षि धैर्यजलधौ नितरां निमग्नम् । जालेन शृङ्खलयति त्वदपाङ्गनाम्ना विस्तारितेन विषमायुधदाशकोऽसौ
    ॥ ॥ उन्मथ्य बोधकमलाकारमम्ब जाड्य स्तम्बेरमं मम मनोविपिने भ्रमन्तम् । कुण्ठीकुरुष्व तरसा कुटिलाग्रसीम्ना
    कामाक्षि तावककटाक्षमहाङ्कुशेन ॥ ॥ उद्वेल्लितस्तबकितैर्ललितैर्विलासैः उत्थाय देवि तव गाढकटाक्षकुञ्जात्
    । दूरं पलाययतु मोहमृगीकुलं मे कामाक्षि स्तवरमनुग्रहकेसरीन्द्रः ॥ ॥ स्नेहादृतां विदलितोत्पलकन्तिचोरां
    जेतारमेव जगदीश्वरि जेतुकामः । मानोद्धतो मकरकेतुरसौ धुनीते कामाक्षि तावककटाक्षकृपाणवल्लीम् ॥ ॥ श्रौतीं
    व्रजन्नपि सदा सरणिं मुनीनां कामाक्षि सन्ततमपि स्मृतिमार्गगामी । कौटिल्यमम्ब कथमस्थिरतां च धत्ते चौर्यं
    च पङ्कजरुचां त्वदपाङ्गपातः ॥ ॥ नित्यं श्रेतुः परिचितौ यतमानमेव नीलोत्पलं निजसमीपनिवासलोलम् । प्रीत्यैव
    पाठयति वीक्षणदेशिकेन्द्रः कामाक्षी किन्तु तव कालिमसम्प्रदायम् ॥ ॥ भ्रान्त्वा मुहुः स्तबकितस्मितफेनराशौ
    कामाक्षि वक्त्ररुचिसञ्चयवारिराशौ । आनन्दति त्रिपुरमर्दननेत्रलक्ष्मीः आलम्ब्य देवि तव मन्दमपाङ्गसेतुम्
    ॥ ॥ श्यामा तव त्रिपुरसुन्दरि लोचनश्रीः कामाक्षि कन्दलितमेदुरतारकान्तिः । ज्योत्स्नावती स्मितरुचापि
    कथं तनोति स्पर्धामहो कुवलयैश्च तथा चकोरैः ॥ ॥ कालाञ्जनं च तव देवि निरीक्षणं च कामाक्षि साम्यसरणिं
    समुपैति कान्त्या । निश्शेषनेत्रसुलभं जगतीषु पूर्व मन्यत्त्रिनेत्रसुलभं तुहिनाद्रिकन्ये ॥ ॥ धूमाङ्कुरो
    मकरकेतनपावकस्य कामाक्षि नेत्ररुचिनीलिमचातुरी ते । अत्यन्तमद्भुतमिदं नयनत्रयस्य हर्षोदयं जनयते हरुणाङ्कमौलेः
    ॥ ॥ आरभ्भलेशसमये तव वीक्षणस्स कामाक्षि मूकमपि वीक्षणमात्रनम्रम् । सर्वज्ञता सकललोकसमक्षमेव कीर्तिस्वयंवरणमाल्यवती
    वृणीते ॥ ॥ कालाम्बुवाह उव ते परितापहारी कामाक्षि पुष्करमधःकुरुते कटाख्क्ष्षः । पूर्वः परं क्षणरुचा
    समुपैति मैत्री ततरुचिं प्रकटीकरोति ॥ ॥ सूक्ष्मेऽपि दुर्गमतरेऽपि गुरुप्रसाद साहाय्यकेन विचरन्नपवर्गमार्गे
    । संसारपङ्कनिचये न पतत्यमूं ते कामाक्षि गाढमवलम्ब्य कटाक्षयष्टिम् ॥ ॥ कामाक्षि सन्ततमसौ हरिनीलरत्न
    स्तम्भे कटाक्षरुचिपुञ्जमये भवत्याः । बद्धोऽपि भक्तिनिगलैर्मम चित्तहस्ती स्तम्भं च बन्धमपि मुञ्चति
    हन्त चित्रम् ॥ ॥ कामाक्षि काष्णर्यमपि सन्ततमञ्जनं च बिभ्रन्निसर्गतरलोऽपि भवत्कटाक्षः । वैमल्यमन्वहमनञ्जनता
    च भूयः स्थैर्यं च भक्तहृदयाय कथं ददाति ॥ ॥ मन्दस्मितस्तबकितं मणिकुण्डलांशु स्तोमप्रवालरुचिरं शिशिरीकृताशम्
    । कामाक्षि राजति कटाक्षरुचेः कदम्बम् उद्यानमम्ब करुणाहरिणेक्षणायाः ॥ ॥ कामाक्षि तावककटाक्षमहेन्द्रनील
    सिंहासनं श्रितवतो मकरध्वजस्य । साम्राज्यमङ्गलविधौ मुणिकुण्डलश्रीः नीराजनोत्सवतरङ्गितदीपमाला ॥ ॥ मातः
    क्षणं स्नपय मां तव वीक्षितेन मन्दाक्षितेन सुजनैरपरोक्षितेन । कामाक्षि कर्मतिमिरोत्करभास्करेण श्रेयस्करेण
    मधुपद्युतितस्करेण ॥ ॥ प्रेमापगापयसि मज्जनमारचय्य युक्तः स्मितांशुकृतभस्मविलेपनेन । कामाक्षि कुण्डलमणिद्युतिभिर्जटालः
    श्रीकण्ठमेव भजते तव दृष्टिपातः ॥ ॥ कैवल्यदाय करुणारसकिङ्कराय कामाक्षि कन्दलितविभ्रमशङ्कराय । आलोकनाय
    तव भक्तशिवङ्कराय मातर्नमोऽस्तु परतन्त्रितशङ्कराय ॥ ॥ साम्राज्यमङ्गलविधौ मकरध्वजस्य लोलालकालिकृततोरणमाल्यशोभे
    । कामेश्वरि प्रचलदुत्पलवैजयन्ती चातुर्यमेति तव चञ्चलदृष्टिपातः ॥ ॥ मार्गेण मञ्जुकचकान्तितमोवृतेन मन्दायमानगमना
    मदनातुरासौ । कामाक्षि दृष्टिरयते तव शङ्कराय सङ्केतभूमिमचिरादभिसारिकेव ॥ ॥ व्रीडनुवृत्तिरमणीकृतसाहचर्या
    शैवालितां गलरुचा शशिशेखरस्य । कामाक्षि कान्तिसरसीं त्वदपाङ्गलक्ष्मीः मन्दं समाश्रयति मज्जनखेलनाय ॥
    ॥ काषायमंशुकमिव प्रकटं दधानो माणिक्यकुण्डलरुचिं ममताविरोधी । श्रुत्यन्तसीमनि रतः सुतरां चकास्ति कामाक्षि
    तावककटाक्षयतीश्वरोऽसौ ॥ ॥ पाषाण एव हरिनीलमणिर्दिनेषु प्रम्लनतां कुवलयं प्रकटीकरोति । नौमित्तिको जलदमेचकिमा
    ततस्ते कामाक्षि शून्यमुपमनमपाङ्गलक्ष्म्याः ॥ ॥ शृङ्गारविभ्रमवती सुतरां सलज्जा नासाग्रमौक्तिकरुचा कृतमन्दहासा
    । श्यामा कटाक्षसुषमा तव युक्तमेतत् कामाक्षि चुम्बति दिगम्बरवक्त्रबिम्बम् ॥ ॥ नीलोत्पलेन मधुपेन च दृष्टिपातः
    कामाक्षि तुल्य इति ते कथमामनन्ति । शैत्येन निन्दयति यदन्वहमिन्दुपादान् पाथोरुहेण यदसौ कलहायते च ॥
    ॥ ओष्ठप्रभापटलविद्रुममुद्रिते ते भ्रूवल्लिवीचिसुभगे मुखकान्तिसिन्धौ । कामाक्षि वारिभरपूरणलम्बमान कालाम्बुवाहसरणिं
    लभते कटाक्षः ॥ ॥ मन्दस्मितैर्धवलिता मणिकुण्डलांशु सम्पर्कलोहितरुचिस्त्वदपाङ्गधारा । कामाक्षि मल्लिकुसुमैर्नवपल्लवैश्च
    नीलोत्पलैश्च रचितेव विभाति माला ॥ ॥ कामाक्षि शीतलकृपारसनिर्झराम्भः सम्पर्कपक्ष्मलरुचिस्त्वदपाङ्गमाला
    । गोभिः सदा पुररिपोरभिलष्यमाणा दूर्वाकदम्बकविडम्बनमातनोति ॥ ॥ हृत्पङ्कजं मम विकासयतु प्रमुष्ण न्नुल्लासमुत्पलरुचेस्तमसां
    निरोद्धा । दोषानुषङ्गजडतां जगतां धुनानः कामाक्षि वीक्षणविलासदिनोदयस्ते ॥ ॥ चक्षुर्विमोहयति चन्द्रविभूषणस्य
    कामाक्षि तावककटाक्षतमःप्ररोहः । प्रत्यङ्मुखं तु नयनं स्तिमितं मुनीनां प्राकाश्यमेव नयतीति परं विचित्रम्
    ॥ ॥ कामाक्षि वीक्षणरुचा युधि निर्जितं ते नीलोत्पलं निरवशेषगताभिमानम् । आगत्य तत्परिसरं श्रवणवतंस व्योजेन
    नूनमभयार्थनमातनोति ॥ ॥ आश्चर्यमम्ब मदानाभ्युदयावलम्बः कामाक्षि चञ्चलनिरीक्षणविभ्रमस्ते । धैर्यं विधूय
    तनुते हृदि रागबन्धं शम्भोस्तदेव विपरीततया मुनीनाम् ॥ ॥ जन्तोः सकृत्प्रणमतो जगदीड्यतां च तेजास्वितां
    च निशितां च मतिं सभायाम् । कामाक्षि माक्षिकझरीमिव वैखरीं च लक्ष्मीं च पक्ष्मलयति क्षणवीक्षणं ते ॥
    ॥ कादम्बिनी किमयते न जलानुषङ्गं भृङ्गावली किमुररीकुरुते न पद्मम् । किं वा कलिन्दतनया सहते न भङ्गं
    कामाक्षि निश्चयपदं न तवाक्षिलक्ष्मीः ॥ ॥ काकोलपावकतृणीकरणेऽपि दक्षः कामाक्षि बालकसुधाकरशेखरस्य । अत्यन्तशीतलतमोऽप्यनुपारतं
    ते चित्तं विमोहयति चित्रमयं कटाक्षः ॥ ॥ कार्पण्यपूरपरिवर्धितमम्ब मोह कन्दोद्गतं भवमयं विषपादपं मे
    । तुङ्गं छिनत्तु तुहिनाद्रिसुते भवत्याः काञ्चीपुरेश्वरि कटाक्षकुठारधारा ॥ ॥ कामाक्षि घोरभवरोगचिकित्सनार्थ
    मभ्यर्थ्य देशिककटाक्षभिषक्प्रसादात् । तत्रापि देवि लभते सुकृती कदाचि दन्यस्य दुर्लभमपाङ्गमहौषधं ते
    ॥ ॥ कामाक्षि देशिककृपाङ्कुरमाश्रयन्तो नानातपोनियमनाशितपाशबन्धाः । वासालयं तव कटाक्षममुं महान्तो लब्ध्वा
    सुखं समाधियो विचरन्ति लोके ॥ ॥ साकूतसंलपितसम्भृतमुग्धहासं व्रीडानुरागसहचारि विलोकनं ते । कामाक्षि
    कामपरिपन्थिनि मारवीर साम्राज्यविभ्रमदशां सफलीकरोति ॥ ॥ कामाक्षि विभ्रमबलैकनिधिर्विधाय भ्रूवल्लिचापकुटिलीकृतिमेव
    चित्रम् । स्वाधीनतां तव निनाय शशाङ्कमौले रङ्गार्धराज्यसुखलाभमपाङ्गवीरः ॥ ॥ कामाङ्कुरैकनिलयस्तव दृष्टिपातः
    कामाक्षि भक्तमनसां प्रददातु कामान् । रागान्वितः स्वयमपि प्रकटीकरोति वैराग्यमेव कथमेष महामुनीनाम् ॥
    ॥ कालाम्बुवाहनिवहैः कलहायते ते कामाक्षि कालिममदेन सदा कटाक्षः । चित्रं तथापि नितराममुमेव दृष्ट्वा
    सोत्कण्ठ एव रमते किल नीलकण्ठः ॥ ॥ कामाक्षि मन्मथरिपुं प्रति मारताप मोहान्धकारजलदागमनेन नृत्यन् । दुष्कर्मकञ्चुकिकुलं
    कबलीकरोतु व्यामिश्रमेचकरुचिस्त्वदपाङ्गकेकी ॥ ॥ कामाक्षि मन्मथरिपोरवलोकनेषु कान्तं पयोजमिव तावकमक्षिपातम्
    । प्रेमागमो दिवसवद्विकचीकरोति लज्जाभरो रजनिवन्मुकुलीकरोति ॥ ॥ मूको विरिञ्चति परं पुरुषः कुरूपः कन्दर्पति
    त्रिदशराजति किम्पचानः । कामाक्षि केवलमुपक्रमकाल एव लीलातरङ्गितकटाक्षरुचः क्षणं ते ॥ ॥ नीलालका मधुकरन्ति
    मनोज्ञनासा मुक्तारुचः प्रकटकन्दबिसाङ्कुरन्ति । कारुण्यमम्ब मकरन्दति कामकोटि मन्ये ततः कमलमेव विलोचनं
    ते ॥ ॥ आकाङ्क्ष्यमाणफलदानविचक्षणायाः । कामाक्षि तावककटाक्षककामधेनोः । सम्पर्क एव कथमम्ब विमुक्तपाश
    बन्धाः स्फुटं तनुभृतः पशुतां त्यजन्ति ॥ ॥ संसारघर्मपरितापजुषां नराणां कामाक्षि शीतलतराणि तवेक्षितानि
    । चन्द्रातपन्ति घनचन्दनकर्दमन्ति मुक्तागुणन्ति हिमवारिनिषेचनन्ति ॥ ॥ प्रेमाम्बुराशिसततस्नपितानि चित्रं
    कामाक्षि तावककटाक्षनिरीक्षणानि । सन्धुक्षयन्ति मुहुरिन्धनराशिरीत्या मारद्रुहो मनसि मन्मथचित्रभानुम्
    ॥ ॥ कालाञ्जनप्रतिभटं कमनीयकान्त्या कन्दर्पतन्त्रकलया कलितानुभावम् । काञ्चीविहाररसिके कलुषार्तिचोरं
    कल्लोलयस्व मयि ते करुणाकटाक्षम् ॥ ॥ क्रान्तेन मन्मथदेन विमोह्यमान स्वान्तेन चूततरुमूलगतस्य पुंसः ।
    कान्तेन किञ्चिदवलोकय लोचनस्य प्रान्तेन मां जननि काञ्चिपुरीविभूषे ॥ ॥ कामाक्षि कोऽपि सुजनास्त्वदपाङ्गसङ्गे
    कण्ठेन कन्दलितकालिमसम्प्रदायाः । उत्तंसकल्पितचकोरकुटुम्बपोषा नक्तन्दिवसप्रसवभूनयना भवन्ति ॥ ॥ नीलोत्पलप्रसवकान्तिनिर्दशनेन
    कारुण्यविभ्रमजुषा तव वीक्षणेन । कामाक्षि कर्मजलधेः कलशीसुतेन पाशत्रयाद्वयममी परिमोचनीयाः ॥ ॥ अत्यन्तचञ्चलमकृत्रिममञ्जनं
    किं झङ्कारभङ्गिरहिता किमु भृङ्गमाला । धूमाङ्कुरः किमु हुताशनसङ्गहीनः कामाक्षि नेत्ररुचिनीलिमकन्दली
    ते ॥ ॥ कामाक्षि नित्यमयमञ्जलिरस्तु मुक्ति बीजाय विभ्रममदोदयघूर्णिताय । कन्दर्पदर्पपुनरुद्भवसिद्धिदाय
    कल्याणदाय तव देवि दृगञ्चलाय ॥ ॥ दर्पाङ्कुरो मकरकेतनविभ्रमाणां निन्दाङ्कुरो विदलितोत्पलचातुरीणाम् ।
    दीपाङ्कुरो भवतमिस्रकदम्बकानां कामाक्षि पालयतु मां त्वदपाङ्गपातः ॥ ॥ कैवल्यदिव्यमणिरोहणपर्वतेभ्यः कारुण्यनिर्झरपयःकृतमञ्जनेभ्यः
    । कामाक्षि किङ्करितशङ्करमानसेभ्य स्तेभ्यो नमोऽस्तु तव वीक्षणविभ्रमेभ्यः ॥ ॥ अल्पीय एव नवमुत्पलमम्ब
    हीना मीनस्य वा सरणिरम्बुरुहां च किं वा । दूरे मृगीदृगसमञ्जसमञ्जनं च कामाक्षि वीक्षणरुचौ तव तर्कयामः
    ॥ ॥ मिश्रीभवद्गरलपङ्किलशङ्करोरस् सीमाङ्गणे किमपि रिङ्खणमादधानः । हेलावधूतललितश्रवणोत्पलोऽसौ कामाक्षि
    बाल इव राजति ते कटाक्षः ॥ ॥ प्रौढिकरोति विदुषां नवसूक्तिधाटी चूताटवीषु बुधकोकिललाल्यमानम् । माध्वीरसं
    परिमलं च निरर्गलं ते कामाक्षि वीक्षणविलासवसन्तलक्ष्मीः ॥ ॥ कूलङ्कषं वितनुते करुणाम्बुवर्षी सारस्वतं
    सुकृतिनः सुलभं प्रवाहम् । तुच्छीकरोति यमुनाम्बुतरङ्गभङ्गीं कामाक्षि किं तव कटाक्षमहाम्बुवाहः ॥ ॥ जगर्ति
    देवि करुणाशुकसुन्दरी ते ताटङ्करत्नरुचिदाडिमखण्डशोणे । कामाक्षि निर्भरकटाक्षमरीचिपुञ्ज माहेन्द्रनीलमणिपञ्जरमध्यभागे
    ॥ ॥ कामाक्षि सत्कुवलयस्य सगोत्रभावा दाक्रामति श्रुतिमसौ तव दृष्टिपातः । किञ्च स्फुटं कुटिलतां प्रकटीकरोति
    भ्रूवल्लरीपरिचितस्य फलं किमेतत् ॥ ॥ एषा तवाक्षिसुषमा विषमायुधस्य नाराचवर्षलहरी नगराजकन्ये । शङ्के
    करोति शतधा हृदि धैर्यमुद्रां श्रीकामकोटि यदसौ शिशिरांशुमौलेः ॥ ॥ बाणेन पुष्पधनुषः परिकल्प्यमान त्राणेन
    भक्तमनसां करुणाकरेण । कोणेन कोमलदृशस्तव कामकोटि शोणेन शोषय शिवे मम शोकसिन्धुम् ॥ ॥ मारद्रुहा मुकुटसीमनि
    लाल्यमाने मन्दाकिनीपयसि ते कुटिलं चरिष्णुः । कामाक्षि कोपरभसाद्वलमानमीन सन्देहमङ्कुरयति क्षणमक्षिपातः
    ॥ ॥ कामाक्षि संवलितमौक्तिककुण्डलांशु चञ्चत्सितश्रवणचामरचातुरीकः । स्तम्भे निरन्तरमपाङ्गमये भवत्या
    बद्धश्चकास्ति मकरध्वजमत्तहस्ती ॥ ॥ यावत्कटाक्षरजनीसमयागमस्ते कामाक्षि तावदचिरान्नमतां नराणाम् । आविर्भवत्यमृतदीधितिबिम्बमम्ब
    संविन्मयं हृदयपूर्वगिरीन्द्रशृङ्गे ॥ ॥ कामाक्षि कल्पविटपीव भवत्कटाक्षो दित्सुः समस्तविभवं नमतां नराणाम्
    । भृङ्गस्य नीलनलिनस्य च कान्तिसम्प त्सर्वस्वमेव हरतीति परं विचित्रम् ॥ ॥ अत्यन्तशीतलमनर्गलकर्मपाक
    काकोलहारि सुलभं सुमनोभिरेतत् । पीयूषमेव तव वीक्षणमम्ब किन्तु कामाक्षि नीलमिदमित्ययमेव भेदः ॥ ॥ अज्ञातभक्तिरसमप्रसरद्विवेक
    मत्यन्तगर्वमनधीतसमस्तशास्त्रम् । अप्राप्तसत्यमसमीपगतं च मुक्तेः कामाक्षि नैव तव स्पृहयति दृष्टिपातः
    ॥ कामाक्षि मामवतु ते करुणाकटाक्षः पातेन लोचनरुचेस्तव कामकोटि पोतेन पतकपयोधिभयातुराणाम् । पूतेन तेन
    नवकाञ्चनकुण्डलांशु वीतेन शीतलय भूधरकन्यके माम् ॥ ॥ ॥ इति कटाक्षशतकं सम्पूर्णम् ॥
