id: goshthasukta-2
category: veda
name:
  english: goshthasukta
  devanagari: गोष्ठसूक्त
content:
  english: goraksha ka upadesha sasvara sam vo̭ go̱shthena̭ su̱shada̱ sam ra̱yya sam subhṷtya | aha̭rjatasya̱
    yannama̱ tena̭ va̱h sam sri̭jamasi || 1|| sam va̭h srijatvarya̱ma sam pu̱sha sam briha̱spati̭h | samindro̱
    yo dha̭nanja̱yo mayi̭ pushyata̱ yadvasṷ || 2|| sa̱mja̱gma̱na abi̭bhyushira̱smingo̱shthe ka̭ri̱shini̭h
    | bibhra̭tih so̱myam madhva̭nami̱va u̱peta̭na || 3|| i̱haiva ga̭va̱ eta̭ne̱ho shakḙva pushyata |
    i̱haivota pra ja̭yadhva̱m mayi̭ sa̱mjnana̭mastu vah || 4|| shi̱vo vo̭ go̱shtho bha̭vatu shari̱shakḙva
    pushyata | i̱haivota pra ja̭yadhva̱m maya̭ va̱h sam sri̭jamasi || 5|| maya̭ gavo̱ gopa̭tina sacadhvama̱yam
    vo̭ go̱shtha i̱ha po̭shayi̱shnuh | ra̱yasposhḙna bahu̱la bhava̭ntirji̱va jiva̭nti̱rupa̭ vah sadema
    || 6|| nihsvara sam vo goshthena sushada sam rayya sam subhutya | aharjatasya yannama tena vah sam
    srijamasi || 1|| sam vah srijatvaryama sam pusha sam brihaspatih | samindro yo dhananjayo mayi pushyata
    yadvasu || 2|| samjagmana abibhyushirasmingoshthe karishinih | bibhratih somyam madhvanamiva upetana
    || 3|| ihaiva gava etaneho shakeva pushyata | ihaivota pra jayadhvam mayi samjnanamastu vah || 4||
    shivo vo goshtho bhavatu sharishakeva pushyata | ihaivota pra jayadhvam maya vah sam srijamasi ||
    5|| maya gavo gopatina sacadhvamayam vo goshtha iha poshayishnuh | rayasposhena bahula bhavantirjiva
    jivantirupa vah sadema || 6||
  devanagari: गोरक्षा का उपदेश सस्वर सं वो॑ गो॒ष्ठेन॑ सु॒षदा॒ सं र॒य्या सं सुभू॑त्या । अह॑र्जातस्य॒ यन्नाम॒
    तेना॑ वः॒ सं सृ॑जामसि ॥ १॥ सं वः॑ सृजत्वर्य॒मा सं पू॒षा सं बृह॒स्पतिः॑ । समिन्द्रो॒ यो ध॑नञ्ज॒यो मयि॑
    पुष्यत॒ यद्वसु॑ ॥ २॥ सं॒ज॒ग्मा॒ना अबि॑भ्युषीर॒स्मिन्गो॒ष्ठे क॑री॒षिणीः॑ । बिभ्र॑तीः सो॒म्यं मध्व॑नमी॒वा
    उ॒पेत॑न ॥ ३॥ इ॒हैव गा॑व॒ एत॑ने॒हो शके॑व पुष्यत । इ॒हैवोत प्र जा॑यध्वं॒ मयि॑ सं॒ज्ञान॑मस्तु वः ॥ ४॥
    शि॒वो वो॑ गो॒ष्ठो भ॑वतु शारि॒शाके॑व पुष्यत । इ॒हैवोत प्र जा॑यध्वं॒ मया॑ वः॒ सं सृ॑जामसि ॥ ५॥ मया॑
    गावो॒ गोप॑तिना सचध्वम॒यं वो॑ गो॒ष्ठ इ॒ह पो॑षयि॒ष्णुः । रा॒यस्पोषे॑ण बहु॒ला भव॑न्तीर्जी॒वा जीव॑न्ती॒रुप॑
    वः सदेम ॥ ६॥ निःस्वर सं वो गोष्ठेन सुषदा सं रय्या सं सुभूत्या । अहर्जातस्य यन्नाम तेना वः सं सृजामसि
    ॥ १॥ सं वः सृजत्वर्यमा सं पूषा सं बृहस्पतिः । समिन्द्रो यो धनञ्जयो मयि पुष्यत यद्वसु ॥ २॥ संजग्माना
    अबिभ्युषीरस्मिन्गोष्ठे करीषिणीः । बिभ्रतीः सोम्यं मध्वनमीवा उपेतन ॥ ३॥ इहैव गाव एतनेहो शकेव पुष्यत
    । इहैवोत प्र जायध्वं मयि संज्ञानमस्तु वः ॥ ४॥ शिवो वो गोष्ठो भवतु शारिशाकेव पुष्यत । इहैवोत प्र जायध्वं
    मया वः सं सृजामसि ॥ ५॥ मया गावो गोपतिना सचध्वमयं वो गोष्ठ इह पोषयिष्णुः । रायस्पोषेण बहुला भवन्तीर्जीवा
    जीवन्तीरुप वः सदेम ॥ ६॥
