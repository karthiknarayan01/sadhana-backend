id: mahakulakundalinisahasranamastotra-2
category: sahasranama
name:
  english: mahakulakundalinisahasranamastotra
  devanagari: महाकुलकुण्डलिनीसहस्रनामस्तोत्र
content:
  english: 6|| asya shrimanmahakundalisashtottarasahasranamastotrasya brahmashirjagaticchando bhagavati
    shrimanmahakundalidevata sarvayogasamriddhisiddhyarthe viniyogah|| kuleshvari kulananda kulina kulakundali
    | shrimanmahakundali ca kulakanya kulapriya || 36
  devanagari: ६॥ अस्य श्रीमन्महाकुण्डलीसाष्टोत्तरसहस्रनामस्तोत्रस्य ब्रह्मषीर्जगतीच्छन्दो भगवती श्रीमन्महाकुण्डलीदेवता
    सर्वयोगसमृद्धिसिद्ध्यर्थे विनियोगः॥ कुलेश्वरी कुलानन्दा कुलीना कुलकुण्डली । श्रीमन्महाकुण्डली च कुलकन्या
    कुलप्रिया ॥ ३६
meaning: {}
