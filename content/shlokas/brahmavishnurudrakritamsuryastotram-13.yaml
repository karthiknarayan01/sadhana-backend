id: brahmavishnurudrakritamsuryastotram-13
category: stotram
name:
  english: brahmavishnurudrakritamsuryastotram 13
  devanagari: ब्रह्मविष्णुरुद्रकृतंसूर्यस्तोत्रम् १३
content:
  english: adidevo'si devanamishvaranam tvamishvarah | adikartasi bhutanam devadeva sanatana || 11|| jivanam
    sarvasattvanam devagandharvarakshasam | munikinnarasiddhanam tathaivoragapakshinam || 12|| tvam brahma
    tvam mahadevastvam vishnustvam prajapatih | vayurindrashca somashca vivasvanvarunastatha || 13|| tvam
    kalah srishtikarta ca harta trata prabhustatha | saritah sagarah shaila vidyudindradhanumshi ca |
    pralayah prabhavashcaiva vyaktavyaktah sanatanah || 14|| ishvaratparato vidya vidyayah paratah shivah
    | shivatparataro devastvameva parameshvara || 15|| sarvatah panipadastvam sarvato'kshishiromukhah
    | sahasramshustvam tu deva sahasrakiranastatha || 16|| bhuradibhurbhuvah svashca maharjanastapastatha
    | pradiptam diptimannityam sarvalokaprakashakam | durnirikshyam surendranam yadrupam tasya te namah
    || 17|| surasiddhaganairjushtam bhrigvatripulahadibhih | shubham paramamavyagram yadrupam tasya te
    namah || 18|| pancatitasthitam tadvai dashaikadasha eva ca | ardhamasamatikramya sthitam tatsuryamandale
    | tasmai rupaya te deva pranatah sarvadevatah || 19|| vishvakridvishvabhutam ca vishvanarasurarcitam
    | vishvasthitamacintyam ca yadrupam tasya te namah || 20|| param yajnatparam devatparam lokatparam
    divah | duratikrameti yah khyatastasmadapi param parat | paramatmeti vikhyatam yadrupam tasya te namah
    || 21|| avijneyamacityam ca adhyatmagatamavyayam | anadinidhanam devam yadrupam tasya te namah ||
    22|| namo namah karanakaranaya namo namah papavinashanaya | namo namo vanditavandanaya namo namo rogavinashanaya
    || 23|| namo namah sarvavarapradaya namo namah sarvabalapradaya | namo namo jnananidhe sadaiva namo
    namah pancadashatmakaya || 24|| iti bhavishyapurane brahme parvani trayovimshadhikashatatamadhyayantargatam
    brahmavishnurudradikritam suryastotram samaptam | bhavishyapurana | brahmaparva | adhyaya 123
  devanagari: आदिदेवोऽसि देवानामीश्वराणां त्वमीश्वरः । आदिकर्तासि भूतानां देवदेव सनातन ॥ ११॥ जीवनं सर्वसत्त्वानां
    देवगन्धर्वरक्षसाम् । मुनिकिन्नरसिद्धानां तथैवोरगपक्षिणाम् ॥ १२॥ त्वं ब्रह्मा त्वं महादेवस्त्वं विष्णुस्त्वं
    प्रजापतिः । वायुरिन्द्रश्च सोमश्च विवस्वान्वरुणस्तथा ॥ १३॥ त्वं कालः सृष्टिकर्ता च हर्ता त्राता प्रभुस्तथा
    । सरितः सागराः शैला विद्युदिन्द्रधनूंषि च । प्रलयः प्रभवश्चैव व्यक्ताव्यक्तः सनातनः ॥ १४॥ ईश्वरात्परतो
    विद्या विद्यायाः परतः शिवः । शिवात्परतरो देवस्त्वमेव परमेश्वर ॥ १५॥ सर्वतः पाणिपादस्त्वं सर्वतोऽक्षिशिरोमुखः
    । सहस्रांशुस्त्वं तु देव सहस्रकिरणस्तथा ॥ १६॥ भूरादिभूर्भुवः स्वश्च महर्जनस्तपस्तथा । प्रदीप्तं दीप्तिमन्नित्यं
    सर्वलोकप्रकाशकम् । दुर्निरीक्ष्यं सुरेन्द्राणां यद्रूपं तस्य ते नमः ॥ १७॥ सुरसिद्धगणैर्जुष्टं भृग्वत्रिपुलहादिभिः
    । शुभं परममव्यग्रं यद्रूपं तस्य ते नमः ॥ १८॥ पञ्चातीतस्थितं तद्वै दशैकादश एव च । अर्धमासमतिक्रम्य
    स्थितं तत्सूर्यमण्डले । तस्मै रूपाय ते देव प्रणताः सर्वदेवताः ॥ १९॥ विश्वकृद्विश्वभूतं च विश्वानरसुरार्चितम्
    । विश्वस्थितमचिन्त्यं च यद्रूपं तस्य ते नमः ॥ २०॥ परं यज्ञात्परं देवात्परं लोकात्परं दिवः । दुरतिक्रमेति
    यः ख्यातस्तस्मादपि परं परात् । परमात्मेति विख्यातं यद्रूपं तस्य ते नमः ॥ २१॥ अविज्ञेयमचित्यं च अध्यात्मगतमव्ययम्
    । अनादिनिधनं देवं यद्रूपं तस्य ते नमः ॥ २२॥ नमो नमः कारणकारणाय नमो नमः पापविनाशनाय । नमो नमो वन्दितवन्दनाय
    नमो नमो रोगविनाशनाय ॥ २३॥ नमो नमः सर्ववरप्रदाय नमो नमः सर्वबलप्रदाय । नमो नमो ज्ञाननिधे सदैव नमो नमः
    पञ्चदशात्मकाय ॥ २४॥ इति भविष्यपुराणे ब्राह्मे पर्वणि त्रयोविंशाधिकशततमाध्यायान्तर्गतं ब्रह्मविष्णुरुद्रादिकृतं
    सूर्यस्तोत्रं समाप्तम् । भविष्यपुराण । ब्राह्मपर्व । अध्याय १२३
