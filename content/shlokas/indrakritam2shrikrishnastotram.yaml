id: indrakritam2shrikrishnastotram
category: stotram
name:
  english: indrakritam2shrikrishnastotram
  devanagari: इन्द्रकृतं२श्रीकृष्णस्तोत्रम्
content:
  english: stvam vikshya kale'bhayamashu tanmadam | hitva''ryamargam prabhajantyapasmaya iha khalanamapi
    te'nushasanam || 7|| sa tvam mamaishvaryamadaplutasya kritagasaste'vidushah prabhavam | kshantum prabho'tharhasi
    mudhacetaso maivam punarbhunmatirisha me'sati || 8|| tavavataro'yamadhokshajeha svayambharanamurubharajanmanam
    | camupatinamabhavaya deva bhavaya yushmaccarananuvartinam || 9|| namastubhyam bhagavate purushaya
    mahatmane | vasudevaya krishnaya satvatam pataye namah || 10|| svacchandopattadehaya vishuddhajnanamurtaye
    | sarvasmai sarvabijaya sarvabhutatmane namah || 11|| mayedam bhagavan goshthanashayasaravayubhih
    | ceshtitam vihate yajne manina tivramanyuna || 12|| tvayeshanugrihito'smi dhvastastambho vrithodyamah
    | ishvaram gurumatmanam tvamaham sharanam gatah || 13|| iti shrimadbhagavatamahapurane dashamaskandhe
    purvardhe saptavimshadhyayantargatam indrakritam shrikrishnastotram samaptam | bhagavatapurana | adhyaya
    10
  devanagari: स्त्वां वीक्ष्य कालेऽभयमाशु तन्मदम् । हित्वाऽऽर्यमार्गं प्रभजन्त्यपस्मया ईहा खलानामपि तेऽनुशासनम्
    ॥ ७॥ स त्वं ममैश्वर्यमदप्लुतस्य कृतागसस्तेऽविदुषः प्रभावम् । क्षन्तुं प्रभोऽथार्हसि मूढचेतसो मैवं
    पुनर्भून्मतिरीश मेऽसती ॥ ८॥ तवावतारोऽयमधोक्षजेह स्वयम्भराणामुरुभारजन्मनाम् । चमूपतीनामभवाय देव भवाय
    युष्मच्चरणानुवर्तिनाम् ॥ ९॥ नमस्तुभ्यं भगवते पुरुषाय महात्मने । वासुदेवाय कृष्णाय सात्वतां पतये नमः
    ॥ १०॥ स्वच्छन्दोपात्तदेहाय विशुद्धज्ञानमूर्तये । सर्वस्मै सर्वबीजाय सर्वभूतात्मने नमः ॥ ११॥ मयेदं
    भगवन् गोष्ठनाशायासारवायुभिः । चेष्टितं विहते यज्ञे मानिना तीव्रमन्युना ॥ १२॥ त्वयेशानुगृहीतोऽस्मि
    ध्वस्तस्तम्भो वृथोद्यमः । ईश्वरं गुरुमात्मानं त्वामहं शरणं गतः ॥ १३॥ इति श्रीमद्भागवतमहापुराणे दशमस्कन्धे
    पूर्वार्धे सप्तविंशाध्यायान्तर्गतं इन्द्रकृतं श्रीकृष्णस्तोत्रं समाप्तम् । भागवतपुराण । अध्याय १०
meaning: {}
