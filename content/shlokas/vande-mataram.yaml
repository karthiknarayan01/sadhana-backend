id: vande-mataram
category: stotram
name:
  english: Vande Mataram
content:
  english: vandemataram sujalam suphalam malayaja shitalam sasya shyamalam mataram ||vande|| shubhrajyotsna
    pulakitayaminim pullakusumita drumadala shobhinim suhasinim sumadhura bhashinim sukhadam varadam mataram
    || vande || kotikoti kantha kalakala ninada karale koti koti bhujairdhrita karavale abala keyano ma
    eto bale bahubala dharinim namami tarinim ripudala varinim mataram || vande || tumi vidya tumi dharma
    tumi hridi tumi marma tvam hi pranah sharire bahute tumi ma shakti hridaye tumi ma bhakti to marayi
    pratima gadi mandire mandire || vande || tvam hi durga dasha viharini vani vidyadayini namami tvam
    namami kamalam amalam atulam sujalam suphalam mataram || vande || shyamalam saralam susmitam bhushitam
    dharanim bharanim mataram ||
  devanagari: वन्देमातरं सुजलां सुफलां मलयज शीतलां सस्य श्यामलां मातरं ॥वन्दे॥ शुभ्रज्योत्स्ना पुलकितयामिनीं
    पुल्लकुसुमित द्रुमदल शोभिनीं सुहासिनीं सुमधुर भाषिणीं सुखदां वरदां मातरं ॥ वन्दे ॥ कोटिकोटि कण्ठ कलकल
    निनाद कराले कोटि कोटि भुजैर्धृत करवाले अबला केयनो मा एतो बले बहुबल धारिणीं नमामि तारिणीं रिपुदल वारिणीं
    मातराम् ॥ वन्दे ॥ तुमि विद्या तुमि धर्म तुमि हृदि तुमि मर्म त्वं हि प्राणाः शरीरे बाहुते तुमि मा शक्ति
    हृदये तुमि मा भक्ति तो मारयि प्रतिमा गडि मन्दिरे मन्दिरे ॥ वन्दे ॥ त्वं हि दुर्गा दश विहारिणी वाणी
    विद्यादायिनी नमामि त्वां नमामि कमलां अमलां अतुलां सुजलां सुफलां मातरम् ॥ वन्दे ॥ श्यामलां सरलां सुस्मितां
    भूषितां धरणीं भरणीं मातरम् ॥
