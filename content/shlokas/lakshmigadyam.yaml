id: lakshmigadyam
category: stotram
name:
  english: lakshmigadyam
  devanagari: लक्ष्मीगद्यम्
content:
  english: shrilakshmigadyam shrirastu | shrivenkateshamahishi shritakalpavalli padmavati vijayatamiha
    padmahasta | shrivenkatakhya dharanibhridupatyakayam ya shrishukasya nagare kamalakare bhut || 1||
    bhagavati jayajaya padmavati he || 1|| bhagavatanikara bahutara bhayakara bahulodyama yamasadmayati
    he || 2|| bhavijana bhayanashi bhagyapayorashi velatigalola vipulatarollola vicililavahe ||3|| padmajabhavayuvati
    pramukhamarayuvati paricarakayuvati vitati sarati satata viracita paricarana caranambhoruhe || 4||
    akunthavaikuntha mahavibhutinayaki || 5|| akhilandakoti brahmandanayaki || 6|| shrivenkatanayaki ||
    7|| shrimati padmavati || 8|| jaya vijayibhava || 9|| kshirambhorashisaraih prabhavati ruciraih yatsvarupe
    pradipe sheshanyeshamrijishanya janishata ssudhakalpadevanganadyah | yasyassimhasanasya pravilasati
    sada toranam vaijayanti seyam shrivenkatadri prabhuvaramahishi bhatu padmavati shrih || 2|| jaya jaya
    jaya jagadishvarakamalapati karunarasa varunalayavele || 1|| caranambuja sharanagata karunarasa varunalaya
    murabadhana karabodhana saphalikrita sharanagata janatagamavele || 2|| kincidudancita susmitabhanjita
    candrakalamadasucita sampada vimala vilocana jitakamalanana sakridavalokana sajjanadurjana bhedavilopana
    lilalole || 3|| shobhanashile || 4|| shubhaganamale || 5|| sundarabhale || 6|| kutilanirantara kuntalamale
    || 7|| manivaraviracita manjulamale || 8|| padma surabhigandha mardavamakaranda phalitakritibandha
    padmini bale || 9|| akunthavaikuntha mahavibhuti nayaki || 10|| akhilandakoti brahmandanayaki || 11||
    shrivenkatanayaki || 12|| shrimati padmavati || 13|| jaya vijayibhava || 14|| shrishailanantasure
    ssadhava mupavane coralilam caranti campeye tena baddha svapatimavarayattasya kanya sati ya | yasyah
    shrishailapurna shshvashurati ca hare statabhavam prapannah seyam shrivenkatadri prabhuvaramahishi
    bhatu padmavati shrih || 3|| kharvibhavadatigarvi krita gurumervishagiri mukhorvidharakula darvikaradayitorvi
    dhara shikharorvi phanipati gurvishvarakrita ramanujamuni namankita bahubhumashraya suradhamalaya
    varanandana vana sundaratarananda mandirananta guruvanananta keliyuta nibhritatara vihriti rata lilacora
    rajakumara nijapati svairasahavihara samaya nibhritoshita phanipati gurubhakti pashavashamvada nigrihitarama
    campaka nibaddhe || 1|| bhaktajanavana baddha shraddhe || 2|| bhajana vimukha bhavijana bhagavadupasadana
    samaya nirikshana santata sannaddhe || 3|| bhagadheyaguru bhavyasheshaguru bahumula dhrita balikabhute
    || 4|| shrivenkatanatha varaparigrihite || 5|| shrivenkatanathatatabhuta shrishailapurnaguru grihasnushabhute
    || 6|| akunthavaikuntha mahavibhutinayaki || 7|| akhilandakoti brahmandanayaki || 8|| shrivenkatanayaki
    || 9|| shrimati padmavati || 10|| jaya vijayibhava || 11|| shrishaile kelikale munisamupagame ya bhayatprak
    prayata tasyaivopatyakayam tadanu shukapure padmakasaramadhye | pradurbhuta'ravinde vikacadalacaye
    patyurugraistapobhih seyam shrivenkatadriprabhuvaramahishi bhatu padmavati shrih || 4|| bhadre ||
    1|| bhaktajanavana nirnidre || 2|| bhagavaddakshina vaksholakshana lakshalakshita mridupadamudre ||
    3|| bhanjita bhavyanavyadaradalitadala mridula kokanada madavilasa dadharordhva vinyasa savyapasavyakara
    virajadanitara sharanabhaktagana nijacarana sharanikaranabhaya vitarana nipuna nirupana nirnidramudre
    || 4|| ullasadurdhva taraparakara shikharayugala shekhara nijamanjima madabhanjana kushalavadana vidhumandala
    vilokana vidirna hridayata vibhramadharadara vidalitadala komala kamalamukula yugalanirargala vinirgalatkanti
    sumudre || 5|| shrivenkata shikharasahamahishi nikara kantalilavasara sangatamuninikara samudita bahulatara
    bhayalasadapasarakeli bahumanye || 6|| shrishailadhisha racita dinadhisha bimbaramadhishavishaya tapojanye
    || 7|| shrishailasanna shukapurisampanna padmasara utpanna padminikanye || 8|| padma sarovarya viracita
    mahashcarya ghoratapashcarya shrishukamunidhurya kamita vadanye || 9|| manava karmajala durmalamarma
    nirmulana labdhavarna nijasalilajavarna nirjita durvarna vajrasphatika savarna salila sampurna suvarnamukhari
    saikata sanjata santata makaranda bindusandoha nishyanda sandanitamandananda milinda vrinda madhuratara
    jhankararava rucirasantatasamphulla malli malati pramukha vratati vitati kundakuravaka maruvaka damanakadi
    gulmakusuma mahima ghuma ghumita sarva dinmukha sarvatomukha mahaniyamanda makandavirala narikela
    niravadhika kramuka pramukha tarunikaravithi ramaniya vipula tatodyana viharini || 10|| manjulatara
    maniharini || 11|| mahaniyatara manijitatarani makutamanoharini || 12|| mantharatara sundaragati mattamarala
    yuvati sugati madapaharini || 13|| kalakantha yuvakuntha kanthanada kalavyaharini || 14|| akunthavaikuntha
    mahavibhutinayaki || 15|| akhilandakoti brahmandanayaki || 16|| shrivenkatanayaki || 17|| shrimati
    padmavati || 18|| jaya vijayibhava || 19|| yam lavanyanadim vadanti kavayah shrimadhavambhonidhim
    gacchantim svavashangatamshca tarasa jantunnayantimapi | yasya manasanetrahasta caranadyangani bhusharuci
    rambhojanyamalojjvalam ca salilam sa bhatu padmavati || 5|| ambhoruhavasini || 1|| ambhoruhasana pramukhakhila
    bhutanushasini || 2|| anavaratatmanatha vakshassimhasanadhyasini || 3|| anghriyugavatara pathasantata
    sangahamana ghoratarabhangura samsara gharmasantapta manuja santapa nashini || 4|| bahula kuntala
    vadanamandala panipallava ruciralocana subhagakandara bahuvallika jaghana nitamba mandalamaya vitata
    shaivala samphulla kamala kuvalaya kambukamalini nalottunga vipulapulinashobhini || 5|| madhava maharnavagahini
    || 6|| mahitalavanyamahavahini || 7|| mukhacandra samudyata bhalatalavirajamana kincidudancita sukshmagra
    kasturitilaka shula samudbhutabhiti vishirnasamujjhita sammukhabhagaparisarayugala sarabhasa visrimara
    timira nikara sandeha sandayi sasimantakuntala kante || 8|| sphatika manimaya kandarpa darpana sandeha
    sandohi sakala jana sammohi phalaphalavimalalavanya lalita satatamudita muditamukhamandale || 9||
    mahita mradima mahimamandahasa sahishnu tadudaya samudita klamodirnarunavarna vibhramadavidambita
    parinata bimbavidruma vilasadoshta yugale || 10|| parihasita darahasita kokanada kundarada mantharatarodgatvara
    visritvara kantivici kamaniyamanda mandahasa sadanavadane || 11|| samujjvalatara manitarjita taranitatanka
    niratanka kandalitakanti pura karambita karnashashkulivalaye || 12|| bahirupagata sphuranadhigatantarangana
    bhushanagana vadana koshasadana sphatika manimaya bhitti shankankurana canapratiphalita karnapura
    karnavatamsa tatanka kundala mandana niganigayamana vimalakapola mandale || 13|| nijabhrukuti bhatibhuta
    tryaksha shtakshadvadashakshasahasraksha prabhriti sarvasuparva shobhana bhrumandale || 14|| nitalaphalaka
    mrigamadatilakacchala viloka loka vilocana doshaviracita vidalana vadana vidhumandala vigalita nasika
    pranalika nigudha nistrita nasagrasthula muktaphalacchalabhivyakta vadana bilanilina kanthanalikantah
    pravritta grivamadhyoccha bhagakrita vibhagagrivagarta vinissrita prithula vilasadurojashaila yugala
    nirjhara jharibhuta gambhira nabhi hradava gadha vilina dirghatara prithula sudhadhara pravahayugala
    vibhramadhara vispashta vikshyamana vishuddhasthula muktaphala mala vidyotita digantare || 15|| sakalabharana
    kalavilasakrita jangamacirasthayi saudamanishankankure || 16|| kanaka rashanakinkini kalanadini ||
    17|| nija janataguna nijapatinikata nivedini ||18|| nikhila janamodini || 19|| nijapatisammodini ||
    20|| manthara taramehi || 21|| mandamimamavehi || 22|| mayi mana adhehi || 23|| mama shubhamavadehi
    || 24|| mangalamayi bhahi || 25|| akunthavaikuntha mahavibhutinayaki || 26|| akhilandakoti brahmandanayaki
    || 27|| shrivenkatanayaki || 28|| shrimati padmavati || 29|| jaya vijayibhava || 30|| jiyacchri venkatadri
    prabhuvaramahishi nama padmavati shrih jiyaccasyah katakshamritarasarasiko venkatadre radhishah jiyacchrivaishnavali
    hatakumata kathavikshanai retadiyaih jiyacca shrishukarsheh puramanavaratam sarvasampatsamriddham
    || 6|| shrirangasurinedam shrishailanantasurivamshyena | bhaktya racitam gadyam lakshmih padmavati
    samadattam || 7|| || shrilakshmigadyam sampurnam ||
  devanagari: श्रीलक्ष्मीगद्यम् श्रीरस्तु । श्रीवेङ्कटेशमहिषी श्रितकल्पवल्ली पद्मावती विजयतामिह पद्महस्ता
    । श्रीवेङ्कटाख्य धरणीभृदुपत्यकायां या श्रीशुकस्य नगरे कमलाकरे भूत् ॥ १॥ भगवति जयजय पद्मावति हे ॥ १॥
    भागवतनिकर बहुतर भयकर बहुलोद्यम यमसद्मायति हे ॥ २॥ भविजन भयनाशि भाग्यपयोराशि वेलातिगलोल विपुलतरोल्लोल
    वीचिलीलावहे ॥३॥ पद्मजभवयुवति प्रमुखामरयुवति परिचारकयुवति वितति सरति सतत विरचित परिचरण चरणाम्भोरुहे
    ॥ ४॥ अकुण्ठवैकुण्ठ महाविभूतिनायकि ॥ ५॥ अखिलाण्डकोटि ब्रह्माण्डनायकि ॥ ६॥ श्रीवेङ्कटनायकि ॥ ७॥ श्रीमति
    पद्मावति ॥ ८॥ जय विजयीभव ॥ ९॥ क्षीराम्भोराशिसारैः प्रभवति रुचिरैः यत्स्वरूपे प्रदीपे शेषाण्येषामृजीषाण्य
    जनिषत स्सुधाकल्पदेवाङ्गनाद्याः । यस्यास्सिंहासनस्य प्रविलसति सदा तोरणं वैजयन्ती सेयं श्रीवेङ्कटाद्रि
    प्रभुवरमहिषी भातु पद्मावती श्रीः ॥ २॥ जय जय जय जगदीश्वरकमलापति करुणारस वरुणालयवेले ॥ १॥ चरणाम्बुज
    शरणागत करुणारस वरुणालय मुरबाधन करबोधन सफलीकृत शरणागत जनतागमवेले ॥ २॥ किञ्चिदुदञ्चित सुस्मितभञ्जित
    चन्द्रकलामदसूचित सम्पद विमल विलोचन जितकमलानन सकृदवलोकन सज्जनदुर्जन भेदविलोपन लीलालोले ॥ ३॥ शोभनशीले
    ॥ ४॥ शुभगणमाले ॥ ५॥ सुन्दरभाले ॥ ६॥ कुटिलनिरन्तर कुन्तलमाले ॥ ७॥ मणिवरविरचित मञ्जुलमाले ॥ ८॥ पद्म
    सुरभिगन्ध मार्दवमकरन्द फलिताकृतिबन्ध पद्मिनी बाले ॥ ९॥ अकुण्ठवैकुण्ठ महाविभूति नायकि ॥ १०॥ अखिलाण्डकोटि
    ब्रह्माण्डनायकि ॥ ११॥ श्रीवेङ्कटनायकि ॥ १२॥ श्रीमति पद्मावति ॥ १३॥ जय विजयीभव ॥ १४॥ श्रीशैलानन्तसूरे
    स्सधव मुपवने चोरलीलां चरन्ती चाम्पेये तेन बद्धा स्वपतिमवरयत्तस्य कन्या सती या । यस्याः श्रीशैलपूर्ण
    श्श्वशुरति च हरे स्तातभावं प्रपन्नः सेयं श्रीवेङ्कटाद्रि प्रभुवरमहिशी भातु पद्मावती श्रीः ॥ ३॥ खर्वीभवदतिगर्वी
    कृत गुरुमेर्वीशगिरि मुखोर्वीधरकुल दर्वीकरदयितोर्वी धर शिखरोर्वी फणिपति गुर्वीश्वरकृत रामानुजमुनि नामाङ्कित
    बहुभूमाश्रय सुरधामालय वरनन्दन वन सुन्दरतरानन्द मन्दिरानन्त गुरुवनानन्त केलियुत निभृततर विहृति रत लीलाचोर
    राजकुमार निजपति स्वैरसहविहार समय निभृतोषित फणिपति गुरुभक्ति पाशवशंवद निगृहीताराम चम्पक निबद्धे ॥ १॥
    भक्तजनावन बद्ध श्रद्धे ॥ २॥ भजन विमुख भविजन भगवदुपसदन समय निरीक्षण सन्तत सन्नद्धे ॥ ३॥ भागधेयगुरु
    भव्यशेषगुरु बाहुमूल धृत बालिकाभूते ॥ ४॥ श्रीवेङ्कटनाथ वरपरिगृहीते ॥ ५॥ श्रीवेङ्कटनाथतातभूत श्रीशैलपूर्णगुरु
    गृहस्नुषाभूते ॥ ६॥ अकुण्ठवैकुण्ठ महाविभूतिनायकि ॥ ७॥ अखिलाण्डकोटि ब्रह्माण्डनायकि ॥ ८॥ श्रीवेङ्कटनायकि
    ॥ ९॥ श्रीमति पद्मावति ॥ १०॥ जय विजयीभव ॥ ११॥ श्रीशैले केलिकाले मुनिसमुपगमे या भयात्प्राक् प्रयाता
    तस्यैवोपत्यकायां तदनु शुकपुरे पद्मकासारमध्ये । प्रादुर्भूताऽरविन्दे विकचदलचये पत्युरुग्रैस्तपोभिः
    सेयं श्रीवेङ्कटाद्रिप्रभुवरमहिषी भातु पद्मावती श्रीः ॥ ४॥ भद्रे ॥ १॥ भक्तजनावन निर्निद्रे ॥ २॥ भगवद्दक्षिण
    वक्षोलक्षण लाक्षालक्षित मृदुपदमुद्रे ॥ ३॥ भञ्जित भव्यनव्यदरदलितदल मृदुल कोकनद मदविलस दधरोर्ध्व विन्यास
    सव्यापसव्यकर विराजदनितर शरणभक्तगण निजचरण शरणीकरणाभय वितरण निपुण निरूपण निर्निद्रमुद्रे ॥ ४॥ उल्लसदूर्ध्व
    तरापरकर शिखरयुगल शेखर निजमञ्जिम मदभञ्जन कुशलवदन विधुमण्डल विलोकन विदीर्ण हृदयता विभ्रमधरदर विदलितदल
    कोमल कमलमुकुल युगलनिरर्गल विनिर्गलत्कान्ति सुमुद्रे ॥ ५॥ श्रीवेङ्कट शिखरसहमहिषी निकर कान्तलीलावसर
    सङ्गतमुनिनिकर समुदित बहुलतर भयलसदपसारकेलि बहुमान्ये ॥ ६॥ श्रीशैलाधीश रचित दिनाधीश बिम्बरमाधीशविषय
    तपोजन्ये ॥ ७॥ श्रीशैलासन्न शुकपुरीसम्पन्न पद्मसर उत्पन्न पद्मिनीकन्ये ॥ ८॥ पद्म सरोवर्य विरचित महाश्चर्य
    घोरतपश्चर्य श्रीशुकमुनिधुर्य कामित वदान्ये ॥ ९॥ मानव कर्मजाल दुर्मलमर्म निर्मूलन लब्धवर्ण निजसलिलजवर्ण
    निर्जित दुर्वर्ण वज्रस्फटिक सवर्ण सलिल सम्पूर्ण सुवर्णमुखरी सैकत सञ्जात सन्तत मकरन्द बिन्दुसन्दोह
    निष्यन्द सन्दानितामन्दानन्द मिलिन्द वृन्द मधुरतर झङ्काररव रुचिरसन्ततसम्फुल्ल मल्ली मालती प्रमुख व्रतति
    वितति कुन्दकुरवक मरुवक दमनकादि गुल्मकुसुम महिम घुम घुमित सर्व दिङ्मुख सर्वतोमुख महनीयामन्द माकन्दाविरल
    नारिकेल निरवधिक क्रमुक प्रमुख तरुनिकरवीथि रमणीय विपुल तटोद्यान विहारिणि ॥ १०॥ मञ्जुलतर मणिहारिणि ॥
    ११॥ महनीयतर मणिजिततरणि मकुटमनोहारिणि ॥ १२॥ मन्थरतर सुन्दरगति मत्तमराल युवति सुगति मदापहारिणि ॥ १३॥
    कलकण्ठ युवाकुण्ठ कण्ठनाद कलव्याहारिणि ॥ १४॥ अकुण्ठवैकुण्ठ महाविभूतिनायकि ॥ १५॥ अखिलाण्डकोटि ब्रह्माण्डनायकि
    ॥ १६॥ श्रीवेङ्कटनायकि ॥ १७॥ श्रीमति पद्मावति ॥ १८॥ जय विजयीभव ॥ १९॥ यां लावण्यनदीं वदन्ति कवयः श्रीमाधवाम्भोनिधिं
    गच्छन्तीं स्ववशङ्गतांश्च तरसा जन्तून्नयन्तीमपि । यस्या मानसनेत्रहस्त चरणाद्यङ्गानि भूषारुची रम्भोजान्यमलोज्ज्वलं
    च सलिलं सा भातु पद्मावती ॥ ५॥ अम्भोरुहवासिनि ॥ १॥ अम्भोरुहासन प्रमुखाखिल भूतानुशासिनि ॥ २॥ अनवरतात्मनाथ
    वक्षस्सिंहासनाध्यासिनि ॥ ३॥ अङ्घ्रियुगावतार पथसन्तत सङ्गाहमान घोरतराभङ्गुर संसार घर्मसन्तप्त मनुज
    सन्ताप नाशिनि ॥ ४॥ बहुल कुन्तल वदनमण्डल पाणिपल्लव रुचिरलोचन सुभगकन्दरा बाहुवल्लिका जघन नितम्ब मण्डलमय
    वितत शैवाल सम्फुल्ल कमल कुवलय कम्बुकमलिनी नालोत्तुङ्ग विपुलपुलिनशोभिनि ॥ ५॥ माधव महार्णवगाहिनि ॥ ६॥
    महितलावण्यमहावाहिनि ॥ ७॥ मुखचन्द्र समुद्यत भालतलविराजमान किञ्चिदुदञ्चित सूक्ष्माग्र कस्तूरीतिलक शूल
    समुद्भूतभीति विशीर्णसमुज्झित सम्मुखभागपरिसरयुगल सरभस विसृमर तिमिर निकर सन्देह सन्दायि ससीमन्तकुन्तल
    कान्ते ॥ ८॥ स्फटिक मणिमय कन्दर्प दर्पण सन्देह सन्दोहि सकल जन सम्मोहि फलफलविमललावण्य ललित सततमुदित
    मुदितमुखमण्डले ॥ ९॥ महित म्रदिम महिममन्दहासा सहिष्णु तदुदय समुदित क्लमोदीर्णारुणवर्ण विभ्रमदविडम्बित
    परिणत बिम्बविद्रुम विलसदोष्ट युगले ॥ १०॥ परिहसित दरहसित कोकनद कुन्दरद मन्थरतरोद्गत्वर विसृत्वर कान्तिवीचि
    कमनीयामन्द मन्दहास सदनवदने ॥ ११॥ समुज्ज्वलतर मणितर्जित तरणिताटङ्क निराटङ्क कन्दलितकान्ति पूर करम्बित
    कर्णशष्कुलीवलये ॥ १२॥ बहिरुपगत स्फुरणाधिगतान्तरङ्गण भूषणगण वदन कोशसदन स्फटिक मणिमय भित्ति शङ्काङ्कुरण
    चणप्रतिफलित कर्णपूर कर्णावतंस ताटङ्क कुण्डल मण्डन निगनिगायमान विमलकपोल मण्डले ॥ १३॥ निजभ्रुकुटी भटीभूत
    त्र्यक्षा ष्टाक्षद्वादशाक्षसहस्राक्ष प्रभृति सर्वसुपर्व शोभन भ्रूमण्डले ॥ १४॥ निटलफलक मृगमदतिलकच्छल
    विलोक लोक विलोचन दोषविरचित विदलन वदन विधुमण्डल विगलित नासिका प्रणालिका निगूढ निस्तृत नासाग्रस्थूल
    मुक्ताफलच्छलाभिव्यक्त वदन बिलनिलीन कण्ठनालिकान्तः प्रवृत्त ग्रीवामध्योच्छ भागकृत विभागग्रीवागर्त विनिस्सृत
    पृथुल विलसदुरोजशैल युगल निर्झर झरीभूत गम्भीर नाभि ह्रदाव गाढ विलीन दीर्घतर पृथुल सुधाधारा प्रवाहयुगल
    विभ्रमाधार विस्पष्ट वीक्ष्यमाण विशुद्धस्थूल मुक्ताफल माला विद्योतित दिगन्तरे ॥ १५॥ सकलाभरण कलाविलासकृत
    जङ्गमचिरस्थायि सौदामनीशङ्काङ्कुरे ॥ १६॥ कनक रशनाकिङ्किणी कलनादिनि ॥ १७॥ निज जनतागुण निजपतिनिकट निवेदिनि
    ॥१८॥ निखिल जनामोदिनि ॥ १९॥ निजपतिसम्मोदिनि ॥ २०॥ मन्थर तरमेहि ॥ २१॥ मन्दमिममवेहि ॥ २२॥ मयि मन आधेहि
    ॥ २३॥ मम शुभमवदेहि ॥ २४॥ मङ्गलमयि भाहि ॥ २५॥ अकुण्ठवैकुण्ठ महाविभूतिनायकि ॥ २६॥ अखिलाण्डकोटि ब्रह्माण्डनायकि
    ॥ २७॥ श्रीवेङ्कटनायकि ॥ २८॥ श्रीमति पद्मावति ॥ २९॥ जय विजयीभव ॥ ३०॥ जीयाच्छ्री वेङ्कटाद्रि प्रभुवरमहिषी
    नाम पद्मावती श्रीः जीयाच्चास्याः कटाक्षामृतरसरसिको वेङ्कटाद्रे रधीशः जीयाच्छ्रीवैष्णवाली हतकुमत कथावीक्षणै
    रेतदीयैः जीयाच्च श्रीशुकर्षेः पुरमनवरतं सर्वसम्पत्समृद्धम् ॥ ६॥ श्रीरङ्गसूरिणेदं श्रीशैलानन्तसूरिवंश्येन
    । भक्त्या रचितं गद्यं लक्ष्मीः पद्मावती समादत्ताम् ॥ ७॥ ॥ श्रीलक्ष्मीगद्यं सम्पूर्णम् ॥
