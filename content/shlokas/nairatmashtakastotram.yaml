id: nairatmashtakastotram
category: stotram
name:
  english: nairatmashtakastotram
  devanagari: नैरात्माष्टकस्तोत्रम्
content:
  english: nairatmashtakastotram niralambanirakaranirvikalpasvarupini | nairatma varada devi nityameva
    namo'stu te || 1|| ekavaktram trinetram ca urdhvapingalamurdhajam | kare kartikapalam ca namami vishvamatarim
    || 2|| navanrityabhushitam ca sahasramukharupinim | yogeshvarim yogagamyam namami jnanarupinim ||
    3|| shavarudham mahatejam sarvadushtanikrintanim | sarvapapaharam devim namami jagadishvarim || 4||
    gaurim caurim ca vetalim ghasmarim pukkasim tatha | shabarim candalim dombim namami cashtayoginim
    || 5|| brahmavishnushivashakracaturmaravinashinim | trailokyamohinim devim namami surasundarim ||
    6|| akshamalavibhushangimakarabijasambhavam | nityam dhyanaratam devim namami vishvamatarim || 7||
    sarvabhutapriyam devim sarvamantraprabodhinim | sarvamantramayim matarnairatmam tvam namamyaham ||
    8|| iti nairatmashtakastotram sampurnam ||
  devanagari: नैरात्माष्टकस्तोत्रम् निरालम्बनिराकारनिर्विकल्पस्वरूपिणी । नैरात्मा वरदा देवी नित्यमेव नमोऽस्तु
    ते ॥ १॥ एकवक्त्रां त्रिनेत्रां च ऊर्ध्वपिङ्गलमूर्धजाम् । करे कर्तिकपालां च नमामि विश्वमातरीम् ॥ २॥
    नवनृत्यभूषितां च सहस्रमुखरूपिणीम् । योगेश्वरीं योगगम्यां नमामि ज्ञानरूपिणीम् ॥ ३॥ शवारूढां महातेजां
    सर्वदुष्टनिकृन्तनीम् । सर्वपापहरां देवीं नमामि जगदीश्वरीम् ॥ ४॥ गौरीं चौरीं च वेतालीं घस्मरीं पुक्कसीं
    तथा । शबरीं चाण्डालीं डोम्बीं नमामि चाष्टयोगिनीम् ॥ ५॥ ब्रह्माविष्णुशिवशक्रचतुर्मारविनाशिनीम् । त्रैलोक्यमोहिनीं
    देवीं नमामि सुरसुन्दरीम् ॥ ६॥ अक्षमालविभूषाङ्गीमकारबीजसम्भवाम् । नित्यं ध्यानरतां देवीं नमामि विश्वमातरीम्
    ॥ ७॥ सर्वभूतप्रियां देवीं सर्वमन्त्रप्रबोधिनीम् । सर्वमन्त्रमयीं मातर्नैरात्मां त्वां नमाम्यहम् ॥
    ८॥ इति नैरात्माष्टकस्तोत्रं सम्पूर्णम् ॥
