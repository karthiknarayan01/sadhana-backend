id: hemakamakshidandakam
category: stotram
name:
  english: hemakamakshidandakam
  devanagari: हेमकामाक्षीदण्डकम्
content:
  english: shubhadam mandasmitodarakam || dakshine kamajidyasyah cudayam kamavallabhah| vasah kamayudhasyadhah
    kamakshim tam namamyaham || kamandha tilakam yasyah kamamali ca putrakah| kamandhopama
  devanagari: शुभदं मन्दस्मितोदारकम् ॥ दक्षिणे कामजिद्यस्याः चूडायां कामवल्लभः। वासः कामायुधस्याधः कामाक्षीं
    तां नमाम्यहम् ॥ कामान्धा तिलकं यस्याः काममाली च पुत्रकः। कामान्धोपम
meaning: {}
