id: shivastotramshridharasvami
category: stotram
name:
  english: shivastotramshridharasvami
  devanagari: शिवस्तोत्रम्श्रीधरस्वामी
content:
  english: shrishivastotram nityanandashcidatma gunarahitaparakasharupo vishuddhah sarvatradvaitarupo
    nijaniratishayatpurnarupah prashantah | maya tatkaryahino niravadhirabhito nistarango mahabdhih satyam
    satyasya yadvai shrutishu nigaditam kevalam tacchivo'ham || 1|| vishvam neti pramanadvigalita jagadakarabhanatsvapurnah
    samyakyaccidghanaikamritasukhakavalasvadapurno viveki | nirdvandvo nityamukto vigalitamamatahankritirnityatriptah
    aste yadbrahmamatram shrutishu nigadita kevalam tacchivo'ham || 2|| adau madhye tathante janimritiphaladam
    karmamulam vishalam chitva samsaravriksham nijaniratishayasangashasrena purnam | bhasa yasyaiva sarvam
    bhasitamatiruca bhasakam bhasakanam jivo brahmaiva yatsyacchrutishu nigaditam kevalam tacchivo'ham
    || 3|| jnatva nihsaramevam jagadakhilamidam bhrantimohapradam yat tyaktva bhogaikavancham viratiyuta
    ito manyate yaddhisaukhyam | amrityorbrahmalokam shatashatagunitam taratamyena bhatam yasminnalpam
    yadevam shrutishu nigaditam kevalam tacchivo'ham || 4|| mrityorapnoti mrityum sa iha jagadidam yastu
    naneva pashyet uktva yatpurnarupam shruti shirasimatam neha nanasti vaca | aptoktya bhati yadvadvyapagataphanini
    rajjureka bhramante tadvadbrahmaiva yatsyacchrutishu nigaditam kevalam tacchivo'ham || 5|| iti shrimat
    paramahamsa parivrajakacarya sadguru bhagavata shridharasvamina viracitam shrishivastotram sampurnam
    |
  devanagari: श्रीशिवस्तोत्रम् नित्यानन्दश्चिदात्मा गुणरहितपराकाशरूपो विशुद्धः सर्वत्राद्वैतरूपो निजनिरतिशयात्पूर्णरूपः
    प्रशान्तः । माया तत्कार्यहीनो निरवधिरभितो निस्तरङ्गो महाब्धिः सत्यं सत्यस्य यद्वै श्रुतिषु निगदितं
    केवलं तच्छिवोऽहम् ॥ १॥ विश्वं नेति प्रमाणाद्विगलित जगदाकारभानात्स्वपूर्णः सम्यक्यच्चिद्घनैकामृतसुखकवलास्वादपूर्णो
    विवेकी । निर्द्वन्द्वो नित्यमुक्तो विगलितममताहङ्कृतिर्नित्यतृप्तः आस्ते यद्ब्रह्ममात्रं श्रुतिषु निगदित
    केवलं तच्छिवोऽहम् ॥ २॥ आदौ मध्ये तथान्ते जनिमृतिफलदं कर्ममूलं विशालं छित्वा संसारवृक्षं निजनिरतिषयासङ्गशस्रेण
    पूर्णम् । भासा यस्यैव सर्वं भसितमतिरुचा भासकं भासकानां जीवो ब्रह्मैव यत्स्याच्छ्रुतिषु निगदितं केवलं
    तच्छिवोऽहम् ॥ ३॥ ज्ञात्वा निःसारमेवं जगदखिलमिदं भ्रान्तिमोहप्रदं यत् त्यक्त्वा भोगैकवाञ्छां विरतियुत
    इतो मन्यते यद्धिसौख्यम् । आमृत्योर्ब्रह्मलोकं शतशतगुणितं तारतम्येन भातं यस्मिन्नल्पं यदेवं श्रुतिषु
    निगदितं केवलं तच्छिवोऽहम् ॥ ४॥ मृत्योराप्नोति मृत्युं स इह जगदिदं यस्तु नानेव पश्येत् उक्त्वा यत्पूर्णरूपं
    श्रुति शिरसिमतं नेह नानास्ति वाचा । आप्तोक्त्या भाति यद्वद्व्यपगतफणिनी रज्जुरेका भ्रमान्ते तद्वद्ब्रह्मैव
    यत्स्यच्छ्रुतिषु निगदितं केवलं तच्छिवोऽहम् ॥ ५॥ इति श्रीमत् परमहंस परिव्राजकाचार्य सद्गुरु भगवता श्रीधरस्वामिना
    विरचितं श्रीशिवस्तोत्रं सम्पूर्णम् ।
