id: shriangarakashtottarashatanamastotram
category: stotram
name:
  english: shriangarakashtottarashatanamastotram
  devanagari: श्रीअङ्गारकाष्टोत्तरशतनामस्तोत्रम्
content:
  english: om kra~ krim kraum sah bhaumaya namah || mahisuto mahabhago mamgaḻo mamgaḻapradah | mahaviro
    mahashuro mahabalaparakramah || 1|| maharaudro mahabhadro mananiyo dayakarah | manajo'marshanah krurah
    tapapapavivarjitah || 2|| supratipah sutamrakshah subrahmanyah sukhapradah | vakrastambhadigamano
    varenyo varadah sukhi || 3|| virabhadro virupaksho vidurastho vibhavasuh | nakshatracakrasancari kshatrapah
    kshatravarjitah || 4|| kshayavriddhivinirmuktah kshamayukto vicakshanah | akshinaphaladah cakshurgocarashshubhalakshanah
    || 5|| vitarago vitabhayo vijvaro vishvakaranah | nakshatrarashisancaro nanabhayanikrintanah || 6||
    kamaniyo dayasarah kanatkanakabhushanah | bhayaghno bhavyaphalado bhaktabhayavarapradah || 7|| shatruhanta
    shamopetah sharanagataposhakah | sahasah sadgunadhyakshah sadhuh samaradurjayah || 8|| dushtadurah
    shishtapujyah sarvakashtanivarakah | dushceshtavarako duhkhabhanjano durdharo harih || 9|| duhsvapnahanta
    durdharsho dushtagarvavimocakah | bharadvajakulodbhuto bhusuto bhavyabhushanah || 10|| raktambaro
    raktavapurbhaktapalanatatparah | caturbhujo gadadhari meshavaho mitashanah || 11|| shaktishuladharashshaktah
    shastravidyavisharadah | tarkikah tamasadharah tapasvi tamralocanah || 12|| taptakancanasamkasho raktakinjalkasannibhah
    | gotradhidevo gomadhyacaro gunavibhushanah || 13|| asrijamgarako'vantideshadhisho janardanah | suryayamyapradeshastho
    yavano yamyadi'gmukhah || 14|| trikonamandalagato tridashadhipasannutah | shucih shucikarah shuro
    shucivashyah shubhavahah || 15|| meshavrishcikarashisho medhavi mitabhashanah | sukhapradah surupakshah
    sarvabhishtaphalapradah || 16|| || iti mangala evam angarakashtottarashatanamastotram sampurnam ||
  devanagari: ॐ क्राँ क्रीं क्रौं सः भौमाय नमः ॥ महीसुतो महाभागो मंगळो मंगळप्रदः । महावीरो महाशूरो महाबलपराक्रमः
    ॥ १॥ महारौद्रो महाभद्रो माननीयो दयाकरः । मानजोऽमर्षणः क्रूरः तापपापविवर्जितः ॥ २॥ सुप्रतीपः सुताम्राक्षः
    सुब्रह्मण्यः सुखप्रदः । वक्रस्तम्भादिगमनो वरेण्यो वरदः सुखी ॥ ३॥ वीरभद्रो विरूपाक्षो विदूरस्थो विभावसुः
    । नक्षत्रचक्रसञ्चारी क्षत्रपः क्षात्रवर्जितः ॥ ४॥ क्षयवृद्धिविनिर्मुक्तः क्षमायुक्तो विचक्षणः । अक्षीणफलदः
    चक्षुर्गोचरष्षुभलक्षणः ॥ ५॥ वीतरागो वीतभयो विज्वरो विश्वकारणः । नक्षत्रराशिसञ्चारो नानाभयनिकृन्तनः
    ॥ ६॥ कमनीयो दयासारः कनत्कनकभूषणः । भयघ्नो भव्यफलदो भक्ताभयवरप्रदः ॥ ७॥ शत्रुहन्ता शमोपेतः शरणागतपोषकः
    । साहसः सद्गुणाध्यक्षः साधुः समरदुर्जयः ॥ ८॥ दुष्टदूरः शिष्टपूज्यः सर्वकष्टनिवारकः । दुश्चेष्टवारको
    दुःखभञ्जनो दुर्धरो हरिः ॥ ९॥ दुःस्वप्नहन्ता दुर्धर्षो दुष्टगर्वविमोचकः । भरद्वाजकुलोद्भूतो भूसुतो
    भव्यभूषणः ॥ १०॥ रक्ताम्बरो रक्तवपुर्भक्तपालनतत्परः । चतुर्भुजो गदाधारी मेषवाहो मिताशनः ॥ ११॥ शक्तिशूलधरश्शक्तः
    शस्त्रविद्याविशारदः । तार्किकः तामसाधारः तपस्वी ताम्रलोचनः ॥ १२॥ तप्तकाञ्चनसंकाशो रक्तकिञ्जल्कसन्निभः
    । गोत्राधिदेवो गोमध्यचरो गुणविभूषणः ॥ १३॥ असृजंगारकोऽवन्तीदेशाधीशो जनार्दनः । सूर्ययाम्यप्रदेशस्थो
    यावनो याम्यदिऽग्मुखः ॥ १४॥ त्रिकोणमण्डलगतो त्रिदशाधिपसन्नुतः । शुचिः शुचिकरः शूरो शुचिवश्यः शुभावहः
    ॥ १५॥ मेषवृश्चिकराशीशो मेधावी मितभाषणः । सुखप्रदः सुरूपाक्षः सर्वाभीष्टफलप्रदः ॥ १६॥ ॥ इति मङ्गल एवं
    अङ्गारकाष्टोत्तरशतनामस्तोत्रम् सम्पूर्णम् ॥
