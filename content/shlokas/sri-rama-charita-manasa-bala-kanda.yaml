    ॥ दो कुअँरि मनोहर बिजय बड़इ कीरति अति कमनीय। पावनिहार बिरञ्चि जनु रचेउ न धनु दमनीय ॥ ॥ कहहु काहि यहु
    लाभु न भावा। काहुँ न सङ्कर चाप चढ़आवा ॥ रहु चढ़आउब तोरब भाई। तिलु भरि भूमि न सके छड़आई ॥ अब जनि कौ
    माखै भट मानी। बीर बिहीन मही मैं जानी ॥ तजहु आस निज निज गृह जाहू। लिखा न बिधि बैदेहि बिबाहू ॥ सुकृत
    जाइ जौं पनु परिहरूँ। कुअँरि कुआरि रहु का करूँ ॥ जो जनतेउँ बिनु भट भुबि भाई। तौ पनु करि होतेउँ न हँसाई
    ॥ जनक बचन सुनि सब नर नारी। देखि जानकिहि भे दुखारी ॥ माखे लखनु कुटिल भिँ भौंहें। रदपट फरकत नयन रिसौंहेम्
    ॥ दो कहि न सकत रघुबीर डर लगे बचन जनु बान। नाइ राम पद कमल सिरु बोले गिरा प्रमान ॥ ॥ रघुबंसिंह महुँ
    जहँ कौ होई। तेहिं समाज अस कहि न कोई ॥ कही जनक जसि अनुचित बानी। बिद्यमान रघुकुल मनि जानी ॥ सुनहु भानुकुल
    पङ्कज भानू। कहुँ सुभाउ न कछु अभिमानू ॥ जौ तुम्हारि अनुसासन पावौं। कन्दुक इव ब्रह्माण्ड उठावौम् ॥ काचे
    घट जिमि डारौं फोरी। सकुँ मेरु मूलक जिमि तोरी ॥ तव प्रताप महिमा भगवाना। को बापुरो पिनाक पुराना ॥ नाथ
    जानि अस आयसु होऊ। कौतुकु करौं बिलोकिअ सोऊ ॥ कमल नाल जिमि चाफ चढ़आवौं। जोजन सत प्रमान लै धावौम् ॥ दो
    तोरौं छत्रक दण्ड जिमि तव प्रताप बल नाथ। जौं न करौं प्रभु पद सपथ कर न धरौं धनु भाथ ॥ ॥ लखन सकोप बचन
    जे बोले। डगमगानि महि दिग्गज डोले ॥ सकल लोक सब भूप डेराने। सिय हियँ हरषु जनकु सकुचाने ॥ गुर रघुपति
    सब मुनि मन माहीं। मुदित भे पुनि पुनि पुलकाहीम् ॥ सयनहिं रघुपति लखनु नेवारे। प्रेम समेत निकट बैठारे
    ॥ बिस्वामित्र समय सुभ जानी। बोले अति सनेहमय बानी ॥ उठहु राम भञ्जहु भवचापा। मेटहु तात जनक परितापा ॥
    सुनि गुरु बचन चरन सिरु नावा। हरषु बिषादु न कछु उर आवा ॥ ठाढ़ए भे उठि सहज सुभाएँ। ठवनि जुबा मृगराजु
    लजाएँ ॥ दो उदित उदयगिरि मञ्च पर रघुबर बालपतङ्ग। बिकसे सन्त सरोज सब हरषे लोचन भृङ्ग ॥ ॥ नृपन्ह केरि
    आसा निसि नासी। बचन नखत अवली न प्रकासी ॥ मानी महिप कुमुद सकुचाने। कपटी भूप उलूक लुकाने ॥ भे बिसोक कोक
    मुनि देवा। बरिसहिं सुमन जनावहिं सेवा ॥ गुर पद बन्दि सहित अनुरागा। राम मुनिन्ह सन आयसु मागा ॥ सहजहिं
    चले सकल जग स्वामी। मत्त मञ्जु बर कुञ्जर गामी ॥ चलत राम सब पुर नर नारी। पुलक पूरि तन भे सुखारी ॥ बन्दि
    पितर सुर सुकृत सँभारे। जौं कछु पुन्य प्रभाउ हमारे ॥ तौ सिवधनु मृनाल की नाईं। तोरहुँ राम गनेस गोसाईम्
    ॥ दो रामहि प्रेम समेत लखि सखिन्ह समीप बोलाइ। सीता मातु सनेह बस बचन कहि बिलखाइ ॥ ॥ सखि सब कौतुक देखनिहारे।
    जेठ कहावत हितू हमारे ॥ कौ न बुझाइ कहि गुर पाहीं। ए बालक असि हठ भलि नाहीम् ॥ रावन बान छुआ नहिं चापा।
    हारे सकल भूप करि दापा ॥ सो धनु राजकुअँर कर देहीं। बाल मराल कि मन्दर लेहीम् ॥ भूप सयानप सकल सिरानी।
    सखि बिधि गति कछु जाति न जानी ॥ बोली चतुर सखी मृदु बानी। तेजवन्त लघु गनिअ न रानी ॥ कहँ कुम्भज कहँ सिन्धु
    अपारा। सोषेउ सुजसु सकल संसारा ॥ रबि मण्डल देखत लघु लागा। उदयँ तासु तिभुवन तम भागा ॥ दो मन्त्र परम
    लघु जासु बस बिधि हरि हर सुर सर्ब। महामत्त गजराज कहुँ बस कर अङ्कुस खर्ब ॥ ॥ काम कुसुम धनु सायक लीन्हे।
    सकल भुवन अपने बस कीन्हे ॥ देबि तजिअ संसु अस जानी। भञ्जब धनुष रामु सुनु रानी ॥ सखी बचन सुनि भै परतीती।
    मिटा बिषादु बढ़ई अति प्रीती ॥ तब रामहि बिलोकि बैदेही। सभय हृदयँ बिनवति जेहि तेही ॥ मनहीं मन मनाव अकुलानी।
    होहु प्रसन्न महेस भवानी ॥ करहु सफल आपनि सेवकाई। करि हितु हरहु चाप गरुआई ॥ गननायक बरदायक देवा। आजु
    लगें कीन्हिउँ तुअ सेवा ॥ बार बार बिनती सुनि मोरी। करहु चाप गुरुता अति थोरी ॥ दो देखि देखि रघुबीर तन
    सुर मनाव धरि धीर ॥ भरे बिलोचन प्रेम जल पुलकावली सरीर ॥ ॥ नीकें निरखि नयन भरि सोभा। पितु पनु सुमिरि
    बहुरि मनु छोभा ॥ अहह तात दारुनि हठ ठानी। समुझत नहिं कछु लाभु न हानी ॥ सचिव सभय सिख देइ न कोई। बुध
    समाज बड़ अनुचित होई ॥ कहँ धनु कुलिसहु चाहि कठोरा। कहँ स्यामल मृदुगात किसोरा ॥ बिधि केहि भाँति धरौं
    उर धीरा। सिरस सुमन कन बेधिअ हीरा ॥ सकल सभा कै मति भै भोरी। अब मोहि सम्भुचाप गति तोरी ॥ निज जड़ता लोगन्ह
    पर डारी। होहि हरुअ रघुपतिहि निहारी ॥ अति परिताप सीय मन माही। लव निमेष जुग सब सय जाहीम् ॥ दो प्रभुहि
    चिति पुनि चितव महि राजत लोचन लोल। खेलत मनसिज मीन जुग जनु बिधु मण्डल डोल ॥ ॥ गिरा अलिनि मुख पङ्कज रोकी।
    प्रगट न लाज निसा अवलोकी ॥ लोचन जलु रह लोचन कोना। जैसे परम कृपन कर सोना ॥ सकुची ब्याकुलता बड़इ जानी।
    धरि धीरजु प्रतीति उर आनी ॥ तन मन बचन मोर पनु साचा। रघुपति पद सरोज चितु राचा ॥ तौ भगवानु सकल उर बासी।
    करिहिं मोहि रघुबर कै दासी ॥ जेहि कें जेहि पर सत्य सनेहू। सो तेहि मिलि न कछु संहेहू ॥ प्रभु तन चिति
    प्रेम तन ठाना। कृपानिधान राम सबु जाना ॥ सियहि बिलोकि तकेउ धनु कैसे। चितव गरुरु लघु ब्यालहि जैसे ॥
    दो लखन लखेउ रघुबंसमनि ताकेउ हर कोदण्डु। पुलकि गात बोले बचन चरन चापि ब्रह्माण्डु ॥ ॥ दिसकुञ्जरहु कमठ
    अहि कोला। धरहु धरनि धरि धीर न डोला ॥ रामु चहहिं सङ्कर धनु तोरा। होहु सजग सुनि आयसु मोरा ॥ चाप सपीप
    रामु जब आए। नर नारिन्ह सुर सुकृत मनाए ॥ सब कर संसु अरु अग्यानू। मन्द महीपन्ह कर अभिमानू ॥ भृगुपति
    केरि गरब गरुआई। सुर मुनिबरन्ह केरि कदराई ॥ सिय कर सोचु जनक पछितावा। रानिन्ह कर दारुन दुख दावा ॥ सम्भुचाप
    बड बोहितु पाई। चढे जाइ सब सङ्गु बनाई ॥ राम बाहुबल सिन्धु अपारू। चहत पारु नहि कौ कड़हारू ॥ दो राम बिलोके
    लोग सब चित्र लिखे से देखि। चिती सीय कृपायतन जानी बिकल बिसेषि ॥ ॥ देखी बिपुल बिकल बैदेही। निमिष बिहात
    कलप सम तेही ॥ तृषित बारि बिनु जो तनु त्यागा। मुएँ करि का सुधा तड़आगा ॥ का बरषा सब कृषी सुखानें। समय
    चुकें पुनि का पछितानेम् ॥ अस जियँ जानि जानकी देखी। प्रभु पुलके लखि प्रीति बिसेषी ॥ गुरहि प्रनामु मनहि
    मन कीन्हा। अति लाघवँ उठाइ धनु लीन्हा ॥ दमकेउ दामिनि जिमि जब लयू। पुनि नभ धनु मण्डल सम भयू ॥ लेत चढ़आवत
    खैञ्चत गाढ़एं। काहुँ न लखा देख सबु ठाढ़एम् ॥ तेहि छन राम मध्य धनु तोरा। भरे भुवन धुनि घोर कठोरा ॥
    छं भरे भुवन घोर कठोर रव रबि बाजि तजि मारगु चले। चिक्करहिं दिग्गज डोल महि अहि कोल कूरुम कलमले ॥ सुर
    असुर मुनि कर कान दीन्हें सकल बिकल बिचारहीं। कोदण्ड खण्डेउ राम तुलसी जयति बचन उचारही ॥ सो सङ्कर चापु
    जहाजु सागरु रघुबर बाहुबलु। बूड़ सो सकल समाजु चढ़आ जो प्रथमहिं मोह बस ॥ ॥ प्रभु दौ चापखण्ड महि डारे।
    देखि लोग सब भे सुखारे ॥ कोसिकरुप पयोनिधि पावन। प्रेम बारि अवगाहु सुहावन ॥ रामरूप राकेसु निहारी। बढ़त
    बीचि पुलकावलि भारी ॥ बाजे नभ गहगहे निसाना। देवबधू नाचहिं करि गाना ॥ ब्रह्मादिक सुर सिद्ध मुनीसा। प्रभुहि
    प्रसंसहि देहिं असीसा ॥ बरिसहिं सुमन रङ्ग बहु माला। गावहिं किन्नर गीत रसाला ॥ रही भुवन भरि जय जय बानी।
    धनुषभङ्ग धुनि जात न जानी ॥ मुदित कहहिं जहँ तहँ नर नारी। भञ्जेउ राम सम्भुधनु भारी ॥ दो बन्दी मागध सूतगन
    बिरुद बदहिं मतिधीर। करहिं निछावरि लोग सब हय गय धन मनि चीर ॥ ॥ झाँझि मृदङ्ग सङ्ख सहनाई। भेरि ढोल दुन्दुभी
    सुहाई ॥ बाजहिं बहु बाजने सुहाए। जहँ तहँ जुबतिन्ह मङ्गल गाए ॥ सखिन्ह सहित हरषी अति रानी। सूखत धान परा
    जनु पानी ॥ जनक लहेउ सुखु सोचु बिहाई। पैरत थकें थाह जनु पाई ॥ श्रीहत भे भूप धनु टूटे। जैसें दिवस दीप
    छबि छूटे ॥ सीय सुखहि बरनिअ केहि भाँती। जनु चातकी पाइ जलु स्वाती ॥ रामहि लखनु बिलोकत कैसें। ससिहि चकोर
    किसोरकु जैसेम् ॥ सतानन्द तब आयसु दीन्हा। सीताँ गमनु राम पहिं कीन्हा ॥ दो सङ्ग सखीं सुदंर चतुर गावहिं
    मङ्गलचार। गवनी बाल मराल गति सुषमा अङ्ग अपार ॥ ॥ सखिन्ह मध्य सिय सोहति कैसे। छबिगन मध्य महाछबि जैसेम्
    ॥ कर सरोज जयमाल सुहाई। बिस्व बिजय सोभा जेहिं छाई ॥ तन सकोचु मन परम उछाहू। गूढ़ प्रेमु लखि परि न काहू
    ॥ जाइ समीप राम छबि देखी। रहि जनु कुँअरि चित्र अवरेखी ॥ चतुर सखीं लखि कहा बुझाई। पहिरावहु जयमाल सुहाई
    ॥ सुनत जुगल कर माल उठाई। प्रेम बिबस पहिराइ न जाई ॥ सोहत जनु जुग जलज सनाला। ससिहि सभीत देत जयमाला ॥
    गावहिं छबि अवलोकि सहेली। सियँ जयमाल राम उर मेली ॥ सो रघुबर उर जयमाल देखि देव बरिसहिं सुमन। सकुचे सकल
    भुआल जनु बिलोकि रबि कुमुदगन ॥ ॥ पुर अरु ब्योम बाजने बाजे। खल भे मलिन साधु सब राजे ॥ सुर किन्नर नर
    नाग मुनीसा। जय जय जय कहि देहिं असीसा ॥ नाचहिं गावहिं बिबुध बधूटीं। बार बार कुसुमाञ्जलि छूटीम् ॥ जहँ
    तहँ बिप्र बेदधुनि करहीं। बन्दी बिरदावलि उच्चरहीम् ॥ महि पाताल नाक जसु ब्यापा। राम बरी सिय भञ्जेउ चापा
    ॥ करहिं आरती पुर नर नारी। देहिं निछावरि बित्त बिसारी ॥ सोहति सीय राम कै जौरी। छबि सिङ्गारु मनहुँ एक
