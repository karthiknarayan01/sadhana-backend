id: manyu-suktam
category: stotram
name:
  english: Manyu Suktam
content:
  english: atha manyusuktam rigveda samhita 'vidhad vajra sayaka saha ojah pushyati vishvamanushak | sahyama
    dasamarya yuja sahaskritena sahasa sahasvata || manyurevasa devo manyur hota varuno jatave vi~sha
    ilate manushiryah pahi no manyo tapasa sajoshah ntapasa yuja vi jahi shatru n | amitraha vritraha
    dasyuha ca vishva vasunya bhara tva abhimatishahah | vishvacar vanasmasvojah pritanasu dhehi || to
    asmi tava kratva tavishasya pracetah | ta manyo akraturjihilaham svatanurbaladeya asmyupa mehyarvan
    praticina ssahure vishvadhayah | manyo vajrinnabhi mama vavritsvahana || abhi prehi dakshinato bhava
    me vritrani janghanava bhuri | juhomi te dharuna mmadhvo agramubha upamshu prathama pibava || manyo
    sarathamarujanto har shamanaso dhrishita marutvah | tigmeshava ayudha samshisha || agniriva manyo
    tvishita ssahasva senanirnah sahure huta e dhi | hatvaya shatrun vi bhajasva veda ojo mima || sahasva
    manyo abhima nanva rurudhre vashi vasha bahunamasi manyavilito visham yu~dhaye sam shishadhi | akrittaru
    || vijeshakridindra ivanavabravo mmanyo adhipa bhaveha nte nama sahure grinimasi vidmatamutsam tya
    sahaja vajra sayaka saho shyabhibhuta uttaram | kratva dhi mahadhanasya puruhuta samsriji || va~runashca
    manyuh | bhiya na hridayeshu shatravah para jitaso apa nilayantam || || dhanvana ga dhanvanajinjayema
    dhanvana tivra nkrinoti dhanvana sarvah jayema || om shanta prithivi shivamantariksha 'bhayanno astu
    | shiva dishah pradisha uddisho vishvatah paripantu sarvata
  devanagari: अथ मन्युसूक्तं ऋग्वेद संहिता ऽवि॑धद् वज्र सायक॒ सह॒ ओजः॑ पुष्यति॒ विश्व॑मानु॒षक् । सा॒ह्याम॒
    दास॒मार्य॒ यु॒जा सह॑स्कृतेन॒ सह॑सा॒ सह॑स्वता ॥ म॒न्युरे॒वास॑ दे॒वो म॒न्युर् होता॒ वरु॑णो जा॒तवे विँश॑
    ईलते॒ मानु॑षी॒र्याः पा॒हि नो मन्यो॒ तप॑सा स॒जोषाः न्तप॑सा यु॒जा वि ज॑हि शत्रू न् । अ॒मि॒त्र॒हा वृ॑त्र॒हा
    द॑स्यु॒हा च॒ विश्वा॒ वसू॒न्या भ॑रा॒ त्व अभिमातिषा॒हः । वि॒श्वच॑र् वान॒स्मास्वोजः॒ पृत॑नासु धेहि ॥
    तो अस्मि॒ तव॒ क्रत्वा तवि॒षस्य॑ प्रचेतः । त मन्यो अक्र॒तुर्जि॑हीला॒हं स्वात॒नूर्ब॑ल॒देया अ॒स्म्युप॒
    मेह्य॒र्वाङ् प्र॑तीची॒न स्स॑हुरे विश्वधायः । मन्यो वज्रिन्न॒भि मामा व॑वृत्स्वहना ॥ अ॒भि प्रेहि॑ दक्षिण॒तो
    भ॑वा॒ मे वृ॒त्राणि॑ जङ्घनाव॒ भूरि॑ । जु॒होमि॑ ते ध॒रुण॒ म्मध्वो॒ अग्र॑मुभा उ॑पां॒शु प्र॑थ॒मा पि॑बाव
    ॥ मन्यो स॒रथ॑मारु॒जन्तो॒ हर् ष॑माणासो धृषि॒ता म॑रुत्वः । ति॒ग्मेष॑व॒ आयु॑धा सं॒शिशा ॥ अ॒ग्निरि॑व मन्यो
    त्विषि॒त स्स॑हस्व सेना॒नीर्नः॑ सहुरे हू॒त ए धि । ह॒त्वाय॒ शत्रू॒न् वि भ॑जस्व॒ वेद॒ ओजो॒ मिमा ॥ सह॑स्व
    मन्यो अ॒भिमा न॒न्वा रु॑रुध्रे व॒शी वश बहू॒नाम॑सि मन्यवीलि॒तो विशं युँ॒धये॒ सं शि॑शाधि । अकृ॑त्तरु॒
    ॥ वि॒जे॒ष॒कृदिन्द्र॑ इवानवब्र॒वो॒ म्मन्यो अधि॒पा भ॑वे॒ह न्ते॒ नाम॑ सहुरे गृणीमसि वि॒द्मातमुत्सं॒ त्या
    सह॒जा व॑ज्र सायक॒ सहो ष्यभिभूत॒ उत्त॑रम् । क्रत्वा धि महाध॒नस्य॑ पुरुहूत सं॒सृजि॑ ॥ वँरु॑णश्च म॒न्युः
    । भिय॒ ना॒ हृद॑येषु॒ शत्र॑वः॒ परा जितासो॒ अप॒ निल॑यन्ताम् ॥ ॥ धन्व॑ना॒ गा धन्व॑ना॒जिञ्ज॑येम॒ धन्व॑ना
    ती॒व्रा ङ्कृ॑णोति॒ धन्व॑ना॒ सर्वाः जयेम ॥ ॐ शान्ता॑ पृथिवी शि॑वम॒न्तरिक्ष॒ ऽभ॑यन्नो अस्तु । शि॒वा॒
    दिशः॑ प्र॒दिश॑ उ॒द्दिशो वि॒श्वतः॒ परि॑पान्तु स॒र्वत॒
