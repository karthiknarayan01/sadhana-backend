id: pramodakritamshivastotram
category: stotram
name:
  english: pramodakritamshivastotram
  devanagari: प्रमोदकृतंशिवस्तोत्रम्
content:
  english: pramodakritam shivastotram pramoda uvaca | prayah prapannartiharo'si natha prapannasarvendriyavrittibhajam
    | amuktasannidhyakaro budhanam atastvadanyam sharanam na pashye || 114|| pravatashilah prahateshu
    nityam prasiddhametadvavacanam trayishu | anarcato me kripanasya shambho kripakaro'yam tadaho vicitram
    || 115|| upeyushameva tanoti kamam suradrumashrotra katham na drishtam | padaravindo'nusmarano'nutapi
    dure mamanugrahakridvicitram || 116|| pavitritam janma jagattrayo yattvaya kripalocanapatitasya |
    mamadhuna mangalapunyapurna svayam samanandasusampado yat || 117|| namah shivaya ca shubhahetuhetave
    sudhamshucudamanaye namo namah | nagatmaja''lingitacarumurtaye sahasrakritvah pranato'smi nityam ||
    118|| girisha vishveshadhuna punihi punyena kripakshivarcasa ca | puratrayadhvamsanapunjitashrih kimadbhutam
    bhuruhamatratakshanam || 119|| vrishanka vishvadhika bharga te padambujaradhanabhagyadayina | vilokanenashu
    vilokayadhuna prapannamenam janamartibhanjana || 120|| shambho tavalam janitanilabhagadheyamante vicintayati
    vishvamidam samastam | tvayyadbhutamadhuna tarumatradahalilavilasakopabharaddayalo || 121|| prasida
    mayi santatam pramathanathagathetara pravaha karunambudhe pranatibhati papahan | akalavilayagamavyasanashankushankavata
  devanagari: प्रमोदकृतं शिवस्तोत्रम् प्रमोद उवाच । प्रायः प्रपन्नार्तिहरोऽसि नाथ प्रपन्नसर्वेन्द्रियवृत्तिभाजाम्
    । अमुक्तसान्निध्यकरो बुधानां अतस्त्वदन्यं शरणं न पश्ये ॥ ११४॥ प्रवातशीलः प्रहतेषु नित्यं प्रसिद्धमेतद्ववचनं
    त्रयीषु । अनर्चतो मे कृपणस्य शम्भो कृपाकरोऽयं तदहो विचित्रम् ॥ ११५॥ उपेयुषामेव तनोति कामं सुरद्रुमश्रोत्र
    कथं न दृष्टम् । पादारविन्दोऽनुस्मरणोऽनुतापी दूरे ममानुग्रहकृद्विचित्रम् ॥ ११६॥ पवित्रितं जन्म जगत्त्रयो
    यत्त्वया कृपालोचनपातितस्य । ममाधुना मङ्गलपुण्यपूर्णा स्वयं समानन्दसुसम्पदो यत् ॥ ११७॥ नमः शिवाय च
    शुभहेतुहेतवे सुधांशुचूडामणये नमो नमः । नगात्मजाऽऽलिङ्गितचारुमूर्तये सहस्रकृत्वः प्रणतोऽस्मि नित्यम्
    ॥ ११८॥ गिरीश विश्वेशाधुना पुनीहि पुण्येन कृपाक्षिवर्चसा च । पुरत्रयध्वंसनपुञ्जितश्रीः किमद्भुतं भूरुहमात्रतक्षणम्
    ॥ ११९॥ वृषाङ्क विश्वाधिक भर्ग ते पादाम्बुजाराधानभाग्यदायिना । विलोकनेनाशु विलोकयाधुना प्रपन्नमेनं
    जनमार्तिभञ्जन ॥ १२०॥ शम्भो तवालं जनितानिलभागधेयमन्ते विचिन्तयति विश्वमिदं समस्तम् । त्वय्यद्भुतामधुना
    तरुमात्रदाहलीलाविलासकोपभराद्दयालो ॥ १२१॥ प्रसीद मयि सन्ततं प्रमथनाथगाथेतर प्रवाह करुणाम्बुधे प्रणतिभाति
    पापाहन् । अकालविलयागमव्यसनशङ्कुशङ्कावता
