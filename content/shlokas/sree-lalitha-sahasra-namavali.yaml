  devanagari: ॥ ध्यानम् ॥ सिन्दूरारुणविग्रहां त्रिनयनां माणिक्यमौलिस्फुरत् तारानायकशेखरां स्मितमुखीमापीनवक्षोरुहाम्
    । पाणिभ्यामलिपूर्णरत्नचषकं रक्तोत्पलं बिभ्रतीं सौम्यां रत्नघटस्थरक्तचरणां ध्यायेत्परामम्बिकाम् ॥ अरुणां
    करुणातरङ्गिताक्षीं धृतपाशाङ्कुशपुष्पबाणचापाम् । अणिमादिभिरावृतां मयूखैरहमित्येव विभावये भवानीम् ॥
    ध्यायेत् पद्मासनस्थां विकसितवदनां पद्मपत्रायताक्षीं हेमाभां पीतवस्त्रां करकलितलसद्धेमपद्मां वराङ्गीम्
    । सर्वालङ्कारयुक्तां सततमभयदां भक्तनम्रां भवानीं श्रीविद्यां शान्तमूर्तिं सकलसुरनुतां सर्वसम्पत्प्रदात्रीम्
    ॥ सकुङ्कुमविलेपनामलिकचुम्बिकस्तूरिकां समन्दहसितेक्षणां सशरचापपाशाङ्कुशाम् । अशेषजनमोहिनीमरुणमाल्यभूषाम्बरां
    जपाकुसुमभासुरां जपविधौ स्मरेदम्बिकाम् ॥ ॥अथ श्री ललिता सहस्रनामावली ॥ ॐ ॐ ऐं ह्रीं श्रीं श्रीमात्रे
