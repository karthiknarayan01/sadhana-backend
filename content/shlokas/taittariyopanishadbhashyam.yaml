id: taittariyopanishadbhashyam
category: upanishad
name:
  english: taittariyopanishadbhashyam
  devanagari: तैत्तरीयोपनिषद्भाष्यम्
content:
  english: '|| bhisha bhayenasmadvatah pavate| bhishodeti suryah bhishasmadagnishcendrashca mrityurdhavati
    pancama iti| vatadayo hi maharhah svayamishvarah santah pavanadikaryeshvayasabahuleshu niyatah pravartante|
    tadyuktam prashastari sati yasmanniyamena tesham pravartanam| tasmadasti bhayakaranam tesham prashastri
    brahri| yataste bhritya iva rajno''smadbrahrino bhayena pravartante| tacca bhayakaranamanandam brahri|
    tasyasya brahrina anandasyaisha mimamsa vicarana bhavati| kimanandasya mimamsyamityucyate| kimanando
    vishayavishayisambandhajanito laukikanandavadahosvit svabhavika ityevameshanandasya mimamsa| tatra
    laukika anando bahraddhyatmikasadhanasampattinimitta utkrishtah| sa ya esha nirdishyate brahrianandanugamartham|
    anena hi prasiddhenanandena vyavrittavishabuddhigamya anando''nugantum shakyate| laukiko''pyanandobrahrianandasyaiva
    matra avidyaya tiraskriyamane vijnana utkrishyamanayam cavidyayam brahriadibhih karmavashadyathavijnanam
    vishayadisadhanasambandhavashacca vibhavyamanashca loke''navasthito laukikah sampadyate| sa evavidyakamakarmapakarshena
    manushyagandharvadyuttarottarabhumishvakamahatavidvatcchrotriyapratyaksho vibhavyate shatagunottarottarotkarshena
    yavaddhiranyagarbhasya brahrina ananda iti| niraste tvavidyakrite vishayavishayivibhage vidyaya svabhavikah
    paripurna eka anando''dvaito bhavatityetamartham vibhavayishyannaha| yuva prathamavayah| sadhuyuveti
    sadhushcasau yuva ceti yuno visheshanam| yuvapyasadhurbhavati sadhurapyayuvato visheshanam yuva syatsadhuyuveti|
    adhyayako''dhitavedah| ashishtha ashastritamah| dridhishtho dridhatamah| balishtho balavattamah| evamadhyatmikasadhanasampannah|
    tasyeyam prithivyurvi sarva vittasya vittenopabhogasadhanena drishtarthenadrishtarthena ca karmasadhanena
    sampanna purna raja prithivipatirityarthah| tasya ca ya anandah sa eko manusho manushyanam prakrishta
    eka anandah| te ye shatam manusha anandah sa eko manushyagandharvanamanandah| manushanandacchatagunenotkrishto
    manushyagandharvanamanando bhavati| manushyah santah karmavidyavisheshadgandharvatvam prapta manushyagandharvah|
    te hrantardhanadishaktisampannah sukshmakaryakaranah| tasmatpratighatalpatvam tesham dvandvapratighatashaktisadhanasampattishca|
    tato''pratihanyamanasya pratikaravato manushyagandharvasya syaccittaprasadah| tatprasadavisheshatsukhavisheshabhivyaktih|
    evam purvasyah purvasya bhumeruttarasyamuttarasyam bhumau prasadavisheshatah shatagunenanandotkarsha
    upapadyate| prathamam tvakamahatagrahanam manushyavishayabhogakamanabhihatasya shrotriyasya manushyanandacchatagunenanandotkarshau
    manushyagandharvena tulyo vaktavya ityevamartham| sadhuyuvadhyayaka iti shrotriyatvavrijinatve grihrete|
    te hravishishte sarvatra| akamahatatvam tu vishayotkarshakarshatah sukhotkarshapakarshaya visheshyate|
    ato''kamahatagrahanam'
  devanagari: ।। भीषा भयेनास्माद्वातः पवते। भीषोदेति सूर्यः भीषास्मादग्निश्चेन्द्रश्च मृत्युर्धावति पञ्चम
    इति। वातादयो हि महार्हाः स्वयमीश्वराः सन्तः पवनादिकार्येष्वायासबहुलेषु नियताः प्रवर्तन्ते। तद्युक्तं
    प्रशास्तरि सति यस्मान्नियमेन तेषां प्रवर्तनम्। तस्मादस्ति भयकारणं तेषां प्रशास्तृ ब्राहृ। यतस्ते भृत्या
    इव राज्ञोऽस्माद्ब्राहृणो भयेन प्रवर्तन्ते। तच्च भयकारणमानन्दं ब्राहृ। तस्यास्य ब्राहृण आनन्दस्यैषा
    मीमांसा विचारणा भवति। किमानन्दस्य मीमांस्यमित्युच्यते। किमानन्दो विषयविषयिसंबन्धजनितो लौकिकानन्दवदाहोस्वित्
    स्वाभाविक इत्येवमेषानन्दस्य मीमांसा। तत्र लौकिक आनन्दो बाह्राद्ध्यात्मिकसाधनसंपत्तिनिमित्त उत्कृष्टः।
    स य एष निर्दिश्यते ब्राहृानन्दानुगमार्थम्। अनेन हि प्रसिद्धेनानन्देन व्यावृत्तविषबुद्धिगम्य आनन्दोऽनुगन्तुं
    शक्यते। लौकिकोऽप्यानन्दोब्राहृानन्दस्यैव मात्रा अविद्यया तिरस्क्रियमाणे विज्ञान उत्कृष्यमाणायां चाविद्यायां
    ब्राहृादिभिः कर्मवशाद्यथाविज्ञानं विषयादिसाधनसंबन्धवशाच्च विभाव्यमानश्च लोकेऽनवस्थितो लौकिकः संपद्यते।
    स एवाविद्याकामकर्मापकर्षेण मनुष्यगन्धर्वाद्युत्तरोत्तरभूमिष्वकामहतविद्वत्च्छ्रोत्रियप्रत्यक्षो विभाव्यते
    शतगुणोत्तरोत्तरोत्कर्षेण यावद्धिरण्यगर्भस्य ब्राहृण आनन्द इति। निरस्ते त्वविद्याकृते विषयविषयिविभागे
    विद्यया स्वाभाविकः परिपूर्ण एक आनन्दोऽद्वैतो भवतीत्येतमर्थं विभावयिष्यन्नाह। युवा प्रथमवयाः। साधुयुवेति
    साधुश्चासौ युवा चेति यूनो विशेषणम्। युवाप्यसाधुर्भवति साधुरप्ययुवातो विशेषणं युवा स्यात्साधुयुवेति।
    अध्यायकोऽधीतवेदः। आशिष्ठ आशास्तृतमः। दृढिष्ठो दृढतमः। बलिष्ठो बलवत्तमः। एवमाध्यात्मिकसाधनसंपन्नः।
    तस्येयं पृथिव्युर्वी सर्वा वित्तस्य वित्तेनोपभोगसाधनेन दृष्टार्थेनादृष्टार्थेन च कर्मसाधनेन संपन्ना
    पूर्णा राजा पृथिवीपतिरित्यर्थः। तस्य च य आनन्दः स एको मानुषो मनुष्याणां प्रकृष्ट एक आनन्दः। ते ये
    शतं मानुषा आनन्दाः स एको मनुष्यगन्धर्वाणामानन्दः। मानुषानन्दाच्छतगुणेनोत्कृष्टो मनुष्यगन्धर्वाणामानन्दो
    भवति। मनुष्याः सन्तः कर्मविद्याविशेषाद्गन्धर्वत्वं प्राप्ता मनुष्यगन्धर्वाः। ते ह्रन्तर्धानादिशक्तिसंपन्नाः
    सूक्ष्मकार्यकरणाः। तस्मात्प्रतिघाताल्पत्वं तेषां द्वन्द्वप्रतिघातशक्तिसाधनसंपत्तिश्च। ततोऽप्रतिहन्यमानस्य
    प्रतीकारवतो मनुष्यगन्धर्वस्य स्याच्चित्तप्रसादः। तत्प्रसादविशेषात्सुखविशेषाभिव्यक्तिः। एवं पूर्वस्याः
    पूर्वस्या भूमेरुत्तरस्यामुत्तरस्यां भूमौ प्रसादविशेषतः शतगुणेनानन्दोत्कर्ष उपपद्यते। प्रथमं त्वकामहताग्रहणं
    मनुष्यविषयभोगकामानभिहतस्य श्रोत्रियस्य मनुष्यानन्दाच्छतगुणेनानन्दोत्कर्षौ मनुष्यगन्धर्वेण तुल्यो वक्तव्य
    इत्येवमर्थम्। साधुयुवाध्यायक इति श्रोत्रियत्वावृजिनत्वे गृह्रेते। ते ह्रविशिष्टे सर्वत्र। अकामहतत्वं
    तु विषयोत्कर्षाकर्षतः सुखोत्कर्षापकर्षाय विशेष्यते। अतोऽकामहतग्रहणम्
