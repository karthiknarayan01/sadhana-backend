id: hanumaccaturvimshatih
category: stotram
name:
  english: hanumaccaturvimshatih
  devanagari: हनुमच्चतुर्विंशतिः
content:
  english: dhya | vyudapatadashu hi pushkaramadatum naumi tam samirasutam || 1|| yasmai bhagavanbrahma
    prayacchadvayutriptaye purvam | vividhanvaranvaramstam vande durjneyadivyamahimanam || 2|| surasavadanam
    vipulam tarasa gatva vinirgatam drishtva | yam suranikara vismayamajagmurnaumi tam mahaprajnam ||
    3|| lankapuradhidaivatagarvam vegaccapetikadanat | nirmulam yashcakre vande tam vayusunumamitabalam
    || 4|| goshpadavatsaritamnidhimullanghyashokavipinagam sitam | adrakshidbhayarahito yastam pranamami
    shimshupamule || 5|| ramadeshashravananandaduddhutashokagandham yah | sitam cakre matimamstamaham
    pranamami shokavicchittyai || 6|| yo'kshakumarapramukhan pravarandanujanjaghana kutukena | ekah sahayarahitastamaham
    pranamami gandhavahasunum || 7|| prapya manim sitayah kananamasurasya satvaram bhanktva | dagdhva
    lankam yo'gadraghuvaranikatam sa mamavatu || 8|| sitaproditavacananyasheshato yo nivedya raghuviram
    | cakre cintarahitam vande tam cintitarthadam namatam || 9|| samare vakshasi yena prahatah sammurchitah
    sasamjno'tha | prashashamsa ravano yam tamatibalanandavardhanam naumi || 10|| oshadhigirimativegadgatva''niya
    pravriddhadivyatanuh | yo lakshmanasudanam cakre tam naumi garudanibhavegam || 11|| raghupatimukharavindasravadagamashirshatattvamakarandam
    | apiyagalamanisham nandantam naumi pavanamuladhanam || 12|| kanakadrisadrishakayam kanakapradamashu
    namrajanapankteh | raktambujasyamide saktantahkaranaminakulottamse || 13|| karunyajanmabhumim kakutsthanghryabjapujanasaktam
    | kalahitabhayarahitam kamaviduram namami kapimukhyam || 14|| kundalabhasikapolam mandalamanghripranamrajantunam
    | kurvantamipsitarthaih sarvairyuktam bhaje'njanasunum || 15|| nayanajitahemagarvam nayanayaparinamanjanatanayam
    | gativijitajanakakirtim matimatinishitam dadanamahamide || 16|| purato bhava karunabdhe bharatagracaranalagnacittabja
    | hara mama nikhilam cintam karajitapathoja kalitavaturupa || 17|| ravisutamantrivarenyam pavitadanasahanadakshadivyahanum
    | kavishishyaharanacaturam savitrivineyam namami vatasutam || 18|| vakshastaditashailam rakshahpatisainyamardanapravanam
    | rakshakaram namasyamyakshadhipadutamanilapunyacayam || 19|| suradeshikasadrishagiram karajairhirasya
    kathinatagarvam | narasha
  devanagari: ध्या । व्युदपतदाशु हि पुष्करमादातुं नौमि तं समीरसुतम् ॥ १॥ यस्मै भगवान्ब्रह्मा प्रायच्छद्वायुतृप्तये
    पूर्वम् । विविधान्वरान्वरांस्तं वन्दे दुर्ज्ञेयदिव्यमहिमानम् ॥ २॥ सुरसावदनं विपुलं तरसा गत्वा विनिर्गतं
    दृष्ट्वा । यं सुरनिकरा विस्मयमाजग्मुर्नौमि तं महाप्राज्ञम् ॥ ३॥ लङ्कापुराधिदैवतगर्वं वेगाच्चपेटिकादानात्
    । निर्मूलं यश्चक्रे वन्दे तं वायुसूनुममितबलम् ॥ ४॥ गोष्पदवत्सरितांनिधिमुल्लङ्घ्याशोकविपिनगां सीताम्
    । अद्राक्षीद्भयरहितो यस्तं प्रणमामि शिंशुपामूले ॥ ५॥ रामादेशश्रवणानन्दादुद्धूतशोकगन्धां यः । सीतां
    चक्रे मतिमांस्तमहं प्रणमामि शोकविच्छित्त्यै ॥ ६॥ योऽक्षकुमारप्रमुखान् प्रवरान्दनुजाञ्जघान कुतुकेन
    । एकः सहायरहितस्तमहं प्रणमामि गन्धवहसूनुम् ॥ ७॥ प्राप्य मणिं सीतायाः काननमसुरस्य सत्वरं भङ्क्त्वा
    । दग्ध्वा लङ्कां योऽगाद्रघुवरनिकटं स मामवतु ॥ ८॥ सीताप्रोदितवचनान्यशेषतो यो निवेद्य रघुवीरम् । चक्रे
    चिन्तारहितं वन्दे तं चिन्तितार्थदं नमताम् ॥ ९॥ समरे वक्षसि येन प्रहतः संमूर्छितः ससंज्ञोऽथ । प्रशशंस
    रावणो यं तमतिबलानन्दवर्धनं नौमि ॥ १०॥ ओषधिगिरिमतिवेगाद्गत्वाऽऽनीय प्रवृद्धदिव्यतनुः । यो लक्ष्मणासुदानं
    चक्रे तं नौमि गरुडनिभवेगम् ॥ ११॥ रघुपतिमुखारविन्दस्रवदागमशीर्षतत्त्वमकरन्दम् । आपीयागलमनिशं नन्दन्तं
    नौमि पवनमूलधनम् ॥ १२॥ कनकाद्रिसदृशकायं कनकप्रदमाशु नम्रजनपङ्क्तेः । रक्ताम्बुजास्यमीडे सक्तान्तःकरणमिनकुलोत्तंसे
    ॥ १३॥ कारुण्यजन्मभूमिं काकुत्स्थाङ्घ्र्यब्जपूजनासक्तम् । कालाहितभयरहितं कामविदूरं नमामि कपिमुख्यम्
    ॥ १४॥ कुण्डलभासिकपोलं मण्डलमङ्घ्रिप्रणम्रजन्तूनाम् । कुर्वन्तमीप्सितार्थैः सर्वैर्युक्तं भजेऽञ्जनासूनुम्
    ॥ १५॥ नयनजितहेमगर्वं नयनयपारीणमञ्जनातनयम् । गतिविजितजनककीर्तिं मतिमतिनिशितां ददानमहमीडे ॥ १६॥ पुरतो
    भव करुणाब्धे भरताग्रचरणलग्नचित्ताब्ज । हर मम निखिलां चिन्तां करजितपाथोज कलितवटुरूप ॥ १७॥ रविसुतमन्त्रिवरेण्यं
    पविताडनसहनदक्षदिव्यहनुम् । कविशिष्यहरणचतुरं सवितृविनेयं नमामि वातसुतम् ॥ १८॥ वक्षस्ताडितशैलं रक्षःपतिसैन्यमर्दनप्रवणम्
    । रक्षाकरं नमस्याम्यक्षाधिपदूतमनिलपुण्यचयम् ॥ १९॥ सुरदेशिकसदृशगिरं करजैर्हीरस्य कठिनतागर्वम् । नरश
