id: kyts-2-4-deva-manushyah-pitarah-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 2.4 Deva Manushyah Pitarah - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ndvitiyakande caturthah prashnah shri gurubhyo namah
    | harih om || deva manushyah 'nyata asannasura rakshagmsi pishacaste ndevanamuta yadalpam drakshagmsi
    ratribhirasubhna tte deva aviduryo vai no mmriyate rakshagmsi va ima nghnantiti te rakshagsyupamantrayanta
    tanyabruvan dasuran jayama tannah sahasaditi tato vai deva asuranajaya 'suran jitvarakshagsyapanudanta
    tani rakshagsyanritama karteti samanta nte deva agnavanathanta te 'gnaye pravate purodashamashtakapala
    nniravapannagnaye vibadhavate 'gnaye pratikavate yadagnaye pravate niravapan syasantani tena pranudanta
    yadagnaye vibadhavate yanyevabhito rakshagsyasa ntani tena vyabadhanta yadagnaye pratikavate yanyeva
    pashca ntani tenapanudanta tato deva abhava nparasura yo bhratrivyavan thsa spardhamana etayesh tya
    yajetagnaye pravate purodashamashtakapala nnirvapedagnaye vibadhavate agnaye pratikavate 'gnaye pratikavate
    yadagnaye pravate nirvapati ya evasmacchreyan ntena pranudate yadagnaye vibadhavate ya evainena sadrinta
    ntena vi badhate yadagnaye pratikavate ya evasma ntenapa nudate pra shreyagmsa mpapiyanapnoti ya evam
    ~vidvanetayesh vapedagnaye vibadhavata nte deva abruvan yo no viryavattamastamanu samarabhamaha iti
    ta indramabruva vai~ no viryavattamo 'si tvamanu samarabhamaha iti so ttisro ma imastanuvo viryavatistah
    prinitatha suranabhi bhavishyatheti ta vai bruhityabruvanniyamagm homugiyam tyabravitta indrayagm
    homuce purodashamekadashakapala nniravapannindraya vaimridhaye ndrayendriyavate yadindrayagm homuce
    niravapannagmhasa eva tenamucyanta yadindraya vai mridhaya mridha eva tenapa ghnatayadindrayendriyavata
    indriyameva tena ''tmannadadhata trayastrigmshatkapala ntrayastrigmshadvai devatasta indra atmannanu
    samarabham rvyajayantayo bhratrivyavanth thsa spardhamana etayesh tya yajetendrayagm homuce purodashamekadashakapala
    nnirvapedindraya vaimridhayendrayendriyavate 'gm hasa va esha grihito yasmacchreya nbhratrivyoyadindrayagm
    homuce nirvapatyagmhasa eva tena mucyatemridha va esho 'bhratrivyo yadindraya vaimridhaya mridha eva
    tenapa hateyadindrayendriyavata indriyameva tenatma ndhatte trayastrigmshatkapala nnirvapati trayastrigmshadvai
    devatasta eva yajamana atmannanu samarabham ya~te bhutyai sa va esha vijitirnameshtirya evam tya yajata
    uttamameva vijiti mbhratrivyena vi jayate || ngayatryojo balamindriyam thsagrimhya ''daya va iyamupavarthsyati
    ta ida mbhavishyantiti tam vya~hvayanta vishvakarmanniti deva dabhityasura nopavartata te deva eta
    'si vishvamasi vishvayu ssarvamasi sarvayurabhibhuriti vava deva asuranamojo balamindriyam dgayatryapakramyatishtha
    ngayatritishtimahu va~thsaro vai gayatri sam va~thsaro vai tadapakramyatishtha dyadetaya deva asuranamojo
    balamindriyam navrinjata tasmadetagm sam va~rga itishtimahuryo bhratrivyavanth thsaspardhamana etayesh
    tya yajetagnaye sam va~rgaya purodashamashtakapala tagmshritamasannametena yajusha 'bhi mrishedoja
    eva balamindriyam nbhratrivyasya vrinkte bhavatyatmana para sya bhratrivyo bhavati || taya deva asuranamojo
    balamindriyam prajapatih praja asrijata ta asma thsrishtah paraciraya ntato garmududatishtha tta brihaspatishcanvavaitagm
    so tva pratishthanyatha tva praja upavarthsyantiti ta ttato vai prajapati mpraja upavartanta yah prajakama
    meva svena bhagadheyenopa dhavati sa evasmai mprajanayatiprajapatih pashunasrijata te ntato garmududatishtha
    npusha canvavaitagm so 'naya ma pratishthatha tva pashava upavarthsyantiti ma mpratishtheti somo akrishtapacyamityubhau
    akrishtapacyamityubhau va mpratishthanityabravi ttato vai prajapati mpashava upavartanta yah pashukama
    ttasma etagm somapaushna thsomapushanaveva svena bhagadheyenopa dhavati tavevasmai pashu ssomo vai
    retodhah pusha pashuna mprajanayita soma evasmai reto dadhati pusha pashu agne gobhirna a gahindo
    push tya jushasva nah | indro dharta griheshu nah || savita ya ssa no griheshu raranat | a pusha etva
    vasu || dhata dadatu no rayimishano jagataspatih | sa nah purnena vavanat || tvashta yo vrishabho
    vrisha sa no griheshu raranat | sahasrenayutena ca || yena deva amrita shravo divyairayanta | shravo
    divyairayanta | rayasposha tvamasmabhya njivasa a yuvasva || agni rgrihapati ssomo vishvavanih savita
    sumedha || agne grihapate yaste ghrityo bhagastena saha oja akramamanaya dhehi shraish mmurdha bhuyasagg
    svaha citraya yajeta pashukama iyam vai~ citra yadva asyam mbhutamadhi prajayate te neyancitra ya
    evam shcitraya pashukamo yajate pra prajaya pashubhi rmithunai rjayate praivagneyena vapayati retah
    saumyena dadhati reta eva hita ntvashta rupani vi karotisarasvatau bhavata etadvai daivya mmaddhyato
    dadhati push prajananaya sinivalyai carurbhavati vagvai sinivali pushtih khalu vai vakpushtimeva vacamupai
    tyaindra uttamo bhavati tenaiva tanmithunagm saptaitani havigmshi bhavanti sapta gramyah pashavah
    saptaranya ssapta chandagsyu varuddhya athaita ahuti rjuhotyete vai devah pushtipatayasta eva smi
    ndadhati pushyati prajaya pashubhiratho yadeta ahuti rjuhoti pratishthityai || marutamasi marutamojo
    mbhindhi ramayata maruta vri~shanagm suvriktim || yena shardha ugramava srishtameti tadashvina pari
    dhattagg svasti | purovato var svaha 'nashanyavasphurjan thsvaha 'tiratram thsvaha bahu hayamavrishaditi
    shrutaravri thsvaha ''tapati var thsvaha 'vasphurjan thsvahamanda vasha shshundhyurajirah | jyotishmati
    ssuphenah | mitrabhritah 'vata ||vrishno ashvasya sandanamasi vrish tyai tvopa nahyami || deva vasavya
    agne soma surya || deva shsharmanya mitravaruna nnapadashuhemann | udno dattodadhi mbhintta divah
    parjanyadantarikshat prithivyastato no vrish 'vata || diva cittamah krinvanti parjanyeno davahena
    | prithivim dvyundanti || aya nnarah sudanavo dadashushe divah koshamacucyavuh | vi parjanya ssrijanti
    rodasi anu dhanvana yanti vrishtayah || udirayatha maruta shayatha purishinah | na vo dasra upa dasyanti
    dhenava ya~tamanu ratha avrithsata || srija vrishti mprina || abja asi prathamaja balamasi samudriya
    m || unnambhaya prithivi nnabhah | udno divyasya no dehishano visrija driti m || ye deva divibhaga
    ye 'ntariksha bhaga ye prithivi bhagah | ta imam ya~jnamavantu ta ida nkshetrama vishantu ta ida nkshetramanu
    vi vishantu || marutamasi marutamoja iti krishnam mpari dhatta etadvai vrish tyai rupagm sarupa eva
    bhutva parjanyam shshyenamayinamiti pashcadvata mprati mivati purovatameva janayati varshasya varuddhyai
    vatanamani juhoti vayurvai vrish tya ishe vayumeva svena bhagadheyenopa dhavati sa evasmai parjanyam
    juhoti catasro vai juhoti catasro vai dishashcatasro 'vantaradisha digbhya eva vrishtigm sa mpra cyavayati
    krishnajine sam yau~ti havirevakarantarvedi sam yau~tya varuddhyai yatinamadyamananagm shirshani para
    'patante kharjura abhavan teshagm rasa urdhvo thsaumyani vai karirani saumya khalu va ahuti rdivo
    vrishti ncyavayati yatkarirani bhavanti ''hutya divo vrishtimava rundhe madhusha sam va~ esha oshadhinagm
    raso yanmaddhvadbhya evaushadhibhyo var shatyatho adbhya evaushadhibhyo vrishtini nnayati manda vasha
    iti sam yau~ti namadheyairevaina acchaityatho yatha bruyadasa vehityevamevaina namadheyaira cyavayati
    vrishno cyavayati vrishno ashvasya sandanamasi vrish tyai tvopa nahyamityaha vrisha va ashvo vrisha
    parjanyah krishna iva khalu vai bhutva var shati rupenaivainagm samardhayati varshasya varuddhyai
    || kanna trigmshacca ssapitaya itya baddhnati devatabhirevanvaham vri~shtimicchati yadi var tavatyeva
    hotavyam shecchvo bhute havirnirvapedahoratre vai mitravarunavahoratrabhya nkhalu vai parjanyo var
    va~ hi diva va var shati mitravarunaveva svena bhagadheyenopa dhavati tavevasma 'gnaye dhamacchade
    purodashamashtakapala nnirvapenmarutagm saptakapalagm sauryamekakapalamagnirva ito vrishtimudirayati
    marutah srishta nnayanti yada khalu va asavadityo nyam rashmibhih paryavartate shatidhamacchadiva
    khalu vai bhutva var shatyeta vai devata vrish tya ishate ta eva svena bhagadheyenopa dhavati ta bhagadheyenopa
    dhavati tah evasmai parjanyam shatyeva srija vrishti mprinetyahemashcaiva ssamardhayatyatho abhireva
    tyabja asi prathamaja balamasi samudriyamityaha yathayajurevaita mbhaya prithivimiti var njuhotyesha
    va oshadhinam vri~shtivanistayaiva vrishtima cyavayati ye deva divibhaga iti krishnajinamava dhunotima
    evasmai lokah prita abhishta bhavanti || sarvani chandagsyetasya strishtubho va etadviryam tkakudushniha
    jagatyai yadushniha kakubhavanvaha tenaiva sarvani chandagsyava rundhe gayatri va esha yadushniha
    yani catvaryaddhyaksharani catushpada eva te pashavoyatha purodashe purodasho ricyaddhyaksharani yajjagatya
    ttrishtubha pari dadhatindriyam ntrishtugindriya eva virye yajna mpratishthapayati nanta ngamayatyagne
    tri te vajina tri shadhastheti trivatya pari dadhati sarupatvaya sarvo va esha yajno ya kamaya prayujyate
    sarve bhyo yajnah prayujyate traidhataviyena yajetabhicaran ttraidhataviyagm sarvenaivainam ya~jnenabhi
    carati strinuta evainametayaiva yajetabhicaryamana ssarvo va esha yajno ya ttraidhataviyagm sarvenaiva
    yajnena yajate nainamabhicara thstrinuta etayaiva yajeta sahasrena yakshyamanah prajatamevaina ddadatyetayaiva
    yajeta sahasrenejano ssahasrena yajate prajapatih khalu vai pashunasrijata tag straidhataviyenapashukamo
    yajate yasmadeva yoneh prajapatih pashunasrijata tasmadevaina thsrijata upainamuttaragm sahasra bhyo
    va esha a vrishcyate yo yakshya ityuktva na yajate traidhataviyena yajeta sarvo va esha yajno ttraidhataviyagm
    sarvenaiva yajnena yajate na devata bhya a vrishcyate dvadashakapalah purodasho bhavati te trayashcatushkapala
    strishshamriddhatvaya trayah purodasha bhavanti traya ime loka esham lo~kanamaptya uttara nbhavatyevamiva
    hime loka yavamayo maddhya etadva antarikshasya rupagm samriddhyai sarveshamabhigamayannava dyatyachabantkaragm
    hiranya ndadati pashunevava rundhe dhenu ndadatyashisha evava rundhe samno va esha varno yaddhiranyam
    ntarpyamukthamadana ndhenuretaneva sarvan tvashta hataputro vindragm somama ttasminnindra upahavamai
    'vadhiriti sa yajnaveshasa nkritva prasaha somamapiba ttasya yadatyashishyata ta ''havaniyamupa pravartaya
    thsvahendrashatrurvardhasveti sa yavadurdhvah paraviddhyati tavati svayameva vyaramata yadi va tava
    masidyadi va tavadaddhyagnerasi thsa sambhavannagnishomavabhi samabhava thsa ishumatramishumatram
    vi~shvannavardhata sa imam dvritrasya vritratva 'bibhedapi tvashta tasmai tvashta vajramasinca ttapo
    vai sa vajra asi nnashaknodatha vai tar ranya devata ''si dvishnavehidama harishyavo yenayamidamitisa
    vishnustredha vi~nyadhatta prithivya ntritiyamantarikshe tritiya ttenendro vajramudayaccha 'bravinma
    me pra harasti va ida syamiti tadasmai prayaccha tpratyagrihnadadha meti ta dvishnuh pratyagrihna
    dasmasvindra indriya ndadhatviti yadantarikshe tritiyamasi ttenendro vajramudayaccha 'bravinma me
    praharasti va ida syamiti tadasmai prayaccha dvishnuh pratyagrihnadasmasvindra indriya ndadhatviti
    yaddivi tritiyamasi ttenendro vajramudayaccha 'bravinma me praharyenaha ntu sandadhavahai tvameva
    pravishaniti yanma mma bhunjya ityabravi ttvamevendhiya tava bhogaya tva mpravisheyamityabravi vri~trah
    pravishadudaram tkhalu vai manushyasya bhratrivyo ya ntadasmai prayacchat dvishnuh pratyagrihnadasmasvindra
    indriya ndadhatviti yattrih prayaccha ttrih pratyagrihna dvishnuranvatishthata vishnave ttasmadaindravaishnavagm
    havirbhavati yadva ida ssamani yajugmshi sahasram drajanyo yadva esho 'napobdho jayeta vritra nkamayeta
    rajanyamanapobdho jayeta vritra shcarediti tasma etamai nnirvapedaindro vai rajanyo brahma brihaspati
    rbrahmanaivaina ndama dakshina sakshadevaina navonavo bhavati jayamano nketurushasa metyagre ndevebhyo
    vidadhatyaya stirati dirghamayuh || yamaditya agmshuma pyayayanti yamakshita makshitayah pibanti |
    tena no raja varuno brihaspatira pyayayantu bhuvanasya gopah ||pracya ndishi tvamindrasi rajotodi
    'si | yatra yanti srotyasta yanti srotyastat nte dakshinato vrishabha edhi havyah || indro jayati
    na para jayata adhirajo rajasu rajayati | vishva hi bhuyah pritana abhishtirupasadyo namasyo yatha
    'sat || asyedeva praririce mahitva ndivah prithivyah paryantarikshat | svaradindro dama a vishvagu
    ssvariramatro vavakshe ranaya || abhi tva shura nonumo 'dugdha iva dhenavah | ishana ssuvardrishamishanamindra
    tasthushah || tvamiddhi havamahe sata vajasya karavah | tvam vri~treshvindra satpati nkashthasvarvatah
    || yaddyavaindrateshatagm shata mbhumiruta syuh | na tva vajrin thsahasragm surya anu na jatamashta
    rodasi || piba somamindra mandatu tva yante sushava haryashvadrih | soturbahubhyagm suyato narva ssadhamada
    indre santu tuvivajah | kshumanto yabhirmadema || udagne shucayastava njatavedasagmsapta tva harito
    rathe vahanti deva surya | shocishkesham ndevanamudagadanika ncakshurmitrasya varunasya 'pra dyavaprithivi
    antarikshagm surya atma jagatastasthusha shca || vishve deva ritavridha ritubhir havanashrutah | jushantam
    mpayah || vishve deva mme ye antarikshe ya upa dyavishtha | ye agnijihva uta va yajatra asadyasmi
    nbarhishi madayaddhvam || prajapatista yatra deva vasavya agne || harih om || || krishna yajurvediya
    taittiriya samhitaya ndvitiyakande caturthah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्द्वितीयकाण्डे चतुर्थः प्रश्नः श्री गुरुभ्यो नमः ।
    ह॒रिः॒ ओम् ॥ दे॒वा म॑नु॒ष्याः ऽन्यत॑ आस॒न्नसु॑रा॒ रक्षाग्ं॑सि पिशा॒चास्ते न्दे॒वाना॑मु॒त यदल्पं॒ द्रक्षाग्ं॑सि॒
    रात्री॑भिरसुभ्न॒ त्ते दे॒वा अ॑विदु॒र्यो वै नो॒ म्म्रि॒यते॒ रक्षाग्ं॑सि॒ वा इ॒म ङ्घ्न॒न्तीति॒ ते रक्षा॒ग्॒स्युपा॑मन्त्रयन्त॒
    तान्य॑ब्रुव॒न् दसु॑रा॒न् जया॑म॒ तन्नः॑ स॒हास॒दिति॒ ततो॒ वै दे॒वा असु॑रानजय॒ ऽसु॑रान् जि॒त्वारक्षा॒ग्॒स्यपा॑नुदन्त॒
    तानि॒ रक्षा॒ग्॒स्यनृ॑तम क॒र्तेति॑ सम॒न्त न्ते दे॒वा अ॒ग्नाव॑नाथन्त॒ ते ऽग्नये॒ प्रव॑ते पुरो॒डाश॑म॒ष्टाक॑पाल॒
    न्निर॑वपन्न॒ग्नये॑ विबा॒धव॑ते॒ ऽग्नये॒ प्रती॑कवते॒ यद॒ग्नये॒ प्रव॑ते नि॒रव॑प॒न्॒ स्यास॒न्तानि॒ तेन॒
    प्राणु॑दन्त॒ यद॒ग्नये॑ विबा॒धव॑ते॒ यान्ये॒वाभितो॒ रक्षा॒ग्॒स्यास॒ न्तानि॒ तेन॒ व्य॑बाधन्त॒ यद॒ग्नये॒
    प्रती॑कवते॒ यान्ये॒व प॒श्चा न्तानि॒ तेनापा॑नुदन्त॒ ततो॑ दे॒वा अभ॑व॒ न्परासु॑रा॒ यो भ्रातृ॑व्यवा॒न्
    थ्स स्पर्ध॑मान ए॒तयेष् ट्या॑ यजेता॒ग्नये॒ प्रव॑ते पुरो॒डाश॑म॒ष्टाक॑पाल॒ न्निर्व॑पेद॒ग्नये॑ विबा॒धव॑ते॒
    अ॒ग्नये॒ प्रती॑कवते॒ ऽग्नये॒ प्रती॑कवते॒ यद॒ग्नये॒ प्रव॑ते नि॒र्वप॑ति॒ य ए॒वास्मा॒च्छ्रेया॒न् न्तेन॒
    प्रणु॑दते॒ यद॒ग्नये॑ विबा॒धव॑ते॒ य ए॒वैने॑न स॒दृन्त न्तेन॒ वि बा॑धते॒ यद॒ग्नये॒ प्रती॑कवते॒ य ए॒वास्मा॒
    न्तेनाप॑ नुदते॒ प्र श्रेयाग्ं॑स॒ म्पापी॑यानाप्नोति॒ य ए॒वं ँवि॒द्वाने॒तयेष् वपेद॒ग्नये॑ विबा॒धव॑त
    न्ते दे॒वा अ॑ब्रुव॒न्॒ यो नो॑ वी॒र्या॑वत्तम॒स्तमनु॑ स॒मार॑भामहा॒ इति॒ त इन्द्र॑मब्रुव॒ वैँ नो॑ वी॒र्या॑वत्तमो
    ऽसि॒ त्वामनु॑ स॒मार॑भामहा॒ इति॒ सो त्ति॒स्रो म॑ इ॒मास्त॒नुवो॑ वी॒र्या॑वती॒स्ताः प्री॑णी॒ताथा सु॑रान॒भि
    भ॑विष्य॒थेति॒ ता वै ब्रू॒हीत्य॑ब्रुवन्नि॒यमग्ं॑ हो॒मुगि॒यं त्य॑ब्रवी॒त्त इन्द्रा॑याग्ं हो॒मुचे॑ पुरो॒डाश॒मेका॑दशकपाल॒
    न्निर॑वप॒न्निन्द्रा॑य वैमृ॒धाये न्द्रा॑येन्द्रि॒याव॑ते॒ यदिन्द्रा॑याग्ं हो॒मुचे॑ नि॒रव॑प॒न्नग्ंह॑स
    ए॒व तेना॑मुच्यन्त॒ यदिन्द्रा॑य वै मृ॒धाय॒ मृध॑ ए॒व तेनापा घ्नत॒यदिन्द्रा॑येन्द्रि॒याव॑त इन्द्रि॒यमे॒व
    तेना॒ ऽऽत्मन्न॑दधत॒ त्रय॑स्त्रिग्ंशत्कपाल न्त्रय॑स्त्रिग्ंश॒द्वै दे॒वता॒स्ता इन्द्र॑ आ॒त्मन्ननु॑ स॒मार॑भं
    र्व्य॑जयन्त॒यो भ्रातृ॑व्यवा॒न्थ् थ्स स्पर्ध॑मान ए॒तयेष् ट्या॑ यजे॒तेन्द्रा॑याग्ं हो॒मुचे॑ पुरो॒डाश॒मेका॑दशकपाल॒
