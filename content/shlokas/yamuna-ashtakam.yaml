id: yamuna-ashtakam
category: stotram
name:
  english: Yamuna Ashtakam
content:
  english: murarikayakalimalalamavaridharini trinikritatrivishtapa trilokashokaharini | mano'nukulakulakunjapunjadhutadurmada
    dhunotu me manomalam kalindanandini sada || || malapaharivaripurabhurimanditamrita bhrisham prapatakapravancanatipanditanisham
    | sunandanandanangasangaragaranjita hita dhunotu me manomalam kalindanandini sada || || lasattarangasangadhutabhutajatapataka
    navinamadhuridhurinabhaktijatacataka | tatantavasadasahamsasamsrita hi kamada dhunotu me manomalam
    kalindanandini sada || || vihararasakhedabhedadhiratiramaruta gata giramagocare yadiyaniracaruta |
    pravahasahacaryaputamedininadinada dhunotu me manomalam kalindanandini sada || || tarangasangasaikatancitantara
    sadasita sharannishakaramshumanjumanjarisabhajita | bhavarcanaya carunambunadhuna visharada dhunotu
    me manomalam kalindanandini sada || || jalantakelikaricaruradhikangaragini svabharturanyadurlabhangasangatamshabhagini
    | svadattasuptasaptasindhubhedanatikovida dhunotu me manomalam kalindanandini sada || || jalacyutacyutangaragalampatalishalini
    vilolaradhikakacantacampakalimalini | sadavagahanavatirnabhartribhrityanarada dhunotu me manomalam
    kalindanandini sada || || sadaiva nandanandakelishalikunjamanjula tatotthaphullamallikakadambarenusujjvala
    | jalavagahinam nrinam bhavabdhisindhuparada dhunotu me manomalam kalindanandini sada ||
  devanagari: मुरारिकायकालिमाललामवारिधारिणी तृणीकृतत्रिविष्टपा त्रिलोकशोकहारिणी । मनोऽनुकूलकूलकुञ्जपुञ्जधूतदुर्मदा
    धुनोतु मे मनोमलं कलिन्दनन्दिनी सदा ॥ ॥ मलापहारिवारिपूरभूरिमण्डितामृता भृशं प्रपातकप्रवञ्चनातिपण्डितानिशम्
    । सुनन्दनन्दनाङ्गसङ्गरागरञ्जिता हिता धुनोतु मे मनोमलं कलिन्दनन्दिनी सदा ॥ ॥ लसत्तरङ्गसङ्गधूतभूतजातपातका
    नवीनमाधुरीधुरीणभक्तिजातचातका । तटान्तवासदासहंससंसृता हि कामदा धुनोतु मे मनोमलं कलिन्दनन्दिनी सदा ॥
    ॥ विहाररासखेदभेदधीरतीरमारुता गता गिरामगोचरे यदीयनीरचारुता । प्रवाहसाहचर्यपूतमेदिनीनदीनदा धुनोतु मे
    मनोमलं कलिन्दनन्दिनी सदा ॥ ॥ तरङ्गसङ्गसैकताञ्चितान्तरा सदासिता शरन्निशाकरांशुमञ्जुमञ्जरीसभाजिता ।
    भवार्चनाय चारुणाम्बुनाधुना विशारदा धुनोतु मे मनोमलं कलिन्दनन्दिनी सदा ॥ ॥ जलान्तकेलिकारिचारुराधिकाङ्गरागिणी
    स्वभर्तुरन्यदुर्लभाङ्गसङ्गतांशभागिनी । स्वदत्तसुप्तसप्तसिन्धुभेदनातिकोविदा धुनोतु मे मनोमलं कलिन्दनन्दिनी
    सदा ॥ ॥ जलच्युताच्युताङ्गरागलम्पटालिशालिनी विलोलराधिकाकचान्तचम्पकालिमालिनी । सदावगाहनावतीर्णभर्तृभृत्यनारदा
    धुनोतु मे मनोमलं कलिन्दनन्दिनी सदा ॥ ॥ सदैव नन्दनन्दकेलिशालिकुञ्जमञ्जुला तटोत्थफुल्लमल्लिकाकदम्बरेणुसूज्ज्वला
    । जलावगाहिनां नृणां भवाब्धिसिन्धुपारदा धुनोतु मे मनोमलं कलिन्दनन्दिनी सदा ॥
