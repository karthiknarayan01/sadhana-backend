id: kyts-3-4-vi-vaa-etasya-yagnah-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 3.4 Vi Vaa Etasya Yagnah - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ntritiyakande caturthah prashnah shri gurubhyo namah
    | harih om || vi va etasya yajna riddhyate yasya haviratiricyate suryo devo divishadbhya ityaha brihaspatina
    caivasya prajapatina ca yajnasya vyriddhamapi vapati rakshagmsi va eta tpashugm sacante yadekadevatya
    alabdho bhuya ste harito garbha ityaha devatraivaina ngamayati rakshasamapahatya a vartana vartayetyaha
    ma vartayati vi te bhinadmi takarimityaha yathayajurevaitadu rudraphso vishvarupa indurityaha praja
    vai pashava induh prajayaivaina vai~ yajnasya vyriddha ngacchati prithivimatirikta ntadyanna shamayedartimarcche
    dyajamano mahi dyauh prithivica na i aha dyavaprithivibhyameva tyaha dyavaprithivibhyameva yajnasya
    vyriddha ''rtimarcchati yajamano bhasmana 'bhi samuhati svagakritya atho anayorva esha garbho ndadhati
    yadavadyedati tadrecayedyannavadye tpashoralabdhasya nava dye tpurastannabhya anyadavadye tpurastadvai
    nabhyai prana uparishtadapano yavaneva pashustasyava dyati vishnave shipivishtaya juhoti yadvai yajnasyatiricyate
    yah pashorbhuma ya pushtista dvishnuh shipivishto 'tirikta evatirikta ndadhatyatiriktasya shantya
    ashtapruddhiranya 'shtapadi hyesha ''tma navamah pashoraptya antarakosha ushnishena mbhavatyevamiva
    hi pashurulbamiva carmeva magmsamivasthiva yavaneva pashustamaptva 'va rundheyasyaisha yajne prayashcittih
    kriyata ishtva vasiya a vayo bhusha shucipa upa na nte niyuto vishvavara | upo te andho madyamayami
    yasya deva dadhishe pu tyai tva kamaya tva samridhe tva kikkita te manah prajapataye svaha kikkita
    te va~yave svaha kikkita te cakshu ssuryaya svaha kikkita te shrotra ndyavaprithivibhyag svaha kikkita
    te vacagm sarasvatyai svaha nturiya vashini vasha ttva manasa garbha a va~shini gaccha devan ssantu
    yajamanasya kamah 'si rayishtha prithivyagm sidordhva 'ntarikshamupa tishthasva divi te brihadbhah
    || tantu nrajaso bhanumanvihi jyotishmatah patho raksha dhiya kritan || anulbanam va~yata joguvamapo
    manu rbhava janaya daivya m || manaso havirasi prajapatervarno gatrana nte gatrabhajo bhuyasma ||
    ntagm somah prajanaya dagniragrasata sa eta mprajapatiragneya ttenaivainamagneradhi nirakrina ttasmadapyanyadevatyamalabhamana
    agneyamashtakapala mpurastannirvapedagnerevainamadhi nishkriya dvayavya yadime garbhamadadhata ddyavaprithivya
    ya thsomah prajanayadagniragrasata tasmadagnishomiya yadanayo tprajapatiragneradhi nirakrina tprajapatya
    sa va esha sarvadevatya yadaja vasha vayavyama labheta bhutikamo vayurvai kshepishtha devata vayumeva
    svena bhagadheyenopa dhavati bhagadheyenopa dhavati sa evaina ngamayati dyavaprithivyama labheta krishamanah
    pratishthakamo diva evasmai parjanyo var shati vyasyamoshadhayo rohanti samardhukamasya sasya mbhavatyagnishomiyama
    labheta yah kamayetannavanannada ssyamityagninaivannamava rundhe somenannadya mannavanevannado bhavati
    sarasvatima labheta ya shvaro vaco vadito dvagvai sarasvati sarasvatimeva svena bhagadheyenopa dhavati
    saivasmin ndadhati prajapatyama labheta yah kamayetanabhijitamabhi jayeyamiti prajapati ssarva devata
    devatabhireva nabhijitamabhi jayati vayavyayopakaroti vayorevainamavaruddhya tyai tva kamaya tve njuhoti
    kikkitakarena vai gramyah pashavo ramante pra ''ranyah patanti ya njuhoti gramyana ndhrityai paryagnau
    kriyamane juhoti jivantimevainagm suvargam nturiya vashini vasha 'sityaha devatraivaina ssantu yajamanasya
    kama ityahaisha vai kamo ngacchati tasmadevamaha 'si rayishthetyahai shvevainam lo~keshu pratishthapayati
    divi te brihadbha ityaha suvarga evasmai loke jyoti nrajaso bhanumanvihityahemanevasmai lokan jyotishmatah
    karotyanulbanam va~yata joguvamapa i tyaha yadeva yajna ulbana nkriyate tasyaivaisha shantirmanurbhava
    janaya daivya njanamityaha manavyo vai prajasta eva kurute manaso havirasityaha svagakrityai gatrana
    nte gatrabhajo bhuyasmetyaha ''shishamevaitama sha ste tasyai va etasya ekameva devayajanam ~yadalabdhaya
    bhavati yadalabdhayamabhra va~ prashniyadyadaphsu praveshaye thsarvameva prashniyadindriyameva tte
    sa va esha trayanamevava ruddha sam va~thsarasadah sahasrayajino grihamedhinasta evaitaya yajera sarasvatima
    labheta yah nca cittishca ''kuta ''kutishca vijnata nca manashca shakvarishca dar shashca purnamasashca
    brihacca rathantara nca prajapatirjayanindraya vrishne prayacchadugrah pritanajyeshu tasmai visha
    ssahi havyo babhuvadevasura thsa indrah prajapatimupa dhava ttato vai deva asuranajayan spardhamanenaite
    hotavya jayatyeva ta agnirbhutanamadhipati ya~mah prithivya vayurantarikshasya suryodivashcandrama
    nakshatrana mbrihaspatirbrahmano mitra ssrotyanamannagm samra jyanamadhipati tanma 'vatu soma oshadhinagm
    savita prasavanagm rudrah pashuna ntvashta rupanam mmaruto gananamadhipatayaste mavantu pitarah pitamahah
    pare nbrahmannasmin kshatre mpurodhayamasmin 'kurvata tadasura akurvata te deva etanabhyatananapashyan
    tanabhyatanvata yaddevana ''sidardhyata tadyadasurana rdhyata yena karmanerthse ttatra hotavya riddhnotyeva
    tena karmana yadvishve deva shtrabhridbhi rashtrama shtrabhritagm rashtrabhrittva nte deva abhyatanairasuranabhyatanvata
    jayairajayan rashtrabhridbhi rashtrama 'dadata yaddeva abhyatanairasuranabhyatanvata tadabhyatananamabhyatanatvam
    shtrabhridbhi rashtrama shtrabhritagm rashtrabhrittva 'sura yo bhratrivyavan thsa etan juhuyadabhyatanaireva
    bhratrivyanabhyatanute jayai rjayati rashtrabhridbhi rashtrama datte bhavatyatmana para 'sya bhratrivyo
    bhavati || 'phsarasa urjo nama sa ida ntu tasmai svaha tabhya ssvaha sagmhito vishvasama suryo gandharva
    'phsarasa ayuvah sushumna shcandrama gandharva stasya nakshatranya phsaraso bekurayobhujyu ssuparno
    yajno gandharva stasya dakshina apsarasah stavah prajapati rvishvakarma mano phsaraso vahnayaishiro
    vishvavyaca vato gandharva 'phsaraso mudabhuvanasya pate yasyata upari griha iha ca | sa no rasvajyanigm
    rayasposhagm suviryagm sam va~thsarinag svastim || parameshthyadhipati stasya vishvamapsaraso bhuvah
    sukshitih nparjanyo gandharva 'phsaraso ruco dure heti stasya praja aphsaraso bhiruvashcaruh kripana
    kashi kamo gandharva 'phsarasah shocayantirnama sa ida ntu tasmai svaha tabhya ssvaha sa no bhuvanasya
    pate yasyata upari griha iha ca | uru brahmane 'smai kshatraya mahi sharma yaccha || rashtrakamaya
    hotavya rashtram shtrabhrito rashtrenaivasmai rashtramava rundhe rashtrameva bhavatyatmane hotavya
    rashtram shtrabhrito rashtra ya~cchreshtho bhavati rashtrenaiva rashtramava rundhe vasishtha mbhavati
    gramakamaya hotavya rashtram shtrabhrito rashtragm sajata rashtrenaivasmai rashtragm sajatanava rundhe
    gra myeva bhavatyadhidevane juhotyadhidevana evasmai sajatanava rundhe ta enamavaruddha upa tishthante
    rathamukha ojaskamasya hotavya ojo vai ra shtrabhrita ojo ratha ojasaivasma ojo 'va rundha ojasvyeva
    bhavati yo rashtradapabhuta ttasmai hotavya yavanto dyundhvamiti rashtrameva ktyahutayo va etasyaklipta
    yasya rashtra nna kalpate svarathasya dakshina mpravrihya nadimabhi juhuyadahutirevasya kalpayati
    ta asya kalpamana rashtramanu kalpate sangrame sam ya~tte hotavya rashtram shtrabhrito rashtre khalu
    va ete vyayacchante ye sangramagm sam ya~nti yasya purvasya juhvati sa eva bhavati jayati tagm sagramma
    bhavatyangara eva prativeshtamana amitranamasya sena mprativeshtayanti ya unmadye ttasmai hotavya
    gandharvaphsaraso va etamunmadayanti ya unmadyatyete khalu vai gandharvaphsaraso yadra shtrabhritastasmai
    svaha tabhya ssvaheti juhoti tenaivaina nchamayati naiyagrodha audumbara ashvatthah plaksha itiddhmo
    bhavatyete vai gandharvaphsarasa nayatane shamayatyabhicarata pratilomagm hotavyah prananevasya praticah
    prati yauti ta ntato yena kena ca strinute svakrita irine juhoti pradare vaitadva asyai nir ritya
    grahayati yadvacah krura nkrurena pravrishcati tajagartimarcchati yasya kamayetannadya ma dadiyeti
    tasya sabhayamuttano nipadya bhuvanasya pata iti trinani sa tprajapatirvai bhuvanasya patih prajapatinaivasyannadyama
    datta idamahamamushya ''mushyayanasyannadyagm haramityahannadyamevasya harati shadbhir harati shadva
    ritavah prajapatinaivasya nnadyamadayartavo 'sma anu prayacchanti 'vasayya brahmaudana mpaktva tasmai
    hotavya var shtrabhrito vashma sthalam ngamayati catuh sharavo bhavati dikshveva pratitishthati kshire
    bhavati rucamevasmi ndadhatyuddharati shritatvaya sarpishva nbhavati meddhyatvaya catvara ar 'shnanti
    dishameva jyotishi juhoti || tprajakamashchandagmsi vai devikashchandagmsiva khalu vai prajashchandobhirevasmai
    prajah prajanayati prathama nkaroti mithuni eva tena karotyanvevasma anumatirmanyate rate raka pra
    sinivali janayati prajasveva prajatasu kuhva vaca ndadhatyeta eva nivarpe tpashukamashchandagmsi vai
    devikashchandagmsi devikashchandagmsi va khalu vai pashavashchandobhirevasmai pashu nkaroti praiva
    tena vapayatyanvevasma anumatirmanyate rate raka pra sinivali janayati pashuneva prajatan kuhva pratishthapayatyeta
    eva nirvape dgramakamashchandagmsi vai devikashchandagmsi va khalu vai gramashchandobhirevasmai grama
    mava rundhe maddhyato dhatara nkaroti maddhyata evaina ngramasya dadhatyeta eva nirvapejjyogamayavi
    chandagmsi vai devikashchandagmsi khalu va etamabhi manyante yasya jyogamayati chandobhirevaina nkaroti
    maddhyato dhatara nkaroti maddhyato va etasyakliptam ya~sya jyogamayati maddhyata evasya tena kalpayatyeta
    eva ni ya~jno nopanamecchandagmsi vai devikashchandagmsi khalu va eta ya~jno nopanamati prathama nkaroti
    mukhata evasmai chandagmsi dadhatyupainam ya~jno namatyeta eva nivarpedijanashchandagmsi vai devika
    yatayamaniva khalu va etasya chandagmsi ya ijana uttama uparishtadevasmai tyuparishtadevasmai chandagsyayatayamanyava
    rundha upainamuttaro yajno namatyeta eva nivarpedya mmedha nopanamecchandagmsi vai devikashchandagmsi
    khalu va eta mmedha nopanamati prathama nkaroti mukhata evasmai chandagmsi dadhatyupaina mmedha namatyeta
    eva nivarpe rukkamashchandagmsi vai drukkamashchandagmsi vai devikashchandagmsiva khalu vai ruk chandobhirevasmi
    ndadhatikshire bhavanti rucamevasmi ndadhati maddhyato dhatara nkaroti maddhyata evainagm ruco dadhatigayatri
    va anumatistrishtugraka jagati sinivalyanushtup kuhurdhata vashatkarah pu 'parapakshah kuhuramavasya
    sinivali pau rnamasyanumatishcandrama dhata 'shtakshara gayatryekadasha rudra ekadashakshara trishtub
    dvadasha ''ditya dvadashakshara jagati prajapatiranushtub dhata vashatkara etadvai devika ssarvani
    ca chandagmsi sarva shca devata vashatkarasta ya thsaha sarva nirvapedishvara ena mpradaho dve prathame
    nirupya dhatustritiya ttatho evottare nivarpe nna pradahantya tho yasmai kamaya nirupyante tameva
    pashukamashchandagmsi vai devikashchandagmsi medha namatyeta eva nirvape devikah prajakamo mithuni
    pashukamah praiva gramakamo jyogamayavi yam 'shtau | devika bhavanti dadhati rashtrakamaya bhavati
    dadhati | shpate prati jani hyasman thsvavesho anamivo bhavanah | ya ttvemahe pratitanno jushasva
    shanna edhi dvipade shancatushpade || vasto shpate shagmaya sagm sadate sakshimahi ranvaya gatumatya
    kshema uta yoge varanno yuya njuhotyahutishtaka eva ta upa dhatte 'horatrani va etasyeshtaka ya ahitagnirya
    mpratarjuhotyahoratranyeva ''ptveshtakah kritvopa dhatte dasha samanatra juhoti dasha 'tho virajyeva
    yajnama pnoti cityashcityo 'sya bhavati tasmadyatra dashoshitva prayati ta stoshpatiryadahutva vastoshpatiya
    'gniranutthaya hanyadvastoshpatiya njuhoti bhagadheyenaivainagm shamayati na ''rtimarcchati yajamano
    yadyukte juhuyadyatha prayate vastavahuti njuhoti tadrigeva tadyadayukte juhuyadyatha kshema ahuti
    njuhoti tadrigeva tadahutamasya vastoshpatiyagg sya ddakshino yukto bhavati savyo ' karaparivargamevainagm
    shamayati yadekaya juhuyaddarvihoma 'nuvakya manucya yajyaya juhoti sadevatvaya yaddhuta adaddhya
    ngrihananvarohaye mprakshapya prayayadyatha yajnaveshasam va~ tadrigeva tadayante yonir tyesha va
    agneryoni yo~nau samarohayatyatho khalvahuryadaranyo ssamarudho nashyedudasyagni tpunaradheyah syaditi
    ya te agne yajniya tanustayehya rohetyatman thsamarohayate yajamano va agneryoni yo~nyagm samarohayate
    || tvamagne brihadvayo dadhasi deva dashushe | kavirgrihapatiryuva || havyavadagnirajarah pita no
    vibhurvibhava sudrishiko asme | sugarhapatya ssamisho didihyasmadriyakhsa mmimihi shravagmsi || tva
    nca soma no vasho jivatu nna maramahe | priyasto tro vanaspatih || brahma devana mpadavih kavinamrishirviprana
    m | shyeno griddhranag svadhiti rvananagm somah pavitramatyeti rebhann || a vishvadevagm satpatigm
    suktairadya vrinimahe | satyasavagm savitara m || asatyena rajasa vartamano niveshayannamrita mmartyanca
    | hiranyayena savita rathena '' devoyati bhuvana vipashyann || yatha no aditih kara tpashve nribhyo
    yatha gave | yatha tokaya rudriya m || ma nastoke tanaye ma na ayushi ma no goshu ma no ashveshu ririshah
    | vira nmano rudra bhamito vadhir havishmanto namasa vidhema te || udapruto na vayo rakshamana vavadato
    abhriyasyeva ghoshah | giribhrajo normayo madanto brihaspatimabhyarka anavann || hagmsairiva sakhibhirvavadadbhirashman
    mayani nahana vyasyann | brihaspatirabhikanikradadga uta prastauducca vidvagm agayat || endra sanasigm
    rayigm sajitvanagm sadasaha sajitvanagm sadasaha shishthamutaye bhara || pra sasahishe puruhuta shatrun
    jyeshthaste shushma iha ratirastu | indra '' bhara dakshinena vasuni pati ssindhunamasi revatinam
    || tvagm sutasya pitaye sadyo vriddho ajayathah | indra jyaishthyaya sukrato || bhuvastvamindra brahmana
    maha nbhuvo vishveshu savaneshu yajniyah | bhuvo nrig shcyautno vishvasmi nbhare jyeshthashca mantro
    shane || mitrasya car shshravo devasya sanasim | satya ncitra shravastamam || mitro janan yatayati
    prajana nmitro dadhara prithivimuta dyam | mitrah krishtiranimisha 'bhi cashte satyaya havya dvidhema
    || prasamitra marto astu prayasvan yasta aditya shikshati vratena | na hanyate na jiyate tvoto nainamagmho
    ashnotyantito na durat || ya cciddhi te visho yatha pradeva varuna vratam | minimasi dyavidyavi ||
    ya va~runa daivye jane shcaramasi | acittiya ttava dharma yuyopimama nastasma denaso deva ririshah
    || kitavaso yadri ripurna divi yadva gha satya mutayanna vidma | sarva ta vishya shithire va devatha
    te syama varuna priyasah || deva va abhyatana || harih om || || krishna yajurvediya taittiriya samhitaya
    ntritiyakande caturthah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्तृतीयकाण्डे चतुर्थः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ वि वा ए॒तस्य॑ य॒ज्ञ ऋ॑द्ध्यते॒ यस्य॑ ह॒विर॑ति॒रिच्य॑ते॒ सूर्यो॑ दे॒वो दि॑वि॒षद्भ्य॒ इत्या॑ह॒
    बृह॒स्पति॑ना चै॒वास्य॑ प्र॒जाप॑तिना च य॒ज्ञस्य॒ व्यृ॑द्ध॒मपि॑ वपति॒ रक्षाग्ं॑सि॒ वा ए॒त त्प॒शुग्ं
    स॑चन्ते॒ यदे॑कदेव॒त्य॑ आल॑ब्धो॒ भूया॒ स्ते॒ हरि॑तो॒ गर्भ॒ इत्या॑ह देव॒त्रैवैना ङ्गमयति॒ रक्ष॑सा॒मप॑हत्या॒
    आ व॑र्तन वर्त॒येत्या॑ह॒ मा व॑र्तयति॒ वि ते॑ भिनद्मि तक॒रीमित्या॑ह यथाय॒जुरे॒वैतदु॑ रुद्र॒फ्सो वि॒श्वरू॑प॒
    इन्दु॒रित्या॑ह प्र॒जा वै प॒शव॒ इन्दुः॑ प्र॒जयै॒वैन॑ वैँ य॒ज्ञस्य॒ व्यृ॑द्ध ङ्गच्छति पृथि॒वीमति॑रिक्त॒
    न्तद्यन्न श॒मये॒दार्ति॒मार्च्छे॒ द्यज॑मानो म॒ही द्यौः पृ॑थि॒वीच॑ न॒ इ॑ आ॒ह॒ द्यावा॑पृथि॒वीभ्या॑मे॒व
    त्याह॒ द्यावा॑पृथि॒वीभ्या॑मे॒व य॒ज्ञस्य॒ व्यृ॑द्ध॒ ऽऽर्ति॒मार्च्छ॑ति॒ यज॑मानो॒ भस्म॑ना॒ ऽभि समू॑हति
    स्व॒गाकृ॑त्या॒ अथो॑ अ॒नयो॒र्वा ए॒ष गर्भो॒ न्दधाति॒ यद॑व॒द्येदति॒ तद्रे॑चये॒द्यन्नाव॒द्ये त्प॒शोराल॑ब्धस्य॒
    नाव॑ द्ये त्पु॒रस्ता॒न्नाभ्या॑ अ॒न्यद॑व॒द्ये त्पु॒रस्ता॒द्वै नाभ्यै प्रा॒ण उ॒परि॑ष्टादपा॒नो यावा॑ने॒व
    प॒शुस्तस्याव॑ द्यति॒ विष्ण॑वे शिपिवि॒ष्टाय॑ जुहोति॒ यद्वै य॒ज्ञस्या॑ति॒रिच्य॑ते॒ यः प॒शोर्भू॒मा या
    पुष्टि॒स्त द्विष्णुः॑ शिपिवि॒ष्टो ऽति॑रिक्त ए॒वाति॑रिक्त न्दधा॒त्यति॑रिक्तस्य॒ शान्त्या॑ अ॒ष्टाप्रू॒ड्ढिर॑ण्य॒
    ऽष्टाप॑दी॒ ह्ये॑षा ऽऽत्मा न॑व॒मः प॒शोराप्त्या॑ अन्तरको॒श उ॒ष्णीषे॒णा म्भवत्ये॒वमि॑व॒ हि प॒शुरुल्ब॑मिव॒
    चर्मे॑व मा॒ग्ं॒समि॒वास्थी॑व॒ यावा॑ने॒व प॒शुस्तमा॒प्त्वा ऽव॑ रुन्धे॒यस्यै॒षा य॒ज्ञे प्राय॑श्चित्तिः
    क्रि॒यत॑ इ॒ष्ट्वा वसी॑या आ वा॑यो भूष शुचिपा॒ उप॑ न न्ते नि॒युतो॑ विश्ववार । उपो॑ ते॒ अन्धो॒ मद्य॑मयामि॒
    यस्य॑ देव दधि॒षे पू त्यै त्वा॒ कामा॑य त्वा स॒मृधे त्वा किक्कि॒टा ते॒ मनः॑ प्र॒जाप॑तये॒ स्वाहा॑ किक्कि॒टा
