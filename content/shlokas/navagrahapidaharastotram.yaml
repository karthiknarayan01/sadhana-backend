id: navagrahapidaharastotram
category: stotram
name:
  english: navagrahapidaharastotram
  devanagari: नवग्रहपीडाहरस्तोत्रम्
content:
  english: navagrahapidaharastotram grahanamadiradityo lokarakshanakarakah | vishamasthanasambhutam pidam
    haratu me ravih || 1|| rohinishah sudhamurtih sudhagatrah sudhashanah | vishamasthanasambhutam pidam
    haratu me vidhuh || 2|| bhumiputro mahateja jagatam bhayakrit sada | vrishtikridvrishtiharta ca pidam
    haratu me kujah || 3|| utpatarupo jagatam candraputro mahadyutih | suryapriyakaro vidvan pidam haratu
    me budhah || 4|| devamantri vishalakshah sada lokahite ratah | anekashishyasampurnah pidam haratu
    me guruh || 5|| daityamantri gurustesham pranadashca mahamatih | prabhustaragrahanam ca pidam haratu
    me bhriguh || 6|| suryaputro dirghadeho vishalakshah shivapriyah | mandacarah prasannatma pidam haratu
    me shanih || 7|| mahashira mahavaktro dirghadamshtro mahabalah | atanushcordhvakeshashca pidam haratu
    me tamah || 8|| anekarupavarnaishca shatasho'tha sahasrashah | utpatarupo jagatam pidam haratu me
    shikhi || 9|| || iti navagrahapidaharastotram sampurnam ||
  devanagari: नवग्रहपीडाहरस्तोत्रम् ग्रहाणामादिरादित्यो लोकरक्षणकारकः । विषमस्थानसंभूतां पीडां हरतु मे
    रविः ॥ १॥ रोहिणीशः सुधामूर्तिः सुधागात्रः सुधाशनः । विषमस्थानसंभूतां पीडां हरतु मे विधुः ॥ २॥ भूमिपुत्रो
    महातेजा जगतां भयकृत् सदा । वृष्टिकृद्वृष्टिहर्ता च पीडां हरतु मे कुजः ॥ ३॥ उत्पातरूपो जगतां चन्द्रपुत्रो
    महाद्युतिः । सूर्यप्रियकरो विद्वान् पीडां हरतु मे बुधः ॥ ४॥ देवमन्त्री विशालाक्षः सदा लोकहिते रतः
    । अनेकशिष्यसम्पूर्णः पीडां हरतु मे गुरुः ॥ ५॥ दैत्यमन्त्री गुरुस्तेषां प्राणदश्च महामतिः । प्रभुस्ताराग्रहाणां
    च पीडां हरतु मे भृगुः ॥ ६॥ सूर्यपुत्रो दीर्घदेहो विशालाक्षः शिवप्रियः । मन्दचारः प्रसन्नात्मा पीडां
    हरतु मे शनिः ॥ ७॥ महाशिरा महावक्त्रो दीर्घदंष्ट्रो महाबलः । अतनुश्चोर्ध्वकेशश्च पीडां हरतु मे तमः
    ॥ ८॥ अनेकरूपवर्णैश्च शतशोऽथ सहस्रशः । उत्पातरूपो जगतां पीडां हरतु मे शिखी ॥ ९॥ ॥ इति नवग्रहपीडाहरस्तोत्रं
    सम्पूर्णम् ॥
