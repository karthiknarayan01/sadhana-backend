id: nrisimhamangalam
category: stotram
name:
  english: nrisimhamangalam
  devanagari: न्रिसिम्हमन्गलम्
content:
  english: nivasaya shrinrisimhaya mangalam || 4|| mahaguru manahpadma madhya nitya nivasine | bhaktocitaya
    bhavatat mangalam shashvati samah || 5|| shrimatyai vishnucittaryamanonandana hetave | nandanandana
  devanagari: निवासाय श्रीनृसिंहाय मङ्गलम् ॥ ४॥ महागुरु मनःपद्म मध्य नित्य निवासिने । भक्तोचिताय भवतात्
    मङ्गलं शाश्वती समाः ॥ ५॥ श्रीमत्यै विष्णुचित्तार्यमनोनन्दन हेतवे । नन्दनन्दन
meaning: {}
