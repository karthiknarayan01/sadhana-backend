id: shakyasimhastotram-4
category: stotram
name:
  english: shakyasimhastotram 4
  devanagari: शाक्यसिंहस्तोत्रम् ४
content:
  english: shakyasimhastotram 4 pranamami jinam sugatam satatam tapaniyahiranyashariracchavim | varacakravibhushitapanitalam
    sasurasuramanushapapaharam || 1|| pranamami munindragurum lalitam satatakulanirjitamarabalam | dashaparamitapratibodhakaram
    caturraryavibodhakaram sukaram || 2|| pranamami hitankaradevanaram sanaramarapujitadevavaram | amaradikashadgatihaityakaram
    sajarajanimrityubhayadiharam || 3|| pranamami sukhakarabodhibharam svasukham pradadau karunashayatah
    | paraduhkhamasahya cakara janurgatadoshanirakulashakyakule || 4|| pranamami ca lokahitaya griham
    vijahau pitaram ramanisahitam | hayakanthakachandakadevavrito mudito'bhyagamat suvane vijane || 5||
    pranamami tapovanasubhramitam pracakara ca yastu maharshiganan | caturaryakabrahmaviharaparan sugatasmaranaikatapovratikan
    || 6|| pranamami mahadrumamulavare sutrinasanasamshritavajradharam | shatakotisumarabalastraharam
    shatasankhyatathagataputravritam || 7|| pranamami ca mallikapancashata vanijah pratipalanameva kritah
    | vanijarpitapancasudhanayakam shubhapayasabhojanabhakshakritam || 8|| pranamami suvartitadharmavaram
    mrigadavavane caturasanake | vidhishakrasurasuralokavritam sushariramahojjvalasarvadisham || 9|| gurunirmitakam
    sugatastavakam pathanam kurute kila yo manujah | graharogabhayam nahi tasya sada sa tu yasyati mokshapure
    supure || 10|| iti adityadinavagrahakritam shrishakyasimhastotram sampurnam ||
  devanagari: शाक्यसिंहस्तोत्रम् ४ प्रणमामि जिनं सुगतं सततं तपनीयहिरण्यशरीरच्छविम् । वरचक्रविभूषितपाणितलं
    ससुरासुरमानुषपापहरम् ॥ १॥ प्रणमामि मुनीन्द्रगुरुं ललितं सतताकुलनिर्जितमारबलम् । दशपारमिताप्रतिबोधकरं
    चतुर्रार्यविबोधकरं सुकरम् ॥ २॥ प्रणमामि हितङ्करदेवनरं सनरामरपूजितदेववरम् । अमरादिकषड्गतिहैत्यकरं सजराजनिमृत्युभयादिहरम्
    ॥ ३॥ प्रणमामि सुखाकरबोधिभरं स्वसुखं प्रददौ करुणाशयतः । परदुःखमसह्य चकार जनुर्गतदोषनिराकुलशाक्यकुले
    ॥ ४॥ प्रणमामि च लोकहिताय गृहं विजहौ पितरं रमणीसहितम् । हयकण्ठकछन्दकदेववृतो मुदितोऽभ्यगमत् सुवने विजने
    ॥ ५॥ प्रणमामि तपोवनसुभ्रमितं प्रचकार च यस्तु महर्षिगणान् । चतुरार्यकब्रह्मविहारपरान् सुगतस्मरणैकतपोव्रतिकान्
    ॥ ६॥ प्रणमामि महाद्रुममूलवरे सुतृणासनसंश्रितवज्रधरम् । शतकोटिसुमारबलास्त्रहरं शतसङ्ख्यतथागतपुत्रवृतम्
    ॥ ७॥ प्रणमामि च मल्लिकपञ्चशता वणिजः प्रतिपालनमेव कृताः । वणिजार्पितपञ्चसुधानयकं शुभपायसभोजनभक्षकृतम्
    ॥ ८॥ प्रणमामि सुवर्तितधर्मवरं मृगदाववने चतुरासनके । विधिशक्रसुरासुरलोकवृतं सुशरीरमहोज्ज्वलसर्वदिशम्
    ॥ ९॥ गुरुनिर्मितकं सुगतस्तवकं पठनं कुरुते किल यो मनुजः । ग्रहरोगभयं नहि तस्य सदा स तु यास्यति मोक्षपुरे
    सुपुरे ॥ १०॥ इति आदित्यादिनवग्रहकृतं श्रीशाक्यसिंहस्तोत्रं सम्पूर्णम् ॥
