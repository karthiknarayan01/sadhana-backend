id: pithastotram
category: stotram
name:
  english: pithastotram
  devanagari: पीठस्तोत्रम्
content:
  english: pithastotram pithastotramaham vakshye shrisharcaphalasiddhaye | yenasya parivaranam devanam
    syatsamarcanam || 1|| cidanandamayabhaktijnanasaurabhasampadi | karunyambudhisanjate gurupadambuje
    namah || 2|| shabdarthacaranastarkamadhyo yogahridantarah | vedantavadanastasmai haraye gurave namah
    || 3|| shadgunaishvaryasampannam harililaikasakshinam | prapannajanamandaramacaryam pranamamyaham
    || 4|| bhajananandalabdhyartham bhaktavrindairupasitam | shrinandanandanatmanam vande vandaruvatsalam
    || 5|| avighnam kuru me natha arcanajnam pradehi me | tava padambujadhyanatsaphalam syatsvapujanam
    || 6|| tavaiva pujanam hyetat shrimato vanushasanam | tavaivatah prasado'stu tvadiyo'ham sada bhave
    || 7|| mano bhagavate'nanta mahapurusharupine | samastu gunasankhyanayam vyaktaya ca vishnave || 8||
    namo dharayai jagatam sarvaratnamaheshvari | sarvamsahayai divyayai vishnupatnyai namo'stu te || 9||
    namah kshirasudhasindho agniruddhashrayaya te | vishuddhaishcaryavijnanashaline haraye namah || 10||
    vaikunthaya namo nityam virajayai namo namah | nandanaya namo vishnoh sunandadibhya eva ca || 11||
    brahmane vishnave capi shivaya ravaye namah | mathuramandalayatho shrimate'stu namo namah || 12||
    namo vrinde ca sankete vane katyayani pare | mathure navavare ca caturvare maheshvari || 13|| yogamaye
    namastubhyam gokulaya namo namah | nandadraye tathanandadraye kamadraye namah || 14|| govarddhanaya
    caranadraye nityam namo namah | aksharabrahmarupayai svarnabhumyai namo namah || 15|| vedaya rigyajuhsamatharvajnanabhuve
    namah | bhaktyai namastadangebhyah shravanebhyo namo namah || 16|| namah sarvatmabhavaya premne nityam
    namo namah | sarvopanishadanandarasayai sarite namah || 17|| aishvaryebhyo namastasyanugrahaya namo
    namah | mahanubhavabhavaya prabhavaya namo namah || 18|| yogasamshuddhahritpadmam natva shrivrajabhridvadhuh
    | nicolaya namo nityam pithaya haraye namah || 19|| namo manasagangayai panamanaratindushu | sarassu
    ca namashcatha namah kusumapushkaram || 20|| haraye bhanave jatapitapushkarayornamah | atheshapushkaram
    natva kalindinyai namo namah || 21|| namo'stu dashakupebhyastadagebhyo namo namah | namah shodashaghattebhyo
    nametkundonashashtishu || 22|| dvadashebhyo vanebhyashca tathopavanakannamet | namo dashavatebhyashca
    catustapicchikannamet || 23|| vandinyaishca namashcatha anandinyai namo namah | prabhupriyayai svaminyai
    vallabhayai namo namah || 24|| khageshcaraya mandaradyayudhebhyo namo namah | damabhyo bahulashvadibhyo
    yadubhyo namah || 25|| prabhupriyayai svaminyai vallabhayai namo namah | pathebhyashcoddhavadibhyo
    bhaktebhyo'pi namo namah | kushasthalanivasibhyo mantribhyo'pi namo namah || 26|| vasudevaya devakyai
    sahajabhyam namo namah | patnibhyo mahishibhyashca tatpriyabhyo namo namah || 27|| namo yashodanandabhyam
    namo gopalabalayoh | yamunayai sakhibhyashca gobhyo nityam namo namah || 28|| siddhabhyo damanebhyashca
    shaktibhyo'pi namo namah | svatmagopalakebhyashca svapriyabhyo namo namah || 29|| paramanandarupaya
    shrinathaya namo namah | namo nikhilagovindaparivaratmane namah || 30|| pithastotramidam punyam yah
    pathedvaishnavo janah | dhyayamstatpratarutthaya tasya syanmanasepsitam || 31|| iti shrishandilyasamhitayam
    pancame bhaktikhande shodasho'dhyaye pithastotram sampurnam |
  devanagari: पीठस्तोत्रम् पीठस्तोत्रमहं वक्ष्ये श्रीशार्चाफलसिद्धये । येनास्य परिवाराणां देवानां स्यात्समर्चनम्
    ॥ १॥ चिदानन्दमयभक्तिज्ञानसौरभसम्पदी । कारुण्याम्बुधिसञ्जाते गुरुपादाम्बुजे नमः ॥ २॥ शब्दार्थचरणस्तर्कमध्यो
    योगहृदन्तरः । वेदान्तवदनस्तस्मै हरये गुरवे नमः ॥ ३॥ षड्गुणैश्वर्यसम्पन्नं हरिलीलैकसाक्षिणम् । प्रपन्नजनमन्दारमाचार्यं
    प्रणमाम्यहम् ॥ ४॥ भजनानन्दलब्ध्यर्थं भक्तवृन्दैरुपासितम् । श्रीनन्दनन्दनात्मानं वन्दे वन्दारुवत्सलम्
    ॥ ५॥ अविघ्नं कुरु मे नाथ अर्चनाज्ञां प्रदेहि मे । तव पादाम्बुजध्यानात्सफलं स्यात्स्वपूजनम् ॥ ६॥ तवैव
    पूजनं ह्येतत् श्रीमतो वानुशासनम् । तवैवातः प्रसादोऽस्तु त्वदीयोऽहं सदा भवे ॥ ७॥ मनो भगवतेऽनन्त महापुरुषरूपिणे
    । समस्तु गुणसङ्ख्यानायां व्यक्ताय च विष्णवे ॥ ८॥ नमो धरायै जगतां सर्वरत्नमहेश्वरि । सर्वंसहायै दिव्यायै
    विष्णुपत्न्यै नमोऽस्तु ते ॥ ९॥ नमः क्षीरसुधासिन्धो अग्निरुद्धाश्रयाय ते । विशुद्धैश्चर्यविज्ञानशालिने
    हरये नमः ॥ १०॥ वैकुण्ठाय नमो नित्यं विरजायै नमो नमः । नन्दनाय नमो विष्णोः सुनन्दादिभ्य एव च ॥ ११॥
    ब्रह्मणे विष्णवे चापि शिवाय रवये नमः । मथुरामण्डलायाथो श्रीमतेऽस्तु नमो नमः ॥ १२॥ नमो वृन्दे च सङ्केते
    वने कात्यायनि परे । मथुरे नववारे च चतुर्वारे महेश्वरि ॥ १३॥ योगमाये नमस्तुभ्यं गोकुलाय नमो नमः । नन्दाद्रये
    तथानन्दाद्रये कामाद्रये नमः ॥ १४॥ गोवर्द्धनाय चरणाद्रये नित्यं नमो नमः । अक्षरब्रह्मरूपायै स्वर्णभूम्यै
    नमो नमः ॥ १५॥ वेदाय ऋग्यजुःसामाथर्वज्ञानभुवे नमः । भक्त्यै नमस्तदङ्गेभ्यः श्रवणेभ्यो नमो नमः ॥ १६॥
    नमः सर्वात्मभावाय प्रेम्णे नित्यं नमो नमः । सर्वोपनिषदानन्दरसायै सरिते नमः ॥ १७॥ ऐश्वर्येभ्यो नमस्तस्यानुग्रहाय
    नमो नमः । महानुभावभावाय प्रभवाय नमो नमः ॥ १८॥ योगसंशुद्धहृत्पद्मं नत्वा श्रीव्रजभृद्वधूः । निचोलाय
    नमो नित्यं पीठाय हरये नमः ॥ १९॥ नमो मानसगङ्गायै पानमानरतीन्दुषु । सरस्सु च नमश्चाथ नमः कुसुमपुष्करम्
    ॥ २०॥ हरये भानवे जातपीतपुष्करयोर्नमः । अथेशपुष्करं नत्वा कालिन्दिन्यै नमो नमः ॥ २१॥ नमोऽस्तु दशकूपेभ्यस्तडागेभ्यो
    नमो नमः । नमः षोडशघट्टेभ्यो नमेत्कुण्डोनषष्टिषु ॥ २२॥ द्वादशेभ्यो वनेभ्यश्च तथोपवनकान्नमेत् । नमो
    दशवटेभ्यश्च चतुस्तापिच्छिकान्नमेत् ॥ २३॥ वन्दिन्यैश्च नमश्चाथ आनन्दिन्यै नमो नमः । प्रभुप्रियायै स्वामिन्यै
    वल्लभायै नमो नमः ॥ २४॥ खगेश्चराय मन्दाराद्यायुधेभ्यो नमो नमः । दामभ्यो बहुलाश्वादिभ्यो यदुभ्यो नमः
    ॥ २५॥ प्रभुप्रियायै स्वामिन्यै वल्लभायै नमो नमः । पाथेभ्यश्चोद्धवादिभ्यो भक्तेभ्योऽपि नमो नमः । कुशस्थलनिवासिभ्यो
    मन्त्रिभ्योऽपि नमो नमः ॥ २६॥ वसुदेवाय देवक्यै सहजाभ्यां नमो नमः । पत्नीभ्यो महिषीभ्यश्च तत्प्रियाभ्यो
    नमो नमः ॥ २७॥ नमो यशोदानन्दाभ्यां नमो गोपालबालयोः । यमुनायै सखिभ्यश्च गोभ्यो नित्यं नमो नमः ॥ २८॥
    सिद्धाभ्यो दमनेभ्यश्च शक्तिभ्योऽपि नमो नमः । स्वात्मगोपालकेभ्यश्च स्वप्रियाभ्यो नमो नमः ॥ २९॥ परमानन्दरूपाय
    श्रीनाथाय नमो नमः । नमो निखिलगोविन्दपरिवारात्मने नमः ॥ ३०॥ पीठस्तोत्रमिदं पुण्यं यः पठेद्वैष्णवो जनः
    । ध्यायंस्तत्प्रातरुत्थाय तस्य स्यान्मनसेप्सितम् ॥ ३१॥ इति श्रीशाण्डिल्यसंहितायां पञ्चमे भक्तिखण्डे
    षोडशोऽध्याये पीठस्तोत्रं सम्पूर्णम् ।
