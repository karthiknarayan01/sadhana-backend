id: chandra-graha-pancharatna-stotram
category: stotram
name:
  english: Chandra Graha Pancharatna Stotram
content:
  english: dadishankha tusharabham kshirarnava samudbhavam | namami shashinam somam shambhormakuta bhushanam
    || || kaladharah kalahetuh kamakritkamadayakah | dashashvaradha samrudha dandapanirthanurdharah ||
    || candrarishtetu samprapte candra pujanca karayet | candradhyanam vrapakshyami manah pidoshantaye
    || || kundapushpojjalakaro nayanajja samudbhavah | audumbara nagavasa udaro rohinipatih || || shveta
    malyambaradharam shvetagandanulepanam | shvetacchatra dharam devam tam somam pranamamyaham ||
  devanagari: ददिशङ्ख तुषाराभं क्षीरार्णव समुद्भवम् । नमामि शशिनं सोमं शम्भोर्मकुट भूषणम् ॥ ॥ कलाधरः कालहेतुः
    कामकृत्कामदायकः । दशाश्वरध संरूढ दण्डपाणिर्थनुर्धरः ॥ ॥ चन्द्रारिष्टेतु सम्प्राप्ते चन्द्र पूजाञ्च
    कारयेत् । चन्द्रध्यानं व्रपक्ष्यामि मनः पीडोशान्तये ॥ ॥ कुन्दपुष्पोज्जलाकारो नयनाज्ज समुद्भवः । औदुम्बर
    नगावास उदारो रोहिणीपतिः ॥ ॥ श्वेत माल्याम्बरधरं श्वेतगन्दानुलेपनम् । श्वेतच्छत्र धरं देवं तं सोमं
    प्रणमाम्यहम् ॥
