id: garbhopanishat-krishnayajurvedokta
category: upanishad
name:
  english: garbhopanishat (krishnayajurvedokta)
  devanagari: गर्भोपनिषत् (कृष्णयजुर्वेदोक्त)
content:
  english: pranidhanaddashavidha bhavanti shuklo raktah krishno dhumrah pitah kapilah pandura iti | saptadhatumiti
    kasmat yada devadattasya dravyadivishaya jayante || parasparam saumyagunatvat shadvidho raso rasacchonitam
    shonitanmamsam mamsanmedo medasah snava snavno'sthinyasthibhyo majja majjnah shukram shukrashonitasamyogadavartate
    garbho hridi vyavastham nayati | hridaye'ntaragnih agnisthane pittam pittasthane vayuh vayusthane
    hridayam prajapatyatkramat || 2|| ritukale samprayogadekaratroshitam kalilam bhavati saptaratroshitam
    budbudam bhavati ardhamasabhyantarena pindo bhavati masabhyantarena kathino bhavati masadvayena shirah
    sampadyate masatrayena padapravesho bhavati | atha caturthe mase jatharakatipradesho bhavati | pancame
    mase prishthavamsho bhavati | shashthe mase mukhanasikakshishrotrani bhavanti | saptame mase jivena
    samyukto bhavati | ashtame mase sarvasampurno bhavati | pitu reto'tiriktat purusho bhavati | matuh
    reto'tiriktatstriyo bhavantyubhayorbijatulyatvannapumsako bhavati | vyakulitamanaso'ndhah khanjah
    kubja vamana bhavanti | anyonyavayuparipiditashukradvaidhyaddvidha tanuh syattato yugmah prajayante
    || pancatmakah samarthah pancatmakatejaseddharasashca samyagjnanat dhyanat aksharamonkaram cintayati
    | tadetadekaksharam jnatva'shtau prakritayah shodasha vikarah sharire tasyaive dehinam | atha matra'shitapitanadisutragatena
    prana apyayate | atha navame masi sarvalakshanasampurno bhavati purvajatih smarati kritakritam ca
    karma vibhati shubhashubham ca karma vindati || 3|| nanayonisahasrani drishtva caiva tato maya | ahara
    vividha bhuktah pitashca vividhah stanah || jatasyaiva mritasyaiva janma caiva punah punah | aho duhkhodadhau
    magnah na pashyami pratikriyam || yanmaya parijanasyarthe kritam karma shubhashubham | ekaki tena
    dahyami gataste phalabhoginah || yadi yonyam pramuncami samkhyam yogam samashraye | ashubhakshayakartaram
    phalamuktipradayakam || yadi yonyam pramuncami tam prapadye maheshvaram | ashubhakshayakartaram phalamuktipradayakam
    || yadi yonyam pramuncami tam prapadye bhagavantam narayanam devam | ashubhakshayakartaram phalamuktipradayakam
    | yadi yonyam pramuncami dhyaye brahma sanatanam || atha jantuh striyonishatam yonidvari samprapto
    yantrenapidyamano mahata duhkhena jatamatrastu vaishnavena vayuna samsprishyate tada na smarati janmamaranam
    na ca karma shubhashubham || 4|| shariramiti kasmat sakshadagnayo hyatra shriyante jnanagnirdarshanagnih
    koshthagniriti | tatra koshthagnirnamashitapitalehyacoshyam pacatiti | darshanagni rupadinam darshanam
    karoti | jnanagnih shubhashubham ca karma vindati | tatra trini sthanani bhavanti hridaye dakshinagnirudare
    garhapatyam mukhamahavaniyamatma yajamano buddhim patnim nidhaya mano brahma lobhadayah pashavo dhritirdiksha
    santoshashca buddhindriyani yajnapatrani karmendriyani havimshi shirah kapalam kesha darbha mukhamantarvedih
    catushkapalam shirah shodasha parshvadantoshthapatalani saptottaram marmashatam sashitikam sandhishatam
    sanavakam snayushatam sapta shirasatani panca majjashatani asthini ca ha vai trini shatani shashtishcardhacatasro
    romani kotyo hridayam palanyashtau dvadasha palani jihva pittaprastham kaphasyadhakam shuklam kudavam
    medah prasthau dvavaniyatam mutrapurishamaharaparimanat | paippaladam mokshashastram parisamaptam
    paippaladam mokshashastram parisamaptamiti || om saha navavatviti shantih || iti garbhopanishatsamapta
    ||
  devanagari: प्रणिधानाद्दशविधा भवन्ति शुक्लो रक्तः कृष्णो धूम्रः पीतः कपिलः पाण्डुर इति । सप्तधातुमिति
    कस्मात् यदा देवदत्तस्य द्रव्यादिविषया जायन्ते ॥ परस्परं सौम्यगुणत्वात् षड्विधो रसो रसाच्छोणितं शोणितान्मांसं
    मांसान्मेदो मेदसः स्नावा स्नाव्नोऽस्थीन्यस्थिभ्यो मज्जा मज्ज्ञः शुक्रं शुक्रशोणितसंयोगादावर्तते गर्भो
    हृदि व्यवस्थां नयति । हृदयेऽन्तराग्निः अग्निस्थाने पित्तं पित्तस्थाने वायुः वायुस्थाने हृदयं प्राजापत्यात्क्रमात्
    ॥ २॥ ऋतुकाले सम्प्रयोगादेकरात्रोषितं कलिलं भवति सप्तरात्रोषितं बुद्बुदं भवति अर्धमासाभ्यन्तरेण पिण्डो
    भवति मासाभ्यन्तरेण कठिनो भवति मासद्वयेन शिरः सम्पद्यते मासत्रयेण पादप्रवेशो भवति । अथ चतुर्थे मासे
    जठरकटिप्रदेशो भवति । पञ्चमे मासे पृष्ठवंशो भवति । षष्ठे मासे मुखनासिकाक्षिश्रोत्राणि भवन्ति । सप्तमे
    मासे जीवेन संयुक्तो भवति । अष्टमे मासे सर्वसम्पूर्णो भवति । पितू रेतोऽतिरिक्तात् पुरुषो भवति । मातुः
    रेतोऽतिरिक्तात्स्त्रियो भवन्त्युभयोर्बीजतुल्यत्वान्नपुंसको भवति । व्याकुलितमनसोऽन्धाः खञ्जाः कुब्जा
    वामना भवन्ति । अन्योन्यवायुपरिपीडितशुक्रद्वैध्याद्द्विधा तनुः स्यात्ततो युग्माः प्रजायन्ते ॥ पञ्चात्मकः
    समर्थः पञ्चात्मकतेजसेद्धरसश्च सम्यग्ज्ञानात् ध्यानात् अक्षरमोङ्कारं चिन्तयति । तदेतदेकाक्षरं ज्ञात्वाऽष्टौ
    प्रकृतयः षोडश विकाराः शरीरे तस्यैवे देहिनाम् । अथ मात्राऽशितपीतनाडीसूत्रगतेन प्राण आप्यायते । अथ नवमे
    मासि सर्वलक्षणसम्पूर्णो भवति पूर्वजातीः स्मरति कृताकृतं च कर्म विभाति शुभाशुभं च कर्म विन्दति ॥ ३॥
    नानायोनिसहस्राणि दृष्ट्वा चैव ततो मया । आहारा विविधा भुक्ताः पीताश्च विविधाः स्तनाः ॥ जातस्यैव मृतस्यैव
    जन्म चैव पुनः पुनः । अहो दुःखोदधौ मग्नः न पश्यामि प्रतिक्रियाम् ॥ यन्मया परिजनस्यार्थे कृतं कर्म शुभाशुभम्
    । एकाकी तेन दह्यामि गतास्ते फलभोगिनः ॥ यदि योन्यां प्रमुञ्चामि सांख्यं योगं समाश्रये । अशुभक्षयकर्तारं
    फलमुक्तिप्रदायकम् ॥ यदि योन्यां प्रमुञ्चामि तं प्रपद्ये महेश्वरम् । अशुभक्षयकर्तारं फलमुक्तिप्रदायकम्
    ॥ यदि योन्यां प्रमुञ्चामि तं प्रपद्ये भगवन्तं नारायणं देवम् । अशुभक्षयकर्तारं फलमुक्तिप्रदायकम् ।
    यदि योन्यां प्रमुञ्चामि ध्याये ब्रह्म सनातनम् ॥ अथ जन्तुः स्त्रीयोनिशतं योनिद्वारि सम्प्राप्तो यन्त्रेणापीड्यमानो
    महता दुःखेन जातमात्रस्तु वैष्णवेन वायुना संस्पृश्यते तदा न स्मरति जन्ममरणं न च कर्म शुभाशुभम् ॥ ४॥
    शरीरमिति कस्मात् साक्षादग्नयो ह्यत्र श्रियन्ते ज्ञानाग्निर्दर्शनाग्निः कोष्ठाग्निरिति । तत्र कोष्ठाग्निर्नामाशितपीतलेह्यचोष्यं
    पचतीति । दर्शनाग्नी रूपादीनां दर्शनं करोति । ज्ञानाग्निः शुभाशुभं च कर्म विन्दति । तत्र त्रीणि स्थानानि
    भवन्ति हृदये दक्षिणाग्निरुदरे गार्हपत्यं मुखमाहवनीयमात्मा यजमानो बुद्धिं पत्नीं निधाय मनो ब्रह्मा
    लोभादयः पशवो धृतिर्दीक्षा सन्तोषश्च बुद्धीन्द्रियाणि यज्ञपात्राणि कर्मेन्द्रियाणि हवींषि शिरः कपालं
    केशा दर्भा मुखमन्तर्वेदिः चतुष्कपालं शिरः षोडश पार्श्वदन्तोष्ठपटलानि सप्तोत्तरं मर्मशतं साशीतिकं सन्धिशतं
    सनवकं स्नायुशतं सप्त शिरासतानि पञ्च मज्जाशतानि अस्थीनि च ह वै त्रीणि शतानि षष्टिश्चार्धचतस्रो रोमाणि
    कोट्यो हृदयं पलान्यष्टौ द्वादश पलानि जिह्वा पित्तप्रस्थं कफस्याढकं शुक्लं कुडवं मेदः प्रस्थौ द्वावनियतं
    मूत्रपुरीषमाहारपरिमाणात् । पैप्पलादं मोक्षशास्त्रं परिसमाप्तं पैप्पलादं मोक्षशास्त्रं परिसमाप्तमिति
    ॥ ॐ सह नाववत्विति शान्तिः ॥ इति गर्भोपनिषत्समाप्ता ॥
