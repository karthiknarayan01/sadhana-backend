id: shodashaganapatistava
category: stotram
name:
  english: shodashaganapatistava
  devanagari: षोडशगणपतिस्तव
content:
  english: shodashaganapatistavam prathamam balavighnesham dvitiyam tarunam tatha | tritiyam bhaktavighnesham
    caturtham viravighnakam || pancamam shaktivighnesham shashtham dhvajaganadhipam | saptamam pingalam
    devam tatha cocchishtanayakam || navamam vighnarajendram dashamam kshipradayakam | ekadasham tu herambam
    dvadasham lakshminayakam || trayodasham mahasamjnam bhuvanesham caturdasham | nrittakhyam pancadasham
    shodashordhvaganadhipam || stotram tu vighnarajasya kathyate shodashatmakam | dharmarthakamamokshartham
    naranam yena vidyate || || iti shodashaganapatistavam sampurnam ||
  devanagari: षोडशगणपतिस्तवम् प्रथमं बालविघ्नेशं द्वितीयं तरुणं तथा । तृतीयं भक्तविघ्नेशं चतुर्थं वीरविघ्नकम्
    ॥ पञ्चमं शक्तिविघ्नेशं षष्ठं ध्वजगणाधिपम् । सप्तमं पिङ्गलं देवं तथा चोच्छिष्टनायकम् ॥ नवमं विघ्नराजेन्द्रं
    दशमं क्षिप्रदायकम् । एकादशं तु हेरम्बं द्वादशं लक्ष्मिनायकम् ॥ त्रयोदशं महासंज्ञं भुवनेशं चतुर्दशम्
    । नृत्ताख्यं पञ्चदशं षोडशोर्ध्वगणाधिपम् ॥ स्तोत्रं तु विघ्नराजस्य कथ्यते षोडशात्मकम् । धर्मार्थकाममोक्षार्थं
    नराणां येन विद्यते ॥ ॥ इति षोडशगणपतिस्तवं सम्पूर्णम् ॥
