id: dhumravarnastotramshrikalikritam
category: stotram
name:
  english: dhumravarnastotramshrikalikritam
  devanagari: धूम्रवर्णस्तोत्रम्श्रीकलिकृतं
content:
  english: shrikalikritam dhumravarnastotram || shriganeshaya namah || kaliruvaca | dhumravarna namastubhyam
    sarvebhyah sukhadayaka | nanarupadharayaiva vighneshaya namo namah || 35|| anantapadahastayanantabahudharaya
    te | anantamayaya guptapracarine namo namah || 36|| herambaya namastubhyam bhaktasamrakshakaya ca
    | abhaktabhayadatre te ganeshaya namo namah || 37|| adimadhyantahinayadimadhyantabhayaya te | anandebhyah
    sadanandadayine vai namo namah || 38|| mayahinaya mayaya adharaya paratmane | mayibhyo mayaya mohadayine
    te namo namah || 39|| karmanam phaladatre te jnanibhyo jnanadayine | anandebhyah sadanandadayine vai
    namo namah || 40|| sahajaya namastubhyam svanandaya samadhaye | yogaya yoganathaya brahmeshaya namo
    namah || 41|| kastvam stotum samarthah syadyatra shantim gatah prabho | vedadayo namamyeva tena tushto
    bhavadhuna || 42|| raksha mam gananatha tvam dasam sharanamagatam | ajnanayuddhajam dosham kshamasva
    karunanidhe || 43|| evamuktva kalistasya padam grihya papata ha | tamuvaca ganadhyakshah svabhaktam
    sharanarthinam || 44||
  devanagari: श्रीकलिकृतं धूम्रवर्णस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ कलिरुवाच । धूम्रवर्ण नमस्तुभ्यं सर्वेभ्यः
    सुखदायक । नानारूपधरायैव विघ्नेशाय नमो नमः ॥ ३५॥ अनन्तपादहस्तायानन्तबाहुधराय ते । अनन्तमायया गुप्तप्रचारिणे
    नमो नमः ॥ ३६॥ हेरम्बाय नमस्तुभ्यं भक्तसंरक्षकाय च । अभक्तभयदात्रे ते गणेशाय नमो नमः ॥ ३७॥ आदिमध्यान्तहीनायादिमध्यान्तभयाय
    ते । आनन्देभ्यः सदानन्ददायिने वै नमो नमः ॥ ३८॥ मायाहीनाय मायाया आधाराय परात्मने । मायिभ्यो मायया मोहदायिने
    ते नमो नमः ॥ ३९॥ कर्मणां फलदात्रे ते ज्ञानिभ्यो ज्ञानदायिने । आनन्देभ्यः सदानन्ददायिने वै नमो नमः
    ॥ ४०॥ सहजाय नमस्तुभ्यं स्वानन्दाय समाधये । योगाय योगनाथाय ब्रह्मेशाय नमो नमः ॥ ४१॥ कस्त्वां स्तोतुं
    समर्थः स्याद्यत्र शान्तिं गताः प्रभो । वेदादयो नमाम्येव तेन तुष्टो भवाधुना ॥ ४२॥ रक्ष मां गणनाथ त्वं
    दासं शरणमागतम् । अज्ञानयुद्धजं दोषं क्षमस्व करुणानिधे ॥ ४३॥ एवमुक्त्वा कलिस्तस्य पादं गृह्य पपात ह
    । तमुवाच गणाध्यक्षः स्वभक्तं शरणार्थिनम् ॥ ४४॥
