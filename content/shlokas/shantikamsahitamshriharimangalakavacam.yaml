id: shantikamsahitamshriharimangalakavacam
category: kavacha
name:
  english: shantikamsahitamshriharimangalakavacam
  devanagari: शान्तिकंसहितंश्रीहरिमन्गलकवचम्
content:
  english: shantikam sahitam shriharimangalakavacam shrishandilya uvaca | shantikam sampravakshyami bhaktanam
    hitakamyaya | yena prayujyamanena sarva bhitirnivartate || 1|| samudbhuto yada brahma srishtvedamayajaddharim
    | svahayai pashyatastasya hetoryato yadricchaya || 2|| tena yajnatmana yajne pure kritva nivartitum
    | yavaddishtam tatastavajjagraha shikhaya shucih || 3|| tena sampitamatrena devakarye mahattare |
    asuta bhagavanagnih rishin shashtisahasrinah || 4|| brahmana kripaya tebhyah sarvamangalamangalam
    | kavacanca pathitam divyam yaduktam harinatmane || 5|| ye gupta munivara brahmaghnai ravanadibhih
    | adhrishyastapa atasthuh prito yebhyo raghuttamah || 6|| prasadashakteh samparkat pujanacca madhudvishah
    | priya babhuvuste loke tadaham vacmi bho dvijah || 7|| kavacasyasya munayo brahmagnitanaya matah
    | gayatranca bhavecchando devata shripatih svayam || 8|| prasadakhya bhavecchaktih bijam lilapriyo
    harih | nishpratyuhanijanandavaptaye viniyojanam || 9|| mulato'sya shadangani bhacakradyaishca rakshanam
    | tirthagopadarajasa nyasah sarvangalaih shuceh || 10|| atha shrimangalakavacam | om shriharaye namah
    | shrikrishnah sarvatah payat shirah shripurushottamah | lalatamaksharah payanmayesho nayane ubhe
    || 1|| shravane bhagavan kalah nasike kritiman vibhuh | paramatma ca vacam me jivesho rasanam mama
    || 2|| hridayam vasudevo me aham sankarshanah prabhuh | pradyumnashca dhiyam patu aniruddho'pi manasam
    || 3|| bhujau me yadasamishah padau me kamatheshvarah | muladharantu varaho nriharirmanipurakam ||
    4|| nabhim me bhargavo ramah parshvam me raghunandanah | prishtham balah kakud buddhah kalkih shesham
    kaladharah || 5|| drishtim trivikramah patu krittim ca kamalapatih | sutram sudarshanah patu anusutram
    maheshvarah || 6|| rupam ramapatih patu rasam rakshovinashanah | gandham gananamadhipah sparsham me
    madhusudanah || 7|| nandako me nabhastattvam nabhasvantam gadadharah | cakrapanirhutasham me shankhabhritsalilam
    sada || 8|| dharam me kamali patu svarupam ravimandali | abhidham me harih patu sarvato jagadishvarah
    || 9|| avyaktam mam harih payad vyaktam mam keshavo vibhuh | mayinam mam ramanatho madhavah paratantragam
    || 10|| govindo mam niranandam durbhagam vishnuravyayah | karmano'bhimukham devo madhudvit prakritam
    prabhuh || 11|| bhugatam vamanah patu annagam shridharo'vatu | retastham tu hrishikeshah padmanabho'pi
    garbhagam || 12|| damodarashcodarasthajatam sankarshano'vatu | shishum shrivasudevo'vyat pradyumno'pi
    stanandhayam || 13|| matra'niruddhah sarddham mam dhatryapi purushottamah | adhokshajashca tatadyaih
    balairnaraharih svayam || 14|| acyutah kridane patu kumarantu janardanah | bhunjanam va pibantam va
    upendro hasitam ratam || 15|| uccarantam carantanca shayanam shripatirharih | rudantam kshudhitam
    patu shrikrishnah paripiditam || 16|| grahairbalagrahairvapi kritrimaishca vishaih kshataih | jantubhih
    papakairhimsraih patu shriraghunandanah || 17|| bhutapretakshetrapalairmahotpatairmahabhayaih | karmanairdakinibhishca
    patu mam garudadhvajah || 18|| vishadamshairvishashvasairvishasasyairvishakshibhih | vishayogaih copavishaih
    sheshashayi sada'vatu || 19|| kishore kamalakantah paugande parameshvarah | viharantam vihareshu devo
    vai vishtarashravah || 20|| samskare yajnabhuk patu shrautasmartakritau harih | varttayam vyavahare
    ca shrinathashca parashrayah || 21|| sevayam paravase ca sada labhe sada vyaye | grihakrityeshu sarveshu
    patu mam jagadishvarah || 22|| grihe patu sada ramah bahih patu baladhikah | sandhau sabhasu margeshu
    vaikunthah patu bhutale || 23|| kridantam bharyayaikante rukminisho sada'vatu | lalayantamapatyani
    patu dvaravatipatih || 24|| pacantam grihakrityeshu hasantam sakhibhih punah | vrajantam durgabhageshu
    tishthantam durjanairapi || 25|| sharngadhanva harih patu vivadantam paraih kvacit | vidyavade mantravade
    vivade kalahe paraih || 26|| kriyasu paurushe yuddhe patu canuradarpaha | bhuktabhuktairamuktaishca
    muktaih shastrastrasancayaih || 27|| manimantraushadhairyantraistantrairavyaddisham patih | jale tu
    bhagavanmatsyah kamathashca jale sthale || 28|| varaho dharaniprishthe durge naraharirharih | jalamarge
    durgamarge himamarge'gnimargake || 29|| nanavidheshu yaneshu khagayanah sada'vatu | akashacchabdatashcapi
    patu mam parameshvarah || 30|| vayutah sparshatashcapi patu mam muramarddanah | vaishvanaratprakashacca
    patu mam madhavah svayam || 31|| kilaladrasatah patu narakocchedako vibhuh | dharaya gandhatah patu
    paramatma sanatanah || 32|| indriyebhyah kriyabhyashca patu daityanishudanah | hrishikebhyo gocarebhyo
    hrishikeshah sada'vatu || 33|| devatabhyah prakashebhyo'pyantahkaranatah prabhuh | atmanah paratashcapi
    devah patu svabhuh sada || 34|| deshatah kalatashcapi nijecchato'pyadrishtatah | sarvato'pi harih
    payaduktanuktasvarupatah || 35|| shrikrishnayeti mamurdhvam govindayeti madhyatah | gopijanavallabhaya
    namah svahetyadho'vatu || 36|| klim krishnaya namashcagre glaum krishnayeti prishthatah | shrikrishnayetyurdhvato
    mam mam krishnayetyadhahsthalat || 37|| shrimanmukundacaranam sharanam me sada bhavet | tena sarvatmiki
    shuddhi raksha bhavatu sarvatah || 38|| aham harermama harih haraye sarvamarpitam | tena mamanugrihnatu
    yashodanandanandanah || 39|| haridasan prapannam mam prapannam haribhavukan | shrimadaryan prapannam
    mam patu shrigokuleshvarah || 40|| shrimadgunanam shravane shraddhaya saktamanasam | shravanam me'vatu
    shrotre manastattvanca patu me || 41|| kirttanam vahnina vacyam smaranam hridayam dhiya | sevanam
    sthulagatram me arcanam ca tanum tanum || 42|| vandanam daivatakulam dasye jivam punatu me | sakhyam
    me bhajananandam svanandancarpanam dadet || 43|| premasphurtim sada mam sa karotu bhagavanmayam |
    yena kenapyupayena anugrihnatu mam harih || 44|| dadatu bhajananandam bhaktim mahyam dadatu sah |
    darshanam nijalilayah kripaya karayatvatha || 45|| mathuram mandalam patu patu divyam vrajasthalam
    | gokulam girirat patu vrindaranyanca rakshatu || 46|| shriradhika svatmarupa nityasiddha vrajeshvari
    | anugrihnatu grihnatu dasivarge kvacicca mam || 47|| shrimaccandravali divyanigamagamasamstuta |
    niyojayatu mam karye dasivarge samashritam || 48|| lalita lalita manya munindrairbhaktavatsala | punatu
    mam nijapreshya nicaye samshritam hita || 49|| kalindini mahabhaga bhaktavrindairnamaskrita | sevadhikarasampattim
    dehi dehi haripriye || 50|| yajnapatnyo hareh patnyo gokulasthashca gopikah | sarvastah sarvada mahyam
    prasidantu haripriyah || 51|| shriyashoda harermata mihirah shrihareh pita | balabhadro harerbhrata
    subhadra shrihareh svasa || 52|| gopala gopika gavo vrajabala vrajadrumah | ye kecidvrajalilasthaste
    sarve kripayantu me || 53|| avidyam putanahanta hanyad balagrahanapi | bakarirmama pashandam nagarirmama
    kalmasham || 54|| shrimadgovardhanadharo devebhyo'pi sa rakshatu | asurebhyashca kamsarirmurarih patu
    sarvatah || 55|| ragebhyo nijabhogebhyah pidabhyo'pyatipidanat | davanalad harah patu sudarshanavimocakah
    || 56|| paratashcapi dakshinottaratastatha | urdhvatashcapyadhastacca patu brahmavimohanah || 57||
    angani sundarah shyamah pratyangani manoharah | manasa vacasa capi patu ciraharah prabhuh || 58||
    kalatah kritito daivatpapebhyo'pyatipiditam | bhaktaparadhatah kshinam patu mam kharasudanah || 59||
    indriyananca vaikalyadvapusho jarayapi ca | mrityunapi vai grastam mam patu gokulapalakah || 60||
    dhanadhanyasamriddhirme vriddhirva putrapautriki | sampattih shastrashastrebhyo jayatam bhavadashrayat
    || 61|| nanyat kimapi vanchami nanyatkimapi samshraye | tatha mam kuru kalyana iti dhyaye mahaprabho
    || 62|| iti shrimangalam nama kavacam | phalashrutih | kamalapatih kumarebhyo jagau purvam
  devanagari: शान्तिकं सहितं श्रीहरिमङ्गलकवचम् श्रीशाण्डिल्य उवाच । शान्तिकं सम्प्रवक्ष्यामि भक्तानां
    हितकाम्यया । येन प्रयुज्यमानेन सर्वा भीतिर्निवर्तते ॥ १॥ समुद्भूतो यदा ब्रह्मा सृष्ट्वेदमयजद्धरिम्
    । स्वाहायै पश्यतस्तस्य हेतोर्यातो यदृच्छया ॥ २॥ तेन यज्ञात्मना यज्ञे पुरे कृत्वा निवर्तितुम् । यावद्दिष्टं
    ततस्तावज्जग्राह शिखया शुचिः ॥ ३॥ तेन सम्पीतमात्रेण देवकार्ये महत्तरे । असूत भगवानग्निः ऋषीन् षष्टिसहस्रिणः
    ॥ ४॥ ब्रह्मणा कृपया तेभ्यः सर्वमङ्गलमङ्गलम् । कवचञ्च पाठितं दिव्यं यदुक्तं हरिणात्मने ॥ ५॥ ये गुप्ता
    मुनिवरा ब्रह्मघ्नै रावणादिभिः । अधृष्यास्तप आतस्थुः प्रीतो येभ्यो रघूत्तमः ॥ ६॥ प्रसादशक्तेः सम्पर्कात्
    पूजनाच्च मधुद्विषः । प्रिया बभूवुस्ते लोके तदहं वच्मि भो द्विजाः ॥ ७॥ कवचस्यास्य मुनयो ब्रह्माग्नितनया
    मताः । गायत्रञ्च भवेच्छन्दो देवता श्रीपतिः स्वयम् ॥ ८॥ प्रसादाख्या भवेच्छक्तिः बीजं लीलाप्रियो हरिः
    । निष्प्रत्यूहनिजानन्दावाप्तये विनियोजनम् ॥ ९॥ मूलतोऽस्य षडङ्गानि भाचक्राद्यैश्च रक्षणम् । तीर्थगोपादरजसा
    न्यासः सर्वाङ्गलैः शुचेः ॥ १०॥ अथ श्रीमङ्गलकवचम् । ॐ श्रीहरये नमः । श्रीकृष्णः सर्वतः पायात् शिरः
    श्रीपुरुषोत्तमः । ललाटमक्षरः पायान्मायेशो नयने उभे ॥ १॥ श्रवणे भगवान् कालः नासिके कृतिमान् विभुः ।
    परमात्मा च वाचं मे जीवेशो रसनां मम ॥ २॥ हृदयं वासुदेवो मे अहं सङ्कर्षणः प्रभुः । प्रद्युम्नश्च धियं
    पातु अनिरुद्धोऽपि मानसम् ॥ ३॥ भुजौ मे यादसामीशः पादौ मे कमठेश्वरः । मूलाधारन्तु वाराहो नृहरिर्मणिपूरकम्
    ॥ ४॥ नाभिं मे भार्गवो रामः पार्श्वं मे रघुनन्दनः । पृष्ठं बलः ककुद् बुद्धः कल्किः शेषं कलाधरः ॥ ५॥
    दृष्टिं त्रिविक्रमः पातु कृत्तिं च कमलापतिः । सूत्रं सुदर्शनः पातु अनुसूत्रं महेश्वरः ॥ ६॥ रूपं रमापतिः
    पातु रसं रक्षोविनाशनः । गन्धं गणानामधिपः स्पर्शं मे मधुसूदनः ॥ ७॥ नन्दको मे नभस्तत्त्वं नभस्वन्तं
    गदाधरः । चक्रपाणिर्हुताशं मे शङ्खभृत्सलिलं सदा ॥ ८॥ धरां मे कमली पातु स्वरूपं रविमण्डली । अभिधां मे
    हरिः पातु सर्वतो जगदीश्वरः ॥ ९॥ अव्यक्तं मां हरिः पायाद् व्यक्तं मां केशवो विभुः । मायिनं मां रमानाथो
    माधवः परतन्त्रगम् ॥ १०॥ गोविन्दो मां निरानन्दं दुर्भगं विष्णुरव्ययः । कर्मणोऽभिमुखं देवो मधुद्विट्
    प्राकृतं प्रभुः ॥ ११॥ भूगतं वामनः पातु अन्नगं श्रीधरोऽवतु । रेतस्थं तु हृषीकेशः पद्मनाभोऽपि गर्भगम्
    ॥ १२॥ दामोदरश्चोदरस्थजातं सङ्कर्षणोऽवतु । शिशुं श्रीवासुदेवोऽव्यात् प्रद्युम्नोऽपि स्तनन्धयम् ॥ १३॥
    मात्राऽनिरुद्धः सार्द्धं मां धात्र्यापि पुरुषोत्तमः । अधोक्षजश्च ताताद्यैः बालैर्नरहरिः स्वयम् ॥ १४॥
    अच्युतः क्रीडने पातु कुमारन्तु जनार्दनः । भुञ्जानं वा पिबन्तं वा उपेन्द्रो हसितं रतम् ॥ १५॥ उच्चरन्तं
    चरन्तञ्च शयानं श्रीपतिर्हरिः । रुदन्तं क्षुधितं पातु श्रीकृष्णः परिपीडितम् ॥ १६॥ ग्रहैर्बालग्रहैर्वापि
    कृत्रिमैश्च विषैः क्षतैः । जन्तुभिः पापकैर्हिंस्रैः पातु श्रीरघुनन्दनः ॥ १७॥ भूतप्रेतक्षेत्रपालैर्महोत्पातैर्महाभयैः
    । कार्मणैर्डाकिनीभिश्च पातु मां गरुडध्वजः ॥ १८॥ विषदंशैर्विषश्वासैर्विषसस्यैर्विषाक्षिभिः । विषयोगैः
    चोपविषैः शेषशायी सदाऽवतु ॥ १९॥ किशोरे कमलाकान्तः पौगण्डे परमेश्वरः । विहरन्तं विहारेषु देवो वै विष्टरश्रवाः
    ॥ २०॥ संस्कारे यज्ञभुक् पातु श्रौतस्मार्तकृतौ हरिः । वार्त्तायां व्यवहारे च श्रीनाथश्च पराश्रयः ॥
    २१॥ सेवायां परवासे च सदा लाभे सदा व्यये । गृहकृत्येषु सर्वेषु पातु मां जगदीश्वरः ॥ २२॥ गृहे पातु सदा
    रामः बहिः पातु बलाधिकः । सन्धौ सभासु मार्गेषु वैकुण्ठः पातु भूतले ॥ २३॥ क्रीडन्तं भार्ययैकान्ते रुक्मिणीशो
    सदाऽवतु । लालयन्तमपत्यानि पातु द्वारावतीपतिः ॥ २४॥ पचन्तं गृहकृत्येषु हसन्तं सखिभिः पुनः । व्रजन्तं
    दुर्गभागेषु तिष्ठन्तं दुर्जनैरपि ॥ २५॥ शार्ङ्गधन्वा हरिः पातु विवदन्तं परैः क्वचित् । विद्यावादे मन्त्रवादे
    विवादे कलहे परैः ॥ २६॥ क्रियासु पौरुषे युद्धे पातु चाणूरदर्पहा । भुक्ताभुक्तैरमुक्तैश्च मुक्तैः शस्त्रास्त्रसञ्चयैः
    ॥ २७॥ मणिमन्त्रौषधैर्यन्त्रैस्तन्त्रैरव्याद्दिशां पतिः । जले तु भगवान्मत्स्यः कमठश्च जले स्थले ॥ २८॥
    वाराहो धरणीपृष्ठे दुर्गे नरहरिर्हरिः । जलमार्गे दुर्गमार्गे हिममार्गेऽग्निमार्गके ॥ २९॥ नानाविधेषु
    यानेषु खगयानः सदाऽवतु । आकाशाच्छब्दतश्चापि पातु मां परमेश्वरः ॥ ३०॥ वायुतः स्पर्शतश्चापि पातु मां
    मुरमर्द्दनः । वैश्वानरात्प्रकाशाच्च पातु मां माधवः स्वयम् ॥ ३१॥ कीलालाद्रसतः पातु नरकोच्छेदको विभुः
    । धराया गन्धतः पातु परमात्मा सनातनः ॥ ३२॥ इन्द्रियेभ्यः क्रियाभ्यश्च पातु दैत्यनिषूदनः । हृषीकेभ्यो
    गोचरेभ्यो हृषीकेशः सदाऽवतु ॥ ३३॥ देवताभ्यः प्रकाशेभ्योऽप्यन्तःकरणतः प्रभुः । आत्मनः परतश्चापि देवः
    पातु स्वभूः सदा ॥ ३४॥ देशतः कालतश्चापि निजेच्छातोऽप्यदृष्टतः । सर्वतोऽपि हरिः पायादुक्तानुक्तस्वरूपतः
    ॥ ३५॥ श्रीकृष्णायेति मामूर्ध्वं गोविन्दायेति मध्यतः । गोपीजनवल्लभाय नमः स्वाहेत्यधोऽवतु ॥ ३६॥ क्लीं
    कृष्णाय नमश्चाग्रे ग्लौं कृष्णायेति पृष्ठतः । श्रीकृष्णायेत्यूर्ध्वतो मां मां कृष्णायेत्यधःस्थलात्
    ॥ ३७॥ श्रीमन्मुकुन्दचरणं शरणं मे सदा भवेत् । तेन सार्वात्मिकी शुद्धी रक्षा भवतु सर्वतः ॥ ३८॥ अहं हरेर्मम
    हरिः हरये सर्वमर्पितम् । तेन मामनुगृह्णातु यशोदानन्दनन्दनः ॥ ३९॥ हरिदासान् प्रपन्नं मां प्रपन्नं हरिभावुकान्
    । श्रीमदार्यान् प्रपन्नं मां पातु श्रीगोकुलेश्वरः ॥ ४०॥ श्रीमद्गुणानां श्रवणे श्रद्धया सक्तमानसम्
    । श्रवणं मेऽवतु श्रोत्रे मनस्तत्त्वञ्च पातु मे ॥ ४१॥ कीर्त्तनं वह्निना वाच्यं स्मरणं हृदयं धिया ।
    सेवनं स्थूलगात्रं मे अर्चनं च तनुं तनूम् ॥ ४२॥ वन्दनं दैवतकुलं दास्ये जीवं पुनातु मे । सख्यं मे भजनानन्दं
    स्वानन्दञ्चार्पणं ददेत् ॥ ४३॥ प्रेमस्फूर्तिं सदा मां सा करोतु भगवन्मयम् । येन केनाप्युपायेन अनुगृह्णातु
    मां हरिः ॥ ४४॥ ददातु भजनानन्दं भक्तिं मह्यं ददातु सः । दर्शनं निजलीलायाः कृपया कारयत्वथ ॥ ४५॥ माथुरं
    मण्डलं पातु पातु दिव्यं व्रजस्थलम् । गोकुलं गिरिराट् पातु वृन्दारण्यञ्च रक्षतु ॥ ४६॥ श्रीराधिका स्वात्मरूपा
    नित्यसिद्धा व्रजेश्वरी । अनुगृह्णातु गृह्णातु दासीवर्गे क्वचिच्च माम् ॥ ४७॥ श्रीमच्चन्द्रावली दिव्यनिगमागमसंस्तुता
    । नियोजयतु मां कार्ये दासीवर्गे समाश्रितम् ॥ ४८॥ ललिता ललिता मान्या मुनीन्द्रैर्भक्तवत्सला । पुनातु
    मां निजप्रेष्या निचये संश्रितं हिता ॥ ४९॥ कालिन्दिनी महाभागा भक्तवृन्दैर्नमस्कृता । सेवाधिकारसम्पत्तिं
    देहि देहि हरिप्रिये ॥ ५०॥ यज्ञपत्न्यो हरेः पत्न्यो गोकुलस्थाश्च गोपिकाः । सर्वास्ताः सर्वदा मह्यं
    प्रसीदन्तु हरिप्रियाः ॥ ५१॥ श्रीयशोदा हरेर्माता मिहिरः श्रीहरेः पिता । बलभद्रो हरेर्भ्राता सुभद्रा
    श्रीहरेः स्वसा ॥ ५२॥ गोपाला गोपिका गावो व्रजबाला व्रजद्रुमाः । ये केचिद्व्रजलीलास्थास्ते सर्वे कृपयन्तु
    मे ॥ ५३॥ अविद्यां पूतनाहन्ता हन्याद् बालग्रहानपि । बकारिर्मम पाषण्डं नागारिर्मम कल्मषम् ॥ ५४॥ श्रीमद्गोवर्धनधरो
    देवेभ्योऽपि स रक्षतु । असुरेभ्यश्च कंसारिर्मुरारिः पातु सर्वतः ॥ ५५॥ रागेभ्यो निजभोगेभ्यः पीडाभ्योऽप्यतिपीडनात्
    । दावानलाद् हरः पातु सुदर्शनविमोचकः ॥ ५६॥ परतश्चापि दक्षिणोत्तरतस्तथा । ऊर्ध्वतश्चाप्यधस्ताच्च पातु
    ब्रह्मविमोहनः ॥ ५७॥ अङ्गानि सुन्दरः श्यामः प्रत्यङ्गानि मनोहरः । मनसा वचसा चापि पातु चीरहरः प्रभुः
    ॥ ५८॥ कालतः कृतितो दैवात्पापेभ्योऽप्यतिपीडितम् । भक्तापराधतः क्षीणं पातु मां खरसूदनः ॥ ५९॥ इन्द्रियाणाञ्च
    वैकल्याद्वपुषो जरयापि च । मृत्युनापि वै ग्रस्तं मां पातु गोकुलपालकः ॥ ६०॥ धनधान्यसमृद्धिर्मे वृद्धिर्वा
    पुत्रपौत्रिकी । सम्पत्तिः शस्त्रशास्त्रेभ्यो जायतां भवदाश्रयात् ॥ ६१॥ नान्यत् किमपि वाञ्छामि नान्यत्किमपि
    संश्रये । तथा मां कुरु कल्याण इति ध्याये महाप्रभो ॥ ६२॥ इति श्रीमङ्गलं नाम कवचं । फलश्रुतिः । कमलापतिः
    कुमारेभ्यो जगौ पूर्वं
