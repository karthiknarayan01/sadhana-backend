id: dhumravarnastotramdevamunikritam
category: stotram
name:
  english: dhumravarnastotramdevamunikritam
  devanagari: धूम्रवर्णस्तोत्रम्देवमुनिकृतं
content:
  english: devamunikritam dhumravarnastotram || shriganeshaya namah || devarshaya ucuh | dhumravarnaya
    sarvebhyah sarvadaya kripalave | ganeshaya pareshaya paratparaya te namah || 34|| lambodaraya vighnanam
    pataye te namo namah | vighnakartre ca taddhartre herambaya namo namah || 35|| anadaye visheshena
    jyeshthaya sarvapujita | manovanivihinaya manovanimayaya te || 36|| namaste brahmarupaya brahmane
    brahmadayine | brahmanam pataye tubhyam mantranathaya te namah || 37|| mahorupaya devaya devadevesharupine
    | devebhyo varadatre te mahodara namo namah || 38|| adipujyaya sarvesham matre pitre namo namah |
    sarvarupaya sarvatman karmarupaya te namah || 39|| shurpakarnaya shuraya viraya paramatmane | caturbhujaya
    dhumraya guneshaya namo namah || 40|| kartre hartre ca bhartre te parajnanasvarupine | svadhinaya
    mahamohadatre hartre namo namah || 41|| yatra vedadayah svamin shantim praptashca yoginah | ganesha
    tatra ke natha vayam te stavane prabho || 42|| varna dhumrayita yatravyaktarupe pura tvayi | dhumravarnah
    samakhyato vedeshu vedavadibhih || 43|| dhanya vayam mahabhaga tvadanghriyugadarshanat | avyakto vyaktatam
    prapto bhaktavatsalyakaranat || 44|| evamuktva pranemustam dhumravarnam surarshayah | utthapya dhumravarnastan
    jagada meghanihsvanah || 45||
  devanagari: देवमुनिकृतं धूम्रवर्णस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ देवर्षय ऊचुः । धूम्रवर्णाय सर्वेभ्यः सर्वदाय
    कृपालवे । गणेशाय परेशाय परात्पराय ते नमः ॥ ३४॥ लम्बोदराय विघ्नानां पतये ते नमो नमः । विघ्नकर्त्रे
    च तद्धर्त्रे हेरम्बाय नमो नमः ॥ ३५॥ अनादये विशेषेण ज्येष्ठाय सर्वपूजित । मनोवाणीविहीनाय मनोवाणीमयाय
    ते ॥ ३६॥ नमस्ते ब्रह्मरूपाय ब्रह्मणे ब्रह्मदायिने । ब्रह्मणां पतये तुभ्यं मन्त्रनाथाय ते नमः ॥ ३७॥
    महोरूपाय देवाय देवदेवेशरूपिणे । देवेभ्यो वरदात्रे ते महोदर नमो नमः ॥ ३८॥ आदिपूज्याय सर्वेषां मात्रे
    पित्रे नमो नमः । सर्वरूपाय सर्वात्मन् कर्मरूपाय ते नमः ॥ ३९॥ शूर्पकर्णाय शूराय वीराय परमात्मने । चतुर्भुजाय
    धूम्राय गुणेशाय नमो नमः ॥ ४०॥ कर्त्रे हर्त्रे च भर्त्रे ते परज्ञानस्वरूपिणे । स्वाधीनाय महामोहदात्रे
    हर्त्रे नमो नमः ॥ ४१॥ यत्र वेदादयः स्वामिन् शान्तिं प्राप्ताश्च योगिनः । गणेश तत्र के नाथ वयं ते स्तवने
    प्रभो ॥ ४२॥ वर्णा धूम्रायिता यत्राव्यक्तरूपे पूरा त्वयि । धूम्रवर्णः समाख्यातो वेदेषु वेदवादिभिः ॥
    ४३॥ धन्या वयं महाभाग त्वदङ्घ्रियुगदर्शनात् । अव्यक्तो व्यक्ततां प्राप्तो भक्तवात्सल्यकारणात् ॥ ४४॥
    एवमुक्त्वा प्रणेमुस्तं धूम्रवर्णं सुरर्षयः । उत्थाप्य धूम्रवर्णस्तान् जगाद मेघनिःस्वनः ॥ ४५॥
