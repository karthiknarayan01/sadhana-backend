id: raghavendrakaravalambanastotram
category: stotram
name:
  english: raghavendrakaravalambanastotram
  devanagari: राघवेन्द्रकरावलम्बनस्तोत्रम्
content:
  english: shriraghavendrakaravalambanastotram shridharanghrisaroruhe disha dasatamanudasatam tadvadhupavanadikeshvanudasatamanudasatam
    | raghavendra karashrayam tava dehi me vara dehi mam raghavendra karashrayam disha rakshatam kuru
    cakshatam || 1|| ramaya hritahrittvaham na labhe sukham na labhe sukham kim karomi hatashayashcaritasmyaham
    mrigatrishnaya | hatashayashcarishnuraham raghavendra karashrayam tava dehi me varadaihi mam raghavendra
    karashrayam disha rakshatam kuru cakshatam || 2|| ghatukam mama purvakarma vibhadhate pravibadhate
    tena samsritisagare bhramato mama bhramato mama | raghavendra karashrayam tava dehi me varadaihi mam
    raghavendra karashrayam disha rakshatam kuru cakshatam || 3|| vedmi kincana sadhanam na hi sadgatermama
    sadgate margamashu vimuktidam pratidarshaya pratidarshaya | raghavendra karashrayam tava dehi me varadaihi
    mam raghavendra karashrayam disha rakshatam kuru cakshatam || 4|| dravaya'shu mamapadam niyatayatamanaya'gatam
    anyatha tava bhaktaduhkhaharapratha tu bhavedvritha | raghavendra karashrayam tava dehi me varadaihi
    mam raghavendra karashrayam disha rakshatam kuru cakshatam || 5|| yami kam tvadrite pitah sharanam
    vadasharanah prabho putravatsalata pitustava nasti kim tava nasti kim | raghavendra karashrayam tava
    dehi me varadaihi mam raghavendra karashrayam disha rakshatam kuru cakshatam || 6|| manayasva sutasya
    me bahu bhashanam karuneshanam vakravagapi balakasya mudam pituh kurute na kim | raghavendra karashrayam
    tava dehi me varadaihi mam raghavendra karashrayam disha rakshatam kuru cakshatam || 7|| krishnanamayutavadhutakritam
    tava stavamadarat yahpathediha tasya tatsukhamadishabhayamadisha | raghavendra karashrayam tava dehi
    me varadaihi mam raghavendra karashrayam disha rakshatam kuru cakshatam || 8|| iti shrikrishnavadhutaviracite
    shriraghavendratantre navamapatale karavalambanastotram nama caturtho'dhyayah sampurnah |
  devanagari: श्रीराघवेन्द्रकरावलम्बनस्तोत्रम् श्रीधराङ्घ्रिसरोरुहे दिश दासतामनुदासतां तद्वधूपवनादिकेष्वनुदासतामनुदासताम्
    । राघवेन्द्र कराश्रयं तव देहि मे वर देहि मां राघवेन्द्र कराश्रयं दिश रक्षतां कुरु चाक्षताम् ॥ १॥ रामया
    हृतहृत्त्वहं न लभे सुखं न लभे सुखं किं करोमि हताशयश्चरितास्म्यहं मृगतृष्णया । हताशयश्चरिष्णुरहं राघवेन्द्र
    कराश्रयं तव देहि मे वरदैहि मां राघवेन्द्र कराश्रयं दिश रक्षतां कुरु चाक्षताम् ॥ २॥ घातुकं मम पूर्वकर्म
    विभाधते प्रविबाधते तेन संसृतिसागरे भ्रमतो मम भ्रमतो मम । राघवेन्द्र कराश्रयं तव देहि मे वरदैहि मां
    राघवेन्द्र कराश्रयं दिश रक्षतां कुरु चाक्षताम् ॥ ३॥ वेद्मि किञ्चन साधनं न हि सद्गतेर्मम सद्गते मार्गमाशु
    विमुक्तिदं प्रतिदर्शय प्रतिदर्शय । राघवेन्द्र कराश्रयं तव देहि मे वरदैहि मां राघवेन्द्र कराश्रयं दिश
    रक्षतां कुरु चाक्षताम् ॥ ४॥ द्रावयाऽशु ममापदं नियतायतामनयाऽगतां अन्यथा तव भक्तदुःखहरप्रथा तु भवेद्वृथा
    । राघवेन्द्र कराश्रयं तव देहि मे वरदैहि मां राघवेन्द्र कराश्रयं दिश रक्षतां कुरु चाक्षताम् ॥ ५॥ यामि
    कं त्वदृते पितः शरणं वदाशरणः प्रभो पुत्रवत्सलता पितुस्तव नास्ति किं तव नास्ति किम् । राघवेन्द्र कराश्रयं
    तव देहि मे वरदैहि मां राघवेन्द्र कराश्रयं दिश रक्षतां कुरु चाक्षताम् ॥ ६॥ मानयस्व सुतस्य मे बहु भाषणं
    करुणेषणं वक्रवागपि बालकस्य मुदं पितुः कुरुते न किम् । राघवेन्द्र कराश्रयं तव देहि मे वरदैहि मां राघवेन्द्र
    कराश्रयं दिश रक्षतां कुरु चाक्षताम् ॥ ७॥ कृष्णनामयुतावधूतकृतं तव स्तवमादरात् यःपठेदिह तस्य तत्सुखमादिशाभयमादिश
    । राघवेन्द्र कराश्रयं तव देहि मे वरदैहि मां राघवेन्द्र कराश्रयं दिश रक्षतां कुरु चाक्षताम् ॥ ८॥ इति
    श्रीकृष्णावधूतविरचिते श्रीराघवेन्द्रतन्त्रे नवमपटले करावलम्बनस्तोत्रं नाम चतुर्थोऽध्यायः सम्पूर्णः
    ।
