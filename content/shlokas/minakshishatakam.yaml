id: minakshishatakam
category: shataka
name:
  english: minakshishatakam
  devanagari: मीनाक्षीशतकम्
content:
  english: ringah || 83|| tvadbhogalampatamana hi mahanubhavah sharvassa kotimadanopamaramyarupah | nityam
    tavaiva grihavasaparo babhuva tvanmohito rativishalasukhanuraktah || 84|| tvadvaktracumbanasupitasudharaso'yam
    pancananah parigrihitasapancabanah | nocetkuto dhavalimatra maheshagatre syaccandracarukiranodbhavacandrikeva
    || 85|| aghraya tavakamukhambujagandhamisho mene tapah phalamahassa taponidhanah | alingya gadhamanagho
    bhavatim krishangim kamodadhau saha mamajja vidhutalajjah || 86|| hasairviharaparamaih kritakautukabhyam
    purvottarakramavisheshavishobhitabhyam | samvardhito'nala ivajyahuto yuvabhyam kamanalah kila raho
    grihamadhyamanah || 87|| mene kritarthamagarajamajo grihesho yasyasi minanayane duhita sabhadra |
    tvatkamakautukamanah paritushtabhavah purno'pi purnaratimetya vidhutashokah || 88|| bhogindrakalpitakarasthitakankanashrih
    bhogashramena sahitashshayanam cikirshuh | nanyam girim vrajati hanta girishvaro'yam matva girim gurutaram
    jaghanam ghanam te || 89|| kasturikaiva tava kanthagata samriddha bhasmapriyasya ca gale pratibimbata'bhut
    | tenatishubhrashubhagatradharo'pi shambhuh tvatsangatassati babhuva sa nilakanthah || 90|| kamankitakritivisheshavirajamanau
    tambularaktavadanau shramatoyasiktau | kshemankarau ca jagatah pitarau yuvankaih sevyau samastavaradau
    bhuvi devi na stah || 91|| suryodayabharadane surapujyapade sutadibhisstutagune sukhabodhasare | suteshu
    suktiraciteshu sukhena bodhye sucyagrabuddhivishade sutamamba pahi || 92|| sangitasarahridaye samadrishtiyukte
    samyakshukendraparibhashitanamajale | sayantanagatasamanasakhisamete samsarasagaragatam paripahi mam
    tvam || 93|| santanakamyaphalade savitriprasute sandehasadhitarame samayapratishthe | sadhyamritakhyavaratirthavishodhitanta
  devanagari: ृङ्गः ॥ ८३॥ त्वद्भोगलम्पटमना हि महानुभावः शर्वस्स कोटिमदनोपमरम्यरूपः । नित्यं तवैव गृहवासपरो
    बभूव त्वन्मोहितो रतिविशालसुखानुरक्तः ॥ ८४॥ त्वद्वक्त्रचुम्बनसुपीतसुधारसोऽयं पञ्चाननः परिगृहीतसपञ्चबाणः
    । नोचेत्कुतो धवलिमात्र महेशगात्रे स्याच्चन्द्रचारुकिरणोद्भवचन्द्रिकेव ॥ ८५॥ आघ्राय तावकमुखाम्बुजगन्धमीशो
    मेने तपः फलमहस्स तपोनिधानः । आलिङ्ग्य गाढमनघो भवतीं कृशाङ्गीं कामोदधौ सह ममज्ज विधूतलज्जः ॥ ८६॥ हासैर्विहारपरमैः
    कृतकौतुकाभ्यां पूर्वोत्तरक्रमविशेषविशोभिताभ्याम् । संवर्धितोऽनल इवाज्यहुतो युवाभ्यां कामानलः किल रहो
    गृहमध्यमानः ॥ ८७॥ मेने कृतार्थमगराजमजो गृहेशो यस्यासि मीननयने दुहिता सभद्रा । त्वत्कामकौतुकमनः परितुष्टभावः
    पूर्णोऽपि पूर्णरतिमेत्य विधूतशोकः ॥ ८८॥ भोगीन्द्रकल्पितकरस्थितकङ्कणश्रीः भोगश्रमेण सहितश्शयनं चिकीर्षुः
    । नान्यं गिरिं व्रजति हन्त गिरीश्वरोऽयं मत्वा गिरिं गुरुतरं जघनं घनं ते ॥ ८९॥ कस्तूरिकैव तव कण्ठगता
    समृद्धा भस्मप्रियस्य च गले प्रतिबिम्बताऽभूत् । तेनातिशुभ्रशुभगात्रधरोऽपि शम्भुः त्वत्सङ्गतस्सति बभूव
    स नीलकण्ठः ॥ ९०॥ कामाङ्किताकृतिविशेषविराजमानौ ताम्बूलरक्तवदनौ श्रमतोयसिक्तौ । क्षेमङ्करौ च जगतः पितरौ
    युवाङ्कैः सेव्यौ समस्तवरदौ भुवि देवि न स्तः ॥ ९१॥ सूर्योदयाभरदने सुरपूज्यपादे सूतादिभिस्स्तुतगुणे
    सुखबोधसारे । सूतेषु सूक्तिरचितेषु सुखेन बोध्ये सूच्यग्रबुद्धिविशदे सुतमम्ब पाहि ॥ ९२॥ सङ्गीतसारहृदये
    समदृष्टियुक्ते सम्यक्शुकेन्द्रपरिभाषितनामजाले । सायन्तनागतसमानसखीसमेते संसारसागरगतं परिपाहि मां त्वम्
    ॥ ९३॥ सन्तानकाम्यफलदे सवितृप्रसूते सन्देहसाधितरमे समयप्रतिष्ठे । साध्यामृताख्यवरतीर्थविशोधितान्त
