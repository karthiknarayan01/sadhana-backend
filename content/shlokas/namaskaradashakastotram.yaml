id: namaskaradashakastotram
category: stotram
name:
  english: namaskaradashakastotram
  devanagari: नमस्कारदशकस्तोत्रम्
content:
  english: shrinamaskaradashakastotram namah shivabhyam jagadishvarabhyam jagatpatibhyam jayavigrahabhyam
    | jambharimukhyairabhivanditabhyam namo namah shankaraparvatibhyam || 1|| namah shivabhyam jatilalakabhyam
    jaramrititranavicakshanabhyam | janardanabjodbhavapujitabhyam namo namah shankaraparvatibhyam || 2||
    namah shivabhyam kalinashakridbhayam karunyakalyanavapurdharabhyam | kailasashailakhyaniketanabhyam
    namo namah shankaraparvatibhyam || 3|| namah shivabhyam vrishavahanabhyam virincivishvambharapujitabhyam
    | vibhutipadhiravilocanabhyam namo namah shankaraparvatibhyam || 4|| namah shivabhyamatisundarabhyam
    atyantamasaktavapurdharabhyam | asheshalokaikashivankarabhyam namo namah shankaraparvatibhyam || 5||
    namah shivabhyam ravilocanabhyam ravinduvaishvanaralocanabhyam | rakashashistomamukhambujabhyam namo
    namah shankaraparvatibhyam || 6|| namah shivabhyam shashishekharabhyam samastasampatparipuritabhyam
    | samastavidyabhirupasitabhyam namo namah shankaraparvatibhyam || 7|| namah shivabhyam nayanotsukabhyam
    namaskritabhishtavarapradabhyam | narayanenarcitapadukabhyam namo namah shankaraparvatibhyam || 8||
  devanagari: श्रीनमस्कारदशकस्तोत्रम् नमः शिवाभ्यां जगदीश्वराभ्यां जगत्पतिभ्यां जयविग्रहाभ्याम् । जम्भारिमुख्यैरभिवन्दिताभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ १॥ नमः शिवाभ्यां जटिलालकाभ्यां जरामृतित्राणविचक्षणाभ्याम् । जनार्दनाब्जोद्भवपूजिताभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ २॥ नमः शिवाभ्यां कलिनाशकृद्भयां कारुण्यकल्याणवपुर्धराभ्याम् । कैलासशैलाख्यनिकेतनाभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ३॥ नमः शिवाभ्यां वृषवाहनाभ्यां विरिञ्चिविश्वम्भरपूजिताभ्याम् । विभूतिपाधीरविलोचनाभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ४॥ नमः शिवाभ्यामतिसुन्दराभ्यां अत्यन्तमासक्तवपुर्धराभ्याम् । अशेषलोकैकशिवङ्कराभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ५॥ नमः शिवाभ्यां रविलोचनाभ्यां रवीन्दुवैश्वानरलोचनाभ्याम् । राकाशशिस्तोममुखाम्बुजाभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ६॥ नमः शिवाभ्यां शशिशेखराभ्यां समस्तसम्पत्परिपूरिताभ्याम् । समस्तविद्याभिरुपासिताभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ७॥ नमः शिवाभ्यां नयनोत्सुकाभ्यां नमस्कृताभीष्टवरप्रदाभ्याम् । नारायणेनार्चितपादुकाभ्यां
    नमो नमः शङ्करपार्वतीभ्याम् ॥ ८॥
