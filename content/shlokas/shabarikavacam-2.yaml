id: shabarikavacam-2
category: stotram
name:
  english: shabarikavacam
  devanagari: शाबरीकवचम्
content:
  english: cakra gada padmadharini | mama vamchita siddhim kuru kuru svaha | om namo kamalavadana mohini
    sarvajanavashakarini sakshat | sukshmasvarupini yanmama vashaga om suratura bhaveyuh svaha | gururbrahma
    gururvishnu gururdevo maheshrvarah | guru sakshat parabrahma tasmai shriguruve namah || ajnanatimiramdhasya
    jnanamjanashalakaya | cakshurunmilitam yena tasmai shriguruve namah || arunakirana jalam ramjita savakasha
    | vidhritajapamala vitika pustakahasta | itarakarakaradhya phullakalhara hasta | nivasatu hridi bala
    nityakalyanashila || atha shabarikavacajape viniyogah || || shri || || atha shabarikavacapathaprarambhah
    || om sarvavighnanashaya | sarvarishta nivaranaya | sarva saukhyapradaya | balanam buddhipradaya |
    nanaprakarakadhanavahana bhumipradaya | manovamchitaphalapradaya | raksham kuru kuru svaha | om guruve
    namah | om shrikrishnaya namah | om bala bhadraya namah | om shriramaya namah | om hanumate namah
    | om shivaya namah | om jagannathaya namah | om badrinarayanaya namah | om durgadevyai namah | om
    suryaya namah | om camdraya namah | om bhaumaya namah | om budhaya namah | om guruve namah | om bhrigave
    namah | om shanaishrvaraya namah | om rahave namah | om pucchanayakaya namah | om navagraha raksha
    kuru kuru namah | om manye varam hariharadaya evam drishtva | drishteshu hridayam tvayi toshametih
    | kim vikshitena bhavata bhuvi aena nanyah kashrcit mano harati natha bhavanata ehi | om namah shrimanbalabhadrajayavijaya
    aparajita bhadram bhadram kuru kuru svaha | om bhurbhuvah svah tatsaviturvarenyam bhargo devasya dhimahi
    | dhiyo yo nah pracodayat || sarvavighnashamti kuru kuru svaha | om aim
  devanagari: चक्र गदा पद्मधारिणी । मम वांछित सिद्धिं कुरु कुरु स्वाहा । ॐ नमो कमलवदन मोहिनी सर्वजनवशकारिणी
    साक्षात् । सूक्ष्मस्वरुपिणी यन्मम वशगा ॐ सुरातुरा भवेयुः स्वाहा । गुरुर्ब्रह्मा गुरुर्विष्णु गुरुर्देवो
    महेश्र्वरः । गुरु साक्षात् परब्रह्म तस्मै श्रीगुरुवे नमः ॥ अज्ञानतिमिरांधस्य ज्ञानांजनशलाकया । चक्षुरुन्मीलितं
    येन तस्मै श्रीगुरुवे नमः ॥ अरुणकिरण जालं रंजिता सावकाशा । विधृतजपमाला वीटिका पुस्तकहस्ता । इतरकरकराढ्या
    फुल्लकल्हार हस्ता । निवसतु हृदि बाला नित्यकल्याणशीला ॥ अथ शाबरीकवचजपे विनियोगः ॥ ॥ श्री ॥ ॥ अथ शाबरीकवचपाठप्रारंभः
    ॥ ॐ सर्वविघ्ननाशाय । सर्वारिष्ट निवारणाय । सर्व सौख्यप्रदाय । बालानां बुद्धिप्रदाय । नानाप्रकारकधनवाहन
    भूमिप्रदाय । मनोवांछितफलप्रदाय । रक्षां कुरु कुरु स्वाहा । ॐ गुरुवे नमः । ॐ श्रीकृष्णाय नमः । ॐ बल
    भद्राय नमः । ॐ श्रीरामाय नमः । ॐ हनुमते नमः । ॐ शिवाय नमः । ॐ जगन्नाथाय नमः । ॐ बद्रिनारायणाय नमः
    । ॐ दुर्गादेव्यै नमः । ॐ सूर्याय नमः । ॐ चंद्राय नमः । ॐ भौमाय नमः । ॐ बुधाय नमः । ॐ गुरुवे नमः ।
    ॐ भृगवे नमः । ॐ शनैश्र्वराय नमः । ॐ राहवे नमः । ॐ पुच्छनायकाय नमः । ॐ नवग्रह रक्षा कुरु कुरु नमः ।
    ॐ मन्ये वरं हरिहरादय एवं दृष्ट्वा । दृष्टेषु हृदयं त्वयि तोषमेतिः । किं वीक्षितेन भवता भुवि अेन नान्यः
    कश्र्चित् मनो हरति नाथ भवानत एहि । ॐ नमः श्रीमन्बलभद्रजयविजय अपराजित भद्रं भद्रं कुरु कुरु स्वाहा
    । ॐ भूर्भुवः स्वः तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि । धियो यो नः प्रचोदयात् ॥ सर्वविघ्नशांति कुरु
    कुरु स्वाहा । ॐ ऐं
