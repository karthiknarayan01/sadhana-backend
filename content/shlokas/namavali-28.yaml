    | om vikalayai namah | om vasumatyai namah | om vagalayai namah | om vamanyai devyai namah | om vishnupujyayai
    namah | om vinodinyai namah | 30 om vaishnavyai namah | om shishna matre namah | om varahyai namah
    | om brahmanyai namah | om varayai namah | om valavalavataye namah | om valayai namah | om vidheh
    paripujitayai namah | om vishishtayai namah | om brahmapujyayai namah | 40 om nanaveshavinodinyai
    namah | om vaikuntharupinyai namah | om brahmyai namah | om vidhipujyayai namah | om vidhuntudayai
    namah | om vallabhayai namah | om valarupayai namah | om ashesha valadharinyai namah | om vedajnayai
    namah | om vedamatre namah | 50 om vishala nayanojjvalayai namah | om vimatre namah | om vedagarbhayai
    namah | om vimokshanyai namah | om virupakshyai namah | om valayai namah | om valaye namah | om krishnavimalarupinyai
    namah | om varahyai namah | om valakayai namah | 60 om valinyai namah | om varnarupinyai namah | om
    gandhinyai namah | om gandharupayai namah | om gayagangaprabhayai namah | om govardhanyai namah |
    om govindapujitayai namah | om gadadharyai namah | om gahanayai namah | om guhyarupayai namah | 70
    om gorupayai namah | om gokuleshvaryai namah | om golokavasinyai namah | om nityayai golokarupinyai
    namah | om garimayai namah | om garishthayai namah | om nityayai govardhanarupinyai namah | om gangadharyai
    namah | om govindayai namah | om govindapujitayai namah | 80 om gadayai namah | om gahanayai guhyarupayai
    namah | om gandharupinyai namah | om ganarhayai namah | om ganadayai namah | om ganarupinyai namah
    | om gana mohinyai namah | om nilamalayai namah | om manonmattayai namah | om lalajihvayai namah |
    90 om lalatinyai namah | om anandarupinyai namah | om adyayai namah | om acaryayai namah | om svamshurupinyai
    namah | om murtaye namah | om mukhyarupayai namah | om mahamokshapradayinyai namah | om khelate namah
    | om khanjagamyai namah | 100 om khelayai namah | om khalakhalayai namah | om ishvaryai namah | om
    ishvararadhyayai namah | om akarayai namah | om omsvarupinyai namah | om varnayai namah | om vagalamukhyayai
    namah | 108 ashtottarashatam nama yah pathennityamuttamam | sarvasiddhishvaro bhutva deviputro bhavettu
    sah || trisandhyam yah pathennityam tasya siddhih prajayate | nanyatha phalabhagisyat kalpakotishatairapi
    || 18|| iti shrikalivilasatantre shodashapatale shrivagalamukhyah shatanamastotraddhrita ashtottarashatanamavalih
    samapta | om tatsat |
  devanagari: श्रीबगलाष्टोत्तरशतनामावलिः अस्याः श्रीवगला देव्याः शतनामस्तोत्रस्य श्रीसदाशिवऋषिर्गायत्रीछन्दः
    श्रीवगलामुखी देवता धर्मार्थकाममोक्षार्थसिद्धये विनियोगः । ॐ वशिन्यै नमः । ॐ वशपूज्यायै नमः । ॐ वलिकायै
    नमः । ॐ वसुदायै नमः । ॐ वसवे नमः । ॐ वाग्वादिन्यै नमः । ॐ वयोरूपायै नमः । ॐ बलाबलवतये नमः । ॐ विषमायै
    नमः । ॐ विकटायै नमः । १० ॐ वेधायै नमः । ॐ विशालायै नमः । ॐ विमनायै नमः । ॐ विधये नमः । ॐ विद्यायै
    नमः । ॐ वेदरूपायै नमः । ॐ बन्ध्यायै नमः । ॐ वेषधारिण्यै नमः । ॐ वेण्यै नमः । ॐ विकटायै नमः । २० ॐ
    वेश्यायै नमः । ॐ नानावेष परिच्छदायै नमः । ॐ वयोरूपायै नमः । ॐ वृद्धायै नमः । ॐ विकलायै नमः । ॐ वसुमत्यै
    नमः । ॐ वगलायै नमः । ॐ वामन्यै देव्यै नमः । ॐ विष्णुपूज्यायै नमः । ॐ विनोदिन्यै नमः । ३० ॐ वैष्णव्यै
    नमः । ॐ शिष्ण मात्रे नमः । ॐ वाराह्यै नमः । ॐ ब्राह्मण्यै नमः । ॐ वरायै नमः । ॐ वलावलवतये नमः । ॐ
    वालायै नमः । ॐ विधेः परिपूजितायै नमः । ॐ विशिष्टायै नमः । ॐ ब्रह्मपूज्यायै नमः । ४० ॐ नानावेषविनोदिन्यै
    नमः । ॐ वैकुण्ठरूपिण्यै नमः । ॐ ब्राह्म्यै नमः । ॐ विधिपूज्यायै नमः । ॐ विधुन्तुदायै नमः । ॐ वल्लभायै
    नमः । ॐ वलरूपायै नमः । ॐ अशेष वलधारिण्यै नमः । ॐ वेदज्ञायै नमः । ॐ वेदमात्रे नमः । ५० ॐ विशाल नयनोज्ज्वलायै
    नमः । ॐ विमात्रे नमः । ॐ वेदगर्भायै नमः । ॐ विमोक्षण्यै नमः । ॐ विरूपाक्ष्यै नमः । ॐ वलायै नमः । ॐ
    वालये नमः । ॐ कृष्णविमलरूपिण्यै नमः । ॐ वाराह्यै नमः । ॐ वलाकायै नमः । ६० ॐ वलिन्यै नमः । ॐ वर्णरूपिण्यै
    नमः । ॐ गन्धिन्यै नमः । ॐ गन्धरूपायै नमः । ॐ गयागङ्गाप्रभायै नमः । ॐ गोवर्धन्यै नमः । ॐ गोविन्दपूजितायै
    नमः । ॐ गदाधर्यै नमः । ॐ गहनायै नमः । ॐ गुह्यरूपायै नमः । ७० ॐ गोरूपायै नमः । ॐ गोकुलेश्वर्यै नमः
    । ॐ गोलोकवासिन्यै नमः । ॐ नित्यायै गोलोकरूपिण्यै नमः । ॐ गरिमायै नमः । ॐ गरिष्ठायै नमः । ॐ नित्यायै
    गोवर्धनरूपिण्यै नमः । ॐ गङ्गाधर्यै नमः । ॐ गोविन्दायै नमः । ॐ गोविन्दपूजितायै नमः । ८० ॐ गदायै नमः
    । ॐ गहनायै गुह्यरूपायै नमः । ॐ गन्धरूपिण्यै नमः । ॐ गणार्हायै नमः । ॐ गानदायै नमः । ॐ गानरूपिण्यै
    नमः । ॐ गण मोहिन्यै नमः । ॐ नीलमालायै नमः । ॐ मनोन्मत्तायै नमः । ॐ ललजिह्वायै नमः । ९० ॐ ललाटिन्यै
    नमः । ॐ आनन्दरूपिण्यै नमः । ॐ आद्यायै नमः । ॐ आचार्यायै नमः । ॐ स्वांशुरूपिण्यै नमः । ॐ मूर्तये नमः
    । ॐ मुख्यरूपायै नमः । ॐ महामोक्षप्रदायिन्यै नमः । ॐ खेलते नमः । ॐ खञ्जगाम्यै नमः । १०० ॐ खेलायै नमः
    । ॐ खलखलायै नमः । ॐ ईश्वर्यै नमः । ॐ ईश्वराराध्यायै नमः । ॐ अकारायै नमः । ॐ ॐस्वरूपिण्यै नमः । ॐ वर्णायै
    नमः । ॐ वगलामुख्यायै नमः । १०८ अष्टोत्तरशतं नाम यः पठेन्नित्यमुत्तमम् । सर्वसिद्धीश्वरो भूत्वा देवीपुत्रो
    भवेत्तु सः ॥ त्रिसन्ध्यं यः पठेन्नित्यं तस्य सिद्धिः प्रजायते । नान्यथा फलभागीस्यात् कल्पकोटिशतैरपि
    ॥ १८॥ इति श्रीकालीविलासतन्त्रे षोडशपटले श्रीवगलामुख्याः शतनामस्तोत्राद्धृता अष्टोत्तरशतनामावलिः समाप्ता
    । ॐ तत्सत् ।
