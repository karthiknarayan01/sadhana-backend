id: dhanalakshmi
category: stotram
name:
  english: dhanalakshmi
  devanagari: धनलक्ष्मी
content:
  english: pujayan parvativakyamidamaha maheshvarah | ucitam jagadambasi tava bhutanukampaya || 3|| sasitam
    sanujam ramam sanjaneyam sahanugam | pranamya paramanandam vakshye'ham stotramuttamam || 4|| dhanadam
    shraddadhananam sadyah sulabhakarakam | yogakshemakaram satyam satyameva vaco mama || 5|| pathantah
    pathayanto'pi brahmanairastikottamaih | dhanalabho bhavedashu nashameti daridrata || 6|| bhubhavamshabhavam
    bhutyai bhaktikalpalatam shubham | prarthayettam yathakamam kamadhenusvarupinim || 7|| dharmade dhanade
    devi danashile dayakare | tvam prasida maheshani
  devanagari: पूजयन् पार्वतीवाक्यमिदमाह महेश्वरः । उचितं जगदम्बासि तव भूतानुकम्पया ॥ ३॥ ससीतं सानुजं रामं
    साञ्जनेयं सहानुगम् । प्रणम्य परमानन्दं वक्ष्येऽहं स्तोत्रमुत्तमम् ॥ ४॥ धनदं श्रद्दधानानां सद्यः सुलभकारकम्
    । योगक्षेमकरं सत्यं सत्यमेव वचो मम ॥ ५॥ पठन्तः पाठयन्तोऽपि ब्राह्मणैरास्तिकोत्तमैः । धनलाभो भवेदाशु
    नाशमेति दरिद्रता ॥ ६॥ भूभवांशभवां भूत्यै भक्तिकल्पलतां शुभाम् । प्रार्थयेत्तां यथाकामं कामधेनुस्वरूपिणीम्
    ॥ ७॥ धर्मदे धनदे देवि दानशीले दयाकरे । त्वं प्रसीद महेशानि
