id: vishnukritam1savitristotram
category: stotram
name:
  english: vishnukritam1savitristotram
  devanagari: विष्णुकृतं१सावित्रीस्तोत्रम्
content:
  english: vishnukritam 1 savitristotram vishnuruvaca | namo'stu te mahadevi bhurbhuvahsvastrayimayi |
    savitri durgatarini tvam vani saptadha smrita || 115|| sarvani stutishastrani lakshanani tathaiva
    ca | bhavishya sarvashastranam tvam tu devi namo'stu te || 116|| shveta tvam shvetarupasi shashankena
    samanana | shashirashmiprakashena harinorasi rajase | divyakundalapurnabhyam shravanabhyam vibhushita
    || 117|| tvam siddhistvam tatha riddhih kirtih shrih santatirmatih | sandhya ratrih prabhatastvam
    kalaratristvameva ca || 118|| karshukanam yatha sita bhutanam dharini tatha || iti shriskandapurane
    prabhasakhande prabhasakshetramahatmye pancashashtyadhikashatatamadhyayantargatam vishnukritam savitristotram
    samaptam | skandapurana | prabhasakhanda | adhyaya 165
  devanagari: विष्णुकृतं १ सावित्रीस्तोत्रम् विष्णुरुवाच । नमोऽस्तु ते महादेवि भूर्भुवःस्वस्त्रयीमयि ।
    सावित्रि दुर्गतरिणि त्वं वाणी सप्तधा स्मृता ॥ ११५॥ सर्वाणि स्तुतिशास्त्राणि लक्षणानि तथैव च । भविष्या
    सर्वशास्त्राणां त्वं तु देवि नमोऽस्तु ते ॥ ११६॥ श्वेता त्वं श्वेतरूपासि शशाङ्केन समानना । शशिरश्मिप्रकाशेन
    हरिणोरसि राजसे । दिव्यकुण्डलपूर्णाभ्यां श्रवणाभ्यां विभूषिता ॥ ११७॥ त्वं सिद्धिस्त्वं तथा ऋद्धिः कीर्तिः
    श्रीः सन्ततिर्मतिः । सन्ध्या रात्रिः प्रभातस्त्वं कालरात्रिस्त्वमेव च ॥ ११८॥ कर्षुकाणां यथा सीता भूतानां
    धारिणी तथा ॥ इति श्रीस्कन्दपुराणे प्रभासखण्डे प्रभासक्षेत्रमाहात्म्ये पञ्चषष्ट्यधिकशततमाध्यायान्तर्गतं
    विष्णुकृतं सावित्रीस्तोत्रं समाप्तम् । स्कन्दपुराण । प्रभासखण्ड । अध्याय १६५
