id: sree-vaastu-ashtothara-sata-namavali
category: stotram
name:
  english: Sree Vaastu Ashtothara Sata Namavali
content:
  english: om vastu purushayanamah maha kayaya namah krishnangayanamah raktalocanayanamah urdhvasanayanamah
    ishtarthasiddhidayanamah grihadivastunidhayenamah prakriti shastrayanamah ajnanandhakaranirmulayanamah
    prapanca kridavinodayanamah pattana vastu nidhayenamah griha nirmana yogya sthaladhidevatayanamah
    nirmana shastradhikarayanamah | | manavashshreyonidhayenamah mandaravasa nirmanayanamah punya sthalavasanirmanayanamah
    utkrishtasthitikaranayanamah purva janma vasanayanamah dushphalita nivarana karakayanamah nirmana
    kaushala durandharayanamah | murdhne ishanayanamah dakshina bhuje indrayanamah dakshina kare savitrayanamah
    | | vama kare rudrayanamah nabhideshe mitraganayanamah dakshina vrishane indrayanamah vama vrishane
    jayantayanamah shilamandale vayubhyonamah | rajaka sthane vriddhi kshayayanamah carmakaraka sthanekshutpipasayanamah
    brahmana sthane janotsahakarayanamah shudra sthane dhanadhanya vriddhisthayanamah yogishvara sthanemahadavasthakarakayanamah
    gopaka sthane sarvasiddhipradayanamah kshatriaya sthane kalahapradayanamah cakrasthane roga karanayanamah
    agneyasthaneprathama sthambhayanamah | | caitramasa nirmane duhkhayanamah vaishakhamasa nirmane dravyavriddhidayanamah
    jyeshta masa nirmane mrityupradayanamah ashadhamasa nirmane pashunashanayanamah shravana masa nirmane
    pashu vriddhidayanamah bhadrapada masa nirmane sarva shunyayanamah ashvayuja masa nirmane kalahayanamah
    kartika masa nirmane mrityunashanayanamah margashira masa nirmane dhana dhanyavriddhidayanamah pushya
    masa nirmane agnibhayayanamah | | magha masa nirmane putra vriddhidayanamah phalguna masa nirmane
    svarnaratnapradayanamah sthirarashe uttamayanamah dvisvabhava rashe nishiddhayanamah shuklapakshe
    sukhadayanamah bahula pakshe corabhayayanamah caturdikshudvara grihevijayakhyayanamah | | harih om
    || manadandam karabjena vahantam bhumi shodhakam | vandeham vastu purusham shayanam shayane shubhe
    || || vastu purusha namastestu bhushayyadigata prabho | madgrihe dhana dhanyadi samriddhim kurume
    prabho || || panca vaktra jatajutam panca dasha vilocanam | sadyo jatananca svetam vasudevantu krishnakam
    || || aghoram raktavarnanca shariramhema varnakam | mahabahum mahakayam karna kundala manditam ||
    || pitambaram pushpamala nagayajnopavitinam | rudrakshamalabharanamvyaghracarmottariyakam || || akshamalanca
    padmanca naga shula pinakinam | damaram vina bananca shankha cakra karanvitam || || koti surya pratikashamsarva
    jiva dayavaram | deva devam mahadevam vishvakarma jagadgurum || || vastumurti paranjyotirvastu devah
    parashshivah | vastu devastu sarvesham vastu devam namamyaham ||
  devanagari: ॐ वास्तु पुरुषायनमः महा कायाय नमः कृष्णाङ्गायनमः रक्तलोचनायनमः ऊर्ध्वासनायनमः इष्टार्थसिद्धिदायनमः
    गृहादिवास्तुनिधयेनमः प्रकृति शास्त्रायनमः अज्ञानान्धकारनिर्मूलायनमः प्रपञ्च क्रीडाविनोदायनमः पट्टण
    वास्तु निधयेनमः गृह निर्माण योग्य स्थलाधिदेवतायनमः निर्माण शास्त्राधिकारायनमः । । मानवश्श्रेयोनिधयेनमः
    मन्दारावास निर्माणायनमः पुण्य स्थलावासनिर्माणायनमः उत्कृष्टस्थितिकारणायनमः पूर्व जन्म वासनायनमः दुष्फलित
    निवारण कारकायनमः निर्माण कौशल दुरन्धरायनमः । मूर्ध्ने ईशानायनमः दक्षिण भुजे इन्द्रायनमः दक्षिण करे
    सावित्रायनमः । । वाम करे रुद्रायनमः नाभिदेशे मित्रगणायनमः दक्षिण वृषणे इन्द्रायनमः वाम वृषणे जयन्तायनमः
    शीलमण्डले वायुभ्योनमः । रजक स्थाने वृद्धि क्षयायनमः चर्मकारक स्थानेक्षुत्पिपासायनमः ब्राह्मण स्थाने
    जनोत्साहकरायनमः शूद्र स्थाने धनधान्य वृद्धिस्थायनमः योगीश्वर स्थानेमहदावस्थकारकायनमः गोपक स्थाने सर्वसिद्धिप्रदायनमः
    क्षत्रिअय स्थाने कलहप्रदायनमः चक्रस्थाने रोग कारणायनमः आग्नेयस्थानेप्रथम स्थम्भायनमः । । चैत्रमास
    निर्माणे दुःखायनमः वैशाखमास निर्माणे द्रव्यवृद्धिदायनमः ज्येष्ट मास निर्माणे मृत्युप्रदायनमः आषाढमास
    निर्माणे पशुनाशनायनमः श्रावण मास निर्माणे पशु वृद्धिदायनमः भाद्रपद मास निर्माणे सर्व शून्यायनमः आश्वयुज
    मास निर्माणे कलहायनमः कार्तीक मास निर्माणे मृत्युनाशनायनमः मार्गशिर मास निर्माणे धन धान्यवृद्धिदायनमः
    पुष्य मास निर्माणे अग्निभयायनमः । । माघ मास निर्माणे पुत्र वृद्धिदायनमः फाल्गुण मास निर्माणे स्वर्णरत्नप्रदायनमः
    स्थिरराशे उत्तमायनमः द्विस्वभाव राशे निषिद्धायनमः शुक्लपक्षे सुखदायनमः बहुल पक्षे चोरभयायनमः चतुर्दिक्षुद्वार
    गृहेविजयाख्यायनमः । । हरिः ओम् ॥ मानदण्डं कराब्जेन वहन्तं भूमि शोधकम् । वन्देहं वास्तु पुरुषं शयानं
    शयने शुभे ॥ ॥ वास्तु पुरुष नमस्तेस्तु भूशय्यादिगत प्रभो । मद्गृहे धन धान्यादि समृद्धिं कुरुमे प्रभो
    ॥ ॥ पञ्च वक्त्र जटाजूटं पञ्च दश विलोचनम् । सद्यो जातानाञ्च स्वेतं वासुदेवन्तु कृष्णकम् ॥ ॥ अघोरं रक्तवर्णञ्च
    शरीरंहेम वर्णकम् । महाबाहुं महाकायं कर्ण कुण्डल मण्डितम् ॥ ॥ पीताम्बरं पुष्पमल नागयज्ञोपवीतिनम् ।
    रुद्राक्षमालाभरणंव्याघ्रचर्मोत्तरीयकम् ॥ ॥ अक्षमालाञ्च पद्मञ्च नाग शूल पिनाकिनाम् । डमरं वीण बाणञ्च
    शङ्ख चक्र करान्वितम् ॥ ॥ कोटि सूर्य प्रतीकाशंसर्व जीव दयावरम् । देव देवं महादेवं विश्वकर्म जगद्गुरुम्
    ॥ ॥ वास्तुमूर्ति परञ्ज्योतिर्वास्तु देवः परश्शिवः । वास्तु देवास्तु सर्वेषां वास्तु देवं नमाम्यहम्
    ॥
