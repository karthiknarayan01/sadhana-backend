id: ramanujasuprabhatam
category: stotram
name:
  english: ramanujasuprabhatam
  devanagari: रामानुजसुप्रभातम्
content:
  english: sharanam vihartum sangatya samsaranavarivilanghanotkah | ayanti hastakamalabhidhritopacarah
    tan pahi karunaya tava suprabhatam || 16|| snatum kaveratanayasalileshu shishyaih acaryapurushavaraih
    yatibhirvishuddhaih | shrivaishnavaishca saha sevya
  devanagari: शरणं विहर्तुं सङ्गत्य संसरणवारिविलङ्घनोत्काः । आयान्ति हस्तकमलाभिधृतोपचाराः तान् पाहि करुणया
    तव सुप्रभातम् ॥ १६॥ स्नातुं कवेरतनयासलिलेषु शिष्यैः आचार्यपूरुषवरैः यतिभिर्विशुद्धैः । श्रीवैष्णवैश्च
    सह सेव्य
meaning: {}
