    | bhaskareshvarahridbija bhaskareshvarahridvara || 144|| bhaskareshvarahridyoni
  devanagari: बालरविद्युतिमिन्दुकिरीटां तुङ्गकुचां नयनत्रययुक्ताम् । स्मेरमुखीं वरदाङ्कुशपाशाभीतिकरां
    प्रभजे भुवनेशीम् ॥ अथ श्रीभुवनेश्वरीभकारादिसहस्रनामस्तोत्रम् । ॐ भुवनेशी भुवाराघ्या भवानी भयनाशिनी
    । भवरूपा भवानन्दा भवसागरतारिणी ॥ १॥ भवोद्भवा भवरता भवभारनिवारिणी । भव्याना भव्यनयना भव्यरूपा भवौषधिः
    ॥ २॥ भव्याङ्गना भव्यकेशी भवपाशविमोचिनी । भव्यासना भव्यवस्त्रा भव्याभरणभूषिता ॥ ३॥ भगरूपा भगानन्दा
    भगेशी भगमालिनी । भगविद्या भगवती भगक्लिन्ना भगावहा ॥ ४॥ भगाङ्कुरा भगक्रीडा भगाद्या भगमङ्गला । भगलीला
    भगप्रीता भगसम्पद्भगेश्वरी ॥ ५॥ भगालया भगोत्साहा भगस्था भगपोषिणी । भगोत्सवा भगविद्या भगमाता भगस्थिता
    ॥ ६॥ भगशक्तिर्ब्भगनिधिब्भगपूजा भगेषणा । भगस्वापा भगाधीशा भगार्च्या भगसुन्दरी ॥ ७॥ भगरेखा भगस्नेहा
    भगस्नेहविवर्धिनी । भगिनी भगबीजस्था भगभोगविलासिनी ॥ ८॥ भगाचारा भगाधारा भगाकारा भगाश्रया । भगपुष्पा
    भगश्रीदा भगपुष्पनिवासिनी ॥ ९॥ भव्यरूपधरा भव्याभव्यपुष्पैरलङ्कृता । भव्यलीला भव्यमाला भव्याङ्गी भव्यसुन्दरी
    ॥ १०॥ भव्यशीला भव्यलीला भव्याक्षी भव्यनाशिनी । भव्याङ्गिका भव्यवाणी भव्यकान्तिर्ब्भगालिनी ॥ ११॥ भव्यत्रपा
    भव्यनदी भव्यभोगविहारिणी । भव्यस्तनी भव्यमुखी भव्यगोष्ठी भयापहा ॥ १२॥ भक्तेश्वरी भक्तिकरी भक्तानुग्रहकारिणी
    । भक्तिदा भक्तिजननी भक्तानन्दविवर्द्धिनी ॥ १३॥ भक्तिप्रिया भक्तिरता भक्तिभावविहारिणी । भक्तिशीला भक्तिलीला
    भक्तेशी भक्तिपालिनी ॥ १४॥ भक्तिविद्या भक्तविद्या भक्तिर्भक्तिविनोदिनी । भक्तिरीतिर्ब्भक्तिप्रीतिर्भक्तिसाधनसाधिनी
    ॥ १५॥ भक्तिसाध्या भक्तसाध्या भक्तिराली भवेश्वरी । भटविद्या भटानन्दा भटस्था भटरूपिणी ॥ १६॥ भटमान्या
    भटस्थान्या भटस्थाननिवासिनी । भटिनी भटरूपेशी भटरूपविवर्द्धिनी ॥ १७॥ भटवेशी भटेशी च भटभाग्भवसुन्दरी
    । भटप्रीत्या भटरीत्या भटानुग्रहकारिणी ॥ १८॥ भटाराध्या भटबोध्या भटबोधविनोदिनी । भटैस्सेव्या भटवरा भटार्च्च्या
    भटबोधिनी ॥ १९॥ भटकीर्त्त्या भटकला भटपा भटपालिनी । भटैश्वर्या भटाधीशा भटेक्षा भटतोषिणी ॥ २०॥ भटेशी
    भटजननी भटभाग्यविवर्द्धिनी । भटमुक्तिर्भटयुक्तिर्ब्भटप्रीतिविवर्द्धिनी ॥ २१॥ भाग्येशी भाग्यजननी भाग्यस्था
    भाग्यरूपिणी । भावनाभावकुशला भावदा भाववर्द्धिनी ॥ २२॥ भावरूपा भावरसा भावान्तरविहारिणी । भावाङ्कुरा
    भावकला भावस्थाननिवासिनी ॥ २३॥ भावातुरा भावधृता भावमध्यव्यवस्थिता । भावऋद्धिर्ब्भावसिद्धिर्ब्भावादिर्ब्भावभाविनी
    ॥ २४॥ भावालया भावपरा भावसाधनतत्परा । भावेश्वरी भावगम्या भावस्था भावगर्विता ॥ २५॥ भाविनी भावरमणी भारती
    भारतेश्वरी । भागीरथी भाग्यवती भाग्योदयकरीकला ॥ २६॥ भाग्याश्रया भाग्यमयी भाग्या भाग्यफलप्रदा । भाग्यचारा
    भाग्यसारा भाग्यधारा च भाग्यदा ॥ २७॥ भाग्येश्वरी भाग्यनिधिर्भाग्या भाग्यसुमातृका । भाग्येक्षा भाग्यना
    भाग्यभाग्यदा भाग्यमातृका ॥ २८॥ भाग्येक्षा भाग्यमनसा भाग्यादिर्भाग्यमध्यगा । भ्रातेश्वरी भ्रातृमती
    भ्रात्र्यम्बा भ्रातृपालिनी ॥ २९॥ भ्रातृस्था भ्रातृकुशला भ्रामरी भ्रमराम्बिका । भिल्लरूपा भिल्लवती
    भिल्लस्था भिल्लपालिनी ॥ ३०॥ भिल्लमाता भिल्लधात्री भिल्लिनी भिल्लकेश्वरी । भिल्लकीर्त्तिर्ब्भिल्लकला
    भिल्लमन्दिरवासिनी ॥ ३१॥ भिल्लक्रीडा भिल्ललीला भिल्लार्च्च्या भिल्लवल्लभा । भिल्लस्नुषा भिल्लपुत्री
    भिल्लिनी भिल्लपोषिणी ॥ ३२॥ भिल्लपौत्री भिल्लगोष्ठी भिल्लाचारनिवासिनी । भिल्लपूज्या भिल्लवाणी भिल्लानी
    भिल्लभीतिहा ॥ ३३॥ भीतस्था भीतजननी भीतिर्भीतिविनाशिनी । भीतिदा भीतिहा भीत्या भीत्याकारविहारिणी ॥ ३४॥
    भीतेशी भीतिशमनी भीतस्थाननिवासिनी । भीतिरीत्या भीतिकला भीतीक्षा भीतिहारिणी ॥ ३५॥ भीमेशी भीमजननी भीमा
    भीमनिवासिनी । भीमेश्वरी भीमरता भीमाङ्गी भीमपालिनी ॥ ३६॥ भीमनादी भीमतन्त्री भीमैश्वर्यविवर्द्धिनी ।
    भीमगोष्ठी भीमधात्री भीमविद्याविनोदिनी ॥ ३७॥ भीमविक्रमदात्री च भीमविक्रमवासिनी । भीमानन्दकरीदेवी भीमानन्दविहारिणी
    ॥ ३८॥ भीमोपदेशिनी नित्या भीमभाग्यप्रदायिनी । भीमसिद्धिर्ब्भीमऋद्धिर्ब्भीमभक्तिविवर्द्धिनी ॥ ३९॥ भीमस्था
    भीमवरदा भीमधर्मोपदेशिनी । भीष्मेश्वरी भीष्मभृती भीष्मबोधप्रबोधिनी ॥ ४०॥ भीष्मश्रीर्ब्भीष्मजननी भीष्मज्ञानोपदेशिनी
    । भीष्मस्था भीष्मतपसा भीष्मेशी भीष्मतारिणी ॥ ४१॥ भीष्मलीला भीष्मशीला भीष्मरोदिनिवासिनी । भीष्माश्रया
    भीष्मवरा भीष्महर्षविवर्द्धिनी ॥ ४२॥ भुवना भुवनेशानी भुवनानन्दकारिणी । भुविस्था भुविरूपा च भुविभारनिवारिणी
    ॥ ४३॥ भुक्तिस्था भुक्तिदा भुक्तिर्ब्भुक्तेशी भुक्तिरूपिणी । भुक्तेश्वरी भुक्तिदात्री भुक्तिराकाररूपिणी
    ॥ ४४॥ भुजङ्गस्था भुजङ्गेशी भुजङ्गाकाररूपिणी । भुजङ्गी भुजगावासा भुजङ्गानन्ददायिनी ॥ ४५॥ भूतेशी भूतजननी
    भूतस्था भूतरूपिणी । भूतेश्वरी भूतलीला भूतवेषकरी सदा ॥ ४६॥ भूतदात्री भूतकेशी भूतधात्री महेश्वरी । भूतरीत्या
    भूतपत्नी भूतलोकनिवासिनी ॥ ४७॥ भूतसिद्धिर्ब्भूतऋद्धिर्भूतानन्दनिवासिनी । भूतकीर्त्तिर्ब्भूतलक्ष्मीर्ब्भूतभाग्यविवर्द्धिनी
    ॥ ४८॥ भूतार्च्च्या भूतरमणी भूतविद्याविनोदिनी । भूतपौत्री भूतपुत्री भूतभार्याविधीश्वरी ॥ ४९॥ भूपस्था
    भूपरमणी भूतेशी भूपपालिनी । भूपमाता भूपनिभा भूपैश्वर्यप्रदायिनी ॥ ५०॥ भूपचेष्टा भूपनेष्ठा भूपभावविवर्द्धिनी
    । भूपस्वसा भूपभूरी भूपपौत्री तथा वधूः ॥ ५१॥ भूपकीर्त्तिर्ब्भूपनीतिर्ब्भूपभाग्यविवर्द्धिनी । भूपक्रिया
    भूपक्रीडा भूपमन्दरवासिनी ॥ ५२॥ भूपार्च्च्या भूपसंराध्या भूपभोगविवर्द्धिनी । भूपाश्रया भूपकला भूपकौतुकदण्डिनी
    ॥ ५३॥ भूषणस्था भूषणेशी भूषा भूषणधारिणी । भूषणाधारधर्मेशी भूषणाकाररूपिणी ॥ ५४॥ भूपताचारनिलया भूपताचारभूषिता
    । भूपताचाररचना भूपताचारमण्डिता ॥ ५५॥ भूपताचारधर्मेशी भूपताचारकारिणी । भूपताचारचरिता भूपताचारवर्जिता
    ॥ ५६॥ भूपताचारवृद्धिस्था भूपताचारवृद्धिदा । भूपताचारकरणा भूपताचारकर्मदा ॥ ५७॥ भूपताचारकर्मेशी भूपताचारकर्मदा
    । भूपताचारदेहस्था भूपताचारकर्मिणी ॥ ५८॥ भूपताचारसिद्धिस्था भूपताचारसिद्धिदा । भूपताचारधर्माणी भूपताचारधारिणी
    ॥ ५९॥ भूपतानन्दलहरी भूपतेश्वररूपिणी । भूपतेर्न्नीतिनीतिस्था भूपतिस्थानवासिनी ॥ ६०॥ भूपतिस्थानगीर्वाणी
    भूपतेर्वरधारिणी । भेषजानन्दलहरी भेषजानन्दरूपिणी ॥ ६१॥ भेषजानन्दमहिषी भेषजानन्दधारिणी । भेषजानन्दकर्मेशी
    भेषजानन्ददायिनी ॥ ६२॥ भैषजी भैषजाकन्दा भेषजस्थानवासिनी । भेषजेश्वररूपा च भेषजेश्वरसिद्धिदा ॥ ६३॥ भेषजेश्वरधर्मेशी
    भेषजेश्वरकर्मदा । भेषजेश्वरकर्मेशी भेषजेश्वरकर्मिणी ॥ ६४॥ भेषजाधीशजननी भेषजाधीशपालिनी । भेषजाधीशरचना
    भेषजाधीशमङ्गला ॥ ६५॥ भेषजारण्यमध्यस्था भेषजारण्यरक्षिणी । भैषज्यविद्या भैषज्या भैषज्येप्सितदायिनी
    ॥ ६६॥ भैषज्यस्था भैषजेशी भैषज्यानन्दवर्द्धिनी । भैरवी भैरवीचारा भैरवाकाररूपिणी ॥ ६७॥ भैरवाचारचतुरा
    भैरवाचारमण्डिता । भैरवा भैरवेशी च भैरवानन्ददायिनी ॥ ६८॥ भैरवानन्दरूपेशी भैरवानन्दरूपिणी । भैरवानन्दनिपुणा
    भैरवानन्दमन्दिरा ॥ ६९॥ भैरवानन्दतत्त्वज्ञा भैरवानन्दतत्परा । भैरवानन्दकुशला भैरवानन्दनीतिदा ॥ ७०॥
    भैरवानन्दप्रीतिस्था भैरवानन्दप्रीतिदा । भैरवानन्दमहिषी भैरवानन्दमालिनी ॥ ७१॥ भैरवानन्दमतिदा भैरवानन्दमातृका
    । भैरवाधारजननी भैरवाधाररक्षिणी ॥ ७२॥ भैरवाधाररूपेशी भैरवाधाररूपिणी । भैरवाधारनिचया भैरवाधारनिश्चया
    ॥ ७३॥ भैरवाधारतत्त्वज्ञा भैरवाधारतत्त्वदा । भैरवाश्रयतन्त्रेशी भैरवाश्रयमन्त्रिणी ॥ ७४॥ भैरवाश्रयरचना
    भैरवाश्रयरञ्जिता । भैरवाश्रयनिर्द्धारा भैरवाश्रयनिर्ब्भरा ॥ ७५॥ भैरवाश्रयनिर्द्धारा भैरवाश्रयनिर्द्धरा
    । भैरवानन्दबोधेशी भैरवानन्दबोधिनी ॥ ७६॥ भैरवानन्दबोधस्था भैरवानन्दबोधदा । भैरव्यैश्वर्यवरदा भैरव्यैश्वर्यदायिनी
    ॥ ७७॥ भैरव्यैश्वर्यरचना भैरव्यैश्वर्यवर्द्धिनी । भैरव्यैश्वर्यसिद्धिस्था भैरव्यैश्वर्यसिद्धिदा ॥ ७८॥
    भैरव्यैश्वर्यसिद्धेशी भैरव्यैश्वर्यरूपिणी । भैरव्यैश्वर्यसुपथा भैरव्यैश्वर्यसुप्रभा ॥ ७९॥ भैरव्यैश्वर्यवृद्धिस्था
    भैरव्यैश्वर्यवृद्धिदा । भैरव्यैश्वर्यकुशला भैरव्यैश्वर्यकामदा ॥ ८०॥ भैरव्यैश्वर्यसुलभा भैरव्यैश्वर्यसम्प्रदा
    । भैरव्यैश्वर्यविशदा भैरव्यैश्वर्यविक्रिया ॥ ८१॥ भैरव्यैश्वर्यविनया भैरव्यैश्वर्यवेदिता । भैरव्यैश्वर्यमहिमा
    भैरव्यैश्वर्यमानिनी ॥ ८२॥ भैरव्यैश्वर्यनिरता भैरव्यैश्वर्यनिर्मिता । भोगेश्वरी भोगमाता भोगस्था भोगरक्षिणी
    ॥ ८३॥ भोगक्रीडा भोगलीला भोगेशी भोगवर्द्धिनी । भोगाङ्गी भोगरमणी भोगाचारविचारिणी ॥ ८४॥ भोगाश्रया भोगवती
    भोगिनी भोगरूपिणी । भोगाङ्कुरा भोगविधा भोगाधारनिवासिनी ॥ ८५॥ भोगाम्बिका भोगरता भोगसिद्धिविधायिनी ।
    भोजस्था भोजनिरता भोजनानन्ददायिनी ॥ ८६॥ भोजनानन्दलहरी भोजनान्तर्विहारिणी । भोजनानन्दमहिमा भोजनानन्दभोग्यदा
    ॥ ८७॥ भोजनानन्दरचना भोजनानन्दहर्षिता । भोजनाचारचतुरा भोजनाचारमण्डिता ॥ ८८॥ भोजनाचारचरिता भोजनाचारचर्चिता
    । भोजनाचारसम्पन्ना भोजनाचारसंयुता ॥ ८९॥ भोजनाचारचित्तस्था भोजनाचाररीतिदा । भोजनाचारविभवा भोजनाचारविस्तृता
    ॥ ९०॥ भोजनाचाररमणी भोजनाचाररक्षिणी । भोजनाचारहरिणी भोजनाचारभक्षिणी ॥ ९१॥ भोजनाचारसुखदा भोजनाचारसुस्पृहा
    । भोजनाहारसुरसा भोजनाहारसुन्दरी ॥ ९२॥ भोजनाहारचरिता भोजनाहारचञ्चला । भोजनास्वादविभवा भोजनास्वादवल्लभा
    ॥ ९३॥ भोजनास्वादसन्तुष्टा भोजनास्वादसम्प्रदा । भोजनास्वादसुपथा भोजनास्वादसंश्रया ॥ ९४॥ भोजनास्वादनिरता
    भोजनास्वादनिर्णिता । भौक्षरा भौक्षरेशानी भौकाराक्षररूपिणी ॥ ९५॥ भौक्षरस्था भौक्षरादिर्ब्भौक्षरस्थानवासिनी
    । भङ्कारी भर्म्मिणी भर्मी भस्मेशी भस्मरूपिणी ॥ ९६॥ भङ्कारा भञ्चना भस्मा भस्मस्था भस्मवासिनी । भक्षरी
    भक्षराकारा भक्षरस्थानवासिनी ॥ ९७॥ भक्षराढ्या भक्षरेशी भरूपा भस्वरूपिणी । भूधरस्था भूधरेशी भूधरी भूधरेश्वरी
    ॥ ९८॥ भूधरानन्दरमणी भूधरानन्दपालिनी । भूधरानन्दजननी भूधरानन्दवासिनी ॥ ९९॥ भूधरानन्दरमणी भूधरानन्दरक्षिता
    । भूधरानन्दमहिमा भूधरानन्दमन्दिरा ॥ १००॥ भूधरानन्दसर्वेशी भूधरानन्दसर्वसूः । भूधरानन्दमहिषी भूधरानन्ददायिनी
    ॥ १०१॥ भूधराधीशधर्मेशी भूधरानन्दधर्मिणी । भूधराधीशधर्मेशी भूधराधीशसिद्धिदा ॥ १०२॥ भूधराधीशकर्मेशी
    भूधराधीशकामिनी । भूधराधीशनिरता भूधराधीशनिर्णिता ॥ १०३॥ भूधराधीशनीतिस्था भूधराधीशनीतिदा । भूधराधीशभाग्येशी
    भूधराधीशभामिनी ॥ १०४॥ भूधराधीशबुद्धिस्था भूधराधीशबुद्धिदा । भूधराधीशवरदा भूधराधीशवन्दिता ॥ १०५॥ भूधराधीशाऽराध्या
    च भूधराधीशचर्चिता । भङ्गेश्वरी भङ्गमयी भङ्गस्था भङ्गरूपिणी ॥ १०६॥ भङ्गाक्षता भङ्गरता भङ्गार्च्च्या
    भङ्गरक्षिणी । भङ्गावती भङ्गलीला भङ्गभोगविलासिनी ॥ १०७॥ भङ्गरङ्गप्रतीकाशा भङ्गरङ्गनिवासिनी । भङ्गाशिनी
    भङ्गमूली भङ्गभोगविधायिनी ॥ १०८॥ भङ्गाश्रया भङ्गबीजा भङ्गबीजाङ्कुरेश्वरी । भङ्गयन्त्रचमत्कारा भङ्गयन्त्रेश्वरी
    तथा ॥ १०९॥ भङ्गयन्त्रविमोहिस्था भङ्गयन्त्रविनोदिनी । भङ्गयन्त्रविचारस्था भङ्गयन्त्रविचारिणी ॥ ११०॥
    भङ्गयन्त्ररसानन्दा भङ्गयन्त्ररसेश्वरी । भङ्गयन्त्ररसस्वादा भङ्गयन्त्ररसस्थिता ॥ १११॥ भङ्गयन्त्ररसाधारा
    भङ्गयन्त्ररसाश्रया । भूधरात्मजरूपेशी भूधरात्मजरूपिणी ॥ ११२॥ भूधरात्मजयोगेशी भूधरात्मजपालिनी । भूधरात्मजमहिमा
    भूधरात्मजमालिनी ॥ ११३॥ भूधरात्मजभूतेशी भूधरात्मजरूपिणी । भूधरात्मजसिद्धिस्था भूधरात्मजसिद्धिदा ॥ ११४॥
    भूधरात्मजभावेशी भूधरात्मजभाविनी । भूधरात्मजभोगस्था भुधरात्मजभोगदा ॥ ११५॥ भूधरात्मजभोगेशी भूधरात्मजभोगिनी
    । भव्या भव्यतरा भव्याभाविनी भववल्लभा ॥ ११६॥ भावातिभावा भावाख्या भातिभा भीतिभान्तिका । भासान्तिभासा
    भासस्था भासाभा भास्करोपमा ॥ ११७॥ भास्करस्था भास्करेशी भास्करैश्वर्यवर्द्धिनी । भास्करानन्दजननी भास्करानन्ददायिनी
    ॥ ११८॥ भास्करानन्दमहिमा भास्करानन्दमातृका । भास्करानन्दनैश्वर्या भास्करानन्दनेश्वरा ॥ ११९॥ भास्करानन्दसुपथा
    भास्करानन्दसुप्रभा । भास्करानन्दनिचया भास्करानन्दनिर्मिता ॥ १२०॥ भास्करानन्दनीतिस्था भास्करानन्दनीतिदा
    । भास्करोदयमध्यस्था भास्करोदयमध्यगा ॥ १२१॥ भास्करोदयतेजःस्था भास्करोदयतेजसा । भास्कराचारचतुरा भास्कराचारचन्द्रिका
    ॥ १२२॥ भास्कराचारपरमा भास्कराचारचण्डिका । भास्कराचारपरमा भास्कराचारपारदा ॥ १२३॥ भास्कराचारमुक्तिस्था
    भास्कराचारमुक्तिदा । भास्कराचारसिद्धिस्था भास्कराचारसिद्धिदा ॥ १२४॥ भास्कराचरणाधारा भास्कराचरणाश्रिता
    । भास्कराचारमन्त्रेशी भास्कराचारमन्त्रिणी ॥ १२५॥ भास्कराचारवित्तेशी भास्कराचारचित्रिणी । भास्कराधारधर्मेशी
    भास्कराधारधारिणी ॥ १२६॥ भास्कराधाररचना भास्कराधाररक्षिता । भास्कराधारकर्माणी भास्कराधारकर्मदा ॥ १२७॥
    भास्कराधाररूपेशी भास्कराधाररूपिणी । भास्कराधारकाम्येशी भास्काराधारकामिनी ॥ १२८॥ भास्कराधारसांशेशी
    भास्कराधारसांशिनी । भास्कराधारधर्मेशी भास्कराधारधामिनी ॥ १२९॥ भास्कराधारचक्रस्था भास्कराधारचक्रिणी
    । भास्करेश्वरक्षत्रेशी भास्करेश्वरक्षत्रिणी ॥ १३०॥ भास्करेश्वरजननी भास्करेश्वरपालिनी । भास्करेश्वरसर्वेशी
    भास्करेश्वरशर्वरी ॥ १३१॥ भास्करेश्वरसद्भीमा भास्करेश्वरसन्निभा । भास्करेश्वरसुपथा भास्करेश्वरसुप्रभा
    ॥ १३२॥ भास्करेश्वरयुवती भास्करेश्वरसुन्दरी । भास्करेश्वरमूर्तेशी भास्करेश्वरमूर्तिनी ॥ १३३॥ भास्करेश्वरमित्रेशी
    भास्करेश्वरमन्त्रिणी । भास्करेश्वरसानन्दा भास्करेश्वरसाश्रया ॥ १३४॥ भास्करेश्वरचित्रस्था भास्करेश्वरचित्रदा
    । भास्करेश्वरचित्रेशी भास्करेश्वरचित्रिणी ॥ १३५॥ भास्करेश्वरभाग्यस्था भास्करेश्वरभाग्यदा । भास्करेश्वरभाग्येशी
    भास्करेश्वरभाविनी ॥ १३६॥ भास्करेश्वरकीर्त्त्येशी भास्करेश्वरकीर्तिनी । भास्करेश्वरकीर्तिस्था भास्करेश्वरकीर्तिदा
    ॥ १३७॥ भास्करेश्वरकरुणा भास्करेश्वरकारिणी । भास्करेश्वरगीर्वाणी भास्करेश्वरगारुडी ॥ १३८॥ भास्करेश्वरदेहस्था
    भास्करेश्वरदेहदा । भास्करेश्वरनादस्था भास्करेश्वरनादिनी ॥ १३९॥ भास्करेश्वरनादेशी भास्करेश्वरनादिनी
    । भास्करेश्वरकोशस्था भास्करेश्वरकोशदा ॥ १४०॥ भास्करेश्वरकोशेशी भास्करेश्वरकोशिनी । भास्करेश्वरशक्तिस्था
    भास्करेश्वरशक्तिदा ॥ १४१॥ भास्करेश्वरतोषेशी भास्करेश्वरतोषिणी । भास्करेश्वरक्षेत्रेशी भास्करेश्वरक्षेत्रिणी
    ॥ १४२॥ भास्करेश्वरयोगस्था भास्करेश्वरयोगदा । भास्करेश्वरयोगेशी भास्करेश्वरयोगिनी ॥ १४३॥ भास्करेश्वरपद्मेशी
    भास्करेश्वरपद्मिनी । भास्करेश्वरहृद्बीजा भास्करेश्वरहृद्वरा ॥ १४४॥ भास्करेश्वरहृद्योनि
