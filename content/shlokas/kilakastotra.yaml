id: kilakastotra
category: stotram
name:
  english: kilakastotra
  devanagari: कीलकस्तोत्र
content:
  english: shrijagadambaprityartham saptashatipathangatvena jape viniyogah | om namashcandikayai | markandeya
    uvaca | om vishuddhajnanadehaya trivedidivyacakshushe | shreyahpraptinimittaya namah somardhadharine
    || 1|| sarvametadvijaniyanmantranamapi kilakam | so'pi kshemamavapnoti satatam japyatatparah || 2||
    siddhyantyuccatanadini karmani sakalanyapi | etena stuvatam devim stotravrindena bhaktitah || 3||
    na mantro naushadham tasya na kincidapi vidyate | vina japyena siddhyettu sarvamuccatanadikam || 4||
    samagranyapi setsyanti lokashankamimam harah | kritva nimantrayamasa sarvamevamidam shubham || 5||
    stotram vai candikayastu tacca guhyam cakara sah | samapnoti sa punyena tam yathavannimantranam ||
    6|| so'pi kshemamavapnoti sarvameva na samshayah | krishnayam va caturdashyamashtamyam va samahitah
    || 7|| dadati pratigrihnati nanyathaisha prasidati | ittham rupena kilena mahadevena kilitam || 8||
    yo nishkilam vidhayainam candim japati nityashah | sa siddhah sa ganah so'tha gandharvo jayate dhruvam
    || 9|| na caivapatavam tasya bhayam kvapi na jayate | napamrityuvasham yati mrite ca mokshamapnuyat
    || 10|| jnatva prarabhya kurvita hyakurvano vinashyati | tato jnatvaiva sampurnamidam prarabhyate
    budhaih || 11|| saubhagyadi ca yatkincid drishyate lalanajane | tatsarvam tatprasadena tena japyamidam
    shubham || 12|| shanaistu japyamane'smin stotre sampattiruccakaih | bhavatyeva samagrapi tatah prarabhyameva
    tat || 13|| aishvaryam tatprasadena saubhagyarogyameva ca | shatruhanih paro mokshah stuyate sa na
    kim janaih || 14|| candikam hridayenapi yah smaret satatam narah | hridyam kamamavapnoti hridi devi
    sada vaset || 15|| agrato'mum mahadevakritam kilakavaranam | nishkilanca tatha kritva pathitavyam
    samahitaih || 16|| || iti shribhagavatyah kilakastotram samaptam ||
  devanagari: श्रीजगदम्बाप्रीत्यर्थं सप्तशतीपाठाङ्गत्वेन जपे विनियोगः । ॐ नमश्चण्डिकायै । मार्कण्डेय उवाच
    । ॐ विशुद्धज्ञानदेहाय त्रिवेदीदिव्यचक्षुषे । श्रेयःप्राप्तिनिमित्ताय नमः सोमार्धधारिणे ॥ १॥ सर्वमेतद्विजानीयान्मन्त्राणामपि
    कीलकम् । सोऽपि क्षेममवाप्नोति सततं जप्यतत्परः ॥ २॥ सिद्ध्यन्त्युच्चाटनादीनि कर्माणि सकलान्यपि । एतेन
    स्तुवतां देवीं स्तोत्रवृन्देन भक्तितः ॥ ३॥ न मन्त्रो नौषधं तस्य न किञ्चिदपि विद्यते । विना जप्येन
    सिद्ध्येत्तु सर्वमुच्चाटनादिकम् ॥ ४॥ समग्राण्यपि सेत्स्यन्ति लोकशङ्कामिमां हरः । कृत्वा निमन्त्रयामास
    सर्वमेवमिदं शुभम् ॥ ५॥ स्तोत्रं वै चण्डिकायास्तु तच्च गुह्यं चकार सः । समाप्नोति स पुण्येन तां यथावन्निमन्त्रणाम्
    ॥ ६॥ सोऽपि क्षेममवाप्नोति सर्वमेव न संशयः । कृष्णायां वा चतुर्दश्यामष्टम्यां वा समाहितः ॥ ७॥ ददाति
    प्रतिगृह्णाति नान्यथैषा प्रसीदति । इत्थं रूपेण कीलेन महादेवेन कीलितम् ॥ ८॥ यो निष्कीलां विधायैनां
    चण्डीं जपति नित्यशः । स सिद्धः स गणः सोऽथ गन्धर्वो जायते ध्रुवम् ॥ ९॥ न चैवापाटवं तस्य भयं क्वापि
    न जायते । नापमृत्युवशं याति मृते च मोक्षमाप्नुयात् ॥ १०॥ ज्ञात्वा प्रारभ्य कुर्वीत ह्यकुर्वाणो विनश्यति
    । ततो ज्ञात्वैव सम्पूर्णमिदं प्रारभ्यते बुधैः ॥ ११॥ सौभाग्यादि च यत्किञ्चिद् दृश्यते ललनाजने । तत्सर्वं
    तत्प्रसादेन तेन जप्यमिदम् शुभम् ॥ १२॥ शनैस्तु जप्यमानेऽस्मिन् स्तोत्रे सम्पत्तिरुच्चकैः । भवत्येव
    समग्रापि ततः प्रारभ्यमेव तत् ॥ १३॥ ऐश्वर्यं तत्प्रसादेन सौभाग्यारोग्यमेव च । शत्रुहानिः परो मोक्षः
    स्तूयते सा न किं जनैः ॥ १४॥ चण्डिकां हृदयेनापि यः स्मरेत् सततं नरः । हृद्यं काममवाप्नोति हृदि देवी
    सदा वसेत् ॥ १५॥ अग्रतोऽमुं महादेवकृतं कीलकवारणम् । निष्कीलञ्च तथा कृत्वा पठितव्यं समाहितैः ॥ १६॥ ॥
    इति श्रीभगवत्याः कीलकस्तोत्रं समाप्तम् ॥
