id: shridhishagitahindi
category: upanishad
name:
  english: shridhishagitahindi
  devanagari: श्रीधीशगीताःइन्दि
content:
  english: maim karanabrahmarupa se eka advitiya hokara bhi anamta hu~ yaha satya hai isamem samdeha nahim
    || 59 || karyabrahmarupa se samkhya mem anamta hone ke karana meri vibhutiyom ki koi bhi samkhya nahi
    kara sakta || 60 || kevala apa vipravarom ke kalyanartha hi digdarshanarupa se apa logom se yaha kucha
    varnana kiya hai || 61 || apa mere hridayagrahi upadesha ko apane hridaya mem niramtara rakhakara
    meri upasana mem rata hokara uttama mokshapada ko prapta hom || 62 || he vipro
  devanagari: मैं कारणब्रह्मरूप से एक अद्वितीय होकर भी अनंत हूँ यह सत्य है इसमें संदेह नहीं ॥ ५९ ॥ कार्यब्रह्मरूप
    से संख्या में अनंत होने के कारण मेरी विभूतियों की कोई भी संख्या नही कर सक्ता ॥ ६० ॥ केवल आप विप्रवरों
    के कल्याणार्थ ही दिग्दर्शनरूप से आप लोगों से यह कुछ वर्णन किया है ॥ ६१ ॥ आप मेरे हृदयग्राही उपदेश
    को अपने हृदय में निरंतर रखकर मेरी उपासना में रत होकर उत्तम मोक्षपद को प्राप्त हों ॥ ६२ ॥ हे विप्रो
meaning: {}
