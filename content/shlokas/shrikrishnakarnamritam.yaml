id: shrikrishnakarnamritam
category: stotram
name:
  english: shrikrishnakarnamritam
  devanagari: श्रीकृष्णकर्णामृतम्
content:
  english: angulya kah kavatam praharati kutile madhavah kim vasanto no cakri kim kulalo na hi dharanidharah
    kim dvijihvah phanindrah| naham ghorahimardi kimasi khagapatirno harih kim kapindrah ityevam gopakanyaprativacanajitah
    patu vashcakrapanih||
  devanagari: अङ्गुल्या कः कवाटं प्रहरति कुटिले माधवः किं वसन्तो नो चक्री किं कुलालो न हि धरणिधरः किं
    द्विजिह्वः फणीन्द्रः। नाहं घोराहिमर्दी किमसि खगपतिर्नो हरिः किं कपीन्द्रः इत्येवं गोपकन्याप्रतिवचनजितः
    पातु वश्चक्रपाणिः॥
meaning: {}
