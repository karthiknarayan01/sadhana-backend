id: bhartruhari-sataka-trisati-neeti-satakam
category: stotram
name:
  english: Bhartruhari Sataka Trisati - Neeti Satakam
content:
  english: dikkaladyanavacchinnanantacinmatramurtaye | svanubhutyekamanaya namah shantaya tejase || ||
    boddharo matsaragrastah prabhavah smayadushitah | abodhopahatah canye jirnamange subhashitam || ||
    ajnah sukham aradhyah sukhataram aradhyate visheshajnah | jnanalavadurvidagdham brahmapi tam naram
    na ranjayati || || prasahya manim uddharenmakaravaktradamshtrantarat samudram api santaretpracaladurmimalakulam
    | bhujangam api kopitam shirasi pushpavaddharayet na tu pratinivishtamurkhajanacittam aradhayet ||
    || labheta sikatasu tailam api yatnatah pidayan pibecca mrigatrishnikasu salilam pipasarditah | kvacidapi
    paryatanshashavishanam asadayet na tu pratinivishtamurkhacittam aradhayet || || vyalam balamrinalatantubhirasau
    roddhum samujjrimbhate chettum vajramanim shirishakusumaprantena sannahyati | madhuryam madhubinduna
    racayitum ksharambudherihate netum vanchati yah khalanpathi satam suktaih sudhasyandibhih || || svayattam
    ekantagunam vidhatra vinirmitam chadanam ajnatayah | visheshatah sarvavidam samaje vibhushanam maunam
    apanditanam || || yada kincijjno'ham dvipa iva madandhah samabhavam tada sarvajno'smityabhavadavaliptam
    mama manah yada kincitkincidbudhajanasakashadavagatam tada murkho'smiti jvara iva mado me vyapagatah
    || || krimikulacitam lalaklinnam vigandhijugupsitam nirupamarasam pritya khadannarasthi niramisham
    | surapatim api shva parshvastham vilokya na shankate na hi ganayati kshudro jantuh parigrahaphalgutam
    || || shirah sharvam svargatpashupatishirastah kshitidharam mahidhraduttungadavanim avaneshcapi jaladhim
    | adho'dho gangeyam padam upagata stokam athavavivekabhrashtanam bhavati vinipatah shatamukhah ||
    || shakyo varayitum jalena hutabhukcchatrena suryatapo nagendro nishitankushena samado dandena gogardabhau
    | vyadhirbheshajasangrahaishca vividhairmantraprayogairvisham sarvasyaushadham asti shastravihitam
    murkhasya nastyaushadham || || sahityasangitakalavihinah sakshatpashuh pucchavishanahinah | trinam
    na khadannapi jivamanas tadbhagadheyam paramam pashunam || || yesham na vidya na tapo na danam jnanam
    na shilam na guno na dharmah | te martyaloke bhuvi bharabhuta manushyarupena mrigashcaranti || ||
    varam parvatadurgeshu bhrantam vanacaraih saha na murkhajanasamparkah surendrabhavaneshvapi || ||
    shastropaskritashabdasundaragirah shishyapradeyagama vikhyatah kavayo vasanti vishaye yasya prabhornirdhanah
    | tajjadyam vasudhadhipasya kavayastvartham vinapishvarah kutsyah syuh kuparikshaka hi manayo yairarghatah
    patitah || || harturyati na gocaram kim api sham pushnati yatsarvada'py arthibhyah pratipadyamanam
    anisham prapnoti vriddhim param | kalpanteshvapi na prayati nidhanam vidyakhyam antardhanam yesham
    tanprati manam ujjhata nripah kastaih saha spardhate || || adhigataparamarthanpanditanmavamamsthas
    trinam iva laghu lakshmirnaiva tansamrunaddhi | abhinavamadalekhashyamagandasthalanam na bhavati bisatanturvaranam
    varananam || || ambhojinivanaviharavilasam eva hamsasya hanti nitaram kupito vidhata | na tvasya dugdhajalabhedavidhau
    prasiddham vaidagdhikirtim apahartum asau samarthah || || keyurani na bhushayanti purusham hara na
    candrojjvala na snanam na vilepanam na kusumam nalankrita murdhajah | vanyeka samalankaroti purusham
    ya samskrita dharyate kshiyante khalu bhushanani satatam vagbhushanam bhushanam || || vidya nama narasya
    rupam adhikam pracchannaguptam dhanam vidya bhogakari yashahsukhakari vidya gurunam guruh | vidya
    bandhujano videshagamane vidya para devata vidya rajasu pujyate na tu dhanam vidyavihinah pashuh ||
    || kshantishcetkavacena kim kim aribhih krodho'sti ceddehinam jnatishcedanalena kim yadi suhriddivyaushadham
    kim phalam | kim sarpairyadi durjanah kim u dhanairvidya'navadya yadi vrida cetkim u bhushanaih sukavita
    yadyasti rajyena kim || || dakshinyam svajane daya parijane shathyam sada durjane pritih sadhujane
    nayo nripajane vidvajjane carjavam | shauryam shatrujane kshama gurujane kantajane dhrishtata ye caivam
    purushah kalasu kushalasteshveva lokasthitih || || jadyam dhiyo harati sincati vaci satyam manonnatim
    dishati papam apakaroti | cetah prasadayati dikshu tanoti kirtim satsangatih kathaya kim na karoti
    pumsam || || jayanti te sukritino rasasiddhah kavishvarah | nasti yesham yashahkaye jaramaranajam
    bhayam || || sunuh saccaritah sati priyatama svami prasadonmukhah snigdham mitram avancakah parijano
    nihkleshalesham manah | akaro rucirah sthirashca vibhavo vidyavadatam mukham tushte vishtapakashtaharini
    harau samprapyate dehina || || pranaghatannivrittih paradhanaharane samyamah satyavakyam kale shaktya
    pradanam yuvatijanakathamukabhavah paresham | trishnasroto vibhango gurushu ca vinayah sarvabhutanukampa
    samanyah sarvashastreshvanupahatavidhih shreyasam esha panthah || || prarabhyate na khalu vighnabhayena
    nicaih prarabhya vighnavihata viramanti madhyah | vighnaih punah punarapi pratihanyamanah prarabdham
    uttamajana na parityajanti || || asanto nabhyarthyah suhridapi na yacyah krishadhanah priya nyayya
    vrittirmalinam asubhange'pyasukaram | vipadyuccaih stheyam padam anuvidheyam ca mahatam satam kenoddishtam
    vishamam asidharavratam idam || || kshutkshamo'pi jarakrisho'pi shithilaprano'pi kashtam dasham apanno'pi
    vipannadidhitiriti praneshu nashyatsvapi | mattebhendravibhinnakumbhapishitagrasaikabaddhasprihah
    kim jirnam trinam atti manamahatam agresarah kesari || || svalpasnayuvasavasheshamalinam nirmamsam
    apyasthi goh shva labdhva paritosham eti na tu tattasya kshudhashantaye | simho jambukam ankam agatam
    api tyaktva nihanti dvipam sarvah kricchragato'pi vanchati janah sattvanurupam phalam || || langulacalanam
    adhashcaranavapatam bhumau nipatya vadanodaradarshanam ca | shva pindadasya kurute gajapungavastu
    dhiram vilokayati catushataishca bhunkte || || parivartini samsare mritah ko va na jayate | sa jato
    yena jatena yati vamshah samunnatim || || kusumastavakasyeva dvayi vrittirmanasvinah | murdhni va
    sarvalokasya shiryate vana eva va || || santyanye'pi brihaspatiprabhritayah sambhavitah pancashas
    tanpratyesha visheshavikramaruci rahurna vairayate | dvaveva grasate divakaranishapraneshvarau bhaskarau
    bhratah parvani pashya danavapatih shirshavasheshakritih || || vahati bhuvanashrenim sheshah phanaphalakasthitam
    kamathapatina madhyeprishtham sada sa ca dharyate | tam api kurute krodadhinam payodhiranadarad ahaha
    mahatam nihsimanashcaritravibhutayah || || varam pakshacchedah samadamaghavanmuktakulishapraharair
    udgacchadbahuladahanodgaragurubhih | tusharadreh sunorahaha pitari kleshavivashe na casau sampatah
    payasi payasam patyurucitah || || simhah shishurapi nipatati madamalinakapolabhittishu gajeshu | prakritiriyam
    sattvavatam na khalu vayastejaso hetuh || || jatiryatu rasatalam gunaganaistatrapyadho gamyatam shilam
    shailatatatpatatvabhijanah sandahyatam vahnina | shaurye vairini vajram ashu nipatatvartho'stu nah
    kevalam yenaikena vina gunastrinalavaprayah samasta ime || || dhanam arjaya kakutstha dhanamulam idam
    jagat | antaram nabhijanami nirdhanasya mritasya ca || || tanindriyanyavikalani tadeva nama sa buddhirapratihata
    vacanam tadeva | arthoshmana virahitah purushah kshanena so'pyanya eva bhavatiti vicitram etat ||
    || yasyasti vittam sa narah kulinah sa panditah sa shrutavangunajnah | sa eva vakta sa ca darshaniyah
    sarve gunah kancanam ashrayanti || || daurmantryannripatirvinashyati yatih sangatsuto lalanat vipro'nadhyayanatkulam
    kutanayacchilam khalopasanat | hrirmadyadanavekshanadapi krishih snehah pravasashrayan maitri capranayatsamriddhiranayattyagapramadaddhanam
    || || danam bhogo nashastisro gatayo bhavanti vittasya | yo na dadati na bhunkte tasya tritiya gatirbhavati
    || || manih shanollidhah samaravijayi hetidalito madakshino nagah sharadi saritah shyanapulinah |
    kalasheshashcandrah suratamridita balavanita tannimna shobhante galitavibhavashcarthishu narah ||
    || parikshinah kashcitsprihayati yavanam prasritaye sa pashcatsampurnah kalayati dharitrim trinasamam
    | atashcanaikantyadgurulaghutaya'rtheshu dhaninam avastha vastuni prathayati ca sankocayati ca ||
    || rajandudhukshasi yadi kshitidhenum etam tenadya vatsam iva lokam amum pushana tasmimshca samyaganisham
    pariposhyamane nanaphalaih phalati kalpalateva bhumih || || satyanrita ca parusha priyavadini ca himsra
    dayalurapi carthapara vadanya | nityavyaya pracuranityadhanagama ca varanganeva nripanitiranekarupa
    || || ajna kirtih palanam brahmananam danam bhogo mitrasamrakshanam ca yesham ete shadguna na pravrittah
    ko'rthastesham parthivopashrayena || || yaddhatra nijabhalapattalikhitam stokam mahadva dhanam tatprapnoti
    marusthale'pi nitaram merau tato nadhikam | taddhiro bhava vittavatsu kripanam vrittim vritha ma krithah
    kupe pashya payonidhavapi ghato grihnati tulyam jalam || || tvam eva catakadharo' siti kesham na gocarah
    | kim ambhodavarasmakam karpanyoktam pratikshase || || re re cataka savadhanamanasa mitra kshanam
    shruyatam ambhoda bahavo vasanti gagane sarve'pi naitadrishah | kecidvrishtibhirardrayanti vasudham
    garjanti kecidvritha yam yam pashyasi tasya tasya purato ma bruhi dinam vacah || || akarunatvam akaranavigrahah
    paradhane parayoshiti ca spriha | sujanabandhujaneshvasahishnuta prakritisiddham idam hi duratmanam
    || || durjanah parihartavyo vidyaya'lakrito'pi san | manina bhushitah sarpah kim asau na bhayankarah
    || || jadyam hrimati ganyate vratarucau dambhah shucau kaitavam shure nirghrinata munau vimatita dainyam
    priyalapini | tejasvinyavaliptata mukharata vaktaryashaktih sthire tatko nama guno bhavetsa guninam
    yo durjanairnankitah || || lobhashcedagunena kim pishunata yadyasti kim patakaih satyam cettapasa
    ca kim shuci mano yadyasti tirthena kim | saujanyam yadi kim gunaih sumahima yadyasti kim mandanaih
    sadvidya yadi kim dhanairapayasho yadyasti kim mrityuna || || shashi divasadhusaro galitayauvana kamini
    saro vigatavarijam mukham anaksharam svakriteh | prabhurdhanaparayanah satatadurgatah sajjano nripanganagatah
    khalo manasi sapta shalyani me || || na kashciccandakopanam atmiyo nama bhubhujam | hotaram api juhvanam
    sprishto dahati pavakah || || maunanmukah pravacanapaturvatulo jalpako va dhrishtah parshve vasati
    ca sada duratashcapragalbhah | kshantya bhiruryadi na sahate prayasho nabhijatah sevadharmah paramagahano
    yoginam apyagamyah || || udbhasitakhilakhalasya vishrinkhalasya pragjatavistritanijadhamakarmavritteh
    | daivadavaptavibhavasya gunadvisho'sya nicasya gocaragataih sukham apyate kaih || || arambhagurvi
    kshayini kramena laghvi pura vriddhimati ca pashcat | dinasya purvardhaparardhabhinna chayeva maitri
    khalasajjananam || || mrigaminasajjananam trinajalasantoshavihitavrittinam | lubdhakadhivarapishuna
    nishkaranavairino jagati || || vancha sajjanasangame paragune pritirgurau namrata vidyayam vyasanam
    svayoshiti ratirlokapavadadbhayam | bhaktih shulini shaktiratmadamane samsargamuktih khale yeshvete
    nivasanti nirmalagunastebhyo narebhyo namah || || vipadi dhairyam athabhyudaye kshama sadasi vakpatuta
    yudhi vikramah | yashasi cabhirucirvyasanam shrutau prakritisiddham idam hi mahatmanam || || pradanam
    pracchannam griham upagate sambhramavidhih priyam kritva maunam sadasi kathanam capyupakriteh | anutseko
    lakshmyam anabhibhavagandhah parakathah satam kenoddishtam vishamam asidharavratam idam || || kare
    shlaghyastyagah shirasi gurupadapranayita mukhe satya vani vijayi bhujayorviryam atulam | hridi svaccha
    vrittih shrutam adhigatam ca shravanayor vinapyaishvaryena prakritimahatam mandanam idam || || sampatsu
    mahatam cittam bhavatyutpalakomalam | apatsu ca mahashailashila sanghatakarkasham || || santaptayasi
    samsthitasya payaso namapi na jnayate muktakarataya tadeva nalinipatrasthitam rajate | svatyam sagarashuktimadhyapatitam
    tanmauktikam jayate prayenadhamamadhyamottamagunah samsargato jayate || || prinati yah sucaritaih
    pitaram sa putro yadbhartureva hitam icchati tatkalatram | tanmitram apadi sukhe ca samakriyam yad
    etattrayam jagati punyakrito labhante || || eko devah keshavo va shivo va hyekam mitram bhupatirva
    yatirva | eko vasah pattane va vane va hyeka bharya sundari va dari va || || namratvenonnamantah paragunakathanaih
    svangunankhyapayantah svarthansampadayanto vitataprithutararambhayatnah pararthe | kshantyaivaksheparukshaksharamukharamukhandurjanandushayantah
    santah sashcaryacarya jagati bahumatah kasya nabhyarcaniyah || || bhavanti namrastaravah phalodgamair
    navambubhirduravalambino ghanah | anuddhatah satpurushah samriddhibhih svabhava esha paropakarinam
    || || shrotram shrutenaiva na kundalena danena panirna tu kankanena | vibhati kayah karunaparanam
    paropakarairna tu candanena || || papannivarayati yojayate hitaya guhyam niguhati gunanprakatikaroti
    | apadgatam ca na jahati dadati kale sanmitralakshanam idam pravadanti santah || || padmakaram dinakaro
    vikacikaroti candraprabhollasayati kairavacakravalam | nabhyarthito jaladharo'pi jalam dadati santah
    svayam parahite vihitabhiyogah || || eke satpurushah pararthaghatakah svartham parityajanti ye samanyastu
    parartham udyamabhritah svarthavirodhena ye | te'mi manusharakshasah parahitam svarthaya nighnanti
    ye ye tu ghnanti nirarthakam parahitam te ke na janimahe || || kshirenatmagatodakaya hi guna datta
    pura te'khila kshirottapam avekshya tena payasa svatma krishanau hutah | gantum pavakam unmanastadabhavaddrishtva
    tu mitrapadam yuktam tena jalena shamyati satam maitri punastvidrishi || || itah svapiti keshavah
    kulam itastadiyadvisham itashca sharanarthinam shikharinam ganah sherate | ito'pi badavanalah saha
    samastasamvartakaih aho vitatam urjitam bharasaham sindhorvapuh || || trishnam chindhi bhaja kshamam
    jahi madam pape ratim ma krithah satyam bruhyanuyahi sadhupadavim sevasva vidvajjanam | manyanmanaya
    vidvisho'pyanunaya prakhyapaya prashrayam kirtim palaya duhkhite kuru dayam etatsatam ceshtitam ||
    || manasi vacasi kaye punyapiyushapurnas tribhuvanam upakarashrenibhih prinayantah | paragunaparamanunparvatikritya
    nityam nijahridi vikasantah santi santah kiyantah || || kim tena hemagirina rajatadrina va yatrashritashca
    taravastaravasta eva | manyamahe malayam eva yadashrayena kankolanimbakutaja api candanah syuh ||
    || ratnairmaharhaistutushurna deva na bhejire bhimavishena bhitim | sudham vina na prayayurviramam
    na nishcitarthadviramanti dhirah || || kvacitprithvishayyah kvacidapi ca paryankashayanah kvacicchakaharah
    kvacidapi ca shalyodanarucih | kvacitkanthadhari kvacidapi ca divyambaradharo manasvi karyarthi na
    ganayati duhkham na ca sukham || || aishvaryasya vibhushanam sujanata shauryasya vaksamyamo jnanasyopashamah
    shrutasya vinayo vittasya patre vyayah | akrodhastapasah kshama prabhaviturdharmasya nirvyajata sarvesham
    api sarvakaranam idam shilam param bhushanam || || nindantu nitinipuna yadi va stuvantu lakshmih samavishatu
    gacchatu va yatheshtham | adyaiva va maranam astu yugantare va nyayyatpathah pravicalanti padam na
    dhirah || || bhagnashasya karandapinditatanormlanendriyasya kshudha kritvakhurvivaram svayam nipatito
    naktam mukhe bhoginah | triptastatpishitena satvaram asau tenaiva yatah patha lokah pashyata daivam
    eva hi nrinam vriddhau kshaye karanam || || alasyam hi manushyanam sharirastho mahanripuh | nastyudyamasamo
    bandhuh kurvano navasidati || || chinno'pi rohati taruh kshino'pyupaciyate punashcandrah | iti vimrishantah
    santah santapyante na duhkheshu || || neta yasya brihaspatih praharanam vajram surah sainikah svargo
    durgam anugrahah kila harerairavato varanah | ityaishvaryabalanvito'pi balabhidbhagnah paraih sangare
    tadvyaktam nanu daivam eva sharanam dhigdhigvritha paurusham || || karmayattam phalam pumsam buddhih
    karmanusarini | tathapi sudhiya bhavyam suvicaryaiva kurvata || || khalvato divaseshvarasya kiranaih
    santadito mastake vanchandesham anatapam vidhivashattalasya mulam gatah | tatrapyasya mahaphalena
    patata bhagnam sashabdam shirah prayo gacchati yatra bhagyarahitastatraiva yantyapadah || || ravinishakarayorgrahapidanam
    gajabhujangamayorapi bandhanam | matimatam ca vilokya daridratam vidhiraho balavaniti me matih ||
    || srijati tavadasheshagunakaram purusharatnam alankaranam bhuvah | tadapi tatkshanabhangi karoti
    cedahaha kashtam apanditata vidheh || || patram naiva yada kariravitape dosho vasantasya kim noluko'pyavalokate
    yadi diva suryasya kim dushanam | dhara naiva patanti catakamukhe meghasya kim dushanam yatpurvam
    vidhina lalatalikhitam tanmarjitum kah kshamah || || namasyamo devannanu hatavidheste'pi vashaga vidhirvandyah
    so'pi pratiniyatakarmaikaphaladah | phalam karmayattam yadi kim amaraih kim ca vidhina namastatkarmabhyo
    vidhirapi na yebhyah prabhavati || || brahma yena kulalavanniyamito brahmandabhandodare vishnuryena
    dashavataragahane kshipto mahasankate | rudro yena kapalapaniputake bhikshatanam karitah suryo bhramyati
    nityam eva gagane tasmai namah karmane || || naivakritih phalati naiva kulam na shilam vidyapi naiva
    na ca yatnakritapi seva | bhagyani purvatapasa khalu sancitani kale phalanti purushasya yathaiva vrikshah
    || || vane rane shatrujalagnimadhye maharnave parvatamastake va | suptam pramattam vishamasthitam
    va rakshanti punyani purakritani || || ya sadhumshca khalankaroti vidusho murkhanhitandveshinah pratyaksham
    kurute paroksham amritam halahalam tatkshanat | tam aradhaya satkriyam bhagavatim bhoktum phalam vanchitam
    he sadho vyasanairguneshu vipuleshvastham vritha ma krithah || || gunavadagunavadva kurvata karyajatam
    parinatiravadharya yatnatah panditena | atirabhasakritanam karmanam avipatter bhavati hridayadahi
    shalyatulyo vipakah || || sthalyam vaiduryamayyam pacati tilakanamshcandanairindhanaughaih sauvarnairlangalagrairvilikhati
    vasudham arkamulasya hetoh | kritva karpurakhandanvritim iha kurute kodravanam samantat prapyemam
    karmabhumim na carati manujo yastapo mandabhagyah || || majjatvambhasi yatu merushikharam shatrum
    jayatvahave vanijyam krishisevane ca sakala vidyah kalah shikshatam | akasham vipulam prayatu khagavatkritva
    prayatnam param nabhavyam bhavatiha karmavashato bhavyasya nashah kutah || || bhimam vanam bhavati
    tasya puram pradhanam sarvo janah svajanatam upayati tasya | kritsna ca bhurbhavati sannidhiratnapurna
    yasyasti purvasukritam vipulam narasya || || ko labho gunisangamah kim asukham prajnetaraih sangatih
    ka hanih samayacyutirnipunata ka dharmatattve ratih | kah shuro vijitendriyah priyatama ka'nuvrata
    kim dhanam vidya kim sukham apravasagamanam rajyam kim ajnaphalam || || apriyavacanadaridraih priyavacanadhanadhyaih
    svadaraparitushtaih | paraparivadanivrittaih kvacitkvacinmandita vasudha || || kadarthitasyapi hi
    dhairyavritter na shakyate dhairyagunah pramarshtum | adhomukhasyapi kritasya vahner nadhah shikha
    yati kadacideva || || kantakatakshavishikha na lunanti yasya cittam na nirdahati kopakrishanutapah
    | karshanti bhurivishayashca na lobhapashair lokatrayam jayati kritsnam idam sa dhirah || || ekenapi
    hi shurena padakrantam mahitalam | kriyate bhaskarenaiva spharasphuritatejasa || || vahnistasya jalayate
    jalanidhih kulyayate tatkshanan meruh svalpashilayate mrigapatih sadyah kurangayate | vyalo malyagunayate
    visharasah piyushavarshayate yasyange'khilalokavallabhatamam shilam samunmilati || || lajjagunaughajananim
    jananim iva svam atyantashuddhahridayam anuvartamanam | tejasvinah sukham asunapi santyajanti satyavratavyasanino
    na punah pratijnam ||
  devanagari: दिक्कालाद्यनवच्छिन्नानन्तचिन्मात्रमूर्तये । स्वानुभूत्येकमानाय नमः शान्ताय तेजसे ॥ ॥ बोद्धारो
    मत्सरग्रस्ताः प्रभवः स्मयदूषिताः । अबोधोपहताः चान्ये जीर्णमङ्गे सुभाषितम् ॥ ॥ अज्ञः सुखं आराध्यः सुखतरं
    आराध्यते विशेषज्ञः । ज्ञानलवदुर्विदग्धं ब्रह्मापि तं नरं न रञ्जयति ॥ ॥ प्रसह्य मणिं उद्धरेन्मकरवक्त्रदंष्ट्रान्तरात्
    समुद्रं अपि सन्तरेत्प्रचलदूर्मिमालाकुलम् । भुजङ्गं अपि कोपितं शिरसि पुष्पवद्धारयेत् न तु प्रतिनिविष्टमूर्खजनचित्तं
    आराधयेत् ॥ ॥ लभेत सिकतासु तैलं अपि यत्नतः पीडयन् पिबेच्च मृगतृष्णिकासु सलिलं पिपासार्दितः । क्वचिदपि
    पर्यटन्शशविषाणं आसादयेत् न तु प्रतिनिविष्टमूर्खचित्तं आराधयेत् ॥ ॥ व्यालं बालमृणालतन्तुभिरसौ रोद्धुं
    समुज्जृम्भते छेत्तुं वज्रमणिं शिरीषकुसुमप्रान्तेन सन्नह्यति । माधुर्यं मधुबिन्दुना रचयितुं क्षाराम्बुधेरीहते
    नेतुं वाञ्छति यः खलान्पथि सतां सूक्तैः सुधास्यन्दिभिः ॥ ॥ स्वायत्तं एकान्तगुणं विधात्रा विनिर्मितं
    छादनं अज्ञतायाः । विशेषतः सर्वविदां समाजे विभूषणं मौनं अपण्डितानाम् ॥ ॥ यदा किञ्चिज्ज्ञोऽहं द्विप
    इव मदान्धः समभवं तदा सर्वज्ञोऽस्मीत्यभवदवलिप्तं मम मनः यदा किञ्चित्किञ्चिद्बुधजनसकाशादवगतं तदा मूर्खोऽस्मीति
    ज्वर इव मदो मे व्यपगतः ॥ ॥ कृमिकुलचितं लालाक्लिन्नं विगन्धिजुगुप्सितं निरुपमरसं प्रीत्या खादन्नरास्थि
    निरामिषम् । सुरपतिं अपि श्वा पार्श्वस्थं विलोक्य न शङ्कते न हि गणयति क्षुद्रो जन्तुः परिग्रहफल्गुताम्
    ॥ ॥ शिरः शार्वं स्वर्गात्पशुपतिशिरस्तः क्षितिधरं महीध्रादुत्तुङ्गादवनिं अवनेश्चापि जलधिम् । अधोऽधो
    गङ्गेयं पदं उपगता स्तोकम् अथवाविवेकभ्रष्टानां भवति विनिपातः शतमुखः ॥ ॥ शक्यो वारयितुं जलेन हुतभुक्च्छत्रेण
    सूर्यातपो नागेन्द्रो निशिताङ्कुशेन समदो दण्डेन गोगर्दभौ । व्याधिर्भेषजसङ्ग्रहैश्च विविधैर्मन्त्रप्रयोगैर्विषं
    सर्वस्यौषधं अस्ति शास्त्रविहितं मूर्खस्य नास्त्यौषधम् ॥ ॥ साहित्यसङ्गीतकलाविहीनः साक्षात्पशुः पुच्छविषाणहीनः
    । तृणं न खादन्नपि जीवमानस् तद्भागधेयं परमं पशूनाम् ॥ ॥ येषां न विद्या न तपो न दानं ज्ञानं न शीलं न
    गुणो न धर्मः । ते मर्त्यलोके भुवि भारभूता मनुष्यरूपेण मृगाश्चरन्ति ॥ ॥ वरं पर्वतदुर्गेषु भ्रान्तं
    वनचरैः सह न मूर्खजनसम्पर्कः सुरेन्द्रभवनेष्वपि ॥ ॥ शास्त्रोपस्कृतशब्दसुन्दरगिरः शिष्यप्रदेयागमा विख्याताः
    कवयो वसन्ति विषये यस्य प्रभोर्निर्धनाः । तज्जाड्यं वसुधाधिपस्य कवयस्त्वर्थं विनापीश्वराः कुत्स्याः
    स्युः कुपरीक्षका हि मणयो यैरर्घतः पातिताः ॥ ॥ हर्तुर्याति न गोचरं किं अपि शं पुष्णाति यत्सर्वदाऽप्य्
    अर्थिभ्यः प्रतिपाद्यमानं अनिशं प्राप्नोति वृद्धिं पराम् । कल्पान्तेष्वपि न प्रयाति निधनं विद्याख्यं
    अन्तर्धनं येषां तान्प्रति मानं उज्झत नृपाः कस्तैः सह स्पर्धते ॥ ॥ अधिगतपरमार्थान्पण्डितान्मावमंस्थास्
    तृणं इव लघु लक्ष्मीर्नैव तान्संरुणद्धि । अभिनवमदलेखाश्यामगण्डस्थलानां न भवति बिसतन्तुर्वारणं वारणानाम्
    ॥ ॥ अम्भोजिनीवनविहारविलासं एव हंसस्य हन्ति नितरां कुपितो विधाता । न त्वस्य दुग्धजलभेदविधौ प्रसिद्धां
    वैदग्धीकीर्तिं अपहर्तुं असौ समर्थः ॥ ॥ केयूराणि न भूषयन्ति पुरुषं हारा न चन्द्रोज्ज्वला न स्नानं न
    विलेपनं न कुसुमं नालङ्कृता मूर्धजाः । वाण्येका समलङ्करोति पुरुषं या संस्कृता धार्यते क्षीयन्ते खलु
    भूषणानि सततं वाग्भूषणं भूषणम् ॥ ॥ विद्या नाम नरस्य रूपं अधिकं प्रच्छन्नगुप्तं धनं विद्या भोगकरी यशःसुखकरी
    विद्या गुरूणां गुरुः । विद्या बन्धुजनो विदेशगमने विद्या परा देवता विद्या राजसु पूज्यते न तु धनं विद्याविहीनः
    पशुः ॥ ॥ क्षान्तिश्चेत्कवचेन किं किं अरिभिः क्रोधोऽस्ति चेद्देहिनां ज्ञातिश्चेदनलेन किं यदि सुहृद्दिव्यौषधं
    किं फलम् । किं सर्पैर्यदि दुर्जनाः किं उ धनैर्विद्याऽनवद्या यदि व्रीडा चेत्किं उ भूषणैः सुकविता यद्यस्ति
    राज्येन किम् ॥ ॥ दाक्षिण्यं स्वजने दया परिजने शाठ्यं सदा दुर्जने प्रीतिः साधुजने नयो नृपजने विद्वज्जने
    चार्जवम् । शौर्यं शत्रुजने क्षमा गुरुजने कान्ताजने धृष्टता ये चैवं पुरुषाः कलासु कुशलास्तेष्वेव लोकस्थितिः
    ॥ ॥ जाड्यं धियो हरति सिञ्चति वाचि सत्यं मानोन्नतिं दिशति पापं अपाकरोति । चेतः प्रसादयति दिक्षु तनोति
    कीर्तिं सत्सङ्गतिः कथय किं न करोति पुंसाम् ॥ ॥ जयन्ति ते सुकृतिनो रससिद्धाः कवीश्वराः । नास्ति येषां
    यशःकाये जरामरणजं भयम् ॥ ॥ सूनुः सच्चरितः सती प्रियतमा स्वामी प्रसादोन्मुखः स्निग्धं मित्रं अवञ्चकः
    परिजनो निःक्लेशलेशं मनः । आकारो रुचिरः स्थिरश्च विभवो विद्यावदातं मुखं तुष्टे विष्टपकष्टहारिणि हरौ
    सम्प्राप्यते देहिना ॥ ॥ प्राणाघातान्निवृत्तिः परधनहरणे संयमः सत्यवाक्यं काले शक्त्या प्रदानं युवतिजनकथामूकभावः
    परेषाम् । तृष्णास्रोतो विभङ्गो गुरुषु च विनयः सर्वभूतानुकम्पा सामान्यः सर्वशास्त्रेष्वनुपहतविधिः श्रेयसां
    एष पन्थाः ॥ ॥ प्रारभ्यते न खलु विघ्नभयेन नीचैः प्रारभ्य विघ्नविहता विरमन्ति मध्याः । विघ्नैः पुनः
    पुनरपि प्रतिहन्यमानाः प्रारब्धं उत्तमजना न परित्यजन्ति ॥ ॥ असन्तो नाभ्यर्थ्याः सुहृदपि न याच्यः कृशधनः
    प्रिया न्याय्या वृत्तिर्मलिनं असुभङ्गेऽप्यसुकरम् । विपद्युच्चैः स्थेयं पदं अनुविधेयं च महतां सतां
    केनोद्दिष्टं विषमं असिधाराव्रतं इदम् ॥ ॥ क्षुत्क्षामोऽपि जराकृशोऽपि शिथिलप्राणोऽपि कष्टां दशाम् आपन्नोऽपि
    विपन्नदीधितिरिति प्राणेषु नश्यत्स्वपि । मत्तेभेन्द्रविभिन्नकुम्भपिशितग्रासैकबद्धस्पृहः किं जीर्णं
    तृणं अत्ति मानमहतां अग्रेसरः केसरी ॥ ॥ स्वल्पस्नायुवसावशेषमलिनं निर्मांसं अप्यस्थि गोः श्वा लब्ध्वा
    परितोषं एति न तु तत्तस्य क्षुधाशान्तये । सिंहो जम्बुकं अङ्कं आगतं अपि त्यक्त्वा निहन्ति द्विपं सर्वः
    कृच्छ्रगतोऽपि वाञ्छति जनः सत्त्वानुरूपं फलम् ॥ ॥ लाङ्गूलचालनं अधश्चरणावपातं भूमौ निपत्य वदनोदरदर्शनं
    च । श्वा पिण्डदस्य कुरुते गजपुङ्गवस्तु धीरं विलोकयति चाटुशतैश्च भुङ्क्ते ॥ ॥ परिवर्तिनि संसारे मृतः
    को वा न जायते । स जातो येन जातेन याति वंशः समुन्नतिम् ॥ ॥ कुसुमस्तवकस्येव द्वयी वृत्तिर्मनस्विनः ।
    मूर्ध्नि वा सर्वलोकस्य शीर्यते वन एव वा ॥ ॥ सन्त्यन्येऽपि बृहस्पतिप्रभृतयः सम्भाविताः पञ्चषास् तान्प्रत्येष
    विशेषविक्रमरुची राहुर्न वैरायते । द्वावेव ग्रसते दिवाकरनिशाप्राणेश्वरौ भास्करौ भ्रातः पर्वणि पश्य
    दानवपतिः शीर्षावशेषाकृतिः ॥ ॥ वहति भुवनश्रेणिं शेषः फणाफलकस्थितां कमठपतिना मध्येपृष्ठं सदा स च धार्यते
    । तं अपि कुरुते क्रोडाधीनं पयोधिरनादराद् अहह महतां निःसीमानश्चरित्रविभूतयः ॥ ॥ वरं पक्षच्छेदः समदमघवन्मुक्तकुलिशप्रहारैर्
    उद्गच्छद्बहुलदहनोद्गारगुरुभिः । तुषाराद्रेः सूनोरहह पितरि क्लेशविवशे न चासौ सम्पातः पयसि पयसां पत्युरुचितः
    ॥ ॥ सिंहः शिशुरपि निपतति मदमलिनकपोलभित्तिषु गजेषु । प्रकृतिरियं सत्त्ववतां न खलु वयस्तेजसो हेतुः ॥
    ॥ जातिर्यातु रसातलं गुणगणैस्तत्राप्यधो गम्यतां शीलं शैलतटात्पतत्वभिजनः सन्दह्यतां वह्निना । शौर्ये
    वैरिणि वज्रं आशु निपतत्वर्थोऽस्तु नः केवलं येनैकेन विना गुणास्तृणलवप्रायाः समस्ता इमे ॥ ॥ धनं अर्जय
    काकुत्स्थ धनमूलं इदं जगत् । अन्तरं नाभिजानामि निर्धनस्य मृतस्य च ॥ ॥ तानीन्द्रियाण्यविकलानि तदेव नाम
    सा बुद्धिरप्रतिहता वचनं तदेव । अर्थोष्मणा विरहितः पुरुषः क्षणेन सोऽप्यन्य एव भवतीति विचित्रं एतत्
    ॥ ॥ यस्यास्ति वित्तं स नरः कुलीनः स पण्डितः स श्रुतवान्गुणज्ञः । स एव वक्ता स च दर्शनीयः सर्वे गुणाः
    काञ्चनं आश्रयन्ति ॥ ॥ दौर्मन्त्र्यान्नृपतिर्विनश्यति यतिः सङ्गात्सुतो लालनात् विप्रोऽनध्ययनात्कुलं
    कुतनयाच्छीलं खलोपासनात् । ह्रीर्मद्यादनवेक्षणादपि कृषिः स्नेहः प्रवासाश्रयान् मैत्री चाप्रणयात्समृद्धिरनयात्त्यागप्रमादाद्धनम्
    ॥ ॥ दानं भोगो नाशस्तिस्रो गतयो भवन्ति वित्तस्य । यो न ददाति न भुङ्क्ते तस्य तृतीया गतिर्भवति ॥ ॥ मणिः
    शाणोल्लीढः समरविजयी हेतिदलितो मदक्षीणो नागः शरदि सरितः श्यानपुलिनाः । कलाशेषश्चन्द्रः सुरतमृदिता बालवनिता
    तन्निम्ना शोभन्ते गलितविभवाश्चार्थिषु नराः ॥ ॥ परिक्षीणः कश्चित्स्पृहयति यवानां प्रसृतये स पश्चात्सम्पूर्णः
    कलयति धरित्रीं तृणसमाम् । अतश्चानैकान्त्याद्गुरुलघुतयाऽर्थेषु धनिनाम् अवस्था वस्तूनि प्रथयति च सङ्कोचयति
    च ॥ ॥ राजन्दुधुक्षसि यदि क्षितिधेनुं एतां तेनाद्य वत्सं इव लोकं अमुं पुषाण तस्मिंश्च सम्यगनिशं परिपोष्यमाणे
    नानाफलैः फलति कल्पलतेव भूमिः ॥ ॥ सत्यानृता च परुषा प्रियवादिनी च हिंस्रा दयालुरपि चार्थपरा वदान्या
    । नित्यव्यया प्रचुरनित्यधनागमा च वाराङ्गनेव नृपनीतिरनेकरूपा ॥ ॥ आज्ञा कीर्तिः पालनं ब्राह्मणानां दानं
    भोगो मित्रसंरक्षणं च येषां एते षड्गुणा न प्रवृत्ताः कोऽर्थस्तेषां पार्थिवोपाश्रयेण ॥ ॥ यद्धात्रा निजभालपट्टलिखितं
    स्तोकं महद्वा धनं तत्प्राप्नोति मरुस्थलेऽपि नितरां मेरौ ततो नाधिकम् । तद्धीरो भव वित्तवत्सु कृपणां
    वृत्तिं वृथा मा कृथाः कूपे पश्य पयोनिधावपि घटो गृह्णाति तुल्यं जलम् ॥ ॥ त्वं एव चातकाधारोऽ सीति केषां
    न गोचरः । किं अम्भोदवरास्माकं कार्पण्योक्तं प्रतीक्षसे ॥ ॥ रे रे चातक सावधानमनसा मित्र क्षणं श्रूयताम्
    अम्भोदा बहवो वसन्ति गगने सर्वेऽपि नैतादृशाः । केचिद्वृष्टिभिरार्द्रयन्ति वसुधां गर्जन्ति केचिद्वृथा
    यं यं पश्यसि तस्य तस्य पुरतो मा ब्रूहि दीनं वचः ॥ ॥ अकरुणत्वं अकारणविग्रहः परधने परयोषिति च स्पृहा
    । सुजनबन्धुजनेष्वसहिष्णुता प्रकृतिसिद्धं इदं हि दुरात्मनाम् ॥ ॥ दुर्जनः परिहर्तव्यो विद्ययाऽलकृतोऽपि
    सन् । मणिना भूषितः सर्पः किं असौ न भयङ्करः ॥ ॥ जाड्यं ह्रीमति गण्यते व्रतरुचौ दम्भः शुचौ कैतवं शूरे
    निर्घृणता मुनौ विमतिता दैन्यं प्रियालापिनि । तेजस्विन्यवलिप्तता मुखरता वक्तर्यशक्तिः स्थिरे तत्को
    नाम गुणो भवेत्स गुणिनां यो दुर्जनैर्नाङ्कितः ॥ ॥ लोभश्चेदगुणेन किं पिशुनता यद्यस्ति किं पातकैः सत्यं
    चेत्तपसा च किं शुचि मनो यद्यस्ति तीर्थेन किम् । सौजन्यं यदि किं गुणैः सुमहिमा यद्यस्ति किं मण्डनैः
    सद्विद्या यदि किं धनैरपयशो यद्यस्ति किं मृत्युना ॥ ॥ शशी दिवसधूसरो गलितयौवना कामिनी सरो विगतवारिजं
    मुखं अनक्षरं स्वाकृतेः । प्रभुर्धनपरायणः सततदुर्गतः सज्जनो नृपाङ्गणगतः खलो मनसि सप्त शल्यानि मे ॥
    ॥ न कश्चिच्चण्डकोपानाम् आत्मीयो नाम भूभुजाम् । होतारं अपि जुह्वानं स्पृष्टो दहति पावकः ॥ ॥ मौनान्मूकः
    प्रवचनपटुर्वातुलो जल्पको वा धृष्टः पार्श्वे वसति च सदा दूरतश्चाप्रगल्भः । क्षान्त्या भीरुर्यदि न सहते
    प्रायशो नाभिजातः सेवाधर्मः परमगहनो योगिनां अप्यगम्यः ॥ ॥ उद्भासिताखिलखलस्य विशृङ्खलस्य प्राग्जातविस्तृतनिजाधमकर्मवृत्तेः
    । दैवादवाप्तविभवस्य गुणद्विषोऽस्य नीचस्य गोचरगतैः सुखं आप्यते कैः ॥ ॥ आरम्भगुर्वी क्षयिणी क्रमेण लघ्वी
    पुरा वृद्धिमती च पश्चात् । दिनस्य पूर्वार्धपरार्धभिन्ना छायेव मैत्री खलसज्जनानाम् ॥ ॥ मृगमीनसज्जनानां
    तृणजलसन्तोषविहितवृत्तीनाम् । लुब्धकधीवरपिशुना निष्कारणवैरिणो जगति ॥ ॥ वाञ्छा सज्जनसङ्गमे परगुणे प्रीतिर्गुरौ
    नम्रता विद्यायां व्यसनं स्वयोषिति रतिर्लोकापवादाद्भयम् । भक्तिः शूलिनि शक्तिरात्मदमने संसर्गमुक्तिः
    खले येष्वेते निवसन्ति निर्मलगुणास्तेभ्यो नरेभ्यो नमः ॥ ॥ विपदि धैर्यं अथाभ्युदये क्षमा सदसि वाक्पटुता
    युधि विक्रमः । यशसि चाभिरुचिर्व्यसनं श्रुतौ प्रकृतिसिद्धं इदं हि महात्मनाम् ॥ ॥ प्रदानं प्रच्छन्नं
    गृहं उपगते सम्भ्रमविधिः प्रियं कृत्वा मौनं सदसि कथनं चाप्युपकृतेः । अनुत्सेको लक्ष्म्यां अनभिभवगन्धाः
    परकथाः सतां केनोद्दिष्टं विषमं असिधाराव्रतं इदम् ॥ ॥ करे श्लाघ्यस्त्यागः शिरसि गुरुपादप्रणयिता मुखे
    सत्या वाणी विजयि भुजयोर्वीर्यं अतुलम् । हृदि स्वच्छा वृत्तिः श्रुतं अधिगतं च श्रवणयोर् विनाप्यैश्वर्येण
    प्रकृतिमहतां मण्डनं इदम् ॥ ॥ सम्पत्सु महतां चित्तं भवत्युत्पलकोमलम् । आपत्सु च महाशैलशिला सङ्घातकर्कशम्
    ॥ ॥ सन्तप्तायसि संस्थितस्य पयसो नामापि न ज्ञायते मुक्ताकारतया तदेव नलिनीपत्रस्थितं राजते । स्वात्यां
    सागरशुक्तिमध्यपतितं तन्मौक्तिकं जायते प्रायेणाधममध्यमोत्तमगुणः संसर्गतो जायते ॥ ॥ प्रीणाति यः सुचरितैः
    पितरं स पुत्रो यद्भर्तुरेव हितं इच्छति तत्कलत्रम् । तन्मित्रं आपदि सुखे च समक्रियं यद् एतत्त्रयं जगति
    पुण्यकृतो लभन्ते ॥ ॥ एको देवः केशवो वा शिवो वा ह्येकं मित्रं भूपतिर्वा यतिर्वा । एको वासः पत्तने वा
    वने वा ह्येका भार्या सुन्दरी वा दरी वा ॥ ॥ नम्रत्वेनोन्नमन्तः परगुणकथनैः स्वान्गुणान्ख्यापयन्तः स्वार्थान्सम्पादयन्तो
    विततपृथुतरारम्भयत्नाः परार्थे । क्षान्त्यैवाक्षेपरुक्षाक्षरमुखरमुखान्दुर्जनान्दूषयन्तः सन्तः साश्चर्यचर्या
    जगति बहुमताः कस्य नाभ्यर्चनीयाः ॥ ॥ भवन्ति नम्रास्तरवः फलोद्गमैर् नवाम्बुभिर्दूरावलम्बिनो घनाः । अनुद्धताः
    सत्पुरुषाः समृद्धिभिः स्वभाव एष परोपकारिणाम् ॥ ॥ श्रोत्रं श्रुतेनैव न कुण्डलेन दानेन पाणिर्न तु कङ्कणेन
    । विभाति कायः करुणपराणां परोपकारैर्न तु चन्दनेन ॥ ॥ पापान्निवारयति योजयते हिताय गुह्यं निगूहति गुणान्प्रकटीकरोति
    । आपद्गतं च न जहाति ददाति काले सन्मित्रलक्षणं इदं प्रवदन्ति सन्तः ॥ ॥ पद्माकरं दिनकरो विकचीकरोति चन्द्रप्रभोल्लासयति
    कैरवचक्रवालम् । नाभ्यर्थितो जलधरोऽपि जलं ददाति सन्तः स्वयं परहिते विहिताभियोगाः ॥ ॥ एके सत्पुरुषाः
    परार्थघटकाः स्वार्थं परित्यजन्ति ये सामान्यास्तु परार्थं उद्यमभृतः स्वार्थाविरोधेन ये । तेऽमी मानुषराक्षसाः
    परहितं स्वार्थाय निघ्नन्ति ये ये तु घ्नन्ति निरर्थकं परहितं ते के न जानीमहे ॥ ॥ क्षीरेणात्मगतोदकाय
    हि गुणा दत्ता पुरा तेऽखिला क्षीरोत्तापं अवेक्ष्य तेन पयसा स्वात्मा कृशानौ हुतः । गन्तुं पावकं उन्मनस्तदभवद्दृष्ट्वा
    तु मित्रापदं युक्तं तेन जलेन शाम्यति सतां मैत्री पुनस्त्वीदृशी ॥ ॥ इतः स्वपिति केशवः कुलं इतस्तदीयद्विषाम्
    इतश्च शरणार्थिनां शिखरिणां गणाः शेरते । इतोऽपि बडवानलः सह समस्तसंवर्तकैः अहो विततं ऊर्जितं भरसहं सिन्धोर्वपुः
    ॥ ॥ तृष्णां छिन्धि भज क्षमां जहि मदं पापे रतिं मा कृथाः सत्यं ब्रूह्यनुयाहि साधुपदवीं सेवस्व विद्वज्जनम्
    । मान्यान्मानय विद्विषोऽप्यनुनय प्रख्यापय प्रश्रयं कीर्तिं पालय दुःखिते कुरु दयां एतत्सतां चेष्टितम्
    ॥ ॥ मनसि वचसि काये पुण्यपीयूषपूर्णास् त्रिभुवनं उपकारश्रेणिभिः प्रीणयन्तः । परगुणपरमाणून्पर्वतीकृत्य
    नित्यं निजहृदि विकसन्तः सन्ति सन्तः कियन्तः ॥ ॥ किं तेन हेमगिरिणा रजताद्रिणा वा यत्राश्रिताश्च तरवस्तरवस्त
    एव । मन्यामहे मलयं एव यदाश्रयेण कङ्कोलनिम्बकुटजा अपि चन्दनाः स्युः ॥ ॥ रत्नैर्महार्हैस्तुतुषुर्न देवा
    न भेजिरे भीमविषेण भीतिम् । सुधां विना न प्रययुर्विरामं न निश्चितार्थाद्विरमन्ति धीराः ॥ ॥ क्वचित्पृथ्वीशय्यः
    क्वचिदपि च पर्यङ्कशयनः क्वचिच्छाकाहारः क्वचिदपि च शाल्योदनरुचिः । क्वचित्कन्थाधारी क्वचिदपि च दिव्याम्बरधरो
    मनस्वी कार्यार्थी न गणयति दुःखं न च सुखम् ॥ ॥ ऐश्वर्यस्य विभूषणं सुजनता शौर्यस्य वाक्संयमो ज्ञानस्योपशमः
    श्रुतस्य विनयो वित्तस्य पात्रे व्ययः । अक्रोधस्तपसः क्षमा प्रभवितुर्धर्मस्य निर्व्याजता सर्वेषां अपि
    सर्वकारणं इदं शीलं परं भूषणम् ॥ ॥ निन्दन्तु नीतिनिपुणा यदि वा स्तुवन्तु लक्ष्मीः समाविशतु गच्छतु वा
    यथेष्ठम् । अद्यैव वा मरणं अस्तु युगान्तरे वा न्याय्यात्पथः प्रविचलन्ति पदं न धीराः ॥ ॥ भग्नाशस्य करण्डपिण्डिततनोर्म्लानेन्द्रियस्य
    क्षुधा कृत्वाखुर्विवरं स्वयं निपतितो नक्तं मुखे भोगिनः । तृप्तस्तत्पिशितेन सत्वरं असौ तेनैव यातः पथा
    लोकाः पश्यत दैवं एव हि नृणां वृद्धौ क्षये कारणम् ॥ ॥ आलस्यं हि मनुष्याणां शरीरस्थो महान्रिपुः । नास्त्युद्यमसमो
    बन्धुः कुर्वाणो नावसीदति ॥ ॥ छिन्नोऽपि रोहति तरुः क्षीणोऽप्युपचीयते पुनश्चन्द्रः । इति विमृशन्तः सन्तः
    सन्तप्यन्ते न दुःखेषु ॥ ॥ नेता यस्य बृहस्पतिः प्रहरणं वज्रं सुराः सैनिकाः स्वर्गो दुर्गं अनुग्रहः
    किल हरेरैरावतो वारणः । इत्यैश्वर्यबलान्वितोऽपि बलभिद्भग्नः परैः सङ्गरे तद्व्यक्तं ननु दैवं एव शरणं
    धिग्धिग्वृथा पौरुषम् ॥ ॥ कर्मायत्तं फलं पुंसां बुद्धिः कर्मानुसारिणी । तथापि सुधिया भाव्यं सुविचार्यैव
    कुर्वता ॥ ॥ खल्वाटो दिवसेश्वरस्य किरणैः सन्ताडितो मस्तके वाञ्छन्देशं अनातपं विधिवशात्तालस्य मूलं गतः
    । तत्राप्यस्य महाफलेन पतता भग्नं सशब्दं शिरः प्रायो गच्छति यत्र भाग्यरहितस्तत्रैव यान्त्यापदः ॥ ॥
    रविनिशाकरयोर्ग्रहपीडनं गजभुजङ्गमयोरपि बन्धनम् । मतिमतां च विलोक्य दरिद्रतां विधिरहो बलवानिति मे मतिः
    ॥ ॥ सृजति तावदशेषगुणाकरं पुरुषरत्नं अलङ्करणं भुवः । तदपि तत्क्षणभङ्गि करोति चेदहह कष्टं अपण्डितता
    विधेः ॥ ॥ पत्रं नैव यदा करीरविटपे दोषो वसन्तस्य किम् नोलूकोऽप्यवलोकते यदि दिवा सूर्यस्य किं दूषणम्
    । धारा नैव पतन्ति चातकमुखे मेघस्य किं दूषणम् यत्पूर्वं विधिना ललाटलिखितं तन्मार्जितुं कः क्षमः ॥ ॥
    नमस्यामो देवान्ननु हतविधेस्तेऽपि वशगा विधिर्वन्द्यः सोऽपि प्रतिनियतकर्मैकफलदः । फलं कर्मायत्तं यदि
    किं अमरैः किं च विधिना नमस्तत्कर्मभ्यो विधिरपि न येभ्यः प्रभवति ॥ ॥ ब्रह्मा येन कुलालवन्नियमितो ब्रह्माण्डभाण्डोदरे
    विष्णुर्येन दशावतारगहने क्षिप्तो महासङ्कटे । रुद्रो येन कपालपाणिपुटके भिक्षाटनं कारितः सूर्यो भ्राम्यति
    नित्यं एव गगने तस्मै नमः कर्मणे ॥ ॥ नैवाकृतिः फलति नैव कुलं न शीलं विद्यापि नैव न च यत्नकृतापि सेवा
    । भाग्यानि पूर्वतपसा खलु सञ्चितानि काले फलन्ति पुरुषस्य यथैव वृक्षाः ॥ ॥ वने रणे शत्रुजलाग्निमध्ये
    महार्णवे पर्वतमस्तके वा । सुप्तं प्रमत्तं विषमस्थितं वा रक्षन्ति पुण्यानि पुराकृतानि ॥ ॥ या साधूंश्च
    खलान्करोति विदुषो मूर्खान्हितान्द्वेषिणः प्रत्यक्षं कुरुते परोक्षं अमृतं हालाहलं तत्क्षणात् । तां
    आराधय सत्क्रियां भगवतीं भोक्तुं फलं वाञ्छितं हे साधो व्यसनैर्गुणेषु विपुलेष्वास्थां वृथा मा कृथाः
    ॥ ॥ गुणवदगुणवद्वा कुर्वता कार्यजातं परिणतिरवधार्या यत्नतः पण्डितेन । अतिरभसकृतानां कर्मणां आविपत्तेर्
    भवति हृदयदाही शल्यतुल्यो विपाकः ॥ ॥ स्थाल्यां वैदूर्यमय्यां पचति तिलकणांश्चन्दनैरिन्धनौघैः सौवर्णैर्लाङ्गलाग्रैर्विलिखति
    वसुधां अर्कमूलस्य हेतोः । कृत्वा कर्पूरखण्डान्वृतिं इह कुरुते कोद्रवाणां समन्तात् प्राप्येमां कर्मभूमिं
    न चरति मनुजो यस्तपो मन्दभाग्यः ॥ ॥ मज्जत्वम्भसि यातु मेरुशिखरं शत्रुं जयत्वाहवे वाणिज्यं कृषिसेवने
    च सकला विद्याः कलाः शिक्षताम् । आकाशं विपुलं प्रयातु खगवत्कृत्वा प्रयत्नं परं नाभाव्यं भवतीह कर्मवशतो
    भाव्यस्य नाशः कुतः ॥ ॥ भीमं वनं भवति तस्य पुरं प्रधानं सर्वो जनः स्वजनतां उपयाति तस्य । कृत्स्ना च
    भूर्भवति सन्निधिरत्नपूर्णा यस्यास्ति पूर्वसुकृतं विपुलं नरस्य ॥ ॥ को लाभो गुणिसङ्गमः किं असुखं प्राज्ञेतरैः
    सङ्गतिः का हानिः समयच्युतिर्निपुणता का धर्मतत्त्वे रतिः । कः शूरो विजितेन्द्रियः प्रियतमा काऽनुव्रता
    किं धनं विद्या किं सुखं अप्रवासगमनं राज्यं किं आज्ञाफलम् ॥ ॥ अप्रियवचनदरिद्रैः प्रियवचनधनाढ्यैः स्वदारपरितुष्टैः
    । परपरिवादनिवृत्तैः क्वचित्क्वचिन्मण्डिता वसुधा ॥ ॥ कदर्थितस्यापि हि धैर्यवृत्तेर् न शक्यते धैर्यगुणः
    प्रमार्ष्टुम् । अधोमुखस्यापि कृतस्य वह्नेर् नाधः शिखा याति कदाचिदेव ॥ ॥ कान्ताकटाक्षविशिखा न लुनन्ति
    यस्य चित्तं न निर्दहति कोपकृशानुतापः । कर्षन्ति भूरिविषयाश्च न लोभपाशैर् लोकत्रयं जयति कृत्स्नं इदं
    स धीरः ॥ ॥ एकेनापि हि शूरेण पादाक्रान्तं महीतलम् । क्रियते भास्करेणैव स्फारस्फुरिततेजसा ॥ ॥ वह्निस्तस्य
    जलायते जलनिधिः कुल्यायते तत्क्षणान् मेरुः स्वल्पशिलायते मृगपतिः सद्यः कुरङ्गायते । व्यालो माल्यगुणायते
    विषरसः पीयूषवर्षायते यस्याङ्गेऽखिललोकवल्लभतमं शीलं समुन्मीलति ॥ ॥ लज्जागुणौघजननीं जननीं इव स्वाम्
    अत्यन्तशुद्धहृदयां अनुवर्तमानाम् । तेजस्विनः सुखं असूनपि सन्त्यजन्ति सत्यव्रतव्यसनिनो न पुनः प्रतिज्ञाम्
    ॥
