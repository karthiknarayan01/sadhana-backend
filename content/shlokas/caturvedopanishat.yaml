id: caturvedopanishat
category: upanishad
name:
  english: caturvedopanishat
  devanagari: चतुर्वेदोपनिषत्
content:
  english: caturvedopanishat om athato mahopanishadameva tadahuh | eko ha vai narayana asit | na brahma
    na ishano napo nagnih na vayuh neme dyavaprithivi na nakshatrani na suryah | sa ekaki nara eva | tasya
    dhyanantassthasya lalatat svedo'patat | ta ima apah | ta ete no hiranyamayamannam | tatra brahma caturmukho'jayata
    | sa dhyatapurvamukho bhutva bhuriti vyahritih gayatram chanda rigvedah | pashcimamukho bhutva bhuriti
    vyahritistraishtubham chandah yajurvedah | uttaramukho bhutva bhuvariti vyahritirjagatam chandah samavedah
    | dakshinamukho bhutva janaditi vyahritiranushtubham chando'tharvavedah || sahasrashirsham devam sahasraksham
    vishvasambhavam | vishvatah paramam nityam vishvam narayanam harim || vishvamevedam purusham tam vishvamupajivati
    | rishim vishveshvaram devam samudre tam vishvarupinam || padmakoshapratikasham lambatyakoshasannibham
    | hridaye capyadhomukham satasyatyaishitkarabhishca || tasya madhye mahanagnirvishvarcirvishvatomukhah
    | tasya madhye vahnishikha aniyordhva vyavasthita || tasyah shikhaya madhye paramatma vyavasthitah
    | sa brahma sa ishanah so'ksharah paramah svarat || ya imam mahopanishadam brahmano'dhite ashrotriyah
    shrotriyo bhavati | anupanitah upanito bhavati | so'gniputo bhavati | sa vayuputo bhavati | sa suryaputo
    bhavati | sa somaputo bhavati | sa satyaputo bhavati | sa sarvairdevairjnato bhavati | sa sarveshu
    tirtheshu snato bhavati | tena sarvaih kratubhirishtam bhavati | gayatryah shashtisahasrani japtani
    bhavanti | itihasapurananam sahasrani japtani bhavanti | pranavanamayutam japtam bhavati | acakshushah
    panktim punati | asaptamat purusham punati | japyena amritattvam ca gacchati amritatvam ca gacchati
    ityaha bhagavan hiranyagarbhah || deva ha vai svargam lokamayamste deva rudramapricchamste deva urdhvabahavo
    rudram stuvanti | bhustvadirmadhyam bhuvaste svaste shirsham vishvarupo'si brahmaikastvam dvidha tridha
    shantistvam hutamahutam dattamadattam sarvamasarvam vishvamavishvam kritamakritam paramaparam parayanam
    ca tvam | apama somamamrita abhumaganma jyotiravidama deva namasyama dhurteramritam mritam martyam
    ca somasuryapurvajagadadhitam va yadaksharam prajapatyam saumyam sukshmam graham grahena bhavam bhavena
    saumyam saumyena sukshmam sukshmena grasati tasmai mahagrasaya namah || iti caturvedopanishat sampurna
    |
  devanagari: चतुर्वेदोपनिषत् ॐ अथातो महोपनिषदमेव तदाहुः । एको ह वै नारायण आसीत् । न ब्रह्मा न ईशानो नापो
    नाग्निः न वायुः नेमे द्यावापृथिवी न नक्षत्राणि न सूर्यः । स एकाकी नर एव । तस्य ध्यानान्तस्स्थस्य ललाटात्
    स्वेदोऽपतत् । ता इमा आपः । ता एते नो हिरण्यमयमन्नम् । तत्र ब्रह्मा चतुर्मुखोऽजायत । स ध्यातपूर्वामुखो
    भूत्वा भूरिति व्याहृतिः गायत्रं छन्द ऋग्वेदः । पश्चिमामुखो भूत्वा भूरिति व्याहृतिस्त्रैष्टुभं छन्दः
    यजुर्वेदः । उत्तरामुखो भूत्वा भुवरिति व्याहृतिर्जागतं छन्दः सामवेदः । दक्षिणामुखो भूत्वा जनदिति व्याहृतिरानुष्टुभं
    छन्दोऽथर्ववेदः ॥ सहस्रशीर्षं देवं सहस्राक्षं विश्वसम्भवम् । विश्वतः परमं नित्यं विश्वं नारायणं हरिम्
    ॥ विश्वमेवेदं पुरुषं तं विश्वमुपजीवति । ऋषिं विश्वेश्वरं देवं समुद्रे तं विश्वरूपिणम् ॥ पद्मकोशप्रतीकाशं
    लम्बत्याकोशसन्निभम् । हृदये चाप्यधोमुखं सतस्यत्यैशीत्कराभिश्च ॥ तस्य मध्ये महानग्निर्विश्वार्चिर्विश्वतोमुखः
    । तस्य मध्ये वह्निशिखा अणीयोर्ध्वा व्यवस्थिता ॥ तस्याः शिखाया मध्ये परमात्मा व्यवस्थितः । स ब्रह्मा
    स ईशानः सोऽक्षरः परमः स्वराट् ॥ य इमां महोपनिषदं ब्राह्मणोऽधीते अश्रोत्रियः श्रोत्रियो भवति । अनुपनीतः
    उपनीतो भवति । सोऽग्निपूतो भवति । स वायुपूतो भवति । स सूर्यपूतो भवति । स सोमपूतो भवति । स सत्यपूतो
    भवति । स सर्वैर्देवैर्ज्ञातो भवति । स सर्वेषु तीर्थेषु स्नातो भवति । तेन सर्वैः क्रतुभिरिष्टं भवति
    । गायत्र्याः षष्टिसहस्राणि जप्तानि भवन्ति । इतिहासपुराणानां सहस्राणि जप्तानि भवन्ति । प्रणवानामयुतं
    जप्तं भवति । आचक्षुषः पङ्क्तिं पुनाति । आसप्तमात् पुरुषं पुनाति । जाप्येन अमृतत्त्वं च गच्छति अमृतत्वं
    च गच्छति इत्याह भगवान् हिरण्यगर्भः ॥ देवा ह वै स्वर्गं लोकमायंस्ते देवा रुद्रमपृच्छंस्ते देवा ऊर्ध्वबाहवो
    रुद्रं स्तुवन्ति । भूस्त्वादिर्मध्यं भुवस्ते स्वस्ते शीर्षं विश्वरूपोऽसि ब्रह्मैकस्त्वं द्विधा त्रिधा
    शान्तिस्त्वं हुतमहुतं दत्तमदत्तं सर्वमसर्वं विश्वमविश्वं कृतमकृतं परमपरं परायणं च त्वम् । अपाम सोमममृता
    अभूमागन्म ज्योतिरविदाम देवा नमस्याम धूर्तेरमृतं मृतं मर्त्यं च सोमसूर्यपूर्वजगदधीतं वा यदक्षरं प्राजापत्यं
    सौम्यं सूक्ष्मं ग्राहं ग्राहेण भावं भावेन सौम्यं सौम्येन सूक्ष्मं सूक्ष्मेण ग्रसति तस्मै महाग्रासाय
    नमः ॥ इति चतुर्वेदोपनिषत् सम्पूर्णा ।
