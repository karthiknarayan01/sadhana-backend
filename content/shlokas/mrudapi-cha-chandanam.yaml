id: mrudapi-cha-chandanam
category: stotram
name:
  english: Mrudapi Cha Chandanam
content:
  english: mridapi ca candanamasmin deshe gramo gramah siddhavanam | yatra ca bala devisvarupa balah sarve
    shriramah || harimandiramidamakhilashariram dhanashakti janasevayai yatra ca kridayai vanarajah dhenurmata
    paramashiva nityam pratah shivagunaganam dipanutih khalu shatrupara || || bhagyavidhayi nijarjitakarma
    yatra shramah shriyamarjayati tyagadhananam taponidhinam gatham gayati kavivani gangajalamiva nityanirmalam
    jnanam shamsati yativani || || yatra hi naiva svadehavimohah yuddharatanam viranam yatra hi krishakah
    karyaratah san pashyati jivanasaphalyam jivanalakshyam na hi dhanapadavi yatra ca parashivapadaseva
    ||
  devanagari: मृदपि च चन्दनमस्मिन् देशे ग्रामो ग्रामः सिद्धवनम् । यत्र च बाला देवीस्वरूपा बालाः सर्वे
    श्रीरामाः ॥ हरिमन्दिरमिदमखिलशरीरं धनशक्ती जनसेवायै यत्र च क्रीडायै वनराजः धेनुर्माता परमशिवा नित्यं
    प्रातः शिवगुणगानं दीपनुतिः खलु शत्रुपरा ॥ ॥ भाग्यविधायि निजार्जितकर्म यत्र श्रमः श्रियमर्जयति त्यागधनानां
    तपोनिधीनां गाथां गायति कविवाणी गङ्गाजलमिव नित्यनिर्मलं ज्ञानं शंसति यतिवाणी ॥ ॥ यत्र हि नैव स्वदेहविमोहः
    युद्धरतानां वीराणां यत्र हि कृषकः कार्यरतः सन् पश्यति जीवनसाफल्यं जीवनलक्ष्यं न हि धनपदवी यत्र च परशिवपदसेवा
    ॥
