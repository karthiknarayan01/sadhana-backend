id: ramanujastotram
category: stotram
name:
  english: ramanujastotram
  devanagari: रामानुजस्तोत्रम्
content:
  english: jnatadravidavedatattva sumate mannathaprithvidhara | kancipurnavarenyashishya bhagavan he keshavasyatmaja
    shripadmeshapadabjashatpadaparam janami na tvam vina || 4|| he gopijanamuktidanakara he shastrarthatattvajna
    he goshthipurnakripagrihitavilasanmantradhipahaskara | he'nanteshtaphalapradayaka guro he viththalesharcita
    he bodhayana sutrasanmata param janami na tvam vina || 5|| he gopalaka he kripajalanidhe he sindhukanyapate
    he kamsantaka he gajendrakarunaparina he madhava | he ramanuja he jagatrayaguro he pundarikaksha mam
    he gopijananatha palaya param janami na tvam vina || 6|| he rama purushottama narahare narayana keshava
    govinda garudadhvaja gunanidhe damodara madhava | he krishna kamalapate yadupate sitapate shripate
    he vaikunthapate caracarapate lakshmipate pahi mam || 7|| iti shriramanujastotram sampurnam || 7||
  devanagari: ज्ञातद्राविडवेदतत्त्व सुमते मन्नाथपृथ्वीधर । काञ्चीपूर्णवरेण्यशिष्य भगवन् हे केशवस्यात्मज
    श्रीपद्मेशपदाब्जषट्पदपरं जानामि न त्वां विना ॥ ४॥ हे गोपीजनमुक्तिदानकर हे शास्त्रार्थतत्त्वज्ञ हे
    गोष्ठीपूर्णकृपागृहीतविलसन्मन्त्राधिपाहस्कर । हेऽनन्तेष्टफलप्रदायक गुरो हे विठ्ठलेशार्चित हे बोधायन
    सूत्रसन्मत परं जानामि न त्वां विना ॥ ५॥ हे गोपालक हे कृपाजलनिधे हे सिन्धुकन्यापते हे कंसान्तक हे गजेन्द्रकरुणापारीण
    हे माधव । हे रामानुज हे जगत्रयगुरो हे पुण्डरीकाक्ष मां हे गोपीजननाथ पालय परं जानामि न त्वां विना ॥
    ६॥ हे राम पुरुषोत्तम नरहरे नारायण केशव गोविन्द गरुडध्वज गुणनिधे दामोदर माधव । हे कृष्ण कमलापते यदुपते
    सीतापते श्रीपते हे वैकुण्ठपते चराचरपते लक्ष्मीपते पाहि माम् ॥ ७॥ इति श्रीरामानुजस्तोत्रं सम्पूर्णम्
    ॥ ७॥
