id: mandala
category: upanishad
name:
  english: mandala
  devanagari: मन्दल
content:
  english: paramadvitiyapradyotamanam tattvakasham bhavati | kotisuryaprakasham suryakasham bhavati |
    evamabhyasattanmayo bhavati | ya evam veda || 2|| tadyogam ca dvidha viddhi purvottaravibhagatah |
    purvam tu tarakam vidyadamanaskam taduttaramiti | tarakam dvividham | murtitarakamamurtitarakamiti
    | yadindriyantam tanmurtitarakam | yadbhruyugatitam tadamurtitarakamiti | ubhayamapi manoyuktamabhyaset
    | manoyuktantaradrishtistarakaprakashaya bhavati | bhruyugamadhyabile tejasa avirbhavah | etatpurvatarakam
    | uttaram tvamanaskam | talumulordhvabhage mahajyotirvidyate | taddarshanadanimadisiddhih | lakshye'ntarbahyayam
    drishtau nimeshonmeshavarjitayam ca iyam shambhavi mudra bhavati | sarvatantreshu gopyamahavidya bhavati
    | tajjnanena samsaranivrittih | tatpujanam mokshaphaladam | antarlakshyam jalajyotihsvarupam bhavati
    | maharshivedyam antarbahyendriyairadrishyam || 3|| sahasrare jalajyotirantarlakshyam | buddhiguhayam
    sarvangasundaram purusharupamantarlakshyamityapare | shirshantargatamandalamadhyagam pancavaktramumasahayam
    nilakantham prashantamantarlakshyamiti kecit | angushthamatrah purusho'ntarlakshyamityeke | uktavikalpam
    sarvamatmaiva | tallakshyam shuddhatmadrishtya va yah pashyati sa eva brahmanishtho bhavati | jivah
    pancavimshakah svakalpitacaturvimshatitattvam parityajya shadvimshah paramatmahamiti nishcayajjivanmukto
    bhavati | evamantarlakshyadarshanena jivanmuktidashayam svayamantarlakshyo bhutva paramakashakhandamandalo
    bhavati || 4|| iti prathamam brahmanam || atha ha yajnavalkya adityamandalapurusham papraccha | bhagavannantarlakshyadikam
    bahudhoktam | maya tanna jnatam | tadbruhi mahyam | taduhovaca pancabhuta
  devanagari: परमाद्वितीयप्रद्योतमानं तत्त्वाकाशं भवति । कोटिसूर्यप्रकाशं सूर्याकाशं भवति । एवमभ्यासात्तन्मयो
    भवति । य एवं वेद ॥ २॥ तद्योगं च द्विधा विद्धि पूर्वोत्तरविभागतः । पूर्वं तु तारकं विद्यादमनस्कं तदुत्तरमिति
    । तारकं द्विविधम् । मूर्तितारकममूर्तितारकमिति । यदिन्द्रियान्तं तन्मूर्तितारकम् । यद्भ्रूयुगातीतं
    तदमूर्तितारकमिति । उभयमपि मनोयुक्तमभ्यसेत् । मनोयुक्तान्तरदृष्टिस्तारकप्रकाशाय भवति । भ्रूयुगमध्यबिले
    तेजस आविर्भावः । एतत्पूर्वतारकम् । उत्तरं त्वमनस्कम् । तालुमूलोर्ध्वभागे महाज्योतिर्विद्यते । तद्दर्शनादणिमादिसिद्धिः
    । लक्ष्येऽन्तर्बाह्यायां दृष्टौ निमेषोन्मेषवर्जितायां च इयं शाम्भवी मुद्रा भवति । सर्वतन्त्रेषु गोप्यमहाविद्या
    भवति । तज्ज्ञानेन संसारनिवृत्तिः । तत्पूजनं मोक्षफलदम् । अन्तर्लक्ष्यं जलज्योतिःस्वरूपं भवति । महर्षिवेद्यं
    अन्तर्बाह्येन्द्रियैरदृश्यम् ॥ ३॥ सहस्रारे जलज्योतिरन्तर्लक्ष्यम् । बुद्धिगुहायां सर्वाङ्गसुन्दरं
    पुरुषरूपमन्तर्लक्ष्यमित्यपरे । शीर्षान्तर्गतमण्डलमध्यगं पञ्चवक्त्रमुमासहायं नीलकण्ठं प्रशान्तमन्तर्लक्ष्यमिति
    केचित् । अङ्गुष्ठमात्रः पुरुषोऽन्तर्लक्ष्यमित्येके । उक्तविकल्पं सर्वमात्मैव । तल्लक्ष्यं शुद्धात्मदृष्ट्या
    वा यः पश्यति स एव ब्रह्मनिष्ठो भवति । जीवः पञ्चविंशकः स्वकल्पितचतुर्विंशतितत्त्वं परित्यज्य षड्विंशः
    परमात्माहमिति निश्चयाज्जीवन्मुक्तो भवति । एवमन्तर्लक्ष्यदर्शनेन जीवन्मुक्तिदशायां स्वयमन्तर्लक्ष्यो
    भूत्वा परमाकाशाखण्डमण्डलो भवति ॥ ४॥ इति प्रथमं ब्राह्मणम् ॥ अथ ह याज्ञवल्क्य आदित्यमण्डलपुरुषं पप्रच्छ
    । भगवन्नन्तर्लक्ष्यादिकं बहुधोक्तम् । मया तन्न ज्ञातम् । तद्ब्रूहि मह्यम् । तदुहोवाच पञ्चभूत
