id: shiva-mahimna-stotram
category: stotram
name:
  english: Shiva Mahimna Stotram
  devanagari: शिवमहिम्नस्तोत्रम् (पुष्पदन्तरचितम् शिवरहस्यान्तर्गतम्)
content:
  english: '|| om namah shivaya || || atha shri shivamahimnastotram || mahimnah param te paramavidusho
    yadyasadrishi stutirbrahmadinamapi tadavasannastvayi girah | athavacyah sarvah svamatiparinamavadhi
    grinan mamapyesha stotre hara nirapavadah parikarah || 1|| atitah panthanam tava ca mahima vanmanasayoh
    atadvyavrittya yam cakitamabhidhatte shrutirapi | sa kasya stotavyah katividhagunah kasya vishayah
    pade tvarvacine patati na manah kasya na vacah || 2|| madhusphita vacah paramamamritam nirmitavatah
    tava brahman kim vagapi suragurorvismayapadam | mama tvetam vanim gunakathanapunyena bhavatah punamityarthe''smin
    puramathana buddhirvyavasita || 3|| tavaishvaryam yattajjagadudayarakshapralayakrit trayivastu vyastam
    tisrishu gunabhinnasu tanushu | abhavyanamasminvarada ramaniyamaramanim vihantum vyakroshim vidadhata
    ihaike jadadhiyah || 4|| kimihah kinkayah sa khalu kimupayastribhuvanam kimadharo dhata srijati kimupadana
    iti ca | atarkyaishvarye tvayyanavasara duhstho hatadhiyah kutarko''yam kamshcinmukharayati mohaya
    jagatam (jagatah) || 5|| ajanmano lokah kimavayavavanto''pi jagatam adhishthataram kim bhavavidhiranadritya
    bhavati | anisho va kuryadbhuvanajanane kah parikaro yato mandastvam pratyamaravara samsherata ime
    || 6|| trayi sankhyam yogah pashupatimatam vaishnavamiti prabhinne prasthane paramidamadah pathyamiti
    ca | rucinam vaicitryadrijukutila nanapathajusham nrinameko gamyastvamasi payasamarnava iva || 7||
    mahokshah khatvangam parashurajinam bhasma phaninah kapalam cetiyattava varada tantropakaranam | surastam
    tamriddhim dadhati tu bhavadbhupranihitam na hi svatmaramam vishayamrigatrishna bhramayati || 8||
    dhruvam kashcidbrute sakalamaparastvam dhruvamiti (dhruvam kashcitsarvam sakalamaparastvadhruvamidam)
    paro dhrauvyadhrauvye jagati gadati vyastavishaye | samaste''pyetasminpuramathana tairvismita iva
    stuvanjihremi tvam na khalu nanu dhrishta mukharata || 9|| tvatmanam (tavaishvaryam) yatnadyadupari
    virincirhariradhah (virinco hariradhah) paricchettum yatavanilamanala skandhavapushah | (yatavanilamanala)
    (stambhavapushah) tato bhaktishraddhabharagurugrinadbhyam girisha yat svayam tasthe tabhyam tvayi
    (tava) kimanuvrittirna phalati || 10|| ayatnadapadya (ayatnadasadya) tribhuvanamavairavyatikaram dashasyo
    yadbahunabhrita ranakanduparavashan | shirahpadmashreniracitacaranambhoruhabaleh sthirayastvadbhaktestripurahara
    visphurjitamidam || 11|| amushya tvatsevasamadhigatasaram bhujavanam balatkailase''pi tvadadhivasatau
    vikramayatah | alabhya patale''pyalasacalitangushthashirasi pratishtha tvayyasiddhruvamupacito muhyati
    khalah || 12|| yadanghrim (yadriddhim) sutramno varada paramoccairapi satim adhashcakre banah parijanavidheyastribhuvanah
    (parijanavidheyatribhuvanah) | na taccitram tasminvarivasitari tvaccaranayoh na kasyapyunnatyai bhavati
    shirasastvayyavanatih (shirasitvayyavanatih) || 13|| akandabrahmandakshayacakitadevasurakripa vidheyasya''''sidyastrinayana
    visham samhritavatah | sa kalmashah kanthe tava na kurute na shriyamaho vikaro''pi shlaghyo bhuvanabhayabhangavyasaninah
    || 14|| asiddhartha naiva kvacidapi sadevasuranare nivartante nityam jagati jayino yasya vishikhah
    | sa pashyannisha tvamitarasurasadharanamabhut smarah smartavyatma na hi vashishu pathyah paribhavah
    || 15|| mahi padaghatadvrajati sahasa samshayapadam padam vishnorbhramyadbhujaparigharugna grahaganam
    | muhurdyaurdausthyam yatyanibhrita jatatadita tata jagadrakshayai tvam natasi nanu vamaiva vibhuta
    || 16|| viyadvyapi taraganagunitaphenodgamarucih pravaho varam yah prishatalaghudrishtah shirasi te
    | jagaddvipakaram jaladhivalayam tena kritamiti anenaivonneyam dhritamahima divyam tava vapuh || 17||
    rathah kshoni yanta shatadhritiragendro dhanuratho rathange candrarkau rathacaranapanih shara iti
    | didhakshoste ko''yam tripuratrinamadambara vidhih vidheyaih kridantyo na khalu paratantrah prabhudhiyah
    || 18|| hariste sahasram kamalabalimadhaya padayoh yadekone tasmin nijamudaharannetrakamalam | gato
    bhaktyudrekah parinatimasau cakra vapusha (cakravapushah) trayanam rakshayai tripurahara jagarti jagatam
    || 19|| kratau supte jagrattvamasi phalayoge kratumatam kva karmapradhvastam phalati purusharadhanamrite
    | atastvam samprekshya kratushu phaladana pratibhuvam shrutau shraddham baddha (baddhva) dridhaparikarah
    karmasu janah || 20|| kriyadaksho dakshah kratupatiradhishastanubhritam rishinamartvijyam sharanada
    sadasyah suraganah | kratubhreshastvattah (kratubhramshastvattah) kratuphalavidhana vyasaninah dhruvam
    kartum shraddha vidhuramabhicaraya hi makhah || 21|| satamvartmatyaktva shrutisamadhigamyam sahabhuvam
    ghrinamapyunmulya svajanavishayasneha gunitam | dvijah krintanpade pitaramaparaddham tvayi vibho manushyatvam
    sadyastridasha parinamena vijahau || 22|| prajanatham natha prasabhamabhikam svam duhitaram gatam
    rohidbhutam riramayishumrishyasya vapusha | dhanushpaneryatam divamapi sapatrakritamamum trasantam
    te''dyapi tyajati na mrigavyadharabhasah || 23/22|| svalavanyashamsa dhritadhanushamahnaya trinavat
    purah plushtam drishtva puramathana pushpayudhamapi | yadistrainam devi yamaniratadehardha ghatanat
    avaiti tvamaddha bata varada mugdha yuvatayah || 24/23|| shmashaneshvakrida smarahara pishacah sahacarah
    citabhasmalepah sragapi nrikarotiparikarah | amangalyam shilam tava bhavatu namaivamakhilam tathapi
    smartrinam varada paramam mangalamasi || 25/24|| manah pratyakcitte savidhamavidhayattamarutah prahrishyadromanah
    pramadasalilotsangatidrishah | yadalokyahladam hrada iva nimajyamritamaye dadhatyantastattvam kimapi
    yaminastatkila bhavan || 26/25|| tvamarkastvam somastvamasi pavanastvam hutavahah tvamapastvam vyoma
    tvamu dharaniratma tvamiti ca | paricchinnamevam tvayi parinata bibhrati giram na vidmastattattvam
    vayamiha tu yattvam na bhavasi || 27/26|| trayim tisro vrittistribhuvanamatho trinapi suran akaradyairvarnaistribhirabhidadhattirna
    vikriti | turiyam te dhama dhvanibhiravarundhanamanubhih samastam(sta) vyastam tvam sharanada grinatyomiti
    padam || 28/27|| bhavah sharvo rudrah pashupatirathograh sa ca mahams (sahamahan) tatha bhimeshanaviti
    yadabhidhanashtakamidam | amushminpratyekam pravicarati deva shrutirapi priyayasmaidhamne pranihitanamasyo''smi
    bhavate || 29/28|| namo nedishthaya priya varadavishthaya ca namah (namo nedishthaya priyadava davishthaya
    ca namah) namah kshodishthaya smarahara mahishthaya ca namah | namo varshishthaya trinayana yavishthaya
    ca namah namah sarvasmai te tadidamatisarvaya ca namah || 30/29|| bahularajase vishvotpattau bhavaya
    namo namah janasukhakrite sattvodriktau mridaya namo namah | prabalatamase tatsamhare haraya namo
    namah pramahasi pade nistraigunye shivaya namo namah || 31/30|| krishaparinaticetah kleshavashyam
    kvacedam kva ca tava gunasimollanghini shashvadriddhih | iti cakitamamandikritya mam bhaktiradhat
    varada caranayoste vakyapushpopaharam || 32/31|| vapuh pradurbhavadanutamitadam janmani pura purare
    nakvapi kshanamapi bhavantam pranatavan | namanmuktah sampratyahamalanuragre''pyanatima nitisha kshantavyam
    tadidamaparadhadvayamapi || 33|| asitagirisamam syatkajjalam sindhupatre surataruvarashakha lekhani
    patramurvi | yadi likhati grihitva sharada sarvakalam tadapi tava gunanamisha param na yati || 34/32||
    asurasuramunindrairarcitasyendumauleh grathitagunamahimno nirgunasyeshvarasya | sakalaguna(gana)varishthah
    pushpadantabhidhanah ruciramalaghuvrittam(ttaih) stotrametaccakara || 35/33|| aharaharanavadyam dhurjateh
    stotrametat pathati paramabhaktya shuddhacittah pumanyah | sa bhavati shivaloke rudratulyastathatra
    pracurataradhanayuh putravankirtimamshca || 36/34|| maheshannaparo devo mahimno napara stutih | aghorannaparo
    mantro nasti tattvam guroh param || 37/35|| phalam - diksha danam tapastirtham jnanam (snanam) yagadikah
    kriyah | mahimna:stavapathasya kalam narhanti shodashim || 36|| kusumadashananama sarvagandharvarajah
    shashidharavaramaulerdevadevasya dasah | sa khalu nijamahimno bhrashta evasya roshat stavanamidamakarshiddivyadivyam
    mahimnah || 37|| suravaramunipujyam svargamokshaikahetum pathati yadi manushyah pranjalirnanyacetah
    | vrajati shivasamipam kinnaraih stuyamanah stavanamidamamogham pushpadantapranitam || 38|| asamaptamidam
    stotram punyam gandharvabhashitam | anaupamyam manohari shivamishvaravarnanam || 39|| ityesha vanmayi
    puja shrimacchankarapadayoh | arpita tena deveshah priyatam me sadashivah || 40|| tava tattvam na
    janami kidrisho''si maheshvara | ya drisho''si mahadeva tadrishaya namo namah || 41|| ekakalam dvikalam
    va trikalam yah pathennarah | sarvapapavinirmuktah shivaloke mahiyate || 42|| shri pushpadantamukhapankajanirgatena
    stotrena kilbishaharena harapriyena | kanthasthitena pathitena samahitena suprinito bhavati bhutapatirmaheshah
    || 43|| || iti shripushpadantaviracitam shivamahimnastotram sampurnam || notes: om namah shivaya |
    adhinamagadham divyam vyadhinam mulakrintanam | upadravanam dalanam mahadevamupasmahe || 1|| aham
    papi papakshapana nipunah shankara bhavan | aham bhito bhitabhayavitarane te vyasanita aham dino dinoddharana
    vidhisajjastvaditarat na jane''ham vaktum kuru sakala shocye mayi kripam || 2|| janastvadapadabjashravanamananadhyananipunah
    svayam te vistirna na khalu karuna teshu karana | bhave line dine mayi mananahine na karuna katham
    natha khyatastvamasi karunagara sagara iti || 3|| om mahimnah param te |||| vapushpradurbhavadanutamitadam
    janmani pura purare ! naivaham kvacidapi bhavantam pranatavan | namanmuktah sampratyatanurahamagrepyanatiman
    mahesha ! kshantavyam tadidamaparadhadvayamapi || 30||'
  devanagari: '॥ ॐ नमः शिवाय ॥ ॥ अथ श्री शिवमहिम्नस्तोत्रम् ॥ महिम्नः पारं ते परमविदुषो यद्यसदृशी स्तुतिर्ब्रह्मादीनामपि
    तदवसन्नास्त्वयि गिरः । अथावाच्यः सर्वः स्वमतिपरिणामावधि गृणन् ममाप्येष स्तोत्रे हर निरपवादः परिकरः
    ॥ १॥ अतीतः पन्थानं तव च महिमा वाङ्मनसयोः अतद्व्यावृत्त्या यं चकितमभिधत्ते श्रुतिरपि । स कस्य स्तोतव्यः
    कतिविधगुणः कस्य विषयः पदे त्वर्वाचीने पतति न मनः कस्य न वचः ॥ २॥ मधुस्फीता वाचः परमममृतं निर्मितवतः
    तव ब्रह्मन् किं वागपि सुरगुरोर्विस्मयपदम् । मम त्वेतां वाणीं गुणकथनपुण्येन भवतः पुनामीत्यर्थेऽस्मिन्
    पुरमथन बुद्धिर्व्यवसिता ॥ ३॥ तवैश्वर्यं यत्तज्जगदुदयरक्षाप्रलयकृत् त्रयीवस्तु व्यस्तं तिसृषु गुणभिन्नासु
    तनुषु । अभव्यानामस्मिन्वरद रमणीयामरमणीं विहन्तुं व्याक्रोशीं विदधत इहैके जडधियः ॥ ४॥ किमीहः किङ्कायः
    स खलु किमुपायस्त्रिभुवनं किमाधारो धाता सृजति किमुपादान इति च । अतर्क्यैश्वर्ये त्वय्यनवसर दुःस्थो
    हतधियः कुतर्कोऽयं कांश्चिन्मुखरयति मोहाय जगताम् (जगतः) ॥ ५॥ अजन्मानो लोकाः किमवयववन्तोऽपि जगतां अधिष्ठातारं
    किं भवविधिरनादृत्य भवति । अनीशो वा कुर्याद्भुवनजनने कः परिकरो यतो मन्दास्त्वां प्रत्यमरवर संशेरत इमे
    ॥ ६॥ त्रयी साङ्ख्यं योगः पशुपतिमतं वैष्णवमिति प्रभिन्ने प्रस्थाने परमिदमदः पथ्यमिति च । रुचीनां वैचित्र्यादृजुकुटिल
    नानापथजुषां नृणामेको गम्यस्त्वमसि पयसामर्णव इव ॥ ७॥ महोक्षः खट्वाङ्गं परशुरजिनं भस्म फणिनः कपालं चेतीयत्तव
    वरद तन्त्रोपकरणम् । सुरास्तां तामृद्धिं दधति तु भवद्भूप्रणिहितां न हि स्वात्मारामं विषयमृगतृष्णा भ्रमयति
    ॥ ८॥ ध्रुवं कश्चिद्ब्रूते सकलमपरस्त्वं ध्रुवमिति (ध्रुवं कश्चित्सर्वं सकलमपरस्त्वध्रुवमिदं) परो ध्रौव्याध्रौव्ये
    जगति गदति व्यस्तविषये । समस्तेऽप्येतस्मिन्पुरमथन तैर्विस्मित इव स्तुवन्जिह्रेमि त्वां न खलु ननु धृष्टा
    मुखरता ॥ ९॥ त्वात्मानं (तवैश्वर्यं) यत्नाद्यदुपरि विरिञ्चिर्हरिरधः (विरिञ्चो हरिरधः) परिच्छेत्तुं
    यातावनिलमनल स्कन्धवपुषः । (यातावनिलमनल) (स्तम्भवपुषः) ततो भक्तिश्रद्धाभरगुरुगृणद्भ्यां गिरिश यत् स्वयं
    तस्थे ताभ्यां त्वयि (तव) किमनुवृत्तिर्न फलति ॥ १०॥ अयत्नादापाद्य (अयत्नादासाद्य) त्रिभुवनमवैरव्यतिकरं
    दशास्यो यद्बाहूनभृत रणकण्डूपरवशान् । शिरःपद्मश्रेणीरचितचरणाम्भोरुहबलेः स्थिरायास्त्वद्भक्तेस्त्रिपुरहर
    विस्फूर्जितमिदम् ॥ ११॥ अमुष्य त्वत्सेवासमधिगतसारं भुजवनं बलात्कैलासेऽपि त्वदधिवसतौ विक्रमयतः । अलभ्या
    पातालेऽप्यलसचलिताङ्गुष्ठशिरसि प्रतिष्ठा त्वय्यासीद्ध्रुवमुपचितो मुह्यति खलः ॥ १२॥ यदङ्घ्रिं (यदृद्धिं)
    सुत्राम्णो वरद परमोच्चैरपि सतीं अधश्चक्रे बाणः परिजनविधेयस्त्रिभुवनः (परिजनविधेयत्रिभुवनः) । न तच्चित्रं
    तस्मिन्वरिवसितरि त्वच्चरणयोः न कस्याप्युन्नत्यै भवति शिरसस्त्वय्यवनतिः (शिरसित्वय्यवनतिः) ॥ १३॥ अकाण्डब्रह्माण्डक्षयचकितदेवासुरकृपा
    विधेयस्याऽऽसीद्यस्त्रिनयन विषं संहृतवतः । स कल्माषः कण्ठे तव न कुरुते न श्रियमहो विकारोऽपि श्लाघ्यो
    भुवनभयभङ्गव्यसनिनः ॥ १४॥ असिद्धार्था नैव क्वचिदपि सदेवासुरनरे निवर्तन्ते नित्यं जगति जयिनो यस्य विशिखाः
    । स पश्यन्नीश त्वामितरसुरसाधारणमभूत् स्मरः स्मर्तव्यात्मा न हि वशिषु पथ्यः परिभवः ॥ १५॥ मही पादाघाताद्व्रजति
    सहसा संशयपदं पदं विष्णोर्भ्राम्यद्भुजपरिघरुग्ण ग्रहगणम् । मुहुर्द्यौर्दौस्थ्यं यात्यनिभृत जटाताडित
    तटा जगद्रक्षायै त्वं नटसि ननु वामैव विभुता ॥ १६॥ वियद्व्यापी तारागणगुणितफेनोद्गमरुचिः प्रवाहो वारां
    यः पृषतलघुदृष्टः शिरसि ते । जगद्द्वीपाकारं जलधिवलयं तेन कृतमिति अनेनैवोन्नेयं धृतमहिम दिव्यं तव वपुः
    ॥ १७॥ रथः क्षोणी यन्ता शतधृतिरगेन्द्रो धनुरथो रथाङ्गे चन्द्रार्कौ रथचरणपाणिः शर इति । दिधक्षोस्ते
    कोऽयं त्रिपुरतृणमाडम्बर विधिः विधेयैः क्रीडन्त्यो न खलु परतन्त्राः प्रभुधियः ॥ १८॥ हरिस्ते साहस्रं
    कमलबलिमाधाय पदयोः यदेकोने तस्मिन् निजमुदहरन्नेत्रकमलम् । गतो भक्त्युद्रेकः परिणतिमसौ चक्र वपुषा (चक्रवपुषः)
    त्रयाणां रक्षायै त्रिपुरहर जागर्ति जगताम् ॥ १९॥ क्रतौ सुप्ते जाग्रत्त्वमसि फलयोगे क्रतुमतां क्व कर्मप्रध्वस्तं
    फलति पुरुषाराधनमृते । अतस्त्वां सम्प्रेक्ष्य क्रतुषु फलदान प्रतिभुवं श्रुतौ श्रद्धां बद्धा (बद्ध्वा)
    दृढपरिकरः कर्मसु जनः ॥ २०॥ क्रियादक्षो दक्षः क्रतुपतिरधीशस्तनुभृतां ऋषीणामार्त्विज्यं शरणद सदस्याः
    सुरगणाः । क्रतुभ्रेषस्त्वत्तः (क्रतुभ्रंशस्त्वत्तः) क्रतुफलविधान व्यसनिनः ध्रुवं कर्तुं श्रद्धा विधुरमभिचाराय
    हि मखाः ॥ २१॥ सतांवर्त्मत्यक्त्वा श्रुतिसमधिगम्यं सहभुवं घृणामप्युन्मूल्य स्वजनविषयस्नेह गुणिताम्
    । द्विजः कृन्तन्पादे पितरमपराद्धं त्वयि विभो मनुष्यत्वं सद्यस्त्रिदश परिणामेन विजहौ ॥ २२॥ प्रजानाथं
    नाथ प्रसभमभिकं स्वां दुहितरं गतं रोहिद्भूतां रिरमयिषुमृष्यस्य वपुषा । धनुष्पाणेर्यातं दिवमपि सपत्राकृतममुं
    त्रसन्तं तेऽद्यापि त्यजति न मृगव्याधरभसः ॥ २३/२२॥ स्वलावण्याशंसा धृतधनुषमह्नाय तृणवत् पुरः प्लुष्टं
    दृष्ट्वा पुरमथन पुष्पायुधमपि । यदिस्त्रैणं देवी यमनिरतदेहार्ध घटनात् अवैति त्वामद्धा बत वरद मुग्धा
    युवतयः ॥ २४/२३॥ श्मशानेष्वाक्रीडा स्मरहर पिशाचाः सहचराः चिताभस्मालेपः स्रगपि नृकरोटीपरिकरः । अमङ्गल्यं
    शीलं तव भवतु नामैवमखिलं तथापि स्मर्तॄणां वरद परमं मङ्गलमसि ॥ २५/२४॥ मनः प्रत्यक्चित्ते सविधमविधायात्तमरुतः
    प्रहृष्यद्रोमाणः प्रमदसलिलोत्सङ्गतिदृशः । यदालोक्याह्लादं ह्रद इव निमज्यामृतमये दधत्यन्तस्तत्त्वं
    किमपि यमिनस्तत्किल भवान् ॥ २६/२५॥ त्वमर्कस्त्वं सोमस्त्वमसि पवनस्त्वं हुतवहः त्वमापस्त्वं व्योम त्वमु
    धरणिरात्मा त्वमिति च । परिच्छिन्नामेवं त्वयि परिणता बिभ्रति गिरं न विद्मस्तत्तत्त्वं वयमिह तु यत्त्वं
    न भवसि ॥ २७/२६॥ त्रयीं तिस्रो वृत्तीस्त्रिभुवनमथो त्रीनपि सुरान् अकाराद्यैर्वर्णैस्त्रिभिरभिदधत्तीर्ण
    विकृति । तुरीयं ते धाम ध्वनिभिरवरुन्धानमणुभिः समस्तं(स्त) व्यस्तं त्वां शरणद गृणात्योमिति पदम् ॥ २८/२७॥
    भवः शर्वो रुद्रः पशुपतिरथोग्रः स च महांस् (सहमहान्) तथा भीमेशानाविति यदभिधानाष्टकमिदम् । अमुष्मिन्प्रत्येकं
    प्रविचरति देव श्रुतिरपि प्रियायास्मैधाम्ने प्रणिहितनमस्योऽस्मि भवते ॥ २९/२८॥ नमो नेदिष्ठाय प्रिय वरदविष्ठाय
    च नमः (नमो नेदिष्ठाय प्रियदव दविष्ठाय च नमः) नमः क्षोदिष्ठाय स्मरहर महिष्ठाय च नमः । नमो वर्षिष्ठाय
    त्रिनयन यविष्ठाय च नमः नमः सर्वस्मै ते तदिदमतिसर्वाय च नमः ॥ ३०/२९॥ बहुलरजसे विश्वोत्पत्तौ भवाय नमो
    नमः जनसुखकृते सत्त्वोद्रिक्तौ मृडाय नमो नमः । प्रबलतमसे तत्संहारे हराय नमो नमः प्रमहसि पदे निस्त्रैगुण्ये
    शिवाय नमो नमः ॥ ३१/३०॥ कृशपरिणतिचेतः क्लेशवश्यं क्वचेदं क्व च तव गुणसीमोल्लङ्घिनी शश्वदृद्धिः । इति
    चकितममन्दीकृत्य मां भक्तिराधात् वरद चरणयोस्ते वाक्यपुष्पोपहारम् ॥ ३२/३१॥ वपुः प्रादुर्भावादनुतमितदं
    जन्मनि पुरा पुरारे नक्वापि क्षणमपि भवन्तं प्रणतवान् । नमन्मुक्तः सम्प्रत्यहमलनुरग्रेऽप्यनतिमा नितीश
    क्षन्तव्यं तदिदमपराधद्वयमपि ॥ ३३॥ असितगिरिसमं स्यात्कज्जलं सिन्धुपात्रे सुरतरुवरशाखा लेखनी पत्रमुर्वी
    । यदि लिखति गृहीत्वा शारदा सर्वकालं तदपि तव गुणानामीश पारं न याति ॥ ३४/३२॥ असुरसुरमुनीन्द्रैरर्चितस्येन्दुमौलेः
    ग्रथितगुणमहिम्नो निर्गुणस्येश्वरस्य । सकलगुण(गण)वरिष्ठः पुष्पदन्ताभिधानः रुचिरमलघुवृत्तं(त्तैः) स्तोत्रमेतच्चकार
    ॥ ३५/३३॥ अहरहरनवद्यं धूर्जटेः स्तोत्रमेतत् पठति परमभक्त्या शुद्धचित्तः पुमान्यः । स भवति शिवलोके रुद्रतुल्यस्तथात्र
    प्रचुरतरधनायुः पुत्रवान्कीर्तिमांश्च ॥ ३६/३४॥ महेशान्नापरो देवो महिम्नो नापरा स्तुतिः । अघोरान्नापरो
    मन्त्रो नास्ति तत्त्वं गुरोः परम् ॥ ३७/३५॥ फलम् - दीक्षा दानं तपस्तीर्थं ज्ञानं (स्नानं) यागादिकाः
    क्रियाः । महिम्न:स्तवपाठस्य कलां नार्हन्ति षोडशीम् ॥ ३६॥ कुसुमदशननामा सर्वगन्धर्वराजः शशिधरवरमौलेर्देवदेवस्य
    दासः । स खलु निजमहिम्नो भ्रष्ट एवास्य रोषात् स्तवनमिदमकार्षीद्दिव्यदिव्यं महिम्नः ॥ ३७॥ सुरवरमुनिपूज्यं
    स्वर्गमोक्षैकहेतुं पठति यदि मनुष्यः प्राञ्जलिर्नान्यचेताः । व्रजति शिवसमीपं किन्नरैः स्तूयमानः स्तवनमिदममोघं
    पुष्पदन्तप्रणीतम् ॥ ३८॥ आसमाप्तमिदं स्तोत्रं पुण्यं गन्धर्वभाषितम् । अनौपम्यं मनोहारि शिवमीश्वरवर्णनम्
    ॥ ३९॥ इत्येषा वाङ्मयी पूजा श्रीमच्छङ्करपादयोः । अर्पिता तेन देवेशः प्रीयतां मे सदाशिवः ॥ ४०॥ तव तत्त्वं
    न जानामि कीदृशोऽसि महेश्वर । या दृशोऽसि महादेव तादृशाय नमो नमः ॥ ४१॥ एककालं द्विकालं वा त्रिकालं यः
    पठेन्नरः । सर्वपापविनिर्मुक्तः शिवलोके महीयते ॥ ४२॥ श्री पुष्पदन्तमुखपङ्कजनिर्गतेन स्तोत्रेण किल्बिषहरेण
    हरप्रियेण । कण्ठस्थितेन पठितेन समाहितेन सुप्रीणितो भवति भूतपतिर्महेशः ॥ ४३॥ ॥ इति श्रीपुष्पदन्तविरचितं
    शिवमहिम्नस्तोत्रं सम्पूर्णम् ॥ णोतेस्: ॐ नमः शिवाय । आधीनामगधं दिव्यं व्याधीनां मूलकृन्तनम् । उपद्रावाणां
    दलनं महादेवमुपास्महे ॥ १॥ अहं पापी पापक्षपण निपूणाः शङ्कर भवान् । अहं भीतो भीताभयवितरणे ते व्यसनिता
    अहं दीनो दीनोद्धरण विधिसज्जस्त्वदितरत् न जानेऽहं वक्तुं कुरु सकल शोच्ये मयि कृपाम् ॥ २॥ जनस्त्वदपादाब्जश्रवणमननध्याननिपुणाः
    स्वयं ते विस्तीर्णा न खलु करुणा तेषु करणा । भवे लीने दीने मयि मननहीने न करुणा कथं नाथ ख्यातस्त्वमसि
    करुणागार सागर इति ॥ ३॥ ॐ महिम्नः पारं ते ॥॥ वपुष्प्रादुर्भावादनुतमितदं जन्मनि पुरा पुरारे ! नैवाहं
    क्वचिदपि भवन्तं प्रणतवान् । नमन्मुक्तः सम्प्रत्यतनुरहमग्रेप्यनतिमान् महेश ! क्षन्तव्यं तदिदमपराधद्वयमपि
    ॥ ३०॥'
