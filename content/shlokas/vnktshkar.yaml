id: vnktshkar
category: stotram
name:
  english: vnktshkar
  devanagari: व्न्क्त्श्कर्
content:
  english: shrivenkatesha karavalambastotram shrisheshashailasuniketana divyamurte narayanacyuta hare
    nalinayataksha | lilakatakshaparirakshitasarvaloka shrivenkatesha mama dehi karavalambam || 1|| brahmadivanditapadambuja
    shankhapane shrimatsudarshanasushobhitadivyahasta | karunyasagara sharanya supunyamurte shrivenkatesha
    mama dehi karavalambam || 2|| vedanta
  devanagari: श्रीवेङ्कटेश करावलम्बस्तोत्रम् श्रीशेषशैलसुनिकेतन दिव्यमूर्ते नारायणाच्युत हरे नलिनायताक्ष
    । लीलाकटाक्षपरिरक्षितसर्वलोक श्रीवेङ्कटेश मम देहि करावलम्बम् ॥ १॥ ब्रह्मादिवन्दितपदाम्बुज शङ्खपाणे
    श्रीमत्सुदर्शनसुशोभितदिव्यहस्त । कारुण्यसागर शरण्य सुपुण्यमूर्ते श्रीवेङ्कटेश मम देहि करावलम्बम् ॥
    २॥ वेदान्त
meaning: {}
