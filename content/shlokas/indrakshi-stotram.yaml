id: indrakshi-stotram
category: stotram
name:
  english: Indrakshi Stotram
  devanagari: इन्द्राक्षीस्तोत्रम् १ (इन्द्राक्षी नाम सा देवी)
content:
  english: shriganeshaya namah | purvanyasah asya shri indrakshistotramahamantrasya, shacipurandara rishih,
    anushtup chandah, indrakshi durga devata, lakshmirbijam, bhuvaneshvariti shaktih, bhavaniti kilakam
    , indrakshiprasadasiddhyarthe jape viniyogah | karanyasah - om indrakshityangushthabhyam namah | om
    mahalakshmiti tarjanibhyam namah | om maheshvariti madhyamabhyam namah | om ambujakshityanamikabhyam
    namah | om katyayaniti kanishthikabhyam namah | om kaumariti karatalakaraprishthabhyam namah || anganyasah
    - om indrakshiti hridayaya namah | om mahalakshmiti shirase svaha | om maheshvariti shikhayai vashat
    | om ambujakshiti kavacaya hum | om katyayaniti netratrayaya vaushat | om kaumariti astraya phat |
    om bhurbhuvah svarom iti digbandhah || dhyanam- netranam dashabhishshataih parivritamatyugracarmambaram
    hemabham mahatim vilambitashikhamamuktakeshanvitam | ghantamandita-padapadmayugalam nagendra-kumbhastanim
    indrakshim paricintayami manasa kalpoktasiddhipradam || indrakshim dvibhujam devim pitavastradvayanvitam
    | vamahaste vajradharam dakshinena varapradam || indrakshim sahasrayuvatim nanalankara-bhushitam |
    prasannavadanambhojamapsarogana-sevitam || dvibhujam saumyavadanam pashankushadharam param | trailokyamohinim
    devimindrakshinamakirtitam || pitambaram vajradharaikahastam nanavidhalankaranam prasannam | tvamapsarassevita-padapadmamindrakshi
    vande shivadharmapatnim || indradibhih surairvandyam vande shankaravallabham | evam dhyatva mahadevim
    japet sarvarthasiddhaye || lam prithivyatmane gandham samarpayami | ham akashatmane pushpaih pujayami
    | yam vayvatmane dhupamaghrapayami | ram agnyatmane dipam darshayami | vam amritatmane amritam mahanaivedyam
    nivedayami | sam sarvatmane sarvopacara-pujam samarpayami | vajrini purvatah patu cagneyyam parameshvari
    | dandini dakshine patu nairrityam patu khadgini || 1|| pashcime pashadhari ca dhvajastha vayu-dinmukhe
    | kaumodaki tathodicyam patvaishanyam maheshvari || 2|| urdhvadeshe padmini mamadhastat patu vaishnavi
    | evam dasha-disho rakshet sarvada bhuvaneshvari || 3|| indra uvaca | indrakshi nama sa devi daivataih
    samudahrita | gauri shakambhari devi durga namniti vishruta || 4|| nityananda nirahara nishkalayai
    namo'stu te | katyayani mahadevi candraghanta mahatapah || 5|| savitri sa ca gayatri brahmani brahmavadini
    | narayani bhadrakali rudrani krishnapingala || 6|| agnijvala raudramukhi kalaratristapasvini | meghasshyama
    sahasrakshi vikatangi jadodari || 7|| (vikarangi) mahodari muktakeshi ghorarupa mahabala | ajita bhadradananta
    rogahartri shivaprada || 8|| shivaduti karali ca pratyaksha-parameshvari | indrani indrarupa ca indrashaktih
    parayana || 9|| sada sammohini devi sundari bhuvaneshvari | ekakshari parabrahmasthulasukshma-pravardhini
    || 10|| rakshakari raktadanta raktamalyambara para | mahishasura-hantri ca camunda khadgadharini ||
    11|| varahi narasimhi ca bhima bhairavanadini | shrutih smritirdhritirmedha vidya lakshmih sarasvati
    || 12|| ananta vijayaparna manastokaparajita | bhavani parvati durga haimavatyambika shiva || 13||
    shiva bhavani rudrani shankarardha-sharirini | airavatagajarudha vajrahasta varaprada || 14|| nitya
    sakala-kalyani sarvaishvarya-pradayini | dakshayani padmahasta bharati sarvamangala || 15|| kalyani
    janani durga sarvadurgavinashini | (sarvaduhkhavinashini) indrakshi sarvabhuteshi sarvarupa manonmani
    || 16|| mahishamastaka-nritya-vinodana-sphutarananmani-nupura-paduka | janana-rakshana-mokshavidhayini
    jayatu shumbha-nishumbha-nishudini || 17|| sarvamangala-mangalye shive sarvartha-sadhike | sharanye
    tryambake devi narayani namo'stute || 18|| om hrim shrim indrakshyai namah| om namo bhagavati, indrakshi,
    sarvajana-sammohini, kalaratri, narasimhi, sarvashatrusamharini | anale, abhaye, ajite, aparajite,
    mahasimhavahini, mahishasuramardini | hana hana, mardaya mardaya, maraya maraya, shoshaya shoshaya,
    dahaya dahaya, mahagrahan samhara samhara || 19|| yakshagraha-rakshasagraha-skandhagraha-vinayakagraha-balagraha-kumaragraha-
    bhutagraha-pretagraha-pishacagrahadin mardaya mardaya || 20|| bhutajvara-pretajvara-pishacajvaran
    samhara samhara | dhumabhutan sandravaya sandravaya | shirashshula-katishulangashula-parshvashula-
    pandurogadin samhara samhara || 21|| ya-ra-la-va-sha-sha-sa-ha, sarvagrahan tapaya tapaya, samhara
    samhara, chedaya chedaya hram hrim hrum phat svaha || 22|| guhyat-guhya-goptri tvam grihanasmatkritam
    japam | siddhirbhavatu me devi tvatprasadanmayi sthira || 23|| phalashrutih narayana uvaca || evam
    namavarairdevi stuta shakrena dhimata | ayurarogyamaishvaryamapamrityu-bhayapaham || 1|| varam pradanmahendraya
    devarajyam ca shashvatam | indrastotramidam punyam mahadaishvarya-karanam || 2 || kshayapasmara-kushthadi-tapajvara-nivaranam
    | cora-vyaghra-bhayarishtha-vaishnava-jvara-varanam || 3|| maheshvaramahamari-sarvajvara-nivaranam
    | shita-paittaka-vatadi-sarvaroga-nivaranam || 4|| shatamavartayedyastu mucyate vyadhibandhanat |
    avartana-sahasrattu labhate vanchitam phalam || 5|| rajanam ca samapnoti indrakshim natra samshaya
    | nabhimatre jale sthitva sahasraparisamkhyaya || 6|| japet stotramidam mantram vacasiddhirbhaveddhruvam
    | sayam pratah pathennityam shanmasaih siddhirucyate || 7|| samvatsaramupashritya sarvakamarthasiddhaye
    | anena vidhina bhaktya mantrasiddhih prajayate || 8|| santushta ca bhaveddevi pratyaksha samprajayate
    | ashtamyam ca caturdashyamidam stotram pathennarah || 9|| dhavatastasya nashyanti vighnasamkhya na
    samshayah | karagrihe yada baddho madhyaratre tada japet || 10|| divasatrayamatrena mucyate natra
    samshayah | sakamo japate stotram mantrapujavicaratah || 11|| pancadhikairdashadityairiyam siddhistu
    jayate | raktapushpai raktavastrai raktacandanacarcitaih || 12|| dhupadipaishca naivedyaih prasanna
    bhagavati bhavet | evam sampujya indrakshimindrena paramatmana || 13|| varam labdham diteh putra bhagavatyah
    prasadatah | etat stotram mahapunyam japyamayushyavardhanam || 14|| jvaratisara-roganamapamrityorharaya
    ca | dvijairnityamidam japyam bhagyarogyamabhipsubhih || 15|| || iti indrakshi-stotram sampurnam ||
  devanagari: श्रीगणेशाय नमः । पूर्वन्यासः अस्य श्री इन्द्राक्षीस्तोत्रमहामन्त्रस्य, शचीपुरन्दर ऋषिः,
    अनुष्टुप् छन्दः, इन्द्राक्षी दुर्गा देवता, लक्ष्मीर्बीजं, भुवनेश्वरीति शक्तिः, भवानीति कीलकम् , इन्द्राक्षीप्रसादसिद्ध्यर्थे
    जपे विनियोगः । करन्यासः - ॐ इन्द्राक्षीत्यङ्गुष्ठाभ्यां नमः । ॐ महालक्ष्मीति तर्जनीभ्यां नमः । ॐ माहेश्वरीति
    मध्यमाभ्यां नमः । ॐ अम्बुजाक्षीत्यनामिकाभ्यां नमः । ॐ कात्यायनीति कनिष्ठिकाभ्यां नमः । ॐ कौमारीति
    करतलकरपृष्ठाभ्यां नमः ॥ अङ्गन्यासः - ॐ इन्द्राक्षीति हृदयाय नमः । ॐ महालक्ष्मीति शिरसे स्वाहा । ॐ
    माहेश्वरीति शिखायै वषट् । ॐ अम्बुजाक्षीति कवचाय हुम् । ॐ कात्यायनीति नेत्रत्रयाय वौषट् । ॐ कौमारीति
    अस्त्राय फट् । ॐ भूर्भुवः स्वरोम् इति दिग्बन्धः ॥ ध्यानम्- नेत्राणां दशभिश्शतैः परिवृतामत्युग्रचर्माम्बरां
    हेमाभां महतीं विलम्बितशिखामामुक्तकेशान्विताम् । घण्टामण्डित-पादपद्मयुगलां नागेन्द्र-कुम्भस्तनीम् इन्द्राक्षीं
    परिचिन्तयामि मनसा कल्पोक्तसिद्धिप्रदाम् ॥ इन्द्राक्षीं द्विभुजां देवीं पीतवस्त्रद्वयान्विताम् । वामहस्ते
    वज्रधरां दक्षिणेन वरप्रदाम् ॥ इन्द्राक्षीं सहस्रयुवतीं नानालङ्कार-भूषिताम् । प्रसन्नवदनाम्भोजामप्सरोगण-सेविताम्
    ॥ द्विभुजां सौम्यवदनां पाशाङ्कुशधरां पराम् । त्रैलोक्यमोहिनीं देवीमिन्द्राक्षीनामकीर्तिताम् ॥ पीताम्बरां
    वज्रधरैकहस्तां नानाविधालङ्करणां प्रसन्नाम् । त्वामप्सरस्सेवित-पादपद्मामिन्द्राक्षि वन्दे शिवधर्मपत्नीम्
    ॥ इन्द्रादिभिः सुरैर्वन्द्यां वन्दे शङ्करवल्लभाम् । एवं ध्यात्वा महादेवीं जपेत् सर्वार्थसिद्धये ॥
    लं पृथिव्यात्मने गन्धं समर्पयामि । हं आकाशात्मने पुष्पैः पूजयामि । यं वाय्वात्मने धूपमाघ्रापयामि ।
    रं अग्न्यात्मने दीपं दर्शयामि । वं अमृतात्मने अमृतं महानैवेद्यं निवेदयामि । सं सर्वात्मने सर्वोपचार-पूजां
    समर्पयामि । वज्रिणी पूर्वतः पातु चाग्नेय्यां परमेश्वरी । दण्डिनी दक्षिणे पातु नैरॄत्यां पातु खड्गिनी
    ॥ १॥ पश्चिमे पाशधारी च ध्वजस्था वायु-दिङ्मुखे । कौमोदकी तथोदीच्यां पात्वैशान्यां महेश्वरी ॥ २॥ ऊर्ध्वदेशे
    पद्मिनी मामधस्तात् पातु वैष्णवी । एवं दश-दिशो रक्षेत् सर्वदा भुवनेश्वरी ॥ ३॥ इन्द्र उवाच । इन्द्राक्षी
    नाम सा देवी दैवतैः समुदाहृता । गौरी शाकम्भरी देवी दुर्गा नाम्नीति विश्रुता ॥ ४॥ नित्यानन्दा निराहारा
    निष्कलायै नमोऽस्तु ते । कात्यायनी महादेवी चन्द्रघण्टा महातपाः ॥ ५॥ सावित्री सा च गायत्री ब्रह्माणी
    ब्रह्मवादिनी । नारायणी भद्रकाली रुद्राणी कृष्णपिङ्गला ॥ ६॥ अग्निज्वाला रौद्रमुखी कालरात्रिस्तपस्विनी
    । मेघस्श्यामा सहस्राक्षी विकटाङ्गी जडोदरी ॥ ७॥ (विकाराङ्गी) महोदरी मुक्तकेशी घोररूपा महाबला । अजिता
    भद्रदानन्ता रोगहर्त्री शिवप्रदा ॥ ८॥ शिवदूती कराली च प्रत्यक्ष-परमेश्वरी । इन्द्राणी इन्द्ररूपा च
    इन्द्रशक्तिः परायणा ॥ ९॥ सदा सम्मोहिनी देवी सुन्दरी भुवनेश्वरी । एकाक्षरी परब्रह्मस्थूलसूक्ष्म-प्रवर्धिनी
    ॥ १०॥ रक्षाकरी रक्तदन्ता रक्तमाल्याम्बरा परा । महिषासुर-हन्त्री च चामुण्डा खड्गधारिणी ॥ ११॥ वाराही
    नारसिंही च भीमा भैरवनादिनी । श्रुतिः स्मृतिर्धृतिर्मेधा विद्या लक्ष्मीः सरस्वती ॥ १२॥ अनन्ता विजयापर्णा
    मानस्तोकापराजिता । भवानी पार्वती दुर्गा हैमवत्यम्बिका शिवा ॥ १३॥ शिवा भवानी रुद्राणी शङ्करार्ध-शरीरिणी
    । ऐरावतगजारूढा वज्रहस्ता वरप्रदा ॥ १४॥ नित्या सकल-कल्याणी सर्वैश्वर्य-प्रदायिनी । दाक्षायणी पद्महस्ता
    भारती सर्वमङ्गला ॥ १५॥ कल्याणी जननी दुर्गा सर्वदुर्गविनाशिनी । (सर्वदुःखविनाशिनी) इन्द्राक्षी सर्वभूतेशी
    सर्वरूपा मनोन्मनी ॥ १६॥ महिषमस्तक-नृत्य-विनोदन-स्फुटरणन्मणि-नूपुर-पादुका । जनन-रक्षण-मोक्षविधायिनी
    जयतु शुम्भ-निशुम्भ-निषूदिनी ॥ १७॥ सर्वमङ्गल-माङ्गल्ये शिवे सर्वार्थ-साधिके । शरण्ये त्र्यम्बके देवि
    नारायणि नमोऽस्तुते ॥ १८॥ ॐ ह्रीं श्रीं इन्द्राक्ष्यै नमः। ॐ नमो भगवति, इन्द्राक्षि, सर्वजन-सम्मोहिनि,
    कालरात्रि, नारसिंहि, सर्वशत्रुसंहारिणि । अनले, अभये, अजिते, अपराजिते, महासिंहवाहिनि, महिषासुरमर्दिनि
    । हन हन, मर्दय मर्दय, मारय मारय, शोषय शोषय, दाहय दाहय, महाग्रहान् संहर संहर ॥ १९॥ यक्षग्रह-राक्षसग्रह-स्कन्धग्रह-विनायकग्रह-बालग्रह-कुमारग्रह-
    भूतग्रह-प्रेतग्रह-पिशाचग्रहादीन् मर्दय मर्दय ॥ २०॥ भूतज्वर-प्रेतज्वर-पिशाचज्वरान् संहर संहर । धूमभूतान्
    सन्द्रावय सन्द्रावय । शिरश्शूल-कटिशूलाङ्गशूल-पार्श्वशूल- पाण्डुरोगादीन् संहर संहर ॥ २१॥ य-र-ल-व-श-ष-स-ह,
    सर्वग्रहान् तापय तापय, संहर संहर, छेदय छेदय ह्रां ह्रीं ह्रूं फट् स्वाहा ॥ २२॥ गुह्यात्-गुह्य-गोप्त्री
    त्वं गृहाणास्मत्कृतं जपम् । सिद्धिर्भवतु मे देवि त्वत्प्रसादान्मयि स्थिरा ॥ २३॥ फलश्रुतिः नारायण उवाच
    ॥ एवं नामवरैर्देवी स्तुता शक्रेण धीमता । आयुरारोग्यमैश्वर्यमपमृत्यु-भयापहम् ॥ १॥ वरं प्रादान्महेन्द्राय
    देवराज्यं च शाश्वतम् । इन्द्रस्तोत्रमिदं पुण्यं महदैश्वर्य-कारणम् ॥ २ ॥ क्षयापस्मार-कुष्ठादि-तापज्वर-निवारणम्
    । चोर-व्याघ्र-भयारिष्ठ-वैष्णव-ज्वर-वारणम् ॥ ३॥ माहेश्वरमहामारी-सर्वज्वर-निवारणम् । शीत-पैत्तक-वातादि-सर्वरोग-निवारणम्
    ॥ ४॥ शतमावर्तयेद्यस्तु मुच्यते व्याधिबन्धनात् । आवर्तन-सहस्रात्तु लभते वाञ्छितं फलम् ॥ ५॥ राजानं च
    समाप्नोति इन्द्राक्षीं नात्र संशय । नाभिमात्रे जले स्थित्वा सहस्रपरिसंख्यया ॥ ६॥ जपेत् स्तोत्रमिदं
    मन्त्रं वाचासिद्धिर्भवेद्ध्रुवम् । सायं प्रातः पठेन्नित्यं षण्मासैः सिद्धिरुच्यते ॥ ७॥ संवत्सरमुपाश्रित्य
    सर्वकामार्थसिद्धये । अनेन विधिना भक्त्या मन्त्रसिद्धिः प्रजायते ॥ ८॥ सन्तुष्टा च भवेद्देवी प्रत्यक्षा
    सम्प्रजायते । अष्टम्यां च चतुर्दश्यामिदं स्तोत्रं पठेन्नरः ॥ ९॥ धावतस्तस्य नश्यन्ति विघ्नसंख्या न
    संशयः । कारागृहे यदा बद्धो मध्यरात्रे तदा जपेत् ॥ १०॥ दिवसत्रयमात्रेण मुच्यते नात्र संशयः । सकामो
    जपते स्तोत्रं मन्त्रपूजाविचारतः ॥ ११॥ पञ्चाधिकैर्दशादित्यैरियं सिद्धिस्तु जायते । रक्तपुष्पै रक्तवस्त्रै
    रक्तचन्दनचर्चितैः ॥ १२॥ धूपदीपैश्च नैवेद्यैः प्रसन्ना भगवती भवेत् । एवं सम्पूज्य इन्द्राक्षीमिन्द्रेण
    परमात्मना ॥ १३॥ वरं लब्धं दितेः पुत्रा भगवत्याः प्रसादतः । एतत् स्तोत्रं महापुण्यं जप्यमायुष्यवर्धनम्
    ॥ १४॥ ज्वरातिसार-रोगाणामपमृत्योर्हराय च । द्विजैर्नित्यमिदं जप्यं भाग्यारोग्यमभीप्सुभिः ॥ १५॥ ॥ इति
    इन्द्राक्षी-स्तोत्रं सम्पूर्णम् ॥
