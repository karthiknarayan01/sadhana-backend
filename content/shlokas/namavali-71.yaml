id: namavali-71
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: shrisubrahmanyashodashanamavalih om senanye namah | agnibhuve | skandaya | tarakaraye | gunapriyaya
    | shanmaturaya | bahuleyaya | krittikapriyaputrakaya | mayuravahanaya | shrimate | kumaraya | krauncadaranaya
    | vishakhaya | parvatiputraya | subrahmanyaya | guhaya namah |
  devanagari: श्रीसुब्रह्मण्यषोडशनामावलिः ॐ सेनान्ये नमः । अग्निभुवे । स्कन्दाय । तारकारये । गुणप्रियाय
    । षण्मातुराय । बाहुलेयाय । कृत्तिकाप्रियपुत्रकाय । मयूरवाहनाय । श्रीमते । कुमाराय । क्रौञ्चदारणाय
    । विशाखाय । पार्वतीपुत्राय । सुब्रह्मण्याय । गुहाय नमः ।
meaning: {}
