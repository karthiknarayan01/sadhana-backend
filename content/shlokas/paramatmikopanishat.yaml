id: paramatmikopanishat
category: upanishad
name:
  english: paramatmikopanishat
  devanagari: पारमात्मिकोपनिषत्
content:
  english: rinu dharmam shucismite | yugantare mahadevi kanvanama mahamunih || sehe tivram tapashcarya
    kartumevobhayoh priyam | mahavishnoshca ya ma'sti tam mayam prakritim viduh || lokayatra vina tam
    tu naiti shrih sa smrita budhaih | tasyah shriyah striyo'bhinnah purshashca purushottamat || tasmattaya
    shriya sardham pujayetpurushottamam | samsaracakrayatnabhyam nijam te syatsudarshanam || hamsakhyam
    cetanarupam sarvapranihridi sthitam | tacchankharupo devashca pancajanyakhya ucyate || pancabhutatmako
    hyasya sarvavedamayo'ksharah | chandomayabhyam pakshabhyam yuktah pakshiganeshvarah || garudo vahanam
    capi vishnordevasya kirtitah | prithivivayusamyogashcapah sharngam hareh smritah || tejo vayumayo
    hyasya namna samsharanaccharah | vidyavidyasharairyukte akshaye te maheshudhi || lokalokacalah prokto
    vidyotakhyam tu khetakam | kritanto nandakah khadgam sarvapranihridi sthitam || ya dandanitih sa khyata
    gada kaumodaki hareh | sarvartheshu jayo hyasya sa tvajagarata sthita || sarvabandhushu yadbaddham
    premapasham parasparam | dridham bhratrisamakhyam tattvashusarvarthasammatam || sarvapranishu ya shaktih
    shaktirvidyunnibha mata | maryada yadadholoke bheri sa tu maharava || samsarabhittiryo deho lilakhyah
    sa harerdvijah | yanmanah shighragam tasya sa rathah kamago matah || yo vayurvati so'shvastu pundarikapadahvayah
    | ityevam brahmana coktam tasmaddevi shriya saha || atmanamasya jagato nirlepamaguno'malam | bibharti
    kaustubhamanisvarupam bhagavan harih || shrivatsasamsthanadharamanantena samashritam | pradhanam buddhirapyaste
    gadarupena madhave || bhutadimindriyadimshca dvidha vai paramishvarah | bibharti shankharupena sharngarupena
    ca sthitam || calasvarupamatyantam japenantaritanilam | cakrasvarupam ca mano dhatte vishnuhkare sthitam
    || pancaratne tu ya mata vaijayanti gadabhritah | sa bhutahetusanghatabhuta mata ca vai dvija || yanindriyanyasheshena
    buddhikarmatmakani vai | sharani yanyasheshena tani dhatte janardanah || bibharti yaccasiratnamacyuto'tyantanirmalam
    | vidyamayam nu tajjnanamavidyacarmasamsthitam || bhutani ca hrishikesho dhatte sarvendriyani ca |
    vidyavidye ca maitreya sarvametatsamashritam || astrabhushanasamsthanasvarupam rupavarjitam | bibharti
    mayarupo'sau shreyase bhagavan harih || savikaram pradhanam ca puman svacakhilam jagat | bibharti
    pundarikakshastadevam parameshvarah || iti || evam svatah siddhanamakritakanam shankhadinamanyena
    dhartumashakyatvat yogena pancajanyatvadishabdavacyatvabhavat rudhya pancajanyatvadikamupapannam brahmana
    kalpitam sharngamiti nama | evamanyeshamaprakritanam pancajanyadikam paramatmana eva | avataradishvanyat
    aprakritam vacakavrittiprabhritirva | kalpitani shankhadini || 2|| yasyoparishtadadhitishthadatma
    sarvoparishtat paramatma muktam tam virajam nityamanu samparaya svaha || 10
  devanagari: ृणु धर्मं शुचिस्मिते । युगान्तरे महादेवि कण्वनामा महामुनिः ॥ सेहे तीव्रां तपश्चर्या कर्तुमेवोभयोः
    प्रियम् । महाविष्णोश्च या माऽस्ति तां मायां प्रकृतिं विदुः ॥ लोकयात्रा विना तां तु नैति श्रीः सा स्मृता
    बुधैः । तस्याः श्रियाः स्त्रियोऽभिन्नाः पूर्षाश्च पुरुषोत्तमात् ॥ तस्मात्तया श्रिया सार्धं पूजयेत्पुरुषोत्तमम्
    । संसारचक्रयत्नाभ्यां निजं ते स्यात्सुदर्शनम् ॥ हंसाख्यं चेतनारूपं सर्वप्राणिहृदि स्थितम् । तच्छङ्खरूपो
    देवश्च पाञ्चजन्याख्य उच्यते ॥ पञ्चभूतात्मको ह्यस्य सर्ववेदमयोऽक्षरः । छन्दोमयाभ्यां पक्षाभ्यां युक्तः
    पक्षिगणेश्वरः ॥ गरुडो वाहनं चापि विष्णोर्देवस्य कीर्तितः । पृथिवीवायुसंयोगश्चापः शार्ङ्गं हरेः स्मृतः
    ॥ तेजो वायुमयो ह्यस्य नाम्ना संशरणाच्छरः । विद्याविद्याशरैर्युक्ते अक्षये ते महेषुधी ॥ लोकालोकाचलः
    प्रोक्तो विद्योताख्यं तु खेटकम् । कृतान्तो नन्दकः खड्गं सर्वप्राणिहृदि स्थितम् ॥ या दण्डनीतिः सा ख्याता
    गदा कौमोदकी हरेः । सर्वार्थेषु जयो ह्यस्य स त्वजागरता स्थिता ॥ सर्वबन्धुषु यद्बद्धं प्रेमपाशं परस्परम्
    । दृढं भ्रातृसमाख्यं तत्त्वाशुसर्वार्थसम्मतम् ॥ सर्वप्राणिषु या शक्तिः शक्तिर्विद्युन्निभा मता । मर्यादा
    यदधोलोके भेरी सा तु महारवा ॥ संसारभित्तिर्यो देहो लीलाख्यः स हरेर्द्विजाः । यन्मनः शीघ्रगं तस्य स
    रथः कामगो मतः ॥ यो वायुर्वाति सोऽश्वस्तु पुण्डरीकपदाह्वयः । इत्येवं ब्रह्मणा चोक्तं तस्माद्देवि श्रिया
    सह ॥ आत्मानमस्य जगतो निर्लेपमगुणोऽमलम् । बिभर्ति कौस्तुभमणिस्वरूपं भगवान् हरिः ॥ श्रीवत्ससंस्थानधरमनन्तेन
    समाश्रितम् । प्रधानं बुद्धिरप्यास्ते गदारूपेण माधवे ॥ भूतादिमिन्द्रियादींश्च द्विधा वै परमीश्वरः ।
    बिभर्ति शङ्खरूपेण शार्ङ्गरूपेण च स्थितम् ॥ चलस्वरूपमत्यन्तं जपेनान्तरितानिलम् । चक्रस्वरूपं च मनो
    धत्ते विष्णुःकरे स्थितम् ॥ पञ्चरत्ने तु या माता वैजयन्ती गदाभृतः । सा भूतहेतुसङ्घातभूता माता च वै
    द्विज ॥ यानीन्द्रियाण्यशेषेण बुद्धिकर्मात्मकानि वै । शराणि यान्यशेषेण तानि धत्ते जनार्दनः ॥ बिभर्ति
    यच्चासिरत्नमच्युतोऽत्यन्तनिर्मलम् । विद्यामयं नु तज्ज्ञानमविद्याचर्मसंस्थितम् ॥ भूतानि च हृषीकेशो
    धत्ते सर्वेन्द्रियाणि च । विद्याविद्ये च मैत्रेय सर्वमेतत्समाश्रितम् ॥ अस्त्रभूषणसंस्थानस्वरूपं रूपवर्जितम्
    । बिभर्ति मायारूपोऽसौ श्रेयसे भगवान् हरिः ॥ सविकारं प्रधानं च पुमान् स्वचाखिलं जगत् । बिभर्ति पुण्डरीकाक्षस्तदेवं
    परमेश्वरः ॥ इति ॥ एवं स्वतः सिद्धानामकृतकानां शङ्खादीनामन्येन धर्तुमशक्यत्वात् योगेन पाञ्चजन्यत्वादिशब्दवाच्यत्वाभावात्
    रूढ्या पाञ्चजन्यत्वादिकमुपपन्नं ब्रह्मणा कल्पितं शार्ङ्गमिति नाम । एवमन्येषामप्राकृतानां पाञ्चजन्यादिकं
    परमात्मन एव । अवतारादिष्वन्यत् अप्राकृतं वाचकवृत्तिप्रभृतिर्वा । कल्पितानि शङ्खादीनि ॥ २॥ यस्योपरिष्टादधितिष्ठदात्मा
    सर्वोपरिष्टात् परमात्मा मुक्तं तं विरजं नित्यमनु सम्पराय स्वाहा ॥ १०
