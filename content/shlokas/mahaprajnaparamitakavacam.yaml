id: mahaprajnaparamitakavacam
category: kavacha
name:
  english: mahaprajnaparamitakavacam
  devanagari: महाप्रज्नापारमिताकवचम्
content:
  english: tenaiva margena mam rakshantu || mahaprajnaparamita puratah patu | mahakaruna dakshinatah patu
    | aryavalokiteshvarah pashcimatah patu | manjushrirbodhisattva uttare patu || urdhvam sarvabuddhah
    pantu | adhastat sarvabodhisattvah pantu | antarbodhih patu | bahih shunyata patu | sarvatah prajnaparamita
    mam paripalayatu || tadyatha
  devanagari: तेनैव मार्गेण मां रक्षन्तु ॥ महाप्रज्ञापारमिता पुरतः पातु । महाकरुणा दक्षिणतः पातु । आर्यावलोकितेश्वरः
    पश्चिमतः पातु । मञ्जुश्रीर्बोधिसत्त्व उत्तरे पातु ॥ ऊर्ध्वं सर्वबुद्धाः पान्तु । अधस्तात् सर्वबोधिसत्त्वाः
    पान्तु । अन्तर्बोधिः पातु । बहिः शून्यता पातु । सर्वतः प्रज्ञापारमिता मां परिपालयतु ॥ तद्यथा
meaning: {}
