id: krishnakritamsuryashtottarashatanamastotram
category: stotram
name:
  english: krishnakritamsuryashtottarashatanamastotram
  devanagari: कृष्णकृतंसूर्याष्टोत्तरशतनामस्तोत्रम्
content:
  english: shrikrishnakritam suryashtottarashatastotramstotram shrikrishna uvaca | adityam bhaskaram bhanum
    ravim suryam divakaram | divakaram divanatham tapanam tapatam varam || 2|| varenyam varadam vishnumanagham
    vasavanujam | balaviryam sahasramshum sahasrakiranadyutim || 3|| mayukhamalinam vishvam martandam
    candarocisham | sadatitam subhasvantam saptasaptim sukhodayam || 4|| devadevamahirbudhnyam dhamnam
    nidhimanuttamam | tapobrahmamayalokam lokapalamapampatim || 5|| jagatprabodhajanakam jagadbijam jagatprabhum
    | arkam nihshreyasaparam karanam shreyasam param || 6|| inam prabhavinam punyam patangam plavageshvaram
    | dataram vanchitarthanam drishtadrishtaphalapradam || 7|| griham grihakaram hamsam haridashvam hutashanam
    | mangalyam mangalam geyam dhruvam dharmaprabodhanam || 8|| bhavasambhavitabhavam bhutabhavyabhavatmakam
    | durgamam durgatiharam haranetram trayimayam || 9|| trailokyatilakam tirtham taranim sarvatomukham
    | tejorashisunirvanam vishvesham dhama sampratam || 1
  devanagari: श्रीकृष्णकृतं सूर्याष्टोत्तरशतस्तोत्रम्स्तोत्रम् श्रीकृष्ण उवाच । आदित्यं भास्करं भानुं
    रविं सूर्यं दिवाकरम् । दिवाकरं दिवानाथं तपनं तपतां वरम् ॥ २॥ वरेण्यं वरदं विष्णुमनघं वासवानुजम् ।
    बलवीर्यं सहस्रांशुं सहस्रकिरणद्युतिम् ॥ ३॥ मयूखमालिनं विश्वं मार्तण्डं चण्डरोचिषम् । सदातीतं सुभास्वन्तं
    सप्तसप्तिं सुखोदयम् ॥ ४॥ देवदेवमहिर्बुध्न्यं धाम्नां निधिमनुत्तमम् । तपोब्रह्ममयालोकं लोकपालमपाम्पतिम्
    ॥ ५॥ जगत्प्रबोधजनकं जगद्बीजं जगत्प्रभुम् । अर्कं निःश्रेयसपरं कारणं श्रेयसां परम् ॥ ६॥ इनं प्रभाविणं
    पुण्यं पतङ्गं प्लवगेश्वरम् । दातारं वाञ्छितार्थानां दृष्टादृष्टफलप्रदम् ॥ ७॥ गृहं गृहकरं हंसं हरिदश्वं
    हुताशनम् । मङ्गल्यं मङ्गलं गेयं ध्रुवं धर्मप्रबोधनम् ॥ ८॥ भवसम्भावितभावं भूतभव्यभवात्मकम् । दुर्गमं
    दुर्गतिहरं हरनेत्रं त्रयीमयम् ॥ ९॥ त्रैलोक्यतिलकं तीर्थं तरणिं सर्वतोमुखम् । तेजोराशिसुनिर्वाणं विश्वेशं
    धाम साम्प्रतम् ॥ १
meaning: {}
