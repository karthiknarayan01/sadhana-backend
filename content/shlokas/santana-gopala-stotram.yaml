id: santana-gopala-stotram
category: stotram
name:
  english: Santana Gopala Stotram
  devanagari: सन्तानगोपालस्तोत्रम् (महाभारते खिलभागे हरिवंशे)
content:
  english: shriganeshaya namah | asya shrisantanagopalamantrasya shrinarada rishih, anushtup chandah,
    shrikrishno devata, glaum bijam, namah shaktih, putrarthe jape viniyogah | anganyasah | devakisuta
    govinda hridayaya namah | vasudeva jagatpate shirase svaha | dehi me tanayam krishna shikhayai vashat
    | tvamaham sharanam gatah - om namah astraya phat | dhyanam - vaikunthadagatam krishnam rathastham
    karunanidhim | kiritisarathim putramanayantam paratparam || 1|| adaya tam jalastham ca gurave vaidikaya
    ca | arpayantam mahabhagam dhyayet putrarthamacyutam || 2|| mula mantram - om shrim hrim klim glaum
    devakisuta govinda vasudeva jagatpate | dehi me tanayam krishna tvamaham sharanam gatah || ( 2) santanagopalamantrah
    viniyogah - asya shrisantanagopalamantrasya brahma rishirgayatricchandah, shrikrishno devata, klim
    bijam, namah shaktih putrarthe jape viniyogah | anganyasah glaum hridayaya namah | klim shirase svaha
    | hrim shikhayai vashat | shrim kavacaya hum | om astraya phat - iti digbandhah dhyanam -- shankhacakragadapadmam
    dadhanam sutikagrihe | anke shayanam devakyah krishnam vande vimuktaye || mulamantram -- om namo bhagavate
    jagadatmasutaye namah | viniyogah -- om asya shrisantanagopalamantrasya shrinarada rishih, anushtup
    chandah, shrikrishno devata, glaum bijam, namah shaktih|, putrarthe jape viniyogah | anganyasah devakisuta
    govinda hridayaya namah | vasudeva jagatpate shirase svaha | dehi me tanayam krishna shikhayai vashat
    | tvamaham sharanam gatah kavacaya hum | devakisuta govinda vasudeva jagatpate | dehi me tanayam krishna
    tvamaham sharanam gatah || astraya phat | dhyanam -- shankhacakragadapadmam dharayantam janardanam
    | anke shayanam devakyah sutikamandire shubhe || evam rupam sada krishnam sutartham bhavayet sudhih
    || santanagopala mula mantram -- om shrim hrim klim glaum devakisuta govinda vasudeva jagatpate |
    om devakisuta govinda vasudeva jagatpate | dehi me tanayam krishna tvamaham sharanam gatah || om namo
    bhagavate vasudevaya | atha santanagopalastotram | shrisham kamalapatraksham devakinandanam harim
    | sutasampraptaye krishnam namami madhusudanam || 1|| namamyaham vasudevam sutasampraptaye harim |
    yashodankagatam balam gopalam nandanandanam || 2|| asmakam putralabhaya govindam munivanditam | namamyaham
    vasudevam devakinandanam sada || 3| || gopalam dimbhakam vande kamalapatimacyutam | putrasampraptaye
    krishnam namami yadupungavam || 4|| putrakameshtiphaladam kanjaksham kamalapatim | devakinandanam
    vande sutasampraptaye mama || 5|| padmapate padmanetra padmanabha janardana | dehi me tanayam shrisha
    vasudeva jagatpate || 6|| yashodankagatam balam govindam munivanditam | asmakam putralabhaya namami
    shrishamacyutam || 7|| shripate devadevesha dinartiharanacyuta | govinda me sutam dehi namami tvam
    janardana || 8|| bhaktakamada govinda bhaktam raksha shubhapradam | dehi me tanayam krishna rukminivallabha
    prabho || 9|| rukmininatha sarvesha dehi me tanayam sada | bhaktamandara padmaksha tvamaham sharanam
    gatah || 10|| devakisuta govinda vasudeva jagatpate | dehi me tanayam krishna tvamaham sharanam gatah
    || 11|| vasudeva jagadvandya shripate purushottama | dehi me tanayam krishna tvamaham sharanam gatah
    || 12|| kanjaksha kamalanatha parakarunikottama | dehi me tanayam krishna tvamaham sharanam gatah
    || 13|| lakshmipate padmanabha mukunda munivandita | dehi me tanayam krishna tvamaham sharanam gatah
    || 14|| karyakaranarupaya vasudevaya te sada | namami putralabhartham sukhadaya budhaya te || 15||
    rajivanetra shrirama ravanare hare kave | tubhyam namami devesha tanayam dehi me hare || 16|| asmakam
    putralabhaya bhajami tvam jagatpate | dehi me tanayam krishna vasudeva ramapate || 17|| shrimaninimanacora
    gopivastrapaharaka | dehi me tanayam krishna vasudeva jagatpate || 18| asmakam putrasampraptim kurushva
    yadunandana | ramapate vasudeva mukunda munivandita || 19|| vasudeva sutam dehi tanayam dehi madhava
    | putram me dehi shrikrishna vatsam dehi mahaprabho || 20|| dimbhakam dehi shrikrishna atmajam dehi
    raghava | bhaktamandara me dehi tanayam nandanandana || 21|| nandanam dehi me krishna vasudeva jagatpate
    | kamalanatha govinda mukunda munivandita || 22|| anyatha sharanam nasti tvameva sharanam mama | sutam
    dehi shriyam dehi shriyam putram pradehi me || 23|| yashodastanyapanajnam pibantam yadunandanam |
    vande'ham putralabhartham kapilaksham harim sada || 24|| nandanandana devesha nandanam dehi me prabho
    | ramapate vasudeva shriyam putram jagatpate || 25|| putram shriyam shriyam putram putram me dehi
    madhava | asmakam dinavakyasya avadharaya shripate || 26|| gopaladimbha govinda vasudeva ramapate
    | asmakam dimbhakam dehi shriyam dehi jagatpate || 27|| madvanchitaphalam dehi devakinandanacyuta
    | mama putrarthitam dhanyam kurushva yadunandana || 28|| yace'ham tvam shriyam putram dehi me putrasampadam
    | bhaktacintamane rama kalpavriksha mahaprabho || 29|| atmajam nandanam putram kumaram dimbhakam sutam
    | arbhakam tanayam dehi sada me raghunandana || 30|| vande santanagopalam madhavam bhaktakamadam |
    asmakam putrasampraptyai sada govindamacyutam || 31|| Onkarayuktam gopalam shriyuktam yadunandanam
    | klimyuktam devakiputram namami yadunayakam || 32|| vasudeva mukundesha govinda madhavacyuta | dehi
    me tanayam krishna ramanatha mahaprabho || 33|| rajivanetra govinda kapilaksha hare prabho | samastakamyavarada
    dehi me tanayam sada || 34|| abjapadmanibham padmavrindarupa jagatpate | dehi me varasatputram ramanayaka
    madhava || 35|| nandapala dharapala govinda yadunandana | dehi me tanayam krishna rukminivallabha
    prabho || 36|| dasamandara govinda mukunda madhavacyuta | gopala pundarikaksha dehi me tanayam shriyam
    || 37|| yadunayaka padmesha nandagopavadhusuta | dehi me tanayam krishna shridharah prananayaka ||
    38|| asmakam vanchitam dehi dehi putram ramapate | bhagavan krishna sarvesha vasudeva jagatpate ||
    39|| ramahridayasambhara satyabhamamanahpriya | dehi me tanayam krishna rukminivallabha prabho ||
    40|| candrasuryaksha govinda pundarikaksha madhava | asmakam bhagyasatputram dehi deva jagatpate ||
    41|| karunyarupa padmaksha padmanabhasamarcita | dehi me tanayam krishna devakinandanandana || 42||
    devakisuta shrinatha vasudeva jagatpate | samastakamaphalada dehi me tanayam sada || 43|| bhaktamandara
    gambhira shankaracyuta madhava | dehi me tanayam gopabalavatsala shripate || 44|| shripate vasudevesha
    devakipriyanandana | bhaktamandara me dehi tanayam jagatam prabho || 45|| jagannatha ramanatha bhuminatha
    dayanidhe | vasudevesha sarvesha dehi me tanayam prabho || 46|| shrinatha kamalapatraksha vasudeva
    jagatpate | dehi me tanayam krishna tvamaham sharanam gatah || 47|| dasamandara govinda bhaktacintamane
    prabho | dehi me tanayam krishna tvamaham sharanam gatah || 48|| govinda pundarikaksha ramanatha mahaprabho
    | dehi me tanayam krishna tvamaham sharanam gatah || 49|| shrinatha kamalapatraksha govinda madhusudana
    | matputraphalasid|hdhyartham bhajami tvam janardana || 50|| stanyam pibantam jananimukhambujam vilokya
    mandasmitamujjvalangam | sprishantamanyastanamangulibhirvande yashodankagatam mukundam || 51|| yace'ham
    putrasantanam bhavantam padmalocana | dehi me tanayam krishna tvamaham sharanam gatah || 52|| asmakam
    putrasampatteshcintayami jagatpate | shighram me dehi datavyam bhavata munivandita || 53|| vasudeva
    jagannatha shripate purushottama | kuru mam putradattam ca krishna devendrapujita || 54|| kuru mam
    putradattam ca yashodapriyanandana | mahyam ca putrasantanam datavyam bhavata hare || 55|| vasudeva
    jagannatha govinda devakisuta | dehi me tanayam rama kausalyapriyanandana || 56|| padmapatraksha govinda
    vishno vamana madhava | dehi me tanayam sitaprananayaka raghava || 57|| kanjaksha krishna devendramandita
    munivandita | lakshmanagraja shrirama dehi me tanayam sada || 58|| dehi me tanayam rama dasharathapriyanandana
    | sitanayaka kanjaksha mucukundavaraprada || 59|| vibhishanasya ya lanka pradatta bhavata pura | asmakam
    tatprakarena tanayam dehi madhava || 60|| bhavadiyapadambhoje cintayami nirantaram | dehi me tanayam
    sitapranavallabha raghava || 61|| rama matkamyavarada putrotpattiphalaprada | dehi me tanayam shrisha
    kamalasanavandita || 62|| rama raghava sitesha lakshmananuja dehi me | bhagyavatputrasantanam dasharathatmaja
    shripate || 63|| devakigarbhasanjata yashodapriyanandana | dehi me tanayam rama krishna gopala madhava
    || 64|| krishna madhava govinda vamanacyuta shankara | dehi me tanayam shrisha gopabalakanayaka ||
    65|| gopabala mahadhanya govindacyuta madhava | dehi me tanayam krishna vasudeva jagatpate || 66||
    dishatu dishatu putram devakinandano'yam dishatu dishatu shighram bhagyavatputralabham | dishatu dishatu
    shrisho raghavo ramacandro dishatu dishatu putram vamshavistarahetoh || 67|| diyatam vasudevena tanayo
    matpriyah sutah | kumaro nandanah sitanayakena sada mama || 68|| rama raghava govinda devakisuta madhava
    | dehi me tanayam shrisha gopabalakanayaka || 69|| raghava! govinda! devakiputra! madhava! shripate!
    (gopabalakanayaka shrikrishna! mujhe putra dijiye) || 69|| vamshavistarakam putram dehi me madhusudana
    | sutam dehi sutam dehi tvamaham sharanam gatah || 70|| mnardanakhya viprasya bhagavaddarshanavishayaka
    utkantha | amabhishtasutam dehi kamsare madhavacyuta | sutam dehi sutam dehi tvamaham sharanam gatah
    || 71|| candrarkakalpaparyantam tanayam dehi madhava | sutam dehi sutam dehi tvamaham sharanam gatah
    || 72|| vidyavantam buddhimantam shrimantam tanayam sada | dehi me tanayam krishna devakinandana prabho
    || 73|| namami tvam padmanetra sutalabhaya kamadam | mukundam pundarikaksham govindam madhusudanam
    || 74|| bhagavan krishna govinda sarvakamaphalaprada | dehi me tanayam svamimstvamaham sharanam gatah
    || 75|| svamimstvam bhagavan rama krishna madhava kamada | dehi me tanayam nityam tvamaham sharanam
    gatah || 76|| tanayam dehi govinda kanjaksha kamalapate | sutam dehi sutam dehi tvamaham sharanam
    gatah || 77|| padmapate padmanetra pradyumnajanaka prabho | sutam dehi sutam dehi tvamaham sharanam
    gatah || 78|| shankhacakragadakhadgasharngapane ramapate | dehi me tanayam krishna tvamaham sharanam
    gatah || 79|| narayana ramanatha rajivapatralocana | sutam me dehi devesha padmapadmanuvandita ||
    80|| rama raghava govinda devakivaranandana | rukmininatha sarvesha naradadisurarcita || 81|| devakisuta
    govinda vasudeva jagatpate | dehi me tanayam shrisha gopabalakanayaka || 82|| munivandita govinda
    rukminivallabha prabho | dehi me tanayam krishna tvamaham sharanam gatah || 83|| gopikarjitapankejamakarandasaktamanasa
    | dehi me tanayam krishna tvamaham sharanam gatah || 84|| ramahridayapankejalola madhava kamada |
    mamabhishtasutam dehi tvamaham sharanam gatah || 85|| vasudeva ramanatha dasanam mangalaprada | dehi
    me tanayam krishna tvamaham sharanam gatah || 86|| kalyanaprada govinda murare munivandita | dehi
    me tanayam krishna tvamaham sharanam gatah || 87|| putraprada mukundesha rukminivallabha prabho |
    dehi me tanayam krishna tvamaham sharanam gatah || 88|| pundarikaksha govinda vasudeva jagatpate |
    dehi me tanayam krishna tvamaham sharanam gatah || 89|| dayanidhe vasudeva mukunda munivandita | dehi
    me tanayam krishna tvamaham sharanam gatah || 90|| putrasampatpradataram govindam devapujitam | vandamahe
    sada krishnam putralabhapradayinam || 91|| karunyanidhaye gopivallabhaya muraraye | namaste putralabhartham
    dehi me tanayam vibho || 92|| namastasmai rameshaya rukminivallabhaya te | dehi me tanayam shrisha
    gopabalakanayaka || 93|| namaste vasudevaya nityashrikamukaya ca | putradaya ca sarpendrashayine rangashayine
    || 94|| rangashayin ramanatha mangalaprada madhava | dehi me tanayam shrisha gopabalakanayaka || 95||
    dasasya me sutam dehi dinamandara raghava | sutam dehi sutam dehi putram dehi ramapate || 96|| yashodatanayabhishtaputradanaratah
    sada | dehi me tanayam krishna tvamaham sharanam gatah || 97|| madishtadeva govinda vasudeva janardana
    | dehi me tanayam krishna tvamaham sharanam gatah || 98 nitiman dhanavan putro vidyavamshca prajayate
    | bhagavamstvatkripayashca vasudevendrapujita || 99|| yah pathet putrashatakam so'pi satputravan bhavet
    | shrivasudevakathitam stotraratnam sukhaya ca || 100|| japakale pathennityam putralabham dhanam shriyam
    | aishvaryam rajasammanam sadyo yati na samshayah || 101|| iti shrimahabharate khilabhage harivamshe
    shrilakshmikeshavasamvade shrisantanagopalastotram sampurnam | after the harivamsha mahatmyam)
  devanagari: श्रीगणेशाय नमः । अस्य श्रीसन्तानगोपालमन्त्रस्य श्रीनारद ऋषिः, अनुष्टुप् छन्दः, श्रीकृष्णो
    देवता, ग्लौं बीजम्, नमः शक्तिः, पुत्रार्थे जपे विनियोगः । अङ्गन्यासः । देवकीसुत गोविन्द हृदयाय नमः
    । वासुदेव जगत्पते शिरसे स्वाहा । देहि मे तनयं कृष्ण शिखायै वषट् । त्वामहं शरणं गतः - ॐ नमः अस्त्राय
    फट् । ध्यानं - वैकुण्ठादागतं कृष्णं रथस्थं करुणानिधिम् । किरीटिसारथिं पुत्रमानयन्तं परात्परम् ॥ १॥
    आदाय तं जलस्थं च गुरवे वैदिकाय च । अर्पयन्तं महाभागं ध्यायेत् पुत्रार्थमच्युतम् ॥ २॥ मूल मन्त्रं -
    ॐ श्रीं ह्रीं क्लीं ग्लौं देवकीसुत गोविन्द वासुदेव जगत्पते । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥
    ( २) सन्तानगोपालमन्त्रः विनियोगः - अस्य श्रीसन्तानगोपालमन्त्रस्य ब्रह्मा ऋषिर्गायत्रीच्छन्दः, श्रीकृष्णो
    देवता, क्लीं बीजम्, नमः शक्तिः पुत्रार्थे जपे विनियोगः । अङ्गन्यासः ग्लौं हृदयाय नमः । क्लीं शिरसे
    स्वाहा । ह्रीं शिखायै वषट् । श्रीं कवचाय हुम् । ॐ अस्त्राय फट् - इति दिग्बन्धः ध्यानं -- शङ्खचक्रगदापद्मं
    दधानं सूतिकागृहे । अङ्के शयानं देवक्याः कृष्णं वन्दे विमुक्तये ॥ मूलमन्त्रं -- ॐ नमो भगवते जगदात्मसूतये
    नमः । विनियोगः -- ॐ अस्य श्रीसन्तानगोपालमन्त्रस्य श्रीनारद ऋषिः, अनुष्टुप् छन्दः, श्रीकृष्णो देवता,
    ग्लौं बीजम्, नमः शक्तिः।, पुत्रार्थे जपे विनियोगः । अङ्गन्यासः देवकीसुत गोविन्द हृदयाय नमः । वासुदेव
    जगत्पते शिरसे स्वाहा । देहि मे तनयं कृष्ण शिखायै वषट् । त्वामहं शरणं गतः कवचाय हुम् । देवकीसुत गोविन्द
    वासुदेव जगत्पते । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ अस्त्राय फट् । ध्यानं -- शङ्खचक्रगदापद्मं
    धारयन्तं जनार्दनम् । अङ्के शयानं देवक्याः सूतिकामन्दिरे शुभे ॥ एवं रूपं सदा कृष्णं सुतार्थं भावयेत्
    सुधीः ॥ सन्तानगोपाल मूल मन्त्रं -- ॐ श्रीं ह्रीं क्लीं ग्लौं देवकीसुत गोविन्द वासुदेव जगत्पते । ॐ
    देवकीसुत गोविन्द वासुदेव जगत्पते । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ॐ नमो भगवते वासुदेवाय । अथ
    सन्तानगोपालस्तोत्रम् । श्रीशं कमलपत्राक्षं देवकीनन्दनं हरिम् । सुतसम्प्राप्तये कृष्णं नमामि मधुसूदनम्
    ॥ १॥ नमाम्यहं वासुदेवं सुतसम्प्राप्तये हरिम् । यशोदाङ्कगतं बालं गोपालं नन्दनन्दनम् ॥ २॥ अस्माकं पुत्रलाभाय
    गोविन्दं मुनिवन्दितम् । नमाम्यहं वासुदेवं देवकीनन्दनं सदा ॥ ३। ॥ गोपालं डिम्भकं वन्दे कमलापतिमच्युतम्
    । पुत्रसम्प्राप्तये कृष्णं नमामि यदुपुङ्गवम् ॥ ४॥ पुत्रकामेष्टिफलदं कञ्जाक्षं कमलापतिम् । देवकीनन्दनं
    वन्दे सुतसम्प्राप्तये मम ॥ ५॥ पद्मापते पद्मनेत्र पद्मनाभ जनार्दन । देहि मे तनयं श्रीश वासुदेव जगत्पते
    ॥ ६॥ यशोदाङ्कगतं बालं गोविन्दं मुनिवन्दितम् । अस्माकं पुत्रलाभाय नमामि श्रीशमच्युतम् ॥ ७॥ श्रीपते
    देवदेवेश दीनार्तिहरणाच्युत । गोविन्द मे सुतं देहि नमामि त्वां जनार्दन ॥ ८॥ भक्तकामद गोविन्द भक्तं
    रक्ष शुभप्रदम् । देहि मे तनयं कृष्ण रुक्मिणीवल्लभ प्रभो ॥ ९॥ रुक्मिणीनाथ सर्वेश देहि मे तनयं सदा ।
    भक्तमन्दार पद्माक्ष त्वामहं शरणं गतः ॥ १०॥ देवकीसुत गोविन्द वासुदेव जगत्पते । देहि मे तनयं कृष्ण त्वामहं
    शरणं गतः ॥ ११॥ वासुदेव जगद्वन्द्य श्रीपते पुरुषोत्तम । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ १२॥ कञ्जाक्ष
    कमलानाथ परकारुणिकोत्तम । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ १३॥ लक्ष्मीपते पद्मनाभ मुकुन्द मुनिवन्दित
    । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ १४॥ कार्यकारणरूपाय वासुदेवाय ते सदा । नमामि पुत्रलाभार्थं
    सुखदाय बुधाय ते ॥ १५॥ राजीवनेत्र श्रीराम रावणारे हरे कवे । तुभ्यं नमामि देवेश तनयं देहि मे हरे ॥ १६॥
    अस्माकं पुत्रलाभाय भजामि त्वां जगत्पते । देहि मे तनयं कृष्ण वासुदेव रमापते ॥ १७॥ श्रीमानिनीमानचोर
    गोपीवस्त्रापहारक । देहि मे तनयं कृष्ण वासुदेव जगत्पते ॥ १८। अस्माकं पुत्रसम्प्राप्तिं कुरुष्व यदुनन्दन
    । रमापते वासुदेव मुकुन्द मुनिवन्दित ॥ १९॥ वासुदेव सुतं देहि तनयं देहि माधव । पुत्रं मे देहि श्रीकृष्ण
    वत्सं देहि महाप्रभो ॥ २०॥ डिम्भकं देहि श्रीकृष्ण आत्मजं देहि राघव । भक्तमन्दार मे देहि तनयं नन्दनन्दन
    ॥ २१॥ नन्दनं देहि मे कृष्ण वासुदेव जगत्पते । कमलानाथ गोविन्द मुकुन्द मुनिवन्दित ॥ २२॥ अन्यथा शरणं
    नास्ति त्वमेव शरणं मम । सुतं देहि श्रियं देहि श्रियं पुत्रं प्रदेहि मे ॥ २३॥ यशोदास्तन्यपानज्ञं पिबन्तं
    यदुनन्दनम् । वन्देऽहं पुत्रलाभार्थं कपिलाक्षं हरिं सदा ॥ २४॥ नन्दनन्दन देवेश नन्दनं देहि मे प्रभो
    । रमापते वासुदेव श्रियं पुत्रं जगत्पते ॥ २५॥ पुत्रं श्रियं श्रियं पुत्रं पुत्रं मे देहि माधव । अस्माकं
    दीनवाक्यस्य अवधारय श्रीपते ॥ २६॥ गोपालडिम्भ गोविन्द वासुदेव रमापते । अस्माकं डिम्भकं देहि श्रियं देहि
    जगत्पते ॥ २७॥ मद्वाञ्छितफलं देहि देवकीनन्दनाच्युत । मम पुत्रार्थितं धन्यं कुरुष्व यदुनन्दन ॥ २८॥ याचेऽहं
    त्वां श्रियं पुत्रं देहि मे पुत्रसम्पदम् । भक्तचिन्तामणे राम कल्पवृक्ष महाप्रभो ॥ २९॥ आत्मजं नन्दनं
    पुत्रं कुमारं डिम्भकं सुतम् । अर्भकं तनयं देहि सदा मे रघुनन्दन ॥ ३०॥ वन्दे सन्तानगोपालं माधवं भक्तकामदम्
    । अस्माकं पुत्रसम्प्राप्त्यै सदा गोविन्दमच्युतम् ॥ ३१॥ Oङ्कारयुक्तं गोपालं श्रीयुक्तं यदुनन्दनम् ।
    क्लींयुक्तं देवकीपुत्रं नमामि यदुनायकम् ॥ ३२॥ वासुदेव मुकुन्देश गोविन्द माधवाच्युत । देहि मे तनयं
    कृष्ण रमानाथ महाप्रभो ॥ ३३॥ राजीवनेत्र गोविन्द कपिलाक्ष हरे प्रभो । समस्तकाम्यवरद देहि मे तनयं सदा
    ॥ ३४॥ अब्जपद्मनिभं पद्मवृन्दरूप जगत्पते । देहि मे वरसत्पुत्रं रमानायक माधव ॥ ३५॥ नन्दपाल धरापाल गोविन्द
    यदुनन्दन । देहि मे तनयं कृष्ण रुक्मिणीवल्लभ प्रभो ॥ ३६॥ दासमन्दार गोविन्द मुकुन्द माधवाच्युत । गोपाल
    पुण्डरीकाक्ष देहि मे तनयं श्रियम् ॥ ३७॥ यदुनायक पद्मेश नन्दगोपवधूसुत । देहि मे तनयं कृष्ण श्रीधरः
    प्राणनायक ॥ ३८॥ अस्माकं वाञ्छितं देहि देहि पुत्रं रमापते । भगवन् कृष्ण सर्वेश वासुदेव जगत्पते ॥ ३९॥
    रमाहृदयसम्भार सत्यभामामनःप्रिय । देहि मे तनयं कृष्ण रुक्मिणीवल्लभ प्रभो ॥ ४०॥ चन्द्रसूर्याक्ष गोविन्द
    पुण्डरीकाक्ष माधव । अस्माकं भाग्यसत्पुत्रं देहि देव जगत्पते ॥ ४१॥ कारुण्यरूप पद्माक्ष पद्मनाभसमर्चित
    । देहि मे तनयं कृष्ण देवकीनन्दनन्दन ॥ ४२॥ देवकीसुत श्रीनाथ वासुदेव जगत्पते । समस्तकामफलद देहि मे तनयं
    सदा ॥ ४३॥ भक्तमन्दार गम्भीर शङ्कराच्युत माधव । देहि मे तनयं गोपबालवत्सल श्रीपते ॥ ४४॥ श्रीपते वासुदेवेश
    देवकीप्रियनन्दन । भक्तमन्दार मे देहि तनयं जगतां प्रभो ॥ ४५॥ जगन्नाथ रमानाथ भूमिनाथ दयानिधे । वासुदेवेश
    सर्वेश देहि मे तनयं प्रभो ॥ ४६॥ श्रीनाथ कमलपत्राक्ष वासुदेव जगत्पते । देहि मे तनयं कृष्ण त्वामहं शरणं
    गतः ॥ ४७॥ दासमन्दार गोविन्द भक्तचिन्तामणे प्रभो । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ४८॥ गोविन्द
    पुण्डरीकाक्ष रमानाथ महाप्रभो । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ४९॥ श्रीनाथ कमलपत्राक्ष गोविन्द
    मधुसूदन । मत्पुत्रफलसिद्।ह्ध्यर्थं भजामि त्वां जनार्दन ॥ ५०॥ स्तन्यं पिबन्तं जननीमुखाम्बुजं विलोक्य
    मन्दस्मितमुज्ज्वलाङ्गम् । स्पृशन्तमन्यस्तनमङ्गुलीभिर्वन्दे यशोदाङ्कगतं मुकुन्दम् ॥ ५१॥ याचेऽहं पुत्रसन्तानं
    भवन्तं पद्मलोचन । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ५२॥ अस्माकं पुत्रसम्पत्तेश्चिन्तयामि जगत्पते
    । शीघ्रं मे देहि दातव्यं भवता मुनिवन्दित ॥ ५३॥ वासुदेव जगन्नाथ श्रीपते पुरुषोत्तम । कुरु मां पुत्रदत्तं
    च कृष्ण देवेन्द्रपूजित ॥ ५४॥ कुरु मां पुत्रदत्तं च यशोदाप्रियनन्दन । मह्यं च पुत्रसन्तानं दातव्यं
    भवता हरे ॥ ५५॥ वासुदेव जगन्नाथ गोविन्द देवकीसुत । देहि मे तनयं राम कौसल्याप्रियनन्दन ॥ ५६॥ पद्मपत्राक्ष
    गोविन्द विष्णो वामन माधव । देहि मे तनयं सीताप्राणनायक राघव ॥ ५७॥ कञ्जाक्ष कृष्ण देवेन्द्रमण्डित मुनिवन्दित
    । लक्ष्मणाग्रज श्रीराम देहि मे तनयं सदा ॥ ५८॥ देहि मे तनयं राम दशरथप्रियनन्दन । सीतानायक कञ्जाक्ष
    मुचुकुन्दवरप्रद ॥ ५९॥ विभीषणस्य या लङ्का प्रदत्ता भवता पुरा । अस्माकं तत्प्रकारेण तनयं देहि माधव ॥
    ६०॥ भवदीयपदाम्भोजे चिन्तयामि निरन्तरम् । देहि मे तनयं सीताप्राणवल्लभ राघव ॥ ६१॥ राम मत्काम्यवरद पुत्रोत्पत्तिफलप्रद
    । देहि मे तनयं श्रीश कमलासनवन्दित ॥ ६२॥ राम राघव सीतेश लक्ष्मणानुज देहि मे । भाग्यवत्पुत्रसन्तानं
    दशरथात्मज श्रीपते ॥ ६३॥ देवकीगर्भसञ्जात यशोदाप्रियनन्दन । देहि मे तनयं राम कृष्ण गोपाल माधव ॥ ६४॥
    कृष्ण माधव गोविन्द वामनाच्युत शङ्कर । देहि मे तनयं श्रीश गोपबालकनायक ॥ ६५॥ गोपबाल महाधन्य गोविन्दाच्युत
    माधव । देहि मे तनयं कृष्ण वासुदेव जगत्पते ॥ ६६॥ दिशतु दिशतु पुत्रं देवकीनन्दनोऽयं दिशतु दिशतु शीघ्रं
    भाग्यवत्पुत्रलाभम् । दिशतु दिशतु श्रीशो राघवो रामचन्द्रो दिशतु दिशतु पुत्रं वंशविस्तारहेतोः ॥ ६७॥
    दीयतां वासुदेवेन तनयो मत्प्रियः सुतः । कुमारो नन्दनः सीतानायकेन सदा मम ॥ ६८॥ राम राघव गोविन्द देवकीसुत
    माधव । देहि मे तनयं श्रीश गोपबालकनायक ॥ ६९॥ राघव! गोविन्द! देवकीपुत्र! माधव! श्रीपते! (गोपबालकनायक
    श्रीकृष्ण! मुझे पुत्र दीजिये) ॥ ६९॥ वंशविस्तारकं पुत्रं देहि मे मधुसूदन । सुतं देहि सुतं देहि त्वामहं
    शरणं गतः ॥ ७०॥ म्नार्दनाख्य विप्रस्य भगवद्दर्शनविषयक उत्कण्ठा । अमाभीष्टसुतं देहि कंसारे माधवाच्युत
    । सुतं देहि सुतं देहि त्वामहं शरणं गतः ॥ ७१॥ चन्द्रार्ककल्पपर्यन्तं तनयं देहि माधव । सुतं देहि सुतं
    देहि त्वामहं शरणं गतः ॥ ७२॥ विद्यावन्तं बुद्धिमन्तं श्रीमन्तं तनयं सदा । देहि मे तनयं कृष्ण देवकीनन्दन
    प्रभो ॥ ७३॥ नमामि त्वां पद्मनेत्र सुतलाभाय कामदम् । मुकुन्दं पुण्डरीकाक्षं गोविन्दं मधुसूदनम् ॥ ७४॥
    भगवन् कृष्ण गोविन्द सर्वकामफलप्रद । देहि मे तनयं स्वामिंस्त्वामहं शरणं गतः ॥ ७५॥ स्वामिंस्त्वं भगवन्
    राम कृष्ण माधव कामद । देहि मे तनयं नित्यं त्वामहं शरणं गतः ॥ ७६॥ तनयं देहि गोविन्द कञ्जाक्ष कमलापते
    । सुतं देहि सुतं देहि त्वामहं शरणं गतः ॥ ७७॥ पद्मापते पद्मनेत्र प्रद्युम्नजनक प्रभो । सुतं देहि सुतं
    देहि त्वामहं शरणं गतः ॥ ७८॥ शङ्खचक्रगदाखड्गशार्ङ्गपाणे रमापते । देहि मे तनयं कृष्ण त्वामहं शरणं गतः
    ॥ ७९॥ नारायण रमानाथ राजीवपत्रलोचन । सुतं मे देहि देवेश पद्मपद्मानुवन्दित ॥ ८०॥ राम राघव गोविन्द देवकीवरनन्दन
    । रुक्मिणीनाथ सर्वेश नारदादिसुरार्चित ॥ ८१॥ देवकीसुत गोविन्द वासुदेव जगत्पते । देहि मे तनयं श्रीश
    गोपबालकनायक ॥ ८२॥ मुनिवन्दित गोविन्द रुक्मिणीवल्लभ प्रभो । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ८३॥
    गोपिकार्जितपङ्केजमकरन्दासक्तमानस । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ८४॥ रमाहृदयपङ्केजलोल माधव
    कामद । ममाभीष्टसुतं देहि त्वामहं शरणं गतः ॥ ८५॥ वासुदेव रमानाथ दासानां मङ्गलप्रद । देहि मे तनयं कृष्ण
    त्वामहं शरणं गतः ॥ ८६॥ कल्याणप्रद गोविन्द मुरारे मुनिवन्दित । देहि मे तनयं कृष्ण त्वामहं शरणं गतः
    ॥ ८७॥ पुत्रप्रद मुकुन्देश रुक्मिणीवल्लभ प्रभो । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ८८॥ पुण्डरीकाक्ष
    गोविन्द वासुदेव जगत्पते । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ८९॥ दयानिधे वासुदेव मुकुन्द मुनिवन्दित
    । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ९०॥ पुत्रसम्पत्प्रदातारं गोविन्दं देवपूजितम् । वन्दामहे सदा
    कृष्णं पुत्रलाभप्रदायिनम् ॥ ९१॥ कारुण्यनिधये गोपीवल्लभाय मुरारये । नमस्ते पुत्रलाभार्थं देहि मे तनयं
    विभो ॥ ९२॥ नमस्तस्मै रमेशाय रुक्मिणीवल्लभाय ते । देहि मे तनयं श्रीश गोपबालकनायक ॥ ९३॥ नमस्ते वासुदेवाय
    नित्यश्रीकामुकाय च । पुत्रदाय च सर्पेन्द्रशायिने रङ्गशायिने ॥ ९४॥ रङ्गशायिन् रमानाथ मङ्गलप्रद माधव
    । देहि मे तनयं श्रीश गोपबालकनायक ॥ ९५॥ दासस्य मे सुतं देहि दीनमन्दार राघव । सुतं देहि सुतं देहि पुत्रं
    देहि रमापते ॥ ९६॥ यशोदातनयाभीष्टपुत्रदानरतः सदा । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ९७॥ मदिष्टदेव
    गोविन्द वासुदेव जनार्दन । देहि मे तनयं कृष्ण त्वामहं शरणं गतः ॥ ९८ नीतिमान् धनवान् पुत्रो विद्यावांश्च
    प्रजायते । भगवंस्त्वत्कृपायाश्च वासुदेवेन्द्रपूजित ॥ ९९॥ यः पठेत् पुत्रशतकं सोऽपि सत्पुत्रवान् भवेत्
    । श्रीवासुदेवकथितं स्तोत्ररत्नं सुखाय च ॥ १००॥ जपकाले पठेन्नित्यं पुत्रलाभं धनं श्रियम् । ऐश्वर्यं
    राजसम्मानं सद्यो याति न संशयः ॥ १०१॥ इति श्रीमहाभारते खिलभागे हरिवंशे श्रीलक्ष्मीकेशवसंवादे श्रीसन्तानगोपालस्तोत्रं
    सम्पूर्णम् । अफ़्तेर् थे ःअरिवम्श ंआहात्म्यम्)
