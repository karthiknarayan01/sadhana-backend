id: pitrisharmakritamparvatistotram
category: stotram
name:
  english: pitrisharmakritamparvatistotram
  devanagari: पितृशर्मकृतंपार्वतीस्तोत्रम्
content:
  english: pitrisharmakritam parvatistotram 6 pitrisharmovaca | namah prakrityai sarvayai kaivalyayai
    namo namah | trigunaikyasvarupayai turiyayai namo namah || 10|| mahattattvajananyai ca dvanndvakartryai
    namo namah | brahmamatarnamastubhyam sahankarapitamahi || 11|| prithaggunayai shuddhayai namo matarnamo
    namah | vidyayai shuddhasattvayai lakshmyai sattvarajomayi || 12|| namo mataravidyayai tatah shuddhyai
    namo namah | kalyai sattvatamobhutyai namo matarnamo namah || 13|| striyai shuddharajomurtyai namastrailokyavasini
    | namo rajastamomurtyai durgayai ca namo namah || 14|| iti bhavishyapurane pratisargaparvani dvatiyakhande
    trimshadhyayantargatam pitrisharmakritam parvatistotram samaptam | bhavishyapurana | pratisargaparva
    | dvitiyakhanda | adhyaya 30
  devanagari: पितृशर्मकृतं पार्वतीस्तोत्रम् ६ पितृशर्मोवाच । नमः प्रकृत्यै सर्वायै कैवल्यायै नमो नमः ।
    त्रिगुणैक्यस्वरूपायै तुरीयायै नमो नमः ॥ १०॥ महत्तत्त्वजनन्यै च द्वन्न्द्वकर्त्र्यै नमो नमः । ब्रह्ममातर्नमस्तुभ्यं
    साहङ्कारपितामहि ॥ ११॥ पृथग्गुणायै शुद्धायै नमो मातर्नमो नमः । विद्यायै शुद्धसत्त्वायै लक्ष्म्यै सत्त्वरजोमयि
    ॥ १२॥ नमो मातरविद्यायै ततः शुद्ध्यै नमो नमः । काल्यै सत्त्वतमोभूत्यै नमो मातर्नमो नमः ॥ १३॥ स्त्रियै
    शुद्धरजोमूर्त्यै नमस्त्रैलोक्यवासिनि । नमो रजस्तमोमूर्त्यै दुर्गायै च नमो नमः ॥ १४॥ इति भविष्यपुराणे
    प्रतिसर्गपर्वणि द्वतीयखण्डे त्रिंशाध्यायान्तर्गतं पितृशर्मकृतं पार्वतीस्तोत्रं समाप्तम् । भविष्यपुराण
    । प्रतिसर्गपर्व । द्वितीयखण्ड । अध्याय ३०
