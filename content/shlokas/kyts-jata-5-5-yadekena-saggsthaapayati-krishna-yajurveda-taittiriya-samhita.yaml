id: kyts-jata-5-5-yadekena-saggsthaapayati-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 5.5 Yadekena Saggsthaapayati - Krishna Yajurveda Taittiriya Samhita
content:
  english: sthapaya tyeke naikena saggsthapayati yajnasya yajnasya sagg sthapayati yajnasya | saggsthapayatiti
    sam yajnasya santatyai santatyai yajnasya yajnasya santatyai | santatya avicchedaya vicchedaya santatyai
    santatya avicchedaya | aviccheda yaindra aindra avicchedaya viccheda yaindrah | aindrah pashavah pashava
    aindra aindrah pashavah | pashavo ye ye pashavah pashavo ye | ye mushkara mushkara ye ye mushkarah
    | nmushkara mushkara yat | yadaindra aindra ya ssanta aindra aindra santo 'gnibhyo 'gnibhya ssanto
    'gnibhyah | agnibhya alabhyanta alabhyante 'gnibhyo 'gnibhya alabhyante agnibhya ityagni bhya alabhyanta
    alabhyante devata ndadhati dadhati samadagm samada dadha tyagneyi ra rdadhati dadha tyagneyih | agneyi
    strishtubha strishtubha agneyi ra gneyi strishtubhah | trishtubho yajyanuvakya yajyanuvakya strishtubha
    strishtubho yajyanuvakyah dyajyanuvakya yajyanuvakyah yajyanuvakya iti yajya agneyi stena tena ttrishtubha
    strishtubho ya trishtubha stena tena trishtubha strishtubha stena | tenaindra aindra stena tenaindrah
    | ssamriddhyai samriddhya aindra aindra samriddhyai na na samriddhyai samriddhyai na | ndadhati dadhati
    samadagm samada dadhati vayave vayave dadhati dadhati vayave vayave niyutvate niyutvate vayave vayave
    niyutvate | ntuparanniyutvate niyutvate tuparam | a labhate labhata a labhate | labhate teja stejo
    labhate labhate tejah | tejo 'gne ragne steja stejo 'gneh | rvayu ragne ragne vayu stejase tejase
    vayu tejasa esha esha tejase tejasa eshah | a labhyate labhyata a labhyate | llabhyate labhyate tasma
    va~ti vati tadriyam | tadriyam magni ragni stadriya ntadriyam magnih | rdahati daha tyagni ragni ndahati
    dahati svam | tejo 'nvanu teja stejo 'nu | tye tyanvan veti | na niyutvate niyutvate na na niyutvate
    | nniyutvate niyutvate syat | dyajamano yajamano madye yajamano niyutvate niyutvate yajamano yajamano
    niyutvate | niyutvate bhavati bhavati niyutvate niyutvate bhavati | bhavati yajamanasya yajamanasya
    bhavati bhavati yajamanasya | yajamanasya nunmadaya nunmadaya yajamanasya yajamanasya nunmadaya |
    anunmadaya vayumati vayumati anunmadaya nunmadaya vayumati anunmadayetyanut shvetavati shvetavati
    vayumati vayumati vayumati iti vayu shvetavati yajyanuvakye yajyanuvakye shvetavati shvetavati yajyanuvakye
    shvetavati iti shveta yajyanuvakye bhavato bhavato yajyanuvakye yajyanuvakye bhavatah | yajyanuvakye
    iti yajya ssatejastvaya satejastvaya bhavato bhavata satejastvaya hiranyagarbho hiranyagarbha ssatejastvaya
    satejastvaya hiranyagarbhah | satejastvayeti satejah ssagm sagm hiranyagarbho hiranyagarbha hiranyagarbha
    iti hiranya sa mavartata vartata sagm sa mavartata | avarta tagre agre 'vartata vartatagre ityaghara
    maghara miti tyagharam | aghara ma ''ghara maghara ma | a gharayati gharaya tyagharayati | gharayati
    prajapatih prajapati rgharayati gharayati prajapatih | rvai vai prajapatih prajapati prajapatiriti
    praja vai hiranyagarbho hiranyagarbho vai vai hiranyagarbhah | hiranyagarbhah prajapateh prajapater
    hiranyagarbho hiranyagarbhah prajapateh | hiranyagarbha iti hiranya prajapate ranurupatvaya nurupatvaya
    prajapateh prajapate ranurupatvaya | prajapateriti praja anurupatvaya sarvani sarva nyanurupatvaya
    nurupatvaya sarvani | anurupatvayetyanurupa sarvani vai vai sarvani sarvani vai | va esha esha vai
    va eshah | esha rupani rupa nyesha esha rupani | mpashunagm rupani rupani pashunam | mprati prati
    pashuna pratya prati pratya | a labhyate labhyata a labhyate | llabhyate labhyate yat | shshmashruna
    stat | purushanagm rupagm rupa mpurushanagm rupam | ttupara stuparo ya ttupara stupara stat | tadashvana
    mashvana dyadashvana mashvanam anyatodannityanyatah avya ive vavya avya iva | shshapha ive va shaphah
    | rvayu rajana majanam dvayavyo vayavyo ya vayavyo bhavati bhavati vayavyo vayavyo bhavati | mbhavati
    bhava tyetam | eta mevaivaita meta meva | evaina mena mevai vaina ssanjanana abhyabhi sanjananah |
    sanjananah pashavah pashavah sanjanana ssanjananah pashavah | sanjanana iti sam pashava upopa pashavah
    pashava upa | upa tishthante tishthanta upopa tishthante | tishthante vayavyo vayavya stishthante
    tishthante vayavyah | vayavyo vayavyah karya ityahu rahuri tityahuh | tprajapateh prajapateh kurya
    tprajapateh prajapate riyat | prajapateriti praja prajapatyamiti praja dvayavyo vayavyo ya vayavyah
    pashuh pashu rvayavyo vayavyah pashuh | rbhavati bhavati pashuh pashu bhavati tena tena bhavati bhavati
    tena | rvayo stena tena vayoh | naityeti na naiti | tprajapatyah prajapatyo ya prajapatyah purodashah
    purodashah prajapatyah prajapatyah purodashah | prajapatya iti praja purodasho bhavati bhavati purodashah
    purodasho bhavati | bhavati tena tena bhavati bhavati tena | tena prajapateh prajapate stena tena
    prajapateh | rna na prajapateh prajapate prajapateriti praja naityeti na naiti | ddvadashakapalo dvadashakapalo
    ya dvadashakapala stena tena dvadashakapalo dvadashakapala stena | dvadashakapala iti dvadasha ttena
    tena vaishvanarat | naityeti na naiti | etyagnavaishnava ma tye tyagnavaishnavam | agnavaishnava mekadashakapala
    mekadashakapala magnavaishnava ma gnavaishnava mekadashakapalam | agnavaishnavamitya rnirekadashakapala
    mekadashakapala ekadashakapalamityekadasha vapati dikshishyamano dikshishyamano vapati vapati dikshishyamanah
    | dikshishyamano 'gni ragni kshishyamano dikshishyamano 'gnih | ssarva agni ragni sarva devata devata
    rdevata devata vishnuh | ryajno yajno vishnu yajno devata devata yajno yajno devatah shca ca devata
    devata ya~jna mevaiva yajnam | a rabhate rabhata a rabhate | rabhate 'gni ragni rabhate rabhate 'gnih
    | agni ravamo 'vamo 'gni ragni ravamah | ndevatana mavamo 'vamo devatanam | vishnuh paramah paramo
    vishnu tparamah paramo yat | agnavaishnava mekadashakapala mekadashakapala magnavaishnava ma gnavaishnava
    mekadashakapalam | agnavaishnavamitya nnirvapati nirvapa tyekadashakapala mekadashakapala ekadashakapalamityekadasha
    nirvapati devata devata nirvapati nirvapati devatah devata evaiva devata devata eva | || evobhayata
    ubhayata evai vobhayatah | ubhayatah parigrihya parigri hyobhayata ubhayatah parigrihya | parigrihya
    yajamano yajamanah parigrihya parigrihya yajamanah | yajamano 'vava yajamano yajamano 'va | ava rundhe
    rundhe 'vava rundhe | rundhe purodashena purodashena rundhe rundhe purodashena | purodashena vai vai
    purodashena purodashena vai | vai deva deva vai vai devah | ndeva deva amushminn | amushmin ~loke
    loke 'mushmi nnamushmin ~loke | nnardhnuvan ~loke loka a ardhnuvan caruna caruna nnardhnuvan caruna
    sh caruna caruna 'sminn | yah kamayeta kamayeta yo yah kamayeta | nnamushmin kamayeta kamayeta mushminn
    | amushmin ~loke loke 'mushmi nnamushmin ~loke | loka riddhnuya mriddhnuyam ~loke loka riddhnuyam
    | riddhnuya miti tyriddhnuya mriddhnuya miti | iti sa sa ititi sah | mpurodashagm sa sa purodasha
    nkurvita kurvita purodasha nnamushmin kurvita kurvita mushminn | eva loke loka evaiva loke | loka
    riddhno tyriddhnoti loke loka riddhnoti | dyadriddhno tyriddhnoti yat | yadashtakapalo 'shtakapalo
    ya ashtakapala stena tenashtakapalo 'shtakapala stena | ashtakapala ityashta ttrikapala strikapalo
    ya trikapala stena tena trikapala strikapala stena | trikapala iti tri shnava stena tena vaishnavah
    | ssamriddhyai samriddhyai vaishnavo vai ssamriddhyai samriddhyai yah | yah kamayeta kamayeta yo yah
    kamayeta | nnasmin kamayeta kamayeta sminn | asmin ~loke loke loka riddhnuya mriddhnuyam ~loke loka
    riddhnuyam | riddhnuya miti tyriddhnuya mriddhnuya miti | iti sa sa ititi sah | ncarugm sa sa carum
    | nkurvita kurvita caru kurvitagne ragneh kurvita kurvitagneh | nghrita magne ragne standula standula
    vishno ttandula standula stasma c caru shcaru stasma caruh karyah karya shcaru shcaruh karyah | nnasmin
    karyah karyo eva loke loka evaiva loke | loka riddhno tyriddhnoti loke loka riddhnoti | riddhno tyaditya
    aditya riddhno tyriddhno tyadityah | adityo bhavati bhava tyaditya adityo bhavati | aditi rasya masya
    maditi raditi rasyam | asya mevai vasya masya meva | eva prati pratye vaiva prati | prati tishthati
    tishthati prati prati tishthati | tishtha tyatho atho tishthati tishtha tyatho atho asya masya matho
    atho asyam | asya mevai vasya masya meva | evadhyadhye vaivadhi | ya~jna madhyadhi yajnam | ntanute
    tanute yajnam tanute yo ya stanute tanute yah | va~thsara mukhya mukhyagm sam ukhya mabhritva 'bhritvokhya
    mukhya mabhritva | abhritva 'gni magni mabhritva 'bhritva 'gnim | cinute yatha yatha cinute cinute
    yatha yatha sami sami yatha yatha sami | sami garbho garbhah sami sami garbhah | garbho 'vapadyate
    'vapadyate garbho garbho 'vapadyate | ktadri gavapadyate 'vapadyate tadrik | arti ma ''rti marti ma
    | arcche dricche darcche shvanara mricche dricche dvadashakapalamiti dvadasha vaishvanaro yatha yatha
    vaishvanaro vai va~thsara maptva ''ptva sam aptva kale kala aptva ''ptva kale | || kala agata agate
    kale kala agate | agate vijayate vijayata agata agate vijayate | vi~jayate vijayata evam | eva mevai
    vaiva meva meva | va~thsara maptva ''ptva sam aptva kale kala aptva ''ptva kale | kala agata agate
    kale kala agate | agate 'gni magni magata agate 'gnim | ncinute cinute 'gni magni cinute na na cinute
    cinute na | arti ma ''rti marti ma | arccha tyriccha tyarcchati | riccha tyeshaisha rccha tyriccha
    tyesha | esha vai va eshaisha vai | agneh priya priya 'gne ragneh priya | priya tanu stanuh priya
    priya tanuh | vaishvanarah priya shvanarah priyam | priya mevaiva priya ntanuva masyasya tanuva ava
    rundhe rundhe 'vava rundhe | rundhe trini trini rundhe rundhe trini | trinyeta nyetani trini trinyetani
    | etani havigmshi havig shyeta nyetani havigmshi | havigmshi bhavanti bhavanti havigmshi havigmshi
    bhavanti | bhavanti traya strayo bhavanti bhavanti trayah | traya ima ime traya straya ime | ime loka
    loka ima ime lokah | loka esha mesham ~loka loka esham | m ~lokana mesha mesham ~lokana lokanagm rohaya
    rohaya lokana m ~lokanagm rohaya | rohayeti rohaya | || prajapatih prajah prajah prajapatih prajapatih
    prajah | prajapatiriti praja ssrishtva srishtva prajah praja srishtva prena prena srishtva srishtva
    prena | prena 'nvanu prena prena 'nu | anu pra pranvanu pra | ttabhya stabhyo 'visha davisha tabhyah
    punah puna stabhya stabhyah punah | ssambhavitugm sambhavitu nna na sambhavitugm sambhavitu thsa so
    'shakno dashakno abravi driddhnava driddhnava dabravi dabravi driddhnavat | riddhnava didi driddhnava
    driddhnava dit | meta ito ma metah | itah punah puna rita itah punah | tpunah punah sancinavat | sancinava
    dititi sancinava nthsagm sa macinvann | tato vai vai tata stato vai | samacinvanniti sam tac cityasya
    cityasya ta ncityasya cityasya cityatvam | cityatvamiti citya vidva nagni magnim cinuta riddhno tyriddhnoti
    cinute cinuta riddhnoti | riddhno tyevaiva rdhno tyriddhno tyeva | eva kasmai kasma evaiva kasmai
    nkasmai kasmai kam | agni shciyate ciyate 'gni ragni shciyate | ciyata ititi ciyate ciyata iti | ityahu
    rahu riti tyahuh | ahu ragniva nagniva nahu rahu ragnivan | agniva nasanyasa nyagniva nagniva nasani
    | asani tityasa nyasa niti | iti vai va ititi vai | agni shciyate ciyate 'gni ragni shciyate | ciyate
    'gniva nagnivag shciyate ciyate 'gnivan | agniva nevai vagniva nagniva neva | eva bhavati bhava tyevaiva
    bhavati | bhavati kasmai kasmai bhavati bhavati kasmai nkasmai kasmai kam | agni shciyate ciyate 'gni
    ragni shciyate | ciyata ititi ciyate ciyata iti | ityahu rahuriti tyahuh | rdeva deva ahu rahu deva
    ma ma deva deva ma nma ma vedann | iti vai va ititi vai | agni shciyate ciyate 'gni ragni shciyate
    | rvidu shciyate ciyate viduh | ndeva deva ena mena devah kasmai kasmai deva devah kasmai nkasmai
    kasmai kam | agni shciyate ciyate 'gni ragni shciyate | ciyata ititi ciyate ciyata iti | ityahu rahuriti
    tyahuh | rgrihi grihyahu rahu grihyasa nyasani grihi grihyasani | asani tityasa nyasaniti | iti vai
    va ititi vai | agni shciyate ciyate 'gni ragni shciyate | ciyate grihi grihi ciyate ciyate grihi |
    grihye vaiva grihi grihyeva | eva bhavati bhava tyevaiva bhavati | bhavati kasmai kasmai bhavati bhavati
    kasmai nkasmai kasmai kam | agni shciyate ciyate 'gni ragni shciyate | ciyata ititi ciyate ciyata
    iti | ityahu rahuriti tyahuh | npashuma nahu rahuh pashuman | pashuma nasa nyasani pashuma asani tityasa
    nyasaniti | iti vai va ititi vai | agni shciyate ciyate 'gni ragni shciyate | || shciyate ciyate pashuman
    | pashuma nevaiva pashuma eva bhavati bhava tyevaiva bhavati | bhavati kasmai kasmai bhavati bhavati
    kasmai nkasmai kasmai kam | agni shciyate ciyate 'gni ragni shciyate | ciyata ititi ciyate ciyata
    iti | ityahu rahuriti tyahuh | ssapta saptahu rahu sapta ma ma sapta sapta ma ma purushah purusha
    ma ma purushah | purusha upopa purushah purusha upa | upa jivan jivanupopa jivan | jiva nititi jivan
    jivaniti | iti vai va ititi vai | agni shciyate ciyate 'gni ragni shciyate | ciyate traya straya shciyate
    ciyate trayah | trayah prancah pranca straya strayah prancah | pranca straya strayah prancah pranca
    strayah | trayah pratyancah pratyanca straya strayah pratyancah | pratyanca atma ''tma pratyancah
    pratyanca atma | ssaptama atma ''tma saptamah | saptama etavanta etavanta ssaptama etavantah | etavanta
    evai vaitavanta etavanta eva | evaina mena mevai vaina nnena mena mamushminn | amushmin ~loke loke
    'mushmi nnamushmin ~loke | loka upopa loke loka upa | ntyupopa jivanti | jivanti prajapatih prajapati
    rjivanti jivanti prajapatih | prajapati ragni magni mprajapatih prajapati ragnim | prajapatiriti praja
    agni macikishata cikishatagni magni macikishata | nta macikishata cikishata tam | mprithivi prithivi
    ta prithivya bravi dabravi tprithivi prithivya bravit | nna nabravi dabravi na mayi mayi na na mayi
    | mmayi mayyagnim | shyase ceshyase 'gni magni ceshyase 'tyati ceshyase ceshyase 'ti | ati ma ma 'tyati
    ma | ma dhakshyati dhakshyati ma ma dhakshyati | dhakshyati sa sa dhakshyati dhakshyati sa | tva 'tidahyamana
    'tidahyamana tva tva 'tidahyamana | atidahyamana vi vyatidahyamana 'tidahyamana vi | atidahyamanetyati
    vi dhavishye dhavishye vi vi dhavishye | dhavishye sa sa dhavishye dhavishye sah | || nbhavishyasi
    bhavishyasi papiya bhavishyasititi bhavishyasi bhavishyasiti | iti sa sa ititi sah | tatha vai vai
    tatha tatha vai | nkarishyami karishyamyaha maha karishyami yatha yatha karishyami karishyami yatha
    natidhakshya tyatidhakshyati na natidhakshyati | atidhakshya titi tyatidhakshya tyatidhakshyatiti
    | atidhakshyatityati iti sa sa ititi sah | sa ima mimagm sa sa imam | ima mabhyabhima mima mabhi |
    abhyamrisha damrisha dabhya tprajapatih prajapati ramrisha damrisha prajapati stva tva prajapatih
    prajapati stva | prajapatiriti praja tva sadayatu sadayatu tva tva sadayatu | sadayatu taya taya sadayatu
    sadayatu taya taya devataya devataya taya taya devataya | devataya 'ngirasva dangirasva ddevataya
    devataya 'ngirasvat | ddhruva dhruva 'ngirasva dangirasva dhruva sida sida dhruva dhruva sida | side
    titi sida sideti | itima mima mititimam | ima mevaivema mima meva | eveshtaka mishtaka mevaiveshtakam
    | nkritva kritveshtaka mishtaka kritvopopa kritva kritvopa | upadhatta dhatto popa dhatta | adhatta
    natidahaya natidahaya dhatta dhatta natidahaya | dyadanatidahaya natidahaya yat | mprati pratyagnim
    | ncinvita cinvitagni magni ttac cinvita cinvita tat | nmrishe dabhyabhi mrishet | tprajapatih prajapati
    prajapati stva tva prajapatih prajapati stva | prajapatiriti praja tva sadayatu sadayatu tva tva sadayatu
    | sadayatu taya taya sadayatu sadayatu taya taya devataya devataya taya taya devataya | devataya 'ngirasva
    dangirasva ddevataya devataya 'ngirasvat | ddhruva dhruva 'ngirasva dangirasva dhruva sida sida dhruva
    dhruva sida | side titi sida sideti | || itima mima mititimam | ima mevaivema mima meva | eveshtaka
    mishtaka mevaiveshtakam | nkritva kritveshtaka mishtaka kritvopopa kritva kritvopa | upa dhatte dhatta
    upopa dhatte | dhatte 'natidahaya natidahaya dhatte dhatte 'natidahaya | anatidahaya prajapatih prajapati
    ranatidahaya natidahaya prajapatih | prajapati rakamayata kamayata prajapatih prajapati rakamayata
    | prajapatiriti praja akamayata pra prakamayata kamayata pra | pra jayeya jayeya pra pra jayeya |
    jayeye titi jayeya jayeyeti | iti sa sa ititi sah | sa eta metagm sa sa etam | eta mukhya mukhya meta
    meta mukhya ukhya mapashya dapashya dukhya mukhya mapashyat | abibha stata stato 'bibha rabibha statah
    | tato vai vai tata stato vai | prajayata jayata pra prajayata | ttasma dajayata jayata tasma mbharyo
    bharyah sam bharyah pra pra bharyo bharyah pra | eva jayate jayata evaiva jayate | njayate jayate
    tam | vasavo vasavo 'bruvann | tva majanishtha ajanishtha stva va~ya majanishtha ajanishtha vayam
    | pra jayamahai jayamahai pra pra jayamahai | jayamaha ititi jayamahai jayamaha iti | va~subhyo vasubhya
    sta vasubhyah pra pra vasubhyo vasubhyah pra | trinyaha nyahani trini trinyahani | nyabibharu rabibharu
    raha nyaha abibharu stena tenabibharu rabibharu stena | tena trini trini tena tena trini | || trini
    ca ca trini trini ca | ca shatani shatani ca ca shatani | shata nyasrijanta srijanta shatani shata
    nyasrijanta | asrijanta trayastrigmshata ntrayastrigmshata masrijanta srijanta trayastrigmshatam |
    nca ca trayastrigmshata trayastrigmshatamiti trayah mbharyo bharya stryaha bharyah pra pra bharyo
    bharyah pra | eva jayate jayata evaiva jayate | stan jayate jayate tan | nrudra rudra stag nrudra
    rudra abruvann | yuya majanidhva majanidhvam va~ya majanidhva majanidhvam pra jayamahai jayamahai
    pra pra jayamahai | jayamaha ititi jayamahai jayamaha iti | tagm rudrebhyo rudrebhya sta ntagm rudrebhyah
    | rudrebhyah pra pra rudrebhyo rudrebhyah pra | npra prayacchann | nyabibharu rabibharu raha nyaha
    abibharu stena tenabibharu rabibharu stena | tena trini trini tena tena trini | trini ca ca trini
    trini ca | ca shatani shatani ca ca shatani | shatanya srijanta srijanta shatani shatanya srijanta
    | asrijanta trayastrigmshata ntrayastrigmshata masrijanta srijanta trayastrigmshatam | nca ca trayastrigmshata
    trayastrigmshatamiti trayah mbharyo bharya shshadahagm shadaha bharyah pra pra bharyo bharyah pra
    | eva jayate jayata evaiva jayate | stan jayate jayate tan | tanaditya aditya stag nnaditya aditya
    abruvann | yuya majanidhva majanidhvam va~ya majanidhva majanidhvam pra jayamahai jayamahai pra pra
    jayamahai | jayamaha ititi jayamahai jayamaha iti | ta madityebhya adityebhya sta nta madityebhyah
    | adityebhyah pra pradityebhya adityebhyah pra | npra prayacchann | ndvadasha dvadasha ta dvadashaha
    nyahani dvadasha dvadashahani | nyabibharu rabibharu raha nyaha abibharu stena tenabibharu rabibharu
    stena | tena trini trini tena tena trini | trini ca ca trini trini ca | ca shatani shatani ca ca shatani
    | shatanya srijanta srijanta shatani shatanya srijanta | asrijanta trayastrigmshata ntrayastrigmshata
    masrijanta srijanta trayastrigmshatam | nca ca trayastrigmshata trayastrigmshatamiti trayah dvadashahamiti
