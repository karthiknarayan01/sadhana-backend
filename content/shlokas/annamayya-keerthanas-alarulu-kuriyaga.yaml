id: annamayya-keerthanas-alarulu-kuriyaga
category: stotram
name:
  english: Annamayya Keerthanas Alarulu Kuriyaga
content:
  english: adi pallavi alarulu guriyaga nadènade | alakala gulukula nalamelumanga || araviri sòbagula
    nativalu mèccaga ara tèra maruguna nadè nade | varusaga purvadu valapu tirupula hari garagimpucu nalamelumanga
    || alarulu guriyaga nadènade | alakala gulukula nalamelumanga || mattapu malapula mattèlakèlapula
    tattèdi nadapula datènade | pèttina vajrapu pèndèpu dalukulu attittu cimmucu nalamelumanga || alarulu
    guriyaga nadènade | alakala gulukula nalamelumanga || cindula patala shiripòlayatala andèla mrotala
    nadè nade | kanduva tiruvènkatapati mèccaga andapu tirupula nalamelumanga || alarulu guriyaga nadènade
    | alakala gulukula nalamelumanga ||
  devanagari: आदि पल्लवि अलरुलु गुरियग नाडॆनदे । अलकल गुलुकुल नलमेलुमङ्ग ॥ अरविरि सॊबगुल नतिवलु मॆच्चग
    अर तॆर मरुगुन नाडॆ नदे । वरुसग पूर्वदु वालपु तिरुपुल हरि गरगिम्पुचु नलमेलुमङ्ग ॥ अलरुलु गुरियग नाडॆनदे
    । अलकल गुलुकुल नलमेलुमङ्ग ॥ मट्टपु मलपुल मट्टॆलकॆलपुल तट्टॆडि नडपुल दाटॆनदे । पॆट्टिन वज्रपु पॆण्डॆपु
    दलुकुलु अट्टिट्टु चिम्मुचु नलमेलुमङ्ग ॥ अलरुलु गुरियग नाडॆनदे । अलकल गुलुकुल नलमेलुमङ्ग ॥ चिन्दुल
    पाटल शिरिपॊलयाटल अन्दॆल म्रोतल नाडॆ नदे । कन्दुव तिरुवॆङ्कटपति मॆच्चग अन्दपु तिरुपुल नलमेलुमङ्ग ॥
    अलरुलु गुरियग नाडॆनदे । अलकल गुलुकुल नलमेलुमङ्ग ॥
