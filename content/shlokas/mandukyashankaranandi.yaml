id: mandukyashankaranandi
category: upanishad
name:
  english: mandukyashankaranandi
  devanagari: माण्डुक्यशन्करानन्दि
content:
  english: prathama matra purva matra || vyakhyatamanyat | akarasya purvamatratva upapattimaha || aptervyapteh
    | akaro hi jagaritasthanadikam sarvamapnoti || prakarantarena punarniruktimaha || adimattvadva ||
    a a i ityevamadiradih | sa yasminnasti so'yamadimamstasya bhava adimattvamadisamanyavattvamityarthah
    | prathamapado'pi yatha padanamadirata eva tatsamanyavanapnoti cetaratpadajatam purvabhavitvat | vashabdah
    pakshantararthah | vishvakarayoraikyamapterva''dimattvadvetyarthah | idanim vishvakarayoraptya''dimattvajnanatphalamaha
    || apnoti prapnoti hi prasiddhan vai smaryamanan sarvan nikhilan kaman kamyamanan putrakshetradin
    | apteh phalamuktva''dimattvasya phalamaha || adishca svanam madhye sarveshu karyeshu prathamaganyah
    | cakaradapi prathamam phalam bhavati | spashtam || yasya phalam tamaha || yah padamatratadatmyajna
  devanagari: प्रथमा मात्रा पूर्वा मात्रा ॥ व्याख्यातमन्यत् । अकारस्य पूर्वमात्रत्व उपपत्तिमाह ॥ आप्तेर्व्याप्तेः
    । अकारो हि जागरितस्थानादिकं सर्वमाप्नोति ॥ प्रकारान्तरेण पुनर्निरुक्तिमाह ॥ आदिमत्त्वाद्वा ॥ अ आ इ
    इत्येवमादिरादिः । स यस्मिन्नस्ति सोऽयमादिमांस्तस्य भाव आदिमत्त्वमादिसामान्यवत्त्वमित्यर्थः । प्रथमपादोऽपि
    यथा पादानामादिरत एव तत्सामान्यवानाप्नोति चेतरत्पादजातं पूर्वभावित्वात् । वाशब्दः पक्षान्तरार्थः ।
    विश्वाकारयोरैक्यमाप्तेर्वाऽऽदिमत्त्वाद्वेत्यर्थः । इदानीं विश्वाकारयोराप्त्याऽऽदिमत्त्वज्ञानात्फलमाह
    ॥ आप्नोति प्राप्नोति हि प्रसिद्धान् वै स्मर्यमाणान् सर्वान् निखिलान् कामान् काम्यमानान् पुत्रक्षेत्रादीन्
    । आप्तेः फलमुक्त्वाऽऽदिमत्त्वस्य फलमाह ॥ आदिश्च स्वानां मध्ये सर्वेषु कार्येषु प्रथमगण्यः । चकारादपि
    प्रथमं फलं भवति । स्पष्टम् ॥ यस्य फलं तमाह ॥ यः पादमात्रातादात्म्यज्ञ
meaning: {}
