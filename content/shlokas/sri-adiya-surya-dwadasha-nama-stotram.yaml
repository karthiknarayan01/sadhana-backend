id: sri-adiya-surya-dwadasha-nama-stotram
category: stotram
name:
  english: Sri Adiya (Surya) Dwadasha Nama Stotram
content:
  english: adityah prathamam namam dvitiyam tu divakarah | tritiyam bhaskarah proktam caturtham tu prabhakarah
    || || pancamam tu sahasramshuh shashtham caiva trilocanah | saptamam haridashvashca ashtamam tu vibhavasuh
    || || navamam dinakrit proktam dashamam dvadashatmakah | ekadasham trayimurtirdvadasham surya eva
    ca || || dvadashadityanamani pratah kale pathennarah | duhsvapno nashyate tasya sarvaduhkham ca nashyati
    || || dadrukushthaharam caiva daridryam harate dhruvam | sarvatirthakaram caiva sarvakamaphalapradam
    || || yah pathet pratarutthaya bhaktya stotramidam narah | saukhyamayustatharogyam labhate mokshameva
    ca || || iti shri aditya dvadashanama stotram |
  devanagari: आदित्यः प्रथमं नामं द्वितीयं तु दिवाकरः । तृतीयं भास्करः प्रोक्तं चतुर्थं तु प्रभाकरः ॥
    ॥ पञ्चमं तु सहस्रांशुः षष्ठं चैव त्रिलोचनः । सप्तमं हरिदश्वश्च अष्टमं तु विभावसुः ॥ ॥ नवमं दिनकृत्
    प्रोक्तं दशमं द्वादशात्मकः । एकादशं त्रयीमूर्तिर्द्वादशं सूर्य एव च ॥ ॥ द्वादशादित्यनामानि प्रातः
    काले पठेन्नरः । दुःस्वप्नो नश्यते तस्य सर्वदुःखं च नश्यति ॥ ॥ दद्रुकुष्ठहरं चैव दारिद्र्यं हरते ध्रुवम्
    । सर्वतीर्थकरं चैव सर्वकामफलप्रदम् ॥ ॥ यः पठेत् प्रातरुत्थाय भक्त्या स्तोत्रमिदं नरः । सौख्यमायुस्तथारोग्यं
    लभते मोक्षमेव च ॥ ॥ इति श्री आदित्य द्वादशनाम स्तोत्रम् ।
