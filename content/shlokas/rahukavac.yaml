id: rahukavac
category: kavacha
name:
  english: rahukavac
  devanagari: राहुकवच्
content:
  english: ayurarogya adi samriddhi praptayarthe jape viniyogah || pranamami sada rahum shurpakaram kiritinam
    | saimhikeyam karalasyam lokanamabhayapradam || 1|| nilambarah shirah patu lalatam lokavanditah |
    cakshushi patu me rahuh shrotre tvardhashariravan || 2|| nasikam me dhumravarnah shulapanirmukham
    mama | jihvam me simhikasunuh kantham me kathinanghrikah || 3|| bhujangesho bhujau patu nilamalyambarah
    karau | patu vakshahsthalam mantri patu kukshim vidhuntudah || 4|| katim me vikatah patu uru me surapujitah
    | svarbhanurjanuni patu janghe me patu jadyaha || 5|| gulphau grahapatih patu padau me bhishanakritih
    | sarvanyangani me patu nilacandanabhushanah || 6|| rahoridam kavacamriddhidavastudam yo bhaktya pathatyanudinam
    niyatah shucih san | prapnoti kirtimatulam shriyamriddhimayu
  devanagari: आयुरारोग्य आदि समृद्धि प्राप्तयर्थे जपे विनियोगः ॥ प्रणमामि सदा राहुं शूर्पाकारं किरीटिनम्
    । सैंहिकेयं करालास्यं लोकानामभयप्रदम् ॥ १॥ नीलाम्बरः शिरः पातु ललाटं लोकवन्दितः । चक्षुषी पातु मे
    राहुः श्रोत्रे त्वर्धशरीरवान् ॥ २॥ नासिकां मे धूम्रवर्णः शूलपाणिर्मुखं मम । जिह्वां मे सिंहिकासूनुः
    कण्ठं मे कठिनाङ्घ्रिकः ॥ ३॥ भुजङ्गेशो भुजौ पातु नीलमाल्याम्बरः करौ । पातु वक्षःस्थलं मन्त्री पातु
    कुक्षिं विधुन्तुदः ॥ ४॥ कटिं मे विकटः पातु ऊरू मे सुरपूजितः । स्वर्भानुर्जानुनी पातु जङ्घे मे पातु
    जाड्यहा ॥ ५॥ गुल्फौ ग्रहपतिः पातु पादौ मे भीषणाकृतिः । सर्वाण्यङ्गानि मे पातु नीलचन्दनभूषणः ॥ ६॥ राहोरिदं
    कवचमृद्धिदवस्तुदं यो भक्त्या पठत्यनुदिनं नियतः शुचिः सन् । प्राप्नोति कीर्तिमतुलां श्रियमृद्धिमायु
