    रामु सीय जग माहीं। कौ न कहिहि मोर मत नाहीम् ॥ सो मैं सुनब सहब सुखु मानी। अन्तहुँ कीच तहाँ जहँ पानी
    ॥ डरु न मोहि जग कहिहि कि पोचू। परलोकहु कर नाहिन सोचू ॥ एकि उर बस दुसह दवारी। मोहि लगि भे सिय रामु
