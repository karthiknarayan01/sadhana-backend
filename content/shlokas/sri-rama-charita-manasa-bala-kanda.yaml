    ॥ नयन लाभु सब सादर लेहीम् ॥ जाइ न बरनि मनोहर जोरी। जो उपमा कछु कहौं सो थोरी ॥ राम सीय सुन्दर प्रतिछाहीं।
    जगमगात मनि खम्भन माहीम् । मनहुँ मदन रति धरि बहु रूपा। देखत राम बिआहु अनूपा ॥ दरस लालसा सकुच न थोरी।
    प्रगटत दुरत बहोरि बहोरी ॥ भे मगन सब देखनिहारे। जनक समान अपान बिसारे ॥ प्रमुदित मुनिन्ह भावँरी फेरी।
    नेगसहित सब रीति निबेरीम् ॥ राम सीय सिर सेन्दुर देहीं। सोभा कहि न जाति बिधि केहीम् ॥ अरुन पराग जलजु
    भरि नीकें। ससिहि भूष अहि लोभ अमी केम् ॥ बहुरि बसिष्ठ दीन्ह अनुसासन। बरु दुलहिनि बैठे एक आसन ॥ छं बैठे
    बरासन रामु जानकि मुदित मन दसरथु भे। तनु पुलक पुनि पुनि देखि अपनें सुकृत सुरतरु फल ने ॥ भरि भुवन रहा
    उछाहु राम बिबाहु भा सबहीं कहा। केहि भाँति बरनि सिरात रसना एक यहु मङ्गलु महा ॥ ॥ तब जनक पाइ बसिष्ठ
