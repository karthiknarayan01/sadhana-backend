id: malavatiparameshvarastotrabvp
category: stotram
name:
  english: malavatiparameshvarastotraBVP
  devanagari: मालावतीपरमेश्वरस्तोत्रBVP
content:
  english: malavatyah parameshvara athava mahapurushastotram vande tam paramatmanam sarvakaranakaranam
    | vina yena shavah sarve pranino jagatitale || 9|| 1 nirliptam sakshirupam ca sarvesham sarvakarmasu
    | vidyamanamadrishtam ca sarvaih sarvatra sarvada || 10|| 2 yena srishta ca prakritih sarvadhara paratpara
    | brahmavishnushivadinam prasurya trigunatmika || 11|| 3 jagatsrashta svayam brahma niyato yasya sevaya
    | pata vishnushca jagatam samharta shamkarah svayam || 12|| 4 dhyayante yam surah sarve munayo manavastatha
    | siddhashca yoginah santah samtatam prakriteh param || 13|| 5 sakaram ca nirakaram param svecchamayam
    vibhum | varam varenyam varadam vararham varakaranam || 14|| 6 tapahphalam tapobijam tapasam ca phalapradam
    | svayam tapahsvarupam ca sarvarupam ca sarvatah || 15|| 7 sarvadharam sarvabijam karma tatkarmanam
    phalam | tesham ca phaladataram tadbijam kshayakaranam || 16|| 8 svayam tejahsvarupam ca bhaktanugrahavigraham
    | seva dhyanam na ghatate bhaktanam vigraham vina || 17| 9 tattejo mandalakaram suryakotisamaprabham
    | ativa kamaniyam ca rupam tatra manoharam || 18|| 10 navinaniradashyamam sharatpankajalocanam | sharatparvanacandrasyamishaddhasyasamanvitam
    || 19|| 11 kotikandarpalavanyam liladhamamanoharam | candanokshitasarvangam ratnabhushanabhushitam||
    20|| 12 dvibhujam muralihastam pitakausheyavasasam | kishoravayasam shantam radhakantamanantakam ||
    21|| 13 gopanganaparivritam kutracinnirjane vane | kutracidrasamadhyastham radhaya parishevitam ||
    22|| 14 kutrcidgopavesham ca veshtitam gopabalakaih | shatasha
  devanagari: मालावत्याः परमेश्वर अथवा महापुरुषस्तोत्रम् वन्दे तं परमात्मानं सर्वकारणकारणम् । विना येन
    शवाः सर्वे प्राणिनो जगतीतले ॥ ९॥ १ निर्लिप्तं साक्षिरूपं च सर्वेषां सर्वकर्मसु । विद्यमानमदृष्टं च
    सर्वैः सर्वत्र सर्वदा ॥ १०॥ २ येन सृष्टा च प्रकृतिः सर्वाधारा परात्परा । ब्रह्मविष्णुशिवादीनां प्रसूर्या
    त्रिगुणात्मिका ॥ ११॥ ३ जगत्स्रष्टा स्वयं ब्रह्मा नियतो यस्य सेवया । पाता विष्णुश्च जगतां संहर्ता शंकरः
    स्वयम् ॥ १२॥ ४ ध्यायन्ते यं सुराः सर्वे मुनयो मनवस्तथा । सिद्धाश्च योगिनः सन्तः संततं प्रकृतेः परम्
    ॥ १३॥ ५ साकारं च निराकारं परं स्वेच्छामयं विभुम् । वरं वरेण्यं वरदं वरार्हं वरकारणम् ॥ १४॥ ६ तपःफलं
    तपोबीजं तपसां च फलप्रदम् । स्वयं तपःस्वरूपं च सर्वरूपं च सर्वतः ॥ १५॥ ७ सर्वाधारं सर्वबीजं कर्म तत्कर्मणां
    फलम् । तेषां च फलदातारं तद्बीजं क्षयकारणम् ॥ १६॥ ८ स्वयं तेजःस्वरूपं च भक्तानुग्रहविग्रहम् । सेवा
    ध्यानं न घटते भक्तानां विग्रहं विना ॥ १७। ९ तत्तेजो मण्डलाकारं सूर्यकोटिसमप्रभम् । अतीव कमनीयं च रूपं
    तत्र मनोहरम् ॥ १८॥ १० नवीननीरदश्यामं शरत्पङ्कजलोचनम् । शरत्पार्वणचन्द्रास्यमीषद्धास्यसमन्वितम् ॥ १९॥
    ११ कोटिकन्दर्पलावण्यं लीलाधाममनोहरम् । चन्दनोक्षितसर्वाङ्गं रत्नभूषणभूषितम्॥ २०॥ १२ द्विभुजं मुरलीहस्तं
    पीतकौशेयवाससम् । किशोरवयसं शान्तं राधाकान्तमनन्तकम् ॥ २१॥ १३ गोपाङ्गनापरिवृतं कुत्रचिन्निर्जने वने
    । कुत्रचिद्रासमध्यस्थं राधया परिषेवितम् ॥ २२॥ १४ कुत्र्चिद्गोपवेषं च वेष्टितं गोपबालकैः । शतश
