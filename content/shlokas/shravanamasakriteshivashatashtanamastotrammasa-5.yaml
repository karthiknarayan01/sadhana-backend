id: shravanamasakriteshivashatashtanamastotrammasa-5
category: stotram
name:
  english: shravanamasakriteshivashatashtanamastotrammasa 5
  devanagari: श्रावणमासकृतेशिवशताष्टनामस्तोत्रम्मास ५
content:
  english: surathaya sumadhyaya manmathantakaraya ca | mahomayaya tikshnaya ardracarmadharaya ca || 38||
    shmashanaratinityaya namo'stulukadharine | barhibarhavasanaya ghanaya bahugarjate || 39|| kavyapujyaya
    hridyaya trinetraya pinakine | paravaraya nityaya satyadharmaya te namah || 40|| namo mahadhvareshaya
    tandunrittapriyaya ca | vibhishanaya bhimaya bhagapramathanaya ca || 41|| siddhasanghatagitaya mahashesha'ngadaya
    ca | namo muktattahasaya kshvedasphotakaraya ca || 42|| nardate kurdate caiva namah pramuditatmane
    | namo mridaya devaya dhavate vishtitaya ca || 43|| dhyayate nandate caiva ruvate dravate namah |
    valate kridate caiva lambodarasharirine || 44|| pishangashmashrukeshaya arunaya kshayaya ca | namo
    vikritaveshaya mundamaladharaya ca || 45|| nama unmattaveshaya kinkinikataye namah | amarshanaya kruraya
    vishnubanadharaya ca || 46|| nrisihmantyavasanaya krodadamshtravidharine | gajadantagadayatha godajinambaravasase
    || 47|| tarunaya sharanyaya aranyapataye namah | aprameyaya diptaya nirgunaya gunaya ca || 48|| vadyapriyaya
    paraya cudamanidharaya ca | namastokaya cintyaya yogidhyeyaya shambhave || 49|| namo vedantavedyaya
    bhavavaidyaya bhutaye | ojase tejase caiva bhrajate grasate namah || 50|| evam vai shravane pujyo
    bilvairnamashatashtakaih | stavam papaharam stutva shivam devam prasadayet || 51|| || iti shivarahasyantargate
    ishvaraproktam shravanamasakrite shivashatashtanamastotram sampurnam ||
  devanagari: सुरथाय सुमध्याय मन्मथान्तकराय च । महोमयाय तीक्ष्णाय आर्द्रचर्मधराय च ॥ ३८॥ श्मशानरतिनित्याय
    नमोऽस्तूलूकधारिणे । बर्हिबर्हवसानाय घनाय बहुगर्जते ॥ ३९॥ काव्यपूज्याय हृद्याय त्रिणेत्राय पिनाकिने
    । परावराय नित्याय सत्यधर्माय ते नमः ॥ ४०॥ नमो महाध्वरेशाय तण्डुनृत्तप्रियाय च । विभीषणाय भीमाय भगप्रमथनाय
    च ॥ ४१॥ सिद्धसङ्घातगीताय महाशेषाऽङ्गदाय च । नमो मुक्ताट्टहासाय क्ष्वेडस्फोटकराय च ॥ ४२॥ नर्दते कुर्दते
    चैव नमः प्रमुदितात्मने । नमो मृडाय देवाय धावते विष्टिताय च ॥ ४३॥ ध्यायते नन्दते चैव रुवते द्रवते नमः
    । वलते क्रीडते चैव लम्बोदरशरीरिणे ॥ ४४॥ पिशङ्गश्मश्रुकेशाय अरुणाय क्षयाय च । नमो विकृतवेषाय मुण्डमालाधराय
    च ॥ ४५॥ नम उन्मत्तवेषाय किङ्किणीकटये नमः । अमर्षणाय क्रूराय विष्णुबाणधराय च ॥ ४६॥ नृसिह्मान्त्यावसानाय
    क्रोडदंष्ट्राविधारिणे । गजदन्तगदायाथ गोडजिनाम्बरवाससे ॥ ४७॥ तरुणाय शरण्याय अरण्यपतये नमः । अप्रमेयाय
    दीप्ताय निर्गुणाय गुणाय च ॥ ४८॥ वाद्यप्रियाय पाराय चूडामणिधराय च । नमस्तोकाय चिन्त्याय योगिध्येयाय
    शम्भवे ॥ ४९॥ नमो वेदान्तवेद्याय भववैद्याय भूतये । ओजसे तेजसे चैव भ्राजते ग्रसते नमः ॥ ५०॥ एवं वै श्रावणे
    पूज्यो बिल्वैर्नामशताष्टकैः । स्तवं पापहरं स्तुत्वा शिवं देवं प्रसादयेत् ॥ ५१॥ ॥ इति शिवरहस्यान्तर्गते
    ईश्वरप्रोक्तं श्रावणमासकृते शिवशताष्टनामस्तोत्रं सम्पूर्णम् ॥
