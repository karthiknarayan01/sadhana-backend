id: brahmanakritamardhanarishvarastotram
category: stotram
name:
  english: brahmanakritamardhanarishvarastotram
  devanagari: ब्रह्मणाकृतंअर्धनारीश्वरस्तोत्रम्
content:
  english: brahmana kritam ardhanarishvarastotram 5 brahmovaca | jaya deva mahadeva jayeshvara maheshvara
    | jaya sarvagunashreshtha jaya sarvasuradhipa || 16|| jaya prakriti kalyani jaya prakritinayike |
    jaya prakritidure tvam jaya prakritisundari || 17|| jayamoghamahamaya jayamogha manoratha | jayamoghamahalila
    jayamoghamahabala || 18|| jaya vishvajaganmatarjaya vishvajaganmaye | jaya vishvajagaddhatri jaya
    vishvajagatsakhi || 19|| jaya shashvatikaishvarya jaya shashvatikalaya | jaya shashvatikakara jaya
    shashvatikanuga || 20|| jayatmatrayanirmatri jayatmatrayapalini | jayatmatrayasamhartri jayatmatrayanayike
    || 21|| jayavalokanayattajagatkaranabrimhana | jayopekshakatakshotthahutabhugbhuktabhautika || 22||
    jaya devadyavijneye svatmasukshmadrishojjvale | jaya sthulatmashaktyeshe jaya vyaptacaracare || 23||
    jaya namaikavinyastavishvatattvasamuccaya | jayasurashironishtha shreshthanugakadambaka || 24|| jayopashritasamrakshasamvidhanapatiyasi
    | jayonmulitasamsaravishavrikshankurodgame || 25|| jaya pradeshikaishvaryaviryashauryavijrimbhana
    | jaya vishvabahirbhuta nirastaparavaibhava || 26|| jaya pranitapancarthaprayogaparamamrita | jaya
    pancarthavijnanasudhastotrasvarupini || 27|| jayatu ghorasamsaramaharogabhishagvara | jayanadimalajnanatamahpatalacandrike
    || 28|| jaya tripurakalagne jaya tripurabhairavi | jaya trigunanirmukte jaya trigunamardini || 29||
    jaya prathamasarvajna jaya sarvaprabodhika | jaya pracuradivyanga jaya prarthitadayini || 30|| kva
    deva te param dhama kva ca tuccham ca no vacah | tathapi bhagavan bhaktya pralapantam kshamasva mam
    || 31|| vijnapyaivamvidhaih suktairvishvakarma caturmukhah | namashcakara rudraya radranyai ca muhurmuhuh
    || 32|| idam stotravaram punyam brahmana samudiritam | ardhanarishvaram nama shivayorharshavardhanam
    || 33|| ya idam kirtayedbhaktya yasya kasyapi shikshaya | sa tatphalamavapnoti shivayoh pritikaranat
    || 34|| sakalabhuvanabhutabhavanabhyam jananavinashavihinavigrahabhyam | naravarayuvativapurdharabhyam
    satatamaham pranato'smi shankarabhyam || 35|| iti shrishivamahapurane saptamyam vayaviyasamhitayam
    purvakhande pancadashadhyayantargatam brahmana kritam ardhanarishvarastotram | shivapurana | vayaviyasamhita
    | purvabhaga 1 | adhyaya 15
  devanagari: ब्रह्मणा कृतं अर्धनारीश्वरस्तोत्रम् ५ ब्रह्मोवाच । जय देव महादेव जयेश्वर महेश्वर । जय सर्वगुणश्रेष्ठ
    जय सर्वसुराधिप ॥ १६॥ जय प्रकृति कल्याणि जय प्रकृतिनायिके । जय प्रकृतिदूरे त्वं जय प्रकृतिसुन्दरि ॥
    १७॥ जयामोघमहामाय जयामोघ मनोरथ । जयामोघमहालील जयामोघमहाबल ॥ १८॥ जय विश्वजगन्मातर्जय विश्वजगन्मये ।
    जय विश्वजगद्धात्रि जय विश्वजगत्सखि ॥ १९॥ जय शाश्वतिकैश्वर्य जय शाश्वतिकालय । जय शाश्वतिकाकार जय शाश्वतिकानुग
    ॥ २०॥ जयात्मत्रयनिर्मात्रि जयात्मत्रयपालिनि । जयात्मत्रयसंहर्त्रि जयात्मत्रयनायिके ॥ २१॥ जयावलोकनायत्तजगत्कारणबृंहण
    । जयोपेक्षाकटाक्षोत्थहुतभुग्भुक्तभौतिक ॥ २२॥ जय देवाद्यविज्ञेये स्वात्मसूक्ष्मदृशोज्ज्वले । जय स्थूलात्मशक्त्येशे
    जय व्याप्तचराचरे ॥ २३॥ जय नामैकविन्यस्तविश्वतत्त्वसमुच्चय । जयासुरशिरोनिष्ठ श्रेष्ठानुगकदम्बक ॥ २४॥
    जयोपाश्रितसंरक्षासंविधानपटीयसि । जयोन्मूलितसंसारविषवृक्षाङ्कुरोद्गमे ॥ २५॥ जय प्रादेशिकैश्वर्यवीर्यशौर्यविजृम्भण
    । जय विश्वबहिर्भूत निरस्तपरवैभव ॥ २६॥ जय प्रणीतपञ्चार्थप्रयोगपरमामृत । जय पञ्चार्थविज्ञानसुधास्तोत्रस्वरूपिणि
    ॥ २७॥ जयतु घोरसंसारमहारोगभिषग्वर । जयानादिमलाज्ञानतमःपटलचन्द्रिके ॥ २८॥ जय त्रिपुरकालाग्ने जय त्रिपुरभैरवि
    । जय त्रिगुणनिर्मुक्ते जय त्रिगुणमर्दिनि ॥ २९॥ जय प्रथमसर्वज्ञ जय सर्वप्रबोधिक । जय प्रचुरदिव्याङ्ग
    जय प्रार्थितदायिनि ॥ ३०॥ क्व देव ते परं धाम क्व च तुच्छं च नो वचः । तथापि भगवन् भक्त्या प्रलपन्तं
    क्षमस्व माम् ॥ ३१॥ विज्ञाप्यैवंविधैः सूक्तैर्विश्वकर्मा चतुर्मुखः । नमश्चकार रुद्राय रद्राण्यै च मुहुर्मुहुः
    ॥ ३२॥ इदं स्तोत्रवरं पुण्यं ब्रह्मणा समुदीरितम् । अर्धनारीश्वरं नाम शिवयोर्हर्षवर्धनम् ॥ ३३॥ य इदं
    कीर्तयेद्भक्त्या यस्य कस्यापि शिक्षया । स तत्फलमवाप्नोति शिवयोः प्रीतिकारणात् ॥ ३४॥ सकलभुवनभूतभावनाभ्यां
    जननविनाशविहीनविग्रहाभ्याम् । नरवरयुवतीवपुर्धराभ्यां सततमहं प्रणतोऽस्मि शङ्कराभ्याम् ॥ ३५॥ इति श्रीशिवमहापुराणे
    सप्तम्यां वायवीयसंहितायां पूर्वखण्डे पञ्चदशाध्यायान्तर्गतं ब्रह्मणा कृतं अर्धनारीश्वरस्तोत्रम् । शिवपुराण
    । वायवीयसंहिता । पूर्वभाग १ । अध्याय १५
