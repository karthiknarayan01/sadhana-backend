id: viradhanurajnakritamshivastotram
category: stotram
name:
  english: viradhanurajnakritamshivastotram
  devanagari: वीरधनुराज्नाकृतंशिवस्तोत्रम्
content:
  english: 60|| namo bhogaya dhumraya namo'stu gaganatmane | namo vahnisamuhaya namaste nirmalakara ||
    61|| namo mahandhakararka namaste shatrughatine | namah samsaraparaya divyarupasharirine | namah kanakavarnaya
    namo mohitamohine || 62|| namah surupaya surarcitaya namo virupaya prakriteh paraya | namo namo rupanirashrayaya
    shyamasurupaya namo namaste || 63|| iti shriskandapurane avantyakhande caturashitilingamahatmye ashtavimshadhyayantargatam
    viradhanurajna kritam shivastotram samaptam | skandapurana | avantyakhanda | caturashitikhanda | adhyaya
    28
  devanagari: ६०॥ नमो भोगाय धूम्राय नमोऽस्तु गगनात्मने । नमो वह्निसमूहाय नमस्ते निर्मलाकर ॥ ६१॥ नमो महान्धकारार्क
    नमस्ते शत्रुघातिने । नमः संसारपाराय दिव्यरूपशरीरिणे । नमः कनकवर्णाय नमो मोहितमोहिने ॥ ६२॥ नमः सुरूपाय
    सुरार्चिताय नमो विरूपाय प्रकृतेः पराय । नमो नमो रूपनिराश्रयाय श्यामासुरूपाय नमो नमस्ते ॥ ६३॥ इति श्रीस्कन्दपुराणे
    आवन्त्यखण्डे चतुरशीतिलिङ्गमाहात्म्ये अष्टविंशाध्यायान्तर्गतं वीरधनुराज्ञा कृतं शिवस्तोत्रं समाप्तम्
    । स्कन्दपुराण । आवन्त्यखण्ड । चतुरशीतिखण्ड । अध्याय २८
