id: annamayya-keerthanas-kamadhenuvide
category: stotram
name:
  english: Annamayya Keerthanas Kamadhenuvide
content:
  english: kamadhenu vide kalpavriksha mide pramanyamu gala prapannulaku || harinamajapame abharanambulu
    paramatmuninuti parimalamu | daranidaru padaseve bhogamu paramambèrigina prapannulaku || devuni dhyanamu
    divyannambulu shrivibhu bhakte jivanamu | avishnu kainkaryame samsaramu pavanulagu yi prapannulaku
    || yepuna shrivenkateshude sarvamu dapai yitani vandaname vidhi | kapuga sharanagatule cuttalu pai
    payi gèlicina prapannulaku ||
  devanagari: कामधेनु विदे कल्पवृक्ष मिदे प्रामाण्यमु गल प्रपन्नुलकु ॥ हरिनामजपमे आभरणम्बुलु परमात्मुनिनुति
    परिमलमु । दरणिदरु पादसेवे भोगमु परमम्बॆरिगिन प्रपन्नुलकु ॥ देवुनि ध्यानमु दिव्यान्नम्बुलु श्रीविभु
    भक्ते जीवनमु । आविष्णु कैङ्कर्यमे संसारमु पावनुलगु यी प्रपन्नुलकु ॥ येपुन श्रीवेङ्कटेशुडे सर्वमु दापै
    यितनि वन्दनमे विधि । कापुग शरणागतुले चुट्टालु पै पयि गॆलिचिन प्रपन्नुलकु ॥
