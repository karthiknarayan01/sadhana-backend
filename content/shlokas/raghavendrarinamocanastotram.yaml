id: raghavendrarinamocanastotram
category: stotram
name:
  english: raghavendrarinamocanastotram
  devanagari: राघवेन्द्रऋणमोचनस्तोत्रम्
content:
  english: prakatitamatabhavavyakritipropakartah | kritakalikritadoshoccatana kshemakarin kuru rinapariharam
    tata me raghavendra || 4|| dravinarahitalokastvamupashritya sarve kalitasakalakamah santi saukhyena
    bhumau | idamahamapi matva samsritastvamudaram kuru rinapariharam tata me raghavendra || 5|| yativara
    bahubhaktatrananat patavam te kimu galitamuta'ham nasmi kim rakshanarhah | dvayamapi na hi yuktam
    sarvatantrasvatantre kuru rinapariharam tata me raghavendra || 6|| naramitaramudarasevamano'pi bhuyah
    sukhamahamiha napam purvakarmanurodhat | tadapi jhatati dhutva rakshasityashraye tvam kuru rina pariharam
    tata me raghavendra || 7|| mama tu bhavati mitre bandhave matarishte pitari sadi vadanye sadgurau
    va samarthe | vyasanamanubhavami tvatsutah sampratam kim kuru rinapariharam tata me raghavendra ||
    8|| iti guruvara putro nama krishnavadhutah cakara rinavinashastotrametadgunanam | pathati shatadinam
    yo nityametattrivaram kuru rinapariharam tata me raghavendra || 9|| rinamocanakam nama stotram pratyakshasiddhidam
    | kuru rinapariharam tata me raghavendra || 10|| iti shrimatkrishnavadhutapanditakritau shriraghavendratantre
    dvadashapatale rinamocanastotram sampurnam |
  devanagari: प्रकटितमतभावव्याकृतिप्रोपकर्तः । कृतकलिकृतदोषोच्चाटन क्षेमकारिन् कुरु ऋणपरिहारं तात मे राघवेन्द्र
    ॥ ४॥ द्रविणरहितलोकास्त्वामुपाश्रित्य सर्वे कलितसकलकामाः सन्ति सौख्येन भूमौ । इदमहमपि मत्वा संसृतस्त्वामुदारं
    कुरु ऋणपरिहारं तात मे राघवेन्द्र ॥ ५॥ यतिवर बहुभक्तत्राणनात् पाटवं ते किमु गलितमुताऽहं नास्मि किं
    रक्षणार्हः । द्वयमपि न हि युक्तं सर्वतन्त्रस्वतन्त्रे कुरु ऋणपरिहारं तात मे राघवेन्द्र ॥ ६॥ नरमितरमुदारसेवमानोऽपि
    भूयः सुखमहमिह नापं पूर्वकर्मानुरोधात् । तदपि झटति धूत्वा रक्षसीत्याश्रये त्वां कुरु ऋण परिहारं तात
    मे राघवेन्द्र ॥ ७॥ मम तु भवति मित्रे बान्धवे मातरीष्टे पितरि सदि वदान्ये सद्गुरौ वा समर्थे । व्यसनमनुभवामि
    त्वत्सुतः साम्प्रतं किं कुरु ऋणपरिहारं तात मे राघवेन्द्र ॥ ८॥ इति गुरुवर पुत्रो नाम कृष्णावधूतः चकर
    ऋणविनाशस्तोत्रमेतद्गुणानाम् । पठति शतदिनं यो नित्यमेतत्त्रिवारं कुरु ऋणपरिहारं तात मे राघवेन्द्र ॥
    ९॥ ऋणमोचनकं नाम स्तोत्रं प्रत्यक्षसिद्धिदम् । कुरु ऋणपरिहारं तात मे राघवेन्द्र ॥ १०॥ इति श्रीमत्कृष्णावधूतपण्डितकृतौ
    श्रीराघवेन्द्रतन्त्रे द्वादशपटले ऋणमोचनस्तोत्रं सम्पूर्णम् ।
