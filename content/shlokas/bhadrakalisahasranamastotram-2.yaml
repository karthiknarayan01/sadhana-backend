    ॐ श्रीं अं लोकमाता च ॐ श्रीं लं लक्षमातृका । ॐ श्रीं रां गीं ह्सौः लभ्या श्रीं अलभ्या ह्सौः लता ॥
    ८५॥ ॐ श्रीं लोकेशवरदा ॐ श्रीं लां लास्यतत्परा । ॐ श्रीं लोहितनेत्रा च ॐ श्रीं लवाङ्कृतिस्तथा ॥ ८६॥
    ऐं सौः ललितजिह्वा च ॐ श्रीं लोकारिसेविता । ॐ श्रीं त्रिलोकजननी ॐ जुं सः लोकघातिनी ॥ ८७॥ ॐ श्रीं दीर्घजटाजूटा
    ॐ श्रीं जृम्भारिसेविता । ॐ क्रीं जुं मेदिनी स्वाहा ॐ क्रीं जुं सः मृतिञ्जया ॥ ८८॥ ॐ श्रीं जुं जयदा
    स्वाहा ॐ श्रीं जनकनन्दिनी । ॐ जुं लां जटिनी स्वाहा ॐ जुं जगत्समाश्रया ॥ ८९॥ ॐ श्रीं मौनव्रता स्वाहा
    ॐ श्रीं मोदकभक्षिणी । ॐ श्रीं ह्रीं क्लीं ग्लौं ग्लुं लां मोदकाहारतोषिता ॥ ९०॥ ॐ ह्रीं मुद्गरहस्ता
    च ॐ ह्रीं मातामही तथा । ॐ प्रीं पितामही स्वाहा ॐ प्रीं पितृपितामही ॥ ९१॥ ॐ क्लीं पाषाणरूपा च ॐ प्रीं
    पाषाण्डभक्षिणी । ॐ ऐं श्रीं सर्वतोग्रस्था ॐ प्रीं पलितकेशिनी ॥ ९२॥ ॐ श्रीं क्लीं हरपत्नी च ॐ कालपत्नी
    ह्सौः कुटी । ॐ ह्रीं श्रीं विष्णुपत्नी च ॐ ह्रीं श्रीं क्लीं च वैष्णवी ॥ ९३॥ ॐ ह्रीं श्रीं क्लीं ह्सौः
    रौद्री ॐ रां क्लीं रुद्रसेविता । ॐ श्रीं क्लीं सः च ब्रह्माणी ॐ श्रीं ब्रह्मेन्द्रसेविता ॥ ९४॥ ॐ श्रीं
    क्लीं व्रतिनी स्वाहा ॐ क्लीं द्रीं दक्षनन्दिनी । ॐ श्रीं क्लीं ऐं म्लौं क्रीं हूं दक्षक्रतुविनाशिनी
    ॥ ९५॥ ॐ श्रीं क्लीं विघ्नहन्त्री च ॐ श्रीं विघ्नेश्वरेश्वरी । ॐ श्रीं श्यामा च ऐं बाला ॐ ह्रीं बालकतोषिता
