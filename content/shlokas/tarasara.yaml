id: tarasara
category: upanishad
name:
  english: tarasara
  devanagari: तरसर
content:
  english: atha hainam bharadvajo yajnavalkyamuvacatha kairmantraih paramatma prito bhavati svatmanam
    darshayati tanno bruhi bhagava iti | sa hovaca yajnavalkyah | om yo ha vai shriparamatma narayanah
    sa bhagavanakaravacyo jambavanbhurbhuvah suvastasmai vai namonamah || 1|| om yo ha vai shriparamatma
    narayanah sa bhagavanukaravacya upendrasvarupo harinayako bhurbhuvah suvastasmai vai namonamah ||
    2|| om yo ha vai shriparamatma narayanah sa bhagavanmakaravacyah shivasvarupo hanumanbhurbhuvah suvastasmai
    vai namonamah || 3|| om yo ha vai shriparamatma narayanah sa bhagavanbindusvarupah shatrughno bhurbhuvah
    suvastasmai vai namonamah || 4|| om yo ha vai shriparamatma narayanah sa bhagavannadasvarupo bharato
    bhurbhuvah suvastasmai vai namonamah || 5|| om yo ha vai shriparamatma narayanah sa bhagavankalasvarupo
    lakshmano bhurbhuvah suvastasmai vai namonamah || 6|| om yo ha vai shriparamatma narayanah sa bhagavankalatita
    bhagavati sita citsvarupa bhurbhuvah suvastasmai vai namonamah || 7|| yatha prathamamantroktavadyantau
    tatha sarvamantreshu drashtavyam | ukaravacya upendrasvarupo harinayakah 2 makaravacyah shivasvarupo
    hanuman 3 bindusvarupah shatrughnah 4 nadasvarupo bharatah 5 kalasvarupo lakshmanah 6 kalatita bhagavati
    sita citsvarupa 7 om yo ha vai shriparamatma narayanah sa bhagavamstatparah paramapurushah puranapurushottamo
    nityashuddhabuddhamuktasatya
  devanagari: अथ हैनं भारद्वाजो याज्ञवल्क्यमुवाचाथ कैर्मन्त्रैः परमात्मा प्रीतो भवति स्वात्मानं दर्शयति
    तन्नो ब्रूहि भगव इति । स होवाच याज्ञवल्क्यः । ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवानकारवाच्यो जाम्बवान्भूर्भुवः
    सुवस्तस्मै वै नमोनमः ॥ १॥ ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवानुकारवाच्य उपेन्द्रस्वरूपो हरिनायको
    भूर्भुवः सुवस्तस्मै वै नमोनमः ॥ २॥ ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवान्मकारवाच्यः शिवस्वरूपो हनूमान्भूर्भुवः
    सुवस्तस्मै वै नमोनमः ॥ ३॥ ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवान्बिन्दुस्वरूपः शत्रुघ्नो भूर्भुवः
    सुवस्तस्मै वै नमोनमः ॥ ४॥ ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवान्नादस्वरूपो भरतो भूर्भुवः सुवस्तस्मै
    वै नमोनमः ॥ ५॥ ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवान्कलास्वरूपो लक्ष्मणो भूर्भुवः सुवस्तस्मै वै नमोनमः
    ॥ ६॥ ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवान्कलातीता भगवती सीता चित्स्वरूपा भूर्भुवः सुवस्तस्मै वै
    नमोनमः ॥ ७॥ यथा प्रथममन्त्रोक्तावाद्यन्तौ तथा सर्वमन्त्रेषु द्रष्टव्यम् । उकारवाच्य उपेन्द्रस्वरूपो
    हरिनायकः २ मकारवाच्यः शिवस्वरूपो हनुमान् ३ बिन्दुस्वरूपः शत्रुघ्नः ४ नादस्वरूपो भरतः ५ कलास्वरूपो
    लक्ष्मणः ६ कलातीता भगवती सीता चित्स्वरूपा ७ ॐ यो ह वै श्रीपरमात्मा नारायणः स भगवांस्तत्परः परमपुरुषः
    पुराणपुरुषोत्तमो नित्यशुद्धबुद्धमुक्तसत्य
