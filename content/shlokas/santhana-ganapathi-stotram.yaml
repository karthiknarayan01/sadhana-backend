id: santhana-ganapathi-stotram
category: stotram
name:
  english: Santhana Ganapathi Stotram
content:
  english: namo'stu gananathaya siddhibuddhiyutaya ca | sarvapradaya devaya putravriddhipradaya ca ||
    || gurudaraya gurave goptre guhyasitaya te | gopyaya gopitasheshabhuvanaya cidatmane || || vishvamulaya
    bhavyaya vishvasrishtikaraya te | namo namaste satyaya satyapurnaya shundine || || ekadantaya shuddhaya
    sumukhaya namo namah | prapannajanapalaya pranatartivinashine || || sharanam bhava devesha santatim
    sudridha kuru | bhavishyanti ca ye putra matkule gananayaka || || te sarve tava pujartham niratah
    syurvaromatah | putrapradamidam stotram sarvasiddhipradayakam || || iti santanaganapatistotram sampurnam
    ||
  devanagari: नमोऽस्तु गणनाथाय सिद्धिबुद्धियुताय च । सर्वप्रदाय देवाय पुत्रवृद्धिप्रदाय च ॥ ॥ गुरूदराय
    गुरवे गोप्त्रे गुह्यासिताय ते । गोप्याय गोपिताशेषभुवनाय चिदात्मने ॥ ॥ विश्वमूलाय भव्याय विश्वसृष्टिकराय
    ते । नमो नमस्ते सत्याय सत्यपूर्णाय शुण्डिने ॥ ॥ एकदन्ताय शुद्धाय सुमुखाय नमो नमः । प्रपन्नजनपालाय
    प्रणतार्तिविनाशिने ॥ ॥ शरणं भव देवेश सन्ततिं सुदृढा कुरु । भविष्यन्ति च ये पुत्रा मत्कुले गणनायक ॥
    ॥ ते सर्वे तव पूजार्थं निरताः स्युर्वरोमतः । पुत्रप्रदमिदं स्तोत्रं सर्वसिद्धिप्रदायकम् ॥ ॥ इति सन्तानगणपतिस्तोत्रं
    सम्पूर्णम् ॥
