id: sharabhasahasra
category: stotram
name:
  english: sharabhasahasra
  devanagari: शरभसहस्र
content:
  english: phat punah svaha devadanavasevitah || 20|| kali krim hrim shiva durga pakshadvayalasacchubhah
    | svahamantranvitah satyah satyah satyaparakramah || 21|| bhimo bhayanako daksho drim drum dakshamakhapahah
    | rogadoshaharah siddhah siddhisadhanatatparah || 22|| hraum hrim kalakalajnani mani dani sukhavahah
    | hrim phat svaha kavistarkah tarkavidyacarah puman || 23|| kharyangah khecarividya kham khim khum
    khagateshvarah | shrim hrim svahayuto devo rajarajo sureshvarah || 24|| icchasiddhishvaro devo kriyashaktisamanvitah
    | am im um jnanasamyukto bhagavansarvasarvajit || 25|| aim phat svaha pancatattvatpancatanmatrasayakah
    | pancakutashtakutesho shankarashcandrashekharah || 26|| vam vim vum
  devanagari: फट् पुनः स्वाहा देवदानवसेवितः ॥ २०॥ काली क्रीं ह्रीं शिवा दुर्गा पक्षद्वयलसच्छुभः । स्वाहामन्त्रान्वितः
    सत्यः सत्यः सत्यपराक्रमः ॥ २१॥ भीमो भयानको दक्षो द्रीं द्रूं दक्षमखापहः । रोगदोषहरः सिद्धः सिद्धिसाधनतत्परः
    ॥ २२॥ ह्रौं ह्रीं कालकालज्ञानी मानी दानी सुखावहः । ह्रीं फट् स्वाहा कविस्तर्कः तर्कविद्याचरः पुमान्
    ॥ २३॥ खर्याङ्गः खेचरीविद्या खां खीं खूं खगतेश्वरः । श्रीं ह्रीं स्वाहायुतो देवो राजराजो सुरेश्वरः
    ॥ २४॥ इच्छासिद्धीश्वरो देवो क्रियाशक्तिसमन्वितः । आं ईं ऊं ज्ञानसंयुक्तो भगवान्सर्वसर्वजित् ॥ २५॥
    ऐं फट् स्वाहा पञ्चतत्त्वात्पञ्चतन्मात्रसायकः । पञ्चकूटाष्टकूटेशो शङ्करश्चन्द्रशेखरः ॥ २६॥ वां वीं
    वूं
