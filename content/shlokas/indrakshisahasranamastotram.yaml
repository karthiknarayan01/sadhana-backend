id: indrakshisahasranamastotram
category: sahasranama
name:
  english: indrakshisahasranamastotram
  devanagari: इन्द्राक्षीसहस्रनामस्तोत्रम्
content:
  english: ugratara jatajuta dharini jambusatribha || 23|| jambunadaprabha jeya jyeshtha shreshtha jalandhara
    | jagrati ca sushuptishca jayamanditamurdhaja || 24|| jagatprasurjagatprita pretarajakshayankari |
    para punyaprada preta trayimurtistrayitanuh || 25|| trayitanunibha tryashra tryakshari tarinitanuh
    | tanvi tripuramata ca trinetra tripurottama || 26|| trivargaphaladata ca totala'tulavikrama | trivikramaprasustryanta
    trayi tripurabhairavi || 27|| shrida shridharapatni ca shrih shridanakavitrida | shridevi ca mahalakshmih
    siddhalakshmi sarasvati || 28|| bala balakatushta ca bala balyaikasundari | baliyasi bhallahasta balakeya
    balandhara || 29|| balitushta balibhuja varada balakeshvari | bandhupriya vandhaveshi bagala vaidaveshvari
    || 30|| brahmastravidya jatila brahmani kshatriyimaya | mara pralayakartri ca matangi mattamanasa
    || 31|| mattamatangaga medhya muktida medini matih | rajamatanginimurtih rajogunavibhushana || 32||
    ratida smritida mathya menaka manavardhini | sundopasundamathani svarupa ca tilottama || 33|| rambha
    rambha ca rambhoru samrambha rambhakarini | sadananda sadatushta sadarushta sadagatih || 34|| calakesha
    cala canta camikaranibhanana | cyuta'cyutapriya colya culli ceti ca satkritih || 35|| carurupa mahacara
    jainamargavirodhini | janani jainajanani jainamargarasalasa || 36|| ramika rasasantushta rasa ramaikarodhini
    | rasollasa rasasarasarini smarakarini || 37|| rajni rajyaprada raupya rajyada bhogavardhini | bhagini
    bhagyada bhoga bhagamala bhagatmika || 38|| bhirunda bhayabhartabha bhavibha bhimarupini | bhayanakamukhabhishtaphalada
    phainilapraja || 39|| pitamvara pitamukhi patangashatasannibha | patangagamini pinakuca kushthakshayankari
    || 40|| viratmikantika cadya vagila vasusundari | vasavi vasumata ca vasudha vanmayi vatuh || 41||
    vatupriya vatugata vacadya vesharupini | varahi vaishnavi yashtiryakshini yadunandini || 42|| yadaveshi
    yajnakari yajnikeshtavaraprada | yajnapriya yashoda ca yashomala yashasvini || 43|| yanava yajurmata
    ca yatra ca yogini yava | vamacarapriya vamavarta vagvadini vasa || 44|| yajnavarahavarada vamadevi
    vasundhara | sharika shashilekha ca sharadindushataprabha || 45|| manojava manorupa mahogravapushi
    vadhuh | shashinetra shiva shaini shivavamangacarini || 46|| om hrim shrimambika''tmiya cadidevi manohara
    | ishtadatrishvari cesha ishani ceshvarapriya || 47|| uma cogramukhi mohyoragabhushanabhushita | unnata
    connatakuca codayacalasamshraya || 48|| uditadityasadrishi ca yogaphaladayini | urutanvi tanustara
    cosha banakshayankari || 49|| aniruddhapriya cosha vela cosharamandala | ushmoshmajvalanayana rijuryakshaikasundari
    || 50|| rupa rikshadhvajeshta ca ushmini coshmasundari | lipta livirlivikari lina lilalayasvara ||
    51|| enakshi aimsvarupakshi aishvarya''shcaryarupini | onkaraprabhava caushta cautsavi codayi vidhih
    || 52|| amva sureshvari shukra ahsvarupaikasundari | kalika kanakaprita kantida kamini priya || 53||
    kathoravapushi kila kilita kubjarupini | kubjika kuvari kunta kevala kantisundari || 54|| kamarivarada
    kantih kameshta kirtisundari | karuki katuki kirtih katuvakkatucoshini || 55|| kalantakajita kalikeshvari
    keshavapriya | krita kritatapa krura krureshi krurasundari || 56|| kriyavati kriyakartri krimini kramukapriya
    | kurmeshvari kurmagatih kurmini kurmarupini || 57|| karakaraikanigada kareshi karamocini | kakaravarnamala
    ca kakaraksharasundari || 58|| aim saumh khrim khecari khanta khashi khetakarupini | khagamini khagagatih
    khageshi khagasundari || 59|| khagahasta khagakshi ca kharupa kheshasundari | khakararupini khasthakhakaramritasundari
    || 60|| om hrim shrim gam ganeshani gunini gunasundari | gunipriya gajapatirgajastha gajagamini ||
    61|| gari garishtha gutika ganashri gitasundari | gaya gitapriya gamya guhya guhyakasundari || 62||
    girija giripujya ca girashi girisundari | grahini grihini gamya guheshi guhasundari || 63|| gorgavya
    gomayi ganta gokari goshthasundari | gajananapriya griva gotreshi gotrasundari || 64|| gramika graharupa
    ca graheshi grahasundrari | guhaprasuryahavasa gehini gehasundari || 65|| ganaka ganakeshani ganesha
    ganasundari | ganeshajanani gopi gopeshi gopasundari || 66|| guhyakeshtaprada geya gaganakarasundari
    | aim saumh ghanakritirghosheshi ghaushasundari || 67|| gharghara ghargharimurtih ghatika ghatasundari
    | ghanasannibhamurtishca ghavarnamritasundari || 68|| om hrim shrim nem nantavarnanka rokarasundari
    | om hrim shrim carmavasa ca carmini carmasundari || 69|| candrika candravadana candreshi candrasundari
    | caracarajagatsrashta caruni carusundari || 70|| calacalacyutakacacyuteshyacyutasundari | cumbini
    culika cara cureshi daityasundari || 71|| calatkanakakeyura calatkanakasundari | om hrim shrim chinnamasta
    ca chitrasya chitrasundari || 72|| chitrika chitramukuta chakaraksharasundari | om jum sah haum jayakara
    jagatidharasundari || 73|| jagaccha nta jagatsrashta jagatisrishtisundari | jambupriya jambuveshi
    japeshi japasundari || 74|| jivada jivavarada jiveshi jivasundari | om hrim kankarini shrotirlekhakankarasundari
    || 75|| jhilli dhanurjya jyaghata jhakaranandasundari | om shrim nanutanurnanta nakarakarasundari
    || 76|| om aim sauh tankahasta ca tankeshi tankadharini | om thah thah thah svarupadya thakaratrayasundari
    || 77|| om hrim dimbahidimba ca hidika dimvasundari | om shrim hram dhakkuti dhakka dhakritirdhakkasundari
    || 78|| om hrim natmapriya nanta navarnanandasundari | om aim srim tatinitirtha tirtheshi tithisundari
    || 79|| tarapriyantari turya turyeshi turyasundari | trotika tutigandhadhya truteshi trutisundari
    || 80|| tarapatih kala datri tara kantarasundari | tretayugeshvari tryamba tryambakeshvarasundari
    || 81|| talatalashraya tapi takaraksharasundari | aim shrim sthularavindakshi sthulaja jalasundari
    || 82|| sthandila mandalakara thakaranandasundari | dyutirdevi dayalushca dayarupaikasundari || 83||
    dari dyutimati dipta diptapavakasundari | diptarcirdiptashikhini dipita dipasundari || 84|| dameshvari
    damakanksha damada damasundari | dolakrida dari guhya daridra darasundari || 85|| daridryashatakotighni
    daridraksharasundari | om saumh sau dhanada dharmya dharmeshta dharmasundari || 86|| dhanya dhanyajanastutya
    dharmini dhatrisundari | dhanadaikapriya dhatri dharitri dhirasundari || 87|| dharmakarmapriya dhira
    dhiraviraikasundari | om krim narayani nivi nrisimhi simhasundari || 88|| naranarayanimurtirnarmakarmaikasundari
    | narmasacivyakollasa nadeshi nadasundari || 89|| natini natakollasa natanartanasundari | narmada
    nalini nila nalinekshanasundari || 90|| om aim prim parama puta poteshi potasundari | panyada panaya
    sakshi panyashri panyasundari || 91|| parantrika parollasa pivara pinasundari | phatkara ca vashatkara
    phalada phalasundari || 92|| phat svarupa phadakara phat varnamritasundari | om aim baleshvari babhrurbalarda
    balasundari || 93|| balidanavayaksheshi balibhukyatisundari | om shrim bhaim bhadrakali ca bhadrada
    bhadrasundari || 94|| om hrim bhargashikha bhargi bhargaveshvarasundari | bhargya bhargangavasatirbhargakhyabhargasundari
    || 95|| bhagalingamritaprita bhagalingaikasundari | bhagananda bhagollasa bhageshi bhagasundari ||
    96|| bhagottama bhagananda bhaganandaikasundari | bhagalingamritasnata bhagavirvaikasundari || 97||
    bhagabimba bhagadya ca bhogeshi bhogasundari | bhogapavargada bhagya bhagastha bhimasundari || 98||
    bhimanada bhimarada bhimaha bhimasundari | om shrim mrittika mritsna marjari mridasundari || 99||
    mina mainakabhagini manikeshvarasundari | mahoraska mahimadhya madhavi madhusundari || 100|| madhumatta
    mahajyotirmerustha merusundari | madhukshiba madarakta maddeshi madhusundari || 101|| om shrim yogapriya
    yogya yogeshi yogasundari | om yajnadakshina vajya om yakshaishvaryasundari || 102|| om yakshaveganilaya
    yakshavelaikasundari | yameshta yamada yatra yamaishvaryadisundari || 103|| yamini yamini yamya yamavelaikasundari
    | yogiyogaphala yadonatheshta nathasundari || 104|| yana yanarasa yashtiryakarollasasundari | om ram
    rasatalastha ca rasada rasasundari || 105|| rasasvata raivataki reva raivatasundari | ravikotiprabha
    dipti ravija ravisundari || 106|| rakshasi rakshasam rakta rani rakshasasundari | rajovati ranasiki
    raka raksharasundari || 107|| om hrim shrim lambakesha lamboshthi lambasundari | lambodarapriya lambhya
    lanca langulasundari || 108|| laladdamsa lalannetra lalita lallisundari | lohitakshi lalanmurtirlohita
    lohiteshvari || 109|| lohitambarabhushadhya lakaramritasundari | om vam vanecarapriya vedika vedasundari
    || 110|| valita valijanani valuka valisundari | varapriya varollasa varini varisundari || 111|| varajyeshtha
    kanishtha ca valupta luptasundari | vyomaga varidhisuta varakanandasundari || 112|| om shrim shashisahasrabha
    shitanga shankarapriya | shautyapriya shatananda shataga shitasundari || 113|| shatayajnaikavarada
    shatayakshaikasundari | shatakratupriya sharmadayini shakrasundari || 114|| shivapriya shulahasta
    shukreshi shukrasundari | shokaha'shokamaladhya shukla shokaikasundari || 115|| shuklavasa shuklamukhi
    shakaraksharasundari | om shrim shadakshara shatshadvarna khavarnasundari || 116|| shodashi shodashakala
    shodasharnarnasundari | om aim saumh sattviki sita sarala sirasundari || 117|| sukmala sanaya saumya
    saumyeshi saumyasundari | susvara sunakadhyaksha sanakadhyarshisundari || 118|| samastanarakatrata
    samastanarasundari | samastabhayaha devi samastabhayasundari || 119|| samastajayada jvala jvalamandalasundari
    | saumh saumh saumh saumh svamantrasva saumhmantraksharasundari || 120|| om hrim harihareshani hareshi
    harasundari | harapatni havirjvala havyadhya harasundari || 121|| hotrisevya hakaradya hrinkaraksharasundari
    | om kshmam kshmayati kshiva kshanta kshirarnavasthita || 122|| kshiramvudhipriyaksheshta caksheshi
    kshirasundari | kshirabdhitanaya kshanta kshakaramritasundari || 123|| akaradikshakaranta lakshatattvadisundari
    | brahmi ca vaishnavi caishi brahmeshta brahmasundari || 124|| navatattvaprakashadhya nutana vishnusundari
    | navapithanivasastha shivada shivasundari || 125|| navendriyaikanilaya shivada shivasundari | navagatharasakanksha
    gatha gaganasundari || 126|| navaratnavibhushadhya brahma brahmandasundari | navadvipaikavasatih pita
    patalasundari || 127|| navapannagaharadhya pranta pannagasundari | navamatrikramollasa navya nakshatrasundari
    || 128|| navaparvataprasthastha navamantrankasundari | akacadi ritonnaddhapayashaksharakarmini ||
    129|| talataladipatalacarini sarvasundari | om hrim shrim aim saumh klim devi phat svahendrakshini
    para || 130|| phalashrutih | itindrakshyah param namnam sahasram shivabhashitam | sarvamantraikanilayam
    sundariti manupriyam || 131|| navatattvamayam divyam brahmandantam sudhamayam | bhogapavargadam punyam
    sarvatirthekasadhanam || 132|| baladam sarvada shantam grahanam shantikritparam | sarvarogabhayaharam
    sarvadevapriyam mahat || 133|| bhutapretapishacadiyaksharakshasabhitishu | pathedva pathayennamnam
    sahasram mantragarbhikam || 134|| duradeva palayante khageshadiva pannagah | kushthadayo maharogah
    shamameshyantyasamshayam || 135|| sadhakasya sada punyavardhanam dhanavardhanam | sarvakalaikaphaladam
    sarvamantraikasadhanam || 136|| bhurjatvaci likhenmantram suryavare ca sadhakah | gorocanaih kunkumena
    dharayetsavyake bhuje || 137|| indradya nirjarah sarve ravanadya nishacarah | samyuge ca jitva dhritva
    namnam sahasramuttamam || 138|| ramabhadrena sahasa vishnuna daityapungavah | bhaume'shtamyam shmashane
    ca pathennamnam sahasrakam || 139|| japedashtottarashatam devyah parshadvaro bhavet | amavasyam nishithe
    ca ravau namnam sahasrakam || 140|| pathitva puline nadyah brihaspatisamo bhavet | stambhayedripusainyadidasyuvadimukhani
    ca || 141|| mohayetparameshanam vashayedbhuvanatrayam | marayedriyusanghatam sadhayenmantrasancayam
    || 142|| akarshayedashmarasa uccatayati vairinah | pathanacchravanatsatyam dharanatsadhakottamah ||
    143|| ihaloke sukham bhuktva paratra tridivam vrajet | trisandhyam yah pathedbhaume tristrivaram shucivratah
    || 144|| bhumishayi sudhirdevim darshayedvaradayinim | rane rajabhaye kunje ghoradavagnibhitishu ||
    145|| payodhau potavayau va sankate rajasannidhau | caurabhitishu durgeshu simhashvapadabhitishu ||
    146|| pathennamnam sahasrantu sadhako mucyate bhayat | prabhavamasya namnam tu sahasrasyaiha varnitum
    || 147|| na ca shakromi shakto'pi shesha hi viphalam padam | alam vistaramatrena yah pathetsadhakottamah
    || 148|| vicaredbhuvaneshveko yathaham bhairavottamah | iti namnam sahasram tu sarvamantraikarupinam
    || 149|| indrakshyah sarvasarvasvam rahasyam svargavasinam | sarvarthasadhanam loke sarvatantragamarnavam
    || 150|| guhyam guptam sada gopyam goptavyam pashusankate | grihinam yogadam nityam yoginam muktidam
    sada || 151|| indrakshya vajrahastaya namnam sahasrakam param | guhyatiguhyagoptavyam gopaniyam svayonivat
    || 152|| iti shrirudrayamale tantre indrakshinamasahasram samaptam ||
  devanagari: उग्रतारा जटाजूटा धारिणी जम्बुसत्रिभा ॥ २३॥ जाम्बूनदप्रभा जेया ज्येष्ठा श्रेष्ठा जलन्धरा
    । जाग्रती च सुषुप्तिश्च जयमण्डितमूर्धजा ॥ २४॥ जगत्प्रसूर्जगत्प्रीता प्रेतराजक्षयङ्करी । परा पुण्यप्रदा
    प्रेता त्रयीमूर्तिस्त्रयीतनुः ॥ २५॥ त्रयीतनुनिभा त्र्याश्रा त्र्यक्षरी तारिणीतनुः । तन्वी त्रिपुरमाता
    च त्रिनेत्रा त्रिपुरोत्तमा ॥ २६॥ त्रिवर्गफलदाता च तोतलाऽतुलविक्रमा । त्रिविक्रमप्रसूस्त्र्यन्ता त्रयी
    त्रिपुरभैरवी ॥ २७॥ श्रीदा श्रीधरपत्नी च श्रीः श्रीदानकवितृदा । श्रीदेवी च महालक्ष्मीः सिद्धलक्ष्मी
    सरस्वती ॥ २८॥ बाला बालकतुष्टा च बाला बाल्यैकसुन्दरी । बलीयसी भल्लहस्ता बालकेया बलन्धरा ॥ २९॥ बलितुष्टा
    बलिभुजा वरदा बालकेश्वरी । बन्धुप्रिया वान्धवेशी बगला वैदवेश्वरी ॥ ३०॥ ब्रह्मास्त्रविद्या जटिला ब्राह्मणी
    क्षत्रियीमया । मारा प्रलयकर्त्री च मातङ्गी मत्तमानसा ॥ ३१॥ मत्तमातङ्गगा मेध्या मुक्तिदा मेदिनी मतिः
    । राजमातङ्गिनीमूर्तिः रजोगुणविभूषणा ॥ ३२॥ रतिदा स्मृतिदा मथ्या मेनका मानवर्धिनी । सुन्दोपसुन्दमथनी
    स्वरूपा च तिलोत्तमा ॥ ३३॥ रम्भा रम्भा च रम्भोरू संरम्भा रम्भकारिणी । सदानन्दा सदातुष्टा सदारुष्टा
    सदागतिः ॥ ३४॥ चलकेशा चला चान्ता चामीकरनिभानना । च्युताऽच्युतप्रिया चोल्या चुल्ली चेटी च सत्कृतिः ॥
    ३५॥ चारुरूपा महाचारा जैनमार्गविरोधिनी । जननी जैनजननी जैनमार्गरसालसा ॥ ३६॥ रामिका रससन्तुष्टा रसा रामैकरोधिनी
    । रसोल्लासा रसासारसारिणी स्मरकारिणी ॥ ३७॥ राज्ञी राज्यप्रदा रौप्या राज्यदा भोगवर्धिनी । भगिनी भाग्यदा
    भोगा भगमाला भगात्मिका ॥ ३८॥ भीरुण्डा भयभर्ताभा भाविभा भीमरूपिणी । भयानकमुखाभीष्टफलदा फैनिलाप्रजा ॥
    ३९॥ पीताम्वरा पीतमुखी पतङ्गशतसन्निभा । पतङ्गगामिनी पीनकुचा कुष्ठक्षयङ्करी ॥ ४०॥ वीरात्मिकान्तिका चाद्या
    वागिला वसुसुन्दरी । वासवी वसुमाता च वसुधा वाङ्मयी वटुः ॥ ४१॥ वटुप्रिया वटुगता वाचाड्या वेशरूपिणी ।
    वाराही वैष्णवी यष्टिर्यक्षिणी यदुनन्दिनी ॥ ४२॥ यादवेशी यज्ञकरी याज्ञिकेष्टवरप्रदा । यज्ञप्रिया यशोदा
    च यशोमाला यशस्विनी ॥ ४३॥ यानवा यजुर्माता च यात्रा च योगिनी यवा । वामचारप्रिया वामावार्ता वाग्वादिनी
    वसा ॥ ४४॥ यज्ञवाराहवरदा वामदेवी वसुन्धरा । शारिका शशिलेखा च शरदिन्दुशतप्रभा ॥ ४५॥ मनोजवा मनोरूपा महोग्रवपुषी
    वधूः । शशिनेत्रा शिवा शैनी शिववामाङ्गचारीणी ॥ ४६॥ ॐ ह्रीं श्रीमम्बिकाऽऽत्मीया चादिदेवी मनोहरा । इष्टदात्रीश्वरी
    चेशा ईशानी चेश्वरप्रिया ॥ ४७॥ उमा चोग्रमुखी मोह्योरगभूषणभूषिता । उन्नता चोन्नतकुचा चोदयाचलसंश्रया
    ॥ ४८॥ उदितादित्यसदृशी च योगफलदायिनी । उरुतन्वी तनुस्तारा चोषा बाणक्षयङ्करी ॥ ४९॥ अनिरुद्धप्रिया चोषा
    वेला चोषरमण्डला । ऊष्मोष्मज्वालानयना ऋजुर्यक्षैकसुन्दरी ॥ ५०॥ रूपा ऋक्षध्वजेष्टा च ऊष्मिणी चोष्मसुन्दरी
    । लिप्ता लिविर्लिविकरी लीना लीलालयस्वरा ॥ ५१॥ एणाक्षी ऐंस्वरूपाक्षी ऐश्वर्याऽऽश्चर्यरूपिणी । ओङ्कारप्रभवा
    चौष्टा चौत्सवी चोदयी विधिः ॥ ५२॥ अम्वा सुरेश्वरी शुक्रा अःस्वरूपैकसुन्दरी । कालिका कनकप्रीता कान्तिदा
    कामिनी प्रिया ॥ ५३॥ कठोरवपुषी कीला कीलिता कुब्जरूपिणी । कुब्जिका कूवरी कुन्ता केवला कान्तिसुन्दरी
    ॥ ५४॥ कामारिवरदा कान्तिः कामेष्टा कीर्तिसुन्दरी । कारुकी कटुकी कीर्तिः कटुवाक्कटुचोषिणी ॥ ५५॥ कालान्तकजिता
    कालीकेश्वरी केशवप्रिया । क्रीता क्रीततपा क्रूरा क्रूरेशी क्रूरसुन्दरी ॥ ५६॥ क्रियावती क्रियाकर्त्री
    क्रिमिणी क्रमुकप्रिया । कूर्मेश्वरी कूर्मगतिः कूर्मिणी कूर्मरूपिणी ॥ ५७॥ काराकारैकनिगडा कारेशी कारमोचिनी
    । ककारवर्णमाला च ककाराक्षरसुन्दरी ॥ ५८॥ ऐं सौंः ख्रीं खेचरी खान्ता खशी खेटकरुपिणी । खगामिनी खगगतिः
    खगेशी खगसुन्दरी ॥ ५९॥ खगहस्ता खगाक्षी च खरूपा खेशसुन्दरी । खकाररूपिणी खस्थाखकारामृतसुन्दरी ॥ ६०॥ ॐ
    ह्रीं श्रीं गं गणेशानी गुणिनी गुणसुन्दरी । गुणिप्रिया गजपतिर्गजस्था गजगामिनी ॥ ६१॥ गरी गरिष्ठा गुटिका
    गानश्री गीतसुन्दरी । गया गीतप्रिया गम्या गुह्या गुह्यकसुन्दरी ॥ ६२॥ गिरिजा गिरिपूज्या च गिराशी गिरिसुन्दरी
    । ग्राहिणी गृहिणी गम्या गुहेशी गुहसुन्दरी ॥ ६३॥ गोर्गव्या गोमयी गान्ता गोकारी गोष्ठसुन्दरी । गजाननप्रिया
    ग्रीवा गोत्रेशी गोत्रसुन्दरी ॥ ६४॥ ग्रामिका ग्रहरूपा च ग्रहेशी ग्रहसुन्द्ररी । गुहप्रसूर्यहावासा गेहिनी
    गेहसुन्दरी ॥ ६५॥ गणका गणकेशानी गणेशा गणसुन्दरी । गणेशजननी गोपी गोपेशी गोपसुन्दरी ॥ ६६॥ गुह्यकेष्टप्रदा
    गेया गगनाकारसुन्दरी । ऐं सौंः घनाकृतिर्घोषेशी घौषसुन्दरी ॥ ६७॥ घर्घरा घर्घरीमूर्तिः घटिका घटसुन्दरी
    । घनसन्निभमूर्तिश्च घवर्णामृतसुन्दरी ॥ ६८॥ ॐ ह्रीं श्रीं ङें ङान्तवर्णाङ्का रोकरसुन्दरी । ॐ ह्रिं
    श्रीं चर्मवासा च चर्मिणी चर्मसुन्दरी ॥ ६९॥ चन्द्रिका चन्द्रवदना चन्द्रेशी चन्द्रसुन्दरी । चराचरजगत्स्रष्टा
    चारुणी चारुसुन्दरी ॥ ७०॥ चलाचलाच्युतकचाच्युतेश्यच्युतसुन्दरी । चुम्बिनी चुलिका चारा चुरेशी दैत्यसुन्दरी
    ॥ ७१॥ चलत्कनककेयूरा चलत्कनकसुन्दरी । ॐ ह्रीं श्रीं छिन्नमस्ता च छित्रास्या छित्रसुन्दरी ॥ ७२॥ छित्रिका
    छित्रमुकुटा छकाराक्षरसुन्दरी । ॐ जुं सः हौं जयाकारा जगतीधरसुन्दरी ॥ ७३॥ जगच्छा न्ता जगत्स्रष्टा जगतीसृष्टिसुन्दरी
    । जम्बुप्रिया जम्बुवेशी जपेशी जपसुन्दरी ॥ ७४॥ जीवदा जिववरदा जीवेशी जीवसुन्दरी । ॐ ह्रीं काङ्कारिणी
    श्रोतिर्लेखाकाङ्कारसुन्दरी ॥ ७५॥ झिल्ली धनुर्ज्या ज्याघाता झकारानन्दसुन्दरी । ॐ श्रीं ञानुतनुर्ञन्ता
    ञकाराकारसुन्दरी ॥ ७६॥ ॐ ऐं सौः टङ्कहस्ता च टङ्केशी टङ्कधारिणी । ॐ ठः ठः ठः स्वरूपाद्या ठकारत्रयसुन्दरी
    ॥ ७७॥ ॐ ह्रीं डिम्बाहिडिम्बा च हिडिका डिंवसुन्दरी । ॐ श्रीं ह्रां ढक्कूति ढक्का ढाकृतिर्ढक्कसुन्दरी
    ॥ ७८॥ ॐ ह्रीं णात्मप्रिया णान्ता णवर्णानन्दसुन्दरी । ॐ ऐं स्रीं तटिनीतीर्था तीर्थेशी तिथिसुन्दरी ॥
    ७९॥ तारप्रियान्तरी तुर्या तुर्येशी तुर्यसुन्दरी । त्रोटिका तुटिगन्धाढ्या त्रुटेशी त्रुटिसुन्दरी ॥
    ८०॥ तारापतिः कला दात्री तारा कान्तारसुन्दरी । त्रेतायुगेश्वरी त्र्यम्बा त्र्यम्बकेश्वरसुन्दरी ॥ ८१॥
    तलातलाश्रया तापी तकाराक्षरसुन्दरी । ऐं श्रीं स्थूलारविन्दाक्षी स्थूलजा जलसुन्दरी ॥ ८२॥ स्थन्डिला मण्डलाकारा
    थकारानन्दसुन्दरी । द्युतिर्देवी दयालुश्च दयारूपैकसुन्दरी ॥ ८३॥ दरी द्युतिमती दीप्ता दीप्तपावकसुन्दरी
    । दीप्तार्चिर्दीप्तशीखिनी दीपिता दीपसुन्दरी ॥ ८४॥ दमेश्वरी दमाकङ्क्षा दमदा दमसुन्दरी । दोलाक्रीडा
    दरी गुह्या दरिद्रा दारसुन्दरी ॥ ८५॥ दारिद्र्यशतकोटिघ्नी दारिद्राक्षरसुन्दरी । ॐ सौंः सौ धनदा धर्म्या
    धर्मेष्टा धर्मसुन्दरी ॥ ८६॥ धन्या धन्यजनस्तुत्या धर्मिणी धातृसुन्दरी । धनदैकप्रिया धात्री धरित्री
    धीरसुन्दरी ॥ ८७॥ धर्मकर्मप्रिया धीरा धीरवीरैकसुन्दरी । ओं क्रीं नारायणी नीवी नृसिंही सिंहसुन्दरी ॥
    ८८॥ नरनारायणीमूर्तिर्नर्मकर्मैकसुन्दरी । नर्मसाचिव्यकोल्लासा नादेशी नादसुन्दरी ॥ ८९॥ नटिनी नाटकोल्लासा
    नटनर्तनसुन्दरी । नर्मदा नलिनी नीला नलिनेक्षणसुन्दरी ॥ ९०॥ ॐ ऐं प्रीं परमा पूता पोतेशी पोतसुन्दरी ।
    पण्यदा पणया साक्षी पण्यश्री पण्यसुन्दरी ॥ ९१॥ परान्त्रिका परोल्लासा पीवरा पीनसुन्दरी । फट्कारा च वषट्कारा
    फलदा फलसुन्दरी ॥ ९२॥ फट् स्वरूपा फडाकारा फट् वर्णामृतसुन्दरी । ॐ ऐं बालेश्वरी बभ्रुर्बलर्द बलसुन्दरी
    ॥ ९३॥ बलिदानवयक्षेशी बलिभुक्यतिसुन्दरी । ॐ श्रीं भैं भद्रकाली च भद्रदा भद्रसुन्दरी ॥ ९४॥ ॐ ह्रीं भर्गशिखा
    भार्गी भार्गवेश्वरसुन्दरी । भर्ग्या भर्गाङ्गवसतिर्भर्गाख्याभर्गसुन्दरी ॥ ९५॥ भगलिङ्गामृतप्रीता भगलिङ्गैकसुन्दरी
    । भगानन्दा भगोल्लासा भगेशी भगसुन्दरी ॥ ९६॥ भगोत्तमा भगानन्दा भगानन्दैकसुन्दरी । भगलिङ्गामृतस्नाता
    भगविर्वैकसुन्दरी ॥ ९७॥ भगबिम्बा भगाद्या च भोगेशी भोगसुन्दरी । भोगापवर्गदा भाग्या भगस्था भीमसुन्दरी
    ॥ ९८॥ भीमनादा भीमरदा भीमहा भीमसुन्दरी । ॐ श्रीं मृत्तिका मृत्स्ना मार्जारी मृडसुन्दरी ॥ ९९॥ मीना मैनाकभगिनी
    माणिकेश्वरसुन्दरी । महोरस्का महीमध्या माधवी मधुसुन्दरी ॥ १००॥ मधुमत्ता महाज्योतिर्मेरुस्था मेरुसुन्दरी
    । मधुक्षीबा मदारक्ता मद्देशी मधुसुन्दरी ॥ १०१॥ ॐ श्रीं योगप्रिया योग्या योगेशी योगसुन्दरी । ॐ यज्ञदक्षिणा
    वाज्या ॐ यक्षैश्वर्यसुन्दरी ॥ १०२॥ ॐ यक्षवेगनिलया यक्षवेलैकसुन्दरी । यमेष्टा यमदा यात्रा यमैश्वर्यादिसुन्दरी
    ॥ १०३॥ यमिनी यामिनी याम्या यामवेलैकसुन्दरी । योगियोगफला यादोनाथेष्टा नाथसुन्दरी ॥ १०४॥ याना यानरसा
    यष्टिर्याकारोल्लाससुन्दरी । ॐ रां रसातलस्था च रसदा राससुन्दरी ॥ १०५॥ रसस्वाता रैवतकी रेवा रैवतसुन्दरी
    । रविकोटिप्रभा दीप्ती रविजा रविसुन्दरी ॥ १०६॥ राक्षसी रक्षसां रक्ता राणी राक्षससुन्दरी । रजोवती राणसिकी
    राका राक्षरसुन्दरी ॥ १०७॥ ॐ ह्रीं श्रीं लम्बकेशा लम्बोष्ठी लम्बसुन्दरी । लम्बोदरप्रिया लम्भ्या लञ्चा
    लाङ्गूलसुन्दरी ॥ १०८॥ ललद्दंसा ललन्नेत्रा लालिता लल्लिसुन्दरी । लोहिताक्षी ललन्मूर्तिर्लोहिता लोहितेश्वरी
    ॥ १०९॥ लोहिताम्बरभूषाढ्या लकारामृतसुन्दरी । ॐ वां वनेचरप्रिया वेदिका वेदसुन्दरी ॥ ११०॥ वलिता वालिजननी
    वालुका वालिसुन्दरी । वरप्रिया वरोल्लासा वारिणी वारिसुन्दरी ॥ १११॥ वरज्येष्ठा कानिष्ठा च वालुप्ता लुप्तसुन्दरी
    । व्योमगा वारिधिसुता वराकानन्दसुन्दरी ॥ ११२॥ ॐ श्रीं शशिसहस्राभा शीतङ्गा शङ्करप्रिया । शौत्यप्रिया
    शतानन्दा शतगा शीतसुन्दरी ॥ ११३॥ शतयज्ञैकवरदा शतयक्षैकसुन्दरी । शतक्रतुप्रिया शर्मदायिनी शक्रसुन्दरी
    ॥ ११४॥ शिवप्रिया शूलहस्ता शुक्रेशी शुक्रसुन्दरी । शोकहाऽशोकमालाढ्या शुक्ला शोकैकसुन्दरी ॥ ११५॥ शुक्लवासा
    शुक्लमुखी शकाराक्षरसुन्दरी । ॐ श्रीं षडक्षरा षट्षड्वर्णा खावर्णसुन्दरी ॥ ११६॥ षोडशी षोडशकला षोडशार्णार्णसुन्दरी
    । ॐ ऐं सौंः सात्त्विकी सीता सरला सीरसुन्दरी ॥ ११७॥ सुक्माला सनया सौम्या सौम्येशी सौम्यसुन्दरी । सुस्वरा
    सुनकाध्यक्षा सनकाध्यर्षिसुन्दरी ॥ ११८॥ समस्तनरकत्राता समस्तनरसुन्दरी । समस्तभयहा देवी समस्ताभयसुन्दरी
    ॥ ११९॥ समस्तजयदा ज्वाला ज्वालामण्डलसुन्दरी । सौंः सौंः सौंः सौंः स्वमन्त्रास्व सौंःमन्त्राक्षरसुन्दरी
    ॥ १२०॥ ॐ ह्रीं हरिहरेशानी हरेशी हरसुन्दरी । हरपत्नी हविर्ज्वाला हव्याढ्या हरसुन्दरी ॥ १२१॥ होतृसेव्या
    हकाराद्या ह्रीङ्काराक्षरसुन्दरी । ॐ क्ष्मां क्ष्मायती क्षीवा क्षान्ता क्षीरार्णवस्थिता ॥ १२२॥ क्षिरांवुधिप्रियाक्षेष्टा
    चाक्षेशी क्षीरसुन्दरी । क्षीराब्धितनया क्षान्ता क्षकारामृतसुन्दरी ॥ १२३॥ अकारादिक्षकरान्ता लक्षतत्त्वादिसुन्दरी
    । ब्राह्मी च वैष्णवी चैशी ब्रह्मेष्टा ब्रह्मसुन्दरी ॥ १२४॥ नवतत्त्वप्रकाशाढ्या नूतना विष्णुसुन्दरी
    । नवपीठनिवासस्था शिवदा शिवसुन्दरी ॥ १२५॥ नवेन्द्रियैकनिलया शिवदा शिवसुन्दरी । नवगाथारसाकाङ्क्षा गाथा
    गगनसुन्दरी ॥ १२६॥ नवरत्नविभूषाढ्या ब्रह्मा ब्रह्माण्डसुन्दरी । नवद्वीपैकवसतिः पीता पातालसुन्दरी ॥
    १२७॥ नवपन्नगहाराढ्या प्रान्ता पन्नगसुन्दरी । नवमातृक्रमोल्लासा नाव्या नक्षत्रसुन्दरी ॥ १२८॥ नवपर्वतप्रस्थस्था
    नवमन्त्राङ्कसुन्दरी । अकचादि ऋतोन्नद्धपयशाक्षरकर्मिणी ॥ १२९॥ तलातलादिपातालचारीणी सर्वसुन्दरी । ॐ ह्रीं
    श्रीं ऐं सौंः क्लीं देवी फट् स्वाहेन्द्राक्षिणी परा ॥ १३०॥ फलश्रुतिः । इतीन्द्राक्ष्याः परं नाम्नां
    सहस्रं शिवभाषितम् । सर्वमन्त्रैकनिलयं सुन्दरीति मनुप्रियम् ॥ १३१॥ नवतत्त्वमयं दिव्यं ब्रह्माण्डान्तं
    सुधामयम् । भोगापवर्गदं पुण्यं सर्वतीर्थेकसाधनम् ॥ १३२॥ बलदं सर्वदा शान्तं ग्रहाणां शान्तिकृत्परम्
    । सर्वरोगभयहरं सर्वदेवप्रियं महत् ॥ १३३॥ भूतप्रेतपिशाचादियक्षराक्षसभीतिषु । पठेद्वा पाठयेन्नाम्नां
    सहस्रं मन्त्रगर्भिकम् ॥ १३४॥ दूरादेव पलायन्ते खगेशादिव पन्नगाः । कुष्ठादयो महारोगाः शममेष्यन्त्यसंशयम्
    ॥ १३५॥ साधकस्य सदा पुण्यवर्धनं धनवर्धनम् । सर्वकालैकफलदं सर्वमन्त्रैकसाधनम् ॥ १३६॥ भूर्जत्वचि लिखेन्मन्त्रं
    सूर्यवारे च साधकः । गोरोचनैः कुङ्कुमेन धारयेत्सव्यके भुजे ॥ १३७॥ इन्द्राद्या निर्जराः सर्वे रावणाद्या
    निशाचराः । सम्युगे च जित्वा धृत्वा नाम्नां सहस्रमुत्तमम् ॥ १३८॥ रामभद्रेण सहसा विष्णुना दैत्यपुङ्गवाः
    । भौमेऽष्टम्यां श्मशाने च पठेन्नाम्नां सहस्रकम् ॥ १३९॥ जपेदष्टोत्तरशतं देव्याः पर्षद्वरो भवेत् । अमावस्यां
    निशीथे च रवौ नाम्नां सहस्रकम् ॥ १४०॥ पठित्वा पुलिने नद्याः बृहस्पतिसमो भवेत् । स्तम्भयेद्रिपुसैन्यादिदस्युवादिमुखानि
    च ॥ १४१॥ मोहयेत्परमेशानं वशयेद्भुवनत्रयम् । मारयेद्रियुसङ्घातं साधयेन्मन्त्रसञ्चयम् ॥ १४२॥ आकर्षयेदश्मरस
    उच्चाटयति वैरिणः । पठनाच्छ्रवणात्सत्यं धारणात्साधकोत्तमः ॥ १४३॥ इहलोके सुखं भुक्त्वा परत्र त्रिदिवं
    व्रजेत् । त्रिसन्ध्यं यः पठेद्भौमे त्रिस्त्रिवारं शुचिव्रतः ॥ १४४॥ भूमिशायी सुधीर्देवीं दर्शयेद्वरदायिनीम्
    । रणे राजभये कुञ्जे घोरदावाग्निभीतिषु ॥ १४५॥ पयोधौ पोतवायौ वा सङ्कटे राजसन्निधौ । चौरभीतिषु दुर्गेषु
    सिंहश्वापदभीतिषु ॥ १४६॥ पठेन्नाम्नां सहस्रन्तु साधको मुच्यते भयात् । प्रभावमस्या नाम्नां तु सहस्रस्यैह
    वर्णितुम् ॥ १४७॥ न च शक्रोमि शक्तोऽपि शेषा हि विफलं पदम् । अलं विस्तरमात्रेण यः पठेत्साधकोत्तमः ॥
    १४८॥ विचरेद्भुवनेष्वेको यथाहं भैरवोत्तमः । इति नाम्नां सहस्रं तु सर्वमन्त्रैकरूपिणम् ॥ १४९॥ इन्द्राक्ष्यः
    सर्वसर्वस्वं रहस्यं स्वर्गवासिनाम् । सर्वार्थसाधनं लोके सर्वतन्त्रागमार्णवम् ॥ १५०॥ गुह्यं गुप्तं
    सदा गोप्यं गोप्तव्यं पशुसङ्कटे । गृहिणां योगदं नित्यं योगिनां मुक्तिदं सदा ॥ १५१॥ इन्द्राक्ष्या वज्रहस्ताया
    नाम्नां सहस्रकं परम् । गुह्यातिगुह्यगोप्तव्यं गोपनीयं स्वयोनिवत् ॥ १५२॥ इति श्रीरुद्रयामले तन्त्रे
    इन्द्राक्षीनामसहस्रं समाप्तम् ॥
