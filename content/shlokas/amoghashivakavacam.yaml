id: amoghashivakavacam
category: stotram
name:
  english: amoghashivakavacam
  devanagari: अमोघशिवकवचम्
content:
  english: '|vam kilakaya namah nabhau|shrim hrim klimiti bijaya namah guhye|viniyogaya namah sarvamge|
    atha karanyasah om namo bhagavate jvalajvalamaline om hrim ram sarvashaktidhamne ishanatmane adgushthabhyam
    namah| om namo bhagavate jvalajvalamaline om nam rim nityatriptidhamne tatpurushatmane tarjanibhyam
    svaha| om namo bhagavate jvalajvalamaline om mam rum anadishaktidhamne aghoratmane madhyamabhyam vashata|
    om namo bhagavate jvalajvalamaline om shim raim svatamtrashaktidhamne vamadevatmane anamikabhyam huma|
    om namo bhagavate jvalajvalamaline om vam raum aluptashaktidhamne sadyojatatmane kanishthikabhyam
    vaushata| om namo bhagavate jvalajvalamaline om yam rah anadishaktidhamne sarvatmane karatalakaraprishthabhyam
    phata| hridayadyadgnyasah om namo bhagavate jvalajvalamaline om hrim ram sarvashaktidhamne ishanatmane
    hridayaya namah| om namo bhagavate jvalajvalamaline om nam rim nityatriptidhamne tatpurushatmane shirase
    svaha| om namo bhagavate jvalajvalamaline om mam rum anadishaktidhamne aghoratmane shikhayai vashata|
    om namo bhagavate jvalajvalamaline om shim raim svatamtrashaktidhamne vamadevatmane kavacaya huma|
    om namo bhagavate jvalajvalamaline om vam raum aluptashaktidhamne sadyojatatmane netratrayaya vaushata|
    om namo bhagavate jvalajvalamaline om yam rah anadishaktidhamne sarvatmane astraya phata| atha dhyanam'
  devanagari: ।वं कीलकाय नमः नाभौ।श्रीं ह्रीं क्लीमीती बीजाय नमः गुह्ये।विनियोगाय नमः सर्वांगे। अथ करन्यासः
    ॐ नमो भगवते ज्वलज्वालामालीने ॐ ह्रीं रां सर्वशक्तीधाम्ने ईशानात्मने अड्गुष्ठाभ्यां नमः। ॐ नमो भगवते
    ज्वलज्वालामालीने ॐ नं रीं नित्यतृप्तीधाम्ने तत्पुरुषात्मने तर्जनीभ्यां स्वाहा। ॐ नमो भगवते ज्वलज्वालामालीने
    ॐ मं रूं अनादिशक्तीधाम्ने अघोरात्मने मध्यमाभ्यां वषट। ॐ नमो भगवते ज्वलज्वालामालीने ॐ शिं रैं स्वतंत्रशक्तीधाम्ने
    वामदेवात्मने अनामिकाभ्यां हुम। ॐ नमो भगवते ज्वलज्वालामालीने ॐ वां रौं अलुप्तशक्तीधाम्ने सद्योजातात्मने
    कनिष्ठिकाभ्यां वौषट। ॐ नमो भगवते ज्वलज्वालामालीने ॐ यं रः अनादिशक्तीधाम्ने सर्वात्मने करतलकरपृष्ठाभ्यां
    फट। हृदयाद्यड्ग्न्यासः ॐ नमो भगवते ज्वलज्वालामालीने ॐ ह्रीं रां सर्वशक्तीधाम्ने ईशानात्मने हृदयाय
    नमः। ॐ नमो भगवते ज्वलज्वालामालीने ॐ नं रीं नित्यतृप्तीधाम्ने तत्पुरुषात्मने शिरसे स्वाहा। ॐ नमो भगवते
    ज्वलज्वालामालीने ॐ मं रूं अनादिशक्तीधाम्ने अघोरात्मने शिखायै वषट। ॐ नमो भगवते ज्वलज्वालामालीने ॐ शिं
    रैं स्वतंत्रशक्तीधाम्ने वामदेवात्मने कवचाय हुम। ॐ नमो भगवते ज्वलज्वालामालीने ॐ वां रौं अलुप्तशक्तीधाम्ने
    सद्योजातात्मने नेत्रत्रयाय वौषट। ॐ नमो भगवते ज्वलज्वालामालीने ॐ यं रः अनादिशक्तीधाम्ने सर्वात्मने
    अस्त्राय फट। अथ ध्यानम्
