id: premanandastotram
category: stotram
name:
  english: premanandastotram
  devanagari: प्रेमानन्दस्तोत्रम्
content:
  english: sushobhanam premanandamaham vande sadhakabhishtasampradam || 4|| yasya shravanamatrena manaso
    malamanjasa suvidagdha maho kritva naro nirmalatam vrajet | taddhyana kirtanenatha sadyo dhanyo bhavamyaham
    tatkripaikaprasadena mukti saukhyam tyajamyaham || 5|| iti svamigunatitanandaviracitam
  devanagari: सुशोभनं प्रेमानन्दमहं वन्दे साधकाभीष्टसम्प्रदम् ॥ ४॥ यस्य श्रवणमात्रेण मनसो मलमञ्जसा सुविदग्ध
    महो कृत्वा नरो निर्मलतां व्रजेत् । तद्ध्यान कीर्तनेनाथ सद्यो धन्यो भवाम्यहं तत्कृपैकप्रसादेन मुक्ति
    सौख्यं त्यजाम्यहम् ॥ ५॥ इति स्वामिगुणातीतानन्दविरचितं
meaning: {}
