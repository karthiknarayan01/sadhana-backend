id: bhaktishatakam
category: shataka
name:
  english: bhaktishatakam
  devanagari: भक्तिशतकम्
content:
  english: yadibadham | kuru mama karunam disho na jane guru tadavekshya ca tiryagadiduhkham || 52|| tadupari
    paricintya vriddhakale karacaranadidrigadiparavashyam | agatikamativepate mano me jina kimaham karavai
    prabho prasida || 53|| shravanapathagate'pyadrishtapurve sukhakriti vastuni yattanomi trishnam | aviratamata
    eva shantibije tvayi valate ramate mamatra cetah || 54|| savipadi ramate na me mano'tah suranarasharmani
    purvapurvabhukte | anudinamanubhuya sharkarayamapi viratim kurute hi drishtadoshah || 55|| karatalagatamapyamulyacintamanimavadhirayatingitena
    murkhah | kathamahamapahaya buddharatnam jagati dhani gunavamshca panditashca || 56|| sa bhavati matiman
    sa nakulinah sa ca gunavan sa ca kirtiman sa shurah | sa jagati mahitah sukhi sa eva tvayi jina yasya
    sunishcalasti bhaktih || 57|| api sakalamadhitamatra tena shrutamapi sarvamanushthitam ca tena | api
    jitamajitena tena vishvam tvayi jina yasya sunishcalasti bhaktih || 58|| tyajati nijaparamparadarenetarasamayasya
    jano na drishta drishtim | asuharamapi gauravena maturna khalu shishurvishamodakam tu muncet || 59||
    kavivaramahamasmi panditaste jina na jahami kathannu kurgrihitam | nudati hi tamasantatim pravrittam
    mihiramaricisahayini sudrishtih || 60|| sugatapadaparanmukhasya pumsah kimu tapasa yashasa ca kim
    kimanyaih | sugatapadaparannukhasya pumsah kimu tapasa yashasa ca kim kimanyaih || 61|| sugatapadi
    na bhaktirasti yeshamajananireva mahitale'stu tesham | kathitamiha kritagasam naranam nirayagatirniyatam
    na canyato yat || 62|| viditasakalashastramunnatanam kulabhavamuttamarupayauvanadyam | jina bhavadanupasakam
    nripasam tyajatu mano mala nicavattu jatya || 63|| parihritamadamanamatsaradih sakarunashilasamadhiman
    viveki | tava padadridhabhaktirantyajo'pi pratibhavamastu narottamah sakha me || 64|| vihitajinapadarcanasya
    bhakturdashadivasanapi jivitam prashastam | na tu niyutasahasrakalpakotirakritamunindrapadabjapujanasya
    || 65|| sa bhavati surasundarisakho'nyaih kritamabhinandati varcanam ca bhaktya | tridashanaraguro
    tvadiyapujamagatitaya yadi kartumakshamah syat || 66|| suruciramaticitracitrarupam nayanapatham nayatiha
    yastavarcam | rahayati purusham tamapyudaram ciratarasancitadushkritam kavindra || 67|| manikanakashiladinirmitam
    yah pranamati te pratimam tayoshca tulyam | phalamiha manasashca samprasadadanuparatam jina yo'grato
    namet tvam || 68|| sakridapi tava padapadmapuja vanakusumairapi yah karoti dhiman | avanatasurasanghamaulimalojjvalamamalam
    shrayate tamadhipatyam || 69|| yadi bhavati sarupamekacittakshanasharanodbhavapunyavrindamuccaih |
    ganasharana samantabhadrasadho'khilanabhaso'pyatiricyate tada tat || 70|| tava gunakathane tu yah
    prasannastamanuvishanti mune gunastvadiyah | udayati shashini prasannamindupalamiva tatkiranavalitusharah
    || 71|| sakridapi samadayi deva kincid bhavaratimutsrijata janena tubhyam | sugata tadakhilan lunati
    dhara vadasiriva drumamashravadidoshan || 72|| kritamiha sukritam mrishadrisha yajjanayati tat kila
    tasya durvipakam | kshitisalilarasam svatiktabhavam nayati yatha picumardabijamuptam || 73|| tava
    padanaline nipatya bhuyo nipatati naiva caturshvapayakeshu | nahi kushalakaro narah kadapi kvacidapi
    durgatimeti natha kashcit || 74|| iti bhavadupadeshato viditva tava padapankajapujane rato'smi | dridhayatu
    bhagavan yuge yuge me kumatimudasya bhave bhave'ryabhaktim || 75|| sthiramapi bhagavan kshanam tavoktau
    karacaranani drigadi vairivargah | vyathayati hridayam baladvicalya tvamidamanathamanisha pahi pahi
    || 76|| yadi nayanamayam vashe vidhatum yatati tada dravati shravo yada tat | tadanu rasana
  devanagari: यादिबाधाम् । कुरु मम करुणं दिशो न जाने गुरु तदवेक्ष्य च तिर्यगादिदुःखम् ॥ ५२॥ तदुपरि परिचिन्त्य
    वृद्धकाले करचरणादिदृगादिपारवश्यम् । अगतिकमतिवेपते मनो मे जिन किमहं करवै प्रभो प्रसीद ॥ ५३॥ श्रवणपथगतेऽप्यदृष्टपूर्वे
    सुखकृति वस्तुनि यत्तनोमि तृष्णाम् । अविरतमत एव शान्तिबीजे त्वयि वलते रमते ममात्र चेतः ॥ ५४॥ सविपदि
    रमते न मे मनोऽतः सुरनरशर्मणि पूर्वपूर्वभुक्ते । अनुदिनमनुभूय शर्करायामपि विरतिं कुरुते हि दृष्टदोषः
    ॥ ५५॥ करतलगतमप्यमूल्यचिन्तामणिमवधीरयतीङ्गितेन मूर्खः । कथमहमपहाय बुद्धरत्नं जगति धनी गुणवांश्च पण्डितश्च
    ॥ ५६॥ स भवति मतिमान् स नाकुलीनः स च गुणवान् स च कीर्तिमान् स शूरः । स जगति महितः सुखी स एव त्वयि जिन
    यस्य सुनिश्चलास्ति भक्तिः ॥ ५७॥ अपि सकलमधीतमत्र तेन श्रुतमपि सर्वमनुष्ठितं च तेन । अपि जितमजितेन तेन
    विश्वं त्वयि जिन यस्य सुनिश्चलास्ति भक्तिः ॥ ५८॥ त्यजति निजपरम्परादरेणेतरसमयस्य जनो न दृष्ट दृष्टिम्
    । असुहरमपि गौरवेण मातुर्न खलु शिशुर्विषमोदकं तु मुञ्चेत् ॥ ५९॥ कविवरमहमस्मि पण्डितस्ते जिन न जहामि
    कथन्नु कुर्गृहीतम् । नुदति हि तमसन्ततिं प्रवृत्तां मिहिरमरीचिसहायिनी सुदृष्टिः ॥ ६०॥ सुगतपदपराङ्मुखस्य
    पुंसः किमु तपसा यशसा च किं किमन्यैः । सुगतपदपराङ्नुखस्य पुंसः किमु तपसा यशसा च किं किमन्यैः ॥ ६१॥
    सुगतपदि न भक्तिरस्ति येषामजननिरेव महीतलेऽस्तु तेषाम् । कथितमिह कृतागसां नराणां निरयगतिर्नियतं न चान्यतो
    यत् ॥ ६२॥ विदितसकलशास्त्रमुन्नतानां कुलभवमुत्तमरूपयौवनाद्यम् । जिन भवदनुपासकं नृपासं त्यजतु मनो मल
    नीचवत्तु जात्या ॥ ६३॥ परिहृतमदमानमत्सरादिः सकरुणशीलसमाधिमान् विवेकी । तव पददृढभक्तिरन्त्यजोऽपि प्रतिभवमस्तु
    नरोत्तमः सखा मे ॥ ६४॥ विहितजिनपदार्चनस्य भक्तुर्दशदिवसानपि जीवितं प्रशस्तम् । न तु नियुतसहस्रकल्पकोटीरकृतमुनीन्द्रपदाब्जपूजनस्य
    ॥ ६५॥ स भवति सुरसुन्दरीसखोऽन्यैः कृतमभिनन्दति वार्चनं च भक्त्या । त्रिदशनरगुरो त्वदीयपूजामगतितया यदि
    कर्तुमक्षमः स्यात् ॥ ६६॥ सुरुचिरमतिचित्रचित्ररूपं नयनपथं नयतीह यस्तवार्चाम् । रहयति पुरुषं तमप्युदारं
    चिरतरसञ्चितदुष्कृतं कवीन्द्र ॥ ६७॥ मणिकनकशिलादिनिर्मितां यः प्रणमति ते प्रतिमां तयोश्च तुल्यम् । फलमिह
    मनसश्च संप्रसादादनुपरतं जिन योऽग्रतो नमेत् त्वाम् ॥ ६८॥ सकृदपि तव पादपद्मपूजा वनकुसुमैरपि यः करोति
    धीमान् । अवनतसुरसङ्घमौलिमालोज्ज्वलममलं श्रयते तमाधिपत्यम् ॥ ६९॥ यदि भवति सरूपमेकचित्तक्षणशरणोद्भवपुण्यवृन्दमुच्चैः
    । गणशरण समन्तभद्रसाधोऽखिलनभसोऽप्यतिरिच्यते तदा तत् ॥ ७०॥ तव गुणकथने तु यः प्रसन्नस्तमनुविशन्ति मुने
    गुणास्त्वदीयाः । उदयति शशिनि प्रसन्नमिन्दूपलमिव तत्किरणावलीतुषारः ॥ ७१॥ सकृदपि समदायि देव किञ्चिद्
    भवरतिमुत्सृजता जनेन तुभ्यम् । सुगत तदखिलान् लुनाति धारा वदसिरिव द्रुममाश्रवादिदोषान् ॥ ७२॥ कृतमिह
    सुकृतं मृषादृशा यज्जनयति तत् किल तस्य दुर्विपाकम् । क्षितिसलिलरसं स्वतिक्तभावं नयति यथा पिचुमर्दबीजमुप्तम्
    ॥ ७३॥ तव पदनलिने निपत्य भूयो निपतति नैव चतुर्ष्वपायकेषु । नहि कुशलकरो नरः कदापि क्वचिदपि दुर्गतिमेति
    नाथ कश्चित् ॥ ७४॥ इति भवदुपदेशतो विदित्वा तव पदपङ्कजपूजने रतोऽस्मि । दृढयतु भगवान् युगे युगे मे कुमतिमुदस्य
    भवे भवेऽर्यभक्तिम् ॥ ७५॥ स्थिरमपि भगवन् क्षणं तवोक्तौ करचरणानि दृगादि वैरिवर्गः । व्यथयति हृदयं बलाद्विचाल्य
    त्वमिदमनाथमनीश पाहि पाहि ॥ ७६॥ यदि नयनमयं वशे विधातुं यतति तदा द्रवति श्रवो यदा तत् । तदनु रसन
