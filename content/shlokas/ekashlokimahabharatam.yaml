id: ekashlokimahabharatam
category: ekashloki
name:
  english: ekashlokimahabharatam
  devanagari: एकश्लोकिमहाभारतम्
content:
  english: ekashloki mahabharatam adau pandavadhartarashtrajananam lakshagrihe dahanam dyutam shriharanam
    vane viharanam matsyalaye vartanam | lilagograhanam rane viharanam sandhikriyajrimbhanam pashcadbhishmasuyodhanadinidhanam
    hyetanmahabharatam || || ekashloki mahabharatam sampurnam ||
  devanagari: एकश्लोकि महाभारतम् आदौ पाण्डवधार्तराष्ट्रजननं लाक्षागृहे दाहनं द्यूतं श्रीहरणं वने विहरणं
    मत्स्यालये वर्तनम् । लीलागोग्रहणं रणे विहरणं सन्धिक्रियाजृम्भणं पश्चाद्भीष्मसुयोधनादिनिधनं ह्येतन्महाभारतम्
    ॥ ॥ एकश्लोकि महाभारतं सम्पूर्णम् ॥
meaning: {}
