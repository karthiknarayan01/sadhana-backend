    प॒शुषु॒ स्राम॒स्तं वाँ॑ मे॒ तेनाव॑ यज॒ इत्या॑है॒ताव॑ती॒र्वा आप॒ ओष॑धयो॒ वन॒स्पत॑यः प्र॒जाः प॒शव॑ उपजीव॒नीया॒स्ता
    ए॒वास्मै॑ वरुणपा॒शा स प्र॑त्न॒वन्नि काव्येन्द्रं॑ न्नः॑ सोम वि॒श्वतो॒ रक्षा॑ राजन्नघाय॒तः । न रि॑ष्ये॒
    ॥ या ते॒ धामा॑नि दि॒वि या पृ॑थि॒व्यां याँ पर्व॑ते॒ष्वोष॑धीष्व॒फ्सु ॥ तेभि॑र्नो॒ विश्वै थ्सोम॒ प्रति॑
    ह॒व्या गृ॑भाय ॥ अग्नी॑षोमा॒ सवे॑दसा॒ सहू॑ती वनत॒ न्दे॑व॒त्रा ब॑भूवथुः ॥ यु॒व ए॒तानि॑ दि॒वि रो॑च॒नान्य॒ग्निश्च॑
    मे॒तानि॑ दि॒वि रो॑च॒नान्य॒ग्निश्च॑ सोम॒ सक्र॑तू अधत्तम् ॥ यु॒वग्ं सिन्धूग्ं॑ र॒भिश॑स्तेरव॒द्या ङ्गृभी॒तान्
    ॥ अग्नी॑षोमावि॒मग्ं सु मे॑ शृणु॒तं म् । प्रति॑ सू॒क्तानि॑ हर्यत॒ न्दि॒वो मा॑त॒रिश्वा॑ जभा॒रा म्परि॑
    श्ये॒नो अद्रेः । अग्नी॑षोमा॒ ब्रह्म॑णा वावृधा॒नोरुं यँ॒ज्ञाय॑ चक्रथुरु लो॒कम् ॥ अग्नी॑षोमा ह॒विषः॒
    प्रस्थि॑तस्य वी॒तग्ं म् । सु॒शर्मा॑णा॒ स्वव॑सा॒ हि भू॒तमथा॑ धत्तं॒ न्त्वा ग॒णप॑तिग्ं हवामहे क॒वि मु॑प॒मश्र॑वस्तमम्
    । ज्ये॒ष्ठ॒राज॒ म्ब्रह्मणस्पत॒ आ नः॑ शृ॒ण्वन्नू॒तिभिः॑ सीद॒ साद॑नम् । स इज्जने॑न॒ स वि॒शा स जन्म॑ना॒
    स पु॒त्रैर्वाज॑ म्भरते॒ धना॒ नृभिः॑ । दे॒वानां॒ श्र॒द्धाम॑ना ह॒विषा॒ ब्रह्म॑ण॒स्पति म् ॥ स सु॒ष्टुभा॒
    स ऋक्व॑ता ग॒णेन॑ व॒लग्ं रु॑रोज फलि॒गग्ं रवे॑ण । बृह॒स्पति॑ रु॒स्रिया॑ हव्य॒सूदः॒ कनि॑क्रद॒द् वाव॑शती॒रुदा॑जत्
    ॥ मरु॑तो॒ यद्ध॑ वो दि॒वो श्शर्म॑ ॥ अ॒र्य॒मा ऽऽया॑ति वृष॒भस्तुवि॑ष्मा हन्न्॑ । स॒ह॒स्रा॒क्षो गो द्वज्र॑बाहुर॒स्मासु॑
    दे॒वो द्रवि॑ण न्ब॒हवो॑ देव॒यानाः॒ पन्था॑नो न्दि॒व आ॒चर॑न्ति । तेभि॑र्नो देव॒ महि॒ शर्म॑ यच्छ॒ श न्न॑
    एधि द्वि॒पदे॒ श ञ्चतु॑ष्पदे ॥ बु॒द्ध्नादग्र॒ र्गृणा॒नो वि पर्व॑तस्य दृग्ंहि॒तान्यै॑रत् । रु॒ज दग्रे॑ण॒
    वि मि॑माय॒ मानै॒ र्वज्रे॑ण॒ खान्य॑तृण त्प॒थिभि॑ र्दीर्घया॒थै स्सोम॑स्य॒ ता मद॒ इन्द्र॑श्चकार । ॥ ॥
    प्र यो ज॒ज्ञे वि॒द्वाग्ं अ॒स्य बन्धुं॒ विँश्वा॑नि दे॒वो जनि॑मा विवक्ति । ब्रह्म॒ ब्रह्म॑ण॒ उज्ज॑भार॒
    मद्ध्या न्नी॒चादु॒च्चा स्व॒धया॒ ऽभि प्रत॑स्थौ ॥ म॒हा न्म॒ही अ॑स्तभाय॒द्वि जा॒तो द्याग्ं सद्म॒ पार्थि॑व
    ञ्च॒ रजः॑ । स बु॒द्ध्नादा म्बृह॒स्पति॑ र्दे॒वता॒यस्य॑ स॒म्राट् ॥ बु॒द्ध्नाद्यो अग्र॑म॒भ्यर्त्योज॑सा॒
    बृह॒स्पति॒मा वि॑वासन्ति दे॒वाः । भि॒नद्व॒लं विँ पुरो॑ दर्दरीति॒ कनि॑क्रद॒ स्सोम॑स्य॒ ता मद॒ इन्द्र॑श्चकार
    प्र॒जाप॑ते॒स्त्रय॑स्त्रिग्ंशत् प्र॒जाप॑ति र्दे॒वेभ्यो॒ प्र॒जाप॑ति॒ र्वरु॑णाय॒ या वा॑मिन्द्रा वरुणा॒
    ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्द्वितीयकाण्डे तृतीयः प्रश्न
