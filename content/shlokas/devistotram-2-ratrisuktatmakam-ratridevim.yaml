id: devistotram-2-ratrisuktatmakam-ratridevim
category: sukta
name:
  english: devistotram 2 (ratrisuktatmakam ratridevim)
  devanagari: देवीस्तोत्रम् २ (रात्रिसूक्तात्मकम् रात्रिदेवीं)
content:
  english: ratrisuktatmakam devistotram shriganeshaya namah || ratridevim prapadye'ham sharanagatavatsalam
    | karalavadanam krishnam dushtagrahavinashinim || 1|| namami khadgahastam tam khetahastam bhayanakam
    | varadabhayahastam ca bhaktalokabhayapaham || 2|| shulahastam shankhacakragadacapeshudharinim | caturbhujamashtabhujam
    dvibhujamarimardinim || 3|| ashtadashabhujam lakshmim dashahastam sarasvatim | sarvasampatpradatrim
    ca sarvavidyapradayinim || 4|| sahasrabahucaranam sahasramukhalocanam | sahasramukutopetam sahasracaranambujam
    || 5|| padmayonimukhabjastham vishnuvakshahsthalasthitam | shivankanilayam gaurim vande murtitrayatmikam
    || 6|| arbhatya vaishnavi cogra kulani vibudhadvisham | ya nirdahati raktakshi tam vande simhavahanam
    || 7|| madhukaitabhasamharam mahishasuramardanam | ya'karonnaumi durgam tam vadham shumbhanishumbhayoh
    || 8|| indradisarvadevanam suryadijyotishamapi | sarvashaktisvarupa ya ratrim tam pranamamyaham ||
    9|| ratrisuktam japedratrau trivaram ca dine dine | bhutapretapishacadicorasarpadinashanam || 10||
    iti shriratrisuktatmakadevistotram sampurnam ||
  devanagari: रात्रिसूक्तात्मकं देवीस्तोत्रम् श्रीगणेशाय नमः ॥ रात्रिदेवीं प्रपद्येऽहं शरणागतवत्सलाम्
    । करालवदनां कृष्णां दुष्टग्रहविनाशिनीम् ॥ १॥ नमामि खड्गहस्तां तां खेटहस्तां भयानकाम् । वरदाभयहस्तां
    च भक्तलोकभयापहाम् ॥ २॥ शूलहस्तां शङ्खचक्रगदाचापेषुधारिणीम् । चतुर्भुजामष्टभुजां द्विभुजामरिमर्दिनीम्
    ॥ ३॥ अष्टादशभुजां लक्ष्मीं दशहस्तां सरस्वतीम् । सर्वसम्पत्प्रदात्रीं च सर्वविद्याप्रदायिनीम् ॥ ४॥
    सहस्रबाहुचरणां सहस्रमुखलोचनाम् । सहस्रमुकुटोपेतां सहस्रचरणाम्बुजाम् ॥ ५॥ पद्मयोनिमुखाब्जस्थां विष्णुवक्षःस्थलस्थिताम्
    । शिवाङ्कनिलयां गौरीं वन्दे मूर्तित्रयात्मिकाम् ॥ ६॥ आर्भट्या वैष्णवी चोग्रा कुलानि विबुधद्विषाम्
    । या निर्दहति रक्ताक्षी तां वन्दे सिंहवाहनाम् ॥ ७॥ मधुकैटभसंहारं महिषासुरमर्दनम् । याऽकरोन्नौमि दुर्गां
    तां वधं शुम्भनिशुम्भयोः ॥ ८॥ इन्द्रादिसर्वदेवानां सूर्यादिज्योतिषामपि । सर्वशक्तिस्वरूपा या रात्रीं
    तां प्रणमाम्यहम् ॥ ९॥ रात्रिसूक्तं जपेद्रात्रौ त्रिवारं च दिने दिने । भूतप्रेतपिशाचादिचोरसर्पादिनाशनम्
    ॥ १०॥ इति श्रीरात्रिसूक्तात्मकदेवीस्तोत्रं सम्पूर्णम् ॥
