id: brahmeshadharmakritamshrikrishnastotrarajapathanam
category: stotram
name:
  english: brahmeshadharmakritamshrikrishnastotrarajapathanam
  devanagari: ब्रह्मेशधर्मकृतंश्रीकृष्णस्तोत्रराजपठनम्
content:
  english: 100|| ashariram vigrahavadindriyam yadatindriyam | yadasakshi sarvasakshi tejorupam namamyaham
    || 101|| gamanarhamapadam yadacakshuh sarvadarshanam | hastasyahinam yadbhoktri tejorupam namamyaham
    || 102|| vede nirupitam vastu santah shaktashca varnitum | vede'nirupitam yattattejorupam namamyaham
    || 103|| sarvesham yadanisham yatsarvadi yadanadi yat | sarvatmakamanatmam yattejorupam namamyaham
    || 104|| aham vidhata jagato vedanam janakah svayam | pata dharmo haro harta stotum shakta na ke'pi
    yat || 105|| sevaya tava dharmo'yam palane ca nirupitah | tavajnaya ca samharta tvaya kale nirupite
    || 106|| nihsheshotpattikartta'ham tvatpadambhojasevaya | karminam phaladata ca tvam bhaktanam ca
    nah prabhuh || 107|| brahmande bimbasadrishe bhutva vishayino vayam | evam katividhah santi teshvananteshu
    sevakah || 108|| yatha na sankhya renunam tatha teshamaniyasam | sarvesham janakashcesho yastam stotum
    ca ke kshamah || 109|| ekaikalomavivare brahmandamekamekakam | yasyaiva mahato vishnoh shodashamshastavaiva
    sah || 5
  devanagari: १००॥ अशरीरं विग्रहवदिन्द्रियं यदतीन्द्रियम् । यदसाक्षि सर्वसाक्षि तेजोरूपं नमाम्यहम् ॥ १०१॥
    गमनार्हमपादं यदचक्षुः सर्वदर्शनम् । हस्तास्यहीनं यद्भोक्तृ तेजोरूपं नमाम्यहम् ॥ १०२॥ वेदे निरूपितं
    वस्तु सन्तः शक्ताश्च वर्णितुम् । वेदेऽनिरूपितं यत्तत्तेजोरूपं नमाम्यहम् ॥ १०३॥ सर्वेशं यदनीशं यत्सर्वादि
    यदनादि यत् । सर्वात्मकमनात्मं यत्तेजोरूपं नमाम्यहम् ॥ १०४॥ अहं विधाता जगतो वेदानां जनकः स्वयम् । पाता
    धर्मो हरो हर्ता स्तोतुं शक्ता न केऽपि यत् ॥ १०५॥ सेवया तव धर्मोऽयं पालने च निरूपितः । तवाज्ञया च संहर्ता
    त्वया काले निरूपिते ॥ १०६॥ निःशेषोत्पत्तिकर्त्ताऽहं त्वत्पादाम्भोजसेवया । कर्मिणां फलदाता च त्वं भक्तानां
    च नः प्रभुः ॥ १०७॥ ब्रह्माण्डे बिम्बसदृशे भूत्वा विषयिणो वयम् । एवं कतिविधाः सन्ति तेष्वनन्तेषु सेवकाः
    ॥ १०८॥ यथा न सङ्ख्या रेणूनां तथा तेषामणीयसाम् । सर्वेषां जनकश्चेशो यस्तं स्तोतुं च के क्षमाः ॥ १०९॥
    एकैकलोमविवरे ब्रह्माण्डमेकमेककम् । यस्यैव महतो विष्णोः षोडशांशस्तवैव सः ॥ ५
