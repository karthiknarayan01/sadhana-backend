id: vagvadinisahasranamastotoram
category: sahasranama
name:
  english: vagvadinisahasranamastotoram
  devanagari: वाग्वादिनीसहस्रनामस्तोतोरम्
content:
  english: duhkhanashini | davagnirupinidevi dashagrivavaraprada || 32|| dayanadi dayashila danashila
    ca darshini | dridhadevi dridhadrishti dugghaprapanatatpara || 33|| dugdhavarna dugdhapriya dadhidugdhapradayaka
    | devaki devamata ca deveshi devapujita || 34|| devimurtirdayamurtirdoshaha doshanashini | doshaghni
    doshadamani dolacalapratishthita || 35|| dainyaha daityahantri ca devariganamardini | dambhakrit dambhanashi
    ca dadimipushpavallabha || 36|| dashana dadimakara dadimikusumaprabha | dasivaraprada diksha dikshita
    dikshiteshvari || 37|| diliparajabalada dinaratrisvarupini | digambari diptateja damarubhujadharini
    || 38|| dravyarupi dravyakari dasharathavaraprada | ishvari ishvarabharya ca indriyarupasamsthita
    || 39|| indrapujya indramata ipsitvaphaladayaka | indrani ingitajna ca ishani ishvarapriya || 40||
    ishtamurti ihaivastha iccharupa iheshvari | icchashaktirishvarastha ilvadaityanishudini || 41|| itihasadishastrajna
    icchacarisvarupini | ikarakshararupa ca indriyavaravardhini || 42|| indralokanivasina ipsitarthapradayini
    | nari narayanaprita narasimhi nareshvari || 43|| narmada nandinirupa nartaki naganandini | narayanapriya
    nityam nanavidyapradayini || 44|| nanashastradharidevi nanapushpasushobhita | nayanatrayarupa ca nrityanathasya
    vallabha || 45|| nadirupa nrityarupa nagari nagareshvari | nanarthadata nalini naradadiprapujita ||
    46|| natarambheshvaridevi nitijna ca niranjani | nityasimhasanastha ca nityakalyanakarini || 47||
    nityanandakari devi nityasiddhipradayaka | netrapadmadalakara netratrayasvarupini || 48|| naumidevinamamatra
    nakarakshararupini | nanda nidra mahanidra nupurapadashobhita || 49|| nataki natakadhyaksha naranandapradayika
    | nanabharanasantushtananaratnavibhushana || 50|| narakanashinidevi nagantakasthita priya | nitividyaprada
    devi nyayashastravisharadi || 51|| naralokagatadevi narakasuranashini | anantashaktirupa ca naimittikaprapujita
    || 52|| nanashastradharadevi narabindusvarupini | nakshatrarupa nandita nagastha naganandini || 53||
    sarada saritarupa satyabhama sureshvari | sarvanandakaridevi sarvabharanabhushita || 54|| sarvavidyadharadevi
    sarvashastrasvarupini | sarvamangaladatri ca sarvakalyanakarini || 55|| sarvajna sarvabhagyam ca sarvasantushtidayaka
    | sarvabharadharadevi sarvadeshanivasini || 56|| sarvadevapriyadevi sarvadevaprapujita | sarvadoshaharadevi
    sarvapatakanashini || 57|| sarvasamsarasamrajni sarvasankashtanashini | sarvasamsarasarani sarvakalahavidhvamsi
    sarvavidyadhidevata || 58|| sarvamohanakari ca sarvamantraprasiddhida | sarvatantratmikadevi sarvayantradhidevata
    || 59|| sarvamandalasamstha ca sarvamayavimohini | sarvahridayavasinya sarvamatmasvarupini || 60||
    sarvakaranakari ca sarvashantasvarupini | sarvasiddhikarastha ca sarvavakyasvarupini || 61|| sarvadhara
    niradhara sarvangasundari sati | sarvavedamayidevi sarvashabdasvarupini || 62|| sarvabrahmandavyapta
    ca sarvabrahmandavasini | sarvacararata sadhvi sarvabijasvarupini || 63|| sarvonmadavikaraghni sarvakalmashanashini
    | sarvadehagatadevi sarvayogeshvari para || 64|| sarvakanthasthita nityam sarvagarbhasurakshaka |
    sarvabhava prabhavadya sarvalakshmipradayika || 65|| sarvaishvaryaprada devi sarvavayusvarupini |
    suralokagata devi sarvayogeshvari para || 66|| sarvakanthasthita nityam surasuravaraprada | suryakotipratikasha
    suryamandalasamsthita || 67|| shunyamandalasamstha ca sattviki satyada tatha | sarita saritashreshtha
    sadacarasushobhita || 68|| sakini samyarupa ca sadhvi sadhujanashraya | siddhida siddhirupa ca siddhissiddhivivardhini
    || 69|| shritakalyanadadevi sarvamohadhidevata | siddheshvari ca siddhatma sarvamedhavivardhini ||
    70|| shaktirupa ca shakteshi shyama kashtanishudini | sarvabhaksha shankhini ca sarasagatakarini ||
    71|| sarvapranavarupa ca sarva akshararupini | sukhada saukhyada bhoga sarvavighnavidarini || 72||
    santapaha sarvabija savitri surasundari | shrirupa shrikari shrishca shishiracalavasini || 73|| shailaputri
    shailadhatri sharanagatavallabha | ratneshvari ratnaprada ratnamandiravasini || 74|| ratnamalavicitrangi
    ratnasimhasanasthita | rasadhararasarata rasajna rasavallabha || 75|| rasabhoktri rasarupa shadrasajna
    raseshvari | rasendrabhushana nityam ratirupa ratiprada || 76|| rajeshvari rakini ca ravanavaradayaka
    | dashasyavaradayaka ramakanta ramapriya ramacandrasya vallabha || 77|| rakshasaghni rajamata radha
    rudreshvari nisha | rukmini ramani rama rajyabhugrajyadayaka || 78|| raktambaradharadevi rakarakshararupini
    | rasistha ramavarada rajyada rajyamandita || 79|| rogaha lobhaha lola lalita laliteshvari | tantrini
    tantrarupa ca tattvi tattvasvarupini || 80|| tapasa tapasi tara tarunanangarupini | tattvajna tattvanilaya
    tattvalayanivasini || 81|| tamogunapradadevi tarini tantradayika | takarakshararupa ca tarakabhayabhanjani
    || 82|| tirtharupa tirthasamstha tirthakotiphalaprada | tirthamata tirthajyeshtha tarangatirthadayaka
    || 83|| trailokyajananidevi trailokyabhayabhanjani | tulasi totala tirtha tripura tripureshvari ||
    84|| trailokyapalakadhvamsi trivargaphaladayaka | trikalajna trilokeshi tritiyajvaranashini || 85||
    trinetradhari triguna trisugandhivilepini | trilauhadatri gambhira taraganavilasini || 86|| trayodashagunopeta
    turiyamurtirupini | tandaveshi tungabhadra tushtistretayugapriya || 87|| tarangini tarangastha tapolokanivasini
    | taptakancanavarnabha tapahsiddhividhayini || 88|| trishaktistrimadhuprita triveni tripurantaka |
    padmastha padmahasta ca paratraphaladayaka || 89|| paramatma padmavarna paraparatarashtama | parameshthi
    paranjyotih pavitra parameshvari || 90|| parakartri papahantri patakaughavinashini | paramanandadadevi
    pritida pritivarddhini || 91|| punyanamni punyadeha pushtipustakadharini | putradatri putramata purusharthapureshvari
    || 92|| paurnamipunyaphalada pankajasanasamsthita | prithvirupa ca prithivi pitambarasya vallabha
    || 93|| pathadevi ca pathita patheshi pathavallabha | pannagantakasamstha ca parardhangoshvapaddhati
    || 94|| hamsini hasinidevi harsharupa ca harshada | haripriya hemagarbha hamsastha hamsagamini ||
    95|| hemalankarasarvangi haimacalanivasini | hutva hasitadeha ca haha huhu sadapriya || 96|| hamsarupa
    hamsavarna hita lokatrayeshvari | hunkaranadinidevi hutabhukta huteshvari || 97|| jnanarupa ca jnanajna
    jnanada jnanasiddhida | jnaneshvari jnanagamya jnani jnanavishaladhih || 98|| jnanamurtirjnanadhatri
    jnatavyakaranadini | ajnananashinidevi jnata jnanarnaveshvari || 99|| mahadevi mahamoha mahayogarata
    tatha | mahavidya mahaprajna mahajnana maheshvari || 100|| manjushri manjuraprita manjughoshasya vandita
    | mahamanjurikadevi manimukutashobhita || 101|| maladhari mantramurtirmadani madanaprada | manarupa
    manasi ca matirmatimanotsava || 102|| maneshvari manamanya madhusudanavallabha | mridapriya mulasamstha
    murdhnistha munivandita || 103|| mukhabekta mudhahanta mrityurbhayavinashini | mritrika matrika medha
    medhavi madhavapriya || 104|| makarakshararupa ca maniratnavibhushita | mantraradhanatattvajna mantrayantraphalaprada
    || 105|| manodbhava mandahasa mangala mangaleshvari | maunahantri modadatri mainakaparvate sthita
    || 106|| manimati manojna ca mata margavilasini | mulamargaratadevi manasa manadayini || 107|| bharati
    bhuvaneshi ca bhutajna bhutapujita | bhadraganga bhadrarupa bhuvana bhuvaneshvari || 108|| bhairavi
    bhogadadevi bhaishajya bhairavapriya | bhavananda bhavatushti bhavini bharatarcita || 109|| bhagirathi
    bhashyarupa bhagya bhagyavatiti ca | bhadrakalyanadadevi bhrantiha bhramanashini || 110|| bhimeshvari
    bhitihantri bhavapatakabhanjani | bhaktotsava bhaktapriya bhaktastha bhaktavatsala || 111|| bhanja
    ca bhutadoshaghni bhavamata bhaveshvari | bhayaha bhagnaha bhavya bhavakaranakarini || 112|| bhutaishvaryaprada
    devi bhushananki bhavapriya | ananyajnanasampanna akarakshararupini || 113|| anantamahima tryakshi
    ajapamantrarupini | anekasrishtisampurna anekaksharajnanada || 114|| anandadayini devi amrita amritodbhava
    | anandini ca ariha annastha agnivacchavih || 115|| atyantajnanasampanna animadiprasiddhida | arogyadayini
    adhya adishaktirabhiruha || 116|| ajna agocari adimata ashvatthavrikshavasini | dharmavati dharmadhari
    dharanidharavallabha || 117|| dharana dharanadhisha dharmarupadharadhari | dharmamata dharmakartri
    dhanada ca dhaneshvari || 118|| dhruvalokagata dhata dharitri dhenurupadhrik | dhirupa dhiprada dhisha
    dhritirvaksiddhidayaka || 119|| dhairyakriddhairyada dhairya dhautavastrena shobhita | dhurandhari
    dhundhimata dharanashaktirupini || 120|| vaikunthastha kanthanilaya kamada kamacarini | kamadhenusvarupa
    ca kashtakallolaharini || 121|| kumudahasini nityam kailasapadadayaka | kamala kamalastha ca kalaha
    kleshanashini || 122|| kalashodashasamyukta kankali kamaleshvari | kumari kulasantosha kulajna kulavarddhini
    || 123|| kalakutavishadhvamsi kamalapatimohani | kumbhastha kalashastha ca krishnavakshovilasini ||
    124|| krityadidoshaha kunti kasturitilakapriya | karpuravasitadeha karpuramodadharini || 125|| kushastha
    kushamulastha kubja kaitabhanashini | kurukshetrakrita devi kulashri kulabhairavi || 126|| kritabrahmandasarveshi
    kali kankanadharini | kuberapujita devi kanthakritkanthakarshani || 127|| kumudahpushpasantushta kinkinipadabhushini
    | kunkumena viliptangi kunkumadravalepita || 128|| kumbhakarnasya bhramada kunjarasanasamsthita |
    kusumamalikavetri kaushikikusumapriya || 129|| yajnarupa ca yajneshi yashoda jalashayini | yajnavidya
    yogamaya janaki janani jaya || 130|| yamunajapasantushta japayajnaphalaprada | yogadhatri yogadatri
    yamalokanivarini || 131|| yashahkirtiprada yogi yuktida yuktidayani | jaivani yugadhatri ca yamalarjunabhanjani
    || 132|| jrimbhanyadiratadevi jamadagniprapujita | jalandhari jitakrodha jimutaishvaryadayaka || 133||
    kshemarupa kshemakari kshetrada kshetravardhini | ksharasamudrasamstha ca kshiraja kshiradayaka ||
    134|| kshudhahantri kshemadhatri kshirarnavasamudbhava | kshirapriya kshirabhoji kshatriyakulavarddhini
    || 135|| khagendravahini kharva khacarini khageshvari | kharayuthavinashi ca khadgahasta ca khanjana
    || 136|| shatcakradharasamstha ca shatcakrasyadhidevata | shadangajnanasampanna khandacandrardhashekhara
    || 137|| shatkarmarahita khyata kharabuddhinivarini | shodashadharakriddevi shodashabhujashobhita
    || 138|| shodashamurtishodashya khadgakhetakadharini | ghritapriya ghargharika ghurghurinadashobhita
    || 139|| ghantaninadasantushta ghantashabdasvarupini | ghatikaghatasamstha ca ghranavasi ghaneshvari
    || 140|| carunetra caruvaktra caturbahushcaturbhuja | cancala capala citra citrini citraranjini ||
    141|| candrabhaga candrahasa citrastha citrashobhana | citravicitramalyangi candrakotisamaprabha ||
    142|| candrama ca caturveda pracanda candashekhari | cakramadhyasthita devi cakrahasta ca cakrini
    || 143|| candracuda carudeha candamundavinashini | candeshvari citralekha carane nupurairyuta || 144||
    caitradimasarupa sa camarabhujadharini | carvanka carcika divya campadevi caturthacit || 145|| caturbhujapriya
    nityam caturvarnaphalaprada | catussagarasankhyata cakravartiphalaprada || 146|| chatradatri chinnamasta
    chalamadhyanivasini | chayarupa ca chatrastha churikahastadharini || 147|| uttamangi ukarastha umadevisvarupini
    | urdhvamnayi urdhvagamya omkarakshararupini || 148|| ekavaktra devamata aindri aishvaryadayaka |
    aushadhisha caushadhikrit oshtastha oshtavasini || 149|| sthavarastha sthalacara sthitisamharakarika
    | rum rum shabdasvarupa ca runkarakshararupini || 150|| aryuda adbhutaprada amnayashatsvarupini |
    annapurna annadatri asha sarvajanasya ca || 151|| artihari ca asvastha asheshagunasamyuta | shuddharupa
    surupa ca savitri sadhakeshvari || 152|| balika yuvati vriddha vishvasi vishvapalini | phakararupa
    phalada phalavannirphalaprada || 153|| phanindrabhushana devi phakarakshararupini | riddhirupi rikarastha
    rinaha rinanashini || 154|| renurakararamani paribhasha subhashita | pranapanasamanasthodanavyanau
    dhananjaya || 155|| krikara vayurupa ca kritajna shankhini tatha | krirmanamnyunmilanakari jihvakasvadumilana
    || 156|| jihvarupa jihvasamstha jihvasvadupradayaka | smritida smritimulastha shlokakricchlokarashikrit
    || 157|| adhare samsthita devi anahatanivasini | nabhistha hridayastha ca bhumadhye dvidale sthita
    || 158|| sahasradalasamstha ca gurupatnisvarupini | phalashtutih
  devanagari: दुःखनाशिनी । दावाग्निरूपिणीदेवी दशग्रीववरप्रदा ॥ ३२॥ दयानदी दयाशीला दानशीला च दर्शिनी ।
    दृढदेवी दृढदृष्टी दुग्घप्रपानतत्परा ॥ ३३॥ दुग्धवर्णा दुग्धप्रिया दधिदुग्धप्रदायका । देवकी देवमाता
    च देवेशी देवपूजिता ॥ ३४॥ देवीमूर्तिर्दयामूर्तिर्दोषहा दोषनाशिनी । दोषघ्नी दोषदमनी दोलाचलप्रतिष्ठिता
    ॥ ३५॥ दैन्यहा दैत्यहन्त्री च देवारिगणमर्दिनी । दम्भकृत् दम्भनाशी च दाडिमीपुष्पवल्लभा ॥ ३६॥ दशना दाडिमाकारा
    दाडिमीकुसुमप्रभा । दासीवरप्रदा दीक्षा दीक्षिता दीक्षितेश्वरी ॥ ३७॥ दिलीपराजबलदा दिनरात्रिस्वरूपिणी
    । दिगम्बरी दीप्ततेजा डमरूभुजधारिणी ॥ ३८॥ द्रव्यरूपी द्रव्यकरी दशरथवरप्रदा । ईश्वरी ईश्वरभार्या च इन्द्रियरूपसंस्थिता
    ॥ ३९॥ इन्द्रपूज्या इन्द्रमाता ईप्सित्वफलदायका । इन्द्राणी इङ्गितज्ञा च ईशानी ईश्वरप्रिया ॥ ४०॥ इष्टमूर्ती
    इहैवस्था इच्छारूपा इहेश्वरी । इच्छाशक्तिरीश्वरस्था इल्वदैत्यनिषूदिनी ॥ ४१॥ इतिहासादिशास्त्रज्ञा इच्छाचारीस्वरूपिणी
    । ईकाराक्षररूपा च इन्द्रियवरवर्धिनी ॥ ४२॥ इन्द्रलोकनिवासिना ईप्सितार्थप्रदायिनी । नारी नारायणप्रीता
    नारसिंही नरेश्वरी ॥ ४३॥ नर्मदा नन्दिनीरूपा नर्तकी नगनन्दिनी । नारायणप्रिया नित्यं नानाविद्याप्रदायिनी
    ॥ ४४॥ नानाशास्त्रधरीदेवी नानापुष्पसुशोभिता । नयनत्रयरूपा च नृत्यनाथस्य वल्लभा ॥ ४५॥ नदीरूपा नृत्यरूपा
    नागरी नगरेश्वरी । नानार्थदाता नलिनी नारदादिप्रपूजिता ॥ ४६॥ नतारम्भेश्वरीदेवी नीतिज्ञा च निरञ्जनी ।
    नित्यसिंहासनस्था च नित्यकल्याणकारिणी ॥ ४७॥ नित्यानन्दकरी देवी नित्यसिद्धिप्रदायका । नेत्रपद्मदलाकारा
    नेत्रत्रयस्वरूपिणी ॥ ४८॥ नौमीदेवीनाममात्रा नकाराक्षररूपिणी । नन्दा निद्रा महानिद्रा नूपुरपदशोभिता
    ॥ ४९॥ नाटकी नाटकाध्यक्षा नरानन्दप्रदायिका । नानाभरणसन्तुष्टानानारत्नविभूषणा ॥ ५०॥ नरकनाशिनीदेवी नागान्तकस्थिता
    प्रिया । नीतिविद्याप्रदा देवी न्यायशास्त्रविशारदी ॥ ५१॥ नरलोकगतादेवी नरकासुरनाशिनी । अनन्तशक्तिरूपा
    च नैमित्तिकप्रपूजिता ॥ ५२॥ नानाशस्त्रधरादेवी नारबिन्दुस्वरूपिणी । नक्षत्ररूपा नन्दिता नगस्था नगनन्दिनी
    ॥ ५३॥ सारदा सरितारूपा सत्यभामा सुरेश्वरी । सर्वानन्दकरीदेवी सर्वाभरणभूषिता ॥ ५४॥ सर्वविद्याधरादेवी
    सर्वशास्त्रस्वरूपिणी । सर्वमङ्गलदात्री च सर्वकल्याणकारिणी ॥ ५५॥ सर्वज्ञा सर्वभाग्यं च सर्वसन्तुष्टिदायका
    । सर्वभारधरादेवी सर्वदेशनिवासिनी ॥ ५६॥ सर्वदेवप्रियादेवी सर्वदेवप्रपूजिता । सर्वदोषहरादेवी सर्वपातकनाशिनी
    ॥ ५७॥ सर्वसंसारसंराज्ञी सर्वसङ्कष्टनाशिनी । सर्वसंसारसाराणि सर्वकलहविध्वंसी सर्वविद्याधिदेवता ॥ ५८॥
    सर्वमोहनकारी च सर्वमन्त्रप्रसिद्धिदा । सर्वतन्त्रात्मिकादेवी सर्वयन्त्राधिदेवता ॥ ५९॥ सर्वमण्डलसंस्था
    च सर्वमायाविमोहिनी । सर्वहृदयवासिन्या सर्वमात्मस्वरूपिणी ॥ ६०॥ सर्वकारणकारी च सर्वशान्तस्वरूपिणी ।
    सर्वसिद्धिकरस्था च सर्ववाक्यस्वरूपिणी ॥ ६१॥ सर्वाधारा निराधारा सर्वाङ्गसुन्दरी सती । सर्ववेदमयीदेवी
    सर्वशब्दस्वरूपिणी ॥ ६२॥ सर्वब्रह्माण्डव्याप्ता च सर्वब्रह्माण्डवासिनी । सर्वाचाररता साध्वी सर्वबीजस्वरूपिणी
    ॥ ६३॥ सर्वोन्मादविकारघ्नी सर्वकल्मषनाशिनी । सर्वदेहगतादेवी सर्वयोगेश्वरी परा ॥ ६४॥ सर्वकण्ठस्थिता
    नित्यं सर्वगर्भासुरक्षका । सर्वभावा प्रभावाद्या सर्वलक्ष्मीप्रदायिका ॥ ६५॥ सर्वैश्वर्यप्रदा देवी सर्ववायुस्वरूपिणी
    । सुरलोकगता देवी सर्वयोगेश्वरी परा ॥ ६६॥ सर्वकण्ठस्थिता नित्यं सुरासुरवरप्रदा । सूर्यकोटिप्रतीकाशा
    सूर्यमण्डलसंस्थिता ॥ ६७॥ शून्यमण्डलसंस्था च सात्त्विकी सत्यदा तथा । सरिता सरिताश्रेष्ठा सदाचारसुशोभिता
    ॥ ६८॥ साकिनी साम्यरूपा च साध्वी साधुजनाश्रया । सिद्धिदा सिद्धिरूपा च सिद्धिस्सिद्धिविवर्धिनी ॥ ६९॥
    श्रितकल्याणदादेवी सर्वमोहाधिदेवता । सिद्धेश्वरी च सिद्धात्मा सर्वमेधाविवर्धिनी ॥ ७०॥ शक्तिरूपा च शक्तेशी
    श्यामा कष्टनिषूदिनी । सर्वभक्षा शङ्खिनी च सरसागतकारिणी ॥ ७१॥ सर्वप्रणवरूपा च सर्व अक्षररूपिणी । सुखदा
    सौख्यदा भोगा सर्वविघ्नविदारिणी ॥ ७२॥ सन्तापहा सर्वबीजा सावित्री सुरसुन्दरी । श्रीरूपा श्रीकरी श्रीश्च
    शिशिराचलवासिनी ॥ ७३॥ शैलपुत्री शैलधात्री शरणागतवल्लभा । रत्नेश्वरी रत्नप्रदा रत्नमन्दिरवासिनी ॥ ७४॥
    रत्नमालाविचित्राङ्गी रत्नसिंहासनस्थिता । रसधारारसरता रसज्ञा रसवल्लभा ॥ ७५॥ रसभोक्त्री रसरूपा षड्रसज्ञा
    रसेश्वरी । रसेन्द्रभूषणा नित्यं रतिरूपा रतिप्रदा ॥ ७६॥ राजेश्वरी राकिणी च रावणावरदायका । दशास्यवरदायका
    रामकान्ता रामप्रिया रामचन्द्रस्य वल्लभा ॥ ७७॥ राक्षसघ्नी राजमाता राधा रुद्रेश्वरी निशा । रुक्मिणी
    रमणी रामा राज्यभुग्राज्यदायका ॥ ७८॥ रक्ताम्बरधरादेवी रकाराक्षररूपिणी । रासिस्था रामवरदा राज्यदा राज्यमण्डिता
    ॥ ७९॥ रोगहा लोभहा लोला ललिता ललितेश्वरी । तन्त्रिणी तन्त्ररूपा च तत्त्वी तत्त्वस्वरूपिणी ॥ ८०॥ तपसा
    तापसी तारा तरुणानङ्गरूपिणी । तत्त्वज्ञा तत्त्वनिलया तत्त्वालयनिवासिनी ॥ ८१॥ तमोगुणप्रदादेवी तारिणी
    तन्त्रदायिका । तकाराक्षररूपा च तारकाभयभञ्जनी ॥ ८२॥ तीर्थरूपा तीर्थसंस्था तीर्थकोटिफलप्रदा । तीर्थमाता
    तीर्थज्येष्ठा तरङ्गतीर्थदायका ॥ ८३॥ त्रैलोक्यजननीदेवी त्रैलोक्यभयभञ्जनी । तुलसी तोतला तीर्था त्रिपुरा
    त्रिपुरेश्वरी ॥ ८४॥ त्रैलोक्यपालकध्वंसी त्रिवर्गफलदायका । त्रिकालज्ञा त्रिलोकेशी तृतीयज्वरनाशिनी ॥
    ८५॥ त्रिनेत्रधारी त्रिगुणा त्रिसुगन्धिविलेपिनी । त्रिलौहदात्री गम्भीरा तारागणविलासिनी ॥ ८६॥ त्रयोदशगुणोपेता
    तुरीयमूर्तिरूपिणी । ताण्डवेशी तुङ्गभद्रा तुष्टिस्त्रेतायुगप्रिया ॥ ८७॥ तरङ्गिणी तरङ्गस्था तपोलोकनिवासिनी
    । तप्तकाञ्चनवर्णाभा तपःसिद्धिविधायिनी ॥ ८८॥ त्रिशक्तिस्त्रिमधुप्रीता त्रिवेणी त्रिपुरान्तका । पद्मस्था
    पद्महस्ता च परत्रफलदायका ॥ ८९॥ परमात्मा पद्मवर्णा परापरतराष्टमा । परमेष्ठी परञ्ज्योतिः पवित्रा परमेश्वरी
    ॥ ९०॥ पारकर्त्री पापहन्त्री पातकौघविनाशिनी । परमानन्ददादेवी प्रीतिदा प्रीतिवर्द्धिनी ॥ ९१॥ पुण्यनाम्नी
    पुण्यदेहा पुष्टिपुस्तकधारिणी । पुत्रदात्री पुत्रमाता पुरुषार्थपुरेश्वरी ॥ ९२॥ पौर्णमीपुण्यफलदा पङ्कजासनसंस्थिता
    । पृथ्वीरूपा च पृथिवी पीताम्बरस्य वल्लभा ॥ ९३॥ पाठादेवी च पठिता पाठेशी पाठवल्लभा । पन्नगान्तकसंस्था
    च परार्धाङ्गोश्वपद्धती ॥ ९४॥ हंसिनी हासिनीदेवी हर्षरूपा च हर्षदा । हरिप्रिया हेमगर्भा हंसस्था हंसगामिनी
    ॥ ९५॥ हेमालङ्कारसर्वाङ्गी हैमाचलनिवासिनी । हुत्वा हसितदेहा च हाहा हूहू सदाप्रिया ॥ ९६॥ हंसरूपा हंसवर्णा
    हिता लोकत्रयेश्वरी । हुङ्कारनादिनीदेवी हुतभुक्ता हुतेश्वरी ॥ ९७॥ ज्ञानरूपा च ज्ञानज्ञा ज्ञानदा ज्ञानसिद्धिदा
    । ज्ञानेश्वरी ज्ञानगम्या ज्ञानी ज्ञानविशालधीः ॥ ९८॥ ज्ञानमूर्तिर्ज्ञानधात्री ज्ञातव्याकरणादिनी । अज्ञाननाशिनीदेवी
    ज्ञाता ज्ञानार्णवेश्वरी ॥ ९९॥ महादेवी महामोहा महायोगरता तथा । महाविद्या महाप्रज्ञा महाज्ञाना महेश्वरी
    ॥ १००॥ मञ्जुश्री मञ्जुरप्रीता मञ्जुघोषस्य वन्दिता । महामञ्जुरिकादेवी मणीमुकुटशोभिता ॥ १०१॥ मालाधरी
    मन्त्रमूर्तिर्मदनी मदनप्रदा । मानरूपा मनसी च मतिर्मतिमनोत्सवा ॥ १०२॥ मानेश्वरी मानमान्या मधुसूदनवल्लभा
    । मृडप्रिया मूलसंस्था मूर्ध्निस्था मुनिवन्दिता ॥ १०३॥ मुखबेक्ता मूढहन्ता मृत्युर्भयविनाशिनी । मृत्रिका
    मातृका मेधा मेधावी माधवप्रिया ॥ १०४॥ मकाराक्षररूपा च मणिरत्नविभूषिता । मन्त्राराधनतत्त्वज्ञा मन्त्रयन्त्रफलप्रदा
    ॥ १०५॥ मनोद्भवा मन्दहासा मङ्गला मङ्गलेश्वरी । मौनहन्त्री मोददात्री मैनाकपर्वते स्थिता ॥ १०६॥ मणिमती
    मनोज्ञा च माता मार्गविलासिनी । मूलमार्गरतादेवी मानसा मानदायिनी ॥ १०७॥ भारती भुवनेशी च भूतज्ञा भूतपूजिता
    । भद्रगङ्गा भद्ररूपा भुवना भुवनेश्वरी ॥ १०८॥ भैरवी भोगदादेवी भैषज्या भैरवप्रिया । भवानन्दा भवातुष्टी
    भाविनी भरतार्चिता ॥ १०९॥ भागीरथी भाष्यरूपा भाग्या भाग्यवतीति च । भद्रकल्याणदादेवी भ्रान्तिहा भ्रमनाशिनी
    ॥ ११०॥ भीमेश्वरी भीतिहन्त्री भवपातकभञ्जनी । भक्तोत्सवा भक्तप्रिया भक्तस्था भक्तवत्सला ॥ १११॥ भञ्जा
    च भूतदोषघ्नी भवमाता भवेश्वरी । भयहा भग्नहा भव्या भवकारणकारिणी ॥ ११२॥ भूतैश्वर्यप्रदा देवी भूषणाङ्की
    भवप्रिया । अनन्यज्ञानसम्पन्ना अकाराक्षररूपिणी ॥ ११३॥ अनन्तमहिमा त्र्यक्षी अजपामन्त्ररूपिणी । अनेकसृष्टिसम्पूर्णा
    अनेकाक्षरज्ञानदा ॥ ११४॥ आनन्ददायिनी देवी अमृता अमृतोद्भवा । आनन्दिनी च अरिहा अन्नस्था अग्निवच्छविः
    ॥ ११५॥ अत्यन्तज्ञानसम्पन्ना अणिमादिप्रसिद्धिदा । आरोग्यदायिनी आढ्या आदिशक्तिरभीरुहा ॥ ११६॥ आज्ञा अगोचरी
    आदिमाता अश्वत्थवृक्षवासिनी । धर्मावती धर्मधरी धरणीधरवल्लभा ॥ ११७॥ धारणा धारणाधीशा धर्मरूपधराधरी ।
    धर्ममाता धर्मकर्त्री धनदा च धनेश्वरी ॥ ११८॥ ध्रुवलोकगता धाता धरित्री धेनुरूपधृक् । धीरूपा धीप्रदा
    धीशा धृतिर्वाक्सिद्धिदायका ॥ ११९॥ धैर्यकृद्धैर्यदा धैर्या धौतवस्त्रेण शोभिता । धुरन्धरी धुन्धिमाता
    धारणाशक्तिरूपिणी ॥ १२०॥ वैकुण्ठस्था कण्ठनिलया कामदा कामचारिणी । कामधेनुस्वरूपा च कष्टकल्लोलहारिणी
    ॥ १२१॥ कुमुदहासिनी नित्यं कैलासपददायका । कमला कमलस्था च कालहा क्लेशनाशिनी ॥ १२२॥ कलाषोडशसंयुक्ता कङ्काली
    कमलेश्वरी । कुमारी कुलसन्तोषा कुलज्ञा कुलवर्द्धिनी ॥ १२३॥ कालकूटविषध्वंसी कमलापतिमोहनी । कुम्भस्था
    कलशस्था च कृष्णवक्षोविलासिनी ॥ १२४॥ कृत्यादिदोषहा कुन्ती कस्तूरीतिलकप्रिया । कर्पुरवासितादेहा कर्पूरमोदधारिणी
    ॥ १२५॥ कुशस्था कुशमूलस्था कुब्जा कैटभनाशिनी । कुरुक्षेत्रकृता देवी कुलश्री कुलभैरवी ॥ १२६॥ कृतब्रह्माण्डसर्वेशी
    काली कङ्कणधारिणी । कुबेरपूजिता देवी कण्ठकृत्कण्ठकर्षणी ॥ १२७॥ कुमुदःपुष्पसन्तुष्टा किङ्किणीपादभूषिणी
    । कुङ्कुमेन विलिप्ताङ्गी कुङ्कुमद्रवलेपिता ॥ १२८॥ कुम्भकर्णस्य भ्रमदा कुञ्जरासनसंस्थिता । कुसुममालिकावेत्री
    कौशिकीकुसुमप्रिया ॥ १२९॥ यज्ञरूपा च यज्ञेशी यशोदा जलशायिनी । यज्ञविद्या योगमाया जानकी जननी जया ॥ १३०॥
    यमुनाजपसन्तुष्टा जपयज्ञफलप्रदा । योगधात्री योगदात्री यमलोकनिवारिणी ॥ १३१॥ यशःकीर्तिप्रदा योगी युक्तिदा
    युक्तिदायनी । जैवनी युगधात्री च यमलार्जुनभञ्जनी ॥ १३२॥ जृम्भन्यादिरतादेवी जमदग्निप्रपूजिता । जालन्धरी
    जितक्रोधा जीमूतैश्वर्यदायका ॥ १३३॥ क्षेमरूपा क्षेमकरी क्षेत्रदा क्षेत्रवर्धिनी । क्षारसमुद्रसंस्था
    च क्षीरजा क्षीरदायका ॥ १३४॥ क्षुधाहन्त्री क्षेमधात्री क्षीरार्णवसमुद्भवा । क्षीरप्रिया क्षीरभोजी क्षत्रियकुलवर्द्धिनी
    ॥ १३५॥ खगेन्द्रवाहिनी खर्व खचारीणी खगेश्वरी । खरयूथविनाशी च खड्गहस्ता च खञ्जना ॥ १३६॥ षट्चक्राधारसंस्था
    च षट्चक्रस्याधिदेवता । षडङ्गज्ञानसम्पन्ना खण्डचन्द्रार्धशेखरा ॥ १३७॥ षट्कर्मरहिता ख्याता खरबुद्धिनिवारिणी
    । षोडशाधारकृद्देवी षोडशभुजशोभिता ॥ १३८॥ षोडशमूर्तीषोडश्या खड्गखेटकधारिणी । घृतप्रिया घर्घरिका घुर्घुरीनादशोभिता
    ॥ १३९॥ घण्टानिनादसन्तुष्टा घण्टाशब्दस्वरूपिणी । घटिकाघटसंस्था च घ्राणवासी घनेश्वरी ॥ १४०॥ चारुनेत्रा
    चारुवक्त्रा चतुर्बाहुश्चतुर्भुजा । चञ्चला चपला चित्रा चित्रिणी चित्ररञ्जिनी ॥ १४१॥ चन्द्रभागा चन्द्रहासा
    चित्रस्था चित्रशोभना । चित्रविचित्रमाल्याङ्गी चन्द्रकोटिसमप्रभा ॥ १४२॥ चन्द्रमा च चतुर्वेदा प्रचण्डा
    चण्डशेखरी । चक्रमध्यस्थिता देवी चक्रहस्ता च चक्रिणी ॥ १४३॥ चन्द्रचूडा चारुदेहा चण्डमुण्डविनाशिनी ।
    चण्डेश्वरी चित्रलेखा चरणे नूपुरैर्युता ॥ १४४॥ चैत्रादिमासरूपा सा चामरभुजधारिणी । चार्वङ्का चर्चिका
    दिव्या चम्पादेवी चतुर्थचित् ॥ १४५॥ चतुर्भुजप्रिया नित्यं चतुर्वर्णफलप्रदा । चतुस्सागरसङ्ख्याता चक्रवर्तिफलप्रदा
    ॥ १४६॥ छत्रदात्री छिन्नमस्ता छलमध्यनिवासिनी । छायारूपा च छत्रस्था छुरिकाहस्तधारिणी ॥ १४७॥ उत्तमाङ्गी
    उकारस्था उमादेवीस्वरूपिणी । ऊर्ध्वाम्नायी ऊर्ध्वगाम्या ॐकाराक्षररूपिणी ॥ १४८॥ एकवक्त्रा देवमाता ऐन्द्री
    ऐश्वर्यदायका । औषधीशा चौषधीकृत् ओष्टस्था ओष्टवासिनी ॥ १४९॥ स्थावरस्था स्थलचरा स्थितिसंहारकारिका ।
    रुं रुं शब्दस्वरूपा च रुङ्काराक्षररूपिणी ॥ १५०॥ आर्युदा अद्भुतप्रदा आम्नायषट्स्वरूपिणी । अन्नपूर्णा
    अन्नदात्री आशा सर्वजनस्य च ॥ १५१॥ आर्तिहारी च अस्वस्था अशेषगुणसंयुता । शुद्धरूपा सुरूपा च सावित्री
    साधकेश्वरी ॥ १५२॥ बालिका युवती वृद्धा विश्वासी विश्वपालिनी । फकाररूपा फलदा फलवन्निर्फलप्रदा ॥ १५३॥
    फणीन्द्रभूषणा देवी फकारक्षररूपिणी । ऋद्धिरूपी ऋकारस्था ऋणहा ऋणनाशिनी ॥ १५४॥ रेणुराकाररमणी परिभाषा
    सुभाषिता । प्राणापानसमानस्थोदानव्यानौ धनञ्जया ॥ १५५॥ कृकरा वायुरूपा च कृतज्ञा शङ्खिनी तथा । कृर्मनाम्न्युन्मीलनकरी
    जिह्वकस्वादुमीलना ॥ १५६॥ जिह्वारूपा जिह्वसंस्था जिह्वास्वादुप्रदायका । स्मृतिदा स्मृतिमूलस्था श्लोककृच्छ्लोकराशिकृत्
    ॥ १५७॥ आधारे संस्थिता देवी अनाहतनिवासिनी । नाभिस्था हृदयस्था च भूमध्ये द्विदले स्थिता ॥ १५८॥ सहस्रदलसंस्था
    च गुरुपत्नीस्वरूपिणी । फलश्तुतिः
