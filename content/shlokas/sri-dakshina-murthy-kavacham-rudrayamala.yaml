id: sri-dakshina-murthy-kavacham-rudrayamala
category: stotram
name:
  english: Sri Dakshina Murthy Kavacham (Rudrayamala)
content:
  english: parvatyuvaca namaste'stu trayinatha paramanandakaraka | kavacam dakshinamurteh kripaya vada
    me prabho || || ishvara uvaca vakshye'ham devadeveshi dakshinamurtiravyayam | kavacam sarvapapaghnam
    vedantajnanagocaram || || animadi mahasiddhividhanacaturam shubham | vedashastrapuranani kavita tarka
    eva ca || || bahudha devi jayante kavacasya prabhavatah | rishirbrahma samuddishtashchando'nushtubudahritam
    || || devata dakshinamurtih paramatma sadashivah | bijam vedadikam caiva svaha shaktirudahrita | sarvajnatve'pi
    deveshi viniyogam pracakshate || || dhyanam advandvanetramamalendukalavatamsam hamsavalambita samana
    jatakalapam | anilakanthamupakanthamunipraviran adhyapayantamavalokaya lokanatham || kavacam om |
    shiro me dakshinamurtiravyat phalam maheshvarah | drishau patu mahadevah shravane candrashekharah
    || || kapolau patu me rudro nasam patu jagadguruh | mukham gauripatih patu rasanam vedarupadhrit ||
    || dashanam tripuradhvamsi coshtham pannagabhushanah | adharam patu vishvatma hanu patu jaganmayah
    || || cubukam devadevastu patu kantham jatadharah | skandhau me patu shuddhatma karau patu yamantakah
    || || kucagram karamadhyam ca nakharan shankarah svayam | hrinme pashupatih patu parshve paramapurushah
    || || madhyamam patu sharvo me nabhim narayanapriyah | katim patu jagadbharta sakthini ca mridah svayam
    || || krittivasah svayam guhyamuru patu pinakadhrit | januni tryambakah patu janghe patu sadashivah
    || || smararih patu me padau patu sarvangamishvarah | itidam kavacam devi paramanandadayakam || ||
    jnanavagarthadam viryamanimadivibhutidam | ayurarogyamaishvaryamapamrityubhayapaham || || pratah kale
    shucirbhutva trivaram sarvada japet | nityam pujasamayuktah samvatsaramatandritah || || japet trisandhyam
    yo vidvan vedashastrarthaparagah | gadyapadyaistatha capi natakah svayameva hi | nirgacchanti mukhambhojatsatyametanna
    samshayah || || iti rudrayamale umamaheshvarasamvade shri dakshinamurti kavacam ||
  devanagari: पार्वत्युवाच नमस्तेऽस्तु त्रयीनाथ परमानन्दकारक । कवचं दक्षिणामूर्तेः कृपया वद मे प्रभो ॥
    ॥ ईश्वर उवाच वक्ष्येऽहं देवदेवेशि दक्षिणामूर्तिरव्ययम् । कवचं सर्वपापघ्नं वेदान्तज्ञानगोचरम् ॥ ॥ अणिमादि
    महासिद्धिविधानचतुरं शुभम् । वेदशास्त्रपुराणानि कविता तर्क एव च ॥ ॥ बहुधा देवि जायन्ते कवचस्य प्रभावतः
    । ऋषिर्ब्रह्मा समुद्दिष्टश्छन्दोऽनुष्टुबुदाहृतम् ॥ ॥ देवता दक्षिणामूर्तिः परमात्मा सदाशिवः । बीजं
    वेदादिकं चैव स्वाहा शक्तिरुदाहृता । सर्वज्ञत्वेऽपि देवेशि विनियोगं प्रचक्षते ॥ ॥ ध्यानम् अद्वन्द्वनेत्रममलेन्दुकलावतंसं
    हंसावलम्बित समान जटाकलापम् । आनीलकण्ठमुपकण्ठमुनिप्रवीरान् अध्यापयन्तमवलोकय लोकनाथम् ॥ कवचम् ओम् ।
    शिरो मे दक्षिणामूर्तिरव्यात् फालं महेश्वरः । दृशौ पातु महादेवः श्रवणे चन्द्रशेखरः ॥ ॥ कपोलौ पातु मे
    रुद्रो नासां पातु जगद्गुरुः । मुखं गौरीपतिः पातु रसनां वेदरूपधृत् ॥ ॥ दशनां त्रिपुरध्वंसी चोष्ठं पन्नगभूषणः
    । अधरं पातु विश्वात्मा हनू पातु जगन्मयः ॥ ॥ चुबुकं देवदेवस्तु पातु कण्ठं जटाधरः । स्कन्धौ मे पातु
    शुद्धात्मा करौ पातु यमान्तकः ॥ ॥ कुचाग्रं करमध्यं च नखरान् शङ्करः स्वयम् । हृन्मे पशुपतिः पातु पार्श्वे
    परमपूरुषः ॥ ॥ मध्यमं पातु शर्वो मे नाभिं नारायणप्रियः । कटिं पातु जगद्भर्ता सक्थिनी च मृडः स्वयम्
    ॥ ॥ कृत्तिवासाः स्वयं गुह्यामूरू पातु पिनाकधृत् । जानुनी त्र्यम्बकः पातु जङ्घे पातु सदाशिवः ॥ ॥ स्मरारिः
    पातु मे पादौ पातु सर्वाङ्गमीश्वरः । इतीदं कवचं देवि परमानन्ददायकम् ॥ ॥ ज्ञानवागर्थदं वीर्यमणिमादिविभूतिदम्
    । आयुरारोग्यमैश्वर्यमपमृत्युभयापहम् ॥ ॥ प्रातः काले शुचिर्भूत्वा त्रिवारं सर्वदा जपेत् । नित्यं पूजासमायुक्तः
    संवत्सरमतन्द्रितः ॥ ॥ जपेत् त्रिसन्ध्यं यो विद्वान् वेदशास्त्रार्थपारगः । गद्यपद्यैस्तथा चापि नाटकाः
    स्वयमेव हि । निर्गच्छन्ति मुखाम्भोजात्सत्यमेतन्न संशयः ॥ ॥ इति रुद्रयामले उमामहेश्वरसंवादे श्री दक्षिणामूर्ति
    कवचम् ॥
