id: bhusuktam
category: sukta
name:
  english: bhusuktam
  devanagari: भूसूक्तम्
content:
  english: ringe yajne yajne vibhishani | indrapatni vyapini surasaridiha | vayumati jalashayani shriyandharaja
    satyantoparimedini | shvoparidhattam parigaya || vishnupatnim mahim devim madhavim madhavapriyam |
    lakshmipriyasakhim devim namamyacyutavallabham || om dhanurdharayai vidmahe sarvasiddhyai ca dhimahi
    | tanno dhara pracodayat | mahim devim vishnupatnimajuryam | praticim menagm havisha yajamah | tredha
    vishnururugayo vicakrame | mabim divam prithivimantariksham | tacachronaitishrava
  devanagari: ृङ्गे यज्ञे यज्ञे विभीषणी । इन्द्रपत्नी व्यापिनी सुरसरिदिह । वायुमती जलशयनी श्रियन्धाराजा
    सत्यन्तोपरिमेदिनी । श्वोपरिधत्तं परिगाया ॥ विष्णुपत्नीं महीं देवीं माधवीं माधवप्रियाम् । लक्ष्मीप्रियसखीं
    देवीं नमाम्यच्युतवल्लभाम् ॥ ॐ धनुर्धरायै विद्महे सर्वसिद्ध्यै च धीमहि । तन्नो धरा प्रचोदयात् । महीं
    देवीं विष्णुपत्नीमजुर्याम् । प्रतीचीं मेनाग्ं हविषा यजामः । त्रेधा विष्णुरुरुगायो विचक्रमे । मबीं
    दिवं पृथिवीमन्तरिक्षम् । तचछ्रोणैतिश्रव
meaning: {}
