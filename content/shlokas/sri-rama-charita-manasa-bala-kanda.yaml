    pai kai| ati priti laukika riti lagim karana mangala gai kai || lahakauri gauri sikhava ramahi siya
    sana sarada kahaim| ranivasu hasa bilasa rasa basa janma ko phalu saba lahaim || || nija pani mani
    mahu~ dekhiati murati surupanidhana ki| calati na bhujaballi bilokani biraha bhaya basa janaki ||
