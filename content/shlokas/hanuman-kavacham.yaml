id: hanuman-kavacham
category: stotram
name:
  english: Hanuman Kavacham
content:
  english: asya shri hanumat kavacastotramahamantrasya vasishtha rishih anushtup chandah shri hanuman
    devata marutatmaja iti bijam anjanasunuriti shaktih vayuputra iti kilakam hanumatprasada siddhyarthe
    jape viniyogah || ullanghya sindhossalilam salilam yashshokavahnim janakatmajayah | adaya tenaiva
    dadaha lankam namami tam pranjaliranjaneyam || manojavam marutatulyavegam jitendriyam buddhimatam
    varishtham | vatatmajam vanarayuthamukhyam shriramadutam shirasa namami || udyadadityasankasham udarabhujavikramam
    | kandarpakotilavanyam sarvavidyavisharadam || shriramahridayanandam bhaktakalpamahiruham | abhayam
    varadam dorbhyam kalaye marutatmajam || shrirama rama rameti rame rame manorame | sahasranama tattulyam
    ramanama varanane || padau vayusutah patu ramadutastadangulih | gulphau harishvarah patu janghe carnavalanghanah
    || januni marutih patu uru patvasurantakah | guhyam vajratanuh patu jaghanam tu jagaddhitah || anjaneyah
    katim patu nabhim saumitrijivanah | udaram patu hridgehi hridayam ca mahabalah || vaksho valayudhah
    patu stanau ca'mitavikramah | parshvau jitendriyah patu bahu sugrivamantrakrit || karavaksha jayi
    patu hanumamshca tadangulih | prishtham bhavishyadrbahma ca skandhau mati matam varah || kantham patu
    kapishreshtho mukham ravanadarpaha | vaktram ca vaktripravano netre devaganastutah || brahmastrasanmanakaro
    bhruvau me patu sarvada | kamarupah kapole me phalam vajranakho'vatu || shiro me patu satatam janakishokanashanah
    | shriramabhaktapravarah patu sarvakalebaram || mamahni patu sarvajnah patu ratrau mahayashah | vivasvadantevasi
    ca sandhyayoh patu sarvada || brahmadidevatadattavarah patu nirantaram | ya idam kavacam nityam pathecca
    shrinuyannarah || dirghamayuravapnoti balam drishtim ca vindati | padakranta bhavishyanti pathatastasya
    shatravah | sthiram sukirtimarogyam labhate shashvatam sukham || iti nigaditavakyavritta tubhyam sakalamapi
    svayamanjaneya vrittam | api nijajanarakshanaikadiksho vashaga tadiya mahamanuprabhavah || iti shri
    hanumat kavacam ||
  devanagari: अस्य श्री हनुमत् कवचस्तोत्रमहामन्त्रस्य वसिष्ठ ऋषिः अनुष्टुप् छन्दः श्री हनुमान् देवता मारुतात्मज
    इति बीजं अञ्जनासूनुरिति शक्तिः वायुपुत्र इति कीलकं हनुमत्प्रसाद सिद्ध्यर्थे जपे विनियोगः ॥ उल्लङ्घ्य
    सिन्धोस्सलिलं सलीलं यश्शोकवह्निं जनकात्मजायाः । आदाय तेनैव ददाह लङ्कां नमामि तं प्राञ्जलिराञ्जनेयम्
    ॥ मनोजवं मारुततुल्यवेगं जितेन्द्रियं बुद्धिमतां वरिष्ठम् । वातात्मजं वानरयूथमुख्यं श्रीरामदूतं शिरसा
    नमामि ॥ उद्यदादित्यसङ्काशं उदारभुजविक्रमम् । कन्दर्पकोटिलावण्यं सर्वविद्याविशारदम् ॥ श्रीरामहृदयानन्दं
    भक्तकल्पमहीरुहम् । अभयं वरदं दोर्भ्यां कलये मारुतात्मजम् ॥ श्रीराम राम रामेति रमे रामे मनोरमे । सहस्रनाम
    तत्तुल्यं रामनाम वरानने ॥ पादौ वायुसुतः पातु रामदूतस्तदङ्गुलीः । गुल्फौ हरीश्वरः पातु जङ्घे चार्णवलङ्घनः
    ॥ जानुनी मारुतिः पातु ऊरू पात्वसुरान्तकः । गुह्यं वज्रतनुः पातु जघनं तु जगद्धितः ॥ आञ्जनेयः कटिं पातु
    नाभिं सौमित्रिजीवनः । उदरं पातु हृद्गेही हृदयं च महाबलः ॥ वक्षो वालायुधः पातु स्तनौ चाऽमितविक्रमः
    । पार्श्वौ जितेन्द्रियः पातु बाहू सुग्रीवमन्त्रकृत् ॥ करावक्ष जयी पातु हनुमांश्च तदङ्गुलीः । पृष्ठं
    भविष्यद्र्बह्मा च स्कन्धौ मति मतां वरः ॥ कण्ठं पातु कपिश्रेष्ठो मुखं रावणदर्पहा । वक्त्रं च वक्तृप्रवणो
    नेत्रे देवगणस्तुतः ॥ ब्रह्मास्त्रसन्मानकरो भ्रुवौ मे पातु सर्वदा । कामरूपः कपोले मे फालं वज्रनखोऽवतु
    ॥ शिरो मे पातु सततं जानकीशोकनाशनः । श्रीरामभक्तप्रवरः पातु सर्वकलेबरम् ॥ मामह्नि पातु सर्वज्ञः पातु
    रात्रौ महायशाः । विवस्वदन्तेवासी च सन्ध्ययोः पातु सर्वदा ॥ ब्रह्मादिदेवतादत्तवरः पातु निरन्तरम् ।
    य इदं कवचं नित्यं पठेच्च शृणुयान्नरः ॥ दीर्घमायुरवाप्नोति बलं दृष्टिं च विन्दति । पादाक्रान्ता भविष्यन्ति
    पठतस्तस्य शत्रवः । स्थिरां सुकीर्तिमारोग्यं लभते शाश्वतं सुखम् ॥ इति निगदितवाक्यवृत्त तुभ्यं सकलमपि
    स्वयमाञ्जनेय वृत्तम् । अपि निजजनरक्षणैकदीक्षो वशग तदीय महामनुप्रभावः ॥ इति श्री हनुमत् कवचम् ॥
