id: upadeshadashakam
category: upanishad
name:
  english: upadeshadashakam
  devanagari: उपदेशदशकम्
content:
  english: rinoti parijighrati ca yena svadayati vacamabhivyaktyavishayena | shashvadadhivishvamanupashyati
    dhiyam yattattvamasi tattvamasi tattvamasi tattvam || 7|| satvagunavrittipatunrittaparivartaningati
    manidyutinirangamapasangam | tejayati yanna ravicandramukhatejah tattvamasi tattvamasi tattvamasi
    tattvam || 8|| vastu jagatashca yadanantaramabahyam yasya ca jagattadanantaramabahyam | yacca jagadetadajagacca
    parishuddham tattvamasi tattvamasi tattvamasi tattvam || 9|| advayamanadimadanantaramanantam santatasukham
    tadupashantagunamoham | jyotiranuditakamanastamitamekam tattvamasi tattvamasi tattvamasi taccam ||
    10|| guhyamidametadupadeshadashakam yastvaktasalaishana gunau gurupurassan | shilayati so'pi ca grinati
    gurubhutah tattvamasi tattvamasi tattvamasi tattvam || 11|| nistamasi nirajasi nirgalitasatve tejasi
    vivekajushi bhedamatishunyam | yadvacanamanasapadadigamanantam tattvamasi taccamasi tattvamasi tattvam
    || 12|| shriramabhadrayogindracaranambujarenuna | upadesha dashashloki krishnanandena nirmita | iti
    krishnanandakritishu upadeshadashakam sampurnam ||
  devanagari: ृणोति परिजिघ्रति च येन स्वादयति वाचमभिव्यक्त्यविशयेन । शश्वदधिविश्वमनुपश्यति धियं यत्तत्त्वमसि
    तत्त्वमसि तत्त्वमसि तत्त्वम् ॥ ७॥ सत्वगुणवृत्तिपटुनृत्तपरिवर्तानिङ्गति मणिद्युतिनिरङ्गमपसङ्गम् । तेजयति
    यन्न रविचन्द्रमुखतेजः तत्त्वमसि तत्त्वमसि तत्त्वमसि तत्त्वम् ॥ ८॥ वस्तु जगतश्च यदनन्तरमबाह्यं यस्य
    च जगत्तदनन्तरमबाह्यम् । यच्च जगदेतदजगच्च परिशुद्धं तत्त्वमसि तत्त्वमसि तत्त्वमसि तत्त्वम् ॥ ९॥ अद्वयमनादिमदनन्तरमनन्तं
    सन्ततसुखं तदुपशान्तगुणमोहम् । ज्योतिरनुदीतकमनस्तमितमेकं तत्त्वमसि तत्त्वमसि तत्त्वमसि तच्चम् ॥ १०॥
    गुह्यमिदमेतदुपदेशदशकं यस्त्वक्तसलैषण गुणौ गुरुपुरस्सन् । शीलयति सोऽपि च गृणाति गुरुभूतः तत्त्वमसि
    तत्त्वमसि तत्त्वमसि तत्त्वम् ॥ ११॥ निस्तमसि नीरजसि निर्गलितसत्वे तेजसि विवेकजुषि भेदमतिशून्यम् । यद्वचनमानसपदादिगमनन्तं
    तत्त्वमसि तच्चमसि तत्त्वमसि तत्त्वम् ॥ १२॥ श्रीरामभद्रयोगीन्द्रचरणाम्बुजरेणुना । उपदेश दशश्लोकी कृष्णानन्देन
    निर्मिता । इति कृष्णानन्दकृतिषु उपदेशदशकं सम्पूर्णम् ॥
