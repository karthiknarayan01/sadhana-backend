id: vyasastotram-2
category: stotram
name:
  english: vyasastotram 2
  devanagari: व्यासस्तोत्रम् २
content:
  english: jnanavijnanalinam tasmin jatam bharatambhojapushpam | hamsahamsa modita yasya modat tyaktvasaram
    samsmritim yanti param || 1|| manam yasya vacah surasuraganaih sadbhirnarairmanyate jnanam yena ca
    bhanyate bhramaharam shantipradam camritam | yadvacyarthacatushtayantadrishayah prahurnrinam tushtaye
    yasminnasti na casya tatkvacidapi vyasam tamenam bhaje || 2|| bharatasya mishato nigamartho bharate
    prakatitah paramarthah | yena samsritivihinajananam samskritirbhavati camritahetuh || 3|| bhaktiviraktyanubhutipradhanam
    keshavakirtyamritaikanidhanam | yena mude nikhilasya puranam vyasamaham pranamami puranam || 4|| krishnadvaipayanam
    vande vyasam tamaranipatim | shuko yanmukhato jato yanmukhatparamagamam || 5|| ityugrashravasa gitam
    janina romaharshaneh | pathedva sha
  devanagari: ज्ञानविज्ञानलीनं तस्मिन् जातं भारताम्भोजपुष्पम् । हंसाहंसा मोदिता यस्य मोदात् त्यक्त्वासारां
    संस्मृतिं यान्ति पारम् ॥ १॥ मानं यस्य वचः सुरासुरगणैः सद्भिर्नरैर्मन्यते ज्ञानं येन च भण्यते भ्रमहरं
    शान्तिप्रदं चामृतम् । यद्वाच्यार्थचतुष्टयन्तदृषयः प्राहुर्नृणां तुष्टये यस्मिन्नास्ति न चास्य तत्क्वचिदपि
    व्यासं तमेनं भजे ॥ २॥ भारतस्य मिषतो निगमार्थो भारते प्रकटितः परमार्थः । येन संसृतिविहीनजनानां संस्कृतिर्भवति
    चामृतहेतुः ॥ ३॥ भक्तिविरक्त्यनुभूतिप्रधानं केशवकीर्त्यमृतैकनिधानम् । येन मुदे निखिलस्य पुराणं व्यासमहं
    प्रणमामि पुराणम् ॥ ४॥ कृष्णद्वैपायनं वन्दे व्यासं तमरणीपतिम् । शुको यन्मुखतो जातो यन्मुखात्परमागमम्
    ॥ ५॥ इत्युग्रश्रवसा गीतं जनिना रोमहर्षणेः । पठेद्वा श
