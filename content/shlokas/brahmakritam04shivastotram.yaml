id: brahmakritam04shivastotram
category: stotram
name:
  english: brahmakritam04shivastotram
  devanagari: ब्रह्मकृतं०४शिवस्तोत्रम्
content:
  english: brahmakritam 4 shivastotram brahmovaca | tvam lingarupi tu mahaprabhavo vedantavedyo'si mahatmarupi
    | yenaiva sarve jagadatmamulam kritam sadanandaparena nityam || 2|| tvam sakshi sarvalokanam harta
    tvam ca vicakshanah | rakshano'si mahadeva bhairavo'si jagatpate || 3|| tvaya lingasvarupena vyaptametajjagattrayam
    | kshudrashcaiva vayam natha mayamohitacetasah || 4|| aham sura'surah sarve yakshagandharvarakshasah
    | pannagashca pishacashca tatha vidyadhara hyami || 5|| tvam hi vishvasrijam srashta tvam hi devo
    jagatpatih | karta tvam bhuvanasyasya tvam harta purushah parah || 6|| trahyasmakam mahadeva deva
    deva namo'stu te | 7
  devanagari: ब्रह्मकृतं ४ शिवस्तोत्रम् ब्रह्मोवाच । त्वं लिङ्गरूपी तु महाप्रभावो वेदान्तवेद्योऽसि महात्मरूपि
    । येनैव सर्वे जगदात्ममूलं कृतं सदानन्दपरेण नित्यम् ॥ २॥ त्वं साक्षी सर्वलोकानां हर्ता त्वं च विचक्षणः
    । रक्षणोऽसि महादेव भैरवोऽसि जगत्पते ॥ ३॥ त्वया लिङ्गस्वरूपेण व्याप्तमेतज्जगत्त्रयम् । क्षुद्राश्चैव
    वयं नाथ मायामोहितचेतसः ॥ ४॥ अहं सुराऽसुराः सर्वे यक्षगन्धर्वराक्षसाः । पन्नगाश्च पिशाचाश्च तथा विद्याधरा
    ह्यमी ॥ ५॥ त्वं हि विश्वसृजां स्रष्टा त्वं हि देवो जगत्पतिः । कर्ता त्वं भुवनस्यास्य त्वं हर्ता पुरुषः
    परः ॥ ६॥ त्राह्यस्माकं महादेव देव देव नमोऽस्तु ते । ७
