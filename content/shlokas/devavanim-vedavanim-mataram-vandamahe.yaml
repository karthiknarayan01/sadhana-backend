id: devavanim-vedavanim-mataram-vandamahe
category: stotram
name:
  english: Devavanim Vedavanim Mataram Vandamahe
content:
  english: devavanim vedavanim mataram vandamahe | ciranavina cirapuranim sadaram vandamahe || dhru||
    divyasamskritirakshanaya tatpara bhuvane bhramantah | lokajagaranaya siddhah sanghatanamantram japantah
    | kritipara lakshyaikanishtha bharatam sevamahe || || bhedabhavanivaranaya bandhutamanubhavayema |
    karmana manasa ca vacasa matrivandanamacarema | kirtidhanapadakamanabhirvirahita modamahe || || samskritervimukham
    samajam jivanena shikshayema | manukuladarsham vayam vai palayitva darshayema | jivanam samskrita
    hitartham hyarpitam manyamahe || || vayamasadhyam lakshyametat samskritena sadhayantah | tyagadhairyasamarpanena
    navalamitihasam likhantah | janmabhumisamarcanena sarvatah spandamahe || || bharatah sodarah smo bhavaneyam
    hridi nidhaya | vayam samskritasainikah sajjita naijam vihaya | paramavaibhavasadhanaya varamaho yacamahe
    || || devavanim vedavanim mataram vandamahe ciranavinam cirapuranim sadaram vandamahe ||
  devanagari: देववाणीं वेदवाणीं मातरं वन्दामहे । चिरनवीना चिरपुराणीं सादरं वन्दामहे ॥ ध्रु॥ दिव्यसंस्कृतिरक्षणाय
    तत्परा भुवने भ्रमन्तः । लोकजागरणाय सिद्धाः सङ्घटनमन्त्रं जपन्तः । कृतिपरा लक्ष्यैकनिष्ठा भारतं सेवामहे
    ॥ ॥ भेदभावनिवारणाय बन्धुतामनुभावयेम । कर्मणा मनसा च वचसा मातृवन्दनमाचरेम । कीर्तिधनपदकामनाभिर्विरहिता
    मोदामहे ॥ ॥ संस्कृतेर्विमुखं समाजं जीवनेन शिक्षयेम । मानुकूलादर्शं वयं वै पालयित्वा दर्शयेम । जीवनं
    संस्कृत हितार्थं ह्यर्पितं मन्यामहे ॥ ॥ वयमसाध्यं लक्ष्यमेतत् संस्कृतेन साधयन्तः । त्यागधैर्यसमर्पणेन
    नवलमितिहासं लिखन्तः । जन्मभूमिसमर्चनेन सर्वतः स्पन्दामहे ॥ ॥ भारताः सोदराः स्मो भावनेयं हृदि निधाय
    । वयं संस्कृतसैनिकाः सज्जीता नैजं विहाय । परमवैभवसाधनाया वरमहो याचामहे ॥ ॥ देववाणीं वेदवाणीं मातरं
    वन्दामहे चिरनवीनां चिरपुराणीं सादरं वन्दामहे ॥
