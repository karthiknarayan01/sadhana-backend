id: narayaniyam-dashaka-51
category: stotram
name:
  english: Narayaniyam Dashaka 51
content:
  english: kadacana vrajashishubhih samam bhavan vanashane vihitamatih pragetaram | samavrito bahutaravatsamandalaih
    satemanairniragamadisha jemanaih || || viniryatastava caranambujadvaya dudancitam tribhuvanapavanam
    rajah | maharshayah pulakadharaih kalebarai ruduhire dhritabhavadikshanotsavah || || pracarayatyaviralashadvale
    tale pashun vibho bhavati samam kumarakaih | aghasuro nyarunadaghaya vartani bhayanakah sapadi shayanakakritih
    || || mahacalapratimatanorguhanibha prasaritaprathitamukhasya kanane | mukhodaram viharanakautukadgatah
    kumarakah kimapi vidurage tvayi || || pramadatah pravishati pannagodaram kvathattanau pashupakule
    savatsake | vidannidam tvamapi viveshitha prabho suhrijjanam visharanamashu rakshitum || || galodare
    vipulitavarshmana tvaya mahorage luthati niruddhamarute | drutam bhavan vidalitakanthamandalo vimocayan
    pashupapashun viniryayau || || kshanam divi tvadupagamarthamasthitam mahasuraprabhavamaho maho mahat
    | vinirgate tvayi tu nilinamanjasa nabhahsthale nanrituratho jaguh surah || || savismayaih kamalabhavadibhih
    surai ranudrutastadanu gatah kumarakaih | dine punastarunadashamupeyushi svakairbhavanatanuta bhojanotsavam
    || || vishanikamapi muralim nitambake niveshayan kabaladharah karambuje | prahasayan kalavacanaih
    kumarakan bubhojitha tridashaganairmuda nutah || || sukhashanam tviha tava gopamandale makhashanat
    priyamiva devamandale | iti stutastridashavarairjagatpate marutpurinilaya gadat prapahi mam ||
  devanagari: कदाचन व्रजशिशुभिः समं भवान् वनाशने विहितमतिः प्रगेतराम् । समावृतो बहुतरवत्समण्डलैः सतेमनैर्निरगमदीश
    जेमनैः ॥ ॥ विनिर्यतस्तव चरणाम्बुजद्वया दुदञ्चितं त्रिभुवनपावनं रजः । महर्षयः पुलकधरैः कलेबरै रुदूहिरे
    धृतभवदीक्षणोत्सवाः ॥ ॥ प्रचारयत्यविरलशाद्वले तले पशून् विभो भवति समं कुमारकैः । अघासुरो न्यरुणदघाय
    वर्तनी भयानकः सपदि शयानकाकृतिः ॥ ॥ महाचलप्रतिमतनोर्गुहानिभ प्रसारितप्रथितमुखस्य कानने । मुखोदरं विहरणकौतुकाद्गताः
    कुमारकाः किमपि विदूरगे त्वयि ॥ ॥ प्रमादतः प्रविशति पन्नगोदरं क्वथत्तनौ पशुपकुले सवात्सके । विदन्निदं
    त्वमपि विवेशिथ प्रभो सुहृज्जनं विशरणमाशु रक्षितुम् ॥ ॥ गलोदरे विपुलितवर्ष्मणा त्वया महोरगे लुठति निरुद्धमारुते
    । द्रुतं भवान् विदलितकण्ठमण्डलो विमोचयन् पशुपपशून् विनिर्ययौ ॥ ॥ क्षणं दिवि त्वदुपगमार्थमास्थितं महासुरप्रभवमहो
    महो महत् । विनिर्गते त्वयि तु निलीनमञ्जसा नभःस्थले ननृतुरथो जगुः सुराः ॥ ॥ सविस्मयैः कमलभवादिभिः सुरै
    रनुद्रुतस्तदनु गतः कुमारकैः । दिने पुनस्तरुणदशामुपेयुषि स्वकैर्भवानतनुत भोजनोत्सवम् ॥ ॥ विषाणिकामपि
    मुरलीं नितम्बके निवेशयन् कबलधरः कराम्बुजे । प्रहासयन् कलवचनैः कुमारकान् बुभोजिथ त्रिदशगणैर्मुदा नुतः
    ॥ ॥ सुखाशनं त्विह तव गोपमण्डले मखाशनात् प्रियमिव देवमण्डले । इति स्तुतस्त्रिदशवरैर्जगत्पते मरुत्पुरीनिलय
    गदात् प्रपाहि माम् ॥
