    । इ॒षे त्वो॒र्जेत्वा॑ वा॒यव॑स्स्थो पा॒यव॑स्थ दे॒वो व॑स्सवि॒ता प्रार्प॑यतु॒ श्रेष्ठ॑तमाय॒ कर्म॑णे ।
