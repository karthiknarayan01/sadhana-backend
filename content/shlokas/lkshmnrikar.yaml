id: lkshmnrikar
category: stotram
name:
  english: lkshmnrikar
  devanagari: ल्क्ष्म्न्रिकर्
content:
  english: vyasambarisha shukashaunaka hrinnivasa bhaktanuruktaparipalanaparijata lakshminrisimha mama
    dehi karavalambam || 17|| samsarayutha gajasamhatisimhadamshtra bhitasya dushtamaidaitya bhayankarena
    | pranaprayana bhavabhiti nivaranena lakshminrisimha mama dehi karavalambam || 18|| lakshminrisimhacaranabjamadhuvratena
    stotram kritam shubhakaram bhuvi shankarena | ye tatpathanti manuja haribhaktiyukta
  devanagari: व्यासाम्बरीष शुकशौनक हृन्निवास भक्तानुरुक्तपरिपालनपारिजात लक्ष्मीनृसिंह मम देहि करावलम्बम्
    ॥ १७॥ संसारयूथ गजसंहतिसिंहदंष्ट्रा भीतस्य दुष्टमैदैत्य भयङ्करेण । प्राणप्रयाण भवभीति निवारणेन लक्ष्मीनृसिंह
    मम देहि करावलम्बम् ॥ १८॥ लक्ष्मीनृसिंहचरणाब्जमधुव्रतेन स्तोत्रं कृतं शुभकरं भुवि शङ्करेण । ये तत्पठन्ति
    मनुजा हरिभक्तियुक्ता
meaning: {}
