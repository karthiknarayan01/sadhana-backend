id: bhagirathakritam1shivastotram
category: stotram
name:
  english: bhagirathakritam1shivastotram
  devanagari: भगीरथकृतं१शिवस्तोत्रम्
content:
  english: bhagirathakritam 1 shivastotram bhagiratha uvaca | balo'ham balabuddhishca balacandradhara
    prabho | naham kimapi janami tatah prito bhava prabho || 56|| vagbhirmanobhih kritibhih kadacinmamopakurvanti
    hite rata ye | tebhyo hitartham tviha camaresha somam namasyami suradipujyam || 57|| utpadito yairabhivardhitashca
    samanagotrashca samanadharma | teshamabhishtani shivah karotu balendumaulim pranato'smi nityam ||
    58|| iti brahmapurane ashtasaptatitamadhyayantargatam bhagirathakritam shivastotram samaptam | brahmapurana
    | adhyaya 78
  devanagari: भगीरथकृतं १ शिवस्तोत्रम् भगीरथ उवाच । बालोऽहं बालबुद्धिश्च बालचन्द्रधर प्रभो । नाहं किमपि
    जानामि ततः प्रीतो भव प्रभो ॥ ५६॥ वाग्भिर्मनोभिः कृतिभिः कदाचिन्ममोपकुर्वन्ति हिते रता ये । तेभ्यो
    हितार्थं त्विह चामरेश सोमं नमस्यामि सुरादिपूज्यम् ॥ ५७॥ उत्पादितो यैरभिवर्धितश्च समानगोत्रश्च समानधर्मा
    । तेषामभीष्टानि शिवः करोतु बालेन्दुमौलिं प्रणतोऽस्मि नित्यम् ॥ ५८॥ इति ब्रह्मपुराणे अष्टसप्ततितमाध्यायान्तर्गतं
    भगीरथकृतं शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय ७८
meaning: {}
