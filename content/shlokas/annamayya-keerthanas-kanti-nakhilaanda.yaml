id: annamayya-keerthanas-kanti-nakhilaanda
category: stotram
name:
  english: Annamayya Keerthanas Kanti Nakhilaanda
content:
  english: pallavi kanti nakhilanda tati kartanadhikuni ganti | kanti naghamulu vidukònti nijamurti ganti
    || mahaniya ghana phanamanula shailamu ganti | bahu vibhavamula mantapamulu ganti | sahaja navaratna
    kancana vedikalu ganti | rahi vahincina gopuramulavè kanti || kanti nakhilanda tati kartanadhikuni
    ganti | pavanambaina papavinashamu ganti | kaivashambagu gagana ganga ganti | daivikapu punyatirthamulèlla
    bòdaganti | kovidulu gòniyadu koneri ganti || kanti nakhilanda tati kartanadhikuni ganti | parama
    yogindrulaku bhavagocaramaina | sarileni padambujamula ganti | tiramaina giricupu divyahastamu ganti
    | tiru venkatacaladhipu judaganti || kanti nakhilanda tati kartanadhikuni ganti | kanti naghamulu
    vidukònti nijamurti ganti ||
  devanagari: पल्लवि कण्टि नखिलाण्ड तति कर्तनधिकुनि गण्टि । कण्टि नघमुलु वीडुकॊण्टि निजमूर्ति गण्टि ॥
    महनीय घन फणामणुल शैलमु गण्टि । बहु विभवमुल मण्टपमुलु गण्टि । सहज नवरत्न काञ्चन वेदिकलु गण्टि । रहि
    वहिञ्चिन गोपुरमुलवॆ कण्टि ॥ कण्टि नखिलाण्ड तति कर्तनधिकुनि गण्टि । पावनम्बैन पापविनाशमु गण्टि । कैवशम्बगु
    गगन गङ्ग गण्टि । दैविकपु पुण्यतीर्थमुलॆल्ल बॊडगण्टि । कोविदुलु गॊनियाडु कोनेरि गण्टि ॥ कण्टि नखिलाण्ड
    तति कर्तनधिकुनि गण्टि । परम योगीन्द्रुलकु भावगोचरमैन । सरिलेनि पादाम्बुजमुल गण्टि । तिरमैन गिरिचूपु
    दिव्यहस्तमु गण्टि । तिरु वेङ्कटाचलाधिपु जूडगण्टि ॥ कण्टि नखिलाण्ड तति कर्तनधिकुनि गण्टि । कण्टि नघमुलु
    वीडुकॊण्टि निजमूर्ति गण्टि ॥
