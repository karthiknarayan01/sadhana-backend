id: carnatic-music-geethams-sree-gananatha-lambodara
category: stotram
name:
  english: Carnatic Music Geethams - Sree Gananatha (Lambodara)
content:
  english: mayamalava gaula janyaraga caturasra jati rupaka talam angah kannada sahityam pallavi lambodara
    lakumikara ambasuta amaravinuta caranam shri gananatha sindhura varna karuna sagara karivadana siddha
    carana gana sevita siddhi vinayaka te namo namo adi pujita sarvottama te namo namo | ga na na tha
    || sim dhu | ra va rna || ri ma | pa da ma pa || da pa | ma ga ri sa || ka ru | na sa ga ra || ka
    ri | va da na ga ri || sa ri | ga ri sa || ri ma | pa da ma pa || da pa | ma ga ri sa || am su ta
    || a ma | ra vi nu ta || sa ri | ma ga ri || sa ri | ga ri sa da ra || la ku | mi ka ra | da pa ma
    pa || si ddha | ca vi ta || ri ma | pa da ma pa || da pa | ma ga ri sa || si ddhi | vi na ya ka ||
    te | da pa ma pa || sa ka | la vi dya ji ta || ri ma | pa da ma pa || da pa | ma ga ri sa || sar
  devanagari: मायामालव गौल जन्यराग चतुरस्र जाति रूपक तालम् अङ्गाः कन्नड साहित्यम् पल्लवि लम्बोदर लकुमिकर
    अम्बासुत अमरविनुत चरणं श्री गणनाथ सिन्धूर वर्ण करुणा सागर करिवदन सिद्ध चारण गण सेवित सिद्धि विनायक
    ते नमो नमो अदि पूजित सर्वोत्तम ते नमो नमो । ग ण ना थ ॥ सिं धू । र व र्ण ॥ रि म । प द म प ॥ द प । म
    ग रि स ॥ क रु । णा सा ग र ॥ क रि । व द न ग रि ॥ स रि । ग रि स ॥ रि म । प द म प ॥ द प । म ग रि स ॥
    अं सु त ॥ अ म । र वि नु त ॥ स रि । म ग रि ॥ स रि । ग रि स द र ॥ ल कु । मि क रा । द प म प ॥ सि द्ध
    । चा वि त ॥ रि म । प द म प ॥ द प । म ग रि स ॥ सि द्धि । वि ना य क ॥ ते । द प म प ॥ स क । ल वि द्या
    जि त ॥ रि म । प द म प ॥ द प । म ग रि स ॥ सर्
