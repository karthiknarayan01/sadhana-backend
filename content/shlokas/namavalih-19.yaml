    कूपपातकपापघ्नाय । कूर्मासनपरिग्रहाय । कूष्माण्डादि प्रतिभयाय नमः । १०० ॐ कीर्तिदाय नमः । कीर्तनप्रियाय
    । केशवाराधकाय । केतुदोषघ्नाय । केवलेष्टदाय । केतकीकुसुमासक्ताय । केसरद्रवलोलुपाय । कैवल्यदात्रे ।
