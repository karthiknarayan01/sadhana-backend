id: dhruva-stuti
category: stotram
name:
  english: Dhruva Stuti
  devanagari: ध्रुवस्तुतिः
content:
  english: yo'ntah pravishya mama vacamimam prasuptam sanjivayatyakhilashaktidharah svadhamna anyamshca
    hastacaranashravanatvagadin pranannamo bhagavate purushaya tubhyam ekastvameva bhagavannidamatmashaktya
    mayakhyayorugunaya mahadadyashesham srishtva'nuvishya purushastadasadguneshu naneva darushu vibhavasuvadvibhasi
    tvaddattaya vayunayedamacashta vishvam suptaprabuddha iva natha bhavatprapannah tasyapavargyasharanam
    tava padamulam vismaryate kritavida kathamartabandho nunam vimushtamatayastava mayaya te ye tvam bhavapyayavimokshanamanyahetoh
    arcanti kalpakatarum kunapopabhogyam icchanti yatsparshajam niraye'pi nrinam ya nirvritistanubhritam
    tava padapadma dhyanadbhavajjanakathashravanena va syat sa brahmani svamahimanyapi natha ma bhut kim
    tvantakasilulitatpatatam vimanat bhaktim muhuh pravahatam tvayi me prasango bhuyadananta mahatamamalashayanam
    yenanjasolbanamuruvyasanam bhavabdhim neshye bhavadgunakathamritapanamattah te na smarantyatitaram
    priyamisha martyam ye canvadah sutasuhridgrihavittadarah ye tvabjanabha bhavadiyapadaravinda saugandhyalubdhahridayeshu
    kritaprasangah tiryannagadvijasarisripadevadaitya martyadibhih paricitam sadasadvishesham rupam sthavishthamaja
    te mahadadyanekam natah param parama vedmi na yatra vadah kalpanta etadakhilam jatharena grihnan shete
    pumansvadriganantasakhastadanke yannabhisindhuruhakancanalokapadma garbhe dyumanbhagavate pranato'smi
    tasmai tvam nityamuktaparishuddhavibuddha atma kutastha adipurusho bhagavamstryadhishah yad buddhyavasthitimakhanditaya
    svadrishtya drashta sthitavadhimakho vyatirikta asse yasminviruddhagatayo hyanisham patanti vidyadayo
    vividhashaktaya anupurvyat tad brahma vishvabhavamekamanantamadyam anandamatramavikaramaham prapadye
    satyashisho hi bhagavamstava padapadmam ashistathanubhajatah purusharthamurteh apyevamarya bhagavan
    paripati dinan vashreva vatsakamanugrahakataro'sman ||iti shrimadbhagavate mahapurane paramahamsyam
    samhitayam caturthe skandhe navame'dhyaye shri dhruvastutih sampurna||
  devanagari: योऽन्तः प्रविश्य मम वाचमिमां प्रसुप्तां सञ्जीवयत्यखिलशक्तिधरः स्वधाम्ना अन्यांश्च हस्तचरणश्रवणत्वगादीन्
    प्राणान्नमो भगवते पुरुषाय तुभ्यम् एकस्त्वमेव भगवन्निदमात्मशक्त्या मायाख्ययोरुगुणया महदाद्यशेषम् सृष्ट्वाऽनुविश्य
    पुरुषस्तदसद्गुणेषु नानेव दारुषु विभावसुवद्विभासि त्वद्दत्तया वयुनयेदमचष्ट विश्वं सुप्तप्रबुद्ध इव
    नाथ भवत्प्रपन्नः तस्यापवर्ग्यशरणं तव पादमूलं विस्मर्यते कृतविदा कथमार्तबन्धो नूनं विमुष्टमतयस्तव मायया
    ते ये त्वां भवाप्ययविमोक्षणमन्यहेतोः अर्चन्ति कल्पकतरुं कुणपोपभोग्यम् इच्छन्ति यत्स्पर्शजं निरयेऽपि
    नॄणाम् या निर्वृतिस्तनुभृतां तव पादपद्म ध्यानाद्भवज्जनकथाश्रवणेन वा स्यात् सा ब्रह्मणि स्वमहिमन्यपि
    नाथ मा भूत् किं त्वन्तकासिलुलितात्पततां विमानात् भक्तिं मुहुः प्रवहतां त्वयि मे प्रसङ्गो भूयादनन्त
    महताममलाशयानाम् येनाञ्जसोल्बणमुरुव्यसनं भवाब्धिं नेष्ये भवद्गुणकथामृतपानमत्तः ते न स्मरन्त्यतितरां
    प्रियमीश मर्त्यं ये चान्वदः सुतसुहृद्गृहवित्तदाराः ये त्वब्जनाभ भवदीयपदारविन्द सौगन्ध्यलुब्धहृदयेषु
    कृतप्रसङ्गाः तिर्यङ्नगद्विजसरीसृपदेवदैत्य मर्त्यादिभिः परिचितं सदसद्विशेषम् रूपं स्थविष्ठमज ते महदाद्यनेकं
    नातः परं परम वेद्मि न यत्र वादः कल्पान्त एतदखिलं जठरेण गृह्णन् शेते पुमान्स्वदृगनन्तसखस्तदङ्के यन्नाभिसिन्धुरुहकाञ्चनलोकपद्म
    गर्भे द्युमान्भगवते प्रणतोऽस्मि तस्मै त्वं नित्यमुक्तपरिशुद्धविबुद्ध आत्मा कूटस्थ आदिपुरुषो भगवांस्त्र्यधीशः
    यद् बुद्ध्यवस्थितिमखण्डितया स्वदृष्ट्या द्रष्टा स्थितावधिमखो व्यतिरिक्त आस्से यस्मिन्विरुद्धगतयो ह्यनिशं
    पतन्ति विद्यादयो विविधशक्तय आनुपूर्व्यात् तद् ब्रह्म विश्वभवमेकमनन्तमाद्यम् आनन्दमात्रमविकारमहं प्रपद्ये
    सत्याशिषो हि भगवंस्तव पादपद्मम् आशीस्तथानुभजतः पुरुषार्थमूर्तेः अप्येवमर्य भगवान् परिपाति दीनान् वाश्रेव
    वत्सकमनुग्रहकातरोऽस्मान् ॥इति श्रीमद्भागवते महापुराणे पारमहंस्यां संहितायां चतुर्थे स्कन्धे नवमेऽध्याये
    श्री ध्रुवस्तुतिः सम्पूर्णा॥
