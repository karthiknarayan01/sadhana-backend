id: ganeshapurvashatakam-2
category: shataka
name:
  english: ganeshapurvashatakam
  devanagari: गणेशपूर्वशतकम्
content:
  english: shriganeshapurvashatakam satyajnananandam gajavadanam naumi siddhibuddhisham | kurve ganeshashatakam
    kujukenaham svabuddhishuddhayartham || 1|| dinmatrena ganapatergunaganavibhavadivarnanarupam | prayo
    vainayakakritividitamatapakriyavivritipurvam || 2|| yadyapi mandamatiraham gunalavamavagantumatitaram
    nalam | prayate tathapi vaditum lambodara te dayavalambena || 3|| jagatah sargadadyat pragapyekastvameva
    bhasi vibho | tasmadganapa bhavantam nikhilanidanam gadanti nigamantah || 4|| tvamato mayatitam sakalajagatkalpanadyadhishthanam
    | advaitasimabhutam vanmanasagocaram param brahma || 5|| sagunabrahmatmano ganapatishivashaktikeshavarka
    ye | tesham karanamahuh shuddhadvaitanuga yamatmanam || 6|| yah sarvavedavedyastattvamasipadadyatitarupo
    yah | yo yogivrindamrigyah paramatmanam tamashraye nityam || 7|| yatpurnayogalabhyam bhumatmakamamananti
    ganapatah | shuddham svamahimasamstham brahmasmin me manah sada smaratam || 8|| bhuma brahmaitat te
    shashtham ganapam ca pancamam prahuh | turyam ganeshamasya hi karyan sagunatmano'pi tan panca || 9||
    tatropasanakande parakashthabhutamasipadarthamayam | svanandam brahmaitadgajavadanamaham bhaje jagadvandyam
    || 10|| ganapatapungavah kila padamayanyasya pancamasyahuh | shaivadvaitadinam mukhyabrahmani yani
    catvari || 11|| avyakritam turiyam brahma trigunatmakam guganeshakhyam | vidyatmakam ganapate satatam
    durikarotu mama duritam || 12|| yasya hi nabhirbrahma vadanam vishnushca locanam rudrah | shaktishca
    vamaparshvam dakshinamarko'smitamayastvatma || 13|| jagratsvapnasushuptabrahma trigunatmakam ca yatproktam
    | vyakritamavidyakamapi tadapi vyaktam cakastu me citte || 14|| brahma svanandatmakavidya'vidyatmakaprabhedena
    | bhumabrahma catushpat prakashatam me'nisham hridakashe || 15|| mayasamarasayuktam shantigatam nishkalam
    param jyotih | yadbrahma padarupam ganeshadvaitalakshyabhutamasi || 16|| yo brahmapada adyah samyogayogapadayugayuktah
    tau padavapyuditavadhyaropapavadaparakashthe | sadasatsahajasamatmakacaturvidhanandapadarupastvam
    ravishaktishaharinam sanghatastvam shruto'si ganaraja || 17|| binduh so'hambodhah sankhyashceti prasiddhabhedayutah
    | vidyapado'pi tvam yogisamadhau grihitasuvisheshah || 18|| turyavidyapadastvameva satyanrito jagadrupah
    | sa virat hiranyagarbhavishaguneshaviti prabhedayutah || 19|| brahmamshasthitibhedah sarve caite
    sphurantu mama citte | prayo'samprajnatasamadhijneya ganesha karunabdhe || 20|| siddhirbuddhishceti
    dvidha hi vainayaki mahamaya | lokaikanayika sa tadupadhivashat kilasi bahudha tvam || 21|| evam mayopadhikaparatmarupam
    hi pancadha bhinnam | tadadasthagunabhedannirupasyapi te samamnatam || 22|| sadbrahma kila prathamam
    sakalajagadvijabhutarupam tvam | murtim vinayaka iti svecchavashato ganesha grihnasi || 23|| bijasya
    bhumirupa kevalamayadvitiyamurtiste | vartayati krityamakhilam bhuvaneshi sa shivo parashaktih ||
    24|| mayesham tu tritiyam ravimandalagam hiranmayam purusham | tvamamananti veda hyanavaratam kalacakranetaram
    || 25|| upahitaturiyamurtirmayayuktah parah shivo girishah | kalpantakalarupi tvameva sarvam ca sanjariharshi
    || 26|| mayamayo hi vishnurmayopadheshca pancami murtih | so'pi tvameva nikhilam lokam palayasi lilaya
    satatam || 27|| evam mayavashato ravishivashaktyadinamapancakabhak | dishatu madipsitamakhilam shuddhabrahmatmakam
    bhavadrupam || 28|| mayabaddhah shashthah prathamashariri hiranyagarbhastvam | tattatkarmanugunam
    karoshi sargam samastalokasya || 29|| prak padmasanarupagrahanadbhavato'pyupadhito bhinnah | etashca
    sagunamurtiralambya matani panca jatani || 30|| ete hi panca devah svasvadhareshu santi sarvatra |
    varnasvadharmavibhavattejorupastrivarna deheshu || 31|| gayatrigrahanena hi tattatejo visheshato bhati
    | tattajjatiguna apyutkrishtatvena tena jayante || 32|| muladhare ganapo manipure hariranahate shambhuh
    | rajati ravirvishuddhau brahmasurandhra shiva para shaktih || 33|| api ca shadadhareshu prapyaivam
    dhyanayogacittalayau | mukta bhavanti tasmat pancayatanarcane'tiharshaste || 34|| ganapatipancayatanam
    pancayatanam ravishvaradinam | yadva tadva kritamapi pujavishaye'timatratriptiste || 35|| prasadashuddhapuja
    ata eva vihaya pancadevanam | pancayatanasaparyam sagunasamashtayarcanam vadanti budhah || 36|| haryadiganeshantah
    pancaita brahmamurtayo munibhih | ata eva pranavasya ca gayatryashcapi devatah proktah || 37|| vyacakshate
    hi rishayo gayatryah pancadevataparam | pranavasyapi tathaiva prapancayanti sma pancadhapyarthan ||
    38|| ata esham pancanam brahmatvanirupane nishnatah | uttaramimamsah shat shuddhadvaitena tenire munayah
    || 31|| pratipadayanti caite yadyapyapatato vibhinnan vai | sarvesham hi rishinam prayastvayyeva paramatatparyam
    || 40|| ete panca matastha bhavatah sarveshu purvapujyatvam | vignadhipatyamangikurvanti yato ganadhipatyam
    ca || 41|| bhugatabijadi yatha padaparupena jayate jagati | brahmaiva bijabhutam prakritih prithivi
    taya hi samyogat || 42|| karanasukshmasthulaprapancarupena jayate kramashah | mulam ganapatirupam
    prapashcarupasya padapasyaivam || 43|| buddhih siddhishca phale mulam ganapo'sya vishvarupataroh |
    shakhah keshah kandam tvarko'khilamulamucyase'tastvam || 44|| sule jalasekat kila tarupatraphaladayo'pi
    vardhante | tava pujaya ganapate ravishivashaktyadayo'pi tripyanti || 45|| evam sagunabrahmavyapadeshavatam
    ca panca devanam | purnakalamshamshamshavatararupashca murtayo'nantah || 46|| bhavatah katipayamurtiravirbhavavatarataramukhah
    | vainayakamataviditaprakriyayaiva bravimi heramba || 47|| satyam jnanamanantam jyotirupam ca nirgunam
    brahma | etannirvyaparam gajapadavacyam layadihetutvat || 48|| yogindra gacchanti hi samadhinatreti
    gah smrito munibhih | pranavatmakajagadasmajjayata iti jah smritipratitarthah || 49|| gashvasau jashceti
    vyutpadayati smritirhi gajashabdam | esha pratipadayati prabhavapyayakaranam param brahma || 50||
    mulaprakritistriguna shuktau rajatam yatha tato jata | tadgatacitpratibimbam sagunabrahmeti kirtitam
    munibhih || 51|| onkarabrahmeti ca nara iti namni prakirtite tasya | sakalajyotirupam sagunasyoktam
    hi tattvavidvadbhih || 52|| mulavidyagatanaramadvaitabrahmarupamapi bibhrat | nirgunasagunajyotirumubhayatha
    tritiyamapyuktam || 53|| advaita iti sadatmetyamnayante tatha mahavakyah | ityuktani kramato namanyesham
    smrititihasadau || 54|| naravacyasakalarupo gajavacyo nishkalasvarupastvam | vignesha sakalanishkalarupamahavakyamurtidhari
    tvam || 55|| om tatsaditi hi bhedadbrahma proktam tridha sudhibhirapi | prathitam murtamarmtam murtamurtam
    tridha tadevamapi || 56|| namantarani sarvanyetanyuditani vedashirsheshu | kamalavallabha bhavatah
    purvoktatrividharupadharayituh || 57|| api canyani ganapate namani sahasrashah prasiddhani | karmajnanopasanakandeshu
    prithagvinayakadini || 58|| nirgunarupadhyanam na sadhakala prasidhyati kshipram | tadanugrahaya dharase
  devanagari: श्रीगणेशपूर्वशतकम् सत्यज्ञानानन्दं गजवदनं नौमि सिद्धिबुद्धीशम् । कुर्वे गणेशशतकं कुजुकेनाहं
    स्वबुद्धिशुद्धयर्थम् ॥ १॥ दिङ्मात्रेण गणपतेर्गुणगणविभवादिवर्णनारूपम् । प्रायो वैनायककृतिविदितमतपक्रियाविवृतिपूर्वम्
    ॥ २॥ यद्यपि मन्दमतिरहं गुणलवमवगन्तुमतितरां नालम् । प्रयते तथापि वदितुं लम्बोदर ते दयावलम्बेन ॥ ३॥
    जगतः सर्गादाद्यात् प्रागप्येकस्त्वमेव भासि विभो । तस्माद्गणप भवन्तं निखिलनिदानं गदन्ति निगमान्ताः
    ॥ ४॥ त्वमतो मायातीतं सकलजगत्कल्पनाद्यधिष्ठानम् । अद्वैतसीमभूतं वाङ्मानसागोचरं परं ब्रह्म ॥ ५॥ सगुणब्रह्मात्मानो
    गणपतिशिवशक्तिकेशवार्का ये । तेषां कारणमाहुः शुद्धाद्वैतानुगा यमात्मानम् ॥ ६॥ यः सर्ववेदवेद्यस्तत्त्वमसिपदाद्यतीतरूपो
    यः । यो योगिवृन्दमृग्यः परमात्मानं तमाश्रये नित्यम् ॥ ७॥ यत्पूर्णयोगलभ्यं भूमात्मकमामनन्ति गाणपताः
    । शुद्धं स्वमहिमसंस्थं ब्रह्मास्मिन् मे मनः सदा स्मरताम् ॥ ८॥ भूमा ब्रह्मैतत् ते षष्ठं गणपं च पञ्चमं
    प्राहुः । तुर्यं गणेशमस्य हि कार्यान् सगुणात्मनोऽपि तान् पञ्च ॥ ९॥ तत्रोपासनकाण्डे परकाष्ठाभूतमसिपदार्थमयम्
    । स्वानन्दं ब्रह्मैतद्गजवदनमहं भजे जगद्वन्द्यम् ॥ १०॥ गाणपतपुङ्गवाः किल पादमयान्यस्य पञ्चमस्याहुः
    । शैवाद्वैतादीनां मुख्यब्रह्माणि यानि चत्वारि ॥ ११॥ अव्याकृतं तुरीयं ब्रह्म त्रिगुणात्मकं गुगणेशाख्यम्
    । विद्यात्मकं गणपते सततं दूरीकरोतु मम दुरितम् ॥ १२॥ यस्य हि नाभिर्ब्रह्मा वदनं विष्णुश्च लोचनं रुद्रः
    । शक्तिश्च वामपार्श्वं दक्षिणमर्कोऽस्मितामयस्त्वात्मा ॥ १३॥ जाग्रत्स्वप्नसुषुप्तब्रह्म त्रिगुणात्मकं
    च यत्प्रोक्तम् । व्याकृतमाविद्यकमपि तदपि व्यक्तं चकास्तु मे चित्ते ॥ १४॥ ब्रह्म स्वानन्दात्मकविद्याऽविद्यात्मकप्रभेदेन
    । भूमब्रह्म चतुष्पात् प्रकाशतां मेऽनिशं हृदाकाशे ॥ १५॥ मायासमरसयुक्तं शान्तिगतं निष्कलं परं ज्योतिः
    । यद्ब्रह्म पादरूपं गाणेशाद्वैतलक्ष्यभूतमसि ॥ १६॥ यो ब्रह्मपाद आद्यः संयोगायोगपादयुगयुक्तः तौ पादावप्युदितावध्यारोपापवादपरकाष्ठे
    । सदसत्सहजसमात्मकचतुर्विधानन्दपादरूपस्त्वं रविशक्तीशहरीणां सङ्घातस्त्वं श्रुतोऽसि गणराज ॥ १७॥ बिन्दुः
    सोऽहम्बोधः साङ्ख्यश्चेति प्रसिद्धभेदयुतः । विद्यापादोऽपि त्वं योगिसमाधौ गृहीतसुविशेषः ॥ १८॥ तुर्याविद्यापादस्त्वमेव
    सत्यानृतो जगद्रूपः । स विराट् हिरण्यगर्भावीशगुणेशाविति प्रभेदयुतः ॥ १९॥ ब्रह्मांशस्थितिभेदाः सर्वे
    चैते स्फुरन्तु मम चित्ते । प्रायोऽसम्प्रज्ञातसमाधिज्ञेया गणेश करुणाब्धे ॥ २०॥ सिद्धिर्बुद्धिश्चेति
    द्विधा हि वैनायकी महामाया । लोकैकनायिका सा तदुपाधिवशात् किलासि बहुधा त्वम् ॥ २१॥ एवं मायोपाधिकपरात्मरूपं
    हि पञ्चधा भिन्नम् । तददस्थागुणभेदान्नीरूपस्यापि ते समाम्नातम् ॥ २२॥ सद्ब्रह्म किल प्रथमं सकलजगद्वीजभूतरूपं
    त्वम् । मूर्तिं विनायक इति स्वेच्छावशतो गणेश गृह्णासि ॥ २३॥ बीजस्य भूमिरूपा केवलमायाद्वितीयमूर्तिस्ते
    । वर्तयति कृत्यमखिलं भुवनेशी सा शिवो पराशक्तिः ॥ २४॥ मायेशं तु तृतीयं रविमण्डलगं हिरण्मयं पुरुषम्
    । त्वामामनन्ति वेदा ह्यनवरतं कालचक्रनेतारम् ॥ २५॥ उपहिततुरीयमूर्तिर्मायायुक्तः परः शिवो गिरीशः । कल्पान्तकालरूपी
    त्वमेव सर्वं च सञ्जरीहर्षि ॥ २६॥ मायामयो हि विष्णुर्मायोपाधेश्च पञ्चमी मूर्तिः । सोऽपि त्वमेव निखिलं
    लोकं पालयसि लीलया सततम् ॥ २७॥ एवं मायावशतो रविशिवशक्त्यादिनामपञ्चकभाक् । दिशतु मदीप्सितमखिलं शुद्धब्रह्मात्मकं
    भवद्रूपम् ॥ २८॥ मायाबद्धः षष्ठः प्रथमशरीरी हिरण्यगर्भस्त्वम् । तत्तत्कर्मानुगुणं करोषि सर्गं समस्तलोकस्य
    ॥ २९॥ प्राक् पद्मासनरूपग्रहणाद्भवतोऽप्युपाधितो भिन्नाः । एताश्च सगुणमूर्तीरालम्ब्य मतानि पञ्च जातानि
    ॥ ३०॥ एते हि पञ्च देवाः स्वस्वाधारेषु सन्ति सर्वत्र । वर्णस्वधर्मविभवात्तेजोरूपास्त्रिवर्ण देहेषु
    ॥ ३१॥ गायत्रीग्रहणेन हि तत्ततेजो विशेषतो भाति । तत्तज्जातिगुणा अप्युत्कृष्टत्वेन तेन जायन्ते ॥ ३२॥
    मूलाधारे गणपो मणिपूरे हरिरनाहते शम्भुः । राजति रविर्विशुद्धौ ब्रह्मसुरन्ध्र शिवा परा शक्तिः ॥ ३३॥
    अपि च षडाधारेषु प्राप्यैवं ध्यानयोगचित्तलयौ । मुक्ता भवन्ति तस्मात् पञ्चायतनार्चनेऽतिहर्षस्ते ॥ ३४॥
    गणपतिपञ्चायतनं पञ्चायतनं रवीश्वरादीनाम् । यद्वा तद्वा कृतमपि पूजाविषयेऽतिमात्रतृप्तिस्ते ॥ ३५॥ प्रासादशुद्धपूजा
    अत एव विहाय पञ्चदेवानाम् । पञ्चायतनसपर्यां सगुणसमष्टयर्चनां वदन्ति बुधाः ॥ ३६॥ हर्यादिगणेशान्ताः पञ्चैता
    ब्रह्ममूर्तयो मुनिभिः । अत एव प्रणवस्य च गायत्र्याश्चापि देवताः प्रोक्ताः ॥ ३७॥ व्याचक्षते हि ऋषयो
    गायत्र्याः पञ्चदेवतापराम् । प्रणवस्यापि तथैव प्रपञ्चयन्ति स्म पञ्चधाप्यर्थान् ॥ ३८॥ अत एषां पञ्चानां
    ब्रह्मत्वनिरूपणे निष्णाताः । उत्तरमीमांसाः षट् शुद्धाद्वैतेन तेनिरे मुनयः ॥ ३१॥ प्रतिपादयन्ति चैते
    यद्यप्यापाततो विभिन्नान् वै । सर्वेषां हि ऋषीणां प्रायस्त्वय्येव परमतात्पर्यम् ॥ ४०॥ एते पञ्च मतस्था
    भवतः सर्वेषु पूर्वपूज्यत्वम् । विग्नाधिपत्यमङ्गीकुर्वन्ति यतो गणाधिपत्यं च ॥ ४१॥ भूगतबीजादि यथा पादपरूपेण
    जायते जगति । ब्रह्मैव बीजभूतं प्रकृतिः पृथिवी तया हि संयोगात् ॥ ४२॥ कारणसूक्ष्मस्थूलप्रपञ्चरूपेण जायते
    क्रमशः । मूलं गणपतिरूपं प्रपश्चरूपस्य पादपस्यैवम् ॥ ४३॥ बुद्धिः सिद्धिश्च फले मूलं गणपोऽस्य विश्वरूपतरोः
    । शाखाः केशाः कन्दं त्वर्कोऽखिलमूलमुच्यसेऽतस्त्वम् ॥ ४४॥ सूले जलसेकात् किल तरुपत्रफलादयोऽपि वर्धन्ते
    । तव पूजया गणपते रविशिवशक्त्यादयोऽपि तृप्यन्ति ॥ ४५॥ एवं सगुणब्रह्मव्यपदेशवतां च पञ्च देवानाम् । पूर्णकलांशांशांशावताररूपाश्च
    मूर्तयोऽनन्ताः ॥ ४६॥ भवतः कतिपयमूर्तीराविर्भावावतारतारमुखाः । वैनायकमतविदितप्रक्रिययैव ब्रवीमि हेरम्ब
    ॥ ४७॥ सत्यं ज्ञानमनन्तं ज्योतीरूपं च निर्गुणं ब्रह्म । एतन्निर्व्यापारं गजपदवाच्यं लयादिहेतुत्वात्
    ॥ ४८॥ योगीन्द्रा गच्छन्ति हि समाधिनात्रेति गः स्मृतो मुनिभिः । प्रणवात्मकजगदस्माज्जायत इति जः स्मृतिप्रतीतार्थः
    ॥ ४९॥ गश्वासौ जश्चेति व्युत्पादयति स्मृतिर्हि गजशब्दम् । एष प्रतिपदायति प्रभवाप्ययकारणं परं ब्रह्म
    ॥ ५०॥ मूलप्रकृतिस्त्रिगुणा शुक्तौ रजतं यथा ततो जाता । तद्गतचित्प्रतिबिम्बं सगुणब्रह्मेति कीर्तितं
    मुनिभिः ॥ ५१॥ ओङ्कारब्रह्मेति च नर इति नाम्नी प्रकीर्तिते तस्य । सकलज्योतीरूपं सगुणस्योक्तं हि तत्त्वविद्वद्भिः
    ॥ ५२॥ मूलाविद्यागतनरमद्वैतब्रह्मरूपमपि बिभ्रत् । निर्गुणसगुणज्योतीरूमुभयथा तृतीयमप्युक्तम् ॥ ५३॥ अद्वैत
    इति सदात्मेत्याम्नायन्ते तथा महावाक्याः । इत्युक्तानि क्रमतो नामान्येषां स्मृतीतिहासादौ ॥ ५४॥ नरवाच्यसकलरूपो
    गजवाच्यो निष्कलस्वरूपस्त्वम् । विग्नेश सकलनिष्कलरूपमहावाक्यमूर्तिधारी त्वम् ॥ ५५॥ ओं तत्सदिति हि भेदाद्ब्रह्म
    प्रोक्तं त्रिधा सुधीभिरपि । प्रथितं मूर्तमर्म्तं मूर्तामूर्तं त्रिधा तदेवमपि ॥ ५६॥ नामान्तराणि सर्वाण्येतान्युदितानि
    वेदशीर्षेषु । कमलावल्लभ भवतः पूर्वोक्तत्रिविधरूपधारयितुः ॥ ५७॥ अपि चान्यानि गणपते नामानि सहस्रशः प्रसिद्धानि
    । कर्मज्ञानोपासनकाण्डेषु पृथग्विनायकादीनि ॥ ५८॥ निर्गुणरूपध्यानं न साधकाला प्रसिध्यति क्षिप्रम् ।
    तदनुग्रहाय धरसे
