id: akashagarbhanamashtottarashatastotram
category: stotram
name:
  english: akashagarbhanamashtottarashatastotram
  devanagari: आकाशगर्भनामाष्टोत्तरशतस्तोत्रम्
content:
  english: akashagarbhanamashtottarashatastotram om namo buddhaya | akashagarbha sattvartha mahasattva
    mahadyute | maharatna suratnagrya vajraratna namo'stu te || 1|| abhishekamaharatna mahashuddha mahashubha
    | buddharatna vishuddhanga ratnaratna namo'stu te || 2|| akashakashasambhuta sarvakasha mahanabha
    | akashadhatusarvasha sarvashagrya namo'stu te || 3|| ratnasambhava ratnorna buddhorna sutathagata
    | sarvaratna susarvagrya ratnakarya namo'stu te || 4|| ratnaratnagrya ratnogra ratnasarva tathagata
    | ratnottama mahakasha samakasha namo'stu te || 5|| alankaramahashobha shobhakara sushobhaka | shuddhasarvartha
    shuddhartha danacarya namo'stu te || 6|| dharmaratna vishuddhagrya sangharatna tathagata | mahabhisheka
    lokartha pramodartha namo'stu te || 7|| dana pradana danagrya tyaga tyagagrya dayaka | sarvasattvartha
    tattvartha maharthartha namo'stu te || 8|| cintaraja mahateja danaparamitanaya | tathagata mahasattva
    sarvabuddha namo'stu te || 9|| tathagata maharatna tathagata mahaprabha | tathagata mahaketo mahahasa
    namo'stu te || 10|| tathagatabhishekajna mahabhisheka mahavibho | lokanatha trilokagrya lokasurya
    namo'stu te || 11|| ratnadhikadhikatara ratnabhushana ratnadhrik | ratnaloka mahaloka ratnakirte namo'stu
    te || 12|| ratnotkara suratnottha mane vajramane guna | ratnakara sudiptanga sarvaratna namo'stu te
    || 13|| mahatmayashti ratnesha sarvashaparipuraka | sarvabhiprayasampraptiratnarashi namo'stu te ||
    14|| abhvagrya vyapi sarvatma varaprada mahavara | vibhute sarvasampatte vajragarbham namo'stu te
    || 15|| yah kashcid dharayen namnamidante'shtashatam shivam | sarvabuddhabhishekam tu sa prapnotyanaghah
    kshanat || 16|| iti shri akashagarbhanamashtashatadhyeshanastotram sampurnam ||
  devanagari: आकाशगर्भनामाष्टोत्तरशतस्तोत्रम् ॐ नमो बुद्धाय । आकाशगर्भ सत्त्वार्थ महासत्त्व महाद्युते
    । महारत्न सुरत्नाग्र्य वज्ररत्न नमोऽस्तु ते ॥ १॥ अभिषेकमहारत्न महाशुद्ध महाशुभ । बुद्धरत्न विशुद्धाङ्ग
    रत्नरत्न नमोऽस्तु ते ॥ २॥ आकाशाकाशसम्भूत सर्वाकाश महानभ । आकाशधातुसर्वाश सर्वाशाग्र्य नमोऽस्तु ते
    ॥ ३॥ रत्नसम्भव रत्नोर्ण बुद्धोर्ण सुतथागत । सर्वरत्न सुसर्वाग्र्य रत्नकार्य नमोऽस्तु ते ॥ ४॥ रत्नरत्नाग्र्य
    रत्नोग्र रत्नसर्व तथागत । रत्नोत्तम महाकाश समाकाश नमोऽस्तु ते ॥ ५॥ अलङ्कारमहाशोभ शोभाकर सुशोभक । शुद्धसर्वार्थ
    शुद्धार्थ दानचर्य नमोऽस्तु ते ॥ ६॥ धर्मरत्न विशुद्धाग्र्य सङ्घरत्न तथागत । महाभिषेक लोकार्थ प्रमोदार्थ
    नमोऽस्तु ते ॥ ७॥ दान प्रदान दानाग्र्य त्याग त्यागाग्र्य दायक । सर्वसत्त्वार्थ तत्त्वार्थ महार्थार्थ
    नमोऽस्तु ते ॥ ८॥ चिन्ताराज महातेज दानपारमितानय । तथागत महासत्त्व सर्वबुद्ध नमोऽस्तु ते ॥ ९॥ तथागत
    महारत्न तथागत महाप्रभ । तथागत महाकेतो महाहास नमोऽस्तु ते ॥ १०॥ तथागताभिषेकाज्ञ महाभिषेक महाविभो ।
    लोकनाथ त्रिलोकाग्र्य लोकसूर्य नमोऽस्तु ते ॥ ११॥ रत्नाधिकाधिकतर रत्नभूषण रत्नधृक् । रत्नालोक महालोक
    रत्नकीर्ते नमोऽस्तु ते ॥ १२॥ रत्नोत्कर सुरत्नोत्थ मणे वज्रमणे गुण । रत्नाकर सुदीप्ताङ्ग सर्वरत्न नमोऽस्तु
    ते ॥ १३॥ महात्मयष्टि रत्नेश सर्वाशापरिपूरक । सर्वाभिप्रायसंप्राप्तिरत्नराशि नमोऽस्तु ते ॥ १४॥ अभ्वग्र्य
    व्यापि सर्वात्म वरप्रद महावर । विभूते सर्वसम्पत्ते वज्रगर्भं नमोऽस्तु ते ॥ १५॥ यः कश्चिद् धारयेन्
    नाम्नामिदन्तेऽष्टशतं शिवम् । सर्वबुद्धाभिषेकं तु स प्राप्नोत्यनघः क्षणात् ॥ १६॥ इति श्री आकाशगर्भनामाष्टशताध्येषणास्तोत्रं
    सम्पूर्णम् ॥
