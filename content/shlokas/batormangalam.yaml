id: batormangalam
category: stotram
name:
  english: batormangalam
  devanagari: बटोर्मन्गलम्
content:
  english: dharmo vaidika esha te bhagavatah sakshanmukhannihsritah sarvashreshtha itiha sarvajagatah
    kalyanakrittanvatah | dharmam palaya yatnatah sukritinah sevasva shuddham kritim sadvidyam sumatim
    vidhaya bhagavan kuryadbatormangalam || 1|| ashirme satatam samullasatu te dharmatmane he bato vidyamarjaya
    sanmatim shubhagunan sevasva vidvajjanan | sandhyopasanamuttamam kuru muda shilena rajasva bhoh sarve
    te guravo munindrakavayah kurvantu te mangalam || 2|| bhayam brahmana eva yo rata iti svanandatriptah
    sada khyato yo jagatitale sumahasa tattvarthavetteti ca | yatrayam bhagavanavataradaho deshah sa te
    bharatah desho bharata esha te'vatu bato kuryatsada mangalam || 3|| yesham pavanajivanam kritirapi
    stutya vishuddha sada vani satyabhrita tathatrimadhura tattvaprabodhatmika | vedajnanaratah svadharmaniratah
    shantashca dantashca ye aryaste satatam bato suvimalah kurvantu te mangalam || 4|| dhanyastvam sukulodbhavo'si
    vimalashcacaranishtho vrati tejasvi khalu vamanena sadrisho vardhishnurevam jayi | manyanmanaya matritatabhajanam
    kurvan guroshcadi tat devanpujaya he bato prabhuvarah kurvantu te mangalam || 5|| || iti batormangalam
    sampurnam || upanayana samayah vaishakha vadya 4
  devanagari: धर्मो वैदिक एष ते भगवतः साक्षान्मुखान्निःसृतः सर्वश्रेष्ठ इतीह सर्वजगतः कल्याणकृत्तन्वतः
    । धर्मं पालय यत्नतः सुकृतिनः सेवस्व शुद्धां कृतिं सद्विद्यां सुमतिं विधाय भगवान् कुर्याद्बटोर्मङ्गलम्
    ॥ १॥ आशीर्मे सततं समुल्लसतु ते धर्मात्मने हे बटो विद्यामार्जय सन्मतिं शुभगुणान् सेवस्व विद्वज्जनान्
    । सन्ध्योपासनमुत्तमं कुरु मुदा शीलेन राजस्व भोः सर्वे ते गुरवो मुनीन्द्रकवयः कुर्वन्तु ते मङ्गलम्
    ॥ २॥ भायां ब्रह्मण एव यो रत इति स्वानन्दतृप्तः सदा ख्यातो यो जगतीतले सुमहसा तत्त्वार्थवेत्तेति च ।
    यत्रायं भगवानवातरदहो देशः स ते भारतः देशो भारत एष तेऽवतु बटो कुर्यात्सदा मङ्गलम् ॥ ३॥ येषां पावनजीवनं
    कृतिरपि स्तुत्या विशुद्धा सदा वाणी सत्यभृता तथात्रिमधुरा तत्त्वप्रबोधात्मिका । वेदज्ञानरताः स्वधर्मनिरताः
    शान्ताश्च दान्ताश्च ये आर्यास्ते सततं बटो सुविमलाः कुर्वन्तु ते मङ्गलम् ॥ ४॥ धन्यस्त्वं सुकुलोद्भवोऽसि
    विमलश्चाचारनिष्ठो व्रती तेजस्वी खलु वामनेन सदृशो वर्धिष्णुरेवं जयी । मान्यान्मानय मातृतातभजनं कुर्वन्
    गुरोश्चादि तत् देवान्पूजय हे बटो प्रभुवराः कुर्वन्तु ते मङ्गलम् ॥ ५॥ ॥ इति बटोर्मङ्गलं सम्पूर्णम्
    ॥ उपनयन समयः वैशाख वद्य ४
