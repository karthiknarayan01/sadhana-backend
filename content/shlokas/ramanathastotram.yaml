id: ramanathastotram
category: stotram
name:
  english: ramanathastotram
  devanagari: रामनाथस्तोत्रम्
content:
  english: jjayanyako'pi hi tatha ca bhavedaniyan | nishkampa eka iti yovyayasaukhyarupah tam ramanathamamalam
    munivandyamide || 1|| rajvam yatha mama vibhati phaniti mithya yasmimstatha bata vibhati vibhedabhanam
    | yojnananashanavidhau prathitastamorih tam ramanathamamalam munivandyamide || 2|| shuktau yatha rajatabhanamidantathaivam
    yasminbhavedbhramavibhasita bhogabhavah | yadgaktireva bhavaroganudasudheyam tam ramanathamamalam
    munivandyamide || 3|| yah kamamattagajamastakabhedasimho yo vighnasarpabhavabhitinudagdarutman | yo
    durvishahya bhavatapavinashacandrah tam ramanathamamalam munivandyamide || 4|| yanneti neti vacanairnigama
    avocuh yajjiva vishva bhavashoka bhayatiduram | saccitsukhadvayamidam hridi yatsvarupam tam ramanathamamalam
    munivandyamide || 5|| || iti shrimat paramahamsaparivrajakacarya sadguru bhagavana shridharasvamimaharajaviracitam
    shriramanathastotram sampurnam ||
  devanagari: ज्जायान्यकोऽपि हि तथा च भवेदणीयान् । निष्कम्प एक इति योव्ययसौख्यरूपः तं रामनाथममलं मुनिवन्द्यमीडे
    ॥ १॥ रज्वां यथा मम विभाति फणीति मिथ्या यस्मिंस्तथा बत विभाति विभेदभानम् । योज्ञाननाशनविधौ प्रथितस्तमोरिः
    तं रामनाथममलं मुनिवन्द्यमीडे ॥ २॥ शुक्तौ यथा रजतभानमिदन्तथैवं यस्मिन्भवेद्भ्रमविभासित भोगभावः । यद्गक्तिरेव
    भवरोगनुदासुधेयं तं रामनाथममलं मुनिवन्द्यमीडे ॥ ३॥ यः काममत्तगजमस्तकभेदसिंहो यो विघ्नसर्पभवभीतिनुदग्दरूत्मान्
    । यो दुर्विषह्य भवतापविनाशचन्द्रः तं रामनाथममलं मुनिवन्द्यमीडे ॥ ४॥ यन्नेति नेति वचनैर्निगमा अवोचुः
    यज्जीव विश्व भवशोक भयातिदूरम् । सच्चित्सुखाद्वयमिदं हृदि यत्स्वरूपं तं रामनाथममलं मुनिवन्द्यमीडे ॥
    ५॥ ॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरू भगवान श्रीधरस्वामीमहाराजविरचितं श्रीरामनाथस्तोत्रं
    सम्पूर्णम् ॥
meaning: {}
