id: adityahridayapadmapurana
category: hridaya
name:
  english: adityahridayapadmapurana
  devanagari: आदित्यहृदयपद्मपुराण
content:
  english: mama sarvaroganivaranaya shrisuryanarayanaprityarthe jape viniyogah | || stavah || arkam tu
    murdhni vinyasya lalate tu ravim nyaset | vinyaset karayoh suryam karnayoshca divakaram || nasikayam
    nyaset bhanum mukhe vai bhaskaram nyaset | parjanyamoshthayoshcaiva tikshnam jihvantare nyaset ||
    suvarnaretasam kanthe skandhayostigmatejasam | bahvostu pushanam caiva mitram vai prishthato nyaset
    || varunam dakshine haste tvashtaram vamatah kare | hastavushnakarah patu hridayam patu bhanuman ||
    stanabharam mahateja adityamudare nyaset | prishthe tvarghamanam vidyadadityam nabhimandale || katyam
    tu vinyaseddhamsam rudramurvo vinyaset | janhostu gopatim nyasya savitaram tu janghayoh || padayostu
    vivasvantam gulphayoshca prabhakaram | sarvangeshu sahasramshu digvidikshu bhagam nyaset || bahyatastu
    tamoghnamsam bhagamabhyantare nyaset | esha adityavinyaso devanamapi durlabhah || || nyasam || murdhni
    arkaya namah | lalate ravaye namah | karayoh suryaya namah | karnayoh divakaraya namah | nasikayam
    bhanave namah | mukhe bhaskaraya namah | oshthayoh parjanyaya namah | jihvayam tikshnaya namah | kanthe
    suvarnaretase namah | skandhayoh tigmatejase namah | bahvoh pushanaya namah | prishthe mitraya namah
    | dakshahaste varunaya namah | vamahaste tvashtaram namah | hastau ushnakaraya namah | hridaye bhanumate
    namah | stanayoh mahatejase namah | udare adityaya namah | prishthe arghamanaya namah | nabhau vidyadadityaya
    namah | katyam hamsaya namah | urvoh rudraya namah | janhoh gopataye namah | janghayoh savitre namah
    | padayoh vivasvate namah | gulphayoh prabhakaraya namah | sarvange sahasramshave namah | digvidikshu
    bhagaya namah | bahye tamoghnamsaya namah | abhyantare bhagaya namah | || dhyanam || bhasvadratnadhyamaulih
    sphuradadhararucaranjitashcarukesho bhasvan yo divyatejah karakamalayutah svarnavarnah prabhabhih
    | vishvakashavakasho grahagrahana sahito bhati yashcodayadrau sarvanandapradata hariharanamitah patu
    mam vishvacakshuh || || arghyam || ehi surya sahasramsho tejorashih jagatpate | anukampaya mam bhaktya
    grihanarghyam divakara || || mantram || om ghrinih surya aditya | || suryastutih || agnimiḻe namastubhyamishatturyasvarupine
    | agnyayahi vitaye tvam namaste jyotisham pate || shanno devo namastubhyam jagaccakshurnamo'stu te
    | dhavalambhoruhanam dakinim shyamalaprabham || vishvadipa namastubhyam namaste jagadatmane | padmasanah
    padmakarah padmagarbhasamadyutih || saptashvarathasamyukto dvibhujo bhaskaro ravih | adityasya namaskaram
    ye kurvanti dine dine || janmantarasahasreshu daridryam nopajayate | namo dharmavipakaya namah sukritasakshine
    || namah pratyakshadevaya bhaskaraya namo namah | udayagirimupetam bhaskaram padmahastam | sakalabhuvanaratnam
    ratnaratnabhidheyam || timirakarimrigendram bodhakam padmininam | suravaramabhivande sundaram vishvarupam
    || anyatha sharanam nasti tvameva sharanam mama | tasmat karunyabhavena rakshasva parameshvara ||
    || iti shripadmapurane shrikrishnarjunesamvade adityahridayastotram ||
  devanagari: मम सर्वरोगनिवारणाय श्रीसूर्यनारायणप्रीत्यर्थे जपे विनियोगः । ॥ स्तवः ॥ अर्कं तु मूर्ध्नि
    विन्यस्य ललाटे तु रविं न्यसेत् । विन्यसेत् करयोः सूर्यं कर्णयोश्च दिवाकरम् ॥ नासिकायां न्यसेत् भानुं
    मुखे वै भास्करं न्यसेत् । पर्जन्यमोष्ठयोश्चैव तीक्ष्णं जिह्वान्तरे न्यसेत् ॥ सुवर्णरेतसं कण्ठे स्कन्धयोस्तिग्मतेजसम्
    । बाह्वोस्तु पूषणं चैव मित्रं वै पृष्ठतो न्यसेत् ॥ वरुणं दक्षिणे हस्ते त्वष्टारं वामतः करे । हस्तावुष्णकरः
    पातु हृदयं पातु भानुमान् ॥ स्तनभारं महातेजा आदित्यमुदरे न्यसेत् । पृष्ठे त्वर्घमणं विद्यादादित्यं
    नाभिमण्डले ॥ कट्यां तु विन्यसेद्धंसं रुद्रमूर्वो विन्यसेत् । जान्होस्तु गोपतिं न्यस्य सवितारं तु जङ्घयोः
    ॥ पादयोस्तु विवस्वन्तं गुल्फयोश्च प्रभाकरम् । सर्वाङ्गेषु सहस्रांशु दिग्विदिक्षु भगं न्यसेत् ॥ बाह्यतस्तु
    तमोघ्नंसं भगमभ्यन्तरे न्यसेत् । एष आदित्यविन्यासो देवानामपि दुर्लभः ॥ ॥ न्यासम् ॥ मूर्ध्नि अर्काय
    नमः । ललाटे रवये नमः । करयोः सूर्याय नमः । कर्णयोः दिवाकराय नमः । नासिकायां भानवे नमः । मुखे भास्कराय
    नमः । ओष्ठयोः पर्जन्याय नमः । जिह्वायां तीक्ष्णाय नमः । कण्ठे सुवर्णरेतसे नमः । स्कन्धयोः तिग्मतेजसे
    नमः । बाह्वोः पूषणाय नमः । पृष्ठे मित्राय नमः । दक्षहस्ते वरुणाय नमः । वामहस्ते त्वष्टारं नमः । हस्तौ
    उष्णकराय नमः । हृदये भानुमते नमः । स्तनयोः महातेजसे नमः । उदरे आदित्याय नमः । पृष्ठे अर्घमणाय नमः
    । नाभौ विद्यादादित्याय नमः । कट्यां हंसाय नमः । ऊर्वोः रुद्राय नमः । जान्होः गोपतये नमः । जङ्घयोः
    सवित्रे नमः । पादयोः विवस्वते नमः । गुल्फयोः प्रभाकराय नमः । सर्वाङ्गे सहस्रांशवे नमः । दिग्विदिक्षु
    भगाय नमः । बाह्ये तमोघ्नंसाय नमः । अभ्यन्तरे भगाय नमः । ॥ ध्यानम् ॥ भास्वद्रत्नाढ्यमौलिः स्फुरदधररुचारञ्जितश्चारुकेशो
    भास्वान् यो दिव्यतेजाः करकमलयुतः स्वर्णवर्णः प्रभाभिः । विश्वाकाशावकाशो ग्रहग्रहण सहितो भाति यश्चोदयाद्रौ
    सर्वानन्दप्रदाता हरिहरनमितः पातु मां विश्वचक्षुः ॥ ॥ अर्घ्यम् ॥ एहि सूर्य सहस्रांशो तेजोराशिः जगत्पते
    । अनुकम्पय मां भक्त्या गृहाणार्घ्यं दिवाकर ॥ ॥ मन्त्रम् ॥ ॐ घृणिः सूर्य आदित्य । ॥ सूर्यस्तुतिः ॥
    अग्निमीळे नमस्तुभ्यमीषत्तूर्यस्वरूपिणे । अग्न्यायाहि वीतये त्वं नमस्ते ज्योतिषां पते ॥ शन्नो देवो
    नमस्तुभ्यं जगच्चक्षुर्नमोऽस्तु ते । धवलाम्भोरुहणं डाकिनीं श्यामलप्रभाम् ॥ विश्वदीप नमस्तुभ्यं नमस्ते
    जगदात्मने । पद्मासनः पद्मकरः पद्मगर्भसमद्युतिः ॥ सप्ताश्वरथसंयुक्तो द्विभुजो भास्करो रविः । आदित्यस्य
    नमस्कारं ये कुर्वन्ति दिने दिने ॥ जन्मान्तरसहस्रेषु दारिद्र्यं नोपजायते । नमो धर्मविपाकाय नमः सुकृतसाक्षिणे
    ॥ नमः प्रत्यक्षदेवाय भास्कराय नमो नमः । उदयगिरिमुपेतं भास्करं पद्महस्तम् । सकलभुवनरत्नं रत्नरत्नाभिधेयम्
    ॥ तिमिरकरिमृगेन्द्रं बोधकं पद्मिनीनाम् । सुरवरमभिवन्दे सुन्दरं विश्वरूपम् ॥ अन्यथा शरणं नास्ति त्वमेव
    शरणं मम । तस्मात् कारुण्यभावेन रक्षस्व परमेश्वर ॥ ॥ इति श्रीपद्मपुराणे श्रीकृष्णार्जुनेसंवादे आदित्यहृदयस्तोत्रम्
    ॥
