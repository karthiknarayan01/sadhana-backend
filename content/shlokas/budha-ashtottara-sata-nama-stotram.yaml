id: budha-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Budha Ashtottara Sata Nama Stotram
content:
  english: budho budharcitah saumyah saumyacittah shubhapradah | dridhavrato dridhaphalah shrutijalaprabodhakah
    || || satyavasah satyavacah shreyasam patiravyayah | somajah sukhadah shriman somavamshapradipakah
    || || vedavidvedatattvajno vedantajnanabhasvarah | vidyavicakshana vibhurvidvatpritikaro rijah ||
    || vishvanukulasancaro visheshavinayanvitah | vividhagamasarajno viryavan vigatajvarah || || trivargaphalado'nantah
    tridashadhipapujitah | buddhiman bahushastrajno bali bandhavimocakah || || vakrativakragamano vasavo
    vasudhadhipah | prasannavadano vandyo varenyo vagvilakshanah || || satyavan satyasankalpah satyabandhuh
    sadadarah | sarvarogaprashamanah sarvamrityunivarakah || || vanijyanipuno vashyo vatango vatarogahrit
    | sthulah sthairyagunadhyakshah sthulasukshmadikaranah || || aprakashah prakashatma ghano gaganabhushanah
    | vidhistutyo vishalaksho vidvajjanamanoharah || || carushilah svaprakashah capalashca jitendriyah
    | udanmukho makhasakto magadhadhipatirharah || || saumyavatsarasanjatah somapriyakarah sukhi | simhadhirudhah
    sarvajnah shikhivarnah shivankarah || || pitambaro pitavapuh pitacchatradhvajankitah | khadgacarmadharah
    karyakarta kalushaharakah || || atreyagotrajo'tyantavinayo vishvapavanah | campeyapushpasankashah
    caranah carubhushanah || || vitarago vitabhayo vishuddhakanakaprabhah | bandhupriyo bandhamukto banamandalasamshritah
    || || arkeshanapradeshasthah tarkashastravisharadah | prashantah pritisamyuktah priyakrit priyabhashanah
    || || medhavi madhavasakto mithunadhipatih sudhih | kanyarashipriyah kamaprado ghanaphalashrayah ||
    || budhasyaivam prakarena namnamashtottaram shatam | sampujya vidhivatkarta sarvankamanavapnuyat ||
    || iti shri budha ashtottarashatanama stotram |
  devanagari: बुधो बुधार्चितः सौम्यः सौम्यचित्तः शुभप्रदः । दृढव्रतो दृढफलः श्रुतिजालप्रबोधकः ॥ ॥ सत्यवासः
    सत्यवचाः श्रेयसां पतिरव्ययः । सोमजः सुखदः श्रीमान् सोमवंशप्रदीपकः ॥ ॥ वेदविद्वेदतत्त्वज्ञो वेदान्तज्ञानभास्वरः
    । विद्याविचक्षण विभुर्विद्वत्प्रीतिकरो ऋजः ॥ ॥ विश्वानुकूलसञ्चारो विशेषविनयान्वितः । विविधागमसारज्ञो
    वीर्यवान् विगतज्वरः ॥ ॥ त्रिवर्गफलदोऽनन्तः त्रिदशाधिपपूजितः । बुद्धिमान् बहुशास्त्रज्ञो बली बन्धविमोचकः
    ॥ ॥ वक्रातिवक्रगमनो वासवो वसुधाधिपः । प्रसन्नवदनो वन्द्यो वरेण्यो वाग्विलक्षणः ॥ ॥ सत्यवान् सत्यसङ्कल्पः
    सत्यबन्धुः सदादरः । सर्वरोगप्रशमनः सर्वमृत्युनिवारकः ॥ ॥ वाणिज्यनिपुणो वश्यो वाताङ्गो वातरोगहृत् ।
    स्थूलः स्थैर्यगुणाध्यक्षः स्थूलसूक्ष्मादिकारणः ॥ ॥ अप्रकाशः प्रकाशात्मा घनो गगनभूषणः । विधिस्तुत्यो
    विशालाक्षो विद्वज्जनमनोहरः ॥ ॥ चारुशीलः स्वप्रकाशः चपलश्च जितेन्द्रियः । उदङ्मुखो मखासक्तो मगधाधिपतिर्हरः
    ॥ ॥ सौम्यवत्सरसञ्जातः सोमप्रियकरः सुखी । सिंहाधिरूढः सर्वज्ञः शिखिवर्णः शिवङ्करः ॥ ॥ पीताम्बरो पीतवपुः
    पीतच्छत्रध्वजाङ्कितः । खड्गचर्मधरः कार्यकर्ता कलुषहारकः ॥ ॥ आत्रेयगोत्रजोऽत्यन्तविनयो विश्वपावनः ।
    चाम्पेयपुष्पसङ्काशः चारणः चारुभूषणः ॥ ॥ वीतरागो वीतभयो विशुद्धकनकप्रभः । बन्धुप्रियो बन्धमुक्तो बाणमण्डलसंश्रितः
    ॥ ॥ अर्केशानप्रदेशस्थः तर्कशास्त्रविशारदः । प्रशान्तः प्रीतिसंयुक्तः प्रियकृत् प्रियभाषणः ॥ ॥ मेधावी
    माधवासक्तो मिथुनाधिपतिः सुधीः । कन्याराशिप्रियः कामप्रदो घनफलाश्रयः ॥ ॥ बुधस्यैवं प्रकारेण नाम्नामष्टोत्तरं
    शतम् । सम्पूज्य विधिवत्कर्ता सर्वान्कामानवाप्नुयात् ॥ ॥ इति श्री बुध अष्टोत्तरशतनाम स्तोत्रम् ।
