id: varadarajastotram-2
category: stotram
name:
  english: varadarajastotram 2
  devanagari: वरदराजस्तोत्रम् २
content:
  english: rnitantalalitananah kamaladivayanetrojjvalah || 4|| suvarnamakutojjvalam subhagadivyanilalakam
    lalataphalakollasattilakapundrandiprananam | vicitramanibhushanajvalitanilagatraprabham bhaje karigirishvaram
    varadarajamatyujjvalam || 5|| rathangajalajankushadhvajasarojarekhadibhih svalankritalau bahirvilasadindranilaprabhau
    | vikasikamalopamau vividharatnabhushojjvalau karishacaranau bhaje sakalabhaktasaukhyapradau || 6||
    sukalpakatarushriya tulitadivyajanghojjvalam kanatprabhakakutsamajvalitabhasvaduruprabham | katitatasamullasatsubhagadivyapitambaram
    bhaje karigirishvaram varadamabjanilaprabham || 7|| sanabhikanakaprabhajvalitayajnasutrojjvalam manindrakamalalasadvipuladivyavakshahsthalam
    | karindrakarasannibhasphuritavrittabahojjvalam bhaje karigirishvaram vilasadasabhushojjvalam || 8||
    lasadgalasamujjvalasphatikaratnaharojjvalam vilasyadharapallavaprabhavadivyamandasmitam | suphalatalamunnasam
    namitasundarabhruyugam bhaje karigirishvaram vikacapadmanetrojjvalam || 9|| sunilaghanasannibham subhagadivyaratnadhyaka
  devanagari: र्नितान्तललिताननः कमलदिवयनेत्रोज्ज्वलः ॥ ४॥ सुवर्णमकुटोज्ज्वलं सुभगदिव्यनीलालकं ललाटफलकोल्लसत्तिलकपुण्ड्रन्दीप्राननम्
    । विचित्रमणिभूषणज्वलितनीलगात्रप्रभं भजे करिगिरीश्वरं वरदराजमत्युज्ज्वलम् ॥ ५॥ रथाङ्गजलजाङ्कुशध्वजसरोजरेखादिभिः
    स्वलङ्कृतलौ बहिर्विलसदिन्द्रनीलप्रभौ । विकासिकमलोपमौ विविधरत्नभूषोज्ज्वलौ करीशचरणौ भजे सकलभक्तसौख्यप्रदौ
    ॥ ६॥ सुकल्पकतरुश्रिया तुलितदिव्यजङ्घोज्ज्वलं कनत्प्रभककुत्समज्वलितभास्वदूरुप्रभम् । कटीतटसमुल्लसत्सुभगदिव्यपीताम्बरं
    भजे करिगिरीश्वरं वरदमब्जनीलप्रभम् ॥ ७॥ सनाभिकनकप्रभज्वलितयज्ञसूत्रोज्ज्वलं मणीन्द्रकमलालसद्विपुलदिव्यवक्षःस्थलम्
    । करीन्द्रकरसन्निभस्फुरितवृत्तबाहोज्ज्वलं भजे करिगिरीश्वरं विलसदसभूषोज्ज्वलम् ॥ ८॥ लसद्गलसमुज्ज्वलस्फटिकरत्नहारोज्ज्वलं
    विलास्यधरपल्लवप्रभवदिव्यमन्दस्मितम् । सुफालतलमुन्नसं नमितसुन्दरभ्रूयुगं भजे करिगिरीश्वरं विकचपद्मनेत्रोज्ज्वलम्
    ॥ ९॥ सुनीलघनसन्निभं सुभगदिव्यरत्नाढ्यक
