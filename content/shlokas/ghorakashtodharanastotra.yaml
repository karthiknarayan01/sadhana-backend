id: ghorakashtodharanastotra
category: stotram
name:
  english: ghorakashtodharanastotra
  devanagari: घोरकष्टोधारणस्तोत्र
content:
  english: ghorakashtoddharanastotram shripada shrivallabha tvam sadaiva shridattasmanpahi devadhideva
    | bhavagrahya kleshaharinsukirte ghoratkashtaduddharasmannamaste || 1|| tvam no mata tvam pitapto'dhipastvam
    trata yogakshemakritsadgurustvam | tvam sarvasvam no'prabho vishvamurte ghoratkashtaduddharasmannamaste
    || 2|| papam tapam vyadhimadhim ca dainyam bhitim klesham tvam harashu tvadanyam | trataram no vikshya
    ishastajurte ghoratkashtaduddharasmannamaste || 3|| nanyastrata napi data na bharta tvatto deva tvam
    sharanyo'kaharta | kurvatreyanugraham purnarate ghoratkashtaduddharasmannamaste || 4|| dharme pritim
    sanmatim devabhaktim satsamgaptim dehi bhuktim ca muktim | bhavasaktim cakhilanamdamurte ghoratkashtaduddharasmannamaste
    || 5|| shlokapamcakametatadyo lokamangalavardhanam | prapathenniyato bhaktya sa shridattapriyo bhavet
    || iti shrimat paramahamsa parivrajakacarya shrimad vasudevanandasarasvatisvamiviracitam ghorakashtoddharanastotram
    sampurnam || sartha shripada shrivallabha tvam sadaiva shridattasmanpahi devadhideva | bhavagrahya
    kleshaharinsukirte ghoratkashtaduddharasmannamaste || 1||
  devanagari: घोरकष्टोद्धारणस्तोत्रम् श्रीपाद श्रीवल्लभ त्वं सदैव श्रीदत्तास्मान्पाहि देवाधिदेव । भावग्राह्य
    क्लेशहारिन्सुकीर्ते घोरात्कष्टादुद्धरास्मान्नमस्ते ॥ १॥ त्वं नो माता त्वं पिताप्तोऽधिपस्त्वं त्राता
    योगक्षेमकृत्सद्गुरुस्त्वम् । त्वं सर्वस्वं नोऽप्रभो विश्वमूर्ते घोरात्कष्टादुद्धरास्मान्नमस्ते ॥ २॥
    पापं तापं व्याधिमाधिं च दैन्यं भीतिं क्लेशं त्वं हराशु त्वदन्यम् । त्रातारं नो वीक्ष्य ईशास्तजूर्ते
    घोरात्कष्टादुद्धरास्मान्नमस्ते ॥ ३॥ नान्यस्त्राता नापि दाता न भर्ता त्वत्तो देव त्वं शरण्योऽकहर्ता
    । कुर्वात्रेयानुग्रहं पूर्णराते घोरात्कष्टादुद्धरास्मान्नमस्ते ॥ ४॥ धर्मे प्रीतिं सन्मतिं देवभक्तिं
    सत्संगाप्तिं देहि भुक्तिं च मुक्तिम् । भावासक्तिं चाखिलानंदमूर्ते घोरात्कष्टादुद्धरास्मान्नमस्ते ॥
    ५॥ श्लोकपंचकमेततद्यो लोकमङ्गलवर्धनम् । प्रपठेन्नियतो भक्त्या स श्रीदत्तप्रियो भवेत् ॥ इति श्रीमत्
    परमहंस परिव्राजकाचार्य श्रीमद् वासुदेवानन्दसरस्वतीस्वामीविरचितं घोरकष्टोद्धारणस्तोत्रं सम्पूर्णम्
    ॥ सार्थ श्रीपाद श्रीवल्लभ त्वं सदैव श्रीदत्तास्मान्पाहि देवाधिदेव । भावग्राह्य क्लेशहारिन्सुकीर्ते
    घोरात्कष्टादुद्धरास्मान्नमस्ते ॥ १॥
