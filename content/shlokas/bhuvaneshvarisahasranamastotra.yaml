id: bhuvaneshvarisahasranamastotra
category: sahasranama
name:
  english: bhuvaneshvarisahasranamastotra
  devanagari: भुवनेश्वरीसहस्रनामस्तोत्र
content:
  english: adya kamala vani maya shribhuvaneshvari bhuvana bhavana bhavya bhavani bhavabhavini || 6||
    bhavamocani rudrani rudrabhakta ca tatha rudrapriya sati | uma katyayani durga mangala sarvamangala
    || 7|| uma kameshvari tripura parameshani tripura sundari priya | ramana ramani rama ramakaryakari
    shubha || 8|| brahmi narayani candi camunda mundanayika | maheshvari ca kaumari varahi caparajita
    || 9|| mahamaya muktakeshi mahatripurasundari | sundari shobhana rakta raktavastrapidhayini || 10||
    raktakshi raktavastra ca raktabijatisundari | raktacandanasiktangi raktapushpasadapriya || 11|| kamala
    kamini kanta kamadevasadapriya | lakshmi lola cancalakshi cancala capala priya || 12|| bhairavi bhayahartri
    ca mahabhayavinashini | bhayankari mahabhima bhayaha bhayanashini || 13|| shmashane prantare durge
    samsmrita bhayanashini | jaya ca vijaya caiva jayapurna jayaprada || 14|| yamuna yamuna yamya yamunaja
    yamapriya | sarvesham janika janya janaha janavardhini || 15|| kali kapalini kulla kalika kalaratrika
    | mahakalahridistha ca kalabhairavarupini || 16|| kapalakhatvangadhara pashankushavidharini | abhaya
    ca bhaya caiva tatha ca bhayanashini || 17|| mahabhayapradatri ca tatha ca varahastini | gauri gaurangini
    gaura gauravarna jayaprada || 18|| ugra ugraprabha shantih shantida'shantinashini | ugratara tatha
    cogra nila caikajata tatha || 19|| ham ham hum hum tatha tara tatha ca siddhikalika | tara nila ca
    vagishi tatha nilasarasvati || 20|| ganga kashi sati satya sarvatirthamayi tatha | tirtharupa tirthapunya
    tirthada tirthasevika || 21|| punyada punyarupa ca punyakirtiprakashini | punyakala punyasamstha tatha
    punyajanapriya || 22|| tulasi totulastotra radhika radhanapriya | satyasatya satyabhama rukmini krishnavallabha
    || 23|| devaki krishnamata ca subhadra bhadrarupini | manohara tatha saumya shyamangi samadarshana
    || 24|| ghorarupa ghorateja ghoravatpriyadarshana | kumari balika kshudra kumarirupadharini || 25||
    yuvati yuvatirupa yuvatirasaranjaka | pinastani kshudramadhya praudha madhya jaratura || 26|| ativriddha
    sthanurupa calangi cancala cala | devamata devarupa devakaryakari shubha || 27|| devamata ditirdaksha
    sarvamata sanatani | panapriya payani ca palana palanapriya || 28|| matsyashi mamsabhakshya ca sudhashi
    janavallabha | tapasvini tapi tapya tapahsiddhipradayini || 29|| havishya ca havirbhoktri havyakavyanivasini
    | yajurveda vashyakari yajnangi yajnavallabha || 30|| daksha dakshayini durga dakshayajnavinashini
    | parvati parvataprita tatha parvatavasini || 31|| haimi harmya hemarupa mena manya manorama | kailasavasini
    mukta sharvakridavilasini || 32|| carvangi carurupa ca suvaktra ca shubhanana | calatkundalagandashrirlasatkundaladharini
    || 33|| mahasimhasanastha ca hemabhushanabhushita | hemangada hemabhusha ca suryakotisamaprabha ||
    34|| baladityasamakantih sindurarcitavigraha | yava yavakarupa ca raktacandanarupadhrik || 35|| kotari
    kotarakshi ca nirlajja ca digambara | putana balamata ca shunyalayanivasini || 36|| shmashanavasini
    shunya hridya caturavasini | madhukaitabhahantri ca mahishasuraghatini || 37|| nishumbhashumbhamathani
    candamundavinashini | shivakhya shivarupa ca shivaduti shivapriya || 38|| shivada shivavakshahstha
    sharvani shivakarini | indrani cendrakanya ca rajakanya surapriya || 39|| lajjashila sadhushila kulastri
    kulabhushika | mahakulina nishkama nirlajja kulabhushana || 40|| kulina kulakanya ca tatha ca kulabhushita
    | anantanantarupa ca anantasuranashini || 41|| hasanti shivasangena vanchitanandadayini | nagangi
    nagabhusha ca nagaharavidharini || 42|| dharini dharini dhanya mahasiddhipradayini | dakini shakini
    caiva rakini hakini tatha || 43|| bhuta preta pishaci ca yakshini dhanadarcita | dhritih kirtih smritirmedha
    tushtihpushtiruma rusha || 44|| shankari shambhavi mina ratih pritih smaratura | anangamadana devi
    anangamadanatura || 45|| bhuvaneshi mahamaya tatha bhuvanapalini | ishvari ceshvariprita candrashekharabhushana
    || 46|| cittanandakari devi cittasamstha janasya ca | arupa bahurupa ca sarvarupa cidatmika || 47||
    anantarupini nitya tathanantapradayini | nanda canandarupa ca tatha'nandaprakashini || 48|| sadananda
    sadanitya sadhakanandadayini | vanita taruni bhavya bhavika ca vibhavini || 49|| candrasuryasama dipta
    suryavatparipalini | narasimhi hayagriva hiranyakshavinashini || 50|| vaishnavi vishnubhakta ca shalagramanivasini
    | caturbhuja cashtabhuja sahasrabhujasamjnita || 51|| adya katyayani nitya sarvadya sarvadayini |
    sarvacandramayi devi sarvavedamayi shubha || 52|| savadevamayi devi sarvalokamayi pura | sarvasammohini
    devi sarvalokavashankari || 53|| rajini ranjini raga dehalavanyaranjita | nati natapriya dhurta tatha
    dhurtajanardini || 54|| mahamaya mahamoha mahasattvavimohita | balipriya mamsarucirmadhumamsapriya
    sada || 55|| madhumatta madhavika madhumadhavarupika | divamayi ratrimayi sandhya sandhisvarupini
    || 56|| kalarupa sukshmarupa sukshmini catisukshmini | tithirupa vararupa tatha nakshatrarupini ||
    57|| sarvabhutamayi devi pancabhutanivasini | shunyakara shunyarupa shunyasamstha ca stambhini ||
    58|| akashagamini devi jyotishcakranivasini | grahanam sthitirupa ca rudrani cakrasambhava || 59||
    rishinam brahmaputranam tapahsiddhipradayini | arundhati ca gayatri savitri sattvarupini || 60|| citasamstha
    citarupa cittasiddhipradayini | shavastha shavarupa ca shavashatrunivasini || 61|| yogini yogarupa
    ca yoginam malaharini | suprasanna mahadevi yamuni muktidayini || 62|| nirmala vimala shuddha shuddhasatva
    jayaprada | mahavidya mahamaya mohini vishvamohini || 63|| karyasiddhikari devi sarvakaryanivasini
    | karyakaryakari raudri mahapralayakarini || 64|| stripumbhedahyabhedya ca bhedini bhedanashini |
    sarvarupa sarvamayi advaitanandarupini || 65|| pracanda candika canda candasuravinashini | sumasta
    bahumasta ca chinnamasta'sunashini || 66|| arupa ca virupa ca citrarupa cidatmika | bahushastra ashastra
    ca sarvashastrapraharini || 67|| shastrartha shastravada ca nana shastrarthavadini | kavyashastrapramoda
    ca kavyalankaravasini || 68|| rasajna rasana jihva rasamoda rasapriya | nanakautukasamyukta nanarasavilasini
    || 69|| arupa ca svarupa ca virupa ca surupini | rupavasya tatha jiva veshyadya veshadharini || 70||
    nanaveshadhara devi nanavesheshu samsthita | kurupa kutila krishna krishnarupa ca kalika || 71|| lakshmiprada
    mahalakshmih sarvalakshanasamyuta | kuberagrihasamstha ca dhanarupa dhanaprada || 72|| nanaratnaprada
    devi ratnakhandeshu samsthita | varnasamstha varnarupa sarvavarnamayi sada || 73|| onkararupini vacya
    adityajyotirupini | samsaramocini devi sangrame jayadayini || 74|| jayarupa jayakhya ca jayini jayadayini
    | manini manarupa ca manabhangapranashini || 75|| manya manapriya medha manini manadayini | sadhakasadhakasadhya
    sadhika sadhanapriya || 76|| sthavara jangama prokta capala capalapriya | riddhida riddhirupa ca siddhida
    siddhidayini || 77|| kshemankari shankari ca sarvasammohakarini | ranjita ranjini ya ca sarvavanchapradayini
    || 78|| bhagalingapramoda ca bhagalinganivasini | bhagarupa bhagabhagya lingarupa ca lingini || 79||
    bhagagitirmahapritirlingagitirmahasukha | svayambhuh kusumaradhya svayambhuh kusumakula || 80|| svayambhuh
    pushparupa ca svayambhuh kusumapriya | shukrakupa mahakupa shukrasavanivasini || 81|| shukrastha shukrini
    shukra shukrapujakapujita | kamaksha kamarupa ca yogini pithavasini || 82|| sarvapithamayi devi pithapujanivasini
    | akshamaladhara devi panapatravidharini || 83|| shulini shulahasta ca pashini pasharupini | khadgini
    gadini caiva tatha sarvastradharini || 84|| bhavya bhavya bhavani sa bhavamuktipradayini | catura
    caturaprita caturananapujita || 85|| devastavya devapujya sarvapujya sureshvari | janani janarupa
    ca jananam cittaharini || 86|| jatila keshabaddha ca sukeshi keshabaddhika | ahimsa dveshika dveshya
    sarvadveshavinashini || 87|| uccatini dveshini ca mohini madhurakshara | krida kridakalekhankakaranakarakarika
    || 88|| sarvajna sarvakarya ca sarvabhaksha surariha | sarvarupa sarvashanta sarvesham pranarupini
    || 89|| srishtisthitikari devi tatha pralayakarini | mugdha sadhvi tatha raudri nanamurtividharini
    || 90|| uktani yani deveshi anuktani maheshvari | yat kincid drishyate devi tat sarvam bhuvaneshvari
    || 91|| iti shribhuvaneshvarya namani kathitani te | sahasrani mahadevi phalam tesham nigadyate ||
    92|| yah pathet pratarutthaya carddharatre tatha priye | pratahkale tatha madhye sayahne haravallabhe
    || 93|| yatra tatra pathitva ca bhaktya siddhirna samshayah | pathed va pathayed vapi sha
  devanagari: आद्या कमला वाणी माया श्रीभुवनेश्वरी भुवना भावना भव्या भवानी भवभाविनी ॥ ६॥ भवमोचनी रुद्राणी
    रुद्रभक्ता च तथा रुद्रप्रिया सती । उमा कात्यायनी दुर्गा मङ्गला सर्वमङ्गला ॥ ७॥ उमा कामेश्वरी त्रिपुरा
    परमेशानी त्रिपुरा सुन्दरी प्रिया । रमणा रमणी रामा रामकार्यकरी शुभा ॥ ८॥ ब्राह्मी नारायणी चण्डी चामुण्डा
    मुण्डनायिका । माहेश्वरी च कौमारी वाराही चापराजिता ॥ ९॥ महामाया मुक्तकेशी महात्रिपुरसुन्दरी । सुन्दरी
    शोभना रक्ता रक्तवस्त्रापिधायिनी ॥ १०॥ रक्ताक्षी रक्तवस्त्रा च रक्तबीजातिसुन्दरी । रक्तचन्दनसिक्ताङ्गी
    रक्तपुष्पसदाप्रिया ॥ ११॥ कमला कामिनी कान्ता कामदेवसदाप्रिया । लक्ष्मी लोला चञ्चलाक्षी चञ्चला चपला
    प्रिया ॥ १२॥ भैरवी भयहर्त्री च महाभयविनाशिनी । भयङ्करी महाभीमा भयहा भयनाशिनी ॥ १३॥ श्मशाने प्रान्तरे
    दुर्गे संस्मृता भयनाशिनी । जया च विजया चैव जयपूर्णा जयप्रदा ॥ १४॥ यमुना यामुना याम्या यामुनजा यमप्रिया
    । सर्वेषां जनिका जन्या जनहा जनवर्धिनी ॥ १५॥ काली कपालिनी कुल्ला कालिका कालरात्रिका । महाकालहृदिस्था
    च कालभैरवरूपिणी ॥ १६॥ कपालखट्वाङ्गधरा पाशाङ्कुशविधारिणी । अभया च भया चैव तथा च भयनाशिनी ॥ १७॥ महाभयप्रदात्री
    च तथा च वरहस्तिनी । गौरी गौराङ्गिनी गौरा गौरवर्णा जयप्रदा ॥ १८॥ उग्रा उग्रप्रभा शान्तिः शान्तिदाऽशान्तिनाशिनी
    । उग्रतारा तथा चोग्रा नीला चैकजटा तथा ॥ १९॥ हां हां हूं हूं तथा तारा तथा च सिद्धिकालिका । तारा नीला
    च वागीशी तथा नीलसरस्वती ॥ २०॥ गङ्गा काशी सती सत्या सर्वतीर्थमयी तथा । तीर्थरूपा तीर्थपुण्या तीर्थदा
    तीर्थसेविका ॥ २१॥ पुण्यदा पुण्यरूपा च पुण्यकीर्तिप्रकाशिनी । पुण्यकाला पुण्यसंस्था तथा पुण्यजनप्रिया
    ॥ २२॥ तुलसी तोतुलास्तोत्रा राधिका राधनप्रिया । सत्यासत्या सत्यभामा रुक्मिणी कृष्णवल्लभा ॥ २३॥ देवकी
    कृष्णमाता च सुभद्रा भद्ररूपिणी । मनोहरा तथा सौम्या श्यामाङ्गी समदर्शना ॥ २४॥ घोररूपा घोरतेजा घोरवत्प्रियदर्शना
    । कुमारी बालिका क्षुद्रा कुमारीरूपधारिणी ॥ २५॥ युवती युवतीरूपा युवतीरसरञ्जका । पीनस्तनी क्षूद्रमध्या
    प्रौढा मध्या जरातुरा ॥ २६॥ अतिवृद्धा स्थाणुरूपा चलाङ्गी चञ्चला चला । देवमाता देवरूपा देवकार्यकरी शुभा
    ॥ २७॥ देवमाता दितिर्दक्षा सर्वमाता सनातनी । पानप्रिया पायनी च पालना पालनप्रिया ॥ २८॥ मत्स्याशी मांसभक्ष्या
    च सुधाशी जनवल्लभा । तपस्विनी तपी तप्या तपःसिद्धिप्रदायिनी ॥ २९॥ हविष्या च हविर्भोक्त्री हव्यकव्यनिवासिनी
    । यजुर्वेदा वश्यकरी यज्ञाङ्गी यज्ञवल्लभा ॥ ३०॥ दक्षा दाक्षायिणी दुर्गा दक्षयज्ञविनाशिनी । पार्वती
    पर्वतप्रीता तथा पर्वतवासिनी ॥ ३१॥ हैमी हर्म्या हेमरूपा मेना मान्या मनोरमा । कैलासवासिनी मुक्ता शर्वक्रीडाविलासिनी
    ॥ ३२॥ चार्वङ्गी चारुरूपा च सुवक्त्रा च शुभानना । चलत्कुण्डलगण्डश्रीर्लसत्कुण्डलधारिणी ॥ ३३॥ महासिंहासनस्था
    च हेमभूषणभूषिता । हेमाङ्गदा हेमभूषा च सूर्यकोटिसमप्रभा ॥ ३४॥ बालादित्यसमाकान्तिः सिन्दूरार्चितविग्रहा
    । यवा यावकरूपा च रक्तचन्दनरूपधृक् ॥ ३५॥ कोटरी कोटराक्षी च निर्लज्जा च दिगम्बरा । पूतना बालमाता च शून्यालयनिवासिनी
    ॥ ३६॥ श्मशानवासिनी शून्या हृद्या चतुरवासिनी । मधुकैटभहन्त्री च महिषासुरघातिनी ॥ ३७॥ निशुम्भशुम्भमथनी
    चण्डमुण्डविनाशिनी । शिवाख्या शिवरूपा च शिवदूती शिवप्रिया ॥ ३८॥ शिवदा शिववक्षःस्था शर्वाणी शिवकारिणी
    । इन्द्राणी चेन्द्रकन्या च राजकन्या सुरप्रिया ॥ ३९॥ लज्जाशीला साधुशीला कुलस्त्री कुलभूषिका । महाकुलीना
    निष्कामा निर्लज्जा कुलभूषणा ॥ ४०॥ कुलीना कुलकन्या च तथा च कुलभूषिता । अनन्तानन्तरूपा च अनन्तासुरनाशिनी
    ॥ ४१॥ हसन्ती शिवसङ्गेन वाञ्छितानन्ददायिनी । नागाङ्गी नागभूषा च नागहारविधारिणी ॥ ४२॥ धरिणी धारिणी धन्या
    महासिद्धिप्रदायिनी । डाकिनी शाकिनी चैव राकिनी हाकिनी तथा ॥ ४३॥ भूता प्रेता पिशाची च यक्षिणी धनदार्चिता
    । धृतिः कीर्तिः स्मृतिर्मेधा तुष्टिःपुष्टिरुमा रुषा ॥ ४४॥ शाङ्करी शाम्भवी मीना रतिः प्रीतिः स्मरातुरा
    । अनङ्गमदना देवी अनङ्गमदनातुरा ॥ ४५॥ भुवनेशी महामाया तथा भुवनपालिनी । ईश्वरी चेश्वरीप्रीता चन्द्रशेखरभूषणा
    ॥ ४६॥ चित्तानन्दकरी देवी चित्तसंस्था जनस्य च । अरूपा बहुरूपा च सर्वरूपा चिदात्मिका ॥ ४७॥ अनन्तरूपिणी
    नित्या तथानन्तप्रदायिनी । नन्दा चानन्दरूपा च तथाऽनन्दप्रकाशिनी ॥ ४८॥ सदानन्दा सदानित्या साधकानन्ददायिनी
    । वनिता तरुणी भव्या भविका च विभाविनी ॥ ४९॥ चन्द्रसूर्यसमा दीप्ता सूर्यवत्परिपालिनी । नारसिंही हयग्रीवा
    हिरण्याक्षविनाशिनी ॥ ५०॥ वैष्णवी विष्णुभक्ता च शालग्रामनिवासिनी । चतुर्भुजा चाष्टभुजा सहस्रभुजसंज्ञिता
    ॥ ५१॥ आद्या कात्यायनी नित्या सर्वाद्या सर्वदायिनी । सर्वचन्द्रमयी देवी सर्ववेदमयी शुभा ॥ ५२॥ सवदेवमयी
    देवी सर्वलोकमयी पुरा । सर्वसम्मोहिनी देवी सर्वलोकवशङ्करी ॥ ५३॥ राजिनी रञ्जिनी रागा देहलावण्यरञ्जिता
    । नटी नटप्रिया धूर्ता तथा धूर्तजनार्दिनी ॥ ५४॥ महामाया महामोहा महासत्त्वविमोहिता । बलिप्रिया मांसरुचिर्मधुमांसप्रिया
    सदा ॥ ५५॥ मधुमत्ता माधविका मधुमाधवरूपिका । दिवामयी रात्रिमयी सन्ध्या सन्धिस्वरूपिणी ॥ ५६॥ कालरूपा
    सूक्ष्मरूपा सूक्ष्मिणी चातिसूक्ष्मिणी । तिथिरूपा वाररूपा तथा नक्षत्ररूपिणी ॥ ५७॥ सर्वभूतमयी देवी पञ्चभूतनिवासिनी
    । शून्याकारा शून्यरूपा शून्यसंस्था च स्तम्भिनी ॥ ५८॥ आकाशगामिनी देवी ज्योतिश्चक्रनिवासिनी । ग्रहाणां
    स्थितिरूपा च रुद्राणी चक्रसम्भवा ॥ ५९॥ ऋषीणां ब्रह्मपुत्राणां तपःसिद्धिप्रदायिनी । अरुन्धती च गायत्री
    सावित्री सत्त्वरूपिणी ॥ ६०॥ चितासंस्था चितारूपा चित्तसिद्धिप्रदायिनी । शवस्था शवरूपा च शवशत्रुनिवासिनी
    ॥ ६१॥ योगिनी योगरूपा च योगिनां मलहारिणी । सुप्रसन्ना महादेवी यामुनी मुक्तिदायिनी ॥ ६२॥ निर्मला विमला
    शुद्धा शुद्धसत्वा जयप्रदा । महाविद्या महामाया मोहिनी विश्वमोहिनी ॥ ६३॥ कार्यसिद्धिकरी देवी सर्वकार्यनिवासिनी
    । कार्यकार्यकरी रौद्री महाप्रलयकारिणी ॥ ६४॥ स्त्रीपुंभेदाह्यभेद्या च भेदिनी भेदनाशिनी । सर्वरूपा सर्वमयी
    अद्वैतानन्दरूपिणी ॥ ६५॥ प्रचण्डा चण्डिका चण्डा चण्डासुरविनाशिनी । सुमस्ता बहुमस्ता च छिन्नमस्ताऽसुनाशिनी
    ॥ ६६॥ अरूपा च विरूपा च चित्ररूपा चिदात्मिका । बहुशस्त्रा अशस्त्रा च सर्वशस्त्रप्रहारिणी ॥ ६७॥ शास्त्रार्था
    शास्त्रवादा च नाना शास्त्रार्थवादिनी । काव्यशास्त्रप्रमोदा च काव्यालङ्कारवासिनी ॥ ६८॥ रसज्ञा रसना
    जिह्वा रसामोदा रसप्रिया । नानाकौतुकसंयुक्ता नानारसविलासिनी ॥ ६९॥ अरूपा च स्वरूपा च विरूपा च सुरूपिणी
    । रूपावस्या तथा जीवा वेश्याद्या वेशधारिणी ॥ ७०॥ नानावेशधरा देवी नानावेशेषु संस्थिता । कुरूपा कुटिला
    कृष्णा कृष्णारूपा च कालिका ॥ ७१॥ लक्ष्मीप्रदा महालक्ष्मीः सर्वलक्षणसंयुता । कुबेरगृहसंस्था च धनरूपा
    धनप्रदा ॥ ७२॥ नानारत्नप्रदा देवी रत्नखण्डेषु संस्थिता । वर्णसंस्था वर्णरूपा सर्ववर्णमयी सदा ॥ ७३॥
    ओङ्काररूपिणी वाच्या आदित्यज्योतीरूपिणी । संसारमोचिनी देवी सङ्ग्रामे जयदायिनी ॥ ७४॥ जयरूपा जयाख्या
    च जयिनी जयदायिनी । मानिनी मानरूपा च मानभङ्गप्रणाशिनी ॥ ७५॥ मान्या मानप्रिया मेधा मानिनी मानदायिनी
    । साधकासाधकासाध्या साधिका साधनप्रिया ॥ ७६॥ स्थावरा जङ्गमा प्रोक्ता चपला चपलप्रिया । ऋद्धिदा ऋद्धिरूपा
    च सिद्धिदा सिद्धिदायिनी ॥ ७७॥ क्षेमङ्करी शङ्करी च सर्वसम्मोहकारिणी । रञ्जिता रञ्जिनी या च सर्ववाञ्छाप्रदायिनी
    ॥ ७८॥ भगलिङ्गप्रमोदा च भगलिङ्गनिवासिनी । भगरूपा भगाभाग्या लिङ्गरूपा च लिङ्गिनी ॥ ७९॥ भगगीतिर्महाप्रीतिर्लिङ्गगीतिर्महासुखा
    । स्वयम्भूः कुसुमाराध्या स्वयम्भूः कुसुमाकुला ॥ ८०॥ स्वयम्भूः पुष्परूपा च स्वयम्भूः कुसुमप्रिया ।
    शुक्रकूपा महाकूपा शुक्रासवनिवासिनी ॥ ८१॥ शुक्रस्था शुक्रिणी शुक्रा शुक्रपूजकपूजिता । कामाक्षा कामरूपा
    च योगिनी पीठवासिनी ॥ ८२॥ सर्वपीठमयी देवी पीठपूजानिवासिनी । अक्षमालाधरा देवी पानपात्रविधारिणी ॥ ८३॥
    शूलिनी शूलहस्ता च पाशिनी पाशरूपिणी । खड्गिनी गदिनी चैव तथा सर्वास्त्रधारिणी ॥ ८४॥ भाव्या भव्या भवानी
    सा भवमुक्तिप्रदायिनी । चतुरा चतुरप्रीता चतुराननपूजिता ॥ ८५॥ देवस्तव्या देवपूज्या सर्वपूज्या सुरेश्वरी
    । जननी जनरूपा च जनानां चित्तहारिणी ॥ ८६॥ जटिला केशबद्धा च सुकेशी केशबद्धिका । अहिंसा द्वेषिका द्वेष्या
    सर्वद्वेषविनाशिनी ॥ ८७॥ उच्चाटिनी द्वेषिनी च मोहिनी मधुराक्षरा । क्रीडा क्रीडकलेखाङ्ककारणाकारकारिका
    ॥ ८८॥ सर्वज्ञा सर्वकार्या च सर्वभक्षा सुरारिहा । सर्वरूपा सर्वशान्ता सर्वेषां प्राणरूपिणी ॥ ८९॥ सृष्टिस्थितिकरी
    देवी तथा प्रलयकारिणी । मुग्धा साध्वी तथा रौद्री नानामूर्तिविधारिणी ॥ ९०॥ उक्तानि यानि देवेशि अनुक्तानि
    महेश्वरि । यत् किञ्चिद् दृश्यते देवि तत् सर्वं भुवनेश्वरी ॥ ९१॥ इति श्रीभुवनेश्वर्या नामानि कथितानि
    ते । सहस्राणि महादेवि फलं तेषां निगद्यते ॥ ९२॥ यः पठेत् प्रातरुत्थाय चार्द्धरात्रे तथा प्रिये । प्रातःकाले
    तथा मध्ये सायाह्ने हरवल्लभे ॥ ९३॥ यत्र तत्र पठित्वा च भक्त्या सिद्धिर्न संशयः । पठेद् वा पाठयेद् वापि
    श
