id: saptamukhihanumatkavac
category: kavacha
name:
  english: saptamukhihanumatkavac
  devanagari: सप्तमुखीहनुमत्कवच्
content:
  english: om hram hridayaya namah | om hrim shirase svaha | om hrum shikhayai vashat | om hraim kavacaya
    hum | om hraum netratrayaya vaushat | om hrah astraya phat || atha dhyanam | vandevanarasimhasarparipuvarahashvagomanushairyuktam
    saptamukhaih karairdrumagirim cakram gadam khetakam | khatvangam halamankusham phanisudhakumbhau sharabjabhayan
    shulam saptashikham dadhanamamaraih sevyam kapim kamadam || brahmovaca | saptashirshnah pravakshyami
    kavacam sarvasiddhidam | japtva hanumato nityam sarvapapaih pramucyate || 1|| saptasvargapatih payacchikham
    me marutatmajah | saptamurdha shiro'vyanme saptarcirbhaladeshakam || 2|| trihsaptanetro netre'vyatsaptasvaragatih
    shruti | nasam saptapadartho'vyanmukham saptamukho'vatu || 3|| saptajihvastu rasanam radansaptahayo'vatu
    | saptacchando harih patu kantham bahu giristhitah || 4|| karau caturdashakaro bhudharo'vyanmamangulih
    | saptarshidhyato hridayamudaram kukshisagarah || 5|| saptadvipapatishcittam saptavyahritirupavan
    | katim me saptasamstharthadayakah sakthini mama || 6|| saptagrahasvarupi me januni janghayostatha
    | saptadhanyapriyah padau saptapataladharakah || 7|| pashundhanam ca dhanyam ca lakshmim lakshmiprado'vatu
    | daran putramshca kanyashca kutumbam vishvapalakah || 8|| anuktasthanamapi me payadvayusutah sada
    | caurebhyo vyaladamshtribhyah sha
  devanagari: ॐ ह्रां हृदयाय नमः । ॐ ह्रीं शिरसे स्वाहा । ॐ ह्रूं शिखायै वषट् । ॐ ह्रैं कवचाय हुं । ॐ
    ह्रौं नेत्रत्रयाय वौषट् । ॐ ह्रः अस्त्राय फट् ॥ अथ ध्यानम् । वन्देवानरसिंहसर्परिपुवाराहाश्वगोमानुषैर्युक्तं
    सप्तमुखैः करैर्द्रुमगिरिं चक्रं गदां खेटकम् । खट्वाङ्गं हलमङ्कुशं फणिसुधाकुम्भौ शराब्जाभयान् शूलं
    सप्तशिखं दधानममरैः सेव्यं कपिं कामदम् ॥ ब्रह्मोवाच । सप्तशीर्ष्णः प्रवक्ष्यामि कवचं सर्वसिद्धिदम्
    । जप्त्वा हनुमतो नित्यं सर्वपापैः प्रमुच्यते ॥ १॥ सप्तस्वर्गपतिः पायाच्छिखां मे मारुतात्मजः । सप्तमूर्धा
    शिरोऽव्यान्मे सप्तार्चिर्भालदेशकम् ॥ २॥ त्रिःसप्तनेत्रो नेत्रेऽव्यात्सप्तस्वरगतिः श्रुती । नासां सप्तपदार्थोऽव्यान्मुखं
    सप्तमुखोऽवतु ॥ ३॥ सप्तजिह्वस्तु रसनां रदान्सप्तहयोऽवतु । सप्तच्छन्दो हरिः पातु कण्ठं बाहू गिरिस्थितः
    ॥ ४॥ करौ चतुर्दशकरो भूधरोऽव्यान्ममाङ्गुलीः । सप्तर्षिध्यातो हृदयमुदरं कुक्षिसागरः ॥ ५॥ सप्तद्वीपपतिश्चित्तं
    सप्तव्याहृतिरूपवान् । कटिं मे सप्तसंस्थार्थदायकः सक्थिनी मम ॥ ६॥ सप्तग्रहस्वरूपी मे जानुनी जङ्घयोस्तथा
    । सप्तधान्यप्रियः पादौ सप्तपातालधारकः ॥ ७॥ पशून्धनं च धान्यं च लक्ष्मीं लक्ष्मीप्रदोऽवतु । दारान्
    पुत्रांश्च कन्याश्च कुटुम्बं विश्वपालकः ॥ ८॥ अनुक्तस्थानमपि मे पायाद्वायुसुतः सदा । चौरेभ्यो व्यालदंष्ट्रिभ्यः
    श
