id: vivekanandastotram-3
category: stotram
name:
  english: vivekanandastotram 3
  devanagari: विवेकानन्दस्तोत्रम् ३
content:
  english: vilagnah || 3|| shrishivasundaradivyajyotirgairikamanditacidghanamurtih | dharaninaraganasumangalakantih
    svamivivekanandakhyatih || 4|| yatiganananditabhasvarasuryam samyamabhushanavikramaviryam | navayuganayakabharatabhanum
    vande vira vivekanandam || 5|| dhikkrita dhanijana nashvarabhogam prajnanirjitabhavagatirogam | shivadhicetanasevavadam
    namata svamivivekanandam || 6|| lokahitakarasusadhitakrityam kamavivarjitasancitasatyam | duhkhanisudanavigatadvandvam
    vande vira vivekanandam || 7|| dinajanaganakleshavinasham patitottarananicasanatham | jivanadayakatattvalapam
    vande vira vivekanandam || 8|| shivamatipuja bhutagaseva santatabhaktya manavadharma | iti navabhavam
    jagati lapantam vande vira vivekanandam || 9|| vivekavairagyobhayasadhyam mayapashacchedanakaryam
    | karatalagatasulabham khalu tattvam staumi nu vivekananda siddham || 10|| gururbodhivyaptatsamupagamanenaiva
    yaminam varenyah sampraptah shrutigatapadartham sugahanam | prasankhyanadhyasa pratipadasakrittatvavidasau
    vivekanando nah sharanamiha bhuyattanubhritam || 11|| iti brahmacarimedhacaitanyaviracitam
  devanagari: विलग्नः ॥ ३॥ श्रीशिवसुन्दरदिव्यज्योतिर्गैरिकमण्डितचिद्घनमूर्तिः । धरणिनरगणसुमङ्गलकान्तिः
    स्वामिविवेकानन्दख्यातिः ॥ ४॥ यतिगणनन्दितभास्वरसूर्यं संयमभूषणविक्रमवीर्यम् । नवयुगनायकभारतभानुं वन्दे
    वीर विवेकानन्दम् ॥ ५॥ धिक्कृत धनिजन नश्वरभोगं प्रज्ञानिर्जितभवगतिरोगम् । शिवधीचेतनसेवावादं नमत स्वामिविवेकानन्दम्
    ॥ ६॥ लोकहितकरसुसाधितकृत्यं कामविवर्जितसञ्चितसत्यम् । दुःखनिसूदनविगतद्वन्द्वं वन्दे वीर विवेकानन्दम्
    ॥ ७॥ दीनजनगणक्लेशविनाशं पतितोत्तारणनीचसनाथम् । जीवनदायकतत्त्वालापं वन्दे वीर विवेकानन्दम् ॥ ८॥ शिवमतिपूजा
    भूतगसेवा सन्ततभक्त्या मानवधर्मा । इति नवभावं जगति लपन्तं वन्दे वीर विवेकानन्दम् ॥ ९॥ विवेकवैराग्योभयसाध्यं
    मायापाशच्छेदनकार्यम् । करतलगतसुलभं खलु तत्त्वं स्तौमि नु विवेकानन्द सिद्धम् ॥ १०॥ गुरुर्बोधिव्याप्तात्समुपगमनेनैव
    यमिनां वरेण्यः सम्प्राप्तः श्रुतिगतपदार्थं सुगहनम् । प्रसङ्ख्यानाध्यास प्रतिपदसकृत्तत्वविदसौ विवेकानन्दो
    नः शरणमिह भूयात्तनुभृताम् ॥ ११॥ इति ब्रह्मचारिमेधाचैतन्यविरचितं
