id: sri-ananta-padmanabha-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Ananta Padmanabha Ashtottara Sata Namavali
content:
  english: om anantaya namah | om padmanabhaya namah | om sheshaya namah | om saptaphananvitaya namah
    | om talpatmakaya namah | om padmakaraya namah | om pingaprasannalocanaya namah | om gadadharaya namah
    | om caturbahave namah | om shankhacakradharaya namah om avyayaya namah | om navamrapallavabhasaya
    namah | om brahmasutravirajitaya namah | om shilasupujitaya namah | om devaya namah | om kaundinyavratatoshitaya
    namah | om nabhasyashuklastacaturdashipujyaya namah | om phaneshvaraya namah | om sankarshanaya namah
    | om citsvarupaya namah om sutragrandhisusamsthitaya namah | om kaundinyavaradaya namah | om prithvidharine
    namah | om patalanayakaya namah | om sahasrakshaya namah | om akhiladharaya namah | om sarvayogikripakaraya
    namah | om sahasrapadmasampujyaya namah | om ketakikusumapriyaya namah | om sahasrabahave namah om
    sahasrashirase namah | om shritajanapriyaya namah | om bhaktaduhkhaharaya namah | om shrimate namah
    | om bhavasagaratarakaya namah | om yamunatirasadrishtaya namah | om sarvanagendravanditaya namah
    | om yamunaradhyapadabjaya namah | om yudhishthirasupujitaya namah | om dhyeyaya namah om vishnuparyankaya
    namah | om cakshushravanavallabhaya namah | om sarvakamapradaya namah | om sevyaya namah | om bhimasenamritapradaya
    namah | om surasurendrasampujyaya namah | om phanamanivibhushitaya namah | om satyamurtaye namah |
    om shuklatanave namah | om nilavasase namah om jagadgurave namah | om avyaktapadaya namah | om brahmanyaya
    namah | om subrahmanyanivasabhuve namah | om anantabhogashayanaya namah | om divakaramuniditaya namah
    | om madhukavrikshasamsthanaya namah | om divakaravarapradaya namah | om dakshahastasadapujyaya namah
    | om shivalinganivashtadhiye namah om tripratiharasandrishyaya namah | om mukhadapipadambujaya namah
    | om nrisimhakshetranilayaya namah | om durgasamanvitaya namah | om matsyatirthaviharine namah | om
    dharmadharmadirupavate namah | om maharogayudhaya namah | om varthitirasthaya namah | om karunanidhaye
    namah | om tamraparniparshvavartine namah om dharmaparayanaya namah | om mahakavyapranetre namah |
    om nagalokeshvaraya namah | om svabhuve namah | om ratnasimhasanasinaya namah | om sphuranmakarakundalaya
    namah | om sahasradityasankashaya namah | om puranapurushaya namah | om jvalatratnakiritadhyaya namah
    | om sarvabharanabhushitaya namah om nagakanyashtataprantaya namah | om dikpalakaparipujitaya namah
    | om gandharvaganasantushtaya namah | om yogashastrapravartakaya namah | om devavainikasampujyaya
    namah | om vaikunthaya namah | om sarvatomukhaya namah | om ratnangadalasadbahave namah | om balabhadraya
    namah | om pralambaghne namah om kantikarshanaya namah | om bhaktavatsalaya namah | om revatipriyaya
    namah | om niradharaya namah | om kapilaya namah | om kamapalaya namah | om acyutagrajaya namah |
    om avyagraya namah | om baladevaya namah | om mahabalaya namah om ajaya namah | om vatashanadhishaya
    namah | om mahatejase namah | om niranjanaya namah | om sarvalokapratapanaya namah | om sajvalapralayagnimukhe
    namah | om sarvalokaikasamhartre namah | om sarveshtarthapradayakaya namah
  devanagari: ॐ अनन्ताय नमः । ॐ पद्मनाभाय नमः । ॐ शेषाय नमः । ॐ सप्तफणान्विताय नमः । ॐ तल्पात्मकाय नमः
    । ॐ पद्मकराय नमः । ॐ पिङ्गप्रसन्नलोचनाय नमः । ॐ गदाधराय नमः । ॐ चतुर्बाहवे नमः । ॐ शङ्खचक्रधराय नमः
    ॐ अव्ययाय नमः । ॐ नवाम्रपल्लवाभासाय नमः । ॐ ब्रह्मसूत्रविराजिताय नमः । ॐ शिलासुपूजिताय नमः । ॐ देवाय
    नमः । ॐ कौण्डिन्यव्रततोषिताय नमः । ॐ नभस्यशुक्लस्तचतुर्दशीपूज्याय नमः । ॐ फणेश्वराय नमः । ॐ सङ्कर्षणाय
    नमः । ॐ चित्स्वरूपाय नमः ॐ सूत्रग्रन्धिसुसंस्थिताय नमः । ॐ कौण्डिन्यवरदाय नमः । ॐ पृथ्वीधारिणे नमः
    । ॐ पातालनायकाय नमः । ॐ सहस्राक्षाय नमः । ॐ अखिलाधाराय नमः । ॐ सर्वयोगिकृपाकराय नमः । ॐ सहस्रपद्मसम्पूज्याय
    नमः । ॐ केतकीकुसुमप्रियाय नमः । ॐ सहस्रबाहवे नमः ॐ सहस्रशिरसे नमः । ॐ श्रितजनप्रियाय नमः । ॐ भक्तदुःखहराय
