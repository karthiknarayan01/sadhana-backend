id: ramashatakam
category: shataka
name:
  english: ramashatakam
  devanagari: रामशतकम्
content:
  english: mavyacciram raghupateravasannashatroh || 2|| candropamam malayacandanarushitangam mandarapushpaparipujitapadapadmam
    | brahmendradevamuniyogiganavritam tam vande'ravindanayanam raghuramacandram || 3|| sampurnacandravadanam
    sarasiruhaksham manikyakundaladharam makutabhiramam | campeyagauravasanam sharacapahastam shriramacandramanisham
    kalayami citte || 4|| sitapatim kamalapatravishalanetram ramam kripakaramanantagunanuraktam | indradisarvasurasiddhasupujitanghrim
    nityam bhaje'hamasunayakamaprameyam || 5|| ekena banamitarena karena capam haram vahantamurasa shirasa
    jatashca | sitasahayamanujena vane carantam shriramacandramanisham kalayami citte || 6|| samsarasagarasamuddharanaikamantram
    brahmadidevamunisevitasiddhamantram | daridryaduhkhabhavarogavinashamantram seve sada gunanidhim raghuramacandram
    || 7|| sitasametamajinambaramaprameyam saumitrina niyatasevitapadayugmam | nilotpaladyutimanantagunam
    prashantam shriramacandramanisham kalayami citte || 8|| shriraghavam dasharathatmajamaprameyam sitapatim
    raghukulanvayaratnadipam | ajanubahumaravindadalayataksham ramam nishacaravinashakaram namami || 9||
    shriraghavam dashamukhantakamambujaksham sitamanoramanamambudaniladeham | kakutsthavamshapayasannidhipurnacandram
    shriramacandramanisham shirasa namami || 10|| rakashashankavadanam raghuvamshadipam rajadhirajatanayam
    ramaniyamurtim | ratrincarantakamanantagunam manojnam shriramacandramanisham sharanam bhaje'ham ||
    11|| kandarpakotisadrisham karunamburashim kakutsthavamshakanakacalaratnadipam | kanjatapatranayanam
    karacapabanam kalyanaramamanisham sharanam bhaje'ham || 12|| vishvadhipam vibudhapujitapadapadmam
    viprapriyam vimalapankajapatranetram | vidyatmakam vijitarakshasavirakotim shriviraramamanisham sharanam
    bhaje'ham || 13|| padmasanadipuruhutasurarcitam tam papandhakarataranim pavanatmajesham | pankeruhakshamakhilashrutimaulisaram
    pattabhiramamanisham sharanam bhaje'ham || 14|| shrivatsaharamakutangadabhushitangam shribharatividhritacamaravijyamanam
    | shrinayakam shivavirincinutanghripitham shriramacandramanisham sharanam bhaje'ham || 15|| yatpadapankajarajah
    shrutibhirvimridyam
  devanagari: मव्याच्चिरं रघुपतेरवसन्नशत्रोः ॥ २॥ चन्द्रोपमं मलयचन्दनरूषिताङ्गं मन्दारपुष्पपरिपूजितपादपद्मम्
    । ब्रह्मेन्द्रदेवमुनियोगिगणावृतं तं वन्देऽरविन्दनयनं रघुरामचन्द्रम् ॥ ३॥ सम्पूर्णचन्द्रवदनं सरसीरुहाक्षं
    माणिक्यकुण्डलधरं मकुटाभिरामम् । चाम्पेयगौरवसनं शरचापहस्तं श्रीरामचन्द्रमनिशं कलयामि चित्ते ॥ ४॥ सीतापतिं
    कमलपत्रविशालनेत्रं रामं कृपाकरमनन्तगुणानुरक्तम् । इन्द्रादिसर्वसुरसिद्धसुपूजिताङ्घ्रिं नित्यं भजेऽहमसुनायकमप्रमेयम्
    ॥ ५॥ एकेन बाणमितरेण करेण चापं हारं वहन्तमुरसा शिरसा जटाश्च । सीतासहायमनुजेन वने चरन्तं श्रीरामचन्द्रमनिशं
    कलयामि चित्ते ॥ ६॥ संसारसागरसमुद्धरणैकमन्त्रं ब्रह्मादिदेवमुनिसेवितसिद्धमन्त्रम् । दारिद्र्यदुःखभवरोगविनाशमन्त्रं
    सेवे सदा गुणनिधिं रघुरामचन्द्रम् ॥ ७॥ सीतासमेतमजिनाम्बरमप्रमेयं सौमित्रिणा नियतसेवितपादयुग्मम् । नीलोत्पलद्युतिमनन्तगुणं
    प्रशान्तं श्रीरामचन्द्रमनिशं कलयामि चित्ते ॥ ८॥ श्रीराघवं दशरथात्मजमप्रमेयं सीतापतिं रघुकुलान्वयरत्नदीपम्
    । आजानुबाहुमरविन्ददलायताक्षं रामं निशाचरविनाशकरं नमामि ॥ ९॥ श्रीराघवं दशमुखान्तकमम्बुजाक्षं सीतामनोरमणमम्बुदनीलदेहम्
    । काकुत्स्थवंशपयसान्निधिपूर्णचन्द्रं श्रीरामचन्द्रमनिशं शिरसा नमामि ॥ १०॥ राकाशशाङ्कवदनं रघुवंशदीपं
    राजाधिराजतनयं रमणीयमूर्तिम् । रात्रिञ्चरान्तकमनन्तगुणं मनोज्ञं श्रीरामचन्द्रमनिशं शरणं भजेऽहम् ॥ ११॥
    कन्दर्पकोटिसदृशं करुणाम्बुराशिं काकुत्स्थवंशकनकाचलरत्नदीपम् । कञ्जातपत्रनयनं करचापबाणं कल्याणराममनिशं
    शरणं भजेऽहम् ॥ १२॥ विश्वाधिपं विबुधपूजितपादपद्मं विप्रप्रियं विमलपङ्कजपत्रनेत्रम् । विद्यात्मकं विजितराक्षसवीरकोटिं
    श्रीवीरराममनिशं शरणं भजेऽहम् ॥ १३॥ पद्मासनादिपुरुहूतसुरार्चितं तं पापान्धकारतरणिं पवनात्मजेशम् । पङ्केरुहाक्षमखिलश्रुतिमौलिसारं
    पट्टाभिराममनिशं शरणं भजेऽहम् ॥ १४॥ श्रीवत्सहारमकुटाङ्गदभूषिताङ्गं श्रीभारतीविधृतचामरवीज्यमानम् । श्रीनायकं
    शिवविरिञ्चिनुताङ्घ्रिपीठं श्रीरामचन्द्रमनिशं शरणं भजेऽहम् ॥ १५॥ यत्पादपङ्कजरजः श्रुतिभिर्विमृद्यं
