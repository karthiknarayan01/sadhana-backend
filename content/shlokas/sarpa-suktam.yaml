id: sarpa-suktam
category: stotram
name:
  english: Sarpa Suktam
  devanagari: सर्पसूक्तम् १ (ऋग्वेद एवम् यजुर्वेदान्तर्गतम्)
content:
  english: namo'stu sarpebhyo ye ke ca prithivimanu | ye antarikshe ye divi tebhyah sarpebhyo namah ||
    1|| ye'do rocane divo ye va suryasya rashmishu | yeshamapsushadah kritam tebhyah sarpebhyo namah ||
    2|| ya ishavo yatudhananam ye va vanaspatim+ ranu | ye va'vateshu sherate tebhyah sarpebhyo namah
    || 3|| rigveda khilani (2|14) svapnassvapnadhikarane sarvam nishvapaya janam | a suryamanyamstvapayavyusham
    jagriyamaham || 4|| ajagaronama sarpah sarpiravisho mahan | tasminhi sarpassudhitastenatva svapayamasi
    || 5|| sarpassarpo ajagarasarpiravisho mahan | tasya sarpatsindhavastasya gadhamashimahi || 6|| kaliko
    nama sarpo navanagasahasrabalah | yamunahradehaso jato yo narayana vahanah || 7|| yadi kalikadutasya
    yadi kah kalikat bhayat | janmabhumimatikranto nirvisho yati kalikah || 8|| ayahindra pathibhirilitebhiryajnamimanno
    bhagadeyanjushasva | triptam juhurmatulasye vayosha bhagasthe paitrishvaseyivapamiva || 9|| yashaskaram
    balavantam prabhutvam tameva rajadhipatirbabhuva | sankirnanagashvapatirnaranam sumangalyam satatam
    dirghamayuh || 10|| karkotako nama sarpo yodvashti visha ucyate | tasya sarpasya sarpatvam tasmai
    sarpa namo'stute || 11|| sarpagayatri - bhujangeshaya vidmahe sarparajaya dhimahi | tanno nagah pracodayat
    || 12|| namo astu sarpebhyo ye ke ca prithivimanu | ye antarikshe ye divi tebhyah sarpebhyo namah
    || ye'do rocane divo ye va suryasya rashmishu | yeshamapsu sadah kritam tebhyah sarpebhyo namah ||
    ya ishavo yatudhananam ye va vanaspatiranu | ye va vateshu sherate tebhyah sarpebhyo namah || 4| 2|
    8|| taittiriyasamhita First thri are from taittiriya shamhita 4|2|8 number 4-11 are from ṟigveda khhilas
    adhyaya 2 14 related to mandala 7 - 3
  devanagari: नमोऽस्तु सर्पेभ्यो ये के च पृथिविमनु । ये अन्तरिक्षे ये दिवि तेभ्यः सर्पेभ्यो नमः ॥ १॥ येऽदो
    रोचने दिवो ये वा सूर्यस्य रश्मिषु । येषामप्सूषदः कृतं तेभ्यः सर्पेभ्यो नमः ॥ २॥ या इषवो यातुधानानां
    ये वा वनस्पतीम्+ रनु । ये वाऽवटेषु शेरते तेभ्यः सर्पेभ्यो नमः ॥ ३॥ ऋग्वेद खिलानि (२।१४) स्वप्नस्स्वप्नाधिकरणे
    सर्वं निष्वापया जनम् । आ सूर्यमन्यांस्त्वापयाव्युषं जाग्रियामहम् ॥ ४॥ अजगरोनाम सर्पः सर्पिरविषो महान्
    । तस्मिन्हि सर्पस्सुधितस्तेनत्वा स्वापयामसि ॥ ५॥ सर्पस्सर्पो अजगरसर्पिरविषो महान् । तस्य सर्पात्सिन्धवस्तस्य
    गाधमशीमहि ॥ ६॥ कालिको नाम सर्पो नवनागसहस्रबलः । यमुनाह्रदेहसो जातो यो नारायण वाहनः ॥ ७॥ यदि कालिकदूतस्य
    यदि काः कालिकात् भयात् । जन्मभूमिमतिक्रान्तो निर्विषो याति कालिकः ॥ ८॥ आयाहीन्द्र पथिभिरीलितेभिर्यज्ञमिमन्नो
    भागदेयञ्जुषस्व । तृप्तां जुहुर्मातुलस्ये वयोषा भागस्थे पैतृष्वसेयीवपामिव ॥ ९॥ यशस्करं बलवन्तं प्रभुत्वं
    तमेव राजाधिपतिर्बभूव । सङ्कीर्णनागाश्वपतिर्नराणां सुमङ्गल्यं सततं दीर्घमायुः ॥ १०॥ कर्कोटको नाम सर्पो
    योद्वष्टी विष उच्यते । तस्य सर्पस्य सर्पत्वं तस्मै सर्प नमोऽस्तुते ॥ ११॥ सर्पगायत्री - भुजङ्गेशाय
    विद्महे सर्पराजाय धीमहि । तन्नो नागः प्रचोदयात् ॥ १२॥ नमो अस्तु सर्पेभ्यो ये के च पृथिवीमनु । ये अन्तरिक्षे
    ये दिवि तेभ्यः सर्पेभ्यो नमः ॥ येऽदो रोचने दिवो ये वा सूर्यस्य रश्मिषु । येषामप्सु सदः कृतं तेभ्यः
    सर्पेभ्यो नमः ॥ या इषवो यातुधानानां ये वा वनस्पतीरनु । ये वा वटेषु शेरते तेभ्यः सर्पेभ्यो नमः ॥ ४।
    २। ८॥ तैत्तिरीयसंहिता Fइर्स्त् थ्री अरे फ़्रोम् टैत्तिरिय षम्हित ४।२।८ णुम्बेर् ४-११ अरे फ़्रोम् ऱिग्वेद
    ख़्हिलस् आध्याय २ १४ रेलतेद् तो ंअन्दल ७ - ३
