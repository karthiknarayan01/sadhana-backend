id: narayana-satakam-telugu
category: stotram
name:
  english: Narayana Satakam (Telugu)
content:
  english: shriramamani panipankajamridushritajna padabja shrim garakarasharira sadbhaktamam darambhoruhapatralocana
    kaladharorusampatsudha paravaravihara kadakum bayaka veyinollu gala ya kakodaradhishu gadamutta nvinutimpa
    leka niguda gralanga nòpparu mi mmadara sannuti seya naduvashame da nivu napativi ninne kani yòndèvvari
    dhyanimpam branutimpa natlagutaku nna nercu candambuna ni namastutu lacarincu nèdala nne tappulum
    galgina nèraya nnirmala maina ni stutikathanikambu padyambulo nòrugul mikkili galgèneniyu gadu nyogambè
    carcimpa guriga npainanu vankaboyina bedèttinam jèṟakum golaku tipu gaka kalade pèkkulu sangrahinci
    pidapam jalanga sujnani yai madilo dagu namarmambu vikshimpa de mòdalam gadida carugandhavitatul movanga
    shakyambè ka kadi saurabhyapariksha juda kushale yavyakta gabbambu karata mivvasudha nèllam nmincè
    bo nikatha vali karpuramu nincina nnitaramau vyardharthakamodamul pèlucam bunina yakkaratamu tudin
    betekaratambè po caladindivarapatralocana mana mara nnacalendrajadhipatiki nmastagramanikyamai munikopanaladagdha
    rajatatiki nmuktisphuranmargamai yènaya sayakashayikim jananiyai yeparu minnetikim jani mulambagu
    nanghri nadu madilo ni putrundu caracarapratatula nnirminci pèmpara ga ni punyangana sarvajivatatula
    nnityambu rakshimpa ga ni padodaka mijagattrayamula nnishpapulam jeya ga ni pèmpemani cèppavaccu suguna
    nityatma brahmandavalilona satvagunivai bahyambunam dadima brahmakhyam baratatvabodhamulakun bhavyadhinathundavai
    brahmendramaravayubhukpatulaku bhavimpa rakunna na jihmavyaptula nènna nadu vashame cidrupa dhara
    simhasanamai nabhambu gòdugai taddevatal bhrityulai paramamnayamu lèlla vandiganamai brahmanda magaramai
    siri bharyamaniyai virinci kòdukai shriganga satputriyai varusa nni ghanarajasambu nijamai vardhillu
    jòcci yasuru nmardinci yavvedamul magudam dècci virinci kicci yatani nmanninci yepara baga sadhincina
    divyamurti vani ne bhavintu nèllappudun khagarajadhvaja bhaktavatsala jagatkarunya kato natyantasamarthyulai
    bhramaridandamu mandaracalamuga bathonidhim draccaga damakincè bhuvanatrayambunu girul mrògginam gamathambai
    dhariyinci mincina jagatkalyana bhimakaravarahamai bhuvanamul bhitilli kampimpa nu ddamorvim gònipoyi
    niranidhilo da garavimpanga ni bhumim dakshinadamshtra nèttina ninum bujintu narayana stambhambandu
    nrisimhamai vèdali yaccandattahasadhvanul dambholim gaduvanga hemakashipoddandasuradhishvaru shumbhadgarbhamu
    vracci vani sutunin shobhilla manninci ya jjambharatini briti delcina ninum jarcintu mahiyu nnakasamum
    badadvaya parimanambuga bètti ya graha mòppam balimastakam bòka padagrastambuga nèmmito viharincindra
    virinci shankara mahavirbhuta divyakritin sahajambai vèlasillu vamana lasaccaritra raktamahahradambu
    lèlamim drailokya nirdishtamai paragam baitrika tarpanambukòrakai prakhyatiga niruvai yòkkatimaru
    kshatravarula nnepara nirjinci ta tparashubhrajita ramanamamu kadu jampi kaishiku magha svasthyambu
    gavinci sham karu capam bògi dagam galyanamai tandripam parudaran gi jagadahladambuga ravanun dharanim
    gulcina ramanamamu kadu davai yabhila shauryonnatin madavaddhenuka mushtika dyasurula mardinci lilarasa
    spada kelirati revativadana kanjatantabhringam bana viditambau balaramamurtivani nin puramu lmudunu
    mudulokamulu nepròddu nvidarimpa da tpuranari mahimonnatul sèdutakai buddhundavai buddhito varabodhadruma
    seva jeyutakunai varim brabodhinci ya ppuramul gèlcina ni yupayamu jagatpujyambu bapasankalitulai
    garvandhulai tucchulai kulashilambulu mani heyagatulam gròvvaru dushtatmulam baliga dalanci dharma
    mèlamim balinci nilpanga mi valanam galkyavatara mònda sacaracarapratatula nnènnanga shakyambu ka
    karaya padmabhavanda bhandacayamu nnaranga mikukshilo narudara nnudayincu gu nnannarikelodbhavam tara
    vahpuramu canda mòndi yèpudun daladindivara nilanirada samudyadbhasitakara shri lalana kaustubhacaruvaksha
    vibudhashlaghodbhavasthana ko mala nabhicaranaravindajanitamnayadyaganga lasa jjalajatayatanetra ninnu
    madilo jagadadharaka bhaktavatsala kripajanmalayapanga bhu gaganarkendujalatmapavaka marutkaya pradipaprayo
    gi ganastutya mahaghanashana lasadgirvana samsevita bhutavratamu nambujasanu davai puttintu vishnundavai
    pritim brotu harundavai cèritu nirbhedyundavai traiguno petambai paramatmavai nilutu ni pèmpèvvarum
    gana ra bjatodbhutasujatapujitapadabjashreshtha varanabhidhavalambujodaramuna galpinci ya ppurushashreshthuni
    phalamandu shivunim buttinci yametikim baramottamsamuga viyattalanadim badambulam ganna mi sari yèvvaralu
    miru dakka prabha minabhi janincinatti vilasatpadmorusadmambunam brabhavambaina virinci phalajanita
    prasvedasambhutu dai yabhidhanambunu gori kancènu bhavum daryeshu luhimpa ga nabhavakhyundavu ni nnèringavashame
    yabjaksha patugarbhantaragolabhagamuna ni brahmandabhandambu pra kata divyadbhutalila dalci mahimam
    galpanta mambhodhipai vatapatragramu jèndi yòppina mimu nvarnimpa ga shakyame nitalakshamburuhasanadikulaku
    nnirvana savisheshoru suvarnabinduvilasa ccakrankalingakriti badmarice bhanuce dhruvuce na divijadhinayakulace
    dipyanmunindralice navadivyarcana landucunduvu ramanarisha vasiyincu nitanuvunan sarvambunam dundaga
    sarvatma vasiyincu divani madin juci ya girvanadulu vasudevu girtintu repròddu na shirvadambu bhavanmahamahima
    lakshminatha gaganadyancitapancabhutamayamai kanjatajandavalin sagunabrahmamayakhyatam danarucun samsarivai
    citkala sugunambai vilasillu divu vipulasthulambu sukshmambunai nigamottamsa gunavatamsa sumahanityatma
    bhavadiyanamakathanam bemartyucittambulo bòluparam dagilunduneni yaghamul pòndanga nè tlopèdu battuvadu
    nakkashthambupai niluva nnercune bhaktaposhana kripanityatma kalayam dikkulu nindi candataramai kapparu
    meghaughamul ghorasamiranasphuranace ve payucandambuna jaladambholi mrigagnitaskararujashatroragavratamul
    gu nmi dagu divyamantrapathana kalushagathavinashakari yagucum gaivalyasandhayiyai nali nòpparèdu
    mantrarajamagu ninamambu premambuto nalara nnèvvani vakkunam bòrayade nannicu ghoratmayu bhuruhakotaram
    badiya su vedatma paramambai paratatvamai sakalasampatsaramai bhavyamai surasiddhoragayaksha pakshimuniraksho
    hridguhabhyantara sthirasujnanasudipamai shrutikalasiddhantamai siddhamai sari le kèppudu nidunama
    mamarun adhikaghaugha tamodivakaramunai yadrindraja jihvakun sudhayai vedavinutnaratnamulakun sutrabhidhanambunai
    budhasandohamanoharankuramunai bhudevatakotikin vidhulai mibahunamaraji vèlayun drova vedamulakum
    buttillu modambunam dunikisthanamu nishtabhogamulaku nnutpatti yepròddunu ghanapapambula vairi shadripulaku
    galavasanambu mi vinutanghridvayapadmasevana gada vishvesha bhavarogambula mandu patakatamobalarkabimbambu
    ka rma vishajvalasudhamshugamrita tusharavratapathodhimu rtivi kaivalyapadavalokana kaladivyanjanashreshthamai
    bhuvilo midagu mantraraja mamarun garmapipilikakrita tanuvalmikanalambulo barushakaramuto vasincina
    maha paporagashrenikim baramoccatanamai rahasyamahimam batimpucu nnundu mi tirumantram bagu mantraraja
    mamarum divyatma haruni nnadrija nanjaneyuni guhu nnayyambarishun brahladu vibhishanakhyuni balin
    bayakundunu bhavannamambu shrikinmandiramaina vakshamu surajyeshthodbhavasthana na bhikanjatamu candrikantara
    sudhabhivyakta netrambulu lokastutya marunnadijanaka malolanghriyu da vaina ninnèpudu nalo vindu latancu
    goparamanul ga muddumomalara ni nnalingitum jeyuco dèndambul danivara ragarasavitililala delcu mi
    mandasmera mukhenduroculu mamu nmannincu vindu lvacciri miyashodakadaku nvegambè pò mmayyayo nandanandana
    bo vemi ma mandam jatara seya boda midè ramma yancu mi mmèttuko candam babbina nubbakundudurè ghoshastrilu
    anna krishnama nedu velpulaku mi dannara micatlalo vènnal muttaku manna nakshanamuna nvishvakritisphurti
    vai yunnan bègadi ninnoli nnutul nudutipai nuppònga momètti dha mmillam ballalanada ragarasasammishrambuga
    nivu vre pallèm daducu gopa gonivaha gopastrila yullambu mi pillangrovini jutti ra digucu ni pèmpòppu
    pasi mesi pròddu galugam gantaramum basi ya ppasiyu nnivunu vaccuco nèduruga baikònna gopangana rasavadvrittapayodharadvaya
    haridralepanamodamul gòncu vaccutalu ne bhavintu ki caukalimpa nadumum javvada kandarpasam pannakhyambu
    natincu madki kabaribharambu lutada ga vinnanambu natimpa gopajana gobrindambuto vaccu mi vannèl kannula
    munci grolutalu ne varnintu draccucu nòkkagopika mimum bremambunam juci ra ga rasaveshata ritta dracca
    nida nakavvambu nivu nmano haralilam ganugòncu dhenu vani yayyabotunum batti ti varavrittantamu lenu
    punyakathaga varnintu golayu guticikkamu nògim gilinci nèttambunam bilipincamu jutti nènnadumunam
    binchavali gatti ka rnalankara kadambaguccha madhumattalisvanam bòppa ni valan gacinabhava mitti dani
    ne varnintu kalinditatabhumi nalakadupul samu ttalola tamalapadapa shikhantasthundavai venuram dhralin
    ragarasambu ninda vilasadragambu sandhinci go palavratamu gandugoyilaluga varnintu ragilli solanga
    mi venukvanamu vinulam badi manovithul ga ghonagrambulu midi kèttukòni langulambu lallarci go shrenul
    cindulu dròkki yadutalu ne pasulangapari ye mèringu madhuraprayollasadvrittava gvisararavamu movi
    da vèdurugrovim bèttina du gopika latadganambulan jeyucandamulu ne varnintu dada vayyè jèyyi yalasè
    shailambu macetulam didu manna hinokti gipètta nè kkudu govul dadalam govardhanadrindramun lalitakuncitaveniyam
    dadavimòllal mòlakannavvula cupu loragila me nmuvvankala ga nali gaikònduvu gadè nivu muralinatyambu
    mapalam gadu gròvvi gopikalato mattilli vartintuve mapalèmbula vacci yundudu vèsa nmapalalo nundu
    mi mapa lainasukhabdhilo munugucun manninci ta gòllalan mapalam galavelpu vivè yani ka mannintu òkakantamani
    kòkka divu maṟiyu nnòkkartè kòkkanda vai sakalastrilaku santatam balara rasakrida tanmadhya ka lpakamulambu
    savenunadarasa mòppanga badarvela go pikalam jèndi vinoda mòndunèda ni pèmpòppu narayana lalitam baina
    bhavattanuvilasanan lavanyadivyamritam balu da mandanda gopanganal pu lpadulu katti kandalita nutnashrilu
    vatintu ra nèlatal tivèlu caitravisphuranamau ni yòppu narayana putanapranavayuvulu palindlandu vèllinci
    du shshilundai canu bandidanavu vèsam jindai padam danni ya rola nmaddulu gulci dhenudanujun janga
    nilginci ve kulan gòtti gopikalakorkul rasanagrambuna nidu namaruciyu jèvluku nnasalaranga bhavatkathabhiratiyun
    hastabjayugmambulan vèsa nipadasupujitadiyugamun varakalinditarangadolikalalo vaikunthadhamambulo
    vèra vòppara nayodhyalo madhuralo vrepallèlo dvaraka purilo nadèdubhangi nadumadilo bhuriprasannananam
    buruham bòppa natincu tòppunu sitambhojaksha calla lveṟòkayura nammukònu nasam bovuco drova ni vullasambuna
    nadda katti madanodyoganulapambula jallanicupu jallu mani gopastrilapai jallu mi callamborutèṟangu
    jittamuna ne jarcintu narayana buranamulu brakhyatambuga tèlpi mi valanan vyarthaprayatnambè po gulakantamani
    gòddu voyina gatim gròvvarusasyambu da phalakalambuna nicapovu pagidin nadulandu jeyuta gajasnanambu
    candambagu maunam bòppa japincuveda matavi madhyambulone dpagun nanahomamu lèlla budidalalona nvelcu
    nèyyai canu nninamoktiyu nipadabjaratiyun jilikina nnanitane payu na yila papambulu durbharatvamu
    mahaheyambunam bòndinam baluvai jivuni dòppa ginavi yibahyambunam bayune pòliyum gaka bhavatsupadajalamum
    brokshimpa narayana tanacittabjamu mipadabjamulakum datparyasadbhakti tam tuna bandhincina bandhanambu
    katanam dushpapapunjambu lè llanu vicchinnamulai yadangu mahimollasabdhi yainatti da suna kimpòndunu
    mokshavaibhavamu da sushloka narayana dai yanayambu nmadi dannèringaka tudi nnamayace magnu dai tanutattvadiviyogamaina
    pidapam da nercune nidu da rshana mimpara ga bhaktivaibhava mahasankasha narayana satvikasampadanvita
    mahadasohabhavambunan nanayambu nmadi nanyadaivabhajanam baranga dulimpucun janitahladamutoda nicaranamul
    sadbhakti pujinci ni ganugònnantanè kalmashambu lada da mi caranambhoruhadarshanambu galade sampriti
    nètlanna du ganna dustara paradravyambupai nashalam bòraya nnercunè durlabham bagu gripambhojaksha
    narayana paramajnana viveka purita maha bhavyantaralambuna paraga nni nijanamamantra mònaran bhakti
    nnanushthimpucum duritanveshana kalabhutamu vèsan bhavyapadambu nòndutaku nai yavyakta narayana sarighorandhaka
    bodhakarana vipatsamsara malinyamu paramananda subodhakarana lasadbhasmambupai nu di ya niratajnanasukantidarpanamuna
    nnissangu dai tannu da narayam gancinava parushalapamu lada nodi madi nipaparjanarambhu gidu seyaka
    madi nnirmuktakarmundu nai paramanandanishedhamul samamuga bhavinci vikshincu na paramajnani bhavatkripam
    bòrayu no padmaksha narayana òrulam dannu nèringu niyyèrikayu nnòppara nekanta mam darayam baipadu
    nanyabhaminulapai nakankshaduratvamun maranavasthanu nidunamamulè sanmanambunam do dharalona nnivi
    durlabhambulu sudhadhamaksha narayana vèra vòppa nbahushastramantramu lògi nvikshinci ve tèlpi mi
    varanamamritapura manucu samsaramatuhpayo dharadugdhambulu grola neraru vèsa vedambandu sunishcayundagu
    mahavelpèvva do yancu na vedavyasa parasharul vèdakina nveṟòndu le dancu mi padambhojamu lèllapròddu
    madilo bhavintu ratyunnatin shridevivadanaravindamadhupa shriranga narayana sutadaraptajanadivittamulapai
    shunyabhilashundu nai yatanodrekayutambulai pòdalunayyai yindriyavratamul bòndinci damambunan miṟanga
    vartincu ni rgatasamsari bhavatkripam bòrayu no kanjaksha narayana bhakti nnanushthimpucun namara
    nnanna suvarna go salila kanya dharuni grama da namu lamnaya vidhokti bhusurulakun damarendrarcita
    vaibhavonnatu ila nèvvari manambulo nèrika da nèntènta galgundu na kòladim jèndi vèlungucundu kalaya
    ngovinda nirupula alara nnambu mitambu laisarasilo nambhoruhambul nila nòpparèdu canda mòndè dèpudu
    nnilanga narayana madilo nuttamabhakti pithamupayi gadiyam jercina vani ke nòdayadan ga dancu natyunnatin
    padilum dai samavarti mrityuvunaku balku mi padapadmarcaku lènta punyulò kripaparina narayana kula
    mènnam gòla dela yekulaju dum gotrabhimanabhila shalunajnanamu basi jnanamu madin sandhinci shuddhatmu
    dai yalararam barusambu so hemakritistomamai vèlayu nnagativa niratanandayogulai niyatulai nirbhagyulai
    niculai karunahinamanaskulai malinulai kashtatmulai nashtulai parushavyadhinibaddhulai patitulai bhagnangulai
    mragguva raraya nni nnògi natmayam didaniva rabjaksha narayana ghanabhogaspadulai gataughamatulai
    karunyulai muktulai dhanakirtipradulai dayabhiratulai dharmatmulai nityulai manujadhishvarulai manojanibhulai
    manyasthulai svasthulai yònara nnòppèduvaru nipadaruci nnuhincu narayana viditamnaya nikaya bhutamulalo
    vijnanasampatkala spada yogindramanassarojamulalo brahmendradikpalaka tridashavratakiritaratnamulalo
    dipincucunnatti mi padapadmambulu bhavagehamuna ne bhavintu narayana balurogambulu nantya mandu yamu
    dum badhimpa nattaina yi palujanmambulu cala duliti nanum balimpave deva mi phalitananda dayavalokanamu
    napai balukarmayata pashabandhavitati jalayantranvita bandhayatanagatin samsarakupambulo nalaram drimmarucundu
    nannu nakata mamahankara vikarasannibha mahamattadi lobhandhaka ramuce muktiki ne ra dinka nalona
    ni vimalapanga daya divakararucin vèlgimpu mimpara no kamalananda viharavakshalalita paripandhikriya
    nòtti vènta dulinci mi caranabjasthiti panjarambu sharaneccham jòccitim gavumi birudum judumu miru
    suda ga bhavadbhrityundu duhkhambulam bòraya nni kapakirti gadè sharadambhojaksha narayana satatacaramu
    sunritambu kripayun natishantatvamu cittashuddhikaramu nnadhyatmayu dharmamu sarvajivahitamum durambu
    gakunda sa mmatikim jeruva minivasasukhamun bhagirathim grishna ve travati nnarmada pènna gautami
    payorashi nviyadganga yam davagahambuna naina punyamulu bèmparanga ne bhavadanghrismaranambunam galugu
    po padmaksha narayana dhara gramadhipu nintidasu du vèsam da drohamum jesinan paragam jèlluta suci
    ti bhuvanasampadyunda vainatti mi varadasavali dasadasi nani durvaraughamul karunam jekòni kavu mayya
    trijagatkalyana narayana bahudharmashastranigamaugham bèppudu nni nnaka ranabandhum dani cèppa nattèṟa
    gu duram bandakundanga ne branatul ganutimpam badi lekundinan rinama nanuti nivu shripativi ni ke
    lappu karinathundu jalagrahagrahana duhkhakrantu grishanu bhanushatatejasphurti yainatti mi karacakrambuna
    nakrakanthamu vèsa khandinci mincèm daya parasadbhakta bhayanaka prakara satprakatya narayana dalancè
    gajayudhendrundu apannu dai yebhavambuna draupa dayyèda ramadhisha yanè nvayasam bebhavambuna nisharanya
    manèno yi ni kripadrishtice nabhavambuna nitalampu galuga nna kimmu narayana du cetipunka vidicè nniyinti
    bhikshambuna danarè nninamajapyambunan niprapu sevincinan nilagriva mukhabjabhaskara kripanityatma
    narayana du nicamati po tatvajna narayana ninu varnimpani nicabandhamati da nirmagnamudhatmu sevincucandambu
    ta navalam barina bhutiyandu vèlaya nnajyahutul puni ve lcina candambuna vyarthamai tanaru ju cidrupa
    narayana ninu varnimpani jihva da nilabhradehangaka ninu nalimpani cèvlu da nirejapatrekshana ninu
    nirvahakakshmatala ninu jintimpani yatma da nive tallivi nivè tandri varaya nnive jagannathu dau nive
    nishcalabandhavunda varaya nnive munistutyu dau nive shankaramulamantra marayan nive dikkanuvari varalè
    kadu nnivaru narayana aparadhambulu ninnu nammi vinu me najanmaparyantamu ka nive dikku naloniki gapatam
    bintayu leka dandadharukum gattika rakshimpu mi kripakum batru da nayya dharmapuri lakshminatha narayana
    cèllam jesiti patakambulu madi bovani nammi padyashatamun cèllambo nanu nammè vi dani dayam jepatti
    rakshimpumi tallim dandriyu nivu gaka yòrule tarkimpa narayana narasim hacyuta vasudeva vikasannalikapatraksha
    bhu dhara govinda mukunda keshava jagattra tahitalpambujo dara damodara tarkshyavahana mahadaityari
    vaikunthamam dira pitambara bhaktavatsala kripan kadakantam gadaleni sampada lògim gavimpu lakshmisha
    pa lkadalin bannagashayivai bhuvanamul galpincu satputruni jesina nabhipankaja jagatpunyatma bhagirathi
    padatim ganna padaravindamula ne bhavintu narayana mantrasamastayajnaphalamul punyasutirthasevaphalamul
    upavasavratashilakarmaphalamul òppara ninnatmalo nupamimpam galavarike galugu veyu nnela narayana
    jalu duritashreni nnivarimpa ga nanandasthiti galgu nancu nigamarthaneka mèllappudu jèppa nenu vini
    shrinarayana yancu ni nne ne nèppudu gòltu brova gadè tandri nannu narayana kalitaghaugha vinashakari
    yagucum gaivalyasandhayiyai nali nòpparèdu mantraraja magu ninamambu premambuna alara nnèvvani vakkunam
    bòrayado yannicu dehambu da vèlaya bhuruhakotaram badiya su vedatma narayana ramaniyambuga nadimambu
    navatarambu bhavaddivyaru pamu namamritamu dalampa dashakapra ptayyè grishnavata ramu sujnanamu mokshamu
    shatandhrakhya ka vyamu narpinciti mipadabjamulaku ni pada nirmalyani shthamodambu nèringa nimam bòppa
    bhajimpa nijapamu varnimpa gripam jeyave shri minca
  devanagari: श्रीरामामणि पाणिपङ्कजमृदुश्रीतज्ञ पादाब्ज शृं गाराकारशरीर सद्भक्तमं दाराम्भोरुहपत्रलोचन
