id: turiyopanishat
category: upanishad
name:
  english: turiyopanishat
  devanagari: तुरीयोपनिषत्
content:
  english: turiyopanishat kalatitashceti | tanna catvarah | akarashcayutavayavanvitah | ukarah shatavayavanvitah
    | makarah sahasravayavanvitah | ardhamatrapranavo'nantavayavanvitah | saguno viratpranavah | samharo
    nirgunapranavah | ubhayatmaka utpattipranavah | yatharthakathanomityuccaryabhimanotpattipranavah |
    sarvopasamharena samharapranavah | ubhayatmakatvat viratpranavah | utpattipranavo dirghaplutavirat
    | plutaplutyupasamharah | viratpranavah shodashamatranvitah | shattrimshattattvayutah | shodashamatratmakam
    kathamityucyate | akarah prathamah | dvitiya ukarah | makarastritiyah | ardhamatra caturthah | nadah
    pancamah | binduh shashthah | kala saptamah | shaktirashtami | shantirnavami | samana dashami | atmanaikadasha
    | manonmana dvadasha | vaikhari trayodasha | madhyama caturdasha | pashyanti pancadasha | para shodasha
    | iti shodashamatratmakah pranavah | shodashamatra jagratsvapnasushuptituriyavasthabhedairekaikamatracaturvidhyametya
    | shodashamatrashcatushshashtibhedametya | punashcatushshashtimatrah prakritipurushadvaividhyamapadyashta
  devanagari: तुरीयोपनिषत् कलातीतश्चेति । तन्न चत्वारः । अकारश्चायुतावयवान्वितः । उकारः शतावयवान्वितः
    । मकारः सहस्रावयवान्वितः । अर्धमात्रप्रणवोऽनन्तावयवान्वितः । सगुणो विराट्प्रणवः । संहारो निर्गुणप्रणवः
    । उभयात्मक उत्पत्तिप्रणवः । यथार्थकथनोमित्युच्चार्याभिमानोत्पत्तिप्रणवः । सर्वोपसंहारेण संहारप्रणवः
    । उभयात्मकत्वात् विराट्प्रणवः । उत्पत्तिप्रणवो दीर्घप्लुतविराट् । प्लुतप्लुत्युपसंहारः । विराट्प्रणवः
    षोडशमात्रान्वितः । षट्त्रिंशत्तत्त्वायुतः । षोडशमात्रात्मकं कथमित्युच्यते । अकारः प्रथमः । द्वितीय
    उकारः । मकारस्तृतीयः । अर्धमात्रा चतुर्थः । नादः पञ्चमः । बिन्दुः षष्ठः । कला सप्तमः । शक्तिरष्टमी
    । शान्तिर्नवमी । समाना दशमी । आत्मनैकादश । मनोन्मना द्वादश । वैखरी त्रयोदश । मध्यमा चतुर्दश । पश्यन्ती
    पञ्चदश । परा षोडश । इति षोडशमात्रात्मकः प्रणवः । षोडशमात्रा जाग्रत्स्वप्नसुषुप्तितुरीयावस्थाभेदैरेकैकमात्राचातुर्विध्यमेत्य
    । षोडशमात्राश्चतुष्षष्टिभेदमेत्य । पुनश्चतुष्षष्टिमात्राः प्रकृतिपुरुषद्वैविध्यमापाद्याष्टा
