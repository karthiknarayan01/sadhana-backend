id: kyts-jata-1-3-devasya-tva-savitu-prasave-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 1.3 Devasya Tva Savitu Prasave - Krishna Yajurveda Taittiriya Samhita
content:
  english: devasya tva tva devasya devasya tva | savituh prasave prasave savitu ssavituh prasave | mbahubhya
    mashvino rashvino mpushnah pushno bahubhya bahubhyamiti bahu mpushnah pushno hasta rdade dade 'bhrih
    | abhri rasya syabhri rabhri rasi | rnarira syasi narih | mparilikhita masyasi parilikhitam | raksho
    rakshah parilikhita parilikhitamiti pari rakshah parilikhitah parilikhita raksho rakshah parilikhitah
    | parilikhita aratayo 'ratayah parilikhitah parilikhita aratayah | parilikhita iti pari arataya ida
    mida maratayo 'rataya idam | ida maha maha mida mida maham | ahagm rakshaso rakshaso 'ha mahagm rakshasah
    | rakshaso griva griva rakshaso rakshaso grivah | griva apyapi griva griva api | api krintami krinta
    myapyapi krintami | krintami yo yah krintami krintami yah | ndveshti dveshtya sma nasma ndveshti dveshti
    yam | ndvishmo dvishmo vayam ndvishmo dvishma idam | ida masyasye da mida masya | asya griva griva
    asyasya grivah | griva apyapi griva griva api | api krintami krinta myapyapi krintami | krintami dive
    dive krintami krintami dive | tva dive dive tva tva 'ntariksha yantarikshaya tva tva 'ntarikshaya
    | antarikshaya tva tva 'ntariksha yantarikshaya tva | tva prithivyai prithivyai tva tva prithivyai
    prithivyai tva ntva tva shundhatam | shundhatam ~loko loka lokah pitrishadanah pitrishadano loko lokah
    pitrishadanah | pitrishadano yavo yavah pitrishadanah pitrishadano yavah | pitrishadana iti pitri
    'syasi yavo yavo 'si | dyavaya yava yasmat | ddvesho dvesho 'sma dasma dvesho yavaya yavaya dvesho
    dvesho yavaya | || ryavaya yava yaratih | mpitrina marati raratih pitrinam | mpitrinagm sadanam |
    asyu duda sya syut | stabhana stabhana stabhana | a 'ntariksha mantariksha ma 'ntariksham | mprina
    prinantariksha mantariksha mprina prina prithivim | ha dyutano dyutano dri ha drigmha dyutanah | tva
    dyutano dyutana stva tva maruto maruta stva maruto minotu minotu maruto maruto minotu | minotu mitravarunayo
    rminotu minotu mitravarunayoh | rdhruvena dhruvena mitravarunayo mitravarunayoriti mitra dhruvena
    dharmana dharmana dhruvena dhruvena dharmana | ndharmana dharmana brahmavani ntva tva brahmavani brahmavanimiti
    brahma ntva tva kshatravani kshatravanimiti kshatra suprajavanimiti supraja mpari pari rayasposhavani
    rayasposhavanimiti rayasposha paryuhamyuhami pari paryuhami | uhami brahma brahmoha myuhami brahma
    | brahma drigmha drigmha brahma brahma drigmha | ha drigmha kshatram | ndrigmha drigmha posha ha ghritena
    ghritena drigmha drigmha ghritena | ghritena dyavaprithivi dyavaprithivi ghritena ghritena dyavaprithivi
    | dyavaprithivi a dyavaprithivi dyavaprithivi a | dyavaprithivi iti dyava mprinetha ma prinetham |
    prinetha mindrasye ndrasya prinetha mprinetha mindrasya | ssada indrasye ndrasya sadah | asi vishvajanasya
    vishvajana sya syasi vishvajanasya | vishvajanasya chaya chaya vishvajanasya vishvajanasya chaya |
    vishvajanasyeti vishva chaya pari paric chaya chaya pari | pari tva tva pari pari tva | tva girvano
    girvana stva tva girvanah | girvano giro giro girvano girvano girah | gira ima ima giro gira imah
    | ima bhavantu bhava ntvima ima bhavantu | bhavantu vishvato vishvato bhavantu bhavantu vishvatah
    | vishvato vriddhayum vi~shvato vishvato vriddhayu vriddhayu manvanu vriddhayum vriddhayumiti vriddha
    anu vriddhayo vriddhayo 'nvanu vriddhayah | vriddhayo jushta jushta vriddhayo vriddhayo jushtah jushta
    bhavantu bhavantu jushta jushta bhavantu | bhavantu jushtayo jushtayo bhavantu bhavantu jushtayah
    | jushtaya indrasye ndrasya jushtayo jushtaya indrasya | ssyu rindrasye ndrasya syuh | asindrasye
    ndrasya syasindrasya | ndhruva mindrasye ndrasya dhruvam | dhruva masyasi dhruva asyaindra maindra
    masya syaindram | aindra masya syaindra maindra masi | asindraye ndra yasyasi ndraya | indraya tva
    tvendraye ndraya tva | rakshohano valagahano valagahano rakshohano rakshohano valagahanah | rakshohana
    iti rakshah valagahano vaishnavan valagahano valagahano vaishnavan | nkhanami khanami vaishnavan nkhanami
    khana midam | ida maha maha mida mida maham | dvapami vapa myudu yam~ vapami vapami yam | ya masamano
    'samano yam asamano nicakhana nicakha nasamano 'samano nicakhana | nnicakhana nicakhane dam | ida
    mena mena mida mida menam | ena madhara madhara mena mena madharam | nkaromi karo myadhara madhara
    karomi yo yah karomi karomi yah | yo no no yo yo nah | yo 'samano 'samano yo yo 'samanah | asamano
    'ratiyatya ratiya tyasamano 'samano 'ratiyati | aratiyati gayatrena gayatrena ratiyatya ratiyati gayatrena
    | gayatrena chandasa chandasa gayatrena gayatrena chandasa | chandasa 'vabadho 'vabadha shchandasa
    chandasa 'vabadhah | avabadho valago valago 'vabadho 'vabadho valagah | va~lago valagah kim | mbhadra
    matratra bhadram | nau saha saha nau nau saha | asi sapatnaha sapatnaha 'syasi sapatnaha | tthsapatnaha
    sapatnaha samrat | samra dasyasi samrat asi bhratrivyaha bhratrivyaha 'syasi bhratrivyaha | bhratrivyaha
    svara dbhratrivyaha bhratrivyaha svarat | bhratrivyaheti bhratrivya svara dasyasi svara asya bhimatiha
    'bhimatiha 'syasya bhimatiha | abhimatiha vishvara dvishvara dabhimatiha 'bhimatiha vishvarat | abhimatihetyabhimati
    vishva radasyasi vishvara vishvaraditi vishva vi~shvasa masyasi vishvasam | hanta hanta nashtrana
    hanta rakshohano rakshohano hanta hanta rakshohanah | || rakshohano valagahano valagahano rakshohano
    rakshohano valagahanah | rakshohana iti rakshah valagahanah pra pra valagahano valagahanah pra | myukshami
    pra prokshami | ukshami vaishnavan shnava nuksha myukshami vaishnavan | nrakshohano rakshohano vaishnavan
    rakshohano valagahano valagahano rakshohano rakshohano valagahanah | rakshohana iti rakshah valagahano
    'vava valagahano valagahano 'va | ava nayami naya myavava nayami | nayami vaishnavan nnayami nayami
    vaishnavan | yavo yavo vaishnavan 'syasi yavo yavo 'si | dyavaya yava yasmat | ddvesho dvesho 'sma
    dasma dvesho yavaya yavaya dvesho dvesho yavaya | ryavaya yava yaratih | arati rakshohano rakshohano
    'rati rarati rakshohanah | rakshohano valagahano valagahano rakshohano rakshohano valagahanah | rakshohana
    iti rakshah valagahano 'vava valagahano valagahano 'va | ava strinami strina myavava strinami | strinami
    vaishnavan nthstrinami strinami vaishnavan | nrakshohano rakshohano vaishnavan rakshohano valagahano
    valagahano rakshohano rakshohano valagahanah | rakshohana iti rakshah valagahano 'bhyabhi valagahano
    valagahano 'bhi | abhi juhomi juho myabhyabhi juhomi | juhomi vaishnavan shnavan juhomi juhomi vaishnavan
    | nrakshohanau rakshohanau vaishnavan rakshohanau valagahanau valagahanau rakshohanau rakshohanau
    valagahanau rakshohanaviti rakshah valagahana vupopa valagahanu valagahana vupopa | upa dadhami dadha
    myupopa dadhami | dadhami vaishnavi vai shnavi dadhami dadhami vaishnavi | vaishnavi rakshohanau rakshohanau
    vaishnavi vai vaishnavi iti vaishnavi | rakshohanau valagahanau valagahanau rakshohanau rakshohanau
    valagahanau rakshohanaviti rakshah valagahanau pari pari valagahanau valagahanau pari | paryuha myuhami
    pari paryuhami | uhami vaishnavi vai shnavi uha myuhami vaishnavi | vaishnavi rakshohanau rakshohanau
    vaishnavi vai vaishnavi iti vaishnavi | rakshohanau valagahanau valagahanau rakshohanau rakshohanau
    valagahanau rakshohanaviti rakshah valagahanau pari pari valagahanau valagahanau pari | pari strinami
    strinami pari pari strinami | strinami vaishnavi vai shnavi strinami strinami vaishnavi | vaishnavi
    rakshohanau rakshohanau vaishnavi vai vaishnavi iti vaishnavi | rakshohanau valagahanau valagahanau
    rakshohanau rakshohanau valagahanau rakshohanaviti rakshah valagahanau vaishnavi vai shnavi valagahanau
    valagahanau vaishnavi | vaishnavi iti vaishnavi | asi brihadgrava brihadgrava 'syasi brihadgrava |
    brihadgrava brihati mbrihadgrava brihadgrava brihatim | brihadgraveti brihat brihati mindraye ndraya
    brihati mbrihati mindraya | va~ca mindraye ndraya vaca asi pravahanah pravahano 'syasi pravahanah
    | rvahnih pravahanah pravahano vahnih | vahni rasyasi vahni asi havyavahano havyavahano 'syasi havyavahanah
    | shshvatro havyavahano havyavahana havyavahana iti havya asi pracetah praceta asyasi pracetah | praceta
    stutha stuthah pracetah praceta stuthah | 'syasi tutha stutho 'si | asi vishvaveda vishvaveda asyasi
    vishvavedah | vishvaveda ushi gushig vishvaveda vishvaveda ushik | vishvaveda iti vishva ushi gasya
    syushi gushigasi | asi kavih kavi rasyasi kavih | kavi ranghari rangharih kavih kavi rangharih | anghari
    rasyasyanghari rangharirasi | rbambhari rasyasi bambharih | bambhari ravasyu ravasyu rbambhari ravasyuh
    | avasyu rasya syavasyu ravasyurasi | nduvasva nasyasi duvasvan | shundhyu rasyasi shundhyu asi marjaliyo
    marjaliyo 'syasi marjaliyah | marjaliyah samra rjaliyo marjaliyah samrat | samradasyasi samra asi
    krishanuh krishanu rasyasi krishanuh | krishanuh parishadyah parishadyah krishanuh krishanuh parishadyah
    | 'syasi parishadyah parishadyo 'si | asi pavamanah pavamano 'syasi pavamanah | pratakva pavamanah
    pavamanah pratakva nnabhasva nasyasi nabhasvan | nabhasva nasammrishto 'sammrishto nabhasva nnabhasva
    nasammrishtah | asammrishto 'sya syasammrishto 'sammrishto 'si | asi havyasudo havyasudo havyasuda
    ritadhamartadhama havyasudo havyasuda ritadhama | havyasuda iti havya ritadhama 'sya syritadhama rtadhama
    'si | ssuvarjyoti rasyasi suvarjyotih | suvarjyotiriti suvah brahmajyoti rasyasi brahmajyoti rbrahmajyoti
    rasi | brahmajyotiriti brahma asi suvardhama suvardhama 'syasi suvardhama | ssuvardhama suvardhama
    'jah | suvardhameti suvah asye kapa dekapa dasya syekapat | ekapa dahi rahi rekapa dekapa dahih |
    ahi rasya syahi rahi rasi | asi buddhniyo buddhniyo 'syasi buddhniyah | buddhniyo raudrena raudrena
    buddhniyo buddhniyo raudrena | raudre nanikenanikena raudrena raudrenanikena | anikena pahi pahya
    nikenanikena pahi | pahi ma ma pahi pahi ma ma 'gne 'gne ma ma 'gne | agne piprihi piprihyagne 'gne
    piprihi | piprihi ma ma piprihi piprihi ma ma ma ma ma ma ma | siriti higmsih | || tvagm soma soma
    tva soma tanukridbhya stanukridbhyah soma soma tanukridbhyah | tanukridbhyo dvesho bhya stanukridbhya
    stanukridbhyo dvesho tanukridbhya iti tanukrit bhyo 'nyakritebhyo 'nyakritebhyo dvesho bhyo 'nyakritebhyah
    | rvanyakritebhyo 'nyakritebhya uru | anyakritebhya ityanya uru yanta yanto ruru yanta | yanta 'syasi
    yanta yanta 'si | va~rutha masyasi varutham | svaha svaha varutham svaha jushano jushana ssvaha svaha
    jushanah | jushano aptu raptu rjushano jushano aptuh | aptu rajya syajya syaptu raptu rajyasya | ajyasya
    vetu vetvajya syajyasya vetu | vetu svaha svaha vetu vetu svaha svaha svaha 'yam | rvarivo varivo
    'gni ragni varivah krinotu krinotu varivo varivah krinotu | nkrinotu krinotvayam | mmridho mridho
    'ya maya mridhah purah puro mridho mridhah purah | tvetu purah pura etu | tvetu prabhindann || prabhindanniti
    pra nchatru naya mayagm shatrun | n jayatu jayatu shatru hrishano jayatu jayatu jar jayatu vajasatau
    vajasatau jayatu jayatu vajasatau | uru vishno vishno ururu vishno | vishno vi vi vishno vishno vi
    | vishno iti vishno | vi kramasva kramasva vi vi kramasva | kramasvo ruru kramasva krama svoru | uru
    kshayaya kshayayo ruru kshayaya | kshayaya kshayaya nah | nah kridhi kridhi no nah kridhi | nghritayone
    ghritayone ghrita ghritayone piba piba ghritayone ghritayone piba | piba prapra prapra piba piba prapra
    | mprapra prapra yajnapatim | ntira tira yajnapatim yajnapatimiti yajna somo jigati jigati soma dgatuvij
    jigati jigati gatuvit | devana metyeti devana nishkrita mritasya rtasya nishkrita nnishkrita mritasya
    | yo~ni mritasya rtasya yoni yoni masada masadam asada maditya aditya asada masada madityah | ssado
    'ditya aditya asyaditya aditya asya syadityah | ssado 'ditya aditya sidaisha esha sida sidaishah |
    esha vo va esha esha vah | vo deva deva vo vo deva | rdeva deva savitah | tagm rakshaddhvagm rakshaddhva
    ntagm rakshaddhvam | mma ma rakshaddhvagm rakshaddhva ma vo vo ma ma vah | tvagm soma soma tva ndevo
    devo devan | upaga aga upopagah | aga ida mida maga aga idam | ida maha maha mida mida maham | mmanushyo
    manushyo 'ha maha nmanushyo manushyo manushyan | nthsaha saha manushya prajaya saha saha prajaya prajaya
    saha saha prajaya rayas poshena poshena rayo rayas poshena | poshena namo namah poshena poshena namah
    | namo devebhyo devebhyo namo namo devebhyah | devebhyah svadha svadha devebhyo devebhyah svadha |
    svadha pitribhyah pitribhyah svadha svadha pitribhyah | mpitribhyah pitribhya idam | pitribhya iti
    pitri ida maha maha mida mida maham | rvarunasya varunasya ni dvarunasya varunasya pasha jyoti ragne
    'gne jyoti vratapate vratapate 'gne 'gne vra~tapate vratapate tvam | vratapata iti vrata vratapati
    rasyasi vratapati vratapatiriti vrata asi ya ya 'syasi ya | ya mama mama ya ya mama | tanu stvayi
    tvayi tanu stanu stvayi | abhu diya miya mabhu dabhu diyam | iyagm sa seya miyagm sa | sa mayi mayi
    sa sa mayi | mayi ya ya mayi mayi ya | ya tava tava ya ya tava | tava tanu stanu stava tava tanuh
    | rmayi mayi tanu stanu abhu deshaisha 'bhudabhu desha | sa tvayi tvayi sa sa tvayi | ntvayi tvayi
    yathayatham | nau vratapate vratapate nau nau vratapate | vratapate vratino rvratapate vratapate vratinoh
    vratapata iti vrata rvratani vratani vratino vrataniti vratani | || atyanya nanya natyatyanyan | anya
    naga maga manya nanya naga anya nupopanya nanya nupa | upaga maga mupopagam | aga marva garvagaga
    maga marvak | mparaih parai ravidam | mparah paro 'vida mavida paro 'va rairavaraih parah paro 'varaih
    | nta mava rairava raistam | tva jushe jushe tva tva jushe | njushe jushe vaishnavam | ndevayajyayai
    devayajyayai vaishnavam devayajyayai devo devo devayajyayai devayajyayai devah | devayajyaya iti deva
    tva devo deva stva tva savita savita tva savita maddhva maddhva savita savita maddhva maddhva 'naktvanaktu
    maddhva maddhva 'naktu | anaktvoshadha oshadhe 'naktvana ktvoshadhe | oshadhe trayasva traya svaushadha
    oshadhe trayasva | ntrayasva trayasvainam | svadhite svadhita ena mena svadhite ma ma svadhite svadhite
    ma | diva magre nagrena diva agrena ma ma 'grenagrena ma | lekhi rantariksha mantariksham ~lekhi rlekhi
    rantariksham | mmaddhyena maddhye nantariksha mantariksha maddhyena ma ma maddhyena maddhyena ma |
    sih prithivya prithivya hi higmsih prithivya | mprithivya prithivya sam | bhava vanaspate vanaspate
    bhava bhava vanaspate | sho vanaspate vanaspate shataval vi roha roha vi vi roha | sha roha roha sahasraval
    sha vi vi sahasraval vayagm ruhema ruhema vayam ya~gm ruhema ruhema yam | ssvadhiti raya mayagg svadhiti
    stetijana stetijana ssvadhiti stetijanah | tetijanah praninaya praninaya tetijana stetijanah praninaya
    | praninaya mahate mahate praninaya praninaya mahate | mahate saubhagaya saubhagaya mahate mahate
    saubhagaya | saubhaga yacchinno 'cchinna ssaubhagaya saubhaga yacchinnah | acchinno rayo rayo 'cchinno
    'cchinno rayah | rayah suvirah suviro rayo rayah suvirah | tva prithivyai prithivyai tva tva 'ntariksha
    yantarikshaya tva tva 'ntarikshaya | antarikshaya tva tva 'ntariksha yantarikshaya tva | tva dive
    dive tva tva dive dive tva ntva tva shundhatam | shundhatam ~loko loka lokah pitrishadanah pitrishadano
    loko lokah pitrishadanah | pitrishadano yavo yavah pitrishadanah pitrishadano yavah | pitrishadana
    iti pitri 'syasi yavo yavo 'si | dyavaya yava yasmat | ddvesho dvesho 'sma dasma dvesho yavaya yavaya
    dvesho dvesho yavaya | ryavaya yavayaratih | mpitrina marati raratih pitrinam | mpitrinagm sadanam
    | asyagrega agrega asya syagregah | nnetrina magrega agrega netrinam | vanaspati radhyadhi vanaspati
    adhi tva tva 'dhyadhi tva | tva sthasyati sthasyati tva tva sthasyati | sthasyati tasya tasya sthasyati
    sthasyati tasya | ttasya tasya vittat | ddevo devo vitta tva devo devastva tva savita savita tva savita
    maddhva maddhva savita savita maddhva maddhva 'naktvanaktu maddhva maddhva 'naktu | anaktu supippalabhyah
    supippalabhyo 'naktvanaktu supippalabhyah | supippalabhya stva tva supippalabhyah supippalabhya stva
    | supippalabhya iti su tvaushadhibhya oshadhi bhyastva tvaushadhibhyah | oshadhibhya udu doshadhibhya
    oshadhibhya ut | stabhana stabhana stabhana | a 'ntariksha mantariksha ma 'ntariksham | mprina prinantariksha
    mantariksha mprina prina prithivim | prithivi mupare noparena prithivi mprithivi muparena | hopare
    noparena drigmha | te dhamani dhamani te te dhamani | nyushma syushmasi dhamani dhama ushmasi gamaddhye
    gamaddhya ushma syushmasi gamaddhye gamaddhye gavo gavo gamaddhye gamaddhye gavah | gavo yatra yatra
    gavo gavo yatra | yatra bhurishringa bhurishringa yatra yatra bhurishringah | bhurishringa ayaso 'yaso
    bhurishringa bhurishringa ayasah | bhurishringa iti bhuri atra haha tra traha | tadu rugayasyo rugayasya
    ta urugayasya vishno rvishno rurugaya syorugayasya vishnoh urugayasyetyuru ava bhati bhatyavava bhati
    | vishnoh karmani karmani vishno rvishnoh karmani | karmani pashyata pashyata karmani karmani pashyata
    | pashyata yato yatah pashyata pashyata yatah | vratani vratani yato yato vratani paspashe paspashe
    vratani vratani paspashe | paspasha iti paspashe | indrasya yujyo yujya indrasye ndrasya yujyah |
    ssakha sakha yujyo yujya padagm sada sada pada sada pashyanti pashyanti sada sada pashyanti | pashyanti
    surayah surayah pashyanti pashyanti surayah | suraya iti surayah | divive va divi diviva | iva cakshu
    shcakshu rive va cakshuh | ncakshu shcakshuratatam | ntva tva brahmavani brahmavanimiti brahma ntva
    tva kshatravani kshatravanimiti kshatra suprajavanimiti supraja mpari pari rayasposhavani rayasposhavanimiti
    rayasposha ryuha myuhami pari paryuhami | uhami brahma brahmo hamyuhami brahma | brahma drigmha drigmha
    brahma brahma drigmha | ha drigmha kshatram | ndrigmha drigmha posha parivi rasyasi parivih parivi
    rasi | asi pari paryasyasi pari | pari tva tva pari pari tva | mpari pari vyayantam imagm rayo raya
    ima mimagm rayah | raya sposhah posho rayo raya sposhah | mposhah posho yajamanam | mmanushya manushya
    yajamanam manushya antariksha syantarikshasya manushya manushya antarikshasya | antarikshasya tva
    tva 'ntariksha syantarikshasya tva | sana vavava sanau sana vava | ava guhami guha myavava guhami
    | guhamiti guhami | || tvopavi rupavi stva upavi rasya syupavi rupavi rasi | asyupo upo asya syupo
    ndeva nupo upo devan | vishah pra pra visho vishah pra | praguraguh pra praguh | vahni rushija ushijo
    vahni ushijo brihaspate brihaspata ushija ushijo brihaspate | brihaspate dharaya dharaya brihaspate
    brihaspate dharaya | dharaya vasuni vasuni dharaya dharaya vasuni | vasuni havya havya vasuni vasuni
