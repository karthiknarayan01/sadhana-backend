id: yogashikha
category: upanishad
name:
  english: yogashikha
  devanagari: योगशिख
content:
  english: stasam murdhanamabhinihsritaika | tayordhvamayannamritatvameti vishvannnya utkramane bhavanti
    || 4|| ekottaram nadishatam tasam madhye para smrita | sushumna tu pare lina viraja brahmarupini ||
    5|| ida tishthati vamena pingala dakshinena tu | tayormadhye param sthanam yastadveda sa vedavit ||
    6|| pranansandharayettasminnasabhyantaracarinah | bhutva tatrayatapranah shanaireva samabhyaset ||
    7|| gudasya prishthabhage'sminvinadandah sa dehabhrit | dirghastidehaparyantam brahmanaditi kathyate
    || 8|| tasyante sushiram sukshmam brahmanaditi surabhih | idapingalayormadhye sushumna suryarupini
    || 9|| sarvam pratishthitam tasminsarvagam vishvatomukham | tasya madhyagatah suryasomagniparameshvarah
    || 10|| bhutaloka dishah kshetrah samudrah parvatah shilah | dvipashca nimnaga vedah shastravidyakalaksharah
    || 11|| svaramantrapuranani gunashcaite ca sarvashah | bijam bijatmakastesham kshetrajnah pranavayavah
    || 12|| sushumnantargatam vishvam tasminsarvam pratishthitam | nananadiprasavagam sarvabhutantaratmani
    || 13|| urdhvamulamadhahshakham vayumargena sarvagam | dvisaptatisahasrani nadyah syurvayugocarah
    || 14|| sarvamargena sushirastiryancah sushiratmatah | adhashcordhvam ca kundalyah sarvadvaranirodhanat
    || 15|| vayuna saha jivordhvajnananmokshamavapnuyat | jnatva sushumnam tadbhedam kritva payum ca madhyagam
    || 16|| kritva tu caindavasthane ghranarandhre nirodhayet | dvisaptatisahasrani nadidvarani panjare
    || 17|| sushumna shambhavi shaktih sheshastvanye nirarthakah | hrillekhe paramanande talumule vyavasthite
    || 18|| ata urdhvam nirodhe tu madhyamam madhyamadhyamam | uccarayetparam shaktim brahmarandhranivasinim
    | yadi bhramarasrishtih syatsamsarabhramanam tyajet || 19|| gamagamastham gamanadishunyam cidrupadipam
    timirandhanasham | pashyami tam sarvajanantarastham namami hamsam paramatmarupam || 20|| anahatasya
    shabdasya tasya shabdasya yo dhvanih | dhvanerantargatam jyotirjyotisho'ntargatam manah | tanmano
    vilayam yati tadvishnoh paramam padam || 21|| kecidvadanti cadharam sushumna ca sarasvati | adharajjayate
    vishvam vishvam tatraiva liyate || 22|| tasmatsarvaprayatnena gurupadam samashrayet | adharashaktinidrayam
    vishvam bhavati nidraya || 23|| tasyam shaktiprabodhena trailokyam pratibudhyate | adharam yo vijanati
    tamasah paramashnute || 24|| tasya vijnanamatrena narah papaih pramucyate || 25|| adharacakramahasa
    vidyutpunjasamaprabha | tada muktirna sandeho yadi tushtah svayam guruh || 26|| adharacakramahasa
    punyapape nikrintayet | adharavatarodhena liyate gaganantare || 27|| adharavatarodhena shariram kampate
    yada | adharavatarodhena yogi nrityati sarvada || 28|| adharavatarodhena vishvam tatraiva drishyate
    | srishtimadharamadharamadhare sarvadevatah | adhare sarvavedashca tasmadadharamashrayet || 29|| adhare
    pashcime bhage trivenisangamo bhavet | tatra snatva ca pitva ca narah papatpramucyate || 30|| ahare
    pashcimam lingam kavatam tatra vidyate | tasyodghatanamatrena mucyate bhavabandhanat || 31|| adharapashcime
    bhage candrasuryau sthirau yadi | tatra tishthati vishvesho dhyatva brahmamayo bhavet || 32|| adharapashcime
    bhage murtistishthati samjnaya | shat cakrani ca nirbhidya brahmarandhradbahirgatam || 33|| vamadakshe
    nirundhanti pravishanti sushumnaya | brahmarandhram pravishyantaste yanti paramam gatim || 34|| sushumnayam
    yada hamsastvadha urdhvam pradhavati | sushumnayam yada pranam bhramayedyo nirantaram || 35|| sushumnayam
    yada pranah sthiro bhavati dhimatam | sushumnayam praveshena candrasuryau layam gatau || 36|| tada
    samarasam bhavam yo janati sa yogavit | sushumnayam yada yasya mriyate manaso rayah || 37|| sushumnayam
    yada yogi kshanaikamapi tishtati | sushumnayam yada yogi kshanardhamapi tishthati || 38|| sushumnayam
    yada yogi sulagno lavanambuvat | sushumnayam yada yogi liyate kshiraniravat || 39|| bhidyate ca tada
    granthishcidyante sarvasamshayah | kshiyante paramakashe te yanti paramam gatim || 40|| gangayam sagare
    snatva natva ca manikarnikam | madhyanadivicarasya kalam narhanti shodashim || 41|| shrishailadarshananmuktirvaranasyam
    mritasya ca | kedarodakapanena madhyanadipradarshanat || 42|| ashvamedhasahasrani vajapeyashatani
    ca | sushumnadhyanayogasya kalam narhanti shodashim || 43|| sushumnayam sada goshthim yah kashcitkurute
    narah | sa muktah sarvapapebhyo nishreyasamavapnuyat || 44|| sushumnaiva param tirtham sushumnaiva
    param japah | sushumnaiva param dhyanam sushumnaiva para gatih || 45|| anekayajnadanani vratani niyamastatha
    | sushumnadhyanaleshasya kalam narhanti shodashim || 46|| brahmarandhre mahasthane vartate satatam
    shiva | cicchaktih paramadevi madhyame supratishthita || 47|| mayashaktirlalatagrabhage vyomambuje
    tatha | nadarupa parashaktirlalatasya tu madhyame || 48|| bhage bindumayi shaktirlalatasyaparamshake
    | bindumadhye ca jivatma sukshmarupena vartate || 49|| hridaye sthularupena madhyamena tu madhyage
    || 50|| pranapanavasho jivo hyadhashcordhvam ca dhavati | vamadakshinamargena cancalatvanna drishyate
    || 51|| akshipto bhujadandena yathoccalati kandukah | pranapanasamakshiptastatha jivo na vishramet
    || 52|| apanah karshati pranam prano'panam ca karshati | hakarena bahiryati sakarena vishetpunah ||
    53|| hamsahamsetyamum mantram jivo japati sarvada | tadvidvanaksharam nityam yo janati sa yogavit
    || 54|| kandordhve kundalishaktirmuktirupa hi yoginam | bandhanaya ca mudhanam yastam vetti sa yogavit
    || 55|| bhurbhuvahsvarime lokashcandrasurya'gnidevatah | yasu matrasu tishthanti tatparam jyotiromiti
    || 56|| trayah kalastrayo devastrayo lokastrayah svarah | trayo vedah sthita yatra tatparam jyotiromiti
    || 57|| citte calati samsaro nishcalam moksha ucyate | tasmaccittam sthirikuryatprajnaya paraya vidhe
    || 58|| cittam karanamarthanam tasminsati jagattrayam | tasminkshine jagatkshinam taccikitsyam prayatnatah
    || 59|| manoham gaganakaram manoham sarvatomukham | manoham sarvamatma ca na manah kevalah parah ||
    60|| manah karmani jayante mano lipyati patakaih | manashcedunmanibhuyanna punyam na ca patakam ||
    61|| manasa mana alokya vrittishunyam yada bhavet | tatah param parabrahma drishyate ca sudurlabham
    || 62|| manasa mana alokya mukto bhavati yogavit | manasa mana alokya unmanyantam sada smaret || 63||
    manasa mana alokya yoganishthah sada bhavet | manasa mana alokya drishyante pratyaya dasha || 64||
    yada pratyaya drishyante tada yogishvaro bhavet || 65|| bindunadakalajyotiravindudhruvatarakam | shantam
    ca tadatitam ca parambrahma taducyate || 66|| hasatyullasati pritya kridate modate tada | tanoti jivanam
    buddhya bibheti sarvatobhayat || 67|| rodhyate budhyate shoke muhyate na ca sampada | kampate shatrukaryeshu
    kamena ramate hasan || 68|| smritva kamaratam cittam vijaniyatkalevare | yatra deshe vasedvayushcittam
    tadvasati dhruvam || 69|| manashcandro ravirvayurdrishtiragnirudahritah | bindunadakala brahman vishnubrahmeshadevatah
    || 70|| sada nadanusandhanatsamkshina vasana bhavet | niranjane viliyeta marunmanasi padmaja || 71||
    yo vai nadah sa vai bindustadvai cittam prakirtitam | nado bindushca cittam ca tribhiraikyam prasadayet
    || 72|| mana eva hi bindushca utpattisthitikaranam | manasotpadyate binduryatha kshiram ghritatmakam
    || 73|| shat cakrani parijnatva pravishetsukhamandalam | pravishedvayumakrishya tathaivordhvam niyojayet
    || 74|| vayum bindum tatha cakram cittam caiva samabhyaset | samadhimekena samamamritam yanti yoginah
    || 75|| yathagnirdarumadhyastho nottishthenmathanam vina | vina cabhyasayogena jnanadipastatha nahi
    || 76|| ghatamadhye yatha dipo bahye naiva prakashate | bhinne tasmin ghate caiva dipajvala ca bhasate
    || 77|| svakayam ghatamityuktam yatha jivo hi tatpadam | guruvakyasamabhinne brahmajnanam prakashate
    || 78|| karnadharam gurum prapya tadvakyam plavavadridham | abhyasavasanashaktya taranti bhavasagaram
    || 79|| ityupanishat | iti yogashikhopanishadi shashtho'dhyayah || 6|| om saha navavatu saha nau bhunaktu
    saha viryam karavavahai | tejasvinavadhitamastu ma vidvishavahai || om shantih shantih shantih ||
    om tatsat || iti yogashikhopanishatsamapta ||
  devanagari: स्तासां मूर्धानमभिनिःसृतैका । तयोर्ध्वमायन्नमृतत्वमेति विश्वङ्ङ्न्या उत्क्रमणे भवन्ति ॥
    ४॥ एकोत्तरं नाडिशतं तासां मध्ये परा स्मृता । सुषुम्ना तु परे लीना विरजा ब्रह्मरूपिणी ॥ ५॥ इडा तिष्ठति
    वामेन पिङ्गला दक्षिणेन तु । तयोर्मध्ये परं स्थानं यस्तद्वेद स वेदवित् ॥ ६॥ प्राणान्सन्धारयेत्तस्मिन्नासाभ्यान्तरचारिणः
    । भूत्वा तत्रायतप्राणः शनैरेव समभ्यसेत् ॥ ७॥ गुदस्य पृष्ठभागेऽस्मिन्वीणादण्डः स देहभृत् । दीर्घास्तिदेहपर्यन्तं
    ब्रह्मनाडीति कथ्यते ॥ ८॥ तस्यान्ते सुषिरं सूक्ष्मं ब्रह्मनाडीति सूरभिः । इडापिङ्गलयोर्मध्ये सुषुम्ना
    सूर्यरूपिणी ॥ ९॥ सर्वं प्रतिष्ठितं तस्मिन्सर्वगं विश्वतोमुखम् । तस्य मध्यगताः सूर्यसोमाग्निपरमेश्वराः
    ॥ १०॥ भूतलोका दिशः क्षेत्राः समुद्राः पर्वताः शिलाः । द्वीपाश्च निम्नगा वेदाः शास्त्रविद्याकलाक्षराः
    ॥ ११॥ स्वरमन्त्रपुराणानि गुणाश्चैते च सर्वशः । बीजं बीजात्मकस्तेषां क्षेत्रज्ञः प्राणवायवः ॥ १२॥ सुषुम्नान्तर्गतं
    विश्वं तस्मिन्सर्वं प्रतिष्ठितम् । नानानाडीप्रसवगं सर्वभूतान्तरात्मनि ॥ १३॥ ऊर्ध्वमूलमधःशाखं वायुमार्गेण
    सर्वगम् । द्विसप्ततिसहस्राणि नाड्यः स्युर्वायुगोचराः ॥ १४॥ सर्वमार्गेण सुषिरास्तिर्यञ्चः सुषिरात्मताः
    । अधश्चोर्ध्वं च कुण्डल्याः सर्वद्वारनिरोधनात् ॥ १५॥ वायुना सह जीवोर्ध्वज्ञानान्मोक्षमवाप्नुयात् ।
    ज्ञात्वा सुषुम्नां तद्भेदं कृत्वा पायुं च मध्यगम् ॥ १६॥ कृत्वा तु चैन्दवस्थाने घ्राणरन्ध्रे निरोधयेत्
    । द्विसप्ततिसहस्राणि नाडीद्वाराणि पञ्जरे ॥ १७॥ सुषुम्ना शाम्भवी शक्तिः शेषास्त्वन्ये निरर्थकाः । हृल्लेखे
    परमानन्दे तालुमूले व्यवस्थिते ॥ १८॥ अत ऊर्ध्वं निरोधे तु मध्यमं मध्यमध्यमम् । उच्चारयेत्परां शक्तिं
    ब्रह्मरन्ध्रनिवासिनीम् । यदि भ्रमरसृष्टिः स्यात्संसारभ्रमणं त्यजेत् ॥ १९॥ गमागमस्थं गमनादिशून्यं चिद्रूपदीपं
    तिमिरान्धनाशम् । पश्यामि तं सर्वजनान्तरस्थं नमामि हंसं परमात्मरूपम् ॥ २०॥ अनाहतस्य शब्दस्य तस्य शब्दस्य
    यो ध्वनिः । ध्वनेरन्तर्गतं ज्योतिर्ज्योतिषोऽन्तर्गतं मनः । तन्मनो विलयं याति तद्विष्णोः परमं पदम्
    ॥ २१॥ केचिद्वदन्ति चाधारं सुषुम्ना च सरस्वती । आधाराज्जायते विश्वं विश्वं तत्रैव लीयते ॥ २२॥ तस्मात्सर्वप्रयत्नेन
    गुरुपादं समाश्रयेत् । आधारशक्तिनिद्रायां विश्वं भवति निद्रया ॥ २३॥ तस्यां शक्तिप्रबोधेन त्रैलोक्यं
    प्रतिबुध्यते । आधारं यो विजानाति तमसः परमश्नुते ॥ २४॥ तस्य विज्ञानमात्रेण नरः पापैः प्रमुच्यते ॥ २५॥
    आधारचक्रमहसा विद्युत्पुञ्जसमप्रभा । तदा मुक्तिर्न सन्देहो यदि तुष्टः स्वयं गुरुः ॥ २६॥ आधारचक्रमहसा
    पुण्यपापे निकृन्तयेत् । आधारवातरोधेन लीयते गगनान्तरे ॥ २७॥ आधारवातरोधेन शरीरं कंपते यदा । आधारवातरोधेन
    योगी नृत्यति सर्वदा ॥ २८॥ आधारवातरोधेन विश्वं तत्रैव दृश्यते । सृष्टिमाधारमाधारमाधारे सर्वदेवताः ।
    आधारे सर्ववेदाश्च तस्मादाधारमाश्रयेत् ॥ २९॥ आधारे पश्चिमे भागे त्रिवेणीसङ्गमो भवेत् । तत्र स्नात्वा
    च पीत्वा च नरः पापात्प्रमुच्यते ॥ ३०॥ आहारे पश्चिमं लिङ्गं कवाटं तत्र विद्यते । तस्योद्घाटनमात्रेण
    मुच्यते भवबन्धनात् ॥ ३१॥ आधारपश्चिमे भागे चन्द्रसूर्यौ स्थिरौ यदि । तत्र तिष्ठति विश्वेशो ध्यात्वा
    ब्रह्ममयो भवेत् ॥ ३२॥ आधारपश्चिमे भागे मूर्तिस्तिष्ठति संज्ञया । षट् चक्राणि च निर्भिद्य ब्रह्मरन्ध्राद्बहिर्गतम्
    ॥ ३३॥ वामदक्षे निरुन्धन्ति प्रविशन्ति सुषुम्नया । ब्रह्मरन्ध्रं प्रविश्यान्तस्ते यान्ति परमां गतिम्
    ॥ ३४॥ सुषुम्नायां यदा हंसस्त्वध ऊर्ध्वं प्रधावति । सुषुम्नायां यदा प्राणं भ्रामयेद्यो निरन्तरम् ॥
    ३५॥ सुषुम्नायां यदा प्राणः स्थिरो भवति धीमताम् । सुषुम्नायां प्रवेशेन चन्द्रसूर्यौ लयं गतौ ॥ ३६॥ तदा
    समरसं भावं यो जानाति स योगवित् । सुषुम्नायां यदा यस्य म्रियते मनसो रयः ॥ ३७॥ सुषुम्नायां यदा योगी
    क्षणैकमपि तिष्टति । सुषुम्नायां यदा योगी क्षणार्धमपि तिष्ठति ॥ ३८॥ सुषुम्नायां यदा योगी सुलग्नो लवणाम्बुवत्
    । सुषुम्नायां यदा योगी लीयते क्षीरनीरवत् ॥ ३९॥ भिद्यते च तदा ग्रन्थिश्चिद्यन्ते सर्वसंशयाः । क्षीयन्ते
    परमाकाशे ते यान्ति परमां गतिम् ॥ ४०॥ गङ्गायां सागरे स्नात्वा नत्वा च मणिकर्णिकाम् । मध्यनाडीविचारस्य
    कलां नार्हन्ति षोडशीम् ॥ ४१॥ श्रीशैलदर्शनान्मुक्तिर्वाराणस्यां मृतस्य च । केदारोदकपानेन मध्यनाडीप्रदर्शनात्
    ॥ ४२॥ अश्वमेधसहस्राणि वाजपेयशतानि च । सुषुम्नाध्यानयोगस्य कलां नार्हन्ति षोडशीम् ॥ ४३॥ सुषुम्नायां
    सदा गोष्ठीं यः कश्चित्कुरुते नरः । स मुक्तः सर्वपापेभ्यो निश्रेयसमवाप्नुयात् ॥ ४४॥ सुषुम्नैव परं तीर्थं
    सुषुम्नैव परं जपः । सुषुम्नैव परं ध्यानं सुषुम्नैव परा गतिः ॥ ४५॥ अनेकयज्ञदानानि व्रतानि नियमास्तथा
    । सुषुम्नाध्यानलेशस्य कलां नार्हन्ति षोडशीम् ॥ ४६॥ ब्रह्मरन्ध्रे महास्थाने वर्तते सततं शिवा । चिच्छक्तिः
    परमादेवी मध्यमे सुप्रतिष्ठिता ॥ ४७॥ मायाशक्तिर्ललाटाग्रभागे व्योमाम्बुजे तथा । नादरूपा पराशक्तिर्ललाटस्य
    तु मध्यमे ॥ ४८॥ भागे बिन्दुमयी शक्तिर्ललाटस्यापरांशके । बिन्दुमध्ये च जीवात्मा सूक्ष्मरूपेण वर्तते
    ॥ ४९॥ हृदये स्थूलरूपेण मध्यमेन तु मध्यगे ॥ ५०॥ प्राणापानवशो जीवो ह्यधश्चोर्ध्वं च धावति । वामदक्षिणमार्गेण
    चञ्चलत्वान्न दृश्यते ॥ ५१॥ आक्षिप्तो भुजदण्डेन यथोच्चलति कन्दुकः । प्राणापानसमाक्षिप्तस्तथा जीवो न
    विश्रमेत् ॥ ५२॥ अपानः कर्षति प्राणं प्राणोऽपानं च कर्षति । हकारेण बहिर्याति सकारेण विशेत्पुनः ॥ ५३॥
    हंसहंसेत्यमुं मन्त्रं जीवो जपति सर्वदा । तद्विद्वानक्षरं नित्यं यो जानाति स योगवित् ॥ ५४॥ कन्दोर्ध्वे
    कुण्डलीशक्तिर्मुक्तिरूपा हि योगिनाम् । बन्धनाय च मूढानां यस्तां वेत्ति स योगवित् ॥ ५५॥ भूर्भुवःस्वरिमे
    लोकाश्चन्द्रसूर्याऽग्निदेवताः । यासु मात्रासु तिष्ठन्ति तत्परं ज्योतिरोमिति ॥ ५६॥ त्रयः कालास्त्रयो
    देवास्त्रयो लोकास्त्रयः स्वराः । त्रयो वेदाः स्थिता यत्र तत्परं ज्योतिरोमिति ॥ ५७॥ चित्ते चलति संसारो
    निश्चलं मोक्ष उच्यते । तस्माच्चित्तं स्थिरीकुर्यात्प्रज्ञया परया विधे ॥ ५८॥ चित्तं कारणमर्थानां तस्मिन्सति
    जगत्त्रयम् । तस्मिन्क्षीणे जगत्क्षीणं तच्चिकित्स्यं प्रयत्नतः ॥ ५९॥ मनोहं गगनाकारं मनोहं सर्वतोमुखम्
    । मनोहं सर्वमात्मा च न मनः केवलः परः ॥ ६०॥ मनः कर्माणि जायन्ते मनो लिप्यति पातकैः । मनश्चेदुन्मनीभूयान्न
    पुण्यं न च पातकम् ॥ ६१॥ मनसा मन आलोक्य वृत्तिशून्यं यदा भवेत् । ततः परं परब्रह्म दृश्यते च सुदुर्लभम्
    ॥ ६२॥ मनसा मन आलोक्य मुक्तो भवति योगवित् । मनसा मन आलोक्य उन्मन्यन्तं सदा स्मरेत् ॥ ६३॥ मनसा मन आलोक्य
    योगनिष्ठः सदा भवेत् । मनसा मन आलोक्य दृश्यन्ते प्रत्यया दश ॥ ६४॥ यदा प्रत्यया दृश्यन्ते तदा योगीश्वरो
    भवेत् ॥ ६५॥ बिन्दुनादकलाज्योतीरवीन्दुध्रुवतारकम् । शान्तं च तदतीतं च परंब्रह्म तदुच्यते ॥ ६६॥ हसत्युल्लसति
    प्रीत्या क्रीडते मोदते तदा । तनोति जीवनं बुद्ध्या बिभेति सर्वतोभयात् ॥ ६७॥ रोध्यते बुध्यते शोके मुह्यते
    न च सम्पदा । कंपते शत्रुकार्येषु कामेन रमते हसन् ॥ ६८॥ स्मृत्वा कामरतं चित्तं विजानीयात्कलेवरे । यत्र
    देशे वसेद्वायुश्चित्तं तद्वसति ध्रुवम् ॥ ६९॥ मनश्चन्द्रो रविर्वायुर्दृष्टिरग्निरुदाहृतः । बिन्दुनादकला
    ब्रह्मन् विष्णुब्रह्मेशदेवताः ॥ ७०॥ सदा नादानुसन्धानात्संक्षीणा वासना भवेत् । निरञ्जने विलीयेत मरुन्मनसि
    पद्मज ॥ ७१॥ यो वै नादः स वै बिन्दुस्तद्वै चित्तं प्रकीर्तितम् । नादो बिन्दुश्च चित्तं च त्रिभिरैक्यं
    प्रसादयेत् ॥ ७२॥ मन एव हि बिन्दुश्च उत्पत्तिस्थितिकारणम् । मनसोत्पद्यते बिन्दुर्यथा क्षीरं घृतात्मकम्
    ॥ ७३॥ षट् चक्राणि परिज्ञात्वा प्रविशेत्सुखमण्डलम् । प्रविशेद्वायुमाकृष्य तथैवोर्ध्वं नियोजयेत् ॥ ७४॥
    वायुं बिन्दुं तथा चक्रं चित्तं चैव समभ्यसेत् । समाधिमेकेन समममृतं यान्ति योगिनः ॥ ७५॥ यथाग्निर्दारुमध्यस्थो
    नोत्तिष्ठेन्मथनं विना । विना चाभ्यासयोगेन ज्ञानदीपस्तथा नहि ॥ ७६॥ घटमध्ये यथा दीपो बाह्ये नैव प्रकाशते
    । भिन्ने तस्मिन् घटे चैव दीपज्वाला च भासते ॥ ७७॥ स्वकायं घटमित्युक्तं यथा जीवो हि तत्पदम् । गुरुवाक्यसमाभिन्ने
    ब्रह्मज्ञानं प्रकाशते ॥ ७८॥ कर्णधारं गुरुं प्राप्य तद्वाक्यं प्लववदृढम् । अभ्यासवासनाशक्त्या तरन्ति
    भवसागरम् ॥ ७९॥ इत्युपनिषत् । इति योगशिखोपनिषदि षष्ठोऽध्यायः ॥ ६॥ ॐ सह नाववतु सह नौ भुनक्तु सह वीर्यं
    करवावहै । तेजस्विनवधीतमस्तु मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ तत्सत् ॥ इति योगशिखोपनिषत्समाप्ता
    ॥
