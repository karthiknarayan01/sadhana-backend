id: cintakhandanastotram
category: stotram
name:
  english: cintakhandanastotram
  devanagari: चिन्ताखण्डनस्तोत्रम्
content:
  english: iti shrutih | narte tvatkriyate kincidityahanyacyutam prabhum || 8|| parthanparthasatimartam
    haram bhasmasurarditam | virocanasya pitaram kah kashtatpragvyamocayat || 9|| shatravo yanti mitratvam
    mite'mitre satam harau | mitranyeva ca shatrutvam shatrau shatrau suradvisham || 10|| piturvadhe putra
    eva karanam pragabhuditi | kim na shrutam sarpavairi sarpasyaivabhayankarah || 11|| duhkhasprishto
    haristveko duhkhasprishtastato'pare | ato na bhito duhkhebhyo bhavanubhavadhiradhih || 12|| sukhasyanantaram
    duhkham duhkhasyanantaram sukham | iti yanniyamastasmanniyame niyamam kuru || 13|| ato durantaya svantacintaya
    kim cidantaya | hayananam dayasindhum smara smaradabhishtadam || 14|| acaturdashamadvarshadya cinta
    hridi dehinam | vadirajo yatistasyah khandanayedamabhyadhat || 15|| iti shrimadvadirajapujyacaranaviracitam
    cintakhandanastotram sampurnam | bharatiramanamukhyapranantargata shrikrishnarpanamastu |
  devanagari: इति श्रुतिः । नर्ते त्वत्क्रियते किञ्चिदित्याहान्याच्युतं प्रभुम् ॥ ८॥ पार्थान्पार्थसतीमार्तां
    हरं भस्मासुरार्दितम् । विरोचनस्य पितरं कः कष्टात्प्राग्व्यमोचयत् ॥ ९॥ शत्रवो यान्ति मित्रत्वं मितेऽमित्रे
    सतां हरौ । मित्राण्येव च शत्रुत्वं शत्रौ शत्रौ सुरद्विषाम् ॥ १०॥ पितुर्वधे पुत्र एव कारणं प्रागभूदिति
    । किं न श्रुतं सर्पवैरी सर्पस्यैवाभयङ्करः ॥ ११॥ दुःखास्पृष्टो हरिस्त्वेको दुःखस्पृष्टास्ततोऽपरे ।
    अतो न भीतो दुःखेभ्यो भवानुभवधीरधीः ॥ १२॥ सुखस्यानन्तरं दुःखं दुःखस्यानन्तरं सुखम् । इति यन्नियमस्तस्मान्नियमे
    नियमं कुरु ॥ १३॥ अतो दुरन्तया स्वान्तचिन्तया किं चिदन्तया । हयाननं दयासिन्धुं स्मर स्मरदभीष्टदम् ॥
    १४॥ आचतुर्दशमाद्वर्षाद्या चिन्ता हृदि देहिनाम् । वादिराजो यतिस्तस्याः खण्डनायेदमभ्यधात् ॥ १५॥ इति
    श्रीमद्वादिराजपूज्यचरणविरचितं चिन्ताखण्डनस्तोत्रं सम्पूर्णम् । भारतीरमणमुख्यप्राणान्तर्गत श्रीकृष्णार्पणमस्तु
    ।
