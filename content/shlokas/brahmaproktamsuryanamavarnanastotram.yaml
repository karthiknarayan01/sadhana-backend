id: brahmaproktamsuryanamavarnanastotram
category: stotram
name:
  english: brahmaproktamsuryanamavarnanastotram
  devanagari: ब्रह्मप्रोक्तंसूर्यनामवर्णनस्तोत्रम्
content:
  english: brahmaproktam suryanamavarnanastotram brahmovaca | namabhih samstuto devo yairarkah paritushyati
    | tani te kirtayamyesha yathavadanupurvashah || 1|| namah suryaya nityaya ravaye karyabhanave | bhaskaraya
    matangaya martandaya vivasvate || 2|| adityayadidevaya namaste rashmimaline | divakaraya diptaya agnaye
    mihiraya ca || 3|| prabhakaraya mitraya namaste'ditisambhava | namo gopataye nityam disham ca pataye
    namah || 4|| namo dhatre vidhatre ca aryamne varunaya ca | pushne bhagaya mitraya parjanyayamshave
    namah || 5|| namo hitakrite nityam dharmaya tapanaya ca | haraye haritashvaya vishvasya pataye namah
    || 6|| vishnave brahmane nityam tryambakaya tathatmane | namaste saptalokesha namaste saptasaptaye
    || 7|| ekasmai hi namastubhyamekacakrarathaya ca | jyotisham pataye nityam sarvapranabhrite namah
    || 8|| hitaya sarvabhutanam shivayartiharaya ca | namah padmaprabodhaya namo vedadimurtaye || 9||
    kadhijaya namastubhyam namastarasutaya ca | bhimajaya namastubhyam pavakaya ca vai namah || 10|| dhishanaya
    namo nityam namah krishnaya nityada | namo'stvaditiputraya namo lakshyaya nityashah || 11|| etanyadityanamani
    maya proktani vai pura | aradhanaya devasya sarvakamena suvrata || 12|| sayam pratah shucirbhutva
    yah pathetsusamahitah | sa prapnotyakhilankamanyathaham praptavanpura || 13|| prasadattasya devasya
    bhaskarasya mahatmanah | shrikamah shriyamapnoti dharmarthi dharmamapnuyat || 14|| aturo mucyate rogadbaddho
    mucyeta bandhanat | rajyarthi rajyamapnoti kamarthi kamamapnuyat || 15|| etajjapyam rahasyam ca sandhyopasanameva
    ca | etena japamatrena narah papatpramucyate || 16|| iti shribhavishyepurane brahme parvani ekasaptatitamadhyayantargatam
    brahmaproktasuryanamavarnanam samaptam | bhavishyapurana | brahmaparva | adhyaya 71
  devanagari: ब्रह्मप्रोक्तं सूर्यनामवर्णनस्तोत्रम् ब्रह्मोवाच । नामभिः संस्तुतो देवो यैरर्कः परितुष्यति
    । तानि ते कीर्तयाम्येष यथावदनुपूर्वशः ॥ १॥ नमः सूर्याय नित्याय रवये कार्यभानवे । भास्कराय मतङ्गाय
    मार्तण्डाय विवस्वते ॥ २॥ आदित्यायादिदेवाय नमस्ते रश्मिमालिने । दिवाकराय दीप्ताय अग्नये मिहिराय च ॥
    ३॥ प्रभाकराय मित्राय नमस्तेऽदितिसम्भव । नमो गोपतये नित्यं दिशां च पतये नमः ॥ ४॥ नमो धात्रे विधात्रे
    च अर्यम्णे वरुणाय च । पूष्णे भगाय मित्राय पर्जन्यायांशवे नमः ॥ ५॥ नमो हितकृते नित्यं धर्माय तपनाय
    च । हरये हरिताश्वाय विश्वस्य पतये नमः ॥ ६॥ विष्णवे ब्रह्मणे नित्यं त्र्यम्बकाय तथात्मने । नमस्ते सप्तलोकेश
    नमस्ते सप्तसप्तये ॥ ७॥ एकस्मै हि नमस्तुभ्यमेकचक्ररथाय च । ज्योतिषां पतये नित्यं सर्वप्राणभृते नमः
    ॥ ८॥ हिताय सर्वभूतानां शिवायार्तिहराय च । नमः पद्मप्रबोधाय नमो वेदादिमूर्तये ॥ ९॥ काधिजाय नमस्तुभ्यं
    नमस्तारासुताय च । भीमजाय नमस्तुभ्यं पावकाय च वै नमः ॥ १०॥ धिषणाय नमो नित्यं नमः कृष्णाय नित्यदा ।
    नमोऽस्त्वदितिपुत्राय नमो लक्ष्याय नित्यशः ॥ ११॥ एतान्यादित्यनामानि मया प्रोक्तानि वै पुरा । आराधनाय
    देवस्य सर्वकामेन सुव्रत ॥ १२॥ सायं प्रातः शुचिर्भूत्वा यः पठेत्सुसमाहितः । स प्राप्नोत्यखिलान्कामान्यथाहं
    प्राप्तवान्पुरा ॥ १३॥ प्रसादात्तस्य देवस्य भास्करस्य महात्मनः । श्रीकामः श्रियमाप्नोति धर्मार्थी धर्ममाप्नुयात्
    ॥ १४॥ आतुरो मुच्यते रोगाद्बद्धो मुच्येत बन्धनात् । राज्यार्थी राज्यमाप्नोति कामार्थी काममाप्नुयात्
    ॥ १५॥ एतज्जप्यं रहस्यं च सन्ध्योपासनमेव च । एतेन जपमात्रेण नरः पापात्प्रमुच्यते ॥ १६॥ इति श्रीभविष्येपुराणे
    ब्राह्मे पर्वणि एकसप्ततितमाध्यायान्तर्गतं ब्रह्मप्रोक्तसूर्यनामवर्णनं समाप्तम् । भविष्यपुराण । ब्राह्मपर्व
    । अध्याय ७१
