id: goda-devi-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Goda Devi Ashtottara Sata Nama Stotram
content:
  english: dhyanam | shatamakhamani nila carukalharahasta stanabharanamitangi sandravatsalyasindhuh |
    alakavinihitabhih sragbhirakrishtanatha vilasatu hridi goda vishnucittatmaja nah || atha stotram |
    shriranganayaki goda vishnucittatmaja sati | gopiveshadhara devi bhusuta bhogashalini || || tulasikananodbhuta
    shridhanvipuravasini | bhattanathapriyakari shrikrishnahitabhogini || || amuktamalyada bala ranganathapriya
    para | vishvambhara kalalapa yatirajasahodari || || krishnanurakta subhaga sulabhashrih sulakshana
    | lakshmipriyasakhi shyama dayancitadrigancala || || phalgunyavirbhava ramya dhanurmasakritavrata
    | campakashokapunnagamalativilasatkaca || || akaratrayasampanna narayanapadashrita | shrimadashtaksharimantrarajasthitamanoratha
    || || mokshapradananipuna manuratnadhidevata | brahmanya lokajanani lilamanusharupini || || brahmajnanaprada
    maya saccidanandavigraha | mahapativrata vishnugunakirtanalolupa || || prapannartihara nitya vedasaudhaviharini
    | shriranganathamanikyamanjari manjubhashini || || padmapriya padmahasta vedantadvayabodhini | suprasanna
    bhagavati shrijanardanadipika || || sugandhavayava carurangamangaladipika | dhvajavajrankushabjankamridupadalatancita
    || || tarakakaranakhara pravalamridulanguli | kurmopameyapadordhvabhaga shobhanaparshnika || || vedarthabhavatattvajna
    lokaradhyanghripankaja | anandabudbudakarasugulpha paramanuka || || tejahshriyojjvaladhritapadangulisubhushita
    | minaketanatuniracarujanghavirajita || || kakudvajjanuyugmadhya svarnarambhabhasakthika | vishalajaghana
    pinasushroni manimekhala || || anandasagaravartagambhirambhojanabhika | bhasvadvalitrika carujagatpurnamahodari
    || || navavalliromaraji sudhakumbhayitastani | kalpamalanibhabhuja candrakhandanakhancita || || supravashangulinyastamaharatnanguliyaka
    | navarunapravalabhapanideshasamancita || || kambukanthi sucubuka bimboshthi kundadantayuk | karunyarasanishyandanetradvayasushobhita
    || || muktashucismita carucampeyanibhanasika | darpanakaravipulakapoladvitayancita || || anantarkaprakashodyanmanitatankashobhita
    | kotisuryagnisankashananabhushanabhushita || || sugandhavadana subhru ardhacandralalatika | purnacandranana
    nilakutilalakashobhita || || saundaryasima vilasatkasturitilakojjvala | dhagaddhagayamanodyanmanisimantabhushana
    || || jajvalyamanasadratnadivyacudavatamsaka | suryardhacandravilasat bhushanancitavenika || || atyarkanalatejodhimanikancukadharini
    | sadratnancitavidyotavidyutkunjabhashatika || || nanamaniganakirnahemangadasubhushita | kunkumagarukasturidivyacandanacarcita
    || || svocitaujjvalyavividhavicitramaniharini | asankhyeyasukhasparshasarvatishayabhushana || || mallikaparijatadidivyapushpasragancita
    | shriranganilaya pujya divyadeshasushobhita || || iti shrigodashtottarashatanamastotram |
  devanagari: ध्यानम् । शतमखमणि नीला चारुकल्हारहस्ता स्तनभरनमिताङ्गी सान्द्रवात्सल्यसिन्धुः । अलकविनिहिताभिः
    स्रग्भिराकृष्टनाथा विलसतु हृदि गोदा विष्णुचित्तात्मजा नः ॥ अथ स्तोत्रम् । श्रीरङ्गनायकी गोदा विष्णुचित्तात्मजा
    सती । गोपीवेषधरा देवी भूसुता भोगशालिनी ॥ ॥ तुलसीकाननोद्भूता श्रीधन्विपुरवासिनी । भट्टनाथप्रियकरी श्रीकृष्णहितभोगिनी
    ॥ ॥ आमुक्तमाल्यदा बाला रङ्गनाथप्रिया परा । विश्वम्भरा कलालापा यतिराजसहोदरी ॥ ॥ कृष्णानुरक्ता सुभगा
    सुलभश्रीः सुलक्षणा । लक्ष्मीप्रियसखी श्यामा दयाञ्चितदृगञ्चला ॥ ॥ फल्गुन्याविर्भवा रम्या धनुर्मासकृतव्रता
    । चम्पकाशोकपुन्नागमालतीविलसत्कचा ॥ ॥ आकारत्रयसम्पन्ना नारायणपदाश्रिता । श्रीमदष्टाक्षरीमन्त्रराजस्थितमनोरथा
    ॥ ॥ मोक्षप्रदाननिपुणा मनुरत्नाधिदेवता । ब्रह्मण्या लोकजननी लीलामानुषरूपिणी ॥ ॥ ब्रह्मज्ञानप्रदा माया
    सच्चिदानन्दविग्रहा । महापतिव्रता विष्णुगुणकीर्तनलोलुपा ॥ ॥ प्रपन्नार्तिहरा नित्या वेदसौधविहारिणी ।
    श्रीरङ्गनाथमाणिक्यमञ्जरी मञ्जुभाषिणी ॥ ॥ पद्मप्रिया पद्महस्ता वेदान्तद्वयबोधिनी । सुप्रसन्ना भगवती
    श्रीजनार्दनदीपिका ॥ ॥ सुगन्धावयवा चारुरङ्गमङ्गलदीपिका । ध्वजवज्राङ्कुशाब्जाङ्कमृदुपादलताञ्चिता ॥ ॥
    तारकाकारनखरा प्रवालमृदुलाङ्गुली । कूर्मोपमेयपादोर्ध्वभागा शोभनपार्ष्णिका ॥ ॥ वेदार्थभावतत्त्वज्ञा
    लोकाराध्याङ्घ्रिपङ्कजा । आनन्दबुद्बुदाकारसुगुल्फा परमाणुका ॥ ॥ तेजःश्रियोज्ज्वलधृतपादाङ्गुलिसुभूषिता
    । मीनकेतनतूणीरचारुजङ्घाविराजिता ॥ ॥ ककुद्वज्जानुयुग्माढ्या स्वर्णरम्भाभसक्थिका । विशालजघना पीनसुश्रोणी
    मणिमेखला ॥ ॥ आनन्दसागरावर्तगम्भीराम्भोजनाभिका । भास्वद्वलित्रिका चारुजगत्पूर्णमहोदरी ॥ ॥ नववल्लीरोमराजी
    सुधाकुम्भायितस्तनी । कल्पमालानिभभुजा चन्द्रखण्डनखाञ्चिता ॥ ॥ सुप्रवाशाङ्गुलीन्यस्तमहारत्नाङ्गुलीयका
    । नवारुणप्रवालाभपाणिदेशसमञ्चिता ॥ ॥ कम्बुकण्ठी सुचुबुका बिम्बोष्ठी कुन्ददन्तयुक् । कारुण्यरसनिष्यन्दनेत्रद्वयसुशोभिता
    ॥ ॥ मुक्ताशुचिस्मिता चारुचाम्पेयनिभनासिका । दर्पणाकारविपुलकपोलद्वितयाञ्चिता ॥ ॥ अनन्तार्कप्रकाशोद्यन्मणिताटङ्कशोभिता
    । कोटिसूर्याग्निसङ्काशनानाभूषणभूषिता ॥ ॥ सुगन्धवदना सुभ्रू अर्धचन्द्रललाटिका । पूर्णचन्द्रानना नीलकुटिलालकशोभिता
    ॥ ॥ सौन्दर्यसीमा विलसत्कस्तूरीतिलकोज्ज्वला । धगद्धगायमानोद्यन्मणिसीमन्तभूषणा ॥ ॥ जाज्वल्यमानसद्रत्नदिव्यचूडावतंसका
    । सूर्यार्धचन्द्रविलसत् भूषणाञ्चितवेणिका ॥ ॥ अत्यर्कानलतेजोधिमणिकञ्चुकधारिणी । सद्रत्नाञ्चितविद्योतविद्युत्कुञ्जाभशाटिका
    ॥ ॥ नानामणिगणाकीर्णहेमाङ्गदसुभूषिता । कुङ्कुमागरुकस्तूरीदिव्यचन्दनचर्चिता ॥ ॥ स्वोचितौज्ज्वल्यविविधविचित्रमणिहारिणी
    । असङ्ख्येयसुखस्पर्शसर्वातिशयभूषणा ॥ ॥ मल्लिकापारिजातादिदिव्यपुष्पस्रगञ्चिता । श्रीरङ्गनिलया पूज्या
    दिव्यदेशसुशोभिता ॥ ॥ इति श्रीगोदाष्टोत्तरशतनामस्तोत्रम् ।
