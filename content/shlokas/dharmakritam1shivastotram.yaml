id: dharmakritam1shivastotram
category: stotram
name:
  english: dharmakritam1shivastotram
  devanagari: धर्मकृतं१शिवस्तोत्रम्
content:
  english: dharmakritam 1 shivastotram dharma uvaca | namo namah karanakarananam namo namah karanavarjitaya
    | namo namah karyamayaya tubhyam namo namah karyavibhinnarupa || 32|| aruparupaya samastarupine paranurupaya
    paraparaya | aparaparaya parabdhiparapradaya tubhyam shashimaulaye namah || 33|| anishvarastvam jagadishvarastvam
    gunatmakastvam gunavarjitastvam | kalatparastvam prakriteh parastvam kalaya kalatprakrite namaste
    || 34|| tvameva nirvanapadaprado'si tvameva nirvanamanantashakte | tvamatmarupah paramatmarupastvamantaratmasi
    caracarasya || 35|| tvatto jagattvam jagadeva sakshajjagattvadiyam jagadekabandho | hartavita tvam
    prathamo vidhata vidhatrivishnvisha namo namaste || 36|| mridastvameva shrutivartmageshu tvameva bhimo'shrutivartmageshu
    | tvam shankarah somasubhaktibhajamugro'si rudra tvamabhaktibhajam || 37|| tvameva shuli dvishatam
    tvameva vinamraceto vacasam shivo'si | shrikantha ekah svapadashritanam duratmanam halahalograkanthah
    || 38|| namo'stu te shankara shantashambho namo'stu te candrakalavatamsa | namo'stu tubhyam phanibhushanaya
    pinakapane'ndhakavairine namah || 39|| sa eva dhanyastava bhaktibhagyastavarcako yah sukriti sa eva
    | tava stutim yah kurute sadaiva sa stuyate dushcyavanadi devaih || 2
  devanagari: धर्मकृतं १ शिवस्तोत्रम् धर्म उवाच । नमो नमः कारणकारणानां नमो नमः कारणवर्जिताय । नमो नमः
    कार्यमयाय तुभ्यं नमो नमः कार्यविभिन्नरूप ॥ ३२॥ अरूपरूपाय समस्तरूपिणे पराणुरूपाय परापराय । अपारपाराय
    पराब्धिपारप्रदाय तुभ्यं शशिमौलये नमः ॥ ३३॥ अनीश्वरस्त्वं जगदीश्वरस्त्वं गुणात्मकस्त्वं गुणवर्जितस्त्वम्
    । कालात्परस्त्वं प्रकृतेः परस्त्वं कालाय कालात्प्रकृते नमस्ते ॥ ३४॥ त्वमेव निर्वाणपदप्रदोऽसि त्वमेव
    निर्वाणमनन्तशक्ते । त्वमात्मरूपः परमात्मरूपस्त्वमन्तरात्मासि चराचरस्य ॥ ३५॥ त्वत्तो जगत्त्वं जगदेव
    साक्षाज्जगत्त्वदीयं जगदेकबन्धो । हर्ताविता त्वं प्रथमो विधाता विधातृविष्ण्वीश नमो नमस्ते ॥ ३६॥ मृडस्त्वमेव
    श्रुतिवर्त्मगेषु त्वमेव भीमोऽश्रुतिवर्त्मगेषु । त्वं शङ्करः सोमसुभक्तिभाजामुग्रोऽसि रुद्र त्वमभक्तिभाजाम्
    ॥ ३७॥ त्वमेव शूली द्विषतां त्वमेव विनम्रचेतो वचसां शिवोऽसि । श्रीकण्ठ एकः स्वपदश्रितानां दुरात्मनां
    हालहलोग्रकण्ठः ॥ ३८॥ नमोऽस्तु ते शङ्कर शान्तशम्भो नमोऽस्तु ते चन्द्रकलावतंस । नमोऽस्तु तुभ्यं फणिभूषणाय
    पिनाकपाणेऽन्धकवैरिणे नमः ॥ ३९॥ स एव धन्यस्तव भक्तिभाग्यस्तवार्चको यः सुकृती स एव । तव स्तुतिं यः कुरुते
    सदैव स स्तूयते दुश्च्यवनादि देवैः ॥ २
