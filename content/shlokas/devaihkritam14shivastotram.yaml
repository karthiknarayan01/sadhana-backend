id: devaihkritam14shivastotram
category: stotram
name:
  english: devaihkritam14shivastotram
  devanagari: देवैःकृतं१४शिवस्तोत्रम्
content:
  english: devaih kritam 14 shivastotram deva ucuh | devadeva mahadeva sharanagatavatsala | pahi nah sharanapannansarvandevanjaganti
    ca || 32|| namaste'stu namaste'stu namaste'stu sadashiva | purvam duhkham yada jatam tada te rakshita
    vayam || 33|| samudro mathitashcaiva ratnanam ca vibhagashah | krite devaistada shambho grihitam garalam
    tvaya || 34|| rakshitah sma tada natha nilakantha iti shrutah | visham pasyasi no cettvam bhasmibhutastadakhilah
    || 35|| prasiddham ca yada yasya duhkham ca jayate prabho | tada tvannamamatrena sarvaduhkham viliyate
    || 36|| idanim nriharijvalapiditannassadashiva | tam tvam shamayitum deva shakto'siti sunishcitam
    || 37|| iti shivapurane shatarudrasamhitayam dashamadhyayantargatam devaih kritam shivastotram samaptam
    | shivapurana | shatarudrasamhita | adhyaya 10
  devanagari: देवैः कृतं १४ शिवस्तोत्रम् देवा ऊचुः । देवदेव महादेव शरणागतवत्सल । पाहि नः शरणापन्नान्सर्वान्देवाञ्जगन्ति
    च ॥ ३२॥ नमस्तेऽस्तु नमस्तेऽस्तु नमस्तेऽस्तु सदाशिव । पूर्वं दुःखं यदा जातं तदा ते रक्षिता वयम् ॥ ३३॥
    समुद्रो मथितश्चैव रत्नानां च विभागशः । कृते देवैस्तदा शम्भो गृहीतं गरलं त्वया ॥ ३४॥ रक्षिताः स्म तदा
    नाथ नीलकण्ठ इति श्रुतः । विषं पास्यसि नो चेत्त्वं भस्मीभूतास्तदाखिलाः ॥ ३५॥ प्रसिद्धं च यदा यस्य दुःखं
    च जायते प्रभो । तदा त्वन्नाममात्रेण सर्वदुःखं विलीयते ॥ ३६॥ इदानीं नृहरिज्वालापीडितान्नस्सदाशिव ।
    तां त्वं शमयितुं देव शक्तोऽसीति सुनिश्चितम् ॥ ३७॥ इति शिवपुराणे शतरुद्रसंहितायां दशमाध्ययान्तर्गतं
    देवैः कृतं शिवस्तोत्रं समाप्तम् । शिवपुराण । शतरुद्रसंहिता । अध्याय १०
