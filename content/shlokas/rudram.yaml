id: rudram
category: veda
name:
  english: rudram
  devanagari: रुद्रम्
content:
  english: shi ca me sharirani ca me || 1|| jyaishthyam ca ma adhipatyam ca me manyushca me bhamashca
    me'mashca me'mbhashca me jema ca me mahima ca me varima ca me prathima ca me varshma ca me draghuya
    ca me vriddham ca me vriddhishca me satyam ca me shraddha ca me jagacca me dhanam ca me vashashca
    me tvishishca me krida ca me modashca me jatam ca me janishyamanam ca me suktam ca me sukritam ca
    me vittam ca me vedyam ca me bhutam ca me bhavishyacca me sugam ca me supatham ca ma riddham ca ma
    riddhishca me kliptam ca me kliptishca me matishca me sumatishca me || 2|| sham ca me mayashca me
    priyam ca me'nukamashca me kamashca me saumanasashca me bhadram ca me shreyashca me vasyashca me yashashca
    me bhagashca me dravinam ca me yanta ca me dharta ca me kshemashca me dhritishca me vishvam ca me
    mahashca me samvicca me jnatram ca me sushca me prasushca me siram ca me layashca ma ritam ca me'mritam
    ca me'yakshmam ca me'namayacca me jivatushca me dirghayutvam ca me'namitram ca me'bhayam ca me sugam
    ca me shayanam ca me susha ca me sudinam ca me || 3|| urkca me sunrita ca me payashca me rasashca
    me ghritam ca me madhu ca me sagdhishca me sapitishca me krishishca me vrishtishca me jaitram ca ma
    audbhidyam ca me rayishca me rayashca me pushtam ca me pushtishca me vibhu ca me prabhu ca me bahu
    ca me bhuyashca me purnam ca me purnataram ca me'kshitishca me kuyavashca me'nnam ca me'kshucca me
    vrihayashca me yavashca me mashashca me tilashca me mudgashca me khalvashca me godhumashca me masurashca
    me priyangavashca me'navashca me shyamakashca me nivarashca me || 4|| ashma ca me mrittika ca me girayashca
    me parvatashca me sikatashca me vanaspatayashca me hiranyam ca me'yashca me sisam ca me trapushca
    me shyamam ca me loham ca me'gnishca ma apashca me virudhashca ma oshadhayashca me krishtapacyam ca
    me'krishtapacyam ca me gramyashca me pashava aranyashca yajnena kalpantam vittam ca me vittishca me
    bhutam ca me bhutishca me vasu ca me vasatishca me karma ca me shaktishca me'rthashca ma emashca ma
    itishca me gatishca me || 5|| agnishca ma indrashca me somashca ma indrashca me savita ca ma indrashca
    me sarasvati ca ma indrashca me pusha ca ma indrashca me brihaspatishca ma indrashca me mitrashca
    ma indrashca me varunashca ma indrashca me tvashta ca ma indrashca me dhata ca ma indrashca me vishnushca
    ma indrashca me'shvinau ca ma indrashca me marutashca ma indrashca me vishve ca me deva indrashca
    me prithivi ca ma indrashca me'ntariksham ca ma indrashca me dyaushca ma indrashca me dishashca ma
    indrashca me murdha ca ma indrashca me prajapatishca ma indrashca me || 6|| a
  devanagari: षि च मे शरीराणि च मे ॥ १॥ ज्यैष्ठ्यं च म आधिपत्यं च मे मन्युश्च मे भामश्च मेऽमश्च मेऽम्भश्च
    मे जेमा च मे महिमा च मे वरिमा च मे प्रथिमा च मे वर्ष्मा च मे द्राघुया च मे वृद्धं च मे वृद्धिश्च मे
    सत्यं च मे श्रद्धा च मे जगच्च मे धनं च मे वशश्च मे त्विषिश्च मे क्रीडा च मे मोदश्च मे जातं च मे जनिष्यमाणं
    च मे सूक्तं च मे सुकृतं च मे वित्तं च मे वेद्यं च मे भूतं च मे भविष्यच्च मे सुगं च मे सुपथं च म ऋद्धं
    च म ऋद्धिश्च मे कॢप्तं च मे कॢप्तिश्च मे मतिश्च मे सुमतिश्च मे ॥ २॥ शं च मे मयश्च मे प्रियं च मेऽनुकामश्च
    मे कामश्च मे सौमनसश्च मे भद्रं च मे श्रेयश्च मे वस्यश्च मे यशश्च मे भगश्च मे द्रविणं च मे यन्ता च
    मे धर्ता च मे क्षेमश्च मे धृतिश्च मे विश्वं च मे महश्च मे संविच्च मे ज्ञात्रं च मे सूश्च मे प्रसूश्च
    मे सीरं च मे लयश्च म ऋतं च मेऽमृतं च मेऽयक्ष्मं च मेऽनामयच्च मे जीवातुश्च मे दीर्घायुत्वं च मेऽनमित्रं
    च मेऽभयं च मे सुगं च मे शयनं च मे सूषा च मे सुदिनं च मे ॥ ३॥ ऊर्क्च मे सूनृता च मे पयश्च मे रसश्च
    मे घृतं च मे मधु च मे सग्धिश्च मे सपीतिश्च मे कृषिश्च मे वृष्टिश्च मे जैत्रं च म औद्भिद्यं च मे रयिश्च
    मे रायश्च मे पुष्टं च मे पुष्टिश्च मे विभु च मे प्रभु च मे बहु च मे भूयश्च मे पूर्णं च मे पूर्णतरं
    च मेऽक्षितिश्च मे कूयवाश्च मेऽन्नं च मेऽक्षुच्च मे व्रीहयश्च मे यवाश्च मे माषाश्च मे तिलाश्च मे मुद्गाश्च
    मे खल्वाश्च मे गोधूमाश्च मे मसुराश्च मे प्रियङ्गवश्च मेऽणवश्च मे श्यामकाश्च मे नीवाराश्च मे ॥ ४॥ अश्मा
    च मे मृत्तिका च मे गिरयश्च मे पर्वताश्च मे सिकताश्च मे वनस्पतयश्च मे हिरण्यं च मेऽयश्च मे सीसं च मे
    त्रपुश्च मे श्यामं च मे लोहं च मेऽग्निश्च म आपश्च मे वीरुधश्च म ओषधयश्च मे कृष्टपच्यं च मेऽकृष्टपच्यं
    च मे ग्राम्याश्च मे पशव आरण्याश्च यज्ञेन कल्पन्तां वित्तं च मे वित्तिश्च मे भूतं च मे भूतिश्च मे वसु
    च मे वसतिश्च मे कर्म च मे शक्तिश्च मेऽर्थश्च म एमश्च म इतिश्च मे गतिश्च मे ॥ ५॥ अग्निश्च म इन्द्रश्च
    मे सोमश्च म इन्द्रश्च मे सविता च म इन्द्रश्च मे सरस्वती च म इन्द्रश्च मे पूषा च म इन्द्रश्च मे बृहस्पतिश्च
    म इन्द्रश्च मे मित्रश्च म इन्द्रश्च मे वरुणश्च म इन्द्रश्च मे त्वष्टा च म इन्द्रश्च मे धाता च म इन्द्रश्च
    मे विष्णुश्च म इन्द्रश्च मेऽश्विनौ च म इन्द्रश्च मे मरुतश्च म इन्द्रश्च मे विश्वे च मे देवा इन्द्रश्च
    मे पृथिवी च म इन्द्रश्च मेऽन्तरिक्षं च म इन्द्रश्च मे द्यौश्च म इन्द्रश्च मे दिशश्च म इन्द्रश्च मे
    मूर्धा च म इन्द्रश्च मे प्रजापतिश्च म इन्द्रश्च मे ॥ ६॥ अ
