id: vastusutropanishat
category: upanishad
name:
  english: vastusutropanishat
  devanagari: वास्तुसूत्रोपनिषत्
content:
  english: vastusutropanishat atha atharvavediya vastusutropanishat | prathamaprapathakasya sutrani vastoshpatirjneya
    iti 1 shatshilpangaprayogena prajanayanti rupani 2 yupamidam jyotih 3 vrittajnanam rekhajnanam ca
    yo janati sa sthapakah 4 shilpat pratima jayante 5 sa pravahanah shilpasutradhyayam sthapakavidyam
    cavadat 6 shariramurtirahite mana aveshya visheshena vikalpidoshayuktam bhavati iti 7 vastushadangamiti
    shreshtham 8 shaddha shailam jneyam 9 shailadangaragajnanam prasarati 10 dvitiyaprapathakasya sutrani
    nirdishtarthakapratima grahya 1 tatpatanam prathama kriya 2 tanmardanam dvitiya kriya 3 vilamiti marmajneyam
    4 na krityarupartham rekhakaranam kartavyam 5 adau vrittam 6 ekaikasya samyoge ekibhavati 7 rekhanvaye
    sarvangani nyasaya 8 tejamsi saralarekhani 9 nabhau rupakarma prarabhyate 10 prajapatyaritya vrittam
    hi tejastada'pam bhase caturasram 11 karnadvayam maru dbhavena acaranti 12 dhareva karnikakshetramakarshayanti
    sthapakah 13 tatra madhye labdhabindu rasayah pranah 14 trihutagnih smaryate'pi ca loke 15 nimnagastrihuta
    apa iti 16 shatkonako hi akarshanividyavisheshah 17 yatha rupe tatha yupe'nucchedanta grahyah 18 khananaprakaro
    dhyeyah 19 sutrayane rekhah subhaga bhavanti 20 utthitarekha ayirupah parshvaga abrupah tiryagrekha
    marutarupa iti 21 rupasaubhagyaddhyanabhavo jayate 22 amirekhayamuttungarupani jayante 23 aberavayamatsakarupani
    jayante 24 marutareravayam taijasarupani 25 rekhajnanam sarvamiti jneyam 26 tritiyaprapathakasya sutrani
    rupasya bhavo mukhyah 1 bhavanusarato rekhavidhanamiti jneyam 2 tesham bahudha krityam shreyah 3 nyasartham
    kalabodho dhyeya iti 4 khanitrani abhimantrayet 5 khanitrapancakam shreshtham 6 rupaprakarshartham
    rupangam snigdhamiti 7 shilpakarah pralepayanti dravakarasam 8 esham hetividya shreshtha 9 rakshartham
    parnamanih paridheyah 10 bhedanadangasaubhagam prabhavati 11 rekhanupatenangani nidheyaniti shreshthakrityam
    12 gathanuprase lakshanam vyaktam bhavati 13 dhyanaprayoge rupasaushthavam spashtam bhavati 14 yatha
    prakritistatha rupalakshanam 15 anganamardhakalam sushamam dhyeyam 16 harsavadhi ubhayadishi cordhve
    vardhayet 17 rakshavidhanena vighnaghatayah 18 rekhakramena bhedanam caturdha jneyam 19 nemyottare
    rupangam na vardhayet 20 khanitracalanavidhirdhyeyavisheshah 21 caturthaprapathakasya sutrani pratitatpratikah
    1 rupadangani sanjayante 2 dvidhato brahma rupavadbhavati 3 tattvajnanena koshthaka mukhyah 4 vargikaranam
    makhyakrityam 5 koshthakantarale rupasyavayavo dhyeyah 6 parimitangaharadbhavalakshanani jayante 7
    koshthake vyatikrante rupamavidyam bhavati 8 shulbayajnakhya sadhanam shilparupasya sadhanamiti 9
    shilpakaranam rupashaile rupashaladi dhyeyam 10 yupadrupam rupadyupa iti svabhavah 11 yupasya manam
    dhyeyam 12 shadbhagasya prayogo dhyeyah 13 purushasya tadrupe'ngastambhashcatvaro 'shtangakramenopajayante
    14 palashadandarajasamyoge rekhamanaya 15 nimnadurdhvavadhi sadarekhadinacara 16 purushastambha iva
    stambho vai yajnakhya rupam 17 yathastambhasya yupasya dashangam tatha purushasya dashayajnaprajnashca
    18 sthapakacaryah stambhadrupam bodhayanti 19 stambhah kamakaminastridhamanayanti 20 daivayajnartham
    yupah 21 tada pitrimedhena vrishastambham pashumedhartham mithunastambham kamacara home ropayanti
    22 tadbodhe manusha rupajna bhavanti 23 purushasya rupakale koshthakasyadhobhavarupam prasarati 24
    dashangayupe rupe iti tasya bhavah samanah 25 brahmakiladharah brahmakilena saha kshetram vibhajaya
    26 angadangam sanjayate 27 rekhasamyoge tatkshetre'ngani saubhagani bhavanti 28 kshetranemim rodhayediti
    rekhacatvare ca 29 pancamaprapathakasya sutrani bhavasyaropanam rupakarmani vidheyam 1 bhavasya'dharo
    rasah 2 manasi vrittirbahudha prajayate tada bhinnabhinnarasadrupam naikam bhavati 3 navadha rasah
    4 prathamarasah sha
  devanagari: वास्तुसूत्रोपनिषत् अथ अथर्ववेदीय वास्तुसूत्रोपनिषत् । प्रथमप्रपाठकस्य सूत्राणि वास्तोष्पतिर्ज्ञेय
    इति १ षट्शिल्पाङ्गप्रयोगेण प्रजनयन्ति रूपाणि २ यूपमिदं ज्योतिः ३ वृत्तज्ञानं रेखाज्ञानं च यो जानाति
    स स्थापकः ४ शिल्पात् प्रतिमा जायन्ते ५ स प्रवहणः शिल्पसूत्राध्यायं स्थापकविद्यां चावदत् ६ शरीरमूर्तिरहिते
    मन आवेश्य विशेषेण विकल्पिदोषयुक्तं भवति इति ७ वास्तुषडङ्गमिति श्रेष्ठं ८ षड्धा शैलं ज्ञेयं ९ शैलादङ्गरागज्ञानं
    प्रसरति १० द्वितीयप्रपाठकस्य सूत्राणि निर्दिष्टार्थकप्रतिमा ग्राह्या १ तत्पातनं प्रथमा क्रिया २ तन्मर्दनं
    द्वितीया क्रिया ३ विलमिति मर्मज्ञेयं ४ न कृत्यरूपार्थं रेखाकरणं कर्तव्यं ५ आदौ वृत्तं ६ एकैकस्य संयोगे
    एकीभवति ७ रेखान्वये सर्वाङ्गाणि न्यासय ८ तेजांसि सरलरेखाणि ९ नाभौ रूपकर्म प्रारभ्यते १० प्राजापत्यरीत्या
    वृत्तं हि तेजस्तदाऽपां भासे चतुरस्रं ११ कर्णद्वयं मरु द्भावेन आचरन्ति १२ धरेव कर्णिकक्षेत्रमाकर्षयन्ति
    स्थापकाः १३ तत्र मध्ये लब्धबिन्दु रसायाः प्राणः १४ त्रिहुताग्निः स्मर्यतेऽपि च लोके १५ निम्नगास्त्रिहुता
    आप इति १६ षट्कोणको हि आकर्षणीविद्याविशेषः १७ यथा रूपे तथा यूपेऽनुच्छेदान्ता ग्राह्याः १८ खननप्रकारो
    ध्येयः १९ सूत्रायने रेखाः सुभगा भवन्ति २० उत्थितरेखा अयिरूपाः पार्श्वगा अब्रूपाः तिर्यग्रेखा मरुतरूपा
    इति २१ रूपसौभाग्याद्ध्यानभावो जायते २२ अमिरेखायामुत्तुङ्गरूपाणि जायन्ते २३ अबेरवायामत्सकरूपाणि जायन्ते
    २४ मारुतरेरवायां तैजसरूपाणि २५ रेखाज्ञानं सर्वमिति ज्ञेयं २६ तृतीयप्रपाठकस्य सूत्राणि रूपस्य भावो
    मुख्यः १ भावानुसारतो रेखाविधानमिति ज्ञेयं २ तेषां बहुधा कृत्यं श्रेयः ३ न्यासार्थं कालबोधो ध्येय इति
    ४ खनित्राणि अभिमन्त्रयेत् ५ खनित्रपञ्चकं श्रेष्ठं ६ रूपप्रकर्षार्थं रूपाङ्गं स्निग्धमिति ७ शिल्पकाराः
    प्रलेपयन्ति द्रावकरसं ८ एषां हेतिविद्या श्रेष्ठा ९ रक्षार्थं पर्णमणिः परिधेयः १० भेदनादङ्गसौभगं प्रभवति
    ११ रेखानुपातेनाङ्गानि निधेयानीति श्रेष्ठकृत्यं १२ गाथानुप्रासे लक्षणं व्यक्तं भवति १३ ध्यानप्रयोगे
    रूपसौष्ठवं स्पष्टं भवति १४ यथा प्रकृतिस्तथा रूपलक्षणं १५ अङ्गानामर्धाकलं सुषमं ध्येयं १६ हर्सावधि
    उभयदिशि चोर्ध्वे वर्धयेत् १७ रक्षाविधानेन विघ्नघातयः १८ रेखाक्रमेण भेदनं चतुर्धा ज्ञेयं १९ नेम्योत्तरे
    रूपाङ्गं न वर्धयेत् २० खनित्रचालनविधिर्ध्येयविशेषः २१ चतुर्थप्रपाठकस्य सूत्राणि प्रतीतात्प्रतीकः १
    रूपादङ्गानि सञ्जायन्ते २ द्विधातो ब्रह्म रूपवद्भवति ३ तत्त्वज्ञानेन कोष्ठका मुख्याः ४ वर्गीकरणं मख्यकृत्यं
    ५ कोष्ठकान्तराले रूपस्यावयवो ध्येयः ६ परिमिताङ्गहाराद्भावलक्षणानि जायन्ते ७ कोष्ठके व्यतिक्रान्ते
    रूपमविद्यं भवति ८ शुल्बयज्ञख्य साधनं शिल्परूपस्य साधनमिति ९ शिल्पकाराणां रूपशैले रूपशालादि ध्येयं
    १० यूपाद्रूपं रूपाद्यूप इति स्वभावः ११ यूपस्य मानं ध्येयं १२ षड्भागस्य प्रयोगो ध्येयः १३ पुरुषस्य
    तद्रूपेऽङ्गस्तम्भाश्चत्वारो ऽष्टाङ्गक्रमेणोपजायन्ते १४ पालाशदण्डरजसंयोगे रेखामानय १५ निम्नादूर्ध्वावधि
    सदारेखादीनाचर १६ पुरुषस्तम्भ इव स्तम्भो वै यज्ञख्य रूपं १७ यथास्तम्भस्य यूपस्य दशाङ्गं तथा पुरुषस्य
    दशयज्ञप्रज्ञाश्च १८ स्थापकाचार्याः स्तम्भाद्रूपं बोधयन्ति १९ स्तम्भः कामकामिनस्त्रिधामानयन्ति २० दैवयज्ञार्थं
    यूपः २१ तदा पितृमेधेन वृषस्तम्भं पशुमेधार्थं मिथुनस्तम्भं कामचारा होमे रोपयन्ति २२ तद्बोधे मानुषा
    रूपज्ञा भवन्ति २३ पुरुषस्य रूपाकले कोष्ठकस्याधोभावरूपं प्रसरति २४ दशाङ्गयूपे रूपे इति तस्य भावः समानः
    २५ ब्रह्मकीलाधारः ब्रह्मकीलेन सह क्षेत्रं विभाजय २६ अङ्गादङ्गं सञ्जायते २७ रेखासंयोगे तत्क्षेत्रेऽङ्गानि
    सौभगानि भवन्ति २८ क्षेत्रनेमिं रोधयेदिति रेखचत्वरे च २९ पञ्चमप्रपाठकस्य सूत्राणि भावस्यारोपणं रूपकर्माणि
    विधेयं १ भावस्याऽधारो रसः २ मनसि वृत्तिर्बहुधा प्रजायते तदा भिन्नभिन्नरसाद्रूपं नैकं भवति ३ नवधा रसः
    ४ प्रथमरसः श
