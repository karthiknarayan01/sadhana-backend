    ॐ स्कन्दमात्रे नमः ॐ शुद्धचित्तायै नमः ॐ मुनिस्तुतायै नमः ॐ महाभगवत्यै नमः ॐ दक्षायै नमः ॐ दक्षाध्वरविनाशिन्यै
