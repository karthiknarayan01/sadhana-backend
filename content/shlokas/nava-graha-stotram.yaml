id: nava-graha-stotram
category: stotram
name:
  english: Nava Graha Stotram
  devanagari: नवग्रहस्तोत्रम् १ (व्यासविरचितम् जपाकुसुमसंकाशं काश्यपेयं महाद्युतिम्)
content:
  english: japakusumasamkasham kashyapeyam mahadyutim | tamo'rim sarvapapaghnam pranato'smi divakaram
    || 1|| one vho shines like the japa flover | dadhishankhatusharabham kshirodarnavasambhavam | namami
    shashinam somam shambhormukutabhushanam || 2|| i pray to the mun vho shines cully like curds or a
    vhite shell, vho arose from the ocean of milk, vho has a hare on him, shoma, vho dharanigarbhasambhutam
    vidyutkantisamaprabham | kumaram shaktihastam tam mangalam pranamamyaham || 3|| i pray to mars, born
    of Earth, vho shines young man vho carries a spear | priyan|hgukalikashyamam rupenapratimam budham
    | saumyam saumyagunopetam tam budham pranamamyaham || 4|| of unequalled beauty, gentle and agriable
    | devanam ca rishinam ca gurum kancanasamnibham | buddhibhutam trilokesham tam namami brihaspatim
    || 5|| rishis, intellect incarnate, lord of the thri vorlds | himakundamrinalabham daityanam paramam
    gurum | sarvashastrapravaktaram bhargavam pranamamyaham || 6|| demons, promulgator of all learning,
    he vho shines like the fiber of snov-vhite jasmine | nilamjanasamabhasam raviputram yamagrajam | chayamartandasambhutam
    tam namami shanaishcaram || 7|| appearance of black collyrium | ardhakayam mahaviryam candradityavimardanam
    | simhikagarbhasambhutam tam rahum pranamamyaham || 8|| i pray to ṟahu, having half a body, of great
    born of shimhika | palashapushpasamkasham tarakagrahamastakam | raudram raudratmakam ghoram tam ketum
    pranamamyaham || 9|| fierce and terrifying | iti vyasamukhodgitam yah pathetsusamahitah | diva va
    yadi va ratrau vighnashantirbhavishyati || 10|| those vho read the song sung by Vyasa, vill be joyous,
    sovereign and poverful, and vill succid in appeasing obstacles, occurring by day or by night | naranarinripanam
    ca bhavedduhsvapnanashanam | aishvaryamatulam teshamarogyam pushtivardhanam || Bad dreams of men,
    vomen and kings alike vill be destroyed and they vill be endoved vith unparalleled rices, gud health
    and enhancing nourishment | grahanakshatrajah pidastaskaragnisamud|hbhavah | tah sarvah prashamam
    yanti vyaso brute na samshayah || all the pain, devastation caused by fire, planets and stars vill
    be of the past, so spoke Vyasa, emphatically | || iti shrivyasaviracitam navagrahastotram sampurnama
  devanagari: जपाकुसुमसंकाशं काश्यपेयं महाद्युतिम् । तमोऽरिं सर्वपापघ्नं प्रणतोऽस्मि दिवाकरम् ॥ १॥ ओने
    व्हो शिनेस् लिके थे जपा फ़्लोवेर् । दधिशङ्खतुषाराभं क्षीरोदार्णवसंभवम् । नमामि शशिनं सोमं शम्भोर्मुकुटभूषणम्
    ॥ २॥ ई प्रय् तो थे ंऊन् व्हो शिनेस् चूल्ल्य् लिके चुर्द्स् ओर् अ व्हिते शेल्ल्, व्हो अरोसे फ़्रोम्
    थे ओचेअन् ओफ़् मिल्क्, व्हो हस् अ हरे ओन् हिम्, षोम, व्हो धरणीगर्भसंभूतं विद्युत्कान्तिसमप्रभम् । कुमारं
    शक्तिहस्तं तं मङ्गलं प्रणमाम्यहम् ॥ ३॥ ई प्रय् तो ंअर्स्, बोर्न् ओफ़् Eअर्थ्, व्हो शिनेस् योउन्ग् मन्
    व्हो चर्रिएस् अ स्पेअर् । प्रियङ्।ह्गुकलिकाश्यामं रूपेणाप्रतिमं बुधम् । सौम्यं सौम्यगुणोपेतं तं बुधं
    प्रणमाम्यहम् ॥ ४॥ ओफ़् उनेक़ुअल्लेद् बेऔत्य्, गेन्त्ले अन्द् अग्रीअब्ले । देवानां च ऋषीणां च गुरुं काञ्चनसंनिभम्
    । बुद्धिभूतं त्रिलोकेशं तं नमामि बृहस्पतिम् ॥ ५॥ रिशिस्, इन्तेल्लेच्त् इन्चर्नते, लोर्द् ओफ़् थे थ्री
    वोर्ल्द्स् । हिमकुन्दमृणालाभं दैत्यानां परमं गुरुम् । सर्वशास्त्रप्रवक्तारं भार्गवं प्रणमाम्यहम् ॥
    ६॥ देमोन्स्, प्रोमुल्गतोर् ओफ़् अल्ल् लेअर्निन्ग्, हे व्हो शिनेस् लिके थे फ़िबेर् ओफ़् स्नोव्-व्हिते
    जस्मिने । नीलांजनसमाभासं रविपुत्रं यमाग्रजम् । छायामार्तण्डसंभूतं तं नमामि शनैश्चरम् ॥ ७॥ अप्पेअरन्चे
    ओफ़् ब्लच्क् चोल्ल्य्रिउम् । अर्धकायं महावीर्यं चन्द्रादित्यविमर्दनम् । सिंहिकागर्भसंभूतं तं राहुं
    प्रणमाम्यहम् ॥ ८॥ ई प्रय् तो ऱहु, हविन्ग् हल्फ़् अ बोद्य्, ओफ़् ग्रेअत् बोर्न् ओफ़् षिम्हिका । पलाशपुष्पसंकाशं
    तारकाग्रहमस्तकम् । रौद्रं रौद्रात्मकं घोरं तं केतुं प्रणमाम्यहम् ॥ ९॥ फ़िएर्चे अन्द् तेर्रिफ़्यिन्ग्
    । इति व्यासमुखोद्गीतं यः पठेत्सुसमाहितः । दिवा वा यदि वा रात्रौ विघ्नशान्तिर्भविष्यति ॥ १०॥ ठोसे व्हो
    रेअद् थे सोन्ग् सुन्ग् ब्य् Vयास, विल्ल् बे जोयोउस्, सोवेरेइग्न् अन्द् पोवेर्फ़ुल्, अन्द् विल्ल् सुच्चीद्
    इन् अप्पेअसिन्ग् ओब्स्तच्लेस्, ओच्चुर्रिन्ग् ब्य् दय् ओर् ब्य् निघ्त् । नरनारीनृपाणां च भवेद्दुःस्वप्ननाशनम्
    । ऐश्वर्यमतुलं तेषामारोग्यं पुष्टिवर्धनम् ॥ Bअद् द्रेअम्स् ओफ़् मेन्, वोमेन् अन्द् किन्ग्स् अलिके विल्ल्
    बे देस्त्रोयेद् अन्द् थेय् विल्ल् बे एन्दोवेद् विथ् उन्परल्लेलेद् रिचेस्, गूद् हेअल्थ् अन्द् एन्हन्चिन्ग्
    नोउरिश्मेन्त् । ग्रहनक्षत्रजाः पीडास्तस्कराग्निसमुद्।ह्भवाः । ताः सर्वाः प्रशमं यान्ति व्यासो ब्रूते
    न संशयः ॥ आल्ल् थे पैन्, देवस्ततिओन् चौसेद् ब्य् फ़िरे, प्लनेत्स् अन्द् स्तर्स् विल्ल् बे ओफ़् थे पस्त्,
    सो स्पोके Vयास, एम्फतिचल्ल्य् । ॥ इति श्रीव्यासविरचितं नवग्रहस्तोत्रं सम्पूर्णम
