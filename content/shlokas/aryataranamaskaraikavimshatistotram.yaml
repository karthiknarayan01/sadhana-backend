id: aryataranamaskaraikavimshatistotram
category: stotram
name:
  english: aryataranamaskaraikavimshatistotram
  devanagari: आर्यतारानमस्कारैकविंशतिस्तोत्रम्
content:
  english: '|| 22|| sayam va pratarutthaya smaret sarvabhayapradam | sarvapapaprashamanam sarvadurgatinashanam
    || 23|| abhishikto bhavet turnam saptabhirjinakotibhih | masamatrena caivasau sukham bauddhapadam
    vrajet || 24|| visham tasya mahaghoram sthavaram catha jangamam | smarananna padam yati khaditam pi'
  devanagari: ॥ २२॥ सायं वा प्रातरुत्थाय स्मरेत् सर्वाभयप्रदम् । सर्वपापप्रशमनं सर्वदुर्गतिनाशनम् ॥ २३॥
    अभिषिक्तो भवेत् तूर्णं सप्तभिर्जिनकोटिभिः । मासमात्रेण चैवासौ सुखं बौद्धपदं व्रजेत् ॥ २४॥ विषं तस्य
    महाघोरं स्थावरं चाथ जङ्गमम् । स्मरणान्न पदं याति खादितं पि
meaning: {}
