id: prahladakritam1vishnustotram
category: stotram
name:
  english: prahladakritam1vishnustotram
  devanagari: प्रह्लादकृतं१विष्णुस्तोत्रम्
content:
  english: prahladakritam 1 vishnustotram prahlada uvaca | om namah paramarthaya sthulasukshmaksharakshara
    | vyaktavyaktakalatita sakalesha niranjana || 9|| gunanjana gunadhara nirgunatman gunasthita | murttamurtamahamurte
    sukshmamurte sphutasphuta || 10|| karalasaumyarupatmanvidya'vidyamayacyuta | sadasadrupasadbhava sadasadbhavabhavana
    || 11|| nityanityaprapancatmannishprapancamalashrita | ekaneka namastubhyam vasudevadikarana || 12||
    yah sthulasukshmah prakatah prakasho yah sarvabhuto na ca sarvabhutah | vishvam yatashcaitadavishvaheto
    namo'stu tasmai purushottamaya || 13|| iti vishnupurane prathamabhage vimshadhyayantargatam prahladakritam
    vishnustotram samaptam | vishnupurana | adhyaya 1
  devanagari: प्रह्लादकृतं १ विष्णुस्तोत्रम् प्रह्लाद उवाच । ॐ नमः परमार्थाय स्थूलसूक्ष्मक्षराक्षर । व्यक्ताव्यक्तकलातीत
    सकलेश निरञ्जन ॥ ९॥ गुणाञ्जन गुणाधार निर्गुणात्मन् गुणस्थित । मूर्त्तामूर्तमहामूर्ते सूक्ष्ममूर्ते
    स्फुटास्फुट ॥ १०॥ करालसौम्यरूपात्मन्विद्याऽविद्यामयाच्युत । सदसद्रूपसद्भाव सदसद्भावभावन ॥ ११॥ नित्यानित्यप्रपञ्चात्मन्निष्प्रपञ्चामलाश्रित
    । एकानेक नमस्तुभ्यं वासुदेवादिकारण ॥ १२॥ यः स्थूलसूक्ष्मः प्रकटः प्रकाशो यः सर्वभूतो न च सर्वभूतः
    । विश्वं यतश्चैतदविश्वहेतो नमोऽस्तु तस्मै पुरुषोत्तमाय ॥ १३॥ इति विष्णुपुराणे प्रथमभागे विंशाध्यायान्तर्गतं
    प्रह्लादकृतं विष्णुस्तोत्रं समाप्तम् । विष्णुपुराण । अध्याय १
