id: urdhvapundramantrah
category: mantra
name:
  english: urdhvapundramantrah
  devanagari: ऊर्ध्वपुण्ड्रमन्त्राः
content:
  english: shriurdhvapundranam narayanadi namadvadashasthanani shrirange dvarakayam ca shrikurme ca tatha
    sthitah | simhadrau ca himadrau ca prayage tulasivane || 1|| grihitva mrittikam bhaktya vishnupadajalaih
    saha | gayatrimulamantrabhyam trivaramabhimantrya ca || 2|| dhritva pundrani cangeshu vishnusayujyamapnuyat
    | lalate keshavam dhyayennarayanamathodare || 3|| vakshahsthale madhavanca govindam kanthakubare |
    vishnunca dakshine kukshau bahau ca madhusudanam || 4|| trivikramam kandharetu vamanam vamaparshvake
    | shridharam vamabahau tu hrishikesham tu kandhare || 5|| prishthe tu padmanabhah syatrike damodaram
    nyaset | tatprakshalanatoyena vasudeveti murdhani || 6|| tattapundrani tanmurtim dhyatva mantrena
    dharayet || 7|| iti shriurdhvapundranam narayanadinamadvadashasthanani samaptimaguh ||
  devanagari: श्रीऊर्ध्वपुण्ड्राणां नारायणादि नामद्वादशस्थानानि श्रीरङ्गे द्वारकायां च श्रीकूर्मे च तथा
    स्थितः । सिंहाद्रौ च हिमाद्रौ च प्रयागे तुलसीवने ॥ १॥ गृहीत्वा मृत्तिकां भक्त्या विष्णुपादजलैः सह
    । गायत्रीमूलमन्त्राभ्यां त्रिवारमभिमन्त्र्य च ॥ २॥ धृत्वा पुण्ड्राणि चाङ्गेषु विष्णुसायुज्यमाप्नुयात्
    । ललाटे केशवं ध्यायेन्नारायणमथोदरे ॥ ३॥ वक्षःस्थले माधवञ्च गोविन्दं कण्ठकूबरे । विष्णुञ्च दक्षिणे
    कुक्षौ बाहौ च मधुसूदनम् ॥ ४॥ त्रिविक्रमं कन्धरेतु वामनं वामपार्श्वके । श्रीधरं वामबाहौ तु हृषीकेशं
    तु कन्धरे ॥ ५॥ पृष्ठे तु पद्मनाभः स्यात्रिके दामोदरं न्यसेत् । तत्प्रक्षालनतोयेन वासुदेवेति मूर्धनि
    ॥ ६॥ तत्तपुण्ड्राणि तन्मूर्तिं ध्यात्वा मन्त्रेण धारयेत् ॥ ७॥ इति श्रीऊर्ध्वपुण्ड्राणां नारायणादिनामद्वादशस्थानानि
    समाप्तिमगुः ॥
