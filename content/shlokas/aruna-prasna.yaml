    अङ्गा॑रेषु च॒ ये हु॒ताः। उ॒भया पुत्र॑पौत्र॒कान्। यु॒वे॒ ऽहं य॒मराज॑गान्। श॒तमिन्नु श॒रदः॑॥११९॥ अदो॒
    यद्ब्रह्म॑ विल॒बम्। पि॒तृ॒णां च॑ य॒मस्य॑ च। वरु॑ण॒स्याश्वि॑नोर॒ग्नेः। म॒रुतां च वि॒हाय॑साम्। का॒म॒प्र॒यव॑णं
    मे अस्तु। स ह्ये॑वास्मि॑ स॒नात॑नः। इति नाको ब्रह्मिश्रवो॑ रायो॒ धनम्। पु॒त्रानापो॑ दे॒वीरि॒हा र्ष्णीं॒
    गृध्र॑शीर्ष्णीं च। अपेतो॑ निर् श्वे॑तकु॒क्षम्। नि॒जङ्घ ॑ शब॒लोद॑रम्। स॒ तान् वा॒च्याय॑या स॒ह। अग्ने॒
    नाश॑य स॒न्दृशः॑। ई॒र्ष्या॒सू॒ये बु॑भु॒क्षाम्। म॒न्युं कृ॒त्यां च॑ दीधिरे। रथे॑न कि शु॒काव॑ता। अग्ने॒
    नाश॑य स॒न्दृशः॑॥१२१॥ प॒र्जन्या॑य॒ प्रगा॑यत। दि॒वस्पु॒त्राय॑ मी॒ढुषे । स नो॑ य॒वस॑मिच्छतु। इ॒दं वचः॑
    प॒र्जन्या॑य स्व॒राजे । हृ॒दो अ॒स्त्वन्त॑र॒न्तद्यु॑योत। म॒यो॒भूर्वातो॑ वि॒श्वकृ॑ष्टयः सन्त्व॒स्मे।
    सु॒पि॒प्प॒ला ओष॑धीर्दे॒वगो॑पाः। यो गर्भ॒मोष॑धीनाम्। गवां कृ॒णोत्यर्व॑ताम्। प॒र्जन्यः॑ पुरु॒षीणा पुन॑र्मामैत्विन्द्रि॒यम्।
    पुन॒रायुः॒ पुन॒र्भगः॑। पुन॒र्ब्राह्म॑णमैतु मा। पुन॒र्द्रवि॑णमैतु मा। यन्मे॒ ऽद्य रेतः॑ पृथि॒वीमस्कान्॑।
    यदोष॑धीर॒प्यस॑र॒द्यदापः॑। इ॒दं तत्पुन॒राद॑दे। दी॒र्घा॒यु॒त्वाय॒ वर्च॑से। यन्मे॒ रेतः॒ प्रसि॑च्यते।
    यन्म॒ आजा॑यते॒ पुनः॑। तेन॑ माम॒मृतं॑ कुरु। तेन॑ सुप्र॒जसं॑ कुरु॥१२३॥ ऽजा॑यत। तव॑ वैश्रव॒णः स॑दा। तिरो॑
    ऽधेहि सप॒त्नान्नः॑। ये अपो॒ ऽश्नन्ति॑ केच॒न। त्वा॒ष्ट्रीं मा॒यां वै ॑ सहस्र॒वन्धु॑रम्। पु॒रु॒श्च॒क्र
    सह॑स्राश्वम्। आस्था॒या ऽऽया॑हि नो ब॒लिम्। यस्मै॑ भू॒तानि॑ ब॒लिमाव॑हन्ति। धनं॒ गावो॒ हस्ति॒ हिर॑ण्य॒मश्वान्॑॥१२४॥
    असा॑म सुम॒तौ य॒ज्ञिय॑स्य। श्रियं॒ बिभ्र॒तो शने च॑ क्रौ॒ञ्चे च॑। मै॒ना॒गे च॑ म॒हागि॑रौ। श॒तद्वा॒ट्टार॑गम॒न्ता।
    स॒ ॒हार्यं॒ नग॑रं॒ तव॑। इति मन्त्राः ऽत ऊ॒र्ध्वम्। यदि॒ बलि॒ त्। हि॒र॒ण्य॒ना॒भये॑ वितु॒दये॑ कौबे॒राया॒यं
    ब॑लिः॥१२५॥ सर्वभूताधिपतये न॑म इ॒ति। अथ बलि हृत्वोप॑तिष्ठे॒त। क्ष॒त्रं क्ष॒त्रं वै श्रव॒णः। ब्राह्मणा॑
    वय॒ ॒ स्मः। नम॑स्ते अस्तु॒ मा मा॑ हि सीः। अस्मात्प्रविश्यान्न॑मद्धी॒ति। अथ तमग्निमा॑दधी॒त। यस्मिन्नेतत्कर्म
    प्र॑युञ्जी॒त। ति॒रो ऽधा॒ भूर्भुवः॒ स्वः॑। सर्वेषां लोकानामाधिपत्ये॑ सीदे॒ति। अथ तमग्नि॑मिन्धी॒त। यस्मिन्नेतत्कर्म
    प्र॑युञ्जी॒त। ति॒रो ऽधा॒ भूर्भुवः॒ स्वः॑ स्वाहा । यस्मिन्नस्य काले सर्वा आहुतीर् अपि ब्राह्मण॑मुखी॒नाः।
    तस्मिन्नह्नः काले प्र॑युञ्जी॒त। परः॑ सु॒प्तज॑नाद्वे॒पि। मास्म प्रमाद्यन्त॑माध्या॒पयेत्। सर्वार्थाः
    सिद्ध्य॒न्ते। य ए॑वं वे॒द। क्षुध्यन्निद॑म ताम्। सर्वार्था न॑ सिद्ध्य॒न्ते। यस्ते॑ वि॒घातु॑को भ्रा॒ता।
    ममान्तर् तस्मा॑ इ॒ममग्र॒पिण्डं॑ जुहोमि। स मे ऽर्था॒न्मा विव॑धीत्। मयि॒ स्वाहा । रा॒जा॒धि॒रा॒जाय॑ प्रसह्यसा॒हिने
    श्रव॒णाय॑ कुर्महे। स मे॒ कामा॒न्काम॒कामा॑य॒ मह्यम् श्रव॒णो द॑दातु। कु॒बे॒राय॑ वैश्रव॒णाय॑। म॒हा॒रा॒जाय॒
    नमः॑। के॒तवो॒ अरु॑णासश्च। ऋ॒ष॒यो वात॑रश॒नाः। प्र॒ति॒ष्ठा श॒तधा॑ हि। स॒माहि॑तासो सहस्र॒धाय॑सम्। शि॒वा
    नः॒ शन्त॑मा भवन्तु। दि॒व्या आप॒ ओष॑धयः। सु॒मृ॒डी॒का सर॑स्वति। मा ते॒ व्यो॑म स॒न्दृशि॑॥१२९॥ संवथ्सरमेत॑द्व्रतं॒
    चरेत्। द्वौ॑ वा मा॒सौ। नियमः स॑मासे॒न। तस्मिन्नियम॑ विशे॒षाः। त्रिषवणमुदको॑पस्प॒र्शी। चतुर्थकालपान॑भक्तः॒
    स्यात्। अहरहर्वा भैक्ष॑मश्नी॒यात्। औदुम्बरीभिः समिद्भिरग्निं॑ परि॒चरेत्। पुनर्मामैत्त्विन्द्रियमि
    त्येतेनानु॑वाके॒न। उद्धृतपरिपूताभि रद्भिः कार्यं॑ कुर्वी॒त॥१३०॥ अ॑सञ्च॒यवान्। अग्नये वायवे॑ सूर्या॒य।
    ब्रह्मणे प्र॑जाप॒तये। चन्द्रमसे न॑क्षत्रे॒भ्यः। ऋतुभ्यः संव॑थ्सरा॒य। वरुणायारुणायेति व्र॑तहो॒माः।
    प्र॒व॒र्ग्यव॑दादे॒शः। अरुणाः का यी॒रन्। भद्रं कर्णेभिरिति द्वे॑ जपि॒त्वा॥१३१॥ र्यो द॒द्यात्। शिवा
    नः शन्तमेत्योषधी॑राल॒भते। सुमृडीके॑ति भू॒मिम्। एवम॑पव॒र्गे। धे॑नुर्द॒क्षिणा। क सं वास॑श्च क्षौ॒मम्।
    अन्य॑द्वा शु॒क्लम्। य॑थाश॒क्ति वा। एव स्वाध्याय॑धर्मे॒ण। अरण्ये॑ ऽधीयी॒त। तपस्वी पुण्यो भवति तपस्वी
    पु॑ण्यो भ॒वति॥१३२॥ भ॒द्रं कर्णे॑भिः शृणु॒याम॑ देवाः। भ॒द्रं प॑श्येमा॒क्षभि॒र्यज॑त्राः। स्थि॒रैरङ्गै
    स॑स्त॒नूभिः॑। व्यशे॑म दे॒वहि॑तं॒ यदायुः॑। स्व॒स्ति न॒ इन्द्रो॑ वृ॒द्धश्र॑वाः। स्व॒स्ति नः॑ पू॒षा वि॒श्ववे॑दाः।
    स्व॒स्ति न॒स्तार्क्ष्यो॒ अरि॑ष्टनेमिः। स्व॒स्ति नो॒ बृह॒स्पति॑र्दधातु॥ ॥ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑॥
    इति श्रीकृष्णयजुर्वेदीयतैत्तिरीयारण्यके प्रथमः प्रश्नः समाप्तः॥
