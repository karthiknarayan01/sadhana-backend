id: karpuradi
category: stotram
name:
  english: karpuradi
  devanagari: कर्पूरादि
content:
  english: prakatitaradane siddhayastryambakasya|| 4|| vargadyam vahnisamstham vidhuratilalitam tattrayam
    kurcayugmam lajjadvandvam ca pashcat smitamukhi tadadhashthadvayam yojayitva | matarye ye japanti
    smaraharamahile bhavayantah svarupam te lakshmilasyalilakamaladaladrishah kamarupa bhavanti|| 5||
    pratyekam va dvayam va trayamapi ca param bijamatyantaguhyam tvannamna yojayitva sakalamapi sada bhavayanto
    japanti | tesham netraravinde viharati kamala vaktrashubhramshubimbe vagdevi devi mundastragatishayalasatkanthi
    pinastanadhye|| 6|| gatasunam bahuprakarakritakanciparilasannitambam digvastram tribhuvanavidhatrim
    trinayanam | shmashanaste talpe shavahridi mahakalasurataprayuktam tvam dhyayan janani jadaceta api
    kavih || 7|| shivabhirghorabhih shavanivahamundasthikaraih param samkirnayam prakatitacitayam haravadhum
    |pravishtam | samtushtamuparisuratenatiyuvatim sada tvam dhyayanti kvacidapi ca na tesham paribhavah
    || 8|| vadamaste kim va janani vayamuccairjadadhiyo na dhata napisho harirapi na te vetti paramam
    | tathapi tvadbhaktirmukharayati casmakamamite tadetatkshantavyam na khalu pashuroshah samucitah ||
    9|| samantadapinastanajaghanadhrighauvanavatiratasakto naktam yadi japati bhaktastava manum | vivasastvam
    dhyayan galitacikurastasya vashagah samastah siddhaugha bhuvi cirataram jivati kavih || 10|| samah
    susthibhuto japati viparitam yadi sada vicintya tvam dhyayannatishayamahakalasuratam | tada tasya
    kshonitalaviharamanasya vidushah karambhoje vashya purahasvadhu siddhinivahah || 11|| prasute samsaram
    janani bhavati palayati ca samastam kshityadi pralayasamaye samharati ca | atastvam dhatasi tribhuvanapatih
    shripatirapi mahesho'pi prayah sakalamapi kim staumi bhavatim || 12|| aneke sevante bhavadadhikagivarnanivahan
    vimudhaste matah kimapi na hi jananti paramam | samaradhyamadyam hariharavirincadivibudhaih prapanno'smi
    svairam ratirasasamahanandaniratam || 13|| dharatri kilalam shucirapi samiro'pi gaganam tvameka kalyani
    girisharamani kali sakalam | prasannam tvam bhuya bhavamanu na bhuyanmama januh || 14|| shmashanasthah
    sustho galitacikuro dikpatadharah sahasram tvakarnam nijagalitaviryena kusumam | japamstvatprayekam
    manumapi tava dhyananirato mahakali svairam sa bhavati dharitriparivridhah || 15|| grihe sammarjyanya
    parigalitaviryam hi cikuram samulam madhyahne vitarati citayam kujadine | samuccarya pramena manumapi
    sakritkali satatam gajarudho yati kshitiparivridhah satkavivarah || 16|| svapushpairakirnam kusumadhanusho
    mandiramaho puro dhyayandhyayan yadi japati bhaktastava manum | sa gandharvashrenipatirapi kavitvamritanadinadinah
    paryante paramapadalinah prabhavati || 17|| tripancare pithe shavashivahridi smeravadanam mahakalenoccairmadanarasalavanyaniratam
    | samasakto naktam svayamapi ratanandanirato jano yo dhyayettvamayi janani sa syat smaraharah || 18||
    salomasthi svairam palalamapi marjaramasite param coshttram maisham naramahishayoshchagamapi va |
    balim te pujayamayi vitaratam martyavasatam satam siddhih sarva pratipadamapurva prabhavati || 19||
    vashi laksham mantram prajapati havishyashanarato diva mataryushmaccaranayugaladhyananipunah | param
    naktam nagno nidhuvanavinodena ca manum japellaksham sa syat smaraharasamanah kshititale || 20|| idam
    stotram matastava manusamuddharanajanuh svarupakhyam padambujayugalapujavidhiyutam | nishardham va
    pujasamayamadhi va yastu pathati pralapastasyapi prasarati kavitvamritarasah || 21|| kurangakshivrindam
    tamanusarati premataralam vashastasya kshonipatirapi kuberapratinidhih | ripuh karagaram kalayati
    ca tam kelikalaya ciram jivanmuktah prabhavati sa bhaktah pratijanuh || 22|| iti shrimanmahakaliviracitam
    shrimaddakshinakalikayah svarupakhyam stotram samaptam
  devanagari: प्रकटितरदने सिद्धयस्त्र्यम्बकस्य॥ ४॥ वर्गाद्यं वह्निसंस्थं विधुरतिललितं तत्त्रयं कूर्चयुग्मं
    लज्जाद्वन्द्वं च पश्चात् स्मितमुखि तदधष्ठद्वयं योजयित्वा । मातर्ये ये जपन्ति स्मरहरमहिले भावयन्तः
    स्वरूपं ते लक्ष्मीलास्यलीलाकमलदलदृशः कामरूपा भवन्ति॥ ५॥ प्रत्येकं वा द्वयं वा त्रयमपि च परं बीजमत्यन्तगुह्यं
    त्वन्नाम्ना योजयित्वा सकलमपि सदा भावयन्तो जपन्ति । तेषां नेत्रारविन्दे विहरति कमला वक्त्रशुभ्रांशुबिम्बे
    वाग्देवी देवि मुण्डस्त्रगतिशयलसत्कण्ठि पीनस्तनाढ्ये॥ ६॥ गतासूनां बाहुप्रकरकृतकञ्चीपरिलसन्नितम्बां
    दिग्वस्त्रां त्रिभुवनविधात्रीं त्रिणयनां । श्मशानस्ते तल्पे शवहृदि महाकालसुरतप्रयुक्तां त्वां ध्यायन्
    जननि जडचेता अपि कविः ॥ ७॥ शिवाभिर्घोराभिः शवनिवहमुण्डास्थिकरैः परं संकीर्णायां प्रकटितचितायां हरवधूम्
    ।प्रविष्टां । संतुष्टामुपरिसुरतेनातियुवतीं सदा त्वां ध्यायन्ति क्वचिदपि च न तेषां परिभवः ॥ ८॥ वदामस्ते
    किं वा जननि वयमुच्चैर्जडधियो न धाता नापीशो हरिरपि न ते वेत्ति परमम् । तथापि त्वद्भक्तिर्मुखरयति चास्माकममिते
    तदेतत्क्षन्तव्यं न खलु पशुरोषः समुचितः ॥ ९॥ समन्तादापीनस्तनजघनधृघौवनवतीरतासक्तो नक्तं यदि जपति भक्तस्तव
    मनुम् । विवासास्त्वां ध्यायन् गलितचिकुरस्तस्य वशगाः समस्ताः सिद्धौघा भुवि चिरतरं जीवति कविः ॥ १०॥
    समाः सुस्थीभूतो जपति विपरीतां यदि सदा विचिन्त्य त्वां ध्यायन्नतिशयमहाकालसुरताम् । तदा तस्य क्षोणीतलविहरमाणस्य
    विदुषः कराम्भोजे वश्या पुरहस्वधू सिद्धिनिवहाः ॥ ११॥ प्रसूते संसारं जननि भवती पालयति च समस्तं क्षित्यादि
    प्रलयसमये संहरति च । अतस्त्वं धातासि त्रिभुवनपतिः श्रीपतिरपि महेशोऽपि प्रायः सकलमपि किं स्तौमि भवतीम्
    ॥ १२॥ अनेके सेवन्ते भवदधिकगीवार्णनिवहान् विमूढास्ते मातः किमपि न हि जानन्ति परमम् । समाराध्यामाद्यां
    हरिहरविरिञ्चादिविबुधैः प्रपन्नोऽस्मि स्वैरं रतिरससमहानन्दनिरताम् ॥ १३॥ धरत्रि कीलालं शुचिरपि समीरोऽपि
    गगनं त्वमेका कल्याणी गिरिशरमणी कालि सकलम् । प्रसन्नां त्वं भूया भवमनु न भूयान्मम जनुः ॥ १४॥ श्मशानस्थः
    सुस्थो गलितचिकुरो दिक्पटधरः सहस्रं त्वकार्णां निजगलितवीर्येण कुसुमम् । जपंस्त्वत्प्रयेकं मनुमपि तव
    ध्याननिरतो महाकालि स्वैरं स भवति धरित्रीपरिवृढः ॥ १५॥ गृहे संमार्ज्यन्या परिगलितविर्यं हि चिकुरं समूलं
    मध्याह्ने वितरति चितायां कुजदिने । समुच्चार्य प्रमेणा मनुमपि सकृत्कालि सततं गजारूढो याति क्षितिपरिवृढः
    सत्कविवरः ॥ १६॥ स्वपुष्पैराकीर्णं कुसुमधनुषो मन्दिरमहो पुरो ध्यायन्ध्यायन् यदि जपति भक्तस्तव मनुम्
    । स गन्धर्वश्रेणीपतिरपि कवित्वामृतनदीनदीनः पर्यन्ते परमपदलीनः प्रभवति ॥ १७॥ त्रिपञ्चारे पीठे शवशिवहृदि
    स्मेरवदनां महाकालेनोच्चैर्मदनरसलावण्यनिरताम् । समासक्तो नक्तं स्वयमपि रतानन्दनिरतो जनो यो ध्यायेत्त्वामयि
    जननि स स्यात् स्मरहरः ॥ १८॥ सलोमास्थि स्वैरं पललमपि मार्जारमसिते परं चोष्ट्त्रं मैशं नरमहिषयोश्छागमपि
    वा । बलिम् ते पूजायामयि वितरतां मर्त्यवसतां सतां सिद्धिः सर्वा प्रतिपदमपूर्वा प्रभवति ॥ १९॥ वशी लक्षं
    मन्त्रं प्रजपति हविष्याशनरतो दिवा मातर्युष्मच्चरणयुगलध्याननिपुणः । परं नक्तं नग्नो निधुवनविनोदेन च
    मनुं जपेल्लक्षं स स्यात् स्मरहरसमानः क्षितितले ॥ २०॥ इदं स्तोत्रं मातस्तव मनुसमुद्धारणजनुः स्वरूपाख्यं
    पादाम्बुजयुगलपूजाविधियुतम् । निशार्धं वा पूजासमयमधि वा यस्तु पठति प्रलापस्तस्यापि प्रसरति कवित्वामृतरसः
    ॥ २१॥ कुरङ्गाक्षीवृन्दं तमनुसरति प्रेमतरलं वशस्तस्य क्षोणीपतिरपि कुबेरप्रतिनिधिः । रिपुः कारागारं
    कलयति च तं केलिकलया चिरं जीवन्मुक्तः प्रभवति स भक्तः प्रतिजनुः ॥ २२॥ इति श्रीमन्महाकालिविरचितं श्रीमद्दक्षिणकालिकायाः
    स्वरूपाख्यं स्तोत्रं समाप्तम्
