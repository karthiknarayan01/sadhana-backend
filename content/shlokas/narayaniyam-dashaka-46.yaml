id: narayaniyam-dashaka-46
category: stotram
name:
  english: Narayaniyam Dashaka 46
content:
  english: ayi deva pura kila tvayi svayamuttanashaye stanandhaye | parijrimbhanato vyapavrite vadane
    vishvamacashta vallavi || || punarapyatha balakaih samam tvayi lilanirate jagatpate | phalasancayavancanakrudha
    tava mridbhojanamucurarbhakah || || ayi te pralayavadhau vibho kshititoyadisamastabhakshinah | mridupashanato
    ruja bhavediti bhita janani cukopa sa || || ayi durvinayatmaka tvaya kimu mritsa bata vatsa bhakshita
    | iti matrigiram ciram vibho vitatham tvam pratijajnishe hasan || || ayi te sakalairvinishcite vimatishcedvadanam
    vidaryatam | iti matrivibhartsito mukham vikasatpadmanibham vyadarayah || || api mrillavadarshanotsukam
    jananim tam bahu tarpayanniva | prithivim nikhilam na kevalam bhuvananyapyakhilanyadidrishah || ||
    kuhacidvanamambudhih kvacit kvacidabhram kuhacidrasatalam | manuja danujah kvacit sura dadrishe kim
    na tada tvadanane || || kalashambudhishayinam punah paravaikunthapadadhivasinam | svapurashca nijarbhakatmakam
    katidha tvam na dadarsha sa mukhe || || vikasadbhuvane mukhodare nanu bhuyo'pi tathavidhananah | anaya
    sphutamikshito bhavananavastham jagatam batatanot || || dhritatattvadhiyam tada kshanam jananim tam
    pranayena mohayan | stanamamba dishetyupasajan bhagavannadbhutabala pahi mam ||
  devanagari: अयि देव पुरा किल त्वयि स्वयमुत्तानशये स्तनन्धये । परिजृम्भणतो व्यपावृते वदने विश्वमचष्ट
    वल्लवी ॥ ॥ पुनरप्यथ बालकैः समं त्वयि लीलानिरते जगत्पते । फलसञ्चयवञ्चनक्रुधा तव मृद्भोजनमूचुरर्भकाः
    ॥ ॥ अयि ते प्रलयावधौ विभो क्षितितोयादिसमस्तभक्षिणः । मृदुपाशनतो रुजा भवेदिति भीता जननी चुकोप सा ॥
    ॥ अयि दुर्विनयात्मक त्वया किमु मृत्सा बत वत्स भक्षिता । इति मातृगिरं चिरं विभो वितथां त्वं प्रतिजज्ञिषे
    हसन् ॥ ॥ अयि ते सकलैर्विनिश्चिते विमतिश्चेद्वदनं विदार्यताम् । इति मातृविभर्त्सितो मुखं विकसत्पद्मनिभं
    व्यदारयः ॥ ॥ अपि मृल्लवदर्शनोत्सुकां जननीं तां बहु तर्पयन्निव । पृथिवीं निखिलां न केवलं भुवनान्यप्यखिलान्यदीदृशः
    ॥ ॥ कुहचिद्वनमम्बुधिः क्वचित् क्वचिदभ्रं कुहचिद्रसातलम् । मनुजा दनुजाः क्वचित् सुरा ददृशे किं न तदा
    त्वदानने ॥ ॥ कलशाम्बुधिशायिनं पुनः परवैकुण्ठपदाधिवासिनम् । स्वपुरश्च निजार्भकात्मकं कतिधा त्वां न
    ददर्श सा मुखे ॥ ॥ विकसद्भुवने मुखोदरे ननु भूयोऽपि तथाविधाननः । अनया स्फुटमीक्षितो भवाननवस्थां जगतां
    बतातनोत् ॥ ॥ धृततत्त्वधियं तदा क्षणं जननीं तां प्रणयेन मोहयन् । स्तनमम्ब दिशेत्युपासजन् भगवन्नद्भुतबाल
    पाहि माम् ॥
