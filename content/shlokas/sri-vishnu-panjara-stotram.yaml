id: sri-vishnu-panjara-stotram
category: stotram
name:
  english: Sri Vishnu Panjara Stotram
content:
  english: om asya shrivishnupanjarastotra mahamantrasya narada rishih | anushtup chandah | shrivishnuh
    paramatma devata | aham bijam | soham shaktih | om hrim kilakam | mama sarvadeharakshanartham jape
    viniyogah | narada rishaye namah mukhe | shrivishnuparamatmadevatayai namah hridaye | aham bijam guhye
    | soham shaktih padayoh | om hrim kilakam padagre | om hram hrim hrum hraim hraum hrah iti mantrah
    | om hram angushthabhyam namah | om hrim tarjanibhyam namah | om hrum madhyamabhyam namah | om hraim
    anamikabhyam namah | om hraum kanishthikabhyam namah | om hrah karatalakaraprishthabhyam namah | iti
    karanyasah | om hram hridayaya namah | om hrim shirase svaha | om hrum shikhayai vashat | om hraim
    kavacaya hum | om hraum netratrayaya vaushat | om hrah astraya phat | iti anganyasah | aham bijam
    pranayamam mantratrayena kuryat | dhyanam | param parasmatprakriteranadimekam nivishtam bahudha guhayam
    | sarvalayam sarvacaracarastham namami vishnum jagadekanatham || || om vishnupanjarakam divyam sarvadushtanivaranam
    | ugratejo mahaviryam sarvashatrunikrintanam || || tripuram dahamanasya harasya brahmano hitam | tadaham
    sampravakshyami atmarakshakaram nrinam || || padau rakshatu govindo janghe caiva trivikramah | uru
    me keshavah patu katim caiva janardanah || || nabhim caivacyutah patu guhyam caiva tu vamanah | udaram
    padmanabhashca prishtham caiva tu madhavah || || vamaparshvam tatha vishnurdakshinam madhusudanah
    | bahu vai vasudevashca hridi damodarastatha || || kantham rakshatu varahah krishnashca mukhamandalam
    | madhavah karnamule tu hrishikeshashca nasike || || netre narayano rakshellalatam garudadhvajah |
    kapolau keshavo rakshedvaikunthah sarvatodisham || || shrivatsankashca sarveshamanganam rakshako bhavet
    | purvasyam pundarikaksha agneyyam shridharastatha || || dakshine narasimhashca nairrityam madhavo'vatu
    | purushottamo varunyam vayavyam ca janardanah || || gadadharastu kauberyamishanyam patu keshavah
    | akashe ca gada patu patale ca sudarshanam || || sannaddhah sarvagatreshu pravishto vishnupanjarah
    | vishnupanjaravishto'ham vicarami mahitale || || rajadvare'pathe ghore sangrame shatrusankate | nadishu
    ca rane caiva coravyaghrabhayeshu ca || || dakinipretabhuteshu bhayam tasya na jayate | raksha raksha
    mahadeva raksha raksha janeshvara || || rakshantu devatah sarva brahmavishnumaheshvarah | jale rakshatu
    varahah sthale rakshatu vamanah || || atavyam narasimhashca sarvatah patu keshavah || diva rakshatu
    mam suryo ratrau rakshatu candramah || || panthanam durgamam rakshetsarvameva janardanah | rogavighnahatashcaiva
    brahmaha gurutalpagah || || strihanta balaghati ca surapo vrishalipatih | mucyate sarvapapebhyo yah
    pathennatra samshayah || || aputro labhate putram dhanarthi labhate dhanam | vidyarthi labhate vidyam
    moksharthi labhate gatim || || apado harate nityam vishnustotrarthasampada | yastvidam pathate stotram
    vishnupanjaramuttamam || || mucyate sarvapapebhyo vishnulokam sa gacchati | gosahasraphalam tasya
    vajapeyashatasya ca || || ashvamedhasahasrasya phalam prapnoti manavah | sarvakamam labhedasya pathanannatra
    samshayah || || jale vishnuh sthale vishnurvishnuh parvatamastake | jvalamalakule vishnuh sarvam vishnumayam
    jagat || || iti shribrahmandapurane indranaradasamvade shrivishnupanjarastotram ||
  devanagari: ॐ अस्य श्रीविष्णुपञ्जरस्तोत्र महामन्त्रस्य नारद ऋषिः । अनुष्टुप् छन्दः । श्रीविष्णुः परमात्मा
    देवता । अहं बीजम् । सोहं शक्तिः । ॐ ह्रीं कीलकम् । मम सर्वदेहरक्षणार्थं जपे विनियोगः । नारद ऋषये नमः
    मुखे । श्रीविष्णुपरमात्मदेवतायै नमः हृदये । अहं बीजं गुह्ये । सोहं शक्तिः पादयोः । ॐ ह्रीं कीलकं पादाग्रे
    । ॐ ह्रां ह्रीं ह्रूं ह्रैं ह्रौं ह्रः इति मन्त्रः । ॐ ह्रां अङ्गुष्ठाभ्यां नमः । ॐ ह्रीं तर्जनीभ्यां
    नमः । ॐ ह्रूं मध्यमाभ्यां नमः । ॐ ह्रैं अनामिकाभ्यां नमः । ॐ ह्रौं कनिष्ठिकाभ्यां नमः । ॐ ह्रः करतलकरपृष्ठाभ्यां
    नमः । इति करन्यासः । ॐ ह्रां हृदयाय नमः । ॐ ह्रीं शिरसे स्वाहा । ॐ ह्रूं शिखायै वषट् । ॐ ह्रैं कवचाय
    हुम् । ॐ ह्रौं नेत्रत्रयाय वौषट् । ॐ ह्रः अस्त्राय फट् । इति अङ्गन्यासः । अहं बीजं प्राणायामं मन्त्रत्रयेण
    कुर्यात् । ध्यानम् । परं परस्मात्प्रकृतेरनादिमेकं निविष्टं बहुधा गुहायाम् । सर्वालयं सर्वचराचरस्थं
    नमामि विष्णुं जगदेकनाथम् ॥ ॥ ॐ विष्णुपञ्जरकं दिव्यं सर्वदुष्टनिवारणम् । उग्रतेजो महावीर्यं सर्वशत्रुनिकृन्तनम्
    ॥ ॥ त्रिपुरं दहमानस्य हरस्य ब्रह्मणो हितम् । तदहं सम्प्रवक्ष्यामि आत्मरक्षाकरं नृणाम् ॥ ॥ पादौ रक्षतु
    गोविन्दो जङ्घे चैव त्रिविक्रमः । ऊरू मे केशवः पातु कटिं चैव जनार्दनः ॥ ॥ नाभिं चैवाच्युतः पातु गुह्यं
    चैव तु वामनः । उदरं पद्मनाभश्च पृष्ठं चैव तु माधवः ॥ ॥ वामपार्श्वं तथा विष्णुर्दक्षिणं मधुसूदनः ।
    बाहू वै वासुदेवश्च हृदि दामोदरस्तथा ॥ ॥ कण्ठं रक्षतु वाराहः कृष्णश्च मुखमण्डलम् । माधवः कर्णमूले तु
    हृषीकेशश्च नासिके ॥ ॥ नेत्रे नारायणो रक्षेल्ललाटं गरुडध्वजः । कपोलौ केशवो रक्षेद्वैकुण्ठः सर्वतोदिशम्
    ॥ ॥ श्रीवत्साङ्कश्च सर्वेषामङ्गानां रक्षको भवेत् । पूर्वस्यां पुण्डरीकाक्ष आग्नेय्यां श्रीधरस्तथा
    ॥ ॥ दक्षिणे नारसिंहश्च नैरृत्यां माधवोऽवतु । पुरुषोत्तमो वारुण्यां वायव्यां च जनार्दनः ॥ ॥ गदाधरस्तु
    कौबेर्यामीशान्यां पातु केशवः । आकाशे च गदा पातु पाताले च सुदर्शनम् ॥ ॥ सन्नद्धः सर्वगात्रेषु प्रविष्टो
    विष्णुपञ्जरः । विष्णुपञ्जरविष्टोऽहं विचरामि महीतले ॥ ॥ राजद्वारेऽपथे घोरे सङ्ग्रामे शत्रुसङ्कटे ।
    नदीषु च रणे चैव चोरव्याघ्रभयेषु च ॥ ॥ डाकिनीप्रेतभूतेषु भयं तस्य न जायते । रक्ष रक्ष महादेव रक्ष रक्ष
    जनेश्वर ॥ ॥ रक्षन्तु देवताः सर्वा ब्रह्मविष्णुमहेश्वराः । जले रक्षतु वाराहः स्थले रक्षतु वामनः ॥ ॥
    अटव्यां नारसिंहश्च सर्वतः पातु केशवः ॥ दिवा रक्षतु मां सूर्यो रात्रौ रक्षतु चन्द्रमाः ॥ ॥ पन्थानं
    दुर्गमं रक्षेत्सर्वमेव जनार्दनः । रोगविघ्नहतश्चैव ब्रह्महा गुरुतल्पगः ॥ ॥ स्त्रीहन्ता बालघाती च सुरापो
    वृषलीपतिः । मुच्यते सर्वपापेभ्यो यः पठेन्नात्र संशयः ॥ ॥ अपुत्रो लभते पुत्रं धनार्थी लभते धनम् । विद्यार्थी
    लभते विद्यां मोक्षार्थी लभते गतिम् ॥ ॥ आपदो हरते नित्यं विष्णुस्तोत्रार्थसम्पदा । यस्त्विदं पठते स्तोत्रं
    विष्णुपञ्जरमुत्तमम् ॥ ॥ मुच्यते सर्वपापेभ्यो विष्णुलोकं स गच्छति । गोसहस्रफलं तस्य वाजपेयशतस्य च ॥
    ॥ अश्वमेधसहस्रस्य फलं प्राप्नोति मानवः । सर्वकामं लभेदस्य पठनान्नात्र संशयः ॥ ॥ जले विष्णुः स्थले
    विष्णुर्विष्णुः पर्वतमस्तके । ज्वालामालाकुले विष्णुः सर्वं विष्णुमयं जगत् ॥ ॥ इति श्रीब्रह्माण्डपुराणे
    इन्द्रनारदसंवादे श्रीविष्णुपञ्जरस्तोत्रम् ॥
