id: varahi-kavacham
category: stotram
name:
  english: Varahi Kavacham
content:
  english: asya shrivarahikavacasya trilocana rishih mama sarvashatrunashanarthe jape viniyogah || dhyanam
    | dhyatvendranilavarnabham candrasuryagnilocanam | vidhivishnuharendradi matribhairavasevitam || ||
    jvalanmaniganaproktamakutamavilambitam | astrashastrani sarvani tattatkaryocitani ca || || etaih samastairvividham
    bibhratim musalam halam | patva himsran hi kavacam bhuktimuktiphalapradam || || pathettrisandhyam
    rakshartham ghorashatrunivrittidam | vartali me shirah patu ghorahi phalamuttamam || || netre varahavadana
    patu karnau tathanjani | ghranam me rundhini patu mukham me patu jambhini || || patu me mohini jihvam
    stambhini kanthamadarat | skandhau me pancami patu bhujau mahishavahana || || simharudha karau patu
    kucau krishnamrigancita | nabhim ca shankhini patu prishthadeshe tu cakrini || || khadgam patu ca
    katyam me medhram patu ca khedini | gudam me krodhini patu jaghanam stambhini tatha || || candoccandashcoruyugmam
    januni shatrumardini | janghadvayam bhadrakali mahakali ca gulphayoh || || padadyanguliparyantam patu
    conmattabhairavi | sarvangam me sada patu kalasankarshani tatha || || yuktayuktasthitam nityam sarvapapatpramucyate
    | sarve samarthya samyuktam bhaktarakshanatatparam || || samastadevata sarvam savyam vishnoh purardhane
    | sarvashatruvinashaya shulina nirmitam pura || || sarvabhaktajanashritya sarvavidveshasamhatih |
    varahi kavacam nityam trisandhyam yah pathennarah || || tatha vidham bhutagana na sprishanti kadacana
    | apadah shatrucoradi grahadoshashca sambhavah || || mata putram yatha vatsam dhenuh pakshmeva locanam
    | tathangameva varahi raksha rakshati sarvada || || iti shrirudrayamalatantre shri varahi kavacam
    ||
  devanagari: अस्य श्रीवाराहीकवचस्य त्रिलोचन ऋषिः मम सर्वशत्रुनाशनार्थे जपे विनियोगः ॥ ध्यानम् । ध्यात्वेन्द्रनीलवर्णाभां
    चन्द्रसूर्याग्निलोचनाम् । विधिविष्णुहरेन्द्रादि मातृभैरवसेविताम् ॥ ॥ ज्वलन्मणिगणप्रोक्तमकुटामाविलम्बिताम्
    । अस्त्रशस्त्राणि सर्वाणि तत्तत्कार्योचितानि च ॥ ॥ एतैः समस्तैर्विविधं बिभ्रतीं मुसलं हलम् । पात्वा
    हिंस्रान् हि कवचं भुक्तिमुक्तिफलप्रदम् ॥ ॥ पठेत्त्रिसन्ध्यं रक्षार्थं घोरशत्रुनिवृत्तिदम् । वार्ताली
    मे शिरः पातु घोराही फालमुत्तमम् ॥ ॥ नेत्रे वराहवदना पातु कर्णौ तथाञ्जनी । घ्राणं मे रुन्धिनी पातु
    मुखं मे पातु जम्भिनी ॥ ॥ पातु मे मोहिनी जिह्वां स्तम्भिनी कण्ठमादरात् । स्कन्धौ मे पञ्चमी पातु भुजौ
    महिषवाहना ॥ ॥ सिंहारूढा करौ पातु कुचौ कृष्णमृगाञ्चिता । नाभिं च शङ्खिनी पातु पृष्ठदेशे तु चक्रिणि
    ॥ ॥ खड्गं पातु च कट्यां मे मेढ्रं पातु च खेदिनी । गुदं मे क्रोधिनी पातु जघनं स्तम्भिनी तथा ॥ ॥ चण्डोच्चण्डश्चोरुयुग्मं
    जानुनी शत्रुमर्दिनी । जङ्घाद्वयं भद्रकाली महाकाली च गुल्फयोः ॥ ॥ पादाद्यङ्गुलिपर्यन्तं पातु चोन्मत्तभैरवी
    । सर्वाङ्गं मे सदा पातु कालसङ्कर्षणी तथा ॥ ॥ युक्तायुक्तस्थितं नित्यं सर्वपापात्प्रमुच्यते । सर्वे
    समर्थ्य संयुक्तं भक्तरक्षणतत्परम् ॥ ॥ समस्तदेवता सर्वं सव्यं विष्णोः पुरार्धने । सर्वशत्रुविनाशाय
    शूलिना निर्मितं पुरा ॥ ॥ सर्वभक्तजनाश्रित्य सर्वविद्वेषसंहतिः । वाराही कवचं नित्यं त्रिसन्ध्यं यः
    पठेन्नरः ॥ ॥ तथा विधं भूतगणा न स्पृशन्ति कदाचन । आपदः शत्रुचोरादि ग्रहदोषाश्च सम्भवाः ॥ ॥ माता पुत्रं
    यथा वत्सं धेनुः पक्ष्मेव लोचनम् । तथाङ्गमेव वाराही रक्षा रक्षाति सर्वदा ॥ ॥ इति श्रीरुद्रयामलतन्त्रे
    श्री वाराही कवचम् ॥
