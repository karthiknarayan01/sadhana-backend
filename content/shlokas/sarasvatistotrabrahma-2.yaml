id: sarasvatistotrabrahma-2
category: stotram
name:
  english: sarasvatistotrabrahma
  devanagari: सरस्वतिस्तोत्रब्रह्म
content:
  english: hrim hrim hridyaikabije shashirucikamale kalpavispashtashobhe bhavye bhavyanukule kumativanadave
    vishvavandyamghripadme | padme padmopavishte pranatajanamanomodasampadayitri protphullajnanakute harinijadayite
    devi samsarasare || 5|| aim aim aim drishtamantre kamalabhavamukhambhojabhutasvarupe ruparupaprakashe
    sakalagunamaye nirgune nirvikare | na sthule naiva sukshme'pyaviditavibhave napi vijnanatattve vishve
    vishvantaratme suravaranamite nishkale nityashuddhe || 6|| hrim hrim hrim japyatushte himarucimukute
    vallakivyagrahaste matarmatarnamaste daha daha jadatam dehi buddhim prashastam | vidye vedantavedye
    parinatapathite mokshade muktimarge | margatitasvarupe bhava mama varada sharade shubhrahare || 7||
    dhim dhim dhim dharanakhye dhritimatinatibhirnamabhih kirtaniye nitye'nitye nimitte munigananamite
    nutane vai purane | punye punyapravahe hariharanamite nityashuddhe suvarne matarmatrardhatattve matimati
    matide madhavapritimode || 8|| hrum hrum hrum svasvarupe daha daha duritam pustakavyagrahaste santushtakaracitte
    smitamukhi subhage jrimbhini stambhavidye | mohe mugdhapravahe kuru mama vimatidhvantavidhvamsamide
    girgaurvagbharati tvam kavivararasanasiddhide siddhisadhye || 9|| atmanivedanam
  devanagari: ह्रीं ह्रीं हृद्यैकबीजे शशिरुचिकमले कल्पविस्पष्टशोभे भव्ये भव्यानुकूले कुमतिवनदवे विश्ववन्द्यांघ्रिपद्मे
    । पद्मे पद्मोपविष्टे प्रणतजनमनोमोदसम्पादयित्रि प्रोत्फुल्लज्ञानकूटे हरिनिजदयिते देवि संसारसारे ॥ ५॥
    ऐं ऐं ऐं दृष्टमन्त्रे कमलभवमुखाम्भोजभूतस्वरूपे रूपारूपप्रकाशे सकलगुणमये निर्गुणे निर्विकारे । न स्थूले
    नैव सूक्ष्मेऽप्यविदितविभवे नापि विज्ञानतत्त्वे विश्वे विश्वान्तरात्मे सुरवरनमिते निष्कले नित्यशुद्धे
    ॥ ६॥ ह्रीं ह्रीं ह्रीं जाप्यतुष्टे हिमरुचिमुकुटे वल्लकीव्यग्रहस्ते मातर्मातर्नमस्ते दह दह जडतां देहि
    बुद्धिं प्रशस्ताम् । विद्ये वेदान्तवेद्ये परिणतपठिते मोक्षदे मुक्तिमार्गे । मार्गातीतस्वरूपे भव मम
    वरदा शारदे शुभ्रहारे ॥ ७॥ धीं धीं धीं धारणाख्ये धृतिमतिनतिभिर्नामभिः कीर्तनीये नित्येऽनित्ये निमित्ते
    मुनिगणनमिते नूतने वै पुराणे । पुण्ये पुण्यप्रवाहे हरिहरनमिते नित्यशुद्धे सुवर्णे मातर्मात्रार्धतत्त्वे
    मतिमति मतिदे माधवप्रीतिमोदे ॥ ८॥ ह्रूं ह्रूं ह्रूं स्वस्वरूपे दह दह दुरितं पुस्तकव्यग्रहस्ते सन्तुष्टाकारचित्ते
    स्मितमुखि सुभगे जृम्भिणि स्तम्भविद्ये । मोहे मुग्धप्रवाहे कुरु मम विमतिध्वान्तविध्वंसमीडे गीर्गौर्वाग्भारति
    त्वं कविवररसनासिद्धिदे सिद्धिसाध्ये ॥ ९॥ आत्मनिवेदनम्
