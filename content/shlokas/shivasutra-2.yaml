id: shivasutra-2
category: sutra
name:
  english: shivasutra
  devanagari: शिवसुत्र
content:
  english: 45 || om namashshambhave svatmanandaprakashavapushe || atha shivasutrani | prathamonmeshah
    shambhavopayah caitanyamatma || 1||
  devanagari: ४५ ॥ ॐ नमश्शम्भवे स्वात्मानन्दप्रकाशवपुषे ॥ अथ शिवसूत्राणि । प्रथमोन्मेषः शाम्भवोपायः चैतन्यमात्मा
    ॥ १॥
