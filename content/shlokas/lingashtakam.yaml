id: lingashtakam
category: stotram
name:
  english: Lingashtakam
  devanagari: लिङ्गाष्टकम्
content:
  english: brahmamurarisurarcitalingam nirmalabhasitashobhitalingam | (nirmalabhashita) janmajaduhkhavinashakalingam
    tat pranamami sadashivalingam || 1|| devamunipravararcitalingam kamadaham karunakara lingam | ravanadarpavinashanalingam
    tat pranamami sadashiva lingam || 2|| sarvasugandhisulepitalingam buddhivivardhanakaranalingam | siddhasurasuravanditalingam
    tat pranamami sadashiva lingam || 3|| kanakamahamanibhushitalingam phanipativeshtita shobhita lingam
    | dakshasuyajnavinashana lingam tat pranamami sadashiva lingam || 4|| kunkumacandanalepitalingam pankajaharasushobhitalingam
    | sancitapapavinashanalingam tat pranamami sadashiva lingam || 5|| devaganarcita sevitalingam bhavairbhaktibhireva
    ca lingam | dinakarakotiprabhakaralingam tat pranamami sadashiva lingam || 6|| ashtadalopariveshtitalingam
    sarvasamudbhavakaranalingam | ashtadaridravinashanalingam tat pranamami sadashiva lingam || 7|| (vinashita)
    suragurusuravarapujita lingam suravanapushpa sadarcita lingam | paratparam paramatmaka lingam tat
    pranamami sadashiva lingam || 8|| lingashtakamidam punyam yah pathet shivasannidhau | shivalokamavapnoti
    shivena saha modate || || om tat sat ||
  devanagari: ब्रह्ममुरारिसुरार्चितलिङ्गम् निर्मलभासितशोभितलिङ्गम् । (निर्मलभाषित) जन्मजदुःखविनाशकलिङ्गम्
    तत् प्रणमामि सदाशिवलिङ्गम् ॥ १॥ देवमुनिप्रवरार्चितलिङ्गम् कामदहम् करुणाकर लिङ्गम् । रावणदर्पविनाशनलिङ्गम्
    तत् प्रणमामि सदाशिव लिङ्गम् ॥ २॥ सर्वसुगन्धिसुलेपितलिङ्गम् बुद्धिविवर्धनकारणलिङ्गम् । सिद्धसुरासुरवन्दितलिङ्गम्
    तत् प्रणमामि सदाशिव लिङ्गम् ॥ ३॥ कनकमहामणिभूषितलिङ्गम् फणिपतिवेष्टित शोभित लिङ्गम् । दक्षसुयज्ञविनाशन
    लिङ्गम् तत् प्रणमामि सदाशिव लिङ्गम् ॥ ४॥ कुङ्कुमचन्दनलेपितलिङ्गम् पङ्कजहारसुशोभितलिङ्गम् । सञ्चितपापविनाशनलिङ्गम्
    तत् प्रणमामि सदाशिव लिङ्गम् ॥ ५॥ देवगणार्चित सेवितलिङ्गम् भावैर्भक्तिभिरेव च लिङ्गम् । दिनकरकोटिप्रभाकरलिङ्गम्
    तत् प्रणमामि सदाशिव लिङ्गम् ॥ ६॥ अष्टदलोपरिवेष्टितलिङ्गम् सर्वसमुद्भवकारणलिङ्गम् । अष्टदरिद्रविनाशनलिङ्गम्
    तत् प्रणमामि सदाशिव लिङ्गम् ॥ ७॥ (विनाशित) सुरगुरुसुरवरपूजित लिङ्गम् सुरवनपुष्प सदार्चित लिङ्गम् ।
    परात्परं परमात्मक लिङ्गम् तत् प्रणमामि सदाशिव लिङ्गम् ॥ ८॥ लिङ्गाष्टकमिदं पुण्यं यः पठेत् शिवसन्निधौ
    । शिवलोकमवाप्नोति शिवेन सह मोदते ॥ ॥ ॐ तत् सत् ॥
