id: narayaniyam-dashaka-62
category: stotram
name:
  english: Narayaniyam Dashaka 62
content:
  english: kadacidgopalan vihitamakhasambharavibhavan nirikshya tvam shaure maghavamadamuddhvamsitumanah
    | vijanannapyetan vinayamridu nandadipashupa napricchah ko va'yam janaka bhavatamudyama iti || ||
    babhashe nandastvam suta nanu vidheyo maghavato makho varshe varshe sukhayati sa varshena prithivim
    | nrinam varshayattam nikhilamupajivyam mahitale visheshadasmakam trinasalilajiva hi pashavah || ||
    iti shrutva vacam piturayi bhavanaha sarasam dhigetanno satyam maghavajanita vrishtiriti yat | adrishtam
    jivanam srijati khalu vrishtim samucitam maharanye vrikshah kimiva balimindraya dadate || || idam
    tavat satyam yadiha pashavo nah kuladhanam tadajivyayasau baliracalabhartre samucitah | surebhyo'pyutkrishta
    nanu dharanidevah kshititale tataste'pyaradhya iti jagaditha tvam nijajanan || || bhavadvacam shrutva
    bahumatiyutaste'pi pashupah dvijendranarcanto balimadaduruccaih kshitibhrite | vyadhuh pradakshinyam
    subhrishamanamannadarayuta stvamadashshailatma balimakhilamabhirapuratah || || avocashcaivam tan kimiha
    vitatham me nigaditam girindro nanvesha svabalimupabhunkte svavapusha | ayam gotro gotradvishi ca
    kupite rakshitumalam samastanityukta jahrishurakhila gokulajushah || || pariprita yatah khalu bhavadupeta
    vrajajusho vrajam yavattavannijamakhavibhangam nishamayan | bhavantam janannapyadhikarajasa''krantahridayo
    na sehe devendrastvaduparacitatmonnatirapi || || manushyatvam yato madhubhidapi deveshvavinayam vidhatte
    cennashtastridashasadasam ko'pi mahima | tatashca dhvamsishye pashupahatakasya shriyamiti pravrittastvam
    jetum sa kila maghava durmadanidhih || || tvadavasam hantum pralayajaladanambarabhuvi prahinvan bibhrana
    kulishamayamabhrebhagamanah | pratasthe'nyairantardahanamarudadyaivimhasito bhavanmaya naiva tribhuvanapate
    mohayati kam || || surendrah kruddhashcet dvijakarunaya shailakripaya' pyanatanko'smakam niyata iti
    vishvasya pashupan | aho kinnayato giribhiditi sancintya nivasan marudgehadhisha pranuda muravairin
    mama gadan ||
  devanagari: कदाचिद्गोपालान् विहितमखसम्भारविभवान् निरीक्ष्य त्वं शौरे मघवमदमुद्ध्वंसितुमनाः । विजानन्नप्येतान्
    विनयमृदु नन्दादिपशुपा नपृच्छः को वाऽयं जनक भवतामुद्यम इति ॥ ॥ बभाषे नन्दस्त्वां सुत ननु विधेयो मघवतो
    मखो वर्षे वर्षे सुखयति स वर्षेण पृथिवीम् । नृणां वर्षायत्तं निखिलमुपजीव्यं महितले विशेषादस्माकं तृणसलिलजीवा
    हि पशवः ॥ ॥ इति श्रुत्वा वाचं पितुरयि भवानाह सरसं धिगेतन्नो सत्यं मघवजनिता वृष्टिरिति यत् । अदृष्टं
    जीवानां सृजति खलु वृष्टिं समुचितां महारण्ये वृक्षाः किमिव बलिमिन्द्राय ददते ॥ ॥ इदं तावत् सत्यं यदिह
    पशवो नः कुलधनं तदाजीव्यायासौ बलिरचलभर्त्रे समुचितः । सुरेभ्योऽप्युत्कृष्टा ननु धरणिदेवाः क्षितितले
    ततस्तेऽप्याराध्या इति जगदिथ त्वं निजजनान् ॥ ॥ भवद्वाचं श्रुत्वा बहुमतियुतास्तेऽपि पशुपाः द्विजेन्द्रानर्चन्तो
    बलिमददुरुच्चैः क्षितिभृते । व्यधुः प्रादक्षिण्यं सुभृशमनमन्नादरयुता स्त्वमादश्शैलात्मा बलिमखिलमाभीरपुरतः
    ॥ ॥ अवोचश्चैवं तान् किमिह वितथं मे निगदितं गिरीन्द्रो नन्वेष स्वबलिमुपभुङ्क्ते स्ववपुषा । अयं गोत्रो
    गोत्रद्विषि च कुपिते रक्षितुमलं समस्तानित्युक्ता जहृषुरखिला गोकुलजुषः ॥ ॥ परिप्रीता याताः खलु भवदुपेता
    व्रजजुषो व्रजं यावत्तावन्निजमखविभङ्गं निशमयन् । भवन्तं जानन्नप्यधिकरजसाऽऽक्रान्तहृदयो न सेहे देवेन्द्रस्त्वदुपरचितात्मोन्नतिरपि
    ॥ ॥ मनुष्यत्वं यातो मधुभिदपि देवेष्वविनयं विधत्ते चेन्नष्टस्त्रिदशसदसां कोऽपि महिमा । ततश्च ध्वंसिष्ये
    पशुपहतकस्य श्रियमिति प्रवृत्तस्त्वां जेतुं स किल मघवा दुर्मदनिधिः ॥ ॥ त्वदावासं हन्तुं प्रलयजलदानम्बरभुवि
    प्रहिण्वन् बिभ्राण कुलिशमयमभ्रेभगमनः । प्रतस्थेऽन्यैरन्तर्दहनमरुदाद्यैविंहसितो भवन्माया नैव त्रिभुवनपते
    मोहयति कम् ॥ ॥ सुरेन्द्रः क्रुद्धश्चेत् द्विजकरुणया शैलकृपयाऽ प्यनातङ्कोऽस्माकं नियत इति विश्वास्य
    पशुपान् । अहो किन्नायातो गिरिभिदिति सञ्चिन्त्य निवसन् मरुद्गेहाधीश प्रणुद मुरवैरिन् मम गदान् ॥
