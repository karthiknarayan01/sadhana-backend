id: ganeshatapinyupanishat-purvauttarau-bhagah-varada-purvatapini-varaottaratapini
category: upanishad
name:
  english: ganeshatapinyupanishat purvauttarau bhagah (varada purvatapini, varaottaratapini)
  devanagari: गणेशतापिन्युपनिषत् पूर्वौत्तरौ भागाः (वरद पूर्वतापिनी, वरओत्तरतापिनी)
content:
  english: meveti sambhavyahamom tatsatparam brahma vighnarajashcidatmakah so'hamom tadvinayakam param
    jyoti raso'hamityatmanamadaya manasa brahmanaikikuryat | vinayako'hamityetattattvatah pravadanti ye
    | na te samsarino nunam pramodo vai na samshayah || ityupanishat | ya evam veda sa mukhyo bhavatiti
    yajnavalkya iti yajnavalkya iti | etadeva param dhyanametadeva param tapah | vinayakasya yajjnanam
    pujanam bhavamocanam || ashvamedhasahasrani vajapeyashatani ca | ekasya dhyanayogasya kalam narhanti
    shodashim || iti ganeshottaratapinyupanishatsu prathamopanishat || 1|| om || sa vishnuh sa shivah
    sa brahma sendrah senduh sa suryah sa vayuh so'gnih sa brahmayamatmane sarvadevaya atmane bhutaya
    atmana iti manyante | om so'ham om so'ham om so'hamiti | om brahman om brahman om brahmanniti | om
    shivam om shivam om shivamiti | tam ganesham tam ganeshamidam shreshtham | om gananam tva ganapatih
    |sapriyanam tva priyapatih | sanidhinam tva nidhipatih | om tatpurushaya vidmahe vakratundaya dhimahi
    | tanno danti pracodayat | om tadganeshah | om sadganeshah | om param ganeshah | om brahma ganeshah
    | gananakaro nadah | etatsarvo nadah | sarvakaro nadah | etadakaro nadah | mahannadah | sa ganesho
    mahan bhavati | so'nurbhavati | sa vandyo bhavati | sa mukhyo bhavati | sa pujyo bhavati | rupavan
    bhavati | arupavan bhavati | dvaito bhavati | advaito bhavati | sthavarasvarupavan bhavati | jangamasvarupavan
    bhavati | sacetanavicetano bhavati | sarvam bhavati | sa ganesho'vyakto yo'nuryah shreshthah sa vai
    vegavattarah | ahrasvahrasvashca | atihrasvatihrasvatihrasvashca | asthulasthulasthulashca | om na
    vayurnagnirakasho napah prithivi na ca | na drishyam na drishyam na drishyam | na shitam noshnam na
    varsham ca | na pitam na pitam na pitam | na shvetam na shvetam na shvetam | na raktam na raktam na
    raktam | na krishnam na krishnam na krishnam | na rupam na nama na gunam ma prapyam ganesham manyante
    | sa shuddhah sa shuddhah sa shuddho ganeshah | sa brahma sa brahma sa brahma ganeshah | sa shivah
    sa shivah sa shivo ganeshah | indro ganesho vishnurganeshah suryo ganesha etatsarvam ganeshah | sa
    nirgunah sa nirahankarah sa nirvikalpah sa nirihah sa nirakara ananda
  devanagari: मेवेति सम्भाव्याहमों तत्सत्परं ब्रह्म विघ्नराजश्चिदात्मकः सोऽहमों तद्विनायकं परं ज्योती
    रसोऽहमित्यात्मानमादाय मनसा ब्रह्मणैकीकुर्यात् । विनायकोऽहमित्येतत्तत्त्वतः प्रवदन्ति ये । न ते संसारिणो
    नूनं प्रमोदो वै न संशयः ॥ इत्युपनिषत् । य एवं वेद स मुख्यो भवतीति याज्ञवल्क्य इति याज्ञवल्क्य इति
    । एतदेव परं ध्यानमेतदेव परं तपः । विनायकस्य यज्ज्ञानं पूजनं भवमोचनम् ॥ अश्वमेधसहस्राणि वाजपेयशतानि
    च । एकस्य ध्यानयोगस्य कलां नार्हन्ति षोडशीम् ॥ इति गणेशोत्तरतापिन्युपनिषत्सु प्रथमोपनिषत् ॥ १॥ ॐ ॥
    स विष्णुः स शिवः स ब्रह्मा सेन्द्रः सेन्दुः स सूर्यः स वायुः सोऽग्निः स ब्रह्मायमात्मने सर्वदेवाय
    आत्मने भूताय आत्मन इति मन्यन्ते । ॐ सोऽहं ॐ सोऽहं ॐ सोऽहमिति । ॐ ब्रह्मन् ॐ ब्रह्मन् ॐ ब्रह्मन्निति
    । ॐ शिवं ॐ शिवं ॐ शिवमिति । तं गणेशं तं गणेशमिदं श्रेष्ठम् । ॐ गणानां त्वा गणपतिः ।सप्रियाणां त्वा
    प्रियपतिः । सनिधीनां त्वा निधिपतिः । ॐ तत्पुरुषाय विद्महे वक्रतुण्डाय धीमहि । तन्नो दन्ती प्रचोदयात्
    । ॐ तद्गणेशः । ॐ सद्गणेशः । ॐ परं गणेशः । ॐ ब्रह्म गणेशः । गणनाकारो नादः । एतत्सर्वो नादः । सर्वाकारो
    नादः । एतदाकारो नादः । महान्नादः । स गणेशो महान् भवति । सोऽणुर्भवति । स वन्द्यो भवति । स मुख्यो भवति
    । स पूज्यो भवति । रूपवान् भवति । अरूपवान् भावति । द्वैतो भवति । अद्वैतो भवति । स्थावरस्वरूपवान् भवति
    । जङ्गमस्वरूपवान् भवति । सचेतनविचेतनो भवति । सर्वं भवति । स गणेशोऽव्यक्तो योऽणुर्यः श्रेष्ठः स वै
    वेगवत्तरः । अह्रस्वाह्रस्वश्च । अतिह्रस्वातिह्रस्वातिह्रस्वश्च । अस्थूलास्थूलास्थूलश्च । ॐ न वायुर्नाग्निराकाशो
    नापः पृथिवी न च । न दृश्यं न दृश्यं न दृश्यम् । न शीतं नोष्णं न वर्षं च । न पीतं न पीतं न पीतम् ।
    न श्वेतं न श्वेतं न श्वेतम् । न रक्तं न रक्तं न रक्तम् । न कृष्णं न कृष्णं न कृष्णम् । न रूपं न नाम
    न गुणम् ंअ प्राप्यं गणेशं मन्यन्ते । स शुद्धः स शुद्धः स शुद्धो गणेशः । स ब्रह्म स ब्रह्म स ब्रह्म
    गणेशः । स शिवः स शिवः स शिवो गणेशः । इन्द्रो गणेशो विष्णुर्गणेशः सूर्यो गणेश एतत्सर्वं गणेशः । स निर्गुणः
    स निरहङ्कारः स निर्विकल्पः स निरीहः स निराकार आनन्द
