id: dakaradi-sree-durga-sahasra-nama-stotram
category: stotram
name:
  english: Dakaradi Sree Durga Sahasra Nama Stotram
content:
  english: shri devyuvaca | mama nama sahasram ca shiva purvavinirmitam | tatpathyatam vidhanena tatha
    sarvam bhavishyati || ityuktva parvati devi shravayamasa taccatan | tadeva namasahasram dakaradi varanane
    || rogadaridryadaurbhagyashokaduhkhavinashakam | sarvasam pujitam nama shridurgadevata mata || nijabijam
    bhavedbijam mantram kilakamucyate | sarvashapurane devi viniyogah prakirtitah || om asya shridakaradi
    durgasahasranama stotrasya shiva rishih anushtupchandah shridurga devata dum bijam dum kilakam duhkhadaridryarogashoka
    nivrittyartham pathe viniyogah | dhyanam vidyuddamasamaprabham mrigapati skandhasthitam bhishanam
    kanyabhih karavalakhetaviladdastabhirasevitam | hasaishcakragadasikheta vishikhamshcapam gunam tarjanim
    bibhranamanalatmikam shashidharam durgam trinetram bhaje || stotram dum durga durgatihara durgacalanivasini
    | durgamarganusancara durgamarganivasini || || durgamargapravishta ca durgamargapraveshini | durgamargakritavasa
    durgamargajayapriya || || durgamargagrihitarca durgamargasthitatmika | durgamargastutipara durgamargasmritih
    para || || durgamargasadasthatri durgamargaratipriya | durgamargasthalasthana durgamargavilasini ||
    || durgamargatyaktavastra durgamargapravartini | durgasuranihantri ca durgasuranishudini || || durgasurahara
    duti durgasuravinashini | durgasuravadhonmatta durgasuravadhotsuka || || durgasuravadhotsaha durgasuravadhodyata
    | durgasuravadhaprepsuh durgasuramukhantakrit || || durgasuradhvamsatosha durgadanavadarini | durgavidravanakari
    durgavidravani sada || || durgavikshobhanakari durgashirshanikrintani | durgavidhvamsanakari durgadaityanikrintani
    || || durgadaityapranahara durgadaityantakarini | durgadaityaharatrata durgadaityasrigunmada || ||
    durgadaityashanakari durgacarmambaravrita | durgayuddhotsavakari durgayuddhavisharada || || durgayuddhasavarata
    durgayuddhavimardini | durgayuddhahasyarata durgayuddhattahasini || || durgayuddhamahamatta durgayuddhanusarini
    | durgayuddhotsavotsaha durgadeshanishevini || || durgadeshavasarata durgadeshavilasini | durgadesharcanarata
    durgadeshajanapriya || || durgamasthanasamsthana durgamadhyanusadhana | durgama durgamadhyana durgamatmasvarupini
    || || durgamagamasandhana durgamagamasamstuta | durgamagamadurjneya durgamashrutisammata || || durgamashrutimanya
    ca durgamashrutipujita | durgamashrutisuprita durgamashrutiharshada || || durgamashrutisamsthana durgamashrutimanita
    | durgamacarasantushta durgamacaratoshita || || durgamacaranirvritta durgamacarapujita | durgamacarakalita
    durgamasthanadayini || || durgamapremanirata durgamadravinaprada | durgamambujamadhyastha durgamambujavasini
    || || durganadimargagatirdurganadipracarini | durganadipadmarata durganadyambujasthita || || durganadigatayata
    durganadikritaspada | durganadiratarata durganadishasamstuta || || durganadishvararata durganadishacumbita
    | durganadishakrodastha durganadyatthitotsuka || || durganadyarohana ca durganadinishevita | daristhana
    daristhanavasini danujantakrit || || darikritatapasya ca darikritahararcana | darijapitadishta ca
    darikritaratipriya || || darikritahararha ca darikriditaputrika | darisandarshanarata dariropitavrishcika
    || || dariguptikautukadhya daribhramanatatpara | danujantakari dina danusantanadarini || || danujadhvamsini
    duna danujendravinashini | danavadhvamsini devi danavanam bhayankari || || danavi danavaradhya danavendravaraprada
    | danavendranihantri ca danavadveshinisati || || danavaripremarata danavariprapujita | danavarikritarca
    ca danavarivibhutida || || danavarimahananda danavariratipriya | danavaridanarata danavarikritaspada
    || || danavaristutirata danavarismritipriya | danavaryahararata danavariprabodhini || || danavaridhritaprema
    duhkhashokavimocani | duhkhahantri duhkhadatri duhkhanirmulakarini || || duhkhanirmulanakari duhkhadaridryanashini
    | duhkhahara duhkhanasha duhkhagrama durasada || || duhkhahina duhkhadura dravinacaradayini | dravinotsargasantushta
    dravinatyagatoshita || || dravinasparshasantushta dravinasparshamanada | dravinasparshaharshadhya
    dravinasparshatushtida || || dravinasparshanakari dravinasparshanatura | dravinasparshanotsaha dravinasparshasadhita
    || || dravinasparshanamata dravinasparshaputrika | dravinasparsharakshini dravinastomadayini || ||
    dravinakarshanakari dravinaughavisarjani | dravinacaladanadhya dravinacalavasini || || dinamata dinabandhurdinavighnavinashini
    | dinasevya dinasiddha dinasadhya digambari || || dinagehakritananda dinagehavilasini | dinabhavapremarata
    dinabhavavinodini || || dinamanavacetahstha dinamanavaharshada | dinadainyavighatecchurdinadravinadayini
    || || dinasadhanasantushta dinadarshanadayini | dinaputradidatri ca dinasamyagvidhayini || || dattatreyadhyanarata
    dattatreyaprapujita | dattatreyarshisamsiddha dattatreyavibhavita || || dattatreyakritarha ca dattatreyaprasadita
    | dattatreyaharshadatri dattatreyasukhaprada || || dattatreyastuta caiva dattatreyanutasada | dattatreyapremarata
    dattatreyanumanita || || dattatreyasamudgita dattatreyakutumbini | dattatreyapranatulya dattatreyasharirini
    || || dattatreyakritananda dattatreyamshasambhava | dattatreyavibhutistha dattatreyanusarini || ||
    dattatreyagitirata dattatreyadhanaprada | dattatreyaduhkhahara dattatreyavaraprada || || dattatreyajnanadatri
    dattatreyabhayapaha | devakanya devamanya devaduhkhavinashini || || devasiddha devapujya devejya devavandita
    | devamanya devadhanya devavighnavinashini || || devaramya devarata devakautukatatpara | devakrida
    devavrida devavairivinashini || || devakama devarama devadvishavinashini | devadevapriya devi devadanavavandita
    || || devadevaratananda devadevavarotsuka | devadevapremarata devadevapriyamvada || || devadevapranatulya
    devadevanitambini | devadevahritamana devadevasukhavaha || || devadevakrodarata devadevasukhaprada
    | devadevamahananda devadevapracumbita || || devadevopabhukta ca devadevanusevita | devadevagataprana
    devadevagatatmika || || devadevaharshadatri devadevasukhaprada | devadevamahananda devadevavilasini
    || || devadevadharmapatni devadevamanogata | devadevavadhurdevi devadevarcanapriya || || devadevanganilaya
    devadevangashayini | devadevangasukhini devadevangavasini || || devadevangabhusha ca devadevangabhushana
    | devadevapriyakari devadevapriyantakrit || || devadevapriyaprana devadevapriyatmika | devadevarcakaprana
    devadevarcakapriya || || devadevarcakotsaha devadevarcakashraya | devadevarcakavighna devadevaprasurapi
    || || devadevasya janani devadevavidhayini | devadevasya ramani devadevahridashraya || || devadeveshtadevi
    ca devatapavipatini | devatabhavasantushta devatabhavatoshita || || devatabhavavarada devatabhavasiddhida
    | devatabhavasamsiddha devatabhavasambhava || || devatabhavasukhini devatabhavavandita | devatabhavasuprita
    devatabhavaharshada || || devatavighnahantri ca devatadvishanashini | devatapujitapada devataprematoshita
    || || devatagaranilaya devatasaukhyadayini | devatanijabhava ca devatahritamanasa || || devatakritapadarca
    devatahritabhaktika | devatagarvamadhyastha devatadevatatanuh || durgayai namo namni dum shanmantrasvarupini
    | dunnamomantrarupa ca dunnamomurtikatmika || || duradarshipriya dushta dushtabhutanishevita | duradarshipremarata
    duradarshipriyamvada || || duradarshisiddhidatri duradarshipratoshita | duradarshikanthasamstha duradarshipraharshita
    || || duradarshigrihitarca duradarshipratarpita | duradarshipranatulya duradarshisukhaprada || ||
    duradarshibhrantihara duradarshihridaspada | duradarshyarividbhava dirghadarshipramodini || || dirghadarshipranatulya
    dirghadarshivaraprada | dirghadarshiharshadatri dirghadarshipraharshita || || dirghadarshimahananda
    dirghadarshigrihalaya | dirghadarshigrihitarca dirghadarshihritarhana || || daya danavati datri dayalurdinavatsala
    | dayardra ca dayashila dayadhya ca dayatmika || || dayambudhirdayasara dayasagaraparaga | dayasindhurdayabhara
    dayavatkarunakari || || dayavadvatsaladevi dayadanaratasada | dayavadbhaktisukhini dayavatparitoshita
    || || dayavatsnehanirata dayavatpratipadika | dayavatpranakartri ca dayavanmuktidayini || || dayavadbhavasantushta
    dayavatparitoshita | dayavattaranapara dayavatsiddhidayini || || dayavatputravadbhava dayavatputrarupini
    | dayavaddehanilaya dayabandhurdayashraya || || dayaluvatsalyakari dayalusiddhidayini | dayalusharanasakta
    dayalurdehamandira || || dayalubhaktibhavastha dayalupranarupini | dayalusukhada dambha dayalupremavarshini
    || || dayaluvashaga dirgha dirghangi dirghalocana | dirghanetra dirghacakshurdirghabahulatatmika ||
    || dirghakeshi dirghamukhi dirghaghona ca daruna | darunasurahantri ca darunasuradarini || || darunahavakartri
    ca darunahavaharshita | darunahavahomadhya darunacalanashini || || darunacaranirata darunotsavaharshita
    | darunodyatarupa ca darunarinivarini || || darunekshanasamyukta doshcatushkavirajita | dashadoshka
    dashabhuja dashabahuvirajita || || dashastradharini devi dashadikkhyatavikrama | dasharatharcitapada
    dasharathipriya sada || || dasharathiprematushta dasharathiratipriya | dasharathipriyakari dasharathipriyamvada
    || || dasharathishtasandatri dasharathishtadevata | dasharathidveshinasha dasharathyanukulyada ||
    || dasharathipriyatama dasharathiprapujita | dashananarisampujya dashananaridevata || || dashananaripramada
    dashananarijanmabhuh | dashananariratida dashananarisevita || || dashananarisukhada dashananarivairihrit
    | dashananarishtadevi dashagrivarivandita || || dashagrivarijanani dashagrivaribhavini | dashagrivarisahita
    dashagrivasabhajita || || dashagrivariramani dashagrivavadhurapi | dashagrivanashakartri dashagrivavaraprada
    || || dashagrivapurastha ca dashagrivavadhotsuka | dashagrivapritidatri dashagrivavinashini || ||
    dashagrivahavakari dashagrivanapayini | dashagrivapriyavandya dashagrivahrita tatha || || dashagrivahitakari
    dashagriveshvarapriya | dashagriveshvaraprana dashagrivavaraprada || || dashagriveshvararata dashavarshiyakanyaka
    | dashavarshiyabala ca dashavarshiyavasini || || dashapapahara damya dashahastavibhushita | dashashastralasaddoshka
    dashadikpalavandita || || dashavatararupa ca dashavatararupini | dashavidyabhinnadevi dashapranasvarupini
    || || dashavidyasvarupa ca dashavidyamayi tatha | driksvarupa drikpradatri drigrupa drikprakashini
    || || digantara digantastha digambaravilasini | digambarasamajastha digambaraprapujita || || digambarasahacari
    digambarakritaspada | digambarahritacitta digambarakathapriya || || digambaragunarata digambarasvarupini
    | digambarashirodharya digambarahritashraya || || digambarapremarata digambararatatura | digambarisvarupa
    ca digambariganarcita || || digambariganaprana digambariganapriya | digambariganaradhya digambaraganeshvara
    || || digambaraganasparshamadirapanavihvala | digambarikotivrita digambariganavrita || || duranta
    dushkritihara durdhyeya duratikrama | durantadanavadveshti durantadanujantakrit || || durantapapahantri
    ca dasranistarakarini | dasramanasasamsthana dasrajnanavivardhini || || dasrasambhogajanani dasrasambhogadayini
    | dasrasambhogabhavana dasravidyavidhayini || || dasrodvegahara dasrajanani dasrasundari | dasrabhaktividhajnana
    dasradvishavinashini || || dasrapakaradamani dasrasiddhividhayini | dasratararadhita ca dasramatriprapujita
    || || dasradainyahara caiva dasratatanishevita | dasrapitrishatajyotirdasrakaushaladayini || || dashashirsharisahita
    dashashirsharikamini | dashashirshapuri devi dashashirshasabhajita || || dashashirsharisuprita dashashirshavadhupriya
    | dashashirshashirashchetri dashashirshanitambini || || dashashirshaharaprana dashashirshaharatmika
    | dashashirshahararadhya dashashirsharivandita || || dashashirsharisukhada dashashirshakapalini |
    dashashirshajnanadatri dashashirsharidehini || || dashashirshavadhopattashriramacandrarupata | dashashirsharashtradevi
    dashashirsharisarini || || dashashirshabhratritushta dashashirshavadhupriya | dashashirshavadhuprana
    dashashirshavadhurata || || daityagururata sadhvi daityaguruprapujita | daityagurupadeshtri ca daityagurunishevita
    || || daityagurugataprana daityagurutapanashini | durantaduhkhashamani durantadamanitami || || durantashokashamani
    durantaroganashini | durantavairidamani durantadaityanashini || || durantakalushaghni ca dushkritistomanashini
    | durashaya duradhara durjaya dushtakamini || || darshaniya ca drishya ca drishtva ca drishtigocara
    | dutiyagapriya duti dutiyagakarapriya || || dutiyagakarananda dutiyagasukhaprada | dutiyagakarayata
    dutiyagapramodini || || durvasahpujita caiva durvasomunibhavita | durvaso'rcitapada ca durvasomunibhavita
    || || durvasomunivandya ca durvasomunidevata | durvasomunimata ca durvasomunisiddhida || || durvasomunibhavastha
    durvasomunisevita | durvasomunicittastha durvasomunimandita || || durvasomunisancara durvasohridayangama
    | durvasohridayaradhya durvasohritsarojaga || || durvasastapasaradhya durvasastapasashraya | durvasastapasarata
    durvasastapaseshvari || || durvasomunikanya ca durvaso'dbhutasiddhida | dararatri darahara darayukta
    darapaha || || daraghni darahantri ca darayukta darashraya | darasmera darapangi dayadatri dayashraya
    | dasrapujya dasramata dasradevi daronmada || || dasrasiddha dasrasamstha dasratapavimocani | dasrakshobhahara
    nitya dasralokagatatmika || || daityagurvanganavandya daityagurvanganapriya | daityagurvanganasiddha
    daityagurvanganotsuka || || daityagurupriyatama devagurunishevita | devaguruprasurupa devagurukritarhana
    || || devagurupremayuta devagurvanumanita | devaguruprabhavajna devagurusukhaprada || || devagurujnanadatri
    devagurupramodini | daityastriganasampujya daityastriganapujita || || daityastriganarupa ca daityastricittaharini
    | devastriganapujya ca devastriganavandita || || devastriganacittastha devastriganabhushita | devastriganasamsiddha
    devastriganatoshita || || devastriganahastasthacarucamaravijita | devastriganahastasthacarugandhavilepita
    || || devanganadhritadarshadrishtyarthamukhacandrama | devanganotsrishtanagavallidalakritotsuka ||
    || devastriganahastasthadhupaghranavinodini | devastriganahastasthadipamalavilokana || || devanarikaragatavasakasavapayini
    | devanarikankatikakritakeshanimarjana || || devanarisevyagatra devanarikritotsuka | devanariviracitapushpamalavirajita
    || || devanarivicitrangi devastridattabhojana | devastriganagita ca devastrigitasotsuka || || devastrinrityasukhini
    devastrinrityadarshini | devastriyojitalasadratnapadapadambuja || || devastriganavistirnacarutalpanishedushi
    | devanaricarukarakalitanghryadidehika || || devanarikaravyagratalavrintamarutsaka | devanarivenuvinanadasotkanthamanasa
    || || devakotistutinuta devakotikritarhana | devakotigitaguna devakotikritastutih || || dantadashtyodvegaphala
    devakolahalakula | dvesharagaparityakta dvesharagavivarjita || || damapujya damabhusha damodaravilasini
    | damodarapremarata damodarabhaginyapi || || damodaraprasurdamodarapatnipativrata | damodara'bhinnadeha
    damodararatipriya || || damodarabhinnatanurdamodarakritaspada | damodarakritaprana damodaragatatmika
    || || damodarakautukadhya damodarakalakala | damodaralingitangi damodarakutuhala || || damodarakritahlada
    damodarasucumbita | damodarasutakrishta damodarasukhaprada || || damodarasahadhya ca damodarasahayini
    | damodaragunajna ca damodaravaraprada || || damodaranukula ca damodaranitambini | damodarajalakridakushala
    darshanapriya || || damodarajalakridatyaktasvajanasauhrida | damodaralasadrasakelikautukini tatha
    || || damodarabhratrika ca damodaraparayana | damodaradhara damodaravairivinashini || || damodaropajaya
    ca damodaranimantrita | damodaraparabhuta damodaraparajita || || damodarasamakranta damodarahatashubha
    | damodarotsavarata damodarotsavavaha || || damodarastanyadatri damodaragaveshita | damayantisiddhidatri
    damayantiprasadita || || damayantishtadevi ca damayantisvarupini | damayantikritarca ca damanarshivibhavita
    || || damanarshipranatulya damanarshisvarupini | damanarshisvarupa ca dambhapuritavigraha || || dambhahantri
    dambhadhatri dambhalokavimohini | dambhashila dambhahara dambhavatparimardini || || dambharupa dambhakari
    dambhasantanadharini | dattamoksha dattadhana dattarogya ca dambhika || || dattaputra dattadara dattahara
    ca darika | dattabhoga dattashoka dattahastyadivahana || || dattamatirdattabharya dattashastravabodhika
    | dattapana dattadana dattadaridryanashini || || dattasaudhavanivasa dattasvarga ca dasada | dasyatushta
    dasyahara dasadasishataprada || || dararupa daravasa daravasihridaspada | daravasijanaradhya daravasijanapriya
    || || daravasivinirnita daravasisamarcita | daravasyahritaprana daravasyarinashini || || daravasivighnahara
    daravasivimuktida | daragnirupini dara darakaryarinashini || || dampati dampatishta ca dampatipranarupika
    | dampatisnehanirata dampatyasadhanapriya || || dampatyasukhaseva ca dampatyasukhadayini | dampatyacaranirata
    dampatyamodamodita || || dampatyamodasukhini dampatyahladakarini | dampatishtapadapadma dampatyapremarupini
    || || dampatyabhogabhavana dadimiphalabhojini | dadimiphalasantushta dadimiphalamanasa || || dadimivrikshasamsthana
    dadimivrikshavasini | dadimivriksharupa ca dadimivanavasini || || dadimiphalasamyorupayodharahridayuta
    | dakshina dakshinarupa dakshinarupadharini || || dakshakanya dakshaputri dakshamata ca dakshasuh
    | dakshagotra dakshasuta dakshayajnavinashini || || dakshayajnanashakartri dakshayajnantakarini |
    dakshaprasutirdakshejya dakshavamshaikapavani || || dakshatmaja dakshasunurdakshaja dakshajatika |
    dakshajanma dakshajanurdakshadehasamudbhava || || dakshajanirdakshayagadhvamsini dakshakanyaka | dakshinacaranirata
    dakshinacaratushtida || || dakshinacarasamsiddha dakshinacarabhavita | dakshinacarasukhini dakshinacarasadhita
    || || dakshinacaramokshaptirdakshinacaravandita | dakshinacarasharana dakshinacaraharshita || || dvarapalapriya
    dvaravasini dvarasamsthita | dvararupa dvarasamstha dvaradeshanivasini || || dvarakari dvaradhatri
    doshamatravivarjita | doshakara doshahara dosharashivinashini || || doshakaravibhushadhya doshakarakapalini
    | doshakarasahasrabha doshakarasamanana || || doshakaramukhi divya doshakarakaragraja | doshakarasamajyotirdoshakarasushitala
    || || doshakarashreni doshasadrishapangavikshana | doshakareshtadevi ca doshakaranishevita || || doshakarapranarupa
    doshakaramaricika | doshakarollasatphala doshakarasuharshini || || doshakarashirobhusha doshakaravadhupriya
    | doshakaravadhuprana doshakaravadhurmata || || doshakaravadhuprita doshakaravadhurapi | doshapujya
    tatha doshapujita doshaharini || || doshajapamahananda doshajapaparayana | doshapurashcararata doshapujakaputrika
    || || doshapujakavatsalyakarinijagadambika | doshapujakavairighni doshapujakavighnahrit || || doshapujakasantushta
    doshapujakamuktida | damaprasunasampujya damapushpapriya sada || || duryodhanaprapujya ca dushshasanasamarcita
    | dandapanipriya dandapanimata dayanidhih || || dandapanisamaradhya dandapaniprapujita | dandapanigrihasakta
    dandapanipriyamvada || || dandapanipriyatama dandapanimanohara | dandapanihritaprana dandapanisusiddhida
    || || dandapaniparamrishta dandapanipraharshita | dandapanivighnahara dandapanishirodhrita || || dandapanipraptacarca
    dandapanyunmukhi sada | dandapanipraptapada dandapaniparanmukhi || || dandahasta dandapanirdandabahurdarantakrit
    | dandadoshka dandakara dandacittakritaspada || || dandividya dandimata dandikhandakanashini | dandipriya
    dandipujya dandisantoshadayini || || dasyupuja dasyurata dasyudravinadayini | dasyuvargakritarha ca
    dasyuvargavinashini || || dasyunirnashini dasyukulanirnashini tatha | dasyupriyakari dasyunrityadarshanatatpara
    || || dushtadandakari dushtavargavidravini tatha | dushtavarganigraharha dushakaprananashini || ||
    dushakottapajanani dushakarishtakarini | dushakadveshanakari dahika dahanatmika || || darukarinihantri
    ca darukeshvarapujita | darukeshvaramata ca darukeshvaravandita || || darbhahasta darbhayuta darbhakarmavivarjita
    | darbhamayi darbhatanurdarbhasarvasvarupini || || darbhakarmacararata darbhahastakritarhana | darbhanukula
    darbharya darvipatranudamini || || damaghoshaprapujya ca damaghoshavaraprada | damaghoshasamaradhya
    davagnirupini tatha || || davagnirupa davagninirnashitamahabala | dantadamshtrasurakala dantacarcitahastika
    || || dantadamshtrasyandana ca dantanirnashitasura | dadhipujya dadhiprita dadhicivaradayini || ||
    dadhicishtadevata ca dadhicimokshadayini | dadhicidainyahantri ca dadhicidaradharini || || dadhicibhaktisukhini
    dadhicimunisevita | dadhicijnanadatri ca dadhicigunadayini || || dadhicikulasambhusha dadhicibhuktimuktida
    | dadhicikuladevi ca dadhicikuladevata || || dadhicikulagamya ca dadhicikulapujita | dadhicisukhadatri
    ca dadhicidainyaharini || || dadhiciduhkhahantri ca dadhicikulasundari | dadhicikulasambhuta dadhicikulapalini
    || || dadhicidanagamya ca dadhicidanamanini | dadhicidanasantushta dadhicidanadevata || || dadhicijayasamprita
    dadhicijapamanasa | dadhicijapapujadhya dadhicijapamalika || || dadhicijapasantushta dadhicijapatoshini
    | dadhicitapasaradhya dadhicishubhadayini || || durva durvadalashyama durvadalasamadyutih | namnam
    sahasram durgaya dadinamiti kirtitam || || phalashritih yah pathetsadhakadhishah sarvasiddhirlabhettu
    sah | pratarmadhyahnakale ca sandhyayam niyatah shucih || || tatha'rdharatrasamaye sa mahesha ivaparah
    | shaktiyukta maharatrau mahavirah prapujayet || || mahadevim makaradyaih pancabhirdravya sattamaih
    | tatpathet stutimimam yah sa ca siddhisvarupadhrik || || devalaye shmashane ca gangatire nijegrihe
    | varanganagrihe caiva shriguroh sannidhanapi || || parvate prantare ghore stotrametatsada pathet
    | durganamasahasrena durgam pashyati cakshusha || || shatavartanametasya purashcaranamucyate | stutisaro
    nigaditah kim bhuyah shrotumicchasi || || iti kularnave durga dakaradi sahasranamastotram |
  devanagari: श्री देव्युवाच । मम नाम सहस्रं च शिव पूर्वविनिर्मितम् । तत्पठ्यतां विधानेन तथा सर्वं भविष्यति
    ॥ इत्युक्त्वा पार्वती देवि श्रावयामास तच्चतान् । तदेव नामसाहस्रं दकारादि वरानने ॥ रोगदारिद्र्यदौर्भाग्यशोकदुःखविनाशकम्
    । सर्वासां पूजितं नाम श्रीदुर्गादेवता मता ॥ निजबीजं भवेद्बीजं मन्त्रं कीलकमुच्यते । सर्वाशापूरणे देवी
    विनियोगः प्रकीर्तितः ॥ ॐ अस्य श्रीदकारादि दुर्गासहस्रनाम स्तोत्रस्य शिव ऋषिः अनुष्टुप्छन्दः श्रीदुर्गा
    देवता दुं बीजं दुं कीलकं दुःखदारिद्र्यरोगशोक निवृत्त्यर्थं पाठे विनियोगः । ध्यानम् विद्युद्दामसमप्रभां
    मृगपति स्कन्धस्थितां भीषणां कन्याभिः करवालखेटविलद्दस्ताभिरासेविताम् । हसैश्चक्रगदासिखेट विशिखांश्चापं
    गुणं तर्जनीं बिभ्राणामनलात्मिकां शशिधरां दुर्गां त्रिनेत्रां भजे ॥ स्तोत्रम् दुं दुर्गा दुर्गतिहरा
    दुर्गाचलनिवासिनी । दुर्गमार्गानुसञ्चारा दुर्गमार्गनिवासिनी ॥ ॥ दुर्गमार्गप्रविष्टा च दुर्गमार्गप्रवेशिनी
    । दुर्गमार्गकृतावासा दुर्गमार्गजयप्रिया ॥ ॥ दुर्गमार्गगृहीतार्चा दुर्गमार्गस्थितात्मिका । दुर्गमार्गस्तुतिपरा
    दुर्गमार्गस्मृतिः परा ॥ ॥ दुर्गमार्गसदास्थात्री दुर्गमार्गरतिप्रिया । दुर्गमार्गस्थलस्थाना दुर्गमार्गविलासिनी
    ॥ ॥ दुर्गमार्गत्यक्तवस्त्रा दुर्गमार्गप्रवर्तिनी । दुर्गासुरनिहन्त्री च दुर्गासुरनिषूदिनी ॥ ॥ दुर्गासुरहरा
    दूती दुर्गासुरविनाशिनी । दुर्गासुरवधोन्मत्ता दुर्गासुरवधोत्सुका ॥ ॥ दुर्गासुरवधोत्साहा दुर्गासुरवधोद्यता
    । दुर्गासुरवधप्रेप्सुः दुर्गासुरमुखान्तकृत् ॥ ॥ दुर्गासुरध्वंसतोषा दुर्गदानवदारिणी । दुर्गविद्रावणकरी
    दुर्गविद्रावणी सदा ॥ ॥ दुर्गविक्षोभणकरी दुर्गशीर्षनिकृन्तनी । दुर्गविध्वंसनकरी दुर्गदैत्यनिकृन्तनी
    ॥ ॥ दुर्गदैत्यप्राणहरा दुर्गदैत्यान्तकारिणी । दुर्गदैत्यहरत्राता दुर्गदैत्यासृगुन्मदा ॥ ॥ दुर्गदैत्याशनकरी
    दुर्गचर्माम्बरावृता । दुर्गयुद्धोत्सवकरी दुर्गयुद्धविशारदा ॥ ॥ दुर्गयुद्धासवरता दुर्गयुद्धविमर्दिनी
    । दुर्गयुद्धहास्यरता दुर्गयुद्धाट्टहासिनी ॥ ॥ दुर्गयुद्धमहामत्ता दुर्गयुद्धानुसारिणी । दुर्गयुद्धोत्सवोत्साहा
    दुर्गदेशनिषेविणी ॥ ॥ दुर्गदेशवासरता दुर्गदेशविलासिनी । दुर्गदेशार्चनरता दुर्गदेशजनप्रिया ॥ ॥ दुर्गमस्थानसंस्थाना
    दुर्गमध्यानुसाधना । दुर्गमा दुर्गमध्याना दुर्गमात्मस्वरूपिणी ॥ ॥ दुर्गमागमसन्धाना दुर्गमागमसंस्तुता
    । दुर्गमागमदुर्ज्ञेया दुर्गमश्रुतिसम्मता ॥ ॥ दुर्गमश्रुतिमान्या च दुर्गमश्रुतिपूजिता । दुर्गमश्रुतिसुप्रीता
    दुर्गमश्रुतिहर्षदा ॥ ॥ दुर्गमश्रुतिसंस्थाना दुर्गमश्रुतिमानिता । दुर्गमाचारसन्तुष्टा दुर्गमाचारतोषिता
    ॥ ॥ दुर्गमाचारनिर्वृत्ता दुर्गमाचारपूजिता । दुर्गमाचारकलिता दुर्गमस्थानदायिनी ॥ ॥ दुर्गमप्रेमनिरता
    दुर्गमद्रविणप्रदा । दुर्गमाम्बुजमध्यस्था दुर्गमाम्बुजवासिनी ॥ ॥ दुर्गनाडीमार्गगतिर्दुर्गनाडीप्रचारिणी
    । दुर्गनाडीपद्मरता दुर्गनाड्यम्बुजस्थिता ॥ ॥ दुर्गनाडीगतायाता दुर्गनाडीकृतास्पदा । दुर्गनाडीरतरता
    दुर्गनाडीशसंस्तुता ॥ ॥ दुर्गनाडीश्वररता दुर्गनाडीशचुम्बिता । दुर्गनाडीशक्रोडस्था दुर्गनाड्यत्थितोत्सुका
    ॥ ॥ दुर्गनाड्यारोहणा च दुर्गनाडीनिषेविता । दरिस्थाना दरिस्थानवासिनी दनुजान्तकृत् ॥ ॥ दरीकृततपस्या
    च दरीकृतहरार्चना । दरीजापितदिष्टा च दरीकृतरतिप्रिया ॥ ॥ दरीकृतहरार्हा च दरीक्रीडितपुत्रिका । दरीसन्दर्शनरता
    दरीरोपितवृश्चिका ॥ ॥ दरीगुप्तिकौतुकाढ्या दरीभ्रमणतत्परा । दनुजान्तकरी दीना दनुसन्तानदारिणी ॥ ॥ दनुजध्वंसिनी
    दूना दनुजेन्द्रविनाशिनी । दानवध्वंसिनी देवी दानवानां भयङ्करी ॥ ॥ दानवी दानवाराध्या दानवेन्द्रवरप्रदा
    । दानवेन्द्रनिहन्त्री च दानवद्वेषिणीसती ॥ ॥ दानवारिप्रेमरता दानवारिप्रपूजिता । दानवारिकृतार्चा च दानवारिविभूतिदा
    ॥ ॥ दानवारिमहानन्दा दानवारिरतिप्रिया । दानवारिदानरता दानवारिकृतास्पदा ॥ ॥ दानवारिस्तुतिरता दानवारिस्मृतिप्रिया
    । दानवार्याहाररता दानवारिप्रबोधिनी ॥ ॥ दानवारिधृतप्रेमा दुःखशोकविमोचनी । दुःखहन्त्री दुःखदात्री दुःखनिर्मूलकारिणी
    ॥ ॥ दुःखनिर्मूलनकरी दुःखदारिद्र्यनाशिनी । दुःखहरा दुःखनाशा दुःखग्रामा दुरासदा ॥ ॥ दुःखहीना दुःखदूरा
    द्रविणाचारदायिनी । द्रविणोत्सर्गसन्तुष्टा द्रविणत्यागतोषिता ॥ ॥ द्रविणस्पर्शसन्तुष्टा द्रविणस्पर्शमानदा
    । द्रविणस्पर्शहर्षाढ्या द्रविणस्पर्शतुष्टिदा ॥ ॥ द्रविणस्पर्शनकरी द्रविणस्पर्शनातुरा । द्रविणस्पर्शनोत्साहा
    द्रविणस्पर्शसाधिता ॥ ॥ द्रविणस्पर्शनमता द्रविणस्पर्शपुत्रिका । द्रविणस्पर्शरक्षिणी द्रविणस्तोमदायिनी
    ॥ ॥ द्रविणाकर्षणकरी द्रविणौघविसर्जनी । द्रविणाचलदानाढ्या द्रविणाचलवासिनी ॥ ॥ दीनमाता दीनबन्धुर्दीनविघ्नविनाशिनी
    । दीनसेव्या दीनसिद्धा दीनसाध्या दिगम्बरी ॥ ॥ दीनगेहकृतानन्दा दीनगेहविलासिनी । दीनभावप्रेमरता दीनभावविनोदिनी
    ॥ ॥ दीनमानवचेतःस्था दीनमानवहर्षदा । दीनदैन्यविघातेच्छुर्दीनद्रविणदायिनी ॥ ॥ दीनसाधनसन्तुष्टा दीनदर्शनदायिनी
    । दीनपुत्रादिदात्री च दीनसम्यग्विधायिनी ॥ ॥ दत्तात्रेयध्यानरता दत्तात्रेयप्रपूजिता । दत्तात्रेयर्षिसंसिद्धा
    दत्तात्रेयविभाविता ॥ ॥ दत्तात्रेयकृतार्हा च दत्तात्रेयप्रसादिता । दत्तात्रेयहर्षदात्री दत्तात्रेयसुखप्रदा
    ॥ ॥ दत्तात्रेयस्तुता चैव दत्तात्रेयनुतासदा । दत्तात्रेयप्रेमरता दत्तात्रेयानुमानिता ॥ ॥ दत्तात्रेयसमुद्गीता
    दत्तात्रेयकुटुम्बिनी । दत्तात्रेयप्राणतुल्या दत्तात्रेयशरीरिणी ॥ ॥ दत्तात्रेयकृतानन्दा दत्तात्रेयांशसम्भवा
    । दत्तात्रेयविभूतिस्था दत्तात्रेयानुसारिणी ॥ ॥ दत्तात्रेयगीतिरता दत्तात्रेयधनप्रदा । दत्तात्रेयदुःखहरा
    दत्तात्रेयवरप्रदा ॥ ॥ दत्तात्रेयज्ञानदात्री दत्तात्रेयभयापहा । देवकन्या देवमान्या देवदुःखविनाशिनी
    ॥ ॥ देवसिद्धा देवपूज्या देवेज्या देववन्दिता । देवमान्या देवधन्या देवविघ्नविनाशिनी ॥ ॥ देवरम्या देवरता
    देवकौतुकतत्परा । देवक्रीडा देवव्रीडा देववैरिविनाशिनी ॥ ॥ देवकामा देवरामा देवद्विषविनाशिनी । देवदेवप्रिया
    देवी देवदानववन्दिता ॥ ॥ देवदेवरतानन्दा देवदेववरोत्सुका । देवदेवप्रेमरता देवदेवप्रियंवदा ॥ ॥ देवदेवप्राणतुल्या
    देवदेवनितम्बिनी । देवदेवहृतमना देवदेवसुखावहा ॥ ॥ देवदेवक्रोडरता देवदेवसुखप्रदा । देवदेवमहानन्दा देवदेवप्रचुम्बिता
    ॥ ॥ देवदेवोपभुक्ता च देवदेवानुसेविता । देवदेवगतप्राणा देवदेवगतात्मिका ॥ ॥ देवदेवहर्षदात्री देवदेवसुखप्रदा
    । देवदेवमहानन्दा देवदेवविलासिनी ॥ ॥ देवदेवधर्मपत्नी देवदेवमनोगता । देवदेववधूर्देवी देवदेवार्चनप्रिया
    ॥ ॥ देवदेवाङ्गनिलया देवदेवाङ्गशायिनी । देवदेवाङ्गसुखिनी देवदेवाङ्गवासिनी ॥ ॥ देवदेवाङ्गभूषा च देवदेवाङ्गभूषणा
    । देवदेवप्रियकरी देवदेवाप्रियान्तकृत् ॥ ॥ देवदेवप्रियप्राणा देवदेवप्रियात्मिका । देवदेवार्चकप्राणा
    देवदेवार्चकप्रिया ॥ ॥ देवदेवार्चकोत्साहा देवदेवार्चकाश्रया । देवदेवार्चकाविघ्ना देवदेवप्रसूरपि ॥ ॥
    देवदेवस्य जननी देवदेवविधायिनी । देवदेवस्य रमणी देवदेवहृदाश्रया ॥ ॥ देवदेवेष्टदेवी च देवतापविपातिनी
    । देवताभावसन्तुष्टा देवताभावतोषिता ॥ ॥ देवताभाववरदा देवताभावसिद्धिदा । देवताभावसंसिद्धा देवताभावसम्भवा
    ॥ ॥ देवताभावसुखिनी देवताभाववन्दिता । देवताभावसुप्रीता देवताभावहर्षदा ॥ ॥ देवताविघ्नहन्त्री च देवताद्विषनाशिनी
    । देवतापूजितपदा देवताप्रेमतोषिता ॥ ॥ देवतागारनिलया देवतासौख्यदायिनी । देवतानिजभावा च देवताहृतमानसा
    ॥ ॥ देवताकृतपादार्चा देवताहृतभक्तिका । देवतागर्वमध्यस्था देवतादेवतातनुः ॥ दुर्गायै नमो नाम्नी दुं
    षण्मन्त्रस्वरूपिणी । दून्नमोमन्त्ररूपा च दून्नमोमूर्तिकात्मिका ॥ ॥ दूरदर्शिप्रिया दुष्टा दुष्टभूतनिषेविता
    । दूरदर्शिप्रेमरता दूरदर्शिप्रियंवदा ॥ ॥ दूरदर्शिसिद्धिदात्री दूरदर्शिप्रतोषिता । दूरदर्शिकण्ठसंस्था
    दूरदर्शिप्रहर्षिता ॥ ॥ दूरदर्शिगृहीतार्चा दूरदर्शिप्रतर्पिता । दूरदर्शिप्राणतुल्या दूरदर्शिसुखप्रदा
    ॥ ॥ दूरदर्शिभ्रान्तिहरा दूरदर्शिहृदास्पदा । दूरदर्श्यरिविद्भावा दीर्घदर्शिप्रमोदिनी ॥ ॥ दीर्घदर्शिप्राणतुल्या
    दीर्घदर्शिवरप्रदा । दीर्घदर्शिहर्षदात्री दीर्घदर्शिप्रहर्षिता ॥ ॥ दीर्घदर्शिमहानन्दा दीर्घदर्शिगृहालया
    । दीर्घदर्शिगृहीतार्चा दीर्घदर्शिहृतार्हणा ॥ ॥ दया दानवती दात्री दयालुर्दीनवत्सला । दयार्द्रा च दयाशीला
    दयाढ्या च दयात्मिका ॥ ॥ दयाम्बुधिर्दयासारा दयासागरपारगा । दयासिन्धुर्दयाभारा दयावत्करुणाकरी ॥ ॥ दयावद्वत्सलादेवी
    दयादानरतासदा । दयावद्भक्तिसुखिनी दयावत्परितोषिता ॥ ॥ दयावत्स्नेहनिरता दयावत्प्रतिपादिका । दयावत्प्राणकर्त्री
    च दयावन्मुक्तिदायिनी ॥ ॥ दयावद्भावसन्तुष्टा दयावत्परितोषिता । दयावत्तारणपरा दयावत्सिद्धिदायिनी ॥ ॥
    दयावत्पुत्रवद्भावा दयावत्पुत्ररूपिणी । दयावद्देहनिलया दयाबन्धुर्दयाश्रया ॥ ॥ दयालुवात्सल्यकरी दयालुसिद्धिदायिनी
    । दयालुशरणासक्ता दयालुर्देहमन्दिरा ॥ ॥ दयालुभक्तिभावस्था दयालुप्राणरूपिणी । दयालुसुखदा दम्भा दयालुप्रेमवर्षिणी
    ॥ ॥ दयालुवशगा दीर्घा दीर्घाङ्गी दीर्घलोचना । दीर्घनेत्रा दीर्घचक्षुर्दीर्घबाहुलतात्मिका ॥ ॥ दीर्घकेशी
    दीर्घमुखी दीर्घघोणा च दारुणा । दारुणासुरहन्त्री च दारुणासुरदारिणी ॥ ॥ दारुणाहवकर्त्री च दारुणाहवहर्षिता
    । दारुणाहवहोमाढ्या दारुणाचलनाशिनी ॥ ॥ दारुणाचारनिरता दारुणोत्सवहर्षिता । दारुणोद्यतरूपा च दारुणारिनिवारिणी
    ॥ ॥ दारुणेक्षणसंयुक्ता दोश्चतुष्कविराजिता । दशदोष्का दशभुजा दशबाहुविराजिता ॥ ॥ दशास्त्रधारिणी देवी
    दशदिक्ख्यातविक्रमा । दशरथार्चितपदा दाशरथिप्रिया सदा ॥ ॥ दाशरथिप्रेमतुष्टा दाशरथिरतिप्रिया । दाशरथिप्रियकरी
    दाशरथिप्रियंवदा ॥ ॥ दाशरथीष्टसन्दात्री दाशरथीष्टदेवता । दाशरथिद्वेषिनाशा दाशरथ्यानुकूल्यदा ॥ ॥ दाशरथिप्रियतमा
    दाशरथिप्रपूजिता । दशाननारिसम्पूज्या दशाननारिदेवता ॥ ॥ दशाननारिप्रमदा दशाननारिजन्मभूः । दशाननारिरतिदा
    दशाननारिसेविता ॥ ॥ दशाननारिसुखदा दशाननारिवैरिहृत् । दशाननारीष्टदेवी दशग्रीवारिवन्दिता ॥ ॥ दशग्रीवारिजननी
    दशग्रीवारिभाविनी । दशग्रीवारिसहिता दशग्रीवसभाजिता ॥ ॥ दशग्रीवारिरमणी दशग्रीववधूरपि । दशग्रीवनाशकर्त्री
    दशग्रीववरप्रदा ॥ ॥ दशग्रीवपुरस्था च दशग्रीववधोत्सुका । दशग्रीवप्रीतिदात्री दशग्रीवविनाशिनी ॥ ॥ दशग्रीवाहवकरी
    दशग्रीवानपायिनी । दशग्रीवप्रियावन्द्या दशग्रीवाहृता तथा ॥ ॥ दशग्रीवाहितकरी दशग्रीवेश्वरप्रिया । दशग्रीवेश्वरप्राणा
    दशग्रीववरप्रदा ॥ ॥ दशग्रीवेश्वररता दशवर्षीयकन्यका । दशवर्षीयबाला च दशवर्षीयवासिनी ॥ ॥ दशपापहरा दम्या
    दशहस्तविभूषिता । दशशस्त्रलसद्दोष्का दशदिक्पालवन्दिता ॥ ॥ दशावताररूपा च दशावताररूपिणी । दशविद्याभिन्नदेवी
    दशप्राणस्वरूपिणी ॥ ॥ दशविद्यास्वरूपा च दशविद्यामयी तथा । दृक्स्वरूपा दृक्प्रदात्री दृग्रूपा दृक्प्रकाशिनी
    ॥ ॥ दिगन्तरा दिगन्तस्था दिगम्बरविलासिनी । दिगम्बरसमाजस्था दिगम्बरप्रपूजिता ॥ ॥ दिगम्बरसहचरी दिगम्बरकृतास्पदा
    । दिगम्बरहृताचित्ता दिगम्बरकथाप्रिया ॥ ॥ दिगम्बरगुणरता दिगम्बरस्वरूपिणी । दिगम्बरशिरोधार्या दिगम्बरहृताश्रया
    ॥ ॥ दिगम्बरप्रेमरता दिगम्बररतातुरा । दिगम्बरीस्वरूपा च दिगम्बरीगणार्चिता ॥ ॥ दिगम्बरीगणप्राणा दिगम्बरीगणप्रिया
    । दिगम्बरीगणाराध्या दिगम्बरगणेश्वरा ॥ ॥ दिगम्बरगणस्पर्शामदिरापानविह्वला । दिगम्बरीकोटिवृता दिगम्बरीगणावृता
    ॥ ॥ दुरन्ता दुष्कृतिहरा दुर्ध्येया दुरतिक्रमा । दुरन्तदानवद्वेष्टी दुरन्तदनुजान्तकृत् ॥ ॥ दुरन्तपापहन्त्री
    च दस्रनिस्तारकारिणी । दस्रमानससंस्थाना दस्रज्ञानविवर्धिनी ॥ ॥ दस्रसम्भोगजननी दस्रसम्भोगदायिनी । दस्रसम्भोगभवना
    दस्रविद्याविधायिनी ॥ ॥ दस्रोद्वेगहरा दस्रजननी दस्रसुन्दरी । दस्रभक्तिविधाज्ञाना दस्रद्विषविनाशिनी
    ॥ ॥ दस्रापकारदमनी दस्रसिद्धिविधायिनी । दस्रताराराधिता च दस्रमातृप्रपूजिता ॥ ॥ दस्रदैन्यहरा चैव दस्रतातनिषेविता
    । दस्रपितृशतज्योतिर्दस्रकौशलदायिनी ॥ ॥ दशशीर्षारिसहिता दशशीर्षारिकामिनी । दशशीर्षपुरी देवी दशशीर्षसभाजिता
    ॥ ॥ दशशीर्षारिसुप्रीता दशशीर्षवधूप्रिया । दशशीर्षशिरश्छेत्री दशशीर्षनितम्बिनी ॥ ॥ दशशीर्षहरप्राणा
    दशशीर्षहरात्मिका । दशशीर्षहराराध्या दशशीर्षारिवन्दिता ॥ ॥ दशशीर्षारिसुखदा दशशीर्षकपालिनी । दशशीर्षज्ञानदात्री
    दशशीर्षारिदेहिनी ॥ ॥ दशशीर्षवधोपात्तश्रीरामचन्द्ररूपता । दशशीर्षराष्ट्रदेवी दशशीर्षारिसारिणी ॥ ॥ दशशीर्षभ्रातृतुष्टा
    दशशीर्षवधूप्रिया । दशशीर्षवधूप्राणा दशशीर्षवधूरता ॥ ॥ दैत्यगुरुरता साध्वी दैत्यगुरुप्रपूजिता । दैत्यगुरूपदेष्ट्री
    च दैत्यगुरुनिषेविता ॥ ॥ दैत्यगुरुगतप्राणा दैत्यगुरुतापनाशिनी । दुरन्तदुःखशमनी दुरन्तदमनीतमी ॥ ॥ दुरन्तशोकशमनी
    दुरन्तरोगनाशिनी । दुरन्तवैरिदमनी दुरन्तदैत्यनाशिनी ॥ ॥ दुरन्तकलुषघ्नी च दुष्कृतिस्तोमनाशिनी । दुराशया
    दुराधारा दुर्जया दुष्टकामिनी ॥ ॥ दर्शनीया च दृश्या च दृष्ट्वा च दृष्टिगोचरा । दूतीयागप्रिया दूती दूतीयागकरप्रिया
    ॥ ॥ दूतीयागकरानन्दा दूतीयागसुखप्रदा । दूतीयागकरायाता दूतीयागप्रमोदिनी ॥ ॥ दुर्वासःपूजिता चैव दुर्वासोमुनिभाविता
    । दुर्वासोऽर्चितपादा च दुर्वासोमुनिभाविता ॥ ॥ दुर्वासोमुनिवन्द्या च दुर्वासोमुनिदेवता । दुर्वासोमुनिमाता
    च दुर्वासोमुनिसिद्धिदा ॥ ॥ दुर्वासोमुनिभावस्था दुर्वासोमुनिसेविता । दुर्वासोमुनिचित्तस्था दुर्वासोमुनिमण्डिता
    ॥ ॥ दुर्वासोमुनिसञ्चारा दुर्वासोहृदयङ्गमा । दुर्वासोहृदयाराध्या दुर्वासोहृत्सरोजगा ॥ ॥ दुर्वासस्तापसाराध्या
    दुर्वासस्तापसाश्रया । दुर्वासस्तापसरता दुर्वासस्तापसेश्वरी ॥ ॥ दुर्वासोमुनिकन्या च दुर्वासोऽद्भुतसिद्धिदा
    । दररात्री दरहरा दरयुक्ता दरापहा ॥ ॥ दरघ्नी दरहन्त्री च दरयुक्ता दराश्रया । दरस्मेरा दरापाङ्गी दयादात्री
    दयाश्रया । दस्रपूज्या दस्रमाता दस्रदेवी दरोन्मदा ॥ ॥ दस्रसिद्धा दस्रसंस्था दस्रतापविमोचनी । दस्रक्षोभहरा
    नित्या दस्रलोकगतात्मिका ॥ ॥ दैत्यगुर्वङ्गनावन्द्या दैत्यगुर्वङ्गनाप्रिया । दैत्यगुर्वङ्गनासिद्धा दैत्यगुर्वङ्गनोत्सुका
    ॥ ॥ दैत्यगुरुप्रियतमा देवगुरुनिषेविता । देवगुरुप्रसूरूपा देवगुरुकृतार्हणा ॥ ॥ देवगुरुप्रेमयुता देवगुर्वनुमानिता
    । देवगुरुप्रभावज्ञा देवगुरुसुखप्रदा ॥ ॥ देवगुरुज्ञानदात्री देवगुरुप्रमोदिनी । दैत्यस्त्रीगणसम्पूज्या
    दैत्यस्त्रीगणपूजिता ॥ ॥ दैत्यस्त्रीगणरूपा च दैत्यस्त्रीचित्तहारिणी । देवस्त्रीगणपूज्या च देवस्त्रीगणवन्दिता
    ॥ ॥ देवस्त्रीगणचित्तस्था देवस्त्रीगणभूषिता । देवस्त्रीगणसंसिद्धा देवस्त्रीगणतोषिता ॥ ॥ देवस्त्रीगणहस्तस्थचारुचामरवीजिता
    । देवस्त्रीगणहस्तस्थचारुगन्धविलेपिता ॥ ॥ देवाङ्गनाधृतादर्शदृष्ट्यर्थमुखचन्द्रमा । देवाङ्गनोत्सृष्टनागवल्लीदलकृतोत्सुका
    ॥ ॥ देवस्त्रीगणहस्तस्थधूपाघ्राणविनोदिनी । देवस्त्रीगणहस्तस्थदीपमालाविलोकना ॥ ॥ देवनारीकरगतवासकासवपायिनी
    । देवनारीकङ्कतिकाकृतकेशनिमार्जना ॥ ॥ देवनारीसेव्यगात्रा देवनारीकृतोत्सुका । देवनारीविरचितपुष्पमालाविराजिता
    ॥ ॥ देवनारीविचित्राङ्गी देवस्त्रीदत्तभोजना । देवस्त्रीगणगीता च देवस्त्रीगीतसोत्सुका ॥ ॥ देवस्त्रीनृत्यसुखिनी
    देवस्त्रीनृत्यदर्शिनी । देवस्त्रीयोजितलसद्रत्नपादपदाम्बुजा ॥ ॥ देवस्त्रीगणविस्तीर्णचारुतल्पनिषेदुषी
    । देवनारीचारुकराकलिताङ्घ्र्यादिदेहिका ॥ ॥ देवनारीकरव्यग्रतालवृन्तमरुत्सका । देवनारीवेणुवीणानादसोत्कण्ठमानसा
    ॥ ॥ देवकोटिस्तुतिनुता देवकोटिकृतार्हणा । देवकोटिगीतगुणा देवकोटिकृतस्तुतिः ॥ ॥ दन्तदाष्ट्योद्वेगफला
    देवकोलाहलाकुला । द्वेषरागपरित्यक्ता द्वेषरागविवर्जिता ॥ ॥ दामपूज्या दामभूषा दामोदरविलासिनी । दामोदरप्रेमरता
    दामोदरभगिन्यपि ॥ ॥ दामोदरप्रसूर्दामोदरपत्नीपतिव्रता । दामोदराऽभिन्नदेहा दामोदररतिप्रिया ॥ ॥ दामोदराभिन्नतनुर्दामोदरकृतास्पदा
    । दामोदरकृतप्राणा दामोदरगतात्मिका ॥ ॥ दामोदरकौतुकाढ्या दामोदरकलाकला । दामोदरालिङ्गिताङ्गी दामोदरकुतूहला
    ॥ ॥ दामोदरकृताह्लादा दामोदरसुचुम्बिता । दामोदरसुताकृष्टा दामोदरसुखप्रदा ॥ ॥ दामोदरसहाढ्या च दामोदरसहायिनी
    । दामोदरगुणज्ञा च दामोदरवरप्रदा ॥ ॥ दामोदरानुकूला च दामोदरनितम्बिनी । दामोदरजलक्रीडाकुशला दर्शनप्रिया
    ॥ ॥ दामोदरजलक्रीडात्यक्तस्वजनसौहृदा । दामोदरलसद्रासकेलिकौतुकिनी तथा ॥ ॥ दामोदरभ्रातृका च दामोदरपरायणा
    । दामोदरधरा दामोदरवैरिविनाशिनी ॥ ॥ दामोदरोपजाया च दामोदरनिमन्त्रिता । दामोदरपराभूता दामोदरपराजिता
    ॥ ॥ दामोदरसमाक्रान्ता दामोदरहताशुभा । दामोदरोत्सवरता दामोदरोत्सवावहा ॥ ॥ दामोदरस्तन्यदात्री दामोदरगवेषिता
    । दमयन्तीसिद्धिदात्री दमयन्तीप्रसादिता ॥ ॥ दमयन्तीष्टदेवी च दमयन्तीस्वरूपिणी । दमयन्तीकृतार्चा च दमनर्षिविभाविता
    ॥ ॥ दमनर्षिप्राणतुल्या दमनर्षिस्वरूपिणी । दमनर्षिस्वरूपा च दम्भपूरितविग्रहा ॥ ॥ दम्भहन्त्री दम्भधात्री
    दम्भलोकविमोहिनी । दम्भशीला दम्भहरा दम्भवत्परिमर्दिनी ॥ ॥ दम्भरूपा दम्भकरी दम्भसन्तानधारिणी । दत्तमोक्षा
    दत्तधना दत्तारोग्या च दाम्भिका ॥ ॥ दत्तपुत्रा दत्तदारा दत्तहारा च दारिका । दत्तभोगा दत्तशोका दत्तहस्त्यादिवाहना
    ॥ ॥ दत्तमतिर्दत्तभार्या दत्तशास्त्रावबोधिका । दत्तपाना दत्तदाना दत्तदारिद्र्यनाशिनी ॥ ॥ दत्तसौधावनीवासा
    दत्तस्वर्गा च दासदा । दास्यतुष्टा दास्यहरा दासदासीशतप्रदा ॥ ॥ दाररूपा दारवासा दारवासिहृदास्पदा । दारवासिजनाराध्या
    दारवासिजनप्रिया ॥ ॥ दारवासिविनिर्णीता दारवासिसमर्चिता । दारवास्याहृतप्राणा दारवास्यारिनाशिनी ॥ ॥ दारवासिविघ्नहरा
    दारवासिविमुक्तिदा । दाराग्निरूपिणी दारा दारकार्यरिनाशिनी ॥ ॥ दम्पती दम्पतीष्टा च दम्पतीप्राणरूपिका
    । दम्पतीस्नेहनिरता दाम्पत्यसाधनप्रिया ॥ ॥ दाम्पत्यसुखसेवा च दाम्पत्यसुखदायिनी । दाम्पत्याचारनिरता
    दाम्पत्यामोदमोदिता ॥ ॥ दाम्पत्यामोदसुखिनी दाम्पत्याह्लादकारिणी । दम्पतीष्टपादपद्मा दाम्पत्यप्रेमरूपिणी
    ॥ ॥ दाम्पत्यभोगभवना दाडिमीफलभोजिनी । दाडिमीफलसन्तुष्टा दाडिमीफलमानसा ॥ ॥ दाडिमीवृक्षसंस्थाना दाडिमीवृक्षवासिनी
    । दाडिमीवृक्षरूपा च दाडिमीवनवासिनी ॥ ॥ दाडिमीफलसाम्योरुपयोधरहृदायुता । दक्षिणा दक्षिणारूपा दक्षिणारूपधारिणी
    ॥ ॥ दक्षकन्या दक्षपुत्री दक्षमाता च दक्षसूः । दक्षगोत्रा दक्षसुता दक्षयज्ञविनाशिनी ॥ ॥ दक्षयज्ञनाशकर्त्री
    दक्षयज्ञान्तकारिणी । दक्षप्रसूतिर्दक्षेज्या दक्षवंशैकपावनी ॥ ॥ दक्षात्मजा दक्षसूनुर्दक्षजा दक्षजातिका
    । दक्षजन्मा दक्षजनुर्दक्षदेहसमुद्भवा ॥ ॥ दक्षजनिर्दक्षयागध्वंसिनी दक्षकन्यका । दक्षिणाचारनिरता दक्षिणाचारतुष्टिदा
    ॥ ॥ दक्षिणाचारसंसिद्धा दक्षिणाचारभाविता । दक्षिणाचारसुखिनी दक्षिणाचारसाधिता ॥ ॥ दक्षिणाचारमोक्षाप्तिर्दक्षिणाचारवन्दिता
    । दक्षिणाचारशरणा दक्षिणाचारहर्षिता ॥ ॥ द्वारपालप्रिया द्वारवासिनी द्वारसंस्थिता । द्वाररूपा द्वारसंस्था
    द्वारदेशनिवासिनी ॥ ॥ द्वारकरी द्वारधात्री दोषमात्रविवर्जिता । दोषकरा दोषहरा दोषराशिविनाशिनी ॥ ॥ दोषाकरविभूषाढ्या
    दोषाकरकपालिनी । दोषाकरसहस्राभा दोषाकरसमानना ॥ ॥ दोषाकरमुखी दिव्या दोषाकरकराग्रजा । दोषाकरसमज्योतिर्दोषाकरसुशीतला
    ॥ ॥ दोषाकरश्रेणी दोषसदृशापाङ्गवीक्षणा । दोषाकरेष्टदेवी च दोषाकरनिषेविता ॥ ॥ दोषाकरप्राणरूपा दोषाकरमरीचिका
    । दोषाकरोल्लसत्फाला दोषाकरसुहर्षिणी ॥ ॥ दोषाकरशिरोभूषा दोषाकरवधूप्रिया । दोषाकरवधूप्राणा दोषाकरवधूर्मता
    ॥ ॥ दोषाकरवधूप्रीता दोषाकरवधूरपि । दोषापूज्या तथा दोषापूजिता दोषहारिणी ॥ ॥ दोषाजापमहानन्दा दोषाजपपरायणा
    । दोषापुरश्चाररता दोषापूजकपुत्रिका ॥ ॥ दोषापूजकवात्सल्यकारिणीजगदम्बिका । दोषापूजकवैरिघ्नी दोषापूजकविघ्नहृत्
    ॥ ॥ दोषापूजकसन्तुष्टा दोषापूजकमुक्तिदा । दमप्रसूनसम्पूज्या दमपुष्पप्रिया सदा ॥ ॥ दुर्योधनप्रपूज्या
    च दुश्शासनसमर्चिता । दण्डपाणिप्रिया दण्डपाणिमाता दयानिधिः ॥ ॥ दण्डपाणिसमाराध्या दण्डपाणिप्रपूजिता
    । दण्डपाणिगृहासक्ता दण्डपाणिप्रियंवदा ॥ ॥ दण्डपाणिप्रियतमा दण्डपाणिमनोहरा । दण्डपाणिहृतप्राणा दण्डपाणिसुसिद्धिदा
    ॥ ॥ दण्डपाणिपरामृष्टा दण्डपाणिप्रहर्षिता । दण्डपाणिविघ्नहरा दण्डपाणिशिरोधृता ॥ ॥ दण्डपाणिप्राप्तचर्चा
    दण्डपाण्युन्मुखी सदा । दण्डपाणिप्राप्तपदा दण्डपाणिपराङ्मुखी ॥ ॥ दण्डहस्ता दण्डपाणिर्दण्डबाहुर्दरान्तकृत्
    । दण्डदोष्का दण्डकरा दण्डचित्तकृतास्पदा ॥ ॥ दण्डिविद्या दण्डिमाता दण्डिखण्डकनाशिनी । दण्डिप्रिया दण्डिपूज्या
    दण्डिसन्तोषदायिनी ॥ ॥ दस्युपूजा दस्युरता दस्युद्रविणदायिनी । दस्युवर्गकृतार्हा च दस्युवर्गविनाशिनी
    ॥ ॥ दस्युनिर्नाशिनी दस्युकुलनिर्नाशिनी तथा । दस्युप्रियकरी दस्युनृत्यदर्शनतत्परा ॥ ॥ दुष्टदण्डकरी
    दुष्टवर्गविद्राविणी तथा । दुष्टवर्गनिग्रहार्हा दूषकप्राणनाशिनी ॥ ॥ दूषकोत्तापजननी दूषकारिष्टकारिणी
    । दूषकद्वेषणकरी दाहिका दहनात्मिका ॥ ॥ दारुकारिनिहन्त्री च दारुकेश्वरपूजिता । दारुकेश्वरमाता च दारुकेश्वरवन्दिता
    ॥ ॥ दर्भहस्ता दर्भयुता दर्भकर्मविवर्जिता । दर्भमयी दर्भतनुर्दर्भसर्वस्वरूपिणी ॥ ॥ दर्भकर्माचाररता
    दर्भहस्तकृतार्हणा । दर्भानुकूला दार्भर्या दर्वीपात्रानुदामिनी ॥ ॥ दमघोषप्रपूज्या च दमघोषवरप्रदा ।
    दमघोषसमाराध्या दावाग्निरूपिणी तथा ॥ ॥ दावाग्निरूपा दावाग्निनिर्नाशितमहाबला । दन्तदंष्ट्रासुरकला दन्तचर्चितहस्तिका
    ॥ ॥ दन्तदंष्ट्रस्यन्दना च दन्तनिर्नाशितासुरा । दधिपूज्या दधिप्रीता दधीचिवरदायिनी ॥ ॥ दधीचीष्टदेवता
    च दधीचिमोक्षदायिनी । दधीचिदैन्यहन्त्री च दधीचिदरधारिणी ॥ ॥ दधीचिभक्तिसुखिनी दधीचिमुनिसेविता । दधीचिज्ञानदात्री
    च दधीचिगुणदायिनी ॥ ॥ दधीचिकुलसम्भूषा दधीचिभुक्तिमुक्तिदा । दधीचिकुलदेवी च दधीचिकुलदेवता ॥ ॥ दधीचिकुलगम्या
    च दधीचिकुलपूजिता । दधीचिसुखदात्री च दधीचिदैन्यहारिणी ॥ ॥ दधीचिदुःखहन्त्री च दधीचिकुलसुन्दरी । दधीचिकुलसम्भूता
    दधीचिकुलपालिनी ॥ ॥ दधीचिदानगम्या च दधीचिदानमानिनी । दधीचिदानसन्तुष्टा दधीचिदानदेवता ॥ ॥ दधीचिजयसम्प्रीता
    दधीचिजपमानसा । दधीचिजपपूजाढ्या दधीचिजपमालिका ॥ ॥ दधीचिजपसन्तुष्टा दधीचिजपतोषिणी । दधीचितापसाराध्या
    दधीचिशुभदायिनी ॥ ॥ दूर्वा दूर्वादलश्यामा दूर्वादलसमद्युतिः । नाम्नां सहस्रं दुर्गाया दादीनामिति कीर्तितम्
    ॥ ॥ फलशृतिः यः पठेत्साधकाधीशः सर्वसिद्धिर्लभेत्तु सः । प्रातर्मध्याह्नकाले च सन्ध्यायां नियतः शुचिः
    ॥ ॥ तथाऽर्धरात्रसमये स महेश इवापरः । शक्तियुक्ता महारात्रौ महावीरः प्रपूजयेत् ॥ ॥ महादेवीं मकाराद्यैः
    पञ्चभिर्द्रव्य सत्तमैः । तत्पठेत् स्तुतिमिमां यः स च सिद्धिस्वरूपधृक् ॥ ॥ देवालये श्मशाने च गङ्गातीरे
    निजेगृहे । वाराङ्गनागृहे चैव श्रीगुरोः सन्निधानपि ॥ ॥ पर्वते प्रान्तरे घोरे स्तोत्रमेतत्सदा पठेत्
    । दुर्गानामसहस्रेण दुर्गां पश्यति चक्षुषा ॥ ॥ शतावर्तनमेतस्य पुरश्चरणमुच्यते । स्तुतिसारो निगदितः
    किं भूयः श्रोतुमिच्छसि ॥ ॥ इति कुलार्णवे दुर्गा दकारादि सहस्रनामस्तोत्रम् ।
