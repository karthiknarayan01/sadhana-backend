id: devaihkritam2shrilakshmistotram
category: stotram
name:
  english: devaihkritam2shrilakshmistotram
  devanagari: देवैःकृतं२श्रीलक्ष्मीस्तोत्रम्
content:
  english: ringe ca sundari || 82|| padmavati padmavane malati malativane | kundadanti kundavane sushila
    ketakivane || 83|| kadambamala tvam devi kadambakanane'pi ca | rajalakshmi rajagehe grihalakshmirgrihe
    grihe || 84|| ityuktava devatah sarve munayo manavastatha | rurudurnamravadanah shushkakanthoshthatalukah
    || 85|| iti lakshmistavam punyam sarvadevaih kritam shubham | yah pathetpratarutthaya sa vai sarvam
    labheddhruvam || 86|| abharyolabhate bharyam vinitam ca sutam satim | sushilam sundarim ramyamatisupriyavadinim
    || 87|| putrapautravatim shuddham kulajam komalam varam | aputro labhate putram vaishnavam cirajivinam
    || 88|| paramaishvaryayuktam ca vidyavantam yashasvinam | bhrashtarajyo labhedrajyam bhrashtashrirlabhate
    shriyam || 89|| hatabandhurlabhedbandhum dhanabhrashto dhanam labhet | kirtihino labhetkirtim pratishtham
    ca labheddhruvam || 90|| sarvamangaladam stotram shokasantapanashanam | harshanandakaram shashvaddharmamokshasuhritpradam
    || 91|| iti shribrahmavaivartapurane shrikrishnajanmakhande uttare shatpancashattamadhyayantargatam
    shrilakshmistotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: ृङ्गे च सुन्दरी ॥ ८२॥ पद्मावती पद्मवने मालती मालतीवने । कुन्ददन्ती कुन्दवने सुशीला केतकीवने
    ॥ ८३॥ कदम्बमाला त्वं देवी कदम्बकाननेऽपि च । राजलक्ष्मी राजगेहे गृहलक्ष्मीर्गृहे गृहे ॥ ८४॥ इत्युक्तवा
    देवताः सर्वे मुनयो मनवस्तथा । रुरुदुर्नम्रवदनाः शुष्ककण्ठोष्ठतालुकाः ॥ ८५॥ इति लक्ष्मीस्तवं पुण्यं
    सर्वदेवैः कृतं शुभम् । यः पठेत्प्रातरुत्थाय स वै सर्वं लभेद्ध्रुवम् ॥ ८६॥ अभार्योलभते भार्यां विनीतां
    च सुतां सतीम् । सुशीलां सुन्दरीं रम्यामतिसुप्रियवादिनीम् ॥ ८७॥ पुत्रपौत्रवतीं शुद्धां कुलजां कोमलां
    वराम् । अपुत्रो लभते पुत्रं वैष्णवं चिरजीविनम् ॥ ८८॥ परमैश्वर्ययुक्तं च विद्यावन्तं यशस्विनम् । भ्रष्टराज्यो
    लभेद्राज्यं भ्रष्टश्रीर्लभते श्रियम् ॥ ८९॥ हतबन्धुर्लभेद्बन्धुं धनभ्रष्टो धनं लभेत् । कीर्तिहीनो लभेत्कीर्तिं
    प्रतिष्ठां च लभेद्ध्रुवम् ॥ ९०॥ सर्वमङ्गलदं स्तोत्रं शोकसन्तापनाशनम् । हर्षानन्दकरं शश्वद्धर्ममोक्षसुहृत्प्रदम्
    ॥ ९१॥ इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे उत्तरे षट्पञ्चाशत्तमाध्यायान्तर्गतं श्रीलक्ष्मीस्तोत्रं
    समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
