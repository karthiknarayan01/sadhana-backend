id: shivasahasranamastotramskanda
category: sahasranama
name:
  english: shivasahasranamastotramskanda
  devanagari: शिवसहस्रनामस्तोत्रम्स्कन्द
content:
  english: sidhyarthe sarva adhi vyadhi nivrityarthe sahasranamajape viniyogah || narada uvaca | om shrishivah
    shivado bhavyo bhavagamyo vrishakapih | vrishadhvajo vrisharudho vrishaka vrisheshvarah || 7|| shivadhipah
    shitah shambhuh svayambhuratmavidvibhuh | sarvajnobahuhantacabhavanipatiracyutah || 8|| tantrashastrapramodi
    ca tantrashastrapradarshakah | tantrapriyastantragmayotantrovanantatantrakah || 9|| tantrinadapriyodevobhaktatantravimohitah
    | tantratmatantranilayastantradarshisutantrakah || 10|| mahadeva umakantashcandrashekhara ishvarah
    | dhurjjatistryambako dhurto dhurtashatruramavasuh || 11|| vamadevo mridah shambhuh suresho daityamardanah
    | andhakaraharo dando jyotishman harivallabhah || 12|| gangadharo ramakantah sarvanathah surariha
    | pracandadaityavidhvamsi jambharatirarindamah || 13|| danapriyo danado danatripto danavantakah |
    karidanapriyo dani danatma danapujitah || 14|| danagamyo yayatishca dayasindhurdayavahah | bhaktigamyo
    bhaktasevyo bhaktisantushtamanasah || 15|| bhaktabhayaprado bhakto bhaktabhishtapradayakah | bhanuman
    bhanunetrashca bhanuvrindasamaprabhah || 16|| sahasrabhanuh svarbhanuratmabhanurjayavahah | jayanto
    jayado yajno yajnatma yajnavijjayah || 17|| jayaseno jayatseno vijayo vijayapriyah | jajvalyamano
    jyayamshca jalatma jalajo javah || 18|| puratanah puraratistripuraghno ripughnakah | puranah purushah
    punyah punyagamyo'tipunyadah || 19|| prabhanjanah prabhu purnah purnadevah pratapavan | prabalo'tibalo
    devo vedavedyo janadhipah || 20|| naresho narado mani daityamanavimardanah | amano nirmamo manyo manavo
    madhusudanah || 21|| manuputro mayaratirmangalo mangalaspadah | malavo malayavaso mahobhih samyutonalah
    || 22|| nalaradhyo nilavasa nalatma nalapujitah | naladhisho naigamiko nigamena supujitah || 23||
    nigamavedyarupo hi dhanyo dhenuramitraha | kalpavrikshah kamadhenurdhanurdhari maheshvarah || 24||
    damano daminikanto damodara hareshvarah | damo danta dayavanshca danavesho danupriyah || 25|| danvishvaro
    dami danti danvaradhyo janupradah | anandakando mandarirmandarasumapujitah || 26|| nityanando mahanando
    ramanando nirashrayah | nirjaro nirjaraprito nirjareshvarapujitah || 27|| kailasavasi vishvatma vishvesho
    vishvatatparah | vishvambharo vishvasaho vishvarupo mahidharah || 28|| kedaranilayo bharta dharta
    harta harishvarah | vishnusevyo jishnunatho jishnuh krishno dharapatih || 29|| badarinayako neta ramabhakto
    ramapriyah | ramanatho ramasevyah shaibyapatirakalmashah || 30|| dharadhisho mahanetrastrinetrashcaruvikramah
    | trivikramo vikrameshastrilokeshastrayimayah || 31|| vedagamyo vedavadi vedatma vedavarddhanah |
    deveshvaro devapujyo vedantarthapracarakah || 32|| vedantavedyo vaishnavashca kavih kavyakaladharah
    | kalatma kalahritkalah kalatma kalasudanah || 33|| kelipriyah sukelishca kalankarahitah kramah |
    karmakarta sukarma ca karmeshah karmavarjitah || 34|| mimamsashastravetta yah sharvo mimamsakapriyah
    | prakritih purushah pancatattvajno jnaninam varah || 35|| sankhyashastrapramodi ca sankhyavanpanditah
    prabhuh | asankhyatagunagramo gunatma gunavarjitah || 36|| nirguno nirahankaro rasadhisho rasapriyah
    | rasasvadi rasavedyo niraso nirajapriyah || 37|| nirmalo niranukroshi nirdanto nirbhayapradah | gangakhyotoyam
    ca minadhvajavimardanah || 38|| andhakaribrihaddamshtro brihadashvo brihattanuh | brihaspatih suracaryo
    girvanaganapujitah || 39|| vasudevo mahabahurvirupaksho virupakah | pushno dantavinashi ca murarirbhaganetraha
    || 40|| vedavyaso nagahara vishaha vishanayakah | virajah sajalo'nanto vasukishcaparajitah || 41||
    balo vriddho yuva mrityurmutyuha bhalacandrakah | balabhadro balaratirdridhadhanvavrishadhvajah ||
    42|| pramathesho ganapatih kartikeyo vrikodarah | agnigarbho'gninabhashca padmanabhah prabhakarah
    || 43|| hiranyagarbho lokesho venunadah pratardanah | vayurbhago vasurbhargo dakshah pracetaso munih
    || 44|| nadabrahmarato nadi nandanavasa ambarah | ambarishombunilayo jamadagnyah paratparah || 45||
    kritaviryasuto raja kartaviryapramardanah | jamadagnirjatarupo jatarupaparicchadah || 46|| karpuragauro
    gaurisho gopatirgopanayakah | pranishvarah pramanajno prameyo'jnananashanah || 47|| hamso hamsagatirmino
    brahma lokapitamahah | yamunadhishvaro yamyo yamabhitivimardanah || 48|| narayano narapujyo vasuvarno
    vasupriyah | vasavo balaha vritrahanta yanta parakrami || 49|| brihadisho brihadbhanurvarddhano balavah
    parah | sharabho narasamhari kolashatrurvibhakarah || 50|| rathacakro dasharatho ramah shastrabhritam
    varah | naradiyo naranando nayakah pramathariha || 51|| rudro raudrau rudramukhyo raudratma romavarjitah
    | jalandharaharo havyo havirddhama brihaddhavih || 52|| ravih saptarciranagho dvadashatma divakarah
    | pradyotano dinapatih saptasaptirmariciman || 53|| somobjo glaushca ratrishah kujo jaivatriko budhah
    | shukro daityagururbhaumo bhimo bhimaparakramah || 54|| shanih pangurmadandho vai bhangabhakshanatatparah
    | rahuh ketuh saimhikeyo grahatmagrahapujitah || 55|| nakshatresho'shvininatho mainakanilayah shubhah
    | vindhyatavisamacchannah setubandhaniketanah || 56|| kurmaparvatavasi ca vagisho vagvidamvarah |
    yogeshvaro mahinathah patalabhuvaneshvarah || 57|| kashinatho nilakesho harikesho manoharah | umakanto
    yamaratirbauddhaparvatanayakah || 58|| tatasuranihanta ca sarvayajnasupujitah | gangadvaranivaso vai
    virabhadro bhayanakah || 59|| bhanudatto bhanunatho jarasandhavimardanah | yavamalishvarah paro gandakinilayo
    harah || 60|| shalagramashilavasi narmadatatapujitah | banalingo banapita banadhirbanapujitah || 61||
    banasuranihanta ca ramabano bhayapahah | ramaduto ramanatho ramanarayano'vyayah || 62|| parvatishah
    paramrishto narado narapujitah | parvateshah parvatiyah parvatipranavallabhah || 63|| sarveshvarah
    sarvakarta lokadhyaksho mahamatih | niralambo hathadhyaksho vananatho vanashrayah || 64|| shmashanavasi
    damano madanarirmadalayah | bhutavetalasarvasvah skandah skandajanirjanah || 65|| vetalashatanatho
    vai vetalashatapujitah | vetalo bhairavakaro vetalanilayo balah || 66|| bhurbhuvah svarvashatkaro
    bhutabhavyavibhurmahah | jano mahastapah satyam patalanilayo layah || 67|| patri pushpi phali toyi
    mahirupasamashritah | svadha svaha namaskaro bhadro bhadrapatirbhavah || 68|| umapatirvyomakesho bhimadhanva
    bhayanakah | pushtastushtodharadharo balido balibhridbali || 69|| onkaro nrimayo mayi vighnaharta
    ganadhipah | hrim hraum gamyo haum ju~ sah haum shivayanamo jvarah || 70|| dra~ dra~ rupo duradharsho
    nadabindvatmako'nilah | rastaro netranadashca candisho malayacalah || 71|| shadaksharamahamantrah
    shastrabhricchastranayakah | shastravetta tu shastrishah shastramantraprapujitah || 72|| nirvapuh
    suvapuh kantah kantajanamanoharah | bhagamali bhago bhagyo bhagaha bhagapujitah || 73|| bhagapujanasantushto
    mahabhagyasupujitah | pujarato vipapma ca kshitibijo dharoptikrit || 74|| mandalo mandalabhaso mandalarddho
    vimandalah | candramandalapujyo vai ravimandalamandirah || 75|| sarvamandalasarvasvah pujamandalamanditah
    | prithvimandalavasashca bhaktamandalapujitah || 76|| mandalatparasiddhishca mahamandalamandalah |
    mukhamandalashobhadhyo rajamandalavarjitah || 77|| nishprabhah prabhurishano mrigavyadho mrigariha
    | mrigankashobho hemadhyo himatma himasundarah || 78|| hemahemanidhirhemo himanisho himapriyah | shitavatasahah
    shito hyashitiganasevitah || 79|| ashashrayo digatma ca jivo jivashrayah patih | patitashi patih pantho
    nihpanthonarthanashakah || 80|| buddhido buddhinilayo buddho buddhapatirdhavah | medhakaro medhamano
    madhyo madhyo madhupriyah || 81|| madhuvyo madhumanbandhurdhandhumaro dhavashrayah | dharmi dharmapriyo
    dhanyo dhanyarashirdhanavahah || 82|| dharatmajo dhano dhanyo manyanatho madalasah | lambodaro lankarishnurlankanathasupujitah
    || 83|| lankabhasmapriyo lanko lankesharipupujitah | samudro makaravaso makarando madanvitah || 84||
    mathuranathako tandro mathuravasatatparah | vrindavanamanah pritirvrindapujitavigrahah || 85|| yamunapulinavasah
    kamsacanuramardanah | arishtaha shubhatanurmadhavo madhavagrajah || 86|| vasudevasutah krishnah krishnapriyatamah
    shucih | krishnadvaipayano vedhah srishtisamharakarakah || 87|| caturvidho vishvaharta dhata dharmaparayanah
    | yatudhano mahakayo rakshahkulavinashanah || 88|| ghantanado mahanado bherishabdaparayanah | parameshah
    paravijno jnanagamyo ganeshvarah || 89|| parshvamaulishcandramaulirdharmamaulih surariha | janghapratardano
    jambho jambharatirindamah || 90|| onkaragamyo nadeshah someshah siddhikaranam | akaro'mritakalpashca
    anando vrishabhadhvajah || 91|| atma ratishcatmagamyo yatharthatma narariha | ikarashcetikalashca
    iti hotiprabhanjanah || 92|| ishitaribhavo riksha rikaravarapujitah | livarnarupo likaro livarnastho
    liratmavan || 93||
  devanagari: सिध्यर्थे सर्व आधि व्याधि निवृत्यर्थे सहस्रनामजपे विनियोगः ॥ नारद उवाच । ॐ श्रीशिवः शिवदो
    भव्यो भावगम्यो वृषाकपिः । वृषध्वजो वृषारूढो वृषक वृषेश्वरः ॥ ७॥ शिवाधिपः शितः शम्भुः स्वयम्भूरात्मविद्विभुः
    । सर्वज्ञोबहुहन्ताचभवानीपतिरच्युतः ॥ ८॥ तन्त्रशास्त्रप्रमोदी च तन्त्रशास्त्रप्रदर्शकः । तन्त्रप्रियस्तन्त्रग्मयोतन्त्रोवानन्ततन्त्रकः
    ॥ ९॥ तन्त्रीनादप्रियोदेवोभक्ततन्त्रविमोहितः । तन्त्रात्मातन्त्रनिलयस्तन्त्रदर्शीसुतन्त्रकः ॥ १०॥ महादेव
    उमाकान्तश्चन्द्रशेखर ईश्वरः । धूर्ज्जटिस्त्र्यम्बको धूर्तो धूर्तशत्रुरमावसुः ॥ ११॥ वामदेवो मृडः शम्भुः
    सुरेशो दैत्यमर्दनः । अन्धकारहरो दण्डो ज्योतिष्मान् हरिवल्लभः ॥ १२॥ गङ्गाधरो रमाकान्तः सर्वनाथः सुरारिहा
    । प्रचण्डदैत्यविध्वंसी जम्भारातिररिन्दमः ॥ १३॥ दानप्रियो दानदो दानतृप्तो दानवान्तकः । करिदानप्रियो
    दानी दानात्मा दानपूजितः ॥ १४॥ दानगम्यो ययातिश्च दयासिन्धुर्दयावहः । भक्तिगम्यो भक्तसेव्यो भक्तिसन्तुष्टमानसः
    ॥ १५॥ भक्ताभयप्रदो भक्तो भक्ताभीष्टप्रदायकः । भानुमान् भानुनेत्रश्च भानुवृन्दसमप्रभः ॥ १६॥ सहस्रभानुः
    स्वर्भानुरात्मभानुर्जयावहः । जयन्तो जयदो यज्ञो यज्ञात्मा यज्ञविज्जयः ॥ १७॥ जयसेनो जयत्सेनो विजयो विजयप्रियः
    । जाज्वल्यमानो ज्यायांश्च जलात्मा जलजो जवः ॥ १८॥ पुरातनः पुरारातिस्त्रिपुरघ्नो रिपुघ्नकः । पुराणः
    पुरुषः पुण्यः पुण्यगम्योऽतिपुण्यदः ॥ १९॥ प्रभञ्जनः प्रभु पूर्णः पूर्णदेवः प्रतापवान् । प्रबलोऽतिबलो
    देवो वेदवेद्यो जनाधिपः ॥ २०॥ नरेशो नारदो मानी दैत्यमानविमर्दनः । अमानो निर्ममो मान्यो मानवो मधुसूदनः
    ॥ २१॥ मनुपुत्रो मयारातिर्मङ्गलो मङ्गलास्पदः । मालवो मलयावासो महोभिः संयुतोनलः ॥ २२॥ नलाराध्यो नीलवासा
    नलात्मा नलपूजितः । नलाधीशो नैगमिको निगमेन सुपूजितः ॥ २३॥ निगमावेद्यरूपो हि धन्यो धेनुरमित्रहा । कल्पवृक्षः
    कामधेनुर्धनुर्धारी महेश्वरः ॥ २४॥ दामनो दामिनीकान्तो दामोदर हरेश्वरः । दमो दान्ता दयावान्श्च दानवेशो
    दनुप्रियः ॥ २५॥ दन्वीश्वरो दमी दन्ती दन्वाराध्यो जनुप्रदः । आनन्दकन्दो मन्दारिर्मन्दारसुमपूजितः ॥
    २६॥ नित्यानन्दो महानन्दो रमानन्दो निराश्रयः । निर्जरो निर्जरप्रीतो निर्जरेश्वरपूजितः ॥ २७॥ कैलासवासी
    विश्वात्मा विश्वेशो विश्वतत्परः । विश्वम्भरो विश्वसहो विश्वरूपो महीधरः ॥ २८॥ केदारनिलयो भर्ता धर्ता
    हर्ता हरीश्वरः । विष्णुसेव्यो जिष्णुनाथो जिष्णुः कृष्णो धरापतिः ॥ २९॥ बदरीनायको नेता रामभक्तो रमाप्रियः
    । रमानाथो रामसेव्यः शैब्यापतिरकल्मषः ॥ ३०॥ धराधीशो महानेत्रस्त्रिनेत्रश्चारुविक्रमः । त्रिविक्रमो
    विक्रमेशस्त्रिलोकेशस्त्रयीमयः ॥ ३१॥ वेदगम्यो वेदवादी वेदात्मा वेदवर्द्धनः । देवेश्वरो देवपूज्यो वेदान्तार्थप्रचारकः
    ॥ ३२॥ वेदान्तवेद्यो वैष्णवश्च कविः काव्यकलाधरः । कालात्मा कालहृत्कालः कलात्मा कालसूदनः ॥ ३३॥ केलीप्रियः
    सुकेलिश्च कलङ्करहितः क्रमः । कर्मकर्ता सुकर्मा च कर्मेशः कर्मवर्जितः ॥ ३४॥ मीमांसाशास्त्रवेत्ता यः
    शर्वो मीमांसकप्रियः । प्रकृतिः पुरुषः पञ्चतत्त्वज्ञो ज्ञानिनां वरः ॥ ३५॥ साङ्ख्यशास्त्रप्रमोदी च सङ्ख्यावान्पण्डितः
    प्रभुः । असङ्ख्यातगुणग्रामो गुणात्मा गुणवर्जितः ॥ ३६॥ निर्गुणो निरहङ्कारो रसाधीशो रसप्रियः । रसास्वादी
    रसावेद्यो नीरसो नीरजप्रियः ॥ ३७॥ निर्मलो निरनुक्रोशी निर्दन्तो निर्भयप्रदः । गङ्गाख्योतोयं च मीनध्वजविमर्दनः
    ॥ ३८॥ अन्धकारिबृहद्दंष्ट्रो बृहदश्वो बृहत्तनुः । बृहस्पतिः सुराचार्यो गीर्वाणगणपूजितः ॥ ३९॥ वासुदेवो
    महाबाहुर्विरूपाक्षो विरूपकः । पूष्णो दन्तविनाशी च मुरारिर्भगनेत्रहा ॥ ४०॥ वेदव्यासो नागहारा विषहा
    विषनायकः । विरजाः सजलोऽनन्तो वासुकिश्चापराजितः ॥ ४१॥ बालो वृद्धो युवा मृत्युर्मुत्युहा भालचन्द्रकः
    । बलभद्रो बलारातिर्दृढधन्वावृषध्वजः ॥ ४२॥ प्रमथेशो गणपतिः कार्तिकेयो वृकोदरः । अग्निगर्भोऽग्निनाभश्च
    पद्मनाभः प्रभाकरः ॥ ४३॥ हिरण्यगर्भो लोकेशो वेणुनादः प्रतर्दनः । वायुर्भगो वसुर्भर्गो दक्षः प्राचेतसो
    मुनिः ॥ ४४॥ नादब्रह्मरतो नादी नन्दनावास अम्बरः । अम्बरीषोम्बुनिलयो जामदग्न्यः परात्परः ॥ ४५॥ कृतवीर्यसुतो
    राजा कार्तवीर्यप्रमर्दनः । जमदग्निर्जातरूपो जातरूपपरिच्छदः ॥ ४६॥ कर्पूरगौरो गौरीशो गोपतिर्गोपनायकः
    । प्राणीश्वरः प्रमाणज्ञो प्रमेयोऽज्ञाननाशनः ॥ ४७॥ हंसो हंसगतिर्मीनो ब्रह्मा लोकपितामहः । यमुनाधीश्वरो
    याम्यो यमभीतिविमर्दनः ॥ ४८॥ नारायणो नारपूज्यो वसुवर्णो वसुप्रियः । वासवो बलहा वृत्रहन्ता यन्ता पराक्रमी
    ॥ ४९॥ बृहदीशो बृहद्भानुर्वर्द्धनो बालवः परः । शरभो नरसंहारी कोलशत्रुर्विभाकरः ॥ ५०॥ रथचक्रो दशरथो
    रामः शस्त्रभृतां वरः । नारदीयो नरानन्दो नायकः प्रमथारिहा ॥ ५१॥ रुद्रो रौद्रौ रुद्रमुख्यो रौद्रात्मा
    रोमवर्जितः । जलन्धरहरो हव्यो हविर्द्धामा बृहद्धविः ॥ ५२॥ रविः सप्तार्चिरनघो द्वादशात्मा दिवाकरः ।
    प्रद्योतनो दिनपतिः सप्तसप्तिर्मरीचिमान् ॥ ५३॥ सोमोब्जो ग्लौश्च रात्रीशः कुजो जैवात्रिको बुधः । शुक्रो
    दैत्यगुरुर्भौमो भीमो भीमपराक्रमः ॥ ५४॥ शनिः पङ्गुर्मदान्धो वै भङ्गाभक्षणतत्परः । राहुः केतुः सैंहिकेयो
    ग्रहात्माग्रहपूजितः ॥ ५५॥ नक्षत्रेशोऽश्विनीनाथो मैनाकनिलयः शुभः । विन्ध्याटवीसमाच्छन्नः सेतुबन्धनिकेतनः
    ॥ ५६॥ कूर्मपर्वतवासी च वागीशो वाग्विदाम्वरः । योगेश्वरो महीनाथः पातालभुवनेश्वरः ॥ ५७॥ काशिनाथो नीलकेशो
    हरिकेशो मनोहरः । उमाकान्तो यमारातिर्बौद्धपर्वतनायकः ॥ ५८॥ तटासुरनिहन्ता च सर्वयज्ञसुपूजितः । गङ्गाद्वारनिवासो
    वै वीरभद्रो भयानकः ॥ ५९॥ भानुदत्तो भानुनाथो जरासन्धविमर्दनः । यवमालीश्वरः पारो गण्डकीनिलयो हरः ॥ ६०॥
    शालग्रामशिलावासी नर्मदातटपूजितः । बाणलिङ्गो बाणपिता बाणधिर्बाणपूजितः ॥ ६१॥ बाणासुरनिहन्ता च रामबाणो
    भयापहः । रामदूतो रामनाथो रामनारायणोऽव्ययः ॥ ६२॥ पार्वतीशः परामृष्टो नारदो नारपूजितः । पर्वतेशः पार्वतीयः
    पार्वतीप्राणवल्लभः ॥ ६३॥ सर्वेश्वरः सर्वकर्ता लोकाध्यक्षो महामतिः । निरालम्बो हठाध्यक्षो वननाथो वनाश्रयः
    ॥ ६४॥ श्मशानवासी दमनो मदनारिर्मदालयः । भूतवेतालसर्वस्वः स्कन्दः स्कन्दजनिर्जनः ॥ ६५॥ वेतालशतनाथो वै
    वेतालशतपूजितः । वेतालो भैरवाकारो वेतालनिलयो बलः ॥ ६६॥ भूर्भुवः स्वर्वषट्कारो भूतभव्यविभुर्महः । जनो
    महस्तपः सत्यं पातालनिलयो लयः ॥ ६७॥ पत्री पुष्पी फली तोयी महीरूपसमाश्रितः । स्वधा स्वाहा नमस्कारो भद्रो
    भद्रपतिर्भवः ॥ ६८॥ उमापतिर्व्योमकेशो भीमधन्वा भयानकः । पुष्टस्तुष्टोधराधारो बलिदो बलिभृद्बली ॥ ६९॥
    ओङ्कारो नृमयो मायी विघ्नहर्ता गणाधिपः । ह्रीं ह्रौं गम्यो हौं जूँ सः हौं शिवायनमो ज्वरः ॥ ७०॥ द्राँ
    द्राँ रूपो दुराधर्षो नादबिन्द्वात्मकोऽनिलः । रस्तारो नेत्रनादश्च चण्डीशो मलयाचलः ॥ ७१॥ षडक्षरमहामन्त्रः
    शस्त्रभृच्छस्त्रनायकः । शास्त्रवेत्ता तु शास्त्रीशः शस्त्रमन्त्रप्रपूजितः ॥ ७२॥ निर्वपुः सुवपुः कान्तः
    कान्ताजनमनोहरः । भगमाली भगो भाग्यो भगहा भगपूजितः ॥ ७३॥ भगपूजनसन्तुष्टो महाभाग्यसुपूजितः । पूजारतो
    विपाप्मा च क्षितिबीजो धरोप्तिकृत् ॥ ७४॥ मण्डलो मण्डलाभासो मण्डलार्द्धो विमण्डलः । चन्द्रमण्डलपूज्यो
    वै रविमण्डलमन्दिरः ॥ ७५॥ सर्वमण्डलसर्वस्वः पूजामण्डलमण्डितः । पृथ्वीमण्डलवासश्च भक्तमण्डलपूजितः ॥
    ७६॥ मण्डलात्परसिद्धिश्च महामण्डलमण्डलः । मुखमण्डलशोभाढ्यो राजमण्डलवर्जितः ॥ ७७॥ निष्प्रभः प्रभुरीशानो
    मृगव्याधो मृगारिहा । मृगाङ्कशोभो हेमाढ्यो हिमात्मा हिमसुन्दरः ॥ ७८॥ हेमहेमनिधिर्हेमो हिमानीशो हिमप्रियः
    । शीतवातसहः शीतो ह्यशीतिगणसेवितः ॥ ७९॥ आशाश्रयो दिगात्मा च जीवो जीवाश्रयः पतिः । पतिताशी पतिः पान्थो
    निःपान्थोनर्थनाशकः ॥ ८०॥ बुद्धिदो बुद्धिनिलयो बुद्धो बुद्धपतिर्धवः । मेधाकरो मेधमानो मध्यो मध्यो मधुप्रियः
    ॥ ८१॥ मधुव्यो मधुमान्बन्धुर्धन्धुमारो धवाश्रयः । धर्मी धर्मप्रियो धन्यो धान्यराशिर्धनावहः ॥ ८२॥ धरात्मजो
    धनो धान्यो मान्यनाथो मदालसः । लम्बोदरो लङ्करिष्णुर्लङ्कानाथसुपूजितः ॥ ८३॥ लङ्काभस्मप्रियो लङ्को लङ्केशरिपुपूजितः
    । समुद्रो मकरावासो मकरन्दो मदान्वितः ॥ ८४॥ मथुरानाथको तन्द्रो मथुरावासतत्परः । वृन्दावनमनः प्रीतिर्वृन्दापूजितविग्रहः
    ॥ ८५॥ यमुनापुलिनावासः कंसचाणूरमर्दनः । अरिष्टहा शुभतनुर्माधवो माधवाग्रजः ॥ ८६॥ वसुदेवसुतः कृष्णः कृष्णाप्रियतमः
    शुचिः । कृष्णद्वैपायनो वेधाः सृष्टिसंहारकारकः ॥ ८७॥ चतुर्विधो विश्वहर्ता धाता धर्मपरायणः । यातुधानो
    महाकायो रक्षःकुलविनाशनः ॥ ८८॥ घण्टानादो महानादो भेरीशब्दपरायणः । परमेशः पराविज्ञो ज्ञानगम्यो गणेश्वरः
    ॥ ८९॥ पार्श्वमौलिश्चन्द्रमौलिर्धर्ममौलिः सुरारिहा । जङ्घाप्रतर्दनो जम्भो जम्भारातिरिन्दमः ॥ ९०॥ ओङ्कारगम्यो
    नादेशः सोमेशः सिद्धिकारणम् । अकारोऽमृतकल्पश्च आनन्दो वृषभध्वजः ॥ ९१॥ आत्मा रतिश्चात्मगम्यो यथार्थात्मा
    नरारिहा । इकारश्चेतिकालश्च इति होतिप्रभञ्जनः ॥ ९२॥ ईशितारिभवो ऋक्ष ऋकारवरपूजितः । ऌवर्णरूपो ऌकारो
    ऌवर्णस्थो ऌरात्मवान् ॥ ९३॥
