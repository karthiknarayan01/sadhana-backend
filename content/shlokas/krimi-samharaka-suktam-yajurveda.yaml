id: krimi-samharaka-suktam-yajurveda
category: stotram
name:
  english: Krimi Samharaka Suktam (Yajurveda)
content:
  english: atrina tva krime hanmi | kanvena jamadagnina | vishvavasorbrahmana hatah | kriminagm raja |
    apyeshag sthapatir kshudrah | atho krishna atho shvetah | atho ashatika hatah | shvetabhissaha sarve
    hatah || aharavadya | shritasya havisho yatha | tatsatyam | yadamum ya~masya jambhayoh | adadhami
    tatha hi tat | khanphanmrasi ||
  devanagari: अत्रि॑णा त्वा क्रिमे हन्मि । कण्वे॑न ज॒मद॑ग्निना । वि॒श्वाव॑सो॒र्ब्रह्म॑णा ह॒तः । क्रिमी॑णा॒ग्ं॒
    राजा । अप्ये॑षाग् स्थ॒पति॑र् क्षु॒द्राः । अथो॑ कृ॒ष्णा अथो श्वे॒ताः । अथो॑ आ॒शाति॑का ह॒ताः । श्वे॒ताभि॑स्स॒ह
    सर्वे॑ ह॒ताः ॥ आह॒राव॑द्य । शृ॒तस्य॑ ह॒विषो॒ यथा । तत्स॒त्यम् । यद॒मुं यँ॒मस्य॒ जम्भ॑योः । आद॑धामि॒
    तथा॒ हि तत् । खण्फण्म्रसि॑ ॥
