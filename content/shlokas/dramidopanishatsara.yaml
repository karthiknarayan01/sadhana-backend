id: dramidopanishatsara
category: upanishad
name:
  english: dramidopanishatsara
  devanagari: द्रमिडोपनिषत्सार
content:
  english: dramidopanishatsarah shrih | shri vedantacaryaih anugrihitah dramidopanishatsarah shriman venkatanatharyah
    kavitarkikakesari | vedantacaryavaryo me sannidhattam sada hridi || sevayogyo'tibhogyah shubhasubhagatanuh
    sarvabhogyatishayi shreyastaddhetudata prapadanasulabho'nishtavidhvamsashilah | bhaktacchandanavarti
    nirupadhikasuhrit satpadavyam sahayah shriman sarvocitayamupanishadi mishatyesha gathashatairnah ||
    1|| adye pashyannupayam prabhumiha paramaprapyabhutam dvitiye kalyanodaramurterdvitayamidamiti prekshamanastritiye
    | aishvaryadeshcaturye vishamadhutulaya'nanyabhogyatvamicchan shadbhih svam pancamadyairanitaragatitatamacacakshe
    munindrah || 2|| param nirvaishamyam sulabhamaparadhaprasahanam sushilam svaradham sarasabhajanam
    svarjavagunam | susatmyasvanandapradamanaghavishrananaparam mukundam nidhyayan muniradhijagavadyashatake
    || 3|| dvikabhyam dvyashtanghrirduradhigamanitisthaputita yadantya mimamsa shrutishikharatattvam vyavrinuta
    | tadadau gathabhirmuniradhikavimshabhibhiriha nah kriti saragraham vyataradiha samgrihya kripaya
    || 4|| paratvadyairittham paricaranasakto gunaganaih prabhum sevayogyam prathamashatake vikshya varadam
    | tameva svatyarthapriyamatha ca bhoktum vyavasitau vareshkavam tasya prathamavaraniyam prathayati
    || 5|| chitiye'tikleshakshanavirahamuttungalalita bhilatsarvarupadam vyasanashamanam svaptimuditam
    | svavaimukhyatrastam svajanasuhridam muktirasadam svakaikrinaryoddeshyam subhagasavidhastham niranishat
    || 6|| upayatvaikantam prathamamiha sevyatvamuditam tatashca prapyatvaupayikamatibhogyatvamavadat
    | dvayam tatsvasadharanatanuvishitrasya ganayan tritiye vishvesham shubhasubhagarupam kathayati ||
    7|| anidrikyaundaryam tanuvihitasarshadisubham svasevarthakaram pragunavapusham mohanatanum | apashyallabhyarcavibhavamatidasyavalkam
    sada drishyam stutyakri|teadhaviruddhakritishiha || 8|| shriya kanto'nantah shumalanuvishishtah phalamasau
    phalavaptahetuh svayapriti ca nirdharya shatakaih | idanim ghuddhisthakramata iha yukdhraya munivarah
    phalatvam tasyaiva dradhayati tadanyeshu vimukhah || 9|| stiyaiphuvayam turye rajnahajavahabhobhya
    niravishat mithasshlincham kleshavahasahinutuvya nijajanam | kritarthikurvantam pranayibhishajam sadvadakaguna
    khyaheyasvopekshya svamataphalamuncaisyavavagatam || 10|| upayatvam yattat prathamashatake'bhavyata
    vibhoh ananyopayastat dradhayati param pancamanukhaih | nirihastatradau niracadhikanirhetukadaya
  devanagari: द्रमिडोपनिषत्सारः श्रीः । श्री वेदान्ताचार्यैः अनुगृहीतः द्रमिडोपनिषत्सारः श्रीमान् वेङ्कटनाथार्यः
    कवितार्किककेसरी । वेदान्ताचार्यवर्यो मे सन्निधत्तां सदा हृदि ॥ सेवायोग्योऽतिभोग्यः शुभसुभगतनुः सर्वभोग्यातिशायी
    श्रेयस्तद्धेतुदाता प्रपदनसुलभोऽनिष्टविध्वंसशीलः । भक्तच्छन्दानवर्ती निरुपधिकसुहृत् सत्पदव्यां सहायः
    श्रीमान् सर्वोचितायामुपनिषदि मिषत्येष गाथाशतैर्नः ॥ १॥ आद्ये पश्यन्नुपायं प्रभुमिह परमप्राप्यभूतं
    द्वितीये कल्याणोदारमूर्तेर्द्वितयमिदमिति प्रेक्षमाणस्तृतीये । ऐश्वर्यादेश्चतुर्ये विषमधुतुलयाऽनन्यभोग्यत्वमिच्छन्
    षड्भिः स्वां पञ्चमाद्यैरनितरगतिततामाचचक्षे मुनीन्द्रः ॥ २॥ परं निर्वैषम्यं सुलभमपराधप्रसहनं सुशीलं
    स्वाराधं सरसभजनं स्वार्जवगुणम् । सुसात्म्यस्वानन्दप्रदमनघविश्राणनपरं मुकुन्दं निध्यायन् मुनिरधिजगावाद्यशतके
    ॥ ३॥ द्विकाभ्यां द्व्यष्टाङ्घ्रिर्दुरधिगमनीतिस्थपुटिता यदन्त्या मीमांसा श्रुतिशिखरतत्त्वं व्यवृणुत
    । तदादौ गाथाभिर्मुनिरधिकविंशाभिभिरिह नः कृती सारग्राहं व्यतरदिह संगृह्य कृपया ॥ ४॥ परत्वाद्यैरित्थं
    परिचरणसक्तो गुणगणैः प्रभुं सेवायोग्यं प्रथमशतके वीक्ष्य वरदम् । तमेव स्वात्यर्थप्रियमथ च भोक्तुं व्यवसितौ
    वरेष्कवं तस्य प्रथमवरणीयं प्रथयति ॥ ५॥ छितीयेऽतिक्लेशक्षणविरहमुत्तुङ्गललित भिलत्सर्वारूपादं व्यसनशमनं
    स्वाप्तिमुदितम् । स्ववैमुख्यत्रस्तं स्वजनसुहृदं मुक्तिरसदं स्वकैकृनर्योद्देश्यं सुभगसविधस्थं निरनिशत्
    ॥ ६॥ उपायत्वैकान्तं प्रथममिह सेव्यत्वमुदितं ततश्च प्राप्यत्वौपयिकमतिभोग्यत्वमवदत् । द्वयं तत्स्वासाधारणतनुविशित्रस्य
    गणयन् तृतीये विश्वेशं शुभसुभगरूपं कथयति ॥ ७॥ अनीदृक्यौन्दर्यं तनुविहितसर्शादिसुभं स्वसेवार्थाकारं
    प्रगुणवपुषं मोहनतनुम् । अपश्यल्लभ्यार्चाविभवमतिदास्यावल्कं सदा दृश्यं स्तुत्याकृ।तेअधविरुद्धाकृतिशिह
    ॥ ८॥ श्रिया कान्तोऽनन्तः शुमलनुविशिष्टः फलमसौ फलावाप्तहेतुः स्वयप्रिति च निर्धार्य शतकैः । इदानीं
    घुद्धिस्थक्रमत इह युक्ढ्रया मुनिवरः फलत्वं तस्यैव द्रढयति तदन्येषु विमुखः ॥ ९॥ स्तियैफुवयं तुर्ये
    रज्ञहजवहभोभ्य निरविशत् मिथस्श्लिञ्छं क्लेशावहसहिनुतुव्य निजजनम् । कृतार्थीकुर्वन्तं प्रणयिभिषजं सद्वदकगुण
    ख्यहेयस्वोपेक्ष्य स्वमतफलमुञ्चैस्यववगतम् ॥ १०॥ उपायत्वं यत्तत् प्रथमशतकेऽभाव्यत विभोः अनन्योपायस्तत्
    द्रढयति परं पञ्चमनुखैः । निरीहस्तत्रादौ निरचधिकनिर्हेतुकदया
