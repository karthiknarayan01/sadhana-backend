id: sri-shiridi-sai-chalisa
category: stotram
name:
  english: Sri Shiridi Sai Chalisa
content:
  english: shiridivasa sayiprabho jagatiki mulam nive prabho datta digambara avataram nilo srishti vyavaharam
    || trimurtirupa o sayi karuninci kapadoyi darshanamiyya garavayya muktiki margam cupumaya || || shiridivasa
    sayiprabho || kaphini vastramu dhariyinci bhujamuku joli tagilinci nimba vrikshapu chayalo phakiru
    veshapu dharanalo kaliyugamanduna vèlasitivi tyagam sahanam nerpitivi shiridi gramam ni vasam bhaktula
    madilo ni rupam || || shiridivasa sayiprabho || cand patil nu kalusukuni atani badhalu tèlusukuni
    gurramu jada tèlipitivi patil badhanu tircitivi vèligincavu jyotulanu nivupayoginci jalamulanu accèruvòndènu
    a gramam cusi vintaina a drishyam || || shiridivasa sayiprabho || bayija cesènu ni seva pratiphalamiccavo
    deva ni ayuvunu badulicci tatyanu nivu bratikinci pashupakshulanu preminci premato vatini lalinci
    jivulapaina mamakaram citramaya ni vyavaharam || || shiridivasa sayiprabho || ni dvaramulo nilicitini
    ninne nityamu kòlicitini abhayamunicci brovumaya o shiridisha dayamaya dhanyamu dvaraka o mayi nilo
    nilicènu shrisayi ni dhuni mantala vedimiki papamu povunu takidiki || || shiridivasa sayiprabho ||
    pralaya kalamu apitivi bhaktulanu nivu brocitivi cesi mahammari nasham kapadi shiridi gramam agnihotri
    shastriki lila mahatmyam cupinci shyamanu bratikincitivi pamu vishamu tòliginci || || shiridivasa
    sayiprabho || bhakta bhimajiki kshayarogam nashiyince atani sahanam udi vaidyam cesavu vyadhini mayam
    cesavu kakajiki o sayi vithala darshana miccitivi damukicci santanam kaligincitivi santosham || ||
    shiridivasa sayiprabho || karunasindhu karunincu mapai karuna kuripincu sarvam nike arpitamu pèncumu
    bhakti bhavamunu muslim anukòni ninu meghu tèlusukuni atani badha dalci shivashankara rupam iccavayya
    darshanamu || || shiridivasa sayiprabho || daktaruku nivu ramuniga balvantaku shridattuniga nimonukaraku
    marutiga cidambaraku shriganapatiga martandaku khandobaga ganuku satyadevuniga narasimhasvamiga joshiki
    darshanamu niccina shrisayi || || shiridivasa sayiprabho || reyi pagalu ni dhyanam nityam ni lila
    pathanam bhaktito ceyandi dhyanam labhincunu muktiki margam padakòndu ni vacanalu baba makavi vedalu
    sharanani vaccina bhaktulanu karuninci nivu brocitivi || || shiridivasa sayiprabho || andarilona ni
    rupam ni mahima ati shaktimayam o sayi memu mudhulamu òsagumaya maku jnanamunu srishtiki nivenaya
    mulam sayi memu sevakulam sayi namamu talacèdamu nityamu sayini kòlicèdamu || || shiridivasa sayiprabho
    || bhakti bhavana tèlusukòni sayini madilo nilupukòni cittamuto sayi dhyanam ceyandi pratinityam baba
    kalcina dhuni udi nivarincunu adi vyadhi samadhi nundi shrisayi bhaktulanu kapadenoyi || || shiridivasa
    sayiprabho || mana prashnalaku javabulu tèlupunu sayi caritamulu vinandi leka cadavandi sayi satyamu
    cudandi satsangamunu ceyandi sayi svapnamu pòndandi bheda bhavamunu manandi sayi mana sadguruvandi
    || || shiridivasa sayiprabho || vandanamayya paramesha apadbandhava sayisha ma papamulu kadatercu
    ma madi korika nèravercu karunamurti o sayi karunato mamu daricercoyi ma manase ni mandiramu ma palukule
    niku naivedyam || || shiridivasa sayiprabho || akhilandakoti brahmandanayaka rajadhiraja yogiraja
    parabrahma shrisaccidananda sadguru sayinath maharaj ki jai ||
  devanagari: शिरिडीवासा सायिप्रभो जगतिकि मूलं नीवे प्रभो दत्त दिगम्बर अवतारं नीलो सृष्टि व्यवहारम् ॥
    त्रिमूर्तिरूपा ओ सायी करुणिञ्चि कापाडोयि दर्शनमिय्य गरावय्य मुक्तिकि मार्गं चूपुमया ॥ ॥ शिरिडीवासा
    सायिप्रभो ॥ कफिनि वस्त्रमु धरियिञ्चि भुजमुकु जोली तगिलिञ्चि निम्ब वृक्षपु छायलो फकीरु वेषपु धारणलो
    कलियुगमन्दुन वॆलसितिवि त्यागं सहनं नेर्पितिवि शिरिडी ग्रामं नी वासं भक्तुल मदिलो नी रूपम् ॥ ॥ शिरिडीवासा
    सायिप्रभो ॥ चान्द् पाटिल् नु कलुसुकुनि आतनि बाधलु तॆलुसुकुनि गुर्रमु जाड तॆलिपितिवि पाटिल् बाधनु तीर्चितिवि
    वॆलिगिञ्चावु ज्योतुलनु नीवुपयोगिञ्चि जलमुलनु अच्चॆरुवॊन्दॆनु आ ग्रामं चूसि विन्तैन आ दृश्यम् ॥ ॥ शिरिडीवासा
    सायिप्रभो ॥ बायिजा चेसॆनु नी सेव प्रतिफलमिच्चावो देवा नी आयुवुनु बदुलिच्चि तात्यानु नीवु ब्रतिकिञ्चि
    पशुपक्षुलनु प्रेमिञ्चि प्रेमतो वाटिनि लालिञ्चि जीवुलपैन ममकारं चित्रमया नी व्यवहारम् ॥ ॥ शिरिडीवासा
    सायिप्रभो ॥ नी द्वारमुलो निलिचितिनि निन्ने नित्यमु कॊलिचितिनि अभयमुनिच्चि ब्रोवुमया ओ शिरिडीशा दयामया
    धन्यमु द्वारक ओ मायी नीलो निलिचॆनु श्रीसायि नी धुनि मण्टल वेडिमिकि पापमु पोवुनु ताकिडिकि ॥ ॥ शिरिडीवासा
    सायिप्रभो ॥ प्रलय कालमु आपितिवि भक्तुलनु नीवु ब्रोचितिवि चेसि महम्मारी नाशं कापाडि शिरिडी ग्रामं अग्निहोत्रि
    शास्त्रिकि लीला महात्म्यं चूपिञ्चि श्यामानु ब्रतिकिञ्चितिवि पामु विषमु तॊलिगिञ्चि ॥ ॥ शिरिडीवासा सायिप्रभो
    ॥ भक्त भीमाजीकि क्षयरोगं नशियिञ्चे आतनि सहनं ऊदी वैद्यं चेसावु व्याधिनि मायं चेसावु काकाजीकि ओ सायि
    विठल दर्शन मिच्चितिवि दामूकिच्चि सन्तानं कलिगिञ्चितिवि सन्तोषम् ॥ ॥ शिरिडीवासा सायिप्रभो ॥ करुणासिन्धू
    करुणिञ्चु मापै करुण कुरिपिञ्चु सर्वं नीके अर्पितमु पॆञ्चुमु भक्ति भावमुनु मुस्लिं अनुकॊनि निनु मेघू
    तॆलुसुकुनि आतनि बाध दाल्चि शिवशङ्कर रूपं इच्चावय्या दर्शनमु ॥ ॥ शिरिडीवासा सायिप्रभो ॥ डाक्टरुकु नीवु
    रामुनिगा बल्वन्तकु श्रीदत्तुनिगा निमोनुकरकु मारुतिगा चिदम्बरकु श्रीगणपतिगा मार्ताण्डकु खण्डोबागा गणूकु
    सत्यदेवुनिगा नरसिंहस्वामिगा जोषिकि दर्शनमु निच्चिन श्रीसायि ॥ ॥ शिरिडीवासा सायिप्रभो ॥ रेयि पगलु नी
    ध्यानं नित्यं नी लीला पठनं भक्तितो चेयण्डि ध्यानं लभिञ्चुनु मुक्तिकि मार्गं पदकॊण्डु नी वचनालु बाबा
    माकवि वेदालु शरणनि वच्चिन भक्तुलनु करुणिञ्चि नीवु ब्रोचितिवि ॥ ॥ शिरिडीवासा सायिप्रभो ॥ अन्दरिलोन
    नी रूपं नी महिम अति शक्तिमयं ओ सायि मेमु मूढुलमु ऒसगुमया माकु ज्ञानमुनु सृष्टिकि नीवेनय मूलं सायि
    मेमु सेवकुलं सायि नाममु तलचॆदमु नित्यमु सायिनि कॊलिचॆदमु ॥ ॥ शिरिडीवासा सायिप्रभो ॥ भक्ति भावन तॆलुसुकॊनि
    सायिनि मदिलो निलुपुकॊनि चित्तमुतो सायी ध्यानं चेयण्डि प्रतिनित्यं बाबा काल्चिन धुनि ऊदि निवारिञ्चुनु
    अदि व्याधि समाधि नुण्डि श्रीसायि भक्तुलनु कापाडेनोयि ॥ ॥ शिरिडीवासा सायिप्रभो ॥ मन प्रश्नलकु जवाबुलु
    तॆलुपुनु सायि चरितमुलु विनण्डि लेक चदवण्डि सायि सत्यमु चूडण्डि सत्सङ्गमुनु चेयण्डि सायि स्वप्नमु पॊन्दण्डि
    भेद भावमुनु मानण्डि सायि मन सद्गुरुवण्डि ॥ ॥ शिरिडीवासा सायिप्रभो ॥ वन्दनमय्या परमेशा आपद्बान्धव सायीशा
    मा पापमुलू कडतेर्चु मा मदि कोरिक नॆरवेर्चु करुणामूर्ति ओ सायि करुणतो ममु दरिचेर्चोयी मा मनसे नी मन्दिरमु
    मा पलुकुले नीकु नैवेद्यम् ॥ ॥ शिरिडीवासा सायिप्रभो ॥ अखिलाण्डकोटि ब्रह्माण्डनायक राजाधिराज योगिराज
    परब्रह्म श्रीसच्चिदानन्द सद्गुरु सायिनाथ् महराज् की जै ॥
