id: annamayya-keerthanas-enta-matramuna
category: stotram
name:
  english: Annamayya Keerthanas Enta Matramuna
content:
  english: ènta matramuna èvvaru talacina antamatrame nivu antarantaramulènci cuda pindante nippati annatlu
    || kòluturu mimu vaishnavulu kurimito vishnudani palukuduru mimu vedantulu parabrahmambanucu | talaturu
    mimu shaivulu tagina bhaktulunu shivudanucu alari pògaduduru kapalikulu adi bhairavudanucu | sari
    mimmuduru sakteyulu shakti rupu nivanucu darishanamulu mimu nana vidhulanu talupula kòladula bhajinturu
    | sirula mimune alpabuddi talacinavariki alpambagudavu darimala mimune ghanamani talacina ghanabuddhulaku
    ghanudavu || nivalana kòrate ledu mari niru kòladi tamaravu avala bhagiradhi dari vagula a jalame
    urinayatlu | shri venkatapati nivaite mamu cekòni vunna daiva mani ivalane ni sharanani èdanu idiye
    paratatvamu naku ||
  devanagari: ऎन्त मात्रमुन ऎव्वरु तलचिन अन्तमात्रमे नीवु अन्तरान्तरमुलॆञ्चि चूड पिण्डन्ते निप्पटि अन्नट्लु
    ॥ कॊलुतुरु मिमु वैष्णवुलु कूरिमितो विष्णुडनि पलुकुदुरु मिमु वेदान्तुलु परब्रह्मम्बनुचु । तलतुरु मिमु
    शैवुलु तगिन भक्तुलुनू शिवुडनुचु अलरि पॊगडुदुरु कापालिकुलु आदि भैरवुडनुचु । सरि मिम्मुदुरु साक्तेयुलु
    शक्ति रूपु नीवनुचु दरिशनमुलु मिमु नाना विधुलनु तलुपुल कॊलदुल भजिन्तुरु । सिरुल मिमुने अल्पबुद्दि तलचिनवारिकि
    अल्पम्बगुदवु दरिमल मिमुने घनमनि तलचिन घनबुद्धुलकु घनुडवु ॥ नीवलन कॊरते लेदु मरि नीरु कॊलदि तामरवु
    आवल भागीरधि दरि वागुल आ जलमे ऊरिनयट्लु । श्री वेङ्कटपति नीवैते ममु चेकॊनि वुन्न दैव मनि ईवलने नी शरणनि
    ऎदनु इदिये परतत्वमु नाकु ॥
