    धियो यो नः प्रचोदयात् । ॐ श्रीनारायणस्य चरणौ शरणं प्रपद्ये । श्रीमते नारायणाय नमः । उग्रं वीरं महाविष्णुं
    ज्वलन्तं सर्वतोमुखम् । नृसिंहं भीषणं भद्रं मृत्युमृत्युं नमाम्यहम् ॥ ॐ ऐं ह्रीं श्रीं दुं हुं फट्
    कनकवज्रवैडूर्यमुक्तालङ्कृतभूषणे एह्येहि आगच्छागच्छ मम कर्णे प्रविश्य प्रविश्य भूतभविष्यद्वर्तमानकालज्ञानदूरदृष्टिदूरस्थश्रवणं
    ब्रूहि ब्रूहि । अग्निस्तम्भनं शत्रुमुखस्तम्भनं शत्रुबुद्धिस्तम्भनं शत्रुगतिस्तम्भनं परेषां गतिमतिवाग्जिह्वास्त्त्रभनं
    कुरु कुरु । शत्रुकार्यं हन हन । मम कार्यं साधय साधय । शत्रूणामुद्योगविध्वंसनं कुरु कुरु । वीरचामुण्डि
    असिकण्टकधारिणि नगरपुरीपट्टणराजधानीसम्मोहिनि असाध्यसाधनि ॐ ह्रीं श्रीं देवि हन हन हुं फट् स्वाहा ।
    ॐ अमरदुर्गे आं ह्रां सौं ऐं क्लीं हुं सौः ग्लौं श्रीं क्रों एह्येहि भ्रमराम्ब सकलजगन्मोहिनि सकलाण्डजपिण्डजान्
    भ्रामय भ्रामय । राजप्रजावशङ्करि सम्मोहय सम्मोहय । महामाये अष्टादशषीठरूपिणि अमलवरयूं स्फुर स्फुर ।
    प्रस्फुर प्रस्फुर । कोटिसूर्यप्रभाभासुरे चन्द्रजटे मां रक्ष रक्ष । मम शत्रून् भस्मीकुरु भस्मीकुरु
    । विश्वमोहिनि हुं फट् स्वाहा । ॐ नमो भगवते रुद्राय नमः । ॐ नमो भगवते रुद्राय । शिरो रक्षतु वाराही
    चैन्द्री रक्षेद्भुजद्वयम् । चामुण्डा हृदयं रक्षेत् कुक्षिं रक्षतु वारुणी ॥ वैष्णवी पादमाश्रित्य पृष्ठदेशे
    धनुर्धरा । यथा ग्रामे तथा क्षेत्रे रक्षेन्मां च पदे पदे ॥ सर्वमङ्गलमाङ्गल्ये शिवे सर्वार्थसाधिके ।
    शरण्ये त्र्यम्बके गौरि नारायणि नमोऽस्तु ते ॥ ब्राह्मि माहेश्वरि कौमारि वैष्णवि वाराहि इन्द्राणि चामुण्डे
    सिद्धिचामुण्डे क्षेत्रमालिके नारसिंहि महालक्ष्मि सर्वतो दुर्गे हुं फट् स्वाहा । भगवन् सर्वविजय सहस्रारापराजित
    । शरणं त्वां प्रपन्नोऽस्मि श्रीकरं श्रीसुदर्शनम् ॥ अरुणी वारुणी रक्षेत् सर्वग्रहनिवारणी । सर्वदारिद्र्यशमनी
    सर्वराजवशङ्करी ॥ सर्वकर्मकारिणि ॐ भूः स्वाहा । ॐ भुवः स्वाहा । ॐ स्वः स्वाहा । ॐ भूर्भुवः स्वः स्वाहा
    । ॐ आं ह्रीं क्रोम् । फट् फट् जहि महाकृत्ये विधूमाग्निसमप्रभे । हन शत्रूंस्त्रिशूलेन क्रुद्धास्ये
    पिब शोणितम् ॥ देवि देवि महादेवि ह्रीं मम शत्रून् विनाशय विनाशय । अहं न जाने न च पार्वतीशः । अष्टौ
    ब्राह्मणान् ग्राहयित्वा ततो महाविद्या सिध्यति । अशिक्षिताय नोपयच्छेत् । एकविंशतिवाराणि परिजप्य शुचिर्भवेत्
    । पत्रं पुष्पं फलं दद्यात् स्त्रियो वा पुरुषस्य वा । अवश्यं वशमित्याहुरात्मना च परेण वा ॥ महाविद्यावतां
    पुंसां मनःक्षोभं करोति यः । सप्तरात्रौ व्यतीतायां स च शत्रुर्विनश्यति ॥ कुबेरं ते मुखं रौद्रं नन्दिमानन्दमावह
    । ज्वरं य घोरं द्विषं नाशय नाशय ॥ ॐ नमो भगवतेऽमृतवर्षाय रुद्राय हृदयेऽमृताभिवर्षणाय । मम ज्वरदाहशान्तिं
    कुरु कुरु स्वाहा । ॐ हौं जूं सः मां पालय पालय सः जूं हौं ॐ । ॐ नमो भगवते । भो भोः सुदर्शन दुष्टं दारय
    दारय । दुरितं हन हन । पापं मथ मथ । आरोग्यं कुरु कुरु । द्विषन्तं हन हन । ठः ठः सहस्रार हुं फट् । भस्मायुधाय
    विद्महे तीक्ष्णदंष्ट्राय धीमहि । तन्नो ज्वरः प्रचोदयात् । समुद्रस्योत्तरे तीरे द्विविदो नाम वानरः
    । चातुर्थिकं ज्वरं हन्ति लिखित्वा यस्तु पश्यति ॥ यस्ते मन्योरिति च चतुर्दशर्चस्य सूक्तस्य रुद्रो दुर्वासास्तपनपुत्रो
    मन्युर्देवता । अपनिलयन्तामिति बीजम् । संसृष्टमिति शक्तिः । शत्रुं क्षपयेति कीलकम् । मम शत्रुक्षयार्थे
    जपे विनियोगः । अथ ध्यानम्
