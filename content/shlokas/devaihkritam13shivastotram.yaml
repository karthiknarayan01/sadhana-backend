id: devaihkritam13shivastotram
category: stotram
name:
  english: devaihkritam13shivastotram
  devanagari: देवैःकृतं१३शिवस्तोत्रम्
content:
  english: 20|| sarveshvaram bhavadhyaksham satyam shivamanuttamam | kotibhaskarasankasham tvam namami
    ca sarvatah || 21|| vishvadevamanadyantam shattrimshatkamanishvaram | pravartakam ca sarvesham tvam
    namami ca sarvatah || 22|| pravartakam ca prakritessarvasya prapitamaham | sarvavigrahamisham hi tvam
    namami ca sarvatah || 23|| evam vadanti varadam sarvavasam svayambhuvam | shrutayah shrutisarajnam
    shrutisaravidashca ye || 24|| adrishyamasmabhiranekabhutam tvaya kritam yadbhavatatha loke | tvameva
    devasurabhusurashca anye ca vai sthavarajangamashca || 25|| pahyananyagatin shambho suranno devavallabha
    | nashtaprayamstripurato vinihatyasurankshanat || 26|| mayaya mohitaste'dya bhavatah parameshvara
    | vishnuna proktayuktya ta ujjhita dharmatah prabho || 27|| santyaktasarvadharmamshca boddhagamasamashritah
    | asmadbhagyavashajjata daityaste bhaktavatsala || 28|| sada tvam karyakarttasi devanam sharanaprada
    | vayam te sharanapanna yathecchasi tatha kuru || 29|| iti shivapurane rudrasamhitayam yuddhakhande
    shashthadhyayantargatam devaih kritam shivastotram samaptam | shivapurana | rudrasamhita | yuddhakhanda
    | adhyaya 6
  devanagari: २०॥ सर्वेश्वरं भवाध्यक्षं सत्यं शिवमनुत्तमम् । कोटिभास्करसङ्काशं त्वां नमामि च सर्वतः ॥
    २१॥ विश्वदेवमनाद्यन्तं षट्त्रिंशत्कमनीश्वरम् । प्रवर्तकं च सर्वेषां त्वां नमामि च सर्वतः ॥ २२॥ प्रवर्तकं
    च प्रकृतेस्सर्वस्य प्रपितामहम् । सर्वविग्रहमीशं हि त्वां नमामि च सर्वतः ॥ २३॥ एवं वदन्ति वरदं सर्वावासं
    स्वयम्भुवम् । श्रुतयः श्रुतिसारज्ञं श्रुतिसारविदश्च ये ॥ २४॥ अदृश्यमस्माभिरनेकभूतं त्वया कृतं यद्भवताथ
    लोके । त्वामेव देवासुरभूसुराश्च अन्ये च वै स्थावरजङ्गमाश्च ॥ २५॥ पाह्यनन्यगतीन् शम्भो सुरान्नो देववल्लभ
    । नष्टप्रायांस्त्रिपुरतो विनिहत्यासुरान्क्षणात् ॥ २६॥ मायया मोहितास्तेऽद्य भवतः परमेश्वर । विष्णुना
    प्रोक्तयुक्त्या त उज्झिता धर्मतः प्रभो ॥ २७॥ सन्त्यक्तसर्वधर्मांश्च बोद्धागमसमाश्रिताः । अस्मद्भाग्यवशाज्जाता
    दैत्यास्ते भक्तवत्सल ॥ २८॥ सदा त्वं कार्यकर्त्तासि देवानां शरणप्रद । वयं ते शरणापन्ना यथेच्छसि तथा
    कुरु ॥ २९॥ इति शिवपुराणे रुद्रसंहितायां युद्धखण्डे षष्ठाध्यायान्तर्गतं देवैः कृतं शिवस्तोत्रं समाप्तम्
    । शिवपुराण । रुद्रसंहिता । युद्धखण्ड । अध्याय ६
