id: jaiminiproktamvishnustotram
category: stotram
name:
  english: jaiminiproktamvishnustotram
  devanagari: जैमिनिप्रोक्तंविष्णुस्तोत्रम्
content:
  english: 10|| trinvikramankramitva yo hatva daityabalam mahat | trailokyam palayamasa trivikrama namo'stu
    te || 11|| kritva vamanakam rupamrigyajuhsamagarbhakam | mohayitvadbhutam rupam tasmai mayavine namah
    || 12|| yah shriyam dharayennityam hridi bhaktebhya eva ca | dadatyapi shriyam tasmai shridharaya
    namo'stu te || 13|| indriyanamadhishthata yah sarvesham sada prabhuh | sukhaikaheturbhaktanam hrishikesha
    namo'stu te || 14|| yannabhipadmasambhutam jagadetaccaracaram | vidhaturasanam nityam padmanabha namo'stu
    te || 15|| yasyaitattrigunairbaddham jagadetaccaracaram | damna baddhah sa gopya tu damodara namo'stu
    te || 16|| trailokyaviplavakaram hatavankeshidanavam | ishita sarvasaukhyanam trahi keshava mam prabho
    || 17|| srashta sasarja bhutani jagatamadikaranam | acintyamahimanvishno narayana namo'stu te || 18||
    mayaya yasya vishvam vai mohitam yadanadyaya | sarvadharmasvarupaya madhavaya namo namah || 19|| jnaninam
    jnanagamyastvamagatinam gatipradah | sampurnamastu govinda tvatprasadadvratam mama || 2
  devanagari: १०॥ त्रीन्विक्रमान्क्रमित्वा यो हत्वा दैत्यबलं महत् । त्रैलोक्यं पालयामास त्रिविक्रम नमोऽस्तु
    ते ॥ ११॥ कृत्वा वामनकं रूपमृग्यजुःसामगर्भकम् । मोहयित्वाद्भुतं रूपं तस्मै मायाविने नमः ॥ १२॥ यः श्रियं
    धारयेन्नित्यं हृदि भक्तेभ्य एव च । ददात्यपि श्रियं तस्मै श्रीधराय नमोऽस्तु ते ॥ १३॥ इन्द्रियाणामधिष्ठाता
    यः सर्वेषां सदा प्रभुः । सुखैकहेतुर्भक्तानां हृषीकेश नमोऽस्तु ते ॥ १४॥ यन्नाभिपद्मसम्भूतं जगदेतच्चराचरम्
    । विधातुरासनं नित्यं पद्मनाभ नमोऽस्तु ते ॥ १५॥ यस्यैतत्त्रिगुणैर्बद्धं जगदेतच्चराचरम् । दाम्ना बद्धः
    स गोप्या तु दामोदर नमोऽस्तु ते ॥ १६॥ त्रैलोक्यविप्लवकरं हतवान्केशिदानवम् । ईशिता सर्वसौख्यानां त्राहि
    केशव मां प्रभो ॥ १७॥ स्रष्टा ससर्ज भूतानि जगतामादिकारणम् । अचिन्त्यमहिमन्विष्णो नारायण नमोऽस्तु ते
    ॥ १८॥ मायया यस्य विश्वं वै मोहितं यदनाद्यया । सर्वधर्मस्वरूपाय माधवाय नमो नमः ॥ १९॥ ज्ञानिनां ज्ञानगम्यस्त्वमगतीनां
    गतिप्रदः । सम्पूर्णमस्तु गोविन्द त्वत्प्रसादाद्व्रतं मम ॥ २
