id: sree-mallikarjuna-mangalasasanam
category: stotram
name:
  english: Sree Mallikarjuna Mangalasasanam
content:
  english: umakantaya kantaya kamitartha pradayine shrigirishaya devaya mallinathaya mangalam || sarvamangala
    rupaya shri nagendra nivasine gangadharaya nathaya shrigirishaya mangalam || satyananda svarupaya
    nityananda vidhayane stutyaya shrutigamyaya shrigirishaya mangalam || muktipradaya mukhyaya bhaktanugrahakarine
    sundareshaya saumyaya shrigirishaya mangalam || shrishaile shikhareshvaram ganapatim shri hatakesham
    punassarangeshvara bindutirthamamalam ghantarka siddheshvaram | gangam shri bhramarambikam girisutamaramavireshvaram
    shankhancakra varahatirthamanisham shrishailanatham bhaje || hastekurangam girimadhyarangam shringaritangam
    girijanushangam murdendugangam madananga bhangam shrishailalingam shirasa namami ||
  devanagari: उमाकान्ताय कान्ताय कामितार्थ प्रदायिने श्रीगिरीशाय देवाय मल्लिनाथाय मङ्गलम् ॥ सर्वमङ्गल
    रूपाय श्री नगेन्द्र निवासिने गङ्गाधराय नाथाय श्रीगिरीशाय मङ्गलम् ॥ सत्यानन्द स्वरूपाय नित्यानन्द विधायने
    स्तुत्याय श्रुतिगम्याय श्रीगिरीशाय मङ्गलम् ॥ मुक्तिप्रदाय मुख्याय भक्तानुग्रहकारिणे सुन्दरेशाय सौम्याय
    श्रीगिरीशाय मङ्गलम् ॥ श्रीशैले शिखरेश्वरं गणपतिं श्री हटकेशं पुनस्सारङ्गेश्वर बिन्दुतीर्थममलं घण्टार्क
    सिद्धेश्वरम् । गङ्गां श्री भ्रमराम्बिकां गिरिसुतामारामवीरेश्वरं शङ्खञ्चक्र वराहतीर्थमनिशं श्रीशैलनाथं
    भजे ॥ हस्तेकुरङ्गं गिरिमध्यरङ्गं शृङ्गारिताङ्गं गिरिजानुषङ्गम् मूर्देन्दुगङ्गं मदनाङ्ग भङ्गं श्रीशैललिङ्गं
    शिरसा नमामि ॥
