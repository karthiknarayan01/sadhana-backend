id: sarasvatikavacamrudrayamala
category: kavacha
name:
  english: sarasvatikavacamrudrayamala
  devanagari: सरस्वतीकवचम्रुद्रयामल
content:
  english: kanvarishaye namah shirasi | virat chandase namah mukhe | devisarasvatyai namah hridi | hrim
    bijaya namah guhye | om shaktaye namah nabhau | aim kilakaya namah padayoh | trivargaphalasadhane
    viniyogaya namah sarvange|| om aim hrim hrim patu vani shiro me sarvada sati | om hrim sarasvati devi
    bhalam patu sada mama || 8|| om hrim bhruvau patu durga daityanam bhayadayini | om aim hrim patu netre
    sarvamangalamangala || 9|| om hrim patu shrotrayugmam jagadabhayakarini | om aim nasa patu nityam
    vidya vidyavaraprada || 10|| om hrim aim patu vaktram vagdevi bhayanashini | am am im im patu dantan
    tridanteshvara pujitah || 11|| um um rim rim lim lim em aim patu oshthau ca bharati | om aum am ah
    patu kantham nilakanthankavasini || 12|| kam kham gam gham nam payanme camsau deveshapujita | cam
    cham jam jham nam me patu vaksho vakshahsthalashraya || 13|| tam tham dam dham nam payanme parshvau
    parshvanivasini | tam tham dam dham nam me patu madhye lokeshapujita || 14|| pam pham bam bham mam
    payanme nabhim brahmeshasevita | yam ram lam vam patu guhya nitambapriyavadini || 15|| sham sham sam
    ham katim patu devi shrivagalamukhi | uru ḻam ksham sada patu sarvavidyaprada shiva || 16|| sarasvati
    patu janghe rameshvaraprapujita | om hrim aim hrim patu padau padapithanivasini || 17|| vismaritam
    ca yat sthanam yaddesho nama varjitah | tatsarvam patu vageshi mulavidyamayi para || 18|| purve mam
    patu vagdevi vageshi vahnike ca mam | sarasvati dakshine ca nairritye canalapriya || 19|| pashcime
    patu vagisha vayau venamukhi tatha | uttare patu vidya caishanyam vidyadhari tatha || 20|| asitango
    jalat patu payaso rurubhairavah | candashca patu vatanme krodheshah patu dhavatah || 21|| unmattastishthatah
    patu bhishanashcagrato'vatu | kapali margamadhye ca samharashca praveshatah || 22|| padadimurdhaparyantam
    vapuh sarvatra me'vatu | shirasah padaparyantam devi sarasvati mama || 23|| itidam kavacam vani mantragarbham
    jayavaham | trailokyamohanam nama daridryabhayanashanam || 24|| sarvarogaharam sakshat siddhidam papanashanam
    | vidyapradam sadhakanam mulavidyamayam param || 25|| paramarthapradam nityam bhogamokshaikakaranam
    | yah pathet kavacam devi
  devanagari: कण्वऋषये नमः शिरसि । विराट् छन्दसे नमः मुखे । देवीसरस्वत्यै नमः हृदि । ह्रीं बीजाय नमः गुह्ये
    । ॐ शक्तये नमः नाभौ । ऐं कीलकाय नमः पादयोः । त्रिवर्गफलसाधने विनियोगाय नमः सर्वाङ्गे॥ ॐ ऐं ह्रीं ह्रीं
    पातु वाणी शिरो मे सर्वदा सती । ॐ ह्रीं सरस्वती देवी भालं पातु सदा मम ॥ ८॥ ॐ ह्रीं भ्रुवौ पातु दुर्गा
    दैत्यानां भयदायिनी । ॐ ऐं ह्रीं पातु नेत्रे सर्वमङ्गलमङ्गला ॥ ९॥ ॐ ह्रीं पातु श्रोत्रयुग्मं जगदभयकारिणी
    । ॐ ऐं नासा पातु नित्यं विद्या विद्यावरप्रदा ॥ १०॥ ॐ ह्रीं ऐं पातु वक्त्रं वाग्देवी भयनाशिनी । अं
    आं इं ईं पातु दन्तान् त्रिदन्तेश्वर पूजिताः ॥ ११॥ उं ऊं ऋं ॠं ऌं ॡं एं ऐं पातु ओष्ठौ च भारती । ओं
    औं अं अः पातु कण्ठं नीलकण्ठाङ्कवासिनी ॥ १२॥ कं खं गं घं ङं पायान्मे चांसौ देवेशपूजिता । चं छं जं झं
    ञं मे पातु वक्षो वक्षःस्थलाश्रया ॥ १३॥ टं ठं डं ढं णं पायान्मे पार्श्वौ पार्श्वनिवासिनी । तं थं दं
    धं नं मे पातु मध्ये लोकेशपूजिता ॥ १४॥ पं फं बं भं मं पायान्मे नाभिं ब्रह्मेशसेविता । यं रं लं वं पातु
    गुह्य नितम्बप्रियवादिनी ॥ १५॥ शं षं सं हं कटिं पातु देवी श्रीवगलामुखी । ऊरू ळं क्षं सदा पातु सर्वाविद्याप्रदा
    शिवा ॥ १६॥ सरस्वती पातु जङ्घे रमेश्वरप्रपूजिता । ॐ ह्रीं ऐं ह्रीं पातु पादौ पादपीठनिवासिनी ॥ १७॥ विस्मारितं
    च यत् स्थानं यद्देशो नाम वर्जितः । तत्सर्वं पातु वागेशी मूलविद्यामयी परा ॥ १८॥ पूर्वे मां पातु वाग्देवी
    वागेशी वह्निके च माम् । सरस्वती दक्षिणे च नैरृत्ये चानलप्रिया ॥ १९॥ पश्चिमे पातु वागीशा वायौ वेणामुखी
    तथा । उत्तरे पातु विद्या चैशान्यां विद्याधरी तथा ॥ २०॥ असिताङ्गो जलात् पातु पयसो रुरुभैरवः । चण्डश्च
    पातु वातान्मे क्रोधेशः पातु धावतः ॥ २१॥ उन्मत्तस्तिष्ठतः पातु भीषणश्चाग्रतोऽवतु । कपाली मार्गमध्ये
    च संहारश्च प्रवेशतः ॥ २२॥ पादादिमूर्धपर्यन्तं वपुः सर्वत्र मेऽवतु । शिरसः पादपर्यन्तं देवी सरस्वती
    मम ॥ २३॥ इतीदं कवचं वाणी मन्त्रगर्भं जयावहम् । त्रैलोक्यमोहनं नाम दारिद्र्यभयनाशनम् ॥ २४॥ सर्वरोगहरं
    साक्षात् सिद्धिदं पापनाशनम् । विद्याप्रदं साधकानां मूलविद्यामयं परम् ॥ २५॥ परमार्थप्रदं नित्यं भोगमोक्षैककारणम्
    । यः पठेत् कवचं देवि
