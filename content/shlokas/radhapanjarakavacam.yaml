id: radhapanjarakavacam
category: kavacha
name:
  english: radhapanjarakavacam
  devanagari: राधापन्जरकवचम्
content:
  english: mama sarvabhishtasiddhyarthe viniyogah || om hrim shrim klim patu shiro me ram raseshvari sada
    | om rum radhika patu lalatam rhim ca krishnapriya sada || 1|| om kam krishnapranapriya ca patu netre
    mama sada | om gam gopijanapriya ca patu nasam suradhipa || 2|| om pam patu ca mukham radha yam patu
    dantapanktikam | om sum patu me rasanam radha vam patu kantha
  devanagari: मम सर्वाभीष्टसिद्ध्यर्थे विनियोगः ॥ ॐ ह्रीं श्रीं क्लीं पातु शिरो मे रां रासेश्वरी सदा ।
    ॐ रूं राधिका पातु ललाटं र्हीं च कृष्णप्रिया सदा ॥ १॥ ॐ कं कृष्णप्राणप्रिया च पातु नेत्रे मम सदा ।
    ॐ गं गोपीजनप्रिया च पातु नासां सुराधिपा ॥ २॥ ॐ पं पातु च मुखं राधा यं पातु दन्तपङ्क्तिकम् । ॐ सूं
    पातु मे रसनं राधा वं पातु कण्ठ
meaning: {}
