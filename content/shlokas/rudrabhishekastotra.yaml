id: rudrabhishekastotra
category: stotram
name:
  english: rudrabhishekastotra
  devanagari: रुद्राभिषेकस्तोत्र
content:
  english: rudrabhishekastotram mahabharatantargatam krishnarjunavucatuh | namo bhavaya sharvaya rudraya
    varadaya ca | pashunam pataye nityamugraya ca kapardine || 5
  devanagari: रुद्राभिषेकस्तोत्रम् महाभारतान्तर्गतम् कृष्णार्जुनावूचतुः । नमो भवाय शर्वाय रुद्राय वरदाय
    च । पशूनां पतये नित्यमुग्राय च कपर्दिने ॥ ५
meaning: {}
