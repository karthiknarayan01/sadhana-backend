id: garbhopanishad
category: upanishad
name:
  english: garbhopanishad
  devanagari: गर्भोपनिषद्
content:
  english: jnanaksharaksharamonkaram cintayatiti tadetadekaksharam jnatva'shtau prakritayah shodasha vikarah
    sharire tasyaiva dehinah atha matra'shitapitanadisutragatena prana apyayate | atha navame masi sarvalakshanajnanakaranasampurno
    bhavati | purvajatih smarati | shubhashubham ca karma vindati || 3 || purvayonisahasrani drishtva
    caiva tato maya | ahara vividha bhuktah pitah nanavidhah stanah | jatashcaiva mritashcaiva janma caiva
    punah punah | yanmaya parijanasyarthe kritam karma shubhashubham | ekaki tena dahye'ham gataste phalabhoginah
    | aho duhkhodadhau magnah na pashyami pratikriyam | yadi yonyah pramunce'ham tatprapadye maheshvaram
    | ashubhakshayakartaram phalamuktipradayakam | yadi yonyah pramunce'ham tatprapadye narayanam | ashubhakshayakartaram
    phalamuktipradayakam | yadi yonyah pramunce'ham dhyaye brahma sanatanam | atha yonidvaram samprapto
    yantrena pidyamano mahata duhkhena jatamatrastu vaishnavena vayuna samsprishyate tada na smarati janmamaranani
    na ca karma shubhashubham vindati || 4 || shariramiti kasmat | agnayo hyatra shriyante jnanagnirdarshanagnih
    koshthagniriti | tatra koshthagnirnamashitapitalehyacoshyam pacatiti | darshanagni rupadinam darshanam
    karoti | jnanagnih shubhashubham ca karma vindati | tatra trini sthanani bhavanti | mukhe avahaniya
    udare garhapatyò hridi dakshinagnih atma yajamano mano brahma lobhadayah pashavo dhritirdiksha santoshashca
    buddhindriyani yajnapatrani karmendriyani havimshi shirah kapalam kesha darbha mukhamantarvedih catushkapalam
    shirah shodasha parshvadantoshthapatalani saptottaram marmashatam sashitikam sandhishatam sanavakam
    snayushatam sapta shirashatani panca majjashatani asthini ca ha vai trini shatani shashtishcardhacatasro
    romani kotyo hridayam palanyashtau dvadasha palani jihva pittaprastham kaphasyadhakam shuklakudavam
    medah prasthau dvavaniyatam mutrapurishamaharaparimanat | paippaladam mokshashastram paippaladam mokshashastram
    parisamaptamiti || om sahanavavatu | saha nau bhunaktu | saha viryam karavavahai | tejasvinavadhitamastu
    | ma vidvishavahai || om shantih shantih shantih
  devanagari: ज्ञानाक्षराक्षरमोङ्कारं चिन्तयतीति तदेतदेकाक्षरं ज्ञात्वाऽष्टौ प्रकृतयः षोडश विकाराः शरीरे
    तस्यैव देहिनः अथ मात्राऽशितपीतनाडीसूत्रगतेन प्राण आप्यायते । अथ नवमे मासि सर्वलक्षणज्ञानकरणसम्पूर्णो
    भवति । पूर्वजातीः स्मरति । शुभाशुभं च कर्म विन्दति ॥ ३ ॥ पूर्वयोनिसहस्राणि दृष्ट्वा चैव ततो मया ।
    आहारा विविधा भुक्ताः पीताः नानाविधाः स्तनाः । जातश्चैव मृतश्चैव जन्म चैव पुनः पुनः । यन्मया परिजनस्यार्थे
    कृतं कर्म शुभाशुभम् । एकाकी तेन दह्येऽहं गतास्ते फलभोगिनः । अहो दुःखोदधौ मग्नः न पश्यामि प्रतिक्रियाम्
    । यदि योन्याः प्रमुञ्चेऽहं तत्प्रपद्ये महेश्वरम् । अशुभक्षयकर्तारं फलमुक्तिप्रदायकम् । यदि योन्याः
    प्रमुञ्चेऽहं तत्प्रपद्ये नारायणं । अशुभक्षयकर्तारं फलमुक्तिप्रदायकम् । यदि योन्याः प्रमुञ्चेऽहं ध्याये
    ब्रह्म सनातनम् । अथ योनिद्वारं सम्प्राप्तो यन्त्रेण पीड्यमानो महता दुःखेन जातमात्रस्तु वैष्णवेन वायुना
    संस्पृश्यते तदा न स्मरति जन्ममरणानि न च कर्म शुभाशुभं विन्दति ॥ ४ ॥ शरीरमिति कस्मात् । अग्नयो ह्यत्र
    श्रियन्ते ज्ञानाग्निर्दर्शनाग्निः कोष्ठाग्निरिति । तत्र कोष्ठाग्निर्नामाशितपीतलेह्यचोष्यं पचतीति ।
    दर्शनाग्नी रूपादीनां दर्शनं करोति । ज्ञानाग्निः शुभाशुभं च कर्म विन्दति । तत्र त्रीणि स्थानानि भवन्ति
    । मुखे आवहनीय उदरे गार्हपत्यॊ हृदि दक्षिणाग्निः आत्मा यजमानो मनो ब्रह्मा लोभादयः पशवो धृतिर्दीक्षा
    सन्तोषश्च बुद्धीन्द्रियाणि यज्ञपात्राणि कर्मेन्द्रियाणि हवींषि शिरः कपालं केशा दर्भा मुखमन्तर्वेदिः
    चतुष्कपालं शिरः षोडश पार्श्वदन्तोष्ठपटलानि सप्तोत्तरं मर्मशतं साशीतिकं सन्धिशतं सनवकं स्नायुशतं सप्त
    शिराशतानि पञ्च मज्जाशतानि अस्थीनि च ह वै त्रीणि शतानि षष्टिश्चार्धचतस्रो रोमाणि कोट्यो हृदयं पलान्यष्टौ
    द्वादश पलानि जिह्वा पित्तप्रस्थं कफस्याढकं शुक्लकुडवं मेदः प्रस्थौ द्वावनियतं मूत्रपुरीषमाहारपरिमाणात्
    । पैप्पलादं मोक्षशास्त्रं पैप्पलादं मोक्षशास्त्रं परिसमाप्तमिति ॥ ॐ सहनाववतु । सह नौ भुनक्तु । सह
    वीर्यं करवावहै । तेजस्विनावधीतमस्तु । मा विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः
