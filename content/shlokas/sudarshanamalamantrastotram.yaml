id: sudarshanamalamantrastotram
category: mantra
name:
  english: sudarshanamalamantrastotram
  devanagari: सुदर्शनमालामन्त्रस्तोत्रम्
content:
  english: shrisudarshanamalamantrastotram asya shrisudarshanamalamahamantrasya ahirbudhnya rishih | anushtup
    chandah | sudarshanacakrarupi shriharirdevata | acakraya svaheti bijam | sucakraya svaheti shaktih
    | jvalacakraya svaheti kilakam | shrisudarshanaprityarthe jape viniyogah | om acakraya svaha | vicakraya
    svaha | sucakraya svaha | dhicakraya svaha | jvalacakraya svaha | sucakraya svaheti karanganyasau
    | dhyanam kalpantarkaprakasham tribhuvanamakhilam tejasa purayantam raktaksham pingakedam ripukulabhayadam
    vajradamshtradrihasam | shankham cakram karagraih prithutaramusalam capapashankushadin bibhranam dorbhiradyam
    manasi muraripum bhavayeccakrasamjnam || om shrim hrim klim sahasrara hum phat svaha | om klim krishnaya
    govindaya gopijanavallabhaya paraya paramapurushaya paramatmane paramantraparayantraparatantraushadhastrashastrani
    samhara samhara | mrityormocaya mrityormocaya | shatrunnashaya nashaya | om namo bhagavate mahasudarshanaya
    diptre jvalaparitaya sarvadikshobhanakaraya brahmane paranjyotishe hum phat svaha || iti sudarshanamalamantrastotram
    sampurnam |
  devanagari: श्रीसुदर्शनमालामन्त्रस्तोत्रम् अस्य श्रीसुदर्शनमालामहामन्त्रस्य अहिर्बुध्न्य ऋषिः । अनुष्टुप्
    छन्दः । सुदर्शनचक्ररूपी श्रीहरिर्देवता । आचक्राय स्वाहेति बीजम् । सुचक्राय स्वाहेति शक्तिः । ज्वालाचक्राय
    स्वाहेति कीलकम् । श्रीसुदर्शनप्रीत्यर्थे जपे विनियोगः । ॐ आचक्राय स्वाहा । विचक्राय स्वाहा । सुचक्राय
    स्वाहा । धीचक्राय स्वाहा । ज्वालाचक्राय स्वाहा । सुचक्राय स्वाहेति कराङ्गन्यासौ । ध्यानम् कल्पान्तार्कप्रकाशं
    त्रिभुवनमखिलं तेजसा पूरयन्तं रक्ताक्षं पिङ्गकेदां रिपुकुलभयदं वज्रदंष्ट्रादृहासम् । शङ्खं चक्रं कराग्रैः
    पृथुतरमुसलं चापपाशाङ्कुशादीन् बिभ्राणं दोर्भिराद्यं मनसि मुररिपुं भावयेच्चक्रसंज्ञम् ॥ ॐ श्रीं ह्रीं
    क्लीं सहस्रार हुं फट् स्वाहा । ॐ क्लीं कृष्णाय गोविन्दाय गोपीजनवल्लभाय पराय परमपुरुषाय परमात्मने परमन्त्रपरयन्त्रपरतन्त्रौषधास्त्रशस्त्राणि
    संहर संहर । मृत्योर्मोचय मृत्योर्मोचय । शत्रून्नाशय नाशय । ॐ नमो भगवते महासुदर्शनाय दीप्त्रे ज्वालापरीताय
    सर्वदिक्शोभनकराय ब्रह्मणे परञ्ज्योतिषे हुं फट् स्वाहा ॥ इति सुदर्शनमालामन्त्रस्तोत्रं सम्पूर्णम् ।
