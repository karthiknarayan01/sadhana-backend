id: kanakadhara-stotram
category: stotram
name:
  english: Kanakadhara Stotram
content:
  english: vande vandaru mandaramindiranandakandalam | amandanandasandoha bandhuram sindhurananam || angam
    hareh pulakabhushanamashrayanti bhringanganeva mukulabharanam tamalam | angikritakhilavibhutirapangalila
    mangalyadastu mama mangaladevatayah || || mugdha muhurvidadhati vadane murareh prematrapapranihitani
    gatagatani | mala drishormadhukariva mahotpale ya sa me shriyam dishatu sagarasambhavayah || || amilitakshamadhigamya
    muda mukundam anandakandamanimeshamanangatantram | akekarasthitakaninikapakshmanetram bhutyai bhavenmama
    bhujangashayanganayah || || bahvantare madhujitah shritakaustubhe ya haravaliva harinilamayi vibhati
    | kamaprada bhagavato'pi katakshamala kalyanamavahatu me kamalalayayah || || kalambudalilalitorasi
    kaitabhareh dharadhare sphurati ya tatidanganeva | matussamastajagatam mahaniyamurtih bhadrani me
    dishatu bhargavanandanayah || || praptam padam prathamatah khalu yatprabhavat mangalyabhaji madhumathini
    manmathena | mayyapatettadiha mantharamikshanardham mandalasam ca makaralayakanyakayah || || vishvamarendrapadavibhramadanadaksham
    anandaheturadhikam muravidvisho'pi | ishannishidatu mayi kshanamikshanartham indivarodarasahodaramindirayah
    || || ishta vishishtamatayo'pi yaya dayardra drishtya trivishtapapadam sulabham labhante | drishtih
    prahrishtakamalodaradipti rishtam pushtim krishishta mama pushkaravishtarayah || || dadyaddayanupavano
    dravinambudhara nnakincana vihangashishau vishanne | dushkarmagharmamapaniya ciraya duram narayanapranayininayanambuvahah
    || || girdevateti garudadhvajasundariti shakambhariti shashishekharavallabheti | srishtisthitipralayakelishu
    samsthitayai tasyai namastribhuvanaikagurostarunyai || || shrutyai namo'stu shubhakarmaphalaprasutyai
    ratyai namo'stu ramaniyagunarnavayai | shaktyai namo'stu shatapatraniketanayai pushtyai namo'stu purushottamavallabhayai
    || || namo'stu nalikanibhananayai namo'stu dugdhodadhijanmabhumyai | namo'stu somamritasodarayai namo'stu
    narayanavallabhayai || || namo'stu hemambujapithikayai namo'stu bhumandalanayikayai | namo'stu devadidayaparayai
    namo'stu sharngayudhavallabhayai || || namo'stu devyai bhrigunandanayai namo'stu vishnorurasisthitayai
    | namo'stu lakshmyai kamalalayayai namo'stu damodaravallabhayai || || namo'stu kantyai kamalekshanayai
    namo'stu bhutyai bhuvanaprasutyai | namo'stu devadibhirarcitayai namo'stu nandatmajavallabhayai ||
    || sampatkarani sakalendriyanandanani samrajyadanavibhavani saroruhakshi | tvadvandanani duritoddharanodyatani
    mameva mataranisham kalayantu manye || || yatkatakshasamupasanavidhih sevakasya sakalarthasampadah
    | santanoti vacanangamanasaih tvam murarihridayeshvarim bhaje || || sarasijanilaye sarojahaste dhavalatamamshukagandhamalyashobhe
    | bhagavati harivallabhe manojne tribhuvanabhutikari prasida mahyam || || digghastibhih kanakakumbhamukhavasrishta
    svarvahinivimalacarujalaplutangim | pratarnamami jagatam jananimashesha lokadhinatha || kamale kamalakshavallabhe
    tvam karunapuratarangitairapangaih | avalokaya mamakincananam prathamam patramakritrimam dayayah ||
    || stuvanti ye stutibhiramubhiranvaham trayimayim tribhuvanamataram ramam | gunadhika gurutara bhavanti
    te bhuvi budhabhavitashayah || || suvarnadharastotram yacchankaracarya nirmitam | trisandhyam yah
    pathennityam sa kuberasamo bhavet || iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya
    shrimacchankarabhagavatah kritau kanakadharastotram sampurnam |
  devanagari: वन्दे वन्दारु मन्दारमिन्दिरानन्दकन्दलम् । अमन्दानन्दसन्दोह बन्धुरं सिन्धुराननम् ॥ अङ्गं
    हरेः पुलकभूषणमाश्रयन्ती भृङ्गाङ्गनेव मुकुलाभरणं तमालम् । अङ्गीकृताखिलविभूतिरपाङ्गलीला माङ्गल्यदास्तु
    मम मङ्गलदेवतायाः ॥ ॥ मुग्धा मुहुर्विदधती वदने मुरारेः प्रेमत्रपाप्रणिहितानि गतागतानि । माला दृशोर्मधुकरीव
    महोत्पले या सा मे श्रियं दिशतु सागरसम्भवायाः ॥ ॥ आमीलिताक्षमधिगम्य मुदा मुकुन्दम् आनन्दकन्दमनिमेषमनङ्गतन्त्रम्
    । आकेकरस्थितकनीनिकपक्ष्मनेत्रं भूत्यै भवेन्मम भुजङ्गशयाङ्गनायाः ॥ ॥ बाह्वन्तरे मधुजितः श्रितकौस्तुभे
    या हारावलीव हरिनीलमयी विभाति । कामप्रदा भगवतोऽपि कटाक्षमाला कल्याणमावहतु मे कमलालयायाः ॥ ॥ कालाम्बुदालिललितोरसि
    कैटभारेः धाराधरे स्फुरति या तटिदङ्गनेव । मातुस्समस्तजगतां महनीयमूर्तिः भद्राणि मे दिशतु भार्गवनन्दनायाः
    ॥ ॥ प्राप्तं पदं प्रथमतः खलु यत्प्रभावात् माङ्गल्यभाजि मधुमाथिनि मन्मथेन । मय्यापतेत्तदिह मन्थरमीक्षणार्धं
    मन्दालसं च मकरालयकन्यकायाः ॥ ॥ विश्वामरेन्द्रपदविभ्रमदानदक्षं आनन्दहेतुरधिकं मुरविद्विषोऽपि । ईषन्निषीदतु
    मयि क्षणमीक्षणार्थं इन्दीवरोदरसहोदरमिन्दिरायाः ॥ ॥ इष्टा विशिष्टमतयोऽपि यया दयार्द्र दृष्ट्या त्रिविष्टपपदं
    सुलभं लभन्ते । दृष्टिः प्रहृष्टकमलोदरदीप्ति रिष्टां पुष्टिं कृषीष्ट मम पुष्करविष्टरायाः ॥ ॥ दद्याद्दयानुपवनो
    द्रविणाम्बुधारा न्नकिञ्चन विहङ्गशिशौ विषण्णे । दुष्कर्मघर्ममपनीय चिराय दूरं नारायणप्रणयिनीनयनाम्बुवाहः
    ॥ ॥ गीर्देवतेति गरुडध्वजसुन्दरीति शाकम्भरीति शशिशेखरवल्लभेति । सृष्टिस्थितिप्रलयकेलिषु संस्थितायै
    तस्यै नमस्त्रिभुवनैकगुरोस्तरुण्यै ॥ ॥ श्रुत्यै नमोऽस्तु शुभकर्मफलप्रसूत्यै रत्यै नमोऽस्तु रमणीयगुणार्णवायै
    । शक्त्यै नमोऽस्तु शतपत्रनिकेतनायै पुष्ट्यै नमोऽस्तु पुरुषोत्तमवल्लभायै ॥ ॥ नमोऽस्तु नालीकनिभाननायै
    नमोऽस्तु दुग्धोदधिजन्मभूम्यै । नमोऽस्तु सोमामृतसोदरायै नमोऽस्तु नारायणवल्लभायै ॥ ॥ नमोऽस्तु हेमाम्बुजपीठिकायै
    नमोऽस्तु भूमण्डलनायिकायै । नमोऽस्तु देवादिदयापरायै नमोऽस्तु शार्ङ्गायुधवल्लभायै ॥ ॥ नमोऽस्तु देव्यै
    भृगुनन्दनायै नमोऽस्तु विष्णोरुरसिस्थितायै । नमोऽस्तु लक्ष्म्यै कमलालयायै नमोऽस्तु दामोदरवल्लभायै ॥
    ॥ नमोऽस्तु कान्त्यै कमलेक्षणायै नमोऽस्तु भूत्यै भुवनप्रसूत्यै । नमोऽस्तु देवादिभिरर्चितायै नमोऽस्तु
    नन्दात्मजवल्लभायै ॥ ॥ सम्पत्कराणि सकलेन्द्रियनन्दनानि साम्राज्यदानविभवानि सरोरुहाक्षि । त्वद्वन्दनानि
    दुरितोद्धरणोद्यतानि मामेव मातरनिशं कलयन्तु मान्ये ॥ ॥ यत्कटाक्षसमुपासनाविधिः सेवकस्य सकलार्थसम्पदः
    । सन्तनोति वचनाङ्गमानसैः त्वां मुरारिहृदयेश्वरीं भजे ॥ ॥ सरसिजनिलये सरोजहस्ते धवलतमांशुकगन्धमाल्यशोभे
    । भगवति हरिवल्लभे मनोज्ञे त्रिभुवनभूतिकरि प्रसीद मह्यम् ॥ ॥ दिग्घस्तिभिः कनककुम्भमुखावसृष्ट स्वर्वाहिनीविमलचारुजलप्लुताङ्गीम्
    । प्रातर्नमामि जगतां जननीमशेष लोकाधिनाथ ॥ कमले कमलाक्षवल्लभे त्वं करुणापूरतरङ्गितैरपाङ्गैः । अवलोकय
    मामकिञ्चनानां प्रथमं पात्रमकृत्रिमं दयायाः ॥ ॥ स्तुवन्ति ये स्तुतिभिरमूभिरन्वहं त्रयीमयीं त्रिभुवनमातरं
    रमाम् । गुणाधिका गुरुतर भवन्ति ते भुवि बुधभाविताशयाः ॥ ॥ सुवर्णधारास्तोत्रं यच्छङ्कराचार्य निर्मितम्
    । त्रिसन्ध्यं यः पठेन्नित्यं स कुबेरसमो भवेत् ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य
    श्रीमच्छङ्करभगवतः कृतौ कनकधारास्तोत्रं सम्पूर्णम् ।
