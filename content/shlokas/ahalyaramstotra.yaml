id: ahalyaramstotra
category: stotram
name:
  english: ahalyaramstotra
  devanagari: अहल्याराम्स्तोत्र
content:
  english: ekah mayatanum lokavimohaniyam dhatte paranugraha esha ramah || 7|| ayam hi vishvodbhavasamyamanamekah
    svamayagunabimbito yah | virincivishnvishvaranamabhedan dhatte svatantrah paripurna atma || 8|| namo'stu
    te rama tavanghripankajam shriya dhritam vakshasi lalitam priyat | akrantamekena jagattrayam pura
    dhyeyam munindrairabhimanavarjitaih || 9|| jagatamadibhutastvam jagattvam jagadashrayah | sarvabhuteshvasamyukta
    eko bhati bhavanparah || 10|| omkaravacyastvam rama vacamavishayah puman | vacyavacakabhedena bhavaneva
    jaganmayah || 11|| karyakaranakartritvaphalasadhanabhedatah | eko vibhasi rama tvam mayaya bahurupaya
    || 12|| tvanmayamohitadhiyastvam na jananti tattvatah | manusham tva'bhimanyante mayinam parameshvaram
    || 13|| akashavattvam sarvatra bahirantargato'malah | asango hyacalo nityah shuddho buddhah sadavyayah
    || 14|| yoshinmudha'hamajna te tattvam jane katham vibho | tasmatte shatasho rama namaskuryamananyadhih
    || 15|| deva me yatra kutrapi sthitaya api sarvada | tvatpadakamale sakta bhaktireva sada'stu me ||
    16|| namaste purushadhyaksha namaste bhaktavatsala | namaste'stu hrishikesha narayana namo'stu te
    || 17|| bhavabhayaharamekam bhanukotiprakasham karadhritasharacapam kalameghavabhasam | kanakaruciravastram
    ratnavatkundaladhyam kamalavishadanetram sanujam ramamide || 18|| stutvaivam purusham sakshadraghavam
    puratah sthitam | parikramya pranamyashu sa'nujnata yayau patim || 19|| ahalyaya kritam stotram yah
    pathedbhaktisamyutah | sa mucyate'khilaih papaih param brahmadhigacchati || 20|| putradyarthe pathedbhaktya
    ramam hridi nidhaya ca | samvatsarena labhate vandhya api suputrakam || 21|| sarvankamanavapnoti ramacandraprasadatah
    || 22|| brahmaghno gurutalpago'pi purushah steyi surapo'pi va matribhratrivihimsako'pi satatam bhogaikabaddhaturah
    | nityam stotramidam japan raghupatim bhaktya hridistham smaran dhyayanmuktimupaiti kim punarasau
    svacarayukto narah || 23|| || iti shrimadadhyatmaramayane ahalyaviracitam shriramacandrastotram sampurnam
    ||
  devanagari: एकः मायातनुं लोकविमोहनीयां धत्ते परानुग्रह एष रामः ॥ ७॥ अयं हि विश्वोद्भवसंयमानामेकः स्वमायागुणबिम्बितो
    यः । विरिञ्चिविष्ण्वीश्वरनामभेदान् धत्ते स्वतन्त्रः परिपूर्ण आत्मा ॥ ८॥ नमोऽस्तु ते राम तवाङ्घ्रिपङ्कजं
    श्रिया धृतं वक्षसि लालितं प्रियात् । आक्रान्तमेकेन जगत्त्रयं पुरा ध्येयं मुनीन्द्रैरभिमानवर्जितैः
    ॥ ९॥ जगतामादिभूतस्त्वं जगत्त्वं जगदाश्रयः । सर्वभूतेष्वसंयुक्त एको भाति भवान्परः ॥ १०॥ ओंकारवाच्यस्त्वं
    राम वाचामविषयः पुमान् । वाच्यवाचकभेदेन भवानेव जगन्मयः ॥ ११॥ कार्यकारणकर्तृत्वफलसाधनभेदतः । एको विभासि
    राम त्वं मायया बहुरूपया ॥ १२॥ त्वन्मायामोहितधियस्त्वां न जानन्ति तत्त्वतः । मानुषं त्वाऽभिमन्यन्ते
    मायिनं परमेश्वरम् ॥ १३॥ आकाशवत्त्वं सर्वत्र बहिरन्तर्गतोऽमलः । असङ्गो ह्यचलो नित्यः शुद्धो बुद्धः
    सदव्ययः ॥ १४॥ योषिन्मूढाऽहमज्ञा ते तत्त्वं जाने कथं विभो । तस्मात्ते शतशो राम नमस्कुर्यामनन्यधीः ॥
    १५॥ देव मे यत्र कुत्रापि स्थिताया अपि सर्वदा । त्वत्पादकमले सक्ता भक्तिरेव सदाऽस्तु मे ॥ १६॥ नमस्ते
    पुरुषाध्यक्ष नमस्ते भक्तवत्सल । नमस्तेऽस्तु हृषीकेश नारायण नमोऽस्तु ते ॥ १७॥ भवभयहरमेकं भानुकोटिप्रकाशं
    करधृतशरचापं कालमेघावभासम् । कनकरुचिरवस्त्रं रत्नवत्कुण्डलाढ्यं कमलविशदनेत्रं सानुजं राममीडे ॥ १८॥
    स्तुत्वैवं पुरुषं साक्षाद्राघवं पुरतः स्थितम् । परिक्रम्य प्रणम्याशु साऽनुज्ञाता ययौ पतिम् ॥ १९॥ अहल्यया
    कृतं स्तोत्रं यः पठेद्भक्तिसंयुतः । स मुच्यतेऽखिलैः पापैः परं ब्रह्माधिगच्छति ॥ २०॥ पुत्राद्यर्थे
    पठेद्भक्त्या रामं हृदि निधाय च । संवत्सरेण लभते वन्ध्या अपि सुपुत्रकम् ॥ २१॥ सर्वान्कामानवाप्नोति
    रामचन्द्रप्रसादतः ॥ २२॥ ब्रह्मघ्नो गुरुतल्पगोऽपि पुरुषः स्तेयी सुरापोऽपि वा मातृभ्रातृविहिंसकोऽपि
    सततं भोगैकबद्धातुरः । नित्यं स्तोत्रमिदं जपन् रघुपतिं भक्त्या हृदिस्थं स्मरन् ध्यायन्मुक्तिमुपैति
    किं पुनरसौ स्वाचारयुक्तो नरः ॥ २३॥ ॥ इति श्रीमदध्यात्मरामायणे अहल्याविरचितं श्रीरामचन्द्रस्तोत्रं
    सम्पूर्णम् ॥
