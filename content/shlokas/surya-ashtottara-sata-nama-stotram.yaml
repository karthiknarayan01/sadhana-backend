id: surya-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Surya Ashtottara Sata Nama Stotram
  devanagari: सूर्याष्टोत्तरशतनामस्तोत्रम् १ (अथर्वणरहस्यान्तर्गतम् अरुणाय शरण्याय)
content:
  english: surya bija mantra - om hra~ hrim hraum sah suryaya namah || arunaya sharanyaya karunarasasindhave
    | asamanabalaya'rtarakshakaya namo namah || 1|| adityaya'dibhutaya akhilagamavedine | acyutaya'khilajnaya
    anantaya namo namah || 2|| inaya vishvarupaya ijyayaindraya bhanave | indiramandiraptaya vandaniyaya
    te namah || 3|| ishaya suprasannaya sushilaya suvarcase | vasupradaya vasave vasudevaya te namah ||
    4|| ujjvalayograrupaya urdhvagaya vivasvate | udyatkiranajalaya hrishikeshaya te namah || 5|| urjasvalaya
    viraya nirjaraya jayaya ca | urudvayabhavarupayuktasarathaye namah || 6|| rishivandyaya rugghantre
    rikshacakracaraya ca | rijusvabhavacittaya nityastutyaya te namah || 7|| rikaramatrikavarnarupayojjvalatejase
    | rikshadhinathamitraya pushkarakshaya te namah || 8|| luptadantaya shantaya kantidaya ghanaya ca
    | kanatkanakabhushaya khadyotaya te namah || 9|| lunitakhiladaityaya satyanandasvarupine | apavargapradaya'rtasharanyaya
    namo namah || 10|| ekakine bhagavate srishtisthityantakarine | gunatmane ghrinibhrite brihate brahmane
    namah || 11|| aishvaryadaya sharvaya haridashvaya shauraye | dashadiksamprakashaya bhaktavashyaya
    te namah || 12|| ojaskaraya jayine jagadanandahetave | janmamrityujaravyadhivarjitaya namo namah ||
    13|| ounnatyapadasancararathasthayatmarupine | kamaniyakaraya'bjavallabhaya namo namah || 14|| antarbahihprakashaya
    acintyaya'tmarupine | acyutaya sureshaya parasmaijyotishe namah || 15|| ahaskaraya ravaye haraye paramatmane
    | tarunaya varenyaya grahanampataye namah || 16|| om namo bhaskaraya'dimadhyantarahitaya ca | saukhyapradaya
    sakalajagatampataye namah || 17|| namah suryaya kavaye namo narayanaya ca | namo namah pareshaya tejorupaya
    te namah || 18|| om shrim hiranyagarbhaya om hrim sampatkaraya ca | om aim ishtarthadaya'nuprasannaya
    namo namah || 19|| shrimate shreyase bhaktakotisaukhyapradayine | nikhilagamavedyaya nityanandaya
    te namah || 20|| yo manavah santatamarkamarcayanpathetprabhate vimalena cetasa | iman namani ca tasya
    punyamayurdhanam dhanyamupaitti nityam ||21|| imam stavam devavarasya kirtayecchrunoti yo'yam sumanah
    samahitah | sa mucyate shokadavagnisagarallabheta sarvam manaso yathepsitam || iti shrimadatharvanarahasye
    suryashtottarashatanamastotram sampurnam | Provided by manda khrishna shrikanth mandaksk at gmailॅom
  devanagari: सूर्य बीज मन्त्र - ॐ ह्राँ ह्रीं ह्रौं सः सूर्याय नमः ॥ अरुणाय शरण्याय करुणारससिन्धवे ।
    असमानबलायाऽर्तरक्षकाय नमो नमः ॥ १॥ आदित्यायाऽदिभूताय अखिलागमवेदिने । अच्युतायाऽखिलज्ञाय अनन्ताय नमो
    नमः ॥ २॥ इनाय विश्वरूपाय इज्यायैन्द्राय भानवे । इन्दिरामन्दिराप्ताय वन्दनीयाय ते नमः ॥ ३॥ ईशाय सुप्रसन्नाय
    सुशीलाय सुवर्चसे । वसुप्रदाय वसवे वासुदेवाय ते नमः ॥ ४॥ उज्ज्वलायोग्ररूपाय ऊर्ध्वगाय विवस्वते । उद्यत्किरणजालाय
    हृषीकेशाय ते नमः ॥ ५॥ ऊर्जस्वलाय वीराय निर्जराय जयाय च । ऊरुद्वयाभावरूपयुक्तसारथये नमः ॥ ६॥ ऋषिवन्द्याय
    रुग्घन्त्रे ऋक्षचक्रचराय च । ऋजुस्वभावचित्ताय नित्यस्तुत्याय ते नमः ॥ ७॥ ऋकारमातृकावर्णरूपायोज्ज्वलतेजसे
    । ऋक्षाधिनाथमित्राय पुष्कराक्षाय ते नमः ॥ ८॥ लुप्तदन्ताय शान्ताय कान्तिदाय घनाय च । कनत्कनकभूषाय खद्योताय
    ते नमः ॥ ९॥ लूनिताखिलदैत्याय सत्यानन्दस्वरूपिणे । अपवर्गप्रदायाऽर्तशरण्याय नमो नमः ॥ १०॥ एकाकिने भगवते
    सृष्टिस्थित्यन्तकारिणे । गुणात्मने घृणिभृते बृहते ब्रह्मणे नमः ॥ ११॥ ऐश्वर्यदाय शर्वाय हरिदश्वाय शौरये
    । दशदिक्सम्प्रकाशाय भक्तवश्याय ते नमः ॥ १२॥ ओजस्कराय जयिने जगदानन्दहेतवे । जन्ममृत्युजराव्याधिवर्जिताय
    नमो नमः ॥ १३॥ ओउन्नत्यपदसञ्चाररथस्थायात्मरूपिने । कमनीयकरायाऽब्जवल्लभाय नमो नमः ॥ १४॥ अन्तर्बहिःप्रकाशाय
    अचिन्त्यायाऽत्मरूपिणे । अच्युताय सुरेषाय परस्मैज्योतिषे नमः ॥ १५॥ अहस्कराय रवये हरये परमात्मने । तरुणाय
    वरेण्याय ग्रहाणाम्पतये नमः ॥ १६॥ ॐ नमो भास्करायाऽदिमध्यान्तरहिताय च । सौख्यप्रदाय सकलजगताम्पतये नमः
    ॥ १७॥ नमः सूर्याय कवये नमो नारायणाय च । नमो नमः परेशाय तेजोरूपाय ते नमः ॥ १८॥ ॐ श्रीं हिरण्यगर्भाय
    ॐ ह्रीं सम्पत्कराय च । ॐ ऐं इष्टार्थदायाऽनुप्रसन्नाय नमो नमः ॥ १९॥ श्रीमते श्रेयसे भक्तकोटिसौख्यप्रदायिने
    । निखिलागमवेद्याय नित्यानन्दाय ते नमः ॥ २०॥ यो मानवः सन्ततमर्कमर्चयन्पठेत्प्रभाते विमलेन चेतसा । इमान्
    नामानि च तस्य पुण्यमायुर्धनं धान्यमुपैत्ति नित्यम् ॥२१॥ इमं स्तवं देववरस्य कीर्तयेच्छ्रुणोति योऽयं
    सुमनाः समाहितः । स मुच्यते शोकदवाग्निसागराल्लभेत सर्वं मनसो यथेप्सितम् ॥ इति श्रीमदथर्वणरहस्ये सूर्याष्टोत्तरशतनामस्तोत्रं
    सम्पूर्णम् । Pरोविदेद् ब्य् ंअन्द ख़्रिश्न श्रिकन्थ् मन्दक्स्क् अत् ग्मैल्ॅओम्
