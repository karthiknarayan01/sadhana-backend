id: ganamurte-sri-krushnavenu
category: stotram
name:
  english: Ganamurte Sri Krushnavenu
content:
  english: adi pallavi ganamurte shrikrishnavenu ganalola tribhuvanapala pahi anu pallavi maninimani shri
    rukmini manasapahara marajanaka divya navanitacora nandasatkishora naramitradhira narasimha shura
    navameghateja nagajasahaja narakantakaja naratyagaraja
  devanagari: आदि पल्लवि गानमूर्ते श्रीकृष्णवेणु गानलोल त्रिभुवनपाल पाहि अनु पल्लवि मानिनीमणि श्री रुक्मिणि
    मानसापहार मारजनक दिव्य नवनीतचोर नन्दसत्किशोर नरमित्रधीर नरसिंह शूर नवमेघतेज नगजासहज नरकान्तकाज नरत्यागराज
meaning: {}
