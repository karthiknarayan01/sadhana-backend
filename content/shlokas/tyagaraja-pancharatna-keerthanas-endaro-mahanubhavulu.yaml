id: tyagaraja-pancharatna-keerthanas-endaro-mahanubhavulu
category: stotram
name:
  english: Tyagaraja Pancharatna Keerthanas Endaro Mahanubhavulu
content:
  english: shri tyagarajacaryulu ragam adi èndaro mahanubhavulu andariki vandanamulu canduru varnuni anda
    candamunu hridayaravundamuna juci brahmanandamanubhavincu varèndaro mahanubhavulu samagana lola manasija
    lavanya dhanya murdhanyulèndaro mahanubhavulu manasavana cara vara sancaramu nèripi murti baguga pògadane
    varèndaro mahanubhavulu saraguna padamulaku svantamanu sarojamunu samarpanamu seyuvarèndaro mahanubhavulu
    patita pavanudane paratparuni gurinci paramardhamagu nija margamutonu baducunu sallapamuto svara layadi
    ragamula dèliyu varèndaro mahanubhavulu hariguna manimaya saramulu galamuna shobhillu bhakta kotulilalo
    tèlivito cèlimito karuna galgi jagamèllanu sudha drishtice brocuvarèndaro mahanubhavulu hòyalu mira
    nadalu galggu sarasuni sada kanula jucucunu pulaka sharirulai ananda payodhi nimagnulai mudambunanu
    yashamu galavarèndaro mahanubhavulu parama bhagavata mauni vara shashi vibhakara sanaka sanandana
    digisha sura kimpurusha kanaka kashipu suta narada tumburu pavanasunu balacandra dhara shuka sarojabhava
    bhusuravarulu parama pavanulu ghanulu shashvatulu kamala bhava sukhamu sadanubhavulu gaka èndaro mahanubhavulu
    ni menu nama vaibhavambulanu ni parakrama dhairyamula shanta manasamu nivulanu vacana satyamunu raghuvara
    niyèda sadbhaktiyu janincakanu durmatamulanu kalga jesinatti nimadi nèringi santasambunanu guna bhajanananda
    kirtanamu jeyu varèndaro mahanubhavulu bhagavata ramayana gitadi shriti shastra puranapu marmamulanu
    shivadi sanmatamula gudhamulan muppadi mukkoti surantarangamula bhavambulanèrigi bhava raga layadi
    saukhyamuce cirayuvulgaligi niravadhi sukhatmulai tyagaraptulaina varèndaro mahanubhavulu prema muppiri
    gònu vela namamunu dalacevaru ramabhaktudaina tyagarajanutuni nija dasulainana varèndaro mahanubhavulu
    andariki vandanamu
  devanagari: श्री त्यागराजाचार्युलु रागं आदि ऎन्दरो महानुभावुलु अन्दरिकी वन्दनमुलु चन्दुरू वर्णुनि अन्द
    चन्दमुनु हृदयारवुन्दमुन जूचि ब्रह्मानन्दमनुभविञ्चु वारॆन्दरो महानुभावुलु सामगान लोल मनसिज लावण्य धन्य
    मुर्धन्युलॆन्दरो महानुभावुलु मानसवन चर वर सञ्चारमु नॆरिपि मूर्ति बागुग पॊगडने वारॆन्दरो महानुभावुलु
    सरगुन पादमुलकु स्वान्तमनु सरोजमुनु समर्पणमु सेयुवारॆन्दरो महानुभावुलु पतित पावनुडने परात्परुनि गुरिञ्चि
    परमार्धमगु निज मार्गमुतोनु बाडुचुनु सल्लापमुतो स्वर लयादि रागमुल दॆलियु वारॆन्दरो महानुभावुलु हरिगुण
    मणिमय सरमुलु गलमुन षोभिल्लु भक्त कोटुलिललो तॆलिवितो चॆलिमितो करुण गल्गि जगमॆल्लनु सुधा दृष्टिचे ब्रोचुवारॆन्दरो
    महानुभावुलु हॊयलु मीर नडलु गल्ग्गु सरसुनि सदा कनुल जूचुचुनु पुलक शरीरुलै आनन्द पयोधि निमग्नुलै मुदम्बुननु
    यशमु गलवारॆन्दरो महानुभावुलु परम भागवत मौनि वर शशि विभाकर सनक सनन्दन दिगीश सुर किम्पुरुष कनक कशिपु
    सुत नारद तुम्बुरु पवनसूनु बालचन्द्र धर शुक सरोजभव भूसुरवरुलु परम पावनुलु घनुलु शाश्वतुलु कमल भव सुखमु
    सदानुभवुलु गाक ऎन्दरो महानुभावुलु नी मेनु नाम वैभवम्बुलनु नी पराक्रम धैर्यमुल शान्त मानसमु नीवुलनु
    वचन सत्यमुनु रघुवर नीयॆड सद्भक्तियु जनिञ्चकनु दुर्मतमुलनु कल्ग जेसिनट्टि नीमदि नॆरिङ्गि सन्तसम्बुननु
    गुण भजनानन्द कीर्तनमु जेयु वारॆन्दरो महानुभावुलु भागवत रामायण गीतादि शृति शास्त्र पुराणपु मर्ममुलनु
    शिवादि सन्मतमुल गूढमुलन् मुप्पदि मुक्कोटि सुरान्तरङ्गमुल भावम्बुलनॆरिगि भाव राग लयादि सौख्यमुचे चिरायुवुल्गलिगि
    निरवधि सुखात्मुलै त्यागराप्तुलैन वारॆन्दरो महानुभावुलु प्रेम मुप्पिरि गॊनु वेल नाममुनु दलचेवारु रामभक्तुडैन
    त्यागराजनुतुनि निज दासुलैनन वारॆन्दरो महानुभावुलु अन्दरिकी वन्दनमु
