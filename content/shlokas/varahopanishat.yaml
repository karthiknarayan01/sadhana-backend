id: varahopanishat
category: upanishad
name:
  english: varahopanishat
  devanagari: वराहोपनिषत्
content:
  english: varahopanishat shrimadvarahopanishadvedyakhandasukhakriti | tripannarayanakhyam tadramacandrapadam
    bhaje || om saha navavatu saha nau bhunaktu saha viryam karavavahai || tejasvinavadhi tamastu ma vidvishavahai
    || om shantih shantih shantih || harih om || atha ribhurvai mahamunirdevamanena dvadashavatsaram tapashcacara
    | tadavasane varaharupi bhagavanpradurabhut | sa hovacottishthottishtha varam vrinishveti | sodatishthat
    | tasmai namaskrityovaca bhagavankamibhiryadyatkamitam tattattvatsakashatsvapne'pi na yace | samastavedashastretihasapuranani
    samastavidyajalani brahmadayah surah sarve tvadrupajnananmuktimahuh | atastvadrupapratipadikam brahmavidyam
    bruhiti hovaca | tatheti sa hovaca varaharupi bhagavan | caturvimshatitattvani kecidicchanti vadinah
    | kecitshattrimshattattvani kecitshannavatini ca || 1|| tesham kramam pravakshyami savadhanamanah
    shrinu | jnanendriyani pancaiva shrotratvaglocanadayah || 2|| karmendriyani pancaiva vakpanyanghryadayah
    kramat | pranadatastu pancaiva panca shabdadayastatha || 3|| manobuddhirahamkarashcittam ceti catushtayam
    | caturvimshatitattvani tani brahmavido viduh || 4|| etaistattvaih samam pancikritabhutani panca ca
    | prithivyapastatha tejo vayurakashameva ca || 5|| dehatrayam sthulasukshmakaranani vidurbudhah |
    avasthatritayam caiva jagratsvapnasushuptayah || 6|| ahatya tattvajatanam shattrimshanmunayo viduh
    | purvoktaistattvajataistu samam tattvani yojayet || 7|| shadbhavavikritishcasti jayate vardhate'pi
    ca | parinamam kshayam nasham shadbhavavikritim viduh || 8|| ashana ca pipasa ca shokamohau jara mritih
    | ete shadurmayah proktah shatkoshanatha vacmi te || 9|| tvakca raktam mamsamedomajjasthini nibodhata
    | kamakrodhau lobhamohau mado matsaryameva ca || 1
  devanagari: वराहोपनिषत् श्रीमद्वाराहोपनिषद्वेद्याखण्डसुखाकृति । त्रिपान्नारायणाख्यं तद्रामचन्द्रपदं
    भजे ॥ ॐ सह नाववतु सह नौ भुनक्तु सह वीर्यं करवावहै ॥ तेजस्विनावधी तमस्तु मा विद्विषावहै ॥ ॐ शान्तिः
    शान्तिः शान्तिः ॥ हरिः ॐ ॥ अथ ऋभुर्वै महामुनिर्देवमानेन द्वादशवत्सरं तपश्चचार । तदवसाने वराहरूपी भगवान्प्रादुरभूत्
    । स होवाचोत्तिष्ठोत्तिष्ठ वरं वृणीश्वेति । सोदतिष्ठत् । तस्मै नमस्कृत्योवाच भगवन्कामिभिर्यद्यत्कामितं
    तत्तत्त्वत्सकाशात्स्वप्नेऽपि न याचे । समस्तवेदशास्त्रेतिहासपुराणानि समस्तविद्याजालानि ब्रह्मादयः सुराः
    सर्वे त्वद्रूपज्ञानान्मुक्तिमाहुः । अतस्त्वद्रूपप्रतिपादिकां ब्रह्मविद्यां ब्रूहीति होवाच । तथेति
    स होवाच वराहरूपी भगवान् । चतुर्विंशतितत्त्वानि केचिदिच्छन्ति वादिनः । केचित्षट्त्रिंशत्तत्त्वानि केचित्षण्णवतीनि
    च ॥ १॥ तेषां क्रमं प्रवक्ष्यामि सावधानमनाः शृणु । ज्ञानेन्द्रियाणि पञ्चैव श्रोत्रत्वग्लोचनादयः ॥ २॥
    कर्मेन्द्रियाणि पञ्चैव वाक्पाण्यङ्घ्र्यादयः क्रमात् । प्राणादतस्तु पञ्चैव पञ्च शब्दादयस्तथा ॥ ३॥ मनोबुद्धिरहंकारश्चित्तं
    चेति चतुष्टयम् । चतुर्विंशतितत्त्वानि तानि ब्रह्मविदो विदुः ॥ ४॥ एतैस्तत्त्वैः समं पञ्चीकृतभूतानि
    पञ्च च । पृथिव्यापस्तथा तेजो वायुराकाशमेव च ॥ ५॥ देहत्रयं स्थूलसूक्ष्मकारणानि विदुर्बुधाः । अवस्थात्रितयं
    चैव जाग्रत्स्वप्नसुषुप्तयः ॥ ६॥ आहत्य तत्त्वजातानां षट्त्रिंशन्मुनयो विदुः । पूर्वोक्तैस्तत्त्वजातैस्तु
    समं तत्त्वानि योजयेत् ॥ ७॥ षड्भावविकृतिश्चास्ति जायते वर्धतेऽपि च । परिणामं क्षयं नाशं षड्भावविकृतिं
    विदुः ॥ ८॥ अशना च पिपासा च शोकमोहौ जरा मृतिः । एते षडूर्मयः प्रोक्ताः षट्कोशानथ वच्मि ते ॥ ९॥ त्वक्च
    रक्तं मांसमेदोमज्जास्थीनि निबोधत । कामक्रोधौ लोभमोहौ मदो मात्सर्यमेव च ॥ १
