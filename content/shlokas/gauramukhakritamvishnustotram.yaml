id: gauramukhakritamvishnustotram
category: stotram
name:
  english: gauramukhakritamvishnustotram
  devanagari: गौरमुखकृतंविष्णुस्तोत्रम्
content:
  english: gauramukhakritam vishnustotram gauramukha uvaca | stoshye mahendram ripudarpaham shivam narayanam
    brahmavidam pratishthitam | adityacandrashviyugasthamadyam puratanam daityaharam sada harim || 9||
    cakara matsyam vapuratmano yah purakritam vedavinashakale | mahamahidhrigvapuragrapucchacchatahavarccih
    surashatruha''dyah || 10|| tathabdhimanthanakrite girindram dadhara yah kaurmmavapuh puranam | hitecchaya
    yah purushah puranah prapatu mam daityaharah sureshah || 11|| mahavarahah satatam prithivyastalattalam
    pravishadyo mahatma | yajnangasamjnah surasiddhavandyah sa patu mam daityaharah puranah || 12|| nrisimharupi
    ca bhavatyajasram yuge yuge yogivarograbhimah | karalavaktrah kanakagravarca ratnashayo'smanasurantako'vyat
    || 13|| balermakhadhvamsakrite mahatma svam gudhatam yogavapuhsvarupah | sa dandakashthajinalakshanah
    punah kshitim pada''krantavan yah sa patu || 14|| trihsaptakritvo jagatim jigaya jitva dadau kashyapaya
    pracandah | sa jamadagnyo'bhijanasya gopta hiranyagarbho'suraha prapatu || 15|| catuhprakaram ca vapurya
    adyam hairanyagarbhapratimanalakshyam | ramadirupairbahurupabhedashcakara so'smanasurantako'vyat ||
    16|| canurakamsasuradarpabhiterbhitamaranamabhayaya devah | yuge yuge vasudevo babhuva kalpe bhavatyadbhutarupakari
    | yuge yuge kalkinamna mahatma varnasthitim karttumanekamurttih || 17|| sanatano brahmamayah purano
    na yasya rupam surasiddhadaityah | pashyanti vijnanagatim vihaya atho'pyanekani samarcvayanti | matsyadirupani
    carani so'vyat || 18|| namo namaste purushottamaya punashca bhuyo'pi namo namaste | namah purastadatha
    prishthataste nayasva mam muktipadam namaste || 19|| evam namasyatastasya maharsherbhavitatmanah |
    pratyakshatam gato devah svayam cakragadadharah || 20|| tam drishtva tasya vijnanam nistarangam svadehatah
    | uttasthau so'pi tam labdhva tasmin brahmani shashvate | layam jagama devatma tvapunarbhavasamjnite
    || 21|| iti shrivarahapurane pancadashadhyayantargatam gauramukhakritam vishnustotram samaptam | varahapurana
    | adhyaya 15
  devanagari: गौरमुखकृतं विष्णुस्तोत्रम् गौरमुख उवाच । स्तोष्ये महेन्द्रं रिपुदर्पहं शिवं नारायणं ब्रह्मविदां
    प्रतिष्ठितम् । आदित्यचन्द्राश्वियुगस्थमाद्यं पुरातनं दैत्यहरं सदा हरिम् ॥ ९॥ चकार मात्स्यं वपुरात्मनो
    यः पुराकृतं वेदविनाशकाले । महामहीधृग्वपुरग्रपुच्छच्छटाहवार्च्चिः सुरशत्रुहाऽऽद्यः ॥ १०॥ तथाब्धिमन्थानकृते
    गिरीन्द्रं दधार यः कौर्म्मवपुः पुराणम् । हितेच्छया यः पुरुषः पुराणः प्रपातु मां दैत्यहरः सुरेशः ॥
    ११॥ महावराहः सततं पृथिव्यास्तलात्तलं प्राविशद्यो महात्मा । यज्ञाङ्गसंज्ञः सुरसिद्धवन्द्यः स पातु मां
    दैत्यहरः पुराणः ॥ १२॥ नृसिंहरूपी च भवत्यजस्रं युगे युगे योगिवरोग्रभीमः । करालवक्त्रः कनकाग्रवर्चा
    रत्नाशयोऽस्मानसुरान्तकोऽव्यात् ॥ १३॥ बलेर्मखध्वंसकृते महात्मा स्वां गूढतां योगवपुःस्वरूपः । स दण्डकाष्ठाजिनलक्षणः
    पुनः क्षितिं पदाऽऽक्रान्तवान् यः स पातु ॥ १४॥ त्रिःसप्तकृत्वो जगतीं जिगाय जित्वा ददौ कश्यपाय प्रचण्डः
    । स जामदग्न्योऽभिजनस्य गोप्ता हिरण्यगर्भोऽसुरहा प्रपातु ॥ १५॥ चतुःप्रकारं च वपुर्य आद्यं हैरण्यगर्भप्रतिमानलक्ष्यम्
    । रामादिरूपैर्बहुरूपभेदश्चकार सोऽस्मानसुरान्तकोऽव्यात् ॥ १६॥ चाणूरकंसासुरदर्पभीतेर्भीतामराणामभयाय
    देवः । युगे युगे वासुदेवो बभूव कल्पे भवत्यद्भुतरूपकारी । युगे युगे कल्किनाम्ना महात्मा वर्णस्थितिं
    कर्त्तुमनेकमूर्त्तिः ॥ १७॥ सनातनो ब्रह्ममयः पुराणो न यस्य रूपं सुरसिद्धदैत्याः । पश्यन्ति विज्ञानगतिं
    विहाय अथोऽप्यनेकानि समर्च्वयन्ति । मत्स्यादिरूपाणि चराणि सोऽव्यात् ॥ १८॥ नमो नमस्ते पुरुषोत्तमाय पुनश्च
    भूयोऽपि नमो नमस्ते । नमः पुरस्तादथ पृष्ठतस्ते नयस्व मां मुक्तिपदं नमस्ते ॥ १९॥ एवं नमस्यतस्तस्य महर्षेर्भावितात्मनः
    । प्रत्यक्षतां गतो देवः स्वयं चक्रगदाधरः ॥ २०॥ तं दृष्ट्वा तस्य विज्ञानं निस्तरङ्गं स्वदेहतः । उत्तस्थौ
    सोऽपि तं लब्ध्वा तस्मिन् ब्रह्मणि शाश्वते । लयं जगाम देवात्मा त्वपुनर्भवसंज्ञिते ॥ २१॥ इति श्रीवराहपुराणे
    पञ्चदशाध्यायान्तर्गतं गौरमुखकृतं विष्णुस्तोत्रं समाप्तम् । वराहपुराण । अध्याय १५
