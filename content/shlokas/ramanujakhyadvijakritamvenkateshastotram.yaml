id: ramanujakhyadvijakritamvenkateshastotram
category: stotram
name:
  english: ramanujakhyadvijakritamvenkateshastotram
  devanagari: रामानुजाख्यद्विजकृतंवेन्कटेशस्तोत्रम्
content:
  english: ramanujakhyadvijakritam venkateshastotram venkatesham dayalum tam tushtava tapaso dvijah |
    namo ramaya cakradidharine mahate namah || 77|| nityashuddhasvarupaya namo bhaktartiharine | paravyuhavibhavaya'rcadirupaya
    te namah || 78|| antaryamisvarupatmavyapine te namo namah | shrikrishnaya mahabhumne narayanaya te
    namah || 79|| namo hiranyagarbhaya vairajaya ca vedhase | sadashivaya kantaya vishnave brahmane namah
    || 80|| ishvareshayeshvaraya pushpavannetrine namah | namajatyadiparaya namajatyadirupine || 81||
    kambhareyaya krishnaya gopimandalarasine | gopalajaya gosevasnigdhaya te namo namah || 82|| vedantanyayavedyaya
    bhashyaya bhashyakarine | agamantahsugataye lokarakshaya te namah || 83|| saurashtra''vihsvarupaya
    raivatacalavasine | ashvapattakshitishaya pushkararanyashaline || 84|| kasheshvaraya rangadipujitaya
    ca te namah | iti stutva shrinivasam ramanuja iyaya sham || 85|| iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 403
  devanagari: रामानुजाख्यद्विजकृतं वेङ्कटेशस्तोत्रम् वेङ्कटेशं दयालुं तं तुष्टाव तापसो द्विजः । नमो रामाय
    चक्रादिधारिणे महते नमः ॥ ७७॥ नित्यशुद्धस्वरूपाय नमो भक्तार्तिहारिणे । परव्यूहविभवायाऽर्चादिरूपाय ते
    नमः ॥ ७८॥ अन्तर्यामिस्वरूपात्मव्यापिने ते नमो नमः । श्रीकृष्णाय महाभूम्ने नारायणाय ते नमः ॥ ७९॥ नमो
    हिरण्यगर्भाय वैराजाय च वेधसे । सदाशिवाय कान्ताय विष्णवे ब्रह्मणे नमः ॥ ८०॥ ईश्वरेशायेश्वराय पुष्पवन्नेत्रिणे
    नमः । नामजात्यादिपाराय नामजात्यादिरूपिणे ॥ ८१॥ काम्भरेयाय कृष्णाय गोपीमण्डलरासिने । गोपालजाय गोसेवास्निग्धाय
    ते नमो नमः ॥ ८२॥ वेदान्तन्यायवेद्याय भाष्याय भाष्यकारिणे । आगमान्तःसुगतये लोकरक्षाय ते नमः ॥ ८३॥ सौराष्ट्राऽऽविःस्वरूपाय
    रैवताचलवासिने । अश्वपट्टक्षितीशाय पुष्करारण्यशालिने ॥ ८४॥ काशेश्वराय रङ्गादिपूजिताय च ते नमः । इति
    स्तुत्वा श्रीनिवासं रामानुज इयाय शम् ॥ ८५॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने ४०३
