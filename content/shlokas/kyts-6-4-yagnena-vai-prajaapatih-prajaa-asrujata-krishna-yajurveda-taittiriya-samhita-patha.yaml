id: kyts-6-4-yagnena-vai-prajaapatih-prajaa-asrujata-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 6.4 Yagnena Vai Prajaapatih Prajaa Asrujata - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitayam shashthakande caturthah prashnah somamantrabrahmananirupanam
    o shri gurubhyo namah | harih om || yajnena vai prajapatih praja asrijata ta upayadbhi revasrijata
    yadupayaja upayajati praja eva ta ssrijate jaghanardhadava dyati jaghanardhaddhi prajah prajayante
    sthavimato 'va dyati sthavimato hi prajah prajayante 'sambhindannava dyati pranana masambhedaya na
    paryavartayati ya tparyavartayedudavartah praja grahuka ngaccha svahetyaha reta ngaccha svahetyaha
    'ntarikshenaivasmai prajah pra janayatyantarikshagg hyanu prajah prajayante devagm savitara ngaccha
    svahetyaha savitriprasuta evasmai horatre gaccha svahetyaha horatre hyanu prajah prajayante mitravarunau
    gaccha svahe tyaha prajasveva prajatasu pranapanau dadhati soma ngaccha svahetyaha saumya hi devataya
    praja yajna ngaccha svahetyaha praja eva yajniyah karoti chandagmsi gaccha svahetyaha pashavo vai
    chandagmsi pashunevava rundhe dyavaprithivi gaccha svahetyaha praja eva prajata dyavaprithivibhyamubhayatah
    pari grihnati nabho ngaccha svahetyaha prajabhya eva prajatabhyo vrishti ngaccha svahetyaha praja
    eva prajata asya mprati shthapayati prananam 'vadyati gudasya mano me hardi yacchetyaha prananeva
    yathasthanamupa hvayate pashorva alabdhasya hridayagm shugricchati sa hridayashula tprithivyagm hridayashula
    'rpayecchushkasya ca ''rdrasya ca sandhavudvasayatyubhayasya shantyai ya mitravarunau gaccha svaha
    deva vai yajnamagni ddhre vyabhajanta tato yadatyashishyata tadabruvan vasatu nu na idamiti ta npratarna
    samashaknuva ntadaphsu praveshaya nta vasati varirabhavan vasativari rgrihnati yajno vai vasati vari
    ''rabhya grihitvopa vasati yasyagrihita abhi nimroce jjyotishya va grihniyaddhiranyam va~ 'vadhaya
    sashukranameva grihnati yo va brahmano bahuyaji tasya kumbhyana thsa hi grihita vasativariko vasativari
    rgrihnati pashavo vai vasativarih ''rabhya grihitvopa vasati yadanvipa ngrihniyannirmarguka asma tpashavah
    syuh pratipa ngrihnati pratiruddhyaivasmai pashu ya~jniyagm sadevamasi ttadatyamucyata ta vahantirabhavan
    vahantina ngrihnati ya eva meddhya yajniya ssadeva apasta sameva grihnati nantama vahantiratiya dyadantama
    vahantiratiya dyajnamati manyeta na sthavarana dvarunagrihita vai sthavara ya dyadvai diva bhavatyapo
    ratrih pra vishati tasma ttamra apo diva dadrishre yannakta 'hah pra vishati tasma ccandra apo nakta
    ndadrishre chayayai ca horatrayorevasmai varna ngrihnati havishmatirima apa ityaha havishkritanameva
    grihnati havishmagm astu surya ityaha sashukranameva grihnatyanushtubha grihnati vagva anushtug vacaivaina
    ssarvaya grihnati catushpadayarca grihnati tri mpadyante saptapada shakvari pashava shshakvari pashunevava
    rundhe 'smai vai lokaya gar 'mushma ahavaniyo ya hapatya upasadayedasmin ~loke pashuman dubhayorupa
    sadayatyubhayorevainam nkaroti sarvatah pari harati rakshasamapahatya indragniyorbhagadheyi ssthetyaha
    yathayajurevaitadagni ddhra upa vasayatyetadvai yajnasyaparajitam ya~deva yajnasyaparajita ntadevaina
    upa vasayati yatah khalu vai yajnasya vitatasya na kriyate tadanu yajnagm rakshagsyava caranti ya
    ngrihnati kriyamanameva ta dyajnasya shaye rakshasa mananvavacaraya na hyeta ilayantya tritiyasavana
    tpari shere yajnasya santatyai || brahmavadino vadanti sa tva addhvaryu diti hride tvetyaha manushye
    bhya evaitena karoti manase tvetyaha pitribhya evaitena karoti dive tva suryaya tvetyaha devebhya
    evaitena karotyetavati rvai devatastabhya evainagm sarva bhya upavaharati pura vacah pravaditoh prataranuvaka
    mupakaroti yavatyeva va 'bhivyaharati yajno va apo yajnamevabhi vacam vi~srijati sarvani chandagsyanvaha
    pashavo vai chandagmsi pashunevava rundhe gayatriya tejaskamasya pari daddhya ndriyakamasya jagatya
    pashukamasya pratishthakamasya panktya yajnakamasya viraja 'nnakamasya shrinotvagni mma ityaha savitriprasuta
    eva devata rityaheshitagm hi karma kriyate maitravarunasya camasaddhvaryava dravetyaha mitravarunau
    va apa nnetarau tabhyamevaina acchaiti devirapo apa ''hutyaivaina nishkriya grihnatyatho havishkritana
    rasityaha shamalameva ''samapa plavayati samudrasya vo 'kshitya unnaya ityaha tasmadadyamanah piyamana
    apo na kshiyante yonirvai yajnasya catvalam ya~jno vasativarir shya vasativarirvyanayati yajnasya
    sayonitvayatho svadevaina yoneh pra janayatyaddhvaryo manannamurutemah pashyeti vavaitadaha yadyagnishtomo
    juhoti yadyukthyah paridhau ni ma shti yadyatiratro yajurvada npra padyate yajnakratunam devasya tva
    savituh prasava iti gravanama datte prasu rbahubhyamityahashvinau hi devanamaddhvaryu asta bhyamityaha
    yatyai pashavo vai somo vyana upagmshusavano yadupagmshusavana mabhi mimite vyanameva pashushu dadhatindraya
    tvendraya tveti mimita indraya hi soma ahriyate panca kritvo yajusha mimite kshara panktih pankto
    yajno yajnamevava rundhe panca kritvastushni dvirajaivannadyamava rundhe shvatra sstha vritratura
    ityahaisha va apagm somapitho ya evam 'phsvartimarcchati yatte soma divi jyotirityahaibhya evaina
    mbharati somo vai raja disho tpragapagudagadharagityaha digbhya evainagm sa mbharatyatho disha evasma
    ava rundhe 'mba ni shvaretyaha kamuka enagg striyo bhavanti ya evam tyahaisha vai somasya somapitho
    ya evam ve~da na saumyamartimarcchati ghnanti va eta ya~dabhishunvantyagm shunapa grihnati trayata
    evaina mprana va agmshavah pashava npunarapi srijati prananeva pashushu dadhati dvaudvavapi srijati
    tasma catushcatvarigmshacca prano va esha yadupagmshu ryadupagshvagra graha grihyante pranamevanu
    pra yantyaruno ha sma ''haupaveshih pratassavana evaham sthapayami tena tata sthitena caramityashtau
    kritvo tyashtakshara gayatri gayatra mpratassavanameva tena ''pnotyekadasha kritvo mekadashakshara
    trishtu mmaddhyandinagm mmaddhyandinameva savana ''pnoti dvadasha kritvastritiya ndvadashakshara jagati
    jagata ntritiyasavanameva tena ''pnotyetagm ha vava sa yajnasya sagg sthitimuvaca skandayaskannagm
    hi ta sthitasya skandatyatho khalvahurgayatri vava pratassavane nativada ityanativaduka ena mbhratrivyo
    bhavati ya evam mbrahmavadino vadanti pavitravanto 'nye graha grihyante kimpavitra upagmshuriti vakpavitra
    iti bruya dvacaspataye pavasva vajinnityaha vacaivaina mpavayati vrishno agmshubhyamityaha vrishno
    hyetavagmshu yau somasya gabhastiputa ityaha gabhastina hyena mpavayati devo devana mpavitramasityaha
    devo hyesha 'si tebhyastvetyaha yeshag hyesha bhagastebhya ena 'sityaha pranameva svamakrita madhumatirna
    ishaskridhityaha sarvamevasma idagg stvendriyebhyo divyebhyah parthivebhya ityahobhaye shveva devamanushyeshu
    prana ndadhati manastva 'shtvityaha mana evashnuta urvantariksha ntarikshadevatyo hi prana ssuryayetyaha
    prana vai svabhavaso devasteshveva paroksha njuhoti devebhyastva maricipebhya ityaha ''dityasya vai
    rashmayo deva maricipastesha ntaneva tena prinati yadi kamayeta var ssyaditi nica hastena ni mrijya
    dvrishtimeva ni yacchati yadi kamayetavar ssyadityuttanena ni mrijya dyacchati yadyabhicaredamu njahyatha
    tva hoshyamiti bruyadahutimevaina hanti yadi dure syada tamitostishthe tpranamevasyanugatya hanti
    yadyabhicaredamushya yadyabhicaredamushya tva prane sadayamiti sadayedasanno vai pranah pranamevasya
    sadayati shadbhiragmshubhih pavayati sha dva ritava ritubhirevaina mpavayati trih pavayati traya ime
    loka ebhirevainam lo~kaih pavayati brahmavadino vadanti kasma ttrayah pashunagm hastadana iti ya ttrirupagm
    shugm hastena vigrihnati tasma ttrayah pashunagm hastadanah purusho hasti markatah || 'kurvata tadasura
    akurvata te deva upagmshau yajnagm saggsthapyamapashya ntamupagmshau samasthapaya 'sura vajramudyatya
    devanabhyayanta te deva bibhyata indramupadhava 'ntaryamenantaradhatta tadantaryamasya ya~dantaryamo
    grihyate bhratrivyaneva ta 'ntardhatte 'ntaste 'ntardhatte 'ntaste dadhami dyavaprithivi dadhami dyavaprithivi
    antaru mityahaibhireva lokairyajamano bhratrivyanantardhatte te deva amanyantendro va idamabhudya
    nmaghavannanu na a bhajeti sajosha devairavaraih paraishcetyabravidye caiva devah pare ye cavare tanubhaya
    thsajosha devairavaraih paraishcetyaha ye caiva devah pare ye cavare tanubhaya nmadayasvetyaha yajnadeva
    yajamana grihito 'sityahapanasya dhrityai yadubhavapavitrau grihyeyata tpavitravanantaryamo grihyate
    rvidhrityai pranapanau va etau yadupag shvantaryamau vyana upagmshu savano ya nkamayeta pramayuka
    ssyadityasagg sprishtau tasya sadaye dvyanenaivasya pranapanau vi cchinatti taja nkamayeta sarvamayuriyaditi
    sagg sprishtau tasya sadaye dvyanenaivasya pranapanau sa ntanoti sarvamayureti || catushcatvarigmshacca
    ndravayavagra graha grihyante vacamevanu pra yanti vayu thsomagm rajanagm hanameti so vri~nai madagra
    eva vo graha grihyanta iti tasmadaindravayavagra graha grihyante tamaghnan ndeva nopadhrishnuva nyucyanta
    iti tasma nnanadevatyani santi vayavya bhyo vayurevasvadaya tpravate vi shajanti vayur hi tasya pavayita
    svadayita tasya vigrahana vri~na atha maya vi grihniddhva mmaddevatya eva va nnityupayamagrihito stena
    yani hi darumayani patra nyasyai tani yone ssambhutani yani mrinmayani saksha ttanyasyai tasmadevamaha
    vagvai paracya tte deva indramabruvannima ncaivaisha vayave ca saha grihyata iti tasmadaindravayava
    ssaha grihyate tamindro maddhyato 'vakramya vyakaro vya~krita vagudyate tasma thsakridindraya maddhyato
    grihyate dvirvayave dvau hi sa varavavrinita || thsomagm rajanagm hanameti so 'bravinnahagm sarvasya
    va aha mmitramasmiti tamabruvan vri~nai payasaiva me somagg shrinanniti tasma mpayasa shrinanti tasma
    ssan kruramakariti kruramiva khalu va esha ssomena yajate tasma 'pa kramanti yanmai mpayasa shrinati
    pashubhireva tanmitragm samardhayati pashubhiryajamana ncakrushah pashavah kramishyantiti tasmadevamavrinita
    varuna 'gmshabhuva somagm rajanagm hanameti so vaisha mitraya ca saha grihyata iti tasma ssaha grihyate
    tasma drajna rajanamagmshabhuva ghnanti vaishyena vaishyagm shudrena shudra ndiva na naktamasidavyavritta
    nte deva mitravarunavabruvannida nno vivasayatamiti tavabrutam tpurvo graho grihyata iti tasmadaindravayavah
    purvo maitravaruna dgrihyate pranapanau hyetau yadupag shvantaryamau mitro travaruno grihyate vyushtyai
    || 'cchidyata te deva ashvinavabruva nbhishajau vai stha idam ya~jnasya shirah prati dhattamiti tavabrutam
    vri~navahai graha eva navatrapi grihyatamiti tabhya ntato vai tau yajnasya shirah pratyadhattam shvino
    grihyate yajnasya nishkrityai tau deva abruvannaputau va imau manushyacarau dbrahmanena bheshaja nna
    karyamaputo hye sho 'meddhyo yo bhishaktau bahishpavamanena pavayitva tabhya dbahishpavamane stuta
    a shvino grihyate tasmadevam vi~dusha bahishpavamana upasadyah pavitram vai~ bahishpavamana atmanameva
    pavayate tayo 'stredha bhaishajyam vi~ nyadadhuragnau tritiyamaphsu tritiya mbrahmane tritiya mupanidhaya
    brahmana ndakshinato nishadya bheshaja ntena karoti samardhukamasya krita mbhavati brahmavadino vadanti
    kasma thsatyadekapatra dvidevatya grihyante dvipatra huyanta iti yadekapatra grihyante tasmadeko 'ntaratah
    prano dvipatra huyante tasma ddvaudvau bahishta tpranah prana va ete ya pashubhih prananantardadhita
    pramayuka nbhakshayitvedamupa hvayate prananeva ndhitva pashunupa hvayate vagva ai shshrotramashvinah
    purastadaindravayava dvaca vadati purasta tpurastaccakshusha pashyati sarvatah pariharamashvina shshrotrena
    shrinoti prana va ete ya ariktani patrani sadayati tasmadarikta antaratah prana yatah khalu vai yajnasya
    vitatasya na kriyate tadanu yajnagm rakshagsyava caranti yadariktani patrani sadayati kriyamanameva
    ta dyajnasya shaye rakshasa mananvavacaraya dakshinasya havirdhanasyottarasyam va~rtanyagm sadayati
    vacyeva vaca ndadhatya tritiyasavana tpari shere yajnasya santatyai || mbrahman vanto deva asa vupamantrayanta
    ta vabrutam vri~navahai grahaveva navatrapi grihyetamiti tabhyametau shukramanthina vi~dushah shukramanthinau
    grihyete bhavatyatmana para 'sya bhratrivyo bhavati tau deva apanudya ''tmana indrayajuhavu rapanuttau
    shandamarkau sahamuneti bruyadya ndvishyadyameva dveshti tenainau sahapa nudate sa prathama rvishvakarmetyevaina
    juhavurindro hyetani rupani karikradacaradasau va aditya shshukrashcandrama manthyapi tprancau yantau
    na pashyanti pratyancavavritya juhutastasma tpratyancau yantau pashyanti cakshushi va ete yajnasya
    yacchukramanthinau nasikottaravedirabhitah parikramya juhutastasmadabhito nasika ncakshushi tasmannasikaya
    cakshushi vidhrite sarvatah pari kramato rakshasamapahatyai deva vai yah pracirahutirajuhavurye purastadasura
    asa nudanta yah praticirye pashcadasura asa stabhirapanudanta praciranya ahutayo huyante pratyancau
    shukramanthinau pashcaccaiva purasta cca yajamano bhratrivya npra nudate tasma tparacih prajah pra
    viyante pratici rjayante shukramanthinau va anu prajah pra jayante suprajah prajah prajanaya nparihi
    manthi manthishocishetyahaita vai suvira ya attrireta ssupraja ya adya ya evam ve~datryasya praja
    jayate na prajapaterakshyashvaya dvikankate naramata ta shshrinati prajapatereva taccakshu mbharati
    brahmavadino vadanti kasma thsatyanmanthipatragm sado nashnuta itya rtapatragm hiti bruya ssyadartimarcche
    ttasmannashnute || 'kurvata tadasura akurvata te deva a ntanagrihnata tato vai te vi~dusha agrayanagra
    graha grihyante 'grameva samanana mparyeti rugnavatyarca bhratrivyavato grihniya dbhratrivyasyaiva
    ruktva mparyeti ye deva divyekadasha sthetyahai tavatirvai devatastabhya evainagm sarva bhyo grihnatyesha
    te yoni rvishve bhyastva devebhya ityaha vaishvadevo hyesha devataya vagvai devebhyo dyajnayatishthamana
    te deva vacyapakrantaya ngrahanagrihnata samanyata vagantaryanti vai meti sa ntasmadagrayane vagvi
    srijyate ya mpurve graha grihyante yatha thsariyati ma akha iyati napa rathsya mityupavasrijatyevameva
    tadaddhvaryura ngrihitva yajnamarabhya vacam dvrinite prajapatirva esha yada nkaroti prajapatireva
    tpraja abhi jighrati tasma ngaurabhi jighratyatma va esha yajnasya yada 'bhi grihnatyatmanneva yajnagm
    sa ntanotyuparishtada nayati reta eva ta ddadhatyadhastadupa grihnati pra janayatyeva tadbrahmavadino
    vadanti kasma dgayatri kanishtha chandasagm sati sarvani savanani vahatityesha vai gayatriyai vathso
    yada grayanastameva tadabhinivartagm sarvani savanani vahati tasma ngaurabhi ni vartate || yajnena
    ta upayadbhi rdeva vai yajnamagni prano va upagshvagra deva va upagmshau || harih om || || krishna
    yajurvediya taittiriya samhitayam shashthakande caturthah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां षष्ठकाण्डे चतुर्थः प्रश्नः सोममन्त्रब्राह्मणनिरूपणं
    ओ श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ य॒ज्ञेन॒ वै प्र॒जाप॑तिः प्र॒जा अ॑सृजत॒ ता उ॑प॒यड्भि॑ रे॒वासृ॑जत॒
    यदु॑प॒यज॑ उप॒यज॑ति प्र॒जा ए॒व त स्सृजते जघना॒र्धादव॑ द्यति जघना॒र्धाद्धि प्र॒जाः प्र॒जाय॑न्ते स्थविम॒तो
    ऽव॑ द्यति स्थविम॒तो हि प्र॒जाः प्र॒जाय॒न्ते ऽस॑म्भिन्द॒न्नव॑ द्यति प्रा॒णाना॒ मस॑म्भेदाय॒ न प॒र्याव॑र्तयति॒
    य त्प॑र्याव॒र्तये॑दुदाव॒र्तः प्र॒जा ग्राहु॑क ङ्ग॑च्छ॒ स्वाहेत्या॑ह॒ रेत॑ ङ्गच्छ॒ स्वाहेत्या॑हा॒ ऽन्तरि॑क्षेणै॒वास्मै
    प्र॒जाः प्र ज॑नयत्य॒न्तरि॑क्ष॒ग्ग्॒ ह्यनु॑ प्र॒जाः प्र॒जाय॑न्ते दे॒वग्ं स॑वि॒तार॑ ङ्गच्छ॒ स्वाहेत्या॑ह
    सवि॒तृप्र॑सूत ए॒वास्मै होरा॒त्रे ग॑च्छ॒ स्वाहेत्या॑हा होरा॒त्रे ह्यनु॑ प्र॒जाः प्र॒जाय॑न्ते मि॒त्रावरु॑णौ
    गच्छ॒ स्वाहे त्या॑ह प्र॒जास्वे॒व प्रजा॑तासु प्राणापा॒नौ द॑धाति॒ सोम॑ ङ्गच्छ॒ स्वाहेत्या॑ह सौ॒म्या
    हि दे॒वत॑या प्र॒जा य॒ज्ञ ङ्ग॑च्छ॒ स्वाहेत्या॑ह प्र॒जा ए॒व य॒ज्ञियाः करोति॒ छन्दाग्ं॑सि गच्छ॒ स्वाहेत्या॑ह
    प॒शवो॒ वै छन्दाग्ं॑सि प॒शूने॒वाव॑ रुन्धे॒ द्यावा॑पृथि॒वी ग॑च्छ॒ स्वाहेत्या॑ह प्र॒जा ए॒व प्रजा॑ता॒
    द्यावा॑पृथि॒वीभ्या॑मुभ॒यतः॒ परि॑ गृह्णाति॒ नभो॑ ङ्ग॑च्छ॒ स्वाहेत्या॑ह प्र॒जाभ्य॑ ए॒व प्रजा॑ताभ्यो॒
    वृष्टि॒ ङ्ग॑च्छ॒ स्वाहेत्या॑ह प्र॒जा ए॒व प्रजा॑ता अ॒स्या म्प्रति॑ ष्ठापयति प्रा॒णानां॒ ऽव॒द्यति॑ गु॒दस्य॒
    मनो॑ मे॒ हार्दि॑ य॒च्छेत्या॑ह प्रा॒णाने॒व य॑थास्था॒नमुप॑ ह्वयते प॒शोर्वा आल॑ब्धस्य॒ हृद॑य॒ग्ं॒ शुगृ॑च्छति॒
    सा हृ॑दयशू॒ल त्पृ॑थि॒व्याग्ं हृ॑दयशू॒ल ऽर्प॑ये॒च्छुष्क॑स्य चा॒ ऽऽर्द्रस्य॑ च स॒न्धावुद्वा॑सयत्यु॒भय॑स्य॒
    शान्त्यै॒ य मि॒त्रावरु॑णौ गच्छ॒ स्वाहा॒ दे॒वा वै य॒ज्ञमाग्नी द्ध्रे॒ व्य॑भजन्त॒ ततो॒ यद॒त्यशि॑ष्यत॒
    तद॑ब्रुव॒न् वस॑तु॒ नु न॑ इ॒दमिति॒ त न्प्रा॒तर्न सम॑शक्नुव॒ न्तद॒फ्सु प्रावे॑शय॒ न्ता व॑सती॒ वरी॑रभवन्
