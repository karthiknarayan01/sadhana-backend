id: shivasahasranamastotrashivapurana
category: sahasranama
name:
  english: shivasahasranamastotrashivapurana
  devanagari: शिवसहस्रनामस्तोत्रशिवपुराण
content:
  english: tejomayo dyutidharo lokamani ghrinarnavah | shucismitah prasannatma hyajeyo duratikramah ||
    106|| jyotirmayo jagannatho nirakaro jaleshvarah | tumbavino mahakayo vishokah shokanashanah || 107||
    trilokapastrilokeshah sarvashuddhiradhokshajah | avyaktalakshano devo vyakto'vyakto vishampatih ||
    108|| parah shivo vasurnasasaro manadharo yamah | brahma vishnuh prajapalo hamso hamsagatirvayah ||
    109|| vedha vidhata dhata ca srashta harta caturmukhah | kailasashikharavasi sarvavasi sadagatih ||
    110|| hiranyagarbho druhino bhutapalotha bhupatih | sadyogi yogavidyogi varado brahmanapriyah || 111||
    devapriyo devanatho devako devacintakah | vishamaksho virupaksho vrishado vrishavardhanah || 112||
    nirmamo nirahankaro nirmoho nirupadravah | darpaha darpado driptah sarvarthaparivartakah || 113||
    sahasrarcirbhutibhushah snigdhakritiradakshinah | bhutabhavyabhavannatho vibhavo bhutinashanah ||
    114|| artho'nartho mahakoshah parakaryaikapanditah | nishkantakah kritanando nirvyajo vyajamardanah
    || 115|| sattvavan sattvikah satyah kritasnehah kritagamah | akampito gunagrahi naikatma naikakarmakrit
    || 116|| supritah sukhadah sukshmah sukaro dakshinanilah | nandiskando dharo dhuryah prakatapritivardhanah
    || 117|| aparajitah sarvasaho govindah satvavahanah | adhritah svadhritah siddhah putamurtiryashodhanah
    || 118|| varahasha
  devanagari: तेजोमयो द्युतिधरो लोकमानी घृणार्णवः । शुचिस्मितः प्रसन्नात्मा ह्यजेयो दुरतिक्रमः ॥ १०६॥
    ज्योतिर्मयो जगन्नाथो निराकारो जलेश्वरः । तुम्बवीणो महाकायो विशोकः शोकनाशनः ॥ १०७॥ त्रिलोकपस्त्रिलोकेशः
    सर्वशुद्धिरधोक्षजः । अव्यक्तलक्षणो देवो व्यक्तोऽव्यक्तो विशांपतिः ॥ १०८॥ परः शिवो वसुर्नासासारो मानधरो
    यमः । ब्रह्मा विष्णुः प्रजापालो हंसो हंसगतिर्वयः ॥ १०९॥ वेधा विधाता धाता च स्रष्टा हर्ता चतुर्मुखः
    । कैलासशिखरावासी सर्वावासी सदागतिः ॥ ११०॥ हिरण्यगर्भो द्रुहिणो भूतपालोथ भूपतिः । सद्योगी योगविद्योगी
    वरदो ब्राह्मणप्रियः ॥ १११॥ देवप्रियो देवनाथो देवको देवचिन्तकः । विषमाक्षो विरूपाक्षो वृषदो वृषवर्धनः
    ॥ ११२॥ निर्ममो निरहङ्कारो निर्मोहो निरुपद्रवः । दर्पहा दर्पदो दृप्तः सर्वार्थपरिवर्तकः ॥ ११३॥ सहस्रार्चिर्भूतिभूषः
    स्निग्धाकृतिरदक्षिणः । भूतभव्यभवन्नाथो विभवो भूतिनाशनः ॥ ११४॥ अर्थोऽनर्थो महाकोशः परकार्यैकपण्डितः
    । निष्कण्टकः कृतानन्दो निर्व्याजो व्याजमर्दनः ॥ ११५॥ सत्त्ववान् सात्त्विकः सत्यः कृतस्नेहः कृतागमः
    । अकम्पितो गुणग्राही नैकात्मा नैककर्मकृत् ॥ ११६॥ सुप्रीतः सुखदः सूक्ष्मः सुकरो दक्षिणानिलः । नन्दिस्कन्दो
    धरो धुर्यः प्रकटप्रीतिवर्धनः ॥ ११७॥ अपराजितः सर्वसहो गोविन्दः सत्ववाहनः । अधृतः स्वधृतः सिद्धः पूतमूर्तिर्यशोधनः
    ॥ ११८॥ वाराहश
