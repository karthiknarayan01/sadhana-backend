id: bhuvaneshvaryashtottarashatanamastotram-2
category: stotram
name:
  english: bhuvaneshvaryashtottarashatanamastotram 2
  devanagari: भुवनेश्वर्यष्टोत्तरशतनामस्तोत्रम् २
content:
  english: shribhuvaneshvaryashtottarashatanamastotram atha shribhuvaneshvaryashtottarashatanamastotram
    | ishvara uvaca | om mahasammohini devi sundari bhuvaneshvari | ekakshari ekamantri ekaki lokanayika
    || 1|| ekarupa maharupa sthulasukshmasharirini | bijarupa mahashaktih sangrame jayavardhini || 2||
    maharatirmahashaktiryogini papanashini | ashtasiddhih kalarupa vaishnavi bhadrakalika || 3|| bhaktipriya
    mahadevi haribrahmadirupini | shivarupi vishnurupi kalarupi sukhasini || 4|| purani punyarupa ca parvati
    punyavardhini | rudrani parvatindrani shankarardhasharirini || 5|| narayani mahadevi mahishi sarvamangala
    | akaradikshakaranta hyashtatrimshatkaladhari || 6|| saptama triguna nari sharirotpattikarini | akalpantakalavyapisrishtisamharakarini
    || 7|| sarvashaktirmahashaktih sharvani parameshvari | hrillekha bhuvana devi mahakaviparayana ||
    8|| icchajnanakriyarupa animadigunashtaka | namah shivayai shantayai shankari bhuvaneshvari || 9||
    vedavedangarupa ca atisukshma sharirini | kalajnani shivajnani shaivadharmaparayana || 10|| kalantari
    kalarupi samjnana pranadharini | khadgashreshtha ca khatvangi trishulavaradharini || 11|| arupa bahurupa
    ca nayika lokavashyaga | abhaya lokaraksha ca pinaki nagadharini || 12|| vajrashaktirmahashaktih pashatomaradharini
    | ashtadashabhuja devi hrillekha bhuvana tatha || 13|| khadgadhari maharupa somasuryagnimadhyaga |
    evam shatashtakam nama stotram ramanabhashitam || 14|| sarvapapaprashamanam sarvarishtanivaranam |
    sarvashatrukshayakaram sada vijayavardhanam || 15|| ayushkaram pushtikaram rakshakaram yashaskaram
    | amaradipadaishvaryamamatvamshakalapaham || 16|| iti shrirudrayamale tantre bhuvaneshvaryashtottarashatanama
    samaptam |
  devanagari: श्रीभुवनेश्वर्यष्टोत्तरशतनामस्तोत्रम् अथ श्रीभुवनेश्वर्यष्टोत्तरशतनामस्तोत्रम् । ईश्वर उवाच
    । ॐ महासम्मोहिनी देवी सुन्दरी भुवनेश्वरी । एकाक्षरी एकमन्त्री एकाकी लोकनायिका ॥ १॥ एकरूपा महारूपा
    स्थूलसूक्ष्मशरीरिणी । बीजरूपा महाशक्तिः सङ्ग्रामे जयवर्धिनी ॥ २॥ महारतिर्महाशक्तिर्योगिनी पापनाशिनी
    । अष्टसिद्धिः कलारूपा वैष्णवी भद्रकालिका ॥ ३॥ भक्तिप्रिया महादेवी हरिब्रह्मादिरूपिणी । शिवरूपी विष्णुरूपी
    कालरूपी सुखासिनी ॥ ४॥ पुराणी पुण्यरूपा च पार्वती पुण्यवर्धिनी । रुद्राणी पार्वतीन्द्राणी शङ्करार्धशरीरिणी
    ॥ ५॥ नारायणी महादेवी महिषी सर्वमङ्गला । अकारादिक्षकारान्ता ह्यष्टात्रिंशत्कलाधरी ॥ ६॥ सप्तमा त्रिगुणा
    नारी शरीरोत्पत्तिकारिणी । आकल्पान्तकलाव्यापिसृष्टिसंहारकारिणी ॥ ७॥ सर्वशक्तिर्महाशक्तिः शर्वाणी परमेश्वरी
    । हृल्लेखा भुवना देवी महाकविपरायणा ॥ ८॥ इच्छाज्ञानक्रियारूपा अणिमादिगुणाष्टका । नमः शिवायै शान्तायै
    शाङ्करि भुवनेश्वरि ॥ ९॥ वेदवेदाङ्गरूपा च अतिसूक्ष्मा शरीरिणी । कालज्ञानी शिवज्ञानी शैवधर्मपरायणा ॥
    १०॥ कालान्तरी कालरूपी संज्ञाना प्राणधारिणी । खड्गश्रेष्ठा च खट्वाङ्गी त्रिशूलवरधारिणी ॥ ११॥ अरूपा
    बहुरूपा च नायिका लोकवश्यगा । अभया लोकरक्षा च पिनाकी नागधारिणी ॥ १२॥ वज्रशक्तिर्महाशक्तिः पाशतोमरधारिणी
    । अष्टादशभुजा देवी हृल्लेखा भुवना तथा ॥ १३॥ खड्गधारी महारूपा सोमसूर्याग्निमध्यगा । एवं शताष्टकं नाम
    स्तोत्रं रमणभाषितम् ॥ १४॥ सर्वपापप्रशमनं सर्वारिष्टनिवारणम् । सर्वशत्रुक्षयकरं सदा विजयवर्धनम् ॥ १५॥
    आयुष्करं पुष्टिकरं रक्षाकरं यशस्करम् । अमरादिपदैश्वर्यममत्वांशकलापहम् ॥ १६॥ इति श्रीरुद्रयामले तन्त्रे
    भुवनेश्वर्यष्टोत्तरशतनाम समाप्तम् ।
