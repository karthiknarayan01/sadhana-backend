id: brihaspatistotram
category: stotram
name:
  english: brihaspatistotram
  devanagari: ब्रिहस्पतिस्तोत्रम्
content:
  english: brihaspatiprityartham jape viniyogah || gururbrihaspatirjivah suracaryo vidamvarah | vagisho
    dhishano dirghashmashruh pitambaro yuva || 1|| sudhadrishtirgrahadhisho grahapidapaharakah | dayakarah
    saumyamurtih surarcyah kudmaladyutih || 2|| lokapujyo lokagururnitijno nitikarakah | tarapatishcangiraso
    vedavedyah pitamahah || 3|| bhaktya brihaspatim smritva namanyetani yah pathet | arogi balavan shriman
    putravan sa bhavennarah || 4|| jivedvarshashatam martyah papam nashyati nashyati | yah pujayedgurudine
    pitagandhakshatambaraih || 5|| pushpadipopaharaishca pujayitva brihaspatim | brahmanan bhojayitva
    ca pidashantirbhavedguroh || 6|| || iti shriskandapurane brihaspatistotram sampurnam ||
  devanagari: बृहस्पतिप्रीत्यर्थं जपे विनियोगः ॥ गुरुर्बृहस्पतिर्जीवः सुराचार्यो विदांवरः । वागीशो धिषणो
    दीर्घश्मश्रुः पीताम्बरो युवा ॥ १॥ सुधादृष्टिर्ग्रहाधीशो ग्रहपीडापहारकः । दयाकरः सौम्यमूर्तिः सुरार्च्यः
    कुड्मलद्युतिः ॥ २॥ लोकपूज्यो लोकगुरुर्नीतिज्ञो नीतिकारकः । तारापतिश्चाङ्गिरसो वेदवेद्यः पितामहः ॥
    ३॥ भक्त्या बृहस्पतिं स्मृत्वा नामान्येतानि यः पठेत् । अरोगी बलवान् श्रीमान् पुत्रवान् स भवेन्नरः ॥
    ४॥ जीवेद्वर्षशतं मर्त्यः पापं नश्यति नश्यति । यः पूजयेद्गुरुदिने पीतगन्धाक्षताम्बरैः ॥ ५॥ पुष्पदीपोपहारैश्च
    पूजयित्वा बृहस्पतिम् । ब्राह्मणान् भोजयित्वा च पीडाशान्तिर्भवेद्गुरोः ॥ ६॥ ॥ इति श्रीस्कन्दपुराणे
    बृहस्पतिस्तोत्रं सम्पूर्णम् ॥
