id: bhagavadgita-parayana-chapter-12
category: stotram
name:
  english: Bhagavadgita Parayana - Chapter 12
content:
  english: om shri paramatmane namah atha dvadasho'dhyayah bhaktiyogah arjuna uvaca evam satatayukta ye
    bhaktastvam paryupasate | ye capyaksharamavyaktam tesham ke yogavittamah || || shri bhagavanuvaca
    mayyaveshya mano ye mam nityayukta upasate | shraddhaya parayopetah te me yuktatama matah || || ye
    tvaksharamanirdeshyam avyaktam paryupasate | sarvatragamacintyam ca kutasthamacalam dhruvam || ||
    sanniyamyendriyagramam sarvatra samabuddhayah | te prapnuvanti mameva sarvabhutahite ratah || || klesho'dhikatarastesham
    avyaktasaktacetasam | avyakta hi gatirduhkham dehavadbhiravapyate || || ye tu sarvani karmani mayi
    sannyasya matparah | ananyenaiva yogena mam dhyayanta upasate || || teshamaham samuddharta mrityusamsarasagarat
    | bhavami naciratpartha mayyaveshitacetasam || || mayyeva mana adhatsva mayi buddhim niveshaya | nivasishyasi
    mayyeva ata urdhvam na samshayah || || atha cittam samadhatum na shaknoshi mayi sthiram | abhyasayogena
    tatah mamicchaptum dhananjaya || || abhyase'pyasamartho'si matkarmaparamo bhava | madarthamapi karmani
    kurvansiddhimavapsyasi || || athaitadapyashakto'si kartum madyogamashritah | sarvakarmaphalatyagam
    tatah kuru yatatmavan || || shreyo hi jnanamabhyasat jnanaddhyanam vishishyate | dhyanatkarmaphalatyagah
    tyagacchantiranantaram || || adveshta sarvabhutanam maitrah karuna eva ca | nirmamo nirahankarah samaduhkhasukhah
    kshami || || santushtah satatam yogi yatatma dridhanishcayah | mayyarpitamanobuddhih yo madbhaktah
    sa me priyah || || yasmannodvijate lokah lokannodvijate ca yah | harshamarshabhayodvegaih mukto yah
    sa ca me priyah || || anapekshah shucirdakshah udasino gatavyathah | sarvarambhaparityagi yo madbhaktah
    sa me priyah || || yo na hrishyati na dveshti na shocati na kankshati | shubhashubhaparityagi bhaktimanyah
    sa me priyah || || samah shatrau ca mitre ca tatha manapamanayoh | shitoshnasukhaduhkheshu samah sangavivarjitah
    || || tulyanindastutirmauni santushto yena kenacit | aniketah sthiramatih bhaktimanme priyo narah
    || || ye tu dharmyamritamidam yathoktam paryupasate | shraddadhana matparamah bhaktaste'tiva me priyah
    || || || om tatsaditi shrimadbhagavadgitasu upanishatsu brahmavidyayam yogashastre shrikrishnarjunasamvade
    bhaktiyogo nama dvadasho'dhyayah |
  devanagari: ॐ श्री परमात्मने नमः अथ द्वादशोऽध्यायः भक्तियोगः अर्जुन उवाच एवं सततयुक्ता ये भक्तास्त्वां
    पर्युपासते । ये चाप्यक्षरमव्यक्तं तेषां के योगवित्तमाः ॥ ॥ श्री भगवानुवाच मय्यावेश्य मनो ये मां नित्ययुक्ता
    उपासते । श्रद्धया परयोपेताः ते मे युक्ततमा मताः ॥ ॥ ये त्वक्षरमनिर्देश्यम् अव्यक्तं पर्युपासते । सर्वत्रगमचिन्त्यं
    च कूटस्थमचलं ध्रुवम् ॥ ॥ सन्नियम्येन्द्रियग्रामं सर्वत्र समबुद्धयः । ते प्राप्नुवन्ति मामेव सर्वभूतहिते
    रताः ॥ ॥ क्लेशोऽधिकतरस्तेषाम् अव्यक्तासक्तचेतसाम् । अव्यक्ता हि गतिर्दुःखं देहवद्भिरवाप्यते ॥ ॥ ये
    तु सर्वाणि कर्माणि मयि सन्न्यस्य मत्पराः । अनन्येनैव योगेन मां ध्यायन्त उपासते ॥ ॥ तेषामहं समुद्धर्ता
    मृत्युसंसारसागरात् । भवामि नचिरात्पार्थ मय्यावेशितचेतसाम् ॥ ॥ मय्येव मन आधत्स्व मयि बुद्धिं निवेशय
    । निवसिष्यसि मय्येव अत ऊर्ध्वं न संशयः ॥ ॥ अथ चित्तं समाधातुं न शक्नोषि मयि स्थिरम् । अभ्यासयोगेन
    ततः मामिच्छाप्तुं धनञ्जय ॥ ॥ अभ्यासेऽप्यसमर्थोऽसि मत्कर्मपरमो भव । मदर्थमपि कर्माणि कुर्वन्सिद्धिमवाप्स्यसि
    ॥ ॥ अथैतदप्यशक्तोऽसि कर्तुं मद्योगमाश्रितः । सर्वकर्मफलत्यागं ततः कुरु यतात्मवान् ॥ ॥ श्रेयो हि ज्ञानमभ्यासात्
    ज्ञानाद्ध्यानं विशिष्यते । ध्यानात्कर्मफलत्यागः त्यागाच्छान्तिरनन्तरम् ॥ ॥ अद्वेष्टा सर्वभूतानां मैत्रः
    करुण एव च । निर्ममो निरहङ्कारः समदुःखसुखः क्षमी ॥ ॥ सन्तुष्टः सततं योगी यतात्मा दृढनिश्चयः । मय्यर्पितमनोबुद्धिः
    यो मद्भक्तः स मे प्रियः ॥ ॥ यस्मान्नोद्विजते लोकः लोकान्नोद्विजते च यः । हर्षामर्षभयोद्वेगैः मुक्तो
    यः स च मे प्रियः ॥ ॥ अनपेक्षः शुचिर्दक्षः उदासीनो गतव्यथः । सर्वारम्भपरित्यागी यो मद्भक्तः स मे प्रियः
    ॥ ॥ यो न हृष्यति न द्वेष्टि न शोचति न काङ्क्षति । शुभाशुभपरित्यागी भक्तिमान्यः स मे प्रियः ॥ ॥ समः
    शत्रौ च मित्रे च तथा मानापमानयोः । शीतोष्णसुखदुःखेषु समः सङ्गविवर्जितः ॥ ॥ तुल्यनिन्दास्तुतिर्मौनी
    सन्तुष्टो येन केनचित् । अनिकेतः स्थिरमतिः भक्तिमान्मे प्रियो नरः ॥ ॥ ये तु धर्म्यामृतमिदं यथोक्तं
    पर्युपासते । श्रद्दधाना मत्परमाः भक्तास्तेऽतीव मे प्रियाः ॥ ॥ ॥ ॐ तत्सदिति श्रीमद्भगवद्गीतासु उपनिषत्सु
    ब्रह्मविद्यायां योगशास्त्रे श्रीकृष्णार्जुनसंवादे भक्तियोगो नाम द्वादशोऽध्यायः ।
