id: sri-lalitha-mula-mantra-kavacham
category: stotram
name:
  english: Sri Lalitha Mula Mantra Kavacham
content:
  english: asya shrilalita kavaca stavaratna mantrasya shri mahatripurasundari lalitaparamba devata aim
    bijam hrim shaktih shrim kilakam mama shri lalitamba prasadasiddhyarthe shri lalita kavacastavaratna
    mantra jape viniyogah | karanyasah | aim angushthabhyam namah | hrim tarjanibhyam namah | shrim madhyamabhyam
    namah | shrim anamikabhyam namah | hrim kanishthikabhyam namah | aim karatalakaraprishthabhyam namah
    | anganyasah | aim hridayaya namah | hrim shirase svaha | shrim shikhayai vashat | shrim kavacaya
    hum | hrim netratrayaya vaushat | aim astraya phat | bhurbhuvassuvaromiti digbandhah | dhyanam shrividyam
    paripurnamerushikhare bindutrikonesthitam vagishadi samastabhutajananim mance shivakarake | kamakshim
    karunarasarnavamayim kameshvarankasthitam kantam cinmayakamakotinilayam shribrahmavidyam bhaje ||
    || lamityadi pancapujam kuryat | lam prithvitattvatmikayai shrilalitadevyai gandham samarpayami |
    ham akashatattvatmikayai shrilalitadevyai pushpam samarpayami | yam vayutattvatmikayai shri lalitadevyai
    dhupam samarpayami | ram vahnitattvatmikayai shri lalitadevyai dipam samarpayami | vam amritatattvatmikayai
    shri lalitadevyai amritanaivedyam samarpayami | pancapujam kritva yonimudram pradarshya | atha kavacam
    | kakarah patu shirsham me ekarah patu phalakam | ikarashcakshushi patu shrotre rakshellakarakah ||
    || hrinkarah patu nasagram vaktram vagbhavasanjnikah | hakarah patu kantham me sakarah skandhadeshakam
    || || kakaro hridayam patu hakaro jatharam tatha | lakaro nabhidesham tu hrinkarah patu guhyakam ||
    || kamakutah sada patu katidesham mamavatu | sakarah patu coru me kakarah patu januni || || lakarah
    patu janghe me hrinkarah patu gulphakau | shaktikutam sada patu padau rakshatu sarvada || || mulamantrakritam
    caitatkavacam yo japennarah | pratyaham niyatah pratastasya loka vashamvadah || || uttaranyasah |
    karanyasah aim angushthabhyam namah | hrim tarjanibhyam namah | shrim madhyamabhyam namah | shrim
    anamikabhyam namah | hrim kanishthikabhyam namah | aim karatalakaraprishthabhyam namah | anganyasah
    | aim hridayaya namah | hrim shirase svaha | shrim shikhayai vashat | shrim kavacaya hum | hrim netratrayaya
    vaushat | aim astraya phat | bhurbhuvassuvaromiti digvimokah | iti brahmakrita shri lalita mulamantra
    kavacam |
  devanagari: अस्य श्रीललिता कवच स्तवरत्न मन्त्रस्य श्री महात्रिपुरसुन्दरी ललितापराम्बा देवता ऐं बीजं
    ह्रीं शक्तिः श्रीं कीलकं मम श्री ललिताम्बा प्रसादसिद्ध्यर्थे श्री ललिता कवचस्तवरत्न मन्त्र जपे विनियोगः
    । करन्यासः । ऐं अङ्गुष्ठाभ्यां नमः । ह्रीं तर्जनीभ्यां नमः । श्रीं मध्यमाभ्यां नमः । श्रीं अनामिकाभ्यां
    नमः । ह्रीं कनिष्ठिकाभ्यां नमः । ऐं करतलकरपृष्ठाभ्यां नमः । अङ्गन्यासः । ऐं हृदयाय नमः । ह्रीं शिरसे
    स्वाहा । श्रीं शिखायै वषट् । श्रीं कवचाय हुम् । ह्रीं नेत्रत्रयाय वौषट् । ऐं अस्त्राय फट् । भूर्भुवस्सुवरोमिति
    दिग्बन्धः । ध्यानम् श्रीविद्यां परिपूर्णमेरुशिखरे बिन्दुत्रिकोणेस्थितां वागीशादि समस्तभूतजननीं मञ्चे
    शिवाकारके । कामाक्षीं करुणारसार्णवमयीं कामेश्वराङ्कस्थितां कान्तां चिन्मयकामकोटिनिलयां श्रीब्रह्मविद्यां
    भजे ॥ ॥ लमित्यादि पञ्चपूजां कुर्यात् । लं पृथ्वीतत्त्वात्मिकायै श्रीललितादेव्यै गन्धं समर्पयामि ।
    हं आकाशतत्त्वात्मिकायै श्रीललितादेव्यै पुष्पं समर्पयामि । यं वायुतत्त्वात्मिकायै श्री ललितादेव्यै
    धूपं समर्पयामि । रं वह्नितत्त्वात्मिकायै श्री ललितादेव्यै दीपं समर्पयामि । वं अमृततत्त्वात्मिकायै
    श्री ललितादेव्यै अमृतनैवेद्यं समर्पयामि । पञ्चपूजां कृत्वा योनिमुद्रां प्रदर्श्य । अथ कवचम् । ककारः
    पातु शीर्षं मे एकारः पातु फालकम् । ईकारश्चक्षुषी पातु श्रोत्रे रक्षेल्लकारकः ॥ ॥ ह्रीङ्कारः पातु नासाग्रं
    वक्त्रं वाग्भवसञ्ज्ञिकः । हकारः पातु कण्ठं मे सकारः स्कन्धदेशकम् ॥ ॥ ककारो हृदयं पातु हकारो जठरं तथा
    । लकारो नाभिदेशं तु ह्रीङ्कारः पातु गुह्यकम् ॥ ॥ कामकूटः सदा पातु कटिदेशं ममावतु । सकारः पातु चोरू
    मे ककारः पातु जानुनी ॥ ॥ लकारः पातु जङ्घे मे ह्रीङ्कारः पातु गुल्फकौ । शक्तिकूटं सदा पातु पादौ रक्षतु
    सर्वदा ॥ ॥ मूलमन्त्रकृतं चैतत्कवचं यो जपेन्नरः । प्रत्यहं नियतः प्रातस्तस्य लोका वशंवदाः ॥ ॥ उत्तरन्यासः
    । करन्यासः ऐं अङ्गुष्ठाभ्यां नमः । ह्रीं तर्जनीभ्यां नमः । श्रीं मध्यमाभ्यां नमः । श्रीं अनामिकाभ्यां
    नमः । ह्रीं कनिष्ठिकाभ्यां नमः । ऐं करतलकरपृष्ठाभ्यां नमः । अङ्गन्यासः । ऐं हृदयाय नमः । ह्रीं शिरसे
    स्वाहा । श्रीं शिखायै वषट् । श्रीं कवचाय हुम् । ह्रीं नेत्रत्रयाय वौषट् । ऐं अस्त्राय फट् । भूर्भुवस्सुवरोमिति
    दिग्विमोकः । इति ब्रह्मकृत श्री ललिता मूलमन्त्र कवचम् ।
