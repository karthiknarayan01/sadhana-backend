id: krishnastotradharmabvp
category: stotram
name:
  english: krishnastotradharmaBVP
  devanagari: क्रिश्नस्तोत्रधर्मBVP
content:
  english: shrikrishnastotram brahmavaivartapurane dharmakritam shridharma uvaca | krishnam vishnum vasudevam
    paramatmanamishvaram | govindam parmanandamekamaksharamacyutam || 1|| gopeshvaram ca gopisham gopam
    gorakshakam vibhum | gavamisham ca goshthastham govatsapucchadharinm || 2|| gogopagopimadhyastham
    pradhanam purushottamam | vande'navaddhamanagham shyamam shantam manoharam || 3|| ityuccarya samuttishthan
    ratnasimhasane vare | brahmavishnumaheshamstansambhashya sa uvasa ha || 4|| caturvishatinamani dharmavaktrodgatani
    ca | yah pathetpratarutthaya sa sukhi sarvato jayi || 5|| mrityukale harenami tasya sadhyam bhaveddhruvam
    | sa yatyante hareh sthanam haridasyam bhaveddhruvam || 6|| nityam dharmastam ghatate nadharme tadratirbhavet
    | caturvargaphalam tasya shashvatkaragatam bhavet || 7|| tam drishtva sarvapapani palayante bhayena
    ca | bhayani caiva duhkhani vainateyamivoregah || 8|| iti brahmavaivarte dharmakritam shrikrishnastotram
    |
  devanagari: श्रीकृष्णस्तोत्रं ब्रह्मवैवर्तपुराणे धर्मकृतम् श्रीधर्म उवाच । कृष्णं विष्णुं वासुदेवं परमात्मानमीश्वरम्
    । गोविन्दं पर्मानन्दमेकमक्षरमच्युतम् ॥ १॥ गोपेश्वरं च गोपीशं गोपं गोरक्षकं विभुम् । गवामीशं च गोष्ठस्थं
    गोवत्सपुच्छधारिण्म् ॥ २॥ गोगोपगोपीमध्यस्थं प्रधानं पुरुषोत्तमम् । वन्देऽनवद्धमनघं श्यामं शान्तं मनोहरम्
    ॥ ३॥ इत्युच्चार्य समुत्तिष्ठन् रत्नसिंहासने वरे । ब्रह्मविष्णुमहेशांस्तान्संभाष्य स उवास ह ॥ ४॥ चतुर्विशतिनामानि
    धर्मवक्त्रोद्गतानि च । यः पठेत्प्रातरुत्थाय स सुखी सर्वतो जयी ॥ ५॥ मृत्युकाले हरेनमि तस्य साध्यं भवेद्ध्रुवम्
    । स यात्यन्ते हरेः स्थानं हरिदास्यं भवेद्ध्रुवम् ॥ ६॥ नित्यं धर्मस्तं घटते नाधर्मे तद्रतिर्भवेत् ।
    चतुर्वर्गफलं तस्य शश्वत्करगतं भवेत् ॥ ७॥ तं दृष्ट्वा सर्वपापानि पलायन्ते भयेन च । भयानि चैव दुःखानि
    वैनतेयमिवोरेगाः ॥ ८॥ इति ब्रह्मावैवर्ते धर्मकृतं श्रीकृष्णस्तोत्रम् ।
