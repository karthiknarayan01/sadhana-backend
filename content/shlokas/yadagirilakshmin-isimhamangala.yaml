id: yadagirilakshmin-isimhamangala
category: stotram
name:
  english: yadagirilakshminṟisimhamangala
  devanagari: यादगिरिलक्ष्मिन्ऱिसिम्हमन्गल
content:
  english: ringagra guhamadhya viharine sarvalokeshvarayastu shri nrisimhaya mangalam || 1 || vamanka
    vilasallakshmibandhave lokabandhave suribhogyaya yadadri shri nrisimhaya mangalam || 2 || shankha
    cakra prabhamadhya rajadvimalamurtaye shri yadagirivasaya shri nrisimhaya mangalam || 3|| guhanivasanatsarva
    hridguhavasa sucanam kurvate sarvalokanam yadadrishaya mangalam || 4|| nityaya niravadyaya nityavaibhavashaline
    nityavaibhava datreca shri nrisimhaya mangalam || 5|| sadhuloka sharanyaya kamitarta pradayine artarti
    haranayastu shri nrisimhaya mangalam || 6|| bhuktimukti pradatreca shakti bhakti pradayine nirvana
    sukharupaya shri nrisimhaya mangalam || 7|| jagatkartre jagatbhokte jagadrupaya vedase jagatanca nivasaya
    yadadrishaya mangalam || 8|| aneka koti brahmandai'
  devanagari: ृङ्गाग्र गुहामध्य विहारिणे सर्वलोकेश्वरायास्तु श्री नृसिंहाय मङ्गलम् ॥ १ ॥ वामाङ्क विलसल्लक्ष्मीबन्धवे
    लोकबन्धवे सूरिभोग्याय यादाद्रि श्री नृसिंहाय मङ्गलम् ॥ २ ॥ शङ्ख चक्र प्रभामध्य राजद्विमलमूर्तये श्री
    यादगिरिवासाय श्री नृसिंहाय मङ्गलम् ॥ ३॥ गुहानिवसनात्सर्व हृद्गुहावास सूचनम् कुर्वते सर्वलोकानाम् यादाद्रीशाय
    मङ्गलम् ॥ ४॥ नित्याय निरवद्याय नित्यवैभवशालिने नित्यवैभव दात्रेच श्री नृसिंहाय मङ्गलम् ॥ ५॥ साधुलोक
    शरण्याय कामितार्त प्रदायिने आर्तार्ति हरणायास्तु श्री नृसिंहाय मङ्गलम् ॥ ६॥ भुक्तिमुक्ति प्रदात्रेच
    शक्ति भक्ति प्रदायिने निर्वाण सुखरूपाय श्री नृसिंहाय मङ्गलम् ॥ ७॥ जगत्कर्त्रे जगत्भोक्ते जगद्रूपाय
    वेदसे जगताञ्च निवासाय यादाद्रीशाय मङ्गलम् ॥ ८॥ अनेक कोटि ब्रह्माण्डैऽ
