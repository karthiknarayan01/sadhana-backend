id: krishna-ashtakam
category: stotram
name:
  english: Krishna Ashtakam
  devanagari: कृष्णाष्टकम् १० (विष्णुतीर्थविरचितम् श्री वासुदेव मधुसूदन कैटभारे)
content:
  english: shri vasudeva madhusudana kaitabhare lakshisha pakshivara vahana vamaneti | shrikrishna manmarana
    upagate tu tvannama madvacana gocaratamupaitu || 1|| govinda gokulapate navanita cora shri nandanandana
    mukunda dayapareti | shrikrishna manmarana upagate tu tvannama madvacana gocaratamupaitu || 2|| naranakhila
    gunarnava veda parayana priya gajadhipa mocaketi | shrikrishna manmarana upagate tu tvannama madvacana
    gocaratamupaitu || 3|| ananda saccidakhilatmaka bhakta varga svananda dana caturagama sannuteti |
    shrikrishna manmarana upagate tu tvannama madvacana gocaratamupaitu || 4|| shri pranato'dhika sukhyataka
    rupa deva prodyaddivakara nibhacyuta sadguneti | shrikrishna manmarana upagate tu tvannama madvacana
    gocaratamupaitu || 5|| vishvandhakari mukha daivata vandya shashvat vishvodbhavasthitimriti prabhriti
    pradeti | shrikrishna manmarana upagate tu tvannama madvacana gocaratamupaitu || 6|| nittaika rupa
    dasha rupa sahasra laksha nanta rupa shata rupa virupaketi | shrikrishna manmarana upagate tu tvannama
    madvacana gocaratamupaitu || 7|| sarvesha sarvagata sarva shubhanurupa sarvantaratmaka sadodita satpriyeti
    | shrikrishna manmarana upagate tu tvannama madvacana gocaratamupaitu || 8|| iti shrivishnutirthaviracitam
    shrikrishnashtakam sampurnam |
  devanagari: श्री वासुदेव मधुसूदन कैटभारे लक्षीश पक्षिवर वाहन वामनेति । श्रीकृष्ण मन्मरण उपागते तु त्वन्नाम
    मद्वचन गोचरतामुपैतु ॥ १॥ गोविन्द गोकुलपते नवनीत चोर श्री नन्दनन्दन मुकुन्द दयापरेति । श्रीकृष्ण मन्मरण
    उपागते तु त्वन्नाम मद्वचन गोचरतामुपैतु ॥ २॥ नाराणाखिल गुणार्णव वेद पारायण प्रिय गजाधिप मोचकेति । श्रीकृष्ण
    मन्मरण उपागते तु त्वन्नाम मद्वचन गोचरतामुपैतु ॥ ३॥ आनन्द सच्चिदाखिलात्मक भक्त वर्ग स्वानन्द दान चतुरागम
    सन्नुतेति । श्रीकृष्ण मन्मरण उपागते तु त्वन्नाम मद्वचन गोचरतामुपैतु ॥ ४॥ श्री प्राणतोऽधिक सुख्यातक
    रूप देव प्रोद्यद्दिवाकर निभाच्युत सद्गुणेति । श्रीकृष्ण मन्मरण उपागते तु त्वन्नाम मद्वचन गोचरतामुपैतु
    ॥ ५॥ विश्वान्धकारि मुख दैवत वन्द्य शाश्वत् विश्वोद्भवस्थितिमृति प्रभृति प्रदेति । श्रीकृष्ण मन्मरण
    उपागते तु त्वन्नाम मद्वचन गोचरतामुपैतु ॥ ६॥ नित्तैक रूप दश रूप सहस्र लक्षा नन्त रूप शत रूप विरूपकेति
    । श्रीकृष्ण मन्मरण उपागते तु त्वन्नाम मद्वचन गोचरतामुपैतु ॥ ७॥ सर्वेश सर्वगत सर्व शुभानुरूप सर्वान्तरात्मक
    सदोदित सत्प्रियेति । श्रीकृष्ण मन्मरण उपागते तु त्वन्नाम मद्वचन गोचरतामुपैतु ॥ ८॥ इति श्रीविष्णुतीर्थविरचितं
    श्रीकृष्णाष्टकं सम्पूर्णम् ।
