id: dattastotra-2
category: stotram
name:
  english: dattastotra 2
  devanagari: दत्तस्तोत्र २
content:
  english: shridattatreyastotram 2 || om || dattatreyam priyadaivatam sarvatmakam vishvambharam | karunarnavam
    vipadaharam cinmayam pranamamyaham || 1|| balarupam hasyavadanam shamkhacakrayutam prabhum | dhenusahitam
    trishulapanim cinmayam pranamamyaham || 2|| shadbhujam stavanapriyam trigunatmakam bhavatarakam |
    shivakarakam suravamditam cinmayam pranamamyaham || 3 || pranavagayanatoshitam pranavapadmaih pujitam
    | pranavatmakam parameshvaram cinmayam pranamamyaham || 4|| kotibhaskarasadrisham tejasvinam tejomayam
    | sadgurum gurunam gurum cinmayam pranamamyaham || 5|| vishvanatakacalakam jnanagamyam nirgunam |
    bhaktakaranasambhutam cinmayam pranamamyaham || 6|| balayogidhyanamagnam trividhatapanivarakam | dinanatham
    siddhidam cinmayam pranamamyaham || 7|| janakajananibamdhusuhridah aptasarvastvam mama | ehi ehi smartrigamin
    cinmaya prakati bhava || 8||
  devanagari: श्रीदत्तात्रेयस्तोत्रं २ ॥ ॐ ॥ दत्तात्रेयं प्रियदैवतं सर्वात्मकं विश्वंभरम् । करुणार्णवं
    विपदाहरं चिन्मयं प्रणमाम्यहम् ॥ १॥ बालरूपं हास्यवदनं शंखचक्रयुतं प्रभुम् । धेनुसहितं त्रिशुलपाणिं
    चिन्मयं प्रणमाम्यहम् ॥ २॥ षड्भुजं स्तवनप्रियं त्रिगुणात्मकं भवतारकम् । शिवकारकं सुरवंदितं चिन्मयं
    प्रणमाम्यहम् ॥ ३ ॥ प्रणवगायनतोषितं प्रणवपद्मैः पूजितम् । प्रणवात्मकं परमेश्वरं चिन्मयं प्रणमाम्यहम्
    ॥ ४॥ कोटिभास्करसदृशं तेजस्विनं तेजोमयम् । सद्गुरूं गुरूणां गुरूं चिन्मयं प्रणमाम्यहम् ॥ ५॥ विश्वनाटकचालकं
    ज्ञानगम्यं निर्गुणम् । भक्तकारणसंभूतं चिन्मयं प्रणमाम्यहम् ॥ ६॥ बालयोगिध्यानमग्नं त्रिविधतापनिवारकम्
    । दीननाथं सिद्धिदं चिन्मयं प्रणमाम्यहम् ॥ ७॥ जनकजननीबंधुसुहृदाः आप्तसर्वास्त्वं मम । एहि एहि स्मर्तृगामिन्
    चिन्मय प्रकटी भव ॥ ८॥
