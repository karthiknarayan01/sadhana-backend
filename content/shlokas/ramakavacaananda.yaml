id: ramakavacaananda
category: kavacha
name:
  english: ramakavacaananda
  devanagari: रामकवचआनन्द
content:
  english: rinu vakshyamyaham shubham | shriramah patu me murdhni purve ca raghuvamshajah || 10|| dakshine
    me raghuvarah pashcime patu pavanah | uttare me raghupatih bhalam dasharathatmajah || 11|| bhruvordurvadaḻashyamah
    tayormadhye janardanah | shrotram me patu rajendro drishau rajivalocanah || 12|| ghranam me patu rajarshih
    gandam me janakipatih | karnamule kharadhvamsi bhalam me raghuvallabhah || 13|| jihvam me vakpatih
    patu dantavalyau raghuttamah | oshthau shriramacandro me mukham patu paratparah || 14|| kantham patu
    jagadvandyah skandhau me ravanantakah | dhanurbanadharah patu bhujau me valimardanah || 15|| sarvanyanguḻiparvani
    hastau me rakshasantakah | vaksho me patu kakutsthah patu me hridayam harih || 16|| stanau sitapatih
    patu parshvau me jagadishvarah | madhyam me patu lakshmisho nabhim me raghunayakah || 17|| kausalyeyah
    katim patu prishtham durgatinashanah | guhyam patu hrishikeshah sakthini satyavikramah || 18|| uru
    sharngadharah patu januni hanumatpriyah | janghe patu jagadvyapi padau me tatakantakah || 19|| sarvangam
    patu me vishnuh sarvasandhinanamayah | jnanendriyani pranadin patu me madhusudanah || 20|| patu shriramabhadro
    me shabdadin vishayanapi | dvipadadini bhutani matsambandhini yani ca || 21|| jamadagnyamahadarpadalanah
    patu tani me | saumitripurvajah patu vagadinindriyani ca || 22|| romankuranyasheshani patu sugrivarajyadah
    | vanmanobuddhyahankaraih jnanajnanakritani ca || 23|| janmantarakritaniha papani vividhani ca | tani
    sarvani dagdhva''shu harakodandakhandanah || 24|| patu mam sarvato ramah sharngabanadharah sada |
    iti shriramacandrasya kavacam vajrasammitam || 25|| guhyadguhyatamam divyam sutikshna munisattama
    | yah pathet sha
  devanagari: ृणु वक्ष्याम्यहं शुभम् । श्रीरामः पातु मे मूर्ध्नि पूर्वे च रघुवंशजः ॥ १०॥ दक्षिणे मे रघुवरः
    पश्चिमे पातु पावनः । उत्तरे मे रघुपतिः भालं दशरथात्मजः ॥ ११॥ भ्रुवोर्दूर्वादळश्यामः तयोर्मध्ये जनार्दनः
    । श्रोत्रं मे पातु राजेन्द्रो दृशौ राजीवलोचनः ॥ १२॥ घ्राणं मे पातु राजर्षिः गण्डं मे जानकीपतिः । कर्णमूले
    खरध्वंसी भालं मे रघुवल्लभः ॥ १३॥ जिह्वां मे वाक्पतिः पातु दन्तावल्यौ रघूत्तमः । ओष्ठौ श्रीरामचन्द्रो
    मे मुखं पातु परात्परः ॥ १४॥ कण्ठं पातु जगद्वन्द्यः स्कन्धौ मे रावणान्तकः । धनुर्बाणधरः पातु भुजौ मे
    वालिमर्दनः ॥ १५॥ सर्वाण्यङ्गुळिपर्वाणि हस्तौ मे राक्षसान्तकः । वक्षो मे पातु काकुत्स्थः पातु मे हृदयं
    हरिः ॥ १६॥ स्तनौ सीतापतिः पातु पार्श्वौ मे जगदीश्वरः । मध्यं मे पातु लक्ष्मीशो नाभिं मे रघुनायकः ॥
    १७॥ कौसल्येयः कटिं पातु पृष्ठं दुर्गतिनाशनः । गुह्यं पातु हृषीकेशः सक्थिनी सत्यविक्रमः ॥ १८॥ ऊरू शार्ङ्गधरः
    पातु जानुनी हनुमत्प्रियः । जङ्घे पातु जगद्व्यापी पादौ मे ताटकान्तकः ॥ १९॥ सर्वाङ्गं पातु मे विष्णुः
    सर्वसन्धीननामयः । ज्ञानेन्द्रियाणि प्राणादीन् पातु मे मधुसूदनः ॥ २०॥ पातु श्रीरामभद्रो मे शब्दादीन्
    विषयानपि । द्विपदादीनि भूतानि मत्सम्बन्धीनि यानि च ॥ २१॥ जामदग्न्यमहादर्पदलनः पातु तानि मे । सौमित्रिपूर्वजः
    पातु वागादीनीन्द्रियाणि च ॥ २२॥ रोमाङ्कुराण्यशेषाणि पातु सुग्रीवराज्यदः । वाङ्मनोबुद्ध्यहङ्कारैः ज्ञानाज्ञानकृतानि
    च ॥ २३॥ जन्मान्तरकृतानीह पापानि विविधानि च । तानि सर्वाणि दग्ध्वाऽऽशु हरकोदण्डखण्डनः ॥ २४॥ पातु मां
    सर्वतो रामः शार्ङ्गबाणधरः सदा । इति श्रीरामचन्द्रस्य कवचं वज्रसम्मितम् ॥ २५॥ गुह्याद्गुह्यतमं दिव्यं
    सुतीक्ष्ण मुनिसत्तम । यः पठेत् श
