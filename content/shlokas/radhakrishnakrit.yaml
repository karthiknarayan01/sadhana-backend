id: radhakrishnakrit
category: stotram
name:
  english: radhakrishnakrit
  devanagari: राधाक्रिश्नक्रित्
content:
  english: shriradhastotram shrikrishnakritam shrikrishna uvaca | evameva priyo'ham te pramodashcaiva
    te mayi | suvyaktamadya kapatyavacanam te varanane || 1|| he krishna tvam mama prana jivatmeti ca
    samtatam | brushe nityam tu yat premna sampratam tad gatam drutam || 2|| asmakam vacanam satyam yad
    vravimiti tad dhruvam | pancapranadhidevi tvam radha pranadhiketi me || 3|| shakto na rakshitum tvam
    ca yanti pranastvaya vina | vinadhishthatridevim ca ko va kutra ca jivati || 4|| mahavishnoshca mata
    tvam mulaprakritirishvari | saguna tvam ca kalaya nirguna svayameva tu || 5|| jyotirupa nirakara bhaktanugrahavigraha
    | bhaktanam rucivaicitryannanamurtishca bibhramati || 6|| mahalakshmishca vaikunthe bharati ca satam
    prasuh | punyakshetre bharate ca sati tvam parvati tatha || 7|| tulasi punyarupa ca ganga bhuvanapavani
    | brahmaloke ca savitri kalaya tvam vasundhara || 8|| goloke radhika tvam ca sarvagopalakeshvari |
    tvaya vinaham nirjivo hyashaktah sarvakarmasu || 9|| shivah shaktastvaya shaktya shavakarastvaya vina
    | vedakarta svayam brahma vedamatra tvaya saha || 10|| narayanastvaya lakshmya jagatpata jagatpatih
    | phalam dadati yajnashca tvaya dakshinaya saha || 11|| bibharti srishtim sheshashca tvam kritva mastake
    bhuvam | bibharti gangarupam tvam murghni gangadharah shivah || 12|| shaktimacca jagat sarvam shavarupam
    tvaya vina | vakta sarvastvaya vanya suto mukastvaya vina || 13|| yatha mrida ghatam kartum kulalah
    shaktiman sada | srishtim srashtum tathaham ca prakritya ca tvaya saha || 14|| tvaya vina jadashcaham
    sarvatra ca na shaktiman | sarvashaktikharupa tvam samagaccha mamantikam || 15|| vahnau tvam dahika
    shaktirnagnih shaktastvaya vina | shobhasvarupa candre tvam tvam vina na sa sundarah || 16|| prabharupa
    hi surye tvam vina na sa bhanuman | na kamah kaminibanghustvaya ratya vina priye || 17|| ityevam stavanam
    kritva tam samprasha jagatprabhuh | deva babhuvuh sathikah sabharyah shaktisamyutah || 18|| sastrikam
    ca jagat sarvam babhuv shailakanyake | gopipurnashca goloko babhuva tatprasadatah || 19|| raja ca
    jagam golokamiti stutva haripriyam | shrikrishnena kritam stotram radhaya yah pathennarah || 20||
    krishnabhaktim ca taddasyam sa prapnoti na samsayah | strivicchedeyah sha
  devanagari: श्रीराधास्तोत्रं श्रीकृष्णकृतम् श्रीकृष्ण उवाच । एवमेव प्रियोऽहं ते प्रमोदश्चैव ते मयि ।
    सुव्यक्तमद्य कापट्यवचनं ते वरानने ॥ १॥ हे कृष्ण त्वं मम प्राणा जीवात्मेति च संततम् । ब्रूषे नित्यं
    तु यत् प्रेम्णा साम्प्रतं तद् गतं द्रुतम् ॥ २॥ अस्माकं वचनं सत्यं यद् व्रवीमिती तद् ध्रुवम् । पञ्चप्राणाधिदेवी
    त्वं राधा प्राणधिकेति मे ॥ ३॥ शक्तो न रक्षितुं त्वां च यान्ति प्राणस्त्वया विना । विनाधिष्ठातृदेवीं
    च को वा कुत्र च जीवति ॥ ४॥ महाविष्णोश्च माता त्वं मूलप्रकृतिरीश्वरी । सगुणा त्वं च कलया निर्गुणा स्वयमेव
    तु ॥ ५॥ ज्योतीरूपा निराकारा भक्तानुग्रहविग्रहा । भक्तानां रुचिवैचित्र्यन्नानामूर्तीश्च बिभ्रमती ॥
    ६॥ महालक्ष्मिश्च वैकुण्ठे भारती च सतां प्रसूः । पुण्यक्षेत्रे भारते च सती त्वं पार्वती तथा ॥ ७॥ तुलसी
    पुण्यरूपा च गङ्गा भुवनपावनी । ब्रह्मलोके च सावित्री कलया त्वं वसुन्धरा ॥ ८॥ गोलोके राधिका त्वं च सर्वगोपालकेश्वरी
    । त्वया विनाहं निर्जीवो ह्यशक्तः सर्वकर्मसु ॥ ९॥ शिवः शक्तस्त्वया शक्त्या शवाकारस्त्वया विना । वेदकर्ता
    स्वयं ब्रह्मा वेदमात्रा त्वया सह ॥ १०॥ नारायणस्त्वया लक्ष्म्या जगत्पाता जगत्पतिः । फलं ददाति यज्ञश्च
    त्वया दक्षिणया सह ॥ ११॥ बिभर्ति सृष्टिं शेषश्च त्वां कृत्वा मस्तके भुवम् । बिभर्ति गङ्गारूपां त्वां
    मूर्घ्नि गङ्गाधरः शिवः ॥ १२॥ शक्तिमच्च जगत् सर्वं शवरूपं त्वया विना । वक्ता सर्वस्त्वया वाण्या सूतो
    मूकस्त्वया विना ॥ १३॥ यथा मृदा घटं कर्तुं कुलालः शक्तिमान् सदा । सृष्टिं स्रष्टुं तथाहं च प्रकृत्या
    च त्वया सह ॥ १४॥ त्वया विना जडश्चाहं सर्वत्र च न शक्तिमान् । सर्वशक्तिखरूपा त्वं समागच्छ ममान्तिकम्
    ॥ १५॥ वह्नौ त्वं दाहिका शक्तिर्नाग्निः शक्तस्त्वया विना । शोभास्वरूपा चन्द्रे त्वं त्वां विना न स
    सुन्दरः ॥ १६॥ प्रभारूपा हि सूर्ये त्वं विना न स भानुमान् । न कामः कामिनीबन्घुस्त्वया रत्या विना प्रिये
    ॥ १७॥ इत्येवं स्तवनं कृत्वा तां सम्प्राष जगत्प्रभुः । देवा बभूवुः सथीकाः सभार्याः शक्तिसंयुताः ॥ १८॥
    सस्त्रीकं च जगत् सर्वं बभूव् शैलकन्यके । गोपीपूर्णश्च गोलोको बभूव तत्प्रसादतः ॥ १९॥ राजा च जगाम् गोलोकमिति
    स्तुत्वा हरिप्रियाम् । श्रीकृष्णेन कृतं स्तोत्रं राधाया यः पठेन्नरः ॥ २०॥ कृष्णभक्तिं च तद्दास्यं
    स प्राप्नोति न संसयः । स्त्रीविच्छेदेयः श
