id: mohanakavacam
category: kavacha
name:
  english: mohanakavacam
  devanagari: मोहनकवचम्
content:
  english: sarvamohane viniyogah | aim krim krum krah svaha vivade patu mam sada | klim dakshinakalikadevatayai
    sabhamadhye jayaprada || 3|| krim krim shyamanginyai shatru maraya maraya | hrim krim krim klim trailokyam
    vashamanaya || 4|| hrim shrim kri mam raksha raksha vivade rajagocare | dvavimshatyakshari brahma
    sarvatra raksha mam sada || 5|| kavace varjite yatra tatra mam patu kilaka | sarvatra raksha mam devi
    shyama tugrasvarupini || 6|| etesham paramam moham bhavadbhagye prakashitam sada yastu pathedvapi
    trailokyam vashamanayet || 7|| idam kavacamajnatva pujayedghorarupinim | sarvada sa mahavyadhipidito
    natra samshayah || 8|| alpayuh sa bhavedrogi kathitam tava narada | dharanam kavacasyasya bhurjapatre
    visheshatah || 9|| sayantram kavacam dhritva icchasiddhih prajayate | shuklashtamyam likhenmantram
    dharayet svarnapatrake || 10|| kavacasyasya mahatmyam naham vaktum mahamune | shikhayam dharayedyogi
    phalarthi dakshine bhuje || 11|| idam kalpadrumam devi tava snehat prakashyate | gopaniyam prayatnena
    pathaniyam mahamune || 12|| shrivishnuruvaca
  devanagari: सर्वमोहने विनियोगः । ऐं क्रीं क्रूं क्रः स्वाहा विवादे पातु मां सदा । क्लीं दक्षिणकालिकादेवतायै
    सभामध्ये जयप्रदा ॥ ३॥ क्रीं क्रीं श्यामाङ्गिन्यै शत्रु मारय मारय । ह्रीं क्रीं क्रीं क्लीं त्रैलोक्यं
    वशमानय ॥ ४॥ ह्रीं श्रीं क्री मां रक्ष रक्ष विवादे राजगोचरे । द्वाविंशत्यक्षरी ब्रह्म सर्वत्र रक्ष
    मां सदा ॥ ५॥ कवचे वर्जिते यत्र तत्र मां पातु कीलका । सर्वत्र रक्ष मां देवि श्यामा तूग्रस्वरूपिणी ॥
    ६॥ एतेषां परमं मोहं भवद्भाग्ये प्रकाशितं सदा यस्तु पठेद्वापि त्रैलोक्यं वशमानयेत् ॥ ७॥ इदं कवचमज्ञात्वा
    पूजयेद्घोररूपिणीम् । सर्वदा स महाव्याधिपीडितो नात्र संशयः ॥ ८॥ अल्पायुः स भवेद्रोगी कथितं तव नारद
    । धारणं कवचस्यास्य भूर्जपत्रे विशेषतः ॥ ९॥ सयन्त्रं कवचं धृत्वा इच्छासिद्धिः प्रजायते । शुक्लाष्टम्यां
    लिखेन्मन्त्रं धारयेत् स्वर्णपत्रके ॥ १०॥ कवचस्यास्य माहात्म्यं नाहं वक्तुं महामुने । शिखायां धारयेद्योगी
    फलार्थी दक्षिणे भुजे ॥ ११॥ इदं कल्पद्रुमं देवि तव स्नेहात् प्रकाश्यते । गोपनीयं प्रयत्नेन पठनीयं महामुने
    ॥ १२॥ श्रीविष्णुरुवाच
