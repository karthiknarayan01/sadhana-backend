id: ramastutihbrahamk-itshivaramayana
category: stotram
name:
  english: ramastutihbrahamkṟitshivaramayana
  devanagari: रामस्तुतिःब्रहम्क्ऱित्शिवरामायण
content:
  english: 3|| aham te hridayam rama jihva devi sarasvati | deva gatreshu romani mahodevopya'hankritih
    || 4|| saptarshayo vasishthadyah devah sagnipurogamah | pashupakshimrigah kitah samudrah kulaparvatah
    || 5|| sthavarah jangamah ye ye bhuvanani caturdasha | vrikshaushadhilatah deva gatreshu tava nirmitah
    || 6|| malini hindi vyakhya
  devanagari: ३॥ अहं ते हृदयं राम जिह्वा देवी सरस्वती । देवा गात्रेषु रोमाणि महोदेवोप्यऽहङ्कृतिः ॥ ४॥
    सप्तर्षयो वसिष्ठाद्याः देवाः साग्निपुरोगमाः । पशुपक्षिमृगाः कीटाः समुद्राः कुलपर्वताः ॥ ५॥ स्थावराः
    जङ्गमाः ये ये भुवनानि चतुर्दश । वृक्षौषधिलताः देव गात्रेषु तव निर्मिताः ॥ ६॥ मालिनी हिन्दी व्याख्या
meaning: {}
