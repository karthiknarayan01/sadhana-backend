id: sri-kalika-sahasra-nama-stotram
category: stotram
name:
  english: Sri Kalika Sahasra Nama Stotram
content:
  english: shri shiva uvaca | kathito'yam mahamantrah sarvamantrottamottamah | yamasadya maya praptamaishvaryapadamuttamam
    || || samyuktah paraya bhaktya yathokta vidhina bhavan | kurutamarcanam devyastrailokyavijigishaya
    || || shriparashurama uvaca | prasanno yadi me deva paramesha puratana | rahasyam paramam devyah kripaya
    kathaya prabho || || vinarcanam vina homam vina nyasam vina balim | vina gandham vina pushpam vina
    nityoditam kriyam || || pranayamam vina dhyanam vina bhutavishodhanam | vina danam vina japam yena
    kali prasidati || || shri shiva uvaca | prishtam tvayottamam prajna bhriguvamsha samudbhava | bhaktanamapi
    bhakto'si tvameva sadhayishyasi || || devim danavakotighnim lilaya rudhirapriyam | sada stotrapriyamugram
    kamakautukalalasam || || sarvada''nandahridayamasavotsava manasam | madhvika matsyamamsanuraginim
    vaishnavim param || || shmashanavasinim pretagananrityamahotsavam | yogaprabhavam yogeshim yogindrahridayasthitam
    || || tamugrakalikam rama prasidayitumarhasi | tasyah stotram param punyam svayam kalya prakashitam
    || || tava tat kathayishyami shrutva vatsavadharaya | gopaniyam prayatnena pathaniyam paratparam ||
    || yasyaikakalapathanat sarve vighnah samakulah | nashyanti dahane dipte patanga iva sarvatah || ||
    gadyapadyamayi vani tasya gangapravahavat | tasya darshanamatrena vadino nishprabham gatah || || tasya
    haste sadaivasti sarvasiddhirna samshayah | rajano'pi ca dasatvam bhajante kim pare janah || || nishithe
    muktakeshastu nagnah shaktisamahitah | manasa cintayet kalim mahakalena calitam || || pathet sahasranamakhyam
    stotram mokshasya sadhanam | prasanna kalika tasya putratvenanukampate || || yatha brahmamritairbrahmakusumaih
    pujita para | prasidati tathanena stuta kali prasidati || asya shri dakshinakalika sahasranama stotrasya
    mahakalabhairava rishih anushtup chandah shmashanakali devata dharmarthakamamoksharthe pathe viniyogah
    | dhyanam shavarudham mahabhimam ghoradamshtram hasanmukhim caturbhujam khadgamundavarabhayakaram
    shivam | mundamaladharam devim lalajjihvam digambaram evam sancintayetkalim shmashanalayavasinim ||
    stotram shmashanakalika kali bhadrakali kapalini | guhyakali mahakali kurukulla virodhini || || kalika
    kalaratrishca mahakalanitambini | kalabhairavabharya ca kulavartmaprakashini || || kamada kamini kanya
    kamaniyasvarupini | kasturirasaliptangi kunjareshvaragamini || || kakaravarnasarvangi kamini kamasundari
    | kamarta kamarupa ca kamadhenuh kalavati || || kanta kamasvarupa ca kamakhya kulakamini | kulina
    kulavatyamba durga durgatinashini || || kaumari kalaja krishna krishnadeha krishodari | krishangi
    kulishangi ca krinkari kamala kala || || karalasya karali ca kulakanta'parajita | ugra ugraprabha
    dipta vipracitta mahabala || || nila ghana meghanada matra mudra mitamita | brahmi narayani bhadra
    subhadra bhaktavatsala || || maheshvari ca camunda varahi narasimhika | vajrangi vajrakankali nrimundasragvini
    shiva || || malini naramundali galadraktavibhushana | raktacandanasiktangi sindurarunamastaka || ||
    ghorarupa ghoradamshtra ghoraghoratara shubha | mahadamshtra mahamaya sudati yugadantura || || sulocana
    virupakshi vishalakshi trilocana | sharadenduprasannasya sphuratsmerambujekshana || || attahasapraphullasya
    smeravaktra subhashini | praphullapadmavadana smitasya priyabhashini || || kotarakshi kulashreshtha
    mahati bahubhashini | sumatih kumatishcanda candamundativegini || || sukeshi muktakeshi ca dirghakeshi
    mahakaca | pretadehakarnapura pretapanisumekhala || || pretasana priyapreta punyada kulapandita |
    punyalaya punyadeha punyashloka ca pavani || || puta pavitra parama para punyavibhushana | punyanamni
    bhitihara varada khadgapanini || || nrimundahasta shanta ca chinnamasta sunasika | dakshina shyamala
    shyama shanta pinonnatastani || || digambara ghorarava srikkantaraktavahini | ghorarava shivasanga
    nihsanga madanatura || || matta pramatta madana sudhasindhunivasini | atimatta mahamatta sarvakarshanakarini
    || || gitapriya vadyarata pretanrityaparayana | caturbhuja dashabhuja ashtadashabhuja tatha || ||
    katyayani jaganmata jagati parameshvari | jagadbandhurjagaddhatri jagadanandakarini || || jagajjivavati
    haimavati maya mahalaya | nagayajnopavitangi nagini nagashayini || || nagakanya devakanya gandhari
    kinnari suri | moharatri maharatri darunamasurasuri || || vidyadhari vasumati yakshini yogini jara
    | rakshasi dakini vedamayi vedavibhushana || || shrutismritimahavidya guhyavidya puratani | cintya'cintya
    svadha svaha nidra tandra ca parvati || || aparna nishcala lola sarvavidya tapasvini | ganga kashi
    shaci sita sati satyaparayana || || nitih sunitih surucistushtih pushtirdhritih kshama | vani buddhirmahalakshmi
    lakshmirnilasarasvati || || srotasvati srotavati matangi vijaya jaya | nadi sindhuh sarvamayi tara
    shunyanivasini || || shuddha tarangini medha lakini bahurupini | sadanandamayi satya sarvanandasvarupini
    || || sunanda nandini stutya stavaniya svabhavini | rankini tankini citra vicitra citrarupini || ||
    padma padmalaya padmasukhi padmavibhushana | shakini hakini kshanta rakini rudhirapriya || || bhrantirbhavani
    rudrani mridani shatrumardini | upendrani maheshani jyotsna cendrasvarupini || || suryatmika rudrapatni
    raudri stri prakritih puman | shaktih suktirmatimati bhuktirmuktih pativrata || || sarveshvari sarvamata
    sharvani haravallabha | sarvajna siddhida siddha bhavya bhavya bhayapaha || || kartri hartri palayitri
    sharvari tamasi daya | tamisra yaministha ca sthira dhira tapasvini || || carvangi cancala lolajihva
    carucaritrini | trapa trapavati lajja nirlajja hrim rajovati || || sattvavati dharmanishtha shreshtha
    nishthuravadini | garishtha dushtasamhartri vishishta shreyasi ghrina || || bhima bhayanaka bhimanadini
    bhih prabhavati | vagishvari shriryamuna yajnakartri yajuhpriya || || riksamatharvanilaya ragini shobhanasvara
    | kalakanthi kambukanthi venuvinaparayana || || vamshini vaishnavi svaccha dhatri trijagadishvari
    | madhumati kundalini riddhih siddhih shucismita || || rambhorvashi rati rama rohini revati rama |
    shankhini cakrini krishna gadini padmini tatha || || shulini parighastra ca pashini sharngapanini
    | pinakadharini dhumra sharabhi vanamalini || || vajrini samaraprita vegini ranapandita | jatini bimbini
    nila lavanyambudhicandrika || || balipriya sadapujya purna daityendramathini | mahishasurasamhantri
    vasini raktadantika || || raktapa rudhiraktangi raktakharparahastini | raktapriya mamsarucirvasavasaktamanasa
    || || galacchonitamundalikanthamalavibhushana | shavasana citantastha maheshi vrishavahini || || vyaghratvagambara
    cinacelini simhavahini | vamadevi mahadevi gauri sarvajnabhavini || || balika taruni vriddha vriddhamata
    jaratura | subhrurvilasini brahmavadini brahmani mahi || || svapnavati citralekha lopamudra sureshvari
    | amogha'rundhati tikshna bhogavatyanuvadini || || mandakini mandahasa jvalamukhyasurantaka | manada
    manini manya mananiya madoddhata || || madira madiranmada medhya navya prasadini | sumadhya'nantagunini
    sarvalokottamottama || || jayada jitvara jaitri jayashrirjayashalini | sukhada shubhada satya sabhasankshobhakarini
    || || shivaduti bhutimati vibhutirbhishananana | kaumari kulaja kunti kulastri kulapalika || || kirtiryashasvini
    bhusha bhushya bhutapatipriya | saguna nirguna dhrishta nishtha kashtha pratishthita || || dhanishtha
    dhanada dhanya vasudha svaprakashini | urvi gurvi gurushreshtha saguna trigunatmika || || mahakulina
    nishkama sakama kamajivana | kamadevakala rama'bhirama shivanartaki || || cintamanih kalpalata jagrati
    dinavatsala | kartiki kirtika kritya ayodhya vishama sama || || sumantra mantrini ghurna hladini kleshanashini
    | trailokyajanani hrishta nirmamsa manorupini || || tadaganimnajathara shushkamamsasthimalini | avanti
    mathura maya trailokyapavanishvari || || vyakta'vyakta'nekamurtih sharvari bhimanadini | kshemankari
    shankari ca sarvasammohakarini || || urdhvatejasvini klinna mahatejasvini tatha | advaita bhogini
    pujya yuvati sarvamangala || || sarvapriyankari bhogya dharani pishitashana | bhayankari papahara
    nishkalanka vashankari || || asha trishna candrakala nidranya vayuvegini | sahasrasuryasankasha candrakotisamaprabha
    || || vahnimandalasamstha ca sarvatattvapratishthita | sarvacaravati sarvadevakanyadhidevata || ||
    dakshakanya dakshayajnanashini durgatarika | ijya pujya vibha bhutih satkirtirbrahmarupini || || rambhorushcatura
    raka jayanti karuna kuhuh | manasvini devamata yashasya brahmacarini || || riddhida vriddhida vriddhih
    sarvadya sarvadayini | adhararupini dhyeya muladharanivasini || || ajna prajna purnamanashcandramukhyanukulini
    | vavaduka nimnanabhih satya sandhya dridhavrata || || anvikshiki dandanitistrayi tridivasundari |
    jvalini jvalini shailatanaya vindhyavasini || || ameya khecari dhairya turiya vimala''tura | pragalbha
    varuni chaya shashini visphulingini || || bhuktih siddhih sadapraptih prakamya mahima'nima | icchasiddhirvisiddha
    ca vashitvordhvanivasini || || laghima caiva gayatri savitri bhuvaneshvari | manohara cita divya devyudara
    manorama || || pingala kapila jihvarasajna rasika rasa | sushumneda bhogavati gandhari narakantaka
    || || pancali rukmini radharadhya bhimadhiradhika | amrita tulasi vrinda kaitabhi kapateshvari ||
    || ugracandeshvari vira janani virasundari | ugratara yashodakhya daivaki devamanita || || niranjana
    citradevi krodhini kuladipika | kulavagishvari vani matrika dravini drava || || yogeshvari mahamari
    bhramari bindurupini | duti praneshvari gupta bahula camari prabha || || kubjika jnanini jyeshtha
    bhushundi prakata tithih | dravini gopani maya kamabijeshvari kriya || || shambhavi kekara mena mushalastra
    tilottama | ameyavikrama krura sampatshala trilocana || || svastirhavyavaha pritirushma dhumrarcirangada
    | tapini tapini vishva bhogada dharini dhara || || trikhanda bodhini vashya sakala shabdarupini |
    bijarupa mahamudra yogini yonirupini || || anangakusuma'nangamekhala'nangarupini | vajreshvari ca
    jayini sarvadvandvakshayankari || || shadangayuvati yogayukta jvalamshumalini | durashaya duradhara
    durjaya durgarupini || || duranta dushkritihara durdhyeya duratikrama | hamseshvari trikonastha shakambharyanukampini
    || || trikonanilaya nitya paramamritaranjita | mahavidyeshvari shveta bherunda kulasundari || || tvarita
    bhaktisamsakta bhaktavashya sanatani | bhaktanandamayi bhaktabhavika bhaktashankari || || sarvasaundaryanilaya
    sarvasaubhagyashalini | sarvasambhogabhavana sarvasaukhyanirupini || || kumaripujanarata kumarivratacarini
    | kumaribhaktisukhini kumarirupadharini || || kumaripujakaprita kumaripritida priya | kumarisevakasanga
    kumarisevakalaya || || anandabhairavi balabhairavi batubhairavi | shmashanabhairavi kalabhairavi purabhairavi
    || || mahabhairavapatni ca paramanandabhairavi | sudhanandabhairavi ca unmadanandabhairavi || || muktanandabhairavi
    ca tatha tarunabhairavi | jnananandabhairavi ca amritanandabhairavi || || mahabhayankari tivra tivravega
    tapasvini | tripura parameshani sundari purasundari || || tripureshi pancadashi pancami puravasini
    | mahasaptadashi caiva shodashi tripureshvari || || mahankushasvarupa ca mahacakreshvari tatha | navacakreshvari
    cakreshvari tripuramalini || || rajarajeshvari dhira mahatripurasundari | sindurapurarucira shrimattripurasundari
    || || sarvangasundari raktaraktavastrottariyini | javayavakasinduraraktacandanadharini || || javayavakasinduraraktacandanarupadhrik
    | camari balakutilanirmala shyamakeshini || || vajramauktikaratnadhya kiritamukutojjvala | ratnakundalasamyuktasphuradgandamanorama
    || || kunjareshvarakumbhotthamuktaranjitanasika | muktavidrumamanikyaharadhyastanamandala || || suryakantendukantadhyasparshashmakanthabhushana
    | bijapurasphuradbijadantapanktiranuttama || || kamakodandakabhugnabhrukatakshapravarshini | matangakumbhavakshoja
    lasatkokanadekshana || || manojnashashkulikarna hamsigatividambini | padmaragangadajyotirdoshcatushkaprakashini
    || || nanamaniparisphurjacchuddhakancanakankana | nagendradantanirmanavalayankitapanini || || anguriyakacitrangi
    vicitrakshudraghantika | pattambaraparidhana kalamanjirashinjini || || karpuragarukasturikunkumadravalepita
    | vicitraratnaprithivikalpashakhitalasthita || || ratnadvipasphuradratnasimhasanavilasini | shatcakrabhedanakari
    paramanandarupini || || sahasradalapadmantashcandramandalavartini | brahmarupa shivakroda nanasukhavilasini
    || || haravishnuvirincindragrahanayakasevita | shiva shaiva ca rudrani tathaiva shivavadini || ||
    matangini shrimati ca tathaivanangamekhala | dakini yogini caiva tathopayogini mata || || maheshvari
    vaishnavi ca bhramari shivarupini | alambusha vegavati krodharupa sumekhala || || gandhari hastajihva
    ca ida caiva shubhankari | pingala brahmaduti ca sushumna caiva gandhini || || atmayonirbrahmayonirjagadyonirayonija
    | bhagarupa bhagasthatri bhagini bhagarupini || || bhagatmika bhagadhararupini bhagamalini | lingakhya
    caiva lingeshi tripura bhairavi tatha || || lingagitih sugitishca lingastha lingarupadhrik | lingamana
    lingabhava lingalinga ca parvati || || bhagavati kaushiki ca prema caiva priyamvada | gridhrarupa
    shivarupa cakrini cakrarupadhrik || || lingabhidhayini lingapriya linganivasini | lingastha lingani
    lingarupini lingasundari || || lingagitirmahaprita bhagagitirmahasukha | linganamasadananda bhaganamasadagatih
    || || lingamalakanthabhusha bhagamalavibhushana | bhagalingamritaprita bhagalingasvarupini || || bhagalingasya
    rupa ca bhagalingasukhavaha | svayambhukusumaprita svayambhukusumarcita || || svayambhukusumaprana
    svayambhupushpatarpita | svayambhupushpaghatita svayambhupushpadharini || || svayambhupushpatilaka
    svayambhupushpacarcita | svayambhupushpanirata svayambhukusumagraha || || svayambhupushpayajnamsha
    svayambhukusumatmika | svayambhupushpanicita svayambhukusumapriya || || svayambhukusumadanalalasonmattamanasa
    | svayambhukusumanandalaharisnigdhadehini || || svayambhukusumadhara svayambhukusumakula | svayambhupushpanilaya
    svayambhupushpavasini || || svayambhukusumasnigdha svayambhukusumatmika | svayambhupushpakarini svayambhupushpavanika
    || || svayambhukusumadhyana svayambhukusumaprabha | svayambhukusumajnana svayambhupushpabhagini ||
    || svayambhukusumollasa svayambhupushpavarshini | svayambhukusumotsaha svayambhupushparupini || ||
    svayambhukusumonmada svayambhupushpasundari | svayambhukusumaradhya svayambhukusumodbhava || || svayambhukusumavyagra
    svayambhupushpapurnita | svayambhupujakaprajna svayambhuhotrimatrika || || svayambhudatrirakshitri
    svayambhuraktatarika | svayambhupujakagrasta svayambhupujakapriya || || svayambhuvandakadhara svayambhunindakantaka
    | svayambhupradasarvasva svayambhupradaputrini || || svayambhupradasasmera svayambhutasharirini |
    sarvakalodbhavaprita sarvakalodbhavatmika || || sarvakalodbhavodbhava sarvakalodbhavodbhava | kundapushpasadaprita
    kundapushpasadaratih || || kundagolodbhavaprana kundagolodbhavatmika | svayambhurva shiva dhatri pavani
    lokapavani || || kirtiryashasvini medha vimedha shukrasundari | ashvini krittika pushya tejaska candramandala
    || || sukshma'sukshma balaka ca varada bhayanashini | varada'bhayada caiva muktibandhavinashini ||
    || kamuka kamada kanta kamakhya kulasundari | duhkhada sukhada moksha mokshadarthaprakashini || ||
    dushtadushtamatishcaiva sarvakaryavinashini | shukradhara shukrarupa shukrasindhunivasini || || shukralaya
    shukrabhoga shukrapujasadaratih | shukrapujya shukrahomasantushta shukravatsala || || shukramurtih
    shukradeha shukrapujakaputrini | shukrastha shukrini shukrasamspriha shukrasundari || || shukrasnata
    shukrakari shukrasevya'tishukrini | mahashukra shukrabhava shukravrishtividhayini || || shukrabhidheya
    shukrarha shukravandakavandita | shukranandakari shukrasadanandabhidhayika || || shukrotsava sadashukrapurna
    shukramanorama | shukrapujakasarvasva shukranindakanashini || || shukratmika shukrasamvat shukrakarshanakarini
    | sharada sadhakaprana sadhakasaktamanasa || || sadhakottamasarvasva sadhakabhaktaraktapa | sadhakanandasantosha
    sadhakanandakarini || || atmavidya brahmavidya parabrahmasvarupini | trikutastha pancakuta sarvakutasharirini
    || || sarvavarnamayi varnajapamalavidhayini | iti shrikalikanamasahasram shivabhashitam || || guhyadguhyataram
    sakshanmahapatakanashanam | pujakale nishithe ca sandhyayorubhayorapi || || labhate ganapatyam sa
    yah pathet sadhakottamah | yah pathet pathayedvapi shrinoti shravayedapi || || sarvapapavinirmuktah
    sa yati kalikapuram | shraddhaya'shraddhaya vapi yah kashcinmanavah smaret || || durgam durgashatam
    tirtva sa yati paramangatim | vandhya va kakavandhya va mritavatsa ca yangana || || shrutva stotramidam
    putran labhate cirajivinah | yam yam kamayate kamam pathan stotramanuttamam | devipadaprasadena tattadapnoti
    nishcitam || || iti shrikalikakulasarvasve haraparashuramasamvade shri kalika sahasranama stotram
    |
  devanagari: श्री शिव उवाच । कथितोऽयं महामन्त्रः सर्वमन्त्रोत्तमोत्तमः । यामासाद्य मया प्राप्तमैश्वर्यपदमुत्तमम्
    ॥ ॥ संयुक्तः परया भक्त्या यथोक्त विधिना भवान् । कुरुतामर्चनं देव्यास्त्रैलोक्यविजिगीषया ॥ ॥ श्रीपरशुराम
    उवाच । प्रसन्नो यदि मे देव परमेश पुरातन । रहस्यं परमं देव्याः कृपया कथय प्रभो ॥ ॥ विनार्चनं विना होमं
    विना न्यासं विना बलिम् । विना गन्धं विना पुष्पं विना नित्योदितां क्रियाम् ॥ ॥ प्राणायामं विना ध्यानं
    विना भूतविशोधनम् । विना दानं विना जापं येन काली प्रसीदति ॥ ॥ श्री शिव उवाच । पृष्टं त्वयोत्तमं प्राज्ञ
    भृगुवंश समुद्भव । भक्तानामपि भक्तोऽसि त्वमेव साधयिष्यसि ॥ ॥ देवीं दानवकोटिघ्नीं लीलया रुधिरप्रियाम्
    । सदा स्तोत्रप्रियामुग्रां कामकौतुकलालसाम् ॥ ॥ सर्वदाऽऽनन्दहृदयामासवोत्सव मानसाम् । माध्वीक मत्स्यमांसानुरागिणीं
    वैष्णवीं पराम् ॥ ॥ श्मशानवासिनीं प्रेतगणनृत्यमहोत्सवाम् । योगप्रभावां योगेशीं योगीन्द्रहृदयस्थिताम्
    ॥ ॥ तामुग्रकालिकां राम प्रसीदयितुमर्हसि । तस्याः स्तोत्रं परं पुण्यं स्वयं काल्या प्रकाशितम् ॥ ॥ तव
    तत् कथयिष्यामि श्रुत्वा वत्सावधारय । गोपनीयं प्रयत्नेन पठनीयं परात्परम् ॥ ॥ यस्यैककालपठनात् सर्वे
    विघ्नाः समाकुलाः । नश्यन्ति दहने दीप्ते पतङ्गा इव सर्वतः ॥ ॥ गद्यपद्यमयी वाणी तस्य गङ्गाप्रवाहवत्
    । तस्य दर्शनमात्रेण वादिनो निष्प्रभां गताः ॥ ॥ तस्य हस्ते सदैवास्ति सर्वसिद्धिर्न संशयः । राजानोऽपि
    च दासत्वं भजन्ते किं परे जनाः ॥ ॥ निशीथे मुक्तकेशस्तु नग्नः शक्तिसमाहितः । मनसा चिन्तयेत् कालीं महाकालेन
    चालिताम् ॥ ॥ पठेत् सहस्रनामाख्यं स्तोत्रं मोक्षस्य साधनम् । प्रसन्ना कालिका तस्य पुत्रत्वेनानुकम्पते
    ॥ ॥ यथा ब्रह्ममृतैर्ब्रह्मकुसुमैः पूजिता परा । प्रसीदति तथानेन स्तुता काली प्रसीदति ॥ अस्य श्री दक्षिणकालिका
    सहस्रनाम स्तोत्रस्य महाकालभैरव ऋषिः अनुष्टुप् छन्दः श्मशानकाली देवता धर्मार्थकाममोक्षार्थे पाठे विनियोगः
    । ध्यानम् शवारूढां महाभीमां घोरदंष्ट्रां हसन्मुखीं चतुर्भुजां खड्गमुण्डवराभयकरां शिवाम् । मुण्डमालाधरां
    देवीं ललाज्जिह्वां दिगम्बरां एवं सञ्चिन्तयेत्कालीं श्मशानालयवासिनीम् ॥ स्तोत्रम् श्मशानकालिका काली
    भद्रकाली कपालिनी । गुह्यकाली महाकाली कुरुकुल्ला विरोधिनी ॥ ॥ कालिका कालरात्रिश्च महाकालनितम्बिनी ।
    कालभैरवभार्या च कुलवर्त्मप्रकाशिनी ॥ ॥ कामदा कामिनी कन्या कमनीयस्वरूपिणी । कस्तूरीरसलिप्ताङ्गी कुञ्जरेश्वरगामिनी
    ॥ ॥ ककारवर्णसर्वाङ्गी कामिनी कामसुन्दरी । कामार्ता कामरूपा च कामधेनुः कलावती ॥ ॥ कान्ता कामस्वरूपा
    च कामाख्या कुलकामिनी । कुलीना कुलवत्यम्बा दुर्गा दुर्गतिनाशिनी ॥ ॥ कौमारी कलजा कृष्णा कृष्णदेहा कृशोदरी
    । कृशाङ्गी कुलिशाङ्गी च क्रीङ्कारी कमला कला ॥ ॥ करालास्या कराली च कुलकान्ताऽपराजिता । उग्रा उग्रप्रभा
    दीप्ता विप्रचित्ता महाबला ॥ ॥ नीला घना मेघनादा मात्रा मुद्रा मितामिता । ब्राह्मी नारायणी भद्रा सुभद्रा
    भक्तवत्सला ॥ ॥ माहेश्वरी च चामुण्डा वाराही नारसिंहिका । वज्राङ्गी वज्रकङ्काली नृमुण्डस्रग्विणी शिवा
    ॥ ॥ मालिनी नरमुण्डाली गलद्रक्तविभूषणा । रक्तचन्दनसिक्ताङ्गी सिन्दूरारुणमस्तका ॥ ॥ घोररूपा घोरदंष्ट्रा
    घोराघोरतरा शुभा । महादंष्ट्रा महामाया सुदती युगदन्तुरा ॥ ॥ सुलोचना विरूपाक्षी विशालाक्षी त्रिलोचना
    । शारदेन्दुप्रसन्नास्या स्फुरत्स्मेराम्बुजेक्षणा ॥ ॥ अट्टहासप्रफुल्लास्या स्मेरवक्त्रा सुभाषिणी ।
    प्रफुल्लपद्मवदना स्मितास्या प्रियभाषिणी ॥ ॥ कोटराक्षी कुलश्रेष्ठा महती बहुभाषिणी । सुमतिः कुमतिश्चण्डा
    चण्डमुण्डातिवेगिनी ॥ ॥ सुकेशी मुक्तकेशी च दीर्घकेशी महाकचा । प्रेतदेहाकर्णपूरा प्रेतपाणिसुमेखला ॥
    ॥ प्रेतासना प्रियप्रेता पुण्यदा कुलपण्डिता । पुण्यालया पुण्यदेहा पुण्यश्लोका च पावनी ॥ ॥ पूता पवित्रा
    परमा परा पुण्यविभूषणा । पुण्यनाम्नी भीतिहरा वरदा खड्गपाणिनी ॥ ॥ नृमुण्डहस्ता शान्ता च छिन्नमस्ता सुनासिका
    । दक्षिणा श्यामला श्यामा शान्ता पीनोन्नतस्तनी ॥ ॥ दिगम्बरा घोररावा सृक्कान्तरक्तवाहिनी । घोररावा शिवासङ्गा
    निःसङ्गा मदनातुरा ॥ ॥ मत्ता प्रमत्ता मदना सुधासिन्धुनिवासिनी । अतिमत्ता महामत्ता सर्वाकर्षणकारिणी
    ॥ ॥ गीतप्रिया वाद्यरता प्रेतनृत्यपरायणा । चतुर्भुजा दशभुजा अष्टादशभुजा तथा ॥ ॥ कात्यायनी जगन्माता
    जगती परमेश्वरी । जगद्बन्धुर्जगद्धात्री जगदानन्दकारिणी ॥ ॥ जगज्जीववती हैमवती माया महालया । नागयज्ञोपवीताङ्गी
    नागिनी नागशायिनी ॥ ॥ नागकन्या देवकन्या गान्धारी किन्नरी सुरी । मोहरात्री महारात्री दारुणामासुरासुरी
    ॥ ॥ विद्याधरी वसुमती यक्षिणी योगिनी जरा । राक्षसी डाकिनी वेदमयी वेदविभूषणा ॥ ॥ श्रुतिस्मृतिमहाविद्या
    गुह्यविद्या पुरातनी । चिन्त्याऽचिन्त्या स्वधा स्वाहा निद्रा तन्द्रा च पार्वती ॥ ॥ अपर्णा निश्चला लोला
    सर्वविद्या तपस्विनी । गङ्गा काशी शची सीता सती सत्यपरायणा ॥ ॥ नीतिः सुनीतिः सुरुचिस्तुष्टिः पुष्टिर्धृतिः
    क्षमा । वाणी बुद्धिर्महालक्ष्मी लक्ष्मीर्नीलसरस्वती ॥ ॥ स्रोतस्वती स्रोतवती मातङ्गी विजया जया । नदी
    सिन्धुः सर्वमयी तारा शून्यनिवासिनी ॥ ॥ शुद्धा तरङ्गिणी मेधा लाकिनी बहुरूपिणी । सदानन्दमयी सत्या सर्वानन्दस्वरूपिणी
    ॥ ॥ सुनन्दा नन्दिनी स्तुत्या स्तवनीया स्वभाविनी । रङ्किणी टङ्किणी चित्रा विचित्रा चित्ररूपिणी ॥ ॥
    पद्मा पद्मालया पद्मसुखी पद्मविभूषणा । शाकिनी हाकिनी क्षान्ता राकिणी रुधिरप्रिया ॥ ॥ भ्रान्तिर्भवानी
    रुद्राणी मृडानी शत्रुमर्दिनी । उपेन्द्राणी महेशानी ज्योत्स्ना चेन्द्रस्वरूपिणी ॥ ॥ सूर्यात्मिका रुद्रपत्नी
    रौद्री स्त्री प्रकृतिः पुमान् । शक्तिः सूक्तिर्मतिमती भुक्तिर्मुक्तिः पतिव्रता ॥ ॥ सर्वेश्वरी सर्वमाता
    शर्वाणी हरवल्लभा । सर्वज्ञा सिद्धिदा सिद्धा भाव्या भव्या भयापहा ॥ ॥ कर्त्री हर्त्री पालयित्री शर्वरी
    तामसी दया । तमिस्रा यामिनीस्था च स्थिरा धीरा तपस्विनी ॥ ॥ चार्वङ्गी चञ्चला लोलजिह्वा चारुचरित्रिणी
    । त्रपा त्रपावती लज्जा निर्लज्जा ह्रीं रजोवती ॥ ॥ सत्त्ववती धर्मनिष्ठा श्रेष्ठा निष्ठुरवादिनी । गरिष्ठा
    दुष्टसंहर्त्री विशिष्टा श्रेयसी घृणा ॥ ॥ भीमा भयानका भीमनादिनी भीः प्रभावती । वागीश्वरी श्रीर्यमुना
    यज्ञकर्त्री यजुःप्रिया ॥ ॥ ऋक्सामाथर्वनिलया रागिणी शोभनस्वरा । कलकण्ठी कम्बुकण्ठी वेणुवीणापरायणा ॥
    ॥ वंशिनी वैष्णवी स्वच्छा धात्री त्रिजगदीश्वरी । मधुमती कुण्डलिनी ऋद्धिः सिद्धिः शुचिस्मिता ॥ ॥ रम्भोर्वशी
    रती रामा रोहिणी रेवती रमा । शङ्खिनी चक्रिणी कृष्णा गदिनी पद्मिनी तथा ॥ ॥ शूलिनी परिघास्त्रा च पाशिनी
    शार्ङ्गपाणिनी । पिनाकधारिणी धूम्रा शरभी वनमालिनी ॥ ॥ वज्रिणी समरप्रीता वेगिनी रणपण्डिता । जटिनी बिम्बिनी
    नीला लावण्याम्बुधिचन्द्रिका ॥ ॥ बलिप्रिया सदापूज्या पूर्णा दैत्येन्द्रमाथिनी । महिषासुरसंहन्त्री वासिनी
    रक्तदन्तिका ॥ ॥ रक्तपा रुधिराक्ताङ्गी रक्तखर्परहस्तिनी । रक्तप्रिया मांसरुचिर्वासवासक्तमानसा ॥ ॥ गलच्छोणितमुण्डालिकण्ठमालाविभूषणा
    । शवासना चितान्तस्था माहेशी वृषवाहिनी ॥ ॥ व्याघ्रत्वगम्बरा चीनचेलिनी सिंहवाहिनी । वामदेवी महादेवी
    गौरी सर्वज्ञभाविनी ॥ ॥ बालिका तरुणी वृद्धा वृद्धमाता जरातुरा । सुभ्रुर्विलासिनी ब्रह्मवादिनी ब्राह्मणी
    मही ॥ ॥ स्वप्नवती चित्रलेखा लोपामुद्रा सुरेश्वरी । अमोघाऽरुन्धती तीक्ष्णा भोगवत्यनुवादिनी ॥ ॥ मन्दाकिनी
    मन्दहासा ज्वालामुख्यसुरान्तका । मानदा मानिनी मान्या माननीया मदोद्धता ॥ ॥ मदिरा मदिरान्मादा मेध्या
    नव्या प्रसादिनी । सुमध्याऽनन्तगुणिनी सर्वलोकोत्तमोत्तमा ॥ ॥ जयदा जित्वरा जैत्री जयश्रीर्जयशालिनी ।
    सुखदा शुभदा सत्या सभासङ्क्षोभकारिणी ॥ ॥ शिवदूती भूतिमती विभूतिर्भीषणानना । कौमारी कुलजा कुन्ती कुलस्त्री
    कुलपालिका ॥ ॥ कीर्तिर्यशस्विनी भूषा भूष्या भूतपतिप्रिया । सगुणा निर्गुणा धृष्टा निष्ठा काष्ठा प्रतिष्ठिता
    ॥ ॥ धनिष्ठा धनदा धन्या वसुधा स्वप्रकाशिनी । उर्वी गुर्वी गुरुश्रेष्ठा सगुणा त्रिगुणात्मिका ॥ ॥ महाकुलीना
    निष्कामा सकामा कामजीवना । कामदेवकला रामाऽभिरामा शिवनर्तकी ॥ ॥ चिन्तामणिः कल्पलता जाग्रती दीनवत्सला
    । कार्तिकी कीर्तिका कृत्या अयोध्या विषमा समा ॥ ॥ सुमन्त्रा मन्त्रिणी घूर्णा ह्लादिनी क्लेशनाशिनी ।
    त्रैलोक्यजननी हृष्टा निर्मांसा मनोरूपिणी ॥ ॥ तडागनिम्नजठरा शुष्कमांसास्थिमालिनी । अवन्ती मथुरा माया
    त्रैलोक्यपावनीश्वरी ॥ ॥ व्यक्ताऽव्यक्ताऽनेकमूर्तिः शर्वरी भीमनादिनी । क्षेमङ्करी शङ्करी च सर्वसम्मोहकारिणी
    ॥ ॥ ऊर्ध्वतेजस्विनी क्लिन्ना महातेजस्विनी तथा । अद्वैता भोगिनी पूज्या युवती सर्वमङ्गला ॥ ॥ सर्वप्रियङ्करी
    भोग्या धरणी पिशिताशना । भयङ्करी पापहरा निष्कलङ्का वशङ्करी ॥ ॥ आशा तृष्णा चन्द्रकला निद्रान्या वायुवेगिनी
    । सहस्रसूर्यसङ्काशा चन्द्रकोटिसमप्रभा ॥ ॥ वह्निमण्डलसंस्था च सर्वतत्त्वप्रतिष्ठिता । सर्वाचारवती सर्वदेवकन्याधिदेवता
    ॥ ॥ दक्षकन्या दक्षयज्ञनाशिनी दुर्गतारिका । इज्या पूज्या विभा भूतिः सत्कीर्तिर्ब्रह्मरूपिणी ॥ ॥ रम्भोरुश्चतुरा
    राका जयन्ती करुणा कुहुः । मनस्विनी देवमाता यशस्या ब्रह्मचारिणी ॥ ॥ ऋद्धिदा वृद्धिदा वृद्धिः सर्वाद्या
    सर्वदायिनी । आधाररूपिणी ध्येया मूलाधारनिवासिनी ॥ ॥ अज्ञा प्रज्ञा पूर्णमनाश्चन्द्रमुख्यनुकूलिनी । वावदूका
    निम्ननाभिः सत्या सन्ध्या दृढव्रता ॥ ॥ आन्वीक्षिकी दण्डनीतिस्त्रयी त्रिदिवसुन्दरी । ज्वलिनी ज्वालिनी
    शैलतनया विन्ध्यवासिनी ॥ ॥ अमेया खेचरी धैर्या तुरीया विमलाऽऽतुरा । प्रगल्भा वारुणी छाया शशिनी विस्फुलिङ्गिनी
    ॥ ॥ भुक्तिः सिद्धिः सदाप्राप्तिः प्राकाम्या महिमाऽणिमा । इच्छासिद्धिर्विसिद्धा च वशित्वोर्ध्वनिवासिनी
    ॥ ॥ लघिमा चैव गायत्री सावित्री भुवनेश्वरी । मनोहरा चिता दिव्या देव्युदारा मनोरमा ॥ ॥ पिङ्गला कपिला
    जिह्वारसज्ञा रसिका रसा । सुषुम्नेडा भोगवती गान्धारी नरकान्तका ॥ ॥ पाञ्चाली रुक्मिणी राधाराध्या भीमाधिराधिका
    । अमृता तुलसी वृन्दा कैटभी कपटेश्वरी ॥ ॥ उग्रचण्डेश्वरी वीरा जननी वीरसुन्दरी । उग्रतारा यशोदाख्या
    दैवकी देवमानिता ॥ ॥ निरञ्जना चित्रदेवी क्रोधिनी कुलदीपिका । कुलवागीश्वरी वाणी मातृका द्राविणी द्रवा
    ॥ ॥ योगेश्वरी महामारी भ्रामरी बिन्दुरूपिणी । दूती प्राणेश्वरी गुप्ता बहुला चमरी प्रभा ॥ ॥ कुब्जिका
    ज्ञानिनी ज्येष्ठा भुशुण्डी प्रकटा तिथिः । द्रविणी गोपनी माया कामबीजेश्वरी क्रिया ॥ ॥ शाम्भवी केकरा
    मेना मूषलास्त्रा तिलोत्तमा । अमेयविक्रमा क्रूरा सम्पत्शाला त्रिलोचना ॥ ॥ स्वस्तिर्हव्यवहा प्रीतिरुष्मा
    धूम्रार्चिरङ्गदा । तपिनी तापिनी विश्वा भोगदा धारिणी धरा ॥ ॥ त्रिखण्डा बोधिनी वश्या सकला शब्दरूपिणी
    । बीजरूपा महामुद्रा योगिनी योनिरूपिणी ॥ ॥ अनङ्गकुसुमाऽनङ्गमेखलाऽनङ्गरूपिणी । वज्रेश्वरी च जयिनी सर्वद्वन्द्वक्षयङ्करी
    ॥ ॥ षडङ्गयुवती योगयुक्ता ज्वालांशुमालिनी । दुराशया दुराधारा दुर्जया दुर्गरूपिणी ॥ ॥ दुरन्ता दुष्कृतिहरा
    दुर्ध्येया दुरतिक्रमा । हंसेश्वरी त्रिकोणस्था शाकम्भर्यनुकम्पिनी ॥ ॥ त्रिकोणनिलया नित्या परमामृतरञ्जिता
    । महाविद्येश्वरी श्वेता भेरुण्डा कुलसुन्दरी ॥ ॥ त्वरिता भक्तिसंसक्ता भक्तवश्या सनातनी । भक्तानन्दमयी
    भक्तभाविका भक्तशङ्करी ॥ ॥ सर्वसौन्दर्यनिलया सर्वसौभाग्यशालिनी । सर्वसम्भोगभवना सर्वसौख्यनिरूपिणी ॥
    ॥ कुमारीपूजनरता कुमारीव्रतचारिणी । कुमारीभक्तिसुखिनी कुमारीरूपधारिणी ॥ ॥ कुमारीपूजकप्रीता कुमारीप्रीतिदा
    प्रिया । कुमारीसेवकासङ्गा कुमारीसेवकालया ॥ ॥ आनन्दभैरवी बालभैरवी बटुभैरवी । श्मशानभैरवी कालभैरवी पुरभैरवी
    ॥ ॥ महाभैरवपत्नी च परमानन्दभैरवी । सुधानन्दभैरवी च उन्मादानन्दभैरवी ॥ ॥ मुक्तानन्दभैरवी च तथा तरुणभैरवी
    । ज्ञानानन्दभैरवी च अमृतानन्दभैरवी ॥ ॥ महाभयङ्करी तीव्रा तीव्रवेगा तपस्विनी । त्रिपुरा परमेशानी सुन्दरी
    पुरसुन्दरी ॥ ॥ त्रिपुरेशी पञ्चदशी पञ्चमी पुरवासिनी । महासप्तदशी चैव षोडशी त्रिपुरेश्वरी ॥ ॥ महाङ्कुशस्वरूपा
    च महाचक्रेश्वरी तथा । नवचक्रेश्वरी चक्रेश्वरी त्रिपुरमालिनी ॥ ॥ राजराजेश्वरी धीरा महात्रिपुरसुन्दरी
    । सिन्दूरपूररुचिरा श्रीमत्त्रिपुरसुन्दरी ॥ ॥ सर्वाङ्गसुन्दरी रक्तारक्तवस्त्रोत्तरीयिणी । जवायावकसिन्दूररक्तचन्दनधारिणी
    ॥ ॥ जवायावकसिन्दूररक्तचन्दनरूपधृक् । चामरी बालकुटिलनिर्मला श्यामकेशिनी ॥ ॥ वज्रमौक्तिकरत्नाढ्या किरीटमुकुटोज्ज्वला
    । रत्नकुण्डलसंयुक्तस्फुरद्गण्डमनोरमा ॥ ॥ कुञ्जरेश्वरकुम्भोत्थमुक्तारञ्जितनासिका । मुक्ताविद्रुममाणिक्यहाराढ्यस्तनमण्डला
    ॥ ॥ सूर्यकान्तेन्दुकान्ताढ्यस्पर्शाश्मकण्ठभूषणा । बीजपूरस्फुरद्बीजदन्तपङ्क्तिरनुत्तमा ॥ ॥ कामकोदण्डकाभुग्नभ्रूकटाक्षप्रवर्षिणी
    । मातङ्गकुम्भवक्षोजा लसत्कोकनदेक्षणा ॥ ॥ मनोज्ञशष्कुलीकर्णा हंसीगतिविडम्बिनी । पद्मरागाङ्गदज्योतिर्दोश्चतुष्कप्रकाशिनी
    ॥ ॥ नानामणिपरिस्फूर्जच्छुद्धकाञ्चनकङ्कणा । नागेन्द्रदन्तनिर्माणवलयाङ्कितपाणिनी ॥ ॥ अङ्गुरीयकचित्राङ्गी
    विचित्रक्षुद्रघण्टिका । पट्टाम्बरपरीधाना कलमञ्जीरशिञ्जिनी ॥ ॥ कर्पूरागरुकस्तूरीकुङ्कुमद्रवलेपिता ।
    विचित्ररत्नपृथिवीकल्पशाखितलस्थिता ॥ ॥ रत्नद्वीपस्फुरद्रत्नसिंहासनविलासिनी । षट्चक्रभेदनकरी परमानन्दरूपिणी
    ॥ ॥ सहस्रदलपद्मान्तश्चन्द्रमण्डलवर्तिनी । ब्रह्मरूपा शिवक्रोडा नानासुखविलासिनी ॥ ॥ हरविष्णुविरिञ्चीन्द्रग्रहनायकसेविता
    । शिवा शैवा च रुद्राणी तथैव शिववादिनी ॥ ॥ मातङ्गिनी श्रीमती च तथैवानङ्गमेखला । डाकिनी योगिनी चैव तथोपयोगिनी
    मता ॥ ॥ माहेश्वरी वैष्णवी च भ्रामरी शिवरूपिणी । अलम्बुषा वेगवती क्रोधरूपा सुमेखला ॥ ॥ गान्धारी हस्तजिह्वा
    च इडा चैव शुभङ्करी । पिङ्गला ब्रह्मदूती च सुषुम्ना चैव गन्धिनी ॥ ॥ आत्मयोनिर्ब्रह्मयोनिर्जगद्योनिरयोनिजा
    । भगरूपा भगस्थात्री भगिनी भगरूपिणी ॥ ॥ भगात्मिका भगाधाररूपिणी भगमालिनी । लिङ्गाख्या चैव लिङ्गेशी त्रिपुरा
    भैरवी तथा ॥ ॥ लिङ्गगीतिः सुगीतिश्च लिङ्गस्था लिङ्गरूपधृक् । लिङ्गमाना लिङ्गभवा लिङ्गलिङ्गा च पार्वती
    ॥ ॥ भगवती कौशिकी च प्रेमा चैव प्रियंवदा । गृध्ररूपा शिवारूपा चक्रिणी चक्ररूपधृक् ॥ ॥ लिङ्गाभिधायिनी
    लिङ्गप्रिया लिङ्गनिवासिनी । लिङ्गस्था लिङ्गनी लिङ्गरूपिणी लिङ्गसुन्दरी ॥ ॥ लिङ्गगीतिर्महाप्रीता भगगीतिर्महासुखा
    । लिङ्गनामसदानन्दा भगनामसदागतिः ॥ ॥ लिङ्गमालाकण्ठभूषा भगमालाविभूषणा । भगलिङ्गामृतप्रीता भगलिङ्गस्वरूपिणी
    ॥ ॥ भगलिङ्गस्य रूपा च भगलिङ्गसुखावहा । स्वयम्भूकुसुमप्रीता स्वयम्भूकुसुमार्चिता ॥ ॥ स्वयम्भूकुसुमप्राणा
    स्वयम्भूपुष्पतर्पिता । स्वयम्भूपुष्पघटिता स्वयम्भूपुष्पधारिणी ॥ ॥ स्वयम्भूपुष्पतिलका स्वयम्भूपुष्पचर्चिता
    । स्वयम्भूपुष्पनिरता स्वयम्भूकुसुमग्रहा ॥ ॥ स्वयम्भूपुष्पयज्ञांशा स्वयम्भूकुसुमात्मिका । स्वयम्भूपुष्पनिचिता
    स्वयम्भूकुसुमप्रिया ॥ ॥ स्वयम्भूकुसुमादानलालसोन्मत्तमानसा । स्वयम्भूकुसुमानन्दलहरीस्निग्धदेहिनी ॥
    ॥ स्वयम्भूकुसुमाधारा स्वयम्भूकुसुमाकुला । स्वयम्भूपुष्पनिलया स्वयम्भूपुष्पवासिनी ॥ ॥ स्वयम्भूकुसुमस्निग्धा
    स्वयम्भूकुसुमात्मिका । स्वयम्भूपुष्पकरिणी स्वयम्भूपुष्पवाणिका ॥ ॥ स्वयम्भूकुसुमध्याना स्वयम्भूकुसुमप्रभा
    । स्वयम्भूकुसुमज्ञाना स्वयम्भूपुष्पभागिनी ॥ ॥ स्वयम्भूकुसुमोल्लासा स्वयम्भूपुष्पवर्षिणी । स्वयम्भूकुसुमोत्साहा
    स्वयम्भूपुष्परूपिणी ॥ ॥ स्वयम्भूकुसुमोन्मादा स्वयम्भूपुष्पसुन्दरी । स्वयम्भूकुसुमाराध्या स्वयम्भूकुसुमोद्भवा
    ॥ ॥ स्वयम्भूकुसुमाव्यग्रा स्वयम्भूपुष्पपूर्णिता । स्वयम्भूपूजकप्राज्ञा स्वयम्भूहोतृमातृका ॥ ॥ स्वयम्भूदातृरक्षित्री
    स्वयम्भूरक्ततारिका । स्वयम्भूपूजकग्रस्ता स्वयम्भूपूजकप्रिया ॥ ॥ स्वयम्भूवन्दकाधारा स्वयम्भूनिन्दकान्तका
    । स्वयम्भूप्रदसर्वस्वा स्वयम्भूप्रदपुत्रिणी ॥ ॥ स्वयम्भूप्रदसस्मेरा स्वयम्भूतशरीरिणी । सर्वकालोद्भवप्रीता
    सर्वकालोद्भवात्मिका ॥ ॥ सर्वकालोद्भवोद्भावा सर्वकालोद्भवोद्भवा । कुण्डपुष्पसदाप्रीता कुण्डपुष्पसदारतिः
    ॥ ॥ कुण्डगोलोद्भवप्राणा कुण्डगोलोद्भवात्मिका । स्वयम्भूर्वा शिवा धात्री पावनी लोकपावनी ॥ ॥ कीर्तिर्यशस्विनी
    मेधा विमेधा शुक्रसुन्दरी । अश्विनी कृत्तिका पुष्या तेजस्का चन्द्रमण्डला ॥ ॥ सूक्ष्माऽसूक्ष्मा बलाका
    च वरदा भयनाशिनी । वरदाऽभयदा चैव मुक्तिबन्धविनाशिनी ॥ ॥ कामुका कामदा कान्ता कामाख्या कुलसुन्दरी । दुःखदा
    सुखदा मोक्षा मोक्षदार्थप्रकाशिनी ॥ ॥ दुष्टादुष्टमतिश्चैव सर्वकार्यविनाशिनी । शुक्राधारा शुक्ररूपा
    शुक्रसिन्धुनिवासिनी ॥ ॥ शुक्रालया शुक्रभोगा शुक्रपूजासदारतिः । शुक्रपूज्या शुक्रहोमसन्तुष्टा शुक्रवत्सला
    ॥ ॥ शुक्रमूर्तिः शुक्रदेहा शुक्रपूजकपुत्रिणी । शुक्रस्था शुक्रिणी शुक्रसंस्पृहा शुक्रसुन्दरी ॥ ॥ शुक्रस्नाता
    शुक्रकरी शुक्रसेव्याऽतिशुक्रिणी । महाशुक्रा शुक्रभवा शुक्रवृष्टिविधायिनी ॥ ॥ शुक्राभिधेया शुक्रार्हा
    शुक्रवन्दकवन्दिता । शुक्रानन्दकरी शुक्रसदानन्दाभिधायिका ॥ ॥ शुक्रोत्सवा सदाशुक्रपूर्णा शुक्रमनोरमा
    । शुक्रपूजकसर्वस्वा शुक्रनिन्दकनाशिनी ॥ ॥ शुक्रात्मिका शुक्रसंवत् शुक्राकर्षणकारिणी । शारदा साधकप्राणा
    साधकासक्तमानसा ॥ ॥ साधकोत्तमसर्वस्वा साधकाभक्तरक्तपा । साधकानन्दसन्तोषा साधकानन्दकारिणी ॥ ॥ आत्मविद्या
    ब्रह्मविद्या परब्रह्मस्वरूपिणी । त्रिकूटस्था पञ्चकूटा सर्वकूटशरीरिणी ॥ ॥ सर्ववर्णमयी वर्णजपमालाविधायिनी
    । इति श्रीकालिकानामसहस्रं शिवभाषितम् ॥ ॥ गुह्याद्गुह्यतरं साक्षान्महापातकनाशनम् । पूजाकाले निशीथे
    च सन्ध्ययोरुभयोरपि ॥ ॥ लभते गाणपत्यं स यः पठेत् साधकोत्तमः । यः पठेत् पाठयेद्वापि शृणोति श्रावयेदपि
    ॥ ॥ सर्वपापविनिर्मुक्तः स याति कालिकापुरम् । श्रद्धयाऽश्रद्धया वापि यः कश्चिन्मानवः स्मरेत् ॥ ॥ दुर्गं
    दुर्गशतं तीर्त्वा स याति परमाङ्गतिम् । वन्ध्या वा काकवन्ध्या वा मृतवत्सा च याङ्गना ॥ ॥ श्रुत्वा स्तोत्रमिदं
    पुत्रान् लभते चिरजीविनः । यं यं कामयते कामं पठन् स्तोत्रमनुत्तमम् । देवीपादप्रसादेन तत्तदाप्नोति निश्चितम्
    ॥ ॥ इति श्रीकालिकाकुलसर्वस्वे हरपरशुरामसंवादे श्री कालिका सहस्रनाम स्तोत्रम् ।
