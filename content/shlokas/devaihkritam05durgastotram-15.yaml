id: devaihkritam05durgastotram-15
category: stotram
name:
  english: devaihkritam05durgastotram 15
  devanagari: देवैःकृतं०५दुर्गास्तोत्रम् १५
content:
  english: devaih kritam 5 durgastotram 15 deva ucuh | asmadartham tvaya rupamanantakshimayam dhritam
    | munayah kirtayishyanti shatakshim tvamato'mbike || 34|| atmadehasamudbhutaih shakairloka mrita yatah
    | shakambhariti vikhyatam tatte nama bhavishyati || 35|| durgamakhyo mahadaityo hato yasmattatah shive
    | durgam bhagavatim bhadram vyaharishyanti manavah || 36|| yoganidre namastubhyam namaste'stu mahabale
    | namo jnanaprade tubhyam vishvamatre namo namah || 37|| tattvamasyadivakyairya bodhyate parameshvari
    | anantakotibrahmandanayikayai namo namah || 38|| vanmanahkayadushprapam suryacandragnilocanam | stotum
    na shaknumo matastvatprabhavabudha vayam || 39|| madrishanamarandrishtva kah kuryadidrishim dayam
    | varjayitva sureshanim shatakshi mataram vina || 40|| triloki nabhibhuyeta badhabhishca nirantaram
    | evam karyastvaya yatno'smakam vairivinashanam || 41|| iti shivapurane umasamhitayam pancashattamadhyayantargatam
    devaih kritam durgastotram samaptam | shivapurana | umasamhita | adhyaya 50
  devanagari: देवैः कृतं ५ दुर्गास्तोत्रम् १५ देवा ऊचुः । अस्मदर्थं त्वया रूपमनन्ताक्षिमयं धृतम् । मुनयः
    कीर्तयिष्यन्ति शताक्षीं त्वामतोऽम्बिके ॥ ३४॥ आत्मदेहसमुद्भूतैः शाकैर्लोका मृता यतः । शाकम्भरीति विख्यातं
    तत्ते नाम भविष्यति ॥ ३५॥ दुर्गमाख्यो महादैत्यो हतो यस्मात्ततः शिवे । दुर्गां भगवतीं भद्रां व्याहरिष्यन्ति
    मानवाः ॥ ३६॥ योगनिद्रे नमस्तुभ्यं नमस्तेऽस्तु महाबले । नमो ज्ञानप्रदे तुभ्यं विश्वमात्रे नमो नमः ॥
    ३७॥ तत्त्वमस्यादिवाक्यैर्या बोध्यते परमेश्वरी । अनन्तकोटिब्रह्माण्डनायिकायै नमो नमः ॥ ३८॥ वाङ्मनःकायदुष्प्रापां
    सूर्यचन्द्राग्निलोचनाम् । स्तोतुं न शक्नुमो मातस्त्वत्प्रभावाबुधा वयम् ॥ ३९॥ मादृशानमरान्दृष्ट्वा
    कः कुर्यादीदृशीं दयाम् । वर्जयित्वा सुरेशानीं शताक्षी मातरं विना ॥ ४०॥ त्रिलोकी नाभिभूयेत बाधाभिश्च
    निरन्तरम् । एवं कार्यस्त्वया यत्नोऽस्माकं वैरिविनाशनम् ॥ ४१॥ इति शिवपुराणे उमासंहितायां पञ्चाशत्तमाध्यायान्तर्गतं
    देवैः कृतं दुर्गास्तोत्रं समाप्तम् । शिवपुराण । उमासंहिता । अध्याय ५०
