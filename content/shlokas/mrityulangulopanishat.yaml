id: mrityulangulopanishat
category: upanishad
name:
  english: mrityulangulopanishat
  devanagari: मृत्युलान्गूलोपनिषत्
content:
  english: rinuyannityam mrityulangalam trisandhyam kirtayati va sa brahmahatyam vyapohati | suvarnasteyyasteyi
    bhavati | gurudarabhigamyagami bhavati | sarvebhyah patakebhya upapatakebhyashca sadyo vimukto bhavati
    | sakrijjaptenanena gayatryah shashtisahasrani phalitani bhavanti | ashtau brahmanan grahayitva brahmalokamavapnoti
    | yah kashcinna dadati sa shvitri kushthi kunakhi va bhavet | yah kashciddiyamanam na grihnati so'ndho
    badhiro muko va bhavati | mrityumupasthitah shanmasadarvak | bandho'yam nashyati ityanena mrityulangulakhyasya
    ca mahamantrasya shatakritvo japtena bhagavan dharmarat mama priyatam || ritam nashtam yada kale shanmasena
    marishyati | ritam satyam param brahma purusham krishnapingalam || urdhvalingam virupaksham vishvarupam
    namamyaham | satyam tu pancame mase param brahma caturthake || purusham ca tritiye va dvitiye krishnapingalam
    || urdhvalingam tu masena virupaksham tadardhake | vishvarupam tritiye'hni sadyashcaiva namo namah
    ||
  devanagari: ृणुयान्नित्यं मृत्युलाङ्गलं त्रिसन्ध्यं कीर्तयति वा स ब्रह्महत्यां व्यपोहति । सुवर्णस्तेय्यस्तेयी
    भवति । गुरुदाराभिगाम्यगामी भवति । सर्वेभ्यः पातकेभ्य उपपातकेभ्यश्च सद्यो विमुक्तो भवति । सकृज्जप्तेनानेन
    गायत्र्याः षष्टिसहस्राणि फलितानि भवन्ति । अष्टौ ब्राह्मणान् ग्राहयित्वा ब्रह्मलोकमवाप्नोति । यः कश्चिन्न
    ददाति स श्वित्री कुष्ठी कुनखी वा भवेत् । यः कश्चिद्दीयमानं न गृह्णाति सोऽन्धो बधिरो मूको वा भवति ।
    मृत्युमुपस्थितः षण्मासादर्वाक् । बन्धोऽयं नश्यति इत्यनेन मृत्युलाङ्गूलाख्यस्य च महामन्त्रस्य शतकृत्वो
    जप्तेन भगवान् धर्मराट् मम प्रीयताम् ॥ ऋतं नष्टं यदा काले षण्मासेन मरिष्यति । ऋतं सत्यं परं ब्रह्म
    पुरुषं कृष्णपिङ्गलम् ॥ ऊर्ध्वलिङ्गं विरूपाक्षं विश्वरूपं नमाम्यहम् । सत्यं तु पञ्चमे मासे परं ब्रह्म
    चतुर्थके ॥ पुरुषं च तृतीये वा द्वितीये कृष्णपिङ्गलम् ॥ ऊर्ध्वलिङ्गं तु मासेन विरूपाक्षं तदर्धके ।
    विश्वरूपं तृतीयेऽह्नि सद्यश्चैव नमो नमः ॥
