id: shani-mamtra
category: stotram
name:
  english: shani mamtra
  devanagari: शनि मंत्र
content:
  english: namaste konasamsthaya pimgalaya namostute namaste raudradehaya namaste camtakayaca namaste
    mamdasamjnaya namaste saurayevibho namaste yamasamjnaya shanaishcara namostute prasadam kuru devesha
  devanagari: नमस्ते कोणसंस्थाय पिंगलाय नमोस्तुते नमस्ते रौद्रदेहाय नमस्ते चांतकायच नमस्ते मंदसंज्ञाय
    नमस्ते सौरयेविभो नमस्ते यमसंज्ञाय शनैश्चर नमोस्तुते प्रसादं कुरु देवेश
meaning: {}
