id: aditikritamdivakarastotram
category: stotram
name:
  english: aditikritamdivakarastotram
  devanagari: अदितिकृतंदिवाकरस्तोत्रम्
content:
  english: aditikritam divakarastotram sa dadarsha mahakutam tejaso'mbarasamshritam | jagada me prasideti
    na tvam pashyami gopate || 32|| yatha drishtavati purvamambarastham sudurdrisham | nirahara vivasvantam
    tapantam tadanantaram || 33|| sanghatam tejasam tadvadiha pashyami bhutale | prasadam kuru pashyeyam
    yadrupam te divakara | bhaktanukampaka vibho bhaktaham pahi me sutan || 34|| tvam dhata visrijasi
    vishvametattvam pasi sthitikaranaya sapravrittah | tvayyante layamakhilam prayati tattvam tvatto'nya
    na hi gatirasti sarvaloke || 35|| tvam brahma harirajasamjnitastvamindro vitteshah pitripatirappatih
    samirah | somo'gnirgaganapatirmahidharo'bdhih kim stavyam tava sakalatmarupadhamnah || 36|| yajnesha
    tvamanudinamatmakarmasaktah stunvanto vividhapadairdvija yajanti | dhyayanto viniyatacetaso bhavantam
    yogasthah paramapadam prayanti martyah || 37|| tapasi pacasi vishvam pasi bhasmikaroshi prakatayasi
    mayukhairhradayasyambugarbhaih | srijasi kamalajanma palayasyacyutakhyah kshapayasi ca yugante rudrarupastvamekah
    || 38|| iti shrimarkandeyapurane ekadhikashatatamadhyayantargatam aditikritam divakarastotram samaptam
    | markandeyapurana | adhyaya 101
  devanagari: अदितिकृतं दिवाकरस्तोत्रम् सा ददर्श महाकूटं तेजसोऽम्बरसंश्रितम् । जगाद मे प्रसीदेति न त्वां
    पश्यामि गोपते ॥ ३२॥ यथा दृष्टवती पूर्वमम्बरस्थं सुदुर्दृशम् । निराहारा विवस्वन्तं तपन्तं तदनन्तरम्
    ॥ ३३॥ सङ्घातं तेजसां तद्वदिह पश्यामि भूतले । प्रसादं कुरु पश्येयं यद्रूपं ते दिवाकर । भक्तानुकम्पक
    विभो भक्ताहं पाहि मे सुतान् ॥ ३४॥ त्वं धाता विसृजसि विश्वमेतत्त्वं पासि स्थितिकरणाय सप्रवृत्तः । त्वय्यन्ते
    लयमखिलं प्रयाति तत्त्वं त्वत्तोऽन्या न हि गतिरस्ति सर्वलोके ॥ ३५॥ त्वं ब्रह्मा हरिरजसंज्ञितस्त्वमिन्द्रो
    वित्तेशः पितृपतिरप्पतिः समीरः । सोमोऽग्निर्गगनपतिर्महीधरोऽब्धिः किं स्तव्यं तव सकलात्मरूपधाम्नः ॥
    ३६॥ यज्ञेश त्वामनुदिनमात्मकर्मसक्ताः स्तुन्वन्तो विविधपदैर्द्विजा यजन्ति । ध्यायन्तो विनियतचेतसो भवन्तं
    योगस्थाः परमपदं प्रयान्ति मर्त्याः ॥ ३७॥ तपसि पचसि विश्वं पासि भस्मीकरोषि प्रकटयसि मयूखैर्ह्रादयस्यम्बुगर्भैः
    । सृजसि कमलजन्मा पालयस्यच्युताख्यः क्षपयसि च युगान्ते रुद्ररूपस्त्वमेकः ॥ ३८॥ इति श्रीमार्कण्डेयपुराणे
    एकाधिकशततमाध्यायान्तर्गतं अदितिकृतं दिवाकरस्तोत्रं समाप्तम् । मार्कण्डेयपुराण । अध्याय १०१
