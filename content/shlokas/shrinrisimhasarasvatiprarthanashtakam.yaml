id: shrinrisimhasarasvatiprarthanashtakam
category: stotram
name:
  english: shrinrisimhasarasvatiprarthanashtakam
  devanagari: श्रीनृसिंहसरस्वतीप्रार्थनाष्टकम्
content:
  english: shrinrisimhasarasvatiprarthanashtakam shrivasudevanandasarasvati shrinrisimhasarasvatiprarthanashtakam
    shrivasudevanandasarasvati || shrinrisimhasarasvatiprarthanashtakam || ritakritsvagiro
  devanagari: श्रीनृसिंहसरस्वतीप्रार्थनाष्टकम् श्रीवासुदेवानन्दसरस्वती श्रीनृसिंहसरस्वतीप्रार्थनाष्टकम्
    श्रीवासुदेवानन्दसरस्वती ।। श्रीनृसिंहसरस्वतीप्रार्थनाष्टकम् ।। ऋतकृत्स्वगिरो
meaning: {}
