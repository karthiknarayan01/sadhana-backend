id: brahmanaihkritamnarmadastotram
category: stotram
name:
  english: brahmanaihkritamnarmadastotram
  devanagari: ब्राह्मणैःकृतंनर्मदास्तोत्रम्
content:
  english: brahmanaih kritam narmadastotram tatah kecitstuvantyanye jaya devi namo'stu te || 24|| namo'stu
    te siddhaganairnishevite namo'stu te sarvapavitramangale | namo'stu te viprasahasrasevite namo'stu
    rudrangasamudbhave vare || 25|| namo'stu te sarvapavitrapavane namo'stu te devi varaprade shive |
    namami te shitajale sukhaprade saridvare papahare vicitrite || 26|| anekabhutaughasusevitange gandharvayakshoragapavitange
    | mahagajaughairmahishairvarahairapiyase toyamahormimale || 27|| namami te sarvavare sukhaprade vimocayasmanaghapashabaddhan
    || 28|| bhramanti tavannarakeshu martya yavattavambho na hi samshrayanti | sprishtam karaishcandramaso
    raveshcettaddevi dadyatparamam padam tu || 29|| anekasamsarabhayarditanam papairanekairabhiveshtitanam
    | gatistvamambhojasamanavaktre dvandvairanekairabhisamvritanam || 30|| nadyashca puta vimala bhavanti
    tvam devi samprapya na samshayo'tra | duhkhaturanamabhayam dadasi shishtairanekairabhipujitasi ||
    31|| vinmutradehashca nimagnadeha bhramanti tavannarakeshu martyah | mahabaladhvastatarangabhangam
    jalam na yavattava samsprishanti || 32|| mlecchah pulindastvatha yatudhanah pibanti ye'mbhastava devi
    punyam | te'pi pramucyanti bhayacca ghoratkimatra vipra bhavapashabhitah || 33|| saramsi nadyah kshayamabhyupeta
    ghore yuge'sminkalinavasrishte | tvam bhrajase devi jalaughapurna diviva nakshatrapathe ca ganga ||
    34|| tava prasadadvarade vishishte kalam yathemam paripalayitva | yasyama moksham tava suprasadadvayam
    yatha tvam kuru nah prasadam || 35|| tvamashrita ye sharanam gatashca gatistvamambeva piteva putran
    | tvatpalita yavadimam sughoram kalam tvanavrishtihatam kshipamah || 36|| iti shriskandapurane avantyakhande
    revakhande shashtitama
  devanagari: ब्राह्मणैः कृतं नर्मदास्तोत्रम् ततः केचित्स्तुवन्त्यन्ये जय देवि नमोऽस्तु ते ॥ २४॥ नमोऽस्तु
    ते सिद्धगणैर्निषेविते नमोऽस्तु ते सर्वपवित्रमङ्गले । नमोऽस्तु ते विप्रसहस्रसेविते नमोऽस्तु रुद्राङ्गसमुद्भवे
    वरे ॥ २५॥ नमोऽस्तु ते सर्वपवित्रपावने नमोऽस्तु ते देवि वरप्रदे शिवे । नमामि ते शीतजले सुखप्रदे सरिद्वरे
    पापहरे विचित्रिते ॥ २६॥ अनेकभूतौघसुसेविताङ्गे गन्धर्वयक्षोरगपाविताङ्गे । महागजौघैर्महिषैर्वराहैरापीयसे
    तोयमहोर्मिमाले ॥ २७॥ नमामि ते सर्ववरे सुखप्रदे विमोचयास्मानघपाशबद्धान् ॥ २८॥ भ्रमन्ति तावन्नरकेषु
    मर्त्या यावत्तवाम्भो न हि संश्रयन्ति । स्पृष्टं करैश्चन्द्रमसो रवेश्चेत्तद्देवि दद्यात्परमं पदं तु
    ॥ २९॥ अनेकसंसारभयार्दितानां पापैरनेकैरभिवेष्टितानाम् । गतिस्त्वमम्भोजसमानवक्त्रे द्वन्द्वैरनेकैरभिसंवृतानाम्
    ॥ ३०॥ नद्यश्च पूता विमला भवन्ति त्वां देवि सम्प्राप्य न संशयोऽत्र । दुःखातुराणामभयं ददासि शिष्टैरनेकैरभिपूजितासि
    ॥ ३१॥ विण्मूत्रदेहाश्च निमग्नदेहा भ्रमन्ति तावन्नरकेषु मर्त्याः । महाबलध्वस्ततरङ्गभङ्गं जलं न यावत्तव
    संस्पृशन्ति ॥ ३२॥ म्लेच्छाः पुलिन्दास्त्वथ यातुधानाः पिबन्ति येऽम्भस्तव देवि पुण्यम् । तेऽपि प्रमुच्यन्ति
    भयाच्च घोरात्किमत्र विप्रा भवपाशभीताः ॥ ३३॥ सरांसि नद्यः क्षयमभ्युपेता घोरे युगेऽस्मिन्कलिनावसृष्टे
    । त्वं भ्राजसे देवि जलौघपूर्णा दिवीव नक्षत्रपथे च गङ्गा ॥ ३४॥ तव प्रासादाद्वरदे विशिष्टे कालं यथेमं
    परिपालयित्वा । यास्याम मोक्षं तव सुप्रसादाद्वयं यथा त्वं कुरु नः प्रसादम् ॥ ३५॥ त्वामाश्रिता ये शरणं
    गताश्च गतिस्त्वमम्बेव पितेव पुत्रान् । त्वत्पालिता यावदिमं सुघोरं कालं त्वनावृष्टिहतं क्षिपामः ॥ ३६॥
    इति श्रीस्कन्दपुराणे आवन्त्यखण्डे रेवाखण्डे षष्टितमा
