id: ardhanari-mean
category: stotram
name:
  english: ardhanari mean
  devanagari: अर्धनारी मेअन्
content:
  english: ardhanarishvarastotram sartha campeyagaurardhasharirakayai karpuragaurardhasharirakaya | dhammillakayai
    ca jatadharaya namah shivayai ca namah shivaya || 1 ||
  devanagari: अर्धनारीश्वरस्तोत्रम् सार्थ चाम्पेयगौरार्धशरीरकायै कर्पूरगौरार्धशरीरकाय । धम्मिल्लकायै च
    जटाधराय नमः शिवायै च नमः शिवाय ॥ १ ॥
meaning: {}
