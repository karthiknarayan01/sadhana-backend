id: santanagopalakrishnamantram
category: mantra
name:
  english: santanagopalakrishnamantram
  devanagari: सन्तानगोपालकृष्णमन्त्रम्
content:
  english: shrisantanagopalakrishnaprityarthe jape viniyogah | dhyanam shankhacakradharam krishnam rathastham
    ca caturbhujam | sarvabharanasamyuktam pitavasasamacyutam || dvijavaryarjunayutam vishnutejopabrimhitam
    | samarpayantam vipraya nashtananiya balakan || karunamritasampurnadrishtyaikshantam ca tam dvijam
    | dhyatva japarcanadini kuryadbhaktiparayanah | putrarthi svastike nyasya tatrastham krishnam pujayet
    || mulamantrah
  devanagari: श्रीसन्तानगोपालकृष्णप्रीत्यर्थे जपे विनियोगः । ध्यानम् शङ्खचक्रधरं कृष्णं रथस्थं च चतुर्भुजम्
    । सर्वाभरणसंयुक्तं पीतवाससमच्युतम् ॥ द्विजवर्यार्जुनयुतं विष्णुतेजोपबृम्हितम् । समर्पयन्तं विप्राय
    नष्टानानीय बालकान् ॥ करुणामृतसम्पूर्णदृष्ट्यैक्षन्तं च तं द्विजम् । ध्यात्वा जपार्चनादीनि कुर्याद्भक्तिपरायणः
    । पुत्रार्थी स्वस्तिके न्यस्य तत्रस्थं कृष्णं पूजयेत् ॥ मूलमन्त्रः
meaning: {}
