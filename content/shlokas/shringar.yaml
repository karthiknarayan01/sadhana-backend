id: shringar
category: shataka
name:
  english: shringar
  devanagari: श्रिन्गर्
content:
  english: '|| 37|| drutavilambita madhurayam madhurairapi kokila kalaravairmalayasya ca vayubhih || virahinah
    prahinasti sharirino vipadi hanta sudha''pi vishayate || 38|| shardulavikridita avasah kilakincitasya
    dayitah parshve vilasalasah karne kokilakaminikalaravah smero latamandapah || goshthi satkavibhih
    samam katipayaih sevyah sitamsho karah keshancitsukhayanti dhanyahridayam caitre vicitrah kshapah
    || 39|| shardulavikridita panthastrivirahagnitivrataratamatanvati manjari makandeshu pikanganabhiradhuna
    sotkanthamalokyate || apyete navapataliparimalapragbharapataccara vanti klantivitanatanavakritah shrikhandashailanilah
    ||40|| arya priyapurato yuvatinam tavatpadamatanoti hridi manah | bhavati na yavaccandanatarusurabhirnirmalah
    pavanah || 41|| arya sahakarakusumakesaranikarabharamodamurcchitadigante | madhuramadhuvidhuramadhupe
    madhau bhavetkasya notkantha || 42|| vasantatilaka acchacchacandanarasardrakara mrigakshyo dharagrihani
    kusumani ca kaumudi ca || mando marutsumanasah shuci harmyaprishtham grishme madam ca madanam ca vivardhayanti
    || 43|| shikharini srajo hridyamoda vyajanapavanashcandrakiranah paragah kasaro malayajarasah sidhu
    vishadam || shucih saudhotsangah pratanu vasanam pankajadrisho nidadharta hyetatsukhamupalabhante
    sukritinah || 44|| dodhaka tarunivaishohipitakama vikasitajatipushpasugandhih | unnatapinapayodharabhara
    pravrit kurute kasya na harsham'
  devanagari: ॥ ३७॥ द्रुतविलम्बित मधुरयं मधुरैरपि कोकिला कलरवैर्मलयस्य च वायुभिः ॥ विरहिणः प्रहिणस्ति
    शरीरिणो विपदि हन्त सुधाऽपि विषायते ॥ ३८॥ शार्दूलविक्रीडित आवासः किलकिञ्चितस्य दयिताः पार्श्वे विलासालसाः
    कर्णे कोकिलकामिनीकलरवः स्मेरो लतामण्डपः ॥ गोष्ठी सत्कविभिः समं कतिपयैः सेव्याः सितांशो कराः केषाञ्चित्सुखयन्ति
    धन्यहृदयं चैत्रे विचित्राः क्षपाः ॥ ३९॥ शार्दूलविक्रीडित पान्थस्त्रीविरहाग्नितीव्रतरतामातन्वती मञ्जरी
    माकन्देषु पिकाङ्गनाभिरधुना सोत्कण्ठमालोक्यते ॥ अप्येते नवपाटलीपरिमलप्राग्भारपाटच्चरा वान्ति क्लान्तिवितानतानवकृतः
    श्रीखण्डशैलानिलाः ॥४०॥ आर्या प्रियपुरतो युवतीनां तावत्पदमातनोति हृदि मानः । भवति न यावच्चन्दनतरुसुरभिर्निर्मलः
    पवनः ॥ ४१॥ आर्या सहकारकुसुमकेसरनिकरभरामोदमूर्च्छितदिगन्ते । मधुरमधुविधुरमधुपे मधौ भवेत्कस्य नोत्कण्ठा
    ॥ ४२॥ वसन्ततिलका अच्छाच्छचन्दनरसार्द्रकरा मृगाक्ष्यो धारागृहाणि कुसुमानि च कौमुदी च ॥ मन्दो मरुत्सुमनसः
    शुचि हर्म्यपृष्ठं ग्रीष्मे मदं च मदनं च विवर्धयन्ति ॥ ४३॥ शिखरिणी स्रजो हृद्यामोदा व्यजनपवनश्चन्द्रकिरणाः
    परागः कासारो मलयजरसः सीधु विशदम् ॥ शुचिः सौधोत्सङ्गः प्रतनु वसनं पङ्कजदृशो निदाधार्ता ह्येतत्सुखमुपलभन्ते
    सुकृतिनः ॥ ४४॥ दोधक तरुणीवैषोहीपितकामा विकसितजातीपुष्पसुगन्धिः । उन्नतपीनपयोधरभारा प्रावृट् कुरुते
    कस्य न हर्षम्
