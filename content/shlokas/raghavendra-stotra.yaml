id: raghavendra-stotra
category: stotram
name:
  english: raghavendra stotra
  devanagari: राघवेन्द्र स्तोत्र
content:
  english: ityashtaksharamantratah | japitadbhavitannityam ishtarthah syurnasamshayah || 15|| hantu nah
    kayajandoshanatmatmiyasamudbhavan | sarvanapi pumarthamshca dadatu gururatmavit || 16|| iti kalatraye
    nityam prarthanam yah karoti sah | ihamutraptasarveshto modate natra samshayah || 17|| agamyamahima
    loke raghavendro mahayashah | shrimadhvamatadugdhabdhicandro'vatu sada'naghah || 18|| sarvayatraphalavaptyai
    yathashaktipradakshinam | karomi tava siddhasya vrindavanagatam jalam | shirasa dharayamyadya sarvatirthaphalaptaye
    || 19|| sarvabhishtarthasiddhyartham namaskaram karomyaham | tava sankirtanam vedashastrarthajnanasiddhaye
    || 20|| samsare'kshayasagare prakritito'gadhe sada dustare | sarvavadyajalagrahairanupamaih kamadibhangakule
    | nanavibhramadurbhrame'mitabhayastomadiphenotkate | duhkhotkrishtavishe samuddhara guro ma magnarupam
    sada || 21|| raghavendragurustotram yah pathedbhaktipurvakam | tasya kushthadiroganam nivrittistvaraya
    bhavet || 22|| andho'pi divyadrishtih syadedamuko'pi vagpatih | purnayuh purnasampattih stotrasyasya
    japadbhavet || 23|| yah pibejjalametena stotrenaivabhimantritam | tasya kukshigata doshah sarve nashyanti
    tatkshanat || 24|| yadvrindavanamasadya panguh khanjo'pi va janah | stotrenanena yah kuryatpradakshinanamaskriti
    | sa janghalo bhavedeva gururajaprasadatah || 25|| somasuryoparage ca pushyarkadisamagame | yo'nuttamamidam
    stotramashtottarashatam japet | bhutapretapishacadipida tasya na jayate || 26|| etatstotram samuccarya
    gurorvrindavanantike | dipasamyojanajnanam putralabho bhaveddhruvam || 27|| paravadijayo divyajnanabhaktyadivardhanam
    | sarvabhishtapravriddhissyannatra karya vicarana || 28|| rajacoramahavyaghrasarpanakradipidanam |
    na jayate'sya stotrasya prabhavannatra samshayah || 29|| yo bhaktya gururaghavendracaranadvandvam
    smaran yah pathet | stotram divyamidam sada nahi bhavettasyasukham kincana | kim tvishtarthasamriddhireva
    kamalanathaprasadodayat | kirtirdigvidita vibhutiratula sakshi hayasyo'tra hi || 30|| iti shri raghavendrarya
    gururajaprasadatah | kritam stotramidam punyam shrimadbhirhyappanabhidaih || 31|| iti shri appannacaryaviracitam
    shriraghavendrastotram sampurnam || || bharatiramanamukhyapranantargata shrikrishnarpanamastu ||
  devanagari: इत्यष्टाक्षरमन्त्रतः । जपिताद्भावितान्नित्यं इष्टार्थाः स्युर्नसंशयः ॥ १५॥ हन्तु नः कायजान्दोषानात्मात्मीयसमुद्भवान्
    । सर्वानपि पुमर्थांश्च ददातु गुरुरात्मवित् ॥ १६॥ इति कालत्रये नित्यं प्रार्थनां यः करोति सः । इहामुत्राप्तसर्वेष्टो
    मोदते नात्र संशयः ॥ १७॥ अगम्यमहिमा लोके राघवेन्द्रो महायशाः । श्रीमध्वमतदुग्धाब्धिचन्द्रोऽवतु सदाऽनघः
    ॥ १८॥ सर्वयात्राफलावाप्त्यै यथाशक्तिप्रदक्षिणम् । करोमि तव सिद्धस्य वृन्दावनगतं जलम् । शिरसा धारयाम्यद्य
    सर्वतीर्थफलाप्तये ॥ १९॥ सर्वाभीष्टार्थसिद्ध्यर्थं नमस्कारं करोम्यहम् । तव सङ्कीर्तनं वेदशास्त्रार्थज्ञानसिद्धये
    ॥ २०॥ संसारेऽक्षयसागरे प्रकृतितोऽगाधे सदा दुस्तरे । सर्वावद्यजलग्रहैरनुपमैः कामादिभङ्गाकुले । नानाविभ्रमदुर्भ्रमेऽमितभयस्तोमादिफेनोत्कटे
    । दुःखोत्कृष्टविषे समुद्धर गुरो मा मग्नरूपं सदा ॥ २१॥ राघवेन्द्रगुरुस्तोत्रं यः पठेद्भक्तिपूर्वकम्
    । तस्य कुष्ठादिरोगाणां निवृत्तिस्त्वरया भवेत् ॥ २२॥ अन्धोऽपि दिव्यदृष्टिः स्यादेडमूकोऽपि वाग्पतिः
    । पूर्णायुः पूर्णसम्पत्तिः स्तोत्रस्यास्य जपाद्भवेत् ॥ २३॥ यः पिबेज्जलमेतेन स्तोत्रेणैवाभिमन्त्रितम्
    । तस्य कुक्षिगता दोषाः सर्वे नश्यन्ति तत्क्षणात् ॥ २४॥ यद्वृन्दावनमासाद्य पङ्गुः खञ्जोऽपि वा जनः ।
    स्तोत्रेणानेन यः कुर्यात्प्रदक्षिणनमस्कृति । स जङ्घालो भवेदेव गुरुराजप्रसादतः ॥ २५॥ सोमसूर्योपरागे
    च पुष्यार्कादिसमागमे । योऽनुत्तममिदं स्तोत्रमष्टोत्तरशतं जपेत् । भूतप्रेतपिशाचादिपीडा तस्य न जायते
    ॥ २६॥ एतत्स्तोत्रं समुच्चार्य गुरोर्वृन्दावनान्तिके । दीपसंयोजनाज्ञानं पुत्रलाभो भवेद्ध्रुवम् ॥ २७॥
    परवादिजयो दिव्यज्ञानभक्त्यादिवर्धनम् । सर्वाभीष्टप्रवृद्धिस्स्यान्नात्र कार्या विचारणा ॥ २८॥ राजचोरमहाव्याघ्रसर्पनक्रादिपीडनम्
    । न जायतेऽस्य स्तोत्रस्य प्रभावान्नात्र संशयः ॥ २९॥ यो भक्त्या गुरुराघवेन्द्रचरणद्वन्द्वं स्मरन् यः
    पठेत् । स्तोत्रं दिव्यमिदं सदा नहि भवेत्तस्यासुखं किञ्चन । किं त्विष्टार्थसमृद्धिरेव कमलानाथप्रसादोदयात्
    । कीर्तिर्दिग्विदिता विभूतिरतुला साक्षी हयास्योऽत्र हि ॥ ३०॥ इति श्री राघवेन्द्रार्य गुरुराजप्रसादतः
    । कृतं स्तोत्रमिदं पुण्यं श्रीमद्भिर्ह्यप्पणाभिदैः ॥ ३१॥ इति श्री अप्पण्णाचार्यविरचितं श्रीराघवेन्द्रस्तोत्रं
    सम्पूर्णम् ॥ ॥ भारतीरमणमुख्यप्राणान्तर्गत श्रीकृष्णार्पणमस्तु ॥
