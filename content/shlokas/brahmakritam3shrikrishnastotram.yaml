id: brahmakritam3shrikrishnastotram
category: stotram
name:
  english: brahmakritam3shrikrishnastotram
  devanagari: ब्रह्मकृतं३श्रीकृष्णस्तोत्रम्
content:
  english: brahmakritam 3 shrikrishnastotram brahmavaca | paripurnatama brahmasvarupa nityavigraha | jyotihsvarupa
    parama namo'stu prakriteh para || 12|| sunirlipta nirakara sakara dhyanahetuna | svecchamaya param
    dhama paramatmannamo'stu te || 13|| sarvakaryasvarupesha karananam ca karana | brahmeshasheshadevesha
    sarvesha te namo namah || 14|| sarasvatisha padmesha parvatisha paratpara | he savitrisha radhesha
    raseshvara namo namah || 15|| sarveshamadibhutastvam sarvah sarveshvarastatha | sarvapata ca samharta
    srishtirupa namo namah || 16|| iti brahmavaivartapurane shrikrishnajanmakhande purvabhage ekonatrimshadhikashatatamadhyayantargatam
    brahmakritam shrikrishnastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: ब्रह्मकृतं ३ श्रीकृष्णस्तोत्रम् ब्रह्मवाच । परिपूर्णतम ब्रह्मस्वरूप नित्यविग्रह । ज्योतिःस्वरूप
    परम नमोऽस्तु प्रकृतेः पर ॥ १२॥ सुनिर्लिप्त निराकार साकार ध्यानहेतुना । स्वेच्छामय परं धाम परमात्मन्नमोऽस्तु
    ते ॥ १३॥ सर्वकार्यस्वरूपेश कारणानां च कारण । ब्रह्मेशशेषदेवेश सर्वेश ते नमो नमः ॥ १४॥ सरस्वतीश पद्मेश
    पार्वतीश परात्पर । हे सावित्रीश राधेश रासेश्वर नमो नमः ॥ १५॥ सर्वेषामादिभूतस्त्वं सर्वः सर्वेश्वरस्तथा
    । सर्वपाता च संहर्ता सृष्टिरूप नमो नमः ॥ १६॥ इति ब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे पूर्वभागे एकोनत्रिंशाधिकशततमाध्यायान्तर्गतं
    ब्रह्मकृतं श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
