id: vemkateshakavacastotram-2
category: kavacha
name:
  english: vemkateshakavacastotram
  devanagari: वेंकटेशकवचस्तोत्रम्
content:
  english: paniyuge varam katitate vibhranamarkacchavim | devam devashikhamanim shriyamatho vakshodadhanam
    harim bhushajalamanekaratnakhacitam divyam kiritangadam || 1|| varahah patu me shirsham keshan shrivemnkateshvarah
    | shikhamiḻapatih karno lalatam divyavigrahah || 2|| netre yugantasthayi me kapole kanakambarah |
    nasikamindiranatho vaktram brahmadivanditah || 3|| cubukam kamadah kanthamagastyabhishtadayakah |
    amsau kamsantakah patu kamathasstanamandale || 4|| hritpadmam patvadinatma kukshim kalambaradyutih
    | katim kolavapuh patu guhyam kamalakoshabhrit || 5|| nabhim padmapatih patu karau kalmashanashanah
    | angulirhaimashailendro nakharanambaradyutih || 6|| uru tumburuganajno januni shankhacakrabhrit |
    padau padmekshanah patu gulphau cakashagangadah || 7|| disho dikpalavandyanghrirbharyam pandavatirthagah
    | avyatputran shrinivasah sarvakaryani gotrarat || 8|| venkateshah sada patu madbhagyam devapujitah
    | kumaradharikavaso bhaktabhishtabhayapradah || 9|| shankhabhayapradata tu shambhusevitapadukah |
    vanchitam varado dadyadvenkatadrishikhamanih || 10|| shvetavaraharupo'yam dinaratrisvarupavan | rakshenmam
    kamalanathah sarvada patu vamanah || 11|| shrinivasasya kavacam trisandhyam bhaktiman pathet | tasmin
    shrivenkatadhishah prasanno bhavati dhruvam || 12|| apatkale japedyastu shantimayatyupadravat | rogah
    prashamanam yanti trirjapedbhanuvasare || 13|| sarvasiddhimavapnoti vishnusayujyamapnuyat | || iti
    shrimadagneyapurane venkatacalamahatmye vasishtanaradasamvade venkateshadivyakavacastotram nama pancadasho'dhyayah
    ||
  devanagari: पाणियुगे वरं कटितटे विभ्राणमर्कच्छविम् । देवं देवशिखामणिं श्रियमथो वक्षोदधानं हरिं भूषाजालमनेकरत्नखचितं
    दिव्यं किरीटाङ्गदम् ॥ १॥ वराहः पातु मे शीर्षं केशान् श्रीवेंङ्कटेश्वरः । शिखामिळापतिः कर्णो ललाटं
    दिव्यविग्रहः ॥ २॥ नेत्रे युगान्तस्थायी मे कपोले कनकाम्बरः । नासिकामिन्दिरानाथो वक्त्रं ब्रह्मादिवन्दितः
    ॥ ३॥ चुबुकं कामदः कण्ठमगस्त्याभीष्टदायकः । अंसौ कंसान्तकः पातु कमठस्स्तनमण्डले ॥ ४॥ हृत्पद्मं पात्वदीनात्मा
    कुक्षिं कालाम्बरद्युतिः । कटिं कोलवपुः पातु गुह्यं कमलकोशभृत् ॥ ५॥ नाभिं पद्मापतिः पातु करौ कल्मषनाशनः
    । अङ्गुलीर्हैमशैलेन्द्रो नखरानम्बरद्युतिः ॥ ६॥ ऊरू तुम्बुरुगानज्ञो जानुनी शङ्खचक्रभृत् । पादौ पद्मेक्षणः
    पातु गुल्फौ चाकाशगाङ्गदः ॥ ७॥ दिशो दिक्पालवन्द्याङ्घ्रिर्भार्यां पाण्डवतीर्थगः । अव्यात्पुत्रान् श्रीनिवासः
    सर्वकार्याणि गोत्रराट् ॥ ८॥ वेङ्कटेशः सदा पातु मद्भाग्यं देवपूजितः । कुमारधारिकावासो भक्ताभीष्टाभयप्रदः
    ॥ ९॥ शङ्खाभयप्रदाता तु शम्भुसेवितपादुकः । वाञ्छितं वरदो दद्याद्वेङ्कटाद्रिशिखामणिः ॥ १०॥ श्वेतवाराहरूपोऽयं
    दिनरात्रिस्वरूपवान् । रक्षेन्मां कमलनाथः सर्वदा पातु वामनः ॥ ११॥ श्रीनिवासस्य कवचं त्रिसन्ध्यं भक्तिमान्
    पठेत् । तस्मिन् श्रीवेङ्कटाधीशः प्रसन्नो भवति ध्रुवम् ॥ १२॥ आपत्काले जपेद्यस्तु शान्तिमायात्युपद्रवात्
    । रोगाः प्रशमनं यान्ति त्रिर्जपेद्भानुवासरे ॥ १३॥ सर्वसिद्धिमवाप्नोति विष्णुसायुज्यमाप्नुयात् । ॥
    इति श्रीमदाग्नेयपुराणे वेङ्कटाचलमाहात्म्ये वसिष्टनारदसंवादे वेङ्कटेशदिव्यकवचस्तोत्रं नाम पञ्चदशोऽध्यायः
    ॥
