id: sharikasahasranamastotra
category: sahasranama
name:
  english: sharikasahasranamastotra
  devanagari: शारिकासहस्रनामस्तोत्र
content:
  english: hramshramityadina karanganyasau || || rishyadinyasah || om shrimahadevarishaye namah shirasi
    | anushtupchandase namah mukhe | shrisharikabhagavati devatayai namah hridaye || sham bijaya namah
    dakshastane || shrim shaktaye namah vamastane || phram kilakaya namah nabhau || shrisharikabhagavati
    prasadasiddhyarthe pathe viniyogaya namah padayoh || || shadanganyasah || || karanyasah || hram shram
    angushthabhyam namah | hrim shrim tarjanibhyam namah | hrum shrum madhyamabhyam namah | haim shraim
    anamikabhyam namah | hraum shraum kanishthabhyam namah | hrah shrah karatalakarapushthabhyam namah
    | || anganyasah || hram shram hridayaya namah | hrim shrim shirase svaha | hrum shrum shikhayai vashat
    | haim shraim kavacaya hum | hraum shraum netratrayaya vaushat | hrah shrah astraya phat | || dhyanam
    || balarkakotisadrishiminducudam karambujaih | varacakrabhayasimshca dharayantim hasanmukhim || 1||
    simharudham raktavastram raktabharanabhushitam | vamadevankanilaya hritpadme sharikam bhaje || 2||
    balarkakotidyutiminducudam varasicakrabhayabahumadyam | simhadhirudham shivavamadehalinam bhaje cetasi
    sharikeshim || 3|| || stotram || om hrim shrim hum phram am sham shrisharika shyamasundari | shila
    shari shuki shanta shantamanasagocara || 1|| shantistha shantida shantih shyama shyamapayodhara |
    devi shashankabimbabha shashankakritashekhara || 2|| shashankashobhilavanya shashankamadhyavasini
    | sharduralavaha deveshi shardulasthitiruttama || 3|| shadulacarmavasana shaktih shardulavahana |
    gauri padmavati pina pinavakshojakutmala || 4|| pitambara raktadanta dadimikusumopama | sphuradratnamshukhacita
    ratnamandalavigraha || 5|| raktambaradhara devi ratnamalavibhushana | ratnasammurchitatma ca dipta
    diptashikha daya || 6|| dayavati kalpalata kalpantadahanopama | bhairavi bhimanada ca bhayanakamukhi
    bhaga || 7|| kara karunyarupa ca bhagamalavibhushana | bhageshvari bhagastha ca kurukulla krishodari
    || 8|| kadambari patotkrishta parama parameshvari | sati sarasvati satya satyasatyasvarupini || 9||
    parampara patakara patala patalaprabha | padmini padmavadana padma padmakara shiva || 10|| shivashraya
    sharacchanta shaci rambha vibhavari | dyumanistarana patha pitheshi pivarakritih || 11|| acintya musaladhara
    matangi madhurasvana | vinagitapriya gatha garudi garudadhvaja || 12|| ativa sundarakara sundari sundaralaka
    | alaka nakamadhyastha nakini nakipujita || 13|| pataleshvarapujya ca patalatalacarini | ananta'nantarupa
    ca hyajnata
  devanagari: ह्रांश्रामित्यादिना कराङ्गन्यासौ ॥ ॥ ऋष्यादिन्यासः ॥ ॐ श्रीमहादेवऋषये नमः शिरसि । अनुष्टुप्छन्दसे
    नमः मुखे । श्रीशारिकाभगवती देवतायै नमः हृदये ॥ शां बीजाय नमः दक्षस्तने ॥ श्रीं शक्तये नमः वामस्तने
    ॥ फ्रां कीलकाय नमः नाभौ ॥ श्रीशारिकाभगवती प्रसादसिद्ध्यर्थे पाठे विनियोगाय नमः पादयोः ॥ ॥ षडङ्गन्यासः
    ॥ ॥ करन्यासः ॥ ह्रां श्रां अङ्गुष्ठाभ्यां नमः । ह्रीं श्रीं तर्जनीभ्यां नमः । ह्रूं श्रूं मध्यमाभ्यां
    नमः । हैं श्रैं अनामिकाभ्यां नमः । ह्रौं श्रौं कनिष्ठाभ्यां नमः । ह्रः श्रः करतलकरपुष्ठाभ्यां नमः
    । ॥ अङ्गन्यासः ॥ ह्रां श्रां हृदयाय नमः । ह्रीं श्रीं शिरसे स्वाहा । ह्रूं श्रूं शिखायै वषट् । हैं
    श्रैं कवचाय हुम् । ह्रौं श्रौं नेत्रत्रयाय वौषट् । ह्रः श्रः अस्त्राय फट् । ॥ ध्यानम् ॥ बालार्ककोटिसदृशीमिन्दुचूडां
    कराम्बुजैः । वरचक्राभयासींश्च धारयन्तीं हसन्मुखीम् ॥ १॥ सिंहारूढां रक्तवस्त्रां रक्ताभरणभूषिताम् ।
    वामदेवाङ्कनिलया हृत्पद्मे शारिकां भजे ॥ २॥ बालार्ककोटिद्युतिमिन्दुचूडां वरासिचक्राभयबाहुमाद्याम् ।
    सिंहाधिरूढां शिववामदेहलीनां भजे चेतसि शारिकेशीम् ॥ ३॥ ॥ स्तोत्रम् ॥ ॐ ह्रीं श्रीं हूं फ्रां आं शां
    श्रीशारिका श्यामसुन्दरी । शिला शारी शुकी शान्ता शान्तमानसगोचरा ॥ १॥ शान्तिस्था शान्तिदा शान्तिः श्यामा
    श्यामपयोधरा । देवी शशाङ्कबिम्बाभा शशाङ्ककृतशेखरा ॥ २॥ शशाङ्कशोभिलावण्या शशाङ्कमध्यवासिनी । शार्दूरलवाहा
    देवेशी शार्दूलस्थितिरुत्तमा ॥ ३॥ शादूलचर्मवसना शक्तिः शार्दूलवाहना । गौरी पद्मावती पीना पीनवक्षोजकुट्मला
    ॥ ४॥ पीताम्बरा रक्तदन्ता दाडिमीकुसुमोपमा । स्फुरद्रत्नांशुखचिता रत्नमण्डलविग्रहा ॥ ५॥ रक्ताम्बरधरा
    देवी रत्नमालाविभूषणा । रत्नसंमूर्छितात्मा च दीप्ता दीप्तशिखा दया ॥ ६॥ दयावती कल्पलता कल्पान्तदहनोपमा
    । भैरवी भीमनादा च भयानकमुखी भगा ॥ ७॥ कारा कारुण्यरूपा च भगमालाविभूषणा । भगेश्वरी भगस्था च कुरुकुल्ला
    कृशोदरी ॥ ८॥ कादम्बरी पटोत्कृष्टा परमा परमेश्वरी । सती सरस्वती सत्या सत्यासत्यस्वरूपिणी ॥ ९॥ परम्परा
    पटाकारा पाटला पाटलप्रभा । पद्मिनी पद्मवदना पद्मा पद्माकरा शिवा ॥ १०॥ शिवाश्रया शरच्छान्ता शची रम्भा
    विभावरी । द्युमणिस्तरणा पाठा पीठेशी पीवराकृतिः ॥ ११॥ अचिन्त्या मुसलाधारा मातङ्गी मधुरस्वना । वीणागीतप्रिया
    गाथा गारुडी गरुडध्वजा ॥ १२॥ अतीव सुन्दराकारा सुन्दरी सुन्दरालका । अलका नाकमध्यस्था नाकिनी नाकिपूजिता
    ॥ १३॥ पातालेश्वरपूज्या च पातालतलचारिणी । अनन्ताऽनन्तरूपा च ह्यज्ञाता
