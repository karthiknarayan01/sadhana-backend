id: aditya-kavacham
category: stotram
name:
  english: Aditya Kavacham
content:
  english: asya shri adityakavacastotramahamantrasya agastyo bhagavanrishih anushtupchandah adityo devata
    shrim bijam nim shaktih sum kilakam mama adityaprasadasiddhyarthe jape viniyogah | dhyanam japakusumasankasham
    dvibhujam padmahastakam sindurambaramalyam ca raktagandhanulepanam | manikyaratnakhacita sarvabharanabhushitam
    saptashvarathavaham tu merum caiva pradakshinam || devasuravarairvandyam ghrinibhih parisevitam |
    dhyayetpathetsuvarnabham suryasya kavacam muda || kavacam ghrinih patu shirodeshe suryah patu lalatakam
    | adityo locane patu shruti patu divakarah || ghranam patu sada bhanuh mukham patu sadaravih | jihvam
    patu jagannetrah kantham patu vibhavasuh || skandhau grahapatih patu bhujau patu prabhakarah | karavabjakarah
    patu hridayam patu nabhomanih || dvadashatma katim patu savita patu sakthini | uru patu surashreshto
    januni patu bhaskarah || janghe me patu martando gulphau patu tvishampatih | padau dinamanih patu
    patu mitro'khilam vapuh || adityakavacam punyamabhedyam vajrasannibham | sarvarogabhayadibhyo mucyate
    natra samshayah || samvatsaramupasitva samrajyapadavim labhet | ashesharogashantyartham dhyayedadityamandalam
    | aditya mandala stutih anekaratnasamyuktam svarnamanikyabhushanam | kalpavrikshasamakirnam kadambakusumapriyam
    || sinduravarnaya sumandalaya suvarnaratnabharanaya tubhyam | padmadinetre ca supankajaya brahmendra
    shankaraya || samraktacurnam sasuvarnatoyam sakunkumabham sakusham sapushpam | pradattamadaya ca hemapatre
    prashastanadam bhagavan prasida || iti adityakavacam |
  devanagari: अस्य श्री आदित्यकवचस्तोत्रमहामन्त्रस्य अगस्त्यो भगवानृषिः अनुष्टुप्छन्दः आदित्यो देवता श्रीं
    बीजं णीं शक्तिः सूं कीलकं मम आदित्यप्रसादसिद्ध्यर्थे जपे विनियोगः । ध्यानं जपाकुसुमसङ्काशं द्विभुजं
    पद्महस्तकम् सिन्दूराम्बरमाल्यं च रक्तगन्धानुलेपनम् । माणिक्यरत्नखचित सर्वाभरणभूषितम् सप्ताश्वरथवाहं
    तु मेरुं चैव प्रदक्षिणम् ॥ देवासुरवरैर्वन्द्यं घृणिभिः परिसेवितम् । ध्यायेत्पठेत्सुवर्णाभं सूर्यस्य
    कवचं मुदा ॥ कवचं घृणिः पातु शिरोदेशे सूर्यः पातु ललाटकम् । आदित्यो लोचने पातु श्रुती पातु दिवाकरः
    ॥ घ्राणं पातु सदा भानुः मुखं पातु सदारविः । जिह्वां पातु जगन्नेत्रः कण्ठं पातु विभावसुः ॥ स्कन्धौ
    ग्रहपतिः पातु भुजौ पातु प्रभाकरः । करावब्जकरः पातु हृदयं पातु नभोमणिः ॥ द्वादशात्मा कटिं पातु सविता
    पातु सक्थिनी । ऊरू पातु सुरश्रेष्टो जानुनी पातु भास्करः ॥ जङ्घे मे पातु मार्ताण्डो गुल्फौ पातु त्विषाम्पतिः
    । पादौ दिनमणिः पातु पातु मित्रोऽखिलं वपुः ॥ आदित्यकवचं पुण्यमभेद्यं वज्रसन्निभम् । सर्वरोगभयादिभ्यो
    मुच्यते नात्र संशयः ॥ संवत्सरमुपासित्वा साम्राज्यपदवीं लभेत् । अशेषरोगशान्त्यर्थं ध्यायेदादित्यमण्डलम्
    । आदित्य मण्डल स्तुतिः अनेकरत्नसंयुक्तं स्वर्णमाणिक्यभूषणम् । कल्पवृक्षसमाकीर्णं कदम्बकुसुमप्रियम्
    ॥ सिन्दूरवर्णाय सुमण्डलाय सुवर्णरत्नाभरणाय तुभ्यम् । पद्मादिनेत्रे च सुपङ्कजाय ब्रह्मेन्द्र शङ्कराय
    ॥ संरक्तचूर्णं ससुवर्णतोयं सकुङ्कुमाभं सकुशं सपुष्पम् । प्रदत्तमादाय च हेमपात्रे प्रशस्तनादं भगवन्
    प्रसीद ॥ इति आदित्यकवचम् ।
