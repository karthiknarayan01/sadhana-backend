id: prahladak-itaganeshastotra
category: stotram
name:
  english: prahladakṟitaganeshastotra
  devanagari: प्रह्लादक्ऱितगणेशस्तोत्र
content:
  english: mokshanam siddhirbhinna prakirtita | brahmabhutakari siddhistyaktavya pamcadha sada || 14||
    mohada siddhiratyantamohadharakatam gata | buddhishcaiva sa sarvatra tabhyam khelati vighnapah ||
    15|| buddhya yad buddhyate tatra pashcan mohah pravartate | ato ganeshabhaktya sa mayaya varjito bhavet
    || 16|| pancadha cittavrittishca pancadha siddhimadarat | tyakva ganeshayogena ganesham bhaja bhavatah
    || 17|| tatah sa ganarajasya mantram tasmai dadau svayam | gananam tveti vedoktam sa vidhim munisattama
    || 18|| tena sampujito yogi prahladena mahatmana | yayau gritsamado dakshah svargalokam vihayasa ||
    19|| prahladashca tatha sadhuh sadhayitva visheshatah | yogam yogindramukhyam sa shantisaddharako'bhavat
    || 20|| virocanaya rajyam sa dadau putraya daityapah | ganeshabhajane yogi sa saktah sarvada'bhavat
    || 21|| sagunam vishnu rupam ca nirgunam brahmavacakam | ganeshena dhritam sarvam kalamshena na samshayah
    || 22|| evam jnatva mahayogi prahlado'bhedamashritah | hridi cintamanim jnatva'bhajadananyabhavanah
    || 23|| svalpakalena daityendrah shantiyogaparayanah | shantim prapto ganeshenaikabhavo'bhavatatparah
    || 24|| shapashcaiva ganeshena prahladasya nirakritah | na punardushtasamgena bhranto'bhunmayi manada
  devanagari: मोक्षाणां सिद्धिर्भिन्ना प्रकीर्तिता । ब्रह्मभूतकरी सिद्धिस्त्यक्तव्या पंचधा सदा ॥ १४॥ मोहदा
    सिद्धिरत्यन्तमोहधारकतां गता । बुद्धिश्चैव स सर्वत्र ताभ्यां खेलति विघ्नपः ॥ १५॥ बुद्ध्या यद् बुद्ध्यते
    तत्र पश्चान् मोहः प्रवर्तते । अतो गणेशभक्त्या स मायया वर्जितो भवेत् ॥ १६॥ पञ्चधा चित्तवृत्तिश्च पञ्चधा
    सिद्धिमादरात् । त्यक्वा गणेशयोगेन गणेशं भज भावतः ॥ १७॥ ततः स गणराजस्य मन्त्रं तस्मै ददौ स्वयम् । गणानां
    त्वेति वेदोक्तं स विधिं मुनिसत्तम ॥ १८॥ तेन सम्पूजितो योगी प्रह्लादेन महात्मना । ययौ गृत्समदो दक्षः
    स्वर्गलोकं विहायसा ॥ १९॥ प्रह्लादश्च तथा साधुः साधयित्वा विशेषतः । योगं योगीन्द्रमुख्यं स शान्तिसद्धारकोऽभवत्
    ॥ २०॥ विरोचनाय राज्यं स ददौ पुत्राय दैत्यपः । गणेशभजने योगी स सक्तः सर्वदाऽभवत् ॥ २१॥ सगुणं विष्णु
    रूपं च निर्गुणं ब्रह्मवाचकम् । गणेशेन धृतं सर्वं कलांशेन न संशयः ॥ २२॥ एवं ज्ञात्वा महायोगी प्रह्लादोऽभेदमाश्रितः
    । हृदि चिन्तामणिम् ज्ञात्वाऽभजदनन्यभावनः ॥ २३॥ स्वल्पकालेन दैत्येन्द्रः शान्तियोगपरायणः । शान्तिं
    प्राप्तो गणेशेनैकभावोऽभवतत्परः ॥ २४॥ शापश्चैव गणेशेन प्रह्लादस्य निराकृतः । न पुनर्दुष्टसंगेन भ्रान्तोऽभून्मयि
    मानद
