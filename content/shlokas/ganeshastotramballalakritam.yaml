id: ganeshastotramballalakritam
category: stotram
name:
  english: ganeshastotramballalakritam
  devanagari: गणेशस्तोत्रम्बल्लालकृतं
content:
  english: ballalakritam shriganeshastotram || shriganeshaya namah || ballala uvaca | ganeshaya dhamne
    pareshaya tubhyam sada''nandarupaya sarvatigaya | aparasvarupaya devadhideva namaste prabho bhaktasamrakshakaya
    || 13|| herambaya namastubhyam vighneshaya paratmane | brahmeshaya mahayogadatre shantimayaya te ||
    14|| svanandavasine tubhyam svanande khelakaya te | yogeshaya mahodararupadharinnamo namah || 15||
    sada sanmayakayayavyaktashirshne namo namah | yogarupena sarvatra samsthitaya namo namah || 16|| siddhibuddhipradatre
    te siddhibuddhimayaya ca | siddhibuddhipate tubhyam namaste gajavakrine || 17|| lambodaraya devaya
    caturbahudharaya te | mushakadhvajine tubhyam pashankushapradharine || 18|| dvijarupadharayaiva bhaktavatsalabhavatah
    | rakshitum bhaktavakyam tu samagataya te namah || 19|| tvam mata tvam pita nathastvam suhrit kuladaivatam
    | dravyam vidyadikam me tvam sarvam te vai namo namah || 20|| dehena vaca manasa kritan me samsargikan
    jagritisvapnajatan | samsuptito yan sakalaparadhan kshamasva heramba dayanidhe tvam || 21|| evamuktva
    nanarta'sau ballalo bhaktiyantritah | sashrunetrah saromanco brahmanagre mahamune || 22|| tamuvaca
    ganadhishastyaktva brahmanarupakam | gajananasvarupena samyukto bhaktamuttamam || 23||
  devanagari: बल्लालकृतं श्रीगणेशस्तोत्रम् ॥ श्रीगणेशाय नमः ॥ बल्लाल उवाच । गणेशाय धाम्ने परेशाय तुभ्यं
    सदाऽऽनन्दरूपाय सर्वातिगाय । अपारस्वरूपाय देवाधिदेव नमस्ते प्रभो भक्तसंरक्षकाय ॥ १३॥ हेरम्बाय नमस्तुभ्यं
    विघ्नेशाय परात्मने । ब्रह्मेशाय महायोगदात्रे शान्तिमयाय ते ॥ १४॥ स्वानन्दवासिने तुभ्यं स्वानन्दे खेलकाय
    ते । योगेशाय महोदाररूपधारिन्नमो नमः ॥ १५॥ सदा सन्मयकायायाव्यक्तशीर्ष्णे नमो नमः । योगरूपेण सर्वत्र
    संस्थिताय नमो नमः ॥ १६॥ सिद्धिबुद्धिप्रदात्रे ते सिद्धिबुद्धिमयाय च । सिद्धिबुद्धिपते तुभ्यं नमस्ते
    गजवक्रिणे ॥ १७॥ लम्बोदराय देवाय चतुर्बाहुधराय ते । मूषकध्वजिने तुभ्यं पाशाङ्कुशप्रधारिणे ॥ १८॥ द्विजरूपधरायैव
    भक्तवत्सलभावतः । रक्षितुं भक्तवाक्यं तु समागताय ते नमः ॥ १९॥ त्वं माता त्वं पिता नाथस्त्वं सुहृत्
    कुलदैवतम् । द्रव्यं विद्यादिकं मे त्वं सर्वं ते वै नमो नमः ॥ २०॥ देहेन वाचा मनसा कृतान् मे सांसर्गिकान्
    जागृतिस्वप्नजातान् । संसुप्तितो यान् सकलापराधान् क्षमस्व हेरम्ब दयानिधे त्वम् ॥ २१॥ एवमुक्त्वा ननर्ताऽसौ
    बल्लालो भक्तियन्त्रितः । साश्रुनेत्रः सरोमाञ्चो ब्राह्मणाग्रे महामुने ॥ २२॥ तमुवाच गणाधीशस्त्यक्त्वा
    ब्राह्मणरूपकम् । गजाननस्वरूपेण संयुक्तो भक्तमुत्तमम् ॥ २३॥
