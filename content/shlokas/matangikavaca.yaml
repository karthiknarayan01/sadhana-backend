id: matangikavaca
category: kavacha
name:
  english: matangikavaca
  devanagari: मातन्गीकवच
content:
  english: candeshi karnau me patu matangi shankhau kundalashobhita || 4|| netre me patu raktakshi nasikam
    patu me shiva | gandau me patu deveshi oshthau bimbaphaladhara || 5|| jihvam me patu vagishi dantan
    kalyanakarini | patu me rajamatangi vadanam sarvasiddhida || 6|| kantham me patu hridyangi vinahasta
    karau mama | hridayam patu me lakshmirnabhim me vishavanayika || 7|| mama parshvadvayam patu sukshmamadhya
    maheshvari | shukashyama katim patu guhyam me lokamohini || 8|| uru me patu bhadrangi januni patu
    shankari | janghadvayam me lokeshi padau me parameshvari || 9|| pragadidikshu mam patu sarvaishvaryapradayini
    | romani patu me krishna bharyam me bhavavallabha || 10|| shankari sarvatah patu mama sarvavashankari
    | mahalakshmirmama dhanam vishvamata sutan mama || 11|| shrimatangishvari nityam mam patu jagadishvari
    | matangi kavacam nityam ya etatprapathennarah || 12|| sukhitvam sakalan lokan dasibhutankarotyasau
    | prapnoti mahatim kantim bhavetkama shataprabhah || 13|| labhate mahatim lakshmim trailokye capi
    durlabham | animadyashtasiddham yam sancaratyesha manavah || 14|| sarvavidyanidhirayam bhavedvagishvareshvarah
    | brahmarakshasavetalabhutapreta pishacakaih || 15|| jvalanvahniriva shasyairveshyate bhutapurvakaih
    | paramam yogamapnoti divyajnanam samashnute || 16|| putran pautranavapnoti shrirvidyakanti samyutan
    | tadbharya durbhaga capi kantya ratisamabhavet || 17|| sarvan kamanavapnoti mahabhogamshca durlabhan
    | mahabhogan sudurlabhan bhuktimante samapnoti sakshatparashivo bhavet || 18|| iti shri maha''gamarahasye
    dattatreya vamadeva samvade saptamaparicchede shrimatangi kavacam sampurnam |
  devanagari: चण्डेशी कर्णौ मे पातु मातङ्गी शङ्खौ कुण्डलशोभिता ॥ ४॥ नेत्रे मे पातु रक्ताक्षी नासिकां पातु
    मे शिवा । गण्डौ मे पातु देवेशी ओष्ठौ बिम्बफलाधरा ॥ ५॥ जिह्वां मे पातु वागीशी दन्तान् कल्याणकारिणी
    । पातु मे राजमातङ्गी वदनं सर्वसिद्धिदा ॥ ६॥ कण्ठं मे पातु हृद्याङ्गी वीणाहस्ता करौ मम । हृदयं पातु
    मे लक्ष्मीर्नाभिं मे विशवनायिका ॥ ७॥ मम पार्श्वद्वयं पातु सूक्ष्ममध्या महेश्वरी । शुकश्यामा कटिं पातु
    गुह्यं मे लोकमोहिनी ॥ ८॥ ऊरू मे पातु भद्राङ्गी जानुनी पातु शाङ्करी । जङ्घाद्वयं मे लोकेशी पादौ मे
    परमेश्वरी ॥ ९॥ प्रागादिदिक्षु मां पातु सर्वैश्वर्यप्रदायिनी । रोमाणि पातु मे कृष्णा भार्यां मे भववल्लभा
    ॥ १०॥ शङ्करी सर्वतः पातु मम सर्ववशङ्करी । महालक्ष्मीर्मम धनं विश्वमाता सुतान् मम ॥ ११॥ श्रीमातङ्गीश्वरी
    नित्यं मां पातु जगदीश्वरी । मातङ्गी कवचं नित्यं य एतत्प्रपठेन्नरः ॥ १२॥ सुखित्वं सकलान् लोकान् दासीभूतान्करोत्यसौ
    । प्राप्नोति महतीं कान्तिं भवेत्काम शतप्रभः ॥ १३॥ लभते महतीं लक्ष्मीं त्रैलोक्ये चापि दुर्लभाम् ।
    अणिमाद्यष्टसिद्धं यं सञ्चरत्येष मानवः ॥ १४॥ सर्वविद्यानिधिरयं भवेद्वागीश्वरेश्वरः । ब्रह्मराक्षसवेतालभूतप्रेत
    पिशाचकैः ॥ १५॥ ज्वलन्वह्निरिव शस्यैर्वेश्यते भूतपूर्वकैः । परमं योगमाप्नोति दिव्यज्ञानं समश्नुते ॥
    १६॥ पुत्रान् पौत्रानवाप्नोति श्रीर्विद्याकान्ति संयुतान् । तद्भार्या दुर्भगा चापि कान्त्या रतिसमाभवेत्
    ॥ १७॥ सर्वान् कामानवाप्नोति महाभोगांश्च दुर्लभान् । महाभोगान् सुदुर्लभान् भुक्तिमन्ते समाप्नोति साक्षात्परशिवो
    भवेत् ॥ १८॥ इति श्री महाऽऽगमरहस्ये दत्तात्रेय वामदेव संवादे सप्तमपरिच्छेदे श्रीमातङ्गी कवचं सम्पूर्णम्
    ।
