id: shiva-sahasra-nama-stotram
category: stotram
name:
  english: Shiva Sahasra Nama Stotram
content:
  english: purvapithika || vasudeva uvaca | tatah sa prayato bhutva mama tata yudhishthira | pranjalih
    praha viprarshirnamasangrahamaditah || || upamanyuruvaca | brahmaproktairrishiproktairvedavedangasambhavaih
    | sarvalokeshu vikhyatam stutyam stoshyami namabhih || || mahadbhirvihitaih satyaih siddhaih sarvarthasadhakaih
    | rishina tandina bhaktya kritairvedakritatmana || || yathoktaih sadhubhih khyatairmunibhistattvadarshibhih
    | pravaram prathamam svargyam sarvabhutahitam shubham || || shrutaih sarvatra jagati brahmalokavataritaih
    | satyaistatparamam brahma brahmaproktam sanatanam || || vakshye yadukulashreshtha shrinushvavahito
    mama | varayainam bhavam devam bhaktastvam parameshvaram || || tena te shravayishyami yattadbrahma
    sanatanam | na shakyam vistaratkritsnam vaktum sarvasya kenacit || || yuktenapi vibhutinamapi varshashatairapi
    | yasyadirmadhyamantam ca surairapi na gamyate || || kastasya shaknuyadvaktum gunan kartsnyena madhava
    | kim tu devasya mahatah sankshiptarthapadaksharam || || shaktitashcaritam vakshye prasadattasya dhimatah
    | aprapya tu tato'nujnam na shakyah stotumishvarah || || yada tenabhyanujnatah stuto vai sa tada maya
    | anadinidhanasyaham jagadyonermahatmanah || || namnam kincitsamuddesham vakshyamyavyaktayoninah |
    varadasya varenyasya vishvarupasya dhimatah || || shrinu namnam ca yam krishna yaduktam padmayonina
    | dashanamasahasrani yanyaha prapitamahah || || tani nirmathya manasa dadhno ghritamivoddhritam |
    gireh saram yatha hema pushpasaram yatha madhu || || ghritatsaram yatha mandastathaitatsaramuddhritam
    | sarvapapapahamidam caturvedasamanvitam || || prayatnenadhigantavyam dharyam ca prayatatmana | mangalyam
    paushtikam caiva rakshoghnam pavanam mahat || || idam bhaktaya datavyam shraddadhanastikaya ca | nashraddadhanarupaya
    nastikayajitatmane || || yashcabhyasuyate devam karanatmanamishvaram | sa krishna narakam yati saha
    purvaih sahatmajaih || || idam dhyanamidam yogamidam dhyeyamanuttamam | idam japyamidam jnanam rahasyamidamuttamam
    || || yam jnatva antakalepi gaccheta paramam gatim | pavitram mangalam medhyam kalyanamidamuttamam
    || || idam brahma pura kritva sarvalokapitamahah | sarva stavanam rajatve divyanam samakalpayat ||
    || tada prabhriti caivayamishvarasya mahatmanah | stavaraja iti khyato jagatyamarapujitah || || brahmalokadayam
    svarge stavarajo'vataritah | yatastandih pura prapa tena tandikrito'bhavat || || svargaccaivatra bhurlokam
    tandina hyavataritah | sarvamangalamangalyam sarvapapapranashanam || || nigadishye mahabaho stavanamuttamam
    stavam | brahmanamapi yadbrahma paranamapi yatparam || || tejasamapi yattejastapasamapi yattapah |
    shantanamapi yah shanto dyutinamapi ya dyutih || || dantanamapi yo danto dhimatamapi ya ca dhih |
    devanamapi yo deva rishinamapi yastvrishih || || yajnanamapi yo yajnah shivanamapi yah shivah | rudranamapi
    yo rudrah prabha prabhavatamapi || || yoginamapi yo yogi karananam ca karanam | yato lokah sambhavanti
    na bhavanti yatah punah || || sarvabhutatmabhutasya harasyamitatejasah | ashtottarasahasram tu namnam
    sharvasya me shrinu | yacchrutva manujavyaghra sarvankamanavapsyasi || || dhyanam | shantam padmasanastham
    shashidharamukutam pancavaktram trinetram shulam vajram ca khadgam parashumabhayadam dakshabhage vahantam
    | nagam pasham ca ghantam pralayahutavaham sankusham vamabhage nanalankarayuktam sphatikamaninibham
    parvatisham namami || stotram | om sthirah sthanuh prabhurbhimah pravaro varado varah | sarvatma sarvavikhyatah
    sarvah sarvakaro bhavah || || jati carmi shikhandi ca sarvangah sarvabhavanah | harashca harinakshashca
    sarvabhutaharah prabhuh || || pravrittishca nivrittishca niyatah shashvato dhruvah | shmashanavasi
    bhagavan khacaro gocaro'rdanah || || abhivadyo mahakarma tapasvi bhutabhavanah | unmattaveshapracchannah
    sarvalokaprajapatih || || maharupo mahakayo vrisharupo mahayashah | mahatma sarvabhutatma vishvarupo
    mahahanuh || || lokapalo'ntarhitatma prasado hayagardabhih | pavitram ca mahamshcaiva niyamo niyamashritah
    || || sarvakarma svayambhuta adiradikaro nidhih | sahasraksho vishalakshah somo nakshatrasadhakah
    || || candrah suryah shanih keturgraho grahapatirvarah | atriratrya namaskarta mrigabanarpano'naghah
    || mahatapa ghoratapa adino dinasadhakah | samvatsarakaro mantrah pramanam paramam tapah || || yogi
    yojyo mahabijo mahareta mahabalah | suvarnaretah sarvajnah subijo bijavahanah || || dashabahustvanimisho
    nilakantha umapatih | vishvarupah svayam shreshtho balaviro balo ganah || || ganakarta ganapatirdigvasah
    kama eva ca | mantravitparamo mantrah sarvabhavakaro harah || || kamandaludharo dhanvi banahastah
    kapalavan | ashani shataghni khadgi pattishi cayudhi mahan || || sruvahastah surupashca tejastejaskaro
    nidhih | ushnishi ca suvaktrashca udagro vinatastatha || || dirghashca harikeshashca sutirthah krishna
    eva ca | srigalarupah siddhartho mundah sarvashubhankarah || || ajashca bahurupashca gandhadhari kapardyapi
    | urdhvareta urdhvalinga urdhvashayi nabhahsthalah || || trijati ciravasashca rudrah senapatirvibhuh
    | ahashcaro naktancarastigmamanyuh suvarcasah || || gajaha daityaha kalo lokadhata gunakarah | simhashardularupashca
    ardracarmambaravritah || || kalayogi mahanadah sarvakamashcatushpathah | nishacarah pretacari bhutacari
    maheshvarah || || bahubhuto bahudharah svarbhanuramito gatih | nrityapriyo nityanarto nartakah sarvalalasah
    || || ghoro mahatapah pasho nityo giriruho nabhah | sahasrahasto vijayo vyavasayo hyatandritah ||
    || adharshano dharshanatma yajnaha kamanashakah | dakshayagapahari ca susaho madhyamastatha || ||
    tejopahari balaha mudito'rtho'jito'varah | gambhiraghosho gambhiro gambhirabalavahanah || || nyagrodharupo
    nyagrodho vrikshakarnasthitirvibhuh | sutikshnadashanashcaiva mahakayo mahananah || || vishvakseno
    hariryajnah samyugapidavahanah | tikshnatapashca haryashvah sahayah karmakalavit || || vishnuprasadito
    yajnah samudro badabamukhah | hutashanasahayashca prashantatma hutashanah || || ugrateja mahateja
    janyo vijayakalavit | jyotishamayanam siddhih sarvavigraha eva ca || || shikhi mundi jati jvali murtijo
    murdhago bali | venavi panavi tali khali kalakatankatah || || nakshatravigrahamatirgunabuddhirlayo'gamah
    | prajapatirvishvabahurvibhagah sarvago'mukhah || || vimocanah susarano hiranyakavacodbhavah | medhrajo
    balacari ca mahicari srutastatha || sarvaturyaninadi ca sarvatodyaparigrahah | vyalarupo guhavasi
    guho mali tarangavit || || tridashastrikaladhrikkarmasarvabandhavimocanah | bandhanastvasurendranam
    yudhishatruvinashanah || || sankhyaprasado durvasah sarvasadhunishevitah | praskandano vibhagajno
    atulyo yajnabhagavit || || sarvavasah sarvacari durvasa vasavo'marah | haimo hemakaro'yajnah sarvadhari
    dharottamah || lohitaksho mahakshashca vijayaksho visharadah | sangraho nigrahah karta sarpaciranivasanah
    || || mukhyo'mukhyashca dehashca kahalih sarvakamadah | sarvakalaprasadashca subalo balarupadhrit
    || || sarvakamavarashcaiva sarvadah sarvatomukhah | akashanirvirupashca nipati hyavashah khagah ||
    || raudrarupo'mshuradityo bahurashmih suvarcasi | vasuvego mahavego manovego nishacarah || || sarvavasi
    shriyavasi upadeshakaro'karah | muniratmaniralokah sambhagnashca sahasradah || || pakshi ca paksharupashca
    atidipto visham patih | unmado madanah kamo hyashvattho'rthakaro yashah || || vamadevashca vamashca
    pragdakshinashca vamanah | siddhayogi maharshishca siddharthah siddhasadhakah || || bhikshushca bhikshurupashca
    vipano mriduravyayah | mahaseno vishakhashca shashtibhago gavam patih || || vajrahastashca vishkambhi
    camustambhana eva ca | vrittavrittakarastalo madhurmadhukalocanah || || vacaspatyo vajasano nityamashramapujitah
    | brahmacari lokacari sarvacari vicaravit || || ishana ishvarah kalo nishacari pinakabhrit | nimittastho
    nimittam ca nandirnandikaro harih || || nandishvarashca nandi ca nandano nandivardhanah | bhagahari
    nihanta ca kalo brahma pitamahah || || caturmukho mahalingashcarulingastathaiva ca | lingadhyakshah
    suradhyaksho yogadhyaksho yugavahah || || bijadhyaksho bijakarta adhyatmanugato balah | itihasah sakalpashca
    gautamo'tha nishakarah || || dambho hyadambho vaidambho vashyo vashakarah kalih | lokakarta pashupatirmahakarta
    hyanaushadhah || || aksharam paramam brahma balavacchakra eva ca | nitirhyanitih shuddhatma shuddho
    manyo gatagatah || || bahuprasadah susvapno darpano'tha tvamitrajit | vedakaro mantrakaro vidvan samaramardanah
    || || mahameghanivasi ca mahaghoro vashikarah | agnijvalo mahajvalo atidhumro huto havih || || vrishanah
    shankaro nityavarcasvi dhumaketanah | nilastathangalubdhashca shobhano niravagrahah || || svastidah
    svastibhavashca bhagi bhagakaro laghuh | utsangashca mahangashca mahagarbhaparayanah || || krishnavarnah
    suvarnashca indriyam sarvadehinam | mahapado mahahasto mahakayo mahayashah || || mahamurdha mahamatro
    mahanetro nishalayah | mahantako mahakarno mahoshthashca mahahanuh || || mahanaso mahakamburmahagrivah
    shmashanabhak | mahavaksha mahorasko hyantaratma mrigalayah || || lambano lambitoshthashca mahamayah
    payonidhih | mahadanto mahadamshtro mahajihvo mahamukhah || || mahanakho maharoma mahakesho mahajatah
    | prasannashca prasadashca pratyayo girisadhanah || || snehano'snehanashcaiva ajitashca mahamunih
    | vrikshakaro vrikshaketuranalo vayuvahanah || || gandali merudhama ca devadhipatireva ca | atharvashirshah
    samasya riksahasramitekshanah || || yajuh padabhujo guhyah prakasho jangamastatha | amogharthah prasadashca
    abhigamyah sudarshanah || || upakarah priyah sarvah kanakah kancanacchavih | nabhirnandikaro bhavah
    pushkarasthapatih sthirah || || dvadashastrasanashcadyo yajno yajnasamahitah | naktam kalishca kalashca
    makarah kalapujitah || || sagano ganakarashca bhutavahanasarathih | bhasmashayo bhasmagopta bhasmabhutastarurganah
    || || lokapalastatha'loko mahatma sarvapujitah | shuklastrishuklah sampannah shucirbhutanishevitah
    || || ashramasthah kriyavastho vishvakarmamatirvarah | vishalashakhastamroshtho hyambujalah sunishcalah
    || || kapilah kapishah shukla ayushcaiva paro h | gandharvo hyaditistarkshyah suvijneyah susharadah
    || || parashvadhayudho devo hyanukari subandhavah | tumbavino mahakrodha urdhvareta jaleshayah ||
    || ugro vamshakaro vamsho vamshanado hyaninditah | sarvangarupo mayavi suhrido hyanilo'nalah || ||
    bandhano bandhakarta ca subandhanavimocanah | sa yajnarih sa kamarirmahadamshtro mahayudhah || ||
    bahudha ninditah sharvah shankarah shankaro'dhanah | amaresho mahadevo vishvadevah surariha || ||
    ahirbudhnyo'nilabhashca cekitano havistatha | ajaikapacca kapali trishankurajitah shivah || || dhanvantarirdhumaketuh
    skando vaishravanastatha | dhata shakrashca vishnushca mitrastvashta dhruvo dharah || || prabhavah
    sarvago vayuraryama savita ravih | ushangushca vidhata ca mandhata bhutabhavanah || || vibhurvarnavibhavi
    ca sarvakamagunavahah | padmanabho mahagarbhashcandravaktro'nilo'nalah || || balavamshcopashantashca
    puranah punyacancuri | kurukarta kuruvasi kurubhuto gunaushadhah || || sarvashayo darbhacari sarvesham
    praninam patih | devadevah sukhasaktah sadasatsarvaratnavit || || kailasagirivasi ca himavadgirisamshrayah
    | kulahari kulakarta bahuvidyo bahupradah || || vanijo vardhaki vriksho vakulashcandanashchadah |
    saragrivo mahajatruralolashca mahaushadhah || || siddharthakari siddharthashchandovyakaranottarah
    | simhanadah simhadamshtrah simhagah simhavahanah || || prabhavatma jagatkalasthalo lokahitastaruh
    | sarango navacakrangah ketumali sabhavanah || || bhutalayo bhutapatirahoratramaninditah || || vahita
    sarvabhutanam nilayashca vibhurbhavah | amoghah samyato hyashvo bhojanah pranadharanah || || dhritiman
    matiman dakshah satkritashca yugadhipah | gopalirgopatirgramo gocarmavasano harih || || hiranyabahushca
    tatha guhapalah praveshinam | prakrishtarirmahaharsho jitakamo jitendriyah || || gandharashca suvasashca
    tapahsakto ratirnarah | mahagito mahanrityo hyapsaroganasevitah || || mahaketurmahadhaturnaikasanucarashcalah
    | avedaniya adeshah sarvagandhasukhavahah || || toranastarano vatah paridhi patikhecarah | samyogo
    vardhano vriddho ativriddho gunadhikah || || nitya atmasahayashca devasurapatih patih | yuktashca
    yuktabahushca devo divisuparvanah || || ashadhashca sushadhashca dhruvo'tha harino harah | vapuravartamanebhyo
    vasushreshtho mahapathah || || shirohari vimarshashca sarvalakshanalakshitah | akshashca rathayogi
    ca sarvayogi mahabalah || || samamnayo'samamnayastirthadevo maharathah | nirjivo jivano mantrah shubhaksho
    bahukarkashah || || ratnaprabhuto raktango maharnavanipanavit | mulam vishalo hyamrito vyaktavyaktastaponidhih
    || || arohano'dhirohashca shiladhari mahayashah | senakalpo mahakalpo yogo yugakaro harih || yugarupo
    maharupo mahanagahano vadhah | nyayanirvapanah padah pandito hyacalopamah || || bahumalo mahamalah
    shashi harasulocanah | vistaro lavanah kupastriyugah saphalodayah || || trilocano vishannango manividdho
    jatadharah | bindurvisargah sumukhah sharah sarvayudhah sahah || || nivedanah sukhajatah sugandharo
    mahadhanuh | gandhapali ca bhagavanutthanah sarvakarmanam || || manthano bahulo vayuh sakalah sarvalocanah
    | talastalah karasthali urdhvasamhanano mahan || || chatram succhatro vikhyato lokah sarvashrayah
    kramah | mundo virupo vikrito dandi kundi vikurvanah || || haryakshah kakubho vajri shatajihvah sahasrapat
    | sahasramurdha devendrah sarvadevamayo guruh || || sahasrabahuh sarvangah sharanyah sarvalokakrit
    | pavitram trikakunmantrah kanishthah krishnapingalah || || brahmadandavinirmata shataghnipashashaktiman
    | padmagarbho mahagarbho brahmagarbho jalodbhavah || || gabhastirbrahmakridbrahmi brahmavidbrahmano
    gatih | anantarupo naikatma tigmatejah svayambhuvah || || urdhvagatma pashupatirvataramha manojavah
    | candani padmanalagrah surabhyuttarano narah || || karnikaramahasragvi nilamaulih pinakadhrit | umapatirumakanto
    jahnavidhridumadhavah || || varo varaho varado varenyah sumahasvanah | mahaprasado damanah shatruha
    shvetapingalah || || pitatma paramatma ca prayatatma pradhanadhrit | sarvaparshvamukhastryaksho dharmasadharano
    varah || || caracaratma sukshmatma amrito govrisheshvarah | sadhyarshirvasuradityo vivasvansavitamritah
    || || vyasah sargah susankshepo vistarah paryayo narah | rituh samvatsaro masah pakshah sankhyasamapanah
    || || kala kashtha lava matra muhurtahah kshapah kshanah | vishvakshetram prajabijam lingamadyastu
    nirgamah || || sadasadvyaktamavyaktam pita mata pitamahah | svargadvaram prajadvaram mokshadvaram
    trivishtapam || || nirvanam hladanashcaiva brahmalokah para gatih | devasuravinirmata devasuraparayanah
    || || devasuragururdevo devasuranamaskritah | devasuramahamatro devasuraganashrayah || || devasuraganadhyaksho
    devasuraganagranih | devatidevo devarshirdevasuravarapradah || devasureshvaro vishvo devasuramaheshvarah
    | sarvadevamayo'cintyo devatatma''tmasambhavah || || udbhittrivikramo vaidyo virajo nirajo'marah |
    idyo hastishvaro vyaghro devasimho nararshabhah || || vibudho'gravarah sukshmah sarvadevastapomayah
    | suyuktah shobhano vajri prasanam prabhavo'vyayah || || guhah kanto nijah sargah pavitram sarvapavanah
    | shringi shringapriyo babhru rajarajo niramayah || || abhiramah suragano viramah sarvasadhanah |
    lalataksho vishvadevo harino brahmavarcasah || || sthavaranam patishcaiva niyamendriyavardhanah |
    siddharthah siddhabhutartho'cintyah satyavratah shucih || || vratadhipah param brahma bhaktanam parama
    gatih | vimukto muktatejashca shriman shrivardhano jagat || yatha pradhanam bhagavaniti bhaktya stuto
    maya | yam na brahmadayo deva vidustattvena narshayah || || stotavyamarcyam vandyam ca kah stoshyati
    jagatpatim | bhaktya tvevam puraskritya maya yajnapatirvibhuh || || tato'bhyanujnam samprapya stuto
    matimatam varah | shivamebhih stuvan devam namabhih pushtivardhanaih || || nityayuktah shucirbhaktah
    prapnotyatmanamatmana | etaddhi paramam brahma param brahmadhigacchati || || rishayashcaiva devashca
    stuvantyetena tatparam | stuyamano mahadevastushyate niyatatmabhih || || bhaktanukampi bhagavanatmasamsthakaro
    vibhuh | tathaiva ca manushyeshu ye manushyah pradhanatah || || astikah shraddadhanashca bahubhirjanmabhih
    stavaih | bhaktya hyananyamishanam param devam sanatanam || || karmana manasa vaca bhavenamitatejasah
    | shayana jagramanashca vrajannupavishamstatha || || unmishannimishamshcaiva cintayantah punah punah
    | shrinvantah shravayantashca kathayantashca te bhavam || || stuvantah stuyamanashca tushyanti ca
    ramanti ca | janmakotisahasreshu nanasamsarayonishu || || jantorvigatapapasya bhave bhaktih prajayate
    | utpanna ca bhave bhaktirananya sarvabhavatah || || bhavinah karane casya sarvayuktasya sarvatha
    | etaddeveshu dushprapam manushyeshu na labhyate || || nirvighna nishcala rudre bhaktiravyabhicarini
    | tasyaiva ca prasadena bhaktirutpadyate nrinam || || yena yanti param siddhim tadbhavagatacetasah
    | ye sarvabhavanugatah prapadyante maheshvaram || || prapannavatsalo devah samsarattansamuddharet
    | evamanye vikurvanti devah samsaramocanam || || manushyanamrite devam nanya shaktistapobalam | iti
    tenendrakalpena bhagavan sadasatpatih || || krittivasah stutah krishna tandina shubhabuddhina | stavametam
    bhagavato brahma svayamadharayat || || giyate ca sa buddhyeta brahma shankarasannidhau | idam punyam
    pavitram ca sarvada papanashanam || || yogadam mokshadam caiva svargadam toshadam tatha | evametatpathante
    ya ekabhaktya tu shankaram || || ya gatih sankhyayoganam vrajantyetam gatim tada | stavametam prayatnena
    sada rudrasya sannidhau || || abdamekam caredbhaktah prapnuyadipsitam phalam | etadrahasyam paramam
    brahmano hridi samsthitam || || brahma provaca shakraya shakrah provaca mrityave | mrityuh provaca
    rudrebhyo rudrebhyastandimagamat || || mahata tapasa praptastandina brahmasadmani | tandih provaca
    shukraya gautamaya ca bhargavah || || vaivasvataya manave gautamah praha madhava | narayanaya sadhyaya
    samadhishthaya dhimate || || yamaya praha bhagavan sadhyo narayano'cyutah | naciketaya bhagavanaha
    vaivasvato yamah || || markandeyaya varshneya naciketo'bhyabhashata | markandeyanmaya prapto niyamena
    janardana || || tavapyahamamitraghna stavam dadyam hyavishrutam | svargyamarogyamayushyam dhanyam
    vedena sammitam || || nasya vighnam vikurvanti danava yaksharakshasah | pishaca yatudhana va guhyaka
    bhujaga api || || yah patheta shucih partha brahmacari jitendriyah | abhagnayogo varsham tu so'shvamedhaphalam
    labhet || || iti shrimahabharate anushasanaparvani mahadevasahasranama stotram nama saptadasho'dhyayah
    ||
  devanagari: पूर्वपीठिका ॥ वासुदेव उवाच । ततः स प्रयतो भूत्वा मम तात युधिष्ठिर । प्राञ्जलिः प्राह विप्रर्षिर्नामसङ्ग्रहमादितः
    ॥ ॥ उपमन्युरुवाच । ब्रह्मप्रोक्तैरृषिप्रोक्तैर्वेदवेदाङ्गसम्भवैः । सर्वलोकेषु विख्यातं स्तुत्यं स्तोष्यामि
    नामभिः ॥ ॥ महद्भिर्विहितैः सत्यैः सिद्धैः सर्वार्थसाधकैः । ऋषिणा तण्डिना भक्त्या कृतैर्वेदकृतात्मना
    ॥ ॥ यथोक्तैः साधुभिः ख्यातैर्मुनिभिस्तत्त्वदर्शिभिः । प्रवरं प्रथमं स्वर्ग्यं सर्वभूतहितं शुभम् ॥
    ॥ श्रुतैः सर्वत्र जगति ब्रह्मलोकावतारितैः । सत्यैस्तत्परमं ब्रह्म ब्रह्मप्रोक्तं सनातनम् ॥ ॥ वक्ष्ये
    यदुकुलश्रेष्ठ शृणुष्वावहितो मम । वरयैनं भवं देवं भक्तस्त्वं परमेश्वरम् ॥ ॥ तेन ते श्रावयिष्यामि यत्तद्ब्रह्म
    सनातनम् । न शक्यं विस्तरात्कृत्स्नं वक्तुं सर्वस्य केनचित् ॥ ॥ युक्तेनापि विभूतीनामपि वर्षशतैरपि ।
    यस्यादिर्मध्यमन्तं च सुरैरपि न गम्यते ॥ ॥ कस्तस्य शक्नुयाद्वक्तुं गुणान् कार्त्स्न्येन माधव । किं
    तु देवस्य महतः सङ्क्षिप्तार्थपदाक्षरम् ॥ ॥ शक्तितश्चरितं वक्ष्ये प्रसादात्तस्य धीमतः । अप्राप्य तु
    ततोऽनुज्ञां न शक्यः स्तोतुमीश्वरः ॥ ॥ यदा तेनाभ्यनुज्ञातः स्तुतो वै स तदा मया । अनादिनिधनस्याहं जगद्योनेर्महात्मनः
    ॥ ॥ नाम्नां किञ्चित्समुद्देशं वक्ष्याम्यव्यक्तयोनिनः । वरदस्य वरेण्यस्य विश्वरूपस्य धीमतः ॥ ॥ शृणु
    नाम्नां च यं कृष्ण यदुक्तं पद्मयोनिना । दशनामसहस्राणि यान्याह प्रपितामहः ॥ ॥ तानि निर्मथ्य मनसा दध्नो
    घृतमिवोद्धृतम् । गिरेः सारं यथा हेम पुष्पसारं यथा मधु ॥ ॥ घृतात्सारं यथा मण्डस्तथैतत्सारमुद्धृतम्
    । सर्वपापापहमिदं चतुर्वेदसमन्वितम् ॥ ॥ प्रयत्नेनाधिगन्तव्यं धार्यं च प्रयतात्मना । माङ्गल्यं पौष्टिकं
    चैव रक्षोघ्नं पावनं महत् ॥ ॥ इदं भक्ताय दातव्यं श्रद्दधानास्तिकाय च । नाश्रद्दधानरूपाय नास्तिकायाजितात्मने
    ॥ ॥ यश्चाभ्यसूयते देवं कारणात्मानमीश्वरम् । स कृष्ण नरकं याति सह पूर्वैः सहात्मजैः ॥ ॥ इदं ध्यानमिदं
    योगमिदं ध्येयमनुत्तमम् । इदं जप्यमिदं ज्ञानं रहस्यमिदमुत्तमम् ॥ ॥ यं ज्ञात्वा अन्तकालेपि गच्छेत परमां
    गतिम् । पवित्रं मङ्गलं मेध्यं कल्याणमिदमुत्तमम् ॥ ॥ इदं ब्रह्मा पुरा कृत्वा सर्वलोकपितामहः । सर्व
    स्तवानां राजत्वे दिव्यानां समकल्पयत् ॥ ॥ तदा प्रभृति चैवायमीश्वरस्य महात्मनः । स्तवराज इति ख्यातो
    जगत्यमरपूजितः ॥ ॥ ब्रह्मलोकादयं स्वर्गे स्तवराजोऽवतारितः । यतस्तण्डिः पुरा प्राप तेन तण्डिकृतोऽभवत्
    ॥ ॥ स्वर्गाच्चैवात्र भूर्लोकं तण्डिना ह्यवतारितः । सर्वमङ्गलमाङ्गल्यं सर्वपापप्रणाशनम् ॥ ॥ निगदिष्ये
    महाबाहो स्तवानामुत्तमं स्तवम् । ब्रह्मणामपि यद्ब्रह्म पराणामपि यत्परम् ॥ ॥ तेजसामपि यत्तेजस्तपसामपि
    यत्तपः । शान्तानामपि यः शान्तो द्युतीनामपि या द्युतिः ॥ ॥ दान्तानामपि यो दान्तो धीमतामपि या च धीः
    । देवानामपि यो देव ऋषीणामपि यस्त्वृषिः ॥ ॥ यज्ञानामपि यो यज्ञः शिवानामपि यः शिवः । रुद्राणामपि यो
    रुद्रः प्रभा प्रभवतामपि ॥ ॥ योगिनामपि यो योगी कारणानां च कारणम् । यतो लोकाः सम्भवन्ति न भवन्ति यतः
    पुनः ॥ ॥ सर्वभूतात्मभूतस्य हरस्यामिततेजसः । अष्टोत्तरसहस्रं तु नाम्नां शर्वस्य मे शृणु । यच्छ्रुत्वा
    मनुजव्याघ्र सर्वान्कामानवाप्स्यसि ॥ ॥ ध्यानम् । शान्तं पद्मासनस्थं शशिधरमुकुटं पञ्चवक्त्रं त्रिनेत्रं
    शूलं वज्रं च खड्गं परशुमभयदं दक्षभागे वहन्तम् । नागं पाशं च घण्टां प्रलयहुतवहं साङ्कुशं वामभागे नानालङ्कारयुक्तं
    स्फटिकमणिनिभं पार्वतीशं नमामि ॥ स्तोत्रम् । ॐ स्थिरः स्थाणुः प्रभुर्भीमः प्रवरो वरदो वरः । सर्वात्मा
    सर्वविख्यातः सर्वः सर्वकरो भवः ॥ ॥ जटी चर्मी शिखण्डी च सर्वाङ्गः सर्वभावनः । हरश्च हरिणाक्षश्च सर्वभूतहरः
    प्रभुः ॥ ॥ प्रवृत्तिश्च निवृत्तिश्च नियतः शाश्वतो ध्रुवः । श्मशानवासी भगवान् खचरो गोचरोऽर्दनः ॥ ॥
    अभिवाद्यो महाकर्मा तपस्वी भूतभावनः । उन्मत्तवेषप्रच्छन्नः सर्वलोकप्रजापतिः ॥ ॥ महारूपो महाकायो वृषरूपो
    महायशाः । महात्मा सर्वभूतात्मा विश्वरूपो महाहनुः ॥ ॥ लोकपालोऽन्तर्हितात्मा प्रसादो हयगर्दभिः । पवित्रं
    च महांश्चैव नियमो नियमाश्रितः ॥ ॥ सर्वकर्मा स्वयम्भूत आदिरादिकरो निधिः । सहस्राक्षो विशालाक्षः सोमो
    नक्षत्रसाधकः ॥ ॥ चन्द्रः सूर्यः शनिः केतुर्ग्रहो ग्रहपतिर्वरः । अत्रिरत्र्या नमस्कर्ता मृगबाणार्पणोऽनघः
    ॥ महातपा घोरतपा अदीनो दीनसाधकः । संवत्सरकरो मन्त्रः प्रमाणं परमं तपः ॥ ॥ योगी योज्यो महाबीजो महारेता
    महाबलः । सुवर्णरेताः सर्वज्ञः सुबीजो बीजवाहनः ॥ ॥ दशबाहुस्त्वनिमिषो नीलकण्ठ उमापतिः । विश्वरूपः स्वयं
    श्रेष्ठो बलवीरो बलो गणः ॥ ॥ गणकर्ता गणपतिर्दिग्वासाः काम एव च । मन्त्रवित्परमो मन्त्रः सर्वभावकरो
    हरः ॥ ॥ कमण्डलुधरो धन्वी बाणहस्तः कपालवान् । अशनी शतघ्नी खड्गी पट्टिशी चायुधी महान् ॥ ॥ स्रुवहस्तः
    सुरूपश्च तेजस्तेजस्करो निधिः । उष्णीषी च सुवक्त्रश्च उदग्रो विनतस्तथा ॥ ॥ दीर्घश्च हरिकेशश्च सुतीर्थः
    कृष्ण एव च । सृगालरूपः सिद्धार्थो मुण्डः सर्वशुभङ्करः ॥ ॥ अजश्च बहुरूपश्च गन्धधारी कपर्द्यपि । ऊर्ध्वरेता
    ऊर्ध्वलिङ्ग ऊर्ध्वशायी नभःस्थलः ॥ ॥ त्रिजटी चीरवासाश्च रुद्रः सेनापतिर्विभुः । अहश्चरो नक्तञ्चरस्तिग्ममन्युः
    सुवर्चसः ॥ ॥ गजहा दैत्यहा कालो लोकधाता गुणाकरः । सिंहशार्दूलरूपश्च आर्द्रचर्माम्बरावृतः ॥ ॥ कालयोगी
    महानादः सर्वकामश्चतुष्पथः । निशाचरः प्रेतचारी भूतचारी महेश्वरः ॥ ॥ बहुभूतो बहुधरः स्वर्भानुरमितो गतिः
    । नृत्यप्रियो नित्यनर्तो नर्तकः सर्वलालसः ॥ ॥ घोरो महातपाः पाशो नित्यो गिरिरुहो नभः । सहस्रहस्तो विजयो
    व्यवसायो ह्यतन्द्रितः ॥ ॥ अधर्षणो धर्षणात्मा यज्ञहा कामनाशकः । दक्षयागापहारी च सुसहो मध्यमस्तथा ॥
    ॥ तेजोपहारी बलहा मुदितोऽर्थोऽजितोऽवरः । गम्भीरघोषो गम्भीरो गम्भीरबलवाहनः ॥ ॥ न्यग्रोधरूपो न्यग्रोधो
    वृक्षकर्णस्थितिर्विभुः । सुतीक्ष्णदशनश्चैव महाकायो महाननः ॥ ॥ विष्वक्सेनो हरिर्यज्ञः संयुगापीडवाहनः
    । तीक्ष्णतापश्च हर्यश्वः सहायः कर्मकालवित् ॥ ॥ विष्णुप्रसादितो यज्ञः समुद्रो बडबामुखः । हुताशनसहायश्च
    प्रशान्तात्मा हुताशनः ॥ ॥ उग्रतेजा महातेजा जन्यो विजयकालवित् । ज्योतिषामयनं सिद्धिः सर्वविग्रह एव
    च ॥ ॥ शिखी मुण्डी जटी ज्वाली मूर्तिजो मूर्धगो बली । वेणवी पणवी ताली खली कालकटङ्कटः ॥ ॥ नक्षत्रविग्रहमतिर्गुणबुद्धिर्लयोऽगमः
    । प्रजापतिर्विश्वबाहुर्विभागः सर्वगोऽमुखः ॥ ॥ विमोचनः सुसरणो हिरण्यकवचोद्भवः । मेढ्रजो बलचारी च महीचारी
    स्रुतस्तथा ॥ सर्वतूर्यनिनादी च सर्वातोद्यपरिग्रहः । व्यालरूपो गुहावासी गुहो माली तरङ्गवित् ॥ ॥ त्रिदशस्त्रिकालधृक्कर्मसर्वबन्धविमोचनः
    । बन्धनस्त्वसुरेन्द्राणां युधिशत्रुविनाशनः ॥ ॥ साङ्ख्यप्रसादो दुर्वासाः सर्वसाधुनिषेवितः । प्रस्कन्दनो
    विभागज्ञो अतुल्यो यज्ञभागवित् ॥ ॥ सर्ववासः सर्वचारी दुर्वासा वासवोऽमरः । हैमो हेमकरोऽयज्ञः सर्वधारी
    धरोत्तमः ॥ लोहिताक्षो महाक्षश्च विजयाक्षो विशारदः । सङ्ग्रहो निग्रहः कर्ता सर्पचीरनिवासनः ॥ ॥ मुख्योऽमुख्यश्च
    देहश्च काहलिः सर्वकामदः । सर्वकालप्रसादश्च सुबलो बलरूपधृत् ॥ ॥ सर्वकामवरश्चैव सर्वदः सर्वतोमुखः ।
    आकाशनिर्विरूपश्च निपाती ह्यवशः खगः ॥ ॥ रौद्ररूपोऽंशुरादित्यो बहुरश्मिः सुवर्चसी । वसुवेगो महावेगो
    मनोवेगो निशाचरः ॥ ॥ सर्ववासी श्रियावासी उपदेशकरोऽकरः । मुनिरात्मनिरालोकः सम्भग्नश्च सहस्रदः ॥ ॥ पक्षी
    च पक्षरूपश्च अतिदीप्तो विशां पतिः । उन्मादो मदनः कामो ह्यश्वत्थोऽर्थकरो यशः ॥ ॥ वामदेवश्च वामश्च प्राग्दक्षिणश्च
    वामनः । सिद्धयोगी महर्षिश्च सिद्धार्थः सिद्धसाधकः ॥ ॥ भिक्षुश्च भिक्षुरूपश्च विपणो मृदुरव्ययः । महासेनो
    विशाखश्च षष्टिभागो गवां पतिः ॥ ॥ वज्रहस्तश्च विष्कम्भी चमूस्तम्भन एव च । वृत्तावृत्तकरस्तालो मधुर्मधुकलोचनः
    ॥ ॥ वाचस्पत्यो वाजसनो नित्यमाश्रमपूजितः । ब्रह्मचारी लोकचारी सर्वचारी विचारवित् ॥ ॥ ईशान ईश्वरः कालो
    निशाचारी पिनाकभृत् । निमित्तस्थो निमित्तं च नन्दिर्नन्दिकरो हरिः ॥ ॥ नन्दीश्वरश्च नन्दी च नन्दनो नन्दिवर्धनः
    । भगहारी निहन्ता च कालो ब्रह्मा पितामहः ॥ ॥ चतुर्मुखो महालिङ्गश्चारुलिङ्गस्तथैव च । लिङ्गाध्यक्षः
    सुराध्यक्षो योगाध्यक्षो युगावहः ॥ ॥ बीजाध्यक्षो बीजकर्ता अध्यात्मानुगतो बलः । इतिहासः सकल्पश्च गौतमोऽथ
    निशाकरः ॥ ॥ दम्भो ह्यदम्भो वैदम्भो वश्यो वशकरः कलिः । लोककर्ता पशुपतिर्महाकर्ता ह्यनौषधः ॥ ॥ अक्षरं
    परमं ब्रह्म बलवच्छक्र एव च । नीतिर्ह्यनीतिः शुद्धात्मा शुद्धो मान्यो गतागतः ॥ ॥ बहुप्रसादः सुस्वप्नो
    दर्पणोऽथ त्वमित्रजित् । वेदकारो मन्त्रकारो विद्वान् समरमर्दनः ॥ ॥ महामेघनिवासी च महाघोरो वशीकरः ।
    अग्निज्वालो महाज्वालो अतिधूम्रो हुतो हविः ॥ ॥ वृषणः शङ्करो नित्यवर्चस्वी धूमकेतनः । नीलस्तथाङ्गलुब्धश्च
    शोभनो निरवग्रहः ॥ ॥ स्वस्तिदः स्वस्तिभावश्च भागी भागकरो लघुः । उत्सङ्गश्च महाङ्गश्च महागर्भपरायणः
    ॥ ॥ कृष्णवर्णः सुवर्णश्च इन्द्रियं सर्वदेहिनाम् । महापादो महाहस्तो महाकायो महायशाः ॥ ॥ महामूर्धा महामात्रो
    महानेत्रो निशालयः । महान्तको महाकर्णो महोष्ठश्च महाहनुः ॥ ॥ महानासो महाकम्बुर्महाग्रीवः श्मशानभाक्
    । महावक्षा महोरस्को ह्यन्तरात्मा मृगालयः ॥ ॥ लम्बनो लम्बितोष्ठश्च महामायः पयोनिधिः । महादन्तो महादंष्ट्रो
    महाजिह्वो महामुखः ॥ ॥ महानखो महारोमा महाकेशो महाजटः । प्रसन्नश्च प्रसादश्च प्रत्ययो गिरिसाधनः ॥ ॥
    स्नेहनोऽस्नेहनश्चैव अजितश्च महामुनिः । वृक्षाकारो वृक्षकेतुरनलो वायुवाहनः ॥ ॥ गण्डली मेरुधामा च देवाधिपतिरेव
    च । अथर्वशीर्षः सामास्य ऋक्सहस्रामितेक्षणः ॥ ॥ यजुः पादभुजो गुह्यः प्रकाशो जङ्गमस्तथा । अमोघार्थः
    प्रसादश्च अभिगम्यः सुदर्शनः ॥ ॥ उपकारः प्रियः सर्वः कनकः काञ्चनच्छविः । नाभिर्नन्दिकरो भावः पुष्करस्थपतिः
    स्थिरः ॥ ॥ द्वादशस्त्रासनश्चाद्यो यज्ञो यज्ञसमाहितः । नक्तं कलिश्च कालश्च मकरः कालपूजितः ॥ ॥ सगणो
    गणकारश्च भूतवाहनसारथिः । भस्मशयो भस्मगोप्ता भस्मभूतस्तरुर्गणः ॥ ॥ लोकपालस्तथाऽलोको महात्मा सर्वपूजितः
    । शुक्लस्त्रिशुक्लः सम्पन्नः शुचिर्भूतनिषेवितः ॥ ॥ आश्रमस्थः क्रियावस्थो विश्वकर्ममतिर्वरः । विशालशाखस्ताम्रोष्ठो
    ह्यम्बुजालः सुनिश्चलः ॥ ॥ कपिलः कपिशः शुक्ल आयुश्चैव परो ः । गन्धर्वो ह्यदितिस्तार्क्ष्यः सुविज्ञेयः
    सुशारदः ॥ ॥ परश्वधायुधो देवो ह्यनुकारी सुबान्धवः । तुम्बवीणो महाक्रोध ऊर्ध्वरेता जलेशयः ॥ ॥ उग्रो
    वंशकरो वंशो वंशनादो ह्यनिन्दितः । सर्वाङ्गरूपो मायावी सुहृदो ह्यनिलोऽनलः ॥ ॥ बन्धनो बन्धकर्ता च सुबन्धनविमोचनः
    । स यज्ञारिः स कामारिर्महादंष्ट्रो महायुधः ॥ ॥ बहुधा निन्दितः शर्वः शङ्करः शङ्करोऽधनः । अमरेशो महादेवो
    विश्वदेवः सुरारिहा ॥ ॥ अहिर्बुध्न्योऽनिलाभश्च चेकितानो हविस्तथा । अजैकपाच्च कापाली त्रिशङ्कुरजितः
    शिवः ॥ ॥ धन्वन्तरिर्धूमकेतुः स्कन्दो वैश्रवणस्तथा । धाता शक्रश्च विष्णुश्च मित्रस्त्वष्टा ध्रुवो धरः
    ॥ ॥ प्रभावः सर्वगो वायुरर्यमा सविता रविः । उषङ्गुश्च विधाता च मान्धाता भूतभावनः ॥ ॥ विभुर्वर्णविभावी
    च सर्वकामगुणावहः । पद्मनाभो महागर्भश्चन्द्रवक्त्रोऽनिलोऽनलः ॥ ॥ बलवांश्चोपशान्तश्च पुराणः पुण्यचञ्चुरी
    । कुरुकर्ता कुरुवासी कुरुभूतो गुणौषधः ॥ ॥ सर्वाशयो दर्भचारी सर्वेषां प्राणिनां पतिः । देवदेवः सुखासक्तः
    सदसत्सर्वरत्नवित् ॥ ॥ कैलासगिरिवासी च हिमवद्गिरिसंश्रयः । कूलहारी कूलकर्ता बहुविद्यो बहुप्रदः ॥ ॥
    वणिजो वर्धकी वृक्षो वकुलश्चन्दनश्छदः । सारग्रीवो महाजत्रुरलोलश्च महौषधः ॥ ॥ सिद्धार्थकारी सिद्धार्थश्छन्दोव्याकरणोत्तरः
    । सिंहनादः सिंहदंष्ट्रः सिंहगः सिंहवाहनः ॥ ॥ प्रभावात्मा जगत्कालस्थालो लोकहितस्तरुः । सारङ्गो नवचक्राङ्गः
    केतुमाली सभावनः ॥ ॥ भूतालयो भूतपतिरहोरात्रमनिन्दितः ॥ ॥ वाहिता सर्वभूतानां निलयश्च विभुर्भवः । अमोघः
    संयतो ह्यश्वो भोजनः प्राणधारणः ॥ ॥ धृतिमान् मतिमान् दक्षः सत्कृतश्च युगाधिपः । गोपालिर्गोपतिर्ग्रामो
    गोचर्मवसनो हरिः ॥ ॥ हिरण्यबाहुश्च तथा गुहापालः प्रवेशिनाम् । प्रकृष्टारिर्महाहर्षो जितकामो जितेन्द्रियः
    ॥ ॥ गान्धारश्च सुवासश्च तपःसक्तो रतिर्नरः । महागीतो महानृत्यो ह्यप्सरोगणसेवितः ॥ ॥ महाकेतुर्महाधातुर्नैकसानुचरश्चलः
    । आवेदनीय आदेशः सर्वगन्धसुखावहः ॥ ॥ तोरणस्तारणो वातः परिधी पतिखेचरः । संयोगो वर्धनो वृद्धो अतिवृद्धो
    गुणाधिकः ॥ ॥ नित्य आत्मसहायश्च देवासुरपतिः पतिः । युक्तश्च युक्तबाहुश्च देवो दिविसुपर्वणः ॥ ॥ आषाढश्च
    सुषाढश्च ध्रुवोऽथ हरिणो हरः । वपुरावर्तमानेभ्यो वसुश्रेष्ठो महापथः ॥ ॥ शिरोहारी विमर्शश्च सर्वलक्षणलक्षितः
    । अक्षश्च रथयोगी च सर्वयोगी महाबलः ॥ ॥ समाम्नायोऽसमाम्नायस्तीर्थदेवो महारथः । निर्जीवो जीवनो मन्त्रः
    शुभाक्षो बहुकर्कशः ॥ ॥ रत्नप्रभूतो रक्ताङ्गो महार्णवनिपानवित् । मूलं विशालो ह्यमृतो व्यक्ताव्यक्तस्तपोनिधिः
    ॥ ॥ आरोहणोऽधिरोहश्च शीलधारी महायशाः । सेनाकल्पो महाकल्पो योगो युगकरो हरिः ॥ युगरूपो महारूपो महानागहनो
    वधः । न्यायनिर्वपणः पादः पण्डितो ह्यचलोपमः ॥ ॥ बहुमालो महामालः शशी हरसुलोचनः । विस्तारो लवणः कूपस्त्रियुगः
    सफलोदयः ॥ ॥ त्रिलोचनो विषण्णाङ्गो मणिविद्धो जटाधरः । बिन्दुर्विसर्गः सुमुखः शरः सर्वायुधः सहः ॥ ॥
    निवेदनः सुखाजातः सुगन्धारो महाधनुः । गन्धपाली च भगवानुत्थानः सर्वकर्मणाम् ॥ ॥ मन्थानो बहुलो वायुः
    सकलः सर्वलोचनः । तलस्तालः करस्थाली ऊर्ध्वसंहननो महान् ॥ ॥ छत्रं सुच्छत्रो विख्यातो लोकः सर्वाश्रयः
    क्रमः । मुण्डो विरूपो विकृतो दण्डी कुण्डी विकुर्वणः ॥ ॥ हर्यक्षः ककुभो वज्री शतजिह्वः सहस्रपात् ।
    सहस्रमूर्धा देवेन्द्रः सर्वदेवमयो गुरुः ॥ ॥ सहस्रबाहुः सर्वाङ्गः शरण्यः सर्वलोककृत् । पवित्रं त्रिककुन्मन्त्रः
    कनिष्ठः कृष्णपिङ्गलः ॥ ॥ ब्रह्मदण्डविनिर्माता शतघ्नीपाशशक्तिमान् । पद्मगर्भो महागर्भो ब्रह्मगर्भो
    जलोद्भवः ॥ ॥ गभस्तिर्ब्रह्मकृद्ब्रह्मी ब्रह्मविद्ब्राह्मणो गतिः । अनन्तरूपो नैकात्मा तिग्मतेजाः स्वयम्भुवः
    ॥ ॥ ऊर्ध्वगात्मा पशुपतिर्वातरंहा मनोजवः । चन्दनी पद्मनालाग्रः सुरभ्युत्तरणो नरः ॥ ॥ कर्णिकारमहास्रग्वी
    नीलमौलिः पिनाकधृत् । उमापतिरुमाकान्तो जाह्नवीधृदुमाधवः ॥ ॥ वरो वराहो वरदो वरेण्यः सुमहास्वनः । महाप्रसादो
    दमनः शत्रुहा श्वेतपिङ्गलः ॥ ॥ पीतात्मा परमात्मा च प्रयतात्मा प्रधानधृत् । सर्वपार्श्वमुखस्त्र्यक्षो
    धर्मसाधारणो वरः ॥ ॥ चराचरात्मा सूक्ष्मात्मा अमृतो गोवृषेश्वरः । साध्यर्षिर्वसुरादित्यो विवस्वान्सवितामृतः
    ॥ ॥ व्यासः सर्गः सुसङ्क्षेपो विस्तरः पर्ययो नरः । ऋतुः संवत्सरो मासः पक्षः सङ्ख्यासमापनः ॥ ॥ कला काष्ठा
    लवा मात्रा मुहूर्ताहः क्षपाः क्षणाः । विश्वक्षेत्रं प्रजाबीजं लिङ्गमाद्यस्तु निर्गमः ॥ ॥ सदसद्व्यक्तमव्यक्तं
    पिता माता पितामहः । स्वर्गद्वारं प्रजाद्वारं मोक्षद्वारं त्रिविष्टपम् ॥ ॥ निर्वाणं ह्लादनश्चैव ब्रह्मलोकः
    परा गतिः । देवासुरविनिर्माता देवासुरपरायणः ॥ ॥ देवासुरगुरुर्देवो देवासुरनमस्कृतः । देवासुरमहामात्रो
    देवासुरगणाश्रयः ॥ ॥ देवासुरगणाध्यक्षो देवासुरगणाग्रणीः । देवातिदेवो देवर्षिर्देवासुरवरप्रदः ॥ देवासुरेश्वरो
    विश्वो देवासुरमहेश्वरः । सर्वदेवमयोऽचिन्त्यो देवतात्माऽऽत्मसम्भवः ॥ ॥ उद्भित्त्रिविक्रमो वैद्यो विरजो
    नीरजोऽमरः । ईड्यो हस्तीश्वरो व्याघ्रो देवसिंहो नरर्षभः ॥ ॥ विबुधोऽग्रवरः सूक्ष्मः सर्वदेवस्तपोमयः
    । सुयुक्तः शोभनो वज्री प्रासानां प्रभवोऽव्ययः ॥ ॥ गुहः कान्तो निजः सर्गः पवित्रं सर्वपावनः । शृङ्गी
    शृङ्गप्रियो बभ्रू राजराजो निरामयः ॥ ॥ अभिरामः सुरगणो विरामः सर्वसाधनः । ललाटाक्षो विश्वदेवो हरिणो
    ब्रह्मवर्चसः ॥ ॥ स्थावराणां पतिश्चैव नियमेन्द्रियवर्धनः । सिद्धार्थः सिद्धभूतार्थोऽचिन्त्यः सत्यव्रतः
    शुचिः ॥ ॥ व्रताधिपः परं ब्रह्म भक्तानां परमा गतिः । विमुक्तो मुक्ततेजाश्च श्रीमान् श्रीवर्धनो जगत्
    ॥ यथा प्रधानं भगवानिति भक्त्या स्तुतो मया । यं न ब्रह्मादयो देवा विदुस्तत्त्वेन नर्षयः ॥ ॥ स्तोतव्यमर्च्यं
    वन्द्यं च कः स्तोष्यति जगत्पतिम् । भक्त्या त्वेवं पुरस्कृत्य मया यज्ञपतिर्विभुः ॥ ॥ ततोऽभ्यनुज्ञां
    सम्प्राप्य स्तुतो मतिमतां वरः । शिवमेभिः स्तुवन् देवं नामभिः पुष्टिवर्धनैः ॥ ॥ नित्ययुक्तः शुचिर्भक्तः
    प्राप्नोत्यात्मानमात्मना । एतद्धि परमं ब्रह्म परं ब्रह्माधिगच्छति ॥ ॥ ऋषयश्चैव देवाश्च स्तुवन्त्येतेन
    तत्परम् । स्तूयमानो महादेवस्तुष्यते नियतात्मभिः ॥ ॥ भक्तानुकम्पी भगवानात्मसंस्थाकरो विभुः । तथैव च
    मनुष्येषु ये मनुष्याः प्रधानतः ॥ ॥ आस्तिकाः श्रद्दधानाश्च बहुभिर्जन्मभिः स्तवैः । भक्त्या ह्यनन्यमीशानं
    परं देवं सनातनम् ॥ ॥ कर्मणा मनसा वाचा भावेनामिततेजसः । शयाना जाग्रमाणाश्च व्रजन्नुपविशंस्तथा ॥ ॥ उन्मिषन्निमिषंश्चैव
    चिन्तयन्तः पुनः पुनः । शृण्वन्तः श्रावयन्तश्च कथयन्तश्च ते भवम् ॥ ॥ स्तुवन्तः स्तूयमानाश्च तुष्यन्ति
    च रमन्ति च । जन्मकोटिसहस्रेषु नानासंसारयोनिषु ॥ ॥ जन्तोर्विगतपापस्य भवे भक्तिः प्रजायते । उत्पन्ना
    च भवे भक्तिरनन्या सर्वभावतः ॥ ॥ भाविनः कारणे चास्य सर्वयुक्तस्य सर्वथा । एतद्देवेषु दुष्प्रापं मनुष्येषु
    न लभ्यते ॥ ॥ निर्विघ्ना निश्चला रुद्रे भक्तिरव्यभिचारिणी । तस्यैव च प्रसादेन भक्तिरुत्पद्यते नृणाम्
    ॥ ॥ येन यान्ति परां सिद्धिं तद्भावगतचेतसः । ये सर्वभावानुगताः प्रपद्यन्ते महेश्वरम् ॥ ॥ प्रपन्नवत्सलो
    देवः संसारात्तान्समुद्धरेत् । एवमन्ये विकुर्वन्ति देवाः संसारमोचनम् ॥ ॥ मनुष्याणामृते देवं नान्या
    शक्तिस्तपोबलम् । इति तेनेन्द्रकल्पेन भगवान् सदसत्पतिः ॥ ॥ कृत्तिवासाः स्तुतः कृष्ण तण्डिना शुभबुद्धिना
    । स्तवमेतं भगवतो ब्रह्मा स्वयमधारयत् ॥ ॥ गीयते च स बुद्ध्येत ब्रह्मा शङ्करसन्निधौ । इदं पुण्यं पवित्रं
    च सर्वदा पापनाशनम् ॥ ॥ योगदं मोक्षदं चैव स्वर्गदं तोषदं तथा । एवमेतत्पठन्ते य एकभक्त्या तु शङ्करम्
    ॥ ॥ या गतिः साङ्ख्ययोगानां व्रजन्त्येतां गतिं तदा । स्तवमेतं प्रयत्नेन सदा रुद्रस्य सन्निधौ ॥ ॥ अब्दमेकं
    चरेद्भक्तः प्राप्नुयादीप्सितं फलम् । एतद्रहस्यं परमं ब्रह्मणो हृदि संस्थितम् ॥ ॥ ब्रह्मा प्रोवाच शक्राय
    शक्रः प्रोवाच मृत्यवे । मृत्युः प्रोवाच रुद्रेभ्यो रुद्रेभ्यस्तण्डिमागमत् ॥ ॥ महता तपसा प्राप्तस्तण्डिना
    ब्रह्मसद्मनि । तण्डिः प्रोवाच शुक्राय गौतमाय च भार्गवः ॥ ॥ वैवस्वताय मनवे गौतमः प्राह माधव । नारायणाय
    साध्याय समाधिष्ठाय धीमते ॥ ॥ यमाय प्राह भगवान् साध्यो नारायणोऽच्युतः । नाचिकेताय भगवानाह वैवस्वतो
    यमः ॥ ॥ मार्कण्डेयाय वार्ष्णेय नाचिकेतोऽभ्यभाषत । मार्कण्डेयान्मया प्राप्तो नियमेन जनार्दन ॥ ॥ तवाप्यहममित्रघ्न
    स्तवं दद्यां ह्यविश्रुतम् । स्वर्ग्यमारोग्यमायुष्यं धन्यं वेदेन सम्मितम् ॥ ॥ नास्य विघ्नं विकुर्वन्ति
    दानवा यक्षराक्षसाः । पिशाचा यातुधाना वा गुह्यका भुजगा अपि ॥ ॥ यः पठेत शुचिः पार्थ ब्रह्मचारी जितेन्द्रियः
    । अभग्नयोगो वर्षं तु सोऽश्वमेधफलं लभेत् ॥ ॥ इति श्रीमहाभारते अनुशासनपर्वणि महादेवसहस्रनाम स्तोत्रं
    नाम सप्तदशोऽध्यायः ॥
