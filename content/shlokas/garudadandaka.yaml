id: garudadandaka
category: stotram
name:
  english: garudadandaka
  devanagari: गरुडदण्डक
content:
  english: shrigarudadandakam shrimate nigamantamahadeshikaya namah | shriman venkatanatharyah kavitarkikakesari
    | vedantacaryavaryo me sannidhattam sadahridi || namah pannaganaddhaya vaikunthavashavartine | shrutisindhu
    sudhotpadamandaraya garutmate || 1|| garudamakhilavedanidadhirudham dvishatpidanotkanthitakunthavaikunthapithikrita
    skandhamide svanidagatipritarudrasukirtistanabhogagadhopagudha sphuratkantakavrata vedhavyathavepamana
    dvijihvadhipakalpavishpharyamana sphatavatika ratnarocishchata rajinirajitam kantikallolinirajitam
    || 2|| jayagaruda suparna darvikarahara devadhipaharaharin divaukaspatikshiptadambhoḻidharakinakalpa
    kalpantavatula kalpodayanalpa virayitodyaccamatkara daityari jaitradhvajarohanirdharitotkarsha sankarshanatman
    garutman marutpanca kadhisha satyadimurte na kashcit samaste namaste punaste namah || 3|| nama idamajahatsaparyaya
    paryayaniryatapakshanilasphalanodvelapathodhi vicicapetahatagadhapataḻabhankarasamkruddhanagendrapidasrinibhava
  devanagari: श्रीगरुडदण्डकम् श्रीमते निगमान्तमहादेशिकाय नमः । श्रीमान् वेङ्कटनाथार्यः कवितार्किककेसरी
    । वेदान्तचार्यवर्यो मे सन्निधत्ताम् सदाहृदि ॥ नमः पन्नगनद्धाय वैकुण्ठवशवर्तिने । श्रुतिसिन्धु सुधोत्पादमन्दराय
    गरुत्मते ॥ १॥ गरुडमखिलवेदनीडाधिरूढम् द्विषत्पीडनोत्कण्ठिताकुण्ठवैकुण्ठपीठीकृत स्कन्धमीडे स्वनीडागतिप्रीतरुद्रासुकीर्तिस्तनाभोगगाढोपगूढ
    स्फुरत्कण्टकव्रात वेधव्यथावेपमान द्विजिह्वाधिपाकल्पविष्फार्यमाण स्फटावाटिका रत्नरोचिश्छटा राजिनीराजितं
    कान्तिकल्लोलिनीराजितम् ॥ २॥ जयगरुड सुपर्ण दर्वीकराहार देवाधिपाहारहारिन् दिवौकस्पतिक्षिप्तदम्भोळिधाराकिणाकल्प
    कल्पान्तवातूल कल्पोदयानल्प वीरायितोद्यच्चमत्कार दैत्यारि जैत्रध्वजारोहनिर्धारितोत्कर्ष सङ्कर्षणात्मन्
    गरुत्मन् मरुत्पञ्च काधीश सत्यादिमूर्ते न कश्चित् समस्ते नमस्ते पुनस्ते नमः ॥ ३॥ नम इदमजहत्सपर्याय
    पर्यायनिर्यातपक्षानिलास्फालनोद्वेलपाथोधि वीचीचपेटाहतागाधपाताळभाङ्कारसंक्रुद्धनागेन्द्रपीडासृणीभाव
meaning: {}
