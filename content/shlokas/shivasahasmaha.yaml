id: shivasahasmaha
category: stotram
name:
  english: shivasahasmaha
  devanagari: शिवसहस्ंअह
content:
  english: dhritimanmatimandakshah satkritashca yugadhipah | gopalirgopatirgramo gocarmavasano harih|
    115|| hiranyabahushca tatha guhapalah praveshinam | prakrishtarirmahaharsho jitakamo jitendriyah ||
    116|| gandharashca suvasashca tapahsakto ratirnarah | mahagito mahanrityo hyapsaroganasevitah || 117||
    mahaketurmahadhaturnaikasanucarashcalah | avedaniya adeshah sarvagandhasukhavahah || 118|| toranastarano
    vatah paridhi patikhecarah | samyogo vardhano vriddho ativriddho gunadhikah || 119|| nitya atmasahayashca
    devasurapatih patih | yuktashca yuktabahushca devo divi suparvanah || 120|| ashadhashca sushandhashca
    dhruvo'tha harino harah | vapuravartamanebhyo vasushreshtho mahapathah || 121|| shirohari vimarshashca
    sarvalakshanalakshitah | akshashca rathayogi ca sarvayogi mahabalah || 122|| samamnayo'samamnayastirthadevo
    maharathah | nirjivo jivano mantrah shubhaksho bahukarkashah || 123|| ratnaprabhuto ratnango maharnavanipanavit
    | mulam vishalo hyamrito vyaktavyaktastaponidhih || 124|| arohano'dhirohashca shiladhari mahayashah
    | senakalpo mahakalpo yogo yugakaro harih || 125|| yugarupo maharupo mahanagahano vadhah | nyayanirvapanah
    padah pandito hyacalopamah || 126|| bahumalo mahamalah shashi harasulocanah | vistaro lavanah kupastriyugah
    saphalodayah || 127|| trilocano vishannango manividdho jatadharah | bindurvisargah sumukhah sharah
    sarvayudhah sahah || 128|| nivedanah sukhajatah sugandharo mahadhanuh | gandhapali ca bhagavanutthanah
    sarvakarmanam || 129|| manthano bahulo vayuh sakalah sarvalocanah | talastalah karasthali urdhvasamhanano
    mahan || 130|| chatram succhatro vikhyato lokah sarvashrayah kramah | mundo virupo vikrito dandi kundi
    vikurvanah| 131|| haryakshah kakubho vajro shatajihvah sahasrapat | sahasramurdha devendrah sarvadevamayo
    guruh || 132|| sahasrabahuh sarvangah sharanyah sarvalokakrit | pavitram trikakunmantrah kanishthah
    krishnapingalah| 133|| brahmadandavinirmata shataghnipashashaktiman | padmagarbho mahagarbho brahmagarbho
    jalodbhavah || 134|| gabhastirbrahmakridbrahmi brahmavidbrahmano gatih | anantarupo naikatma tigmatejah
    svayambhuvah || 135|| urdhvagatma pashupatirvataramha manojavah | candani padmanalagrah surabhyuttarano
    narah || 136|| karnikaramahasragvi nilamaulih pinakadhrit | umapatirumakanto jahnavidhrigumadhavah
    || 137|| varo varaho varado varenyah sumahasvanah | mahaprasado damanah shatruha shvetapingalah ||
    138|| pitatma paramatma ca prayatatma pradhanadhrit | sarvaparshvamukhastryaksho dharmasadharano varah
    || 139|| caracaratma sukshmatma amrito govrisheshvarah | sadhyarshirvasuradityo vivasvansavita'mritah
    140|| vyasah sargah susankshepo vistarah paryayo narah | ritu samvatsaro masah pakshah sankhyasamapanah
    || 141|| kala kashtha lava matra muhurtahahkshapah kshanah | vishvakshetram prajabijam lingamadyastu
    nirgamah || 142|| sadasadvyaktamavyaktam pita mata pitamahah | svargadvaram prajadvaram mokshadvaram
    trivishtapam || 143|| nirvanam hladanashcaiva brahmalokah para gatih | devasuravinirmata devasuraparayanah
    || 144|| devasuragururdevo devasuranamaskritah | devasuramahamatro devasuraganashrayah || 145|| devasuraganadhyaksho
    devasuraganagranih | devatidevo devarshirdevasuravarapradah || 146|| devasureshvaro vishvo devasuramaheshvarah
    | sarvadevamayo'cintyo devatatma''tmasambhavah || 147|| udbhittrivikramo vaidyo virajo nirajo'marah
    || idyo hastishvaro vyaghro devasimho nararshabhah || 148|| vibudho'gravarah sukshmah sarvadevastapomayah
    | suyuktah shobhano vajri prasanam prabhavo'vyayah || 149|| guhah kanto nijah sargah pavitram sarvapavanah
    | sha
  devanagari: धृतिमान्मतिमान्दक्षः सत्कृतश्च युगाधिपः । गोपालिर्गोपतिर्ग्रामो गोचर्मवसनो हरिः। ११५॥ हिरण्यबाहुश्च
    तथा गुहापालः प्रवेशिनाम् । प्रकृष्टारिर्महाहर्षो जितकामो जितेन्द्रियः ॥ ११६॥ गान्धारश्च सुवासश्च तपःसक्तो
    रतिर्नरः । महागीतो महानृत्यो ह्यप्सरोगणसेवितः ॥ ११७॥ महाकेतुर्महाधातुर्नैकसानुचरश्चलः । आवेदनीय आदेशः
    सर्वगन्धसुखावहः ॥ ११८॥ तोरणस्तारणो वातः परिधी पतिखेचरः । संयोगो वर्धनो वृद्धो अतिवृद्धो गुणाधिकः ॥
    ११९॥ नित्य आत्मसहायश्च देवासुरपतिः पतिः । युक्तश्च युक्तबाहुश्च देवो दिवि सुपर्वणः ॥ १२०॥ आषाढश्च
    सुषाण्ढश्च ध्रुवोऽथ हरिणो हरः । वपुरावर्तमानेभ्यो वसुश्रेष्ठो महापथः ॥ १२१॥ शिरोहारी विमर्शश्च सर्वलक्षणलक्षितः
    । अक्षश्च रथयोगी च सर्वयोगी महाबलः ॥ १२२॥ समाम्नायोऽसमाम्नायस्तीर्थदेवो महारथः । निर्जीवो जीवनो मन्त्रः
    शुभाक्षो बहुकर्कशः ॥ १२३॥ रत्नप्रभूतो रत्नाङ्गो महार्णवनिपानवित् । मूलं विशालो ह्यमृतो व्यक्ताव्यक्तस्तपोनिधिः
    ॥ १२४॥ आरोहणोऽधिरोहश्च शीलधारी महायशाः । सेनाकल्पो महाकल्पो योगो युगकरो हरिः ॥ १२५॥ युगरूपो महारूपो
    महानागहनो वधः । न्यायनिर्वपणः पादः पण्डितो ह्यचलोपमः ॥ १२६॥ बहुमालो महामालः शशी हरसुलोचनः । विस्तारो
    लवणः कूपस्त्रियुगः सफलोदयः ॥ १२७॥ त्रिलोचनो विषण्णाङ्गो मणिविद्धो जटाधरः । बिन्दुर्विसर्गः सुमुखः
    शरः सर्वायुधः सहः ॥ १२८॥ निवेदनः सुखाजातः सुगन्धारो महाधनुः । गन्धपाली च भगवानुत्थानः सर्वकर्मणाम्
    ॥ १२९॥ मन्थानो बहुलो वायुः सकलः सर्वलोचनः । तलस्तालः करस्थाली ऊर्ध्वसंहननो महान् ॥ १३०॥ छत्रं सुच्छत्रो
    विख्यातो लोकः सर्वाश्रयः क्रमः । मुण्डो विरूपो विकृतो दण्डी कुण्डी विकुर्वणः। १३१॥ हर्यक्षः ककुभो
    वज्रो शतजिह्वः सहस्रपात् । सहस्रमूर्धा देवेन्द्रः सर्वदेवमयो गुरुः ॥ १३२॥ सहस्रबाहुः सर्वाङ्गः शरण्यः
    सर्वलोककृत् । पवित्रं त्रिककुन्मन्त्रः कनिष्ठः कृष्णपिङ्गलः। १३३॥ ब्रह्मदण्डविनिर्माता शतघ्नीपाशशक्तिमान्
    । पद्मगर्भो महागर्भो ब्रह्मगर्भो जलोद्भवः ॥ १३४॥ गभस्तिर्ब्रह्मकृद्ब्रह्मी ब्रह्मविद्ब्राह्मणो गतिः
    । अनन्तरूपो नैकात्मा तिग्मतेजाः स्वयम्भुवः ॥ १३५॥ ऊर्ध्वगात्मा पशुपतिर्वातरंहा मनोजवः । चन्दनी पद्मनालाग्रः
    सुरभ्युत्तरणो नरः ॥ १३६॥ कर्णिकारमहास्रग्वी नीलमौलिः पिनाकधृत् । उमापतिरुमाकान्तो जाह्नवीधृगुमाधवः
    ॥ १३७॥ वरो वराहो वरदो वरेण्यः सुमहास्वनः । महाप्रसादो दमनः शत्रुहा श्वेतपिङ्गलः ॥ १३८॥ पीतात्मा परमात्मा
    च प्रयतात्मा प्रधानधृत् । सर्वपार्श्वमुखस्त्र्यक्षो धर्मसाधारणो वरः ॥ १३९॥ चराचरात्मा सूक्ष्मात्मा
    अमृतो गोवृषेश्वरः । साध्यर्षिर्वसुरादित्यो विवस्वान्सविताऽमृतः १४०॥ व्यासः सर्गः सुसङ्क्षेपो विस्तरः
    पर्ययो नरः । ऋतु संवत्सरो मासः पक्षः सङ्ख्यासमापनः ॥ १४१॥ कला काष्ठा लवा मात्रा मुहूर्ताहःक्षपाः क्षणाः
    । विश्वक्षेत्रं प्रजाबीजं लिङ्गमाद्यस्तु निर्गमः ॥ १४२॥ सदसद्व्यक्तमव्यक्तं पिता माता पितामहः । स्वर्गद्वारं
    प्रजाद्वारं मोक्षद्वारं त्रिविष्टपम् ॥ १४३॥ निर्वाणं ह्लादनश्चैव ब्रह्मलोकः परा गतिः । देवासुरविनिर्माता
    देवासुरपरायणः ॥ १४४॥ देवासुरगुरुर्देवो देवासुरनमस्कृतः । देवासुरमहामात्रो देवासुरगणाश्रयः ॥ १४५॥ देवासुरगणाध्यक्षो
    देवासुरगणाग्रणीः । देवातिदेवो देवर्षिर्देवासुरवरप्रदः ॥ १४६॥ देवासुरेश्वरो विश्वो देवासुरमहेश्वरः
    । सर्वदेवमयोऽचिन्त्यो देवतात्माऽऽत्मसम्भवः ॥ १४७॥ उद्भित्त्रिविक्रमो वैद्यो विरजो नीरजोऽमरः ॥ ईड्यो
    हस्तीश्वरो व्याघ्रो देवसिंहो नरर्षभः ॥ १४८॥ विबुधोऽग्रवरः सूक्ष्मः सर्वदेवस्तपोमयः । सुयुक्तः शोभनो
    वज्री प्रासानां प्रभवोऽव्ययः ॥ १४९॥ गुहः कान्तो निजः सर्गः पवित्रं सर्वपावनः । श
