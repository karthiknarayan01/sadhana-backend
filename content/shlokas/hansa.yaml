id: hansa
category: upanishad
name:
  english: hansa
  devanagari: हन्स
content:
  english: rinu gautama tanmama || 2|| anakhyeyamidam guhyam yoginam koshasamnibham | hamsasyakritivistaram
    bhuktimuktiphalapradam || 3|| atha hamsaparamahamsanirnayam vyakhyasyamah | brahmacarine shantaya
    dantaya gurubhaktaya | hamsahamseti sada dhyayansarveshu deheshu vyapya vartate || yatha hyagnih kashtheshu
    tileshu tailamiva tam viditva mrityumatyeti | gudamavashtabhyadharadvayumutthapyasvadhishtham trih
    pradikshinikritya manipurakam ca gatva anahatamatikramya vishuddhau pranannirudhyajnamanudhyayanbrahmarandhram
    dhyayan trimatro'hamityevam sarvada dhyayan | atho nadamadharadbrahmarandhraparyantam shuddhasphatikasankasham
    sa vai brahma paramatmetyucyate || 1|| atha hamsa rishih | avyakta gayatri chandah | paramahamso devata
    | ahamiti bijam | sa iti shaktih | so'hamiti kilakam | shat sankhyaya ahoratrayorekavimshatisahasrani
    shat shatanyadhikani bhavanti | suryaya somaya niranjanaya nirabhasaya tanu sukshmam pracodayaditi
    agnishomabhyam vaushat hridayadyanganyasakaranyasau bhavatah | evam kritva hridaye ashtadale hamsatmanam
    dhyayet | agnishomau pakshavonkarah shiro bindustu netram mukham rudro rudrani caranau bahu kalashcagnishcobhe
    parshve bhavatah | pashyatyanagarashca shishtobhayaparshve bhavatah | esho'sau paramahamso bhanukotipratikashah
    | yenedam vyaptam | tasyashtadha vrittirbhavati | purvadale punye matih agneye nidralasyadayo bhavanti
    yamye krure matih nairrite pape manisha varunyam krida vayavye gamanadau buddhih saumye ratipritih
    ishane dravyadanam madhye vairagyam kesare jagradavastha karnikayam svapnam linge sushuptih padmatyage
    turiyam yada hamso nade lino bhavati tada turyatitamunmananamajapopasamharamityabhidhiyate | evam
    sarvam hamsavashattasmanmano hamso vicaryate | sa eva japakotya nadamanubhavati evam sarvam hamsavashannado
    dashavidho jayate | ciniti prathamah | cinciniti dvitiyah | ghantanadastritiyah | shankhanadashcaturthah
    | pancamatantrinadah | shashthastalanadah | saptamo venunadah | ashtamo mridanganadah | navamo bherinadah
    | dashamo meghanadah | navamam parityajya dashamamevabhyaset | prathame cincinigatram dvitiye gatrabhanjanam
    | tritiye khedanam yati caturthe kampate shirah || pancame sravate talu shashthe'mritanishevanam |
    saptame gudhavijnanam para vaca tathashtame || adrishyam navame deham divyam cakshustathamalam | dashame
    paramam brahma bhavedbrahmatmasamnidhau || tasminmano viliyate manasi sankalpavikalpe dagdhe punyapape
    sadashivah shaktyatma sarvatravasthitah svayamjyotih shuddho buddho nityo niranjanah shantah prakashata
    iti || iti vedapravacanam vedapravacanam || 2|| om purnamada iti shantih || iti hamsopanishatsamapta
    ||
  devanagari: ृणु गौतम तन्मम ॥ २॥ अनाख्येयमिदं गुह्यं योगिनां कोशसंनिभम् । हंसस्याकृतिविस्तारं भुक्तिमुक्तिफलप्रदम्
    ॥ ३॥ अथ हंसपरमहंसनिर्णयं व्याख्यास्यामः । ब्रह्मचारिणे शान्ताय दान्ताय गुरुभक्ताय । हंसहंसेति सदा
    ध्यायन्सर्वेषु देहेषु व्याप्य वर्तते ॥ यथा ह्यग्निः काष्ठेषु तिलेषु तैलमिव तं विदित्वा मृत्युमत्येति
    । गुदमवष्टभ्याधाराद्वायुमुत्थाप्यस्वाधिष्ठां त्रिः प्रदिक्षिणीकृत्य मणिपूरकं च गत्वा अनाहतमतिक्रम्य
    विशुद्धौ प्राणान्निरुध्याज्ञामनुध्यायन्ब्रह्मरन्ध्रं ध्यायन् त्रिमात्रोऽहमित्येवं सर्वदा ध्यायन् ।
    अथो नादमाधाराद्ब्रह्मरन्ध्रपर्यन्तं शुद्धस्फटिकसङ्काशं स वै ब्रह्म परमात्मेत्युच्यते ॥ १॥ अथ हंस ऋषिः
    । अव्यक्ता गायत्री छन्दः । परमहंसो देवता । अहमिति बीजम् । स इति शक्तिः । सोऽहमिति कीलकम् । षट् सङ्ख्यया
    अहोरात्रयोरेकविंशतिसहस्राणि षट् शतान्यधिकानि भवन्ति । सूर्याय सोमाय निरञ्जनाय निराभासाय तनु सूक्ष्मं
    प्रचोदयादिति अग्नीषोमाभ्यां वौषट् हृदयाद्यङ्गन्यासकरन्यासौ भवतः । एवं कृत्वा हृदये अष्टदले हंसात्मानं
    ध्यायेत् । अग्नीषोमौ पक्षावोङ्कारः शिरो बिन्दुस्तु नेत्रं मुखं रुद्रो रुद्राणी चरणौ बाहू कालश्चाग्निश्चोभे
    पार्श्वे भवतः । पश्यत्यनागारश्च शिष्टोभयपार्श्वे भवतः । एषोऽसौ परमहंसो भानुकोटिप्रतीकाशः । येनेदं
    व्याप्तम् । तस्याष्टधा वृत्तिर्भवति । पूर्वदले पुण्ये मतिः आग्नेये निद्रालस्यादयो भवन्ति याम्ये क्रूरे
    मतिः नैरृते पापे मनीषा वारुण्यां क्रीडा वायव्ये गमनादौ बुद्धिः सौम्ये रतिप्रीतिः ईशाने द्रव्यादानं
    मध्ये वैराग्यं केसरे जाग्रदवस्था कर्णिकायां स्वप्नं लिङ्गे सुषुप्तिः पद्मत्यागे तुरीयं यदा हंसो नादे
    लीनो भवति तदा तुर्यातीतमुन्मननमजपोपसंहारमित्यभिधीयते । एवं सर्वं हंसवशात्तस्मान्मनो हंसो विचार्यते
    । स एव जपकोट्या नादमनुभवति एवं सर्वं हंसवशान्नादो दशविधो जायते । चिणीति प्रथमः । चिञ्चिणीति द्वितीयः
    । घण्टानादस्तृतीयः । शङ्खनादश्चतुर्थः । पञ्चमतन्त्रीनादः । षष्ठस्तालनादः । सप्तमो वेणुनादः । अष्टमो
    मृदङ्गनादः । नवमो भेरीनादः । दशमो मेघनादः । नवमं परित्यज्य दशममेवाभ्यसेत् । प्रथमे चिञ्चिणीगात्रं
    द्वितीये गात्रभञ्जनम् । तृतीये खेदनं याति चतुर्थे कम्पते शिरः ॥ पञ्चमे स्रवते तालु षष्ठेऽमृतनिषेवणम्
    । सप्तमे गूढविज्ञानं परा वाचा तथाष्टमे ॥ अदृश्यं नवमे देहं दिव्यं चक्षुस्तथामलम् । दशमे परमं ब्रह्म
    भवेद्ब्रह्मात्मसंनिधौ ॥ तस्मिन्मनो विलीयते मनसि सङ्कल्पविकल्पे दग्धे पुण्यपापे सदाशिवः शक्त्यात्मा
    सर्वत्रावस्थितः स्वयंज्योतिः शुद्धो बुद्धो नित्यो निरञ्जनः शान्तः प्रकाशत इति ॥ इति वेदप्रवचनं वेदप्रवचनम्
    ॥ २॥ ॐ पूर्णमद इति शान्तिः ॥ इति हंसोपनिषत्समाप्ता ॥
