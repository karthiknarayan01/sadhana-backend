id: svarnakarshanabhairavamantramayastotram
category: stotram
name:
  english: svarnakarshanabhairavamantramayastotram
  devanagari: स्वर्णाकर्षणभैरवमन्त्रमयस्तोत्रम्
content:
  english: yah pathet paramam stotramidam nityam narottamah | sa martyo mandabhagyo'pi bhairavasya prasadatah
    || 25|| icchato'pyadhikam lakshmim labhate natra samshayah | rasasiddhirbhavecchighram nidhinamadhipo
    bhavet || 26|| sarvan kamanavapnoti daivatairapi durlabham | etajjapairmahalakshmishcancalapyacala
    bhavet || 27|| ratnanyashvan gajan bhutirlabhate shighrameva hi | svarnarashimavapnoti cakshayam natra
    samshayah || 28|| dhenum cintamanim kalpadrumam shighramavapnuyat | nityamashtottarashatam yo japet
    stotramuttamam || 29|| mandalardhacca prageva svarnarashimanuttamam | satatam dhyayate tasmai darshayatyeva
    na samshayah || 30|| nityam ca tripurabhaktaih svarnakarshanabhairavah | yatnena sarvadopasyah sarvakamapradayakah
    || 31|| iti shritripurasiddhante dakshinamurtiproktam svarnakarshanabhairavastotram samaptam |
  devanagari: यः पठेत् परमं स्तोत्रमिदं नित्यं नरोत्तमः । स मर्त्यो मन्दभाग्योऽपि भैरवस्य प्रसादतः ॥ २५॥
    इच्छातोऽप्यधिकां लक्ष्मीं लभते नात्र संशयः । रससिद्धिर्भवेच्छीघ्रं निधीनामधिपो भवेत् ॥ २६॥ सर्वान्
    कामानवाप्नोति दैवतैरपि दुर्लभम् । एतज्जपैर्महालक्ष्मीश्चञ्चलाप्यचला भवेत् ॥ २७॥ रत्नान्यश्वान् गजान्
    भूतीर्लभते शीघ्रमेव हि । स्वर्णराशिमवाप्नोति चाक्षयां नात्र संशयः ॥ २८॥ धेनुं चिन्तामणिं कल्पद्रुमं
    शीघ्रमवाप्नुयात् । नित्यमष्टोत्तरशतं यो जपेत् स्तोत्रमुत्तमम् ॥ २९॥ मण्डलार्धाच्च प्रागेव स्वर्णराशिमनुत्तमम्
    । सततं ध्यायते तस्मै दर्शयत्येव न संशयः ॥ ३०॥ नित्यं च त्रिपुराभक्तैः स्वर्णाकर्षणभैरवः । यत्नेन सर्वदोपास्यः
    सर्वकामप्रदायकः ॥ ३१॥ इति श्रीत्रिपुरासिद्धान्ते दक्षिणामूर्तिप्रोक्तं स्वर्णाकर्षणभैरवस्तोत्रं समाप्तम्
    ।
