id: prakritikritamshrikrishnastotram
category: stotram
name:
  english: prakritikritamshrikrishnastotram
  devanagari: प्रकृतिकृतंश्रीकृष्णस्तोत्रम्
content:
  english: 80|| caracaramshca vishveshu devanbrahmapurogaman | madvidhah kati va devih srashtum shaktashca
    lilaya || 81|| paripurnatamam svidyam vande canandapurvakam | mahanviradyatkalamsho vishvasankhyashrayo
    vibho | vande canandapurvam tam paramatmanamishvaram || 82|| yam ca stotumashaktashca brahmavishnushivadayah
    | veda aham ca vani ca vande tam prakriteh param || 83|| vedashca vidusham shreshthah stotum shaktashca
    na kshamah | nirlakshyam kah kshamah stotum tam niriham namamyaham || 84|| ityevamuktva sa durga ratnasimhasane
    vare | uvasa natva shrikrishnam tushtuvustam sureshvarah || 85|| iti brahmavaivartapaharane brahmakhande
    tritiyadhyayantargatam prakritikritam shrikrishnastotram samaptam | brahmavaivartapurana | brahmakhanda
    | adhyaya 3
  devanagari: ८०॥ चराचरांश्च विश्वेषु देवान्ब्रह्मपुरोगमान् । मद्विधाः कति वा देवीः स्रष्टुं शक्तश्च लीलया
    ॥ ८१॥ परिपूर्णतमं स्वीड्यं वन्दे चानन्दपूर्वकम् । महान्विराड्यत्कलांशो विश्वसङ्ख्याश्रयो विभो । वन्दे
    चानन्दपूर्वं तं परमात्मानमीश्वरम् ॥ ८२॥ यं च स्तोतुमशक्ताश्च ब्रह्मविष्णुशिवादयः । वेदा अहं च वाणी
    च वन्दे तं प्रकृतेः परम् ॥ ८३॥ वेदाश्च विदुषां श्रेष्ठाः स्तोतुं शक्ताश्च न क्षमाः । निर्लक्ष्यं कः
    क्षमः स्तोतुं तं निरीहं नमाम्यहम् ॥ ८४॥ इत्येवमुक्त्वा सा दुर्गा रत्नसिंहासने वरे । उवास नत्वा श्रीकृष्णं
    तुष्टुवुस्तां सुरेश्वराः ॥ ८५॥ इति ब्रह्मवैवर्तपहराणे ब्रह्मखण्डे तृतीयाध्यायान्तर्गतं प्रकृतिकृतं
    श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । ब्रह्मखण्ड । अध्याय ३
