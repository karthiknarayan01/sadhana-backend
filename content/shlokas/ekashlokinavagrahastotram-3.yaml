id: ekashlokinavagrahastotram-3
category: ekashloki
name:
  english: ekashlokinavagrahastotram 3
  devanagari: एकश्लोकीनवग्रहस्तोत्रम् ३
content:
  english: ekashlokinavagrahastotram 3 arogyam pradadatu no dinakarah candroyasho nirmalam bhutim bhumisuto
    sudhamshutanayah prajnam gururgauravam | kavyah komalavagvilasamatulam mando mudam sarvada rahurbahubalam
    virodhashamanam ketuh kulasyonnatim || ityekashloki navagrahastotram samaptam |
  devanagari: एकश्लोकीनवग्रहस्तोत्रम् ३ आरोग्यं प्रददातु नो दिनकरः चन्द्रोयशो निर्मलं भूतिं भूमिसुतो सुधांशुतनयः
    प्रज्ञां गुरुर्गौरवम् । काव्यः कोमलवाग्विलासमतुलं मन्दो मुदं सर्वदा राहुर्बाहुबलं विरोधशमनं केतुः
    कुलस्योन्नतिम् ॥ इत्येकश्लोकी नवग्रहस्तोत्रं समाप्तम् ।
meaning: {}
