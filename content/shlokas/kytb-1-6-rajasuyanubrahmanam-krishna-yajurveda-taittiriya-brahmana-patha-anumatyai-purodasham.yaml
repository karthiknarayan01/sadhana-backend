id: kytb-1-6-rajasuyanubrahmanam-krishna-yajurveda-taittiriya-brahmana-patha-anumatyai-purodasham
category: stotram
name:
  english: KYTB 1.6 Rajasuyanubrahmanam - Krishna Yajurveda Taittiriya Brahmana Patha - Anumatyai Purodasham
content:
  english: krishna yajurvediya taittiriya brahmane prathamashtake shashthah prapathakah rajasuyanubrahmanam
    o shri gurubhyo namah | harih om || anuvakam anumatyadya ishtayah anumatyai purodasha nnirvapati |
    ye pratyanca shshamyaya avashiyante | tannair ritih | nairritena purvena pracarati | papmanameva nir
    nniravadayate | eka kapalo bhavati | ekadhaiva nir nniravadayate | yadahutva gar 'gniranutthaya |
    addhvaryu nca hanyat | vihi svaha ''huti njushana ityaha | ahutyaivainagm shamayati | nartimarccha
    tyaddhvaryurna yajamanah | ekolmukena yanti | taddhi nir ya~nti | esha vai nir rityai dik | svayameva
    dishi nir || svakrita irine juhoti pradare va ritya ayatanam | sva evayatane nir nniravadayate | esha
    te nir rite bhaga ityaha | nirdishatyevaina m | bhute havishmatyasityaha | bhutimevopavartate | muncemamagmhasa
    ityaha | agmhasa evaina mmuncati | angushthabhya nniravadayate | krishnam rityai rupam | rupenaiva
    nir nniravadayate | apratikshamayanti | nir hityai | svaha namo ya ida ncakareti punaretya gar hapatye
    juhoti | ahutyaiva namasyanto gar mupavartante | anumatena pracarati | iyam || iyamevasmai rajyamanumanyate
    | dhenu rdakshina | imameva dhenu nkurute | aditya shveva prajasvabhishicyate | daivishu ca manushishu
    ca | varo dakshina | varo hi rajyagm samriddhyai | agnavaishnava nnirvapati | agni || vishnuryajnah
    | devata ncava rundhe | vamano vahi dakshina | ya dvamanah | tena vaishnava ssamriddhyai | agnishomiya
    nnirvapati | agnishoma va~ indro vritramahanniti | yadagnishomiya || vartraghnameva vijityai | hiranya
    ndakshina samriddhyai | indro vritragm hatva | devatabhishcendriyena ca vya mapashyat | tanniravapat
    | tena vai sa devata nnirvapati | devata 'va rundhe | rishabho vahi dakshina || gneyah | yadrishabhah
    | tenaindra ssamriddhyai | agneyamashtakapala nnirvapati | aindra gneyo bhavati | agnirvai yajnamukham
    | yajnamukhamevardhi || indriyamevava rundhe | rishabho vahi dakshina | yadvahi | tena gneyah | yadrishabhah
    | tenaindra ssamriddhyai | yavatirvai praja oshadhina mashnann | tah para mbhavati hutadyaya | yajamanasyaparabhavaya
    || || deva va oshadhishvajimayuh | ta indragni udajayatam | tavetamai nniravrinatam | yadai ndragno
    bhavatyujjityai | dvadashakapalo bhavati | dvadasha masa va~thsarenaivasma annamavarundhe | vaishvadevashcaru
    rbhavati | vaishvadevam || prathamajo vathso dakshina samriddhyai | saumyagg nnirvapati | somo va
    akrishtapacyasya raja | akrishtapacyamevasmai svadayati | vaso dakshina | saumyagmhi devataya vasa
    ssamriddhyai | sarasvatyai caru nnirvapati | sarasvate carum | mithunamevava rundhe | mithunau gavau
    dakshina samriddhyai | eti va esha yajnamukhadriddhyah 'gnerdevataya eti | ashtavetani havigmshi bhavanti
    | ashtakshara gayatri | gayatro 'gnih | tenaiva yajnamukhadriddhya agnerdevatayai naiti || gavau dakshina
    samriddhyai shatca caturmasye vaishvadevahavimshi vaishvadevena vai prajapatih praja asrijata | ta
    ssrishta na prajayanta | so 'gnirakamayata | ahamimah prajanayeyamiti | sa prajapataye shucamadadhat
    | so prajamicchamanah | tasmadya nca praja bhunakti ya nca na | tavubhau shocatah prajamicchamanau
    | tasvagnimapya srijat | ta agniraddhyai 'dadhat | savita prajanayat | sarasvati vacamadadhat | pusha
    'poshayat | te va ete tri va~thsarasya prayujyante | ye devah pushtipatayah | sam va~thsaro vai prajapatih
    | sam prajah prajanayat | tah praja jata maruto ghnann | asmanapi na prayukshateti || mprajapatirmarutagm
    saptakapala nniravapat | tato vai prajabhyokalpata | yanmaruto nirupyate | yajnasya klriptyai maghataya
    | saptakapalo bhavati | saptagana vai marutah | ganasha evasmai visha nkalpayati | sa prajapati praja
    asrikshi | marutasta avadhishuh | kathamapara ssrijeyeti | tasya shushma anda nniravartata | tadvyudaharat
    | tadaposhayat | ta tprajayata | andasya va eta drupam | yadamiksha dyajamanah poshayati | vaishvadevyamiksha
    bhavati | vaishvadevyo vai prajah | praja evasmai prajanayati | vajinamanayati | prajasveva prajatasu
    reto dadhati | dyavaprithivya ekakapalo bhavati | praja eva prajata dyavaprithivibhya mubhayatah pari
    grihnati | devasura || mamagre yajata | maya mukhenasura ndvitiyamiti somo 'bravit | maya rajna jeshyatheti
    | ma ntritiyamiti savita | maya prasuta jeshyatheti | ma ncaturthimiti sarasvati | indriyam mpancamamiti
    pusha | maya pratishthaya jeshyatheti || 'gnina mukhenasuranajayann | somena rajna | savitra prasutah
    | sarasvatindriya madadhat | pusha pratishtha ''si t | tato vai deva vyajayanta | yadetani havigmshi
    nirupyante vijityai | nottaravedimupa vapati | pashavo va uttaravedih | ajata iva hyetar pratishthaya
    jeshyathe tyetarahi pashavah vaishvadevapargatani vishveshangani trivri rbhavati | mata pita putrah
    | tadeva ta ngarbho jarayu | tadeva ta nmithunam | tredha barhi mbhavati | traya ime lokah | eshveva
    lokeshu prati tishthati | ekadha puna mbhavati | eka iva hyayam || asminneva tena loke prati tishthati
    | prasuvo bhavanti | prathamajameva pushtimava rundhe | prathamajo vathso dakshina samriddhyai | prishadajya
    ngrihnati | pashavo vai prishadajyam | pashunevava rundhe | pancagrihita mbhavati | pankta hi pashavah
    | bahurupa || bahurupa hi pashava ssamriddhyai | agni mmanthanti | agnimukha vai prajapatih praja
    asrijata | yadagni mmanthanti | agnimukha eva ta ssrijate | nava prayaja ijyante | navanuyajah | ashtau
    havigmshi | dvavagharau | dvavajyabhagau || thsampadyante | trigmshadakshara virat | annam vi~rat
    | virajaivannadyamava rundhe | yajamano va ekakapalah | teja ajya m | yadekakapala ajyamanayati |
    yajamanameva tejasa samardhayati | yajamano va ekakapalah | pashava ajya || yadekakapala ajyamanayati
    | yajamanameva pashubhi ssamardhayati | yadalpamanaye mpashavo bhunjanta upatishtherann | ya mpashavo
    bhunjanta upatishtherann | bahvaniyavih prishtha nkuryat | bahava evaina mpashavo bhunjanta upatishthante
    | yajamano va ekakapalah | yadekakapalasyavadyet || || yajamanasyavadyet | udva madye dyajamanah |
    pra va miyeta | sakrideva hotavyah | sakridiva hi suvargo lokah | hutva 'bhi juhoti | yajamanameva
    suvargam ngamayitva | tejasa samardhayati | yajamano va ekakapalah | suvargo loka ahavaniyah || mahavaniye
    juhoti | yajamanameva suvargam ngamayati | yaddhastena juhuyat | suvarga mavaviddhyet | sruca juhoti
    | suvargasya lokasya samashtyai | ya tprampadyeta | devalokamabhi jayet | ya ddakshina pitrilokam
    | ya || rakshagmsi yajnagm hanyuh | yadudann | manushyaloka mabhijayet | pratishthito hotavyah | ekakapalam
    vai~ pratitishthanta ndyavaprithivi anu pratitishthatah | dyavaprithivi ritavah | ritun mprajah |
    tasmat pratishthito hotavyah || || vajino yajati | agnirvayu ssuryah | te vai vajinah | taneva ta
    dyajati | atho khalvahuh | chandagmsi vai vajina iti | tanyeva ta dyajati | rikhsame va indrasya hari
    somapanau || yadaprahritya paridhinjuhuyat | antaradhanabhya mprayacchet | prahritya paridhinjuhoti
    | niradhanabhyameva ghasa mprayacchati | barhishi vishincanvajina manayati | praja vai barahih | reto
    vajinam | prajasveva reto dadhati | samupahuya bhakshayanti | eta thsomapitha hyete | atho atmanneva
    reto dadhate | yajamana uttamo bhakshayati | pashavo vai vajinam | yajamana eva pashu npratishthapayanti
    || tpratishthito hotavyo varunapraghasah prajapati ssavita bhutva praja asrijata | ta enamatyamanyanta
    | ta asmadapa kramann | ta varuno bhutva praja varunenagrahayat | tah praja varunagrihitah | prajapati
    mpunarupadhavannatha micchamanah | sa etan rvaruna praghasanapashyat | tanniravapat | tairvai sa praja
    varuna praghasa nirupyante || prajanamavarunagrahaya | tasa t | savyah prasritah | sa eta ndakshinato
    vedimudahann | tato vai sa prajana ndakshinato vedimuddhanti | prajanameva ta mprasarayati | tasma
    ccaturmasyayajyamushmin ~loka ubhayabahuh | yajnabhijitagg hyasya | prithamatra dvedi asabhinnne bhavatah
    || ve~dyamuttaravedimupa vapati | pashavo va uttaravedih | pashunevava rundhe | atho yajnaparusho
    hmananyeva panca havigmshi | athaisha ai ndragno bhavati | pranapanau va etau devana m | yadindragni
    | yadai || pranapanavevava rundhe | ojo balam m | yadindragni | yadai ndragno bhavati | ojo balamevava
    rundhe | marutyamiksha bhavati | varunyamiksha | meshi ca meshashca bhavatah | mithuna eva praja varunapasha
    nmuncati | lomashau bhavato meddhyatvaya || || shamiparnanyupa vapati | ghasamevabhyamapi yacchati
    | prajapatimannadya nnopanamat | sa etena shateddhmena havisha 'nnadyama shshatani shamiparnani bhavanti
    | annadyasyava ruddhyai | saumyani vai karirani | saumya khalu va ahuti karirani bhavanti | saumyayaivahutya
    divo vrishtimava rundhe | kaya ekakapalo bhavati | prajana ya~ | pratipurusha nkarambha patrani bhavanti
    | jata eva praja varunapasha matiriktam | janishyamana eva praja varunapasha taccheshah uttarasyam
    ve~dyamanyani havigmshi sadayati | dakshinaya mmarutim | apadhuramevaina yunakti | atho oja evasamavaharati
    | tasma dbrahmanashca kshatracca visho | marutya purvaya pracarati | anritamevava yajate | varunyottaraya
    | antata eva varunamava yajate | yadevaddhvaryuh karoti || tpratiprasthata karoti | tasma ~vacayati
    | meddhyamevaina nkaroti | atho tapa evainamupa nayati | yajjaragm santa nna prabruyat | priya njnatigm
    rundhyat | asau me jara iti nirdishet | nirdishyaivainam va~runapashena grahayati || mudanayati |
    ahvataivaina patni puronuvakyamanu bruyat | nirvi ssyat | yajamano 'nvaha | atmanneva virya ndhatte
    | ubhau yajyagm saviryatvaya | yadgrame yadaranya ityaha | yathoditameva varunamava yajate | yajamanadevatyo
    va ahavaniyah || || bhratrivya devatyo dakshinah | yadahavaniye juhuyat | yajamanam va~runapashena
    grahayet | dakshine 'gnau juhoti | bhratrivyameva varunapashena grahayati | shurpena juhoti | anyameva
    varunamavayajate | shirshannadhi nidhaya juhoti | shirshata eva varunamava yajate | pratyantishthanjuhoti
    || || pratyanneva varunapasha nnirmucyate | akrankarma karmakrita ityaha | devanrina nniravadaya |
    anrina grihanupa preteti vavaitadaha | varuna grihitam dyajusha grihitasyatiricyate | tusha shca nishkasashca
    | tushai shca nishkasena cavabhrithamavaiti | varuna grihitenaiva varunamavayajate | apo || aphsu
    vai varunah | sakshadeva varunamava yajate | pratiyuto varunasya pasha ityaha | varunapashadeva nirmucyate
    | apratiksha mayanti | varunasyantar 'syedhishimahityaha | samidhaivagni nnamasyanta upayanti | tejo
    'si tejo mayi dhehityaha | teja evatmandhatte || sakamedhah devasura 'gnirabravit | mameya mprinita
    | athasuranabhi bhavishyatheti | te deva agnaye 'nikavate purodashamashtakapala thsvena bhagadheyena
    pritah | caturdha 'nika nyajanayata | tato deva abhavann | para 'surah || 'nikavate purodashamashtakapala
    nnirvapati | agnimevanikavantagg svena bhagadheyena prinati | so thsvena bhagadheyena pritah | caturdha
    'nikani janayate | asau va adityo ranikavan | tasya rashmayo 'nikani | sakagm suryenodyata nirvapati
    | sakshadevasma anikani janayati | te 'surah parajita yantah | dyavaprithivi upa || te deva marudbhyah
    santapanebhyashcaru ndyavaprithivibhya ssamatapann | yanmarudbhyah santapanebhyashcaru nnirvapati
    | dyavaprithivibhyameva tadubhayato yajamano bhratrivyan thsantapati | maddhyandine nirvapati | tar
    ntapati | carurbhavati | sarvata evainan thsantapati | te deva ndugdhe grihamedhiya || ashita evadyopavasama
    | kasya va 'hedam | kasya va shvo bhaviteti | sa shrito 'bhavat | tasyahutasya nashnann | na hi deva
    ahutasyashnanti | te 'bruvann | kasma imagm ho shyama iti | marudbhyo grihamedhibhya ityabruvann |
    ta mmarudbhyo grihamedhibhyo || tato deva abhavann | para vi~dusho marudbhyo grihamedhibhyo grihe
    juhvati | bhavatyatmana 'sya bhratrivyo bhavati | yadvai yajnasya pakatra kriyate ntat | pakatra va
    etatkriyate | yanneddhmabarhi rbhavati | na samidheni || na prayaja ijyante | nanuyajah | ya evam
    nbhavati | ajyabhagau yajati | yajnasyaiva cakshushi nantareti | maruto grihamedhino yajati | bhagadheye
    thsamardhayati | agnigg ya~jati pratishthityai | ida nto bhavati | pashavo va ida | pashushvevoparishta
    taccheshah yatpatni grihamedhiya syashniyat | grihameddhyeva sya t | vi tvasya yajna ridhyeta | yannashniyat
    | agrihamedhi syat | nasya yajno vyriddhyeta | prativesha shniyat | grihameddhyeva bhavati | nasya
    yajno vyriddhyate || || te deva grihamedhiyeneshtva | ashita abhavann | anjatabhyanjata | anu vathsa
    mprahinvann | sa deveshu lokamavittva | asuran punaragacchat | grihamedhiyeneshtva | ashita bhavanti
    | anjate vasayanti | bhratrivyayaiva ta mprahinoti | te deva grihamedhiyeneshtva | indraya nishkasa
    nnyadadhuh | asmaneva shva indro nihitabhaga upavartiteti | tanindro nihitabhaga upavartata | grihamedhiyeneshtva
    | indraya nishkasa nnidaddhyat | indra evaina nnihitabhaga upavartate | gar || bhagadheyenevainagm
    samardhayati | rishabhamahvayati | vashatkara evasya sah | atho indriyameva ta ya~jamano bhratrivyasya
    vrinkte | indro vritragm hatva | para magacchat | aparadhamiti manyamanah | so ve~dishyatiti | te
    ve~dama | asmabhyameva prathamagm havirnirupyata iti | ta enamaddhya kridann | tatkridina nmarudbhyah
    kridibhyah prathamagm havirnirupyate vijityai | sakagm suryenodyata nirvapati | etasmin vai loka indro
    vritramahan hmananyeva panca havigmshi | eta hmana aindragnah | athaisha aindrashcaru va~ etamindra
    udaharata | vritragm hatva | anyasu devatasvadhi | yadesha aindra rbhavati | uddharameva tam ya~jamana
    uddharate | anyasu prajasvadhi | vaishvakarmana ekakapalo bhavati | vishva nyeva tena karmani yajamano
    'varundhe || pitriyajnah vaishvadevena vai prajapatih praja asrijata | ta varuna rvarunapashadamuncat
    | sakamedhaih pratyasthapayat | tryambakai rudra nniravadayata | pitriyajnena suvargam shvadevena
    yajate | praja eva ta nmuncati | sakamedhaih pratishthapayati | tryambakairudra || pitriyajnena suvargam
    ngamayati | dakshinatah pracinaviti nirvapati | dakshinavriddhi pitrinam | anadritya tat | uttarata
    evopaviya nirvapet | ubhaye hi devashca pitarashcejyante | atho yadeva dakshinardhe 'dhi shrayati
    | tena dakshinavrit | somaya pitrimate purodashagm shatkapala va~thsaro vai somah pitriman || va~thsarameva
    prinati | pitribhyo bar hishadbhyo dhanah | masa vai pitaro bar hishadah | masaneva prinati | yasmin
    va ritau purushah pramiyate | so 'syamushmin ~loke bhavati | bahurupa dhana bhavanti | ahoratrana
    mabhijityai | pitribhyo 'gnishvattebhyo mantham | ardhamasa vai pitaro || ardhamasaneva prinati |
    abhivanyayai dugdhe bhavati | sa hi pitridevatya nmanushyanam | uparyardho devana m | ardhah pitrinam
    | ardha upamanthati | ardho hi pitrinam | ekayopamanthati || || eka hi pitrinam | dakshinopamanthati
    | dakshina vriddhi pitrinam | anarabhyopamanthati | taddhi pitrin ve~dimuddhanti | ubhaye hi devashca
    pitarashcejyante | catuh sraktirbhavati | sarva hyanu dishah pitarah | akhata bhavati || 'gniradhiyate
    | antato hi devana shiyaniddhma iddhma dbhavati vyavrittyai | pari shrayati | antar hito hi pitriloko
    manushyalokat | yat tpitrinam | samula rbhavati vyavrittyai | dakshina strinati | dakshina vriddhi
    pitrinam | trih paryeti | tritiye va ito loke pitarah | taneva prinati | trih punah paryeti | shatthsampadyante
    || || shadva ritavah | rituneva prinati | ya ya~jusha grihniyat | pramayuko yajamana ssyat | yanna
    grihniyat | anayatana t | tushnimeva nyasyet | na pramayuko bhavati | nanayatanah | yat || mrityuna
    yajamana mpari grihniyat | yanna pari daddhyat | rakshagmsi yajnagm hanyuh | dvau paridhi paridadhati
    | rakshasa mapahatyai | atho mrityoreva yajamana ttrini trini havig shyudahareyuh | trayastraya eshagm
    saka mpramiyerann | ekaika nyudaharanti | ekaika evaishamanvancah pramiyate | kashipu kashipavyaya
    | upabar manjanyaya | abhyanjana mabhyanjanyaya | yathabhagamevaina taccheshah agnaye devebhyah pitribhyah
    samiddhyamanayanubruhityaha | ubhaye hi devashca pitarashcejyante | ekamanvaha | eka hi pitrinam |
    triranvaha | trir m | agharavagharayati | yajna parushoranantarityai | nar vri~nite | na hotaram ||
    vri~nita | yaddhotaram | pramayuko yajamana ssyat | pramayuko hota | tasmanna vrinite | yajamanasya
    hotu rgopithaya | apabar yajati | praja vai barhih | praja eva mrityoruthsrijati | ajyabhagau yajati
    || || yajnasyaiva cakshushi nantareti | pracinaviti somam ya~jati | pitridevatya hi | esha ''hutih
    | panca kritvo 'vadyati | panca hyeta devatah | yajya devata vashatkarah | ta eva prinati | santatamava
    dyati || || ritunagm santatyai | praivaibhyah purvaya puro 'nuvakyaya ''ha | pranayati dvitiyaya |
    gamayati yajyaya | tritiye va ito loke pitarah | ahna evaina 'nuvakyaya 'tyanayati | ratriyai dvitiyaya
    | aivainan yajyaya gamayati | dakshinato 'vadaya | udannati kramati vyavrittyai || shravayati | astu
    svadheti pratyashravayati | svadha nama iti vashatkaroti | svadhakaro hi pitrinam | somamagre yajati
    | soma prayaja hi pitarah | soma va~thsaro vai somah pitriman | sam || ye vai yajvanah | te pitaro
    bar dyajati | pitrinagnishvattan yajati | ye va ayajvano grihamedhinah | te pitaro 'gnishvattah |
    taneva ta ya~jati | ya eva pitrinamagnih | tameva ta ya~jati | tadrigeva tat | etatte tata ye ca tvamanviti
    tisrishu sraktishu nidadhati | tasmada tritiya tpurushannama na grihnanti | etavanto hijyante | atra
    pitaro yathabhaga mmandaddhvamityaha | hlika hi pitarah | udanco nishkramanti | esha vai manushyana
    ddishamanu nishkramanti || mupatishthante | nyevasmai taddhnuvate | yathsatyahavaniye | athanyatra
    caranti | atamitorupatishthante | agnimevopadrashtara nniravadayante | antam ngacchanti | ya atamitorupatishthante
    | susandrisha ntva vayamityaha || || prano vai susandrik | pranamevatman dadhate | yoja nvindra te
    hari ityaha | pranameva punarayukta | akshannamimadanta hiti gar mupatishthante | akshannamimadantatha
    tvopatishthamaha iti vavaitadaha | amimadanta pitarah somya ityabhi prapadyante | amimadanta pitaro
    'bhi prapadyamaha iti vavaitadaha | apah parishincati | marjayatyevainan || || atho tarpayatyeva |
    tripyati prajaya pashubhih | ya evam hishavanuyajau yajati | praja vai barhih | praja eva mrityoruthsrijati
    | caturah prayajan yajati | dvavanuyajau | shatthsampadyante | shadva ritavah || || rituneva prinati
    | na patnyanva ya~jayanti | yatpatnyanvasita | yathsam ya~jayeyuh | pramayuka syat | tasmannanva ya~jayanti
    | patniyai gopithaya || tyanu nishkramantya tryambakahavimshi pratipurushamekakapala nnirvapati |
    jata eva praja rudranniravadayate | ekamatiriktam | janishyamana eva praja rudranniravadayate | ekakapala
    bhavanti | ekadhaiva rudra nniravadayate | nabhigharayati | yadabhigharaye t | antaravacarinagm rudra
    nkuryat | ekolmukena yanti || || taddhi rudrasya bhagadheya ya~nti | esha vai rudrasya dik | svayameva
    dishi rudra nniravadayate | rudro va apashukaya ahutyai natishthata | asau te pashuriti nirdishedya
    ndvishyat | yameva dveshti | tamasmai pashu nnirdishati | yadi na dvishyat | akhuste pashuriti bruyat
