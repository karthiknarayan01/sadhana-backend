    namah | om kopayutayai namah | om kopasamharakarinyai namah | om vajravairocanyai namah | | om vajrayai
    namah | om vajrakalpayai namah | om dakinyai namah | om dakinikarmaniratayai namah | om dakinikarmapujitayai
    namah | om dakinisanganiratayai namah | om dakinipremapuritayai namah | om khatvangadharinyai namah
