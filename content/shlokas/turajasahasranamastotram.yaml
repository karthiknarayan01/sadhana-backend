id: turajasahasranamastotram
category: sahasranama
name:
  english: turajasahasranamastotram
  devanagari: तुरजासहस्रनामस्तोत्रम्
content:
  english: om turaja tamaja tivra trividha trigunatmika | pankaja padmini padma sugandha gandhavardhini
    || 1|| rasaja mulaja dhara ghataja ghatasamsthita | ghatodari ghatakara karnika ca nikumbhika || 2||
    girija shailasamstha ca durgaja durgavasini | siddhimarga mandalini uttara tarala sama || 3|| ambashtha
    ca shironishtha manonishtha tu ghoshita | vatika malini pushpa sugandha madhupa madhuh || 4|| baladika
    balakari parthivi parthivadruma | rasadhika tu nirasa svadugra hitakankshini || 5|| vijita kulita
    shakha chaya jatilamulika | vistara sthavara maurvi jangama nigama gama || 6|| bhavani bhairavi bhutih
    pratima pranada balih | diparupa dhupagandha jvalamalaprakashini || 7|| pancanana ca timira aruna
    shyamala shubha | panapriya bhuktida ca pujadi balibhakshini || 8|| mahadevi mahamurdha dirgha caiva
    kumarika | mahodari mahanabhi baladanti mahabala || 9|| suranidra ghoranidra bhoganidra tu bhogada
    | mahanidra mohanidra sukhanidra sukhodbhava || 10|| khetahasta pashahasta gadahasta ca tomara | cakrahasta
    shankhahasta capahasta ca banabhrit || 11|| sinduravarna udita anha andhakaghatini | aparna ca vikarna
    ca para candrakala tatha || 12|| purnachinna kaumudi ca nirasta ca navagraha | akshanakta kankumabha
    kanta caiva kumarika || 13|| om klim kumaryai namah | bhranta tarangini kali kankali nalakubari |
    kapalini kakamurdha karatantri trivadini || 14|| shalika yantrini dandi nathini tumbari tatha | talanadapriya
    caiva mridangadhvanitatpara || 15|| om hram hrim hrum hraim hraum hrah | raktapa raktalipta ca raktabijanipatini
    || raktakshi raktasarva ca raktadanti sudantika || 16|| raktadanta raktabimba raktadharapravahika
    | raktamurdha raktajihva rasana bhadrakalika || 17|| bhadra subhadra rudrardra sarvabhadravinashini
    | hingula caiva hemangi hayagriva tapasvini || 18|| tarpana karshana homa sankalpa hotramantrika |
    sruva darvi ca droni ca svaha kalashavedika || 19|| ahutishca samiddarbha sruva pingalalocana | prakrishta
    phalada shanta pita vedodaya tatha || 20|| aparna suphala yajna yajnangaphaladayini | vishvamata vishvabala
    vishvagarbha pravartika || 21|| vishvodari vishvamukhi vishvasambhutikarini | vishveshvari vishvadhara
    marudbhuta ca sarpini || 22|| prithvidhara padmini ca nagi caiva tathoraga | pakshini malayavasa dhatturakusumapriya
    || 23|| salilarghyapriya shaila linganishtha ca ghantika | shikha diksha ca tulasi sevasamyamatatpara
    || 24|| nivritta shayana suptasau suptikajanapriya | vrittamala ca niyama yajniya caiva nandini ||
    25|| narayani tathamogha prakata taruni priya | samudra sangama purna kallola urmimalini || 26|| mumursha
    rosharushta ca jugupsitavirodhini | indira idita indra nuta nilambara tatha || 27|| mahakrishna krishnavarna
    krishnasruk krishnavasini | shuklambara koticandra martanda agniruktatha || 28|| ratnadanti ratnanasa
    ratnamalavibhushana | ratnambara ratnakancu ratnakshi ratnakundala || 29|| ratnahasta ratnanakha ratnakankanamandita
    | ratnachatra ratnavarna ratnesha ratnahelika || 30|| ratnasana ratnarashi ratnoshthi ratnajihvika
    | jagatkartri jagatkarya jagadvasa jagannidhih || 31|| jagatprana jagaddrashta jagajjihva jagadrasa
    | jagaccakshurjagatprana jagacchrotra jaganmukhi || 32|| jagadvandya jagadrupa jagatsvapna ca jagriti
    | jagacchatra jagaddhatri jagadbhartri jagatpita || 33|| jagatpatni jaganmata jagadbhrata tatha jagat
    | jagajjaya jagadvandya jagaddharmi jaganmayi || 34|| jagaddhatri jagatprana jagadyonirjaganmayi |
    jagatsthitirjagatsargo jagatsarva jaganmayi || 35|| jagacchaya jayanti ca jaganmoha ca jagriti | sarvastambhi
    mahamaya jagaddiksha tatha jaya || 36|| bhaktaikalabhya dvividha trividha ca caturvidha | indrakshi
    pancarupa ca sahasrarupadharini || 37|| rudrakshi kamalakshi ca timira dipika tatha | vartirupa hada
    taila prakhya nirvanika shiva || 38|| muladrivasini caiva varati mulika para | om hram hrim hrum mahakalyai
    namah | mulajvala mulamantra madhukaitabhaghatini || 39|| saptajvala mahajvala tatha vai jvalamalini
    | navakumbha navarucih kamajvala navanana || 40|| garbhajvala tatha bala cakshurbala navambara | navabhutirnavabala
    navarakta navavrita || 41|| navakhanda tatha desha navadanda navakshara | navajangha suvirya ca navadurga
    ca jagratih || 42|| navamarga ca navami navasasya naveshvari | navarupa navakala navanadi navanana
    || 43|| navakrida navavidha navayoginika tatha | navami mangala caiva vijaya dashami tatha || 44||
    om aim hrim klim trimurtyatmikayai namah | yamya digvasini caiva vidisha ca disha tatha | kulupadyantariksha
    ca tatha vai dakshinamukhi || 45|| dadhivarna ramavarada dashasyavamshabhedini | vindhyasini siddhihasta
    annapurna ca sundari || 46|| ashtaksharaparananda camunda mundavahini | pitambara diptihasta mangala
    mangalodaya || 47|| kalanasha karmanasha kalinasha ca kalika | enarupa vrishashva ca aja kroda ca
    kukkuti || 48|| sukantha kokila kali mukhari vaikhari mrigi | mayuri makshini gridhri balaka ca karalini
    || 49|| jalanishtha kakajangha nirguna guruvandita | bhramari ambika manda adanta ca sudantika ||
    50|| uttunga kalasha shoka caturdanta bhushundini | urdhvanetra urdhvamukhi tejishtha tratika ravih
    || 51|| rathini rathasamstha ca cakrika rathavahini | bhramita saptatunda ca bhima hayamukhi tatha
    || 52|| prathika prakhura anka dakshina paridakshina | racana rocana rama ramita shamita shama ||
    53|| lata ca lalita lakshmih kamita kamana tatha | agnidhara saptadhara bhagadhara tridha smrita ||
    54|| ashtaprakrityashtabhuja varada tvashtanayaka | ardhadhara muladhara dashadhara tathaiva ca ||
    55|| gadadi jalada caiva nigada marana tatha | avilamba tatha vagmi prakhura vagvivadini || 56|| uddiyamana
    urdhvakshi budbuda barbarambara | dhurnakshi patala kopa uttirna ullasanana || 57|| kallola unnata
    bala shubha kallolamalini | upalaksha umalaksha pariksha rakshika tatha || 58|| upendra indravarada
    mahakali nishacari | papaha papanasha ca brahmaghni shapamocani || 59|| sharva trishna ca ucchishta
    candali parighayudha | om aim hrim shrim ucchishtacandalinyai namah | aparna parnavalita patih patitapavani
    || 60|| mahadvandva mahavadi ekavira jagajjaya | pancali pancapancali prapanci ca pracodayat || 61||
    tripadi vedamata ca triguna gunashambhavi | omkari vedika vaca hrinkari sakalagama || 62|| trinkari
    tripura puja shrinkari sarvasundari | klinkari kalika keshi ghrinkari ghatavasini || 63|| brinkari
    bagala bala phrinkari phanibhushana | bhrinkari bhairavi bhutirbhagadatri bhaga tatha || 64|| jrinkari
    jalajihva ca jrimbhika jalayogini | digambari jatajutih kumari pingakeshini || 65|| kanya prakanya
    kandarpa vedana valmiki guna | caturbhuja caturvasa carcika caturanana || 66|| arcita carcika citra
    cakrastha cakrarupini | avahya ca visarga ca lingarupa visarjani || 67|| linganishtha lingasevya mathita
    lingasevaya | karmarekha candrarekha citrarekha vasantika || 68|| sadodaya talavasa kharjura talamurdhnika
    | khandajangha ritupada angushtha dridhabandhini || 69|| om shrim klim siddhipradayai namah | prabodha
    grinthika gadha uhavitarkavadini | vinayaki vinamra ca prasiddha vijaya jaya || 70|| lambodari shikhordhva
    ca citravastravalambini | shodashi narasimhi ca shitala parishitala || 71|| guha kirata kadali kadalivanavasini
    | mahavyaghravararoha dhanurbanadharadhara || 72|| lambini ca vipasha ca kshudha sandeshika tatha
    | vilasini vipulika kalika ca praveshika || 73|| vanika vanavasa ca barbara kharparasana | maunji
    bhujangini cara prabhughanta jalajara || 74| balajara yogaveni sukeshi venika tatha | rambha prakhanda
    khamvasi svagata sthanadayaka || 75|| om hrim shrim sarasvatyai namah | shyama prasanna sumukhi varmika
    karnika tatha | shucika mugdhika gadha bhogada subhaga tatha || 76|| bhuktida muktida devi riddhida
    sukhadayini | siddhida buddhida mata varmini phaladayini || 77|| kshurika jirika jangha anika gudhakhadgini
    | dhvajini vajini vaji pataka varmini tatha || 78|| hastini kalika bana atrija vajradharini | chatrini
    ranika rosha ajita dalabhajini || 79|| vagdevi chinnamurdha ca gudhendra pathika tatha | lolika dhurnika
    dhurna svashika nishvasa vyatha || 80|| haha ca pariha caiva vashyaka nirbhaya bhaya | varmini parivira
    ca utkantha mukhamandita || 81|| kotini dalini dirgha dhusura balarakshasi | om hrim kraum bhraum
    aghorarupinyai namah | navika chidrika kshepa durgandha ghoravasini || 82|| aghora parighora ca mahaghora
    tighasmara | suvirya ghoramantra ca kiriti ghorabhakshini || 83|| purnavaktra purnamukhi parama parameshvari
    | maulini bimbini bimba tarshini turaja trisha || 84|| tritiya caturiya ca turaja bhavatarini | sudarsha
    taruni tara carita caiva daityaja || 85|| dakshina karnika kali kankali nalakubari | om klim vagishvaryai
    namah | nairitya nalika nitya naimitya nimisha nisha || 86|| icchapurna vindhyaka ca hingula pashcima
    para | vayavya varada vandya vrindika vrindavardhini || 87|| uccata uttara candi nilakanthi jalashraya
    | dakshina caiva kamakshi kamana bhuvaneshvari || 88|| prakasha pingala purna shrih shrimbijakari
    tatha | agnika rucika vaca ajna prajna prasadada || 89|| cakama vihanga manda rajaka rajjuka raja
    | gauri ca gomaya geya matangi mahishahali || 90|| sadatushta sadapushta sandishta ca sadashiva |
    tilaka rocana vriksha gambija tripura tatha || 91|| iha ca kalparacana yamuna girivasini | durlabha'tiduraradhya
    durgama gaganeshvari || 92|| aranya pariranya ca samyamya samyama tatha | kamala kulaja caiva lavana
    suraghatini || 93|| dadhija kalpasamstha ca karmaja phaladayini | kamaja kelija keshi karsha karburajalija
    || 94|| girija garvagotra ca akula kulaja tatha | dinaja dinamani ca vedaja vedasambhrita || 95||
    krodhaja kutaja dhara parama balagarvita | shanta bhranta diganta ca guruja chatravasini || 96|| bhayanta
    vibhrama bhranta pashupala ca shurini | bhusura bhasuri caiva bhagnadaitya chindambhida || 97|| krodha
    krodhamukhi damshtri vajradanti sudantika | sasyacara jala megha pravaha suravrikshaja || 98|| brahmishta
    brahmaja brahmi catuhshirsha caturmukhi | ciradvaita dvaitarupa advaitapratipadini || 99|| vedanta
    vedavandya ca anandi nandadanava | puruchaya makha dhurya durjaya papaha tatha || 100|| bhitirgatirjagarishta
    harmyakshi shuklaharmini | meruja merusamstha ca kallari kalikalpana || 101|| kiratini bhillirupa
    pracanda candavasini | atyantagunayukta ca candrasya candravasini || 102|| calacalapada sha
  devanagari: ॐ तुरजा तमजा तीव्रा त्रिविधा त्रिगुणात्मिका । पङ्कजा पद्मिनी पद्मा सुगन्धा गन्धवर्धिनी ॥
    १॥ रसजा मूलजा धारा घटजा घटसंस्थिता । घटोदरी घटाकारा कर्णिका च निकुम्भिका ॥ २॥ गिरिजा शैलसंस्था च दुर्गजा
    दुर्गवासिनी । सिद्धिमार्गा मण्डलिनी उत्तरा तरला समा ॥ ३॥ अम्बष्ठा च शिरोनिष्ठा मनोनिष्ठा तु घोषिता
    । वाटिका मालिनि पुष्पा सुगन्धा मधुपा मधूः ॥ ४॥ बलादिका बलकरी पार्थिवी पार्थिवद्रुमा । रसाधिका तु निरसा
    स्वादुग्रा हितकाङ्क्षिणी ॥ ५॥ विजिता कुलिता शाखा छाया जटिलमूलिका । विस्तारा स्थावरा मौर्वी जङ्गमा
    निगमा गमा ॥ ६॥ भवानी भैरवी भूतिः प्रतिमा प्राणदा बलिः । दीपरूपा धूपगन्धा ज्वालामालाप्रकाशिनी ॥ ७॥
    पञ्चानना च तिमिरा अरुणा श्यामला शुभा । पानप्रिया भुक्तिदा च पूजादि बलिभक्षिणी ॥ ८॥ महादेवी महामूर्धा
    दीर्घा चैव कुमारिका । महोदरी महानाभी बलदन्ती महाबला ॥ ९॥ सुरनिद्रा घोरनिद्रा भोगनिद्रा तु भोगदा ।
    महानिद्रा मोहनिद्रा सुखनिद्रा सुखोद्भवा ॥ १०॥ खेटहस्ता पाशहस्ता गदाहस्ता च तोमरा । चक्रहस्ता शङ्खहस्ता
    चापहस्ता च बाणभृत् ॥ ११॥ सिन्दूरवर्णा उदिता अन्हा अन्धकघातिनी । अपर्णा च विकर्णा च परा चन्द्रकला तथा
    ॥ १२॥ पूर्णछिन्ना कौमुदी च निरस्ता च नवग्रहा । अक्षानक्ता कङ्कुमाभा कान्ता चैव कुमारिका ॥ १३॥ ॐ क्लीं
    कुमार्यै नमः । भ्रान्ता तरङ्गिणी काली कङ्काली नलकूबरी । कपालिनी काकमूर्धा करतन्त्री त्रिवादिनी ॥ १४॥
    शालिका यन्त्रिणी दण्डी नाठिनी तुम्बरी तथा । तालनादप्रिया चैव मृदङ्गध्वनितत्परा ॥ १५॥ ॐ ह्रां ह्रीं
    ह्रूं ह्रैं ह्रौं ह्रः । रक्तपा रक्तलिप्ता च रक्तबीजनिपातिनी ॥ रक्ताक्षी रक्तसर्वा च रक्तदन्ती सुदन्तिका
    ॥ १६॥ रक्तदन्ता रक्तबिम्बा रक्तधाराप्रवाहिका । रक्तमूर्धा रक्तजिह्वा रसना भद्रकालिका ॥ १७॥ भद्रा सुभद्रा
    रुद्रार्द्रा सर्वाभद्रविनाशिनी । हिङ्गुला चैव हेमाङ्गी हयग्रीवा तपस्विनी ॥ १८॥ तर्पणा कर्षणा होमा
    सङ्कल्पा होत्रमन्त्रिका । स्रुवा दर्वी च द्रोणी च स्वाहा कलशवेदिका ॥ १९॥ आहुतिश्च समिद्दर्भा स्रुवा
    पिङ्गललोचना । प्रकृष्टा फलदा शान्ता पिता वेदोदया तथा ॥ २०॥ अपर्णा सुफला यज्ञा यज्ञाङ्गफलदायिनी । विश्वमाता
    विश्वबला विश्वगर्भा प्रवर्तिका ॥ २१॥ विश्वोदरी विश्वमुखी विश्वसम्भूतिकारिणी । विश्वेश्वरी विश्वधरा
    मरुद्भूता च सर्पिणी ॥ २२॥ पृथ्वीधरा पद्मिनी च नागी चैव तथोरगा । पक्षिणी मलयावासा धत्तूरकुसुमप्रिया
    ॥ २३॥ सलिलार्घ्यप्रिया शैला लिङ्गनिष्ठा च घण्टिका । शिखा दीक्षा च तुलसी सेवासंयमतत्परा ॥ २४॥ निवृत्ता
    शयना सुप्तासौ सुप्तिकजनप्रिया । वृत्तमाला च नियमा यज्ञिया चैव नन्दिनी ॥ २५॥ नारायणी तथामोघा प्रकटा
    तरुणी प्रिया । समुद्रा सङ्गमा पूर्णा कल्लोला ऊर्मिमालिनी ॥ २६॥ मुमूर्षा रोषरुष्टा च जुगुप्सितविरोधिनी
    । इन्दिरा ईडिता इन्द्रा नुता निलाम्बरा तथा ॥ २७॥ महाकृष्णा कृष्णवर्णा कृष्णस्रुक् कृष्णवासिनी । शुक्लाम्बरा
    कोटिचन्द्रा मार्तण्डा अग्निरुक्तथा ॥ २८॥ रत्नदन्ती रत्ननासा रत्नमालाविभूषणा । रत्नाम्बरा रत्नकञ्चु
    रत्नाक्षी रत्नकुण्डला ॥ २९॥ रत्नहस्ता रत्ननखा रत्नकङ्कणमण्डिता । रत्नछत्रा रत्नवर्णा रत्नेशा रत्नहेलिका
    ॥ ३०॥ रत्नासना रत्नराशी रत्नोष्ठी रत्नजिह्वीका । जगत्कर्त्री जगत्कार्या जगद्वासा जगन्निधिः ॥ ३१॥ जगत्प्राणा
    जगद्द्रष्टा जगज्जिह्वा जगद्रसा । जगच्चक्षुर्जगत्प्राणा जगच्छ्रोत्रा जगन्मुखी ॥ ३२॥ जगद्वन्द्या जगद्रूपा
    जगत्स्वप्ना च जागृती । जगच्छत्रा जगद्धात्री जगद्भर्त्री जगत्पिता ॥ ३३॥ जगत्पत्नी जगन्माता जगद्भ्राता
    तथा जगत् । जगज्जाया जगद्वन्द्या जगद्धर्मी जगन्मयी ॥ ३४॥ जगद्धात्री जगत्प्राणा जगद्योनिर्जगन्मयी ।
    जगत्स्थितिर्जगत्सर्गो जगत्सर्वा जगन्मयी ॥ ३५॥ जगच्छाया जयन्ती च जगन्मोहा च जागृती । सर्वस्तम्भी महामाया
    जगद्दीक्षा तथा जया ॥ ३६॥ भक्तैकलभ्या द्विविधा त्रिविधा च चतुर्विधा । इन्द्राक्षी पञ्चरूपा च सहस्ररूपधारिणी
    ॥ ३७॥ रुद्राक्षी कमलाक्षी च तिमिरा दीपिका तथा । वर्तिरूपा हडा तैला प्रख्या निर्वाणिका शिवा ॥ ३८॥ मूलाद्रिवासिनी
    चैव वराटी मूलिका परा । ॐ ह्रां ह्रीं ह्रूं महाकाल्यै नमः । मूलज्वाला मूलमन्त्रा मधुकैटभघातिनी ॥ ३९॥
    सप्तज्वाला महाज्वाला तथा वै ज्वालमालिनी । नवकुम्भा नवरुचिः कामज्वाला नवानना ॥ ४०॥ गर्भज्वाला तथा बाला
    चक्षुर्बाला नवाम्बरा । नवभूतिर्नवबला नवरक्ता नवावृता ॥ ४१॥ नवखण्डा तथा देशा नवदण्डा नवाक्षरा । नवजङ्घा
    सुवीर्या च नवदुर्गा च जाग्रतिः ॥ ४२॥ नवमार्गा च नवमी नवसस्या नवेश्वरी । नवरूपा नवकला नवनाडी नवानना
    ॥ ४३॥ नवक्रीडा नवविधा नवयोगिनिका तथा । नवमी मङ्गला चैव विजया दशमी तथा ॥ ४४॥ ॐ ऐं ह्रीं क्लीं त्रिमूर्त्यात्मिकायै
    नमः । याम्या दिग्वासिनी चैव विदिशा च दिशा तथा । कुलुपाद्यन्तरिक्षा च तथा वै दक्षिणामुखी ॥ ४५॥ दधिवर्णा
    रामवरदा दशास्यवंशभेदिनी । विन्ध्यासिनी सिद्धिहस्ता अन्नपूर्णा च सुन्दरी ॥ ४६॥ अष्टाक्षरपरानन्दा चामुण्डा
    मुण्डवाहिनी । पीताम्बरा दीप्तिहस्ता मङ्गला मङ्गलोदया ॥ ४७॥ कालनाशा कर्मनाशा कलिनाशा च कालिका । एणरूपा
    वृषाश्वा च अजा क्रोडा च कुक्कुटी ॥ ४८॥ सुकण्ठा कोकिला काली मुखरी वैखरी मृगी । मयूरी माक्षिणी गृध्री
    बलाका च करालिनी ॥ ४९॥ जलनिष्ठा काकजङ्घा निर्गुणा गुरुवन्दिता । भ्रामरी अम्बिका मन्दा अदन्ता च सुदन्तिका
    ॥ ५०॥ उत्तुङ्गा कलशा शोका चतुर्दन्ता भुशुण्डिनी । ऊर्ध्वनेत्रा ऊर्ध्वमुखी तेजिष्ठा त्राटिका रविः ॥
    ५१॥ रथिनी रथसंस्था च चक्रिका रथवाहिनी । भ्रामिता सप्ततुण्डा च भीमा हयमुखी तथा ॥ ५२॥ प्रथिका प्रखुरा
    अङ्का दक्षिणा परिदक्षिणा । रचना रोचना रामा रमिता शमिता शमा ॥ ५३॥ लता च ललिता लक्ष्मीः कामिता कामना
    तथा । अग्निधारा सप्तधारा भगधारा त्रिधा स्मृता ॥ ५४॥ अष्टप्रकृत्यष्टभुजा वरदा त्वष्टनायका । अर्धधारा
    मूलधारा दशधारा तथैव च ॥ ५५॥ गदादि जलदा चैव निगडा मारणा तथा । अविलम्बा तथा वाग्मी प्राखुरा वाग्विवादिनी
    ॥ ५६॥ उड्डीयमाना ऊर्ध्वाक्षी बुद्बुदा बर्बराम्बरा । धूर्णाक्षी पटला कोपा उत्तीर्णा उल्लसानना ॥ ५७॥
    कल्लोला उन्नता बाला शुभा कल्लोलमालिनी । उपलक्षा उमालक्षा परिक्षा रक्षिका तथा ॥ ५८॥ उपेन्द्रा इन्द्रवरदा
    महाकाली निशाचरी । पापहा पापनाशा च ब्रह्मघ्नी शापमोचनी ॥ ५९॥ शर्वा तृष्णा च उच्छिष्टा चाण्डाली परिघायुधा
    । ॐ ऐं ह्रीं श्रीं उच्छिष्टचाण्डालिन्यै नमः । अपर्णा पर्णवलिता पतिः पतितपावनी ॥ ६०॥ महाद्वन्द्वा महावादी
    एकवीरा जगज्जया । पञ्चाली पञ्चपाञ्चाली प्रपञ्ची च प्रचोदयात् ॥ ६१॥ त्रिपदी वेदमाता च त्रिगुणा गुणशाम्भवी
    । ॐकारी वेदिका वाचा ह्रीङ्कारी सकलागमा ॥ ६२॥ त्रीङ्कारी त्रिपुरा पूजा श्रीङ्कारी सर्वसुन्दरी । क्लीङ्कारी
    कालिका केशी घ्रीङ्कारी घटवासिनी ॥ ६३॥ ब्रीङ्कारी बगला बाला फ्रीङ्कारी फणिभूषणा । भ्रीङ्कारी भैरवी
    भूतिर्भगदात्री भगा तथा ॥ ६४॥ ज्रीङ्कारी जलजिह्वा च जृम्भिका जलयोगिनी । दिगम्बरी जटाजूटिः कुमारी पिङ्गकेशिनी
    ॥ ६५॥ कन्या प्रकन्या कन्दर्पा वेदना वाल्मिकी गुणा । चतुर्भुजा चतुर्वासा चर्चिका चतुरानना ॥ ६६॥ अर्चिता
    चर्चिका चित्रा चक्रस्था चक्ररूपिणी । आवाह्या च विसर्गा च लिङ्गरूपा विसर्जनी ॥ ६७॥ लिङ्गनिष्ठा लिङ्गसेव्या
    मथिता लिङ्गसेवया । कर्मरेखा चन्द्ररेखा चित्ररेखा वसन्तिका ॥ ६८॥ सदोदया तालवासा खर्जूरा तालमूर्ध्निका
    । खण्डजङ्घा ऋतुपदा अङ्गुष्ठा दृढबन्धिनी ॥ ६९॥ ॐ श्रीं क्लीं सिद्धिप्रदायै नमः । प्रबोधा गृन्थिका गाधा
    ऊहावितर्कवादिनी । विनायकी विनम्रा च प्रसिद्धा विजया जया ॥ ७०॥ लम्बोदरी शिखोर्ध्वा च चित्रवस्त्रावलम्बिनी
    । षोडशी नारसिंही च शीतला परिशीतला ॥ ७१॥ गुहा किराता कदली कदलीवनवासिनी । महाव्याघ्रवरारोहा धनुर्बाणधराधरा
    ॥ ७२॥ लम्बिनी च विपाशा च क्षुधा सन्देशिका तथा । विलासिनी विपुलिका कालिका च प्रवेशिका ॥ ७३॥ वाणिका
    वनवासा च बर्बरा खर्परासना । मौञ्जी भुजङ्गिनी चारा प्रभुघण्टा जलाजरा ॥ ७४। बालाजरा योगवेणी सुकेशी वेणिका
    तथा । रम्भा प्रखण्डा खंवासी स्वागता स्थानदायका ॥ ७५॥ ॐ ह्रीं श्रीं सरस्वत्यै नमः । श्यामा प्रसन्ना
    सुमुखी वर्मिका कर्णिका तथा । शुचिका मुग्धिका गाधा भोगदा सुभगा तथा ॥ ७६॥ भुक्तिदा मुक्तिदा देवी ऋद्धिदा
    सुखदायिनी । सिद्धिदा बुद्धिदा माता वर्मिणी फलदायिनी ॥ ७७॥ क्षुरिका जिरिका जङ्घा आणिका गूढखड्गिनी ।
    ध्वजिनी वाजिनी वाजी पताका वर्मिणी तथा ॥ ७८॥ हस्तिनी कालिका बाणा अत्रिजा वज्रधारिणी । छत्रिणी रणिका
    रोषा अजिता दलभाजिनी ॥ ७९॥ वाग्देवी छिन्नमूर्धा च गुढेन्द्रा पथिका तथा । लोलिका धूर्णिका धूर्णा स्वशिका
    निश्वासा व्यथा ॥ ८०॥ हाहा च परिहा चैव वश्यका निर्भया भया । वर्मिणी परिवीरा च उत्कण्ठा मुखमण्डिता ॥
    ८१॥ कोटिनी दलिनी दीर्घा धूसुरा बलराक्षसी । ॐ ह्रीं क्रौं भ्रौं अघोररूपिण्यै नमः । नाविका छिद्रिका
    क्षेपा दुर्गन्धा घोरवासिनी ॥ ८२॥ अघोरा परिघोरा च महाघोरा तिघस्मरा । सुवीर्या घोरमन्त्रा च किरीटी घोरभक्षिणी
    ॥ ८३॥ पूर्णवक्त्रा पूर्णमुखी परमा परमेश्वरी । मौलिनी बिम्बिनी बिम्बा तर्षिणी तुरजा तृषा ॥ ८४॥ तृतीया
    चतुरीया च तुरजा भवतारिणी । सुदर्शा तरुणी तारा चरिता चैव दैत्यजा ॥ ८५॥ दक्षिणा कर्णिका काली कङ्काली
    नलकूबरी । ॐ क्लीं वागीश्वर्यै नमः । नैऋत्या नलिका नित्या नैमित्या निमिषा निशा ॥ ८६॥ इच्छापूर्णा विन्ध्यका
    च हिङ्गुला पाश्चिमा परा । वायव्या वरदा वन्द्या वृन्दिका वृन्दवर्धिनी ॥ ८७॥ उच्चाटा उत्तरा चण्डी नीलकण्ठी
    जलाश्रया । दक्षिणा चैव कामाक्षी कामना भुवनेश्वरी ॥ ८८॥ प्रकाशा पिङ्गला पूर्णा श्रीः श्रीम्बीजकरी तथा
    । अग्निका रुचिका वाचा अज्ञा प्रज्ञा प्रसाददा ॥ ८९॥ चकमा विहङ्गा माण्डा राजका रज्जुका रजा । गौरी च
    गोमया गेया मातङ्गी महिषाहली ॥ ९०॥ सदातुष्टा सदापुष्टा सन्दिष्टा च सदाशिवा । तिलका रोचना वृक्षा गम्बीजा
    त्रिपुरा तथा ॥ ९१॥ ईहा च कल्परचना यमुना गिरिवासिनी । दुर्लभाऽतिदुराराध्या दुर्गमा गगनेश्वरी ॥ ९२॥
    अरण्या परिरण्या च संयम्या संयमा तथा । कमला कुलजा चैव लवणा सुरघातिनी ॥ ९३॥ दधिजा कल्पसंस्था च कर्मजा
    फलदायिनी । कामजा केलिजा केशी कर्षा कर्बुरजालिजा ॥ ९४॥ गिरिजा गर्वगोत्रा च अकुला कुलजा तथा । दिनजा
    दिनमानी च वेदजा वेदसम्भृता ॥ ९५॥ क्रोधजा कुटजा धारा परमा बलगर्विता । शान्ता भ्रान्ता दिगन्ता च गुरुजा
    छत्रवासिनी ॥ ९६॥ भयान्ता विभ्रमा भ्रान्ता पशुपाला च शूरिणी । भूसुरा भासुरी चैव भग्नदैत्या छिन्दाम्भिदा
    ॥ ९७॥ क्रोधा क्रोधमुखी दंष्ट्री वज्रदन्ती सुदन्तिका । सस्याचरा जला मेघा प्रवाहा सुरवृक्षजा ॥ ९८॥ ब्रह्मिष्टा
    ब्रह्मजा ब्राह्मी चतुःशीर्षा चतुर्मुखी । चिरद्वैता द्वैतरूपा अद्वैतप्रतिपादिनी ॥ ९९॥ वेदान्ता वेदवन्द्या
    च आनन्दी नन्ददानवा । पुरुछाया मखा धुर्या दुर्जया पापहा तथा ॥ १००॥ भीतिर्गतिर्जागरिष्टा हर्म्याक्षी
    शुक्लहर्मिणी । मेरुजा मेरूसंस्था च कल्लारी कलिकल्पना ॥ १०१॥ किरातिनी भिल्लिरूपा प्रचण्डा चण्डवासिनी
    । अत्यन्तगुणयुक्ता च चन्द्रास्या चन्द्रवासिनी ॥ १०२॥ चलाचलपदा श
