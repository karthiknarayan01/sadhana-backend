id: tiruppavai
category: stotram
name:
  english: Tiruppavai
content:
  english: dhyanam nilatunga stanagiritati suptamudbodhya krishnam pararthyam svam shrutishatashira ssiddhamadhyapayanti
    | svocchishtayam sraji nigalitam ya balatkritya bhunkte goda tasyai nama idamidam bhuya evastu bhuyah
    || annavayal putuvai kkòtuttalai ccòllu cuti kkòtutta cutarkkòtiye natini venkatavaṟkènnai viti ènṟa
    immarram nam katava vanname nalku ttinkal mati niṟainta nannalal ppotuvir potumino ner ilaiyir kur
    vel kòtun tòlilan nantakopan kumaran erarnta kanni yacotai ilam cinkam matiyam pol mukattan narayanane
    namakke paṟai taruvan ppatintelor èm pavay || pashuram vaiyattu valvirkal cèyyum kiricaikal keliro
    nèy unnom pal unnom natkale nir ati maiyittèlutom malarittu nam mutiyom cèyyatana cèyyom tikkuṟalai
    cènṟotom aiyamum piccaiyum antanaiyum kai katti uyyumaṟènni ukantelor èm pavay || pashuram onki ulakalanta
    uttaman per pati nankal nam pavaikku ccarri nir atinal tinkinṟi natèllam tinkal mummari pèytu onku
    pèṟuncènnèl utu kayal ukala punkuvalai ppotil pòṟivantu kan patuppa tenkate pukkiruntu cirtta mulai
    parri vanka kutam niṟaikkum vallal pèrum pacukkal ninkata cèlvam niṟaintelor èm pavay || pashuram
    ali malaikkanna ali ul pukku mukantu kòtartteṟi uli mutalvan uruvam pol mèy kaṟuttu paliyan tolutai
    ppaṟpanapan kaiyil ali pol minni valampuri pol ninṟatirntu talate carnkam utaitta caramalai pol vala
    ulakinil pèytitay nankalum markali nirata makilntelor èm pavay || pashuram mayanai mannu vatamaturai
    maintanai tuya pèrunir yamunai ttuṟaivanai ayar kulattinil tonṟum ani vilakkai tayai kkutal vilakkam
    cèyta tamotaranai tuyomay vantu nam tumalar tuvi ttòlutu vayinal pati manattinal cintikka poya pilaiyum
    pukutaruvan ninṟanavum tiyinil tucakum cèppelor èm pavay || pashuram pullum cilampina kan pullaraiyan
    koyil vèllai vili cankin per aravam kettilaiyo èluntiray peymulai nancuntu kalla ccakatam kalakkaliya
    kkalocci vèllattaravil tuyil amarnta vittinai ullattu kkòntu munivarkalum yokikalum mèlla èluntari
    ènṟa per aravam ullam pukuntu kulirntelor èm pavay || pashuram kicu kicènṟènkum anaiccattan kalantu
    pecina peccaravam kettilaiyo pey ppènne kacum piṟappum kala kalappa kkai perttu vaca naṟum kulal aycciyar
    mattinal ocai patutta tayir aravam kettilaiyo nayaka ppèn pillay kecavanai ppatavum ni kette kitattiyo
    tiṟavelor èm pavay || pashuram kilvanam vèllènṟèrumai ciṟu vitu meyvan parantana kan mikkulla pillaikalum
    povan pokinṟarai ppokamal kattu unnai kkuvuvan vantu ninṟom kotu kalam utaiya pavay èluntiray pati
    ppaṟai kòntu mavay pilantanai mallarai mattiya tevatitevanai ccènṟu nam cevittal ava ènṟarayntarulelor
    èm pavay || pashuram tumani matattu ccurrum vilakkèriya tupam kamala ttuyil anaimel kan valarum mani
    kkatavam tal tiṟavay un makal tan umaiyo anṟi ccèvito anantalo ema ppèrun tuyil mantira ppattalo mamayan
    matavan vaikuntan ènṟènṟu namam palavum navinṟelor èm pavay || pashuram norru ccuvarkkam pukukinṟa
    ammanay marramum tararo vacal tiṟavatar narra ttulay muti narayanan nammal porra ppaṟai tarum punniyanal
    pantòru nal kurrattin vay vilnta kumpakarananum torrum unakke pèrun tuyil tan tantano arra anantal
    utaiyay terramay vantu tiṟavelor èm pavay || pashuram karru kkaṟavai kkanankal pala kaṟantu cèrrar
    tiṟal aliya ccènṟu cèru ccèyyum kurram ònṟillata kovalar tam pòṟ kòtiye purraravalkul punamayile currattu
    ttolimar èllarum vantu nin murram pukuntu mukilvannan per pata cirrate pecate cèlva ppèntatti ni èrrukkuṟankum
    pòrulelor èm pavay || pashuram kanaittilam karrèrumai kanṟukkiranki ninaittu mulai valiye ninṟu pal
    cora nanaittillam ceṟakkum naṟcèlvan tankay pani ttalai vila nin vacaṟ katai parri cinattinal tèn
    ilankai kkomanai ccèrra manattukkiniyanai ppatavum ni vay tiṟavay ini ttan èluntiray itènna per uṟakkam
    anaittillattarum aṟintelor èm pavay || pashuram pullin vay kintanai ppòlla arakkanai killi kkalaintanai
    kkirttimai pati ppoy pillaikal èllarum pavai kkalam pukkar vèlli èluntu viyalam uṟankirru pullum cilampina
    kan potari kkanninay kulla kkulira kkutaintu nir atate palli kkitattiyo pavay kallam tavirntu kalantelor
    èm pavay || pashuram unkal pulaikkatai ttottattu vaviyul cènkalunir vay nèkilntampal vay kumpina kan
    cènkal pòti kkurai vènpaṟ tavattavar tankal tirukkoyiṟ cankituvan potantar ènkalai munnam èluppuvan
    vay pecum èluntiray nanatay cankòtu cakkaram entum tatakkaiyan pankaya kkannanai ppatelor èm pavay
    || cil ènṟalaiyenmin nankaimir vallai un katturaikal pante un vayaṟitum vallirkal ninkale nane tan
    ayituka òllai ni potay unakkènna veṟutaiyai èllarum pontaro pontar pontènnikkòl vallanai kònṟanai
    marrarai marralikka vallanai mayanai ppatelor èm pavay || pashuram nayakanay ninṟa nantakopanutaiya
    koyil kappane kòti ttonṟum torana vayil kappane manikkatavam tal tiṟavay ayar ciṟumiyaromukku aṟai
    paṟai mayan manivannan nènnale vay nerntan tuyomay vantom tuyil èla ppatuvan vayal munnam munnam marrate
    amma ni neya nilai kkatavam nikkelor èm pavay || pashuram amparame tannire coṟe aṟam cèyyum èm pèruman
    nantakopala kòmpanarkkèllam kòlunte èm pèrumatti yacotay amparam utaṟuttonki ulakalanta cèm pòṟ kalal
    ati ccèlva palateva umpiyum niyum uṟankelor èm pavay || pashuram untu mata kalirran otata tol valiyan
    vantènkum koli alaittana kan matavi ppantal mel pal kal kuyil inankal kuvina kan un maittunan per
    pata cèntamarai kkaiyal cirar valai òlippa vantu tiṟavay makilntelor èm pavay || pashuram kuttu vilakkèriya
    kottukkal kattil mel mèttènṟa panca cayanattin mel eṟi kòttalar punkulal nappinnai kònkai mel vaittu
    kkitanta malar marpa èttanai potum tuyil èla òttay kan èttanai yelum pirivarrakillayal tattuvam anṟu
    takavelor èm pavay || pashuram muppattu muvar amararkku mun cènṟu kappam tavirkkum kaliye cèrrarkku
    vèppam kòtukkum vimala cèppanna mèn mulai ccèvvay cciṟu marunkul ukkamum tattòliyum tantun manalanai
    ippote èmmai nirattelor èm pavay || pashuram erra kalankal ètir pònki mitalippa marrate pal còriyum
    vallal pèrum pacukkal arra ppataittan makane ulakinil torramay ninṟa cutare marrar unakku vali tòlaintun
    vacaṟ kan arratu vantun ati paniyuma pole porriyam vantom pukalntelor èm pavay || pashuram ankan ma
    nalattaracar apimana pankamay vantu nin pallikkattiṟ kile cankam iruppar pol vantu talai ppèytom kinkini
    vay ccèyta tamarai ppu ppole cènkan ciṟu cciṟite èmmel viliyavo tinkalum atittiyanum èluntaṟ pol ankan
    irantum kòntènkal mel nokkutiyel ènkal mel capam ilintelor èm pavay || pashuram mari malai mulaincil
    manni kkitantuṟankum ciriya cinkam aṟivurru tti vilittu veri mayir pònka èppatum perntutaṟi muri nimirntu
    mulanki ppuṟappattu potaruma pole ni puvaippu vanna un koyil ninṟinnane pontaruli kopputaiya ciriya
    cinkacanattiruntu yam vanta kariyam arayntarulelor èm pavay || pashuram anṟivvulakam alantay ati porri
    cènṟanku ttèn ilankai cèrray tiṟal porri pònṟa ccakatam utaittay pukal porri kanṟu kunila èṟintay
    kalal porri kunṟu kutaiyay ètuttay kunam porri vènṟu pakai kètukkum nin kaiyil vel porri ènṟènṟun
    cevakame etti ppaṟai kòlvan inṟu yam vantom irankelor èm pavay || pashuram òrutti makanay ppiṟantu
    or iravil òrutti makanay òlittu valara tarikkilan aki ttan tinku ninainta karuttai ppilaippittu kkancan
    vayirril nèruppènna ninṟa nètumale unnai aruttittu vantom paṟai taruti yakil tiruttakka cèlvamum cevakamum
    yam pati varuttamum tirntu makilntelor èm pavay || markali nir atuvan melaiyar cèyvanakal ventuvana
    kettiyel nalattai èllam natunka muralvana palanna vannattun pancajanniyame polvana cankankal poy ppatutaiyanave
    cala ppèrum paṟaiye pallanticaippare kola vilakke kòtiye vitaname arulelor èm pavay || pashuram kutarai
    vèllum cir kovinta un tannaippati ppaṟai kòntu yam pèṟu cammanam natu pukalum paricinal nanṟaka cutakame
    tol valaiye tote cèvi ppuve patakame ènṟanaiya pal kalanum yam anivom atai utuppom atan pinne pal
    coṟu muta nèy pèytu mulankai valivara kuti iruntu kulirntelor èm pavay || pashuram kaṟavaikal pin
    cènṟu kanancerntunpom aṟivònṟum illata aykkulattu un tannai ppiṟavi pèṟuntanai ppunniyam yam utaiyom
    kuṟai ònṟum illata kovinta un tannotuṟavel namakkinkòlikka òliyatu aṟiyata pillaikalom anpinal un
    tannai cciṟuper alaittanavum ciṟi arulate ni taray paṟai elor èm pavay || pashuram cirram ciṟukale
    vantunnai ccevittu un pòrramarai atiye porrum pòrul kelay pèrram meyttunnum kulattil piṟantu ni kurreval
    ènkalai kkòllamal pokatu irrai ppaṟai kòlvan anṟu kan kovinta èrraikkum elel piṟavikkum un tannoturrome
    avom unakke nam at cèyvom marrai nam kamankal marrelor èm pavay || pashuram vanka kkatal katainta
    matavanai kkecavanai tinkal tirumukattu cceyilaiyar cènṟiṟainci anka ppaṟai kòntavarrai ani putuvai
    ppainkamala ttan tèriyal pattar piran kotai cònna canka ttamil malai muppatum tappame inkipparicuraippar
    ir irantu mal varai ttol cènkan tirumukattu ccèlva ttirumalal ènkum tiruvarul pèrrinpuṟuvar èm pavay
    || || antal tiruvatikale caranam pèriyalvar tiruvatikale caranam
  devanagari: ध्यानम् नीलातुङ्ग स्तनगिरितटी सुप्तमुद्बोध्य कृष्णं पारार्थ्यं स्वं श्रुतिशतशिर स्सिद्धमध्यापयन्ती
    । स्वोच्छिष्टायां स्रजि निगलितं या बलात्कृत्य भुङ्क्ते गोदा तस्यै नम इदमिदं भूय एवास्तु भूयः ॥ अन्नवयल्
    पुतुवै क्कॊटुत्तालै च्चॊल्लु चूटि क्कॊटुत्त चुटर्क्कॊटिये नाटिनी वेङ्कटवऱ्कॆन्नै विति ऎन्ऱ इम्मार्रम्
    नां कटवा वण्णमे नल्कु त्तिङ्कल् मति निऱैन्त नन्नालाल् प्पोतुवीर् पोतुमिनो नेर् इऴैयीर् कूर् वेल् कॊटुन्
    तॊऴिलन् नन्तकोपन् कुमरन् एरार्न्त कण्णि यचोतै इलं चिङ्कम् मतियं पोल् मुकत्तान् नारायणने नमक्के पऱै
    तरुवान् प्पटिन्तेलोर् ऎं पावाय् ॥ पाशुरम् वैयत्तु वाऴ्वीर्काल् चॆय्युं किरिचैकल् केलीरो नॆय् उण्णों
    पाल् उण्णों नाट्काले नीर् आटि मैयिट्टॆऴुतों मलरिट्टु नां मुटियोम् चॆय्यातन चॆय्यों तीक्कुऱलै चॆन्ऱोतोम्
    ऐयमुं पिच्चैयुं आन्तनैयुं कै काट्टि उय्युमाऱॆण्णि उकन्तेलोर् ऎं पावाय् ॥ पाशुरम् ओङ्कि उलकलन्त उत्तमन्
    पेर् पाटि नाङ्कल् नं पावैक्कु च्चार्रि नीर् आटिनाल् तीङ्किन्ऱि नाटॆल्लां तिङ्कल् मुम्मारि पॆय्तु ओङ्कु
    पॆऱुञ्चॆन्नॆल् ऊटु कयल् उकल पूङ्कुवलै प्पोतिल् पॊऱिवण्टु कण् पटुप्प तेङ्काते पुक्किरुन्तु चीर्त्त
    मुलै पर्रि वाङ्क कुटं निऱैक्कुं वल्लल् पॆरुं पचुक्कल् नीङ्कात चॆल्वं निऱैन्तेलोर् ऎं पावाय् ॥ पाशुरम्
    आऴि मऴैक्कण्णा आऴि उल् पुक्कु मुकन्तु कॊटार्त्तेऱि ऊऴि मुतल्वन् उरुवं पोल् मॆय् कऱुत्तु पाऴियन् तोलुटै
    प्पऱ्पनापन् कैयिल् आऴि पोल् मिन्नि वलम्पुरि पोल् निन्ऱतिर्न्तु ताऴाते चार्ङ्कं उतैत्त चरमऴै पोल् वाऴ
    उलकिनिल् पॆय्तिटाय् नाङ्कलुं मार्कऴि नीराट मकिऴ्न्तेलोर् ऎं पावाय् ॥ पाशुरम् मायनै मन्नु वटमतुरै मैन्तनै
    तूय पॆरुनीर् यमुनै त्तुऱैवनै आयर् कुलत्तिनिल् तोन्ऱुं अणि विलक्कै तायै क्कुटल् विलक्कं चॆय्त तामोतरनै
    तूयोमाय् वन्तु नां तूमलर् तूवि त्तॊऴुतु वायिनाल् पाटि मनत्तिनाल् चिन्तिक्क पोय पिऴैयुं पुकुतरुवान्
    निन्ऱनवुम् तीयिनिल् तूचाकुं चॆप्पेलोर् ऎं पावाय् ॥ पाशुरम् पुल्लुं चिलम्पिन काण् पुल्लरैयन् कोयिल्
    वॆल्लै विलि चङ्किन् पेर् अरवं केट्टिलैयो ऎऴुन्तिराय् पेय्मुलै नञ्चुण्टु कल्ल च्चकटं कलक्कऴिय क्कालोच्चि
    वॆल्लत्तरविल् तुयिल् अमर्न्त वित्तिनै उल्लत्तु क्कॊण्टु मुनिवर्कलुं योकिकलुम् मॆल्ल ऎऴुन्तरि ऎन्ऱ
    पेर् अरवम् उल्लं पुकुन्तु कुलिर्न्तेलोर् ऎं पावाय् ॥ पाशुरम् कीचु कीचॆन्ऱॆङ्कुं आनैच्चात्तन् कलन्तु
    पेचिन पेच्चरवं केट्टिलैयो पेय् प्पॆण्णे काचुं पिऱप्पुं कल कलप्प क्कै पेर्त्तु वाच नऱुं कुऴल् आय्च्चियर्
    मत्तिनाल् ओचै पटुत्त तयिर् अरवं केट्टिलैयो नायक प्पॆण् पिल्लाय् केचवनै प्पाटवुं नी केट्टे किटत्तियो
    तिऱवेलोर् ऎं पावाय् ॥ पाशुरम् कीऴ्वानं वॆल्लॆन्ऱॆरुमै चिऱु वीटु मेय्वान् परन्तन काण् मिक्कुल्ल पिल्लैकलुम्
    पोवान् पोकिन्ऱारै प्पोकामल् कात्तु उन्नै क्कूवुवान् वन्तु निन्ऱोम् कोतु कलं उटैय पावाय् ऎऴुन्तिराय्
    पाटि प्पऱै कॊण्टु मावाय् पिलन्तानै मल्लरै माट्टिय तेवातितेवनै च्चॆन्ऱु नां चेवित्ताल् आवा ऎन्ऱाराय्न्तरुलेलोर्
    ऎं पावाय् ॥ पाशुरम् तूमणि माटत्तु च्चुर्रुं विलक्कॆरिय तूपं कमऴ त्तुयिल् अणैमेल् कण् वलरुम् मणि क्कतवं
    ताल् तिऱवाय् उन् मकल् तान् ऊमैयो अन्ऱि च्चॆविटो अनन्तलो एम प्पॆरुन् तुयिल् मन्तिर प्पट्टालो मामायन्
    मातवन् वैकुन्तन् ऎन्ऱॆन्ऱु नामं पलवुं नविन्ऱेलोर् ऎं पावाय् ॥ पाशुरम् नोर्रु च्चुवर्क्कं पुकुकिन्ऱ
    अम्मनाय् मार्रमुं तारारो वाचल् तिऱवातार् नार्र त्तुऴाय् मुटि नारायणन् नम्माल् पोर्र प्पऱै तरुं पुण्णियनाल्
    पण्टॊरु नाल् कूर्रत्तिन् वाय् वीऴ्न्त कुम्पकरणनुम् तोर्रुं उनक्के पॆरुन् तुयिल् तान् तन्तानो आर्र
    अनन्तल् उटैयाय् तेर्रमाय् वन्तु तिऱवेलोर् ऎं पावाय् ॥ पाशुरम् कर्रु क्कऱवै क्कणङ्कल् पल कऱन्तु चॆर्रार्
    तिऱल् अऴिय च्चॆन्ऱु चॆरु च्चॆय्युम् कुर्रम् ऒन्ऱिल्लात कोवलर् तं पॊऱ् कॊटिये पुर्ररवल्कुल् पुनमयिले
    चुर्रत्तु त्तोऴिमार् ऎल्लारुं वन्तु निन् मुर्रं पुकुन्तु मुकिल्वण्णन् पेर् पाट चिर्राते पेचाते चॆल्व
    प्पॆण्टाट्टि नी ऎर्रुक्कुऱङ्कुं पॊरुलेलोर् ऎं पावाय् ॥ पाशुरम् कनैत्तिलं कर्रॆरुमै कन्ऱुक्किरङ्कि
    निनैत्तु मुलै वऴिये निन्ऱु पाल् चोर ननैत्तिल्लं चेऱाक्कुं नऱ्चॆल्वन् तङ्काय् पनि त्तलै वीऴ निन् वाचऱ्
    कटै पर्रि चिनत्तिनाल् तॆन् इलङ्कै क्कोमानै च्चॆर्र मनत्तुक्किनियानै प्पाटवुं नी वाय् तिऱवाय् इनि त्तान्
    ऎऴुन्तिराय् ईतॆन्न पेर् उऱक्कम् अनैत्तिल्लत्तारुं अऱिन्तेलोर् ऎं पावाय् ॥ पाशुरम् पुल्लिन् वाय् कीण्टानै
    प्पॊल्ला अरक्कनै किल्लि क्कलैन्तानै क्कीर्त्तिमै पाटि प्पोय् पिल्लैकल् ऎल्लारुं पावै क्कलं पुक्कार्
    वॆल्लि ऎऴुन्तु वियाऴं उऱङ्किर्रु पुल्लुं चिलम्पिन काण् पोतरि क्कण्णिनाय् कुल्ल क्कुलिर क्कुटैन्तु
    नीर् आटाते पल्लि क्किटत्तियो पावाय् कल्लं तविर्न्तु कलन्तेलोर् ऎं पावाय् ॥ पाशुरम् उङ्कल् पुऴैक्कटै
    त्तोट्टत्तु वावियुल् चॆङ्कऴुनीर् वाय् नॆकिऴ्न्ताम्पल् वाय् कूम्पिन काण् चॆङ्कल् पॊटि क्कूरै वॆण्पऱ्
    तवत्तवर् तङ्कल् तिरुक्कोयिऱ् चङ्किटुवान् पोतन्तार् ऎङ्कलै मुन्नम् ऎऴुप्पुवान् वाय् पेचुम् ऎऴुन्तिराय्
    नाणाताय् चङ्कॊटु चक्करं एन्तुं तटक्कैयन् पङ्कय क्कण्णानै प्पाटेलोर् ऎं पावाय् ॥ चिल् ऎन्ऱऴैयेन्मिन्
    नङ्कैमीर् वल्लै उन् कट्टुरैकल् पण्टे उन् वायऱितुम् वल्लीर्कल् नीङ्कले नाने तान् आयिटुक ऒल्लै नी पोताय्
    उनक्कॆन्न वेऱुटैयै ऎल्लारुं पोन्तारो पोन्तार् पोन्तॆण्णिक्कॊल् वल्लानै कॊन्ऱानै मार्रारै मार्रऴिक्क
    वल्लानै मायनै प्पाटेलोर् ऎं पावाय् ॥ पाशुरम् नायकनाय् निन्ऱ नन्तकोपनुटैय कोयिल् काप्पाने कॊटि त्तोन्ऱुं
    तोरण वायिल् काप्पाने मणिक्कतवं ताल् तिऱवाय् आयर् चिऱुमियरोमुक्कु अऱै पऱै मायन् मणिवण्णन् नॆन्नले वाय्
    नेर्न्तान् तूयोमाय् वन्तों तुयिल् ऎऴ प्पाटुवान् वायाल् मुन्नं मुन्नं मार्राते अम्मा नी नेय निलै क्कतवं
    नीक्केलोर् ऎं पावाय् ॥ पाशुरम् अम्परमे तण्णीरे चोऱे अऱं चॆय्युम् ऎं पॆरुमान् नन्तकोपाला कॊम्पनार्क्कॆल्लां
    कॊऴुन्ते ऎं पॆरुमाट्टि यचोताय् अम्परं ऊटऱुत्तोङ्कि उलकलन्त चॆं पॊऱ् कऴल् अटि च्चॆल्वा पलतेवा उम्पियुं
    नीयुं उऱङ्केलोर् ऎं पावाय् ॥ पाशुरम् उन्तु मत कलिर्रन् ओटात तोल् वलियन् वन्तॆङ्कुं कोऴि अऴैत्तन काण्
    मातवि प्पन्तल् मेल् पल् काल् कुयिल् इनङ्कल् कूविन काण् उन् मैत्तुनन् पेर् पाट चॆन्तामरै क्कैयाल् चीरार्
    वलै ऒलिप्प वन्तु तिऱवाय् मकिऴ्न्तेलोर् ऎं पावाय् ॥ पाशुरम् कुत्तु विलक्कॆरिय कोट्टुक्काल् कट्टिल्
    मेल् मॆत्तॆन्ऱ पञ्च चयनत्तिन् मेल् एऱि कॊत्तलर् पूङ्कुऴल् नप्पिन्नै कॊङ्कै मेल् वैत्तु क्किटन्त मलर्
    मार्पा ऎत्तनै पोतुं तुयिल् ऎऴ ऒट्टाय् काण् ऎत्तनै येलुं पिरिवार्रकिल्लायाल् तत्तुवं अन्ऱु तकवेलोर्
    ऎं पावाय् ॥ पाशुरम् मुप्पत्तु मूवर् अमरर्क्कु मुन् चॆन्ऱु कप्पं तविर्क्कुं कलिये चॆर्रार्क्कु वॆप्पं
    कॊटुक्कुं विमला चॆप्पन्न मॆन् मुलै च्चॆव्वाय् च्चिऱु मरुङ्कुल् उक्कमुं तट्टॊलियुं तन्तुन् मणालनै इप्पोते
    ऎम्मै नीराट्टेलोर् ऎं पावाय् ॥ पाशुरम् एर्र कलङ्कल् ऎतिर् पॊङ्कि मीतलिप्प मार्राते पाल् चॊरियुं वल्लल्
    पॆरुं पचुक्कल् आर्र प्पटैत्तान् मकने उलकिनिल् तोर्रमाय् निन्ऱ चुटरे मार्रार् उनक्कु वलि तॊलैन्तुन्
    वाचऱ् कण् आर्रातु वन्तुन् अटि पणियुमा पोले पोर्रियां वन्तों पुकऴ्न्तेलोर् ऎं पावाय् ॥ पाशुरम् अङ्कण्
    मा ञालत्तरचर् अपिमान पङ्कमाय् वन्तु निन् पल्लिक्कट्टिऱ् कीऴे चङ्कं इरुप्पार् पोल् वन्तु तलै प्पॆय्तोम्
    किङ्किणि वाय् च्चॆय्त तामरै प्पू प्पोले चॆङ्कण् चिऱु च्चिऱिते ऎम्मेल् विऴियावो तिङ्कलुं आतित्तियनुम्
    ऎऴुन्ताऱ् पोल् अङ्कण् इरण्टुं कॊण्टॆङ्कल् मेल् नोक्कुतियेल् ऎङ्कल् मेल् चापं इऴिन्तेलोर् ऎं पावाय्
    ॥ पाशुरम् मारि मलै मुऴैञ्चिल् मन्नि क्किटन्तुऱङ्कुम् चीरिय चिङ्कं अऱिवुर्रु त्ती विऴित्तु वेरि मयिर्
    पॊङ्क ऎप्पाटुं पेर्न्तुतऱि मूरि निमिर्न्तु मुऴङ्कि प्पुऱप्पट्टु पोतरुमा पोले नी पूवैप्पू वण्णा उन्
    कोयिल् निन्ऱिङ्ङने पोन्तरुलि कोप्पुटैय चीरिय चिङ्काचनत्तिरुन्तु यां वन्त कारियं आराय्न्तरुलेलोर् ऎं
    पावाय् ॥ पाशुरम् अन्ऱिव्वुलकं अलन्ताय् अटि पोर्रि चॆन्ऱङ्कु त्तॆन् इलङ्कै चॆर्राय् तिऱल् पोर्रि पॊन्ऱ
    च्चकटं उतैत्ताय् पुकऴ् पोर्रि कन्ऱु कुणिला ऎऱिन्ताय् कऴल् पोर्रि कुन्ऱु कुटैयाय् ऎटुत्ताय् कुणं पोर्रि
    वॆन्ऱु पकै कॆटुक्कुं निन् कैयिल् वेल् पोर्रि ऎन्ऱॆन्ऱुन् चेवकमे एत्ति प्पऱै कॊल्वान् इन्ऱु यां वन्तों
    इरङ्केलोर् ऎं पावाय् ॥ पाशुरम् ऒरुत्ति मकनाय् प्पिऱन्तु ओर् इरविल् ऒरुत्ति मकनाय् ऒलित्तु वलर तरिक्किलान्
    आकि त्तान् तीङ्कु निनैन्त करुत्तै प्पिऴैप्पित्तु क्कञ्चन् वयिर्रिल् नॆरुप्पॆन्न निन्ऱ नॆटुमाले उन्नै
    अरुत्तित्तु वन्तों पऱै तरुति याकिल् तिरुत्तक्क चॆल्वमुं चेवकमुं यां पाटि वरुत्तमुं तीर्न्तु मकिऴ्न्तेलोर्
    ऎं पावाय् ॥ मार्कऴि नीर् आटुवान् मेलैयार् चॆय्वनकल् वेण्टुवन केट्टियेल् ञालत्तै ऎल्लां नटुङ्क मुरल्वन
    पालन्न वण्णत्तुन् पाञ्चजन्नियमे पोल्वन चङ्कङ्कल् पोय् प्पाटुटैयनवे चाल प्पॆरुं पऱैये पल्लाण्टिचैप्पारे
    कोल विलक्के कॊटिये वितानमे अरुलेलोर् ऎं पावाय् ॥ पाशुरम् कूटारै वॆल्लुं चीर् कोविन्ता उन् तन्नैप्पाटि
    प्पऱै कॊण्टु यां पॆऱु चम्मानम् नाटु पुकऴुं परिचिनाल् नन्ऱाक चूटकमे तोल् वलैये तोटे चॆवि प्पूवे पाटकमे
    ऎन्ऱनैय पल् कलनुं यां अणिवोम् आटै उटुप्पों अतन् पिन्ने पाल् चोऱु मूट नॆय् पॆय्तु मुऴङ्कै वऴिवार कूटि
    इरुन्तु कुलिर्न्तेलोर् ऎं पावाय् ॥ पाशुरम् कऱवैकल् पिन् चॆन्ऱु कानञ्चेर्न्तुण्पोम् अऱिवॊन्ऱुं इल्लात
    आय्क्कुलत्तु उन् तन्नै प्पिऱवि पॆऱुन्तनै प्पुण्णियं यां उटैयोम् कुऱै ऒन्ऱुं इल्लात कोविन्ता उन् तन्नोटुऱवेल्
    नमक्किङ्कॊऴिक्क ऒऴियातु अऱियात पिल्लैकलों अन्पिनाल् उन् तन्नै च्चिऱुपेर् अऴैत्तनवुं चीऱि अरुलाते नी
    ताराय् पऱै एलोर् ऎं पावाय् ॥ पाशुरम् चिर्रं चिऱुकाले वन्तुन्नै च्चेवित्तु उन् पॊर्रामरै अटिये पोर्रुं
    पॊरुल् केलाय् पॆर्रं मेय्त्तुण्णुं कुलत्तिल् पिऱन्तु नी कुर्रेवल् ऎङ्कलै क्कॊल्लामल् पोकातु इर्रै
    प्पऱै कॊल्वान् अन्ऱु काण् कोविन्ता ऎर्रैक्कुं एऴेऴ् पिऱविक्कुम् उन् तन्नोटुर्रोमे आवों उनक्के नां
    आट् चॆय्वोम् मर्रै नं कामङ्कल् मार्रेलोर् ऎं पावाय् ॥ पाशुरम् वङ्क क्कटल् कटैन्त मातवनै क्केचवनै तिङ्कल्
    तिरुमुकत्तु च्चेयिऴैयार् चॆन्ऱिऱैञ्चि अङ्क प्पऱै कॊण्टवार्रै अणि पुतुवै प्पैङ्कमल त्तण् तॆरियल् पट्टर्
    पिरान् कोतै चॊन्न चङ्क त्तमिऴ् मालै मुप्पतुं तप्पामे इङ्किप्परिचुरैप्पार् ईर् इरण्टु माल् वरै त्तोल्
    चॆङ्कण् तिरुमुकत्तु च्चॆल्व त्तिरुमालाल् ऎङ्कुं तिरुवरुल् पॆर्रिन्पुऱुवर् ऎं पावाय् ॥ ॥ आण्टाल् तिरुवटिकले
    चरणं पॆरियाऴ्वार् तिरुवटिकले चरणम्
