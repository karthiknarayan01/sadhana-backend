id: ramakrishnasuprabhatam-3
category: shataka
name:
  english: ramakrishnasuprabhatam 3
  devanagari: रामकृष्णसुप्रभातम् ३
content:
  english: murantakadi | murtinijevapushivasayato'pigudham mudhatmanavilasatastava suprabhatam || 71||
    sphurjjatrayinitilavacakagajjitasya shashvatprakirnanirupadhikripamritasya | kvapisphurat svagurubhavatadillatasya
    saccitdhanasyabhavatattava suprabhatam || 72|| yat padapamsuluthanankamalasanadyah matva'punarbhavasukhadapikamaniyam
    | tatsiddhayekathinasamyamamacaranti tasyatrivishtapapateh tava suprabhatam || 73|| naivadhvaro na
    niyamo na yamo na homo no dakshina na ca japo na ca tirthayatra | yatpadasevanalavasyakalakvacit syattasyaprameyamahasastava
    suprabhatam || 74|| maya na tishthati yadakshipathe bhayena siddhah yadikshanalavaya tapastapanti
    | yannamatarayati samsrititassamastam stasya prabhoridamidam tava suprabhatam || 75|| gangadi tirthanikaraprabhavaikamule
    brahmadyamanushashirashciramrigyamane | ekaikanaijapadavinyasane dharanyah romancamankurayatastava
    suprabhatam || 76|| vishvakritiprakatanena vinapavitra kirtyasvatahprasrimarasyasamastadikshu | hitvayudhani
    nirupadhikasauhridena lokatrayivijayina stava suprabhatam || 77|| lokatrayiduritasancayakalakutamapiya
    bhutadayayarbudarogabhajah | kanthevyathatishayatashitikanthabhavam praptasyavishvasuhridastava suprabhatam
    || 78|| sviyam cidekaracitam paramarthabhutam anandamurttimakhileshu caracareshu | vaikunthanamaka
    nijanghri nishevakaya vyajyasphutam kripayatastava suprabhatam || 79|| nanabhishakpravarasadhucikitsitasya
    nishsheshalokabhavarogacikitsakasya | uccaistaram vividhayatanayaditasya svanandanityavihritestava
    suprabhatam || 80|| kalekadacidavishahyakripajavena padabjasimni patitan patitanasheshan | sprishtva
    samadhirasamishvaradarshanam ca datva praharshitavatastava suprabhatam || 81|| kalyanakelinikarairbhuvanam
    samastam ujjivya samyagatibhasuramatmateja | shishyagravahnishu nidhaya tirobubhoshoh purnavatarasavitustava
    suprabhatam || 82|| pashandinam sarabhasakramanenabhinna
  devanagari: मुरान्तकादि । मूर्तीनिजेवपुषिवासयतोऽपिगूढं मूढात्मनाविलसतस्तव सुप्रभातम् ॥ ७१॥ स्फूर्ज्जत्रयीनिटिलवाचकगज्जितस्य
    शश्वत्प्रकीर्णनिरुपाधिकृपामृतस्य । क्वापिस्फुरत् स्वगुरुभावतडिल्लतस्य सच्चित्धनस्यभवतात्तव सुप्रभातम्
    ॥ ७२॥ यत् पादपांसुलुठनङ्कमलासनाद्याः मत्वाऽपुनर्भवसुखादपिकामनीयम् । तत्सिद्धयेकठिनसंयममाचरन्ति तस्यत्रिविष्टपपतेः
    तव सुप्रभातम् ॥ ७३॥ नैवाध्वरो न नियमो न यमो न होमो नो दक्षिणा न च जपो न च तीर्थयात्रा । यत्पादसेवनलवस्यकलाक्वचित्
    स्यात्तस्याप्रमेयमहसस्तव सुप्रभातम् ॥ ७४॥ माया न तिष्ठति यदक्षिपथे भयेन सिद्धाः यदीक्षणलवाय तपस्तपन्ति
    । यन्नामतारयति संसृतितस्समस्तां स्तस्य प्रभोरिदमिदं तव सुप्रभातम् ॥ ७५॥ गङ्गादि तीर्थनिकरप्रभवैकमूले
    ब्रह्माद्यमानुषशिरश्चिरमृग्यमाणे । एकैकनैजपदविन्यसने धरण्याः रोमाञ्चमङ्कुरयतस्तव सुप्रभातम् ॥ ७६॥
    विश्वाकृतिप्रकटनेन विनापवित्र कीर्त्यास्वतःप्रसृमरस्यसमस्तदिक्षु । हित्वायुधानि निरुपाधिकसौहृदेन लोकत्रयीविजयिन
    स्तव सुप्रभातम् ॥ ७७॥ लोकत्रयीदुरितसञ्चयकालकूटमापीय भूतदययार्बुदरोगभाजः । कण्ठेव्यथातिशयतशितिकण्ठभावं
    प्राप्तस्यविश्वसुहृदस्तव सुप्रभातम् ॥ ७८॥ स्वीयां चिदेकरचितां परमार्थभूतां आनन्दमूर्त्तिमखिलेषु चराचरेषु
    । वैकुण्ठनामक निजाङ्घ्रि निषेवकाय व्यज्यस्फुटं कृपयतस्तव सुप्रभातम् ॥ ७९॥ नानाभिषक्प्रवरसाधुचिकित्सितस्य
    निश्शेषलोकभवरोगचिकित्सकस्य । उच्चैस्तरां विविधयातनायादितस्य स्वानन्दनित्यविहृतेस्तव सुप्रभातम् ॥ ८०॥
    कालेकदाचिदविषह्यकृपाजवेन पादाब्जसीम्नि पतितान् पतितानशेषान् । स्पृष्ट्वा समाधिरसमीश्वरदर्शनं च दत्वा
    प्रहर्षितवतस्तव सुप्रभातम् ॥ ८१॥ कल्याणकेलिनिकरैर्भुवनं समस्तं उज्जीव्य सम्यगतिभासुरमात्मतेज । शिष्याग्रवह्निषु
    निधाय तिरोबुभोषोः पूर्णावतारसवितुस्तव सुप्रभातम् ॥ ८२॥ पाषण्डिनां सरभसाक्रमणेनभिन्न
