id: devaihkritamkatyayanistotram
category: stotram
name:
  english: devaihkritamkatyayanistotram
  devanagari: देवैःकृतंकात्यायनीस्तोत्रम्
content:
  english: '|| 95|| namaste daityadarpaghni namo''shtadashabahavi | namo narayani brahmi cakradharini
    te namah || 96|| namo vajradhare hastidhvaje te''stu namo namah | mayuravahini te''stu namaste hamsavahini
    || 97|| mundamale namaste''stu sukeshini namo''stu te | trinetre varade devi namaste''stu prasida
    ca || 98|| prapanna''''rtihare devi matah prasida pahi ca | mahirupe sadadhare jalarupe ca triptide
    || 99|| bijarupe moharupe muktirupe namo''stu te | vidyarupe samastastrisvarupe te namo namah || 100||
    svargamokshaprade devi narayani namo''stu te | kalarupe tattvarupe karyakaranarupini || 101|| trigune
    nirgune devi mahamaye hridisthite | sarva''ntaryamini devi narayani namo''stu te || 102|| brahmani
    hamsayanasthe shivani vrishabhasthite | vaishnavi garudasthe te narayani namo''stu te || 103|| matrirupe
    stanyayukte patnirupe sagarbhike | ratirupe jivashante narayani namo''stu te || 104|| yuge yuge maha''suropadravanashanam
    kuru | devanam rakshanam caiva narayani namo''stu te || 105|| sharanyanam sada badhaghatanam kuru
    sarvatha | trishulam sarvada bhiteh patu devi namo''stu te || 106|| ghanta patu ca papebhya khadgah
    sukham karotu ca | pashadyaste sada pantu nashca devi namo''stu te || 107|| srishtau sada tvaya karyamevameva
    tu rakshanam | rakshanaya sada devi prasanna''stu namo''stu te || 108|| iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 168'
  devanagari: ॥ ९५॥ नमस्ते दैत्यदर्पघ्नि नमोऽष्टादशबाहवि । नमो नारायणि ब्राह्मि चक्रधारिणि ते नमः ॥ ९६॥
    नमो वज्रधरे हस्तिध्वजे तेऽस्तु नमो नमः । मयूरवाहिनि तेऽस्तु नमस्ते हंसवाहिनि ॥ ९७॥ मुण्डमाले नमस्तेऽस्तु
    सुकेशिनि नमोऽस्तु ते । त्रिनेत्रे वरदे देवि नमस्तेऽस्तु प्रसीद च ॥ ९८॥ प्रपन्नाऽऽर्तिहरे देवि मातः
    प्रसीद पाहि च । महीरूपे सदाधारे जलरूपे च तृप्तिदे ॥ ९९॥ बीजरूपे मोहरूपे मुक्तिरूपे नमोऽस्तु ते । विद्यारूपे
    समस्तस्त्रीस्वरूपे ते नमो नमः ॥ १००॥ स्वर्गमोक्षप्रदे देवि नारायणि नमोऽस्तु ते । कालरूपे तत्त्वरूपे
    कार्यकारणरूपिणि ॥ १०१॥ त्रिगुणे निर्गुणे देवि महामाये हृदिस्थिते । सर्वाऽन्तर्यामिणि देवि नारायणि
    नमोऽस्तु ते ॥ १०२॥ ब्रह्माणि हंसयानस्थे शिवानि वृषभस्थिते । वैष्णवि गरुडस्थे ते नारायणि नमोऽस्तु ते
    ॥ १०३॥ मातृरूपे स्तन्ययुक्ते पत्नीरूपे सगर्भिके । रतिरूपे जीवशान्ते नारायणि नमोऽस्तु ते ॥ १०४॥ युगे
    युगे महाऽसुरोपद्रवनाशनं कुरु । देवानां रक्षणं चैव नारायणि नमोऽस्तु ते ॥ १०५॥ शरण्यानां सदा बाधाघातनं
    कुरु सर्वथा । त्रिशूलं सर्वदा भीतेः पातु देवि नमोऽस्तु ते ॥ १०६॥ घण्टा पातु च पापेभ्य खड्गः सुखं करोतु
    च । पाशाद्यास्ते सदा पान्तु नश्च देवि नमोऽस्तु ते ॥ १०७॥ सृष्टौ सदा त्वया कार्यमेवमेव तु रक्षणम् ।
    रक्षणाय सदा देवि प्रसन्नाऽस्तु नमोऽस्तु ते ॥ १०८॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने
    १६८
