id: navagraha-suktam-navagraha-namaskaram
category: stotram
name:
  english: Navagraha Suktam (Navagraha Namaskaram)
content:
  english: ncaturbhujam| prasannavadana ndhyayetsarva vighnopashantaye || o mbhuvah ogm suvah o ntapah
    ogm satyam o mbhargodevasya dhimahi dhiyo yo nah pracodaya t || om apo jyotiraso mbrahma bhurbhuvassuvarom
    || mamopatta duritakshayadvara shriparameshvara prityartham adityadi navagraha devata prasada siddhyartham
    adityadi navagraha namaskaran karishye || om asatyena rajasa vartamano niveshayannamrita mmartyanca
    | hiranyayena savita rathena ''devo yatibhuvana vipashyan || agni vi~shvavedasam | asya yajnasya sukratum
    || yeshamishe pashupatih pashuna ncatushpadamuta ca dvipada mbhagametu rayasposha yajamanasya santu
    || om adhidevata pratyadhidevata sahitaya adityaya namah || || om apyayasva sametu te vishvatassoma
    vrishniyam | bhava vajasya sangathe || apsume somo abravidantarvishvani bheshaja | agninca vishvashambhuvamapashca
    vishvabheshajih || gauri mimaya salilani takshatyekapadi dvipadi sa catushpadi | ashtapadi navapadi
    babhuvushi sahasra kshara parame vyomann || om adhidevata pratyadhidevata sahitaya somaya namah ||
    || om agnirmurdha divah kakutpatih prithivya ayam | apagmretagmsi jinvati || syona prithivi bhava
    'nrikshara niveshani | yacchanashsharma saprathah || kshetrasya patina vayagmhite neva jayamasi |
    gamashva mva sa no mridatidrishe || om adhidevata pratyadhidevata sahitaya angarakaya namah || ||
    om udbudhyasvagne pratijagrihyenamishtapurte sagmsrijethamayanca | punah krinvagg yu~vanamanvatagmsittvayi
    tantumetam || idam vi~shnurvicakrame tredha nidadhe padam | samudhamasyapagm sure || vishno raratamasi
    vishnoh prishthamasi vishnoshshnaptre stho vishnossyurasi vishno rdhruvamasi vaishnavamasi vishnave
    tva || om adhidevata pratyadhidevata sahitaya budhaya namah || mbrihaspate atiyadaryo ar ddyumadvibhati
    kratumajjaneshu |yaddidayaccavasartaprajata tadasmasu dravinandhehi citram || indramarutva iha pahi
    somam ya~tha sharyate apibassutasya | tava praniti tava shurasharmannavivasanti kavayassuyajnah ||
    brahmajajnana mpurastadvisimatassuruco vena avah | sabudhniya upama asya vishthassatashca yonimasatashca
    vivah || om adhidevata pratyadhidevata sahitaya brihaspataye namah || mpravashshukraya bhanave bharadhvam
    | havya ncagnaye suputam | yo daivyani manusha janugmshi antarvishvani vidma na jigati || indranimasu
    narishu supat mimahamashravam | na hyasya aparancana jarasa marate patih || indram vo~ vishvataspari
    havamahe jane bhyah | asmakamastu kevalah|| om adhidevata pratyadhidevata sahitaya shukraya namah
    || || om shanno devirabhishtaya apo bhavantu pitaye yo~rabhisravantu nah || prajapate na tvadetanyanyo
    vishva jatani parita babhuva | yatkamaste juhumastanno astu vayagg syama patayo rayinam || imam ya~maprastaramahi
    sida 'ngirobhih pitribhissam vi~danah | atva mantrah kavishasta vahantvena rajan havisha madayasva
    || om adhidevata pratyadhidevata sahitaya shanaishcaraya namah || nkaya nashcitra abhuvaduti sadavridhassakha
    | kaya shacishthaya vrita || a 'yangauh prishnirakramidasananmatara mpunah | pitaranca prayantsuvah
    || yatte devi nir ritirababandha dama grivasvavicartyam | idante tadvishyamyayusho na madhyadathajivah
    pitumaddhi pramuktah || om adhidevata pratyadhidevata sahitaya rahave namah || nketunkrinvannaketave
    pesho marya apeshase | samushadbhirajayathah || brahma devana mpadavih kavinamrishirviprana m | shyenogridhranagsvadhitirvananagm
    somah pavitramatyeti rebhan || sacitra citra tamasme citrakshatra citratamam va~yodham | candram rayi
    ncandracandrabhirgrinate yuvasva || om adhidevata pratyadhidevata sahitebhyah ketubhyo namah || ||
    || om adityadi navagraha devatabhyo namo namah || || om shanti
  devanagari: ञ्चतुर्भुजम्। प्रसन्नवदन न्ध्यायेत्सर्व विघ्नोपशान्तये ॥ ओ म्भुवः॑ ओग्ं॒ सुवः॑ ओ न्तपः॑
    ओग्ं स॒त्यं ओ म्भर्गो॑दे॒वस्य॑ धीमहि धियो॒ यो नः॑ प्रचो॒दया त् ॥ ॐ आपो॒ ज्योती॒रसो॒ म्ब्रह्म॒ भूर्भुव॒स्सुव॒रोम्
    ॥ ममोपात्त दुरितक्षयद्वारा श्रीपरमेश्वर प्रीत्यर्थं आदित्यादि नवग्रह देवता प्रसाद सिद्ध्यर्थं आदित्यादि
    नवग्रह नमस्कारान् करिष्ये ॥ ॐ आस॒त्येन॒ रज॑सा॒ वर्त॑मानो निवे॒शय॑न्न॒मृत॒ म्मर्त्य॑ञ्च । हि॒र॒ण्यये॑न
    सवि॒ता रथे॒ना ऽऽदे॒वो या॑ति॒भुव॑ना वि॒पश्यन्॑ ॥ अ॒ग्नि विँ॒श्ववे॑दसम् । अ॒स्य य॒ज्ञस्य॑ सु॒क्रतुम्
    ॥ येषा॒मीशे॑ पशु॒पतिः॑ पशू॒ना ञ्चतु॑ष्पदामु॒त च॑ द्वि॒पदा म्भा॒गमे॑तु रा॒यस्पोषा॒ यज॑मानस्य सन्तु
    ॥ ॐ अधिदेवता प्रत्यधिदेवता सहिताय आदि॑त्याय॒ नमः॑ ॥ ॥ ॐ आप्या॑यस्व॒ समे॑तु ते वि॒श्वत॑स्सोम॒ वृष्णि॑यम्
    । भवा॒ वाज॑स्य सङ्ग॒थे ॥ अ॒प्सुमे॒ सोमो॑ अब्रवीद॒न्तर्विश्वा॑नि भेष॒जा । अ॒ग्निञ्च॑ वि॒श्वश॑म्भुव॒माप॑श्च
    वि॒श्वभे॑षजीः ॥ गौ॒री मि॑माय सलि॒लानि॒ तक्ष॒त्येक॑पदी द्वि॒पदी॒ सा चतु॑ष्पदी । अ॒ष्टाप॑दी॒ नव॑पदी
    बभू॒वुषी॑ स॒हस्रा क्षरा पर॒मे व्यो॑मन्न् ॥ ॐ अधिदेवता प्रत्यधिदेवता सहिताय सोमा॑य॒ नमः॑ ॥ ॥ ॐ अ॒ग्निर्मू॒र्धा
    दि॒वः क॒कुत्पतिः॑ पृथि॒व्या अ॒यम् । अ॒पाग्ंरेताग्ं॑सि जिन्वति ॥ स्यो॒ना पृ॑थिवि॒ भवा॑ ऽनृक्ष॒रा नि॒वेश॑नी
    । यच्छा॑न॒श्शर्म॑ स॒प्रथाः ॥ क्षेत्र॑स्य॒ पति॑ना व॒यग्ंहि॒ते ने॑व जयामसि । गामश्व॑ ंवा स नो॑ मृडाती॒दृशे
    ॥ ॐ अधिदेवता प्रत्यधिदेवता सहिताय अङ्गा॑रकाय॒ नमः॑ ॥ ॥ ॐ उद्बु॑ध्यस्वाग्ने॒ प्रति॑जागृह्येनमिष्टापू॒र्ते
    सग्ंसृ॑जेथाम॒यञ्च॑ । पुनः॑ कृ॒ण्वग्ग् युँवा॑नम॒न्वाताग्ं॑सी॒त्त्वयि॒ तन्तु॑मे॒तम् ॥ इ॒दं विँष्णु॒र्विच॑क्रमे
    त्रे॒धा निद॑धे प॒दम् । समू॑ढमस्यपाग्ं सु॒रे ॥ विष्णो॑ र॒राट॑मसि॒ विष्णोः पृ॒ष्ठम॑सि॒ विष्णो॒श्श्नप्त्रे
    स्थो॒ विष्णो॒स्स्यूर॑सि॒ विष्णो र्ध्रु॒वम॑सि वैष्ण॒वम॑सि॒ विष्ण॑वे त्वा ॥ ॐ अधिदेवता प्रत्यधिदेवता
    सहिताय बुधा॑य॒ नमः॑ ॥ म्बृह॑स्पते॒ अति॒यद॒र्यो अर् द्द्यु॒मद्वि॒भाति॒ क्रतु॑म॒ज्जने॑षु ।यद्दी॒दय॒च्चव॑सर्तप्रजात॒
    तद॒स्मासु॒ द्रवि॑णन्धेहि चि॒त्रम् ॥ इन्द्र॑मरुत्व इ॒ह पा॑हि॒ सोमं॒ यँथा॑ शार्या॒ते अपि॑बस्सु॒तस्य॑
    । तव॒ प्रणी॑ती॒ तव॑ शूर॒शर्म॒न्नावि॑वासन्ति क॒वय॑स्सुय॒ज्ञाः ॥ ब्रह्म॑जज्ञा॒न म्पु॒रस्ता॒द्विसी॑म॒तस्सु॒रुचो॑
    वे॒न आ॑वः । सबु॒ध्निया॑ उप॒मा अ॑स्य वि॒ष्ठास्स॒तश्च॒ योनि॒मस॑तश्च॒ विवः॑ ॥ ॐ अधिदेवता प्रत्यधिदेवता
    सहिताय बृह॒स्पत॑ये॒ नमः॑ ॥ म्प्रव॑श्शु॒क्राय॑ भा॒नवे॑ भरध्वम् । ह॒व्य ञ्चा॒ग्नये॒ सुपू॑तम् । यो दैव्या॑नि॒
    मानु॑षा ज॒नूग्ंषि॑ अ॒न्तर्विश्वा॑नि वि॒द्म ना॒ जिगा॑ति ॥ इ॒न्द्रा॒णीमा॒सु नारि॑षु सु॒पत् ंई॑म॒हम॑श्रवम्
    । न ह्य॑स्या अप॒रञ्च॒न ज॒रसा॒ मर॑ते॒ पतिः॑ ॥ इन्द्रं॑ वोँ वि॒श्वत॒स्परि॒ हवा॑महे॒ जने भ्यः । अ॒स्माक॑मस्तु॒
    केव॑लः॥ ॐ अधिदेवता प्रत्यधिदेवता सहिताय शुक्रा॑य॒ नमः॑ ॥ ॥ ॐ शन्नो॑ दे॒वीर॒भिष्ट॑य॒ आपो॑ भवन्तु पी॒तये
    योँर॒भिस्र॑वन्तु नः ॥ प्रजा॑पते॒ न त्वदे॒तान्य॒न्यो विश्वा॑ जा॒तानि॒ परि॒ता ब॑भूव । यत्का॑मास्ते जुहु॒मस्तन्नो॑
    अस्तु व॒यग्ग् स्या॑म॒ पत॑यो रयी॒णाम् ॥ इ॒मं यँ॑मप्रस्त॒रमाहि सीदा ऽङ्गि॑रोभिः पि॒तृभि॑स्सं विँदा॒नः
    । आत्वा॒ मन्त्राः कविश॒स्ता व॑हन्त्वे॒ना रा॑जन् ह॒विषा॑ मादयस्व ॥ ॐ अधिदेवता प्रत्यधिदेवता सहिताय
    शनैश्च॑राय॒ नमः॑ ॥ ङ्कया॑ नश्चि॒त्र आभु॑वदू॒ती स॒दावृ॑ध॒स्सखा । कया॒ शचि॑ष्ठया वृ॒ता ॥ आ ऽयङ्गौः पृश्नि॑रक्रमी॒दस॑नन्मा॒तर॒
    म्पुनः॑ । पि॒तर॑ञ्च प्र॒यन्त्सुवः॑ ॥ यत्ते॑ दे॒वी निर् ऋ॑तिराब॒बन्ध॒ दाम॑ ग्री॒वास्व॑विच॒र्त्यम् ।
    इ॒दन्ते॒ तद्विष्या॒म्यायु॑षो॒ न मध्या॒दथा॑जी॒वः पि॒तुम॑द्धि॒ प्रमु॑क्तः ॥ ॐ अधिदेवता प्रत्यधिदेवता
    सहिताय राह॑वे॒ नमः॑ ॥ ङ्के॒तुङ्कृ॒ण्वन्न॑के॒तवे॒ पेशो॑ मर्या अपे॒शसे । समु॒षद्भि॑रजायथाः ॥ ब्र॒ह्मा
    दे॒वाना म्पद॒वीः क॑वी॒नामृषि॒र्विप्रा॑णा म् । श्ये॒नोगृध्रा॑णा॒ग्॒स्वधि॑ति॒र्वना॑ना॒ग्ं॒ सोमः॑ प॒वित्र॒मत्ये॑ति॒
    रेभन्॑ ॥ सचि॑त्र चि॒त्र तम॒स्मे चित्र॑क्षत्र चि॒त्रत॑मं वँयो॒धाम् । च॒न्द्रं र॒यि ञ्चन्द्र॑च॒न्द्राभि॑र्गृण॒ते
    यु॑वस्व ॥ ॐ अधिदेवता प्रत्यधिदेवता सहितेभ्यः केतु॑भ्यो॒ नमः॑ ॥ ॥ ॥ ॐ आदित्यादि नवग्रह देव॑ताभ्यो॒
    नमो॒ नमः॑ ॥ ॥ ॐ शान्ति॒
