id: sadhakapancakam
category: stotram
name:
  english: sadhakapancakam
  devanagari: साधकपञ्चकम्
content:
  english: matmeccha vyavasiyatam nijagrihatturnam vinirgamyatam ||1|| sangah satsu vidhiyatam bhagavato
    bhaktirdridha''dhiyatam shantyadih pariciyatam dridhataram karmashu santyajyatam | sadvidvanupasripyatam
    pratidinam tatpaduka sevyatam brahmaikaksharamarthyatam shrutishirovakyam samakarnyatam ||2|| vakyarthashca
    vicaryatam shrutishirahpakshah samashriyatam dustarkatsuviramyatam shrutimatastarko'nusandhiyatam
    | brahmasmiti vibhavyatamaharahargarvah parityajyatam dehe'hammatirujjhyatam budhajanairvadah parityajyatam
    ||3|| kshudvyadhishca cikitsyatam pratidinam bhikshaushadham bhujyatam svadvannam na tu yacyatam vidhivashat
    praptena santushyatam | shitoshnadi vishahyatam na tu vritha vakyam samuccaryata
  devanagari: मात्मेच्छा व्यवसीयतां निजगृहात्तूर्णं विनिर्गम्यताम् ।।१।। सङ्गः सत्सु विधीयतां भगवतो भक्तिर्दृढाऽऽधीयतां
    शान्त्यादिः परिचीयतां दृढतरं कर्माशु सन्त्यज्यताम् । सद्विद्वानुपसृप्यतां प्रतिदिनं तत्पादुका सेव्यतां
    ब्रह्मैकाक्षरमर्थ्यतां श्रुतिशिरोवाक्यं समाकर्ण्यताम् ।।२।। वाक्यार्थश्च विचार्यतां श्रुतिशिरःपक्षः
    समाश्रीयतां दुस्तर्कात्सुविरम्यतां श्रुतिमतस्तर्कोऽनुसन्धीयताम् । ब्रह्मास्मीति विभाव्यतामहरहर्गर्वः
    परित्यज्यतां देहेऽहम्मतिरुज्झ्यतां बुधजनैर्वादः परित्यज्यताम् ।।३।। क्षुद्व्याधिश्च चिकित्स्यतां प्रतिदिनं
    भिक्षौषधं भुज्यतां स्वाद्वन्नं न तु याच्यतां विधिवशात् प्राप्तेन सन्तुष्यताम् । शीतोष्णादि विषह्यतां
    न तु वृथा वाक्यं समुच्चार्यता
