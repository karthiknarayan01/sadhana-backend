id: sheshakritamshivastotram
category: stotram
name:
  english: sheshakritamshivastotram
  devanagari: शेषकृतंशिवस्तोत्रम्
content:
  english: sheshakritam shivastotram shesha uvaca | namastrailokyanathaya dakshayajnavibhedine | adikartre
    namastubhyam namastrailokyarupine || 7|| namah sahasrashirase namah samharakarine | somasuryagnirupaya
    jalarupaya te namah || 8|| sarvada sarvarupaya kalarupaya te namah | pahi shankara sarvesha pahi somesha
    sarvaga | jagannatha namastubhyam dehi me manasepsitam || 9|| iti brahmapurane pancadashadhikashatatamadhyayantargatam
    sheshakritam shivastotram samaptam | brahmapurana | adhyaya 115
  devanagari: शेषकृतं शिवस्तोत्रम् शेष उवाच । नमस्त्रैलोक्यनाथाय दक्षयज्ञविभेदिने । आदिकर्त्रे नमस्तुभ्यं
    नमस्त्रैलोक्यरूपिणे ॥ ७॥ नमः सहस्रशिरसे नमः संहारकारिणे । सोमसूर्याग्निरूपाय जलरूपाय ते नमः ॥ ८॥ सर्वदा
    सर्वरूपाय कालरूपाय ते नमः । पाहि शङ्कर सर्वेश पाहि सोमेश सर्वग । जगन्नाथ नमस्तुभ्यं देहि मे मनसेप्सितम्
    ॥ ९॥ इति ब्रह्मपुराणे पञ्चदशाधिकशततमाध्यायान्तर्गतं शेषकृतं शिवस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय
    ११५
meaning: {}
