id: mahapurushacaranaravindastotram
category: stotram
name:
  english: mahapurushacaranaravindastotram
  devanagari: महापुरुषचरणारविन्दस्तोत्रम्
content:
  english: minatapatramakarankushavashankhaih | yaccihnitam paramayogimunindrasevyam vande mahapurusha
    te caranaravindam || 2|| muktipradam paramayogimunindrasevyam tapatrayanalanivaranamadibhutam | vrindavanasthalaviharavinodalilam
    vande mahapurusha te caranaravindam || 3|| vinyastamaratamatha shastasamasta
  devanagari: मीनातपत्रमकराङ्कुशवशङ्खैः । यच्चिह्नितं परमयोगिमुनीन्द्रसेव्यं वन्दे महापुरुष ते चरणारविन्दम्
    ॥ २॥ मुक्तिप्रदं परमयोगिमुनीन्द्रसेव्यं तापत्रयानलनिवारणमादिभूतम् । वृन्दावनस्थलविहारविनोदलीलं वन्दे
    महापुरुष ते चरणारविन्दम् ॥ ३॥ विन्यस्तमरतमथ शस्तसमस्त
meaning: {}
