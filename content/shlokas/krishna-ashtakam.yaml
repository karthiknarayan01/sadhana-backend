id: krishna-ashtakam
category: stotram
name:
  english: Krishna Ashtakam
content:
  english: vasudeva sutam devam kamsa canura mardanam | devaki paramanandam krishnam vande jagadgurum
    || atasi pushpa sankasham hara nupura shobhitam | ratna kankana keyuram krishnam vande jagadgurum
    || kutilalaka samyuktam purnacandra nibhananam | vilasat kundaladharam krishnam vande jagadguram ||
    mandara gandha samyuktam caruhasam caturbhujam | barhi pinchava cudangam krishnam vande jagadgurum
    || utphulla padmapatraksham nila jimuta sannibham | yadavanam shiroratnam krishnam vande jagadgurum
    || rukmini keli samyuktam pitambara sushobhitam | avapta tulasi gandham krishnam vande jagadgurum
    || gopikanam kucadvanda kunkumankita vakshasam | shriniketam maheshvasam krishnam vande jagadgurum
    || shrivatsankam mahoraskam vanamala virajitam | shankhacakra dharam devam krishnam vande jagadgurum
    || krishnashtaka midam punyam pratarutthaya yah pathet | kotijanma kritam papam smaranena vinashyati
    ||
  devanagari: वसुदेव सुतं देवं कंस चाणूर मर्दनम् । देवकी परमानन्दं कृष्णं वन्दे जगद्गुरुम् ॥ अतसी पुष्प
    सङ्काशं हार नूपुर शोभितम् । रत्न कङ्कण केयूरं कृष्णं वन्दे जगद्गुरुम् ॥ कुटिलालक संयुक्तं पूर्णचन्द्र
    निभाननम् । विलसत् कुण्डलधरं कृष्णं वन्दे जगद्गुरम् ॥ मन्दार गन्ध संयुक्तं चारुहासं चतुर्भुजम् । बर्हि
    पिञ्छाव चूडाङ्गं कृष्णं वन्दे जगद्गुरुम् ॥ उत्फुल्ल पद्मपत्राक्षं नील जीमूत सन्निभम् । यादवानां शिरोरत्नं
    कृष्णं वन्दे जगद्गुरुम् ॥ रुक्मिणी केलि संयुक्तं पीताम्बर सुशोभितम् । अवाप्त तुलसी गन्धं कृष्णं वन्दे
    जगद्गुरुम् ॥ गोपिकानां कुचद्वन्द कुङ्कुमाङ्कित वक्षसम् । श्रीनिकेतं महेष्वासं कृष्णं वन्दे जगद्गुरुम्
    ॥ श्रीवत्साङ्कं महोरस्कं वनमाला विराजितम् । शङ्खचक्र धरं देवं कृष्णं वन्दे जगद्गुरुम् ॥ कृष्णाष्टक
    मिदं पुण्यं प्रातरुत्थाय यः पठेत् । कोटिजन्म कृतं पापं स्मरणेन विनश्यति ॥
