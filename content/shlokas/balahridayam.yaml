id: balahridayam
category: hridaya
name:
  english: balahridayam
  devanagari: बालाहृदयम्
content:
  english: mahadeva namastubhyam virupakshaya te namah | balaya hridayam mantram gopyadgopyataram tatha
    || 1|| yasya shravanamatrena mantrasiddhimavapnuyat | balaya hridayam mantram brahmadinam ca durlabham
    || 2|| sakricchravanamatrena vanchitam phalamapnuyat | sancaravan bhavetpanguh muko vagmi tu yo bhavet
    || 3|| asya shribalatripurasundari hridayamahamantrasya dakshinamurtihrishih | panktishchandah | shribalatripurasundari
    devata | aim bijam | sauh shaktih | klim kilakam | shribalatripurasundariprasadasiddhyarthe shribalatripurasundari
    hridaya mahamantra jape viniyogah | mulena dviravrittya kara hridayanyasah | dhyanam
  devanagari: महादेव नमस्तुभ्यं विरूपाक्षाय ते नमः । बालाया हृदयं मन्त्रं गोप्याद्गोप्यतरं तथा ॥ १॥ यस्य
    श्रवणमात्रेण मन्त्रसिद्धिमवाप्नुयात् । बालाया हृदयं मन्त्रं ब्रह्मादीनां च दुर्लभम् ॥ २॥ सकृच्छ्रवणमात्रेण
    वाञ्छितं फलमाप्नुयात् । सञ्चारवान् भवेत्पङ्गुः मूको वाग्मी तु यो भवेत् ॥ ३॥ अस्य श्रीबालात्रिपुरसुन्दरी
    हृदयमहामन्त्रस्य दक्षिणामूर्तिःऋषिः । पङ्क्तिश्छन्दः । श्रीबालात्रिपुरसुन्दरी देवता । ऐं बीजम् । सौः
    शक्तिः । क्लीं कीलकम् । श्रीबालात्रिपुरसुन्दरीप्रसादसिद्ध्यर्थे श्रीबालात्रिपुरसुन्दरी हृदय महामन्त्र
    जपे विनियोगः । मूलेन द्विरावृत्त्या कर हृदयन्यासः । ध्यानम्
