    ॥ वै॒श्वा॒न॒रो न॑ ऊ॒त्यापृ॒ष्टो दि॒व्यनु॑ नो॒ ऽद्यानु॑मति॒रन्विद॑नुमते॒ त्व ङ्कया॑ नश्चि॒त्र आभु॑व॒त्को
