id: shaktisutra
category: sutra
name:
  english: shaktisutra
  devanagari: शक्तिसूत्र
content:
  english: shaktisutrani atha shaktisutrani bhagavadagastyaviracitani | athatah shaktijijnasa || 1|| yatkartri
    || 2|| yadaja || 3|| nantarayo'tra || 4|| tatsannidhyat || 5|| tatkalpakatvamaupadhikam || 6|| samanadharmatvat
    || 7|| tacca pratibhasikam || 8|| yadbandhah || 9|| yadaropadhyasadaikyam || 10|| shabdadhishtanalingam
    || 11|| nanavan || 12|| tacca kalikam || 13|| akhandopadhe || 14|| yameva bhutani vishanti || 15||
    yadotam yatprotam || 16|| tadvishnutvat || 17|| tato jaganti kiyanti || 18|| nanatve'pyekatvamviruddham
    || 19|| vicarat || 20|| yasmadadrishyam drishyanca || 21|| drishtitvavyapadeshadva || 22|| avinabhavitvat
    || 23|| bhinnatve naniyamyatve || 24|| atathavidha || 25|| yatkritih || 26|| icchajnanakriyasvarupatvat
    || 27|| na sannasat || 28|| sadasattvat || 29|| tadbhrantih || 30|| yatsat || 31|| idanimupadhivicarah
    kriyate || 32|| liyata tatraikadeshapravadah || 33|| yasmattaratabhyam jantunam ||34|| saumyam jananamaranayoh
    || 35|| paunahpunyat || 36|| yadeva samsarah || 37|| urnanabhih || 38|| sadrishyanantyam || 39|| tatsiddhireva
    siddhih || 40|| tadvattvat || 41|| yaccaitanyabheda
  devanagari: शक्तिसूत्राणि अथ शक्तिसूत्राणि भगवदगस्त्यविरचितानि । अथातः शक्तिजिज्ञासा ॥ १॥ यत्कर्त्री
    ॥ २॥ यदजा ॥ ३॥ नान्तरयोऽत्र ॥ ४॥ तत्सान्निध्यात् ॥ ५॥ तत्कल्पकत्वमौपाधिकम् ॥ ६॥ समानधर्मत्वात् ॥ ७॥
    तच्च प्रातिभासिकम् ॥ ८॥ यद्बन्धः ॥ ९॥ यदारोपाध्यासादैक्यम् ॥ १०॥ शब्दाधिष्टानलिङ्गम् ॥ ११॥ नानावान्
    ॥ १२॥ तच्च कालिकम् ॥ १३॥ अखण्डोपाधे ॥ १४॥ यामेव भूतानि विशन्ति ॥ १५॥ यदोतं यत्प्रोतम् ॥ १६॥ तद्विष्णुत्वात्
    ॥ १७॥ ततो जगन्ति कियन्ति ॥ १८॥ नानात्वेऽप्येकत्वम्विरुद्धम् ॥ १९॥ विचारात् ॥ २०॥ यस्माददृश्यं दृश्यञ्च
    ॥ २१॥ दृष्टित्वव्यपदेशाद्वा ॥ २२॥ अविनाभावित्वात् ॥ २३॥ भिन्नत्वे नानियाम्यत्वे ॥ २४॥ अतथाविधा ॥ २५॥
    यत्कृतिः ॥ २६॥ इच्छाज्ञानक्रियास्वरूपत्वात् ॥ २७॥ न सन्नासत् ॥ २८॥ सदसत्त्वात् ॥ २९॥ तद्भ्रान्तिः
    ॥ ३०॥ यत्सत् ॥ ३१॥ इदानीमुपाधिविचारः क्रियते ॥ ३२॥ लीयत तत्रैकदेशप्रवादः ॥ ३३॥ यस्मात्तारतभ्यम् जन्तूनाम्
    ॥३४॥ सौम्यं जननमरणयोः ॥ ३५॥ पौनःपुन्यात् ॥ ३६॥ यदेव संसारः ॥ ३७॥ ऊर्णनाभिः ॥ ३८॥ सादृश्यानन्त्यम्
    ॥ ३९॥ तत्सिद्धिरेव सिद्धिः ॥ ४०॥ तद्वत्त्वात् ॥ ४१॥ यच्चैतन्यभेद
