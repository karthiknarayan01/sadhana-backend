id: chanakya-neethi-chapter-15
category: stotram
name:
  english: Chanakya Neethi - Chapter 15
content:
  english: yasya cittam dravibhutam kripaya sarvajantushu | tasya jnanena mokshena kim jatabhasmalepanaih
    || || ekamapyaksharam yastu guruh shishyam prabodhayet | prithivyam nasti taddravyam yaddattva so'nrini
    bhavet || || khalanam kantakanam ca dvividhaiva pratikriya | upananmukhabhango va durato va visarjanam
    || || kucailinam dantamalopadharinam bahvashinam nishthurabhashinam ca | suryodaye castamite shayanam
    vimuncati shriryadi cakrapanih || || tyajanti mitrani dhanairvihinam putrashca darashca suhrijjanashca
    | tamarthavantam punarashrayanti artho hi loke manushyasya bandhuh || || anyayoparjitam dravyam dasha
    varshani tishthati | prapte caikadashe varshe samulam tadvinashyati || || ayuktam svamino yuktam yuktam
    nicasya dushanam | amritam rahave mrityurvisham shankarabhushanam || || tadbhojanam yaddvijabhuktashesham
    tatsauhridam yatkriyate parasmin | sa prajnata ya na karoti papam dambham vina yah kriyate sa dharmah
    || || manirlunthati padagre kacah shirasi dharyate | krayavikrayavelayam kacah kaco manirmanih ||
    || anantashastram bahulashca vidyah svalpashca kalo bahuvighnata ca | yatsarabhutam tadupasaniyam
    hamso yatha kshiramivambumadhyat || || duragatam pathi shrantam vritha ca grihamagatam | anarcayitva
    yo bhunkte sa vai candala ucyate || || pathanti caturo vedandharmashastranyanekashah | atmanam naiva
    jananti darvi pakarasam yatha || || dhanya dvijamayi nauka viparita bhavarnave | tarantyadhogatah
    sarve uparishthah patantyadhah || || ayamamritanidhanam nayako'pyoshadhinam amritamayasharirah kantiyukto'pi
    candrah | bhavativigatarashmirmandalam prapya bhanoh parasadananivishtah ko laghutvam na yati || ||
    alirayam nalinidalamadhyagah kamalinimakarandamadalasah | vidhivashatparadeshamupagatah kutajapushparasam
    bahu manyate || || pitah kruddhena tatashcaranatalahato vallabho yena rosha dabalyadvipravaryaih svavadanavivare
    dharyate vairini me | geham me chedayanti pratidivasamumakantapujanimittam tasmatkhinna sadaham dvijakulanilayam
    natha yuktam tyajami || || bandhanani khalu santi bahuni premarajjukritabandhanamanyat | darubhedanipuno'pi
    shadanghri rnishkriyo bhavati pankajakosheh || || chinno'pi candana tarurna jahati gandham vriddho'pi
    varanapati rnajahati lilam | hantrarpito madhuratam na jahati cekshuh kshino'pi na tyajati shilagunan
    kulinah ||
  devanagari: यस्य चित्तं द्रवीभूतं कृपया सर्वजन्तुषु । तस्य ज्ञानेन मोक्षेण किं जटाभस्मलेपनैः ॥ ॥ एकमप्यक्षरं
    यस्तु गुरुः शिष्यं प्रबोधयेत् । पृथिव्यां नास्ति तद्द्रव्यं यद्दत्त्वा सोऽनृणी भवेत् ॥ ॥ खलानां कण्टकानां
    च द्विविधैव प्रतिक्रिया । उपानन्मुखभङ्गो वा दूरतो वा विसर्जनम् ॥ ॥ कुचैलिनं दन्तमलोपधारिणं बह्वाशिनं
    निष्ठुरभाषिणं च । सूर्योदये चास्तमिते शयानं विमुञ्चति श्रीर्यदि चक्रपाणिः ॥ ॥ त्यजन्ति मित्राणि धनैर्विहीनं
    पुत्राश्च दाराश्च सुहृज्जनाश्च । तमर्थवन्तं पुनराश्रयन्ति अर्थो हि लोके मनुष्यस्य बन्धुः ॥ ॥ अन्यायोपार्जितं
    द्रव्यं दश वर्षाणि तिष्ठति । प्राप्ते चैकादशे वर्षे समूलं तद्विनश्यति ॥ ॥ अयुक्तं स्वामिनो युक्तं
    युक्तं नीचस्य दूषणम् । अमृतं राहवे मृत्युर्विषं शङ्करभूषणम् ॥ ॥ तद्भोजनं यद्द्विजभुक्तशेषं तत्सौहृदं
    यत्क्रियते परस्मिन् । सा प्राज्ञता या न करोति पापं दम्भं विना यः क्रियते स धर्मः ॥ ॥ मणिर्लुण्ठति
    पादाग्रे काचः शिरसि धार्यते । क्रयविक्रयवेलायां काचः काचो मणिर्मणिः ॥ ॥ अनन्तशास्त्रं बहुलाश्च विद्याः
    स्वल्पश्च कालो बहुविघ्नता च । यत्सारभूतं तदुपासनीयां हंसो यथा क्षीरमिवाम्बुमध्यात् ॥ ॥ दूरागतं पथि
    श्रान्तं वृथा च गृहमागतम् । अनर्चयित्वा यो भुङ्क्ते स वै चाण्डाल उच्यते ॥ ॥ पठन्ति चतुरो वेदान्धर्मशास्त्राण्यनेकशः
    । आत्मानं नैव जानन्ति दर्वी पाकरसं यथा ॥ ॥ धन्या द्विजमयी नौका विपरीता भवार्णवे । तरन्त्यधोगताः सर्वे
    उपरिष्ठाः पतन्त्यधः ॥ ॥ अयममृतनिधानं नायकोऽप्योषधीनाम् अमृतमयशरीरः कान्तियुक्तोऽपि चन्द्रः । भवतिविगतरश्मिर्मण्डलं
    प्राप्य भानोः परसदननिविष्टः को लघुत्वं न याति ॥ ॥ अलिरयं नलिनीदलमध्यगः कमलिनीमकरन्दमदालसः । विधिवशात्परदेशमुपागतः
    कुटजपुष्परसं बहु मन्यते ॥ ॥ पीतः क्रुद्धेन तातश्चरणतलहतो वल्लभो येन रोषा दाबाल्याद्विप्रवर्यैः स्ववदनविवरे
    धार्यते वैरिणी मे । गेहं मे छेदयन्ति प्रतिदिवसमुमाकान्तपूजानिमित्तं तस्मात्खिन्ना सदाहं द्विजकुलनिलयं
    नाथ युक्तं त्यजामि ॥ ॥ बन्धनानि खलु सन्ति बहूनि प्रेमरज्जुकृतबन्धनमन्यत् । दारुभेदनिपुणोऽपि षडङ्घ्रि
    र्निष्क्रियो भवति पङ्कजकोशेः ॥ ॥ छिन्नोऽपि चन्दन तरुर्न जहाति गन्धं वृद्धोऽपि वारणपति र्नजहाति लीलाम्
    । हन्त्रार्पितो मधुरतां न जहाति चेक्षुः क्षीणोऽपि न त्यजति शिलगुणान् कुलीनः ॥
