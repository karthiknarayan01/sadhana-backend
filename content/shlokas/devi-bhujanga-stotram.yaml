id: devi-bhujanga-stotram
category: stotram
name:
  english: Devi Bhujanga Stotram
  devanagari: देवीभुजङ्गस्तोत्रम् (शङ्कराचार्यविरचितम्)
content:
  english: '|| shrih || || atha devibhujamgastotram || virincyadibhih pancabhirlokapalaih samudhe mahanandapithe
    nishannam | dhanurbanapashankushaprotahastam mahastraipuram shamkaradvaitamavyat || 1|| yadannadibhih
    pancabhih koshajalaih shirahpakshapucchatmakairantarantah | nigudhe mahayogapithe nishannam purarerathantahpuram
    naumi nityam || 2|| virincadirupaih prapance vihritya svatantra yada svatmavishrantiresha | tada manamatriprameyatiriktam
    paranandamide bhavani tvadiyam || 3|| vinodaya caitanyamekam vibhajya dvidha devi jivah shivashreti
    namna | shivasyapi jivatvamapadayanti punarjivamenam shivam va karoshi || 4|| samakuncya mulam hridi
    nyasya vayum mano bhrubilam prapayitva nivrittah | tatah saccidanandarupe pade te bhavantyamba jivah
    shivatvena kecit || 5|| sharire''tikashte ripau putravarge sadabhitimule kalatre dhane va | na kashcidvirajyatyaho
    devi citram katham tvatkataksham vina tattvabodhah || 6|| sharire dhane''patyavarge kalatre viraktasya
    saddeshikadishtabuddheh | yadakasmikam jyotiranandarupam samadhau bhavettattvamasyamba satyam || 7||
    mrishanyo mrishanyah paro mishramenam parah prakritam caparo buddhimatram | prapancam mimite muninam
    gano''yam tadetattvameveti na tvam jahimah || 8|| nivrittih pratishtha ca vidya ca shanti- statha
    shantyatiteti pancikritabhih | kalabhih pare pancavimshatmikabhi- stvamekaiva sevya shivabhinnarupa
    || 9|| agadhe''tra samsarapanke nimagnam kalatradibharena khinnam nitantam | mahamohapashaughabaddham
    ciranmam samuddhartumamba tvamekaiva shakta || 10|| samarabhya mulam gato brahmacakram bhavaddivyacakreshvaridhamabhajah
    | mahasiddhisamghatakalpadrumabha- navapyamba nadanupaste ca yogi || 11|| ganeshairgrahairamba nakshatrapanktya
    tatha yoginirashipithairabhinnam | mahakalamatmanamamrishya lokam vidhatse kritim va sthitim va maheshi
    || 12|| lasattaraharamatisvacchacelam vahantim kare pustakam cakshamalam | sharaccandrakotiprabhabhasuram
    tvam sakridbhavayanbharativallabhah syat || 13|| samudyatsahasrarkabimbabhavaktram svabhasaiva sinduritajandakotim
    | dhanurbanapashankushandharayantim smarantah smaram vapi sammohayeyuh || 14|| manisyutatatankashonasyabimbam
    haritpattavastram tvagullasibhusham | hrida bhavayamstaptahemaprabham tvam shriyo nashayatyamba cancalyabhavam
    || 15|| mahamantrarajantabijam parakhyam svato nyastabindu svayam nyastahardam | bhavadvaktravakshojaguhyabhidhanam
    svarupam sakridbhavayetsa tvameva || 16|| tathanye vikalpeshu nirvinnacitta- stadekam samadhaya bindutrayam
    te | paranandasamdhanasindhau nimagnah punargarbharandhram na pashyanti dhirah || 17|| tvadunmeshalilanubandhadhikara-
    nvirincyadikamstvadgunambhodhibindun | bhajantastitirshanti samsarasindhum shive tavakina susambhavaneyam
    || 18|| kada va bhavatpadapotena turnam bhavambhodhimuktirya purnantarangah | nimajjantamenam durashavishabdhau
    samalokya lokam katham paryudasse || 19|| kadava hrishikani samyam bhajeyuh kada va na shatrurna mitram
    bhavani | kada va durashavishucivilopah kada va mano me samulam vinashyet || 20|| namovakamashasmahe
    devi yushma- tpadambhojayugmaya tigmaya gauri | virincyadibhasvatkiritapratoli- pradipayamanaprabhabhasvaraya
    || 21|| kace candrarekham kuce taraharam kare svaducapam share shatpadaugham | smarami smararerabhiprayamekam
    madaghurnanetram madiyam nidhanam || 22|| shareshveva nasa dhanushveva jihva japapatale locane te
    svarupe | tvagesha bhavaccandrakhande shravo me gune te manovrittiramba tvayi syat || 23|| jagatkarmadhiranvacodhutakiran
    kucanyastaharankripasindhupuran | bhavambhodhiparanmahapapaduran bhaje vedasaranshivapremadaran ||
    24|| sudhasindhusare cidanandanire samutphullanipe suratrantaripe | manivyuhasale sthite haimashale
    manojarivame nishannam mano me || 25|| drigante vilola sugandhishumala prapancendrajala vipatsindhukula
    | munisvantashala namallokapala hridi premalolamritasvadulila || 26|| jagajjalametattvayaivamba srishtam
    tvamevadya yasindriyairarthajalam | tvavekaiva kartri tvamekaiva bhoktri na me punyapape na me bandhamokshau
    || 27|| iti premabharena kincinmayoktam na budhvaiva tattvam madiyam tvadiyam | vinodaya balasya maurkhyam
    hi mata- stadetatpralapastutim me grihana || 28||m iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya
    shrimacchamkarabhagavatah kritau devibhujamgastotram sampurnam || %date: thu, 17 aug 2000 01:09:18
    -0400 (Edt)'
  devanagari: '॥ श्रीः ॥ ॥ अथ देवीभुजंगस्तोत्रम् ॥ विरिञ्च्यादिभिः पञ्चभिर्लोकपालैः समूढे महानन्दपीठे
    निषण्णम् । धनुर्बाणपाशाङ्कुशप्रोतहस्तं महस्त्रैपुरं शंकराद्वैतमव्यात् ॥ १॥ यदन्नादिभिः पञ्चभिः कोशजालैः
    शिरःपक्षपुच्छात्मकैरन्तरन्तः । निगूढे महायोगपीठे निषण्णं पुरारेरथान्तःपुरं नौमि नित्यम् ॥ २॥ विरिञ्चादिरूपैः
    प्रपञ्चे विहृत्य स्वतन्त्रा यदा स्वात्मविश्रान्तिरेषा । तदा मानमातृप्रमेयातिरिक्तं परानन्दमीडे भवानि
    त्वदीयम् ॥ ३॥ विनोदाय चैतन्यमेकं विभज्य द्विधा देवि जीवः शिवश्रेति नाम्ना । शिवस्यापि जीवत्वमापादयन्ती
    पुनर्जीवमेनं शिवं वा करोषि ॥ ४॥ समाकुञ्च्य मूलं हृदि न्यस्य वायुं मनो भ्रूबिलं प्रापयित्वा निवृत्ताः
    । ततः सच्चिदानन्दरूपे पदे ते भवन्त्यम्ब जीवाः शिवत्वेन केचित् ॥ ५॥ शरीरेऽतिकष्टे रिपौ पुत्रवर्गे सदाभीतिमूले
    कलत्रे धने वा । न कश्चिद्विरज्यत्यहो देवि चित्रं कथं त्वत्कटाक्षं विना तत्त्वबोधः ॥ ६॥ शरीरे धनेऽपत्यवर्गे
    कलत्रे विरक्तस्य सद्देशिकादिष्टबुद्धेः । यदाकस्मिकं ज्योतिरानन्दरूपं समाधौ भवेत्तत्त्वमस्यम्ब सत्यम्
    ॥ ७॥ मृषान्यो मृषान्यः परो मिश्रमेनं परः प्राकृतं चापरो बुद्धिमात्रम् । प्रपञ्चं मिमीते मुनीनां गणोऽयं
    तदेतत्त्वमेवेति न त्वां जहीमः ॥ ८॥ निवृत्तिः प्रतिष्ठा च विद्या च शान्ति- स्तथा शान्त्यतीतेति पञ्चीकृताभिः
    । कलाभिः परे पञ्चविंशात्मिकाभि- स्त्वमेकैव सेव्या शिवाभिन्नरूपा ॥ ९॥ अगाधेऽत्र संसारपङ्के निमग्नं
    कलत्रादिभारेण खिन्नं नितान्तम् । महामोहपाशौघबद्धं चिरान्मां समुद्धर्तुमम्ब त्वमेकैव शक्ता ॥ १०॥ समारभ्य
    मूलं गतो ब्रह्मचक्रं भवद्दिव्यचक्रेश्वरीधामभाजः । महासिद्धिसंघातकल्पद्रुमाभा- नवाप्याम्ब नादानुपास्ते
    च योगी ॥ ११॥ गणेशैर्ग्रहैरम्ब नक्षत्रपङ्क्त्या तथा योगिनीराशिपीठैरभिन्नम् । महाकालमात्मानमामृश्य लोकं
    विधत्से कृतिं वा स्थितिं वा महेशि ॥ १२॥ लसत्तारहारामतिस्वच्छचेलां वहन्तीं करे पुस्तकं चाक्षमालाम्
    । शरच्चन्द्रकोटिप्रभाभासुरां त्वां सकृद्भावयन्भारतीवल्लभः स्यात् ॥ १३॥ समुद्यत्सहस्रार्कबिम्बाभवक्त्रां
    स्वभासैव सिन्दूरिताजाण्डकोटिम् । धनुर्बाणपाशाङ्कुशान्धारयन्तीं स्मरन्तः स्मरं वापि संमोहयेयुः ॥ १४॥
    मणिस्यूतताटङ्कशोणास्यबिम्बां हरित्पट्टवस्त्रां त्वगुल्लासिभूषाम् । हृदा भावयंस्तप्तहेमप्रभां त्वां
    श्रियो नाशयत्यम्ब चाञ्चल्यभावम् ॥ १५॥ महामन्त्रराजान्तबीजं पराख्यं स्वतो न्यस्तबिन्दु स्वयं न्यस्तहार्दम्
    । भवद्वक्त्रवक्षोजगुह्याभिधानं स्वरूपं सकृद्भावयेत्स त्वमेव ॥ १६॥ तथान्ये विकल्पेषु निर्विण्णचित्ता-
    स्तदेकं समाधाय बिन्दुत्रयं ते । परानन्दसंधानसिन्धौ निमग्नाः पुनर्गर्भरन्ध्रं न पश्यन्ति धीराः ॥ १७॥
    त्वदुन्मेषलीलानुबन्धाधिकारा- न्विरिञ्च्यादिकांस्त्वद्गुणाम्भोधिबिन्दून् । भजन्तस्तितीर्षन्ति संसारसिन्धुं
    शिवे तावकीना सुसंभावनेयम् ॥ १८॥ कदा वा भवत्पादपोतेन तूर्णं भवाम्भोधिमुक्तीर्य पूर्णान्तरङ्गः । निमज्जन्तमेनं
    दुराशाविषाब्धौ समालोक्य लोकं कथं पर्युदास्से ॥ १९॥ कदावा हृषीकाणि साम्यं भजेयुः कदा वा न शत्रुर्न
    मित्रं भवानि । कदा वा दुराशाविषूचीविलोपः कदा वा मनो मे समूलं विनश्येत् ॥ २०॥ नमोवाकमाशास्महे देवि
    युष्म- त्पदाम्भोजयुग्माय तिग्माय गौरि । विरिञ्च्यादिभास्वत्किरीटप्रतोली- प्रदीपायमानप्रभाभास्वराय
    ॥ २१॥ कचे चन्द्ररेखं कुचे तारहारं करे स्वादुचापं शरे षट्पदौघम् । स्मरामि स्मरारेरभिप्रायमेकं मदाघूर्णनेत्रं
    मदीयं निधानम् ॥ २२॥ शरेष्वेव नासा धनुष्वेव जिह्वा जपापाटले लोचने ते स्वरूपे । त्वगेषा भवच्चन्द्रखण्डे
    श्रवो मे गुणे ते मनोवृत्तिरम्ब त्वयि स्यात् ॥ २३॥ जगत्कर्मधीरान्वचोधूतकीरान् कुचन्यस्तहारान्कृपासिन्धुपूरान्
    । भवाम्भोधिपारान्महापापदूरान् भजे वेदसाराञ्शिवप्रेमदारान् ॥ २४॥ सुधासिन्धुसारे चिदानन्दनीरे समुत्फुल्लनीपे
    सुरत्रान्तरीपे । मणिव्यूहसाले स्थिते हैमशाले मनोजारिवामे निषण्णं मनो मे ॥ २५॥ दृगन्ते विलोला सुगन्धीषुमाला
    प्रपञ्चेन्द्रजाला विपत्सिन्धुकूला । मुनिस्वान्तशाला नमल्लोकपाला हृदि प्रेमलोलामृतस्वादुलीला ॥ २६॥
    जगज्जालमेतत्त्वयैवाम्ब सृष्टं त्वमेवाद्य यासीन्द्रियैरर्थजालम् । त्ववेकैव कर्त्री त्वमेकैव भोक्त्री
    न मे पुण्यपापे न मे बन्धमोक्षौ ॥ २७॥ इति प्रेमभारेण किञ्चिन्मयोक्तं न बुध्वैव तत्त्वं मदीयं त्वदीयं
    । विनोदाय बालस्य मौर्ख्यं हि मात- स्तदेतत्प्रलापस्तुतिं मे गृहाण ॥ २८॥ं इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य
    श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छंकरभगवतः कृतौ देवीभुजंगस्तोत्रं सम्पूर्णम् ॥ %डते: ठु, १७
    आउग् २००० ०१:०९:१८ -०४०० (Eड्ट्)'
