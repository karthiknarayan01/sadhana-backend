id: candrakritam1shivastotram
category: stotram
name:
  english: candrakritam1shivastotram
  devanagari: चन्द्रकृतं१शिवस्तोत्रम्
content:
  english: candrakritam 1 shivastotram candra uvaca | om namo devadevaya shivaya paramatmane | aprameyasvarupaya
    vyaktavyaktasvarupine || 32|| tvam patiryoginamisha tvayi sarvam pratishthitam | tvam yajnastvam vashatkarastvamonkarah
    prajapatih || 33|| caturvimshatyadhikam ca bhuvananam shatadvayam | tasyopari param jyotirjagarti
    tava kevalam || 34|| kalpanta adivarahamuktabrahmandasamsthitau | adharastambhabhutaya tejolingaya
    te namah || 35|| namo'namayanamne te namaste krittivasase | namo bhairavanathaya namah someshvaraya
    te || 36|| iti samjnabhiretabhih stutyabhiramriteshvarah | bhutairbhavyairbhavishyaishca stuyase surasattamaih
    || 37|| adyo virancinamabhudbrahma lokapitamahah | mrityunjayeti te nama tada'bhutparvatipate || 38||
    dvitiyo'bhudyada brahma padmabhuriti vishrutah | tada kalagnirudreti tava nama prakirtitam || 39||
    tritiyo'bhudyada brahma svayambhuriti vishrutah | amritesheti te nama kirtitam kirtivarddhanam ||
    1
  devanagari: चन्द्रकृतं १ शिवस्तोत्रम् चन्द्र उवाच । ॐ नमो देवदेवाय शिवाय परमात्मने । अप्रमेयस्वरूपाय
    व्यक्ताव्यक्तस्वरूपिणे ॥ ३२॥ त्वं पतिर्योगिनामीश त्वयि सर्वं प्रतिष्ठितम् । त्वं यज्ञस्त्वं वषट्कारस्त्वमोङ्कारः
    प्रजापतिः ॥ ३३॥ चतुर्विंशत्यधिकं च भुवनानां शतद्वयम् । तस्योपरि परं ज्योतिर्जागर्ति तव केवलम् ॥ ३४॥
    कल्पान्त आदिवाराहमुक्तब्रह्माण्डसंस्थितौ । आधारस्तम्भभूताय तेजोलिङ्गाय ते नमः ॥ ३५॥ नमोऽनामयनाम्ने
    ते नमस्ते कृत्तिवाससे । नमो भैरवनाथाय नमः सोमेश्वराय ते ॥ ३६॥ इति संज्ञाभिरेताभिः स्तुत्याभिरमृतेश्वरः
    । भूतैर्भव्यैर्भविष्यैश्च स्तूयसे सुरसत्तमैः ॥ ३७॥ आद्यो विरञ्चिनामाभूद्ब्रह्मा लोकपितामहः । मृत्युञ्जयेति
    ते नाम तदाऽभूत्पार्वतीपते ॥ ३८॥ द्वितीयोऽभूद्यदा ब्रह्मा पद्मभूरिति विश्रुतः । तदा कालाग्निरुद्रेति
    तव नाम प्रकीर्तितम् ॥ ३९॥ तृतीयोऽभूद्यदा ब्रह्मा स्वयम्भूरिति विश्रुतः । अमृतेशेति ते नाम कीर्तितं
    कीर्तिवर्द्धनम् ॥ १
