id: agnyashtottarashatanamastotram-sambadikshitena-sankalitam
category: stotram
name:
  english: agnyashtottarashatanamastotram (sambadikshitena sankalitam)
  devanagari: अग्न्यष्टोत्तरशतनामस्तोत्रम् (साम्बदीक्षितेन सङ्कलितम्)
content:
  english: rinvannashuhemo'pya asannasura ahutah | aditya apirabadha akutiraghrinivasuh || 2|| idhana
    iddha indhano dadhatsahasrinirishah | idya iḻenya ishana ishayanniḻa iḻitah || 3|| ukthya ukshannukshamana
    ukshanno divamutpatan | urjahputra urjasana urdhva urjonapadushan || 4|| rijuyamanah prithivimutadyamrita
    ritviyah | ritapravita ritacidritavadrindha rigmiyah || 5|| rishunam putra rishikridritavridhritupa
    ribhuh | rishinam putra rishabha ribhva ritupatirrishih || 6|| ritupati oshadhinam garbha eka ojishthashcarshanisadam
    | kakutkakudmankratuvit krishnayamah kanikradat || 7|| kanvatamah kanvasakhah kevalah krishnavartanih
    | kapih kavih kavitamah kavishastah kavikratuh || 8|| kaviprashastah krishnadhva kravyadah kravyavahanah
    | kshatrani dharayan kshatrah kshapavan kshatrabhrit kshayah || 9|| ganashrishcaratham garbho'pam
    garbho gatuvittamah | bahvinamapasam garbhasthatam garbho guhahitah || 10|| gritso grihapatirgridhnurgopa
    ghorashcanohitah | jatavedastapurmurdha dirghatanturdhritavratah || 11|| brihadbhanurmadhuvaca yajno
    ranvo vanaspatih | devanamavagamyagneh namnamashtottaram shatam || 12|| || agneh ashtottarashatanamastotram
    sampurnam ||
  devanagari: ृण्वन्नाशुहेमोऽप्य आसन्नासुर आहुतः । आदित्य आपिराबाध आकूतिराघृणीवसुः ॥ २॥ इधान इद्ध इन्धानो
    दधत्सहस्रिणीरिषः । ईड्य ईळेन्य ईशान ईषयन्निळ ईळितः ॥ ३॥ उक्थ्य उक्षन्नुक्षमाण उक्षान्नो दिवमुत्पतन्
    । ऊर्जःपुत्र ऊर्जसन ऊर्ध्व ऊर्जोनपादूशन् ॥ ४॥ ऋजूयमानः पृथिवीमुतद्यामृत ऋत्वियः । ऋतप्रवीत ऋतचिदृतावदृन्ध
    ऋग्मियः ॥ ५॥ ऋषूणां पुत्र ऋषिकृदृतवृधृतुपा ऋभुः । ऋषीणां पुत्र ऋषभ ऋभ्व ऋतुपतिरृषिः ॥ ६॥ ऋतुपाति ओषधीनां
    गर्भ एक ओजिष्ठश्चर्षणीसदाम् । ककुत्ककुद्मान्क्रतुवित् कृष्णयामः कनिक्रदत् ॥ ७॥ कण्वतमः कण्वसखः केवलः
    कृष्णवर्तनिः । कपिः कविः कवितमः कविशस्तः कविक्रतुः ॥ ८॥ कविप्रशस्तः कृष्णाध्वा क्रव्यादः क्रव्यवाहनः
    । क्षत्राणि धारयन् क्षत्रः क्षपावान् क्षत्रभृत् क्षयः ॥ ९॥ गणश्रीश्चरथां गर्भोऽपां गर्भो गातुवित्तमः
    । बह्वीनामपसां गर्भस्थातां गर्भो गुहाहितः ॥ १०॥ गृत्सो गृहपतिर्गृध्नुर्गोपा घोरश्चनोहितः । जातवेदास्तपुर्मूर्धा
    दीर्घतन्तुर्धृतव्रतः ॥ ११॥ बृहद्भानुर्मधुवचा यज्ञो रण्वो वनस्पतिः । देवानामवगम्याग्नेः नाम्नामष्टोत्तरं
    शतम् ॥ १२॥ ॥ अग्नेः अष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥
