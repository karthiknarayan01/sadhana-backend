id: mahalakshmilalitastotra
category: stotram
name:
  english: mahalakshmilalitastotra
  devanagari: महालक्श्मीललितास्तोत्र
content:
  english: shrimahalakshmi lalitastotram || dhyanam || cakrakaram mahattejah tanmadhye parameshvari |
    jaganmata jivadatri narayani parameshvari || 1|| vyuhatejomayi brahmanandini harisundari | pashamkushekshukodanda
    padmamalalasatkara || 2|| drishtva tam mumuhurdevah pranemurvigatajvarah | tushtuvuh shrimahalakshmim
    lalitam vaishnavim param || 3|| || shridevah ucuh || jaya lakshmi jaganmatah jaya lakshmi paratpare
    | jaya kalyananilaye jaya sarvakalatmike || 1|| jaya brahmi mahalakshmi brahmatmike paratmike | jaya
    narayani shante jaya shrilalite rame || 2|| jaya shrivijaye devishvari shride jayarddhide | namah
    sahasra shirshayai sahasranana locane || 3|| namah sahasrahastabjapadapankajashobhite | anoranutare
    lakshmi mahato'pi mahiyasi || 4|| atalam te smritau padau vitalam januni tava | rasatalam katiste
    ca kukshiste prithivi mata || 5|| hridayam bhuvah svaste'stu mukham satyam shiro matam | drishashcandrarkadahana
    dishah karna bhujah surah || 6|| marutastu tavocchvasa vacaste shrutayo matah | krida te lokaracana
    sakha te parameshvarah || 7|| aharaste sadanando vasaste hridayo hareh | drishyadrishyasvarupani rupani
    bhuvanani te || 8|| shiroruha ghanaste vai tarakah kusumani te | dharmadya bahavaste ca kaladya hetayastava
    || 9|| yamashca niyamashcapi karapadanakhastava | stanau svahasvadhakarau sarvajivanadugdhadau ||
    10|| pranayamastava shvaso rasana te sarasvati | mahiruhaste'ngaruhah prabhatam vasanam tava || 11||
    adau daya dharmapatni sasarja nikhilah prajah | hritstha tvam vyapini lakshmih mohini tvam tatha para
    || 12|| idanim drishyase brahmi narayani priyashankari | namastasyai mahalakshmyai gajamukhyai namo
    namah || 13|| sarvashaktyai sarvadhatryai mahalakshmyai namo namah | ya sasarja virajam ca tato'jam
    vishnumishvaram || 14|| rudam tatha suragraya~shca tasyai lakshmyai namo namah | trigunayai nirgunayai
    harinyai te namo namah || 15|| yantratantratmikayai te jaganmatre namo namah | vagvibhutyai gurutanvyai
    mahalakshmyai namo namah || 16|| kambharayai sarvavidyabharayai te namo namah | jayalalitapancali
    ramatanvai namo namah || 17|| padmavatiramahamsi suguna''jnashriyai namah | namah stuta prasanaivamchandayamasa
    savdaraih || 18|| || phalashrutih || shrilakshmi uvaca | stavaka me bhavishyanti shriyashodharmasambhritah
    | vidyavinayasampanna niroga dirghajivinah || 1|| putramitrakalatradhya bhavishyanti susampadah |
    pathanacchravanadasya shatrubhitirvinashyati || 2|| rajabhitih kadanani vinashyanti na samshayah |
    bhuktim muktim bhagyavriddhimuttamam ca labhennarah || 3|| || shrilakshminarayanasamhitayam devasanghakrita
    shrimahalakshmilalitastotram ||
  devanagari: श्रीमहालक्ष्मी ललितास्तोत्रम् ॥ ध्यानम् ॥ चक्राकारं महत्तेजः तन्मध्ये परमेश्वरी । जगन्माता
    जीवदात्री नारायणी परमेश्वरी ॥ १॥ व्यूहतेजोमयी ब्रह्मानन्दिनी हरिसुन्दरी । पाशांकुशेक्षुकोदण्ड पद्ममालालसत्करा
    ॥ २॥ दृष्ट्वा तां मुमुहुर्देवाः प्रणेमुर्विगतज्वराः । तुष्टुवुः श्रीमहालक्ष्मीं ललितां वैष्णवीं पराम्
    ॥ ३॥ ॥ श्रीदेवाः ऊचुः ॥ जय लक्ष्मि जगन्मातः जय लक्ष्मि परात्परे । जय कल्याणनिलये जय सर्वकलात्मिके
    ॥ १॥ जय ब्राह्मि महालक्ष्मि ब्रह्मात्मिके परात्मिके । जय नारायणि शान्ते जय श्रीललिते रमे ॥ २॥ जय श्रीविजये
    देवीश्वरि श्रीदे जयर्द्धिदे । नमः सहस्र शीर्षायै सहस्रानन लोचने ॥ ३॥ नमः सहस्रहस्ताब्जपादपङ्कजशोभिते
    । अणोरणुतरे लक्ष्मि महतोऽपि महीयसि ॥ ४॥ अतलं ते स्मृतौ पादौ वितलं जानुनी तव । रसातलं कटिस्ते च कुक्षिस्ते
    पृथिवी मता ॥ ५॥ हृदयं भुवः स्वस्तेऽस्तु मुखं सत्यं शिरो मतम् । दृशश्चन्द्रार्कदहना दिशः कर्णा भुजः
    सुराः ॥ ६॥ मरुतस्तु तवोच्छ्वासा वाचस्ते श्रुतयो मताः । क्रिडा ते लोकरचना सखा ते परमेश्वरः ॥ ७॥ आहारस्ते
    सदानन्दो वासस्ते हृदयो हरेः । दृश्यादृश्यस्वरूपाणि रूपाणि भुवनानि ते ॥ ८॥ शिरोरुहा घनास्ते वै तारकाः
    कुसुमानि ते । धर्माद्या बाहवस्ते च कालाद्या हेतयस्तव ॥ ९॥ यमाश्च नियमाश्चापि करपादनखास्तव । स्तनौ
    स्वाहास्वधाकारौ सर्वजीवनदुग्धदौ ॥ १०॥ प्राणायामस्तव श्वासो रसना ते सरस्वती । महीरुहास्तेऽङ्गरुहाः
    प्रभातं वसनं तव ॥ ११॥ आदौ दया धर्मपत्नी ससर्ज निखिलाः प्रजाः । हृत्स्था त्वं व्यापिनी लक्ष्मीः मोहिनी
    त्वं तथा परा ॥ १२॥ इदानीं दृश्यसे ब्राह्मी नारायणी प्रियशङ्करी । नमस्तस्यै महालक्ष्म्यै गजमुख्यै नमो
    नमः ॥ १३॥ सर्वशक्त्यै सर्वधात्र्यै महालक्ष्म्यै नमो नमः । या ससर्ज विराजं च ततोऽजं विष्णुमीश्वरम्
    ॥ १४॥ रुदं तथा सुराग्रयाँश्च तस्यै लक्ष्म्यै नमो नमः । त्रिगुणायै निर्गुणायै हरिण्यै ते नमो नमः ॥
    १५॥ यन्त्रतन्त्रात्मिकायै ते जगन्मात्रे नमो नमः । वाग्विभूत्यै गुरुतन्व्यै महालक्ष्म्यै नमो नमः ॥
    १६॥ कम्भरायै सर्वविद्याभरायै ते नमो नमः । जयाललितापाञ्चाली रमातन्वै नमो नमः ॥ १७॥ पद्मावतीरमाहंसी
    सुगुणाऽऽज्ञाश्रियै नमः । नमः स्तुता प्रसनैवंछन्दयामास सव्दरैः ॥ १८॥ ॥ फलश्रुतिः ॥ श्रीलक्ष्मी उवाच
    । स्तावका मे भविश्यन्ति श्रीयशोधर्मसम्भृताः । विद्याविनयसम्पन्ना निरोगा दीर्घजीविनः ॥ १॥ पुत्रमित्रकलत्राढ्या
    भविष्यन्ति सुसम्पदः । पठनाच्छ्रवणादस्य शत्रुभीतिर्विनश्यति ॥ २॥ राजभीतिः कदनानि विनश्यन्ति न संशयः
    । भुक्तिं मुक्तिं भाग्यवृद्धिमुत्तमां च लभेन्नरः ॥ ३॥ ॥ श्रीलक्ष्मीनारायणसंहितायां देवसङ्घकृता श्रीमहालक्ष्मीललितास्तोत्रम्
    ॥
