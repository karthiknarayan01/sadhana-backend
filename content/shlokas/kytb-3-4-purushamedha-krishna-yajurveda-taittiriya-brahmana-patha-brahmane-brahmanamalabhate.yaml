id: kytb-3-4-purushamedha-krishna-yajurveda-taittiriya-brahmana-patha-brahmane-brahmanamalabhate
category: stotram
name:
  english: KYTB 3.4 Purushamedha - Krishna Yajurveda Taittiriya Brahmana Patha - Brahmane Brahmanamalabhate
content:
  english: krishna yajurvediya taittiriya brahmane tritiyashtake caturthah prapathakah shri gurubhyo namah
    | harih om || purushamedhah brahmane brahmanamalabhate | kshatraya rajanya m | marudbhyo vaishya m
    | tapase shudram | tamase taskaram | narakaya virahana klibam | akrayayayogum | kamaya pugg shcalum
    | atikrushtaya magadham || gitaya sutam | nrittaya shailusham | dharmaya sabhacaram | narmaya rebham
    | narishthayai bhimalam | hasaya kari m | anandaya strishakham | pramude kumariputram | medhayai rathakaram
    | dhairyaya takshanam || shramaya kaulalam | mayayai karmaram | rupaya manikaram | shubhe vapam |
    sharavyaya ishukaram | hetyai dhanvakaram | karmane jyakaram | dishtaya rajjusargam | mrityave mrigayum
    | antakaya shvanita sandhaye jaram | gehayopapatim | nir rityai parivittam | artyai parivividanam
    | ara m | pavitraya bhishaja m | prajnanaya nakshatradara sham | nishkrityai peshaskarim | balayo
    padam | varnayanurudha nadibhyah paunjishtam | rikshika bhyo naishadam | purushavyaghraya durmada
    m | prayudbhya unmattam | gandharvaphsarabhyo vratya m | sarpadevajanebhyo 'pratipadam | ave bhyah
    kitavam | iryataya akitavam | pishacebhyo bidalakaram | yatudhane uthsadebhyah kubjam | pramude vamanam
    | dvarbhya ssramam | svapnayandham | adharmaya badhiram | sajnannaya smarakarim | prakamodyayopasada
    m | upashikshaya abhiprashnina m | maryadayai prashnavivakam || stenahridayam | vairahatyaya pishunam
    | vivittyai kshattara m | aupadrashtaya sangrahitara m | balayanucaram | bhumne parishkandam | priyaya
    priyavadina m | arishtya ashvasadam | medhaya vasah palpulim | prakamaya rajayitrim || bhayai darvaharam
    | prabhaya agnendham | nakasya prishthayabhishektara m | braddhnasya vishtapaya patranirnegam | devalokaya
    peshitara m | manushyalokaya prakaritara bhyo lokebhya upasektara m | avartyai vadhayopamanthitara
    m | suvargaya lokaya bhagadugha shishthaya nakaya pariveshtara bhyo hastipam | javaya shvapam | pushtyai
    gopalam | tejase 'japalam | viryayavipalam | irayai kinasha m | kilalaya surakaram | bhadraya grihapam
    | shreyase vittadham | addhyakshayanukshattara 'yastapam | krodhaya nisaram | shokayabhisaram | utkulavikulabhya
    m | yogaya yoktara m | kshemaya vimoktara m | vapushe manaskritam | shilayanjanikaram | nir rityai
    koshakarim | yamayasum || yamyai yamasum | atharvabhyo va~thsaraya paryarini m | parivathsarayavijatam
    | idavathsarayapaskadvarim | idvathsarayatitvarim | vathsaraya vijarjaram | sarvathsamraya paliknim
    | vanaya vanapam | anyatoranyaya davapam || bhyo dhaivaram | veshantabhyo dasha m | upasthavaribhyo
    bainda m | nadvalabhyah shaushkalam | paryaya kaivartam | avaryaya margaram | tirthebhya andam | vishamebhyo
    mainalam | svane bhyah parnakam | guha bhyah kiratam | sanubhyo jambhakam | parvatebhyah ki pratishrutkaya
    ritulam | ghoshaya bhasham | antaya bahuvadina m | mahase vinavadam | kroshaya tunavaddhmam | akrandaya
    dundubhyaghatam | avarasparaya shankhaddhmam | ribhubhyo 'jinasandhayam | saddhyebhyashcarmamnam ||
    bibhathsayai paulkasam | bhutyai jagaranam | abhu tyai svapanam | tulayai vanijam | varnaya hiranyakaram
    | vishve bhyo devebhyah siddhmalam | pashca ddoshaya glavam | rityai janavadina m | vyriddhya apagalbham
    | sagmsharaya pracchida shcalumalabhate | vinavada ngitaya | yadase shabulyam | narmaya bhadravatim
    | tunavaddhma nnrittaya | modayanukroshakam | anandaya talavam || aksharajaya kitavam | kritaya sabhavina
    m | tretaya adinavadarsham | dvaparaya bahi m | kalaye sabhasthanum | dushkritaya carakacaryam | addhvane
    brahmacarina m | pishacebhyah sailagam | pipasayai govyaccham | nir rityai goghatam | kshudhe govikartam
    | kshuttrishnabhya mbhikshamana upatishthate || bhumyai pithasarpinamalabhate | agnaye 'gmsalam |
    vayave candalam | antarikshaya vagmshanartina m | dive khalatim | suryaya haryaksham | candramase
    mirmiram | nakshatrebhyah kilasa mpingalam | ratriyai krishna vace purushamalabhate | pranamapanam
    vya~namudanagm samana | suryaya cakshuralabhate | manashcandramase | dibhya m | prajapataye purusham
    || athaitanarupebhya alabhate | atihrasva matidirgham | atikrishamatyagmsalam | atishukla matikrishnam
    | atishlakshna matilomasham | atikirita matidanturam | atimirmira matimemisham | ashayai jamim | pratikshayai
    kumarim || ksharajaya trayodasha navaikanna vigmshatih || harih om || || krishna yajurvediya taittiriya
    brahmane tritiyashtake caturtha prapathaka
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे तृतीयाष्टके चतुर्थः प्रपाठकः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ पुरुषमेधः ब्रह्म॑णे ब्राह्म॒णमाल॑भते । क्ष॒त्राय॑ राज॒न्य म् । म॒रुद्भ्यो॒ वैश्य म् । तप॑से
    शू॒द्रम् । तम॑से॒ तस्क॑रम् । नार॑काय वीर॒हण क्ली॒बम् । आ॒क्र॒याया॑यो॒गूम् । कामा॑य पुग्ग् श्च॒लूम्
    । अति॑क्रुष्टाय माग॒धम् ॥ गी॒ताय॑ सू॒तम् । नृ॒त्ताय॑ शैलू॒षम् । धर्मा॑य सभाच॒रम् । न॒र्माय॑ रे॒भम्
    । नरि॑ष्ठायै भीम॒लम् । हसा॑य॒ कारि म् । आ॒न॒न्दाय॑ स्त्रीष॒खम् । प्र॒मुदे॑ कुमारीपु॒त्रम् । मे॒धायै॑
    रथका॒रम् । धैर्या॑य॒ तक्षा॑णम् ॥ श्रमा॑य कौला॒लम् । मा॒यायै॑ कार्मा॒रम् । रू॒पाय॑ मणिका॒रम् । शुभे॑
    व॒पम् । श॒र॒व्या॑या इषुका॒रम् । हे॒त्यै ध॑न्वका॒रम् । कर्म॑णे ज्याका॒रम् । दि॒ष्टाय॑ रज्जुस॒र्गम्
    । मृ॒त्यवे॑ मृग॒युम् । अन्त॑काय श्व॒नित स॒न्धये॑ जा॒रम् । गे॒हायो॑पप॒तिम् । निर् ऋ॑त्यै परिवि॒त्तम्
    । आर्त्यै॑ परिविविदा॒नम् । अरा म् । प॒वित्रा॑य भि॒षज म् । प्र॒ज्ञाना॑य नक्षत्रद॒र॒ शम् । निष्कृ॑त्यै
    पेशस्का॒रीम् । बला॑यो प॒दाम् । वर्णा॑यानू॒रुध न॒दीभ्यः॑ पौञ्जि॒ष्टम् । ऋ॒क्षीका भ्यो॒ नैषा॑दम् । पु॒रु॒ष॒व्या॒घ्राय॑
    दु॒र्मद म् । प्र॒युद्भ्य॒ उन्म॑त्तम् । ग॒न्ध॒र्वा॒फ्स॒राभ्यो॒ व्रात्य म् । स॒र्प॒दे॒व॒ज॒नेभ्यो ऽप्र॑तिपदम्
    । अवे भ्यः कित॒वम् । इ॒र्यता॑या॒ अकि॑तवम् । पि॒शा॒चेभ्यो॑ बिदलका॒रम् । या॒तु॒धाने उ॒थ्सा॒देभ्यः॑ कु॒ब्जम्
    । प्र॒मुदे॑ वाम॒नम् । द्वा॒र्भ्य स्स्रा॒मम् । स्वप्ना॑या॒न्धम् । अध॑र्माय बधि॒रम् । स॒ज्ञान्ना॑य स्मरका॒रीम्
    । प्र॒का॒मोद्या॑योप॒सद म् । उ॒प॒शि॒क्षाया॑ अभिप्र॒श्निन म् । म॒र्यादा॑यै प्रश्नविवा॒कम् ॥ स्ते॒नहृ॑दयम्
    । वैर॑हत्याय॒ पिशु॑नम् । विवि॑त्त्यै क्ष॒त्तार म् । औप॑द्रष्टाय सङ्ग्रही॒तार म् । बला॑यानुच॒रम् ।
    भू॒म्ने प॑रिष्क॒न्दम् । प्रि॒याय॑ प्रियवा॒दिन म् । अरि॑ष्ट्या अश्वसा॒दम् । मेधा॑य वासः पल्पू॒लीम्
    । प्र॒का॒माय॑ रजयि॒त्रीम् ॥ भायै॑ दार्वाहा॒रम् । प्र॒भाया॑ आग्ने॒न्धम् । नाक॑स्य पृ॒ष्ठाया॑भिषे॒क्तार
    म् । ब्र॒द्ध्नस्य॑ वि॒ष्टपा॑य पात्रनिर्णे॒गम् । दे॒व॒लो॒काय॑ पेशि॒तार म् । म॒नु॒ष्य॒लो॒काय॑ प्रकरि॒तार
    भ्यो लो॒केभ्य॑ उपसे॒क्तार म् । अव॑र्त्यै व॒धायो॑पमन्थि॒तार म् । सु॒व॒र्गाय॑ लो॒काय॑ भाग॒दुघ षि॑ष्ठाय॒
    नाका॑य परिवे॒ष्टार भ्यो हस्ति॒पम् । ज॒वाया श्व॒पम् । पुष्ट्यै॑ गोपा॒लम् । तेज॑से ऽजपा॒लम् । वी॒र्या॑याविपा॒लम्
    । इरा॑यै की॒नाश म् । की॒लाला॑य सुराका॒रम् । भ॒द्राय॑ गृह॒पम् । श्रेय॑से वित्त॒धम् । अद्ध्य॑क्षायानुक्ष॒त्तार
    ऽयस्ता॒पम् । क्रोधा॑य निस॒रम् । शोका॑याभिस॒रम् । उ॒त्कू॒ल॒वि॒कू॒लाभ्या म् । योगा॑य यो॒क्तार म् । क्षेमा॑य
    विमो॒क्तार म् । वपु॑षे मानस्कृ॒तम् । शीला॑याञ्जनीका॒रम् । निर् ऋ॑त्यै कोशका॒रीम् । य॒माया॒सूम् ॥ य॒म्यै॑
    यम॒सूम् । अथ॑र्व॒भ्यो वँ॒थ्स॒राय॑ पर्या॒रिणी म् । प॒रि॒व॒थ्स॒रायावि॑जाताम् । इ॒दा॒व॒थ्स॒राया॑प॒स्कद्व॑रीम्
    । इ॒द्व॒थ्स॒राया॒तीत्व॑रीम् । व॒थ्स॒राय॒ विज॑र्जराम् । स॒र्व॒थ्सं॒राय॒ पलि॑क्नीम् । वना॑य वन॒पम् ।
    अ॒न्यतो॑रण्याय दाव॒पम् ॥ भ्यो धैव॒रम् । वेश॑न्ताभ्यो॒ दाश म् । उ॒प॒स्थाव॑रीभ्यो॒ बैन्द म् । न॒ड्व॒लाभ्यः॑
    शौष्क॒लम् । पा॒र्या॑य कैव॒र्तम् । अ॒वा॒र्या॑य मार्गा॒रम् । ती॒र्थेभ्य॑ आ॒न्दम् । विष॑मेभ्यो मैना॒लम्
    । स्वने भ्यः॒ पर्ण॑कम् । गुहा भ्यः॒ किरा॑तम् । सानु॑भ्यो॒ जम्भ॑कम् । पर्व॑तेभ्यः॒ कि प्र॒ति॒श्रुत्का॑या
    ऋतु॒लम् । घोषा॑य भ॒षम् । अन्ता॑य बहुवा॒दिन म् । मह॑से वीणावा॒दम् । क्रोशा॑य तूणव॒द्ध्मम् । आ॒क्र॒न्दाय॑
    दुन्दुभ्याघा॒तम् । अ॒व॒र॒स्प॒राय॑ शङ्ख॒द्ध्मम् । ऋ॒भुभ्यो॑ ऽजिनसन्धा॒यम् । सा॒द्ध्येभ्य॑श्चर्म॒म्णम्
    ॥ बी॒भ॒थ्सायै॑ पौल्क॒सम् । भूत्यै॑ जागर॒णम् । अभू त्यै स्वप॒नम् । तु॒लायै॑ वाणि॒जम् । वर्णा॑य हिरण्यका॒रम्
    । विश्वे भ्यो दे॒वेभ्यः॑ सिद्ध्म॒लम् । प॒श्चा॒ द्दो॒षाय॑ ग्ला॒वम् । ऋत्यै॑ जनवा॒दिन म् । व्यृ॑द्ध्या
    अपग॒ल्भम् । स॒ग्ं॒श॒राय॑ प्र॒च्छिद श्च॒लूमाल॑भते । वी॒णा॒वा॒द ङ्गी॒ताय॑ । याद॑से शाबु॒ल्याम् । न॒र्माय॑
    भद्रव॒तीम् । तू॒ण॒व॒द्ध्म न्नृ॒त्ताय॑ । मोदा॑यानु॒क्रोश॑कम् । आ॒न॒न्दाय॑ तल॒वम् ॥ अ॒क्ष॒रा॒जाय॑ कित॒वम्
    । कृ॒ताय॑ सभा॒विन म् । त्रेता॑या आदिनवद॒र्॒शम् । द्वा॒प॒राय॑ बहि॒ म् । कल॑ये सभास्था॒णुम् । दु॒ष्कृ॒ताय॑
    च॒रका॑चार्यम् । अद्ध्व॑ने ब्रह्मचा॒रिण म् । पि॒शा॒चेभ्यः॑ सैल॒गम् । पि॒पा॒सायै॑ गोव्य॒च्छम् । निर्
    ऋ॑त्यै गोघा॒तम् । क्षु॒धे गो॑विक॒र्तम् । क्षु॒त्तृ॒ष्णाभ्या॒ म्भिक्ष॑माण उप॒तिष्ठ॑ते ॥ भूम्यै॑ पीठस॒र्पिण॒माल॑भते
    । अ॒ग्नये ऽग्ं॑स॒लम् । वा॒यवे॑ चाण्डा॒लम् । अ॒न्तरि॑क्षाय वग्ंशन॒र्तिन म् । दि॒वे ख॑ल॒तिम् । सूर्या॑य
    हर्य॒क्षम् । च॒न्द्रम॑से मिर्मि॒रम् । नक्ष॑त्रेभ्यः कि॒लास म्पि॑ङ्ग॒लम् । रात्रि॑यै कृ॒ष्ण वा॒चे पुरु॑ष॒माल॑भते
    । प्रा॒णम॑पा॒नं व्याँ॒नमु॑दा॒नग्ं स॑मा॒न । सूर्या॑य॒ चक्षु॒राल॑भते । मन॑श्च॒न्द्रम॑से । दि॒भ्य म्
    । प्र॒जाप॑तये॒ पुरु॑षम् ॥ अथै॒तानरू॑पेभ्य॒ आल॑भते । अति॑ह्रस्व॒ मति॑दीर्घम् । अति॑कृश॒मत्यग्ं॑सलम्
    । अति॑शुक्ल॒ मति॑कृष्णम् । अति॑श्लक्ष्ण॒ मति॑लोमशम् । अति॑किरिट॒ मति॑दन्तुरम् । अति॑मिर्मिर॒ मति॑मेमिषम्
    । आ॒शायै॑ जा॒मिम् । प्र॒ती॒क्षायै॑ कुमा॒रीम् ॥ क्ष॑रा॒जाय॒ त्रयो॑दश॒ नवैका॒न्न विग्ं॑शतिः ॥ हरिः॑
    ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय ब्राह्मणे तृतीयाष्टके चतुर्थ प्रपाठक
