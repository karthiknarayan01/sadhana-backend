id: ramadevikritamvishnustotram
category: stotram
name:
  english: ramadevikritamvishnustotram
  devanagari: रमादेवीकृतंविष्णुस्तोत्रम्
content:
  english: lekhamayo bhavatu nah puratah puranah | vani puranapadavi nikhilashrutinam sartham parishramamupetya
    mano vikaraih || 161|| janati va na hi vimrishya nivartita va tam kevalam paramakarunikam natasmi
    | yam prahuradyamanapayamasheshavedha mohandhakarapatalatha param prakasham || 162|| brahmadayo'pi
    tamimam hridayam prapadye praptam prakamamabhilashamahodayanam | yajnairjapairapi manupravarasya danaih
    pujavisheshapushitabhyudayapranamaih || 163|| pranendriyopashamanaih pravishanti siddhah yantam pumamsamurukayamupaimi
    nityam | yatpadapadmamakarandajusham muninam brahmendrarudrapadavivibhavo hi heyah || 164|| natho
    mamastu nalinayatalocano'yam agre jagattrayasurakshanajagarukah | eko'pyanekavidhamurtivikalpanabhih
    karta yamaviti pipilikajivikanam || 165|| bhaktya punah pralayatah pranayaikadhama kamaya me bhavatu
    karanakaranatma | adyo'yamasya jagatah prabhuraprakashah papatmanamasukritinam vihataprakashah ||
    166|| ishe pade bhavatu me bhagavan puranah bhaktavalambitapadamburuhah shrutinam | shranto'smi natha
    nikhilashramashantihetoh svantatpramrijya paritapatatim madiyam || 167|| ayahi pahi purato na sahe
    viyoga
  devanagari: लेखामयो भवतु नः पुरतः पुराणः । वाणी पुराणपदवी निखिलश्रुतीनां सार्थं परिश्रममुपेत्य मनो विकारैः
    ॥ १६१॥ जानाति वा न हि विमृश्य निवर्तिता वा तं केवलं परमकारुणिकं नतास्मि । यं प्राहुराद्यमनपायमशेषवेधा
    मोहान्धकारपटलाथ परं प्रकाशम् ॥ १६२॥ ब्रह्मादयोऽपि तमिमं हृदयं प्रपद्ये प्राप्तं प्रकाममभिलाषमहोदयानाम्
    । यज्ञैर्जपैरपि मनुप्रवरस्य दानैः पूजाविशेषपुषिताभ्युदयप्रणामैः ॥ १६३॥ प्राणेन्द्रियोपशमनैः प्रविशन्ति
    सिद्धाः यन्तं पुमांसमुरुकायमुपैमि नित्यम् । यत्पादपद्ममकरन्दजुषां मुनीनां ब्रह्मेन्द्ररुद्रपदवीविभवो
    हि हेयः ॥ १६४॥ नाथो ममास्तु नलिनायतलोचनोऽयं अग्रे जगत्त्रयसुरक्षणजागरूकः । एकोऽप्यनेकविधमूर्तिविकल्पनाभिः
    कर्ता यमाविति पिपीलिकजीविकानाम् ॥ १६५॥ भक्त्या पुनः प्रलयतः प्रणयैकधामा कामाय मे भवतु कारणकारणात्मा
    । आद्योऽयमस्य जगतः प्रभुरप्रकाशः पापात्मनामसुकृतिनां विहतप्रकाशः ॥ १६६॥ ईशे पदे भवतु मे भगवान् पुराणः
    भक्तावलम्बितपदाम्बुरुहः श्रुतीनाम् । श्रान्तोऽस्मि नाथ निखिलश्रमशान्तिहेतोः स्वान्तात्प्रमृज्य परितापततिं
    मदीयाम् ॥ १६७॥ आयाहि पाहि पुरतो न सहे वियोग
