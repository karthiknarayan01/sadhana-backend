id: ganesha-kavacham
category: stotram
name:
  english: Ganesha Kavacham
content:
  english: eshoti capalo daityan balyepi nashayatyaho | agre kim karma karteti na jane munisattama ||
    || daitya nanavidha dushtassadhu devadrumah khalah | atosya kanthe kincittyam raksham sambaddhumarhasi
    || || dhyayet simhagatam vinayakamamum digbahu madye yuge tretayam tu mayura vahanamamum shadbahukam
    siddhidam | i dvaparetu gajananam yugabhujam raktangaragam vibhum turye tu dvibhujam sitangaruciram
    sarvarthadam sarvada || || vinayaka shshikhampatu paramatma paratparah | atisundara kayastu mastakam
    sumahotkatah || || lalatam kashyapah patu bhruyugam tu mahodarah | nayane balacandrastu gajasyastyoshtha
    pallavau || || jihvam patu gajakridashcubukam girijasutah | vacam vinayakah patu dantan || shravanau
    pashapanistu nasikam cintitarthadah | ganeshastu mukham patu kantham patu ganadhipah || || skandhau
    patu gajaskandhah stane vighnavinashanah | hridayam gananathastu herambo jatharam mahan || || dharadharah
    patu parshvau prishtham vighnaharashshubhah | lingam guhyam sada patu vakratundo mahabalah || || gajakrido
    janu jangho uru mangalakirtiman | ekadanto mahabuddhih padau gulphau sadavatu || || kshipra prasadano
    bahu pani ashaprapurakah | angulishca nakhan patu padmahasto rinashanah || || sarvangani mayuresho
    vishvavyapi sadavatu | anuktamapi yat sthanam dhumaketuh sadavatu || || amodastvagratah patu pramodah
    prishthatovatu | pracyam rakshatu buddhisha agneyyam siddhidayakah || || dakshinasyamumaputro nairityam
    tu ganeshvarah | praticyam vighnaharta vyadvayavyam gajakarnakah || || kauberyam nidhipah payadishanyavishanandanah
    | divavyadekadanta stu ratrau sandhyasu yahvighnahrit || || rakshasasura betala graha bhuta pishacatah
    | pashankushadharah patu rajassattvatamassmritih || || jnanam dharmam ca lakshmi ca lajjam kirtim
    tatha kulam | i vapurdhanam ca dhanyam ca griham darassutansakhin || || sarvayudha dharah pautran
    mayuresho vatat sada | kapilo janukam patu gajashvan vikatovatu || || bhurjapatre likhitvedam yah
    kanthe dharayet sudhih | na bhayam jayate tasya yaksha rakshah pishacatah || || trisandhyam japate
    yastu vajrasara tanurbhavet | yatrakale pathedyastu nirvighnena phalam labhet || || yuddhakale pathedyastu
    vijayam capnuyaddhruvam | maranoccatanakarsha stambha mohana karmani || || saptavaram japedetaddananamekavimshatih
    | tattatphalamavapnoti sadhako natra samshayah || || ekavimshativaram ca pathettavaddinani yah | karagrihagatam
    sadyo rajnavadhyam ca mocayot || || rajadarshana velayam pathedetat trivaratah | sa rajanam vasham
    nitva prakritishca sabham jayet || || idam ganeshakavacam kashyapena saviritam | mudgalaya ca te natha
    mandavyaya maharshaye || || mahyam sa praha kripaya kavacam sarva siddhidam | na deyam bhaktihinaya
    deyam shraddhavate shubham || || anenasya krita raksha na badhasya bhavet vyacit | rakshasasura betala
    daitya danava sambhavah || || || iti shri ganeshapurane shri ganesha kavacam sampurnam ||
  devanagari: एषोति चपलो दैत्यान् बाल्येपि नाशयत्यहो । अग्रे किं कर्म कर्तेति न जाने मुनिसत्तम ॥ ॥ दैत्या
    नानाविधा दुष्टास्साधु देवद्रुमः खलाः । अतोस्य कण्ठे किञ्चित्त्यं रक्षां सम्बद्धुमर्हसि ॥ ॥ ध्यायेत्
    सिंहगतं विनायकममुं दिग्बाहु माद्ये युगे त्रेतायां तु मयूर वाहनममुं षड्बाहुकं सिद्धिदम् । ई द्वापरेतु
    गजाननं युगभुजं रक्ताङ्गरागं विभुं तुर्ये तु द्विभुजं सिताङ्गरुचिरं सर्वार्थदं सर्वदा ॥ ॥ विनायक श्शिखाम्पातु
    परमात्मा परात्परः । अतिसुन्दर कायस्तु मस्तकं सुमहोत्कटः ॥ ॥ ललाटं कश्यपः पातु भ्रूयुगं तु महोदरः ।
    नयने बालचन्द्रस्तु गजास्यस्त्योष्ठ पल्लवौ ॥ ॥ जिह्वां पातु गजक्रीडश्चुबुकं गिरिजासुतः । वाचं विनायकः
    पातु दन्तान् ॥ श्रवणौ पाशपाणिस्तु नासिकां चिन्तितार्थदः । गणेशस्तु मुखं पातु कण्ठं पातु गणाधिपः ॥
    ॥ स्कन्धौ पातु गजस्कन्धः स्तने विघ्नविनाशनः । हृदयं गणनाथस्तु हेरम्बो जठरं महान् ॥ ॥ धराधरः पातु पार्श्वौ
    पृष्ठं विघ्नहरश्शुभः । लिङ्गं गुह्यं सदा पातु वक्रतुण्डो महाबलः ॥ ॥ गजक्रीडो जानु जङ्घो ऊरू मङ्गलकीर्तिमान्
    । एकदन्तो महाबुद्धिः पादौ गुल्फौ सदावतु ॥ ॥ क्षिप्र प्रसादनो बाहु पाणी आशाप्रपूरकः । अङ्गुलीश्च नखान्
    पातु पद्महस्तो रिनाशनः ॥ ॥ सर्वाङ्गानि मयूरेशो विश्वव्यापी सदावतु । अनुक्तमपि यत् स्थानं धूमकेतुः
    सदावतु ॥ ॥ आमोदस्त्वग्रतः पातु प्रमोदः पृष्ठतोवतु । प्राच्यां रक्षतु बुद्धीश आग्नेय्यां सिद्धिदायकः
    ॥ ॥ दक्षिणस्यामुमापुत्रो नैऋत्यां तु गणेश्वरः । प्रतीच्यां विघ्नहर्ता व्याद्वायव्यां गजकर्णकः ॥ ॥
    कौबेर्यां निधिपः पायादीशान्याविशनन्दनः । दिवाव्यादेकदन्त स्तु रात्रौ सन्ध्यासु यःविघ्नहृत् ॥ ॥ राक्षसासुर
    बेताल ग्रह भूत पिशाचतः । पाशाङ्कुशधरः पातु रजस्सत्त्वतमस्स्मृतीः ॥ ॥ ज्ञानं धर्मं च लक्ष्मी च लज्जां
    कीर्तिं तथा कुलम् । ई वपुर्धनं च धान्यं च गृहं दारास्सुतान्सखीन् ॥ ॥ सर्वायुध धरः पौत्रान् मयूरेशो
    वतात् सदा । कपिलो जानुकं पातु गजाश्वान् विकटोवतु ॥ ॥ भूर्जपत्रे लिखित्वेदं यः कण्ठे धारयेत् सुधीः
    । न भयं जायते तस्य यक्ष रक्षः पिशाचतः ॥ ॥ त्रिसन्ध्यं जपते यस्तु वज्रसार तनुर्भवेत् । यात्राकाले पठेद्यस्तु
    निर्विघ्नेन फलं लभेत् ॥ ॥ युद्धकाले पठेद्यस्तु विजयं चाप्नुयाद्ध्रुवम् । मारणोच्चाटनाकर्ष स्तम्भ मोहन
    कर्मणि ॥ ॥ सप्तवारं जपेदेतद्दनानामेकविंशतिः । तत्तत्फलमवाप्नोति साधको नात्र संशयः ॥ ॥ एकविंशतिवारं
    च पठेत्तावद्दिनानि यः । कारागृहगतं सद्यो राज्ञावध्यं च मोचयोत् ॥ ॥ राजदर्शन वेलायां पठेदेतत् त्रिवारतः
    । स राजानं वशं नीत्वा प्रकृतीश्च सभां जयेत् ॥ ॥ इदं गणेशकवचं कश्यपेन सविरितम् । मुद्गलाय च ते नाथ
    माण्डव्याय महर्षये ॥ ॥ मह्यं स प्राह कृपया कवचं सर्व सिद्धिदम् । न देयं भक्तिहीनाय देयं श्रद्धावते
    शुभम् ॥ ॥ अनेनास्य कृता रक्षा न बाधास्य भवेत् व्याचित् । राक्षसासुर बेताल दैत्य दानव सम्भवाः ॥ ॥ ॥
    इति श्री गणेशपुराणे श्री गणेश कवचं सम्पूर्णम् ॥
