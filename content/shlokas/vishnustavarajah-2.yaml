id: vishnustavarajah-2
category: shataka
name:
  english: vishnustavarajah 2
  devanagari: विष्णुस्तवराजः २
content:
  english: '| unmadah sarvabhutanam tasmai kamatmane namah || 53|| yam tam vyaktasthamavyaktam vicinvanti
    maharshayah | kshetre kshetrajnamasinam tasmai kshetratmane namah || 54|| yam tridhatmanamatmastham
    vritam shodashabhirgunaih | prahuh saptadasham sankhyastasmai sankhyatmane namah || 55|| yam vinidrajitashvasah
    shanta danta jitendriyah | jyotih pashyanti yunjanastasmai yogatmane namah || 56|| apunyapunyah parame
    yam punarbhavanirbhayah | shantah samnyasaino yanti tasmai mokshatmane namah || 57|| yo''sau yugasahasrante
    pradiptarcirvibhavasuh | sankshobhayati bhutani tasmai ghoratmane namah || 28|| sambhakshya sarvabhutani
    kritva caikarnavam jagat | balah svapiti yashcaikastasmai mayatmane namah || 59|| ajasya nabhyam sambhutam
    yasmin vishvam pratishtitam | pushkaram pushkarakshasya tasmai padmatmane namah || 60|| sahasrashirase
    caiva purushayamitatmane | catussamudraparyanke yoganidratmane namah || 61|| yasya kesheshu jimuta
    nadyah sarvangasandhishu | kukshau samudrashcatvarastasmai toyatmane namah || 62|| yasmat sarvah prasuyante
    sargapralayavikriyah | yasmimshcaiva praliyante tasmai hetvatmane namah || 63|| yo nishanno bhavedratrau
    diva bhavati vishthitah | ishtanishtatya ca drashta tasmai drashtratmane namah || 64|| akuntham sarvakaryeshu
    dharmakaryarthamudyatam | vaikunthasya hi tadrupam tasmai karyatmane namah || 65|| vibhajya pancadhatmanam
    vayurbhutashariragah | yashceshtayati bhutani tasmai vayvatmane namah || 66|| brahma vaktram bhujau
    kshatram kritsnamurudaram vishah | padau yasyashritah shudrastasmai varnatmane namah || 67|| yugeshvavartate
    yogairdinartvayanahayanaih | sargapralayayoh karta tasmai kalatmane namah || 68|| yasyagnirasyam dyaurmurdha
    kham nabhishcaranau kshitih | suryashcakshurdishah shrotre tasmai lokatmane namah || 69|| vishaye
    vartamano yam tam vaisheshikanirgunaih | prahurvishayagoptaram tasmai goptratmane namah || 70|| annapanendhanamayo
    rasapranavivardhanah | yo dharayati bhutani tasmai pranatmane namah || 71|| prananam dharanarthaya
    yo''nnam bhunkte caturvidham | antarbhutah pacatyagnistasmai pakatmane namah || 72|| pingekshanasatam
    yasya rupam damshtranakhayudham | danavendrantakaranam tasmai driptatmane namah || 73|| rasatalagatah
    shrimanananto bhagavan vibhuh | jagaddharayate kritsnam tasmai viryatmane namah || 74|| yo mohayati
    bhutani snehapashanubandhanaih | sargasya rakshanarthaya tasmai mohatmane namah || 75|| sutalatalamadhyastho
    hatva tu madhukaitabhau | uddhrita yena vai vedastasmai matsyatmane namah || 76|| sasagaranagam bibhrat
    saptadvipam vasundharam | yo dharayati prishthena tasmai kurmatmane namah || 77|| ekarnave hi magnam
    tam varaham rupamasthitah | uddadhara mahim yo''sau tasmai krodatmane namah || 78|| narasimhavapuh
    kritva yastrailokyabhayankarama | hiranyakashipum jaghne tasmai simhatmane namah || 79|| vamanam rupamasthaya
    balim samyamya mayaya | ime krantastrayo lokastasmai krantatmane namah || 80|| jamadagnisuto bhutva
    ramah parashudhrit prabhuh | sahasrarjunahantaiva tasma ugratmane namah || 81|| ramo dasharathirbhutva
    paulastyakulanandanam | jaghana ravanam sankhye tasmai kshattratmane namah || 82|| vasudevasutah shriman
    vasudevo jagatpatih | jahara vasudhabharam tasmai krishnatmane namah || 83|| buddharupam samasthaya
    sarvadharmaparayanah | mohayan sarvabhutani tasmai mohatmane namah || 84|| hanishyati kalerante mlecchamsturagavahanah
    | dharmasamsthapanarthaya tasmai kalkyatmane namah || 85|| atmajnanamidam jnanam jnatva pancasvavasthitah
    | yam jnanenadhigacchanti tasmai jnanatmane namah || 86|| atrameyashariraya sarvato buddhicakshushe
    | aparaparameyaya tasmai divyatmane namah || 87|| jatine dandine nityam lambodarasharirine | kamandalunishangaya
    tasmai brahmatmane namah || 88|| shuline tridasheshaya tryambakaya mahatmane | bhasmadigdhordhvalingaya
    tasmai rudratmane namah || 89|| candrardhakritashirshaya vyalayajnopavitine | pinakashulahastaya tasma
    ugratmane namah || 90|| pancabhutatmabhutaya bhutadinidhanaya ca | akrodhadrohamohaya tasmai shantatmane
    namah || 91|| yasmin sarvam yatah sarvam yah sarvam sarvatashca yah | yashca sarvamayo devastasmai
    sarvatmane namah || 92|| vishvakarmannamaste''stu vishvatman vishvasambhava | apavargastha bhutanam
    pancanam puratah sthita || 93|| namaste trishu lokeshu namaste paratastrishu | namaste dikshu sarvasu
    tvam hi sarvamayo nidhih || 94|| namaste bhagavan vishno lokanam prabhavapyayam | tvam hi karta hrishikesha
    samharta caparajitah || 95|| tena pashyami bhagavan divyeshu trishu vartmasu | tacca pashyami tattvena
    yatte rupam sanatanam || 96|| divam te shirasa vyaptam padbhyam devi vasundhara | vikramena trayo
    lokah purusho''si sanatanah || 97|| disho bhuja ravishcakshurviryam shukrah prajapatih | saptamarga
    niruddhaste vayoramitatejasah || 98|| atasipushpasankasham pitakausheyavasasam | namasyanti ca govindam
    na tesham vidyate bhayam || 99|| namo narakasantrasarakshamandalakarine | samsaranimnagavartatarikashthaya
    vishnave || 100|| namo brahmanyadevaya gobrahmanahitaya ca | jagaddhitaya krishnaya govindaya namo
    namah || 101|| pranakantarapatheyam samsaracchedabheshajam | duhkhashokaparitranam harirityaksharadvayam
    || 102|| yatha vishnumayam satyam yatha vishnumayam jagat | yatha vishnumayam sarvam papam me nashyatam
    tatha || 103|| tvam prapannaya bhaktaya gatimishtam jigishave | yacchreyah pundarikaksham tam dhyayasva
    sureshvaram || 104|| iti vidyatapoyonirayonirvishnuriditah | vagyajnenarcito devah priyatam me janardanah
    || 105|| narayanam param brahma narayanaparam tapah | narayanaparam cedam sarvam narayanatmakam ||
    106|| vaishampayana uvaca'
  devanagari: । उन्मादः सर्वभूतानां तस्मै कामात्मने नमः ॥ ५३॥ यं तं व्यक्तस्थमव्यक्तं विचिन्वन्ति महर्षयः
    । क्षेत्रे क्षेत्रज्ञमासीनं तस्मै क्षेत्रात्मने नमः ॥ ५४॥ यं त्रिधात्मानमात्मस्थं वृतं षोडशभिर्गुणैः
    । प्राहुः सप्तदशं साङ्ख्यास्तस्मै साङ्ख्यात्मने नमः ॥ ५५॥ यं विनिद्राजितश्वासाः शान्ता दान्ता जितेन्द्रियाः
    । ज्योतिः पश्यन्ति युञ्जानास्तस्मै योगात्मने नमः ॥ ५६॥ अपुण्यपुण्यः परमे यं पुनर्भवनिर्भयाः । शान्ताः
    संन्यासैनो यान्ति तस्मै मोक्षात्मने नमः ॥ ५७॥ योऽसौ युगसहस्रान्ते प्रदीप्तार्चिर्विभावसुः । सङ्क्षोभयाति
    भूतानि तस्मै घोरात्मने नमः ॥ २८॥ सम्भक्ष्य सर्वभूतानि कृत्वा चैकार्णवं जगत् । बालः स्वपिति यश्चैकस्तस्मै
    मायात्मने नमः ॥ ५९॥ अजस्य नाभ्यां सम्भूतं यस्मिन् विश्वं प्रतिष्टितम् । पुष्करं पुष्कराक्षस्य तस्मै
    पद्मात्मने नमः ॥ ६०॥ सहस्रशिरसे चैव पुरुषायामितात्मने । चतुस्समुद्रपर्यङ्के योगनिद्रात्मने नमः ॥ ६१॥
    यस्य केशेषु जीमूता नद्यः सर्वाङ्गसन्धिषु । कुक्षौ समुद्राश्चत्वारस्तस्मै तोयात्मने नमः ॥ ६२॥ यस्मात्
    सर्वाः प्रसूयन्ते सर्गप्रलयविक्रियाः । यस्मिंश्चैव प्रलीयन्ते तस्मै हेत्वात्मने नमः ॥ ६३॥ यो निषण्णो
    भवेद्रात्रौ दिवा भवति विष्ठितः । इष्टानिष्टत्य च द्रष्टा तस्मै द्रष्ट्रात्मने नमः ॥ ६४॥ अकुण्ठं सर्वकार्येषु
    धर्मकार्यार्थमुद्यतम् । वैकुण्ठस्य हि तद्रूपं तस्मै कार्यात्मने नमः ॥ ६५॥ विभज्य पञ्चधात्मानं वायुर्भूतशरीरगः
    । यश्चेष्टयति भूतानि तस्मै वाय्वात्मने नमः ॥ ६६॥ ब्रह्म वक्त्रं भुजौ क्षत्रं कृत्स्नमूरूदरं विशः ।
    पादौ यस्याश्रिताः शूद्रास्तस्मै वर्णात्मने नमः ॥ ६७॥ युगेष्वावर्तते योगैर्दिनर्त्वयनहायनैः । सर्गप्रलययोः
    कर्ता तस्मै कालात्मने नमः ॥ ६८॥ यस्याग्निरास्यं द्यौर्मूर्धा खं नाभिश्चरणौ क्षितिः । सूर्यश्चक्षुर्दिशः
    श्रोत्रे तस्मै लोकात्मने नमः ॥ ६९॥ विषये वर्तमानो यं तं वैशेषिकनिर्गुणैः । प्राहुर्विषयगोप्तारं तस्मै
    गोप्त्रात्मने नमः ॥ ७०॥ अन्नपानेन्धनमयो रसप्राणविवर्धनः । यो धारयति भूतानि तस्मै प्राणात्मने नमः ॥
    ७१॥ प्राणानां धारणार्थाय योऽन्नं भुङ्क्ते चतुर्विधम् । अन्तर्भूतः पचत्यग्निस्तस्मै पाकात्मने नमः ॥
    ७२॥ पिङ्गेक्षणसटं यस्य रूपं दंष्ट्रानखायुधम् । दानवेन्द्रान्तकरणं तस्मै दृप्तात्मने नमः ॥ ७३॥ रसातलगतः
    श्रीमाननन्तो भगवान् विभुः । जगद्धारयते कृत्स्नं तस्मै वीर्यात्मने नमः ॥ ७४॥ यो मोहयति भूतानि स्नेहपाशानुबन्धनैः
    । सर्गस्य रक्षणार्थाय तस्मै मोहात्मने नमः ॥ ७५॥ सुतलातलमध्यस्थो हत्वा तु मधुकैटभौ । उद्धृता येन वै
    वेदास्तस्मै मत्स्यात्मने नमः ॥ ७६॥ ससागरनगां बिभ्रत् सप्तद्वीपां वसुन्धराम् । यो धारयति पृष्ठेन तस्मै
    कूर्मात्मने नमः ॥ ७७॥ एकार्णवे हि मग्नां तां वाराहं रूपमास्थितः । उद्दधार महीं योऽसौ तस्मै क्रोडात्मने
    नमः ॥ ७८॥ नारसिंहवपुः कृत्वा यस्त्रैलोक्यभयङ्करम । हिरण्यकशिपुं जघ्ने तस्मै सिंहात्मने नमः ॥ ७९॥ वामनं
    रूपमास्थाय बलिं संयम्य मायया । इमे क्रान्तास्त्रयो लोकास्तस्मै क्रान्तात्मने नमः ॥ ८०॥ जमदग्निसुतो
    भूत्वा रामः परशुधृत् प्रभुः । सहस्रार्जुनहन्तैव तस्मा उग्रात्मने नमः ॥ ८१॥ रामो दाशरथिर्भूत्वा पौलस्त्यकुलनन्दनम्
    । जघान रावणं सङ्ख्ये तस्मै क्षत्त्रात्मने नमः ॥ ८२॥ वसुदेवसुतः श्रीमान् वासुदेवो जगत्पतिः । जहार वसुधाभारं
    तस्मै कृष्णात्मने नमः ॥ ८३॥ बुद्धरूपं समास्थाय सर्वधर्मपरायणः । मोहयन् सर्वभूतानि तस्मै मोहात्मने
    नमः ॥ ८४॥ हनिष्यति कलेरन्ते म्लेच्छांस्तुरगवाहनः । धर्मसंस्थापनार्थाय तस्मै कल्क्यात्मने नमः ॥ ८५॥
    आत्मज्ञानमिदं ज्ञानं ज्ञात्वा पञ्चस्ववस्थितः । यं ज्ञानेनाधिगच्छन्ति तस्मै ज्ञानात्मने नमः ॥ ८६॥ अत्रमेयशरीराय
    सर्वतो बुद्धिचक्षुषे । अपारपरमेयाय तस्मै दिव्यात्मने नमः ॥ ८७॥ जटिने दण्डिने नित्यं लम्बोदरशरीरिणे
    । कमण्डलुनिषङ्गाय तस्मै ब्रह्मात्मने नमः ॥ ८८॥ शूलिने त्रिदशेशाय त्र्यम्बकाय महात्मने । भस्मदिग्धोर्ध्वलिङ्गाय
    तस्मै रुद्रात्मने नमः ॥ ८९॥ चन्द्रार्धकृतशीर्षाय व्यालयज्ञोपवीतिने । पिनाकशूलहस्ताय तस्मा उग्रात्मने
    नमः ॥ ९०॥ पञ्चभूतात्मभूताय भूतादिनिधनाय च । अक्रोधद्रोहमोहाय तस्मै शान्तात्मने नमः ॥ ९१॥ यस्मिन् सर्वं
    यतः सर्वं यः सर्वं सर्वतश्च यः । यश्च सर्वमयो देवस्तस्मै सर्वात्मने नमः ॥ ९२॥ विश्वकर्मन्नमस्तेऽस्तु
    विश्वात्मन् विश्वसम्भव । अपवर्गस्थ भूतानां पञ्चानां पुरतः स्थित ॥ ९३॥ नमस्ते त्रिषु लोकेषु नमस्ते
    परतस्त्रिषु । नमस्ते दिक्षु सर्वासु त्वं हि सर्वमयो निधिः ॥ ९४॥ नमस्ते भगवन् विष्णो लोकानां प्रभवाप्ययम्
    । त्वं हि कर्ता हृषीकेश संहर्ता चापराजितः ॥ ९५॥ तेन पश्यामि भगवन् दिव्येषु त्रिषु वर्त्मसु । तच्च
    पश्यामि तत्त्वेन यत्ते रूपं सनातनम् ॥ ९६॥ दिवं ते शिरसा व्याप्तं पद्भ्यां देवी वसुन्धरा । विक्रमेण
    त्रयो लोकाः पुरुषोऽसि सनातनः ॥ ९७॥ दिशो भुजा रविश्चक्षुर्वीर्यं शुक्रः प्रजापतिः । सप्तमार्गा निरुद्धास्ते
    वायोरमिततेजसः ॥ ९८॥ अतसीपुष्पसङ्काशं पीतकौशेयवाससम् । नमस्यन्ति च गोविन्दं न तेषां विद्यते भयम् ॥
    ९९॥ नमो नरकसन्त्रासरक्षामण्डलकारिणे । संसारनिम्नगावर्ततरिकाष्ठाय विष्णवे ॥ १००॥ नमो ब्रह्मण्यदेवाय
    गोब्राह्मणहिताय च । जगद्धिताय कृष्णाय गोविन्दाय नमो नमः ॥ १०१॥ प्राणकान्तारपाथेयं संसारच्छेदभेषजम्
    । दुःखशोकपरित्राणं हरिरित्यक्षरद्वयम् ॥ १०२॥ यथा विष्णुमयं सत्यं यथा विष्णुमयं जगत् । यथा विष्णुमयं
    सर्वं पापं मे नश्यतां तथा ॥ १०३॥ त्वां प्रपन्नाय भक्ताय गतिमिष्टां जिगीषवे । यच्छ्रेयः पुण्डरीकाक्षं
    तं ध्यायस्व सुरेश्वरम् ॥ १०४॥ इति विद्यातपोयोनिरयोनिर्विष्णुरीडितः । वाग्यज्ञेनार्चितो देवः प्रीयतां
    मे जनार्दनः ॥ १०५॥ नारायणं परं ब्रह्म नारायणपरं तपः । नारायणपरं चेदं सर्वं नारायणात्मकम् ॥ १०६॥ वैशम्पायन
    उवाच
