id: hayagrivaproktamlalitadevyahdvadashanamastotram
category: stotram
name:
  english: hayagrivaproktamlalitadevyahdvadashanamastotram
  devanagari: हयग्रीवप्रोक्तंललितादेव्याःद्वादशनामस्तोत्रम्
content:
  english: rinu dvadashanamani tasya devya ghatodbhava | yadakarnanamatrena prasanna sa bhavishyati |
    pancami dandanatha ca sanketa samayeshvari || 18|| tatha samayasanketa varahi potrini tatha | vartali
    ca mahasenapyajna cakreshvari tatha || 19|| arighni ceti samproktam namadvadashakam mune | namadvadashakabhikhyavajrapanjaramadhyagah
    | sankate duhkhamapnoti na kadacana manavah || 20|| etairnamabhirabhrasthah sanketam bahu tushtuvuh
    | teshamanugraharthaya pracacala ca sa punah || 21|| iti brahmandapurane uttarabhage saptadashadhyayantargatam
    hayagrivaproktam lalitadevyah dvadashanamastotram samaptam | brahmandapurana | uttarabhaga | lalita
    | adhyaya 17
  devanagari: ृणु द्वादशनामानि तस्या देव्या घटोद्भव । यदाकर्णनमात्रेण प्रसन्ना सा भविष्यति । पञ्चमी दण्डनाथा
    च सङ्केता समयेश्वरी ॥ १८॥ तथा समयसङ्केता वाराही पोत्रिणी तथा । वार्ताली च महासेनाप्याज्ञा चक्रेश्वरी
    तथा ॥ १९॥ अरिघ्नी चेति सम्प्रोक्तं नामद्वादशकं मुने । नामद्वादशकाभिख्यवज्रपञ्जरमध्यगः । सङ्कटे दुःखमाप्नोति
    न कदाचन मानवः ॥ २०॥ एतैर्नामभिरभ्रस्थाः सङ्केतां बहु तुष्टुवुः । तेषामनुग्रहार्थाय प्रचचाल च सा पुनः
    ॥ २१॥ इति ब्रह्माण्डपुराणे उत्तरभागे सप्तदशाध्यायान्तर्गतं हयग्रीवप्रोक्तं ललितादेव्याः द्वादशनामस्तोत्रं
    समाप्तम् । ब्रह्माण्डपुराण । उत्तरभाग । ललिता । अध्याय १७
