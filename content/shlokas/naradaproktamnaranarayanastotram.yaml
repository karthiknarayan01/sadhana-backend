id: naradaproktamnaranarayanastotram
category: stotram
name:
  english: naradaproktamnaranarayanastotram
  devanagari: नारदप्रोक्तंनरनारायणस्तोत्रम्
content:
  english: naradaproktam naranarayanastotram om namo bhagavate upashamashilayoparatanatmyaya namo'kincanavittaya
    rishirishabhaya naranarayanaya paramahamsa paramagurave atmaramadhipataye namo nama iti || 11|| gayati
    cedam | kartasya sargadishu yo na badhyate na hanyate dehagato'pi daihikaih | drashturna drigyasya
    gunairvidushyate tasmai namo'saktaviviktasakshine || 12|| idam hi yogeshvara yoganaipunam hiranyagarbho
    bhagavanjagada yat | yadantakale tvayi nirgune mano bhaktya dadhitojjhitadushkalevarah || 13|| yathaihikamushmikakamalampatah
    suteshu dareshu dhaneshu cintayan | shanketa vidvan kukalevaratyaya
  devanagari: नारदप्रोक्तं नरनारायणस्तोत्रम् ॐ नमो भगवते उपशमशीलायोपरतानात्म्याय नमोऽकिञ्चनवित्ताय ऋषिऋषभाय
    नरनारायणाय परमहंस परमगुरवे आत्मारामाधिपतये नमो नम इति ॥ ११॥ गायति चेदम् । कर्तास्य सर्गादिषु यो न
    बध्यते न हन्यते देहगतोऽपि दैहिकैः । द्रष्टुर्न दृग्यस्य गुणैर्विदूष्यते तस्मै नमोऽसक्तविविक्तसाक्षिणे
    ॥ १२॥ इदं हि योगेश्वर योगनैपुणं हिरण्यगर्भो भगवाञ्जगाद यत् । यदन्तकाले त्वयि निर्गुणे मनो भक्त्या
    दधीतोज्झितदुष्कलेवरः ॥ १३॥ यथैहिकामुष्मिककामलम्पटः सुतेषु दारेषु धनेषु चिन्तयन् । शङ्केत विद्वान्
    कुकलेवरात्यया
meaning: {}
