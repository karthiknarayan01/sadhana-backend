id: narayaniyam-dashaka-2
category: stotram
name:
  english: Narayaniyam Dashaka 2
content:
  english: suryaspardhikiritamurdhvatilakaprodbhasiphalantaram karunyakulanetramardrahasitollasam sunasaputam|
    gandodyanmakarabhakundalayugam kanthojvalatkaustubham tvadrupam vanamalyaharapatalashrivatsadipram
    bhaje|| || keyurangadakankanottamamaharatnanguliyankita shrimadbahucatushkasangatagadashankharipankeruham
    | kancit kancanakancilancchitalasatpitambaralambini malambe vimalambujadyutipadam murtim tavarticchidam
    || || yatttrailokyamahiyaso'pi mahitam sammohanam mohanat kantam kantinidhanato'pi madhuram madhuryadhuryadapi
    | saundaryottarato'pi sundarataram tvadrupamashcaryato' pyashcaryam bhuvane na kasya kutukam pushnati
    vishno vibho || || tattadrinmadhuratmakam tava vapuh samprapya sampanmayi sa devi paramotsuka cirataram
    naste svabhakteshvapi | tenasya bata kashtamacyuta vibho tvadrupamanojnaka premasthairyamayadacapalabalaccapalyavartodabhut
    || || lakshmistavakaramaniyakahritaiveyam pareshvasthire tyasminnanyadapi pramanamadhuna vakshyami
    lakshmipate | ye tvaddhyanagunanukirtanarasasakta hi bhakta jana steshvesha vasati sthiraiva dayitaprastavadattadara
    || || evambhutamanojnatanavasudhanishyandasandohanam tvadrupam paracidrasayanamayam cetoharam shrinvatam
    | sadyah prerayate matim madayate romancayatyangakam vyasincatyapi shitavashpavisarairanandamurchodbhavaih
    || || evambhutataya hi bhaktyabhihito yogassa yogadvayat karmajnanamayat bhrishottamataro yogishvarairgiyate
    | saundaryaikarasatmake tvayi khalu premaprakarshatmika bhaktirnishramameva vishvapurushairlabhya
    ramavallabha || || nishkamam niyatasvadharmacaranam yat karmayogabhidham tadduretyaphalam yadaupanishadajnanopalabhyam
    punah | tattvavyaktataya sudurgamataram cittasya tasmadvibho tvatprematmakabhaktireva satatam svadiyasi
    shreyasi || || atyayasakarani karmapatalanyacarya niryanmala bodhe bhaktipathe'thava'pyucitatamayanti
    kim tavata | klishtva tarkapathe param tava vapurbrahmakhyamanye puna shcittardratvamrite vicintya
    bahubhissiddhyanti janmantaraih || || tvadbhaktistu katharasamritajharinirmajjanena svayam siddhyanti
    vimalaprabodhapadavimakleshatastanvati | sadyassiddhikari jayatyayi vibho saivastu me tvatpada premapraudhirasardrata
    drutataram vatalayadhishvara ||
  devanagari: सूर्यस्पर्धिकिरीटमूर्ध्वतिलकप्रोद्भासिफालान्तरं कारुण्याकुलनेत्रमार्द्रहसितोल्लासं सुनासापुटम्।
    गण्डोद्यन्मकराभकुण्डलयुगं कण्ठोज्वलत्कौस्तुभं त्वद्रूपं वनमाल्यहारपटलश्रीवत्सदीप्रं भजे॥ ॥ केयूराङ्गदकङ्कणोत्तममहारत्नाङ्गुलीयाङ्कित
    श्रीमद्बाहुचतुष्कसङ्गतगदाशङ्खारिपङ्केरुहाम् । काञ्चित् काञ्चनकाञ्चिलाञ्च्छितलसत्पीताम्बरालम्बिनी मालम्बे
    विमलाम्बुजद्युतिपदां मूर्तिं तवार्तिच्छिदम् ॥ ॥ यत्त्त्रैलोक्यमहीयसोऽपि महितं सम्मोहनं मोहनात् कान्तं
    कान्तिनिधानतोऽपि मधुरं माधुर्यधुर्यादपि । सौन्दर्योत्तरतोऽपि सुन्दरतरं त्वद्रूपमाश्चर्यतोऽ प्याश्चर्यं
    भुवने न कस्य कुतुकं पुष्णाति विष्णो विभो ॥ ॥ तत्तादृङ्मधुरात्मकं तव वपुः सम्प्राप्य सम्पन्मयी सा देवी
    परमोत्सुका चिरतरं नास्ते स्वभक्तेष्वपि । तेनास्या बत कष्टमच्युत विभो त्वद्रूपमानोज्ञक प्रेमस्थैर्यमयादचापलबलाच्चापल्यवार्तोदभूत्
    ॥ ॥ लक्ष्मीस्तावकरामणीयकहृतैवेयं परेष्वस्थिरे त्यस्मिन्नन्यदपि प्रमाणमधुना वक्ष्यामि लक्ष्मीपते ।
    ये त्वद्ध्यानगुणानुकीर्तनरसासक्ता हि भक्ता जना स्तेष्वेषा वसति स्थिरैव दयितप्रस्तावदत्तादरा ॥ ॥ एवम्भूतमनोज्ञतानवसुधानिष्यन्दसन्दोहनं
    त्वद्रूपं परचिद्रसायनमयं चेतोहरं शृण्वताम् । सद्यः प्रेरयते मतिं मदयते रोमाञ्चयत्यङ्गकं व्यासिञ्चत्यपि
    शीतवाष्पविसरैरानन्दमूर्छोद्भवैः ॥ ॥ एवम्भूततया हि भक्त्यभिहितो योगस्स योगद्वयात् कर्मज्ञानमयात् भृशोत्तमतरो
    योगीश्वरैर्गीयते । सौन्दर्यैकरसात्मके त्वयि खलु प्रेमप्रकर्षात्मिका भक्तिर्निश्रममेव विश्वपुरुषैर्लभ्या
    रमावल्लभ ॥ ॥ निष्कामं नियतस्वधर्मचरणं यत् कर्मयोगाभिधं तद्दूरेत्यफलं यदौपनिषदज्ञानोपलभ्यं पुनः । तत्त्वव्यक्ततया
    सुदुर्गमतरं चित्तस्य तस्माद्विभो त्वत्प्रेमात्मकभक्तिरेव सततं स्वादीयसी श्रेयसी ॥ ॥ अत्यायासकराणि
    कर्मपटलान्याचर्य निर्यन्मला बोधे भक्तिपथेऽथवाऽप्युचिततामायान्ति किं तावता । क्लिष्ट्वा तर्कपथे परं
    तव वपुर्ब्रह्माख्यमन्ये पुन श्चित्तार्द्रत्वमृते विचिन्त्य बहुभिस्सिद्ध्यन्ति जन्मान्तरैः ॥ ॥ त्वद्भक्तिस्तु
    कथारसामृतझरीनिर्मज्जनेन स्वयं सिद्ध्यन्ती विमलप्रबोधपदवीमक्लेशतस्तन्वती । सद्यस्सिद्धिकरी जयत्ययि
    विभो सैवास्तु मे त्वत्पद प्रेमप्रौढिरसार्द्रता द्रुततरं वातालयाधीश्वर ॥
