id: matrikacakravivekah
category: mantra
name:
  english: matrikacakravivekah
  devanagari: मातृकाचक्रविवेकः
content:
  english: micchatmano manasa eva vibhati kukshau | purvatra matri mana eva shariratabhak pratyakshamuttarapade
    tu sharirameva || 12|| cetashcamatkritipadam vamati svalinam vishvam bahih shrutimukhendriyavargabhavat
    | tatrapi dhindriyaganah pavano'pi prithvi jneyairjalairapi marudbhirudirito'ntah || 13|| karmendriyani
    kathinatvaparantabhanji vahnyakritini khapadasthadharashritani | prithvimayaprakritikhagrahanonmukhani
    bodhyani bhutavitateriha vaiparitye || 14|| manatmakasya taranerdvayato hi siddhih mayabalatprathamatatra
    ca meyakotyah | grahyagrahitripadavarnasamanvayena yojyah kala bahirathantarapi kramajnaih || 15||
    mata dashendriyamayodashakam ca meyam tanmelanaddashakalatmadasharayugmam | antah kaladvayamiha prakritau
    nilina straigunyamatari puma~shcaturasrabimbe || 16|| manatmanaiva cidacitsthitiratracakre bhedatmake
    na bhavatiha visargabindoh | masyanushaktirapi mukhyasamanvayasya bindvekabhogapadamatripurocitasya
    || 17|| svapne smritam tadanu jagrati satyakalpam bandham prapadya vapusha svavimarshashaktya | kshitya
    ca tatparavasho hritamatribhavo madhyandinadyumanireshamakarabinduh || 18|| yatpadivargavamukharnacatushtayasya
    sankocavarjanamidam khalutantranitya | turyasthitam hamukhashantacatushtayatma
  devanagari: मिच्छात्मनो मनस एव विभाति कुक्षौ । पूर्वत्र मातृ मन एव शरीरताभाक् प्रत्यक्षमुत्तरपदे तु
    शरीरमेव ॥ १२॥ चेतश्चमत्कृतिपदं वमति स्वलीनं विश्वं बहिः श्रुतिमुखेन्द्रियवर्गभावात् । तत्रापि धीन्द्रियगणः
    पवनोऽपि पृथ्वी ज्ञेयैर्जलैरपि मरुद्भिरुदीरितोऽन्तः ॥ १३॥ कर्मेन्द्रियाणि कठिनत्वपरान्तभाञ्जि वह्न्याकृतीनि
    खपदस्थधराश्रितानि । पृथ्वीमयप्रकृतिखग्रहणोन्मुखानि बोध्यानि भूतविततेरिह वैपरीत्ये ॥ १४॥ मानात्मकस्य
    तरणेर्द्वयतो हि सिद्धिः मायाबलात्प्रथमतात्र च मेयकोट्याः । ग्राह्यग्रहीतृपदवर्णसमन्वयेन योज्याः कला
    बहिरथान्तरपि क्रमज्ञैः ॥ १५॥ माता दशेन्द्रियमयोदशकं च मेयं तन्मेलनाद्दशकलात्मदशारयुग्मम् । अन्तः कलाद्वयमिह
    प्रकृतौ निलीन स्त्रैगुण्यमातरि पुमाँश्चतुरस्रबिम्बे ॥ १६॥ मानात्मनैव चिदचित्स्थितिरत्रचक्रे भेदात्मके
    न भवतीह विसर्गबिन्दोः । मस्यानुषक्तिरपि मुख्यसमन्वयस्य बिन्द्वेकभोगपदमातृपुरोचितस्य ॥ १७॥ स्वप्ने
    स्मृतं तदनु जाग्रति सत्यकल्पं बन्धं प्रपद्य वपुषा स्वविमर्शशक्त्या । क्षित्या च तत्परवशो हृतमातृभावो
    मध्यन्दिनद्युमणिरेषमकारबिन्दुः ॥ १८॥ यत्पादिवर्गवमुखार्णचतुष्टयस्य सङ्कोचवर्जनमिदं खलुतन्त्रनीत्या
    । तुर्यस्थितं हमुखशान्तचतुष्टयात्म
