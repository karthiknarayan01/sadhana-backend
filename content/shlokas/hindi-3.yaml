id: hindi-3
category: sahasranama
name:
  english: hindi
  devanagari: ःइन्दि
content:
  english: atha shriyogeshvarakavi dvara varnitam shrijanakisahasranamastotram | shrikaviruvaca | nilendivaralocanam
    janakajam vismerabimbadharam brahmavishnumaheshasevyacaranam divyatsuvarnaprabham | savye shrimithileshituh
    sunayanakrode muda rajitam vande bandhugananvitamanucarivrindaih samaradhitam || 1|| nile kamala ke
    samana jinake vishala netra
  devanagari: अथ श्रीयोगेश्वरकवि द्वारा वर्णितं श्रीजानकीसहस्रनामस्तोत्रम् । श्रीकविरुवाच । नीलेन्दीवरलोचनां
    जनकजां विस्मेरबिम्बाधरां ब्रह्माविष्णुमहेशसेव्यचरणां दीव्यत्सुवर्णप्रभाम् । सव्ये श्रीमिथिलेशितुः
    सुनयनाक्रोडे मुदा राजितां वन्दे बन्धुगणान्वितामनुचरीवृन्दैः समाराधिताम् ॥ १॥ नीले कमल के समान जिनके
    विशाल नेत्र
meaning: {}
