id: shakraproktamsuryashtottarashatanamastotram
category: stotram
name:
  english: shakraproktamsuryashtottarashatanamastotram
  devanagari: शक्रप्रोक्तंसूर्याष्टोत्तरशतनामस्तोत्रम्
content:
  english: 10|| purushah shashvato yogi vyaktavyaktah sanatanah | lokadhyakshah prajadhyaksho vishvakarma
    tamonudah || 11|| varunah sagaromshushca jivanto jivano'riha | bhutashrayo bhutapatih sarvabhutanishevitah
    || 12|| srashta samvarttako vahnih sarvasyadikaro'malah | anantah kapilo bhanuh kamadah sarvatomukhah
    || 13|| jayo vishado varadah sarvadhatunishevitah | samah suvarno bhutadih shighragah pranadharakah
    || 14|| dhanvantarirdhumaketuradidevo'diteh sutah | dvadashatma'ravindakshah pita mata pitamahah ||
    15|| svargadvaram prajadvaram mokshadvaram trivishtapam | dehakartta prashantatma vishvatma vishvatomukhah
    | caracaratma sukshmatma maitrena vapusha'nvitah || 15|| etadvai kirtaniyasya suryasyamitatejasah
    | namnamashtottarashatam proktam shakrena dhimata || 17|| iti shriskandapurane prabhasakhande prabhasakshetramahatmye
    ekonashityadhikadvishatatamadhyayantargatam shakraproktam suryashtottarashatanamastotram samaptam
    | skandapurana | prabhasakhanda | adhyaya 279
  devanagari: १०॥ पुरुषः शाश्वतो योगी व्यक्ताव्यक्तः सनातनः । लोकाध्यक्षः प्रजाध्यक्षो विश्वकर्मा तमोनुदः
    ॥ ११॥ वरुणः सागरोंशुश्च जीवन्तो जीवनोऽरिहा । भूताश्रयो भूतपतिः सर्वभूतनिषेवितः ॥ १२॥ स्रष्टा संवर्त्तको
    वह्निः सर्वस्यादिकरोऽमलः । अनन्तः कपिलो भानुः कामदः सर्वतोमुखः ॥ १३॥ जयो विषादो वरदः सर्वधातुनिषेवितः
    । समः सुवर्णो भूतादिः शीघ्रगः प्राणधारकः ॥ १४॥ धन्वन्तरिर्धूमकेतुरादिदेवोऽदितेः सुतः । द्वादशात्माऽरविन्दाक्षः
    पिता माता पितामहः ॥ १५॥ स्वर्गद्वारं प्रजाद्वारं मोक्षद्वारं त्रिविष्टपम् । देहकर्त्ता प्रशान्तात्मा
    विश्वात्मा विश्वतोमुखः । चराचरात्मा सूक्ष्मात्मा मैत्रेण वपुषाऽन्वितः ॥ १५॥ एतद्वै कीर्तनीयस्य सूर्यस्यामिततेजसः
    । नाम्नामष्टोत्तरशतं प्रोक्तं शक्रेण धीमता ॥ १७॥ इति श्रीस्कन्दपुराणे प्रभासखण्डे प्रभासक्षेत्रमाहात्म्ये
    एकोनाशीत्यधिकद्विशततमाध्यायान्तर्गतं शक्रप्रोक्तं सूर्याष्टोत्तरशतनामस्तोत्रं समाप्तम् । स्कन्दपुराण
    । प्रभासखण्ड । अध्याय २७९
