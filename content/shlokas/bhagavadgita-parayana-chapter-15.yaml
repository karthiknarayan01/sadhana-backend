id: bhagavadgita-parayana-chapter-15
category: stotram
name:
  english: Bhagavadgita Parayana - Chapter 15
content:
  english: om shri paramatmane namah atha pancadasho'dhyayah purushottamapraptiyogah shri bhagavanuvaca
    urdhvamulamadhahshakham ashvattham prahuravyayam | chandamsi yasya parnani yastam veda sa vedavit
    || || adhashcordhvam prasritastasya shakhah gunapravriddha vishayapravalah | adhashca mulanyanusantatani
    karmanubandhini manushyaloke || || na rupamasyeha tathopalabhyate nanto na cadirna ca sampratishtha
    | ashvatthamenam suvirudhamulam asangashastrena dridhena chittva || || tatah padam tatparimargitavyam
    yasmingata na nivartanti bhuyah | tameva cadyam purusham prapadye yatah pravrittih prasrita purani
    || || nirmanamoha jitasangadoshah adhyatmanitya vinivrittakamah | dvandvairvimuktah sukhaduhkha sanjnaih
    gacchantyamudhah padamavyayam tat || || na tadbhasayate suryah na shashanko na pavakah | yadgatva
    na nivartante taddhama paramam mama || || mamaivamsho jivaloke jivabhutah sanatanah | manah shashthanindriyani
    prakritisthani karshati || || shariram yadavapnoti yaccapyutkramatishvarah | grihitvaitani samyati
    vayurgandhanivashayat || || shrotram cakshuh sparshanam ca rasanam ghranameva ca | adhishthaya manashcayam
    vishayanupasevate || || utkramantam sthitam va'pi bhunjanam va gunanvitam | vimudha nanupashyanti
    pashyanti jnanacakshushah || || yatanto yoginashcainam pashyantyatmanyavasthitam | yatanto 'pyakritatmanah
    nainam pashyantyacetasah || || yadadityagatam tejah jagadbhasayate'khilam | yaccandramasi yaccagnau
    tattejo viddhi mamakam || || gamavishya ca bhutani dharayamyahamojasa | pushnami caushadhih sarvah
    somo bhutva rasatmakah || || aham vaishvanaro bhutva praninam dehamashritah | pranapanasamayuktah
    pacamyannam caturvidham || || sarvasya caham hridi sannivishtah mattah smritirjnanamapohanam ca |
    vedaishca sarvairahameva vedyah vedantakridvedavideva caham || || dvavimau purushau loke ksharashcakshara
    eva ca | ksharah sarvani bhutani kutastho'kshara ucyate || || uttamah purushastvanyah paramatmetyudahritah
    | yo lokatrayamavishya bibhartyavyaya ishvarah || || yasmatksharamatito'ham aksharadapi cottamah |
    ato'smi loke vede ca prathitah purushottamah || || yo mamevamasammudhah janati purushottamam | sa
    sarvavidbhajati mam sarvabhavena bharata || || iti guhyatamam shastram idamuktam maya'nagha | etadbuddhva
    buddhimansyat kritakrityashca bharata || || || om tatsaditi shrimadbhagavadgitasu upanishatsu brahmavidyayam
    yogashastre shrikrishnarjunasamvade purushottamapraptiyogo nama pancadasho'dhyayah ||
  devanagari: ॐ श्री परमात्मने नमः अथ पञ्चदशोऽध्यायः पुरुषोत्तमप्राप्तियोगः श्री भगवानुवाच ऊर्ध्वमूलमधःशाखम्
    अश्वत्थं प्राहुरव्ययम् । छन्दांसि यस्य पर्णानि यस्तं वेद स वेदवित् ॥ ॥ अधश्चोर्ध्वं प्रसृतास्तस्य
    शाखाः गुणप्रवृद्धा विषयप्रवालाः । अधश्च मूलान्यनुसन्ततानि कर्मानुबन्धीनि मनुष्यलोके ॥ ॥ न रूपमस्येह
    तथोपलभ्यते नान्तो न चादिर्न च सम्प्रतिष्ठा । अश्वत्थमेनं सुविरूढमूलम् असङ्गशस्त्रेण दृढेन छित्त्वा
    ॥ ॥ ततः पदं तत्परिमार्गितव्यं यस्मिन्गता न निवर्तन्ति भूयः । तमेव चाद्यं पुरुषं प्रपद्ये यतः प्रवृत्तिः
    प्रसृता पुराणी ॥ ॥ निर्मानमोहा जितसङ्गदोषाः अध्यात्मनित्या विनिवृत्तकामाः । द्वन्द्वैर्विमुक्ताः सुखदुःख
    सञ्ज्ञैः गच्छन्त्यमूढाः पदमव्ययं तत् ॥ ॥ न तद्भासयते सूर्यः न शशाङ्को न पावकः । यद्गत्वा न निवर्तन्ते
    तद्धाम परमं मम ॥ ॥ ममैवांशो जीवलोके जीवभूतः सनातनः । मनः षष्ठानीन्द्रियाणि प्रकृतिस्थानि कर्षति ॥
    ॥ शरीरं यदवाप्नोति यच्चाप्युत्क्रामतीश्वरः । गृहीत्वैतानि संयाति वायुर्गन्धानिवाशयात् ॥ ॥ श्रोत्रं
    चक्षुः स्पर्शनं च रसनं घ्राणमेव च । अधिष्ठाय मनश्चायं विषयानुपसेवते ॥ ॥ उत्क्रामन्तं स्थितं वाऽपि
    भुञ्जानं वा गुणान्वितम् । विमूढा नानुपश्यन्ति पश्यन्ति ज्ञानचक्षुषः ॥ ॥ यतन्तो योगिनश्चैनं पश्यन्त्यात्मन्यवस्थितम्
    । यतन्तो ऽप्यकृतात्मानः नैनं पश्यन्त्यचेतसः ॥ ॥ यदादित्यगतं तेजः जगद्भासयतेऽखिलम् । यच्चन्द्रमसि यच्चाग्नौ
    तत्तेजो विद्धि मामकम् ॥ ॥ गामाविश्य च भूतानि धारयाम्यहमोजसा । पुष्णामि चौषधीः सर्वाः सोमो भूत्वा रसात्मकः
    ॥ ॥ अहं वैश्वानरो भूत्वा प्राणिनां देहमाश्रितः । प्राणापानसमायुक्तः पचाम्यन्नं चतुर्विधम् ॥ ॥ सर्वस्य
    चाहं हृदि सन्निविष्टः मत्तः स्मृतिर्ज्ञानमपोहनं च । वेदैश्च सर्वैरहमेव वेद्यः वेदान्तकृद्वेदविदेव
    चाहम् ॥ ॥ द्वाविमौ पुरुषौ लोके क्षरश्चाक्षर एव च । क्षरः सर्वाणि भूतानि कूटस्थोऽक्षर उच्यते ॥ ॥ उत्तमः
    पुरुषस्त्वन्यः परमात्मेत्युदाहृतः । यो लोकत्रयमाविश्य बिभर्त्यव्यय ईश्वरः ॥ ॥ यस्मात्क्षरमतीतोऽहम्
    अक्षरादपि चोत्तमः । अतोऽस्मि लोके वेदे च प्रथितः पुरुषोत्तमः ॥ ॥ यो मामेवमसम्मूढः जानाति पुरुषोत्तमम्
    । स सर्वविद्भजति मां सर्वभावेन भारत ॥ ॥ इति गुह्यतमं शास्त्रम् इदमुक्तं मयाऽनघ । एतद्बुद्ध्वा बुद्धिमान्स्यात्
    कृतकृत्यश्च भारत ॥ ॥ ॥ ॐ तत्सदिति श्रीमद्भगवद्गीतासु उपनिषत्सु ब्रह्मविद्यायां योगशास्त्रे श्रीकृष्णार्जुनसंवादे
    पुरुषोत्तमप्राप्तियोगो नाम पञ्चदशोऽध्यायः ॥
