id: guhyeshvaristotram
category: stotram
name:
  english: guhyeshvaristotram
  devanagari: गुह्येश्वरीस्तोत्रम्
content:
  english: guhyeshvaristotram bhagavati bahurupe nirvikare niranje nimitanikhilarupe nishcayatitarupe
    | akhilanigamapare nityanityasvabhave caranakamalayugmam naumi devi tvadiyam || 1|| hasitamukhashashankam
    jyotsnaya ratribhutam dashashatakiranodyadvaktramadhyandinam te | arunavadanashobha audayi castakale
    caranakamalayugmam naumi devi tvadiyam || 2|| galajatharapadeshu svargamartyahilokah sakalabhaganadanta
    romaraji drumaste | giraya iva nitamba raktashuklah samudrash caranakamalayugmam naumi devi tvadiyam
    || 3|| pavanadahanavegah shvasaprashvasa eva pralayaprabhavakalo milanonmilanabhyam | dvidashatapanabhuta
    bhimavaktrastvadiyash caranakamalayugmam naumi devi tvadiyam || 4|| anupamatanudeham vyapyamanam samantan
    nikhilanigamasaram darshayan devi divyam | tribhuvanamakhilam te darshitumeti buddhish caranakamalayugmam
    naumi devi tvadiyam || 5|| vidhimukhavibudhaste kinkarah padasamstha mukutavidhritabuddhe sarvamarga
    hi shuddhe | kimu tava mahimanam varnaye guhyadevi caranakamalayugmam naumi devi tvadiyam || 6|| anupathati
    samaptau pujane bhaktiman yo nutimati vitagoti spashtamevasya buddhih | sakalajanajananya bhaktisampattimuccaih
    karatalavashagastah siddhipushtayau labhante || 7|| iti shri svayambhupuranoddhritam manjunathakritam
    guhyeshvaristotram sampurnam ||
  devanagari: गुह्येश्वरीस्तोत्रम् भगवति बहुरूपे निर्विकारे निरञ्जे निमितनिखिलरूपे निश्चयातीतरूपे । अखिलनिगमपारे
    नित्यनित्यस्वभावे चरणकमलयुग्मं नौमि देवि त्वदीयम् ॥ १॥ हसितमुखशशाङ्कं ज्योत्स्नया रात्रिभूतं दशशतकिरणोद्यद्वक्त्रमाध्यन्दिनं
    ते । अरुणवदनशोभा औदयी चास्तकाले चरणकमलयुग्मं नौमि देवि त्वदीयम् ॥ २॥ गलजठरपदेषु स्वर्गमर्त्याहिलोकाः
    सकलभगणदन्ता रोमराजी द्रुमास्ते । गिरय इव नितम्बा रक्तशुक्लाः समुद्राश् चरणकमलयुग्मं नौमि देवि त्वदीयम्
    ॥ ३॥ पवनदहनवेगाः श्वासप्रश्वास एव प्रलयप्रभवकालो मीलनोन्मीलनाभ्याम् । द्विदशतपनभूता भीमवक्त्रास्त्वदीयाश्
    चरणकमलयुग्मं नौमि देवि त्वदीयम् ॥ ४॥ अनुपमतनुदेहं व्याप्यमानं समन्तान् निखिलनिगमसारं दर्शयन् देवि
    दिव्यम् । त्रिभुवनमखिलं ते दर्शितुमेति बुद्धिश् चरणकमलयुग्मं नौमि देवि त्वदीयम् ॥ ५॥ विधिमुखविबुधास्ते
    किङ्कराः पादसंस्था मुकुटविधृतबुद्धे सर्वमार्गा हि शुद्धे । किमु तव महिमानं वर्णये गुह्यदेवि चरणकमलयुग्मं
    नौमि देवि त्वदीयम् ॥ ६॥ अनुपठति समाप्तौ पूजने भक्तिमान् यो नुतिमति वितगोति स्पष्टमेवास्य बुद्धिः ।
    सकलजनजनन्या भक्तिसम्पत्तिमुच्चैः करतलवशगास्ताः सिद्धिपुष्टयौ लभन्ते ॥ ७॥ इति श्री स्वयम्भूपुराणोद्धृतं
    मञ्जुनाथकृतं गुह्येश्वरीस्तोत्रं सम्पूर्णम् ॥
