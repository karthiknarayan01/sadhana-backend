id: lingashtakam
category: stotram
name:
  english: Lingashtakam
content:
  english: brahmamurari surarcita lingam nirmalabhasita shobhita lingam | janmaja duhkha vinashaka lingam
    tatpranamami sadashiva lingam || || devamuni pravararcita lingam kamadahana karunakara lingam | ravana
    darpa vinashana lingam tatpranamami sadashiva lingam || || sarva sugandha sulepita lingam buddhi vivardhana
    karana lingam | siddha surasura vandita lingam tatpranamami sadashiva lingam || || kanaka mahamani
    bhushita lingam phanipati veshtita shobhita lingam | dakshasuyajna vinashana lingam tatpranamami sadashiva
    lingam || || kunkuma candana lepita lingam pankaja hara sushobhita lingam | sancita papa vinashana
    lingam tatpranamami sadashiva lingam || || devaganarcita sevita lingam bhavai rbhaktibhireva ca lingam
    | dinakara koti prabhakara lingam tatpranamami sadashiva lingam || || ashtadalopariveshtita lingam
    sarvasamudbhava karana lingam | ashtadaridra vinashana lingam tatpranamami sadashiva lingam || ||
    suraguru suravara pujita lingam suravana pushpa sadarcita lingam | paratparam paramatmaka lingam tatpranamami
    sadashiva lingam || || lingashtakamidam punyam yah patheshshiva sannidhau | shivalokamavapnoti shivena
    saha modate ||
  devanagari: ब्रह्ममुरारि सुरार्चित लिङ्गं निर्मलभासित शोभित लिङ्गम् । जन्मज दुःख विनाशक लिङ्गं तत्प्रणमामि
    सदाशिव लिङ्गम् ॥ ॥ देवमुनि प्रवरार्चित लिङ्गं कामदहन करुणाकर लिङ्गम् । रावण दर्प विनाशन लिङ्गं तत्प्रणमामि
    सदाशिव लिङ्गम् ॥ ॥ सर्व सुगन्ध सुलेपित लिङ्गं बुद्धि विवर्धन कारण लिङ्गम् । सिद्ध सुरासुर वन्दित लिङ्गं
    तत्प्रणमामि सदाशिव लिङ्गम् ॥ ॥ कनक महामणि भूषित लिङ्गं फणिपति वेष्टित शोभित लिङ्गम् । दक्षसुयज्ञ विनाशन
    लिङ्गं तत्प्रणमामि सदाशिव लिङ्गम् ॥ ॥ कुङ्कुम चन्दन लेपित लिङ्गं पङ्कज हार सुशोभित लिङ्गम् । सञ्चित
    पाप विनाशन लिङ्गं तत्प्रणमामि सदाशिव लिङ्गम् ॥ ॥ देवगणार्चित सेवित लिङ्गं भावै र्भक्तिभिरेव च लिङ्गम्
    । दिनकर कोटि प्रभाकर लिङ्गं तत्प्रणमामि सदाशिव लिङ्गम् ॥ ॥ अष्टदलोपरिवेष्टित लिङ्गं सर्वसमुद्भव कारण
    लिङ्गम् । अष्टदरिद्र विनाशन लिङ्गं तत्प्रणमामि सदाशिव लिङ्गम् ॥ ॥ सुरगुरु सुरवर पूजित लिङ्गं सुरवन
    पुष्प सदार्चित लिङ्गम् । परात्परं परमात्मक लिङ्गं तत्प्रणमामि सदाशिव लिङ्गम् ॥ ॥ लिङ्गाष्टकमिदं पुण्यं
    यः पठेश्शिव सन्निधौ । शिवलोकमवाप्नोति शिवेन सह मोदते ॥
