id: indradyumnakritam2vishnustotram
category: stotram
name:
  english: indradyumnakritam2vishnustotram
  devanagari: इन्द्रद्युम्नकृतं२विष्णुस्तोत्रम्
content:
  english: indradyumnakritam 2 vishnustotram indradyumna uvaca | vasudeva namaste'stu namaste mokshakarana
    | trahi mam sarvalokesha janmasamsarasagarat || 53
  devanagari: इन्द्रद्युम्नकृतं २ विष्णुस्तोत्रम् इन्द्रद्युम्न उवाच । वासुदेव नमस्तेऽस्तु नमस्ते मोक्षकारण
    । त्राहि मां सर्वलोकेश जन्मसंसारसागरात् ॥ ५३
meaning: {}
