    shucih || || shrinoti va shravayati pujante bhaktisamyutah | sarvan kamanavapnoti jivecca sharadam
    shatam || || yo namabhirnrisimhadyairarcayetkramasho mama | sarvatirtheshu yatpunyam sarvatirtheshu
    yatphalam || || sarvapujasu yatproktam tatsarvam labhate bhrisham | jatismaratvam labhate brahmajnanam
    sanatanam || || sarvapapavinirmuktah tadvishnoh paramam padam | mannamakavacam badhva vicaredvigatajvarah
    || || bhutabhetalakushmanda pishacabrahmarakshasah | shakinidakinijyeshtha nili balagrahadikah ||
    || dushtagrahashca nashyanti yaksharakshasapannagah | ye ca sandhyagrahah sarve candalagrahasanjnikah
    || || nishacaragrahah sarve pranashyanti ca duratah | kukshirogam ca hridrogam shulapasmarameva ca
    || || aikahikam dvyahikam ca caturthikamatha jvaram | adhayo vyadhayah sarve roga rogadhidevatah ||
    || shighram nashyanti te sarve nrisimhasmaranat surah | rajano dasatam yanti shatravo yanti mitratam
    || || jalani sthalatam yanti vahnayo yanti shitatam | vishanyapyamrita yanti nrisimhasmaranatsurah
    || || rajyakamo labhedrajyam dhanakamo labheddhanam | vidyakamo labhedvidyam baddho mucyeta bandhanat
    || || vyalavyaghrabhayam nasti corasarpadikam tatha | anukula bhavedbharya lokaishca pratipujyate
    || || suputram dhanadhanyam ca bhavanti vigatajvarah | etatsarvam samapnoti nrisimhasya prasadatah
    || || jalasantarane caiva parvataranyameva ca | vane''pi viciranmartyo durgame vishame pathi || ||
    bilapraveshane capi narasimham na vismaret | brahmaghnashca pashughnashca bhrunaha gurutalpagah ||
    || mucyate sarvapapebhyah kritaghnah strivighatakah | vedanam dushakashcapi matapitrivinindakah ||
    || asatyastu tetha yajnanindako lokanindakah | smritva sakrinnrisimham tu mucyate sarvakilbishaih
    || || bahunatra kimuktena smritva mam shuddhamanasah | yatra yatra carenmartyo nrisimhastatra rakshati
    || || gacchan tishthan svapan bhunjan jagrannapi hasannapi | nrisimheti nrisimheti nrisimheti sada
    smaran || || pumanna lipyate papairbhuktim muktim ca vindati | nari subhagatameti saubhagyam ca svarupatam
    || || bhartuh priyatvam labhate na vaidhavyam ca vindati | na sapatnim ca janmante samyak jnani bhavedvijah
    || || bhumipradakshinanmartyo yatphalam labhate cirat | tatphalam labhate narasimhamurtipradakshinat
    || || markandeya uvaca | ityuktva devadevesho lakshmimalingya lilaya | prahladasyabhishekam tu brahmane
    copadishtavan || || shrishailasya prasade tu lokanam ca hitaya vai | svarupam sthapayamasa prakritistho''bhavattada
    || || brahmapi daityarajanam prahladamabhyashecayat | daivataih saha suprito hyatmalokam yayau svayam
    || || hiranyakashiporbhitya prapalayya shacipatih | svargarajyaparibhrashto yuganamekavimshatim ||
    || nrisimhena hate daitye svargalokamavapa sah | dikpalashca susampraptah svasvasthanamanuttamam ||
    || dharme matih samastanam prajanamabhavattada | evam namasahasram me brahmana nirmitam pura || ||
    putranadhyapayamasa sanakadinmahamatih | ucuste ca tatah sarvalokanam hitakamyaya || || devata rishayah
    siddha yakshavidyadharoragah | gandharvashca manushyashca ihamutraphalaishinah || || yasya stotrasya
    pathaddhi vishuddhamanaso''bhavan | sanatkumarah samprapto bharadvajo mahamatih || || tasmadangirasah
    praptastasmatprapto mahakratuh | jagraha bhargavastasmadagnimitraya so''bravit || | jaigishavyaya
    sa praha so''braviccyavanaya ca | tasma uvaca shandilyo gargaya praha vai munih || || kratunjayaya
    sa praha jatukarnyaya samyami | vishnuvriddhaya so''pyaha so''pi bodhayanaya ca || || kramatsa vishnave
    praha sa prahoddhamakukshaye | simhatejashca tasmacca shripriyaya dadau ca nah || upadishto''smi tenahamidam
    namasahasrakam | tatprasadadamrityurme yasmatkasmadbhayam na hi || || maya ca kathitam narasimhastotramidam
    tava | tvam hi nityam shucirbhutva tamaradhaya shashvatam || || sarvabhutashrayam devam nrisimham
    bhaktavatsalam | pujayitva stavam japtva hutva nishcalamanasah || || prapyase mahatim siddhim sarvan
    kamanvarottaman | ayameva parodharmastvidameva param tapah || || idameva param jnanamidameva mahadvratam
    | ayameva sadacarastvayameva sada makhah || || idameva trayo vedah sacchastranyagamani ca | nrisimhamantradanyacca
    vaidikam tu na vidyate || || yadihasti tadanyatra yannehasti na tatkvacit | kathitam te nrisimhasya
    caritam papanashanam || || sarvamantramayam tapatrayopashamanam param | sarvarthasadhanam divyam kim
    bhuyah shrotumicchasi || || iti shrinrisimhapurane nrisimhapradurbhave shrimaddivya lakshminrisimha
    sahasranama stotram ||'
  devanagari: ॥ पूर्वपीठिका ॥ मार्कण्डेय उवाच । एवं युद्धमभूद्घोरं रौद्रं दैत्यबलैः सह । नृसिंहस्याङ्गसम्भूतैर्नारसिंहैरनेकशः
    ॥ ॥ दैत्यकोटिर्हतास्तत्र केचिद्भीताः पलायिताः । तं दृष्ट्वातीव सङ्क्रुद्धो हिरण्यकशिपुः स्वयम् ॥ ॥
    भूतपूर्वैरमृत्युर्मे इति ब्रह्मवरोद्धतः । ववर्ष शरवर्षेण नारसिंहो भृशं बली ॥ ॥ द्वन्द्वयुद्धमभूदुग्रं
    दिव्यवर्षसहस्रकम् । दैत्येन्द्रे साहसं दृष्ट्वा देवाश्चेन्द्रपुरोगमाः ॥ ॥ श्रेयः कस्य भवेदत्र इति
    चिन्तापरा भवन् । तदा क्रुद्धो नृसिंहस्तु दैत्येन्द्रप्रहितान्यपि ॥ ॥ विष्णुचक्रं महाचक्रं कालचक्रं
    तु वैष्णवम् । रौद्रं पाशुपतं ब्राह्मं कौबेरं कुलिशासनम् ॥ ॥ आग्नेयं वारुणं सौम्यं मोहनं सौरपार्वतम्
    । भार्गवादि बहून्यस्त्राण्यभक्षयत कोपनः ॥ ॥ सन्ध्याकाले सभाद्वारे स्वाङ्के निक्षिप्य भैरवः । ततः खड्गधरं
    दैत्यं जग्राह नरकेसरी ॥ ॥ हिरण्यकशिपोर्वक्षो विदार्यातीव रोषितः । उद्धृत्य चान्त्रमालानि नखैर्वज्रसमप्रभैः
    ॥ ॥ मेने कृतार्थमात्मानं सर्वतः पर्यवैक्षत । हर्षिता देवताः सर्वाः पुष्पवृष्टिमवाकिरन् ॥ ॥ देवदुन्दुभयो
    नेदुर्विमलाश्च दिशोऽभवन् । नरसिंहमतीवोग्रं विकीर्णवदनं भृशम् ॥ ॥ लेलिहानं च गर्जन्तं कालानलसमप्रभम्
    । अतिरौद्रं महाकायं महादंष्ट्रं महारुतम् ॥ ॥ महासिंहं महारूपं दृष्ट्वा सङ्क्षुभितं जगत् । सर्वदेवगणैः
    सार्थं तत्रागत्य पितामहः ॥ ॥ आगन्तुकैर्भूतपूर्वैर्वर्तमानैरनुत्तमैः । गुणैर्नामसहस्रेण तुष्टाव श्रुतिसम्मतैः
    ॥ ॥ ॐ नमः श्रीमद्दिव्यलक्ष्मीनृसिंह सहस्रनामस्तोत्रमहामन्त्रस्य ब्रह्मा ऋषिः श्रीलक्ष्मीनृसिंहो देवता
    श्रीनृसिंहः परमात्मा बीजं लक्ष्मीर्माया शक्तिः ॐ क्ष्रौं ह्रीं इति बीजानि ॐ श्रीं अं आं इति शक्तयः
    विकीर्णनखदंष्ट्रायुधायेति कीलकं श्रीलक्ष्मीनृसिंह प्रसादसिद्ध्यर्थे श्रीलक्ष्मीनृसिंह सहस्रनामस्तोत्र
    मन्त्रजपे विनियोगः । न्यासः ॐ श्रीलक्ष्मीनृसिंहाय नमः अङ्गुष्ठाभ्यां नमः । ॐ वज्रनखाय नमः तर्जनीभ्यां
    नमः । ॐ महारुद्राय नमः मध्यमाभ्यां नमः । ॐ सर्वतोमुखाय नमः अनामिकाभ्यां नमः । ॐ विकटास्याय नमः कनिष्ठिकाभ्यां
    नमः । ॐ वीराय नमः करतलकरपृष्ठाभ्यां नमः । एवं हृदयादिन्यासः । दिग्बन्धः ॐ ऐन्द्रीं दिशं सुदर्शनेन
    बध्नामि नमश्चक्राय स्वाहा । ॐ आग्नेयीं दिशं सुदर्शनेन बध्नामि नमश्चक्राय स्वाहा । ॐ याम्यां दिशं सुदर्शनेन
    बध्नामि नमश्चक्राय स्वाहा । ॐ नैरृतिं दिशं सुदर्शनेन बध्नामि नमश्चक्राय स्वाहा । ॐ वारुणीं दिशं सुदर्शनेन
    बध्नामि नमश्चक्राय स्वाहा । ॐ वायवीं दिशं सुदर्शनेन बध्नामि नमश्चक्राय स्वाहा । ॐ कौबेरीं दिशं सुदर्शनेन
    बध्नामि नमश्चक्राय स्वाहा । ॐ ईशानीं दिशं सुदर्शनेन बध्नामि नमश्चक्राय स्वाहा । ॐ ऊर्ध्वां दिशं सुदर्शनेन
    बध्नामि नमश्चक्राय स्वाहा । ॐ अधस्ताद्दिशं दिशं सुदर्शनेन बध्नामि नमश्चक्राय स्वाहा । ॐ अन्तरिक्षां
    दिशं सुदर्शनेन बध्नामि नमश्चक्राय स्वाहा । अथ ध्यानम् । सत्यज्ञानसुखस्वरूपममलं क्षीराब्धिमध्ये स्थितं
    योगारूढमतिप्रसन्नवदनं भूषासहस्रोज्वलम् । त्र्यक्षं चक्रपिनाकसाभयकरान् बिभ्राणमर्कच्छविं छत्रीभूतफणीन्द्रमिन्दुधवलं
    लक्ष्मीनृसिंहं भजे ॥ ॥ उपास्महे नृसिंहाख्यं ब्रह्म वेदान्तगोचरम् । भूयोलालितसंसारच्छेदहेतुं जगद्गुरुम्
    ॥ ॥ अथ स्तोत्रम् । ब्रह्मोवाच । ॐ ह्रीं श्रीं ऐं क्ष्रौम् ॥ ॐ नमो नारसिंहाय वज्रदंष्ट्राय वज्रिणे
    । वज्रदेहाय वज्राय नमो वज्रनखाय च ॥ ॥ वासुदेवाय वन्द्याय वरदाय वरात्मने । वरदाभयहस्ताय वराय वररूपिणे
    ॥ ॥ वरेण्याय वरिष्ठाय श्रीवराय नमो नमः । प्रह्लादवरदायैव प्रत्यक्षवरदाय च ॥ ॥ परात्परपरेशाय पवित्राय
    पिनाकिने । पावनाय प्रसन्नाय पाशिने पापहारिणे ॥ ॥ पुरुष्टुताय पुण्याय पुरुहूताय ते नमः । तत्पुरुषाय
    तथ्याय पुराणपुरुषाय च ॥ ॥ पुरोधसे पूर्वजाय पुष्कराक्षाय ते नमः । पुष्पहासाय हासाय महाहासाय शार्ङ्गिणे
    ॥ ॥ सिंहाय सिंहराजाय जगद्वश्याय ते नमः । अट्टहासाय रोषाय जलवासाय ते नमः ॥ ॥ भूतावासाय भासाय श्रीनिवासाय
    खड्गिने । खड्गजिह्वाय सिंहाय खड्गवासाय ते नमः ॥ ॥ नमो मूलाधिवासाय धर्मवासाय धन्विने । धनञ्जयाय धन्याय
    नमो मृत्युञ्जयाय च ॥ ॥ शुभञ्जयाय सूत्राय नमः शत्रुञ्जयाय च । निरञ्जनाय नीराय निर्गुणाय गुणाय च ॥ ॥
    निष्प्रपञ्चाय निर्वाणप्रदाय निबिडाय च । निरालम्बाय नीलाय निष्कलाय कलाय च ॥ ॥ निमेषाय निबन्धाय निमेषगमनाय
    च । निर्द्वन्द्वाय निराशाय निश्चयाय निराय च ॥ ॥ निर्मलाय निबन्धाय निर्मोहाय निराकृते । नमो नित्याय
    सत्याय सत्कर्मनिरताय च ॥ ॥ सत्यध्वजाय मुञ्जाय मुञ्जकेशाय केशिने । हरीशाय च शेषाय गुडाकेशाय वै नमः
    ॥ ॥ सुकेशायोर्ध्वकेशाय केशिसंहारकाय च । जलेशाय स्थलेशाय पद्मेशायोग्ररूपिणे ॥ ॥ कुशेशयाय कूलाय केशवाय
    नमो नमः । सूक्तिकर्णाय सूक्ताय रक्तजिह्वाय रागिणे ॥ ॥ दीप्तरूपाय दीप्ताय प्रदीप्ताय प्रलोभिने । प्रच्छिन्नाय
    प्रबोधाय प्रभवे विभवे नमः ॥ ॥ प्रभञ्जनाय पान्थाय प्रमायाप्रमिताय च । प्रकाशाय प्रतापाय प्रज्वलायोज्ज्वलाय
    च ॥ ॥ ज्वालामालास्वरूपाय ज्वलज्जिह्वाय ज्वालिने । महोज्ज्वलाय कालाय कालमूर्तिधराय च ॥ ॥ कालान्तकाय
    कल्पाय कलनाय कृते नमः । कालचक्राय शक्राय वषट्चक्राय चक्रिणे ॥ ॥ अक्रूराय कृतान्ताय विक्रमाय क्रमाय
    च । कृत्तिने कृत्तिवासाय कृतघ्नाय कृतात्मने ॥ ॥ सङ्क्रमाय च क्रुद्धाय क्रान्तलोकत्रयाय च । अरूपाय
    स्वरूपाय हरये परमात्मने ॥ ॥ अजयायादिदेवाय अक्षयाय क्षयाय च । अघोराय सुघोराय घोरघोरतराय च ॥ ॥ नमोऽस्त्वघोरवीर्याय
    लसद्घोराय ते नमः । घोराध्यक्षाय दक्षाय दक्षिणाऽऽर्याय शम्भवे ॥ ॥ अमोघाय गुणौघाय अनघायाऽघहारिणे । मेघनादाय
    नादाय तुभ्यं मेघात्मने नमः ॥ ॥ मेघवाहनरूपाय मेघश्यामाय मालिने । व्यालयज्ञोपवीताय व्याघ्रदेहाय वै नमः
    ॥ ॥ व्याघ्रपादाय च व्याघ्रकर्मिणे व्यापकाय च । विकटास्याय वीराय विष्टरश्रवसे नमः ॥ ॥ विकीर्णनखदंष्ट्राय
    नखदंष्ट्रायुधाय च । विष्वक्सेनाय सेनाय विह्वलाय बलाय च ॥ ॥ विरूपाक्षाय वीराय विशेषाक्षाय साक्षिणे
    । वीतशोकाय विस्तीर्णवदनाय नमो नमः ॥ ॥ विधानाय विधेयाय विजयाय जयाय च । विबुधाय विभावाय नमो विश्वम्भराय
    च ॥ ॥ वीतरागाय विप्राय विटङ्कनयनाय च । विपुलाय विनीताय विश्वयोने नमो नमः ॥ ॥ विडम्बनाय वित्ताय विश्रुताय
    वियोनये । विह्वलाय विवादाय नमो व्याहृतये नमः ॥ ॥ विलासाय विकल्पाय महाकल्पाय ते नमः । बहुकल्पाय कल्पाय
    कल्पातीताय शिल्पिने ॥ ॥ कल्पनाय स्वरूपाय फणितल्पाय वै नमः । तटित्प्रभाय तार्क्ष्याय तरुणाय तरस्विने
    ॥ ॥ तपनाय तरक्षाय तापत्रयहराय च । तारकाय तमोघ्नाय तत्त्वाय च तपस्विने ॥ ॥ तक्षकाय तनुत्राय तटिने तरलाय
    च । शतरूपाय शान्ताय शतधाराय ते नमः ॥ ॥ शतपत्रायताक्षाय स्थितये शतमूर्तये । शतक्रतुस्वरूपाय शाश्वताय
    शतात्मने ॥ ॥ नमः सहस्रशिरसे सहस्रवदनाय च । सहस्राक्षाय देवाय दिशश्रोत्राय ते नमः ॥ ॥ नमः सहस्रजिह्वाय
    महाजिह्वाय ते नमः । सहस्रनामधेयाय सहस्राक्षिधराय च ॥ ॥ सहस्रबाहवे तुभ्यं सहस्रचरणाय च । सहस्रार्कप्रकाशाय
    सहस्रायुधधारिणे ॥ ॥ नमः स्थूलाय सूक्ष्माय सुसूक्ष्माय नमो नमः । सुक्षुण्णाय सुभिक्षाय सुराध्यक्षाय
    शौरिणे ॥ ॥ धर्माध्यक्षाय धर्माय लोकाध्यक्षाय वै नमः । प्रजाध्यक्षाय शिक्षाय विपक्षक्षयमूर्तये ॥ ॥
    कालाध्यक्षाय तीक्ष्णाय मूलाध्यक्षाय ते नमः । अधोक्षजाय मित्राय सुमित्रवरुणाय च ॥ ॥ शत्रुघ्नाय अविघ्नाय
    विघ्नकोटिहराय च । रक्षोघ्नाय तमोघ्नाय भूतघ्नाय नमो नमः ॥ ॥ भूतपालाय भूताय भूतावासाय भूतिने । भूतवेतालघाताय
    भूताधिपतये नमः ॥ ॥ भूतग्रहविनाशाय भूतसंयमते नमः । महाभूताय भृगवे सर्वभूतात्मने नमः ॥ ॥ सर्वारिष्टविनाशाय
    सर्वसम्पत्कराय च । सर्वाधाराय शर्वाय सर्वार्तिहरये नमः ॥ ॥ सर्वदुःखप्रशान्ताय सर्वसौभाग्यदायिने ।
    सर्वज्ञायाप्यनन्ताय सर्वशक्तिधराय च ॥ ॥ सर्वैश्वर्यप्रदात्रे च सर्वकार्यविधायिने । सर्वज्वरविनाशाय
    सर्वरोगापहारिणे ॥ ॥ सर्वाभिचारहन्त्रे च सर्वैश्वर्यविधायिने । पिङ्गाक्षायैकशृङ्गाय द्विशृङ्गाय मरीचये
    ॥ ॥ बहुशृङ्गाय लिङ्गाय महाशृङ्गाय ते नमः । माङ्गल्याय मनोज्ञाय मन्तव्याय महात्मने ॥ ॥ महादेवाय देवाय
    मातुलिङ्गधराय च । महामायाप्रसूताय प्रस्तुताय च मायिने ॥ ॥ अनन्तानन्तरूपाय मायिने जलशायिने । महोदराय
    मन्दाय मददाय मदाय च ॥ ॥ मधुकैटभहन्त्रे च माधवाय मुरारये । महावीर्याय धैर्याय चित्रवीर्याय ते नमः ॥
    ॥ चित्रकूर्माय चित्राय नमस्ते चित्रभानवे । मायातीताय मायाय महावीराय ते नमः ॥ ॥ महातेजाय बीजाय तेजोधाम्ने
    च बीजिने । तेजोमयनृसिंहाय नमस्ते चित्रभानवे ॥ ॥ महादंष्ट्राय तुष्टाय नमः पुष्टिकराय च । शिपिविष्टाय
    हृष्टाय पुष्टाय परमेष्ठिने ॥ ॥ विशिष्टाय च शिष्टाय गरिष्ठायेष्टदायिने । नमो ज्येष्ठाय श्रेष्ठाय तुष्टायामिततेजसे
    ॥ ॥ अष्टाङ्गन्यस्तरूपाय सर्वदुष्टान्तकाय च । वैकुण्ठाय विकुण्ठाय केशिकण्ठाय ते नमः ॥ ॥ कण्ठीरवाय लुण्ठाय
    निश्शठाय हठाय च । सत्वोद्रिक्ताय रुद्राय ऋग्यजुस्सामगाय च ॥ ॥ ऋतुध्वजाय वज्राय मन्त्रराजाय मन्त्रिणे
    । त्रिनेत्राय त्रिवर्गाय त्रिधाम्ने च त्रिशूलिने ॥ ॥ त्रिकालज्ञानरूपाय त्रिदेहाय त्रिधात्मने । नमस्त्रिमूर्तिविद्याय
    त्रितत्त्वज्ञानिने नमः ॥ ॥ अक्षोभ्यायानिरुद्धाय अप्रमेयाय भानवे । अमृताय अनन्ताय अमितायामितौजसे ॥
    ॥ अपमृत्युविनाशाय अपस्मारविघातिने । अन्नदायान्नरूपाय अन्नायान्नभुजे नमः ॥ ॥ नाद्याय निरवद्याय विद्यायाद्भुतकर्मणे
    । सद्योजाताय सङ्घाय वैद्युताय नमो नमः ॥ ॥ अध्वातीताय सत्त्वाय वागतीताय वाग्मिने । वागीश्वराय गोपाय
    गोहिताय गवां पते ॥ ॥ गन्धर्वाय गभीराय गर्जितायोर्जिताय च । पर्जन्याय प्रबुद्धाय प्रधानपुरुषाय च ॥
    ॥ पद्माभाय सुनाभाय पद्मनाभाय मानिने । पद्मनेत्राय पद्माय पद्मायाः पतये नमः ॥ ॥ पद्मोदराय पूताय पद्मकल्पोद्भवाय
    च । नमो हृत्पद्मवासाय भूपद्मोद्धरणाय च ॥ ॥ शब्दब्रह्मस्वरूपाय ब्रह्मरूपधराय च । ब्रह्मणे ब्रह्मरूपाय
    पद्मनेत्राय ते नमः ॥ ॥ ब्रह्मदाय ब्राह्मणाय ब्रह्मब्रह्मात्मने नमः । सुब्रह्मण्याय देवाय ब्रह्मण्याय
    त्रिवेदिने ॥ ॥ परब्रह्मस्वरूपाय पञ्चब्रह्मात्मने नमः । नमस्ते ब्रह्मशिरसे तथाऽश्वशिरसे नमः ॥ ॥ अथर्वशिरसे
    नित्यमशनिप्रमिताय च । नमस्ते तीक्ष्णदंष्ट्राय लोलाय ललिताय च ॥ ॥ लावण्याय लवित्राय नमस्ते भासकाय च
    । लक्षणज्ञाय लक्षाय लक्षणाय नमो नमः ॥ ॥ लसद्दीप्ताय लिप्ताय विष्णवे प्रभविष्णवे । वृष्णिमूलाय कृष्णाय
    श्रीमहाविष्णवे नमः ॥ ॥ पश्यामि त्वां महासिंहं हारिणं वनमालिनम् । किरीटिनं कुण्डलिनं सर्वाङ्गं सर्वतोमुखम्
    ॥ ॥ सर्वतः पाणिपादोरः सर्वतोऽक्षिशिरोमुखम् । सर्वेश्वरं सदातुष्टं समर्थं समरप्रियम् ॥ ॥ बहुयोजनविस्तीर्णं
    बहुयोजनमायतम् । बहुयोजनहस्ताङ्घ्रिं बहुयोजननासिकम् ॥ ॥ महारूपं महावक्त्रं महादंष्ट्रं महाभुजम् । महानादं
    महारौद्रं महाकायं महाबलम् ॥ ॥ आनाभेर्ब्रह्मणो रूपमागलाद्वैष्णवं तथा । आशीर्षाद्रुद्रमीशानं तदग्रे
    सर्वतः शिवम् ॥ ॥ नमोऽस्तु नारायणनारसिंह नमोऽस्तु नारायणवीरसिंह । नमोऽस्तु नारायणक्रूरसिंह नमोऽस्तु
    नारायणदिव्यसिंह ॥ ॥ नमोऽस्तु नारायणव्याघ्रसिंह नमोऽस्तु नारायणपुच्छसिंह । नमोऽस्तु नारायणपूर्णसिंह
    नमोऽस्तु नारायणरौद्रसिंह ॥ ॥ नमो नमो भीषणभद्रसिंह नमो नमो विह्वलनेत्रसिंह । नमो नमो बृंहितभूतसिंह
    नमो नमो निर्मलचित्रसिंह ॥ ॥ नमो नमो निर्जितकालसिंह नमो नमः कल्पितकल्पसिंह । नमो नमो कामदकामसिंह नमो
    नमस्ते भुवनैकसिंह ॥ ॥ द्यावापृथिव्योरिदमन्तरं हि व्याप्तं त्वयैकेन दिशश्च सर्वाः । दृष्ट्वाद्भुतं
    रूपमुग्रं तवेदं लोकत्रयं प्रव्यथितं महात्मन् ॥ ॥ अमी हित्वा सुरसङ्घा विशन्ति केचिद्भीताः प्राञ्जलयो
    गृणन्ति । स्वस्तीत्युक्त्वा मुनयः सिद्धसङ्घाः स्तुवन्ति त्वां स्तुतिभिः पुष्कलाभिः ॥ ॥ रुद्रादित्यावसवो
    ये च साध्या विश्वेदेवा मरुतश्चोष्मपाश्च । गन्धर्वयक्षासुरसिद्धसङ्घा वीक्षन्ति त्वां विस्मिताश्चैव
    सर्वे ॥ ॥ लेलिह्यसे ग्रसमानः समन्ता ल्लोकान् समग्रान्वदनैर्ज्वलद्भिः । तेजोभिरापूर्य जगत्समग्रं भासस्तवोग्राः
    प्रतपन्ति विष्णो ॥ ॥ भविष्णुस्त्वं सहिष्णुस्त्वं भ्राजिष्णुर्जिष्णुरेव च । पृथिवीमन्तरिक्षं त्वं पर्वतारण्यमेव
    च ॥ ॥ कलाकाष्ठाविलिप्तस्त्वं मुहूर्तप्रहरादिकम् । अहोरात्रं त्रिसन्ध्या च पक्षमासर्तुवत्सराः ॥ ॥ युगादिर्युगभेदस्त्वं
    संयुगो युगसन्धयः । नित्यं नैमित्तिकं दैनं महाप्रलयमेव च ॥ ॥ करणं कारणं कर्ता भर्ता हर्ता त्वमीश्वरः
    । सत्कर्ता सत्कृतिर्गोप्ता सच्चिदानन्दविग्रहः ॥ ॥ प्राणस्त्वं प्राणिनां प्रत्यगात्मा त्वं सर्वदेहिनाम्
    । सुज्योतिस्त्वं परञ्ज्योतिरात्मज्योतिः सनातनः ॥ ॥ ज्योतिर्लोकस्वरूपस्त्वं ज्ञो ज्योतिर्ज्योतिषां
    पतिः । स्वाहाकारः स्वधाकारो वषट्कारः कृपाकरः ॥ ॥ हन्तकारो निराकारो वेगाकारश्च शङ्करः । अकारादिहकारान्त
    ओङ्कारो लोककारकः ॥ ॥ एकात्मा त्वमनेकात्मा चतुरात्मा चतुर्भुजः । चतुर्मूर्तिश्चतुर्दंष्ट्रश्चतुर्वेदमयोत्तमः
    ॥ ॥ लोकप्रियो लोकगुरुर्लोकेशो लोकनायकः । लोकसाक्षी लोकपतिर्लोकात्मा लोकलोचनः ॥ ॥ लोकाधारो बृहल्लोको
    लोकालोकमयो विभुः । लोककर्ता विश्वकर्ता कृतावर्तः कृतागमः ॥ ॥ अनादिस्त्वमनन्तस्त्वमभूतो भूतविग्रहः
    । स्तुतिः स्तुत्यः स्तवप्रीतः स्तोता नेता नियामकः ॥ ॥ त्वं गतिस्त्वं मतिर्मह्यं पिता माता गुरुः सखा
    । सुहृदश्चात्मरूपस्त्वं त्वां विना नास्ति मे गतिः ॥ ॥ नमस्ते मन्त्ररूपाय अस्त्ररूपाय ते नमः । बहुरूपाय
    रूपाय पञ्चरूपधराय च ॥ ॥ भद्ररूपाय रूढाय योगरूपाय योगिने । समरूपाय योगाय योगपीठस्थिताय च ॥ ॥ योगगम्याय
    सौम्याय ध्यानगम्याय ध्यायिने । ध्येयगम्याय धाम्ने च धामाधिपतये नमः ॥ ॥ धराधराय धर्माय धारणाभिरताय
    च । नमो धात्रे च सन्धात्रे विधात्रे च धराय च ॥ ॥ दामोदराय दान्ताय दानवान्तकराय च । नमः संसारवैद्याय
    भेषजाय नमो नमः ॥ ॥ सीरध्वजाय शीताय वातायाप्रमिताय च । सारस्वताय संसारनाशनायाक्षमालिने ॥ ॥ असिचर्मधरायैव
    षट्कर्मनिरताय च । विकर्माय सुकर्माय परकर्मविधायिने ॥ ॥ सुशर्मणे मन्मथाय नमो वर्माय वर्मिणे । करिचर्मवसानाय
    करालवदनाय च ॥ ॥ कवये पद्मगर्भाय भूतगर्भ घृणानिधे । ब्रह्मगर्भाय गर्भाय बृहद्गर्भाय धूर्जटे ॥ ॥ नमस्ते
    विश्वगर्भाय श्रीगर्भाय जितारये । नमो हिरण्यगर्भाय हिरण्यकवचाय च ॥ ॥ हिरण्यवर्णदेहाय हिरण्याक्षविनाशिने
    । हिरण्यकशिपोर्हन्त्रे हिरण्यनयनाय च ॥ ॥ हिरण्यरेतसे तुभ्यं हिरण्यवदनाय च । नमो हिरण्यशृङ्गाय निःशृङ्गाय
    च शृङ्गिणे ॥ ॥ भैरवाय सुकेशाय भीषणायान्त्रमालिने । चण्डाय रुण्डमालाय नमो दण्डधराय च ॥ ॥ अखण्डतत्त्वरूपाय
    कमण्डलुधराय च । नमस्ते खण्डसिंहाय सत्यसिंहाय ते नमः ॥ ॥ नमस्ते श्वेतसिंहाय पीतसिंहाय ते नमः । नीलसिंहाय
    नीलाय रक्तसिंहाय ते नमः ॥ ॥ नमो हारिद्रसिंहाय धूम्रसिंहाय ते नमः । मूलसिंहाय मूलाय बृहत्सिंहाय ते
    नमः ॥ ॥ पातालस्थितसिंहाय नमः पर्वतवासिने । नमो जलस्थसिंहाय अन्तरिक्षस्थिताय च ॥ ॥ कालाग्निरुद्रसिंहाय
    चण्डसिंहाय ते नमः । अनन्तसिंहसिंहाय अनन्तगतये नमः ॥ ॥ नमो विचित्रसिंहाय बहुसिंहस्वरूपिणे । अभयङ्करसिंहाय
    नरसिंहाय ते नमः ॥ ॥ नमोऽस्तु सिंहराजाय नारसिंहाय ते नमः । सप्ताब्धिमेखलायैव सत्यसत्यस्वरूपिणे ॥ ॥
    सप्तलोकान्तरस्थाय सप्तस्वरमयाय च । सप्तार्चीरूपदंष्ट्राय सप्ताश्वरथरूपिणे ॥ ॥ सप्तवायुस्वरूपाय सप्तच्छन्दोमयाय
    च । स्वच्छाय स्वच्छरूपाय स्वच्छन्दाय च ते नमः ॥ ॥ श्रीवत्साय सुवेषाय श्रुतये श्रुतिमूर्तये । शुचिश्रवाय
    शूराय सुप्रभाय सुधन्विने ॥ ॥ शुभ्राय सुरनाथाय सुप्रभाय शुभाय च । सुदर्शनाय सूक्ष्माय निरुक्ताय नमो
    नमः ॥ ॥ सुप्रभाय स्वभावाय भवाय विभवाय च । सुशाखाय विशाखाय सुमुखाय मुखाय च ॥ ॥ सुनखाय सुदंष्ट्राय सुरथाय
    सुधाय च । साङ्ख्याय सुरमुख्याय प्रख्याताय प्रभाय च ॥ ॥ नमः खट्वाङ्गहस्ताय खेटमुद्गरपाणये । खगेन्द्राय
    मृगेन्द्राय नागेन्द्राय दृढाय च ॥ ॥ नागकेयूरहाराय नागेन्द्रायाघमर्दिने । नदीवासाय नग्नाय नानारूपधराय
    च ॥ ॥ नागेश्वराय नागाय नमिताय नराय च । नागान्तकरथायैव नरनारायणाय च ॥ ॥ नमो मत्स्यस्वरूपाय कच्छपाय
    नमो नमः । नमो यज्ञवराहाय नरसिंहाय ते नमः ॥ ॥ विक्रमाक्रान्तलोकाय वामनाय महौजसे । नमो भार्गवरामाय रावणान्तकराय
    च ॥ ॥ नमस्ते बलरामाय कंसप्रध्वंसकारिणे । बुद्धाय बुद्धरूपाय तीक्ष्णरूपाय कल्किने ॥ ॥ आत्रेयायाग्निनेत्राय
    कपिलाय द्विजाय च । क्षेत्राय पशुपालाय पशुवक्त्राय ते नमः ॥ ॥ गृहस्थाय वनस्थाय यतये ब्रह्मचारिणे ।
    स्वर्गापवर्गदात्रे च तद्भोक्त्रे च मुमुक्षवे ॥ ॥ शालग्रामनिवासाय क्षीराब्धिशयनाय च । श्रीशैलाद्रिनिवासाय
    शिलावासाय ते नमः ॥ ॥ योगिहृत्पद्मवासाय महाहासाय ते नमः । गुहावासाय गुह्याय गुप्ताय गुरवे नमः ॥ ॥ नमो
    मूलाधिवासाय नीलवस्त्रधराय च । पीतवस्त्राय शस्त्राय रक्तवस्त्रधराय च ॥ ॥ रक्तमालाविभूषाय रक्तगन्धानुलेपिने
    । धुरन्धराय धूर्ताय दुर्धराय धराय च ॥ ॥ दुर्मदाय दुरन्ताय दुर्धराय नमो नमः । दुर्निरीक्ष्याय निष्ठाय
    दुर्दर्शाय द्रुमाय च ॥ ॥ दुर्भेदाय दुराशाय दुर्लभाय नमो नमः । दृप्ताय दृप्तवक्त्राय अदृप्तनयनाय च
    ॥ ॥ उन्मत्ताय प्रमत्ताय नमो दैत्यारये नमः । रसज्ञाय रसेशाय आरक्तरसनाय च ॥ ॥ पथ्याय परितोषाय रथ्याय
    रसिकाय च । ऊर्ध्वकेशोर्ध्वरूपाय नमस्ते चोर्ध्वरेतसे ॥ ॥ ऊर्ध्वसिंहाय सिंहाय नमस्ते चोर्ध्वबाहवे ।
    परप्रध्वंसकायैव शङ्खचक्रधराय च ॥ ॥ गदापद्मधरायैव पञ्चबाणधराय च । कामेश्वराय कामाय कामपालाय कामिने
    ॥ ॥ नमः कामविहाराय कामरूपधराय च । सोमसूर्याग्निनेत्राय सोमपाय नमो नमः ॥ ॥ नमः सोमाय वामाय वामदेवाय
    ते नमः । सामस्वनाय सौम्याय भक्तिगम्याय वै नमः ॥ ॥ कूष्माण्डगणनाथाय सर्वश्रेयस्कराय च । भीष्माय भीषदायैव
    भीमविक्रमणाय च ॥ ॥ मृगग्रीवाय जीवाय जितायाजितकारिणे । जटिने जामदग्न्याय नमस्ते जातवेदसे ॥ ॥ जपाकुसुमवर्णाय
    जप्याय जपिताय च । जरायुजायाण्डजाय स्वेदजायोद्भिजाय च ॥ ॥ जनार्दनाय रामाय जाह्नवीजनकाय च । जराजन्मादिदूराय
    प्रद्युम्नाय प्रमोदिने ॥ ॥ जिह्वारौद्राय रुद्राय वीरभद्राय ते नमः । चिद्रूपाय समुद्राय कद्रुद्राय
    प्रचेतसे ॥ ॥ इन्द्रियायेन्द्रियज्ञाय नमोऽस्त्विन्द्रानुजाय च । अतीन्द्रियाय साराय इन्दिरापतये नमः
    ॥ ॥ ईशानाय च ईड्याय ईशिताय इनाय च । व्योमात्मने च व्योम्ने च नमस्ते व्योमकेशिने ॥ ॥ व्योमाधाराय च
    व्योमवक्त्रायासुरघातिने । नमस्ते व्योमदंष्ट्राय व्योमवासाय ते नमः ॥ ॥ सुकुमाराय रामाय शुभाचाराय वै
    नमः । विश्वाय विश्वरूपाय नमो विश्वात्मकाय च ॥ ॥ ज्ञानात्मकाय ज्ञानाय विश्वेशाय परात्मने । एकात्मने
    नमस्तुभ्यं नमस्ते द्वादशात्मने ॥ ॥ चतुर्विंशतिरूपाय पञ्चविंशतिमूर्तये । षड्विंशकात्मने नित्यं सप्तविंशतिकात्मने
    ॥ ॥ धर्मार्थकाममोक्षाय विरक्ताय नमो नमः । भावशुद्धाय सिद्धाय साध्याय शरभाय च ॥ ॥ प्रबोधाय सुबोधाय
    नमो बुद्धिप्रियाय च । स्निग्धाय च विदग्धाय मुग्धाय मुनये नमः ॥ ॥ प्रियंवदाय श्रव्याय स्रुक्स्रुवाय
    श्रिताय च । गृहेशाय महेशाय ब्रह्मेशाय नमो नमः ॥ ॥ श्रीधराय सुतीर्थाय हयग्रीवाय ते नमः । उग्राय उग्रवेगाय
    उग्रकर्मरताय च ॥ ॥ उग्रनेत्राय व्यग्राय समग्रगुणशालिने । बालग्रहविनाशाय पिशाचग्रहघातिने ॥ ॥ दुष्टग्रहनिहन्त्रे
    च निग्रहानुग्रहाय च । वृषध्वजाय वृष्ण्याय वृषाय वृषभाय च ॥ ॥ उग्रश्रवाय शान्ताय नमः श्रुतिधराय च ।
    नमस्ते देवदेवेश नमस्ते मधुसूदन ॥ ॥ नमस्ते पुण्डरीकाक्ष नमस्ते दुरितक्षय । नमस्ते करुणासिन्धो नमस्ते
    समितिञ्जय ॥ ॥ नमस्ते नरसिंहाय नमस्ते गरुडध्वज । यज्ञनेत्र नमस्तेऽस्तु कालध्वज जयध्वज ॥ ॥ अग्निनेत्र
    नमस्तेऽस्तु नमस्ते ह्यमरप्रिय । महानेत्र नमस्तेऽस्तु नमस्ते भक्तवत्सल ॥ ॥ धर्मनेत्र नमस्तेऽस्तु नमस्ते
    करुणाकर । पुण्यनेत्र नमस्तेऽस्तु नमस्तेऽभीष्टदायक ॥ ॥ नमो नमस्ते जयसिंहरूप नमो नमस्ते नरसिंहरूप ।
    नमो नमस्ते रणसिंहरूप नमो नमस्ते नरसिंहरूप ॥ ॥ उद्धृत्य गर्वितं दैत्यं निहत्याजौ सुरद्विषम् । देवकार्यं
    महत्कृत्वा गर्जसे स्वात्मतेजसा ॥ ॥ अतिरौद्रमिदं रूपं दुस्सहं दुरतिक्रमम् । दृष्ट्वा तु शङ्किताः सर्वा
    देवतास्त्वामुपागताः ॥ ॥ एतान्पश्य महेशानं ब्रह्माणं मां शचीपतिम् । दिक्पालान् द्वादशादित्यान् रुद्रानुरगराक्षसान्
    ॥ ॥ सर्वान् ऋषिगणान् सप्तमातृर्गौरीं सरस्वतीम् । लक्ष्मीं नदीश्च तीर्थानि रतिं भूतगणान्यपि ॥ ॥ प्रसीद
    त्वं महासिंह उग्रभावमिमं त्यज । प्रकृतिस्थो भव त्वं हि शान्तिभावं च धारय ॥ ॥ इत्युक्त्वा दण्डवद्भूमौ
    पपात स पितामहः । प्रसीद त्वं प्रसीद त्वं प्रसीदेति पुनः पुनः ॥ ॥ मार्कण्डेय उवाच । दृष्ट्वा तु देवताः
    सर्वाः श्रुत्वा तां ब्रह्मणो गिरम् । स्तोत्रेणापि च संहृष्टः सौम्यभावमधारयत् ॥ ॥ अब्रवीन्नारसिंहस्तु
    वीक्ष्य सर्वान् सुरोत्तमान् । सन्त्रस्तान् भयसंविग्नान् शरणं समुपागतान् ॥ ॥ श्रीनृसिंह उवाच । भो भो
    देववराः सर्वे पितामहपुरोगमाः । शृणुध्वं मम वाक्यं च भवन्तु विगतज्वराः ॥ ॥ यद्धितं भवतां नूनं तत्करिष्यामि
    साम्प्रतम् । एवं नामसहस्रं मे त्रिसन्ध्यं यः पठेत् शुचिः ॥ ॥ शृणोति वा श्रावयति पूजान्ते भक्तिसंयुतः
    । सर्वान् कामानवाप्नोति जीवेच्च शरदां शतम् ॥ ॥ यो नामभिर्नृसिंहाद्यैरर्चयेत्क्रमशो मम । सर्वतीर्थेषु
    यत्पुण्यं सर्वतीर्थेषु यत्फलम् ॥ ॥ सर्वपूजासु यत्प्रोक्तं तत्सर्वं लभते भृशम् । जातिस्मरत्वं लभते
    ब्रह्मज्ञानं सनातनम् ॥ ॥ सर्वपापविनिर्मुक्तः तद्विष्णोः परमं पदम् । मन्नामकवचं बध्वा विचरेद्विगतज्वरः
    ॥ ॥ भूतभेतालकूष्माण्ड पिशाचब्रह्मराक्षसाः । शाकिनीडाकिनीज्येष्ठा नीली बालग्रहादिकाः ॥ ॥ दुष्टग्रहाश्च
    नश्यन्ति यक्षराक्षसपन्नगाः । ये च सन्ध्याग्रहाः सर्वे चाण्डालग्रहसञ्ज्ञिकाः ॥ ॥ निशाचरग्रहाः सर्वे
    प्रणश्यन्ति च दूरतः । कुक्षिरोगं च हृद्रोगं शूलापस्मारमेव च ॥ ॥ ऐकाहिकं द्व्याहिकं च चातुर्थिकमथ ज्वरम्
    । आधयो व्याधयः सर्वे रोगा रोगाधिदेवताः ॥ ॥ शीघ्रं नश्यन्ति ते सर्वे नृसिंहस्मरणात् सुराः । राजानो
    दासतां यान्ति शत्रवो यान्ति मित्रताम् ॥ ॥ जलानि स्थलतां यान्ति वह्नयो यान्ति शीतताम् । विषाण्यप्यमृता
    यान्ति नृसिंहस्मरणात्सुराः ॥ ॥ राज्यकामो लभेद्राज्यं धनकामो लभेद्धनम् । विद्याकामो लभेद्विद्यां बद्धो
    मुच्येत बन्धनात् ॥ ॥ व्यालव्याघ्रभयं नास्ति चोरसर्पादिकं तथा । अनुकूला भवेद्भार्या लोकैश्च प्रतिपूज्यते
    ॥ ॥ सुपुत्रं धनधान्यं च भवन्ति विगतज्वराः । एतत्सर्वं समाप्नोति नृसिंहस्य प्रसादतः ॥ ॥ जलसन्तरणे चैव
    पर्वतारण्यमेव च । वनेऽपि विचिरन्मर्त्यो दुर्गमे विषमे पथि ॥ ॥ बिलप्रवेशने चापि नारसिंहं न विस्मरेत्
    । ब्रह्मघ्नश्च पशुघ्नश्च भ्रूणहा गुरुतल्पगः ॥ ॥ मुच्यते सर्वपापेभ्यः कृतघ्नः स्त्रीविघातकः । वेदानां
    दूषकश्चापि मातापितृविनिन्दकः ॥ ॥ असत्यस्तु तेथा यज्ञनिन्दको लोकनिन्दकः । स्मृत्वा सकृन्नृसिंहं तु
    मुच्यते सर्वकिल्बिषैः ॥ ॥ बहुनात्र किमुक्तेन स्मृत्वा मां शुद्धमानसः । यत्र यत्र चरेन्मर्त्यो नृसिंहस्तत्र
    रक्षति ॥ ॥ गच्छन् तिष्ठन् स्वपन् भुञ्जन् जाग्रन्नपि हसन्नपि । नृसिंहेति नृसिंहेति नृसिंहेति सदा स्मरन्
    ॥ ॥ पुमान्न लिप्यते पापैर्भुक्तिं मुक्तिं च विन्दति । नारी सुभगतामेति सौभाग्यं च स्वरूपताम् ॥ ॥ भर्तुः
    प्रियत्वं लभते न वैधव्यं च विन्दति । न सपत्नीं च जन्मान्ते सम्यक् ज्ञानी भवेद्विजः ॥ ॥ भूमिप्रदक्षिणान्मर्त्यो
    यत्फलं लभते चिरात् । तत्फलं लभते नारसिंहमूर्तिप्रदक्षिणात् ॥ ॥ मार्कण्डेय उवाच । इत्युक्त्वा देवदेवेशो
    लक्ष्मीमालिङ्ग्य लीलया । प्रह्लादस्याभिषेकं तु ब्रह्मणे चोपदिष्टवान् ॥ ॥ श्रीशैलस्य प्रसादे तु लोकानां
    च हिताय वै । स्वरूपं स्थापयामास प्रकृतिस्थोऽभवत्तदा ॥ ॥ ब्रह्मापि दैत्यराजानं प्रह्लादमभ्यषेचयत् ।
    दैवतैः सह सुप्रीतो ह्यात्मलोकं ययौ स्वयम् ॥ ॥ हिरण्यकशिपोर्भीत्या प्रपलाय्य शचीपतिः । स्वर्गराज्यपरिभ्रष्टो
    युगानामेकविंशतिम् ॥ ॥ नृसिंहेन हते दैत्ये स्वर्गलोकमवाप सः । दिक्पालाश्च सुसम्प्राप्तः स्वस्वस्थानमनुत्तमम्
    ॥ ॥ धर्मे मतिः समस्तानां प्रजानामभवत्तदा । एवं नामसहस्रं मे ब्रह्मणा निर्मितं पुरा ॥ ॥ पुत्रानध्यापयामास
    सनकादीन्महामतिः । ऊचुस्ते च ततः सर्वलोकानां हितकाम्यया ॥ ॥ देवता ऋषयः सिद्धा यक्षविद्याधरोरगाः । गन्धर्वाश्च
    मनुष्याश्च इहामुत्रफलैषिणः ॥ ॥ यस्य स्तोत्रस्य पाठाद्धि विशुद्धमनसोऽभवन् । सनत्कुमारः सम्प्राप्तो
    भारद्वाजो महामतिः ॥ ॥ तस्मादाङ्गिरसः प्राप्तस्तस्मात्प्राप्तो महाक्रतुः । जग्राह भार्गवस्तस्मादग्निमित्राय
    सोऽब्रवीत् ॥ । जैगीषव्याय स प्राह सोऽब्रवीच्च्यवनाय च । तस्मा उवाच शाण्डिल्यो गर्गाय प्राह वै मुनिः
    ॥ ॥ क्रतुञ्जयाय स प्राह जतुकर्ण्याय संयमी । विष्णुवृद्धाय सोऽप्याह सोऽपि बोधायनाय च ॥ ॥ क्रमात्स विष्णवे
    प्राह स प्राहोद्धामकुक्षये । सिंहतेजाश्च तस्माच्च श्रीप्रियाय ददौ च नः ॥ उपदिष्टोऽस्मि तेनाहमिदं नामसहस्रकम्
    । तत्प्रसादादमृत्युर्मे यस्मात्कस्माद्भयं न हि ॥ ॥ मया च कथितं नारसिंहस्तोत्रमिदं तव । त्वं हि नित्यं
    शुचिर्भूत्वा तमाराधय शाश्वतम् ॥ ॥ सर्वभूताश्रयं देवं नृसिंहं भक्तवत्सलम् । पूजयित्वा स्तवं जप्त्वा
    हुत्वा निश्चलमानसः ॥ ॥ प्राप्यसे महतीं सिद्धिं सर्वान् कामान्वरोत्तमान् । अयमेव परोधर्मस्त्विदमेव
    परं तपः ॥ ॥ इदमेव परं ज्ञानमिदमेव महद्व्रतम् । अयमेव सदाचारस्त्वयमेव सदा मखः ॥ ॥ इदमेव त्रयो वेदाः
    सच्छास्त्राण्यागमानि च । नृसिंहमन्त्रादन्यच्च वैदिकं तु न विद्यते ॥ ॥ यदिहास्ति तदन्यत्र यन्नेहास्ति
    न तत्क्वचित् । कथितं ते नृसिंहस्य चरितं पापनाशनम् ॥ ॥ सर्वमन्त्रमयं तापत्रयोपशमनं परम् । सर्वार्थसाधनं
    दिव्यं किं भूयः श्रोतुमिच्छसि ॥ ॥ इति श्रीनृसिंहपुराणे नृसिंहप्रादुर्भावे श्रीमद्दिव्य लक्ष्मीनृसिंह
    सहस्रनाम स्तोत्रम् ॥
