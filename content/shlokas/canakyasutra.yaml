id: canakyasutra
category: sutra
name:
  english: canakyasutra
  devanagari: चाणक्यसूत्र
content:
  english: canakyani athava kautiliyani nitisutrani atha prathamo'dhyayah || sa shrirvo'vyat || 1|| sukhasya
    mulam dharmah ||2|| dharmasya mulamarthah || 3|| arthasya mulam rajyam || 4|| rajyamulamindriyajayah
    || 5|| indriyajayasya mulam vinayah || 6|| vinayasya mulam vriddhopaseva || 7|| vriddhasevaya vijnanam
    || 8|| vijnanenatmanam sampadayet || 9|| sampaditatma jitatma bhavati || 10|| jitatma sarvarthaih
    samyujyate || 11|| svamisampat prakritisampadam karoti || 12|| prakritisampada hyanayakamapi rajyam
    niyate || 13|| prakritikopah sarvakopebhyo gariyan || 14|| avinitasvamibhavadasvamibhavah shreyan
    || 15|| sampadyatmanamanvicchet sahayan || 16|| na'sahasya mantranishcayah || 18|| naikam cakram paribhramati
    || 19|| sahayah samo duhkhasukhayoh || 17|| mani pratimaninamatmadvitiyam mantrinamutpadayet || 20||
    avinitam snehamatrena na mantre kurvita || 21|| shrutavantamupadhashuddham mantrinam kurvita || 21||
    mantramulah sarvarambhah || 22|| mantrasamvarane karyasiddhirbhavati || 23|| mantranihsravah sarvam
    nashayati || 24|| pramadad dvishatam vashamupayasyati || 25|| sarvadvarebhyo mantro rakshitavyah ||
    26|| mantrasampada hi rajyam vivardhate || 27|| shreshthatamam mantragupitamahuh || 28|| karyakarya
    pradipo mantrah || 29|| mantracakshusha paracchidranyavalokayanti || 31 | mantrakale na matsarah kartavyah
    || 31|| akamabuddhayo mantratattvarthadarshino mantrinah || 34|| shatkarno mantrashchidyate || 32||
    trayanamaikavakye'sampratyayah || 33|| apatsu snehayuktam mitram || 35|| mitrasamgrahane balam sampadyate
    || 36|| balavan alabdhalabhe prayateta || 37|| alabdhalabho nalasasya || 38|| alasena labdhamapi rakshitum
    na shakyate || 39|| na calasasyayuktasya rakshitam vivardhate || 40|| na bhrityan poshayati || 41||
    na tirtham pratipadayati || 42|| alabdhalabhadicatushtayam rajatantram || 43|| tacca rajyatantramayatam
    nitishastreshu || 44|| rajyatantreshvayattau mantravapau || 45|| mantram svavishaye krityeshvayattam
    || 46|| avapo mandale sannivishtah || 46|| sandhivigrahayoryonirmandalam || 48|| nitishastranugo raja
    || 49|| anantaraprakritih shatruh || 50|| ekantaritam mitramishyate || 51|| hetutah shatrumitre bhavishyatah
    || 52|| hiyamanena sa sandhim kurvita || 53|| tejo hi sandhanahetustadarthinam || 54|| nataptaloham
    lohena sandhatte || 55|| balavan hinena vigrihniyat || 56|| na jyayasa samena va || 57|| hastinah
    padayuddhamiva balavadvigrahah || 58 | amapatramapena saha vinashyati || 59|| ariprayatnamabhisamikshyatmarakshaya
    vaset || 60|| sandhayaikato va yayat || 58|| amitravirodhadatmarakshamavaset || 59|| shaktihino balavantamashrayet
    || 61|| durbalashrayo duhkhamavahati || 62|| agnivad rajanamashrayet || 63|| rajnah pratikulam nacaret
    || 64|| noddhataveshadharah syat || 66|| na devacaritam caret || 65|| dvayorapirshyatordvaidhibhavakurvita
    || 67|| na vyasanaparasya karyavaptih || 68|| indriyavashavartino nasti karyavaptih || 69|| nasti
    karyam dyutapravrittasya || 70|| mrigayaparasya dharmarthau vinashyatah || 71|| na kamasaktasya karyanushthanam
    || 73|| artheshu panavyasani na ganyate || 72|| arthadushakam shrih parityajati || 76|| agnidahadapi
    vishishtam vakparushyam || 74|| dandaparushyat sarvajanadveshyo bhavati || 75|| amitro dandanityamayattah
    || 77|| dandanitimanushthan prajah samrakshati || 78|| dandah sarvasampada yojayati || 79|| dandabhave
    trivargabhavah || 80|| dandabhayadakaryani na kurvanti || 81|| dandanityamayattamatmarakshanam ||
    82|| atmani rakshite sarvam rakshitam bhavati || 83|| atmayattau vriddhivinashau || 84|| dandanityadi
    vijnane praniyate || 85|| durbalo'pi raja navamantavyah || 86|| nastyagnerdaurbalyam || 87|| dandena
    praniyate vrittih || 88|| vrittimulo'rthalabhah || 89|| arthamulau dharmakamau || 90|| arthamulam
    karyam || 91|| yatnaprayatnat karyasiddhirbhavati sa upayah || 92|| upayapurvam karyam na dushkaram
    syat || 93|| anupayapurvam karyam kritamapi vinashyati || 94|| karyarthinamupaya eva sahayah || 95||
    karyam purushakarena lakshyam sampadyate || 96|| purushakaramanuvartate daivam || 97|| daivam vina
    atiprayatnam karoti yattad viphalam || 98|| anihamanasya vrittirna sampadyate || 99|| purvam nishcitya
    pashcatkaryamarabheta ||100|| iti canakyasutre prathamo'dhyayah || atha dvitiyo'dhyayah || arthamulam
    sarvakaryam yadalpaprayatnat karyasiddhirbhavati || 1|| upayapurvam karyam na dushkaram syat || 2||
    anupayapurvakaryam kritamapi vinashyati || 3|| karyarthinamupaya eva sahayah || 4|| karyam purushakarena
    lakshyam sampadyate || 5|| purushakaramanuvartate daivam || 6|| daivam vina'tiprayatnam yatkaroti
    tadviphalam || 7|| asamahitasya karyam na vidyate || 8|| purvam nishcitya pashcatkaryamarabheta ||
    9|| karyantare dirghasutrata na kartavya || 10|| na calacittasya karyavaptih || 11|| hastagatavamananat
    karyavyatikramo bhavati || 12|| doshavarjitani karyani durlabhani || 13|| duranibandham karyam na
    arabheta || 14|| kalavit karyam sadhayet || 15|| kalatikramat kala eva phalam pibati || 16|| kshanam
    prati kalavikshepam na kuryat sarvakriteshu || 17|| deshakalavibhagau jnatva karyamarabheta || 18||
    daivahinam karyam susadhamapi dussadham bhavati || 19|| nitijno deshakalau pariksheta || 20|| parikshyakarini
    shrishciram tishthati || 21|| sarvashca sampadah sarvopayena parigrihniyat || 22|| bhagyavantamapyaparikshyakarinam
    shrih parityajati || 23|| jnatva'numanaishca pariksha kartavya || 24|| yo yasminkarmani kushalastam
    tasminneva yojayet || 25|| dussadhamapi susadham karotyupayajnah || 26|| ajnanina kritamapi na bahumantavyam
    yadricchikatvat || 27|| krimayo'po hi kadacit rupantarani kurvanti || 28|| siddhasyaiva karyasya prakashanam
    kartavyam || 29|| jnanavatamapi daivamanushadoshat karyani dushyanti || 30|| daivam dosham shantikarmana
    pratishedhayet || 31|| manushim karyavipattim kaushalena vinivarayet || 32|| karyavipattau doshan
    varnayanti balishah || 33|| karyarthina dakshinyam na kartavyam || 34|| kshirarthi vatso maturudhah
    pratihanti || 35|| aprayatnat karyavipattirbhavet || 36|| na daivamatrapramananam karyasiddhih ||
    37|| karyabahyo na poshayatyashritan || 38|| yah karyam na pashyati so'ndhah || 39|| pratyakshaparokshanumanaih
    karyani pariksheta || 40|| aparikshakarinam shrih parityajati || 41|| parikshya tarya vipattih ||
    42|| svashaktim jnatva karyamarabheta || 43|| svajanam tarpayayitva yashsheshabhoji so'mritabhoji
    || 44|| samyaganushthanadayamukhani vardhante || 45|| nasti bhiroh karyacinta || 46|| svaminah shilam
    jnatva karyarthi karyam sadhayet || 47|| dhenoshshilajno hi kshiram bhunkte || 48|| kshudre guhyaprakashanamatmavan
    na kuryat || 49|| ashritairapyavamanyate mridusvabhavah || 50|| tikshnadandah sarveshamudvejaniyo
    bhavati || 51|| yatharhadandakari syat || 52|| alpasaram shrutavantamapi na bahumanyate lokah || 53||
    atibharah purushamavasadayati || 54|| yah samsadi paradosham shamsati sa svadoshabahutvameva prakhyapayati
    || 55|| atmanameva nashayatyanatmavatam kopah || 56|| nastyaprapyam satyavatam || 57|| na kevalena
    sahasena karyasiddhirbhavati || 58 vyasanarto vismaratyavashyakartavyan || 59|| nastyanantarayah kalavikshepe
    || 60|| asamshayavinashat samshayavinashah shreya || 61|| kevalam dhanani niksheptum na svartham na
    danam na dharmah || 62|| narya agato'rthah tadviparitamanarthabhavam bhajate || 63|| yo dharmarthau
    na vyarthayati sa kamah tadviparito'narthasevi || 64|| rijusvabhavapro jano durlabhah || 65|| avamanenagatamaishvaryamavamanyata
    eva sadhuh || 66|| bahunapi hi gunanekadosho grasati || 67|| mahatmana param sahasam na kartavyam
    || 68|| kadacidapi caritram na langhayet || 69|| kshudha''rto na trinam carati simhah || 70|| pranadapi
    pratyayo rakshitavyah || 71|| pishuno neta putradarairapi tyajyate || 72|| iti dvitiyo'dhyayah ||
    atha tritiyo'dhyayah || baladapi yuktamartha sha
  devanagari: चाणक्यानि अथवा कौटिलीयानि नीतिसूत्राणि अथ प्रथमोऽध्यायः ॥ सा श्रीर्वोऽव्यात् ॥ १॥ सुखस्य
    मूलं धर्मः ॥२॥ धर्मस्य मूलमर्थः ॥ ३॥ अर्थस्य मूलं राज्यम् ॥ ४॥ राज्यमूलमिन्द्रियजयः ॥ ५॥ इन्द्रियजयस्य
    मूलं विनयः ॥ ६॥ विनयस्य मूलं वृद्धोपसेवा ॥ ७॥ वृद्धसेवाया विज्ञानम् ॥ ८॥ विज्ञानेनात्मानं सम्पादयेत्
    ॥ ९॥ सम्पादितात्मा जितात्मा भवति ॥ १०॥ जितात्मा सर्वार्थैः संयुज्यते ॥ ११॥ स्वामिसम्पत् प्रकृतिसम्पदं
    करोति ॥ १२॥ प्रकृतिसम्पदा ह्यनायकमपि राज्यं नीयते ॥ १३॥ प्रकृतिकोपः सर्वकोपेभ्यो गरीयान् ॥ १४॥ अविनीतस्वामिभावादस्वामिभावः
    श्रेयान् ॥ १५॥ सम्पाद्यात्मानमन्विच्छेत् सहायान् ॥ १६॥ नाऽसहास्य मन्त्रनिश्चयः ॥ १८॥ नैकं चक्रं परिभ्रमति
    ॥ १९॥ सहायः समो दुःखसुखयोः ॥ १७॥ मानी प्रतिमानिनमात्मद्वितीयं मन्त्रिणमुत्पादयेत् ॥ २०॥ अविनीतं स्नेहमात्रेण
    न मन्त्रे कुर्वीत ॥ २१॥ श्रुतवन्तमुपधाशुद्धं मन्त्रिणं कुर्वीत ॥ २१॥ मन्त्रमूलाः सर्वारम्भाः ॥ २२॥
    मन्त्रसंवरणे कार्यसिद्धिर्भवति ॥ २३॥ मन्त्रनिःस्रावः सर्वम् नाशयति ॥ २४॥ प्रमादाद् द्विषतां वशमुपयास्यति
    ॥ २५॥ सर्वद्वारेभ्यो मन्त्रो रक्षितव्यः ॥ २६॥ मन्त्रसम्पदा हि राज्यं विवर्धते ॥ २७॥ श्रेष्ठतमां मन्त्रगुपितमाहुः
    ॥ २८॥ कार्याकार्य प्रदीपो मन्त्रः ॥ २९॥ मन्त्रचक्षुषा परच्छिद्राण्यवलोकयन्ति ॥ ३१ । मन्त्रकाले न मत्सरः
    कर्तव्यः ॥ ३१॥ अकामबुद्धयो मन्त्रतत्त्वार्थदर्शिनो मन्त्रिणः ॥ ३४॥ षट्कर्णो मन्त्रश्छिद्यते ॥ ३२॥
    त्रयाणामैकवाक्येऽसम्प्रत्ययः ॥ ३३॥ आपत्सु स्नेहयुक्तं मित्रम् ॥ ३५॥ मित्रसंग्रहणे बलं सम्पद्यते ॥
    ३६॥ बलवान् अलब्धलाभे प्रयतेत ॥ ३७॥ अलब्धलाभो नालसस्य ॥ ३८॥ अलसेन लब्धमपि रक्षितुं न शक्यते ॥ ३९॥ न
    चालसस्ययुक्तस्य रक्षितं विवर्धते ॥ ४०॥ न भृत्यान् पोषयति ॥ ४१॥ न तीर्थं प्रतिपादयति ॥ ४२॥ अलब्धलाभादिचतुष्टयं
    राजतन्त्रम् ॥ ४३॥ तच्च राज्यतन्त्रमायतं नीतिशास्त्रेषु ॥ ४४॥ राज्यतन्त्रेष्वायत्तौ मन्त्रावापौ ॥ ४५॥
    मन्त्रं स्वविषये कृत्येष्वायत्तम् ॥ ४६॥ आवापो मण्डले सन्निविष्टः ॥ ४६॥ सन्धिविग्रहयोर्योनिर्मण्डलम्
    ॥ ४८॥ नीतिशास्त्रानुगो राजा ॥ ४९॥ अनन्तरप्रकृतिः शत्रुः ॥ ५०॥ एकान्तरितं मित्रमिष्यते ॥ ५१॥ हेतुतः
    शत्रुमित्रे भविष्यतः ॥ ५२॥ हीयमानेन स सन्धिं कुर्वीत ॥ ५३॥ तेजो हि सन्धानहेतुस्तदर्थिनाम् ॥ ५४॥ नातप्तलोहं
    लोहेन सन्धत्ते ॥ ५५॥ बलवान् हीनेन विगृह्णीयात् ॥ ५६॥ न ज्यायसा समेन वा ॥ ५७॥ हस्तिनः पादयुद्धमिव बलवद्विग्रहः
    ॥ ५८ । आमपात्रमापेन सह विनश्यति ॥ ५९॥ अरिप्रयत्नमभिसमीक्ष्यात्मरक्षया वसेत् ॥ ६०॥ सन्धायैकतो वा यायात्
    ॥ ५८॥ अमित्रविरोधादात्मरक्षामावसेत् ॥ ५९॥ शक्तिहीनो बलवन्तमाश्रयेत् ॥ ६१॥ दुर्बलाश्रयो दुःखमावहति
    ॥ ६२॥ अग्निवद् राजानमाश्रयेत् ॥ ६३॥ राज्ञाः प्रतिकूलं नाचरेत् ॥ ६४॥ नोद्धतवेशधरः स्यात् ॥ ६६॥ न देवचरितं
    चरेत् ॥ ६५॥ द्वयोरपीर्ष्यतोर्द्वैधीभावकुर्वीत ॥ ६७॥ न व्यसनपरस्य कार्यावाप्तिः ॥ ६८॥ इन्द्रियवशवर्तिनो
    नास्ति कार्यावाप्तिः ॥ ६९॥ नास्ति कार्यं द्युतप्रवृत्तस्य ॥ ७०॥ मृगयापरस्य धर्मार्थौ विनश्यतः ॥ ७१॥
    न कामासक्तस्य कार्यानुष्ठानम् ॥ ७३॥ अर्थेषु पानव्यसनी न गण्यते ॥ ७२॥ अर्थदूषकं श्रीः परित्यजति ॥ ७६॥
    अग्निदहादपि विशिष्तं वाक्पारुष्यम् ॥ ७४॥ दण्डपारुष्यात् सर्वजनद्वेष्यो भवति ॥ ७५॥ अमित्रो दण्डनीत्यामायत्तः
    ॥ ७७॥ दण्डनीतिमनुष्ठन् प्रजाः संरक्षति ॥ ७८॥ दण्डः सर्वसम्पदा योजयति ॥ ७९॥ दण्डाभावे त्रिवर्गाभावः
    ॥ ८०॥ दण्डभयादकार्याणि न कुर्वन्ति ॥ ८१॥ दण्डनीत्यामायत्तमात्मरक्षणम् ॥ ८२॥ आत्मनि रक्षिते सर्वं रक्षितं
    भवति ॥ ८३॥ आत्मायत्तौ वृद्धिविनाशौ ॥ ८४॥ दण्डनीत्यादि विज्ञाने प्रणीयते ॥ ८५॥ दुर्बलोऽपि राजा नावमन्तव्यः
    ॥ ८६॥ नास्त्यग्नेर्दौर्बल्यम् ॥ ८७॥ दण्डेन प्रणीयते वृत्तिः ॥ ८८॥ वृत्तिमूलोऽर्थलाभः ॥ ८९॥ अर्थमूलौ
    धर्मकामौ ॥ ९०॥ अर्थमूलम् कार्यम् ॥ ९१॥ यत्नप्रयत्नात् कार्यसिद्धिर्भवति स उपायः ॥ ९२॥ उपायपूर्वं कार्यं
    न दुष्करं स्यात् ॥ ९३॥ अनुपायपूर्वं कार्यं कृतमपि विनश्यति ॥ ९४॥ कार्यार्थिनामुपाय एव सहायः ॥ ९५॥
    कार्यं पुरुषकारेण लक्ष्यं सम्पद्यते ॥ ९६॥ पुरुषकारमनुवर्तते दैवम् ॥ ९७॥ दैवं विना अतिप्रयत्नं करोति
    यत्तद् विफलम् ॥ ९८॥ अनीहमानस्य वृत्तिर्न सम्पद्यते ॥ ९९॥ पूर्वं निश्चित्य पश्चात्कार्यमारभेत ॥१००॥
    इति चाणक्यसूत्रे प्रथमोऽध्यायः ॥ अथ द्वितीयोऽध्यायः ॥ अर्थमूलं सर्वकार्यं यदल्पप्रयत्नात् कार्यसिद्धिर्भवति
    ॥ १॥ उपायपूर्वं कार्यं न दुष्करं स्यात् ॥ २॥ अनुपायपूर्वकार्यं कृतमपि विनश्यति ॥ ३॥ कार्यार्थिनामुपाय
    एव सहायः ॥ ४॥ कार्यं पुरुषकारेण लक्ष्यं सम्पद्यते ॥ ५॥ पुरुषकारमनुवर्तते दैवम् ॥ ६॥ दैवं विनाऽतिप्रयत्नं
    यत्करोति तद्विफलम् ॥ ७॥ असमाहितस्य कार्यं न विद्यते ॥ ८॥ पूर्वं निश्चित्य पश्चात्कार्यमारभेत ॥ ९॥
    कार्यान्तरे दीर्घसूत्रता न कर्तव्या ॥ १०॥ न चलचित्तस्य कार्यावाप्तिः ॥ ११॥ हस्तगतावमाननात् कार्यव्यतिक्रमो
    भवति ॥ १२॥ दोषवर्जितानि कार्याणि दुर्लभानि ॥ १३॥ दुरनिबन्धं कार्यं न आरभेत ॥ १४॥ कालवित् कार्यं साधयेत्
    ॥ १५॥ कालातिक्रमात् काल एव फलं पिबति ॥ १६॥ क्षणं प्रति कालविक्षेपं न कुर्यात् सर्वकृतेषु ॥ १७॥ देशकालविभागौ
    ज्ञात्वा कार्यमारभेत ॥ १८॥ दैवहीनं कार्यं सुसाधमपि दुस्साधं भवति ॥ १९॥ नीतिज्ञो देशकालौ परीक्षेत ॥
    २०॥ परीक्ष्यकारिणि श्रीश्चिरं तिष्ठति ॥ २१॥ सर्वाश्च सम्पदः सर्वोपायेन परिगृह्णीयात् ॥ २२॥ भाग्यवन्तमप्यपरीक्ष्यकारिणं
    श्रीः परित्यजति ॥ २३॥ ज्ञात्वाऽनुमानैश्च परीक्षा कर्तव्या ॥ २४॥ यो यस्मिन्कर्मणि कुशलस्तं तस्मिन्नेव
    योजयेत् ॥ २५॥ दुस्साधमपि सुसाधं करोत्युपायज्ञः ॥ २६॥ अज्ञानिना कृतमपि न बहुमन्तव्यं यादृच्छिकत्वात्
    ॥ २७॥ कृमयोऽपो हि कदाचित् रूपान्तराणि कुर्वन्ति ॥ २८॥ सिद्धस्यैव कार्यस्य प्रकाशनं कर्तव्यम् ॥ २९॥
    ज्ञानवतामपि दैवमानुषदोषात् कार्याणि दुष्यन्ति ॥ ३०॥ दैवं दोषं शान्तिकर्मणा प्रतिषेधयेत् ॥ ३१॥ मानुषीं
    कार्यविपत्तिं कौशलेन विनिवारयेत् ॥ ३२॥ कार्यविपत्तौ दोषान् वर्णयन्ति बालिशाः ॥ ३३॥ कार्यार्थिना दाक्षिण्यं
    न कर्तव्यम् ॥ ३४॥ क्षीरार्थि वत्सो मातुरूधः प्रतिहन्ति ॥ ३५॥ अप्रयत्नात् कार्यविपत्तिर्भवेत् ॥ ३६॥
    न दैवमात्रप्रमाणानां कार्यसिद्धिः ॥ ३७॥ कार्यबाह्यो न पोषयत्याश्रितान् ॥ ३८॥ यः कार्यं न पश्यति सोऽन्धः
    ॥ ३९॥ प्रत्यक्षपरोक्षनुमानैः कार्याणि परीक्षेत ॥ ४०॥ अपरीक्षकारिणं श्रीः परित्यजति ॥ ४१॥ परीक्ष्य
    तार्या विपत्तिः ॥ ४२॥ स्वशक्तिं ज्ञात्वा कार्यमारभेत ॥ ४३॥ स्वजनं तर्पययित्वा यश्शेषभोजी सोऽमृतभोजी
    ॥ ४४॥ सम्यगनुष्ठानादायमुखानि वर्धन्ते ॥ ४५॥ नास्ति भीरोः कार्यचिन्ता ॥ ४६॥ स्वामिनः शीलं ज्ञात्वा
    कार्यार्थी कार्यं साधयेत् ॥ ४७॥ धेनोश्शीलज्ञो हि क्षीरं भुङ्क्ते ॥ ४८॥ क्षुद्रे गुह्यप्रकाशनमात्मवान्
    न कुर्यात् ॥ ४९॥ आश्रितैरप्यवमन्यते मृदुस्वभावः ॥ ५०॥ तीक्ष्णदण्डः सर्वेषामुद्वेजनीयो भवति ॥ ५१॥ यथार्हदण्डकारी
    स्यात् ॥ ५२॥ अल्पसारं श्रुतवन्तमपि न बहुमन्यते लोकः ॥ ५३॥ अतिभारः पुरुषमवसादयति ॥ ५४॥ यः संसदि परदोषं
    शंसति स स्वदोषबहुत्वमेव प्रख्यापयति ॥ ५५॥ आत्मानमेव नाशयत्यनात्मवतां कोपः ॥ ५६॥ नास्त्यप्राप्यं सत्यवताम्
    ॥ ५७॥ न केवलेन साहसेन कार्यसिद्धिर्भवति ॥ ५८ व्यसनार्तो विस्मरत्यवश्यकर्तव्यान् ॥ ५९॥ नास्त्यनन्तरायः
    कालविक्षेपे ॥ ६०॥ असंशयविनाशात् संशयविनाशः श्रेया ॥ ६१॥ केवलं धनानि निक्षेप्तुं न स्वार्थं न दानं
    न धर्मः ॥ ६२॥ नार्या आगतोऽर्थः तद्विपरीतमनर्थभावं भजते ॥ ६३॥ यो धर्मार्थौ न व्यर्थयति स कामः तद्विपरीतोऽनर्थसेवी
    ॥ ६४॥ ऋजुस्वभावप्रो जनो दुर्लभः ॥ ६५॥ अवमानेनागतमैश्वर्यमवमन्यत एव साधुः ॥ ६६॥ बहूनपि हि गुणानेकदोषो
    ग्रसति ॥ ६७॥ महात्मना परं साहसं न कर्तव्यम् ॥ ६८॥ कदाचिदपि चारित्रं न लङ्घयेत् ॥ ६९॥ क्षुधाऽऽर्तो
    न तृणं चरति सिंहः ॥ ७०॥ प्राणादपि प्रत्ययो रक्षितव्यः ॥ ७१॥ पिशुनो नेता पुत्रदारैरपि त्यज्यते ॥ ७२॥
    इति द्वितीयोऽध्यायः ॥ अथ तृतीयोऽध्यायः ॥ बालादपि युक्तमर्थ श
