id: vanadrinathastotram
category: stotram
name:
  english: vanadrinathastotram
  devanagari: वानाद्रिनाथस्तोत्रम्
content:
  english: adhye locanavaridheh pravilatsetujjvalannasikam | balakojjvaladinyaratnamakundam padmopariraphitaka
    shrimaddivyamadhuvratayitalasatkalasthapundrojjvalam || 58|| kausheyojjvalavigraha sulalitam capadacudam
    sada shrimantam vanashailadivyatilakam bhailokyasammohanam | evam sundarabahumambujapadam drishtanubhuya
    prabhu samstutya pranatah sada pulakitah santoshapurnashayah || 59|| shrimatsundarado padambujatulakotiprabhutodaka
    snanodbhutamahavabodhavibhavah kainkaryasamrajyagah | kurvastasya ca sundarasya vividhan brahmotsavadyan
    mahan bhupalo bhalayadhvajo vijayate vairagyanishthagranih || 60|| raja so'pi tatastada bhagavatah
    kartum vasantotsavam shrimatsundaradoshni divyavibhava vijnapayamasa sah | tasya shribhagavan mahadbhutatamam
    santushya caitrotsavah kartavyo bhavatetyasau niyamanam cakre mahasundarah || 61|| caitre masi tatah
    param narapatih shripaurnamasyam dine tatkalanugunairvilakshanarasaih karpuragandhadibhih | shrivaikhanasashastrato
    dvijavarairvidvadvarairarcakaih shrimantam samapujayadrishagire tham mahasundaram || 62|| tato viharayatrarthamutsavante
    hari nripah | pitambaramudaranam sarvabhushanabhushitam || 63|| divyam vimanamaropya kamagam ratnabhushitam
    | nirjagama bahirvishnoh santoshartha sa bhupatih || 64|| bherishankhamridangavadyamadhurashrivenuvinasvanai
    rlokanam svanitaih stavaishca yaminam ghoshairmuninam shubhaih | shriman sundarabahurinduvadanah shabdayamano
    disha chatradyaishca paricchadairgajamukhaih samvarito nirgatah || 65|| tasmin shrimati nirgate suramukhah
    shakradayah sundare sevartha svavimanakaishca puratastvabhyagatah prematah | harshadapsarasah striyashca
    nanrituh shrinaradadyastatha gandharvastu jagushca karnamadhuram ghushyanti vedan dvijah || 66|| evam
    vrishadrernairityam gatva yojanamuttare | nagadreh kritamalayastire madhupurahaye || 67|| virajya
    mantapam raja divyalakshanasamyutam | sarvalankarasamyuktam tatra simhasane shubhe || 68|| lavanyanamakam
    vishnu samsthapya sa mahipatih | anarca vividhaum gairarthapadhadibhiharim || 69|| divyagandhayutairatirtha
    mantraputairmanoharaih | abhishicyapyalakritya mahashcandanadibhih || 70|| upacaraih samamyarcya darshayitva
    ca dipikah | asalyeya ghritaih siktah santoshaya harernripah || 71|| maharhani vicitrani havimshi
    bahulani ca | apupadimshca ruciran maharhani phalani ca || 72|| tambulikah sakarpura madhuparkadikastatha
    | nivedya vishnubhaktebhyo dadau tani yatheshtatah || 73|| evam sundararajasya vartamane mahotsave
    | tatratyaste naditire tapasyanto munishvarah || 74|| romashadyastathanye ca harim drashtum samagatah
    | nishevya tu maham divyam bhagavadvikshanaplutah || 75|| kritarthah sarva evaite prarthayan madhusudanam
    | aho mahotsavo deva netranandah sharirinam || 76|| aho bhagyamaho bhagyam rajnastu madhusudana |
    lakshmipate vayam dhanyah shriman pankajalocana || 77|| evamevatra bhavatadutsavah prativatsaram |
    ujjivanaya jagatam kripaya bhavato hare || 78|| manjiratatinitirthe nityam snatum na shaknumah | atah
    sapyatra nagahagiravavirbhavatviti || 79|| ittham vijnapito vishnurviprendraih karunanidhih | bhakteshtado
    varam pradat paramam kamalapatih || 8|| tadaiva nagadritate manjiratatini hareh | ajnaya pravahatyesha
    jagatam pavanaya ca || 81|| namadravudayatsaiva nagatirthamitiryate | tasyam snatva tu rishayah paramam
    siddhimagatah || 82|| rajasau malayadhvajo vrishangarernathasya lakshmipateh shrinagahvagiri mahadbhutarasairittham
    vasantotsavam | caitre masi mahotsavam bhagavatah shripaurnamasyam dine kritva tam sakutuhalam vanagirim
    samprapayat sundaram || 83|| padmacandramritarasapraspardhimukhamandalam | vrishadritatagam vande
    sada sarvanganundaram || 84|| rajna shrimalayadhvajena mahata devairagastyadibhih shrimaccaitramahotsavo
    munivarah pratyabdamatyadbhutam | shrinagaigiravakari tu pura shrisundarasya prabhoh lavanyanbunirvrishacalapateh
    kshirabdhikanyapateh || 85|| idanintanatadriti kashcidraja karotyasau | ityesha kimvadanti tu kenaciddhetuna
    kacit || 86|| idanintanacaitrotsavavaibhavam phanamah kalyanam dishatadasheshajagatam rajadhirajah
    shriya sardham divyavrishacale manimaye simhasane susthitah | muktaratnakiritakaustubhamukhaih shribhushanabhushitah
    sarvabhishtaphalapradah pranamatam mohankarah sundarah || 87|| vande divyasuvarnanirmitamahaprakararatnojjvala
    somacchandavimanagopuramanistambhollasanmantapaih | anyaishcapi vilakshanairmaratakasthunavritairmantapai
    rbhantam shrivrishabhacalam manimayam trailokyasambhushanam || 88|| senanyapramukhairvilakshanagunairnityaih
    sada samshritam brahmeshanamahendramukhyavibudhairanyairmanushyairjanaih | svasvabhishtamahaphalat
    parinanatam yogishvaraih samstutam tiyagjatibhiravritam vanagiri gangeyarupam bhaje || 89|| caitre
    pushpitavrikshajatinivahe kshemankare dehinam mase sarvamanojnashodashakalapurnendusamlakshite | divye
    shuklacaturdashishubhadine sampraptacorakritih shrimana sundarabahurinduvadanastasmat pratasthe gireh
    || 90|| corakaradharam suvarnakavacam sha didivyayudham shribhushasamalankritam manilasanmuktakiritojjvalam
    | nanavarnavicitraratnakanakashrivahane susthitam caitre masi caturdashishubhadine yantam bhaje sundaram
    || 91|| madhyemargamaho samastajagatam mohankaram sundaram pashyallokarajahkanairdini bhuci pracchadayantam
    janan | bherimukhyavisheshavadyanivahaih shabdayamanam disho pande sundarabanamabujamukham santoshapurnashayam
    || 92|| shrimadvegavatimahottaratate lakshmipure mantape muktadamavirajite dilasite sauvarnasimhasane
    | tishthantam kanakaprabham bhuvi jananahadayantam muda shribhushasamalar̤akritam vrishagire tham
    bhaje sundaram || 93|| tatra shrimanimantape vilasite vidvajjanaih samvrite|
  devanagari: अध्ये लोचनवारिधेः प्रविलत्सेतूज्ज्वलन्नासिकम् । बालाकोज्ज्वलदिन्यरत्नमकुन्दं पद्मोपरिरफीतक
    श्रीमद्दिव्यमधुव्रतायितलसत्कालस्थपुण्ड्रोज्ज्वलम् ॥ ५८॥ कौशेयोज्ज्वलविग्रह सुललितं चापादचूडं सदा श्रीमन्तं
    वनशैलदिव्यतिलकं भैलोक्यसम्मोहनम् । एवं सुन्दरबाहुमम्बुजपदं दृष्टानुभूय प्रभु संस्तुत्य प्रणतः सदा
    पुलकितः सन्तोषपूर्णाशयः ॥ ५९॥ श्रीमत्सुन्दरदो पदाम्बुजतुलाकोटिप्रभूतोदक स्नानोद्भूतमहावबोधविभवः कैङ्कर्यसाम्राज्यगः
    । कुर्वस्तस्य च सुन्दरस्य विविधान् ब्रह्मोत्सवाद्यान् महान् भूपालो भलयध्वजो विजयते वैराग्यनिष्ठाग्रणीः
    ॥ ६०॥ राजा सोऽपि ततस्तदा भगवतः कर्तुं वसन्तोत्सवं श्रीमत्सुन्दरदोष्णि दिव्यविभव विज्ञापयामास सः ।
    तस्य श्रीभगवान् महाद्भुततमं सन्तुष्य चैत्रोत्सवः कर्तव्यो भवतेत्यसौ नियमनं चक्रे महासुन्दरः ॥ ६१॥
    चैत्रे मासि ततः परं नरपतिः श्रीपौर्णमास्यां दिने तत्कालानुगुणैर्विलक्षणरसैः कर्पूरगन्धादिभिः । श्रीवैखानसशास्त्रतो
    द्विजवरैर्विद्वद्वरैरर्चकैः श्रीमन्तं समपूजयदृषगिरे थं महासुन्दरम् ॥ ६२॥ ततो विहारयात्रार्थमुत्सवान्ते
    हरि नृपः । पीताम्बरमुदारानं सर्वभूषणभूषितम् ॥ ६३॥ दिव्यं विमानमारोप्य कामगं रत्नभूषितम् । निर्जगाम
    बहिर्विष्णोः सन्तोषार्थ स भूपतिः ॥ ६४॥ भेरीशङ्खमृदङ्गवाद्यमधुरश्रीवेणुवीणास्वनै र्लोकानां स्वनितैः
    स्तवैश्च यमिनां घोषैर्मुनीनां शुभैः । श्रीमान् सुन्दरबाहुरिन्दुवदनः शब्दायमानो दिशा छत्राद्यैश्च परिच्छदैर्गजमुखैः
    संवारितो निर्गतः ॥ ६५॥ तस्मिन् श्रीमति निर्गते सुरमुखाः शक्रादयः सुन्दरे सेवार्थ स्वविमानकैश्च पुरतस्त्वभ्यागताः
    प्रेमतः । हर्षादप्सरसः स्त्रियश्च ननृतुः श्रीनारदाद्यास्तथा गन्धर्वास्तु जगुश्च कर्णमधुरं घुष्यन्ति
    वेदान् द्विजाः ॥ ६६॥ एवं वृषाद्रेर्नैऋत्यां गत्वा योजनमुत्तरे । नागाद्रेः कृतमालायास्तीरे मधुपुराहये
    ॥ ६७॥ विरज्य मण्टपं राजा दिव्यलक्षणसंयुतम् । सर्वालङ्कारसंयुक्तं तत्र सिंहासने शुभे ॥ ६८॥ लावण्यनामकं
    विष्णु संस्थाप्य स महीपतिः । आनर्च विविधौं गैरर्थपाधादिभिहरिम् ॥ ६९॥ दिव्यगन्धयुतैरतीर्थ मन्त्रपुतैर्मनोहरैः
    । अभिषिच्याप्यलकृत्य महाश्चन्दनादिभिः ॥ ७०॥ उपचारैः समम्यर्च्य दर्शयित्वा च दीपिकाः । असल्येया घृतैः
    सिक्ताः सन्तोषाय हरेर्नृपः ॥ ७१॥ महार्हाणि विचित्राणि हवींषि बहुलानि च । अपूपादींश्च रुचिरान् महार्हाणि
    फलानि च ॥ ७२॥ ताम्बूलिकाः सकर्पूरा मधुपर्कादिकास्तथा । निवेद्य विष्णुभक्तेभ्यो ददौ तानि यथेष्टतः ॥
    ७३॥ एवं सुन्दरराजस्य वर्तमाने महोत्सवे । तत्रत्यास्ते नदीतीरे तपस्यन्तो मुनीश्वराः ॥ ७४॥ रोमशाद्यास्तथान्ये
    च हरिं द्रष्टुं समागताः । निषेव्य तु महं दिव्यं भगवद्वीक्षणाप्लुताः ॥ ७५॥ कृतार्थाः सर्व एवैते प्रार्थयन्
    मधुसूदनम् । अहो महोत्सवो देव नेत्रानन्दः शरीरिणाम् ॥ ७६॥ अहो भाग्यमहो भाग्यं राज्ञस्तु मधुसूदन । लक्ष्मीपते
    वयं धन्याः श्रीमन् पङ्कजलोचन ॥ ७७॥ एवमेवात्र भवतादुत्सवः प्रतिवत्सरम् । उज्जीवनाय जगतां कृपया भवतो
    हरे ॥ ७८॥ मञ्जीरतटिनीतीर्थे नित्यं स्नातुं न शक्नुमः । अतः साप्यत्र नागाहगिरावाविर्भवत्विति ॥ ७९॥
    इत्थं विज्ञापितो विष्णुर्विप्रेन्द्रैः करुणानिधिः । भक्तेष्टदो वरं प्रादात् परमं कमलापतिः ॥ ८॥ तदैव
    नागाद्रितटे मञ्जीरतटिनी हरेः । आज्ञया प्रवहत्येषा जगतां पावनाय च ॥ ८१॥ नामाद्रावुदयात्सैव नागतीर्थमितीर्यते
    । तस्यां स्नात्वा तु ऋषयः परमां सिद्धिमागताः ॥ ८२॥ राजासौ मलयध्वजो वृषाङ्गरेर्नाथस्य लक्ष्मीपतेः श्रीनागाह्वगिरी
    महाद्भुतरसैरित्थं वसन्तोत्सवम् । चैत्रे मासि महोत्सवं भगवतः श्रीपौर्णमास्यां दिने कृत्वा तं सकुतूहलं
    वनगिरिं संप्रापयत् सुन्दरम् ॥ ८३॥ पद्मचन्द्रामृतरसप्रस्पर्धिमुखमण्डलम् । वृषाद्रितटगं वन्दे सदा सर्वाङ्गनुन्दरम्
    ॥ ८४॥ राज्ञा श्रीमलयध्वजेन महता देवैरगस्त्यादिभिः श्रीमच्चैत्रमहोत्सवो मुनिवरः प्रत्यब्दमत्यद्भुतम्
    । श्रीनागाइगिरावकारि तु पुरा श्रीसुन्दरस्य प्रभोः लावण्यान्बुनिर्वृषाचलपतेः क्षीराब्धिकन्यापतेः ॥
    ८५॥ इदानीन्तनतद्रीति कश्चिद्राजा करोत्यसौ । इत्येषा किंवदन्ती तु केनचिद्धेतुना कचित् ॥ ८६॥ इदानीन्तनचैत्रोत्सववैभवं
    फणामः कल्याणं दिशतादशेषजगतां राजाधिराजः श्रिया सार्धं दिव्यवृषाचले मणिमये सिंहासने सुस्थितः । मुक्तारत्नकिरीटकौस्तुभमुखैः
    श्रीभूषणभूषितः सर्वाभीष्टफलप्रदः प्रणमतां मोहङ्करः सुन्दरः ॥ ८७॥ वन्दे दिव्यसुवर्णनिर्मितमहाप्राकाररत्नोज्ज्वल
    सोमच्छन्दविमानगोपुरमणिस्तम्भोल्लसन्मण्टपैः । अन्यैश्चापि विलक्षणैर्मरतकस्थूणावृतैर्मण्टपै र्भान्तं
    श्रीवृषभाचलं मणिमयं त्रैलोक्यसम्भूषणम् ॥ ८८॥ सेनान्यप्रमुखैर्विलक्षणगुणैर्नित्यैः सदा संश्रितं ब्रह्मेशानमहेन्द्रमुख्यविबुधैरन्यैर्मनुष्यैर्जनैः
    । स्वस्वाभीष्टमहाफलात् परिनणतं योगीश्वरैः संस्तुतं तियग्जातिभिरावृतं वनगिरि गाङ्गेयरूपं भजे ॥ ८९॥
    चैत्रे पुष्पितवृक्षजातिनिवहे क्षेमङ्करे देहिनां मासे सर्वमनोज्ञषोडशकलापूर्णेन्दुसंलक्षिते । दिव्ये
    शुक्लचतुर्दशीशुभदिने संप्राप्तचोराकृतिः श्रीमान सुन्दरबाहुरिन्दुवदनस्तस्मात् प्रतस्थे गिरेः ॥ ९०॥
    चोराकारधरं सुवर्णकवचं शा दिदिव्यायुधं श्रीभूषासमलङ्कृतं मणिलसन्मुक्ताकिरीटोज्ज्वलम् । नानावर्णविचित्ररत्नकनकश्रीवाहने
    सुस्थितं चैत्रे मासि चतुर्दशीशुभदिने यान्तं भजे सुन्दरम् ॥ ९१॥ मध्येमार्गमहो समस्तजगतां मोहङ्करं सुन्दरं
    पश्यल्लोकरजःकणैर्दिनि भूचि प्रच्छादयन्तं जनान् । भेरीमुख्यविशेषवाद्यनिवहैः शब्दायमानं दिशो पन्दे सुन्दरबाङमबुजमुखं
    सन्तोषपूर्णाशयम् ॥ ९२॥ श्रीमद्वेगवतीमहोत्तरतटे लक्ष्मीपुरे मण्टपे मुक्तादामविराजिते दिलसिते सौवर्णसिंहासने
    । तिष्ठन्तं कनकप्रभं भुवि जनानाहादयन्तं मुदा श्रीभूषासमलड़कृतं वृषगिरे थं भजे सुन्दरम् ॥ ९३॥ तत्र
    श्रीमणिमण्टपे विलसिते विद्वज्जनैः संवृते।
