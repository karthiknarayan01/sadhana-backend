id: dasarathi-satakam
category: stotram
name:
  english: Dasarathi Satakam
content:
  english: sitadaladhama shamakshamadi shrim gara gunabhirama trija gannuta shaurya ramalalama du rvara
    kabandharakshasa vi rama jagajjana kalmasharnavo ttarakanama || ramavishala vikrama parajita bhargavarama
    sadguna stoma paranganavimukha suvrata kama vinila nirada shyama kakutdhsavamsha kalashambhudhisoma
    suraridorbhalo ddhama virama bhadragiri dayalasajghari vigata samastadosha triloka putakri dgaga nadhunimaranda
    padakanja vishesha maniprabha dhaga ddhagita vibhusha bhadragiri dasharathi karunapayonidhi vipatparamparo
    ttunga tamahpatanga dayantaranga sa tsanga dharatmaja hridaya sarasabhringa nishacarabjama tanga bhadragiri
    dasharathi karunapayonithi || shrida sanandanadi munisevita pada digantakirtisam pada samastabhuta
    paripala vinoda vishada valli ka ccheda dharadhinathakula sindhusudhamayapada nrittagi tadi vinoda
    bhadragiri dasharathi karunapayonidhi || aryula kèlla mròkkivina tangudanai raghunadha bhattara raryula
    kanjalètti kavi sattamulan vinutinci karya sau karya mèlarpanòkka shatakambòna gurci racintuneduta
    tparyamunan grahimpumidi dasharathi karunapayonidhi || masakòni rengubandlukunu mauktikamul vèlavosinatludu
    rvyasanamujèndi kavyamu duratmulakiccitimosa mayyè na rasanaku~ butavrittisuka rambuga jekurunatlu
    vaksudha rasamulucilka badyumukha rangamunandunatimpa vayyasam tasamu jèndi bhadragiri dasharathi
    karunapayonidhi || shriramaniyahara yatasi kusumabhasharira paratattvavihara triloka cetano dara duranta
    pataka vitana vidura kharadi daityakam tara kuthara bhadragiri dasharathi karunapayonidhi khara dushanakananavitihòtra
    caruvi sphuradaravindanetra vinilabhurikam dharasamagatra bhadragiri dasharathi karunapayonidhi ||
    kanakavishalacela bhavakanana shatakutharadhara sa jjanaparipalashila divijastuta sadguna kandakanda
    sam janita parakramakrama visharada sharada kandakunda cam dana ghanasara sarayasha dasharathi karunapayonidhi
    || shri raghuvamsha toyadhiki shitamayukhudavaina ni pavi trorupadabjamul vikasitotpala campaka vrittamadhuri
    puritavakprasunamula bujalònarcèda jittagimpumi tarakanama bhadragiri dasharathi karunapayonidhi ||
    gurutaramaina kavyarasa gumbhanakabbura mandimushkarul sarasulamadki santasila juludurotushashanka
    candrikam kuramula kindu kantamani kotisravincina bhangivindhyabhu dharamuna jaṟune shilalu dasharathi
    karunapayonidhi || taranikulesha nanudula dappulu galgina nidunama sa dviracitamaina kavyamu pavitramugadè
    viyannadijalam baragucuvankayaina malinakriti baṟina danmahatvamum daramè ganimpa nèvvariki dasharathi
    karunapayonidhi || darunapata kabdhiki sada badabagni bhavakulartivi staradavanalarciki sudharasavrishti
    duranta durmata carabhayanka rataviki jandakathorakutharadhara ni tarakanama mènnukòna dasharathi
    karunapayonidhi || harunaku navvibhishanunaka drijakum dirumantra rajamai kariki sahalyakum drupadakanyaku
    nartiharincucuttamai paraginayatti nipatita pavananamamu jihvapai niram taramu natimpajeyumika dasharathi
    karunapayonidhi || muppuna galakinkarulu mungitavaccina vela rogamul gòpparamainaco gaphamu kuttuka
    nindinavela mismarana galgunò galgadò nati kippude tappakacetu mibhajana dasharathi karunapayonidhi
    || paramadayanidhe patitapavananama hare yatancu su sdhiramatulai sadabhajana seyu mahatmula padadhuli
    na shiramunadaltumirataku jerakudancu yamundu kinkaro tkaramula kana bèttunata dasharathi karunapayonidhi
    || ajunaku tandrivayyu sanakadulakum baratattvamayyusa ddvijamunikotikèllabara detavayyu dineshavamsha
    bhu bhujulaku metivayyubari purnudavai vèligòndupakshira ddhvajamimu brastutincèdanu dasharathi karunapayonidhi
    || pandita rakshakum dakhila papavimòcanu dabjasambhava khandala pujitundu dashakantha vilunthana
    candakandako dandakala pravinudavu tavaka kirti vadhuti kittupu dandalu gaga na kavita dasharathi
    karunapayonidhi || shrirama sitagaga nijasevaka brindamu viravaishnava cara javambugaga virajanadi
    gautamiga vikuntha mu nnarayabhadra shailashikharagramugaga vasincu cetano ddharakudaina vishnudavu
    dasharathi karunapayonidhi || kanti naditatambubòdagantini bhadranagadhivasamun ganti nilatanujanuru
    karmuka marganashankhacakramul gantini mimmu lakshmanuni ganti kritardhuda naiti no jaga tkantaka
    daityanirdhalana dasharathi karunapayonidhi || halikunakun halagramuna nardhamu sekurubhangi dappice
    nalamata jènduvaniki surapagalo jala mabbinatlu du rmalina manovikariyagu martyuni nannòdagurci nipayin
    dalavu ghatimpajesitivè dasharathi karunapayonidhi || kònjakatarka vadamanu guddalice baratattvabhusdhalin
    ranjiladravvi kangònani ramanidhanamu nedu bhaktisi ddhanjanamanduhastagata mayyèbali yanaga madiyahri
    tkanjamunan vasimpumika dasharathi karunapayonidhi || ramu~du ghora pataka viramudu sadgunakalpavallika
    ramudu shadvikarajaya ramudu sadhujanavanavrato ddamu~du ramude parama daivamu makani mi yadungu gèm
    damarale bhujincèdanu dasharathi karunapayonidhi || cakkèramanivemudina jalinakaivadi manavadhamul
    pèkkuru òkka daivamula vemaṟugòlcèdaratla kadaya mròkkinaniku mròkkavalè moksha mòsangina nivayivalèm
    dakkinamata lemitiki dasharathi karunapayonidhi kalushambulèlla bayalambadadrocina ka vatamai dikòniprovucunikka
    manidhiyutulènna~dadiya varnamul gaikòni bhakti ce nuduva~ganaru gaka vipatparamparal dakònune jagajjanula
    dasharathi karunapayonidhi || ramahare kakutdhsakula ramahare raghuramaramashri ramahareyatancu madi
    ranjila bhekagalambulila ni namamu samsmarincina janambu bhavambèdabasi tatparam dhama nivasulaudurata
    dasharathi karunapayonidhi || cakkèra lappakun migula javvani kènjiguraku movikim jòkkapujunti teniyaku
    jòkkulucungana leru gaka ne dakkata ramanamamadhu ramritamanutakantè saukhyama takkinamadhuri mahima
    dasharathi karunapayonidhi || andajavaha ninnu hridayambunanammina vari papamul kòndalavantivaina
    vèsaguli nashimpaka yunnè santa ta khandalavaibhavonnatulu galgakamanunè moksha lakshmikai dandayòsangakunnè
    tuda dasharathi karunapayonidhi || cikkanipalapai misimi jèndina migada pancadarato mèkkinabhangi
    mivimala mecakarupa sudharasambu na makkuva pallerambuna samahita dasyamu netido yitan dakkènatancu
    jurrèdanu dasharathi karunapayonidhi || sirulidasita pidalèga jimmutakun hanumantudartiso darudu sumitrasuti
    duritambulumanupa rama namamum garunadalirpa manavulagavaga bannina vajrapanjaro tkaramugada bhavanmahima
    dasharathi karunapayonidhi || halikulishankushadhvaja sharasana shankharathanga kalpako jvalajalajata
    rekhalanu samshamulai kanupattucunna mi kalitapadambuja dvayamu gautamapatni kòsanginatlu na talapuna
    jercikavagadè dasharathi karunapayonidhi || jalanidhilonaduṟi kula shailamumiti dharitrigòmmunam dalavadamatirakkasuni
    yangamugitibalindrunin rasa talamunamati pardhivaka dambamuguṟcina metirama na talapunanati ragadavè
    dasharathi karunapayonidhi || bhandana bhimuda rtajana bandhavudujjvala banatunako dandakalapracanda
    bhuja tandavakirtiki ramamurtikin rèndava satidaivamika ledanucun gadagatti bherika danda dadanda
    danda ninadambu lajandamuninda mattave dandamu nèkki catèdanu dasharathi karunapayonidhi || avanija
    kannudoyi tògalandu vèlingèdu soma janaki kuvalayanetra gabbicanukòndala nundu ghanamba maidhili navanava
    yauvanambanu vanambukun madadanti vivèka davili bhajintu nèllapudu dasharathi karunapayonidhi || kharakaravamshaja
    vinu mukhandita bhutapishacadhakini jvara paritapasarpabhaya varakamaina bhavatpadabja ni spura duruvajrapanjaramujòcciti
    niyèda dina manavo dhdhara birudanka memaṟuku dasharathi karunapayonidhi || jurrèdamika thamritamu
    jurrèdamipadakanjato yamun jurrèda ramanamamuna jòbbilucunna sudharasamba ne jurrèda jurrujurru~ga
    rucul ganuvaripadambu gurpave turrulatodi pòttidaka dasharathi karunapayonidhi || ghorakritanta virabhata
    kotiki gundèdigul daridrata karapishaca samharana karyavinodi vikuntha mandira dvara kavata bhedi
    nijadasa janavalikèlla pròddu ni tarakanama mènnukòna dasharathi karunapayonidhi || vinnapamalakincu
    raghuvira nahipratilokamandu na kannaduratmudum barama karunikottama velpulandu ni kanna mahatmudum
    batita kalmashadurudu ledunakuvi dvannuta nivènaku gati dasharathi karunapayonidhi || pèmpuna~dallivai
    kalusha brindasamagama mòndukundu ra kshimpanudandrivai mèyu vasincudu shendriya rogamul niva rimpanu
    vèjjavai kripa guṟinci parambu dirabuga~ga sa tsampadaliya nivègati dasharathi karunapayonidhi ||
    kukshinajandapam ktulòna gurci caracarajantukoti sam rakshanaseyu tandrivi parampara ni tanayundanaina
    na pakshamu nivugavaladè papamu lènni yònarcinan jaga drakshaka kartavivèkada dasharathi karunapayonidhi
    || gaddariyo gihritkamala gandhara sanubhavambu~jèndu pè nniddavu gandu~ de~ti tharanisuta kau~gilipanjarambunan
    muddulugulku raciluka muktinidhanamuramara~gade taddayu ne~du nakadaku dasharathi karunapayonidhi
    || kaliyuga martyakotininu gangòna ranividhambo bhaktava tsalatavahimpavo catula sandravipaddasha
    vardhi grunkuco bilicina balka vintamaṟapi narulitlanaradu gaka ni talapuna ledè sita cèṟa dasharathi
    karunapayonidhi || janavara mika thali vinasai~paka karnamulandu ghantika ninada vinodamul sulupunicunakun
    varamiccinavu ni nnanayamunammi kòlcina mahatmunakemi yòsangu dosanam dananuta makòsangumaya dasharathi
    karunapayonidhi || papamu lònduvela ranapannaga bhuta bhayajvaradulan dapada nònduvela bharatagraja
    mimmu bhajincuvarikin brapuga nivudammu dirupakkiyalan jani tadvitti sam tapamu mampi katurata dasharathi
    karunapayonidhi || aganita janmakarmaduri tambudhilo bahuduhkhavicikal dègipadavidaleka jagatidhara
    nipadabhakti navace dagili tarimpagoriti badampabadi nadu bhayambhu mampave tagadani cittamam didaka
    dasharathi karunapayonidhi || nenònarincu papamula nekamulainanu nadujihvakum banakamayyèmiparama
    pavananamamudònti cilkara mananugavumanna tudi mataku sadgati jèndègavunan dani dharimpagorèdanu dasharathi
    karunapayonidhi || paradhanamul harinci parabhamalananti paranna mabbinan muripama kanimi~danagu mosamèṟungadu
    manasambu staramadikalakinkara gadahati palpadanika mammu nedu taṟidarijerci kacèdavò dasharathi karunapayonidhi
    || cesiti ghorakrityamulu cesiti bhagavatapacaramul cesiti nanyadaivamula~ jeri bhajincina varipòndu
    ne~ jesina neramul dala~ci cikkula~bèttakumayyayayya ni dasu~danayya bhadragiri dasharathi karunapayonidhi
    || parula dhanambu~jucipara bhamalajuci harimpagoru ma dgurutaramanasam banèdu dònganubattinirudhadasya
    vi sphuritaviveka pashamula~ jutti bhavaccaranambane maru ttaruvunagattiveyaga dè dasharathi karunapayonidhi
    || salalita ramanama japasara mèṟunganu gashikapuri nilayudaganumicarana nirajarenu mahaprabhavamum
    dèliyanahalyaganu jagativara nidagu satyavakyamum dalapaga ravanasuruni tammudaganu bhavadvilasamul
    dalacinutimpa nataramè dasharathi karunapayonidhi || patakulaina mikripaku batrulu karètalancicuda
    ja tratikigalgè bavana maratiki rajyasukhambugalgè du rjatiki bunyamabbègapi jatimahattvamunòndègavunam
    datava yèttivaralaku dasharathi karunapayonidhi || mamaka pataka vajramu mrampanaganyamu citraguptule
    yemani vraturo kalakinkara stoma mònarcitemò vinajòppada dintakamunnèdinacim tamani yòtlu gacèdavò
    dasharathi karunapayonidhi || dasina cuttuma shabari dani dayamati nelinavu guhudu tavakadasya mòsanginavu
    ne jesina papamo vinuti cesinagavavu gavumayya ni dasulalona nenòka~da dasharathi karunapayonidhi
    || dikshavahinci nakòladi dinula nèndaṟi gacito jaga drakshaka tòlliya drupada rajatanuja talancinantane
    yakshayamaina valvalidi takkata namòṟajittaginci pratyakshamu gavavemitiki dasharathi karunapayonidhi
    || nilaghanabhamurtivagu ninnu ganungònikori vedinan jalamusesi dagèdavu samstuti kèkkina ramanama
    me mulanu dacukogalavu muktiki brapadi papamulaku ddalamugadè mayèdala dasharathi karunapayonidhi
    || valadu paraku bhaktajanavatsala ni caritambu vammuga valadu paraku nibirudu vajramuvantidi gana
    kurake valadu paraku nadurita vardhiki dèppavuga manambulo dalatumèka nirantaramu dasharathi karunapayonidhi
    || tappulèṟunga leka duritambulu sesitinanti nivuma yappavugavu manti nikananyulakun nudurantanantini
    kòppidamaina dasajanu lòppina bantuku batavanti na tappula kèlla nivègati dasharathi karunapayonidhi
    || itadu duratmudancujanu lènna~ga naṟadi~gòntinenèpo patitu~da nantino patita pavanamurtivi nivugalla
    ne nitirula ve~dananti niha miccinanimmuparambòsangumi yatulita ramanama madhu rakshara palinirantaram
    bahri dgatamani nammikòlcèdanu dasharathi karunapayonidhi || ancitamainanidu karunamritasaramu nadupaini
    bro kshincina jaludananira sincèdanaduritambu lèlladu lincèda vairivarga mèdalincèda gorkulanidubantanai
    dancèda galakinkarula dasharathi karunapayonidhi || jalanidhu ledunòkka mògi~ jakkikidèccèsharambu
    ṟatinim palara~ga jesènatiga~ba dabjaparagamu ni caritramum jalajabhavadi nirjarulu sannuti seya~ga
    leru gavunam dalapanaganyamayya yidi dasharathi karunapayonidhi || kotikishakyama yasurakotula gèlvanu
    galcèbo nijam batanimena shitakarudauta davanalu dèttivinta ma sitapativrata mahimasevaku bhagyamumikatakshamu
    dhataku shakyama pògada dasharathi karunapayonidhi || bhupalalama ramaraghupungavarama triloka rajya
    sam sdhapanarama mokshaphala dayaka rama madiya papamul papagadayyarama ninu brastuti cesèdanayyarama
    si tapatirama bhadragiri dasarathi karunapayonidhi || nisahajambu satvikamu nividipattu sudhapayodhi
    pa dmasanudatmajundu gamalalayani priyuralu niku sim hasanamiddharitri gòdugaka samakshulu candrabaskarul
    nisumatalpamadiphani nivè samastamu gòlcinatti ni dasula bhagyamèttidaya dasharathi karunapayonidhi
    || caranamu sokinatti shilajavvanirupagu tòkkavinta su sdhiramuga nitipai girulu delina dòkkati vintagani
    mi smarana danarcumanavulu sadgati jèndina dèntavinta yi dharanu dharatmajaramana dasharathi karunapayonidhi
    || daivamu tallidandritagu data gurundu sakhundu ninnè ka bhavana seyucunnataṟi papamulèlla manovikara
    du rbhavitujeyucunnavikripamativainanu kavumi jaga tpavanamurti bhadragiri dasharathi karunapayonidhi
    || vasava rajyabhoga sukha vardhini delu prabhutvamabbina yasakumera ledu kanakadrisamana dhanambugurcinam
    gasunu vèntaradu kani kanaka cesina punyapapamul visarabova nivu padivelaku jalu bhavambunòlla ni
    dasunigaga nelukònu dasharathi karunapayonidhi || surijanul dayaparulu sunritavadu lalubdhamanavul
    verapatipratanganalu viprulu govulu vedamul maha bharamudalpaga janulu pavanamaina paropakara sa tkara
    mèṟungule rakata dasharathi karunapayonidhi || varicaravataramu varidhilo jòṟabaṟi krodha vi staragudaina
    ya nigamataskaravira nishacarendrunim jeri vadhinci vedamula cikkèdalinci virinciki maho darataniccitivègada
    dasharathi karunapayonidhi || karamanura ktimandaramu gavvamuga nahirajudraduga dòrakòna devadanavulu
    dugdhapayodhimathincucunnaco dharanicalimpalokamulu talladamandaga gurmamai dhara dharamu dharincitivèkada
    dasharathi karunapayonidhi || dharuni japajuttina vidhambunagaikòni hemanetruda vvaridhilonadaginanu
    vanivadhinci varahamurtivai dharunidòntikai vadini dakshinashringamuna dharinci vi stara mònarcitive
    kada dasharathi karunapayonidhi || pètapètanukku kambamuna bhikaradanta nakhantara prabha patalamu
    gappa nuppatili bhandanavidhi nrisimhabhikara sphutapatushakti hemakashipu vidalinci suraripatti nam
    tatagripajucitivèkada dasharathi karunapayonidhi || padayugalambu bhugagana bhagamula vèsanuni vikrama
    spadamagunabbalindrunòka padamunandala krindanòttime lòdavajagattrayambu buru hutunikiyyavatundavainaci
    tsadamalamurti vivèkada dasharathi karunapayonidhi || iruvadiyòkkamaṟu dharanishula nèllavadhinci
    tatkale bara rudhira pravahamuna baitrikatarpana mòppajesi bhu suravarakotiki mudamu sòppada bhargavaramamurtivai
    dharaninòsangiti vèkada dasharathi karunapayonidhi || duramuna datakandunimi dhurjativil dunumadisitanum
    barinayamandi tandripanupa ghana kananabhumi kegi du starapatucanda kandakulishahati ravanakumbhakarna
    bhu dharamula gulciti vèkada dasharathi karunapayonidhi || anupamayadavanvayasu dhabdhisudhanidhi
    krishnamurtini kanujudugajaninci kujanavalinèlla nadanci rohini tanayudananga bahubala darpamuna balarama
    murtivai tanarina velpavivèkada dasharathi karunapayonidhi || suralunutimpaga dripura sundarula variyimpabuddharu
    parayaga dalcitivu tripurasurakoti dahincunappuda harunakudoduga varasha rasana banamukho grasadhano
    tkara mònarincitivukada dasharathi karunapayonidhi || sankaradurgamai durita sankulamaina jagambujuci
    sa rvankashalila nu ttama turangamunèkki karasibuni vi rankavilasa mòppa gali kakrita sajjanakotiki
    nira tanka mònarcitivukada dasharathi karunapayonidhi || manamunanuhaposhanalu marvakamunnè kaphadirogamul
    danuvunananti menibigi dappakamunnènarundu moksha sa dhana mònarimpa~gavalayu~ dattvavicaramu maniyunduta
    ltanuvunaku virodhamidi dasharathi karunapayonidhi || mudamuna katapattubhava mohamadva diradankushambu
    sam padala kòtaru korikala panta parambuna kadi vairula nnadana jayincutrova vipadabdhikinavagada
    sadabhava tsadamalanamasamsmarana dasharathi karunapayonidhi || durita latanusara bhaya duhkha kadambamu
    ramanamabhi karatala hetice~ dègi vakavakalai canakunda nercune darikòni manducundu shikha darkònina
    shalabadikitako tkaramu vilinamaicanavè dasharathi karunapayonidhi || haripadabhaktinindriyaja yanvituduttamu~dindrimambulan
    marugaka nilpanudinanu madhyamu~dindriyaparashyudai paraginaco nikrishtudani palkaga durmatinaina
    nannu na daramuna nètlukacèdavò dasharathi karunapayonidhi || vanakaricikku mainasaku pacavikim jèdipoyè
    minuta vinikiki~jikkè~jilvaganu ve~duṟu~ jèndènu lellu tavilo manikinashincè detitara mayirumu~tini
    gèlvanai dusa dhanamulani vè kavanagu dasharathi karunapayonidhi || karamulumikumròkkulida kannulu
    mimmunè cuda jihva mi smaranadanarpavinulubha vatkathalan vinucundanasa mi yaṟutunu bèttupusarula
    kasagònam baramartha sadhano tkaramidi ceyavekripanu dasharathi karunapayonidhi || ciratarabhakti
    nòkkatulasidala marpana ceyuvadu khe caragaru doraga pramukha sanghamulo vèlugan sadha bhavat surucira
    dhinda padamula bujalònarcina varikèllada tpara maracetidhatrigada dasharathi karunapayonidhi || bhanudu
    turpunanduganu puttina~ bavaka candra tejamul hinata jèndinatlu jagadeka virajitamaina ni pada dhyanamu
    ceyucunna~ bara daivamariculadangakundu ne danava garva nirdalana dasharathi karunapayonidhi || nimahaniyatattva
    rasa nirna yabodha kathamritabdhilo damunugrunkuladakavri thatanukashtamujèndi manavum di mahilokatirthamula
    nèlla muningina durvikara hri tamasapankamul vidunè dasharathi karunapayonidhi || nimahaniyatattva
    rasa nirna yabodha kathamritabdhilo damunugrunkuladakavri thatanukashtamujèndi manavum di mahilokatirthamula
    nèlla muningina durvikara hri tamasapankamul vidunè dasharathi karunapayonidhi || kancana vastusankalita
    kalmasha magni putambu bèttèva rincinariti natmanigidincina dushkara durmalatrayam bancita bha ktiyoga
    daha narci~dagulpaka payune kana tkancanakundalabharana dasharathi karunapayonidhi || nisati pèkku
    galmulidanerpiri loka makalmashambuga nisuta seyu pavanamu nirmita karyadhurina dakshudai nisutudiccu
    nayuvulu ninna bhujincina~ galgakundune dasulakipsi tarthamula dasharathi karunapayonidhi || varijapatramandidina
