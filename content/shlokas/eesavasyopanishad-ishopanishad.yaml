id: eesavasyopanishad-ishopanishad
category: stotram
name:
  english: Eesavasyopanishad (Ishopanishad)
content:
  english: mpurnamadah purnamida mpurnatpurnamudacyate | purnasya purnamadaya purnamevavashishyate ||
    om shanti shshantih || om isha vasyamidagm sarvam njagat | tena tyaktena bhunjitha ma gridhah kasyasviddhanam
    || kurvanneveha karma ni jijivisheccatagm samah 'sti na karma lipyate nare || asurya nama te loka
    andhena tamasa ''vritah | tagmste pretyabhigacchanti ye ke ca jati tannejati taddure tadvantike |
    tadantarasya sarvasya tadu sarvasyasya bahyatah || ni bhutanyatmanyevanupashyati | sarvabhuteshu catmana
    ntato na vihugupsate || ni bhutanyatmaivabhu dvijanatah | tatra ko mohah ka shshokah ekatvamanupashyatah
    || || sa paryagaccukramakayamavranamasnaviragm shuddhamapa paviddham | kavirmanishi paribhu 'rthan
    vyadadhacchashvatibhya ntamah pravishanti ye 'vidyamupasate | tato bhuya iva te tamo ya u vidyaya
    huravidyaya | iti shushruma dhira ye~ nastadvicacakshire || nca yastadvedobhayagm saha | avidyaya
    mrityu ntirtva vidyaya ntamah pravishanti ye bhutimupasate | tato bhuya iva te tamo ya u sambhu bhavat
    | iti shushruma dhira ye~ nastadvicacakshire || nca yastadvedobhayagm saha | vinashena mrityu || vayuranilamamritamatheda
    ntagm shariram | om krato smara kritagm smara krato smara kritagm smara || raye asman vishvani deva
    vayanani vidvan | yuyodhyasmajjuhuranameno bhuyishta mpurnamadah purnamida mpurnatpurnamudacyate |
    purnasya purnamadaya purnamevavashishyate || om shanti
  devanagari: म्पूर्ण॒मदः॒ पूर्ण॒मिद॒ म्पूर्णा॒त्पूर्ण॒मुद॒च्यते । पूर्ण॒स्य पूर्ण॒मादा॒य पूर्ण॒मेवावशि॒ष्यते
    ॥ ॐ शान्ति॒ श्शान्तिः॑ ॥ ॐ ई॒शा वा॒स्य॑मि॒दग्ं सर्वं॒ ञ्जग॑त् । तेन॑ त्य॒क्तेन॑ भुञ्जीथा॒ मा गृ॑धः॒
    कस्य॑स्वि॒द्धनम् ॥ कु॒र्वन्ने॒वेह कर्मा णि जिजीवि॒षेच्च॒तग्ं समाः ऽस्ति॒ न कर्म॑ लिप्यते॑ नरे ॥ अ॒सु॒र्या॒
    नाम॒ ते लो॒का अ॒न्धेन॒ तम॒सा ऽऽवृ॑ताः । ताग्ंस्ते प्रेत्या॒भिग॑च्छन्ति॒ ये के चा जति॒ तन्नेज॑ति॒ तद्दू॒रे
    तद्व॑न्ति॒के । तद॒न्तर॑स्य॒ सर्व॑स्य॒ तदु॒ सर्व॑स्यास्य बाह्य॒तः ॥ णि भू॒तान्या॒त्मन्ये॒वानु॒पश्य॑ति
    । स॒र्व॒भू॒तेषु॑ चा॒त्मान॒ न्ततो॒ न विहु॑गुप्सते ॥ णि भू॒तान्या॒त्मैवाभू द्विजान॒तः । तत्र॒ को मोहः॒
    क श्शोकः॑ एक॒त्वम॑नु॒पश्य॑तः ॥ ॥ स पर्य॑गाच्चु॒क्रम॑का॒यम॑व्रण॒म॑स्नावि॒रग्ं शु॒द्धमपा पविद्धम् ।
    क॒विर्म॑नी॒षी प॑रि॒भू ऽर्था॒न् व्य॑दधाच्छाश्व॒तीभ्य॒ न्तमः॒ प्रवि॑शन्ति॒ ये ऽवि॑द्यामु॒पास॑ते । ततो॒
    भूय॑ इव॒ ते तमो॒ य उ॑ वि॒द्याया हु॒रवि॑द्यया । इति॑ शुश्रुम॒ धीरा येँ न॒स्तद्वि॑चचक्षि॒रे ॥ ञ्च॒ यस्तद्वेदो॒भय॑ग्ं
    स॒ह । अवि॑द्यया मृ॒त्यु न्ती॒र्त्वा वि॒द्यया न्तमः॒ प्रवि॑शन्ति॒ ये भूतिमु॒पास॑ते । ततो॒ भूय॑ इव॒
    ते तमो॒ य उ॒ सम्भू भवात् । इति॑ शुश्रुम॒ धीरा येँ न॒स्तद्वि॑चचक्षि॒रे ॥ ञ्च॒ यस्तद्वेदो॒भय॑ग्ं स॒ह
    । वि॒ना॒शेन॑ मृ॒त्यु ॥ वा॒युरनि॑लम॒मृत॒मथेद न्त॒ग्ं॒ शरी॑रम् । ॐ क्रतो॒ स्मर॑ कृ॒तग्ं स्म॑र॒ क्रतो॒
    स्मर॑ कृ॒तग्ं स्म॑र ॥ रा॒ये अ॒स्मान् विश्वा॑नि देव व॒यना॑नि वि॒द्वान् । यु॒यो॒ध्य॒स्मज्जु॑हुरा॒णमेनो॒
    भूयि॑ष्टा म्पूर्ण॒मदः॒ पूर्ण॒मिद॒ म्पूर्णा॒त्पूर्ण॒मुद॒च्यते । पूर्ण॒स्य पूर्ण॒मादा॒य पूर्ण॒मेवावशि॒ष्यते
    ॥ ॐ शान्ति॒
