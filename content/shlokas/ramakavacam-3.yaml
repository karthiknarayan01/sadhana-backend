id: ramakavacam-3
category: kavacha
name:
  english: ramakavacam 3
  devanagari: रामकवचम् ३
content:
  english: shriramakavacam kapikatakadhurinah karmukanyastabanah kshapitaditijasainyah kshatriyeshvagraganyah
    | jaladhiracitaseturjanakitoshahetuh pathi pathi gunasandrah patu mam ramacandrah || 1|| shrimatkiritavibhrajishira
    ramah shiro'vatu | kutilalakasamshobhilalatantah surarthitah || 2|| manikyamauktikodbhasitilakah suryavamshajah
    | lalatam patu subhurme kausalyanandano bhruvau || 3|| dhanurvidyaparadrishva netre patvabjalocanah
    | lasannasaputo nasam vishvamitravrito'vatu || 4|| bimboshtho'vyanmadiyaushthau shambhukarmukabhanjanah
    | kundakoshalasaddanto dantanme janakipatih || 5|| manojnarasano jihvam patu lokamayantakrit | vacam
    vyakhyavidagdho'vyacyaktasamrajyasambhramah || 6|| asyam candropamasyo'vyadramacandro vanecarah |
    kambugrivo'vatu grivam kharadushanasainyajit || 7|| carudirghakarah pani maricamrigalubdhakah | kankanangadamudradhayo'ngulistyaktapriyakritih
    || 8|| patu pinamsayugmo'sau hanumannayanotsavah | harakaustubhabhritkanthamulam sugrivasakhyakrit
    || 9|| urah patu mahoraskah talatmasurakhandanah | madhyam krishalasanmadhyah patu valyangabhedanah
    || 10|| darbhashayi vibhuh patu valistrivalipallavah | tanudarah patu kukshim kritaseturmaharnave
    || 11|| nimnanabhih prabhuh patu nabhim kapicamupatih | pitambarah sphuratkancidyotamanakatidvayah
    || 12|| nkaprakaranirbhedi ramah pata katim mama | uru karikarorurme carubanadhanurdharah || 13||
    jrimbhiravanasainyabdhikumbhasambhavakotidhuh | januni vrittavilasajjanuyugmo mamavatu || 14|| kambhakarnadinirbhangadambhoḻasamasayakah
    | jandhe tungebhadantabhajanghayugmo'vatu prabhuh || 15|| dashananashiroranyaparashvadhaparakramah
    | muktankurasamashrimadgulphom gulphau mamavatu || 16|| sasambhramasurashrenishirojushtandhripallavah
    | padau rakshatu me nityam vibhishanapadapradah || 17|| nakhan patu nakhashrenishashidyotitadinmukhah
    | agnijvaloditasviyasito vitacchidakritih || 18|| raktapadataladityah patu padatale mama | praptayodhyapuraishvaryah
    pracyam patu manoramah || 19|| dharmapravartakah payadavacyam niradadyutih | patu praticyam yajvindro
    hanumatparameshthayadah || 20|| udicyamudgatayogavidehatanayapriyah | adho'dhahkritapapaighah patu
    ramo'khilagranih || 21|| urdhvamunnitasajjivananasanghasukhapradah | ya idam raghunathasya kavacam
    bibhriyannarah || 22|| yatina vadirajena racitam nirmalam dridham | sprashtum tam naiva rakshamsi
    papani ripavo'pi va || 23|| vipado vyadhayo va'pi shaknuvanti sharopamah | arim jitva tu samsaram
    yasyatyante'punarbhavam || 24|| iti shrimadvadirajapujyacaranaviracitam shriramakavacam sampurnam
    | bharatiramanamukhyapranantargata shrikrishnarpanamastu |
  devanagari: श्रीरामकवचम् कपिकटकधुरीणः कार्मुकन्यस्तबाणः क्षपितदितिजसैन्यः क्षत्रियेष्वग्रगण्यः । जलधिरचितसेतुर्जानकीतोषहेतुः
    पथि पथि गुणसान्द्रः पातु मां रामचन्द्रः ॥ १॥ श्रीमत्किरीटविभ्राजिशिरा रामः शिरोऽवतु । कुटिलालकसंशोभिललाटान्तः
    सुरार्थितः ॥ २॥ माणिक्यमौक्तिकोद्भासितिलकः सूर्यवंशजः । ललाटं पातु सुभूर्मे कौसल्यानन्दनो भ्रूवौ ॥
    ३॥ धनुर्विद्यापारदृश्वा नेत्रे पात्वब्जलोचनः । लसन्नासापुटो नासां विश्वामित्रवृतोऽवतु ॥ ४॥ बिम्बोष्ठोऽव्यान्मदीयौष्ठौ
    शम्भुकार्मुकभञ्जनः । कुन्दकोशलसद्दन्तो दन्तान्मे जानकीपतिः ॥ ५॥ मनोज्ञरसनो जिह्वां पातु लोकमयान्तकृत्
    । वाचं व्याख्याविदग्धोऽव्याच्यक्तसाम्राज्यसम्भ्रमः ॥ ६॥ आस्यं चन्द्रोपमास्योऽव्याद्रामचन्द्रो वनेचरः
    । कम्बुग्रीवोऽवतु ग्रीवां खरदूषणसैन्यजित् ॥ ७॥ चारुदीर्घकरः पाणी मारीचमृगलुब्धकः । कङ्कणाङ्गदमुद्राढयोऽङ्गुलीस्त्यक्तप्रियाकृतिः
    ॥ ८॥ पातु पीनांसयुग्मोऽसौ हनूमन्नयनोत्सवः । हारकौस्तुभभृत्कण्ठमूलं सुग्रीवसख्यकृत् ॥ ९॥ उरः पातु महोरस्कः
    तालात्मासुरखण्डनः । मध्यं कृशलसन्मध्यः पातु वाल्यङ्गभेदनः ॥ १०॥ दर्भशायी विभुः पातु वलीस्त्रिवलिपल्लवः
    । तनुदरः पातु कुक्षिं कृतसेतुर्महार्णवे ॥ ११॥ निम्ननाभिः प्रभुः पातु नाभिं कपिचमूपतिः । पीताम्बरः
    स्फुरत्काञ्चीद्योतमानकटिद्वयः ॥ १२॥ ङ्काप्राकारनिर्भेदी रामः पात कटिं मम । ऊरू करिकरोरुर्मे चारुबाणधनुर्धरः
    ॥ १३॥ जृम्भिरावणसैन्याब्धिकुम्भसम्भवकोटिधूः । जानुनी वृत्तविलसज्जानुयुग्मो ममावतु ॥ १४॥ कम्भकर्णादिनिर्भङ्गदम्भोळासमसायकः
    । जङ्धे तुङ्गेभदन्ताभजङ्घायुग्मोऽवतु प्रभुः ॥ १५॥ दशाननशिरोरण्यपरश्वधपराक्रमः । मुक्ताङ्कुरसमश्रीमद्गुल्फों
    गुल्फौ ममावतु ॥ १६॥ ससम्भ्रमसुरश्रेणीशिरोजुष्टाङ्ध्रिपल्लवः । पादौ रक्षतु मे नित्यं विभीषणपदप्रदः
    ॥ १७॥ नखान् पातु नखश्रेणीशशिद्योतितदिङ्मुखः । अग्निज्वालोदितस्वीयसीतो वीतच्छिदाकृतिः ॥ १८॥ रक्तपादतलादित्यः
    पातु पादतले मम । प्राप्तायोध्यापुरैश्वर्यः प्राच्यां पातु मनोरमः ॥ १९॥ धर्मप्रवर्तकः पायादवाच्यां
    नीरदद्युतिः । पातु प्रतीच्यां यज्वीन्द्रो हनूमत्पारमेष्ठयदः ॥ २०॥ उदीच्यामुद्गतायोगविदेहतनयाप्रियः
    । अधोऽधःकृतपापैघः पातु रामोऽखिलाग्रणीः ॥ २१॥ ऊर्ध्वमुन्नीतसज्जीवनानासङ्घसुखप्रदः । य इदं रघुनाथस्य
    कवचं बिभृयान्नरः ॥ २२॥ यतिना वादिराजेन रचितं निर्मलं दृढम् । स्प्रष्टुं तं नैव रक्षांसि पापानि रिपवोऽपि
    वा ॥ २३॥ विपदो व्याधयो वाऽपि शक्नुवन्ति शरोपमाः । अरिं जित्वा तु संसारं यास्यत्यन्तेऽपुनर्भवम् ॥ २४॥
    इति श्रीमद्वादिराजपूज्यचरणविरचितं श्रीरामकवचं सम्पूर्णम् । भारतीरमणमुख्यप्राणान्तर्गत श्रीकृष्णार्पणमस्तु
    ।
