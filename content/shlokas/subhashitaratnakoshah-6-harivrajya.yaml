id: subhashitaratnakoshah-6-harivrajya
category: subhashita
name:
  english: subhashitaratnakoshah/6 harivrajya
  devanagari: सुभाषितरत्नकोशः/६ हरिव्रज्या
content:
  english: purushottamadevasya kim kim simhas tatah kim narasadrishavapur deva citram grihito naivam tat
    ko 'tra jiva drutam upanaya tam nanv ayam prapta eva
  devanagari: पुरुषोत्तमदेवस्य किं किं सिंहस् ततः किं नरसदृशवपुर् देव चित्रं गृहीतो नैवं तत् को ऽत्र जीव
    द्रुतम् उपनय तं नन्व् अयं प्राप्त एव
meaning: {}
source_attribution:
  text_source: Sanskrit Wikisource — https://sa.wikisource.org/wiki/सुभाषितरत्नकोशः/६_हरिव्रज्या
