id: kayasthakritamsuryastotram-25
category: stotram
name:
  english: kayasthakritamsuryastotram 25
  devanagari: कायस्थकृतंसूर्यस्तोत्रम् २५
content:
  english: kayasthakritam suryastotram 25 manye suryah svayam narayano me kripaya'dbhutah || 49|| prakashamagatastvatra
    bhaktanugrahakarakah | namah sahasrarupaya namah sahasrarashmaye || 50|| namo bhaktakripakartre namah
    sahasracakshushe | namo jagatprakashaya sarvabhutapracakshushe || 51|| parabrahmasvarupaya mokshadatre
    namo namah | namastejo'bhihantre ca rogahantre namo namah || 52|| ityuktva nipapata'savurjavrato'sya
    padayoh | iti shrilakshminarayaniyasamhita | khanda 2| adhyaya 263
  devanagari: कायस्थकृतं सूर्यस्तोत्रम् २५ मन्ये सूर्यः स्वयं नारायणो मे कृपयाऽद्भुतः ॥ ४९॥ प्रकाशमागतस्त्वत्र
    भक्तानुग्रहकारकः । नमः सहस्ररूपाय नमः सहस्ररश्मये ॥ ५०॥ नमो भक्तकृपाकर्त्रे नमः सहस्रचक्षुषे । नमो
    जगत्प्रकाशाय सर्वभूतप्रचक्षुषे ॥ ५१॥ परब्रह्मस्वरूपाय मोक्षदात्रे नमो नमः । नमस्तेजोऽभिहन्त्रे च रोगहन्त्रे
    नमो नमः ॥ ५२॥ इत्युक्त्वा निपपाताऽसावूर्जव्रतोऽस्य पादयोः । इति श्रीलक्ष्मीनारायणीयसंहिता । खण्ड २।
    अध्याय २६३
meaning: {}
