id: agastyakritamrudranistotram
category: stotram
name:
  english: agastyakritamrudranistotram
  devanagari: अगस्त्यकृतंरुद्राणीस्तोत्रम्
content:
  english: agastyakritam rudranistotram agastya uvaca | amba jrimbhatkripapure durikritaparabhave | bhavabhanjani
    rudrani prasida mama shambhavi || 30|| yantvamahuh sada matah cirantanagiram tatih | aksharamaksharakaram
    adyamide puratanim || 31|| mahamatarasambhavyakarmakalavikalpane || 33|| kalakalitamaryade tubhyam
    devyai namo namah || 34|| ekamanekamekastham shokapayam niramayim | tvamahuh shrutayo vacam tantvamantarupasmahe
    || 35|| stutyam satyam param prapya dhyeyamarcyamaharnisham || 36|| yanmahastarunirupam srotamaradhaye
    purah || 37|| mayyananyagate matah prasida paradevate | prasida vishvajanani prasida pranavatmike
    || 38|| vibhaktananavidhacakrakone panisthalalankritapancabane | prapannasantanalate prasida prakrishtapashankushapadmahaste
    || 39|| matah prasida malayacalapadmapithe mayavisheshakalaya racitaprapance | pancaprapanceshvaramancasamsthe
    mahyam mahah kalpaya matarashu || 40|| iti tamraparnimahatmye dashamadhyayantargatam agastyakritam
    rudranistotram sampurnam | tamraparnimahatmya | adhyaya 10
  devanagari: अगस्त्यकृतं रुद्राणीस्तोत्रम् अगस्त्य उवाच । अम्ब जृम्भत्कृपापूरे दूरीकृतपराभवे । भवभञ्जनि
    रुद्राणि प्रसीद मम शाम्भवि ॥ ३०॥ यान्त्वामाहुः सदा मातः चिरन्तनगिरां ततिः । अक्षरामक्षराकारां आद्यामीडे
    पुरातनीम् ॥ ३१॥ महामातरसम्भाव्यकर्मकालविकल्पने ॥ ३३॥ कलाकलितमर्यादे तुभ्यं देव्यै नमो नमः ॥ ३४॥ एकामनेकामेकस्थां
    शोकापायां निरामयीम् । त्वामाहुः श्रुतयो वाचां तान्त्वामन्तरुपास्महे ॥ ३५॥ स्तुत्यं सत्यं परं प्राप्य
    ध्येयमर्च्यमहर्निशम् ॥ ३६॥ यन्महस्तरुणीरूपं स्रोतामाराधये पुरः ॥ ३७॥ मय्यनन्यगते मातः प्रसीद परदेवते
    । प्रसीद विश्वजननि प्रसीद प्रणवात्मिके ॥ ३८॥ विभक्तननाविधचक्रकोणे पाणिस्थलालङ्कृतपञ्चबाणे । प्रपन्नसन्तानलते
    प्रसीद प्रकृष्टपाशाङ्कुशपद्महस्ते ॥ ३९॥ मातः प्रसीद मलयाचलपद्मपीठे मायाविशेषकलया रचितप्रपञ्चे । पञ्चप्रपञ्चेश्वरमञ्चसंस्थे
    मह्यं महः कल्पय मातराशु ॥ ४०॥ इति ताम्रपर्णीमाहात्म्ये दशमाध्यायान्तर्गतं अगस्त्यकृतं रुद्राणीस्तोत्रं
    सम्पूर्णम् । ताम्रपर्णीमाहात्म्य । अध्याय १०
