id: ramashadaksharamantropadeshah
category: mantra
name:
  english: ramashadaksharamantropadeshah
  devanagari: रामषडक्षरमन्त्रोपदेशः
content:
  english: jisase hamem isa sharira ka anta hone para mukti mile | ihapyasmakamaishvaryyam vai dushteshtarthasiddhaye
    | evamuktah sa devo'smai bhuktimuktiprasiddhaye || 28|| svarga mem bhi hama devom ka aishvarya doshapurna
    icchita vastuom ki siddhi ke lie haim | kincid vicarya bhagavan shadaksharamupadishat | ekaikam varnavinyasam
    kramaccangani shat punah || 29|| tadvidhim vidhaye pradat pancamantraksharani ca | rahasyam devadevo'pi
    tam mithah samabodhayat || 30|| aisa kahane para bhagavan ne kucha socakara bhoga aura moksha ki siddhi
    ke lie chaha aksharom vale mantra ka upadesha kiya | he muni
  devanagari: जिससे हमें इस शरीर का अन्त होने पर मुक्ति मिले । इहाप्यस्माकमैश्वर्य्यं वै दुष्टेष्टार्थसिद्धये
    । एवमुक्तः स देवोऽस्मै भुक्तिमुक्तिप्रसिद्धये ॥ २८॥ स्वर्ग में भी हम देवों का ऐश्वर्य दोषपूर्ण इच्छित
    वस्तुओं की सिद्धि के लिए हैम् । किञ्चिद् विचार्य भगवान् षडक्षरमुपादिशत् । एकैकं वर्णविन्यासं क्रमाच्चाङ्गानि
    षट् पुनः ॥ २९॥ तद्विधिं विधये प्रादात् पञ्चमन्त्राक्षराणि च । रहस्यं देवदेवोऽपि तं मिथः समबोधयत् ॥
    ३०॥ ऐसा कहने पर भगवान् ने कुछ सोचकर भोग और मोक्ष की सिद्धि के लिए छह अक्षरों वाले मन्त्र का उपदेश
    किया । हे मुनि
meaning: {}
