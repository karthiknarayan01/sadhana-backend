id: devagurupujamantrani
category: mantra
name:
  english: devagurupujamantrani
  devanagari: देवगुरुपूजामन्त्राणि
content:
  english: devagurupujamantrani namo'stvanantaya sahasramurtaye sahasrapadakshishirorubahave | sahasranamne
    purushaya shashvate sahasrakotiyugadharine namah || 1|| namah kamalanabhaya namaste jalashayine |
    namaste keshavananta vasudeva namo'stu te || 2|| vasanadvasudevasya vasitam bhuvanatrayam | sarvabhutanivaso'si
    vasudeva namo'stu te || 3|| shankaram shankaracaryam keshavam badarayanam | sutrabhashyakritau vande
    bhagavantau punah punah || 4|| ishvaro gururatmetimurtibhedavibhagine | vyomavadvyaptadehaya dakshinamurtaye
    namah || 5|| iti devagurupujamantrani samapta |
  devanagari: देवगुरुपूजामन्त्राणि नमोऽस्त्वनन्ताय सहस्रमूर्तये सहस्रपादाक्षिशिरोरुबाहवे । सहस्रनाम्ने
    पुरुषाय शाश्वते सहस्रकोटियुगधारिणे नमः ॥ १॥ नमः कमलनाभाय नमस्ते जलशायिने । नमस्ते केशवानन्त वासुदेव
    नमोऽस्तु ते ॥ २॥ वासनाद्वासुदेवस्य वासितं भुवनत्रयम् । सर्वभूतनिवासोऽसि वासुदेव नमोऽस्तु ते ॥ ३॥ शङ्करं
    शङ्कराचार्यं केशवं बादरायणम् । सूत्रभाष्यकृतौ वन्दे भगवन्तौ पुनः पुनः ॥ ४॥ ईश्वरो गुरुरात्मेतिमूर्तिभेदविभागिने
    । व्योमवद्व्याप्तदेहाय दक्षिणामूर्तये नमः ॥ ५॥ इति देवगुरुपूजामन्त्राणि समाप्ता ।
