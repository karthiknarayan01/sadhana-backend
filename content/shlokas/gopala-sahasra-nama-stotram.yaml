  devanagari: पार्वत्युवाच- कैलासशिखरे रम्ये गौरी पृच्छति शङ्करम् । ब्रह्माण्डाखिलनाथस्त्वं सृष्टिसंहारकारकः
    ॥ १॥ त्वमेव पूज्यसे लोकैर्ब्रह्मविष्णुसुरादिभिः । नित्यं पठसि देवेश कस्य स्तोत्रं महेश्वर ॥ २॥ आश्चर्यमिदमाख्यानं
    जायते मयि शङ्कर । तत्प्राणेश महाप्राज्ञ संशयं छिन्धि मे प्रभो ॥ ३॥ श्रीमहादेव उवाच- धन्यासि कृतपुण्यासि
    पार्वति प्राणवल्लभे । रहस्यातिरहस्यं च यत्पृच्छसि वरानने ॥ ४॥ स्त्रीस्वभावान्महादेवि पुनस्त्वं परिपृच्छसि
    । गोपनीयं गोपनीयं गोपनीयं प्रयत्नतः ॥ ५॥ दत्ते च सिद्धिहानिः स्यात्तस्माद्यत्नेन गोपयेत् । इदं रहस्यं
    परमं पुरुषार्थप्रदायकम् ॥ ६॥ धनरत्नौघमाणिक्यं तुरङ्गं च गजादिकम् । ददाति स्मरणादेव महामोक्षप्रदायकम्
    ॥ ७॥ तत्तेऽहं सम्प्रवक्ष्यामि शृणुष्वावहिता प्रिये । योऽसौ निरञ्जनो देवः चित्स्वरूपी जनार्दनः ॥ ८॥
    संसारसागरोत्तारकारणाय नृणाम् सदा । श्रीरङ्गादिकरूपेण त्रैलोक्यं व्याप्य तिष्ठति ॥ ९॥ ततो लोका महामूढा
    विष्णुभक्तिविवर्जिताः । निश्चयं नाधिगच्छन्ति पुनर्नारायणो हरिः ॥ १०॥ निरञ्जनो निराकारो भक्तानां प्रीतिकामदः
    । वृन्दावनविहाराय गोपालं रूपमुद्वहन् ॥ ११॥ मुरलीवादनाधारी राधायै प्रीतिमावहन् । अंशांशेभ्यः समुन्मील्य
    पूर्णरूपकलायुतः ॥ १२॥ श्रीकृष्णचन्द्रो भगवान् नन्दगोपवरोद्यतः । धरणीरूपिणीमातृयशोदानन्ददायकः ॥ १३॥
    द्वाभ्यां प्रयाचितो नाथो देवक्यां वसुदेवतः । ब्रह्मणाऽभ्यर्थितो देवो देवैरपि सुरेश्वरि ॥ १४॥ जातोऽवन्यां
