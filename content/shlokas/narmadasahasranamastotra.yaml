id: narmadasahasranamastotra
category: sahasranama
name:
  english: narmadasahasranamastotra
  devanagari: नर्मदासहस्रनामस्तोत्र
content:
  english: ringarapriyanimnaga || 77|| shaivalini shesharupa sheshashayyabhipujita | shobhana shobhananga
    ca shokamohanivarini || 78|| shaucapriya shaurimaya shaunakadimunistuta | shamsapriya shankari shankaracaryadisevita
    || 72|| shamvardhini shadaratinihantri shatkarmisamshraya | sarvada sahaja sandhya saguna sarvapalika
    || 80|| sarvasvarupa sarvejya sarvamanya sadashiva | sarvakartrim sarvapatri sarvastha sarvadharini
    || 81|| sarvadharmasusandhatri sarvavandyapadambuja | sarvakilbishahantri ca sarvabhitinivarini ||
    82|| savitri sattvika sadhvi sadhushila ca sakshini | sitashmarapratira ca sitakairavamandita || 83||
    simanvita sikarambhahsitkarashrayakulini | sundari sugama sustha sushila ca sulocana || 84|| sukeshi
    sukhadatri ca sulabha susthala sudha | suvacini sumaya ca sumukha suvrata sura || 85|| sudharnavasvarupa
    ca sudhapurna sudarshana | sukshmambaradhara sutavarnita suripujita || 86|| srishtivardhini ca srishtikartribhih
    paripujita | sevapriya sevadhini setubandhadimandita || 87|| saikatakshonikula ca sairibhadisukhapriya
    | somarupa somadatri somashekharamanita || 88|| saurasyapurnasalila saumedhikajanashraya | saushilyamandita
    saumya saurajyasukhadayini || 89|| saujanyayuktasulabha saumangalyadivardhini | saubhagyadananipuna
    saukhyasindhuviharini || 90|| samvidhanapara samvitsambhavyapadadayini | samshlishtambudhisarvanga
    sannidheyajalashraya || 91|| haripriya hamsarupa harvasamvardhini hara | hanumatpritimapanna haridbhumivirajita
    || 92|| hatakalankarabhusha ca haryasadgunamandita | hitasamsparshasalila himamshupratibimbita ||
    93|| hirakadyutiyukta ca hinakarmavigarhita | hutikartridvijadhara hushchardanakshayakarini || 94||
    hridayalusvabhava ca hridyasadgunamandita | hemavarnabhavasana hemakancukidharini || 95|| hotrinam
    priyakula ca homyadravyasugarbhita | hamsa hamsasvarupa ca hamsika hamsagamini || 96|| kshamarupa
    kshamapujya kshamaprishthapravahini | kshamakartri kshamoddhartri kshamadigunamandita || 97|| kshararupa
    kshara caiva ksharavastvashraya tatha | kshapakarakarollasini kshapacaraharini || 98|| kshanta kshantigunopeta
    kshamadipariharini | kshipraga kshityalankara kshitipalasamahita || 99|| kshinayurjanapiyusha kshinakilbishasevita
    | kshetriyadiniyantri ca kshemakaryasutatpara || 100|| kshetrasamvardhini caiva kshetraikajivanashraya
    | kshonibhridavritapada kshaumambaravibhushita || 101|| kshantavyagunagambhira kshantukarmaikatatpara
    | jnaptivardhanashila ca jnasvarupa jnamatrika || 102|| jnanasvarupavyakta ca jnatrisamvardhini tatha
    | ambashoka'njana caiva aniruddhagnisvarupini || 103|| anekatmasvarupa camareshvarasupujita | avyayakshararupa
    capara'gadhasvarupini || 104|| avyahatapravaha ca hyavishrantakriyatmika | adishaktiradimaya akirnanijarupini
    || 105|| adritatmasvarupa camodapurnavapushmati | asamantadarshapada hyamodanasupurnabhuh || 106||
    atankadaranagatiralasyavahanasthita | ishtadanamahodara ishtayogyasubhustuta || 107|| indiraramanaradhya
    indudhrikpujanarata | indradyamaravandyanghriringitarthapradayini || 108|| ishvari cetihantri ca itibhitinivarini
    | ipsunam kalpavallarirukthashilavati tatha || 109|| uttanagativaha coccoccavacapadapaga | utsahijanasamsevya
    cotphullatarukulini || 110|| urjasvini corjita ca urdhvalokapradayini | rinahartristotratushta riddhitarnanivarini
    || 111|| aishtavyapadasandhatri aihikamushmikarthada | ojasvini hyojovati hyaudaryagunabhajini ||
    112|| kalyani kamala kanjadharini kamalavati | kamaniyasvarupa ca katakabharananyita || 113|| kashi
    kanci ca kaveri kamada karyavardhini | kamakshi kamini kantih kamatisundarangika || 114|| kartaviryakriditanga
    kartaviryaprabodhini | kiritakundalalankararcita kinkararthada || 115|| kirtaniyagunagara kirtanapriyamanasa
    | kushavartanivasa ca kumari kulapalika || 116|| kurukulla kundalini kumbha kumbhiravahini | kupika
    kurdanavati kupa kuparasangata || 117|| kritaviryavilasadhya krishna krishnagatashraya | kedaravritamubhaga
    kekishukapikashraya || 118|| kailasanathasandhatri kaivalyada ca kaitabha | koshala kovidanuta komala
    kokilasvana || 119|| kausheyi kaushikaprita kaushikagaravasini | kanjakshi kanjavadana kanjapushpasadapriya
    || 120|| kanjakananasancari kanjamalasusandhrita || khagasanapriya khadgapanini kharparayudha || 121||
    khalahantri ca khatvangadharini khagagamini | khadipancamahabhutarupa khavardhanakshama || 122|| ganatoshini
    gambhira ganamanya ganadhipa | ganasamrakshanapara ganastha ganayantrini || 123|| gandaki gandhasalila
    ganga ca garudapriya | galagandapahartri ca gadaharisuvarini || 124|| gayatri caiva tasyagre gadheyarcitasatpada
    | gathapriya gadhavaha garutmatatatakini || 125|| girija girishatanaya girishapremavardhini | girvani
    gishpatinuta gitikapriyamanasa || 126|| gudakesharcanapara gururahahpravahini | gehi sarvarthadatri
    ca geyottamagunanyita || 127|| godhana gopana gopi gopalakasadapriya | gotrapriya gopavrita gokulavritasattata
    || 128|| gauri gaurangini gaura gautami gautamapriya | ghanapriya ghanarava ghanaugha ghanavardhini
    || 129|| ghanartihartri ghanarukparihartri ghanadyutih | ghanapapaughasamhartri ghanakleshanivarini
    || 130|| ghanasarartikaprita ghanasammohaharini | gharmambuparihartri ca gharmantagharmaharini ||
    131|| gharmantakalasankshina ghanagamasuharshini | ghattadviparshvanugata ghattini ghattabhushita
    || 132|| catura candravadana candrikollasacancala | campakadarshacarvangi capala campakapriya || 133||
    calatkundalacinmaulicakshushi candanapriya | candamundanihantri ca candika candavikrama || 134|| carurupa
    carugatri carucandrasamanana | carvikshana carunasa carupattamshukavrita || 135|| carucandanaliptanga
    carvalankaramandita | camikarasushobhadhya capakharparadharini || 136|| carunakravarastha ca caturashramyajivini
    | citritambarasambhusha citra citrakalapriya || 137|| cinakartikyasamprita cirnacaritramandana | culumbakaranasakta
    cumbanasvadatatpara || 138|| cudamanisushobhadhya cudalankritapanini | culakadisubhakshya ca cushyasvadanatatpara
    || 139|| cetoharasvarupa ca cetovismayakarini | cetasam modayitri ca cetasamatiparaga || 140|| caitanyaghatitanga
    ca caitanyalinabhavini | cokshyavyavaharavati codyaprakritirupini || 141|| cokshyasvarupa cokshyangi
    cokshyatmanam samipini | chatrarupa chatakara chardini chatrakanvita || 142|| chatrapriya channamukhi
    chandonutayashasvini | chandasashritasatkula chayagrahya chidratmika || 143||
  devanagari: ृङ्गारप्रियनिम्नगा ॥ ७७॥ शैवलिनी शेषरूपा शेषशाय्यभिपूजिता । शोभना शोभनाङ्गा च शोकमोहनिवारिणी
    ॥ ७८॥ शौचप्रिया शौरिमाया शौनकादिमुनिस्तुता । शंसाप्रिया शङ्करी शङ्कराचार्यादिसेविता ॥ ७२॥ शंवर्धिनी
    षडारातिनिहन्त्री षट्कर्मिसंश्रया । सर्वदा सहजा सन्ध्या सगुणा सर्वपालिका ॥ ८०॥ सर्वस्वरूपा सर्वेज्या
    सर्वमान्या सदाशिवा । सर्वकर्त्रीं सर्वपात्री सर्वस्था सर्वधारिणी ॥ ८१॥ सर्वधर्मसुसन्धात्री सर्ववन्द्यपदाम्बुजा
    । सर्वकिल्बिषहन्त्री च सर्वभीतिनिवारिणी ॥ ८२॥ सावित्री सात्त्विका साध्वी साधुशीला च साक्षिणी । सिताश्मरप्रतीरा
    च सितकैरवमण्डिता ॥ ८३॥ सीमान्विता सीकराम्भःसीत्काराश्रयकूलिनी । सुन्दरी सुगमा सुस्था सुशीला च सुलोचना
    ॥ ८४॥ सुकेशी सुखदात्री च सुलभा सुस्थला सुधा । सुवाचिनी सुमाया च सुमुखा सुव्रता सुरा ॥ ८५॥ सुधार्णवस्वरूपा
    च सुधापूर्णा सुदर्शना । सूक्ष्माम्बरधरा सूतवर्णिता सूरिपूजिता ॥ ८६॥ सृष्टिवर्धिनी च सृष्टिकर्तृभिः
    परिपूजिता । सेवाप्रिया सेवधिनी सेतुबन्धादिमण्डिता ॥ ८७॥ सैकतक्षोणिकूला च सैरिभादिसुखप्रिया । सोमरूपा
    सोमदात्री सोमशेखरमानिता ॥ ८८॥ सौरस्यपूर्णसलिला सौमेधिकजनाश्रया । सौशील्यमण्डिता सौम्या सौराज्यसुखदायिनी
    ॥ ८९॥ सौजन्ययुक्तसुलभा सौमङ्गल्यादिवर्धिनी । सौभाग्यदाननिपुणा सौख्यसिन्धुविहारिणी ॥ ९०॥ संविधानपरा
    संवित्सम्भाव्यपददायिनी । संश्लिष्टाम्बुधिसर्वाङ्गा सन्निधेयजलाश्रया ॥ ९१॥ हरिप्रिया हंसरूपा हर्वसंवर्धिनी
    हरा । हनुमत्प्रीतिमापन्ना हरिद्भूमिविराजिता ॥ ९२॥ हाटकालङ्कारभूषा च हार्यसद्गुणमण्डिता । हितसंस्पर्शसलिला
    हिमांशुप्रतिबिम्बिता ॥ ९३॥ हीरकद्युतियुक्ता च हीनकर्मविगर्हिता । हुतिकर्तृद्विजाधारा हूश्छर्दनक्षयकारिणी
    ॥ ९४॥ हृदयालुस्वभावा च हृद्यसद्गुणमण्डिता । हेमवर्णाभवसना हेमकञ्चुकिधारिणी ॥ ९५॥ होतृणां प्रियकूला
    च होम्यद्रव्यसुगर्भिता । हंसा हंसस्वरूपा च हंसिका हंसगामिनी ॥ ९६॥ क्षमारूपा क्षमापूज्या क्षमापृष्ठप्रवाहिनी
    । क्षमाकर्त्री क्षमोद्धर्त्री क्षमादिगुणमण्डिता ॥ ९७॥ क्षररूपा क्षरा चैव क्षरवस्त्वाश्रया तथा । क्षपाकरकरोल्लासिनी
    क्षपाचरहारिणी ॥ ९८॥ क्षान्ता क्षान्तिगुणोपेता क्षामादिपरिहारिणी । क्षिप्रगा क्षित्यलङ्कारा क्षितिपालसमाहिता
    ॥ ९९॥ क्षीणायुर्जनपीयूषा क्षीणकिल्बिषसेविता । क्षेत्रियादिनियन्त्री च क्षेमकार्यसुतत्परा ॥ १००॥ क्षेत्रसंवर्धिनी
    चैव क्षेत्रैकजीवनाश्रया । क्षोणीभृदावृतपदा क्षौमाम्बरविभूषिता ॥ १०१॥ क्षन्तव्यगुणगम्भीरा क्षन्तुकर्मैकतत्परा
    । ज्ञप्तिवर्धनशीला च ज्ञस्वरूपा ज्ञमातृका ॥ १०२॥ ज्ञानस्वरूपव्यक्ता च ज्ञातृसंवर्धिनी तथा । अम्बाशोकाऽञ्जना
    चैव अनिरुद्धाग्निस्वरूपिणी ॥ १०३॥ अनेकात्मस्वरूपा चामरेश्वरसुपूजिता । अव्ययाक्षररूपा चापाराऽगाधस्वरूपिणी
    ॥ १०४॥ अव्याहतप्रवाहा च ह्यविश्रान्तक्रियात्मिका । आदिशक्तिरादिमाया आकीर्णनिजरूपिणी ॥ १०५॥ आदृतात्मस्वरूपा
    चामोदपूर्णवपुष्मती । आसमन्तादार्षपादा ह्यामोदनसुपूर्णभूः ॥ १०६॥ आतङ्कदारणगतिरालस्यवाहनस्थिता । इष्टदानमहोदारा
    इष्टयोग्यसुभूस्तुता ॥ १०७॥ इन्दिरारमणाराध्या इन्दुधृक्पूजनारता । इन्द्राद्यमरवन्द्याङ्घ्रिरिङ्गितार्थप्रदायिनी
    ॥ १०८॥ ईश्वरी चेतिहन्त्री च ईतिभीतिनिवारिणी । ईप्सूनां कल्पवल्लरिरुक्थशीलवती तथा ॥ १०९॥ उत्तानगतिवाहा
    चोच्चोच्चावचपदापगा । उत्साहिजनसंसेव्या चोत्फुल्लतरुकूलिनी ॥ ११०॥ ऊर्जस्विनी चोर्जिता च ऊर्ध्वलोकप्रदायिनी
    । ऋणहर्तृस्तोत्रतुष्टा ऋद्धितार्णनिवारिणी ॥ १११॥ ऐष्टव्यपदसन्धात्री ऐहिकामुष्मिकार्थदा । ओजस्विनी
    ह्योजोवती ह्यौदार्यगुणभाजिनी ॥ ११२॥ कल्याणी कमला कञ्जधारिणी कमलावती । कमनीयस्वरूपा च कटकाभरणान्यिता
    ॥ ११३॥ काशी काञ्ची च कावेरी कामदा कार्यवर्धिनी । कामाक्षी कामिनी कान्तिः कामातिसुन्दराङ्गिका ॥ ११४॥
    कार्तवीर्यक्रीडिताङ्गा कार्तवीर्यप्रबोधिनी । किरीटकुण्डलालङ्कारार्चिता किङ्करार्थदा ॥ ११५॥ कीर्तनीयगुणागारा
    कीर्तनप्रियमानसा । कुशावर्तनिवासा च कुमारी कुलपालिका ॥ ११६॥ कुरुकुल्ला कुण्डलिनी कुम्भा कुम्भीरवाहिनी
    । कूपिका कूर्दनवती कूपा कूपारसङ्गता ॥ ११७॥ कृतवीर्यविलासाढ्या कृष्णा कृष्णगताश्रया । केदारावृतमूभागा
    केकीशुकपिकाश्रया ॥ ११८॥ कैलासनाथसन्धात्री कैवल्यदा च कैटभा । कोशला कोविदनुता कोमला कोकिलस्वना ॥ ११९॥
    कौशेयी कौशिकप्रीता कौशिकागारवासिनी । कञ्जाक्षी कञ्जवदना कञ्जपुष्पसदाप्रिया ॥ १२०॥ कञ्जकाननसञ्चारी
    कञ्जमालासुसन्धृता ॥ खगासनप्रिया खड्गपाणिनी खर्परायुधा ॥ १२१॥ खलहन्त्री च खट्वाङ्गधारिणी खगगामिनी ।
    खादिपञ्चमहाभूतरूपा खवर्धनक्षमा ॥ १२२॥ गणतोषिणी गम्भीरा गणमान्या गणाधिपा । गणसंरक्षणपरा गणस्था गणयन्त्रिणी
    ॥ १२३॥ गण्डकी गन्धसलिला गङ्गा च गरुडप्रिया । गलगण्डापहर्त्री च गदहारिसुवारिणी ॥ १२४॥ गायत्री चैव तस्याग्रे
    गाधेयार्चितसत्पदा । गाथाप्रिया गाढवहा गारुत्मततटाकिनी ॥ १२५॥ गिरिजा गिरीशतनया गिरीशप्रेमवर्धिनी ।
    गीर्वाणी गीष्पतिनुता गीतिकाप्रियमानसा ॥ १२६॥ गुडाकेशार्चनपरा गुरूरहःप्रवाहिनी । गेही सर्वार्थदात्री
    च गेयोत्तमगुणान्यिता ॥ १२७॥ गोधना गोपना गोपी गोपालकसदाप्रिया । गोत्रप्रिया गोपवृता गोकुलावृतसत्तटा
    ॥ १२८॥ गौरी गौराङ्गिणी गौरा गौतमी गौतमप्रिया । घनप्रिया घनरवा घनौघा घनवर्धिनी ॥ १२९॥ घनार्तिहर्त्री
    घनरुक्परिहर्त्री घनद्युतिः । घनपापौघसंहर्त्री घनक्लेशनिवारिणी ॥ १३०॥ घनसारार्तिकप्रीता घनसम्मोहहारिणी
    । घर्माम्बुपरिहर्त्री च घर्मान्तघर्महारिणी ॥ १३१॥ घर्मान्तकालसङ्क्षीणा घनागमसुहर्षिणी । घट्टद्विपार्श्वानुगता
    घट्टिनी घट्टभूषिता ॥ १३२॥ चतुरा चन्द्रवदना चन्द्रिकोल्लासचञ्चला । चम्पकादर्शचार्वङ्गी चपला चम्पकप्रिया
    ॥ १३३॥ चलत्कुण्डलचिन्मौलिचक्षुषी चन्दनप्रिया । चण्डमुण्डनिहन्त्री च चण्डिका चण्डविक्रमा ॥ १३४॥ चारुरूपा
    चारुगात्री चारुचन्द्रसमानना । चार्वीक्षणा चारुनासा चारुपट्टांशुकावृता ॥ १३५॥ चारुचन्दनलिप्ताङ्गा चार्वलङ्कारमण्डिता
    । चामीकरसुशोभाढ्या चापखर्परधारिणी ॥ १३६॥ चारुनक्रवरस्था च चातुराश्रम्यजीविनी । चित्रिताम्बरसम्भूषा
    चित्रा चित्रकलाप्रिया ॥ १३७॥ चीनकार्तिक्यसम्प्रीता चीर्णचारित्रमण्डना । चुलुम्बकरणासक्ता चुम्बनास्वादतत्परा
    ॥ १३८॥ चूडामणिसुशोभाढ्या चूडालङ्कृतपाणिनी । चूलकादिसुभक्ष्या च चूष्यास्वादनतत्परा ॥ १३९॥ चेतोहरस्वरूपा
    च चेतोविस्मयकारिणी । चेतसां मोदयित्री च चेतसामतिपारगा ॥ १४०॥ चैतन्यघटिताङ्गा च चैतन्यलीनभाविनी । चोक्ष्यव्यवहारवती
    चोद्यप्रकृतिरूपिणी ॥ १४१॥ चोक्ष्यस्वरूपा चोक्ष्याङ्गी चोक्ष्यात्मनां समीपिनी । छत्ररूपा छटाकारा छर्दिनी
    छत्रकान्विता ॥ १४२॥ छत्रप्रिया छन्नमुखी छन्दोनुतयशस्विनी । छान्दसाश्रितसत्कूला छायाग्राह्या छिद्रात्मिका
    ॥ १४३॥
