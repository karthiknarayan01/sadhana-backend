id: medhasukta
category: sukta
name:
  english: medhasukta
  devanagari: मेधसुक्त
content:
  english: 44 om yashchandasamrishabho vishvarupah | chandobhyo'dhyamritathsambabhuva | sa mendro medhaya
    sprinotu | amritasya devadharano bhuyasam | shariram me vicarshanam | jihva me madhumattama | karnabhyam
    bhurivishruvam | brahmanah kosho'si medhaya pihitah | shrutam me gopaya | om shantih shantih shantih
    || om medhadevi jushamana na agadvishvaci bhadra sumanasyamana | tvaya jushta nudamana duruktan brihadvadema
    vidathe suvirah | tvaya jushta rishirbhavati devi tvaya brahma''gatashriruta tvaya | tvaya jushtashcitram
    vindate vasu sano jushasva dravino na medhe || medham ma indro dadatu medham devi sarasvati | medham
    me ashvinavubhavadhattam pushkarasraja | apsarasu ca ya medha gandharveshu ca yanmanah | daivim medha
    sarasvati sa mam medha surabhirjushata
  devanagari: ४४ ॐ यश्छन्दसामृषभो विश्वरूपः । छन्दोभ्योऽध्यमृताथ्संबभूव । स मेन्द्रो मेधया स्पृणोतु ।
    अमृतस्य देवधारणो भूयासम् । शरीरं मे विचर्षणम् । जिह्वा मे मधुमत्तमा । कर्णाभ्यां भूरिविश्रुवम् । ब्रह्मणः
    कोशोऽसि मेधया पिहितः । श्रुतं मे गोपाय । ॐ शान्तिः शान्तिः शान्तिः ॥ ॐ मेधादेवी जुषमाणा न आगाद्विश्वाची
    भद्रा सुमनस्यमाना । त्वया जुष्टा नुदमाना दुरुक्तान् बृहद्वदेम विदथे सुवीराः । त्वया जुष्ट ऋषिर्भवति
    देवि त्वया ब्रह्माऽऽगतश्रीरुत त्वया । त्वया जुष्टश्चित्रं विन्दते वसु सानो जुषस्व द्रविणो न मेधे ॥
    मेधां म इन्द्रो ददातु मेधां देवी सरस्वती । मेधां मे अश्विनावुभावाधत्तां पुष्करस्रजा । अप्सरासु च या
    मेधा गन्धर्वेषु च यन्मनः । दैवीं मेधा सरस्वती सा मां मेधा सुरभिर्जुषता
