id: mahanyasam-5-3-dashanga-raudrikaranam
category: stotram
name:
  english: Mahanyasam - 5.3. Dashanga Raudrikaranam
content:
  english: mbhurbhuvassuvah | om om | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya
    ca namah shivaya ca shivataraya ca || trataramindra mavitaramindragm have have suhavagm shuramindra
    mpuruhutamindragg svasti no maghava dhatvindrah || namah shambhave ca mayobhave ca namah shankaraya
    ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | om om | purvadigbhage
    lalatasthane indraya namah || mbhurbhuvassuvah | o nnam | namah shambhave ca mayobhave ca namah shankaraya
    ca mayaskaraya ca namah shivaya ca shivataraya ca || tva nno agne varunasya vidvandevasya hedo 'va
    yasisishthah | yajishtho vahnitama shshoshucano vishva dveshagmsi pramumugdhyasmat || namah shambhave
    ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate
    rudraya | nam om | agneyadigbhage netrayosthane agnaye namah || mbhurbhuvassuvah | o mmom | namah
    shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || suga
    nkrinotu | yasminnakshatre yama eti raja | yasminnenamabhyashincanta devah | tadasya citragm havisha
    yajama || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || o nnamo bhagavate rudraya | mom om | dakshinadigbhage karnayosthane yamaya namah || mbhurbhuvassuvah
    | o mbham | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || asunvanta mayajamanamicchastenasyetyantaskarasyanveshi | anyamasmadiccha sa ta itya namo devi
    nir rite tubhyamastu || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya
    ca shivataraya ca || o nnamo bhagavate rudraya | bham om | nir ritidigbhage mukhasthane nir mbhurbhuvassuvah
    | o ngam | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || tattvayami brahmana vandamanastada sha ste yajamano havirbhih | ahedamano varuneha bodhyurushagmsa
    ma na ayuh pramoshih || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya
    ca shivataraya ca || o nnamo bhagavate rudraya | gam om | pashcimadigbhage bahvosthane varunaya namah
    || mbhurbhuvassuvah | om va~m | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca
    namah shivaya ca shivataraya ca || a no niyudbhih shatinibhiradhvaragm | sahasrinibhirupa yahi yajnam
    | vayo asmin havishi madayasva | yuya ssada nah || namah shambhave ca mayobhave ca namah shankaraya
    ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | vam om | vayavyadigbhage
    nasikasthane vayave namah || mbhurbhuvassuvah | o ntem | namah shambhave ca mayobhave ca namah shankaraya
    ca mayaskaraya ca namah shivaya ca shivataraya ca || vayagm soma vrate tava | manastanushubibhratah
    | prajavanto ashimahi | indrani devi subhaga supatni || namah shambhave ca mayobhave ca namah shankaraya
    ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | tem om | uttaradigbhage
    jatharasthane kuberaya namah || mbhurbhuvassuvah | om rum | namah shambhave ca mayobhave ca namah
    shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || tamisha njagatastasthushaspati njinvamavase
    humahe vayam | pusha no yatha vedasamasadvridhe rakshita payuradabdha || namah shambhave ca mayobhave
    ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya
    | rum om | ishanyadigbhage nabhisthane ishanaya namah || mbhurbhuvassuvah | o ndram | namah shambhave
    ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || asme rudra mehana
    parvataso vritrahatye bharahutau sajoshah shshamsate stuvate dhayi pajra indrajyeshtha asma~ avantu
    devah || namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || o nnamo bhagavate rudraya | dram om | urdhvadigbhage murdhnisthane akashaya namah || mbhurbhuvassuvah
    | om ya~m | namah shambhave ca mayobhave ca namah shankaraya ca mayaskaraya ca namah shivaya ca shivataraya
    ca || syona prithivi bhavanrikshara niveshani | yaccha na || namah shambhave ca mayobhave ca namah
    shankaraya ca mayaskaraya ca namah shivaya ca shivataraya ca || o nnamo bhagavate rudraya | yam om
    | adhodigbhage padasthane prithivyai namah ||
  devanagari: म्भूर्भुव॒स्सुवः॑ । ॐ ओम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑
    शि॒वाय॑ च शि॒वत॑राय च॒ ॥ त्रा॒तार॒मिन्द्र॑ मवि॒तार॒मिन्द्र॒ग्ं॒ हवे॑ हवे सु॒हव॒ग्ं॒ शूर॒मिन्द्र म्पु॑रुहू॒तमिन्द्रग्ग्॑
    स्व॒स्ति नो॑ म॒घवा॑ धा॒त्विन्द्रः॑ ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑
    शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । ॐ ओम् । पूर्वदिग्भागे ललाटस्थाने इन्द्राय नमः ॥
    म्भूर्भुव॒स्सुवः॑ । ओ न्नम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑
    च शि॒वत॑राय च॒ ॥ त्व न्नो॑ अग्ने॒ वरु॑णस्य वि॒द्वान्दे॒वस्य॒ हेडो ऽव॑ यासिसीष्ठाः । यजि॑ष्ठो॒ वह्नि॑तम॒
    श्शोशु॑चानो॒ विश्वा॒ द्वेषाग्ं॑सि॒ प्रमु॑मुग्ध्य॒स्मत् ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑
    च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । नं ओम् । आग्नेयदिग्भागे नेत्रयोस्थाने
    अग्नये नमः ॥ म्भूर्भुव॒स्सुवः॑ । ओ म्मोम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑
    च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ सु॒ग ङ्कृणोतु । यस्मि॒न्नक्ष॑त्रे य॒म एति॒ राजा । यस्मि॑न्नेनम॒भ्यषि॑ञ्चन्त
    दे॒वाः । तद॑स्य चि॒त्रग्ं ह॒विषा॑ यजाम ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒
    नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । मों ओम् । दक्षिणदिग्भागे कर्णयोस्थाने यमाय
    नमः ॥ म्भूर्भुव॒स्सुवः॑ । ओ म्भम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑
    शि॒वाय॑ च शि॒वत॑राय च॒ ॥ असु॑न्वन्त॒ मय॑जमानमिच्छस्ते॒नस्ये॒त्यान्तस्क॑र॒स्यान्वे॑षि । अ॒न्यम॒स्मदि॑च्छ॒
    सा त॑ इ॒त्या नमो॑ देवि निर् ऋते॒ तुभ्य॑मस्तु ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑
    च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । भं ओम् । निर् ऋतिदिग्भागे मुखस्थाने निर्
    म्भूर्भुव॒स्सुवः॑ । ओ ङ्गम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑
    च शि॒वत॑राय च॒ ॥ तत्त्वा॑यामि॒ ब्रह्म॑णा॒ वन्द॑मान॒स्तदा शा स्ते॒ यज॑मानो ह॒विर्भिः॑ । अहे॑डमानो वरुणे॒ह
    बो॒ध्युरु॑शग्ंस॒ मा न॒ आयुः॒ प्रमो॑षीः ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒
    नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । गं ओम् । पश्चिमदिग्भागे बाह्वोस्थाने वरुणाय
    नमः ॥ म्भूर्भुव॒स्सुवः॑ । ॐ वँम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑
    शि॒वाय॑ च शि॒वत॑राय च॒ ॥ आ नो॑ नि॒युद्भिः॑ श॒तिनी॑भिरध्व॒रग्म् । स॑ह॒स्रिणी॑भि॒रुप॑ याहि य॒ज्ञम् ।
    वायो॑ अ॒स्मिन् ह॒विषि॑ मादयस्व । यू॒य स्सदा॑ नः ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑
    च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । वं ओम् । वायव्यदिग्भागे नासिकास्थाने वायवे
    नमः ॥ म्भूर्भुव॒स्सुवः॑ । ओ न्तेम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑
    शि॒वाय॑ च शि॒वत॑राय च॒ ॥ व॒यग्ं सो॑म व्र॒ते तव॑ । मन॑स्त॒नूषु॒बिभ्र॑तः । प्र॒जाव॑न्तो अशीमहि । इ॒न्द्रा॒णी
    दे॒वी सु॒भगा॑ सु॒पत्नी ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च
    शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । तें ओम् । उत्तरदिग्भागे जठरस्थाने कुबेराय नमः ॥ म्भूर्भुव॒स्सुवः॑
    । ॐ रुम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒
    ॥ तमीशा ञ्जग॑तस्त॒स्थुष॒स्पति ञ्जि॒न्वमव॑से हूमहे व॒यम् । पू॒षा नो॒ यथा॒ वेद॑सा॒मस॑द्वृ॒धे र॑क्षि॒ता
    पा॒युरद॑ब्ध ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय
    च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । रुं ओम् । ईशान्यदिग्भागे नाभिस्थाने ईशानाय नमः ॥ म्भूर्भुव॒स्सुवः॑
    । ओ न्द्राम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय
    च॒ ॥ अ॒स्मे रु॒द्रा मे॒हना॒ पर्व॑तासो वृत्र॒हत्ये॒ भर॑हूतौ स॒जोषाः श्शंस॑ते स्तुव॒ते धायि॑ प॒ज्र इन्द्र॑ज्येष्ठा
    अ॒स्माँ अ॑वन्तु दे॒वाः ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च
    शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । द्रां ओम् । ऊर्ध्वदिग्भागे मूर्ध्निस्थाने आकाशाय नमः ॥ म्भूर्भुव॒स्सुवः॑
    । ॐ यँम् । नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑ च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒
    ॥ स्यो॒ना पृ॑थिवि॒ भवा॑नृक्ष॒रा नि॒वेश॑नी । यच्छा॑ न॒ ॥ नमः॑ श॒म्भवे॑ च मयो॒भवे॑ च॒ नमः॑ शङ्क॒राय॑
    च मयस्क॒राय॑ च॒ नमः॑ शि॒वाय॑ च शि॒वत॑राय च॒ ॥ ओ न्नमो भगवते॑ रुद्रा॒य । यं ओम् । अधोदिग्भागे पादस्थाने
    पृथिव्यै नमः ॥
