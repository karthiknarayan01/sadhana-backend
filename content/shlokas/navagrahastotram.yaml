id: navagrahastotram
category: stotram
name:
  english: navagrahastotram
  devanagari: नवग्रहस्तोत्रम्
content:
  english: '|| atha navagrahastotram || || ravih || japakusumasankasham kashyapeyam mahadyutim| tamo''rim
    sarvapapaghnam pranato''smi divakaram||1|| || somah || dadhishankhatusharabham kshirodarnavasambhavam|
    namami shashinam somam shambhormukutabhushanam||2|| || mangalah || dharanigarbhasambhutam vidyutkantisamaprabham|
    kumaram shaktihastam tam mangalam pranamamyaham||3|| || budhah || priyangukalikashyamam rupenapratimam
    budham| saumyam saumyagunopetam tam budham pranamamyaham||4|| || guruh || devanam ca rishinam ca gurum
    kancanasannibham| buddhibhutam trilokesham tam namami brihaspatim||5|| || shukrah || himakundamrinalabham
    daityanam paramam gurum| sarvashastrapravaktaram bhargavam pranamamyaham||6|| || shanih || nilanjanasamabhasam
    raviputram yamagrajam| chayamartandasambhutam tam namami shanaishcaram||7|| || rahuh || ardhakayam
    mahaviryam candradityavimardanam| simhikagarbhasambhutam tam rahum pranamamyaham||8|| || ketuh ||
    palashapushpasankasham tarakagrahamastakam| raudram raudratmakam ghoram tam ketum pranamamyaham||9||
    || phalashrutih || iti vyasamukhodgitam yah pathetsusamahitah| diva va yadi va ratrau vighnashantirbhavishyati||
    naranarinripanam ca bhavedduhsvapnanashanam| aishvaryamatulam teshamarogyam pushtivardhanam|| grahanakshatrajah
    pidastaskaragnisamudbhavah| tah sarvah prashamam yanti vyaso brute na samshayah|| || iti shrivyasaviracitam
    adityadinavagrahastotram sampurnam || || atha navagrahapidaharastotram || || ravih || grahanamadiradityo
    lokarakshanakarakah| vishamasthanasambhutam pidam haratu me ravih||1|| || somah || rohinishah sudhamurtih
    sudhagatrah sudhashanah| vishamasthanasambhutam pidam haratu me vidhuh||2|| || mangalah || bhumiputro
    mahateja jagatam bhayakritsada| vrishtikriddrishtiharta ca pidam haratu me kujah||3|| || budhah ||
    utpatarupo jagatam candraputro mahadyutih| suryapriyakaro vidvan pidam haratu me budhah||4|| || guruh
    || devamantri vishalakshah sada lokahite ratah| anekashishyasampurnah pidam haratu me guruh||5|| ||
    shukrah || daityamantri gurustesham pranadashca mahamatih| prabhustaragrahanam ca pidam haratu me
    bhriguh||6|| || shanih || suryaputro dirghadeho vishalakshah shivapriyah| dirghacarah prasannatma
    pidam haratu me shanih||7|| || rahuh || anekarupavarneshca shatasho''tha sahasradrik| utpatarupo jagatam
    pidam haratu me tamah||8|| || ketuh || mahashira mahavaktro dirghadamshtro mahabalah| atanushcordhvakeshashca
    pidam haratu me shikhih||9|| || iti brahmandapuranoktam navagrahapidaharastotram sampurnam ||'
  devanagari: ॥ अथ नवग्रहस्तोत्रम् ॥ ॥ रविः ॥ जपाकुसुमसङ्काशं काश्यपेयं महाद्युतिम्। तमोऽरिं सर्वपापघ्नं
    प्रणतोऽस्मि दिवाकरम्॥१॥ ॥ सोमः ॥ दधिशङ्खतुषाराभं क्षीरोदार्णवसम्भवम्। नमामि शशिनं सोमं शम्भोर्मुकुटभूषणम्॥२॥
    ॥ मङ्गलः ॥ धरणीगर्भसम्भूतं विद्युत्कान्तिसमप्रभम्। कुमारं शक्तिहस्तं तं मङ्गलं प्रणमाम्यहम्॥३॥ ॥ बुधः
    ॥ प्रियङ्गुकलिकाश्यामं रूपेणाप्रतिमं बुधम्। सौम्यं सौम्यगुणोपेतं तं बुधं प्रणमाम्यहम्॥४॥ ॥ गुरुः ॥
    देवानां च ऋषीणां च गुरुं काञ्चनसन्निभम्। बुद्धिभूतं त्रिलोकेशं तं नमामि बृहस्पतिम्॥५॥ ॥ शुक्रः ॥ हिमकुन्दमृणालाभं
    दैत्यानां परमं गुरुम्। सर्वशास्त्रप्रवक्तारं भार्गवं प्रणमाम्यहम्॥६॥ ॥ शनिः ॥ नीलाञ्जनसमाभासं रविपुत्रं
    यमाग्रजम्। छायामार्तण्डसम्भूतं तं नमामि शनैश्चरम्॥७॥ ॥ राहुः ॥ अर्धकायं महावीर्यं चन्द्रादित्यविमर्दनम्।
    सिंहिकागर्भसंभूतं तं राहुं प्रणमाम्यहम्॥८॥ ॥ केतुः ॥ पलाशपुष्पसङ्काशं तारकाग्रहमस्तकम्। रौद्रं रौद्रात्मकं
    घोरं तं केतुं प्रणमाम्यहम्॥९॥ ॥ फलश्रुतिः ॥ इति व्यासमुखोद्गीतं यः पठेत्सुसमाहितः। दिवा वा यदि वा
    रात्रौ विघ्नशान्तिर्भविष्यति॥ नरनारीनृपाणां च भवेद्दुःस्वप्ननाशनम्। ऐश्वर्यमतुलं तेषामारोग्यं पुष्टिवर्धनम्॥
    ग्रहनक्षत्रजाः पीडास्तस्कराग्निसमुद्भवाः। ताः सर्वाः प्रशमं यान्ति व्यासो ब्रूते न संशयः॥ ॥ इति श्रीव्यासविरचितम्
    आदित्यादिनवग्रहस्तोत्रं सम्पूर्णम् ॥ ॥ अथ नवग्रहपीडाहरस्तोत्रम् ॥ ॥ रविः ॥ ग्रहाणामादिरादित्यो लोकरक्षणकारकः।
    विषमस्थानसम्भूतां पीडां हरतु मे रविः॥१॥ ॥ सोमः ॥ रोहिणीशः सुधामूर्तिः सुधागात्रः सुधाशनः। विषमस्थानसम्भूतां
    पीडां हरतु मे विधुः॥२॥ ॥ मङ्गलः ॥ भूमिपुत्रो महातेजा जगतां भयकृत्सदा। वृष्टिकृद्दृष्टिहर्ता च पीडां
    हरतु मे कुजः॥३॥ ॥ बुधः ॥ उत्पातरूपो जगतां चन्द्रपुत्रो महाद्युतिः। सूर्यप्रियकरो विद्वान् पीडां हरतु
    मे बुधः॥४॥ ॥ गुरुः ॥ देवमन्त्री विशालाक्षः सदा लोकहिते रतः। अनेकशिष्यसम्पूर्णः पीडां हरतु मे गुरुः॥५॥
    ॥ शुक्रः ॥ दैत्यमन्त्री गुरुस्तेषां प्राणदश्च महामतिः। प्रभुस्ताराग्रहाणां च पीडां हरतु मे भृगुः॥६॥
    ॥ शनिः ॥ सूर्यपुत्रो दीर्घदेहो विशालाक्षः शिवप्रियः। दीर्घाचारः प्रसन्नात्मा पीडां हरतु मे शनिः॥७॥
    ॥ राहुः ॥ अनेकरूपवर्णेश्च शतशोऽथ सहस्रदृक्। उत्पातरूपो जगतां पीडां हरतु मे तमः॥८॥ ॥ केतुः ॥ महाशिरा
    महावक्त्रो दीर्घदंष्ट्रो महाबलः। अतनुश्चोर्ध्वकेशश्च पीडां हरतु मे शिखीः॥९॥ ॥ इति ब्रह्माण्डपुराणोक्तं
    नवग्रहपीडाहरस्तोत्रं सम्पूर्णम् ॥
