    केर सुभ् । भूलेहुँ सङ्गति करिअ न क् ॥ तिन्ह कर सङ्ग सदा दुखदाई। जिमि कलपहि घालि हरहाई ॥ खलन्ह हृदयँ
    अति ताप बिसेषी। जरहिं सदा पर सम्पति देखी ॥ जहँ कहुँ निन्दा सुनहिं पराई। हरषहिं मनहुँ परी निधि पाई
    ॥ काम क्रोध मद लोभ परायन। निर्दय कपटी कुटिल मलायन ॥ बयरु अकारन सब काहू सों। जो कर हित अनहित ताहू सोम्
    ॥ झूठि लेना झूठि देना। झूठि भोजन झूठ चबेना ॥ बोलहिं मधुर बचन जिमि मोरा। खाइ महा अति हृदय कठोरा ॥ दो
    पर द्रोही पर दार रत पर धन पर अपबाद। ते नर पाँवर पापमय देह धरें मनुजाद ॥ ॥ लोभि ओढ़न लोभि डासन। सिस्त्रोदर
