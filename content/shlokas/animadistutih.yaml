id: animadistutih
category: stotram
name:
  english: animadistutih
  devanagari: अनिमादिस्तुतिः
content:
  english: vityarupe namonamah || 5|| anime nirmaletubhyam sinjinite namonamah | jyotirmayi namastubhyam
    ghorarupini te namah || 6|| sadyojatamukhadeshastavarajo vinirgatah | shrivamadeva uvaca | candrike
    ladhime tubhyam namastubhyam namonamah || 7|| shankhahastenamastubhyam candrasyete namonamah | harinakshi
    namastubhyam namastubhyam namonamah || 8|| sulocane namastubhyam shankhinite namonamah | shankhahaste
    praptisiddhe cakrahaste namonamah || 9|| he cakrini namastubhyam vidyarupini te namah | vidyopa praptisiddhyartham
    namastubhyam namonamah || 10|| vamadeva mukhadeshastavarajo vinirgatah | shriaghora uvaca | bani tena
    namastubhatra kamyasiddhisvarupini || 11|| prakamya vimale tubhyam pishalakshe namonamah | he vishale
    namastubhyam vishame ca namonamah || 12|| aghoramukhasammuktah stavarajah prakirttitah | shriishana
    uvaca | namaste mahime shobhe svarupe te namonamah || 13|| sundari mahime tubhyam gandhavahe namonamah
    | gandhini marhime tubhatra namastubhatra namonamah || 14|| gaganeca namastubhatra ganarupinite namah
    || 15|| rudrarupi namastubhyam ishvari tvam namamyaham | shritamasa uvaca | pinakini namastubhyam
    vashitva siddhirupini || 16|| shankararupini tubhyam hararupini te namah | kalyani he namastubhyam
    hararupini te namah || 17|| mangale he namastubhyam namaste siddhirupini | namaste mangale nitye konavimshatisamyute
    || 18|| kamavasayite kirte namastubhya namonamah | manorupi namastubhyam namastubhyam namonamah ||
    18|| buddha matarnamastubhyam vilakshani namonamah | nanarupamayitubhyam namastubhyam namonamah ||
    20|| ya idam pathatistotram trisandhyam shivasannidhau | sahasa mantrasiddhih syat lakshavarttanamatratah
    || 21|| etat stotram maheshani kalikale pathet sudhih | etat stotram vina devi
  devanagari: वित्यरूपे नमोनमः ॥ ५॥ अनिमे निर्मलेतुभ्यं सिञ्जिनिते नमोनमः । ज्योतिर्मयि नमस्तुभ्यं घोररूपिणि
    ते नमः ॥ ६॥ सद्योजातमुखादेषस्तवराजो विनिर्गतः । श्रीवामदेव उवाच । चन्द्रिके लधिमे तुभ्यं नमस्तुभ्यं
    नमोनमः ॥ ७॥ शङ्खहस्तेनमस्तुभ्यं चन्द्रास्येते नमोनमः । हरिणाक्षि नमस्तुभ्यं नमस्तुभ्यं नमोनमः ॥ ८॥
    सुलोचने नमस्तुभ्यं शङ्खिनिते नमोनमः । शङ्खहस्ते प्राप्तिसिद्धे चक्रहस्ते नमोनमः ॥ ९॥ हे चक्रिणि नमस्तुभ्यं
    विद्यारूपिणि ते नमः । विद्योप प्राप्तिसिद्ध्यर्थं नमस्तुभ्यं नमोनमः ॥ १०॥ वामदेव मुखादेषस्तवराजो विनिर्गतः
    । श्रीअघोर उवाच । बाणि तेन नमस्तुभत्र काम्यसिद्धिस्वरूपिणि ॥ ११॥ प्रकाम्य विमले तुभ्यं पिशालाक्षे
    नमोनमः । हे विशाले नमस्तुभ्यं विषमे च नमोनमः ॥ १२॥ अघोरमुखसम्मुक्तः स्तवराजः प्रकीर्त्तितः । श्रीईशान
    उवाच । नमस्ते महिमे शोभे स्वरूपे ते नमोनमः ॥ १३॥ सुन्दरि महिमे तुभ्यं गन्धवाहे नमोनमः । गन्धिनि मर्हिमे
    तुभत्र नमस्तुभत्र नमोनमः ॥ १४॥ गगणेच नमस्तुभत्र गानरूपिनिते नमः ॥ १५॥ रुद्ररूपि नमस्तुभ्यं ईश्वरि
    त्वां नमाम्यहम् । श्रीतामस उवाच । पिनाकिनि नमस्तुभ्यं वशित्वा सिद्धिरूपिणि ॥ १६॥ शङ्कररूपिणि तुभ्यं
    हररूपिणि ते नमः । कल्याणि हे नमस्तुभ्यं हररूपिणि ते नमः ॥ १७॥ मङ्गले हे नमस्तुभ्यं नमस्ते सिद्धिरूपिणि
    । नमस्ते मङ्गले नित्ये कोणविंशतिसंयुते ॥ १८॥ कामावसायिते कीर्ते नमस्तुभ्य नमोनमः । मनोरूपि नमस्तुभ्यं
    नमस्तुभ्यं नमोनमः ॥ १८॥ बुद्ध मातर्नमस्तुभ्यं विलक्षणि नमोनमः । नानारूपमयितुभ्यं नमस्तुभ्यं नमोनमः
    ॥ २०॥ य इदं पठतिस्तोत्रं त्रिसन्ध्यं शिवसन्निधौ । सहसा मन्त्रसिद्धिः स्यात् लक्षावर्त्तनमात्रतः ॥
    २१॥ एतत् स्तोत्रं महेशानि कलिकाले पठेत् सुधीः । एतत् स्तोत्रं विना देवि
