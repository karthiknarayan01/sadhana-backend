id: tandirishikritamshivastotram
category: stotram
name:
  english: tandirishikritamshivastotram
  devanagari: तण्डिऋषिकृतंशिवस्तोत्रम्
content:
  english: tandirishikritam shivastotram sa drishtavanmahadevamastaushicca stavairvibhum | pavitranam
    pavitrastvam gatirgatimatam vara | atyugram tejasam tejastapasam paramam tapah || 13|| vishvavasuhiranyakshapuruhutanamaskrita
    | bhurikalyanada vibho purusatya namo'stu te || 14|| jatimaranabhirunam yatinam yatatam vibho | nirvanada
    sahasramsho namaste'stu sukhashraya || 15|| brahma shatakraturvishnurvishvedeva maharshayah | na vidustvam
    tu tattvena kuto vetsyamahe vayam || 16|| tvattah pravartate kalastvayi kalashca liyate | kalakhyah
    purushakhyashca brahmakhyashca tvameva hi || 17|| tanavaste smritastisrah puranajnaih surarshibhih
    | adhipaurushamadhyatmamadhibhutadhidaivatam | adhilokyadhivijnanamadhiyajnastvameva hi || 18|| tvam
    viditva''tmadehastham durvidam daivatairapi | vidvamso yanti nirmuktah param bhavamanamayam || 19||
    anicchatastava vibho janmamrityuranekatah | dvaram tvam svargamokshanamakshepta tvam dadasi ca ||
    20|| tvameva mokshah svargashca kamah krodhastvameva hi | sattvam rajastamashcaiva adhashcordhvam
    tvameva hi || 21|| brahma vishnushca rudrashca skandendrau savita yamah | varunendu manurdhata vidhata
    tvam dhaneshvarah || 22|| bhurvayurjyotirapashca vagbuddhistvam matirmanah | karma satyanrite cobhe
    tvamevasti ca nasti ca || 23|| indriyanindriyarthashca tatparam prakriterdhruvam | vishvavishvaparo
    bhavashcintyacintyastvameva hi || 24|| yaccaitatparamam brahma yacca tatparamam padam | ya gatih sankhyayoganam
    sa bhavannatra samshayah || 25|| nunamadya kritarthah sma nunam praptah satam gatim | yam gatim prapnuvantiha
    jnananirmalabuddhayah || 26|| aho mudhah sma suciramimam kalamacetasah | yanna vidmah param devam
    shashvatam yam vidurbudhah || 27|| so'yamasaditah sakshadbahubhirjanmabhirmaya | bhaktanugrahakriddevo
    yam jnatvamritamashnute || 28|| devasuramanushyanam yacca guhyam sanatanam | guhayam nihitam brahma
    durvijneyam surairapi || 29|| sa esha bhagavandevah sarvakritsarvatomukhah | sarvatma sarvadarshi
    ca sarvagah sarvavedita || 30|| pranakritpranabhritprani pranadah praninam gatih | dehakriddehabhriddehi
    dehabhugdehinam gatih || 31|| adhyatmagatinishthanam dhyaninamatmavedinam | apunarmarakamanam ya gatih
    so'yamishvarah || 32|| ayam ca sarvabhutanam shubhashubhagatipradah | ayam ca janmamarane vidadhyatsarvajantushu
    || 33|| ayam ca siddhikamanamrishinam siddhidah prabhuh | ayam ca mokshakamanam dvijanam mokshadah
    prabhuh || 34|| bhuradyansarvabhuvananutpadya sadivaukasah | vibharti devastanubhirashtabhishca dadati
    ca || 35|| atah pravartate sarvamasminsarvam pratishthitam | asmimshca pralayam yati ayamekah sanatanah
    || 36|| ayam sa satyakamanam satyalokah parah satam | apavargashca muktanam kaivalyam catmavadinam
    || 37|| ayam brahmadibhih siddhairguhayam gopitah prabhuh | devasuramanushyanam na prakasho bhavediti
    || 38|| tam tvam devasuranarastattvena na vidurbhavam | mohitah khalvanenaiva hricchayena praveshitah
    || 39|| ye cainam samprapadyante bhaktiyogena bharata | teshamevatmanatmanam darshayatyesha hricchayah
    || 40|| yam jnatva na punarjanma maranam capi vidyate | yam viditva param vedyam veditavyam na vidyate
    || 41|| yam labdhva paramam labham manyate nadhikam punah | pranasukshmam param praptimagacchatyakshayavaham
    || 42|| yam sankhya gunatattvajnah sankhyashastravisharadah | sukshmajnanaratah purvam jnatva mucyanti
    bandhanaih || 43|| yam ca vedavido vedyam vedanteshu pratishthitam | pranayamapara nityam yam vishanti
    japanti ca || 44|| ayam sa devayananamadityo dvaramucyate | ayam ca pitriyananam candrama dvaramucyate
    || 45|| esha kalagatishcitra samvatsarayugadishu | bhavabhavau tadatve ca ayane dakshinottare || 46||
    evam prajapatih purvamaradhya bahubhih stavaih | varayamasa putratve nilalohitasamjnitam || 47|| rigbhiryamanushamsanti
    tantre karmani bahvricah | yajurbhiryam tridha vedyam juhvatyadhvaryavo'dhvare || 48|| samabhiryam
    ca gayanti samagah shuddhabuddhayah | yajnasya parama yonih patishcayam parah smritah || 49|| ratryahahshrotranayanah
    pakshamasashirobhujah | rituviryastapo dhairyo hyabdaguhyorupadavan || 50|| mrityuryamo hutashashca
    kalah samharavegavan | kalasya parama yonih kalashcayam sanatanah || 51|| candradityau sanakshatrau
    sagrahau saha vayuna | dhruvah saptarshayashcaiva bhuvanah sapta eva ca || 52|| pradhanam mahadavyaktam
    visheshantam savaikritam | brahmadi stambaparyantam bhutadi sadasacca yat || 53|| ashtau prakritayashcaiva
    prakritibhyashca yatparam | asya devasya yadbhagam kritsnam samparivartate || 54|| etatparamamanandam
    yattacchashvatameva ca | esha gatirviraktanamesha bhavah parah satam || 55|| etatpadamanudvignametadbrahma
    sanatanam | shastravedangavidushametaddhyanam param padam || 56|| iyam sa parama kashtha iyam sa parama
    kala | iyam sa parama siddhiriyam sa parama gatih || 57|| iyam sa parama shantiriyam sa nirvritih
    para | yam prapya kritakrityah sma ityamanyanta vedhasah || 58|| iyam tushtiriyam siddhiriyam shrutiriyam
    smritih | adhyatmagatinishthanam vidusham praptiravyaya || 59|| yajatam yajnakamanam yajnairvipuladakshinaih
    | ya gatirdaivatairdivya sa gatistvam sanatana || 60|| japyahomavrataih kricchrairniyamairdehapatanaih
    | tapyatam ya gatirdeva vairaje sa gatirbhavan || 61|| karmanyasakritanam ca viraktanam tatastatah
    | ya gatirbrahmabhavane sa gatistvam sanatana || 62|| apunarmarakamanam vairagye vartatam pare | vikritinam
    layanam ca sa gatistvam sanatana || 63|| jnanavijnananishthanam nirupakhya niranjana | kaivalya ya
    gatirdeva parama sa gatirbhavan || 64|| vedashastrapuranoktah pancaita gatayah smritah | tvatprasadaddhi
    labhyante na labhyante'nyatha vibho || 65|| iti tandistapoyogattushtaveshanamavyayam | jagau ca paramam
    brahma yatpura lokakrijjagau || 66|| iti mahabharate anushasanaparvani 16 adhyayantargatam tandirishikritam
    shivastotram sampurnam | mahabharata | anuparva | adhyaya 16
  devanagari: तण्डिऋषिकृतं शिवस्तोत्रम् स दृष्टवान्महादेवमस्तौषीच्च स्तवैर्विभुम् । पवित्राणां पवित्रस्त्वं
    गतिर्गतिमतां वर । अत्युग्रं तेजसां तेजस्तपसां परमं तपः ॥ १३॥ विश्वावसुहिरण्याक्षपुरुहूतनमस्कृत । भूरिकल्याणद
    विभो पुरुसत्य नमोऽस्तु ते ॥ १४॥ जातीमरणभीरूणां यतीनां यततां विभो । निर्वाणद सहस्रांशो नमस्तेऽस्तु
    सुखाश्रय ॥ १५॥ ब्रह्मा शतक्रतुर्विष्णुर्विश्वेदेवा महर्षयः । न विदुस्त्वां तु तत्त्वेन कुतो वेत्स्यामहे
    वयम् ॥ १६॥ त्वत्तः प्रवर्तते कालस्त्वयि कालश्च लीयते । कालाख्यः पुरुषाख्यश्च ब्रह्माख्यश्च त्वमेव
    हि ॥ १७॥ तनवस्ते स्मृतास्तिस्रः पुराणज्ञैः सुरर्षिभिः । अधिपौरुषमध्यात्ममधिभूताधिदैवतम् । अधिलोक्याधिविज्ञानमधियज्ञस्त्वमेव
    हि ॥ १८॥ त्वां विदित्वाऽऽत्मदेहस्थं दुर्विदं दैवतैरपि । विद्वांसो यान्ति निर्मुक्ताः परं भावमनामयम्
    ॥ १९॥ अनिच्छतस्तव विभो जन्ममृत्युरनेकतः । द्वारं त्वं स्वर्गमोक्षाणामाक्षेप्ता त्वं ददासि च ॥ २०॥
    त्वमेव मोक्षः स्वर्गश्च कामः क्रोधस्त्वमेव हि । सत्त्वं रजस्तमश्चैव अधश्चोर्ध्वं त्वमेव हि ॥ २१॥ ब्रह्मा
    विष्णुश्च रुद्रश्च स्कन्देन्द्रौ सविता यमः । वरुणेन्दू मनुर्धाता विधाता त्वं धनेश्वरः ॥ २२॥ भूर्वायुर्ज्योतिरापश्च
    वाग्बुद्धिस्त्वं मतिर्मनः । कर्म सत्यानृते चोभे त्वमेवास्ति च नास्ति च ॥ २३॥ इन्द्रियाणीन्द्रियार्थाश्च
    तत्परं प्रकृतेर्ध्रुवम् । विश्वाविश्वपरो भावश्चिन्त्याचिन्त्यस्त्वमेव हि ॥ २४॥ यच्चैतत्परमं ब्रह्म
    यच्च तत्परमं पदम् । या गतिः साङ्ख्ययोगानां स भवान्नात्र संशयः ॥ २५॥ नूनमद्य कृतार्थाः स्म नूनं प्राप्ताः
    सतां गतिम् । यां गतिं प्राप्नुवन्तीह ज्ञाननिर्मलबुद्धयः ॥ २६॥ अहो मूढाः स्म सुचिरमिमं कालमचेतसः ।
    यन्न विद्मः परं देवं शाश्वतं यं विदुर्बुधाः ॥ २७॥ सोऽयमासादितः साक्षाद्बहुभिर्जन्मभिर्मया । भक्तानुग्रहकृद्देवो
    यं ज्ञात्वामृतमश्नुते ॥ २८॥ देवासुरमनुष्याणां यच्च गुह्यं सनातनम् । गुहायां निहितं ब्रह्म दुर्विज्ञेयं
    सुरैरपि ॥ २९॥ स एष भगवान्देवः सर्वकृत्सर्वतोमुखः । सर्वात्मा सर्वदर्शी च सर्वगः सर्ववेदिता ॥ ३०॥ प्राणकृत्प्राणभृत्प्राणी
    प्राणदः प्राणिनां गतिः । देहकृद्देहभृद्देही देहभुग्देहिनां गतिः ॥ ३१॥ अध्यात्मगतिनिष्ठानां ध्यानिनामात्मवेदिनाम्
    । अपुनर्मारकामानां या गतिः सोऽयमीश्वरः ॥ ३२॥ अयं च सर्वभूतानां शुभाशुभगतिप्रदः । अयं च जन्ममरणे विदध्यात्सर्वजन्तुषु
    ॥ ३३॥ अयं च सिद्धिकामानामृषीणां सिद्धिदः प्रभुः । अयं च मोक्षकामानां द्विजानां मोक्षदः प्रभुः ॥ ३४॥
    भूराद्यान्सर्वभुवनानुत्पाद्य सदिवौकसः । विभर्ति देवस्तनुभिरष्टाभिश्च ददाति च ॥ ३५॥ अतः प्रवर्तते सर्वमस्मिन्सर्वं
    प्रतिष्ठितम् । अस्मिंश्च प्रलयं याति अयमेकः सनातनः ॥ ३६॥ अयं स सत्यकामानां सत्यलोकः परः सताम् । अपवर्गश्च
    मुक्तानां कैवल्यं चात्मवादिनाम् ॥ ३७॥ अयं ब्रह्मादिभिः सिद्धैर्गुहायां गोपितः प्रभुः । देवासुरमनुष्याणां
    न प्रकाशो भवेदिति ॥ ३८॥ तं त्वां देवासुरनरास्तत्त्वेन न विदुर्भवम् । मोहिताः खल्वनेनैव हृच्छयेन प्रवेशिताः
    ॥ ३९॥ ये चैनं सम्प्रपद्यन्ते भक्तियोगेन भारत । तेषामेवात्मनात्मानं दर्शयत्येष हृच्छयः ॥ ४०॥ यं ज्ञात्वा
    न पुनर्जन्म मरणं चापि विद्यते । यं विदित्वा परं वेद्यं वेदितव्यं न विद्यते ॥ ४१॥ यं लब्ध्वा परमं लाभं
    मन्यते नाधिकं पुनः । प्राणसूक्ष्मां परां प्राप्तिमागच्छत्यक्षयावहाम् ॥ ४२॥ यं साङ्ख्या गुणतत्त्वज्ञाः
    साङ्ख्यशास्त्रविशारदाः । सूक्ष्मज्ञानरताः पूर्वं ज्ञात्वा मुच्यन्ति बन्धनैः ॥ ४३॥ यं च वेदविदो वेद्यं
    वेदान्तेषु प्रतिष्ठितम् । प्राणायामपरा नित्यं यं विशन्ति जपन्ति च ॥ ४४॥ अयं स देवयानानामादित्यो द्वारमुच्यते
    । अयं च पितृयानानां चन्द्रमा द्वारमुच्यते ॥ ४५॥ एष कालगतिश्चित्रा संवत्सरयुगादिषु । भावाभावौ तदात्वे
    च अयने दक्षिणोत्तरे ॥ ४६॥ एवं प्रजापतिः पूर्वमाराध्य बहुभिः स्तवैः । वरयामास पुत्रत्वे नीललोहितसंज्ञितम्
    ॥ ४७॥ ऋग्भिर्यमनुशंसन्ति तन्त्रे कर्मणि बह्वृचः । यजुर्भिर्यं त्रिधा वेद्यं जुह्वत्यध्वर्यवोऽध्वरे
    ॥ ४८॥ सामभिर्यं च गायन्ति सामगाः शुद्धबुद्धयः । यज्ञस्य परमा योनिः पतिश्चायं परः स्मृतः ॥ ४९॥ रात्र्यहःश्रोत्रनयनः
    पक्षमासशिरोभुजः । ऋतुवीर्यस्तपो धैर्यो ह्यब्दगुह्योरुपादवान् ॥ ५०॥ मृत्युर्यमो हुताशश्च कालः संहारवेगवान्
    । कालस्य परमा योनिः कालश्चायं सनातनः ॥ ५१॥ चन्द्रादित्यौ सनक्षत्रौ सग्रहौ सह वायुना । ध्रुवः सप्तर्षयश्चैव
    भुवनाः सप्त एव च ॥ ५२॥ प्रधानं महदव्यक्तं विशेषान्तं सवैकृतम् । ब्रह्मादि स्तम्बपर्यन्तं भूतादि सदसच्च
    यत् ॥ ५३॥ अष्टौ प्रकृतयश्चैव प्रकृतिभ्यश्च यत्परम् । अस्य देवस्य यद्भागं कृत्स्नं सम्परिवर्तते ॥ ५४॥
    एतत्परममानन्दं यत्तच्छाश्वतमेव च । एषा गतिर्विरक्तानामेष भावः परः सताम् ॥ ५५॥ एतत्पदमनुद्विग्नमेतद्ब्रह्म
    सनातनम् । शास्त्रवेदाङ्गविदुषामेतद्ध्यानं परं पदम् ॥ ५६॥ इयं सा परमा काष्ठा इयं सा परमा कला । इयं
    सा परमा सिद्धिरियं सा परमा गतिः ॥ ५७॥ इयं सा परमा शान्तिरियं सा निर्वृतिः परा । यं प्राप्य कृतकृत्याः
    स्म इत्यमन्यन्त वेधसः ॥ ५८॥ इयं तुष्टिरियं सिद्धिरियं श्रुतिरियं स्मृतिः । अध्यात्मगतिनिष्ठानां विदुषां
    प्राप्तिरव्यया ॥ ५९॥ यजतां यज्ञकामानां यज्ञैर्विपुलदक्षिणैः । या गतिर्दैवतैर्दिव्या सा गतिस्त्वं सनातन
    ॥ ६०॥ जप्यहोमव्रतैः कृच्छ्रैर्नियमैर्देहपातनैः । तप्यतां या गतिर्देव वैराजे सा गतिर्भवान् ॥ ६१॥ कर्मन्यासकृतानां
    च विरक्तानां ततस्ततः । या गतिर्ब्रह्मभवने सा गतिस्त्वं सनातन ॥ ६२॥ अपुनर्मारकामानां वैराग्ये वर्ततां
    परे । विकृतीनां लयानां च सा गतिस्त्वं सनातन ॥ ६३॥ ज्ञानविज्ञाननिष्ठानां निरुपाख्या निरञ्जना । कैवल्या
    या गतिर्देव परमा सा गतिर्भवान् ॥ ६४॥ वेदशास्त्रपुराणोक्ताः पञ्चैता गतयः स्मृताः । त्वत्प्रसादाद्धि
    लभ्यन्ते न लभ्यन्तेऽन्यथा विभो ॥ ६५॥ इति तण्डिस्तपोयोगात्तुष्टावेशानमव्ययम् । जगौ च परमं ब्रह्म यत्पुरा
    लोककृज्जगौ ॥ ६६॥ इति महाभारते अनुशासनपर्वणि १६ अध्यायान्तर्गतं तण्डिऋषिकृतं शिवस्तोत्रं सम्पूर्णम्
    । महाभारत । अनुपर्व । अध्याय १६
