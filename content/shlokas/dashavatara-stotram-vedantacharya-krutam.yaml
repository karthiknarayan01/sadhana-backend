id: dashavatara-stotram-vedantacharya-krutam
category: stotram
name:
  english: Dashavatara Stotram (Vedantacharya Krutam)
  devanagari: दशावतारस्तोत्रम् ०१ (नमोऽस्तु नारायणमन्दिराय)
content:
  english: namo'stu narayanamandiraya namo'stu harayanakandharaya | namo'stu matsyaya layabdhigaya namo'stu
    kurmaya payobdhigaya | namo varahaya dharadharaya namo nrisimhaya paratparaya || 2|| namo'stu shakrashraya-vamanaya
    namo'stu viprotsava-bhargavaya | namo'stu sitahita-raghavaya namo'stu parthastuta-yadavaya || 3||
    namo'stu buddhaya vimohakaya namo'stu te kalki-payoditaya | namo'stu purnamitasadgunaya samasta-nathaya
    hayananaya || 4|| karastha-shankhollasa-dakshamala-prabodha-mudrabhaya-pustakaya | namo'stu vaktrodgira-dagamaya
    nirasta heyaya hayananaya || 5|| ramasamakara-catushtayena kramaccaturdikshu nishevitaya | namo'stu
    parshvadvayaga-dvirupashriyabhishiktaya hayananaya || 6|| kirita-pattangada-hara-kanci-suratnapitambara-nupuradyaih
    | virajitangaya namo'stu tubhyam suraih paritaya hayananaya || 7|| vidosha-kotindu-nibhaprabhaya visheshato
    madhva-muni-priyaya| vimuktavandyaya namo'stu vishvagvidhuta-vighnaya hayananaya || 8|| namo'stu shishteshtada
    vadirajakritashtakabhishtuta-ceshtitaya | dasavatarai-stridasarthadaya nishesha-bimbastha hayananaya
    || 9|| namo'stu parayanacarcitaya namo'stu narayan te'rcitaya || 1|| || iti vadirajapujyacarana-viracitam
    dashavatarastotram sampurnam ||
  devanagari: नमोऽस्तु नारायणमन्दिराय नमोऽस्तु हारायणकन्धराय । नमोऽस्तु मत्स्याय लयाब्धिगाय नमोऽस्तु कूर्माय
    पयोब्धिगाय । नमो वराहाय धराधराय नमो नृसिंहाय परात्पराय ॥ २॥ नमोऽस्तु शक्राश्रय-वामनाय नमोऽस्तु विप्रोत्सव-भार्गवाय
    । नमोऽस्तु सीताहित-राघवाय नमोऽस्तु पार्थस्तुत-यादवाय ॥ ३॥ नमोऽस्तु बुद्धाय विमोहकाय नमोऽस्तु ते कल्कि-पयोदिताय
    । नमोऽस्तु पूर्णामितसद्गुणाय समस्त-नाथाय हयाननाय ॥ ४॥ करस्थ-शङ्खोल्लस-दक्षमाला-प्रबोध-मुद्राभय-पुस्तकाय
    । नमोऽस्तु वक्त्रोद्गिर-दागमाय निरस्त हेयाय हयाननाय ॥ ५॥ रमासमाकार-चतुष्टयेन क्रमाच्चतुर्दिक्षु निषेविताय
    । नमोऽस्तु पार्श्वद्वयग-द्विरूपश्रियाभिषिक्ताय हयाननाय ॥ ६॥ किरीट-पट्टाङ्गद-हार-काञ्ची-सुरत्नपीतांबर-नूपुराद्यैः
    । विराजिताङ्गाय नमोऽस्तु तुभ्यं सुरैः परीताय हयाननाय ॥ ७॥ विदोष-कोटीन्दु-निभप्रभाय विशेषतो मध्व-मुनि-प्रियाय।
    विमुक्तवन्द्याय नमोऽस्तु विश्वग्विधूत-विघ्नाय हयाननाय ॥ ८॥ नमोऽस्तु शिष्टेष्टद वादिराजकृताष्टकाभिष्टुत-चेष्टिताय
    । दसावतारै-स्त्रिदसार्थदाय निशेश-बिंबस्थ हयाननाय ॥ ९॥ नमोऽस्तु पारायणचर्चिताय नमोऽस्तु नारायण् तेऽर्चिताय
    ॥ १॥ ॥ इति वादिराजपूज्यचरण-विरचितं दशावतारस्तोत्रं सम्पूर्णम् ॥
