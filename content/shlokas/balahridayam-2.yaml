id: balahridayam-2
category: hridaya
name:
  english: balahridayam 2
  devanagari: बालाहृदयम् २
content:
  english: vande devim shivam balam bhasvanmandalamadhyagam | cancaccandrananam taptacamikarasamaprabham
    || 1|| nrityatkhannanetrasya locanatyantavallabham | madhyabhage lasatkanci manimuktavinirmitam ||
    2|| padavinyastahamsalim shukanasavirajitam | karishundoruyugalam mattakokilanih svanam || 3|| pustakam
    japamalanca varadabhayapaninim | kumariveshashobhadhyam kumarivrindamanditam || 4|| vidrumadharashobhadhyam
    vidrumalinakhalikam | kkanatkancim kalanathasamanarucirananam || 5|| mrinalabahulatikam nanaratnavirajitam
    | karapadmasamanabham padapadmavirajitam || 6|| carucampeyavasanam devadevanamaskritam | candanenduvilaptangim
    romarajivicitritam || 7|| tilapushpasamanabham nasaratnasamanvitam | gajagandanitambabham rambhajanghavirajitam
    || 8|| haravishnumahendradyaih pujyashripadapankajam | kalyanim kamalam kalim kuncikam kamaleshvarim
    || 9|| pavanim paramam shaktim pavitram pavanim shivam | bhavanim bhavapashaghnim bhitiham bhuvaneshvarim
    || 10|| bhavanim bhavashaktinca bherundam mundamalinim | jalandharagiryutsangam purnagiryanuraginim
    || 11|| kamarupam ca kamakhyam devikotakritalayam | onkarapithanilayam mahamayam maheshvarim || 12||
    vishveshvarim ca madhuram nanarupakritapurim | aim klim sauh tryaksharam balam tadvilomam kumarikam
    || 13|| hyaih aim hamsah namo devi tripuram jivabhairavim | narado yasya devarshih mahashantiphalapradam
    || 14|| om namo shrimahalakshmyai lakshmim tripurabhairavim | om hrim jum sah pranagranthih dvidhargakavacadvayam
    || 15|| iyam sanjivini devi mritan jivatvadayini | phreh phram na pha la va ra yum shrom shrom amritamavadet
    || 16|| sravaya sravaya tatha vrim vrim mrityunjayabhidha | om namo prathamamabhashya kalibijam dvidha
    pathet || 17|| kurcadvayam tatha maya agamipadamavadet | mrityum chindi tatha bhindi mahamrityunjayo
    bhavet || 18|| tava shabdam mamabhashya khadgena ca vidaraya | dvidha bhashya maheshani tadante vahnisundari
    || 19|| iyam devi mahavidya agami kalavancini | pratardipadalakaram vagbhavam rasanatale || 20|| vicintya
    prajapetacca mahakavirbhaveddhruvam | madhyahne kamarajakhyam japakusumasannibham || 21|| vicintya
    hridi madhye tu tacca mantram japetpriye | dharmarthakamamokshanam bhajano jayate dhruvam || 22||
    tartiyam candrasankasham sayankale vicintya ca | prajapettatra deveshi jayate madanopamah || 23||
    vagbhavam kamarajam tu tartiyam vahnivallabham | ayutam prajapennityam agami kalo vancyate || 24||
    trikonam cakramalikhya mayayuktam maheshvari | tasyopari samastirya casanam raktavarnakam | tasyopari
    visheddevi sadhakah pranmukho nishi || 26|| kramena prajapedvarnan vagadi niyatah shucih | mandalatritaye
    devi prapyate siddhiruttama || 27|| navayonyatmakam cakram pujayecchastravartmana | prajaped dvayaksharim
    balam sarvasiddhishvaro bhavet || 28|| yam yam cintayate kamam tam tam prapnoti sarvashah | idam tu
    hridayam devi tavagre kathitam maya || 29|| mama bhagyam ca sarvasvam brahmadinam ca durlabham | gopaniyam
    tvaya bhadre svayoniriva parvati || 30|| shatavartena deveshi manushi vashamapnuyat | sahasravartanaddevi
    deva vai vashamapnuyuh || 31|| lakshamavartanaddevi shunasirah svakasanat | kshanaccyavati tatra vai
    kim punah kshudrajantavah || 32|| tasmatsarvaprayatnena jnatva devi japenmanum | sarvasiddhimapapnoti
    sarvada sukhavanbhavet || 33||
  devanagari: वन्दे देवीं शिवां बालां भास्वन्मण्डलमध्यगाम् । चञ्चच्चन्द्राननां तप्तचामीकरसमप्रभाम् ॥ १॥
    नृत्यत्खञ्ननेत्रस्य लोचनात्यन्तवल्लभाम् । मध्यभागे लसत्काञ्ची मणिमुक्ताविनिर्मिताम् ॥ २॥ पदविन्यस्तहंसालीं
    शुकनासाविराजिताम् । करिशुण्डोरुयुगलां मत्तकोकिलनिः स्वानाम् ॥ ३॥ पुस्तकं जपमालाञ्च वरदाभयपाणिनीम्
    । कुमारीवेशशोभाढ्यां कुमारीवृन्दमण्डिताम् ॥ ४॥ विद्रुमाधरशोभाढ्यां विद्रुमालिनखालिकाम् । क्कणत्काञ्चीं
    कलानाथसमानरुचिराननाम् ॥ ५॥ मृणालबाहुलतिकां नानारत्नविराजिताम् । करपद्मसमानाभां पादपद्मविराजिताम् ॥
    ६॥ चारुचाम्पेयवसनां देवदेवनमस्कृताम् । चन्दनेन्दुविलप्ताङ्गीं रोमराजीविचित्रिताम् ॥ ७॥ तिलपुष्पसमानाभां
    नासारत्नसमन्विताम् । गजगण्डनितम्बाभां रम्भाजङ्घाविराजिताम् ॥ ८॥ हरविष्णुमहेन्द्राद्यैः पूज्यश्रीपादपङ्कजाम्
    । कल्याणीं कमलां कालीं कुञ्चिकां कमलेश्वरीम् ॥ ९॥ पावनीं परमां शक्तिं पवित्रां पावनीं शिवाम् । भवानीं
    भवपाशघ्नीं भीतिहां भुवनेश्वरीम् ॥ १०॥ भवानीं भवशक्तिञ्च भेरुण्डां मुण्डमालिनीम् । जलन्धरगिर्युत्सङ्गां
    पूर्णगिर्यनुरागिणीम् ॥ ११॥ कामरूपां च कामाख्यां देवीकोटकृतालयाम् । ओङ्कारपीठनिलयां महामायां महेश्वरीम्
    ॥ १२॥ विश्वेश्वरीं च मधुरां नानारूपाकृतापुरीम् । ऐं क्लीं सौः त्र्यक्षरां बालां तद्विलोमां कुमारिकाम्
    ॥ १३॥ ह्यैः ऐं हंसः नमो देवि त्रिपुरां जीवभैरवीम् । नारदो यस्य देवर्षिः महाशान्तिफलप्रदाम् ॥ १४॥ ॐ
    नमो श्रीमहालक्ष्म्यै लक्ष्मीं त्रिपुरभैरवीम् । ॐ ह्रीं जूं सः प्राणग्रन्थिः द्विधार्गकवचद्वयम् ॥ १५॥
    इयं सञ्जीविनी देवी मृतान् जीवत्वदायिनी । फ्रेः फ्रं न फ ल व र यूं श्रों श्रों अमृतमावदेत् ॥ १६॥ स्रावय
    स्रावय तथा व्रीं व्रीं मृत्युञ्जयाभिधा । ॐ नमो प्रथममाभाष्य कालीबीजं द्विधा पठेत् ॥ १७॥ कूर्चद्वयं
    तथा माया आगामिपदमावदेत् । मृत्युं छिन्दि तथा भिन्दि महामृत्युञ्जयो भवेत् ॥ १८॥ तव शब्दं ममाभाष्य खड्गेन
    च विदारय । द्विधा भाष्य महेशानि तदन्ते वह्निसुन्दरी ॥ १९॥ इयं देवी महाविद्या आगामि कालवञ्चिनी । प्रातर्दीपदलाकारं
    वाग्भवं रसनातले ॥ २०॥ विचिन्त्य प्रजपेतच्च महाकविर्भवेद्ध्रुवम् । मध्याह्ने कामराजाख्यं जपाकुसुमसन्निभम्
    ॥ २१॥ विचिन्त्य हृदि मध्ये तु तच्च मन्त्रं जपेत्प्रिये । धर्मार्थकाममोक्षाणां भाजनो जायते ध्रुवम्
    ॥ २२॥ तार्तीयं चन्द्रसङ्काशं सायङ्काले विचिन्त्य च । प्रजपेत्तत्र देवेशि जायते मदनोपमः ॥ २३॥ वाग्भवं
    कामराजं तु तार्तीयं वह्निवल्लभाम् । अयुतं प्रजपेन्नित्यं आगामी कालो वञ्च्यते ॥ २४॥ त्रिकोणं चक्रमालिख्य
    मायायुक्तं महेश्वरि । तस्योपरि समास्तीर्य चासनं रक्तवर्णकम् । तस्योपरि विशेद्देवि साधकः प्राङ्मुखो
    निशि ॥ २६॥ क्रमेण प्रजपेद्वर्णान् वागादि नियतः शुचिः । मण्डलत्रितये देवि प्राप्यते सिद्धिरुत्तमा ॥
    २७॥ नवयोन्यात्मकं चक्रं पूजयेच्छास्त्रवर्त्मना । प्रजपेद् द्वयक्षरीं बालां सर्वसिद्धीश्वरो भवेत् ॥
    २८॥ यं यं चिन्तयते कामं तं तं प्राप्नोति सर्वशः । इदं तु हृदयं देवि तवाग्रे कथितं मया ॥ २९॥ मम भाग्यं
    च सर्वस्वं ब्रह्मादीनां च दुर्लभम् । गोपनीयं त्वया भाद्रे स्वयोनिरिव पार्वति ॥ ३०॥ शतवर्तेन देवेशि
    मानुषी वशमाप्नुयात् । सहस्रावर्तनाद्देवि देवा वै वशमाप्नुयुः ॥ ३१॥ लक्षमावर्तनाद्देवि शुनासीरः स्वकासनात्
    । क्षणाच्च्यवति तत्र वै किं पुनः क्षुद्रजन्तवः ॥ ३२॥ तस्मात्सर्वप्रयत्नेन ज्ञात्वा देवि जपेन्मनुम्
    । सर्वसिद्धिमपाप्नोति सर्वदा सुखवान्भवेत् ॥ ३३॥
