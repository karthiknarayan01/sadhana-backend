id: munibhihkritam1shrikrishnastotram
category: stotram
name:
  english: munibhihkritam1shrikrishnastotram
  devanagari: मुनिभिःकृतं१श्रीकृष्णस्तोत्रम्
content:
  english: munibhih kritam 1 shrikrishnastotram brahmovaca | nathanirvacaniyo'si bhaktanugrahavigrahah
    | vedanirvacaniyam ca kastvam stotumiheshvarah || 19|| mahadeva uvaca | deheshu dehinam shashvatsthitam
    nirliptameva ca | karminam karmanam shuddham sakshinam sakshatam vibhum | kim staumi rupashunyam ca
    gunashunyam ca nirgunam || 20|| ananta uvaca | kimva janamyaham natha tvamajno'nantamishvaram | anantakotibrahmandakaranam
    duhkhataranam || 21|| mahavishnoshca lomnam ca vivareshu jaleshu ca | santi vishvanyasankhyani citrani
    kritrimani ca || 22|| santi santashca devashca brahmavishnushivatmakah | tvadamshah pratibimbeshu
    tirthani bharatam tatha || 23|| brahmandaikasthito'ham ca sukshmanagasvarupakah | sthapitashca tvaya
    kurme gajendre mashako yatha || 24|| paramanuparam sukshmam vishveshu nasti kutracit | mahavishnoh
    param sthulam samo nasti ca kutracit || 25|| mahavishnoh parastvam ca tvatparo nasti kashcana | sthulatsthulataro
    devah sukshmatsukshmatamo mahan || 26|| adharashca mahavishno jalarupo bhavansvayam | jaladharo hi
    golokastvam ca sthavararupadhrik || 27|| sarvadharo mahanvayuh shvasanihshvasarupakah | bhaktanugrahadehasya
    nityasya bhavato vibho || 28|| vaktrairbahutarairva'tha tvaya dattaih puraiva ca | stotumicchami tvadyogam
    na dattam jnanamaishvaram || 29|| deva ucuh | tvamanantam yadi stotum devo'nanto na hishvarah | na
    hi svayam vidhata ca na hi jnanatmakah shivah | sarasvati jadibhuta kim kurmah stavanam vayam || 30||
    munindra ucuh | veda na shaktah stotum cettvam caiva jnatumishvaram | vayam vedavidah santah kim kurmah
    stavanam tava || 31|| idam stotram mahapunyam devaishca munimih kritam | yah pathetsamyatah shuddhah
    pujakale ca bhaktitah || 32|| iha loke sukham bhuktva labdhva jnanam niranjanam | ratnayanam samaruhya
    golokam sa ca gacchati || 33|| iti shribrahmavaivartapurane shrikrishnajanmakhande uttare shatatamadhyayantargatam
    brahmadidevaih munibhishca kritam shrikrishnastotram samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: मुनिभिः कृतं १ श्रीकृष्णस्तोत्रम् ब्रह्मोवाच । नाथानिर्वचनीयोऽसि भक्तानुग्रहविग्रहः । वेदानिर्वचनीयं
    च कस्त्वां स्तोतुमिहेश्वरः ॥ १९॥ महादेव उवाच । देहेषु देहिनां शश्वत्स्थितं निर्लिप्तमेव च । कर्मिणां
    कर्मणां शुद्धं साक्षिणां साक्षतं विभुम् । किं स्तौमि रूपशून्यं च गुणशून्यं च निर्गुणम् ॥ २०॥ अनन्त
    उवाच । किंवा जानाम्यहं नाथ त्वामज्ञोऽनन्तमीश्वरम् । अनन्तकोटिब्रह्माण्डकारणं दुःखतारणम् ॥ २१॥ महाविष्णोश्च
    लोम्नां च विवरेषु जलेषु च । सन्ति विश्वान्यसङ्ख्यानि चित्राणि कृत्रिमाणि च ॥ २२॥ सन्ति सन्तश्च देवाश्च
    ब्रह्मविष्णुशिवात्मकाः । त्वदंशाः प्रतिबिम्बेषु तीर्थानि भारतं तथा ॥ २३॥ ब्रह्माण्डैकस्थितोऽहं च सूक्ष्मनागस्वरूपकः
    । स्थापितश्च त्वया कूर्मे गजेन्द्रे मशको यथा ॥ २४॥ परमाणुपरं सूक्ष्मं विश्वेषु नास्ति कुत्रचित् ।
    महाविष्णोः परं स्थूलं समो नास्ति च कुत्रचित् ॥ २५॥ महाविष्णोः परस्त्वं च त्वत्परो नास्ति कश्चन । स्थूलात्स्थूलतरो
    देवः सूक्ष्मात्सूक्ष्मतमो महान् ॥ २६॥ आधारश्च महाविष्णो जलरूपो भवान्स्वयम् । जलाधारो हि गोलोकस्त्वं
    च स्थावररूपधृक् ॥ २७॥ सर्वाधारो महान्वायुः श्वासनिःश्वासरूपकः । भक्तानुग्रहदेहस्य नित्यस्य भवतो विभो
    ॥ २८॥ वक्त्रैर्बहुतरैर्वाऽथ त्वया दत्तैः पुरैव च । स्तोतुमिच्छामि त्वद्योगं न दत्तं ज्ञानमैश्वरम्
    ॥ २९॥ देवा ऊचुः । त्वामनन्तं यदि स्तोतुं देवोऽनन्तो न हीश्वरः । न हि स्वयं विधाता च न हि ज्ञानात्मकः
    शिवः । सरस्वती जडीभूता किं कुर्मः स्तवनं वयम् ॥ ३०॥ मुनीन्द्रा ऊचुः । वेदा न शक्ताः स्तोतुं चेत्त्वां
    चैव ज्ञातुमीश्वरम् । वयं वेदविदः सन्तः किं कुर्मः स्तवनं तव ॥ ३१॥ इदं स्तोत्रं महापुण्यं देवैश्च मुनिमिः
    कृतम् । यः पठेत्संयतः शुद्धः पूजाकाले च भक्तितः ॥ ३२॥ इह लोके सुखं भुक्त्वा लब्ध्वा ज्ञानं निरञ्जनम्
    । रत्नयानं समारुह्य गोलोकं स च गच्छति ॥ ३३॥ इति श्रीब्रह्मवैवर्तपुराणे श्रीकृष्णजन्मखण्डे उत्तरे शाततमाध्यायान्तर्गतं
    ब्रह्मादिदेवैः मुनिभिश्च कृतं श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
