id: maheshvarakritamgayatridevistotram
category: stotram
name:
  english: maheshvarakritamgayatridevistotram
  devanagari: महेश्वरकृतंगायत्रीदेवीस्तोत्रम्
content:
  english: maheshvarakritam gayatridevistotram maheshvara uvaca | jayasva devi gayatri mahamaye mahaprabhe
    | mahadevi mahabhage mahasattve mahotsave || 27|| divyagandhanuliptangi divyastragdamabhushite | vedamatarnamastubhyam
    tryaksharasthe maheshvari || 28|| trilokasthe tritattvasthe trivahnisthe trishulini | trinetre bhimavaktre
    ca bhimanetre bhayanake | kamalasanaje devi sarasvati namo'stu te || 29|| namah pankajapatrakshi mahamaye'mritastrave
    | sarvage sarvabhuteshi svahakare svadhe'mbike || 30|| sampurne purnacandrabhe bhasvarange bhavodbhave
    | mahavidye mahavedye mahadaityavinashini | mahabuddhyudbhave devi vitashoke kiratini || 31|| tvam
    nitistvam mahabhage tvam gistvam gaustvamaksharam | tvam dhistvam shristvamonkarastattve capi paristhita
    | sarvasattvahite devi namaste parameshvari || 32|| ityevam samstuta devi bhavena parameshthina |
    devairapi jayetyuccairityukta parameshvari || 33|| iti varahapurane ashtavimshadhyayantargatam maheshvarakritam
    gayatridevistotram samaptam | varahapurana | adhyaya 28
  devanagari: महेश्वरकृतं गायत्रीदेवीस्तोत्रम् महेश्वर उवाच । जयस्व देवि गायत्रि महामाये महाप्रभे । महादेवि
    महाभागे महासत्त्वे महोत्सवे ॥ २७॥ दिव्यगन्धानुलिप्ताङ्गि दिव्यस्त्रग्दामभूषिते । वेदमातर्नमस्तुभ्यं
    त्र्यक्षरस्थे महेश्वरि ॥ २८॥ त्रिलोकस्थे त्रितत्त्वस्थे त्रिवह्निस्थे त्रिशूलिनि । त्रिनेत्रे भीमवक्त्रे
    च भीमनेत्रे भयानके । कमलासनजे देवि सरस्वति नमोऽस्तु ते ॥ २९॥ नमः पङ्कजपत्राक्षि महामायेऽमृतस्त्रवे
    । सर्वगे सर्वभूतेशि स्वाहाकारे स्वधेऽम्बिके ॥ ३०॥ सम्पूर्णे पूर्णचन्द्राभे भास्वराङ्गे भवोद्भवे ।
    महाविद्ये महावेद्ये महादैत्यविनाशिनि । महाबुद्ध्युद्भवे देवि वीतशोके किरातिनि ॥ ३१॥ त्वं नीतिस्त्वं
    महाभागे त्वं गीस्त्वं गौस्त्वमक्षरम् । त्वं धीस्त्वं श्रीस्त्वमोङ्कारस्तत्त्वे चापि परिस्थिता । सर्वसत्त्वाहिते
    देवि नमस्ते परमेश्वरि ॥ ३२॥ इत्येवं संस्तुता देवी भवेन परमेष्ठिना । देवैरपि जयेत्युच्चैरित्युक्ता
    परमेश्वरी ॥ ३३॥ इति वराहपुराणे अष्टाविंशाध्यायान्तर्गतं महेश्वरकृतं गायत्रीदेवीस्तोत्रं समाप्तम् ।
    वराहपुराण । अध्याय २८
