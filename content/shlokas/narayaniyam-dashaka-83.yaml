id: narayaniyam-dashaka-83
category: stotram
name:
  english: Narayaniyam Dashaka 83
content:
  english: rame'tha gokulagate pramadaprasakte hutanupetayamunadamane madandhe | svairam samaramati sevakavadamudho
    dutam nyayunkta tava paundrakavasudevah || || narayano'hamavatirna ihasmi bhumau dhatse kila tvamapi
    mamakalakshanani | utsrijya tani sharanam vraja mamiti tvam duto jagada sakalairhasitah sabhayam ||
    || dute'tha yatavati yadavasainikaistvam yato dadarshitha vapuh kila paundrakiyam | tapena vakshasi
    kritankamanalpamulya shrikaustubham makarakundalapitacelam || || kalayasam nijasudarshanamasyato'sya
    kalanalotkarakirena sudarshanena | shirsham cakartitha mamarditha casya senam tanmitrakashipashiro'pi
    cakartha kashyam || || jalyena balakagira'pi kilahameva shrivasudeva iti rudhamatishciram sah | sayujyameva
    bhavadaikyadhiya gato'bhut ko nama kasya sukritam kathamityaveyat || || kashishvarasya tanayo'tha
    sudakshinakhyah sharvam prapujya bhavate vihitabhicarah | krityanalam kamapi banraranatibhitai rbhutaih
    kathancana vritaih samamabhyamuncat || || talapramanacaranamakhilam dahantim krityam vilokya cakitaih
    kathito'pi pauraih | dyutotsave kimapi no calito vibho tvam parshvasthamashu visasarjitha kalacakram
    || || abhyapatatyamitadhamni bhavanmahastre ha heti vidrutavati khalu ghorakritya| roshat sudakshinamadakshinaceshtitam
    tam puplosha cakramapi kashipurimadhakshit || || sa khalu vivido rakshoghate kritopakritih pura tava
    tu kalaya mrityum praptum tada khalatam gatah | narakasacivo deshaklesham srijan nagarantike jhatiti
    halina yudhyannaddha papata talahatah || || sambam kauravyaputriharananiyamitam santvanarthi kurunam
    yatastadvakyaroshoddhritakarinagaro mocayamasa ramah | te ghatyah pandaveyairiti yadupritanam namucastvam
    tadanim tam tvam durbodhalilam pavanapurapate tapashantyai nisheve ||
  devanagari: रामेऽथ गोकुलगते प्रमदाप्रसक्ते हूतानुपेतयमुनादमने मदान्धे । स्वैरं समारमति सेवकवादमूढो दूतं
    न्ययुङ्क्त तव पौण्ड्रकवासुदेवः ॥ ॥ नारायणोऽहमवतीर्ण इहास्मि भूमौ धत्से किल त्वमपि मामकलक्षणानि । उत्सृज्य
    तानि शरणं व्रज मामिति त्वां दूतो जगाद सकलैर्हसितः सभायाम् ॥ ॥ दूतेऽथ यातवति यादवसैनिकैस्त्वं यातो
    ददर्शिथ वपुः किल पौण्ड्रकीयम् । तापेन वक्षसि कृताङ्कमनल्पमूल्य श्रीकौस्तुभं मकरकुण्डलपीतचेलम् ॥ ॥
    कालायसं निजसुदर्शनमस्यतोऽस्य कालानलोत्करकिरेण सुदर्शनेन । शीर्षं चकर्तिथ ममर्दिथ चास्य सेनां तन्मित्रकाशिपशिरोऽपि
    चकर्थ काश्याम् ॥ ॥ जाल्येन बालकगिराऽपि किलाहमेव श्रीवासुदेव इति रूढमतिश्चिरं सः । सायुज्यमेव भवदैक्यधिया
    गतोऽभूत् को नाम कस्य सुकृतं कथमित्यवेयात् ॥ ॥ काशीश्वरस्य तनयोऽथ सुदक्षिणाख्यः शर्वं प्रपूज्य भवते
    विहिताभिचारः । कृत्यानलं कमपि बाण्ररणातिभीतै र्भूतैः कथञ्चन वृतैः सममभ्यमुञ्चत् ॥ ॥ तालप्रमाणचरणामखिलं
    दहन्तीं कृत्यां विलोक्य चकितैः कथितोऽपि पौरैः । द्यूतोत्सवे किमपि नो चलितो विभो त्वं पार्श्वस्थमाशु
    विससर्जिथ कालचक्रम् ॥ ॥ अभ्यापतत्यमितधाम्नि भवन्महास्त्रे हा हेति विद्रुतवती खलु घोरकृत्या। रोषात्
    सुदक्षिणमदक्षिणचेष्टितं तं पुप्लोष चक्रमपि काशिपुरीमधाक्षीत् ॥ ॥ स खलु विविदो रक्षोघाते कृतोपकृतिः
    पुरा तव तु कलया मृत्युं प्राप्तुं तदा खलतां गतः । नरकसचिवो देशक्लेशं सृजन् नगरान्तिके झटिति हलिना
    युध्यन्नद्धा पपात तलाहतः ॥ ॥ साम्बं कौरव्यपुत्रीहरणनियमितं सान्त्वनार्थी कुरूणां यातस्तद्वाक्यरोषोद्धृतकरिनगरो
    मोचयामास रामः । ते घात्याः पाण्डवेयैरिति यदुपृतनां नामुचस्त्वं तदानीं तं त्वां दुर्बोधलीलं पवनपुरपते
    तापशान्त्यै निषेवे ॥
