name:
  english: Subrahmanya Ashtottara Sata Namavali
content:
  english: om skandaya namah om guhaya namah om shanmukhaya namah om phalanetrasutaya namah om prabhave
    namah om pingalaya namah om krittikasunave namah om shikhivahaya namah om dvishadbhujaya namah om
    dvishannetraya namah om shaktidharaya namah om pishitasha prabhanjanaya namah om tarakasura samharine
    namah om rakshobalavimardanaya namah om mattaya namah om pramattaya namah om unmattaya namah om surasainya
    surakshakaya namah om devasenapataye namah om prajnaya namah om kripalave namah om bhaktavatsalaya
    namah om umasutaya namah om shaktidharaya namah om kumaraya namah om krauncadaranaya namah om senanye
    namah om agnijanmane namah om vishakhaya namah om shankaratmajaya namah om shivasvamine namah om gana
    svamine namah om sarvasvamine namah om sanatanaya namah om anantashaktaye namah om akshobhyaya namah
    om parvatipriyanandanaya namah om gangasutaya namah om sharodbhutaya namah om ahutaya namah om pavakatmajaya
    namah om jrimbhaya namah om prajrimbhaya namah om ujjrimbhaya namah om kamalasana samstutaya namah
