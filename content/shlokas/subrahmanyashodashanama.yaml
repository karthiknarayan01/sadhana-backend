id: subrahmanyashodashanama
category: stotram
name:
  english: subrahmanyashodashanama
  devanagari: सुब्रह्मण्यषोडशनाम
content:
  english: shrisubrahmanya shodashanamani jnanashaktidharah skandah devasenapatistatha | subrahmanyo gajarudhah
    sharakananasambhavah || 1|| kartikeyah kumarashca shanmukhastarakantakah | senanirbrahmashasta ca
    vallikalyanasundarah || 2|| balashca krauncabhetta ca shikhivahana eva ca | etani svaminamani shodasha
    pratyahah narah | yah pathet sarvapapebhyah sa mucyate mahamune || 3||
  devanagari: श्रीसुब्रह्मण्य षोडशनामानि ज्ञानशक्तिधरः स्कन्दः देवसेनापतिस्तथा । सुब्रह्मण्यो गजारूढः
    शरकाननसम्भवः ॥ १॥ कार्तिकेयः कुमारश्च षण्मुखस्तारकान्तकः । सेनानीर्ब्रह्मशास्ता च वल्लीकल्याणसुन्दरः
    ॥ २॥ बालश्च क्रौञ्चभेत्ता च शिखिवाहन एव च । एतानि स्वामिनामानि षोडश प्रत्यहः नरः । यः पठेत् सर्वपापेभ्यः
    स मुच्यते महामुने ॥ ३॥
meaning: {}
