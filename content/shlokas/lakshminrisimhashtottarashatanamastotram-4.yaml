id: lakshminrisimhashtottarashatanamastotram-4
category: stotram
name:
  english: lakshminrisimhashtottarashatanamastotram 4
  devanagari: लक्ष्मीनृसिंहाष्टोत्तरशतनामस्तोत्रम् ४
content:
  english: lakshminrisimhashtottarashatanamastotram 4 shriganeshaya namah | narasimho mahasimho divyasimho
    mahabalah | ugrasimho mahadevah stambhajashvogralocanah || 1|| raudrah sarvadbhutah shriman yoganandastrivikramah
    | harih kolahalashcakri vijayo jayavardhanah || 2|| pancananah param brahma caghoro ghoravikramah
    | jvalanmukho jvalamali mahajvalo mahaprabhuh || 3|| nitilakshah sahasraksho durnirikshyah pratapanah
    | mahadamshtrayudhah prajnashcandakopi sadashivah || 4|| hiranyakashipudhvamsi daityadanavabhanjanah
    | gunabhadro mahabhadro balabhadrah subhadrakah || 5|| karalo vikaralashca vikarta sarvakartrikah
    | shimshumarastrilokatma ishah sarveshvaro vibhuh || 6|| bhairavadambaro divyashcacyutah kavimadhavah
    | adhokshajo'ksharah sharvo vanamali varapradah || 7|| vishvambharo'dbhuto bhavya shrivishnuh purushottamah
    | amoghastro nakhastrashca suryajyotih sureshvarah || 8|| sahasrabahuh sarvajnah sarvasiddhipradayakah
    | vajradamshtro vajranakho mahanandah parantapah || 9|| sarvamantraikarupashca sarvamantravidaranah
    | sarvatantratmako'vyaktah suvyakto bhaktavatsalah || 10|| vaishakha shuklabhutotthasharanagatavatsalah
    | udarakirtih punyatma mahatma candavikramah || 11|| vedatrayaprapujyashca bhagavanparameshvarah |
    shrivatsankah shrinivaso jagadvyapi jaganmayah || 12|| jagatpalo jagannatho mahakayo dvirupabhrit
    | paramatma param jyotirnirgunashca nrikesari || 13|| paramatvam param dhama saccidanandavigrahah
    | lakshminrisimhah sarvatma dhirah prahladapalakah || 14|| idam lakshminrisimhasya namnamashtottaram
    shatam | trisandhyam yah pathedbhaktya sarvabhishtamavapnuyat || 15|| iti lakshminrisimhashtottarashatanamastotram
    sampurnam ||
  devanagari: लक्ष्मीनृसिंहाष्टोत्तरशतनामस्तोत्रम् ४ श्रीगणेशाय नमः । नारसिंहो महासिंहो दिव्यसिंहो महाबलः
    । उग्रसिंहो महादेवः स्तम्भजश्वोग्रलोचनः ॥ १॥ रौद्रः सर्वाद्भुतः श्रीमान् योगानन्दस्त्रिविक्रमः । हरिः
    कोलाहलश्चक्री विजयो जयवर्धनः ॥ २॥ पञ्चाननः परं ब्रह्म चाघोरो घोरविक्रमः । ज्वलन्मुखो ज्वालमाली महाज्वालो
    महाप्रभुः ॥ ३॥ निटिलाक्षः सहस्राक्षो दुर्निरीक्ष्यः प्रतापनः । महादंष्ट्रायुधः प्राज्ञश्चण्डकोपी सदाशिवः
    ॥ ४॥ हिरण्यकशिपुध्वंसी दैत्यदानवभञ्जनः । गुणभद्रो महाभद्रो बलभद्रः सुभद्रकः ॥ ५॥ करालो विकरालश्च विकर्ता
    सर्वकर्तृकः । शिंशुमारस्त्रिलोकात्मा ईशः सर्वेश्वरो विभुः ॥ ६॥ भैरवाडम्बरो दिव्यश्चाच्युतः कविमाधवः
    । अधोक्षजोऽक्षरः शर्वो वनमाली वरप्रदः ॥ ७॥ विश्वम्भरोऽद्भुतो भव्य श्रीविष्णुः पुरुषोत्तमः । अमोघास्त्रो
    नखास्त्रश्च सूर्यज्योतिः सुरेश्वरः ॥ ८॥ सहस्रबाहुः सर्वज्ञः सर्वसिद्धिप्रदायकः । वज्रदंष्ट्रो वज्रनखो
    महानन्दः परन्तपः ॥ ९॥ सर्वमन्त्रैकरूपश्च सर्वमन्त्रविदारणः । सर्वतन्त्रात्मकोऽव्यक्तः सुव्यक्तो भक्तवत्सलः
    ॥ १०॥ वैशाख शुक्लभूतोत्थशरणागतवत्सलः । उदारकीर्तिः पुण्यात्मा महात्मा चण्डविक्रमः ॥ ११॥ वेदत्रयप्रपूज्यश्च
    भगवान्परमेश्वरः । श्रीवत्साङ्कः श्रीनिवासो जगद्व्यापी जगन्मयः ॥ १२॥ जगत्पालो जगन्नाथो महाकायो द्विरूपभृत्
    । परमात्मा परं ज्योतिर्निर्गुणश्च नृकेसरी ॥ १३॥ परमत्वं परं धाम सच्चिदानन्दविग्रहः । लक्ष्मीनृसिंहः
    सर्वात्मा धीरः प्रह्लादपालकः ॥ १४॥ इदं लक्ष्मीनृसिंहस्य नाम्नामष्टोत्तरं शतम् । त्रिसन्ध्यं यः पठेद्भक्त्या
    सर्वाभीष्टमवाप्नुयात् ॥ १५॥ इति लक्ष्मीनृसिंहाष्टोत्तरशतनामस्तोत्रं सम्पूर्णम् ॥
