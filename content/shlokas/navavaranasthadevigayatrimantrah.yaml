id: navavaranasthadevigayatrimantrah
category: mantra
name:
  english: navavaranasthadevigayatrimantrah
  devanagari: नवावरणस्थदेवीगायत्रीमन्त्राः
content:
  english: navavaranastha devi gayatrimantrah gayatrim tu samuccarya tattadavritidevatah | pujaniyah prayatnena
    sarvakamarthasiddhaye || 1|| iti vacanacchricakravaranadevinam gayatryah procyante
  devanagari: नवावरणस्थ देवी गायत्रीमन्त्राः गायत्रीं तु समुच्चार्य तत्तदावृतिदेवताः । पूजनीयाः प्रयत्नेन
    सर्वकामार्थसिद्धये ॥ १॥ इति वचनाच्छ्रीचक्रावरणदेवीनां गायत्र्यः प्रोच्यन्ते
meaning: {}
