    जम काला। भुज बल जितेउँ सकल दिगपाला ॥ देव दनुज नर सब बस मोरें। कवन हेतु उपजा भय तोरेम् ॥ नाना बिधि
    तेहि कहेसि बुझाई। सभाँ बहोरि बैठ सो जाई ॥ मन्दोदरीं हृदयँ अस जाना। काल बस्य उपजा अभिमाना ॥ सभाँ आइ
