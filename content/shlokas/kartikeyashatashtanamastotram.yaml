id: kartikeyashatashtanamastotram
category: stotram
name:
  english: kartikeyashatashtanamastotram
  devanagari: कार्तिकेयशताष्टनामस्तोत्रम्
content:
  english: 2|| shaktihasto duradharsho vitihotrangajo bali | krauncadrimathano yogi subrahmanyo makheditah
    || 54|| gangeyo vaidyuto'moghastarakantakaro ravih | mahaseno devavaidyah pranavarthaprakashakah ||
    55|| mahasenah sharavanodbhavo bhavasuto'naghah | vinayakanujah shriman shurasamharakarakah || 56||
    senanirdurduro viro garbho vishvapatih kavih | gururharihayah shasta sharasanakarah shari || 57||
    vyapako'nantashaktih sukumarah projjvalangakah | virabahurganadhyakshastryakshaprito visharadah ||
    58|| kantah shanto jitaratirumakantatmajo'parah | vallipatirjitaratih kukkutottamaketanah || 59||
    shivalingarcanaprito gandhapushpadyalankritah | mukuti cangadi cakri gadi shankhi shikhi jati || 60||
    sanatanaparastarastarakastarakantakrit | samvarto yauvani
  devanagari: २॥ शक्तिहस्तो दुराधर्षो वीतिहोत्राङ्गजो बली । क्रौञ्चाद्रिमथनो योगी सुब्रह्मण्यो मखेडितः
    ॥ ५४॥ गाङ्गेयो वैद्युतोऽमोघस्तारकान्तकरो रविः । महासेनो देववैद्यः प्रणवार्थप्रकाशकः ॥ ५५॥ महासेनः
    शरवणोद्भवो भवसुतोऽनघः । विनायकानुजः श्रीमान् शूरसंहारकारकः ॥ ५६॥ सेनानीर्दुर्दुरो वीरो गर्भो विश्वपतिः
    कविः । गुरुर्हरिहयः शास्ता शरासनकरः शरी ॥ ५७॥ व्यापकोऽनन्तशक्तिः सुकुमारः प्रोज्ज्वलाङ्गकः । वीराबाहुर्गणाध्यक्षस्त्र्यक्षप्रीतो
    विशारदः ॥ ५८॥ कान्तः शान्तो जितारातिरुमाकान्तात्मजोऽपरः । वल्लीपतिर्जितारातिः कुक्कुटोत्तमकेतनः ॥
    ५९॥ शिवलिङ्गार्चनप्रीतो गन्धपुष्पाद्यलङ्कृतः । मुकुटी चाङ्गदी चक्री गदी शङ्खी शिखी जटी ॥ ६०॥ सनातनपरस्तारस्तारकस्तारकान्तकृत्
    । संवर्तो यौवनी
