id: devadibhihkritamshrimaharamastotram
category: stotram
name:
  english: devadibhihkritamshrimaharamastotram
  devanagari: देवादिभिःकृतंश्रीमहारमास्तोत्रम्
content:
  english: shrikambhare shrilalite sanathe santoshikamataratho namaste | gajanane'nantaramanurupe matarnamaste
    harinisvarupe || 20|| sarveshvari sarvaramadhinathe shrimanikipashavatipramode | lakshmimahasagarabhavike
    te brahmapriyasthe satatam namaste || 21|| kamadhinathe'rthitadanadakshe cintamane citrajagatprasute
    | mokshaprade bhaskaracandranetre mandasmite yogini te namo'stu || 22|| namo namo bhandamahasuraghne
    samastadaityantakakartri matah | mudradhinathe ca suyantrarupe sarvashrutiprodbhavike namaste || 23||
    krishne pare cakrasushatkasamsthe shadurmihartri shramanashike te | shadbhavashunye'shtagunashraye
    te matarnamo mukhyasamastarajni || 24|| kantadhinathe kamale sunirmale kaladhinathe bhuvaneshvari
    priye | rasayane sarvarasadhivasini divyasvarupe ca namo'stvabhikshnashah || 25|| sadanimadyashtakasevaniye
    gopalakrishnatmakamancavase | devadhidevapramade savitri lokasya matah pranamo namaste || 26|| vrahmapriyebrahmarame
    harishri brahmatmike shrilalite namaste | brahmamritasrotasi janmahantri brahmeshvari shrilalite namaste
    || 27|| shubhashraye shubhaprade'ksharakhye hatarivarge lalite namaste | sarvadhike sarvagate samastasiddhiprade
    shrilalite namaste || 28|| sarva'mara''kankshitapurayitri varaprade shrilalite namaste | bindusthite
    bindusurupini shribrihatkuca'mbhojavilolahare || 29|| phalaprade kampalate'rkashobhe sarojavaktre
    lalite namaste | saraikabhume purushottami shribhupadmika'ja kamalatmike te || 30|| kripanidhane surakaryashalini
    shrivaishnavi shrisakalavatarini | sarangashavakshi manohare prasu matarnamaste lalite'tisundari ||
    31|| shrimanmahalakshmi samriddhidayini vipannivare'tisanatani prame | tvaya samastam bhuvanam surakshitam
    bhandasuradin vinihatya sangare || 32|| shrishambhuna bhasmita eva manmatho bhasmotthabhando'pi hatah
    punastvaya | kamasya bhasma'pi subhasmita yato nishkamata niratita pradarshita || 33|| sthulam shariram
    madanasya shambhuna dagdham ca sukshmam tu tatah punastvaya | evam sharirobhayavarjitam patim vilokya
    tajjivanamarthayadratih || 34|| tada punah karanavarshma kalpanatmakam yadasidbahuvasanatmakam | tasmadadrishyam
    ramanasya varshma vai vyaptam brihatkritya dadau ratistriyai || 35|| ratirnijam kantamanuttamam punah
    samastalokasthitikam hridi sthitam | adrishyarupam prasamikshya ranjita prasannatapurvakamashlishat
    patim || 36|| avarshmarupo hyapi varshmakaryakrit kamo bhavatya vihitastato hyasau | tavajnaya vyaptimagacchivapatau
    skando'bhavacchailasutasuyogatah || 37|| sthulasya kamasya jayasya karta shambhusvarupo bhavatiti
    bodhyah | sukshmasya kamasya jayasya karta lakshmisvarupo bhavatiti bodhyah || 38|| kuvasana'nangajayasyakarta
    narayanashcordhvagatirhim bodhyah | evam tvaya bodhitameva sarvebhyo nah paresheshvari muktaye nah
    || 39|| iti stutva pujayitva nishedurhrishtamanasah | utsavam tannimittam ca cakruh sarve ranajire
    || 40|| iti shrilakshminarayaniyasamhitayah dvaparayugasantanatmakasya tritiyakhande 118
  devanagari: श्रीकम्भरे श्रीललिते सनाथे सन्तोषिकामातरथो नमस्ते । गजाननेऽनन्तरमानुरूपे मातर्नमस्ते हरिणीस्वरूपे
    ॥ २०॥ सर्वेश्वरि सर्वरमाधिनाथे श्रीमाणिकीपाशवतीप्रमोदे । लक्ष्मीमहासागरभाविके ते ब्रह्मप्रियास्थे
    सततं नमस्ते ॥ २१॥ कामाधिनाथेऽर्थितदानदक्षे चिन्तामणे चित्रजगत्प्रसूते । मोक्षप्रदे भास्करचन्द्रनेत्रे
    मन्दस्मिते योगिनि ते नमोऽस्तु ॥ २२॥ नमो नमो भण्डमहासुरघ्ने समस्तदैत्यान्तककर्त्रि मातः । मुद्राधिनाथे
    च सुयन्त्ररूपे सर्वश्रुतिप्रोद्भविके नमस्ते ॥ २३॥ कृष्णे परे चक्रसुषट्कसंस्थे षडूर्मिहर्त्रि श्रमनाशिके
    ते । षड्भावशून्येऽष्टगुणाश्रये ते मातर्नमो मुख्यसमस्तराज्ञि ॥ २४॥ कान्ताधिनाथे कमले सुनिर्मले कलाधिनाथे
    भुवनेश्वरि प्रिये । रसायने सर्वरसाधिवासिनि दिव्यस्वरूपे च नमोऽस्त्वभीक्ष्णशः ॥ २५॥ सदाणिमाद्यष्टकसेवनीये
    गोपालकृष्णात्मकमञ्चवासे । देवाधिदेवप्रमदे सवित्रि लोकस्य मातः प्रणमो नमस्ते ॥ २६॥ व्रह्मप्रियेब्रह्मरमे
    हरिश्रि ब्रह्मात्मिके श्रीललिते नमस्ते । ब्रह्मामृतस्रोतसि जन्महन्त्रि ब्रह्मेश्वरि श्रीललिते नमस्ते
    ॥ २७॥ शुभाश्रये शुभप्रदेऽक्षराख्ये हतारिवर्गे ललिते नमस्ते । सर्वाधिके सर्वगते समस्तसिद्धिप्रदे श्रीललिते
    नमस्ते ॥ २८॥ सर्वाऽमराऽऽकाङ्क्षितपूरयित्रि वरप्रदे श्रीललिते नमस्ते । बिन्दुस्थिते बिन्दुसुरूपिणि
    श्रीबृहत्कुचाऽम्भोजविलोलहारे ॥ २९॥ फलप्रदे कम्पलतेऽर्कशोभे सरोजवक्त्रे ललिते नमस्ते । सारैकभूमे पुरुषोत्तमि
    श्रीभूपद्मिकाऽजा कमलात्मिके ते ॥ ३०॥ कृपानिधाने सुरकार्यशालिनि श्रीवैष्णवि श्रीसकलावतारिणि । सारङ्गशावाक्षि
    मनोहरे प्रसु मातर्नमस्ते ललितेऽतिसुन्दरि ॥ ३१॥ श्रीमन्महालक्ष्मि समृद्धिदायिनि विपन्निवारेऽतिसनातनि
    प्रमे । त्वया समस्तं भुवनं सुरक्षितं भण्डासुरादीन् विनिहत्य सङ्गरे ॥ ३२॥ श्रीशम्भुना भस्मित एव मन्मथो
    भस्मोत्थभण्डोऽपि हतः पुनस्त्वया । कामस्य भस्माऽपि सुभस्मिता यतो निष्कामता नीरतिता प्रदर्शिता ॥ ३३॥
    स्थूलं शरीरं मदनस्य शम्भुना दग्धं च सूक्ष्मं तु ततः पुनस्त्वया । एवं शरीरोभयवर्जितं पतिं विलोक्य तज्जीवनमार्थयद्रतिः
    ॥ ३४॥ तदा पुनः कारणवर्ष्म कल्पनात्मकं यदासीद्बहुवासनात्मकम् । तस्माददृश्यं रमणस्य वर्ष्म वै व्याप्तं
    बृहत्कृत्य ददौ रतिस्त्रियै ॥ ३५॥ रतिर्निजं कान्तमनुत्तमं पुनः समस्तलोकस्थितिकं हृदि स्थितम् । अदृश्यरूपं
    प्रसमीक्ष्य रञ्जिता प्रसन्नतापूर्वकमाश्लिषत् पतिम् ॥ ३६॥ अवर्ष्मरूपो ह्यपि वर्ष्मकार्यकृत् कामो भवत्या
    विहितस्ततो ह्यसौ । तवाज्ञया व्याप्तिमगाच्छिवापतौ स्कन्दोऽभवच्छैलसुतासुयोगतः ॥ ३७॥ स्थूलस्य कामस्य
    जयस्य कर्ता शम्भुस्वरूपो भवतीति बोध्यः । सूक्ष्मस्य कामस्य जयस्य कर्ता लक्ष्मीस्वरूपो भवतीति बोध्यः
    ॥ ३८॥ कुवासनाऽनङ्गजयस्यकर्ता नारायणश्चोर्ध्वगतिर्हिं बोध्यः । एवं त्वया बोधितमेव सर्वेभ्यो नः परेशेश्वरि
    मुक्तये नः ॥ ३९॥ इति स्तुत्वा पूजयित्वा निषेदुर्हृष्टमानसाः । उत्सवं तन्निमित्तं च चक्रुः सर्वे रणाजिरे
    ॥ ४०॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः द्वापरयुगसन्तानात्मकस्य तृतीयखण्डे ११८
