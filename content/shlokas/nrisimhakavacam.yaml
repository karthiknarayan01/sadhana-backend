id: nrisimhakavacam
category: kavacha
name:
  english: nrisimhakavacam
  devanagari: नृसिंहकवचम्
content:
  english: '| kavacam narasimhasya trailokyavijayabhidham || 2|| yasya prapathanad vagmi trailokyavijayi
    bhavet | srashta''ham jagatam vatsa pathanaddharanad yatah || 3|| lakshmirjagattrayam pati samharta
    ca maheshvarah | pathanaddharanaddeva babhuvushca digishvarah || 4|| brahma mantramayam vakshye bhutadivinivarakam
    | yasya prasadaddurvasastrailokyavijayi munih | pathanad dharanad yasya shasta ca krodhabhairavah
    || 5|| trailokyavijayasyasya kavacasya prajapatih | rishishchandashca gayatri nrisimha devata vibhuh
    | caturvarge ca shantau ca viniyogah prakirttitah || 6|| kshaum bijam me shirah patu candravarno mahamanuh
    | ugraviram mahavishnum jvalantah sarvatomukham | nrisimham bhishanam bhadram mrityormrityum namamyaham
    || 7|| dvatrimshadaksharo mantrah mantrarajah suradrumah | kantham patu dhruvam kshaum hridbhagavate
    cakshushi mama || 8|| narasimhaya ca jvalamaline patu mastakam | diptadamshtraya ca tathagninetraya
    ca nasikam || 9|| sarvarakshoghnaya devaya sarvabhutavinashaya ca | sarvajvaravinashaya daha daha
    paca dvayam || 10|| raksha raksha sarvamantram svaha patu mukham mama | taradi ramacandraya namah
    payadguhyam mama || 11|| klim payatpaniyugmamshca takram namah padam tatah | narayana''prasavam ca
    am hrim kraum kshaum cam hum phat || 12|| shadaksharah katim patu om namo bhagavate padam | vasudevaya
    ca prishtham klim krishnaya urudvayam || 13|| klim krishnaya sada patu januni ca manuttamah | klim
    klim klim shyamalangaya namah payatpadadvayam || 14|| kshaum narasimhaya kshaumshca sarvangam me sada''vatu
    || 15||'
  devanagari: । कवचं नरसिंहस्य त्रैलोक्यविजयाभिधम् ॥ २॥ यस्य प्रपठनाद् वाग्मी त्रैलोक्यविजयी भवेत् । स्रष्टाऽहं
    जगतां वत्स पठनाद्धारणाद् यतः ॥ ३॥ लक्ष्मीर्जगत्त्रयम् पाति संहर्ता च महेश्वरः । पठनाद्धारणाद्देवा
    बभुवुश्च दिगीश्वराः ॥ ४॥ ब्रह्म मन्त्रमयं वक्ष्ये भूतादिविनिवारकम् । यस्य प्रसादाद्दुर्वासास्त्रैलोक्यविजयी
    मुनिः । पठनाद् धारणाद् यस्य शास्ता च क्रोधभैरवः ॥ ५॥ त्रैलोक्यविजयस्यास्य कवचस्य प्रजापतिः । ऋषिश्छन्दश्च
    गायत्री नृसिंह देवता विभुः । चतुर्वर्गे च शान्तौ च विनियोगः प्रकीर्त्तितः ॥ ६॥ क्षौं बिजं मे शिरः
    पातु चन्द्रवर्णो महामनुः । उग्रवीरं महाविष्णुं ज्वलन्तः सर्वतोमुखम् । नृसिंहं भीषणं भद्रं मृत्योर्मृत्युं
    नमाम्यहम् ॥ ७॥ द्वात्रिंशादक्षरो मन्त्रः मन्त्रराजः सुरद्रुमः । कण्ठं पातु ध्रुवम् क्षौं हृद्भगवते
    चक्षुषी मम ॥ ८॥ नरसिंहाय च ज्वालामालिने पातु मस्तकम् । दीप्तदंष्ट्राय च तथाग्निनेत्राय च नासिकाम्
    ॥ ९॥ सर्वरक्षोघ्नाय देवाय सर्वभूतविनाशाय च । सर्वज्वरविनाशाय दह दह पच द्वयम् ॥ १०॥ रक्ष रक्ष सर्वमन्त्रम्
    स्वाहा पातु मुखं मम । तारादि रामचन्द्राय नमः पायाद्गूह्यं मम ॥ ११॥ क्लीं पायात्पाणियुग्मंश्च तक्रम्
    नमः पदम् ततः । नरायणाऽप्रसवम् च आं ह्रीं क्रौं क्षौं चं हुं फट् ॥ १२॥ षडक्षरः कटिं पातु ॐ नमो भगवते
    पदम् । वासुदेवाय च पृष्ठं क्लीं कृष्णाय उरुद्वयम् ॥ १३॥ क्लीं कृष्णाय सदा पातु जानुनी च मनूत्तमः ।
    क्लीं क्लीं क्लीं श्यामलाङ्गाय नमः पायात्पदद्वयम् ॥ १४॥ क्षौं नरसिंहाय क्षौंश्च सर्वाङ्गं मे सदाऽवतु
    ॥ १५॥
