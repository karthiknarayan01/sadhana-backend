id: ramasundarakhyadvijakritamsamhitashristotram
category: stotram
name:
  english: ramasundarakhyadvijakritamsamhitashristotram
  devanagari: रामसुन्दराख्यद्विजकृतंसंहिताश्रीस्तोत्रम्
content:
  english: shriramasundarakhyadvijakritam samhitashristotram tavat kashcit samayatah kadaryastatra bhusurah
    | patrapushpajalayuktah samhitapujanaya vai || 87|| shlokamuccarayan tasthau sammarde yoshitam tatha
    | namah samhitarupaya madhavisvamine namah || 88|| nirmalanam hridisthaya mokshadaya ca te namah |
    namo radharamalakshmishrirupayai muhurmuhuh || 89|| mokshadatryai divyamatre jnanadayai ca te namah
    | namah shrikrishnakantayai manikyayai ca te namah || 90|| brahmavidyasvarupayai dhamashaktyai ca
    te namah | namah shribadaridevyai jayadevyai ca te namah || 91|| namah priyayai divyayai parangatyai
    ca te namah | namo matre mahalakshmyai lalitayai ca te namah || 92|| brahmadatryai parabrahmayogadatryai
    ca te namah | ityevam sa harikrishnam tushtava samhitashriyam || 93|| iti shrilakshminarayaniyasamhitayah
    tishyasantanatmakasya caturthakhande 46
  devanagari: श्रीरामसुन्दराख्यद्विजकृतं संहिताश्रीस्तोत्रम् तावत् कश्चित् समायातः कदर्यस्तत्र भूसुरः
    । पत्रपुष्पजलयुक्तः संहितापूजनाय वै ॥ ८७॥ श्लोकमुच्चारयन् तस्थौ सम्मर्दे योषितां तथा । नमः संहितारूपाय
    माधवीस्वामिने नमः ॥ ८८॥ निर्मलानां हृदिस्थाय मोक्षदाय च ते नमः । नमो राधारमालक्ष्मीश्रीरूपायै मुहुर्मुहुः
    ॥ ८९॥ मोक्षदात्र्यै दिव्यमात्रे ज्ञानदायै च ते नमः । नमः श्रीकृष्णकान्तायै माणिक्यायै च ते नमः ॥ ९०॥
    ब्रह्मविद्यास्वरूपायै धामशक्त्यै च ते नमः । नमः श्रीबदरीदेव्यै जयादेव्यै च ते नमः ॥ ९१॥ नमः प्रियायै
    दिव्यायै पारङ्गत्यै च ते नमः । नमो मात्रे महालक्ष्म्यै ललितायै च ते नमः ॥ ९२॥ ब्रह्मदात्र्यै परब्रह्मयोगदात्र्यै
    च ते नमः । इत्येवं स हरिकृष्णं तुष्टाव संहिताश्रियम् ॥ ९३॥ इति श्रीलक्ष्मीनारायणीयसंहितायाः तिष्यसन्तानात्मकस्य
    चतुर्थखण्डे ४६
meaning: {}
