id: mahanyasam-7-3-uttara-narayanam
category: stotram
name:
  english: Mahanyasam - 7.3. Uttara Narayanam
content:
  english: ssambhutah prithivyai rasa ssamavartatadhi | tasya tvashta vidadha drupameti | tatpurushasya
    vishvamajanamagre ntamasah parastat | tamevam vi~dvanamrita iha bhavati | nanyah pantha vidyate 'yanaya
    | prajapatishcarati garbhe antah | ajayamano bahudha vijayate | tasya dhirah parijananti yoni mpadamicchanti
    vedhasah || yo devebhya atapati | yo devana mpurohitah | purvo yo devebhyo jatah | namo rucaya brahmaye
    | ruca njanayantah | deva agre tadabruvann | yastvaiva hmano vidyat | tasya deva asan vashe | hrishca
    te lakshmishca patnyau | ahoratre par shve | nakshatrani rupam | ashvinau vyatta nnamo bhagavate rudraya
    || uttara narayanagm shikhayai vashat ||
  devanagari: स्सम्भू॑तः पृथि॒व्यै रसा स्सम॑वर्त॒ताधि॑ । तस्य॒ त्वष्टा॑ वि॒दध॑ द्रू॒पमे॑ति । तत्पुरु॑षस्य॒
    विश्व॒माजा॑न॒मग्रे न्तम॑सः॒ पर॑स्तात् । तमे॒वं विँ॒द्वान॒मृत॑ इ॒ह भ॑वति । नान्यः पन्था॑ विद्य॒ते ऽय॑नाय
    । प्र॒जाप॑तिश्चरति॒ गर्भे॑ अ॒न्तः । अ॒जाय॑मानो बहु॒धा विजा॑यते । तस्य॒ धीराः॒ परि॑जानन्ति॒ योनि म्प॒दमि॑च्छन्ति
    वे॒धसः॑ ॥ यो दे॒वेभ्य॒ आत॑पति । यो दे॒वाना म्पु॒रोहि॑तः । पूर्वो॒ यो दे॒वेभ्यो॑ जा॒तः । नमो॑ रु॒चाय॒
    ब्राह्म॑ये । रुच॑ ञ्ज॒नय॑न्तः । दे॒वा अग्रे॒ तद॑ब्रुवन्न् । यस्त्वै॒व ह्म॒णो वि॒द्यात् । तस्य॑ दे॒वा
    अस॒न् वशे । ह्रीश्च॑ ते ल॒क्ष्मीश्च॒ पत्न्यौ । अ॒हो॒रा॒त्रे पा॒र् श्वे । नक्ष॑त्राणि रू॒पम् । अ॒श्विनौ॒
    व्यात्त न्नमो भगवते॑ रुद्रा॒य ॥ उत्तर नारायणग्ं शिखायै वषट् ॥
