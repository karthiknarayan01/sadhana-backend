id: kalkistotra
category: stotram
name:
  english: kalkistotra
  devanagari: कल्किस्तोत्र
content:
  english: kalkistotram shriganeshaya namah | sushantovaca | jaya hare'maradhishasevitam tava padambujam
    bhuribhushanam | kuru mamagratah sadhusatkritam tyaja mahamate mohamatmanah || 1|| tava vapurjagadrupasampada
    viracitam satam manase sthitam | ratipatermano mohadayakam kuru viceshtitam kamalampatam || 2|| tava
    yashojagacchokanashakam mridukathamritam pritidayakam | smitasudhokshitam candravanmukham tava karotyalam
    lokamangalam || 3|| mama patistvayam sarvadurjayo yadi tavapriyam karmana''caret | jahi tadatmanah
    shatrumudyatam kuru kripam na cedidrigishvarah || 4|| mahadahamyutam pancamatraya prakritijayaya nirmitam
    vapuh | tava nirikshanallilaya jagatsthitilayodayam brahmakalpitam || 5|| bhuviyanmarudvaritejasam
    rashibhih sharirendriyashritaih | trigunaya svaya mayaya vibho kuru kripam bhavatsevanarthinam ||
    6|| tava gunalayam nama pavanam kalimalapaham kirtayanti ye | bhavabhayakshayam tapatapita muhuraho
    janah samsaranti no || 7|| tava januh satam manavardhanam jinakulakshayam devapalakam | kritayugarpakam
    dharmapurakam kalikulantakam sham tanotu me || 8|| mama griham patiputranaptrikam gajarathairdhvajaishcamarairdhanaih
    | manivarasanam satkritim vina tava padabjayoh shobhayanti kim || 9|| tava jagadvapuh sundarasmitam
    mukhamaninditam sundaratvisham | yadi na me priyam valguceshtitam parikarotyaho mrityurastviha ||
    10|| hayavara bhayahara karaharasharanakharataravarashara dashabaladamana | jaya hataparabharabhavavaranashana
    shashadhara shatasamarasabharamadana || 11|| iti shrikalkipurane sushantakritam kalkistotram sampurnam
    |
  devanagari: कल्किस्तोत्रम् श्रीगणेशाय नमः । सुशान्तोवाच । जय हरेऽमराधीशसेवितं तव पदांबुजं भूरिभूषणम्
    । कुरु ममाग्रतः साधुसत्कृतं त्यज महामते मोहमात्मनः ॥ १॥ तव वपुर्जगद्रूपसम्पदा विरचितं सतां मानसे स्थितम्
    । रतिपतेर्मनो मोहदायकं कुरु विचेष्टितं कामलंपटम् ॥ २॥ तव यशोजगच्छोकनाशकं मृदुकथामृतं प्रीतिदायकम्
    । स्मितसुधोक्षितं चन्द्रवन्मुखं तव करोत्यलं लोकमङ्गलम् ॥ ३॥ मम पतिस्त्वयं सर्वदुर्जयो यदि तवाप्रियं
    कर्मणाऽऽचरेत् । जहि तदात्मनः शत्रुमुद्यतं कुरु कृपां न चेदीदृगीश्वरः ॥ ४॥ महदहंयुतं पञ्चमात्रया प्रकृतिजायया
    निर्मितं वपुः । तव निरीक्षणाल्लीलया जगत्स्थितिलयोदयं ब्रह्मकल्पितम् ॥ ५॥ भूवियन्मरुद्वारितेजसां राशिभिः
    शरीरेन्द्रियाश्रितैः । त्रिगुणया स्वया मायया विभो कुरु कृपां भवत्सेवनार्थिनाम् ॥ ६॥ तव गुणालयं नाम
    पावनं कलिमलापहं कीर्तयन्ति ये । भवभयक्षयं तापतापिता मुहुरहो जनाः संसरन्ति नो ॥ ७॥ तव जनुः सतां मानवर्धनं
    जिनकुलक्षयं देवपालकम् । कृतयुगार्पकं धर्मपूरकं कलिकुलान्तकं शं तनोतु मे ॥ ८॥ मम गृहं पतिपुत्रनप्तृकं
    गजरथैर्ध्वजैश्चामरैर्धनैः । मणिवरासनं सत्कृतिं विना तव पदाब्जयोः शोभयन्ति किम् ॥ ९॥ तव जगद्वपुः सुन्दरस्मितं
    मुखमनिन्दितं सुन्दरत्विषम् । यदि न मे प्रियं वल्गुचेष्टितं परिकरोत्यहो मृत्युरस्त्विह ॥ १०॥ हयवर भयहर
    करहरशरणखरतरवरशर दशबलदमन । जय हतपरभरभववरनाशन शशधर शतसमरसभरमदन ॥ ११॥ इति श्रीकल्किपुराणे सुशान्ताकृतं
    कल्किस्तोत्रं सम्पूर्णम् ।
