id: prithivikritam1vishnustotram
category: stotram
name:
  english: prithivikritam1vishnustotram
  devanagari: पृथिवीकृतं१विष्णुस्तोत्रम्
content:
  english: prithivikritam 1 vishnustotram prithivyuvaca | trivikramayamitavikramaya mahavarahaya surottamaya
    | shrisharngacakrasigadadharaya namo'stu te devavara prasida || 12|| tava dehajjagajjatam pushkaradvipamutthitam
    | brahmanamihalokanam bhutanam shashvatam viduh || 13|| tava prasadaddevo'yam divam bhunkte purandarah
    | tava krodhaddhi balavanjanardana jito balih || 14|| dhata vidhata samharta tvayi sarvam pratishthitam
    | manuh kritanto'dhipatirjvalanah pavano ghanah || 15|| varnashca''shramadharmashca sagarastaravo'calah
    | nadyo dharmashca kamashca yajna yajnasya ca kriyah || 16|| vidya vedyam ca sattvam ca hrih shrih
    kirtirdhritih kshama | puranam vedavedangam sankhyayogau bhavabhavau || 17|| jangamam sthavaram caiva
    bhavishyam ca bhavacca yat | sarvam tacca trilokeshu prabhavopahitam tava || 18|| tridashodaraphaladah
    svargastricarupallavah | sarvalokamanahkantah sarvasattvamanoharah || 19|| vimananekavitapastoyadambumadhusravah
    | divyalokamahaskandhah satyalokaprashakhavan || 20|| sagarakaraniryaso rasatalajalashrayah | nagendrapadapopeto
    jantupakshinishevitah || 21|| shilacararyagandhastvam sarvalokamayo drumah | dvadasharkamayadvipo
    rudraikadashapattanah || 22|| vasvashtacalasamyuktastrailokyambhomahodadhih | siddhasadhyormikalilah
    suparnanilasevitah || 23|| daityalokamahagraho rakshoragajhashakulah | pitamahamahadhairyah svargastriratnabhushitah
    || 24|| dhishrihrikantibhirnityam nadibhirupashobhitah | kalayogamahaparvaprayagagativegavan || 25||
    tvam svayogamahaviryo narayana maharnavah | kalo bhutva prasannabhiradbhirhladayase punah || 26||
    tvaya srishtastrayo lokastvayaiva pratisamhritah | vishanti yoginah sarve tvameva pratiyojitah ||
    27|| yuge yuge yugantagnih kalamegho yuge yuge | mama bharavataraya deva tvam hi yuge yuge || 28||
    tvam hi shuklah kritayuge tretayam campakaprabhah | dvapare raktasankashah krishnah kaliyuge bhavan
    || 29|| vaivarnyamabhidhatse tvam prapteshu yugasandhishu | vaivarnyam sarvadharmanamutpadayasi vedavit
    || 30|| bhasi vasi pratapasi tvam ca pasi viceshtase | krudhyasi kshantimayasi tvam dipayasi varshasi
    || 31|| tvam hasyasi na niryasi nirvapayasi jagrasi | nihsheshayasi bhutani kalo bhutva yugakshaye
    || 32|| sheshamatmanamalokya visheshayasi tvam punah | yugantagnyavalidheshu sarvabhuteshu kincana
    || 33|| yateshu shesho bhavasi tasmacchesho'si kirtitah | cyavanotpattiyukteshu brahmendravarunadishu
    || 34|| yasmanna cyavase sthanattasmatsankirtyase'cyutah | brahmanamindram ca yamam rudram varunameva
    ca || 35|| nigrihya harase yasmattasmaddharirihocyase | santanayasi bhutani vapusha yashasa shriya
    || 36|| parena vapusha deva tasmaccasi sanatanah | yasmadbrahmadayo deva munayashcogratejasah || 37||
    na te'ntam tvadhigacchanti tenanantastvamucyase | na kshiyase na ksharase kalpakotishatairapi || 38||
    tasmattvamaksharatvacca aksharashca prakirtitah | vishtabdham yattvaya sarvam jagatsthavarajangamam
    || 39|| jagadvishtambhanaccaiva vishnureveti kirtyase | vishtabhya tishthase nityam trailokyam sacaracaram
    || 40|| yakshagandharvanagaram sumahadbhutapannagam | vyaptam tvayaiva vishata trailokyam sacaracaram
    || 41|| tasmadvishnuriti proktah svayameva svayambhuva | nara ityucyate hyapo hyrishibhistattvadarshibhih
    || 42|| ayanam tasya tah purvam tena narayanah smritah | yuge yuge pranashtam gam vishno vindasi tattvatah
    || 43|| govindeti tato namna procyase rishibhistatha | hrishikanindriyanyahustattvajnanavisharadah
    || 44|| ishita ca tvametesham hrishikeshastathocyase | vasanti tvayi bhutani brahmadini yugakshaye
    || 45|| tvam va vasasi bhuteshu vasudevastathocyase | sankarshayasi bhutani kalpe kalpe punah punah
    || 46|| tatah sankarshanah proktastattvajnanavisharadaih | prativyuhena tishthanti sadevasurarakshasah
    || 47|| pravidyuh sarvadharmanam pradyumnastena cocyase | niroddha vidyate yasmanna te bhuteshu kashcana
    || 48|| aniruddhastatah proktah purvameva maharshibhih | yattvaya dharyate vishvam tvaya samhriyate
    jagat || 49|| tvam dharayasi bhutani bhuvanam tvam bibharshi ca | yattvaya dharyate kincittejasa ca
    balena ca || 50|| maya hi dharyate pashcannadhritam dharaye tvaya | na hi tadvidyate bhutam tvaya
    yannatra dharyate || 51|| tvameva kurushe deva narayana yuge yuge | mahabharavataranam jagato hitakamyaya
    || 52|| tavaiva tejasa''krantam rasatalatalam gatam | trayasva mam surashreshtha tvameva sharanam
    gatam || 53|| danavaih pidyamana'ham rakshasaishca duratmabhih | tvameva sharanam nityamupayami sanatanam
    || 54|| tavanme'sti bhayam deva yavanna tvam kakudminam | sharanam yami manasa shatasho'pyupalakshaye
    || 55|| upamanam na te shaktah kartum sendra divaukasah | tattvam tvameva tadvetsi niruttaramatah
    param || 56|| iti matsyapurane ashtacatvarimshadadhikadvishatatamadhyayantargatam prithivikritam vishnustotram
    samaptam | matsyapurana | adhyaya 248
  devanagari: पृथिवीकृतं १ विष्णुस्तोत्रम् पृथिव्युवाच । त्रिविक्रमायामितविक्रमाय महावराहाय सुरोत्तमाय
    । श्रीशार्ङ्गचक्रासिगदाधराय नमोऽस्तु ते देववर प्रसीद ॥ १२॥ तव देहाज्जगज्जातं पुष्करद्वीपमुत्थितम्
    । ब्रह्माणमिहलोकानां भूतानां शाश्वतं विदुः ॥ १३॥ तव प्रसादाद्देवोऽयं दिवं भुङ्क्ते पुरन्दरः । तव क्रोधाद्धि
    बलवाञ्जनार्दन जितो बलिः ॥ १४॥ धाता विधाता संहर्ता त्वयि सर्वं प्रतिष्ठितम् । मनुः कृतान्तोऽधिपतिर्ज्वलनः
    पवनो घनः ॥ १५॥ वर्णाश्चाऽऽश्रमधर्माश्च सागरास्तरवोऽचलाः । नद्यो धर्मश्च कामश्च यज्ञा यज्ञस्य च क्रियाः
    ॥ १६॥ विद्या वेद्यं च सत्त्वं च ह्रीः श्रीः कीर्तिर्धृतिः क्षमा । पुराणं वेदवेदाङ्गं साङ्ख्ययोगौ भवाभवौ
    ॥ १७॥ जङ्गमं स्थावरं चैव भविष्यं च भवच्च यत् । सर्वं तच्च त्रिलोकेषु प्रभावोपहितं तव ॥ १८॥ त्रिदशोदारफलदः
    स्वर्गस्त्रीचारुपल्लवः । सर्वलोकमनःकान्तः सर्वसत्त्वमनोहरः ॥ १९॥ विमानानेकविटपस्तोयदाम्बुमधुस्रवः
    । दिव्यलोकमहास्कन्धः सत्यलोकप्रशाखवान् ॥ २०॥ सागराकारनिर्यासो रसातलजलाश्रयः । नागेन्द्रपादपोपेतो जन्तुपक्षिनिषेवितः
    ॥ २१॥ शीलाचारार्यगन्धस्त्वं सर्वलोकमयो द्रुमः । द्वादशार्कमयद्वीपो रुद्रैकादशपत्तनः ॥ २२॥ वस्वष्टाचलसंयुक्तस्त्रैलोक्याम्भोमहोदधिः
    । सिद्धसाध्योर्मिकलिलः सुपर्णानिलसेवितः ॥ २३॥ दैत्यलोकमहाग्राहो रक्षोरगझषाकुलः । पितामहमहाधैर्यः स्वर्गस्त्रीरत्नभूषितः
    ॥ २४॥ धीश्रीह्रीकान्तिभिर्नित्यं नदीभिरुपशोभितः । कालयोगमहापर्वप्रयागगतिवेगवान् ॥ २५॥ त्वं स्वयोगमहावीर्यो
    नारायण महार्णवः । कालो भूत्वा प्रसन्नाभिरद्भिर्ह्लादयसे पुनः ॥ २६॥ त्वया सृष्टास्त्रयो लोकास्त्वयैव
    प्रतिसंहृताः । विशन्ति योगिनः सर्वे त्वामेव प्रतियोजिताः ॥ २७॥ युगे युगे युगान्ताग्निः कालमेघो युगे
    युगे । मम भारावताराय देव त्वं हि युगे युगे ॥ २८॥ त्वं हि शुक्लः कृतयुगे त्रेतायां चम्पकप्रभः । द्वापरे
    रक्तसङ्काशः कृष्णः कलियुगे भवान् ॥ २९॥ वैवर्ण्यमभिधत्से त्वं प्राप्तेषु युगसन्धिषु । वैवर्ण्यं सर्वधर्माणामुत्पादयसि
    वेदवित् ॥ ३०॥ भासि वासि प्रतपसि त्वं च पासि विचेष्टसे । क्रुध्यसि क्षान्तिमायासि त्वं दीपयसि वर्षसि
    ॥ ३१॥ त्वं हास्यसि न निर्यासि निर्वापयसि जाग्रसि । निःशेषयसि भूतानि कालो भूत्वा युगक्षये ॥ ३२॥ शेषमात्मानमालोक्य
    विशेषयसि त्वं पुनः । युगान्ताग्न्यवलीढेषु सर्वभूतेषु किञ्चन ॥ ३३॥ यातेषु शेषो भवसि तस्माच्छेषोऽसि
    कीर्तितः । च्यवनोत्पत्तियुक्तेषु ब्रह्मेन्द्रवरुणादिषु ॥ ३४॥ यस्मान्न च्यवसे स्थानात्तस्मात्सङ्कीर्त्यसेऽच्युतः
    । ब्रह्माणमिन्द्रं च यमं रुद्रं वरुणमेव च ॥ ३५॥ निगृह्य हरसे यस्मात्तस्माद्धरिरिहोच्यसे । सन्तानयसि
    भूतानि वपुषा यशसा श्रिया ॥ ३६॥ परेण वपुषा देव तस्माच्चासि सनातनः । यस्माद्ब्रह्मादयो देवा मुनयश्चोग्रतेजसः
    ॥ ३७॥ न तेऽन्तं त्वधिगच्छन्ति तेनानन्तस्त्वमुच्यसे । न क्षीयसे न क्षरसे कल्पकोटिशतैरपि ॥ ३८॥ तस्मात्त्वमक्षरत्वाच्च
    अक्षरश्च प्रकीर्तितः । विष्टब्धं यत्त्वया सर्वं जगत्स्थावरजङ्गमम् ॥ ३९॥ जगद्विष्टम्भनाच्चैव विष्णुरेवेति
    कीर्त्यसे । विष्टभ्य तिष्ठसे नित्यं त्रैलोक्यं सचारचरम् ॥ ४०॥ यक्षगन्धर्वनगरं सुमहद्भूतपन्नगम् । व्याप्तं
    त्वयैव विशता त्रैलोक्यं सचराचरम् ॥ ४१॥ तस्माद्विष्णुरिति प्रोक्तः स्वयमेव स्वयम्भुवा । नारा इत्युच्यते
    ह्यापो ह्यृषिभिस्तत्त्वदर्शिभिः ॥ ४२॥ अयनं तस्य ताः पूर्वं तेन नारायणः स्मृतः । युगे युगे प्रनष्टां
    गां विष्णो विन्दसि तत्त्वतः ॥ ४३॥ गोविन्देति ततो नाम्ना प्रोच्यसे ऋषिभिस्तथा । हृषीकाणीन्द्रियाण्याहुस्तत्त्वज्ञानविशारदाः
    ॥ ४४॥ ईशिता च त्वमेतेषां हृषीकेशस्तथोच्यसे । वसन्ति त्वयि भूतानि ब्रह्मादीनि युगक्षये ॥ ४५॥ त्वं वा
    वससि भूतेषु वासुदेवस्तथोच्यसे । सङ्कर्षयसि भूतानि कल्पे कल्पे पुनः पुनः ॥ ४६॥ ततः सङ्कर्षणः प्रोक्तस्तत्त्वज्ञानविशारदैः
    । प्रतिव्यूहेन तिष्ठन्ति सदेवासुरराक्षसाः ॥ ४७॥ प्रविद्युः सर्वधर्माणां प्रद्युम्नस्तेन चोच्यसे ।
    निरोद्धा विद्यते यस्मान्न ते भूतेषु कश्चन ॥ ४८॥ अनिरुद्धस्ततः प्रोक्तः पूर्वमेव महर्षिभिः । यत्त्वया
    धार्यते विश्वं त्वया संह्रियते जगत् ॥ ४९॥ त्वं धारयसि भूतानि भुवनं त्वं बिभर्षि च । यत्त्वया धार्यते
    किञ्चित्तेजसा च बलेन च ॥ ५०॥ मया हि धार्यते पश्चान्नाधृतं धारये त्वया । न हि तद्विद्यते भूतं त्वया
    यन्नात्र धार्यते ॥ ५१॥ त्वमेव कुरुषे देव नारायण युगे युगे । महाभारावतरणं जगतो हितकाम्यया ॥ ५२॥ तवैव
    तेजसाऽऽक्रान्तां रसातलतलं गताम् । त्रायस्व मां सुरश्रेष्ठ त्वामेव शरणं गताम् ॥ ५३॥ दानवैः पीड्यमानाऽहं
    राक्षसैश्च दुरात्मभिः । त्वामेव शरणं नित्यमुपयामि सनातनम् ॥ ५४॥ तावन्मेऽस्ति भयं देव यावन्न त्वां
    ककुद्मिनम् । शरणं यामि मनसा शतशोऽप्युपलक्षये ॥ ५५॥ उपमानं न ते शक्ताः कर्तुं सेन्द्रा दिवौकसः । तत्त्वं
    त्वमेव तद्वेत्सि निरुत्तरमतः परम् ॥ ५६॥ इति मत्स्यपुराणे अष्टचत्वारिंशदधिकद्विशततमाध्यायान्तर्गतं
    पृथिवीकृतं विष्णुस्तोत्रं समाप्तम् । मत्स्यपुराण । अध्याय २४८
