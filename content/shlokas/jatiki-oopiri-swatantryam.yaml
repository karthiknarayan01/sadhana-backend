id: jatiki-oopiri-swatantryam
category: stotram
name:
  english: Jatiki Oopiri Swatantryam
content:
  english: jatiki upiri svatantryam adi jyotiga vèlige caitanyam a caitanyam nilicina nade samasta jagatiki
    saubhagyam || shikharamla jalanidhila prati hridayam alalèttina nade manava jivana gamanamlo mayani
    vèlugula mahodayam || èppati èppati rucirasvapnam i svatantryam èndari èndari tyaga phalam i svatantryam
    andaka andaka andina phalamunu andariki andivvandi || svarajya siddhiki lakshyamemito smarincukondi
    jati vidhata vinutna phalalanu sadhincandi samasyalanni parishkarince saumya margam cupandi || kalatalu
    kakshalu repòddu e kulam peruto marana homam jarapòddu e matam musugulo samaikya bharata saudhagram
    pai shanti dipam nilapandi ||
  devanagari: जातिकि ऊपिरि स्वातन्त्र्यं अदि ज्योतिग वॆलिगे चैतन्यं आ चैतन्यं निलिचिन नाडे समस्त जगतिकि
    सौभाग्यम् ॥ शिखरंला जलनिधिला प्रति हृदयं अललॆत्तिन नाडे मानव जीवन गमनंलो मायनि वॆलुगुल महोदयम् ॥ ऎप्पटि
    ऎप्पटि रुचिरस्वप्नं ई स्वातन्त्र्यं ऎन्दरि ऎन्दरि त्याग फलं ई स्वातन्त्र्यं अन्दक अन्दक अन्दिन फलमुनु
    अन्दरिकी अन्दिव्वण्डि ॥ स्वराज्य सिद्धिकि लक्ष्यमेमिटो स्मरिञ्चुकोण्डि जाति विधात विनूत्न फलालनु साधिञ्चण्डि
    समस्यलन्नी परिष्करिञ्चे सौम्य मार्गं चूपण्डि ॥ कलतलु कक्षलु रेपॊद्दु ए कुलं पेरुतो मारण होमं जरपॊद्दु
    ए मतं मुसुगुलो समैक्य भारत सौधाग्रं पै शान्ति दीपं निलपण्डि ॥
