id: shivasahasralinga
category: stotram
name:
  english: shivasahasralinga
  devanagari: शिवसहस्रलिन्ग
content:
  english: om bhavah shivo haro rudrah purushah padmalocanah || 27|| arthitavyah sadacarah sarvashambhurmaheshvarah
    | ishvarah sthanurishanah sahasrakshah sahasrapat || 28|| variyan varado vandyah shankarah parameshvarah
    | gangadharah shuladharah pararthaikaprayojanah || 29|| sarvajnah sarvadevadigiridhanva jatadharah
    | candrapidashcandramaulirvidvanvishvamareshvarah || 30|| vedantasarasandohah kapali nilalohitah |
    dhyanadharo'paricchedyo gauribharta ganeshvarah || 31|| ashtamurtirvishvamurtistrivargah svargasadhanah
    | jnanagamyo dridhaprajno devadevastrilocanah || 32|| vamadevo mahadevah panduh paridridho dridhah
    | vishvarupo virupaksho vagishah shucirantarah || 33|| sarvapranayasamvadi vrishanko vrishavahanah
    | ishah pinaki khatvangi citraveshashcirantanah || 34|| tamoharo mahayogi gopta brahmangahrijjati
    | kalakalah krittivasah subhagah pranavatmakah || 35|| unmattaveshashcakshushyo durvasah smarashasanah
    | dridhayudhah skandaguruh parameshthi parayanah || 36|| anadimadhyanidhano girisho giribandhavah
    | kuberabandhuh shrikantho lokavarnottamottamah || 37|| samanyadevah kodandi nilakanthah parashvadhi
    | vishalaksho mrigavyadhah sureshah suryatapanah || 38|| dharmakarmakshamah kshetram bhagavan bhaganetrabhit
    | ugrah pashupatistarkshyapriyabhaktah priyamvadah || 39|| data dayakaro dakshah kapardi kamashasanah
    | shmashananilayah sukshmah shmashanastho maheshvarah || 40|| lokakarta bhutapatirmahakarta mahaushadhi
    | uttaro gopatirgopta jnanagamyah puratanah || 41|| nitih sunitih shuddhatma somassomaratah sukhi
    | somapo'mritapah somo mahanitirmahamatih || 42|| ajatashatruralokah sambhavyo havyavahanah | lokakaro
    vedakarah sutrakarah sanatanah || 43|| maharshih kapilacaryo vishvadiptistrilocanah | pinakapanirbhudevah
    svastidah svastikritsada || 44|| tridhama saubhagah sharvah sarvajnah sarvagocarah | brahmadhrigvishvasriksvargah
    karnikarah priyah kavih || 45|| shakho vishakho goshakhah shivo naikah kratuh samah | gangaplavodako
    bhavah sakalassthapatissthirah || 46|| vijitatma vidheyatma bhutavahanasarathih | sagano ganakaryashca
    sukirtishchinnasamshayah || 47|| kamadevah kamapalo bhasmoddhulitavigrahah | bhasmapriyo bhasmashayi
    kami kantah kritagamah || 48|| samayukto nivrittatma dharmayuktah sadashivah | caturmukhashcaturbahurduravaso
    durasadah || 49|| durgamo durlabho durgah sarvayudhavisharadah | adhyatmayoganilayah sutantustantuvardhanah
    || 50|| shubhango lokasarango jagadisho'mritashanah | bhasmashuddhikaro merurojasvi shuddhavigrahah
    || 51|| hiranyaretastaranirmaricirmahimalayah | mahahrado mahagarbhah siddhavrindaravanditah || 52||
    vyaghracarmadharo vyali mahabhuto mahanidhih | amritango'mritavapuh pancayajnah prabhanjanah || 53||
    pancavimshatitattvajnah parijatah paravarah | sulabhah suvratah shuro vanmayaikanidhirnidhih || 54||
    varnashramagururvarni shatrujicchatrutapanah | ashramah kshapanah kshamo jnanavanacalacalah || 55||
    pramanabhuto durjneyah suparno vayuvahanah | dhanurdharo dhanurvedo gunarashirgunakarah || 56|| anantadrishtiranando
    dando damayita damah | abhivadyo mahacaryo vishvakarma visharadah || 57|| vitarago vinitatma tapasvi
    bhutabhavanah | unmattaveshah pracchanno jitakamo jitapriyah || 58|| kalyanaprakritih kalpah sarvalokaprajapatih
    | tapasvi tarako dhiman pradhanah prabhuravyayah || 59|| lokapalo'ntarhitatma kalyadih kamalekshanah
    | vedashastrarthatattvajno niyamo niyamashrayah || 60|| candrah suryah shanih keturviramo vidrumacchavih
    | bhaktigamyah param brahma mrigabanarpano'naghah || 61|| adrirajalayah kantah paramatma jagadguruh
    | sarvakarmacalastvashta mangalyo mangalavritah || 62|| mahatapa dirghatapah sthavishthah sthaviro
    dhruvah | ahah samvatsaro vyaptih pramanam paramam tapah || 63|| samvatsarakaro mantrah pratyayah
    sarvadarshanah | ajah sarveshvarah snigdho mahareta mahabalah || 64|| yogi yogyo maharetah siddhah
    sarvadiragnidah | vasurvasumanah satyah sarvapapaharo harah || 65|| amritah shashvatah shanto banahastah
    pratapavan | kamandaludharo dhanvi vedango vedavinmunih || 66|| bhrajishnurbhojanam bhokta lokaneta
    duradharah | atindriyo mahamayah sarvavasashcatushpathah || 67|| kalayogi mahanado mahotsaho mahabalah
    | mahabuddhirmahaviryo bhutacari purandarah || 68|| nishacarah pretacari mahashaktirmahadyutih | anirdeshyavapuh
    shrimansarvaharyamito gatih || 69|| bahushruto bahumayo niyatatma bhavodbhavah | ojastejo dyutikaro
    nartakah sarvakamakah || 70|| nrityapriyo nrityanrityah prakashatma pratapanah | buddhah spashtaksharo
    mantrah sanmanah sarasamplavah || 71|| yugadikridyugavarto gambhiro vrishavahanah | ishto vishishtah
    shishteshtah sharabhah sharabho dhanuh || 72|| apannidhiradhishthanam vijayo jayakalavit | pratishthitah
    pramanajno hiranyakavaco harih || 73|| virocanah suragano vidyesho vibudhashrayah | balarupo balonmathi
    vivarto gahano guruh || 74|| karanam karanam karta sarvabandhavimocanah | vidvattamo vitabhayo vishvabharta
    nishakarah || 75|| vyavasayo vyavasthanah sthanado jagadadijah | dundubho lalito vishvo bhavatma''tmani
    samsthitah || 76|| vireshvaro virabhadro viraha virabhridvirat | viracudamanirvetta tivranado nadidharah
    || 77|| ajnadharastrishuli ca shipivishtah shivalayah | valakhilyo mahacapastigmamshurnidhiravyayah
    || 78|| abhiramah susharanah subrahmanyah sudhapatih | maghava kaushiko goman vishramah sarvashasanah
    || 79|| lalataksho vishvadehah sarah samsaracakrabhrit | amoghadandi madhyastho hiranyo brahmavarcasi
    || 80|| paramarthah paramayah shambaro vyaghrako'nalah | rucirvararucirvandyo vacaspatiraharpatih
    || 81|| ravirvirocanah skandah shasta vaivasvato janah | yuktirunnatakirtishca shantaragah parajayah
    || 82|| kailasapatih kamarih savita ravilocanah | vidvattamo vitabhayo vishvaharta'nivaritah || 83||
    nityo niyatakalyanah punyashravanakirtanah | durashrava vishvasaho dhyeyo duhsvapnanashanah || 84||
    uttarako dushkritiha durdharsho duhsaho'bhayah | anadirbhurbhuvo lakshmih kiriti tridashadhipah ||
    85|| vishvagopta vishvabharta sudhiro rucirangadah | janano janajanmadih pritimannitimannayah || 86||
    vishishtah kashyapo bhanurbhimo bhimaparakramah | pranavah satpathacaro mahakayo mahadhanuh || 87||
    janmadhipo mahadevah sakalagamaparagah | tattvatattvavivekatma vibhushnurbhutibhushanah || 88|| rishirbrahmanavijjishnurjanmamrityujaratigah
    | yajno yajnapatiryajva yajnanto'moghavikramah || 89|| mahendro durbharah seni yajnango yajnavahanah
    | pancabrahmasamutpattirvishvesho vimalodayah || 90|| atmayoniranadyanto shadvimshatsaptalokadhrik
    | gayatrivallabhah pramshurvishvavasah prabhakarah || 91|| shishurgiriratah samrat sushenah surashatruha
    | amogho'rishtamathano mukundo vigatajvarah || 92|| svayanjyotiranujyotiratmajyotiracancalah | pingalah
    kapilashmashruh shastranetrastrayitanuh || 93|| jnanaskandho mahajnani nirutpattirupaplavah | bhago
    vivasvanadityo yogacaryo brihaspatih || 94|| udarakirtirudyogi sadyogisadasanmayah | nakshatramali
    rakeshah sadhishthanah shadashrayah || 95|| pavitrapanih paparirmanipuro manogatih | hritpundarikamasinah
    shuklah shanto vrishakapih || 96|| vishnurgrahapatih krishnah samartho'narthanashanah | adharmashatrurakshayyah
    puruhutah purushtutah || 97|| brahmagarbho brihadgarbho dharmadhenurdhanagamah | jagaddhitaishissugatah
    kumarah kushalagamah || 98|| hiranyavarno jyotishmannanabhutadharo dhvanih | arogo niyamadhyaksho
    vishvamitro dvijottamah || 99|| brihajjyotih sudhama ca mahajyotiranuttamah | matamaho matarishva
    nabhasvannagaharadhrik || 100|| pulastyah pulaho'gastyo jatukarnyah parasharah | niravaranadharmajno
    virinco vishtarashravah || 101|| atmabhuraniruddho'trih jnanamurtirmahayashah | lokacudamanirvirashcandasatyaparakramah
    || 102|| vyalakalpo mahakalpo mahavrikshah kaladharah | alankarishnustvacalo rocishnurvikramottamah
    || 103|| ashushabdapatirvegi plavanah shikhisarathih | asamsrishto'tithih shakrah pramathi papanashanah
    || 104|| vasushravah kavyavahah pratapto vishvabhojanah | jaryo jaradhishamano lohitashca tanunapat
    || 105|| prishadashvo nabhoyonih supratikastamisraha | nidaghastapano meghah pakshah parapuranjayah
    || 106|| mukhanilah sunishpannah surabhih shishiratmakah | vasanto madhavo grishmo nabhasyo bijavahanah
    || 107|| angiramuniratreyo vimalo vishvavahanah | pavanah purujicchakrastrividyo naravahanah || 108||
    mano buddhirahankarah kshetrajnah kshetrapalakah | tejonidhirjnananidhirvipako vighnakarakah || 109||
    adharo'nuttaro jneyo jyeshtho nihshreyasalayah | shailo nagastanurdoho danavarirarindamah || 110||
    carudhirjanakashcaruvishalyo lokashalyakrit | caturvedashcaturbhavashcaturashcaturapriyah || 111||
    amnayo'tha samamnayastirthadevashshivalayah | bahurupo maharupah sarvarupashcaracarah || 112|| nyayanirvahako
    nyayo nyayagamyo niranjanah | sahasramurdha devendrah sarvashastraprabhanjanah || 113|| mundo virupo
    vikrito dandi danto gunottamah | pingalaksho'tha haryaksho nilagrivo niramayah || 114|| sahasrabahuh
    sarveshah sharanyah sarvalokabhrit | padmasanah paranjyotih paravaraphalapradah || 115|| padmagarbho
    mahagarbho vishvagarbho vicakshanah | paravarajno bijeshah sumukhah sumahasvanah || 116|| devasuragururdevo
    devasuranamaskritah | devasuramahamatro devasuramahashrayah || 117|| devadidevo devarshirdevasuravarapradah
    | devasureshvaro divyo devasuramaheshvarah || 118|| sarvadevamayo'cintyo devatatma''tmasambhavah |
    idyo'nishah suravyaghro devasimho divakarah || 119|| vibudhagravarashreshthah sarvadevottamottamah
    | shivajnanaratah shriman shikhishriparvatapriyah || 120|| jayastambho vishishtambho narasimhanipatanah
    | brahmacari lokacari dharmacari dhanadhipah || 121|| nandi nandishvaro nagno nagnavratadharah shucih
    | lingadhyakshah suradhyaksho yugadhyaksho yugavahah || 122|| svavashah savashah svargah svarah svaramayah
    svanah | bijadhyaksho bijakarta dhanakriddharmavardhanah || 123|| dambho'dambho mahadambhah sarvabhutamaheshvarah
    | shmashananilayastishyah seturapratimakritih || 124|| lokottarasphutalokastryambako nagabhushanah
    | andhakarirmakhadveshi vishnukandharapatanah || 125|| vitadosho'kshayaguno daksharih pushadantahrit
    | dhurjatih khandaparashuh sakalo nishkalo'naghah || 126|| adharah sakaladharah pandurabho mrido natah
    | purnah purayita punyah sukumarah sulocanah || 127|| samageyah priyakarah punyakirtiranamayah | manojavastirthakaro
    jatilo jiviteshvarah || 128|| jivitantakaro nityo vasureta vasupriyah | sadgatih satkritih saktah
    kalakanthah kaladharah || 129|| mani manyo mahakalah sadbhutih satparayanah | candrasanjivanah shasta
    lokagudho'maradhipah || 130|| lokabandhurlokanathah kritajnah kritibhushanah | anapayyaksharah kantah
    sarvashastrabhritam varah || 131|| tejomayo dyutidharo lokamayo'graniranuh | shucismitah prasannatma
    durjayo duratikramah || 132|| jyotirmayo nirakaro jagannatho jaleshvarah | tumbavini mahakayo vishokah
    shokanashanah || 133|| trilokatma trilokeshah shuddhah shuddhirathakshajah | avyaktalakshano vyakto
    vyaktavyakto vishampatih || 134|| varashilo varatulo mano manadhano mayah | brahma vishnuh prajapalo
    hamso hamsagatiryamah || 135|| vedha dhata vidhata ca atta harta caturmukhah | kailasashikharavasi
    sarvavasi satam gatih || 136|| hiranyagarbho harinah purushah purvajah pita | bhutalayo bhutapatirbhutido
    bhuvaneshvarah || 137|| samyogi yogavidbrahma brahmanyo brahmanapriyah | devapriyo devanatho devajno
    devacintakah || 138|| vishamakshah kaladhyaksho vrishanko vrishavardhanah | nirmado nirahankaro nirmoho
    nirupadravah || 139|| darpaha darpito driptah sarvartuparivartakah | saptajihvah sahasrarcih snigdhah
    prakritidakshinah || 140|| bhutabhavyabhavannathah prabhavo bhrantinashanah | artho'nartho mahakoshah
    parakaryaikapanditah || 141|| nishkantakah kritanando nirvyajo vyajamardanah | sattvavansattvikah
    satyakirtistambhakritagamah || 142|| akampito gunagrahi naikatma naikakarmakrit | supritah sumukhah
    sukshmah sukaro dakshino'nalah || 143|| skandhah skandhadharo dhuryah prakatah pritivardhanah | aparajitah
    sarvasaho vidagdhah sarvavahanah || 144|| adhritah svadhritah sadhyah purtamurtiryashodharah | varahasha
  devanagari: ॐ भवः शिवो हरो रुद्रः पुरुषः पद्मलोचनः ॥ २७॥ अर्थितव्यः सदाचारः सर्वशम्भुर्महेश्वरः । ईश्वरः
    स्थाणुरीशानः सहस्राक्षः सहस्रपात् ॥ २८॥ वरीयान् वरदो वन्द्यः शङ्करः परमेश्वरः । गङ्गाधरः शूलधरः परार्थैकप्रयोजनः
    ॥ २९॥ सर्वज्ञः सर्वदेवादिगिरिधन्वा जटाधरः । चन्द्रापीडश्चन्द्रमौलिर्विद्वान्विश्वामरेश्वरः ॥ ३०॥ वेदान्तसारसन्दोहः
    कपाली नीललोहितः । ध्यानाधारोऽपरिच्छेद्यो गौरीभर्ता गणेश्वरः ॥ ३१॥ अष्टमूर्तिर्विश्वमूर्तिस्त्रिवर्गः
    स्वर्गसाधनः । ज्ञानगम्यो दृढप्रज्ञो देवदेवस्त्रिलोचनः ॥ ३२॥ वामदेवो महादेवः पाण्डुः परिदृढो दृढः ।
    विश्वरूपो विरूपाक्षो वागीशः शुचिरन्तरः ॥ ३३॥ सर्वप्रणयसंवादी वृषाङ्को वृषवाहनः । ईशः पिनाकी खट्वाङ्गी
    चित्रवेषश्चिरन्तनः ॥ ३४॥ तमोहरो महायोगी गोप्ता ब्रह्माङ्गहृज्जटी । कालकालः कृत्तिवासाः सुभगः प्रणवात्मकः
    ॥ ३५॥ उन्मत्तवेषश्चक्षुष्यो दुर्वासाः स्मरशासनः । दृढायुधः स्कन्दगुरुः परमेष्ठी परायणः ॥ ३६॥ अनादिमध्यनिधनो
    गिरिशो गिरिबान्धवः । कुबेरबन्धुः श्रीकण्ठो लोकवर्णोत्तमोत्तमः ॥ ३७॥ सामान्यदेवः कोदण्डी नीलकण्ठः परश्वधी
    । विशालाक्षो मृगव्याधः सुरेशः सूर्यतापनः ॥ ३८॥ धर्मकर्माक्षमः क्षेत्रं भगवान् भगनेत्रभित् । उग्रः
    पशुपतिस्तार्क्ष्यप्रियभक्तः प्रियंवदः ॥ ३९॥ दाता दयाकरो दक्षः कपर्दी कामशासनः । श्मशाननिलयः सूक्ष्मः
    श्मशानस्थो महेश्वरः ॥ ४०॥ लोककर्ता भूतपतिर्महाकर्ता महौषधी । उत्तरो गोपतिर्गोप्ता ज्ञानगम्यः पुरातनः
    ॥ ४१॥ नीतिः सुनीतिः शुद्धात्मा सोमस्सोमरतः सुखी । सोमपोऽमृतपः सोमो महानीतिर्महामतिः ॥ ४२॥ अजातशत्रुरालोकः
    सम्भाव्यो हव्यवाहनः । लोककारो वेदकारः सूत्रकारः सनातनः ॥ ४३॥ महर्षिः कपिलाचार्यो विश्वदीप्तिस्त्रिलोचनः
    । पिनाकपाणिर्भूदेवः स्वस्तिदः स्वस्तिकृत्सदा ॥ ४४॥ त्रिधामा सौभगः शर्वः सर्वज्ञः सर्वगोचरः । ब्रह्मधृग्विश्वसृक्स्वर्गः
    कर्णिकारः प्रियः कविः ॥ ४५॥ शाखो विशाखो गोशाखः शिवो नैकः क्रतुः समः । गङ्गाप्लवोदको भावः सकलस्स्थपतिस्स्थिरः
    ॥ ४६॥ विजितात्मा विधेयात्मा भूतवाहनसारथिः । सगणो गणकार्यश्च सुकीर्तिश्छिन्नसंशयः ॥ ४७॥ कामदेवः कामपालो
    भस्मोद्धूलितविग्रहः । भस्मप्रियो भस्मशायी कामी कान्तः कृतागमः ॥ ४८॥ समायुक्तो निवृत्तात्मा धर्मयुक्तः
    सदाशिवः । चतुर्मुखश्चतुर्बाहुर्दुरावासो दुरासदः ॥ ४९॥ दुर्गमो दुर्लभो दुर्गः सर्वायुधविशारदः । अध्यात्मयोगनिलयः
    सुतन्तुस्तन्तुवर्धनः ॥ ५०॥ शुभाङ्गो लोकसारङ्गो जगदीशोऽमृताशनः । भस्मशुद्धिकरो मेरुरोजस्वी शुद्धविग्रहः
    ॥ ५१॥ हिरण्यरेतास्तरणिर्मरीचिर्महिमालयः । महाह्रदो महागर्भः सिद्धवृन्दारवन्दितः ॥ ५२॥ व्याघ्रचर्मधरो
    व्याली महाभूतो महानिधिः । अमृताङ्गोऽमृतवपुः पञ्चयज्ञः प्रभञ्जनः ॥ ५३॥ पञ्चविंशतितत्त्वज्ञः पारिजातः
    परावरः । सुलभः सुव्रतः शूरो वाङ्मयैकनिधिर्निधिः ॥ ५४॥ वर्णाश्रमगुरुर्वर्णी शत्रुजिच्छत्रुतापनः । आश्रमः
    क्षपणः क्षामो ज्ञानवानचलाचलः ॥ ५५॥ प्रमाणभूतो दुर्ज्ञेयः सुपर्णो वायुवाहनः । धनुर्धरो धनुर्वेदो गुणराशिर्गुणाकरः
    ॥ ५६॥ अनन्तदृष्टिरानन्दो दण्डो दमयिता दमः । अभिवाद्यो महाचार्यो विश्वकर्मा विशारदः ॥ ५७॥ वीतरागो विनीतात्मा
    तपस्वी भूतभावनः । उन्मत्तवेषः प्रच्छन्नो जितकामो जितप्रियः ॥ ५८॥ कल्याणप्रकृतिः कल्पः सर्वलोकप्रजापतिः
    । तपस्वी तारको धीमान् प्रधानः प्रभुरव्ययः ॥ ५९॥ लोकपालोऽन्तर्हितात्मा कल्यादिः कमलेक्षणः । वेदशास्त्रार्थतत्त्वज्ञो
    नियमो नियमाश्रयः ॥ ६०॥ चन्द्रः सूर्यः शनिः केतुर्विरामो विद्रुमच्छविः । भक्तिगम्यः परं ब्रह्म मृगबाणार्पणोऽनघः
    ॥ ६१॥ अद्रिराजालयः कान्तः परमात्मा जगद्गुरुः । सर्वकर्माचलस्त्वष्टा माङ्गल्यो मङ्गलावृतः ॥ ६२॥ महातपा
    दीर्घतपाः स्थविष्ठः स्थविरो ध्रुवः । अहः संवत्सरो व्याप्तिः प्रमाणं परमं तपः ॥ ६३॥ संवत्सरकरो मन्त्रः
    प्रत्ययः सर्वदर्शनः । अजः सर्वेश्वरः स्निग्धो महारेता महाबलः ॥ ६४॥ योगी योग्यो महारेताः सिद्धः सर्वादिरग्निदः
    । वसुर्वसुमनाः सत्यः सर्वपापहरो हरः ॥ ६५॥ अमृतः शाश्वतः शान्तो बाणहस्तः प्रतापवान् । कमण्डलुधरो धन्वी
    वेदाङ्गो वेदविन्मुनिः ॥ ६६॥ भ्राजिष्णुर्भोजनं भोक्ता लोकनेता दुराधरः । अतीन्द्रियो महामायः सर्वावासश्चतुष्पथः
    ॥ ६७॥ कालयोगी महानादो महोत्साहो महाबलः । महाबुद्धिर्महावीर्यो भूतचारी पुरन्दरः ॥ ६८॥ निशाचरः प्रेतचारी
    महाशक्तिर्महाद्युतिः । अनिर्देश्यवपुः श्रीमान्सर्वहार्यमितो गतिः ॥ ६९॥ बहुश्रुतो बहुमयो नियतात्मा
    भवोद्भवः । ओजस्तेजो द्युतिकरो नर्तकः सर्वकामकः ॥ ७०॥ नृत्यप्रियो नृत्यनृत्यः प्रकाशात्मा प्रतापनः
    । बुद्धः स्पष्टाक्षरो मन्त्रः सन्मानः सारसम्प्लवः ॥ ७१॥ युगादिकृद्युगावर्तो गम्भीरो वृषवाहनः । इष्टो
    विशिष्टः शिष्टेष्टः शरभः शरभो धनुः ॥ ७२॥ अपान्निधिरधिष्ठानं विजयो जयकालवित् । प्रतिष्ठितः प्रमाणज्ञो
    हिरण्यकवचो हरिः ॥ ७३॥ विरोचनः सुरगणो विद्येशो विबुधाश्रयः । बालरूपो बलोन्माथी विवर्तो गहनो गुरुः ॥
    ७४॥ करणं कारणं कर्ता सर्वबन्धविमोचनः । विद्वत्तमो वीतभयो विश्वभर्ता निशाकरः ॥ ७५॥ व्यवसायो व्यवस्थानः
    स्थानदो जगदादिजः । दुन्दुभो ललितो विश्वो भवात्माऽऽत्मनि संस्थितः ॥ ७६॥ वीरेश्वरो वीरभद्रो वीरहा वीरभृद्विराट्
    । वीरचूडामणिर्वेत्ता तीव्रनादो नदीधरः ॥ ७७॥ आज्ञाधारस्त्रिशूली च शिपिविष्टः शिवालयः । वालखिल्यो महाचापस्तिग्मांशुर्निधिरव्ययः
    ॥ ७८॥ अभिरामः सुशरणः सुब्रह्मण्यः सुधापतिः । मघवा कौशिको गोमान् विश्रामः सर्वशासनः ॥ ७९॥ ललाटाक्षो
    विश्वदेहः सारः संसारचक्रभृत् । अमोघदण्डी मध्यस्थो हिरण्यो ब्रह्मवर्चसी ॥ ८०॥ परमार्थः परमयः शम्बरो
    व्याघ्रकोऽनलः । रुचिर्वररुचिर्वन्द्यो वाचस्पतिरहर्पतिः ॥ ८१॥ रविर्विरोचनः स्कन्दः शास्ता वैवस्वतो
    जनः । युक्तिरुन्नतकीर्तिश्च शान्तरागः पराजयः ॥ ८२॥ कैलासपतिः कामारिः सविता रविलोचनः । विद्वत्तमो वीतभयो
    विश्वहर्ताऽनिवारितः ॥ ८३॥ नित्यो नियतकल्याणः पुण्यश्रवणकीर्तनः । दूरश्रवा विश्वसहो ध्येयो दुःस्वप्ननाशनः
    ॥ ८४॥ उत्तारको दुष्कृतिहा दुर्धर्षो दुःसहोऽभयः । अनादिर्भूर्भुवो लक्ष्मीः किरीटी त्रिदशाधिपः ॥ ८५॥
    विश्वगोप्ता विश्वभर्ता सुधीरो रुचिराङ्गदः । जननो जनजन्मादिः प्रीतिमान्नीतिमान्नयः ॥ ८६॥ विशिष्टः काश्यपो
    भानुर्भीमो भीमपराक्रमः । प्रणवः सत्पथाचारो महाकायो महाधनुः ॥ ८७॥ जन्माधिपो महादेवः सकलागमपारगः । तत्त्वातत्त्वविवेकात्मा
    विभूष्णुर्भूतिभूषणः ॥ ८८॥ ऋषिर्ब्राह्मणविज्जिष्णुर्जन्ममृत्युजरातिगः । यज्ञो यज्ञपतिर्यज्वा यज्ञान्तोऽमोघविक्रमः
    ॥ ८९॥ महेन्द्रो दुर्भरः सेनी यज्ञाङ्गो यज्ञवाहनः । पञ्चब्रह्मसमुत्पत्तिर्विश्वेशो विमलोदयः ॥ ९०॥ आत्मयोनिरनाद्यन्तो
    षड्विंशत्सप्तलोकधृक् । गायत्रीवल्लभः प्रांशुर्विश्वावासः प्रभाकरः ॥ ९१॥ शिशुर्गिरिरतः सम्राट् सुषेणः
    सुरशत्रुहा । अमोघोऽरिष्टमथनो मुकुन्दो विगतज्वरः ॥ ९२॥ स्वयञ्ज्योतिरनुज्योतिरात्मज्योतिरचञ्चलः । पिङ्गलः
    कपिलश्मश्रुः शास्त्रनेत्रस्त्रयीतनुः ॥ ९३॥ ज्ञानस्कन्धो महाज्ञानी निरुत्पत्तिरुपप्लवः । भगो विवस्वानादित्यो
    योगाचार्यो बृहस्पतिः ॥ ९४॥ उदारकीर्तिरुद्योगी सद्योगीसदसन्मयः । नक्षत्रमाली राकेशः साधिष्ठानः षडाश्रयः
    ॥ ९५॥ पवित्रपाणिः पापारिर्मणिपूरो मनोगतिः । हृत्पुण्डरीकमासीनः शुक्लः शान्तो वृषाकपिः ॥ ९६॥ विष्णुर्ग्रहपतिः
    कृष्णः समर्थोऽनर्थनाशनः । अधर्मशत्रुरक्षय्यः पुरुहूतः पुरुष्टुतः ॥ ९७॥ ब्रह्मगर्भो बृहद्गर्भो धर्मधेनुर्धनागमः
    । जगद्धितैषिस्सुगतः कुमारः कुशलागमः ॥ ९८॥ हिरण्यवर्णो ज्योतिष्मान्नानाभूतधरो ध्वनिः । अरोगो नियमाध्यक्षो
    विश्वामित्रो द्विजोत्तमः ॥ ९९॥ बृहज्ज्योतिः सुधामा च महाज्योतिरनुत्तमः । मातामहो मातरिश्वा नभस्वान्नागहारधृक्
    ॥ १००॥ पुलस्त्यः पुलहोऽगस्त्यो जातूकर्ण्यः पराशरः । निरावरणधर्मज्ञो विरिञ्चो विष्टरश्रवाः ॥ १०१॥ आत्मभूरनिरुद्धोऽत्रिः
    ज्ञानमूर्तिर्महायशाः । लोकचूडामणिर्वीरश्चण्डसत्यपराक्रमः ॥ १०२॥ व्यालकल्पो महाकल्पो महावृक्षः कलाधरः
    । अलङ्करिष्णुस्त्वचलो रोचिष्णुर्विक्रमोत्तमः ॥ १०३॥ आशुशब्दपतिर्वेगी प्लवनः शिखिसारथिः । असंसृष्टोऽतिथिः
    शक्रः प्रमाथी पापनाशनः ॥ १०४॥ वसुश्रवाः कव्यवाहः प्रतप्तो विश्वभोजनः । जर्यो जराधिशमनो लोहितश्च तनूनपात्
    ॥ १०५॥ पृषदश्वो नभोयोनिः सुप्रतीकस्तमिस्रहा । निदाघस्तपनो मेघः पक्षः परपुरञ्जयः ॥ १०६॥ मुखानिलः सुनिष्पन्नः
    सुरभिः शिशिरात्मकः । वसन्तो माधवो ग्रीष्मो नभस्यो बीजवाहनः ॥ १०७॥ अङ्गिरामुनिरात्रेयो विमलो विश्ववाहनः
    । पावनः पुरुजिच्छक्रस्त्रिविद्यो नरवाहनः ॥ १०८॥ मनो बुद्धिरहङ्कारः क्षेत्रज्ञः क्षेत्रपालकः । तेजोनिधिर्ज्ञाननिधिर्विपाको
    विघ्नकारकः ॥ १०९॥ अधरोऽनुत्तरो ज्ञेयो ज्येष्ठो निःश्रेयसालयः । शैलो नगस्तनुर्दोहो दानवारिररिन्दमः
    ॥ ११०॥ चारुधीर्जनकश्चारुविशल्यो लोकशल्यकृत् । चतुर्वेदश्चतुर्भावश्चतुरश्चतुरप्रियः ॥ १११॥ आम्नायोऽथ
    समाम्नायस्तीर्थदेवश्शिवालयः । बहुरूपो महारूपः सर्वरूपश्चराचरः ॥ ११२॥ न्यायनिर्वाहको न्यायो न्यायगम्यो
    निरञ्जनः । सहस्रमूर्धा देवेन्द्रः सर्वशस्त्रप्रभञ्जनः ॥ ११३॥ मुण्डो विरूपो विकृतो दण्डी दान्तो गुणोत्तमः
    । पिङ्गलाक्षोऽथ हर्यक्षो नीलग्रीवो निरामयः ॥ ११४॥ सहस्रबाहुः सर्वेशः शरण्यः सर्वलोकभृत् । पद्मासनः
    परञ्ज्योतिः परावरफलप्रदः ॥ ११५॥ पद्मगर्भो महागर्भो विश्वगर्भो विचक्षणः । परावरज्ञो बीजेशः सुमुखः सुमहास्वनः
    ॥ ११६॥ देवासुरगुरुर्देवो देवासुरनमस्कृतः । देवासुरमहामात्रो देवासुरमहाश्रयः ॥ ११७॥ देवादिदेवो देवर्षिर्देवासुरवरप्रदः
    । देवासुरेश्वरो दिव्यो देवासुरमहेश्वरः ॥ ११८॥ सर्वदेवमयोऽचिन्त्यो देवतात्माऽऽत्मसम्भवः । ईड्योऽनीशः
    सुरव्याघ्रो देवसिंहो दिवाकरः ॥ ११९॥ विबुधाग्रवरश्रेष्ठः सर्वदेवोत्तमोत्तमः । शिवज्ञानरतः श्रीमान्
    शिखिश्रीपर्वतप्रियः ॥ १२०॥ जयस्तम्भो विशिष्टम्भो नरसिंहनिपातनः । ब्रह्मचारी लोकचारी धर्मचारी धनाधिपः
    ॥ १२१॥ नन्दी नन्दीश्वरो नग्नो नग्नव्रतधरः शुचिः । लिङ्गाध्यक्षः सुराध्यक्षो युगाध्यक्षो युगावहः ॥
    १२२॥ स्ववशः सवशः स्वर्गः स्वरः स्वरमयः स्वनः । बीजाध्यक्षो बीजकर्ता धनकृद्धर्मवर्धनः ॥ १२३॥ दम्भोऽदम्भो
    महादम्भः सर्वभूतमहेश्वरः । श्मशाननिलयस्तिष्यः सेतुरप्रतिमाकृतिः ॥ १२४॥ लोकोत्तरस्फुटालोकस्त्र्यम्बको
    नागभूषणः । अन्धकारिर्मखद्वेषी विष्णुकन्धरपातनः ॥ १२५॥ वीतदोषोऽक्षयगुणो दक्षारिः पूषादन्तहृत् । धूर्जटिः
    खण्डपरशुः सकलो निष्कलोऽनघः ॥ १२६॥ आधारः सकलाधारः पाण्डुराभो मृडो नटः । पूर्णः पूरयिता पुण्यः सुकुमारः
    सुलोचनः ॥ १२७॥ सामगेयः प्रियकरः पुण्यकीर्तिरनामयः । मनोजवस्तीर्थकरो जटिलो जीवितेश्वरः ॥ १२८॥ जीवितान्तकरो
    नित्यो वसुरेता वसुप्रियः । सद्गतिः सत्कृतिः सक्तः कालकण्ठः कलाधरः ॥ १२९॥ मानी मान्यो महाकालः सद्भूतिः
    सत्परायणः । चन्द्रसञ्जीवनः शास्ता लोकगूढोऽमराधिपः ॥ १३०॥ लोकबन्धुर्लोकनाथः कृतज्ञः कृतिभूषणः । अनपाय्यक्षरः
    कान्तः सर्वशस्त्रभृतां वरः ॥ १३१॥ तेजोमयो द्युतिधरो लोकमायोऽग्रणीरणुः । शुचिस्मितः प्रसन्नात्मा दुर्जयो
    दुरतिक्रमः ॥ १३२॥ ज्योतिर्मयो निराकारो जगन्नाथो जलेश्वरः । तुम्बवीणी महाकायो विशोकः शोकनाशनः ॥ १३३॥
    त्रिलोकात्मा त्रिलोकेशः शुद्धः शुद्धिरथाक्षजः । अव्यक्तलक्षणो व्यक्तो व्यक्ताव्यक्तो विशाम्पतिः ॥
    १३४॥ वरशीलो वरतुलो मानो मानधनो मयः । ब्रह्मा विष्णुः प्रजापालो हंसो हंसगतिर्यमः ॥ १३५॥ वेधा धाता विधाता
    च अत्ता हर्ता चतुर्मुखः । कैलासशिखरावासी सर्वावासी सतां गतिः ॥ १३६॥ हिरण्यगर्भो हरिणः पुरुषः पूर्वजः
    पिता । भूतालयो भूतपतिर्भूतिदो भुवनेश्वरः ॥ १३७॥ संयोगी योगविद्ब्रह्मा ब्रह्मण्यो ब्राह्मणप्रियः ।
    देवप्रियो देवनाथो देवज्ञो देवचिन्तकः ॥ १३८॥ विषमाक्षः कलाध्यक्षो वृषाङ्को वृषवर्धनः । निर्मदो निरहङ्कारो
    निर्मोहो निरुपद्रवः ॥ १३९॥ दर्पहा दर्पितो दृप्तः सर्वर्तुपरिवर्तकः । सप्तजिह्वः सहस्रार्चिः स्निग्धः
    प्रकृतिदक्षिणः ॥ १४०॥ भूतभव्यभवन्नाथः प्रभवो भ्रान्तिनाशनः । अर्थोऽनर्थो महाकोशः परकार्यैकपण्डितः
    ॥ १४१॥ निष्कण्टकः कृतानन्दो निर्व्याजो व्याजमर्दनः । सत्त्ववान्सात्त्विकः सत्यकीर्तिस्तम्भकृतागमः
    ॥ १४२॥ अकम्पितो गुणग्राही नैकात्मा नैककर्मकृत् । सुप्रीतः सुमुखः सूक्ष्मः सुकरो दक्षिणोऽनलः ॥ १४३॥
    स्कन्धः स्कन्धधरो धुर्यः प्रकटः प्रीतिवर्धनः । अपराजितः सर्वसहो विदग्धः सर्ववाहनः ॥ १४४॥ अधृतः स्वधृतः
    साध्यः पूर्तमूर्तिर्यशोधरः । वराहश
