id: hariprarthanastotram
category: stotram
name:
  english: hariprarthanastotram
  devanagari: हरिप्रार्थनास्तोत्रम्
content:
  english: kuntalam pushpakundalam | bhavabhayapaham svaminatha te vapurihastu no nityadarshane || 7||
    sakalasiddhibhih sarvariddhibhih shritapadam sada yogibhirmuda | tadidameva hi svaminatha te vapurihastu
    no nityadarshane || 8|| tava nivasato durgapattanam jayati bhutale sarvato'dhikam | bhavadupashrayat
    muktiratra yad vasati sarvadanyatradurlabha || 9|| kupatha
  devanagari: कुन्तलं पुष्पकुण्डलम् । भवभयापहं स्वामिनाथ ते वपुरिहास्तु नो नित्यदर्शने ॥ ७॥ सकलसिद्धिभिः
    सर्वऋद्धिभिः श्रितपदं सदा योगिभिर्मुदा । तदिदमेव हि स्वामिनाथ ते वपुरिहास्तु नो नित्यदर्शने ॥ ८॥ तव
    निवासतो दुर्गपत्तनं जयति भूतले सर्वतोऽधिकम् । भवदुपाश्रयात् मुक्तिरत्र यद् वसति सर्वदान्यत्रदुर्लभा
    ॥ ९॥ कुपथ
meaning: {}
