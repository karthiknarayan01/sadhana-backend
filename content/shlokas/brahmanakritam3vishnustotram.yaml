id: brahmanakritam3vishnustotram
category: stotram
name:
  english: brahmanakritam3vishnustotram
  devanagari: ब्रह्मणाकृतं३विष्णुस्तोत्रम्
content:
  english: brahmana kritam 3 vishnustotram shriparashara uvaca | tato brahma harerdivyam vishvirupamavekshya
    tat | tushtava bhuyo deveshu sadhvasavanatatmasu || 54|| brahmovaca | namo namaste'stu sahasrakritvassahasrabaho
    bahuvaktrapada | namo namaste jagatah pravrittivinashasamsthanakaraprameya || 55|| sukshmatisukshmatibrihatpramana
    gariyasamapyatigauravatman | pradhanabuddhindriyavatpradhanamulatparatmanbhagavanprasida || 56|| esha
    mahi deva mahiprasutairmahasuraih piditashailabandha | parayanam tvam jagatamupaiti bharavatararthamaparasara
    || 57|| ete vayam vritraripustathayam nasatyadasrau varunastathaiva | ime ca rudra vasavassasuryassamiranagniprasukhastathanye
    || 58|| surassamastassuranathakaryamebhirmaya yacca tadisha sarvam | ajnapayajnam paripalayantastavaiva
    tishthama sadastadoshah || 59|| iti vishnupurane pancamabhage prathamadhyayantargatam brahmana kritam
    vishnustotram samaptam | vishnupurana | adhyaya 5
  devanagari: ब्रह्मणा कृतं ३ विष्णुस्तोत्रम् श्रीपराशर उवाच । ततो ब्रह्मा हरेर्दिव्यं विश्विरूपमवेक्ष्य
    तत् । तुष्टाव भूयो देवेषु साध्वसावनतात्मसु ॥ ५४॥ ब्रह्मोवाच । नमो नमस्तेऽस्तु सहस्रकृत्वस्सहस्रबाहो
    बहुवक्त्रपाद । नमो नमस्ते जगतः प्रवृत्तिविनाशसंस्थानकराप्रमेय ॥ ५५॥ सूक्ष्मातिसूक्ष्मातिबृहत्प्रमाण
    गरीयसामप्यतिगौरवात्मन् । प्रधानबुद्धीन्द्रियवत्प्रधानमूलात्परात्मन्भगवन्प्रसीद ॥ ५६॥ एषा मही देव महीप्रसूतैर्महासुरैः
    पीडितशैलबन्धा । परायणं त्वां जगतामुपैति भारावतारार्थमपारसार ॥ ५७॥ एते वयं वृत्ररिपुस्तथायं नासत्यदस्रौ
    वरुणस्तथैव । इमे च रुद्रा वसवस्ससूर्यास्समीरणाग्निप्रसुखास्तथान्ये ॥ ५८॥ सुरास्समस्तास्सुरनाथकार्यमेभिर्मया
    यच्च तदीश सर्वम् । आज्ञापयाज्ञां परिपालयन्तस्तवैव तिष्ठाम सदास्तदोषाः ॥ ५९॥ इति विष्णुपुराणे पञ्चमभागे
    प्रथमाध्यायान्तर्गतं ब्रह्मणा कृतं विष्णुस्तोत्रं समाप्तम् । विष्णुपुराण । अध्याय ५
meaning: {}
