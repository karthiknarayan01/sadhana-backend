id: shishupalakritamshrikrishnastotram
category: stotram
name:
  english: shishupalakritamshrikrishnastotram
  devanagari: शिशुपालकृतंश्रीकृष्णस्तोत्रम्
content:
  english: shishupalakritam shrikrishnastotram shishupala uvaca | vedanam janako'si tvam vedanganam ca
    madhava | suranamasuranam ca prakritanam ca dehinam || 29|| sukshmam vidhaya srishtim ca kalpabhedam
    karoshi ca | mayaya ca svayam brahma shankarah shashe eva ca || 30|| manavo munayashcaiva devashca
    srishtipalakah | kalamshenapi kalaya dikpalashca grahadayah || 31|| svayam pumansvayam stri ca svayameva
    napumsakah | karanam ca svayam karyam janyashca janakah svayam || 32|| yantrasya ca guno desho yantrinashca
    shrutau shrutam | sarve yantra bhavanyantri tvayi sarvam pratishthitam || 33|| mama kshamasvaparadham
    mudhasya dvarinastava | brahmashapatkubuddheshca raksha raksha jagadguro || 34|| ityevamuktva kramato
    jayo vijaya eva ca | muda tau yayatuh shighram vaikunthadvaramipsitam || 35|| iti shribrahmavaivartapurane
    shrikrishnajanmakhande uttare trayodashadhikashatatamadhyayantargatam shishupalakritam shrikrishnastotram
    samaptam | brahmavaivartapurana | shrikrishnajanma
  devanagari: शिशुपालकृतं श्रीकृष्णस्तोत्रम् शिशुपाल उवाच । वेदानां जनकोऽसि त्वं वेदाङ्गानां च माधव ।
    सुराणामसुराणां च प्राकृतानां च देहिनाम् ॥ २९॥ सूक्ष्मां विधाय सृष्टिं च कल्पभेदं करोषि च । मायया च
    स्वयं ब्रह्मा शङ्करः शषे एव च ॥ ३०॥ मनवो मुनयश्चैव देवाश्च सृष्टिपालकाः । कलांशेनापि कलया दिक्पालाश्च
    ग्रहादयः ॥ ३१॥ स्वयं पुमान्स्वयं स्त्री च स्वयमेव नपुंसकः । कारणं च स्वयं कार्यं जन्यश्च जनकः स्वयम्
    ॥ ३२॥ यन्त्रस्य च गुणो देषो यन्त्रिणश्च श्रुतौ श्रुतम् । सर्वे यन्त्रा भवान्यन्त्री त्वयि सर्वं प्रतिष्ठितम्
    ॥ ३३॥ मम क्षमस्वापराधं मूढस्य द्वारिणस्तव । ब्रह्मशापात्कुबुद्धेश्च रक्ष रक्ष जगद्गुरो ॥ ३४॥ इत्येवमुक्त्वा
    क्रमतो जयो विजय एव च । मुदा तौ ययतुः शीघ्रं वैकुण्ठद्वारमीप्सितम् ॥ ३५॥ इति श्रीब्रह्मवैवर्तपुराणे
    श्रीकृष्णजन्मखण्डे उत्तरे त्रयोदशाधिकशाततमाध्यायान्तर्गतं शिशुपालकृतं श्रीकृष्णस्तोत्रं समाप्तम् ।
    ब्रह्मवैवर्तपुराण । श्रीकृष्णजन्म
meaning: {}
