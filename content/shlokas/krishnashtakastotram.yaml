id: krishnashtakastotram
category: stotram
name:
  english: krishnashtakastotram
  devanagari: कृष्णाष्टकस्तोत्रम्
content:
  english: ghanashyamala shobhitaya divyaya premarasasara sushantidaya | ananda sagara sushobhita muktidaya
    krishnaya shaktisahitaya namaminityam || 3|| ananda sindhu nijadhama nivasakaya svalokavasijana shanti
    sadapradaya | golokameva satatam samalankritaya krishnayashaktisahitaya namaminityam || 4|| kiritinam
    kundalinam vanamalavibhushitam | nirbhayamudraya yuktam karakanja sushobhitam || 5|| prasannavadanam
    devam krishnam vande jagadgurum || shrivasudevam vasudevaputram shridevakinandana krishnacandram |
    shriracyutam vamshidharam murarim mam rakshakam tvam pranamami nityam || 6|| varhavatamvadhara sundaravalarupam
    vimbadharam sumadhuram shishugopavesham | anandakanda muralidhara shyamalam tvam vrindavanalayamaham
    pranamaminityam || 7|| anandamatranca sadaiva nirmalam papam vinashaya satatparam ca tam | svabhaktatranaya
    sada sulagnakam namami krishnam satatam supujyam || 8|| iti shri svami umeshvaranandatirthaviracitam
    shrikrishnashtakastotram sampurnam |
  devanagari: घनश्यामल शोभिताय दिव्याय प्रेमरससार सुशान्तिदाय । आनन्द सागर सुशोभित मुक्तिदाय कृष्णाय शक्तिसहिताय
    नमामिनित्यम् ॥ ३॥ आनन्द सिन्धु निजधाम निवासकाय स्वलोकवासीजन शान्ति सदाप्रदाय । गोलोकमेव सततं समलङ्कृताय
    कृष्णायशक्तिसहिताय नमामिनित्यम् ॥ ४॥ किरीटिनं कुण्डलिनं वनमालाविभूषितम् । निर्भयमुद्रया युक्तं करकञ्ज
    सुशोभितम् ॥ ५॥ प्रसन्नवदनं देवं कृष्णं वन्दे जगद्गुरुम् ॥ श्रीवासुदेवं वसुदेवपुत्रं श्रीदेवकीनन्दन
    कृष्णचन्द्रम् । श्रीरच्यूतं वंशीधरं मुरारिं मां रक्षकं त्वां प्रणमामि नित्यम् ॥ ६॥ वर्हावतंवधर सुन्दरवालरूपं
    विम्बाधरं सुमधुरं शिशुगोपवेषम् । आनन्दकन्द मुरलीधर श्यामलं त्वां वृन्दावनालयमहं प्रणमामिनित्यम् ॥
    ७॥ आनन्दमात्रञ्च सदैव निर्मलं पापं विनाशाय सतत्परं च तम् । स्वभक्तत्राणाय सदा सुलग्नकं नमामि कृष्णं
    सततं सुपूज्यम् ॥ ८॥ इति श्री स्वामी उमेश्वरानन्दतीर्थविरचितं श्रीकृष्णाष्टकस्तोत्रं सम्पूर्णम् ।
