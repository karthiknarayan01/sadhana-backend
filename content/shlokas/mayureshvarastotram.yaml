id: mayureshvarastotram
category: stotram
name:
  english: mayureshvarastotram
  devanagari: मयूरेश्वरस्तोत्रम्
content:
  english: sada bhaktaposham param jnanakosham mayureshavandyam natah smo natah smah || 3|| anadim gunadim
    suradim shivaya mahatoshadam sarvada sarvavandyam | suraryantakam bhuktimuktipradam tam mayureshavandyam
    natah smo natah smah || 4|| param mayinam mayinamapyagamyam munidhyeyamakashakalpam janesham | asankhyavataram
    nijajnananasham mayureshavandyam natah smo natah smah || 5|| anekakriyakarakam shrutyagamyam trayibodhitanekakarmadibijam
    | kriyasiddhihetum surendradisevyam mayureshavandyam natah smo natah smah || 6|| mahakalarupam nimeshadirupam
    kalakalparupam sadagamyarupam | janajnanahetum nrinam siddhidam tam mayureshavandyam natah smo natah
    smah || 7|| maheshadidevaih sada dhyeyapadam sada rakshakam tatpadanam hatarim | muda kamarupam kripavaridhim
    tam mayureshavandyam natah smo natah smah || 8|| sada bhaktim nathe pranayaparamanandasukhado
  devanagari: सदा भक्तपोषं परं ज्ञानकोशं मयूरेशवन्द्यं नताः स्मो नताः स्मः ॥ ३॥ अनादिं गुणादिं सुरादिं
    शिवाया महातोषदं सर्वदा सर्ववन्द्यम् । सुरार्यन्तकं भुक्तिमुक्तिप्रदं तं मयूरेशवन्द्यं नताः स्मो नताः
    स्मः ॥ ४॥ परं मायिनं मायिनामप्यगम्यं मुनिध्येयमाकाशकल्पं जनेशम् । असङ्ख्यावतारं निजाज्ञाननाशं मयूरेशवन्द्यं
    नताः स्मो नताः स्मः ॥ ५॥ अनेकक्रियाकारकं श्रुत्यगम्यं त्रयीबोधितानेककर्मादिबीजम् । क्रियासिद्धिहेतुं
    सुरेन्द्रादिसेव्यं मयूरेशवन्द्यं नताः स्मो नताः स्मः ॥ ६॥ महाकालरूपं निमेषादिरूपं कलाकल्परूपं सदागम्यरूपम्
    । जनज्ञानहेतुं नृणां सिद्धिदं तं मयूरेशवन्द्यं नताः स्मो नताः स्मः ॥ ७॥ महेशादिदेवैः सदा ध्येयपादं
    सदा रक्षकं तत्पदानां हतारिम् । मुदा कामरूपं कृपावारिधिं तं मयूरेशवन्द्यं नताः स्मो नताः स्मः ॥ ८॥
    सदा भक्तिं नाथे प्रणयपरमानन्दसुखदो
