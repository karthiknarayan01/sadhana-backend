id: raghavendrasantoshapradastotram
category: stotram
name:
  english: raghavendrasantoshapradastotram
  devanagari: राघवेन्द्रसन्तोषप्रदस्तोत्रम्
content:
  english: shriraghavendrasantoshapradastotram shridhamani narimadhavaya mama bodhatirahitacittam badhapaharadasadharanaguna
    medhavivara vina tvam | rajanasi gururajamaravara bhujayita sharanam me tosham disha disha dosham
    parihara josham kimasi dayaḻo || 1|| ramakatitatasomananakucasimarucimanubhoktum hemabharanakasamadibhirapi
    mamaptamavadhunite | rajanasi gururajamaravara bhujayita sharanam me tosham disha disha dosham parihara
    josham kimasi dayaḻo || 2|| gharmaparahanasharmavaha tava dharmabhikalitapadu narmanatajanakarmahitamapi
    dharmayayasi mahatman | rajanasi gururajamaravara bhujayita sharanam me tosham disha disha dosham
    parihara josham kimasi dayaḻo || 3|| velavanamatimelabdhaisalilamalamanubhavita cet kilaladhimani
    jalakritiyashaso laghavamudadheh syat | rajanasi gururajamaravara bhujayita sharanam me tosham disha
    disha dosham parihara josham kimasi dayaḻo || 4|| dragagatasujanagara turaganagadi vavidhasampat tyagadara
    karunagara bahulabhogapakapadapadma | rajanasi gururajamaravara bhujayita sharanam me tosham disha
    disha dosham parihara josham kimasi dayaḻo || 5|| yam kamayati kalankavaha bahupankakritirapi yattvam
    tam kamamimamashankakalitamalam karayasi hi tena | rajanasi gururajamaravara bhujayita sharanam me
    tosham disha disha dosham parihara josham kimasi dayaḻo || 6|| nariti gadita marigrahagati ghorikrita
    bhavavardheh
  devanagari: श्रीराघवेन्द्रसन्तोषप्रदस्तोत्रम् श्रीधामनि नरिमाधावय मम बोधातिरहितचित्तं बाधापहरदसाधारणगुण
    मेधाविवर विना त्वाम् । राजानसि गुरुराजामरवर भूजायित शरणं मे तोषं दिश दिश दोषं परिहर जोषं किमसि दयाळो
    ॥ १॥ रामाकटितटसोमाननकुचसीमारुचिमनुभोक्तुं हेमाभरणकसामादिभिरपि मामाप्तमवधुनीते । राजानसि गुरुराजामरवर
    भूजायित शरणं मे तोषं दिश दिश दोषं परिहर जोषं किमसि दयाळो ॥ २॥ घर्मापरहणशर्मावह तव धर्माभिकलितपादू
    नर्मानतजनकर्माहितमपि धर्माययसि महात्मन् । राजानसि गुरुराजामरवर भूजायित शरणं मे तोषं दिश दिश दोषं परिहर
    जोषं किमसि दयाळो ॥ ३॥ वेलावनमतिमेलाब्धैसलिलमालामनुभविता चेत् कीलालधिमणि जालाकृतियशसो लाघवमुदधेः स्यात्
    । राजानसि गुरुराजामरवर भूजायित शरणं मे तोषं दिश दिश दोषं परिहर जोषं किमसि दयाळो ॥ ४॥ द्रागागतसुजनागार
    तुरगनागादि वविधसम्पत् त्यागादर करुणागार बहुलभोगापकपदपद्म । राजानसि गुरुराजामरवर भूजायित शरणं मे तोषं
    दिश दिश दोषं परिहर जोषं किमसि दयाळो ॥ ५॥ यं कामयति कलङ्कावह बहुपङ्काकृतिरपि यत्त्वं तं काममिममशङ्काकलितमलं
    कारयसि हि तेन । राजानसि गुरुराजामरवर भूजायित शरणं मे तोषं दिश दिश दोषं परिहर जोषं किमसि दयाळो ॥ ६॥
    नारीति गदित मारीग्रहगति घोरीकृत भववार्धेः
