id: yamashtakamnp
category: stotram
name:
  english: yamashtakamnP
  devanagari: यमाष्टकम्ण्P
content:
  english: svapurushamabhivikshya pashahastam vadati yamah kila tasya karnamule | parihara madhusudanaprapannan
    prabhurahamanyanrinam na vaishnavanam || 1|| ahamamaraganarcitena dhatra yama iti lokahitahite niyuktah
    | hariguruvimukhan prashasmi martyan haricaranapranatannamaskaromi || 2|| sugatimabhilashami vasudevadahamapi
    bhagavate sthitantaratma | madhuvadhavashago'smi na svatantrah prabhavati samyamane mamapi krishnah
    || 3|| bhagavati vimukhasya nasti siddhirvishamamritam bhavatiti nedamasti | varshashatamapiha pacyamanam
    vrajati na kancanatamayah kadacit || 4|| nahi shashikalushacchavih kadacidviramati no ravitamupaiti
    candrah | bhagavati ca haravananyaceta bhrishamalino'pi virajate manushyah || 5|| mahadapi suvicarya
    lokatattvam bhagavadupastimrite na siddhirasti | suragurusudridhaprasadadau tau haricaranau smaratapavargahetoh
    || 6|| shubhamidamupalabhya manushatvam sukritashatena vrithendriyarthahetoh | ramayati kurute na
    mokshamargam dahayati candanamashu bhasmahetoh || 7|| mukulitakarakudmalaih surendraih satatanamaskritapadapankajo
    yah | avihatagataye sanatanaya jagati janim harate namo'grajaya || 8|| yamashtakamidam punyam pathate
    yah sha
  devanagari: स्वपुरुषमभिवीक्ष्य पाशहस्तं वदति यमः किल तस्य कर्णमूले । परिहर मधुसूदनप्रपन्नान् प्रभुरहमन्यनृणां
    न वैष्णवानाम् ॥ १॥ अहममरगणार्चितेन धात्रा यम इति लोकहिताहिते नियुक्तः । हरिगुरुविमुखान् प्रशास्मि
    मर्त्यान् हरिचरणप्रणतान्नमस्करोमि ॥ २॥ सुगतिमभिलषामि वासुदेवादहमपि भागवते स्थितान्तरात्मा । मधुवधवशगोऽस्मि
    न स्वतन्त्रः प्रभवति संयमने ममापि कृष्णः ॥ ३॥ भगवति विमुखस्य नास्ति सिद्धिर्विषममृतं भवतीति नेदमस्ति
    । वर्षशतमपीह पच्यमानं व्रजति न काञ्चनतामयः कदाचित् ॥ ४॥ नहि शशिकलुषच्छविः कदाचिद्विरमति नो रवितामुपैति
    चन्द्रः । भगवति च हरावनन्यचेता भृशमलिनोऽपि विराजते मनुष्यः ॥ ५॥ महदपि सुविचार्य लोकतत्त्वं भगवदुपास्तिमृते
    न सिद्धिरस्ति । सुरगुरुसुदृढप्रसाददौ तौ हरिचरणौ स्मरतापवर्गहेतोः ॥ ६॥ शुभमिदमुपलभ्य मानुषत्वं सुकृतशतेन
    वृथेन्द्रियार्थहेतोः । रमयति कुरुते न मोक्षमार्गं दहयति चन्दनमाशु भस्महेतोः ॥ ७॥ मुकुलितकरकुड्मलैः
    सुरेन्द्रैः सततनमस्कृतपादपङ्कजो यः । अविहतगतये सनातनाय जगति जनिं हरते नमोऽग्रजाय ॥ ८॥ यमाष्टकमिदं
    पुण्यं पठते यः श
