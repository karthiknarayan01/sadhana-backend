  devanagari: गौडप्रयततत्परः ॥ १५॥ गौडागौडपरित्रात गौडाधिहरणोद्धरः । गौडसेतुर्गौडनतो गौडहेतुगौण्डोत्कता
    ॥ १६॥ गौडहेतुर्गौडत्राही गौडानुग्रहकारकः । गौडागौडानुग्रहभूर्गौडागौडवरप्रदः ॥ १७॥ गौडहृद्गो गौडप्राणो
    गौडसर्वस्वदायकः । गौडवल्लभमूर्तिश्च गौडभूतिर्गौडेष्टदः ॥ १ ८॥ गौडसख्यप्रदाता च गौडदुःखप्रणाशकः । गौडप्रथितनाम
    च गौडाभीष्टकरः सदा ॥ १७॥ गौडहृद्गो गौडप्राणो गौडसर्वस्वदायकः । गौडवल्लभमूर्तिश्च गौडभूतिगडेष्टदः ॥
    १८॥ गौडसख्यप्रदाता च गौडदुःखप्रणाशकः । गौडप्रथितनामा च गौडाभीष्टकरः सदा ॥ १९॥ गौडमान्यो गौडत्राता
    गौडचित्तो गौडोत्कटः । गौडपालो गौडवरो गौड गौरवदायकः ॥ २०॥ गौडगर्जितसन्तुष्टो गौडस्वच्छन्दगः सदा । गौडराजो
    गौडश्रीदो गौडाभयकरः सदा ॥ २१॥ गौडमूर्धाभिषिक्तश्च गौडसैन्यपुरःसरः । गौडातीतो गौडमयो गौडत्रयविभागकृत्
    ॥ २२॥ गौडागौडकृतिधरो गौडन्यासी गौडप्रियः । गौडपूर्णो गौडाम्भोधिर्गौडभाग् गौडदृग्वरः ॥ २३॥ गौडगौरवी
    गौडेशो गुणज्ञो गुणमण्डितः । गौडस्रष्टा गौडेशानो गौडेन्द्रश्च गौडेश्वरः ॥ २४॥ गौडश्रेष्ठो गौडाध्यक्षो
    गौडमुख्यो गुणस्वराट् । गौडप्रविष्टो गुणभृद् गौडकृच्च चराचरः ॥ २५॥ गौडप्रणयसन्तुष्टो गौडागुणपराङ्मुखः
    । गौडैकभूगुणश्रेष्ठो गुणज्येष्ठो गौडप्रभुः ॥ २६॥ गौडज्ञो गुणसंहृष्टो गुणैकसदनं सदा । गौडप्रणवान् गौडप्रकृतिगुणभाजनम्
    ॥ २७॥ गौडप्रणतवादाढ्यो गुणिगीतो गुणोज्ज्वलः । गुणवान् गुणसम्पन्नो गुणानन्दितमानसः ॥ २८॥ गुणसञ्चारचतुरो
    गुणसञ्चयसुन्दरः । गुणगौरो गुणाधारो गुणसंवीतचेतनः ॥ २९॥ गुणदृग् गुणभृन्नित्यं गुणाग्रो गुणपारगः । गुणप्रचारी
    गुणयुग् गुणागुणविवेकवित् ॥ ३०॥ गुणाकरो गुणकरो गुणप्रणयवर्धनः । गुणगूढचरो गौरसर्वसंसारचेष्टितः ॥ ३१॥
    गुणदक्षिणसौहार्दो गुणलक्षणतत्त्ववित् । गुणहारी गुणधारी गुणसङ्गसखः सदा ॥ ३२॥ गुणसंस्कृतसंसारो गुणतत्त्वविवेचकः
    । गुणगर्वधरो गौरः सुखदुःखदयागुणः ॥ ३३॥ गुणाधीन गुणमयः गुणवीक्षणलालसः । गुणगौरवदाता च गुणदाता गुणप्रदः
    ॥ ३४॥ गुणकृद् गुणसम्बन्धो गुणभुग् गुणवन्दनः । गुणहृद्यो गुणस्थायी गुणदायी गुणोत्कटः ॥ ३५॥ गुणचक्रचरो
    गौरावतारो गुणबान्धवः । गुणबन्धुर्गुणप्राज्ञ्यो गुणप्रज्ञो गुणालयः ॥ ३६॥ गुणधाता गुणप्राणो गुणगोपो
    गुणाश्रयः । गुणपायो गुणधायि गुणोपगुणपालकः ॥ ३७॥ गुणायुततनुगौरो गीर्वाणो गुणगौरवः । गुणवत्पूजितपदो
    गुणवत्प्रीतिदायकः ॥ ३८॥ गुणवद्गीतकीर्तिश्च गुणवच्छन्दसौहृदः । गुणवद्वरदो नित्यं गुणवत्प्रतिपालकः ॥
    ३९॥ गुणवद्गुणसन्तुष्टो गुणवद्रचितस्तवः । गुणवद्रक्षणपरो गुणवत्प्रणयप्रियः ॥ ४०॥ गुणवत्तोषणकरो गुणवच्छत्रुसूदनः
    । गुणवद्गुणचित्तस्थो गुणवद्गुणरक्षकः ॥ ४१॥ गुणवच्चक्रसञ्चारो गुणवत्कीर्तिवर्धनः । गुणवत्सिद्धिदाता
    च गुणगौरवप्रदः ॥ ४२॥ गुणवत्प्रणयशान्तो गुणवद्गुणभूषणः । गुणवित्कुलविद्वेषविनाशकरणक्षमः ॥ ४३॥ गणस्तुतगुणो
    गर्जत्प्रलयाम्बुदनिःस्वनः । गौडगजपतिर्गर्ज गौडरङ्गविशारदः ॥ ४४॥ गौरास्यो गौरकर्णोऽथ गौरराजो गौराननः
    । गौररूपधरो गर्ह्यगर्जन्मुखोद्धुरध्वनिः ॥ ४५॥ गौडाधीशो गौडवीरो गौडासुरजयोद्धरः । गौडदन्तो गौरवरो गौडकण्ठो
    गौडध्वनिः ॥ ४६॥ गौडमायो गौडमयो गौडश्रीगौडगर्जितः । गौडामयहरो नित्यं गौडपुष्टिप्रदायकः ॥ ४७॥ गौडोन्नतिगौडत्राता
    गौडप्रभुर्गभुर्गजाधिपः । गौडमुख्यो गौडकुलप्रचारो गौडदैत्यहा ॥ ४८॥ गौडकेतुर्गौडाध्यक्ष गौडसेतुर्गौडाकृतिः
    । गौडवन्द्यो गौडप्राणो गौडसेव्यो गौडप्रभुः ॥ ४९॥ गौडमत्तो गौडेशानो गौडेशो गौडपुङ्गवः । गजदन्तधरो गुञ्जन्मधुपो
    गौडवेश्मगः ॥ ५०॥ गौडच्छद्मो गौडाग्रस्तो गौडमायी गौडाजयः । गौडराट् गौडयूथच गौडगञ्जकभञ्जकः ॥ ५१॥ गर्जितोत्कृतदैत्यासुर्गौडजिद्रातविस्मयः
    । गौड़ज्ञो गौडकुशलो गौडतत्त्वविवेचकः ॥ ५२॥ गौडश्लाघी च गौडस्थो गौडज्ञानपरायणः । गौडगौरववर्धनो गौडप्रबलचेतनः
    ॥ ५३॥ गौडहृदो ज्ञानगुरुर्गौडविद्याविशारदः । गौडध्येयो गौडयूथो गौडध्यानपरायणः ॥ ५४॥ गौडभूर्गौडशीलश्च
    गौडशाली गौडाश्रमः । गौडसुविज्ञानमयो गौडश्रवणलालसः ॥ ५५॥ गौडसाक्षी गौडमयो गौडप्रणयवान् सदा । गौडध्यानो
    गौडबुद्धिर्गौडस्तवमनाः पुनः ॥ ५६॥ गौड़ओत्सुको गौडभूमिर्गौडसीमा गौडोज्ज्वलः । गौडयज्ञवांश्च गौडज्ञानवान्
    गौडमण्डलः ॥ ५७॥ गौडगानप्रणयवान् गौडध्यानाभिभूषणः । गौडसिन्धुर्गौडपरो गौडप्राणो गौडाश्रयः ॥ ५८॥ गौडैकभूर्गौडहृष्टो
    गौडचक्षुर्गौडैकदृक् । गौडमन्त्रो गौडरुचिर्गौडविद् गौडवित्प्रियः ॥ ५९॥ गौडान्तरात्मा गौडाराध्यो गौडभ्राजत्सभः
    सदा । गौडमायो गौडधरो गौडविघ्नविशोधकः ॥ ६०॥ गौडाहितघ्नो गौडेन्द्रो गौडलीनो गौडप्रियः । गौडाधीनो गौडलयो
    गौडाधारो गौडगतिः ॥ ६१॥ गौडातिमानदो गौडभूतिर्गौडकलालयः । गौडगानततो गानानदानविमोहितः ॥ ६२॥ गौडो गौडोदरश्रोणी
    गौडतत्त्वार्थदर्शनः । गौड गुरुगौण्डागुरुः सर्वदा गौडमण्डले ॥ ३३॥ गौडकीर्तिगौडभृतोर्गौण्डव्यक्षो गौडप्रभुः
    । गौडलक्षणसम्पन्नो गौडद्रोहपराङ्मुखः ॥ ६४॥ गौडविद्यो गौडप्राज्ञो गौडबाहुबलोच्छलः । गौडदैत्यगर्वहरो
    गौडदैत्यावहारकः ॥ ६५॥ गौडगर्वहरो ब्रह्मगौरो गुरुदर्पहरः । गौडगौरवदाता च गौडभृत्याघहारकः ॥ ६६॥ गौडगर्जितसम्पूर्णब्रह्माण्डो
    गुरुगर्जितः । गौडपुत्रपुरःसरो गौडपुत्रभयापहा ॥ ६७॥ गौडपुत्रपरित्राता गौडपुत्रवरप्रदः । गौडपुत्राक्षिशमनो
    गौडपुत्राघनाशनः ॥ ६८॥ गौडपुत्रप्राणदाता गौड भक्तिपरायणः । गौडविज्ञानविभवो सदा गौडवरप्रदः ॥ ६९॥ गौडजनोरुदाता
    च गौडक्लेशापहारकः । गौडजनप्रियो गोडसुजनप्रियवर्धनः ॥ ७०॥ गौडजनपरित्राता गौडजनसखः सदा । गौरभानुप्रभो
    गौडभानुभीतिप्रणाशनः ॥ ७१॥ गौडज्ञानन्धयो गौरीमनोवञ्चितसिद्धिकृत् ॥। गौडगौरगुणो गौड प्रकाशो गौडवैभवः
    ॥ ७२॥ गौडेशनन्दनो गडप्रियपुत्रो गदाधरः । गौडवरप्रदो गौडप्रणयो गौरसच्छविः ॥ ७३॥ गौडमनश्चरो गौडप्रवणो
    गौडभावनः । गौडात्मा गौडकीर्तिश्च गौडभावो गरिष्ठदृक ॥ ७४॥ गौडभोगाभिलाषार्थी गौडेशप्राणवल्लभः । गौडाभीष्टवरदश्च
    गौतमाभयदायकः ॥ ७५॥ गौडविक्रमसञ्चारो गौडदृकगुरुविक्रमः । गौडक्रमो गौडश्रेष्ठो गौडपाषण्डखण्डकः ॥ ७६॥
    गौडशुण्डो गौडस्कन्दो गौडजन्यो गौडप्रथः । गौडमानो गौडगणो गौडश्रीर्गौडगर्वभृत् ॥ ७७॥ गौडगुरुपीनांसो
    गौडप्रणयलालसः । गौडमुख्यो गौडकुलस्थायी गौडगुरुः सदा ॥ ७८॥ गौडसंशयभेत्ता च गौडसात्मप्रदायकः । गौडधर्मव्याहारज्ञो
    गौडधार्मिककेतनः ॥ ७९॥ गौडदैन्यो गौडच्छेत्ता गौडसेत्या गौडयुतिः । गौडधर्मप्रगण्यो यः गौडधर्मधुरन्धरः
    ॥ ८०॥ गौडेष्टो गौडसन्तापशमनो गौडपूजितः । गौडधर्मधरो गौडधर्मवीरो गौडापहा ॥ ८१॥ गौडशास्त्रार्थनिलयो
    गौडशास्त्रार्थस्यालयः । गौडमन्त्रो गौडश्रेष्टो गौडमन्त्रफलप्रदः ॥ ८२॥ गौडस्त्रीगमनोद्दामप्रायश्चित्तनिवारकः
    । गौडसंसारसुखदो गौडसंसारदुःखहृत् ॥ ८३॥ गौश्लाघापरो गौडभानुखण्डावतंसभृत् । गौडप्रमत्तमूर्तिश्च गौडेशाघविमोचकः
    ॥ ८४॥ गौरकान्तिर्गौरमहो गुरुशासनपालकः । गौडतन्त्रो गौडप्रज्ञो गौडज्ञो गुरुदैवतम् ॥ ८५॥ गौडसुप्रणयप्रज्ञो
    गौतमाश्रमदुःखहा । गौमतीतीरसञ्चारी गौतमीतीर्थनायकः ॥ ८६॥ गौडापत्यविहारो गौडापत्याधिविनाशनः । गौडपतिर्गोपघनो
    गोपालप्रियदर्शनः ॥ ८७॥ गोपालो गोपनाधारो गौडेश्वरनिबन्धकः । गोपात्मको गोपवरो गोपसार्थसुखावहः ॥ ८८॥
    गौडधनो गोपगोपीगोमान् गोधनवर्धनः । गौडचरो गौडाराध्यो गोचरप्रीतिर्बद्धकृत् ॥ ८९॥ गौतमीगोष्टसन्त्राता
    गोसन्तानातिवर्धकः । गौडाश्रयो गौडगोष्ठीपतिर्गोधनवर्धनः ॥ ९०॥ गौडप्रियो गोष्ठमयो गोष्ठामयनिवर्तकः ।
    गोलोको गौडको गोभृद् गोभर्ता गोसुखावहः ॥ ९१॥ गौडधुग् गोदुघाम्प्रेष्ठो गोदोहगापयःप्रियः । गौडागौडपतिर्गोडप्रभुर्गोत्रिभयापहा
    ॥ ९२॥ गौडवृद्धिकरो गोत्रप्रियो गोत्रार्तिनाशनः । गौडोद्वारपरो गोत्रप्रवरो गोत्रदैवतम् ॥ ९३॥ गौडविख्यातनामा
    च गौडगोत्रप्रपालकः । गौडसेतुर्गोडकेतुर्गोडहेतुर्गोडक्रमः ॥ ९४॥ गौडात्राणकरो गौडपतिर्गौडेशपूजितः ।
    गौडभृद् गौडभूत्राता गौडभीरुसहायकः ॥ ९५॥ गौडभृत्यपूजितश्च गौडभिच्छत्रुसूदनः । गौडभित्प्रीतिदो नित्यं
    गौडभिद्गोत्रपालकः ॥ ९६॥ गौडभिद्गीतचरितो गोत्रभित्प्रणयः सदा । गौडभिद्भयसम्भेत्ता गोत्रभित्त्राणदायकः
    ॥ ९७॥ गौडभिद्गोपनपरो गोत्रभित्सैन्यनायकः । गौडाधिपप्रियो गोत्रपुत्रीपुत्रो गिरिप्रियः ॥ १८॥ ग्रन्थज्ञो
    ग्रन्थकृद् ग्रन्थग्रन्थिभिद् ग्रन्थविघ्नहा । गौडादिग्रन्थसञ्चारो ग्रन्थेशो ग्रन्थलोलुपः ॥ ९९॥ गौडाधीनक्रियो
    ग्रन्थप्रियो ग्रन्थार्थतत्त्ववित् । ग्रन्थसंशयसञ्च्छेत्ता ग्रन्थवक्ताग्रहाग्रणी ॥ १००॥ गौडातीतगुणो
    ग्रन्थग्राही ग्रन्थार्थपरिहारकः । गौडदृग् ग्रन्थविज्ञानं ग्रन्थसन्दर्भशोधकः ॥ १०१॥ ग्रन्थकृत्पूजितो
    ग्रन्थकरो ग्रन्थपरायणः । ग्रन्थपारायणपरो ग्रन्थसन्देहभञ्जकः ॥ १०२॥ गौडकृद्वरदाता च ग्रन्थकृद्वन्दितः
    सदा । गौडान्तरक्तो ग्रन्थाग्रो ग्रन्थानुग्रहदायकः ॥ १०३॥ गौडान्तरात्मा यः सदा ग्रन्थार्थाग्रन्थविग्रहः
    । गौड सेतुर्ग्रन्थहेतुर्ग्रन्थकेतुर्ग्रन्थाग्रतः ॥ १०४॥ ग्रन्थपूज्यो ग्रन्थज्ञेयो ग्रन्थग्रन्थनलालसः
    । गौडभूतिर्ग्रहश्रेष्ठो ग्रहकेतुर्ग्रहाश्रयः ॥ १०५॥ गौडाकारो ग्रन्थकरमान्यो ग्रन्थप्रसारकः । गौश्रमज्ञो
    ग्रन्थाग्रो ग्रन्थभ्रमनिवारकः ॥ १०६॥ गौडप्रवणसर्वज्ञो ग्रन्थप्रणयतत्परः । गौङ्गीतगुणो गीतकीर्तिर्गीतविशारदः
    ॥ १०७॥ गौडस्फीतयशा गीतप्रणयी गीतचञ्चरः । गीतप्रसन्नो गीतात्मा गीतलोलो गतस्पृहः ॥ १०८॥ गीताश्रयो गीतमयो
    गीततत्त्वार्थपारगः । गीतसंशयसञ्छेत्ता गीतसङ्गीतशासनः ॥ १०९॥ गौडार्थज्ञो गीततत्त्वो गीतवत्त्वं गताश्रयः
    । गौडसारोऽथ गीतकृद् गीतविघ्नविनाशनः ॥ ११०॥ गीतासक्तो गीतलीलो गीतापगत सञ्ज्वरः । गौडेकदृग् गीतभूतिर्गीतप्रीतो
    गतालसः ॥ १११॥ गीतवाद्यप्रभुर्गीतविवेकज्ञो गीतप्राणः । गौडभीर्गतविद्वेषो गतसंसारबन्धनः ॥ ११२॥ गौडमायो
    गतत्रासो गौडदुःखगतज्वरः । गतासुभृद् गताज्ञनो गतदुष्टाशयागतः ॥ ११३॥ गतार्तिर्गतसङ्कल्पो गतदुष्टविचेष्टितः
    । गताहङ्कारसञ्चारो गतदर्पाहृताहितः ॥ ११४॥ गौडाविष्टो गौडाभयो गौडागौडनिवारकः । गौडव्यथो गतपापो गतदोषो
    गतपरः ॥ ११५॥ गौडसर्वविकारोऽथ गतगञ्जितकुञ्जरः । गौडकम्पितभूपृष्ठो गतरुडगतकल्मषः ॥ ११६॥ गौडादित्यो गौडसैन्यो
    गतमानो गतश्रमः । गौडाभावो गौडभवो गौडतत्त्वार्थसंश्रयः ॥ ११७॥ गौडशिरोमणिर्गौरो गौडागौडवरप्रदः । गौडावासो
    गौडनाथो गौडवासिनमस्कृतः ॥ ११८॥ गौडतीर्थफलाध्यक्षो गौडात्मगफलप्रदः । गौडमयो गयाक्षेत्रं गौडक्षेत्रनिवासकृत्
    ॥ ११९॥ गौडवासिस्तुस्तो गायन्मधुव्रतलसत्तटः । गौडको गायकवरो गायकेषु फलप्रदः ॥ १२०॥ गौड़प्रणयभोगीच गौडपूज्याभयप्रदः
    । गायकप्रवणस्वान्तो गायकप्रथमः सदा ॥ १२१॥ गौडकोद्गीतसम्प्रीतो गोपकोद्भटविघ्नहा । गौडकेशो गायकेशो गायकान्तरसंवरः
    ॥ १२२॥ गायकप्रियदश्चाथ गायकाधीनविग्रहः । गौडगेयगुणोपात्तो गेयविद् गेयतत्त्ववित् ॥ १२३॥ गायकत्रासदग्रन्थो
    ग्रन्थतत्त्वविवेचकः । गौडानुरागो गौराङ्गो गाढगङ्गाजनाग्रहः ॥ १२४॥ गौडावगाढजलधिर्गाडप्राज्ञमनोमयः ।
    गाढप्रीत्यर्थसैन्योऽथ गाढान्तर्ग्रहतत्परः ॥ १२५॥ गौडालेषरसाभिज्ञो गङ्गाधरभयापहः । गौडागाधगुरुर्गङ्गाधरध्यानपदः
    सदा ॥ १२६॥ गङ्गाधरस्तुतो गङ्गाधराराध्यो गतस्मयः । गौडाधारप्रयो गौडद्विजश्रेष्ठफलप्रदः ॥ १२७॥ गौडजनरसास्वादगुणो
    गोडकुलेश्वरः । गौडजनप्रीतिकरो गङ्गातीरविहारकः ॥ १२८॥ गौडप्रियः सदा गौरगङ्गाजलप्रियः सदा । गौडसज्जनसंवासो
    गौडदेशे च केलिकृत् ॥ १२९॥ गौडालयसंसर्गो च गन्धलुब्धमधुव्रतः । गौडागौडराजोऽथ हि गन्धर्वप्रियकृत् सदा
    ॥ १३०॥ गन्धर्वगणसंसेव्यो गन्धर्वप्रीतिवर्धनः । गौडबीजनिलयोथ गकारो गर्विगर्वधुक् ॥ १३१॥ गन्धर्व गणसंसेव्यो
    गन्धर्ववरदायकः । गौडसेव्यो गौडगजो गन्धर्वकुलदैवतम् ॥ १३६॥ गन्धर्वगर्वसञ्च्छेत्ता गन्धर्ववदर्पहा ।
    गन्धर्वप्रवणस्वान्तो गन्धर्वगणसंस्तुतः ॥ १३३॥ गौण्डार्चितपदभूपो गौडभयापहारकः । गौडनाथो गौडवरो गौडसुप्रतिपालकः
    ॥ १३४॥ गौडगीतसुचरितो गौडप्रणयकृत्प्रभुः । गौडगानश्रवणप्रणयी गर्वभाजनम् ॥ १३५॥ गन्धर्वत्राणसन्नद्धो
    गन्धर्वसमरक्रमः । गौडस्त्रीभिराराध्यो यो गौडागौडमयः सदा ॥ १३६॥ गौडागौडपति
