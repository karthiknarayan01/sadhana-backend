id: skanda-6-kavaca
category: kavacha
name:
  english: skanda-6-kavaca
  devanagari: स्कन्द-६-कवच
content:
  english: skanda shashthi kavacam kappu tudiporkku valvinaipom tunbam pom nènjil padiporku sèlvam palitu
    kathittu ongum nishtaiyun kaikudum nimalar arul kandar shashthi kavacan tanai amarar idar tira amaram
    purinda kumaranadi nènje kuṟi nul shashtiyai nokka sharavana bhavanar sishtaruk kudavum sènkadir velon
    padam irandil panmani cadangai gitam pada kinkini yada maiya nadancèyum mayil vahananar kaiyil velal
    ènai kakka vèndru vandu vara vara vela yudanar varuga varuga varuga mayilon varuga indiran mudala
    yèndisai potra mantira vadivel varuga varuga
  devanagari: स्कन्द षष्ठि कवचं काप्पु तुदिपोर्क्कु वल्विणैपोम् तुन्बम् पोम् नॆन्जिल् पदिपोर्कु सॆल्वम्
    पलितु कथित्तु ओन्गुम् निष्टैयुङ् कैकूडुम् निमलर् अरुल् कन्दर् शष्ठि कवचन् तनै अमरर् इडर् तीर अमरम्
    पुरिन्द कुमरनडि नॆन्जे कुऱि नूल् षष्टियै नोक्क शरवन भवनार् सिश्टरुक् कुडवुम् सॆन्कदिर् वेलोन् पादम्
    इरण्डिल् पन्मणि चदन्गै गीतम् पाड किङ्किणि याड मैय नडन्चॆयुम् मयिल् वाहननार् कैयिल् वेलाल् ऎनै काक्क
    वॆण्ड्रु वन्दु वर वर वेला युदनार् वरुग वरुग वरुग मयिलोन् वरुग इन्दिरन् मुदला यॆण्डिसै पोट्र मन्तिर
    वडिवेल् वरुग वरुग
meaning: {}
