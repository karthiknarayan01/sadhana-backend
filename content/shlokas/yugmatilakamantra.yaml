id: yugmatilakamantra
category: mantra
name:
  english: yugmatilakamantra
  devanagari: युग्मतिलकमन्त्र
content:
  english: shri nimbadityaprakashitah shriyugma tilakamantrah om shriradhikayai svaha || om klim om shrim
    hrim klim om yugalaya radhakrishnaya namah || om sarveshvaraya sarvavighnavinashanaya svaha || iti
    tilakamantrah ||
  devanagari: श्री निम्बादित्यप्रकाशितः श्रीयुग्म तिलकमन्त्रः ॐ श्रीराधिकायै स्वाहा ॥ ॐ क्लीं ॐ श्रीं
    ह्रीं क्लीं ॐ युगलाय राधाकृष्णाय नमः ॥ ॐ सर्वेश्वराय सर्वविघ्नविनाशनाय स्वाहा ॥ इति तिलकमन्त्रः ॥
meaning: {}
