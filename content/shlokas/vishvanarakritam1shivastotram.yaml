id: vishvanarakritam1shivastotram
category: stotram
name:
  english: vishvanarakritam1shivastotram
  devanagari: विश्वानरकृतं१शिवस्तोत्रम्
content:
  english: ryattacchambho tvam tatastvam prapadye || 4|| shabdam grihnasyashravastvam hi jighreraghranastvam
    vyanghrirayasi durat | vyakshah pashyestvam rasajno'pyajihvah kastvam samyagvettyatastvam prapadye
    || 5|| no vedastvamisha sakshaddhi veda no va vishnurno vidhata'khilasya | no yogindra nendramukhyashca
    deva bhakto veda tvamatastvam prapadye || 6|| no te gotram neshajanmapinakhya no va rupam naiva shilam
    na deshah | ittham bhuto'pishvarastvam trilokyah sarvankamanpurayestadbhaje tvam || 7|| tvattah sarvam
    tvam hi sarvam smarare tvam gaurishastvam ca nagno'tishantah | tvam vai vriddhastvam yuva tvam ca
    balastattvam yatkinnasyatastvam nato'smi || 8|| iti shriskadapurane kashikhande purvarddhe dashamadhyayantargatam
    vishvanarakritam shivastotram samaptam | skandapurana | kashikhanda | purvakhanda 1 | adhyaya 10
  devanagari: र्यत्तच्छम्भो त्वं ततस्त्वां प्रपद्ये ॥ ४॥ शब्दं गृह्णास्यश्रवास्त्वं हि जिघ्रेरघ्राणस्त्वं
    व्यङ्घ्रिरायासि दूरात् । व्यक्षः पश्येस्त्वं रसज्ञोऽप्यजिह्वः कस्त्वां सम्यग्वेत्त्यतस्त्वां प्रपद्ये
    ॥ ५॥ नो वेदस्त्वामीश साक्षाद्धि वेद नो वा विष्णुर्नो विधाताऽखिलस्य । नो योगीन्द्रा नेन्द्रमुख्याश्च
    देवा भक्तो वेद त्वामतस्त्वां प्रपद्ये ॥ ६॥ नो ते गोत्रं नेशजन्मापिनाख्या नो वा रूपं नैव शीलं न देशः
    । इत्थं भूतोऽपीश्वरस्त्वं त्रिलोक्याः सर्वान्कामान्पूरयेस्तद्भजे त्वाम् ॥ ७॥ त्वत्तः सर्वं त्वं हि
    सर्वं स्मरारे त्वं गौरीशस्त्वं च नग्नोऽतिशान्तः । त्वं वै वृद्धस्त्वं युवा त्वं च बालस्तत्त्वं यत्किन्नास्यतस्त्वां
    नतोऽस्मि ॥ ८॥ इति श्रीस्कादपुराणे काशीखण्डे पूर्वार्द्धे दशमाध्यायान्तर्गतं विश्वानरकृतं शिवस्तोत्रं
    समाप्तम् । स्कन्दपुराण । काशीखण्ड । पूर्वखण्ड १ । अध्याय १०
