id: krishnam-kalaya-sakhi
category: stotram
name:
  english: Krishnam Kalaya Sakhi
content:
  english: adi krishnam kalaya sakhi sundaram bala krishnam kalaya sakhi sundaram krishnam kathavishaya
    trishnam jagatprabha vishnum surarigana jishnum sada bala krishnam kalaya sakhi sundaram nrityantamiha
    muhuratyantamaparimita bhrityanukulam akhila satyam sada bala krishnam kalaya sakhi sundaram dhiram
    bhavajalabharam sakalavedasaram samastayogidharam sada bala krishnam kalaya sakhi sundaram shringara
    rasabhara sangita sahitya gangalaharikela sangam sada bala krishnam kalaya sakhi sundaram ramena jagadabhiramena
    balabhadraramena samavapta kamena saha bala krishnam kalaya sakhi sundaram damodaram akhila kamakarangana
    shyamakritim asura bhimam sada bala krishnam kalaya sakhi sundaram radharunadhara sutapam saccidanandarupam
    jagatrayabhupam sada bala krishnam kalaya sakhi sundaram artham shitilikritanartham shri narayana
    tirtham paramapurushartham sada bala krishnam kalaya sakhi sundaram
  devanagari: आदि कृष्णं कलय सखि सुन्दरं बाल कृष्णं कलय सखि सुन्दरं कृष्णं कथविषय तृष्णं जगत्प्रभ विष्णुं
    सुरारिगण जिष्णुं सदा बाल कृष्णं कलय सखि सुन्दरं नृत्यन्तमिह मुहुरत्यन्तमपरिमित भृत्यानुकूलं अखिल सत्यं
    सदा बाल कृष्णं कलय सखि सुन्दरं धीरं भवजलभारं सकलवेदसारं समस्तयोगिधारं सदा बाल कृष्णं कलय सखि सुन्दरं
    शृङ्गार रसभर सङ्गीत साहित्य गङ्गालहरिकेल सङ्गं सदा बाल कृष्णं कलय सखि सुन्दरं रामेण जगदभिरामेण बलभद्ररामेण
    समवाप्त कामेन सह बाल कृष्णं कलय सखि सुन्दरं दामोदरं अखिल कामाकरङ्गन श्यामाकृतिं असुर भीमं सदा बाल
    कृष्णं कलय सखि सुन्दरं राधारुणाधर सुतापं सच्चिदानन्दरूपं जगत्रयभूपं सदा बाल कृष्णं कलय सखि सुन्दरं
    अर्थं शितिलीकृतानर्थं श्री नारायण तीर्थं परमपुरुषार्थं सदा बाल कृष्णं कलय सखि सुन्दरं
