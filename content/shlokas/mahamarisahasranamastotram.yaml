id: mahamarisahasranamastotram
category: sahasranama
name:
  english: mahamarisahasranamastotram
  devanagari: महामारीसहस्रनामस्तोत्रम्
content:
  english: shrimahamarisahasranamastotram om shuklambaradharam vishnum shashivarnam caturbhujam | prasannavadanam
    dhyayet sarvavighnopashantaye || om mahamari mahamaya mahamahishavahana | madyapanarata matta madhukaitabhamardini
    || 1|| manyuvritta mahadevi madirapanalampata | mahahanta mahashanta mahakirtirmahabala || 2|| mahashaktirmahavirya
    mahavega manishini | mahotpaladhara manyubhishana mahimalaya || 3|| maharupa mahakrura mahamantra
    mahayudha | mahabhaksha mahalakshmirmahakaḻi mahotsava || 4|| mastakagnirmahahasa mahita madyalolupa
    | marudgana madonmatta mahatalanivasini || 5|| majja malayaja malla mandahasojjvalanmukhi | mahandhakarashamani
    maharanyalayasthita || 6|| manojna mahitodanta madaghurnitalocana | mahashraya mahamukhya mahajihva
    malapaha || 7|| mahapadmavanantastha manjula mangalalaya | maheccha manmathastutya madana madamohini
    || 8|| marmasprisha matsyalola maheshi manjubhashini | manasvini mahodvega mahasankataharini || 9||
    mahasattva mahananda mahakama mahashana | mahabhagavati mahya maharava manonmani || 10|| mahanalapadacara
    mahajanavaraprada | mahakameshvariduti mahakalagnirupini || 11|| makaradikshakarantavarnamalavilasini
    | mahila mandahasasya maharajyapradayini || 12|| mahankusha mahanada mahadurga maheshvari | mahavesha
    mahadhakkadhara mangaladayini || 13|| mangala madhuralapa mahavetalamardini | mahagauri mahamata mahakolahalapriya
    || 14|| mahapishtashanaprita mahavisphotarupini | mahacandi mahavira mahagrasa mahimayi || 15|| mahamohandhakaraghni
    mahadaridryanashini | mahashula maheshvasa mahakashanivasini || 16|| maharogaprashamani mahabhayavinashini
    | maheshi mandagamana mandahasojjvalanmukhi || 17|| madalasagatirmantrarupini mamata matih | mayurapinchikottamsa
    mahalavanyashalini || 18|| mahahivalaya manyughoshana madhurakritih | mahishaghni mahanishtha mathurapuranayika
    || 19|| mahanyasapriya madhyama manasaviharini | mari maya mananiya madhavapriyasodari || 20|| mata
    malavibhusha ma madini margadarshini | magadhivanamadhyastha mashannapritamanasa || 21|| maheshvari
    manasaukavahana masarupini | mayahatasuragana matrimandalamadhyaga || 22|| malini malatijatimallikadisamarcita
    | mitrapriya mitrapujya mihirarunabhasvara || 23|| mimamsa minanayana minaketanapujita | minakshi
    mudgaradhara mundini mundamalini || 24|| mukhya muktavalibhusha munimanasahamsini | mundadidaityadarpaghni
    musalayudhadharini || 25|| mulamantratmika muladharapadmasanasthita | murta mukasurahara mulakarmavinashini
    || 26|| mriganabhilasatkanthi mridvangi mrigavahana | mridupadambuja mrigya mridula mrityunashini
    || 27|| mrinalika tantunibha mriganabhivilepana | mrigankamukuta mrityumari mrityunjayapriya || 28||
    medha medhavati meghacarini mekhalavati | maireyapanasuprita mohadhvantadivakara || 29|| moha mohaprada
    mohanashini mokshadayini | maunji maunjidhara maulisarpa maunijanapriya || 30|| mandarakusumaprakhya
    mantrajna mantrarupini | mankshuprasannavadana manjula mangalaprada || 31|| mamsala mamsanilaya mamsabhakshanalalasa
    | yashasvini yatahara yamabadhavinashini || 32|| yajnopavitini yajnaphalada yatamanasa | yatharthavacana
    yantranilaya yajnarakshini || 33|| yajnamata yajnabhoktri yajneshi yajnasambhava | yajnakriya yajnarupa
    yajnangi yantramadhyaga || 34|| yavagupanasuprita yajnadhupakutuhala | yamuna yaralavakara yaksharajni
    yajuhsvara || 35|| yashoda yantranatana yakshmarogavinashini | yama yakshmahara yashtidharini yajanapriya
    || 36|| yakshini yakshagandharvapujita yamarupini | yamini yamininathapujita yanavahini || 37|| yatrikaikasahaya
    ya yaminimadhyacarini | yamasancarini yagarakshini yagasambhava || 38|| yuvatiryuddhanipuna yugantagnivilocana
    | yukta yugapara yuddharenuka yuddhadurmada || 39|| yuthamadhya yuthasevya yupabaddhabalipriya | yosha
    yodha yoganishtha yoginiganamadhyaga || 40|| yogaprada yogarupa yogini yodhakarini | yogasana yoganidra
    yogya yogijanapriya || 41|| yogagamya yogapara yogihritpadmavasini | yoshitpujanasuprita yoshit yoshitsvarupini
    || 42|| yoktri yauvanamadhyastha yantrabindvarcanapriya | raktambara raktamukhi raktakshi raktapayini
    || 43|| raktabhishekasantushta ravimandalamadhyaga | raktotpaladhara raktanilaya rajanipriya || 44||
    raksha rakshakari ratnabhushana rajanicara | ramya rama rasamayi rajanikarashekhara || 45|| ramani
    ramajanani rambha ramanalampata | rambhaphalapriya ratnakataka ranabhairavi || 46|| rajasvala rajorupa
    rasabhijna rajoguna | rathini rajatakara rata ratipatipriya || 47|| rasalaya rajjuhasta ravinetra
    ratipriya | ranjini ranasantushta rakshoghni ranakalika || 48|| ramajnapalini ratnabhushana rasashevadhih
    | raktabijadisamhartri raktapanakutuhala || 49|| ranapriya ranakari rakacandrasamanana | ragasvarupini
    ragalapasamsaktamanasa || 50|| rakshasi rahumukuta rajni rajyasukhaprada | rajivanayana ratripujita
    ratricarini || 51|| radhika rajamatangi rajahamsasamakrama | rajarajarcita rajyapalini rajakanyaka
    || 52|| rajyalakshmi ripuhara ritijna rushtamanasa | rundhini rukmini rukmavarna rudhiralalasa ||
    53|| rudrani ruciraprakhya runda rudravilasini | rudrakaḻi rudradurga rudhirardrikritakritih || 54||
    rushta rudrakala rudrakopa rucirabhakshini | rudravesha rudramayi rudrasya ruruvahana || 55|| rucahasta
    rupavati rushitaharalolupa | rupalakshanasampanna rupini rupavarjita || 56|| ruparkavigraha rupyashailamadhyanivasini
    | rodasi roshasamraktanayana roganashini || 57|| rohini roshini roshajvalini roshavarjita | roshaveshahataratimandala
    raudrarupini || 58|| raudrakopa rangamari ranjini rangamalini | ranjita ramyavadana ramho rangaladharini
    || 59|| lavitradharini lakshya lakuli lakshanojjvala | lakshandanayika lajja lalita lakshanaprada
    || 60|| laghima lakshyada labhya laghushyama layeshvari | lalajjihva labdhavarna lavangi lashunashana
    || 61|| laghvi lata lalatkesha lasanti lavanashana | layasthityudbhavadhisha laghupujaprasadini ||
    62|| lakshmanagrajasampujya labdhasarvamanoratha | lampata lavasantushta lankanagaravasini || 63||
    lavanyavigraha labhadayini lasyatoshini | lasyapriya lasyalola lasini lajabhakshini || 64|| lalasa
    lasikalasya lavanyagunashalini | laksharasasavarnabha langalayudhadharini || 65|| lipsa liptalingapujya
    lingini lingavarjita | liptagorocana liptacandana likucastani || 66|| likucannapriya lila lilasrishtajagattraya
    | lilavati lubdhamana lubdha lunchitakeshini || 67|| lelihanashikha lekha leshapujaprasadini | lohita
    lolanayana lokeshi lokapalini || 68|| lolambamalini lokavandita lohitekshana | laukiki laukikacara
    lambamanapayodhara || 69|| lam
  devanagari: श्रीमहामारीसहस्रनामस्तोत्रम् ॐ शुक्लाम्बरधरं विष्णुं शशिवर्णं चतुर्भुजम् । प्रसन्नवदनं ध्यायेत्
    सर्वविघ्नोपशान्तये ॥ ॐ महामारी महामाया महामहिषवाहना । मद्यपानरता मत्ता मधुकैटभमर्दिनी ॥ १॥ मन्युवृत्ता
    महादेवी मदिरापानलम्पटा । महाहन्ता महाशान्ता महाकीर्तिर्महाबला ॥ २॥ महाशक्तिर्महावीर्या महावेगा मनीषिणी
    । महोत्पलधरा मन्युभीषणा महिमालया ॥ ३॥ महारूपा महाक्रूरा महामन्त्रा महायुधा । महाभक्षा महालक्ष्मीर्महाकाळी
    महोत्सवा ॥ ४॥ मस्तकाग्निर्महाहासा महिता मद्यलोलुपा । मरुद्गणा मदोन्मत्ता महातलनिवासिनी ॥ ५॥ मज्जा
    मलयजा मल्ला मन्दहासोज्ज्वलन्मुखी । महान्धकारशमनी महारण्यालयस्थिता ॥ ६॥ मनोज्ञा महितोदन्ता मदघूर्णितलोचना
    । महाश्रया महामुख्या महाजिह्वा मलापहा ॥ ७॥ महापद्मवनान्तस्था मञ्जुला मङ्गलालया । महेच्छा मन्मथस्तुत्या
    मदना मदमोहिनी ॥ ८॥ मर्मस्पृशा मत्स्यलोला महेशी मञ्जुभाषिणी । मनस्विनी महोद्वेगा महासङ्कटहारिणी ॥ ९॥
    महासत्त्वा महानन्दा महाकामा महाशना । महाभगवती मह्या महारावा मनोन्मनी ॥ १०॥ महानलपदाचारा महाजनवरप्रदा
    । महाकामेश्वरीदूती महाकालाग्निरूपिणी ॥ ११॥ मकारादिक्षकारान्तवर्णमालाविलासिनी । महिला मन्दहासास्या
    महाराज्यप्रदायिनी ॥ १२॥ महाङ्कुशा महानादा महादुर्गा महेश्वरी । महावेशा महाढक्काधरा मङ्गलदायिनी ॥ १३॥
    मङ्गला मधुरालापा महावेतालमर्दिनी । महागौरी महामाता महाकोलाहलप्रिया ॥ १४॥ महापिष्टाशनप्रीता महाविस्फोटरूपिणी
    । महाचण्डी महावीरा महाग्रासा महीमयी ॥ १५॥ महामोहान्धकारघ्नी महादारिद्र्यनाशिनी । महाशूला महेष्वासा
    महाकाशनिवासिनी ॥ १६॥ महारोगप्रशमनी महाभयविनाशिनी । महेशी मन्दगमना मन्दहासोज्ज्वलन्मुखी ॥ १७॥ मदालसगतिर्मन्त्ररूपिणी
    ममता मतिः । मयूरपिञ्छिकोत्तंसा महालावण्यशालिनी ॥ १८॥ महाहिवलया मन्युघोषणा मधुराकृतिः । महिषघ्नी महानिष्ठा
    मथुरापुरनायिका ॥ १९॥ महान्यासप्रिया मध्यमा मानसविहारिणी । मारी माया माननीया माधवप्रियसोदरी ॥ २०॥ माता
    मालाविभूषा मा मादिनी मार्गदर्शिनी । मागधीवनमध्यस्था माषान्नप्रीतमानसा ॥ २१॥ माहेश्वरी मानसौकवाहना
    मासरुपिणी । मायाहतासुरगणा मातृमण्डलमध्यगा ॥ २२॥ मालिनी मालतीजातीमल्लिकादिसमर्चिता । मित्रप्रिया मित्रपूज्या
    मिहिरारुणभास्वरा ॥ २३॥ मीमांसा मीननयना मीनकेतनपूजिता । मीनाक्षी मुद्गरधरा मुण्डिनी मुण्डमालिनी ॥ २४॥
    मुख्या मुक्तावलीभूषा मुनिमानसहंसिनी । मुण्डादिदैत्यदर्पघ्नी मुसलायुधधारिणी ॥ २५॥ मूलमन्त्रात्मिका
    मूलाधारपद्मासनस्थिता । मूर्ता मूकासुरहरा मूलकर्मविनाशिनी ॥ २६॥ मृगनाभिलसत्कण्ठी मृद्वङ्गी मृगवाहना
    । मृदुपादाम्बुजा मृग्या मृदुला मृत्युनाशिनी ॥ २७॥ मृणालिका तन्तुनिभा मृगनाभिविलेपना । मृगाङ्कमुकुटा
    मृत्युमारी मृत्युञ्जयप्रिया ॥ २८॥ मेधा मेधावती मेघचारिणी मेखलावती । मैरेयपानसुप्रीता मोहध्वान्तदिवाकरा
    ॥ २९॥ मोहा मोहप्रदा मोहनाशिनी मोक्षदायिनी । मौञ्जी मौञ्जीधरा मौलिसर्पा मौनिजनप्रिया ॥ ३०॥ मन्दारकुसुमप्रख्या
    मन्त्रज्ञा मन्त्ररूपिणी । मङ्क्षुप्रसन्नवदना मञ्जुला मङ्गलप्रदा ॥ ३१॥ मांसला मांसनिलया मांसभक्षणलालसा
    । यशस्विनी यताहारा यमबाधाविनाशिनी ॥ ३२॥ यज्ञोपवीतिनी यज्ञफलदा यतमानसा । यथार्थवचना यन्त्रनिलया यज्ञरक्षिणी
    ॥ ३३॥ यज्ञमाता यज्ञभोक्त्री यज्ञेशी यज्ञसम्भवा । यज्ञक्रिया यज्ञरूपा यज्ञाङ्गी यन्त्रमध्यगा ॥ ३४॥
    यवागूपानसुप्रीता यज्ञधूपकुतूहला । यमुना यरलवाकारा यक्षराज्ञी यजुःस्वरा ॥ ३५॥ यशोदा यन्त्रनटना यक्ष्मरोगविनाशिनी
    । यमा यक्ष्महरा यष्टिधारिणी यजनप्रिया ॥ ३६॥ यक्षिणी यक्षगन्धर्वपूजिता यमरूपिणी । यामिनी यामिनीनाथपूजिता
    यानवाहिनी ॥ ३७॥ यात्रिकैकसहाया या यामिनीमध्यचारिणी । यामसञ्चारिणी यागरक्षिणी यागसम्भवा ॥ ३८॥ युवतिर्युद्धनिपुणा
    युगान्ताग्निविलोचना । युक्ता युगपरा युद्धरेणुका युद्धदुर्मदा ॥ ३९॥ यूथमध्या यूथसेव्या यूपबद्धबलिप्रिया
    । योषा योधा योगनिष्ठा योगिनीगणमध्यगा ॥ ४०॥ योगप्रदा योगरूपा योगिनी योधकारिणी । योगासना योगनिद्रा योग्या
    योगिजनप्रिया ॥ ४१॥ योगगम्या योगपरा योगिहृत्पद्मवासिनी । योषित्पूजनसुप्रीता योषित् योषित्स्वरूपिणी
    ॥ ४२॥ योक्त्री यौवनमध्यस्था यन्त्रबिन्द्वर्चनप्रिया । रक्ताम्बरा रक्तमुखी रक्ताक्षी रक्तपायिनी ॥ ४३॥
    रक्ताभिषेकसन्तुष्टा रविमण्डलमध्यगा । रक्तोत्पलधरा रक्तनिलया रजनीप्रिया ॥ ४४॥ रक्षा रक्षाकरी रत्नभूषणा
    रजनीचरा । रम्या रमा रसमयी रजनीकरशेखरा ॥ ४५॥ रमणी रामजननी रम्भा रमणलम्पटा । रम्भाफलप्रिया रत्नकटका
    रणभैरवी ॥ ४६॥ रजस्वला रजोरूपा रसाभिज्ञा रजोगुणा । रथिनी रजताकारा रता रतिपतिप्रिया ॥ ४७॥ रसालया रज्जुहस्ता
    रविनेत्रा रतिप्रिया । रञ्जिनी रणसन्तुष्टा रक्षोघ्नी रणकालिका ॥ ४८॥ रमाज्ञापालिनी रत्नभूषणा रसशेवधिः
    । रक्तबीजादिसंहर्त्री रक्तपानकुतूहला ॥ ४९॥ रणप्रिया रणकरी राकाचन्द्रसमानना । रागस्वरूपिणी रागालापसंसक्तमानसा
    ॥ ५०॥ राक्षसी राहुमुकुटा राज्ञी राज्यसुखप्रदा । राजीवनयना रात्रिपूजिता रात्रिचारिणी ॥ ५१॥ राधिका राजमातङ्गी
    राजहंससमक्रमा । राजराजार्चिता राज्यपालिनी राजकन्यका ॥ ५२॥ राज्यलक्ष्मी रिपुहरा रीतिज्ञा रुष्टमानसा
    । रुन्धिनी रुक्मिणी रुक्मवर्णा रुधिरलालसा ॥ ५३॥ रुद्राणी रुचिरप्रख्या रुण्डा रुद्रविलासिनी । रुद्रकाळी
    रुद्रदुर्गा रुधिरार्द्रीकृताकृतिः ॥ ५४॥ रुष्टा रुद्रकला रुद्रकोपा रुचिरभक्षिणी । रुद्रावेशा रुद्रमयी
    रुद्रास्या रुरुवाहना ॥ ५५॥ रुचाहस्ता रूपवती रूषिताहारलोलुपा । रूपलक्षणसम्पन्ना रूपिणी रूपवर्जिता ॥
    ५६॥ रूपार्कविग्रहा रूप्यशैलमध्यनिवासिनी । रोदसी रोषसंरक्तनयना रोगनाशिनी ॥ ५७॥ रोहिणी रोषिणी रोषज्वालिनी
    रोषवर्जिता । रोषावेशाहतारातिमण्डला रौद्ररूपिणी ॥ ५८॥ रौद्रकोपा रङ्गमारी रञ्जिनी रङ्गमालिनी । रञ्जिता
    रम्यवदना रंहो राङ्गलधारिणी ॥ ५९॥ लवित्रधारिणी लक्ष्या लकुली लक्षणोज्ज्वला । लक्षाण्डनायिका लज्जा ललिता
    लक्षणप्रदा ॥ ६०॥ लघिमा लक्ष्यदा लभ्या लघुश्यामा लयेश्वरी । ललज्जिह्वा लब्धवर्णा लवङ्गी लशुनाशना ॥
    ६१॥ लघ्वी लता ललत्केशा लसन्ती लवणाशना । लयस्थित्युद्भवाधीशा लघुपूजाप्रसादिनी ॥ ६२॥ लक्ष्मणाग्रजसम्पूज्या
    लब्धसर्वमनोरथा । लम्पटा लवसन्तुष्टा लङ्कानगरवासिनी ॥ ६३॥ लावण्यविग्रहा लाभदायिनी लास्यतोषिणी । लास्यप्रिया
    लास्यलोला लासिनी लाजभक्षिणी ॥ ६४॥ लालसा लासिकालास्या लावण्यगुणशालिनी । लाक्षारससवर्णाभा लाङ्गलायुधधारिणी
    ॥ ६५॥ लिप्सा लिप्तालिङ्गपूज्या लिङ्गिनी लिङ्गवर्जिता । लिप्तगोरोचना लिप्तचन्दना लिकुचस्तनी ॥ ६६॥ लिकुचान्नप्रिया
    लीला लीलासृष्टजगत्त्रया । लीलावती लुब्धमना लुब्धा लुञ्छितकेशिनी ॥ ६७॥ लेलिहानशिखा लेखा लेशपूजाप्रसादिनी
    । लोहिता लोलनयना लोकेशी लोकपालिनी ॥ ६८॥ लोलम्बमालिनी लोकवन्दिता लोहितेक्षणा । लौकिकी लौकिकाचारा लम्बमानपयोधरा
    ॥ ६९॥ लं
