id: kyts-2-3-adityebhyo-bhuvadvadbhyascharum-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 2.3 Adityebhyo BhuvadvadbhyaScharum - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ndvitiyakande tritiyah prashnah shri gurubhyo namah
    | harih om || adityebhyo bhuvadvadbhyashcaru dbhutikama aditya va eta mbhutyai prati nudante yo nna
    prapnotyadityaneva bhuvadvata ssvena bhagadheyenopa dhavati ta evaina ngamayanti bhavatyeva ''dityebhyo
    dharayadva ''ditya va aparoddhara aditya avagamayitara adityaneva dharayadvata ssvena bhagadheyenopa
    dhavati ta evainam ddhratyanaparuddhyo bhavatyadite 'sya padama daditeyam va~ aditiriyamevasmai rajyamanu
    manyate satya ''shirityaha satyameva nkuruta iha mana ityaha praja evasmai samanasah karotyupa preta
    maruta ssudanava ena vishpatina 'bhyamugm rajanamityaha maruti vai vi djyeshtho vishpati rvishaivainagm
    rashtrena samardhayati yah parasta dvrihina harecchuklag shca vi cinuyadye shukla nnirvapedaditya
    vai devataya vidvishameva 'sya vidanavagatagm rashtra mityahurye krishna vai~ rashtramubhe eva visha
    ncava gacchati yadi navagacchedima mahamadityebhyo bhaga nnirvapamya 'mushma mprephsanto vishamava
    gamayanti yadi navagacchedashvattha thsapta maddhyameshayamupa nbadhnamya 'mushmadamushyai visho 'vagantorityaditya
    evaina mbaddhavira vishamava gamayanti yadi na mevava gacchatyashvattha bhavantimarutam dojo yadashvattha
    ojasaiva vishamava gacchati sapta bhavanti sapta gana vai maruto ganasha eva vishamava gacchati |
    rabibhayuste prajapati mprajapatyagm shatakrishnala mprajapatyagm shatakrishnala meva svena bhagadheyenopa
    dhavati sa eva rdadhati sarvamayureti shatakrishnala bhavati shatayuh purusha shshatendriya ayushyevendriye
    prati tishthati ghrite bhavatyayurvai ghrita mayushcaivasma amrita nca samici dadhati catvari catvari
    krishnalanyava dyati caturava ''ptya ekadha brahmana upa haratyekadhaiva yajamana ayurdadhatya savadityo
    na vyarocata tasmai devah prayashcitti ntasma etagm saurya madadhuryo brahmavarcasakama ttasma etagm
    saurya svena bhagadheyenopa dhavati sa evasmi ndadhati brahmavarcasyeva bhavatyubhayato rukmau bhavata
    ubhayata evasmi ndadhati prayaje prayaje krishnala njuhoti digbhya evasmai brahmavarcasamava rundha
    agneya yah ~kamayeta hiranyam mmopa namediti yada gneyo bhavatyagneyam dvindate savitro bhavati savitriprasuta
    evaina dvindate bhumyai carurbhavatyasyamevaina dvindata upainagm hiranya nnamati vi va esha indriyena
    viryenardhyate yo hiranyam meva nirvapeddhiranyam vi~ttva nendriyena viryena vyriddhyata etameva nirvapedyasya
    hiranya gneyo bhavatyagneyam dvindati savitro bhavati savitri dvindati bhumyai carurbhavatyasyam va~
    etannashyati yannashyatyasyamevaina thsa indriyena somapithena vya rdhyata sa yadurdhvamudavami tte
    shyamaka abhavan thsa prajapatimupadhava ttasma etagm somendragg ttenaivasminnindriyagm somapithamadadhadvi
    va esha indriyena somapithenardhyate ya etagm somendragg nca svena bhagadheyenopa dhavati tavevasminnindriyagm
    somapitha ndhatto nendriyena somapithena vyriddhyate ya thsaumyo bhavati somapithamevava rundhe yadaindro
    bhavatindriyam vai~ somapitha indriyameva somapithamava rundhe shyamako bhavatyesha vava sa soma ssakshadeva
    somapithamava rundhe 'gnaye datre purodashamashtakapala nnirvapedindraya pradatre purodashamekadashakapala
    'gnirevasmai pashu nprajanayati vriddhanindrah pra yacchati dadhi madhu ghritamapo dhana bhavantyetadvai
    pashunagm rupagm rupenaiva pashunava rundhe panca mbhavati pankta hi pashavo bahu rupa mbhavati bahu
    rupa hi pashava ssamriddhyai prajapatya mbhavati prajapatya vai pashavah prajapatirevasmai pashu nprajanayatyatma
    vai purushasya madhu yanmaddhvagnau juhotyatmanameva ta 'gnau pradadhati panktyau yajyanuvakye bhavatah
    panktah purushah panktah pashava atmanameva mrityornishkriyapashunava rundhe || deva vai satramasata
    ya~shaskamasteshagm somagm rajanam ttavagnishomau samabhavata ntavindro yajnavibhrashto ttavabravidyajayata
    mmeti tasma etamishti mekadashakapalagm saumya ttasma etamishti mekadashakapalagm saumya gneyo bhavati
    teja evasmi ntena dadhati yadaindro bhavatindriyamevasmi thsaumyo brahmavarcasa ''gneyasya ca saumyasya
    caindre samashleshaye dadhatyagnishomiya nkamo nopanamedagneyo vai bra mpibati svameva devatag svena
    bhagadheyenopa dhavati saivaina nkamena samardhayatyupaina nkamo namatyagnishomiya dbrahmavarcasakamo
    'gnishoma veva svena bhagadheyenopa dhavati tavevasmi ndhatto brahmavarcasyeva bhavati yadashtakapala
    bhavati yadashtakapala ''gneyo yacchyamakastena saumya ssamriddhyai somaya vajine nnirvapedyah klaibya
    dreto hi va etasma dvajinamapakramatyathaisha klaibya dbibhaya somameva vajinagg svena bhagadheyenopa
    dhavati sa evasmi ndadhati na klibo bhavatibrahmanaspatya brahmanaspatimeva svena bhagadheyenopa dhavati
    sa evasmai sajata npra yacchati gramyeva bhavati ganavati yajyanuvakye bhavata nkarotyetameva nirvapedyah
    kamayeta brahman visham vi~ nashayeyamiti maruti ya jyanuvakye kurya dbrahmanneva visham stricatvarigmshacca
    'ryamanameva svena bhagadheyenopa dhavati sa evainagm suvargam ngamayatyaryamne caru nnirvapedyah
    kamayeta danakama me praja ssyurityasau va adityo 'ryama yah khalu vai dadati so 'ryamanameva svena
    bhagadheyenopa dhavati sa eva 'smai danakamah prajah karoti danakama asmai praja bhavantyaryamne caru
    nnirvapedyah kamayeta svasti janatamiyamityasau va adityo 'ryamanameva svena bhagadheyenopa dhavati
    sa evaina dgamayati yatra jigamishatindro vai devanamanujavara asi ttasma etamaindramanushuka dbuddhnavati
    agravati yajyanuvakye akaro mparyanayadyo rajanya anujavara ttasma etamaindra dindrameva svena bhagadheyenopa
    dhavati sa evaina mparinayati buddhnavati agravati yajyanuvakye bhavato buddhna pari nayatyanushuko
    bhavatyesha hyetasya devata ya anujavara ssamriddhyai yo bra meva svena bhagadheyenopa dhavati sa
    evainamagragm samanana mparinayati buddhnavati agravati yajyanuvakye bhavato buddhna mpari nayatyanushuko
    bhavatyesha hyetasya devata ya anujavara ttasagm rohinimupai shyantih punaragaccha ttah punarayacata
    ta asmai na punaradada mamishva yatha samavaccha upaishyamyatha te puna rdasyamiti sa ritamami tta
    asmai punaradada ttasagm rohinimevopa ya~kshma araditi tadrajayakshmasya janma ya tpapayakshmasya
    yajjayabhyo ttajjayenyasyaya evametesham njanma veda nainamete yakshma vindantisa eta eva namasya
    vri~namahai samavaccha eva na upaya iti tasma eta yah papayakshmagrihita ttasma etamaditya nnirvapedadityaneva
    svena bhagadheyenopa dhavati ta evaina manva pyayayati navonavo bhavati jayamana iti puro 'nuvakya
    bhavatyayurevasmi ntaya dadhati yamaditya agmshuma pyayayantiti yajyaivainametaya prajapati rdevebhyo
    'bravidyadiman ~loka nabhyatiricyatai tanmamasaditi tadiman ~loka nabhyatyaricyatendragm rajana mindragg
    svarajana ntato vai sa iman ~lokag ssyaditi tasma eta nnirvapedindraya rajne purodasha dhirajayendraya
    svarajne 'savindrah svaradimaneva lokan thsvena bhagadheyenopa dhavati ta evasma anna mprayacchantyannada
    eva bhavati yatha vathsena pratta nduha evameveman ~loka nprattan kamamannadya nduha uttaneshu kapaleshvadhi
    shrayatyayatayamatvaya trayah purodasha bhavanti traya ime loka esham lo~kanamaptya uttara nbhavatyevamiva
    hime loka ssamriddhyai sarveshamabhi gamayannava dyatyachambatkaram vya~tyasamanvahanirdahaya || nte
    devah parajigyana asuranam ttadasmadabhyardho 'cara thsa prajapatimupadhava ttametaya sarvaprishthaya
    madadhadya indriyakamo ttametaya sarvaprishthaya yajayedeta eva devata ssvena bhagadheyenopa dhavati
    ta evasmi ndadhatiyadindraya rathantaraya nirvapati yadevagne stejastadevava rundheyadindraya bar
    hataya yadevendrasya tejastadevava rundhe yadindraya vairupaya yadeva savitu devava rundhe yadindraya
    vairajaya yadeva dhatu devava rundhe yadindraya shakvaraya yadeva maruta devava rundhe yadindraya
    raivataya yadeva brihaspate 'va rundha etavanti vai tejagmsi tanyevava rundha uttaneshu kapaleshvadhi
    shrayatyayatayamatvaya dvadashakapalah purodasho bhavati vaishvadevatvaya bhavati vaishvadevatvaya
    samanta mparyavadyati samanta ya~jamane dadhati vyatyasa manvahanirdahayashva rishabho vrishnirbasta
    vrishatvayaitayaiva yajeta 'bhishasyamana etashcedva asyadevata anna rajano vai kauneyah kratujita
    ttasma etamishti dagnaye bhrajasvate purodasha mashtakapalagm saurya ncarumagnaye bhrajasvate purodasha
    ntayaivasmin cakshuradadha ttasma etamishti dagnaye bhrajasvate purodashamashtakapalagm saurya ncarumagnaye
    bhrajasvate purodasha mashtakapalamagne rvai cakshusha manushya vi cakshusha manushya vi pashyanti
    suryasya pashyanti suryasya deva agni nca svena bhagadheyenopa dhavati tavevasmin cakshu shcakshushi
    evasmi ntenabhitah sauryama nnasikaya cakshushi vidhrite samani ya ssamanagm hi cakshu ssamriddhya
    udutya njatavedasagm sapta tva harito rathe citra ndevanamudagadanikamiti pinda nprayacchati cakshu
    revasmai prayacchati yadeva tasya tat || 'hagm sajateshu bhuyasa ndhirashcetta vasuvi 'hagm sajateshu
    bhuyasa mugrashcetta vasuvi 'hagm sajateshu bhuyasa mabhibhushcetta vasuvi masyamanasya deva ye sajatah
    kumara nkamaye hrida te ma nkamayantagm hrida ta nma amanasah kridhi svaha ''manama nkamaye hrida
    ta ma nkamayantagm hrida ta ma amanasah kridhi svaha vaishvadevigm nnirvapedgramakamo vaishvadeva
    vai sajata vishvaneva devan thsvena bhagadheyenopa dhavati ta evasmai sajata npra yacchanti gramyeva
    bhavati sangrahani bhavati manograhanam mmana eva sajatanam grihnati dhruvo 'hagm sajateshu bhuyasamiti
    paridhi npari dadhatyashishamevaitama shaste 'tho etadeva sarvagm sajateshvadhi bhavati yasyaivam
    vi~dusha ete paridhayah paridhiyanta ama namasyamanasya deva iti tisra ahuti rjuhotyetavanto vai sajata
    ye mahanto ye kshullaka ya sstriyastanevava rundhe ta enamavaruddha upa tishthante || 'si tasya te
    dattam 'si svahendrasya prano 'si tasya te dadatu yasya prano 'si svaha mitravarunayoh prano 'si tasya
    te dattam 'si svaha vishvesha 'si svaha ghritasya dharamamritasya panthamindrena datta ttva vishnuh
    paryapashya ttveda gavyairayat || pavamanena tva stomena gayatrasya vartanyopagmsho rviryena devastva
    savito thsrijatu jivatave jivanasyayai briha stva stomena trishtubho vartanya shukrasya viryena devastva
    savito thsrijatu jivatave jivanasyaya agnestva matraya jagatyai vartanya ''grayanasya viryena devastva
    savito thsrijatu jivatave jivanasyaya imamagna ayushe varcase kridhi priyagm reto varuna soma rajann
    | ma teva sma adite sharma yaccha vishve deva jaradashtiryatha 'sat || agnirayushman nkaromi soma
    ayushman thsa oshadhibhi ryajna ayushman thsa dakshinabhi rbrahma ddeva ayushmantaste 'mritena pitara
    ayushmantaste svadhaya ''yushmantastena tva ''yusha trishtubho vartanya shukrasya viryena devastva
    savitoth ngacchati somagm raso varuna enam va~runapashena grihnati sarasvatim va~gagnavishnu atma
    yasya jyogamayati yo jyogamayavi syadyo va kamayeta sarvamayuriyamiti tasma etamishti mashtakapalagm
    saumya ndashakapalagm sarasvata magnerevasya sharira nnishkrinati somadrasam nmuncati sarasvatena
    vaca ssarva devata vishnuryajno devatabhishcaivainam ya~jnena ca bhishajyatyuta yaditasu rbhavati
    jivatyeva yannava 'sityahashvinau vai devanam bhishajau tabhyamevasmai bheshaja nkarotindrasya prano
    'sityahendriya mevasminnetena dadhati mitravarunayoh prano 'sityaha pranapanave vasminnetena dadhati
    vishvesha 'sityaha viryamevasminnetena dadhati ghritasya dharamamritasya panthamityaha yathayajurevaita
    tpavamanena tva stomene aha pranamevasmi tyaha pranamevasmi stva stomenetyahauja evasminnetena dadhatyagnestva
    matrayetyaha mevasminnetena dadhatyritvijah paryahuryavanta evartvijasta ena mbhishajyanti brahmano
    hastamanvarabhya paryahurekadhaiva yajamana ayurdadhati yadeva tasya taddhiranya nnishpibatyayurvai
    nnishpibatyayurvai ghritamamritagm hiranyamamritadeva ''yurnishpibati shatamana mbhavati shatayuh
    purusha shshatendriya ayushyevendriye pratitishthatyatho khalu yavati nmanyeta tavanmanagg thsamriddhya
    imamagna ayushe varcase kridhityaha ''yurevasmin varco dadhati vishve deva jaradashtiryatha 'saditya
    rayushmaniti hasta ngrihnatyete vai deva ayushmantasta evasminnayurdadhati sarvamayureti || prajapati
    rvarunayashvamanaya thsa paryadiryata sa etam pashadamucyata varuno va eta mpratigrihnati yavato ttavato
    varunan catushkapala dvarunameva svena bhagadheyenopa dhavati sa evainam catushkapala bhavanti catushpaddhyashva
    ssamriddhya ekamatirikta dyameva pratigrahi bhavati yam va~ naddhyeti tasmadeva varunapasha thsauryamekakapalamanu
    nirvapedamumeva ''dityamuccara ssakshadeva varunamava yajate 'ponaptriya mpunaretya nirvapedaphsu
    yonirva ashva ngamayati sa enagm shanta upa tishthate || ya vamindravaruna yatavya tanustayemamagm
    haso muncatam ya~ vamindra varuna sahasya rakshasya tejasya tanustaye mamagm haso muncatam yo~ vamindra
    varuna vagnau sramastam va~ me tena vayajeyo vamindra varuna dvipathsu pashushu catushpathsu goshthe
    griheshvaphsvoshadhishu vanaspatishu sramastam va~ me tenava yaja indro va etasye indriyenapa kramati
    ndriyenapa kramati varuna enam va~runapashena grihnati yah papmana grihito bhavati yah papmana grihita
    nnirvapedindra evasmi ndadhati varuna enam ~varunapasha nmuncati payasya bhavati payo hi va etasma
    dapakramatyathaisha papmana grihito ya tpayasya bhavati paya evasmi ntaya dadhati payasyaya mpurodashamava
    dadhatyatmanvanta nkarotyatho ayatanavanta meva caturdha vyuhati dikshveva pratitishthati puna ssamuhati
    digbhya evasmai bheshaja nkaroti samuhyava dyati yatha nnishkrintati tadrigeva tadyo vamindra varunavagnau
    sramastam va~metenava yaja ityaha durishtya evaina mpati yo va mindra varuna dvipathsu pashushu sramastam
    va~ me tenava yaja ityahaitavatirva apa oshadhayo vanaspatayah prajah pashava upajivaniyasta evasmai
    varunapasha sa pratnavanni kavyendram nnah soma vishvato raksha rajannaghayatah | na rishye || ya
    te dhamani divi ya prithivyam ya~ parvateshvoshadhishvaphsu || tebhirno vishvai thsoma prati havya
    gribhaya || agnishoma savedasa sahuti vanata ndevatra babhuvathuh || yuva etani divi rocananyagnishca
    metani divi rocananyagnishca soma sakratu adhattam || yuvagm sindhugm rabhishasteravadya ngribhitan
    || agnishomavimagm su me shrinutam m | prati suktani haryata ndivo matarishva jabhara mpari shyeno
    adreh | agnishoma brahmana vavridhanorum ya~jnaya cakrathuru lokam || agnishoma havishah prasthitasya
    vitagm m | susharmana svavasa hi bhutamatha dhattam ntva ganapatigm havamahe kavi mupamashravastamam
    | jyeshtharaja mbrahmanaspata a nah shrinvannutibhih sida sadanam | sa ijjanena sa visha sa janmana
    sa putrairvaja mbharate dhana nribhih | devanam shraddhamana havisha brahmanaspati m || sa sushtubha
    sa rikvata ganena valagm ruroja phaligagm ravena | brihaspati rusriya havyasudah kanikradad vavashatirudajat
    || maruto yaddha vo divo shsharma || aryama ''yati vrishabhastuvishma hann | sahasraksho go dvajrabahurasmasu
    devo dravina nbahavo devayanah panthano ndiva acaranti | tebhirno deva mahi sharma yaccha sha nna
    edhi dvipade sha ncatushpade || buddhnadagra rgrinano vi parvatasya drigmhitanyairat | ruja dagrena
    vi mimaya manai rvajrena khanyatrina tpathibhi rdirghayathai ssomasya ta mada indrashcakara | || ||
    pra yo jajne vidvagm asya bandhum vi~shvani devo janima vivakti | brahma brahmana ujjabhara maddhya
    nnicaducca svadhaya 'bhi pratasthau || maha nmahi astabhayadvi jato dyagm sadma parthiva nca rajah
    | sa buddhnada mbrihaspati rdevatayasya samrat || buddhnadyo agramabhyartyojasa brihaspatima vivasanti
    devah | bhinadvalam vi~ puro dardariti kanikrada ssomasya ta mada indrashcakara prajapatestrayastrigmshat
    prajapati rdevebhyo prajapati rvarunaya ya vamindra varuna || harih om || || krishna yajurvediya taittiriya
    samhitaya ndvitiyakande tritiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्द्वितीयकाण्डे तृतीयः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ आ॒दि॒त्येभ्यो॒ भुव॑द्वद्भ्यश्च॒रु द्भूति॑काम आदि॒त्या वा ए॒त म्भूत्यै॒ प्रति॑ नुदन्ते॒ यो न्न
    प्रा॒प्नोत्या॑दि॒त्याने॒व भुव॑द्वत॒ स्स्वेन॑ भाग॒धेये॒नोप॑ धावति॒ त ए॒वैन॒ ङ्गमयन्ति॒ भव॑त्ये॒वा ऽऽदि॒त्येभ्यो॑
    धा॒रय॑द्व ऽऽदि॒त्या वा अ॑परो॒द्धार॑ आदि॒त्या अ॑वगमयि॒तार॑ आदि॒त्याने॒व धा॒रय॑द्वत॒ स्स्वेन॑ भाग॒धेये॒नोप॑
    धावति॒ त ए॒वैनं॑ द्ध्रत्यनपरु॒द्ध्यो भ॑व॒त्यदि॒ते ऽस्य प॒दमा द॑दीते॒यं वाँ अदि॑तिरि॒यमे॒वास्मै॑ रा॒ज्यमनु॑
    मन्यते स॒त्या ऽऽशीरित्या॑ह स॒त्यामे॒वा ङ्कुरुत इ॒ह मन॒ इत्या॑ह प्र॒जा ए॒वास्मै॒ सम॑नसः करो॒त्युप॒
    प्रेत॑ मरुत स्सुदानव ए॒ना वि॒श्पति॑ना॒ ऽभ्य॑मुग्ं राजा॑न॒मित्या॑ह मारु॒ती वै वि ड्ज्ये॒ष्ठो वि॒श्पति॑
    र्वि॒शैवैनग्ं॑ रा॒ष्ट्रेण॒ सम॑र्धयति॒ यः प॒रस्ता द्व्री॒हीना ह॑रेच्छु॒क्लाग् श्च॒ वि चि॑नुया॒द्ये
    शु॒क्ला न्निर्व॑पेदादि॒त्या वै दे॒वत॑या॒ विड्विश॑मे॒वा ऽस्य॒ विडन॑वगतग्ं रा॒ष्ट्र मित्या॑हु॒र्ये कृ॒ष्णा
    वैँ रा॒ष्ट्रमु॒भे ए॒व विश॑ ञ्चाव॑ गच्छति॒ यदि॒ नाव॒गच्छे॑दि॒म म॒हमा॑दि॒त्येभ्यो॑ भा॒ग न्निर्व॑पा॒म्या
    ऽमुष्मा॑ म्प्रे॒फ्सन्तो॒ विश॒मव॑ गमयन्ति॒ यदि॒ नाव॒गच्छे॒दाश्व॑त्था थ्स॒प्त म॑द्ध्यमे॒षाया॒मुप॑ न्ब॑ध्ना॒म्या
    ऽमुष्मा॑द॒मुष्यै॑ वि॒शो ऽव॑गन्तो॒रित्या॑दि॒त्या ए॒वैन॑ म्ब॒द्धवी॑रा॒ विश॒मव॑ गमयन्ति॒ यदि॒ ना मे॒वाव॑
