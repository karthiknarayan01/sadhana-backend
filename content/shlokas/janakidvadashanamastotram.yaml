id: janakidvadashanamastotram
category: stotram
name:
  english: janakidvadashanamastotram
  devanagari: जानकीद्वादशनामस्तोत्रम्
content:
  english: kripanavatsalah || 22|| maithili janaki sita vaidehi janakatmaja | kripapiyushajaladhih priyarha
    ramavallabha || 23|| sunayanasuta viryashulka'yoni rasodbhava | dvadashaitani namani vanchitarthapradani
    hi || 24|| shrijanaka uvaca | aho'ham paramo dhanyo dhanyadhanyo dharatale | sutabhavena mam nityam
    nandayatyakhileshvari || 25|| yasyah sambandhamatrena trilokyam sarvabhubhritam | yatinam yogivaryanam
    siddhanam sumahatmanam || 26|| mahabhagavatanam ca muninam tridivaukasam | pujyapujyaprapujyanam brahmavishnupinakinam
    || 27|| sarvesham durlabhaptinamadarekshanabhajanam | ahamasmi visheshena svalpabhumipatih puman ||
    28|| iti shrijanakicaritamritantargatam shrijanaki dvadashanamastotram sampurnam |
  devanagari: कृपणवत्सलाः ॥ २२॥ मैथिली जानकी सीता वैदेही जनकात्मजा । कृपापीयूषजलधिः प्रियार्हा रामवल्लभा
    ॥ २३॥ सुनयनासुता वीर्यशुल्काऽयोनी रसोद्भवा । द्वादशैतानि नामानि वाञ्छितार्थप्रदानि हि ॥ २४॥ श्रीजनक
    उवाच । अहोऽहं परमो धन्यो धन्यधन्यो धरातले । सुताभावेन मां नित्यं नन्दयत्यखिलेश्वरी ॥ २५॥ यस्याः सम्बन्धमात्रेण
    त्रिलोक्यां सर्वभूभृताम् । यतीनां योगिवर्याणां सिद्धानां सुमहात्मनाम् ॥ २६॥ महाभागवतानां च मुनीनां
    त्रिदिवौकसाम् । पूज्यपूज्यप्रपूज्यानां ब्रह्मविष्णुपिनाकिनाम् ॥ २७॥ सर्वेषां दुर्लभाप्तीनामादरेक्षणभाजनम्
    । अहमस्मि विशेषेण स्वल्पभूमिपतिः पुमान् ॥ २८॥ इति श्रीजानकीचरितामृतान्तर्गतं श्रीजानकी द्वादशनामस्तोत्रं
    सम्पूर्णम् ।
