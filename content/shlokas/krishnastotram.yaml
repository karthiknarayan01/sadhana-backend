id: krishnastotram
category: stotram
name:
  english: krishnastotram
  devanagari: कृष्णस्तोत्रम्
content:
  english: stvam gopiramano'si bhaktahridaye vairagyamayacchasi | divyam rupamavaptavanasi param bhaktastvarupah
    kritah satyam kim nu niranjanashrutivacahsandigdhamasmanmanah || 4|| adityasurayatudhanamanuja nagainikah
    patrinah sampraptah paramam gatim yadupate tvatkirtanat santatam | adyapi tvayi sadhubhaktisahita
    dharmena kirtya shriya divyante viditam maya tadapi me saktam na cittam tvayi || 5|| lokanandanavenunadasudhaya
    kandarpadhikkarana rupenapratimena sarvajagatikshemankaraishceshtitaih | svapne va mama sannidhehi
    sakridapyetavatalam hare kanayapi hi darshitam tava vapurdivyam dvishe smaryatam || 6|| chatrikritya
    mahidharendramatanum govardhanam lilaya ga gopamshca tatha hare'vitavatah kirtishcira jyayasi | dhritva
    prishthatalena mandaragirim hatvasuran rakshito yo bhrata sa nirasta eva karuna na stheyasi te vibho
    || 7|| matsyairavbhavakalmashairbahuvidhairmustabharaih shonitai
  devanagari: स्त्वं गोपीरमणोऽसि भक्तहृदये वैराग्यमायच्छसि । दिव्यं रूपमवाप्तवानसि परं भक्तस्त्वरूपः कृतः
    सत्यं किं नु निरञ्जनश्रुतिवचःसन्दिग्धमस्मन्मनः ॥ ४॥ आदित्यासुरयातुधानमनुजा नागैणिकाः पत्रिणः सम्प्राप्ताः
    परमां गतिं यदुपते त्वत्कीर्तनात् सन्ततम् । अद्यापि त्वयि साधुभक्तिसहिता धर्मेण कीर्त्या श्रिया दीव्यन्ते
    विदितं मया तदपि मे सक्तं न चित्तं त्वयि ॥ ५॥ लोकानन्दनवेणुनादसुधया कन्दर्पधिक्कारणा रूपेणाप्रतिमेन
    सर्वजगतीक्षेमङ्करैश्चेष्टितैः । स्वप्ने वा मम सन्निधेहि सकृदप्येतावतालं हरे काणायापि हि दर्शितं तव
    वपुर्दिव्यं द्विषे स्मर्यताम् ॥ ६॥ छत्रीकृत्य महीधरेन्द्रमतनुं गोवर्धनं लीलया गा गोपांश्च तथा हरेऽवितवतः
    कीर्तिश्चिरा ज्यायसी । धृत्वा पृष्ठतलेन मन्दरगिरिं हत्वासुरान् रक्षितो यो भ्राता स निरस्त एव करुणा
    न स्थेयसी ते विभो ॥ ७॥ मत्स्यैरव्भवकल्मषैर्बहुविधैर्मुस्ताभरैः शोणितै
