content:
  english: vrihyagrasvavishanaratnakalashaprodyatkarambhoruhah | dhyeyo vallabhaya sapadmakaraya shlishtojvaladbhushaya
    vishvotpattivipattisamsthitikaro vighno vishishtartthadah || om vinayakaya namah | om vighnarajaya
    namah | om gauriputraya namah | om ganeshvaraya namah | om skandagrajaya namah | om avyayaya namah
    | om putaya namah | om dakshadhyakshyaya namah | om dvijapriyaya namah | om agnigarbhacchide namah
    | 10 om indrashripradaya namah | om vanibalapradaya namah | om sarvasiddhipradaya namah | om sharvatanayaya
    namah | om gauritanujaya namah | om sharvaripriyaya namah | om sarvatmakaya namah | om srishtikartre
    namah | om devo'nekarcitaya namah | om shivaya namah | 20 om shuddhaya namah | om buddhipriyaya namah
    | om shantaya namah | om brahmacarine namah | om gajananaya namah | om dvaimaturaya namah | om munistutyaya
    namah | om bhakta vighna vinashanaya namah | om ekadantaya namah | om caturbahave namah | 30 om shaktisamyutaya
    namah | om caturaya namah | om lambodaraya namah | om shurpakarnaya namah | om herambaya namah | om
    brahmavittamaya namah | om kalaya namah | om grahapataye namah | om kamine namah | om somasuryagnilocanaya
    namah | 40 om pashankushadharaya namah | om chandaya namah | om gunatitaya namah | om niranjanaya
    namah | om akalmashaya namah | om svayamsiddharcitapadaya namah | om bijapurakaraya namah | om avyaktaya
    namah | om gadine namah | om varadaya namah | 50 om shashvataya namah | om kritine namah | om vidvatpriyaya
    namah | om vitabhayaya namah | om cakrine namah | om ikshucapadhrite namah | om abjotpalakaraya namah
    | om shridhaya namah | om shrihetave namah | om stutiharshataya namah | 60 om kaladbhrite namah |
    om jatine namah | om candracudaya namah | om amareshvaraya namah | om nagayajnopavitine namah | om
    shrikantaya namah | om ramarcitapadaya namah | om vritine namah | om sthulakantaya namah | om trayikartre
    namah | 70 om sanghoshapriyaya namah | om purushottamaya namah | om sthulatundaya namah | om agrajanyaya
    namah | om gramanye namah | om ganapaya namah | om sthiraya namah | om vriddhidaya namah | om subhagaya
    namah | om shuraya namah | 80 om vagishaya namah | om siddhidaya namah | om durvabilvapriyaya namah
    | om kantaya namah | om papaharine namah | om kritagamaya namah | om samahitaya namah | om vakratundaya
    namah | om shripradaya namah | om saumyaya namah | 90 om bhaktakankshitadaya namah | om acyutaya namah
    | om kevalaya namah | om siddhaya namah | om saccidanandavigrahaya namah | om jnanine namah | om mayayuktaya
    namah | om dantaya namah | om brahmishthaya namah | om bhayavarcitaya namah | 100 om pramattadaityabhayadaya
    namah | om vyaktamurtaye namah | om amurtaye namah | om parvatishankarotsangakhelanotsavalalanaya
    namah | om samastajagadadharaya namah | om varamushakavahanaya namah | om hrishtastutaya namah | om
    prasannatmane namah | om sarvasiddhipradayakaya namah | 108
  devanagari: व्रीह्यग्रस्वविषाणरत्नकलशप्रोद्यत्कराम्भोरुहः । ध्येयो वल्लभया सपद्मकरया श्लिष्टोज्वलद्भूषया
    विश्वोत्पत्तिविपत्तिसंस्थितिकरो विघ्नो विशिष्टार्त्थदः ॥ ॐ विनायकाय नमः । ॐ विघ्नराजाय नमः । ॐ गौरीपुत्राय
