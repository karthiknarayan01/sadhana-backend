id: purusha-suktam
category: stotram
name:
  english: Purusha Suktam
  devanagari: पुरुषसूक्तम् (शुक्लयजुर्वेदीयम्)
content:
  english: '|| atha shuklayajurvediya purushasuktah|| harih om sahasrashirsha purushah sahasrakshah sahasrapat
    | sa bhumi sarvata spritva''tyatishthaddashangulam || 1|| purusha eveda sarvam yadbhutam yacca bhavyam
    | utamritatvasyeshano yadannenatirohati || 2|| etavanasya mahimato jyaya~shca purushah | pado''sya
    vishva bhutani tripadasyamritam divi || 3|| tripadurdhva udaitpurushah pado''syehabhavat punah | tato
    vishvan vyakramatsashananashane abhi || 4|| tato viradajayata virajo adhi purushah | sa jato atyaricyata
    pashcadbhumimatho purah || 5|| tasmadyajnat sarvahutah sambhritam prishadajyam | pashu~sta~shcakre
    vayavyanaranya gramyashca ye || 6|| tasmadyajnat sarvahutah ricah samani jajnire | chandasi jajnire
    tasmadyajustasmadajayata || 7|| tasmadashva ajayanta ye ke cobhayadatah | gavo ha jajnire tasmattasmajjata
    ajavayah || 8|| tam yajnam barhishi praukshan purusham jatamagratah | tena deva ayajanta sadhya rishayashca
    ye || 9|| yatpurusham vyadadhuh katidha vyakalpayan | mukham kimasyasit kim bahu kimuru pada ucyete
    || 10|| brahmano''sya mukhamasidbahu rajanyah kritah | uru tadasya yadvaishyah padbhya shudro ajayata
    || 11|| candrama manaso jatashcakshoh suryo ajayata | shrotradvayushca pranashca mukhadagnirajayata
    || 12|| nabhya asidantariksha shirshno dyauh samavartata | padbhyam bhumirdishah shrotrattatha loka~''kalpayan
    || 13|| yatpurushena havisha deva yajnamatanvata | vasanto''syasidajyam grishma idhmah sharaddhavih
    || 14|| saptasyasan paridhayastrih sapta samidhah kritah | deva yadyajnam tanvana abadhnan purusham
    pashum || 15|| yajnena yajnamayajanta devastani dharmani prathamanyasan | te ha nakam mahimanah sacanta
    yatra purve sadhyah santi devah || 16|| || iti shuklayajurvediyapurushasuktam sampurnam||'
  devanagari: ॥ अथ शुक्लयजुर्वेदीय पुरुषसूक्तः॥ हरिः ॐ सहस्रशीर्षा पुरुषः सहस्राक्षः सहस्रपात् । स भूमि
    सर्वत स्पृत्वाऽत्यतिष्ठद्दशाङ्गुलम् ॥ १॥ पुरुष एवेद सर्वं यद्भूतं यच्च भाव्यम् । उतामृतत्वस्येशानो
    यदन्नेनातिरोहति ॥ २॥ एतावानस्य महिमातो ज्यायाँश्च पूरुषः । पादोऽस्य विश्वा भूतानि त्रिपादस्यामृतं
    दिवि ॥ ३॥ त्रिपादूर्ध्व उदैत्पुरुषः पादोऽस्येहाभवत् पुनः । ततो विष्वङ् व्यक्रामत्साशनानशने अभि ॥ ४॥
    ततो विराडजायत विराजो अधि पूरुषः । स जातो अत्यरिच्यत पश्चाद्भूमिमथो पुरः ॥ ५॥ तस्माद्यज्ञात् सर्वहुतः
    सम्भृतं पृषदाज्यम् । पशूँस्ताँश्चक्रे वायव्यानारण्या ग्राम्याश्च ये ॥ ६॥ तस्माद्यज्ञात् सर्वहुतः ऋचः
    सामानि जज्ञिरे । छन्दासि जज्ञिरे तस्माद्यजुस्तस्मादजायत ॥ ७॥ तस्मादश्वा अजायन्त ये के चोभयादतः । गावो
    ह जज्ञिरे तस्मात्तस्माज्जाता अजावयः ॥ ८॥ तं यज्ञं बर्हिषि प्रौक्षन् पुरुषं जातमग्रतः । तेन देवा अयजन्त
    साध्या ऋषयश्च ये ॥ ९॥ यत्पुरुषं व्यदधुः कतिधा व्यकल्पयन् । मुखं किमस्यासीत् किं बाहू किमूरू पादा उच्येते
    ॥ १०॥ ब्राह्मणोऽस्य मुखमासीद्बाहू राजन्यः कृतः । ऊरू तदस्य यद्वैश्यः पद्भ्या शूद्रो अजायत ॥ ११॥ चन्द्रमा
    मनसो जातश्चक्षोः सूर्यो अजायत । श्रोत्राद्वायुश्च प्राणश्च मुखादग्निरजायत ॥ १२॥ नाभ्या आसीदन्तरिक्ष
    शीर्ष्णो द्यौः समवर्तत । पद्भ्यां भूमिर्दिशः श्रोत्रात्तथा लोकाँऽकल्पयन् ॥ १३॥ यत्पुरुषेण हविषा देवा
    यज्ञमतन्वत । वसन्तोऽस्यासीदाज्यं ग्रीष्म इध्मः शरद्धविः ॥ १४॥ सप्तास्यासन् परिधयस्त्रिः सप्त समिधः
    कृताः । देवा यद्यज्ञं तन्वाना अबध्नन् पुरुषं पशुम् ॥ १५॥ यज्ञेन यज्ञमयजन्त देवास्तानि धर्माणि प्रथमान्यासन्
    । ते ह नाकं महिमानः सचन्त यत्र पूर्वे साध्याः सन्ति देवाः ॥ १६॥ ॥ इति शुक्लयजुर्वेदीयपुरुषसूक्तं सम्पूर्णम्॥
