id: ashtavakra-gita-chapter-1
category: stotram
name:
  english: Ashtavakra Gita Chapter 1
content:
  english: '|| shri || atha shrimadashtavakragita prarabhyate || janaka uvaca || katham jnanamavapnoti
    katham muktirbhavishyati | vairagyam ca katham praptametad bruhi mama prabho || || ashtavakra uvaca
    || muktimicchasi cettata vishayan vishavattyaja | kshamarjavadayatoshasatyam piyushavad bhaja || ||
    na prithvi na jalam nagnirna vayurdyaurna va bhavan | esham sakshinamatmanam cidrupam viddhi muktaye
    || || yadi deham prithak kritya citi vishramya tishthasi | adhunaiva sukhi shanto bandhamukto bhavishyasi
    || || na tvam vipradiko varno nashrami nakshagocarah | asango''si nirakaro vishvasakshi sukhi bhava
    || || dharmadharmau sukham duhkham manasani na te vibho | na kartasi na bhoktasi mukta evasi sarvada
    || || eko drashtasi sarvasya muktaprayo''si sarvada | ayameva hi te bandho drashtaram pashyasitaram
    || || aham kartetyahammanamahakrishnahidamshitah | naham karteti vishvasamritam pitva sukham cara
    || || eko vishuddhabodho''hamiti nishcayavahnina | prajvalyajnanagahanam vitashokah sukhi bhava ||
    || yatra vishvamidam bhati kalpitam rajjusarpavat | anandaparamanandah sa bodhastvam sukham bhava
    || || muktabhimani mukto hi baddho baddhabhimanyapi | kimvadantiha satyeyam ya matih sa gatirbhavet
    || || atma sakshi vibhuh purna eko muktashcidakriyah | asango nihsprihah shanto bhramatsamsaravaniva
    || || kutastham bodhamadvaitamatmanam paribhavaya | abhaso''ham bhramam muktva bhavam bahyamathantaram
    || || dehabhimanapashena ciram baddho''si putraka | bodho''ham jnanakhadgena tannikritya sukhi bhava
    || || nihsango nishkriyo''si tvam svaprakasho niranjanah | ayameva hi te bandhah samadhimanutishthasi
    || || tvaya vyaptamidam vishvam tvayi protam yatharthatah | shuddhabuddhasvarupastvam ma gamah kshudracittatam
    || || nirapeksho nirvikaro nirbharah shitalashayah | agadhabuddhirakshubdho bhava cinmatravasanah
    || || sakaramanritam viddhi nirakaram tu nishcalam | etattattvopadeshena na punarbhavasambhavah ||
    || yathaivadarshamadhyasthe rupe''ntah paritastu sah | tathaiva''smin sharire''ntah paritah parameshvarah
    || || ekam sarvagatam vyoma bahirantaryatha ghate | nityam nirantaram brahma sarvabhutagane tatha
    ||'
  devanagari: ॥ श्री ॥ अथ श्रीमदष्टावक्रगीता प्रारभ्यते ॥ जनक उवाच ॥ कथं ज्ञानमवाप्नोति कथं मुक्तिर्भविष्यति
    । वैराग्यं च कथं प्राप्तमेतद् ब्रूहि मम प्रभो ॥ ॥ अष्टावक्र उवाच ॥ मुक्तिमिच्छसि चेत्तात विषयान् विषवत्त्यज
    । क्षमार्जवदयातोषसत्यं पीयूषवद् भज ॥ ॥ न पृथ्वी न जलं नाग्निर्न वायुर्द्यौर्न वा भवान् । एषां साक्षिणमात्मानं
    चिद्रूपं विद्धि मुक्तये ॥ ॥ यदि देहं पृथक् कृत्य चिति विश्राम्य तिष्ठसि । अधुनैव सुखी शान्तो बन्धमुक्तो
    भविष्यसि ॥ ॥ न त्वं विप्रादिको वर्णो नाश्रमी नाक्षगोचरः । असङ्गोऽसि निराकारो विश्वसाक्षी सुखी भव ॥
    ॥ धर्माधर्मौ सुखं दुःखं मानसानि न ते विभो । न कर्तासि न भोक्तासि मुक्त एवासि सर्वदा ॥ ॥ एको द्रष्टासि
    सर्वस्य मुक्तप्रायोऽसि सर्वदा । अयमेव हि ते बन्धो द्रष्टारं पश्यसीतरम् ॥ ॥ अहं कर्तेत्यहम्मानमहाकृष्णाहिदंशितः
    । नाहं कर्तेति विश्वासामृतं पीत्वा सुखं चर ॥ ॥ एको विशुद्धबोधोऽहमिति निश्चयवह्निना । प्रज्वाल्याज्ञानगहनं
    वीतशोकः सुखी भव ॥ ॥ यत्र विश्वमिदं भाति कल्पितं रज्जुसर्पवत् । आनन्दपरमानन्दः स बोधस्त्वं सुखं भव
    ॥ ॥ मुक्ताभिमानी मुक्तो हि बद्धो बद्धाभिमान्यपि । किंवदन्तीह सत्येयं या मतिः सा गतिर्भवेत् ॥ ॥ आत्मा
    साक्षी विभुः पूर्ण एको मुक्तश्चिदक्रियः । असङ्गो निःस्पृहः शान्तो भ्रमात्संसारवानिव ॥ ॥ कूटस्थं बोधमद्वैतमात्मानं
    परिभावय । आभासोऽहं भ्रमं मुक्त्वा भावं बाह्यमथान्तरम् ॥ ॥ देहाभिमानपाशेन चिरं बद्धोऽसि पुत्रक । बोधोऽहं
    ज्ञानखड्गेन तन्निकृत्य सुखी भव ॥ ॥ निःसङ्गो निष्क्रियोऽसि त्वं स्वप्रकाशो निरञ्जनः । अयमेव हि ते बन्धः
    समाधिमनुतिष्ठसि ॥ ॥ त्वया व्याप्तमिदं विश्वं त्वयि प्रोतं यथार्थतः । शुद्धबुद्धस्वरूपस्त्वं मा गमः
    क्षुद्रचित्तताम् ॥ ॥ निरपेक्षो निर्विकारो निर्भरः शीतलाशयः । अगाधबुद्धिरक्षुब्धो भव चिन्मात्रवासनः
    ॥ ॥ साकारमनृतं विद्धि निराकारं तु निश्चलम् । एतत्तत्त्वोपदेशेन न पुनर्भवसम्भवः ॥ ॥ यथैवादर्शमध्यस्थे
    रूपेऽन्तः परितस्तु सः । तथैवाऽस्मिन् शरीरेऽन्तः परितः परमेश्वरः ॥ ॥ एकं सर्वगतं व्योम बहिरन्तर्यथा
    घटे । नित्यं निरन्तरं ब्रह्म सर्वभूतगणे तथा ॥
