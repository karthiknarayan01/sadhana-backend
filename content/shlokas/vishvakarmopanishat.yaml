id: vishvakarmopanishat
category: upanishad
name:
  english: vishvakarmopanishat
  devanagari: विश्वकर्मोपनिषत्
content:
  english: shrivishvakarmanamaham namami || om vishvakarma disham patih sa nah pashunpatu so'smanpatu
    tasmai namah | prajapatikadro varuno'gnirdishampatih sa nah pashunpatu so'smanpatu tasmai namah ||
    atha purusho ha vai vishvakarmano kamayata prajah srijeyeti | vishvakarmanah prano jayate manah sarvendriyani
    ca | kham vayurjyotirapah prithivi vishvasya dharini || vishvakarmano brahma jayate | vishvakarmano
    rudro jayate | vishvakarmano narayano jayate | vishvakarmanah prajapatayah prajayante | vishvakarmano
    dvadashaditya rudra vasavah sarve devatah sarve rishayah sarvani chandamsi sarvani bhutani va samutpadyante
    | vishcakarmani pravardhante | vishvakarmani praliyante | om atha nityo devo eko vishvakarma | yo
    devanam namadhari eka eva vishvakarma | virata vishvakarma | svaradvishvakarma | samradvishvakarma
    | atha rudro vishvakarma | brahma vishvakarma | shivashca vishvakarma | vishnushca vishvakarma | shakrashca
    vishvakarma | dyavaprithivyau ca vishvakarma | kalashca vishvakarma | dishashca vishvakarma | dikcakrashca
    vishvakarma | agnishca vishvakarma | urdhvashca vishvakarma | adhashca vishvakarma | avantarashca
    vishvakarma | antarbahishca vishvakarma | vishvakarmano nirakritih | vishvakarmana evedam sarvam yadbhutam
    yacca bhavyam | nishkalanko niranjano nirvikalpo nirakhyatah || shuddhadvaitaiko vishvakarma
  devanagari: श्रीविश्वकर्माणमहं नमामि ॥ ॐ विश्वकर्मा दिशां पतिः स नः पशून्पातु सोऽस्मान्पातु तस्मै नमः
    । प्रजापतिकद्रो वरुणोऽग्निर्दिशाम्पतिः स नः पशून्पातु सोऽस्मान्पातु तस्मै नमः ॥ अथ पुरुषो ह वै विश्वकर्मणो
    कामयत प्रजाः सृजेयेति । विश्वकर्मणः प्राणो जायते मनः सर्वेन्द्रियाणि च । खं वायुर्ज्योतिरापः पृथिवी
    विश्वस्य धारिणी ॥ विश्वकर्मणो ब्रह्मा जायते । विश्वकर्मणो रुद्रो जायते । विश्वकर्मणो नारायणो जायते
    । विश्वकर्मणः प्रजापतयः प्रजायन्ते । विश्वकर्मणो द्वादशादित्या रुद्रा वसवः सर्वे देवताः सर्वे ऋषयः
    सर्वाणि छन्दांसि सर्वाणि भूतानि वा समुत्पद्यन्ते । विश्चकर्मणि प्रवर्धन्ते । विश्वकर्मणि प्रलीयन्ते
    । ॐ अथ नित्यो देवो एको विश्वकर्मा । यो देवानां नामधारी एक एव विश्वकर्मा । विराट विश्वकर्मा । स्वराड्विश्वकर्मा
    । सम्राड्विश्वकर्मा । अथ रुद्रो विश्वकर्मा । ब्रह्मा विश्वकर्मा । शिवश्च विश्वकर्मा । विष्णुश्च विश्वकर्मा
    । शक्रश्च विश्वकर्मा । द्यावापृथिव्यौ च विश्वकर्मा । कालश्च विश्वकर्मा । दिशश्च विश्वकर्मा । दिक्चक्रश्च
    विश्वकर्मा । अग्निश्च विश्वकर्मा । ऊर्ध्वश्च विश्वकर्मा । अधश्च विश्वकर्मा । अवान्तरश्च विश्वकर्मा
    । अन्तर्बहिश्च विश्वकर्मा । विश्वकर्मणो निराकृतिः । विश्वकर्मण एवेदं सर्वं यद्भूतं यच्च भव्यम् । निष्कलङ्को
    निरञ्जनो निर्विकल्पो निराख्यातः ॥ शुद्धाद्वैतैको विश्वकर्मा
