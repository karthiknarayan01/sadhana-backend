id: ganeshastotramshridharasvami
category: stotram
name:
  english: ganeshastotramshridharasvami
  devanagari: गणेशस्तोत्रम्श्रीधरस्वामी
content:
  english: vighnanhantiti loke shrutishu nigadito yashca vighnaghna ekah vyaktavyakta sthitau ca pranavavapurayam
    brahmarupasvamatrah | mayavidyadishunyo niravadhiramalo'rupato nirguno'pi bhaktanam muktiheto bhavati
    karunaya sadgururupadhari || 1|| sarvam brahmaiva sakshacchrutishu nigaditam neha nana'sti kincit
    maya caitanya yogadvyavaharati yada karyarupapratitih | caitanyabhavato yatkimapi na ca bhavetsyanna
    maya'pi yasmat ekashcaitanyarupo ganapatirathano tadvitiyam kathancit || 2|| rajjau sarpe'pi drishte
    na bhujaga iti sa kathyate rajjureka vishve bhumniti drishte jagaditi na tatha kathyate brahmamatram
    | satta samanyarupatkathita iti ca yo drishyarupo na tadrik drishyam yadvighnakritsyattadapanayanato
    vighnaha'yam svabodhat || 3|| bhatyastyanandarupo vilasati ca sada duhkhajadyanriteshu nityo nityadikanam
    bhavati ca nanu yashcetanashcetananam | drishyasyaitasya mayakrita sukhamiha yatprarthyate tadganesho
    yastam sarvadibhutam bhajata jagati bho sarabhutam varenyam || 4|| shrutya yannirvikaram niratishayasukham
    brahmatanmatsvarupam jnatva nityam hi bhutva sakalamapanayansvarcisha svasthito'ham | maya tatkaryametatsprishati
    na mayi va badhate tatkathancit mayayah sarvashakteh para iti satatam yah sa evadvayo'ham || 5|| iti
    shrimat paramahamsa parivrajakacarya sadguru bhagavata shridharasvamina viracitam shriganeshastotram
    sampurnam |
  devanagari: विघ्नान्हन्तीति लोके श्रुतिषु निगदितो यश्च विघ्नघ्न एकः व्यक्ताव्यक्त स्थितौ च प्रणववपुरयं
    ब्रह्मरूपस्वमात्रः । मायाविद्यादिशून्यो निरवधिरमलोऽरूपतो निर्गुणोऽपि भक्तानां मुक्तिहेतो भवति करुणया
    सद्गुरुरूपधारी ॥ १॥ सर्वं ब्रह्मैव साक्षाच्छ्रुतिषु निगदितं नेह नानाऽस्ति किञ्चित् माया चैतन्य योगाद्व्यवहरति
    यदा कार्यरूपप्रतीतिः । चैतन्याभावतो यत्किमपि न च भवेत्स्यान्न मायाऽपि यस्मात् एकश्चैतन्यरूपो गणपतिरथनो
    तद्वितीयं कथञ्चित् ॥ २॥ रज्जौ सर्पेऽपि दृष्टे न भुजग इति सा कथ्यते रज्जुरेका विश्वे भूम्नीति दृष्टे
    जगदिति न तथा कथ्यते ब्रह्ममात्रम् । सत्ता सामान्यरूपात्कथित इति च यो दृश्यरूपो न तादृक् दृश्यं यद्विघ्नकृत्स्यात्तदपनयनतो
    विघ्नहाऽयं स्वबोधात् ॥ ३॥ भात्यस्त्यानन्दरूपो विलसति च सदा दुःखजाड्यानृतेषु नित्यो नित्यादिकानां भवति
    च ननु यश्चेतनश्चेतनानाम् । दृश्यस्यैतस्य मायाकृत सुखमिह यत्प्रार्थ्यते तद्गणेशो यस्तं सर्वादिभूतं
    भजत जगति भो सारभूतं वरेण्यम् ॥ ४॥ श्रुत्या यन्निर्विकारं निरतिशयसुखं ब्रह्मतन्मत्स्वरूपं ज्ञात्वा
    नित्यं हि भूत्वा सकलमपनयन्स्वार्चिषा स्वस्थितोऽहम् । माया तत्कार्यमेतत्स्पृशति न मयि वा बाधते तत्कथञ्चित्
    मायायाः सर्वशक्तेः पर इति सततं यः स एवाद्वयोऽहम् ॥ ५॥ इति श्रीमत् परमहंस परिव्राजकाचार्य सद्गुरु भगवता
    श्रीधरस्वामिना विरचितं श्रीगणेशस्तोत्रं सम्पूर्णम् ।
