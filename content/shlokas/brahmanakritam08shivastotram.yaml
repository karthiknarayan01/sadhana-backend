id: brahmanakritam08shivastotram
category: stotram
name:
  english: brahmanakritam08shivastotram
  devanagari: ब्रह्मणाकृतं०८शिवस्तोत्रम्
content:
  english: brahmana kritam 8 shivastotram sa buddhva devamishanam shighramutthaya vismitah | vavande caranau
    shambhorastuvacca pitamahah || 42|| pitamaha uvaca | buddhistvam sarvalokanamahankarastvamishvarah
    | bhutanamindriyanam ca tvamevesha pravarttakah || 43|| tavaham dakshinaddhastatsrishtah purvam puratanah
    | vamahastanmahabaho devo narayanah prabhuh || 44|| iyam ca prakritirdevi sada te srishtikarana |
    patnirupam samasthaya jagatkaranamagata || 45|| namastubhyam mahadeva mahadevyai namo namah | prasadattava
    devesha niyogacca maya prajah || 46|| devadyastu imah srishta mudhastvadyogamohitah | kuru prasadametesham
    yathapurvam bhavantvime || 47|| iti shrilingamahapurane purvabhage dvyadhikashatatamadhyayantargatam
    pitamahakritam shivastotram samaptam | lingapurana | purvabhaga | adhyaya 102
  devanagari: ब्रह्मणा कृतं ८ शिवस्तोत्रम् स बुद्ध्वा देवमीशानं शीघ्रमुत्थाय विस्मितः । ववन्दे चरणौ शम्भोरस्तुवच्च
    पितामहः ॥ ४२॥ पितामह उवाच । बुद्धिस्त्वं सर्वलोकानामहङ्कारस्त्वमीश्वरः । भूतानामिन्द्रियाणां च त्वमेवेश
    प्रवर्त्तकः ॥ ४३॥ तवाहं दक्षिणाद्धस्तात्सृष्टः पूर्वं पुरातनः । वामहस्तान्महाबाहो देवो नारायणः प्रभुः
    ॥ ४४॥ इयं च प्रकृतिर्देवी सदा ते सृष्टिकारण । पत्नीरूपं समास्थाय जगत्कारणमागता ॥ ४५॥ नमस्तुभ्यं महादेव
    महादेव्यै नमो नमः । प्रसादात्तव देवेश नियोगाच्च मया प्रजाः ॥ ४६॥ देवाद्यास्तु इमाः सृष्टा मूढास्त्वद्योगमोहिताः
    । कुरु प्रसादमेतेषां यथापूर्वं भवन्त्विमे ॥ ४७॥ इति श्रीलिङ्गमहापुराणे पूर्वभागे द्व्यधिकशततमाध्यायान्तर्गतं
    पितामहकृतं शिवस्तोत्रं समाप्तम् । लिङ्गपुराण । पूर्वभाग । अध्याय १०२
