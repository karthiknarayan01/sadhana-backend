id: mundaka-upanishad-mundaka-2-section-1
category: stotram
name:
  english: Mundaka Upanishad - Mundaka 2, Section 1
content:
  english: '|| dvitiya mundake prathamah khandah || tadeta thsatyam yatha sudipta tpavakadvisphulingah
    sahasrashah prabhavante sarupah | tatha ssomya bhavah prajayante tatra caivapi yanti || || divyo hyamurtah
    purusha ssa bahyabhyantaro hyajah | aprano hyamana || etasmajjayate prano mana ssarvendriyani ca |
    kham va~yurjyotirapah prithivi vishvasya dharini || || agnirmurdha cakshushi candrasuryau disha shshrotre
    vag vivritashca vedah | vayuh prano hridayam vi~shvamasya padbhyam prithivi hyesha sarvabhutantaratma
    || ssamidho yasya suryah soma tparjanya oshadhayah prithivyam | puma ssincati yoshitayam bahvih prajah
    purusha ssama yajumshi diksha yajnashca sarve kratavo dakshinashca | sam va~tsarashca yajamanashca
    lokah somo yatra pavate yatra suryah || || tasmacca deva bahudha samprasutah sadhya manushyah pashavo
    vayamsi | pranapanau vrihiyavau tapashca shraddha satya || sapta pranah prabhavanti tasmat saptarcisha
    ssapta homah | sapta ime loka yeshu caranti prana guhashaya nihita ssamudra girayashca sarve ''smat
    syandante sindhava ssarvarupah | atashca sarva oshadhayo rasashca yenaisha bhutaistishthate hyantaratma
    || nkarma tapo brahma paramritam | etadyo veda nihita || || iti mundakopanishadi dvitiyamundake prathamah
    khandah ||'
  devanagari: ॥ द्वितीय मुण्डके प्रथमः खण्डः ॥ तदेत थ्सत्यं यथा सुदीप्ता त्पावकाद्विस्फुलिङ्गाः सहस्रशः
    प्रभवन्ते सरूपाः । तथा स्सोम्य भावाः प्रजायन्ते तत्र चैवापि यन्ति ॥ ॥ दिव्यो ह्यमूर्तः पुरुष स्स बाह्याभ्यन्तरो
    ह्यजः । अप्राणो ह्यमना ॥ एतस्माज्जायते प्राणो मन स्सर्वेन्द्रियाणि च । खं वाँयुर्ज्योतिरापः पृथिवी
    विश्वस्य धारिणी ॥ ॥ अग्निर्मूर्धा चक्षुषी चन्द्रसूर्यौ दिश श्श्रोत्रे वाग् विवृताश्च वेदाः । वायुः
    प्राणो हृदयं विँश्वमस्य पद्भ्यां पृथिवी ह्येष सर्वभूतान्तरात्मा ॥ स्समिधो यस्य सूर्यः सोमा त्पर्जन्य
    ओषधयः पृथिव्याम् । पुमा स्सिञ्चति योषितायां बह्वीः प्रजाः पुरुषा स्साम यजूंषि दीक्षा यज्ञाश्च सर्वे
    क्रतवो दक्षिणाश्च । सं वँत्सरश्च यजमानश्च लोकाः सोमो यत्र पवते यत्र सूर्यः ॥ ॥ तस्माच्च देवा बहुधा
    सम्प्रसूताः साध्या मनुष्याः पशवो वयांसि । प्राणापानौ व्रीहियवौ तपश्च श्रद्धा सत्य ॥ सप्त प्राणाः प्रभवन्ति
    तस्मात् सप्तार्चिष स्सप्त होमाः । सप्त इमे लोका येषु चरन्ति प्राणा गुहाशया निहिता स्समुद्रा गिरयश्च
    सर्वे ऽस्मात् स्यन्दन्ते सिन्धव स्सर्वरूपाः । अतश्च सर्वा ओषधयो रसश्च येनैष भूतैस्तिष्ठते ह्यन्तरात्मा
    ॥ ङ्कर्म तपो ब्रह्म परामृतम् । एतद्यो वेद निहित ॥ ॥ इति मुण्डकोपनिषदि द्वितीयमुण्डके प्रथमः खण्डः
    ॥
