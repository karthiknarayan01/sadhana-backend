id: yajniki
category: upanishad
name:
  english: yajniki
  devanagari: यज्निकि
content:
  english: yabhiradityastapati rashmibhistabhih parjanyo varshati parjanyenaushadhivanaspatayah prajayanta
    oshadhivanaspatibhirannam bhavatyannena pranah pranairbalam balena tapastapasa shraddha shraddhaya
    medha medhaya manisha manishaya mano manasa shantih shantya cittam cittena smritih smritya smara
  devanagari: याभिरादित्यस्तपति रश्मिभिस्ताभिः पर्जन्यो वर्षति पर्जन्येनौषधिवनस्पतयः प्रजायन्त ओषधिवनस्पतिभिरन्नं
    भवत्यन्नेन प्राणाः प्राणैर्बलं बलेन तपस्तपसा श्रद्धा श्रद्धया मेधा मेधया मनीषा मनीषया मनो मनसा शान्तिः
    शान्त्या चित्तं चित्तेन स्मृतिः स्मृत्या स्मार
meaning: {}
