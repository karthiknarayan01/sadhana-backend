id: vikatan-isimhakavacam
category: kavacha
name:
  english: vikatanṟisimhakavacam
  devanagari: विकटन्ऱिसिम्हकवचम्
content:
  english: vikatanrisimhakavacam shri nrisimhaya namah | om asya shri nrisimhamantrasya prahararishih
    | shirasi | anushtubh chandah mukhe | jivo bijam hridi | anantashaktih nabhau | paramatma kilakam
    guhye | shrinrisimhadevata prityarthe jape viniyogah | shatruhaniparomokshamarthadivya na samshayah
    | athadigbandhah | purvenrisimha raksheshca ishanye ugrarupakam | uttare vajrako rakshet vayavyanca
    mahabale | pashcime vikato rakshet nairrityam agnirupakam | dakshine raudra rakshecca ghorarupancagneyyam
    | urdhva rakshetmahakali adhastaddaityamardanah | etabhyo dashadigbhyashca sarvam rakshet nrisimhakah
    | om krim chrum nrim nrim hrim hrim rum rum svaha || om nrisimhaya namah | om vajrarupaya namah |
    om kalarupaya namah | om dushtamardanaya namah | om shatrucurnaya namah | om bhavaharanaya namah |
    om shokaharaya namah | om narakesari vum hum ham phat svaha | iti digbandhanamantrah | om chrum chrum
    nrim nrim rum rum svaha | om vum vum vum digbhyah svaha | nrisimhaya namah | om hram hram hram nrisimhaya
    namah | atha nyasah | om am um angushthabhyam namah | om nrim nrim nrim tarjanibhyam namah | om ram
    ram ram madhyamabhyam namah | om shram shram shram anamikabhyam namah | om im im kanishthikabhyam
    namah | om bhram bhram bhram karatalakaraprishthabhyam namah | om vram vram vram hridayaya namah |
    om hram hram hram shirase svaha | om klim klim klim shikhayai vaushat | om jram jram jram kavacaya
    hum | om shrim shrim shrim netratrayayai vaushat | om am am astraya phat | atha namaskritya | om nrisimhakalaya
    kalarupaghoraya ca | namo nrisimhadevaya karunyaya namo namah | om ram ugraya namah | om dharakaya
    ugraya ugrarupaya | om um dharanaya namah | om bibhishanabhadraya namo namah | karalaya namah | om
    vajrarupaya namah | om om om omkararupaya namah | om jvalarupaya namah | om parabrahmato nrim ram
    ram ram nrisimhaya simharupaya namonamah | om narakesari ram ram kham bhim nrisimhaya namah | om akarah
    sarva samrajatu vishveshi vishvapujito | om vishveshvaraya namah | om hrom stram stram stram sarvadeveshvari
    niralambaniranjananirgunasarvashvaiva tasmai namaste | om rum rum rum nrisimhaya namah | om aum ugraya
    ugrarupaya ugradharaya te namah | om bhyam bhyam vibhishanaya namaste namaste | om bhadraya bhadra
    rupaya bhavakaraya te namo namah | om vram vram vram vajradehaya vajratundaya namo bhava vajraya vajranakhaya
    namah | om hram hram hram harita klim klim visha sarvadushtanam ca mardanam daityapishaccaya anyashca
    mahabalaya namah | om lrim lrim lrim kamanartham kalikalaya namaste kamarupine | om jram jram jram
    jram sarvajagannatha jaganmahidata jagnmahima jagavyapine deva tasmai namo namah | om shri shrim shri
    shridhara sarveshvara shrinivasine | om am am am anantaya anantarupaya vishvarupaya namah | namaste
    vishvavyapine | iti stutih | om vikataya namah | om ugrarupaya namah svaha | om shrinrisimhaya udvighnaya
    vikatogratapase lobhamohavivarjitam trigunarahitam uccatanabhramitam sarvamayavimuktam simha ragavivarjita
    vikatogra nrisimha narakesari || om ram ram ram ram ram hram hram kshim kshim dhum dhum phat svaha
    || iti shri mahanrisimhamantrakavacam sampurnam | shubhamastu | nrisimharpanamastu ||
  devanagari: विकटनृसिंहकवचम् श्री नृसिंहाय नमः । ॐ अस्य श्री नृसिंहमन्त्रस्य प्रहराऋषिः । शिरसि । अनुष्टुभ्
    छन्दः मुखे । जीवो बीजं हृदि । अनन्तशक्तिः नाभौ । परमात्मा कीलकम् गुह्ये । श्रीनृसिंहदेवता प्रीत्यर्थे
    जपे विनियोगः । शत्रुहानिपरोमोक्षमर्थदिव्य न संशयः । अथदिग्बन्धः । पूर्वेनृसिंह रक्षेश्च ईशान्ये उग्ररूपकम्
    । उत्तरे वज्रको रक्षेत् वायव्याञ्च महाबले । पश्चिमे विकटो रक्षेत् नैरृत्यां अग्निरूपकम् । दक्षिणे
    रौद्र रक्षेच्च घोररूपञ्चाग्नेय्याम् । ऊर्ध्व रक्षेत्महाकाली अधस्ताद्दैत्यमर्दनः । एताभ्यो दशदिग्भ्यश्च
    सर्वं रक्षेत् नृसिंहकः । ॐ क्रीं छ्रुं नृं नृं ह्रीं ह्रीं रुं रुं स्वाहा ॥ ॐ नृसिंहाय नमः । ॐ वज्ररूपाय
    नमः । ॐ कालरूपाय नमः । ॐ दुष्टमर्दनाय नमः । ॐ शत्रुचूर्णाय नमः । ॐ भवहारणाय नमः । ॐ शोकहराय नमः ।
    ॐ नरकेसरी वुं हुं हं फट् स्वाहा । इति दिग्बन्धनमन्त्रः । ॐ छ्रुं छ्रुं नृं नृं रुं रुं स्वाहा । ॐ
    वुं वुं वुं दिग्भ्यः स्वाहा । नृसिंहाय नमः । ॐ ह्रं ह्रं ह्रं नृसिंहाय नमः । अथ न्यासः । ॐ अं ऊं अङ्गुष्ठाभ्यां
    नमः । ॐ नृं नृं नृं तर्जनीभ्यां नमः । ॐ रां रां रां मध्यमाभ्यां नमः । ॐ श्रां श्रां श्रां अनामिकाभ्यां
    नमः । ॐ ईं ईं कनिष्ठिकाभ्यां नमः । ॐ भ्रां भ्रां भ्रां करतलकरपृष्ठाभ्यां नमः । ॐ व्रां व्रां व्रां
    हृदयाय नमः । ॐ ह्रां ह्रां ह्रां शिरसे स्वाहा । ॐ क्लीं क्लीं क्लीं शिखायै वौषट् । ॐ ज्रां ज्रां ज्रां
    कवचाय हुम् । ॐ श्रीं श्रीं श्रीं नेत्रत्रयायै वौषट् । ॐ आं आं अस्त्राय फट् । अथ नमस्कृत्य । ॐ नृसिंहकालाय
    कालरूपघोराय च । नमो नृसिंहदेवाय कारुण्याय नमो नमः । ॐ रां उग्राय नमः । ॐ धारकाय उग्राय उग्ररूपाय ।
    ॐ ऊं धारणाय नमः । ॐ बिभीषणभद्राय नमो नमः । करालाय नमः । ॐ वज्ररूपाय नमः । ॐ ॐ ॐ ॐकाररूपाय नमः । ॐ
    ज्वालारूपाय नमः । ॐ परब्रह्मतो नृं रां रां रां नृसिंहाय सिंहरूपाय नमोनमः । ॐ नरकेसरी रां रां खं भीं
    नृसिंहाय नमः । ॐ अकारः सर्व संराजतु विश्वेशी विश्वपूजितो । ॐ विश्वेश्वराय नमः । ॐ ह्रों स्त्रां स्त्रां
    स्त्रां सर्वदेवेश्वरी निरालम्बनिरञ्जननिर्गुणसर्वश्वैव तस्मै नमस्ते । ॐ रुं रुं रुं नृसिंहाय नमः ।
    ॐ औं उग्राय उग्ररूपाय उग्रधराय ते नमः । ॐ भ्यां भ्यां विभीषणाय नमस्ते नमस्ते । ॐ भद्राय भद्र रूपाय
    भवकराय ते नमो नमः । ॐ व्रां व्रां व्रां वज्रदेहाय वज्रतुण्डाय नमो भव वज्राय वज्रनखाय नमः । ॐ ह्रां
    ह्रां ह्रां हरित क्लीं क्लीं विष सर्वदुष्टानां च मर्दनं दैत्यपिशाच्चाय अन्याश्च महाबलाय नमः । ॐ ल्रीं
    ल्रीं लृं कामनार्थं कलिकालाय नमस्ते कामरूपिणे । ॐ ज्रां ज्रां ज्रां ज्रां सर्वजगन्नाथ जगन्महीदाता
    जग्न्महिमा जगव्यापिने देव तस्मै नमो नमः । ॐ श्री श्रीं श्री श्रीधर सर्वेश्वर श्रीनिवासिने । ॐ आं आं
    आं अनन्ताय अनन्तरूपाय विश्वरूपाय नमः । नमस्ते विश्वव्यापिणे । इति स्तुतिः । ॐ विकटाय नमः । ॐ उग्ररूपाय
    नमः स्वाहा । ॐ श्रीनृसिंहाय उद्विघ्नाय विकटोग्रतपसे लोभमोहविवर्जितं त्रिगुणरहितं उच्चाटनभ्रमितं सर्वमायाविमुक्तं
    सिंह रागविवर्जित विकटोग्र नृसिंह नरकेसरी ॥ ॐ रां रां रां रां रां ह्रं ह्रं क्षीं क्षीं धुं धुं फट्
    स्वाहा ॥ इति श्री महानृसिंहमन्त्रकवचं सम्पूर्णम् । शुभमस्तु । नृसिंहार्पणमस्तु ॥
