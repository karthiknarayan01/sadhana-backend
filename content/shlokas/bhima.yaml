id: bhima
category: stotram
name:
  english: bhima
  devanagari: भीम
content:
  english: bhimarupistotra bhimarupi maharudra vajra hanumana maruti | vanari amjanisuta ramaduta prabhamjana
    || 1|| mahabaḻi pranadata sakaḻam uthavi baḻem | saukhyakari duhkhahari dhurta vaishnava gayaka ||
    2|| dinanatha harirupa sumdara jagadamtara | pataladevatahamta bhavyasimduralepana || 3|| lokanatha
    jagannatha prananatha puratana | punyavamta punyashila pavana paritoshaka || 4|| dhvajamgem ucali
    baho aveshem lotala pudhem | kaḻagni kaḻarudragni dekhatam kampati bhayem || 5|| brahmamdem mailim
    nenom amvaḻe damtapamgati | netragni calilya jvaḻa bhrakuti tathilya baḻem || 6|| puccha tem muradilem
    matham kiriti kumdalem barim | suvarnakatikamsoti ghamta kimkini nagara || 7|| thakare parvataisa
    netaka sadapataḻu | capaḻamga pahatam mothem mahavidyullatepari || 8|| koticya koti uddanem jhepave
    uttarekade | mamdadrisarikha dronu krodhem utpatila baḻem || 9|| anila maguti nela ala gela manogati
    | manasi takilem magem gatisi tuḻana nase || 10|| anupasoni brahmamdayevadha hota jatase | tayasi
    tuḻana kothem merumamdara dhakutem || 11|| brahmamdabhomvate vedhe vajrapucchem karum shake | tayasi
    tuḻana kaimci brahmamdim pahatam nase || 12|| arakta dekhilem doḻam grasilem suryamamdaḻa | vadhatam
    vadhatam vadhe bhedilem shunyamamdaḻa || 13|| dhanadhanya pashuvriddhi putrapautra samagrahi | pavati
    rupavidyadi stotrapathem karuniyam || 14|| bhutapretasamamdhadi rogavyadhi samastahi | nasati tutati
    cimta anamde bhimadarshanem || 15|| he dhara pamdharashloki labhali shobhali bhali | dridhadeho nihsamdeho
    samkhya camdrakalagunem || 16|| ramadasim agraganyu kapikuḻasi mamdanu | ramarupi antaratma darshane
    dosha nasati || 17|| || iti shri ramadasakritam samkatanirasanam nama shri marutistotram sampurnam
    ||
  devanagari: भीमरूपीस्तोत्र भीमरूपी महारुद्रा वज्र हनुमान मारुती । वनारि अंजनीसूता रामदूता प्रभंजना ॥
    १॥ महाबळी प्राणदाता सकळां उठवी बळें । सौख्यकारी दुःखहारी धूर्त वैष्णव गायका ॥ २॥ दीनानाथा हरीरूपा
    सुंदरा जगदांतरा । पातालदेवताहंता भव्यसिंदूरलेपना ॥ ३॥ लोकनाथा जगन्नाथा प्राणनाथा पुरातना । पुण्यवंता
    पुण्यशीला पावना परितोषका ॥ ४॥ ध्वजांगें उचली बाहो आवेशें लोटला पुढें । काळाग्नि काळरुद्राग्नि देखतां
    कांपती भयें ॥ ५॥ ब्रह्मांडें माइलीं नेणों आंवळे दंतपंगती । नेत्राग्नि चालिल्या ज्वाळा भ्रकुटी तठिल्या
    बळें ॥ ६॥ पुच्छ तें मुरडिलें माथां किरीटी कुंडलें बरीं । सुवर्णकटिकांसोटी घंटा किंकिणि नागरा ॥ ७॥
    ठकारे पर्वताइसा नेटका सडपातळू । चपळांग पाहतां मोठें महाविद्युल्लतेपरी ॥ ८॥ कोटिच्या कोटि उड्डणें झेपावे
    उत्तरेकडे । मंदाद्रीसारिखा द्रोणू क्रोधें उत्पाटिला बळें ॥ ९॥ आणिला मागुती नेला आला गेला मनोगती ।
    मनासी टाकिलें मागें गतीसी तूळणा नसे ॥ १०॥ अणूपासोनि ब्रह्मांडायेवढा होत जातसे । तयासी तुळणा कोठें
    मेरुमांदार धाकुटें ॥ ११॥ ब्रह्मांडाभोंवते वेढे वज्रपुच्छें करूं शके । तयासी तुळणा कैंची ब्रह्मांडीं
    पाहतां नसे ॥ १२॥ आरक्त देखिलें डोळां ग्रासिलें सूर्यमंडळा । वाढतां वाढतां वाढे भेदिलें शून्यमंडळा
    ॥ १३॥ धनधान्य पशुवृद्धि पुत्रपौत्र समग्रही । पावती रूपविद्यादि स्तोत्रपाठें करूनियां ॥ १४॥ भूतप्रेतसमंधादि
    रोगव्याधि समस्तही । नासती तूटती चिंता आनंदे भीमदर्शनें ॥ १५॥ हे धरा पंधराश्लोकी लाभली शोभली भली ।
    दृढदेहो निःसंदेहो संख्या चंद्रकलागुणें ॥ १६॥ रामदासीं अग्रगण्यू कपिकुळासि मंडणू । रामरूपी अन्तरात्मा
    दर्शने दोष नासती ॥ १७॥ ॥ इति श्री रामदासकृतं संकटनिरसनं नाम श्री मारुतिस्तोत्रं सम्पूर्णम् ॥
