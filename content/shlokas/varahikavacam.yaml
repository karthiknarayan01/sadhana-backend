id: varahikavacam
category: kavacha
name:
  english: varahikavacam
  devanagari: वाराहीकवचम्
content:
  english: dhyatvendra nilavarnabham candrasuryagni locanam | vidhivishnuharendradi matribhairavasevitam
    || 1|| jvalanmaniganaprokta makutamavilambitam | astrashastrani sarvani tattatkaryocitani ca || 2||
    etaissamastairvividham bibhratim musalam halam | patva himsran hi kavacam bhuktimukti phalapradam
    || 3|| pathettrisandhyam rakshartham ghorashatrunivrittidam | vartali me shirah patu ghorahi phalamuttamam
    || 4|| netre varahavadana patu karnau tathanjani | ghranam me rundhini patu mukham me patu jandhin
    || i 5|| patu me mohini jihvam stambhini kanthamadarat | skandhau me pancami patu bhujau mahishavahana
    || 6|| simharudha karau patu kucau krishnamrigancita | nabhim ca shankhini patu prishthadeshe tu cakrini
    || 7|| khadgam patu ca katyam me medhram patu ca khedini | gudam me krodhini patu jaghanam stambhini
    tatha || 8|| candoccandashcoruyugam januni shatrumardini | janghadvayam bhadrakali mahakali ca gulphayo
    || 9|| padadyanguliparyantam patu conmattabhairavi | sarvangam me sada patu kalasankarshani tatha
    || 10|| yuktayukta sthitam nityam sarvapapatpramucyate | sarve samarthya samyuktam bhaktarakshanatatparam
    || 11|| samastadevata sarvam savyam vishnoh purardhane | sarvashatruvinashaya shulina nirmitam pura
    || 12|| sarvabhaktajanashritya sarvavidvesha samhatih | varahi kavacam nityam trisandhyam yah pathennarah
    || 13|| tathavidham bhutagana na sprishanti kadacana | apadashshatrucoradi grahadoshashca sambhavah
    || 14|| mataputram yatha vatsam dhenuh pakshmeva locanam | tathangameva varahi raksha rakshati sarvada
    || 15|| iti shrivarahikavacam sampurnam |
  devanagari: ध्यात्वेन्द्र नीलवर्णाभां चन्द्रसूर्याग्नि लोचनाम् । विधिविष्णुहरेन्द्रादि मातृभैरवसेविताम्
    ॥ १॥ ज्वलन्मणिगणप्रोक्त मकुटामाविलम्बिताम् । अस्त्रशस्त्राणि सर्वाणि तत्तत्कार्योचितानि च ॥ २॥ एतैस्समस्तैर्विविधं
    बिभ्रतीं मुसलं हलम् । पात्वा हिंस्रान् हि कवचं भुक्तिमुक्ति फलप्रदम् ॥ ३॥ पठेत्त्रिसन्ध्यं रक्षार्थं
    घोरशत्रुनिवृत्तिदम् । वार्ताली मे शिरः पातु घोराही फालमुत्तमम् ॥ ४॥ नेत्रे वराहवदना पातु कर्णौ तथाञ्जनी
    । घ्राणं मे रुन्धिनी पातु मुखं मे पातु जन्धिन् ॥ ई ५॥ पातु मे मोहिनी जिह्वां स्तम्भिनी कन्थमादरात्
    । स्कन्धौ मे पञ्चमी पातु भुजौ महिषवाहना ॥ ६॥ सिंहारूढा करौ पातु कुचौ कृष्णमृगाञ्चिता । नाभिं च शङ्खिनी
    पातु पृष्ठदेशे तु चक्रिणि ॥ ७॥ खड्गं पातु च कट्यां मे मेढ्रं पातु च खेदिनी । गुदं मे क्रोधिनी पातु
    जघनं स्तम्भिनी तथा ॥ ८॥ चण्डोच्चण्डश्चोरुयुगं जानुनी शत्रुमर्दिनी । जङ्घाद्वयं भद्रकाली महाकाली च
    गुल्फयो ॥ ९॥ पादाद्यङ्गुलिपर्यन्तं पातु चोन्मत्तभैरवी । सर्वाङ्गं मे सदा पातु कालसङ्कर्षणी तथा ॥ १०॥
    युक्तायुक्ता स्थितं नित्यं सर्वपापात्प्रमुच्यते । सर्वे समर्थ्य संयुक्तं भक्तरक्षणतत्परम् ॥ ११॥ समस्तदेवता
    सर्वं सव्यं विष्णोः पुरार्धने । सर्वशत्रुविनाशाय शूलिना निर्मितं पुरा ॥ १२॥ सर्वभक्तजनाश्रित्य सर्वविद्वेष
    संहतिः । वाराही कवचं नित्यं त्रिसन्ध्यं यः पठेन्नरः ॥ १३॥ तथाविधं भूतगणा न स्पृशन्ति कदाचन । आपदश्शत्रुचोरादि
    ग्रहदोषाश्च सम्भवाः ॥ १४॥ मातापुत्रं यथा वत्सं धेनुः पक्ष्मेव लोचनम् । तथाङ्गमेव वाराही रक्षा रक्षाति
    सर्वदा ॥ १५॥ इति श्रीवाराहीकवचं सम्पूर्णम् ।
