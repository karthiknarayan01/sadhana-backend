id: upadesha-saram-ramana-maharshi
category: stotram
name:
  english: Upadesha Saram (Ramana Maharshi)
  devanagari: उपदेशसारम् (रमणमहर्षीकृतम्)
content:
  english: karturajnaya prapyate phalam | karma kim param karma tajjadam || 1|| kritimahodadhau patanakaranam
    | phalamashashvatam gatinirodhakam || 2|| ishvararpitam necchaya kritam | cittashodhakam muktisadhakam
    || 3|| kayavanmanah karyamuttamam | pujanam japashcintanam kramat || 4|| jagata ishadhi yuktasevanam
    | ashtamurtibhriddevapujanam || 5|| uttamastavaduccamandatah | cittajam japadhyanamuttamam || 6||
    ajyadharaya srotasa samam | saralacintanam viralatah param || 7|| bhedabhavanat so'hamityasau | bhavana'bhida
    pavani mata || 8|| bhavashunyasadbhavasusthitih | bhavanabaladbhaktiruttama || 9|| hritsthale manah
    svasthata kriya | bhaktiyogabodhashca nishcitam || 10|| vayurodhanalliyate manah | jalapakshivadrodhasadhanam
    || 11|| cittavayavashcitkriyayutah | shakhayordvayi shaktimulaka || 12|| layavinashane ubhayarodhane
    | layagatam punarbhavati no mritam || 13|| pranabandhanallinamanasam | ekacintanannashametyadah ||
    14|| nashtamanasotkrishtayoginah | krityamasti kim svasthitim yatah || 15|| drishyavaritam cittamatmanah
    | cittvadarshanam tattvadarshanam || 16|| manasam tu kim margane krite | naiva manasam marga arjavat
    || 17|| vrittayastvaham vrittimashritah | vrittayo mano viddhyaham manah || 18|| ahamayam kuto bhavati
    cinvatah | ayi patatyaham nijavicaranam || 19|| ahami nashabhajyahamahamtaya | sphurati hritsvayam
    paramapurnasat || 20|| idamaham pada'bhikhyamanvaham | ahamilinake'pyalayasattaya || 21|| vigrahendriyapranadhitamah
    | nahamekasattajjadam hyasat || 22|| sattvabhasika citkvavetara | sattaya hi ciccittaya hyaham ||
    23|| ishajivayorveshadhibhida | satsvabhavato vastu kevalam || 24|| veshahanatah svatmadarshanam |
    ishadarshanam svatmarupatah || 25|| atmasamsthitih svatmadarshanam | atmanirdvayadatmanishthata ||
    26|| jnanavarjita'jnanahinacit | jnanamasti kim jnatumantaram || 27|| kim svarupamityatmadarshane
    | avyaya'bhava''purnacitsukham || 28|| bandhamuktyatitam param sukham | vindatiha jivastu daivikah
    || 29|| ahamapetakam nijavibhanakam | mahadidamtapo ramanavagiyam || 30|| || iti ramanamaharshikritam
    upadeshasaram sampurnam ||
  devanagari: कर्तुराज्ञया प्राप्यते फलम् । कर्म किं परं कर्म तज्जडम् ॥ १॥ कृतिमहोदधौ पतनकारणम् । फलमशाश्वतं
    गतिनिरोधकम् ॥ २॥ ईश्वरार्पितं नेच्छया कृतम् । चित्तशोधकं मुक्तिसाधकम् ॥ ३॥ कायवाङ्मनः कार्यमुत्तमम्
    । पूजनं जपश्चिन्तनं क्रमात् ॥ ४॥ जगत ईशधी युक्तसेवनम् । अष्टमूर्तिभृद्देवपूजनम् ॥ ५॥ उत्तमस्तवादुच्चमन्दतः
    । चित्तजं जपध्यानमुत्तमम् ॥ ६॥ आज्यधारया स्रोतसा समम् । सरलचिन्तनं विरलतः परम् ॥ ७॥ भेदभावनात् सोऽहमित्यसौ
    । भावनाऽभिदा पावनी मता ॥ ८॥ भावशून्यसद्भावसुस्थितिः । भावनाबलाद्भक्तिरुत्तमा ॥ ९॥ हृत्स्थले मनः स्वस्थता
    क्रिया । भक्तियोगबोधाश्च निश्चितम् ॥ १०॥ वायुरोधनाल्लीयते मनः । जालपक्षिवद्रोधसाधनम् ॥ ११॥ चित्तवायवश्चित्क्रियायुताः
    । शाखयोर्द्वयी शक्तिमूलका ॥ १२॥ लयविनाशने उभयरोधने । लयगतं पुनर्भवति नो मृतम् ॥ १३॥ प्राणबन्धनाल्लीनमानसम्
    । एकचिन्तनान्नाशमेत्यदः ॥ १४॥ नष्टमानसोत्कृष्टयोगिनः । कृत्यमस्ति किं स्वस्थितिं यतः ॥ १५॥ दृश्यवारितं
    चित्तमात्मनः । चित्त्वदर्शनं तत्त्वदर्शनम् ॥ १६॥ मानसं तु किं मार्गणे कृते । नैव मानसं मार्ग आर्जवात्
    ॥ १७॥ वृत्तयस्त्वहं वृत्तिमाश्रिताः । वृत्तयो मनो विद्ध्यहं मनः ॥ १८॥ अहमयं कुतो भवति चिन्वतः । अयि
    पतत्यहं निजविचारणम् ॥ १९॥ अहमि नाशभाज्यहमहंतया । स्फुरति हृत्स्वयं परमपूर्णसत् ॥ २०॥ इदमहं पदाऽभिख्यमन्वहम्
    । अहमिलीनकेऽप्यलयसत्तया ॥ २१॥ विग्रहेन्द्रियप्राणधीतमः । नाहमेकसत्तज्जडं ह्यसत् ॥ २२॥ सत्त्वभासिका
    चित्क्ववेतरा । सत्तया हि चिच्चित्तया ह्यहम् ॥ २३॥ ईशजीवयोर्वेषधीभिदा । सत्स्वभावतो वस्तु केवलम् ॥
    २४॥ वेषहानतः स्वात्मदर्शनम् । ईशदर्शनं स्वात्मरूपतः ॥ २५॥ आत्मसंस्थितिः स्वात्मदर्शनम् । आत्मनिर्द्वयादात्मनिष्ठता
    ॥ २६॥ ज्ञानवर्जिताऽज्ञानहीनचित् । ज्ञानमस्ति किं ज्ञातुमन्तरम् ॥ २७॥ किं स्वरूपमित्यात्मदर्शने । अव्ययाऽभवाऽऽपूर्णचित्सुखम्
    ॥ २८॥ बन्धमुक्त्यतीतं परं सुखम् । विन्दतीह जीवस्तु दैविकः ॥ २९॥ अहमपेतकं निजविभानकम् । महदिदंतपो रमणवागियम्
    ॥ ३०॥ ॥ इति रमणमहर्षीकृतम् उपदेशसारम् संपूर्णम् ॥
