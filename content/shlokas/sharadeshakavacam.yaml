id: sharadeshakavacam
category: kavacha
name:
  english: sharadeshakavacam
  devanagari: शारदेशकवचम्
content:
  english: shrisharadeshakavaca shriganeshaya namah | devyuvaca | kavacam sharadeshasya kripaya bruhi
    shankara | shiva uvaca | kavacasyasya ganako dhundhisamudbhavah | ga~ bijam pranavashshaktissvahavai
    kilakam smritam | nyasadhyanadayassarve mantravatparikirtitah | rameshah purvatah patu vahnikone ramavatu
    || 1|| dakshine patu mam shambhuh nairrityam girinandini | pashcime patu mam maye vayavyam ratisundari
    || 2| uttare patu mam brahma raudrayam tu sarasvati | akashe pushtivighneshah patu mam pushtisamyutah
    || 3|| patale mushakah patu caturbrahmasvarupavan | evam dashadisho rakshet pancaikakritidharakah
    || 4|| shikhayam gunapah patu gunadharasvarupavan | murdhanam patu me shvetah sudhamurtirnirantaram
    || 5|| vidyeshvarah bhaladesham bhrumadhyam jnanadayakah | shravanau manikarnisho mahanandah kapolayoh
    || 6|| dantanme sthuladanto'vyat jihvam vagishvaripatih | oshthau me patu piyushadayako vishnupujitah
    || 7|| cibukam prativadimukhastambhakaro'vatu | kantham vishanashako'vyat vaksho me shurpakarnakah
    || 8|| pancapranansada patu mritasanjivinipatih | daurbhagyanashakasskandhau bahu me yakshinipatih
    ||9|| uru udaraganapo lingam me srishtilingakah | andam bijaganesho'vyadgudam vighnavinashakah ||
    10|| prishtham merudhanushpanih januni me jayapradah | janghayugmam rhasvajangho padau mrityuvinashakah
    || 11|| sarvangani sharadeshah patumam vighnanashakah | divavyannavanitesho ratravajnaganeshvarah
    || 12|| atavyam parvatagreva gamanagamanadishu | dashabahudharah patu bharyanme sharadeshvarah ||
    13|| putranputrirgurunbhrityan patumam mudgarayudhah | dhiyam vidyam dhanam geham patu piyushavigrahah
    || 14|| sarvada mam sada patu jnanamandapasamsthitah | bhurjapatre likhitvedam yah kanthe dharayennarah
    || 15|| na bhayam jayate tasya graharogapishacatah | ya idam kavacam punyam maharoganivarakam || 16||
    apamrityuharam saukhyadayakam bhaktipurvakam | pratahkale ca madhyahne sayankale'thava || 17|| ushahkale
    ca sangramakale shayanakalake | pravase ca pathedbhaktya dhyatva ca sharadapatim || 18|| sarvatra
    sukhamapnoti guneshena surakshitah | mrityurogaharam caitat pathaniyam visheshatah || 19|| rajano
    vashyatam yanti ripuno yanti dasyatam | mantrassidhyanti ganeshah pathanadasya varmanah || 20|| idam
    kavacamajnatva yo bhajeccharadapatim | naca siddhimavapnoti mudo varshasahasrakaih || 21|| sharadagananathasya
    bhaktena bhavapurvakam | nityam japyamidam shreshtham kavacam sarvasiddhidam || 22|| nityam japaparo
    bhakto dharmarthakamamokshakan | vidyam medham shriyam buddhim yashah kirtimavapyaca || 23|| iha bhuktakhilanbhoganante
    svanandamapnuyat | || iti shrivinayakatantre sharadeshakavacam sampurnam ||
  devanagari: श्रीशारदेशकवच श्रीगणेशाय नमः । देव्युवाच । कवचं शारदेशस्य कृपया ब्रूहि शङ्कर । शिव उवाच
    । कवचस्यास्य गणको ढुण्ढिसमुद्भवः । गँ बीजं प्रणवश्शक्तिस्स्वाहावै कीलकं स्मृतम् । न्यासध्यानादयस्सर्वे
    मन्त्रवत्परिकीर्तिताः । रमेशः पूर्वतः पातु वह्निकोणे रमावतु ॥ १॥ दक्षिणे पातु मां शम्भुः नैरृत्यां
    गिरिनन्दिनी । पश्चिमे पातु मां माये वायव्यां रतिसुन्दरी ॥ २। उत्तरे पातु मां ब्रह्मा रौद्रायां तु
    सरस्वती । आकाशे पुष्टिविघ्नेशः पातु मां पुष्टिसंयुतः ॥ ३॥ पाताले मूषकः पातु चतुर्ब्रह्मस्वरूपवान्
    । एवं दशदिशो रक्षेत् पञ्चैकाकृतिधारकः ॥ ४॥ शिखायां गुणपः पातु गुणाधारस्वरूपवान् । मूर्धानं पातु मे
    श्वेतः सुधामूर्तिर्निरन्तरम् ॥ ५॥ विद्येश्वरः भालदेशं भ्रूमध्यं ज्ञानदायकः । श्रवणौ मणिकर्णीशो महानन्दः
    कपोलयोः ॥ ६॥ दन्तान्मे स्थूलदन्तोऽव्यात् जिह्वां वागीश्वरीपतिः । ओष्ठौ मे पातु पीयूषदायको विष्णुपूजितः
    ॥ ७॥ चिबुकं प्रतिवादिमुखस्तम्भकरोऽवतु । कण्ठं विषनाशकोऽव्यात् वक्षो मे शूर्पकर्णकः ॥ ८॥ पञ्चप्राणान्सदा
    पातु मृतसञ्जीविनीपतिः । दौर्भाग्यनाशकस्स्कन्धौ बाहू मे यक्षिणीपतिः ॥९॥ ऊरू उदारगणपो लिङ्गं मे सृष्टिलिङ्गकः
    । अण्डं बीजगणेशोऽव्याद्गुदं विघ्नविनाशकः ॥ १०॥ पृष्ठं मेरुधनुष्पाणिः जानुनी मे जयप्रदः । जङ्घायुग्मं
    र्हस्वजङ्घो पादौ मृत्युविनाशकः ॥ ११॥ सर्वाङ्गाणि शारदेशः पातुमां विघ्ननाशकः । दिवाव्यान्नवनीतेशो रात्रावाज्ञागणेश्वरः
    ॥ १२॥ अटव्यां पर्वताग्रेवा गमनागमनादिषु । दशबाहुधरः पातु भार्यान्मे शारदेश्वरः ॥ १३॥ पुत्रान्पुत्रीर्गुरून्भृत्यान्
    पातुमां मुद्गरायुधः । धियं विद्यां धनं गेहं पातु पीयूषविग्रहः ॥ १४॥ सर्वदा मां सदा पातु ज्ञानमण्डपसंस्थितः
    । भूर्जपत्रे लिखित्वेदं यः कण्ठे धारयेन्नरः ॥ १५॥ न भयं जायते तस्य ग्रहरोगपिशाचतः । य इदं कवचं पुण्यं
    महारोगनिवारकम् ॥ १६॥ अपमृत्युहरं सौख्यदायकं भक्तिपूर्वकम् । प्रातःकाले च मध्याह्ने सायङ्कालेऽथवा ॥
    १७॥ उषःकाले च सङ्ग्रामकाले शयनकालके । प्रवासे च पठेद्भक्त्या ध्यात्वा च शारदापतिम् ॥ १८॥ सर्वत्र सुखमाप्नोति
    गुणेशेन सुरक्षितः । मृत्युरोगहरं चैतत् पठनीयं विशेषतः ॥ १९॥ राजानो वश्यतां यान्ति रिपुनो यान्ति दास्यताम्
    । मन्त्रास्सिध्यन्ति गाणेशाः पठनादस्य वर्मणः ॥ २०॥ इदं कवचमज्ञात्वा यो भजेच्छारदापतिम् । नच सिद्धिमवाप्नोति
    मूडो वर्षसहस्रकैः ॥ २१॥ शारदागणनाथस्य भक्तेन भावपूर्वकम् । नित्यं जप्यमिदं श्रेष्ठं कवचं सर्वसिद्धिदम्
    ॥ २२॥ नित्यं जपपरो भक्तो धर्मार्थकाममोक्षकान् । विद्यां मेधां श्रियं बुद्धिं यशः कीर्तिमवाप्यच ॥ २३॥
    इह भुक्ताखिलान्भोगानन्ते स्वानन्दमाप्नुयात् । ॥ इति श्रीविनायकतन्त्रे शारदेशकवचं सम्पूर्णम् ॥
