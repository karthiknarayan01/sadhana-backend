id: herambopanishat
category: upanishad
name:
  english: herambopanishat
  devanagari: हेरम्बोपनिषत्
content:
  english: herambopanishat om sahanavavatu | saha nau bhunaktu | saha viryam karavavahai | tejasvi navadhitamastu
    | ma vidvishavahai || om shantih shantih shantih || athato herambopanishadam vyakhyasyamah | gauri
    sa sarvamangala sarvajnam parisametyovaca | adhihi bhagavannatmavidyam prashastam yaya janturmucyate
    mayaya ca | yato duhkhadvimukto yati lokam param shubhram kevalam satvikam ca || 1|| tam vai sa hovaca
    mahanukampasindhurbandhubhuvanasya gopta | shraddhasvaitadgauri sarvatmana tvam ma te bhuyah samshayo'smin
    kadacit || 2|| herambatattve paramatmasare no vai yogannaiva tapobalena | naivayudhaprabhavato maheshi
    dagdham pura tripuram daivayogat || 3|| tasyapi herambaguroh prasadadyatha virincirgarudo mukundah
    | devasya yasyaiva balena bhuyah svam svam hitam prapya sukhena sarvam || 4|| modante sve sve pade
    punyalabdhe savairdevaih pujaniyo ganeshah | prabhuh prabhunamapi vighnarajah sinduravarnah purushah
    puranah || 5|| lakshmisahayo'dvayakunjarakritishcaturbhujashcandrakalakalapah | mayashariro madhurasvabhavastasya
    dhyanat pujanattatsvabhavah || 6|| samsaraparam munayo'pi yanti sa va brahma sa prajesho harih sah
    | indrah sa candrah paramah paratma sa eva sarvo bhuvanasya sakshi || 7|| sa sarvalokasya shubhashubhasya
    tam vai jnatva mrityumatyeti jantuh | nanyah pantha duhkhavimuktihetuh sarveshu bhuteshu ganeshamekam
    || 8|| vijnaya tam mrityumukhat pramucyate sa evamasthaya shariramekam | mayamayam mohayativa sarvasa
    pratyaham kurute karmakale || 9|| sa eva karmani karoti devo hyeko ganesho bahudha nivishtah | sa
    pujitah san sumukho'bhibhutva dantimukho'bhishtamanantashaktih || 10|| sa vai balam balinamagranyah
    punyah sharanyah sakalasya jantoh | tamekadantam gajavaktramisham vijnaya duhkhantamupaiti sadyah
    || 11|| lambodaro'ham purushottamo'ham vighnantako'ham vijayatmako'ham | naganano'ham namatam susiddhah
    skandagraganyo nikhilo'hamasmi || 12|| na me'ntarayo na ca karmalopo na punyapape mama tanmanasya
    | evam viditva gananathatattvam nirantarayam nijabodhabijam || 13|| kshemankaram santata
  devanagari: हेरम्बोपनिषत् ॐ सहनाववतु । सह नौ भुनक्तु । सह वीर्यं करवावहै । तेजस्वि नावधीतमस्तु । मा
    विद्विषावहै ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ अथातो हेरम्बोपनिषदं व्याख्यास्यामः । गौरी सा सर्वमङ्गला
    सर्वज्ञं परिसमेत्योवाच । अधीहि भगवन्नात्मविद्यां प्रशस्तां यया जन्तुर्मुच्यते मायया च । यतो दुःखाद्विमुक्तो
    याति लोकं परं शुभ्रं केवलं सात्विकं च ॥ १॥ तां वै स होवाच महानुकम्पासिन्धुर्बन्धुभुवनस्य गोप्ता ।
    श्रद्धस्वैतद्गौरी सर्वात्मना त्वं मा ते भूयः संशयोऽस्मिन् कदाचित् ॥ २॥ हेरम्बतत्त्वे परमात्मसारे नो
    वै योगान्नैव तपोबलेन । नैवायुधप्रभावतो महेशि दग्धं पुरा त्रिपुरं दैवयोगात् ॥ ३॥ तस्यापि हेरम्बगुरोः
    प्रसादाद्यथा विरिञ्चिर्गरुडो मुकुन्दः । देवस्य यस्यैव बलेन भूयः स्वं स्वं हितं प्राप्य सुखेन सर्वम्
    ॥ ४॥ मोदन्ते स्वे स्वे पदे पुण्यलब्धे सवैर्देवैः पूजनीयो गणेशः । प्रभुः प्रभूणामपि विघ्नराजः सिन्दूरवर्णः
    पुरुषः पुराणः ॥ ५॥ लक्ष्मीसहायोऽद्वयकुञ्जराकृतिश्चतुर्भुजश्चन्द्रकलाकलापः । मायाशरीरो मधुरस्वभावस्तस्य
    ध्यानात् पूजनात्तत्स्वभावाः ॥ ६॥ संसारपारं मुनयोऽपि यान्ति स वा ब्रह्मा स प्रजेशो हरिः सः । इन्द्रः
    स चन्द्रः परमः परात्मा स एव सर्वो भुवनस्य साक्षी ॥ ७॥ स सर्वलोकस्य शुभाशुभस्य तं वै ज्ञात्वा मृत्युमत्येति
    जन्तुः । नान्यः पन्था दुःखविमुक्तिहेतुः सर्वेषु भूतेषु गणेशमेकम् ॥ ८॥ विज्ञाय तं मृत्युमुखात् प्रमुच्यते
    स एवमास्थाय शरीरमेकम् । मायामयं मोहयतीव सर्वस प्रत्यहं कुरुते कर्मकाले ॥ ९॥ स एव कर्माणि करोति देवो
    ह्येको गणेशो बहुधा निविष्टः । स पूजितः सन् सुमुखोऽभिभूत्वा दन्तीमुखोऽभीष्टमनन्तशक्तिः ॥ १०॥ स वै बलं
    बलिनामग्रण्यः पुण्यः शरण्यः सकलस्य जन्तोः । तमेकदन्तं गजवक्त्रमीशं विज्ञाय दुःखान्तमुपैति सद्यः ॥
    ११॥ लम्बोदरोऽहं पुरुषोत्तमोऽहं विघ्नान्तकोऽहं विजयात्मकोऽहम् । नागाननोऽहं नमतां सुसिद्धः स्कन्दाग्रगण्यो
    निखिलोऽहमस्मि ॥ १२॥ न मेऽन्तरायो न च कर्मलोपो न पुण्यपापे मम तन्मनस्य । एवं विदित्वा गणनाथतत्त्वं
    निरन्तरायं निजबोधबीजम् ॥ १३॥ क्षेमङ्करं सन्तत
