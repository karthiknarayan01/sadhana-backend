id: surya-grahana-shanti-parihara-slokas
category: stotram
name:
  english: Surya Grahana Shanti Parihara Slokas
content:
  english: shanti shlokah indro'nalo dandadharashca rakshah pracetaso vayu kubera sharvah | majjanma rikshe
    mama rashi samsthe suryoparagam shamayantu sarve || grahana pida parihara shlokah yo'sau vajradharo
    devah adityanam prabhurmatah | sahasranayanah shakrah grahapidam vyapohatu || mukham yah sarvadevanam
    saptarciramitadyutih | candrasuryoparagottham agnih pidam vyapohatu || yah karmasakshi lokanam yamo
    mahishavahanah | candrasuryoparagottham grahapidam vyapohatu || raksho ganadhipah sakshat pralayanalasannibhah
    | ugrah karalo nir ritih grahapidam vyapohatu || nagapashadharo devah sada makaravahanah | varuno
    jalalokesho grahapidam vyapohatu || yah pranarupo lokanam vayuh krishnamrigapriyah | candrasuryoparagottham
    grahapidam vyapohatu || yo'sau nidhipatirdevah khadgashuladharo varah | candrasuryoparagottham kalusham
    me vyapohatu || yo'sau shuladharo rudrah shankaro vrishavahanah | candrasuryoparagottham dosham nashayatu
    drutam || om shantih shantih shantih |
  devanagari: शान्ति श्लोकः इन्द्रोऽनलो दण्डधरश्च रक्षः प्राचेतसो वायु कुबेर शर्वाः । मज्जन्म ऋक्षे मम
    राशि संस्थे सूर्योपरागं शमयन्तु सर्वे ॥ ग्रहण पीडा परिहार श्लोकाः योऽसौ वज्रधरो देवः आदित्यानां प्रभुर्मतः
    । सहस्रनयनः शक्रः ग्रहपीडां व्यपोहतु ॥ मुखं यः सर्वदेवानां सप्तार्चिरमितद्युतिः । चन्द्रसूर्योपरागोत्थां
    अग्निः पीडां व्यपोहतु ॥ यः कर्मसाक्षी लोकानां यमो महिषवाहनः । चन्द्रसूर्योपरागोत्थां ग्रहपीडां व्यपोहतु
    ॥ रक्षो गणाधिपः साक्षात् प्रलयानलसन्निभः । उग्रः करालो निर् ऋतिः ग्रहपीडां व्यपोहतु ॥ नागपाशधरो देवः
    सदा मकरवाहनः । वरुणो जललोकेशो ग्रहपीडां व्यपोहतु ॥ यः प्राणरूपो लोकानां वायुः कृष्णमृगप्रियः । चन्द्रसूर्योपरागोत्थां
    ग्रहपीडां व्यपोहतु ॥ योऽसौ निधिपतिर्देवः खड्गशूलधरो वरः । चन्द्रसूर्योपरागोत्थां कलुषं मे व्यपोहतु
    ॥ योऽसौ शूलधरो रुद्रः शङ्करो वृषवाहनः । चन्द्रसूर्योपरागोत्थां दोषं नाशयतु द्रुतम् ॥ ॐ शान्तिः शान्तिः
    शान्तिः ।
