id: aryashatakam
category: shataka
name:
  english: aryashatakam
  devanagari: आर्याशतकम्
content:
  english: tubhyam | kalayami namovakam karunam kuru kalayapanamapasya || 62|| daradalitanilakuvalayadalakulavilasadvilocanadvandvam
    | kalaye vishamavilocananayanacakorendukaumudim hridaye || 63|| paramashivacicadhairyakshitidharasandalanashatashatakotih
    | vairigiripatalikam me valaripusambhavita vidarayatat || 64|| prasaratu mamantarange pratipadabhogya
    bhishaktamasya sada | bhavarogabhitasevya divyaushadhika tusharagirijanya || 65| tuhinagirikirtisampaccaranasarojatayugaḻavaraghriḻih
    | bhuvanatalapavani me vimalikuryanmanomanimukuram || 66|| valamathanavitapisurabhilanavasumaparihasicikurasaurabhyam
    | smaradahanabhagyasimam niratishayanandakandalim vande || 67|| kalindijalavenimalinyavidhanadhirataravenim
    | makarandamadhuravanimanikyamanim smarami sharvanim || 68|| lolambadimbhasamhatisambhramasandayivisaradalakabharam
    | nitilatalavijitavaidhavakutilakalam sarvamangalam kalaye || 69|| karunyasarasasagaramridulahariparinatollasaccillim
    | phullendivarasodarasundaranayanam smarami cillaharim || 70|| karunasudhambudharashishiratarodarakomalakataksham
    | nasagrakalitamanimayabhushanasaram param kalam kalaye || 71|| gandatalamukurabimbitakundalitarkendumandalam
    kalaye | khandaparashurjitatapomandalasamrajyaparamasimanam || 72|| vishadataradashanadidhitininditakundenducaturilaharim
    | shishirakarashakalashekhararoshagrishmoshmacandrikam vande || 73|| arunamshudashanavasanajyotishprasaratishonitadigantam
    | shitikanthenatarpanasarasasvaditamritadharam kalaye || 74|| sharadaparvanahimakiranashasitadasyasundaratarasyam
    | kalayami kulagirishvaraviracitaparamashivacaranavarivasyam || 75|| atilaḻitagaḻatalashritaghavaḻatarodaraharimaniharam
    | kalayami nitilalocananayanalicandanadigulikalim || 76|| karikumbhakanakakalashar̤ambarasambadhisadhukucakumbham
    | smaramathanacittashamadhanataskaryakalam kripakulam kalaye || 77|| shambhukritasukritasampatsambhritasauvarnakumbhakucakumbham
    | nitilanayanaparikankshitadridhaparirambham smarami jagadambam || 78|| ruciratarakanakavallisashtangapranatabhujatatimatallim
    | amaraparipanthivargapratibhayatarakaḻaratrimakalaye || 79|| anilaromavallikshullikritavanapipilikavalikam
    | kshonidhareshvarayashashcandramasah purnimamumam pranumah || 80|| shonanadavartarucishrenibhayadayinimnashubhanabhim
    | sayantanaghanapatalishobhanavasanam smarami harasenam || 81|| katitataghatitasphutarucikanakamanikancidalitatatidabham
    | kutilendumakuta manjulamancam sancintaye kalam kancit || 82|| hastivaramastakavibhavajitvaravistariharijaghanabharam
    | nistulasaundaryasudharatnakarasampadam smaredambam || 83|| vikatakshacittamanmathavikritividhanaikatanasunitambam
    | kalayami bhuvanamandalamandiramanidipikam mahamayam || 84|| kumbhikararajarambhasambhavitasuruciroruvarakandam
    | sambhavaye nisumbhadyasuramaharanyadavashikhijvalam || 85|| janumayahemasamputasamsajjadbhaktacittamanimukuram
    | bhanuhimabhanukrishanulocanasahadharminim namaskurmah || 86|| janghaprakandashobhasanghastamitoccakanakadandabham
    | hunkarabhasmitasurajrimbhitabalapatalikam kalam kalaye || 87|| manjulashinjanamanimanjirasphuranaranjitapadabjam
    | kanjasharavairicetassarasijakalahamsayoshitamupase || 88|| prapadaprabhaprakandaprotsaritakacchapacchaviprasaram
    | pranumah praleyagiripracuratapahprakaranaipunishrenim || 89|| carananamadamarapalimaulimanikyaranjitanakhalim
    | nakhacandrikanirastapranatatamomandalim kalam kalaye || 90|| suravitapimridulalohitakisalayavaikalyakalanapatucaranam
    | kalayami caranakantiprasaranirastarunambujamambam || 91|| manimayakirikundalakeyurodaraharakatakadyaih
    | rucirairbhushanasarairbhushitavesham smarami harayosham || 92|| kalayami kalayakshim karatalaviluthatkaraḻakaravaḻam
    kuḻiganaih parivritam kaḻiparivaramandalimaulim || 93|| sphutarucivitapivisheshaih patutaraninadaih
    plavangamaishca bhritam | kalaye sharngodhyanam kartyayanyah sukhasikasthanam || 94|| haridrarucisamabha
    nirnidra dinarakshane mata | sauradravim mayi dhuram daridryavyakule drutam vahatu || 95|| bhuryadrimaulinilaya
    bhuridravinaughavrishtibhirmata | daridryagharmataptam mam rudranyabhishincatat kshanenaiva || 96||
    vanyam dainyaughamayim dhanya nirmulayet samulam me | kanya tusharaparvatajanya gunya katakshashastrena
    || 97|| sargasthityantakari jagatah svargapavargadatri me | daurgatyashikharikutan durga bhindyat
    katakshakulishena || 98|| sharnodyananivasini matah paradevate mahamaye
  devanagari: तुभ्यम् । कलयामि नमोवाकं करुणां कुरु कालयापनमपास्य ॥ ६२॥ दरदलितनीलकुवलयदलकुलविलसद्विलोचनद्वन्द्वाम्
    । कलये विषमविलोचननयनचकोरेन्दुकौमुदीं हृदये ॥ ६३॥ परमशिवचिचधैर्यक्षितिधरसन्दलनशातशतकोटिः । वैरिगिरिपटलिकां
    मे वलरिपुसम्भाविता विदारयतात् ॥ ६४॥ प्रसरतु ममान्तरङ्गे प्रतिपदभोग्या भिषक्तमस्य सदा । भवरोगभीतसेव्या
    दिव्यौषधिका तुषारगिरिजन्या ॥ ६५। तुहिनगिरिकीर्तिसम्पच्चरणसरोजातयुगळवरघृळिः । भुवनतलपावनी मे विमलीकुर्यान्मनोमणीमुकुरम्
    ॥ ६६॥ वलमथनविटपिसुरभिलनवसुमपरीहासिचिकुरसौरभ्याम् । स्मरदहनभाग्यसीमां निरतिशयानन्दकन्दलीं वन्दे ॥ ६७॥
    कालिन्दीजलवेणीमालिन्यविधानधीरतरवेणीम् । मकरन्दमधुरवाणीमाणिक्यमणीं स्मरामि शर्वाणीम् ॥ ६८॥ लोलम्बडिम्भसंहतिसम्भ्रमसन्दायिविसरदलकभराम्
    । निटिलतलविजितवैधवकुटिलकलां सर्वमङ्गलां कलये ॥ ६९॥ कारुण्यसरससागरमृदुलहरीपरिणतोल्लसच्चिल्लीम् । फुल्लेन्दीवरसोदरसुन्दरनयनां
    स्मरामि चिल्लहरीम् ॥ ७०॥ करुणासुधाम्बुधाराशिशिरतरोदारकोमलकटाक्षाम् । नासाग्रकलितमणिमयभूषणसारां परां
    कलां कलये ॥ ७१॥ गण्डतलमुकुरबिम्बितकुण्डलितार्केन्दुमण्डलां कलये । खण्डपरशूर्जिततपोमण्डलसाम्राज्यपरमसीमानम्
    ॥ ७२॥ विशदतरदशनदीधितिनिन्दितकुन्देन्दुचातुरीलहरीम् । शिशिरकरशकलशेखररोषग्रीष्मोष्मचन्द्रिकां वन्दे
    ॥ ७३॥ अरुणांशुदशनवसनज्योतिष्प्रसरातिशोणितदिगन्ताम् । शितिकण्ठेनातर्पणसरसास्वादितामृताधरां कलये ॥ ७४॥
    शारदपार्वणहिमकिरणाशासितदास्यसुन्दरतरास्याम् । कलयामि कुलगिरीश्वरविरचितपरमशिवचरणवरिवस्याम् ॥ ७५॥ अतिलळितगळतलाश्रितघवळतरोदारहारिमणिहाराम्
    । कलयामि निटिललोचननयनालीचन्दनादिगुलिकालीम् ॥ ७६॥ करिकुम्भकनककलशाड़म्बरसम्बाधिसाधुकुचकुम्भाम् । स्मरमथनचित्तशमधनतास्कर्यकलां
    कृपाकुलां कलये ॥ ७७॥ शम्भुकृतसुकृतसम्पत्सम्भृतसौवर्णकुम्भकुचकुम्भाम् । निटिलनयनपरिकाङ्क्षितदृढपरिरम्भां
    स्मरामि जगदम्बाम् ॥ ७८॥ रुचिरतरकनकवल्लीसाष्टाङ्गप्रणतभुजततिमतल्लीम् । अमरपरिपन्थिवर्गप्रतिभयतरकाळरात्रिमाकलये
    ॥ ७९॥ आनीलरोमवल्लीक्षुल्लीकृतवनपिपीलिकावलिकाम् । क्षोणीधरेश्वरयशश्चन्द्रमसः पूर्णिमामुमां प्रणुमः
    ॥ ८०॥ शोणनदावर्तरुचिश्रेणीभयदायिनिम्नशुभनाभीम् । सायन्तनघनपटलीशोभनवसनां स्मरामि हरसेनाम् ॥ ८१॥ कटितटघटितस्फुटरुचिकनकमणीकाञ्चिदलिततटिदाभाम्
    । कुटिलेन्दुमकुट मञ्जुलमञ्चां सञ्चिन्तये कलां काञ्चित् ॥ ८२॥ हस्तिवरमस्तकविभवजित्वरविस्तारिहारिजघनभराम्
    । निस्तुलसौन्दर्यसुधारत्नाकरसम्पदं स्मरेदम्बाम् ॥ ८३॥ विकटाक्षचित्तमन्मथविकृतिविधानैकतानसुनितम्बाम्
    । कलयामि भुवनमण्डलमन्दिरमणिदीपिकां महामायाम् ॥ ८४॥ कुम्भिकरराजरम्भासम्भावितसुरुचिरोरुवरकाण्डाम् ।
    सम्भावये निसुम्भाद्यसुरमहारण्यदवशिखिज्वालाम् ॥ ८५॥ जानुमयहेमसम्पुटसंसज्जद्भक्तचित्तमणिमुकुराम् । भानुहिमभानुकृशानुलोचनसहधर्मिणीं
    नमस्कुर्मः ॥ ८६॥ जङ्घाप्रकाण्डशोभासङ्घास्तमितोच्चकनकदण्डाभाम् । हुङ्कारभस्मितासुरजृम्भितबलपटलिकां
    कलां कलये ॥ ८७॥ मञ्जुलशिञ्जानमणीमञ्जीरस्फुरणरञ्जितपदाब्जाम् । कञ्जशरवैरिचेतस्सरसिजकलहंसयोषितमुपासे
    ॥ ८८॥ प्रपदप्रभाप्रकाण्डप्रोत्सारितकच्छपच्छविप्रसराम् । प्रणुमः प्रालेयगिरिप्रचुरतपःप्रकरनैपुणीश्रेणीम्
    ॥ ८९॥ चरणनमदमरपालीमौलीमाणिक्यरञ्जितनखालीम् । नखचन्द्रिकानिरस्तप्रणततमोमण्डलीं कलां कलये ॥ ९०॥ सुरविटपिमृदुललोहितकिसलयवैकल्यकलनपटुचरणाम्
    । कलयामि चरणकान्तिप्रसरनिरस्तारुणाम्बुजामम्बाम् ॥ ९१॥ मणिमयकिरीकुण्डलकेयूरोदारहारकटकाद्यैः । रुचिरैर्भूषणसारैर्भूषितवेषां
    स्मरामि हरयोषाम् ॥ ९२॥ कलयामि कालयक्षीं करतलविलुठत्कराळकरवाळां कूळीगणैः परिवृतां काळीपरिवारमण्डलीमौलीम्
    ॥ ९३॥ स्फुटरुचिविटपिविशेषैः पटुतरनिनदैः प्लवङ्गमैश्च भृतम् । कलये शार्ङ्गोध्यानं कार्त्यायन्याः सुखासिकास्थानम्
    ॥ ९४॥ हारिद्ररुचिसमाभा निर्निद्रा दीनरक्षणे माता । सौरद्रवीं मयि धुरं दारिद्र्यव्याकुले द्रुतं वहतु
    ॥ ९५॥ भूर्यद्रिमौलिनिलया भूरिद्रविणौघवृष्टिभिर्माता । दारिद्र्यघर्मतप्तं मां रुद्राण्यभिषिञ्चतात्
    क्षणेनैव ॥ ९६॥ वन्यां दैन्यौघमयीं धन्या निर्मूलयेत् समूलं मे । कन्या तुषारपर्वतजन्या गुण्या कटाक्षशस्त्रेण
    ॥ ९७॥ सर्गस्थित्यन्तकरी जगतः स्वर्गापवर्गदात्री मे । दौर्गत्यशिखरिकूटान् दुर्गा भिन्द्यात् कटाक्षकुलिशेन
    ॥ ९८॥ शार्ङोद्याननिवासिनि मातः परदेवते महामाये
