id: brahmakritam05shivastotram
category: stotram
name:
  english: brahmakritam05shivastotram
  devanagari: ब्रह्मकृतं०५शिवस्तोत्रम्
content:
  english: brahmakritam 5 shivastotram brahmovaca | athahamuccaranvedanasheshairvadanaih shivam | astausham
    bhaktisampurnam kritva manasamarcanam || 1|| namah shivaya mahate sarvalokaikahetave | yena prakashyate
    sarvam dhriyate satatam namah || 2|| vishvavyaptamidam tejah prakashayati santatam | nekshante tvaddayahina
    jatyandha bhaskaram yatha || 3|| bhulingamamalam hyetaddrishyamadhyatmacakshusha | antasstham va bahisstham
    va tvadbhaktairanubhuyate || 4|| aparicchedyamakaramantaratmani yoginah | tadetattava devesha jvalitam
    darpano yatha || 5|| athava shankari shaktih satya'norapyaniyasi | matto nanyatarah kashcidyanmayyapi
    viliyate || 6|| anuste karunapatram mahattvam dhruvamashnute | nadhiko'sti parastvatto na matto'pi
    tadashrayat || 7|| tvayyarpitam manastvato na viyogamapekshate | vacah katham pravrittih syattava
    vaibhavakirttane || 6|| svayamisha mahadeva prasida bhuvanadhika | adisha prayatam bhaktamapekshitaniyuktishu
    || 9|| idam vijnapya vinayannamaskritva punahpunah | pranjalirdevadevesham nyashidam savidhe vibho
    || 3
  devanagari: ब्रह्मकृतं ५ शिवस्तोत्रम् ब्रह्मोवाच । अथाहमुच्चरन्वेदानशेषैर्वदनैः शिवम् । अस्तौषं भक्तिसम्पूर्णं
    कृत्वा मानसमर्चनम् ॥ १॥ नमः शिवाय महते सर्वलोकैकहेतवे । येन प्रकाश्यते सर्वं ध्रियते सततं नमः ॥ २॥
    विश्वव्याप्तमिदं तेजः प्रकाशयति सन्ततम् । नेक्षन्ते त्वद्दयाहीना जात्यन्धा भास्करं यथा ॥ ३॥ भूलिङ्गममलं
    ह्येतद्दृश्यमध्यात्मचक्षुषा । अन्तस्स्थं वा बहिस्स्थं वा त्वद्भक्तैरनुभूयते ॥ ४॥ अपरिच्छेद्यमाकारमन्तरात्मनि
    योगिनः । तदेतत्तव देवेश ज्वलितं दर्पणो यथा ॥ ५॥ अथवा शाङ्करी शक्तिः सत्याऽणोरप्यणीयसी । मत्तो नान्यतरः
    कश्चिद्यन्मय्यपि विलीयते ॥ ६॥ अणुस्ते करुणापात्रं महत्त्वं ध्रुवमश्नुते । नाधिकोऽस्ति परस्त्वत्तो
    न मत्तोऽपि तदाश्रयात् ॥ ७॥ त्वय्यर्पितं मनस्त्वतो न वियोगमपेक्षते । वाचः कथं प्रवृत्तिः स्यात्तव वैभवकीर्त्तने
    ॥ ६॥ स्वयमीश महादेव प्रसीद भुवनाधिक । आदिश प्रयतं भक्तमपेक्षितनियुक्तिषु ॥ ९॥ इदं विज्ञाप्य विनयान्नमस्कृत्वा
    पुनःपुनः । प्राञ्जलिर्देवदेवेशं न्यषीदं सविधे विभो ॥ ३
