id: vishnusuktam-2-2
category: veda
name:
  english: vishnusuktam 2
  devanagari: विष्णुसूक्तम् २
content:
  english: vihotradadhevayunavideka inmahidevasya savituh parishtutih svaha || 1|| idam vishnurvicakrame
    tredha nidadhe padam samudhamasya pa~msure svaha || 2|| iravati dhenumati hi bhuta~m suyabasinima
    sarasastotrasarasangrahah navedashasya | vyaskabmnarodasi vishnave te dadharthaprithivimabhito mayukhaih
    svaha || 3|| vedashrutau deveshvaghoshatampracipretamadhvaram kalpayanti urdhvam yajnannayatammajihvaratamasvangoshtamavadatandevi
    durye trayurmma nirvadishtamprajamma nirvadishtamatraramethamvarshmanprithivyah || 4|| vishnornnukam
    viryyani pravocam yah parthivani vimame raja~si yo arakabhayaduttara~ sadhastham ivicakramanassredhorugayo
    vishnave tva || 5|| divova vishna' uta vaprithivyamahova vishna urorantarikshata ubhahihastavasuna
    prinasva prayacchadakshinadotasavya vishnavetva || 6|| pratadvishnuh stavate viryyena mrigonabhimah
    kucarogirishtah yasyorushu trishu vikramneshvadhikshiyanti bhuvanani vishva || 7|| vishnoraratamasi
    vishnoh shnaptrestho vishnoh syurasi vishno'rdhuvosi vaishnavamasi vishnave tva || 8|| devasya tva
    savituh prasaveshvinorbahubhyam pushno hastabhyam adadenaryasidamaha~ rakshasangriva apikrintami brihannasi
    brihadrava brihatimindhraya vacam vada || 9|| vishnoh karmyani pashyata yato vratani pashyase indrasya
    yujyassakha || 10|| tadvishnoh paramam pada~ sada pashyanti surayah divivanvakshuratatam || 11|| iti
    shrivishnusuktam 2 samaptam ||
  devanagari: विहोत्रादधेवयुनाविदेक इन्महीदेवस्य सवितुः परिष्टुतिः स्वाहा ॥ १॥ इदं विष्णुर्विचक्रमे त्रेधा
    निदधे पदं समूढमस्य पाँंसुरे स्वाहा ॥ २॥ इरावती धेनुमती हि भूतँं सूयबसिनीम सरसस्तोत्रसारसङ्ग्रहः नवेदशस्या
    । व्यस्कब्म्नारोदसी विष्णवे ते दाधर्थपृथिवीमभितो मयूखैः स्वाहा ॥ ३॥ वेदश्रुतौ देवेष्वाघोषतम्प्राचीप्रेतमध्वरं
    कल्पयन्ती ऊर्ध्वं यज्ञन्नयतम्माजिह्वरतमस्वङ्गोष्टमावदतन्देवी दुर्ये त्रायुर्म्मा निर्वादिष्टम्प्रजाम्मा
    निर्वादिष्टमत्ररमेथाम्वर्ष्मन्पृथिव्याः ॥ ४॥ विष्णोर्न्नुकं वीर्य्याणि प्रवोचं यः पार्थिवानि विममे
    रजाँसि यो अरकभायदुत्तरँ सधस्थं इविचक्रमाणस्स्रेधोरुगायो विष्णवे त्वा ॥ ५॥ दिवोवा विष्णऽ उत वापृथिव्यामहोवा
    विष्ण उरोरन्तरिक्षात उभाहिहस्तावसुना पृणस्वा प्रयच्छदक्षिणादोतसव्या विष्णवेत्वा ॥ ६॥ प्रतद्विष्णुः
    स्तवते वीर्य्येण मृगोनभीमः कुचरोगिरिष्टाः यस्योरुषु त्रिषु विक्रम्णेष्वधिक्षियन्ति भुवनानि विश्वा
    ॥ ७॥ विष्णोरराटमसि विष्णोः श्नप्त्रेस्थो विष्णोः स्यूरसि विष्णोऽर्धुवोसि वैष्णवमसि विष्णवे त्वा ॥
    ८॥ देवस्य त्वा सवितुः प्रसवेश्विनोर्बाहुभ्यां पूष्णो हस्ताभ्यां आददेनार्यसीदमहँ रक्षसाङ्ग्रीवा अपिकृन्तामि
    बृहन्नसि बृहद्रवा बृहतीमीन्ध्रय वाचं वद ॥ ९॥ विष्णोः कर्म्याणि पश्यत यतो व्रतानि पश्यसे इन्द्रस्य
    युज्यस्सखा ॥ १०॥ तद्विष्णोः परमं पदँ सदा पश्यन्ति सूरयः दिवीवन्वक्षुराततम् ॥ ११॥ इति श्रीविष्णुसूक्तं
    २ समाप्तम् ॥
