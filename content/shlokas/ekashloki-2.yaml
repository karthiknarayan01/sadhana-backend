id: ekashloki-2
category: ekashloki
name:
  english: ekashloki 2
  devanagari: एकश्लोकी २
content:
  english: cinmatre sukhavigrahe kathamidam hyadvaitamatre jadam namnavyashtisamashtito'pijanimadrupena
    karyatmakam | sphurtirnaiva vibhatyaharyaditu kim tasmatparacavarah sarvajnah parameshvaro'pi ca tatha
    kincijnajivo bhavet || iti shrimat paramahamsaparivrajakacarya sadguru bhagavan shridharasvamimaharajaviracita
    ekashloki samapta |
  devanagari: चिन्मात्रे सुखविग्रहे कथमिदं ह्यद्वैतमात्रे जडं नाम्नाव्यष्टिसमष्टितोऽपिजनिमद्रूपेण कार्यात्मकम्
    । स्फूर्तिर्नैव विभात्यहर्यदितु किं तस्मात्परचावरः सर्वज्ञः परमेश्वरोऽपि च तथा किञ्चिज्ञजीवो भवेत्
    ॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरु भगवान् श्रीधरस्वामीमहाराजविरचिता एकश्लोकी समाप्ता ।
meaning: {}
