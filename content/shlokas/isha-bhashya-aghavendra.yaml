id: isha-bhashya-aghavendra
category: upanishad
name:
  english: isha bhashya ṟaghavendra
  devanagari: ईशा भाष्य ऱघवेन्द्र
content:
  english: iti || 20|| 2|| samastagunapurnaya doshaduraya vishnave | namah shriprananathaya bhaktabhishtapradayine
    || ishavasyopanishado bhashyadyuktarthasangrahah | raghavendrena yatina krito'yam shishyayancaya ||
    iti shriraghavendrayativiracitah shrimadishavasyopanishatkhandarthah samaptah || bharatiramanamukhyapranantargata
    shrikrishnarpanamastu||
  devanagari: इति ॥ २०॥ २॥ समस्तगुणपूर्णाय दोषदूराय विष्णवे । नमः श्रीप्राणनाथाय भक्ताभीष्टप्रदायिने ॥
    ईषावास्योपनिषदो भाष्याद्युक्तार्थसङ्ग्रहः । राघवेन्द्रेण यतिना कृतोऽयं शिष्ययाञ्चया ॥ इति श्रीराघवेन्द्रयतिविरचितः
    श्रीमदीशावास्योपनिषत्खण्डार्थः समाप्तः ॥ भारतीरमणमुख्यप्राणान्तर्गत श्रीकृष्णार्पणमस्तु॥
meaning: {}
