id: shyamala-dandakam
category: stotram
name:
  english: Shyamala Dandakam
  devanagari: श्यामलादण्डकम् (सार्थम् कालिदासविरचितम्)
content:
  english: '|| om shrishyamaladevyai namah || mahakavishrikalidasapranitam || shyamaladandakam || dhyanam
    - manikyavinamupalalayantim madalasam manjulavagvilasam | mahendraniladyutikomalangim matangakanyam
    satatam smarami || 1|| (manasa smarami) dhyanam (meditation)| caturbhuje candrakalavatamse kuconnate
    kunkamaragashone | pundrekshupashankushapushpabanahaste namaste jagadekamatah || prarthana - mata
    marakatashyama matangi madashalini | katakshayatu kalyani kadambavanavasini || Prayer - jaya matangatanaye
    jaya nilotpaladyute | jaya sangitarasike jaya lilashukapriye || atha dandakam | (shyamalayah mukhavarnana)
    jaya janani ! sudhasamudrantahridyanmanidvipasamrudhabilvatavimadhyakalpa- drumakalpakadambakantaravasapriye,
    krittivasahpriye, sarvalokapriye; dandaka description of shyamala''s Face sadararabdhasangitasambhavanasambhramalolanipasragabaddhaculisanathatrike,
    sanumatputrike, shekharibhutashitamshurekhamayukhavalibaddhasusnigdhanilalakashrenishringarite, lokasambhavite,
    kamaliladhanuhsannibhabhrulatapushpasandohasandehakrillocane, vaksudhasecane ; carugorocanapankakelilalamabhirame,
    surame, rame, prollasadvalikamauktikashrenikacandrikamandalodbhasilavanya- gandasthalanyasta kasturikapatrarekhasamudbhutasaurabhyasambhrantabhringanganagita-
    sandribhavanmandratantrisvare, susvare, bhasvare; (shyamalayah shariravarnana) vallakivadanaprakriyalolatalidalabaddhatatankabhushavisheshanvite,
    siddhasammanite, divyahalamadodvelahelalasaccakshurandolana- shrisamakshiptakarnaikanilotpale, shyamale,
    puritasheshalokabhivanchaphale, nirmale, shriphale ; svedabindullasatphalalavanyanihshyandasandoha-
    sandehakrinnasikamauktike, sarvamantratmike, kalike; mugdhamandasmitodaravaktrasphuratpugatambulakarpurakhandotkare,
    jnanamudrakare, sarvasampatkare, padmabhasvatkare, shrikare, kundapushpadyutisnigdhadantavalinirmalalolakallola-
    sammelanasmerashonadhare, caruvinadhare, pakvabimbadhare || (shyamalayah shariravarnana) sulalitanavayauvanarambhacandrodayodvelalavanya-
    dugdharnavavirbhavatkambubibbokabhritkandhare, satkalamandire, manthare, divyaratnaprabhabandhuracchannaharadibhushasamudyotamananavadyangashobhe,
    shubhe; ratnakeyurarashmicchatapallavaprollasaddorlatarajite, yogibhih pujite ; vishvadinmandalavyapimanikyatejahsphuratkankanalankrite,
    vibhramalankrite, sadhubhih satkrite ; description of shyamala''s Body| vasararambhavelasamujjrimbhamanaravindapratidvandvipanidvaye,
    santatodyaddaye advaye ; divyaratnormikadidhitistomasandhyayamananguli- pallavodyannakhenduprabhamandale,
    sannatakhandale, citprabhamandale, prollasatkundale; tarakarajinikashaharavalismeracaru- stanabhogabharanamanmadhyavallivaliccheda-
    vicisamullasasandarshitakarasaundaryaratnakare, vallakibhritkare, kinkarashrikare; hemakumbhopamottungavakshojabharavanamre
    , trilokavanamre ; lasadvrittagambhiranabhisarastirashaivalashankakarashyamaromavalibhushane, manjusambhashane
    ; carushinjatkatisutranirbhartsitanangaliladhanuhshinjinidambare, divyaratnambare, padmaragollasanmekhalabhasvarashronishobhajitasvarnabhubhrittale,
    candrikashitale || (shyamalayah padavarnana) vikasitanavakimshukatamradivyamshukacchannacarurushobhaparabhuta-
    sindurashonayamanendramatangahastargale, vaibhavanargale shyamale, komalasnigdhanilotpalotpaditanangatunirashankakarodarajanghalate,
    carulilagate, namradikpalasimantinikuntalasnigdhanilaprabhapunjasanjata- durvankurashankasarangasamyoga-
    rinkhannakhendujjvale, projjvale, nirmale; description of shyamala''s ḻegs and Fit| (shyamalayah sabhamandapavarnana)
    prahvadeveshalakshmishabhuteshatoyeshavanishakinashadaityeshayaksheshavayvagni- kotiramanikyasanghrishtabalatapoddamalaksharasarunyatarunyalakshmi-
    grihitanghripadme, supadme, ume || (shyamalayah sabhamandapavarnana) suruciranavaratnapithasthite,
    susthite, raktapadmasane, ratnasihmasane shankhapadmadvayopashrite, vishrute tatra vighneshadurgavatukshetrapalairyute,
    mattamatangakanyasamuhanvite, manjulamenakadyanganamanite, bhairavairashtabhirveshtite, devi ! vamadibhih
    shaktibhih sevite; dhatri ! lakshmyadishaktyashtakaih samyute, matrikamandalairmandite, yakshagandharvasiddhanganamandalairarcite,
    pancabanatmike, pancabanena ratya ca sambhavite, pritibhaja vasantena canandite || bhaktibhajam param
    shreyase kalpase, yoginam manase dyotase, chandasam ojase bhrajase || gitavidyavinodatitrishnena krishnena
    sampujyase | bhaktimaccetasa vedhasa stuyase | vishvahridyena vadyena vidyadharairgiyase || shravanaharanadakshinakvanaya
    vinaya kinnarairgiyase || yakshagandharvasiddhanganamandalairarcyase | sarvasaubhagyavanchavatibhih
    vadhubhih suranam samaradhyase || sarvavidyavisheshatmakam catugathasamuccaranam kanthamulollasadvarnarajitrayam
    komalashyamalodarapakshadvayam tundashobhatiduribhavatkimshukam tam shukam lalayanti parikridase ||
    5 || (shyamalayah sarvaishvaryapradayakatvavarnana) panipadmadvayenakshamalamapi sphatikim jnanasaratmakam
    pustakam caparenankusham pashamabibhrati yena sancintyase cetasa tasya vaktrantarat gadyapadyatmika
    bharati nissaret || yena va yavakabhakritirbhavyase tasya vashya bhavanti striyah purushah | yena
    va shatakumbhadyutirbhavyase so''pi lakshmisahasraih parikridate | kim na siddhayet vapu: shyamalam
    komalam candracudanvitam tavakam dhyayatah | tasya lilasaro varidhih, tasya kelivanam nandanam, tasya
    bhadrasanam bhutalam, tasya girdevata kinkari, tasya cajnakari shrih svayam || 6 || (shyamalayah sarvatmakatvavarnana)
    sarvatirthatmike! sarvamantratmike ! sarvatantratmike ! sarvayantratmike ! sarvacakratmike ! sarvashaktyatmike
    ! sarvapithatmike ! sarvatattvatmike ! sarvavidyatmike ! sarvayogatmike ! sarvanadatmike ! sarvavarnatmike
    ! sarvashabdatmike ! sarvavishvatmike ! sarvadikshatmike ! sarvasarvatmake ! sarvage ! he jaganmatrike
    ! pahi mam, pahi mam, pahi mam ; devi! tubhyam namo, devi! tubhyam namo, devi! tubhyam namah || 7
    || description of shyamala as Omnipresent| iti shrimahakavikalidasapranitam shyamaladandakam sampurnam
    || Futnotes (1) muktamanikyavaidurya-gomedavajra-vidrumau | padmarago marakatam nilashceti yathakramam
    || iti navaratnani || mahapadmashca padmashca shankho makarakacchapau | mukundakundanilashca khashca
    nidhayo nava || iti kuberasya nava nidhayah || (4) the eight Bhairavas are - mahabhairava, shamharabhairava,
    asitangabhairava, ṟurubhairava, khalabhairava, khrodhabhairava, khapalabhairava and ṟudrabhairava|
    (7) Brahmi, mahesvari, khaumari, Vaishnavi, Varahi, indrani and chamundi are the seven mothers (matrika)|
    (8) shiddhas - a type of demi-gods or men vho have acquired supernatural povers|'
  devanagari: '॥ ॐ श्रीश्यामलादेव्यै नमः ॥ महाकविश्रीकालिदासप्रणीतम् ॥ श्यामलादण्डकम् ॥ ध्यानम् - माणिक्यवीणामुपलालयन्तीं
    मदालसां मञ्जुलवाग्विलासाम् । महेन्द्रनीलद्युतिकोमलाङ्गीं मातङ्गकन्यां सततं स्मरामि ॥ १॥ (मनसा स्मरामि)
    ढ्यनम् (ंएदिततिओन्)। चतुर्भुजे चन्द्रकलावतंसे कुचोन्नते कुङ्कमरागशोणे । पुण्ड्रेक्षुपाशाङ्कुशपुष्पबाणहस्ते
    नमस्ते जगदेकमातः ॥ प्रार्थना - माता मरकतश्यामा मातङ्गी मदशालिनी । कटाक्षयतु कल्याणी कदम्बवनवासिनी
    ॥ Pरयेर् - जय मातङ्गतनये जय नीलोत्पलद्युते । जय सङ्गीतरसिके जय लीलाशुकप्रिये ॥ अथ दण्डकम् । (श्यामलायाः
    मुखवर्णना) जय जननि ! सुधासमुद्रान्तहृद्यन्मणिद्वीपसंरूढबिल्वाटवीमध्यकल्प- द्रुमाकल्पकादम्बकान्तारवासप्रिये,
    कृत्तिवासःप्रिये, सर्वलोकप्रिये; डन्दक डेस्च्रिप्तिओन् ओफ़् ष्यमल''स् Fअचे सादरारब्धसङ्गीतसम्भावनासम्भ्रमालोलनीपस्रगाबद्धचूलीसनाथत्रिके,
    सानुमत्पुत्रिके, शेखरीभूतशीतांशुरेखामयूखावलीबद्धसुस्निग्धनीलालकश्रेणिशृङ्गारिते, लोकसम्भाविते, कामलीलाधनुःसन्निभभ्रूलतापुष्पसन्दोहसन्देहकृल्लोचने,
    वाक्सुधासेचने ; चारुगोरोचनापङ्ककेलीललामाभिरामे, सुरामे, रमे, प्रोल्लसद्वालिकामौक्तिकश्रेणिकाचन्द्रिकामण्डलोद्भासिलावण्य-
    गण्डस्थलन्यस्त कस्तूरिकापत्ररेखासमुद्भूतसौरभ्यसम्भ्रान्तभृङ्गाङ्गनागीत- सान्द्रीभवन्मन्द्रतन्त्रीस्वरे,
    सुस्वरे, भास्वरे; (श्यामलायाः शरीरवर्णना) वल्लकीवादनप्रक्रियालोलतालीदलाबद्धताटङ्कभूषाविशेषान्विते,
    सिद्धसम्मानिते, दिव्याहालामदोद्वेलहेलालसच्चक्षुरान्दोलन- श्रीसमाक्षिप्तकर्णैकनीलोत्पले, श्यामले, पूरिताशेषलोकाभिवाञ्छाफले,
    निर्मले, श्रीफले ; स्वेदबिन्दूल्लसत्फाललावण्यनिःष्यन्दसन्दोह- सन्देहकृन्नासिकामौक्तिके, सर्वमन्त्रात्मिके,
    कालिके; मुग्धमन्दस्मितोदारवक्त्रस्फुरत्पूगताम्बूलकर्पूरखण्डोत्करे, ज्ञानमुद्राकरे, सर्वसम्पत्करे,
    पद्मभास्वत्करे, श्रीकरे, कुन्दपुष्पद्युतिस्निग्धदन्तावलीनिर्मलालोलकल्लोल- सम्मेलनस्मेरशोणाधरे, चारुवीणाधरे,
    पक्वबिम्बाधरे ॥ (श्यामलायाः शरीरवर्णना) सुललितनवयौवनारम्भचन्द्रोदयोद्वेललावण्य- दुग्धार्णवाविर्भवत्कम्बुबिब्बोकभृत्कन्धरे,
    सत्कलामन्दिरे, मन्थरे, दिव्यरत्नप्रभाबन्धुरच्छन्नहारादिभूषासमुद्योतमानानवद्याङ्गशोभे, शुभे; रत्नकेयूररश्मिच्छटापल्लवप्रोल्लसद्दोर्लताराजिते,
    योगिभिः पूजिते ; विश्वदिङ्मण्डलव्यापिमाणिक्यतेजःस्फुरत्कङ्कणालङ्कृते, विभ्रमालङ्कृते, साधुभिः सत्कृते
    ; डेस्च्रिप्तिओन् ओफ़् ष्यमल''स् Bओद्य्। वासरारम्भवेलासमुज्जृम्भमाणारविन्दप्रतिद्वन्द्विपाणिद्वये,
    सन्ततोद्यद्दये अद्वये ; दिव्यरत्नोर्मिकादीधितिस्तोमसन्ध्यायमानाङ्गुली- पल्लवोद्यन्नखेन्दुप्रभामण्डले,
    सन्नताखण्डले, चित्प्रभामण्डले, प्रोल्लसत्कुण्डले; तारकाराजिनीकाशहारावलिस्मेरचारु- स्तनाभोगभारानमन्मध्यवल्लीवलिच्छेद-
    वीचीसमुल्लाससन्दर्शिताकारसौन्दर्यरत्नाकरे, वल्लकीभृत्करे, किङ्करश्रीकरे; हेमकुम्भोपमोत्तुङ्गवक्षोजभारावनम्रे
    , त्रिलोकावनम्रे ; लसद्वृत्तगम्भीरनाभीसरस्तीरशैवालशङ्काकरश्यामरोमावलीभूषणे, मञ्जुसम्भाषणे ; चारुशिञ्जत्कटीसूत्रनिर्भर्त्सितानङ्गलीलाधनुःशिञ्जिनीडम्बरे,
    दिव्यरत्नाम्बरे, पद्मरागोल्लसन्मेखलाभास्वरश्रोणिशोभाजितस्वर्णभूभृत्तले, चन्द्रिकाशीतले ॥ (श्यामलायाः
    पादवर्णना) विकसितनवकिंशुकाताम्रदिव्यांशुकच्छन्नचारूरुशोभापराभूत- सिन्दूरशोणायमानेन्द्रमातङ्गहस्तार्गले,
    वैभवानर्गले श्यामले, कोमलस्निग्धनीलोत्पलोत्पादितानङ्गतूणीरशङ्काकरोदारजङ्घालते, चारुलीलागते, नम्रदिक्पालसीमन्तिनीकुन्तलस्निग्धनीलप्रभापुञ्जसञ्जात-
    दूर्वाङ्कुराशङ्कसारङ्गसंयोग- रिङ्खन्नखेन्दूज्ज्वले, प्रोज्ज्वले, निर्मले; डेस्च्रिप्तिओन् ओफ़् ष्यमल''स्
    ळेग्स् अन्द् Fईत्। (श्यामलायाः सभामण्डपवर्णना) प्रह्वदेवेशलक्ष्मीशभूतेशतोयेशवाणीशकीनाशदैत्येशयक्षेशवाय्वग्नि-
    कोटीरमाणिक्यसङ्घृष्टबालातपोद्दामलाक्षारसारुण्यतारुण्यलक्ष्मी- गृहीताङ्घ्रिपद्मे, सुपद्मे, उमे ॥ (श्यामलायाः
    सभामण्डपवर्णना) सुरुचिरनवरत्नपीठस्थिते, सुस्थिते, रक्तपद्मासने, रत्नसिह्मासने शङ्खपद्मद्वयोपाश्रिते,
    विश्रुते तत्र विघ्नेशदुर्गावटुक्षेत्रपालैर्युते, मत्तमातङ्गकन्यासमूहान्विते, मञ्जुलामेनकाद्यङ्गनामानिते,
    भैरवैरष्टभिर्वेष्टिते, देवि ! वामादिभिः शक्तिभिः सेविते; धात्रि ! लक्ष्म्यादिशक्त्यष्टकैः संयुते,
    मातृकामण्डलैर्मण्डिते, यक्षगन्धर्वसिद्धाङ्गनामण्डलैरर्चिते, पञ्चबाणात्मिके, पञ्चबाणेन रत्या च सम्भाविते,
    प्रीतिभाजा वसन्तेन चानन्दिते ॥ भक्तिभाजां परं श्रेयसे कल्पसे, योगिनां मानसे द्योतसे, छन्दसाम् ओजसे
    भ्राजसे ॥ गीतविद्याविनोदातितृष्णेन कृष्णेन सम्पूज्यसे । भक्तिमच्चेतसा वेधसा स्तूयसे । विश्वहृद्येन
    वाद्येन विद्याधरैर्गीयसे ॥ श्रवणहरणदक्षिणक्वाणया वीणया किन्नरैर्गीयसे ॥ यक्षगन्धर्वसिद्धाङ्गनामण्डलैरर्च्यसे
    । सर्वसौभाग्यवाञ्छावतीभिः वधूभिः सुराणां समाराध्यसे ॥ सर्वविद्याविशेषात्मकं चाटुगाथासमुच्चारणं कण्ठमूलोल्लसद्वर्णराजित्रयं
    कोमलश्यामलोदारपक्षद्वयं तुण्डशोभातिदूरीभवत्किंशुकं तं शुकं लालयन्ती परिक्रीडसे ॥ ५ ॥ (श्यामलायाः सर्वैश्वर्यप्रदायकत्ववर्णना)
    पाणिपद्मद्वयेनाक्षमालामपि स्फाटिकीं ज्ञानसारात्मकं पुस्तकं चापरेणाङ्कुशं पाशमाबिभ्रती येन सञ्चिन्त्यसे
    चेतसा तस्य वक्त्रान्तरात् गद्यपद्यात्मिका भारती निस्सरेत् ॥ येन वा यावकाभाकृतिर्भाव्यसे तस्य वश्या
    भवन्ति स्त्रियः पुरुषाः । येन वा शातकुम्भद्युतिर्भाव्यसे सोऽपि लक्ष्मीसहस्रैः परिक्रीडते । किं न सिद्धयेत्
    वपु: श्यामलं कोमलं चन्द्रचूडान्वितं तावकं ध्यायतः । तस्य लीलासरो वारिधिः, तस्य केलीवनं नन्दनम्, तस्य
    भद्रासनं भूतलम्, तस्य गीर्देवता किङ्करी, तस्य चाज्ञाकरी श्रीः स्वयम् ॥ ६ ॥ (श्यामलायाः सर्वात्मकत्ववर्णना)
    सर्वतीर्थात्मिके! सर्वमन्त्रात्मिके ! सर्वतन्त्रात्मिके ! सर्वयन्त्रात्मिके ! सर्वचक्रात्मिके ! सर्वशक्त्यात्मिके
    ! सर्वपीठात्मिके ! सर्वतत्त्वात्मिके ! सर्वविद्यात्मिके ! सर्वयोगात्मिके ! सर्वनादात्मिके ! सर्ववर्णात्मिके
    ! सर्वशब्दात्मिके ! सर्वविश्वात्मिके ! सर्वदीक्षात्मिके ! सर्वसर्वात्मके ! सर्वगे ! हे जगन्मातृके
    ! पाहि मां, पाहि मां, पाहि मां ; देवि! तुभ्यं नमो, देवि! तुभ्यं नमो, देवि! तुभ्यं नमः ॥ ७ ॥ डेस्च्रिप्तिओन्
    ओफ़् ष्यमल अस् Oम्निप्रेसेन्त्। इति श्रीमहाकविकालिदासप्रणीतं श्यामलादण्डकं सम्पूर्णम् ॥ Fऊत्नोतेस्
    (१) मुक्तामाणिक्यवैदूर्य-गोमेदवज्र-विद्रुमौ । पद्मरागो मरकतं नीलश्चेति यथाक्रमम् ॥ इति नवरत्नानि ॥
    महापद्मश्च पद्मश्च शङ्खो मकरकच्छपौ । मुकुन्दकुन्दनीलाश्च खश्च निधयो नव ॥ इति कुबेरस्य नव निधयः ॥ (४)
    ठे एइघ्त् Bहैरवस् अरे - ंअहभैरव, षम्हरभैरव, आसितन्गभैरव, ऱुरुभैरव, ख़लभैरव, ख़्रोधभैरव, ख़पलभैरव अन्द्
    ऱुद्रभैरव। (७) Bरह्मि, ंअहेस्वरि, ख़ौमरि, Vऐश्नवि, Vअरहि, ईन्द्रनि अन्द् छमुन्दि अरे थे सेवेन् मोथेर्स्
    (मातृका)। (८) षिद्धस् - अ त्य्पे ओफ़् देमि-गोद्स् ओर् मेन् व्हो हवे अच्क़ुइरेद् सुपेर्नतुरल् पोवेर्स्।'
