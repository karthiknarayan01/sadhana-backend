id: brahmaproktamvishnustotram
category: stotram
name:
  english: brahmaproktamvishnustotram
  devanagari: ब्रह्मप्रोक्तंविष्णुस्तोत्रम्
content:
  english: brahmaproktam vishnustotram ajeyau samare yattau sahitavamarairapi | mudhastvetau na jananti
    naranarayanavrishi || 12|| tasyahamatmajo brahma sarvasya jagatah patih | vasudevo'rcaniyo vah sarvalokamaheshvarah
    || 13|| tatha manushyo'yamiti kadacitsurasattamah | navajneyo mahaviryah shankhacakragadadharah ||
    14|| etatparamakam guhyametatparamakam padam | etatparamakam brahma etatparamakam yashah || 15|| etadaksharamavyaktametattacchashvatam
    mahat | etatpurushasamjnam vai giyate jnayate na ca || 16|| etatparamakam teja etatparamakam sukham
    | etatparamakam satyam kirtitam vishvakarmana || 17|| tasmatsarvaih suraih sendrairlokaishcamitavikramah
    | navajneyo vasudevo manusho'yamiti prabhuh || 18|| yashca manushamatro'yamiti bruyatsumandadhih |
    hrishikeshamavajnanattamahuh purushadhamam || 19|| yoginam tam mahatmanam pravishtam manushim tanum
    | avamanyedvasudevam tamahustamasam janah || 20|| devam caracaratmanam shrivatsankam suvarcasam |
    padmanabham na janati tamahustamasam janah || 21|| kiritakaustubhadharam mitranamabhayankaram | avajananmahatmanam
    ghore tamasi majjati || 22|| evam viditva tattvartham lokanamishvareshvarah | vasudevo namaskaryah
    sarvalokaih surottamah || 23|| iti mahabharate bhishmaparvani 62 adhyayantargatam brahmaproktam vishnustotram
    sampurnam | mahabharata | bhishmaparva | adhyaya 62
  devanagari: ब्रह्मप्रोक्तं विष्णुस्तोत्रम् अजेयौ समरे यत्तौ सहितावमरैरपि । मूढास्त्वेतौ न जानन्ति नरनारायणावृषी
    ॥ १२॥ तस्याहमात्मजो ब्रह्मा सर्वस्य जगतः पतिः । वासुदेवोऽर्चनीयो वः सर्वलोकमहेश्वरः ॥ १३॥ तथा मनुष्योऽयमिति
    कदाचित्सुरसत्तमाः । नावज्ञेयो महावीर्यः शङ्खचक्रगदाधरः ॥ १४॥ एतत्परमकं गुह्यमेतत्परमकं पदम् । एतत्परमकं
    ब्रह्म एतत्परमकं यशः ॥ १५॥ एतदक्षरमव्यक्तमेतत्तच्छाश्वतं महत् । एतत्पुरुषसंज्ञं वै गीयते ज्ञायते न
    च ॥ १६॥ एतत्परमकं तेज एतत्परमकं सुखम् । एतत्परमकं सत्यं कीर्तितं विश्वकर्मणा ॥ १७॥ तस्मात्सर्वैः सुरैः
    सेन्द्रैर्लोकैश्चामितविक्रमः । नावज्ञेयो वासुदेवो मानुषोऽयमिति प्रभुः ॥ १८॥ यश्च मानुषमात्रोऽयमिति
    ब्रूयात्सुमन्दधीः । हृषीकेशमवज्ञानात्तमाहुः पुरुषाधमम् ॥ १९॥ योगिनं तं महात्मानं प्रविष्टं मानुषीं
    तनुम् । अवमन्येद्वासुदेवं तमाहुस्तामसं जनाः ॥ २०॥ देवं चराचरात्मानं श्रीवत्साङ्कं सुवर्चसम् । पद्मनाभं
    न जानाति तमाहुस्तामसं जनाः ॥ २१॥ किरीटकौस्तुभधरं मित्राणामभयङ्करम् । अवजानन्महात्मानं घोरे तमसि मज्जति
    ॥ २२॥ एवं विदित्वा तत्त्वार्थं लोकानामीश्वरेश्वरः । वासुदेवो नमस्कार्यः सर्वलोकैः सुरोत्तमाः ॥ २३॥
    इति महाभारते भीष्मपर्वणि ६२ अध्यायान्तर्गतं ब्रह्मप्रोक्तं विष्णुस्तोत्रं सम्पूर्णम् । महाभारत । भीष्मपर्व
    । अध्याय ६२
