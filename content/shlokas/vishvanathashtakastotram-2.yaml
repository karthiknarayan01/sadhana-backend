id: vishvanathashtakastotram-2
category: stotram
name:
  english: vishvanathashtakastotram 2
  devanagari: विश्वनाथाष्टकस्तोत्रम् २
content:
  english: shrivishvanathashtakastotram vishveshvaraya bhavaroga vinashakaya gangataranga dhavali kulavasakayam
    | jyotirmayaya shivalinga prakashakaya kashishvaraya satatam pranamami tubhyam || 1|| vishvam prakasha
    satatam sakalam pradaya mokshaika dhama krita dana sada janaya | ananda sindhu vilayaya suvigrahaya
    vishveshvaraya satatam pranamami tubhyam || 2|| varanasipuri nirantara sevitaya gangadharaya shashikhanda
    shushobhitaya | vyaladhiraja nijamaulisuveshthitaya vishveshvaraya satatam pranamami tubhyam || 3||
    shrikashikayam sthita divyalingam prakashate loka hitaya nityam | shrivishvanathastavanama vyapakam
    bhutadhivasam pranamami nityam || 4|| nandyadi mringyadi ganaisusevitam devadimanvadi janaih supujitam
    | anandakandam paramamsumangalam shrivishvanatham pranamaminityam || 5|| kaivalyanirmana sushantidhamadam
    aishvaryamananda sudhapradamprabhum | shrishankaram sarvajanaih suvanditam shrivishvanatham pranamami
    nityam || 6|| nana vilasaih paripurito'pi sadaudasina sadaviragi | tvayaivadattam sakalam susampadam
    bhunjanti loka pranamami tubhyam || 7|| mahasmashanenivasat sadashivah jivasyasthuladi tryamshariram
    | karoti bhasmam svapradattajnanat namamishambhotavapadayugmam || 8|| ityashtakam shankara nama shobhitam
    yeyepathantiha sadadinedine | shrishambhubhakti hridayebhavishyati shrivishvanathasya sudarshananca
    || 9|| iti shri svami umeshvaranandatirthaviracitam shivashtakam sampurnam | jo parameshvara ko pata
    hai vaha apane rupa mem na rahakara prabhu ke rupa mem sama jata hai |
  devanagari: श्रीविश्वनाथाष्टकस्तोत्रम् विश्वेश्वराय भवरोग विनाशकाय गङ्गातरङ्ग धवली कूलवासकायम् । ज्योतिर्मयाय
    शिवलिङ्ग प्रकाशकाय काशीश्वराय सततं प्रणमामि तुभ्यम् ॥ १॥ विश्वं प्रकाश सततं सकलं प्रदाय मोक्षैक धाम
    कृत दान सदा जनाय । आनन्द सिन्धु विलयाय सुविग्रहाय विश्वेश्वराय सततं प्रणमामि तुभ्यम् ॥ २॥ वाराणसीपुरी
    निरन्तर सेविताय गङ्गाधराय शशीखण्ड शुशोभिताय । व्यालाधिराज निजमौलिसुवेष्ठिताय विश्वेश्वराय सततं प्रणमामि
    तुभ्यम् ॥ ३॥ श्रीकाशिकायां स्थित दिव्यलिङ्गं प्रकाशते लोक हिताय नित्यम् । श्रीविश्वनाथस्तवनाम व्यापकं
    भूताधिवासं प्रणमामि नित्यम् ॥ ४॥ नन्द्यादि मृङ्ग्यादि गणैसुसेवितं देवादिमन्वादि जनैः सुपूजितम् । आनन्दकन्दं
    परमंसुमङ्गलं श्रीविश्वनाथं प्रणमामिनित्यम् ॥ ५॥ कैवल्यनिर्माण सुशन्तिधामदं ऐश्वर्यमानन्द सुधाप्रदम्प्रभुम्
    । श्रीशङ्करं सर्वजनैः सुवन्दितं श्रीविश्वनाथं प्रणमामि नित्यम् ॥ ६॥ नाना विलासैः परिपूरितोऽपि सदाउदासीन
    सदाविरागी । त्वयैवदत्तं सकलं सुसम्पदं भुञ्जन्ति लोका प्रणमामि तुभ्यम् ॥ ७॥ महास्मशानेनिवसत् सदाशिवः
    जीवस्यस्थूलादि त्र्यंशरीरम् । करोति भस्मं स्वप्रदत्तज्ञानात् नमामिशम्भोतवपादयुग्मम् ॥ ८॥ इत्याष्टकं
    शङ्कर नाम शोभितं येयेपठन्तीह सदादिनेदिने । श्रीशम्भुभक्ति हृदयेभविष्यति श्रीविश्वनाथस्य सुदर्शनञ्च
    ॥ ९॥ इति श्री स्वामी उमेश्वरानन्दतीर्थविरचितं शिवाष्टकं सम्पूर्णम् । जो परमेश्वर को पाता है वह अपने
    रूप में न रहकर प्रभु के रूप में समा जाता है ।
