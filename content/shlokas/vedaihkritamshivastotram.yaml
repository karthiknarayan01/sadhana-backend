id: vedaihkritamshivastotram
category: stotram
name:
  english: vedaihkritamshivastotram
  devanagari: वेदैःकृतंशिवस्तोत्रम्
content:
  english: vedaih kritam shivastotram rigveda uvaca | yasyantahsthani bhutani yasmatsarvam pravarttate
    | yadahustatparam tattvam sa devah syanmaheshvarah || 1|| yajurveda uvaca | yo yajnairakhilairisho
    yogena ca samarcyate | yamahurishvaram devam sa devah syatpinakadhrik || 2|| samaveda uvaca | yenedam
    bhramyate vishvam yadakashantaram shivam | yogibhirvidyate tattvam mahadevah sa shankarah || 3|| atharvaveda
    uvaca | yam prapashyanti devesham yatanto yatayah param | mahesham purusham rudram sa devo bhagavan
    bhavah || 4|| iti kurmapurane uttarabhage ekatrimshadhyayantargatam vedaih kritam shivastotram samaptam
    | kurmapurane uttarabhage 31
  devanagari: वेदैः कृतं शिवस्तोत्रम् ऋग्वेद उवाच । यस्यान्तःस्थानि भूतानि यस्मात्सर्वं प्रवर्त्तते ।
    यदाहुस्तत्परं तत्त्वं स देवः स्यान्महेश्वरः ॥ १॥ यजुर्वेद उवाच । यो यज्ञैरखिलैरीशो योगेन च समर्च्यते
    । यमाहुरीश्वरं देवं स देवः स्यात्पिनाकधृक् ॥ २॥ सामवेद उवाच । येनेदं भ्राम्यते विश्वं यदाकाशान्तरं
    शिवम् । योगिभिर्विद्यते तत्त्वं महादेवः स शङ्करः ॥ ३॥ अथर्ववेद उवाच । यं प्रपश्यन्ति देवेशं यतन्तो
    यतयः परम् । महेशं पुरुषं रुद्रं स देवो भगवान् भवः ॥ ४॥ इति कूर्मपुराणे उत्तरभागे एकत्रिंशाध्यायान्तर्गतं
    वेदैः कृतं शिवस्तोत्रं समाप्तम् । कूर्मपुराणे उत्तरभागे ३१
