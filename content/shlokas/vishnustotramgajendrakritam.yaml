id: vishnustotramgajendrakritam
category: stotram
name:
  english: vishnustotramgajendrakritam
  devanagari: विष्णुस्तोत्रंगजेन्द्रकृतम्
content:
  english: om namo mulaprakritaye ajitaya mahatmane | anashritaya devaya nihsprihaya namo namah || 1||
    nama adyaya bijaya shivaya ca prashantaya | arsheyaya pravartine nishcalaya yashasvine || 2|| anantaraya
    caikaya sanatanaya purvaya | avyaktaya namo namah puranaya namo namah || 3|| namo guhyaya gudhaya
    gunayagunavartine | atarkyayaprameyaya anantaya namo namah || 4|| namo devatidevaya aprabhaya namo
    namah | namo jagatprasthitaya govindaya namo namah || 5|| namo'stu padmanabhaya sankhyayogodbhavaya
    ca | vishveshvaraya devaya shivaya haraye namah || 6|| namo'stu tasmai devaya nirgunaya gunatmane
    | narayanaya vishvaya devanam paramatmane || 7|| namo namah karanavamanaya narayanayamitavikramaya
    | shrisharngacakrasigadadharaya namo'stu tasmai purushottamaya || 8|| adyaya vedanilayaya mahodaraya
    simhaya daityanidhanaya caturbhujaya | brahmendrarudramunicaranasamstutaya devottamaya varadaya namo'cyutaya
    || 9|| nagendrabhogashayanasanasupriyaya gokshirahemashukanilaghanopamaya | pitambaraya madhukaitabhanashanaya
    vishvaya carumukutaya namo'ksharaya || 10|| bhaktipriyaya varadiptasudarshanaya nabhiprajatakamalasthacaturmukhaya
    | kshirodakarnavaniketayashodhanaya nanavicitramukutangadabhushanaya || 11|| sarveshvaraya varadaya
    namo varaya vishvatmane paramakaranakaranaya | phullaravindavimalayatalocanaya devendradanavaparikshitapaurushaya
    || 12|| yogeshvaraya vijayaya namo varaya | lokayanaya tridashayanaya brahmayanayatmabhavayanaya |
    dharmayanayaikajalayanaya mahavarahaya sada nato'smi || 13|| acintyamavyaktamanantarupam narayanam
    karanamadidevam | yugantashesham purusham puranam tam vasudevam sharanam prapadye || 14|| yogeshvaram
    caruvicitramaulimajneyamaukhyam prakriteh parastham | kshetrajnamatmaprabhavam varenyam tam vasudevam
    sharanam prapadye || 15|| adrishyamacchedyamanadimadhyam maharshayo brahmavidah suresham | vadanti
    yam vai purusham sanatanam tam vasudevam sharanam prapadye || 16|| yadaksharam brahma vadanti sarvagam
    nishamya yam mrityumukhatpramucyate | tamishvaram triptamanopamairgunaih parayanam vishnumupaimi shashvatam
    || 17|| karyam kriyakaranamaprameyam hiranyanabham varapadmanabham | mahabalam vedanidhim surottamam
    vrajami vishnum sharanam janardanam || 18|| vicitrakeyuramaharhanishkam ratnottamalankritasarvagatram
    | pitambaram kancanabhakticitram maladharam keshavamabhyupaimi || 19|| bhavodbhavam vedavidam varishtham
    yogatmanam sankhyavidam varishtham | adityacandrashvivasuprabhavam prabhum prapadye'cyutamatmabhutam
    || 20|| shrivatsankam mahadevam vedaguhyamanuttamam | prapadye sukshmamacalam bhaktanamabhayapradam
    || 21|| prabhavam sarvalokanam nirgunam parameshvaram | prapadye muktasanganam yatinam paramam gatim
    || 22|| bhagavantam suradhyakshamaksharam pushkarekshanam | sharanyam sharanam bhaktya prapadye brahmanapriyam
    || 23|| trivikramam trilokeshamadyamekamanamayam | bhutatmanam mahatmanam prapadye madhusudanam ||
    24|| adidevamajam shambhum vyaktavyaktam janardanam kshetrajnam purusham yajnam trigunatitamavyayam
    | narayanamaniyamsam prapadye parameshvaram || 25|| ekaya lokatrayaya paratah paramatmane | namah
    sahasrashirase anantaya mahatmane || 26|| varenyamanagham devamrishayo vedaparagah | kirtayanti ca
    yam sarve tam prapadye sanatanam || 27|| namaste pundarikaksha bhaktanamabhayaprada | subrahmanya
    namaste'stu trahi mam sharanagatam || 28|| iti vishnudharmeshu saptashashtitamo'dhyayantargatam gajendrakritam
    vishnustotram sampurnam | athava iti vishnudharmottarapurane prathamakhande 194
  devanagari: ॐ नमो मूलप्रकृतये अजिताय महात्मने । अनाश्रिताय देवाय निःस्पृहाय नमो नमः ॥ १॥ नम आद्याय बीजाय
    शिवाय च प्रशान्ताय । आर्षेयाय प्रवर्तिने निश्चलाय यशस्विने ॥ २॥ अनन्तराय चैकाय सनातनाय पूर्वाय । अव्यक्ताय
    नमो नमः पुराणाय नमो नमः ॥ ३॥ नमो गुह्याय गूढाय गुणायागुणवर्तिने । अतर्क्यायाप्रमेयाय अनन्ताय नमो नमः
    ॥ ४॥ नमो देवातिदेवाय अप्रभाय नमो नमः । नमो जगत्प्रस्थिताय गोविन्दाय नमो नमः ॥ ५॥ नमोऽस्तु पद्मनाभाय
    साङ्ख्ययोगोद्भवाय च । विश्वेश्वराय देवाय शिवाय हरये नमः ॥ ६॥ नमोऽस्तु तस्मै देवाय निर्गुणाय गुणात्मने
    । नारायणाय विश्वाय देवानां परमात्मने ॥ ७॥ नमो नमः कारणवामनाय नारायणायामितविक्रमाय । श्रीशार्ङ्गचक्रासिगदाधराय
    नमोऽस्तु तस्मै पुरुषोत्तमाय ॥ ८॥ आद्याय वेदनिलयाय महोदराय सिंहाय दैत्यनिधनाय चतुर्भुजाय । ब्रह्मेन्द्ररुद्रमुनिचारणसंस्तुताय
    देवोत्तमाय वरदाय नमोऽच्युताय ॥ ९॥ नागेन्द्रभोगशयनासनसुप्रियाय गोक्षीरहेमशुकनीलघनोपमाय । पीताम्बराय
    मधुकैटभनाशनाय विश्वाय चारुमुकुटाय नमोऽक्षराय ॥ १०॥ भक्तिप्रियाय वरदीप्तसुदर्शनाय नाभिप्रजातकमलस्थचतुर्मुखाय
    । क्षीरोदकार्णवनिकेतयशोधनाय नानाविचित्रमुकुटाङ्गदभूषणाय ॥ ११॥ सर्वेश्वराय वरदाय नमो वराय विश्वात्मने
    परमकारणकारणाय । फुल्लारविन्दविमलायतलोचनाय देवेन्द्रदानवपरीक्षितपौरुषाय ॥ १२॥ योगेश्वराय विजयाय नमो
    वराय । लोकायनाय त्रिदशायनाय ब्रह्मायनायात्मभवायनाय । धर्मायनायैकजलायनाय महावराहाय सदा नतोऽस्मि ॥ १३॥
    अचिन्त्यमव्यक्तमनन्तरूपं नारायणं कारणमादिदेवम् । युगान्तशेषं पुरुषं पुराणं तं वासुदेवं शरणं प्रपद्ये
    ॥ १४॥ योगेश्वरं चारुविचित्रमौलिमाज्ञेयमौख्यं प्रकृतेः परस्थम् । क्षेत्रज्ञमात्मप्रभवं वरेण्यं तं वासुदेवं
    शरणं प्रपद्ये ॥ १५॥ अदृश्यमच्छेद्यमनादिमध्यं महर्षयो ब्रह्मविदः सुरेशम् । वदन्ति यं वै पुरुषं सनातनं
    तं वासुदेवं शरणं प्रपद्ये ॥ १६॥ यदक्षरं ब्रह्म वदन्ति सर्वगं निशाम्य यं मृत्युमुखात्प्रमुच्यते । तमीश्वरं
    तृप्तमनोपमैर्गुणैः परायणं विष्णुमुपैमि शाश्वतम् ॥ १७॥ कार्यं क्रियाकारणमप्रमेयं हिरण्यनाभं वरपद्मनाभम्
    । महाबलं वेदनिधिं सुरोत्तमं व्रजामि विष्णुं शरणं जनार्दनम् ॥ १८॥ विचित्रकेयूरमहार्हनिष्कं रत्नोत्तमालङ्कृतसर्वगात्रम्
    । पीताम्बरं काञ्चनभक्तिचित्रं मालाधरं केशवमभ्युपैमि ॥ १९॥ भवोद्भवं वेदविदां वरिष्ठं योगात्मानं साङ्ख्यविदां
    वरिष्ठम् । आदित्यचन्द्राश्विवसुप्रभावं प्रभुं प्रपद्येऽच्युतमात्मभूतम् ॥ २०॥ श्रीवत्साङ्कं महादेवं
    वेदगुह्यमनुत्तमम् । प्रपद्ये सूक्ष्ममचलं भक्तानामभयप्रदम् ॥ २१॥ प्रभवं सर्वलोकानां निर्गुणं परमेश्वरम्
    । प्रपद्ये मुक्तसङ्गानां यतीनां परमां गतिम् ॥ २२॥ भगवन्तं सुराध्यक्षमक्षरं पुष्करेक्षणम् । शरण्यं
    शरणं भक्त्या प्रपद्ये ब्राह्मणप्रियम् ॥ २३॥ त्रिविक्रमं त्रिलोकेशमाद्यमेकमनामयम् । भूतात्मानं महात्मानं
    प्रपद्ये मधुसूदनम् ॥ २४॥ आदिदेवमजं शम्भुं व्यक्ताव्यक्तं जनार्दनं क्षेत्रज्ञं पुरुषं यज्ञं त्रिगुणातीतमव्ययम्
    । नारायणमणीयांसं प्रपद्ये परमेश्वरम् ॥ २५॥ एकाय लोकत्रयाय परतः परमात्मने । नमः सहस्रशिरसे अनन्ताय
    महात्मने ॥ २६॥ वरेण्यमनघं देवमृषयो वेदपारगाः । कीर्तयन्ति च यं सर्वे तं प्रपद्ये सनातनम् ॥ २७॥ नमस्ते
    पुण्डरीकाक्ष भक्तानामभयप्रद । सुब्रह्मण्य नमस्तेऽस्तु त्राहि मां शरणागतम् ॥ २८॥ इति विष्णुधर्मेषु
    सप्तषष्टितमोऽध्यायान्तर्गतं गजेन्द्रकृतं विष्णुस्तोत्रं सम्पूर्णम् । अथवा इति विष्णुधर्मोत्तरपुराणे
    प्रथमखण्डे १९४
