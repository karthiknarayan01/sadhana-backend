id: radhapariharastotram
category: stotram
name:
  english: radhapariharastotram
  devanagari: राधापरीहारस्तोत्रम्
content:
  english: ringe satiti ca | viraja darpahantri ca virajatatakanane || 49|| padmavati padmavane krishna
    krishnasarovare | bhadra kunjakutire ca kamya vai kamyake vane || 50|| vaikunthe ca mahalakshmirvani
    narayanorasi | kshirode sindhukanya ca martye lakshmirharipriya || 51|| sarvasvarge svargalakshmirdevaduhkhavinashini
    | sanatani vishnumaya durga shankaravakshasi || 52|| savitri vedamata ca kalaya brahmavakshasi | kalaya
    dharmapatni tvam naranarayanaprabhoh || 53|| kalaya tulasi tvam ca ganga bhuvanapavani | lomakupodbhava
    gopyah kalamsha rohini ratih || 54|| kala kalamsharupa ca shatarupa shaci ditih | aditirdevamata ca
    tvatkalamsha haripriya || 55|| devyashca munipatnyashca tvatkalakalaya shubhe | krishnabhaktim krishnadasyam
    dehi me krishnapujite || 56|| evam kritva pariharam stutva ca kavacam pathet | pura kritam stotrametadbhaktidasyapradam
    shubham || 57|| evam nityam pujayedyo vishnutulyah sa bharate | jivanmuktashca putashca golokam yati
    nishcitam || 58|| karttikipurnimayam ca radham yah pujayecchive | evam kramena pratyabdam rajasuyaphalam
    labhet || 59|| iti shribrahmavaivartte mahapurane dvitiye prakritikhande pancapancashattamadhyayantargatam
    radhapariharastotram samaptam | brahmavaivartapurana | prakritikhanda | adhyaya 55
  devanagari: ृङ्गे सतीति च । विरजा दर्पहन्त्री च विरजातटकानने ॥ ४९॥ पद्मावती पद्मवने कृष्णा कृष्णसरोवरे
    । भद्रा कुञ्जकुटीरे च काम्या वै कम्यके वने ॥ ५०॥ वैकुण्ठे च महालक्ष्मीर्वाणी नारायणोरसि । क्षीरोदे
    सिन्धुकन्या च मर्त्ये लक्ष्मीर्हरिप्रिया ॥ ५१॥ सर्वस्वर्गे स्वर्गलक्ष्मीर्देवदुःखविनाशिनी । सनातनी
    विष्णुमाया दुर्गा शङ्करवक्षसि ॥ ५२॥ सावित्री वेदमाता च कलया ब्रह्मवक्षसि । कलया धर्मपत्नी त्वं नरनारायणप्रभोः
    ॥ ५३॥ कलया तुलसी त्वं च गङ्गा भुवनपावनी । लोमकूपोद्भवा गोप्यः कलांशा रोहिणी रतिः ॥ ५४॥ कला कलांशरूपा
    च शतरूपा शची दितिः । अदितिर्देवमाता च त्वत्कलांशा हरिप्रिया ॥ ५५॥ देव्यश्च मुनिपत्न्यश्च त्वत्कलाकलया
    शुभे । कृष्णभक्तिं कृष्णदास्यं देहि मे कृष्णपूजिते ॥ ५६॥ एवं कृत्वा परीहारं स्तुत्वा च कवचं पठेत्
    । पुरा कृतं स्तोत्रमेतद्भक्तिदास्यप्रदं शुभम् ॥ ५७॥ एवं नित्यं पूजयेद्यो विष्णुतुल्यः स भारते । जीवन्मुक्तश्च
    पूतश्च गोलोकं याति निश्चितम् ॥ ५८॥ कार्त्तिकीपूर्णिमायां च राधां यः पूजयेच्छिवे । एवं क्रमेण प्रत्यब्दं
    राजसूयफलं लभेत् ॥ ५९॥ इति श्रीब्रह्मवैवर्त्ते महापुराणे द्वितीये प्रकृतिखण्डे पञ्चपञ्चाशत्तमाध्यायान्तर्गतं
    राधापरीहारस्तोत्रं समाप्तम् । ब्रह्मवैवर्तपुराण । प्रकृतिखण्ड । अध्याय ५५
