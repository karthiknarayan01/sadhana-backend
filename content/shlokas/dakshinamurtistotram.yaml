id: dakshinamurtistotram
category: stotram
name:
  english: dakshinamurtistotram
  devanagari: दक्षिणामूर्तिस्तोत्रम्
content:
  english: sakshattattvamasiti vedavacasa yo bodhayatyashritan | yatsakshatkaranadbhavenna punaravrittirbhavambhonidhau
    tasmai shrigurumurtaye nama idam shridakshinamurtaye || 3|| nanacchidraghatodarasthitamahadipaprabhabhasvaram
    jnanam yasya tu cakshuradikaranadvara bahih spandate | janamiti tameva bhantamanubhatyetatsamastam
    jagat tasmai shrigurumurtaye nama idam shridakshinamurtaye || 4|| deham pranamapindriyanyapi calam
    buddhim ca shunyam viduh stribalandhajadopamastvahamiti bhranta bhrisham vadinah | mayashaktivilasakalpitamaha
    vyamohasamharine tasmai shrigurumurtaye nama idam shridakshinamurtaye || 5|| rahugrastadivakarendusadrisho
    mayasamacchadanat sanmatrah karanopasamharanato yo'bhutsushuptah puman | pragasvapsamiti prabodhasamaye
    yah pratyabhijnayate tasmai shrigurumurtaye nama idam shridakshinamurtaye || 6|| balyadishvapi jagradadishu
    tatha sarvasvavasthasvapi vyavrittasvanuvartamanamahamityantah sphurantam sada | svatmanam prakatikaroti
    bhajatam yo mudraya bhadraya tasmai shrigurumurtaye nama idam shridakshinamurtaye || 7|| vishvam pashyati
    karyakaranataya svasvamisambandhatah shishyacaryataya tathaiva pitriputradyatmana bhedatah | svapne
    jagrati va ya esha purusho mayaparibhramitah tasmai shrigurumurtaye nama idam shridakshinamurtaye
    || 8|| bhurambhamsyanalo'nilo'mbaramaharnatho himamshuh puman ityabhati caracaratmakamidam yasyaiva
    murtyashtakam | nanyatkincana vidyate vimrishatam yasmatparasmadvibhoh tasmai shrigurumurtaye nama
    idam shridakshinamurtaye || 9|| sarvatmatvamiti sphutikritamidam yasmadamushmin stave tenasya shravanattadarthamananad
  devanagari: साक्षात्तत्त्वमसीति वेदवचसा यो बोधयत्याश्रितान् । यत्साक्षात्करणाद्भवेन्न पुनरावृत्तिर्भवाम्भोनिधौ
    तस्मै श्रीगुरुमूर्तये नम इदं श्रीदक्षिणामूर्तये ॥ ३॥ नानाच्छिद्रघटोदरस्थितमहादीपप्रभाभास्वरं ज्ञानं
    यस्य तु चक्षुरादिकरणद्वारा बहिः स्पन्दते । जानामीति तमेव भान्तमनुभात्येतत्समस्तं जगत् तस्मै श्रीगुरुमूर्तये
    नम इदं श्रीदक्षिणामूर्तये ॥ ४॥ देहं प्राणमपीन्द्रियाण्यपि चलां बुद्धिं च शून्यं विदुः स्त्रीबालान्धजडोपमास्त्वहमिति
    भ्रान्ता भृशं वादिनः । मायाशक्तिविलासकल्पितमहा व्यामोहसंहारिणे तस्मै श्रीगुरुमूर्तये नम इदं श्रीदक्षिणामूर्तये
    ॥ ५॥ राहुग्रस्तदिवाकरेन्दुसदृशो मायासमाच्छादनात् सन्मात्रः करणोपसंहरणतो योऽभूत्सुषुप्तः पुमान् । प्रागस्वाप्समिति
    प्रबोधसमये यः प्रत्यभिज्ञायते तस्मै श्रीगुरुमूर्तये नम इदं श्रीदक्षिणामूर्तये ॥ ६॥ बाल्यादिष्वपि जाग्रदादिषु
    तथा सर्वास्ववस्थास्वपि व्यावृत्तास्वनुवर्तमानमहमित्यन्तः स्फुरन्तं सदा । स्वात्मानं प्रकटीकरोति भजतां
    यो मुद्रया भद्रया तस्मै श्रीगुरुमूर्तये नम इदं श्रीदक्षिणामूर्तये ॥ ७॥ विश्वं पश्यति कार्यकारणतया
    स्वस्वामिसंबन्धतः शिष्याचार्यतया तथैव पितृपुत्राद्यात्मना भेदतः । स्वप्ने जाग्रति वा य एष पुरुषो मायापरिभ्रामितः
    तस्मै श्रीगुरुमूर्तये नम इदं श्रीदक्षिणामूर्तये ॥ ८॥ भूरम्भांस्यनलोऽनिलोऽम्बरमहर्नाथो हिमांशुः पुमान्
    इत्याभाति चराचरात्मकमिदं यस्यैव मूर्त्यष्टकम् । नान्यत्किञ्चन विद्यते विमृशतां यस्मात्परस्माद्विभोः
    तस्मै श्रीगुरुमूर्तये नम इदं श्रीदक्षिणामूर्तये ॥ ९॥ सर्वात्मत्वमिति स्फुटीकृतमिदं यस्मादमुष्मिन्
    स्तवे तेनास्य श्रवणात्तदर्थमननाद्
