id: hetukritamagnistotram
category: stotram
name:
  english: hetukritamagnistotram
  devanagari: हेतुकृतंअग्निस्तोत्रम्
content:
  english: hetukritam agnistotram heturuvaca | na rupam na danam na parokshamasti yasya''tmabhutam ca
    padarthajatam | ashnanti havyani ca yena devah svahapatim yajnabhujam namasye || 15|| mukhabhutam
    ca devanam devanam havyavahanam | hotaram capi devanam devanam dutameva ca || 16|| tam devam sharanam
    yami adidevam vibhavasum | antahsthitah pranarupo bahishcannaprado hi yah | yo yajnasadhanam yami
    sharanam tam dhananjayam || 17|| iti brahmapurane pancavimshadhikashatatamadhyayantargatam hetukritam
    agnistotram samaptam | brahmapurana | adhyaya 125
  devanagari: हेतुकृतं अग्निस्तोत्रम् हेतुरुवाच । न रूपं न दानं न परोक्षमस्ति यस्याऽऽत्मभूतं च पदार्थजातम्
    । अश्नन्ति हव्यानि च येन देवाः स्वाहापतिं यज्ञभुजं नमस्ये ॥ १५॥ मुखभूतं च देवानां देवानां हव्यवाहनम्
    । होतारं चापि देवानां देवानां दूतमेव च ॥ १६॥ तं देवं शरणं यामि आदिदेवं विभावसुम् । अन्तःस्थितः प्राणरूपो
    बहिश्चान्नप्रदो हि यः । यो यज्ञसाधनं यामि शरणं तं धनञ्जयम् ॥ १७॥ इति ब्रह्मपुराणे पञ्चविंशाधिकशततमाध्यायान्तर्गतं
    हेतुकृतं अग्निस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय १२५
