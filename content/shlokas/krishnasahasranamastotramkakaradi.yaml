    | kaustubhodbhasitoraskah kaustubhodbhasitakritih || 294|| kauravanikasamharta kauravarnavakumbhabhuh
    | kaunteyashritapadabjah kaunteyabhayadayakah || 295|| kaunteyaratisamharta kaunteyapratipalakah |
