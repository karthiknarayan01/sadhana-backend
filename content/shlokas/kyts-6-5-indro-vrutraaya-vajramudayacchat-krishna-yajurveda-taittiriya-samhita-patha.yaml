    खल्वा॑हुरे॒ता वा इन्द्र॑स्य॒ पृश्ञ॑यः काम॒दुघा॒ यद्धा॑रियोज॒नीरिति॒ तस्मा द्ब॒ह्वीभिः॑ श्रीणीयादृख्सा॒मे
    वा इन्द्र॑स्य॒ हरी॑ सोम॒पानौ॒ तयोः त्प्र॒हृत्य॑ परि॒धीञ्जु॑होति॒ निरा॑धानाभ्या म्प्र य॑च्छत्युन्ने॒ता
    जु॑होति या॒तया॑मेव॒ ह्ये॑तर् म्पुन॑र्यु॒नक्ति॑ ता॒दृगे॒व तच्छी॒र्॒ष न्न॑धिनि॒धाय॑ जुहोति शीर् द्वि॒क्रम्य॑
    जुहोति वि॒क्रम्य॒ हीन्द्रो॑ वृ॒त्रमह॒न् थ्समृ॑द्ध्यै प॒शवो॒ वै हा॑रियोज॒नीर्य म्प॒शवो॑ भु॒ञ्जन्त॒
    उप॑तिष्ठेर॒न्॒ ऽभु॑ञ्जन्त॒ उप॑ तिष्ठेर॒ ङ्करोति ब॒हव॑ ए॒वैन॑ म्प॒शवो॑ भु॒ञ्जन्त॒ उप॑ तिष्ठन्त उन्ने॒तर्यु॑पह॒व
    मि॑च्छन्ते॒ य ए॒व तत्र॑ सोमपी॒थस्त मे॒वाव॑ रुन्धत उत्तरवे॒द्या न्निव॑पति प॒शवो॒ वा उ॑त्तरवे॒दिः प॒शवो॑
    हारियोज॒नीः प॒शुष्वे॒व प॒शू न्प्रति॑ ष्ठापयन्ति ॥ वा अनु॑ प्र॒जाः प॒शवः॒ प्र जा॑यन्त उपाग् माव॑जा॒वयः॑
    शु॒क्राम॒न्थिनौ॒ पुरु॑षा ऋतुग्र॒हा ङ्गाव॑ आदित्यग्र॒हो भूयि॑ष्ठाभिर् ऋ॒ग्भिर्गृ॑ह्यते॒ तस्मा॒ त्त्रिरु॑पा॒ग्ं॒
    शुग्ं हस्ते॑न विगृ॒ह्णाति॒ तस्मा॒ द्द्वौ त्रीन॒जा ज॒नय॒त्यथाव॑यो॒ भूय॑सीः पि॒ता वा ए॒ष यदा ग्रय॒णः
    पु॒त्रः क॒लशो॒ यदा ङ्क्षि॒त उ॑प॒धाव॑ति ता॒दृगे॒व तद्य द्यथा॑ पु॒त्रः पि॒तर॑ ङ्क्षि॒त उ॑प॒धाव॑ति ता॒दृगे॒व
    तदा॒त्मा वा ए॒ष य॒ज्ञस्य॒ यदा ग्रय॒णो यद्ग्रहो॑ वा क॒लशो॑ वोप॒दस्ये॑ द्गृ॑ह्णीयादा॒त्मन॑ ए॒वाधि॑ य॒ज्ञ
    न्निष्क॑रो॒त्यवि॑ज्ञातो॒ वा ए॒ष गृ॑ह्यते॒ यदा स्स्था॒ल्या गृ॒ह्णाति॑ वाय॒व्ये॑न जुहोति॒ तस्मा॒ गर्भे॒णा
    ऽवि॑ज्ञातेन द्गर्भे॒णा ऽवि॑ज्ञातेन ब्रह्म॒हा ऽव॑भृ॒थमव॑ यन्ति॒ परा द्वा॑य॒व्या॑नि हरन्ति॒ तस्मा॒ त्पुमाग्ं॑
    सग्ं हरन्ति॒ य त्पु॑रो॒रुच॒माह॒ यथा॒ वस्य॑स आ॒हर॑ति ता॒दृगे॒व त ङ्गृ॒ह्णाति॒ यथा॒ वस्य॑स आ॒हृत्य॒
    प्रा थ्सा॒दय॑ति॒ यथा॒ वस्य॑स उपनि॒धाया॑ प॒क्राम॑ति ता॒दृगे॒व त द्य द्वै य॒ज्ञस्य॒ साम्ना॒ यजु॑षा क्रि॒यते॑
    शिथि॒ल म्पु॒रस्ता॑दुपयामा॒ यजु॑षा गृह्यन्त उ॒परि॑ष्टा दुपयामा ऋ॒चा य॒ज्ञस्य॒ धृत्यै दप॒क्राम॑ति ता॒दृगे॒व
    त प्रान्यानि॒ पात्रा॑णि यु॒ज्यन्ते॒ नान्यानि॒ यानि॑ परा॒चीना॑नि प्रयु॒ज्यन्ते॒ ऽमुमे॒व तैर्लो॒कम॒भि
    ज॑यति॒ परा॑ङिव॒ ह्य॑सौ लो॒को यानि॒ पुनः॑ प्रयु॒ज्यन्त॑ इ॒ममे॒व तैर्लो॒कम॒भि ज॑यति॒ पुनः॑पुन लोँ॒कः
    प्रान्यानि॒ पात्रा॑णि यु॒ज्यन्ते॒ नान्यानि॒ यानि॑ परा॒चीना॑नि प्रयु॒ज्यन्ते॒ तान्यन्वोष॑धयः॒ परा॑
    भवन्ति॒ यानि॒ पुनः॑ प्रयु॒ज्यन्ते॒ तान्यन्वोष॑धयः॒ पुन॒रा भ॑वन्ति॒ प्रान्यानि॒ पात्रा॑णि यु॒ज्यन्ते॒
    नान्यानि॒ यानि॑ परा॒चीना॑नि प्रयु॒ज्यन्ते॒ तान्यन्वा॑र॒ण्याः प॒शवो मप॑ यन्ति॒ यानि॒ पुनः॑ प्रयु॒ज्यन्ते॒
    तान्यनु॑ ग्रा॒म्याः प॒शवो॒ ग्राम॑ मु॒पाव॑यन्ति॒ यो वै ग्रहा॑णा यँदु॑पा॒ग्ं॒शु शग्ंस॑ति॒ त ङ्ग्रहा॑णामे॒तद्वै
    ग्रहा॑णा न्भवति॒ यो वै ग्रहा॑णा वेँद॒ प्र प्र॒जया॑ प॒शुभि॑ र॒न्ये ग्रहा॑ गृ॒ह्यन्ते॑ वाय॒व्यै॑ र॒न्य
    ए॒तद्वै ग्रहा॑णा वेँद॒ प्र प्र॒जया॑ प॒शुभि॑ र्जा॑यत॒ इन्द्र॒स्त्वष्टु॒ त्तैर्वै स आ॒त्मन्ना॒रम॑ण म्पु॑रो॒डाशा॒
    निरु॑प्यन्ते॒ तस्मा॑ ङ्कुरुते॒ नैन॒ग्ं॒ सोमो ऽति॑ पवते ब्रह्मवा॒दिनो॑ वदन्ति॒ नर्चा न यजु॑षा प॒ङ्क्ति
    ऽथ॒ किं ँय॒ज्ञस्य॑ पाङ्क्त॒त्वमिति॑ धा॒नाः क॑र॒म्भः प॑रिवा॒पः पु॑रो॒डाशः॑ पय॒स्या॑ तेन॑ प॒ङ्क्ति द्य॒ज्ञस्य॑
    पाङ्क्त॒त्वम् ॥ भ॒व॒न्ति॒ यानि॒ पुनः॒ प्रा॒ण उ॑पाग्ंशु पा॒त्रे णेन्द्रो॑ वृ॒त्रम॑ह॒ ॥ हरिः॑ ओम् ॥
    ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां षष्ठकाण्डे पञ्चमः प्रश्न
