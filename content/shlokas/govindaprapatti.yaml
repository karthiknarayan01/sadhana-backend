id: govindaprapatti
category: stotram
name:
  english: govindaprapatti
  devanagari: गोविन्दप्रपत्ति
content:
  english: cchatrankushaprabhritimangalacihnagarbhau | samsaratapaharane nipunau natanam govindaraja caranau
    sharanam prapadye || 3|| pashyatsu sandrabhayakautukamarbhakeshu praudheshu satsu kritakrityaparayaneshu
    | vidhvamsitordhvashakatavapi balabhave govindaraja caranau sharanam prapadye || 4|| alambya bahuyugalena
    kumarabhave gadham karanguliyugam kila nandapatnyah | abhyasyamanadashacankramanabhiramau govindaraja
    caranau sharanam prapadye || 5|| ghoshanganakarasaroruhatalanada
  devanagari: च्छत्राङ्कुशप्रभृतिमङ्गलचिह्नगर्भौ । संसारतापहरणे निपुणौ नतानां गोविन्दराज चरणौ शरणं प्रपद्ये
    ॥ ३॥ पश्यत्सु सान्द्रभयकौतुकमर्भकेषु प्रौढेषु सत्सु कृतकृत्यपरायणेषु । विध्वंसितोर्ध्वशकटावपि बालभावे
    गोविन्दराज चरणौ शरणं प्रपद्ये ॥ ४॥ आलम्ब्य बाहुयुगलेन कुमारभावे गाढं कराङ्गुलियुगं किल नन्दपत्न्याः
    । अभ्यस्यमानदशचङ्क्रमणाभिरामौ गोविन्दराज चरणौ शरणं प्रपद्ये ॥ ५॥ घोषाङ्गनाकरसरोरुहतालनाद
