id: maha-ganapati-mula-mantra-pada-mala-stotram
category: stotram
name:
  english: Maha Ganapati Mula Mantra Pada Mala Stotram
content:
  english: '|| mulamantram || || om hrim shrim klim glaum gam ganapataye varavarada sarvajanam me vashamanaya
    svaha || || atha stotram|| om ityetadajasya kanthavivaram bhitva bahirnirgatam hyomityeva samastakarma
    rishibhih prarabhyate manushaih | omityeva sada japanti yatayah svatamaikanishthah param hyonkarakritivaktramindunitilam
    vighneshvaram bhavaye || || shrimbijam shramaduhkhajanmamaranavyadhyadhibhinashakam mrityukrodhanashantibinduvilasadvarnakritishripradam
    | svantahsvatmasharasya lakshyamajarasvatmavabodhapradam shrishrinayakasevite bhavadanapremaspadam
    bhavaye || || hrimbijam hridayatrikonavilasanmadhyasanastham sada cakashanalavamalocananishanathardhavarnatmakam
    | mayakaryajagatprakashakamumarupam svashaktipradam mayatitapadapradam hridi bhaje lokeshvararadhitam
    || || klimbijam kalidhatuvatkalayatam sarveshtadam dehinam dhatrikshmayutashantibinduvilasadvarnatmakam
    kamadam | shrikrishnapriyamindirasutamanahprityekahetum param hritpadme kalaye sada kaliharam kalariputrapriyam
    || || glaumbijam gunarupanirgunaparabrahmadishaktermaha hankarakritidandinipriyamajashrinatharudreshtadam
    | sarvakarshinidevarajabhuvanarnendvatmakam shrikaram citte vighnanivaranaya girijajatapriyam bhavaye
    || || gangasutam gandhamukhopacarapriyam khagarohanabhagineyam | gangasutadyam varagandhatattvamulambujastham
    hridi bhavaye''ham || || ganapataye varagunanidhaye suraganapataye natajanatataye | maniganabhushitacaranayugashritamalaharane
    cana te namah || || varabhaye modakamekadantam karambujataih satatam dharantam | varangacandram parabhaktisandrairjanairbhajantam
    kalaye sada''ntah || || varada natajananam santatam vakratunda svaramayanijagatra svatmabodhaikaheto
    | karalasadamritambhopurnapatradya mahyam garagalasuta shighram dehi madbodhamidyam || || sarvajanam
    paripalaya sharvaja parvasudhakaragarvahara | parvatanathasutasuta palaya kharvam ma kuru dinamimam
    || || medo''sthimamsarudhirantramaye sharire medinyabagnimarudambaralasyamane | me darunam madamukhaghamumaja
    hritva medhahvayasanavare vasa dantivaktra || || vasham kuru tvam shivajata mam te vashikritasheshasamastaloka
    | vasarnasamshobhitamulapadmalasacchriya''lintavaranasya || || anayashupadavarijantikam mam nayadigunavarjitam
    tava | hanihinapadajamritasya te panayogyamibhavaktra mam kuru || || svahasvarupena virajase tvam
    sudhashananam priyakarmanidyam | svadhasvarupena tu pitryakarmanyumasutejyamayavishvamurte || || ashtavimshativarnapatralasitam
    haram ganeshapriyam kashta''nishtaharam caturdashapadaih pushpairmanoharakam | tushtyadipradasadguruttamapadambhoje
    cidanandadam shishteshto''hamanantasutrahridaya''''baddham subhaktya''rpaye || || || iti shrianantanandakritam
    shrigurucidanandanathasamarpitam shrimahaganapatimulamantramalastotram ||'
  devanagari: ॥ मूलमन्त्रम् ॥ ॥ ॐ ह्रीं श्रीं क्लीं ग्लौं गं गणपतये वरवरद सर्वजनं मे वशमानय स्वाहा ॥ ॥
    अथ स्तोत्रम्॥ ॐ इत्येतदजस्य कण्ठविवरं भित्वा बहिर्निर्गतं ह्योमित्येव समस्तकर्म ऋषिभिः प्रारभ्यते
    मानुषैः । ओमित्येव सदा जपन्ति यतयः स्वातमैकनिष्ठाः परं ह्योङ्काराकृतिवक्त्रमिन्दुनिटिलं विघ्नेश्वरं
    भवाये ॥ ॥ श्रीम्बीजं श्रमदुःखजन्ममरणव्याध्याधिभीनाशकं मृत्युक्रोधनशान्तिबिन्दुविलसद्वर्णाकृतिश्रीप्रदम्
    । स्वान्तःस्वात्मशरस्य लक्ष्यमजरस्वात्मावबोधप्रदं श्रीश्रीनायकसेविते भवदनप्रेमास्पदं भावये ॥ ॥ ह्रीम्बीजं
    हृदयत्रिकोणविलसन्मध्यासनस्थं सदा चाकाशानलवामलोचननिशानाथार्धवर्णात्मकम् । मायाकार्यजगत्प्रकाशकमुमारूपं
    स्वशक्तिप्रदं मायातीतपदप्रदं हृदि भजे लोकेश्वराराधितम् ॥ ॥ क्लीम्बीजं कलिधातुवत्कलयतां सर्वेष्टदं
    देहिनां धातृक्ष्मायुतशान्तिबिन्दुविलसद्वर्णात्मकं कामदम् । श्रीकृष्णप्रियमिन्दिरासुतमनःप्रीत्येकहेतुं
    परं हृत्पद्मे कलये सदा कलिहरं कालारिपुत्रप्रियम् ॥ ॥ ग्लौम्बीजं गुणरूपनिर्गुणपरब्रह्मादिशक्तेर्महा
    हङ्काराकृतिदण्डिनीप्रियमजश्रीनाथरुद्रेष्टदम् । सर्वाकर्षिणिदेवराजभुवनार्णेन्द्वात्मकं श्रीकरं चित्ते
    विघ्ननिवारणाय गिरिजजातप्रियं भावये ॥ ॥ गङ्गासुतं गन्धमुखोपचारप्रियं खगारोहणभागिनेयम् । गङ्गासुताद्यं
    वरगन्धतत्त्वमूलाम्बुजस्थं हृदि भावयेऽहम् ॥ ॥ गणपतये वरगुणनिधये सुरगणपतये नतजनततये । मणिगणभूषितचरणयुगाश्रितमलहरणे
    चण ते नमः ॥ ॥ वराभये मोदकमेकदन्तं कराम्बुजातैः सततं धरन्तम् । वराङ्गचन्द्रं परभक्तिसान्द्रैर्जनैर्भजन्तं
    कलये सदाऽन्तः ॥ ॥ वरद नतजनानां सन्ततं वक्रतुण्ड स्वरमयनिजगात्र स्वात्मबोधैकहेतो । करलसदमृताम्भोपूर्णपत्राद्य
    मह्यं गरगलसुत शीघ्रं देहि मद्बोधमीड्यम् ॥ ॥ सर्वजनं परिपालय शर्वज पर्वसुधाकरगर्वहर । पर्वतनाथसुतासुत
    पालय खर्वं मा कुरु दीनमिमम् ॥ ॥ मेदोऽस्थिमांसरुधिरान्त्रमये शरीरे मेदिन्यबग्निमरुदम्बरलास्यमाने ।
    मे दारुणं मदमुखाघमुमाज हृत्वा मेधाह्वयासनवरे वस दन्तिवक्त्र ॥ ॥ वशं कुरु त्वं शिवजात मां ते वशीकृताशेषसमस्तलोक
    । वसार्णसंशोभितमूलपद्मलसच्छ्रियाऽलिङ्तवारणास्य ॥ ॥ आनयाशुपदवारिजान्तिकं मां नयादिगुणवर्जितं तव । हानिहीनपदजामृतस्य
    ते पानयोग्यमिभवक्त्र मां कुरु ॥ ॥ स्वाहास्वरूपेण विराजसे त्वं सुधाशनानां प्रियकर्मणीड्यम् । स्वधास्वरूपेण
    तु पित्र्यकर्मण्युमासुतेज्यामयविश्वमूर्ते ॥ ॥ अष्टाविंशतिवर्णपत्रलसितं हारं गणेशप्रियं कष्टाऽनिष्टहरं
    चतुर्दशपदैः पुष्पैर्मनोहारकम् । तुष्ट्यादिप्रदसद्गुरुत्तमपदाम्भोजे चिदानन्ददं शिष्टेष्टोऽहमनन्तसूत्रहृदयाऽऽबद्धं
    सुभक्त्याऽर्पये ॥ ॥ ॥ इति श्रीअनन्तानन्दकृतं श्रीगुरुचिदानन्दनाथसमर्पितं श्रीमहागणपतिमूलमन्त्रमालास्तोत्रम्
    ॥
