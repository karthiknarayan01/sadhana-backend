    ऽथ॒र्वोपो ऽभिषु॑तो ऽपूत॒पा आ॑धू॒यमा॑नो वा॒युः पू॒यमा॑नो मि॒त्रः क्षी॑र॒श्रीर्म॒न्थी स॑क्तु॒श्रीर्वै
    श्वदे॒व उन्नी॑तो रु॒द्र आहु॑तो वा॒युरावृ॑त्तो नृ॒चक्षाः॒ प्रति॑ख्यातो भ॒क्ष आग॑तः पितृ॒णा न्ना॑राश॒ग्ं॒सो
    ऽसु॒रात्त॒ ऽग्ने रुचः॑ स्थ प्र॒जाप॑तेर्धा॒तु स्सोम॑स्य॒र्चे त्वा॑ रु॒चे त्वा द्यु॒ते त्वा॑ भा॒से त्वा॒
    ज्योति॑षे त्वा रोहि॒णी नक्ष॑त्र म्प्र॒जाप॑तिर्दे॒वता॑ मृगशी॒र्॒ष न्नक्ष॑त्र॒ग्ं॒ सोमो॑ दे॒वता॒ ऽऽर्द्रा
    नक्ष॑त्रग्ं रु॒द्रो दे॒वता॒ पुन॑र्वसू॒ नक्ष॑त्र॒मदि॑तिर्दे॒वता॑ म्बृह॒स्पति॑र्दे॒वता ऽऽश्रे॒षा नक्ष॑त्रग्ं
    स॒र्पा दे॒वता॑ म॒घा नक्ष॑त्र म्पि॒तरो॑ दे॒वता॒ फल्गु॑नी॒ नक्ष॑त्र मर्य॒मा दे॒वता॒ फल्गु॑नी॒ नक्ष॑त्र॒
    म्भगो॑ दे॒वता॒ हस्तो॒ नक्ष॑त्रग्ं सवि॒ता दे॒वता॑ चि॒त्रा नक्ष॑त्र॒मिन्द्रो॑ दे॒वता वाँ॒युर्दे॒वता॒
    विशा॑खे॒ नक्ष॑त्रमिन्द्रा॒ग्नी दे॒वता॑ ऽनूरा॒धा नक्ष॑त्र म्मि॒त्रो दे॒वता॑ रोहि॒णी नक्ष॑त्र॒मिन्द्रो॑
    दे॒वता॑ वि॒चृतौ॒ नक्ष॑त्र म्पि॒तरो॑ दे॒वता॑ ऽषा॒ढा नक्ष॑त्र॒मापो॑ दे॒वता॑ ऽषा॒ढा नक्ष॑त्रं॒ विँश्वे॑
    दे॒वा दे॒वता विँष्णु॑र्दे॒वता॒ श्रवि॑ष्ठा॒ नक्ष॑त्रं॒ न्नक्ष॑त्र॒मिन्द्रो॑ दे॒वता प्रोष्ठप॒दा नक्ष॑त्रम॒ज
    एक॑पा प्रोष्ठप॒दा नक्ष॑त्र॒महि॑र्बु॒द्ध्नियो॑ दे॒वता॑ रे॒वती॒ नक्ष॑त्र ऽश्व॒युजौ॒ नक्ष॑त्रम॒श्विनौ॑
    दे॒वता॑ ऽप॒भर॑णी॒र्नक्ष॑त्रं त्ते॑ दे॒वा अद॑धुः ॥ फल्गु॑नी॒ नक्ष॑त्रं॒ स्त्रय॑स्त्रिग्ंशच्च मधु॑श्च॒
    माध॑वश्च॒ वास॑न्तिकावृ॒तू शु॒क्रश्च॒ शुचि॑श्च॒ ग्रैष्मा॑वृ॒तू नभ॑श्च नभ॒स्य॑श्च॒ वार् षि॑कावृ॒तू इ॒षश्चो॒र्जश्च॑
    शार॒दावृ॒तू सह॑श्च सह॒स्य॑श्च॒ हैम॑न्तिकावृ॒तू तप॑श्च तप॒स्य॑श्च शैशि॒रावृ॒तू अ॒ग्नेर॑न्त न्द्यावा॑पृथि॒वी
    कल्प॑न्ता॒माप॒ ओष॑धीः॒ कल्प॑न्ताम॒ग्नयः॒ पृथ॒म्मम॒ ज्यैष्ठ्य॑य॒ सव्र॑ता॒ ऽन्त॒रा द्यावा॑पृथि॒वी शै॑शि॒रावृ॒तू
    अ॒भि कल्प॑माना॒ इन्द्र॑मिव दे॒वा अ॒भि सं यँच्च॒ प्रचे॑ताश्चा॒ग्ने स्सोम॑स्य॒ सूर्य॑स्यो॒ ग्रा च॑ भी॒मा
    च॑ पितृ॒णां यँ॒मस्येन्द्र॑स्य ध्रु॒वा च॑ पृथि॒वी च॑ दे॒वस्य॑ सवि॒तुर्म॒रुतां॒ वँरु॑णस्य ध॒र्त्री च॒
    धरि॑त्री च मि॒त्रावरु॑णयो र्मि॒त्रस्य॑ धा॒तुः प्राची॑ च प्र॒तीची॑ च॒ वसू॑नाग्ं रु॒द्राणा॑ ऽधि॑पतय॒स्तेभ्यो॒
    नम॒स्ते नो॑ मृडयन्तु॒ ते य न्द्वि॒ष्मो यश्च॑ नो॒ द्वेष्टि॒ तं वोँ॒ जम्भे॑ दधामि स॒हस्र॑स्य प्र॒मा
