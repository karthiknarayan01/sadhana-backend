id: narayaniyam-dashaka-49
category: stotram
name:
  english: Narayaniyam Dashaka 49
content:
  english: bhavatprabhavavidura hi gopastaruprapatadikamatra goshthe | ahetumutpataganam vishankya prayatumanyatra
    mano vitenuh || || tatropanandabhidhagopavaryo jagau bhavatpreranayaiva nunam | itah praticyam vipinam
    manojnam vrindavanam nama virajatiti || || brihadvanam tat khalu nandamukhya vidhaya gaushthinamatha
    kshanena | tvadanvitatvajjananinivishtagarishthayananugata viceluh || || anomanojnadhvanidhenupalikhurapranadantarato
    vadhubhih | bhavadvinodalapitaksharani prapiya najnayata margadairghyam || || nirikshya vrindavanamisha
    nandatprasunakundapramukhadrumaugham | amodathah shadvalasandralakshmya harinmanikuttimapushtashobham
    || || navakanirvyudhanivasabhedeshvasheshagopeshu sukhasiteshu | vanashriyam gopakishorapalivimishritah
    paryagalokathastvam || || aralamargagatanirmalapam maralakujakritanarmalapam | nirantarasmerasarojavaktram
    kalindakanyam samalokayastvam || || mayurakekashatalobhaniyam mayukhamalashabalam maninam | virincalokasprishamuccashringairgirim
    ca govardhanamaikshathastvam || || samam tato gopakumarakaistvam samantato yatra vanantamagah | tatastatastam
    kutilamapashyah kalindajam ragavatimivaikam || || tathavidhe'smin vipine pashavye samutsuko vatsaganapracare
    | caran saramo'tha kumarakaistvam samiragehadhipa pahi rogat ||
  devanagari: भवत्प्रभावाविदुरा हि गोपास्तरुप्रपातादिकमत्र गोष्ठे । अहेतुमुत्पातगणं विशङ्क्य प्रयातुमन्यत्र
    मनो वितेनुः ॥ ॥ तत्रोपनन्दाभिधगोपवर्यो जगौ भवत्प्रेरणयैव नूनम् । इतः प्रतीच्यां विपिनं मनोज्ञं वृन्दावनं
    नाम विराजतीति ॥ ॥ बृहद्वनं तत् खलु नन्दमुख्या विधाय गौष्ठीनमथ क्षणेन । त्वदन्वितत्वज्जननीनिविष्टगरिष्ठयानानुगता
    विचेलुः ॥ ॥ अनोमनोज्ञध्वनिधेनुपालीखुरप्रणादान्तरतो वधूभिः । भवद्विनोदालपिताक्षराणि प्रपीय नाज्ञायत
    मार्गदैर्घ्यम् ॥ ॥ निरीक्ष्य वृन्दावनमीश नन्दत्प्रसूनकुन्दप्रमुखद्रुमौघम् । अमोदथाः शाद्वलसान्द्रलक्ष्म्या
    हरिन्मणीकुट्टिमपुष्टशोभम् ॥ ॥ नवाकनिर्व्यूढनिवासभेदेष्वशेषगोपेषु सुखासितेषु । वनश्रियं गोपकिशोरपालीविमिश्रितः
    पर्यगलोकथास्त्वम् ॥ ॥ अरालमार्गागतनिर्मलापां मरालकूजाकृतनर्मलापाम् । निरन्तरस्मेरसरोजवक्त्रां कलिन्दकन्यां
    समलोकयस्त्वम् ॥ ॥ मयूरकेकाशतलोभनीयं मयूखमालाशबलं मणीनाम् । विरिञ्चलोकस्पृशमुच्चशृङ्गैर्गिरिं च गोवर्धनमैक्षथास्त्वम्
    ॥ ॥ समं ततो गोपकुमारकैस्त्वं समन्ततो यत्र वनान्तमागाः । ततस्ततस्तां कुटिलामपश्यः कलिन्दजां रागवतीमिवैकाम्
    ॥ ॥ तथाविधेऽस्मिन् विपिने पशव्ये समुत्सुको वत्सगणप्रचारे । चरन् सरामोऽथ कुमारकैस्त्वं समीरगेहाधिप
    पाहि रोगात् ॥
