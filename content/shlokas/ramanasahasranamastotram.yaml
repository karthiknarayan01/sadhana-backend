id: ramanasahasranamastotram
category: sahasranama
name:
  english: ramanasahasranamastotram
  devanagari: रमणसहस्रनामस्तोत्रम्
content:
  english: kitikishahitankarah || 34|| cittanuvarti cinmudri cinmayashcittanashakah | cirantanashcidakashashcintahinashcidurjitah
    || 35|| coraha coradrik coracapetaghatananditah | chalacchadmavacohinashshatrujicchatrutapanah ||
    36|| channakarashchandasedyanchinnakarmadi bandhanah | chinnadvaidhashchinnamohashchinnahricchinnakalmashah
    || 37|| jagadgururjagatprano jagadisho jagatpriyah | jayantijojanmahino jayado janamohanah || 38||
    jagratsvapnasushuptyadisakshi jadyavinashakah | jativarnabhidashunyo jitatma jitabhutakah || 39||
    jitendriyo jitaprano jitantashshatrusancayah | nama 200 jivabrahmaikyavijjivanmukto jivatvanashakah
    || 40|| jyotirlingamayajyotissamaloshtashmakancanah | jeta jyayajjnanamurtirjnani jnanamahanidhih
    || 41|| jnanajnatrijneyarupatriputibhavanojjhitah | jnatasarvagamo jnanagamyo jnateyasannutah || 42||
    jnanavijnanatriptatma jnanasanchinnasamshayah | jnanagnidagdhakarma ca jnanopayapradarshakah || 43||
    jnanayajnavidhiprito jnanavasthitamanasah | jnata'jnatanyacinmatro jnanavriddhopalalitah || 44|| tattvajnastattvavinneta
    tattvamasyadilakshitah | tattvabhashanasantushtastattvabodhakadeshikah || 45|| tatpadarthaikasamlinastattvanveshana
    tatparah | tapanastapaniyangastamassantapacandramah || 46|| tapasvi tapasaradhyastapah klishtatanudvahah
    | tapastattvarthasarajnastapomurtistapomayah || 47|| tapobalasamakrishtabhaktasanghasamavritah | tapatrayagnisantaptajanasanjivanamritam
    || 48|| tatadeshaptashonadristatarunamaheshvarah | tatantikasamaganta tatanveshanatatparah || 49||
    titikshustirthavittirtham turiyastushtamanasah | nama 250 tulyanindastutistushnimshilastrishnavivarjitah
    || 50|| tejasvityaktavishayastrayibhavarthakovidah | tridiveshamukhopasyastrivargastrigunatmakah ||
    51|| trailokyabudhasampujyastrailokyagrasabrimhitah | trailokyasrishtisthitikrit traigunyavishayojjhitah
    || 52|| traigunyavishavegaghno daksho dagdhavapurdharah | darshaniyo dayamurtirdakshinasyo damanvitah
    || 53|| dandadhrik dandanitistho dakshino dambhavarjitah | daharakashamadhyastha cidakashapratishthitah
    || 54|| dashadikpalasampujyo dashadigvyapisadyashah | dakshinadvipavikhyato dakshinatyakalakavih ||
    55|| daridryadhvamsako danto daritakleshasantatih | dasidasabharo divyo dishtyabuddho digambarah ||
    56|| dirghadarshi dipyamano dinabandhurdrigatmakah | durvigahyo duradharsho duracaranivartakah ||
    57|| drigdrishyabhedadhishunyo darshanam driptakhandakah | devavandyo devatesho doshajno doshanashanah
    || 58|| nama 300 dvadasharnamanudhyeyo dvadashantasthalasthitah | daiviko dravido dvipantaravikhyatavaibhavah
    || 59|| dvitiyatithisambhuto dvaitabhavavimuktadhih | dvaitadvaitamatatito dvaitasantamasapahah ||
    60|| dhanado dharmasukshmajno dharmarat dharmikapriyah | dhata dhatrisamashriko dhatushuddhividhayakah
    || 61|| dharanashaktimandhiro dhurino dhritivarddhanah | dhirodattagunopeto dhyananishtho dhruvasmritih
    || 62|| namajjanoddharanakrinnaravahanasannibhah | navanitasamasvanto natasadhujanashrayah || 63||
    naranariganopeto nagasanukritashramah | namametyavyayayuto navino nashtamanasah || 64|| nayananandado
    namyo namoccaranamuktidah | nagasvamyanujo nagasundarajyeshthatam gatah || 65|| nadabindukalabhijno
    nadabrahmapratishthitah | nadapriyo naradadipujyo namavivarjitah || 66|| nami namajapaprito nastikatvavighatakrit
    | nasagranyastadrin namabrahmatito niranjanah || 67|| niranjanashrayo nityatripto nishshreyasapradah
    | nama 350 niryatnasiddhanitya shrirnityasiddhasvarupadrik || 68|| nirmamo nirahankaro niravadyo nirashrayah
    | nityanando niratanko nishprapanco niramayah || 69|| nirmalo nishcalo nityo nirmoho nirupadhikah
    | nissango nigamastutyo niriho nirupaplavah || 70|| nityashuddho nityabuddho nityamukto nirantarah
    | nirvikaro nirgunatma nishpapo nishparigrahah || 71|| nirbhavo nistulo nighno nijanandaikanirbharah
    | nigrahanugrahasamo nikritijno nidanavit || 72|| nirgrantho nirnamaskaro nistulirnirayapahah | nirvasano
    nirvyasano niryogakshemacintanah || 73|| nirbijadhyanasamvedyo nirvado nishshiroruhah | pancaksharamanudhyeyah
    pancapatakanashanah || 74|| pancaskandhimatabhijnah pancakoshavilakshanah | pancagnividyamargajnah
    pancakrityaparayanah || 75|| nama 400 pancavaktrah pancatapah pancatakaranoddharah | pancopacarasampujyah
    pancabhutavimardanah || 76|| pancavimshatitattvatma mahapancadashaksharah | parasharakulodbhutah panditah
    panditapriyah || 77|| parameshthi pareshanah paripurnah paratparah | paramjyotih paramdhama paramatma
    parayanam || 78|| pativratabhishtadayi paryankasthah pararthavit | pavitrapadah paparih pararthaikaprayojanah
    || 79|| palitirthatatollasi pashcatyadvipavishrutah | pita pitrihitah pittanashakah pitrimocakah ||
    80|| pitrivyanveshita pinah pataleshalayasthitah | punarvasuditah punyah punyakritpurushottamah ||
    81|| punnagataruvatkshetri punyapunyavivarjitah ||| putatma prithukapritah prithudashca purohitah
    || 82|| pratimakritasannidhyah pratigrahaparanmukhah | pramadivatsarodbhutah prakritisthah pramanavit
    || 83|| pratikopastivishayah pratyuttaravicakshanah | nama 450 pratyak prashantah pratyakshah prashritah
    pratibhanavan || 84|| pradakshinapritamanah pravaladrisamashrayah | pracyapraticyadeshiya vibudhagranyavanditah
    || 85|| prasthanabhedasamboddhyah pramshuh prananirodhakah | prasutidinavriddhastri darshitajyotirakritih
    || 86|| prarthitarthapradah prajnah pravarakaniguhitah | pratassmartavyacaritrah praptapraptavyanirvritah
    || 87|| prayanasmritisamprapyah priyahinah priyamvadah | prekshavanpreshyarahitah phalabhutah phalapradah
    || 88|| bahushruto bahumato bahupaki bahupradah | balavanbandhumanbalarupo balyaviceshtitah || 89||
    balabhanupratikasho balasannyasishabditah | brahmacaryatapoyogashrutaprajnasamanvitah || 90|| brahmanyo
    brahmavidbrahma brahmasayujyadayakah | brahmarpitamanobuddhirbrahmanasvaminamakah || 91|| brahmasanasthito
    brahmasutravidbhagavanbhavah | bhayakridbhayasamharta bhavado bhaktabhavitah || 92|| nama 500 bharupo
    bhavanagrahyo bhavajno bhagyavarddhanah | bharatiyamahabhagyam bharatakhyatiposhakah || 93|| bharatodyadjnanadipo
    bhavanabhedakrintanah | bhidashunyo bhidadhvamsi bhavuko bhikshukeshvarah || 94|| bhutido bhutikridbhumi
    nathapurnamshasambhavah | bhaumabrahma bhramadhvamsi bhuhritkshetralakshitah || 95|| bhutibhushitasarvango
    mangalo mangalapradah | manobuddhirahankarah prakritishca parah puman || 96|| mahashaktirmahasiddhirmahodaro
    mahadyutih | mahakarta mahabhokta mahayogi mahamatih || 97|| mahamanyo mahabhago mahasenamahomshajah
    | maryadakrinmahadevo maharupi mahayashah || 98|| mahodyamo mahotsaho mamatagrahapidanah | mahamantro
    mahayantro mahavakyopadeshakah || 99|| mahavakyarthatattvajno mahamohanivarakah | mayavi manado mani
    matrimuktividhayakah || 100|| nama 550 manavamanasamyatma maluradhastapassthitah | madhukadrutalasthayi
    matrimanmatribhaktiman || 101|| matralayapratishthata margito margabandhavah | marganiyo margadarshi
    margashirshakritodayah || 102|| margitatma margashunyo mitabhunmitasancarah | mitasvapnavabodhashca
    mithyabahyanirikshakah || 103|| munirmukto muktidayi medhavi medhyabhojanah | maunavyakhyanakrinmauni
    maunabhashavisharadah || 104|| maunamaunadvayatito maunado maunishu priyah | yajnakridyajnabhugyajno
    yajamano yatharthavit || 105|| yatatma yatisampujyo yatiprapyo yashaskarah | yamadyashtangayogajno
    yajushshakhi yatishvarah || 106|| yavananugrahakaro yaksho yamanishudanah | yatravirahito yana'narudho
    yajnikapriyah || 107|| yatananashano yancahino yacitadayakah | nama 600 yuktakridyuktabhugyukta svapnabodho
    yugadikrit || 108|| yogisho yogapurusho yogatattvavivecakah | yogasano yogabhumi samarohanasadhakah
    || 109|| yogigamyo yogaphalam yogabhrashtashubhapradah | yogaprashamsi yogastho yogakshemadhurandharah
    || 110|| rakshako ramano ramyo ramaniyangasamhatih | rameshakleshasandrishtajyotirakleshadarshanah
    || 111|| rajopaho rajomurti rasiko rasashevadhih | rahasyo ranjano rasyo ratnagarbho rasodayah ||
    112|| rajavidyaguru raja vidyavidrajamanitah | rajasaharanirmukto rajasajnanaduragah || 113|| ragadveshavinirmukto
    rasalashramakokilah | ramabhiramo rajashrih raja rajyahitankarah || 114|| rajabhogaprado rashtrabhashavidrajavallabhah
    | ruditadveshano rudro lakshmivanlakshmivarddhanah || 115|| lajjalurlalito labdhalabdhavyo laghusiddhidah
    | nama 650 layavillabdhakamaugho labhalabhasamashayah || 116|| layadhishthanatattvajno layapurvasamadhiman
    | lasyapriyo lingarupi lingottho lingavarjitah || 117|| lipilekhacano lokashikshako lokarakshakah
    | lokayatamatabhijno lokavartavivarjitah || 118|| lokodasinabhavastho lokottaragunottarah | lokadhyaksho
    lokapujyo lokasaratvabodhakah || 119|| lokakarshanashaktatmashaktimatkantaparvatah | lokanutsadako
    lokapramanam lokasangrahi || 120|| lokabodhaprakashartha shonodyajjnanabhaskarah | varishtho varado
    vakta vangadeshyajanashrayah || 121|| vandarujanamandaro vartamanaikakalavit | vanavasarasabhijno
    valitrayavibhushitah || 122|| vasumanvastutattvajno vandyo vatsataripriyah | varnashramaparitrata
    varnashramamatatigah || 123|| vakyajno vakyakushalo vanmanobuddhyagocarah | vadyagitapriyo vajashrava
    vapipratishthakah || 124|| vahanagaranishthavanvajimedhaphalapradah | vakshodakshinabhagastha hridayasthanadarshakah
    || 125|| nama 700 vacadbhumantrasamsevyo vicaraikopadeshakrit | vicaramatranirato vivekijanatadritah
    || 126|| viditatma vidheyatma vismiteshadivikshitah | virupakshaguhavasi vishvatma vishvabhugvibhuh
    || 127|| viviktasevi vighneshacaityaprakarasamsthitah | vidhyadrishtamahodarshi vijnananandasundarah
    || 128|| vighasashi vishuddhatma viparyasanirasakah | vibhutisitaphaladhyo virodhoktivinakritah ||
    129|| vishvambharo vishvavaidyo vishvasyo vismayanvitah | vinageyo vitamayo viryavanvitasamshayah
    || 130|| vriddhihrasavinabhuto vriddho vrittinirodhakah | vrittido vrittibodheddho venuvadyavashamvadah
    || 131|| vedavedantatattvajno veshadoshaprakashakah | vyaktavyaktasvarupajno vyangyavakyaprayogavit
    || 132|| vyaptakhilo vyavasthakridvyavasayavibodhakah | vaijnanikagranirvaishvanaro vyaghrajinasthitah
    || 133|| sharanyashsharmadashshakti patabuddhashshamanvitah | sharirivadbhasamanashsharmanyajanavanditah
    || 134|| nama 750 shastrajalamaharanya vrithatananishedhakah | shastrabhyasaphalibhuta jnanavijnanatatparah
    || 135|| shastrollanghanavidveshi shastramargavilanghanah | shantatma shantidashshantidhanashshantopadeshakah
    || 136|| shandilyopastilakshyarthashshastrayonih prajapatih | shivankarashshivatamashshishteshtashshishtapujitah
    || 137|| shivaprakashasantushtashshivadvaitapratishthitah | shivagangatadakasthashshivajnanapradayakah
    || 138|| shitacalaprantyapujyashshipratirajanashrayah | shubhashubhaparityagi shubhashubhavimatsarah
    || 139|| shuklakrishnagatijnani shubhamyushshishiratmakah | shukavajjanmasamsiddhashsheshadrisvamivatsalah
    || 140|| shaivavaishnavashaktadi virodhapratirodhakah | sha
  devanagari: किटिकीशहितङ्करः ॥ ३४॥ चित्तानुवर्ती चिन्मुद्री चिन्मयश्चित्तनाशकः । चिरन्तनश्चिदाकाशश्चिन्ताहीनश्चिदूर्जितः
    ॥ ३५॥ चोरहा चोरदृक् चोरचपेटाघातनन्दितः । छलच्छद्मवचोहीनश्शत्रुजिच्छत्रुतापनः ॥ ३६॥ छन्नाकारश्छान्दसेड्यञ्छिन्नकर्मादि
    बन्धनः । छिन्नद्वैधश्छिन्नमोहश्छिन्नहृच्छिन्नकल्मषः ॥ ३७॥ जगद्गुरुर्जगत्प्राणो जगदीशो जगत्प्रियः ।
    जयन्तीजोजन्महीनो जयदो जनमोहनः ॥ ३८॥ जाग्रत्स्वप्नसुषुप्त्यादिसाक्षी जाड्यविनाशकः । जातिवर्णभिदाशून्यो
    जितात्मा जितभूतकः ॥ ३९॥ जितेन्द्रियो जितप्राणो जितान्तश्शत्रुसञ्चयः । नाम २०० जीवब्रह्मैक्यविज्जीवन्मुक्तो
    जीवत्वनाशकः ॥ ४०॥ ज्योतिर्लिङ्गमयज्योतिस्समलोष्टाश्मकाञ्चनः । जेता ज्यायाज्ज्ञानमूर्तिर्ज्ञानी ज्ञानमहानिधिः
    ॥ ४१॥ ज्ञानज्ञातृज्ञेयरूपत्रिपुटीभावनोज्झितः । ज्ञातसर्वागमो ज्ञानगम्यो ज्ञातेयसन्नुतः ॥ ४२॥ ज्ञानविज्ञानतृप्तात्मा
    ज्ञानसञ्छिन्नसंशयः । ज्ञानाग्निदग्धकर्मा च ज्ञानोपायप्रदर्शकः ॥ ४३॥ ज्ञानयज्ञविधिप्रीतो ज्ञानावस्थितमानसः
    । ज्ञाताऽज्ञातान्यचिन्मात्रो ज्ञानवृद्धोपलालितः ॥ ४४॥ तत्त्वज्ञस्तत्त्वविन्नेता तत्त्वमस्यादिलक्षितः
    । तत्त्वभाषणसन्तुष्टस्तत्त्वबोधकदेशिकः ॥ ४५॥ तत्पदार्थैकसंलीनस्तत्त्वान्वेषण तत्परः । तपनस्तपनीयाङ्गस्तमस्सन्तापचन्द्रमाः
    ॥ ४६॥ तपस्वी तापसाराध्यस्तपः क्लिष्टतनूद्वहः । तपस्तत्त्वार्थसारज्ञस्तपोमूर्तिस्तपोमयः ॥ ४७॥ तपोबलसमाकृष्टभक्तसङ्घसमावृतः
    । तापत्रयाग्निसन्तप्तजनसञ्जीवनामृतम् ॥ ४८॥ तातादेशाप्तशोणाद्रिस्तातारुणमहेश्वरः । तातान्तिकसमागन्ता
    तातान्वेषणतत्परः ॥ ४९॥ तितिक्षुस्तीर्थवित्तीर्थं तुरीयस्तुष्टमानसः । नाम २५० तुल्यनिन्दास्तुतिस्तूष्णींशीलस्तृष्णाविवर्जितः
    ॥ ५०॥ तेजस्वीत्यक्तविषयस्त्रयीभावार्थकोविदः । त्रिदिवेशमुखोपास्यस्त्रिवर्गस्त्रिगुणात्मकः ॥ ५१॥ त्रैलोक्यबुधसम्पूज्यस्त्रैलोक्यग्रासबृंहितः
    । त्रैलोक्यसृष्टिस्थितिकृत् त्रैगुण्यविषयोज्झितः ॥ ५२॥ त्रैगुण्यविषवेगघ्नो दक्षो दग्धवपुर्धरः । दर्शनीयो
    दयामूर्तिर्दक्षिणास्यो दमान्वितः ॥ ५३॥ दण्डधृक् दण्डनीतिस्थो दक्षिणो दम्भवर्जितः । दहराकाशमध्यस्थ
    चिदाकाशप्रतिष्ठितः ॥ ५४॥ दशदिक्पालसम्पूज्यो दशदिग्व्यापिसद्यशाः । दक्षिणद्वीपविख्यातो दाक्षिणात्यकलाकविः
    ॥ ५५॥ दारिद्र्यध्वंसको दान्तो दारितक्लेशसन्ततिः । दासीदासभरो दिव्यो दिष्ट्याबुद्धो दिगम्बरः ॥ ५६॥
    दीर्घदर्शी दीप्यमानो दीनबन्धुर्दृगात्मकः । दुर्विगाह्यो दुराधर्षो दुराचारनिवर्तकः ॥ ५७॥ दृग्दृश्यभेदधीशून्यो
    दर्शनं दृप्तखण्डकः । देववन्द्यो देवतेशो दोषज्ञो दोषनाशनः ॥ ५८॥ नाम ३०० द्वादशार्णमनुध्येयो द्वादशान्तस्थलस्थितः
    । दैविको द्राविडो द्वीपान्तरविख्यातवैभवः ॥ ५९॥ द्वितीयातिथिसम्भूतो द्वैतभावविमुक्तधीः । द्वैताद्वैतमतातीतो
    द्वैतसन्तमसापहः ॥ ६०॥ धनदो धर्मसूक्ष्मज्ञो धर्मराट् धार्मिकप्रियः । धाता धातृसमश्रीको धातुशुद्धिविधायकः
    ॥ ६१॥ धारणाशक्तिमान्धीरो धुरीणो धृतिवर्द्धनः । धीरोदात्तगुणोपेतो ध्याननिष्ठो ध्रुवस्मृतिः ॥ ६२॥ नमज्जनोद्धारणकृन्नरवाहनसन्निभः
    । नवनीतसमस्वान्तो नतसाधुजनाश्रयः ॥ ६३॥ नरनारीगणोपेतो नगसानुकृताश्रमः । नममेत्यव्यययुतो नवीनो नष्टमानसः
    ॥ ६४॥ नयनानन्ददो नम्यो नामोच्चारणमुक्तिदः । नागस्वाम्यनुजो नागसुन्दरज्येष्ठतां गतः ॥ ६५॥ नादबिन्दुकलाभिज्ञो
    नादब्रह्मप्रतिष्ठितः । नादप्रियो नारदादिपूज्यो नामविवर्जितः ॥ ६६॥ नामी नामजपप्रीतो नास्तिकत्वविघातकृत्
    । नासाग्रण्यस्तदृङ् नामब्रह्मातीतो निरञ्जनः ॥ ६७॥ निरञ्जनाश्रयो नित्यतृप्तो निश्श्रेयसप्रदः । नाम
    ३५० निर्यत्नसिद्धनित्य श्रीर्नित्यसिद्धस्वरूपदृक् ॥ ६८॥ निर्ममो निरहङ्कारो निरवद्यो निराश्रयः । नित्यानन्दो
    निरातङ्को निष्प्रपञ्चो निरामयः ॥ ६९॥ निर्मलो निश्चलो नित्यो निर्मोहो निरुपाधिकः । निस्सङ्गो निगमस्तुत्यो
    निरीहो निरुपप्लवः ॥ ७०॥ नित्यशुद्धो नित्यबुद्धो नित्यमुक्तो निरन्तरः । निर्विकारो निर्गुणात्मा निष्पापो
    निष्परिग्रहः ॥ ७१॥ निर्भवो निस्तुलो निघ्नो निजानन्दैकनिर्भरः । निग्रहानुग्रहसमो निकृतिज्ञो निदानवित्
    ॥ ७२॥ निर्ग्रन्थो निर्नमस्कारो निस्तुलिर्निरयापहः । निर्वासनो निर्व्यसनो निर्योगक्षेमचिन्तनः ॥ ७३॥
    निर्बीजध्यानसंवेद्यो निर्वादो निश्शिरोरुहः । पञ्चाक्षरमनुध्येयः पञ्चपातकनाशनः ॥ ७४॥ पञ्चस्कन्धीमताभिज्ञः
    पञ्चकोशविलक्षणः । पञ्चाग्निविद्यामार्गज्ञः पञ्चकृत्यपरायणः ॥ ७५॥ नाम ४०० पञ्चवक्त्रः पञ्चतपाः पञ्चताकारणोद्धरः
    । पञ्चोपचारसम्पूज्यः पञ्चभूतविमर्दनः ॥ ७६॥ पञ्चविंशतितत्त्वात्मा महापञ्चदशाक्षरः । पराशरकुलोद्भूतः
    पण्डितः पण्डितप्रियः ॥ ७७॥ परमेष्ठी परेशानः परिपूर्णः परात्परः । परंज्योतिः परंधाम परमात्मा परायणम्
    ॥ ७८॥ पतिव्रताभीष्टदायी पर्यङ्कस्थः परार्थवित् । पवित्रपादः पापारिः परार्थैकप्रयोजनः ॥ ७९॥ पालीतीर्थतटोल्लासी
    पाश्चात्यद्वीपविश्रुतः । पिता पितृहितः पित्तनाशकः पितृमोचकः ॥ ८०॥ पितृव्यान्वेषित पीनः पातालेशालयस्थितः
    । पुनर्वसूदितः पुण्यः पुण्यकृत्पुरुषोत्तमः ॥ ८१॥ पुन्नागतरुवत्क्षेत्री पुण्यापुण्यविवर्जितः ॥। पूतात्मा
    पृथुकप्रीतः पृथुदश्च पुरोहितः ॥ ८२॥ प्रतिमाकृतसान्निध्यः प्रतिग्रहपराङ्मुखः । प्रमादिवत्सरोद्भूतः
    प्रकृतिस्थः प्रमाणवित् ॥ ८३॥ प्रतीकोपास्तिविषयः प्रत्युत्तरविचक्षणः । नाम ४५० प्रत्यक् प्रशान्तः प्रत्यक्षः
    प्रश्रितः प्रतिभानवान् ॥ ८४॥ प्रदक्षिणाप्रीतमनाः प्रवालाद्रिसमाश्रयः । प्राच्यप्रतीच्यदेशीय विबुधाग्रण्यवन्दितः
    ॥ ८५॥ प्रस्थानभेदसम्बोद्ध्यः प्रांशुः प्राणनिरोधकः । प्रसूतिदिनवृद्धस्त्री दर्शितज्योतिराकृतिः ॥ ८६॥
    प्रार्थितार्थप्रदः प्राज्ञः प्रावारकनिगूहितः । प्रातस्स्मर्तव्यचारित्रः प्राप्तप्राप्तव्यनिर्वृतः
    ॥ ८७॥ प्रयाणस्मृतिसम्प्राप्यः प्रियहीनः प्रियंवदः । प्रेक्षावान्प्रेष्यरहितः फलभूतः फलप्रदः ॥ ८८॥
    बहुश्रुतो बहुमतो बहुपाकी बहुप्रदः । बलवान्बन्धुमान्बालरूपो बाल्यविचेष्टितः ॥ ८९॥ बालभानुप्रतीकाशो
    बालसन्न्यासिशब्दितः । ब्रह्मचर्यतपोयोगश्रुतप्रज्ञासमन्वितः ॥ ९०॥ ब्रह्मण्यो ब्रह्मविद्ब्रह्म ब्रह्मसायुज्यदायकः
    । ब्रह्मार्पितमनोबुद्धिर्ब्राह्मणस्वामिनामकः ॥ ९१॥ ब्रह्मासनस्थितो ब्रह्मसूत्रविद्भगवान्भवः । भयकृद्भयसंहर्ता
    भवादो भक्तभावितः ॥ ९२॥ नाम ५०० भारूपो भावनाग्राह्यो भावज्ञो भाग्यवर्द्धनः । भारतीयमहाभाग्यं भारतख्यातिपोषकः
    ॥ ९३॥ भारतोद्यद्ज्ञानदीपो भावनाभेदकृन्तनः । भिदाशून्यो भिदाध्वंसी भावुको भिक्षुकेश्वरः ॥ ९४॥ भूतिदो
    भूतिकृद्भूमि नाथपूर्णांशसम्भवः । भौमब्रह्म भ्रमध्वंसी भूहृत्क्षेत्रलक्षितः ॥ ९५॥ भूतिभूषितसर्वाङ्गो
    मङ्गलो मङ्गलप्रदः । मनोबुद्धिरहङ्कारः प्रकृतिश्च परः पुमान् ॥ ९६॥ महाशक्तिर्महासिद्धिर्महोदारो महाद्युतिः
    । महाकर्ता महाभोक्ता महायोगी महामतिः ॥ ९७॥ महामान्यो महाभागो महासेनमहोंशजः । मर्यादाकृन्महादेवो महारूपी
    महायशाः ॥ ९८॥ महोद्यमो महोत्साहो ममताग्रहपीडनः । महामन्त्रो महायन्त्रो महावाक्योपदेशकः ॥ ९९॥ महावाक्यार्थतत्त्वज्ञो
    महामोहनिवारकः । मायावी मानदो मानी मातृमुक्तिविधायकः ॥ १००॥ नाम ५५० मानावमानसाम्यात्मा मालूराधस्तपस्स्थितः
    । मधूकद्रुतलस्थायी मातृमान्मातृभक्तिमान् ॥ १०१॥ मात्रालयप्रतिष्ठाता मार्गितो मार्गबान्धवः । मार्गणीयो
    मार्गदर्शी मार्गशीर्षकृतोदयः ॥ १०२॥ मार्गितात्मा मार्गशून्यो मितभुङ्मितसञ्चरः । मितस्वप्नावबोधश्च
    मिथ्याबाह्यनिरीक्षकः ॥ १०३॥ मुनिर्मुक्तो मुक्तिदायी मेधावी मेध्यभोजनः । मौनव्याख्यानकृन्मौनी मौनभाषाविशारदः
    ॥ १०४॥ मौनामौनद्वयातीतो मौनदो मौनिषु प्रियः । यज्ञकृद्यज्ञभुग्यज्ञो यजमानो यथार्थवित् ॥ १०५॥ यतात्मा
    यतिसम्पूज्यो यतिप्राप्यो यशस्करः । यमाद्यष्टाङ्गयोगज्ञो यजुश्शाखी यतीश्वरः ॥ १०६॥ यवनानुग्रहकरो यक्षो
    यमनिषूदनः । यात्राविरहितो यानाऽनारूढो याज्ञिकप्रियः ॥ १०७॥ यातनानाशनो याञ्चहीनो याचितदायकः । नाम ६००
    युक्तकृद्युक्तभुग्युक्त स्वप्नबोधो युगादिकृत् ॥ १०८॥ योगीशो योगपुरुषो योगतत्त्वविवेचकः । योगासनो योगभूमि
    समारोहणसाधकः ॥ १०९॥ योगिगम्यो योगफलं योगभ्रष्टशुभप्रदः । योगप्रशंसी योगस्थो योगक्षेमधुरन्धरः ॥ ११०॥
    रक्षको रमणो रम्यो रमणीयाङ्गसंहतिः । रमेशक्लेशसन्दृष्टज्योतिरक्लेशदर्शनः ॥ १११॥ रजोपहो रजोमूर्ती रसिको
    रसशेवधिः । रहस्यो रञ्जनो रस्यो रत्नगर्भो रसोदयः ॥ ११२॥ राजविद्यागुरू राज विद्याविद्राजमानितः । राजसाहारनिर्मुक्तो
    राजसज्ञानदूरगः ॥ ११३॥ रागद्वेषविनिर्मुक्तो रसालाश्रमकोकिलः । रामाभिरामो राजश्रीः राजा राज्यहितङ्करः
    ॥ ११४॥ राजभोगप्रदो राष्ट्रभाषाविद्राजवल्लभः । रुदितद्वेषणो रुद्रो लक्ष्मीवान्लक्ष्मिवर्द्धनः ॥ ११५॥
    लज्जालुर्ललितो लब्धलब्धव्यो लघुसिद्धिदः । नाम ६५० लयविल्लब्धकामौघो लाभालाभसमाशयः ॥ ११६॥ लयाधिष्ठानतत्त्वज्ञो
    लयपूर्वसमाधिमान् । लास्यप्रियो लिङ्गरूपी लिङ्गोत्थो लिङ्गवर्जितः ॥ ११७॥ लिपिलेखचणो लोकशिक्षको लोकरक्षकः
    । लोकायतमताभिज्ञो लोकवार्ताविवर्जितः ॥ ११८॥ लोकोदासीनभावस्थो लोकोत्तरगुणोत्तरः । लोकाध्यक्षो लोकपूज्यो
    लोकासारत्वबोधकः ॥ ११९॥ लोकाकर्षणशक्तात्मशक्तिमत्कान्तपर्वतः । लोकानुत्सादको लोकप्रमाणं लोकसङ्ग्रही
    ॥ १२०॥ लोकबोधप्रकाशार्थ शोणोद्यज्ज्ञानभास्करः । वरिष्ठो वरदो वक्ता वङ्गदेश्यजनाश्रयः ॥ १२१॥ वन्दारुजनमन्दारो
    वर्तमानैककालवित् । वनवासरसाभिज्ञो वलित्रयविभूषितः ॥ १२२॥ वसुमान्वस्तुतत्त्वज्ञो वन्द्यो वत्सतरीप्रियः
    । वर्णाश्रमपरित्राता वर्णाश्रममतातिगः ॥ १२३॥ वाक्यज्ञो वाक्यकुशलो वाङ्मनोबुद्ध्यगोचरः । वाद्यगीतप्रियो
    वाजश्रवा वापीप्रतिष्ठकः ॥ १२४॥ वाहनागारनिष्ठावान्वाजिमेधफलप्रदः । वक्षोदक्षिणभागस्थ हृदयस्थानदर्शकः
    ॥ १२५॥ नाम ७०० वचद्भूमन्त्रसंसेव्यो विचारैकोपदेशकृत् । विचारमात्रनिरतो विवेकिजनतादृतः ॥ १२६॥ विदितात्मा
    विधेयात्मा विस्मितेशादिवीक्षितः । विरूपाक्षगुहावासी विश्वात्मा विश्वभुग्विभुः ॥ १२७॥ विविक्तसेवी विघ्नेशचैत्यप्राकारसंस्थितः
    । विध्यदृष्टमहोदर्शी विज्ञानानन्दसुन्दरः ॥ १२८॥ विघसाशी विशुद्धात्मा विपर्यासनिरासकः । विभूतिसितफालाढ्यो
    विरोधोक्तिविनाकृतः ॥ १२९॥ विश्वम्भरो विश्ववैद्यो विश्वास्यो विस्मयान्वितः । वीणागेयो वीतमायो वीर्यवान्वीतसंशयः
    ॥ १३०॥ वृद्धिह्रासविनाभूतो वृद्धो वृत्तिनिरोधकः । वृत्तिदो वृत्तिबोधेद्धो वेणुवाद्यवशंवदः ॥ १३१॥ वेदवेदान्ततत्त्वज्ञो
    वेषदोषप्रकाशकः । व्यक्ताव्यक्तस्वरूपज्ञो व्यङ्ग्यवाक्यप्रयोगवित् ॥ १३२॥ व्याप्ताखिलो व्यवस्थाकृद्व्यवसायविबोधकः
    । वैज्ञानिकाग्रणीर्वैश्वानरो व्याघ्राजिनस्थितः ॥ १३३॥ शरण्यश्शर्मदश्शक्ति पातबुद्धश्शमान्वितः । शरीरिवद्भासमानश्शर्मण्यजनवन्दितः
    ॥ १३४॥ नाम ७५० शास्त्रजालमहारण्य वृथाटननिषेधकः । शास्त्राभ्यासफलीभूत ज्ञानविज्ञानतत्परः ॥ १३५॥ शास्त्रोल्लङ्घनविद्वेषी
    शास्त्रमार्गाविलङ्घनः । शान्तात्मा शान्तिदश्शान्तिधनश्शान्तोपदेशकः ॥ १३६॥ शाण्डिल्योपास्तिलक्ष्यार्थश्शास्त्रयोनिः
    प्रजापतिः । शिवङ्करश्शिवतमश्शिष्टेष्टश्शिष्टपूजितः ॥ १३७॥ शिवप्रकाशसन्तुष्टश्शिवाद्वैतप्रतिष्ठितः
    । शिवगङ्गातडाकस्थश्शिवज्ञानप्रदायकः ॥ १३८॥ शीताचलप्रान्त्यपूज्यश्शीप्रातीरजनाश्रयः । शुभाशुभपरित्यागी
    शुभाशुभविमत्सरः ॥ १३९॥ शुक्लकृष्णगतिज्ञानी शुभंयुश्शिशिरात्मकः । शुकवज्जन्मसंसिद्धश्शेषाद्रिस्वामिवत्सलः
