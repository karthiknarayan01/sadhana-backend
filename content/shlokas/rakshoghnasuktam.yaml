id: rakshoghnasuktam
category: sukta
name:
  english: rakshoghnasuktam
  devanagari: रक्षोघ्नसूक्तम्
content:
  english: rakshoghna sukta rigvedah mandalam 4 athava 10 kri̱nu̱shva paja̱h prasi̭ti̱m na pri̱thvim ya̱hi
    raje̱vama̭va̱~ ibhḙna | tri̱shvimanu̱ prasi̭tim druna̱no'sta̭si̱ vidhya̭ ra̱kshasa̱stapi̭shthaih
    || 4
  devanagari: रक्षोघ्न सूक्त ऋग्वेदः मण्डलं ४ अथवा १० कृ॒णु॒ष्व पाजः॒ प्रसि॑तिं॒ न पृ॒थ्वीं या॒हि राजे॒वाम॑वा॒ँ
    इभे॑न । तृ॒ष्वीमनु॒ प्रसि॑तिं द्रूणा॒नोऽस्ता॑सि॒ विध्य॑ र॒क्षस॒स्तपि॑ष्ठैः ॥ ४
meaning: {}
