id: mrityunjayastotram-3
category: stotram
name:
  english: mrityunjayastotram 3
  devanagari: मृत्युन्जयस्तोत्रम् ३
content:
  english: devadhideva devesha sarvaprana bhritamvara | praninamasi nathastvam mrityunjaya namo'stu te
    || 8|| dehinam jivabhuto'si jivo jivasya karanam | jagatam rakshakastvam vai mrityunjaya namo'stu
    te || 9|| hemadrishikharakare sudhavicimanohara | pundarikaparam jyotirmutyunjaya namo'stu te || 10||
    dhyanadhara mahajnana sarvajnanaikakarana | paritratasi lokanam mrityunjaya namo'stu te || 11|| nihata
    yena kalena sadevasuramanushah | gandharvapsarasashcaiva siddhavidyadharastatha || 12|| sadhyashca
    vasavo rudrastathashvinisutavubhau | marutashca disho nagahsthavara jangamastatha || 13|| jitah so'pi
    tvaya dhyayan mrityunjaya namo'stu te || 14|| ye dhyayanti param murtim pujayantyamaradayah | na te
    mrityuvasham yanti mrityunjaya namo'stu te || 15|| tvamonkaro'si vedanam devanam ca sadashivah | adharashaktih
    shaktinam mrityunjaya namo'stu te || 16|| sthavare jangame vapi yavattishthati dehagah | jivatyapatyaloko'yam
    mrityunjaya namo'stu te || 17|| somasuryagnimadhyasthavyomavyapin sadashiva | kalatrayamahakala mrityunjaya
    namo'stu te || 18|| prabuddhe caprabuddhe ca tvameva srijase jagat | srishtirupena devesha mrityunjaya
    namo'stu te || 19|| vyomni tvam vyomarupo'si tejah sarvatra tejasi | jnaninam jnanarupo'si mrityunjaya
    namo'stu te || 20|| jagajjivo jagatpranah srashta tvam jagatah prabhuh | karanam sarvatirthanam mrityunjaya
    namo'stu te || 21|| neta tvamindriyanam ca sarvajnanaprabodhakah | samkhyayogashca hamsashca mrityunjaya
    namo'stu te || 22|| rupatitah sarupashca pindasthapadameva ca | caturyugakaladhara mrityunjaya namo'stu
    te || 23|| recake vahnirupo'si somarupo'si purake | kumbhake shivarupo'si mrityunjaya namo'stu te
    || 24|| kshayankaro'si papanam punyanamapi vardhanam | hetustvam shreyasam nityam mrityunjaya namo'stu
    te || 25|| sarvamayakalatita sarvendriya paravara | sarvendriyakaladhisha mrityunjaya namo'stu te
    || 26|| rupam gandho rasah sparshah shabdah samskara eva ca | tvattah prakasha etesham mrityunjaya
    namo'stu te || 27|| caturvidhanam srishtinam hetustvam karaneshvara | bhavabhavaparicchinna mrityunjaya
    namo'stu te || 28|| tvameko nishkalo loke sakalambhuvanatraye | atisukshmatirupastvam mrityunjaya
    namo'stu te || 29|| tvam prabodhastvamadhara tvadbijam bhuvanatrayam | satvam rajastamastvam hi mrityunjaya
    namo'stu te || 30|| tvam somastvam dineshashca tvamatma prakriteh parah | ashtatrimshatvakalanatha
    mrityunjaya namo'stu te || 31|| sarvendriyanamadharah sarvabhutagunashrayah | sarvajnanamayananta
    mrityunjaya namo'stu te || 32|| tvamatma sarvabhutanam gunanam tvamadhishvarah | sarvanandamayadhara
    mrityunjaya namo'stu te || 33|| tvam yajnah sarvayajnanam tvam buddhirboghalakshana | shabdabrahmastvamonkaro
    mrityunjaya namo'stu te || 34|| shrisadashiva uvaca
  devanagari: देवाधिदेव देवेश सर्वप्राण भृतांवर । प्राणिनामसि नाथस्त्वं मृत्युञ्जय नमोऽस्तु ते ॥ ८॥ देहिनां
    जीवभूतोऽसि जीवो जीवस्य कारणम् । जगतां रक्षकस्त्वं वै मृत्युञ्जय नमोऽस्तु ते ॥ ९॥ हेमाद्रिशिखराकारे
    सुधावीचिमनोहर । पुण्डरीकपरं ज्योतिर्मुत्युञ्जय नमोऽस्तु ते ॥ १०॥ ध्यानाधार महाज्ञान सर्वज्ञानैककारण
    । परित्रातासि लोकानां मृत्युञ्जय नमोऽस्तु ते ॥ ११॥ निहता येन कालेन सदेवासुरमानुषाः । गन्धर्वाप्सरसश्चैव
    सिद्धविद्याधरास्तथा ॥ १२॥ साध्याश्च वसवो रुद्रास्तथाश्विनिसुतावुभौ । मरुतश्च दिशो नागाःस्थावरा जङ्गमास्तथा
    ॥ १३॥ जितः सोऽपि त्वया ध्यायन् मृत्युञ्जय नमोऽस्तु ते ॥ १४॥ ये ध्यायन्ति परां मूर्तिं पूजयन्त्यमरादयः
    । न ते मृत्युवशं यान्ति मृत्युञ्जय नमोऽस्तु ते ॥ १५॥ त्वमोङ्कारोऽसि वेदानां देवानां च सदाशिवः । आधारशक्तिः
    शक्तीनां मृत्युञ्जय नमोऽस्तु ते ॥ १६॥ स्थावरे जङ्गमे वापि यावत्तिष्ठति देहगः । जीवत्यपत्यलोकोऽयं मृत्युञ्जय
    नमोऽस्तु ते ॥ १७॥ सोमसूर्याग्निमध्यस्थव्योमव्यापिन् सदाशिव । कालत्रयमहाकाल मृत्युञ्जय नमोऽस्तु ते
    ॥ १८॥ प्रबुद्धे चाप्रबुद्धे च त्वमेव सृजसे जगत् । सृष्टिरूपेण देवेश मृत्युञ्जय नमोऽस्तु ते ॥ १९॥ व्योम्नि
    त्वं व्योमरूपोऽसि तेजः सर्वत्र तेजसि । ज्ञानिनां ज्ञानरूपोऽसि मृत्युञ्जय नमोऽस्तु ते ॥ २०॥ जगज्जीवो
    जगत्प्राणः स्रष्टा त्वं जगतः प्रभुः । कारणं सर्वतीर्थानां मृत्युञ्जय नमोऽस्तु ते ॥ २१॥ नेता त्वमिन्द्रियाणां
    च सर्वज्ञानप्रबोधकः । सांख्ययोगश्च हंसश्च मृत्युञ्जय नमोऽस्तु ते ॥ २२॥ रूपातीतः सरूपश्च पिण्डस्थपदमेव
    च । चतुर्युगकलाधार मृत्युञ्जय नमोऽस्तु ते ॥ २३॥ रेचके वह्निरूपोऽसि सोमरूपोऽसि पूरके । कुम्भके शिवरूपोऽसि
    मृत्युञ्जय नमोऽस्तु ते ॥ २४॥ क्षयङ्करोऽसि पापानां पुण्यानामपि वर्धनम् । हेतुस्त्वं श्रेयसां नित्यं
    मृत्युञ्जय नमोऽस्तु ते ॥ २५॥ सर्वमायाकलातीत सर्वेन्द्रिय परावर । सर्वेन्द्रियकलाधीश मृत्युञ्जय नमोऽस्तु
    ते ॥ २६॥ रूपं गन्धो रसः स्पर्शः शब्दः संस्कार एव च । त्वत्तः प्रकाश एतेषां मृत्युञ्जय नमोऽस्तु ते
    ॥ २७॥ चतुर्विधानां सृष्टीनां हेतुस्त्वं कारणेश्वर । भावाभावपरिच्छिन्न मृत्युञ्जय नमोऽस्तु ते ॥ २८॥
    त्वमेको निष्कलो लोके सकलम्भुवनत्रये । अतिसूक्ष्मातिरूपस्त्वं मृत्युञ्जय नमोऽस्तु ते ॥ २९॥ त्वं प्रबोधस्त्वमाधार
    त्वद्बीजं भुवनत्रयम् । सत्वं रजस्तमस्त्वं हि मृत्युञ्जय नमोऽस्तु ते ॥ ३०॥ त्वं सोमस्त्वं दिनेशश्च
    त्वमात्मा प्रकृतेः परः । अष्टत्रिंशत्वकलानाथ मृत्युञ्जय नमोऽस्तु ते ॥ ३१॥ सर्वेन्द्रियाणामाधारः सर्वभूतगुणाश्रयः
    । सर्वज्ञानमयानन्त मृत्युञ्जय नमोऽस्तु ते ॥ ३२॥ त्वमात्मा सर्वभूतानां गुणानां त्वमधीश्वरः । सर्वानन्दमयाधार
    मृत्युञ्जय नमोऽस्तु ते ॥ ३३॥ त्वं यज्ञः सर्वयज्ञानां त्वं बुद्धिर्बोघलक्षणा । शब्दब्रह्मस्त्वमोङ्कारो
    मृत्युञ्जय नमोऽस्तु ते ॥ ३४॥ श्रीसदाशिव उवाच
