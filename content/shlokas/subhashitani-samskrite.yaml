id: subhashitani-samskrite
category: subhashita
name:
  english: subhashitani samskrite
  devanagari: सुभाषितानि संस्कृते
content:
  english: hinaissaha samagamat | samaishca samatameti vishishtaishca vishishtatam ||56|| kito'pi sumanasangadarohati
    satam shirah | ashmapi yati devatvam mahadbhih supratishthitah ||57|| agnirdevo dvijatinam muninam
    hridi daivatam | pratima svalpabuddhinam devo nasti duratmanam ||58|| dridi prano gude panah samano
    nabhih samsthitah | udanah kanthadeshastho vyanah sarvashariragah ||59|| dadati pratigrihnati guhyamakhyati
    pricchati | bhunkte bhojayate caiva shadvidham mitralakshanam ||60|| nava nava sudrigvilasaih nanutsukah
    kamino yathanudinam | evagmapurvasu kritishu adaravanto hi rasayitarah ||61|| anantashastram bahuveditavyam
    alpashca kalo bahavashca vighnah | yat sarabhutam tadupashritavyam hamso yatha kshiramivambumishram
    ||62|| ekena rajahamsena ya shobha saraso bhavet | na sa bakasahasrena paritah tiravasina ||63|| doshamapi
    gunavati jane drishtya gunaraginobhivandyante | prityaiva shashi nipatitam pashyati lokah kalankamapi
    ||64|| vajradapi kathorani mriduni kusumadapi | lokottaranam cetamsi ko hi vijnatumarhati ||65|| jayanti
    te sukritino rasasiddhah kavishvarah | nasti tesham yashah kaye jaramaranajam bhayam ||66|| arthanasham
    manastapam grihe dushcaritani ca | vancanam cavamananca pancaitan na prakashayet ||67|| puranamitveva
    na sadhu sarvam na capi kavyam navamityavadyam | santah parikshyanyataradbhajante mudhah parapratyayaneya
    buddhih ||68|| prathamavayasi pitam toyamalpam smarantah shirasi nihitabharah narikela naranam | salilamamritakalpam
    dadyurajivitantam na hi kritamupakaram sadhavo visparanti ||69|| uttamam pranipatena shuram bhedena
    yo jayet | nicamalpavadena samashaktim parakramaih ||70|| paravittajigishaya pravrittah pishunastu
    svayameva nashameti | sulabhah shalabhasya kim na dahah prithudipagrasanaya jrimbitasya ||71|| doshakaro'pi
    katilo'pi kalankito'pi mitravasanasamaye vihitoccayo'pi | candrah tathapi haravallabhatamupaiti naivashriteshu
    mahatam gunadoshacinta ||72|| parokshe karyahantaram pratyakshe priyavadinam | varjayet tadrisham
    mitram vishakumbham payomukham ||73|| mahatmano'nugrihnanti bhajamanan ripunapi | sapatnih prapayantyabdhim
    sindhavo naganimnagah ||74|| daridryarogaduhkhani bandhanavyasanani ca | atmaparadhavrikshasya phalanyetani
    dehinam ||75|| gate bhishme hate drone'pyangarajye divangate | asha balavati rajan shalyo jeshyati
    pandavan ||76|| shlokarthena pravakshyami yaduktam granthakotibhih | paropakarah punyaya papaya parapidanam
    ||77|| ayam nijah paro veti ganana laghucetasam | udaracaritanantu vasudhaiva kutumbakam ||78|| annadanam
    mahadanam vidyadanamatahparam | annena kshanika triptih javajjivantu vidyaya ||79|| kaviryadyavadhani
    syat sampadyam dhacatushtayam | dhairyam dhara dhorani ca dharana ca mahojjvala ||80|| vastrena vapusha
    vaca vidyaya vinayena ca | vakaraih pancabhiryukah naro bhavati pujitah ||81|| shateshu jateshu shurah
    sahasreshu ca panditah | data shatasahasreshu vakta bhavati va na va ||82|| shva yatha carvayannasthi
    tatah svamukhashonitam | matva tadiyam ramate tadviyoge ca khidyati||83|| apare kavyasamsare kavireva
    prajapatih | yathasmai rocate vishvam tathedam parikalpyate ||84|| sahasraduhkhani sahanti dhirah
    catvari duhkhanyatidussahani | krishishca nashta grihini ca dushta putro'pyavidvan udare vyatha ca
    ||85|| sati rakto naro yati sadbhavam hyekanishthaya | kitako bhramaram dhyayan bhramaratvaya kalpate
    ||86|| atyambupanadatimaithunacca divasvapat jagaranacca ratrau | vidharanat mutrapurishanacca shadbhih
    manushyaih prabhavanti rogah ||87|| bharyahinam grihasthasya shunyameva griham bhavet | na griham
    grihamityahuh grihini grihamucyate ||88|| kupitanca mahipalam kunjaranca madalasam | atidure parityajya
    vamananti manishinah ||89|| adhikaranca garbhanca rinanca shvanabandhanam | praveshe sukhamapnoti
    nirgame pranasankatah ||90|| adhva jara manushyanam anadhva vajinam jara | amaithunam jara strinam
    ashvanam maithunam jara ||91|| vagvadamarthasambandham parokshe darabhashanam | yatra mitratvamicchanti
    tatra trini nakarayet ||92|| kubhojanam krodhamukhi ca bharya kugramavasah kujanasya seva | alpa ca
    vidya vidhava ca kanya vinagnina shat pradahanti kayam ||93|| citi cinta dvayormadhye cinta nama gariyasi
    | citirdahati nirjivam cinta pranayutam vapuh ||94|| akritva parasantapam agatva khalamandiram | akleshayitva
    catmanam yadalpamapi tadbahu ||95|| aticaturakaveh srishtih apyujjhitorvi prapya vyomnantaralam |
    punarapi sahasa vindate purvamurvim || 96|| naratvam durlabham loke vidya tatra sudurlabha kavitvam
    durlabham tatra shaktistatra sudurlabha | asminnativicitrakaviparampara vahini samsare dvitrah pancasha
    va mahakavaya iti ganyante ||97|| garbhe vyadhau shmashane ca purane ya matirbhavet | sa yadi sthiratam
    yati ko na mucyeta bandhanat ||98|| atmabuddhih sukhancaiva gurubuddhirvisheshatah | parabuddhirvinashaya
    stribuddhih pralayantakah ||99|| eko'pi gunavan putrah nirgunena shatairapi | ekashcandrah tamo hanti
    nakshatraih kim prayojanam ||100|| pita ca rinavan shatruh mata ca vyabhicarini | bharya rupavati
    shatruh putrah shatrurapanditah ||101|| dasi bhrityah suto bandhuh vastu vahanameva ca | dhanadanyasamriddhishca
    ashtaishvaryah prakirtitah ||102|| datritvam priyavaktritvam dhiratvamucitajnata | abhyasena na labhyante
    catvarah sahajah gunah ||103|| ankolam nijabijasantatimayaskanto palam sucika sadhvi naijavibhum lata
    kshituruham sindhusaridvallabham | prapnotiha yatha tatha pashupateh padaravindadvayam ceto vrittirupetya
    tishthati sada sa bhaktirityucyate ||104|| na nirmito vai na ca drishtapurvo na shruyate hemayah kurangah
    | tatha'pi trishna raghunandanasya vinashakale viparitabuddhih ||105|| atiparicayadavajnata syat santatagamanadanadaro
    bhavati | malaye bhillapurandhri candanatarumindhanam kurute ||106|| vidvaneva vijanati vidvajjanaparishramam
    | na hi vandhya vijanati gurvim prasavavedanam ||107|| mitam dadati pitarah mitam bhrata dadati ca
    | amitasya hi dataram bhartaram ka na pujayet ||108|| yasya shashti caturthi syat vihasya ca vihaya
    ca | aham katham dvitiya syat ditiyasyamaham katham ||109|| siddhamannam phalam pakvam nari prathamayauvanam
    | kalakshepam na kartavyam alasyadamritam visham ||110|| raja rakshasashcaiva shardulah tatra mantrinah
    | gridhrashca sevakassarve yatha raja tatha praja ||111|| vedamulamidam jnanam bharyamulamidam griham
    | krishimulamidam dhanyam dhanamulamidam jagat ||112|| rajni dharmini dharmishthah pape paparatassada
    | rajanamanuvartante yatha raja tatha praja ||113|| atirupat hrita sita atidarpacca ravanah | atidanat
    balirbaddhah ati sarvatra varjayet ||114|| kshate praharah nipatantyanekam dhanakshaye vardhati jatharagnih
    | apatsu vairani samudbhavanti chidreshvanarthah bahudha bhavanti ||115|| matasamam nasti shariraposhanam
    vidyasamam nasti sharirabhushanam | bharyasamam nasti shariratoshanam cintasamam nasti sharirashoshanam
    ||116|| kshane tushtah kshane rushtah vitushtishca kshane kshane | avyavasthitacittasya prasado'pi
    bhayankarah ||117|| anubhavati hi murdhna padapaih tivramushnam | shamayati paritapam chayaya samshritanam
    ||118|| anabhyase visham shastram ajirne bhojanam visham | daridrasya visham goshthi vriddhasya taruni
    visham ||119|| alpajnah pujyate visheshajnah vivarjite | deshe vrikshavina bhute hyerando hi vanaspati
    ||120|| nirastapadape deshe hirando'pi drumayate | sali dendrasabhamadhye satanih panditottamah ||121||
    ajavat bhojanam kuryat gajavat snanamacaret | shukavat bhashanam kuryat bakavat dhyanamacaret ||122||
    balasakhitvamakaranahasyam strivivado'sajjanaseva | gardabhayanamasamskritavani shatsu naro laghutamupayati
    ||123|| mantre tirthe dvije daive daivajne bheshaje gurau | yadrishi bhavana yatra siddhirbhavati
    tadrishi ||124|| ashvasya lakshanam vegah mado matangalakshanam | caturyam lakshanam strinamudyogam
    purushalakshanam ||125|| kshanashah kanashashcaiva vidyamartham ca sadhayet | kshanatyage kuto vidya
  devanagari: हीनैस्सह समागमात् । समैश्च समतामेति विशिष्टैश्च विशिष्टताम् ॥५६॥ कीटोऽपि सुमनसङ्गदारोहति
    सतां शिरः । अश्मापि याति देवत्वं महद्भिः सुप्रतिष्ठितः ॥५७॥ अग्निर्देवो द्विजातीनां मुनीनां हृदि दैवतम्
    । प्रतिमा स्वल्पबुद्धीनां देवो नास्ति दुरात्मनाम् ॥५८॥ दृदि प्राणो गुदे पानः समानो नाभिः संस्थितः
    । उदानः कण्ठदेशस्थो व्यानः सर्वशरीरगः ॥५९॥ ददाति प्रतिगृह्णाति गुह्यमाख्याति पृच्छति । भुङ्क्ते भोजयते
    चैव षड्विधं मित्रलक्षणम् ॥६०॥ नव नव सुदृग्विलासैः ननूत्सुकाः कामिनो यथानुदिनम् । एवग्मपूर्वासु कृतिषु
    आदरवन्तो हि रसायितारः ॥६१॥ अनन्तशास्त्रं बहुवेदितव्यम् अल्पश्च कालो बहवश्च विघ्नाः । यत् सारभूतं तदुपाश्रितव्यं
    हंसो यथा क्षीरमिवाम्बुमिश्रम् ॥६२॥ एकेन राजहंसेन या शोभा सरसो भवेत् । न सा बकसहस्रेण परितः तीरवासिना
    ॥६३॥ दोषमपि गुणवति जने दृष्ट्या गुणरागिणोभिवन्द्यन्ते । प्रीत्यैव शशि निपतितं पश्यति लोकः कलङ्कमपि
    ॥६४॥ वज्रादपि कठोराणि मृदूनि कुसुमादपि । लोकोत्तराणां चेतांसि को हि विज्ञातुमर्हति ॥६५॥ जयन्ति ते
    सुकृतिनो रससिद्धाः कवीश्वराः । नास्ति तेषां यशः काये जरामरणजं भयम् ॥६६॥ अर्थनाशं मनस्तापं गृहे दुश्चरितानि
    च । वञ्चनं चावमानञ्च पञ्चैतान् न प्रकाशयेत् ॥६७॥ पुराणमित्वेव न साधु सर्वं न चापि काव्यं नवमित्यवद्यम्
    । सन्तः परीक्ष्यान्यतरद्भजन्ते मूढः परप्रत्ययनेय बुद्धिः ॥६८॥ प्रथमवयसि पीतं तोयमल्पं स्मरन्तः शिरसि
    निहितभाराः नारिकेला नराणाम् । सलिलममृतकल्पं दद्युराजीवितान्तं न हि कृतमुपकारं साधवो विस्परन्ति ॥६९॥
    उत्तमं प्रणिपातेन शूरं भेदेन यो जयेत् । नीचमल्पवादेन समशक्तिं पराक्रमैः ॥७०॥ परवित्तजिगीषया प्रवृत्तः
    पिशुनस्तु स्वयमेव नाशमेति । सुलभः शलभस्य किं न दाहः पृथुदीपग्रसनाय जृम्बितस्य ॥७१॥ दोषाकरोऽपि कटिलोऽपि
    कलङ्कितोऽपि मित्रावसनसमये विहितोच्चयोऽपि । चन्द्रः तथापि हरवल्लभतामुपैति नैवाश्रितेषु महतां गुणदोषचिन्ता
    ॥७२॥ परोक्षे कार्यहन्तारं प्रत्यक्षे प्रियवादिनम् । वर्जयेत् तादृशं मित्रं विषकुम्भं पयोमुखम् ॥७३॥
    महात्मनोऽनुगृह्णन्ति भजमानान् रिपूनपि । सपत्नीः प्रापयन्त्यब्धिं सिन्धवो नगनिम्नगाः ॥७४॥ दारिद्र्यरोगदुःखानि
    बन्धनव्यसनानि च । आत्मापराधवृक्षस्य फलान्येतानि देहिनाम् ॥७५॥ गते भीष्मे हते द्रोणेऽप्यङ्गराज्ये दिवङ्गते
    । आशा बलवती राजन् शल्यो जेष्यति पाण्डवान् ॥७६॥ श्लोकार्थेन प्रवक्ष्यामि यदुक्तं ग्रन्थकोटिभिः । परोपकारः
    पुण्याय पापाय परपीडनम् ॥७७॥ अयं निजः परो वेति गणना लघुचेतसाम् । उदारचरितानान्तु वसुधैव कुटुम्बकम्
    ॥७८॥ अन्नदानं महादानं विद्यादानमतःपरम् । अन्नेन क्षणिका तृप्तिः जावज्जीवन्तु विद्यया ॥७९॥ कविर्यद्यवधानी
    स्यात् सम्पाद्यं धचतुष्टयम् । धैर्यं धारा धोरणी च धारणा च महोज्ज्वला ॥८०॥ वस्त्रेण वपुषा वाचा विद्यया
    विनयेन च । वकारैः पञ्चभिर्युकः नरो भवति पूजितः ॥८१॥ शतेषु जातेषु शूरः सहस्रेषु च पण्डितः । दाता शतसहस्रेषु
    वक्ता भवति वा न वा ॥८२॥ श्वा यथा चर्वयन्नस्थि ततः स्वमुखशोणितम् । मत्वा तदीयं रमते तद्वियोगे च खिद्यति॥८३॥
    अपारे काव्यसंसारे कविरेव प्रजापतिः । यथास्मै रोचते विश्वं तथेदं परिकल्प्यते ॥८४॥ सहस्रदुःखानि सहन्ति
    धीराः चत्वारि दुःखान्यतिदुस्सहानि । कृषिश्च नष्टा गृहिणी च दुष्टा पुत्रोऽप्यविद्वान् उदरे व्यथा च
    ॥८५॥ सति रक्तो नरो याति सद्भावं ह्येकनिष्ठया । कीटको भ्रमरं ध्यायन् भ्रमरत्वय कल्पते ॥८६॥ अत्यम्बुपानादतिमैथुनाच्च
    दिवास्वपात् जागरणाच्च रात्रौ । विधारणात् मूत्रपुरीषणाच्च षड्भिः मनुष्यैः प्रभवन्ति रोगाः ॥८७॥ भार्याहीनं
    गृहस्थस्य शून्यमेव गृहं भवेत् । न गृहं गृहमित्याहुः गृहिणि गृहमुच्यते ॥८८॥ कुपितञ्च महीपालं कुञ्जरञ्च
    मदालसम् । अतिदूरे परित्यज्य वामनन्ति मनीषिणः ॥८९॥ अधिकारञ्च गर्भञ्च ऋणञ्च श्वानबन्धनम् । प्रवेशे सुखमाप्नोति
    निर्गमे प्राणसङ्कटः ॥९०॥ अध्वा जरा मनुष्याणाम् अनध्वा वाजिनां जरा । अमैथुनं जरा स्त्रीणाम् अश्वानां
    मैथुनं जरा ॥९१॥ वाग्वादमर्थसंबन्धं परोक्षे दारभाषणम् । यत्र मित्रत्वमिच्छन्ति तत्र त्रीणि नकारयेत्
    ॥९२॥ कुभोजनं क्रोधमुखी च भार्या कुग्रामवासः कुजनस्य सेवा । अल्पा च विद्या विधवा च कन्या विनाग्निना
    षट् प्रदहन्ति कायम् ॥९३॥ चिति चिन्ता द्वयोर्मध्ये चिन्ता नाम गरीयसी । चितिर्दहति निर्जीवं चिन्ता प्राणयुतं
    वपुः ॥९४॥ अकृत्वा परसन्तापम् अगत्वा खलमन्दिरम् । अक्लेशयित्वा चात्मानं यदल्पमपि तद्बहु ॥९५॥ अतिचतुरकवेः
    सृष्टिः अप्युज्झितोर्वी प्राप्य व्योम्नान्तरालम् । पुनरपि सहसा विन्दते पुर्वमुर्वीम् ॥ ९६॥ नरत्वं
    दुर्लभं लोके विद्या तत्र सुदुर्लभा कवित्वं दुर्लभं तत्र शक्तिस्तत्र सुदुर्लभा । अस्मिन्नतिविचित्रकविपरम्परा
    वाहिनि संसारे द्वित्राः पञ्चषा वा महाकवय इति गण्यन्ते ॥९७॥ गर्भे व्याधौ श्मशाने च पुराणे या मतिर्भवेत्
    । सा यदि स्थिरतां याति को न मुच्येत बन्धनात् ॥९८॥ आत्मबुद्धिः सुखञ्चैव गुरुबुद्धिर्विशेषतः । परबुद्धिर्विनाशाय
    स्त्रीबुद्धिः प्रलयान्तकः ॥९९॥ एकोऽपि गुणवान् पुत्रः निर्गुणेन शतैरपि । एकश्चन्द्रः तमो हन्ति नक्षत्रैः
    किं प्रयोजनम् ॥१००॥ पिता च ऋणवान् शत्रुः माता च व्यभिचारिणी । भार्या रूपवती शत्रुः पुत्रः शत्रुरपण्डितः
    ॥१०१॥ दासी भृत्यः सुतो बन्धुः वस्तु वाहनमेव च । धनदान्यसमृद्धिश्च अष्टैश्वर्याः प्रकीर्तिताः ॥१०२॥
    दातृत्वं प्रियवक्तृत्वं धीरत्वमुचितज्ञता । अभ्यासेन न लभ्यन्ते चत्वारः सहजाः गुणाः ॥१०३॥ अङ्कोलं निजबीजसन्ततिमयस्कान्तो
    पलं सूचिका साध्वी नैजविभुं लता क्षितुरुहं सिन्धुसरिद्वल्लभम् । प्राप्नोतीह यथा तथा पशुपतेः पादारविन्दद्वयं
    चेतो वृत्तिरुपेत्य तिष्ठति सदा सा भक्तिरित्युच्यते ॥१०४॥ न निर्मितो वै न च दृष्टपूर्वो न श्रूयते हेमयः
    कुरङ्गः । तथाऽपि तृष्णा रघुनन्दनस्य विनाशकाले विपरीतबुद्धिः ॥१०५॥ अतिपरिचयादवज्ञता स्यात् सन्ततगमनादनादरो
    भवति । मलये भिल्लपुरन्ध्री चन्दनतरुमिन्धनं कुरुते ॥१०६॥ विद्वानेव विजानाति विद्वज्जनपरिश्रमम् । न
    हि वन्ध्या विजानाति गुर्वीं प्रसववेदनाम् ॥१०७॥ मितं ददाति पितरः मितं भ्राता ददाति च । अमितस्य हि दातारं
    भर्तारं का न पूजयेत् ॥१०८॥ यस्य षष्टी चतुर्थी स्यात् विहस्य च विहाय च । अहं कथं द्वितीया स्यात् दितीयास्यामहं
    कथम् ॥१०९॥ सिद्धमन्नं फलं पक्वं नारी प्रथमयौवनम् । कालक्षेपं न कर्तव्यम् आलस्यादमृतं विषम् ॥११०॥ राजा
    राक्षसश्चैव शार्दूलाः तत्र मन्त्रिणः । गृध्राश्च सेवकास्सर्वे यथा राजा तथा प्रजा ॥१११॥ वेदमूलमिदं
    ज्ञानं भार्यामूलमिदं गृहम् । कृषिमूलमिदं धान्यं धनमूलमिदं जगत् ॥११२॥ राज्ञि धर्मिणि धर्मिष्ठाः पापे
    पापरतास्सदा । राजानमनुवर्तन्ते यथा राजा तथा प्रजा ॥११३॥ अतिरूपात् हृता सीता अतिदर्पाच्च रावणः । अतिदानात्
    बलिर्बद्धः अति सर्वत्र वर्जयेत् ॥११४॥ क्षते प्रहाराः निपतन्त्यनेकं धनक्षये वर्धति जाठराग्निः । आपत्सु
    वैराणि समुद्भवन्ति छिद्रेष्वनर्थाः बहुधा भवन्ति ॥११५॥ मातासमं नास्ति शरीरपोषणं विद्यासमं नास्ति शरीरभूषणम्
    । भार्यासमं नास्ति शरीरतोषणं चिन्तासमं नास्ति शरीरशोषणम् ॥११६॥ क्षणे तुष्टः क्षणे रुष्टह् वितुष्टिश्च
    क्षणे क्षणे । अव्यवस्थितचित्तस्य प्रसादोऽपि भयङ्करः ॥११७॥ अनुभवति हि मूर्ध्ना पादपैः तीव्रमुष्णम्
    । शमयति परितापं छायया संश्रितानाम् ॥११८॥ अनभ्यासे विषं शास्त्रं अजीर्णे भोजनं विषम् । दरिद्रस्य विषं
    गोष्ठी वृद्धस्य तरुणी विषम् ॥११९॥ अल्पज्ञः पूज्यते विशेषज्ञः विवर्जिते । देशे वृक्षविना भूते ह्येरण्डो
    हि वनस्पति ॥१२०॥ निरस्तपादपे देशे हीरण्डोऽपि द्रुमायते । सालि देण्ड्रसभामध्ये सातानिः पण्डितोत्तमः
    ॥१२१॥ अजवत् भोजनं कुर्यात् गजवत् स्नानमाचरेत् । शुकवत् भाषणं कुर्यात् बकवत् ध्यानमाचरेत् ॥१२२॥ बालसखित्वमकारणहास्यं
    स्त्रीविवादोऽसज्जनसेवा । गार्दभयानमसंस्कृतवाणी षट्सु नरो लघुतामुपयाति ॥१२३॥ मन्त्रे तीर्थे द्विजे
    दैवे दैवज्ञे भेषजे गुरौ । यादृशी भावना यत्र सिद्धिर्भवति तादृशी ॥१२४॥ अश्वस्य लक्षणं वेगः मदो मातङ्गलक्षणम्
    । चातुर्यं लक्षणं स्त्रीणामुद्योगं पुरुषलक्षणम् ॥१२५॥ क्षणशः कणशश्चैव विद्यामर्थं च साधयेत् । क्षणत्यागे
    कुतो विद्या
