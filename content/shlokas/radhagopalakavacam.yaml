id: radhagopalakavacam
category: kavacha
name:
  english: radhagopalakavacam
  devanagari: राधागोपालकवचम्
content:
  english: rinushvavahita priye | yo'sau niranjano devashcitsvarupi janardanah || 8|| samsarasagarottarakaranaya
    sada nrinam | shrirangadikarupena trailokyam vyapya tishthati || 9|| tato loka mahamudha vishnubhaktivivarjitah
    | nishcayam nadhigacchanti punarnarayano harih || 10|| niranjano nirakaro bhaktanam pritikamadah |
    vrindavanaviharaya gopalarupamudvahan || 11|| muralivadanadhari radhayai pritimavahan | amshamshebhyah
    samunmilya purnarupakalayutah || 12|| shrikrishnacadro bhagavan nandagopavarodyatah | dharanirupini
    mata yashodanandadayini || 13|| dvabhyam prayacito natho devakyam vasudevatah | brahmanabhyarthito
    devo devairapi sureshvari || 14|| jato'vanyam mukundo'pi muralivedarecika | taya sardham vacah kritva
    tato jato mahitale || 15|| samsarasarasarvasvam shyamalam mahadujjvalam | etajjyotiraham vedyam cintayami
    sanatanam || 16|| gauratejo vina yastu shyamatejah samarcayet | japedva dhyayate vapi sa bhavetpataki
    shive || 17|| sa brahmaha surapi ca svarnasteyi ca pancamah | etairdoshairvilipyeta tejobhedanmaheshvari
    || 18|| yasmajjyotirabhuddvedha radhamadhavarupakam | tasmadidam mahadevi gopalenaivam shayitam ||
    19|| durvasaso munermohe kartikyam rasamandale | tatah prishtavati radha sandeham bhedamatmanah ||
    20|| niranjanatsamutpannam mayadhitam jaganmayi | shrikrishnena tatah proktam radhayai naradaya ca
    || 21|| tato naradatah sarvam virala vaishnavastatha | kalau jananti deveshi gopaniyam prayatnatah
    || 22|| shathaya kripanayatha dambhikaya sureshvari | brahmahatyamavapnoti tasmadyatnena gopayet ||
    23|| iti shriradhagopalakavacam sampurnam |
  devanagari: ृणुष्वावहिता प्रिये । योऽसौ निरञ्जनो देवश्चित्स्वरूपी जनार्दनः ॥ ८॥ संसारसागरोत्तारकारणाय
    सदा नृणाम् । श्रीरङ्गादिकरूपेण त्रैलोक्यं व्याप्य तिष्ठति ॥ ९॥ ततो लोका महामूढा विष्णुभक्तिविवर्जिताः
    । निश्चयं नाधिगच्छन्ति पुनर्नारायणो हरिः ॥ १०॥ निरञ्जनो निराकारो भक्तानां प्रीतिकामदः । वृन्दावनविहाराय
    गोपालरूपमुद्वहन् ॥ ११॥ मुरलीवादनाधारी राधायै प्रीतिमावहन् । अंशांशेभ्यः समुन्मील्य पूर्णरूपकलायुतः
    ॥ १२॥ श्रीकृष्णचद्रो भगवान् नन्दगोपवरोद्यतः । धरणीरूपिणी माता यशोदानन्ददायिनी ॥ १३॥ द्वाभ्यां प्रयाचितो
    नाथो देवक्यां वसुदेवतः । ब्रह्मणाभ्यर्थितो देवो देवैरपि सुरेश्वरि ॥ १४॥ जातोऽवन्यां मुकुन्दोऽपि मुरलीवेदरेचिका
    । तया सार्धं वचः कृत्वा ततो जातो महीतले ॥ १५॥ संसारसारसर्वस्वं श्यामलं महदुज्ज्वलम् । एतज्ज्योतिरहं
    वेद्यं चिन्तयामि सनातनम् ॥ १६॥ गौरतेजो विना यस्तु श्यामतेजः समर्चयेत् । जपेद्वा ध्यायते वापि स भवेत्पातकी
    शिवे ॥ १७॥ स ब्रह्महा सुरापी च स्वर्णस्तेयी च पञ्चमः । एतैर्दोषैर्विलिप्येत तेजोभेदान्महेश्वरि ॥ १८॥
    यस्माज्ज्योतिरभूद्द्वेधा राधामाधवरूपकम् । तस्मादिदं महादेवि गोपालेनैवं शायितम् ॥ १९॥ दुर्वाससो मुनेर्मोहे
    कार्तिक्यां रासमण्डले । ततः पृष्टवती राधा सन्देहं भेदमात्मनः ॥ २०॥ निरञ्जनात्समुत्पन्नं मयाधीतं जगन्मयि
    । श्रीकृष्णेन ततः प्रोक्तं राधायै नारदाय च ॥ २१॥ ततो नारदतः सर्वं विरला वैष्णवास्तथा । कलौ जानन्ति
    देवेशि गोपनीयं प्रयत्नतः ॥ २२॥ शठाय कृपणायाथ दाम्भिकाय सुरेश्वरि । ब्रह्महत्यामवाप्नोति तस्माद्यत्नेन
    गोपयेत् ॥ २३॥ इति श्रीराधागोपालकवचं सम्पूर्णम् ।
