id: kamalapatyashtakam
category: stotram
name:
  english: kamalapatyashtakam
  devanagari: कमलापत्यष्टकम्
content:
  english: bhujagatalpagatam ghanasundaram garudavahanamambujalocanam | nalinacakragadakaramavyayam bhajata
    re manujah kamalapatim || 1|| alikulasitakomalakuntalam vimalapitadukulamanoharam | jaladhijashritavamakalevaram
    bhajata re manujah kamalapatim || 2|| kimu japaishca tapobhirutadhvarairapi kimuttamatirthanishevanaih
    | kimuta shastrakadambavilokanaih bhajata re manujah kamalapatim || 3|| manujadehamimam bhuvi durlabham
    samadhigamya surairapi vanchitam | vishayalampatatamapahaya vai bhajata re manujah kamalapatim ||
    4|| na vanita na suto na sahodaro na hi pita janani na ca bandhavah | vrajati sakamanena janena vai
    bhajata re manujah kamalapatim || 5|| sakalameva calam sacaracaram jagadidam sutaram dhanayauvanam
    | samavalokya vivekadrisha drutam bhajata re manujah kamalapatim || 6|| vividharogayutam kshanabhanguram
    paravasham navamargamalakulam | parinirikshya shariramidam svakam bhajata re manujah kamalapatim ||
    7|| munivarairanisham hridi bhavitam shivavirincimahendranutam sada | maranajanmajarabhayamocanam
    bhajata re manujah kamalapatim || 8|| haripadashtakametadanuttamam paramahamsajanena samiritam | pathati
    yastu samahitacetasa vrajati vishnupadam sa naro dhruvam || 9|| iti shrimatparamahamsasvamibrahmanandaviracitam
    kamalapatyashtakam samaptam||
  devanagari: भुजगतल्पगतं घनसुन्दरं गरुडवाहनमम्बुजलोचनम् । नलिनचक्रगदाकरमव्ययं भजत रे मनुजाः कमलापतिम्
    ॥ १॥ अलिकुलासितकोमलकुन्तलं विमलपीतदुकूलमनोहरम् । जलधिजाश्रितवामकलेवरं भजत रे मनुजाः कमलापतिम् ॥ २॥
    किमु जपैश्च तपोभिरुताध्वरैरपि किमुत्तमतीर्थनिषेवणैः । किमुत शास्त्रकदम्बविलोकनैः भजत रे मनुजाः कमलापतिम्
    ॥ ३॥ मनुजदेहमिमं भुवि दुर्लभं समधिगम्य सुरैरपि वाञ्छितम् । विषयलम्पटतामपहाय वै भजत रे मनुजाः कमलापतिम्
    ॥ ४॥ न वनिता न सुतो न सहोदरो न हि पिता जननी न च बान्धवाः । व्रजति साकमनेन जनेन वै भजत रे मनुजाः कमलापतिम्
    ॥ ५॥ सकलमेव चलं सचराचरं जगदिदं सुतरां धनयौवनम् । समवलोक्य विवेकदृशा द्रुतं भजत रे मनुजाः कमलापतिम्
    ॥ ६॥ विविधरोगयुतं क्षणभङ्गुरं परवशं नवमार्गमलाकुलम् । परिनिरीक्ष्य शरीरमिदं स्वकं भजत रे मनुजाः कमलापतिम्
    ॥ ७॥ मुनिवरैरनिशं हृदि भावितं शिवविरिञ्चिमहेन्द्रनुतं सदा । मरणजन्मजराभयमोचनं भजत रे मनुजाः कमलापतिम्
    ॥ ८॥ हरिपदाष्टकमेतदनुत्तमं परमहंसजनेन समीरितम् । पठति यस्तु समाहितचेतसा व्रजति विष्णुपदं स नरो ध्रुवं
    ॥ ९॥ इति श्रीमत्परमहंसस्वामिब्रह्मानन्दविरचितं कमलापत्यष्टकं समाप्तं॥
