id: subradandaka
category: stotram
name:
  english: subradandaka
  devanagari: सुब्रदण्डक
content:
  english: shrisubrahmanyadandakam jaya vajrisutakanta jaya shankaranandana | jaya marashatakara jaya
    vallimanohara || jaya bhujabalanirjitaneka vidyandabhikarisamgrama krittarakavapta girvanabhidvanta
    martanda shadvaktra gaurisha phalakshi samjata tejasamurbhuta devapaga patmashandothita svakrite
  devanagari: श्रीसुब्रह्मण्यदण्डकम् जय वज्रिसुताकान्त जय शङ्करनन्दन । जय मारशताकार जय वल्लीमनोहर ॥ जय
    भुजबलनिर्जितानेक विद्याण्डभीकारिसंग्राम कृत्तरकावाप्त गीर्वाणभीड्वान्त मार्ताण्ड षड्वक्त्र गौरीश फालाक्षि
    सम्जात तेजसमुर्भूत देवापगा पत्मषण्डोथित स्वाकृते
meaning: {}
