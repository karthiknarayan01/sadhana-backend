id: brahmanakritamshivastotram
category: stotram
name:
  english: brahmanakritamshivastotram
  devanagari: ब्रह्मणाकृतंशिवस्तोत्रम्
content:
  english: brahmana kritam shivastotram brahmovaca | namo devaya mahate mahadevyai namo namah | namah
    shivaya shantaya shivayai satatam namah || 1|| om namo brahmane tubhyam vidyayai te namo namah | maheshaya
    namastubhyam mulaprakritaye namah || 2|| namo vijnanadehaya cintayai te namo namah | namo'stu kalakalaya
    ishvarayai namo namah || 3|| namo namo'stu rudraya rudranyai te namo namah | namo namaste kamaya mayayai
    ca namo namah || 4|| niyantre sarvakaryanam kshobhikayai namo namah | namo'stu te prakritaye namo
    narayanaya ca || 5|| yogadayai namastubhyam yoginam gurave namah | namah samsaranashaya samsarotpattaye
    namah || 6|| nityanandaya vibhave namo'stvanandamurttaye | namah karyavihinaya vishvaprakritaye namah
    || 7|| onkaramurttaye tubhyam tadantah samsthitaya ca | namaste vyomasamsthaya vyomashaktyai namo
    namah || 8|| iti kurmapurane uttarabhage ekatrimshadhyayantargatam brahmana kritam shiva
  devanagari: ब्रह्मणा कृतं शिवस्तोत्रम् ब्रह्मोवाच । नमो देवाय महते महादेव्यै नमो नमः । नमः शिवाय शान्ताय
    शिवायै सततं नमः ॥ १॥ ॐ नमो ब्रह्मणे तुभ्यं विद्यायै ते नमो नमः । महेशाय नमस्तुभ्यं मूलप्रकृतये नमः
    ॥ २॥ नमो विज्ञानदेहाय चिन्तायै ते नमो नमः । नमोऽस्तु कालकालाय ईश्वरायै नमो नमः ॥ ३॥ नमो नमोऽस्तु रुद्राय
    रुद्राण्यै ते नमो नमः । नमो नमस्ते कामाय मायायै च नमो नमः ॥ ४॥ नियन्त्रे सर्वकार्याणां क्षोभिकायै
    नमो नमः । नमोऽस्तु ते प्रकृतये नमो नारायणाय च ॥ ५॥ योगादायै नमस्तुभ्यं योगिनां गुरवे नमः । नमः संसारनाशाय
    संसारोत्पत्तये नमः ॥ ६॥ नित्यानन्दाय विभवे नमोऽस्त्वानन्दमूर्त्तये । नमः कार्यविहीनाय विश्वप्रकृतये
    नमः ॥ ७॥ ओङ्कारमूर्त्तये तुभ्यं तदन्तः संस्थिताय च । नमस्ते व्योमसंस्थाय व्योमशक्त्यै नमो नमः ॥ ८॥
    इति कूर्मपुराणे उत्तरभागे एकत्रिंशाध्यायान्तर्गतं ब्रह्मणा कृतं शिव
