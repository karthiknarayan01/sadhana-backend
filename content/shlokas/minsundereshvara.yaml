id: minsundereshvara
category: stotram
name:
  english: minsundereshvara
  devanagari: मिन्सुन्देरेश्वर
content:
  english: dharapravalabhasamanavaktramandalashriye | karasphuratkapalamuktavishnuraktapayine sada namashshivaya
    te sadashivaya shambhave || 4 || sahasrapundarikapujanaikashunyadarshana sahasvanetrakalpitarcanacyutaya
    bhaktitah | sahasrabhanumandalaprakashacakradayine sada namashshivaya te sadashivaya shambhave ||
    5 || rasarathaya ramyapatrabhridrathangapanaye rasadharendracapashinjinikritanilashine | svasarathikritajanunnavedarupavajine
    sada namashshivaya te sadashivaya shambhave || 6 || atipragalbhavirabhadrasimhanadagarjita shrutiprabhitadakshayagabhoginakasadmanam
    | gatipradaya garjitakhilaprapancasakshine sada namashshivaya te sada shivaya shambhave || 7 || mrikandusunurakshanavadhutadandapanaye
    sugandamandalasphuratprabhajitamritamshave | akhandabhogasampadarthilokabhavitatmane sada namashshivaya
    te sada shivaya shambhave || 8 || madhuripuvidhishakramukhyadevairapi niyamarcitapadapankajaya | kanakagirisharasanaya
    tubhyam rajatasabhapataye namah shivaya || 9 || halasyanathaya maheshvaraya halahalalankritakandharaya
    | minekshanayah pataye shivaya namo namah sundaratandavaya || 10 || tvaya kritamidam stotram yah pathedbhaktisamyutah
    | tasya''yurdirghamarogyam sampadashca dadamyaham || 11 ||
  devanagari: धरप्रवालभासमानवक्त्रमण्डलश्रिये । करस्फुरत्कपालमुक्तविष्णुरक्तपायिने सदा नमश्शिवाय ते सदाशिवाय
    शंभवे ॥ ४ ॥ सहस्रपुण्डरीकपूजनैकशून्यदर्शना सहस्वनेत्रकल्पितार्चनाच्युताय भक्तितः । सहस्रभानुमण्डलप्रकाशचक्रदायिने
    सदा नमश्शिवाय ते सदाशिवाय शंभवे ॥ ५ ॥ रसारथाय रम्यपत्रभृद्रथाङ्गपाणये रसाधरेन्द्रचापशिञ्जिनीकृतानिलाशिने
    । स्वसारथीकृताजनुन्नवेदरूपवाजिने सदा नमश्शिवाय ते सदाशिवाय शंभवे ॥ ६ ॥ अतिप्रगल्भवीरभद्रसिंहनादगर्जित
    श्रुतिप्रभीतदक्षयागभोगिनाकसद्मनाम् । गतिप्रदाय गर्जिताखिलप्रपञ्चसाक्षिणे सदा नमश्शिवाय ते सदा शिवाय
    शंभवे ॥ ७ ॥ मृकण्डुसूनुरक्षणावधूतदण्डपाणये सुगण्डमण्डलस्फुरत्प्रभाजितामृतांशवे । अखण्डभोगसम्पदर्थिलोकभावितात्मने
    सदा नमश्शिवाय ते सदा शिवाय शंभवे ॥ ८ ॥ मधुरिपुविधिशक्रमुख्यदेवैरपि नियमार्चितपादपङ्कजाय । कनकगिरिशरासनाय
    तुभ्यं रजतसभापतये नमः शिवाय ॥ ९ ॥ हालास्यनाथाय महेश्वराय हालाहलालङ्कृतकन्धराय । मीनेक्षनायाः पतये
    शिवाय नमो नमः सुन्दरताण्डवाय ॥ १० ॥ त्वया कृतमिदं स्तोत्रं यः पठेद्भक्तिसंयुतः । तस्याऽऽयुर्दीर्घमारोग्यं
    सम्पदश्च ददाम्यहम् ॥ ११ ॥
