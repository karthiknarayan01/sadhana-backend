id: annamayya-keerthanas-kaligenide-naaku
category: stotram
name:
  english: Annamayya Keerthanas Kaligenide Naaku
content:
  english: kaligènidè naku kaivalyamu tòlutanèvvariki dòrakanidi || jayapurushottama jaya pitambara jayajaya
    karunajalanidhi | daya yèṟanga ne dharmamu nèṟaga na kriya yidi nidivyakirtaname || sharanamu govinda
    sharanamu keshava sharanu sharanu shrijanardhana | parama mèṟanganu bhakti yèṟanganu niratamu nagati
    nidasyame || namo narayana namo lakshmipati namo pundarikanayana | amita shrivenkatadhipa yidè na
    kramamèllanu nikayinkaryame ||
  devanagari: कलिगॆनिदॆ नाकु कैवल्यमु तॊलुतनॆव्वरिकि दॊरकनिदि ॥ जयपुरुषोत्तम जय पीताम्बर जयजय करुणाजलनिधि
    । दय यॆऱङ्ग ने धर्ममु नॆऱग ना क्रिय यिदि नीदिव्यकीर्तनमे ॥ शरणमु गोविन्द शरणमु केशव शरणु शरणु श्रीजनार्धन
    । परम मॆऱङ्गनु भक्ति यॆऱङ्गनु निरतमु नागति नीदास्यमे ॥ नमो नारायणा नमो लक्ष्मीपति नमो पुण्डरीकनयना
    । अमित श्रीवेङ्कटाधिप यिदॆ ना क्रममॆल्लनु नीकयिङ्कर्यमे ॥
