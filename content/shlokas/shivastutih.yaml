id: shivastutih
category: stotram
name:
  english: shivastutih
  devanagari: शिवस्तुतिः
content:
  english: stutvaivam devamishanam punah sampujya shankaram | ishanam purusham devam vamadevamadhorakam
    | sadyojatam ca deveshi namabhih samstuvita ca || 53|| tato nirajanam dadyat vaditranam nidanatah
    | shankhakahalanirghoshairbheribhankaramaddalaih || 54|| venuvinamridangaishca jayashabdaih sumangalaih
    | pujam samapya niyatahkaratalasunartanaih || 55|| prasadayenmahadevam pujante shambhavaih saha |
    niveditaishca tambulaih pujayeddakshinadibhih || 56|| ekavaram trivaram va pujayedgirijapatim | chatraishca
    camarairdivyavyajanadarshakairapi || 57|| caitratrinetrapujatah kshipram nashyati patakam | citrayamatha
    paurnamyam homam kuryacca shambhavaih || 58|| dadyadgomithunam tatra masi masi visheshatah | prasangaccaiva
    sampujyo bhaktihinairapi dvijaih || 59|| vishoshayettanum devi naktashi ksharavarjitam | evam caitradimasasya
    pujanam te prakirtitam || 63|| yatkritva manujah sadyo labhedrudraganatvatam | pitamahaih sahaivatha
    narakasthairapi dvijah || 64|| yati shambhorvarasthanam vimanaih sarvagamikaih || 65|| || iti shivarahasyantargate
    ishvaraproktam caitramasakrite shivastutih sampurna ||
  devanagari: स्तुत्वैवं देवमीशानं पुनः सम्पूज्य शङ्करम् । ईशानं पुरुषं देवं वामदेवमधोरकम् । सद्योजातं
    च देवेशि नामभिः संस्तुवीत च ॥ ५३॥ ततो नीराजनं दद्यात् वादित्राणां निदानतः । शङ्खकाहलनिर्घोषैर्भेरीभाङ्कारमद्दलैः
    ॥ ५४॥ वेणुवीणामृदङ्गैश्च जयशब्दैः सुमङ्गलैः । पूजां समाप्य नियतःकरतालसुनर्तनैः ॥ ५५॥ प्रसादयेन्महादेवं
    पूजान्ते शाम्भवैः सह । निवेदितैश्च ताम्बूलैः पूजयेद्दक्षिणादिभिः ॥ ५६॥ एकवारं त्रिवारं वा पूजयेद्गिरिजापतिम्
    । छत्रैश्च चामरैर्दिव्यव्यजनादर्शकैरपि ॥ ५७॥ चैत्रत्रिणेत्रपूजातः क्षिप्रं नश्यति पातकम् । चित्रायामथ
    पौर्णम्यां होमं कुर्याच्च शाम्भवैः ॥ ५८॥ दद्याद्गोमिथुनं तत्र मासि मासि विशेषतः । प्रसङ्गाच्चैव सम्पूज्यो
    भक्तिहीनैरपि द्विजैः ॥ ५९॥ विशोषयेत्तनुं देवि नक्ताशी क्षारवर्जितम् । एवं चैत्रादिमासस्य पूजनं ते
    प्रकीर्तितम् ॥ ६३॥ यत्कृत्वा मनुजः सद्यो लभेद्रुद्रगणत्वताम् । पितामहैः सहैवाथ नरकस्थैरपि द्विजः ॥
    ६४॥ याति शम्भोर्वरस्थानं विमानैः सार्वगामिकैः ॥ ६५॥ ॥ इति शिवरहस्यान्तर्गते ईश्वरप्रोक्तं चैत्रमासकृते
    शिवस्तुतिः सम्पूर्णा ॥
