id: pancamukhihanumatkavacam
category: kavacha
name:
  english: pancamukhihanumatkavacam
  devanagari: पन्चमुखिहनुमत्कवचम्
content:
  english: asya shripancamukhihanumatkavacastotrasya shriramacandra rishih | anushtupchandah | shriramacandro
    devata | sita iti bijam | hanumaniti shaktih | hanumatprityarthe jape viniyogah | punarhanumaniti
    bijam | om vayuputraya iti shaktih | anjanasutayeti kilakam | shriramacandravaraprasadasiddhyarthe
    jape viniyogah | om anjanasutaya angushthabhyam namah | om rudramurtaye tarjanibhyam namah | om vayuputraya
    madhyamabhyam namah | om agnigarbhaya anamikabhyam namah | om ramadutaya kanishthikabhyam namah |
    om sitashokanivaranaya karatalakaraprishthabhyam namah | om anjanasutaya hridayaya namah | om rudramurtaye
    shirase svaha | om vayuputraya shikhayai vashat | om agnigarbhaya kavacaya hum | om ramadutaya netratrayaya
    vaushat | om pancamukhihanumate astraya phat | om pancamukhihanumate svaha iti digbandhah | dhyanam
  devanagari: अस्य श्रीपञ्चमुखिहनुमत्कवचस्तोत्रस्य श्रीरामचन्द्र ऋषिः । अनुष्टुप्छन्दः । श्रीरामचन्द्रो
    देवता । सीता इति बीजम् । हनुमानिति शक्तिः । हनुमत्प्रीत्यर्थे जपे विनियोगः । पुनर्हनुमानिति बीजम्
    । ॐ वायुपुत्राय इति शक्तिः । अञ्जनासुतायेति कीलकम् । श्रीरामचन्द्रवरप्रसादसिद्ध्यर्थे जपे विनियोगः
    । ॐ अञ्जनासुताय अङ्गुष्ठाभ्यां नमः । ॐ रुद्रमूर्तये तर्जनीभ्यां नमः । ॐ वायुपुत्राय मध्यमाभ्यां नमः
    । ॐ अग्निगर्भाय अनामिकाभ्यां नमः । ॐ रामदूताय कनिष्ठिकाभ्यां नमः । ॐ सीताशोकनिवारणाय करतलकरपृष्ठाभ्यां
    नमः । ॐ अञ्जनासुताय हृदयाय नमः । ॐ रुद्रमूर्तये शिरसे स्वाहा । ॐ वायुपुत्राय शिखायै वषट् । ॐ अग्निगर्भाय
    कवचाय हुम् । ॐ रामदूताय नेत्रत्रयाय वौषट् । ॐ पञ्चमुखिहनुमते अस्त्राय फट् । ॐ पञ्चमुखिहनुमते स्वाहा
    इति दिग्बन्धः । ध्यानं
meaning: {}
