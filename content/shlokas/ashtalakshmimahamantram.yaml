id: ashtalakshmimahamantram
category: mantra
name:
  english: ashtalakshmimahamantram
  devanagari: अष्टलक्ष्मीमहामन्त्रम्
content:
  english: sarvakaryasiddhidvara shrivijayalakshmiprasadasiddhyarthe jape viniyogah | om vram angushthabhyam
    namah | om vrim tarjanibhyam namah | om vrum madhyamabhyam namah | om vraim anamikabhyam namah | om
    vraum kanishthikabhyam namah | om vrah karatalakaraprishthabhyam namah || om vram hridayaya namah
    | om vrim shirase svaha | om vrum shikhayai vashat | om vraim kavacaya hum | om vraum netrabhyam vaushat
    | om vrah astraya phat | om bhurbhuvassuvaromiti digbandhah || dhyanam | ashtabahuyutam devim simhasanavarasthitam
    | sakhasanam sukeshinca kiritamukutojjvalam || shyamangim komalakaram sarvabharanabhushitam | khadgam
    pasham tada cakramabhayam savyahastake || khetakancankusham shankham varadam vamahastake | rajarupadharam
    shaktim prabhasaundaryashobhitam || hamsarudham smareddevim vijayam vijayaprade || mulmantram
  devanagari: सर्वकार्यसिद्धिद्वारा श्रीविजयलक्ष्मीप्रसादसिद्ध्यर्थे जपे विनियोगः । ॐ व्रां अङ्गुष्ठाभ्यां
    नमः । ॐ व्रीं तर्जनीभ्यां नमः । ॐ व्रूं मध्यमाभ्यां नमः । ॐ व्रैं अनामिकाभ्यां नमः । ॐ व्रौं कनिष्ठिकाभ्यां
    नमः । ॐ व्रः करतलकरपृष्ठाभ्यां नमः ॥ ॐ व्रां हृदयाय नमः । ॐ व्रीं शिरसे स्वाहा । ॐ व्रूं शिखायै वषट्
    । ॐ व्रैं कवचाय हुं । ॐ व्रौं नेत्राभ्यां वौषट् । ॐ व्रः अस्त्राय फट् । ॐ भूर्भुवस्सुवरोमिति दिग्बन्धः
    ॥ ध्यानम् । अष्टबाहुयुतां देवीं सिम्हासनवरस्थिताम् । सखासनां सुकेशीञ्च किरीटमुकुटोज्ज्वलाम् ॥ श्यामाङ्गीं
    कोमलाकारां सर्वाभरणभूषिताम् । खड्गं पाशं तदा चक्रमभयं सव्यहस्तके ॥ खेटकञ्चाङ्कुशं शङ्खं वरदं वामहस्तके
    । राजरूपधरां शक्तिं प्रभासौन्दर्यशोभिताम् ॥ हंसारूढां स्मरेद्देवीं विजयां विजयप्रदे ॥ मूल्मन्त्रं
