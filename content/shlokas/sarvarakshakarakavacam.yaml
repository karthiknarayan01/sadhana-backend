id: sarvarakshakarakavacam
category: kavacha
name:
  english: sarvarakshakarakavacam
  devanagari: सर्वरक्षाकरकवचम्
content:
  english: sadhakabhishtasiddhaye viniyogah prakirtitah | shiro me sarvada patu prasadakhyah sadashivah
    | shadaksharasvarupo me vadanam ca maheshvarah || 3|| pancaksharatma bhagavan bhujau me parirakshatu
    | mrityunjayastribijatma ayu rakshatu me sada || 4|| vatamulasamasino dakshinamurtiravyayah | sada
    mam sarvatah patu shattrimshadvarnarupadhrik || 5|| dvavimsharnatmako rudrah kukshau me parirakshatu
    | trivarnatma nilakanthah kantham rakshatu sarvada || 6|| cintamanirbijarupe sarvanarishvaro harah
    | sada rakshatu me guhyam sarvasampatpradayakah || 7|| ekaksharasvarupatma kutarupi maheshvarah |
    martandabhairavo nityam padau me parirakshatu || 8|| omityakhyo mahabijasvarupastripurantakah sada
    mam ranabhumau tu rakshatu tridashadhipah || 9|| urdhvamurdhanamishano mama rakshatu sarvada | dakshinasyam
    tatpurusho avyanme girinayakah || 10|| aghorakhyo mahadevah purvasya parirakshatu | vamadevah pashcimasyam
    sada me parirakshatu | uttarasyam sada patu sadyojatah svarupadhrik || 11|| phalashrutih | ittha rakshakaram
    devi kavacam devadurlabham | pratahkale pathedyastu so'bhishtaphalamapnuyat || 12|| pujakale pathedyastu
    sadhakom dakshine bhuje | deva manushya gandharva vashyastasya na samshayah || 13|| kavacam yastu
    shirasi dharayedyadi manavah | karasthastasya deveshi animadyashtasiddhayah || 14|| svarnapatre tvimam
    vidyam shuklapattena veshtitam | rajatodarasamvishtam kritva ca dharayetsudhih || 15|| samprapya mahatim
    lakshmimantram ca shivarupadhrik | yasmai kasmai na datavyam na prakashyam kadacana || 16|| shishyaya
    bhaktiyuktaya sadhakaya prakashayet | anyatha siddhihanih syat satyametanmanorame || 17|| tava snehanmahadevi
    kathitam kavacam shubham | na deyam kasyacidbhadre yadicchedatmano hitam || 18|| yo'rcayed gandhapushpadyaih
    kavacam manmukhoditam | tenarcita mahadevi sarve deva na samshayah || 19|| iti kriyoddishe mahatantraraje
    devishvarasamvade sarvarakshakaram kavacam samaptam || pancadashah patalah
  devanagari: साधकाभीष्टसिद्धये विनियोगः प्रकीर्तितः । शिरो मे सर्वदा पातु प्रासादाख्यः सदाशिवः । षडक्षरस्वरूपो
    मे वदनं च महेश्वरः ॥ ३॥ पाञ्चाक्षरात्मा भगवान् भुजौ मे परिरक्षतु । मृत्युञ्जयस्त्रिबीजात्मा आयू रक्षतु
    मे सदा ॥ ४॥ वटमूलसमासीनो दक्षिणामूर्तिरव्ययः । सदा मां सर्वतः पातु षट्त्रिंशद्वर्णरूपधृक् ॥ ५॥ द्वाविंशार्णात्मको
    रुद्रः कुक्षौ मे परिरक्षतु । त्रिवर्णात्मा नीलकण्ठः कण्ठं रक्षतु सर्वदा ॥ ६॥ चिन्तामणिर्बीजरूपे सर्वनारीश्वरो
    हरः । सदा रक्षतु मे गुह्यं सर्वसम्पत्प्रदायकः ॥ ७॥ एकाक्षरस्वरूपात्मा कूटरूपी महेश्वरः । मार्तण्डभैरवो
    नित्यं पादौ मे परिरक्षतु ॥ ८॥ ओमित्याख्यो महाबीजस्वरूपस्त्रिपुरान्तकः सदा मां रणभूमौ तु रक्षतु त्रिदशाधिपः
    ॥ ९॥ ऊर्ध्वमूर्धानमीशानो मम रक्षतु सर्वदा । दक्षिणस्यां तत्पुरुषो अव्यान्मे गिरिनायकः ॥ १०॥ अघोराख्यो
    महादेवः पूर्वस्या परिरक्षतु । वामदेवः पश्चिमस्यां सदा मे परिरक्षतु । उत्तरस्यां सदा पातु सद्योजातः
    स्वरूपधृक् ॥ ११॥ फलश्रुतिः । इत्थ रक्षाकरं देवि कवचं देवदुर्लभम् । प्रातःकाले पठेद्यस्तु सोऽभीष्टफलमाप्नुयात्
    ॥ १२॥ पूजाकाले पठेद्यस्तु साधकों दक्षिणे भुजे । देवा मनुष्या गन्धर्वा वश्यास्तस्य न संशयः ॥ १३॥ कवचं
    यस्तु शिरसि धारयेद्यदि मानवः । करस्थास्तस्य देवेशि अणिमाद्यष्टसिद्धयः ॥ १४॥ स्वर्णपत्रे त्विमां विद्यां
    शुक्लपट्टेन वेष्टिताम् । राजतोदरसंविष्टां कृत्वा च धारयेत्सुधीः ॥ १५॥ सम्प्राप्य महतीं लक्ष्मीमन्त्रं
    च शिवरूपधृक् । यस्मै कस्मै न दातव्यं न प्रकाश्यं कदाचन ॥ १६॥ शिष्याय भक्तियुक्ताय साधकाय प्रकाशयेत्
    । अन्यथा सिद्धिहानिः स्यात् सत्यमेतन्मनोरमे ॥ १७॥ तव स्नेहान्महादेवि कथितं कवचं शुभम् । न देयं कस्यचिद्भद्रे
    यदीच्छेदात्मनो हितम् ॥ १८॥ योऽर्चयेद् गन्धपुष्पाद्यैः कवचं मन्मुखोदितम् । तेनार्चिता महादेवि सर्वे
    देवा न संशयः ॥ १९॥ इति क्रियोड्डीशे महातन्त्रराजे देवीश्वरसंवादे सर्वरक्षाकरं कवचं समाप्तम् ॥ पञ्चदशः
    पटलः
