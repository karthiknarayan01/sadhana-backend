id: sri-matangi-ashtottara-satanama-stotram
category: stotram
name:
  english: Sri Matangi Ashtottara Satanama Stotram
content:
  english: shribhairavyuvaca bhagavan shrotumicchami matangyah shatanamakam | yadguhyam sarvatantreshu
    kenapi na prakashitam || || shribhairava uvaca shrinu devi pravakshyami rahasyatirahasyakam | nakhyeyam
    yatra kutrapi pathaniyam paratparam || || yasyaikavarapathanatsarve vighna upadravah | nashyanti tatkshanaddevi
    vahnina tularashivat || || prasanna jayate devi matangi casya pathatah | sahasranamapathane yatphalam
    parikirtitam | tatkotigunitam devinamashtashatakam shubham || || asya shrimatangyashtottarashatanamastotrasya
    bhagavanmatanga rishih anushtupchandah shrimatangi devata shrimatangi pritaye jape viniyogah | mahamattamatangini
    siddhirupa tatha yogini bhadrakali rama ca | bhavani bhavapritida bhutiyukta bhavaradhita bhutisampatkari
    ca || || dhanadhishamata dhanagaradrishti rdhanesharcita dhiravapi varangi | prakrishta prabharupini
    kamarupa prahrishta mahakirtida karnanali || || karali bhaga ghorarupa bhagangi bhagahva bhagapritida
    bhimarupa | bhavani mahakaushiki koshapurna kishori kishorapriya nandiha || || mahakarana'karana karmashila
    kapali prasiddha mahasiddhakhanda | makarapriya manarupa maheshi malollasini lasyalilalayangi || ||
    kshama kshemashila kshapakarini ca 'kshayapritida bhutiyukta bhavani | bhavaradhita bhutisatyatmika
    ca prabhodbhasita bhanubhasvatkara ca || || dharadhishamata dharagaradrishti rdharesharcita dhivara
    dhivarangi | prakrishta prabharupini pranarupa prakrishtasvarupa svarupapriya ca || || calatkundala
    kamini kantayukta kapala'cala kalakoddharini ca | kadambapriya kotari kotadeha krama kirtida karnarupa
    ca kakshmih || || kshamangi kshayapremarupa kshaya ca kshayaksha kshayahva kshayaprantara ca | kshavatkamini
    ksharini kshirapurna shivangi ca shakambhari shakadeha || || mahashakayajna phalaprashaka ca shakahva'shakahva
    shakakhya shaka ca | shakakshantarosha surosha surekha mahasheshayajnopavitapriya ca || || jayanti
    jaya jagrati yogyarupa jayanga japadhyanasantushtasanjna | jayapranarupa jayasvarnadeha jayajvalini
    yamini yamyarupa || || jaganmatrirupa jagadrakshana ca svadhavaushadanta vilamba'vilamba | shadanga
    mahalambarupasihasta padahariniharini harini ca || || mahamangala mangalapremakirti rnishumbhacchida
    shumbhadarpapaha ca | tatha''nandabijadimuktisvarupa tatha candamundapada mukhyacanda || || pracanda'pracanda
    mahacandavega calaccamara camara candrakirtih | sucamikara citrabhushojjvalangi susangitagita ca payadapayat
    || || iti te kathitam devi namnamashtottaram shatam | gopyam ca sarvatantreshu gopaniyam ca sarvada
    || || etasya satatabhyasatsakshaddevo maheshvarah | trisandhyam ca mahabhaktya pathaniyam sukhodayam
    || || na tasya dushkaram kincijjayate sparshatah kshanat | sukritam yattadevaptam tasmadavartayetsada
    || || sadaiva sannidhau tasya devi vasati sadaram | ayoga ye ta evagre suyogashca bhavanti vai ||
    || ta eva mitrabhutashca bhavanti tatprasadatah | vishani nopasarpanti vyadhayo na sprishanti tan
    || || lutavisphotakah sarve shamam yanti ca tatkshanat | jarapalitanirmuktah kalpajivi bhavennarah
    || || api kim bahunoktena sannidhyam phalamapnuyat | yavanmaya pura proktam phalam sahasranamakam
    | tatsarvam labhate martyo mahamayaprasadatah || || iti shrirudrayamale shrimatangishatanamastotram
    |
  devanagari: श्रीभैरव्युवाच भगवन् श्रोतुमिच्छामि मातङ्ग्याः शतनामकम् । यद्गुह्यं सर्वतन्त्रेषु केनापि
    न प्रकाशितम् ॥ ॥ श्रीभैरव उवाच शृणु देवि प्रवक्ष्यामि रहस्यातिरहस्यकम् । नाख्येयं यत्र कुत्रापि पठनीयं
    परात्परम् ॥ ॥ यस्यैकवारपठनात्सर्वे विघ्ना उपद्रवाः । नश्यन्ति तत्क्षणाद्देवि वह्निना तूलराशिवत् ॥
    ॥ प्रसन्ना जायते देवी मातङ्गी चास्य पाठतः । सहस्रनामपठने यत्फलं परिकीर्तितम् । तत्कोटिगुणितं देवीनामाष्टशतकं
    शुभम् ॥ ॥ अस्य श्रीमातङ्ग्यष्टोत्तरशतनामस्तोत्रस्य भगवान्मतङ्ग ऋषिः अनुष्टुप्छन्दः श्रीमातङ्गी देवता
    श्रीमातङ्गी प्रीतये जपे विनियोगः । महामत्तमातङ्गिनी सिद्धिरूपा तथा योगिनी भद्रकाली रमा च । भवानी भवप्रीतिदा
    भूतियुक्ता भवाराधिता भूतिसम्पत्करी च ॥ ॥ धनाधीशमाता धनागारदृष्टि र्धनेशार्चिता धीरवापी वराङ्गी । प्रकृष्टा
    प्रभारूपिणी कामरूपा प्रहृष्टा महाकीर्तिदा कर्णनाली ॥ ॥ कराली भगा घोररूपा भगाङ्गी भगाह्वा भगप्रीतिदा
    भीमरूपा । भवानी महाकौशिकी कोशपूर्णा किशोरी किशोरप्रिया नन्दीहा ॥ ॥ महाकारणाऽकारणा कर्मशीला कपाली प्रसिद्धा
    महासिद्धखण्डा । मकारप्रिया मानरूपा महेशी मलोल्लासिनी लास्यलीलालयाङ्गी ॥ ॥ क्षमा क्षेमशीला क्षपाकारिणी
    चा ऽक्षयप्रीतिदा भूतियुक्ता भवानी । भवाराधिता भूतिसत्यात्मिका च प्रभोद्भासिता भानुभास्वत्करा च ॥ ॥
    धराधीशमाता धरागारदृष्टि र्धरेशार्चिता धीवरा धीवराङ्गी । प्रकृष्टा प्रभारूपिणी प्राणरूपा प्रकृष्टस्वरूपा
    स्वरूपप्रिया च ॥ ॥ चलत्कुण्डला कामिनी कान्तयुक्ता कपालाऽचला कालकोद्धारिणी च । कदम्बप्रिया कोटरी कोटदेहा
    क्रमा कीर्तिदा कर्णरूपा च काक्ष्मीः ॥ ॥ क्षमाङ्गी क्षयप्रेमरूपा क्षया च क्षयाक्षा क्षयाह्वा क्षयप्रान्तरा
    च । क्षवत्कामिनी क्षारिणी क्षीरपूर्णा शिवाङ्गी च शाकम्भरी शाकदेहा ॥ ॥ महाशाकयज्ञा फलप्राशका च शकाह्वाऽशकाह्वा
    शकाख्या शका च । शकाक्षान्तरोषा सुरोषा सुरेखा महाशेषयज्ञोपवीतप्रिया च ॥ ॥ जयन्ती जया जाग्रती योग्यरूपा
    जयाङ्गा जपध्यानसन्तुष्टसञ्ज्ञा । जयप्राणरूपा जयस्वर्णदेहा जयज्वालिनी यामिनी याम्यरूपा ॥ ॥ जगन्मातृरूपा
    जगद्रक्षणा च स्वधावौषडन्ता विलम्बाऽविलम्बा । षडङ्गा महालम्बरूपासिहस्ता पदाहारिणीहारिणी हारिणी च ॥
    ॥ महामङ्गला मङ्गलप्रेमकीर्ति र्निशुम्भच्छिदा शुम्भदर्पापहा च । तथाऽऽनन्दबीजादिमुक्तिस्वरूपा तथा चण्डमुण्डापदा
    मुख्यचण्डा ॥ ॥ प्रचण्डाऽप्रचण्डा महाचण्डवेगा चलच्चामरा चामरा चन्द्रकीर्तिः । सुचामीकरा चित्रभूषोज्ज्वलाङ्गी
    सुसङ्गीतगीता च पायादपायात् ॥ ॥ इति ते कथितं देवि नाम्नामष्टोत्तरं शतम् । गोप्यं च सर्वतन्त्रेषु गोपनीयं
    च सर्वदा ॥ ॥ एतस्य सतताभ्यासात्साक्षाद्देवो महेश्वरः । त्रिसन्ध्यं च महाभक्त्या पठनीयं सुखोदयम् ॥
    ॥ न तस्य दुष्करं किञ्चिज्जायते स्पर्शतः क्षणात् । सुकृतं यत्तदेवाप्तं तस्मादावर्तयेत्सदा ॥ ॥ सदैव
    सन्निधौ तस्य देवी वसति सादरम् । अयोगा ये त एवाग्रे सुयोगाश्च भवन्ति वै ॥ ॥ त एव मित्रभूताश्च भवन्ति
    तत्प्रसादतः । विषाणि नोपसर्पन्ति व्याधयो न स्पृशन्ति तान् ॥ ॥ लूताविस्फोटकाः सर्वे शमं यान्ति च तत्क्षणात्
    । जरापलितनिर्मुक्तः कल्पजीवी भवेन्नरः ॥ ॥ अपि किं बहुनोक्तेन सान्निध्यं फलमाप्नुयात् । यावन्मया पुरा
    प्रोक्तं फलं साहस्रनामकम् । तत्सर्वं लभते मर्त्यो महामायाप्रसादतः ॥ ॥ इति श्रीरुद्रयामले श्रीमातङ्गीशतनामस्तोत्रम्
    ।
