id: mahanyasam-7-4-apratiratham
category: stotram
name:
  english: Mahanyasam - 7.4. Apratiratham
content:
  english: shshishano vrishabho na yudhmo ghanaghanah shaninam | sankrandano 'nimisha eka virashshatagm
    sena ajayathsa kamindrah | sankrandanena nimishena jishnuna yutkarena dushcyavanena dhrishnuna | tadindrena
    jayata tathsahadhvam yu~dho nara ishu hastena vrishna ssa nishangibhi rvashi sagg srashta sayudha
    indro ganena | sagmsrishta jithsomapa bahu shardhyu | brihaspate paridiya rathena rakshoha 'mitragm
    apa badhamanah | pramrino yudha jayannasmaka meddhyavita rathanam | gotrabhida njayantamajma pramrinanta
    mojasa | imagm sajata anuvira yadhvamindragm sakhayo 'nu sarabhadhvam | balavijnaya ssthavirah pravira
    ssahasvan vaji sahamana ugrah | abhiviro abhisatva sahoja jaitramindra rathamatishtha govit | abhi
    gotrani sahasa gahamano manyurindrah | dushcyavanah pritanashada yuddhyo 'smakagm sena avatu prayuthsu
    | indra asa nneta brihaspati rdakshina yajnah pura etu somah | devasenana mmaruto yantvagre | indrasya
    vrishno varunasya rajna adityana mmarutagm shardha ugram | mahamanasa njayata mudasthat | asmaka ya~
    ishavasta jayantu | vi~ra uttare bhavantvasmanu deva avata haveshu | uddhar mmahagmsi | udvritrahan
    vajinam njayatametu ghoshah | upapreta jayata nara ssthira vah santu bahavah | indro va 'satha | avasrishta
    parapata sharavye brahma sagmshita | gacchamitra nkancanocchishah | marmani te varmabhishcha dayami
    somastva raja bhivastam | uro rvariyo varivaste astu jayanta ntvamanu madantu devah | yatra bana ssampatanti
    kumara vishikha iva | indro nastatra vritraha vishvaha sharma yacchatu || nnamo bhagavate rudraya
    || ashushshishano
  devanagari: श्शिशा॑नो वृष॒भो न यु॒ध्मो घ॑नाघ॒नः षणी॒नाम् । स॒॒ङ्क्रन्द॑नो ऽनिमि॒ष ए॑क वी॒रश्श॒तग्ं सेना॑
    अजयथ्सा॒ कमिन्द्रः॑ । स॒ङ्क्रन्द॑नेना निमि॒षेण॑ जि॒ष्णुना॑ युत्का॒रेण॑ दुश्च्यव॒नेन॑ धृ॒ष्णुना । तदिन्द्रे॑ण
    जयत॒ तथ्स॑हध्वं॒ युँधो॑ नर॒ इषु॑ हस्तेन॒ वृष्णा स्स नि॑ष॒ङ्गिभि॑ र्व॒शी सग्ग् स्र॑ष्टा॒ सयुध॒ इन्द्रो॑
    ग॒णेन॑ । स॒ग्ं॒सृ॒ष्ट॒ जिथ्सो॑म॒पा बा॑हु श॒र्ध्यू । बृह॑स्पते॒ परि॑दीया॒ रथे॑न रक्षो॒हा ऽमित्राग्ं॑
    अप॒ बाध॑मानः । प्रमृ॒णो यु॒धा जय॑न्न॒स्माक॑ मेद्ध्यवि॒ता रथा॑नाम् । गो॒त्र॒भिद॑ ञ्जय॑न्त॒मज्म॑ प्रमृ॒णन्त॒
    मोज॑सा । इ॒मग्ं स॑जाता॒ अनु॑वीर यध्व॒मिन्द्रग्ं॑ सखा॒यो ऽनु॒ सर॑भध्वम् । ब॒ल॒वि॒ज्ञा॒य स्स्थवि॑रः॒
    प्रवी॑र॒ स्सह॑स्वान् वा॒जी सह॑मान उ॒ग्रः । अ॒भिवी॑रो अ॒भिस॑त्वा सहो॒जा जैत्र॑मिन्द्र॒ रथ॒माति॑ष्ठ
    गो॒वित् । अ॒भि गो॒त्राणि॒ सह॑सा॒ गाह॑मानो म॑न्यु॒रिन्द्रः॑ । दु॒श्च्य॒व॒नः पृ॑तना॒षाड॑ यु॒द्ध्यो ऽस्माक॒ग्ं॒
    सेना॑ अवतु॒ प्रयु॒थ्सु । इन्द्र॑ आसा न्ने॒ता बृह॒स्पति॒ र्दक्षि॑णा य॒ज्ञः पु॒र ए॑तु॒ सोमः॑ । दे॒व॒से॒नाना॑
    म्म॒रुतो॑ य॒न्त्वग्रे । इन्द्र॑स्य॒ वृष्णो॒ वरु॑णस्य॒ राज्ञ॑ आदि॒त्याना म्म॒रुता॒ग्ं॒ शर्ध॑ उ॒ग्रम्
    । म॒हाम॑नसा ञ्जय॑ता॒ मुद॑स्थात् । अ॒स्माक॒ याँ इष॑व॒स्ता ज॑यन्तु । वीँ॒रा उत्त॑रे भवन्त्व॒स्मानु॑
    देवा अवता॒ हवे॑षु । उद्ध॑र् म्महाग्ं॑सि । उद्वृ॑त्रहन् वा॒जिनां॒ ञ्जय॑तामेतु॒ घोषः॑ । उप॒प्रेत॒ जय॑ता
    नर स्स्थि॒रा वः॑ सन्तु बा॒हवः॑ । इन्द्रो॑ व॒ ऽस॑थ । अव॑सृष्टा॒ परा॑पत॒ शर॑व्ये॒ ब्रह्म॑ सग्ंशिता ।
    गच्छा॒मित्रा॒ ङ्कञ्च॒नोच्छि॑षः । मर्मा॑णि ते॒ वर्म॑भिश्छा दयामि॒ सोम॑स्त्वा॒ राजा॒ भिव॑स्ताम् । उ॒रो
    र्वरी॑यो॒ वरि॑वस्ते अस्तु॒ जय॑न्त॒ न्त्वामनु॑ मदन्तु दे॒वाः । यत्र॑ बा॒णा स्स॒म्पत॑न्ति कुमा॒रा वि॑शि॒खा
    इ॑व । इन्द्रो॑ न॒स्तत्र॑ वृत्र॒हा वि॑श्वा॒हा शर्म॑ यच्छतु ॥ न्नमो भगवते॑ रुद्रा॒य ॥ आशुश्शिशानो
