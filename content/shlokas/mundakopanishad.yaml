id: mundakopanishad
category: upanishad
name:
  english: mundakopanishad
  devanagari: मुण्डकोपनिषद्
content:
  english: upanishad || mundakopanishat || || shrih || || mundakopanishat || om bhadram karnebhih shrunuyama
    deva bhadram pashyemakshabhiryajatrah | sthirairangaistushtuva~sastanubhirvyashema devahitam yadayuh
    | svasti na indro vriddhashravah svasti nah pusha vishvavedah | svasti nastarkshyo arishtanemih svasti
    no brihaspatirdadhatu | || om shantih shantih shantih || || om brahmane namah || || prathamamundake
    prathamah khandah || om brahma devanam prathamah sambabhuva vishvasya karta bhuvanasya gopta | sa
    brahmavidyam sarvavidyapratishthamatharvaya jyeshthaputraya praha || 1
  devanagari: उपनिषद् ॥ मुण्डकोपनिषत् ॥ ॥ श्रीः ॥ ॥ मुण्डकोपनिषत् ॥ ॐ भद्रं कर्णेभिः श्रुणुयाम देवा भद्रं
    पश्येमाक्षभिर्यजत्राः । स्थिरैरङ्गैस्तुष्टुवाँसस्तनूभिर्व्यशेम देवहितं यदायुः । स्वस्ति न इन्द्रो
    वृद्धश्रवाः स्वस्ति नः पूषा विश्ववेदाः । स्वस्ति नस्तार्क्ष्यो अरिष्टनेमिः स्वस्ति नो बृहस्पतिर्दधातु
    । ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ ॥ ॐ ब्रह्मणे नमः ॥ ॥ प्रथममुण्डके प्रथमः खण्डः ॥ ॐ ब्रह्मा देवानां
    प्रथमः संबभूव विश्वस्य कर्ता भुवनस्य गोप्ता । स ब्रह्मविद्यां सर्वविद्याप्रतिष्ठामथर्वाय ज्येष्ठपुत्राय
    प्राह ॥ १
meaning: {}
