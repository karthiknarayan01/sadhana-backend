id: narayaniyam-dashaka-63
category: stotram
name:
  english: Narayaniyam Dashaka 63
content:
  english: dadrishire kila tatkshanamakshata stanitajrimbhitakampitadiktatah | sushamaya bhavadangatulam
    gata vrajapadopari varidharastvaya || || vipulakarakamishraistoyadharanipatai rdishidishi pashupanam
    mandale dandyamane | kupitaharikritannah pahi pahiti tesham vacanamajita shrinvan ma bibhitetyabhanih
    || || kula iha khalu gotro daivatam gotrashatro rvihatimiha sa rundhyat ko nu vah samshayo'smin |
    iti sahasitavadi deva govarddhanadrim tvaritamudamumulo mulato baladorbhyam || || tadanu girivarasya
    proddhritasyasya tavat sikatilamridudeshe durato varitape | parikaraparimishran dhenugopanadhasta
    dupanidadhadadhattha hastapadmena shailam || || bhavati vidhritashaile balikabhirvayasyai rapi vihitavilasam
    kelilapadilole | savidhamilitadhenurekahastena kandu yati sati pashupalastoshamaishanta sarve || ||
    atimahan giriresha tu vamake karasaroruhi tam dharate ciram | kimidamadbhutamadribalam nviti tvadavalokibhirakathi
    gopakaih || || ahaha dharshtyamamushya vatorgirim vyathitabahurasavavaropayet | iti haristvayi baddhavigarhano
    divasasaptakamugramavarshayat || || acalati tvayi deva padat padam galitasarvajale ca ghanotkare |
    apahrite maruta marutam pati stvadabhishankitadhih samupadravat || || shamamupeyushi varshabhare tada
    pashupadhenukule ca vinirgate | bhuvi vibho samupahitabhudharah pramuditaih pashupaih parirebhishe
    || || dharanimeva pura dhritavanasi kshitidharoddharane tava kah shramah | iti nutastridashaih kamalapate
    gurupuralaya palaya mam gadat ||
  devanagari: ददृशिरे किल तत्क्षणमक्षत स्तनितजृम्भितकम्पितदिक्तटाः । सुषमया भवदङ्गतुलां गता व्रजपदोपरि
    वारिधरास्त्वया ॥ ॥ विपुलकरकमिश्रैस्तोयधारानिपातै र्दिशिदिशि पशुपानां मण्डले दण्ड्यमाने । कुपितहरिकृतान्नः
    पाहि पाहीति तेषां वचनमजित शृण्वन् मा बिभीतेत्यभाणीः ॥ ॥ कुल इह खलु गोत्रो दैवतं गोत्रशत्रो र्विहतिमिह
    स रुन्ध्यात् को नु वः संशयोऽस्मिन् । इति सहसितवादी देव गोवर्द्धनाद्रिं त्वरितमुदमुमूलो मूलतो बालदोर्भ्याम्
    ॥ ॥ तदनु गिरिवरस्य प्रोद्धृतस्यास्य तावत् सिकतिलमृदुदेशे दूरतो वारितापे । परिकरपरिमिश्रान् धेनुगोपानधस्ता
    दुपनिदधदधत्था हस्तपद्मेन शैलम् ॥ ॥ भवति विधृतशैले बालिकाभिर्वयस्यै रपि विहितविलासं केलिलापादिलोले
    । सविधमिलितधेनूरेकहस्तेन कण्डू यति सति पशुपालास्तोषमैषन्त सर्वे ॥ ॥ अतिमहान् गिरिरेष तु वामके करसरोरुहि
    तं धरते चिरम् । किमिदमद्भुतमद्रिबलं न्विति त्वदवलोकिभिराकथि गोपकैः ॥ ॥ अहह धार्ष्ट्यममुष्य वटोर्गिरिं
    व्यथितबाहुरसाववरोपयेत् । इति हरिस्त्वयि बद्धविगर्हणो दिवससप्तकमुग्रमवर्षयत् ॥ ॥ अचलति त्वयि देव पदात्
    पदं गलितसर्वजले च घनोत्करे । अपहृते मरुता मरुतां पति स्त्वदभिशङ्कितधीः समुपाद्रवत् ॥ ॥ शममुपेयुषि
    वर्षभरे तदा पशुपधेनुकुले च विनिर्गते । भुवि विभो समुपाहितभूधरः प्रमुदितैः पशुपैः परिरेभिषे ॥ ॥ धरणिमेव
    पुरा धृतवानसि क्षितिधरोद्धरणे तव कः श्रमः । इति नुतस्त्रिदशैः कमलापते गुरुपुरालय पालय मां गदात् ॥
