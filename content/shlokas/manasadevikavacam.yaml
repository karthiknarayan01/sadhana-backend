id: manasadevikavacam
category: kavacha
name:
  english: manasadevikavacam
  devanagari: मनसादेवीकवचम्
content:
  english: rinu devi pravakshyami kavacam paramadbhutam | cintapurnimanasyastu sarvarakshakaram shubham
    || 5|| kashyapa rishirakhyato'nushtupchanda udahritam | devata manasambakhya kavace'smin prakirtita
    || 6|| gopaniyam prayatnena sadhakairbhaktitatparaih | na datavyam duracarairnastikaya kadacana ||
    7|| manasamba shirah patu padmavatyatha murdhani | kashyapatmajika patu lalatam lokapujita || 8||
    vaishnavi me drishau patu trinetra bhruyugam mama | jagatgauri shruti patu sarvashabdaprakashini ||
    9|| vishahari nasikam patu vadanam mangalaprada | siddhayoginika jihvam dantan patu dayamayi || 10||
    raktavarna ca me kantham candracudanvita tatha | nagamaladhara skandhau patu nageshapujita || 11||
    caturbhuja bhujau patu padmahasta karadvayam | abhayaprada me nityam karangulyah shivapriya || 12||
    phanirajavara patu vakshahsthalamanuttamam | dharmendrarajagrihini hridayam me sadavatu || 13|| jagatkarupriya
    devi parshvayugmam sadavatu | astikajanani patu nabhim me nagavallabha || 14|| mangalacandika patu
    katim me siddhidayini | yogamaya guhyadesham rahasyam parirakshatu || 15|| raktambara sakthini me
    januni padmadharini | mahanageshvari janghe patu bhaktarthasiddhida || 16|| vishashantikari gulphau
    padau padmavati mama | nakhan nagapriya patu padatalam shubhaprada || 17|| pracyam mam manasa patvagneyyam
    siddhayogini | dakshine mangala patu nairrityam nagasundari || 18|| varunyam vishahantri ca vayavyam
    padmalocana | udicyam kashyapasuta aishanyam jagadambika || 19|| urdhve nageshvari patvadhastatpadmavasini
    | antarbahishca mam patu cintapurna nirantaram || 20|| jale sthale ca gahane parvate kanane'pi ca
    | manasamba sada patu vishadoshabhayapaha || 21|| svapne jagarane caiva dhyane japaparayanah | rakshatu
    pranasantanam nagini nagarakshini || 22|| rajadvare sabhamadhye sangrame shatrusankate | cintapurna
    sada patu bhaktam me bhayavarjitam || 23|| daridrye duhkhasampate rogapidasamagame | mangalacandika
    patu sarvada karunanidhih || 24|| grahapidasu sarvasu bhutapretabhayeshu ca | dharmendrarajamahishi
    mam patu parameshvari || 25|| sarvangam sarvada patu sarvajneshvaravallabha | manasamba mahadevi nityam
    me kavaceshvari || 26|| phalashrutih | idam kavacamajnatva yo japenmanasam param | tasya siddhirna
    jayeta kalpakotishatairapi || 27|| kavacenavrito mantri japenmantramananyadhih | tada prasadamapnoti
    manasambaprasadatah || 28|| yah pathetpratarutthaya shucirbhutva samahitah | tasya vighnah pranashyanti
    himavadbhaskarodayat || 29|| madhyahne bhaktibhavena sayam va shraddhayanvitah | kavacasyasya pathena
    devi tushyati nityashah || 30|| nagadamshabhayam tasya na vishasya ca vikriya | nagapida na capattirbhavetkavacadharinah
    || 31|| kalasarpabhayam ghoram kuladosham tathaiva ca | grahapidam kshanaddevi shamayetkavacapriya
    || 32|| duhsvapnam darunam ghoram daridryam duhkhasancayam | nashayetkavacam divyam dipo'ndhakaramiva
    || 33|| aranye nirjane deshe mahaghore bhayavahe | kavacam smarato nityam na bhayam vidyate kvacit
    || 34|| rajadvare vivadeshu shastrastrasamupasthite | jayameva labhennityam devyah kavacadharakah
    || 35|| sagare parvate vapi durgame kanane'pi ca | margabhramsho na tasyasti rakshita manasayaya ||
    36|| rogino rogamuktah syurduhkhitah sukhabhaginah | nirbala balino devyah kavacasya prabhavatah ||
    37|| aputro labhate putram nirdhano dhanavanbhavet | vidyarthi labhate vidyam yasho labhati manavah
    || 38|| grihe nityam shriyam devi dhanyapurnam prayacchati | kalaho na bhavettatra yatraitatparipathyate
    || 39|| bhutapretapishacashca dakinyo yoginiganah | duradeva palayante vahnerdhuma iva drutam || 40||
    abhicarakritam karma vishayogah krito'pi va | kavacasya prabhavena svayameva vinashyati || 41|| yatraitallikhitam
    devi pujitam bhaktitatparaih | tatra nityam vaseddevi nagarajasamanvita || 42|| svarne raupye tamrapatre
    bhurjapatre'thava punah | likhitva dharayedbhaktya sarvaraksham labhennarah || 43|| kanthe bahau shirodeshe
    hridaye va samahitah | dharayan kavacam divyam sarvatra vijayi bhavet || 44|| yasya grihe bhavedetatkavacam
    pujitam sada | tatra lakshmih sthira nityam mangalam ca dine dine || 45|| alpayurva mahayurva papakarmarato'pi
    va | devikripam samasadya shubhamargam prapadyate || 46|| bhaktihinaya murkhaya nindakaya duratmane
    | na deyam kavacam devi na prakashyam kathancana || 47|| gurubhaktaya shantaya shraddhalave jitatmane
    | shivashaktiparayaiva pradeyam siddhikankshine || 48|| ekavaram pathedyastu punyam varshashatadhikam
    | trivaram yah pathennityam sarvabhishtaphalam labhet || 49|| dashavaram pathennityam sarvavidyavisharadah
    | shatavaram pathenmantri kavacasya prasadatah || 50|| sahasrapathanadasya mantrasiddhih prajayate
    | manasambaprasadena natra karya vicarana || 51|| ityetatkathitam devi cintapurnimanahkavacam | rahasyam
    sarvatantreshu gopaniyam prayatnatah || 52|| iti manasatantre tritiyapatale manasadevikavacam sampurnam
    |
  devanagari: ृणु देवि प्रवक्ष्यामि कवचं परमाद्भुतम् । चिन्तापूर्णिमनस्यास्तु सर्वरक्षाकरं शुभम् ॥ ५॥
    कश्यप ऋषिराख्यातोऽनुष्टुप्छन्द उदाहृतम् । देवता मानसाम्बाख्या कवचेऽस्मिन् प्रकीर्तिता ॥ ६॥ गोपनीयं
    प्रयत्नेन साधकैर्भक्तितत्परैः । न दातव्यं दुराचारैर्नास्तिकाय कदाचन ॥ ७॥ मानसाम्बा शिरः पातु पद्मावत्यथ
    मूर्धनि । कश्यपात्मजिका पातु ललाटं लोकपूजिता ॥ ८॥ वैष्णवी मे दृशौ पातु त्रिनेत्रा भ्रूयुगं मम । जगत्गौरी
    श्रुती पातु सर्वशब्दप्रकाशिनी ॥ ९॥ विषहरी नासिकां पातु वदनं मङ्गलप्रदा । सिद्धयोगिनिका जिह्वां दन्तान्
    पातु दयामयी ॥ १०॥ रक्तवर्णा च मे कण्ठं चन्द्रचूडान्विता तथा । नागमालाधरा स्कन्धौ पातु नागेशपूजिता
    ॥ ११॥ चतुर्भुजा भुजौ पातु पद्महस्ता करद्वयम् । अभयप्रदा मे नित्यं कराङ्गुल्यः शिवप्रिया ॥ १२॥ फणिराजवरा
    पातु वक्षःस्थलमनुत्तमम् । धर्मेन्द्रराजगृहिणी हृदयं मे सदावतु ॥ १३॥ जगत्कारुप्रिया देवी पार्श्वयुग्मं
    सदावतु । आस्तीकजननी पातु नाभिं मे नागवल्लभा ॥ १४॥ मङ्गलचण्डिका पातु कटिं मे सिद्धिदायिनी । योगमाया
    गुह्यदेशं रहस्यं परिरक्षतु ॥ १५॥ रक्ताम्बरा सक्थिनी मे जानुनी पद्मधारिणी । महानागेश्वरी जङ्घे पातु
    भक्तार्थसिद्धिदा ॥ १६॥ विषशान्तिकरी गुल्फौ पादौ पद्मावती मम । नखान् नागप्रिया पातु पादतलं शुभप्रदा
    ॥ १७॥ प्राच्यां मां मानसा पात्वाग्नेय्यां सिद्धयोगिनी । दक्षिणे मङ्गला पातु नैरृत्यां नागसुन्दरी ॥
    १८॥ वारुण्यां विषहन्त्री च वायव्यां पद्मलोचना । उदीच्यां कश्यपसुता ऐशान्यां जगदम्बिका ॥ १९॥ ऊर्ध्वे
    नागेश्वरी पात्वधस्तात्पद्मवासिनी । अन्तर्बहिश्च मां पातु चिन्तापूर्णा निरन्तरम् ॥ २०॥ जले स्थले च
    गहने पर्वते काननेऽपि च । मानसाम्बा सदा पातु विषदोषभयापहा ॥ २१॥ स्वप्ने जागरणे चैव ध्याने जपपरायणः
    । रक्षतु प्राणसन्तानं नागिनी नागरक्षिणी ॥ २२॥ राजद्वारे सभामध्ये सङ्ग्रामे शत्रुसङ्कटे । चिन्तापूर्णा
    सदा पातु भक्तं मे भयवर्जितम् ॥ २३॥ दारिद्र्ये दुःखसम्पाते रोगपीडासमागमे । मङ्गलचण्डिका पातु सर्वदा
    करुणानिधिः ॥ २४॥ ग्रहपीडासु सर्वासु भूतप्रेतभयेषु च । धर्मेन्द्रराजमहिषी मां पातु परमेश्वरी ॥ २५॥
    सर्वाङ्गं सर्वदा पातु सर्वज्ञेश्वरवल्लभा । मानसाम्बा महादेवी नित्यं मे कवचेश्वरी ॥ २६॥ फलश्रुतिः ।
    इदं कवचमज्ञात्वा यो जपेन्मानसां पराम् । तस्य सिद्धिर्न जायेत कल्पकोटिशतैरपि ॥ २७॥ कवचेनावृतो मन्त्री
    जपेन्मन्त्रमनन्यधीः । तदा प्रसादमाप्नोति मानसाम्बाप्रसादतः ॥ २८॥ यः पठेत्प्रातरुत्थाय शुचिर्भूत्वा
    समाहितः । तस्य विघ्नाः प्रणश्यन्ति हिमवद्भास्करोदयात् ॥ २९॥ मध्याह्ने भक्तिभावेन सायं वा श्रद्धयान्वितः
    । कवचस्यास्य पाठेन देवी तुष्यति नित्यशः ॥ ३०॥ नागदंशभयं तस्य न विषस्य च विक्रिया । नागपीडा न चापत्तिर्भवेत्कवचधारिणः
    ॥ ३१॥ कालसर्पभयं घोरं कुलदोषं तथैव च । ग्रहपीडां क्षणाद्देवी शमयेत्कवचप्रिया ॥ ३२॥ दुःस्वप्नं दारुणं
    घोरं दारिद्र्यं दुःखसञ्चयम् । नाशयेत्कवचं दिव्यं दीपोऽन्धकारमिव ॥ ३३॥ अरण्ये निर्जने देशे महाघोरे
    भयावहे । कवचं स्मरतो नित्यं न भयं विद्यते क्वचित् ॥ ३४॥ राजद्वारे विवादेषु शस्त्रास्त्रसमुपस्थिते
    । जयमेव लभेन्नित्यं देव्याः कवचधारकः ॥ ३५॥ सागरे पर्वते वापि दुर्गमे काननेऽपि च । मार्गभ्रंशो न तस्यास्ति
    रक्षिता मानसायया ॥ ३६॥ रोगिणो रोगमुक्ताः स्युर्दुःखिताः सुखभागिनः । निर्बला बलिनो देव्याः कवचस्य प्रभावतः
    ॥ ३७॥ अपुत्रो लभते पुत्रं निर्धनो धनवान्भवेत् । विद्यार्थी लभते विद्यां यशो लभति मानवः ॥ ३८॥ गृहे
    नित्यं श्रियं देवी धान्यपूर्णां प्रयच्छति । कलहो न भवेत्तत्र यत्रैतत्परिपठ्यते ॥ ३९॥ भूतप्रेतपिशाचाश्च
    डाकिन्यो योगिनीगणाः । दूरादेव पलायन्ते वह्नेर्धूम इव द्रुतम् ॥ ४०॥ अभिचारकृतं कर्म विषयोगः कृतोऽपि
    वा । कवचस्य प्रभावेण स्वयमेव विनश्यति ॥ ४१॥ यत्रैतल्लिखितं देवि पूजितं भक्तितत्परैः । तत्र नित्यं
    वसेद्देवी नागराजसमन्विता ॥ ४२॥ स्वर्णे रौप्ये ताम्रपत्रे भूर्जपत्रेऽथवा पुनः । लिखित्वा धारयेद्भक्त्या
    सर्वरक्षां लभेन्नरः ॥ ४३॥ कण्ठे बाहौ शिरोदेशे हृदये वा समाहितः । धारयन् कवचं दिव्यं सर्वत्र विजयी
    भवेत् ॥ ४४॥ यस्य गृहे भवेदेतत्कवचं पूजितं सदा । तत्र लक्ष्मीः स्थिरा नित्यं मङ्गलं च दिने दिने ॥ ४५॥
    अल्पायुर्वा महायुर्वा पापकर्मरतोऽपि वा । देवीकृपां समासाद्य शुभमार्गं प्रपद्यते ॥ ४६॥ भक्तिहीनाय मूर्खाय
    निन्दकाय दुरात्मने । न देयं कवचं देवि न प्रकाश्यं कथञ्चन ॥ ४७॥ गुरुभक्ताय शान्ताय श्रद्धालवे जितात्मने
    । शिवशक्तिपरायैव प्रदेयं सिद्धिकाङ्क्षिणे ॥ ४८॥ एकवारं पठेद्यस्तु पुण्यं वर्षशताधिकम् । त्रिवारं यः
    पठेन्नित्यं सर्वाभीष्टफलं लभेत् ॥ ४९॥ दशवारं पठेन्नित्यं सर्वविद्याविशारदः । शतवारं पठेन्मन्त्री कवचस्य
    प्रसादतः ॥ ५०॥ सहस्रपठनादस्य मन्त्रसिद्धिः प्रजायते । मानसाम्बाप्रसादेन नात्र कार्या विचारणा ॥ ५१॥
    इत्येतत्कथितं देवि चिन्तापूर्णिमनःकवचम् । रहस्यं सर्वतन्त्रेषु गोपनीयं प्रयत्नतः ॥ ५२॥ इति मनसातन्त्रे
    तृतीयपटले मनसादेवीकवचं सम्पूर्णम् ।
