id: govindastotram-2
category: stotram
name:
  english: govindastotram
  devanagari: गोविन्दस्तोत्रम्
content:
  english: shri kalyani devi viracitam | shrivara balaka rinkhanatatpara padmadalayatalocana deva | kuntalasantatirajitasanmukha
    devakinandana govinda vande || 1|| hatakanupurashakvaripurvakabhushanabhushita shyamaladeha | kuntalasantatirajitasanmukha
    devakinandana govinda vande || 2|| devakinandana nandavandita madhvavibhishanasandrasaroja | kuntalasantatirajitasanmukha
    devakinandana govinda vande || 3|| advayavikrama govindakinkara shrimadhvavallabha gurutara namah
    | kuntalasantatirajitasanmukha devakinandana govinda vande || 4|| || iti shrimatkalyanidevi viracitam
    govindastotram sampurnam ||
  devanagari: श्री कल्याणी देवी विरचितम् । श्रीवर बालक रिङ्खणतत्पर पद्मदलायतलोचन देव । कुन्तलसन्ततिराजितसन्मुख
    देवकिनन्दन गोविन्द वन्दे ॥ १॥ हाटकनूपुरशक्वरिपूर्वकभूषणभूषित श्यामलदेह । कुन्तलसन्ततिराजितसन्मुख देवकिनन्दन
    गोविन्द वन्दे ॥ २॥ देवकिनन्दन नन्दवन्दित मध्वविभीषणसान्द्रसरोज । कुन्तलसन्ततिराजितसन्मुख देवकिनन्दन
    गोविन्द वन्दे ॥ ३॥ अद्वयविक्रम गोविन्दकिङ्कर श्रीमध्ववल्लभ गुरुतर नमः । कुन्तलसन्ततिराजितसन्मुख देवकिनन्दन
    गोविन्द वन्दे ॥ ४॥ ॥ इति श्रीमत्कल्याणीदेवी विरचितं गोविन्दस्तोत्रं संपूर्णम् ॥
meaning: {}
