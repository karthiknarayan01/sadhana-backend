id: ketu-graha-pancharatna-stotram
category: stotram
name:
  english: Ketu Graha Pancharatna Stotram
content:
  english: phalasha pushpasankasham tarakagraha mastakam | raudram raudratmakam ghoram tam ketum pranamamyaham
    || || dhumra varnam dhvajakaram dvibhujam varadangadam | vaidhuryabharanam caiva vaidhuryamakutam
    phanim || || antyagraho mahashirshi suryarih pushpavargrahi | gridhranana gatam nityam dhyayet sarvaphalastaye
    || || patunetra pingalakshah shrutime raktalocanah | patukantham came ketuh skandau patugrahadhipah
    || || pranamami sadadevam dhvajakaram graheshvaram | citrambaradharam devam tam ketum pranamamyaham
    ||
  devanagari: फलाश पुष्पसङ्काशं तारकाग्रह मस्तकम् । रौद्रं रौद्रात्मकं घोरं तं केतुं प्रणमाम्यहम् ॥ ॥
    धूम्र वर्णां ध्वजाकारं द्विभुजं वरदाङ्गदम् । वैढूर्याभरणं चैव वैढूर्यमकुटं फणिम् ॥ ॥ अन्त्यग्रहो महाशीर्षि
    सूर्यारिः पुष्पवर्ग्रही । गृध्रानन गतं नित्यं ध्यायेत् सर्वफलास्तये ॥ ॥ पातुनेत्र पिङ्गलाक्षः श्रुतिमे
    रक्तलोचनः । पातुकण्ठं चमे केतुः स्कन्दौ पातुग्रहाधिपः ॥ ॥ प्रणमामि सदादेवं ध्वजाकारं ग्रहेश्वरम् ।
    चित्राम्बरधरं देवं तं केतुं प्रणमाम्यहम् ॥
