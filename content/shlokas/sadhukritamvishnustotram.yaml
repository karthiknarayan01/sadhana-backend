id: sadhukritamvishnustotram
category: stotram
name:
  english: sadhukritamvishnustotram
  devanagari: साधुकृतंविष्णुस्तोत्रम्
content:
  english: sadhukritam vishnustotram sadhuruvaca | satyarupam satyasandham satyanarayanam harim | yatsatyatvena
    jagatastam satyam tvam namamyaham || 48|| tvanmayamohitatmano na pashyantyatmanah shubham | duhkhambhodhau
    sada magna duhkhe ca sukhamaninah || 49|| mudhoham dhanagarvena madandhikritalocanah | na jane svatmanah
    kshemam katham pashyami mudhadhih || 50|| kshamasva mama dauratmyam tapodhamne hare namah | ajnapayatmadasyam
    me yena te caranau smare || 51|| iti bavishyapurane pratisargaparvani dvitiyakhande ekonatrimshadhyayantargatam
    sadhukritam vishnustotram samaptam | bhavishyapurana | pratisargaparva | dvitiyakhanda | adhyaya 29
  devanagari: साधुकृतं विष्णुस्तोत्रम् साधुरुवाच । सत्यरूपं सत्यसन्धं सत्यनारायणं हरिम् । यत्सत्यत्वेन
    जगतस्तं सत्यं त्वां नमाम्यहम् ॥ ४८॥ त्वन्मायामोहितात्मानो न पश्यन्त्यात्मनः शुभम् । दुःखाम्भोधौ सदा
    मग्ना दुःखे च सुखमानिनः ॥ ४९॥ मूढोहं धनगर्वेण मदान्धीकृतलोचनः । न जाने स्वात्मनः क्षेमं कथं पश्यामि
    मूढधीः ॥ ५०॥ क्षमस्व मम दौरात्म्यं तपोधाम्ने हरे नमः । आज्ञापयात्मदास्यं मे येन ते चरणौ स्मरे ॥ ५१॥
    इति बविष्यपुराणे प्रतिसर्गपर्वणि द्वितीयखण्डे एकोनत्रिंशाध्यायान्तर्गतं साधुकृतं विष्णुस्तोत्रं समाप्तम्
    । भविष्यपुराण । प्रतिसर्गपर्व । द्वितीयखण्ड । अध्याय २९
meaning: {}
