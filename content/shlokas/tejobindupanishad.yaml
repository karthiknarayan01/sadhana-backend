id: tejobindupanishad
category: upanishad
name:
  english: tejobindupanishad
  devanagari: तेजोबिन्दूपनिषद्
content:
  english: nidagho nama vai munih papraccha ribhum bhagavantamatmanatmavivekamanubruhiti | sa hovaca ribhuh|
    sarvavaco'vadhirbrahma sarvacintavadhirguruh | sarvakaranakaryatma karyakaranavarjitah || 1 || sarvasankalparahitah
    sarvanadamayah shivah | sarvavarjitacinmatrah sarvanandamayah parah || 2 || sarvatejahprakashatma
    nadanandamayatmakah | sarvanubhavanirmuktah sarvadhyanavivarjitah || 3 || sarvanadakalatita esha atmahamavyayah
    | atmanatmavivekadibhedabhedavivarjitah || 4 || shantashantadihinatma nadantarjyotirupakah | mahavakyarthato
    duro brahmasmityatiduratah || 5 || tacchabdavarjyastvamshabdahino vakyarthavarjitah | ksharaksharavihino
    yo nadantarjyotireva sah || 6 || akhandaikaraso vahamanando'smiti varjitah | sarvatitasvabhavatma
    nadantarjyotireva sah || 7 || atmeti shabdahino ya atmashabdarthavarjitah | saccidanandahino ya eshaivatma
    sanatanah || 8 || sa nirdeshtumashakyo yo vedavakyairagamyatah | yasya kincidbahirnasti kincidantah
    kiyanna ca || 9 || yasya lingam prapancam va brahmaivatma na samshayah | nasti yasya shariram va jivo
    va bhutabhautikah || 10 || namarupadikam nasti bhojyam va bhogabhukca va | sadva'sadva sthitirvapi
    yasya nasti ksharaksharam || 11 || gunam va vigunam vapi sama atma na samshayah | yasya vacyam vacakam
    va shravanam mananam ca va || 12 || gurushishyadibhedam va devalokah surasurah | yatra dharmamadharmam
    va shuddham vashuddhamanvapi || 13 || yatra kalamakalam va nishcayah samshayo na hi | yatra mantramamantram
    va vidyavidye na vidyate || 14 || drashtridarshanadrishyam va ishanmatram kalatmakam | anatmeti prasango
    va hyanatmeti mano'pi va || 15 || anatmeti jagadvapi nasti nasti nishcinu | sarvasankalpashunyatvatsarvakaryavivarjanat
    || 16 || kevalam brahmamatratvannastyanatmeti nishcinu | dehatrayavihinatvatkalatrayavivarjanat ||
    17 || jivatrayagunabhavattapatrayavivarjanat | lokatrayavihinatvatsarvamatmeti shasanat || 18 || cittabhaccintaniyam
    dehabhavajjara na ca | padabhavadgatirnasti hastabhavatkriya na ca || 19 || mrityurnasti janabhavadbuddhyabhavatsukhadikam
    | dharmo nasti shucirnasti satyam nasti bhayam na ca || 20 || aksharoccaranam nasti gurushishyadi
    nastyapi | ekabhave dvitiyam na na dvitiye na caikata || 21 || satyatvamasti cetkincidasatyam na ca
    sambhavet | asatyatvam yadi bhavetsatyatvam na ghatishyati || 22 || shubham yadyashubham viddhi ashubhacchubhamishyate
    | bhayam yadyabhavam viddhi abhayadbhayamapatet || 23 || bandhatvamapi cenmoksho bandhabhave kva mokshata
    | maranam yadi cejjanma janmabhave mritirna ca || 24 || tvamityapi bhaveccaham tvam no cedahameva
    na | idam yadi tadevasti tadabhadidam na ca || 25 || astiti cennasti tada nasti cedasti kincana |
    karyam cetkaranam kincitkaryabhave na karanam || 26 || dvaitam yadi tada'dvaitam dvaitabhave dvayam
    na ca | drishyam yadi drigapyasti drishyabhave drigena na || 27 || antaryadi bahih satyamantabhave
    bahirna ca | purnatvamasti cetkincidapurnatvam prasajyate || 28 || tasmadetatkvacinnasti tvam caham
    va ime idam | nasti drishtantikam satye nasti darshtantikam hyaje || 29 || parambrahmahamasmiti smaranasya
    mano na hi | brahmamatram jagadidam brahmamatram tvamapyaham || 30 || cinmatram kevalam caham nastyanatmyeti
    nishcinu | idam prapancam nastyeva notpannam no sthitam kvacit || 31 || cittam prapancamityahurnasti
    nastyeva sarvada | na prapancam na cittadi nahankaro na jivakah || 32 || mayakaryadikam nasti maya
    nasti bhayam nahi | karta nasti kriya nasti shravanam mananam nahi || 33 || samadhidvitayam nasti
    matrimanadi nasti hi | ajnanam capi nastyeva hyavivekam kadacana || 34 || anubandhacatushkam na sambandhatrayameva
    na | na ganga na gaya seturna bhutam nanyadasti hi || 35 || na bhumirna jalam nagnirna na vayurna
    ca kham kvacit | na deva na ca dikpala na veda na guruh kvacit || 36 || na duram nastikam nalam na
    madhyam na kvacitsthitam | nadvaitam dvaitasatyam va hyasatyam va idam na ca || 37 || bandhamokshadikam
    nasti sadva'sadva sukhadi va | jatirnasti gatirnasti varno nasti na laukikam || 38 || sarvam brahmeti
    nastyeva brahma ityapi nasti hi | cidityeveti nastyeva cidahambhashanam na hi || 39 || aham brahmasmi
    nastyeva nityashuddho'smi na kvacit | vaca yaducyate kincinmanasa manute kvacit || 40 || buddhya nishcinute
    nasti cittena jnayate nahi | yogi yogadikam nasti sada sarvam sada na ca || 41 || ahoratradikam nasti
    snanadhyanadikam nahi | bhrantirabhrantirnastyeva nastyanatmeti nishcinu || 42 || vedashastram puranam
    ca karyam karanamishvarah | loko bhutam janastvaikyam sarvam mithya na samshayah || 43 || bandho mokshah
    sukham duhkham dhyanam cittam surasurah | gaunam mukhyam param canyatsarvam mithya na samshayah ||
    44 || vaca vadati yatkincitsankalpaih kalpyate ca yat | manasa cintyate yadyatsarvam mithya na samshayah
    || 45 || buddhya nishciyate kinciccitte nishciyate kvacit | shastraih prapancyate yadyannetrenaiva
    nirikshyate || 46 || shrotrabhyam shruyate yadyadanyatsadbhavameva ca | netram shrotram gatrameva
    mithyeti ca sunishcitam || 47 || idamityeva nirdishtamayamityeva kalpyate | tvamaham tadidam so'hamanyatsadbhavameva
    ca || 48 || yadyatsambhavyate loke sarvasankalpasambhramah | sarvadhyasam sarvagopyam sarvabhogaprabhedakam
    || 49 || sarvadoshaprabhedacca nastyanatmeti nishcinu | madiyam ca tvadiyam ca mameti ca taveti ca
    || 50 || mahyam tubhyam mayetyadi tatsarvam vitatham bhavet | rakshako vishnurityadi brahma srishtestu
    karanam || 51 || samhare rudra ityevam sarvam mithyeti nishcinu | snanam japastapo homah svadhyayo
    devapujanam || 52 || mantram tantram ca satsango gunadoshavijrimbhanam | antahkaranasadbhava avidyashca
    sambhavah || 53 || anekakotibrahmandam sarvam mithyeti nishcinu | sarvadeshikavakyoktiryena kenapi
    nishcitam || 54 || drishyate jagati yadyadyadyajjagati vikshyate | vartate jagati yadyatsarvam mithyeti
    nishcinu || 55 || yena kenaksharenoktam yena kena vinishcitam | yena kenapi gaditam yena kenapi moditam
    || 56 || yena kenapi yaddattam yena kenapi yatkritam | yatra yatra shubham karma yatra yatra ca dushkritam
    || 57 || yadyatkaroshi satyena sarvam mithyeti nishcinu | tvameva paramatmasi tvameva paramo guruh
    || 58 || tvamevakasharupo'si sakshihino'si sarvada | tvameva sarvabhavo'si tvam brahmasi na samshayah
    || 59 || kalahino'si kalo'si sada brahmasi cidghanah | sarvatah svasvarupo'si caitanyaghanavanasi||
    60 || satyo'si siddho'si sanatano'si mukto'si moksho'si mudamrito'si | devo'si shanto'si niramayo'si
    brahmasi purno'si paratparo'si || 61 || samo'si saccapi sanatano'si satyadivakyaih pratibodhito'si
    | sarvangahino'si sada sthito'si brahmendrarudradivibhavito'si || 62 || sarvaprapancabhramavarjito'si
    sarveshu bhuteshu ca bhasito'si | sarvatra sankalpavivarjito'si sarvagamantarthavibhavito'si || 63
    || sarvatra santoshasukhasano'si sarvatra gatyadivivarjito'si | sarvatra lakshyadivivarjito'si dhyato'si
    vishnvadisurairajasram || 64 || cidakarasvarupo'si cinmatro'si nirankushah | atmanyeva sthito'si tvam
    sarvashunyo'si nirgunah || 65 || anando'si paro'si tvameka evadvitiyakah | cidghananandarupo'si paripurnasvarupakah
    || 66 || sadasi tvamasi jno'si so'si janasi vikshasi | saccidanandarupo'si vasudevo'si vai prabhuh
    || 67 || amrito'si vibhushcasi cancalo hyacalo hyasi | sarvo'si sarvahino'si shantashantavivarjitah
    || 68 || sattamatraprakasho'si sattasamanyako hyasi | nityasiddhisvarupo'si sarvasiddhivivarjitah
    || 69 || ishanmatravishunyo'si anumatravivarjitah | astitvavarjito'si tvam nastitvadivivarjitah ||
    70 || lakshyalakshanahino'si nirvikaro niramayah | sarvanadantaro'si tvam kalakashthavivarjitah ||
    71 || brahmavishnvishahino'si svasvarupam prapashyasi | svasvarupavashesho'si svanandabdhau nimajjasi
    || 72 || svatmarajye svamevasi svayambhavavivarjitah | shishtapurnasvarupo'si svasmatkincinna pashyasi
    || 73 || svasvarupanna calasi svasvarupena jrimbhasi | svasvarupadananyo'si hyahamevasi nishcinu ||
    74 || idam prapancam yatkincidyadyajjagati vidyate | drishyarupam ca drigrupam sarvam shashavishanavat
    || 75 || bhumirapo'nalo vayuh kham mano buddhireva ca | ahankarashca tejashca lokam bhuvanamandalam
    || 76 || nasho janma ca satyam ca punyapapajayadikam | ragah kamah krodhalobhau dhyanam dhyeyam gunam
    param || 77 || gurushishyopadeshadiradirantam shamam shubham | bhutam bhavyam vartamanam lakshyam
    lakshanamadvayam || 78 || shamo vicarah santosho bhoktribhojyadirupakam | yamadyashtangayogam ca gamanagamanatmakam
    || 79 || adimadhyantarangam ca grahyam tyajyam harih shivah | indriyani manashcaiva avasthatritayam
    tatha || 80 || caturvimshatitattvam ca sadhananam catushtayam | sajatiyam vijatiyam loka bhuradayah
    kramat || 81 || sarvavarnashramacaram mantratantradisamgraham | vidyavidyadirupam ca sarvavedam jadajadam
    || 82 || bandhamokshavibhagam ca jnanavijnanarupakam | bodhabodhasvarupam va dvaitadvaitadibhashanam
    || 83 || sarvavedantasiddhantam sarvashastrarthanirnayam | anekajivasadbhavamekajivadinirnayam ||
    84 || yadyaddhyayati cittena yadyatsankalpate kvacit | buddhya nishciyate yadyadguruna samshrinoti
    yat || 85 || yadyadvaca vyakaroti yadyadacaryabhashanam | yadyatsvarendriyairbhavyam yadyanmimamsate
    prithak || 86 || yadyannyayena nirnitam mahadbhirvedaparagaih | shivah ksharati lokanvai vishnuh pati
    jagattrayam || 87 || brahma srijati lokanvai evamadikriyadikam | yadyadasti puraneshu yadyadvedeshu
    nirnayam || 88 || sarvopanishadam bhavam sarvam shashavishanavat | deho'hamiti sankalpam tadantahkaranam
    smritam || 89 || deho'hamiti sankalpo mahatsamsara ucyate | deho'hamiti sankalpastadbandhamiti cocyate
    || 90 || deho'hamiti sankalpastadduhkhamiti cocyate | deho'hamiti yadbhanam tadeva narakam smritam
    || 91 || deho'hamiti sankalpo jagatsarvamitiryate | deho'hamiti sankalpo hridayagranthiriritih ||
    92 || deho'hamiti yajjnanam tadevajnanamucyate | deho'hamiti yajjnanam tadasadbhavameva ca || 93 ||
    deho'hamiti ya buddhih sa cavidyeti bhanyate | deho'hamiti yajjnanam tadeva dvaitamucyate || 94 ||
    deho'hamiti sankalpah satyajivah sa eva hi | deho'hamiti yajjnanam paricchinnamitiritam || 95 || deho'hamiti
    sankalpo mahapapamiti sphutam | deho'hamiti ya buddhistrishna doshamayah kila || 96 || yatkincidapi
    sankalpastapatrayamitiritam | kamam krodham bandhanam sarvaduhkham vishvam dosham kalananasvarupam
    | yatkincedam sarvasankalpajalam tatkincedam manasam soma viddhi || 97 || mana eva jagatsarvam mana
    eva maharipuh | mana eva hi samsaro mana eva jagattrayam || 98 || mana eva mahadduhkham mana eva jaradikam
    | mana eva hi kalashca mana eva malam tatha || 99 || mana eva hi sankalpo mana eva hi jivakah | mana
    eva hi cittam ca mano'hankara eva ca || 100 || mana eva mahadbandham mano'ntahkaranam ca tat | mana
    eva hi bhumishca mana eva hi toyakam || 101 || mana eva hi tejashca mana eva marunmahan | mana eva
    hi cakasham mana eva hi shabdakam || 102 || sparsham rupam rasam gandham koshah panca manobhavah |
    jagratsvapnasushuptyadi manomayaritiritam || 103 || dikpala vasavo rudra adityashca manomayah | drishyam
    jadam dvandvajatamajnanam manasam smritam || 104 || sankalpameva yatkincittattannastiti nishcinu |
    nasti nasti jagatsarvam gurushishyadikam nahityupanishat || 105 || || shashtho'dhyayah ||
  devanagari: निदाघो नाम वै मुनिः पप्रच्छ ऋभुं भगवन्तमात्मानात्मविवेकमनुब्रूहीति । स होवाच ऋभुः। सर्ववाचोऽवधिर्ब्रह्म
    सर्वचिन्तावधिर्गुरुः । सर्वकारणकार्यात्मा कार्यकारणवर्जितः ॥ १ ॥ सर्वसङ्कल्परहितः सर्वनादमयः शिवः
    । सर्ववर्जितचिन्मात्रः सर्वानन्दमयः परः ॥ २ ॥ सर्वतेजःप्रकाशात्मा नादानन्दमयात्मकः । सर्वानुभवनिर्मुक्तः
    सर्वध्यानविवर्जितः ॥ ३ ॥ सर्वनादकलातीत एष आत्माहमव्ययः । आत्मानात्मविवेकादिभेदाभेदविवर्जितः ॥ ४ ॥
    शान्ताशान्तादिहीनात्मा नादान्तर्ज्योतिरूपकः । महावाक्यार्थतो दूरो ब्रह्मास्मीत्यतिदूरतः ॥ ५ ॥ तच्छब्दवर्ज्यस्त्वंशब्दहीनो
    वाक्यार्थवर्जितः । क्षराक्षरविहीनो यो नादान्तर्ज्योतिरेव सः ॥ ६ ॥ अखण्डैकरसो वाहमानन्दोऽस्मीति वर्जितः
    । सर्वातीतस्वभावात्मा नादान्तर्ज्योतिरेव सः ॥ ७ ॥ आत्मेति शब्दहीनो य आत्मशब्दार्थवर्जितः । सच्चिदानन्दहीनो
    य एषैवात्मा सनातनः ॥ ८ ॥ स निर्देष्टुमशक्यो यो वेदवाक्यैरगम्यतः । यस्य किञ्चिद्बहिर्नास्ति किञ्चिदन्तः
    कियन्न च ॥ ९ ॥ यस्य लिङ्गं प्रपञ्चं वा ब्रह्मैवात्मा न संशयः । नास्ति यस्य शरीरं वा जीवो वा भूतभौतिकः
    ॥ १० ॥ नामरूपादिकं नास्ति भोज्यं वा भोगभुक्च वा । सद्वाऽसद्वा स्थितिर्वापि यस्य नास्ति क्षराक्षरम्
    ॥ ११ ॥ गुणं वा विगुणं वापि सम आत्मा न संशयः । यस्य वाच्यं वाचकं वा श्रवणं मननं च वा ॥ १२ ॥ गुरुशिष्यादिभेदं
    वा देवलोकाः सुरासुराः । यत्र धर्ममधर्मं वा शुद्धं वाशुद्धमण्वपि ॥ १३ ॥ यत्र कालमकालं वा निश्चयः संशयो
    न हि । यत्र मन्त्रममन्त्रं वा विद्याविद्ये न विद्यते ॥ १४ ॥ द्रष्टृदर्शनदृश्यं वा ईषन्मात्रं कलात्मकम्
    । अनात्मेति प्रसङ्गो वा ह्यनात्मेति मनोऽपि वा ॥ १५ ॥ अनात्मेति जगद्वापि नास्ति नास्ति निश्चिनु । सर्वसङ्कल्पशून्यत्वात्सर्वकार्यविवर्जनात्
    ॥ १६ ॥ केवलं ब्रह्ममात्रत्वान्नास्त्यनात्मेति निश्चिनु । देहत्रयविहीनत्वात्कालत्रयविवर्जनात् ॥ १७
    ॥ जीवत्रयगुणाभावात्तापत्रयविवर्जनात् । लोकत्रयविहीनत्वात्सर्वमात्मेति शासनात् ॥ १८ ॥ चित्ताभाच्चिन्तनीयं
    देहाभावाज्जरा न च । पादाभावाद्गतिर्नास्ति हस्ताभावात्क्रिया न च ॥ १९ ॥ मृत्युर्नास्ति जनाभावाद्बुद्ध्यभावात्सुखादिकम्
    । धर्मो नास्ति शुचिर्नास्ति सत्यं नास्ति भयं न च ॥ २० ॥ अक्षरोच्चारणं नास्ति गुरुशिष्यादि नास्त्यपि
    । एकाभावे द्वितीयं न न द्वितीये न चैकता ॥ २१ ॥ सत्यत्वमस्ति चेत्किञ्चिदसत्यं न च संभवेत् । असत्यत्वं
    यदि भवेत्सत्यत्वं न घटिष्यति ॥ २२ ॥ शुभं यद्यशुभं विद्धि अशुभाच्छुभमिष्यते । भयं यद्यभवं विद्धि अभयाद्भयमापतेत्
    ॥ २३ ॥ बन्धत्वमपि चेन्मोक्षो बन्धाभावे क्व मोक्षता । मरणं यदि चेज्जन्म जन्माभावे मृतिर्न च ॥ २४ ॥
    त्वमित्यपि भवेच्चाहं त्वं नो चेदहमेव न । इदं यदि तदेवास्ति तदभादिदं न च ॥ २५ ॥ अस्तीति चेन्नास्ति
    तदा नास्ति चेदस्ति किञ्चन । कार्यं चेत्कारणं किञ्चित्कार्याभावे न कारणम् ॥ २६ ॥ द्वैतं यदि तदाऽद्वैतं
    द्वैताभावे द्वयं न च । दृश्यं यदि दृगप्यस्ति दृश्याभावे दृगेन न ॥ २७ ॥ अन्तर्यदि बहिः सत्यमन्ताभावे
    बहिर्न च । पूर्णत्वमस्ति चेत्किञ्चिदपूर्णत्वं प्रसज्यते ॥ २८ ॥ तस्मादेतत्क्वचिन्नास्ति त्वं चाहं वा
    इमे इदम् । नास्ति दृष्टान्तिकं सत्ये नास्ति दार्ष्टान्तिकं ह्यजे ॥ २९ ॥ परंब्रह्माहमस्मीति स्मरणस्य
    मनो न हि । ब्रह्ममात्रं जगदिदं ब्रह्ममात्रं त्वमप्यहम् ॥ ३० ॥ चिन्मात्रं केवलं चाहं नास्त्यनात्म्येति
    निश्चिनु । इदं प्रपञ्चं नास्त्येव नोत्पन्नं नो स्थितं क्वचित् ॥ ३१ ॥ चित्तं प्रपञ्चमित्याहुर्नास्ति
    नास्त्येव सर्वदा । न प्रपञ्चं न चित्तादि नाहङ्कारो न जीवकः ॥ ३२ ॥ मायाकार्यादिकं नास्ति माया नास्ति
    भयं नहि । कर्ता नास्ति क्रिया नास्ति श्रवणं मननं नहि ॥ ३३ ॥ समाधिद्वितयं नास्ति मातृमानादि नास्ति
    हि । अज्ञानं चापि नास्त्येव ह्यविवेकं कदाचन ॥ ३४ ॥ अनुबन्धचतुष्कं न सम्बन्धत्रयमेव न । न गङ्गा न गया
    सेतुर्न भूतं नान्यदस्ति हि ॥ ३५ ॥ न भूमिर्न जलं नाग्निर्न न वायुर्न च खं क्वचित् । न देवा न च दिक्पाला
    न वेदा न गुरुः क्वचित् ॥ ३६ ॥ न दूरं नास्तिकं नालं न मध्यं न क्वचित्स्थितम् । नाद्वैतं द्वैतसत्यं
    वा ह्यसत्यं वा इदं न च ॥ ३७ ॥ बन्धमोक्षादिकं नास्ति सद्वाऽसद्वा सुखादि वा । जातिर्नास्ति गतिर्नास्ति
    वर्णो नास्ति न लौकिकम् ॥ ३८ ॥ सर्वं ब्रह्मेति नास्त्येव ब्रह्म इत्यपि नास्ति हि । चिदित्येवेति नास्त्येव
    चिदहंभाषणं न हि ॥ ३९ ॥ अहं ब्रह्मास्मि नास्त्येव नित्यशुद्धोऽस्मि न क्वचित् । वाचा यदुच्यते किञ्चिन्मनसा
    मनुते क्वचित् ॥ ४० ॥ बुद्ध्या निश्चिनुते नास्ति चित्तेन ज्ञायते नहि । योगी योगादिकं नास्ति सदा सर्वं
    सदा न च ॥ ४१ ॥ अहोरात्रादिकं नास्ति स्नानध्यानादिकं नहि । भ्रान्तिरभ्रान्तिर्नास्त्येव नास्त्यनात्मेति
    निश्चिनु ॥ ४२ ॥ वेदशास्त्रं पुराणं च कार्यं कारणमीश्वरः । लोको भूतं जनस्त्वैक्यं सर्वं मिथ्या न संशयः
    ॥ ४३ ॥ बन्धो मोक्षः सुखं दुःखं ध्यानं चित्तं सुरासुराः । गौणं मुख्यं परं चान्यत्सर्वं मिथ्या न संशयः
    ॥ ४४ ॥ वाचा वदति यत्किञ्चित्सङ्कल्पैः कल्प्यते च यत् । मनसा चिन्त्यते यद्यत्सर्वं मिथ्या न संशयः ॥
    ४५ ॥ बुद्ध्या निश्चीयते किञ्चिच्चित्ते निश्चीयते क्वचित् । शास्त्रैः प्रपञ्च्यते यद्यन्नेत्रेणैव निरीक्ष्यते
    ॥ ४६ ॥ श्रोत्राभ्यां श्रूयते यद्यदन्यत्सद्भावमेव च । नेत्रं श्रोत्रं गात्रमेव मिथ्येति च सुनिश्चितम्
    ॥ ४७ ॥ इदमित्येव निर्दिष्टमयमित्येव कल्प्यते । त्वमहं तदिदं सोऽहमन्यत्सद्भावमेव च ॥ ४८ ॥ यद्यत्संभाव्यते
    लोके सर्वसङ्कल्पसंभ्रमः । सर्वाध्यासं सर्वगोप्यं सर्वभोगप्रभेदकम् ॥ ४९ ॥ सर्वदोषप्रभेदाच्च नास्त्यनात्मेति
    निश्चिनु । मदीयं च त्वदीयं च ममेति च तवेति च ॥ ५० ॥ मह्यं तुभ्यं मयेत्यादि तत्सर्वं वितथं भवेत् ।
    रक्षको विष्णुरित्यादि ब्रह्मा सृष्टेस्तु कारणम् ॥ ५१ ॥ संहारे रुद्र इत्येवं सर्वं मिथ्येति निश्चिनु
    । स्नानं जपस्तपो होमः स्वाध्यायो देवपूजनम् ॥ ५२ ॥ मन्त्रं तन्त्रं च सत्सङ्गो गुणदोषविजृम्भणम् । अन्तःकरणसद्भाव
    अविद्याश्च संभवः ॥ ५३ ॥ अनेककोटिब्रह्माण्डं सर्वं मिथ्येति निश्चिनु । सर्वदेशिकवाक्योक्तिर्येन केनापि
    निश्चितम् ॥ ५४ ॥ दृश्यते जगति यद्यद्यद्यज्जगति वीक्ष्यते । वर्तते जगति यद्यत्सर्वं मिथ्येति निश्चिनु
    ॥ ५५ ॥ येन केनाक्षरेणोक्तं येन केन विनिश्चितम् । येन केनापि गदितं येन केनापि मोदितम् ॥ ५६ ॥ येन केनापि
    यद्दत्तं येन केनापि यत्कृतम् । यत्र यत्र शुभं कर्म यत्र यत्र च दुष्कृतम् ॥ ५७ ॥ यद्यत्करोषि सत्येन
    सर्वं मिथ्येति निश्चिनु । त्वमेव परमात्मासि त्वमेव परमो गुरुः ॥ ५८ ॥ त्वमेवाकाशरूपोऽसि साक्षिहीनोऽसि
    सर्वदा । त्वमेव सर्वभावोऽसि त्वं ब्रह्मासि न संशयः ॥ ५९ ॥ कालहीनोऽसि कालोऽसि सदा ब्रह्मासि चिद्घनः
    । सर्वतः स्वस्वरूपोऽसि चैतन्यघनवानसि॥ ६० ॥ सत्योऽसि सिद्धोऽसि सनातनोऽसि मुक्तोऽसि मोक्षोऽसि मुदामृतोऽसि
    । देवोऽसि शान्तोऽसि निरामयोऽसि ब्रह्मासि पूर्णोऽसि परात्परोऽसि ॥ ६१ ॥ समोऽसि सच्चापि सनातनोऽसि सत्यादिवाक्यैः
    प्रतिबोधितोऽसि । सर्वाङ्गहीनोऽसि सदा स्थितोऽसि ब्रह्मेन्द्ररुद्रादिविभावितोऽसि ॥ ६२ ॥ सर्वप्रपञ्चभ्रमवर्जितोऽसि
    सर्वेषु भूतेषु च भासितोऽसि । सर्वत्र सङ्कल्पविवर्जितोऽसि सर्वागमान्तार्थविभावितोऽसि ॥ ६३ ॥ सर्वत्र
    सन्तोषसुखासनोऽसि सर्वत्र गत्यादिविवर्जितोऽसि । सर्वत्र लक्ष्यादिविवर्जितोऽसि ध्यातोऽसि विष्ण्वादिसुरैरजस्रम्
    ॥ ६४ ॥ चिदाकारस्वरूपोऽसि चिन्मात्रोऽसि निरङ्कुशः । आत्मन्येव स्थितोऽसि त्वं सर्वशून्योऽसि निर्गुणः
    ॥ ६५ ॥ आनन्दोऽसि परोऽसि त्वमेक एवाद्वितीयकः । चिद्घनानन्दरूपोऽसि परिपूर्णस्वरूपकः ॥ ६६ ॥ सदसि त्वमसि
    ज्ञोऽसि सोऽसि जानासि वीक्षसि । सच्चिदानन्दरूपोऽसि वासुदेवोऽसि वै प्रभुः ॥ ६७ ॥ अमृतोऽसि विभुश्चासि
    चञ्चलो ह्यचलो ह्यसि । सर्वोऽसि सर्वहीनोऽसि शान्ताशान्तविवर्जितः ॥ ६८ ॥ सत्तामात्रप्रकाशोऽसि सत्तासामान्यको
    ह्यसि । नित्यसिद्धिस्वरूपोऽसि सर्वसिद्धिविवर्जितः ॥ ६९ ॥ ईषन्मात्रविशून्योऽसि अणुमात्रविवर्जितः ।
    अस्तित्ववर्जितोऽसि त्वं नास्तित्वादिविवर्जितः ॥ ७० ॥ लक्ष्यलक्षणहीनोऽसि निर्विकारो निरामयः । सर्वनादान्तरोऽसि
    त्वं कलाकाष्ठाविवर्जितः ॥ ७१ ॥ ब्रह्मविष्ण्वीशहीनोऽसि स्वस्वरूपं प्रपश्यसि । स्वस्वरूपावशेषोऽसि स्वानन्दाब्धौ
    निमज्जसि ॥ ७२ ॥ स्वात्मराज्ये स्वमेवासि स्वयंभावविवर्जितः । शिष्टपूर्णस्वरूपोऽसि स्वस्मात्किञ्चिन्न
    पश्यसि ॥ ७३ ॥ स्वस्वरूपान्न चलसि स्वस्वरूपेण जृम्भसि । स्वस्वरूपादनन्योऽसि ह्यहमेवासि निश्चिनु ॥ ७४
    ॥ इदं प्रपञ्चं यत्किञ्चिद्यद्यज्जगति विद्यते । दृश्यरूपं च दृग्रूपं सर्वं शशविषाणवत् ॥ ७५ ॥ भूमिरापोऽनलो
    वायुः खं मनो बुद्धिरेव च । अहङ्कारश्च तेजश्च लोकं भुवनमण्डलम् ॥ ७६ ॥ नाशो जन्म च सत्यं च पुण्यपापजयादिकम्
    । रागः कामः क्रोधलोभौ ध्यानं ध्येयं गुणं परम् ॥ ७७ ॥ गुरुशिष्योपदेशादिरादिरन्तं शमं शुभम् । भूतं भव्यं
    वर्तमानं लक्ष्यं लक्षणमद्वयम् ॥ ७८ ॥ शमो विचारः सन्तोषो भोक्तृभोज्यादिरूपकम् । यमाद्यष्टाङ्गयोगं च
    गमनागमनात्मकम् ॥ ७९ ॥ आदिमध्यान्तरङ्गं च ग्राह्यं त्याज्यं हरिः शिवः । इन्द्रियाणि मनश्चैव अवस्थात्रितयं
    तथा ॥ ८० ॥ चतुर्विंशतितत्त्वं च साधनानां चतुष्टयम् । सजातीयं विजातीयं लोका भूरादयः क्रमात् ॥ ८१ ॥
    सर्ववर्णाश्रमाचारं मन्त्रतन्त्रादिसंग्रहम् । विद्याविद्यादिरूपं च सर्ववेदं जडाजडम् ॥ ८२ ॥ बन्धमोक्षविभागं
    च ज्ञानविज्ञानरूपकम् । बोधाबोधस्वरूपं वा द्वैताद्वैतादिभाषणम् ॥ ८३ ॥ सर्ववेदान्तसिद्धान्तं सर्वशास्त्रार्थनिर्णयम्
    । अनेकजीवसद्भावमेकजीवादिनिर्णयम् ॥ ८४ ॥ यद्यद्ध्यायति चित्तेन यद्यत्सङ्कल्पते क्वचित् । बुद्ध्या निश्चीयते
    यद्यद्गुरुणा संशृणोति यत् ॥ ८५ ॥ यद्यद्वाचा व्याकरोति यद्यदाचार्यभाषणम् । यद्यत्स्वरेन्द्रियैर्भाव्यं
    यद्यन्मीमांसते पृथक् ॥ ८६ ॥ यद्यन्न्यायेन निर्णीतं महद्भिर्वेदपारगैः । शिवः क्षरति लोकान्वै विष्णुः
    पाति जगत्त्रयम् ॥ ८७ ॥ ब्रह्मा सृजति लोकान्वै एवमादिक्रियादिकम् । यद्यदस्ति पुराणेषु यद्यद्वेदेषु
    निर्णयम् ॥ ८८ ॥ सर्वोपनिषदां भावं सर्वं शशविषाणवत् । देहोऽहमिति सङ्कल्पं तदन्तःकरणं स्मृतम् ॥ ८९ ॥
    देहोऽहमिति सङ्कल्पो महत्संसार उच्यते । देहोऽहमिति सङ्कल्पस्तद्बन्धमिति चोच्यते ॥ ९० ॥ देहोऽहमिति सङ्कल्पस्तद्दुःखमिति
    चोच्यते । देहोऽहमिति यद्भानं तदेव नरकं स्मृतम् ॥ ९१ ॥ देहोऽहमिति सङ्कल्पो जगत्सर्वमितीर्यते । देहोऽहमिति
    सङ्कल्पो हृदयग्रन्थिरीरितिः ॥ ९२ ॥ देहोऽहमिति यज्ज्ञानं तदेवाज्ञानमुच्यते । देहोऽहमिति यज्ज्ञानं तदसद्भावमेव
    च ॥ ९३ ॥ देहोऽहमिति या बुद्धिः सा चाविद्येति भण्यते । देहोऽहमिति यज्ज्ञानं तदेव द्वैतमुच्यते ॥ ९४
    ॥ देहोऽहमिति सङ्कल्पः सत्यजीवः स एव हि । देहोऽहमिति यज्ज्ञानं परिच्छिन्नमितीरितम् ॥ ९५ ॥ देहोऽहमिति
    सङ्कल्पो महापापमिति स्फुटम् । देहोऽहमिति या बुद्धिस्तृष्णा दोषामयः किल ॥ ९६ ॥ यत्किञ्चिदपि सङ्कल्पस्तापत्रयमितीरितम्
    । कामं क्रोधं बन्धनं सर्वदुःखं विश्वं दोषं कालनानास्वरूपम् । यत्किञ्चेदं सर्वसङ्कल्पजालं तत्किञ्चेदं
    मानसं सोम विद्धि ॥ ९७ ॥ मन एव जगत्सर्वं मन एव महारिपुः । मन एव हि संसारो मन एव जगत्त्रयम् ॥ ९८ ॥ मन
    एव महद्दुःखं मन एव जरादिकम् । मन एव हि कालश्च मन एव मलं तथा ॥ ९९ ॥ मन एव हि सङ्कल्पो मन एव हि जीवकः
    । मन एव हि चित्तं च मनोऽहङ्कार एव च ॥ १०० ॥ मन एव महद्बन्धं मनोऽन्तःकरणं च तत् । मन एव हि भूमिश्च
    मन एव हि तोयकम् ॥ १०१ ॥ मन एव हि तेजश्च मन एव मरुन्महान् । मन एव हि चाकाशं मन एव हि शब्दकम् ॥ १०२
    ॥ स्पर्शं रूपं रसं गन्धं कोशाः पञ्च मनोभवाः । जाग्रत्स्वप्नसुषुप्त्यादि मनोमयरितीरितम् ॥ १०३ ॥ दिक्पाला
    वसवो रुद्रा आदित्याश्च मनोमयाः । दृश्यं जडं द्वन्द्वजातमज्ञानं मानसं स्मृतम् ॥ १०४ ॥ सङ्कल्पमेव यत्किञ्चित्तत्तन्नास्तीति
    निश्चिनु । नास्ति नास्ति जगत्सर्वं गुरुशिष्यादिकं नहीत्युपनिषत् ॥ १०५ ॥ ॥ षष्ठोऽध्यायः ॥
