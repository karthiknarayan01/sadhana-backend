id: prithivikritam2vishnustotram
category: stotram
name:
  english: prithivikritam2vishnustotram
  devanagari: पृथिवीकृतं२विष्णुस्तोत्रम्
content:
  english: prithivikritam 2 vishnustotram prithivyuvaca | namaste pundarikaksha shankhacakragadadhara
    mamuddharasmadadya tvam tvatto'ham purvamutthita || 12|| tvayahamuddhrita purvam tvanmayaham janardana
    | tathanyani ca bhutani gaganadinyasheshatah || 13|| namaste paramatmatmanpurushatmannamo'stu te |
    pradhanavyaktabhutaya kalabhutaya te namah || 14|| tvam karta sarvabhutanam tvam pata tvam vinashakrit
    | sargadishu prabho brahmavishnurudratmarupadhrik || 15|| sambhakshayitva sakalam jagatyekarnavikrite
    | sheshe tvameva govinda cintyamano manishibhih || 16|| bhavato yatparam tattvam tanna janati kashcana
    | avatareshu yadrupam tadarcanti divaukasah || 17|| tvamaradhya param brahma yata muktim mumukshavah
    | vasudevamanaradhya ko moksham samavapsyati || 18|| yatkincinmanasa grahyam yadgrahyam cakshuradibhih
    | buddhya ca yatparicchedyam tadrupamakhilam tava || 19|| tvanmayaham tvadadhara tvatsrishta tvatsamashraya
    | madhavimiti loko'yamabhidhatte tato hi mam || 20|| jayakhilajnanamaya jaya sthulamayavyaya | jayananta
    jayavyakta jaya vyaktamaya prabho || 21|| paraparatmanvishvatmanjaya yajnapate'nagha | tvam yajnastvam
    vashatkarastvamonkarastvamagnayah || 22|| tvam vedastvam tadangani tvam yajnapurusho hare | suryadayo
    grahastara nakshatranyakhilam jagat || 23|| murtamurtamadrishyam ca drishyam ca purushottama yaccoktam
    yacca naivoktam mayatra parameshvara | tatsarvam tvam namastubhyam bhuyo bhuyo namo namah || 24||
    iti vishnupurane prathamabhage caturthadhyayantargatam prithivikritam vishnustotram samaptam | vishnupurana
    | adhyaya 1
  devanagari: पृथिवीकृतं २ विष्णुस्तोत्रम् पृथिव्युवाच । नमस्ते पुण्डरीकाक्ष शङ्खचक्रगदाधर मामुद्धरास्मादद्य
    त्वं त्वत्तोऽहं पूर्वमुत्थिता ॥ १२॥ त्वयाहमुद्धृता पूर्वं त्वन्मयाहं जनार्दन । तथान्यानि च भूतानि
    गगनादीन्यशेषतः ॥ १३॥ नमस्ते परमात्मात्मन्पुरुषात्मन्नमोऽस्तु ते । प्रधानव्यक्तभूताय कालभूताय ते नमः
    ॥ १४॥ त्वं कर्ता सर्वभूतानां त्वं पाता त्वं विनाशकृत् । सर्गादिषु प्रभो ब्रह्मविष्णुरुद्रात्मरूपधृक्
    ॥ १५॥ सम्भक्षयित्वा सकलं जगत्येकार्णवीकृते । शेषे त्वमेव गोविन्द चिन्त्यमानो मनीषिभिः ॥ १६॥ भवतो यत्परं
    तत्त्वं तन्न जानाति कश्चन । अवतारेषु यद्रूपं तदर्चन्ति दिवौकसः ॥ १७॥ त्वामाराध्य परं ब्रह्म याता मुक्तिं
    मुमुक्षवः । वासुदेवमनाराध्य को मोक्षं समवाप्स्यति ॥ १८॥ यत्किञ्चिन्मनसा ग्राह्यं यद्ग्राह्यं चक्षुरादिभिः
    । बुद्ध्या च यत्परिच्छेद्यं तद्रूपमखिलं तव ॥ १९॥ त्वन्मयाहं त्वदाधारा त्वत्सृष्टा त्वत्समाश्रया ।
    माधवीमिति लोकोऽयमभिधत्ते ततो हि माम् ॥ २०॥ जयाखिलज्ञानमय जय स्थूलमयाव्यय । जयानन्त जयाव्यक्त जय व्यक्तमय
    प्रभो ॥ २१॥ परापरात्मन्विश्वात्मञ्जय यज्ञपतेऽनघ । त्वं यज्ञस्त्वं वषट्कारस्त्वमोङ्कारस्त्वमग्नयः ॥
    २२॥ त्वं वेदास्त्वं तदङ्गानि त्वं यज्ञपुरुषो हरे । सूर्यादयो ग्रहास्तारा नक्षत्राण्यखिलं जगत् ॥ २३॥
    मूर्तामूर्तमदृश्यं च दृश्यं च पुरुषोत्तम यच्चोक्तं यच्च नैवोक्तं मयात्र परमेश्वर । तत्सर्वं त्वं नमस्तुभ्यं
    भूयो भूयो नमो नमः ॥ २४॥ इति विष्णुपुराणे प्रथमभागे चतुर्थाध्यायान्तर्गतं पृथिवीकृतं विष्णुस्तोत्रं
    समाप्तम् । विष्णुपुराण । अध्याय १
