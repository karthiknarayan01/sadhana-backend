id: radhaganesha
category: stotram
name:
  english: radhaganesha
  devanagari: राधागणेश
content:
  english: shriradhastavanam ganeshakritam shriganesha uvaca | tava puja jaganmatarlokashikshakari shubhe|
    brahmasvarupa bhavati krishnavakshahsthalasthita || 1|| yatpadapadmamatutalam dhyayante te sudurlabham
    | sura brahmeshasheshadya munindrah sanakadayah || 2|| jivanmuktashca bhaktashca siddhendrah kapiladayah
    | tasya pranabhidevi tvam priya pranadhika para || 3|| vamanganirmita radha dakshinangashca madhavah
    | mahalakshmirjaganmata tava vamanganirmita || 4|| vasoh sarvanivasasya prasustvam parameshvari |
    vedanam jagatameva mulaprakritirishvari || 5|| sarvah prakritika matah srishtyam ca tvadvibhutayah
    | vishvani karyarupani tvam ca karanarupini || 6|| pralaye brahmanah pate tannimesho harerapi | adau
    radham samuccarya pashcat krishnam paratparam || 7|| sa eva pandito yogi golokam yati lilaya | vyatikrame
    mahapi brahmahatyam labhed dhruvam || 8|| jagatam bhavati mata paramatma pita harih | pitureva gururmata
    pujya vandya paratpara || 9|| bhajate devamanyam va krishnam va sarvakaranam | punyakshetre mahamudho
    yadi ninda radhikam || 10|| vamshahanirbhavettasya duhkhashokamihaiva ca | pacyate nirate ghore yavaccandradivakarau
    || 11|| gurushca jnanodgiranajjnanam syanmamtratamtrayoh | sa ca mantrashca tattantram bhaktih syad
    yuvayoryatah || 12|| nishevya mantram devanam jiva janmani janmani | bhakta bhavanti durgayah padapadme
    sudurlabhe || 13|| nishevya mantram shambhoshca jagatam karanasya ca | tada prapnoti yuvayoh padapadmam
    sudurlabham || 14|| yuvayoh padapadmam ca durlabham prapya punyavan | kshanardham shodashamsham ca
    na hi muncati daivatah || 15|| bhaktya ca yuvayormantram grihitva vaishnavadapi | stavam va kavacam
    vapi karmamulanikrintanam || 16|| yo japet paraya bhaktya punyakshetre ca bharate | purushanam sahasram
    ca svatmana sardhamuddharet || 17|| gurumabhyarcya vidhivad vastralamkaracandanaih | kavacam dharayed
    yo hi vishnutulyo bhaved dhruvam || 18|| || iti shri brahmavaivarte ganeshakritam shriradhastavanam
    sampurnam ||
  devanagari: श्रीराधास्तवनं गणेशकृतम् श्रीगणेश उवाच । तव पूजा जगन्मातर्लोकशिक्षाकरी शुभे। ब्रह्मस्वरूपा
    भवती कृष्णवक्षःस्थलस्थिता ॥ १॥ यत्पादपद्ममतुतलं ध्यायन्ते ते सुदुर्लभम् । सुरा ब्रह्मेशशेषाद्या मुनीन्द्राः
    सनकादयः ॥ २॥ जिवन्मुक्ताश्च भक्ताश्च सिद्धेन्द्राः कपिलादयः । तस्य प्राणाभिदेवि त्वं प्रिया प्रानाधिका
    परा ॥ ३॥ वामाङ्गनिर्मिता राधा दक्षिणाङ्गश्च माधवः । महालक्ष्मीर्जगन्माता तव वामाङ्गनिर्मिता ॥ ४॥ वसोः
    सर्वनिवासस्य प्रसूस्त्वं परमेश्वरी । वेदानां जगतामेव मूलप्रकृतिरीश्वरी ॥ ५॥ सर्वाः प्रकृतिका मातः
    सृष्ट्यां च त्वद्विभूतयः । विश्वानि कार्यरूपाणि त्वं च कारणरूपिणी ॥ ६॥ प्रलये ब्रह्मणः पाते तन्निमेषो
    हरेरपि । आदौ राधां समुच्चार्य पश्चात् कृष्णं परात्परम् ॥ ७॥ स एव पण्डितो योगी गोलोकं याति लीलया ।
    व्यतिक्रमे महापी ब्रह्महत्यां लभेद् ध्रुवम् ॥ ८॥ जगतां भवती माता परमात्मा पिता हरिः । पितुरेव गुरुर्माता
    पूज्या वन्द्या परत्परा ॥ ९॥ भजते देवमन्यं वा कृष्णं वा सर्वकारणम् । पुण्यक्षेत्रे महामूढो यदि निन्दा
    राधीकाम् ॥ १०॥ वंशहानिर्भवेत्तस्य दुःखशोकमिहैव च । पच्यते निरते घोरे यावच्चन्द्रदिवाकरौ ॥ ११॥ गुरुश्च
    ज्ञानोद्गिरणाज्ज्ञानं स्यान्मंत्रतंत्रयोः । स च मन्त्रश्च तत्तन्त्रं भक्तिः स्याद् युवयोर्यतः ॥ १२॥
    निशेव्य मन्त्रं देवानां जीवा जन्मनि जन्मनि । भक्ता भवन्ति दुर्गायाः पादपद्मे सुदुर्लभे ॥ १३॥ निषेव्य
    मन्त्रं शम्भोश्च जगतां कारणस्य च । तदा प्राप्नोति युवयोः पादपद्मं सुदुर्लभम् ॥ १४॥ युवयोः पादपद्मं
    च दुर्लभं प्राप्य पुण्यवान् । क्षणार्धं षोडशांशं च न हि मुञ्चति दैवतः ॥ १५॥ भक्त्या च युवयोर्मन्त्रं
    गृहीत्वा वैष्णवादपि । स्तवं वा कवचं वापि कर्ममूलनिकृन्तनम् ॥ १६॥ यो जपेत् परया भक्त्या पुण्यक्षेत्रे
    च भारते । पुरुषाणां सहस्रं च स्वात्मना सार्धमुद्धरेत् ॥ १७॥ गुरुमभ्यर्च्य विधिवद् वस्त्रालंकारचन्दनैः
    । कवचं धारयेद् यो हि विष्णुतुल्यो भवेद् ध्रुवम् ॥ १८॥ ॥ इति श्री ब्रह्मवैवर्ते गणेशकृतं श्रीराधास्तवनं
    सम्पूर्णम् ॥
