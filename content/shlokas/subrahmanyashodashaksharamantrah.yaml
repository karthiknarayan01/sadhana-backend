id: subrahmanyashodashaksharamantrah
category: mantra
name:
  english: subrahmanyashodashaksharamantrah
  devanagari: सुब्रह्मण्यषोडशाक्षरमन्त्रः
content:
  english: sharavanabhava paravaraya brahmamayaya vidyadehaya angushthabhyam namah | ravanabhavasha brahmacaryaya
    tarjanibhyam namah | vanabhavashara skandasvamine kumaraya madhyamabhyam namah | nabhavasharava brahmatejomayaya
    anamikabhyam namah | bhavasharavana dvadashanetraya kanishthikabhyam namah | vasharavanabha brahmarudratejomayaya
    karatalakaraprishthabhyam namah | rishyadinyasah
  devanagari: शरवणभव परावराय ब्रह्ममयाय विद्यादेहाय अङ्गुष्ठाभ्यां नमः । रवणभवश ब्रह्मचर्याय तर्जनीभ्यां
    नमः । वणभवशर स्कन्दस्वामिने कुमाराय मध्यमाभ्यां नमः । णभवशरव ब्रह्मतेजोमयाय अनामिकाभ्यां नमः । भवशरवण
    द्वादशनेत्राय कनिष्ठिकाभ्यां नमः । वशरवणभ ब्रह्मरुद्रतेजोमयाय करतलकरपृष्ठाभ्यां नमः । ऋष्यादिन्यासः
meaning: {}
