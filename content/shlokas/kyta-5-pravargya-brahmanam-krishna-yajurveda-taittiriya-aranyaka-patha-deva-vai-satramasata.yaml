    sama vai rakshoha | rakshasamapahatyai | trirnidhanamupaiti | traya ime lokah | ebhya eva lokebhyo
    rakshagsyapahanti | purushahpurusho nidhanamupaiti | purushahpurusho hi rakshasvi | rakshasamapahatyai
    || tprithivyamudvasaye t | prithivigm shuca 'rpayet | yadaphsu | apa shshucarpayet | yadoshadhishu
