id: shribhuvaneshvarimantragarbhasahasranama-3
category: sahasranama
name:
  english: shribhuvaneshvarimantragarbhasahasranama
  devanagari: श्रीभुवनेश्वरीमन्त्रगर्भसहस्रनाम
content:
  english: vetsi tvad bhaktya gopaniyam prayatnatah || 5|| asya namnam sahasrasya rishih bhairava ucyate
    | panktishchandah samakhyata devata bhuvaneshvari || 6|| hrim bijam shrim ca shaktih syat klim kilakamudahritam
    | mano'bhilashasiddhayartham viniyogah prakirtitah || 7|| || rishyadinyasah || shribhairavarishaye
    namah shirasi | panktishchandase namah mukhe | shribhuvaneshvaridevatayai namah hridi | hrim bijaya
    namah guhye | shrim shaktye namah nabhau | klim kilakaya namah padayoh | mano'bhilashayasiddhayarthe
    pathe viniyogaya namah sarvange || om hrim shrim jagadishani hrim shrim bija jagatpriya| om shrim
    jayaprada om hrim jaya hrim jayavarddhini || 8|| om hrim shrim vam jaganmata shrim klim jagadvaraprada
    | om hrim shrim jum jatini hrim klim jayada shrim jagandhara || 9|| om klim jyotishmati om jum janani
    shrim jaratura| om strim jum jagati hrim shrim japya om jagadashraya || 10|| om shrim jum sah jaganmata
    om jum jagat kshayamnkari | om shrim klim janaki svaha shrim klim hrim jatarupini || 11|| om shrim
    klim japyaphalada om jum sah janavallbha | om shrim klim jananitijna om shrim janatrayeshtada || 12||
    om klim kamalapatrakshi om shrim klim hrim ca kamini | om gum ghorarava om shrim ghorarupa hasauh
    gatih || 13|| om gam ganeshvari om shrim shivavamangavasini | om shrim shiveshtada svaha om shrim
    shitatapriya || 14|| om shrim gum ganamata ca om shrim klim gunaragini || om shrim ganeshamata ca
    om shrim shankaravallabha || 15|| om shrim klim shitalangi shrim shitala shrim shiveshvari | om shrim
    klim glaum gajarajastha om shrim gim gautami tatha || 16|| om gham ghuraghuranada ca om gim gitapriya
    hasauh | om gham gharini ghatantahstha om gim gandharvasevita ||17|| om gaum shrim gopati svaha om
    gim gaum ganapriya | om gim goshthi hasauh gopya om gim dharmansulocana || 18|| om shrim gantrim hasauh
    ghanta om gham ghantaravakula | om ghrim shrim ghorarupa ca om gim shrim garudi hasauh || 19|| om
    gim ganaya hasauh gurvi om shrim ghoradyutistatha | om shrim gim ganagandharvasevatangi gariyasi ||
    20|| om shrim gatha hasauh goptri om gim ganasevita || om shrim gunamati svaha shrim klim gauri hasauh
    gada || 21|| om shrim gim gaurarupa ca om gim gaurasvara tatha | om shrim gim klim gadahasta om gim
    gonda hasauh payah || 22|| om shrim gim klim gamyarupa ca om agamya hasauh vanam || om shrim ghoravadana
    ghorakara hasauh payah || 23|| om hrim shrim klim komalangi ca om krim kalabhayankari | u krim karpatahasta
    ca krim hrum kadambari hasauh || 24|| krim shrim kanakavarna ca om krim kanakabhushana | om krim kali
    hasauh kanta krim hrum karunyarupini || 25|| om krim shrim kutapriya krim hrum trikuta krim kuleshvari
    | om krim kambalavastra ca krim pitambarasevita || 26|| krim shrim kulya hasauh kirtih krim shrim
    klim kleshaharini | om krim kutalaya krim hrim kutakartri hasauh kutih || 27|| om shrim klim kamakamala
    klim shim kamala krim ca kauravi | om klim shrim kururava hrim shrim hatakeshvarapujita || 28|| om
    hram ram ramyarupa ca om shrim klim kancanangada | om kriim shrim kundali krim hu~ karabandhanamokshada
    || 29|| om krim kura hasauh klau blu om krim kauravamardini | om shrim katu hasauh kunti om shrim
    kushthakshayankari || 30|| om shrim cakoraki kanta krim shrim kapalini para | om shrim klim kalika
    kama om shrim hrim klim kalankita|| 31|| krim shrim klim krim kathorangi om shrim kapatarupini | om
    krim kamavati krim shrim kanya krim kalika hasauh || 32|| om shmashanakalika shrim klim om krim shrim
    kutilalaka | om krim shrim kutilabhrushca krim hrum kutilarupini || 33|| om krim kamalahasta ca krim
    kunti om krim kaulini | om shrim klim kanthamadhyastha klim kantisvarupini || 34|| om krim kartasvarupa
    ca om krim katyayani hasauh | om krim kalavati hasauh kamya krim kalanidhisheshvari || 35|| om krim
    shrim sarvamadhyastha om krim sarveshvari payah | om krim hrum cakramadhyastha om krim shrim cakrarupini
    || 36|| om krim hu~ cam cakorakshi om cam candanashitala | om cam carmambara hrum krim caruhasa hasauh
    cyuta || 37|| om shrim caurapriya hu~ ca carvangi shrim cala'cala | om shrim hu~ kamarajyeshta kulini
    krim hasauh kuhu || 38|| om krim kriya kulacara krim krim kamalavasini | om krim helah hasauh lilah
    om krim kalavasini || 39|| om krim kalapriya hrum krim kalaratri hasauh bala | om krim shrim shashimadhyastha
    krim shrim kandarpalocana || 40|| om krim shitanshumukuta krim shrim sarvavaraprada | om shrim shyambara
    svaha om shrim shyamalarupini || 41|| om shrim krim shrim sati svaha om krim shridharasevita | om
    shrim ruksha hasauh rambha om krim rasavartipatha || 42|| om kundagolapriyakari hrim shrim om klim
    kurupini | om shrim sarva hasauh triptih om shrim tara hasauh trapa || 43|| om shrim tarunyarupa ca
    om krim trinayana payah | om shrim tambularaktasya om krim ugraprabha tatha || 44|| om shrim ugreshvari
    svaha om shrim ugraravakula | om krim ca sarvabhushadhya om shrim campakamalini || 45|| om shrim campakavalli
    ca om shrim ca cyutalaya | om shrim dyutimati svaha om shrim devaprasuh payah || 46|| om shrim daityaripuja
    ca om krim daityavimardini | om shrim dyumaninetra ca om shrim dambhavivarjita || 47|| om shrim daridryarashidhni
    om shrim damodarapriya | om klim darpapaha svaha om krim kandarpalalasa || 48|| om krim kariravrikshastha
    om krim hu~nkarigamini | om krim shukatmika svaha om krim shukakara tatha || 49|| om shrim shukashrutih
    shrim klim shrim hrim shukakavitvada | om krim shukaprasu svaha om shrim krim shavagamini || 50||
    om raktambara svaha om krim pitambararcita | om shrim krim smitasamyukta om shrim sauh smara pura
    || 51|| om shrim krim hu~ ca smerasya om shrim smaravivaddhini | om shri sarpakula svaha om shrim
    sarvopaveshini || 52|| om krim sauh sarpakanya ca om krim sarpasanapriya | sauh sauh klim sarvakutila
    om shrim surasurarcita || 53|| om shrim surarimathini om shrim surijanapriya | aim sauh suryendunayana
    aim klim suryayutaprabha || 54|| aim shrim klim suradevya ca om shrim sarveshvari tatha | om shrim
    kshemakari svaha om krim hu~ bhadrakalika || 55|| om shrim shyama hasauh svaha om shrim hrim sharvarisvaha
    | om shrim klim sharvari tatha om shrim klim shantarupini || 56|| om krim shrim shridhareshani om
    shrim klim shasini tatha | om klim shitirhasauh shauri om shrim klim sharada tatha || 57|| om shrim
    hrim sharika svaha om shrim shakambhari tatha | om shrim klim shivarupa ca om shrim klim kamacarini
    || 58|| om yam yajneshvari svaha om shrim yajnapriya sada | om aim klim yam yajnarupa ca om shrim
    yam yajnadakshina || 59|| om shrim yajnarcita svaha om yam yajnikapujita | shrim hrim yam yajamanastri
    om yajva hasauh vadhuh || 60|| shrim vam batukapujita om shrim varuthini svaha || om krim varta hasauh
    om shrim varadayini svaha|| 61|| om shrim klim aim ca varahi om shrim klim varavarnini | om aim sauh
    vartada svaha om shrim varangana tatha|| 62|| om shrim vaikunthapuja ca vam shrim aim klim ca vaishnavi
    | om shrim bram brahmani svaha om krim brahmanapujita || 63|| om shrim aim klim ca indrani om klim
    indrapujita | om shrim klim aindri aim svaha om shrim klim indushekhara || 64|| om aim indrasamanabha
    om aim klim indravallabha | om shrim ida hasauh nabhih om shrim ishvarapujita || 65|| om bram brahmi
    klim rum rudrani om aim drim shrim rama tatha | om aim klim sthanupriya svaha om gim padakshayakari
    || 66|| om gim gim shrim gurastha ca aim klim gudavivarddhini | om shrim krim krum kulirastha om krim
    shrim kurmaprishthaga || 67|| om shrim dhum totala svaha om traum tribhuvanarcita | om prim pritirhasauh
    pritam prim prabha prim pureshvari || 68|| om prim parvataputri ca om prim parvatavasini | om shrim
    pritiprada svaha om aim sattvagunashrita || 69|| om klim satyapriya svaha aim saum klim satyasangara
    | om shrim sanatani svaha om shrim sagarashayini || 70|| om klim cam candrika aim saum candramandalamadhyaga
    | om shrim caruprabha svaha om krim prem pretashayini || 71|| om shrim shrim mathura aim krim kashi
    shrim shrim manorama | om shrim mantramayi svaha om cam candrakashitala || 72|| om shrim shankari
    svaha om shrim sarvangavasini | om shrim sarvapriya svaha om shrim klim satyabhamini || 73|| om klim
    satyatmika svaha om klim aim sauh ca sattviki | om shrim ram rajasi svaha om krim rambhopama tatha
    || 74|| om shrim raghavasevya ca om shrim ravanaghatini | om nishumbhohantri hrim shrim klim om krim
    shumbhamadapaha || 75|| om shrim raktapriya hara om shrim krim raktabijakshayankari | om shrim mahishaprishtastha
    om shrim mahishaghatini || 76|| om shrim mahishe svaha om shrim shrim manaveshtada | om shrim matiprada
    svaha om shrim manumayi tatha || 77|| om shrim manoharangi ca om shrim madhavasevita | om shrim madhavastutya
    ca om shrim vandistuta sada || 78|| om shrim manaprada svaha om shrim manya hasauh matih | om shrim
    shrim bhamini svaha om shrim manakshayankari || 79|| om shrim marjaragamya ca om shrim shrim mrigalocana
    | om shrim maralamatih om shrim mukura prim ca putana || 80|| om shrim parapara ca om shrim parivarasamudbhava
    | om shrim padmavara aim sauh padmodbhavakshayankari || 81|| om prim padma hasauh punyai om prim purangana
    tatha | om prim payodrishadrishi om prim paravateshvari || 82|| om payodharanamrangi om dhrim dharadharapriya
    | om dhriti aim daya svaha om om shrim krim shrim dayavati || 83|| om shrim drutagatih svaha om drim
    dram vanaghatini | om cam carmambareshani om cam candalarupini || 84|| om camundahasauh candi om cam
    krim candikapayah | om krim candaprabha svaha om cam krim caruhasini || 85|| om krim shrim acyuteshta
    hrim candamundakshayakari | om trim shrim tritaye svaha om shrim tripurabhairavi || 86|| om aim sauh
    tripurananda om aim tripurasudina | om aim klim sauh tripuradhyaksha aim traum shrim tripura''shraya
    || 87|| om shrim trinayane svaha om shrim tara varakula | om shrim tumburuhasta ca om shrim mandabhashini
    || 88|| om shrim maheshvari svaha om shrim modakabhakshini | om shrim mandodari svaha om shrim madhurabhashini
    || 89|| om mrim shrim madhuralapa om shrim mohitabhashini | om shrim matamahi svaha om manya mrim
    madalasa || 90|| om mrim madoddhata svaha om mrim mandiravasini | om shrim klim shodasharastha om
    mrim dvadasharupini || 91|| om shrim dvadashapatrastha om shrim am ashtakonaga | om mrim matangi hasauh
    shrim klim mattamatangagamini || 92|| om mrim malapaha svaha om mrim mata hasauh sudha | om shrim
    sudhakala svaha om shrim mrim mamsini svaha || 93|| om mrim mala kari tatha om mrim malabhushita |
    om mrim madhvi rasapurna om shrim surya hasauh sati || 94|| om aim sauh klim satyarupa om shrim dikshahasauh
    dari | om drim datripriya hrim shrim dakshayajnavinashini || 95|| om datriprasu svaha om shrim data
    hasauh payah om shrim aim sauh ca sumukhi om aim sauh satyavaruni || 96|| om shrim sadambara svaha
    om shrim aim sauh sadagatih | om shrim sita hasauh satya om aim santanashayini || 97|| om aim sauh
    sarvadrishtishca om krim kalpantakarini | om shrim candrakalladhara om aim shrim pashupalini || 98||
    om shrimshishupriya aim sauh shishutsanganiveshita | om aim sauh tarini svaha om aim klim tamasi tatha||
    99|| om mrim mohandhakaraghni om mrim mattamanastatha | om mrim shrim mananiya ca om prim pujaphalada
    || 100|| om shrim shrim shriphala svaha om shrim klim satyarupini | om shrim narayani svaha om shrim
    nupurakila || 101|| om mrim shrim narasimhi ca om mrim narayanapriya | om mrim hamsagatih svaha om
    shrim hamsau hasauh payah |102|| om shrim krim karavaleshta om krim kotaravasini || om krim kancanabhushadhya
    om krim shrim kuripayah || 103|| om krim shashirupa ca shrim sah suryarupini | om shrim vamapriya
    svaha om vim varunapujita || 104|| om vim vateshvari svaha om vim vamanarupini | om ram vrim shrim
    khecari svaha om ram vrim shrim sararupini || 105|| om ram brim khadgadharini svaha om ram brim khapparadharini
    | om ram brim kharparayatra ca om prim pretalaya tatha || 106|| om shrim klim prim ca dutatma om prim
    pushpavarddhini | om shrim shrim santida svaha om prim patalacarini || 107|| om mrim mukeshvari svaha
    om shrim shrim mantrasagara | om shrim krim krayada svaha om krim vikrayakarini || 108|| om krim krayatmika
    svaha om krim shrim klim kripavati | om krim shrim bram vicitrangi om shrimklim vim vibhavari || 109||
    om vim shrim vibhavasunetra om vim shrim vamakeshvari | om shrim vasuprada svaha om shrim vaishravanarcita
    || 110|| om bhaim shrim bhagyada svaha om bhaim bhaim bhagamalini | om bhaim shrim bhagodara svaha
    om bhaim klim vaindaveshvari || 111|| om bhaim shrim bhavamadhyastha aim klim tripurasundari | om
    shrim krim bhitihartri ca om bhaim bhutabhayankari || 112|| om bhaim bhayaprada bhaim shrim bhagini
    bhaim bhayapaha | om hrim shrim bhogada svaha shrim klim hrim bhuvaneshvari || 113|| iti shridevadeveshi
  devanagari: वेत्सि त्वद् भक्त्या गोपनीयं प्रयत्नतः ॥ ५॥ अस्य नाम्नां सहस्रस्य ऋषिः भैरव उच्यते । पङ्क्तिश्छन्दः
    समाख्याता देवता भुवनेश्वरी ॥ ६॥ ह्रीं बीजं श्रीं च शक्तिः स्यात् क्लीं कीलकमुदाहृतम् । मनोऽभिलाषसिद्धयर्थं
    विनियोगः प्रकीर्तितः ॥ ७॥ ॥ ऋष्यादिन्यासः ॥ श्रीभैरवऋषये नमः शिरसि । पङ्क्तिश्छन्दसे नमः मुखे । श्रीभुवनेश्वरीदेवतायै
    नमः हृदि । ह्रीं बीजाय नमः गुह्ये । श्रीं शक्त्ये नमः नाभौ । क्लीं कीलकाय नमः पादयोः । मनोऽभिलाषयसिद्धयर्थे
    पाठे विनियोगाय नमः सर्वाङ्गे ॥ ॐ ह्रीं श्रीं जगदीशानी ह्रीं श्रीं बीजा जगत्प्रिया। ॐ श्रीं जयप्रदा
    ॐ ह्रीं जया ह्रीं जयवर्द्धिनी ॥ ८॥ ॐ ह्रीं श्रीं वां जगन्माता श्रीं क्लीं जगद्वरप्रदा । ॐ ह्रीं श्रीं
    जूं जटिनी ह्रीं क्लीं जयदा श्रीं जगन्धरा ॥ ९॥ ॐ क्लीं ज्योतिष्मती ॐ जूं जननी श्रीं जरातुरा। ॐ स्त्रीं
    जूं जगती ह्रीं श्रीं जप्या ॐ जगदाश्रया ॥ १०॥ ॐ श्रीं जूं सः जगन्माता ॐ जूं जगत् क्षयंङ्करी । ॐ श्रीं
    क्लीं जानकी स्वाहा श्रीं क्लीं ह्रीं जातरूपिणी ॥ ११॥ ॐ श्रीं क्लीं जाप्यफलदा ॐ जूं सः जनवल्ल्भा ।
    ॐ श्रीं क्लीं जननीतिज्ञा ॐ श्रीं जनत्रयेष्टदा ॥ १२॥ ॐ क्लीं कमलपत्राक्षी ॐ श्रीं क्लीं ह्रीं च कामिनी
    । ॐ गूं घोररवा ॐ श्रीं घोररूपा हसौः गतिः ॥ १३॥ ॐ गं गणेश्वरी ॐ श्रीं शिववामाङ्गवासिनी । ॐ श्रीं शिवेष्टदा
    स्वाहा ॐ श्रीं शीतातप्रिया ॥ १४॥ ॐ श्रीं गूं गणमाता च ॐ श्रीं क्लीं गुणरागिणी ॥ ॐ श्रीं गणेशमाता च
    ॐ श्रीं शङ्करवल्लभा ॥ १५॥ ॐ श्रीं क्लीं शीतलाङ्गी श्रीं शीतला श्रीं शिवेश्वरी । ॐ श्रीं क्लीं ग्लौं
    गजराजस्था ॐ श्रीं गीं गौतमी तथा ॥ १६॥ ॐ घां घुरघुरनादा च ॐ गीं गीतप्रिया हसौः । ॐ घां घरिणी घटान्तःस्था
    ॐ गीं गन्धर्वसेविता ॥१७॥ ॐ गौं श्रीं गोपति स्वाहा ॐ गीं गौं गणप्रिया । ॐ गीं गोष्ठी हसौः गोप्या ॐ
    गीं धर्माञ्सुलोचना ॥ १८॥ ॐ श्रीं गन्त्रीं हसौः घण्टा ॐ घं घण्टारवाकुला । ॐ घ्रीं श्रीं घोररूपा च ॐ
    गीं श्रीं गरुडी हसौः ॥ १९॥ ॐ गीं गणया हसौः गुर्वी ॐ श्रीं घोरद्युतिस्तथा । ॐ श्रीं गीं गणगन्धर्वसेवताङ्गी
    गरीयसी ॥ २०॥ ॐ श्रीं गाथ हसौः गोप्त्री ॐ गीं गणसेविता ॥ ॐ श्रीं गुणमति स्वाहा श्रीं क्लीं गौरी हसौः
    गदा ॥ २१॥ ॐ श्रीं गीं गौररूपा च ॐ गीं गौरस्वरा तथा । ॐ श्रीं गीं क्लीं गदाहस्ता ॐ गीं गोन्दा हसौः
    पयः ॥ २२॥ ॐ श्रीं गीं क्लीं गम्यरूपा च ॐ अगम्या हसौः वनम् ॥ ॐ श्रीं घोरवदना घोराकारा हसौः पयः ॥ २३॥
    ॐ ह्रीं श्रीं क्लीं कोमलाङ्गी च ॐ क्रीं कालभयङ्करी । ऊ क्रीं कर्पतहस्ता च क्रीं ह्रूं कादम्बरी हसौः
    ॥ २४॥ क्रीं श्रीं कनकवर्णा च ॐ क्रीं कनकभूषणा । ॐ क्रीं काली हसौः कान्ता क्रीं ह्रूं कारुण्यरूपिणी
    ॥ २५॥ ॐ क्रीं श्रीं कूटप्रिया क्रीं ह्रूं त्रिकुता क्रीं कुलेश्वरी । ॐ क्रीं कम्बलवस्त्रा च क्रीं
    पीताम्बरसेविता ॥ २६॥ क्रीं श्रीं कुल्या हसौः कीर्तिः क्रीं श्रीं क्लीं क्लेशहारिणी । ॐ क्रीं कूटालया
    क्रीं ह्रीं कूटकर्त्री हसौः कुटीः ॥ २७॥ ॐ श्रीं क्लीं कामकमला क्लीं शीं कमला क्रीं च कौरवी । ॐ क्लीं
    श्रीं कुरुरवा ह्रीं श्रीं हाटकेश्वरपूजिता ॥ २८॥ ॐ ह्रां रां रम्यरूपा च ॐ श्रीं क्लीं काञ्चनाङ्गदा
