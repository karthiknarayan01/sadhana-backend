id: siddhivinayaka
category: stotram
name:
  english: siddhivinayaka
  devanagari: सिद्धिविनायक
content:
  english: rinu prabho || 4|| kuru tvam mayi vatsalyam raksha mam sakalaniva | vighnebhyo raksha mam nityam
    kuru me cakhilah kriyah || 5|| gaurisutastvam ganeshah shrinu vijnapanam mama | tvatpadayorananyarthi
    yace sarvartha rakshanam || 6|| tvameva mata ca pita devastvam ca mamavyayah | anathanathastvam dehi
    vibho me vamchitam phalam || 7|| lambodarasvam gajasyo vibhuh siddhivinayakah | herambah shivaputrastvam
    vighnesho'nathabamdhavah || 8|| naganano bhaktapalo varadastvam dayam kuru | sinduravarnah parashuhastastvam
    vighnanashakah || 9|| vishvasyam mangaladhisham vighnesham parashudharam | duritarim dinabandhum sarvesham
    tvam jana jaguh || 10|| namami vighnahartaram vande shripramathadhipam | namami ekadantam ca dinabandhu
    namamyaham || 11|| namanam shambhutanayam namanam karunalayam | namaste'stu ganeshaya svamine ca namo'stu
    te || 12|| namo'stu devarajaya vande gaurisutam punah | namami caranau bhaktya bhalacandraganeshayoh
    || 13|| naivastyasha ca maccitte tvadbhaktestavanasyaca | bhavetyeva tu maccitte hyasha ca tava darshane
    || 14|| ajnanashcaiva mudho'ham dhyayami caranau tava | darshanam dehi me shighram jagadisha kripam
    kuru || 15|| balakashcahamalpajnah sarveshamasi ceshvarah | palakah sarvabhaktanam bhavasi tvam gajanana
    || 16|| daridro'ham bhagyahinah maccittam te'stu padayoh | sharanyam mamananyam te kripalo dehi darshanam
    || 17|| idam ganapatestotram yah pathetsusamahitah | ganeshakripaya jnanasidhdhim sa labhate dhanam
    || 18|| pathedyah siddhidam stotram devam sampujya bhaktiman | kadapi badhyate bhutapretadinam na
    pidaya || 19|| pathitva stauti yah stotramidam siddhivinayakam | shanmasaih siddhimapnoti na bhavedanritam
    vacah ganeshacaranau natva brute bhakto divakarah || 20|| iti shri siddhivinayaka stotram |
  devanagari: ृणु प्रभो ॥ ४॥ कुरु त्वं मयि वात्सल्यं रक्ष मां सकलानिव । विघ्नेभ्यो रक्ष मां नित्यं कुरु
    मे चाखिलाः क्रियाः ॥ ५॥ गौरिसुतस्त्वं गणेशः शॄणु विज्ञापनं मम । त्वत्पादयोरनन्यार्थी याचे सर्वार्थ
    रक्षणम् ॥ ६॥ त्वमेव माता च पिता देवस्त्वं च ममाव्ययः । अनाथनाथस्त्वं देहि विभो मे वांछितं फलम् ॥ ७॥
    लम्बोदरस्वम् गजास्यो विभुः सिद्धिविनायकः । हेरम्बः शिवपुत्रस्त्वं विघ्नेशोऽनाथबांधवः ॥ ८॥ नागाननो
    भक्तपालो वरदस्त्वं दयां कुरु । सिन्दूरवर्णः परशुहस्तस्त्वं विघ्ननाशकः ॥ ९॥ विश्वास्यं मङ्गलाधीशं विघ्नेशं
    परशूधरम् । दुरितारिं दीनबन्धूं सर्वेशं त्वां जना जगुः ॥ १०॥ नमामि विघ्नहर्तारं वन्दे श्रीप्रमथाधिपम्
    । नमामि एकदन्तं च दीनबन्धू नमाम्यहम् ॥ ११॥ नमनं शम्भुतनयं नमनं करुणालयम् । नमस्तेऽस्तु गणेशाय स्वामिने
    च नमोऽस्तु ते ॥ १२॥ नमोऽस्तु देवराजाय वन्दे गौरीसुतं पुनः । नमामि चरणौ भक्त्या भालचन्द्रगणेशयोः ॥
    १३॥ नैवास्त्याशा च मच्चित्ते त्वद्भक्तेस्तवनस्यच । भवेत्येव तु मच्चित्ते ह्याशा च तव दर्शने ॥ १४॥
    अज्ञानश्चैव मूढोऽहं ध्यायामि चरणौ तव । दर्शनं देहि मे शीघ्रं जगदीश कृपां कुरु ॥ १५॥ बालकश्चाहमल्पज्ञः
    सर्वेषामसि चेश्वरः । पालकः सर्वभक्तानां भवसि त्वं गजानन ॥ १६॥ दरिद्रोऽहं भाग्यहीनः मच्चित्तं तेऽस्तु
    पादयोः । शरण्यं मामनन्यं ते कृपालो देहि दर्शनम् ॥ १७॥ इदं गणपतेस्तोत्रं यः पठेत्सुसमाहितः । गणेशकृपया
    ज्ञानसिध्धिं स लभते धनम् ॥ १८॥ पठेद्यः सिद्धिदं स्तोत्रं देवं सम्पूज्य भक्तिमान् । कदापि बाध्यते भूतप्रेतादीनां
    न पीडया ॥ १९॥ पठित्वा स्तौति यः स्तोत्रमिदं सिद्धिविनायकम् । षण्मासैः सिद्धिमाप्नोति न भवेदनृतं वचः
    गणेशचरणौ नत्वा ब्रूते भक्तो दिवाकरः ॥ २०॥ इति श्री सिद्धिविनायक स्तोत्रम् ।
