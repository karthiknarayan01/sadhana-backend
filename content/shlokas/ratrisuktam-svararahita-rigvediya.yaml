id: ratrisuktam-svararahita-rigvediya
category: sukta
name:
  english: ratrisuktam svararahita (rigvediya)
  devanagari: रात्रिसूक्तम् स्वररहित (ऋग्वेदीय)
content:
  english: shrijagadamva prityarthe saptashatipathadau jape viniyogah | om ratri vyakhyadayati purutra
    devyakshabhih | vishva adhi shriyo'dhita || 1|| orvapra amartya nivato devyudvatah | jyotisha vadhate
    tamah || 2|| niru svasaramskritoshasam devyayati | apeduhasate tamah || 3|| sa no adya yasya vayam
    niteyamanyavikshmahi | vrikshen vasatim vayah || 4|| ni gramaso avikshata nipadvanto nipakshinah |
    ni shyenasashcidarthinah || 5|| yavaya vrikyam vrikam yavayastenamurmmye | atha nah sutara bhava ||
    6|| upa ma pepishattamah krishnam vyaktamasthita | usha rineva yataya || 7|| upa te ga ivakaram vrinishva
    duhitarddivah | ratri stomam na jigyushe || 8|| iti rigvedoktam ratrisuktam samaptam |
  devanagari: श्रीजगदम्वा प्रीत्यर्थे सप्तशतीपाठादौ जपे विनियोगः । ॐ रात्री व्यख्यदायति पुरुत्रा देव्यक्षभिः
    । विश्वा अधि श्रियोऽधित ॥ १॥ ओर्वप्रा अमर्त्या निवतो देव्युद्वतः । ज्योतिषा वाधते तमः ॥ २॥ निरु स्वसारम्स्कृतोषसं
    देव्यायती । अपेदुहासते तमः ॥ ३॥ सा नो अद्य यस्या वयं नितेयामन्यविक्ष्महि । वृक्षेण् वसतिं वयः ॥ ४॥
    नि ग्रामासो अविक्षत निपद्वन्तो निपक्षिणः । नि श्येनासश्चिदर्थिनः ॥ ५॥ यावया वृक्यं वृकं यवयस्तेनमूर्म्म्ये
    । अथा नः सुतरा भव ॥ ६॥ उप मा पेपिशत्तमः कृष्णं व्यक्तमस्थित । उष ऋणेव यातय ॥ ७॥ उप ते गा इवाकरं वृणीष्व
    दुहितर्द्दिवः । रात्रि स्तोमं न जिग्युषे ॥ ८॥ इति ऋग्वेदोक्तं रात्रिसुक्तं समाप्तम् ।
