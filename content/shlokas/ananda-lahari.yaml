id: ananda-lahari
category: stotram
name:
  english: Ananda Lahari
content:
  english: bhavani stotum tvam prabhavati caturbhirna vadanaih prajanamishanastripuramathanah pancabhirapi
    | na shadbhih senanirdashashatamukhairapyahipatih tadanyesham kesham kathaya kathamasminnavasarah
    || || ghritakshiradrakshamadhumadhurima kairapi padaih vishishyanakhyeyo bhavati rasanamatra vishayah
    | tatha te saundaryam paramashivadrinmatravishayah kathankaram brumah sakalanigamagocaragune || ||
    mukhe te tambulam nayanayugale kajjalakala lalate kashmiram vilasati gale mauktikalata | sphuratkanci
    shati prithukatitate hatakamayi bhajami tvam gaurim nagapatikishorimaviratam || || virajanmandaradrumakusumaharastanatati
    nadadvinanadashravanavilasatkundalaguna natangi matangi ruciragatibhangi bhagavati sati shambhorambhoruhacatulacakshurvijayate
    || || navinarkabhrajanmanikanakabhushanaparikaraih vritangi sarangiruciranayanangikritashiva | taditpita
    pitambaralalitamanjirasubhaga mamaparna purna niravadhisukhairastu sumukhi || || himadreh sambhuta
    sulalitakaraih pallavayuta supushpa muktabhirbhramarakalita calakabharaih | kritasthanusthana kucaphalanata
    suktisarasa rujam hantri gantri vilasati cidanandalatika || || saparnamakirnam katipayagunaih sadaramiha
    shrayantyanye vallim mama tu matirevam vilasati | aparnaika sevya jagati sakalairyatparivritah purano'pi
    sthanuh phalati kila kaivalyapadavim || || vidhatri dharmanam tvamasi sakalamnayajanani tvamarthanam
    mulam dhanadanamaniyanghrikamale | tvamadih kamanam janani kritakandarpavijaye satam mukterbijam tvamasi
    paramabrahmamahishi || || prabhuta bhaktiste yadapi na mamalolamanasah tvaya tu shrimatya sadayamavalokyo'hamadhuna
    | payodah paniyam dishati madhuram catakamukhe bhrisham shanke kairva vidhibhiranunita mama matih
    || || kripapangalokam vitara tarasa sadhucarite na te yuktopeksha mayi sharanadikshamupagate | na
    cedishtam dadyadanupadamaho kalpalatika visheshah samanyaih kathamitaravalliparikaraih || || mahantam
    vishvasam tava caranapankeruhayuge nidhayanyannaivashritamiha maya daivatamume | tathapi tvacceto
    yadi mayi na jayeta sadayam niralambo lambodarajanani kam yami sharanam || || ayah sparshe lagnam
    sapadi labhate hemapadavim yatha rathyapathah shuci bhavati gangaughamilitam | tatha tattatpapairatimalinamantarmama
    yadi tvayi premnasaktam kathamiva na jayeta vimalam || || tvadanyasmadicchavishayaphalalabhe na niyamah
    tvamarthanamicchadhikamapi samartha vitarane | iti prahuh prancah kamalabhavanadyastvayi manah tvadasaktam
    naktam divamucitamishani kuru tat || || sphurannanaratnasphatikamayabhittipratiphala ttvadakaram cancacchashadharakalasaudhashikharam
    | mukundabrahmendraprabhritiparivaram vijayate tavagaram ramyam tribhuvanamaharajagrihini || || nivasah
    kailase vidhishatamakhadyah stutikarah kutumbam trailokyam kritakaraputah siddhinikarah | maheshah
    praneshastadavanidharadhishatanaye na te saubhagyasya kvacidapi managasti tulana || || vrisho vriddho
    yanam vishamashanamasha nivasanam shmashanam kridabhurbhujaganivaho bhushanavidhih samagra samagri
    jagati viditaiva smararipoh yadetasyaishvaryam tava janani saubhagyamahima || || asheshabrahmandapralayavidhinaisargikamatih
    shmashaneshvasinah kritabhasitalepah pashupatih | dadhau kanthe halahalamakhilabhugolakripaya bhavatyah
    sangatyah phalamiti ca kalyani kalaye || || tvadiyam saundaryam niratishayamalokya paraya bhiyaivasidganga
    jalamayatanuh shailatanaye | tadetasyastasmadvadanakamalam vikshya kripaya pratishthamatanvannijashirasivasena
    girishah || || vishalashrikhandadravamrigamadakirnaghusrina prasunavyamishram bhagavati tavabhyangasalilam
    | samadaya srashta calitapadapamsunnijakaraih samadhatte srishtim vibudhapurapankeruhadrisham || ||
    vasante sanande kusumitalatabhih parivrite sphurannanapadme sarasi kalahamsalisubhage | sakhibhih
    khelantim malayapavanandolitajale smaredyastvam tasya jvarajanitapidapasarati || || || iti shrimacchankaracaryaviracita
    anandalahari sampurna ||
  devanagari: भवानि स्तोतुं त्वां प्रभवति चतुर्भिर्न वदनैः प्रजानामीशानस्त्रिपुरमथनः पञ्चभिरपि । न षड्भिः
    सेनानीर्दशशतमुखैरप्यहिपतिः तदान्येषां केषां कथय कथमस्मिन्नवसरः ॥ ॥ घृतक्षीरद्राक्षामधुमधुरिमा कैरपि
    पदैः विशिष्यानाख्येयो भवति रसनामात्र विषयः । तथा ते सौन्दर्यं परमशिवदृङ्मात्रविषयः कथङ्कारं ब्रूमः
    सकलनिगमागोचरगुणे ॥ ॥ मुखे ते ताम्बूलं नयनयुगले कज्जलकला ललाटे काश्मीरं विलसति गले मौक्तिकलता । स्फुरत्काञ्ची
    शाटी पृथुकटितटे हाटकमयी भजामि त्वां गौरीं नगपतिकिशोरीमविरतम् ॥ ॥ विराजन्मन्दारद्रुमकुसुमहारस्तनतटी
    नदद्वीणानादश्रवणविलसत्कुण्डलगुणा नताङ्गी मातङ्गी रुचिरगतिभङ्गी भगवती सती शम्भोरम्भोरुहचटुलचक्षुर्विजयते
    ॥ ॥ नवीनार्कभ्राजन्मणिकनकभूषणपरिकरैः वृताङ्गी सारङ्गीरुचिरनयनाङ्गीकृतशिवा । तडित्पीता पीताम्बरललितमञ्जीरसुभगा
    ममापर्णा पूर्णा निरवधिसुखैरस्तु सुमुखी ॥ ॥ हिमाद्रेः सम्भूता सुललितकरैः पल्लवयुता सुपुष्पा मुक्ताभिर्भ्रमरकलिता
    चालकभरैः । कृतस्थाणुस्थाना कुचफलनता सूक्तिसरसा रुजां हन्त्री गन्त्री विलसति चिदानन्दलतिका ॥ ॥ सपर्णामाकीर्णां
    कतिपयगुणैः सादरमिह श्रयन्त्यन्ये वल्लीं मम तु मतिरेवं विलसति । अपर्णैका सेव्या जगति सकलैर्यत्परिवृतः
    पुराणोऽपि स्थाणुः फलति किल कैवल्यपदवीम् ॥ ॥ विधात्री धर्माणां त्वमसि सकलाम्नायजननी त्वमर्थानां मूलं
    धनदनमनीयाङ्घ्रिकमले । त्वमादिः कामानां जननि कृतकन्दर्पविजये सतां मुक्तेर्बीजं त्वमसि परमब्रह्ममहिषी
    ॥ ॥ प्रभूता भक्तिस्ते यदपि न ममालोलमनसः त्वया तु श्रीमत्या सदयमवलोक्योऽहमधुना । पयोदः पानीयं दिशति
    मधुरं चातकमुखे भृशं शङ्के कैर्वा विधिभिरनुनीता मम मतिः ॥ ॥ कृपापाङ्गालोकं वितर तरसा साधुचरिते न ते
    युक्तोपेक्षा मयि शरणदीक्षामुपगते । न चेदिष्टं दद्यादनुपदमहो कल्पलतिका विशेषः सामान्यैः कथमितरवल्लीपरिकरैः
    ॥ ॥ महान्तं विश्वासं तव चरणपङ्केरुहयुगे निधायान्यन्नैवाश्रितमिह मया दैवतमुमे । तथापि त्वच्चेतो यदि
    मयि न जायेत सदयं निरालम्बो लम्बोदरजननि कं यामि शरणम् ॥ ॥ अयः स्पर्शे लग्नं सपदि लभते हेमपदवीं यथा
    रथ्यापाथः शुचि भवति गङ्गौघमिलितम् । तथा तत्तत्पापैरतिमलिनमन्तर्मम यदि त्वयि प्रेम्णासक्तं कथमिव न
    जायेत विमलम् ॥ ॥ त्वदन्यस्मादिच्छाविषयफललाभे न नियमः त्वमर्थानामिच्छाधिकमपि समर्था वितरणे । इति प्राहुः
    प्राञ्चः कमलभवनाद्यास्त्वयि मनः त्वदासक्तं नक्तं दिवमुचितमीशानि कुरु तत् ॥ ॥ स्फुरन्नानारत्नस्फटिकमयभित्तिप्रतिफल
    त्त्वदाकारं चञ्चच्छशधरकलासौधशिखरम् । मुकुन्दब्रह्मेन्द्रप्रभृतिपरिवारं विजयते तवागारं रम्यं त्रिभुवनमहाराजगृहिणि
    ॥ ॥ निवासः कैलासे विधिशतमखाद्याः स्तुतिकराः कुटुम्बं त्रैलोक्यं कृतकरपुटः सिद्धिनिकरः । महेशः प्राणेशस्तदवनिधराधीशतनये
    न ते सौभाग्यस्य क्वचिदपि मनागस्ति तुलना ॥ ॥ वृषो वृद्धो यानं विषमशनमाशा निवसनं श्मशानं क्रीडाभूर्भुजगनिवहो
    भूषणविधिः समग्रा सामग्री जगति विदितैव स्मररिपोः यदेतस्यैश्वर्यं तव जननि सौभाग्यमहिमा ॥ ॥ अशेषब्रह्माण्डप्रलयविधिनैसर्गिकमतिः
    श्मशानेष्वासीनः कृतभसितलेपः पशुपतिः । दधौ कण्ठे हालाहलमखिलभूगोलकृपया भवत्याः सङ्गत्याः फलमिति च कल्याणि
    कलये ॥ ॥ त्वदीयं सौन्दर्यं निरतिशयमालोक्य परया भियैवासीद्गङ्गा जलमयतनुः शैलतनये । तदेतस्यास्तस्माद्वदनकमलं
    वीक्ष्य कृपया प्रतिष्ठामातन्वन्निजशिरसिवासेन गिरिशः ॥ ॥ विशालश्रीखण्डद्रवमृगमदाकीर्णघुसृण प्रसूनव्यामिश्रं
    भगवति तवाभ्यङ्गसलिलम् । समादाय स्रष्टा चलितपदपांसून्निजकरैः समाधत्ते सृष्टिं विबुधपुरपङ्केरुहदृशाम्
    ॥ ॥ वसन्ते सानन्दे कुसुमितलताभिः परिवृते स्फुरन्नानापद्मे सरसि कलहंसालिसुभगे । सखीभिः खेलन्तीं मलयपवनान्दोलितजले
    स्मरेद्यस्त्वां तस्य ज्वरजनितपीडापसरति ॥ ॥ ॥ इति श्रीमच्छङ्कराचार्यविरचिता आनन्दलहरी सम्पूर्णा ॥
