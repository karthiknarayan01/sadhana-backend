id: gayatrikavacam-1-vasishthasamhitayam-svamin-sarvajagannatha
category: kavacha
name:
  english: gayatrikavacam 1 (vasishthasamhitayam svamin sarvajagannatha)
  devanagari: गायत्रीकवचम् १ (वसिष्ठसंहितायाम् स्वामिन् सर्वजगन्नाथ)
content:
  english: ryuktamindunibaddharatnamukutam tattvarthavarnatmikam | gayatrim varadabhayankushakasham shulam
    kapalam gunam shankham cakramatharavindayugalam hastairvahantim bhaje || 14|| om gayatri purvatah
    patu savitri patu dakshine | brahmavidya ca me pashcaduttare mam sarasvati || 15|| pavaki me disham
    rakshetpavakojjvalashalini | yatudhanim disham rakshedyatudhanaganardini || 16|| pavamanim disham
    rakshetpavamanavilasini | disham raudrimavatu me rudrani rudrarupini || 17|| urdhvam brahmani me rakshedadhastadvaishnavi
    tatha | evam dasha disho rakshet sarvato bhuvaneshvari || 18|| brahmastrasmaranadeva vacam siddhih
    prajayate | brahmadandashca me patu sarvashastrastrabhakshakrah || 19|| brahmashirshastatha patu shatrunam
    vadhakarakah | sapta vyahritayah pantu sarvada bindusamyutah || 20|| vedamata ca mam patu sarahasya
    sadaivata | devisuktam sada patu sahasraksharadevata || 21|| catuhshashtikala vidya divyadya patu
    devata | bijashaktishca me patu patu vikramadevata || 22|| tatpadam patu me padau janghe me savituhpadam
    | varenyam katidesham tu nabhim bhargastathaiva ca || 53|| devasya me tu hridayam dhimahiti galam
    tatha | dhiyo me patu jihvayam yahpadam patu locane || 24|| lalate nah padam patu murdhanam me pracodayat
    | tadvarnah patu murdhanam sakarah patu bhalakam || 25|| cakshushi me vikarastu shrotram rakshettu
    karakah | nasaputervakaro me rekarastu kapolayoh || 26|| nikarastvadharoshthe ca yakarasturdhva oshthake
    | atyamadhye bhakarastu gokarastu kapolayoh || 27|| dekarah kanthadeshe ca vakarah skandhadeshayoh
    | syakaro dakshinam hastam dhikaro vamahastakam || 28|| makaro hridayam raksheddhikaro jatharam tatha
    | dhikaro nabhidesham tu yokarastu katidvayam || 29|| guhyam rakshatu yokara uru me nah padaksharam
    | prakaro januni raksheccokaro janghadeshayoh || 30|| dakaro gulphadesham tu yatkarah padayugmakam
    | jatavedeti gayatri tryambaketi dashakshara || 31|| sarvatah sarvada patu apojyotiti shodashi | idam
    tu kavacam divyam badhashatavinashakam || 32|| catuhshashthikalavidyasakalaishvaryasiddhidam | japarambhe
    ca hridayam japante kavacam pathet || 33|| strigobrahmanamitradidrohadyakhilapatakaih | mucyate sarvapapebhyah
    param brahmadhigacchati || 34|| pushpanjalim ca gayatrya mulenaiva pathetsakrit | shatasahasravarshanam
    pujayah phalamapnuyat || 35|| bhurjapatre likhitvaitat svakanthe dharayedyadi | shikhayam dakshine
    bahau kanthe va dharayedbudhah || 36|| trailokyam kshobhayetsarvam trailokyam dahati kshanat | putravan
    dhanavan shrimannanavidyanidhirbhavet || 37|| brahmastradini sarvani tadangasparshanattatah | bhavanti
    tasya tucchani kimanyatkathayami te || 38|| abhimantritagayatrikavacam manasam pathet | tajjalam pibato
    nityam purashcaryaphalam bhavet || 39|| laghusamanyakam mantram
  devanagari: र्युक्तामिन्दुनिबद्धरत्नमुकुटां तत्त्वार्थवर्णात्मिकाम् । गायत्रीं वरदाभयाङ्कुशकशां शूलं
    कपालं गुणं शङ्खं चक्रमथारविन्दयुगलं हस्तैर्वहन्तीं भजे ॥ १४॥ ॐ गायत्री पूर्वतः पातु सावित्री पातु
    दक्षिणे । ब्रह्मविद्या च मे पश्चादुत्तरे मां सरस्वती ॥ १५॥ पावकी मे दिशं रक्षेत्पावकोज्ज्वलशालिनी
    । यातुधानीं दिशं रक्षेद्यातुधानगणार्दिनी ॥ १६॥ पावमानीं दिशं रक्षेत्पवमानविलासिनी । दिशं रौद्रीमवतु
    मे रुद्राणी रुद्ररूपिणी ॥ १७॥ ऊर्ध्वं ब्रह्माणी मे रक्षेदधस्ताद्वैष्णवी तथा । एवं दश दिशो रक्षेत्
    सर्वतो भुवनेश्वरी ॥ १८॥ ब्रह्मास्त्रस्मरणादेव वाचां सिद्धिः प्रजायते । ब्रह्मदण्डश्च मे पातु सर्वशस्त्रास्त्रभक्षक्रः
    ॥ १९॥ ब्रह्मशीर्षस्तथा पातु शत्रूणां वधकारकः । सप्त व्याहृतयः पान्तु सर्वदा बिन्दुसंयुताः ॥ २०॥ वेदमाता
    च मां पातु सरहस्या सदैवता । देवीसूक्तं सदा पातु सहस्राक्षरदेवता ॥ २१॥ चतुःषष्टिकला विद्या दिव्याद्या
    पातु देवता । बीजशक्तिश्च मे पातु पातु विक्रमदेवता ॥ २२॥ तत्पदं पातु मे पादौ जङ्घे मे सवितुःपदम् ।
    वरेण्यं कटिदेशं तु नाभिं भर्गस्तथैव च ॥ ५३॥ देवस्य मे तु हृदयं धीमहीति गलं तथा । धियो मे पातु जिह्वायां
    यःपदं पातु लोचने ॥ २४॥ ललाटे नः पदं पातु मूर्धानं मे प्रचोदयात् । तद्वर्णः पातु मूर्धानं सकारः पातु
    भालकम् ॥ २५॥ चक्षुषी मे विकारस्तु श्रोत्रं रक्षेत्तु कारकः । नासापुटेर्वकारो मे रेकारस्तु कपोलयोः
    ॥ २६॥ णिकारस्त्वधरोष्ठे च यकारस्तूर्ध्व ओष्ठके । आत्यमध्ये भकारस्तु गोकारस्तु कपोलयोः ॥ २७॥ देकारः
    कण्ठदेशे च वकारः स्कन्धदेशयोः । स्यकारो दक्षिणं हस्तं धीकारो वामहस्तकम् ॥ २८॥ मकारो हृदयं रक्षेद्धिकारो
    जठरं तथा । धिकारो नाभिदेशं तु योकारस्तु कटिद्वयम् ॥ २९॥ गुह्यं रक्षतु योकार ऊरू मे नः पदाक्षरम् ।
    प्रकारो जानुनी रक्षेच्चोकारो जङ्घदेशयोः ॥ ३०॥ दकारो गुल्फदेशं तु यात्कारः पादयुग्मकम् । जातवेदेति
    गायत्री त्र्यम्बकेति दशाक्षरा ॥ ३१॥ सर्वतः सर्वदा पातु आपोज्योतीति षोडशी । इदं तु कवचं दिव्यं बाधाशतविनाशकम्
    ॥ ३२॥ चतुःषष्ठिकलाविद्यासकलैश्वर्यसिद्धिदम् । जपारम्भे च हृदयं जपान्ते कवचं पठेत् ॥ ३३॥ स्त्रीगोब्राह्मणमित्रादिद्रोहाद्यखिलपातकैः
    । मुच्यते सर्वपापेभ्यः परं ब्रह्माधिगच्छति ॥ ३४॥ पुष्पाञ्जलिं च गायत्र्या मूलेनैव पठेत्सकृत् । शतसाहस्रवर्षाणां
    पूजायाः फलमाप्नुयात् ॥ ३५॥ भूर्जपत्रे लिखित्वैतत् स्वकण्ठे धारयेद्यदि । शिखायां दक्षिणे बाहौ कण्ठे
    वा धारयेद्बुधः ॥ ३६॥ त्रैलोक्यं क्षोभयेत्सर्वं त्रैलोक्यं दहति क्षणात् । पुत्रवान् धनवान् श्रीमान्नानाविद्यानिधिर्भवेत्
    ॥ ३७॥ ब्रह्मास्त्रादीनि सर्वाणि तदङ्गस्पर्शनात्ततः । भवन्ति तस्य तुच्छनि किमन्यत्कथयामि ते ॥ ३८॥ अभिमन्त्रितगायत्रीकवचं
    मानसं पठेत् । तज्जलं पिबतो नित्यं पुरश्चर्याफलं भवेत् ॥ ३९॥ लघुसामान्यकं मन्त्रं
