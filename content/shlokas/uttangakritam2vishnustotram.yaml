id: uttangakritam2vishnustotram
category: stotram
name:
  english: uttangakritam2vishnustotram
  devanagari: उत्तन्गकृतं२विष्णुस्तोत्रम्
content:
  english: uttangakritam 2 vishnustotram tasya pritah sa bhagavansakshaddarshanameyivan | drishtvaiva
    carshih prahvastam tushtava vividhaih stavaih || 10|| tvaya deva prajah sarvah sadevasuramanavah |
    sthavarani ca bhutani jangamani tathaiva ca | brahma vedashca vedyam ca tvaya srishtam mahadyute ||
    11|| shiraste gaganam deva netre shashidivakarau | nihshvasah pavanashcapi tejo'gnishca tavacyuta
    | bahavaste dishah sarvah kukshishcapi maharnavah || 12|| uru te parvata deva kham nabhirmadhusudana
    | padau te prithivi devi romanyoshadhayastatha || 13|| indrasomagnivaruna devasuramahoragah | prahvastvamupatishthanti
    stuvanto vividhaih stavaih || 14|| tvaya vyaptani sarvani bhutani bhuvaneshvara | yoginah sumahaviryah
    stuvanti tvam maharshayah || 15|| tvayi tushte jagatsvastham tvayi kruddhe mahadbhayam | bhayanamapanetasi
    tvamekah purushottama || 16|| devanam manushanam ca sarvabhutasukhavahah | tribhirvikramanairdeva
    trayo lokastvayahritah | suranam samriddhanam vinashashca tvaya kritah || 17|| tava vikramanairdeva
    nirvanamagamanparam | parabhavam ca daityendrastvayi kruddhe mahadyute || 18|| tvam hi karta vikarta
    ca bhutanamiha sarvashah | aradhayitva tvam devah sukhamedhanti sarvashah || 19|| iti mahabharate
    aranyake 192 adhyayantargatam uttangakritam vishnustotram sampurnam | mahabharata | aranyakaparva
    | adhyaya 192
  devanagari: उत्तङ्गकृतं २ विष्णुस्तोत्रम् तस्य प्रीतः स भगवान्साक्षाद्दर्शनमेयिवान् । दृष्ट्वैव चर्षिः
    प्रह्वस्तं तुष्टाव विविधैः स्तवैः ॥ १०॥ त्वया देव प्रजाः सर्वाः सदेवासुरमानवाः । स्थावराणि च भूतानि
    जङ्गमानि तथैव च । ब्रह्म वेदाश्च वेद्यं च त्वया सृष्टं महाद्युते ॥ ११॥ शिरस्ते गगनं देव नेत्रे शशिदिवाकरौ
    । निःश्वासः पवनश्चापि तेजोऽग्निश्च तवाच्युत । बाहवस्ते दिशः सर्वाः कुक्षिश्चापि महार्णवः ॥ १२॥ ऊरू
    ते पर्वता देव खं नाभिर्मधुसूदन । पादौ ते पृथिवी देवी रोमाण्योषधयस्तथा ॥ १३॥ इन्द्रसोमाग्निवरुणा देवासुरमहोरगाः
    । प्रह्वास्त्वामुपतिष्ठन्ति स्तुवन्तो विविधैः स्तवैः ॥ १४॥ त्वया व्याप्तानि सर्वाणि भूतानि भुवनेश्वर
    । योगिनः सुमहावीर्याः स्तुवन्ति त्वां महर्षयः ॥ १५॥ त्वयि तुष्टे जगत्स्वस्थं त्वयि क्रुद्धे महद्भयम्
    । भयानामपनेतासि त्वमेकः पुरुषोत्तम ॥ १६॥ देवानां मानुषाणां च सर्वभूतसुखावहः । त्रिभिर्विक्रमणैर्देव
    त्रयो लोकास्त्वयाहृताः । सुराणां समृद्धानां विनाशश्च त्वया कृतः ॥ १७॥ तव विक्रमणैर्देवा निर्वाणमगमन्परम्
    । पराभवं च दैत्येन्द्रास्त्वयि क्रुद्धे महाद्युते ॥ १८॥ त्वं हि कर्ता विकर्ता च भूतानामिह सर्वशः ।
    आराधयित्वा त्वां देवाः सुखमेधन्ति सर्वशः ॥ १९॥ इति महाभारते आरण्यके १९२ अध्यायान्तर्गतं उत्तङ्गकृतं
    विष्णुस्तोत्रं सम्पूर्णम् । महाभारत । आरण्यकपर्व । अध्याय १९२
