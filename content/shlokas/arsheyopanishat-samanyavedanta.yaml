id: arsheyopanishat-samanyavedanta
category: upanishad
name:
  english: arsheyopanishat (samanyavedanta)
  devanagari: आर्षेयोपनिषत् (सामान्यवेदान्त)
content:
  english: evahustama eke jyotireke'vakashameke paramam vyomaika atmanameka iti || tadu ha bharadvajo
    nanumene | yadiha sarve vetthettheti dyudire nasya tadrupam paryaptamiti | sa hovaca | artamivedam
    te vijnanamapi svidenadrodasyoreva paryayenopavanvimahi yadidamitthetthopavyakhyasyama iti | mahimanam
    tvevasyopase | yadidamatranvayattamiti | sa yadidamatranvayattam vedatha tathaivopaste'traivanvayatto
    bhavati | sa ya ihanvayattamidamavidvanevaitadupaste papiyan bhavatyartimarcchatyavamriyate yadevametadanvayattamupaste
    sarvamayureti vasiyan bhavati | sa ya etadenamupaste || tamitarah papraccha | katamat tvamanartam
    manyasa iti | sa hovaca | yadetasmin mandale'rcirdipyate bambhramyamanamiva cakashyamanamiva jajvalyamanamiva
    dedipyamanamiva lelihanam tadeva me brahma | tasyopavyakhyanam yadidamaddhaiva parah paravato'bhipadyante
    sampannamevaitat sammitameva yathopayatamatmaivabhicakshata iti | ya etadabhipadyeva guhniyadatho
    visphurantiva dhavantivotplavantivopashlipyantiva na haivabhipadyante | tadidamantike daviyo nediya
    iva durato na va asya mahimanam kashcidetiti || tadu ha na mene gautamo yadidamartamiva stimitamiva
    paryayena pashyantivemam mogham samvidana iti | ya ime pundrah suhmah kulumbha darada barbara iti
    | na ha va asamvidana eva dragivabhi tatpadyanta iti | mahimanam tvevasyopase | ya etadasminnantare
    hiranmayah purusho hiranyavarno hiranyashmashruranakhagrebhyo dipyamana iva | sa ya evamenamupaste'tiva
    sarvabhutani tishthanti sarvamayureti vasiyan bhavati | na ha va esha paramativodeti | yastvenam paramativodyantam
    pashyannupaste papiyan bhavati vivapadyata artimricchati | yastvenam paramanudyantam vedatha tathopaste
    param jyotirupasampadyate sarvamayureti vasiyan bhavati | sa ya evamenamupaste || tamitarah papraccha
    | katamat tvamanartam manyasa iti | tam hovaca | visphurantirevema lelayantiriva sanjihana iva nediyasitama
    iva daviyasitama eva daviyasitama iva nediyasitama eveti | yadapi bahudhacakshiranna kinca pratipadyata
    iti tanme brahmeti || tadu ha vasishtho nanumene | yadima visphurjayata evabhipadyante vivayanti mithu
    ceti vicakshate'kanda ivema na ha vai paramittha kashcanashnotyasamvidana iva | apa ye samvidrate
    tadetadantarvicakshata iti | mahimnah pashyema vijana iti | sa ya evamima mahimna evasya pashyannupaste
    mahimna evashnoti sarvamayureti vasiyan bhavati | yastvima avayatirevopaste na para sampadyamana no
    eva pareti papiyan bhavati vivapadyate pramiyate | atha ya imah para sampadyamana evopaste paraiva
    sampadyate sarvamayureti vasiyan bhavati || tamitarah papraccha | katamat tvamanartam manyasa iti
    | mahavijnanamiva pratipadenadhyavasayamiva yatraitaditthetthetyabhipashyati | atha neti netyetaditthettheti
    | sa va ayamatma ananto'jaro'paro na va are bahyo nantarah sarvavidbharupo vighasah prasarano'ntarjyotirvishvabhuk
    sarvasya vashi sarvasyeshanah sarvamabhikshipanna tamashnoti kashcana || parovariyamsamabhipranutyamantarjushanam
    bhuvanani vishva | yamashnavanna kushikaso agnim vaishvanaramritajatam gamadhyayi || 1|| bharebhareshu
    tamupahvayama prasasahim yudhyamindram varenyam | satrasa
  devanagari: एवाहुस्तम एके ज्योतिरेकेऽवकाशमेके परमं व्योमैक आत्मानमेक इति ॥ तदु ह भरद्वाजो नानुमेने ।
    यदिह सर्वे वेत्थेत्थेति द्यूदिरे नास्य तद्रूपं पर्याप्तमिति । स होवाच । आर्तमिवेदं ते विज्ञानमपि स्विदेनद्रोदस्योरेव
    पर्यायेणोपवन्वीमहि यदिदमित्थेत्थोपव्याख्यास्याम इति । महिमानं त्वेवास्योपासे । यदिदमत्रान्वायत्तमिति
    । स यदिदमत्रान्वायत्तं वेदाथ तथैवोपास्तेऽत्रैवान्वायत्तो भवति । स य इहान्वायत्तमिदमविद्वानेवैतदुपास्ते
    पापीयान् भवत्यार्तिमार्च्छत्यवम्रियते यदेवमेतदन्वायत्तमुपास्ते सर्वमायुरेति वसीयान् भवति । स य एतदेनमुपास्ते
    ॥ तमितरः पप्रच्छ । कतमत् त्वमनार्तं मन्यस इति । स होवाच । यदेतस्मिन् मण्डलेऽर्चिर्दीप्यते बम्भ्रम्यमाणमिव
    चाकश्यमानमिव जाज्वल्यमानमिव देदीप्यमानमिव लेलिहानं तदेव मे ब्रह्म । तस्योपव्याख्यानं यदिदमद्धैव पराः
    परावतोऽभिपद्यन्ते सम्पन्नमेवैतत् सम्मितमेव यथोपयातमात्मैवाभिचक्षत इति । य एतदभिपद्येव गुह्णीयादथो
    विस्फुरन्तीव धावन्तीवोत्प्लवन्तीवोपश्लिप्यन्तीव न हैवाभिपद्यन्ते । तदिदमन्तिके दवीयो नेदीय इव दूरतो
    न वा अस्य महिमानं कश्चिदेतीति ॥ तदु ह न मेने गौतमो यदिदमार्तमिव स्तिमितमिव पर्यायेण पश्यन्तीवेमं मोघं
    संविदाना इति । य इमे पुण्ड्राः सुह्माः कुलुम्भा दरदा बर्बरा इति । न ह वा असंविदाना एव द्रागिवाभि तत्पद्यन्त
    इति । महिमानं त्वेवास्योपासे । य एतदस्मिन्नन्तरे हिरण्मयः पुरुषो हिरण्यवर्णो हिरण्यश्मश्रुरानखाग्रेभ्यो
    दीप्यमान इव । स य एवमेनमुपास्तेऽतीव सर्वभूतानि तिष्ठन्ति सर्वमायुरेति वसीयान् भवति । न ह वा एष परमतीवोदेति
    । यस्त्वेनं परमतीवोद्यन्तं पश्यन्नुपास्ते पापीयान् भवति वीवपद्यत आर्तिमृच्छति । यस्त्वेनं परमनूद्यन्तं
    वेदाथ तथोपास्ते परं ज्योतिरुपसम्पद्यते सर्वमायुरेति वसीयान् भवति । स य एवमेनमुपास्ते ॥ तमितरः पप्रच्छ
    । कतमत् त्वमनार्तं मन्यस इति । तं होवाच । विस्फुरन्तीरेवेमा लेलायन्तीरिव सञ्जिहाना इव नेदीयसितमा इव
    दवीयसितमा एव दवीयसितमा इव नेदीयसितमा एवेति । यदपि बहुधाचक्षीरन्न किञ्च प्रतिपद्यत इति तन्मे ब्रह्मेति
    ॥ तदु ह वसिष्ठो नानुमेने । यदिमा विस्फूर्जयत एवाभिपद्यन्ते वीवयन्ति मिथु चेति विचक्षतेऽकाण्ड इवेमा
    न ह वै परमित्था कश्चनाश्नोत्यसंविदान इव । अप ये संविद्रते तदेतदन्तर्विचक्षत इति । महिम्नः पश्येमा
    विजान इति । स य एवमिमा महिम्न एवास्य पश्यन्नुपास्ते महिम्न एवाश्नोति सर्वमायुरेति वसीयान् भवति । यस्त्विमा
    अवयतीरेवोपास्ते न परा सम्पद्यमाना नो एव परेति पापीयान् भवति वीवपद्यते प्रमीयते । अथ य इमाः परा सम्पद्यमाना
    एवोपास्ते परैव सम्पद्यते सर्वमायुरेति वसीयान् भवति ॥ तमितरः पप्रच्छ । कतमत् त्वमनार्तं मन्यस इति ।
    महाविज्ञानमिव प्रतिपदेनाध्यवसायमिव यत्रैतदित्थेत्थेत्यभिपश्यति । अथ नेति नेत्येतदित्थेत्थेति । स वा
    अयमात्मा अनन्तोऽजरोऽपारो न वा अरे बाह्यो नान्तरः सर्वविद्भारूपो विघसः प्रसरणोऽन्तर्ज्योतिर्विश्वभुक्
    सर्वस्य वशी सर्वस्येशानः सर्वमभिक्षिपन्न तमश्नोति कश्चन ॥ परोवरीयांसमभिप्रणुत्यमन्तर्जुषाणं भुवनानि
    विश्वा । यमश्नवन्न कुशिकासो अग्निं वैश्वानरमृतजातं गमध्ययी ॥ १॥ भरेभरेषु तमुपह्वयाम प्रसासहिं युध्यमिन्द्रं
    वरेण्यम् । सत्रासा
