id: vishnustotramvasukritam
category: stotram
name:
  english: vishnustotramvasukritam
  devanagari: विष्णुस्तोत्रंवसुकृतम्
content:
  english: staumi devamajam nityam parinamavivarjitam | avriddhikshayamishanamacyutam paratah param ||
    51|| kalpanakritanamanamanirdeshyamajam vibhum | mulahetumahetum tvam vasudevam namamyaham || 52||
    paramarthaparairishashcintyate yah prajakaraih | tam vasudevamishesham namamyadya gunam param || 53||
    yasmadidam yatra cedamidam yo vishvamavyayam | tam vasudevamamalam namami parameshvaram || 54|| jneyam
    jnataramajaram bhoktaram prakriteh prabhum | purushasvarupinam devam nato'smi purusham param || 55||
    pradhanadivisheshantasvarupamajamavyayam | sthulasukshmamayam sarvavyapinam tam namamyaham || 56||
    srashta palayita cante yashca samharakarakah | trayimayam tam trigunam nato'smi purushottamam || 57||
    abrahmasthavarante ca yo jagatyatra samsthitah | vyaktarupi ca tam devam nato'ham vishnumavyayam ||
    58|| namo namo'stu te deva jagatamishvareshvara | paramartha paracintya vidhatah parameshvara || 59||
    tvamadiranto madhyam ca jagato'sya jagatpate | jagattvayi jagacca tvam jagattvatto jaganmaya || 60||
    tavagnirasam vasudhanghriyugmam nabhah shirashcandraravi ca netre | samastaloka jatharam bhujashca
    dishashcatasro bhagavannamaste || 61|| yadbhugatam yadgaganantarale yadva nabhasyakhilalokagam ca
    | yatsthulam sukshmam paratastato'pi yadasti yannasti ca tattvamisha || 62|| vedashca vedyam ca bhagavanananto
    vedantavedyashca samastaheto | vadanti tattva munayah paresham tvayi prasanne paramarthadrishye ||
    63|| namo hrishikesha tavaprameya namashca tubhyam paramarthasara | vishno namaste'stu paraparesha
    krishnacyutananta jagannivasa || 64|| namo'stu tubhyam parameshvaraya namastathantahkaranasthitaya
    | pradhanabhutaya namashca tubhyam vyaktasvarupena ca samsthitaya || 65|| samhritya vishvam jalashayine
    namo namashca te kaitabhasudanaya | svanabhipadmodarashayine ca brahmasvarupopanataya caiva || 66||
    srashtre namah palayitre sthitau ca sarvesha tubhyam purushottamaya | rudraya cante kshayahetave te
    nato'smi samharakaraya vishno || 67|| jaya prapannartiharaprameya jayagnivasvashvimaya prajesha |
    rudrendracandrastuta devadeva jayamaranamarishatanaya || 68|| jitam tvaya sarvaga sarvasaram sarvatmabhutakhila
    vedavedya | jitam jitakshamalacittadrishya caracaradhara dharadharedya || 69|| yajnashrayo yajnapumanashesha
    devesha martyasurayajnabhoktah | tvamidyamano'bhimatam dadasi dharadhareshacyuta vasudeva || 70||
    namaste devadeva tvam yatha pasyakhilam jagat | sthitau tatha samastebhyo doshebhyo mam samuddhara
    || 71|| krishnacyuta hrishikesha sarvabhutesha keshava | mahatmamstrahi mam bhaktam vasudeva prasida
    me || 72|| iti vishnudharmeshu dvisaptatitamo'dhyayantargatam vasukritam vishnustotram sampurnam |
  devanagari: स्तौमि देवमजं नित्यं परिणामविवर्जितम् । अवृद्धिक्षयमीशानमच्युतं परतः परम् ॥ ५१॥ कल्पनाकृतनामानमनिर्देश्यमजं
    विभुम् । मूलहेतुमहेतुं त्वां वासुदेवं नमाम्यहम् ॥ ५२॥ परमार्थपरैरीशश्चिन्त्यते यः प्रजाकरैः । तं वासुदेवमीशेशं
    नमाम्यद्य गुणं परम् ॥ ५३॥ यस्मादिदं यत्र चेदमिदं यो विश्वमव्ययम् । तं वासुदेवममलं नमामि परमेश्वरम्
    ॥ ५४॥ ज्ञेयं ज्ञातारमजरं भोक्तारं प्रकृतेः प्रभुम् । पुरुषस्वरूपिणं देवं नतोऽस्मि पुरुषं परम् ॥ ५५॥
    प्रधानादिविशेषान्तस्वरूपमजमव्ययम् । स्थूलसूक्ष्ममयं सर्वव्यापिनं तं नमाम्यहम् ॥ ५६॥ स्रष्टा पालयिता
    चान्ते यश्च संहारकारकः । त्रयीमयं तं त्रिगुणं नतोऽस्मि पुरुषोत्तमम् ॥ ५७॥ आब्रह्मस्थावरान्ते च यो
    जगत्यत्र संस्थितः । व्यक्तरूपी च तं देवं नतोऽहं विष्णुमव्ययम् ॥ ५८॥ नमो नमोऽस्तु ते देव जगतामीश्वरेश्वर
    । परमार्थ पराचिन्त्य विधातः परमेश्वर ॥ ५९॥ त्वमादिरन्तो मध्यं च जगतोऽस्य जगत्पते । जगत्त्वयि जगच्च
    त्वं जगत्त्वत्तो जगन्मय ॥ ६०॥ तवाग्निरासं वसुधाङ्घ्रियुग्मं नभः शिरश्चन्द्ररवी च नेत्रे । समस्तलोका
    जठरं भुजाश्च दिशश्चतस्रो भगवन्नमस्ते ॥ ६१॥ यद्भूगतं यद्गगनान्तराले यद्वा नभस्यखिललोकगं च । यत्स्थूलं
    सूक्ष्मं परतस्ततोऽपि यदस्ति यन्नास्ति च तत्त्वमीश ॥ ६२॥ वेदाश्च वेद्यं च भगवाननन्तो वेदान्तवेद्यश्च
    समस्तहेतो । वदन्ति तत्त्वा मुनयः परेशं त्वयि प्रसन्ने परमार्थदृश्ये ॥ ६३॥ नमो हृषीकेश तवाप्रमेय नमश्च
    तुभ्यं परमार्थसार । विष्णो नमस्तेऽस्तु परापरेश कृष्णाच्युतानन्त जगन्निवास ॥ ६४॥ नमोऽस्तु तुभ्यं परमेश्वराय
    नमस्तथान्तःकारणस्थिताय । प्रधानभूताय नमश्च तुभ्यं व्यक्तस्वरूपेण च संस्थिताय ॥ ६५॥ संहृत्य विश्वं
    जलशायिने नमो नमश्च ते कैटभसूदनाय । स्वनाभिपद्मोदरशायिने च ब्रह्मस्वरूपोपनताय चैव ॥ ६६॥ स्रष्ट्रे नमः
    पालयित्रे स्थितौ च सर्वेश तुभ्यं पुरुषोत्तमाय । रुद्राय चान्ते क्षयहेतवे ते नतोऽस्मि संहारकराय विष्णो
    ॥ ६७॥ जय प्रपन्नार्तिहराप्रमेय जयाग्निवस्वश्विमय प्रजेश । रुद्रेन्द्रचन्द्रस्तुत देवदेव जयामराणामरिशातनाय
    ॥ ६८॥ जितं त्वया सर्वग सर्वसारं सर्वात्मभूताखिल वेदवेद्य । जितं जिताक्षामलचित्तदृश्य चराचराधार धराधरेड्य
    ॥ ६९॥ यज्ञाश्रयो यज्ञपुमानशेष देवेश मर्त्यासुरयज्ञभोक्तः । त्वमीड्यमानोऽभिमतं ददासि धराधरेशाच्युत
    वासुदेव ॥ ७०॥ नमस्ते देवदेव त्वं यथा पास्यखिलं जगत् । स्थितौ तथा समस्तेभ्यो दोषेभ्यो मां समुद्धर ॥
    ७१॥ कृष्णाच्युत हृषीकेश सर्वभूतेश केशव । महात्मंस्त्राहि मां भक्तं वासुदेव प्रसीद मे ॥ ७२॥ इति विष्णुधर्मेषु
    द्विसप्ततितमोऽध्यायान्तर्गतं वसुकृतं विष्णुस्तोत्रं सम्पूर्णम् ।
