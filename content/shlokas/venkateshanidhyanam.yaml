id: venkateshanidhyanam
category: stotram
name:
  english: venkateshanidhyanam
  devanagari: वेन्कटेशनिध्यानम्
content:
  english: shrivenkateshanidhyanam ishanam jagato'sya venkatapatervishnoh param preyasim tadvakshassthalanityavasarasikam
    tatkshantisamvardhinim | padmalankritapanipallavayugam padmasanastham shriyam vatsalyadigunojjvalam
    bhagavatim vande jaganmataram || 1|| shrivenkateshadayitam shriyam ghatakabhavatah | samashritya vrishadrishacaranau
    sharanam shraye || 2|| shriman sheshagirisha te padayuge manjirasamrajite saktam manasamastu me tava
    shubhe janghe sujanvancite | rambhakantiharorukandayugalim praptam katim sevate kancinupurakinkiniparicitam
    pitambaralankritam || 3|| nabhipankajatundabandhanalasaddivyodarapashrayam padmakaustubhaharamalyasubhagam
    vakshassthalim gahate | sarvabhishtavarapradanakatibandhabjagryacakrojjvalaih hastaih shlishtamanalpabhushanayutaih
    kantham samalambate || 4|| muktaratnavirajikundalalasadgandam subimbadharam nasashobhi dayardralocanayugam
    subhrurdhvapundrojjvalam | vaktram ratnalalatikaparilasatbhalam satrishnam pibat maulau rajjati malyashobhini
    maharatnabhishekojjvale || 5|| bhuyo vaktramanuprasarpati tatah kanthavasaktam bhujaih shlishtam vakshasi
    padmaya paricite lagnam punarmadhyamam | katyurudvayajanushu pravitatam janghavasaktam padoh | praptam
    tishtati tatra gatrasushamasaktam vrishadrisha te || 6|| || iti shrivenkateshanidhyanam ||
  devanagari: श्रीवेङ्कटेशनिध्यानम् ईशानां जगतोऽस्य वेङ्कटपतेर्विष्णोः परां प्रेयसीं तद्वक्षस्स्थलनित्यवासरसिकां
    तत्क्षान्तिसंवर्धिनीम् । पद्मालङ्कृतपाणिपल्लवयुगां पद्मासनस्थां श्रियं वात्सल्यादिगुणोज्ज्वलां भगवतीं
    वन्दे जगन्मातरम् ॥ १॥ श्रीवेङ्कटेशदयितां श्रियं घटकभावतः । समाश्रित्य वृषाद्रीशचरणौ शरणं श्रये ॥ २॥
    श्रीमन् शेषगिरीश ते पदयुगे मञ्जीरसंराजिते सक्तं मानसमस्तु मे तव शुभे जङ्घे सुजान्वञ्चिते । रम्भाकान्तिहरोरुकाण्डयुगलीं
    प्राप्तं कटीं सेवते काञ्चीनूपुरकिङ्किणीपरिचितां पीताम्बरालङ्कृताम् ॥ ३॥ नाभीपङ्कजतुन्दबन्धनलसद्दिव्योदरापाश्रयं
    पद्माकौस्तुभहारमाल्यसुभगां वक्षस्स्थलीं गाहते । सर्वाभीष्टवरप्रदानकटिबन्धाब्जाग्र्यचक्रोज्ज्वलैः हस्तैः
    श्लिष्टमनल्पभूषणयुतैः कण्ठं समालम्बते ॥ ४॥ मुक्तारत्नविराजिकुण्डललसद्गण्डं सुबिम्बाधरं नासाशोभि दयार्द्रलोचनयुगं
    सुभ्रूर्ध्वपुण्ड्रोज्ज्वलम् । वक्त्रं रत्नललाटिकापरिलसत्भालं सतृष्णं पिबत् मौलौ रज्जति माल्यशोभिनि
    महारत्नाभिषेकोज्ज्वले ॥ ५॥ भूयो वक्त्रमनुप्रसर्पति ततः कण्ठावसक्तं भुजैः श्लिष्टं वक्षसि पद्मया परिचिते
    लग्नं पुनर्मध्यमम् । कट्यूरुद्वयजानुषु प्रविततं जङ्घावसक्तं पदोः । प्राप्तं तिष्टति तत्र गात्रसुषमासक्तं
    वृषाद्रीश ते ॥ ६॥ ॥ इति श्रीवेङ्कटेशनिध्यानम् ॥
