id: shrilalitatripurasundarihridayastotram
category: hridaya
name:
  english: shrilalitatripurasundarihridayastotram
  devanagari: श्रीललितात्रिपुरसुन्दरिहृदयस्तोत्रम्
content:
  english: ringaraparikham mahapadmatavim bhaje | cintamanimaharatnagriharajam namamyaham || 15|| purvamnayamayam
    purvadvaram devi bhajami te | dakshinamnaya rupam te dakshinadvaramashraye || 16|| namami te param
    dvaram pashcimamnayarupakam | vande'hamuttaram dvaramuttaramnayarupakam || 17|| urdhvamnayama'ham
    vande urdhvadvaram kuleshvari | lalite tava deveshi mahasimhasanam bhaje || 18|| brahmatmakamancapadamekam
    tava namamyaham | ekam vishnumayam mancapadam tava namamyaham || 19|| ekam rudramayam mancapadam tava
    namamyaham | mancapadam namamyekam tava devishvaratmakam || 20|| mancaikaphalakam vande sadashivamayam
    shubham | namami te hamsatulatalimam parameshvari || 21|| bhajami te hamsatula mahopadhanamuttamam
    | kausumbhastaranam devi tava nityam namamyaham || 22|| manasapuja | mahavitanakam vande mahajavanikam
    bhaje | evam pujagriham dhyatva shricakrasya shivapriye || 23|| maddakshine sthapayami bhage pushpakshatadikam
    | abhitaste mahadevi dipa~stan darshayamyaham || 24|| mulena tripuracakram tava sampujayamyaham |
    tribhihkhandaistava tryastram pujayami shivapriye || 25|| vayvagnijalasamyuktapranayamairaham shive
    | shoshanam dahanam devi karomyaplavanam tatha || 26|| trivaram mulamantrena pranayamam karomyaham
    | apasarpantu te bhuta ye bhuta bhumisamsthitah || 27|| ye bhuta vighnakartaraste nashyantu shivajnaya
    | karomyanena mantrena talatrayamaham shive || 28|| narayano'ham brahma'ham bhairavo'ham shivo'smyaham
    | devo'ham paramatma'ham mahatripurasundari || 29|| dhyatvaivam vajrakavacam nyasam tava karomyaham
    | kumaribijasamyuktam mahatripurasundari || 30|| mam raksha raksheti hridi karomyanjalimishvari |
    namo devyasanayeti te karomyasanam shive || 31|| cakrasanam namasyami sarvamantrasanam bhaje | sadhyasiddhasanam
    vande mantrairebhirmaheshvari || 32|| karomyasmimshcakramantradevatasanamuttamam | karomyatha shadangakhyam
    matrikashca karomyaham || 33|| vashinyadyashtakam nyasam shodhanyasam karomyaham | mahashodham tatah
    kurve navayonyakhyamuttamam || 34|| cakranyasam tatah kurve shrikanthanyasamuttamam | keshavadi mahanyasam
    kamanyasam karomyaham || 35|| kalanyasam tatah kurve kurve kamakalahvayam | pithanyasam tatah kurve
    tattvanyasam karomyaham || 36|| tatah karomi sthityadinyasam tat tripureshvari | tatah shuddhodakenaham
    vamabhage maheshvari || 37|| karomi mandalam vrittam caturasram shivapriye | pushpairabhyarcya sadharam
    shankham samsthapayamyaham || 38|| arcayami shadangena jalamapurayamyaham | dadami cadimam bindum
    kurve mulabhimantritam || 39|| tajjalena jaganmatastrikonam vrittasamyutam | shatkonam caturastram
    ca mandalam prakaromyaham || 40|| vidyaya pujanam madhye khandaistryastrabhipujanam | bijavritya konashatkam
    pujayami shivapriye || 41|| tasmin dashakalayuktamagnimandalamashraye | dhumarcisham namasyami ushmam
    ca jvalinim bhaje || 42|| jvalinim ca namasyami vande'ham visphullinginim | sushriyam ca surupam ca
    kapilam pranamamyaham || 43|| naumi havyavaham nityam bhaje kavyavaham kalam | yadibhih sahita vahneh
    kala dasha tatha bhaje || 44|| suryasya mandalam tatra kaladvadashakatmakam | arghyapatre tva'ham
    vande tapinim tapinim bhaje || 45|| dhumram maricim vande'ham jvalinim ca rucim bhaje | sushumnam
    bhogadam vande bhaje vishvam ca bodhinim || 46|| dharinim ca kshamam vande saura etah kala bhaje |
    somasya mandalam tatra kalah shodashakatmakah || 47|| arghyamritatmakam vande'mritam manadam stuve
    | pusham tushtim bhaje pushtim ratim dhritimaham bhaje || 48|| shashinim candrikam vande kantim jyotsnam
    shriyam bhaje | naumi pritim cangadam ca purnam purnamritam bhaje || 49|| svaraih shodashabhiryukta
    bhaje somasya vai kalah | trikonalekhanam kurve akathadisurekhakam || 50|| haḻakshavarnasamyuktam
    sthitantarhamsabhasvaram | vakkamashaktisamyuktam hamsenaradhayamyaham || 51|| vrittadbahih shadasre
    ca lekhanam prakaromyaham | purobhagadi shatkonam shadangenarcayamyaham || 52|| shrividyayah saptavaram
    karomyatrabhimantranam | samarpayami vishveshi tasmin gandhakshatadikam || 53|| dhyayami pujadravyam
    te sarvam vidyamayam shubham | caturnavati sanmantran sprishtva tatprajapamyaham || 54|| vahnerdashakalah
    suryakaladvadashakam bhaje | ashraye shodashakalastatra somasya kamadah || 55|| srishtimriddhim smritim
    vande medham kantim namamyaham | lakshmim dhritim sthiramvande sthitim siddhim bhajamyaham || 56||
    etam brahmakalam vande jaram tam palinim bhaje | shantim namamishvarim ca ratim vande ca kamikam ||
    57|| varadam hladinim vande pritim dirgham bhajamyaham | tadibhih sahita vishnoh kala dasha tatha
    bhaje || 58|| eta vishnoh kala vande tikshnam raudrim bhayam tatha | nidram tandram kshudham vande
    namami krodhinim kriyam || 59|| udgarim ca bhaje mrityumeta rudrakala bhaje | pitam shvetam bhaje
    nityamarunam ca tatha bhaje || 60|| bhaje'sitam tatha'nantam shadibhih sahitastatha | ishvarasya kala
    hyeta vande nityamabhishtadah || 61|| nivrittim ca pratishtham ca vidyam shantim namamyaham | indhikam
    dipikam caiva recikam mocikam tatha || 62|| param sukshmam namasyami naumi sukshmamritam kalam | vande
    jnanam kalam caiva tatha jnanamritam kalam || 63|| apyayinim vyapinim ca vyomarupam namamyaham | kalah
    sadashivasyaitah shodasha pranamamyaham || 64|| hamsakhyam ca mahamantram jyotisham hamsamashraye
    | pratatprathamavishvantam mantram jyotishamashraye || 65|| tryambakam ca namasyami tadvishnoh pranamamyaham
    | vishnuryonim mulavidyam mantrairebhiranuttamaih || 66|| amritam mantritam vande caturnavatibhistava
    | akhandaikarasanandakare'parasudhatmani || 67|| svacchandasphuranamatra nidhehyakularupini | akulasthamritakare
    shuddhajnanakare pare || 68|| amritatvam nidhehyasmin vastuni klinnarupini | tadrupinyaikarasyatvam
    kritva hyetatsvarupini || 69|| bhutva paramrita''kara mayi citsphuranam kuru | amriteshim namasyami
    sarvadamritavarshinim || 70|| vagvadinim namasyami shrividyam pranamamyaham | ebhirmanuttamairvande
    mantritam paramamritam || 71|| jyotirmayamidam kurve paramarghyam maheshvari| tadbindubhirme shirasi
    trigurun pujayamyaham || 72|| brahma'hamasmi tadbindum kundalinya juhomyaham | hriccakrastha mahadevim
    mahatripurasundarim || 73|| nirastamohatimiram sakshat samvitsvarupinim | nasapute parakalamatha nirgamayamyaham
    || 74|| samanayami tam haste trikhandakusumanjalau | jaganmatarmahadevi mahatripurasundari || 75||
    sudhacaitanyamurtim te kalpayami namah shive | anena manuna devi yantre tvam sthapayamyaham || 76||
    mahapadmavanantahsthe karananandavigrahe | sarvabhutahite matarehyehi parameshvari || 77|| deveshi
    bhaktisulabhe sarvavaranasamyute | yavat tvam pujayishyami tavat tvam susthira bhava || 78|| anena
    mantrayugmena tvamatravahayamyaham | kalpayami namah padyamarghyam te kalpayamyaham || 79|| sugandhatailabhyangam
    ca majjashalapraveshanam | kalpayami namastasmin manipithopaveshanam || 80|| divyasnaniyamishani grihanodvartanam
    shubham | grihanoshnodakasnanam kalpayami namastava || 81|| hemakumbhacyutaistirthaih kalpayamyabhishecanam
    | kalpayami namastubhyam dhautena parimarjanam || 82|| balabhanupratikasham dukulaparidhanakam | arunena
    dukulenottariyam kalpayami te || 83|| praveshanam kalpayami tavalepanamandapam | namaste kalpayamyatra
    manipithopaveshanam || 84|| ashtagandhaih kalpayami sarvangeshu vilepanam | kalagaru mahadhupastava
    keshabharasya hi || 85|| mallikamalatijaticampakadimanoramaih | racitahkusumairmalah kalpayami namastava
    || 86|| praveshanam kalpayami namo bhushanamandapam | upavesham ratnapithe tatra te kalpayamyaham
    || 87|| navamanikyamukutam taccandrashakalam tatah | tatah simantasinduram tatastilakamuttamam ||
    88|| kalanjanam kalpayami paliyugalamuttamam | manikundalayugmam te nasabharanamishvari || 89|| te
    kalpayami tripure lalita'dharayavakam | atha''dyabhushanam kanthe hemacintakamuttamam || 90|| padakam
    te kalpayami mahapadakamuttamam | kalpayami namo muktavalimekavalim ca te || 91|| channaviram ca keyurayugalanam
    catushtayam | valayavalimishani urmikavalimishvari || 92|| kancidamakatisutram saubhagyabharanam ca
    te | tripure padakatakam kalpaye ratnanupuram || 93|| padanguliyakam tubhyam pashamekakare tava |
    anyasminnankusham devi pundrekshudhanusham pare || 94|| apare pushpabana~shca shrimanmanikyapaduke
    | navavaranadevibhirmahacakradhirohanam || 95|| kameshvarankaparyanka upaveshanamuttamam | sudhasavakhyam
    cashakam tatah acamaniyakam || 96|| karpuravitikam tubhyam kalpayami namah shive | anandollasavelasahasam
    te kalpayamyaham || 97|| mangalarartikam devi chatram te kalpayamyaham | tatashcamarayugmam te darpanam
    kalpayamyaham || 98|| talavrintam kalpayami gandham pushpam maheshvari | dhupam dipam ca naivedyam
    kalpayami namastava || 99|| atha'ham vaindave cakre sarvanandamayatmike | ratnasimhasane ramye samasinam
    shivapriyam || 100|| dhyanam | udyadbhanusahasrabhyam japapushpasamaprabham | navaratnaprabhadiptamukutena
    virajitam || 101|| candrarekhasamopetam kasturitilakancitam | kamakodandasaundaryanirjitabhrulatayugam
    || 102|| anjanancitanetram tam padmapatranibhekshanam | manikundalasamyuktakarnadvayavirajitam ||
    103|| muktamanikyakhacitanasikabharananvitam | madapatalasamyuktakapolayugalanvitam || 104|| pakvabimbaphalabhasadharadvayavirajitam
    | shuddhamuktavaliprakhyadantapanktivirajitam || 105|| tambulapuritamukhim susmitasyavirajitam | adyabhushanasamyuktam
    hemacintakasamyutam || 106|| padakena samopetam mahapadakasamyutam | muktavalisamopetamekavalivirajitam
    || 107|| keyurangadasamyuktacaturbahuvirajitam | ashtagandhasamopetam shricandanavilepanam || 108||
    hemakumbhasamaprakhyastanadvayavirajitam | raktavastraparidhanam raktakancukasamyutam || 109|| sukshmaromavaliyuktatanumadhyavirajitam
    | muktamanikyakhacitakanciyutanitambinim || 110|| sadashivankasthaprithumahajaghanamandalam | kadalistambhasankashauruyugmavirajitam
    || 111|| kadalikantisankashajanghayugalashobhitam | gudhagulphadvayopetam raktapadayuganvitam || 112||
    brahmavishnumahadevashiromukutajataya | kantya virajitapadam bhaktatranaparayanam || 113|| ikshukarmukapushpeshu
    pashankushadharam param | samvitsvarupinim devim dhyayami parameshvarim || 114|| iti dhyanam | pradarshayamyatha
    shive navamudra varapradah | tvam tarpayami tripure tridha mulena parvati || 115|| agneyyamishadigbhage
    nairrityam marute tatha | madhye dikshu shadangani kramadabhyarcayamyaham || 116|| adyam kameshvarim
    vande namami bhagamalinim | nityaklinnam namasyami bherundam pranamamyaham || 117|| vahnivasam namasyami
    mahavajreshvarim stuve | shivadutim namasyami tvaritam kulasundarim || 118|| nityam nilapatakam ca
    vijayam sarvamangalam | jvalamalam ca citram ca mahanityam ca samstuve || 119|| divyaughebhyo namasyami
    pareshaparameshvarim | mitreshamatha shashthishamuddisham pranamamyaham || 120|| caryanatham namasyami
    lopamudramaham bhaje | agastyam pranamasyami siddhaughe kalatapanam || 121|| dharmacaryam namasyami
    muktakeshishvaram bhaje | bhaje dipakalanatham manavaughe tatah param || 122|| vishnudevam namasyami
    prabhakaramaham bhaje | tejodevam namasyami manojamatha samstuve || 123|| kalyanadevam kalaye ratnadevam
    bhajamyaham | vasudevam namasyami shriramanandamashraye || 124|| parameshthigurum vande paramam gurumashraye
    | shrigurum pranamasyami murdhni brahmabile sthitam || 125|| kam bile'ham namasyami shriguroh padukam
    tatah | atha prathamike devi caturasre taveshvari || 126|| animam laghimam vande mahimam pranamamyaham
    | ishitvasiddhim vande'ham vashitvam ca namamyaham || 127|| prakamyasiddhim vande'ham bhuktimicchamaham
    bhaje | praptisiddhim sarvakamapradasiddhimaham bhaje || 128|| madhyame caturasre'ham brahmim maheshvarim
    bhaje | kaumarim vaishnavim vande varahim pranamamyaham || 129|| mahendrimapi camundam mahalakshmimaham
    bhaje | tritiye caturasre'ham sarvasamkshobhinim bhaje || 130|| sarvavidravinim mudram sarvakarshinikam
    bhaje | mudram vashankarim vande sarvonmadinikam bhaje || 131|| bhaje mahankusham mudram khecarim
    pranamamyaham | bijamudram yonimudram bhaje sarvatrikhandinim || 132|| trailokyamohanam cakram namami
    lalite tava | namami yoginim tatra prakatakhyamabhishtadam || 133|| sudharnavasanam vande tatra te
    parameshvari | cakreshvarim tatra vande tripuram parameshvarim || 134|| sarvesamkshobhinim mudram
    tato'ham kalaye shive | atha'ham shodashadale kamakarshanikam bhaje || 135|| buddhyakarshanikam vande'hankarakarshanim
    bhaje | shabdakarshanikam vande sparshakarshanikam bhaje || 136|| rupakarshanikam vande rasakarshanikam
    bhaje | gandhakarshanikam vande cittakarshanikam bhaje || 137|| dhairyakarshanikam vande smrityakarshanikam
    bhaje | namakarshanikam vande bijakarshanikam bhaje || 138|| atmakarshanikam vande hyamritakarshanim
    bhaje | sharirakarshanim vande nityam shriparameshvarim || 139|| sarvashapurakam cakram kalaye'ham
    taveshvari | guptakhyam yoginim vande tatra'ham guptapujitam || 140|| pitambujasanam tatra namami
    lalite tava | tripureshim mahadevim bhajamishtarthamsiddhidam || 141|| sarvamvidravinim mudram tatra'ham
    tam vicintaye | shive tavashtapatre'hamanangakusumam bhaje || 142|| anangamekhalam vande hyanangamadanam
    bhaje | tato'ham pranamasyami hyanangamadanaturam || 143|| anangarekham kalaye bhaje te'nangaveginim
    | bhaje'nangankusham devi tava canangamalinim || 144|| sarvasamkshobhanam cakram tatra'ham kalaye
    sada | vande guptatarakhyam tam yoginim sarvakamadam || 145|| tatra'ham pranamasyami devyatmasanamuttamam
    | namami jagadishanima'ham tripurasundarim || 146|| sarvakarshanikam mudram tatra'ham kalayami te
    | bhuvanare tava shive sarvasamkshobhinim bhaje || 147|| sarvavidravinim vande'ham sarvakarshinikam
    bhaje | sakalahladinim vande sarvasammohinim bhaje || 148|| sakala stambhinim vande kalaye sarvajrimbhinim
    | vashankarim namasyami sarvaranjanikam bhaje || 149|| sakalonmadinim vande bhaje sarvarthasadhinim
    | sampattipurinim vande sarvamantramayim bhaje || 150|| bhajamyaham tatah shaktim sarvadvandvakshayankarim
    | tatra'ham kalaye cakram sarvasaubhagyadayakam || 151|| namami jagatam dhatrim sampradayakhyayoginim
    | shive tava namasyami shricakrasanamuttamam || 152|| namami jagadishanimaham tripuravasinim | kalaye'ham
    tava shive mudram sarvavashankarim || 153|| bahirdashare te devi sarvasiddhipradam bhaje | sarvasampatpradam
    vande bhaje sarvapriyankarim || 154|| namamyaham tato devim sarvamangalakarinim | sarvakamapradam
    vande sarvaduhkhavimocinim || 155|| sarvamrityuprashamanim sarvavighnanivarinim | sarvangasundarim
    devim sarvasaubhagyadayinim || 156|| sarvarthasadhakam cakram tatha'ham kalaye sada | kalayami tato
    devim kulottirnakhyayoginim || 157|| sarvamantrasanam vande tripurashriyamashraye | kalayami tato
    mudram sarvonmadanakarinim || 158|| antardashare te devi sarvajnam pranamamyaham | sarvashaktim namasyami
    sarvaishvaryapradam bhaje || 159|| sarvajnanamayim vande sarvavyadhivinashinim | sarvadharasvarupam
    ca sarvapapaharam bhaje || 160|| sarvanandamayim vande sarvarakshasvarupinim | pranamami mahadevim
    sarvepsitapradam bhaje || 161|| sarvarakshakaram cakram tatra'ham kalaye sada | nigarbhayoginim vande
    tatra'ham parameshvarim || 162|| sadhyasimhasanam vande bhaje tripuramalinim | kalayami tato devi
    mudram sarvamahankusham || 163|| ashtare vashinim vande bhaje kameshvarim sada | modinim vimalam vande
    hyarunam jayinim bhaje || 164|| sarveshvarim namasyami kaulinim pranamamyaham | sarvarogaharam cakram
    tava'ham devi cintaye || 165|| rahasyayoginim devim sada'ham kalayami te | namami tripurasiddham bhaje
    mudram ca khecarim || 166|| mahatrikonasya bahye caturdikshu maheshvari | namami jrimbhnan banan capam
    sammohanam bhaje || 167|| pasham vashankaram vande bhaje stambhanamankusham | trikone'ham jagaddhatrim
    mahakameshvarim bhaje || 168|| mahavajreshvarim vande mahashrimalinim bhaje | mahashrisundarim vande
    sarvakamaphalapradam || 169|| sarvasiddhipradam cakram tava devi namamyaham | namamyatirahasyakhyam
    yoginim tatra kamadam || 170|| tripurambam namasyami bijamudram namamyaham | mulamantrena lalite tvam
    bindau pujayamyaham || 171|| sarvanandamayam cakram namami lalite tava | parapararahasyakhyam yoginim
    kalaye sada || 172|| mahacakreshvarim vande yonimudramaham bhaje | dhupadikam sarvamayi te kalpayamyaham
    || 173|| tvatpritaye mahamudram darshayami tatah shive | tridha tvam mulamantrena tarpayami tatah
    shive || 174|| shalyannam madhusamyuktam payasapupasamyutam | ghritasupasamayuktam sarvabhakshyasamanvitam
    || 175|| sasitam kshirasamyuktam bahushakasamanvitam | nikshipya kancane patre naivedyam kalpayami
    te || 176|| sankalpya binduna vaktram kucau bindudvayena ca | yonim tu saparardhena kritva shritripure
    tava || 177|| etat kamakalarupam bhaktanam sarvakamadam | sarvasampatpradam vande namaste tripureshvari
    || 178|| vamabhage trikonam ca vrittam ca caturasrakam | kritva gandhakshatadyaishca hyarcayami maheshvari
    || 179|| vagbhavadyam namasyami tatra vyapakamandalam | jalayuktardrannayuktam makaratrayabhajanam
    || 180|| tatra vinyasya dasyami bhutebhyo balimuttamam | namaste devadeveshi namastrailokyavandite
    || 181|| namah parashivankasthe namastripurasundari | pradakshinam namaskaram manasa'ham karomi te
    || 182|| tatah sakalamantranam samrajnim parameshvarim | prajapami mahavidyam tvatprityarthamaham
    sada | tava vidyam prajaptva'tha staumi tvam parameshvarim || 183|| mahadevi maheshani sadashiva mahapriye
    | mahanitye mahasiddhe tvamaham sharanam vraje || 184|| jaya tvam tripure devi lalite jagadishvari
    | sadashivapriyakari pahi mam karunakari || 185|| jaganmatarjagadrupe jagadishvaravallabhe | jaganmaye
    jagastulye gauri tvamahamashraye || 186|| anadye sarvalokanamadye bhakteshtadayini | girirajasya tanaye
    namaste tripureshvari || 187|| jayadidevadeveshi brahmamatarnamo'stu te | vishnumataranadyante haramatah
    sureshvari || 188|| brahmadisurasamstutye lokatrayavashankari | sarvasampatprade nitye tvamaham kalaye
    sada || 189|| nityanande niradhare cidrupini shivapriye | animadigunadhare tvam sada kalayamyaham
    || 190|| brahmyadimatrisamstutye sarvavaranasamyute | jyotirmaye maharupe pahi mam tripure sada ||
    191|| lakshmivanyadisampujye brahmavishnushivastute | bhajami tava padabjam sarvakamaphalapradam ||
    192|| sarvashaktisamopetam sarvabhishtaphalaprade | namami tava padabjam devi tripurasundari || 193||
    tvatpriyartham tatah kamshcicchaktim sampujayamyaham | mapancakena tam shaktim tarpayami maheshvari
    || 194|| tayopetam havihshesham cidagnau prajuhomyaham | tvatpriyartham mahadevi mamabhishtarthasiddhaye
    || 195|| baddhva tam khecarim mudram kshamasvodvasayamyaham | tishtha me hridaye nityam tripure parameshvari
    || 196|| jagadambe maharajni mahashakti shivapriye | hriccakre tishtha satatam mahatripurasundari
    || 197|| sarvalokaikasampujye sakalavaranairyute | hriccakre tishtha me nityam mahatripurasundari
    || 198|| || phalashruti || etat tripurasundarya hridayam sarvakamadam | maharahasyam paramam durlabham
    daivatairapi || 1|| sakshat sadashivenoktam guhyadguhyamanuttamam || 2|| yah pathennityamekagrah sha
  devanagari: ृङ्गारपरिखां महापद्माटवीं भजे । चिन्तामणिमहारत्नगृहराजं नमाम्यहम् ॥ १५॥ पूर्वाम्नायमयं पूर्वद्वारं
    देवि भजामि ते । दक्षिणाम्नाय रूपं ते दक्षिणद्वारमाश्रये ॥ १६॥ नमामि ते परं द्वारं पश्चिमाम्नायरूपकम्
    । वन्देऽहमुत्तरं द्वारमुत्तराम्नायरूपकम् ॥ १७॥ ऊर्ध्वाम्नायमऽहं वन्दे ऊर्ध्वद्वारं कुलेश्वरि । ललिते
    तव देवेशि महासिंहासनं भजे ॥ १८॥ ब्रह्मात्मकमञ्चपादमेकं तव नमाम्यहम् । एकं विष्णुमयं मञ्चपादं तव नमाम्यहम्
    ॥ १९॥ एकं रुद्रमयं मञ्चपादं तव नमाम्यहम् । मञ्चपादं नमाम्येकं तव देवीश्वरात्मकम् ॥ २०॥ मञ्चैकफलकं
    वन्दे सदाशिवमयं शुभम् । नमामि ते हंसतूलतलिमां परमेश्वरि ॥ २१॥ भजामि ते हंसतूल महोपाधानमुत्तमम् । कौसुम्भास्तरणं
    देवि तव नित्यं नमाम्यहम् ॥ २२॥ मानसपूजा । महावितानकं वन्दे महाजवनिकां भजे । एवं पूजागृहं ध्यात्वा
    श्रीचक्रस्य शिवप्रिये ॥ २३॥ मद्दक्षिणे स्थापयामि भागे पुष्पाक्षतादिकम् । अभितस्ते महादेवि दीपाँस्तान्
    दर्शयाम्यहम् ॥ २४॥ मूलेन त्रिपुराचक्रं तव सम्पूजयाम्यहम् । त्रिभिःखण्डैस्तव त्र्यस्त्रं पूजयामि शिवप्रिये
    ॥ २५॥ वाय्वग्निजलसंयुक्तप्राणायामैरहं शिवे । शोषणं दाहनं देवि करोम्याप्लावनं तथा ॥ २६॥ त्रिवारं मूलमन्त्रेण
    प्राणायामं करोम्यहम् । अपसर्पन्तु ते भूता ये भूता भूमिसंस्थिताः ॥ २७॥ ये भूता विघ्नकर्तारस्ते नश्यन्तु
    शिवाज्ञया । करोम्यनेन मन्त्रेण तालत्रयमहं शिवे ॥ २८॥ नारायणोऽहं ब्रह्माऽहं भैरवोऽहं शिवोऽस्म्यहम्
    । देवोऽहं परमात्माऽहं महात्रिपुरसुन्दरि ॥ २९॥ ध्यात्वैवं वज्रकवचं न्यासं तव करोम्यहम् । कुमारीबीजसंयुक्तं
    महात्रिपुरसुन्दरि ॥ ३०॥ मां रक्ष रक्षेति हृदि करोम्यञ्जलिमीश्वरि । नमो देव्यासनायेति ते करोम्यासनं
    शिवे ॥ ३१॥ चक्रासनं नमस्यामि सर्वमन्त्रासनं भजे । साध्यसिद्धासनं वन्दे मन्त्रैरेभिर्महेश्वरि ॥ ३२॥
    करोम्यस्मिंश्चक्रमन्त्रदेवतासनमुत्तमम् । करोम्यथ षडङ्गाख्यं मातृकाश्च करोम्यहम् ॥ ३३॥ वशिन्याद्यष्टकं
    न्यासं षोढान्यासं करोम्यहम् । महाषोढां ततः कुर्वे नवयोन्याख्यमुत्तमम् ॥ ३४॥ चक्रन्यासं ततः कुर्वे
    श्रीकण्ठन्यासमुत्तमम् । केशवादि महान्यासं कामन्यासं करोम्यहम् ॥ ३५॥ कलान्यासं ततः कुर्वे कुर्वे कामकलाह्वयम्
    । पीठन्यासं ततः कुर्वे तत्त्वन्यासं करोम्यहम् ॥ ३६॥ ततः करोमि स्थित्यादिन्यासं तत् त्रिपुरेश्वरि ।
    ततः शुद्धोदकेनाहं वामभागे महेश्वरि ॥ ३७॥ करोमि मण्डलं वृत्तं चतुरस्रं शिवप्रिये । पुष्पैरभ्यर्च्य
    साधारं शङ्खं संस्थापयाम्यहम् ॥ ३८॥ अर्चयामि षडङ्गेन जलमापूरयाम्यहम् । ददामि चादिमं बिन्दुं कुर्वे
    मूलाभिमन्त्रितम् ॥ ३९॥ तज्जलेन जगन्मातस्त्रिकोणं वृत्तसंयुतम् । षट्कोणं चतुरस्त्रं च मण्डलं प्रकरोम्यहम्
    ॥ ४०॥ विद्यया पूजनं मध्ये खण्डैस्त्र्यस्त्राभिपूजनम् । बीजावृत्या कोणषट्कं पूजयामि शिवप्रिये ॥ ४१॥
    तस्मिन् दशकलायुक्तमग्निमण्डलमाश्रये । धूमार्चिषं नमस्यामि ऊष्मां च ज्वलिनीं भजे ॥ ४२॥ ज्वलिनीं च नमस्यामि
    वन्देऽहं विस्फुल्लिङ्गिनीम् । सुश्रियं च सुरूपां च कपिलां प्रणमाम्यहम् ॥ ४३॥ नौमि हव्यवहां नित्यं
    भजे कव्यवहां कलाम् । यादिभिः सहिता वह्नेः कला दश तथा भजे ॥ ४४॥ सूर्यस्य मण्डलं तत्र कलाद्वादशकात्मकम्
    । अर्घ्यपात्रे त्वऽहं वन्दे तपिनीं तापिनीं भजे ॥ ४५॥ धूम्रां मरीचिं वन्देऽहं ज्वालिनीं च रुचिं भजे
    । सुषुम्णां भोगदां वन्दे भजे विश्वां च बोधिनीम् ॥ ४६॥ धारिणीं च क्षमां वन्दे सौरा एताः कला भजे । सोमस्य
    मण्डलं तत्र कलाः षोडशकात्मकाः ॥ ४७॥ अर्घ्यामृतात्मकं वन्देऽमृतां मानदां स्तुवे । पूषां तुष्टिं भजे
    पुष्टिं रतिं धृतिमहं भजे ॥ ४८॥ शशिनीं चन्द्रिकां वन्दे कान्तिं ज्योत्स्नां श्रियं भजे । नौमि प्रीतिं
    चाङ्गदां च पूर्णां पूर्णामृतां भजे ॥ ४९॥ स्वरैः षोडशभिर्युक्ता भजे सोमस्य वै कलाः । त्रिकोणलेखनं कुर्वे
    अकथादिसुरेखकम् ॥ ५०॥ हळक्षवर्णसंयुक्तं स्थितान्तर्हंसभास्वरम् । वाक्कामशक्तिसंयुक्तं हंसेनाराधयाम्यहम्
    ॥ ५१॥ वृत्ताद्बहिः षडस्रे च लेखनं प्रकरोम्यहम् । पुरोभागादि षट्कोणं षडङ्गेनार्चयाम्यहम् ॥ ५२॥ श्रीविद्यायाः
    सप्तवारं करोम्यत्राभिमन्त्रणम् । समर्पयामि विश्वेशि तस्मिन् गन्धाक्षतादिकम् ॥ ५३॥ ध्यायामि पूजाद्रव्यं
    ते सर्वं विद्यामयं शुभम् । चतुर्नवति सन्मन्त्रान् स्पृष्ट्वा तत्प्रजपाम्यहम् ॥ ५४॥ वह्नेर्दशकलाः सूर्यकलाद्वादशकं
    भजे । आश्रये षोडशकलास्तत्र सोमस्य कामदाः ॥ ५५॥ सृष्टिमृद्धिं स्मृतिं वन्दे मेधां कान्तिं नमाम्यहम्
    । लक्ष्मीं धृतिं स्थिरांवन्दे स्थितिं सिद्धिं भजाम्यहम् ॥ ५६॥ एतां ब्रह्मकलां वन्दे जरां तां पालिनीं
    भजे । शान्तिं नमामीश्वरीं च रतिं वन्दे च कामिकाम् ॥ ५७॥ वरदां ह्लादिनीं वन्दे प्रीतिं दीर्घां भजाम्यहम्
    । टादिभिः सहिता विष्णोः कला दश तथा भजे ॥ ५८॥ एता विष्णोः कला वन्दे तीक्ष्णां रौद्रीं भयां तथा । निद्रां
    तन्द्रां क्षुधां वन्दे नमामि क्रोधिनीं क्रियाम् ॥ ५९॥ उद्गारीं च भजे मृत्युमेता रुद्रकला भजे । पीतां
    श्वेतां भजे नित्यमरुणां च तथा भजे ॥ ६०॥ भजेऽसितां तथाऽनन्तां षादिभिः सहितास्तथा । ईश्वरस्य कला ह्येता
    वन्दे नित्यमभीष्टदाः ॥ ६१॥ निवृत्तिं च प्रतिष्ठां च विद्यां शान्तिं नमाम्यहम् । इन्धिकां दीपिकां चैव
    रेचिकां मोचिकां तथा ॥ ६२॥ परां सूक्ष्मां नमस्यामि नौमि सूक्ष्मामृतां कलाम् । वन्दे ज्ञानां कलां चैव
    तथा ज्ञानामृतां कलाम् ॥ ६३॥ आप्यायिनीं व्यापिनीं च व्योमरूपां नमाम्यहम् । कलाः सदाशिवस्यैताः षोडश
    प्रणमाम्यहम् ॥ ६४॥ हांसाख्यं च महामन्त्रं ज्योतिषं हंसमाश्रये । प्रतत्प्रथमविश्वान्तं मन्त्रं ज्योतिषमाश्रये
    ॥ ६५॥ त्र्यम्बकं च नमस्यामि तद्विष्णोः प्रणमाम्यहम् । विष्णुर्योनिं मूलविद्यां मन्त्रैरेभिरनुत्तमैः
    ॥ ६६॥ अमृतं मन्त्रितं वन्दे चतुर्नवतिभिस्तव । अखण्डैकरसानन्दकरेऽपरसुधात्मनि ॥ ६७॥ स्वच्छन्दस्फुरणामत्र
    निधेह्यकुलरूपिणि । अकुलस्थामृताकारे शुद्धज्ञानकरे परे ॥ ६८॥ अमृतत्वं निधेह्यस्मिन् वस्तुनि क्लिन्नरूपिणि
    । तद्रूपिण्यैकरस्यत्वं कृत्वा ह्येतत्स्वरूपिणि ॥ ६९॥ भूत्वा परामृताऽऽकारा मयि चित्स्फुरणं कुरु । अमृतेशीं
    नमस्यामि सर्वदामृतवर्षिणीम् ॥ ७०॥ वाग्वादिनीं नमस्यामि श्रीविद्यां प्रणमाम्यहम् । एभिर्मनूत्तमैर्वन्दे
    मन्त्रितं परमामृतम् ॥ ७१॥ ज्योतिर्मयमिदं कुर्वे परमर्घ्यं महेश्वरि। तद्बिन्दुभिर्मे शिरसि त्रिगुरून्
    पूजयाम्यहम् ॥ ७२॥ ब्रह्माऽहमस्मि तद्बिन्दुं कुण्डलिन्या जुहोम्यहम् । हृच्चक्रस्था महादेवीं महात्रिपुरसुन्दरीम्
    ॥ ७३॥ निरस्तमोहतिमिरां साक्षात् संवित्स्वरूपिणीम् । नासापुटे परकलामथ निर्गमयाम्यहम् ॥ ७४॥ समानयामि
    तां हस्ते त्रिखण्डकुसुमाञ्जलौ । जगन्मातर्महादेवि महात्रिपुरसुन्दरि ॥ ७५॥ सुधाचैतन्यमूर्तिं ते कल्पयामि
    नमः शिवे । अनेन मनुना देवि यन्त्रे त्वां स्थापयाम्यहम् ॥ ७६॥ महापद्मवनान्तःस्थे कारणानन्दविग्रहे ।
    सर्वभूतहिते मातरेह्येहि परमेश्वरि ॥ ७७॥ देवेशि भक्तिसुलभे सर्वावरणसंयुते । यावत् त्वां पूजयिष्यामि
    तावत् त्वं सुस्थिरा भव ॥ ७८॥ अनेन मन्त्रयुग्मेन त्वामत्रावाहयाम्यहम् । कल्पयामि नमः पाद्यमर्घ्यं ते
    कल्पयाम्यहम् ॥ ७९॥ सुगन्धतैलाभ्यङ्गं च मज्जशालाप्रवेशनम् । कल्पयामि नमस्तस्मिन् मणिपीठोपवेशनम् ॥ ८०॥
    दिव्यस्नानीयमीशानि गृहाणोद्वर्तनं शुभम् । गृहाणोष्णोदकस्नानं कल्पयामि नमस्तव ॥ ८१॥ हेमकुम्भच्युतैस्तीर्थैः
    कल्पयाम्यभिषेचनम् । कल्पयामि नमस्तुभ्यं धौतेन परिमार्जनम् ॥ ८२॥ बालभानुप्रतीकाशं दुकूलपरिधानकम् ।
    अरुणेन दुकूलेनोत्तरीयं कल्पयामि ते ॥ ८३॥ प्रवेशनं कल्पयामि तवालेपनमण्डपम् । नमस्ते कल्पयाम्यत्र मणिपीठोपवेशनम्
    ॥ ८४॥ अष्टगन्धैः कल्पयामि सर्वाङ्गेषु विलेपनम् । कालागरु महाधूपस्तव केशभरस्य हि ॥ ८५॥ मल्लिकामालतीजातीचम्पकादिमनोरमैः
    । रचिताःकुसुमैर्मालाः कल्पयामि नमस्तव ॥ ८६॥ प्रवेशनं कल्पयामि नमो भूषणमण्डपम् । उपवेशं रत्नपीठे तत्र
    ते कल्पयाम्यहम् ॥ ८७॥ नवमाणिक्यमुकुटं तच्चन्द्रशकलं ततः । ततः सीमन्तसिन्दूरं ततस्तिलकमुत्तमम् ॥ ८८॥
    कालाञ्जनं कल्पयामि पालीयुगलमुत्तमम् । मणिकुण्डलयुग्मं ते नासाभरणमीश्वरि ॥ ८९॥ ते कल्पयामि त्रिपुरे
    ललिताऽधरयावकम् । अथाऽऽद्यभूषणं कण्ठे हेमचिन्ताकमुत्तमम् ॥ ९०॥ पदकं ते कल्पयामि महापदकमुत्तमम् । कल्पयामि
    नमो मुक्तावलिमेकावलिं च ते ॥ ९१॥ छन्नवीरं च केयूरयुगलानां चतुष्टयम् । वलयावलिमीशानि ऊर्मिकावलिमीश्वरि
    ॥ ९२॥ काञ्चीदामकटीसूत्रं सौभाग्याभरणं च ते । त्रिपुरे पादकटकं कल्पये रत्ननूपुरम् ॥ ९३॥ पादाङ्गुलीयकं
    तुभ्यं पाशमेककरे तव । अन्यस्मिन्नङ्कुशं देवि पुण्ड्रेक्षुधनुषं परे ॥ ९४॥ अपरे पुष्पबाणाँश्च श्रीमन्माणिक्यपादुके
    । नवावरणदेवीभिर्महाचक्राधिरोहणम् ॥ ९५॥ कामेश्वराङ्कपर्यङ्क उपवेशनमुत्तमम् । सुधासवाख्यं चषकं ततः आचमनीयकम्
    ॥ ९६॥ कर्पूरवीटिकां तुभ्यं कल्पयामि नमः शिवे । आनन्दोल्लासवेलासहासं ते कल्पयाम्यहम् ॥ ९७॥ मङ्गलारार्तिकं
    देवि छत्रं ते कल्पयाम्यहम् । ततश्चामरयुग्मं ते दर्पणं कल्पयाम्यहम् ॥ ९८॥ तालवृन्तं कल्पयामि गन्धं
    पुष्पं महेश्वरि । धूपं दीपं च नैवेद्यं कल्पयामि नमस्तव ॥ ९९॥ अथाऽहं वैन्दवे चक्रे सर्वानन्दमयात्मिके
    । रत्नसिंहासने रम्ये समासीनां शिवप्रियाम् ॥ १००॥ ध्यानम् । उद्यद्भानुसहस्राभ्यां जपापुष्पसमप्रभाम्
    । नवरत्नप्रभादीप्तमुकुटेन विराजिताम् ॥ १०१॥ चन्द्ररेखासमोपेतां कस्तूरीतिलकाञ्चिताम् । कामकोदण्डसौन्दर्यनिर्जितभ्रूलतायुगाम्
    ॥ १०२॥ अञ्जनाञ्चितनेत्रां तां पद्मपत्रनिभेक्षणाम् । मणिकुण्डलसंयुक्तकर्णद्वयविराजिताम् ॥ १०३॥ मुक्तामाणिक्यखचितनासिकाभरणान्विताम्
    । मदपाटलसंयुक्तकपोलयुगलान्विताम् ॥ १०४॥ पक्वबिम्बफलाभासाधरद्वयविराजिताम् । शुद्धमुक्तावलिप्रख्यदन्तपङ्क्तिविराजिताम्
    ॥ १०५॥ ताम्बूलपूरितमुखीं सुस्मितास्यविराजिताम् । आद्यभूषणसंयुक्तां हेमचिन्ताकसंयुताम् ॥ १०६॥ पदकेन
    समोपेतां महापदकसंयुताम् । मुक्तावलिसमोपेतामेकावलिविराजिताम् ॥ १०७॥ केयूराङ्गदसंयुक्तचतुर्बाहुविराजिताम्
    । अष्टगन्धसमोपेतां श्रीचन्दनविलेपनाम् ॥ १०८॥ हेमकुम्भसमप्रख्यस्तनद्वयविराजिताम् । रक्तवस्त्रपरीधानां
    रक्तकञ्चुकसंयुताम् ॥ १०९॥ सूक्ष्मरोमावलीयुक्ततनुमध्यविराजिताम् । मुक्तामाणिक्यखचितकाञ्चीयुतनितम्बिनीम्
    ॥ ११०॥ सदाशिवाङ्कस्थपृथुमहाजघनमण्डलाम् । कदलीस्तम्भसङ्काशऊरुयुग्मविराजिताम् ॥ १११॥ कदलीकान्तिसङ्काशजङ्घायुगलशोभिताम्
    । गूढगुल्फद्वयोपेतां रक्तपादयुगान्विताम् ॥ ११२॥ ब्रह्माविष्णुमहादेवशिरोमुकुटजातया । कान्त्या विराजितपदां
    भक्तत्राणपरायणाम् ॥ ११३॥ इक्षुकार्मुकपुष्पेषु पाशाङ्कुशधरां पराम् । संवित्स्वरूपिणीं देवीं ध्यायामि
    परमेश्वरीम् ॥ ११४॥ इति ध्यानम् । प्रदर्शयाम्यथ शिवे नवमुद्रा वरप्रदाः । त्वां तर्पयामि त्रिपुरे त्रिधा
    मूलेन पार्वति ॥ ११५॥ आग्नेय्यामीशदिग्भागे नैरृत्यां मारुते तथा । मध्ये दिक्षु षडङ्गानि क्रमादभ्यर्चयाम्यहम्
    ॥ ११६॥ आद्यां कामेश्वरीं वन्दे नमामि भगमालिनीम् । नित्यक्लिन्नां नमस्यामि भेरुण्डां प्रणमाम्यहम् ॥
    ११७॥ वह्निवासां नमस्यामि महावज्रेश्वरीं स्तुवे । शिवदूतीं नमस्यामि त्वरितां कुलसुन्दरीम् ॥ ११८॥ नित्यां
    नीलपताकां च विजयां सर्वमङ्गलाम् । ज्वालामालां च चित्रां च महानित्यां च संस्तुवे ॥ ११९॥ दिव्यौघेभ्यो
    नमस्यामि परेशपरमेश्वरीम् । मित्रेशमथ षष्ठीशमुड्डीशं प्रणमाम्यहम् ॥ १२०॥ चर्यानाथं नमस्यामि लोपामुद्रामहं
    भजे । अगस्त्यं प्रणमस्यामि सिद्धौघे कालतापनम् ॥ १२१॥ धर्माचार्यं नमस्यामि मुक्तकेशीश्वरं भजे । भजे
    दीपकलानाथं मानवौघे ततः परम् ॥ १२२॥ विष्णुदेवं नमस्यामि प्रभाकरमहं भजे । तेजोदेवं नमस्यामि मनोजमथ संस्तुवे
    ॥ १२३॥ कल्याणदेवं कलये रत्नदेवं भजाम्यहम् । वासुदेवं नमस्यामि श्रीरामानन्दमाश्रये ॥ १२४॥ परमेष्ठिगुरुं
    वन्दे परमं गुरुमाश्रये । श्रीगुरुं प्रणमस्यामि मूर्ध्नि ब्रह्मबिले स्थितम् ॥ १२५॥ कं बिलेऽहं नमस्यामि
    श्रीगुरोः पादुकां ततः । अथ प्राथमिके देवि चतुरस्रे तवेश्वरि ॥ १२६॥ अणिमां लघिमां वन्दे महिमां प्रणमाम्यहम्
    । ईशित्वसिद्धिं वन्देऽहं वशित्वं च नमाम्यहम् ॥ १२७॥ प्राकाम्यसिद्धिं वन्देऽहं भुक्तिमिच्छामहं भजे
    । प्राप्तिसिद्धिं सर्वकामप्रदासिद्धिमहं भजे ॥ १२८॥ मध्यमे चतुरस्रेऽहं ब्राह्मीं माहेश्वरीं भजे । कौमारीं
    वैष्णवीं वन्दे वाराहीं प्रणमाम्यहम् ॥ १२९॥ माहेन्द्रीमपि चामुण्डां महालक्ष्मीमहं भजे । तृतीये चतुरस्रेऽहं
    सर्वसंक्षोभिणीं भजे ॥ १३०॥ सर्वविद्राविणीं मुद्रां सर्वाकर्षिणिकां भजे । मुद्रां वशङ्करीं वन्दे सर्वोन्मादिनिकां
    भजे ॥ १३१॥ भजे महाङ्कुशां मुद्रां खेचरीं प्रणमाम्यहम् । बीजमुद्रां योनिमुद्रां भजे सर्वत्रिखण्डिनीम्
    ॥ १३२॥ त्रैलोक्यमोहनं चक्रं नमामि ललिते तव । नमामि योगिनीं तत्र प्रकटाख्यामभीष्टदाम् ॥ १३३॥ सुधार्णवासनं
    वन्दे तत्र ते परमेश्वरि । चक्रेश्वरीं तत्र वन्दे त्रिपुरां परमेश्वरीम् ॥ १३४॥ सर्वेसंक्षोभिणीं मुद्रां
    ततोऽहं कलये शिवे । अथाऽहं षोडशदले कामाकर्षणिकां भजे ॥ १३५॥ बुद्ध्याकर्षणिकां वन्देऽहङ्काराकर्षणीं
    भजे । शब्दाकर्षणिकां वन्दे स्पर्शाकर्षणिकां भजे ॥ १३६॥ रूपाकर्षणिकां वन्दे रसाकर्षणिकां भजे । गन्धाकर्षणिकां
    वन्दे चित्ताकर्षणिकां भजे ॥ १३७॥ धैर्याकर्षणिकां वन्दे स्मृत्याकर्षणिकां भजे । नामाकर्षणिकां वन्दे
    बीजाकर्षणिकां भजे ॥ १३८॥ आत्माकर्षणिकां वन्दे ह्यमृताकर्षणीं भजे । शरीराकर्षणीं वन्दे नित्यां श्रीपरमेश्वरीम्
    ॥ १३९॥ सर्वाशापूरकं चक्रं कलयेऽहं तवेश्वरि । गुप्ताख्यां योगिनीं वन्दे तत्राऽहं गुप्तपूजिताम् ॥ १४०॥
    पीताम्बुजासनं तत्र नमामि ललिते तव । त्रिपुरेशीं महादेवीं भजामीष्टार्थंसिद्धिदाम् ॥ १४१॥ सर्वंविद्राविणीं
    मुद्रां तत्राऽहं तां विचिन्तये । शिवे तवाष्टपत्रेऽहमनङ्गकुसुमां भजे ॥ १४२॥ अनङ्गमेखलां वन्दे ह्यनङ्गमदनां
    भजे । ततोऽहं प्रणमस्यामि ह्यनङ्गमदनातुराम् ॥ १४३॥ अनङ्गरेखां कलये भजे तेऽनङ्गवेगिनीम् । भजेऽनङ्गाङ्कुशां
    देवि तव चानङ्गमालिनीम् ॥ १४४॥ सर्वसंक्षोभणं चक्रं तत्राऽहं कलये सदा । वन्दे गुप्ततराख्यां तां योगिनीं
    सर्वकामदाम् ॥ १४५॥ तत्राऽहं प्रणमस्यामि देव्यात्मासनमुत्तमम् । नमामि जगदीशानीमऽहं त्रिपुरसुन्दरीम्
    ॥ १४६॥ सर्वाकर्षणिकां मुद्रां तत्राऽहं कलयामि ते । भुवनारे तव शिवे सर्वसंक्षोभिणीं भजे ॥ १४७॥ सर्वविद्राविणीं
    वन्देऽहं सर्वाकर्षिणिकां भजे । सकलाह्लादिनीं वन्दे सर्वसम्मोहिनीं भजे ॥ १४८॥ सकल स्तम्भिनीं वन्दे
    कलये सर्वजृम्भिनीम् । वशङ्करीं नमस्यामि सर्वरञ्जनिकां भजे ॥ १४९॥ सकलोन्मादिनीं वन्दे भजे सर्वार्थसाधिनीम्
    । सम्पत्तिपूरिणीं वन्दे सर्वमन्त्रमयीं भजे ॥ १५०॥ भजाम्यहं ततः शक्तिं सर्वद्वन्द्वक्षयङ्करीम् । तत्राऽहं
    कलये चक्रं सर्वसौभाग्यदायकम् ॥ १५१॥ नमामि जगतां धात्रीं सम्प्रदायाख्ययोगिनीम् । शिवे तव नमस्यामि श्रीचक्रासनमुत्तमम्
    ॥ १५२॥ नमामि जगदीशानीमहं त्रिपुरवासिनीम् । कलयेऽहं तव शिवे मुद्रां सर्ववशङ्करीम् ॥ १५३॥ बहिर्दशारे
    ते देवि सर्वसिद्धिप्रदां भजे । सर्वसम्पत्प्रदां वन्दे भजे सर्वप्रियङ्करीम् ॥ १५४॥ नमाम्यहं ततो देवीं
    सर्वमङ्गलकारिणीम् । सर्वकामप्रदां वन्दे सर्वदुःखविमोचिनीम् ॥ १५५॥ सर्वमृत्युप्रशमनीं सर्वविघ्ननिवारिणीम्
    । सर्वाङ्गसुन्दरीं देवीं सर्वसौभाग्यदायिनीम् ॥ १५६॥ सर्वार्थसाधकं चक्रं तथाऽहं कलये सदा । कलयामि ततो
    देवीं कुलोत्तीर्णाख्ययोगिनीम् ॥ १५७॥ सर्वमन्त्रासनं वन्दे त्रिपुराश्रीयमाश्रये । कलयामि ततो मुद्रां
    सर्वोन्मादनकारिणीम् ॥ १५८॥ अन्तर्दशारे ते देवि सर्वज्ञां प्रणमाम्यहम् । सर्वशक्तिं नमस्यामि सर्वैश्वर्यप्रदां
    भजे ॥ १५९॥ सर्वज्ञानमयीं वन्दे सर्वव्याधिविनाशिनीम् । सर्वाधारस्वरूपां च सर्वपापहरां भजे ॥ १६०॥ सर्वानन्दमयीं
    वन्दे सर्वरक्षास्वरूपिणीम् । प्रणमामि महादेवीं सर्वेप्सितप्रदां भजे ॥ १६१॥ सर्वरक्षाकरं चक्रं तत्राऽहं
    कलये सदा । निगर्भयोगिनीं वन्दे तत्राऽहं परमेश्वरीम् ॥ १६२॥ साध्यसिंहासनं वन्दे भजे त्रिपुरमालिनीम्
    । कलयामि ततो देवि मुद्रां सर्वमहाङ्कुशाम् ॥ १६३॥ अष्टारे वशिनीं वन्दे भजे कामेश्वरीं सदा । मोदिनीं
    विमलां वन्दे ह्यरुणां जयिनीं भजे ॥ १६४॥ सर्वेश्वरीं नमस्यामि कौलिनीं प्रणमाम्यहम् । सर्वरोगहरं चक्रं
    तवाऽहं देवि चिन्तये ॥ १६५॥ रहस्ययोगिनीं देवीं सदाऽहं कलयामि ते । नमामि त्रिपुरासिद्धां भजे मुद्रां
    च खेचरीम् ॥ १६६॥ महात्रिकोणस्य बाह्ये चतुर्दिक्षु महेश्वरि । नमामि जृम्भ्णान् बाणान् चापं सम्मोहनं
    भजे ॥ १६७॥ पाशं वशङ्करं वन्दे भजे स्तम्भनमङ्कुशम् । त्रिकोणेऽहं जगद्धात्रीं महाकामेश्वरीं भजे ॥ १६८॥
    महावज्रेश्वरीं वन्दे महाश्रीमालिनीं भजे । महाश्रीसुन्दरीं वन्दे सर्वकामफलप्रदाम् ॥ १६९॥ सर्वसिद्धिप्रदं
    चक्रं तव देवि नमाम्यहम् । नमाम्यतिरहस्याख्यां योगिनीं तत्र कामदाम् ॥ १७०॥ त्रिपुराम्बां नमस्यामि बीजमुद्रां
    नमाम्यहम् । मूलमन्त्रेण ललिते त्वां बिन्दौ पूजयाम्यहम् ॥ १७१॥ सर्वानन्दमयं चक्रं नमामि ललिते तव ।
    परापररहस्याख्यां योगिनीं कलये सदा ॥ १७२॥ महाचक्रेश्वरीं वन्दे योनिमुद्रामहं भजे । धूपादिकं सर्वमयि
    ते कल्पयाम्यहम् ॥ १७३॥ त्वत्प्रीतये महामुद्रां दर्शयामि ततः शिवे । त्रिधा त्वां मूलमन्त्रेण तर्पयामि
    ततः शिवे ॥ १७४॥ शाल्यन्नं मधुसंयुक्तं पायसापूपसंयुतम् । घृतसूपसमायुक्तं सर्वभक्ष्यसमन्वितम् ॥ १७५॥
    ससितं क्षीरसंयुक्तं बहुशाकसमन्वितम् । निक्षिप्य काञ्चने पात्रे नैवेद्यं कल्पयामि ते ॥ १७६॥ सङ्कल्प्य
    बिन्दुना वक्त्रं कुचौ बिन्दुद्वयेन च । योनिं तु सपरार्धेन कृत्वा श्रीत्रिपुरे तव ॥ १७७॥ एतत् कामकलारूपं
    भक्तानां सर्वकामदम् । सर्वसम्पत्प्रदं वन्दे नमस्ते त्रिपुरेश्वरि ॥ १७८॥ वामभागे त्रिकोणं च वृत्तं
    च चतुरस्रकम् । कृत्वा गन्धाक्षताद्यैश्च ह्यर्चयामि महेश्वरि ॥ १७९॥ वाग्भवाद्यं नमस्यामि तत्र व्यापकमण्डलम्
    । जलयुक्तार्द्रान्नयुक्तं मकारत्रयभाजनम् ॥ १८०॥ तत्र विन्यस्य दास्यामि भूतेभ्यो बलिमुत्तमम् । नमस्ते
    देवदेवेशि नमस्त्रैलोक्यवन्दिते ॥ १८१॥ नमः परशिवाङ्कस्थे नमस्त्रिपुरसुन्दरि । प्रदक्षिणां नमस्कारं
    मनसाऽहं करोमि ते ॥ १८२॥ ततः सकलमन्त्राणां सम्राज्ञीं परमेश्वरीम् । प्रजपामि महाविद्यां त्वत्प्रीत्यार्थमहं
    सदा । तव विद्यां प्रजप्त्वाऽथ स्तौमि त्वां परमेश्वरीम् ॥ १८३॥ महादेवि महेशानि सदाशिव महाप्रिये । महानित्ये
    महासिद्धे त्वामहं शरणं व्रजे ॥ १८४॥ जय त्वं त्रिपुरे देवि ललिते जगदीश्वरि । सदाशिवप्रियकरि पाहि मां
    करुणाकरि ॥ १८५॥ जगन्मातर्जगद्रूपे जगदीश्वरवल्लभे । जगन्मये जगस्तुल्ये गौरि त्वामहमाश्रये ॥ १८६॥ अनाद्ये
    सर्वलोकानामाद्ये भक्तेष्टदायिनि । गिरिराजस्य तनये नमस्ते त्रिपुरेश्वरि ॥ १८७॥ जयादिदेवदेवेशि ब्रह्ममातर्नमोऽस्तु
    ते । विष्णुमातरनाद्यन्ते हरमातः सुरेश्वरि ॥ १८८॥ ब्रह्मादिसुरसंस्तुत्ये लोकत्रयवशङ्करि । सर्वसम्पत्प्रदे
    नित्ये त्वामहं कलये सदा ॥ १८९॥ नित्यानन्दे निराधारे चिद्रूपिणि शिवप्रिये । अणिमादिगुणाधारे त्वां सदा
    कलयाम्यहम् ॥ १९०॥ ब्राह्म्यादिमातृसंस्तुत्ये सर्वावरणसंयुते । ज्योतिर्मये महारूपे पाहि मां त्रिपुरे
    सदा ॥ १९१॥ लक्ष्मीवाण्यादिसम्पूज्ये ब्रह्मविष्णुशिवस्तुते । भजामि तव पादाब्जं सर्वकामफलप्रदम् ॥ १९२॥
    सर्वशक्तिसमोपेतं सर्वाभीष्टफलप्रदे । नमामि तव पादाब्जं देवि त्रिपुरसुन्दरि ॥ १९३॥ त्वत्प्रियार्थं
    ततः कांश्चिच्छक्तिं सम्पूजयाम्यहम् । मपञ्चकेन तां शक्तिं तर्पयामि महेश्वरि ॥ १९४॥ तयोपेतं हविःशेषं
    चिदग्नौ प्रजुहोम्यहम् । त्वत्प्रियार्थं महादेवि ममाभीष्टार्थसिद्धये ॥ १९५॥ बद्ध्वा तां खेचरीं मुद्रां
    क्षमस्वोद्वासयाम्यहम् । तिष्ठ मे हृदये नित्यं त्रिपुरे परमेश्वरि ॥ १९६॥ जगदम्बे महाराज्ञि महाशक्ति
    शिवप्रिये । हृच्चक्रे तिष्ठ सततं महात्रिपुरसुन्दरि ॥ १९७॥ सर्वलोकैकसम्पूज्ये सकलावरणैर्युते । हृच्चक्रे
    तिष्ठ मे नित्यं महात्रिपुरसुन्दरि ॥ १९८॥ ॥ फलश्रुति ॥ एतत् त्रिपुरसुन्दर्या हृदयं सर्वकामदम् । महारहस्यं
    परमं दुर्लभं दैवतैरपि ॥ १॥ साक्षात् सदाशिवेनोक्तं गुह्याद्गुह्यमनुत्तमम् ॥ २॥ यः पठेन्नित्यमेकाग्रः
    श
