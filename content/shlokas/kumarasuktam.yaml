id: kumarasuktam
category: sukta
name:
  english: kumarasuktam
  devanagari: कुमारसूक्तम्
content:
  english: 11 tu̱vi̱grivo̭ vrisha̱bho va̭vridha̱no̭'sha̱trva1̱̭ryah sama̭jati̱ veda̭h | iti̱mama̱gnima̱mrita̭
    avocanba̱rhishma̭te̱ mana̭ve̱ sharma̭ yamsaddha̱vishma̭te̱ mana̭ve̱ sharma̭ yamsat || 5
  devanagari: ११ तु॒वि॒ग्रीवो॑ वृष॒भो वा॑वृधा॒नो॑ऽश॒त्र्व१॒॑र्यः सम॑जाति॒ वेदः॑ । इती॒मम॒ग्निम॒मृता॑ अवोचन्ब॒र्हिष्म॑ते॒
    मन॑वे॒ शर्म॑ यंसद्ध॒विष्म॑ते॒ मन॑वे॒ शर्म॑ यंसत् ॥ ५
