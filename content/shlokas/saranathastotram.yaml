id: saranathastotram
category: stotram
name:
  english: saranathastotram
  devanagari: सारनाथस्तोत्रम्
content:
  english: saranathastotram sarakshetrapatim sarojajapatim saratiduram sada saram saravimanagam suravaram
    sareshvarinayakam | nityam sarasarovare viracitasnanadvijaradhitam samsarabdhitarim sarojanayanam
    tam saranatham bhaje || 1|| sarvatattvalaya shriman vyakritadhashiro hare | paramatman saranatha raksha
    mam sharanagatam || 2|| samastajagadadhara shankhacakragadadhara | saranatha mamanujnam dehi tvattirthasevane
    || 3|| sarakshetre saranathah sarapushkarinitate | ramaya saranayakya vimane sarasanjnake || 4|| avyajakripaya
    nityam tatra sannihito harih | shritabhishtam dadannityam modate suribhih saha || 5|| pancasaramidam
    nityam yah smaret prayatah puman | sa sarvanarthitanarthan dhruvamapnoti purushah || 6|| nacyarucaruvadanambujarajahamsam
    satsarakhaccaritapurnamudarahasam | samsarasagaratarim hridayabjavasam tam shrinivasamamajam svaramavatamsam
    || 7|| namaste saranathaya kaverivaradayine | sarvapapavinashaya sarvabhishtapradayine || 8|| sarakshetra
    nivasaya sarapushkarinitate | yasya prasadat kaveri gangadhikyam pura gata || 9|| bhaktabhishtaphalapradanghriyugalam
    kausheyarajatkatim lakshmimangalamandirorasi lasanmuktavalikaustubham | hastaih shankharathangapankajagada
    bibhranamabhrakritim rakacandramukham sujatamakutam shrisaranatham bhaje || 10|| sarakshetre pavitre
    sujanasukhakare sarakasaratire saravyavyomayane viracitanilayah saranecya sametah | sarambhodhanakanjayitanayanayugah
    phalasaundaryasarah samsarabdherasarat sa hariravatu mam saranatho rameshah || 11|| alodya cintitapada
    shrutiraha yasma
  devanagari: सारनाथस्तोत्रम् सारक्षेत्रपतिं सरोजजपतिं सारातिदूरं सदा सारं सारविमानगं सुरवरं सारेश्वरीनायकम्
    । नित्यं सारसरोवरे विरचितस्नानद्विजाराधितं संसाराब्धितरिं सरोजनयनं तं सारनाथं भजे ॥ १॥ सर्वतत्त्वालय
    श्रीमन् व्याकृताधशिरो हरे । परमात्मन् सारनाथ रक्ष मां शरणागतम् ॥ २॥ समस्तजगदाधार शङ्खचक्रगदाधर । सारनाथ
    ममानुज्ञां देहि त्वत्तीर्थसेवने ॥ ३॥ सारक्षेत्रे सारनाथः सारपुष्करिणीतटे । रमया सारनायक्या विमाने
    सारसान्ज्ञके ॥ ४॥ अव्याजकृपया नित्यं तत्र सन्निहितो हरिः । श्रिताभीष्टं ददन्नित्यं मोदते सूरिभिः सह
    ॥ ५॥ पञ्चसारमिदं नित्यं यः स्मरेत् प्रयतः पुमान् । स सर्वानर्थितानर्थान् ध्रुवमाप्नोति पूरुषः ॥ ६॥
    नाच्यारुचारुवदनाम्बुजराजहंसं सत्सारखच्चरितपूर्णमुदारहासम् । संसारसागरतरिं हृदयाब्जवासं तं श्रीनिवासममजं
    स्वरमावतंसम् ॥ ७॥ नमस्ते सारनाथाय कावेरीवरदायिने । सर्वपापविनाशाय सर्वाभीष्टप्रदायिने ॥ ८॥ सारक्षेत्र
    निवासाय सारपुष्करिणीतटे । यस्य प्रसादात् कावेरी गङ्गाधिक्यं पुरा गता ॥ ९॥ भक्ताभीष्टफलप्रदाङ्घ्रियुगलं
    कौशेयराजत्कटिं लक्ष्मीमङ्गलमन्दिरोरसि लसन्मुक्तावलीकौस्तुभम् । हस्तैः शङ्खरथाङ्गपङ्कजगदा बिभ्राणमभ्राकृतिं
    राकाचन्द्रमुखं सुजातमकुटं श्रीसारनाथं भजे ॥ १०॥ सारक्षेत्रे पवित्रे सुजनसुखकरे सारकासारतीरे साराव्यव्योमयाने
    विरचितनिलयः सारनेच्या समेतः । साराम्भोधानकञ्जायितनयनयुगः फालसौन्दर्यसारः संसाराब्धेरसारात् स हरिरवतु
    मां सारनाथो रमेशः ॥ ११॥ आलोड्य चिन्तितपदा श्रुतिराह यस्मा
