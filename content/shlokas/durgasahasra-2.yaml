id: durgasahasra-2
category: sahasranama
name:
  english: durgasahasra
  devanagari: दुर्गासहस्र
content:
  english: asya shridurgastotramahamantrasya | himavan rishih | anushtup chandah | durgabhagavati devata
    | shridurgaprasadasiddhyarthe jape viniyogah | shribhagavatyai durgayai namah | devidhyanam om hrim
    kalabhrabham katakshairarikulabhayadam maulibaddhendurekham shankham cakram kripanam trishikhamapi
    karairudvahantim trinetram | simhaskandhadhirudham tribhuvanamakhilam tejasa purayantim dhyayed durgam
    jayakhyam tridashaparivritam sevitam siddhikamaih || shri jayadurgayai namah | om shiva'thoma rama
    shaktirananta nishkala'mala | shanta maheshvari nitya shashvata parama kshama || 1|| acintya kevalananta
    shivatma paramatmika | anadiravyaya shuddha sarvajna sarvaga'cala || 2|| ekanekavibhagastha mayatita
    sunirmala | mahamaheshvari satya mahadevi niranjana || 3|| kashtha sarvantarastha'pi cicchaktishcatrilalita
    | sarva sarvatmika vishva jyotirupa'kshara'mrita || 4|| shanta pratishtha sarvesha nivrittiramritaprada
    | vyomamurtirvyomasamstha vyomadhara'cyuta'tula || 5|| anadinidhana'mogha karanatmakalakula | rituprathamaja'nabhiramritatmasamashraya
    || 6|| praneshvarapriya namya mahamahishaghatini | praneshvari pranarupa pradhanapurusheshvari ||
    7|| sarvashaktikala'kama mahisheshtavinashini | sarvakaryaniyantri ca sarvabhuteshvareshvari || 8||
    angadadidhara caiva tatha mukutadharini | sanatani mahananda''kashayonistathecyate || 9|| citprakashasvarupa
    ca mahayogeshvareshvari | mahamaya sudushpara mulaprakritirishika || 10|| samsarayonih sakala sarvashaktisamudbhava
    | samsarapara durvara durniriksha durasada || 11|| pranashaktishca sevya ca yogini paramakala | mahavibhutirdurdarsha
    mulaprakritisambhava || 12|| anadyanantavibhava parartha purusharanih | sargasthityantakriccaiva sudurvacya
    duratyaya || 13|| shabdagamya shabdamaya shabdakhyanandavigraha | pradhanapurushatita pradhanapurushatmika
    || 14|| purani cinmaya pumsamishtada pushtirupini | putantarastha kutastha mahapurushasamjnita ||
    15|| janmamrityujaratita sarvashaktisvarupini | vanchaprada'navacchinnapradhananupraveshini || 16||
    kshetrajna'cintyashaktistu procyate'vyaktalakshana | malapavarjita''nadimaya tritayatattvika || 17||
    pritishca prakritishcaiva guhavasa tathocyate | mahamaya nagotpanna tamasi ca dhruva tatha || 18||
    vyakta'vyaktatmika krishna rakta shukla hyakarana | procyate karyajanani nityaprasavadharmini || 19||
    sargapralayamukta ca srishtisthityantadharmini | brahmagarbha caturvimshasvarupa padmavasini || 20||
    acyutahladika vidyudbrahmayonirmahalaya | mahalakshmi samudbhavabhavitatmamaheshvari || 21|| mahavimanamadhyastha
    mahanidra sakautuka | sarvarthadharini sukshma hyaviddha paramarthada || 22|| anantarupa'nantartha
    tatha purushamohini | anekanekahasta ca kalatrayavivarjita || 23|| brahmajanma haraprita matirbrahmashivatmika
    | brahmeshavishnusampujya brahmakhya brahmasamjnita || 24|| vyakta prathamaja brahmi maharatrih prakirtita
    | jnanasvarupa vairagyarupa hyaishvaryarupini || 25|| dharmatmika brahmamurtih pratishrutapumarthika
    | apamyonih svayambhuta manasi tattvasambhava || 26|| ishvarasya priya prokta shankarardhasharirini
    | bhavani caiva rudrani mahalakshmistatha'mbika || 27|| maheshvarasamutpanna bhuktimukti pradayini
    | sarveshvari sarvavandya nityamukta sumanasa || 28|| mahendropendranamita shankarishanuvartini |
    ishvarardhasanagata maheshvarapativrata || 29|| samsarashoshini caiva parvati himavatsuta | paramanandadatri
    ca gunagrya yogada tatha || 30|| jnanamurtishca savitri lakshmih shrih kamala tatha | anantagunagambhira
    hyuronilamaniprabha || 31|| sarojanilaya ganga yogidhyeya'surardini | sarasvati sarvavidya jagajjyeshtha
    sumangala || 32|| vagdevi varada varya kirtih sarvarthasadhika | vagishvari brahmavidya mahavidya
    sushobhana || 33|| grahyavidya vedavidya dharmavidya''tmabhavita | svaha vishvambhara siddhih sadhya
    medha dhritih kritih || 34|| sunitih samkritishcaiva kirtita naravahini | pujavibhavini saumya bhogyabhag
    bhogadayini || 35|| shobhavati shankari ca lola malavibhushita | parameshthipriya caiva trilokisundari
    mata || 36|| nanda sandhya kamadhatri mahadevi susattvika | mahamahishadarpaghni padmamala'ghaharini
    || 37|| vicitramukuta rama kamadata prakirtita | pitambaradhara divyavibhushana vibhushita || 38||
    divyakhya somavadana jagatsamsrishtivarjita | niryantra yantravahastha nandini rudrakalika || 39||
    adityavarna kaumari mayuravaravahini | padmasanagata gauri mahakali surarcita || 40|| aditirniyata
    raudri padmagarbha vivahana | virupaksha keshivaha guhapuranivasini || 41|| mahaphala'navadyangi kamarupa
    saridvara | bhasvadrupa muktidatri pranatakleshabhanjana || 42|| kaushiki gomini ratristridasharivinashini
    | bahurupa surupa ca virupa rupavarjita || 43|| bhaktartishamana bhavya bhavabhavavinashini | sarvajnanaparitangi
    sarvasuravimardika || 44|| pikasvani samagita bhavankanilaya priya | diksha vidyadhari dipta mahendrahitapatini
    || 45|| sarvadevamaya daksha samudrantaravasini | akalanka niradhara nityasiddha niramaya || 46||
    kamadhenubrihadgarbha dhimati maunanashini | nihsankalpa niratanka vinaya vinayaprada || 47|| jvalamala
    sahasradhya devadevi manomaya | subhaga suvishuddha ca vasudevasamudbhava || 48|| mahendropendrabhagini
    bhaktigamya paravara | jnanajneya paratita vedantavishaya matih || 49|| dakshina dahika dahya sarvabhutahridisthita
    | yogamaya vibhagajna mahamoha gariyasi || 50|| sandhya sarvasamudbhuta brahmavrikshashraya'ditih
    | bijankurasamudbhuta mahashaktirmahamatih || 51|| khyatih prajnavati samjna mahabhogindrashayini
    | himkritih shankari shantirgandharvaganasevita || 52|| vaishvanari mahashula devasena bhavapriya
    | maharatri parananda shaci duhsvapnanashini || 53|| idya jaya jagaddhatri durvijneya surupini | guhambika
    ganotpanna mahapitha marutsuta || 54|| havyavaha bhavananda jagadyonih prakirtita | jaganmata jaganmrityurjaratita
    ca buddhida || 55|| siddhidatri ratnagarbha ratnagarbhashraya para | daityahantri sveshtadatri mangalaikasuvigraha
    || 56|| purushantargata caiva samadhistha tapasvini | divisthita trinetra ca sarvendriyamanodhritih
    || 57|| sarvabhutahridistha ca tatha samsaratarini | vedya brahmavivedya ca mahalila prakirtita ||
    58|| brahmanibrihati brahmi brahmabhuta'ghaharini | hiranmayi mahadatri samsaraparivartika || 59||
    sumalini surupa ca bhasvini dharini tatha | unmulini sarvasabha sarvapratyayasakshini || 60|| susaumya
    candravadana tandavasaktamanasa | sattvashuddhikari shuddha malatrayavinashini || 61|| jagatttrayi
    jaganmurtistrimurtiramritashraya | vimanastha vishoka ca shokanashinyanahata || 62|| hemakundalini
    kali padmavasa sanatani | sadakirtih sarvabhutashaya devi satampriya || 63|| brahmamurtikala caiva
    krittika kanjamalini | vyomakesha kriyashaktiricchashaktih paragatih || 64|| kshobhika khandikabhedya
    bhedabhedavivarjita | abhinna bhinnasamsthana vashini vamshadharini || 65|| guhyashaktirguhyatattva
    sarvada sarvatomukhi | bhagini ca niradhara nirahara prakirtita || 66|| nirankushapadodbhuta cakrahasta
    vishodhika | sragvini padmasambhedakarini parikirtita || 67|| paravaravidhanajna mahapurushapurvaja
    | paravarajna vidya ca vidyujjihva jitashraya || 68|| vidyamayi sahasrakshi sahasravadanatmaja | sahasrarashmihsatvastha
    maheshvarapadashraya || 69|| jvalini sanmaya vyapta cinmaya padmabhedika | mahashraya mahamantra mahadevamanorama
    || 70|| vyomalakshmih simharatha cekitana'mitaprabha | vishveshvari bhagavati sakala kalaharini ||
    71|| sarvavedya sarvabhadra guhya dudha guharani | pralaya yogadhatri ca ganga vishveshvari tatha
    || 72|| kamada kanaka kanta kanjagarbhaprabha tatha | punyada kalakesha ca bhokttri pushkarini tatha
    || 73|| sureshvari bhutidatri bhutibhusha prakirtita | pancabrahmasamutpanna paramartha'rthavigraha
    || 74|| varnodaya bhanumurtirvagvijneya manojava | manohara mahoraska tamasi vedarupini || 75|| vedashaktirvedamata
    vedavidyaprakashini | yogeshvareshvari maya mahashaktirmahamayi || 76|| vishvantahstha viyanmurtirbhargavi
    surasundari | surabhirnandini vidya nandagopatanudbhava || 77|| bharati paramananda paravaravibhedika
    | sarvapraharanopeta kamya kameshvareshvari || 78|| anantanandavibhava hrillekha kanakaprabha | kushmanda
    dhanaratnadhya sugandha gandhadayini || 79|| trivikramapadodbhuta caturasya shivodaya | sudurlabha
    dhanadhyaksha dhanya pingalalocana || 80|| shanta prabhasvarupa ca pankajayatalocana | indrakshi hridayantahstha
    shiva mata ca satkriya || 81|| girija ca sugudha ca nityapushta nirantara | durga katyayani candi
    candrika kantavigraha || 82|| hiranyavarna jagati jagadyantrapravartika | mandaradrinivasa ca sharada
    svarnamalini || 83|| ratnamala ratnagarbha vyushtirvishvapramathini | padmananda padmanibha nityapushta
    kritodbhava || 84|| narayani dushtashiksha suryamata vrishapriya | mahendrabhagini satya satyabhasha
    sukomala || 85|| vama ca pancatapasam varadatri prakirtita | vacyavarneshvari vidya durjaya duratikrama
    || 86|| kalaratrirmahavega virabhadrapriya hita | bhadrakali jaganmata bhaktanam bhadradayini || 87||
    karala pingalakara kamabhettri mahamanah | yashasvini yashoda ca shadadhvaparivartika || 88|| shankhini
    padmini samkhya samkhyayogapravartika | caitradirvatsararudha jagatsampuranindraja || 89|| shumbhaghni
    khecararadhya kambugriva balidita | khagarudha mahaishvarya supadmanilaya tatha || 90|| virakta garudastha
    ca jagatihridguhashraya | shumbhadimathana bhaktahridgahvaranivasini || 91|| jagatttrayarani siddhasankalpa
    kamada tatha | sarvavijnanadatri canalpakalmashaharini || 92|| sakalopanishadgamya dushtadushprekshyasattama
    | sadvrita lokasamvyapta tushtih pushtih kriyavati || 93|| vishvamareshvari caiva bhuktimuktipradayini
    | shivadhrita lohitakshi sarpamalavibhushana || 94|| nirananda trishulasidhanurbanadidharini | asheshadhyeyamurtishca
    devatanam ca devata || 95|| varambika gireh putri nishumbhavinipatini | suvarna svarnalasita'nantavarna
    sadadhrita || 96|| shankari shantahridaya ahoratravidhayika | vishvagoptri gudharupa gunapurna ca
    gargyaja || 97|| gauri shakambhari satyasandha sandhyatrayidhrita | sarvapapavinirmukta sarvabandhavivarjita
    || 98|| samkhyayogasamakhyata aprameya munidita | vishuddhasukulodbhuta bindunadasamadrita || 99||
    shambhuvamankaga caiva shashitulyanibhanana | vanamalavirajanti anantashayanadrita || 100|| naranarayanodbhuta
    narasimhi prakirtita | daityapramathini shankhacakrapadmagadadhara || 101|| sankarshanasamutpanna
    ambika sajjanashraya | suvrita sundari caiva dharmakamarthadayini || 102|| mokshada bhaktinilaya puranapurushadrita
    | mahavibhutida''radhya sarojanilaya'sama || 103|| ashtadashabhuja'nadirnilotpaladalakshini | sarvashaktisamarudha
    dharmadharmavivarjita || 104|| vairagyajnananirata niraloka nirindriya | vicitragahanadhara shashvatasthanavasini
    || 105|| jnaneshvari pitacela vedavedangaparaga | manasvini manyumata mahamanyusamudbhava || 106||
    amanyuramritasvada purandaraparishtuta | ashocya bhinnavishaya hiranyarajatapriya || 107|| hiranyajanani
    bhima hemabharanabhushita | vibhrajamana durjneya jyotishtomaphalaprada || 108|| mahanidrasamutpattiranidra
    satyadevata | dirgha kakudmini pingajatadhara manojnadhih || 109|| mahashraya ramotpanna tamahpare
    pratishthita | tritattvamata trividha susukshma padmasamshraya || 110|| shantyatitakala'titavikara
    shvetacelika | citramaya shivajnanasvarupa daityamathini || 111|| kashyapi kalasarpabhavenika shastrayonika
    | trayimurtih kriyamurtishcaturvarga ca darshini || 112|| narayani narotpanna kaumudi kantidharini
    | kaushiki lalita lila paravaravibhavini || 113|| varenya'dbhutamahatmya vadava vamalocana | subhadra
    cetanaradhya shantida shantivardhini || 114|| jayadishaktijanani shakticakrapravartika | trishaktijanani
    janya shatsutraparivarnita || 115|| sudhautakarmana''radhya yugantadahanatmika | sankarshini jagaddhatri
    kamayonih kiritini || 116|| aindri trailokyanamita vaishnavi parameshvari | pradyumnajanani bimbasamoshthi
    padmalocana || 117|| madotkata hamsagatih pracanda candavikrama | vrishadhisha paratma ca vindhya
    parvatavasini || 118|| himavanmerunilaya kailasapuravasini | canurahantri nitijna kamarupa trayitanuh
    || 119|| vratasnata dharmashila simhasananivasini | virabhadradrita vira mahakalasamudbhava || 120||
    vidyadhararcita siddhasadhyaradhitapaduka | shraddhatmika pavani ca mohini acalatmika || 121|| mahadbhuta
    varijakshi simhavahanagamini | manishini sudhavani vinavadanatatpara || 122|| shvetavahanishevya ca
    lasanmatirarundhati | hiranyakshi tatha caiva mahanandapradayini || 123|| vasuprabha sumalyaptakandhara
    pankajanana | paravara vararoha sahasranayanarcita || 124|| shrirupa shrimati shreshtha shivanamni
    shivapriya | shriprada shritakalyana shridharardhasharirini || 125|| shrikala'nantadrishtishca hyakshudra''ratisudani
    | raktabijanihantri ca daityasangavimardini || 126|| simharudha simhikasya daityashonitapayini | sukirtisahitacchinnasamshaya
    rasavedini || 127|| gunabhirama nagarivahana nirjararcita | nityodita svayamjyotih svarnakaya prakirtita
    || 128|| vajradandankita caiva tatha'mritasanjivini | vajracchanna devadevi varavajrasvavigraha ||
    129|| mangalya mangalatma ca malini malyadharini | gandharvi taruni candri khadgayudhadhara tatha
    || 130|| saudamini prajananda tatha prokta bhrigudbhava | ekananga ca shastrarthakushala dharmacarini
    || 131|| dharmasarvasvavaha ca dharmadharmavinishcaya | dharmashaktirdharmamaya dharmikanam shivaprada
    || 132|| vidharma vishvadharmajna dharmarthantaravigraha | dharmavarshma dharmapurva dharmaparangatantara
    || 133|| dharmopadeshtri dharmatma dharmagamya dharadhara | kapalini shakalini kalakalitavigraha ||
    134|| sarvashaktivimukta ca karnikaradhara'kshara | kamsapranahara caiva yugadharmadhara tatha ||
    135|| yugapravartika prokta trisandhya dhyeyavigraha | svargapavargadatri ca tatha pratyakshadevata
    || 136|| aditya divyagandha ca divakaranibhaprabha | padmasanagata prokta khadgabanasharasana || 137||
    shishta vishishta shishteshta shishtashreshthaprapujita | shatarupa shatavarta vitata rasamodini ||
    138|| suryendunetra pradyumnajanani sushthumayini | suryantarasthita caiva satpratishthitavigraha
    || 139|| nivritta procyate jnanaparaga parvatatmaja | katyayani candika ca candi haimavati tatha ||
    140|| dakshayani sati caiva bhavani sarvamangala | dhumralocanahantri ca candamundavinashini || 141||
    yoganidra yogabhadra samudratanaya tatha | devapriyankari shuddha bhaktabhaktipravardhini || 142||
    trinetra candramukuta pramatharcitapaduka | arjunabhishtadatri ca pandavapriyakarini || 143|| kumaralalanasakta
    harabahupadhanika | vighneshajanani bhaktavighnastomapraharini || 144|| susmitendumukhi namya jayapriyasakhi
    tatha | anadinidhana preshtha citramalyanulepana || 145|| koticandrapratikasha kutajalapramathini
    | krityapraharini caiva maranoccatani tatha || 146|| surasurapravandyanghrirmohaghni jnanadayini |
    shadvairinigrahakari vairividravini tatha || 147|| bhutasevya bhutadatri bhutapidavimardika | naradastutacaritra
    varadesha varaprada || 148|| vamadevastuta caiva kamada somashekhara | dikpalasevita bhavya bhamini
    bhavadayini || 149|| strisaubhagyapradatri ca bhogada roganashini | vyomaga bhumiga caiva munipujyapadambuja
    | vanadurga ca durbodha mahadurga prakirtita || 150|| phalashrutih itidam kirtidam bhadra durganamasahasrakam
    | trisandhyam yah pathennityam tasya lakshmih sthira bhavet || 1|| grahabhutapishacadipida nashyatyasamshayam
    | balagrahadipidayah shantirbhavati kirtanat || 2|| marikadimaharoge pathatam saukhyadam nrinam |
    vyavahare ca jayadam shatrubadhanivarakam || 3|| dampatyoh kalahe prapte mithah premabhivardhakam
    | ayurarogyadam pumsam sarvasampatpradayakam || 4|| vidyabhivardhakam nityam pathatamarthasadhakam
    | shubhadam shubhakaryeshu pathatam sha
  devanagari: अस्य श्रीदुर्गास्तोत्रमहामन्त्रस्य । हिमवान् ऋषिः । अनुष्टुप् छन्दः । दुर्गाभगवती देवता
    । श्रीदुर्गाप्रसादसिद्ध्यर्थे जपे विनियोगः । श्रीभगवत्यै दुर्गायै नमः । देवीध्यानम् ॐ ह्रीं कालाभ्राभां
    कटाक्षैररिकुलभयदां मौलिबद्धेन्दुरेखां शङ्खं चक्रं कृपाणं त्रिशिखमपि करैरुद्वहन्तीं त्रिनेत्राम् ।
    सिंहस्कन्धाधिरूढां त्रिभुवनमखिलं तेजसा पूरयन्तीं ध्यायेद् दुर्गां जयाख्यां त्रिदशपरिवृतां सेवितां
    सिद्धिकामैः ॥ श्री जयदुर्गायै नमः । ॐ शिवाऽथोमा रमा शक्तिरनन्ता निष्कलाऽमला । शान्ता माहेश्वरी नित्या
    शाश्वता परमा क्षमा ॥ १॥ अचिन्त्या केवलानन्ता शिवात्मा परमात्मिका । अनादिरव्यया शुद्धा सर्वज्ञा सर्वगाऽचला
    ॥ २॥ एकानेकविभागस्था मायातीता सुनिर्मला । महामाहेश्वरी सत्या महादेवी निरञ्जना ॥ ३॥ काष्ठा सर्वान्तरस्थाऽपि
    चिच्छक्तिश्चात्रिलालिता । सर्वा सर्वात्मिका विश्वा ज्योतीरूपाऽक्षराऽमृता ॥ ४॥ शान्ता प्रतिष्ठा सर्वेशा
    निवृत्तिरमृतप्रदा । व्योममूर्तिर्व्योमसंस्था व्योमाधाराऽच्युताऽतुला ॥ ५॥ अनादिनिधनाऽमोघा कारणात्मकलाकुला
    । ऋतुप्रथमजाऽनाभिरमृतात्मसमाश्रया ॥ ६॥ प्राणेश्वरप्रिया नम्या महामहिषघातिनी । प्राणेश्वरी प्राणरूपा
    प्रधानपुरुषेश्वरी ॥ ७॥ सर्वशक्तिकलाऽकामा महिषेष्टविनाशिनी । सर्वकार्यनियन्त्री च सर्वभूतेश्वरेश्वरी
    ॥ ८॥ अङ्गदादिधरा चैव तथा मुकुटधारिणी । सनातनी महानन्दाऽऽकाशयोनिस्तथेच्यते ॥ ९॥ चित्प्रकाशस्वरूपा च
    महायोगेश्वरेश्वरी । महामाया सुदुष्पारा मूलप्रकृतिरीशिका ॥ १०॥ संसारयोनिः सकला सर्वशक्तिसमुद्भवा ।
    संसारपारा दुर्वारा दुर्निरीक्षा दुरासदा ॥ ११॥ प्राणशक्तिश्च सेव्या च योगिनी परमाकला । महाविभूतिर्दुर्दर्शा
    मूलप्रकृतिसम्भवा ॥ १२॥ अनाद्यनन्तविभवा परार्था पुरुषारणिः । सर्गस्थित्यन्तकृच्चैव सुदुर्वाच्या दुरत्यया
    ॥ १३॥ शब्दगम्या शब्दमाया शब्दाख्यानन्दविग्रहा । प्रधानपुरुषातीता प्रधानपुरुषात्मिका ॥ १४॥ पुराणी चिन्मया
    पुंसामिष्टदा पुष्टिरूपिणी । पूतान्तरस्था कूटस्था महापुरुषसंज्ञिता ॥ १५॥ जन्ममृत्युजरातीता सर्वशक्तिस्वरूपिणी
    । वाञ्छाप्रदाऽनवच्छिन्नप्रधानानुप्रवेशिनी ॥ १६॥ क्षेत्रज्ञाऽचिन्त्यशक्तिस्तु प्रोच्यतेऽव्यक्तलक्षणा
    । मलापवर्जिताऽऽनादिमाया त्रितयतत्त्विका ॥ १७॥ प्रीतिश्च प्रकृतिश्चैव गुहावासा तथोच्यते । महामाया नगोत्पन्ना
    तामसी च ध्रुवा तथा ॥ १८॥ व्यक्ताऽव्यक्तात्मिका कृष्णा रक्ता शुक्ला ह्यकारणा । प्रोच्यते कार्यजननी
    नित्यप्रसवधर्मिणी ॥ १९॥ सर्गप्रलयमुक्ता च सृष्टिस्थित्यन्तधर्मिणी । ब्रह्मगर्भा चतुर्विंशस्वरूपा पद्मवासिनी
    ॥ २०॥ अच्युताह्लादिका विद्युद्ब्रह्मयोनिर्महालया । महालक्ष्मी समुद्भावभावितात्मामहेश्वरी ॥ २१॥ महाविमानमध्यस्था
    महानिद्रा सकौतुका । सर्वार्थधारिणी सूक्ष्मा ह्यविद्धा परमार्थदा ॥ २२॥ अनन्तरूपाऽनन्तार्था तथा पुरुषमोहिनी
    । अनेकानेकहस्ता च कालत्रयविवर्जिता ॥ २३॥ ब्रह्मजन्मा हरप्रीता मतिर्ब्रह्मशिवात्मिका । ब्रह्मेशविष्णुसम्पूज्या
    ब्रह्माख्या ब्रह्मसंज्ञिता ॥ २४॥ व्यक्ता प्रथमजा ब्राह्मी महारात्रीः प्रकीर्तिता । ज्ञानस्वरूपा वैराग्यरूपा
    ह्यैश्वर्यरूपिणी ॥ २५॥ धर्मात्मिका ब्रह्ममूर्तिः प्रतिश्रुतपुमर्थिका । अपांयोनिः स्वयम्भूता मानसी
    तत्त्वसम्भवा ॥ २६॥ ईश्वरस्य प्रिया प्रोक्ता शङ्करार्धशरीरिणी । भवानी चैव रुद्राणी महालक्ष्मीस्तथाऽम्बिका
    ॥ २७॥ महेश्वरसमुत्पन्ना भुक्तिमुक्ति प्रदायिनी । सर्वेश्वरी सर्ववन्द्या नित्यमुक्ता सुमानसा ॥ २८॥
    महेन्द्रोपेन्द्रनमिता शाङ्करीशानुवर्तिनी । ईश्वरार्धासनगता माहेश्वरपतिव्रता ॥ २९॥ संसारशोषिणी चैव
    पार्वती हिमवत्सुता । परमानन्ददात्री च गुणाग्र्या योगदा तथा ॥ ३०॥ ज्ञानमूर्तिश्च सावित्री लक्ष्मीः
    श्रीः कमला तथा । अनन्तगुणगम्भीरा ह्युरोनीलमणिप्रभा ॥ ३१॥ सरोजनिलया गङ्गा योगिध्येयाऽसुरार्दिनी । सरस्वती
    सर्वविद्या जगज्ज्येष्ठा सुमङ्गला ॥ ३२॥ वाग्देवी वरदा वर्या कीर्तिः सर्वार्थसाधिका । वागीश्वरी ब्रह्मविद्या
    महाविद्या सुशोभना ॥ ३३॥ ग्राह्यविद्या वेदविद्या धर्मविद्याऽऽत्मभाविता । स्वाहा विश्वम्भरा सिद्धिः
    साध्या मेधा धृतिः कृतिः ॥ ३४॥ सुनीतिः संकृतिश्चैव कीर्तिता नरवाहिनी । पूजाविभाविनी सौम्या भोग्यभाग्
    भोगदायिनी ॥ ३५॥ शोभावती शाङ्करी च लोला मालाविभूषिता । परमेष्ठिप्रिया चैव त्रिलोकीसुन्दरी माता ॥ ३६॥
    नन्दा सन्ध्या कामधात्री महादेवी सुसात्त्विका । महामहिषदर्पघ्नी पद्ममालाऽघहारिणी ॥ ३७॥ विचित्रमुकुटा
    रामा कामदाता प्रकीर्तिता । पिताम्बरधरा दिव्यविभूषण विभूषिता ॥ ३८॥ दिव्याख्या सोमवदना जगत्संसृष्टिवर्जिता
    । निर्यन्त्रा यन्त्रवाहस्था नन्दिनी रुद्रकालिका ॥ ३९॥ आदित्यवर्णा कौमारी मयूरवरवाहिनी । पद्मासनगता
    गौरी महाकाली सुरार्चिता ॥ ४०॥ अदितिर्नियता रौद्री पद्मगर्भा विवाहना । विरूपाक्षा केशिवाहा गुहापुरनिवासिनी
    ॥ ४१॥ महाफलाऽनवद्याङ्गी कामरूपा सरिद्वरा । भास्वद्रूपा मुक्तिदात्री प्रणतक्लेशभञ्जना ॥ ४२॥ कौशिकी
    गोमिनी रात्रिस्त्रिदशारिविनाशिनी । बहुरूपा सुरूपा च विरूपा रूपवर्जिता ॥ ४३॥ भक्तार्तिशमना भव्या भवभावविनाशिनी
    । सर्वज्ञानपरीताङ्गी सर्वासुरविमर्दिका ॥ ४४॥ पिकस्वनी सामगीता भवाङ्कनिलया प्रिया । दीक्षा विद्याधरी
    दीप्ता महेन्द्राहितपातिनी ॥ ४५॥ सर्वदेवमया दक्षा समुद्रान्तरवासिनी । अकलङ्का निराधारा नित्यसिद्धा
    निरामया ॥ ४६॥ कामधेनुबृहद्गर्भा धीमती मौननाशिनी । निःसङ्कल्पा निरातङ्का विनया विनयप्रदा ॥ ४७॥ ज्वालामाला
    सहस्राढ्या देवदेवी मनोमया । सुभगा सुविशुद्धा च वसुदेवसमुद्भवा ॥ ४८॥ महेन्द्रोपेन्द्रभगिनी भक्तिगम्या
    परावरा । ज्ञानज्ञेया परातीता वेदान्तविषया मतिः ॥ ४९॥ दक्षिणा दाहिका दह्या सर्वभूतहृदिस्थिता । योगमाया
    विभागज्ञा महामोहा गरीयसी ॥ ५०॥ सन्ध्या सर्वसमुद्भूता ब्रह्मवृक्षाश्रयाऽदितिः । बीजाङ्कुरसमुद्भूता
    महाशक्तिर्महामतिः ॥ ५१॥ ख्यातिः प्रज्ञावती संज्ञा महाभोगीन्द्रशायिनी । हींकृतिः शङ्करी शान्तिर्गन्धर्वगणसेविता
    ॥ ५२॥ वैश्वानरी महाशूला देवसेना भवप्रिया । महारात्री परानन्दा शची दुःस्वप्ननाशिनी ॥ ५३॥ ईड्या जया
    जगद्धात्री दुर्विज्ञेया सुरूपिणी । गुहाम्बिका गणोत्पन्ना महापीठा मरुत्सुता ॥ ५४॥ हव्यवाहा भवानन्दा
    जगद्योनिः प्रकीर्तिता । जगन्माता जगन्मृत्युर्जरातीता च बुद्धिदा ॥ ५५॥ सिद्धिदात्री रत्नगर्भा रत्नगर्भाश्रया
    परा । दैत्यहन्त्री स्वेष्टदात्री मङ्गलैकसुविग्रहा ॥ ५६॥ पुरुषान्तर्गता चैव समाधिस्था तपस्विनी । दिविस्थिता
    त्रिनेत्रा च सर्वेन्द्रियमनोधृतिः ॥ ५७॥ सर्वभूतहृदिस्था च तथा संसारतारिणी । वेद्या ब्रह्मविवेद्या
    च महालीला प्रकीर्तिता ॥ ५८॥ ब्राह्मणिबृहती ब्राह्मी ब्रह्मभूताऽघहारिणी । हिरण्मयी महादात्री संसारपरिवर्तिका
    ॥ ५९॥ सुमालिनी सुरूपा च भास्विनी धारिणी तथा । उन्मूलिनी सर्वसभा सर्वप्रत्ययसाक्षिणी ॥ ६०॥ सुसौम्या
    चन्द्रवदना ताण्डवासक्तमानसा । सत्त्वशुद्धिकरी शुद्धा मलत्रयविनाशिनी ॥ ६१॥ जगत्त्त्रयी जगन्मूर्तिस्त्रिमूर्तिरमृताश्रया
    । विमानस्था विशोका च शोकनाशिन्यनाहता ॥ ६२॥ हेमकुण्डलिनी काली पद्मवासा सनातनी । सदाकीर्तिः सर्वभूतशया
    देवी सतांप्रिया ॥ ६३॥ ब्रह्ममूर्तिकला चैव कृत्तिका कञ्जमालिनी । व्योमकेशा क्रियाशक्तिरिच्छाशक्तिः
    परागतिः ॥ ६४॥ क्षोभिका खण्डिकाभेद्या भेदाभेदविवर्जिता । अभिन्ना भिन्नसंस्थाना वशिनी वंशधारिणी ॥ ६५॥
    गुह्यशक्तिर्गुह्यतत्त्वा सर्वदा सर्वतोमुखी । भगिनी च निराधारा निराहारा प्रकीर्तिता ॥ ६६॥ निरङ्कुशपदोद्भूता
    चक्रहस्ता विशोधिका । स्रग्विणी पद्मसम्भेदकारिणी परिकीर्तिता ॥ ६७॥ परावरविधानज्ञा महापुरुषपूर्वजा ।
    परावरज्ञा विद्या च विद्युज्जिह्वा जिताश्रया ॥ ६८॥ विद्यामयी सहस्राक्षी सहस्रवदनात्मजा । सहस्ररश्मिःसत्वस्था
    महेश्वरपदाश्रया ॥ ६९॥ ज्वालिनी सन्मया व्याप्ता चिन्मया पद्मभेदिका । महाश्रया महामन्त्रा महादेवमनोरमा
    ॥ ७०॥ व्योमलक्ष्मीः सिंहरथा चेकितानाऽमितप्रभा । विश्वेश्वरी भगवती सकला कालहारिणी ॥ ७१॥ सर्ववेद्या
    सर्वभद्रा गुह्या दूढा गुहारणी । प्रलया योगधात्री च गङ्गा विश्वेश्वरी तथा ॥ ७२॥ कामदा कनका कान्ता कञ्जगर्भप्रभा
    तथा । पुण्यदा कालकेशा च भोक्त्त्री पुष्करिणी तथा ॥ ७३॥ सुरेश्वरी भूतिदात्री भूतिभूषा प्रकीर्तिता ।
    पञ्चब्रह्मसमुत्पन्ना परमार्थाऽर्थविग्रहा ॥ ७४॥ वर्णोदया भानुमूर्तिर्वाग्विज्ञेया मनोजवा । मनोहरा महोरस्का
    तामसी वेदरूपिणी ॥ ७५॥ वेदशक्तिर्वेदमाता वेदविद्याप्रकाशिनी । योगेश्वरेश्वरी माया महाशक्तिर्महामयी
    ॥ ७६॥ विश्वान्तःस्था वियन्मूर्तिर्भार्गवी सुरसुन्दरी । सुरभिर्नन्दिनी विद्या नन्दगोपतनूद्भवा ॥ ७७॥
    भारती परमानन्दा परावरविभेदिका । सर्वप्रहरणोपेता काम्या कामेश्वरेश्वरी ॥ ७८॥ अनन्तानन्दविभवा हृल्लेखा
    कनकप्रभा । कूष्माण्डा धनरत्नाढ्या सुगन्धा गन्धदायिनी ॥ ७९॥ त्रिविक्रमपदोद्भूता चतुरास्या शिवोदया ।
    सुदुर्लभा धनाध्यक्षा धन्या पिङ्गललोचना ॥ ८०॥ शान्ता प्रभास्वरूपा च पङ्कजायतलोचना । इन्द्राक्षी हृदयान्तःस्था
    शिवा माता च सत्क्रिया ॥ ८१॥ गिरिजा च सुगूढा च नित्यपुष्टा निरन्तरा । दुर्गा कात्यायनी चण्डी चन्द्रिका
    कान्तविग्रहा ॥ ८२॥ हिरण्यवर्णा जगती जगद्यन्त्रप्रवर्तिका । मन्दराद्रिनिवासा च शारदा स्वर्णमालिनी ॥
    ८३॥ रत्नमाला रत्नगर्भा व्युष्टिर्विश्वप्रमाथिनी । पद्मानन्दा पद्मनिभा नित्यपुष्टा कृतोद्भवा ॥ ८४॥
    नारायणी दुष्टशिक्षा सूर्यमाता वृषप्रिया । महेन्द्रभगिनी सत्या सत्यभाषा सुकोमला ॥ ८५॥ वामा च पञ्चतपसां
    वरदात्री प्रकीर्तिता । वाच्यवर्णेश्वरी विद्या दुर्जया दुरतिक्रमा ॥ ८६॥ कालरात्रिर्महावेगा वीरभद्रप्रिया
    हिता । भद्रकाली जगन्माता भक्तानां भद्रदायिनी ॥ ८७॥ कराला पिङ्गलाकारा कामभेत्त्री महामनाः । यशस्विनी
    यशोदा च षडध्वपरिवर्तिका ॥ ८८॥ शङ्खिनी पद्मिनी संख्या सांख्ययोगप्रवर्तिका । चैत्रादिर्वत्सरारूढा जगत्सम्पूरणीन्द्रजा
    ॥ ८९॥ शुम्भघ्नी खेचराराध्या कम्बुग्रीवा बलीडिता । खगारूढा महैश्वर्या सुपद्मनिलया तथा ॥ ९०॥ विरक्ता
    गरुडस्था च जगतीहृद्गुहाश्रया । शुम्भादिमथना भक्तहृद्गह्वरनिवासिनी ॥ ९१॥ जगत्त्त्रयारणी सिद्धसङ्कल्पा
    कामदा तथा । सर्वविज्ञानदात्री चानल्पकल्मषहारिणी ॥ ९२॥ सकलोपनिषद्गम्या दुष्टदुष्प्रेक्ष्यसत्तमा । सद्वृता
    लोकसंव्याप्ता तुष्टिः पुष्टिः क्रियावती ॥ ९३॥ विश्वामरेश्वरी चैव भुक्तिमुक्तिप्रदायिनी । शिवाधृता
    लोहिताक्षी सर्पमालाविभूषणा ॥ ९४॥ निरानन्दा त्रिशूलासिधनुर्बाणादिधारिणी । अशेषध्येयमूर्तिश्च देवतानां
    च देवता ॥ ९५॥ वराम्बिका गिरेः पुत्री निशुम्भविनिपातिनी । सुवर्णा स्वर्णलसिताऽनन्तवर्णा सदाधृता ॥ ९६॥
    शाङ्करी शान्तहृदया अहोरात्रविधायिका । विश्वगोप्त्री गूढरूपा गुणपूर्णा च गार्ग्यजा ॥ ९७॥ गौरी शाकम्भरी
    सत्यसन्धा सन्ध्यात्रयीधृता । सर्वपापविनिर्मुक्ता सर्वबन्धविवर्जिता ॥ ९८॥ सांख्ययोगसमाख्याता अप्रमेया
    मुनीडिता । विशुद्धसुकुलोद्भूता बिन्दुनादसमादृता ॥ ९९॥ शम्भुवामाङ्कगा चैव शशितुल्यनिभानना । वनमालाविराजन्ती
    अनन्तशयनादृता ॥ १००॥ नरनारायणोद्भूता नारसिंही प्रकीर्तिता । दैत्यप्रमाथिनी शङ्खचक्रपद्मगदाधरा ॥ १०१॥
    सङ्कर्षणसमुत्पन्ना अम्बिका सज्जनाश्रया । सुवृता सुन्दरी चैव धर्मकामार्थदायिनी ॥ १०२॥ मोक्षदा भक्तिनिलया
    पुराणपुरुषादृता । महाविभूतिदाऽऽराध्या सरोजनिलयाऽसमा ॥ १०३॥ अष्टादशभुजाऽनादिर्नीलोत्पलदलाक्षिणी । सर्वशक्तिसमारूढा
    धर्माधर्मविवर्जिता ॥ १०४॥ वैराग्यज्ञाननिरता निरालोका निरिन्द्रिया । विचित्रगहनाधारा शाश्वतस्थानवासिनी
    ॥ १०५॥ ज्ञानेश्वरी पीतचेला वेदवेदाङ्गपारगा । मनस्विनी मन्युमाता महामन्युसमुद्भवा ॥ १०६॥ अमन्युरमृतास्वादा
    पुरन्दरपरिष्टुता । अशोच्या भिन्नविषया हिरण्यरजतप्रिया ॥ १०७॥ हिरण्यजननी भीमा हेमाभरणभूषिता । विभ्राजमाना
    दुर्ज्ञेया ज्योतिष्टोमफलप्रदा ॥ १०८॥ महानिद्रासमुत्पत्तिरनिद्रा सत्यदेवता । दीर्घा ककुद्मिनी पिङ्गजटाधारा
    मनोज्ञधीः ॥ १०९॥ महाश्रया रमोत्पन्ना तमःपारे प्रतिष्ठिता । त्रितत्त्वमाता त्रिविधा सुसूक्ष्मा पद्मसंश्रया
    ॥ ११०॥ शान्त्यतीतकलाऽतीतविकारा श्वेतचेलिका । चित्रमाया शिवज्ञानस्वरूपा दैत्यमाथिनी ॥ १११॥ काश्यपी
    कालसर्पाभवेणिका शास्त्रयोनिका । त्रयीमूर्तिः क्रियामूर्तिश्चतुर्वर्गा च दर्शिनी ॥ ११२॥ नारायणी नरोत्पन्ना
    कौमुदी कान्तिधारिणी । कौशिकी ललिता लीला परावरविभाविनी ॥ ११३॥ वरेण्याऽद्भुतमाहात्म्या वडवा वामलोचना
    । सुभद्रा चेतनाराध्या शान्तिदा शान्तिवर्धिनी ॥ ११४॥ जयादिशक्तिजननी शक्तिचक्रप्रवर्तिका । त्रिशक्तिजननी
    जन्या षट्सूत्रपरिवर्णिता ॥ ११५॥ सुधौतकर्मणाऽऽराध्या युगान्तदहनात्मिका । सङ्कर्षिणी जगद्धात्री कामयोनिः
    किरीटिनी ॥ ११६॥ ऐन्द्री त्रैलोक्यनमिता वैष्णवी परमेश्वरी । प्रद्युम्नजननी बिम्बसमोष्ठी पद्मलोचना ॥
    ११७॥ मदोत्कटा हंसगतिः प्रचण्डा चण्डविक्रमा । वृषाधीशा परात्मा च विन्ध्या पर्वतवासिनी ॥ ११८॥ हिमवन्मेरुनिलया
    कैलासपुरवासिनी । चाणूरहन्त्री नीतिज्ञा कामरूपा त्रयीतनुः ॥ ११९॥ व्रतस्नाता धर्मशीला सिंहासननिवासिनी
    । वीरभद्रादृता वीरा महाकालसमुद्भवा ॥ १२०॥ विद्याधरार्चिता सिद्धसाध्याराधितपादुका । श्रद्धात्मिका पावनी
    च मोहिनी अचलात्मिका ॥ १२१॥ महाद्भुता वारिजाक्षी सिंहवाहनगामिनी । मनीषिणी सुधावाणी वीणावादनतत्परा ॥
    १२२॥ श्वेतवाहनिषेव्या च लसन्मतिररुन्धती । हिरण्याक्षी तथा चैव महानन्दप्रदायिनी ॥ १२३॥ वसुप्रभा सुमाल्याप्तकन्धरा
    पङ्कजानना । परावरा वरारोहा सहस्रनयनार्चिता ॥ १२४॥ श्रीरूपा श्रीमती श्रेष्ठा शिवनाम्नी शिवप्रिया ।
    श्रीप्रदा श्रितकल्याणा श्रीधरार्धशरीरिणी ॥ १२५॥ श्रीकलाऽनन्तदृष्टिश्च ह्यक्षुद्राऽऽरातिसूदनी । रक्तबीजनिहन्त्री
    च दैत्यसङ्गविमर्दिनी ॥ १२६॥ सिंहारूढा सिंहिकास्या दैत्यशोणितपायिनी । सुकीर्तिसहिताच्छिन्नसंशया रसवेदिनी
    ॥ १२७॥ गुणाभिरामा नागारिवाहना निर्जरार्चिता । नित्योदिता स्वयंज्योतिः स्वर्णकाया प्रकीर्तिता ॥ १२८॥
    वज्रदण्डाङ्किता चैव तथाऽमृतसञ्जीविनी । वज्रच्छन्ना देवदेवी वरवज्रस्वविग्रहा ॥ १२९॥ माङ्गल्या मङ्गलात्मा
    च मालिनी माल्यधारिणी । गन्धर्वी तरुणी चान्द्री खड्गायुधधरा तथा ॥ १३०॥ सौदामिनी प्रजानन्दा तथा प्रोक्ता
    भृगूद्भवा । एकानङ्गा च शास्त्रार्थकुशला धर्मचारिणी ॥ १३१॥ धर्मसर्वस्ववाहा च धर्माधर्मविनिश्चया । धर्मशक्तिर्धर्ममया
    धार्मिकानां शिवप्रदा ॥ १३२॥ विधर्मा विश्वधर्मज्ञा धर्मार्थान्तरविग्रहा । धर्मवर्ष्मा धर्मपूर्वा धर्मपारङ्गतान्तरा
    ॥ १३३॥ धर्मोपदेष्ट्री धर्मात्मा धर्मगम्या धराधरा । कपालिनी शाकलिनी कलाकलितविग्रहा ॥ १३४॥ सर्वशक्तिविमुक्ता
    च कर्णिकारधराऽक्षरा । कंसप्राणहरा चैव युगधर्मधरा तथा ॥ १३५॥ युगप्रवर्तिका प्रोक्ता त्रिसन्ध्या ध्येयविग्रहा
    । स्वर्गापवर्गदात्री च तथा प्रत्यक्षदेवता ॥ १३६॥ आदित्या दिव्यगन्धा च दिवाकरनिभप्रभा । पद्मासनगता
    प्रोक्ता खड्गबाणशरासना ॥ १३७॥ शिष्टा विशिष्टा शिष्टेष्टा शिष्टश्रेष्ठप्रपूजिता । शतरूपा शतावर्ता वितता
    रासमोदिनी ॥ १३८॥ सूर्येन्दुनेत्रा प्रद्युम्नजननी सुष्ठुमायिनी । सूर्यान्तरस्थिता चैव सत्प्रतिष्ठितविग्रहा
    ॥ १३९॥ निवृत्ता प्रोच्यते ज्ञानपारगा पर्वतात्मजा । कात्यायनी चण्डिका च चण्डी हैमवती तथा ॥ १४०॥ दाक्षायणी
    सती चैव भवानी सर्वमङ्गला । धूम्रलोचनहन्त्री च चण्डमुण्डविनाशिनी ॥ १४१॥ योगनिद्रा योगभद्रा समुद्रतनया
    तथा । देवप्रियङ्करी शुद्धा भक्तभक्तिप्रवर्धिनी ॥ १४२॥ त्रिनेत्रा चन्द्रमुकुटा प्रमथार्चितपादुका ।
    अर्जुनाभीष्टदात्री च पाण्डवप्रियकारिणी ॥ १४३॥ कुमारलालनासक्ता हरबाहूपधानिका । विघ्नेशजननी भक्तविघ्नस्तोमप्रहारिणी
    ॥ १४४॥ सुस्मितेन्दुमुखी नम्या जयाप्रियसखी तथा । अनादिनिधना प्रेष्ठा चित्रमाल्यानुलेपना ॥ १४५॥ कोटिचन्द्रप्रतीकाशा
    कूटजालप्रमाथिनी । कृत्याप्रहारिणी चैव मारणोच्चाटनी तथा ॥ १४६॥ सुरासुरप्रवन्द्याङ्घ्रिर्मोहघ्नी ज्ञानदायिनी
    । षड्वैरिनिग्रहकरी वैरिविद्राविणी तथा ॥ १४७॥ भूतसेव्या भूतदात्री भूतपीडाविमर्दिका । नारदस्तुतचारित्रा
    वरदेशा वरप्रदा ॥ १४८॥ वामदेवस्तुता चैव कामदा सोमशेखरा । दिक्पालसेविता भव्या भामिनी भावदायिनी ॥ १४९॥
    स्त्रीसौभाग्यप्रदात्री च भोगदा रोगनाशिनी । व्योमगा भूमिगा चैव मुनिपूज्यपदाम्बुजा । वनदुर्गा च दुर्बोधा
    महादुर्गा प्रकीर्तिता ॥ १५०॥ फलश्रुतिः इतीदं कीर्तिदं भद्र दुर्गानामसहस्रकम् । त्रिसन्ध्यं यः पठेन्नित्यं
    तस्य लक्ष्मीः स्थिरा भवेत् ॥ १॥ ग्रहभूतपिशाचादिपीडा नश्यत्यसंशयम् । बालग्रहादिपीडायाः शान्तिर्भवति
    कीर्तनात् ॥ २॥ मारिकादिमहारोगे पठतां सौख्यदं नृणाम् । व्यवहारे च जयदं शत्रुबाधानिवारकम् ॥ ३॥ दम्पत्योः
    कलहे प्राप्ते मिथः प्रेमाभिवर्धकम् । आयुरारोग्यदं पुंसां सर्वसम्पत्प्रदायकम् ॥ ४॥ विद्याभिवर्धकं नित्यं
    पठतामर्थसाधकम् । शुभदं शुभकार्येषु पठतां श
