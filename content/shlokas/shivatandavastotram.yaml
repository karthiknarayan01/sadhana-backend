id: shivatandavastotram
category: stotram
name:
  english: shivatandavastotram
  devanagari: शिवताण्डवस्तोत्रम्
content:
  english: '| sudhamayukhalekhaya virajamanashekharam mahakapalisampade shirojatalamastunah ||6|| karalabhalapattikadhagaddhagaddhagajjvaladdhanamjaya
    dharikritapracamdapamcasayake| dharadharemdranamdinikucagracitrapatrakaprakalpanaikashilpini trilocaneratirmama
    ||7|| navinameghamamdaliniruddhadurdharasphuratkuhunishithanitamah prabaddhabaddhakandharah| nilimpanirjharidharastanotu
    krittisimdhurah kalanidhanabamdhurah shriyam jagamddhuramdharah ||8|| praphullanilapamkajaprapamcakalimaprabha'
  devanagari: । सुधामयूखलेखया विराजमानशेखरं महाकपालिसंपदे शिरोजटालमस्तुनः ॥६॥ करालभालपट्टिकाधगद्धगद्धगज्ज्वलद्धनंजया
    धरीकृतप्रचंडपंचसायके। धराधरेंद्रनंदिनीकुचाग्रचित्रपत्रकप्रकल्पनैकशिल्पिनी त्रिलोचनेरतिर्मम ॥७॥ नवीनमेघमंडलीनिरुद्धदुर्धरस्फुरत्कुहुनिशीथनीतमः
    प्रबद्धबद्धकन्धरः। निलिम्पनिर्झरीधरस्तनोतु कृत्तिसिंधुरः कलानिधानबंधुरः श्रियं जगंद्धुरंधरः ॥८॥ प्रफुल्लनीलपंकजप्रपंचकालिमप्रभा
meaning: {}
