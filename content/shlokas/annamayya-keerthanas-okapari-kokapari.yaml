id: annamayya-keerthanas-okapari-kokapari
category: stotram
name:
  english: Annamayya Keerthanas Okapari Kokapari
content:
  english: pèda tirumalacaryula racana adi pallavi òkapari kòkapari kòyyaramai | mòkamuna kalalèlla mòlacinatlundè
    || caranam jagadekapatimena callina karpuradhuli | jigikòni naluvanka cindaganu | mògi candramukhi
    nuramuna nilipègana | pògaru vènnèla digabosi natlundè || òkapari kòkapari kòyyaramai pòrimèrugu cèkkula
    pusina tattupunugu | karagi irudèsala karaganu | karigamana vibhudu ganuka mohamadamu | tòrigi samajasiri
    tòlikinatlundè || caranam mèraya shrivenkateshumena singaramuganu | taracaina sòmmulu dhariyincaga
    | mèrugu bodi alamelu mangayu tanu | mèrupu meghamu gudi mèrasinatlundè || òkapari kòkapari kòyyaramai|
    mòkamuna kalalèlla mòlacinatlundè ||
  devanagari: पॆद तिरुमलाचर्युल रचन आदि पल्लवि ऒकपरि कॊकपरि कॊय्यारमै । मॊकमुन कललॆल्ल मॊलचिनट्लुण्डॆ
    ॥ चरणं जगदेकपतिमेन चल्लिन कर्पूरधूलि । जिगिकॊनि नलुवङ्क चिन्दगानु । मॊगि चन्द्रमुखि नुरमुन निलिपॆगान
    । पॊगरु वॆन्नॆल दिगबोसि नट्लुण्डॆ ॥ ऒकपरि कॊकपरि कॊय्यारमै पॊरिमॆरुगु चॆक्कुल पूसिन तट्टुपुनुगु ।
    करगि इरुदॆसल कारगानु । करिगमन विभुडु गनुक मोहमदमु । तॊरिगि सामजसिरि तॊलिकिनट्लुण्डॆ ॥ चरणं मॆरय श्रीवेङ्कटेशुमेन
    सिङ्गारमुगानु । तरचैन सॊम्मुलु धरियिञ्चगा । मॆरुगु बोडि अलमेलु मङ्गयु तानु । मॆरुपु मेघमु गूडि मॆरसिनट्लुण्डॆ
    ॥ ऒकपरि कॊकपरि कॊय्यारमै। मॊकमुन कललॆल्ल मॊलचिनट्लुण्डॆ ॥
