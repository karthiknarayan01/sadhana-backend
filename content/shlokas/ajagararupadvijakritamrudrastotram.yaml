id: ajagararupadvijakritamrudrastotram
category: stotram
name:
  english: ajagararupadvijakritamrudrastotram
  devanagari: अजगररूपद्विजकृतंरुद्रस्तोत्रम्
content:
  english: ajagararupadvijakritam rudrastotram ajagara uvaca | sadaivyam pradhanam param jyotirupam nirakaramavyaktamanandanityam
    | tridha tattu jatam trilingaikyabhinnam pumansattvarupo rajorupanari | tayoryattu shesham tamorupameva
    tatashsheshanamne namaste namaste || 4|| rajashcadibhuto gunasyaiva maya tatha madhyabhuto narassattvarupam
    | tathaivantabhuto napumskam tamovatsadaivadya nagesha tubhyam namaste || 5|| naradhararupo bhavankalakarta
    narakarshanastvam hi sankarshanashca | ramante munishastvayi brahmadhamni namaste namaste punaste
    namo'stu | narangeshu cadharabhuta shiva ya smrita yoganidra hi shaktistvadiya || 6|| iti bhavishyapurane
    pratisargaparvani caturthakhande ekodashadhyayantargatam ajagararupadvijakritam rudrastotram samaptam
    | bhavishyapurana | pratisargaparva | caturthakhanda | adhyaya 11
  devanagari: अजगररूपद्विजकृतं रुद्रस्तोत्रम् अजगर उवाच । सदैव्यं प्रधानं परं ज्योतिरूपं निराकारमव्यक्तमानन्दनित्यम्
    । त्रिधा तत्तु जातं त्रिलिङ्गैक्यभिन्नं पुमान्सत्त्वरूपो रजोरूपनारी । तयोर्यत्तु शेषं तमोरूपमेव ततश्शेषनाम्ने
    नमस्ते नमस्ते ॥ ४॥ रजश्चादिभूतो गुणस्यैव माया तथा मध्यभूतो नरस्सत्त्वरूपम् । तथैवान्तभूतो नपुंस्कं
    तमोवत्सदैवाद्य नागेश तुभ्यं नमस्ते ॥ ५॥ नराधाररूपो भवान्कालकर्ता नराकर्षणस्त्वं हि सङ्कर्षणश्च । रमन्ते
    मुनीशास्त्वयि ब्रह्मधाम्नि नमस्ते नमस्ते पुनस्ते नमोऽस्तु । नराङ्गेषु चाधारभूता शिवा या स्मृता योगनिद्रा
    हि शक्तिस्त्वदीया ॥ ६॥ इति भविष्यपुराणे प्रतिसर्गपर्वणि चतुर्थखण्डे एकोदशाध्यायान्तर्गतं अजगररूपद्विजकृतं
    रुद्रस्तोत्रं समाप्तम् । भविष्यपुराण । प्रतिसर्गपर्व । चतुर्थखण्ड । अध्याय ११
