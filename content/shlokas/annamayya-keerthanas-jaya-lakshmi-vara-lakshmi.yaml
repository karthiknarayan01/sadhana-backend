id: annamayya-keerthanas-jaya-lakshmi-vara-lakshmi
category: stotram
name:
  english: Annamayya Keerthanas Jaya Lakshmi Vara Lakshmi
content:
  english: rupaka pallavi jayalakshmi varalakshmi sangrama viralakshmi | palajalanidhiloni pasanainami~gada
    melimitamaraloni mincuvasana | nilavarnunuramupai nindinanidhanamavai yelevu lokamulu mammelavamma
    || jayalakshmi varalakshmi sangrama viralakshmi | ma buttina sampadalamèṟu~gavo kanduva brahmala ma
    gacekalpavalli | andinagovinduniki andane todunidavai vundanavu ma intane vundavamma || jayalakshmi
    varalakshmi sangrama viralakshmi | padiyaru vannèlato bangaru patima cèdarani vedamula ciguru~bodi
    | yèduta shrivenkateshunillalavai nivu nidula nilicetalli nivaramamma || jayalakshmi varalakshmi sangrama
    viralakshmi |
  devanagari: रूपक पल्लवि जयलक्ष्मि वरलक्ष्मि सङ्ग्राम वीरलक्ष्मि । पालजलनिधिलोनि पसनैनमीँगड मेलिमितामरलोनि
    मिञ्चुवासन । नीलवर्णुनुरमुपै निण्डिननिधानमवै येलेवु लोकमुलु मम्मेलवम्मा ॥ जयलक्ष्मि वरलक्ष्मि सङ्ग्राम
    वीरलक्ष्मि । म बुट्टिन सम्पदलमॆऱुँगवो कन्दुव ब्रह्मल म गाचेकल्पवल्लि । अन्दिनगोविन्दुनिकि अण्डने तोडुनीडवै
    वुन्दानवु मा इण्टने वुण्डवम्मा ॥ जयलक्ष्मि वरलक्ष्मि सङ्ग्राम वीरलक्ष्मि । पदियारु वन्नॆलतो बङ्गारु
    पतिम चॆदरनि वेदमुल चिगुरुँबोडि । यॆदुट श्रीवेङ्कटेशुनिल्लालवै नीवु निदुल निलिचेतल्लि नीवारमम्मा ॥
    जयलक्ष्मि वरलक्ष्मि सङ्ग्राम वीरलक्ष्मि ।
