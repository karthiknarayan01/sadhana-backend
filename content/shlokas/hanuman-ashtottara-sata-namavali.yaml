id: hanuman-ashtottara-sata-namavali
category: stotram
name:
  english: Hanuman Ashtottara Sata Namavali
content:
  english: om shri anjaneyaya namah | om mahaviraya namah | om hanumate namah | om marutatmajaya namah
    | om tattvajnanapradaya namah | om sitadevimudrapradayakaya namah | om ashokavanikacchetre namah |
    om sarvamayavibhanjanaya namah | om sarvabandhavimoktre namah | om rakshovidhvamsakarakaya namah |
    | om paravidyapariharaya namah | om parashauryavinashanaya namah | om paramantranirakartre namah |
    om parayantraprabhedakaya namah | om sarvagrahavinashine namah | om bhimasenasahayakrite namah | om
    sarvaduhkhaharaya namah | om sarvalokacarine namah | om manojavaya namah | om parijatadrumulasthaya
    namah | | om sarvamantrasvarupavate namah | om sarvatantrasvarupine namah | om sarvayantratmakaya
    namah | om kapishvaraya namah | om mahakayaya namah | om sarvarogaharaya namah | om prabhave namah
    | om balasiddhikaraya namah | om sarvavidyasampatpradayakaya namah | om kapisenanayakaya namah | |
    om bhavishyaccaturananaya namah | om kumarabrahmacarine namah | om ratnakundaladiptimate namah | om
    sancaladvalasannaddhalambamanashikhojjvalaya namah | om gandharvavidyatattvajnaya namah | om mahabalaparakramaya
    namah | om karagrihavimoktre namah | om shrinkhalabandhamocakaya namah | om sagarottarakaya namah
    | om prajnaya namah | | om ramadutaya namah | om pratapavate namah | om vanaraya namah | om kesarisutaya
    namah | om sitashokanivarakaya namah | om anjanagarbhasambhutaya namah | om balarkasadrishananaya
    namah | om vibhishanapriyakaraya namah | om dashagrivakulantakaya namah | om lakshmanapranadatre namah
    | | om vajrakayaya namah | om mahadyutaye namah | om ciranjivine namah | om ramabhaktaya namah | om
    daityakaryavighatakaya namah | om akshahantre namah | om kancanabhaya namah | om pancavaktraya namah
    | om mahatapase namah | om lankinibhanjanaya namah | | om shrimate namah | om simhikapranabhanjanaya
    namah | om gandhamadanashailasthaya namah | om lankapuravidahakaya namah | om sugrivasacivaya namah
    | om dhiraya namah | om shuraya namah | om daityakulantakaya namah | om surarcitaya namah | om mahatejase
    namah | | om ramacudamanipradaya namah | om kamarupine namah | om pingalakshaya namah | om vardhimainakapujitaya
    namah | om kabalikritamartandamandalaya namah | om vijitendriyaya namah | om ramasugrivasandhatre
    namah | om mahiravanamardanaya namah | om sphatikabhaya namah | om vagadhishaya namah | | om navavyakritipanditaya
    namah | om caturbahave namah | om dinabandhave namah | om mahatmane namah | om bhaktavatsalaya namah
    | om sanjivananagahartre namah | om shucaye namah | om vagmine namah | om dridhavrataya namah | om
    kalanemipramathanaya namah | | om harimarkatamarkataya namah | om dantaya namah | om shantaya namah
    | om prasannatmane namah | om shatakanthamadapahrite namah | om yogine namah | om ramakathalolaya
    namah | om sitanveshanapanditaya namah | om vajradamshtraya namah | om vajranakhaya namah | | om rudraviryasamudbhavaya
    namah | om indrajitprahitamoghabrahmastravinivarakaya namah | om parthadhvajagrasamvasine namah |
    om sharapanjarabhedakaya namah | om dashabahave namah | om lokapujyaya namah | om jambavatpritivardhanaya
    namah | om sitasametashriramapadasevadhurandharaya namah | | iti shrimadanjaneyashtottarashatanamavalih
    |
  devanagari: ॐ श्री आञ्जनेयाय नमः । ॐ महावीराय नमः । ॐ हनुमते नमः । ॐ मारुतात्मजाय नमः । ॐ तत्त्वज्ञानप्रदाय
    नमः । ॐ सीतादेवीमुद्राप्रदायकाय नमः । ॐ अशोकवनिकाच्छेत्रे नमः । ॐ सर्वमायाविभञ्जनाय नमः । ॐ सर्वबन्धविमोक्त्रे
    नमः । ॐ रक्षोविध्वंसकारकाय नमः । । ॐ परविद्यापरीहाराय नमः । ॐ परशौर्यविनाशनाय नमः । ॐ परमन्त्रनिराकर्त्रे
    नमः । ॐ परयन्त्रप्रभेदकाय नमः । ॐ सर्वग्रहविनाशिने नमः । ॐ भीमसेनसहायकृते नमः । ॐ सर्वदुःखहराय नमः
    । ॐ सर्वलोकचारिणे नमः । ॐ मनोजवाय नमः । ॐ पारिजातद्रुमूलस्थाय नमः । । ॐ सर्वमन्त्रस्वरूपवते नमः ।
    ॐ सर्वतन्त्रस्वरूपिणे नमः । ॐ सर्वयन्त्रात्मकाय नमः । ॐ कपीश्वराय नमः । ॐ महाकायाय नमः । ॐ सर्वरोगहराय
    नमः । ॐ प्रभवे नमः । ॐ बलसिद्धिकराय नमः । ॐ सर्वविद्यासम्पत्प्रदायकाय नमः । ॐ कपिसेनानायकाय नमः ।
    । ॐ भविष्यच्चतुराननाय नमः । ॐ कुमारब्रह्मचारिणे नमः । ॐ रत्नकुण्डलदीप्तिमते नमः । ॐ सञ्चलद्वालसन्नद्धलम्बमानशिखोज्ज्वलाय
    नमः । ॐ गन्धर्वविद्यातत्त्वज्ञाय नमः । ॐ महाबलपराक्रमाय नमः । ॐ कारागृहविमोक्त्रे नमः । ॐ शृङ्खलाबन्धमोचकाय
    नमः । ॐ सागरोत्तारकाय नमः । ॐ प्राज्ञाय नमः । । ॐ रामदूताय नमः । ॐ प्रतापवते नमः । ॐ वानराय नमः ।
    ॐ केसरीसुताय नमः । ॐ सीताशोकनिवारकाय नमः । ॐ अञ्जनागर्भसम्भूताय नमः । ॐ बालार्कसदृशाननाय नमः । ॐ विभीषणप्रियकराय
    नमः । ॐ दशग्रीवकुलान्तकाय नमः । ॐ लक्ष्मणप्राणदात्रे नमः । । ॐ वज्रकायाय नमः । ॐ महाद्युतये नमः ।
    ॐ चिरञ्जीविने नमः । ॐ रामभक्ताय नमः । ॐ दैत्यकार्यविघातकाय नमः । ॐ अक्षहन्त्रे नमः । ॐ काञ्चनाभाय
    नमः । ॐ पञ्चवक्त्राय नमः । ॐ महातपसे नमः । ॐ लङ्किणीभञ्जनाय नमः । । ॐ श्रीमते नमः । ॐ सिंहिकाप्राणभञ्जनाय
    नमः । ॐ गन्धमादनशैलस्थाय नमः । ॐ लङ्कापुरविदाहकाय नमः । ॐ सुग्रीवसचिवाय नमः । ॐ धीराय नमः । ॐ शूराय
    नमः । ॐ दैत्यकुलान्तकाय नमः । ॐ सुरार्चिताय नमः । ॐ महातेजसे नमः । । ॐ रामचूडामणिप्रदाय नमः । ॐ कामरूपिणे
    नमः । ॐ पिङ्गलाक्षाय नमः । ॐ वार्धिमैनाकपूजिताय नमः । ॐ कबलीकृतमार्ताण्डमण्डलाय नमः । ॐ विजितेन्द्रियाय
    नमः । ॐ रामसुग्रीवसन्धात्रे नमः । ॐ महिरावणमर्दनाय नमः । ॐ स्फटिकाभाय नमः । ॐ वागधीशाय नमः । । ॐ नवव्याकृतिपण्डिताय
    नमः । ॐ चतुर्बाहवे नमः । ॐ दीनबन्धवे नमः । ॐ महात्मने नमः । ॐ भक्तवत्सलाय नमः । ॐ सञ्जीवननगाहर्त्रे
    नमः । ॐ शुचये नमः । ॐ वाग्मिने नमः । ॐ दृढव्रताय नमः । ॐ कालनेमिप्रमथनाय नमः । । ॐ हरिमर्कटमर्कटाय
    नमः । ॐ दान्ताय नमः । ॐ शान्ताय नमः । ॐ प्रसन्नात्मने नमः । ॐ शतकण्ठमदापहृते नमः । ॐ योगिने नमः ।
    ॐ रामकथालोलाय नमः । ॐ सीतान्वेषणपण्डिताय नमः । ॐ वज्रदंष्ट्राय नमः । ॐ वज्रनखाय नमः । । ॐ रुद्रवीर्यसमुद्भवाय
    नमः । ॐ इन्द्रजित्प्रहितामोघब्रह्मास्त्रविनिवारकाय नमः । ॐ पार्थध्वजाग्रसंवासिने नमः । ॐ शरपञ्जरभेदकाय
    नमः । ॐ दशबाहवे नमः । ॐ लोकपूज्याय नमः । ॐ जाम्बवत्प्रीतिवर्धनाय नमः । ॐ सीतासमेतश्रीरामपादसेवाधुरन्धराय
    नमः । । इति श्रीमदाञ्जनेयाष्टोत्तरशतनामावलिः ।
