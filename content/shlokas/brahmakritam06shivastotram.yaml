id: brahmakritam06shivastotram
category: stotram
name:
  english: brahmakritam06shivastotram
  devanagari: ब्रह्मकृतं०६शिवस्तोत्रम्
content:
  english: 10|| devadaruvane purvam muninkevalakarmathan | prakshobhya dhurtaveshastvam dayayanvagrahistatha
    || 11|| anghrinakrantavanno cedatyugram tvamapasmritim | tayakrantamidam kritsnamandhakarayate jagat
    || 12|| ardhanarishvaram rupam tvaya cenna prakashitam | prabhavami katham srashtum jagadetaccaracaram
    || 13|| bhavata stambhitah shambho samrambhajjambhajidbhujah | kiyantam hanta kalam te jayastambha
    iva sthitah || 14|| bhikshoh kapalamapurya rudhirenatmano harih | shulenotkshipya mumuhe hyetattvamavadharaya
    || 15|| na cedashikshayah sarvashastrastranyanukampaya | nirvapayetkatham vairam kruddho'pi jamadagnibhuh
    || 16|| nriharim sharabhakarah samaharshinna cedbhavan | sa eva samharedvishvam hiranyakashiporapi
    || 17|| tvamacakrikshah kalpabdhau kaivartto matsyakacchapau | harim baddhvahiratsutrairnrisimhamatha
    sukaram || 18|| ekone padmasahasre svanetrena kritarcanam | shulinsudarshanam dattva daityadvishamatutushah
    || 19|| iti shriskandapurane maheshvarakhande'runacalamahatmye uttarardhe shodashadhyayantargatam
    brahmakritam shivastotram samaptam | skandapurana | maheshvarakhanda | arunakhanda | uttarakhanda
    | adhyaya 16
  devanagari: १०॥ देवदारुवने पूर्वं मुनीन्केवलकर्मठान् । प्रक्षोभ्य धूर्तवेषस्त्वं दययान्वग्रहीस्तथा ॥
    ११॥ अङ्घ्रिणाक्रान्तवान्नो चेदत्युग्रां त्वमपस्मृतिम् । तयाक्रान्तमिदं कृत्स्नमन्धकारायते जगत् ॥ १२॥
    अर्धनारीश्वरं रूपं त्वया चेन्न प्रकाशितम् । प्रभवामि कथं स्रष्टुं जगदेतच्चराचरम् ॥ १३॥ भवता स्तम्भितः
    शम्भो संरम्भाज्जम्भजिद्भुजः । कियन्तं हन्त कालं ते जयस्तम्भ इव स्थितः ॥ १४॥ भिक्षोः कपालमापूर्य रुधिरेणात्मनो
    हरिः । शूलेनोत्क्षिप्य मुमुहे ह्येतत्त्वमवधारय ॥ १५॥ न चेदशिक्षयः सर्वशस्त्रास्त्राण्यनुकम्पया । निर्वापयेत्कथं
    वैरं क्रुद्धोऽपि जमदग्निभूः ॥ १६॥ नृहरिं शरभाकारः समहार्षीन्न चेद्भवान् । स एव संहरेद्विश्वं हिरण्यकशिपोरपि
    ॥ १७॥ त्वमाचकृक्षः कल्पाब्धौ कैवर्त्तो मत्स्यकच्छपौ । हरिं बद्ध्वाहिराट्सूत्रैर्नृसिंहमथ सूकरम् ॥
    १८॥ एकोने पद्मसाहस्रे स्वनेत्रेण कृतार्चनम् । शूलिन्सुदर्शनं दत्त्वा दैत्यद्विषमतूतुषः ॥ १९॥ इति श्रीस्कन्दपुराणे
    माहेश्वरखण्डेऽरुणाचलमाहात्म्ये उत्तरार्धे षोडशाध्यायान्तर्गतं ब्रह्मकृतं शिवस्तोत्रं समाप्तम् । स्कन्दपुराण
    । माहेश्वरखण्ड । अरुणाखण्ड । उत्तरखण्ड । अध्याय १६
