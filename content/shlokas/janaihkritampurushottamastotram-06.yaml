id: janaihkritampurushottamastotram-06
category: stotram
name:
  english: janaihkritampurushottamastotram 06
  devanagari: जनैःकृतंपुरुषोत्तमस्तोत्रम् ०६
content:
  english: atha naryo narah stotram sarve cakrurharestada | premapurnahridayashca sthiramanasavrittayah
    || 39|| namo'stu te pare dhamni rajate vai paratmane | namo'sankhyasatisadhvisadhumuktabhishasine
    || 40|| namo'kshara'dhipataye'ksharamukta'bhishasine | namo golokavasaya gopagopyabhishasine || 41||
    gavam nathaya krishnaya shriradhapataye namah | namo vaikunthavasaya shriramapataye namah || 42||
    bahuvaikunthanathaya lakshmishripataye namah | shriprabhamanjulahamsasagunasvamine namah || 43|| vrindatulasikamalaparvatipataye
    namah | namaste'stu jagannatha vasudeva namo'stu te || 44|| shrinivasa namaste'stu vishvaksena namo'stu
    te | garudadhvaja gopisha vishno vaikuntha te namah || 45|| purushottama devesha sarveshvara namo'stu
    te | anadyadyantamadhyanta namaste padmajapriya || 46|| srishtigarbha namastubhyam shatrunjaya namo'stu
    te | namo hiranyarupaya kalanetraya te namah || 47|| mahanabha mahamula mulavasa namo'stu te | dharmavasa
    hridavasa shucishravah prithushrava || 48|| dharmadhyaksha prajadhyaksha kaladhyaksha namo'stu te
    | gadadharin padmadharin shrutiprashna namo'stute || 49|| shriyodhara vanamaladhara krishna namo'stute
    | purushtuta mahakalpa sarvatma~ste namo vibho || 50|| dvadashatmaka kalatman samatman parameshvara
    | vyomarkatmaka candratman sarvasukshma namo'stu te || 51|| nilakesha gudakesha mahakesha namo'stu
    te | manjukesha hrishikesha sarvakesha namo'stu te || 52|| shveta rakta tatha pita citra krishna namo'stu
    te | kusheshaya pritikartargovinda hamsa te namah || 53|| namaste dharmanetraya sahasrangaya te namah
    | namaste vishvarupaya dhamarupaya te namah || 54|| nyagrodhaya pippalaya mahashakhaya te namah |
    skandhapatrankuralatapallavaya namo'stu te || 55|| tvam vai vedamayo vishnustirthadevamato vibhuh
    | bhurbhuvahsvahsvarupastvam yajnabhagabhuje namah || 56|| parabrahma namaste'stu shabdabrahma namo'stu
    te | vidya tvam vedyarupastvam vandaniya namo'stu te || 57|| narivanisvarupastvam nare dayasvarupakah
    | putre vatsalyabhavastvam tvam vayam sharanam gatah || 58|| uddharam kuru samsaradbhagavan parameshvara
    | ityuktva maunamasedustatashcaryayano munih || 59|| tushtava paraya pritya shrikantam purushottamam
    | matsyam namasye kurmam ca namasye hayashirshakam || 60|| trivikramam namasye ca namasye madhavam
    prabhum | ishanam ca hrishikesham namasye ca kumarilam || 61|| narayanam namasye'ham namasye garudadhvajam
    | narasimham namasye ca namasye kamapalinam || 62|| pundarikanibhanetram namasye shrinarayanam | namasye
    dhvajacakrabjadhanurminasushulinam || 63|| gopatim kambharaputram vibhum gopalanandanam | namasye
    ca gadapanim cashvapattasarahsthitam || 64|| ardhanarishvaram natham narivrindasukhapradam | namasye
    padmahastam ca padmasakthinamityapi || 65|| namasye padmakiranam tathordhvarekhapattalam | lakshmipratimajaghanam
    namasye vanamalinam || 66|| namasye dharaninatham namasye'ham shriyah patim | anathanatha naukastha
    vimanastha ca te namah || 67|| hritstha bhaktaviharastha dinarakshastha te namah | trinaciketam brahmanam
    namasye ca mahaujasam || 68|| sarvamayavinasham ca namasye ghranatarpanam | namasye rukmakavacam namasye
    purushottamam || 69|| vanaspatim madhupatim namasye ca sudhapatim | vasudevam cakrapanim namasye ca
    yashodhanam || 70|| sarvabhutagatam shantam dharmamurtim pareshvaram | namasye mokshadam natham sharanyam
    sharanam vraje || 71|| evam tushtava devesham shrimanaryayano munih | iti shrilakshminarayaniyasamhita
    | khanda 2| adhyaya 62
  devanagari: अथ नार्यो नराः स्तोत्रं सर्वे चक्रुर्हरेस्तदा । प्रेमपूर्णहृदयाश्च स्थिरमानसवृत्तयः ॥ ३९॥
    नमोऽस्तु ते परे धाम्नि राजते वै परात्मने । नमोऽसङ्ख्यसतीसाध्वीसाधुमुक्ताभिशासिने ॥ ४०॥ नमोऽक्षराऽधिपतयेऽक्षरमुक्ताऽभिशासिने
    । नमो गोलोकवासाय गोपगोप्यभिशासिने ॥ ४१॥ गवां नाथाय कृष्णाय श्रीराधापतये नमः । नमो वैकुण्ठवासाय श्रीरमापतये
    नमः ॥ ४२॥ बहुवैकुण्ठनाथाय लक्ष्मीश्रीपतये नमः । श्रीप्रभामञ्जुलाहंसासगुणास्वामिने नमः ॥ ४३॥ वृन्दातुलसीकमलापार्वतीपतये
    नमः । नमस्तेऽस्तु जगन्नाथ वासुदेव नमोऽस्तु ते ॥ ४४॥ श्रीनिवास नमस्तेऽस्तु विष्वक्सेन नमोऽस्तु ते ।
    गरुडध्वज गोपीश विष्णो वैकुण्ठ ते नमः ॥ ४५॥ पुरुषोत्तम देवेश सर्वेश्वर नमोऽस्तु ते । अनाद्याद्यन्तमध्यान्त
    नमस्ते पद्मजप्रिय ॥ ४६॥ सृष्टिगर्भ नमस्तुभ्यं शत्रुञ्जय नमोऽस्तु ते । नमो हिरण्यरूपाय कालनेत्राय ते
    नमः ॥ ४७॥ महानाभ महामूल मूलावास नमोऽस्तु ते । धर्मावास हृदावास शुचिश्रवः पृथुश्रवा ॥ ४८॥ धर्माध्यक्ष
    प्रजाध्यक्ष कालाध्यक्ष नमोऽस्तु ते । गदाधारिन् पद्मधारिन् श्रुतिप्रश्न नमोऽस्तुते ॥ ४९॥ श्रियोधर वनमालाधर
    कृष्ण नमोऽस्तुते । पुरुष्टुत महाकल्प सर्वात्मँस्ते नमो विभो ॥ ५०॥ द्वादशात्मक कालात्मन् सामात्मन्
    परमेश्वर । व्योमार्कात्मक चन्द्रात्मन् सर्वसूक्ष्म नमोऽस्तु ते ॥ ५१॥ नीलकेश गुडाकेश महाकेश नमोऽस्तु
    ते । मञ्जुकेश हृषीकेश सर्वकेश नमोऽस्तु ते ॥ ५२॥ श्वेत रक्त तथा पीत चित्र कृष्ण नमोऽस्तु ते । कुशेशय
    प्रीतिकर्तर्गोविन्द हंस ते नमः ॥ ५३॥ नमस्ते धर्मनेत्राय सहस्राङ्गाय ते नमः । नमस्ते विश्वरूपाय धामरूपाय
    ते नमः ॥ ५४॥ न्यग्रोधाय पिप्पलाय महाशाखाय ते नमः । स्कन्धपत्राङ्कुरलतापल्लवाय नमोऽस्तु ते ॥ ५५॥ त्वं
    वै वेदमयो विष्णुस्तीर्थदेवमतो विभुः । भूर्भुवःस्वःस्वरूपस्त्वं यज्ञभागभुजे नमः ॥ ५६॥ परब्रह्म नमस्तेऽस्तु
    शब्दब्रह्म नमोऽस्तु ते । विद्या त्वं वेद्यरूपस्त्वं वन्दनीय नमोऽस्तु ते ॥ ५७॥ नारीवाणीस्वरूपस्त्वं
    नरे दयास्वरूपकः । पुत्रे वात्सल्यभावस्त्वं त्वां वयं शरणं गताः ॥ ५८॥ उद्धारं कुरु संसाराद्भगवन् परमेश्वर
    । इत्युक्त्वा मौनमासेदुस्ततश्चार्यायनो मुनिः ॥ ५९॥ तुष्टाव परया प्रीत्या श्रीकान्तं पुरुषोत्तमम् ।
    मत्स्यं नमस्ये कूर्मं च नमस्ये हयशीर्षकम् ॥ ६०॥ त्रिविक्रमं नमस्ये च नमस्ये माधवं प्रभुम् । ईशानं
    च हृषीकेशं नमस्ये च कुमारिलम् ॥ ६१॥ नारायणं नमस्येऽहं नमस्ये गरुडध्वजम् । नरसिंहं नमस्ये च नमस्ये
    कामपालिनम् ॥ ६२॥ पुण्डरीकनिभनेत्रं नमस्ये श्रीनरायणम् । नमस्ये ध्वजचक्राब्जधनुर्मीनसुशूलिनम् ॥ ६३॥
    गोपतिं कम्भरापुत्रं विभुं गोपालनन्दनम् । नमस्ये च गदापाणिं चाश्वपट्टसरःस्थितम् ॥ ६४॥ अर्धनारीश्वरं
    नाथं नारीवृन्दसुखप्रदम् । नमस्ये पद्महस्तं च पद्मसक्थिनमित्यपि ॥ ६५॥ नमस्ये पद्मकिरणं तथोर्ध्वरेखपत्तलम्
    । लक्ष्मीप्रतिमजघनं नमस्ये वनमालिनम् ॥ ६६॥ नमस्ये धरणिनाथं नमस्येऽहं श्रियः पतिम् । अनाथनाथ नौकास्थ
    विमानस्थ च ते नमः ॥ ६७॥ हृत्स्थ भक्तविहारस्थ दीनरक्षास्थ ते नमः । त्रिणाचिकेतं ब्रह्माणं नमस्ये च
    महौजसम् ॥ ६८॥ सर्वामयविनाशं च नमस्ये घ्राणतर्पणम् । नमस्ये रुक्मकवचं नमस्ये पुरुषोत्तमम् ॥ ६९॥ वनस्पतिं
    मधुपतिं नमस्ये च सुधापतिम् । वासुदेवं चक्रपाणिं नमस्ये च यशोधनम् ॥ ७०॥ सर्वभूतगतं शान्तं धर्ममूर्तिं
    परेश्वरम् । नमस्ये मोक्षदं नाथं शरण्यं शरणं व्रजे ॥ ७१॥ एवं तुष्टाव देवेशं श्रीमानार्यायनो मुनिः ।
    इति श्रीलक्ष्मीनारायणीयसंहिता । खण्ड २। अध्याय ६२
