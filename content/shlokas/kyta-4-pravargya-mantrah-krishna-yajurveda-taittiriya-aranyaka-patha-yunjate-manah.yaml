    rapa shshanti raja shanti rashva shshantireva shanti shshantirme astu shantih || taya 'hagm shantya
    sarvashantya mahya ndvipade catushpade ca shanti nkaromi shantirme astu shantih || eha shrishca hrishca
    dhritishca tapo medha pratishtha shraddha satya ndharmashcaitani mottishthanta manuttishthantu ma
    mag shrishca hrishca dhritishca tapo medha pratishtha shraddha satya ndharmashcaitani ma ma hasishuh
    || udayusha svayushodoshadhinagm raseno tparjanyasya shushmenodastha mamritagm anu || taccakshu cchukramuccarat
    | pashyema sharadah shata nnandama sharadah shata mbhavama sharadah shatagm shrinavama sharadah shata
    mprabravama sharadah shata majita ssarirasya maddhyathsa ma vrishabho lohitaksha nmanasa punatu ||
    brahmana shshcotanyasi brahmana ani stho brahmana avapanamasi dhariteya mprithivi brahmana mahi dharitamenena
    mahadantariksha ndadhara prithivigm sadevam ndharayani ma madvedo 'dhi visrasat || medhamanishe ma
    ''vishatagm samici bhutasya bhavyasyavaruddhyai sarvamayurayani sarvamayurayani || abhi ryadato na
    unamapyayaya harivo vardhamanah | yada stotribhyo mahi gotra rujasi bhuyishthabhajo adha te syama
    || brahma pravadishma tanno ma hasit || om shanti rdhruvasih daikanna vigmshati r bhururdhva strigmshata
    yadishita shcatvari prithivyashta shashtih shannah saptapancasha ddvicatvarigmshat || harih om ||
