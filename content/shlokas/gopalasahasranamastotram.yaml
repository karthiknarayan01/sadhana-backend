id: gopalasahasranamastotram
category: sahasranama
name:
  english: gopalasahasranamastotram
  devanagari: गोपालसहस्रनामस्तोत्रम्
content:
  english: rigalaha | damaghoshopadeshta ca rathagrahi sudarshanah || 24|| virapatniyashastrata jaravyadhivighatakah
    | dvarakavasatattvajnah hutashanavarapradah || 25|| yamunavegasamhari nilambaradharah prabhuh | vibhuh
    sharasano dhanvi ganesho gananayakah || 26|| lakshmano lakshano lakshyo rakshovamshavinashanah | vamano
    vamanibhuto'vamano vamanaruhah || 27|| yashodanandanah kartta yamalarjunamuktidah | ulukhali mahamani
    damabaddhahvayi shami || 28|| bhaktanukari bhagavan keshavo baladharakah | keshiha madhuha mohi vrishasuravighatakah
    || 29|| aghasuravinashi ca putanamokshadayakah | kubjavinodi bhagavan kamsamrityurmahamakhi || 30||
    ashvamedho vajapeyo gomedho naramedhavan | kandarpakotilavanyashcandrakotisushitalah || 31|| ravikotipratikasho
    vayukotimahabalah | brahma brahmandakarta ca kamalavanchitapradah || 32|| kamala kamalakshashca kamalamukhalolupah
    | kamalavratadhari ca kamalabhah purandarah || 33|| saubhagyadhikacitto'yam mahamayi madotkatah |
    tarakarih suratrata maricakshobhakarakah || 34|| vishvamitrapriyo danto ramo rajivalocanah | lankadhipakuladhvamsi
    vibhishanavarapradah || 35|| sitanandakaro ramo viro varidhibandhanah | kharadushanasamhari saketapuravasavan
    || 36|| candravalipatih kulah keshikamsavadho'malah | madhavo madhuha madhvi madhviko madhavo vidhuh
    || 37|| munjatavigahamanah dhenukarirdharatmajah | vamshivatavihari ca govardhanavanashrayah || 38||
    tatha talavanoddeshi bhandiravanashankhaha | trinavartakripakari vrishabhanusutapatih || 39|| radhapranasamo
    radhavadanabjamadhuvratah | gopiranjanadaivajnah lilakamalapujitah || 40|| kridakamalasandohah gopikapritiranjanah
    | ranjako ranjano rango rangi rangamahiruhah || 41|| kamah kamaribhakto'yam puranapurushah kavih |
    narado devalo bhimo balo balamukhambujah || 42|| ambujo brahmasakshi ca yogi dattavaro munih | rishabhah
    parvato gramo nadipavanavallabhah || 43|| padmanabhah surajyeshthi brahma rudro'hibhushitah | gananam
    tranakarta ca ganesho grahilo grahi || 44|| ganashrayo ganadhyakshah krodikritajagattrayah | yadavendro
    dvarakendro mathuravallabho dhuri || 45|| bhramarah kuntali kuntisutaraksho mahamakhi | yamunavaradata
    ca kashyapasya varapradah || 46|| shankhacudavadhoddamo gopirakshanatatparah | pancajanyakaro rami
    trirami vanajo jayah || 47|| phalgunah phalgunasakho viradhavadhakarakah | rukminiprananathashca satyabhamapriyankarah
    || 48|| kalpavriksho mahavrikshah danavriksho mahaphalah | ankusho bhusuro bhavo bhramako bhamako
    harih || 49|| saralah shashvato viro yaduvamshi shivatmakah | pradyumno balakarta ca praharta daityaha
    prabhuh || 50|| mahadhani mahaviro vanamalavibhushanah | tulasidamashobhadhyo jalandharavinashanah
    || 51|| shurah suryo mritandashca bhaskaro vishvapujitah | ravistamoha vahnishca badavo vadavanalah
    || 52|| daityadarpavinashi ca garudo garudagrajah | gopinatho mahanatho vrindanatho'virodhakah ||
    53|| prapanci pancarupashca latagulmashca gopatih | ganga ca yamunarupo goda vetravati tatha || 54||
    kaveri narmada tapti gandaki sarayustatha | rajasastamasassattvi sarvangi sarvalocanah || 55|| sudhamayo'mritamayo
    yoginivallabhah shivah | buddho buddhimatam shreshtho vishnurjishnuh shacipatih || 56|| vamshi vamshadharo
    lokah viloko mohanashanah | ravaravo ravo ravo balo balabalahakah || 57|| shivo rudro nalo nilo langali
    langalashrayah | paradah pavano hamso hamsarudho jagatpatih || 58|| mohinimohano mayi mahamayo mahamakhi
    | vrisho vrishakapih kalah kalidamanakarakah || 59|| kubjabhagyaprado virah rajakakshayakarakah |
    komalo varuno raja jalajo jaladharakah || 60|| harakah sarvapapaghnah parameshthi pitamahah | khadgadhari
    kripakari radharamanasundarah || 61|| dvadasharanyasambhogi sheshanagaphanalayah | kamah shyamah sukhashridah
    shripatih shrinidhih kriti || 62|| harirnarayano naro narottama ishupriyah | gopalicittaharta ca kartta
    samsaratarakah || 63|| adidevo mahadevo gaurigururanashrayah | sadhurmadhurvidhurdhata trata'kruraparayanah
    || 64|| rolambi ca hayagrivo vanararirvanashrayah | vanam vani vanadhyakshah mahavandyo mahamunih
    || 65|| syamantakamaniprajno vijno vighnavighatakah | govarddhano varddhaniyah varddhano varddhanapriyah
    || 66|| varddhanyo varddhano varddhi varddhishnuh sumukhapriyah | varddhito vriddhako vriddho vrindarakajanapriyah
    || 67|| gopalaramanibharta sambakushthavinashakah | rukminiharanah premapremi candravalipatih || 68||
    shrikarta vishvabharta ca naro narayano bali | gano ganapatishcaiva dattatreyo mahamunih || 69|| vyaso
    narayano divyo bhavyo bhavukadharakah | shvahshreyasam shivam bhadram bhavukam bhavikam shubham ||
    70|| shubhatmakah shubhah shasta prashasta meghanadaha | brahmanyadevo dinanamuddharakaranakshamah
    || 71|| krishnah kamalapatrakshah krishnah kamalalocanah | krishnah kami sada krishnah samastapriyakarakah
    || 72|| nando nandi mahanandi madi madanakah kili | mili hili gili goli golo golalayo guli || 73||
    gugguli maraki shakhi vatah pippalakah kriti | mlecchaha kalahartta ca yashodayasha eva ca || 74||
    acyutah keshavo vishnuh harih satyo janardanah | hamso narayano lilo nilo bhaktiparayanah || 75||
    janakivallabho ramah viramo vighnanashanah | sahabhanurmahabhanuh virabahurmahodadhih || 76|| samudro'bdhirakuparah
    paravarah saritpatih | gokulanandakari ca pratijnaparipalakah || 77|| sadaramah kriparamah maharamo
    dhanurdharah | parvatah parvatakaro gayo geyo dvijapriyah || 78|| kambalashvataro ramo ramayanapravartakah
    | dyaurdivo divaso divyo bhavyo bhavi bhayapahah || 79|| parvatibhagyasahito bharta lakshmivilasavan
    | vilasi sahasi sarvi garvi garvitalocanah || 80|| murarirlokadharmajnah jivano jivanantakah | yamo
    yamadiyamano yami yamavidhayakah || 81|| vasuli pamsuli pamsuh pandurarjunavallabhah | lalita candrikamali
    mali malambujashrayah || 82|| ambujaksho mahayajnah dakshah cintamanih prabhuh | manirdinamanishcaiva
    kedaro badarishrayah || 83|| badarivanasampritah vyasah satyavatisutah | amararinihanta ca sudhasindhuvidhudayah
    || 84|| candro ravih shivah shuli cakri caiva gadadharah | shrikarta shripatih shridah shridevo devakisutah
    || 85|| shripatih pundarikakshah padmanabho jagatpatih | vasudevo'prameyatma keshavo garudadhvajah
    || 86|| narayanah param dhama devadevo maheshvarah | cakrapanih kalapurno vedavedyo dayanidhih ||
    87|| bhagavan sarvabhutesho gopalah sarvapalakah | ananto nirguno nityo nirvikalpo niranjanah || 88||
    niradharo nirakarah nirabhaso nirashrayah | purushah pranavatito mukundah parameshvarah || 89|| kshanavanih
    sarvabhaumo vaikuntho bhaktavatsalah | vishnurdamodarah krishno madhavo mathurapatih || 90|| devakigarbhasambhuto
    yashodavatsalo harih | shivah sankarshanah shambhurbhutanatho divaspatih || 91|| avyayah sarvadharmajnah
    nirmalo nirupadravah | nirvananayako nityo nilajimutasannibhah || 92|| kalakshayashca sarvajnah kamalarupatatparah
    | hrishikeshah pitavasa vasudevapriyatmajah || 93|| nandagopakumararyah navanitashano vibhuh | puranapurushah
    shreshthah shankhapanih suvikramah || 94|| aniruddhashcakrarathah sharngapanishcaturbhujah | gadadharah
    surartighno govindo nandakayudhah || 95|| vrindavanacarah shaurirvenuvadyavisharadah | trinavartantako
    bhimasahasi bahuvikramah || 96|| shakatasurasamhari bakasuravinashanah | dhenukasurasamhari putanarirnrikesari
    || 97|| pitamaho gurussakshat pratyagatma sadashivah | aprameyah prabhuh prajno'pratarkyah svapnavarddhanah
    || 98|| dhanyo manyo bhavo bhavo dhirah shanto jagadguruh | antaryamishvaro divyo daivajno devasamstutah
    || 99|| kshirabdhishayano dhata lakshmivamllakshmanagrajah | dhatripatirameyatma candrashekharapujitah
    || 100|| lokasakshi jagaccakshuh punyacaritrakirtanah | kotimanmathasaundaryah jaganmohanavigrahah
    || 101|| mandasmitanano gopo gopikapariveshtitah | phullaravindanayanah canurandhranishudanah || 102||
    indivaradalashyamo barhibarhavatamsakah | muralininadahladah divyamalyambaravritah || 103|| sukapolayugah
    subhruyugalah sulalatakah | kambugrivo vishalaksho lakshmivanchubhalakshanah || 104|| pinavakshashcaturbahushcaturmurtistrivikramah
    | kalankarahitah shuddhah dushtashatrunibarhanah || 105|| kiritakundaladharah katakangadamanditah
    | mudrikabharanopetah katisutravirajitah || 106|| manjiraranjitapadah sarvabharanabhushitah | vinyastapadayugalo
    divyamangalavigrahah || 107|| gopikanayananandah purnacandranibhananah | samastajagadanandah sundaro
    lokanandanah || 108|| yamunatirasancari radhamanmathavaibhavah | gopanaripriyo danto gopivastrapaharakah
    || 109|| sha
  devanagari: ृगालहा । दमघोषोपदेष्टा च रथग्राही सुदर्शनः ॥ २४॥ वीरपत्नीयशस्त्राता जराव्याधिविघातकः । द्वारकावासतत्त्वज्ञः
    हुताशनवरप्रदः ॥ २५॥ यमुनावेगसंहारी नीलाम्बरधरः प्रभुः । विभुः शरासनो धन्वी गणेशो गणनायकः ॥ २६॥ लक्ष्मणो
    लक्षणो लक्ष्यो रक्षोवंशविनाशनः । वामनो वामनीभूतोऽवामनो वामनारुहः ॥ २७॥ यशोदानन्दनः कर्त्ता यमलार्जुनमुक्तिदः
    । उलूखली महामानी दामबद्धाह्वयी शमी ॥ २८॥ भक्तानुकारी भगवान् केशवो बलधारकः । केशिहा मधुहा मोही वृषासुरविघातकः
    ॥ २९॥ अघासुरविनाशी च पूतनामोक्षदायकः । कुब्जाविनोदी भगवान् कंसमृत्युर्महामखी ॥ ३०॥ अश्वमेधो वाजपेयो
    गोमेधो नरमेधवान् । कन्दर्पकोटिलावण्यश्चन्द्रकोटिसुशीतलः ॥ ३१॥ रविकोटिप्रतीकाशो वायुकोटिमहाबलः । ब्रह्मा
    ब्रह्माण्डकर्ता च कमलावाञ्छितप्रदः ॥ ३२॥ कमला कमलाक्षश्च कमलामुखलोलुपः । कमलाव्रतधारी च कमलाभः पुरन्दरः
    ॥ ३३॥ सौभाग्याधिकचित्तोऽयं महामायी मदोत्कटः । तारकारिः सुरत्राता मारीचक्षोभकारकः ॥ ३४॥ विश्वामित्रप्रियो
    दान्तो रामो राजीवलोचनः । लङ्काधिपकुलध्वंसी विभीषणवरप्रदः ॥ ३५॥ सीतानन्दकरो रामो वीरो वारिधिबन्धनः
    । खरदूषणसंहारी साकेतपुरवासवान् ॥ ३६॥ चन्द्रावलीपतिः कूलः केशिकंसवधोऽमलः । माधवो मधुहा माध्वी माध्वीको
    माधवो विधुः ॥ ३७॥ मुञ्जाटवीगाहमानः धेनुकारिर्धरात्मजः । वंशीवटविहारी च गोवर्धनवनाश्रयः ॥ ३८॥ तथा तालवनोद्देशी
    भाण्डीरवनशङ्खहा । तृणावर्तकृपाकारी वृषभानुसुतापतिः ॥ ३९॥ राधाप्राणसमो राधावदनाब्जमधुव्रतः । गोपीरञ्जनदैवज्ञः
    लीलाकमलपूजितः ॥ ४०॥ क्रीडाकमलसन्दोहः गोपिकाप्रीतिरञ्जनः । रञ्जको रञ्जनो रङ्गो रङ्गी रङ्गमहीरुहः ॥
    ४१॥ कामः कामारिभक्तोऽयं पुराणपुरुषः कविः । नारदो देवलो भीमो बालो बालमुखाम्बुजः ॥ ४२॥ अम्बुजो ब्रह्मसाक्षी
    च योगी दत्तवरो मुनिः । ऋषभः पर्वतो ग्रामो नदीपवनवल्लभः ॥ ४३॥ पद्मनाभः सुरज्येष्ठी ब्रह्मा रुद्रोऽहिभूषितः
    । गणानां त्राणकर्ता च गणेशो ग्रहिलो ग्रही ॥ ४४॥ गणाश्रयो गणाध्यक्षः क्रोडीकृतजगत्त्रयः । यादवेन्द्रो
    द्वारकेन्द्रो मथुरावल्लभो धुरी ॥ ४५॥ भ्रमरः कुन्तली कुन्तीसुतरक्षो महामखी । यमुनावरदाता च काश्यपस्य
    वरप्रदः ॥ ४६॥ शङ्खचूडवधोद्दामो गोपीरक्षणतत्परः । पाञ्चजन्यकरो रामी त्रिरामी वनजो जयः ॥ ४७॥ फाल्गुनः
    फाल्गुनसखो विराधवधकारकः । रुक्मिणीप्राणनाथश्च सत्यभामाप्रियङ्करः ॥ ४८॥ कल्पवृक्षो महावृक्षः दानवृक्षो
    महाफलः । अङ्कुशो भूसुरो भावो भ्रामको भामको हरिः ॥ ४९॥ सरलः शाश्वतो वीरो यदुवंशी शिवात्मकः । प्रद्युम्नो
    बलकर्ता च प्रहर्ता दैत्यहा प्रभुः ॥ ५०॥ महाधनी महावीरो वनमालाविभूषणः । तुलसीदामशोभाढ्यो जालन्धरविनाशनः
    ॥ ५१॥ शूरः सूर्यो मृतण्डश्च भास्करो विश्वपूजितः । रविस्तमोहा वह्निश्च बाडवो वडवानलः ॥ ५२॥ दैत्यदर्पविनाशी
    च गरुडो गरुडाग्रजः । गोपीनाथो महानाथो वृन्दानाथोऽविरोधकः ॥ ५३॥ प्रपञ्ची पञ्चरूपश्च लतागुल्मश्च गोपतिः
    । गङ्गा च यमुनारूपो गोदा वेत्रवती तथा ॥ ५४॥ कावेरी नर्मदा ताप्ती गण्डकी सरयूस्तथा । राजसस्तामसस्सत्त्वी
    सर्वाङ्गी सर्वलोचनः ॥ ५५॥ सुधामयोऽमृतमयो योगिनीवल्लभः शिवः । बुद्धो बुद्धिमतां श्रेष्ठो विष्णुर्जिष्णुः
    शचीपतिः ॥ ५६॥ वंशी वंशधरो लोकः विलोको मोहनाशनः । रवरावो रवो रावो बलो बालबलाहकः ॥ ५७॥ शिवो रुद्रो नलो
    नीलो लाङ्गली लाङ्गलाश्रयः । पारदः पावनो हंसो हंसारूढो जगत्पतिः ॥ ५८॥ मोहिनीमोहनो मायी महामायो महामखी
    । वृषो वृषाकपिः कालः कालीदमनकारकः ॥ ५९॥ कुब्जाभाग्यप्रदो वीरः रजकक्षयकारकः । कोमलो वारुणो राजा जलजो
    जलधारकः ॥ ६०॥ हारकः सर्वपापघ्नः परमेष्ठी पितामहः । खड्गधारी कृपाकारी राधारमणसुन्दरः ॥ ६१॥ द्वादशारण्यसम्भोगी
    शेषनागफणालयः । कामः श्यामः सुखश्रीदः श्रीपतिः श्रीनिधिः कृती ॥ ६२॥ हरिर्नारायणो नारो नरोत्तम इषुप्रियः
    । गोपालीचित्तहर्ता च कर्त्ता संसारतारकः ॥ ६३॥ आदिदेवो महादेवो गौरीगुरुरनाश्रयः । साधुर्मधुर्विधुर्धाता
    त्राताऽक्रूरपरायणः ॥ ६४॥ रोलम्बी च हयग्रीवो वानरारिर्वनाश्रयः । वनं वनी वनाध्यक्षः महावन्द्यो महामुनिः
    ॥ ६५॥ स्यामन्तकमणिप्राज्ञो विज्ञो विघ्नविघातकः । गोवर्द्धनो वर्द्धनीयः वर्द्धनो वर्द्धनप्रियः ॥ ६६॥
    वर्द्धन्यो वर्द्धनो वर्द्धी वार्द्धिष्णुः सुमुखप्रियः । वर्द्धितो वृद्धको वृद्धो वृन्दारकजनप्रियः
    ॥ ६७॥ गोपालरमणीभर्ता साम्बकुष्ठविनाशकः । रुक्मिणीहरणः प्रेमप्रेमी चन्द्रावलीपतिः ॥ ६८॥ श्रीकर्ता विश्वभर्ता
    च नरो नारायणो बली । गणो गणपतिश्चैव दत्तात्रेयो महामुनिः ॥ ६९॥ व्यासो नारायणो दिव्यो भव्यो भावुकधारकः
    । श्वःश्रेयसं शिवं भद्रं भावुकं भाविकं शुभम् ॥ ७०॥ शुभात्मकः शुभः शास्ता प्रशास्ता मेघानादहा । ब्रह्मण्यदेवो
    दीनानामुद्धारकरणक्षमः ॥ ७१॥ कृष्णः कमलपत्राक्षः कृष्णः कमललोचनः । कृष्णः कामी सदा कृष्णः समस्तप्रियकारकः
    ॥ ७२॥ नन्दो नन्दी महानन्दी मादी मादनकः किली । मिली हिली गिली गोली गोलो गोलालयो गुली ॥ ७३॥ गुग्गुली
    मारकी शाखी वटः पिप्पलकः कृती । म्लेच्छहा कालहर्त्ता च यशोदायश एव च ॥ ७४॥ अच्युतः केशवो विष्णुः हरिः
    सत्यो जनार्दनः । हंसो नारायणो लीलो नीलो भक्तिपरायणः ॥ ७५॥ जानकीवल्लभो रामः विरामो विघ्ननाशनः । सहभानुर्महाभानुः
    वीरबाहुर्महोदधिः ॥ ७६॥ समुद्रोऽब्धिरकूपारः पारावारः सरित्पतिः । गोकुलानन्दकारी च प्रतिज्ञापरिपालकः
    ॥ ७७॥ सदारामः कृपारामः महारामो धनुर्धरः । पर्वतः पर्वताकारो गयो गेयो द्विजप्रियः ॥ ७८॥ कम्बलाश्वतरो
    रामो रामायणप्रवर्तकः । द्यौर्दिवो दिवसो दिव्यो भव्यो भावि भयापहः ॥ ७९॥ पार्वतीभाग्यसहितो भर्ता लक्ष्मीविलासवान्
    । विलासी साहसी सर्वी गर्वी गर्वितलोचनः ॥ ८०॥ मुरारिर्लोकधर्मज्ञः जीवनो जीवनान्तकः । यमो यमादियमनो
    यामी यामविधायकः ॥ ८१॥ वसुली पांसुली पांसुः पाण्डुरर्जुनवल्लभः । ललिता चन्द्रिकामाली माली मालाम्बुजाश्रयः
    ॥ ८२॥ अम्बुजाक्षो महायज्ञः दक्षः चिन्तामणिः प्रभुः । मणिर्दिनमणिश्चैव केदारो बदरीश्रयः ॥ ८३॥ बदरीवनसम्प्रीतः
    व्यासः सत्यवतीसुतः । अमरारिनिहन्ता च सुधासिन्धुविधूदयः ॥ ८४॥ चन्द्रो रविः शिवः शूली चक्री चैव गदाधरः
    । श्रीकर्ता श्रीपतिः श्रीदः श्रीदेवो देवकीसुतः ॥ ८५॥ श्रीपतिः पुण्डरीकाक्षः पद्मनाभो जगत्पतिः । वासुदेवोऽप्रमेयात्मा
    केशवो गरुडध्वजः ॥ ८६॥ नारायणः परं धाम देवदेवो महेश्वरः । चक्रपाणिः कलापूर्णो वेदवेद्यो दयानिधिः ॥
    ८७॥ भगवान् सर्वभूतेशो गोपालः सर्वपालकः । अनन्तो निर्गुणो नित्यो निर्विकल्पो निरञ्जनः ॥ ८८॥ निराधारो
    निराकारः निराभासो निराश्रयः । पुरुषः प्रणवातीतो मुकुन्दः परमेश्वरः ॥ ८९॥ क्षणावनिः सार्वभौमो वैकुण्ठो
    भक्तवत्सलः । विष्णुर्दामोदरः कृष्णो माधवो मथुरापतिः ॥ ९०॥ देवकीगर्भसम्भूतो यशोदावत्सलो हरिः । शिवः
    सङ्कर्षणः शम्भुर्भूतनाथो दिवस्पतिः ॥ ९१॥ अव्ययः सर्वधर्मज्ञः निर्मलो निरुपद्रवः । निर्वाणनायको नित्यो
    नीलजीमूतसन्निभः ॥ ९२॥ कलाक्षयश्च सर्वज्ञः कमलारूपतत्परः । हृषीकेशः पीतवासा वसुदेवप्रियात्मजः ॥ ९३॥
    नन्दगोपकुमारार्यः नवनीताशनो विभुः । पुराणपुरुषः श्रेष्ठः शङ्खपाणिः सुविक्रमः ॥ ९४॥ अनिरुद्धश्चक्ररथः
    शार्ङ्गपाणिश्चतुर्भुजः । गदाधरः सुरार्तिघ्नो गोविन्दो नन्दकायुधः ॥ ९५॥ वृन्दावनचरः शौरिर्वेणुवाद्यविशारदः
    । तृणावर्तान्तको भीमसाहसी बहुविक्रमः ॥ ९६॥ शकटासुरसंहारी बकासुरविनाशनः । धेनुकासुरसंहारी पूतनारिर्नृकेसरी
    ॥ ९७॥ पितामहो गुरुस्साक्षात् प्रत्यगात्मा सदाशिवः । अप्रमेयः प्रभुः प्राज्ञोऽप्रतर्क्यः स्वप्नवर्द्धनः
    ॥ ९८॥ धन्यो मान्यो भवो भावो धीरः शान्तो जगद्गुरुः । अन्तर्यामीश्वरो दिव्यो दैवज्ञो देवसंस्तुतः ॥ ९९॥
    क्षीराब्धिशयनो धाता लक्ष्मीवांल्लक्ष्मणाग्रजः । धात्रीपतिरमेयात्मा चन्द्रशेखरपूजितः ॥ १००॥ लोकसाक्षी
    जगच्चक्षुः पुण्यचारित्रकीर्तनः । कोटिमन्मथसौन्दर्यः जगन्मोहनविग्रहः ॥ १०१॥ मन्दस्मिताननो गोपो गोपिकापरिवेष्टितः
    । फुल्लारविन्दनयनः चाणूरान्ध्रनिषूदनः ॥ १०२॥ इन्दीवरदलश्यामो बर्हिबर्हावतंसकः । मुरलीनिनदाह्लादः दिव्यमाल्याम्बरावृतः
    ॥ १०३॥ सुकपोलयुगः सुभ्रूयुगलः सुललाटकः । कम्बुग्रीवो विशालाक्षो लक्ष्मीवाञ्छुभलक्षणः ॥ १०४॥ पीनवक्षाश्चतुर्बाहुश्चतुर्मूर्तिस्त्रिविक्रमः
    । कलङ्करहितः शुद्धः दुष्टशत्रुनिबर्हणः ॥ १०५॥ किरीटकुण्डलधरः कटकाङ्गदमण्डितः । मुद्रिकाभरणोपेतः कटिसूत्रविराजितः
    ॥ १०६॥ मञ्जीररञ्जितपदः सर्वाभरणभूषितः । विन्यस्तपादयुगलो दिव्यमङ्गलविग्रहः ॥ १०७॥ गोपिकानयनानन्दः
    पूर्णचन्द्रनिभाननः । समस्तजगदानन्दः सुन्दरो लोकनन्दनः ॥ १०८॥ यमुनातीरसञ्चारी राधामन्मथवैभवः । गोपनारीप्रियो
    दान्तो गोपीवस्त्रापहारकः ॥ १०९॥ श
