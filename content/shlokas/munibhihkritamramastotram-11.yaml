id: munibhihkritamramastotram-11
category: stotram
name:
  english: munibhihkritamramastotram 11
  devanagari: मुनिभिःकृतंरामस्तोत्रम् ११
content:
  english: munibhih kritam ramastotram 11 munaya ucuh | namaste ramacandraya lokanugrahakarine | aravanam
    jagatkartumavatirnaya bhutale || 63|| tatakadehasamhartre gadhijadhvararakshine | namaste jitamarica
    suvahupranaharine || 64|| ahalyamuktisandayipadapankajarenave | namaste harakodandalilabhanjanakarine
    || 65|| namaste maithilipanigrahanotsavashaline | namaste renukaputraparajayavidhayine || 66|| sahalakshmanasitabhyam
    kaikeyyastu varadvayat | satyam pitrivacah kartum namo vanamupeyushe || 67|| bharataprarthanadattapadukayugulaya
    te | namaste sharabhangasya svargapraptyaikahetave || 68|| namo viradhasamhartre gridhrarajasakhaya
    te | mayamrigamahakruramaricangavidarine || 69|| sitapaharilokeshayuddhatyaktakalevaram | jatayusham
    tu sandahya tatkaivalyapradayine || 1
  devanagari: मुनिभिः कृतं रामस्तोत्रम् ११ मुनय ऊचुः । नमस्ते रामचन्द्राय लोकानुग्रहकारिणे । अरावणं जगत्कर्तुमवतीर्णाय
    भूतले ॥ ६३॥ ताटकादेहसंहर्त्रे गाधिजाध्वररक्षिणे । नमस्ते जितमारीच सुवाहुप्राणहारिणे ॥ ६४॥ अहल्यामुक्तिसन्दायिपादपङ्कजरेणवे
    । नमस्ते हरकोदण्डलीलाभञ्जनकारिणे ॥ ६५॥ नमस्ते मैथिलीपाणिग्रहणोत्सवशालिने । नमस्ते रेणुकापुत्रपराजयविधायिने
    ॥ ६६॥ सहलक्ष्मणसीताभ्यां कैकेय्यास्तु वरद्वयात् । सत्यं पितृवचः कर्तुं नमो वनमुपेयुषे ॥ ६७॥ भरतप्रार्थनादत्तपादुकायुगुलाय
    ते । नमस्ते शरभङ्गस्य स्वर्गप्राप्त्यैकहेतवे ॥ ६८॥ नमो विराधसंहर्त्रे गृध्रराजसखाय ते । मायामृगमहाक्रूरमारीचाङ्गविदारिणे
    ॥ ६९॥ सीतापहारिलोकेशयुद्धत्यक्तकलेवरम् । जटायुषं तु सन्दह्य तत्कैवल्यप्रदायिने ॥ १
