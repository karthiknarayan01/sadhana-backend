id: mahanyasam-5-2-dik-samputanyasa-samputikarana
category: stotram
name:
  english: Mahanyasam - 5.2. Dik Samputanyasa (Samputikarana)
content:
  english: ndikshuvinyasya | o mbhurbhuvassuvah | om om | trataramindra mavitaramindragm have have suhavagm
    shuramindra mpuruhutamindragg svasti no maghava dhatvindrah || o nnamo bhagavate rudraya | om om |
    purvadigbhage indraya namah || mbhurbhuvassuvah | o nno agne varunasya vidvandevasya hedo 'va yasisishthah
    | yajishtho vahnitama shshoshucano vishva dveshagmsi pramumugdhyasmat || o nnamo bhagavate rudraya
    | nam om | agneyadigbhage agnaye namah || mbhurbhuvassuvah | o nkrinotu | yasminnakshatre yama eti
    raja | yasminnenamabhyashincanta devah | tadasya citragm havisha yajama || o nnamo bhagavate rudraya
    | mom om | dakshinadigbhage yamaya namah || mbhurbhuvassuvah | o mbham | asunvantamayajamanamiccha
    stenasyetyantaskarasyanveshi | anyamasmadiccha sa ta itya namo devi nir rite tubhyamastu || o nnamo
    bhagavate rudraya | bham om | nir mbhurbhuvassuvah | o ngam | tattva yami brahmana vandamanastada
    sha ste yajamano havirbhih | ahedamano varuneha bodhyurushagmsa ma na ayuh pramoshih || o nnamo bhagavate
    rudraya | gam om | pashcimadigbhage varunaya namah || mbhurbhuvassuvah | om va~m | a no niyudbhih
    shatinibhiradhvaragm | sahasrinibhirupa yahi yajnam | vayo asmin havishi madayasva | yuya nnamo bhagavate
    rudraya | vam om | vayavyadigbhage vayave namah || mbhurbhuvassuvah | o ntem | vayagm soma vrate tava
    | manastanushu bibhratah | prajavanto ashimahi | indrani devi subhaga supatni nnamo bhagavate rudraya
    | tem om | uttaradigbhage kuberaya namah || mbhurbhuvassuvah | om rum | tamisha njagatastasthushaspati
    njinvamavase humahe vayam | pusha no yatha vedasamasadvridhe rakshita payuradabdha nnamo bhagavate
    rudraya | rum om | ishanyadigbhage ishanaya namah || mbhurbhuvassuvah | o ndram | asme rudra mehana
    parvataso vritrahatye bharahutau sajoshah shshamsate stuvate dhayi pajra indrajyeshtha asmam avantu
    devah || o nnamo bhagavate rudraya | dram om | urdhvadigbhage akashaya namah || mbhurbhuvassuvah |
    om ya~m | syona prithivi bhavanrikshara niveshani | yaccha na nnamo bhagavate rudraya | yam om | adhodigbhage
    prithivyai namah ||
  devanagari: न्दिक्षुविन्यस्य । ओ म्भूर्भुव॒स्सुवः॑ । ॐ ओम् । त्रा॒तार॒मिन्द्र॑ मवि॒तार॒मिन्द्र॒ग्ं॒
    हवे॑ हवे सु॒हव॒ग्ं॒ शूर॒मिन्द्र म्पु॑रुहू॒तमिन्द्रग्ग्॑ स्व॒स्ति नो॑ म॒घवा॑ धा॒त्विन्द्रः॑ ॥ ओ न्नमो
    भगवते॑ रुद्रा॒य । ॐ ओम् । पूर्वदिग्भागे इन्द्राय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ओ न्नो॑ अग्ने॒ वरु॑णस्य
    वि॒द्वान्दे॒वस्य॒ हेडो ऽव॑ यासिसीष्ठाः । यजि॑ष्ठो॒ वह्नि॑तम॒ श्शोशु॑चानो॒ विश्वा॒ द्वेषाग्ं॑सि॒ प्रमु॑मुग्ध्य॒स्मत्
    ॥ ओ न्नमो भगवते॑ रुद्रा॒य । नं ओम् । आग्नेयदिग्भागे अग्नये नमः ॥ म्भूर्भुव॒स्सुवः॑ । ओ ङ्कृणोतु ।
    यस्मि॒न्नक्ष॑त्रे य॒म एति॒ राजा । यस्मि॑न्नेनम॒भ्यषि॑ञ्चन्त दे॒वाः । तद॑स्य चि॒त्रग्ं ह॒विषा॑ यजाम
    ॥ ओ न्नमो भगवते॑ रुद्रा॒य । मों ओम् । दक्षिणदिग्भागे यमाय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ओ म्भम् । असु॑न्वन्त॒मय॑जमानमिच्छ
    स्ते॒नस्ये॒त्यान्तस्क॑र॒स्यान्वे॑षि । अ॒न्यम॒स्मदि॑च्छ॒ सा त॑ इ॒त्या नमो॑ देवि निर् ऋते॒ तुभ्य॑मस्तु
    ॥ ओ न्नमो भगवते॑ रुद्रा॒य । भं ओम् । निर् म्भूर्भुव॒स्सुवः॑ । ओ ङ्गम् । तत्त्वा॑ यामि॒ ब्रह्म॑णा॒
    वन्द॑मान॒स्तदा शा स्ते॒ यज॑मानो ह॒विर्भिः॑ । अहे॑डमानो वरुणे॒ह बो॒ध्युरु॑शग्ंस॒ मा न॒ आयुः॒ प्रमो॑षीः
    ॥ ओ न्नमो भगवते॑ रुद्रा॒य । गं ओम् । पश्चिमदिग्भागे वरुणाय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ॐ वँम् । आ नो॑
    नि॒युद्भिः॑ श॒तिनी॑भिरध्व॒रग्म् । स॑ह॒स्रिणी॑भि॒रुप॑ याहि य॒ज्ञम् । वायो॑ अ॒स्मिन् ह॒विषि॑ मादयस्व
    । यू॒य न्नमो भगवते॑ रुद्रा॒य । वं ओम् । वायव्यदिग्भागे वायवे नमः ॥ म्भूर्भुव॒स्सुवः॑ । ओ न्तेम् ।
    व॒यग्ं सो॑म व्र॒ते तव॑ । मन॑स्त॒नूषु॒ बिभ्र॑तः । प्र॒जाव॑न्तो अशीमहि । इ॒न्द्रा॒णी दे॒वी सु॒भगा॑ सु॒पत्नी
    न्नमो भगवते॑ रुद्रा॒य । तें ओम् । उत्तरदिग्भागे कुबेराय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ॐ रुम् । तमीशा ञ्जग॑तस्त॒स्थुष॒स्पति
    ञ्जि॒न्वमव॑से हूमहे व॒यम् । पू॒षा नो॒ यथा॒ वेद॑सा॒मस॑द्वृ॒धे र॑क्षि॒ता पा॒युरद॑ब्ध न्नमो भगवते॑ रुद्रा॒य
    । रुं ओम् । ईशान्यदिग्भागे ईशानाय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ओ न्द्राम् । अ॒स्मे रु॒द्रा मे॒हना॒ पर्व॑तासो
    वृत्र॒हत्ये॒ भर॑हूतौ स॒जोषाः श्शंस॑ते स्तुव॒ते धायि॑ प॒ज्र इन्द्र॑ज्येष्ठा अ॒स्मां अ॑वन्तु दे॒वाः
    ॥ ओ न्नमो भगवते॑ रुद्रा॒य । द्रां ओम् । ऊर्ध्वदिग्भागे आकाशाय नमः ॥ म्भूर्भुव॒स्सुवः॑ । ॐ यँम् । स्यो॒ना
    पृ॑थिवि॒ भवा॑नृक्ष॒रा नि॒वेश॑नी । यच्छा॑ न॒ न्नमो भगवते॑ रुद्रा॒य । यं ओम् । अधोदिग्भागे पृथिव्यै
    नमः ॥
