id: nathastotram
category: stotram
name:
  english: nathastotram
  devanagari: नाथस्तोत्रम्
content:
  english: ca maya na shakyam | pragjanmanirmitashubhetarakarmana ya dbhagyagateh sudridhasanghatitah
    kavatah || 4|| anyani papashamanani sukhavahani karmani santyalamapekshitasadhanani | tesham vidhih
    patutarairapi yatnasadhyah kayam ka va vivashabhavamupagato'ham || 5|| tvadrupavarnanamaghantasukhaptihetuh
    pumsam bhavedbhuvi yathamativagvilasam | ityahuratavacasastadaham yatishye tatkartumatra mayi behi
    kripakataksham || 6|| natha tvadiyamakutadyutinirjito'sau shokatirekavahanena bhidelimatma | bhanorgabharitarupayati
    sahasratam yat tenabhidhiyata ihaisha sahastradhama || 7|| vishvamareshvaranirantarasannidhana sthanaraya
    hemamayabhumidharadhipasya | shashvatpradakshinamasau vidadhati bhanu va tvadujjvalakiritarucah pralobhat
    || 8|| pradyotanah pratidinam bhavatah kirita shutyagrahadvasuganan vitaran samantat | yattashviradasamavaptamanorathah
    sa nastam prayati khalu honavasuh kramena || 9|| atmavalokanavidhavadhikapramoda netreshu samvidadhata
    jagatamadhisha | tvanmaulina kathamanena tulamupaitu hakpidanam viracayannayamushnatejah || 10|| kaishyam
    satoyaghanadeshyamativa drishyam vishvesha te vijayate dhritasaurabham tat | yatrarpane sumanasamamaradramanam
    arthitvameti nivaho'rthishu dattakamah || 11|| antahsthita kutilata malinatmata ca doshaviti trijagati
    prathitaiva varta | ta eva te cikurabharagate gunau stah sute mahatphalamaho mahatam hi seva || 12||
    bhagirathim bhavashironilayam vilokya takpadam mahitamatmakrite'pi kartum | tvatpujanam vihitavatyupalabdhakama
    mitratmajeva tava bhati kacaliresha || 13|| mandarapushpamilito makutopanaddha manikyaratnakiranastaranabhiramah
    | candrarkarashminikaracchuritambuvaha cchayastvadiyacikuranakaro vibhati || 14|| phalena te bhuvanamohanamohanena
    balah shashi samatulamadhishedhumicchan | jatashirargala iti prathitakhilokyam ko vanucana janavadamanahakari
    || 15|| eva svrittarahitashca kalankavamshca yatum lalatasamatam mama vanchatiti | rosharatvaya mayi
    na karya itiva shamsan balah shashi sharanamashrayate padam te || 16|| yatte lalataphalake tilakam
    vibhati smartuh samastabhayahari ca hanihari | shakraimapattalikhitamalarupyarekha vidveshi manyasanametadapakarotu
    || 17|| brahmadayo'pi ca yadiyamahamahina sammohita nijanijadhikritau nibaddha | mayapi yancalanamatravashat
    svakarye sa galbhate jayati sa yugali bhruvoste || 18|| netrabhipurnakarunarasavicishobham abibhrati
    madanakarmukamatrika sa | bhruvallari vijayate jagatividhana sthanaprahanacatura caturakritiste ||
    19|| padkeruhani bhavadikshanasamyalesham | hatva punastadaparadhavimarjanaya | padmam bhavatpranayinimalamarthayitva
    nityam nijantaragriheshu nivasayanti || 20|| yatprahuraptavacaso mahatam hi drishte nom shatrubandhavabhidetyamrisha
    vacastat | cakshuh sarojayugali bhavatastatha hi karna gata ca vijayam ca gateyamarate || 21|| utkarshamipsu
    kumudadaravindajatam patradvayimupajahara manoharam te | adaya tamakurutha nijanetrayugmam tenaiti
    sarvavibudharcanayogyatam tat || 22|| arkatmakam bhavati dakshinamikshanam te vamam ca somamayamityamrisha
    vacastat | yasamprapatavashato hridi bhaktibhajam no va kadapyudayageti namo'nunapi || 23|| tapaprado
    dinakarastava dakshina hak bhutva samastajanatapamapakaroti | tadvajjadaprakritiroshadhipo'pi savya
    netratvametya jagatam jadatam dhunoti || 24|| nasa vibho tava vibhati tilaprasuna sunam ruca vidadhati
    ca samunnatapra | yasyah samam nijakatundamiti smarantah kira bhavanti bata panjarabandhayogyah ||
    25|| vaktrabhidhanasarasirahamandane te nasahvaye rucivirajini bijakoshe | cittambujam lasatu me bhagavannajalam
    yuktam sajatikamithahparimelanam syat || 26|| udbhidyamanatarupallavatulyakalyau oshthadharau tava
    varishthatarau vibhatah | yatpanayogyamatibhagyamupetya lakshmih shlaghya bhavatyakhilalokavilasinishu
    || 27|| deva tvadiyaradanacchadapallave'smin arunyametadadharikritabimbashobham | lakshmaya hridantaranirantaratotpatishnuh
    panaprasakta iva ragabharo vibhati || 28|| madhuryamipsuradharamritasambhavam te
  devanagari: च मया न शक्यम् । प्राग्जन्मनिर्मितशुभेतरकर्मणा य द्भाग्यागतेः सुदृढसङ्घटितः कवाटः ॥ ४॥ अन्यानि
    पापशमनानि सुखावहानि कर्माणि सन्त्यलमपेक्षितसाधनानि । तेषां विधिः पटुतरैरपि यत्नसाध्यः कायं क वा विवशभावमुपागतोऽहम्
    ॥ ५॥ त्वद्रूपवर्णनमघान्तसुखाप्तिहेतुः पुंसां भवेद्भुवि यथामतिवाग्विलासम् । इत्याहुरातवचसस्तदहं यतिष्ये
    तत्कर्तुमत्र मयि बेहि कृपाकटाक्षम् ॥ ६॥ नाथ त्वदीयमकुटद्युतिनिर्जितोऽसौ शोकातिरेकवहनेन भिदेलिमात्मा
    । भानोर्गभरितरुपयाति सहस्रतां यत् तेनाभिधीयत इहैष सहस्त्रधामा ॥ ७॥ विश्वामरेश्वरनिरन्तरसन्निधान स्थानरय
    हेममयभूमिधराधिपस्य । शश्वत्प्रदक्षिणमसौ विदधाति भानु व त्वदुज्ज्वलकिरीटरुचः प्रलोभात् ॥ ८॥ प्रद्योतनः
    प्रतिदिनं भवतः किरीट शुत्याग्रहाद्वसुगणान् वितरन् समन्तात् । यत्तश्विरादसमवाप्तमनोरथः स नस्तं प्रयाति
    खलु होनवसुः क्रमेण ॥ ९॥ आत्मावलोकनविधावधिकप्रमोद नेत्रेषु संविदधता जगतामधीश । त्वन्मौलिना कथमनेन तुलामुपैतु
    हक्पीडनं विरचयन्नयमुष्णतेजाः ॥ १०॥ कैश्यं सतोयघनदेश्यमतीव दृश्यं विश्वेश ते विजयते धृतसौरभं तत् ।
    यत्रार्पणे सुमनासाममरद्रमाणां अर्थित्वमेति निवहोऽर्थिषु दत्तकामः ॥ ११॥ अन्तःस्थिता कुटिलता मलिनात्मता
    च दोषाविति त्रिजगति प्रथितैव वार्ता । त एव ते चिकुरभारगते गुणौ स्तः सूते महत्फलमहो महतां हि सेवा ॥
    १२॥ भागीरथीं भवशिरोनिलयां विलोक्य ताक्पदं महितमात्मकृतेऽपि कर्तुम् । त्वत्पूजनं विहितवत्युपलब्धकामा
    मित्रात्मजेव तव भाति कचालिरेषा ॥ १३॥ मन्दारपुष्पमिलितो मकुटोपनद्ध माणिक्यरत्नकिरणास्तरणाभिरामः । चन्द्रार्करश्मिनिकरच्छुरिताम्बुवाह
    च्छायस्त्वदीयचिकुरणकरो विभाति ॥ १४॥ फालेन ते भुवनमोहनमोहनेन बालः शशी समतुलामधिशेढुमिच्छन् । जातशिरार्गल
    इति प्रथितखिलोक्यां को वानुचान जनवादमनहकारी ॥ १५॥ एव स्वृत्तरहितश्च कलङ्कवांश्च यातुं ललाटसमतां मम
    वाञ्छतीति । रोषरत्वया मयि न कार्य इतीव शंसन् बालः शशी शरणमाश्रयते पदं ते ॥ १६॥ यत्ते ललाटफलके तिलकं
    विभाति स्मर्तुः समस्तभयहारि च हानिहारि । शक्राइमपट्टलिखितामलरूप्यरेखा विद्वेषि मन्यसनमेतदपाकरोतु ॥
    १७॥ ब्रह्मादयोऽपि च यदीयमहामहिना सम्मोहिता निजनिजाधिकृतौ निबद्धा । मायापि यञ्चलनमात्रवशात् स्वकार्ये
    सा गल्भते जयति सा युगली भ्रुवोस्ते ॥ १८॥ नेत्राभिपूर्णकरुणारसवीचिशोभां आबिभ्रती मदनकार्मुकमातृका सा
    । भ्रूवल्लरी विजयते जगतीविधान स्थानप्रहाणचतुरा चतुराकृतिस्ते ॥ १९॥ पड्केरुहाणि भवदीक्षणसाम्यलेशम्
    । हत्वा पुनस्तदपराधविमार्जनाय । पद्मां भवत्प्रणयिनीमलमर्थयित्वा नित्यं निजान्तरगृहेषु निवासयन्ति ॥
    २०॥ यत्प्राहुराप्तवचसो महतां हि दृष्टे नों शत्रुबान्धवभिदेत्यमृषा वचस्तत् । चक्षुः सरोजयुगली भवतस्तथा
    हि कर्ण गता च विजयं च गतेयमारते ॥ २१॥ उत्कर्षमीप्सु कुमुदादरविन्दजातं पत्रद्वयीमुपजहार मनोहरां ते
    । आदाय तामकुरुथा निजनेत्रयुग्मं तेनैति सर्वविबुधार्चनयोग्यतां तत् ॥ २२॥ अर्कात्मकं भवति दक्षिणमीक्षणं
    ते वामं च सोममयमित्यमृषा वचस्तत् । यसम्प्रपातवशतो हृदि भक्तिभाजां नो वा कदाप्युदयगेति नमोऽणुनापि ॥
    २३॥ तापप्रदो दिनकरस्तव दक्षिणा हक् भूत्वा समस्तजनतापमपाकरोति । तद्वज्जडप्रकृतिरोषधिपोऽपि सव्य नेत्रत्वमेत्य
    जगतां जडतां धुनोति ॥ २४॥ नासा विभो तव विभाति तिलप्रसून सूनं रुचा विदधती च समुन्नताप्रा । यस्याः समं
    निजकतुण्डमिति स्मरन्तः कीरा भवन्ति बत पञ्जरबन्धयोग्याः ॥ २५॥ वक्त्राभिधानसरसीरहमण्डने ते नासाह्वये
    रुचिविराजिनि बीजकोशे । चित्ताम्बुजं लसतु मे भगवन्नजलं युक्तं सजातिकमिथःपरिमेलनं स्यात् ॥ २६॥ उद्भिद्यमानतरुपल्लवतुल्यकल्यौ
    ओष्ठाधरौ तव वरिष्ठतरौ विभातः । यत्पानयोग्यमतिभाग्यमुपेत्य लक्ष्मीः श्लाघ्या भवत्यखिललोकविलासिनीषु
    ॥ २७॥ देव त्वदीयरदनच्छदपल्लवेऽस्मिन् आरुण्यमेतदधरीकृतबिम्बशोभम् । लक्ष्मया हृदन्तरनिरन्तरतोत्पतिष्णुः
    पानप्रसक्त इव रागभरो विभाति ॥ २८॥ माधुर्यमीप्सुरधरामृतसम्भवं ते
