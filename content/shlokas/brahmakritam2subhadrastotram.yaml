id: brahmakritam2subhadrastotram
category: stotram
name:
  english: brahmakritam2subhadrastotram
  devanagari: ब्रह्मकृतं२सुभद्रास्तोत्रम्
content:
  english: brahmakritam 2 subhadrastotram jaya devi jaganmatah prasida parameshvari || 52|| karyakaranakartri
    tvam sarvashaktyai namo'stu te | sarvasya hridi samvishte jnanamohatmike sada || 53|| kaivalyamuktide
    bhadre tvam namami suraranim | devi tvam vishnumayasi mohayanti caracaram || 54|| hritpadmasanasamsthasi
    vishnubhavanusarini | tvameva lakshmirgauri ca shaci katyayani tatha || 55|| yacca kincitkvacidvastu
    sadasadvakhilatmike | tasya sarvasya shaktistvam stotum tvam kastu shaktiman || 56|| jaya bhadre subhadre
    tvam sarvesham bhadradayini | bhadrabhadrasvarupe tvam bhadrakali namo'stu te || 57|| tvam mata jagatam
    devi pita narayano hi sah | strirupam tvam sarvameva pumrupo jagadishvarah || 58|| yuvayorna hi bhedo'sti
    nastyanyatparameva hi | yatha vayam niyukta hi tvaya vai vishnumayaya || 59|| nideshakarino nityam
    bhramamah parameshvari | vrittih pravrittih parama kshudha nidra tvameva ca || 2
  devanagari: ब्रह्मकृतं २ सुभद्रास्तोत्रम् जय देवि जगन्मातः प्रसीद परमेश्वरि ॥ ५२॥ कार्यकारणकर्त्री त्वं
    सर्वशक्त्यै नमोऽस्तु ते । सर्वस्य हृदि संविष्टे ज्ञानमोहात्मिके सदा ॥ ५३॥ कैवल्यमुक्तिदे भद्रे त्वां
    नमामि सुरारणिम् । देवि त्वं विष्णुमायासि मोहयन्ती चराचरम् ॥ ५४॥ हृत्पद्मासनसंस्थासि विष्णुभावानुसारिणी
    । त्वमेव लक्ष्मीर्गौरी च शची कात्यायनी तथा ॥ ५५॥ यच्च किञ्चित्क्वचिद्वस्तु सदसद्वाखिलात्मिके । तस्य
    सर्वस्य शक्तिस्त्वं स्तोतुं त्वां कस्तु शक्तिमान् ॥ ५६॥ जय भद्रे सुभद्रे त्वं सर्वेषां भद्रदायिनि
    । भद्राभद्रस्वरूपे त्वं भद्रकालि नमोऽस्तु ते ॥ ५७॥ त्वं माता जगतां देवि पिता नारायणो हि सः । स्त्रीरूपं
    त्वं सर्वमेव पुंरूपो जगदीश्वरः ॥ ५८॥ युवयोर्न हि भेदोऽस्ति नास्त्यन्यत्परमेव हि । यथा वयं नियुक्ता
    हि त्वया वै विष्णुमायया ॥ ५९॥ निदेशकारिणो नित्यं भ्रमामः परमेश्वरि । वृत्तिः प्रवृत्तिः परमा क्षुधा
    निद्रा त्वमेव च ॥ २
