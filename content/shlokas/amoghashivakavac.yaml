id: amoghashivakavac
category: kavacha
name:
  english: amoghashivakavac
  devanagari: अमोघशिवकवच्
content:
  english: om namo bhagavate jvalajjvalamaline om hrim ram sarvashaktidhamne ishanatmane hridayaya namah
    | om namo bhagavate jvalajjvalamaline om nam rim nityatriptidhamne tatpurushatmane shirase svaha |
    om namo bhagavate jvalajjvalamaline om mam rum anadishaktidhamne aghoratmane shikhayai vashat | om
    namo bhagavate jvalajjvalamaline om shim raim svatantrashaktidhamne vamadevatmane kavacaya hum | om
    namo bhagavate jvalajjvalamaline om vam raum aluptashaktidhamne sadyojatatmane netratrayaya vaushat
    | om namo bhagavate jvalajjvalamaline om yam rah anadishaktidhamne sarvatmane astraya phat || atha
    dhyanam vajradamshtram trinayanam kalakanthamarindamam | sahasrakaramapyugram vande shambhumumapatim
    || rudrakshakankanalasatkaradandayugmah palantaralasitabhasmadhritatripundrah | pancaksharam paripathan
    varamantrarajam dhyayan sada pashupatim sharanam vrajethah || atah param sarvapuranaguhyam nihsheshapapaughaharam
    pavitram | jayapradam sarvavipatpramocanam vakshyami shaivam kavacam hitaya te || || atha kavacam
    || rishabha uvaca | namaskritya mahadevam vishvavyapinamishvaram | vakshye shivamayam varma sarvarakshakaram
    nrinam || 1|| shucau deshe samasino yathavatkalpitasanah | jitendriyo jitapranashcintayecchivamavyam
    || 2|| hritpundarikantarasamnivishtam svatejasa vyaptanabho'vakasham | atindriyam sukshmamanantamadyam
    dhyayetparanandamayam mahesham || 3|| dhyanavadhutakhilakarmabandhashciram cidandanimagnacetah | shadaksharanyasasamahitatma
    shaivena kuryatkavacena raksham || 4|| mam patu devo'khiladevatatma samsarakupe patitam gabhire |
    tannama divyam varamantramulam dhunotu me sarvamagham hridistham || 5|| sarvatra mam rakshatu vishvamurtirjyotirmayanandaghanashcidatma
    | anoraniyanurushaktirekah sa ishvarah patu bhayadasheshat || 6|| yo bhusvarupena bibharti vishvam
    payatsa bhumergirisho'shtamurtih | yo'pam svarupena nrinam karoti sanjivanam so'vatu mam jalebhyah
    || 7|| kalpavasane bhuvanani dagdhva sarvani yo nrityati bhurililah | sa kalarudro'vatu mam davagnervatyadibhiterakhilacca
    tapat || 8|| pradiptavidyutkanakavabhaso vidyavarabhitikutharapanih | caturmukhastatpurushastrinetrah
    pracyam sthitam rakshatu mamajastram || 9|| kutharavedankushapashashulakapaladhakkakshagunandadhanah
    | caturmukho nilarucistrinetrah payadaghoro dishi dakshinasyam || 10|| kundendushankhasphatikavabhaso
    vedakshamalavaradabhayankah | tryakshashcaturvaktra uruprabhavah sadyo'dhijato'vatu mam praticyam
    || 11|| varakshamalabhayatankahastah sarojakinjalkasamanavarnah | trilocanashcarucaturmukho mam payadudicyam
    dishi vamadevah || 12|| vedabhayeshtankushatankapashakapaladhakkakshashulapanih | pashatanka sitadyutih
    pancamukho'vatanmamishana urdhvam paramaprakashah || 13|| murdhanamavyanmama candramaulirbhalam mamavyadatha
    bhalanetrah | netre mamavyadbhaganetrahari nasam sada rakshatu vishvanathah || 14|| payacchruti me
    shrutigitakirtih kapolamavyatsatatam kapali | vaktram sada rakshatu pancavaktro jihvam sada rakshatu
    vedajihvah || 15|| kantham girisho'vatu nilakanthah panidvayam patu pinakapanih | dormulamavyanmama
    dharmabahurvakshahsthalam dakshamakhantako'vyat || 16|| mamodaram patu girindradhanva madhyam mamavyanmadanantakari
    | herambatato mama patu nabhim payatkati dhurjatirishvaro me || 17|| urudvayam patu kuberamitro janudvayam
    me jagadishvaro'vyat | janghayugam pungavaketuravyatpadau mamavyatsuravandyapadah || 18|| maheshvarah
    patu dinadiyame mam madhyayame'vatu vamadevah | triyambakah patu tritiyayame vrishadhvajah patu dinantyayame
    || 19|| payannishadau shashishekharo mam gangadharo rakshatu mam nishithe | gauripatih patu nishavasane
    mrityunjayo rakshatu sarvakalam || 20|| antahsthitam rakshatu shankaro mam sthanuh sada patu bahihsthitam
    mam | tadantare patu patih pashunam sadashivo rakshatu mam samantat || 21|| tishthantamavyadbhuvanaikanathah
    payadvrajantam pramathadhinathah | vedantavedyo'vatu mannishannam mamavyayah patu shivah shayanam
    || 22|| margeshu mam rakshatu nilakanthah shailadidurgeshu puratrayarih | aranyavasadimahapravase
    payanmrigavyadha udarashaktih || 23|| kalpantakatopapatuprakopah sphutattahasoccalitandakoshah | ghorarisenarnavadurnivaramahabhayadrakshatu
    virabhadrah || 24|| pattyashvamatangaghatavaruthasahasralakshayutakotibhishanam | akshauhininam shatamatatayinam
    chindyanmrido ghorakutharadharaya || 25|| nihantu dasyunpralayanalarcirjvalattrishulam tripurantakasya
    | shardulasimharkshavrikadihimstransantrasayatvishadhanuh pinakam || 26|| duhsvapnaduhshakunadurgatidaurmanasyadurbhikshadurvyasa
    naduhsahaduryashamsi | utpatatapavishabhitimasadgrahartivyadhimshca nashayatu me jagatamadhishah ||
    27|| om namo bhagavate sadashivaya sakalatattvatmakaya sakalatattvaviharaya sakalalokaikakartre sakalalokaikabhartre
    sakalalokakaikahartre sakalalokakaikagurave sakalalokaikasakshine sakalanigamaguhyaya sakalavarapradaya
    sakaladuritartibhanjanaya sakalajagadabhayankaraya sakalalokaikashankaraya shashankashekharaya shashvatanijabhasaya
    nirgunaya nirupamaya nirupaya nirabhasaya niramamaya nishprapancaya nishkalankaya nirdvandvaya nihsangaya
    nirmalaya nirgamaya nityarupavibhavaya nirupamavibhavaya niradharaya nityashuddhabuddhaparipurnasaccidanandadvayaya
    paramashantaprakashatejorupaya jayajaya maharudra maharaudra bhadravatara duhkhadavadarana mahabhairava
    kalabhairava kalpantabhairava kapalamaladhara khatvangakhadgacarmapashankushadamarushulacapabanagadashaktibhindipala
  devanagari: ॐ नमो भगवते ज्वलज्ज्वालामालिने ॐ ह्रीं रां सर्वशक्तिधाम्ने ईशानात्मने हृदयाय नमः । ॐ नमो
    भगवते ज्वलज्ज्वालामालिने ॐ नं रीं नित्यतृप्तिधाम्ने तत्पुरुषात्मने शिरसे स्वाहा । ॐ नमो भगवते ज्वलज्ज्वालामालिने
    ॐ मं रूं अनादिशक्तिधाम्ने अघोरात्मने शिखायै वषट् । ॐ नमो भगवते ज्वलज्ज्वालामालिने ॐ शिं रैं स्वतन्त्रशक्तिधाम्ने
    वामदेवात्मने कवचाय हुम् । ॐ नमो भगवते ज्वलज्ज्वालामालिने ॐ वां रौं अलुप्तशक्तिधाम्ने सद्योजातात्मने
    नेत्रत्रयाय वौषट् । ॐ नमो भगवते ज्वलज्ज्वालामालिने ॐ यं रः अनादिशक्तिधाम्ने सर्वात्मने अस्त्राय फट्
    ॥ अथ ध्यानम् वज्रदंष्ट्रं त्रिनयनं कालकण्ठमरिन्दमम् । सहस्रकरमप्युग्रं वन्दे शम्भुमुमापतिम् ॥ रुद्राक्षकङ्कणलसत्करदण्डयुग्मः
    पालान्तरालसितभस्मधृतत्रिपुण्ड्रः । पञ्चाक्षरं परिपठन् वरमन्त्रराजं ध्यायन् सदा पशुपतिं शरणं व्रजेथाः
    ॥ अतः परं सर्वपुराणगुह्यं निःशेषपापौघहरं पवित्रम् । जयप्रदं सर्वविपत्प्रमोचनं वक्ष्यामि शैवं कवचं
    हिताय ते ॥ ॥ अथ कवचम् ॥ ऋषभ उवाच । नमस्कृत्य महादेवं विश्वव्यापिनमीश्वरम् । वक्ष्ये शिवमयं वर्म सर्वरक्षाकरं
    नृणाम् ॥ १॥ शुचौ देशे समासीनो यथावत्कल्पितासनः । जितेन्द्रियो जितप्राणश्चिन्तयेच्छिवमव्यम् ॥ २॥ हृत्पुण्डरीकान्तरसंनिविष्टं
    स्वतेजसा व्याप्तनभोऽवकाशम् । अतीन्द्रियं सूक्ष्ममनन्तमाद्यं ध्यायेत्परानन्दमयं महेशम् ॥ ३॥ ध्यानावधूताखिलकर्मबन्धश्चिरं
    चिदान्दनिमग्नचेताः । षडक्षरन्याससमाहितात्मा शैवेन कुर्यात्कवचेन रक्षाम् ॥ ४॥ मां पातु देवोऽखिलदेवतात्मा
    संसारकूपे पतितं गभीरे । तन्नाम दिव्यं वरमन्त्रमूलं धुनोतु मे सर्वमघं हृदिस्थम् ॥ ५॥ सर्वत्र मां रक्षतु
    विश्वमूर्तिर्ज्योतिर्मयानन्दघनश्चिदात्मा । अणोरणीयानुरुशक्तिरेकः स ईश्वरः पातु भयादशेषात् ॥ ६॥ यो
    भूस्वरूपेण बिभर्ति विश्वं पायात्स भूमेर्गिरिशोऽष्टमूर्तिः । योऽपां स्वरूपेण नृणां करोति सञ्जीवनं सोऽवतु
    मां जलेभ्यः ॥ ७॥ कल्पावसाने भुवनानि दग्ध्वा सर्वाणि यो नृत्यति भूरिलीलः । स कालरुद्रोऽवतु मां दवाग्नेर्वात्यादिभीतेरखिलाच्च
    तापात् ॥ ८॥ प्रदीप्तविद्युत्कनकावभासो विद्यावराभीतिकुठारपाणिः । चतुर्मुखस्तत्पुरुषस्त्रिनेत्रः प्राच्यां
    स्थितं रक्षतु मामजस्त्रम् ॥ ९॥ कुठारवेदाङ्कुशपाशशूलकपालढक्काक्षगुणान्दधानः । चतुर्मुखो नीलरुचिस्त्रिनेत्रः
    पायादघोरो दिशि दक्षिणस्याम् ॥ १०॥ कुन्देन्दुशङ्खस्फटिकावभासो वेदाक्षमालावरदाभयाङ्कः । त्र्यक्षश्चतुर्वक्त्र
    उरुप्रभावः सद्योऽधिजातोऽवतु मां प्रतीच्याम् ॥ ११॥ वराक्षमालाभयटङ्कहस्तः सरोजकिञ्जल्कसमानवर्णः । त्रिलोचनश्चारुचतुर्मुखो
    मां पायादुदिच्यां दिशि वामदेवः ॥ १२॥ वेदाभयेष्टाङ्कुशटङ्कपाशकपालढक्काक्षशूलपाणिः । पाशटङ्क सितद्युतिः
    पञ्चमुखोऽवतान्मामीशान ऊर्ध्वं परमप्रकाशः ॥ १३॥ मूर्धानमव्यान्मम चन्द्रमौलिर्भालं ममाव्यादथ भालनेत्रः
    । नेत्रे ममाव्याद्भगनेत्रहारी नासां सदा रक्षतु विश्वनाथः ॥ १४॥ पायाच्छ्रुती मे श्रुतिगीतकीर्तिः कपोलमव्यात्सततं
    कपाली । वक्त्रं सदा रक्षतु पञ्चवक्त्रो जिह्वां सदा रक्षतु वेदजिह्वः ॥ १५॥ कण्ठं गिरीशोऽवतु नीलकण्ठः
    पाणिद्वयं पातु पिनाकपाणिः । दोर्मूलमव्यान्मम धर्मबाहुर्वक्षःस्थलं दक्षमखान्तकोऽव्यात् ॥ १६॥ ममोदरं
    पातु गिरीन्द्रधन्वा मध्यं ममाव्यान्मदनान्तकारी । हेरम्बतातो मम पातु नाभिं पायात्कटी धूर्जटिरीश्वरो
    मे ॥ १७॥ ऊरुद्वयं पातु कुबेरमित्रो जानुद्वयं मे जगदीश्वरोऽव्यात् । जङ्घायुगं पुङ्गवकेतुरव्यात्पादौ
    ममाव्यात्सुरवन्द्यपादः ॥ १८॥ महेश्वरः पातु दिनादियामे मां मध्ययामेऽवतु वामदेवः । त्रियम्बकः पातु तृतीययामे
    वृषध्वजः पातु दिनान्त्ययामे ॥ १९॥ पायान्निशादौ शशिशेखरो मां गङ्गाधरो रक्षतु मां निशीथे । गौरीपतिः
    पातु निशावसाने मृत्युञ्जयो रक्षतु सर्वकालम् ॥ २०॥ अन्तःस्थितं रक्षतु शङ्करो मां स्थाणुः सदा पातु बहिःस्थितं
    माम् । तदन्तरे पातु पतिः पशूनां सदाशिवो रक्षतु मां समन्तात् ॥ २१॥ तिष्ठन्तमव्याद्भुवनैकनाथः पायाद्व्रजन्तं
    प्रमथाधिनाथः । वेदान्तवेद्योऽवतु मान्निषण्णं मामव्ययः पातु शिवः शयानम् ॥ २२॥ मार्गेषु मां रक्षतु नीलकण्ठः
    शैलादिदुर्गेषु पुरत्रयारिः । अरण्यवासादिमहाप्रवासे पायान्मृगव्याध उदारशक्तिः ॥ २३॥ कल्पान्तकाटोपपटुप्रकोपः
    स्फुटाट्टहासोच्चलिताण्डकोशः । घोरारिसेनार्णवदुर्निवारमहाभयाद्रक्षतु वीरभद्रः ॥ २४॥ पत्त्यश्वमातङ्गघटावरूथसहस्रलक्षायुतकोटिभीषणम्
    । अक्षौहिणीनां शतमाततायिनां छिन्द्यान्मृडो घोरकुठारधारया ॥ २५॥ निहन्तु दस्यून्प्रलयानलार्चिर्ज्वलत्त्रिशूलं
    त्रिपुरान्तकस्य । शार्दूलसिंहर्क्षवृकादिहिंस्त्रान्सन्त्रासयत्वीशधनुः पिनाकम् ॥ २६॥ दुःस्वप्नदुःशकुनदुर्गतिदौर्मनस्यदुर्भिक्षदुर्व्यस
    नदुःसहदुर्यशांसि । उत्पाततापविषभीतिमसद्ग्रहार्तिव्याधींश्च नाशयतु मे जगतामधीशः ॥ २७॥ ॐ नमो भगवते सदाशिवाय
    सकलतत्त्वात्मकाय सकलतत्त्वविहाराय सकललोकैककर्त्रे सकललोकैकभर्त्रे सकललोककैकहर्त्रे सकललोककैकगुरवे
    सकललोकैकसाक्षिणे सकलनिगमगुह्याय सकलवरप्रदाय सकलदुरितार्तिभञ्जनाय सकलजगदभयङ्काराय सकललोकैकशङ्कराय शशाङ्कशेखराय
    शाश्वतनिजाभासाय निर्गुणाय निरुपमाय नीरूपाय निराभासाय निराममाय निष्प्रपञ्चाय निष्कलङ्काय निर्द्वन्द्वाय
    निःसङ्गाय निर्मलाय निर्गमाय नित्यरूपविभवाय निरुपमविभवाय निराधाराय नित्यशुद्धबुद्धपरिपूर्णसच्चिदानन्दाद्वयाय
    परमशान्तप्रकाशतेजोरूपाय जयजय महारुद्र महारौद्र भद्रावतार दुःखदावदारण महाभैरव कालभैरव कल्पान्तभैरव
    कपालमालाधर खट्वाङ्गखड्गचर्मपाशाङ्कुशडमरुशूलचापबाणगदाशक्तिभिण्डिपाल
