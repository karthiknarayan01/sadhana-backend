id: mantra-matruka-pushpa-mala-stava
category: stotram
name:
  english: Mantra Matruka Pushpa Mala Stava
  devanagari: मन्त्रमातृकापुष्पमालास्तवः
content:
  english: mantramatrikapushpamalastavah shankaracaryah 1910 mantramatrikapushpamalastavah shankaracaryah
    1910 || shrih|| || mantramatrikapushpamalastavah || kallolollasitamritabdhilaharimadhye virajanmani
    dvipe kalpakavatikaparivrite kadambavatyujjvale | ratnastambhasahasranirmitasabhamadhye vimanottame
    cintaratnavinirmitam janani te simhasanam bhavaye || 1|| enankanalabhanumandalalasacchricakramadhye
    sthitam balarkadyutibhasuram karatalaih pashankushau bibhratim | capam banamapi prasannavadanam kausumbhavastranvitam
    tam tvam candrakalavatamsamakutam carusmitam bhavaye ||2|| ishanadipadam shivaikaphaladam ratnasanam
    te shubham padyam kunkumacandanadibharitairarghyam saratnakshataih | shuddhairacamaniyakam tava jalairbhaktya
    maya kalpitam karunyamritavaridhe tadakhilam samtushtaye kalpatam || 3 || lakshye yogijanasya rakshitajagajjale
    vishalekshane praleyambupatirakunkumalasatkarpuramishrodakaih | gokshirairapi narikelasalilaih shuddhodakairmantritaih
    snanam devi dhiya mayaitadakhilam samtushtaye kalpatam || 4 || himkarankitamantralakshitatano hemacalasamcitaih
    ratnairujjvalamuttariyasahitam kausumbhavarnamshukam | muktasamtatiyajnasutramamalam sauvarnatantudbhavam
    dattam devi dhiya mayaitadakhilam samtushtaye kalpatam || 5 || hamsairapyatilobhaniyagamane haravalimujjvalam
    hindoladyutihirapuritatare hemangade kankane | manjirau manikundale makutamapyardhenducudamanim nasamauktikamanguliyakatakau
    kancimapi svikuru || 6 || sarvange dhanasarakunkumaghanashrigandhapankankitam kasturitilakam ca phalaphalake
    gorocanapatrakam | gandadarshanamandale nayanayordivyanjanam te'ncitam kanthabje mriganabhipankamamalam
    tvatpritaye kalpatam ||7|| kalharotpalamallikamaruvakaih sauvarnapankeruhai rjaticampakamalativakulakairmandarakundadibhih
    | ketakya karavirakairbahuvidhaih kliptah srajo malikah samkalpena samarpayami varade samtushtaye
    grihyatam || 8|| hantaram madanasya nandayasi yairangairanangojjvalai ryairbhringavalinilakuntalabharairbadhnasi
    tasyashayam | tanimani tavamba komalataranyamodalilagriha nyamodaya dashangaguggulughritadhupairaham
    dhupaye || 9 || lakshmimujjvalayami ratnanivahoddhasvattare mandire malarupavilambitairmanimayastambheshu
    sambhavitaih | citrairhatakaputrikakaradhritairgavyairghritairvadhitai rdivyairdipaganairdhiya girisute
    samtushtaye kalpatam || 10 || hrimkareshvari taptahatakakritaih sthalisahasrairbhritam divyannam ghritasupashakabharitam
    cinnannabhedam tatha | dugdhannam madhusharkaradadhiyutam manikyapatre sthitam mashapupasahasramamba
    saphalam naivedyamavedaye || 11 || sacchayairvaraketakidalaruca tambulavallidalaih pugairbhurigunaih
    sugandhimadhuraih karpurakhandojjvalaih | muktacurnavirajitairbahuvidhairvaktrambujamodanaih purna
    ratnakalacika tava mude nyasta purastadume ||12|| kanyabhi kamaniyakantibhiralamkaramalarartika patre
    mauktikacitrapankitivilasatkarpuradipalibhih | tattattalamridangagitasahitam nrityatpadambhoruham
    mantraradhanapurvakam suvihitam nirajanam grihyatam || 13 || lakshmirmauktikalakshakalpitasitacchatram
    tu dhatte rasa dindrani ca ratishca camaravare dhatte svayam bharati| vinamenavilocana sumanasam nrityanti
    tadragava dbhavairangikasattvikaih sphutarasam matastadakarnyatam || 14 || hrimkaratrayasamputena
    manunopasye trayimaulibhi rvakyairlakshyatano tava stutividhau ko va kshametambike | sallapa stutayah
    pradakshinashatam samcara evastu te samvesho namasa sahasramakhilam tvatpritaye kalpatam || 15 ||
    shrimantraksharamalaya girisutam yah pujayeccetasa samdhyasu prativasaram suniyatastasyamalam syanmanah
    | cittambhoruhamantape girisuta nrittam vidhatte rasa dvani vakrasaroruhe jaladhija gehe jaganmangala
    || 16 || iti girivaraputripadarajivabhusha bhuvanamamalayanti suktisaurabhyasaraih | shivapadamakarandasyandiniyam
    nibaddha madayatu kavibhringanmatrikapushpamala || 17 || iti shrimatparamahamsaparivrajakacaryastha
    shrigovindabhagavatpujyapadashishyasya shrimacchamkarabhagavatah kritau mantramatrikapushpamalastavah
    sampurnah ||
  devanagari: मन्त्रमातृकापुष्पमालास्तवः शङ्कराचार्यः १९१० मन्त्रमातृकापुष्पमालास्तवः शङ्कराचार्यः १९१०
    ।। श्रीः॥ ॥ मन्त्रमातृकापुष्पमालास्तवः ॥ कल्लोलोल्लसितामृताब्धिलहरीमध्ये विराजन्मणि द्वीपे कल्पकवाटिकापरिवृते
    कादम्बवाट्युज्ज्वले । रत्नस्तम्भसहस्रनिर्मितसभामध्ये विमानोत्तमे चिन्तारत्नविनिर्मितं जननि ते सिंहासनं
    भावये ।। १॥ एणाङ्कानलभानुमण्डललसच्छ्रीचक्रमध्ये स्थितां बालार्कद्युतिभासुरां करतलैः पाशाङ्कुशौ बिभ्रतीम्
    । चापं बाणमपि प्रसन्नवदनां कौसुम्भवस्त्रान्वितां तां त्वां चन्द्रकलावतंसमकुटां चारुस्मितां भावये ॥२॥
    ईशानादिपदं शिवैकफलदं रत्नासनं ते शुभं पाद्यं कुङ्कुमचन्दनादिभरितैरर्घ्यं सरत्नाक्षतैः । शुद्धैराचमनीयकं
    तव जलैर्भक्त्या मया कल्पितं कारुण्यामृतवारिधे तदखिलं संतुष्टये कल्पताम् ।। ३ ।। लक्ष्ये योगिजनस्य
    रक्षितजगज्जाले विशालेक्षणे प्रालेयाम्बुपटीरकुङ्कुमलसत्कर्पूरमिश्रोदकैः । गोक्षीरैरपि नारिकेलसलिलैः
    शुद्धोदकैर्मन्त्रितैः स्नानं देवि धिया मयैतदखिलं संतुष्टये कल्पताम् ॥ ४ ॥ हींकाराङ्कितमन्त्रलक्षिततनो
    हेमाचलासंचितैः रत्नैरुज्ज्वलमुत्तरीयसहितं कौसुम्भवर्णांशुकम् । मुक्तासंततियज्ञसूत्रममलं सौवर्णतन्तूद्भवं
    दत्तं देवि धिया मयैतदखिलं संतुष्टये कल्पताम् ॥ ५ ॥ हंसैरप्यतिलोभनीयगमने हारावलीमुज्ज्वलां हिन्दोलद्युतिहीरपूरिततरे
    हेमाङ्गदे कङ्कणे । मञ्जीरौ मणिकुण्डले मकुटमप्यर्धेन्दुचूडामणिं नासामौक्तिकमङ्गुलीयकटकौ काञ्चीमपि स्वीकुरु
    ॥ ६ ॥ सर्वाङ्गे धनसारकुङ्कुमघनश्रीगन्धपङ्काङ्कितं कस्तूरीतिलकं च फालफलके गोरोचनापत्रकम् । गण्डादर्शनमण्डले
    नयनयोर्दिव्याञ्जनं तेऽञ्चितं कण्ठाब्जे मृगनाभिपङ्कममलं त्वत्प्रीतये कल्पताम् ॥७॥ कल्हारोत्पलमल्लिकामरुवकैः
    सौवर्णपङ्केरुहै र्जातीचम्पकमालतीवकुलकैर्मन्दारकुन्दादिभिः । केतक्या करवीरकैर्बहुविधैः क्ऌप्ताः स्रजो
    मालिकाः संकल्पेन समर्पयामि वरदे संतुष्टये गृह्यताम् ।। ८॥ हन्तारं मदनस्य नन्दयसि यैरङ्गैरनङ्गोज्ज्वलै
    र्यैर्भृङ्गावलिनीलकुन्तलभरैर्बध्नासि तस्याशयम् । तानीमानि तवाम्ब कोमलतराण्यामोदलीलागृहा ण्यामोदाय
    दशाङ्गगुग्गुलुघृतधूपैरहं धूपये ।। ९ ।। लक्ष्मीमुज्ज्वलयामि रत्ननिवहोद्धास्वत्तरे मन्दिरे मालारूपविलम्बितैर्मणिमयस्तम्भेषु
    संभावितैः । चित्रैर्हाटकपुत्रिकाकरधृतैर्गव्यैर्घृतैर्वधितै र्दिव्यैर्दीपगणैर्धिया गिरिसुते संतुष्टये
    कल्पताम् ।। १० ॥ ह्रींकारेश्वरि तप्तहाटककृतैः स्थालीसहस्रैर्भृतं दिव्यान्नं घृतसूपशाकभरितं चिन्नान्नभेदं
    तथा । दुग्धान्नं मधुशर्करादधियुतं माणिक्यपात्रे स्थितं माषापूपसहस्रमम्ब सफलं नैवेद्यमावेदये ॥ ११ ॥
    सच्छायैर्वरकेतकीदलरुचा ताम्बूलवल्लीदलैः पूगैर्भूरिगुणैः सुगन्धिमधुरैः कर्पूरखण्डोज्ज्वलैः । मुक्ताचूर्णविराजितैर्बहुविधैर्वक्त्राम्बुजामोदनैः
    पूर्णा रत्नकलाचिका तव मुदे न्यस्ता पुरस्तादुमे ॥१२॥ कन्याभि कमनीयकान्तिभिरलंकारामलारार्तिका पात्रे
    मौक्तिकचित्रपङ्कि्तिविलसत्कर्पूरदीपालिभिः । तत्तत्तालमृदङ्गगीतसहितं नृत्यत्पदाम्भोरुहं मन्त्राराधनपूर्वकं
    सुविहितं नीराजनं गृह्यताम् ।। १३ ॥ लक्ष्मीर्मौक्तिकलक्षकल्पितसितच्छत्रं तु धत्ते रसा दिन्द्राणी च
    रतिश्च चामरवरे धत्ते स्वयं भारती। वीणामेणविलोचना सुमनसां नृत्यन्ति तद्रागव द्भावैराङ्गिकसात्त्विकैः
    स्फुटरसं मातस्तदाकर्ण्यताम् ।। १४ ॥ ह्रींकारत्रयसंपुटेन मनुनोपास्ये त्रयीमौलिभि र्वाक्यैर्लक्ष्यतनो
    तव स्तुतिविधौ को वा क्षमेताम्बिके । सल्लापा स्तुतयः प्रदक्षिणशतं संचार एवास्तु ते संवेशो नमस सहस्रमखिलं
    त्वत्प्रीतये कल्पताम् ॥ १५ ॥ श्रीमन्त्राक्षरमालया गिरिसुतां यः पूजयेच्चेतसा संध्यासु प्रतिवासरं सुनियतस्तस्यामलं
    स्यान्मनः । चित्ताम्भोरुहमण्टपे गिरिसुता नृत्तं विधत्ते रसा द्वाणी वक्रसरोरुहे जलधिजा गेहे जगन्मङ्गला
    ॥ १६ ॥ इति गिरिवरपुत्रीपादराजीवभूषा भुवनममलयन्ती सूक्तिसौरभ्यसारैः । शिवपदमकरन्दस्यन्दिनीयं निबद्धा
    मदयतु कविभृङ्गान्मातृकापुष्पमाला ॥ १७ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्थ श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य
    श्रीमच्छंकरभगवतः कृतौ मन्त्रमातृकापुष्पमालास्तवः संपूर्णः ॥
