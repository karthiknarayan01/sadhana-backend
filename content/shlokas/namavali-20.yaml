id: namavali-20
category: stotram
name:
  english: namavali
  devanagari: नामावली
content:
  english: dharmanandanamaham vicintaye || om shrikrishnaya namah | om shrivasudevaya namah | om shrinaranarayanaya
    namah | om shriprabhave namah | om shribhaktidharmatmajaya namah | om shriajanmane namah | om shrikrishnaya
    namah | om shrinarayanaya namah | om shriharaye namah | om shriharikrishnaya namah | 10 om shrighanashyamaya
    namah | om shridharmikaya namah | om shribhaktinandanaya namah | om shribrihadvratadharaya namah |
    om shrishuddhaya namah | om shriradhakrishneshtadaivataya namah | om shrimarutsutapriyaya namah |
    om shrikalibhairavadyatibhishanaya namah | om shrijitendriyaya namah | om shrijitaharaya namah | 20
    om shritivravairagyaya namah | om shriastikaya namah | om shriyogeshvaraya namah | om shriyogakalapravrittaye
    namah | om shriatidhairyavate namah | om shrijnanine namah | om shriparamahamsaya namah | om shritirthakrite
    namah | om shritairthikarcitaya namah | om shrikshamanidhaye namah | 30 om shrisadonnidraya namah
    | om shridhyananishthaya namah | om shritapahpriyaya namah | om shrisiddheshvaraya namah | om shrisvatantraya
    namah | om shribrahmavidyapravartakaya namah | om shripashandocchedanapatave namah | om shrisvasvarupacalasthitaye
    namah | om shriprashantamurtaye namah | om shrinirdoshaya namah | 40 om shriasuragurvadimohanaya namah
    | om shriatikarunyanayanaya namah | om shriuddhavadhvapravartakaya namah | om shrimahavrataya namah
    | om shrisadhushilaya namah | om shrisadhuvipraprapujakaya namah | om shriahimsayajnaprastotre namah
    | om shrisakarabrahmavarnanaya namah | om shrisvaminarayanaya namah | om shrisvamine namah | 50 om
    shrikaladoshanivarakaya namah | om shrisacchastravyasanaya namah | om shrisadyahsamadhisthitikarakaya
    namah | om shrikrishnarcasthapanakaraya namah | om shrikauladvishe namah | om shrikalitarakaya namah
    | om shriprakasharupaya namah | om shrinirdambhaya namah | om shrisarvajivahitavahaya namah | om shribhaktisamposhakaya
    namah | 60 om shrivagmine namah | om shricaturvargaphalapradaya namah | om shrinirmatsaraya namah
    | om shribhaktavarmane namah | om shribuddhidatre namah | om shriatipavanaya namah | om shriabuddhihrite
    namah | om shribrahmadhamadarshakaya namah | om shriaparajitaya namah | om shriasamudrantasatkirtaye
    namah | 70 om shrishritasamsritimocanaya namah | om shriudaraya namah | om shrisahajanandaya namah
    | om shrisadhvidharmapravartakaya namah | om shrikandarpadarpadalanaya namah | om shrivaishnavakratukarakaya
    namah | om shripancayatanasammanaya namah | om shrinaishthikavrataposhakaya namah | om shripragalbhaya
    namah | om shrinihsprihaya namah | 80 om shrisatyapratijnaya namah | om shribhaktavatsalaya namah
    | om shriaroshanaya namah | om shridirghadarshine namah | om shrishadurmivijayakshamaya namah | om
    shrinirahankritaye namah | om shriadrohaya namah | om shririjave namah | om shrisarvopakarakaya namah
    | om shriniyamakaya namah | 90 om shriupashamasthitaye namah | om shrivinayavate namah | om shrigurave
    namah | om shriajatavairine namah | om shrinirlobhaya namah | om shrimahapurushaya namah | om shriatmadaya
    namah | om shriakhanditarshamaryadaya namah | om shrivyasasiddhantabodhakaya namah | om shrimanonigrahayuktijnaya
    namah | 100 om shriyamadutavimocakaya namah | om shripurnakamaya namah | om shrisatyavadine namah
    | om shrigunagrahine namah | om shrigatasmayaya namah | om shrisadacarapriyataraya namah | om shripunyashravanakirtanaya
    namah | om shrisarvamangalasadrupananagunaviceshtitaya namah | 108 om bhagavate shrisvaminarayanaya
    namah | om shriaksharapurushottamabhyam namah | om shrigunatitanandasvamine namah | om shribhagatajimaharajaya
    namah | om shrishastrijimaharajaya namah | om shriyogijimaharajaya namah | om shripramukhasvamimaharajaya
    namah | om shrimahantasvamimaharajaya namah | || iti shrishatanandamuniviracita shrijanamangalanamavalih
    samapta ||
  devanagari: धर्मनन्दनमहं विचिन्तये ॥ ॐ श्रीकृष्णाय नमः । ॐ श्रीवासुदेवाय नमः । ॐ श्रीनरनारायणाय नमः
    । ॐ श्रीप्रभवे नमः । ॐ श्रीभक्तिधर्मात्मजाय नमः । ॐ श्रीअजन्मने नमः । ॐ श्रीकृष्णाय नमः । ॐ श्रीनारायणाय
    नमः । ॐ श्रीहरये नमः । ॐ श्रीहरिकृष्णाय नमः । १० ॐ श्रीघनश्यामाय नमः । ॐ श्रीधार्मिकाय नमः । ॐ श्रीभक्तिनन्दनाय
    नमः । ॐ श्रीबृहद्व्रतधराय नमः । ॐ श्रीशुद्धाय नमः । ॐ श्रीराधाकृष्णेष्टदैवताय नमः । ॐ श्रीमरुत्सुतप्रियाय
    नमः । ॐ श्रीकालीभैरवाद्यतिभीषणाय नमः । ॐ श्रीजितेन्द्रियाय नमः । ॐ श्रीजिताहाराय नमः । २० ॐ श्रीतीव्रवैराग्याय
    नमः । ॐ श्रीआस्तिकाय नमः । ॐ श्रीयोगेश्वराय नमः । ॐ श्रीयोगकलाप्रवृत्तये नमः । ॐ श्रीअतिधैर्यवते नमः
    । ॐ श्रीज्ञानिने नमः । ॐ श्रीपरमहंसाय नमः । ॐ श्रीतीर्थकृते नमः । ॐ श्रीतैर्थिकार्चिताय नमः । ॐ श्रीक्षमानिधये
    नमः । ३० ॐ श्रीसदोन्निद्राय नमः । ॐ श्रीध्याननिष्ठाय नमः । ॐ श्रीतपःप्रियाय नमः । ॐ श्रीसिद्धेश्वराय
    नमः । ॐ श्रीस्वतन्त्राय नमः । ॐ श्रीब्रह्मविद्याप्रवर्तकाय नमः । ॐ श्रीपाषण्डोच्छेदनपटवे नमः । ॐ श्रीस्वस्वरूपाचलस्थितये
    नमः । ॐ श्रीप्रशान्तमूर्तये नमः । ॐ श्रीनिर्दोषाय नमः । ४० ॐ श्रीअसुरगुर्वादिमोहनाय नमः । ॐ श्रीअतिकारुण्यनयनाय
    नमः । ॐ श्रीउद्धवाध्वप्रवर्तकाय नमः । ॐ श्रीमहाव्रताय नमः । ॐ श्रीसाधुशीलाय नमः । ॐ श्रीसाधुविप्रप्रपूजकाय
    नमः । ॐ श्रीअहिंसयज्ञप्रस्तोत्रे नमः । ॐ श्रीसाकारब्रह्मवर्णनाय नमः । ॐ श्रीस्वामिनारायणाय नमः । ॐ
    श्रीस्वामिने नमः । ५० ॐ श्रीकालदोषनिवारकाय नमः । ॐ श्रीसच्छास्त्रव्यसनाय नमः । ॐ श्रीसद्यःसमाधिस्थितिकारकाय
    नमः । ॐ श्रीकृष्णार्चास्थापनकराय नमः । ॐ श्रीकौलद्विषे नमः । ॐ श्रीकलितारकाय नमः । ॐ श्रीप्रकाशरूपाय
    नमः । ॐ श्रीनिर्दम्भाय नमः । ॐ श्रीसर्वजीवहितावहाय नमः । ॐ श्रीभक्तिसम्पोषकाय नमः । ६० ॐ श्रीवाग्मिने
    नमः । ॐ श्रीचतुर्वर्गफलप्रदाय नमः । ॐ श्रीनिर्मत्सराय नमः । ॐ श्रीभक्तवर्मणे नमः । ॐ श्रीबुद्धिदात्रे
    नमः । ॐ श्रीअतिपावनाय नमः । ॐ श्रीअबुद्धिहृते नमः । ॐ श्रीब्रह्मधामदर्शकाय नमः । ॐ श्रीअपराजिताय नमः
    । ॐ श्रीआसमुद्रान्तसत्कीर्तये नमः । ७० ॐ श्रीश्रितसंसृतिमोचनाय नमः । ॐ श्रीउदाराय नमः । ॐ श्रीसहजानन्दाय
    नमः । ॐ श्रीसाध्वीधर्मप्रवर्तकाय नमः । ॐ श्रीकन्दर्पदर्पदलनाय नमः । ॐ श्रीवैष्णवक्रतुकारकाय नमः ।
    ॐ श्रीपञ्चायतनसम्मानाय नमः । ॐ श्रीनैष्ठिकव्रतपोषकाय नमः । ॐ श्रीप्रगल्भाय नमः । ॐ श्रीनिःस्पृहाय
    नमः । ८० ॐ श्रीसत्यप्रतिज्ञाय नमः । ॐ श्रीभक्तवत्सलाय नमः । ॐ श्रीअरोषणाय नमः । ॐ श्रीदीर्घदर्शिने
    नमः । ॐ श्रीषडूर्मिविजयक्षमाय नमः । ॐ श्रीनिरहङ्कृतये नमः । ॐ श्रीअद्रोहाय नमः । ॐ श्रीऋजवे नमः ।
    ॐ श्रीसर्वोपकारकाय नमः । ॐ श्रीनियामकाय नमः । ९० ॐ श्रीउपशमस्थितये नमः । ॐ श्रीविनयवते नमः । ॐ श्रीगुरवे
    नमः । ॐ श्रीअजातवैरिणे नमः । ॐ श्रीनिर्लोभाय नमः । ॐ श्रीमहापुरुषाय नमः । ॐ श्रीआत्मदाय नमः । ॐ श्रीअखण्डितार्षमर्यादाय
    नमः । ॐ श्रीव्याससिद्धान्तबोधकाय नमः । ॐ श्रीमनोनिग्रहयुक्तिज्ञाय नमः । १०० ॐ श्रीयमदूतविमोचकाय नमः
    । ॐ श्रीपूर्णकामाय नमः । ॐ श्रीसत्यवादिने नमः । ॐ श्रीगुणग्राहिणे नमः । ॐ श्रीगतस्मयाय नमः । ॐ श्रीसदाचारप्रियतराय
    नमः । ॐ श्रीपुण्यश्रवणकीर्तनाय नमः । ॐ श्रीसर्वमङ्गलसद्रूपनानागुणविचेष्टिताय नमः । १०८ ॐ भगवते श्रीस्वामिनारायणाय
    नमः । ॐ श्रीअक्षरपुरुषोत्तमाभ्यां नमः । ॐ श्रीगुणातीतानन्दस्वामिने नमः । ॐ श्रीभगतजीमहाराजाय नमः ।
    ॐ श्रीशास्त्रीजीमहाराजाय नमः । ॐ श्रीयोगीजीमहाराजाय नमः । ॐ श्रीप्रमुखस्वामिमहाराजाय नमः । ॐ श्रीमहन्तस्वामिमहाराजाय
    नमः । ॥ इति श्रीशतानन्दमुनिविरचिता श्रीजनमङ्गलनामावलिः समाप्ता ॥
