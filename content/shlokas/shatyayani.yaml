id: shatyayani
category: upanishad
name:
  english: shatyayani
  devanagari: शत्ययनि
content:
  english: nsvakarmalipsurviharedva vasedva || 20|| devagnyagare tarumule guhayam vasedasango'lakshitashilavrittah
    | anindhano jyotirivopashanto na codvijedudvijedyatra kutra || 21|| atmanam cedvijaniyadayamasmiti
    purushah | kimicchankasya kamaya shariramanusamjvaret || 22|| tameva dhiro vijnaya prajnam kurvita
    brahmanah | nanudhyayadbahunchabdanvaco viglapanam hi tat || 23|| balyenaiva hi tishthasennirvidya
    brahmavedanam | brahmavidya ca balyam ca nirvidya muniratmavan || 24|| yada sarve pramucyante kama
    ye'sya hridi shritah | atha martyo'mrito bhavatyatra brahma samashnute || 25|| atha khalu saumyedam
    parivrajyam naishthikamatmadharmam yo vijahati sa viraha bhavati | sa brahmaha bhavati | sa bhrunaha
    bhavati | sa mahapataki bhavati | ya imam vaishnavim nishtham parityajyati | sa steno bhavati | sa
    gurutalpago bhavati | sa mitradhrugbhavati | sa kritaghno bhavati | sa sarvasmallokatpracyuto bhavati
    | tadetadricabhyuktam | stenah surapo gurutalpagami mitradhrugete nishkriteryanti shuddhim | vyaktamavyaktam
    va vidhritam vishnulingam tyajanna shuddhyedakhilairatmabhasa || 26|| tyaktva vishnorlingamantarbahirva
    yah svashramam sevate'nashramam va | pratyapattim bhajate vatimudho naisham gatih kalpakotyapi drishta
    || 27|| tyaktva sarvashramandhiro vasenmokshashrame ciram | mokshashramatparibhrashto na gatistasya
    vidyate || 28|| parivrajyam grihitva tu yah svadharme na tishthati | tamarudhacyutam vidyaditi vedanushasanam
    || 29|| atha khalu saumyemam sanatanamatmadharmam vaishnavim nishtham labdhva yastamadushayanvartate
    sa vashi bhavati | sa punyashloko bhavati | sa lokajno bhavati | sa vedantajno bhavati | sa brahmajno
    bhavati | sa sarvajno bhavati | sa svarad bhavati | sa param brahma bhagavantamapnoti | sa pitrinsambandhino
    bandhavansuhrido mitrani ca bhavaduttarayati | tadetadricabhyuktam | shatam kulanam prathamam babhuva
    tatha paranam trishatam samagram | ete bhavanti sukritasya loke yesham kule samnyasatiha vidvan ||
    30|| trimshatparastrimshadaparamstrimshacca paratah paran | uttarayati dharmishthah parivraditi vai
    shrutih || 31|| samyastamiti yo bruyatkanthasthapranavanapi | taritah pitarastena iti vedanushasanam
    || 32|| atha khalu saumyemam sanatanamatmadharmam vaishnavim nishtham nasamapya prabruyat | nanucanaya
    nanatmavide navitaragaya navishuddhaya nanupasannaya naprayatamanasayeti ha smahuh | tadetadricabhyuktam
    | vidya ha vai brahmanamajagama gopaya mam shevadhishte'hamasmi | asuyakayanrijave shathaya ma ma
    bruya viryavati tatha syam || 33|| yameva vidyashrutamapramattam medhavinam brahmacaryopapannam |
    asma imamupasannaya samyak parikshya dadyadvaishnavimatmanishtham || 34|| adhyapita ye gurum nadriyante
    vipra vaca manasa karmana va | yathaiva tena na gururbhojaniya
  devanagari: न्स्वकर्मलिप्सुर्विहरेद्वा वसेद्वा ॥ २०॥ देवाग्न्यगारे तरुमूले गुहायां वसेदसङ्गोऽलक्षितशीलवृत्तः
    । अनिन्धनो ज्योतिरिवोपशान्तो न चोद्विजेदुद्विजेद्यत्र कुत्र ॥ २१॥ आत्मानं चेद्विजानीयादयमस्मीति पूरुषः
    । किमिच्छन्कस्य कामाय शरीरमनुसंज्वरेत् ॥ २२॥ तमेव धीरो विज्ञाय प्रज्ञां कुर्वीत ब्राह्मणः । नानुध्यायाद्बहूञ्छब्दान्वाचो
    विग्लापनं हि तत् ॥ २३॥ बाल्येनैव हि तिष्ठासेन्निर्विद्य ब्रह्मवेदनम् । ब्रह्मविद्या च बाल्यं च निर्विद्य
    मुनिरात्मवान् ॥ २४॥ यदा सर्वे प्रमुच्यन्ते कामा येऽस्य हृदि श्रिताः । अथ मर्त्योऽमृतो भवत्यत्र ब्रह्म
    समश्नुते ॥ २५॥ अथ खलु सौम्येदं परिव्राज्यं नैष्ठिकमात्मधर्मं यो विजहाति स वीरहा भवति । स ब्रह्महा
    भवति । स भ्रूणहा भवति । स महापातकी भवति । य इमां वैष्णवीं निष्ठां परित्यज्यति । स स्तेनो भवति । स
    गुरुतल्पगो भवति । स मित्रध्रुग्भवति । स कृतघ्नो भवति । स सर्वस्माल्लोकात्प्रच्युतो भवति । तदेतदृचाभ्युक्तम्
    । स्तेनः सुरापो गुरुतल्पगामी मित्रध्रुगेते निष्कृतेर्यान्ति शुद्धिम् । व्यक्तमव्यक्तं वा विधृतं विष्णुलिङ्गं
    त्यजन्न शुद्ध्येदखिलैरात्मभासा ॥ २६॥ त्यक्त्वा विष्णोर्लिङ्गमन्तर्बहिर्वा यः स्वाश्रमं सेवतेऽनाश्रमं
    वा । प्रत्यपत्तिं भजते वातिमूढो नैषां गतिः कल्पकोट्यापि दृष्टा ॥ २७॥ त्यक्त्वा सर्वाश्रमान्धीरो वसेन्मोक्षाश्रमे
    चिरम् । मोक्षाश्रमात्परिभ्रष्टो न गतिस्तस्य विद्यते ॥ २८॥ पारिव्राज्यं गृहीत्वा तु यः स्वधर्मे न तिष्ठति
    । तमारूढच्युतं विद्यादिति वेदानुशासनम् ॥ २९॥ अथ खलु सौम्येमं सनातनमात्मधर्मं वैष्णवीं निष्ठां लब्ध्वा
    यस्तामदूषयन्वर्तते स वशी भवति । स पुण्यश्लोको भवति । स लोकज्ञो भवति । स वेदान्तज्ञो भवति । स ब्रह्मज्ञो
    भवति । स सर्वज्ञो भवति । स स्वराड् भवति । स परं ब्रह्म भगवन्तमाप्नोति । स पितॄन्सम्बन्धिनो बान्धवान्सुहृदो
    मित्राणि च भवादुत्तरयति । तदेतदृचाभ्युक्तम् । शतं कुलानां प्रथमं बभूव तथा पराणां त्रिशतं समग्रम् ।
    एते भवन्ति सुकृतस्य लोके येषं कुले संन्यसतीह विद्वान् ॥ ३०॥ त्रिंशत्परास्त्रिंशदपरांस्त्रिंशच्च परतः
    परान् । उत्तरयति धर्मिष्ठः परिव्राडिति वै श्रुतिः ॥ ३१॥ संयस्तमिति यो ब्रूयात्कण्ठस्थप्राणवानपि ।
    तारिताः पितरस्तेन इति वेदानुशासनम् ॥ ३२॥ अथ खलु सौम्येमं सनातनमात्मधर्मं वैष्णवीं निष्ठां नासमाप्य
    प्रब्रूयात् । नानूचानाय नानात्मविदे नावीतरागाय नाविशुद्धाय नानुपसन्नाय नाप्रयतमानसायेति ह स्माहुः
    । तदेतदृचाभ्युक्तम् । विद्या ह वै ब्राह्मणमाजगाम गोपाय मां शेवधिष्टेऽहमस्मि । असूयकायानृजवे शठाय मा
    मा ब्रूया वीर्यवती तथा स्याम् ॥ ३३॥ यमेव विद्याश्रुतमप्रमत्तं मेधाविनं ब्रह्मचर्योपपन्नम् । अस्मा
    इमामुपसन्नाय सम्यक् परीक्ष्य दद्याद्वैष्णवीमात्मनिष्ठाम् ॥ ३४॥ अध्यापिता ये गुरुं नाद्रियन्ते विप्रा
    वाचा मनसा कर्मणा वा । यथैव तेन न गुरुर्भोजनीय
