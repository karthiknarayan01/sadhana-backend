id: catuhshashtirupabhairavastotram
category: stotram
name:
  english: catuhshashtirupabhairavastotram
  devanagari: चतुःषष्टिरूपभैरवस्तोत्रं
content:
  english: asitango vishalaksho martando modakapriyah | svacchando vighnasantushtah khecarah sacaracarah
    || 1|| rurushca krodadamshtrashya tathaiva ca jatadharah | vishvarupo virupaksho nanarupadharah parah
    || 2|| vajrahasto mahakayashcandashca pralayantakah | bhumikampo nilakantho vishnushca kulapalakah
    || 3|| mundapalah kamapalah krodho vai pingalekshanah | abhrarupo dharapalah kutilo mantranayakah
    || 4|| rudrah pitamahakhyashca vyunmatto vatunayakah | shankaro bhutavetalastrinetrastripurantakah
    || 5|| varadah parvatavasah kapalah shashibhushanah | hasticarmambaradharo yogisho brahmarakshasah
    || 6|| sarvajnah sarvadeveshah sarvabhutahridisthitah | bhishanakhyo bhayaharah sarvajnakhyastathaiva
    ca || 7|| kalagnishca maharaudro dakshino mukharo'sthirah | samharashcatiriktango nagapashah
  devanagari: असिताङ्गो विशालाक्षो मार्तण्डो मोदकप्रियः । स्वच्छन्दो विघ्नसन्तुष्टः खेचरः सचराचरः ॥ १॥
    रुरुश्च क्रोडदंष्ट्रश्य तथैव च जटाधरः । विश्वरूपो विरूपाक्षो नानारूपधरः परः ॥ २॥ वज्रहस्तो महाकायश्चण्डश्च
    प्रलयान्तकः । भूमिकम्पो नीलकण्ठो विष्णुश्च कुलपालकः ॥ ३॥ मुण्डपालः कामपालः क्रोधो वै पिङ्गलेक्षणः
    । अभ्ररूपो धरापालः कुटिलो मन्त्रनायकः ॥ ४॥ रुद्रः पितामहाख्यश्च व्युन्मत्तो वटुनायकः । शङ्करो भूतवेतालस्त्रिनेत्रस्त्रिपुरान्तकः
    ॥ ५॥ वरदः पर्वतावासः कपालः शशिभूषणः । हस्तिचर्माम्बरधरो योगीशो ब्रह्मराक्षसः ॥ ६॥ सर्वज्ञः सर्वदेवेशः
    सर्वभूतहृदिस्थितः । भीषणाख्यो भयहरः सर्वज्ञाख्यस्तथैव च ॥ ७॥ कालाग्निश्च महारौद्रो दक्षिणो मुखरोऽस्थिरः
    । संहारश्चातिरिक्ताङ्गो नागपाशः
meaning: {}
