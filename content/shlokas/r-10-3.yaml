id: r-10-3
category: veda
name:
  english: r 10
  devanagari: र् १०
content:
  english: 10 praktubhya̱ indra̱h pra vri̱dho aha̭bhya̱h prantari̭ksha̱tpra sa̭mu̱drasya̭ dha̱seh | pra
    vata̭sya̱ pratha̭sa̱h pra jmo anta̱tpra sindhṷbhyo ririce̱ pra kshi̱tibhya̭h || 10
  devanagari: १० प्राक्तुभ्य॒ इन्द्रः॒ प्र वृ॒धो अह॑भ्यः॒ प्रान्तरि॑क्षा॒त्प्र स॑मु॒द्रस्य॑ धा॒सेः । प्र
    वात॑स्य॒ प्रथ॑सः॒ प्र ज्मो अन्ता॒त्प्र सिन्धु॑भ्यो रिरिचे॒ प्र क्षि॒तिभ्यः॑ ॥ १०
meaning: {}
