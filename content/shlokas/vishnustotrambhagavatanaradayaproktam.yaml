id: vishnustotrambhagavatanaradayaproktam
category: stotram
name:
  english: vishnustotrambhagavatanaradayaproktam
  devanagari: विष्णुस्तोत्रंभगवतानारदायप्रोक्तम्
content:
  english: hanta te kathayishyami mune divyamanusmritim | marane yamanusmritya prapnoti paramam gatim
    || 7|| onkaramaditah kritva mamanusmritya manmanah | ekagraprayato bhutva idam mantramudirayet ||
    8|| avyaktam shashvatam devamanantam purushottamam | prapadye pranjalirvishnumacyutam parameshvaram
    || 9|| puranam paramam vishnumadbhutam lokabhavanam | prapadye pundarikakshamisham bhaktanukampinam
    || 10|| lokanatham prapanno'smi aksharam paramam padam | bhagavantam prapanno'smi bhutabhavyabhavatprabhum
    || 11|| srashtaram sarvabhutanamanantabalapaurusham | padmanabham hrishikesham papadye satyamavyayam
    || 12|| hiranyagarbham bhugarbhamamritam vishvatomukham | abhasvaramanadyantam prapadye bhaskaradyutim
    || 13|| sahasrashirasam devam vaikuntham tarkshyavahanam | prapadye sukshmamacalam varenyamabhayapradam
    || 14|| narayanam naram hamsam yogatmanam sanatanam | sharanyam sarvalokanam prapadye dhruvamishvaram
    || 15|| yah prabhuh sarvalokanam yena sarvamidam tatam | caracaragururdevah sa no vishnuh prasidatu
    || 16|| yasmajjatah pura brahma padmayonih pitamahah | prasidatu sa no vishnuh pita mata pitamahah
    || 17|| yah pura pralaye prapte nashte loke caracare | ekastishthati yogatma sa no vishnuh prasidatu
    || 18|| caturbhishca caturbhishca dvabhyam pancabhireva ca huyate ca punardvabhyam sa no vishnuh prasidatu
    parjanyah prithivi sasyam kalo dharmah kriya phalam | gunakarah sa no babhrurvasudevah prasidatu ||
    19|| yogavasa namastubhyam sarvavasa varaprada | yajnagarbha mahabhaga pancayajna namo'stu te || 20||
    caturmurte jagaddhama lakshmyavasa varaprada | sarvavasa namaste'stu sakshibhuta jagatpate || 21||
    ajeya khandaparasho vishvamurte vrishakape | trigarte pancakalajna namaste jnanasagara || 22|| avyaktadandamutpannamavyaktadyah
    parah prabhuh | yasmatparataram nasti tamasmi sharanam gatah || 23|| cintayanto hi yam nityam brahmesha
    adayah prabhum | nishcayam nadhigacchanti tamasmi sharanam gatah || 24|| jitendriya mahatmano jnanadhyanaparayanah
    | yam prapya na nivartante tamasmi sharanam gatah || 25|| ekamshena jagatsarvam yo'vashtabhya vibhuh
    sthitah | agrahyo nirgunah shasta tamasmi sharanam gatah || 26|| divakarasya saumyam hi madhye jyotiravasthitam
    | kshetrajnamiti yam prahuh sa mahatma prasidatu || 27|| avyaktamanavasthano durvijneyah sanatanah
    | asthitah prakritim bhunkte sa mahatma prasidatu || 28|| kshetrajnah pancadha bhunkte prakritim bahubhirgunaih
    | manogunamshca yo bhunkte sa mahatma prasidatu || 29|| sankhya yogashca ye canye siddhashcaiva maharshayah
    | yam viditva vimucyante sa mahatma prasidatu || 30|| namaste sarvatobhadra sarvato'kshishiromukha
    nirvikara namaste'stu sakshibhuta hridi sthita | atindriya namastubhyam lingebhyastvam pramiyase ||
    31|| ye tu tvam nabhijananti samsare samsaranti te ragadveshavinirmuktam lobhamohavivarjitam | ashariram
    sharirastham samam sarveshu dehishu || 32|| avyaktam buddhyahankarau mahabhutendriyani ca | tvayi
    tani na teshu tvam teshu tvam tani na tvayi || 33|| srashta bhoktasi kutastho gunanam prabhurishvarah
    | akarta heturahitah prabhuh svatmanyavasthitah || 34|| namaste pundarikaksha punareva namo'stu te
    ishvaro'si jagannatha kimatah paramucyate | bhaktanam yaddhitam deva taddhyaya tridasheshvara || 35||
    ma me bhuteshu samyogah punarbhavatu janmani | ahankarena buddhya va tatha sattvadibhirgunaih || 36||
    ma me dharmo hyadharmo va punarbhavatu janmani | vishayairindriyairvapi ma me bhuyatsamagamah || 37||
    prithivim yatu me ghranam yatu me rasana jalam | cakshurhutashanam yatu sparsho me yatu marutam ||
    38|| shabdo hyakashamabhyetu mano vaikarikam tatha | ahankarashca me buddhim tvayi buddhih sametu
    ca || 39|| viyogah sarvakaranairgunairbhutaishca me bhavet | sattvam rajastamashcaiva prakritim pravishantu
    me || 40|| nishkevalam padam caiva prayami paramam tava | ekibhavastvayaivastu ma me janma bhavetpunah
    || 41|| namo bhagavate tasmai vishnave prabhavishnave tvanmanastvadgatapranastvadbhaktastvatparayanah
    | tvamevanusmare deva marane pratyupasthite || 42|| purvadehakrita ye me vyadhayaste vishantu mam
    | ardayantu ca duhkhani pravimuncami yadrinam || 43|| upatishthantu me roga ye maya puvasancitah |
    anrino gantumicchami tadvishnoh paramam padam || 44|| aham bhagavatastasya mama casau sureshvarah
    | tasyaham na pranashyami sa ca me na pranashyati || 45|| namo bhagavate tasmai yena sarvamidam tatam
    | tameva ca prapanno'smi mama yo yasya capyaham || 46|| imamanusmritim nityam vaishnavim papanashanim
    | svapanjagratpathedyastu trisandhyam vapi yah smaret || 47|| marane capyanuprapte yastvimam samanusmaret
    | api papasamacarah so'pi yati param gatim || 48|| arcayannapi yo devam grihe vapi balim dadet | juhvadagnim
    smaredvapi labhate sa param gatim || 49|| paurnamasyamamavasyam dvadashyam ca visheshatah | shravayecchraddadhanastu
    ye canye mamupashritah || 50|| nama ityeva yo bruyanmadbhaktah shraddhayanvitah | tasya syurakshaya
    lokah shvapakasyapi narada || 51|| iti vishnudharmeshu ashtashashtitamo'dhyayantargatam bhagavata
    naradaya proktam vishnustotram sampurnam |
  devanagari: हन्त ते कथयिष्यामि मुने दिव्यामनुस्मृतिम् । मरणे यामनुस्मृत्य प्राप्नोति परमां गतिम् ॥ ७॥
    ओङ्कारमादितः कृत्वा मामनुस्मृत्य मन्मनाः । एकाग्रप्रयतो भूत्वा इदं मन्त्रमुदीरयेत् ॥ ८॥ अव्यक्तं शाश्वतं
    देवमनन्तं पुरुषोत्तमम् । प्रपद्ये प्राञ्जलिर्विष्णुमच्युतं परमेश्वरम् ॥ ९॥ पुराणं परमं विष्णुमद्भुतं
    लोकभावनम् । प्रपद्ये पुण्डरीकाक्षमीशं भक्तानुकम्पिनम् ॥ १०॥ लोकनाथं प्रपन्नोऽस्मि अक्षरं परमं पदम्
    । भगवन्तं प्रपन्नोऽस्मि भूतभव्यभवत्प्रभुम् ॥ ११॥ स्रष्टारं सर्वभूतानामनन्तबलपौरुषम् । पद्मनाभं हृषीकेशं
    पपद्ये सत्यमव्ययम् ॥ १२॥ हिरण्यगर्भं भूगर्भममृतं विश्वतोमुखम् । आभास्वरमनाद्यन्तं प्रपद्ये भास्करद्युतिम्
    ॥ १३॥ सहस्रशिरसं देवं वैकुण्ठं तार्क्ष्यवाहनम् । प्रपद्ये सूक्ष्ममचलं वरेण्यमभयप्रदम् ॥ १४॥ नारायणं
    नरं हंसं योगात्मानं सनातनम् । शरण्यं सर्वलोकानां प्रपद्ये ध्रुवमीश्वरम् ॥ १५॥ यः प्रभुः सर्वलोकानां
    येन सर्वमिदं ततम् । चराचरगुरुर्देवः स नो विष्णुः प्रसीदतु ॥ १६॥ यस्माज्जातः पुरा ब्रह्मा पद्मयोनिः
    पितामहः । प्रसीदतु स नो विष्णुः पिता माता पितामहः ॥ १७॥ यः पुरा प्रलये प्राप्ते नष्टे लोके चराचरे
    । एकस्तिष्ठति योगात्मा स नो विष्णुः प्रसीदतु ॥ १८॥ चतुर्भिश्च चतुर्भिश्च द्वाभ्यां पञ्चभिरेव च हूयते
    च पुनर्द्वाभ्यां स नो विष्णुः प्रसीदतु पर्जन्यः पृथिवी सस्यं कालो धर्मः क्रिया फलम् । गुणाकरः स नो
    बभ्रुर्वासुदेवः प्रसीदतु ॥ १९॥ योगावास नमस्तुभ्यं सर्वावास वरप्रद । यज्ञगर्भ महाभाग पञ्चयज्ञ नमोऽस्तु
    ते ॥ २०॥ चतुर्मूर्ते जगद्धाम लक्ष्म्यावास वरप्रद । सर्वावास नमस्तेऽस्तु साक्षिभूत जगत्पते ॥ २१॥ अजेय
    खण्डपरशो विश्वमूर्ते वृषाकपे । त्रिगर्ते पञ्चकालज्ञ नमस्ते ज्ञानसागर ॥ २२॥ अव्यक्तादण्डमुत्पन्नमव्यक्ताद्यः
    परः प्रभुः । यस्मात्परतरं नास्ति तमस्मि शरणं गतः ॥ २३॥ चिन्तयन्तो हि यं नित्यं ब्रह्मेशा आदयः प्रभुम्
    । निश्चयं नाधिगच्छन्ति तमस्मि शरणं गतः ॥ २४॥ जितेन्द्रिया महात्मानो ज्ञानध्यानपरायणाः । यं प्राप्य
    न निवर्तन्ते तमस्मि शरणं गतः ॥ २५॥ एकांशेन जगत्सर्वं योऽवष्टभ्य विभुः स्थितः । अग्राह्यो निर्गुणः
    शास्ता तमस्मि शरणं गतः ॥ २६॥ दिवाकरस्य सौम्यं हि मध्ये ज्योतिरवस्थितम् । क्षेत्रज्ञमिति यं प्राहुः
    स महात्मा प्रसीदतु ॥ २७॥ अव्यक्तमनवस्थानो दुर्विज्ञेयः सनातनः । आस्थितः प्रकृतिं भुङ्क्ते स महात्मा
    प्रसीदतु ॥ २८॥ क्षेत्रज्ञः पञ्चधा भुङ्क्ते प्रकृतिं बहुभिर्गुणैः । मनोगुणांश्च यो भुङ्क्ते स महात्मा
    प्रसीदतु ॥ २९॥ साङ्ख्या योगाश्च ये चान्ये सिद्धाश्चैव महर्षयः । यं विदित्वा विमुच्यन्ते स महात्मा
    प्रसीदतु ॥ ३०॥ नमस्ते सर्वतोभद्र सर्वतोऽक्षिशिरोमुख निर्विकार नमस्तेऽस्तु साक्षिभूत हृदि स्थित । अतीन्द्रिय
    नमस्तुभ्यं लिङ्गेभ्यस्त्वं प्रमीयसे ॥ ३१॥ ये तु त्वां नाभिजानन्ति संसारे संसरन्ति ते रागद्वेषविनिर्मुक्तं
    लोभमोहविवर्जितम् । अशरीरं शरीरस्थं समं सर्वेषु देहिषु ॥ ३२॥ अव्यक्तं बुद्ध्यहङ्कारौ महाभूतेन्द्रियाणि
    च । त्वयि तानि न तेषु त्वं तेषु त्वं तानि न त्वयि ॥ ३३॥ स्रष्टा भोक्तासि कूटस्थो गुणानां प्रभुरीश्वरः
    । अकर्ता हेतुरहितः प्रभुः स्वात्मन्यवस्थितः ॥ ३४॥ नमस्ते पुण्डरीकाक्ष पुनरेव नमोऽस्तु ते ईश्वरोऽसि
    जगन्नाथ किमतः परमुच्यते । भक्तानां यद्धितं देव तद्ध्याय त्रिदशेश्वर ॥ ३५॥ मा मे भूतेषु संयोगः पुनर्भवतु
    जन्मनि । अहङ्कारेण बुद्ध्या वा तथा सत्त्वादिभिर्गुणैः ॥ ३६॥ मा मे धर्मो ह्यधर्मो वा पुनर्भवतु जन्मनि
    । विषयैरिन्द्रियैर्वापि मा मे भूयात्समागमः ॥ ३७॥ पृथिवीं यातु मे घ्राणं यातु मे रसना जलम् । चक्षुर्हुताशनं
    यातु स्पर्शो मे यातु मारुतम् ॥ ३८॥ शब्दो ह्याकाशमभ्येतु मनो वैकारिकं तथा । अहङ्कारश्च मे बुद्धिं त्वयि
    बुद्धिः समेतु च ॥ ३९॥ वियोगः सर्वकरणैर्गुणैर्भूतैश्च मे भवेत् । सत्त्वं रजस्तमश्चैव प्रकृतिं प्रविशन्तु
    मे ॥ ४०॥ निष्केवलं पदं चैव प्रयामि परमं तव । एकीभावस्त्वयैवास्तु मा मे जन्म भवेत्पुनः ॥ ४१॥ नमो भगवते
    तस्मै विष्णवे प्रभविष्णवे त्वन्मनस्त्वद्गतप्राणस्त्वद्भक्तस्त्वत्परायणः । त्वामेवानुस्मरे देव मरणे
    प्रत्युपस्थिते ॥ ४२॥ पूर्वदेहकृता ये मे व्याधयस्ते विशन्तु माम् । आर्दयन्तु च दुःखानि प्रविमुञ्चामि
    यदृणम् ॥ ४३॥ उपतिष्ठन्तु मे रोगा ये मया पूवसञ्चिताः । अनृणो गन्तुमिच्छामि तद्विष्णोः परमं पदम् ॥ ४४॥
    अहं भगवतस्तस्य मम चासौ सुरेश्वरः । तस्याहं न प्रणश्यामि स च मे न प्रणश्यति ॥ ४५॥ नमो भगवते तस्मै येन
    सर्वमिदं ततम् । तमेव च प्रपन्नोऽस्मि मम यो यस्य चाप्यहम् ॥ ४६॥ इमामनुस्मृतिं नित्यं वैष्णवीं पापनाशनीम्
    । स्वपञ्जाग्रत्पठेद्यस्तु त्रिसन्ध्यं वापि यः स्मरेत् ॥ ४७॥ मरणे चाप्यनुप्राप्ते यस्त्विमां समनुस्मरेत्
    । अपि पापसमाचारः सोऽपि याति परां गतिम् ॥ ४८॥ अर्चयन्नपि यो देवं गृहे वापि बलिं ददेत् । जुह्वदग्निं
    स्मरेद्वापि लभते स परां गतिम् ॥ ४९॥ पौर्णमास्याममावास्यां द्वादश्यां च विशेषतः । श्रावयेच्छ्रद्दधानास्तु
    ये चान्ये मामुपाश्रिताः ॥ ५०॥ नम इत्येव यो ब्रूयान्मद्भक्तः श्रद्धयान्वितः । तस्य स्युरक्षया लोकाः
    श्वपाकस्यापि नारद ॥ ५१॥ इति विष्णुधर्मेषु अष्टषष्टितमोऽध्यायान्तर्गतं भगवता नारदाय प्रोक्तं विष्णुस्तोत्रं
    सम्पूर्णम् ।
