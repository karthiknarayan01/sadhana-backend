id: ashramopanishat
category: upanishad
name:
  english: ashramopanishat
  devanagari: आश्रमोपनिषत्
content:
  english: ashramopanishat sarvashramah samabhavan yasmatso'yam janardanah | kaivalyavaptaye bhuyatsadacararatanhi
    tan || 1|| om bhadram karnebhih shrunuyama devah | bhadram pashyemakshabhiryajatrah | sthirairangaistushtuvamsastanubhirvyashema
    devahitam yadayuh | svasti na indro vriddhashravah | svasti nah pusha vishvavedah | svasti nastarkshyo
    arishtanemih | svasti no brihaspatirdadhatu || om shantih shantih shantih || harih om || athatashcatvara
    ashramah shodashabheda bhavanti | tatra brahmashcarinashcaturvidha bhavanti gayatro brahmanah prajapatyo
    brihanniti | ya upanayanadurdhvam triratramaksharalavanashi gayatrimantre sa gayatrah | yo'shtacatvarimshadvarshani
    vedabrahmacaryam caretprativedam dvadasha va yavadgrahanantam va vedasya sa brahmanah | svadanirata
    ritukalabhigami sada paradaravarji prajapatyah | athava caturvimshativarshani gurukulavasi brahmano'shtacatvarimshadvarshavasi
    ca prajapatyah | a prayanadguroraparityagi naishthiko brihanniti || 1|| grihastha api caturvidha bhavanti
  devanagari: आश्रमोपनिषत् सर्वाश्रमाः समभवन् यस्मात्सोऽयं जनार्दनः । कैवल्यावाप्तये भूयात्सदाचाररतान्हि
    तान् ॥ १॥ ॐ भद्रं कर्णेभिः श्रुणुयाम देवाः । भद्रं पश्येमाक्षभिर्यजत्राः । स्थिरैरङ्गैस्तुष्टुवांसस्तनूभिर्व्यशेम
    देवहितं यदायुः । स्वस्ति न इन्द्रो वृद्धश्रवाः । स्वस्ति नः पूषा विश्ववेदाः । स्वस्ति नस्तार्क्ष्यो
    अरिष्टनेमिः । स्वस्ति नो बृहस्पतिर्दधातु ॥ ॐ शान्तिः शान्तिः शान्तिः ॥ हरिः ॐ ॥ अथातश्चत्वार आश्रमाः
    षोडशभेदा भवन्ति । तत्र ब्रह्मश्चारिणश्चतुर्विधा भवन्ति गायत्रो ब्राह्मणः प्राजापत्यो बृहन्निति । य
    उपनयनादूर्ध्वं त्रिरात्रमक्षारलवणाशी गायत्रीमन्त्रे स गायत्रः । योऽष्टाचत्वारिंशद्वर्षाणि वेदब्रह्मचर्यं
    चरेत्प्रतिवेदं द्वादश वा यावद्ग्रहणान्तं वा वेदस्य स ब्राह्मणः । स्वदानिरत ऋतुकालाभिगामी सदा परदारवर्जी
    प्राजापत्यः । अथवा चतुर्विंशतिवर्षाणि गुरुकुलवासी ब्राह्मणोऽष्टाचत्वारिंशद्वर्षवासी च प्राजापत्यः
    । आ प्रायणाद्गुरोरपरित्यागी नैष्ठिको बृहन्निति ॥ १॥ गृहस्था अपि चतुर्विधा भवन्ति
