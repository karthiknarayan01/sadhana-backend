id: gopaladivyasahasranamastotram-shandilyasamhitantargatam-shrikrishnah-saccidanando
category: sahasranama
name:
  english: gopaladivyasahasranamastotram (shandilyasamhitantargatam shrikrishnah saccidanando)
  devanagari: गोपालदिव्यसहस्रनामस्तोत्रम् (शाण्डिल्यसंहितान्तर्गतम् श्रीकृष्णः सच्चिदानन्दो)
content:
  english: ringadhishashca mangalah || 51|| vishnurvishnupriyacaryo camparanyakritodayah | durvadakhandano
    rudrah samudrah sarvavijjayi || 52|| lokajnanaharo dakshah shikhi mundi ca dandabhrit | shesho'sheshadharo
    vidyadharah shokaharah parah || 53|| madhavo mapatirjivo jivano'mritado'marah | vaishvanaro brahmavetta
    sudhanatho haripriyah || 54|| kumaro muktido mukto janesho vishvavanditah | dvarapatih shankhadharah
    kusheshah shritrivikramah || 55|| ranatyagi ranaharo rinaha siddhasevitah | somanathah prabhaseshah
    jvalamali digambarah || 56|| himalayah pashupatih kedaro daravallabhah | bhupatirbhudharah sindhuh
    saridrupo vano'vanih || 57|| jambunarayano merushikharanandavardha nah | ratnakaro ratnabhokta plaksho
    plakshadhipo ravih || 58|| jagadatma jagaccakshustapanah savita ghrinih | ikshusindhuh shalmalishashcandrah
    surapitripriyah || 59|| vishvanandakarah kalah surasammohito'surah | kushapriyah kushadhyaksho hutabhug
    ghritabhojanah || 60|| krauncapriyo bhaktamayo kshirasagaravallabhah | shakah shakapriyah prano dadhibhuk
    devasamyutah || 61|| pushkarah pushkarapatirvirincirmadhuro madhuh | manaso manasagatih kancani mukurapriyah
    || 62|| lokaloko mahasthano gopta diggajanayakah | svargo maharjano divyastapah satyam dhruvo vratam
    || 63|| vaikuntho devalokashca goloko brahmabhu rasah | atalo mayaputreshtah chalo'tha vitalo harah
    || 64|| sutalo bhaktavashyashca vikrami balipujitah | mahatalo mahamayi kadraveyashanasanah || 65||
    rasatalo danavantakaranah suravallabhah | trilokidharanah sheshah nagesho jnanasagarah || 66|| nanakarmagatih
    papagatidurgatido yamah | anantanarakacchedi pavitram varasadyashah || 67|| kotyashvamedhapapaghnah
    kotitirthatipavanah | kotivishvasamuddhartta kotisadhanasadhanah || 68|| nija'nugrahavallila ishvaro'cintyakaryakrit
    | satprasadasamuddharah satah sadvasanapradah || 69|| asaddhiharanah sarvavyapi saddharmasadgatih
    | saddharmapalakah satyamanurupi janeshvarah || 70|| varaho yajnarupashca dharoddhari dharastutah
    | hayashirsho hayagrivah sarvavidyapravarttakah || 71|| dattatreyo mahayogi narado devapujitah | kumarah
    kapilacaryah sankhyavitsagaro dhritih || 72|| dharmasunurdharmarupah svadharmaparipalakah | yajnah
    suraganadhisho merudevisutastrivit || 73|| yogisha rishabhah sthanuryogacaryapravarttakah | prithuh
    prithumanah prithvipalako jagatah pita || 74|| matsyah satyavratanandah kacchapo merubhritsamah |
    dhanvantarih sudhahasto janarogapavargadah || 75|| mohini mohano mayi danujakleshadah pavih | narasimho
    mahasimho prahlado ditijardanah || 76|| ugro viro nijanando bhishanarttiharah pavih | urukramah karmagata
    indrasenabhayapradah || 77|| ramah parashubhrid dushtakshatrahari dvijarttiha | parasharyo mahabhago
    hyanukampyanubhavavit || 78|| jnanavataro vijnata vaishnavo'suramohanah | shriramacandro raghujah
    sakshadbrahmamayo harih || 79|| jagatsantapaharano brahmanyah satyavatsalah | satyasandhah sharanyashca
    maryadapurushottamah || 80|| kausalyanandano devadatto bharatavallabhah | lakshmanapranadah pranah
    shatrughnah shatrutapanah || 81|| vishvamitrapriyo dantah shanto dasharathatmajah | sitapatih punyakirttirharakodandabhanjanah
    || 82|| satyavak pitrisadbhaktirmarganeta narottamah | nihspriho nirmamo nityo nirmohashca niranjanah
    || 83|| citradriramanah kakabhid adimunipriyah | guhasvami guhanandi dandakaranyapavanah || 84|| dushtadanavahanta
    ca svajananandanakriyah | shabarishuddhidah sitaviyogagatinatyakrit || 85|| jatayumuktido vayusutadikapivallabhah
    | setubandhanakrinnamashaktisambhritabhudharah || 86|| lankadhipakuladhvamsi vibhishanavarapradah
    | ayodhyanayakashcaikakriyaramanasadvratah || 87|| yajnakridrishisammanyo rajarshih sarvavallabhah
    | shivadivanditapado natanatyo narakritih || 88|| ayodhyatarakastarah punyashlokashikhamanih | vasudevo
    mahadevo balabhadro'suraughaha || 89|| bhubharaharano hari trilokaparipalakah | vrindarakanugo vijno'suramohanatatparah
    || 90|| buddho buddhiprado'shuddhamargakridvedadharmaha | ahimsavyajasantaptah sarvadharmakritagamah
    || 91|| kalidharmakulo jagatpalako palanakshamah | sandhidharmadharo dhuryo hyasanmargavinashakah
    || 92|| sadyuktih satkritih sadhurmunirupah kritavanah | upadharmaharo vidvan dharmadandadharo harah
    || 93|| jagajjeta jaganneta sarvadharmapravarttakah | tamasastamasajanadushtabuddhiprado madi || 94||
    bahudhopasanamargo virakto'vanimandanah | nihsadhanajanoddhari karunavarunalayah || 95|| vakpatih
    shridharo dhiro madhavashca sanatanah | vishnuh kalimaladhvamsi jahnavijalasamshritah || 96|| mahakalih
    kalih klishtah kalkih kalinivaranah | mlecchaha'sidharo lilayutasturagavahanah || 97|| ishaliladharah
    suryah shraddhaluh shraddhabhuk shubhah | ikshvakuh purujiccandro'mbarisho'pyamitadyutih || 98|| nimirnimeshagah
    satyo yauvanashvo mahabali | sagarah sagaro yogi jeta bhagiratho'riha || 99|| khatvango mucukundashca
    raghurdasharatho dyuman | candro dvijesho sudyumna ailashca nahusho nripah || 100|| yayatishca yadutrata
    kurushca bharato vrishah | kartaviryo mahaviryo vishvamitro'pi shantanuh || 101|| bhishmah pandusutah
    shaibyo'larko'yodhyapatistripat | divodaso rantidevo vishnudatto nareshvarah || 102|| saddharmarakshanakriti
    nirodhagatido'mritah | jagatamashrayo nityo lokatito mahodayah || 103|| vedaikavedyo vedatma vedanugrahakritprabhuh
    | vyapi vaikunthanilayo nijalilaratipriyah || 104|| avataritabhaktamshah samuddharatvarakritih | divyaikanilayo
    divyo divyakridaraso'rasah || 105|| nando nandayita''nandi yashodanandamandirah | vrajeshvaro vrajadhyaksho
    vrajavaibhavakarakah || 106|| asuramayahridyogamayajanakakaryakrit | purnabrahma paranandamatragatro'vicintanah
    || 107|| paripurnakalasvami sahasrasukaladharah | bhubhaktaprarthitaprapyo bhubharaharanoditah ||
    108|| brahmeshendradidevedyah purushah purushottamah | asurai ranakrittrata mayesho mohakaryakrit
    || 109|| vasudevah sattvamurtirdevadhaninivasakrit | brahmadisamstuto devo vasudevashcaturbhujah ||
    110|| vyakhyatasheshamahatmyah gokulanandakarakah | svavyuhasamharah sarah prayagacaritavratah ||
    111|| svakiyajanavijnatah svapriyo janaranjanah | mahanandakaro'mandagunodaro mahotsavah || 112 gogopajanatanandah
    putanapranaharakah | putanasupayahpanaproddhritasviyabalakah || 113|| mulavidyaharah sviyacittarodhanapanditah
    | shakatasurasamhari sviyadoshanivarakah || 114|| pavanasurabhidbhishmah murarih sutalardanah | gosvami
    gokulapatirgovindo nandalalitah || 115|| gopalo gokuladhisho navanitapriyah prabhuh | damodaro bhaktavashyo
    yamalarjunamuktidah || 116|| aprameyah prameyatma baladambhavimardanah | kaliyasuraharah krodhadandano
    mandanah satam || 117|| pranapalo divyajanma lilatandavapanditah | vrindavanacarah kanto mallo natasamambarah
    || 118|| barhapidah pitavasa suryabhushanabhushanah | muralinadamadhuryasamahutavrajanganah || 119||
    yogamayaviracitasarvasevakritarthanah | lavanyaikaparamurttirvrindaranyapurandarah || 120|| paramapicyo
    gopidyo viyogahritabandhanah | sangapraptanyamahilamohavan vadatam varah || 121|| svakiyaratidah kami
    kamashastravisharadah | purandhridoshaharanah svatmamayapradarshakah || 122|| gopikagitamahima svadoshaparibodhakah
    | shrigokulapatih sakshi kotimanmathamanmathah || 123|| bhaktottamarnah sankirnah sarvanandakaro guruh
    | nrityalilanukaranastribhangalalitakritih || 124|| paramanandavistaro vismapitasureshvarah | sarvasaubhagyasuphalah
    kamadoshanivarakah || 125|| alaukikagatih shankhasuracudamanipradah | prematmako rukmamurtih parashrayanivarakah
    || 126|| keshiha vrishaha caiva naradedyo nripeshvarah | akruravallabho bhumibharaha yadaveshvarah
    || 127|| kamsarirdushtadamano vrati guruvaradritah | jarasandhavadhoddami yavanantakaro ravih || 128||
    mucukundapriyah shrisho dvarakasaubhagodayah | rukminishah smarakarah pradyumno rativallabhah || 129||
    satyabhamapatirjambavatisho lakshmanapatih | bhadrapatirmitravindapatih shaibyapatirmakhi || 130||
    kalindinidhavo dhata shatastrinayako yuva | shodashastrisahasreshah sattvasrishtiparayanah || 131||
    pandavanandakaranah kauravanvayanashanah | bhubharabhutarajanyadaityasanghavinashakah || 132|| sudamabhyarthitah
    praptashrutadevo nimipriyah | shadgunaishvaryasampanno nijabhaktanurodhakrit || 133|| jnanagamyah
    sankhyagamyo bhaktivashyah kritagamah | svarupanandaramanah svashrayo nirapashrayah || 134|| yogishcarairvanditanghrirdevanandakarah
    prabhuh | sheshabhutasamastatma paranandamito harih || 135|| phalashrutih | iti shrigokuleshasya proktam
    namasahasrakam | pathanadbhavavijnanam bhajananandadayakam || 136|| shrimadaryaprasadena prapya shrishamahamanum
    | samarcya sampathedbhaktya nigrahanugrahakshamah || 137|| bhavet pujyashca mahatam vidyanam paradrishvanah
    | sarvaparadhairmucyeta paracaryasu sangataih || 138|| bhaktibijamavapnoti prapnoti ca dridham shriyam
    | brahmano vedavedantasadacaraphalam labhet || 139|| kshatriyo vijayi bhaktavatsalo brahmanapriyah
    | vaishyo vittapatirbhavyo data bhokta bhavedayam || 140|| shudrah shuddho bhavedasmad brahmanyo harivallabhah
    | bhakto bhaktim samapnoti kami kaman manogatan || 141|| rogarto mucyate rogad baddho mucyeta bandhannat
    | apannashcapado mucyed mumukshurmucyate bhayat || 142|| sarvatmaneha gaditah shrililapurushottamah
    | sarvatmabhavalabdhyartham kamabhavaptaye'pi ca || 143|| nanena sadrisham kincit shripaterativallabham
    | tasmadavashyamabhyasyam vaishnavaih pujane hareh || 144|| vrindavane vataprante tirthasthane gurorgrihe
    | abhyasya samavapnoti yajamanasya bandhutam || 145|| parakrityasu ghorasu pretadinamupadrave | tirthamadhusaraih
  devanagari: ृङ्गाधीशश्च मङ्गलः ॥ ५१॥ विष्णुर्विष्णुप्रियाचार्यो चम्पारण्यकृतोदयः । दुर्वादखण्डनो रुद्रः
    समुद्रः सर्वविज्जयी ॥ ५२॥ लोकाज्ञानहरो दक्षः शिखी मुण्डी च दण्डभृत् । शेषोऽशेषधरो विद्याधरः शोकहरः
    परः ॥ ५३॥ माधवो मापतिर्जीवो जीवनोऽमृतदोऽमरः । वैश्वानरो ब्रह्मवेत्ता सुधानाथो हरिप्रियः ॥ ५४॥ कुमारो
    मुक्तिदो मुक्तो जनेशो विश्ववन्दितः । द्वारापतिः शङ्खधरः कुशेशः श्रीत्रिविक्रमः ॥ ५५॥ रणत्यागी रणहरो
    ऋणहा सिद्धसेवितः । सोमनाथः प्रभासेशः ज्वालामाली दिगम्बरः ॥ ५६॥ हिमालयः पशुपतिः केदारो दारवल्लभः ।
    भूपतिर्भूधरः सिन्धुः सरिद्रूपो वनोऽवनिः ॥ ५७॥ जम्बूनारायणो मेरुशिखरानन्दवर्ध नः । रत्नाकरो रत्नभोक्ता
    प्लक्षो प्लक्षाधिपो रविः ॥ ५८॥ जगदात्मा जगच्चक्षुस्तपनः सविता घृणिः । इक्षुसिन्धुः शाल्मलीशश्चन्द्रः
    सुरपितृप्रियः ॥ ५९॥ विश्वानन्दकरः कालः सुरासम्मोहितोऽसुरः । कुशप्रियः कुशाध्यक्षो हुतभुग् घृतभोजनः
    ॥ ६०॥ क्रौञ्चप्रियो भक्तमयो क्षीरसागरवल्लभः । शाकः शाकप्रियः प्राणो दधिभुक् देवसंयुतः ॥ ६१॥ पुष्करः
    पुष्करपतिर्विरिञ्चिर्मधुरो मधुः । मानसो मानसगतिः काञ्चनी मुकुरप्रियः ॥ ६२॥ लोकालोको महास्थानो गोप्ता
    दिग्गजनायकः । स्वर्गो महर्जनो दिव्यस्तपः सत्यं ध्रुवो व्रतम् ॥ ६३॥ वैकुण्ठो देवलोकश्च गोलोको ब्रह्मभू
    रसः । अतलो मयपुत्रेष्टः छलोऽथ वितलो हरः ॥ ६४॥ सुतलो भक्तवश्यश्च विक्रमी बलिपूजितः । महातलो महामायी
    काद्रवेयाशनासनः ॥ ६५॥ रसातलो दानवान्तकरणः सुरवल्लभः । त्रिलोकीधरणः शेषः नागेशो ज्ञानसागरः ॥ ६६॥ नानाकर्मगतिः
    पापगतिदुर्गतिदो यमः । अनन्तनरकच्छेदी पवित्रं वरसद्यशः ॥ ६७॥ कोट्यश्वमेधपापघ्नः कोटितीर्थातिपावनः ।
    कोटिविश्वसमुद्धर्त्ता कोटिसाधनसाधनः ॥ ६८॥ निजाऽनुग्रहवल्लील ईश्वरोऽचिन्त्यकार्यकृत् । सत्प्रसादसमुद्धारः
    सतः सद्वासनाप्रदः ॥ ६९॥ असद्धीहरणः सर्वव्यापी सद्धर्मसद्गतिः । सद्धर्मपालकः सत्यमनुरूपी जनेश्वरः ॥
    ७०॥ वराहो यज्ञरूपश्च धरोद्धारी धरास्तुतः । हयशीर्षो हयग्रीवः सर्वविद्याप्रवर्त्तकः ॥ ७१॥ दत्तात्रेयो
    महायोगी नारदो देवपूजितः । कुमारः कपिलाचार्यः साङ्ख्यवित्सागरो धृतिः ॥ ७२॥ धर्मसूनुर्धर्मरूपः स्वधर्मपरिपालकः
    । यज्ञः सुरगणाधीशो मेरुदेवीसुतस्त्रिवित् ॥ ७३॥ योगीश ऋषभः स्थाणुर्योगचर्याप्रवर्त्तकः । पृथुः पृथुमनाः
    पृथ्वीपालको जगतः पिता ॥ ७४॥ मत्स्यः सत्यव्रतानन्दः कच्छपो मेरुभृत्समः । धन्वन्तरिः सुधाहस्तो जनरोगापवर्गदः
    ॥ ७५॥ मोहिनी मोहनो मायी दनुजक्लेशदः पविः । नरसिंहो महासिंहो प्रह्लादो दितिजार्दनः ॥ ७६॥ उग्रो वीरो
    निजानन्दो भीषणार्त्तिहरः पविः । उरुक्रमः कर्मगत इन्द्रसेनाभयप्रदः ॥ ७७॥ रामः परशुभृद् दुष्टक्षत्रहारी
    द्विजार्त्तिहा । पाराशर्यो महाभागो ह्यनुकम्प्यनुभाववित् ॥ ७८॥ ज्ञानावतारो विज्ञाता वैष्णवोऽसुरमोहनः
    । श्रीरामचन्द्रो रघुजः साक्षाद्ब्रह्ममयो हरिः ॥ ७९॥ जगत्सन्तापहरणो ब्रह्मण्यः सत्यवत्सलः । सत्यसन्धः
    शरण्यश्च मर्यादापुरुषोत्तमः ॥ ८०॥ कौसल्यानन्दनो देवदत्तो भरतवल्लभः । लक्ष्मणप्राणदः प्राणः शत्रुघ्नः
    शत्रुतापनः ॥ ८१॥ विश्वामित्रप्रियो दान्तः शान्तो दशरथात्मजः । सीतापतिः पुण्यकीर्त्तिर्हरकोदण्डभञ्जनः
    ॥ ८२॥ सत्यवाक् पितृसद्भक्तिर्मार्गनेता नरोत्तमः । निःस्पृहो निर्ममो नित्यो निर्मोहश्च निरञ्जनः ॥ ८३॥
    चित्राद्रिरमणः काकभिद् आदिमुनिप्रियः । गुहस्वामी गुहानन्दी दण्डकारण्यपावनः ॥ ८४॥ दुष्टादानवहन्ता च
    स्वजनानन्दनक्रियः । शबरीशुद्धिदः सीतावियोगगतिनाट्यकृत् ॥ ८५॥ जटायुमुक्तिदो वायुसुतादिकपिवल्लभः । सेतुबन्धनकृन्नामशक्तिसम्भृतभूधरः
    ॥ ८६॥ लङ्काधिपकुलध्वंसी विभीषणवरप्रदः । अयोध्यानायकश्चैकक्रियारमणसद्व्रतः ॥ ८७॥ यज्ञकृदृषिसम्मान्यो
    राजर्षिः सर्ववल्लभः । शिवादिवन्दितपदो नटनाट्यो नराकृतिः ॥ ८८॥ अयोध्यातारकस्तारः पुण्यश्लोकशिखामणिः
    । वासुदेवो महादेवो बलभद्रोऽसुरौघहा ॥ ८९॥ भूभारहरणो हारी त्रिलोकपरिपालकः । वृन्दारकानुगो विज्ञोऽसुरमोहनतत्परः
    ॥ ९०॥ बुद्धो बुद्धिप्रदोऽशुद्धमार्गकृद्वेदधर्महा । अहिंसाव्याजसन्तप्तः सर्वधर्मकृतागमः ॥ ९१॥ कलिधर्माकुलो
    जगत्पालको पालनक्षमः । सन्धिधर्मधरो धुर्यो ह्यसन्मार्गविनाशकः ॥ ९२॥ सद्युक्तिः सत्कृतिः साधुर्मुनिरूपः
    कृतावनः । उपधर्महरो विद्वान् धर्मदण्डधरो हरः ॥ ९३॥ जगज्जेता जगन्नेता सर्वधर्मप्रवर्त्तकः । तामसस्तामसजनदुष्टबुद्धिप्रदो
    मदी ॥ ९४॥ बहुधोपासनामार्गो विरक्तोऽवनिमण्डनः । निःसाधनजनोद्धारी करुणावरुणालयः ॥ ९५॥ वाक्पतिः श्रीधरो
    धीरो माधवश्च सनातनः । विष्णुः कलिमलध्वंसी जाह्नवीजलसंश्रितः ॥ ९६॥ महाकलिः कलिः क्लिष्टः कल्किः कलिनिवारणः
    । म्लेच्छहाऽसिधरो लीलायुतस्तुरगवाहनः ॥ ९७॥ ईशलीलाधरः सूर्यः श्रद्धालुः श्राद्धभुक् शुभः । इक्ष्वाकुः
    पुरुजिच्चन्द्रोऽम्बरीषोऽप्यमितद्युतिः ॥ ९८॥ निमिर्निमेषगः सत्यो यौवनाश्वो महाबली । सगरः सागरो योगी
    जेता भागीरथोऽरिहा ॥ ९९॥ खट्वाङ्गो मुचुकुन्दश्च रघुर्दशरथो द्युमान् । चन्द्रो द्विजेशो सुद्युम्न ऐलश्च
    नहुषो नृपः ॥ १००॥ ययातिश्च यदुत्राता कुरुश्च भरतो वृषः । कार्तवीर्यो महावीर्यो विश्वामित्रोऽपि शन्तनुः
    ॥ १०१॥ भीष्मः पाण्डुसुतः शैब्योऽलर्कोऽयोध्यापतिस्त्रिपात् । दिवोदासो रन्तिदेवो विष्णुदत्तो नरेश्वरः
    ॥ १०२॥ सद्धर्मरक्षणकृती निरोधगतिदोऽमृतः । जगतामाश्रयो नित्यो लोकातीतो महोदयः ॥ १०३॥ वेदैकवेद्यो वेदात्मा
    वेदानुग्रहकृत्प्रभुः । व्यापी वैकुण्ठनिलयो निजलीलारतिप्रियः ॥ १०४॥ अवतारितभक्तांशः समुद्धारत्वराकृतिः
    । दिव्यैकनिलयो दिव्यो दिव्यक्रीडारसोऽरसः ॥ १०५॥ नन्दो नन्दयिताऽऽनन्दी यशोदानन्दमन्दिरः । व्रजेश्वरो
    व्रजाध्यक्षो व्रजवैभवकारकः ॥ १०६॥ असुरमायाहृद्योगमायाजनककार्यकृत् । पूर्णब्रह्म परानन्दमात्रगात्रोऽविचिन्तनः
    ॥ १०७॥ परिपूर्णकलास्वामी सहस्रसुकलाधरः । भूभक्तप्रार्थितप्राप्यो भूभारहरणोदितः ॥ १०८॥ ब्रह्मेशेन्द्रादिदेवेड्यः
    पुरुषः पुरुषोत्तमः । असुरै रणकृत्त्राता मायेशो मोहकार्यकृत् ॥ १०९॥ वसुदेवः सत्त्वमूर्तिर्देवधानीनिवासकृत्
    । ब्रह्मादिसंस्तुतो देवो वासुदेवश्चतुर्भुजः ॥ ११०॥ व्याख्याताशेषमाहात्म्यः गोकुलानन्दकारकः । स्वव्यूहसंहरः
    सारः प्रयागचरितव्रतः ॥ १११॥ स्वकीयजनविज्ञातः स्वप्रियो जनरञ्जनः । महानन्दकरोऽमन्दगुणोदारो महोत्सवः
    ॥ ११२ गोगोपजनतानन्दः पूतनाप्राणहारकः । पूतनासुपयःपानप्रोद्धृतस्वीयबालकः ॥ ११३॥ मूलाविद्याहरः स्वीयचित्तरोधनपण्डितः
    । शकटासुरसंहारी स्वीयदोषनिवारकः ॥ ११४॥ पवनासुरभिद्भीष्मः मुरारिः सुतलार्दनः । गोस्वामी गोकुलपतिर्गोविन्दो
    नन्दलालितः ॥ ११५॥ गोपालो गोकुलाधीशो नवनीतप्रियः प्रभुः । दामोदरो भक्तवश्यो यमलार्जुनमुक्तिदः ॥ ११६॥
    अप्रमेयः प्रमेयात्मा बलदम्भविमर्दनः । कालियासुरहरः क्रोधदण्डनो मण्डनः सताम् ॥ ११७॥ प्राणपालो दिव्यजन्मा
    लीलाताण्डवपण्डितः । वृन्दावनचरः कान्तो मल्लो नटसमाम्बरः ॥ ११८॥ बर्हापीडः पीतवासा सूर्यभूषणभूषणः ।
    मुरलिनादमाधुर्यसमाहूतव्रजाङ्गनः ॥ ११९॥ योगमायाविरचितसर्वसेवाकृतार्थनः । लावण्यैकपरामूर्त्तिर्वृन्दारण्यपुरन्दरः
    ॥ १२०॥ परमापीच्यो गोपीड्यो वियोगहृतबन्धनः । सङ्गप्राप्तान्यमहिलामोहवान् वदतां वरः ॥ १२१॥ स्वकीयारतिदः
    कामी कामशास्त्रविशारदः । पुरन्ध्रीदोषहरणः स्वात्ममायाप्रदर्शकः ॥ १२२॥ गोपिकागीतमहिमा स्वदोषपरिबोधकः
    । श्रीगोकुलपतिः साक्षी कोटिमन्मथमन्मथः ॥ १२३॥ भक्तोत्तमर्णः सङ्कीर्णः सर्वानन्दकरो गुरुः । नृत्यलीलानुकरणस्त्रिभङ्गललिताकृतिः
    ॥ १२४॥ परमानन्दविस्तारो विस्मापितसुरेश्वरः । सर्वसौभाग्यसुफलः कामदोषनिवारकः ॥ १२५॥ अलौकिकगतिः शङ्खासुरचूडामणिप्रदः
    । प्रेमात्मको रुक्ममूर्तिः पराश्रयनिवारकः ॥ १२६॥ केशिहा वृषहा चैव नारदेड्यो नृपेश्वरः । अक्रूरवल्लभो
    भूमिभारहा यादवेश्वरः ॥ १२७॥ कंसारिर्दुष्टदमनो व्रती गुरुवरादृतः । जरासन्धवधोद्दामी यवनान्तकरो रविः
    ॥ १२८॥ मुचुकुन्दप्रियः श्रीशो द्वारकासौभगोदयः । रुक्मिणीशः स्मरकरः प्रद्युम्नो रतिवल्लभः ॥ १२९॥ सत्यभामापतिर्जाम्बवतीशो
    लक्ष्मणापतिः । भद्रापतिर्मित्रविन्दापतिः शैब्यापतिर्मखी ॥ १३०॥ कालिन्दिनीधवो धाता शतस्त्रीनायको युवा
    । षोडशस्त्रीसहस्रेशः सत्त्वसृष्टिपरायणः ॥ १३१॥ पाण्डवानन्दकरणः कौरवान्वयनाशनः । भूभारभूतराजन्यदैत्यसङ्घविनाशकः
    ॥ १३२॥ सुदामाभ्यर्थितः प्राप्तश्रुतदेवो निमिप्रियः । षड्गुणैश्वर्यसम्पन्नो निजभक्तानुरोधकृत् ॥ १३३॥
    ज्ञानगम्यः साङ्ख्यगम्यो भक्तिवश्यः कृतागमः । स्वरूपानन्दरमणः स्वाश्रयो निरपाश्रयः ॥ १३४॥ योगीश्चरैर्वन्दिताङ्घ्रिर्देवानन्दकरः
    प्रभुः । शेषभूतसमस्तात्मा परानन्दमितो हरिः ॥ १३५॥ फलश्रुतिः । इति श्रीगोकुलेशस्य प्रोक्तं नामसहस्रकम्
    । पठनाद्भावविज्ञानां भजनानन्ददायकम् ॥ १३६॥ श्रीमदार्यप्रसादेन प्राप्य श्रीशमहामनुम् । समर्च्य सम्पठेद्भक्त्या
    निग्रहानुग्रहक्षमः ॥ १३७॥ भवेत् पूज्यश्च महतां विद्यानां पारदृश्वनः । सर्वापराधैर्मुच्येत परचर्यासु
    सङ्गतैः ॥ १३८॥ भक्तिबीजमवाप्नोति प्राप्नोति च दृढां श्रियम् । ब्राह्मणो वेदवेदान्तसदाचारफलं लभेत्
    ॥ १३९॥ क्षत्रियो विजयी भक्तवत्सलो ब्राह्मणप्रियः । वैश्यो वित्तपतिर्भव्यो दाता भोक्ता भवेदयम् ॥ १४०॥
    शूद्रः शुद्धो भवेदस्माद् ब्रह्मण्यो हरिवल्लभः । भक्तो भक्तिं समाप्नोति कामी कामान् मनोगतान् ॥ १४१॥
    रोगार्तो मुच्यते रोगाद् बद्धो मुच्येत बन्धन्नात् । आपन्नश्चापदो मुच्येद् मुमुक्षुर्मुच्यते भयात् ॥
    १४२॥ सर्वात्मनेह गदितः श्रीलीलापुरुषोत्तमः । सर्वात्मभावलब्ध्यर्थं कामभावाप्तयेऽपि च ॥ १४३॥ नानेन
    सदृशं किञ्चित् श्रीपतेरतिवल्लभम् । तस्मादवश्यमभ्यस्यं वैष्णवैः पूजने हरेः ॥ १४४॥ वृन्दावने वटप्रान्ते
    तीर्थस्थाने गुरोर्गृहे । अभ्यस्य समवाप्नोति यजमानस्य बन्धुताम् ॥ १४५॥ परकृत्यासु घोरासु प्रेतादीनामुपद्रवे
    । तीर्थामधुसरैः
