id: subrahmanya-bhujanga-stotram
category: stotram
name:
  english: Subrahmanya Bhujanga Stotram
content:
  english: sada balarupa'pi vighnadrihantri mahadantivaktra'pi pancasyamanya | vidhindradimrigya ganeshabhidha
    me vidhattam shriyam ka'pi kalyanamurtih || || na janami shabdam na janami cartham na janami padyam
    na janami gadyam | cideka shadasya hridi dyotate me mukhannihsarante girashcapi citram || || mayuradhirudham
    mahavakyagudham manoharideham mahaccittageham | mahidevadevam mahavedabhavam mahadevabalam bhaje lokapalam
    || || yada sannidhanam gata manava me bhavambhodhiparam gataste tadaiva | iti vyanjayansindhutire
    ya aste tamide pavitram parashaktiputram || || yathabdhestaranga layam yanti tunga stathaivapadah
    sannidhau sevatam me | itivormipanktirnrinam darshayantam sada bhavaye hritsaroje guham tam || ||
    girau mannivase nara ye'dhirudha stada parvate rajate te'dhirudhah | itiva bruvangandhashailadhirudhah
    sa devo mude me sada shanmukho'stu || || mahambhodhitire mahapapacore munindranukule sugandhakhyashaile
    | guhayam vasantam svabhasa lasantam janartim harantam shrayamo guham tam || || lasatsvarnagehe nrinam
    kamadohe sumastomasanchannamanikyamance | samudyatsahasrarkatulyaprakasham sada bhavaye kartikeyam
    suresham || || ranathamsake manjule'tyantashone manoharilavanyapiyushapurne | manahshatpado me bhavakleshataptah
    sada modatam skanda te padapadme || || suvarnabhadivyambarairbhasamanam kvanatkinkinimekhalashobhamanam
    | lasaddhemapattena vidyotamanam katim bhavaye skanda te dipyamanam || || pulindeshakanyaghanabhogatunga
    stanalinganasaktakashmiraragam | namasyamyaham tarakare tavorah svabhaktavane sarvada sanuragam ||
    || vidhau klriptadandansvaliladhritanda nnirastebhashundandvishatkaladandan | hatendrarishandanjagatranashaunda
    nsada te pracandanshraye bahudandan || || sada sharadah shanmriganka yadi syuh samudyanta eva sthitashcetsamantat
    | sada purnabimbah kalankaishca hina stada tvanmukhanam bruve skanda samyam || || sphuranmandahasaih
    sahamsani canca tkatakshavalibhringasanghojjvalani | sudhasyandibimbadharanishasuno tavalokaye shanmukhambhoruhani
    || || vishaleshu karnantadirgheshvajasram dayasyandishu dvadashasvikshaneshu | mayishatkatakshah sakritpatitashce
    dbhavette dayashila ka nama hanih || || sutangodbhavo me'si jiveti shaddha japanmantramisho muda jighrate
    yan | jagadbharabhridbhyo jagannatha tebhyah kiritojjvalebhyo namo mastakebhyah || || sphuradratnakeyuraharabhirama
    shcalatkundalashrilasadgandabhagah | katau pitavasah kare carushaktih purastanmamastam purarestanujah
    || || ihayahi vatseti hastanprasarya hvayatyadaracchankare maturankat | samutpatya tatam shrayantam
    kumaram harashlishtagatram bhaje balamurtim || || kumareshasuno guha skanda sena pate shaktipane mayuradhirudha
    | pulindatmajakanta bhaktartiharin prabho tarakare sada raksha mam tvam || || prashantendriye nashtasanjne
    viceshte kaphodgarivaktre bhayotkampigatre | prayanonmukhe mayyanathe tadanim drutam me dayalo bhavagre
    guha tvam || || kritantasya duteshu candeshu kopa ddahacchinddhi bhinddhiti mam tarjayatsu | mayuram
    samaruhya ma bhairiti tvam purah shaktipanirmamayahi shighram || || pranamyasakritpadayoste patitva
    prasadya prabho prarthaye'nekavaram | na vaktum kshamo'ham tadanim kripabdhe na karyantakale managapyupeksha
    || || sahasrandabhokta tvaya shuranama hatastarakah simhavaktrashca daityah | mamantarhridistham manahkleshamekam
    na hamsi prabho kim karomi kva yami || || aham sarvada duhkhabharavasanno bhavandinabandhustvadanyam
    na yace | bhavadbhaktirodham sada klriptabadham mamadhim drutam nashayomasuta tvam || || apasmarakushtakshayarshah
    prameha jvaronmadagulmadiroga mahantah | pishacashca sarve bhavatpatrabhutim vilokya kshanattarakare
    dravante || || drishi skandamurtih shrutau skandakirti rmukhe me pavitram sada taccaritram | kare
    tasya krityam vapustasya bhrityam guhe santu lina mamasheshabhavah || || muninamutaho nrinam bhaktibhaja
    mabhishtapradah santi sarvatra devah | nrinamantyajanamapi svarthadane guhaddevamanyam na jane na
    jane || || kalatram suta bandhuvargah pashurva naro vatha nari grihe ye madiyah | yajanto namantah
    stuvanto bhavantam smarantashca te santu sarve kumara || || mrigah pakshino damshaka ye ca dushta
    statha vyadhayo badhaka ye madange | bhavacchaktitikshnagrabhinnah sudure vinashyantu te curnitakrauncashaila
    || || janitri pita ca svaputraparadham sahete na kim devasenadhinatha | aham catibalo bhavan lokatatah
    kshamasvaparadham samastam mahesha || || namah kekine shaktaye capi tubhyam namashchaga tubhyam namah
    kukkutaya | namah sindhave sindhudeshaya tubhyam punah skandamurte namaste namo'stu || || jayanandabhumam
    jayaparadhamam jayamoghakirte jayanandamurte | jayanandasindho jayasheshabandho jaya tvam sada muktidaneshasuno
    || || bhujangakhyavrittena klriptam stavam yah pathedbhaktiyukto guham sampranamya | sa putrankalatram
    dhanam dirghamayu rlabhetskandasayujyamante narah sah ||
  devanagari: सदा बालरूपाऽपि विघ्नाद्रिहन्त्री महादन्तिवक्त्राऽपि पञ्चास्यमान्या । विधीन्द्रादिमृग्या
    गणेशाभिधा मे विधत्तां श्रियं काऽपि कल्याणमूर्तिः ॥ ॥ न जानामि शब्दं न जानामि चार्थं न जानामि पद्यं
    न जानामि गद्यम् । चिदेका षडास्या हृदि द्योतते मे मुखान्निःसरन्ते गिरश्चापि चित्रम् ॥ ॥ मयूराधिरूढं
    महावाक्यगूढं मनोहारिदेहं महच्चित्तगेहम् । महीदेवदेवं महावेदभावं महादेवबालं भजे लोकपालम् ॥ ॥ यदा सन्निधानं
    गता मानवा मे भवाम्भोधिपारं गतास्ते तदैव । इति व्यञ्जयन्सिन्धुतीरे य आस्ते तमीडे पवित्रं पराशक्तिपुत्रम्
    ॥ ॥ यथाब्धेस्तरङ्गा लयं यान्ति तुङ्गा स्तथैवापदः सन्निधौ सेवतां मे । इतीवोर्मिपङ्क्तीर्नृणां दर्शयन्तं
    सदा भावये हृत्सरोजे गुहं तम् ॥ ॥ गिरौ मन्निवासे नरा येऽधिरूढा स्तदा पर्वते राजते तेऽधिरूढाः । इतीव
    ब्रुवन्गन्धशैलाधिरूढः स देवो मुदे मे सदा षण्मुखोऽस्तु ॥ ॥ महाम्भोधितीरे महापापचोरे मुनीन्द्रानुकूले
    सुगन्धाख्यशैले । गुहायां वसन्तं स्वभासा लसन्तं जनार्तिं हरन्तं श्रयामो गुहं तम् ॥ ॥ लसत्स्वर्णगेहे
    नृणां कामदोहे सुमस्तोमसञ्छन्नमाणिक्यमञ्चे । समुद्यत्सहस्रार्कतुल्यप्रकाशं सदा भावये कार्तिकेयं सुरेशम्
    ॥ ॥ रणथंसके मञ्जुलेऽत्यन्तशोणे मनोहारिलावण्यपीयूषपूर्णे । मनःषट्पदो मे भवक्लेशतप्तः सदा मोदतां स्कन्द
    ते पादपद्मे ॥ ॥ सुवर्णाभदिव्याम्बरैर्भासमानां क्वणत्किङ्किणीमेखलाशोभमानाम् । लसद्धेमपट्टेन विद्योतमानं
    कटिं भावये स्कन्द ते दीप्यमानाम् ॥ ॥ पुलिन्देशकन्याघनाभोगतुङ्ग स्तनालिङ्गनासक्तकाश्मीररागम् । नमस्याम्यहं
    तारकारे तवोरः स्वभक्तावने सर्वदा सानुरागम् ॥ ॥ विधौ क्लृप्तदण्डान्स्वलीलाधृताण्डा न्निरस्तेभशुण्डान्द्विषत्कालदण्डान्
    । हतेन्द्रारिषण्डान्जगत्राणशौण्डा न्सदा ते प्रचण्डान्श्रये बाहुदण्डान् ॥ ॥ सदा शारदाः षण्मृगाङ्का
    यदि स्युः समुद्यन्त एव स्थिताश्चेत्समन्तात् । सदा पूर्णबिम्बाः कलङ्कैश्च हीना स्तदा त्वन्मुखानां ब्रुवे
    स्कन्द साम्यम् ॥ ॥ स्फुरन्मन्दहासैः सहंसानि चञ्च त्कटाक्षावलीभृङ्गसङ्घोज्ज्वलानि । सुधास्यन्दिबिम्बाधराणीशसूनो
    तवालोकये षण्मुखाम्भोरुहाणि ॥ ॥ विशालेषु कर्णान्तदीर्घेष्वजस्रं दयास्यन्दिषु द्वादशस्वीक्षणेषु । मयीषत्कटाक्षः
    सकृत्पातितश्चे द्भवेत्ते दयाशील का नाम हानिः ॥ ॥ सुताङ्गोद्भवो मेऽसि जीवेति षड्धा जपन्मन्त्रमीशो मुदा
    जिघ्रते यान् । जगद्भारभृद्भ्यो जगन्नाथ तेभ्यः किरीटोज्ज्वलेभ्यो नमो मस्तकेभ्यः ॥ ॥ स्फुरद्रत्नकेयूरहाराभिराम
    श्चलत्कुण्डलश्रीलसद्गण्डभागः । कटौ पीतवासाः करे चारुशक्तिः पुरस्तान्ममास्तां पुरारेस्तनूजः ॥ ॥ इहायाहि
    वत्सेति हस्तान्प्रसार्या ह्वयत्यादराच्छङ्करे मातुरङ्कात् । समुत्पत्य तातं श्रयन्तं कुमारं हराश्लिष्टगात्रं
    भजे बालमूर्तिम् ॥ ॥ कुमारेशसूनो गुह स्कन्द सेना पते शक्तिपाणे मयूराधिरूढ । पुलिन्दात्मजाकान्त भक्तार्तिहारिन्
    प्रभो तारकारे सदा रक्ष मां त्वम् ॥ ॥ प्रशान्तेन्द्रिये नष्टसञ्ज्ञे विचेष्टे कफोद्गारिवक्त्रे भयोत्कम्पिगात्रे
    । प्रयाणोन्मुखे मय्यनाथे तदानीं द्रुतं मे दयालो भवाग्रे गुह त्वम् ॥ ॥ कृतान्तस्य दूतेषु चण्डेषु कोपा
    द्दहच्छिन्द्धि भिन्द्धीति मां तर्जयत्सु । मयूरं समारुह्य मा भैरिति त्वं पुरः शक्तिपाणिर्ममायाहि शीघ्रम्
    ॥ ॥ प्रणम्यासकृत्पादयोस्ते पतित्वा प्रसाद्य प्रभो प्रार्थयेऽनेकवारम् । न वक्तुं क्षमोऽहं तदानीं कृपाब्धे
    न कार्यान्तकाले मनागप्युपेक्षा ॥ ॥ सहस्राण्डभोक्ता त्वया शूरनामा हतस्तारकः सिंहवक्त्रश्च दैत्यः ।
    ममान्तर्हृदिस्थं मनःक्लेशमेकं न हंसि प्रभो किं करोमि क्व यामि ॥ ॥ अहं सर्वदा दुःखभारावसन्नो भवान्दीनबन्धुस्त्वदन्यं
    न याचे । भवद्भक्तिरोधं सदा क्लृप्तबाधं ममाधिं द्रुतं नाशयोमासुत त्वम् ॥ ॥ अपस्मारकुष्टक्षयार्शः प्रमेह
    ज्वरोन्मादगुल्मादिरोगा महान्तः । पिशाचाश्च सर्वे भवत्पत्रभूतिं विलोक्य क्षणात्तारकारे द्रवन्ते ॥ ॥
    दृशि स्कन्दमूर्तिः श्रुतौ स्कन्दकीर्ति र्मुखे मे पवित्रं सदा तच्चरित्रम् । करे तस्य कृत्यं वपुस्तस्य
    भृत्यं गुहे सन्तु लीना ममाशेषभावाः ॥ ॥ मुनीनामुताहो नृणां भक्तिभाजा मभीष्टप्रदाः सन्ति सर्वत्र देवाः
    । नृणामन्त्यजानामपि स्वार्थदाने गुहाद्देवमन्यं न जाने न जाने ॥ ॥ कलत्रं सुता बन्धुवर्गः पशुर्वा नरो
    वाथ नारी गृहे ये मदीयाः । यजन्तो नमन्तः स्तुवन्तो भवन्तं स्मरन्तश्च ते सन्तु सर्वे कुमार ॥ ॥ मृगाः
    पक्षिणो दंशका ये च दुष्टा स्तथा व्याधयो बाधका ये मदङ्गे । भवच्छक्तितीक्ष्णाग्रभिन्नाः सुदूरे विनश्यन्तु
    ते चूर्णितक्रौञ्चशैल ॥ ॥ जनित्री पिता च स्वपुत्रापराधं सहेते न किं देवसेनाधिनाथ । अहं चातिबालो भवान्
    लोकतातः क्षमस्वापराधं समस्तं महेश ॥ ॥ नमः केकिने शक्तये चापि तुभ्यं नमश्छाग तुभ्यं नमः कुक्कुटाय ।
    नमः सिन्धवे सिन्धुदेशाय तुभ्यं पुनः स्कन्दमूर्ते नमस्ते नमोऽस्तु ॥ ॥ जयानन्दभूमं जयापारधामं जयामोघकीर्ते
    जयानन्दमूर्ते । जयानन्दसिन्धो जयाशेषबन्धो जय त्वं सदा मुक्तिदानेशसूनो ॥ ॥ भुजङ्गाख्यवृत्तेन क्लृप्तं
    स्तवं यः पठेद्भक्तियुक्तो गुहं सम्प्रणम्य । स पुत्रान्कलत्रं धनं दीर्घमायु र्लभेत्स्कन्दसायुज्यमन्ते
    नरः सः ॥
