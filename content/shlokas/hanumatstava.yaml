id: hanumatstava
category: stotram
name:
  english: hanumatstava
  devanagari: हनुमत्स्तव
content:
  english: shrihanumatstavah kandarpakotilavanyam sarvavidyavisharadam | udyadadityasankashamudarabhujavikramam
    || 1|| shriramahridayanandam bhaktakalpamahiruham | abhayam varadam dorbhyam kalaye marutatmajam ||
    2|| vamahastam mahakritsnam dashasyashirakhandanam | udyaddakshinadordandam hanumantam vicintayet
    || 3|| balarkayutatejasam tribhuvanaprakshobhakam sundaram sugrivadyakhilaplavanganikarairaradhitam
    sanjalim | nadenaiva samastarakshasaganan santrasayantam prabhum shrimadramapadambujasmritiratam dhyayami
    vatatmajam || 4|| amishikritamartandam goshpadikritasagaram | trinikritadashagrivamanjaneyam namamyaham
    || 5|| citte me purnabodho'stu vaci me bhatu bharati | kriyasurguravah sarve dayam mayi dayalavah
    || 6|| iti shrihanumatstavah sampurnah |
  devanagari: श्रीहनुमत्स्तवः कन्दर्पकोटिलावण्यं सर्वविद्याविशारदम् । उद्यदादित्यसङ्काशमुदारभुजविक्रमम्
    ॥ १॥ श्रीरामहृदयानन्दं भक्तकल्पमहीरुहम् । अभयं वरदं दोर्भ्यां कलये मारुतात्मजम् ॥ २॥ वामहस्तं महाकृत्स्नं
    दशास्यशिरखण्डनम् । उद्यद्दक्षिणदोर्दण्डं हनूमन्तं विचिन्तयेत् ॥ ३॥ बालार्कायुततेजसं त्रिभुवनप्रक्षोभकं
    सुन्दरं सुग्रीवाद्यखिलप्लवङ्गनिकरैराराधितं साञ्जलिम् । नादेनैव समस्तराक्षसगणान् सन्त्रासयन्तं प्रभुं
    श्रीमद्रामपदाम्बुजस्मृतिरतं ध्यायामि वातात्मजम् ॥ ४॥ आमिषीकृतमार्ताण्डं गोष्पदीकृतसागरम् । तृणीकृतदशग्रीवमाञ्जनेयं
    नमाम्यहम् ॥ ५॥ चित्ते मे पूर्णबोधोऽस्तु वाचि मे भातु भारती । क्रियासुर्गुरवः सर्वे दयां मयि दयालवः
    ॥ ६॥ इति श्रीहनुमत्स्तवः सम्पूर्णः ।
