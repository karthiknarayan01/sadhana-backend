id: kyts-3-3-agne-tejasvintejasvee-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 3.3 Agne Tejasvintejasvee - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ntritiyakande tritiyah prashnah vaikritavidhinamabhidhanam
    o shri gurubhyo namah | harih om || agne tejasvi ndeveshu bhuyastejasvanta mmanushyeshu kuru dikshayai
    ca tva tapasashca tejase juhomi tejovidasi tejo ma ma hasinma ntejo hasidindraujasvinnojasvi tva ndeveshu
    bhuya ojasvanta mmanushyeshu kuru brahmanashca tva kshatrasya cau dasyojo ma ma hasinma ndeveshu bhuya
    bhrajasvanta mmanushyeshu kuru vayoshca tva 'panca bhrajase juhomisuvarvidasi suvarma ma hasinma mmayyagnistejo
    dadhatu mayi medha mmayindra indriya ndadhatu mayi medha mmayi suryo bhrajo dadhatu || 'gnih prastota
    prajapati ssama brihaspatirudgata vishve deva upagataro marutah pratihartara indro nidhanante devah
    pranabhritah prana mmayi dadhatvetadvai sarvamaddhvaryu rupakurvannudgatribhya upakaroti te devah
    pranabhritah prana mmayi dadhatvityahaitadeva savarmatma ndhatta ida devahu rmanu rbrihaspatirukthamadani
    shagmsisha suktavacah prithivi ktavacah prithivi matarma mahigmsi rmadhu manishye madhu janishye madhuvakshyami
    madhuvadishyami madhumati ndevebhyo vacamudyasagm shushrushenya mma deva avantu shobhayai pitaro vasavastva
    pravahantu gayatrena chandasa mpatha upehi rudrastva pravrihantu traishtubhena chandasendrasya priya
    hyadityastva pravrihantu jagatena chandasa vishvesha mpatha upehi mandasu te shukra shukrama dhunomi
    bhandanasu kotanasu nutanasu reshishu meshishu vashishu vishvabhrithsu maddhvishu kakuhasu shakvarishu
    shukrasu te shukra shukrama dhunomi shukra nte shukrena grihnamyahno rupena suryasya rashmibhih ||
    a 'sminnugra acucyavurdivo dhara asashcata || kakuhagm rupam vri~shabhasya rocate briha shshukrasya
    purogah || ya nnama jagrivi tasmai te soma somaya svahoshi ndeva soma gayatrena chandasa mpatho apihi
    vashi tva ndeva soma traishtubhena chandasendrasya priya ndeva soma jagatena chandasa vishvesha mpatho
    apihya nah prana etu paravata a 'ntarikshaddivaspari | ayuh prithivya addhyamritamasi pranaya tva
    || indragni me varcah krinutam ssomo brihaspatih | varco me vishvedeva varco me dhattamashvina ||
    dadhanve va yadimanu vocadbrahmani veru tat | pari vishvani kavya nemishcakramiva bhavat || ya~dadhava
    mandasu te shukra shukrama dhunomityahapameva namadheyena guhyena divo vrishtimava rundhe shukra nte
    shukrena grihnamityahaitadva ahno rupam ssuryasya rashmayo vrishtya ishate 'hna eva rupena suryasya
    rashmibhirdivo vrishti acucyavurityaha acucyavurityaha yathayajurevaita vri~shabhasya rocate brihadityahaitadva
    asya kakuhagm rupam dvrishti rupenaiva vrishtimava rundhe yatte somada nnama jagrivityahaisha ha vai
    havisha haviryajati yo ngrihitva somaya juhotipara va etasya ngrihnatya nah prana etu paravata ityaha
    ''yureva pranamatma ndhatte 'mritamasi pranaya tveti hiranyamabhi vyanityamritam vai~ hiranyamayuh
    prano mbhavati shatayuh purusha shshatendriya ayushyevendriye pratitishthatyapa upa sprishati bheshajam
    va~ apo bheshajameva kurute || vayurasi prano nama savituradhipatye mme dashcakshurasi shrotra nnama
    dhaturadhipatya ayurme da rupamasi varno nama brihaspateradhipatye praja mme da ritamasi satya mme
    da bhutamasi bhavya nnama pitrinamadhipatye ndha ritasya tva vyomana ritasya tva vibhumana ritasya
    tva vidharmana ritasya tva satyayartasya tva jyotishe prajapati rvirajamapashya nca srijata tamrishibhyastiro
    ttaya vai sa prishnin kamanasrijata ta tprishnayo grihyante prishnineva taih kaman 'va rundhe vayurasi
    prano nametyaha pranapanavevava rundhe cakshurasi shrotra ''yurevava rundhe rupamasi varno nametyaha
    prajamevava rundharitamasi satya nnametyaha kshatramevava rundhe bhutamasi bhavya nnametyaha pashavo
    va apamoshadhina va rundha etavadvai purusha mparitastadevava rundha ritasya tva vyomana ityaheyam
    va~ ritasya vyomemamevabhi jayatyritasya tva vibhumana ityaha va~ ritasya vibhumantarikshamevabhi
    jayatyritasya tva vidharmana ityaha dyaurva ritasya vidharma divamevabhi jayatyritasya tva satyayetyaha
    tva satyayetyaha disho va ritasya satya ndisha evabhi jayatyritasya tva jyotisha ityaha suvargo vai
    loka ritasya jyotih suvargameva lokamabhi jayatyetavanto vai devalokastanevabhi jayati dasha sampadyante
    dasha dvirajyevannadye pratitishthati || vidharma divamevabhi jayatyritasya dyajnena navarundhata
    ta tpare grihyante yadeva yajnenanavarundhe tasyavaruddhyai ya ngrihnatimameva tena lokamabhi jayatiya
    ndvitiyamantariksha ntritiyamamumeva tena lokamabhi jayati yadete grihyanta esham ~lokana uttareshvahah
    svamuto 'rvanco grihyante 'bhijityaivemam mpratyavarohanti ya tpurveshvahah svitah para nco grihyante
    tasmaditah para nca ime loka yaduttareshvahah svamuto 'rvanco grihyante tasmadamuto 'rvanca ime lokastasmadayatayamno
    loka nmanushya upa jivanti brahmavadino vadanti kasma thsatyadadbhya oshadhaya mpraja anu prajayanta
    iti parananviti bruya dgrihnatyadbhyastvaushadhibhyo grihnamiti tasmadadbhya oshadhaya dgrihnatyoshadhibhyastva
    prajabhyo grihnamiti tasmadoshadhayo manushyanamannam dgrihnati prajabhyastva prajapataye grihnamiti
    tasma mpraja anu prajayante || 'shta catvarigmshacca prajapatirdevasurana srijata tadanu yajno nchandagmsi
    te vishvanco vyakraman nchandagmsi te deva amanyantami va idamabhuvan sma iti te prajapatimupa prajapatishchandasam
    vi~ryamadaya tadvah pra da syamiti sa chandasam ttadanu chandagsyapa 'kraman chandagmsi yajnastato
    deva abhava 'stu shraushad yaja ye yajamahe vashatkaro bhavatyatmana para 'sya bhratrivyo bhavati
    brahmavadino vadanti kasmai kamaddhvaryura shravayatiti chandasam vi~ryayeti bruyade ta vi~ryama shravaya
    'stu shraushad yaja ye yajamahe vashatkaro ya evam ryaireva chandobhirarcati ya ncarcati yadindro
    vritramahanna ntadatha kasmadaindro yajna a sagg sthatorityahurindrasya va esha yajniya tanurya dyajnastameva
    ta dyajanti ya evam ayurda agne havisho jushano ghritapratiko ghritayoniredhi | ghrita mpitva madhucaru
    gavya mpitevaputramabhi rakshatadimam || a vrishcyate va eta vabhrithamavaityayurda agne havisho jushana
    ityavabhrithamavaishyan juhuyadahutyaivainau shamayati na ''rtimarcchati yajamano ya mmayi yena yamasya
    balina carami | ihaiva sa ttadagne anrino bhavami | vishvalopa vishvadavasya tva ''sanjuhomyagdhadeko
    'hutadekah samasanadekah | tenah krinvantu bheshajagm sada ssaggsphano abhi rakshatu | grihanamasamartyai
    bahavo no griha asann || sa tvanno | punarno nashtama kridhi punarno rayima kridhi || deva sagg sphana
    sahasraposhasyeshishe sa no rasva 'jyanigm rayasposhagm suviryagm sam va~thsarinag svastim || agnirvava
    yama iyam dyamasya yajamana a datte yadoshadhibhirvedigg strinati yadanupaushya prayaya mamushmin
    ~loke neniyeran tkusidamapratitta mmayityupaushatihaiva san lo~kametiyadi mishramiva caredanjalina
    saktu npradavye juhuyadesha va agnirvai tpradavyah sa evainaggsvadayatyahnam mpaktva prataretena kaksha
    mbhavati yadi na dahati papasamametena hasma va rishayah pura vijnanena dirghasatramupa yanti yo va
    upadrashtaramupa shrotaramanukhyataram yajate samamushmin ~loka ishtapurtena gacchate 'gnirva upadrashta
    vayurupashrota ''dityo yajate samamushmin ~loka ishtapurtena gacchate 'ya ityahagnirvai nabhasa puro
    'gnimeva tadahaitanme gopayeti sa tva nno nabhasaspata ityaha vayurvai nabhasaspatirvayumeva tadahaitanme
    gopayeti deva sagg 'sau va adityo deva ssaggsphana adityameva tadahaitanme gopayeti || adityameva
    tadahaitanme gopayeti mpari vo dadami tena kridantishcarata priyena | ma nah shapta janusha subhaga
    rayasposhena samisha madema || namo mahimna uta cakshushe te maruta ngrinami | anu manyasva suyaja
    yajama jushta ndevanamidamastu havyam || devanamesha upanaha asidapa ngarbha oshadhishu nyaktah |
    somasya draphsamavrinita pusha ttadesham || pita vathsana mpatiraghniyanamatho pita mahata ngargaranam
    | vathso jarayu pratidhu kpiyusha amiksha mastu ghritamasya retah || tva 'vrinata rajyaya tvagm havanta
    marutah svarkah | var shman kshatrasya kakubhi shishriyanastato na ugro vi bhaja vasuni || vyriddhena
    va esha pashuna yajate yasyaitani na kriyanta esha ha tvai samriddhena yajate yasyaitani kriyante
    suryo devo divishadbhyo dhata kshatraya vayuh prajabhyah | brihaspatistva prajapataye jyotishmati
    | anganyahruta yasyai ta ssamajigamam || a vartana vartaya ni nivartana vartayendra nardabuda | bhumyashcatasrah
    pradishastabhira vartaya punah || vi te bhinadmi takarim nca jarayu ca || bahiste astu baliti || urudraphso
    vishvarupa induh pavamano dhira ananja garbha m || ekapadi dvipadi tripadi catushpadi pancapadi shatpadi
    saptapadyashtapadi bhuvana 'nu prathatag svaha || mahi dyauh prithivi ca na imam mmimikshatam | pipritanno
    bharimabhih || catushcatvarigmshacca va~masye havih priyamindrabrihaspati | uktha mmadashca shasyate
    || ayam mpari shicyate somaindrabrihaspati | carurmadaya pitaye || asme indrabrihaspati rayi m | ashvavantagm
    sahasrina m || brihaspatirnah paripatu pashcadutottarasmadadharadaghayoh | indrah purastaduta maddhyato
    na ssakha sakhibhyo varivah krinotu || vi te vishvagvatajutaso agne bhamasa shuce shucayashcaranti
    | shshuce shucayashcaranti | tuvimrakshaso divya navagva vana vananti dhrishata rujantah || tvamagne
    manushiridate visho hotravidam vi~vicigm ratnadhatamam | guha santagm subhaga vishvadar ntu vishmanasagm
    suyaja m || dhata dadatu no rayimishano jagataspatih | sa nah purnena vavanat || dhata prajaya uta
    raya ishe dhatedam njajana | dhata putram nghritavadvidhema || dhata dadatu no rayi njivatumakshitam
    | vaya ndevasya dhimahi sumatigm satyaradhasah || dhata dadatu dashushe vasuni prajakamaya midhushe
    durone | tasmai deva amrita vi~shve devaso aditi ndeveshu manyatam | agnishca havyavahano bhavata
    ndashushe mayah || anvidanumate tva manyasai shancanah kridhi | mmanyasai shancanah kridhi | kratve
    dakshaya no hinu prana ayugmshi tarishah || anu manyata manumanyamana prajavantagm rayimakshiyamanam
    | tasyai vayagm hedasi ma 'pi bhuma sa no devi suhava sharma yacchatu || yasyamida mpradishi yadvirocate
    mprati bhushantyayavah | yasya upastha urvantarikshagm sa no devi suhava sharma yacchatu || || rakamahagm
    suhavagm sushtuti huve shrinotu na ssubhaga bodhatu tmana | sivyatvapah sucya 'cchidyamanaya dadatu
    viragm shatadayamukthya m || yaste rake sumatayah supeshaso yabhirdadasi dashushe vasuni | tabhirno
    adya sumana upagahi sahasraposhagm subhage rarana || sinivali ya supanih || kuhumahagm subhagam vi~dmanapasamasmin
    njohavimi | sa no dadatu shravana ste devi havisha vidhema || kuhu rdevanamamritasya patni havya no
    asya havishashciketu | sa ndashushe kiratu bhuri vamagm rayasposha ncikitushe dadhatu || mantarikshagm
    sa no devi suhava sharma yacchatu ~vayurasi prano nama deva vai yadyajnenana prajapati rdevasura ||
    harih om || || krishna yajurvediya taittiriya samhitaya ntritiyakande tritiyah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया न्तृतीयकाण्डे तृतीयः प्रश्नः वैकृतविधीनामभिधानं ओ श्री
    गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ अग्ने॑ तेजस्वि न्दे॒वेषु॑ भूया॒स्तेज॑स्वन्त॒ म्मनु॒ष्ये॑षु कुरु दी॒क्षायै॑
    च त्वा॒ तप॑सश्च॒ तेज॑से जुहोमि तेजो॒विद॑सि॒ तेजो॑ मा॒ मा हा॑सी॒न्मा न्तेजो॑ हासी॒दिन्द्रौ॑जस्विन्नोज॒स्वी
    त्व न्दे॒वेषु॑ भूया॒ ओज॑स्वन्त॒ म्मनु॒ष्ये॑षु कुरु॒ ब्रह्म॑णश्च त्वा क्ष॒त्रस्य॒ चौ द॒स्योजो॑ मा॒
    मा हा॑सी॒न्मा न्दे॒वेषु॑ भूया॒ भ्राज॑स्वन्त॒ म्मनु॒ष्ये॑षु कुरु वा॒योश्च॑ त्वा॒ ऽपाञ्च॒ भ्राज॑से जुहोमिसुव॒र्विद॑सि॒
    सुव॑र्मा॒ मा हा॑सी॒न्मा म्मय्य॒ग्निस्तेजो॑ दधातु॒ मयि॑ मे॒धा म्मयीन्द्र॑ इन्द्रि॒य न्द॑धातु॒ मयि॑
    मे॒धा म्मयि॒ सूर्यो॒ भ्राजो॑ दधातु ॥ ऽग्निः प्र॑स्तो॒ता प्र॒जाप॑ति॒ स्साम॒ बृह॒स्पति॑रुद्गा॒ता विश्वे॑
    दे॒वा उ॑पगा॒तारो॑ म॒रुतः॑ प्रतिह॒र्तार॒ इन्द्रो॑ नि॒धन॒न्ते दे॒वाः प्रा॑ण॒भृतः॑ प्रा॒ण म्मयि॑ दधत्वे॒तद्वै
    सर्व॑मद्ध्व॒र्यु रु॑पाकु॒र्वन्नु॑द्गा॒तृभ्य॑ उ॒पाक॑रोति॒ ते दे॒वाः प्रा॑ण॒भृतः॑ प्रा॒ण म्मयि॑ दध॒त्वित्या॑है॒तदे॒व
    सव॑र्मा॒त्म न्ध॑त्त॒ इडा॑ देव॒हू र्मनु॑ र्बृह॒स्पति॑रुक्थाम॒दानि॑ शग्ंसिष॒ सू॒क्त॒वाचः॒ पृथि॑वि क्त॒वाचः॒
    पृथि॑वि मात॒र्मा मा॑हिग्ंसी॒ र्मधु॑ मनिष्ये॒ मधु॑ जनिष्ये॒ मधु॑वक्ष्यामि॒ मधु॑वदिष्यामि॒ मधु॑मती न्दे॒वेभ्यो॒
    वाच॑मुद्यासग्ं शुश्रू॒षेण्या म्मा॑ दे॒वा अ॑वन्तु शो॒भायै॑ पि॒तरो वस॑वस्त्वा॒ प्रव॑हन्तु गाय॒त्रेण॒
    छन्द॑सा॒ म्पाथ॒ उपे॑हि रु॒द्रास्त्वा॒ प्रवृ॑हन्तु॒ त्रैष्टु॑भेन॒ छन्द॒सेन्द्र॑स्य प्रि॒य ह्यादि॒त्यास्त्वा॒
    प्रवृ॑हन्तु॒ जाग॑तेन॒ छन्द॑सा॒ विश्वे॑षा म्पाथ॒ उपे॑हि॒ मान्दा॑सु ते शुक्र शु॒क्रमा धू॑नोमि भ॒न्दना॑सु॒
    कोत॑नासु॒ नूत॑नासु॒ रेशी॑षु॒ मेषी॑षु॒ वाशी॑षु विश्व॒भृथ्सु॒ माद्ध्वी॑षु ककु॒हासु॒ शक्व॑रीषु शु॒क्रासु॑
    ते शुक्र शु॒क्रमा धू॑नोमि शु॒क्र न्ते॑ शु॒क्रेण॑ गृह्णा॒म्यह्नो॑ रू॒पेण॒ सूर्य॑स्य र॒श्मिभिः॑ ॥ आ
    ऽस्मि॑न्नु॒ग्रा अ॑चुच्यवुर्दि॒वो धारा॑ असश्चत ॥ क॒कु॒हग्ं रू॒पं वृँ॑ष॒भस्य॑ रोचते बृ॒ह श्शु॒क्रस्य॑
    पुरो॒गाः ॥ य न्नाम॒ जागृ॑वि॒ तस्मै॑ ते सोम॒ सोमा॑य॒ स्वाहो॒शि न्दे॑व सोम गाय॒त्रेण॒ छन्द॑सा॒ म्पाथो॒
    अपी॑हि व॒शी त्व न्दे॑व सोम॒ त्रैष्टु॑भेन॒ छन्द॒सेन्द्र॑स्य प्रि॒य न्दे॑व सोम॒ जाग॑तेन॒ छन्द॑सा॒ विश्वे॑षा
    म्पाथो॒ अपी॒ह्या नः॑ प्रा॒ण ए॑तु परा॒वत॒ आ ऽन्तरि॑क्षाद्दि॒वस्परि॑ । आयुः॑ पृथि॒व्या अद्ध्य॒मृत॑मसि
    प्रा॒णाय॑ त्वा ॥ इ॒न्द्रा॒ग्नी मे॒ वर्चः॑ कृणुतां॒ स्सोमो॒ बृह॒स्पतिः॑ । वर्चो॑ मे॒ विश्वे॑दे॒वा वर्चो॑
    मे धत्तमश्विना ॥ द॒ध॒न्वे वा॒ यदी॒मनु॒ वोच॒द्ब्रह्मा॑णि॒ वेरु॒ तत् । परि॒ विश्वा॑नि॒ काव्या॑ ने॒मिश्च॒क्रमि॑वा
    भवत् ॥ यँदा॑धा॒वा मान्दा॑सु ते शुक्र शु॒क्रमा धू॑नो॒मीत्या॑हा॒पामे॒व ना॑म॒धेये॑न॒ गुह्ये॑न दि॒वो वृष्टि॒मव॑
    रुन्धे शु॒क्र न्ते॑ शु॒क्रेण॑ गृह्णा॒मीत्या॑है॒तद्वा अह्नो॑ रू॒पं स्सूर्य॑स्य र॒श्मयो॒ वृष्ट्या॑ ईश॒ते
    ऽह्न॑ ए॒व रू॒पेण॒ सूर्य॑स्य र॒श्मिभि॑र्दि॒वो वृष्टि॑ अ॒चु॒च्य॒वु॒रित्या॑ह अ॑चुच्यवु॒रित्या॑ह यथाय॒जुरे॒वैत
