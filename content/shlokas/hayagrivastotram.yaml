id: hayagrivastotram
category: stotram
name:
  english: hayagrivastotram
  devanagari: हयग्रीवस्तोत्रम्
content:
  english: shrihayagrivastotram shri ganeshaya namah | shriman venkatanatharyah kavitarkikakesari | vedantacaryavaryo
    me sannidhattam sada hridi || jnananandamayam devam nirmalasphatikakritim | adharam sarvavidyanam
    hayagrivamupasmahe || 1|| svatah siddham shuddhasphatikamanibhubhritpratibhatam sudhasadhricibhirdyutibhiravadatatribhuvanam
    | anantaistrayyantairanuvihitaheshahalahalam hatasheshavadyam hayavadanamidemahi mahah || 2|| samaharah
    samnam pratipadamricam dhama yajusham layah pratyuhanam laharivitatirbodhajaladheh | kathadarpakshubhyatkathakakulakolahalabhavam
    haratvantardhvantam hayavadanaheshahalahalah || 3|| praci sandhya kacidantarnishayah prajnadrishteranjanashrirapurva
    | vaktri vedanbhatu me vajivaktra vagishakhya vasudevasya murtih || 4|| vishuddhavijnanaghanasvarupam
    vijnanavishrananabaddhadiksham | dayanidhim dehabhritam sharanyam devam hayagrivamaham prapadye ||
    5|| apaurusheyairapi vakprapancairadyapi te bhutimadrishtaparam | stuvannaham mugdha iti tvayaiva
    karunyato natha katakshaniyah || 6|| dakshinyaramya girishasya murtirdevi sarojasanadharmapatni |
    vyasadayo'pi vyapadeshyavacah sphuranti sarve tava shaktileshaih || 7|| mando'bhavishyanniyatam virinco
    vacam nidhe vancitabhagadheyah | daityapanitandayaryeva bhuyo'pyadhyapayishye nigamanna cettvam ||
    8|| vitarkadolam vyavadhuya sattve brihaspatim vartayase yatastvam | tenaiva deva tridasheshvaranamasprishtadolayitamadhirajyam
    || 9|| agnau samiddharcishi saptatantoratasthivanmantramayam shariram | akhandasarairhavisham pradanairapyayanam
    vyomasadam vidhatse || 10|| yanmulamidrikpratibhati tattvam ya mulamamnayamahadrumanam | tattvena
    jananti vishuddhasattvastamaksharamaksharamatrikam te || 11|| avyakritadvyakritavanasi tvam namani
    rupani ca yani purvam | shamsanti tesham caramam pratishtham vagishvara tvam tvadupajnavacah || 12||
    mugdhendunishyandavilobhaniyam murtim tavanandasudhaprasutim | vipashcitashcetasi bhavayante velamudaramiva
    dugdhasindhoh || 13|| manogatam pashyati yah sada tvam manishinam manasarajahamsam | svayam purobhavavivadabhajah
    kinkurvate tasya giro yatharham || 14|| api kshanardham kalayanti ye tvamaplavayantam vishadairmayukhaih
    | vacam pravahairanivaritaiste mandakinim mandayitum kshamante || 15|| svaminbhavaddhyanasudhabhishekatvahanti
    dhanyah pulakanubandham | alakshite kvapi nirudhamulamangeshvivanandathumankurantam || 16|| svaminpratica
    hridayena dhanyastvaddhyanacandrodayavardhamanam | amantamanandapayodhimantah payobhirakshnam parivahayanti
    || 17|| svairanubhavastvadadhinabhavah samriddhaviryastvadanugrahena | vipashcito natha taranti mayam
    vaiharikim mohanapinchikam te || 18|| prannirmitanam tapasam vipakah pratyagranihshreyasasampado me
    | samedhishiramstava padapadme sankalpacintamanayah pranamah || 19|| viluptamurdhanyalipikramanam
    surendracudapadalalitanam | tvadanghrirajivarajahkananam bhuyan prasado mayi natha bhuyat || 20||
    parisphurannupuracitrabhanuprakashanirdhutatamonushangam | padadvayim te paricinmahe'ntah prabodharajivavibhatasandhyam
    || 21|| tvatkinkaralankaranocitanam tvayaiva kalpantarapalitanam | manjupranadam maninupuram te manjushikam
    vedagiram pratimah || 22|| sancintayami pratibhadashasthansandhukshayantam samayapradipan | vijnanakalpadrumapallavabham
    vyakhyanamudramadhuram karam te || 23|| citte karomi sphuritakshamalam savyetaram natha karam tvadiyam
    | jnanamritodancanalampatanam lilaghatiyantramivashritanam || 24|| prabodhasindhorarunaih prakashaih
    pravalasanghatamivodvahantam | vibhavaye deva sapustakam te vamam karam dakshinamashritanam || 25||
    tamamsi bhittva vishadairmayukhaih samprinayantam vidushashcakoran | nishamaye tvam navapundarike
    sharadghane candramiva sphurantam || 26|| dishantu me deva sada tvadiyah dayataranganucarah katakshah
    | shrotreshu pumsamamritam ksharantim sarasvatim samshrita kamadhenum || 27|| visheshavitparishadeshu
    natha vidagdhagoshthisamaranganeshu | jigishato me kavitarkikendran jihvagrasimhasanamabhyupeyah ||
    28|| tvam cintayamstvanmayatam prapannastvamudgrinan shabdamayena dhamna | svaminsamajeshu samedhishiya
    svacchandavadahavabaddhashurah || 29|| nanavidhanamagatih kalanam na capi tirtheshu kritavatarah |
    dhruvam tavanathaparigrahayah navam navam patramaham dayayah || 30|| akampaniyanyapanitibhedairalankrishiran
    hridayam madiyam | shankakalankapagamojjvalani tattvani samyanci tava prasadat || 31|| vyakhyamudram
    karasarasijaih pustakam shankhacakre bibhradbhinnasphatikarucire pundarike nishannah | amlanashriramritavishadairamshubhih
    plavayan mam avirbhuyadanaghamahima manase vagadhishah || 32|| vagarthasiddhihetoh pathata hayagrivasamstutim
    bhaktya | kavitarkikakesarina venkatanathena viracitametam || 33|| || iti shrihayagrivastotram samaptam
    || kavitarkikasimhaya kalyanagunashaline | shrimate venkateshaya vedantagurave namah ||
  devanagari: श्रीहयग्रीवस्तोत्रम् श्री गणेशाय नमः । श्रीमान् वेङ्कटनाथार्यः कवितार्किककेसरी । वेदान्ताचार्यवर्यो
    मे सन्निधत्तां सदा हृदि ॥ ज्ञानानन्दमयं देवं निर्मलस्फटिकाकृतिम् । आधारं सर्वविद्यानां हयग्रीवमुपास्महे
    ॥ १॥ स्वतः सिद्धं शुद्धस्फटिकमणिभूभृत्प्रतिभटं सुधासध्रीचीभिर्द्युतिभिरवदातत्रिभुवनम् । अनन्तैस्त्रय्यन्तैरनुविहितहेषाहलहलं
    हताशेषावद्यं हयवदनमीडेमहि महः ॥ २॥ समाहारः साम्नां प्रतिपदमृचां धाम यजुषां लयः प्रत्यूहानां लहरिविततिर्बोधजलधेः
    । कथादर्पक्षुभ्यत्कथककुलकोलाहलभवं हरत्वन्तर्ध्वान्तं हयवदनहेषाहलहलः ॥ ३॥ प्राची सन्ध्या काचिदन्तर्निशायाः
    प्रज्ञादृष्टेरञ्जनश्रीरपूर्वा । वक्त्री वेदान्भातु मे वाजिवक्त्रा वागीशाख्या वासुदेवस्य मूर्तिः ॥
    ४॥ विशुद्धविज्ञानघनस्वरूपं विज्ञानविश्राणनबद्धदीक्षम् । दयानिधिं देहभृतां शरण्यं देवं हयग्रीवमहं प्रपद्ये
    ॥ ५॥ अपौरुषेयैरपि वाक्प्रपञ्चैरद्यापि ते भूतिमदृष्टपाराम् । स्तुवन्नहं मुग्ध इति त्वयैव कारुण्यतो
    नाथ कटाक्षणीयः ॥ ६॥ दाक्षिण्यरम्या गिरिशस्य मूर्तिर्देवी सरोजासनधर्मपत्नी । व्यासादयोऽपि व्यपदेश्यवाचः
    स्फुरन्ति सर्वे तव शक्तिलेशैः ॥ ७॥ मन्दोऽभविष्यन्नियतं विरिञ्चो वाचां निधे वञ्चितभागधेयः । दैत्यापनीतान्दयर्येव
    भूयोऽप्यध्यापयिष्ये निगमान्न चेत्त्वम् ॥ ८॥ वितर्कडोलां व्यवधूय सत्त्वे बृहस्पतिं वर्तयसे यतस्त्वम्
    । तेनैव देव त्रिदशेश्वराणामस्पृष्टदोलायितमाधिराज्यम् ॥ ९॥ अग्नौ समिद्धार्चिषि सप्ततन्तोरातस्थिवान्मन्त्रमयं
    शरीरम् । अखण्डसारैर्हविषां प्रदानैराप्यायनं व्योमसदां विधत्से ॥ १०॥ यन्मूलमीदृक्प्रतिभाति तत्त्वं
    या मूलमाम्नायमहाद्रुमाणाम् । तत्त्वेन जानन्ति विशुद्धसत्त्वास्तामक्षरामक्षरमातृकां ते ॥ ११॥ अव्याकृताद्व्याकृतवानसि
    त्वं नामानि रूपाणि च यानि पूर्वम् । शंसन्ति तेषां चरमां प्रतिष्ठां वागीश्वर त्वां त्वदुपज्ञवाचः ॥
    १२॥ मुग्धेन्दुनिष्यन्दविलोभनीयां मूर्तिं तवानन्दसुधाप्रसूतिम् । विपश्चितश्चेतसि भावयन्ते वेलामुदारामिव
    दुग्धसिन्धोः ॥ १३॥ मनोगतं पश्यति यः सदा त्वां मनीषिणां मानसराजहंसम् । स्वयं पुरोभावविवादभाजः किङ्कुर्वते
    तस्य गिरो यथार्हम् ॥ १४॥ अपि क्षणार्धं कलयन्ति ये त्वामाप्लावयन्तं विशदैर्मयूखैः । वाचां प्रवाहैरनिवारितैस्ते
    मन्दाकिनीं मन्दयितुं क्षमन्ते ॥ १५॥ स्वामिन्भवद्ध्यानसुधाभिषेकात्वहन्ति धन्याः पुलकानुबन्धम् । अलक्षिते
    क्वापि निरूढमूलमङ्गेष्विवानन्दथुमङ्कुरन्तम् ॥ १६॥ स्वामिन्प्रतीचा हृदयेन धन्यास्त्वद्ध्यानचन्द्रोदयवर्धमानम्
    । अमान्तमानन्दपयोधिमन्तः पयोभिरक्ष्णां परिवाहयन्ति ॥ १७॥ स्वैरानुभावास्त्वदधीनभावाः समृद्धवीर्यास्त्वदनुग्रहेण
    । विपश्चितो नाथ तरन्ति मायां वैहारिकीं मोहनपिञ्छिकां ते ॥ १८॥ प्राङ्निर्मितानां तपसां विपाकाः प्रत्यग्रनिःश्रेयससम्पदो
    मे । समेधिषीरंस्तव पादपद्मे सङ्कल्पचिन्तामणयः प्रणामाः ॥ १९॥ विलुप्तमूर्धन्यलिपिक्रमाणां सुरेन्द्रचूडापदलालितानाम्
    । त्वदङ्घ्रिराजीवरजःकणानां भूयान् प्रसादो मयि नाथ भूयात् ॥ २०॥ परिस्फुरन्नूपुरचित्रभानुप्रकाशनिर्धूततमोनुषङ्गाम्
    । पदद्वयीं ते परिचिन्महेऽन्तः प्रबोधराजीवविभातसन्ध्याम् ॥ २१॥ त्वत्किङ्करालङ्करणोचितानां त्वयैव कल्पान्तरपालितानाम्
    । मञ्जुप्रणादं मणिनूपुरं ते मञ्जूषिकां वेदगिरां प्रतीमः ॥ २२॥ सञ्चिन्तयामि प्रतिभादशास्थान्सन्धुक्षयन्तं
    समयप्रदीपान् । विज्ञानकल्पद्रुमपल्लवाभं व्याख्यानमुद्रामधुरं करं ते ॥ २३॥ चित्ते करोमि स्फुरिताक्षमालं
    सव्येतरं नाथ करं त्वदीयम् । ज्ञानामृतोदञ्चनलम्पटानां लीलाघटीयन्त्रमिवाश्रितानाम् ॥ २४॥ प्रबोधसिन्धोररुणैः
    प्रकाशैः प्रवालसङ्घातमिवोद्वहन्तम् । विभावये देव सपुस्तकं ते वामं करं दक्षिणमाश्रितानाम् ॥ २५॥ तमांसि
    भित्त्वा विशदैर्मयूखैः सम्प्रीणयन्तं विदुषश्चकोरान् । निशामये त्वां नवपुण्डरीके शरद्घने चन्द्रमिव
    स्फुरन्तम् ॥ २६॥ दिशन्तु मे देव सदा त्वदीयाः दयातरङ्गानुचराः कटाक्षाः । श्रोत्रेषु पुंसाममृतं क्षरन्तीं
    सरस्वतीं संश्रित कामधेनुम् ॥ २७॥ विशेषवित्पारिषदेषु नाथ विदग्धगोष्ठीसमराङ्गणेषु । जिगीषतो मे कवितार्किकेन्द्रान्
    जिह्वाग्रसिंहासनमभ्युपेयाः ॥ २८॥ त्वां चिन्तयंस्त्वन्मयतां प्रपन्नस्त्वामुद्गृणन् शब्दमयेन धाम्ना
    । स्वामिन्समाजेषु समेधिषीय स्वच्छन्दवादाहवबद्धशूरः ॥ २९॥ नानाविधानामगतिः कलानां न चापि तीर्थेषु कृतावतारः
    । ध्रुवं तवानाथपरिग्रहायाः नवं नवं पात्रमहं दयायाः ॥ ३०॥ अकम्पनीयान्यपनीतिभेदैरलङ्कृषीरन् हृदयं मदीयम्
    । शङ्काकलङ्कापगमोज्ज्वलानि तत्त्वानि सम्यञ्चि तव प्रसादात् ॥ ३१॥ व्याख्यामुद्रां करसरसिजैः पुस्तकं
    शङ्खचक्रे बिभ्रद्भिन्नस्फटिकरुचिरे पुण्डरीके निषण्णः । अम्लानश्रीरमृतविशदैरंशुभिः प्लावयन् मां आविर्भूयादनघमहिमा
    मानसे वागधीशः ॥ ३२॥ वागर्थसिद्धिहेतोः पठत हयग्रीवसंस्तुतिं भक्त्या । कवितार्किककेसरिणा वेङ्कटनाथेन
    विरचितामेताम् ॥ ३३॥ ॥ इति श्रीहयग्रीवस्तोत्रं समाप्तम् ॥ कवितार्किकसिंहाय कल्याणगुणशालिने । श्रीमते
    वेङ्कटेशाय वेदान्तगुरवे नमः ॥
