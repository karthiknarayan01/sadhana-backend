id: annamayya-keerthanas-sakalam-he-sakhi
category: stotram
name:
  english: Annamayya Keerthanas Sakalam He Sakhi
content:
  english: sakhi janamè tat prakata vilasam paramam dadhase || alika mriga mada maya mashi kalanau jvalatahe
    sakhi janame | lalitam tava pallavi tamanasi ni scalatara megha shyamam dadhase || carukapòla sthala
    karankita vicaram he sakhi janame | narayana mahinayaka shayanam shriramanam tava citte dadhase ||
    ghana kuca shaila krascita vibhumani jananam he sakhi janame | kanaturasa venkata giripati vinuta
    bhòga sukha vibhavam dadhase || d
  devanagari: सखि जानामॆ तत् प्रकत विलासं परमं दधसे ॥ अलिक मॄग मद मय मषि कलनौ ज्वलताहे सखि जानामे । ललितं
    तव पल्लवि तमनसि नि स्चलतर मेघ श्यामं दधसे ॥ चारुकपॊल स्थल कराङ्कित विचारं हे सखि जानामे । नारयण महिनायक
    शयनं श्रिरमनं तव चित्ते दधसे ॥ घन कुच शैल क्रस्चित विभुमनि जननं हे सखि जानामे । कनतुरस वेङ्कट गिरिपति
    विनुत भॊग सुख विभवं दधसे ॥ द्
