id: hanumatkritamshivastotram
category: stotram
name:
  english: hanumatkritamshivastotram
  devanagari: हनुमत्कृतंशिवस्तोत्रम्
content:
  english: 235|| iti naradapurane purvabhage ekonashityadhyayantargatam hanumatkritam shivastotram samaptam
    | brihannaradiyapurana | purvabhaga | adhyaya 79
  devanagari: २३५॥ इति नारदपुराणे पूर्वभागे एकोनाशीत्यध्यायान्तर्गतं हनुमत्कृतं शिवस्तोत्रं समाप्तम् ।
    बृहन्नारदीयपुराण । पूर्वभाग । अध्याय ७९
meaning: {}
