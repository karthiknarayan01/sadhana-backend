id: rahu-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Rahu Ashtottara Sata Nama Stotram
content:
  english: shrinu namani rahoshca saimhikeyo vidhuntudah | surashatrustamashcaiva phani gargyayanastatha
    || || suragurnilajimutasankashashca caturbhujah | khadgakhetakadhari ca varadayakahastakah || || shulayudho
    meghavarnah krishnadhvajapatakavan | dakshinashamukharatah tikshnadamshtradharaya ca || || shurpakarasanasthashca
    gomedabharanapriyah | mashapriyah kashyaparshinandano bhujageshvarah || || ulkapatajanih shuli nidhipah
    krishnasarparat | vishajvalavritasyo'rdhashariro jadyasampradah || || ravindubhikarashchayasvarupi
    kathinangakah | dvishaccakracchedako'tha karalasyo bhayankarah || || krurakarma tamorupah shyamatma
    nilalohitah | kiriti nilavasanah shanisamantavartmagah || || candalavarno'thashvyarkshabhavo meshabhavastatha
    | shanivatphaladah shuro'pasavyagatireva ca || || uparagakarah suryahimamshucchaviharakah | nilapushpaviharashca
    grahashreshtho'shtamagrahah || || kabandhamatradehashca yatudhanakulodbhavah | govindavarapatram ca
    devajatipravishtakah || || kruro ghorah shanermitram shukramitramagocarah | manegangasnanadata svagriheprabaladhyakah
    || || sadgrihe'nyabaladhriccaturthe matrinashakah | candrayukte tu candalajanmasucaka eva tu || ||
    janmasimhe rajyadata mahakayastathaiva ca | janmakarta vidhuripu mattako jnanadashca sah || || janmakanyarajyadata
    janmahanida eva ca | navame pitrihanta ca pancame shokadayakah || || dyune kalatrahanta ca saptame
    kalahapradah | shashthe tu vittadata ca caturthe vairadayakah || || navame papadata ca dashame shokadayakah
    | adau yashah pradata ca ante vairapradayakah || || kalatma gocaracaro dhane casya kakutpradah | pancame
    dhishanashringadah svarbhanurbali tatha || || mahasaukhyapradayi ca candravairi ca shashvatah | surashatruh
    papagrahah shambhavah pujyakastatha || || patirapuranashcatha paithinasakulodbhavah | dirghakrishno'tanurvishnunetrarirdevadanavau
    || || bhaktaraksho rahumurtih sarvabhishtaphalapradah | etadrahugrahasyoktam namnamashtottaram shatam
    || || shraddhaya yo japennityam mucyate sarvasankatat | sarvasampatkarastasya rahurishtapradayakah
    || || iti shri rahu ashtottarashatanama stotram |
  devanagari: शृणु नामानि राहोश्च सैंहिकेयो विधुन्तुदः । सुरशत्रुस्तमश्चैव फणी गार्ग्यायणस्तथा ॥ ॥ सुरागुर्नीलजीमूतसङ्काशश्च
    चतुर्भुजः । खड्गखेटकधारी च वरदायकहस्तकः ॥ ॥ शूलायुधो मेघवर्णः कृष्णध्वजपताकवान् । दक्षिणाशामुखरतः
    तीक्ष्णदंष्ट्रधराय च ॥ ॥ शूर्पाकारासनस्थश्च गोमेदाभरणप्रियः । माषप्रियः कश्यपर्षिनन्दनो भुजगेश्वरः
    ॥ ॥ उल्कापातजनिः शूली निधिपः कृष्णसर्पराट् । विषज्वलावृतास्योऽर्धशरीरो जाद्यसम्प्रदः ॥ ॥ रवीन्दुभीकरश्छायास्वरूपी
    कठिनाङ्गकः । द्विषच्चक्रच्छेदकोऽथ करालास्यो भयङ्करः ॥ ॥ क्रूरकर्मा तमोरूपः श्यामात्मा नीललोहितः ।
    किरीटी नीलवसनः शनिसामन्तवर्त्मगः ॥ ॥ चाण्डालवर्णोऽथाश्व्यर्क्षभवो मेषभवस्तथा । शनिवत्फलदः शूरोऽपसव्यगतिरेव
    च ॥ ॥ उपरागकरः सूर्यहिमांशुच्छविहारकः । नीलपुष्पविहारश्च ग्रहश्रेष्ठोऽष्टमग्रहः ॥ ॥ कबन्धमात्रदेहश्च
    यातुधानकुलोद्भवः । गोविन्दवरपात्रं च देवजातिप्रविष्टकः ॥ ॥ क्रूरो घोरः शनेर्मित्रं शुक्रमित्रमगोचरः
    । मानेगङ्गास्नानदाता स्वगृहेप्रबलाढ्यकः ॥ ॥ सद्गृहेऽन्यबलधृच्चतुर्थे मातृनाशकः । चन्द्रयुक्ते तु चण्डालजन्मसूचक
    एव तु ॥ ॥ जन्मसिंहे राज्यदाता महाकायस्तथैव च । जन्मकर्ता विधुरिपु मत्तको ज्ञानदश्च सः ॥ ॥ जन्मकन्याराज्यदाता
    जन्महानिद एव च । नवमे पितृहन्ता च पञ्चमे शोकदायकः ॥ ॥ द्यूने कलत्रहन्ता च सप्तमे कलहप्रदः । षष्ठे
    तु वित्तदाता च चतुर्थे वैरदायकः ॥ ॥ नवमे पापदाता च दशमे शोकदायकः । आदौ यशः प्रदाता च अन्ते वैरप्रदायकः
    ॥ ॥ कालात्मा गोचराचारो धने चास्य ककुत्प्रदः । पञ्चमे धिषणाशृङ्गदः स्वर्भानुर्बली तथा ॥ ॥ महासौख्यप्रदायी
    च चन्द्रवैरी च शाश्वतः । सुरशत्रुः पापग्रहः शाम्भवः पूज्यकस्तथा ॥ ॥ पाटीरपूरणश्चाथ पैठीनसकुलोद्भवः
    । दीर्घकृष्णोऽतनुर्विष्णुनेत्रारिर्देवदानवौ ॥ ॥ भक्तरक्षो राहुमूर्तिः सर्वाभीष्टफलप्रदः । एतद्राहुग्रहस्योक्तं
    नाम्नामष्टोत्तरं शतम् ॥ ॥ श्रद्धया यो जपेन्नित्यं मुच्यते सर्वसङ्कटात् । सर्वसम्पत्करस्तस्य राहुरिष्टप्रदायकः
    ॥ ॥ इति श्री राहु अष्टोत्तरशतनाम स्तोत्रम् ।
