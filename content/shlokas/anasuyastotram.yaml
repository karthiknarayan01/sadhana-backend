id: anasuyastotram
category: stotram
name:
  english: anasuyastotram
  devanagari: अनसूयास्तोत्रम्
content:
  english: pativratashiroratnabhuta sumdaravigraha| sucaritra divyateja sarvalokanamaskrita||1|| vishnuprapautri
    kapautri sati kardamaputrika| devahutisamutpanna sumukhi kapilasvasa||2|| atripatni mahabhaga dayakshantyadibhushita|
    anasuya vedageya nijadharmajitakhila||3|| shridattatreyajanani camdramata manasvini| durvasojanayitrisha
    jagatsamkatavarini||4|| caturvimshatinamani mamgalani parani ca| pavanyanyanasuyaya dattamatuh pathennarah||5||
    trikalamekakalam va shraddhabhaktisamanvitah| tasya dharme rucirdatte bhaktimukti kramadbhavet||6||
    iti shri pa
  devanagari: पतिव्रताशिरोरत्नभूता सुंदरविग्रहा। सुचरित्रा दिव्यतेजा सर्वलोकनमस्कृता।।१।। विष्णुप्रपौत्री
    कपौत्री सती कर्दमपुत्रिका। देवहूतिसमुत्पन्ना सुमुखी कपिलस्वसा।।२।। अत्रिपत्नी महाभागा दयाक्षान्त्यादिभूषिता।
    अनसूया वेदगेया निजधर्मजिताखिला।।३।। श्रीदत्तात्रेयजननी चंद्रमाता मनस्विनी। दुर्वासोजनयित्रीशा जगत्संकटवारिणी।।४।।
    चतुर्विंशतिनामानि मंगलानि पराणि च। पावन्यान्यनसूयाया दत्तमातुः पठेन्नरः।।५।। त्रिकालमेककालं वा श्रद्धाभक्तिसमन्वितः।
    तस्य धर्मे रुचिर्दत्ते भक्तिमुक्ति क्रमाद्भवेत्।।६।। इति श्री प
