id: sampurna-visva-ratnam-saare-jahan-se-accha-in-samskritam
category: stotram
name:
  english: Sampurna Visva Ratnam (Saare Jahan Se Accha in Samskritam)
content:
  english: sampurnavishvaratnam khalu bharatam svakiyam | pushpam vayam tu sarve khalu desha vatikeyam
    || sarvocca parvato yo gaganasya bhala cumbi | sah sainikah suvirah prahari ca sah svakiyah || krode
    sahasradhara pravahanti yasya nadyah | udyanamabhiposhyam bhuvigauravam svakiyam || dharmasya nasti
    shiksha katuta mitho vidheya | eke vayam tu deshah khalu bharatam svakiyam || sampurnavishvaratnam
    khalu bharatam svakiyam | sampurnavishvaratnam |
  devanagari: सम्पूर्णविश्वरत्नं खलु भारतं स्वकीयम् । पुष्पं वयं तु सर्वे खलु देश वाटिकेयम् ॥ सर्वोच्च
    पर्वतो यो गगनस्य भाल चुम्बी । सः सैनिकः सुवीरः प्रहरी च सः स्वकीयः ॥ क्रोडे सहस्रधारा प्रवहन्ति यस्य
    नद्यः । उद्यानमाभिपोष्यं भुविगौरवं स्वकीयम् ॥ धर्मस्य नास्ति शिक्षा कटुता मिथो विधेया । एके वयं तु
    देशः खलु भारतं स्वकीयम् ॥ सम्पूर्णविश्वरत्नं खलु भारतं स्वकीयम् । सम्पूर्णविश्वरत्नम् ।
