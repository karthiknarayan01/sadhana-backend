id: anyapadeshashatakam
category: shataka
name:
  english: anyapadeshashatakam
  devanagari: अन्यापदेशशतकम्
content:
  english: rgharmante saritam mukhena tadabhudirshyaspadam pashyatam || 36|| megha dvarataya vidhaya bhuvananyaplavasyambhasa
    candram dvarataya vidhaya savitah pushnasi sarvoshadhih | yattvishattapasiva tattu kurushe svenaiva
    tenadhuna datritvam ghanacandrayoh parinatam kraurya tu shishtam tvayi || 37|| dvaram na prajahatu
    jatu niyatam jagartu ratrirapi svalpenapi mudam prayatu kimatah shva shvaiva tavanapi | sampadyo mahata
    dhanena satatam bhojyashca santvairiti tyaktva mattagajam pade'sya mahatah sthapyah kimetavata ||
    38|| utpannah saritam hradeshu suciram tatraiva pushtastatah praptah pravrishi sagaram jalacarastasam
    mukhadeva ye | dvitraireva dinaistimingilakulasyasadya kutasthatam mrishyantyadya na te rahasyapi
    kritam nadeyatasankatham || 39|| panthah kardamitah payah kalushitam hamsah krita duratah pidyante
    ca yadevamarthina iti kruraravaishcatakah | sodhahe tava he payoda sakalam shaknoshi datum svatah
    kim tvam shikaramekamapyudadhina lobho yadi svikritah || 40|| sarvajno yadi shankaro yadi mahadevo
    yadi prayasho devanamapi daivatam yadi tadapyastamidam duratah | dhutturaih phanibhih kapalavalayairanyaishca
    te sangati
  devanagari: र्घर्मान्ते सरितां मुखेन तदभूदीर्ष्यास्पदं पश्यताम् ॥ ३६॥ मेघ द्वारतया विधाय भुवनान्याप्लावस्यम्भसा
    चन्द्रं द्वारतया विधाय सवितः पुष्णासि सर्वोषधीः । यत्त्वीषत्तपसीव तत्तु कुरुषे स्वेनैव तेनाधुना दातृत्वं
    घनचन्द्रयोः परिणतं क्रौर्य तु शिष्टं त्वयि ॥ ३७॥ द्वारं न प्रजहातु जातु नियतं जागर्तु रात्रीरपि स्वल्पेनापि
    मुदं प्रयातु किमतः श्वा श्वैव तावानपि । सम्पाद्यो महता धनेन सततं भोज्यश्च सान्त्वैरिति त्यक्त्वा मत्तगजं
    पदेऽस्य महतः स्थाप्यः किमेतावता ॥ ३८॥ उत्पन्नाः सरितां ह्रदेषु सुचिरं तत्रैव पुष्टास्ततः प्राप्ताः
    प्रावृषि सागरं जलचरास्तासां मुखादेव ये । द्वित्रैरेव दिनैस्तिमिङ्गिलकुलस्यासाद्य कूटस्थतां मृष्यन्त्यद्य
    न ते रहस्यपि कृतां नादेयतासङ्कथाम् ॥ ३९॥ पन्थाः कर्दमितः पयः कलुषितं हंसाः कृता दूरतः पीड्यन्ते च
    यदेवमर्थिन इति क्रूरारवैश्चातकाः । सोढाहे तव हे पयोद सकलं शक्नोषि दातुं स्वतः किं त्वं शीकरमेकमप्युदधिना
    लोभो यदि स्वीकृतः ॥ ४०॥ सर्वज्ञो यदि शङ्करो यदि महादेवो यदि प्रायशो देवानामपि दैवतं यदि तदप्यास्तामिदं
    दूरतः । धुत्तूरैः फणिभिः कपालवलयैरन्यैश्च ते सङ्गति
