id: kyts-6-6-suvargaaya-vaa-etaani-lokaaya-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 6.6 Suvargaaya Vaa Etaani Lokaaya - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitayam shashthakande shashthah prashnah somamantrabrahmananirupanam
    o shri gurubhyo namah | harih om || suvargaya va etani lokaya huyante ya kshinani dvabhya hapatye
    juhoti dvipa dyajamanah pratishthitya agni ddhre juhotyantariksha eva 'bhyaiti suvargamevainam ngamayati
    sauribhyamrigbhya hapatye juhotyamumevainam lo~kagm samarohayati nayavatyarca ddhre juhoti suvargasya
    lokasyabhini ngaccha suvah pateti hiranyagm dgrihnati suvargamevainam ngamayati rupena vo rupamabhyaimityaha
    rupena hyasagm rupamabhyaiti yaddhiranyena tutho vo vishvaveda vi bhajatvityaha tutho ha sma vai vishvaveda
    devana ndakshina vi bhajati tenaivaina vi bhajatye ta mityaha somacyutagg hyasya radha aiti tanmitrasya
    patha nayetyaha shantya ritasya patha preta candra dakshina ityaha satyam va~ ritagm satyenaivaina
    ritena vi bhajati yajnasya patha suvita nayantirityaha yajnasya hyetah patha yanti ya ddakshina brahmanamadya
    ra ntasmadevamaha vi suvah pashya vyantarikshamityaha suvargamevainam ngamayati yatasva sadasyairityaha
    mitratvayasmadda tra devatra gacchata madhumatih pradatarama vishatetyaha vayamiha pradatara 'smanamutra
    madhumatira vishateti ndadati jyotirvai hiranya njyotireva purasta ddhatte suvargasya lokasyanukhyatya
    agnidhe dadatyagnimukhanevartu nprinati brahmane dadati prasu tyai hotre dadatyatma va esha yajnasya
    yaddhota ''tmanameva yajnasya dakshinabhi mamutra madhumatira vishatetya samishta yajugmshi juhoti
    yajnasya samishtyai yadvai yajnasya kruram ya~datyeti yannatyeti yadatikaroti yannapi karoti tadeva
    taih prinati nava juhoti nava vai purushe pranah purushena yajna ssammito yavaneva yajnasta drigmiyani
    juhoti shadva ritava rituneva prinati trini yajugmshi traya ime loka imaneva loka nprinati yajna yajna
    ngacchetyaha yajnapatimevaina ngacchetyaha svamevainam ngamayatyesha te yajno yajnapate sahasu ssuvira
    ityaha yajamana eva virya ndadhati vasishtho ha satyahavyo devabhaga viti sa hovaca yajnapataviti
    satyadvai srinjayah para babhuvuriti hovaca yajne vava yajnah pratishthapya asi 'parabhavayeti deva
    gatuvido gatum mitetyaha yajna eva yajna mprati shthapayati yajamanasya yajugmshi juhoti yadevarvacina
    mekahayanadenah karoti tadeva tairava yajate 'po ssakshadeva varunamava yajate vartmana va anvitya
    yajnagm rakshagmsi jighagmsanti samna 'nvavaiti sama vai rakshoha rakshasamapahatyai trirnidhanamupaiti
    traya ime loka ebhya eva lokebhyo rakshag lokebhyo rakshagmsi syapa hanti purushahpurusho nidhanamupaiti
    purushahpurusho hi rakshasvi rakshasamapahatya urugm hi raja varunashcakaretyaha pratishthityai shata
    nbhishajah sahasramityaha bheshajamevasmai karotyabhishthito varunasya pasha ityaha varunapashamevabhi
    tishthati barhirabhi juhotyahutina mpratishthitya atho agnivatyeva juhotyapa bar yajati praja vai
    barhih praja eva varunapasha nmuncatyajyabhagau yajati yajnasyaiva cakshushi nantareti varunam ya~jati
    varunapashadevaina mmuncatyagnivarunau yajati sakshadevainam hishavanuyajau yajati praja vai barhih
    praja eva varunapasha nmuncati caturah prayajan yajati dvavanuyajau shat thsampadyante shadva ritava
    ritushveva prati tishtha nicankunetyaha yathoditameva varunamava yajate samudre te hridaya maphsvantarityaha
    samudre hyantarvaruna ndadhati devirapa esha vo garbha ityaha yathayajurevaita ngrihniyadyanna bhakshayedapashu
    dupasprishyameva pashuma va~runo grihnati pratiyuto varunasya pasha ityaha varunapashadeva nirmucyate
    'pratikshama yanti varunasyantar tyaha samidhaivagni nnamasyanta upayanti tejo 'si tejo mayi dhehityaha
    teja eva sphyena vedimuddhanti rathakshena vi mimite yupa mminoti trivritameva vajragm sabhrintya
    bhratrivyaya pra harati strityai yadantarvedi minuya ddevalokamabhi jaye dbahirvedi manushya lokam
    ~ve dyantasya sandhau minotyubhayo rabhijitya uparasammita tpitrilokakamasya rashanasaminta mmanushyalokakamasya
    cashala sammitamindriya kamasya sarva npratishthakamasya ye trayo maddhyamastan anu pashava upa tishthante
    pashumaneva bhavati vyatishajeditara mpashubhirvyatishajati ya nkamayeta pramayuka ssyaditi gartamita
    ntasya minuyaduttarardhyam shishthamatha hrasiyagmsamesha vai gartamidyasyaiva kpra miyate dakshinardhyam
    thsuvargakamasyatha hrasiyagmsa ya~jamanah kurute suvargasya lokasya samashtyai yupe dve rashane parivyayati
    tasmadeko dve jaye vindate yannaikagm rashana ndvayoryupayoh parivyayati tasmannaika dvau pati vindate
    ya nkamayeta stryasya jayetetyupante tasya vyatishaje thstryevasya jayate ya nkamayeta pumanasya jayetetyanta
    jayate 'sura vai deva ndeva upashayenaivapa ddakshinata upashaya upashaye bhratrivyapanuttyai sarve
    va anye yupah 'thopashaya evapashustasya yajamanah pashuryanna nirdishedarti 'sau te pashuriti nirdishedya
    dveshti tamasmai pashu nnirdishati yadi na dvishyadakhuste pashuriti bruyanna gramya nprajapatih praja
    asrijata so rdhyata sa etamekadashini 'nnadyamavarundha yaddasha yupa bhavanti dasha sstana evasyai
    sa duha evaina ntena vajro va esha sa mmiyate yadekadashini seshvara purasta ya~jnagm sammarditorya
    mminoti yajnasya pratyuttabdhyai sayatvaya || sa prajapatih praja asrijata sa riricano 'manyata sa
    etamekadashini ttaya vai sa ayurindriyam vi~ryamatmannadhatta praja iva khalu va esha srijate yo yajate
    sa etar hi riricana iva yadeshaikadashini bhavatyayureva taye ''gneyena vapayati mithunagm sarasvatya
    karoti reta ssaumyena dadhati pra janayati paushnena bar haspatyo bhavati brahma vai devana mbrihaspatirbrahmanaivasmai
    prajah prajanayati vaishvadevo bhavati vaishvadevyo vai prajah praja evasmai prajanayati ndriyamevaindrenava
    rundhe visha mmarutenaujo balamaindragnena prasavaya savitro nirvarunatvaya varuno maddhyata aindrama
    labhate maddhyata evendriyam purastadaindrasya vaishvadevama labhate vaishvadevam va~ annamannameva
    purasta tpurastadannamadyata aindramalabhya marutama labhate vi dvai maruto vishamevasma anu baddhnati
    yadi kamayeta yo 'va gacchatvityaindrasya loke varunama labheta varunasya loka aindram 'va gacchati
    yadi kamayeta praja muhyeyuriti pashun vyatishaje tpraja eva mohayati yadabhivahato va~runamalabheta
    praja varuno grihniya ddakshinata udancama labhate indrah patniya manumayajaya ttaya manurardhnodya
    thsrijati yameva manur ttameva yajamana ridhnoti yajnasya va apratishthita dyajnah para bhavati yajna
    'nu para bhavati yadajyena patnivatagm saggsthapayati yajnasya pratishthityai yajna mpratitishthantam
    'nu prati tishthatishtam 'tha patnivatena pra carati tirtha eva pra caratyatho etar hyevasya yamastvashtro
    bhavati tvashta vai retasa ssiktasya rupani vi karoti tameva vrishana mpatnishvapi srijati so 'smai
    rupani vi karoti || thsaumyo bhavati yatha mritayanustarani nghnanti tadrigeva ta dyaduttarardhe va
    maddhye va juhuya ddakshinardhe juhotyesha vai pitrina khsvayameva dishi pitri nniravadayata udgatribhyo
    haranti samadevatyo vai saumyo yadeva samnah chambatkurvanti tasyaiva sa shantirave ikshante pavitram
    vai~ saumya atmanameva pavayante ya atmana nna paripashyeditasuh syadabhidadi mparipashyatyatho atmanameva
    pavayate yo gatamana ksheta yanme manah paragatam ya~dva me aparagatam | rajna somena tadvayamasmasu
    dharayamasiti mana evatma na gatamana bhavatyapa vai tritiyasavane yajnah kramatijana gnavaishnavyarca
    ghritasya yajatyagni ssarva devata vishnuryajno devata nca dadharopagmshu yajati mithunatvaya brahmavadino
    vadanti mitro yajnasya svishtam yu~vate varuno durishta hi yajnah kva yajamano bhavatiti yanmai va~shamalabhate
    mitrenaiva yajnasya svishtagm shamayati varunena durishta ''rtimarcchati yajamano yatha vai langalenorvara
    tyevamrikhsame yajna mpra bhinto yanmai va~shamalabhate yajnayaiva prabhinnaya matyamanvava syati
    shantyai yatayamani va etasya chandagmsi ya ijana shchandasamesha raso ya va~shamalabhate chandagsyeva
    punara prinatya yatayamatvayatho chandassveva rasa deva va indriyam ~vyabhajanta tato yadatyashishyata
    tadatigrahya abhava ya~datigrahya grihyanta indriyameva ta ndhatte teja agneyene maindrena brahmavarcasagm
    sauryenopastambhanam dyajnasya yadatigrahya shcakre prishthani ya tprishthye na grihniya mprishthani
    sagm shriniyurya ssagm shriniyurvishvajiti sarvaprishthe grahitavya yajnasya saviryatvaya prajapatirdevebhyo
    yajnan vyadisha thsa priyastanurapa nyadhatta tadatigrahya abhavan vitanustasya yajna ityahurya syatigrahya
    na grihyanta ityapyagnishtome grahitavya yajnasya satanutvaya devata vai sarva ''gne yamagniraindramindrah
    sauryagm suryastato vai te rvyavritamagacchan vi~dusha ete graha grihyante vyavritameva papmana bhratrivyena
    gacchatime loka jyotishmanta dviryah karya ityahuragneyenasmin ~loke jyotirdhatta aindrenantariksha
    indravayu hi sayujau sauryenamushmin ~loke jyotirdhatte jyotishmanto 'sma ime loka bhavanti samava
    dviryanenan kuruta etan ntabhyamime lokah para ncashcarvancashca prabhuryasyaivam vi~dusha ete graha
    grihyante prasma ime lokah para ncashcarvancashca bhanti || ekannacatvarigmshacca 'kurvata tadasura
    akurvata te deva ada bhye chandagmsi savanani samasthapaya bhyo grihyate bhavatyatmana para 'sya bhratrivyo
    bhavati yadvai deva asura ve~da dabhnotyeva bhratrivya tyesha vai prajapate ratimokshini nama tanuryadada
    bhya upanaddhasya grihnatyatimuktya ati papmana ve~da ghnanti va eta ya~dabhishunvanti some hanyamane
    yajno hanyate yajne yajamano brahmavadino vadanti ki dyajne yajamanah kurute yena jivan lo~kametiti
    jivagraho va esha yadadabhyo 'nabhishutasya grihnati jivantamevainagm suvargam ~loka ntyagmshunapi
    srijati yajnasya santatyai || nabhishutasya grihnatye kannavigmshatishca deva vai prabahuggraha ttamagrihnita
    tena vai sa a rgrihyata riddhnotyeva sakridabhishutasya grihnati sakriddhi sa tena ''rdhnonmanasa
    grihnati mana iva hi prajapatih prajapateraptya audumbarena grihnatyurgva udumbara urjamevava rundhe
    catuhsrakti bhavati di kshveva prati tishthati yo va agmshorayatanam nbhavati vamadevyamiti sama tadva
    asya mmanasa gayamano grihnatyayatanavaneva bhavati yadaddhvaryuragmshu nnardhayedubhabhya nnardhyetaddhvaryave
    ca yajamanaya ca yadardhaye ngrihnati saivasyardhir hiranyamabhi vyanityamritam vai~ hiranyamayuh
    prana ayushaivamritamabhi dhinoti shatamana mbhavati shatayuh purusha shshatendriya ayushyevendriye
    prati tishthati || rdevebhyo yajnan vyadisha 'manyata sa yajnanagm shodashadhendriyam vi~ryamatmanamabhi
    samakkhida thshodashyabhavanna vai shodashi nama yajno 'sti yadvava shodashagg stotragm shodashagm
    shastra thshodashinah shodashitvam thshodashi grihyata indriyameva ta ndhatte devebhyo vai suvargo
    loko tta etagm shodashinamapashya ntamagrihnata tato vai tebhyah suvargo lokah prabhavadya thshodashi
    grihyate suvargasya lokasyabhijitya indro vai devanamanujavara asi thsa prajapatimupadhava ttasma
    etagm shodashina ttamagrihnita tato vai so vi~dushah shodashi grihyate 'grameva samanana mparyeti
    pratassavane grihnati vajro vai shodashi vajrah pratassavanagg yo~nernigrihnati savanesavane 'bhi
    grihnati savanathsavanadevaina mpra janayati tritiyasavane pashukamasya grihniya dvajro vai shodashi
    pashavastritiyasavanam va~jrenaivasmai tritiyasavana tpashunava rundhe nokthye grihniya tpraja vai
    pashava ukthani yadukthye mpashunasya nirdahedatiratre pashukamasya grihniya dvajro vai shodashi vajrenaivasmai
    pashunavaruddhya ratri cchamayatyapyagnishtome rajanyasya grihniya dvyavritkamo hi rajanyo yajate
    sahna evasmai vajra va~jro bhutya indhe nirva daha mbhavati pratishthityai harivacchasyata indrasya
    priya ''pnoti kaniyagmsi vai deveshu chandagsyasan syasureshu te devah kaniyasa chandasa jyaya tkaniyasa
    chandasa jyaya 'bhivishagmsati bhratrivyasyaiva tallokam vri~nkte shadaksharanyati recayanti sha dva
    ritava rituneva prinati catvari purvanyava kalpayanti catushpada eva pashunava rundhe dve uttare dvipada
    evava rundhe 'nushtubhamabhi sa mpadayanti vagva anushtu va~guttama samayavishite surye shodashinah
    stotra mupakarotyetasmin vai loka indro vritramahan mbhratrivyaya pra hara 'shvo dakshinaitadvai vajrasya
    rupagm samriddhyai || vidushah shodashi grihyate saptacatvarigmshacca prajapatirekadashini deva va
    indriyam deva vai prabahuk prajapatirdevebhya vajrasya rupagm samriddhyai || harih om || || krishna
    yajurvediya taittiriya samhitayam shashthakande shashthah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहितायां षष्ठकाण्डे षष्ठः प्रश्नः सोममन्त्रब्राह्मणनिरूपणं ओ
    श्री गुरुभ्यो नमः । ह॒रिः॒ ओम् ॥ सु॒व॒र्गाय॒ वा ए॒तानि॑ लो॒काय॑ हूयन्ते॒ य क्षि॒णानि॒ द्वाभ्या॒ ह॑पत्ये
    जुहोति द्वि॒पा द्यज॑मानः॒ प्रति॑ष्ठित्या॒ आग्नी द्ध्रे जुहोत्य॒न्तरि॑क्ष ए॒वा ऽभ्यैति॑ सुव॒र्गमे॒वैनं॑
    ङ्ग॑मयति सौ॒रीभ्या॑मृ॒ग्भ्या ह॑पत्ये जुहोत्य॒मुमे॒वैनं॑ लोँ॒कग्ं स॒मारो॑हयति॒ नय॑वत्य॒र्चा द्ध्रे
    जुहोति सुव॒र्गस्य॑ लो॒कस्या॒भिनी ङ्गच्छ॒ सुवः॑ प॒तेति॒ हिर॑ण्यग्ं द्गृ॑ह्णाति सुव॒र्गमे॒वैनं॑ ङ्ग॑मयति
    रू॒पेण॑ वो रू॒पम॒भ्यैमीत्या॑ह रू॒पेण॒ ह्या॑साग्ं रू॒पम॒भ्यैति॒ यद्धिर॑ण्येन तु॒थो वो॑ वि॒श्ववे॑दा॒
    वि भ॑ज॒त्वित्या॑ह तु॒थो ह॑ स्म॒ वै वि॒श्ववे॑दा दे॒वाना॒ न्दक्षि॑णा॒ वि भ॑जति॒ तेनै॒वैना॒ वि भ॑जत्ये॒
    त मित्या॑ह॒ सोम॑च्युत॒ग्ग्॒ ह्य॑स्य॒ राध॒ ऐति॒ तन्मि॒त्रस्य॑ प॒था न॒येत्या॑ह॒ शान्त्या॑ ऋ॒तस्य॑ प॒था
    प्रेत॑ च॒न्द्र द॑क्षिणा॒ इत्या॑ह स॒त्यं वाँ ऋ॒तग्ं स॒त्येनै॒वैना॑ ऋ॒तेन॒ वि भ॑जति य॒ज्ञस्य॑ प॒था सु॑वि॒ता
    नय॑न्ती॒रित्या॑ह य॒ज्ञस्य॒ ह्ये॑ताः प॒था यन्ति॒ य द्दक्षि॑णा ब्राह्म॒णम॒द्य रा न्तस्मा॑दे॒वमा॑ह॒ वि
    सुवः॒ पश्य॒ व्य॑न्तरि॑क्ष॒मित्या॑ह सुव॒र्गमे॒वैनं॑ ङ्ग॑मयति॒ यत॑स्व सद॒स्यै॑रित्या॑ह मित्र॒त्वाया॒स्मद्दा
    त्रा देव॒त्रा ग॑च्छत॒ मधु॑मतीः प्रदा॒तार॒मा वि॑श॒तेत्या॑ह व॒यमि॒ह प्र॑दा॒तार॒ ऽस्मान॒मुत्र॒ मधु॑मती॒रा
    वि॑श॒तेति॒ न्ददाति॒ ज्योति॒र्वै हिर॑ण्य॒ ञ्ज्योति॑रे॒व पु॒रस्ता द्धत्ते सुव॒र्गस्य॑ लो॒कस्यानु॑ख्यात्या
    अ॒ग्नीधे॑ ददात्य॒ग्निमु॑खाने॒वर्तू न्प्री॑णाति ब्र॒ह्मणे॑ ददाति॒ प्रसू त्यै॒ होत्रे॑ ददात्या॒त्मा
    वा ए॒ष य॒ज्ञस्य॒ यद्धोता॒ ऽऽत्मान॑मे॒व य॒ज्ञस्य॒ दक्षि॑णाभि॒ म॒मुत्र॒ मधु॑मती॒रा वि॑श॒तेत्य॒ स॒मि॒ष्ट॒
    य॒जूग्ंषि॑ जुहोति य॒ज्ञस्य॒ समि॑ष्ट्यै॒ यद्वै य॒ज्ञस्य॑ क्रू॒रं यँद॒त्येति॒ यन्नात्येति॒ यद॑तिक॒रोति॒
    यन्नापि॑ क॒रोति॒ तदे॒व तैः प्री॑णाति॒ नव॑ जुहोति॒ नव॒ वै पुरु॑षे प्रा॒णाः पुरु॑षेण य॒ज्ञ स्सम्मि॑तो॒
    यावा॑ने॒व य॒ज्ञस्त डृग्मि॑याणि जुहोति॒ षड्वा ऋ॒तव॑ ऋ॒तूने॒व प्री॑णाति॒ त्रीणि॒ यजूग्ं॑षि॒ त्रय॑ इ॒मे
    लो॒का इ॒माने॒व लो॒का न्प्री॑णाति॒ यज्ञ॑ य॒ज्ञ ङ्ग॒च्छेत्या॑ह य॒ज्ञप॑तिमे॒वैन॑ ङ्ग॒च्छेत्या॑ह॒ स्वामे॒वैनं॒
    ङ्गमयत्ये॒ष ते॑ य॒ज्ञो य॑ज्ञपते स॒हसू स्सु॒वीर॒ इत्या॑ह॒ यज॑मान ए॒व वी॒र्य॑ न्दधाति वासि॒ष्ठो ह॑ सात्यह॒व्यो
    दे॑वभा॒ग विति॒ स हो॑वाच य॒ज्ञप॑ता॒विति॑ स॒त्याद्वै सृञ्ज॑याः॒ परा॑ बभूवु॒रिति॑ होवाच य॒ज्ञे वाव य॒ज्ञः
    प्र॑ति॒ष्ठाप्य॑ आसी॒ ऽप॑राभावा॒येति॒ देवा॑ गातुविदो गा॒तुं मि॒तेत्या॑ह य॒ज्ञ ए॒व य॒ज्ञ म्प्रति॑ ष्ठापयति॒
