id: rakshakalakarastavah
category: raksha
name:
  english: rakshakalakarastavah
  devanagari: रक्षाकालकरस्तवः
content:
  english: rakshakalakarastavah om namo lokanathaya | maya kritani papani kayavakacittasancayaih | tatsarvam
    hara me natha raksha mam lokanayaka || 1|| nepale dvadashabdeshu anavrishtirmahabhayam | narendradevam
    samsthapya raksha mam lokanayaka || 2|| martyabhumau ca patale duhkhino bahulaukikah | sukhavriddhikarastesham
    raksha mam lokanayaka || 3|| yatra yatra gatastatra sarvasattvanukampaya | samuddharasi papebhyo raksha
    mam lokanayaka || 4|| samsare vyapito'ham tu katham param prayasyate | tvameva sharanam tatra raksha
    mam lokanayaka || 5|| sarvadevamayastvam hi sarvabuddhamayastatha | sarvasiddhimayashcaiva raksha
    mam lokanayaka || 6|| sada kripamayastvam hi sada rakshamayo'si ca | sada prajnamayastvam hi raksha
    mam lokanayaka || 7|| yena yena kritam karma tena tenaiva dharitam | yadyadiccham pradatasi raksha
    mam lokanayaka || 8|| sukhavatim na sampraptam yavaddhi sarvasattvakam | tavatsamsaragarte'smin raksha
    mam lokanayaka || 9|| jnaninam jnanarupo'si duhkhinam duhkhaharakah | kaminam kamarupo'si raksha mam
    lokanayaka || 10|| pujaniyo'si lokesha pranavasya svarupadhrik | vandaniyah sada tvam hi raksha mam
    lokanayaka || 11|| bharti va bhartiko vapi mitram va shatruko'pi va | sarvatra ca dayayukto raksha
    mam lokanayaka || 12|| lokanatha jagatsvamin subhaktikritacetasa | tvam namami punarbhuyo raksha mam
    lokanayaka || 13|| anekaduhkhabhagasmi bhishmairvai kashtasankataih | dayasva cavalokesha mocayasva
    ca mam kshanat || 14|| sarvadekshasusampatam vartayan kuru me'kshayam | astu te karuna mahyam bhaktim
    caivacalam kuru || 15|| iti shrimadaryavalokiteshvarabhattarakasya rakshakala
  devanagari: रक्षाकालकरस्तवः ॐ नमो लोकनाथाय । मया कृतानि पापानि कायवाकचित्तसञ्चयैः । तत्सर्वं हर मे नाथ
    रक्ष मां लोकनायक ॥ १॥ नेपाले द्वादशाब्देषु अनावृष्टिर्महाभयम् । नरेन्द्रदेवं संस्थाप्य रक्ष मां लोकनायक
    ॥ २॥ मर्त्यभूमौ च पाताले दुःखिनो बहुलौकिकाः । सुखवृद्धिकरस्तेषां रक्ष मां लोकनायक ॥ ३॥ यत्र यत्र गतस्तत्र
    सर्वसत्त्वानुकम्पया । समुद्धरसि पापेभ्यो रक्ष मां लोकनायक ॥ ४॥ संसारे व्यापितोऽहं तु कथं पारं प्रयास्यते
    । त्वमेव शरणं तत्र रक्ष मां लोकनायक ॥ ५॥ सर्वदेवमयस्त्वं हि सर्वबुद्धमयस्तथा । सर्वसिद्धिमयश्चैव रक्ष
    मां लोकनायक ॥ ६॥ सदा कृपामयस्त्वं हि सदा रक्षामयोऽसि च । सदा प्रज्ञामयस्त्वं हि रक्ष मां लोकनायक ॥
    ७॥ येन येन कृतं कर्म तेन तेनैव धारितम् । यद्यदिच्छां प्रदातासि रक्ष मां लोकनायक ॥ ८॥ सुखावतीं न संप्राप्तं
    यावद्धि सर्वसत्त्वकम् । तावत्संसारगर्तेऽस्मिन् रक्ष मां लोकनायक ॥ ९॥ ज्ञानिनां ज्ञानरूपोऽसि दुःखिनां
    दुःखहारकः । कामिनां कामरूपोऽसि रक्ष मां लोकनायक ॥ १०॥ पूजनीयोऽसि लोकेश प्रणवस्य स्वरूपधृक् । वन्दनीयः
    सदा त्वं हि रक्ष मां लोकनायक ॥ ११॥ भर्ति वा भर्तिको वापि मित्रं वा शत्रुकोऽपि वा । सर्वत्र च दयायुक्तो
    रक्ष मां लोकनायक ॥ १२॥ लोकनाथ जगत्स्वामिन् सुभक्तिकृतचेतसा । त्वां नमामि पुनर्भूयो रक्ष मां लोकनायक
    ॥ १३॥ अनेकदुःखभागस्मि भीष्मैर्वै कष्टसङ्कटैः । दयस्व चावलोकेश मोचयस्व च मां क्षणात् ॥ १४॥ सर्वदेक्षासुसम्पातं
    वर्तयन् कुरु मेऽक्षयम् । अस्तु ते करुणा मह्यं भक्तिं चैवाचलां कुरु ॥ १५॥ इति श्रीमदार्यावलोकितेश्वरभट्टारकस्य
    रक्षाकाल
