id: omnamonarayanayashtaksharamantramahatmya
category: stotram
name:
  english: omnamonarayanayashtaksharamantramahatmya
  devanagari: ॐनमोनारायणायाष्टाक्शरमन्त्रमाहात्म्य
content:
  english: ashtaksharam pravakshyami mantranam mantramuttamam | yam japan mucyate martyo janmasamsarabandhanat
    || 2|| hritpundarikamadhyastham shankhacakragadadharam | ekagramanasa dhyatva vishnum kuryajjapam
    dvijah || 3|| ekante nirjanasthane vishnavagre va jalantike | japedashtaksharam mantram citte vishnum
    nidhaya vai || 4|| ashtaksharasya mantrasya rishirnarayanah svayam | chandashca daivi gayatri paramatma
    ca devata || 5|| shuklavarnam ca omkaram nakaram raktamucyate | mokaram varnatah krishnam nakaram
    raktamucyate || 6|| rakaram kunkumabham tu yakaram pitamucyate | nakaramanjanabham tu yakaram bahuvarnakam
    || 7|| om namo narayanayeti mantrah sarvarthasadhakah | bhaktanam japatam tata svargamokshaphalapradah
    | vedanam pranavenaisha siddho mantrah sanatanah || 8|| sarvapapaharah shriman sarvamantreshu cottamah
    | enamashtaksharam mantram japannarayanam smaret || 9|| samdhyavasane satatam sarvapapaih pramucyate
    | esha eva paro mantra esha eva param tapah || 10|| esha eva paro moksha esha svarga udahritah | sarvavedarahasyebhyah
    sara esha samuddhritah || 11|| vishnuna vaishnavanam hi hitaya manujam pura | evam jnatva tato vipro
    hyashtaksharamimam smaret || 12|| snatva shucih shucau deshe japet papavishuddhaye | jape dane ca
    home ca gamane dhyanaparvasu || 13|| japennarayanam mantram karmapurve pare tatha | japetsahasram
    niyutam shucirbhutva samahitah || 14|| masi masi tu dvadashyam vishnubhakto dvijottamah | snatva shucirjapedyastu
    namo narayanam shatam || 15|| sa gacchet paramam devam narayanamanamayam | gandhapushpadibhirvishnumanenaradhya
    yo japet || 16|| mahapatakayukto'pi mucyate natra samshayah | hridi kritva harim devam mantramenam
    tu yo japet || 17|| sarvapapavishuddhatma sa gacchet paramam gatim | prathamena tu lakshena atmashuddhirbhavishyati
    || 18|| dvitiyena tu lakshena manusiddhimavapnuyat | tritiyena tu lakshena svargalokamavapnuyat ||
    19|| caturthena tu lakshena hareh samipyamapnuyat | pancamena tu lakshena nirmalam jnanamapnuyat ||
    20|| tatha shashthena lakshena bhavedvishnau sthira matih | saptamena tu lakshena svarupam pratipadyate
    || 21|| ashtamena tu lakshena nirvanamadhigacchati | svasvadharmasamayukto japam kuryad dvijottamah
    || 22|| etat siddhikaram mantramashtaksharamatandritah | duhsvapnasurapaishaca uraga brahmarakshasah
    || 23|| japinam nopasarpanti caurakshudradhayastatha | ekagramanasavyagro vishnubhakto dridhavratah
    || 24|| japennarayanam mantrametanmrityubhayapaham | mantranam paramo mantro devatanam ca daivatam
    || 25|| guhyanam paramam guhyamomkaradyaksharashtakam | ayushyam dhanaputramshca pashun vidyam mahadyashah
    || 26|| dharmarthakamamokshamshca labhate ca japannarah | etat satyam ca dharmyam ca vedashrutinidarshanat
    || 27|| etat siddhikaram nrinam mantrarupam na samshayah | rishayah pitaro devah siddhastvasurarakshasah
    || 28|| etadeva param japtva param siddhimito gatah | jnatva yastvatmanah kalam shastrantaravidhanatah
    | antakale japanneti tadvishnoh paramam padam || 29|| narayanaya nama ityayameva satyam samsaraghoravishasamharanaya
    mantrah | sha
  devanagari: अष्टाक्षरं प्रवक्ष्यामि मन्त्राणां मन्त्रमुत्तमम् । यं जपन् मुच्यते मर्त्यो जन्मसंसारबन्धनात्
    ॥ २॥ हृत्पुण्डरीकमध्यस्थं शङ्खचक्रगदाधरम् । एकाग्रमनसा ध्यात्वा विष्णुं कुर्याज्जपं द्विजः ॥ ३॥ एकान्ते
    निर्जनस्थाने विष्णवग्रे वा जलान्तिके । जपेदष्टाक्षरं मन्त्रं चित्ते विष्णुं निधाय वै ॥ ४॥ अष्टाक्षरस्य
    मन्त्रस्य ऋषिर्नारायणः स्वयम् । छन्दश्च दैवी गायत्री परमात्मा च देवता ॥ ५॥ शुक्लवर्णं च ॐकारं नकारं
    रक्तमुच्यते । मोकारं वर्णतः कृष्णं नाकारं रक्तमुच्यते ॥ ६॥ राकारं कुङ्कुमाभं तु यकारं पीतमुच्यते ।
    णाकारमञ्जनाभं तु यकारं बहुवर्णकम् ॥ ७॥ ॐ नमो नारायणायेति मन्त्रः सर्वार्थसाधकः । भक्तानां जपतां तात
    स्वर्गमोक्षफलप्रदः । वेदानां प्रणवेनैष सिद्धो मन्त्रः सनातनः ॥ ८॥ सर्वपापहरः श्रीमान् सर्वमन्त्रेषु
    चोत्तमः । एनमष्टाक्षरं मन्त्रं जपन्नारायणं स्मरेत् ॥ ९॥ संध्यावसाने सततं सर्वपापैः प्रमुच्यते । एष
    एव परो मन्त्र एष एव परं तपः ॥ १०॥ एष एव परो मोक्ष एष स्वर्ग उदाहृतः । सर्ववेदरहस्येभ्यः सार एष समुद्धॄतः
    ॥ ११॥ विष्णुना वैष्णवानां हि हिताय मनुजां पुरा । एवं ज्ञात्वा ततो विप्रो ह्यष्टाक्षरमिमं स्मरेत् ॥
    १२॥ स्नात्वा शुचिः शुचौ देशे जपेत् पापविशुद्धये । जपे दाने च होमे च गमने ध्यानपर्वसु ॥ १३॥ जपेन्नारायणं
    मन्त्रं कर्मपूर्वे परे तथा । जपेत्सहस्रं नियुतं शुचिर्भूत्वा समाहितः ॥ १४॥ मासि मासि तु द्वादश्यां
    विष्णुभक्तो द्विजोत्तमः । स्नात्वा शुचिर्जपेद्यस्तु नमो नारायणं शतम् ॥ १५॥ स गच्छेत् परमं देवं नारायणमनामयम्
    । गन्धपुष्पादिभिर्विष्णुमनेनाराध्य यो जपेत् ॥ १६॥ महापातकयुक्तोऽपि मुच्यते नात्र संशयः । हृदि कृत्वा
    हरिं देवं मन्त्रमेनं तु यो जपेत् ॥ १७॥ सर्वपापविशुद्धात्मा स गच्छेत् परमां गतिम् । प्रथमेन तु लक्षेण
    आत्मशुद्धिर्भविष्यति ॥ १८॥ द्वितीयेन तु लक्षेण मनुसिद्धिमवाप्नुयात् । तृतीयेन तु लक्षेण स्वर्गलोकमवाप्नुयात्
    ॥ १९॥ चतुर्थेन तु लक्षेण हरेः सामीप्यमाप्नुयात् । पञ्चमेन तु लक्षेण निर्मलं ज्ञानमाप्नुयात् ॥ २०॥
    तथा षष्ठेन लक्षेण भवेद्विष्णौ स्थिरा मतिः । सप्तमेन तु लक्षेण स्वरूपं प्रतिपद्यते ॥ २१॥ अष्टमेन तु
    लक्षेण निर्वाणमधिगच्छति । स्वस्वधर्मसमायुक्तो जपं कुर्याद् द्विजोत्तमः ॥ २२॥ एतत् सिद्धिकरं मन्त्रमष्टाक्षरमतन्द्रितः
    । दुःस्वप्नासुरपैशाचा उरगा ब्रह्मराक्षसाः ॥ २३॥ जापिनं नोपसर्पन्ति चौरक्षुद्राधयस्तथा । एकाग्रमनसाव्यग्रो
    विष्णुभक्तो दृढव्रतः ॥ २४॥ जपेन्नारायणं मन्त्रमेतन्मृत्युभयापहम् । मन्त्राणां परमो मन्त्रो देवतानां
    च दैवतम् ॥ २५॥ गुह्यानां परमं गुह्यमोंकाराद्यक्षराष्टकम् । आयुष्यं धनपुत्रांश्च पशून् विद्यां महद्यशः
    ॥ २६॥ धर्मार्थकाममोक्षांश्च लभते च जपन्नरः । एतत् सत्यं च धर्म्यं च वेदश्रुतिनिदर्शनात् ॥ २७॥ एतत्
    सिद्धिकरं नृणां मन्त्ररूपं न संशयः । ऋषयः पितरो देवाः सिद्धास्त्वसुरराक्षसाः ॥ २८॥ एतदेव परं जप्त्वा
    परां सिद्धिमितो गताः । ज्ञात्वा यस्त्वात्मनः कालं शास्त्रान्तरविधानतः । अन्तकाले जपन्नेति तद्विष्णोः
    परमं पदम् ॥ २९॥ नारायणाय नम इत्ययमेव सत्यं संसारघोरविषसंहरणाय मन्त्रः । श
