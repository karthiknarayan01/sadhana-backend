id: mritasanjivana-kavacha-stotram
category: stotram
name:
  english: Mritasanjivana Kavacha Stotram
content:
  english: evamaradhya gaurisham devam mrityunjayeshvaram | mritasanjivanam namna kavacam prajapet sada
    || || saratsarataram punyam guhyadguhyataram shubham | mahadevasya kavacam mritasanjivanamakam ||
    || samahitamana bhutva shrinushva kavacam shubham | shritvaitaddivya kavacam rahasyam kuru sarvada
    || || varabhayakaro yajva sarvadevanishevitah | mrityunjayo mahadevah pracyam mam patu sarvada ||
    || dadhanah shaktimabhayam trimukham shadbhujah prabhuh | sadashivo'gnirupi mamagneyyam patu sarvada
    || || ashtadashabhujopeto dandabhayakaro vibhuh | yamarupi mahadevo dakshinasyam sadavatu || || khadgabhayakaro
    dhiro rakshogananishevitah | rakshorupi mahesho mam nairrityam sarvadavatu || || pashabhayabhujah
    sarvaratnakaranishevitah | varunatma mahadevah pashcime mam sadavatu || || gadabhayakarah prananayakah
    sarvadagatih | vayavyam marutatma mam shankarah patu sarvada || || shankhabhayakarastho mam nayakah
    parameshvarah | sarvatmantaradigbhage patu mam shankarah prabhuh || || shulabhayakarah sarvavidyanamadhinayakah
    | ishanatma tathaishanyam patu mam parameshvarah || || urdhvabhage brahmarupi vishvatmadhah sadavatu
    | shiro me shankarah patu lalatam candrashekharah || || bhrumadhyam sarvalokeshastrinetro locane'vatu
    | bhruyugmam girishah patu karnau patu maheshvarah || || nasikam me mahadeva oshthau patu vrishadhvajah
    | jihvam me dakshinamurtirdantanme girisho'vatu || || mrityunjayo mukham patu kantham me nagabhushanah
    | pinaki matkarau patu trishuli hridayam mama || || pancavaktrah stanau patu udaram jagadishvarah
    | nabhim patu virupakshah parshvau me parvatipatih || || katadvayam girisho me prishtham me pramathadhipah
    | guhyam maheshvarah patu mamoru patu bhairavah || || januni me jagaddharta janghe me jagadambika
    | padau me satatam patu lokavandyah sadashivah || || girishah patu me bharyam bhavah patu sutanmama
    | mrityunjayo mamayushyam cittam me gananayakah || || sarvangam me sada patu kalakalah sadashivah
    | etatte kavacam punyam devatanam ca durlabham || || mritasanjivanam namna mahadevena kirtitam | sahasravartanam
    casya purashcaranamiritam || || yah patheccrinuyannityam shravayetsu samahitah | sa kalamrityum nirjitya
    sadayushyam samashnute || || hastena va yada sprishtva mritam sanjivayatyasau | adhayovyadhayastasya
    na bhavanti kadacana || || kalamrityumapi praptamasau jayati sarvada | animadigunaishvaryam labhate
    manavottamah || || yuddharambhe pathitvedamashtavimshativarakam | yuddhamadhye sthitah shatruh sadyah
    sarvairna drishyate || || na brahmadini castrani kshayam kurvanti tasya vai | vijayam labhate devayuddhamadhye'pi
    sarvada || || pratarutthaya satatam yah pathetkavacam shubham | akshayyam labhate saukhyamihaloke
    paratra ca || || sarvavyadhivinirmuktah sarvarogavivarjitah | ajaramarano bhutva sada shodashavarshikah
    || || vicaratyakhilanlokanprapya bhogamshca durlabhan | tasmadidam mahagopyam kavacam samudahritam
    || || mritasanjivanam namna devatairapi durlabham || || iti vasishtha krita mritasanjivana kavaca
    stotram ||
  devanagari: एवमाराध्य गौरीशं देवं मृत्युञ्जयेश्वरम् । मृतसञ्जीवनं नाम्ना कवचं प्रजपेत् सदा ॥ ॥ सारात्सारतरं
    पुण्यं गुह्याद्गुह्यतरं शुभम् । महादेवस्य कवचं मृतसञ्जीवनामकम् ॥ ॥ समाहितमना भूत्वा शृणुष्व कवचं शुभम्
    । शृत्वैतद्दिव्य कवचं रहस्यं कुरु सर्वदा ॥ ॥ वराभयकरो यज्वा सर्वदेवनिषेवितः । मृत्युञ्जयो महादेवः
    प्राच्यां मां पातु सर्वदा ॥ ॥ दधानः शक्तिमभयां त्रिमुखं षड्भुजः प्रभुः । सदाशिवोऽग्निरूपी मामाग्नेय्यां
    पातु सर्वदा ॥ ॥ अष्टादशभुजोपेतो दण्डाभयकरो विभुः । यमरूपी महादेवो दक्षिणस्यां सदावतु ॥ ॥ खड्गाभयकरो
    धीरो रक्षोगणनिषेवितः । रक्षोरूपी महेशो मां नैरृत्यां सर्वदावतु ॥ ॥ पाशाभयभुजः सर्वरत्नाकरनिषेवितः
    । वरुणात्मा महादेवः पश्चिमे मां सदावतु ॥ ॥ गदाभयकरः प्राणनायकः सर्वदागतिः । वायव्यां मारुतात्मा मां
    शङ्करः पातु सर्वदा ॥ ॥ शङ्खाभयकरस्थो मां नायकः परमेश्वरः । सर्वात्मान्तरदिग्भागे पातु मां शङ्करः प्रभुः
    ॥ ॥ शूलाभयकरः सर्वविद्यानामधिनायकः । ईशानात्मा तथैशान्यां पातु मां परमेश्वरः ॥ ॥ ऊर्ध्वभागे ब्रह्मरूपी
    विश्वात्माधः सदावतु । शिरो मे शङ्करः पातु ललाटं चन्द्रशेखरः ॥ ॥ भ्रूमध्यं सर्वलोकेशस्त्रिनेत्रो लोचनेऽवतु
    । भ्रूयुग्मं गिरिशः पातु कर्णौ पातु महेश्वरः ॥ ॥ नासिकां मे महादेव ओष्ठौ पातु वृषध्वजः । जिह्वां मे
    दक्षिणामूर्तिर्दन्तान्मे गिरिशोऽवतु ॥ ॥ मृत्युञ्जयो मुखं पातु कण्ठं मे नागभूषणः । पिनाकि मत्करौ पातु
    त्रिशूलि हृदयं मम ॥ ॥ पञ्चवक्त्रः स्तनौ पातु उदरं जगदीश्वरः । नाभिं पातु विरूपाक्षः पार्श्वौ मे पार्वतीपतिः
    ॥ ॥ कटद्वयं गिरीशो मे पृष्ठं मे प्रमथाधिपः । गुह्यं महेश्वरः पातु ममोरू पातु भैरवः ॥ ॥ जानुनी मे जगद्धर्ता
    जङ्घे मे जगदम्बिका । पादौ मे सततं पातु लोकवन्द्यः सदाशिवः ॥ ॥ गिरिशः पातु मे भार्यां भवः पातु सुतान्मम
    । मृत्युञ्जयो ममायुष्यं चित्तं मे गणनायकः ॥ ॥ सर्वाङ्गं मे सदा पातु कालकालः सदाशिवः । एतत्ते कवचं
    पुण्यं देवतानां च दुर्लभम् ॥ ॥ मृतसञ्जीवनं नाम्ना महादेवेन कीर्तितम् । सहस्रावर्तनं चास्य पुरश्चरणमीरितम्
    ॥ ॥ यः पठेच्चृणुयान्नित्यं श्रावयेत्सु समाहितः । स कालमृत्युं निर्जित्य सदायुष्यं समश्नुते ॥ ॥ हस्तेन
    वा यदा स्पृष्ट्वा मृतं सञ्जीवयत्यसौ । आधयोव्याधयस्तस्य न भवन्ति कदाचन ॥ ॥ कालमृत्युमपि प्राप्तमसौ
    जयति सर्वदा । अणिमादिगुणैश्वर्यं लभते मानवोत्तमः ॥ ॥ युद्धारम्भे पठित्वेदमष्टाविंशतिवारकम् । युद्धमध्ये
    स्थितः शत्रुः सद्यः सर्वैर्न दृश्यते ॥ ॥ न ब्रह्मादीनि चास्त्राणि क्षयं कुर्वन्ति तस्य वै । विजयं
    लभते देवयुद्धमध्येऽपि सर्वदा ॥ ॥ प्रातरुत्थाय सततं यः पठेत्कवचं शुभम् । अक्षय्यं लभते सौख्यमिहलोके
    परत्र च ॥ ॥ सर्वव्याधिविनिर्मुक्तः सर्वरोगविवर्जितः । अजरामरणो भूत्वा सदा षोडशवार्षिकः ॥ ॥ विचरत्यखिलान्लोकान्प्राप्य
    भोगांश्च दुर्लभान् । तस्मादिदं महागोप्यं कवचं समुदाहृतम् ॥ ॥ मृतसञ्जीवनं नाम्ना देवतैरपि दुर्लभम्
    ॥ ॥ इति वसिष्ठ कृत मृतसञ्जीवन कवच स्तोत्रम् ॥
