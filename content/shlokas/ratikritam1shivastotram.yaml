id: ratikritam1shivastotram
category: stotram
name:
  english: ratikritam1shivastotram
  devanagari: रतिकृतं१शिवस्तोत्रम्
content:
  english: ratikritam 1 shivastotram ratishcapi tada shambhum jagama sharanam tatah | uddhulyagatram shubhrena
    hridyena smarabhasmana || 142|| janubhyamavanim gatva provaca duhkhasagara | namo'stu shambhave namna
    karmana duhkhadaya ca || 143|| namaste parvatismartre ratya vilapakarine | satimrigaya namah kadacitkayogine
    namah || 144|| namo mayadyadhishthaya mayahinaya te namah | namo brahmasvarupaya krishnarupaya te
    namah || 145|| namo vairajarupaya sadashivaya te namah | namah shivaya rudraya lingarupaya te namah
    || 146|| namo jyotihsvarupaya shatarudraya te namah | namaste kotirudraya namah kailasavasine || 147||
    namaste dvisvarupaya duhkhavirahine namah | satinathaya shantaya yogine te namonamah || 148|| namo
    vrishabharupaya sharabhaya ca te namah | namah kiratarupaya vivastraya ca te namah || 149|| brahmanishu
    bhikshukaya ratiramaya te namah | anangaya mahangaya jivanaya ca te namah || 150|| namaste'stu sakamaya
    dhvastakamaya te namah | namaste'stu sharanyaya bhakteshtadaya te namah || 151|| namo'stvasahyakopaya
    priya''ptidaya te namah | prayaccha kamadravyam me katham jive patim vina || 152|| iti shrilakshminarayaniyasamhitayam
    prathame kritayugasantane 185
  devanagari: रतिकृतं १ शिवस्तोत्रम् रतिश्चापि तदा शम्भुं जगाम शरणं ततः । उद्धूल्यगात्रं शुभ्रेण हृद्येन
    स्मरभस्मना ॥ १४२॥ जानुभ्यामवनिं गत्वा प्रोवाच दुःखसागरा । नमोऽस्तु शम्भवे नाम्ना कर्मणा दुःखदाय च
    ॥ १४३॥ नमस्ते पार्वतीस्मर्त्रे रत्या विलापकारिणे । सतीमृगाय नमः कादाचित्कयोगिने नमः ॥ १४४॥ नमो मायाद्यधिष्ठाय
    मायाहीनाय ते नमः । नमो ब्रह्मस्वरूपाय कृष्णरूपाय ते नमः ॥ १४५॥ नमो वैराजरूपाय सदाशिवाय ते नमः । नमः
    शिवाय रुद्राय लिङ्गरूपाय ते नमः ॥ १४६॥ नमो ज्योतिःस्वरूपाय शतरुद्राय ते नमः । नमस्ते कोटिरुद्राय नमः
    कैलासवासिने ॥ १४७॥ नमस्ते द्विस्वरूपाय दुःखविरहिणे नमः । सतीनाथाय शान्ताय योगिने ते नमोनमः ॥ १४८॥
    नमो वृषभरूपाय शरभाय च ते नमः । नमः किरातरूपाय विवस्त्राय च ते नमः ॥ १४९॥ ब्राह्मणीषु भिक्षुकाय रतिरामाय
    ते नमः । अनङ्गाय महाङ्गाय जीवनाय च ते नमः ॥ १५०॥ नमस्तेऽस्तु सकामाय ध्वस्तकामाय ते नमः । नमस्तेऽस्तु
    शरण्याय भक्तेष्टदाय ते नमः ॥ १५१॥ नमोऽस्त्वसह्यकोपाय प्रियाऽऽप्तिदाय ते नमः । प्रयच्छ कामद्रव्यं मे
    कथं जीवे पतिं विना ॥ १५२॥ इति श्रीलक्ष्मीनारायणीयसंहितायां प्रथमे कृतयुगसन्ताने १८५
