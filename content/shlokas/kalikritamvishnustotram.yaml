id: kalikritamvishnustotram
category: stotram
name:
  english: kalikritamvishnustotram
  devanagari: कलिकृतंविष्णुस्तोत्रम्
content:
  english: kalikritam vishnustotram kaliruvaca | namo'nantaya mahate sarvakalapravartine || 12|| caturyugakrite
    tubhyam vasudevaya sakshine | dashavataraya hare namastubhyam namo namah || 13|| namah shaktyavataraya
    ramakrishnaya te namah | namo matsyavataraya mahate gauravasine || 14|| namo bhaktavataraya kalpakshetranivasine
    | rajna vedavata natha mama sthanam vinashitam | mama priyasya mlecchasya tatpitra vamshanashanam
    || 15|| iti bhavishyaparane pratisargaparvani prathamakhande caturthadhyayantargatam kalikritam vishnustotram
    samaptam | bhavishyapurana | pratisargaparva | prathamakhanda | adhyaya 4
  devanagari: कलिकृतं विष्णुस्तोत्रम् कलिरुवाच । नमोऽनन्ताय महते सर्वकालप्रवर्तिने ॥ १२॥ चतुर्युगकृते
    तुभ्यं वासुदेवाय साक्षिणे । दशावताराय हरे नमस्तुभ्यं नमो नमः ॥ १३॥ नमः शक्त्यवताराय रामकृष्णाय ते
    नमः । नमो मत्स्यावताराय महते गौरवासिने ॥ १४॥ नमो भक्तावताराय कल्पक्षेत्रनिवासिने । राज्ञा वेदवता नाथ
    मम स्थानं विनाशितम् । मम प्रियस्य म्लेच्छस्य तत्पित्रा वंशनाशनम् ॥ १५॥ इति भविष्यपरणे प्रतिसर्गपर्वणि
    प्रथमखण्डे चतुर्थाध्यायान्तर्गतं कलिकृतं विष्णुस्तोत्रं समाप्तम् । भविष्यपुराण । प्रतिसर्गपर्व । प्रथमखण्ड
    । अध्याय ४
meaning: {}
