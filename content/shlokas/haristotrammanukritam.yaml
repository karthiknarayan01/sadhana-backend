id: haristotrammanukritam
category: stotram
name:
  english: haristotrammanukritam
  devanagari: हरिस्तोत्रम्मनुकृतं
content:
  english: namaste jagadavyaktaparaparapate hare | pavakadityashitamshunetratrayadharavyaya || 22|| jagatkaranasarvajna
    jagaddhama hare para | paraparatmarupatman parinam parakarana || 23|| atmanamatmana dhritva dhararupadharo
    hare | vibharshi sakalan lokanadharatmamstrivikrama || 24|| sarvavedamayashreshtha dhamadharanakarana
    | suraughaparameshana narayana sureshvara || 25|| ayonistvam jagadyonirapadastvam sadagatih | tvam
    tejah sparshahinashca sarveshastvamanishvara || 26|| tvamanadih samastadistam nityanantaro'ntarah
    | yaddhaimamandam jagatam bijam brahmandasamjnitam || 27|| tadbijam bhavatastejastvayoktam salileshu
    ca | sarvadharo niradharo nirhetuh sarvakaranam || 28|| namo namaste vishvesha lokanam prabhava prabho
    | srishtisthityantahetustvam vidhivishnuharatmadhrik || 29|| yasya te dashadha murtirurmishatkadivarjita
    | jyotih patistvamambhodhistasmai tubhyam namo namah || 30|| kaste bhavam vaktumishah paresha sthulatsthulo
    yo'nurupo'rthavargat | tasmai nityam me namo'stvadya yo'bhu
  devanagari: नमस्ते जगदव्यक्तपरापरपते हरे । पावकादित्यशीतांशुनेत्रत्रयधराव्यय ॥ २२॥ जगत्कारणसर्वज्ञ जगद्धाम
    हरे पर । परापरात्मरूपात्मन् पारिणां पारकारण ॥ २३॥ आत्मानमात्मना धृत्वा धरारूपधरो हरे । विभर्षि सकलान्
    लोकानाधारात्मंस्त्रिविक्रम ॥ २४॥ सर्ववेदमयश्रेष्ठ धामधारणकारण । सुरौघपरमेशान नारायण सुरेश्वर ॥ २५॥
    अयोनिस्त्वं जगद्योनिरपादस्त्वं सदागतिः । त्वं तेजः स्पर्शहीनश्च सर्वेशस्त्वमनीश्वर ॥ २६॥ त्वमनादिः
    समस्तादिस्तं नित्यानन्तरोऽन्तरः । यद्धैममण्डं जगतां बीजं ब्रह्माण्डसंज्ञितम् ॥ २७॥ तद्बीजं भवतस्तेजस्त्वयोक्तं
    सलिलेषु च । सर्वाधारो निराधारो निर्हेतुः सर्वकारणम् ॥ २८॥ नमो नमस्ते विश्वेश लोकानां प्रभव प्रभो ।
    सृष्टिस्थित्यन्तहेतुस्त्वं विधिविष्णुहरात्मधृक् ॥ २९॥ यस्य ते दशधा मूर्तिरूर्मिषट्कादिवर्जिता । ज्योतिः
    पतिस्त्वमम्भोधिस्तस्मै तुभ्यं नमो नमः ॥ ३०॥ कस्ते भावं वक्तुमीशः परेश स्थूलात्स्थूलो योऽनुरूपोऽर्थवर्गात्
    । तस्मै नित्यं मे नमोऽस्त्वद्य योऽभू
