id: naciketakritamyamastotram
category: stotram
name:
  english: naciketakritamyamastotram
  devanagari: नचिकेतकृतंयमस्तोत्रम्
content:
  english: naciketakritam yamastotram 4 atha stutih krita tasya sushantahridayena vai | tvam vai karmaphaladata
    pitrinam paramo mahan || 6|| shraddhe dhata vidhata ca dharmaraja
  devanagari: नचिकेतकृतं यमस्तोत्रम् ४ अथ स्तुतिः कृता तस्य सुशान्तहृदयेन वै । त्वं वै कर्मफलदाता पितॄणां
    परमो महान् ॥ ६॥ श्राद्धे धाता विधाता च धर्मराज
meaning: {}
