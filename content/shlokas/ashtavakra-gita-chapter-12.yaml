id: ashtavakra-gita-chapter-12
category: stotram
name:
  english: Ashtavakra Gita Chapter 12
content:
  english: janaka uvaca || kayakrityasahah purvam tato vagvistarasahah | atha cintasahastasmad evamevahamasthitah
    || || prityabhavena shabdaderadrishyatvena catmanah | vikshepaikagrahridaya evamevahamasthitah ||
    || samadhyasadivikshiptau vyavaharah samadhaye | evam vilokya niyamamevamevahamasthitah || || heyopadeyavirahad
    evam harshavishadayoh | abhavadadya he brahmann evamevahamasthitah || || ashramanashramam dhyanam
    cittasvikritavarjanam | vikalpam mama vikshyaitairevamevahamasthitah || || karmanushthanamajnanad
    yathaivoparamastatha | budhva samyagidam tattvamevamevahamasthitah || || acintyam cintyamano'pi cintarupam
    bhajatyasau | tyaktva tadbhavanam tasmad evamevahamasthitah || || evameva kritam yena sa kritartho
    bhavedasau | evameva svabhavo yah sa kritartho bhavedasau ||
  devanagari: जनक उवाच ॥ कायकृत्यासहः पूर्वं ततो वाग्विस्तरासहः । अथ चिन्तासहस्तस्माद् एवमेवाहमास्थितः
    ॥ ॥ प्रीत्यभावेन शब्दादेरदृश्यत्वेन चात्मनः । विक्षेपैकाग्रहृदय एवमेवाहमास्थितः ॥ ॥ समाध्यासादिविक्षिप्तौ
    व्यवहारः समाधये । एवं विलोक्य नियममेवमेवाहमास्थितः ॥ ॥ हेयोपादेयविरहाद् एवं हर्षविषादयोः । अभावादद्य
    हे ब्रह्मन्न् एवमेवाहमास्थितः ॥ ॥ आश्रमानाश्रमं ध्यानं चित्तस्वीकृतवर्जनम् । विकल्पं मम वीक्ष्यैतैरेवमेवाहमास्थितः
    ॥ ॥ कर्मानुष्ठानमज्ञानाद् यथैवोपरमस्तथा । बुध्वा सम्यगिदं तत्त्वमेवमेवाहमास्थितः ॥ ॥ अचिन्त्यं चिन्त्यमानोऽपि
    चिन्तारूपं भजत्यसौ । त्यक्त्वा तद्भावनं तस्माद् एवमेवाहमास्थितः ॥ ॥ एवमेव कृतं येन स कृतार्थो भवेदसौ
    । एवमेव स्वभावो यः स कृतार्थो भवेदसौ ॥
