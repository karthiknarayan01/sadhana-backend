content:
  english: dhira shankarabharanam janyaragam catushruti dhaivatam arohana tisra jati triputa talam angah
    kannada sahityam analekara unni poladi sakala shastra purana dinam tala dinam tala parigatu re re
    setu vaha pariga | da pa || pa ma ri | da da | da pa || sa ka la | sha la | pa ri | ga tu || pa ma
    ri | sa ri | sa ri || pa ma pa | sa ri | sa ri || re || pa pa da | pa pa | ma ri || ri sa ri | ma
    | da pa | ma pa || pa ri ga | tam | da pa || pa ma ri | da da | da pa || sa ka la | sha la | pa ri
    | ga tu || pa ma ri | sa ri | sa ri || pa ma pa | sa ri | sa ri || re || pa pa da | pa pa | ma ri
    || ri sa ri | ma
  devanagari: धीर शङ्कराभरणं जन्यरागम् चतुश्रुति धैवतम् आरोहण तिस्र जाति त्रिपुट तालम् अङ्गाः कन्नड साहित्यम्
    आनलेकर उन्नि पोलदि सकल शास्त्र पुराण दीनम् ताल दीनं ताल परिगतु रे रे सेतु वाह परिग । द प ॥ प म रि
    । द द । द प ॥ स क ल । शा ल । प रि । ग तु ॥ प म रि । स रि । स रि ॥ प म प । स रि । स रि ॥ रे ॥ प प द
    । प प । म रि ॥ रि स रि । म । द प । म प ॥ प रि ग । तं । द प ॥ प म रि । द द । द प ॥ स क ल । शा ल । प
    रि । ग तु ॥ प म रि । स रि । स रि ॥ प म प । स रि । स रि ॥ रे ॥ प प द । प प । म रि ॥ रि स रि । म
