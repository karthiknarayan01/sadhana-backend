id: vishnusahasranamastotramskandapurana
category: sahasranama
name:
  english: vishnusahasranamastotramskandapurana
  devanagari: विष्णुसहस्रनामस्तोत्रम्स्कन्दपुराण
content:
  english: cakrasthashcakrapalasthashcakravarti naradhipah || 80|| ayurvedavido vaidyo dhanvantarishca
    rogaha | aushadhibijasambhuto rogi rogavinashakrita || 81|| cetanashcetako'cintyashcittacintavinashakrit
    | atindriyah sukhasparshashcaracari vihangamah || 82|| garudah pakshirajashca cakshusho vinatatmajah
    | vishnuyanavimanastho manomayaturangamah || 83|| bahuvrishtikaro varshi airavanaviravanah | uccaihshrava'runo
    gami haridashvo haripriyah || 84|| pravrisho meghamali ca gajaratnapurandarah | vasudo vasudharashca
    nidraluh pannagashanah || 85|| sheshashayi jaleshayi vyasah satyavatisutah | vedavyasakaro vaggmi
    bahushakhavikalpakah || 86|| smritih puranadharmarthi paravaravicakshanah | sahasrashirsha sahasrakshah
    sahasravadanojjvalah || 87|| sahasrabahuh sahasramshuh sahasrakirano narah | bahushirshaikashirshashca
    trishira vishirah shiri || 88|| jatilo bhasmaragi ca divyambaradharah shucih | anurupo brihadrupo
    virupo vikarakritih || 89|| samudramathako mathi sarvaratnaharo harih | vajravaiduryako vajri cintamanimahamanih
    || 90|| anirmulyo mahamulyo nirmulyah surabhih sukhi | pita mata shishurbandhurdhata tvashtaryama
    yamah || 91|| antahstho bahyakari ca bahihstho vai bahishcarah | pavanah pavakah paki sarvabhakshi
    hutashanah || 92|| bhagavanbhagaha bhagi bhavabhanjo bhayankarah | kayasthah karyakari ca karyakarta
    karapradah || 93|| ekadharma dvidharma ca sukhi dutyopajivakah | balakastarakastrata kalo mushakabhakshakah
    || 94|| sanjivano jivakarta sajivo jivasambhavah | shadvimshako mahavishnuh sarvavyapi maheshvarah
    || 95|| divyangado muktamali shrivatso makaradhvajah | shyamamurtirghanashyamah pitavasah shubhananah
    || 96|| ciravasa vivasashca bhutadanavavallabhah | amrito'mritabhagi ca mohinirupadharakah || 97||
    divyadrishtih samadrishtirdevadanavavancakah | kabandhah ketukari ca svarbhanushcandratapanah || 98||
    graharajo grahi grahah sarvagrahavimocakah | danamanajapo homah sanukulah shubhagrahah || 99|| vighnakarta'paharta
    ca vighnanasho vinayakah | apakaropakari ca sarvasiddhiphalapradah || 100|| sevakah samadani ca bhedi
    dandi ca matsari | dayavandanashilashca dani yajva pratigrahi || 101|| haviragnishcarusthali samidhashcanilo
    yamah | hotodgata shucih kundah samago vaikritih savah || 102|| dravyam patrani sankalpo mushalo hyaranih
    kushah | dikshito mandapo vediryajamanah pashuh kratuh || 103|| dakshina svastimansvasti hyashirvadah
    shubhapradah | adivriksho mahavriksho devavriksho vanaspatih || 104|| prayago venumanveni nyagrodhashca'kshayo
    vatah | sutirthastirthakari ca tirtharajo vrati vatah || 105|| vrittidata prithuh putro dogdha gaurvatsa
    eva ca | kshiram kshiravahah kshiri kshirabhagavibhagavit || 106|| rajyabhagavido bhagi sarvabhagavikalpakah
    | vahano vahako vegi padacari tapashcarah || 107|| gopano gopako gopi gopakanyaviharakrit | vasudevo
    vishalakshah krishnogopijanapriyah || 108|| devakinandano nandi nandagopagriha''shrami | yashodanandano
    dami damodara ulukhali || 109|| putanarih padakari lilashakatabhanjakah | navanitapriyo vaggmi vatsapalakabalakah
    || 110|| vatsarupadharo vatsi vatsaha dhenukantakrit | bakarirvanavasi ca vanakridavisharadah || 111||
    krishnavarnakritih kanto venuvetravidharakah | gopamokshakaro moksho yamunapulinecarah || 112|| mayavatsakaro
    mayi brahmamayapamohakah | atmasaraviharajno gopadarakadarakah || 113|| gocari gopatirgopo govardhanadharo
    bali | indradyumno makhadhvamsi vrishtiha goparakshakah || 114|| surabhitranakarta ca davapanakarah
    kali | kaliyamardanah kali yamunahradaviharakah || 115|| sankarshano balashlaghyo baladevo halayudhah
    | langali musali cakri ramo rohininandanah || 116|| yamunakarshanoddharo nilavasa halo hali | revati
    ramano lolo bahumanakarah parah || 117|| dhenukarirmahaviro gopakanyavidushakah | kamamanaharah kami
    gopivaso'pataskarah || 118|| venuvadi ca nadi ca nrityagitavisharadah | gopimohakaro gani rasako rajanicarah
    || 119|| divyamali vimali ca vanamalavibhushitah | kaitabharishca kamsarirmadhuha madhusudanah ||
    120|| canuramardano mallo mushti mushtikanashakrit | muraha modaka modi madaghno narakantakrit ||
    121|| vidyadhyayi bhumishayi sudama susakha sukhi | sakalo vikalo vaidyah kalito vai kalanidhih ||
    122|| vidyashali vishali ca pitrimatrivimokshakah | rukminiramano ramyah kalindipatih shankhaha ||
    123|| pancajanyo mahapadmo bahunayakanayakah | dhundhumaro nikumbhaghnah shambaranto ratipriyah ||
    124|| pradyumnashcaniruddhashca satvatam patirarjunah | phalgunashca gudakeshah savyasaci dhananjayah
    || 125|| kiriti ca dhanushpanirdhanurvedavisharadah || shikhandi satyakih shaibyo bhimo bhimaparakramah
    || 126|| pancalashcabhimanyushca saubhadro draupadipati | yudhishthiro dharmarajah satyavadi shucivratah
    || 127|| nakulah sahadevashca karno duryodhano ghrini | gangeyo'thagadapanirbhishmo bhagirathisutah
    || 128|| prajnacakshurdhritarashtro bharadvajo'thagautamah | ashvatthama vikarnashcajahnuryuddhavisharadah
    || 129|| simantiko gadi galvo vishvamitro durasadah | durvasa durvinitashca markandeyo mahamunih ||
    130|| lomasho nirmalo'lomi dirghayushca ciro'ciri | punarjivi mrito bhavi bhuto bhavyo bhavishyakah
    || 131|| trikalo'tha trilingashca trinetrastripadipatih | yadavo yajnavalkyashca yaduvamshavivardhanah
    || 132|| shalyakridi vikridashca yadavantakarah kalih | sadayo hridayo dayo dayado dayabhagdayi ||
    133|| mahodadhirmahiprishtho nilaparvatavasakrita | ekavarno vivarnashca sarvavarnabahishcarah ||
    134|| yajnanindi vedanindi vedabahyo balo balih | bauddharirbadhako badho jagannatho jagatpatih ||
    135|| bhaktirbhagavato bhagi vibhakto bhagavatpriyah | trigramo'tha navaranyo guhyopanishadasanah
    || 136|| shaligramah shilayukto vishalo gandakashrayah | shrutadevah shrutah shravi shrutabodhah shrutashravah
    || 137|| kalkih kalakalah kalko dushtamlecchavinasha krit | kunkumi dhavalo dhirah kshamakaro vrishakapih
    || 138|| kinkarah kinnarah kanvah keki kimpurushadhipah | ekaroma viroma ca bahuroma brihatkavih ||
    139|| vajrapraharano vajri vritraghno vasavanujah | bahutirthakarastirthah sarvatirthajaneshvarah
    || 140|| vyatipatoparagashca danavriddhikarah shubhah | asankhyeyo'prameyashca sankhyakaro visankhyakah
    || 141|| mihikottarakastaro balacandrah sudhakarah | kimvarnah kidrishah kincitkimsvabhavah kimashrayah
    || 142|| nirlokashca nirakari bahvakaraikakarakah | dauhitrah putrikah pautro napta vamshadharo dharah
    || 143|| dravibhuto dayalushca sarvasiddhiprado manih || 144|| adharo'pi vidharashca dharasunuh sumangalah
    | mangalo mangalakaro mangalyah sarvamangalah || 145|| namnam sahasram namedam vishnoratulatejasah
    | sarvasiddhikaram kamyam punyam hariharatmakam || 146|| yah pathetpratarutthaya shucirbhutva samahitah
    | yashcedam sha
  devanagari: चक्रस्थश्चक्रपालस्थश्चक्रवर्ती नराधिपः ॥ ८०॥ आयुर्वेदविदो वैद्यो धन्वन्तरिश्च रोगहा । औषधीबीजसम्भूतो
    रोगी रोगविनाशकृत ॥ ८१॥ चेतनश्चेतकोऽचिन्त्यश्चित्तचिन्ताविनाशकृत् । अतीन्द्रियः सुखस्पर्शश्चरचारी विहङ्गमः
    ॥ ८२॥ गरुडः पक्षिराजश्च चाक्षुषो विनतात्मजः । विष्णुयानविमानस्थो मनोमयतुरङ्गमः ॥ ८३॥ बहुवृष्टिकरो
    वर्षी ऐरावणविरावणः । उच्चैःश्रवाऽरुणो गामी हरिदश्वो हरिप्रियः ॥ ८४॥ प्रावृषो मेघमाली च गजरत्नपुरन्दरः
    । वसुदो वसुधारश्च निद्रालुः पन्नगाशनः ॥ ८५॥ शेषशायी जलेशायी व्यासः सत्यवतीसुतः । वेदव्यासकरो वाग्ग्मी
    बहुशाखाविकल्पकः ॥ ८६॥ स्मृतिः पुराणधर्मार्थी परावरविचक्षणः । सहस्रशीर्षा सहस्राक्षः सहस्रवदनोज्ज्वलः
    ॥ ८७॥ सहस्रबाहुः सहस्रांशुः सहस्रकिरणो नरः । बहुशीर्षैकशीर्षश्च त्रिशिरा विशिराः शिरी ॥ ८८॥ जटिलो
    भस्मरागी च दिव्याम्बरधरः शुचिः । अणुरूपो बृहद्रूपो विरूपो विकराकृतिः ॥ ८९॥ समुद्रमाथको माथी सर्वरत्नहरो
    हरिः । वज्रवैडूर्यको वज्री चिन्तामणिमहामणिः ॥ ९०॥ अनिर्मूल्यो महामूल्यो निर्मूल्यः सुरभिः सुखी । पिता
    माता शिशुर्बन्धुर्धाता त्वष्टार्यमा यमः ॥ ९१॥ अन्तःस्थो बाह्यकारी च बहिःस्थो वै बहिश्चरः । पावनः पावकः
    पाकी सर्वभक्षी हुताशनः ॥ ९२॥ भगवान्भगहा भागी भवभञ्जो भयङ्करः । कायस्थः कार्यकारी च कार्यकर्ता करप्रदः
    ॥ ९३॥ एकधर्मा द्विधर्मा च सुखी दूत्योपजीवकः । बालकस्तारकस्त्राता कालो मूषकभक्षकः ॥ ९४॥ सञ्जीवनो जीवकर्ता
    सजीवो जीवसम्भवः । षड्विंशको महाविष्णुः सर्वव्यापी महेश्वरः ॥ ९५॥ दिव्याङ्गदो मुक्तमाली श्रीवत्सो मकरध्वजः
    । श्याममूर्तिर्घनश्यामः पीतवासाः शुभाननः ॥ ९६॥ चीरवासा विवासाश्च भूतदानववल्लभः । अमृतोऽमृतभागी च मोहिनीरूपधारकः
    ॥ ९७॥ दिव्यदृष्टिः समदृष्टिर्देवदानववञ्चकः । कबन्धः केतुकारी च स्वर्भानुश्चन्द्रतापनः ॥ ९८॥ ग्रहराजो
    ग्रही ग्राहः सर्वग्रहविमोचकः । दानमानजपो होमः सानुकूलः शुभग्रहः ॥ ९९॥ विघ्नकर्ताऽपहर्ता च विघ्ननाशो
    विनायकः । अपकारोपकारी च सर्वसिद्धिफलप्रदः ॥ १००॥ सेवकः सामदानी च भेदी दण्डी च मत्सरी । दयावान्दानशीलश्च
    दानी यज्वा प्रतिग्रही ॥ १०१॥ हविरग्निश्चरुस्थाली समिधश्चानिलो यमः । होतोद्गाता शुचिः कुण्डः सामगो
    वैकृतिः सवः ॥ १०२॥ द्रव्यं पात्राणि सङ्कल्पो मुशलो ह्यरणिः कुशः । दीक्षितो मण्डपो वेदिर्यजमानः पशुः
    क्रतुः ॥ १०३॥ दक्षिणा स्वस्तिमान्स्वस्ति ह्याशीर्वादः शुभप्रदः । आदिवृक्षो महावृक्षो देववृक्षो वनस्पतिः
    ॥ १०४॥ प्रयागो वेणुमान्वेणी न्यग्रोधश्चाऽक्षयो वटः । सुतीर्थस्तीर्थकारी च तीर्थराजो व्रती वतः ॥ १०५॥
    वृत्तिदाता पृथुः पुत्रो दोग्धा गौर्वत्स एव च । क्षीरं क्षीरवहः क्षीरी क्षीरभागविभागवित् ॥ १०६॥ राज्यभागविदो
    भागी सर्वभागविकल्पकः । वाहनो वाहको वेगी पादचारी तपश्चरः ॥ १०७॥ गोपनो गोपको गोपी गोपकन्याविहारकृत्
    । वासुदेवो विशालाक्षः कृष्णोगोपीजनप्रियः ॥ १०८॥ देवकीनन्दनो नन्दी नन्दगोपगृहाऽऽश्रमी । यशोदानन्दनो
    दामी दामोदर उलूखली ॥ १०९॥ पूतनारिः पदाकारी लीलाशकटभञ्जकः । नवनीतप्रियो वाग्ग्मी वत्सपालकबालकः ॥ ११०॥
    वत्सरूपधरो वत्सी वत्सहा धेनुकान्तकृत् । बकारिर्वनवासी च वनक्रीडाविशारदः ॥ १११॥ कृष्णवर्णाकृतिः कान्तो
    वेणुवेत्रविधारकः । गोपमोक्षकरो मोक्षो यमुनापुलिनेचरः ॥ ११२॥ मायावत्सकरो मायी ब्रह्ममायापमोहकः । आत्मसारविहारज्ञो
    गोपदारकदारकः ॥ ११३॥ गोचारी गोपतिर्गोपो गोवर्धनधरो बली । इन्द्रद्युम्नो मखध्वंसी वृष्टिहा गोपरक्षकः
    ॥ ११४॥ सुरभित्राणकर्ता च दावपानकरः कली । कालीयमर्दनः काली यमुनाह्रदविहारकः ॥ ११५॥ सङ्कर्षणो बलश्लाघ्यो
    बलदेवो हलायुधः । लाङ्गली मुसली चक्री रामो रोहिणिनन्दनः ॥ ११६॥ यमुनाकर्षणोद्धारो नीलवासा हलो हली ।
    रेवती रमणो लोलो बहुमानकरः परः ॥ ११७॥ धेनुकारिर्महावीरो गोपकन्याविदूषकः । काममानहरः कामी गोपीवासोऽपतस्करः
    ॥ ११८॥ वेणुवादी च नादी च नृत्यगीतविशारदः । गोपीमोहकरो गानी रासको रजनीचरः ॥ ११९॥ दिव्यमाली विमाली च
    वनमालाविभूषितः । कैटभारिश्च कंसारिर्मधुहा मधुसूदनः ॥ १२०॥ चाणूरमर्दनो मल्लो मुष्टी मुष्टिकनाशकृत्
    । मुरहा मोदका मोदी मदघ्नो नरकान्तकृत् ॥ १२१॥ विद्याध्यायी भूमिशायी सुदामा सुसखा सुखी । सकलो विकलो
    वैद्यः कलितो वै कलानिधिः ॥ १२२॥ विद्याशाली विशाली च पितृमातृविमोक्षकः । रुक्मिणीरमणो रम्यः कालिन्दीपतिः
    शङ्खहा ॥ १२३॥ पाञ्चजन्यो महापद्मो बहुनायकनायकः । धुन्धुमारो निकुम्भघ्नः शम्बरान्तो रतिप्रियः ॥ १२४॥
    प्रद्युम्नश्चानिरुद्धश्च सात्वतां पतिरर्जुनः । फाल्गुनश्च गुडाकेशः सव्यसाची धनञ्जयः ॥ १२५॥ किरीटी
    च धनुष्पाणिर्धनुर्वेदविशारदः ॥ शिखण्डी सात्यकिः शैब्यो भीमो भीमपराक्रमः ॥ १२६॥ पाञ्चालश्चाभिमन्युश्च
    सौभद्रो द्रौपदीपति । युधिष्ठिरो धर्मराजः सत्यवादी शुचिव्रतः ॥ १२७॥ नकुलः सहदेवश्च कर्णो दुर्योधनो
    घृणी । गाङ्गेयोऽथगदापाणिर्भीष्मो भागीरथीसुतः ॥ १२८॥ प्रज्ञाचक्षुर्धृतराष्ट्रो भारद्वाजोऽथगौतमः । अश्वत्थामा
    विकर्णश्चजह्नुर्युद्धविशारदः ॥ १२९॥ सीमन्तिको गदी गाल्वो विश्वामित्रो दुरासदः । दुर्वासा दुर्विनीतश्च
    मार्कण्डेयो महामुनिः ॥ १३०॥ लोमशो निर्मलोऽलोमी दीर्घायुश्च चिरोऽचिरी । पुनर्जीवी मृतो भावी भूतो भव्यो
    भविष्यकः ॥ १३१॥ त्रिकालोऽथ त्रिलिङ्गश्च त्रिनेत्रस्त्रिपदीपतिः । यादवो याज्ञवल्क्यश्च यदुवंशविवर्धनः
    ॥ १३२॥ शल्यक्रीडी विक्रीडश्च यादवान्तकरः कलिः । सदयो हृदयो दायो दायदो दायभाग्दयी ॥ १३३॥ महोदधिर्महीपृष्ठो
    नीलपर्वतवासकृत । एकवर्णो विवर्णश्च सर्ववर्णबहिश्चरः ॥ १३४॥ यज्ञनिन्दी वेदनिन्दी वेदबाह्यो बलो बलिः
    । बौद्धारिर्बाधको बाधो जगन्नाथो जगत्पतिः ॥ १३५॥ भक्तिर्भागवतो भागी विभक्तो भगवत्प्रियः । त्रिग्रामोऽथ
    नवारण्यो गुह्योपनिषदासनः ॥ १३६॥ शालिग्रामः शिलायुक्तो विशालो गण्डकाश्रयः । श्रुतदेवः श्रुतः श्रावी
    श्रुतबोधः श्रुतश्रवाः ॥ १३७॥ कल्किः कालकलः कल्को दुष्टम्लेच्छविनाश कृत् । कुङ्कुमी धवलो धीरः क्षमाकरो
    वृषाकपिः ॥ १३८॥ किङ्करः किन्नरः कण्वः केकी किम्पुरुषाधिपः । एकरोमा विरोमा च बहुरोमा बृहत्कविः ॥ १३९॥
    वज्रप्रहरणो वज्री वृत्रघ्नो वासवानुजः । बहुतीर्थकरस्तीर्थः सर्वतीर्थजनेश्वरः ॥ १४०॥ व्यतीपातोपरागश्च
    दानवृद्धिकरः शुभः । असङ्ख्येयोऽप्रमेयश्च सङ्ख्याकारो विसङ्ख्यकः ॥ १४१॥ मिहिकोत्तारकस्तारो बालचन्द्रः
    सुधाकरः । किम्वर्णः कीदृशः किञ्चित्किंस्वभावः किमाश्रयः ॥ १४२॥ निर्लोकश्च निराकारी बह्वाकारैककारकः
    । दौहित्रः पुत्रिकः पौत्रो नप्ता वंशधरो धरः ॥ १४३॥ द्रवीभूतो दयालुश्च सर्वसिद्धिप्रदो मणिः ॥ १४४॥
    आधारोऽपि विधारश्च धरासूनुः सुमङ्गलः । मङ्गलो मङ्गलाकारो माङ्गल्यः सर्वमङ्गलः ॥ १४५॥ नाम्नां सहस्रं
    नामेदं विष्णोरतुलतेजसः । सर्वसिद्धिकरं काम्यं पुण्यं हरिहरात्मकम् ॥ १४६॥ यः पठेत्प्रातरुत्थाय शुचिर्भूत्वा
    समाहितः । यश्चेदं श
