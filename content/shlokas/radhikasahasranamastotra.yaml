id: radhikasahasranamastotra
category: sahasranama
name:
  english: radhikasahasranamastotra
  devanagari: राधिकासहस्रनामस्तोत्र
content:
  english: rinushva girije nityam pathasva ca yathamati || 9|| yasyah prasadat krishnastu golokeshah parah
    prabhuh | asya namasahasrasya rishirnarada eva ca | devi radha para prokta caturvargaprasadhini ||
    10|| ||atha sahasranamastotram || shriradha radhika krishnavallabha krishnasamyuta | vrindavaneshvari
    krishnapriya madanamohini || 11|| shrimati krishnakanta ca krishnanandapradayini | yashasvini yashogamya
    yashodanandavallabha || 12|| damodarapriya gopi gopanandakari tatha | krishnangavasini hridya harikanta
    haripriya || 13|| pradhanagopika gopakanya trailokyasundari | vrindavanaviharini vikashitamukhambuja
    || 14|| gokulanandakartri ca gokulanandadayini | gatiprada gitagamya gamanagamanapriya || 15|| vishnupriya
    vishnukanta vishnoranganivasini | yashodanandapatni ca yashodanandagehini || 16|| kamarikanta kameshi
    kamalalasavigraha | jayaprada jaya jiva jivanandapradayini || 17|| nandanandanapatni ca vrishabhanusuta
    shiva | ganadhyaksha gavadhyaksha gavam gatiranuttama || 18|| kancanabha hemagatra kancanangadadharini
    | ashoka shokarahita vishoka shokanashini || 19|| gayatri vedamata ca vedatita viduttama | nitishastrapriya
    nitigatirmatirabhishtada || 20|| vedapriya vedagarbha vedamargapravardhini | vedagamya vedapara vicitrakanakojjvala
    || 21|| tathojjvalaprada nitya tathaivojjvalagatrika | nandapriya nandasutaradhya''nandaprada shubha
    || 22|| shubhangi vimalangi ca vilasinyaparajita | janani janmashunya ca janmamrityujarapaha || 23||
    gatirgatimatam dhatri dhatryanandapradayini | jagannathapriya shailavasini hemasundari || 24|| kishori
    kamala padma padmahasta payodada | payasvini payodatri pavitri sarvamangala || 25|| mahajivaprada
    krishnakanta kamalasundari | vicitravasini citravasini citrarupini || 26|| nirguna sukulina ca nishkulina
    nirakula | gokulantarageha ca yoganandakari tatha || 27|| venuvadya venuratih venuvadyaparayana |
    gopalasyapriya saumyarupa saumyakulodvaha || 28|| mohamoha vimoha ca gatinishtha gatiprada | girvanavandya
    girvana girvanaganasevita || 29|| lalita ca vishoka ca vishakha citramalini | jitendriya shuddhasattva
    kulina kuladipika || 30|| dipapriya dipadatri vimala vimalodaka | kantaravasini krishna krishnacandrapriya
    matih || 31|| anuttara duhkhahantri duhkhakartri kulodvaha | matirlakshmirdhritirlajja kantih pushtih
    smritih kshama || 32|| kshirodashayini devi devarikulamardini | vaishnavi ca mahalakshmih kulapujya
    kulapriya || 33|| samhartri sarvadaityanam savitri vedagamini | vedatita niralamba niralambaganapriya
    || 34|| niralambajanaih pujya niraloka nirashraya | ekangi sarvaga sevya brahmapatni sarasvati ||
    35|| rasapriya rasagamya rasadhishthatridevata | rasika rasikananda svayam raseshvari para || 36||
    rasamandalamadhyastha rasamandalashobhita | rasamandalasevya ca rasakrida manohara || 37|| pundarikakshanilaya
    pundarikakshagehini | pundarikakshasevya ca pundarikakshavallabha || 38|| sarvajiveshvari sarvajivavandya
    paratpara | prakritih shambhukanta ca sadashivamanohara || 39|| kshutpipasa daya nidra bhrantih shrantih
    kshamakula | vadhurupa gopapatni bharati siddhayogini || 40|| satyarupa nityarupa nityangi nityagehini
    | sthanadatri tatha dhatri mahalakshmih svayamprabha || 41|| sindhukanya''sthanadatri dvarakavasini
    tatha | buddhih sthitih sthanarupa sarvakaranakarana || 42|| bhaktapriya bhaktagamya bhaktanandapradayini
    | bhaktakalpadrumatita tathatitaguna tatha || 43|| mano'dhishthatridevi ca krishnapremaparayana |
    niramaya saumyadatri tatha madanamohini || 44|| ekanamsha shiva kshema durga durgatinashini | ishvari
    sarvavandya ca gopaniya shubhankari || 45|| palinisarvabhutanam tatha kamangaharini | sadyomuktiprada
    devi vedasara paratpara || 46|| himalayasuta sarva parvati girija sati | dakshakanya devamata mandalajja
    harestanuh || 47|| vrindaranyapriya vrinda vrindavanavilasini | vilasini vaishnavi ca brahmalokapratishthita
    || 48|| rukmini revati satyabhama jambavati tatha | sulakshmana mitravinda kalindi jahnukanyaka ||
    49|| paripurna purnatara tatha haimavati gatih | apurva brahmarupa ca brahmandaparipalini || 50||
    brahmandabhandamadyastha brahmandabhandarupini | andarupandamadhyastha tathandaparipalini || 51||
    andabahyandasamhartri shivabrahmaharipriya | mahavishnupriya kalpavriksharupa nirantara || 52|| sarabhuta
    sthira gauri gaurangi shashishekhara | shvetacampakavarnabha shashikotisamaprabha || 53|| malati malyabhushadhya
    malatimalyadharini | krishnastuta krishnakanta vrindavanavilasini || 54|| tulasyadhishthatridevi samsararnavaparada
    | sarada''haradambhoda yashoda gopanandini || 55|| atitagamana gauri paranugrahakarini | karunarnavasampurna
    karunarnavadharini || 56|| madhavi madhavamanoharini shyamavallabha | andhakarabhayadhvasta mangalya
    mangalaprada || 57|| shrigarbha shriprada shrisha shrinivasacyutapriya | shrirupa shrihara shrida
    shrikama shrisvarupini || 58|| shridamanandadatri ca shridameshvaravallabha | shrinitamba shriganesha
    shrisvarupashrita shrutih || 59|| shrikriyarupini shrila shrikrishnabhajananvita | shriradha shrimati
    shreshtha shreshtharupa shrutipriya || 60|| yogeshi yogamata ca yogatita yugapriya | yogapriya yogagamya
    yoginiganavandita || 61|| javakusumasankasa dadimikusumopama | nilambaradhara dhira dhairyarupadhara
    dhritih || 62|| ratnasimhasanastha ca ratnakundalabhushita | ratnalankarasamyukta ratnamaladhara para
    || 63|| ratnendrasaraharadhya ratnamalavibhushita | indranilamaninyastapadapadmashubha shucih || 64||
    karttiki paurnamasi ca amavasya bhayapaha | govindarajagrihini govindaganapujita || 65|| vaikunthanathagrihini
    vaikunthaparamalaya | vaikunthadevadevadhya tatha vaikunthasundari || 66|| mahalasa vedavati sita
    sadhvi pativrata | annapurna sadanandarupa kaivalyasundari || 67|| kaivalyadayini shreshtha gopinathamanohara
    | gopinatheshvari candi nayikanayananvita || 68|| nayika nayakaprita nayakanandarupini | shesha sheshavati
    shesharupini jagadambika || 69|| gopalapalika maya jaya''nandaprada tatha | kumari yauvanananda yuvati
    gopasundari || 70|| gopamata janaki ca janakanandakarini | kailasavasini rambha vairagyakuladipika
    || 71|| kamalakantagrihini kamala kamalalaya | trailokyamata jagatamadhishthatri priyambika || 72||
    harakanta hararata haranandapradayini | harapatni haraprita haratoshanatatpara || 73|| hareshvari
    ramarata rama rameshvari rama | shyamala citralekha ca tatha bhuvanamohini || 74|| sugopi gopavanita
    goparajyaprada shubha | angavapurna maheyi matsyarajasuta sati || 75|| kaumari narasimhi ca varahi
    navadurgika | cancala cancalamoda nari bhuvanasundari || 76|| dakshayajnahara dakshi dakshakanya sulocana
    | ratirupa ratiprita ratishreshtha ratiprada || 77|| ratirlakshmanagehastha viraja bhuvaneshvari |
    shankaspada harerjaya jamatrikulavandita || 78|| bakula bakulamodadharini yamuna jaya | vijaya jayapatni
    ca yamalarjunabhanjini || 79|| vakreshvari vakrarupa vakravikshanavikshita | aparajita jagannatha
    jagannatheshvari yatih || 80|| khecari khecarasuta khecaratvapradayini | vishnuvakshahsthalastha ca
    vishnubhavanatatpara || 81|| candrakotisugatri ca candrananamanohari | sevasevya shiva kshema tatha
    kshemakari vadhuh || 82|| yadavendravadhuh sevya shivabhakta shivanvita | kevala nishphala sukshma
    mahabhima'bhayaprada || 83|| jimutarupa jaimuti jitamitrapramodini | gopalavanita nanda kulajendranivasini
    || 84|| jayanti yamunangi ca yamunatoshakarini | kalikalmashabhanga ca kalikalmashanashini || 85||
    kalikalmasharupa ca nityanandakari kripa | kripavati kulavati kailasacalavasini || 86|| vamadevi vamabhaga
    govindapriyakarini | narendrakanya yogeshi yogini yogarupini || 87|| yogasiddha siddharupa siddhakshetranivasini
    | kshetradhishthatrirupa ca kshetratita kulaprada || 88|| keshavanandadatri ca keshavanandadayini
    | keshava keshavaprita keshavi keshavapriya || 89|| rasakridakari rasavasini rasasundari | gokulanvitadeha
    ca gokulatvapradayini || 90|| lavanganamni narangi narangakulamandana | elalavangakarpuramukhavasamukhanvita
    || 91|| mukhya mukhyaprada mukhyarupa mukhyanivasini | narayani kripatita karunamayakarini || 92||
    karunya karuna karna gokarna nagakarnika | sarpini kaulini kshetravasini jagadanvaya || 93|| jatila
    kutila nila nilambaradhara shubha | nilambaravidhatri ca nilakanthapriya tatha || 94|| bhagini bhagini
    bhogya krishnabhogya bhageshvari | baleshvari balaradhya kanta kantanitambini || 95|| nitambini rupavati
    yuvati krishnapivari | vibhavari vetravati sankata kutilalaka || 96|| narayanapriya shaila srikkaniparimohita
    | drikpatamohita pratarashini navanitika || 97|| navina navanari ca narangaphalashobhita | haimi hemamukhi
    candramukhi shashisushobhana || 98|| ardhacandradhara candravallabha rohini tamih | timinglakulamodamatsyarupangaharini
    || 99|| karini sarvabhutanam karyatita kishorini | kishoravallabha keshakarika kamakarika || 100||
    kameshvari kamakala kalindikuladipika | kalindatanayatiravasini tiragehini || 101|| kadambaripanapara
    kusumamodadharini | kumuda kumudananda krishneshi kamavallabha || 102|| tarkali vaijayanti ca nimbadadimarupini
    | bilvavrikshapriya krishnambara bilvopamastani || 103|| bilvatmika bilvavapurbilvavrikshanivasini
    | tulasitoshika taitilanandaparitoshika || 104|| gajamukta mahamukta mahamuktiphalaprada | anangamohini
    shaktirupa shaktisvarupini || 105|| pancashaktisvarupa ca shaishavanandakarini | gajendragamini shyamalata'nangalata
    tatha || 106|| yoshicchktisvarupa ca yoshidanandakarini | premapriya premarupa premanandatarangini
    || 107|| premahara premadatri premashaktimayi tatha | krishnapremavati dhanya krishnaprematarangini
    || 108|| premabhaktiprada prema premanandatarangini | premakridaparitangi premabhaktitarangini ||
    109|| premarthadayini sarvashveta nityatarangini | havabhavanvita raudra rudranandaprakashini || 110||
    kapila sha
  devanagari: ृणुष्व गिरिजे नित्यं पठस्व च यथामति ॥ ९॥ यस्याः प्रसादात् कृष्णस्तु गोलोकेशः परः प्रभुः
    । अस्या नामसहस्रस्य ऋषिर्नारद एव च । देवी राधा परा प्रोक्ता चतुर्वर्गप्रसाधिनी ॥ १०॥ ॥अथ सहस्रनामस्तोत्रम्
    ॥ श्रीराधा राधिका कृष्णवल्लभा कृष्णसम्युता । वृन्दावनेश्वरी कृष्णप्रिया मदनमोहिनी ॥ ११॥ श्रीमती कृष्णकान्ता
    च कृष्णानन्दप्रदायिनी । यशस्विनी यशोगम्या यशोदानन्दवल्लभा ॥ १२॥ दामोदरप्रिया गोपी गोपानन्दकरी तथा
    । कृष्णाङ्गवासिनी हृद्या हरिकान्ता हरिप्रिया ॥ १३॥ प्रधानगोपिका गोपकन्या त्रैलोक्यसुन्दरी । वृन्दावनविहारिणी
    विकशितमुखाम्बुजा ॥ १४॥ गोकुलानन्दकर्त्री च गोकुलानन्ददायिनी । गतिप्रदा गीतगम्या गमनागमनप्रिया ॥ १५॥
    विष्णुप्रिया विष्णुकान्ता विष्णोरङ्गनिवासिनी । यशोदानन्दपत्नी च यशोदानन्दगेहिनी ॥ १६॥ कामारिकान्ता
    कामेशी कामलालसविग्रहा । जयप्रदा जया जीवा जीवानन्दप्रदायिनी ॥ १७॥ नन्दनन्दनपत्नी च वृषभानुसुता शिवा
    । गणाध्यक्षा गवाध्यक्षा गवां गतिरनुत्तमा ॥ १८॥ काञ्चनाभा हेमगात्रा काञ्चनाङ्गदधारिणी । अशोका शोकरहिता
    विशोका शोकनाशिनी ॥ १९॥ गायत्री वेदमाता च वेदातीत विदुत्तमा । नीतिशास्त्रप्रिया नीतिगतिर्मतिरभीष्टदा
    ॥ २०॥ वेदप्रिया वेदगर्भा वेदमार्गप्रवर्धिनी । वेदगम्या वेदपरा विचित्रकनकोज्ज्वला ॥ २१॥ तथोज्ज्वलप्रदा
    नित्या तथैवोज्ज्वलगात्रिका । नन्दप्रिया नन्दसुतारध्याऽऽनन्दप्रदा शुभा ॥ २२॥ शुभाङ्गी विमलाङ्गी च विलसिन्यपराजिता
    । जननी जन्मशून्या च जन्ममृत्युजरापहा ॥ २३॥ गतिर्गतिमतां धात्री धात्र्यानन्दप्रदायिनी । जगन्नाथप्रिया
    शैलवासिनी हेमसुन्दरी ॥ २४॥ किशोरी कमला पद्मा पद्महस्ता पयोददा । पयस्विनी पयोदात्री पवित्री सर्वमङ्गला
    ॥ २५॥ महाजीवप्रदा कृष्णकान्ता कमलसुन्दरी । विचित्रवासिनी चित्रवासिनी चित्ररूपिणी ॥ २६॥ निर्गुणा सुकुलीना
    च निष्कुलीना निराकुला । गोकुलान्तरगेहा च योगानन्दकरी तथा ॥ २७॥ वेणुवाद्या वेणुरतिः वेणुवाद्यपरायणा
    । गोपालस्यप्रिया सौम्यरूपा सौम्यकुलोद्वहा ॥ २८॥ मोहामोहा विमोहा च गतिनिष्ठा गतिप्रदा । गीर्वाणवन्द्या
    गिर्वाणा गिर्वाणगणसेविता ॥ २९॥ ललिता च विशोका च विशाखा चित्रमालिनी । जितेन्द्रिया शुद्धसत्त्वा कुलीना
    कुलदीपिका ॥ ३०॥ दीपप्रिया दीपदात्री विमला विमलोदका । कान्तारवासिनी कृष्णा कृष्णचन्द्रप्रिया मतिः ॥
    ३१॥ अनुत्तरा दुःखहन्त्री दुःखकर्त्री कुलोद्वहा । मतिर्लक्ष्मीर्धृतिर्लज्जा कान्तिः पुष्टिः स्मृतिः
    क्षमा ॥ ३२॥ क्षीरोदशायिनी देवी देवारिकुलमर्दिनी । वैष्णवी च महालक्ष्मीः कुलपूज्या कुलप्रिया ॥ ३३॥
    संहर्त्री सर्वदैत्यानां सावित्री वेदगामिनी । वेदातीता निरालम्बा निरालम्बगणप्रिया ॥ ३४॥ निरालम्बजनैः
    पूज्या निरालोका निराश्रया । एकाङ्गी सर्वगा सेव्या ब्रह्मपत्नी सरस्वती ॥ ३५॥ रासप्रिया रासगम्या रासाधिष्ठातृदेवता
    । रसिका रसिकानन्दा स्वयम् रासेश्वरी परा ॥ ३६॥ रासमण्डलमध्यस्था रासमण्डलशोभिता । रासमण्डलसेव्या च रासक्रीडा
    मनोहरा ॥ ३७॥ पुण्डरीकाक्षनिलया पुण्डरीकाक्षगेहिनी । पुण्डरीकाक्षसेव्या च पुण्डरीकाक्षवल्लभा ॥ ३८॥
    सर्वजीवेश्वरी सर्वजीववन्द्या परात्परा । प्रकृतिः शम्भुकान्ता च सदाशिवमनोहरा ॥ ३९॥ क्षुत्पिपासा दया
    निद्रा भ्रान्तिः श्रान्तिः क्षमाकुला । वधूरूपा गोपपत्नी भारती सिद्धयोगीनी ॥ ४०॥ सत्यरूपा नित्यरूपा
    नित्याङ्गी नित्यगेहिनी । स्थानदात्री तथा धात्री महालक्ष्मीः स्वयम्प्रभा ॥ ४१॥ सिन्धुकन्याऽऽस्थानदात्री
    द्वारकावासिनी तथा । बुद्धिः स्थितिः स्थानरूपा सर्वकारणकारणा ॥ ४२॥ भक्तप्रिया भक्तगम्या भक्तानन्दप्रदायिनी
    । भक्तकल्पद्रुमातीता तथातीतगुणा तथा ॥ ४३॥ मनोऽधिष्ठातृदेवी च कृष्णप्रेमपरायणा । निरामया सौम्यदात्री
    तथा मदनमोहिनी ॥ ४४॥ एकानंशा शिवा क्षेमा दुर्गा दुर्गतिनाशिनी । ईश्वरी सर्ववन्द्या च गोपनीया शुभङ्करी
    ॥ ४५॥ पालिनीसर्वभूतानां तथा कामाङ्गहारिणी । सद्योमुक्तिप्रदा देवी वेदसारा परात्परा ॥ ४६॥ हिमालयसुता
    सर्वा पार्वती गिरिजा सती । दक्षकन्या देवमाता मन्दलज्जा हरेस्तनुः ॥ ४७॥ वृन्दारण्यप्रिया वृन्दा वृन्दावनविलासिनी
    । विलासिनी वैष्णवी च ब्रह्मलोकप्रतिष्ठिता ॥ ४८॥ रुक्मिणी रेवती सत्यभामा जाम्बवती तथा । सुलक्ष्मणा
    मित्रविन्दा कालिन्दी जह्नुकन्यका ॥ ४९॥ परिपूर्णा पूर्णतरा तथा हैमवती गतिः । अपूर्वा ब्रह्मरूपा च ब्रह्माण्डपरिपालिनी
    ॥ ५०॥ ब्रह्माण्डभाण्डमद्यस्था ब्रह्माण्डभाण्डरूपिणी । अण्डरूपाण्डमध्यस्था तथाण्डपरिपालिनी ॥ ५१॥ अण्डबाह्याण्डसंहर्त्री
    शिवब्रह्महरिप्रिया । महाविष्णुप्रिया कल्पवृक्षरूपा निरन्तरा ॥ ५२॥ सारभूता स्थिरा गौरी गौराङ्गी शशिशेखरा
    । श्वेतचम्पकवर्णाभा शशिकोटिसमप्रभा ॥ ५३॥ मालती माल्यभूषाढ्या मालतीमाल्यधारिणी । कृष्णस्तुता कृष्णकान्ता
    वृन्दावनविलासिनी ॥ ५४॥ तुलस्यधिष्ठातृदेवी संसारार्णवपारदा । सारदाऽऽहारदाम्भोदा यशोदा गोपनन्दिनी ॥
    ५५॥ अतीतगमना गौरी परानुग्रहकारिणी । करुणार्णवसम्पूर्णा करुणार्णवधारिणी ॥ ५६॥ माधवी माधवमनोहारिणी श्यामवल्लभा
    । अन्धकारभयध्वस्ता मङ्गल्या मङ्गलप्रदा ॥ ५७॥ श्रीगर्भा श्रीप्रदा श्रीशा श्रीनिवासाच्युतप्रिया । श्रीरूपा
    श्रीहरा श्रीदा श्रीकामा श्रीस्वरूपिणी ॥ ५८॥ श्रीदामानन्ददात्री च श्रीदामेश्वरवल्लभा । श्रीनितम्बा
    श्रीगणेशा श्रीस्वरूपाश्रिता श्रुतिः ॥ ५९॥ श्रीक्रियारूपिणी श्रीला श्रीकृष्णभजनान्विता । श्रीराधा श्रीमती
    श्रेष्ठा श्रेष्ठरूपा श्रुतिप्रिया ॥ ६०॥ योगेशी योगमाता च योगातिता युगप्रिया । योगप्रिया योगगम्या योगिनीगणवन्दिता
    ॥ ६१॥ जवाकुसुमसङ्कासा दाडिमीकुसुमोपमा । नीलाम्बरधरा धीरा धैर्यरूपधरा धृतिः ॥ ६२॥ रत्नसिंहासनस्था च
    रत्नकुण्डलभूषिता । रत्नालङ्कारसम्युक्ता रत्नमालाधरा परा ॥ ६३॥ रत्नेन्द्रसारहाराढ्या रत्नमालाविभूषिता
    । इन्द्रनीलमणिन्यस्तपादपद्मशुभा शुचिः ॥ ६४॥ कार्त्तिकी पौर्णमासी च अमावस्या भयापहा । गोविन्दराजगृहिनी
    गोविन्दगणपूजिता ॥ ६५॥ वैकुण्ठनाथगृहिणी वैकुण्ठपरमालया । वैकुण्ठदेवदेवाढ्या तथा वैकुण्ठसुन्दरी ॥ ६६॥
    महालसा वेदवती सीता साध्वी पतिव्रता । अन्नपूर्णा सदानन्दरूपा कैवल्यसुन्दरी ॥ ६७॥ कैवल्यदायिनी श्रेष्ठा
    गोपीनाथमनोहरा । गोपीनाथेश्वरी चण्डी नायिकानयनान्विता ॥ ६८॥ नायिका नायकप्रीता नायकानन्दरूपिणी । शेषा
    शेषवती शेषरूपिणी जगदम्बिका ॥ ६९॥ गोपालपालिका माया जायाऽऽनन्दप्रदा तथा । कुमारी यौवनानन्दा युवती गोपसुन्दरी
    ॥ ७०॥ गोपमाता जानकी च जनकानन्दकारिणी । कैलासवासिनी रम्भा वैराग्याकुलदीपिका ॥ ७१॥ कमलाकान्तगृहिनी कमला
    कमलालया । त्रैलोक्यमाता जगतामधिष्ठात्री प्रियाम्बिका ॥ ७२॥ हरकान्ता हररता हरानन्दप्रदायिनी । हरपत्नी
    हरप्रीता हरतोषणतत्परा ॥ ७३॥ हरेश्वरी रामरता रामा रामेश्वरी रमा । श्यामला चित्रलेखा च तथा भुवनमोहिनी
    ॥ ७४॥ सुगोपी गोपवनिता गोपराज्यप्रदा शुभा । अङ्गावपूर्णा माहेयी मत्स्यराजसुता सती ॥ ७५॥ कौमारी नारसिंही
    च वाराही नवदुर्गिका । चञ्चला चञ्चलामोदा नारी भुवनसुन्दरी ॥ ७६॥ दक्षयज्ञहरा दाक्षी दक्षकन्या सुलोचना
    । रतिरूपा रतिप्रीता रतिश्रेष्ठा रतिप्रदा ॥ ७७॥ रतिर्लक्ष्मणगेहस्था विरजा भुवनेश्वरी । शङ्कास्पदा हरेर्जाया
    जामातृकुलवन्दिता ॥ ७८॥ बकुला बकुलामोदधारिणी यमुना जया । विजया जयपत्नी च यमलार्जुनभञ्जिनी ॥ ७९॥ वक्रेश्वरी
    वक्ररूपा वक्रवीक्षणवीक्षिता । अपराजिता जगन्नाथा जगन्नाथेश्वरी यतिः ॥ ८०॥ खेचरी खेचरसुता खेचरत्वप्रदायिनी
    । विष्णुवक्षःस्थलस्था च विष्णुभावनतत्परा ॥ ८१॥ चन्द्रकोटिसुगात्री च चन्द्राननमनोहरी । सेवासेव्या शिवा
    क्षेमा तथा क्षेमकारी वधूः ॥ ८२॥ यादवेन्द्रवधूः सेव्या शिवभक्ता शिवान्विता । केवला निष्फला सूक्ष्मा
    महाभीमाऽभयप्रदा ॥ ८३॥ जीमूतरूपा जैमूती जितामित्रप्रमोदिनी । गोपालवनिता नन्दा कुलजेन्द्रनिवासिनी ॥
    ८४॥ जयन्ती यमुनाङ्गी च यमुनातोषकारिणी । कलिकल्मषभङ्गा च कलिकल्मषनाशिनी ॥ ८५॥ कलिकल्मषरूपा च नित्यानन्दकरी
    कृपा । कृपावती कुलवती कैलासाचलवासिनी ॥ ८६॥ वामदेवी वामभागा गोविन्दप्रियकारिणी । नरेन्द्रकन्या योगेशी
    योगिनी योगरूपिणी ॥ ८७॥ योगसिद्धा सिद्धरूपा सिद्धक्षेत्रनिवासिनी । क्षेत्राधिष्ठातृरूपा च क्षेत्रातीता
    कुलप्रदा ॥ ८८॥ केशवानन्ददात्री च केशवानन्ददायिनी । केशवा केशवप्रीता केशवी केशवप्रिया ॥ ८९॥ रासक्रीडाकरी
    रासवासिनी राससुन्दरी । गोकुलान्वितदेहा च गोकुलत्वप्रदायिनी ॥ ९०॥ लवङ्गनाम्नी नारङ्गी नारङ्गकुलमण्डना
    । एलालवङ्गकर्पूरमुखवासमुखान्विता ॥ ९१॥ मुख्या मुख्यप्रदा मुख्यरूपा मुख्यनिवासिनी । नारायणी कृपातीता
    करुणामयकारिणी ॥ ९२॥ कारुण्या करुणा कर्णा गोकर्णा नागकर्णिका । सर्पिणी कौलिनी क्षेत्रवासिनी जगदन्वया
    ॥ ९३॥ जटिला कुटिला नीला नीलाम्बरधरा शुभा । नीलाम्बरविधात्री च नीलकण्ठप्रिया तथा ॥ ९४॥ भगिनी भागिनी
    भोग्या कृष्णभोग्या भगेश्वरी । बलेश्वरी बलाराध्या कान्ता कान्तनितम्बिनी ॥ ९५॥ नितम्बिनी रूपवती युवती
    कृष्णपीवरी । विभावरी वेत्रवती सङ्कटा कुटिलालका ॥ ९६॥ नारायणप्रिया शैला सृक्कणीपरिमोहिता । दृक्पातमोहिता
    प्रातराशिनी नवनीतिका ॥ ९७॥ नवीना नवनारी च नारङ्गफलशोभिता । हैमी हेममुखी चन्द्रमुखी शशिसुशोभना ॥ ९८॥
    अर्धचन्द्रधरा चन्द्रवल्लभा रोहिणी तमिः । तिमिङ्ग्लकुलामोदमत्स्यरूपाङ्गहारिणी ॥ ९९॥ कारिणी सर्वभूतानां
    कार्यातीता किशोरिणी । किशोरवल्लभा केशकारिका कामकारिका ॥ १००॥ कामेश्वरी कामकला कालिन्दीकूलदीपिका ।
    कलिन्दतनयातीरवासिनी तीरगेहिनी ॥ १०१॥ कादम्बरीपानपरा कुसुमामोदधारिणी । कुमुदा कुमुदानन्दा कृष्णेशी
    कामवल्लभा ॥ १०२॥ तर्काली वैजयन्ती च निम्बदाडिमरूपिणी । बिल्ववृक्षप्रिया कृष्णाम्बरा बिल्वोपमस्तनी
    ॥ १०३॥ बिल्वात्मिका बिल्ववपुर्बिल्ववृक्षनिवासिनी । तुलसीतोषिका तैतिलानन्दपरितोषिका ॥ १०४॥ गजमुक्ता
    महामुक्ता महामुक्तिफलप्रदा । अनङ्गमोहिनी शक्तिरूपा शक्तिस्वरूपिणी ॥ १०५॥ पञ्चशक्तिस्वरूपा च शैशवानन्दकारिणी
    । गजेन्द्रगामिनी श्यामलताऽनङ्गलता तथा ॥ १०६॥ योषिच्छ्क्तिस्वरूपा च योषिदानन्दकारिणी । प्रेमप्रिया
    प्रेमरूपा प्रेमानन्दतरङ्गिणी ॥ १०७॥ प्रेमहारा प्रेमदात्री प्रेमशक्तिमयी तथा । कृष्णप्रेमवती धन्या
    कृष्णप्रेमतरङ्गिणी ॥ १०८॥ प्रेमभक्तिप्रदा प्रेमा प्रेमानन्दतरङ्गिणी । प्रेमक्रीडापरीताङ्गी प्रेमभक्तितरङ्गिणी
    ॥ १०९॥ प्रेमार्थदायिनी सर्वश्वेता नित्यतरङ्गिणी । हावभावान्विता रौद्रा रुद्रानन्दप्रकाशिनी ॥ ११०॥
    कपिला श
