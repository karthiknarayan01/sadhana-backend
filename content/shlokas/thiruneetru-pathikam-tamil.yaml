id: thiruneetru-pathikam-tamil
category: stotram
name:
  english: Thiruneetru Pathikam (Tamil)
content:
  english: tiruccirrampalam mantiram avatu niri vanavar melatu niri cuntaram avatu niri tutikkap patuvatu
    niri tantiram avatu niri camayattil ullatu niri cèntuvar vayumai pankan tiru ala vayan tiruniṟe vetattil
    ullatu niri vèntuyar tirppatu niri potan taruvatu niri punmai tavirppatu niri òtat takuvatu niri unmaiyil
    ullatu niri citap punalvayal culnta tiru ala vayan tiruniṟe mukti taruvatu niri munivar anivatu niri
    cattiyam avatu niri takkor pukalvatu niri patti taruvatu niri parava iniyatu niri citti taruvatu niri
    tiru ala vayan tiruniṟe kana iniyatu niri kavinait taruvatu niri peni anipavark kèllam pèrumai kòtuppatu
    niri manant takaivatu niri matiyait taruvatu niri cenant taruvatu niri tiru ala vayan tiruniṟe puca
    iniyatu niri punniyam avatu niri peca iniyatu niri pèruntavat toṟkalukkèllam acaikètuppatu niri antama
    tavatu niri tecam pukalvatu niri tiru ala vayan tiruniṟe aruttama tavatu niri avalam arippatu niri
    varuttant tanippatu niri vanam alippatu niri pòruttama tavatu niri punniyar pucumvèn niri tiruttaku
    malikai culntac tiru ala vayan tiruniṟe èyilatu attatu niri irumaikkum ullatu niri payilap patuvatu
    niri pakkiya mavatu niri tuyilait tatuppatu niri cuttama tavatu niri ayilaip pòli taru culat tala
    vayan tiruniṟe iravanan melatu niri ènnat takuvatu niri paravana mavatu niri pavam arippatu niri taravana
    mavatu niri tattuvam avatu niri aravanan kuntiru meni ala vayan tiruniṟe malò tayanaṟi yata vannamum
    ullatu niri meluṟai tevarkal tankal mèyyatu vènpòti niri ela utampitar tirkkum inpant taruvatu niri
    alamatu unta mitarrèm malavayan tiruniṟe kuntikaik kaiyarkalotu cakkiyar kuttamun kutak kantikaip
    pippatu meluṟai niri karuta iniyatu niri ènticaip patta pòrular ettunt takaiyatu niri antattavar panintettum
    ala vayan tiruniṟe arral atal vitai erim ala vayan tirunirraip porri pukali nilavum pucuran nanacampantan
    territ tènnan utalurra tippini ayina tirac carriya patalkal pattum vallavar nallavartame tiruccirrampalam
  devanagari: तिरुच्चिर्रम्पलम् मन्तिरं आवतु नीऋ वानवर् मेलतु नीऋ चुन्तरं आवतु नीऋ तुतिक्कप् पटुवतु नीऋ
    तन्तिरं आवतु नीऋ चमयत्तिल् उल्लतु नीऋ चॆन्तुवर् वायुमै पङ्कन् तिरु आल वायान् तिरुनीऱे वेतत्तिल् उल्लतु
    नीऋ वॆन्तुयर् तीर्प्पतु नीऋ पोतन् तरुवतु नीऋ पुन्मै तविर्प्पतु नीऋ ऒतत् तकुवतु नीऋ उण्मैयिल् उल्लतु
    नीऋ चीतप् पुनल्वयल् चूऴ्न्त तिरु आल वायान् तिरुनीऱे मुक्ति तरुवतु नीऋ मुनिवर् अणिवतु नीऋ चत्तियं आवतु
    नीऋ तक्कोर् पुकऴ्वतु नीऋ पत्ति तरुवतु नीऋ परव इनियतु नीऋ चित्ति तरुवतु नीऋ तिरु आल वायान् तिरुनीऱे
    काण इनियतु नीऋ कविनैत् तरुवतु नीऋ पेणि अणिपवर्क् कॆल्लां पॆरुमै कॊटुप्पतु नीऋ माणन्त् तकैवतु नीऋ मतियैत्
    तरुवतु नीऋ चेणन्त् तरुवतु नीऋ तिरु आल वायान् तिरुनीऱे पूच इनियतु नीऋ पुण्णियं आवतु नीऋ पेच इनियतु
    नीऋ पॆरुन्तवत् तोऱ्कलुक्कॆल्लाम् आचैकॆटुप्पतु नीऋ अन्तम तावतु नीऋ तेचं पुकऴ्वतु नीऋ तिरु आल वायान्
    तिरुनीऱे अरुत्तम तावतु नीऋ अवलं अऋप्पतु नीऋ वरुत्तन्त् तणिप्पतु नीऋ वानं अलिप्पतु नीऋ पॊरुत्तम तावतु
    नीऋ पुण्णियर् पूचुम्वॆण् नीऋ तिरुत्तकु मालिकै चूऴ्न्तच् तिरु आल वायान् तिरुनीऱे ऎयिलतु अट्टतु नीऋ
    इरुमैक्कुं उल्लतु नीऋ पयिलप् पटुवतु नीऋ पाक्किय मावतु नीऋ तुयिलैत् तटुप्पतु नीऋ चुत्तम तावतु नीऋ अयिलैप्
    पॊलि तरु चूलत् ताल वायान् तिरुनीऱे इरावणन् मेलतु नीऋ ऎण्णत् तकुवतु नीऋ परावण मावतु नीऋ पावं अऋप्पतु
    नीऋ तरावण मावतु नीऋ तत्तुवं आवतु नीऋ अरावणङ् कुन्तिरु मेनि आल वायान् तिरुनीऱे मालॊ तयनऱि यात वण्णमुं
    उल्लतु नीऋ मेलुऱै तेवर्कल् तङ्कल् मॆय्यतु वॆण्पॊटि नीऋ एल उटम्पिटर् तीर्क्कुं इन्पन्त् तरुवतु नीऋ
    आलमतु उण्ट मिटर्रॆं मालवायान् तिरुनीऱे कुण्टिकैक् कैयर्कलोटु चाक्कियर् कूट्टमुङ् कूटक् कण्टिकैप् पिप्पतु
    मेलुऱै नीऋ करुत इनियतु नीऋ ऎण्टिचैप् पट्ट पॊरुलार् एत्तुन्त् तकैयतु नीऋ अण्टत्तवर् पणिन्तेत्तुं आल
    वायान् तिरुनीऱे आर्रल् अटल् विटै एऋं आल वायान् तिरुनीर्रैप् पोर्रि पुकलि निलावुं पूचुरन् ञानचम्पन्तन्
    तेर्रित् तॆन्नन् उटलुर्र तीप्पिणि आयिन तीरच् चार्रिय पाटल्कल् पत्तुं वल्लवर् नल्लवर्तामे तिरुच्चिर्रम्पलम्
