id: ashtavakra-gita-chapter-8
category: stotram
name:
  english: Ashtavakra Gita Chapter 8
content:
  english: ashtavakra uvaca || tada bandho yada cittam kincid vanchati shocati | kincin muncati grihnati
    kinciddhrishyati kupyati || || tada muktiryada cittam na vanchati na shocati | na muncati na grihnati
    na hrishyati na kupyati || || tada bandho yada cittam saktam kasvapi drishtishu | tada moksho yada
    cittamasaktam sarvadrishtishu || || yada naham tada moksho yadaham bandhanam tada | matveti helaya
    kincinma grihana vimunca ma ||
  devanagari: अष्टावक्र उवाच ॥ तदा बन्धो यदा चित्तं किञ्चिद् वाञ्छति शोचति । किञ्चिन् मुञ्चति गृह्णाति
    किञ्चिद्धृष्यति कुप्यति ॥ ॥ तदा मुक्तिर्यदा चित्तं न वाञ्छति न शोचति । न मुञ्चति न गृह्णाति न हृष्यति
    न कुप्यति ॥ ॥ तदा बन्धो यदा चित्तं सक्तं कास्वपि दृष्टिषु । तदा मोक्षो यदा चित्तमसक्तं सर्वदृष्टिषु
    ॥ ॥ यदा नाहं तदा मोक्षो यदाहं बन्धनं तदा । मत्वेति हेलया किञ्चिन्मा गृहाण विमुञ्च मा ॥
