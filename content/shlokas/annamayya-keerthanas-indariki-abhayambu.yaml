id: annamayya-keerthanas-indariki-abhayambu
category: stotram
name:
  english: Annamayya Keerthanas Indariki Abhayambu
content:
  english: adivo alladivo shri hari vasamu padivela sheshula padagala mayamu || adè venkatacala makhilonnatamu
    adivo brahmadula kapurupamu | adivo nityanivasa makhila munulaku adè cudu dadè mòkku danandamayamu
    || adivo alladivo shri hari vasamu padivela sheshula padagala mayamu || cèngata nalladivo sheshacalamu
    ningi nunna devatala nijavasamu | mungita nalladivo mulanunna dhanamu bangaru shikharala bahu brahmamayamu
    || adivo alladivo shri hari vasamu padivela sheshula padagala mayamu || kaivalya padamu venkata naga
    madivo shri venkatapatiki sirulainadi | bhavimpa sakala sampada rupamadivo pavanamula kèlla pavana
    mayamu || adivo alladivo shri hari vasamu padivela sheshula padagala mayamu ||
  devanagari: अदिवो अल्लदिवो श्री हरि वासमु पदिवेल शेषुल पडगल मयमु ॥ अदॆ वेङ्कटाचल मखिलोन्नतमु अदिवो ब्रह्मादुल
    कपुरूपमु । अदिवो नित्यनिवास मखिल मुनुलकु अदॆ चूडु डदॆ मॊक्कु डानन्दमयमु ॥ अदिवो अल्लदिवो श्री हरि
    वासमु पदिवेल शेषुल पडगल मयमु ॥ चॆङ्गट नल्लदिवो शेषाचलमू निङ्गि नुन्न देवतल निजवासमु । मुङ्गिट नल्लदिवो
    मूलनुन्न धनमु बङ्गारु शिखराल बहु ब्रह्ममयमु ॥ अदिवो अल्लदिवो श्री हरि वासमु पदिवेल शेषुल पडगल मयमु
    ॥ कैवल्य पदमु वेङ्कट नग मदिवो श्री वेङ्कटपतिकि सिरुलैनदि । भाविम्प सकल सम्पद रूपमदिवो पावनमुल कॆल्ल
    पावन मयमू ॥ अदिवो अल्लदिवो श्री हरि वासमु पदिवेल शेषुल पडगल मयमु ॥
