id: devivaibhavashcaryashtottarashatadivyanamastotram
category: stotram
name:
  english: devivaibhavashcaryashtottarashatadivyanamastotram
  devanagari: देवीवैभवाश्चर्याष्टोत्तरशतदिव्यनामस्तोत्रम्
content:
  english: shadanganyasah || bhurbhuvahsuvaromiti digbandhah || dhyanam || kvanatkancidama karikalabhakumbhastananata
    parikshina madhye parinatasharaccandravadana | dhanurbanan pasham srinimapi dadhana karatalaih purastadastam
    nah puramathiturahopurushika || 1|| sudhasindhormadhye suravitapivatiparivrite manidvipe nipopavanavati
    cintamanigrihe | shivakare mance paramashivaparyankanilayam bhajanti tvam dhanyah katicana cidanandalaharim
    || 2|| || pancapuja || lam prithivyatmikayai gandham samarpayami | ham akashatmikayai pushpaih pujayami
    | yam vayvatmikayai dhupamaghrapayami | ram agnyatmikayai dipam darshayami | vam amritatmikayai amritam
    mahanaivedyam nivedayami | sam sarvatmikayai sarvopacaran samarpayami || om aim hrim shrim paramanandalahari
    paracaitanyadipika | svayamprakashakirana nityavaibhavashalini || 1|| vishuddhakevalakhandasatyakalatmarupini
    | adimadhyantarahita mahamayavilasini || 2|| gunatrayaparicchetri sarvatattvaprakashini | stripumsabhavarasika
    jagatsargadilampata || 3|| asheshanamarupadibhedacchedaraviprabha | anadivasanarupa vasanodyatprapancika
    || 4|| prapancopashamapraudha caracarajaganmayi | samastajagadadhara sarvasanjivanotsuka || 5|| bhaktacetomayanantasvarthavaibhavavibhrama
    | sarvakarshanavashyadisarvakarmadurandhara || 6|| vijnanaparamanandavidya santanasiddhida | ayurarogyasaubhagyabalashrikirtibhagyada
    || 7|| dhanadhanyamanivastrabhushalepanamalyada | grihagramamaharajyasamrajyasukhadayini || 8|| saptangashaktisampurnasarvabhaumaphalaprada
    | brahmavishnushivendradipadavishrananakshama || 9|| bhuktimuktimahabhaktiviraktyadvaitadayini | nigrahanugrahadhyaksha
    jnananirdvaitadayini || 10|| parakayapraveshadiyogasiddhipradayini | shishtasanjivanapraudha dushtasamharasiddhida
    || 11|| lilavinirmitanekakotibrahmandamandala | ekanekatmika nanarupinyardhanganeshvari || 12|| shivashaktimayi
    nityasha
  devanagari: षडङ्गन्यासः ॥ भूर्भुवःसुवरोमिति दिग्बन्धः ॥ ध्यानम् ॥ क्वणत्काञ्चीदामा करिकलभकुम्भस्तननता
    परिक्षीणा मध्ये परिणतशरच्चन्द्रवदना । धनुर्बाणान् पाशं सृणिमपि दधाना करतलैः पुरस्तादास्तां नः पुरमथितुराहोपुरुषिका
    ॥ १॥ सुधासिन्धोर्मध्ये सुरविटपिवाटीपरिवृते मणिद्वीपे नीपोपवनवति चिन्तामणिगृहे । शिवाकारे मञ्चे परमशिवपर्यङ्कनिलयां
    भजन्ति त्वां धन्याः कतिचन चिदानन्दलहरीम् ॥ २॥ ॥ पञ्चपूजा ॥ लं पृथिव्यात्मिकायै गन्धं समर्पयामि । हं
    आकाशात्मिकायै पुष्पैः पूजयामि । यं वाय्वात्मिकायै धूपमाघ्रापयामि । रं अग्न्यात्मिकायै दीपं दर्शयामि
    । वं अमृतात्मिकायै अमृतं महानैवेद्यं निवेदयामि । सं सर्वात्मिकायै सर्वोपचारान् समर्पयामि ॥ ॐ ऐं ह्रीं
    श्रीं परमानन्दलहरी परचैतन्यदीपिका । स्वयंप्रकाशकिरणा नित्यवैभवशालिनी ॥ १॥ विशुद्धकेवलाखण्डसत्यकालात्मरूपिणी
    । आदिमध्यान्तरहिता महामायाविलासिनी ॥ २॥ गुणत्रयपरिच्छेत्री सर्वतत्त्वप्रकाशिनी । स्त्रीपुंसभावरसिका
    जगत्सर्गादिलंपटा ॥ ३॥ अशेषनामरूपादिभेदच्छेदरविप्रभा । अनादिवासनारूपा वासनोद्यत्प्रपञ्चिका ॥ ४॥ प्रपञ्चोपशमप्रौढा
    चराचरजगन्मयी । समस्तजगदाधारा सर्वसञ्जीवनोत्सुका ॥ ५॥ भक्तचेतोमयानन्तस्वार्थवैभवविभ्रमा । सर्वाकर्षणवश्यादिसर्वकर्मदुरन्धरा
    ॥ ६॥ विज्ञानपरमानन्दविद्या सन्तानसिद्धिदा । आयुरारोग्यसौभाग्यबलश्रीकीर्तिभाग्यदा ॥ ७॥ धनधान्यमणीवस्त्रभूषालेपनमाल्यदा
    । गृहग्राममहाराज्यसांराज्यसुखदायिनी ॥ ८॥ सप्ताङ्गशक्तिसम्पूर्णसार्वभौमफलप्रदा । ब्रह्मविष्णुशिवेन्द्रादिपदविश्राणनक्षमा
    ॥ ९॥ भुक्तिमुक्तिमहाभक्तिविरक्त्यद्वैतदायिनी । निग्रहानुग्रहाध्यक्षा ज्ञाननिर्द्वैतदायिनी ॥ १०॥ परकायप्रवेशादियोगसिद्धिप्रदायिनी
    । शिष्टसञ्जीवनप्रौढा दुष्टसंहारसिद्धिदा ॥ ११॥ लीलाविनिर्मितानेककोटिब्रह्माण्डमण्डला । एकानेकात्मिका
    नानारूपिण्यर्धाङ्गनेश्वरी ॥ १२॥ शिवशक्तिमयी नित्यश
