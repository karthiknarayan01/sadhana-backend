id: brahmakritam08vishnustotram
category: stotram
name:
  english: brahmakritam08vishnustotram
  devanagari: ब्रह्मकृतं०८विष्णुस्तोत्रम्
content:
  english: manandamatramavikalpamaviddhavarcah | pashyami vishvasrijamekamavishvamatman bhutendriyatmakamadasta
    upashrito'smi || 3|| tadva idam bhuvanamangala mangalaya dhyane sma no darshitam ta upasakanam | tasmai
    namo bhagavate'nuvidhema tubhyam yo'nadrito narakabhagbhirasatprasangaih || 4|| ye tu tvadiyacaranambujakoshagandham
    jighranti karnavivaraih shrutivatanitam | bhaktya grihitacaranah paraya ca tesham napaishi natha hridayamburuhatsvapumsam
    || 5|| tavadbhayam dravinadehasuhrinnimittam shokah spriha paribhavo vipulashca lobhah | tavanmametyasadavagraha
    artimulam yavanna te'nghrimabhayam pravrinita lokah || 6|| daivena te hatadhiyo bhavatah prasangat
    sarvashubhopashamanadvimukhendriya ye | kurvanti kamasukhaleshalavaya dinah lobhabhibhutamanaso'kushalani
    shashvat || 7|| kshuttrit tridhatubhirima muhurardyamanah shitoshnavatavarashairitaretaracca | kamagninacyuta
    rusha ca sudurbharena sampashyato mana urukrama sidate me || 8|| yavatprithaktvamidamatmana indriyartha
  devanagari: मानन्दमात्रमविकल्पमविद्धवर्चः । पश्यामि विश्वसृजमेकमविश्वमात्मन् भूतेन्द्रियात्मकमदस्त उपाश्रितोऽस्मि
    ॥ ३॥ तद्वा इदं भुवनमङ्गल मङ्गलाय ध्याने स्म नो दर्शितं त उपासकानाम् । तस्मै नमो भगवतेऽनुविधेम तुभ्यं
    योऽनादृतो नरकभाग्भिरसत्प्रसङ्गैः ॥ ४॥ ये तु त्वदीयचरणाम्बुजकोशगन्धं जिघ्रन्ति कर्णविवरैः श्रुतिवातनीतम्
    । भक्त्या गृहीतचरणः परया च तेषां नापैषि नाथ हृदयाम्बुरुहात्स्वपुंसाम् ॥ ५॥ तावद्भयं द्रविणदेहसुहृन्निमित्तं
    शोकः स्पृहा परिभवो विपुलश्च लोभः । तावन्ममेत्यसदवग्रह आर्तिमूलं यावन्न तेऽङ्घ्रिमभयं प्रवृणीत लोकः
    ॥ ६॥ दैवेन ते हतधियो भवतः प्रसङ्गात् सर्वाशुभोपशमनाद्विमुखेन्द्रिया ये । कुर्वन्ति कामसुखलेशलवाय दीनाः
    लोभाभिभूतमनसोऽकुशलानि शश्वत् ॥ ७॥ क्षुत्तृट् त्रिधातुभिरिमा मुहुरर्द्यमानाः शीतोष्णवातवरषैरितरेतराच्च
    । कामाग्निनाच्युत रुषा च सुदुर्भरेण सम्पश्यतो मन उरुक्रम सीदते मे ॥ ८॥ यावत्पृथक्त्वमिदमात्मन इन्द्रियार्थ
meaning: {}
