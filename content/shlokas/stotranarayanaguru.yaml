id: stotranarayanaguru
category: mantra
name:
  english: stotranarayanaguru
  devanagari: स्तोत्रनारायणगुरु
content:
  english: bahuleyashtakam om om om homadhumaprakatatatajatakotibhogiprapuram am am am aditeyapranatapadayugambhoruhashrivilasam
    | um um um ugranetratrayalasitavapurjyotiranandarupam shrim shrim shrim shighracittabhramaharamanisham
    bhavaye bahuleyam || 1|| hrim hrim hrim hrishtashatkandharamaghamaranaranyasamvarttavahnim aim aim
    aim aingudisatphalamridumilitaprashiyogindravandyam | klim klim klim klishtakayaklamadavadahanakleshanirmulanasham
    saum saum saum saurakantibhramaharamanisham bhavaye bahuleyam || 2|| sham sham sham shabdarupam shashidharamamalam
    shankaram sambamurtim shim shim shim shishtavandyam shikharinilayanam shikshitanekalokam | shum shum
    shum shubhrahasam shubhakaramatisandehasandohanasham shaum shaum shaum shauklitangam sitabhasitaganairbhavaye
    bahuleyam || 3|| ram ram ram ramyadeham rajatagirigriham raktapadmanghriyugmam rim rim rim riktashokaprakritiparamajamghalamanilanetram
    | rum rum rum rukshakayapratibhatahananam raktakausheyavastram raum raum raum raum rauravadidrutaharakuharam
    bhavaye bahuleyam || 4|| ham ham ham hamsayogipravarasukhakaram hastalakshmisametam him him him hinamanam
    hitasukhavaradam himsayapetakilam | hum hum hum humkritidhvamsitarajanicarakrauryakautilyamurtim haim
    haim haim haimakumbhayatakarasahajam bhavaye bahuleyam || 5|| nam nam nam nandikeshapravarabhujaganirvighnakarmaprapancam
    nim nim nim nilakanthapriyasutamajitam nirmalangam niriham | num num num nuttanabhottaranibhritaniralambakaivalyamurtim
    naum naum naum namarupatmakajagadakhilam bhavaye bahuleyam || 6|| bham bham bham bhagadheyam bhagavadanucarapranjalistotrapuram
    bhim bhim bhim bhimanadantakamadanaharam bhishitarativargam | bhum bhum bhum bhutibhusharccitamamitasamastarthashastrantarangam
    bhaum bhaum bhaum bhaumamukhyam grahagananapatum bhavaye bahuleyam || 7|| vam vam vam vahinisham valaripunilayastotrasampatsamuham
    vim vim vim virabahuprabhritisahacaram vighnarajanujatam | vum vum vum bhutanatham bhuvananilayanam
    bhurikalyanashilam vaum vaum vaum bhavitaripratibhayamanisham bhavaye bahuleyam || 8|| shivastotram
    8
  devanagari: बाहुलेयाष्टकं ॐ ॐ ॐ होमधूमप्रकटतटजटाकोटिभोगिप्रपूरं आं आं आं आदितेयप्रणतपदयुगांभोरुहश्रीविलासम्
    । ऊं ऊं ऊं उग्रनेत्रत्रयलसितवपुर्ज्योतिरानन्दरूपं श्रीं श्रीं श्रीं शीघ्रचित्तभ्रमहरमनिशं भावये बाहुलेयम्
    ॥ १॥ ह्रीं ह्रीं ह्रीं हृष्टषट्कन्धरमघमरणारण्यसंवर्त्तवह्निं ऐं ऐं ऐं ऐङ्गुदीसत्फलमृदुमिलितप्राशियोगीन्द्रवन्द्यम्
    । क्लीं क्लीं क्लीं क्लिष्टकायक्लमदवदहनक्लेशनिर्मूलनाशं सौं सौं सौं सौरकान्तिभ्रमहरमनिशं भावये बाहुलेयम्
    ॥ २॥ शं शं शं शब्दरूपं शशिधरममलं शङ्करं सांबमूर्तिं शिं शिं शिं शिष्टवन्द्यं शिखरिनिलयनं शिक्षितानेकलोकम्
    । शुं शुं शुं शुभ्रहासं शुभकरमतिसन्देहसन्दोहनाशं शौं शौं शौं शौक्लिताङ्गं सितभसितगणैर्भावये बाहुलेयम्
    ॥ ३॥ रं रं रं रम्यदेहं रजतगिरिगृहं रक्तपद्माङ्घ्रियुग्मं रिं रिं रिं रिक्तशोकप्रकृतिपरमजंघालमानीलनेत्रम्
    । रुं रुं रुं रूक्षकायप्रतिभटहननं रक्तकौशेयवस्त्रं रौं रौं रौं रौं रौरवादिद्रुतहरकुहरं भावये बाहुलेयम्
    ॥ ४॥ हं हं हं हंसयोगिप्रवरसुखकरं हस्तलक्ष्मीसमेतं हिं हिं हिं हीनमानं हितसुखवरदं हिंसयापेतकीलम् ।
    हुं हुं हुं हुंकृतिध्वंसितरजनिचरक्रौर्यकौटिल्यमूर्तिं हैं हैं हैं हैमकुंभायतकरसहजं भावये बाहुलेयम्
    ॥ ५॥ णं णं णं नन्दिकेशप्रवरभुजगनिर्विघ्नकर्मप्रपञ्चं णिं णिं णिं नीलकण्ठप्रियसुतमजितं निर्मलाङ्गं
    निरीहम् । णुं णुं णुं णुत्तनाभोत्तरनिभृतनिरालंबकैवल्यमूर्तिं णौं णौं णौं नामरूपात्मकजगदखिलं भावये
    बाहुलेयम् ॥ ६॥ भं भं भं भागधेयं भगवदनुचरप्राञ्जलिस्तोत्रपूरं भिं भिं भिं भीमनादान्तकमदनहरं भीषितारातिवर्गम्
    । भुं भुं भुं भूतिभूषार्च्चितममितसमस्तार्थशास्त्रान्तरङ्गं भौं भौं भौं भौममुख्यं ग्रहगणनपटुं भावये
    बाहुलेयम् ॥ ७॥ वं वं वं वाहिनीशं वलरिपुनिलयस्तोत्रसम्पत्समूहं विं विं विं वीरबाहुप्रभृतिसहचरं विघ्नराजानुजातम्
    । वुं वुं वुं भूतनाथं भुवननिलयनं भूरिकल्याणशीलं वौं वौं वौं भावितारिप्रतिभयमनिशं भावये बाहुलेयम् ॥
    ८॥ शिवस्तोत्रम् ८
