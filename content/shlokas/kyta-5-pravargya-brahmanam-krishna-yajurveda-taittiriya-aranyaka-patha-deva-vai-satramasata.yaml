    pramayukagg syat | tasmannanvikshyah | apiparo ma 'hno ratriyai ma pahyesha te agne samittaya samiddhyasvayurme
    da varcasa ma 'njirityaha | ayurevasmin varco dadhati | apiparo ma ratriya ahno ma pahyesha te agne
    samittaya samiddhyasvayurme da varcasa ma 'njirityaha | ayurevasmin varco dadhati | agni ssvaha suryo
    jyotirjyoti ssvahetyaha | yathayajurevaitat | brahmavadino vadanti | hotavyamagnihotra dyajusha juhuyat
