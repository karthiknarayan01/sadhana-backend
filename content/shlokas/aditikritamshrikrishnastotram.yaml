id: aditikritamshrikrishnastotram
category: stotram
name:
  english: aditikritamshrikrishnastotram
  devanagari: अदितिकृतंश्रीकृष्णस्तोत्रम्
content:
  english: aditikritam shrikrishnastotram aditiruvaca | namaste pundarikaksha bhaktanamabhayankara | sanatanatmanbhutatmansarvatmanbhutabhavana
    || 6|| pranetarmanaso buddherindriyanam gunatmaka | sitadirghadinihsheshakalpanaparivarjita || 7||
    janmadibhirasamsprishta svapnadiparivarjita | sandhyaratriraharbhumirgaganam vayurambu ca || 8|| hutashano
    mano buddhirbhutadistvam tatha'cyuta | srishtisthitivinashanam karta kartripatirbhavan || 9|| brahmavishnushivakhyabhiratmamurtibhirishvarah
    | mayabhiretadvyaptam te jagatsthavarajangamam || 10|| anatmanyatmavijnanam sa te maya janardana |
    aham mameti bhavo'tra yaya samupajayate || 11|| samsaramadhye mayayastavaitannatha ceshtitam | yaih
    svadharmaparairnatha narairaradhito bhavan || 12|| te tarantyakhilametam mayamatmavimuktaye | brahmadyah
    sakala deva mushyah pashavastatha || 13|| vishnumayamahavarte mohandhatamasa''vritah | aradhya tvamabhipsante
    kamanatmabhavakshaye || 14|| pade te purusha baddha mayaya bhagavamstava | maya tvam putrakaminya
    vairipakshakshayaya ca || 15|| aradhito na mokshaya mayavilasitam hi tat | kaupinacchadanapraya vancha
    kalpadrumadapi || 16|| jayate yadapunyanam so'paradhah svadoshajah | tatprasidakhilajaganmayamohakaravyaya
    || 17|| ajnatam jnanasadbhava bhutabhutesha nashaya | namaste cakrahastaya sharngahastaya te namah
    || 18|| gadahastaya te vishno shankhahastaya te namah | etatpashyami te rupam sthulacihnopashobhitam
    | na janami param yatte prasida parameshvara || 19|| iti brahmapurane tryadhikadvishatatamadhyayantargatam
    aditikritam shrikrishnastotram samaptam | brahmapurana | adhyaya 203
  devanagari: अदितिकृतं श्रीकृष्णस्तोत्रम् अदितिरुवाच । नमस्ते पुण्डरीकाक्ष भक्तानामभयङ्कर । सनातनात्मन्भूतात्मन्सर्वात्मन्भूतभावन
    ॥ ६॥ प्रणेतर्मनसो बुद्धेरिन्द्रियाणां गुणात्मक । सितदीर्घादिनिःशेषकल्पनापरिवर्जित ॥ ७॥ जन्मादिभिरसंस्पृष्ट
    स्वप्नादिपरिवर्जित । सन्ध्यारात्रिरहर्भूमिर्गगनं वायुरम्बु च ॥ ८॥ हुताशनो मनो बुद्धिर्भूतादिस्त्वं
    तथाऽच्युत । सृष्टिस्थितिविनाशानां कर्ता कर्तृपतिर्भवान् ॥ ९॥ ब्रह्मविष्णुशिवाख्याभिरात्ममूर्तिभिरीश्वरः
    । मायाभिरेतद्व्याप्तं ते जगत्स्थावरजङ्गमम् ॥ १०॥ अनात्मन्यात्मविज्ञानं सा ते माया जनार्दन । अहं ममेति
    भावोऽत्र यया समुपजायते ॥ ११॥ संसारमध्ये मायायास्तवैतन्नाथ चेष्टितम् । यैः स्वधर्मपरैर्नाथ नरैराराधितो
    भवान् ॥ १२॥ ते तरन्त्यखिलामेतां मायामात्मविमुक्तये । ब्रह्माद्याः सकला देवा मुष्याः पशवस्तथा ॥ १३॥
    विष्णुमायामहावर्ते मोहान्धतमसाऽऽवृताः । आराध्य त्वामभीप्सन्ते कामानात्मभवक्षये ॥ १४॥ पदे ते पुरुषा
    बद्धा मायया भगवंस्तव । मया त्वं पुत्रकामिन्या वैरिपक्षक्षयाय च ॥ १५॥ आराधितो न मोक्षाय मायाविलसितं
    हि तत् । कौपीनाच्छादनप्राया वाञ्छा कल्पद्रुमादपि ॥ १६॥ जायते यदपुण्यानां सोऽपराधः स्वदोषजः । तत्प्रसीदाखिलजगन्मायामोहकराव्यय
    ॥ १७॥ अज्ञातं ज्ञानसद्भाव भूतभूतेश नाशय । नमस्ते चक्रहस्ताय शार्ङ्गहस्ताय ते नमः ॥ १८॥ गदाहस्ताय ते
    विष्णो शङ्खहस्ताय ते नमः । एतत्पश्यामि ते रूपं स्थूलचिह्नोपशोभितम् । न जानामि परं यत्ते प्रसीद परमेश्वर
    ॥ १९॥ इति ब्रह्मपुराणे त्र्यधिकद्विशततमाध्यायान्तर्गतं अदितिकृतं श्रीकृष्णस्तोत्रं समाप्तम् । ब्रह्मपुराण
    । अध्याय २०३
