id: suraganaihkritamdevistotram
category: stotram
name:
  english: suraganaihkritamdevistotram
  devanagari: सुरगणैःकृतंदेवीस्तोत्रम्
content:
  english: suraganaih kritam devistotram tatah suraganah sarve sadaityoragarakshasah | ucuh pranjalayo
    bhutva mattamatangagaminim || 92|| suragana ucuh | ahobalam viryaparakramaste tvaho vapuryogabalam
    tavesha || 93|| aho prabhutvam tava devadeva mahadbhutam manmathadehanashana | tvameva vishnushcaturananastvam
    tvameva mrityurvaradastvameva || 94|| tvameva suryo rajanikarashca vyaktistvamevasya caracarasya |
    tvameva vahnih pavanastvameva tvameva bhumih salilam tvameva || 95|| tvameva sarvasya caracarasya
    dhata vidhata pralayastvameva | ityeva muktva vacanam surendrah pragrihya somam pranipatya murdhna
    | gata vimanairanilopavegairmahanagam merumupetya sarve || 96|| iti brahmandapurane purvabhage pancavimshadhyayantargatam
    suraganaih kritam shivastotram samaptam | brahmandapurana | anushanga | adhyaya 25
  devanagari: सुरगणैः कृतं देवीस्तोत्रम् ततः सुरगणाः सर्वे सदैत्योरगराक्षसाः । ऊचुः प्राञ्जलयो भूत्वा
    मत्तमातङ्गगामिनीम् ॥ ९२॥ सुरगणा ऊचुः । अहोबलं वीर्यपराक्रमस्ते त्वहो वपुर्योगबलं तवेश ॥ ९३॥ अहो प्रभुत्वं
    तव देवदेव महाद्भुतं मन्मथदेहनाशन । त्वमेव विष्णुश्चतुराननस्त्वं त्वमेव मृत्युर्वरदस्त्वमेव ॥ ९४॥ त्वमेव
    सूर्यो रजनीकरश्च व्यक्तिस्त्वमेवास्य चराचरस्य । त्वमेव वह्निः पवनस्त्वमेव त्वमेव भूमिः सलिलं त्वमेव
    ॥ ९५॥ त्वमेव सर्वस्य चराचरस्य धाता विधाता प्रलयस्त्वमेव । इत्येव मुक्त्वा वचनं सुरेन्द्राः प्रगृह्य
    सोमं प्रणिपत्य मूर्ध्ना । गता विमानैरनिलोपवेगैर्महानगं मेरुमुपेत्य सर्वे ॥ ९६॥ इति ब्रह्माण्डपुराणे
    पूर्वभागे पञ्चविंशाध्यायान्तर्गतं सुरगणैः कृतं शिवस्तोत्रं समाप्तम् । ब्रह्माण्डपुराण । अनुषङ्ग ।
    अध्याय २५
