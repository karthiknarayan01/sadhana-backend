id: narasimha-chalisa
category: stotram
name:
  english: Narasimha Chalisa
content:
  english: masa vaishakha kritika yuta harana mahi ko bhara | shukla caturdashi soma dina liyo narasimha
    avatara || dhanya tumharo simha tanu dhanya tumharo nama | tumare sumarana se prabhu purana ho saba
    kama || narasimha deva mem sumarom tohi dhana bala vidya dana de mohi || || jaya jaya narasimha kripala
    karo sada bhaktana pratipala || || vishnu ke avatara dayala mahakala kalana ko kala || || nama aneka
    tumharo bakhano alpa buddhi mem na kachu janom || || hiranakusha nripa ati abhimani tehi ke bhara
    mahi akulani || || hiranakusha kayadhu ke jaye nama bhakta prahalada kahaye || || bhakta bana bishnu
    ko dasa pita kiyo marana parasaya || shastra mare bhuja danda agnidaha kiyo pracanda || || bhakta
    hetu tuma liyo avatara dushta || tuma bhaktana ke bhakta tumhare prahlada ke prana piyare || || pragata
    bhaye pharakara tuma khambha dekha dushta || khadga jihva tanu sundara saja urdhva kesha mahadashtra
    viraja || || tapta svarna sama badana tumhara ko varane tumharom vistara || || rupa caturbhuja badana
    vishala nakha jihva hai ati vikarala || || svarna mukuta badana ati bhari kanana kundala ki chavi
    nyari || || bhakta prahalada ko tumane ubara hirana kusha khala kshana maha mara || bishnu tumhe nita
    dhyave indra mahesha sada mana lave || || veda purana tumharo yasha gave shesha sharada parana pave
    || || jo nara dharo tumharo dhyana tako hoya sada kalyana || trahi prabhu duhkha nivaro bhava bandhana
    prabhu apa hi taro || || nitya jape jo nama tihara duhkha vyadhi ho nistara || hina jo japa karaye
    mana icchita so nara suta pave || || bandhya nari susantana ko pave nara daridra dhani hoi jave ||
    || jo narasimha ka japa karave tahi vipatti sapanem nahi ave || || jo kamana kare mana mahi saba nishcaya
    so siddha hui jahi || || jivana maim jo kachu sankata hoi nishcaya narasimha sumare soi || || roga
    grasita jo dhyave koi taki kaya kancana hoi || shakini preta betala graha vyadhi aru yama vikarala
    || || preta pishaca sabe bhaya khae yama ke duta nikata nahim ave || || sumara nama vyadhi saba bhage
    roga shoka kabahum nahi lage || || jako najara dosha ho bhai so narasimha calisa gai || || hate najara
    hove kalyana bacana satya sakhi bhagavana || || jo nara dhyana tumharo lave so nara mana vanchita
    phala pave || || banavae jo mandira jnani ho jave vaha nara jaga mani || prati patha kare ika bara
    so nara rahe tumhara pyara || || narasimha calisa jo jana gave duhkha daridra take nikata na ave ||
    parhaave so nara jaga mem saba kucha pave || || yaha shri narasimha calisa parhae ranka hove avanisa
    || || jo dhyave so nara sukha pave tohi vimukha bahu duhkha uthave || || shiva svarupa hai sharana
    tumhari haro natha saba vipatti hamari || || carom yuga gayem teri mahima aparampara | nija bhaktanu
    ke prana hita liyo jagata avatara || narasimha calisa jo parhae prema magana shata bara | usa ghara
    ananda rahe vaibhava barhae apara || || iti shri narasimha calisa sampurnama ||
  devanagari: मास वैशाख कृतिका युत हरण मही को भार । शुक्ल चतुर्दशी सोम दिन लियो नरसिंह अवतार ॥ धन्य तुम्हारो
    सिंह तनु धन्य तुम्हारो नाम । तुमरे सुमरन से प्रभु पूरन हो सब काम ॥ नरसिंह देव में सुमरों तोहि धन बल
    विद्या दान दे मोहि ॥ ॥ जय जय नरसिंह कृपाला करो सदा भक्तन प्रतिपाला ॥ ॥ विष्णु के अवतार दयाला महाकाल
    कालन को काला ॥ ॥ नाम अनेक तुम्हारो बखानो अल्प बुद्धि में ना कछु जानोम् ॥ ॥ हिरणाकुश नृप अति अभिमानी
    तेहि के भार मही अकुलानी ॥ ॥ हिरणाकुश कयाधू के जाये नाम भक्त प्रहलाद कहाये ॥ ॥ भक्त बना बिष्णु को दासा
    पिता कियो मारन परसाया ॥ शस्त्र मारे भुज दण्डा अग्निदाह कियो प्रचण्डा ॥ ॥ भक्त हेतु तुम लियो अवतारा
    दुष्ट ॥ तुम भक्तन के भक्त तुम्हारे प्रह्लाद के प्राण पियारे ॥ ॥ प्रगट भये फाड़कर तुम खम्भा देख दुष्ट
    ॥ खड्ग जिह्व तनु सुन्दर साजा ऊर्ध्व केश महादष्ट्र विराजा ॥ ॥ तप्त स्वर्ण सम बदन तुम्हारा को वरने तुम्हरों
    विस्तारा ॥ ॥ रूप चतुर्भुज बदन विशाला नख जिह्वा है अति विकराला ॥ ॥ स्वर्ण मुकुट बदन अति भारी कानन कुण्डल
    की छवि न्यारी ॥ ॥ भक्त प्रहलाद को तुमने उबारा हिरणा कुश खल क्षण मह मारा ॥ बिष्णु तुम्हे नित ध्यावे
    इन्द्र महेश सदा मन लावे ॥ ॥ वेद पुराण तुम्हरो यश गावे शेष शारदा पारन पावे ॥ ॥ जो नर धरो तुम्हरो ध्याना
    ताको होय सदा कल्याना ॥ त्राहि प्रभु दुःख निवारो भव बन्धन प्रभु आप ही टारो ॥ ॥ नित्य जपे जो नाम तिहारा
    दुःख व्याधि हो निस्तारा ॥ हीन जो जाप कराये मन इच्छित सो नर सुत पावे ॥ ॥ बन्ध्या नारी सुसन्तान को पावे
    नर दरिद्र धनी होई जावे ॥ ॥ जो नरसिंह का जाप करावे ताहि विपत्ति सपनें नही आवे ॥ ॥ जो कामना करे मन माही
    सब निश्चय सो सिद्ध हुई जाही ॥ ॥ जीवन मैं जो कछु सङ्कट होई निश्चय नरसिंह सुमरे सोई ॥ ॥ रोग ग्रसित जो
    ध्यावे कोई ताकि काया कञ्चन होई ॥ शाकिनी प्रेत बेताला ग्रह व्याधि अरु यम विकराला ॥ ॥ प्रेत पिशाच सबे
    भय खाए यम के दूत निकट नहीं आवे ॥ ॥ सुमर नाम व्याधि सब भागे रोग शोक कबहूं नही लागे ॥ ॥ जाको नजर दोष
    हो भाई सो नरसिंह चालीसा गाई ॥ ॥ हटे नजर होवे कल्याना बचन सत्य साखी भगवाना ॥ ॥ जो नर ध्यान तुम्हारो
    लावे सो नर मन वाञ्छित फल पावे ॥ ॥ बनवाए जो मन्दिर ज्ञानी हो जावे वह नर जग मानी ॥ प्रति पाठ करे इक
    बारा सो नर रहे तुम्हारा प्यारा ॥ ॥ नरसिंह चालीसा जो जन गावे दुःख दरिद्र ताके निकट न आवे ॥ पढ़आवे सो
    नर जग में सब कुछ पावे ॥ ॥ यह श्री नरसिंह चालीसा पढ़ए रङ्क होवे अवनीसा ॥ ॥ जो ध्यावे सो नर सुख पावे
    तोही विमुख बहु दुःख उठावे ॥ ॥ शिव स्वरूप है शरण तुम्हारी हरो नाथ सब विपत्ति हमारी ॥ ॥ चारों युग गायें
    तेरी महिमा अपरम्पार । निज भक्तनु के प्राण हित लियो जगत अवतार ॥ नरसिंह चालीसा जो पढ़ए प्रेम मगन शत
    बार । उस घर आनन्द रहे वैभव बढ़ए अपार ॥ ॥ इति श्री नरसिंह चालीसा सम्पूर्णम ॥
