id: tarasahasranamastotrambrihannila
category: stotram
name:
  english: tarasahasranamastotrambrihannila
  devanagari: तारासहस्रनामस्तोत्रम्बृहन्नील
content:
  english: 204|| pathaniyam sada devi sarvavasthasu sarvada | yah stotram kulanayike pratidinam bhaktya
    pathed manavah sa syadvittacayairdhaneshvarasamo vidyamadairvakpatih | saundaryena ca murtiman manasijah
    kirtya ca narayanah shaktya shankara eva saukhyavibhavairbhumeh patirnanyatha || 18
  devanagari: २०४॥ पठनीयं सदा देवि सर्वावस्थासु सर्वदा । यः स्तोत्रं कुलनायिके प्रतिदिनं भक्त्या पठेद्
    मानवः स स्याद्वित्तचयैर्धनेश्वरसमो विद्यामदैर्वाक्पतिः । सौन्दर्येण च मूर्तिमान् मनसिजः कीर्त्या च
    नारायणः शक्त्या शङ्कर एव सौख्यविभवैर्भूमेः पतिर्नान्यथा ॥ १८
meaning: {}
