id: caitramasakriteshivashatashtanamastotrammasa-1
category: stotram
name:
  english: caitramasakriteshivashatashtanamastotrammasa 1
  devanagari: चैत्रमासकृतेशिवशताष्टनामस्तोत्रम्मास १
content:
  english: jine shuline namah | hrasvayordhvaya dhumraya dandine rukmatejase || 31|| namo jyeshthaya shreshthaya
    balapramathanaya ca | namo vanyaya pujyaya sadyojataya vai namah || 32|| gahvarayadhvareshaya havyavahaya
    carine | bhutanamudbhavayatha prabhave vibhave namah || 33|| devaya dyotamanaya manatitaya shambhave
    | vedangaya pradhanaya yogasankhyaviharine || 34|| dhruvadhruvaya shantaya vishvaya sumaharshaye |
    grahaya grahyarupaya grihasthaya yatatmane || 35|| ahoratraya masaya ritave kratave namah | samvatsaraya
    pataye yugakalatmane namah || 36|| parardhaya prasannaya shushkaya haritaya ca | dharmadharmasvarupaya
    paraya vibhave namah || 37|| purantakaya bhimaya vargaya dhritaye namah | manvantaraya kavyaya vishvapyayavidhayine
    || 38|| vishvasargaya bhargaya jyotishe divyacakshushe | kalpadyaya nibaddhaya shuddhabuddhaya ramhase
    || 39|| brahmane brahmabhutaya brahmadhipataye namah | vidyeshayadi
  devanagari: जिने शूलिने नमः । ह्रस्वायोर्ध्वाय धूम्राय दण्डिने रुक्मतेजसे ॥ ३१॥ नमो ज्येष्ठाय श्रेष्ठाय
    बलप्रमथनाय च । नमो वन्याय पूज्याय सद्योजाताय वै नमः ॥ ३२॥ गह्वरायाध्वरेशाय हव्यवाहाय चारिणे । भूतानामुद्भवायाथ
    प्रभवे विभवे नमः ॥ ३३॥ देवाय द्योतमानाय मानातीताय शम्भवे । वेदाङ्गाय प्रधानाय योगसाङ्ख्यविहारिणे ॥
    ३४॥ ध्रुवाध्रुवाय शान्ताय विश्वाय सुमहर्षये । ग्रहाय ग्राह्यरूपाय गृहस्थाय यतात्मने ॥ ३५॥ अहोरात्राय
    मासाय ऋतवे क्रतवे नमः । संवत्सराय पतये युगकालात्मने नमः ॥ ३६॥ परार्धाय प्रसन्नाय शुष्काय हरिताय च
    । धर्माधर्मस्वरूपाय पराय विभवे नमः ॥ ३७॥ पुरान्तकाय भीमाय वर्गाय धृतये नमः । मन्वन्तराय काव्याय विश्वाप्यायविधायिने
    ॥ ३८॥ विश्वसर्गाय भर्गाय ज्योतिषे दिव्यचक्षुषे । कल्पाद्याय निबद्धाय शुद्धबुद्धाय रंहसे ॥ ३९॥ ब्रह्मणे
    ब्रह्मभूताय ब्रह्माधिपतये नमः । विद्येशायादि
meaning: {}
