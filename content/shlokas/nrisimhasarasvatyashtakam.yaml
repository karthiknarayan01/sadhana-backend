id: nrisimhasarasvatyashtakam
category: stotram
name:
  english: nrisimhasarasvatyashtakam
  devanagari: नृसिंहसरस्वत्यष्टकम्
content:
  english: indukotiteja karunasimdhu bhaktavatsalama namdanatrisunudattamindirakshashrigurum gamdhamalyakshatadivrimdadevavamditama
    vamdayami narasimha sarasvatisha pahi mam
  devanagari: इन्दुकोटीतेज करूणासिंधु भक्तवत्सलम नंदनात्रिसुनूदत्तमिन्दिराक्षश्रीगुरूम् गंधमाल्याक्षतादिवृंददेववंदितम
    वंदयामि नारसिंह सरस्वतीश पाहि माम्
meaning: {}
