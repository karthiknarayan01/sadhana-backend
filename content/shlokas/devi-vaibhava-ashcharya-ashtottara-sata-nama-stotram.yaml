id: devi-vaibhava-ashcharya-ashtottara-sata-nama-stotram
category: stotram
name:
  english: Devi Vaibhava Ashcharya Ashtottara Sata Nama Stotram
content:
  english: asya shri devivaibhavashcaryashtottarashatadivyanama stotramahamantrasya anandabhairava rishih
    shri anandabhairavi shrimahatripurasundari devata mama shrianandabhairavi shrimahatripurasundari prasadasiddhyarthe
    jape viniyogah | dhyanam kunkumapankasamabha mankushapashekshukodandasharam | pankajamadhyanishannam
    pankeruhalocanam param vande || pancapuja lam prithivyatmikayai gandham samarpayami | ham akashatmikayai
    pushpaih pujayami | yam vayvatmikayai dhupamaghrapayami | ram agnyatmikayai dipam darshayami | vam
    amritatmikayai amritam mahanaivedyam nivedayami | sam sarvatmikayai sarvopacaran samarpayami || om
    aim hrim shrim | paramanandalahari paracaitanyadipika | svayamprakashakirana nityavaibhavashalini
    || || vishuddhakevalakhandasatyakalatmarupini | adimadhyantarahita mahamayavilasini || || gunatrayaparicchetri
    sarvatattvaprakashini | stripumsabhavarasika jagatsargadilampata || || asheshanamarupadibhedacchedaraviprabha
    | anadivasanarupa vasanodyatprapancika || || prapancopashamapraudha caracarajaganmayi | samastajagadadhara
    sarvasanjivanotsuka || || bhaktacetomayanantasvarthavaibhavavibhrama | sarvakarshanavashyadisarvakarmadhurandhara
    || || vijnanaparamanandavidya santanasiddhida | ayurarogyasaubhagyabalashrikirtibhagyada || || dhanadhanyamanivastrabhushalepanamalyada
    | grihagramamaharajyasamrajyasukhadayini || || saptangashaktisampurnasarvabhaumaphalaprada | brahmavishnushivendradipadavishrananakshama
    || || bhuktimuktimahabhaktiviraktyadvaitadayini | nigrahanugrahadhyaksha jnananirdvaitadayini || ||
    parakayapraveshadiyogasiddhipradayini | shishtasanjivanapraudha dushtasamharasiddhida || || lilavinirmitanekakotibrahmandamandala
    | ekanekatmika nanarupinyardhanganeshvari || || shivashaktimayi nityashringaraikarasapriya | tushta
    pushta'paricchinna nityayauvanamohini || || samastadevatarupa sarvadevadhidevata | devarshipitrisiddhadiyoginibhairavatmika
    || || nidhisiddhimanimudra shastrastrayudhabhasura | chatracamaravaditrapatakavyajanancita || || hastyashvarathapadatamatyasenasusevita
    | purohitakulacaryagurushishyadisevita || || sudhasamudramadhyodyatsuradrumanivasini | manidvipantaraprodyatkadambavanavasini
    || || cintamanigrihantahstha manimantapamadhyaga | ratnasimhasanaprodyacchivamancadhishayini || ||
    sadashivamahalingamulasanghattayonika | anyonyalingasangharshakandusankshubdhamanasa || || kalodyadbindukalinyaturyanadaparampara
    | nadantanandasandohasvayamvyaktavaco'mrita || || kamarajamahatantrarahasyacaradakshina | makarapancakodbhutapraudhantollasasundari
    || || shricakrarajanilaya shrividyamantravigraha | akhandasaccidanandashivashaktyaikyarupini || ||
    tripura tripureshani mahatripurasundari | tripuravasarasika tripurashrisvarupini || || mahapadmavanantastha
    shrimattripuramalini | mahatripurasiddhamba shrimahatripurambika || || navacakrakramadevi mahatripurabhairavi
    | shrimata lalita bala rajarajeshvari shiva || || utpattisthitisamharakramacakranivasini | ardhamervatmacakrastha
    sarvalokamaheshvari || || valmikapuramadhyastha jambuvananivasini | arunacalashringastha vyaghralayanivasini
    || || shrikalahastinilaya kashipuranivasini | shrimatkailasanilaya dvadashantamaheshvari || || shrishodashantamadhyastha
    sarvavedantalakshita | shrutismritipuranetihasagamakaleshvari || || bhutabhautikatanmatradevatapranahrinmayi
    | jiveshvarabrahmarupa shrigunadhya gunatmika || || avasthatrayanirmukta vagramomamahimayi | gayatribhuvaneshanidurgakalyadirupini
    || || matsyakurmavarahadinanarupavilasini | mahayogishvararadhya mahaviravaraprada || || siddheshvarakularadhya
    shrimaccaranavaibhava || || punardhyanam kunkumapankasamabha mankushapashekshukodandasharam | pankajamadhyanishannam
    pankeruhalocanam param vande || iti shrigarbhakularnavatantre devi vaibhavashcaryashtottarashatanama
    stotram |
  devanagari: अस्य श्री देवीवैभवाश्चर्याष्टोत्तरशतदिव्यनाम स्तोत्रमहामन्त्रस्य आनन्दभैरव ऋषिः श्री आनन्दभैरवी
    श्रीमहात्रिपुरसुन्दरी देवता मम श्रीआनन्दभैरवी श्रीमहात्रिपुरसुन्दरी प्रसादसिद्ध्यर्थे जपे विनियोगः
    । ध्यानम् कुङ्कुमपङ्कसमाभा मङ्कुशपाशेक्षुकोदण्डशराम् । पङ्कजमध्यनिषण्णां पङ्केरुहलोचनां परां वन्दे
    ॥ पञ्चपूजा लं पृथिव्यात्मिकायै गन्धं समर्पयामि । हं आकाशात्मिकायै पुष्पैः पूजयामि । यं वाय्वात्मिकायै
    धूपमाघ्रापयामि । रं अग्न्यात्मिकायै दीपं दर्शयामि । वं अमृतात्मिकायै अमृतं महानैवेद्यं निवेदयामि ।
    सं सर्वात्मिकायै सर्वोपचारान् समर्पयामि ॥ ॐ ऐं ह्रीं श्रीम् । परमानन्दलहरी परचैतन्यदीपिका । स्वयम्प्रकाशकिरणा
    नित्यवैभवशालिनी ॥ ॥ विशुद्धकेवलाखण्डसत्यकालात्मरूपिणी । आदिमध्यान्तरहिता महामायाविलासिनी ॥ ॥ गुणत्रयपरिच्छेत्री
    सर्वतत्त्वप्रकाशिनी । स्त्रीपुंसभावरसिका जगत्सर्गादिलम्पटा ॥ ॥ अशेषनामरूपादिभेदच्छेदरविप्रभा । अनादिवासनारूपा
    वासनोद्यत्प्रपञ्चिका ॥ ॥ प्रपञ्चोपशमप्रौढा चराचरजगन्मयी । समस्तजगदाधारा सर्वसञ्जीवनोत्सुका ॥ ॥ भक्तचेतोमयानन्तस्वार्थवैभवविभ्रमा
    । सर्वाकर्षणवश्यादिसर्वकर्मधुरन्धरा ॥ ॥ विज्ञानपरमानन्दविद्या सन्तानसिद्धिदा । आयुरारोग्यसौभाग्यबलश्रीकीर्तिभाग्यदा
    ॥ ॥ धनधान्यमणीवस्त्रभूषालेपनमाल्यदा । गृहग्राममहाराज्यसाम्राज्यसुखदायिनी ॥ ॥ सप्ताङ्गशक्तिसम्पूर्णसार्वभौमफलप्रदा
    । ब्रह्मविष्णुशिवेन्द्रादिपदविश्राणनक्षमा ॥ ॥ भुक्तिमुक्तिमहाभक्तिविरक्त्यद्वैतदायिनी । निग्रहानुग्रहाध्यक्षा
    ज्ञाननिर्द्वैतदायिनी ॥ ॥ परकायप्रवेशादियोगसिद्धिप्रदायिनी । शिष्टसञ्जीवनप्रौढा दुष्टसंहारसिद्धिदा
    ॥ ॥ लीलाविनिर्मितानेककोटिब्रह्माण्डमण्डला । एकानेकात्मिका नानारूपिण्यर्धाङ्गनेश्वरी ॥ ॥ शिवशक्तिमयी
    नित्यशृङ्गारैकरसप्रिया । तुष्टा पुष्टाऽपरिच्छिन्ना नित्ययौवनमोहिनी ॥ ॥ समस्तदेवतारूपा सर्वदेवाधिदेवता
    । देवर्षिपितृसिद्धादियोगिनीभैरवात्मिका ॥ ॥ निधिसिद्धिमणीमुद्रा शस्त्रास्त्रायुधभासुरा । छत्रचामरवादित्रपताकाव्यजनाञ्चिता
    ॥ ॥ हस्त्यश्वरथपादातामात्यसेनासुसेविता । पुरोहितकुलाचार्यगुरुशिष्यादिसेविता ॥ ॥ सुधासमुद्रमध्योद्यत्सुरद्रुमनिवासिनी
    । मणिद्वीपान्तरप्रोद्यत्कदम्बवनवासिनी ॥ ॥ चिन्तामणिगृहान्तःस्था मणिमण्टपमध्यगा । रत्नसिंहासनप्रोद्यच्छिवमञ्चाधिशायिनी
    ॥ ॥ सदाशिवमहालिङ्गमूलसङ्घट्टयोनिका । अन्योन्यालिङ्गसङ्घर्षकण्डूसङ्क्षुब्धमानसा ॥ ॥ कलोद्यद्बिन्दुकालिन्यातुर्यनादपरम्परा
    । नादान्तानन्दसन्दोहस्वयंव्यक्तवचोऽमृता ॥ ॥ कामराजमहातन्त्ररहस्याचारदक्षिणा । मकारपञ्चकोद्भूतप्रौढान्तोल्लाससुन्दरी
    ॥ ॥ श्रीचक्रराजनिलया श्रीविद्यामन्त्रविग्रहा । अखण्डसच्चिदानन्दशिवशक्त्यैक्यरूपिणी ॥ ॥ त्रिपुरा त्रिपुरेशानी
    महात्रिपुरसुन्दरी । त्रिपुरावासरसिका त्रिपुराश्रीस्वरूपिणी ॥ ॥ महापद्मवनान्तस्था श्रीमत्त्रिपुरमालिनी
    । महात्रिपुरसिद्धाम्बा श्रीमहात्रिपुराम्बिका ॥ ॥ नवचक्रक्रमादेवी महात्रिपुरभैरवी । श्रीमाता ललिता
    बाला राजराजेश्वरी शिवा ॥ ॥ उत्पत्तिस्थितिसंहारक्रमचक्रनिवासिनी । अर्धमेर्वात्मचक्रस्था सर्वलोकमहेश्वरी
    ॥ ॥ वल्मीकपुरमध्यस्था जम्बूवननिवासिनी । अरुणाचलशृङ्गस्था व्याघ्रालयनिवासिनी ॥ ॥ श्रीकालहस्तिनिलया
    काशीपुरनिवासिनी । श्रीमत्कैलासनिलया द्वादशान्तमहेश्वरी ॥ ॥ श्रीषोडशान्तमध्यस्था सर्ववेदान्तलक्षिता
    । श्रुतिस्मृतिपुराणेतिहासागमकलेश्वरी ॥ ॥ भूतभौतिकतन्मात्रदेवताप्राणहृन्मयी । जीवेश्वरब्रह्मरूपा श्रीगुणाढ्या
    गुणात्मिका ॥ ॥ अवस्थात्रयनिर्मुक्ता वाग्रमोमामहीमयी । गायत्रीभुवनेशानीदुर्गाकाल्यादिरूपिणी ॥ ॥ मत्स्यकूर्मवराहादिनानारूपविलासिनी
    । महायोगीश्वराराध्या महावीरवरप्रदा ॥ ॥ सिद्धेश्वरकुलाराध्या श्रीमच्चरणवैभवा ॥ ॥ पुनर्ध्यानम् कुङ्कुमपङ्कसमाभा
    मङ्कुशपाशेक्षुकोदण्डशराम् । पङ्कजमध्यनिषण्णां पङ्केरुहलोचनां परां वन्दे ॥ इति श्रीगर्भकुलार्णवतन्त्रे
    देवी वैभवाश्चर्याष्टोत्तरशतनाम स्तोत्रम् ।
