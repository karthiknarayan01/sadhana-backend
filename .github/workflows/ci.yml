name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # Docker is preinstalled on GitHub-hosted ubuntu-latest runners, so
      # testcontainers can spin up its own ephemeral Elasticsearch directly —
      # no docker-compose/services block needed here.
      - run: uv run pytest

  # Builds+pushes the image, applies infra/terraform (VPC, firewall, LB, IAM
  # — everything except search-api's actual running code), then deploys that
  # image to the backend VM over SSH (search-api runs alongside Elasticsearch
  # on one VM — see infra/terraform/elasticsearch.tf — instead of on Cloud
  # Run, so there's no platform to redeploy it for us on a new image tag).
  # Only ever runs on dev; main never redeploys (single-environment setup,
  # dev is what's live). See infra/terraform/README.md for the one-time
  # bootstrap this depends on — already done for the sadhana-backend-305666
  # project.
  deploy:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_zone: ${{ vars.GCP_ZONE }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: sadhana-backend-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # GitHub-hosted runners are linux/amd64 natively, so this needs no
      # --platform flag (unlike a local build on Apple Silicon) — Cloud Run
      # only accepts linux/amd64 images.
      - name: Build and push image
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          IMAGE=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/sadhana-backend-images/search-api:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate" \
            -backend-config="prefix=backend"

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve

      # Runs after `terraform apply` so a brand-new VM already has the
      # firewall/IAM/OS-Login grants this needs to SSH in at all. Scp's the
      # script fresh every time rather than relying on a copy already on the
      # VM, so a change to the script here takes effect on its very next
      # deploy instead of waiting for some future VM recreation.
      - name: Deploy search-api to the VM
        run: |
          gcloud compute scp infra/terraform/scripts/redeploy-api.sh \
            sadhana-elasticsearch:/tmp/redeploy-api.sh \
            --zone="${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet
          gcloud compute ssh sadhana-elasticsearch \
            --zone="${{ vars.GCP_ZONE }}" --tunnel-through-iap --quiet \
            --command="sudo bash /tmp/redeploy-api.sh ${{ github.sha }}"
