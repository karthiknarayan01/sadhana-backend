id: shatrusamharakamekadantastotram
category: stotram
name:
  english: shatrusamharakamekadantastotram
  devanagari: शत्रुसंहारकमेकदन्तस्तोत्रम्
content:
  english: rinudhvam surasattamah | yuyam tam tadrisham dhyatva toshayadhvam vidhanatah || 7|| ekadantam
    caturbahum gajavaktram mahodaram | siddhibuddhisamayuktam mushakarudhameva ca || 8|| nabhishesham
    sapasham vai parashum kamalam shubham | abhayam sandadhantam ca prasannavadanambujam || 9|| bhaktebhyo
    varadam nityamabhaktanam nishudanam | etadrisham hridi dhyatva sevadhvamekadantakam || 10|| sarvesham
    hridi samstho'yam buddhiprerakabhavatah | svayam buddhipatih sakshadatma ca sarvadehinam || 11|| ekashabdatmika
    maya deharupa vilasini | dantah sattatmakah proktah shabdastatra na samshayah || 12|| mayaya dharako'yam
    vai sattamatrena samsthitah | ekadanto ganesho vai kathyate vedavadibhih || 13|| sarvasattadharam
    purnamekadantam gajananam | sevadhvam bhaktibhavena bhavishyati sada sukham || 14|| evamuktva yayau
    yogi sa sanatkumara adarat | jaya herambamantram vai samuccaran mukhena sah || 15|| tato devaganah
    sarve manuyastapasi sthitah | ekaksharavidhanena toshayamasuradarat || 16|| patrabhaksha nirahara
    vayubhaksha jalashinah | kandamulaphalaharah kecitkecidbabhuvire || 17|| samsthita dhyananishtha vai
    japahomaparayanah | nanatapahprabhavena toshayan gananayakam || 18|| gatavarshashateshu vai santushta
    ekadantakah | ayayau tanvarandatum dhyatastairyadrishastatha || 19|| jagada sa tapoyuktan munindevangajananah
    | varam vrinuta tushto'ham dasyami brahmanamarah || 20|| tasya tadvacanam shrutva hrishta devarshayo'bhavan
    | unmilya locane devamapashyansamipasthitam || 21|| drishtva mushakasamstham tam pranemuste gajananam
    | munayo devadevendra pupujurbhaktisamyutah || 22|| pujayitva yathanyayam pranamya karasamputah |
    tushtuvurekadantam tam bhaktinamratmakandharah || 23|| devarshaya ucuh | namaste gajavaktraya ganeshaya
    namo namah | anantanandabhoktre vai brahmane brahmarupine || 24|| adimadhyantahinaya caracaramayaya
    te | anantodarasamsthaya nabhisheshaya te namah || 25|| kartre patre ca samhartre trigunanamadhishvara
    | sarvasattadharayaiva nirgunaya namo namah || 26|| siddhibuddhipate tubhyam siddhibuddhipradaya ca
    | brahmabhutaya devesha sagunaya namo namah || 27|| parashudharine tubhyam kamalahastashobhine | pashabhayadharayaiva
    mahodaraya te namah || 28|| mushakarudhadevaya mushakadhvajine namah | adipujyaya sarvaya sarvapujyaya
    te namah || 29|| sagunatmakakayaya nirgunamastakaya te | tayodabhedarupena caikadantaya te namah ||
    30|| devanta'gocarayaiva vedantalabhyakaya te | yogadhishaya vai tubhyam brahmadhishaya te namah ||
    31|| aparagunadhamayanantamayapracarine | nanavatarabhedaya shantidaya namo namah || 32|| vayam dhanya
    vayam dhanya yairdrishto gananayakah | brahmabhutamayah sakshatpratyaksham puratah sthitah || 33||
    evam stutva praharshena nanriturbhaktisamyutah | sashrunetransaromancandrishtva tan dhundhirabravit
    || 34|| ekadanta uvaca | varam vrinuta devesha manuyashca yathepsitam | dasyami tam na sandeho yadyapi
    durlabham bhavet || 35|| bhavatkritam madiyam tat stotram sarvarthadam bhavet | pathate shrunvate
    deva nanasiddhipradam dvijah || 36|| shatrunashakaram caiva sukhanandapradayakam | putrapautradikam
    sarvam labhate pathato narah || 37|| gritsamada uvaca | evam tasya vacah shrutva harshayuktah surarshayah
    | ucustamekadantam te pranamya bhaktibhavatah || 38|| surarshaya ucuh | yadi tushto'si sarvesha ekadanta
    mahaprabho | yadi deyo varo nashcejjahi dushtam madasuram || 39|| iti shrimudgalapuranantargatam sanakadikritamekadantastotram
    samaptam |
  devanagari: ृणुध्वं सुरसत्तमाः । यूयं तं तादृशं ध्यात्वा तोषयध्वं विधानतः ॥ ७॥ एकदन्तं चतुर्बाहुं गजवक्त्रं
    महोदरम् । सिद्धिबुद्धिसमायुक्तं मूषकारूढमेव च ॥ ८॥ नाभिशेषं सपाशं वै परशुं कमलं शुभम् । अभयं सन्दधन्तं
    च प्रसन्नवदनाम्बुजम् ॥ ९॥ भक्तेभ्यो वरदं नित्यमभक्तानां निषूदनम् । एतादृशं हृदि ध्यात्वा सेवध्वमेकदन्तकम्
    ॥ १०॥ सर्वेषां हृदि संस्थोऽयं बुद्धिप्रेरकभावतः । स्वयं बुद्धिपतिः साक्षादात्मा च सर्वदेहिनाम् ॥ ११॥
    एकशब्दात्मिका माया देहरूपा विलासिनी । दन्तः सत्तात्मकः प्रोक्तः शब्दस्तत्र न संशयः ॥ १२॥ मायाया धारकोऽयं
    वै सत्तमात्रेण संस्थितः । एकदन्तो गणेशो वै कथ्यते वेदवादिभिः ॥ १३॥ सर्वसत्ताधरं पूर्णमेकदन्तं गजाननम्
    । सेवध्वं भक्तिभावेन भविष्यति सदा सुखम् ॥ १४॥ एवमुक्त्वा ययौ योगी स सनत्कुमार आदरात् । जय हेरम्बमन्त्रं
    वै समुच्चरन् मुखेन सः ॥ १५॥ ततो देवगणाः सर्वे मनुयस्तपसि स्थिताः । एकाक्षरविधानेन तोषयामासुरादरात्
    ॥ १६॥ पत्रभक्षा निराहारा वायुभक्षा जलाशिनः । कन्दमूलफलाहाराः केचित्केचिद्बभूविरे ॥ १७॥ संस्थिता ध्याननिष्ठा
    वै जपहोमपरायणाः । नानातपःप्रभावेण तोषयन् गणनायकम् ॥ १८॥ गतवर्षशतेषु वै सन्तुष्ट एकदन्तकः । आययौ तान्वरान्दातुं
    ध्यातस्तैर्यादृशस्तथा ॥ १९॥ जगाद स तपोयुक्तान् मुनीन्देवन्गजाननः । वरं वृणुत तुष्टोऽहं दास्यामि ब्राह्मणामराः
    ॥ २०॥ तस्य तद्वचनं श्रुत्वा हृष्टा देवर्षयोऽभवन् । उन्मील्य लोचने देवमपश्यन्समीपस्थितम् ॥ २१॥ दृष्ट्वा
    मूषकसंस्थं तं प्रणेमुस्ते गजाननम् । मुनयो देवदेवेन्द्रा पुपूजुर्भक्तिसंयुताः ॥ २२॥ पूजयित्वा यथान्यायं
    प्रणम्य करसम्पुटाः । तुष्टुवुरेकदन्तं तं भक्तिनम्रात्मकन्धराः ॥ २३॥ देवर्षय ऊचुः । नमस्ते गजवक्त्राय
    गणेशाय नमो नमः । अनन्तानन्दभोक्त्रे वै ब्रह्मणे ब्रह्मरूपिणे ॥ २४॥ आदिमध्यान्तहीनाय चराचरमयाय ते ।
    अनन्तोदरसंस्थाय नाभिशेषाय ते नमः ॥ २५॥ कर्त्रे पात्रे च संहर्त्रे त्रिगुणानामधीश्वर । सर्वसत्ताधरायैव
    निर्गुणाय नमो नमः ॥ २६॥ सिद्धिबुद्धिपते तुभ्यं सिद्धिबुद्धिप्रदाय च । ब्रह्मभूताय देवेश सगुणाय नमो
    नमः ॥ २७॥ परशुधारिणे तुभ्यं कमलहस्तशोभिने । पाशाभयधरायैव महोदराय ते नमः ॥ २८॥ मूषकारूढदेवाय मूषकध्वजिने
    नमः । आदिपूज्याय सर्वाय सर्वपूज्याय ते नमः ॥ २९॥ सगुणात्मककायाय निर्गुणमस्तकाय ते । तयोदभेदरूपेण चैकदन्तय
    ते नमः ॥ ३०॥ देवान्ताऽगोचरायैव वेदान्तलभ्यकाय ते । योगाधीशाय वै तुभ्यं ब्रह्माधीशाय ते नमः ॥ ३१॥ अपारगुणधामायानन्तमायाप्रचरिणे
    । नानावतारभेदाय शान्तिदाय नमो नमः ॥ ३२॥ वयं धन्या वयं धन्या यैर्दृष्टो गणनायकः । ब्रह्मभूतमयः साक्षात्प्रत्यक्षं
    पुरतः स्थितः ॥ ३३॥ एवं स्तुत्वा प्रहर्षेण ननृतुर्भक्तिसंयुताः । साश्रुनेत्रान्सरोमाञ्चान्दृष्ट्वा
    तान् ढुण्ढिरब्रवीत् ॥ ३४॥ एकदन्त उवाच । वरं वृणुत देवेशा मनुयश्च यथेप्सितम् । दास्यामि तं न सन्देहो
    यद्यपि दुर्लभं भवेत् ॥ ३५॥ भवत्कृतं मदीयं तत् स्तोत्रं सर्वार्थदं भवेत् । पठते श्रुण्वते देवा नानासिद्धिप्रदं
    द्विजाः ॥ ३६॥ शत्रुनाशकरं चैव सुखानन्दप्रदायकम् । पुत्रपौत्रादिकं सर्वं लभते पाठतो नरः ॥ ३७॥ गृत्समद
    उवाच । एवं तस्य वचः श्रुत्वा हर्षयुक्ताः सुरर्षयः । ऊचुस्तमेकदन्तं ते प्रणम्य भक्तिभावतः ॥ ३८॥ सुरर्षय
    ऊचुः । यदि तुष्टोऽसि सर्वेश एकदन्त महाप्रभो । यदि देयो वरो नश्चेज्जहि दुष्टं मदासुरम् ॥ ३९॥ इति श्रीमुद्गलपुराणान्तर्गतं
    सनकादिकृतमेकदन्तस्तोत्रं समाप्तम् ।
