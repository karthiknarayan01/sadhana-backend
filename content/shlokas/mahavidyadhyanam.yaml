id: mahavidyadhyanam
category: mantra
name:
  english: mahavidyadhyanam
  devanagari: महाविद्याध्यानम्
content:
  english: caturbhujam mahadevim nagayajnopavitinim | mahabhimam karalasyam siddhavidyadharairyutam ||
    mundamalavalikirnam muktakeshim smitananam | evam dhyayenmahadevim sarvakamartha siddhaye || devi
    caturbhuja
  devanagari: चतुर्भुजां महादेवीं नागयज्ञोपवीतिनीम् । महाभीमां करालास्यां सिद्धविद्याधरैर्युताम् ॥ मुण्डमालावलीकीर्णां
    मुक्तकेशीं स्मिताननाम् । एवं ध्यायेन्महादेवीं सर्वकामार्थ सिद्धये ॥ देवी चतुर्भुजा
meaning: {}
