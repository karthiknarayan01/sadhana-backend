id: datta-shodasi
category: stotram
name:
  english: Datta Shodasi
content:
  english: pallavi saccidananda sadguru dattam bhaja bhaja bhakta shodashavatara rupa dattam bhajare bhakta
    caranam mahishapuravasa shri kalagnishamana dattam pròdduturu gramavasa yogirajavallabham bèngaluru
    nagarasthita dattayogirajam anantapure sthitam jnanasagaram bhaja dattam || || vijayavada vilasitam
    shyamakamalalocanam macilipattana samsthitam atrivaradarajam jayalakshmipure samskarahina shivarupam
    madrasu nagara samvasam adiguru namakam || || rishikesha tirtharajam shri digambara dattam akividustham
    vishvambaravadhuta dattam nujividu pattane devadeva avataram bhagyanagara sthitam dattavadhutam bhaja
    || || gandigunta janapade dattadigambara devam kòccin nagare sthitam siddharaja namakam mayamuktavadhuta
    maccarapake lilavishvambharam surannagare bhaja || || saccidananda janmasthale dattakashishvaram purvasamudra
    tire datta rameshvaram saccidananda sadguru dattam bhaja bhaja bhakta shodashavatara rupa dattam bhajare
    bhakta ||
  devanagari: पल्लवि सच्चिदानन्द सद्गुरु दत्तं भज भज भक्त षोडशावतार रूप दत्तं भजरे भक्त चरणं महिषपुरवास
    श्री कालाग्निशमन दत्तं प्रॊद्दुटूरु ग्रामवास योगिराजवल्लभं बॆङ्गलूरु नगरस्थित दत्तयोगिराजं अनन्तपुरे
    स्थितं ज्ञानसागरं भज दत्तम् ॥ ॥ विजयवाड विलसितं श्यामकमललोचनं मचिलीपट्टण संस्थितं अत्रिवरदराजं जयलक्ष्मीपुरे
    संस्कारहीन शिवरूपं मद्रासु नगर संवासं आदिगुरु नामकं ॥ ॥ ऋषीकेश तीर्थराजं श्री दिगम्बर दत्तं आकिवीडुस्थं
    विश्वाम्बरावधूत दत्तं नूजिवीडु पट्टणे देवदेव अवतारं भाग्यनगर स्थितं दत्तावधूतं भज ॥ ॥ गण्डिगुण्ट जनपदे
    दत्तदिगम्बर देवं कॊच्चिन् नगरे स्थितं सिद्धराज नामकं मायामुक्तावधूत मच्चरपाके लीलाविश्वम्भरं सूरन्नगरे
    भज ॥ ॥ सच्चिदानन्द जन्मस्थले दत्तकाशीश्वरं पूर्वसमुद्र तीरे दत्त रामेश्वरं सच्चिदानन्द सद्गुरु दत्तं
    भज भज भक्त षोडशावतार रूप दत्तं भजरे भक्त ॥
