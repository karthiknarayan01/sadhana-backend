id: adityahriday
category: hridaya
name:
  english: adityahriday
  devanagari: अदित्यह्रिदय्
content:
  english: '|| iti adityahridayam mantram || stotrapatha om asya shriadityahridayastotramantrasya shriagastyarishih
    | anushtupchandah | shriadityahridayabhuto bhagavan brahma devatah | om bijam | rashmimateriti shaktih
    | om tatsaviturityadigayatri kilakam | nirastasheshavighnataya brahmavidyasiddhau sarvatra jayasiddhau
    ca viniyogah | atha rishyadinyasah || om agastyarishaye namah shirasi | anushtupchandase namah mukhe
    | adityahridayabhutabrahmadevatayai namah| hridi | om bijaya namah guhye | om rashmimate shaktaye
    namah padayoh | om tatsaviturityadigayatri kilakaya namah nabhau | viniyogaya namah sarvange | iti
    rishyadinyasah || atha karanyasah || om rashmimate angushthabhyam namah | om samudyate tarjanibhyam
    namah | om devasuranamaskritaya madhyamabhyam namah | om vivasvate anamikabhyam namah | om bhaskaraya
    kanishthikabhyam namah | om bhuvaneshvaraya karatalakaraprishthabhyam namah | iti karanyasah || atha
    hridayadishadanga nyasah || om rashmimate hridayaya namah | om samudyate shirase svaha | om devasuranamaskritaya
    shikhayai vashat | om vivasvate kavacaya hum | om bhaskaraya netratrayaya vaushat | om bhuvaneshvaraya
    astraya phat | iti hridayadishadanga nyasah || || atha adityahridayam || tato yuddhaparishrantam samare
    cintaya sthitam | ravanam cagrato drishtva yuddhaya samupasthitam || 1|| daivataishca samagamya drashtumabhyagato
    ranam | upagamyabravidramamagastyo bhagavanrishih || 2|| rama rama mahabaho sha'
  devanagari: ॥ इति आदित्यहृदयं मन्त्रम् ॥ स्तोत्रपाठ ॐ अस्य श्रीआदित्यहृदयस्तोत्रमन्त्रस्य श्रीअगस्त्यऋषिः
    । अनुष्टुप्छन्दः । श्रीआदित्यहृदयभूतो भगवान् ब्रह्मा देवताः । ॐ बीजम् । रश्मिमतेरिति शक्तिः । ॐ तत्सवितुरित्यादिगायत्री
    कीलकम् । निरस्ताशेषविघ्नतया ब्रह्मविद्यासिद्धौ सर्वत्र जयसिद्धौ च विनियोगः । अथ ऋष्यादिन्यासः ॥ ॐ
    अगस्त्यऋषये नमः शिरसि । अनुष्टुप्छन्दसे नमः मुखे । आदित्यहृदयभूतब्रह्मदेवतायै नमः। हृदि । ॐ बीजाय
    नमः गुह्ये । ॐ रश्मिमते शक्तये नमः पादयोः । ॐ तत्सवितुरित्यादिगायत्री कीलकाय नमः नाभौ । विनियोगाय
    नमः सर्वाङ्गे । इति ऋष्यादिन्यासः ॥ अथ करन्यासः ॥ ॐ रश्मिमते अङ्गुष्ठाभ्यां नमः । ॐ समुद्यते तर्जनीभ्यां
    नमः । ॐ देवासुरनमस्कृताय मध्यमाभ्यां नमः । ॐ विवस्वते अनामिकाभ्यां नमः । ॐ भास्कराय कनिष्ठिकाभ्यां
    नमः । ॐ भुवनेश्वराय करतलकरपृष्ठाभ्यां नमः । इति करन्यासः ॥ अथ हृदयादिषडङ्ग न्यासः ॥ ॐ रश्मिमते हृदयाय
    नमः । ॐ समुद्यते शिरसे स्वाहा । ॐ देवासुरनमस्कृताय शिखायै वषट् । ॐ विवस्वते कवचाय हुम् । ॐ भास्कराय
    नेत्रत्रयाय वौषट् । ॐ भुवनेश्वराय अस्त्राय फट् । इति हृदयादिषडङ्ग न्यासः ॥ ॥ अथ आदित्यहृदयम् ॥ ततो
    युद्धपरिश्रान्तं समरे चिन्तया स्थितम् । रावणं चाग्रतो दृष्ट्वा युद्धाय समुपस्थितम् ॥ १॥ दैवतैश्च समागम्य
    द्रष्टुमभ्यागतो रणम् । उपागम्याब्रवीद्राममगस्त्यो भगवानृषिः ॥ २॥ राम राम महाबाहो श
