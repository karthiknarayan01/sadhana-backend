id: sarasvati-kavacham
category: stotram
name:
  english: Sarasvati Kavacham
content:
  english: brahmavaivarta mahapuranantargatam bhriguruvaca | brahmanbrahmavidamshreshtha brahmajnanavisharada
    | sarvajna sarvajanaka sarvapujakapujita || sarasvatyashca kavacam bruhi vishvajayam prabho | ayatayamamantranam
    samuho yatra samyutah || || brahmovaca | shrinu vatsa pravakshyami kavacam sarvakamadam | shrutisaram
    shrutisukham shrutyuktam shrutipujitam || || uktam krishnena goloke mahyam vrindavane vane | raseshvarena
    vibhuna rase vai rasamandale || || ativa gopaniyanca kalpavrikshasamam param | ashrutadbhutamantranam
    samuhaishca samanvitam || || yaddhritva pathanadbrahmanbuddhimamshca brihaspatih | yaddhritva bhagavanchukrah
    sarvadaityeshu pujitah || || pathanaddharanadvagmi kavindro valmiki munih | svayambhuvo manushcaiva
    yaddhritva sarvapujitah || || kanado gautamah kanvah paninih shakatayanah | grantham cakara yaddhritva
    dakshah katyayanah svayam || || dhritva vedavibhaganca purananyakhilani ca | cakara lilamatrena krishnadvaipayanah
    svayam || || shatatapashca samvarto vasishthashca parasharah | yaddhritva pathanadgrantham yajnavalkyashcakara
    sah || || rishyashringo bharadvajashcastiko devalastatha | jaigishavyo'tha jabaliryaddhritva sarvapujitah
    || || kavacasyasya viprendra rishiresha prajapatih | svayam brihaspatishchando devo raseshvarah prabhuh
    || || sarvatattvaparijnane sarvarthe'pi ca sadhane | kavitasu ca sarvasu viniyogah prakirtitah ||
    om hrim sarasvatyai svaha shiro me patu sarvatah | shrim vagdevatayai svaha bhalam me sarvada'vatu
    || || om hrim sarasvatyai svaheti shrotre patu nirantaram | om shrim hrim bhagavatyai sarasvatyai
    svaha netrayugmam sada'vatu || || aim hrim vagvadinyai svaha nasam me sarvada'vatu | hrim vidyadhishthatridevyai
    svaha comshtha sada'vatu || || om shrim hrim brahmyai svaheti dantapanktim sada'vatu | aimityekaksharo
    mantro mama kantham sada'vatu || || om shrim hrim patu me grivam skandham me shrim sada'vatu | om
    hrim vidyadhishthatridevyai svaha vakshah sada'vatu || || om hrim vidyasvarupayai svaha me patu nabhikam
    | om hrim klim vanyai svaheti mama prishtham sada'vatu || || om sarvavarnatmikayai padayugmam sada'vatu
    | om ragadhishthatridevyai sarvangam me sada'vatu || || om sarvakanthavasinyai svaha pracyam sada'vatu
    | om hrim jihvagravasinyai svaha'gnidishi rakshatu || || om aim hrim shrim sarasvatyai budhajananyai
    svaha | satatam mantrarajo'yam dakshine mam sada'vatu || || om hrim shrim tryaksharo mantro nairrityam
    me sada'vatu | kavijihvagravasinyai svaha mam varune'vatu || || om sadambikayai svaha vayavye mam
    sada'vatu | om gadyapadyavasinyai svaha mamuttare'vatu || || om sarvashastravasinyai svahaishanyam
    sada'vatu | om hrim sarvapujitayai svaha cordhvam sada'vatu || || aim hrim pustakavasinyai svaha'dho
    mam sadavatu | om granthabijarupayai svaha mam sarvato'vatu || || iti te kathitam vipra sarvamantraughavigraham
    | idam vishvajayam nama kavacam brahmarupakam || || pura shrutam dharmavaktratparvate gandhamadane
    | tava snehanmaya''khyatam pravaktavyam na kasyacit || || gurumabhyarcya vidhivadvastralankaracandanaih
    | pranamya dandavadbhumau kavacam dharayetsudhih || || pancalakshajapenaiva siddham tu kavacam bhavet
    | yadi syatsiddhakavaco brihaspati samo bhavet || || mahavagmi kavindrashca trailokyavijayi bhavet
    | shaknoti sarvam jetum sa kavacasya prabhavatah || || idam te kanvashakhoktam kathitam kavacam mune
    | stotram pujavidhanam ca dhyanam vai vandanam tatha || || iti shri brahmavaivarte mahapurane prakritikhande
    naradanarayanasamvade sarasvatikavacam nama caturtho'dhyayah |
  devanagari: ब्रह्मवैवर्त महापुराणान्तर्गतं भृगुरुवाच । ब्रह्मन्ब्रह्मविदांश्रेष्ठ ब्रह्मज्ञानविशारद
    । सर्वज्ञ सर्वजनक सर्वपूजकपूजित ॥ सरस्वत्याश्च कवचं ब्रूहि विश्वजयं प्रभो । अयातयाममन्त्राणां समूहो
    यत्र संयुतः ॥ ॥ ब्रह्मोवाच । शृणु वत्स प्रवक्ष्यामि कवचं सर्वकामदम् । श्रुतिसारं श्रुतिसुखं श्रुत्युक्तं
    श्रुतिपूजितम् ॥ ॥ उक्तं कृष्णेन गोलोके मह्यं वृन्दावने वने । रासेश्वरेण विभुना रासे वै रासमण्डले ॥
    ॥ अतीव गोपनीयञ्च कल्पवृक्षसमं परम् । अश्रुताद्भुतमन्त्राणां समूहैश्च समन्वितम् ॥ ॥ यद्धृत्वा पठनाद्ब्रह्मन्बुद्धिमांश्च
    बृहस्पतिः । यद्धृत्वा भगवाञ्छुक्रः सर्वदैत्येषु पूजितः ॥ ॥ पठनाद्धारणाद्वाग्मी कवीन्द्रो वाल्मिकी
    मुनिः । स्वायम्भुवो मनुश्चैव यद्धृत्वा सर्वपूजिताः ॥ ॥ कणादो गौतमः कण्वः पाणिनिः शाकटायनः । ग्रन्थं
    चकार यद्धृत्वा दक्षः कात्यायनः स्वयम् ॥ ॥ धृत्वा वेदविभागञ्च पुराणान्यखिलानि च । चकार लीलामात्रेण
    कृष्णद्वैपायनः स्वयम् ॥ ॥ शातातपश्च संवर्तो वसिष्ठश्च पराशरः । यद्धृत्वा पठनाद्ग्रन्थं याज्ञवल्क्यश्चकार
    सः ॥ ॥ ऋष्यशृङ्गो भरद्वाजश्चास्तीको देवलस्तथा । जैगीषव्योऽथ जाबालिर्यद्धृत्वा सर्वपूजितः ॥ ॥ कवचस्यास्य
    विप्रेन्द्र ऋषिरेष प्रजापतिः । स्वयं बृहस्पतिश्छन्दो देवो रासेश्वरः प्रभुः ॥ ॥ सर्वतत्त्वपरिज्ञाने
    सर्वार्थेऽपि च साधने । कवितासु च सर्वासु विनियोगः प्रकीर्तितः ॥ ॐ ह्रीं सरस्वत्यै स्वाहा शिरो मे पातु
    सर्वतः । श्रीं वाग्देवतायै स्वाहा भालं मे सर्वदाऽवतु ॥ ॥ ॐ ह्रीं सरस्वत्यै स्वाहेति श्रोत्रे पातु
    निरन्तरम् । ॐ श्रीं ह्रीं भगवत्यै सरस्वत्यै स्वाहा नेत्रयुग्मं सदाऽवतु ॥ ॥ ऐं ह्रीं वाग्वादिन्यै स्वाहा
    नासां मे सर्वदाऽवतु । ह्रीं विद्याधिष्ठातृदेव्यै स्वाहा चोंष्ठ सदाऽवतु ॥ ॥ ॐ श्रीं ह्रीं ब्राह्म्यै
    स्वाहेति दन्तपङ्क्तिं सदाऽवतु । ऐमित्येकाक्षरो मन्त्रो मम कण्ठं सदाऽवतु ॥ ॥ ॐ श्रीं ह्रीं पातु मे
    ग्रीवां स्कन्धं मे श्रीं सदाऽवतु । ॐ ह्रीं विद्याधिष्ठातृदेव्यै स्वाहा वक्षः सदाऽवतु ॥ ॥ ॐ ह्रीं विद्यास्वरूपायै
    स्वाहा मे पातु नाभिकाम् । ॐ ह्रीं क्लीं वाण्यै स्वाहेति मम पृष्ठं सदाऽवतु ॥ ॥ ॐ सर्ववर्णात्मिकायै
    पादयुग्मं सदाऽवतु । ॐ रागाधिष्ठातृदेव्यै सर्वाङ्गं मे सदाऽवतु ॥ ॥ ॐ सर्वकण्ठवासिन्यै स्वाहा प्रच्यां
    सदाऽवतु । ॐ ह्रीं जिह्वाग्रवासिन्यै स्वाहाऽग्निदिशि रक्षतु ॥ ॥ ॐ ऐं ह्रीं श्रीं सरस्वत्यै बुधजनन्यै
    स्वाहा । सततं मन्त्रराजोऽयं दक्षिणे मां सदाऽवतु ॥ ॥ ॐ ह्रीं श्रीं त्र्यक्षरो मन्त्रो नैरृत्यां मे
    सदाऽवतु । कविजिह्वाग्रवासिन्यै स्वाहा मां वारुणेऽवतु ॥ ॥ ॐ सदम्बिकायै स्वाहा वायव्ये मां सदाऽवतु ।
    ॐ गद्यपद्यवासिन्यै स्वाहा मामुत्तरेऽवतु ॥ ॥ ॐ सर्वशास्त्रवासिन्यै स्वाहैशान्यां सदाऽवतु । ॐ ह्रीं
    सर्वपूजितायै स्वाहा चोर्ध्वं सदाऽवतु ॥ ॥ ऐं ह्रीं पुस्तकवासिन्यै स्वाहाऽधो मां सदावतु । ॐ ग्रन्थबीजरूपायै
    स्वाहा मां सर्वतोऽवतु ॥ ॥ इति ते कथितं विप्र सर्वमन्त्रौघविग्रहम् । इदं विश्वजयं नाम कवचं ब्रह्मारूपकम्
    ॥ ॥ पुरा श्रुतं धर्मवक्त्रात्पर्वते गन्धमादने । तव स्नेहान्मयाऽऽख्यातं प्रवक्तव्यं न कस्यचित् ॥ ॥
    गुरुमभ्यर्च्य विधिवद्वस्त्रालङ्कारचन्दनैः । प्रणम्य दण्डवद्भूमौ कवचं धारयेत्सुधीः ॥ ॥ पञ्चलक्षजपेनैव
    सिद्धं तु कवचं भवेत् । यदि स्यात्सिद्धकवचो बृहस्पति समो भवेत् ॥ ॥ महावाग्मी कवीन्द्रश्च त्रैलोक्यविजयी
    भवेत् । शक्नोति सर्वं जेतुं स कवचस्य प्रभावतः ॥ ॥ इदं ते काण्वशाखोक्तं कथितं कवचं मुने । स्तोत्रं
    पूजाविधानं च ध्यानं वै वन्दनं तथा ॥ ॥ इति श्री ब्रह्मवैवर्ते महापुराणे प्रकृतिखण्डे नारदनारायणसंवादे
    सरस्वतीकवचं नाम चतुर्थोऽध्यायः ।
