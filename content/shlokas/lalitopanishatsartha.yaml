id: lalitopanishatsartha
category: upanishad
name:
  english: lalitopanishatsartha
  devanagari: ललितोपनिषत्सार्थ
content:
  english: bhagamalinyo'ntastrikonagradevatah || pancadashatithirupena kalasya parinamavalokanapancadashanityah
    shuddhanurupadhidevatah | nirupadhisarvadevakameshvari sada''nandapurna | svatmyaikyarupalalitakameshvari
    sada''nandaghanapurna svatmaikyarupa devata lalitamiti || sahityakaranam sattvam | karttavyamakarttavyamiti
    bhavanamukta upacarah | aham tvamasti nasti karttavyakarttavyamupasitavyanupasitavyamiti vikalpana
    | manovilapanam homah || bahyabhyantarakarananam rupagrahanayogyatastityavahanam | tasya bahyabhyantarakarananamekarupavishayagrahanamasanam
    | raktashuklapadaikikaranam padyam | ujjvaladamoda''nandatsanandanamarghyam | svacchasvatah shaktirityacamanam
    | ciccandramayismaranam snanam | cidagnisvarupaparamanandashaktismaranam vastram | pratyekam saptavimshatidhabhinnatvena
    icchakriyatmakabrahmagranthimayi satantubrahmanadi brahmasutram savyatiriktavastram | sangarahitam
    smaranam vibhushanam | svacchandaparipurnasmaranam gandhah | samastavishayanam manahsthairyenanusandhanam
    kusumam | teshameva sarvada svikaranam dhupah | pavanacchinnordhvajvalasaccidahladakashadeho dipah
    | samastayatayatavarjanam naivedyam | avasthatrayaikikaranam tambulam | muladharadabrahmarandhraparyantam
    brahmarandhradamuladharaparyantam gatagatarupena pradakshinyam | turiyavasthanam samskaradehashunyam
    pramaditavatimajjanam baliharanam | sattvamasti karttavyamakarttavyamaudasinyamatmavilapanam homah
    | bhavanavishayanamabhedabhavana tarpanam | svayam tatpadukanimajjanam paripurnadhyanam || evam murtitrayam
    bhavanaya yukto mukto bhavati | tasya devatatmaikyasiddhishcitikaryanyaprayatnena sidhyanti sa eva
    shivayogiti kathyate || || iti shrilalitopanishatsampurna || himdi mem artha || shrilalitatripurasundari
    ko namaskara || || shrilalitopanishat || parama
  devanagari: भगमालिन्योऽन्तस्त्रिकोणाग्रदेवताः ॥ पञ्चदशतिथिरूपेण कालस्य परिणामावलोकनपञ्चदशनित्याः शुद्धानुरुपाधिदेवताः
    । निरुपाधिसार्वदेवकामेश्वरी सदाऽऽनन्दपूर्णा । स्वात्म्यैक्यरूपललिताकामेश्वरी सदाऽऽनन्दघनपूर्णा स्वात्मैक्यरूपा
    देवता ललितामिति ॥ साहित्यकरणं सत्त्वम् । कर्त्तव्यमकर्त्तव्यमिति भावनामुक्ता उपचाराः । अहं त्वमस्ति
    नास्ति कर्त्तव्याकर्त्तव्यमुपासितव्यानुपासितव्यमिति विकल्पना । मनोविलापनं होमः ॥ बाह्याभ्यन्तरकरणानां
    रूपग्रहणयोग्यतास्तीत्यावाहनम् । तस्य बाह्याभ्यन्तरकरणानामेकरूपविषयग्रहणमासनम् । रक्तशुक्लपदैकीकरणं
    पाद्यम् । उज्ज्वलदामोदाऽऽनन्दात्सानन्दनमर्घ्यम् । स्वच्छास्वतः शक्तिरित्याचमनम् । चिच्चन्द्रमयीस्मरणं
    स्नानम् । चिदग्निस्वरूपपरमानन्दशक्तिस्मरणं वस्त्रम् । प्रत्येकं सप्तविंशतिधाभिन्नत्वेन इच्छाक्रियात्मकब्रह्मग्रन्थिमयी
    सतन्तुब्रह्मनाडी ब्रह्मसूत्रं सव्यातिरिक्तवस्त्रम् । सङ्गरहितं स्मरणं विभूषणम् । स्वच्छन्दपरिपूर्णस्मरणं
    गन्धः । समस्तविषयाणां मनःस्थैर्येणानुसन्धानं कुसुमम् । तेषामेव सर्वदा स्वीकरणं धूपः । पवनाच्छिन्नोर्ध्वज्वालासच्चिदाह्लादाकाशदेहो
    दीपः । समस्तयातायातवर्जनं नैवेद्यम् । अवस्थात्रयैकीकरणं ताम्बूलम् । मूलाधारादाब्रह्मरन्ध्रपर्यन्तं
    ब्रह्मरन्ध्रादामूलाधारपर्यन्तं गतागतरूपेण प्रादक्षिण्यम् । तुरीयावस्थानं संस्कारदेहशून्यं प्रमादितावतिमज्जनं
    बलिहरणम् । सत्त्वमस्ति कर्त्तव्यमकर्त्तव्यमौदासीन्यमात्मविलापनं होमः । भावनाविषयाणामभेदभावना तर्पणम्
    । स्वयं तत्पादुकानिमज्जनं परिपूर्णध्यानम् ॥ एवं मूर्तित्रयं भावनया युक्तो मुक्तो भवति । तस्य देवतात्मैक्यसिद्धिश्चितिकार्याण्यप्रयत्नेन
    सिध्यन्ति स एव शिवयोगीति कथ्यते ॥ ॥ इति श्रीललितोपनिषत्सम्पूर्णा ॥ हिंदी में अर्थ ॥ श्रीललितात्रिपुरसुन्दरी
    को नमस्कार ॥ ॥ श्रीललितोपनिषत् ॥ परम
