id: nrisimharakshamantrah
category: mantra
name:
  english: nrisimharakshamantrah
  devanagari: नृसिंहरक्षामन्त्रः
content:
  english: shrinrisimharakshamantrah om namo narasimhaya hiranyakashipuvakshasthalavidaranaya tribhuvanavyapakaya
    bhutapretapishacashakinibadhanashakaya ambhodbhavasamastadoshan hana hana sara sara cala cala kampa
    kampa matha matha hum phat hum phat thah thah maharudrajapiyata svaha | iti nrisimharakshamantrah
    sampurnah |
  devanagari: श्रीनृसिंहरक्षामन्त्रः ॐ नमो नारसिंहाय हिरण्यकशिपुवक्षस्थलविदारणाय त्रिभुवनव्यापकाय भूतप्रेतपिशाचशाकिनीबाधानाशकाय
    अम्भोद्भवसमस्तदोषान् हन हन सर सर चल चल कम्प कम्प मथ मथ हुं फट् हुं फट् ठः ठः महारूद्राजापियत स्वाहा
    । इति नृसिंहरक्षामन्त्रः सम्पूर्णः ।
meaning: {}
