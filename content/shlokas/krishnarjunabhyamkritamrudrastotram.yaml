id: krishnarjunabhyamkritamrudrastotram
category: stotram
name:
  english: krishnarjunabhyamkritamrudrastotram
  devanagari: कृष्णार्जुनाभ्यांकृतंरुद्रस्तोत्रम्
content:
  english: shrikrishnarjunabhyam kritam rudrastotram namo bhavaya sharvaya rudraya varadaya ca | pashunam
    pataye nityamugraya ca kapardine || 49|| mahadevaya bhimaya tryambakaya ca shambhave | ishanaya bhagaghnaya
    namo'stvandhakaghatine || 50|| kumaragurave nityam nilagrivaya vedhase | vilohitaya dhumraya vyadhayanaparajite
    || 51|| nityam nilashikhandaya shuline divyacakshushe | hantre goptre trinetraya vyadhaya vasuretase
    || 52|| acintyayambikabhartre sarvadevastutaya ca | vrishadhvajaya pingaya jatine brahmacarine ||
    53|| tapyamanaya salile brahmanyayajitaya ca | vishvatmane vishvasrije vishvamavritya tishthate ||
    54|| namo namaste sevyaya bhutanam prabhave sada | brahmavaktraya sharvaya shankaraya shivaya ca ||
    55|| namo'stu vacaspataye prajanam pataye namah | namo vishvasya pataye mahatam pataye namah || 56||
    namah sahasrashirase sahasrabhujamanyave | sahasranetrapadaya namo'sankhyeyakarmane || 57|| namo hiranyavarnaya
    hiranyakavacaya ca | bhaktanukampine nityam sidhyatam nau varah prabho || 58|| evam stutva mahadevam
    vasudevah saharjunah | prasadayamasa bhavam tada hyastropalabdhaye || 59|| iti mahabharate dronaparvani
    57 adhyayantargatam shrikrishnarjunabhyam kritam rudrastotram sampurnam | mahabharata | dronaparva
    | adhyaya 57
  devanagari: श्रीकृष्णार्जुनाभ्यां कृतं रुद्रस्तोत्रम् नमो भवाय शर्वाय रुद्राय वरदाय च । पशूनां पतये
    नित्यमुग्राय च कपर्दिने ॥ ४९॥ महादेवाय भीमाय त्र्यम्बकाय च शम्भवे । ईशानाय भगघ्नाय नमोऽस्त्वन्धकघातिने
    ॥ ५०॥ कुमारगुरवे नित्यं नीलग्रीवाय वेधसे । विलोहिताय धूम्राय व्याधायानपराजिते ॥ ५१॥ नित्यं नीलशिखण्डाय
    शूलिने दिव्यचक्षुषे । हन्त्रे गोप्त्रे त्रिनेत्राय व्याधाय वसुरेतसे ॥ ५२॥ अचिन्त्यायाम्बिकाभर्त्रे
    सर्वदेवस्तुताय च । वृषध्वजाय पिङ्गाय जटिने ब्रह्मचारिणे ॥ ५३॥ तप्यमानाय सलिले ब्रह्मण्यायाजिताय च
    । विश्वात्मने विश्वसृजे विश्वमावृत्य तिष्ठते ॥ ५४॥ नमो नमस्ते सेव्याय भूतानां प्रभवे सदा । ब्रह्मवक्त्राय
    शर्वाय शङ्कराय शिवाय च ॥ ५५॥ नमोऽस्तु वाचस्पतये प्रजानां पतये नमः । नमो विश्वस्य पतये महतां पतये नमः
    ॥ ५६॥ नमः सहस्रशिरसे सहस्रभुजमन्यवे । सहस्रनेत्रपादाय नमोऽसङ्ख्येयकर्मणे ॥ ५७॥ नमो हिरण्यवर्णाय हिरण्यकवचाय
    च । भक्तानुकम्पिने नित्यं सिध्यतां नौ वरः प्रभो ॥ ५८॥ एवं स्तुत्वा महादेवं वासुदेवः सहार्जुनः । प्रसादयामास
    भवं तदा ह्यस्त्रोपलब्धये ॥ ५९॥ इति महाभारते द्रोणपर्वणि ५७ अध्यायान्तर्गतं श्रीकृष्णार्जुनाभ्यां कृतं
    रुद्रस्तोत्रं सम्पूर्णम् । महाभारत । द्रोणपर्व । अध्याय ५७
