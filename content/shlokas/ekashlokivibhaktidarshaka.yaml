id: ekashlokivibhaktidarshaka
category: ekashloki
name:
  english: ekashlokivibhaktidarshaka
  devanagari: एकश्लोकिविभक्तिदर्शक
content:
  english: tvamevashrayah || devo jayati sarvatra devam namanti sajjanah | devena rakshitam vishvam devaya
    diyate havih || devadbhavati srishtishca devasya mahima para | deve tishthati vijnanam he deva raksha
    mam sada || mitram bhati sada gehe mitram pashyati balakah | mitrena saha gacchami mitraya diyate
    dhanam || mitrat prapnoti sandesham mitrasya bhavanam shubham | mitre vishvaso me asti he mitra tvam
    sukhi bhava || nripah palayati prithvim nripam shamsanti manavah | nripena jiyate shatruh nripaya
    diyate karah || nripat trasyati dushto hi nripasya vipulam balam | nripe tishthati nitih ca he nripa
    tvam jayi bhava || suryah bhati nabhastale suryam arcati manavah | suryena nashyate dhvantam suryaya
    diyate havih || suryat prapnoti loko'jah suryasya mahati dyutih | surye tishthati tejashca he surya
    tvam prasida me || akaranta napumsakalinga phalam patati vrikshacca phalam khadati balakah | phalena
    labhate triptim phalaya sprihayatyayam || phalad rasah prastravati phalasya madhura rasah | phale
    santi hi bijani he phala tvam varam bhava || akaranta strilinga lata vardhati vate ca latam pashyati
    balakah | lataya bhushita shakhi latayai diyate jalam || latayah patati pushpam latayah sundaram dalam
    | latayam kumjate bhrimgo he late tvam praphulla bhava || rama narayani devi ramam parataram bhaje
    | ramaya sarvasamriddhih ramayai kriyate namah || ramayah prakritirjata ramayah kirtiradbhuta | ramayam
    samshrito loko he rame sukhada bhava || ikaranta strilinga nadi vahati vegena nadim pashyati balakah
    | nadya ca sicyate kshetram nadyai diyate havih || nadyah pravahati vari nadyah kulam manoharam |
    nadyam taranti naukah ca he nadi tvam prasida me || ikaranta pullinga harih sarvajagadvandyo harim
    shriramanam bhaje | harina palitam vishvam haraye gurave namah || hareh parataro nasti hareh stavanamuttamam
    | harau bhakirdridha mestu he hare muktido bhava || ukaranta pullinga gurureva gatirgurumeva bhaje
    gurunaiva sahasmi namo gurave | na guroh paramam shishurasmi guroh matirasti gurau mama pahi guro
    || shabdamanjari
  devanagari: त्वमेवाश्रयः ॥ देवो जयति सर्वत्र देवं नमन्ति सज्जनाः । देवेन रक्षितं विश्वं देवाय दीयते
    हविः ॥ देवाद्भवति सृष्टिश्च देवस्य महिमा परा । देवे तिष्ठति विज्ञानं हे देव रक्ष मां सदा ॥ मित्रं
    भाति सदा गेहे मित्रं पश्यति बालकः । मित्रेण सह गच्छामि मित्राय दीयते धनम् ॥ मित्रात् प्राप्नोति सन्देशं
    मित्रस्य भवनं शुभम् । मित्रे विश्वासो मे अस्ति हे मित्र त्वं सुखी भव ॥ नृपः पालयति पृथ्वीं नृपं शंसन्ति
    मानवाः । नृपेण जीयते शत्रुः नृपाय दीयते करः ॥ नृपात् त्रस्यति दुष्टो हि नृपस्य विपुलं बलम् । नृपे
    तिष्ठति नीतिः च हे नृप त्वं जयी भव ॥ सूर्यः भाति नभस्तले सूर्यम् अर्चति मानवः । सूर्येण नश्यते ध्वान्तं
    सूर्याय दीयते हविः ॥ सूर्यात् प्राप्नोति लोकोऽजः सूर्यस्य महती द्युतिः । सूर्ये तिष्ठति तेजश्च हे
    सूर्य त्वं प्रसीद मे ॥ अकारान्त नपुंसकलिङ्ग फलं पतति वृक्षाच्च फलं खादति बालकः । फलेन लभते तृप्तिं
    फलाय स्पृहयत्ययम् ॥ फलाद् रसः प्रस्त्रवति फलस्य मधुरा रसाः । फले सन्ति हि बीजानि हे फल त्वं वरं भव
    ॥ आकारान्त स्त्रीलिङ्ग लता वर्धति वाटे च लतां पश्यति बालकः । लतया भूषिता शाखी लतायै दीयते जलम् ॥ लतायाः
    पतति पुष्पं लतायाः सुन्दरं दलम् । लतायां कूंजते भृंगो हे लते त्वं प्रफुल्ल भव ॥ रमा नारायणी देवी रमां
    परतरां भजे । रमया सर्वसमृद्धिः रमायै क्रियते नमः ॥ रमायाः प्रकृतिर्जाता रमायाः कीर्तिरद्भुता । रमायां
    सम्श्रितो लोको हे रमे सुखदा भव ॥ ईकारान्त स्त्रीलिङ्ग नदी वहति वेगेन नदीं पश्यति बालकः । नद्या च सिच्यते
    क्षेत्रं नद्यै दीयते हविः ॥ नद्याः प्रवहति वारि नद्याः कूलं मनोहरम् । नद्यां तरन्ति नौकाः च हे नदि
    त्वं प्रसीद मे ॥ इकारान्त पुल्लिङ्ग हरिः सर्वजगद्वन्द्यो हरिं श्रीरमणं भजे । हरिणा पालितं विश्वं हरये
    गुरवे नमः ॥ हरेः परतरो नास्ति हरेः स्तवनमुत्तमम् । हरौ भकिर्दृढा मेस्तु हे हरे मुक्तिदो भव ॥ उकारान्त
    पुल्लिङ्ग गुरुरेव गतिर्गुरुमेव भजे गुरुणैव सहास्मि नमो गुरवे । न गुरोः परमं शिशुरस्मि गुरोः मतिरस्ति
    गुरौ मम पाहि गुरो ॥ शब्दमञ्जरि
