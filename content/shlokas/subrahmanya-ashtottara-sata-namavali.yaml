    namah om kaladharaya namah om mayadharaya namah om mahamayine namah om kaivalyaya namah om shankaratmajaya
    namah om vishvayonaye namah om ameyatmane namah om tejonidhaye namah om anamayaya namah om parameshthine
    namah om parasmai brahmane namah om vedagarbhaya namah om viratsutaya namah om pulindakanyabhartre
    namah om mahasarasvatavritaya namah om ashritakhiladatre namah om coraghnaya namah om roganashanaya
    namah om anantamurtaye namah om anandaya namah om shikhindikrita ketanaya namah om dambhaya namah
    om paramadambhaya namah om mahadambhaya namah om vrishakapaye namah om karanopattadehaya namah om
    karanatitavigrahaya namah om anishvaraya namah om amritaya namah om pranaya namah om pranayamaparayanaya
    namah om viruddhahantre namah om viraghnaya namah om raktashyamagalaya namah om subrahmanyaya namah
    om guhaya namah om pritaya namah om brahmanyaya namah om brahmanapriyaya namah om vamshavriddhikaraya
    namah om vedaya namah om vedyaya namah om akshayaphalapradaya namah iti shrisubrahmanyashtottarashatanamavalih
    samapta
