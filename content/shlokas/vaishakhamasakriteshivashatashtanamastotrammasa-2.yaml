id: vaishakhamasakriteshivashatashtanamastotrammasa-2
category: stotram
name:
  english: vaishakhamasakriteshivashatashtanamastotrammasa 2
  devanagari: वैशाखमासकृतेशिवशताष्टनामस्तोत्रम्मास २
content:
  english: ringaya vrishabhaya kakudmate || 54|| bilmine bilvapujyaya vishakhasupriyaya ca | ugraya rudrarupaya
    dhanvane dhavate namah || 55|| jyotirgananam pataye grahadharaya te namah | atitaya bhavishyaya vartamanaya
    te namah || 56|| ajaraya namastubhyam tapase varadaya ca | suvarcase suviryaya smaragarvaharaya ca
    || 57|| varadaya varenyaya svarnavarnaya te namah | arnavantarnivasaya diptashuladharaya ca || 58||
    purushayaprameyaya aghorayordhvakeshine | jvalamalavritangaya bhujangabharanaya ca || 59|| namo vahyaya
    guhyaya svargaya narakaya ca | haraya parameshaya skanda goptre
  devanagari: ृङ्गाय वृषभाय ककुद्मते ॥ ५४॥ बिल्मिने बिल्वपूज्याय विशाखासुप्रियाय च । उग्राय रुद्ररूपाय
    धन्वने धावते नमः ॥ ५५॥ ज्योतिर्गणानां पतये ग्रहाधाराय ते नमः । अतीताय भविष्याय वर्तमानाय ते नमः ॥
    ५६॥ अजराय नमस्तुभ्यं तपसे वरदाय च । सुवर्चसे सुवीर्याय स्मरगर्वहराय च ॥ ५७॥ वरदाय वरेण्याय स्वर्णवर्णाय
    ते नमः । अर्णवान्तर्निवासाय दीप्तशूलधराय च ॥ ५८॥ पुरुषायाप्रमेयाय अघोरायोर्ध्वकेशिने । ज्वालामालावृताङ्गाय
    भुजङ्गाभरणाय च ॥ ५९॥ नमो वाह्याय गुह्याय स्वर्गाय नरकाय च । हराय परमेशाय स्कन्द गोप्त्रे
meaning: {}
