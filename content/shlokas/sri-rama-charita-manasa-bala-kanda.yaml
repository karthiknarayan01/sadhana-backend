    te sukriti mana mudita nahahim || rama tilaka hita mangala saja| paraba joga janu jure samaja || kai
    kumati keki keri| pari jasu phala bipati ghaneri || do samana amita utapata saba bharatacarita japajaga|
    kali agha khala avaguna kathana te jalamala baga kaga || || kirati sarita chahu~ ritu ruri| samaya
