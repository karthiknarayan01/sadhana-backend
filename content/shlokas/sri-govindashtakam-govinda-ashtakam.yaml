id: sri-govindashtakam-govinda-ashtakam
category: stotram
name:
  english: Sri Govindashtakam (Govinda Ashtakam)
content:
  english: satyam jnanamanantam nityamanakasham paramakasham goshthapranganarinkhanalolamanayasam paramayasam
    | mayakalpitananakaramanakaram bhuvanakaram kshmamanathamanatham pranamata govindam paramanandam ||
    || mritsnamatsiheti yashodatadanashaishavasantrasam vyaditavaktralokitalokalokacaturdashalokalim |
    lokatrayapuramulastambham lokalokamanalokam lokesham paramesham pranamata govindam paramanandam ||
    || traivishtaparipuviraghnam kshitibharaghnam bhavarogaghnam kaivalyam navanitaharamanaharam bhuvanaharam
    | vaimalyasphutacetovrittivisheshabhasamanabhasam shaivam kevalashantam pranamata govindam paramanandam
    || || gopalam prabhulilavigrahagopalam kulagopalam gopikhelanagovardhanadhritililalalitagopalam |
    gobhirnigaditagovindasphutanamanam bahunamanam godhigocaraduram pranamata govindam paramanandam ||
    || gopimandalagoshthibhedam bhedavasthamabhedabham shashvadgokhuranirdhutodgatadhulidhusarasaubhagyam
    | shraddhabhaktigrihitanandamacintyam cintitasadbhavam cintamanimahimanam pranamata govindam paramanandam
    || || snanavyakulayoshidvastramupadayagamuparudham vyaditsantiratha digvastra datumupakarshantam tah
    | nirdhutadvayashokavimoham buddham buddherantahstham sattamatrashariram pranamata govindam paramanandam
    || || kantam karanakaranamadimanadim kalaghanabhasam kalindigatakaliyashirasi sunrityantam muhuratyantam
    | kalam kalakalatitam kalitashesham kalidoshaghnam kalatrayagatihetum pranamata govindam paramanandam
    || || brindavanabhuvi brindarakaganabrindaradhitavandyayam kundabhamalamandasmerasudhanandam sumahanandam
    | vandyasheshamahamunimanasavandyanandapadadvandvam nandyasheshagunabdhim pranamata govindam paramanandam
    || || govindashtakametadadhite govindarpitaceta yo govindacyuta madhava vishno gokulanayaka krishneti
    | govindanghrisarojadhyanasudhajaladhautasamastagho govindam paramanandamritamantahstham sa tamabhyeti
    || || iti shrimatparamahamsaparivrajakacaryasya shrigovindabhagavatpujyapadashishyasya shrimacchankarabhagavatah
    kritau shri govindashtakam |
  devanagari: सत्यं ज्ञानमनन्तं नित्यमनाकाशं परमाकाशं गोष्ठप्राङ्गणरिङ्खणलोलमनायासं परमायासम् । मायाकल्पितनानाकारमनाकारं
    भुवनाकारं क्ष्मामानाथमनाथं प्रणमत गोविन्दं परमानन्दम् ॥ ॥ मृत्स्नामत्सीहेति यशोदाताडनशैशवसन्त्रासं
    व्यादितवक्त्रालोकितलोकालोकचतुर्दशलोकालिम् । लोकत्रयपुरमूलस्तम्भं लोकालोकमनालोकं लोकेशं परमेशं प्रणमत
    गोविन्दं परमानन्दम् ॥ ॥ त्रैविष्टपरिपुवीरघ्नं क्षितिभारघ्नं भवरोगघ्नं कैवल्यं नवनीताहारमनाहारं भुवनाहारम्
    । वैमल्यस्फुटचेतोवृत्तिविशेषाभासमनाभासं शैवं केवलशान्तं प्रणमत गोविन्दं परमानन्दम् ॥ ॥ गोपालं प्रभुलीलाविग्रहगोपालं
    कुलगोपालं गोपीखेलनगोवर्धनधृतिलीलालालितगोपालम् । गोभिर्निगदितगोविन्दस्फुटनामानं बहुनामानं गोधीगोचरदूरं
    प्रणमत गोविन्दं परमानन्दम् ॥ ॥ गोपीमण्डलगोष्ठीभेदं भेदावस्थमभेदाभं शश्वद्गोखुरनिर्धूतोद्गतधूलीधूसरसौभाग्यम्
    । श्रद्धाभक्तिगृहीतानन्दमचिन्त्यं चिन्तितसद्भावं चिन्तामणिमहिमानं प्रणमत गोविन्दं परमानन्दम् ॥ ॥ स्नानव्याकुलयोषिद्वस्त्रमुपादायागमुपारूढं
    व्यादित्सन्तीरथ दिग्वस्त्रा दातुमुपाकर्षन्तं ताः । निर्धूतद्वयशोकविमोहं बुद्धं बुद्धेरन्तःस्थं सत्तामात्रशरीरं
    प्रणमत गोविन्दं परमानन्दम् ॥ ॥ कान्तं कारणकारणमादिमनादिं कालघनाभासं कालिन्दीगतकालियशिरसि सुनृत्यन्तं
    मुहुरत्यन्तम् । कालं कालकलातीतं कलिताशेषं कलिदोषघ्नं कालत्रयगतिहेतुं प्रणमत गोविन्दं परमानन्दम् ॥
    ॥ बृन्दावनभुवि बृन्दारकगणबृन्दाराधितवन्द्यायां कुन्दाभामलमन्दस्मेरसुधानन्दं सुमहानन्दम् । वन्द्याशेषमहामुनिमानसवन्द्यानन्दपदद्वन्द्वं
    नन्द्याशेषगुणाब्धिं प्रणमत गोविन्दं परमानन्दम् ॥ ॥ गोविन्दाष्टकमेतदधीते गोविन्दार्पितचेता यो गोविन्दाच्युत
    माधव विष्णो गोकुलनायक कृष्णेति । गोविन्दाङ्घ्रिसरोजध्यानसुधाजलधौतसमस्ताघो गोविन्दं परमानन्दामृतमन्तःस्थं
    स तमभ्येति ॥ ॥ इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः
    कृतौ श्री गोविन्दाष्टकम् ।
