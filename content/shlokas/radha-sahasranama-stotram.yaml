id: radha-sahasranama-stotram
category: stotram
name:
  english: Radha Sahasranama Stotram
content:
  english: vande vrindavanananda radhika parameshvari | gopikam paramam shreshtham hladinim shaktirupinim
    || shriradham paramarajyam krishnasevaparayanam | shrikrishnanga sadadhyatri navadhabhaktikarini ||
    yesham gunamayi radha vrishabhanukumarika | damodarapriya radha manobhishtapradayini || tasya namasahasram
    tvam shrunu bhagavatottama || manasatantre anushtupchandase akaradi kshakarantani shriradhikasahasranamani
    || atha stotram om anantarupini radha aparagunasagara | adhyakshara adirupa anadirasheshvari || ||
    animadi siddhidatri adhidevi adhishvari | ashtasiddhipradadevi abhaya akhileshvari || || anangamanjaribhagna
    anangadarpanashini | anukampaprada radha aparadhapranashini || || antarvetri adhishthatri antaryami
    sanatani | amala abala bala atula ca anupama || || asheshagunasampanna antahkaranavasini | acyuta
    ramani adya angaragavidhayini || || aravindapadadvandva adhyaksha parameshvari | avanidharinidevi
    acintyadbhutarupini || || asheshagunasaraca ashokashokanashini | abhishtada amshamukhi akshayadbhutarupini
    || || avalamba adhishthatri akincanavaraprada | akhilanandini adya ayana krishnamohini || || avadhisarvashastranamapaduddharini
    shubha | ahladini adishaktirannada abhayapi ca || || annapurna ahodhanya atulya abhayaprada | indumukhi
    divyahasa ishtabhaktipradayini || || icchamayi iccharupa indira ishvari'para | ishtadayishvari maya
    ishtamantrasvarupini || || onkararupinidevi urvisarvajaneshvari | airavatavati pujya aparagunasagara
    || || krishnapranadhikaradha krishnapremavinodini | shrikrishnangasadadhyayi krishnanandapradayini
    || || krishna'hladinidevi krishnadhyanaparayana | krishnasammohininitya krishnanandapravardhini ||
    || krishnananda sadananda krishnakeli sukhasvada | krishnapriya krishnakanta krishnasevaparayana ||
    || krishnapremabdhisabhari krishnaprematarangini | krishnacittaharadevi kirtidakulapadmini || || krishnamukhi
    hasamukhi sadakrishnakutuhali | krishnanuragini dhanya kishori krishnavallabha || || krishnakama krishnavandya
    krishnabdhe sarvakamana | krishnapremamayi radha kalyani kamalanana ||| || krishnasunmadini kamya
    krishnalila shiromani | krishnasanjivani radha krishnavakshasthalasthita || || krishnapremasadonmatta
    krishnasangavilasini | shrikrishnaramaniradha krishnaprema'kalankini || || krishnapremavatikartri
    krishnabhaktiparayana | shrikrishnamahishi purna shrikrishnangapriyankari || || kamagatra kamarupa
    kalikalmashanashini | krishnasamyuktakameshi shrikrishnapriyavadini || || krishnashakti kancanabha
    krishnakrishnapriyasati | krishnapraneshvari dhira kamalakunjavasini || || krishnapranadhidevi ca
    kishoranandadayini | krishnaprasadhyamana ca krishnapremaparayana || || krishnavakshasthitadevi shrikrishnangasadavrata
    | kunjadhirajamahishi pujannupuraranjani || || karunyamritapadhodhi kalyani karunamayi | kundakusumadanta
    ca kasturibindubhih shubha || || kucakutamalasaundarya kripamayi kripakari | kunjaviharini gopi kundadamasushobhini
    || || komalangi kamalanghri kamala'kamalanana | kandarpadamanadevi kaumari navayauvana || || kunkumacarcitangi
    ca kesarimadhyamottama | kancanangi kurangakshi kanakangulidharini || || karunarnavasampurna krishnaprematarangini
    | kalpadrima kripadhyaksha krishnaseva parayana || || khanjanakshi khanipremna akhandita manakarini
    | golokadhamini radha gokulanandadayini || || govindavallabhadevi gopini gunasagara | gopalavallabha
    gopi gaurangi godhaneshvari || || gopali gopikashreshtha gopakanya ganeshvari | gajendragaminiganya
    gandharvakulapavani || || gunadhyaksha ganadhyaksha gavongati gunakara | gunagamya grihalakshmi gopyecudagramalika
    ||| || gangagitagatirdatri gayatri brahmarupini | gandhapushpadharadevi gandhamalyadidharini || ||
    govindapreyasi dhira govindabandhakarana | jnanadagunadagamya gopini gunashobhini || || godavari gunatita
    govardhanadhanapriya | gopini gokulendrani gopika gunashalini || || gandheshvari gunalamba gunangi
    gunapavani | gopalasya priyaradha kunjapunjaviharini || || gokulendumukhi vrinda gopalapranavallabha
    | gopanganapriyaradha gaurangi gauravanvita || || govatsadharinivatsa subalaveshadharini | girvanavandya
    girvani gopini ganashobhita || || ghanashyamapriyadhira ghorasamsaratarini | ghurnayamananayana ghorakalmashanashini
    || || caitanyarupinidevi cittacaitanyadayini | candranani candrakanti candrakotisamaprabha || || candravali
    shuklapaksha candraca krishnavallabha | candrarkanakharajyoti caruvenishikharucih || || candanaishcarcitangi
    ca caturacancalekshana | carugorocanagauri caturvargapradayini || || shrimaticaturadhyaksha caramagatidayini
    | caracareshvaridevi cintatita jaganmayi || || catuhshashtikalalamba campapushpavidharini | cinmayi
    citshaktirupa carcitangi manorama || || citralekhaca shriratri candrakantijitaprabha | caturapangamadhurya
    carucancalalocana || || chandomayi chandarupa chidrachandovinashini | jagatkartri jagaddhatri jagadadhararupini
    || || jayankari jaganmata jayadadiyakarini | jayapradajayalakshmi jayanti suyashaprada || || jambunada
    hemakanti jayavati yashasvini | jagahita jagatpujya janani lokapalini || || jagaddhatri jagatkartri
    jagadbijasvarupini | jaganmata yogamaya jivanam gatidayini || || jivakritiryogagamya yashodanandadayini
    | japakusumasankasha padabjamanimandita || || janudyutijitotphulla yantranavighnaghatini | jitendriya
    yajnarupa yajnangi jalashayini || || janakijanmashunyaca janmamrityujarahara | jahnavi yamunarupa
    jambunadasvarupini || || jhanatkritapadambhoja jadatarinivarini | tankarini mahadhyana divyavadyavinodini
    || || taptakancanavarnabha trailokyalokatarini | tilapushpajitanasa tulasimanjaripriya || || trailokya'karshini
    radha trivargaphaladayini | tulasitoshakartri ca krishnacandratapasvini || || tarunadityasankasha
    nakhashrenisamaprabha | trailokyamangaladevi digdhamulapadadvayi || radha tapatrayanivarini | trailokyasundari
    dhanya tantramantrasvarupini || || trikalajna tranakartri trailokyamangalasada | tejasvini tapomurti
    tapatrayavinashini || || trigunadharini devi tarini tridasheshvari | trayodashavayonitya taruninavayauvana
    || || hritpadmesthitimati sthanadatri padambuje | sthitirupa sthira shanta sthitasamsarapalini ||
    || damodarapriyadhira durvasovaradayini | dayamayi dayadhyaksha divyayogapradarshini || || divyanulepanaraga
    divyalankarabhushana | durgatinashini radha durga duhkhavinashini || || devadevimahadevi dayashila
    dayavati | dayardrasagararadha mahadaridryanashini || || devatanam duraradhya mahapapavinashini |
    dvarakavasini devi duhkhashokavinashini || || dayavati dvarakesha dolotsavaviharini | danta shanta
    kripadhyaksha dakshinayajnakarini || || dinabandhupriyadevi shubha durghatanashini | dhvajavajrabjapashanghri
    dhimahicaranambuja || || dharmatita dharadhyaksha dhanadhanyapradayini | dharmadhyaksha dhyanagamya
    dharanibharanashini || || dharmadadhairyadadhatri dhanyadhanyadhurandhari | dharanidharinidhanya dharmasankatarakshini
    || || dharmadhikarinidevi dharmashastravisharada | dharmasamsthapanadhagra dhruvanandapradayini ||
    || navagorocana gauri nilavastravidharini | navayauvanasampanna nandanandanakarini || || nityanandamayi
    nitya nilakantamanipriya | nanaratnavicitrangi nanasukhamayisudha || || nigudharasarasajna nityanandapradayini
    | navinapravanadhanya nilapadmavidharini || || nanda'nanda sadananda nirmala muktidayini | nirvikara
    nityarupa nishkalanka niramaya || || nalini nalinakshi ca nanalankarabhushita | nitambini nirakanksha
    nitya satya sanatani || || nilambaraparidhana nilakamalalocana | nirapeksha nirupama narayani nareshvari
    || || niralamba rakshakartri nigamarthapradayini | nikunjavasini radha nirgunagunasagara || || nilabja
    krishnamahishi nirashrayagatiprada | nidhuvanavanananda nikunjashi ca nagari || || niranjana nityarakta
    nagari cittamohini | purnacandramukhi devi pradhanaprakritipara || || premarupa premamayi praphullajalajanana
    | purnanandamayi radha purnabrahmasanatani || || paramarthaprada pujya paresha padmalocana | parashakti
    parabhakti paramanandadayini || || patitoddharini punya pravina dharmapavani | pankajakshi mahalakshmi
    pinonnatapayodhara || || premashruparipurnangi padmelasadrishanana | padmaragadharadevi paurnamasisukhasvada
    || || purnottamo paranjyoti priyankari priyamvada | premabhaktiprada radha premanandapradayini ||
    || padmagandha padmahasta padmanghri padmamalini | padmasana mahapadma padmamala || prabodhini purnalakshmi
    purnendusadrishanana | pundarikakshapremangi pundarikaksharohini || || paramarthapradapadma tatha
    pranavarupini | phalapriya sphurtidatri mahotsavaviharini || || phullabjadivyanayana phanivenisushobhita
    | vrindavaneshvari radha vrindavanavilasini || || vrishabhanusutadevi vrajavasiganapriya | vrinda
    vrindavanananda vrajendra ca varaprada || || vidyutgauri suvarnangi vamshinadavinodini | vrishabhanuradhekanya
    vrajarajasutapriya || || vicitrapattacamari vicitrambaradharini | venuvadyapriyaradha venuvadyaparayana
    || || vishvambhari vicitrangi brahmandodarikasati | vishvodari vishalakshi vrajalakshmi varaprada
    || || brahmamayi brahmarupa vedangi varshabhanavi | varangana karambhoja vallavi vrijamohini || ||
    vishnupriya vishvamata brahmandapratipalini | vishveshvari vishvakartri vedyamantrasvarupini || ||
    vishvamaya vishnukanta vishvangi vishvapavani | vrajeshvari vishvarupa vaishnavi vighnanashini ||
    radha vatsala vrajavatsala | varada vakyasiddha ca buddhida vakpradayini || || vishakhapranasarvasva
    vrishabhanukumarika | vishakhasakhyavijita vamshivataviharini || || vedamata vedagamya vedyavarna
    shubhankari | vedatita gunatita vidagdha vijanapriya || radha bhaktamangaladayini | bhagavanmohini
    devi bhavakleshavinashini || || bhavini bhavati bhavya bharati bhaktidayini | bhagirathi bhagyavati
    bhuteshi bhavakarini || || bhavarnavatranakartri bhadrada bhuvaneshvari | bhaktatma bhuvanananda bhavika
    bhaktavatsala || radha shubha bhujamrinalika | bhanushakticchaladhira bhaktanugrahakarini || || madhavi
    madhavayukta mukundadyasanatani | mahalakshmi mahamanya madhavasvantamohini || || mahadhanya mahapunya
    mahamohavinashini | mokshada manada bhadra mangala'mangalatpada || || manobhishtapradadevi mahavishnusvarupini
    | madhavyangi manorama ramya mukuraranjani || || manisha vanadadhara muralivadanapriya | mukundangakritapangi
    malini harimohini || || managrahi madhuvati manjari mrigalocana | nityavrinda mahadevi mahendrakritashekhari
    || || mukundapranadahantri manoharamanohara | madhavamukhapadmasya mathupanamadhuvrata || || mukundamadhumadhurya
    mukhyavrindavaneshvari | mantrasiddhikrita radha mulamantrasvarupini || || manmatha sumatidhatri manojnamatimanita
    | madanamohinimanya manjiracaranotpala || || yashodasutapatni ca yashodanandadayini | yauvanapurnasaundarya
    yamunatatavasini || || yashasvini yogamaya yuvarajavilasini | yugmashriphalasuvatsa yugmangadavidharini
    || || yantratigananirata yuvatinamshiromani | shriradha paramaradhya radhika krishnamohini || || rupayauvanasampanna
    rasamandalakarini | radhadevi paraprapta shriradhaparameshvari || || radhavagmi rasonmadi rasika rasashekhari
    | radharasamayipurna rasajna rasamanjari || || radhika rasadatri ca radharasavilasini | ranjani rasavrindaca
    ratnalankaradharini || || ramaratnaratnamayi ratnamalavidharini | ramaniramaniramya radhikaramanipara
    || || rasamandalamadhyastha rajarajeshvari shubha | rakendukotisaundarya ratnangadavidharini || ||
    rasapriya rasagamya rasotsavaviharini | lakshmirupa ca lalana lalitadisakhipriya || || lokamata lokadhatri
    lokanugrahakarini | lolakshi lalitangi ca lalitajivataraka || || lokalaya lajjarupa lasyavidyalatashubha
    | lalitapremalalitanugdhapremalilavati || || lilalavanyasampanna nagaricittamohini | lilarangirati
    ramya lilaganaparayana || || lilavati ratiprita lalitakulapadmini | shuddhakancanagaurangi shankhakankanadharini
    || || shaktisancarini devi shaktinam shaktidayini | sucarukabariyukta shashirekha shubhankari || ||
    sumati sugatirdatri shrimati shriharipiya | sundarangi suvarnangi sushila shubhadayini || || shubhada
    sukhada sadhvi sukeshi sumanorama | sureshvari sukumari shubhangi sumashekhara || || shakambhari satyarupa
    shasta shanta manorama | siddhidhatri mahashanti sundari shubhadayini || || shabdatita sindhukanya
    sharanagatapalini | shalagramapriya radha sarvada navayauvana || || subalanandinidevi sarvashastravisharada
    | sarvangasundari radha sarvasallakshananvita || || sarvagopipradhana ca sarvakamaphalaprada | sadanandamayidevi
    sarvamangaladayini || || sarvamandalajivatu sarvasampatpradayini | samsaraparakarani sadakrishnakutuhala
    || radha sadhya sarvagunanvita | satyasvarupa satya ca satyanitya sanatani || || sarvamadhavyalahari
    sudhamukhashubhankari | sadakishorikagoshthi subalaveshadharini || radha shyamasundaramohini | shyamamritarasemagna
    sadasimantinisakhi || || shodashivayasanitya shadaragaviharini | hemangivaradahantri bhumata hamsagamini
    || || hasamukhi vrajadhyaksha hemabja krishnamohini | harivinodini radha harisevaparayana || || hemarambha
    madarambha hariharavilocana | hemangavarnaramya shreshahritpadmavasini || || haripadabjamadhupa madhupanamadhuvrata
    | kshemankari kshinamadhya kshamarupa kshamavati || || kshetrangi shrikshamadatri kshitivrindavaneshvari
    | kshamashila kshamadatri kshaumavasovidharini | kshantinamavayavati kshirodarnavashayini || || radhanamasahasrani
    pathedva shrunuyadapi | ishtasiddhirbhavettasya mantrasiddhirbhavet dhruvam || || dharmarthakamamokshamshca
    labhate natra samshayah | vanchasiddhirbhavettasya bhaktisyat premalakshana || || lakshmistasyavasetgehe
    mukhebhatisarasvati | antakalebhavettasya radhakrishnecasamsthitih || || iti shriradhamanasatantre
    shriradhasahasranamastotram sampurnam ||
  devanagari: वन्दे वृन्दावनानन्दा राधिका परमेश्वरी । गोपिकां परमां श्रेष्ठां ह्लादिनीं शक्तिरूपिणीम्
    ॥ श्रीराधां परमाराज्यां कृष्णसेवापरायणाम् । श्रीकृष्णाङ्ग सदाध्यात्री नवधाभक्तिकारिणी ॥ येषां गुणमयी
    राधा वृषभानुकुमारिका । दामोदरप्रिया राधा मनोभीष्टप्रदायिनी ॥ तस्या नामसहस्रं त्वं श्रुणु भागवतोत्तमा
    ॥ मानसतन्त्रे अनुष्टुप्छन्दसे अकारादि क्षकारान्तानि श्रीराधिकासहस्रनामानि ॥ अथ स्तोत्रम् ॐ अनन्तरूपिणी
    राधा अपारगुणसागरा । अध्यक्षरा आदिरूपा अनादिराशेश्वरी ॥ ॥ अणिमादि सिद्धिदात्री अधिदेवी अधीश्वरी । अष्टसिद्धिप्रदादेवी
    अभया अखिलेश्वरी ॥ ॥ अनङ्गमञ्जरीभग्ना अनङ्गदर्पनाशिनी । अनुकम्पाप्रदा राधा अपराधप्रणाशिनी ॥ ॥ अन्तर्वेत्री
    अधिष्ठात्री अन्तर्यामी सनातनी । अमला अबला बाला अतुला च अनूपमा ॥ ॥ अशेषगुणसम्पन्ना अन्तःकरणवासिनी ।
    अच्युता रमणी आद्या अङ्गरागविधायिनी ॥ ॥ अरविन्दपदद्वन्द्वा अध्यक्षा परमेश्वरी । अवनीधारिणीदेवी अचिन्त्याद्भुतरूपिणी
    ॥ ॥ अशेषगुणसाराच अशोकाशोकनाशिनी । अभीष्टदा अंशमुखी अक्षयाद्भुतरूपिणी ॥ ॥ अवलम्बा अधिष्ठात्री अकिञ्चनवरप्रदा
    । अखिलानन्दिनी आद्या अयाना कृष्णमोहिनी ॥ ॥ अवधीसर्वशास्त्राणामापदुद्धारिणी शुभा । आह्लादिनी आदिशक्तिरन्नदा
    अभयापि च ॥ ॥ अन्नपूर्णा अहोधन्या अतुल्या अभयप्रदा । इन्दुमुखी दिव्यहासा इष्टभक्तिप्रदायिनी ॥ ॥ इच्छामयी
    इच्छारूपा इन्दिरा ईश्वरीऽपरा । इष्टदायीश्वरी माया इष्टमन्त्रस्वरूपिणी ॥ ॥ ओङ्काररूपिणीदेवी उर्वीसर्वजनेश्वरी
    । ऐरावतवती पूज्या अपारगुणसागरा ॥ ॥ कृष्णप्राणाधिकाराधा कृष्णप्रेमविनोदिनी । श्रीकृष्णाङ्गसदाध्यायी
    कृष्णानन्दप्रदायिनी ॥ ॥ कृष्णाऽह्लादिनीदेवी कृष्णध्यानपरायणा । कृष्णसम्मोहिनीनित्या कृष्णानन्दप्रवर्धिनी
    ॥ ॥ कृष्णानन्दा सदानन्दा कृष्णकेलि सुखास्वदा । कृष्णप्रिया कृष्णकान्ता कृष्णसेवापरायणा ॥ ॥ कृष्णप्रेमाब्धिसभरी
    कृष्णप्रेमतरङ्गिणी । कृष्णचित्तहरादेवी कीर्तिदाकुलपद्मिनी ॥ ॥ कृष्णमुखी हासमुखी सदाकृष्णकुतूहली ।
    कृष्णानुरागिणी धन्या किशोरी कृष्णवल्लभा ॥ ॥ कृष्णकामा कृष्णवन्द्या कृष्णाब्धे सर्वकामना । कृष्णप्रेममयी
    राधा कल्याणी कमलानना ॥। ॥ कृष्णसून्मादिनी काम्या कृष्णलीला शिरोमणी । कृष्णसञ्जीवनी राधा कृष्णवक्षस्थलस्थिता
    ॥ ॥ कृष्णप्रेमसदोन्मत्ता कृष्णसङ्गविलासिनी । श्रीकृष्णरमणीराधा कृष्णप्रेमाऽकलङ्किणी ॥ ॥ कृष्णप्रेमवतीकर्त्री
    कृष्णभक्तिपरायणा । श्रीकृष्णमहिषी पूर्णा श्रीकृष्णाङ्गप्रियङ्करी ॥ ॥ कामगात्रा कामरूपा कलिकल्मषनाशिनी
    । कृष्णसंयुक्तकामेशी श्रीकृष्णप्रियवादिनी ॥ ॥ कृष्णशक्ति काञ्चनाभा कृष्णाकृष्णप्रियासती । कृष्णप्राणेश्वरी
    धीरा कमलाकुञ्जवासिनी ॥ ॥ कृष्णप्राणाधिदेवी च किशोरानन्ददायिनी । कृष्णप्रसाध्यमाना च कृष्णप्रेमपरायणा
    ॥ ॥ कृष्णवक्षस्थितादेवी श्रीकृष्णाङ्गसदाव्रता । कुञ्जाधिराजमहिषी पूजन्नूपुररञ्जनी ॥ ॥ कारुण्यामृतपाधोधी
    कल्याणी करुणामयी । कुन्दकुसुमदन्ता च कस्तूरिबिन्दुभिः शुभा ॥ ॥ कुचकुटमलसौन्दर्या कृपामयी कृपाकरी ।
    कुञ्जविहारिणी गोपी कुन्ददामसुशोभिनी ॥ ॥ कोमलाङ्गी कमलाङ्घ्री कमलाऽकमलानना । कन्दर्पदमनादेवी कौमारी
    नवयौवना ॥ ॥ कुङ्कुमाचर्चिताङ्गी च केसरीमध्यमोत्तमा । काञ्चनाङ्गी कुरङ्गाक्षी कनकाङ्गुलिधारिणी ॥ ॥
    करुणार्णवसम्पूर्णा कृष्णप्रेमतरङ्गिणी । कल्पदृमा कृपाध्यक्षा कृष्णसेवा परायणा ॥ ॥ खञ्जनाक्षी खनीप्रेम्णा
    अखण्डिता मानकारिणी । गोलोकधामिनी राधा गोकुलानन्ददायिनी ॥ ॥ गोविन्दवल्लभादेवी गोपिनी गुणसागरा । गोपालवल्लभा
    गोपी गौराङ्गी गोधनेश्वरी ॥ ॥ गोपाली गोपिकाश्रेष्ठा गोपकन्या गणेश्वरी । गजेन्द्रगामिनीगन्या गन्धर्वकुलपावनी
    ॥ ॥ गुणाध्यक्षा गणाध्यक्षा गवोन्गती गुणाकरा । गुणगम्या गृहलक्ष्मी गोप्येचूडाग्रमालिका ॥। ॥ गङ्गागीतागतिर्दात्री
    गायत्री ब्रह्मरूपिणी । गन्धपुष्पधरादेवी गन्धमाल्यादिधारिणी ॥ ॥ गोविन्दप्रेयसी धीरा गोविन्दबन्धकारणा
    । ज्ञानदागुणदागम्या गोपिनी गुणशोभिनी ॥ ॥ गोदावरी गुणातीता गोवर्धनधनप्रिया । गोपिनी गोकुलेन्द्राणी
    गोपिका गुणशालिनी ॥ ॥ गन्धेश्वरी गुणालम्बा गुणाङ्गी गुणपावनी । गोपालस्य प्रियाराधा कुञ्जपुञ्जविहारिणी
    ॥ ॥ गोकुलेन्दुमुखी वृन्दा गोपालप्राणवल्लभा । गोपाङ्गनाप्रियाराधा गौराङ्गी गौरवान्विता ॥ ॥ गोवत्सधारिणीवत्सा
    सुबलावेशधारिणी । गीर्वाणवन्द्या गीर्वाणी गोपिनी गणशोभिता ॥ ॥ घनश्यामप्रियाधीरा घोरसंसारतारिणी । घूर्णायमाननयना
    घोरकल्मषनाशिनी ॥ ॥ चैतन्यरूपिणीदेवी चित्तचैतन्यदायिनी । चन्द्राननी चन्द्रकान्ती चन्द्रकोटिसमप्रभा
    ॥ ॥ चन्द्रावली शुक्लपक्षा चन्द्राच कृष्णवल्लभा । चन्द्रार्कनखरज्योती चारुवेणीशिखारुचिः ॥ ॥ चन्दनैश्चर्चिताङ्गी
    च चतुराचञ्चलेक्षणा । चारुगोरोचनागौरी चतुर्वर्गप्रदायिनी ॥ ॥ श्रीमतीचतुराध्यक्षा चरमागतिदायिनी । चराचरेश्वरीदेवी
    चिन्तातीता जगन्मयी ॥ ॥ चतुःषष्टिकलालम्बा चम्पापुष्पविधारिणी । चिन्मयी चित्शक्तिरूपा चर्चिताङ्गी मनोरमा
    ॥ ॥ चित्रलेखाच श्रीरात्री चन्द्रकान्तिजितप्रभा । चतुरापाङ्गमाधुर्या चारुचञ्चललोचना ॥ ॥ छन्दोमयी छन्दरूपा
    छिद्रछन्दोविनाशिनी । जगत्कर्त्री जगद्धात्री जगदाधाररूपिणी ॥ ॥ जयङ्करी जगन्माता जयदादियकारिणी । जयप्रदाजयालक्ष्मी
    जयन्ती सुयशप्रदा ॥ ॥ जाम्बूनदा हेमकान्ती जयावती यशस्विनी । जगहिता जगत्पूज्या जननी लोकपालिनी ॥ ॥ जगद्धात्री
    जगत्कर्त्री जगद्बीजस्वरूपिणी । जगन्माता योगमाया जीवानां गतिदायिनी ॥ ॥ जीवाकृतिर्योगगम्या यशोदानन्ददायिनी
    । जपाकुसुमसङ्काशा पादाब्जामणिमण्डिता ॥ ॥ जानुद्युतिजितोत्फुल्ला यन्त्रणाविघ्नघातिनी । जितेन्द्रिया
    यज्ञरूपा यज्ञाङ्गी जलशायिनी ॥ ॥ जानकीजन्मशून्याच जन्ममृत्युजराहरा । जाह्नवी यमुनारूपा जाम्बूनदस्वरूपिणी
    ॥ ॥ झणत्कृतपदाम्भोजा जडतारिनिवारिणी । टङ्कारिणी महाध्याना दिव्यवाद्यविनोदिनी ॥ ॥ तप्तकाञ्चनवर्णाभा
    त्रैलोक्यलोकतारिणी । तिलपुष्पजितानासा तुलसीमञ्जरीप्रिया ॥ ॥ त्रैलोक्याऽकर्षिणी राधा त्रिवर्गफलदायिनी
    । तुलसीतोषकर्त्री च कृष्णचन्द्रतपस्विनी ॥ ॥ तरुणादित्यसङ्काशा नखश्रेणिसमप्रभा । त्रैलोक्यमङ्गलादेवी
    दिग्धमूलपदद्वयी ॥ राधा तापत्रयनिवारिणी । त्रैलोक्यसुन्दरी धन्या तन्त्रमन्त्रस्वरूपिणी ॥ ॥ त्रिकालज्ञा
    त्राणकर्त्री त्रैलोक्यमङ्गलासदा । तेजस्विनी तपोमूर्ती तापत्रयविनाशिनी ॥ ॥ त्रिगुणाधारिणी देवी तारिणी
    त्रिदशेश्वरी । त्रयोदशवयोनित्या तरुणीनवयौवना ॥ ॥ हृत्पद्मेस्थितिमति स्थानदात्री पदाम्बुजे । स्थितिरूपा
    स्थिरा शान्ता स्थितसंसारपालिनी ॥ ॥ दामोदरप्रियाधीरा दुर्वासोवरदायिनी । दयामयी दयाध्यक्षा दिव्ययोगप्रदर्शिनी
    ॥ ॥ दिव्यानुलेपनारागा दिव्यालङ्कारभूषणा । दुर्गतिनाशिनी राधा दुर्गा दुःखविनाशिनी ॥ ॥ देवदेवीमहादेवी
    दयाशीला दयावती । दयार्द्रसागराराधा महादारिद्र्यनाशिनी ॥ ॥ देवतानां दुराराध्या महापापविनाशिनी । द्वारकावासिनी
    देवी दुःखशोकविनाशिनी ॥ ॥ दयावती द्वारकेशा दोलोत्सवविहारिणी । दान्ता शान्ता कृपाध्यक्षा दक्षिणायज्ञकारिणी
    ॥ ॥ दीनबन्धुप्रियादेवी शुभा दुर्घटनाशिनी । ध्वजवज्राब्जपाशाङ्घ्री धीमहीचरणाम्बुजा ॥ ॥ धर्मातीता धराध्यक्षा
    धनधान्यप्रदायिनी । धर्माध्यक्षा ध्यानगम्या धरणीभारनाशिनी ॥ ॥ धर्मदाधैर्यदाधात्री धन्यधन्यधुरन्धरी
    । धरणीधारिणीधन्या धर्मसङ्कटरक्षिणी ॥ ॥ धर्माधिकारिणीदेवी धर्मशास्त्रविशारदा । धर्मसंस्थापनाधाग्रा
    ध्रुवानन्दप्रदायिनी ॥ ॥ नवगोरोचना गौरी नीलवस्त्रविधारिणी । नवयौवनसम्पन्ना नन्दनन्दनकारिणी ॥ ॥ नित्यानन्दमयी
    नित्या नीलकान्तमणिप्रिया । नानारत्नविचित्राङ्गी नानासुखमयीसुधा ॥ ॥ निगूढरसरासज्ञा नित्यानन्दप्रदायिनी
    । नवीनप्रवणाधन्या नीलपद्मविधारिणी ॥ ॥ नन्दाऽनन्दा सदानन्दा निर्मला मुक्तिदायिनी । निर्विकारा नित्यरूपा
    निष्कलङ्का निरामया ॥ ॥ नलिनी नलिनाक्षी च नानालङ्कारभूषिता । नितम्बिनि निराकाङ्क्षा नित्या सत्या सनातनी
    ॥ ॥ नीलाम्बरपरीधाना नीलाकमललोचना । निरपेक्षा निरूपमा नारायणी नरेश्वरी ॥ ॥ निरालम्बा रक्षकर्त्री निगमार्थप्रदायिनी
    । निकुञ्जवासिनी राधा निर्गुणागुणसागरा ॥ ॥ नीलाब्जा कृष्णमहिषी निराश्रयगतिप्रदा । निधूवनवनानन्दा निकुञ्जशी
    च नागरी ॥ ॥ निरञ्जना नित्यरक्ता नागरी चित्तमोहिनी । पूर्णचन्द्रमुखी देवी प्रधानाप्रकृतिपरा ॥ ॥ प्रेमरूपा
    प्रेममयी प्रफुल्लजलजानना । पूर्णानन्दमयी राधा पूर्णब्रह्मसनातनी ॥ ॥ परमार्थप्रदा पूज्या परेशा पद्मलोचना
    । पराशक्ति पराभक्ति परमानन्ददायिनी ॥ ॥ पतितोद्धारिणी पुण्या प्रवीणा धर्मपावनी । पङ्कजाक्षी महालक्ष्मी
    पीनोन्नतपयोधरा ॥ ॥ प्रेमाश्रुपरिपूर्णाङ्गी पद्मेलसदृषानना । पद्मरागधरादेवी पौर्णमासीसुखास्वदा ॥ ॥
    पूर्णोत्तमो परञ्ज्योती प्रियङ्करी प्रियंवदा । प्रेमभक्तिप्रदा राधा प्रेमानन्दप्रदायिनी ॥ ॥ पद्मगन्धा
    पद्महस्ता पद्माङ्घ्री पद्ममालिनी । पद्मासना महापद्मा पद्ममाला ॥ प्रबोधिनी पूर्णलक्ष्मी पूर्णेन्दुसदृषानना
    । पुण्डरीकाक्षप्रेमाङ्गी पुण्डरीकाक्षरोहिनी ॥ ॥ परमार्थप्रदापद्मा तथा प्रणवरूपिणी । फलप्रिया स्फूर्तिदात्री
    महोत्सवविहारिणी ॥ ॥ फुल्लाब्जदिव्यनयना फणिवेणिसुशोभिता । वृन्दावनेश्वरी राधा वृन्दावनविलासिनी ॥ ॥
    वृषभानुसुतादेवी व्रजवासीगणप्रिया । वृन्दा वृन्दावनानन्दा व्रजेन्द्रा च वरप्रदा ॥ ॥ विद्युत्गौरी सुवर्णाङ्गी
    वंशीनादविनोदिनी । वृषभानुराधेकन्या व्रजराजसुतप्रिया ॥ ॥ विचित्रपट्टचमरी विचित्राम्बरधारिणी । वेणुवाद्यप्रियाराधा
    वेणुवाद्यपरायणा ॥ ॥ विश्वम्भरी विचित्राङ्गी ब्रह्माण्डोदरीकासती । विश्वोदरी विशालाक्षी व्रजलक्ष्मी
    वरप्रदा ॥ ॥ ब्रह्ममयी ब्रह्मरूपा वेदाङ्गी वार्षभानवी । वराङ्गना कराम्भोजा वल्लवी वृजमोहिनी ॥ ॥ विष्णुप्रिया
    विश्वमाता ब्रह्माण्डप्रतिपालिनी । विश्वेश्वरी विश्वकर्त्री वेद्यमन्त्रस्वरूपिणी ॥ ॥ विश्वमाया विष्णुकान्ता
    विश्वाङ्गी विश्वपावनी । व्रजेश्वरी विश्वरूपा वैष्णवी विघ्ननाशिनी ॥ राधा वत्सला व्रजवत्सला । वरदा वाक्यसिद्धा
    च बुद्धिदा वाक्प्रदायिनी ॥ ॥ विशाखाप्राणसर्वस्वा वृषभानुकुमारिका । विशाखासख्यविजिता वंशीवटविहारिणी
    ॥ ॥ वेदमाता वेदगम्या वेद्यवर्णा शुभङ्करी । वेदातीता गुणातीता विदग्धा विजनप्रिया ॥ राधा भक्तमङ्गलदायिनी
    । भगवन्मोहिनी देवी भवक्लेशविनाशिनी ॥ ॥ भाविनी भवती भाव्या भारती भक्तिदायिनी । भागीरथी भाग्यवती भूतेशी
    भवकारिणी ॥ ॥ भवार्णवत्राणकर्त्री भद्रदा भुवनेश्वरी । भक्तात्मा भुवनानन्दा भाविका भक्तवत्सला ॥ राधा
    शुभा भुजमृणालिका । भानुशक्तिच्छलाधीरा भक्तानुग्रहकारिणी ॥ ॥ माधवी माधवायुक्ता मुकुन्दाद्यासनातनी ।
    महालक्ष्मी महामान्या माधवस्वान्तमोहिनी ॥ ॥ महाधन्या महापुण्या महामोहविनाशिनी । मोक्षदा मानदा भद्रा
    मङ्गलाऽमङ्गलात्पदा ॥ ॥ मनोभीष्टप्रदादेवी महाविष्णुस्वरूपिणी । माधव्याङ्गी मनोरामा रम्या मुकुररञ्जनी
    ॥ ॥ मनीशा वनदाधारा मुरलीवादनप्रिया । मुकुन्दाङ्गकृतापाङ्गी मालिनी हरिमोहिनी ॥ ॥ मानग्राही मधुवती मञ्जरी
    मृगलोचना । नित्यवृन्दा महादेवी महेन्द्रकृतशेखरी ॥ ॥ मुकुन्दप्राणदाहन्त्री मनोहरमनोहरा । माधवमुखपद्मस्या
    मथुपानमधुव्रता ॥ ॥ मुकुन्दमधुमाधुर्या मुख्यावृन्दावनेश्वरी । मन्त्रसिद्धिकृता राधा मूलमन्त्रस्वरूपिणी
    ॥ ॥ मन्मथा सुमतीधात्री मनोज्ञमतिमानिता । मदनामोहिनीमान्या मञ्जीरचरणोत्पला ॥ ॥ यशोदासुतपत्नी च यशोदानन्ददायिनी
    । यौवनापूर्णसौन्दर्या यमुनातटवासिनी ॥ ॥ यशस्विनी योगमाया युवराजविलासिनी । युग्मश्रीफलसुवत्सा युग्माङ्गदविधारिणी
    ॥ ॥ यन्त्रातिगाननिरता युवतीनांशिरोमणी । श्रीराधा परमाराध्या राधिका कृष्णमोहिनी ॥ ॥ रूपयौवनसम्पन्ना
    रासमण्डलकारिणी । राधादेवी पराप्राप्ता श्रीराधापरमेश्वरी ॥ ॥ राधावाग्मी रसोन्मादी रसिका रसशेखरी । राधारासमयीपूर्णा
    रसज्ञा रसमञ्जरी ॥ ॥ राधिका रसदात्री च राधारासविलासिनी । रञ्जनी रसवृन्दाच रत्नालङ्कारधारिणी ॥ ॥ रामारत्नारत्नमयी
    रत्नमालाविधारिणी । रमणीरामणीरम्या राधिकारमणीपरा ॥ ॥ रासमण्डलमध्यस्था राजराजेश्वरी शुभा । राकेन्दुकोटिसौन्दर्या
    रत्नाङ्गदविधारिणी ॥ ॥ रासप्रिया रासगम्या रासोत्सवविहारिणी । लक्ष्मीरूपा च ललना ललितादिसखिप्रिया ॥
    ॥ लोकमाता लोकधात्री लोकानुग्रहकारिणी । लोलाक्षी ललिताङ्गी च ललिताजीवतारका ॥ ॥ लोकालया लज्जारूपा लास्यविद्यालताशुभा
    । ललिताप्रेमललितानुग्धप्रेमलिलावती ॥ ॥ लीलालावण्यसम्पन्ना नागरीचित्तमोहिनी । लीलारङ्गीरती रम्या लीलागानपरायणा
    ॥ ॥ लीलावती रतिप्रीता ललिताकुलपद्मिनी । शुद्धकाञ्चनगौराङ्गी शङ्खकङ्कणधारिणी ॥ ॥ शक्तिसञ्चारिणी देवी
    शक्तीनां शक्तिदायिनी । सुचारुकबरीयुक्ता शशिरेखा शुभङ्करी ॥ ॥ सुमती सुगतिर्दात्री श्रीमती श्रीहरिपिया
    । सुन्दराङ्गी सुवर्णाङ्गी सुशीला शुभदायिनी ॥ ॥ शुभदा सुखदा साध्वी सुकेशी सुमनोरमा । सुरेश्वरी सुकुमारी
    शुभाङ्गी सुमशेखरा ॥ ॥ शाकम्भरी सत्यरूपा शस्ता शान्ता मनोरमा । सिद्धिधात्री महाशान्ती सुन्दरी शुभदायिनी
    ॥ ॥ शब्दातीता सिन्धुकन्या शरणागतपालिनी । शालग्रामप्रिया राधा सर्वदा नवयौवना ॥ ॥ सुबलानन्दिनीदेवी सर्वशास्त्रविशारदा
    । सर्वाङ्गसुन्दरी राधा सर्वसल्लक्षणान्विता ॥ ॥ सर्वगोपीप्रधाना च सर्वकामफलप्रदा । सदानन्दमयीदेवी सर्वमङ्गलदायिनी
    ॥ ॥ सर्वमण्डलजीवातु सर्वसम्पत्प्रदायिनी । संसारपारकरणी सदाकृष्णकुतूहला ॥ राधा साध्या सर्वगुणान्विता
    । सत्यस्वरूपा सत्या च सत्यनित्या सनातनी ॥ ॥ सर्वमाधव्यलहरी सुधामुखशुभङ्करी । सदाकिशोरिकागोष्ठी सुबलावेशधारिणी
    ॥ राधा श्यामसुन्दरमोहिनी । श्यामामृतरसेमग्ना सदासीमन्तिनीसखी ॥ ॥ षोडशीवयसानित्या षडरागविहारिणी । हेमाङ्गीवरदाहन्त्री
    भूमाता हंसगामिनी ॥ ॥ हासमुखी व्रजाध्यक्षा हेमाब्जा कृष्णमोहिनी । हरिविनोदिनी राधा हरिसेवापरायणा ॥
    ॥ हेमारम्भा मदारम्भा हरिहारविलोचना । हेमाङ्गवर्णारम्या श्रेषहृत्पद्मवासिनी ॥ ॥ हरिपादाब्जमधुपा मधुपानमधुव्रता
    । क्षेमङ्करी क्षीणमध्या क्षमारूपा क्षमावती ॥ ॥ क्षेत्राङ्गी श्रीक्षमादात्री क्षितिवृन्दावनेश्वरी ।
    क्षमाशीला क्षमादात्री क्षौमवासोविधारिणी । क्षान्तिनामावयवती क्षीरोदार्णवशायिनी ॥ ॥ राधानामसहस्राणि
    पठेद्वा श्रुणुयादपि । इष्टसिद्धिर्भवेत्तस्या मन्त्रसिद्धिर्भवेत् ध्रुवम् ॥ ॥ धर्मार्थकाममोक्षांश्च
    लभते नात्र संशयः । वाञ्छासिद्धिर्भवेत्तस्य भक्तिस्यात् प्रेमलक्षण ॥ ॥ लक्ष्मीस्तस्यवसेत्गेहे मुखेभातिसरस्वती
    । अन्तकालेभवेत्तस्य राधाकृष्णेचसंस्थितिः ॥ ॥ इति श्रीराधामानसतन्त्रे श्रीराधासहस्रनामस्तोत्रं सम्पूर्णम्
    ॥
