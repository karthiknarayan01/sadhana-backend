id: sri-raja-rajeswari-ashtakam
category: stotram
name:
  english: Sri Raja Rajeswari Ashtakam
content:
  english: amba shambhavi candramaulirabala'parna uma parvati kali haimavati shiva trinayani katyayani
    bhairavi savitri navayauvana shubhakari samrajyalakshmiprada cidrupi paradevata bhagavati shrirajarajeshvari
    || || amba mohini devata tribhuvani anandasandayini vani pallavapani venumuraliganapriya lolini kalyani
    udurajabimbavadana dhumrakshasamharini cidrupi paradevata bhagavati shrirajarajeshvari || || amba
    nupuraratnakankanadhari keyuraharavali jaticampakavaijayantilahari graiveyakairajita vinavenuvinodamanditakara
    virasanesamsthita cidrupi paradevata bhagavati shrirajarajeshvari || || amba raudrini bhadrakali bagala
    jvalamukhi vaishnavi brahmani tripurantaki suranuta dedipyamanojjvala camunda shritarakshaposhajanani
    dakshayani pallavi cidrupi paradevata bhagavati shrirajarajeshvari || || amba shula dhanuh kushankushadhari
    ardhendubimbadhari varahi madhukaitabhaprashamani vaniramasevita malladyasuramukadaityamathani maheshvari
    ambika cidrupi paradevata bhagavati shrirajarajeshvari || || amba srishtavinashapalanakari arya visamshobhita
    gayatri pranavaksharamritarasah purnanusandhikrita onkari vinutasutarcitapada uddandadaityapaha cidrupi
    paradevata bhagavati shrirajarajeshvari || || amba shashvata agamadivinuta arya mahadevata ya brahmadipipilikantajanani
    ya vai jaganmohini ya pancapranavadirephajanani ya citkalamalini cidrupi paradevata bhagavati shrirajarajeshvari
    || || ambapalita bhaktarajadanisham ambashtakam yah pathet ambalokakatakshaviksha lalitam caishvaryamavyahatam
    amba pavanamantrarajapathanadante ca mokshaprada cidrupi paradevata bhagavati shrirajarajeshvari ||
  devanagari: अम्बा शाम्भवि चन्द्रमौलिरबलाऽपर्णा उमा पार्वती काली हैमवती शिवा त्रिनयनी कात्यायनी भैरवी
    सावित्री नवयौवना शुभकरी साम्राज्यलक्ष्मीप्रदा चिद्रूपी परदेवता भगवती श्रीराजराजेश्वरी ॥ ॥ अम्बा मोहिनि
    देवता त्रिभुवनी आनन्दसन्दायिनी वाणी पल्लवपाणि वेणुमुरलीगानप्रिया लोलिनी कल्याणी उडुराजबिम्बवदना धूम्राक्षसंहारिणी
    चिद्रूपी परदेवता भगवती श्रीराजराजेश्वरी ॥ ॥ अम्बा नूपुररत्नकङ्कणधरी केयूरहारावली जातीचम्पकवैजयन्तिलहरी
    ग्रैवेयकैराजिता वीणावेणुविनोदमण्डितकरा वीरासनेसंस्थिता चिद्रूपी परदेवता भगवती श्रीराजराजेश्वरी ॥ ॥
    अम्बा रौद्रिणि भद्रकाली बगला ज्वालामुखी वैष्णवी ब्रह्माणी त्रिपुरान्तकी सुरनुता देदीप्यमानोज्ज्वला
    चामुण्डा श्रितरक्षपोषजननी दाक्षायणी पल्लवी चिद्रूपी परदेवता भगवती श्रीराजराजेश्वरी ॥ ॥ अम्बा शूल धनुः
    कुशाङ्कुशधरी अर्धेन्दुबिम्बाधरी वाराही मधुकैटभप्रशमनी वाणीरमासेविता मल्लद्यासुरमूकदैत्यमथनी माहेश्वरी
    अम्बिका चिद्रूपी परदेवता भगवती श्रीराजराजेश्वरी ॥ ॥ अम्बा सृष्टविनाशपालनकरी आर्या विसंशोभिता गायत्री
    प्रणवाक्षरामृतरसः पूर्णानुसन्धीकृता ओङ्कारी विनुतासुतार्चितपदा उद्दण्डदैत्यापहा चिद्रूपी परदेवता भगवती
    श्रीराजराजेश्वरी ॥ ॥ अम्बा शाश्वत आगमादिविनुता आर्या महादेवता या ब्रह्मादिपिपीलिकान्तजननी या वै जगन्मोहिनी
    या पञ्चप्रणवादिरेफजननी या चित्कलामालिनी चिद्रूपी परदेवता भगवती श्रीराजराजेश्वरी ॥ ॥ अम्बापालित भक्तराजदनिशं
    अम्बाष्टकं यः पठेत् अम्बालोककटाक्षवीक्ष ललितं चैश्वर्यमव्याहतम् अम्बा पावनमन्त्रराजपठनादन्ते च मोक्षप्रदा
    चिद्रूपी परदेवता भगवती श्रीराजराजेश्वरी ॥
