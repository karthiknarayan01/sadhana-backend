id: gakaradiganpatisahasranamastotram
category: sahasranama
name:
  english: gakaradiganpatisahasranamastotram
  devanagari: गकारादिगण्पतिसहस्रनामस्तोत्रम्
content:
  english: gakaradi shriganapatisahasranamastotram om asya shriganapatigakaradisahasranamamalamantrasya
    | durvasa rishih | anushtup chandah | shriganapatirdevata | gam bijam | svaha shaktih | glaum kilakam
    | mama sakalabhishtasiddhyarthe jape viniyogah || || karanyasah || om angushthabhyam namah | shrim
    tarjanibhyam namah | hrim madhyamabhyam namah | klim anamikabhyam namah | glaum kanishthikabhyam namah
    | gam karatalakaraprishthabhyam namah | evam hridayadinyasah | athava shaddirnabhajagamitibijena karanganyasah
    || || dhyanam || onkara sannibhamibhananamindubhalam muktagrabindumamaladyutimekadantam | lambodaram
    kalacaturbhujamadidevam dhyayenmahaganapatim matisiddhikantam || vande nityam ganesham paragunayutam
    dhyanasamstham trinetram ekam devam tvanekam paramasukhayutam devadevam prasannam | shundadandadhyagandodgalitamadajalollomattalijalam
    shrimantam vighnarajam sakalasukhakaram shriganesham namami || || atha stotram || om ganeshvaro ganadhyaksho
    ganaradhyo ganapriyah | gananatho ganasvami ganesho gananayakah || 1|| ganamurtirganapatirganatrata
    gananjayah | ganapo'tha ganakrido ganadevo ganadhipah || 2|| ganajyeshtho ganashreshtho ganapreshtho
    ganadhirat | ganarad ganagoptath ganango ganadaivatam || 3|| ganabandhurganasuhrid ganadhisho ganaprathah
    | ganapriyasakhah shashvad ganapriyasuhrit tatha || 4|| ganapriyarato nityam ganapritivivardhanah
    | ganamandalamadhyastho ganakeliparayanah || 5|| ganagranirganeshano ganagito ganocchrayah | ganyo
    ganahito garjadganaseno ganoddhatah || 6|| ganabhitipramathano ganabhityapaharakah | gananarho ganapraudho
    ganabharta ganaprabhuh || 7|| ganaseno ganacaro ganaprajno ganaikarat | ganagryo gananama ca ganapalanatatparah
    || 8|| ganajidganagarbhastho ganapravanamanasah | ganagarvapariharta gano gananamaskritah || 9|| ganarcitanghriyugaḻo
    ganarakshanakrit sada | ganadhyato ganagururganapranayatatparah || 10|| ganaganaparitrata ganadhiharanoddhurah
    | ganaseturgananuto ganaketurganagragah || 11|| ganaheturganagrahi gananugrahakarakah | ganagananugrahabhurganaganavarapradah
    || 12|| ganastuto ganaprano ganasarvasvadayakah | ganavallabhamurtishca ganabhutirganeshtadah || 13||
    ganasaukhyapradata ca ganaduhkhapranashanah | ganaprathitanama ca ganabhishtakarah sada || 14|| ganamanyo
    ganakhyato ganavito ganotkatah | ganapalo ganavaro ganagauravadayakah || 15|| ganagarjitasantushto
    ganasvacchandagah sada | ganarajo ganashrido ganabhayakarah kshanat || 16|| ganamurdhabhishiktashca
    ganasainyapurassarah | gunatito gunamayo gunatrayavibhagakrit || 17|| guni gunakritidharo gunashali
    gunapriyah | gunapurno gunambhodhirgunabhag gunaduragah || 18|| gunagunavapurgaunashariro gunamanditah
    | gunastrashta guneshano gunesho'tha guneshvarah || 19|| gunasrishtajagatsangho gunasangho gunaikarat
    | gunapravrishto gunabhurgunikritacaracarah || 20|| gunapravanasantushto gunahinaparanmukhah | gunaikabhurgunashreshtho
