id: sagareshvaralingashivakshetrebhillenavanasamrakshanavarnanam
category: raksha
name:
  english: sagareshvaralingashivakshetrebhillenavanasamrakshanavarnanam
  devanagari: सागरेश्वरलिन्गशिवक्षेत्रेभिल्लेनवनसंरक्षणवर्णनम्
content:
  english: ringantareshu mahishan damshtrasandhishu sukaran || 44|| tadbhayannopasarpanti tadbilvavanamanjasa
    | kandamulaphalaireva jivan sa kanayacakah || 45|| sakutumbastada tasthau tasmin bilvaughakanane |
    sukshmamargah kritastena gamanagamane tada || 46|| tamamantryaiva munayo grihnanti nvapallavan | bilvamuleshu
    lingani sthapayitvarcayanti ca || 47|| komalairbilvapatraishca trikalam bhuvaneshvari | triyambakamahamantraih
    shaivah sampujyayantyume || 48|| tan drishtva satatam bhillastushtimapnoti nityashah | te bhillam
    pujayantyeva vagbhishca kanadanatah || 49|| sa bhillah shaivasangatya bilvanam palanena ca | mama
    priyataro nityamabhucca girikanyeke || 50|| bilvamulani sarvani kuddalairbalakaih saha | khatva tanmuladesheshu
    krimidashtamshca pallavan || 51|| dharmakaleshu tatpatni jalamadaya bhurishah | ghataistada mahadevi
    karoti vanapalanam || 52|| karoti jaladanam sa balabilavaprarohane | krimidashtani patrani lutatantuvrittanyapi
    || 53|| chitva chitva patayati bilvabhuruhapalika | tanmuleshu mahashaivah shivamantrajapotsukah ||
    54|| vasanti niyataharah shivalingarcakah shive | bilvapatraishca kusumaih rudradhyayabhishecanaih
    || 55|| pujayantyeva gaurisham tanmuleshu maheshvari | rudradhyayajalaih shitaistanmulam shitayanti
    te || 56|| sayam te dipayantyeva shivalingam nirikshitum | shivalingani tungani bilvayuktani shankari
    || 57|| drashtumabhyudyatah sarve dipadiptivirajitam | tatra brahmadayo deva naradadya maharshayah
    || 58|| drashtum gacchanti niyatah bilvamule shivarcanam | shivalingeshu tungeshu mahashaivakritam
    tada || 59|| stuvanti nrityanti hasanti drishtva bhunjanti pashyanti maheshalingam | jighranti naivedyamaparapunyadam
    shivanghripushpani sura munishvarah || 60|| drishtva tripundrojjvalamastakani sugandhaliptani manoharani
    | subilvamuleshu ca samsthitani sampujya janmani kritarthayanti || 61|| tan drishtva pramathadhinatha
    ganapan brahmadikaste surah dhanya manyakshibhringa | | | sutaram punyapunje nimagnah | drishtva linganumeshapriyavarajanitaparapapairvihinah
    praptah pranatyaye'pi priyamamaravaraih bhillamuleshu samsthah || 62|| sutah
  devanagari: ृङ्गान्तरेषु महिषान् दंष्ट्रासन्धिषु सूकरान् ॥ ४४॥ तद्भयान्नोपसर्पन्ति तद्बिल्ववनमञ्जसा
    । कन्दमूलफलैरेव जीवन् स कणयाचकः ॥ ४५॥ सकुटुम्बस्तदा तस्थौ तस्मिन् बिल्वौघकानने । सूक्ष्ममार्गः कृतस्तेन
    गमनागमने तदा ॥ ४६॥ तमामन्त्र्यैव मुनयो गृह्णन्ति न्वपल्लवान् । बिल्वमूलेषु लिङ्गानि स्थापयित्वार्चयन्ति
    च ॥ ४७॥ कोमलैर्बिल्वपत्रैश्च त्रिकालं भुवनेश्वरि । त्रियम्बकमहामन्त्रैः शैवाः सम्पूज्ययन्त्युमे ॥
    ४८॥ तान् दृष्ट्वा सततं भिल्लस्तुष्टिमाप्नोति नित्यशः । ते भिल्लं पूजयन्त्येव वाग्भिश्च कणदानतः ॥ ४९॥
    स भिल्लः शैवसङ्गत्या बिल्वानां पालनेन च । मम प्रियतरो नित्यमभूच्च गिरिकन्येके ॥ ५०॥ बिल्वमूलानि सर्वाणि
    कुद्दालैर्बालकैः सह । खात्वा तन्मूलदेशेषु कृमिदष्टांश्च पल्लवान् ॥ ५१॥ धर्मकालेषु तत्पत्नी जलमादाय
    भूरिशः । घटैस्तदा महादेवि करोति वनपालनम् ॥ ५२॥ करोति जलदानं सा बालबिलवप्ररोहणे । कृमिदष्टानि पत्राणि
    लूतातन्तुवृत्तान्यपि ॥ ५३॥ छित्वा छित्वा पातयति बिल्वभूरुहपालिका । तन्मूलेषु महाशैवाः शिवमन्त्रजपोत्सुकाः
    ॥ ५४॥ वसन्ति नियताहाराः शिवलिङ्गार्चकाः शिवे । बिल्वपत्रैश्च कुसुमैः रुद्राध्यायभिषेचनैः ॥ ५५॥ पूजयन्त्येव
    गौरीशं तन्मूलेषु महेश्वरि । रुद्राध्यायजलैः शीतैस्तन्मूलं शीतयन्ति ते ॥ ५६॥ सायं ते दीपयन्त्येव शिवलिङ्गं
    निरीक्षितुम् । शिवलिङ्गानि तुङ्गानि बिल्वयुक्तानि शङ्करि ॥ ५७॥ द्रष्टुमभ्युद्यताः सर्वे दीपदीप्तिविराजितम्
    । तत्र ब्रह्मादयो देवा नारदाद्या महर्षयः ॥ ५८॥ द्रष्टुं गच्छन्ति नियताः बिल्वमूले शिवार्चनम् । शिवलिङ्गेषु
    तुङ्गेषु महाशैवकृतं तदा ॥ ५९॥ स्तुवन्ति नृत्यन्ति हसन्ति दृष्ट्वा भुञ्जन्ति पश्यन्ति महेशलिङ्गम् ।
    जिघ्रन्ति नैवेद्यमपारपुण्यदं शिवाङ्घ्रिपुष्पाणि सुरा मुनीश्वराः ॥ ६०॥ दृष्ट्वा त्रिपुण्ड्रोज्ज्वलमस्तकानि
    सुगन्धलिप्तानि मनोहराणि । सुबिल्वमूलेषु च संस्थितानि सम्पूज्य जन्मानि कृतार्थयन्ति ॥ ६१॥ तान् दृष्ट्वा
    प्रमथाधिनाथ गणपान् ब्रह्मादिकास्ते सुराः धन्या मान्याक्षिभृङ्गा । । । सुतरां पुण्यपुञ्जे निमग्नाः
    । दृष्ट्वा लिङ्गानुमेशप्रियवरजनितापारपापैर्विहीनाः प्राप्ताः प्राणात्ययेऽपि प्रियममरवरैः भिल्लमूलेषु
    संस्थाः ॥ ६२॥ सूतः
