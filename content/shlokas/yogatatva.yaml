id: yogatatva
category: upanishad
name:
  english: yogatatva
  devanagari: योगतत्व
content:
  english: rinu tattvatah | laghvaharo yameshveko mukhya bhavati netarah || 28|| ahimsa niyameshveka mukhya
    vai caturanana | siddham padmam tatha simham bhadram ceti catushtayam || 29|| prathamabhyasakale tu
    vighnah syushcaturanana | alasyam katthanam dhurtagoshthi mantradisadhanam || 30|| dhatustrilaulyakadini
    mrigatrishnamayani vai | jnatva sudhistyajetsarvanvighnanpunyaprabhavatah || 31|| pranayamam tatah
    kuryatpadmasanagatah svayam | sushobhanam matham kuryatsukshmadvaram tu nirvranam || 32|| sushthu
    liptam gomayena sudhaya va prayatnatah | matkunairmashakairlutairvarjitam ca prayatnatah || 33|| dine
    dine ca sammrishtam sammarjanya visheshatah | vasitam ca sugandhena dhupitam gugguladibhih || 34||
    natyucchritam natinicam cailajinakushottaram | tatropavishya medhavi padmasanasamanvitah || 35|| rijukayah
    pranjalishca pranamedishtadevatam | tato dakshinahastasya angushthenaiva pingalam || 36|| nirudhya
    purayedvayumidaya tu shanaih shanaih | yathashaktyavirodhena tatah kuryacca kumbhakam || 37|| punastyajetpingalaya
    shanaireva na vegatah | punah pingalayapurya purayedudaram shanaih || 38|| dharayitva yathashakti
    recayedidaya shanaih | yaya tyajettayapurya dharayedavirodhatah || 39|| janu pradakshinikritya na
    drutam na vilambitam | angulisphotanam kuryatsa matra parigiyate || 40|| idaya vayumaropya shanaih
    shodashamatraya | kumbhayetpuritam pashcaccatuhshashtya tu matraya || 41|| recayetpingalanadya dvatrimshanmatraya
    punah | punah pingalayapurya purvavatsusamahitah || 42|| pratarmadhyandine sayamardharatre ca kumbhakan
    | shanairashitiparyantam caturvaram samabhyaset || 43|| evam masatrayabhyasannadishuddhistato bhavet
    | yada tu nadishuddhih syattada cihnani bahyatah || 44|| jayante yogino dehe tani vakshyamyasheshatah
    | shariralaghuta diptirjatharagnivivardhanam || 45|| krishatvam ca sharirasya tada jayeta nishcitam
    | yogavighnakaraharam varjayedyogavittamah || 46|| lavanam sarshapam camlamushnam ruksham ca tikshnakam
    | shakajatam ramathadi vahnistripathasevanam || 47|| pratahsnanopavasadikayakleshamshca varjayet |
    abhyasakale prathamam shastam kshirajyabhojanam || 48|| godhumamudgashalyannam yogavriddhikaram viduh
    | tatah param yatheshtam tu shaktah syadvayudharane || 49|| yatheshtavayudharanadvayoh siddhyetkevalakumbhakah
    | kevale kumbhaka siddhe recapuravivarjite || 50|| na tasya durlabham kincittrishu lokeshu vidyate
    | prasvedo jayate purvam mardanam tena karayet || 51|| tato'pi dharanadvayoh kramenaiva shanaih shanaih
    | kampo bhavati dehasya asanasthasya dehinah || 52|| tato'dhikatarabhyasaddarduri svena jayate | yatha
    ca darduro bhava utplunyotplutya gacchati || 53|| padmasanasthito yogi tatha gacchati bhutale | tato'dhikatarabhyasadbhumityagashca
    jayate || 54|| padmasanastha evasau bhumimutsrijya vartate | atimanushaceshtadi tatha samarthyamudbhavet
    || 55|| na darshayecca samarthyam darshanam viryavattaram | svalpam va bahudha duhkham yogi na vyathate
    tada || 56|| alpamutrapurishashca svalpanidrashca jayate | kilavo drishika lala svedadurgandhatanane
    || 57|| etani sarvatha tasya na jayante tatah param | tato'dhikatarabhyasadbalamutpadyate bahu ||
    58|| yena bhucara siddhih syadbhucaranam jaye kshamah | vyaghro va sharabho vyapi gajo gavaya eva
    va || 59|| simho va yogina tena mriyante hastataditah | kandarpasya yatha rupam tatha syadapi yoginah
    || 60|| tadrupavashaga naryah kankshante tasya sangamam | yadi sangam karotyesha tasya bindukshayo
    bhavet || 61|| varjayitva striyah sangam kuryadabhyasamadarat | yogino'nge sugandhashca jayate bindudharanat
    || 62|| tato rahasyupavishtah pranavam plutamatraya | japetpurvarjitanam tu papanam nashahetave ||
    63|| sarvavighnaharo mantrah pranavah sarvadoshaha | evamabhyasayogena siddhirarambhasambhava || 64||
    tato bhaveddhathavastha pavanabhyasatatpara | prano'pano mano buddhirjivatmaparamatmanoh || 65|| anyonyasyavirodhena
    ekata ghatate yada | ghatavastheti sa prokta taccihnani bravimyaham || 66|| purvam yah kathito'bhyasashcaturthamsham
    parigrahet | diva va yadi va sayam yamamatram samabhyaset || 67|| ekavaram pratidinam kuryatkevalakumbhakam
    | indriyanindriyarthebhyo yatpratyaharanam sphutam || 68|| yogi kumbhakamasthaya pratyaharah sa ucyate
    | yadyatpashyati cakshurbhyam tattadatmeti bhavayet || 69|| yadyacchrinoti karnabhyam tattadatmeti
    bhavayet | labhate nasaya yadyattattadatmeti bhavayet || 70|| jihvaya yadrasam hyatti tattadatmeti
    bhavayet | tvaca yadyatsprishedyogi tattadatmeti bhavayet || 71|| evam jnanendriyanam tu tattatsaukhyam
    susadhayet | yamamatram pratidinam yogi yatnadatandritah || 72|| yatha va cittasamarthyam jayate yogino
    dhruvam | durashrutirduradrishtih kshanadduragamastatha || 73|| vaksiddhih kamarupatvamadrishyakarani
    tatha | malamutrapralepena lohadeh svarnata bhavet || 74|| khe gatistasya jayeta santatabhyasayogatah
    | sada buddhimata bhavyam yogina yogasiddhaye || 75|| ete vighna mahasiddherna rametteshu buddhiman
    | na darshayetsvasamarthyam yasyakasyapi yogirat || 76|| yatha mudho yatha murkho yatha badhira eva
    va | tatha varteta lokasya svasamarthyasya guptaye || 77|| shishyashca svasvakaryeshu prarthayanti
    na samshayah | tattatkarmakaravyagrah svabhyase'vismrito bhavet || 78|| avismritya gurorvakyamabhyasettadaharnisham
    | evam bhaveddhathavastha santatabhyasayogatah || 79|| anabhyasavatashcaiva vrithagoshthya na siddhyati
    | tasmatsarvaprayatnena yogameva sadabhyaset || 80|| tatah paricayavastha jayate'bhyasayogatah | vayuh
    paricito yatnadagnina saha kundalim || 81|| bhavayitva sushumnayam pravishedanirodhatah | vayuna saha
    cittam ca pravishecca mahapatham || 82|| yasya cittam svapavanam sushumnam pravishediha | bhumirapo'nalo
    vayurakashashceti pancakah || 83|| yeshu pancasu devanam dharana pancadhodyate | padadijanuparyantam
    prithivisthanamucyate || 84|| prithivi caturasram ca pitavarnam lavarnakam | parthive vayumaropya
    lakarena samanvitam || 85|| dhyayamshcaturbhujakaram caturvaktram hiranmayam | dharayetpancaghatikah
    prithivijayamapnuyat || 86|| prithiviyogato mrityurna bhavedasya yoginah | ajanoh payuparyantamapam
    sthanam prakirtitam || 87|| apo'rdhacandram shuklam ca vambijam parikirtitam | varune vayumaropya
    vakarena samanvitam || 88|| smarannarayanam devam caturbahum kiritinam | shuddhasphatikasankasham
    pitavasasamacyutam || 89|| dharayetpancaghatikah sarvapapaih pramucyate | tato jaladbhayam nasti jale
    mrityurna vidyate || 90|| apayorhridayantam ca vahnisthanam prakirtitam | vahnistrikonam raktam ca
    rephaksharasamudbhavam || 91|| vahnau canilamaropya rephaksharasamujjvalam | triyaksham varadam rudram
    tarunadityasamnibham || 92|| bhasmoddhulitasarvangam suprasannamanusmaran | dharayetpancaghatika vahninasau
    na dahyate || 93|| na dahyate shariram ca pravishtasyagnimandale | ahridayadbhruvormadhyam vayusthanam
    prakirtitam || 94|| vayuh shatkonakam krishnam yakaraksharabhasuram | marutam marutam sthane yakaraksharabhasuram
    || 95|| dharayettatra sarvajnamishvaram vishvatomukham | dharayetpancaghatika vayuvadvyomago bhavet
    || 96|| maranam na tu vayoshca bhayam bhavati yoginah | abhrumadhyattu murdhantamakashasthanamucyate
    || 97|| vyoma vrittam ca dhumram ca hakaraksharabhasuram | akashe vayumaropya hakaropari shankaram
    || 98|| bindurupam mahadevam vyomakaram sadashivam | shuddhasphatikasankasham dhritabalendumaulinam
    || 99|| pancavaktrayutam saumyam dashabahum trilocanam | sarvayudhairdhritakaram sarvabhushanabhushitam
    || 100|| umardhadeham varadam sarvakaranakaranam | akashadharanattasya khecaratvam bhaveddhruvam ||
    101|| yatrakutra sthito vapi sukhamatyantamashnute | evam ca dharanah panca kuryadyogi vicakshanah
    || 102|| tato dridhasharirah syanmrityustasya na vidyate | brahmanah pralayenapi na sidati mahamatih
    || 103|| samabhyasettatha dhyanam ghatikashashtimeva ca | vayum nirudhya cakashe devatamishtadamiti
    || 104|| sagunam dhyanametatsyadanimadigunapradam | nirgunadhyanayuktasya samadhishca tato bhavet
    || 105|| dinadvadashakenaiva samadhim samavapnuyat | vayum nirudhya medhavi jivanmukto bhavatyayam
    || 106|| samadhih samatavastha jivatmaparamatmanoh | yadi svadehamutsrashtumiccha cedutsrijetsvayam
    || 107|| parabrahmani liyeta na tasyotkrantirishyate | atha no cetsamutsrashtum svashariram priyam
    yadi || 108|| sarvalokeshu viharannanimadigunanvitah | kadacitsvecchaya devo bhutva svarge mahiyate
    || 109|| manushyo vapi yaksho va svecchayapikshanadbhavet | simho vyaghro gajo vashvah svecchaya bahutamiyat
    || 110|| yatheshtameva varteta yadva yogi maheshvarah | abhyasabhedato bhedah phalam tu samameva hi
    || 111|| parshnim vamasya padasya yonisthane niyojayet | prasarya dakshinam padam hastabhyam dharayeddridham
    || 112|| cubukam hridi vinyasya purayedvayuna punah | kumbhakena yathashakti dharayitva tu recayet
    || 113|| vamangena samabhyasya dakshangena tato'bhyaset | prasaritastu yah padastamurupari namayet
    || 114|| ayameva mahabandha ubhayatraivamabhyaset | mahabandhasthito yogi kritva purakamekadhih ||
    115|| vayuna gatimavritya nibhritam karnamudraya | putadvayam samakramya vayuh sphurati satvaram ||
    116|| ayameva mahavedhah siddhairabhyasyate'nisham | antah kapalakuhare jihvam vyavritya dharayet
    || 117|| bhrumadhyadrishtirapyesha mudra bhavati khecari | kanthamakuncya hridaye sthapayeddridhaya
    dhiya || 118|| bandho jalandharakhyo'yam mrityumatangakesari | bandho yena sushumnayam pranastuddiyate
    yatah || 119|| udyanakhyo hi bandho'yam yogibhih samudahritah | parshnibhagena sampidya yonimakuncayeddridham
    || 120|| apanamurdhvamutthapya yonibandho'yamucyate | pranapanau nadabindu mulabandhena caikatam ||
    121|| gatva yogasya samsiddhim yacchato natra samshayah | karani viparitakhya sarvavyadhivinashini
    || 122|| nityamabhyasayuktasya jatharagnivivardhani | aharo bahulastasya sampadyah sadhakasya ca ||
    123|| alpaharo yadi bhavedagnirdeham haretkshanat | adhahshirashcordhvapadah kshanam syatprathame
    dine || 124|| kshanacca kincidadhikamabhyasettu dinedine | vali ca palitam caiva shanmasardhanna drishyate
    || 125|| yamamatram tu yo nityamabhyasetsa tu kalajit | vajrolimabhyasedyastu sa yogi siddhibhajanam
    || 126|| labhyate yadi tasyaiva yogasiddhih kare sthita | atitanagatam vetti khecari ca bhaveddhruvam
    || 127|| amarim yah pibennityam nasyam kurvandine dine | vajrolimabhyasennityamamaroliti kathyate
    || 128|| tato bhavedrajayogo nantara bhavati dhruvam | yada tu rajayogena nishpanna yogibhih kriya
    || 129|| tada vivekavairagyam jayate yogino dhruvam | vishnurnama mahayogi mahabhuto mahatapah ||
    130|| tattvamarge yatha dipo drishyate purushottamah | yah stanah purvapitastam nishpidya mudamashnute
    || 131|| yasmajjato bhagatpurvam tasminneva bhage raman | ya mata sa punarbharya ya bharya matareva
    hi || 132|| yah pita sa punah putro yah putrah sa punah pita | evam samsaracakram kupacakrena ghata
    iva || 133|| bhramanto yonijanmani shrutva lokansamashnute | trayo lokastrayo vedastisrah sandhyastrayah
    svarah || 134|| trayo'gnayashca trigunah sthitah sarve trayakshare | trayanamaksharanam ca yo'dhite'pyardhamaksharam
    || 135|| tena sarvamidam protam tatsatyam tatparam padam | pushpamadhye yatha gandhah payomadhye yatha
    ghritam || 136|| tilamadhye yatha tailam pashaneshviva kancanam | hridi sthane sthitam padmam tasya
    vaktramadhomukham || 137|| urdhvanalamadhobindustasya madhye sthitam manah | akare recitam padmamukarenaiva
    bhidyate || 138|| makare labhate nadamardhamatra tu nishcala | shuddhasphatikasankasham nishkalam
    papanashanam || 139|| labhate yogayuktatma purushastatparam padam | kurmah svapanipadadishirashcatmani
    dharayet || 140|| evam dvareshu sarveshu vayupuritarecitah | nishiddham tu navadvare urdhvam prannishvasamstatha
    || 141|| ghatamadhye yatha dipo nivatam kumbhakam viduh | nishiddhairnavabhirdvarairnirjane nirupadrave
    || 142|| nishcitam tvatmamatrenavashishtam yogasevayetyupanishat || om saha navavatu | saha nau bhunaktu
    | saha viryam karavavahai | tejasvinavadhitamastu ma vidvishavahai | om shantih shantih shantih ||
    iti yogatattvopanishat samapta ||
  devanagari: ृणु तत्त्वतः । लघ्वाहारो यमेष्वेको मुख्या भवति नेतरः ॥ २८॥ अहिंसा नियमेष्वेका मुख्या वै
    चतुरानन । सिद्धं पद्मं तथा सिंहं भद्रं चेति चतुष्टयम् ॥ २९॥ प्रथमाभ्यासकाले तु विघ्नाः स्युश्चतुरानन
    । आलस्यं कत्थनं धूर्तगोष्ठी मन्त्रादिसाधनम् ॥ ३०॥ धातुस्त्रीलौल्यकादीनि मृगतृष्णामयानि वै । ज्ञात्वा
    सुधीस्त्यजेत्सर्वान्विघ्नान्पुण्यप्रभावतः ॥ ३१॥ प्राणायामं ततः कुर्यात्पद्मासनगतः स्वयम् । सुशोभनं
    मठं कुर्यात्सूक्ष्मद्वारं तु निर्व्रणम् ॥ ३२॥ सुष्ठु लिप्तं गोमयेन सुधया वा प्रयत्नतः । मत्कुणैर्मशकैर्लूतैर्वर्जितं
    च प्रयत्नतः ॥ ३३॥ दिने दिने च संमृष्टं संमार्जन्या विशेषतः । वासितं च सुगन्धेन धूपितं गुग्गुलादिभिः
    ॥ ३४॥ नात्युच्छ्रितं नातिनीचं चैलाजिनकुशोत्तरम् । तत्रोपविश्य मेधावी पद्मासनसमन्वितः ॥ ३५॥ ऋजुकायः
    प्राञ्जलिश्च प्रणमेदिष्टदेवताम् । ततो दक्षिणहस्तस्य अङ्गुष्ठेनैव पिङ्गलाम् ॥ ३६॥ निरुध्य पूरयेद्वायुमिडया
    तु शनैः शनैः । यथाशक्त्यविरोधेन ततः कुर्याच्च कुम्भकम् ॥ ३७॥ पुनस्त्यजेत्पिङ्गलया शनैरेव न वेगतः ।
    पुनः पिङ्गलयापूर्य पूरयेदुदरं शनैः ॥ ३८॥ धारयित्वा यथाशक्ति रेचयेदिडया शनैः । यया त्यजेत्तयापूर्य
    धारयेदविरोधतः ॥ ३९॥ जानु प्रदक्षिणीकृत्य न द्रुतं न विलम्बितम् । अङ्गुलिस्फोटनं कुर्यात्सा मात्रा
    परिगीयते ॥ ४०॥ इडया वायुमारोप्य शनैः षोडशमात्रया । कुम्भयेत्पूरितं पश्चाच्चतुःषष्ट्या तु मात्रया ॥
    ४१॥ रेचयेत्पिङ्गलानाड्या द्वात्रिंशन्मात्रया पुनः । पुनः पिङ्गलयापूर्य पूर्ववत्सुसमाहितः ॥ ४२॥ प्रातर्मध्यन्दिने
    सायमर्धरात्रे च कुम्भकान् । शनैरशीतिपर्यन्तं चतुर्वारं समभ्यसेत् ॥ ४३॥ एवं मासत्रयाभ्यासान्नाडीशुद्धिस्ततो
    भवेत् । यदा तु नाडीशुद्धिः स्यात्तदा चिह्नानि बाह्यतः ॥ ४४॥ जायन्ते योगिनो देहे तानि वक्ष्याम्यशेषतः
    । शरीरलघुता दीप्तिर्जाठराग्निविवर्धनम् ॥ ४५॥ कृशत्वं च शरीरस्य तदा जायेत निश्चितम् । योगाविघ्नकराहारं
    वर्जयेद्योगवित्तमः ॥ ४६॥ लवणं सर्षपं चाम्लमुष्णं रूक्षं च तीक्ष्णकम् । शाकजातं रामठादि वह्निस्त्रीपथसेवनम्
    ॥ ४७॥ प्रातःस्नानोपवासादिकायक्लेशांश्च वर्जयेत् । अभ्यासकाले प्रथमं शस्तं क्षीराज्यभोजनम् ॥ ४८॥ गोधूममुद्गशाल्यन्नं
    योगवृद्धिकरं विदुः । ततः परं यथेष्टं तु शक्तः स्याद्वायुधारणे ॥ ४९॥ यथेष्टवायुधारणाद्वायोः सिद्ध्येत्केवलकुम्भकः
    । केवले कुम्भक सिद्धे रेचपूरविवर्जिते ॥ ५०॥ न तस्य दुर्लभं किञ्चित्त्रिषु लोकेषु विद्यते । प्रस्वेदो
    जायते पूर्वं मर्दनं तेन कारयेत् ॥ ५१॥ ततोऽपि धारणाद्वायोः क्रमेणैव शनैः शनैः । कम्पो भवति देहस्य आसनस्थस्य
    देहिनः ॥ ५२॥ ततोऽधिकतराभ्यासाद्दार्दुरी स्वेन जायते । यथा च दर्दुरो भाव उत्प्लुन्योत्प्लुत्य गच्छति
    ॥ ५३॥ पद्मासनस्थितो योगी तथा गच्छति भूतले । ततोऽधिकतरभ्यासाद्भूमित्यागश्च जायते ॥ ५४॥ पद्मासनस्थ एवासौ
    भूमिमुत्सृज्य वर्तते । अतिमानुषचेष्टादि तथा सामर्थ्यमुद्भवेत् ॥ ५५॥ न दर्शयेच्च सामर्थ्यं दर्शनं वीर्यवत्तरम्
    । स्वल्पं वा बहुधा दुःखं योगी न व्यथते तदा ॥ ५६॥ अल्पमूत्रपुरीषश्च स्वल्पनिद्रश्च जायते । कीलवो दृषिका
    लाला स्वेददुर्गन्धतानने ॥ ५७॥ एतानि सर्वथा तस्य न जायन्ते ततः परम् । ततोऽधिकतराभ्यासाद्बलमुत्पद्यते
    बहु ॥ ५८॥ येन भूचर सिद्धिः स्याद्भूचराणां जये क्षमः । व्याघ्रो वा शरभो व्यापि गजो गवय एव वा ॥ ५९॥
    सिंहो वा योगिना तेन म्रियन्ते हस्तताडिताः । कन्दर्पस्य यथा रूपं तथा स्यादपि योगिनः ॥ ६०॥ तद्रूपवशगा
    नार्यः काङ्क्षन्ते तस्य सङ्गमम् । यदि सङ्गं करोत्येष तस्य बिन्दुक्षयो भवेत् ॥ ६१॥ वर्जयित्वा स्त्रियाः
    सङ्गं कुर्यादभ्यासमादरात् । योगिनोऽङ्गे सुगन्धश्च जायते बिन्दुधारणात् ॥ ६२॥ ततो रहस्युपाविष्टः प्रणवं
    प्लुतमात्रया । जपेत्पूर्वार्जितानां तु पापानां नाशहेतवे ॥ ६३॥ सर्वविघ्नहरो मन्त्रः प्रणवः सर्वदोषहा
    । एवमभ्यासयोगेन सिद्धिरारम्भसम्भवा ॥ ६४॥ ततो भवेद्धठावस्था पवनाभ्यासतत्परा । प्राणोऽपानो मनो बुद्धिर्जीवात्मपरमात्मनोः
    ॥ ६५॥ अन्योन्यस्याविरोधेन एकता घटते यदा । घटावस्थेति सा प्रोक्ता तच्चिह्नानि ब्रवीम्यहम् ॥ ६६॥ पूर्वं
    यः कथितोऽभ्यासश्चतुर्थांशं परिग्रहेत् । दिवा वा यदि वा सायं याममात्रं समभ्यसेत् ॥ ६७॥ एकवारं प्रतिदिनं
    कुर्यात्केवलकुम्भकम् । इन्द्रियाणीन्द्रियार्थेभ्यो यत्प्रत्याहरणं स्फुटम् ॥ ६८॥ योगी कुम्भकमास्थाय
    प्रत्याहारः स उच्यते । यद्यत्पश्यति चक्षुर्भ्यां तत्तदात्मेति भावयेत् ॥ ६९॥ यद्यच्छृणोति कर्णाभ्यां
    तत्तदात्मेति भावयेत् । लभते नासया यद्यत्तत्तदात्मेति भावयेत् ॥ ७०॥ जिह्वया यद्रसं ह्यत्ति तत्तदात्मेति
    भावयेत् । त्वचा यद्यत्स्पृशेद्योगी तत्तदात्मेति भावयेत् ॥ ७१॥ एवं ज्ञानेन्द्रियाणां तु तत्तत्सौख्यं
    सुसाधयेत् । याममात्रं प्रतिदिनं योगी यत्नादतन्द्रितः ॥ ७२॥ यथा वा चित्तसामर्थ्यं जायते योगिनो ध्रुवम्
    । दूरश्रुतिर्दूरदृष्टिः क्षणाद्दूरगमस्तथा ॥ ७३॥ वाक्सिद्धिः कामरूपत्वमदृश्यकरणी तथा । मलमूत्रप्रलेपेन
    लोहादेः स्वर्णता भवेत् ॥ ७४॥ खे गतिस्तस्य जायेत सन्तताभ्यासयोगतः । सदा बुद्धिमता भाव्यं योगिना योगसिद्धये
    ॥ ७५॥ एते विघ्ना महासिद्धेर्न रमेत्तेषु बुद्धिमान् । न दर्शयेत्स्वसामर्थ्यं यस्यकस्यापि योगिराट् ॥
    ७६॥ यथा मूढो यथा मूर्खो यथा बधिर एव वा । तथा वर्तेत लोकस्य स्वसामर्थ्यस्य गुप्तये ॥ ७७॥ शिष्याश्च
    स्वस्वकार्येषु प्रार्थयन्ति न संशयः । तत्तत्कर्मकरव्यग्रः स्वाभ्यासेऽविस्मृतो भवेत् ॥ ७८॥ अविस्मृत्य
    गुरोर्वाक्यमभ्यसेत्तदहर्निशम् । एवं भवेद्धठावस्था सन्तताभ्यासयोगतः ॥ ७९॥ अनभ्यासवतश्चैव वृथागोष्ठ्या
    न सिद्ध्यति । तस्मात्सर्वप्रयत्नेन योगमेव सदाभ्यसेत् ॥ ८०॥ ततः परिचयावस्था जायतेऽभ्यासयोगतः । वायुः
    परिचितो यत्नादग्निना सह कुण्डलीम् ॥ ८१॥ भावयित्वा सुषुम्नायां प्रविशेदनिरोधतः । वायुना सह चित्तं च
    प्रविशेच्च महापथम् ॥ ८२॥ यस्य चित्तं स्वपवनं सुषुम्नां प्रविशेदिह । भूमिरापोऽनलो वायुराकाशश्चेति पञ्चकः
    ॥ ८३॥ येषु पञ्चसु देवानां धारणा पञ्चधोद्यते । पादादिजानुपर्यन्तं पृथिवीस्थानमुच्यते ॥ ८४॥ पृथिवी चतुरस्रं
    च पीतवर्णं लवर्णकम् । पार्थिवे वायुमारोप्य लकारेण समन्वितम् ॥ ८५॥ ध्यायंश्चतुर्भुजाकारं चतुर्वक्त्रं
    हिरण्मयम् । धारयेत्पञ्चघटिकाः पृथिवीजयमाप्नुयात् ॥ ८६॥ पृथिवीयोगतो मृत्युर्न भवेदस्य योगिनः । आजानोः
    पायुपर्यन्तमपां स्थानं प्रकीर्तितम् ॥ ८७॥ आपोऽर्धचन्द्रं शुक्लं च वंबीजं परिकीर्तितम् । वारुणे वायुमारोप्य
    वकारेण समन्वितम् ॥ ८८॥ स्मरन्नारायणं देवं चतुर्बाहुं किरीटिनम् । शुद्धस्फटिकसङ्काशं पीतवाससमच्युतम्
    ॥ ८९॥ धारयेत्पञ्चघटिकाः सर्वपापैः प्रमुच्यते । ततो जलाद्भयं नास्ति जले मृत्युर्न विद्यते ॥ ९०॥ आपायोर्हृदयान्तं
    च वह्निस्थानं प्रकीर्तितम् । वह्निस्त्रिकोणं रक्तं च रेफाक्षरसमुद्भवम् ॥ ९१॥ वह्नौ चानिलमारोप्य रेफाक्षरसमुज्ज्वलम्
    । त्रियक्षं वरदं रुद्रं तरुणादित्यसंनिभम् ॥ ९२॥ भस्मोद्धूलितसर्वाङ्गं सुप्रसन्नमनुस्मरन् । धारयेत्पञ्चघटिका
    वह्निनासौ न दाह्यते ॥ ९३॥ न दह्यते शरीरं च प्रविष्टस्याग्निमण्डले । आहृदयाद्भ्रुवोर्मध्यं वायुस्थानं
    प्रकीर्तितम् ॥ ९४॥ वायुः षट्कोणकं कृष्णं यकाराक्षरभासुरम् । मारुतं मरुतां स्थाने यकाराक्षरभासुरम्
    ॥ ९५॥ धारयेत्तत्र सर्वज्ञमीश्वरं विश्वतोमुखम् । धारयेत्पञ्चघटिका वायुवद्व्योमगो भवेत् ॥ ९६॥ मरणं न
    तु वायोश्च भयं भवति योगिनः । आभ्रूमध्यात्तु मूर्धान्तमाकाशस्थानमुच्यते ॥ ९७॥ व्योम वृत्तं च धूम्रं
    च हकाराक्षरभासुरम् । आकाशे वायुमारोप्य हकारोपरि शङ्करम् ॥ ९८॥ बिन्दुरूपं महादेवं व्योमाकारं सदाशिवम्
    । शुद्धस्फटिकसङ्काशं धृतबालेन्दुमौलिनम् ॥ ९९॥ पञ्चवक्त्रयुतं सौम्यं दशबाहुं त्रिलोचनम् । सर्वायुधैर्धृताकारं
    सर्वभूषणभूषितम् ॥ १००॥ उमार्धदेहं वरदं सर्वकारणकारणम् । आकाशधारणात्तस्य खेचरत्वं भवेद्ध्रुवम् ॥ १०१॥
    यत्रकुत्र स्थितो वापि सुखमत्यन्तमश्नुते । एवं च धारणाः पञ्च कुर्याद्योगी विचक्षणः ॥ १०२॥ ततो दृढशरीरः
    स्यान्मृत्युस्तस्य न विद्यते । ब्रह्मणः प्रलयेनापि न सीदति महामतिः ॥ १०३॥ समभ्यसेत्तथा ध्यानं घटिकाषष्टिमेव
    च । वायुं निरुध्य चाकाशे देवतामिष्टदामिति ॥ १०४॥ सगुणं ध्यानमेतत्स्यादणिमादिगुणप्रदम् । निर्गुणध्यानयुक्तस्य
    समाधिश्च ततो भवेत् ॥ १०५॥ दिनद्वादशकेनैव समाधिं समवाप्नुयात् । वायुं निरुध्य मेधावी जीवन्मुक्तो भवत्ययम्
    ॥ १०६॥ समाधिः समतावस्था जीवात्मपरमात्मनोः । यदि स्वदेहमुत्स्रष्टुमिच्छा चेदुत्सृजेत्स्वयम् ॥ १०७॥
    परब्रह्मणि लीयेत न तस्योत्क्रान्तिरिष्यते । अथ नो चेत्समुत्स्रष्टुं स्वशरीरं प्रियं यदि ॥ १०८॥ सर्वलोकेषु
    विहरन्नणिमादिगुणान्वितः । कदाचित्स्वेच्छया देवो भूत्वा स्वर्गे महीयते ॥ १०९॥ मनुष्यो वापि यक्षो वा
    स्वेच्छयापीक्षणद्भवेत् । सिंहो व्याघ्रो गजो वाश्वः स्वेच्छया बहुतामियात् ॥ ११०॥ यथेष्टमेव वर्तेत यद्वा
    योगी महेश्वरः । अभ्यासभेदतो भेदः फलं तु सममेव हि ॥ १११॥ पार्ष्णिं वामस्य पादस्य योनिस्थाने नियोजयेत्
    । प्रसार्य दक्षिणं पादं हस्ताभ्यां धारयेद्दृढम् ॥ ११२॥ चुबुकं हृदि विन्यस्य पूरयेद्वायुना पुनः । कुम्भकेन
    यथाशक्ति धारयित्वा तु रेचयेत् ॥ ११३॥ वामाङ्गेन समभ्यस्य दक्षाङ्गेन ततोऽभ्यसेत् । प्रसारितस्तु यः पादस्तमूरूपरि
    नामयेत् ॥ ११४॥ अयमेव महाबन्ध उभयत्रैवमभ्यसेत् । महाबन्धस्थितो योगी कृत्वा पूरकमेकधीः ॥ ११५॥ वायुना
    गतिमावृत्य निभृतं कर्णमुद्रया । पुटद्वयं समाक्रम्य वायुः स्फुरति सत्वरम् ॥ ११६॥ अयमेव महावेधः सिद्धैरभ्यस्यतेऽनिशम्
    । अन्तः कपालकुहरे जिह्वां व्यावृत्य धारयेत् ॥ ११७॥ भ्रूमध्यदृष्टिरप्येषा मुद्रा भवति खेचरी । कण्ठमाकुञ्च्य
    हृदये स्थापयेद्दृढया धिया ॥ ११८॥ बन्धो जालन्धराख्योऽयं मृत्युमातङ्गकेसरी । बन्धो येन सुषुम्नायां प्राणस्तूड्डीयते
    यतः ॥ ११९॥ उड्यानाख्यो हि बन्धोऽयं योगिभिः समुदाहृतः । पार्ष्णिभागेन सम्पीड्य योनिमाकुञ्चयेद्दृढम्
    ॥ १२०॥ अपानमूर्ध्वमुत्थाप्य योनिबन्धोऽयमुच्यते । प्राणापानौ नादबिन्दू मूलबन्धेन चैकताम् ॥ १२१॥ गत्वा
    योगस्य संसिद्धिं यच्छतो नात्र संशयः । करणी विपरीताख्या सर्वव्याधिविनाशिनी ॥ १२२॥ नित्यमभ्यासयुक्तस्य
    जाठराग्निविवर्धनी । आहारो बहुलस्तस्य सम्पाद्यः साधकस्य च ॥ १२३॥ अल्पाहारो यदि भवेदग्निर्देहं हरेत्क्षणात्
    । अधःशिरश्चोर्ध्वपादः क्षणं स्यात्प्रथमे दिने ॥ १२४॥ क्षणाच्च किञ्चिदधिकमभ्यसेत्तु दिनेदिने । वली
    च पलितं चैव षण्मासार्धान्न दृश्यते ॥ १२५॥ याममात्रं तु यो नित्यमभ्यसेत्स तु कालजित् । वज्रोलीमभ्यसेद्यस्तु
    स योगी सिद्धिभाजनम् ॥ १२६॥ लभ्यते यदि तस्यैव योगसिद्धिः करे स्थिता । अतीतानागतं वेत्ति खेचरी च भवेद्ध्रुवम्
    ॥ १२७॥ अमरीं यः पिबेन्नित्यं नस्यं कुर्वन्दिने दिने । वज्रोलीमभ्यसेन्नित्यममरोलीति कथ्यते ॥ १२८॥ ततो
    भवेद्राजयोगो नान्तरा भवति ध्रुवम् । यदा तु राजयोगेन निष्पन्ना योगिभिः क्रिया ॥ १२९॥ तदा विवेकवैराग्यं
    जायते योगिनो ध्रुवम् । विष्णुर्नाम महायोगी महाभूतो महातपाः ॥ १३०॥ तत्त्वमार्गे यथा दीपो दृश्यते पुरुषोत्तमः
    । यः स्तनः पूर्वपीतस्तं निष्पीड्य मुदमश्नुते ॥ १३१॥ यस्माज्जातो भगात्पूर्वं तस्मिन्नेव भगे रमन् ।
    या माता सा पुनर्भार्या या भार्या मातरेव हि ॥ १३२॥ यः पिता स पुनः पुत्रो यः पुत्रः स पुनः पिता । एवं
    संसारचक्रं कूपचक्रेण घटा इव ॥ १३३॥ भ्रमन्तो योनिजन्मानि श्रुत्वा लोकान्समश्नुते । त्रयो लोकास्त्रयो
    वेदास्तिस्रः सन्ध्यास्त्रयः स्वराः ॥ १३४॥ त्रयोऽग्नयश्च त्रिगुणाः स्थिताः सर्वे त्रयाक्षरे । त्रयाणामक्षराणां
    च योऽधीतेऽप्यर्धमक्षरम् ॥ १३५॥ तेन सर्वमिदं प्रोतं तत्सत्यं तत्परं पदम् । पुष्पमध्ये यथा गन्धः पयोमध्ये
    यथा घृतम् ॥ १३६॥ तिलमध्ये यथा तैलं पाषाणेष्विव काञ्चनम् । हृदि स्थाने स्थितं पद्मं तस्य वक्त्रमधोमुखम्
    ॥ १३७॥ ऊर्ध्वनालमधोबिन्दुस्तस्य मध्ये स्थितं मनः । अकारे रेचितं पद्ममुकारेणैव भिद्यते ॥ १३८॥ मकारे
    लभते नादमर्धमात्रा तु निश्चला । शुद्धस्फटिकसङ्काशं निष्कलं पापनाशनम् ॥ १३९॥ लभते योगयुक्तात्मा पुरुषस्तत्परं
    पदम् । कूर्मः स्वपाणिपादादिशिरश्चात्मनि धारयेत् ॥ १४०॥ एवं द्वारेषु सर्वेषु वायुपूरितरेचितः । निषिद्धं
    तु नवद्वारे ऊर्ध्वं प्राङ्निश्वसंस्तथा ॥ १४१॥ घटमध्ये यथा दीपो निवातं कुम्भकं विदुः । निषिद्धैर्नवभिर्द्वारैर्निर्जने
    निरुपद्रवे ॥ १४२॥ निश्चितं त्वात्ममात्रेणावशिष्टं योगसेवयेत्युपनिषत् ॥ ॐ सह नाववतु । सह नौ भुनक्तु
    । सह वीर्यं करवावहै । तेजस्विनावधीतमस्तु मा विद्विषावहै । ॐ शान्तिः शान्तिः शान्तिः ॥ इति योगतत्त्वोपनिषत्
    समाप्ता ॥
