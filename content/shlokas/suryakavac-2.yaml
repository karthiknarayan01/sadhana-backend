id: suryakavac-2
category: kavacha
name:
  english: suryakavac 2
  devanagari: सूर्यकवच् २
content:
  english: rinushva munishardula suryasya kavacam shubham | sharirarogyadam divyam sarvasaubhagyadayakam
    || 1|| dedipyamanamukutam sphuranmakarakundalam | dhyatva sahasrakiranam stotrametadudirayet || 2||
    shiro me bhaskarah patu lalatam me'mitadyutih | netre dinamanih patu shravane vasareshvarah || 3||
    ghranam gharmaghrinih patu vadanam vedavahanah | jihvam me manadah patu kantham me suravanditah ||
    4|| skandhau prabhakarah patu vakshah patu janapriyah | patu padau dvadashatma sarvangam sakaleshvarah
    || 5|| suryarakshatmakam stotram likhitva bhurjapatrake | dadhati yah kare tasya vashagah sarvasiddhayah
    || 6|| susnato yo japetsamyagyo'dhite svasthamanasah | sa rogamukto dirghayuh sukham pushtim ca vindati
    || 7|| || iti shrimadyajnavalkyamuniviracitam suryakavacastotram sampurnam ||
  devanagari: ृणुष्व मुनिशार्दूल सूर्यस्य कवचं शुभम् । शरीरारोग्यदं दिव्यं सर्वसौभाग्यदायकम् ॥ १॥ देदीप्यमानमुकुटं
    स्फुरन्मकरकुण्डलम् । ध्यात्वा सहस्रकिरणं स्तोत्रमेतदुदीरयेत् ॥ २॥ शिरो मे भास्करः पातु ललाटं मेऽमितद्युतिः
    । नेत्रे दिनमणिः पातु श्रवणे वासरेश्वरः ॥ ३॥ घ्राणं घर्मघृणिः पातु वदनं वेदवाहनः । जिह्वां मे मानदः
    पातु कण्ठं मे सुरवन्दितः ॥ ४॥ स्कन्धौ प्रभाकरः पातु वक्षः पातु जनप्रियः । पातु पादौ द्वादशात्मा सर्वाङ्गं
    सकलेश्वरः ॥ ५॥ सूर्यरक्षात्मकं स्तोत्रं लिखित्वा भूर्जपत्रके । दधाति यः करे तस्य वशगाः सर्वसिद्धयः
    ॥ ६॥ सुस्नातो यो जपेत्सम्यग्योऽधीते स्वस्थमानसः । स रोगमुक्तो दीर्घायुः सुखं पुष्टिं च विन्दति ॥ ७॥
    ॥ इति श्रीमद्याज्ञवल्क्यमुनिविरचितं सूर्यकवचस्तोत्रं सम्पूर्णम् ॥
