    । तृ॒ष्णा चा व॑हतामु॒भे ॥ वागे॑षाग्ं सुब्रह्म॒ण्या त् । छ॒न्दो॒ यो॒गान् वि॑जान॒ती । क॒ल्प॒त॒न्त्राणि॑
    तन्वा॒ना ऽहः॑ । स॒ग्ग्॒स्थाश्च॑ सर्व॒शः ॥ अ॒हो॒रा॒त्रे प॑शुपा॒ल्यौ । मु॒हू॒र्ताः प्रे॒ष्या॑ अभवन्न्
    । मृ॒त्युस् तद॑ द्धा॒ता । श॒मि॒तो ग्रो वि॒शा ॥ वि॒श्व॒सृजः॑ प्रथ॒मा म्प्रसु॑तेन॒ यन्तः॑ । ततो॑ ह जज्ञे॒
    भुव॑नस्य गो॒पाः । हि॒र॒ण्मयः॑ श॒कुनि॒ र्ब्रह्म॒ नाम॑ ॥ येन॒ सूर्य॒ द्धः । पि॒ता पु॒त्रेण॑ पितृ॒मान्
    योनि॑योनौ । नावे॑दवि मा॒त्मानग्ं॑ सम्परा॒ये ॥ ए॒ष नि॒त्यो म॑हि॒मा ब्रा ह्म॒णस्य॑ । न कर्म॑णा वर्धते॒
    नो कनी॑यान् ॥ ॥ तस्यै॒वात्मा प॑द॒वित्तं विँ॑दित्वा । न कर्म॑णा लिप्यते॒ पाप॑केन ॥ पञ्च॑पञ्चा॒शत॑ वँथ्स॒राः
    । पञ्च॑पञ्चा॒शतः॑ पञ्चद॒शाः । पञ्च॑पञ्चा॒शतः॑ सप्तद॒शाः । पञ्च॑पञ्चा॒शत॑ एकवि॒ग्ं॒शाः । वि॒श्व॒सृजाग्ं॑
    स॒हस्र॑ सं वँथ्सरम् ॥ ए॒तेन॒ वै वि॑श्व॒सृज॑ इ॒दं द्विश्व॒सृजः॑ ॥ विश्व॑ ननु॒ प्रजा॑यते । ब्रह्म॑ण॒
    स्सायु॑ज्यग्ं सलो॒कतां यँन्ति । ए॒तासा॑मे॒व दे॒वता॑ना॒ग्ं॒ सायु॑ज्यम् । सा॒र् ष्टिताग्ं॑ समान लो॒कतां
    दु॑प॒यन्ति॑ । ये चै॑न॒ सर्वा॒ दिशो॑ दि॒क्षु स्तप॑ आसीद्गृ॒हप॑ति॒ ॥ हरिः॑ ओम् ॥ ॥ तैत्तिरीय यजुर्ब्राह्मणे
    काठके तृतीय प्रश्न स्समाप्तः ॥ ॥ इति तैत्तिरीय यजुर्ब्राह्मणे काठकं समाप्तम् ॥
