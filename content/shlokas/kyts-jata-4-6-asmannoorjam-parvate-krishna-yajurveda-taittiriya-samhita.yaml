id: kyts-jata-4-6-asmannoorjam-parvate-krishna-yajurveda-taittiriya-samhita
category: stotram
name:
  english: KYTS Jata 4.6 Asmannoorjam Parvate - Krishna Yajurveda Taittiriya Samhita
content:
  english: nnurja murja mashma mparvate parvata urja murja parvate shishriyanagm shishriyana mparvate
    parvate shishriyanam | va~te vate shishriyanagm shishriyanam vate parjanye parjanye vate vate parjanye
    parjanye varunasya varunasya parjanye parjanye varunasya | varunasya shushme shushme varunasya varunasya
    shushme adbhya oshadhibhya oshadhibhyo adbhyo adbhya oshadhibhyah | oshadhibhyo vanaspatibhyo vanaspatibhya
    oshadhibhya oshadhibhyo vanaspatibhyah | vanaspatibhyo 'dhyadhi vanaspatibhyo vanaspatibhyo 'dhi |
    vanaspatibhya iti vanaspati adhi sambhritagm sambhrita madhyadhi sambhritam | ntagm sambhritagm sambhrita
    isha murja murja misha misha murja ndhatta dhattorja murja dhatta maruto maruto dhatta dhatta marutah
    | ssagmrarana maruto maruta sagmrarana iti sam ashmagg ste te ashma shug riccha tvricchatu shuk chugricchatu
    | ya~ mriccha tvricchatu yam | ndvishmo dvishmo yam dvishma iti dvishmah | samudrasya tva tva samudrasya
    samudrasya tva | tva 'vakaya 'vakaya tva tva 'vakaya | avakaya 'gne 'gne 'vakaya 'vakaya 'gne agne
    pari paryagne 'gne pari | pari vyayamasi vyayamasi pari pari vyayamasi | vyayamasiti vyayamasi | pavako
    asmabhya masmabhya mpavakah pavako asmabhya shshivo asmabhya masmabhyagm shivah | himasya tva tva
    himasya himasya tva | tva jarayuna jarayuna tva tva jarayuna | jarayuna 'gne 'gne jarayuna jarayuna
    'gne agne pari paryagne 'gne pari | pari vyayamasi vyayamasi pari pari vyayamasi | vyayamasiti vyayamasi
    | pavako asmabhya masmabhya mpavakah pavako asmabhya shshivo asmabhya masmabhyagm shivah | nnupopa
    jmann | || upa vetase vetasa upopa vetase | vetase 'vattara mavattaram ve~tase vetase 'vattaram |
    nnadishu nadi shvavattara mavattara nadishva nadishu nadishva | mpitta magne 'gne pittam | apa masya
    syapa mapa masi | manduki tabhi stabhi rmanduki manduki tabhih | tabhira tabhi stabhira | a gahi gahya
    gahi | gahi sa sa gahi gahi sa | sema mimagm sa semam | yajnamiti yajnam | pavakavarnagm shivagm shiva
    mpavakavarnagm shivam | pavakavarnamiti pavaka nkridhi kridhi shivagm shiva pavaka a pavake pavaka
    a | a citayantya citayantya ''citayantya | citayantya kripa kripa citayantya citayantya kripa | nruruce
    ruruce kshaman kshama ruruca ushasa ushaso ruruce ruruca ushasah | ushaso na noshasa ushaso na | na
    bhanuna bhanuna na na bhanuna nnetasha syaitashasya yaman etashasya nun vetasha syaitashasya nu |
    nu rane rane nu nu rane yo ghrine ghrine yo yo ghrine | na tatrishana statrishano na na tatrishanah
    | tatrishano ajaro ajara statrishana statrishano ajarah | agne pavaka pavakagne 'gne pavaka | pavaka
    rocisha rocisha pavaka pavaka rocisha rocisha mandraya mandraya rocisha rocisha mandraya mandraya
    deva deva mandraya mandraya deva | deva jihvaya jihvaya deva deva jihvaya jihvayeti jihvaya ndeva
    na devan | vakshi yakshi yakshi vakshi vakshi yakshi | yakshi ca ca yakshi yakshi ca | nah pavaka
    pavaka no nah pavaka | pavaka didivo didivah pavaka pavaka didivah | didivo 'gne 'gne didivo didivo
    'gne ndevagm agne 'gne devan | devagm ihe ha deva ya~jna mupopa yajnam | ca no nashca ca nah | apa
    mida mida mapa mapa midam | nyayanagm samudrasya samudrasya nyayana nnyayanagm samudrasya | samudrasya
    niveshana nniveshanagm samudrasya samudrasya niveshanam | nte te anya manya ttapantu tapa ntvasma
    dasma tapantu hetayo hetaya stapantu tapantu hetayah | hetayah pavakah pavako hetayo hetayah pavakah
    | pavako asmabhya masmabhya mpavakah pavako asmabhya shshivo asmabhya masmabhyagm shivah | nama ste
    te namo nama ste | te harase harase te te harase | harase shocishe shocishe harase harase shocishe
    shocishe namo namah shocishe shocishe namah | nama ste te namo nama ste | te astvastu te te astu |
    astvarcishe arcishe astva stvarcishe arcisha ityarcishe nte te anya manya ttapantu tapa ntvasma dasma
    tapantu hetayo hetaya stapantu tapantu hetayah | hetayah pavakah pavako hetayo hetayah pavakah | pavako
    asmabhya masmabhya mpavakah pavako asmabhya shshivo asmabhya masmabhyagm shivah | dvan nrishade nrishade
    vat | vadaphsushade aphsushade va dvadaphsushade aphsushade vat | aphsushada ityaphsu dvanasade vanasade
    va dvanasade vanasade vat | barhishada iti bar tthsuvarvide suvarvide va tthsuvarvide suvarvide vat
    | suvarvida iti suvah ye deva deva ye ye devah | ndeva deva devana ya~jniya yajniya devana yajniya
    yajniyanam ya~jniya yajniya yajniyanam | va~thsarina mupopa sam mbhaga mupopa bhagam | bhaga masata
    asate bhaga ahutado havisho havisho 'hutado 'hutado havishah | havisho yajne yajne havisho havisho
    yajne | yajne yajne asminn | mmadhuno madhuno juhuddhva madhuno ghritasya ghritasya madhuno madhuno
    ghritasya | ghritasyeti ghritasya | ye deva deva ye ye devah | deva deveshu deveshu deva deva deveshu
    | deve shvadhyadhi deveshu deve shvadhi | ndevatva madhyadhi devatvam | ndevatva mayann | ye brahmano
    brahmano ye ye brahmanah | brahmanah puraetarah puraetaro brahmano brahmanah puraetarah | puraetaro
    asyasya puraetarah puraetaro asya | puraetara iti purah yebhyo na na yebhyo yebhyo na | rite pavate
    pavata rita rite pavate | pavate dhama dhama pavate pavate dhama | te divo diva ste te divah | divo
    na na divo divo na | na prithivyah prithivya na na prithivyah | prithivya adhyadhi prithivyah prithivya
    adhi | adhi snushu snu shvadhyadhi snushu | snushviti snushu | pranada apanada apanadah pranadah pranada
    apanadah | pranada iti prana apanada vyanada vyanada apanada apanada vyanadah | vyanada shcakshurda
    shcakshurda vyanada vyanada shcakshurdah | vyanada iti vyana cakshurda varcoda varcoda shcakshurda
    shcakshurda varcodah | cakshurda iti cakshuh varcoda varivoda varivoda varcoda varcoda varivodah |
    varcoda iti varcah varivoda iti varivah nte te anya manya ttapantu tapa ntvasma dasma tapantu hetayo
    hetaya stapantu tapantu hetayah | hetayah pavakah pavako hetayo hetayah pavakah | pavako asmabhya
    masmabhya mpavakah pavako asmabhya shshivo asmabhya masmabhyagm shivah | agni stigmena tigmena gni
    ragni stigmena | tigmena shocisha shocisha tigmena tigmena shocisha dyagmsa cchocisha shocisha yagmsat
    | rno no agni ragni no vagmsate vagmsate no no vagmsate | vagmsate rayigm rayim va~gmsate vagmsate
    rayim | ena 'nikena nike nainaina 'nikena | anikena suvidatrah suvidatro 'nikena nikena suvidatrah
    | suvidatro asme asme suvidatrah suvidatro asme | asme yashta yashta 'sme asme yashta yashta yashta
    devan | devagm ayajishtha ayajishtho deva ndevagm ayajishthah | ssvasti sva styayajishtha ayajishtha
    svastiti svasti | adabdho gopa gopa adabdho adabdho gopah | gopa utota gopa gopa uta | uta no na utota
    nah | nah paraspah paraspa no nah paraspah | paraspa agne 'gne paraspah paraspa agne dyuma dutota
    dyuma dreva dutota revat | ddidihi didihi reva didihiti didihi | || ya imema yo ya ima | ima vishva
    vishvemema vishva vishva bhuvanani bhuvanani vishva vishva bhuvanani | bhuvanani juhvaj juhva dbhuvanani
    bhuvanani juhvat | rjuhvaj juhvadrishih | rishir hota hota r hota nishasada nishasada hota hota nishasada
    | nishasada pita pita nishasada nishasada pita | pita no nah pita pita nah | sa ashisha ''shisha sa
    sa ashisha ndravina mashisha ''shisha dravinam | dravina micchamana icchamano dravina ndravina micchamanah
    | icchamanah paramacchadah paramacchada icchamana icchamanah paramacchadah | paramacchado vare vare
    paramacchadah paramacchado vare paramacchada iti parama a vivesha vivesha vivesha | vishvakarma manasa
    manasa vishvakarma vishvakarma manasa | vishvakarmeti vishva nmanasa manasa yat | dvihaya vihaya ya
    vihaya dhata dhata vihaya vihaya dhata | dhata vidhata vidhata dhata dhata vidhata | vidhata parama
    parama vidhata vidhata parama | paramotota parama paramota | khsandri gutota sandrik | tesha mishta
    nishtani tesha ntesha mishtani | ishtani sagm sa mishta nishtani sam | sa mishesha sagm sa misha |
    isha madanti madanti shesha madanti | madanti yatra yatra madanti madanti yatra | yatra yatra saptarshin
    | saptarshiniti sapta eka mahu rahu reka meka mahuh | yo no no yo yo nah | nah pita pita no nah pita
    | pita janita janita pita pita janita | janita yo yo janita janita yah | yo vidhata vidhata yo yo
    vidhata | vidhata yo yo vidhata vidhata yah | yo no no yo yo nah | jajaneti jajana | || nnamadha namadha
    devana namadha eka eko namadha namadha ekah | eka evaivaika eka eva | tagm samprashnagm samprashna
    ntagm samprashnam | mbhuvana bhuvana samprashnagm samprashna bhuvana yanti yanti bhuvana bhuvana yanti
    | yantyanya 'nya yanti yantyanya | a 'yajanta yajanta 'yajanta | ndravina mayajanta yajanta dravinam
    | ndravinagm sam | sa masma asmai sagm sa masmai | asma rishaya rishayo asma asma rishayah | rishayah
    purve purva rishaya rishayah purve purve jaritaro jaritarah purve purve jaritarah | jaritaro na na
    jaritaro jaritaro na | na bhuna bhuna na na bhuna | asurta surta surta 'surta 'surta surta surta rajaso
    rajasa ssurta surta rajasah | rajaso vimane vimane rajaso rajaso vimane vimane ye ye vimane vimane
    ye | ye bhutani bhutani ye ye bhutani | nbhutani bhutani samakrinvann | nnimani mani samakrinva samakrinvanniti
    sam vidatha yo yo vidatha vidatha yah | njajana jajaneda mida jajana nya danyaj jajana jajananyat
    | yu~shmaka manya danya yushmaka mantara mantaram yu~shmaka mantaram | mbhavati bhava tyantara mantara
    niharena pravritah pravrita niharena niharena pravritah | pravrita jalpya jalpya pravritah pravrita
    jalpya jalpya ca ca jalpya jalpya ca | casutripo asutripashca casutripah | asutripa ukthashasa ukthashaso
    asutripo asutripa ukthashasah | ukthashasa shcaranti cara ntyukthashasa ukthashasa shcaranti | ukthashasa
    ityuktha carantiti caranti | paro diva diva parah paro diva | diva parah paro diva diva parah | para
    enaina parah para ena | ena prithivya prithivyainaina prithivya | || prithivya parah parah prithivya
    prithivya parah | rdevebhih parah paro devebhih | devebhi rasurai rasurai rdevebhi rasuraih | rguha
    guha 'surai rasurai ndaddhre daddhre prathama daddhra apa apo daddhre daddhra apah | apo yatra yatrapa
    apo yatra | yatra deva deva yatra yatra devah | ssamagacchanta samagacchanta deva deva samagacchanta
    vishve vishve samagacchanta samagacchanta vishve ndaddhre daddhre prathama daddhra apa apo daddhre
    daddhra apah | apo yatra yatrapa apo yatra | yatra deva deva yatra yatra devah | ssamagacchanta samagacchanta
    deva deva samagacchanta vishve vishve samagacchanta samagacchanta vishve ajasya nabhau nabha vajasya
    jasya nabhau nabha vadhyadhi nabhau nabha vadhi | adhyeka meka madhya dhyeka eka marpita marpita meka
    meka marpitam | nnarpita marpitam bhuvana madhyadhi bhuvana shrita madhyadhi shritam | shritamiti
    shritam | vishvakarma hi hi vishvakarma vishvakarma hi | vishvakarmeti vishva hyajanishta janishta
    hi hyajanishta | ajanishta devo devo 'janishta janishta devah | dgandharvo gandharva idi dgandharvo
    gandharvo abhavat | dvitiya iti dvitiyah | tritiyah pita pita tritiya stritiyah pita | pita janita
    janita pita pita janita | janitaushadhina moshadhina njanita janitaushadhinam | oshadhina mapa mapa
    moshadhina moshadhina mapam | || tpurutra purutra 'dadha dadadha cakshushah pita pita cakshusha shcakshushah
    pita | pita manasa manasa pita pita manasa | manasa hi hi manasa manasa hi | hi dhiro dhiro hi hi
    dhirah | ndhiro dhiro ghritam | ene ajana dajana dene ene ajanat | nnannamane nannamane ajanadajana
    nannamane iti nannamane | idanta anta ididantah anta adadrigmhanta dadrigmhanta nta anta adadrigmhanta
    | adadrigmhanta purve purve adadrigmhanta dadrigmhanta purve tpurve purva at | ddyavaprithivi dyavaprithivi
    idi dyavaprithivi apratheta mapratheta ndyavaprithivi dyavaprithivi aprathetam | dyavaprithivi iti
    dyava aprathetamityaprathetam | vishvatashcakshu rutota vishvatashcakshu rvishvatashcakshu ruta |
    vishvatashcakshuriti vishvatah uta vishvatomukho vishvatomukha utota vishvatomukhah | vishvatomukho
    vishvatohasto vishvatohasto vishvatomukho vishvatomukho vishvatohastah | vishvatomukha iti vishvatah
    vishvatohasta utota vishvatohasto vishvatohasta uta | vishvatohasta iti vishvatah dvishvataspa dutota
    vishvataspat | vishvataspaditi vishvatah mbahubhyagm sagm sa nnamati namati bahubhya bahubhyamiti
    bahu nnamati namati sam | mpatatraih patatrai rdyavaprithivi dyavaprithivi patatraih patatrai dyavaprithivi
    janayan janaya ndyavaprithivi dyavaprithivi janayann | dyavaprithivi iti dyava ndevo devo janayan
    janaya deva eka eko devo deva ekah | asida dhishthana madhishthana masi dasi dadhishthana adhishthana
    marambhana marambhana madhishthana madhishthana marambhanam | tkatama darambhana marambhana janayan
    vishvakarma vishvakarma janayan janayan vishvakarma | || vishvakarma vi vi vishvakarma vishvakarma
    vi | vishvakarmeti vishva dya maurno daurno nmahina mahinaurno daurno mahina vishvacaksha vishvacaksha
    mahina mahina vishvacakshah | vishvacaksha iti vishva dvriksho vriksha asit | dyato yata asi dasi
    yato dyavaprithivi dyavaprithivi yato yato dyavaprithivi | dyavaprithivi nishtatakshu rdyavaprithivi
    dyavaprithivi nishtatakshuh | dyavaprithivi iti dyava nishtatakshuriti nih manishino manasa manasa
    manishino manishino manasa | manasa pricchata pricchata manasa manasa pricchata | tpricchata pricchatet
    | yadaddhya tishtha daddhyatishtha dyadaddhyatishthat | dbhuvanani bhuvana nyaddhyatishtha daddhyatishtha
    addhyatishthadityadhi nbhuvanani bhuvanani dharayann | dharayanniti dharayann | te dhamani dhamani
    te te dhamani | dhamani paramani paramani dhamani dhamani paramani | paramani ya ya paramani paramani
    ya | ya 'vama 'vama ya ya 'vama | avama ya ya 'vama 'vama ya | ya maddhyama maddhyama ya ya maddhyama
    | maddhyama vishvakarman nmaddhyama maddhyama vishvakarmann | nnutota vishvakarman vishvakarmanniti
    vishva shshiksha shiksha sakhibhyah | sakhibhyo havishi havishi sakhibhya ssakhibhyo havishi | ssvadhavo
    havishi havishi svadhavah | svadhava iti svadha ya~jasva yajasva svayagg njushano jushanastanuva jushana
    iti jushanah | vishvakarmana mutaya utaye vishvakarmanam vi~shvakarmana mutaye vishvakarmanamiti vishva
    mmanoyuja mutaya utaye manoyuja va~je vaje manoyuja vaje adyadya vaje vaje adya | adya huvema huvemadyadya
    huvema | no nedishtha nedishtha no no nedishtha | nedishtha havanani havanani nedishtha nedishtha
    havanani | havanani joshate joshate havanani havanani joshate | joshate vishvashambhu rjoshate joshate
    vishvashambhuh | vishvashambhu ravase 'vase vishvashambhu rvishvashambhu ravase | vishvashambhuriti
    vishva avase sadhukarma sadhukarma 'vase 'vase sadhukarma | sadhukarmeti sadhu havisha havisha vishvakarman
    vishvakarmanniti vishva havisha vavridhano vavridhano havisha havisha vavridhanah | va~vridhano vavridhana
    ya~jasva yajasva svayagg njushano jushana stanuva jushana iti jushanah | muhya ntvanye anye muhyantu
    muhya ntvanye | anye abhito abhito anye anye abhitah | ssapatna abhito abhitah sapatnah sapatna iheha
    sapatna ihasmaka masmaka mihe hasmaka mmaghava maghava 'smaka masmaka rmaghava maghava surih | surira
    stvastu suri havisha havisha vishvakarman vishvakarmanniti vishva havisha vardhanena vardhanena havisha
    havisha vardhanena | va~rdhanena vardhanena tratara tratara mindra mindra indra makrino rakrino rindra
    mindra makrinoh | akrino ravaddhya mavaddhya makrino rakrino ravaddhyam | avaddhyamityavadhyam | tasmai
    visho visha stasmai tasmai vishah | sa manamanta namanta sagm sa manamanta | anamanta purvih purvi
    ranamanta namanta purvih | mpurvih purvi rayam | aya mugra ugro 'ya maya mugrah | ugro vihavyo vihavya
    ugra ugro vihavyah | vihavyo yatha yatha vihavyo vihavyo yatha samudraya vayunaya vayunaya samudraya
    samudraya vayunaya | vayunaya sindhunagm sindhunam va~yunaya vayunaya sindhunam | mpataye pataye sindhunagm
    sindhuna pataye namo nama spataye pataye namah | nadinagm sarvasagm sarvasa nnadinagm sarvasam | mpitre
    pitre sarvasagm sarvasa pitre juhuta juhuta pitre pitre juhuta | juhuta vishvakarmane vishvakarmane
    juhuta juhuta vishvakarmane | vishvakarmane vishva vishva vishvakarmane vishvakarmane vishva vishvakarmana
    iti vishva vishva 'ha 'ha vishva vishva 'ha aha 'martya mamartya maha 'ha 'martyam | havi ramartya
    mamartyagm havih | udena mena mududenam | ena muttara muttara mena mena muttaram | nnaya nayottara
    muttara nayagne 'gne naya nayagne agne ghritena ghritenagne 'gne ghritena | ghritena huta huta ghritena
    ghritena huta | raya sposhena poshena rayo raya sposhena | mposhena poshena sam | sagm srija srija
    sagm sagm srija | prajaya srija srija prajaya prajaya ca ca prajaya ca dhanena dhanena ca ca dhanena
    | dhanena ca ca dhanena dhanena ca | indre mamima mindre ndremam | mpratara mima mima nkridhi kridhi
    pratara kridhi sajatanagm sajatana nkridhi kridhi sajatana thsajatanagm sajatana masat | sa mena menagm
    sagm sa menam | va~rcasa varcasaina menam varcasa srija srija varcasa varcasa srija | srija devebhyo
    devebhyah srija srija devebhyah | devebhyo bhagadha bhagadha devebhyo devebhyo bhagadhah | dbhagadha
    bhagadha asat | yasya kurmah kurmo yasya yasya kurmah | havih kurmah kurmo havih | rgrihe grihe havir
    agne vardhaya vardhayagne agne vardhaya | va~rdhaya vardhaya tvam | tasmai deva deva stasmai tasmai
    devah | deva adhyadhi deva deva adhi | nnadhyadhi bravann | ca brahmano brahmanashca ca brahmanah
    | brahmana spatish pati rbrahmano brahmana spatih | u tva tva vu tva | tva vishve vishve vishve deva
    deva vishve vishve devah | deva agne 'gne deva deva agne agne bharantu bhara ntvagne 'gne bharantu
    | bharantu cittibhi shcittibhi rbharantu bharantu cittibhih | cittibhiriti citti no bhava bhava no
    no bhava | shshivatamo bhava bhava shivatamah | supratiko vibhavasu ssupratiko vibhavasuh | vibhavasuriti
    vibha panca disho dishah panca panca dishah | yajna mava ntvavantu yajnam rdevi rava ntvavantu devih
    | apamati mamati mapapamatim | ndurmati mamati mamati mbadhamana badhamana durmati badhamana iti badhamanah
    | raya sposhe poshe rayo raya sposhe mposhe poshe yajnapatim | yajnapati mabhajanti rabhajanti ya~jnapati
    mabhajantih | yajnapatimiti yajna raya sposhe poshe rayo raya sposhe poshe adhyadhi poshe poshe adhi
    | adhi yajno yajno adhyadhi yajnah | dyajno yajno asthat | thsamiddhe samiddhe astha dastha samiddhe
    agna vagnau samiddhe samiddhe agnau | agna vadhyadhyagna vagna vadhi | adhi mamahano mamahano adhyadhi
    mamahanah | mamahana iti mamahanah | ukthapatra idya idya ukthapatra ukthapatra idyah | ukthapatra
    ityuktha idyo gribhito gribhita idya idyo gribhitah | ngribhito gribhita staptam | mparigrihya parigrihya
    gharma parigrihya yajanta yajanta parigrihya parigrihya yajanta | ayajantetyayajanta | dyadurjorja
    yat | yajna mashamanta shamanta yajnam ashamanta deva deva ashamanta shamanta devah | deva daivyaya
    daivyaya deva deva daivyaya | daivyaya dhartre dhartre daivyaya daivyaya dhartre | dhartre joshtre
    joshtre dhartre dhartre joshtre joshtra iti joshtre shatapayah parigrihya parigrihya shatapaya shshatapayah
    parigrihya | parigrihya deva devah parigrihya parigrihya devah | ndeva deva yajnam | ayannityayann
    | suryarashmir harikesho harikesha ssuryarashmir harikeshah | suryarashmiriti surya tpurasta ddharikesho
    harikeshah purasta thsavita savita purasta rjyotih savita savita jyotih | jyoti ruduj jyoti udayagm
    ayagm udu dayan | ayagm ajasra majasra mayagm ayagm ajasram | ajasramityajasram | tasya pusha pusha
