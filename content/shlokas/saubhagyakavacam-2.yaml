id: saubhagyakavacam-2
category: kavacha
name:
  english: saubhagyakavacam 2
  devanagari: सौभाग्यकवचम् २
content:
  english: shonaprabham somakalavatamsam panisphuratpancasharekshucapam | pranapriyam naumi pinakapanim
    konatrayastham kuladaivatam me || ikshukodandapushpeshupashankushacaturbhujam | udyatsuryanibham vande
    devim tripurasundarim || atha kavacam | om shikhayam satatam patu mahatripurasundari | shirah kameshvari
    nitya tatpurvangam bhagamalini || 1|| nityaklinna ca taddaksham bherunda pashcimam shirah | vahnivasinyasya
    vamam vajreshvaryalakamstatha || 2|| shivaduti lalatam ca tvarita tasya dakshinam | tadvamaparshvamavatattathaiva
    kulasundari || 3|| nitya patu bhruvormadhyam bhruvam nilapatakini | vamabhruvam ca vijaya nayanam
    sarvamangala || 4|| jvalamalinyakshi vamam citra rakshatu nasikam | dakshashrotram tu ganapah svayam
    patu mahodyamah || 5|| dakshasavyantu batukah kapolam kshetrapalakah | dakshanasaputam durga tadanyam
    patu bharati || 6|| anima dakshinam shankham mahima ca tadanyakam | dakshagandam tu garima ladhima
    cottaram tatha || 7|| urdhvamoshtham praptisiddhih prakamyamadharoshthakam | ishitvamurdhvadantamshca
    vashitvamadharamstatha || 8|| ichasiddhistu rasanam mokshasiddhistu talukam | talumuladvayam brahmi
    maheshvaryauttarakshatam || 9|| kumari cibukam patu tadadhah patu vaishnavi | kantham rakshatu varahi
    indrani rakshatadadhah || 10|| krikatikam tu camunda mahalakshmistu sarvatah | sarvasamkshobhinimudra
    skandham rakshatu dakshinam || 11|| tadanyam dravinimudra payadamsadvayam kramat | akarshavashyamudre
    dve conmadinyatha dakshinam || 12|| bhujam mahankusha vamam khecari dakshakakshakam | vamakaksham
    bijamudra yonihsthaddakshabahukam || 13|| lasattrikhandini mudra vamabahum prapalayet | kamakarshinika
    nityam rakshataddakshakurparam || 14|| kurparam vamamavatadbudhyakarshinika tatha | ahankarakarshini
    tu prakoshtham patu dakshinam || 15|| shabdakarshinika vamam sparshakarshinikavatu | tanmadhyam dakshinam
    patu rupakarshiniketaram || 16|| rasakarshinika patu manibandham ca dakshinam | gandhakarshinika vamam
    cittakarshinikavatu || 17|| karabham dakshinam dhairyakarshini patu vamakam | smrityakarshinyasau
    panim namakarshini dakshinam || 18|| bijakarshinyasau payatsatatam dakshinangulih | atmakarshinyadakshinyamamritakarshini
    nakhan || 19|| sharirakarshini vamanakhan rakshatu sarvada | anangakusuma shaktih patu dakshastanopari
    || 20|| anangamekhala canyastanordhvamabhirakshatu | anangamadana dakshastanam taccucukam punah ||
    21|| rakshatadanisham devi anangamadanatura | stanayormadhyamam payadanangamadanatura anangarekha
    vamanca vakshojam tasya cucukam || 22|| anangavegini krodamanangasyankushavatu | anangamalini payadvakshasthalamaharnisham
    || 23|| sarvasamkshobhini hricca sarvavidravini para | kukshim sarvakarshini patu patu parshvam tu
    dakshinam || 24|| ahladini vamaparshvam madhyam sammohini para | sa sarvastambhini prishtham nabhim
    vai sarvajrimbhini || 25|| vashankari vastidesham katim sa sarvaranjini | unmadini tu sarvadya payajjaghanamandalam
    || 26|| sarvarthasadhinishaktirnitambam rakshatadatha | dakshasphicam sada patu sarvasampatprapurini
    || 27|| sarvamantramayishaktih patu vamasphicam mama | payatkakundaradvandvam sarvadvandvakshayankari
    || 31|| sarvasiddhiprada devi vrishanam patu dakshinam | sarvasampatprada devi vrishanam patu vamakam
    || 32|| sarvapriyankari devi guhyam rakshatu me sada | medhram rakshatu me devi sarvamangalakarini
    || 33|| sarvakamaprada devi patu mushkam tu dakshinam | tayormaddhyam sada patu sarvakamaphalaprada
    | payattadanyam devi tu sarvaduhkhavimocini || 34|| sarvamrityuprashamani devi patu gudam mama | patu
    devi dehamaddhyam sarvavighnanivarini || 35|| sarvangasundari devi rakshataddakshasakthikam | vamasakthitalam
    payatsarvasaubhagyadayini || 36|| ashthivam mama sarvajna devi rakshatu dakshinam | anyashthivam sarvashaktirdevi
    patu ciram mama || 37|| sarvaishvaryaprada devi dakshajanum sadavatu | sarvajnanamayi devi tadanyajjanu
    rakshatu || 38|| avyadiyam dakshajangham sarvavyadhivinashini | tadanyam patu devi ca sarvadharasvarupini
    || 39|| sarvapapahara devi dakshagul
  devanagari: शोणप्रभं सोमकलावतंसं पाणिस्फुरत्पञ्चशरेक्षुचापम् । प्राणप्रियं नौमि पिनाकपाणिं कोणत्रयस्थं
    कुलदैवतं मे ॥ इक्षुकोदण्डपुष्पेषुपाशाङ्कुशचतुर्भुजाम् । उद्यत्सूर्यनिभां वन्दे देवीं त्रिपुरसुन्दरीम्
    ॥ अथ कवचम् । ॐ शिखायां सततं पातु महात्रिपुरसुन्दरी । शिरः कमेश्वरी नित्या तत्पूर्वाङ्गं भगमालिनी ॥
    १॥ नित्यक्लिन्ना च तद्दक्षं भेरुण्डा पश्चिमं शिरः । वह्निवासिन्यस्य वामं वज्रेश्वर्यलकांस्तथा ॥ २॥
    शिवदूती ललाटं च त्वरिता तस्य दक्षिणम् । तद्वामपार्श्वमवतात्तथैव कुलसुन्दरी ॥ ३॥ नित्या पातु भ्रुवोर्मध्यं
    भ्रुवं नीलपताकिनी । वामभ्रुवं च विजया नयनं सर्वमङ्गला ॥ ४॥ ज्वालामालिन्यक्षि वामं चित्रा रक्षतु नासिकाम्
    । दक्षश्रोत्रं तु गणपः स्वयं पातु महोद्यमः ॥ ५॥ दक्षसव्यन्तु बटुकः कपोलं क्षेत्रपालकः । दक्षनासापुटं
    दुर्गा तदन्यं पातु भारती ॥ ६॥ अणिमा दक्षिणं शङ्खं महिमा च तदन्यकम् । दक्षगण्डं तु गरिमा लधिमा चोत्तरं
    तथा ॥ ७॥ ऊर्ध्वमोष्ठं प्राप्तिसिद्धिः प्राकाम्यमधरोष्ठकम् । ईषित्वमूर्ध्वदन्तांश्च वशित्वमधरांस्तथा
    ॥ ८॥ इछासिद्धिस्तु रसनां मोक्षसिद्धिस्तु तलुकम् । तालुमूलद्वयं ब्राह्मी माहेश्वर्यौत्तरक्षताम् ॥ ९॥
    कुमारी चिबुकं पातु तदधः पातु वैष्णवी । कण्ठं रक्षतु वाराही इन्द्राणी रक्षतादधः ॥ १०॥ कृकाटिकां तु
    चामुण्डा महालक्ष्मीस्तु सर्वतः । सर्वसंक्षोभिणीमुद्रा स्कन्धं रक्षतु दक्षिणम् ॥ ११॥ तदन्यं द्राविणीमुद्रा
    पायादंसद्वयं क्रमात् । आकर्षवश्यमुद्रे द्वे चोन्मादिन्यथ दक्षिणम् ॥ १२॥ भुजं महाङ्कुशा वामं खेचरी
    दक्षकक्षकम् । वामकक्षं बीजमुद्रा योनिःस्थाद्दक्षबाहुकम् ॥ १३॥ लसत्त्रिखण्डिनी मुद्रा वामबाहुं प्रपालयेत्
    । कामाकर्षिणिका नित्यं रक्षताद्दक्षकूर्परम् ॥ १४॥ कूर्परं वाममवताद्बुध्याकर्षिणिका तथा । अहङ्काराकर्षिणी
    तु प्रकोष्ठं पातु दक्षिणम् ॥ १५॥ शब्दाकर्षिणिका वामं स्पर्शाकर्षिणिकावतु । तन्मध्यं दक्षिणं पातु रूपाकर्षिणिकेतरम्
    ॥ १६॥ रसाकर्षिणिका पातु मणिबन्धं च दक्षिणम् । गन्धाकर्षिणिका वामं चित्ताकर्षिणिकावतु ॥ १७॥ करभं दक्षिणं
    धैर्याकर्षिणी पातु वामकम् । स्मृत्याकर्षिण्यसौ पाणिं नामाकर्षिणि दक्षिणम् ॥ १८॥ बीजाकर्षिण्यसौ पायात्सततं
    दक्षिणाङ्गुलीः । आत्माकर्षिण्यदक्षिण्याममृताकर्षिणी नखान् ॥ १९॥ शरीराकर्षिणी वामनखान् रक्षतु सर्वदा
    । अनङ्गकुसुमा शक्तिः पातु दक्षस्तनोपरि ॥ २०॥ अनङ्गमेखला चान्यस्तनोर्ध्वमभिरक्षतु । अनङ्गमदना दक्षस्तनं
    तच्चूचुकं पुनः ॥ २१॥ रक्षतादनिशं देवी अनङ्गमदनातुरा । स्तनयोर्मध्यमं पायादनङ्गमदनातुरा अनङ्गरेखा वामञ्च
    वक्षोजं तस्य चूचुकम् ॥ २२॥ अनङ्गवेगिनी क्रोडामनङ्गस्याङ्कुशावतु । अनङ्गमालिनी पायाद्वक्षस्थलमहर्निशम्
    ॥ २३॥ सर्वसंक्षोभिणी हृच्च सर्वविद्राविणी परा । कुक्षिं सर्वाकर्षिणी पातु पातु पार्श्वं तु दक्षिणम्
    ॥ २४॥ आह्लादिनी वामपार्श्वं मध्यं सम्मोहिनी परा । सा सर्वस्तम्भिनी पृष्ठं नाभिं वै सर्वजृम्भिणी ॥
    २५॥ वशङ्करी वस्तिदेशं कटिं सा सर्वरञ्जिनी । उन्मादिनी तु सर्वाद्या पायाज्जघनमण्डलम् ॥ २६॥ सर्वार्थसाधिनीशक्तिर्नितम्बं
    रक्षतादथ । दक्षस्फिचं सदा पातु सर्वसम्पत्प्रपूरिणी ॥ २७॥ सर्वमन्त्रमयीशक्तिः पातु वामस्फिचं मम । पायात्ककुन्दरद्वन्द्वं
    सर्वद्वन्द्वक्षयङ्करी ॥ ३१॥ सर्वसिद्धिप्रदा देवी वृषणं पातु दक्षिणम् । सर्वसम्पत्प्रदा देवी वृषणं
    पातु वामकम् ॥ ३२॥ सर्वप्रियङ्करी देवी गुह्यं रक्षतु मे सदा । मेढ्रं रक्षतु मे देवी सर्वमङ्गलकारिणी
    ॥ ३३॥ सर्वकामप्रदा देवी पातु मुष्कं तु दक्षिणम् । तयोर्मद्ध्यं सदा पातु सर्वकामफलप्रदा । पायात्तदन्यं
    देवी तु सर्वदुःखविमोचिनी ॥ ३४॥ सर्वमृत्युप्रशमनी देवी पातु गुदं मम । पातु देवी देहमद्ध्यं सर्वविघ्ननिवारिणी
    ॥ ३५॥ सर्वाङ्गसुन्दरी देवी रक्षताद्दक्षसक्थिकम् । वामसक्थितलं पायत्सर्वसौभाग्यदायिनी ॥ ३६॥ अष्ठीवं
    मम सर्वज्ञा देवी रक्षतु दक्षिणम् । अन्यष्ठीवं सर्वशक्तिर्देवी पातु चिरं मम ॥ ३७॥ सर्वैश्वर्यप्रदा
    देवी दक्षजानुं सदावतु । सर्वज्ञानमयी देवी तदन्यज्जानु रक्षतु ॥ ३८॥ अव्यादियं दक्षजङ्घां सर्वव्याधिविनाशिनी
    । तदन्यं पातु देवी च सर्वाधारस्वरूपिणी ॥ ३९॥ सर्वपापहरा देवी दक्षगुल्
