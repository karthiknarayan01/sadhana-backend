id: shvetakritamvishnustotram
category: stotram
name:
  english: shvetakritamvishnustotram
  devanagari: श्वेतकृतंविष्णुस्तोत्रम्
content:
  english: shvetakritam vishnustotram shveta uvaca | om namo vasudevaya namah sankarshanaya ca | pradyumnayaniruddhaya
    namo narayanaya ca || 34|| namo'stu bahurupaya vishvarupaya vedhase | nirgunayapratarkyaya shucaye
    shuklakarmane || 35|| om namah padmanabhaya padmagarbhodbhavaya ca | namo'stu padmavarnaya padmahastaya
    te namah || 36|| om namah pushkarakshaya sahasrakshaya midhushe | namah sahasrapadaya sahasrabhuja
    manyave || 37|| om namo'stu varahaya varadaya sumedhase | varishthaya varenyaya sharanyayacyutaya
    ca || 38|| om namo balarupaya balapadmaprabhaya ca | balarkasomanetraya munjakeshaya dhimate || 39||
    keshavaya namo nityam namo narayanaya ca | madhavaya varishthaya govindaya namo namah || 40|| om namo
    vishnave nityam devaya vasuretase | madhusudanaya namah shuddhayamshudharaya ca || 41|| namo'nantaya
    sukshmaya namah shrivatsadharine | trivikramaya ca namo divyapitambaraya ca || 42|| srishtikartre
    namastubhyam goptre dhatre namo namah | namo'stu gunabhutaya nirgunaya namo namah || 43|| namo vamanarupaya
    namo vamanakarmane | namo vamananetraya namo vamanavahine || 44|| namo ramyaya pujyaya namo'stvavyaktarupine
    | apratarkyaya shuddhaya namo bhayaharaya ca || 45|| samsararnavapotaya prashantaya svarupine | shivaya
    saumyarupaya rudrayottaranaya ca || 46|| bhavabhangakrite caiva bhavabhogapradaya ca | bhavasanghatarupaya
    bhavasrishtikrite namah || 47|| om namo divyarupaya somagnishvasitaya ca | somasuryamshukeshaya gobrahmanahitaya
    ca || 48|| om namo riksvarupaya padakramasvarupine | rikstutaya namastubhyam namo riksadhanaya ca
    || 49|| om namo yajusham dhatre yajurupadharaya ca | yajuryajyaya jushtaya yajusham pataye namah ||
    50|| om namah shripate deva shridharaya varaya ca | shriyah kantaya dantaya yogicintyaya yogine ||
    51|| om namah samarupaya samadhvanivaraya ca | om namah samasaumyaya samayogavide namah || 52|| samne
    ca samagitaya om namah samadharine | samayajnavide caiva namah samakaraya ca || 53|| namastvatharvashirase
    namo'tharvasvarupine | namo'stvatharvapadaya namo'tharvakaraya ca || 54|| om namo vajrashirshaya madhukaitabhaghatine
    | mahodadhijalasthaya vedaharanakarine || 55|| namo diptasvarupaya hrishikeshaya vai namah | namo
    bhagavate tubhyam vasudevaya te namah || 56|| narayana namastubhyam namo lokahitaya ca | om namo mohanashaya
    bhavabhangakaraya ca || 57|| gatipradaya ca namo namo bandhaharaya ca | trailokyatejasam kartre namastejahsvarupine
    || 58|| yogishvaraya shuddhaya ramayottaranaya ca | sukhaya sukhanetraya namah sukritadharine || 59||
    vasudevaya vandyaya vamadevaya vai namah | dehinam dehakartre ca bhedabhangakaraya ca || 60|| devairvanditadehaya
    namaste divyamauline | namo vasanivasaya vasavyavaharaya ca || 61|| om namo vasukartre ca vasuvasapradaya
    ca | namo yajnasvarupaya yajneshaya ca yogine || 62|| yatiyogakareshaya namo yajnangadharine | sankarshanaya
    ca namah pralambamathanaya ca || 63|| meghaghoshasvanottirnavegalangaladharine | namo'stu jnaninam
    jnana narayanaparayana || 64|| na me'sti tvamrite bandhurnarakottarane prabho | atastvam sarvabhavena
    pranato natavatsala || 65|| malam yatkayajam va'pi manasam caiva keshava | na tasyanyo'sti devesha
    kshalakastvamrite'cyuta || 66|| samsargani samastani vihaya tvamupasthitah | sango me'stu tvaya sardhamatmalabhaya
    keshava || 67|| kashtamapatsudushparam samsaram vedmi keshava | tapatrayapariklishtastena tvam sharanam
    gatah || 68|| eshanabhirjagatsarvam mohitam mayaya tava | akarshitam ca lobhadyairatastvamahamashritah
    || 69|| nasti kincitsukham vishno samsarasthasya dehinah | yatha yatha hi yajnesha tvayi cetah pravartate
    || 70|| tatha phalavihinam tu sukhamatyantikam labhet | nashto vivekashunyo'smi drishyate jagadaturam
    || 71|| govinda trahi samsaranmamuddhartum tvamarhasi | magnasya mohasalile niruttare bhavarnave |
    uddharta pundarikaksha tvamrite'nyo na vidyate || 72|| iti brahmapurane ekonashashtitamadhyayantargatam
    shvetakritam vishnustotram samaptam | brahmapurana | adhyaya 59
  devanagari: श्वेतकृतं विष्णुस्तोत्रम् श्वेत उवाच । ॐ नमो वासुदेवाय नमः सङ्कर्षणाय च । प्रद्युम्नायानिरुद्धाय
    नमो नारायणाय च ॥ ३४॥ नमोऽस्तु बहुरूपाय विश्वरूपाय वेधसे । निर्गुणायाप्रतर्क्याय शुचये शुक्लकर्मणे
    ॥ ३५॥ ॐ नमः पद्मनाभाय पद्मगर्भोद्भवाय च । नमोऽस्तु पद्मवर्णाय पद्महस्ताय ते नमः ॥ ३६॥ ॐ नमः पुष्कराक्षाय
    सहस्राक्षाय मीढुषे । नमः सहस्रपादाय सहस्रभुज मन्यवे ॥ ३७॥ ॐ नमोऽस्तु वराहाय वरदाय सुमेधसे । वरिष्ठाय
    वरेण्याय शरण्यायाच्युताय च ॥ ३८॥ ॐ नमो बालरूपाय बालपद्मप्रभाय च । बालार्कसोमनेत्राय मुञ्जकेशाय धीमते
    ॥ ३९॥ केशवाय नमो नित्यं नमो नारायणाय च । माधवाय वरिष्ठाय गोविन्दाय नमो नमः ॥ ४०॥ ॐ नमो विष्णवे नित्यं
    देवाय वसुरेतसे । मधुसूदनाय नमः शुद्धायांशुधराय च ॥ ४१॥ नमोऽनन्ताय सूक्ष्माय नमः श्रीवत्सधारिणे । त्रिविक्रमाय
    च नमो दिव्यपीताम्बराय च ॥ ४२॥ सृष्टिकर्त्रे नमस्तुभ्यं गोप्त्रे धात्रे नमो नमः । नमोऽस्तु गुणभूताय
    निर्गुणाय नमो नमः ॥ ४३॥ नमो वामनरूपाय नमो वामनकर्मणे । नमो वामननेत्राय नमो वामनवाहिने ॥ ४४॥ नमो रम्याय
    पूज्याय नमोऽस्त्वव्यक्तरूपिणे । अप्रतर्क्याय शुद्धाय नमो भयहराय च ॥ ४५॥ संसारार्णवपोताय प्रशान्ताय
    स्वरूपिणे । शिवाय सौम्यरूपाय रुद्रायोत्तारणाय च ॥ ४६॥ भवभङ्गकृते चैव भवभोगप्रदाय च । भवसङ्घातरूपाय
    भवसृष्टिकृते नमः ॥ ४७॥ ॐ नमो दिव्यरूपाय सोमाग्निश्वसिताय च । सोमसूर्यांशुकेशाय गोब्राह्मणहिताय च ॥
    ४८॥ ॐ नमो ऋक्स्वरूपाय पदक्रमस्वरूपिणे । ऋक्स्तुताय नमस्तुभ्यं नमो ऋक्साधनाय च ॥ ४९॥ ॐ नमो यजुषां धात्रे
    यजूरूपधराय च । यजुर्याज्याय जुष्टाय यजुषां पतये नमः ॥ ५०॥ ॐ नमः श्रीपते देव श्रीधराय वराय च । श्रियः
    कान्ताय दान्ताय योगिचिन्त्याय योगिने ॥ ५१॥ ॐ नमः सामरूपाय सामध्वनिवराय च । ॐ नमः सामसौम्याय सामयोगविदे
    नमः ॥ ५२॥ साम्ने च सामगीताय ॐ नमः सामधारिणे । सामयज्ञविदे चैव नमः सामकराय च ॥ ५३॥ नमस्त्वथर्वशिरसे
    नमोऽथर्वस्वरूपिणे । नमोऽस्त्वथर्वपादाय नमोऽथर्वकराय च ॥ ५४॥ ॐ नमो वज्रशीर्षाय मधुकैटभघातिने । महोदधिजलस्थाय
    वेदाहरणकारिणे ॥ ५५॥ नमो दीप्तस्वरूपाय हृषीकेशाय वै नमः । नमो भगवते तुभ्यं वासुदेवाय ते नमः ॥ ५६॥ नारायण
    नमस्तुभ्यं नमो लोकहिताय च । ॐ नमो मोहनाशाय भवभङ्गकराय च ॥ ५७॥ गतिप्रदाय च नमो नमो बन्धहराय च । त्रैलोक्यतेजसां
    कर्त्रे नमस्तेजःस्वरूपिणे ॥ ५८॥ योगीश्वराय शुद्धाय रामायोत्तरणाय च । सुखाय सुखनेत्राय नमः सुकृतधारिणे
    ॥ ५९॥ वासुदेवाय वन्द्याय वामदेवाय वै नमः । देहिनां देहकर्त्रे च भेदभङ्गकराय च ॥ ६०॥ देवैर्वान्दितदेहाय
    नमस्ते दिव्यमौलिने । नमो वासनिवासाय वासव्यवहराय च ॥ ६१॥ ॐ नमो वसुकर्त्रे च वसुवासप्रदाय च । नमो यज्ञस्वरूपाय
    यज्ञेशाय च योगिने ॥ ६२॥ यतियोगकरेशाय नमो यज्ञाङ्गधारिणे । सङ्कर्षणाय च नमः प्रलम्बमथनाय च ॥ ६३॥ मेघघोषस्वनोत्तीर्णवेगलाङ्गलधारिणे
    । नमोऽस्तु ज्ञानिनां ज्ञान नारायणपरायण ॥ ६४॥ न मेऽस्ति त्वामृते बन्धुर्नरकोत्तारणे प्रभो । अतस्त्वां
    सर्वभावेन प्रणतो नतवत्सल ॥ ६५॥ मलं यत्कायजं वाऽपि मानसं चैव केशव । न तस्यान्योऽस्ति देवेश क्षालकस्त्वामृतेऽच्युत
    ॥ ६६॥ संसर्गाणि समस्तानि विहाय त्वामुपस्थितः । सङ्गो मेऽस्तु त्वया सार्धमात्मलाभाय केशव ॥ ६७॥ कष्टमापत्सुदुष्पारं
    संसारं वेद्मि केशव । तापत्रयपरिक्लिष्टस्तेन त्वां शरणं गतः ॥ ६८॥ एषणाभिर्जगत्सर्वं मोहितं मायया तव
    । आकर्षितं च लोभाद्यैरतस्त्वामहमाश्रितः ॥ ६९॥ नास्ति किञ्चित्सुखं विष्णो संसारस्थस्य देहिनः । यथा
    यथा हि यज्ञेश त्वयि चेतः प्रवर्तते ॥ ७०॥ तथा फलविहीनं तु सुखमात्यन्तिकं लभेत् । नष्टो विवेकशून्योऽस्मि
    दृश्यते जगदातुरम् ॥ ७१॥ गोविन्द त्राहि संसारान्मामुद्धर्तुं त्वमर्हसि । मग्नस्य मोहसलिले निरुत्तारे
    भवार्णवे । उद्धर्ता पुण्डरीकाक्ष त्वामृतेऽन्यो न विद्यते ॥ ७२॥ इति ब्रह्मपुराणे एकोनषष्टितमाध्यायान्तर्गतं
    श्वेतकृतं विष्णुस्तोत्रं समाप्तम् । ब्रह्मपुराण । अध्याय ५९
