id: sri-shiva-aarati
category: stotram
name:
  english: Sri Shiva Aarati
content:
  english: sarvesham paramesham shriparvatisham vande'ham vishvesham shripannagesham | shrisambam shambhum
    shivam trailokyapujyam vande'ham trainetram shrikanthamisham || || bhasmambaradharamisham suraparijatam
    bilvarcitapadayugalam somam somesham | jagadalayaparishobhitadevam paramatmam vande'ham shivashankaramisham
    devesham || || kailasapriyavasam karunakaramisham katyayanivilasitapriyavamabhagam | pranavarcitamatmarcitam
    samsevitarupam vande'ham shivashankaramisham devesham || || manmathanijamadadahanam dakshayanisham
    nirgunagunasambharitam kaivalyapurusham | bhaktanugrahavigrahamanandajaikam vande'ham shivashankaramisham
    devesham || || suragangasamplavitapavananijashikharam samabhushitashashibimbam jatadharam devam |
    niratojjvaladavanalanayanaphalabhagam vande'ham shivashankaramisham devesham || || shashisuryanetradvayamaradhyapurusham
    surakinnarapannagamayamisham sankasham | sharavanabhavasampujitanijapadapadmam vande'ham shivashankaramisham
    devesham || || shrishailapuravasam isham mallisham shrikalahastisham svarnamukhivasam | kancipuramisham
    shrikamakshitejam vande'ham shivashankaramisham devesham || || tripurantakamisham arunacalesham dakshinamurtim
    gurum lokapujyam | cidambarapuravasam pancalingamurtim vande'ham shivashankaramisham devesham || ||
    jyotirmayashubhalingam sankhyatrayanatyam trayivedyamadyam pancananamisham | vedadbhutagatram vedarnavajanitam
    vedagram vishvagram shrivishvanatham ||
  devanagari: सर्वेशं परमेशं श्रीपार्वतीशं वन्देऽहं विश्वेशं श्रीपन्नगेशम् । श्रीसाम्बं शम्भुं शिवं त्रैलोक्यपूज्यं
    वन्देऽहं त्रैनेत्रं श्रीकण्ठमीशम् ॥ ॥ भस्माम्बरधरमीशं सुरपारिजातं बिल्वार्चितपदयुगलं सोमं सोमेशम्
    । जगदालयपरिशोभितदेवं परमात्मं वन्देऽहं शिवशङ्करमीशं देवेशम् ॥ ॥ कैलासप्रियवासं करुणाकरमीशं कात्यायनीविलसितप्रियवामभागम्
    । प्रणवार्चितमात्मार्चितं संसेवितरूपं वन्देऽहं शिवशङ्करमीशं देवेशम् ॥ ॥ मन्मथनिजमददहनं दाक्षायनीशं
    निर्गुणगुणसम्भरितं कैवल्यपुरुषम् । भक्तानुग्रहविग्रहमानन्दजैकं वन्देऽहं शिवशङ्करमीशं देवेशम् ॥ ॥ सुरगङ्गासम्प्लावितपावननिजशिखरं
    समभूषितशशिबिम्बं जटाधरं देवम् । निरतोज्ज्वलदावानलनयनफालभागं वन्देऽहं शिवशङ्करमीशं देवेशम् ॥ ॥ शशिसूर्यनेत्रद्वयमाराध्यपुरुषं
    सुरकिन्नरपन्नगमयमीशं सङ्काशम् । शरवणभवसम्पूजितनिजपादपद्मं वन्देऽहं शिवशङ्करमीशं देवेशम् ॥ ॥ श्रीशैलपुरवासं
    ईशं मल्लीशं श्रीकालहस्तीशं स्वर्णमुखीवासम् । काञ्चीपुरमीशं श्रीकामाक्षीतेजं वन्देऽहं शिवशङ्करमीशं
    देवेशम् ॥ ॥ त्रिपुरान्तकमीशं अरुणाचलेशं दक्षिणामूर्तिं गुरुं लोकपूज्यम् । चिदम्बरपुरवासं पञ्चलिङ्गमूर्तिं
    वन्देऽहं शिवशङ्करमीशं देवेशम् ॥ ॥ ज्योतिर्मयशुभलिङ्गं सङ्ख्यात्रयनाट्यं त्रयीवेद्यमाद्यं पञ्चाननमीशम्
    । वेदाद्भुतगात्रं वेदार्णवजनितं वेदाग्रं विश्वाग्रं श्रीविश्वनाथम् ॥
