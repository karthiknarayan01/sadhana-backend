id: purushottamasahasranamastotra
category: stotram
name:
  english: purushottamasahasranamastotra
  devanagari: पुरुषोत्तमसहस्रनामस्तोत्र
content:
  english: ringabaddhadhritakshonih sarvarthajnapako guruh || 129|| ishanukathalila ishasevakalilatma
    suryavamshapravartakah | somavamshodbhavakaro manuputragatipradah || 130|| ambarishapriyah sadhurdurvasogarvanashakah
    | brahmashapopasamharta bhaktakirtivivardhanah || 131|| ikshvakuvamshajanakah sagaradyakhilarthadah
    | bhagirathamahayatno gangadhautanghripankajah || 132|| brahmasvami shivasvami sagaratmajamuktidah
    | khatvangamokshahetushca raghuvamshavivardhanah || 133|| raghunatho ramacandro ramabhadro raghupriyah
    | anantakirtih punyatma punyashlokaikabhaskarah || 134|| koshalendrah pramanatma sevyo dasharathatmajah
    | lakshmano bharatashcaiva shatrughno vyuhavigrahah || 135|| vishvamitrapriyo dantastadakavadhamokshadah
    | vayavyastrabdhinikshiptamaricashca subahuha || 136|| vrishadhvajadhanurbhangapraptasitamahotsavah
    | sitapatirbhrigupatigarvaparvatanashakah || 137|| ayodhyasthamahabhogayuktalakshmivinodavan | kaikeyivakyakarta
    ca pitrivakparipalakah || 138|| vairagyabodhako'nanyasattvikasthanabodhakah | ahalyaduhkhahari ca
    guhasvami salakshmanah || 139|| citrakutapriyasthano dandakaranyapavanah | sharabhangasutikshnadipujito'gastyabhagyabhuh
    || 140|| rishisamprarthitakritirviradhavadhapanditah | chinnashurpanakhanasah kharadushanaghatakah
    || 141|| ekabanahatanekasahasrabalarakshasah | maricaghati niyatasitasambandhashobhitah || 142|| sitaviyoganatyashca
    jatayurvadhamokshadah | shabaripujito bhaktahanumatpramukhavritah || 143|| dundubhyasthipraharanah
    saptatalavibhedanah | sugrivarajyado valighati sagarashoshanah || 144|| setubandhanakarta ca vibhishanahitapradah
    | ravanadishirashchedi rakshasaghaughanashakah || 145|| sita'bhayapradata ca pushpakagamanotsukah
    | ayodhyapatiratyantasarvalokasukhapradah || 146|| mathurapuranirmata sukritajnasvarupadah | janakajnanagamyashca
    ailantaprakatashrutih || 147|| haihayantakaro ramo dushtakshatravinashakah | somavamshahitaikatma
    yaduvamshavivardhanah || 148|| nirodhalila parabrahmavataranah keshavah kleshanashanah | bhumibharavatarano
    bhaktarthakhilamanasah || 149|| sarvabhaktanirodhatma lilanantanirodhakrit | bhumishthaparamanando
    devakishuddhikaranam || 150|| vasudevajnananishthasamajivanivarakah | sarvavairagyakaranasvaliladharashodhakah
    || 151|| mayajnapanakarta ca sheshasambharasambhritih | bhaktakleshaparijnata tannivaranatatparah
    || 152|| avishtavasudevamsho devakigarbhabhushanam | purnatejomayah purnah kamsadhrishyapratapavan
    || 153|| vivekajnanadata ca brahmadyakhilasamstutah | satyo jagatkalpatarurnanarupavimohanah || 154||
    bhaktimargapratishthata vidvanmohapravartakah | mulakalagunadrashta nayananandabhajanam || 155|| vasudevasukhabdhishca
    devakinayanamritam | pitrimatristutah purvasarvavrittantabodhakah || 156|| gokulagatililaptavasudevakarasthitih
    | sarveshatvaprakatano mayavyatyayakarakah || 157|| jnanamohitadushteshah prapancasmritikaranam |
    yashodanandano nandabhagyabhugokulotsavah || 158|| nandapriyo nandasunuryashodayah stanandhayah |
    putanasupayahpata mugdhabhavatisundarah || 159|| sundarihridayanando gopimantrabhimantritah | gopalashcaryarasakrit
    shakatasurakhandanah || 160|| nandavrajajananandi nandabhagyamahodayah | trinavartavadhotsaho yashodajnanavigrahah
    || 161|| balabhadrapriyah krishnah sankarshanasahayavan | ramanujo vasudevo goshthanganagatipriyah
    || 162|| kinkiniravabhavajno vatsapucchavalambanah | navanitapriyo gopimohasamsaranashakah || 163||
    gopabalakabhavajnashcauryavidyavisharadah | mritsnabhakshanalilasyamahatmyajnanadayakah || 164|| dharadronapritikarta
    dadhibhandavibhedanah | damodaro bhaktavashyo yamalarjunabhanjanah || 165|| brihadvanamahashcaryo
    vrindavanagatipriyah | vatsaghati balakelirbakasuranishudanah || 166|| aranyabhokta'pyathava balalilaparayanah
    | protsahajanakashcaivamaghasuranishudanah || 167|| vyalamokshapradah pushto brahmamohapravardhanah
    | anantamurtih sarvatma jangamasthavarakritih || 168|| brahmamohanakarta ca stutya atma sadapriyah
    | paugandalilabhiratirgocaranaparayanah || 169|| vrindavanalatagulmavriksharupanirupakah | nadabrahmaprakatano
    vayahpratikritisvanah || 170|| barhinrityanukarano gopalanukritisvanah | sadacarapratishthata balashramanirakritih
    || 171|| tarumulakritasheshatalpashayi sakhistutah | gopalasevitapadah shrilalitapadambujah || 172||
    gopasamprarthitaphaladananashitadhenukah | kaliyaphanimanikyaranjitashripadambujah || 173|| drishtisanjivitasheshagopagogopikapriyah
    | lilasampitadavagnih pralambavadhapanditah || 174|| davagnyavritagopaladrishtyacchadanavahnipah |
    varshasharadvibhutishrirgopikamaprabodhakah || 175|| gopiratnastutasheshavenuvadyavisharadah | katyayanivratavyajasarvabhavashritanganah
    || 176|| satsangatistutivyajastutavrindavananghripah | gopakshucchantisamvyajaviprabharyaprasadakrit
    || 177|| hetupraptendrayagasvakaryagosavabodhakah | shailarupakritashesharasabhogasukhavahah || 178||
    lilagovardhanoddharapalitasvavrajapriyah | gopasvacchandalilarthagargavakyarthabodhakah || 179|| indradhenustutipraptagovindendrabhidhanavan
    | vratadidharmasamsaktanandakleshavinashakah || 180|| nandadigopamatreshtavaikunthagatidayakah | venuvadasmarakshobhamattagopivimuktidah
    || 181|| sarvabhavapraptagopisukhasamvardhanakshamah | gopigarvapranasharthatirodhanasukhapradah ||
    182|| krishnabhavavyaptavishvagopibhavitaveshadhrik | radhavisheshasambhogapraptadoshanivarakah ||
    183|| paramapritisangitasarvadbhutamahagunah | manapanodanakrandagopidrishtimahotsavah || 184|| gopikavyaptasarvangah
    strisambhashavisharadah | rasotsavamahasaukhyagopisambhogasagarah || 185|| jalasthalarativyaptagopidrishtyabhipujitah
    | shastranapekshakamaikamuktidvaravivardhanah || 186|| sudarshanamahasarpagrastanandavimocakah | gitamohitagopidhrikshankhacudavinashakah
    || 187|| gunasangitasantushtirgopisamsaravismritih | arishtamathano daityabuddhivyamohakarakah ||
    188|| keshighati naradeshto vyomasuravinashakah | akrurabhaktisamraddhapadarenumahanidhih || 189||
    rathavarohashuddhatma gopimanasaharakah | hradasandarshitasheshavaikunthakrurasamstutah || 190|| mathuragamanotsaho
    mathurabhagyabhajanam | mathuranagarishobhadarshanotsukamanasah || 191|| dushtaranjakaghati ca vayakarcitavigrahah
    | vastramalasushobhangah kubjalepanabhushitah || 192|| kubjasurupakarta ca kubjarativarapradah | prasadarupasantushtaharakodandakhandanah
    || 193|| shakalahatakamsaptadhanurakshakasainikah | jagratsvapnabhayavyaptamrityulakshanabodhakah
    || 194|| mathuramalla ojasvi mallayuddhavisharadah | sadyah kuvalayapidaghati canuramardanah || 195||
    lilahatamahamallah shalatoshalaghatakah | kamsantako jitamitro vasudevavimocakah || 196|| jnatatattvapitrijnanamohanamritavanmayah
    | ugrasenapratishthata yadavadhivinashakah || 197|| nandadisantvanakaro brahmacaryavrate sthitah |
    gurushushrushanaparo vidyaparamiteshvarah || 198|| sandipanimritapatyadata kalantakadijit | gokulashvasanaparo
    yashodanandaposhakah || 199|| gopikavirahavyajamanogatiratipradah | samoddhavabhramaravak gopikamohanashakah
    || 200|| kubjaratiprado'krurapavitrikritabhugrihah | prithaduhkhapraneta ca pandavanam sukhapradah
    || 201|| dashamaskandhottarardhanamani nirodhalila jarasandhasamanitasainyaghati vicarakah | yavanavyaptamathurajanadattakushasthalih
    || 202|| dvarakadbhutanirmanavismapitasurasurah | manushyamatrabhogarthabhumyanitendravaibhavah ||
    203|| yavanavyaptamathuranirgamanandavigrahah | mucukundamahabodhayavanapranadarpaha || 204|| mucukundastutasheshagunakarmamahodayah
    | phalapradanasantushtirjanmantaritamokshadah || 205|| shivabrahmanavakyaptajayabhitivibhavanah |
    pravarshanaprarthitagnidanapunyamahotsavah || 206|| rukminiramanah kamapita pradyumnabhavanah | syamantakamanivyajapraptajambavatipatih
    || 207|| satyabhamapranapatih kalindirativardhanah | mitravindapatih satyapatirvrishanishudanah ||
    208|| bhadravanchitabharta ca lakshmanavaranakshamah | indradiprarthitavadhanarakasurasudanah || 209||
    murarih pithahanta ca tamradipranaharakah | shodashastrisahasreshah chatrakundaladanakrit || 210||
    parijatapaharano devendramadanashakah | rukminisamasarvastrisadhyabhogaratipradah || 211|| rukminiparihasoktivaktirodhanakarakah
    | putrapautramahabhagyagrihadharmapravartakah || 212|| shambarantakasatputravivahahatarukmikah | ushapahritapautrashrirbanabahunivarakah
    || 213|| shitajvarabhayavyaptajvarasamstutashadgunah | shankarapratiyoddha ca dvandvayuddhavisharadah
    || 214|| nrigapapaprabhetta ca brahmasvagunadoshadrik | vishnubhaktivirodhaikabrahmasvavinivarakah
    || 215|| balabhadrahitaguno gokulapritidayakah | gopisnehaikanilayo gopipranasthitipradah || 216||
    vakyatigamiyamunahalakarshanavaibhavah | paundrakatyajitaspardhah kashirajavibhedanah || 217|| kashinidahakaranah
    shivabhasmapradayakah | dvividapranaghati ca kauravakharvagarvanut || 218|| langalakrishtanagarisamvignakhilanagarah
    | prapannabhayadah sambapraptasanmanabhajanam || 219|| naradanvishtacarano bhaktavikshepanashakah
    | sadacaraikanilayah sudharmadhyasitasanah || 220|| jarasandhavaruddhena vijnapitanijaklamah | mantryuddhavadivakyoktaprakaraikaparayanah
    || 221|| rajasuyadimakhakrit samprarthitasahayakrit | indraprasthaprayanarthamahatsambharasambhritih
    || 222|| jarasandhavadhavyajamocitasheshabhumipah | sanmargabodhako yajnakshitivaranatatparah || 223||
    shishupalahativyajajayashapavimocakah | duryodhanabhimanabdhishoshabanavrikodarah|| 224|| mahadevavarapraptapurashalvavinashakah
    | dantavaktravadhavyajavijayaghaughanashakah || 225|| vidurathapranaharta nyastashastrastravigrahah
    | upadharmaviliptangasutaghati varapradah || 226|| balvalapranaharanapalitarshishrutikriyah | sarvatirthaghanasharthatirthayatravisharadah
    || 227|| jnanakriyavibhedeshtaphalasadhanatatparah | sarathyadikriyakarta bhaktavashyatvabodhakah
    || 228|| sudamarankabharyarthabhumyanitendravaibhavah | ravigrahanimittaptakurukshetraikapavanah ||
    229|| nripagopisamastastripavanarthakhilakriyah | rishimargapratishthata vasudevamakhakriyah || 230||
    vasudevajnanadata devakiputradayakah | arjunastripradata ca bahulashvasvarupadah || 231|| shrutadeveshtadata
    ca sarvashrutinirupitah | mahadevadyatishreshtho bhaktilakshananirnayah || 232|| vrikagrastashivatrata
    nanavakyavisharadah | naragarvavinasharthahritabrahmanabalakah || 233|| lokalokaparasthanasthitabalakadayakah
    | dvarakasthamahabhogananastrirativardhanah || 234|| manastirodhanakritavyagrastricittabhavitah |
    muktilila muktililaviharano maushalavyajasamhritih || 235|| shribhagavatadharmadibodhako bhaktinitikrit
    | uddhavajnanadata ca pancavimshatidha guruh || 236|| acarabhaktimuktyadivakta shabdodbhavasthitih
    | hamso dharmapravakta ca sanakadyupadeshakrit || 237|| bhaktisadhanavakta ca yogasiddhipradayakah
    | nanavibhutivakta ca shuddhadharmavabodhakah || 238|| margatrayavibhedatma nanashankanivarakah |
    bhikshugitapravakta ca shuddhasankhyapravartakah || 239|| manogunavisheshatma jnapakoktapururavah
    | pujavidhipravakta ca sarvasiddhantabodhakah || 240|| laghusvamargavakta ca svasthanagatibodhakah
    | yadavangopasamharta sarvashcaryagatikriyah || 241|| ashrayalila kaladharmavibhedarthavarnanashanatatparah
    | buddho guptarthavakta ca nanashastravidhayakah || 242|| nashtadharmamanushyadilakshanajnapanotsukah
    | ashrayaikagatijnata kalkih kalimalapahah || 243|| shastravairagyasambodho nanapralayabodhakah |
    visheshatah shukavyajaparikshijjnanabodhakah || 244|| shukeshtagatirupatma parikshiddehamokshadah
    | shabdarupo nadarupo vedarupo vibhedanah || 245|| vyasah shakhapravakta ca puranarthapravartakah
    | markandeyaprasannatma vatapatraputeshayah || 246|| mayavyaptamahamohaduhkhashantipravartakah | mahadevasvarupashca
    bhaktidata kripanidhih || 247|| adityantargatah kalah dvadashatma supujitah | shribhagavatarupashca
    sarvarthaphaladayakah || 248|| itidam kirtaniyasya harernamasahasrakam | pancasaptativistirnam puranantarabhashitam
    || 249|| ya etatpratarutthaya shraddhavan susamahitah | japedarthahitamatih sa govindapadam labhet
    || 250|| sarvadharmavinirmuktah sarvasadhanavarjitah | etaddharanamatrena krishnasya padavim vrajet
    || 251|| haryaveshitacittena shribhagavatasagarat | samuddhritani namani cintamaninibhani hi || 252||
    kanthasthitanyarthadiptya badhante'jnanajam tamah | bhaktim shrikrishnadevasya sadhayanti vinishcitam
    || 253|| kimbahuktena bhagavan namabhih stutashadgunah | atmabhavam nayatyashu bhaktim ca kurute dridham
    || 254|| yah krishnabhaktimiha vanchati sadhanaughair
  devanagari: ृङ्गबद्धधृतक्षोणिः सर्वार्थज्ञापको गुरुः ॥ १२९॥ ईशानुकथालीला ईशसेवकलीलात्मा सूर्यवंशप्रवर्तकः
    । सोमवंशोद्भवकरो मनुपुत्रगतिप्रदः ॥ १३०॥ अम्बरीषप्रियः साधुर्दुर्वासोगर्वनाशकः । ब्रह्मशापोपसंहर्ता
    भक्तकीर्तिविवर्धनः ॥ १३१॥ इक्ष्वाकुवंशजनकः सगराद्यखिलार्थदः । भगीरथमहायत्नो गङ्गाधौताङ्घ्रिपङ्कजः
    ॥ १३२॥ ब्रह्मस्वामी शिवस्वामी सगरात्मजमुक्तिदः । खट्वाङ्गमोक्षहेतुश्च रघुवंशविवर्धनः ॥ १३३॥ रघुनाथो
    रामचन्द्रो रामभद्रो रघुप्रियः । अनन्तकीर्तिः पुण्यात्मा पुण्यश्लोकैकभास्करः ॥ १३४॥ कोशलेन्द्रः प्रमाणात्मा
    सेव्यो दशरथात्मजः । लक्ष्मणो भरतश्चैव शत्रुघ्नो व्यूहविग्रहः ॥ १३५॥ विश्वामित्रप्रियो दान्तस्ताडकावधमोक्षदः
    । वायव्यास्त्राब्धिनिक्षिप्तमारीचश्च सुबाहुहा ॥ १३६॥ वृषध्वजधनुर्भङ्गप्राप्तसीतामहोत्सवः । सीतापतिर्भृगुपतिगर्वपर्वतनाशकः
    ॥ १३७॥ अयोध्यास्थमहाभोगयुक्तलक्ष्मीविनोदवान् । कैकेयीवाक्यकर्ता च पितृवाक्परिपालकः ॥ १३८॥ वैराग्यबोधकोऽनन्यसात्त्विकस्थानबोधकः
    । अहल्यादुःखहारी च गुहस्वामी सलक्ष्मणः ॥ १३९॥ चित्रकूटप्रियस्थानो दण्डकारण्यपावनः । शरभङ्गसुतीक्ष्णादिपूजितोऽगस्त्यभाग्यभूः
    ॥ १४०॥ ऋषिसम्प्रार्थितकृतिर्विराधवधपण्डितः । छिन्नशूर्पणखानासः खरदूषणघातकः ॥ १४१॥ एकबाणहतानेकसहस्रबलराक्षसः
    । मारीचघाती नियतसीतासम्बन्धशोभितः ॥ १४२॥ सीतावियोगनाट्यश्च जटायुर्वधमोक्षदः । शबरीपूजितो भक्तहनुमत्प्रमुखावृतः
    ॥ १४३॥ दुन्दुभ्यस्थिप्रहरणः सप्ततालविभेदनः । सुग्रीवराज्यदो वालिघाती सागरशोषणः ॥ १४४॥ सेतुबन्धनकर्ता
    च विभीषणहितप्रदः । रावणादिशिरश्छेदी राक्षसाघौघनाशकः ॥ १४५॥ सीताऽभयप्रदाता च पुष्पकागमनोत्सुकः । अयोध्यापतिरत्यन्तसर्वलोकसुखप्रदः
    ॥ १४६॥ मथुरापुरनिर्माता सुकृतज्ञस्वरूपदः । जनकज्ञानगम्यश्च ऐलान्तप्रकटश्रुतिः ॥ १४७॥ हैहयान्तकरो रामो
    दुष्टक्षत्रविनाशकः । सोमवंशहितैकात्मा यदुवंशविवर्धनः ॥ १४८॥ निरोधलीला परब्रह्मावतरणः केशवः क्लेशनाशनः
    । भूमिभारावतरणो भक्तार्थाखिलमानसः ॥ १४९॥ सर्वभक्तनिरोधात्मा लीलानन्तनिरोधकृत् । भूमिष्ठपरमानन्दो देवकीशुद्धिकारणम्
    ॥ १५०॥ वसुदेवज्ञाननिष्ठसमजीवनिवारकः । सर्ववैराग्यकरणस्वलीलाधारशोधकः ॥ १५१॥ मायाज्ञापनकर्ता च शेषसम्भारसम्भृतिः
    । भक्तक्लेशपरिज्ञाता तन्निवारणतत्परः ॥ १५२॥ आविष्टवसुदेवांशो देवकीगर्भभूषणम् । पूर्णतेजोमयः पूर्णः
    कंसाधृष्यप्रतापवान् ॥ १५३॥ विवेकज्ञानदाता च ब्रह्माद्यखिलसंस्तुतः । सत्यो जगत्कल्पतरुर्नानारूपविमोहनः
    ॥ १५४॥ भक्तिमार्गप्रतिष्ठाता विद्वन्मोहप्रवर्तकः । मूलकालगुणद्रष्टा नयनानन्दभाजनम् ॥ १५५॥ वसुदेवसुखाब्धिश्च
    देवकीनयनामृतम् । पितृमातृस्तुतः पूर्वसर्ववृत्तान्तबोधकः ॥ १५६॥ गोकुलागतिलीलाप्तवसुदेवकरस्थितिः । सर्वेशत्वप्रकटनो
    मायाव्यत्ययकारकः ॥ १५७॥ ज्ञानमोहितदुष्टेशः प्रपञ्चास्मृतिकारणम् । यशोदानन्दनो नन्दभाग्यभूगोकुलोत्सवः
    ॥ १५८॥ नन्दप्रियो नन्दसूनुर्यशोदायाः स्तनन्धयः । पूतनासुपयःपाता मुग्धभावातिसुन्दरः ॥ १५९॥ सुन्दरीहृदयानन्दो
    गोपीमन्त्राभिमन्त्रितः । गोपालाश्चर्यरसकृत् शकटासुरखण्डनः ॥ १६०॥ नन्दव्रजजनानन्दी नन्दभाग्यमहोदयः
    । तृणावर्तवधोत्साहो यशोदाज्ञानविग्रहः ॥ १६१॥ बलभद्रप्रियः कृष्णः सङ्कर्षणसहायवान् । रामानुजो वासुदेवो
    गोष्ठाङ्गणगतिप्रियः ॥ १६२॥ किङ्किणीरवभावज्ञो वत्सपुच्छावलम्बनः । नवनीतप्रियो गोपीमोहसंसारनाशकः ॥ १६३॥
    गोपबालकभावज्ञश्चौर्यविद्याविशारदः । मृत्स्नाभक्षणलीलास्यमाहात्म्यज्ञानदायकः ॥ १६४॥ धराद्रोणप्रीतिकर्ता
    दधिभाण्डविभेदनः । दामोदरो भक्तवश्यो यमलार्जुनभञ्जनः ॥ १६५॥ बृहद्वनमहाश्चर्यो वृन्दावनगतिप्रियः । वत्सघाती
    बालकेलिर्बकासुरनिषूदनः ॥ १६६॥ अरण्यभोक्ताऽप्यथवा बाललीलापरायणः । प्रोत्साहजनकश्चैवमघासुरनिषूदनः ॥
    १६७॥ व्यालमोक्षप्रदः पुष्टो ब्रह्ममोहप्रवर्धनः । अनन्तमूर्तिः सर्वात्मा जङ्गमस्थावराकृतिः ॥ १६८॥ ब्रह्ममोहनकर्ता
    च स्तुत्य आत्मा सदाप्रियः । पौगण्डलीलाभिरतिर्गोचारणपरायणः ॥ १६९॥ वृन्दावनलतागुल्मवृक्षरूपनिरूपकः ।
    नादब्रह्मप्रकटनो वयःप्रतिकृतिस्वनः ॥ १७०॥ बर्हिनृत्यानुकरणो गोपालानुकृतिस्वनः । सदाचारप्रतिष्ठाता
    बलश्रमनिराकृतिः ॥ १७१॥ तरुमूलकृताशेषतल्पशायी सखिस्तुतः । गोपालसेवितपदः श्रीलालितपदाम्बुजः ॥ १७२॥ गोपसम्प्रार्थितफलदाननाशितधेनुकः
    । कालीयफणिमाणिक्यरञ्जितश्रीपदाम्बुजः ॥ १७३॥ दृष्टिसञ्जीविताशेषगोपगोगोपिकाप्रियः । लीलासम्पीतदावाग्निः
    प्रलम्बवधपण्डितः ॥ १७४॥ दावाग्न्यावृतगोपालदृष्ट्याच्छादनवह्निपः । वर्षाशरद्विभूतिश्रीर्गोपीकामप्रबोधकः
    ॥ १७५॥ गोपीरत्नस्तुताशेषवेणुवाद्यविशारदः । कात्यायनीव्रतव्याजसर्वभावाश्रिताङ्गनः ॥ १७६॥ सत्सङ्गतिस्तुतिव्याजस्तुतवृन्दावनाङ्घ्रिपः
    । गोपक्षुच्छान्तिसंव्याजविप्रभार्याप्रसादकृत् ॥ १७७॥ हेतुप्राप्तेन्द्रयागस्वकार्यगोसवबोधकः । शैलरूपकृताशेषरसभोगसुखावहः
    ॥ १७८॥ लीलागोवर्धनोद्धारपालितस्वव्रजप्रियः । गोपस्वच्छन्दलीलार्थगर्गवाक्यार्थबोधकः ॥ १७९॥ इन्द्रधेनुस्तुतिप्राप्तगोविन्देन्द्राभिधानवान्
    । व्रतादिधर्मसंसक्तनन्दक्लेशविनाशकः ॥ १८०॥ नन्दादिगोपमात्रेष्टवैकुण्ठगतिदायकः । वेणुवादस्मरक्षोभमत्तगोपीविमुक्तिदः
    ॥ १८१॥ सर्वभावप्राप्तगोपीसुखसंवर्धनक्षमः । गोपीगर्वप्रणाशार्थतिरोधानसुखप्रदः ॥ १८२॥ कृष्णभावव्याप्तविश्वगोपीभावितवेषधृक्
    । राधाविशेषसम्भोगप्राप्तदोषनिवारकः ॥ १८३॥ परमप्रीतिसङ्गीतसर्वाद्भुतमहागुणः । मानापनोदनाक्रन्दगोपीदृष्टिमहोत्सवः
    ॥ १८४॥ गोपिकाव्याप्तसर्वाङ्गः स्त्रीसम्भाषाविशारदः । रासोत्सवमहासौख्यगोपीसम्भोगसागरः ॥ १८५॥ जलस्थलरतिव्याप्तगोपीदृष्ट्यभिपूजितः
    । शास्त्रानपेक्षकामैकमुक्तिद्वारविवर्धनः ॥ १८६॥ सुदर्शनमहासर्पग्रस्तनन्दविमोचकः । गीतमोहितगोपीधृक्षङ्खचूडविनाशकः
    ॥ १८७॥ गुणसङ्गीतसन्तुष्टिर्गोपीसंसारविस्मृतिः । अरिष्टमथनो दैत्यबुद्धिव्यामोहकारकः ॥ १८८॥ केशिघाती
    नारदेष्टो व्योमासुरविनाशकः । अक्रूरभक्तिसंराद्धपादरेणुमहानिधिः ॥ १८९॥ रथावरोहशुद्धात्मा गोपीमानसहारकः
    । ह्रदसन्दर्शिताशेषवैकुण्ठाक्रूरसंस्तुतः ॥ १९०॥ मथुरागमनोत्साहो मथुराभाग्यभाजनम् । मथुरानगरीशोभादर्शनोत्सुकमानसः
    ॥ १९१॥ दुष्टरञ्जकघाती च वायकार्चितविग्रहः । वस्त्रमालासुशोभाङ्गः कुब्जालेपनभूषितः ॥ १९२॥ कुब्जासुरूपकर्ता
    च कुब्जारतिवरप्रदः । प्रसादरूपसन्तुष्टहरकोदण्डखण्डनः ॥ १९३॥ शकलाहतकंसाप्तधनूरक्षकसैनिकः । जाग्रत्स्वप्नभयव्याप्तमृत्युलक्षणबोधकः
    ॥ १९४॥ मथुरामल्ल ओजस्वी मल्लयुद्धविशारदः । सद्यः कुवलयापीडघाती चाणूरमर्दनः ॥ १९५॥ लीलाहतमहामल्लः शलतोशलघातकः
    । कंसान्तको जितामित्रो वसुदेवविमोचकः ॥ १९६॥ ज्ञाततत्त्वपितृज्ञानमोहनामृतवाङ्मयः । उग्रसेनप्रतिष्ठाता
    यादवाधिविनाशकः ॥ १९७॥ नन्दादिसान्त्वनकरो ब्रह्मचर्यव्रते स्थितः । गुरुशुश्रूषणपरो विद्यापारमितेश्वरः
    ॥ १९८॥ सान्दीपनिमृतापत्यदाता कालान्तकादिजित् । गोकुलाश्वासनपरो यशोदानन्दपोषकः ॥ १९९॥ गोपिकाविरहव्याजमनोगतिरतिप्रदः
    । समोद्धवभ्रमरवाक् गोपिकामोहनाशकः ॥ २००॥ कुब्जारतिप्रदोऽक्रूरपवित्रीकृतभूगृहः । पृथादुःखप्रणेता च
    पाण्डवानां सुखप्रदः ॥ २०१॥ दशमस्कन्धोत्तरार्धनामानि निरोधलीला जरासन्धसमानीतसैन्यघाती विचारकः । यवनव्याप्तमथुराजनदत्तकुशस्थलिः
    ॥ २०२॥ द्वारकाद्भुतनिर्माणविस्मापितसुरासुरः । मनुष्यमात्रभोगार्थभूम्यानीतेन्द्रवैभवः ॥ २०३॥ यवनव्याप्तमथुरानिर्गमानन्दविग्रहः
    । मुचुकुन्दमहाबोधयवनप्राणदर्पहा ॥ २०४॥ मुचुकुन्दस्तुताशेषगुणकर्ममहोदयः । फलप्रदानसन्तुष्टिर्जन्मान्तरितमोक्षदः
    ॥ २०५॥ शिवब्राह्मणवाक्याप्तजयभीतिविभावनः । प्रवर्षणप्रार्थिताग्निदानपुण्यमहोत्सवः ॥ २०६॥ रुक्मिणीरमणः
    कामपिता प्रद्युम्नभावनः । स्यमन्तकमणिव्याजप्राप्तजाम्बवतीपतिः ॥ २०७॥ सत्यभामाप्राणपतिः कालिन्दीरतिवर्धनः
    । मित्रविन्दापतिः सत्यापतिर्वृषनिषूदनः ॥ २०८॥ भद्रावाञ्छितभर्ता च लक्ष्मणावरणक्षमः । इन्द्रादिप्रार्थितवधनरकासुरसूदनः
    ॥ २०९॥ मुरारिः पीठहन्ता च ताम्रादिप्राणहारकः । षोडशस्त्रीसहस्रेशः छत्रकुण्डलदानकृत् ॥ २१०॥ पारिजातापहरणो
    देवेन्द्रमदनाशकः । रुक्मिणीसमसर्वस्त्रीसाध्यभोगरतिप्रदः ॥ २११॥ रुक्मिणीपरिहासोक्तिवाक्तिरोधानकारकः
    । पुत्रपौत्रमहाभाग्यगृहधर्मप्रवर्तकः ॥ २१२॥ शम्बरान्तकसत्पुत्रविवाहहतरुक्मिकः । उषापहृतपौत्रश्रीर्बाणबाहुनिवारकः
    ॥ २१३॥ शीतज्वरभयव्याप्तज्वरसंस्तुतषड्गुणः । शङ्करप्रतियोद्धा च द्वन्द्वयुद्धविशारदः ॥ २१४॥ नृगपापप्रभेत्ता
    च ब्रह्मस्वगुणदोषदृक् । विष्णुभक्तिविरोधैकब्रह्मस्वविनिवारकः ॥ २१५॥ बलभद्राहितगुणो गोकुलप्रीतिदायकः
    । गोपीस्नेहैकनिलयो गोपीप्राणस्थितिप्रदः ॥ २१६॥ वाक्यातिगामियमुनाहलाकर्षणवैभवः । पौण्ड्रकत्याजितस्पर्धः
    काशीराजविभेदनः ॥ २१७॥ काशीनिदाहकरणः शिवभस्मप्रदायकः । द्विविदप्राणघाती च कौरवाखर्वगर्वनुत् ॥ २१८॥
    लाङ्गलाकृष्टनगरीसंविग्नाखिलनागरः । प्रपन्नाभयदः साम्बप्राप्तसन्मानभाजनम् ॥ २१९॥ नारदान्विष्टचरणो भक्तविक्षेपनाशकः
    । सदाचारैकनिलयः सुधर्माध्यासितासनः ॥ २२०॥ जरासन्धावरुद्धेन विज्ञापितनिजक्लमः । मन्त्र्युद्धवादिवाक्योक्तप्रकारैकपरायणः
    ॥ २२१॥ राजसूयादिमखकृत् सम्प्रार्थितसहायकृत् । इन्द्रप्रस्थप्रयाणार्थमहत्सम्भारसम्भृतिः ॥ २२२॥ जरासन्धवधव्याजमोचिताशेषभूमिपः
    । सन्मार्गबोधको यज्ञक्षितिवारणतत्परः ॥ २२३॥ शिशुपालहतिव्याजजयशापविमोचकः । दुर्योधनाभिमानाब्धिशोषबाणवृकोदरः॥
    २२४॥ महादेववरप्राप्तपुरशाल्वविनाशकः । दन्तवक्त्रवधव्याजविजयाघौघनाशकः ॥ २२५॥ विदूरथप्राणहर्ता न्यस्तशस्त्रास्त्रविग्रहः
    । उपधर्मविलिप्ताङ्गसूतघाती वरप्रदः ॥ २२६॥ बल्वलप्राणहरणपालितर्षिश्रुतिक्रियः । सर्वतीर्थाघनाशार्थतीर्थयात्राविशारदः
    ॥ २२७॥ ज्ञानक्रियाविभेदेष्टफलसाधनतत्परः । सारथ्यादिक्रियाकर्ता भक्तवश्यत्वबोधकः ॥ २२८॥ सुदामारङ्कभार्यार्थभूम्यानीतेन्द्रवैभवः
    । रविग्रहनिमित्ताप्तकुरुक्षेत्रैकपावनः ॥ २२९॥ नृपगोपीसमस्तस्त्रीपावनार्थाखिलक्रियः । ऋषिमार्गप्रतिष्ठाता
    वसुदेवमखक्रियः ॥ २३०॥ वसुदेवज्ञानदाता देवकीपुत्रदायकः । अर्जुनस्त्रीप्रदाता च बहुलाश्वस्वरूपदः ॥ २३१॥
    श्रुतदेवेष्टदाता च सर्वश्रुतिनिरूपितः । महादेवाद्यतिश्रेष्ठो भक्तिलक्षणनिर्णयः ॥ २३२॥ वृकग्रस्तशिवत्राता
    नानावाक्यविशारदः । नरगर्वविनाशार्थहृतब्राह्मणबालकः ॥ २३३॥ लोकालोकपरस्थानस्थितबालकदायकः । द्वारकास्थमहाभोगनानास्त्रीरतिवर्धनः
    ॥ २३४॥ मनस्तिरोधानकृतव्यग्रस्त्रीचित्तभावितः । मुक्तिलीला मुक्तिलीलाविहरणो मौशलव्याजसंहृतिः ॥ २३५॥
    श्रीभागवतधर्मादिबोधको भक्तिनीतिकृत् । उद्धवज्ञानदाता च पञ्चविंशतिधा गुरुः ॥ २३६॥ आचारभक्तिमुक्त्यादिवक्ता
    शब्दोद्भवस्थितिः । हंसो धर्मप्रवक्ता च सनकाद्युपदेशकृत् ॥ २३७॥ भक्तिसाधनवक्ता च योगसिद्धिप्रदायकः
    । नानाविभूतिवक्ता च शुद्धधर्मावबोधकः ॥ २३८॥ मार्गत्रयविभेदात्मा नानाशङ्कानिवारकः । भिक्षुगीताप्रवक्ता
    च शुद्धसाङ्ख्यप्रवर्तकः ॥ २३९॥ मनोगुणविशेषात्मा ज्ञापकोक्तपुरूरवाः । पूजाविधिप्रवक्ता च सर्वसिद्धान्तबोधकः
    ॥ २४०॥ लघुस्वमार्गवक्ता च स्वस्थानगतिबोधकः । यादवाङ्गोपसंहर्ता सर्वाश्चर्यगतिक्रियः ॥ २४१॥ आश्रयलीला
    कालधर्मविभेदार्थवर्णनाशनतत्परः । बुद्धो गुप्तार्थवक्ता च नानाशास्त्रविधायकः ॥ २४२॥ नष्टधर्ममनुष्यादिलक्षणज्ञापनोत्सुकः
    । आश्रयैकगतिज्ञाता कल्किः कलिमलापहः ॥ २४३॥ शास्त्रवैराग्यसम्बोधो नानाप्रलयबोधकः । विशेषतः शुकव्याजपरीक्षिज्ज्ञानबोधकः
    ॥ २४४॥ शुकेष्टगतिरूपात्मा परीक्षिद्देहमोक्षदः । शब्दरूपो नादरूपो वेदरूपो विभेदनः ॥ २४५॥ व्यासः शाखाप्रवक्ता
    च पुराणार्थप्रवर्तकः । मार्कण्डेयप्रसन्नात्मा वटपत्रपुटेशयः ॥ २४६॥ मायाव्याप्तमहामोहदुःखशान्तिप्रवर्तकः
    । महादेवस्वरूपश्च भक्तिदाता कृपानिधिः ॥ २४७॥ आदित्यान्तर्गतः कालः द्वादशात्मा सुपूजितः । श्रीभागवतरूपश्च
    सर्वार्थफलदायकः ॥ २४८॥ इतीदं कीर्तनीयस्य हरेर्नामसहस्रकम् । पञ्चसप्ततिविस्तीर्णं पुराणान्तरभाषितम्
    ॥ २४९॥ य एतत्प्रातरुत्थाय श्रद्धावान् सुसमाहितः । जपेदर्थाहितमतिः स गोविन्दपदं लभेत् ॥ २५०॥ सर्वधर्मविनिर्मुक्तः
    सर्वसाधनवर्जितः । एतद्धारणमात्रेण कृष्णस्य पदवीं व्रजेत् ॥ २५१॥ हर्यावेशितचित्तेन श्रीभागवतसागरात्
    । समुद्धृतानि नामानि चिन्तामणिनिभानि हि ॥ २५२॥ कण्ठस्थितान्यर्थदीप्त्या बाधन्तेऽज्ञानजं तमः । भक्तिं
    श्रीकृष्णदेवस्य साधयन्ति विनिश्चितम् ॥ २५३॥ किम्बहूक्तेन भगवान् नामभिः स्तुतषड्गुणः । आत्मभावं नयत्याशु
    भक्तिं च कुरुते दृढाम् ॥ २५४॥ यः कृष्णभक्तिमिह वाञ्छति साधनौघैर्
