id: raghavendrabandhamocanakavacam
category: kavacha
name:
  english: raghavendrabandhamocanakavacam
  devanagari: राघवेन्द्रबन्धमोचनकवचम्
content:
  english: shriraghavendrabandhamocanakavacam atha shriraghavendraryakavacam mantranamajam | kalau pratyakshaphaladam
    bahvayasena vai vina || 1|| guroh putro'vadhuto'ham vakshye chandasyanushtubhih | ram bijam ca namah
    shakti raghavendraya kilakam || 2|| shritajanasuradhenau shrisudhindraryasunau duritatimirabhanau
    durdashayah krishanau | viracitabhayahanau vamahaste'tra janau mama vasatu yatindre manasam raghavendre
    || 3|| om shrim shriraghavendraryagururajah shiro'vatu | om ram ramamahaviraradhako'vatu so'likam
    || 4|| om gham ghanatarapattiharano rakshatu bhruvau | om vem venkatashaileshapujako'vatu cakshine
    || 5|| om dram dravayitaratih karnavavatu santatam | om yam yatishvaro nasam om nam namyah kapolakau
    || 6|| om mam manno'vatajjihvam om mam maskarabhridgalam | om nam narayanapreshthah skandhadesham
    sada'vatu || 7|| om yam yakshadibhayaha vakshah patu nirantaram | om dram drak chinnasarvaribandhano'vyadbhujau
    sada || 8|| om vem vepitashatrushca hastau rakshatu sarvada | om gham ghoravishabadhapariharta'vatudaram
    || 9|| om ram rajadi nirbandhachedakritpatu parshvayoh | om shrim shrihanumadbhaktah katim madhyam
    ca rakshatu || 10|| om shrim shrilajanastutyo guhyam rakshatu shashvatam | om ram rashtrakshemakaro
    uru rakshatu januni || 11|| om gham ghanango janghe ca om vem vedantavedakah | om gulmau rakshatu
    padau tu om dram drutagatipradah || 12|| om yam yamanidhih prishtham om nam cittam natakhilah | om
    mam matridoshaghnah sarvanganyapi rakshatu || 13|| malamantrastotram
  devanagari: श्रीराघवेन्द्रबन्धमोचनकवचम् अथ श्रीराघवेन्द्रार्यकवचं मन्त्रनामजम् । कलौ प्रत्यक्षफलदं बह्वायासेन
    वै विना ॥ १॥ गुरोः पुत्रोऽवधूतोऽहं वक्ष्ये छन्दस्यनुष्टुभिः । रां बीजं च नमः शक्ती राघवेन्द्राय कीलकम्
    ॥ २॥ श्रितजनसुरधेनौ श्रीसुधीन्द्रार्यसूनौ दुरिततिमिरभानौ दुर्दशायाः कृशानौ । विरचितभयहानौ वामहस्तेऽत्र
    जानौ मम वसतु यतीन्द्रे मानसं राघवेन्द्रे ॥ ३॥ ॐ श्रीं श्रीराघवेन्द्रार्यगुरुराजः शिरोऽवतु । ॐ रां
    राममहावीराराधकोऽवतु सोऽलिकम् ॥ ४॥ ॐ घं घनतरापत्तिहरणो रक्षतु भ्रुवौ । ॐ वें वेङ्कटशैलेशपूजकोऽवतु चाक्षिणे
    ॥ ५॥ ॐ द्रां द्रावयितारातिः कर्णाववतु सन्ततम् । ॐ यं यतीश्वरो नासां ॐ नं नम्यः कपोलकौ ॥ ६॥ ॐ मं मान्नोऽवताज्जिह्वां
    ॐ मं मस्करभृद्गलम् । ॐ नं नारायणप्रेष्ठः स्कन्धदेशं सदाऽवतु ॥ ७॥ ॐ यं यक्षादिभयहा वक्षः पातु निरन्तरम्
    । ॐ द्रां द्राक् छिन्नसर्वारिबन्धनोऽव्याद्भुजौ सदा ॥ ८॥ ॐ वें वेपितशत्रुश्च हस्तौ रक्षतु सर्वदा ।
    ॐ घं घोरविषबाधापरिहर्ताऽवतूदरम् ॥ ९॥ ॐ रां राजादि निर्बन्धछेदकृत्पातु पार्श्वयोः । ॐ श्रीं श्रीहनुमद्भक्तः
    कटिं मध्यं च रक्षतु ॥ १०॥ ॐ श्रीं श्रीलजनस्तुत्यो गुह्यं रक्षतु शाश्वतम् । ॐ रां राष्ट्रक्षेमकरो ऊरू
    रक्षतु जानुनी ॥ ११॥ ॐ घं घनाङ्गो जङ्घे च ॐ वें वेदान्तवेदकः । ॐ गुल्मौ रक्षतु पादौ तु ॐ द्रां द्रुतगतिप्रदः
    ॥ १२॥ ॐ यं यमनिधिः पृष्ठं ॐ नं चित्तं नताखिलः । ॐ मं मातृदोषघ्नः सर्वाङ्गान्यपि रक्षतु ॥ १३॥ मालामन्त्रस्तोत्रं
