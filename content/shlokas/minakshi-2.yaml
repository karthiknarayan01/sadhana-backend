id: minakshi-2
category: stotram
name:
  english: minakshi 2
  devanagari: मीनाक्षी २
content:
  english: shriminakshistutih adraksham bahubhagyato guruvaraih sampujyamanam muda pullanmallimukhaprasunanivahairhalasyanathapriyam
    | vinavenumridangavadyamuditamenanka bimbananam kanadadisamastashastramatitam shonadharam shyamalam
    || 1|| matangakumbhavijayistanabharabhugna madhyam madarunavilocanavashyakantam | tamradharasphuritahasavidhutatara
    rajapravalasushumam bhaja minanetram || 2|| apadamastakadayarasapurapurnam shapayudhottamasamarcitapadapadmam
    | capayitekshumamalimasacittatayai nipataviviharnam bhaja minanetram || 3|| kandarpa vairyapi yaya
    savilasa hasa netravalokana vashikrita manaso'bhut | tam sarvada sakala mohana rupa vesham mohandhakara
    haranam bhaja minanetram || 4|| adyapi yatpuragatah sakalo'pi jantuh kshuttrid vyatha virahitah prasuveva
    balah | samposhyate karunaya bhajakarti hantrim bhaktya'nvaham tam hridaya bhaja minanetram || 5||
    halasyanatha dayite karuna payodhe balam vilola manasam karunaika patram | vikshasva mam laghu dayarmila
    drishtapadair
  devanagari: श्रीमीनाक्षीस्तुतिः अद्राक्षं बहुभाग्यतो गुरुवरैः सम्पूज्यमानां मुदा पुल्लन्मल्लिमुखप्रसूननिवहैर्हालास्यनाथप्रियाम्
    । वीणावेणुमृदङ्गवाद्यमुदितामेणाङ्क बिम्बाननां काणादादिसमस्तशास्त्रमतिताम् शोणाधरां श्यामलाम् ॥ १॥
    मातङ्गकुम्भविजयीस्तनभारभुग्न मध्यां मदारुणविलोचनवश्यकान्ताम् । ताम्राधरस्फुरितहासविधूततार राजप्रवालसुषुमां
    भज मीननेत्राम् ॥ २॥ आपादमस्तकदयारसपूरपूर्णां शापायुधोत्तमसमर्चितपादपद्माम् । चापयितेक्षुममलीमसचित्ततायै
    नीपाटविविहर्णां भज मीननेत्रम् ॥ ३॥ कन्दर्प वैर्यपि यया सविलास हास नेत्रावलोकन वशीकृत मानसोऽभूत् ।
    तां सर्वदा सकल मोहन रूप वेषां मोहान्धकार हरणां भज मीननेत्राम् ॥ ४॥ अद्यापि यत्पुरगतः सकलोऽपि जन्तुः
    क्षुत्तृड् व्यथा विरहितः प्रसुवेव बालः । सम्पोश्यते करुणया भजकार्ति हन्त्रीं भक्त्याऽन्वहं तां हृदय
    भज मीननेत्राम् ॥ ५॥ हालास्यनाथ दयिते करुणा पयोधे बालं विलोल मनसं करुणैक पात्रम् । वीक्षस्व मां लघु
    दयार्मिल दृष्टपादैर्
