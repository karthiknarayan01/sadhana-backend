id: purushottamaproktamsarvadevadistotram
category: stotram
name:
  english: purushottamaproktamsarvadevadistotram
  devanagari: पुरुषोत्तमप्रोक्तंसर्वदेवादिस्तोत्रम्
content:
  english: namah shriparameshaya namo'ksharadhipaya ca | namo muktadhinathaya namo brahmapriyajushe ||
    14|| haripriyadipataye namo namo'vatarine | namo'nadikrishnanarayanaya paramatmane || 15|| nama ishvaranathayeshvarinisvamine
    namah | namo vyuhadhinathaya vaishnavisvamine namah || 16|| namo narayanishaya shrilakshmishaya te
    namah | namo'ntaryamine vedanidhaye te namo namah || 17|| namah sahasrashirshaya'sankhyanamne ca te
    namah | vishnave shambhave'jaya trirupaya ca te namah || 18|| adityebhyo namashcapi vasubhyashca namo
    namah | ashvibhyam ca namah sarvasurebhyashca namo namah || 19|| yajnadevebhya eva'pi kalaya mrityave
    namah | vishvadevebhya evapi pitribhyashca namo namah || 20|| siddhebhyashca munibhyashca sadhubhyashca
    namo muhuh | ganeshvarebhyah sarvebhyah parshadebhyo namo namah || 21|| sadhvibhyashca satibhyashca
    devibhyashca namo namah | matribhyashca janakebhyo vriddhebhyashca namo namah || 22|| viprebhyah pujyavargebhyastirthebhyashca
    namo namah | kambharayai mahalakshmyai santushtayai namo namah || 23|| manikyayai prabhavatyai prajnayai
    ca namo namah | lakshmyai shriyai radhikayai kamalayai namo namah || 24|| shrimadgopalakrishnaya te
    mahavishnave namah | saptarshibhyo manavebhyo brahmanebhyo namo namah || 25|| camatkaripurushebhyah
    sadgurubhyo namo namah | dharmaya bhaktyai krishnaya haraye ca namo namah || 26|| naraya tatpurvajaya
    vrishajebhyo namo namah | dikpalebhyah samastebhyo lokapalebhya anamah || 27|| gurubhyo mokshadebhyashca
    shantidebhyo namo namah | palakebhyah pavitrebhyah pavanebhyo namo namah || 28|| pavakebhyashca tattvebhyashcaishvaryebhyo
    namo namah | sarvabhyo brahmavidyabhyo muktidabhyo namo namah || 29|| gurvibhyah kamadhenubhyah sadbhyo
    muhurnamo namah | tapasebhyah shiladharmibhyo yogibhyo namo namah || 30|| sarvatmane'nadikrishnanarayanaya
    te namah | svatahprakasharupaya mantranam nidhaye namah
  devanagari: नमः श्रीपरमेशाय नमोऽक्षराधिपाय च । नमो मुक्ताधिनाथाय नमो ब्रह्मप्रियाजुषे ॥ १४॥ हरिप्रियादिपतये
    नमो नमोऽवतारिणे । नमोऽनादिकृष्णनारायणाय परमात्मने ॥ १५॥ नम ईश्वरनाथायेश्वरिणीस्वामिने नमः । नमो व्यूहाधिनाथाय
    वैष्णवीस्वामिने नमः ॥ १६॥ नमो नारायणीशाय श्रीलक्ष्मीशाय ते नमः । नमोऽन्तर्यामिणे वेदनिधये ते नमो नमः
    ॥ १७॥ नमः सहस्रशीर्षायाऽसङ्ख्यनाम्ने च ते नमः । विष्णवे शम्भवेऽजाय त्रिरूपाय च ते नमः ॥ १८॥ आदित्येभ्यो
    नमश्चापि वसुभ्यश्च नमो नमः । अश्विभ्यां च नमः सर्वसुरेभ्यश्च नमो नमः ॥ १९॥ यज्ञदेवेभ्य एवाऽपि कालाय
    मृत्यवे नमः । विश्वदेवेभ्य एवापि पितृभ्यश्च नमो नमः ॥ २०॥ सिद्धेभ्यश्च मुनिभ्यश्च साधुभ्यश्च नमो मुहुः
    । गणेश्वरेभ्यः सर्वेभ्यः पार्षदेभ्यो नमो नमः ॥ २१॥ साध्वीभ्यश्च सतीभ्यश्च देवीभ्यश्च नमो नमः । मातृभ्यश्च
    जनकेभ्यो वृद्धेभ्यश्च नमो नमः ॥ २२॥ विप्रेभ्यः पूज्यवर्गेभ्यस्तीर्थेभ्यश्च नमो नमः । कम्भरायै महालक्ष्म्यै
    सन्तुष्टायै नमो नमः ॥ २३॥ माणिक्यायै प्रभावत्यै प्रज्ञायै च नमो नमः । लक्ष्म्यै श्रियै राधिकायै कमलायै
    नमो नमः ॥ २४॥ श्रीमद्गोपालकृष्णाय ते महाविष्णवे नमः । सप्तर्षिभ्यो मानवेभ्यो ब्राह्मणेभ्यो नमो नमः
    ॥ २५॥ चमत्कारिपुरुषेभ्यः सद्गुरुभ्यो नमो नमः । धर्माय भक्त्यै कृष्णाय हरये च नमो नमः ॥ २६॥ नराय तत्पूर्वजाय
    वृषजेभ्यो नमो नमः । दिक्पालेभ्यः समस्तेभ्यो लोकपालेभ्य आनमः ॥ २७॥ गुरुभ्यो मोक्षदेभ्यश्च शान्तिदेभ्यो
    नमो नमः । पालकेभ्यः पवित्रेभ्यः पावनेभ्यो नमो नमः ॥ २८॥ पावकेभ्यश्च तत्त्वेभ्यश्चैश्वर्येभ्यो नमो
    नमः । सर्वाभ्यो ब्रह्मविद्याभ्यो मुक्तिदाभ्यो नमो नमः ॥ २९॥ गुर्वीभ्यः कामधेनुभ्यः सद्भ्यो मुहुर्नमो
    नमः । तापसेभ्यः शीलधर्मिभ्यो योगिभ्यो नमो नमः ॥ ३०॥ सर्वात्मनेऽनादिकृष्णनारायणाय ते नमः । स्वतःप्रकाशरूपाय
    मन्त्राणां निधये नमः
