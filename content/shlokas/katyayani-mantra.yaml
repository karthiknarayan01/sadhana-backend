id: katyayani-mantra
category: stotram
name:
  english: Katyayani Mantra
content:
  english: katyayani mantrah katyayani mahamaye mahayoginyadhishvari | nanda gopasutam devipatim me kuru
    te namah || ||om hrim katyayanyai svaha || || hrim shrim katyayanyai svaha || vivaha hetu mantrah
    om katyayani mahamaye mahayoginyadhisvari | nandagopasutam devi patim me kuru te namah || he gauri
    shankarardhangi | yatha tvam shankarapriya || tatha ma~ kuru kalyani | kanta kanta sudurlabham|| om
    devendrani namastubhyam devendrapriya bhamini| vivaham bhagyamarogyam shighram ca dehi me || om sham
    shankaraya sakala janmarjita papa vidhvamsa naya purushartha catustaya labhaya ca patim me dehi kuru
    kuru svaha || vivahartham suryamantrah om devendrani namastubhyam devendrapriya bhamini | vivaham
    bhagyamarogyam shighralabham ca dehi me ||
  devanagari: कात्यायनि मन्त्राः कात्यायनि महामाये महायोगिन्यधीश्वरि । नन्द गोपसुतं देविपतिं मे कुरु ते
    नमः ॥ ॥ॐ ह्रीं कात्यायन्यै स्वाहा ॥ ॥ ह्रीं श्रीं कात्यायन्यै स्वाहा ॥ विवाह हेतु मन्त्राः ॐ कात्यायनि
    महामाये महायोगिन्यधीस्वरि । नन्दगोपसुतं देवि पतिं मे कुरु ते नमः ॥ हे गौरी शङ्करार्धाङ्गि । यथा त्वं
    शङ्करप्रिया ॥ तथा माँ कुरु कल्याणि । कान्त कान्ता सुदुर्लभाम्॥ ॐ देवेन्द्राणि नमस्तुभ्यं देवेन्द्रप्रिय
    भामिनि। विवाहं भाग्यमारोग्यं शीघ्रं च देहि मे ॥ ॐ शं शङ्कराय सकल जन्मार्जित पाप विध्वंस नाय पुरुषार्थ
    चतुस्टय लाभाय च पतिं मे देहि कुरु कुरु स्वाहा ॥ विवाहार्थं सूर्यमन्त्राः ॐ देवेन्द्राणि नमस्तुभ्यं
    देवेन्द्रप्रिय भामिनि । विवाहं भाग्यमारोग्यं शीघ्रलाभं च देहि मे ॥
