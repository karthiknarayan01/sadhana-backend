id: nava-graha-kavacham
category: stotram
name:
  english: Nava Graha Kavacham
content:
  english: shiro me patu martando kapalam rohinipatih | mukhamangarakah patu kanthashca shashinandanah
    || || buddhim jivah sada patu hridayam bhrigunandanah | jatharam ca shanih patu jihvam me ditinandanah
    || || padau ketuh sada patu varah sarvangameva ca | tithayo'shtau dishah pantu nakshatrani vapuh sada
    || || amsau rashih sada patu yogashca sthairyameva ca | guhyam lingam sada pantu sarve grahah shubhapradah
    || || animadini sarvani labhate yah pathed dhrivam | etam raksham pathed yastu bhaktya sa prayatah
    sudhih || || sa cirayuh sukhi putri rane ca vijayi bhavet | aputro labhate putram dhanarthi dhanamapnuyat
    || || dararthi labhate bharyam surupam sumanoharam | rogi rogatpramucyeta baddho mucyeta bandhanat
    || || jale sthale cantarikshe karagare visheshatah | yah kare dharayennityam bhayam tasya na vidyate
    || || brahmahatya surapanam steyam gurvanganagamah | sarvapapaih pramucyeta kavacasya ca dharanat
    || || nari vamabhuje dhritva sukhaishvaryasamanvita | kakavandhya janmavandhya mritavatsa ca ya bhavet
    | bahvapatya jivavatsa kavacasya prasadatah || || iti grahayamale uttarakhande navagraha kavacam samaptam
    |
  devanagari: शिरो मे पातु मार्ताण्डो कपालं रोहिणीपतिः । मुखमङ्गारकः पातु कण्ठश्च शशिनन्दनः ॥ ॥ बुद्धिं
    जीवः सदा पातु हृदयं भृगुनन्दनः । जठरं च शनिः पातु जिह्वां मे दितिनन्दनः ॥ ॥ पादौ केतुः सदा पातु वाराः
    सर्वाङ्गमेव च । तिथयोऽष्टौ दिशः पान्तु नक्षत्राणि वपुः सदा ॥ ॥ अंसौ राशिः सदा पातु योगाश्च स्थैर्यमेव
    च । गुह्यं लिङ्गं सदा पान्तु सर्वे ग्रहाः शुभप्रदाः ॥ ॥ अणिमादीनि सर्वाणि लभते यः पठेद् धृवम् । एतां
    रक्षां पठेद् यस्तु भक्त्या स प्रयतः सुधीः ॥ ॥ स चिरायुः सुखी पुत्री रणे च विजयी भवेत् । अपुत्रो लभते
    पुत्रं धनार्थी धनमाप्नुयात् ॥ ॥ दारार्थी लभते भार्यां सुरूपां सुमनोहराम् । रोगी रोगात्प्रमुच्येत बद्धो
    मुच्येत बन्धनात् ॥ ॥ जले स्थले चान्तरिक्षे कारागारे विशेषतः । यः करे धारयेन्नित्यं भयं तस्य न विद्यते
    ॥ ॥ ब्रह्महत्या सुरापानं स्तेयं गुर्वङ्गनागमः । सर्वपापैः प्रमुच्येत कवचस्य च धारणात् ॥ ॥ नारी वामभुजे
    धृत्वा सुखैश्वर्यसमन्विता । काकवन्ध्या जन्मवन्ध्या मृतवत्सा च या भवेत् । बह्वपत्या जीववत्सा कवचस्य
    प्रसादतः ॥ ॥ इति ग्रहयामले उत्तरखण्डे नवग्रह कवचं समाप्तम् ।
