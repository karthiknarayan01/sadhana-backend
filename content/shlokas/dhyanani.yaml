id: dhyanani
category: stotram
name:
  english: dhyanani
  devanagari: ध्यानानि
content:
  english: vishvodgavasthitilayadishu hetumekam mayashrayam vigatamayamacintyamurtim | anandasandramamalam
    nijabodharupam sitapatim viditatattvamaham namami | 17|| || shrisadgurucaranaravindabhyam namah dhyayami
    ||
  devanagari: विश्वोद्गवस्थितिलयादिषु हेतुमेकं मायाश्रयं विगतमायमचिन्त्यमूर्तिम् । आनन्दसान्द्रममलं निजबोधरूपं
    सीतापतिं विदिततत्त्वमहं नमामि । १७॥ ॥ श्रीसद्गुरुचरणारविन्दाभ्यां नमः ध्यायामि ॥
meaning: {}
