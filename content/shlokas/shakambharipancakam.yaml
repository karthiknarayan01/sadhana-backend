id: shakambharipancakam
category: kavacha
name:
  english: shakambharipancakam
  devanagari: शाकम्भरीपन्चकम्
content:
  english: shrishakambharipancakam shrivallabhasodari shritajanashciddayini shrimati shrikanthardhashariraga
    shrutilasanmanikyatatankaka | shricakrantaravasini shrutishirah siddhantamargapriya shrivani girijatmika
    bhagavati shakambhari patu mam || 1|| shanta sharadacandrasundaramukhi shalyannabhojyapriya shakaih
    palitavishtapa shatadrisha shakollasadvigraha | shyamangi sharanagatartishamani shakradibhih shamsita
    shankaryashtaphalaprada bhagavati shakambhari patu mam || 2|| kanjakshi kalashi bhavadivinuta katyayani
    kamada kalyani kamalalaya karakritam bhojasikhetabhaya | kadamvasavamodini kucalasatkashmirajalepana
    kasturitilakancita bhagavati shakambhari patu mam || 3|| bhaktanandavidhayini bhavabhayapradhvamsini
    bhairavi bharmalankritibhasura bhuvanabhikrid durgadarpapaha | bhubhrinnayakanandini bhuvanasurbhasyatparah
    kotibha bhaumananda viharini bhagavati shakambhari patu mam || 4|| ritamnayashikhasu raktadashana
    rajivapatrekshana rakarajakaravadatahasita rakendubimbasthita | rudrani rajanikararbhakalasanmauli
    rajorupini rakshah shikshanadikshita bhagavati shakambhari patu mam || 5|| shlokanamiha pancakam pathati
    yah stotratmakam sharmadam sarvapattivinashakam pratidinam bhaktya trisandhyam narah | ayuhpurnamaparamarthamamalam
    kirti prajamakshayam shakambharyanukampaya sa labhate vidyam ca vishvarthakam || 6|| || iti shrimacchankaracaryaviracitam
    shakambharipancakam sampurnam ||
  devanagari: श्रीशाकम्भरीपञ्चकम् श्रीवल्लभसोदरी श्रितजनश्चिद्दायिनी श्रीमती श्रीकण्ठार्धशरीरगा श्रुतिलसन्माणिक्यताटङ्कका
    । श्रीचक्रान्तरवासिनी श्रुतिशिरः सिद्धान्तमार्गप्रिया श्रीवाणी गिरिजात्मिका भगवती शाकम्भरी पातु माम्
    ॥ १॥ शान्ता शारदचन्द्रसुन्दरमुखी शाल्यन्नभोज्यप्रिया शाकैः पालितविष्टपा शतदृशा शाकोल्लसद्विग्रहा ।
    श्यामाङ्गी शरणागतार्तिशमनी शक्रादिभिः शंसिता शङ्कर्यष्टफलप्रदा भगवती शाकम्भरी पातु माम् ॥ २॥ कञ्जाक्षी
    कलशी भवादिविनुता कात्यायनी कामदा कल्याणी कमलालया करकृतां भोजासिखेटाभया । कादंवासवमोदिनी कुचलसत्काश्मीरजालेपना
    कस्तूरीतिलकाञ्चिता भगवती शाकम्भरी पातु माम् ॥ ३॥ भक्तानन्दविधायिनी भवभयप्रध्वंसिनी भैरवी भर्मालङ्कृतिभासुरा
    भुवनभीकृद् दुर्गदर्पापहा । भूभृन्नायकनन्दिनी भुवनसूर्भास्यत्परः कोटिभा भौमानन्द विहारिणी भगवती शाकम्भरी
    पातु माम् ॥ ४॥ रीताम्नायशिखासु रक्तदशना राजीवपत्रेक्षणा राकाराजकरावदातहसिता राकेन्दुबिम्बस्थिता ।
    रुद्राणी रजनीकरार्भकलसन्मौली रजोरुपिणी रक्षः शिक्षणदीक्षिता भगवती शाकम्भरी पातु माम् ॥ ५॥ श्लोकानामिह
    पञ्चकं पठति यः स्तोत्रात्मकं शर्मदं सर्वापत्तिविनाशकं प्रतिदिनं भक्त्या त्रिसन्ध्यं नरः । आयुःपूर्णमपारमर्थममलां
    कीर्ति प्रजामक्षयां शाकम्भर्यनुकम्पया स लभते विद्यां च विश्वार्थकाम् ॥ ६॥ ॥ इति श्रीमच्छङ्कराचार्यविरचितं
    शाकम्भरीपञ्चकं सम्पूर्णम् ॥
