id: manigrivakritamshivastotram
category: stotram
name:
  english: manigrivakritamshivastotram
  devanagari: मणिग्रीवकृतंशिवस्तोत्रम्
content:
  english: manigrivakritam shivastotram manigriva uvaca | namah sarvajagatkartre pitre prakritisakshine
    | bhairavaya paranandanidhaye vedhase namah || 78|| niyantre sarvalokanam nigamagamamurtaye | bhairavaya
    paranandanidhaye vedhase namah || 79|| rogashokabhayakleshamohatamisrabhasvate | bhairavaya paranandanidhaye
    vedhase namah || 80|| prasida mantragamatirthadevatakratukriyakshetravishesharupine | bhavaya papakshayahetave
    satam namo namo bhairavabhadramurtaye || 81|| iti stuvan nayanayugajjaladravam jalaughatah padayugamasya
    secayan | papata tatsavidhamasau mahitale bhavarnavadava shiva mamitirayan || 82|| iti tamraparnimahatmye
    ekatrimshadhyayantargatam manigrivakritam shivastotram sampurnam | tamraparnimahatmya | adhyaya 31
  devanagari: मणिग्रीवकृतं शिवस्तोत्रम् मणिग्रीव उवाच । नमः सर्वजगत्कर्त्रे पित्रे प्रकृतिसाक्षिणे । भैरवाय
    परानन्दनिधये वेधसे नमः ॥ ७८॥ नियन्त्रे सर्वलोकानां निगमागममूर्तये । भैरवाय परानन्दनिधये वेधसे नमः
    ॥ ७९॥ रोगशोकभयक्लेशमोहतामिस्रभास्वते । भैरवाय परानन्दनिधये वेधसे नमः ॥ ८०॥ प्रसीद मन्त्रागमतीर्थदेवताक्रतुक्रियाक्षेत्रविशेषरूपिणे
    । भवाय पापक्षयहेतवे सतां नमो नमो भैरवभद्रमूर्तये ॥ ८१॥ इति स्तुवन् नयनयुगाज्जलद्रवं जलौघतः पदयुगमस्य
    सेचयन् । पपात तत्सविधमसौ महीतले भवार्णवादव शिव मामितीरयन् ॥ ८२॥ इति ताम्रपर्णीमाहात्म्ये एकत्रिंशाध्यायान्तर्गतं
    मणिग्रीवकृतं शिवस्तोत्रं सम्पूर्णम् । ताम्रपर्णीमाहात्म्य । अध्याय ३१
