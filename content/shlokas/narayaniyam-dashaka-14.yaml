id: narayaniyam-dashaka-14
category: stotram
name:
  english: Narayaniyam Dashaka 14
content:
  english: samanusmritatavakanghriyugmah sa manuh pankajasambhavangajanma | nijamantaramantarayahinam
    caritam te kathayan sukham ninaya || || samaye khalu tatra kardamakhyo druhinacchayabhavastadiyavaca
    | dhritasargaraso nisargaramyam bhagavamstvamayutam samah sisheve || || garudopari kalameghakramam
    vilasatkelisarojapanipadmam | hasitollasitananam vibho tvam vapuravishkurushe sma kardamaya || ||
    stuvate pulakavritaya tasmai manuputrim dayitam navapi putrih | kapilam ca sutam svameva pashcat svagatim
    capyanugrihya nirgato'bhuh || || sa manuh shatarupaya mahishya gunavatya sutaya ca devahutya | bhavadiritanaradopadishtah
    samagat kardamamagatipratiksham || || manunopahritam ca devahutim taruniratnamavapya kardamo'sau |
    bhavadarcananivrito'pi tasyam dridhashushrushanaya dadhau prasadam || || sa punastvadupasanaprabhava
    ddayitakamakrite krite vimane | vanitakulasankulo navatma vyaharaddevapatheshu devahutya || || shatavarshamatha
    vyatitya so'yam nava kanyah samavapya dhanyarupah | vanayanasamudyato'pi kanta hitakrittvajjananotsuko
    nyavatsit || || nijabhartrigira bhavannisheva niratayamatha deva devahutyam | kapilastvamajayatha
    jananam prathayishyan paramatmatattvavidyam || || vanameyushi kardame prasanne matasarvasvamupadishan
    jananyai | kapilatmaka vayumandiresha tvaritam tvam paripahi mam gadaughat ||
  devanagari: समनुस्मृततावकाङ्घ्रियुग्मः स मनुः पङ्कजसम्भवाङ्गजन्मा । निजमन्तरमन्तरायहीनं चरितं ते कथयन्
    सुखं निनाय ॥ ॥ समये खलु तत्र कर्दमाख्यो द्रुहिणच्छायभवस्तदीयवाचा । धृतसर्गरसो निसर्गरम्यं भगवंस्त्वामयुतं
    समाः सिषेवे ॥ ॥ गरुडोपरि कालमेघक्रमं विलसत्केलिसरोजपाणिपद्मम् । हसितोल्लसिताननं विभो त्वं वपुराविष्कुरुषे
    स्म कर्दमाय ॥ ॥ स्तुवते पुलकावृताय तस्मै मनुपुत्रीं दयितां नवापि पुत्रीः । कपिलं च सुतं स्वमेव पश्चात्
    स्वगतिं चाप्यनुगृह्य निर्गतोऽभूः ॥ ॥ स मनुः शतरूपया महिष्या गुणवत्या सुतया च देवहूत्या । भवदीरितनारदोपदिष्टः
    समगात् कर्दममागतिप्रतीक्षम् ॥ ॥ मनुनोपहृतां च देवहूतिं तरुणीरत्नमवाप्य कर्दमोऽसौ । भवदर्चननिवृतोऽपि
    तस्यां दृढशुश्रूषणया दधौ प्रसादम् ॥ ॥ स पुनस्त्वदुपासनप्रभावा द्दयिताकामकृते कृते विमाने । वनिताकुलसङ्कुलो
    नवात्मा व्यहरद्देवपथेषु देवहूत्या ॥ ॥ शतवर्षमथ व्यतीत्य सोऽयं नव कन्याः समवाप्य धन्यरूपाः । वनयानसमुद्यतोऽपि
    कान्ता हितकृत्त्वज्जननोत्सुको न्यवात्सीत् ॥ ॥ निजभर्तृगिरा भवन्निषेवा निरतायामथ देव देवहूत्याम् ।
    कपिलस्त्वमजायथा जनानां प्रथयिष्यन् परमात्मतत्त्वविद्याम् ॥ ॥ वनमेयुषि कर्दमे प्रसन्ने मतसर्वस्वमुपादिशन्
    जनन्यै । कपिलात्मक वायुमन्दिरेश त्वरितं त्वं परिपाहि मां गदौघात् ॥
