id: dakshinamurtistotrashutasamhita
category: stotram
name:
  english: dakshinamurtistotrashutasamhita
  devanagari: दक्षिणामूर्तिस्तोत्रषुतसम्हित
content:
  english: vigraham || 7|| dharmarupavrishopetam dharmikairvedaparagaih | munibhissamvritam mayavatamulashritam
    shubham || 8|| ishanam sarvavidyanamishvareshvaramavyayam | utpattyadivinirmuktam onkarakamalasanam
    || 9|| svatmavidyapradanena sada samsaramocakam | rudram paramakarunyatsarvapranihite ratam || 10||
    upasakanam sarveshamabhishtasakalapradam | dakshinamurtidevakhyam jagatsvargadikaranam || 11|| samagatya
    mahabhaktya dandavatprithivitale | pranamya bahusho devam samaradhya yatha balam || 12|| rudra yatte
    mukham tena dakshinam pahi mamiti | uktva punah punardevam pujayamasa bhaktitah || 13|| || iti sutasamhitantargatam
    dakshinamurtistotram sampurnam ||
  devanagari: विग्रहम् ॥ ७॥ धर्मरूपवृषोपेतं धार्मिकैर्वेदपारगैः । मुनिभिस्संवृतं मायावटमूलाश्रितं शुभम्
    ॥ ८॥ ईशानं सर्वविद्यानामीश्वरेश्वरमव्ययम् । उत्पत्त्यादिविनिर्मुक्तं ओङ्कारकमलासनम् ॥ ९॥ स्वात्मविद्याप्रदानेन
    सदा संसारमोचकम् । रुद्रं परमकारुण्यात्सर्वप्राणिहिते रतम् ॥ १०॥ उपासकानां सर्वेषामभीष्टसकलप्रदम् ।
    दक्षिणामूर्तिदेवाख्यं जगत्स्वर्गादिकारणम् ॥ ११॥ समागत्य महाभक्त्या दण्डवत्पृथिवीतले । प्रणम्य बहुशो
    देवं समाराध्य यथा बलम् ॥ १२॥ रुद्र यत्ते मुखं तेन दक्षिणं पाहि मामिति । उक्त्वा पुनः पुनर्देवं पूजयामास
    भक्तितः ॥ १३॥ ॥ इति सूतसंहितान्तर्गतम् दक्षिणामूर्तिस्तोत्रं सम्पूर्णम् ॥
