id: lakshmi-nrusimha-karavalamba-stotram
category: stotram
name:
  english: Lakshmi Nrusimha Karavalamba Stotram
content:
  english: shrimatpayonidhiniketana cakrapane bhogindrabhogamanirajita punyamurte | yogisha shashvata
    sharanya bhavabdhipota lakshminrisimha mama dehi karavalambam || || brahmendrarudramarudarkakiritakoti
    sanghattitanghrikamalamalakantikanta | lakshmilasatkucasaroruharajahamsa lakshminrisimha mama dehi
    karavalambam || || samsaradavadahanakarabhikaroru jvalavalibhiratidagdhatanuruhasya | tvatpadapadmasarasiruhamagatasya
    lakshminrisimha mama dehi karavalambam || || samsarajalapatitasya jagannivasa sarvendriyartha badishagra
    jhashopamasya | protkampita pracurataluka mastakasya lakshminrisimha mama dehi karavalambam || ||
    samsarakupamatighoramagadhamulam samprapya duhkhashatasarpasamakulasya | dinasya deva kripaya padamagatasya
    lakshminrisimha mama dehi karavalambam || || samsarabhikarakarindrakarabhighata nishpidyamanavapushah
    sakalartinasha | pranaprayanabhavabhitisamakulasya lakshminrisimha mama dehi karavalambam || || samsarasarpavishadigdhamahogrativra
    damshtragrakotiparidashtavinashtamurteh | nagarivahana sudhabdhinivasa shaure lakshminrisimha mama
    dehi karavalambam || || samsaravrikshamaghabijamanantakarma shakhayutam karanapatramanangapushpam
    | aruhya duhkhaphalitam cakitah dayalo aruhya duhkhaphalitam patato dayalo lakshminrisimha mama dehi
    karavalambam || || samsarasagaravishalakaralakala nakragrahagrasitanigrahavigrahasya | vyagrasya raganicayorminipiditasya
    lakshminrisimha mama dehi karavalambam || || samsarasagaranimajjanamuhyamanam dinam vilokaya vibho
    karunanidhe mam | prahladakhedapariharaparavatara lakshminrisimha mama dehi karavalambam || || samsaraghoragahane
    carato murare marograbhikaramrigapracurarditasya | artasya matsaranidaghasuduhkhitasya lakshminrisimha
    mama dehi karavalambam || || baddhva gale yamabhata bahu tarjayantah karshanti yatra bhavapashashatairyutam
    mam | ekakinam paravasham cakitam dayalo lakshminrisimha mama dehi karavalambam || || lakshmipate
    kamalanabha suresha vishno yajnesha yajna madhusudana vishvarupa | lakshmipate kamalanabha suresha
    vishno vaikuntha krishna madhusudana pushkaraksha brahmanya keshava janardana vasudeva lakshminrisimha
    mama dehi karavalambam || || ekena cakramaparena karena shankha manyena sindhutanayamavalambya tishthan
    | vametarena varadabhayapadmacihnam lakshminrisimha mama dehi karavalambam || || andhasya me hritavivekamahadhanasya
    corairmahabalibhirindriyanamadheyaih | mohandhakarakuhare vinipatitasya lakshminrisimha mama dehi
    karavalambam || || prahladanaradaparasharapundarika vyasadibhagavatapungavahrinnivasa | bhaktanuraktaparipalanaparijata
    lakshminrisimha mama dehi karavalambam || || lakshminrisimhacaranabjamadhuvratena stotram kritam shubhakaram
    bhuvi shankarena | ye tatpathanti manuja haribhaktiyukta ste yanti tatpadasarojamakhandarupam ||
  devanagari: श्रीमत्पयोनिधिनिकेतन चक्रपाणे भोगीन्द्रभोगमणिराजित पुण्यमूर्ते । योगीश शाश्वत शरण्य भवाब्धिपोत
    लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ ब्रह्मेन्द्ररुद्रमरुदर्ककिरीटकोटि सङ्घट्टिताङ्घ्रिकमलामलकान्तिकान्त
    । लक्ष्मीलसत्कुचसरोरुहराजहंस लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ संसारदावदहनाकरभीकरोरु ज्वालावलीभिरतिदग्धतनूरुहस्य
    । त्वत्पादपद्मसरसीरुहमागतस्य लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ संसारजालपतितस्य जगन्निवास सर्वेन्द्रियार्थ
    बडिशाग्र झषोपमस्य । प्रोत्कम्पित प्रचुरतालुक मस्तकस्य लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ संसारकूपमतिघोरमगाधमूलं
    सम्प्राप्य दुःखशतसर्पसमाकुलस्य । दीनस्य देव कृपया पदमागतस्य लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ संसारभीकरकरीन्द्रकराभिघात
    निष्पीड्यमानवपुषः सकलार्तिनाश । प्राणप्रयाणभवभीतिसमाकुलस्य लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ संसारसर्पविषदिग्धमहोग्रतीव्र
    दंष्ट्राग्रकोटिपरिदष्टविनष्टमूर्तेः । नागारिवाहन सुधाब्धिनिवास शौरे लक्ष्मीनृसिंह मम देहि करावलम्बम्
    ॥ ॥ संसारवृक्षमघबीजमनन्तकर्म शाखायुतं करणपत्रमनङ्गपुष्पम् । आरुह्य दुःखफलितं चकितः दयालो आरुह्य दुःखफलितं
    पततो दयालो लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ संसारसागरविशालकरालकाल नक्रग्रहग्रसितनिग्रहविग्रहस्य
    । व्यग्रस्य रागनिचयोर्मिनिपीडितस्य लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ संसारसागरनिमज्जनमुह्यमानं
    दीनं विलोकय विभो करुणानिधे माम् । प्रह्लादखेदपरिहारपरावतार लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ संसारघोरगहने
    चरतो मुरारे मारोग्रभीकरमृगप्रचुरार्दितस्य । आर्तस्य मत्सरनिदाघसुदुःखितस्य लक्ष्मीनृसिंह मम देहि करावलम्बम्
    ॥ ॥ बद्ध्वा गले यमभटा बहु तर्जयन्तः कर्षन्ति यत्र भवपाशशतैर्युतं माम् । एकाकिनं परवशं चकितं दयालो
    लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ लक्ष्मीपते कमलनाभ सुरेश विष्णो यज्ञेश यज्ञ मधुसूदन विश्वरूप ।
    लक्ष्मीपते कमलनाभ सुरेश विष्णो वैकुण्ठ कृष्ण मधुसूदन पुष्कराक्ष ब्रह्मण्य केशव जनार्दन वासुदेव लक्ष्मीनृसिंह
    मम देहि करावलम्बम् ॥ ॥ एकेन चक्रमपरेण करेण शङ्ख मन्येन सिन्धुतनयामवलम्ब्य तिष्ठन् । वामेतरेण वरदाभयपद्मचिह्नं
    लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ अन्धस्य मे हृतविवेकमहाधनस्य चोरैर्महाबलिभिरिन्द्रियनामधेयैः ।
    मोहान्धकारकुहरे विनिपातितस्य लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ प्रह्लादनारदपराशरपुण्डरीक व्यासादिभागवतपुङ्गवहृन्निवास
    । भक्तानुरक्तपरिपालनपारिजात लक्ष्मीनृसिंह मम देहि करावलम्बम् ॥ ॥ लक्ष्मीनृसिंहचरणाब्जमधुव्रतेन स्तोत्रं
    कृतं शुभकरं भुवि शङ्करेण । ये तत्पठन्ति मनुजा हरिभक्तियुक्ता स्ते यान्ति तत्पदसरोजमखण्डरूपम् ॥
