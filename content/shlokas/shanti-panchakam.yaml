id: shanti-panchakam
category: stotram
name:
  english: Shanti Panchakam
  devanagari: शान्ति-पञ्चकम्
content:
  english: sham no mitrah sham varunah| sham no bhavatvaryama| sham na indro brihaspatih| sham no vishnururukramah|
    namo brahmane| namaste vayo| tvameva pratyaksham brahmasi| tvameva pratyaksham brahma vadishyami|
    ritam vadishyami| satyam vadishyami| tanmamavatu| tadvaktaramavatu| avatu mam| avatu vaktaram | om
    shantih shantih shantih||1|| sham no mitrah sham varunah| sham no bhavatvaryama| sham na indro brihaspatih|
    sham no vishnururukramah| namo brahmane| namaste vayo| tvameva pratyaksham brahmasi| tvameva pratyaksham
    brahma vadishyami| ritam vadishyami| satyam vadishyami| tanmamavatu| tadvaktaramavatu| avatu mam|
    avatu vaktaram | om shantih shantih shantih||2|| om saha navavatu| saha nau bhunaktu| saha viryam
    karavavahai| tejasvi navadhitamastu ma vidvishavahai | om shantih shantih shantih||3|| namo vace ya
    codita ya canudita tasyai vace namo namo vace namo vacaspataye nama rishibhyo mantrakridbhyo mantrapatibhyo
    ma mamrishayo mantrakrito mantrapatayah paradurmahamrishi nmantrakrito mantrapatinparadam vaishvadevim
    vacamudyasa shivamadastam jushtam devebhyah sharma me dyauh sharma prithivi sharma vishvamidam jagat|
    sharma candrashca suryashca sharma brahmaprajapati| bhutam vadishye bhuvanam vadishye tejo vadishye
    yasho vadishye tapo vadishye brahma vadishye satyam vadishye tasma ahamidamupastaranamupastrina upastaranam
    me prajayai pashunam bhuyadupastaranamaham prajayai pashunam bhuyasam pranapanau mrityorma patam pranapanau
    ma ma hasishtam madhu manishye madhu janishye madhu vakshyami madhu vadishyami madhumatim devebhyo
    vacamudyasa bhyastam ma deva avantu shobhayai pitaro'numadantu| om shantih shantih shantih||4|| om
    taccham yoravrinimahe| gatum yajnaya| gatum yajnapataye| daivi svastirastu nah| svastirmanushebhyah|
    urdhvam jigatu bheshajam| sham no astu dvipade | sham catushpade| om shantih shantih shantih||5||
  devanagari: शं नो॑ मि॒त्रः शं वरु॑णः। शं नो॑ भवत्वर्य॒मा। शं न॒ इन्द्रो॒ बृह॒स्पतिः॑। शं नो॒ विष्णु॑रुरुक्र॒मः।
    नमो॒ ब्रह्म॑णे। नम॑स्ते वायो। त्वमे॒व प्र॒त्यक्षं॒ ब्रह्मा॑सि। त्वमे॒व प्र॒त्यक्षं॒ ब्रह्म॑ वदिष्यामि।
    ऋ॒तं व॑दिष्यामि। स॒त्यं व॑दिष्यामि। तन्माम॑वतु। तद्व॒क्तार॑मवतु। अव॑तु॒ माम्। अव॑तु व॒क्तारम् । ॐ
    शान्तिः॒ शान्तिः॒ शान्तिः॑॥१॥ शं नो॑ मि॒त्रः शं वरु॑णः। शं नो॑ भवत्वर्य॒मा। शं न॒ इन्द्रो॒ बृह॒स्पतिः॑।
    शं नो॒ विष्णु॑रुरुक्र॒मः। नमो॒ ब्रह्म॑णे। नम॑स्ते वायो। त्वमे॒व प्र॒त्यक्षं॒ ब्रह्मा॑सि। त्वमे॒व प्र॒त्यक्षं॒
    ब्रह्म॑ वदिष्यामि। ऋ॒तं व॑दिष्यामि। स॒त्यं व॑दिष्यामि। तन्माम॑वतु। तद्व॒क्तार॑मवतु। अव॑तु॒ माम्। अव॑तु
    व॒क्तारम् । ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑॥२॥ ॐ स॒ह ना॑ववतु। स॒ह नौ॑ भुनक्तु। स॒ह वी॒र्यं॑ करवावहै।
    ते॒ज॒स्वि ना॒वधी॑तमस्तु॒ मा वि॑द्विषा॒वहै । ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑॥३॥ नमो॑ वा॒चे या चो॑दि॒ता
    या चानु॑दिता॒ तस्यै॑ वा॒चे नमो॒ नमो॑ वा॒चे नमो॑ वा॒चस्पत॑ये॒ नम॒ ऋषि॑भ्यो मन्त्र॒कृद्भ्यो॒ मन्त्र॑पतिभ्यो॒
    मा मामृष॑यो मन्त्र॒कृतो॑ मन्त्र॒पत॑यः॒ परा॑दु॒र्माहमृषी न्मन्त्र॒कृतो॑ मन्त्र॒पती॒न्परा॑दां वैश्वदे॒वीं
    वाच॑मुद्यास शि॒वामद॑स्तां॒ जुष्टां दे॒वेभ्यः॒ शर्म॑ मे॒ द्यौः शर्म॑ पृथि॒वी शर्म॒ विश्व॑मि॒दं जग॑त्।
    शर्म॑ च॒न्द्रश्च॒ सूर्य॑श्च॒ शर्म॑ ब्रह्मप्रजाप॒ती। भू॒तं व॑दिष्ये॒ भुव॑नं वदिष्ये॒ तेजो॑ वदिष्ये॒
    यशो॑ वदिष्ये॒ तपो॑ वदिष्ये॒ ब्रह्म॑ वदिष्ये स॒त्यं व॑दिष्ये॒ तस्मा॑ अ॒हमि॒दमु॑प॒स्तर॑ण॒मुप॑स्तृण उप॒स्तर॑णं
    मे प्र॒जायै॑ पशू॒नां भू॑यादुप॒स्तर॑णम॒हं प्र॒जायै॑ पशू॒नां भू॑यासं॒ प्राणा॑पानौ मृ॒त्योर्मा॑ पातं॒
    प्राणा॑पानौ॒ मा मा॑ हासिष्टं॒ मधु॑ मनिष्ये॒ मधु॑ जनिष्ये॒ मधु॑ वक्ष्यामि॒ मधु॑ वदिष्यामि॒ मधु॑मतीं
    दे॒वेभ्यो॒ वाच॑मुद्यास भ्य॒स्तं मा॑ दे॒वा अ॑वन्तु शो॒भायै॑ पि॒तरोऽनु॑मदन्तु। ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑॥४॥
    ॐ तच्छं॒ योरावृ॑णीमहे। गा॒तुं य॒ज्ञाय॑। गा॒तुं य॒ज्ञप॑तये। दैवी स्व॒स्तिर॑स्तु नः। स्व॒स्तिर्मानु॑षेभ्यः।
    ऊ॒र्ध्वं जि॑गातु भेष॒जम्। शं नो॑ अस्तु द्वि॒पदे । शं चतु॑ष्पदे। ॐ शान्तिः॒ शान्तिः॒ शान्तिः॑॥५॥
