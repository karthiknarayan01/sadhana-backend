id: prabodharatnamalakubacarya
category: shataka
name:
  english: prabodharatnamalakubacarya
  devanagari: प्रबोधरत्नमालाकुबाचार्य
content:
  english: tvam stranadikaryamacareh || 17|| sandhyam traikalikim kurya stato bhagavato jusham | shribhagavatashushrusham
    na tad bhedadrisham kvacit || 18|| svasmai yanca na kartavya bhagavatarthameva ca | ekaki na kadapitvam
    vase'stu vaishnavaih samam || 19|| vishnushriramabhakti shrutiganaviditam kamadhenoh samanam shashvatsayujyamukteh
    khalu suvitarinindhatrisharvadikamyam | pralhadeshtashukartrim suranikaranutam shemushi sasvarupam
    kuryannityam manushyogatajanikushalino kadacidvimuncet || 20|| vaishnavanamapamanam kasminnamshenakarayet
    | apisatkaramevashuviparito'shivamvrajet || 21|| virakto vaishnavo bhutvavivaham nahi karayet | retah
    pato na kartavyastam kritvapatitobhavet || 22|| bhutvamahantoyadiyoviraktomaurthyatsvakankamayatevivaham
    | dharmacyutestasya vahishkritimsankuryurviraktah stutavaishnavavai || 23|| samajadushakah sadhuryah
    kashcitsyatsudhirapi | sa tyajyah suviraktaishca shrivaishnavah sanatanaih || 24|| sangatiryatnatah
    karyya parasparam suvaishnavaih | sthanamprapyasvadharmo na heyobuddhivisharadaih || 25|| bhagavadvaishnavebhyashca
    yashchadmakarakojanah | adhah patanamayati sahastram janmanishcayam || 26|| nikhilabhuvanajanmasthairyasamharakartuh
    bhajanamananalabdhervedabuddheshca vishnoh | janakumudasudhamshorbrahmaramasyamantrah bhavajaladhisusetorjivamatraya
    deyah || 27|| saccaritradayashamadinilayah shriramabhaktipriyah dambhasatyavivarjitomitavacah kamadishatrutyajah
    | saumyovishvajanina arshamatagovakta ca sadvartmanah krityakrityamatih punatibhuvanam va idrishovaishnavah
    || 28|| shriramarpitamannam yaddevadurlabhamastitat | bhunjate bhagyavantah shritulasidalamishritam
    || 29|| shriramakrishnamurtih sacchalagramakritistatha | pujyadhyeyasadabhaktya shrivaishnavairjagaddhitaih
    || 30|| pratishtha bhagavanmurteh karya shrivaishnavairbudhaih | tadanyaih sthapita sa cetsamskaryya
    vaishnavaih punah || 31|| anyathasa'namaskaryyatathopastivivarjita | sa ca bhavati nisteja bhanudaye
    pradipavat || 32|| sardhahastatrayam vastram sakaupinam shrutiritam | tadevadharyyamasti shrivaishnavanam
    shubhavaham || 33|| dhautam kacchayutam nohi dharyyam viraktavaishnavaih | notarhi vimaledharme dosholagatinaijake
    || 34|| svavesholobhato bhiternaheyovaishnavaih samaih | murkhobhavati satyajyastathasatisvadharmaha
    || 35|| ekadashivratankaryam shriramanavamivratam | krishnashtamivratam divyam nijatmashuddhayaisada
    || 36|| anyamatam na nindeddhisvamatam manayan chubham | pranibhih sahabairam no prakuryadvaishnavobudhah
    || 37|| prapta atithayah sarve satkaryayatnatah sada | yathashaktinijasthanevaishnavastuvisheshatah
    || 38|| utsavonikhilah karyobhagavatashcavarshikah | navyannam suphalam navyam tannaivedyarthamanayet
    || 39|| yathasampattisanandam karyyatannyunatanahi | anarpitam na bhoktavyam kincidvastukvacitprabhoh
    || 40|| anyathapatitobhutva'dhogatim labhate dhruvam | mahantapadavingatva yah shribhagavatodhanam
    || 41|| svasmai kutumbine rati duravyayam karoti ca | sa candalatvamapnoti janmakotishatam kila ||
    42|| dharmarthamilitam dravyam yo'dharmevyayate shathah | vaishnavarthancasampraptam vastutebhyonaraticet
    || 43|| sa gardabhatvamayati sahastram janmanishcayam | vaishnavartham kilasvalpam tatha bhagavate'pi
    ca || 44|| vastu dadatinaijarthammahanmahaccamandadhih | grihitva ramatenityam shukaratvam sa gacchati
    || 45|| ramabhakterasam sarvakalyanadam sabhyasamajasanmanadam sundaram | sampivedvaishnavo'sabhyatasucakam
    dhumapanam vidadhyannaduhkhavaham || 46|| bhavyam sampattimishasya dharmarthamilitam hareh | tatsevayantatha
    ca shrivaishnavasatkritau vyayet || 47|| tripundram bhasmanodadhyacchrivaishnavah kadapi vai | pancakeshajata
    shrimadbhadrarupatishobhitah || 48|| ramanandasumanite shrutinute shrisampradaye shubhe kashayo'sti
    patah sito'pi vihitobhavyah shikhasamyutah | shrilashritilakena bhushitatamo yajnopavitastutah samnyaso'sti
    varastridandasahitomanyashcaturthashramah || 49|| devabhasha satipathya viraktaih vaishnavaih samaih
    | tam vina nijadharmo'pi shashasha
  devanagari: त्वं स्त्रनादिकार्यमाचरेः ॥ १७॥ सन्ध्यां त्रैकालिकीं कुर्या स्ततो भगवतो जुषम् । श्रीभागवतशुश्रूषां
    न तद् भेददृशं क्वचित् ॥ १८॥ स्वस्मै याञ्चा न कर्तव्या भागवतार्थमेव च । एकाकी न कदापित्वं वसेऽस्तु
    वैष्णवैः समम् ॥ १९॥ विष्णुश्रीरामभक्ति श्रुतिगणविदितां कामधेनोः समानां शश्वत्सायुज्यमुक्तेः खलु सुवितरिणीन्धातृशर्वादिकाम्याम्
    । प्रल्हादेष्टाशुकर्त्रीं सुरनिकरनुतां शेमुषी सस्वरूपां कुर्यान्नित्यं मनुष्योगतजनिकुशलीनो कदाचिद्विमुञ्चेत्
    ॥ २०॥ वैष्णवानामपमानं कस्मिन्नंशेनकारयेत् । अपिसत्कारमेवाशुविपरीतोऽशिवंव्रजेत् ॥ २१॥ विरक्तो वैष्णवो
    भूत्वाविवाहं नहि कारयेत् । रेतः पातो न कर्तव्यस्तं कृत्वापतितोभवेत् ॥ २२॥ भूत्वामहान्तोयदियोविरक्तोमौर्थ्यात्स्वकङ्कामयतेविवाहम्
    । धर्मच्युतेस्तस्य वहिष्कृतिंसङ्कुर्युर्विरक्ताः स्तुतवैष्णवावै ॥ २३॥ समाजदूषकः साधुर्यः कश्चित्स्यत्सुधीरपि
    । स त्याज्यः सुविरक्तैश्च श्रीवैष्णवः सनातनैः ॥ २४॥ सङ्गतिर्यत्नतः कार्य्या परस्परं सुवैष्णवैः । स्थानम्प्राप्यस्वधर्मो
    न हेयोबुद्धिविशारदैः ॥ २५॥ भगवद्वैष्णवेभ्यश्च यश्छद्मकारकोजनः । अधः पतनमायाति सहस्त्रं जन्मनिश्चयम्
    ॥ २६॥ निखिलभुवनजन्मस्थैर्यसंहारकर्तुः भजनमननलब्धेर्वेदबुद्धेश्च विष्णोः । जनकुमुदसुधांशोर्ब्रह्मरामस्यमन्त्रः
    भवजलधिसुसेतोर्जीवमात्राय देयः ॥ २७॥ सच्चारित्रदयाशमादिनिलयः श्रीरामभक्तिप्रियः दम्भासत्यविवर्जितोमितवचाः
    कामादिशत्रुत्यजः । सौम्योविश्वजनीन आर्षमतगोवक्ता च सद्वर्त्मनः कृत्याकृत्यमतिः पुनातिभुवनं वा ईदृशोवैष्णवः
    ॥ २८॥ श्रीरामार्पितमन्नं यद्देवदुर्लभमस्तितत् । भुञ्जते भाग्यवन्तः श्रीतुलसीदलमिश्रितम् ॥ २९॥ श्रीरामकृष्णमूर्तिः
    सच्छालग्रामाकृतिस्तथा । पूज्याध्येयासदाभक्त्या श्रीवैष्णवैर्जगद्धितैः ॥ ३०॥ प्रतिष्ठा भगवन्मूर्तेः
    कार्या श्रीवैष्णवैर्बुधैः । तदन्यैः स्थापिता सा चेत्संस्कार्य्या वैष्णवैः पुनः ॥ ३१॥ अन्यथासाऽनमस्कार्य्यातथोपास्तिविवर्जिता
    । सा च भवति निस्तेजा भानूदये प्रदीपवत् ॥ ३२॥ सार्धहस्तत्रयं वस्त्रं सकौपीनं श्रुतीरितम् । तदेवधार्य्यमस्ति
    श्रीवैष्णवानां शुभावहम् ॥ ३३॥ धौतं कच्छयुतं नोहि धार्य्यं विरक्तवैष्णवैः । नोतर्हि विमलेधर्मे दोषोलगतिनैजके
    ॥ ३४॥ स्ववेषोलोभतो भीतेर्नहेयोवैष्णवैः समैः । मूर्खोभवति सत्याज्यस्तथासतिस्वधर्महा ॥ ३५॥ एकादशीव्रतङ्कार्यं
    श्रीरामनवमीव्रतम् । कृष्णाष्टमीव्रतं दिव्यं निजात्मशुद्धयैसदा ॥ ३६॥ अन्यमतं न निन्देद्धिस्वमतं मानयञ्
    छुभम् । प्राणिभिः सहबैरं नो प्रकुर्याद्वैष्णवोबुधः ॥ ३७॥ प्राप्ता अतिथयः सर्वे सत्कार्यायत्नतः सदा
    । यथाशक्तिनिजस्थानेवैष्णवास्तुविशेषतः ॥ ३८॥ उत्सवोनिखिलः कार्योभगवतश्चवार्षिकः । नव्यान्नं सुफलं नव्यं
    तन्नैवेद्यार्थमानयेत् ॥ ३९॥ यथासम्पत्तिसानन्दं कार्य्यातन्न्यूनतानहि । अनर्पितं न भोक्तव्यं किञ्चिद्वस्तुक्वचित्प्रभोः
    ॥ ४०॥ अन्यथापतितोभूत्वाऽधोगतिं लभते ध्रुवम् । महान्तपदविङ्गत्वा यः श्रीभगवतोधनम् ॥ ४१॥ स्वस्मै कुटुम्बिने
    राति दुरव्ययं करोति च । स चाण्डालत्वमाप्नोति जन्मकोटिशतं किल ॥ ४२॥ धर्मार्थमिलितं द्रव्यं योऽधर्मेव्ययते
    शठः । वैष्णवार्थञ्चसम्प्राप्तं वस्तुतेभ्योनरातिचेत् ॥ ४३॥ स गर्दभत्वमायाति सहस्त्रं जन्मनिश्चयम् ।
    वैष्णवार्थं किलस्वल्पं तथा भगवतेऽपि च ॥ ४४॥ वस्तु ददातिनैजार्थम्महन्महच्चमन्दधीः । गृहीत्वा रमतेनित्यं
    शूकरत्वं स गच्छति ॥ ४५॥ रामभक्तेरसं सर्वकल्याणदं सभ्यसामाजसन्मानदं सुन्दरम् । सम्पिवेद्वैष्णवोऽसभ्यतासूचकं
    धूमपानं विदध्यान्नदुःखावहम् ॥ ४६॥ भव्यां सम्पत्तिमीशस्य धर्मार्थमिलितां हरेः । तत्सेवायान्तथा च श्रीवैष्णवसत्कृतौ
    व्ययेत् ॥ ४७॥ त्रिपुण्ड्रं भस्मनोदध्याच्छ्रीवैष्णवः कदापि वै । पञ्चकेशजटा श्रीमद्भद्ररूपातिशोभितः
    ॥ ४८॥ रामानन्दसुमानिते श्रुतिनुते श्रीसम्प्रदाये शुभे काषायोऽस्ति पटः सितोऽपि विहितोभव्यः शिखासंयुतः
    । श्रीलश्रीतिलकेन भूषिततमो यज्ञोपवीतस्तुतः संन्यासोऽस्ति वरस्त्रिदण्डसहितोमान्यश्चतुर्थाश्रमः ॥ ४९॥
    देवभाषा सतीपाठ्या विरक्तैः वैष्णवैः समैः । तां विना निजधर्मोऽपि शशश
