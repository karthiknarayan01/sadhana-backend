    न्धाम॑ प्रि॒यमे॒वास्य॒ धामोपा ऽऽप्नोति॒ तावेहि॒ सग्ं र॑भावहा॒ इत्या॑ह॒ व्ये॑वैने॑न॒ परि॑ धत्ते॒ पाञ्च॑जन्ये॒ष्वप्ये
    द्ध्यग्न॒ इत्या॑है॒ष वा अ॒ग्निः पाञ्च॑जन्यो॒ यः पञ्च॑चितीक॒ स्तस्मा॑दे॒वमा॑हर्त॒व्या॑ उप॑ दधात्ये॒तद्वा
    ऋ॑तू॒ना न्धाम॒ यदृ॑त॒व्या॑ ऋतू॒नामे॒व प्रि॒य न्धामाव॑ रुन्धे सु॒मेक॒ इत्या॑ह सं वँथ्स॒रो वै सु॒मेकः॑
    सं वँथ्स॒रस्यै॒व प्रि॒य प्र॒जाप॑ते॒रक्ष्य॑श्वय॒ न्तद्दे॒वा अ॑श्वमे॒धेनै॒व प्रत्य॑दधुरे॒ष वै प्र॒जाप॑ति॒ग्ं॒
    सर्व॑ ऽश्वमे॒धेन॒ यज॑ते॒ सर्व॑ ए॒व भ॑वति॒ सर्व॑स्य॒ वा ए॒षा प्राय॑श्चित्ति॒ स्सर्व॑स्य भेष॒जग्ं सर्वं॒
    वाँ ए॒तेन॑ पा॒प्मान॑ न्दे॒वा अ॑तर॒न्नपि॒ वा ए॒तेन॑ ब्रह्मह॒त्या न्तरति॒ तर॑ति ब्रह्मह॒त्यां ऽश्वमे॒धेन॒
    यज॑ते॒ य उ॑ चैनमे॒वं त्प्र॒जाप॑ते॒रक्ष्य॑श्वय॒ त्तस्मा॒दश्व॑स्योत्तर॒तो ऽव॑ द्यन्ति दक्षिण॒तो वैँ॑त॒सः
    कटो॑ भवत्य॒फ्सुयो॑नि॒र्वा अश्वो योँनौ॒ प्रति॑ष्ठापयति चतुष्टो॒म स्स्तोमो॑ भवति स॒रड्ढ॒ वा अश्व॑स्य॒
    सक्थ्या द्दे॒वाश्च॑तुष्टो॒मेनै॒व प्रत्य॑दधु॒र्यच्च॑तुष्टो॒म स्स्तोमो॒ भव॒त्यश्व॑स्य सर्व॒त्वाय॑ ॥
    दे॒वा वा अ॑क्ष्णयास्तो॒मीया॑ र्देवासु॒राः कनी॑याग्ंसः ॥ हरिः॑ ओम् ॥ ॥ कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया
    म्पञ्चमकाण्डे तृतीयः प्रश्न
