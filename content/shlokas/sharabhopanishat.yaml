id: sharabhopanishat
category: upanishad
name:
  english: sharabhopanishat
  devanagari: शरभोपनिषत्
content:
  english: ridyo mahesho bhagavanadidevah || 19 || satyo nityah sarvasakshi mahesho nityanando nirvikalpo
    nirakhyah | acintyashaktirbhagavangirishah svavidyaya kalpitamanabhumih || 20 || atimohakari maya
    mama vishnoshca suvrata | tasya padambujadhyanaddustara sutara bhavet || 21 || vishnurvishvajagadyonih
    svamshabhutaih svakaih saha | mamamshasambhavo bhutva palayatyakhilam jagat || 22 || vinasham kalato
    yati tato'nyatsakalam mrisha | om tasmai mahagrasaya mahadevaya shuline | maheshvaraya mridaya tasmai
    rudraya namo astu || 23 || eko vishnurmahadbhutam prithagbhutayanekashah | trimllokanvyapya bhutatma
    bhunkte vishvabhugavyayah || 24 || caturbhishca caturbhishca dvabhyam pancamireva ca | huyate ca punardvabhyam
    sa me vishnuh prasidatu || 25 || brahmarpanam brahma havirbrahmagnau brahmana hutam | brahmaiva tena
    gantavyam brahmakarmasamadhina || 26 || shara jivastadangeshu bhati nityam harih svayam | brahmaiva
    sharabhah sakshanmokshado'yam mahamune || 27 || mayavashadeva deva mohita mamatadibhih | tasya mahatmyaleshamsham
    vaktum kenapya shakyate || 28 || paratparataram brahma yatparatparato harih | paratparataro hishastasmattulyo'dhiko
    na hi || 29 || eka eva shivo nityastato'nyatsakalam mrisha | tasmatsarvanparityajya dhyeyanvishnvadikansuran
    || 30 || shiva eva sada dhyeyah sarvasamsaramocakah | tasmai mahagrasaya maheshvaraya namah || 31
    || paippaladam mahashastram na deyam yasya kasyacit | nastikaya kritaghnaya durvrittaya duratmane
    || 32 || dambhikaya nrishamsaya shathayanritabhashine | suvrataya subhaktaya suvrittaya sushiline
    || 33 || gurubhaktaya dantaya shantaya rijucetase | shivabhaktaya datavyam brahmakarmoktadhimate ||
    34 || svabhaktayaiva datavyamakritaghnaya suvratam | na datavyam sada gopyam yatnenaiva dvijottama
    || 35 || etatpaippaladam mahashastram yo'dhite shravayeddvijah sa janmamaranebhyo mukto bhavati |
    yo janite so'mritatvam ca gacchati | garbhavasadvimukto bhavati | surapanatputo bhavati | svarnasteyatputo
    bhavati | brahmahatyatputo bhavati | gurutalpagamanatputo bhavati | sa sarvanvedanadhito bhavati |
    sa sarvandevandhyato bhavati | sa samastamahapatako
  devanagari: रीड्यो महेशो भगवानादिदेवः ॥ १९ ॥ सत्यो नित्यः सर्वसाक्षी महेशो नित्यानन्दो निर्विकल्पो निराख्यः
    । अचिन्त्यशक्तिर्भगवान्गिरीशः स्वाविद्यया कल्पितमानभूमिः ॥ २० ॥ अतिमोहकरी माया मम विष्णोश्च सुव्रत
    । तस्य पादाम्बुजध्यानाद्दुस्तरा सुतरा भवेत् ॥ २१ ॥ विष्णुर्विश्वजगद्योनिः स्वांशभूतैः स्वकैः सह ।
    ममांशसंभवो भूत्वा पालयत्यखिलं जगत् ॥ २२ ॥ विनाशं कालतो याति ततोऽन्यत्सकलं मृषा । ॐ तस्मै महाग्रासाय
    महादेवाय शूलिने । महेश्वराय मृडाय तस्मै रुद्राय नमो अस्तु ॥ २३ ॥ एको विष्णुर्महद्भूतं पृथग्भूतायनेकशः
    । त्रींल्लोकान्व्याप्य भूतात्मा भुङ्क्ते विश्वभुगव्ययः ॥ २४ ॥ चतुर्भिश्च चतुर्भिश्च द्वाभ्यां पञ्चमिरेव
    च । हूयते च पुनर्द्वाभ्यां स मे विष्णुः प्रसीदतु ॥ २५ ॥ ब्रह्मार्पणं ब्रह्म हविर्ब्रह्माग्नौ ब्रह्मणा
    हुतम् । ब्रह्मैव तेन गन्तव्यं ब्रह्मकर्मसमाधिना ॥ २६ ॥ शरा जीवास्तदङ्गेषु भाति नित्यं हरिः स्वयम्
    । ब्रह्मैव शरभः साक्षान्मोक्षदोऽयं महामुने ॥ २७ ॥ मायावशादेव देवा मोहिता ममतादिभिः । तस्य माहात्म्यलेशांशं
    वक्तुं केनाप्य शक्यते ॥ २८ ॥ परात्परतरं ब्रह्म यत्परात्परतो हरिः । परात्परतरो हीशस्तस्मात्तुल्योऽधिको
    न हि ॥ २९ ॥ एक एव शिवो नित्यस्ततोऽन्यत्सकलं मृषा । तस्मात्सर्वान्परित्यज्य ध्येयान्विष्ण्वादिकान्सुरान्
    ॥ ३० ॥ शिव एव सदा ध्येयः सर्वसंसारमोचकः । तस्मै महाग्रासाय महेश्वराय नमः ॥ ३१ ॥ पैप्पलादं महाशास्त्रं
    न देयं यस्य कस्यचित् । नास्तिकाय कृतघ्नाय दुर्वृत्ताय दुरात्मने ॥ ३२ ॥ दांभिकाय नृशंसाय शठायानृतभाषिणे
    । सुव्रताय सुभक्ताय सुवृत्ताय सुशीलिने ॥ ३३ ॥ गुरुभक्ताय दान्ताय शान्ताय ऋजुचेतसे । शिवभक्ताय दातव्यं
    ब्रह्मकर्मोक्तधीमते ॥ ३४ ॥ स्वभक्तायैव दातव्यमकृतघ्नाय सुव्रतम् । न दातव्यं सदा गोप्यं यत्नेनैव द्विजोत्तम
    ॥ ३५ ॥ एतत्पैप्पलादं महाशास्त्रं योऽधीते श्रावयेद्द्विजः स जन्ममरणेभ्यो मुक्तो भवति । यो जानीते सोऽमृतत्वं
    च गच्छति । गर्भवासाद्विमुक्तो भवति । सुरापानात्पूतो भवति । स्वर्णस्तेयात्पूतो भवति । ब्रह्महत्यात्पूतो
    भवति । गुरुतल्पगमनात्पूतो भवति । स सर्वान्वेदानधीतो भवति । स सर्वान्देवान्ध्यातो भवति । स समस्तमहापातको
