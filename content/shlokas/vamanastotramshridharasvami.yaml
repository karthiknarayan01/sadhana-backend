id: vamanastotramshridharasvami
category: stotram
name:
  english: vamanastotramshridharasvami
  devanagari: वामनस्तोत्रम्श्रीधरस्वामी
content:
  english: payovratasya mahatmyam darshitum yohyavatarat | vande tam saccidanandam vamanam vishnurupinam
    || 1|| aham bhaktavashosmyetaddarshitum yoditessutah | vande tam saccidanandam vamanam vishnurupinam
    || 2|| padbhyam vyaptam hi trailokyam mahatmya~ svam vyadarshayat | vande tam saccidanandam vamanam
    vishnurupinam || 3|| mahatve'pi mahanyadvadaniyan yo hyaniyasah | vande tam saccidanandam vamanam
    vishnurupinam || 4|| baliryasya kripapatrah kritvaivatmanivedanam | vande tam saccidanandam vamanam
    vishnurupinam || 5|| darshitam yena supritya shreshthamatmanivedanam | vande tam saccidanandam vamanam
    vishnurupinam || 6|| adyapi dvarapalo yo balerbhaktivashah prabhuh | vande tam saccidanandam vamanam
    vishnurupinam || 7|| nirgune nishkriyo yo hi sagunasya kriyo'pi san | vande tam saccidanandam vamanam
    vishnurupinam || 8|| || iti shrimat paramahamsaparivrajakacarya sadguru bhagavana shridharasvamimaharajaviracitam
    shrivamanastotram sampurnam ||
  devanagari: पयोव्रतस्य माहात्म्यं दर्शितुं योह्यवातरत् । वन्दे तं सच्चिदानन्दं वामनं विष्णुरूपिणम् ॥
    १॥ अहं भक्तवशोस्म्येतद्दर्शितुं योदितेस्सुतः । वन्दे तं सच्चिदानन्दं वामनं विष्णुरूपिणम् ॥ २॥ पद्भ्यां
    व्याप्तं हि त्रैलोक्यं माहात्म्यँ स्वं व्यदर्शयत् । वन्दे तं सच्चिदानन्दं वामनं विष्णुरूपिणम् ॥ ३॥
    महत्वेऽपि महान्यद्वदणीयान् यो ह्यणीयसः । वन्दे तं सच्चिदानन्दं वामनं विष्णुरूपिणम् ॥ ४॥ बलिर्यस्य
    कृपापात्रः कृत्वैवात्मनिवेदनम् । वन्दे तं सच्चिदानन्दं वामनं विष्णुरूपिणम् ॥ ५॥ दर्शितं येन सुप्रीत्या
    श्रेष्ठमात्मनिवेदनम् । वन्दे तं सच्चिदानन्दं वामनं विष्णुरूपिणम् ॥ ६॥ अद्यापि द्वारपालो यो बलेर्भक्तिवशः
    प्रभुः । वन्दे तं सच्चिदानन्दं वामनं विष्णुरूपिणम् ॥ ७॥ निर्गुणे निष्क्रियो यो हि सगुणस्य क्रियोऽपि
    सन् । वन्दे तं सच्चिदानन्दं वामनं विष्णुरूपिणम् ॥ ८॥ ॥ इति श्रीमत् परमहंसपरिव्राजकाचार्य सद्गुरू भगवान
    श्रीधरस्वामीमहाराजविरचितं श्रीवामनस्तोत्रं सम्पूर्णम् ॥
