id: prashnopanishad-question-3
category: stotram
name:
  english: Prashnopanishad - Question 3
content:
  english: tritiyah prashnah atha haina nkaushalyashcashvalayanah papraccha| bhagavan kuta esha prano
    jayate kathamayatyasminsharira atmanam mpratishthate kenotkramate katha mbahyamabhidhatte kathamadhyatmamiti
    || || tasmai sa hovacatiprashna npricchasi brahmishtho || atmana esha prano jayate yathaisha purushe
    chayaitasminnetadatata mmanokritenayatyasminsharire || || yatha samradevadhikritan viniyunkte| eta
    ngramanadhitishthasvetyevamevaisha prana itara nprithakprithageva sannidhatte || ncakshusshrotre mukhanasikabhya
    mpratishthate madhye tu samanah| esha hyetaddhutamannam sama ssaptarcisho bhavanti || || hridi hyesha
    atma| atraitadekashata ntasam shatam shatamekaikasya dvasaptatirdvasaptatih pratishakhanadisahasrani
    bhavantyasu vyanashcarati || || athaikayordhva udanah punyena punyam nnayati| papena papamubhabhyameva
    manushyalokam || || adityo ha vai bahyah prana udayatyesha hyena mpranamanugrihnanah| prithivyam ya~
    devata saisha purushasyapanamavashtabhyantara yadakasha ssa samano vayurvyanah || || tejo ha vava
    udanastasmadupashantatejah punarbhavamindriyairmanasi sampadyamanaih || || yaccittastenaisha pranamayati
    pranastejasa yuktah| sahatmana yathasankalpitam ve~da| na hasya praja hiyate || utpattimayatim sthanam
    ncaiva pancadha| adhyatma ncaiva pranasya vijnayamritamashnute vijnayamritamashnuta iti ||
  devanagari: तृतीयः प्रश्नः अथ हैन ङ्कौशल्यश्चाश्वलायनः पप्रच्छ। भगवन् कुत एष प्राणो जायते कथमायात्यस्मिञ्शरीर
    आत्मानं म्प्रतिष्ठते केनोत्क्रमते कथ म्बाह्यमभिधत्ते कथमध्यात्ममिति ॥ ॥ तस्मै स होवाचातिप्रश्ना न्पृच्छसि
    ब्रह्मिष्ठो ॥ आत्मन एष प्राणो जायते यथैषा पुरुषे छायैतस्मिन्नेतदातत म्मनोकृतेनायात्यस्मिञ्शरीरे ॥
    ॥ यथा सम्राडेवाधिकृतान् विनियुङ्क्ते। एता न्ग्रामानधितिष्ठस्वेत्येवमेवैष प्राण इतरा न्पृथक्पृथगेव
    सन्निधत्ते ॥ ञ्चक्षुस्श्रोत्रे मुखनासिकाभ्या म्प्रातिष्ठते मध्ये तु समानः। एष ह्येतद्धुतमन्नं सम स्सप्तार्चिषो
    भवन्ति ॥ ॥ हृदि ह्येष आत्मा। अत्रैतदेकशत न्तासां शतं शतमेकैकस्या द्वासप्ततिर्द्वासप्ततिः प्रतिशाखानाडीसहस्राणि
    भवन्त्यासु व्यानश्चरति ॥ ॥ अथैकयोर्ध्व उदानः पुण्येन पुण्यं न्नयति। पापेन पापमुभाभ्यामेव मनुष्यलोकम्
    ॥ ॥ आदित्यो ह वै बाह्यः प्राण उदयत्येष ह्येन म्प्राणमनुगृह्णानः। पृथिव्यां याँ देवता सैषा पुरुषस्यापानमवष्टभ्यान्तरा
    यदाकाश स्स समानो वायुर्व्यानः ॥ ॥ तेजो ह वाव उदानस्तस्मादुपशान्ततेजाः पुनर्भवमिन्द्रियैर्मनसि सम्पद्यमानैः
    ॥ ॥ यच्चित्तस्तेनैष प्राणमायाति प्राणस्तेजसा युक्तः। सहात्मना यथासङ्कल्पितं वेँद। न हास्य प्रजा हीयते
    ॥ उत्पत्तिमायतिं स्थानं ञ्चैव पञ्चधा। अध्यात्म ञ्चैव प्राणस्य विज्ञायामृतमश्नुते विज्ञायामृतमश्नुत
    इति ॥
