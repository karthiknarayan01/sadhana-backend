id: shivopanishad
category: upanishad
name:
  english: shivopanishad
  devanagari: शिवोपनिशद्
content:
  english: 37|| || iti shivopanishadi muktinirdeshadhyayah prathamah || atha purvasthito linge garbhah
    sa triguno bhavet | garbhadvapi vibhagena sthapya lingam shivalaye || 2
  devanagari: ३७॥ ॥ इति शिवोपनिषदि मुक्तिनिर्देशाध्यायः प्रथमः ॥ अथ पूर्वस्थितो लिङ्गे गर्भः स त्रिगुणो
    भवेत् । गर्भाद्वापि विभागेन स्थाप्य लिङ्गं शिवालये ॥ २
meaning: {}
