id: baladuhsvapnanashakakavacam-4
category: kavacha
name:
  english: baladuhsvapnanashakakavacam 4
  devanagari: बालादुःस्वप्ननाशककवचम् ४
content:
  english: shribala duhsvapnanashakakavacam 4 balarkamandalabhasam caturbahum trilocanam | pashankushavarabhitirdharayantim
    shivam bhaje || 1|| purvasyam bhairavi patu bala mam patu dakshine | malini pashcime patu vasini cottare'vatu
    || 2|| urdhvam patu mahadevi shribala tripureshvari | adhastat patu deveshi patalatalavasini || 3||
    adhare vagbhavah patu kamarajastatha hridi | mahavidya bhagavati patu mam parameshvari || 4|| aim
    lam lalate mam payat hraum hrim hamsashca netrayoh | nasikakarnayoh patu hrim hraim tu cibuke tatha
    || 5|| sauh patu me hridi gale hrim hrah nabhideshake | sauh klim shrim guhyadeshe tu aim hrim patu
    ca padayoh || 6|| hrim klim mam sarvatah patu sauh payat padasandhishu | jale sthale tatha koshe devarajagrihe
    tatha || 7|| kshem kshem mam tvarita patu mam cakri sauh manobhava | hamsauh payanmahadevi param nishkaladevata
    || 8|| vijaya mangala duti kalpa mam bhagamalini | jvalamalini nitya sarvada patu mam shiva || 9||
    itidam kavacam devi devanamapi durlabham | tava pritya samakhyatam gopaniyam prayatnatah || 10|| idam
    rahasyam paramam guhyadguhyataram priye | dhanyam prashasyamayushyam bhogamokshapradam shivam || 11||
    iti shribala duhsvapnanashakakavacam
  devanagari: श्रीबाला दुःस्वप्ननाशककवचम् ४ बालार्कमण्डलाभासां चतुर्बाहुं त्रिलोचनाम् । पाशाङ्कुशवराभीतीर्धारयन्तीं
    शिवां भजे ॥ १॥ पुर्वस्यां भैरवी पातु बाला मां पातु दक्षिणे । मालिनी पश्चिमे पातु वासिनी चोत्तरेऽवतु
    ॥ २॥ ऊर्ध्वं पातु महादेवी श्रीबाला त्रिपुरेश्वरी । अधस्तात् पातु देवेशी पातालतलवासिनी ॥ ३॥ आधारे वाग्भवः
    पातु कामराजस्तथा हृदि । महाविद्या भगवती पातु मां परमेश्वरी ॥ ४॥ ऐं लं ललाटे मां पायात् ह्रौं ह्रीं
    हंसश्च नेत्रयोः । नासिकाकर्णयोः पातु ह्रीं ह्रैं तु चिबुके तथा ॥ ५॥ सौः पातु मे हृदि गले ह्रीं ह्रः
    नाभिदेशके । सौः क्लीं श्रीं गुह्यदेशे तु ऐं ह्रीं पातु च पादयोः ॥ ६॥ ह्रीं क्लीं मां सर्वतः पातु सौः
    पायात् पदसन्धिषु । जले स्थले तथा कोशे देवराजगृहे तथा ॥ ७॥ क्षें क्षें मां त्वरिता पातु मां चक्री सौः
    मनोभवा । हंसौः पायान्महादेवी परं निष्कलदेवता ॥ ८॥ विजया मङ्गला दूती कल्पा मां भगमालिनी । ज्वालामालिनी
    नित्या सर्वदा पातु मां शिवा ॥ ९॥ इतीदं कवचं देवि देवानामपि दुर्लभम् । तव प्रीत्या समाख्यातं गोपनीयं
    प्रयत्नतः ॥ १०॥ इदं रहस्यं परमं गुह्याद्गुह्यतरं प्रिये । धन्यं प्रशस्यमायुष्यं भोगमोक्षप्रदं शिवम्
    ॥ ११॥ इति श्रीबाला दुःस्वप्ननाशककवचं
