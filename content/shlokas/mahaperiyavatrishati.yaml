id: mahaperiyavatrishati
category: stotram
name:
  english: mahaperiyavatrishati
  devanagari: महापेरियावात्रिशती
content:
  english: shricandrashekharendrasarasvatimahasvaminam trishatinamavalih vihayadrinatham vibhushtandramaulih
    vidhatum shubham bhaktavrindaya sakshat | yadakaralabhatkritartho babhuva bhaje tam gurum candracudendravanim
    || 1
  devanagari: श्रीचन्द्रशेखरेन्द्रसरस्वतीमहास्वामिनां त्रिशतीनामावलिः विहायाद्रिनाथं विभुष्टान्द्रमौलिः
    विधातुं शुभं भक्तवृन्दाय साक्षात् । यदाकारलाभात्कृतार्थो बभूव भजे तं गुरुं चन्द्रचूडेन्द्रवाणीम् ॥
    १
meaning: {}
