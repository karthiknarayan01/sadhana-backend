id: cakshu
category: upanishad
name:
  english: cakshu
  devanagari: चक्शु
content:
  english: cakshushopanishat netropanishat ca om athatashcakshushim pathitasiddhavidyam cakshurogaharam
    vyakhyasyamah | yaccakshurogah sarvato nashyanti | cakshushi diptirbhavishyatiti | tasyashcakshushividyaya
    ahirbudhnya rishih | gayatri chamdah | suryo devata | cakshuroganivrittaye jape viniyogah | om cakshushcakshushcakshushtejasthirobhava
    | mam pahi pahi | tvaritam cakshurogan shamaya shamaya | mama jatarupam tejo darshaya darshaya | yatha'hamandho
    na syam tatha kalpaya kalpaya | kalyanam kuru kuru | yani mama purvajanmoparjitani cakshuhpratirodhakadushkritani
    sarvani nirmulaya nirmulaya | om namashcakshustejodatre divyaya bhaskaraya | om namah karunakarayamritaya
    | om namah suryaya |
  devanagari: चाक्षुषोपनिषत् नेत्रोपनिषत् च ॐ अथातश्चाक्षुषीं पठितसिद्धविद्यां चक्षूरोगहरां व्याख्यास्यामः
    । यच्चक्षूरोगाः सर्वतो नश्यन्ति । चक्षुषी दीप्तिर्भविष्यतीति । तस्याश्चाक्षुषीविद्याया अहिर्बुध्न्य
    ऋषिः । गायत्री छंदः । सूर्यो देवता । चक्षूरोगनिवृत्तये जपे विनियोगः । ॐ चक्षुश्चक्षुश्चक्षुश्तेजस्थिरोभव
    । मां पाहि पाहि । त्वरितम् चक्षूरोगान् शमय शमय । मम जातरूपं तेजो दर्शय दर्शय । यथाऽहमन्धो न स्यां
    तथा कल्पय कल्पय । कल्याणं कुरु कुरु । यानि मम पूर्वजन्मोपार्जितानि चक्षुःप्रतिरोधकदुष्कृतानि सर्वाणि
    निर्मूलय निर्मूलय । ॐ नमश्चक्षुस्तेजोदात्रे दिव्याय भास्कराय । ॐ नमः करुणाकरायामृताय । ॐ नमः सूर्याय
    ।
