id: durgastotrambvp
category: kavacha
name:
  english: durgastotramBVP
  devanagari: दुर्गास्तोत्रम्BVP
content:
  english: durgastotram shriganeshaya namah | shridurgayai namah | narayana uvaca | pura stuta sa goloke
    krishnena paramatmana | sampujya madhumase ca samprite rasamandale || 1|| madhukaitabhayoryuddhe dvitiye
    vishnuna pura | tatraiva kale sa durga brahmana pranasankate || 2|| caturthe samstuta devi bhaktya
    ca tripurarina | pura tripurayuddhe ca mahaghoratare mune || 3|| pancame samstuta devi vritrasuravadhe
    tatha | shakrena sarvadevaishca ghore ca pranasankate || 4|| tada munindrairmanubhirmanavaih surathadibhih
    | samstuta pujita sa ca kalpe kalpe paratpara || 5|| stotranca shruyatam brahmansarvavighnavinashakam
    | sukhadam mokshadam saram bhavasantarakaranam || 6|| shrikrishna uvaca | tvameva sarvajanani mulaprakritirishvari
    | tvamevadya srishtividhau svecchaya trigunatmika || 7|| karyyarthe saguna tvanca vastuto nirguna
    svayam | parabrahmasvarupa tvam satya nitya sanatani || 8|| tejassvarupa parama bhaktanugravigraha
    | sarvasvarupa sarvesha sarvadhara paratpara || 9|| sarvabijasvarupa ca sarvapujya nirashraya | sarvajna
    sarvatobhadra sarvamangalamangala || 10|| sarvabuddhisvarupa ca sarvashaktisvarupini | sarvajnanaprada
    devi sarvajna sarvabhavini || 11|| tvam svaha devadane ca pitridane svadha svayam | dakshina sarvadane
    ca sarvashaktisvarupini || 12|| nidra tvam ca daya tvam ca trishna tvam catmanah priya | kshutkshantih
    shantirisha ca kantih srishtishca shashvati || 13|| shraddha pushtishca tandra ca lajja shobha daya
    tatha | satam sampatsvarupa shrirvipattirasatamiha || 14|| pritirupa punyavatam papinam kalahankura
    | shashvatkarmamayi shaktih sarvada sarvajivinam || 15|| devebhyah svapadodatri dhaturdhatri kripamayi
    | hitaya sarvadevanam sarvasuravinashini || 16|| yoginidra yogarupa yogadatri ca yoginam | siddhisvarupa
    siddhanam siddhida siddhayogini || 17|| brahmani maheshvari ca vishnumaya ca vaishnavi | bhadrada
    bhadrakali ca sarvalokabhayankari || 18|| grame grame gramadevi grihadevi grihe grihe | satam kirttih
    pratishtha ca ninda tvamasatam sada || 19|| mahayuddhe mahamari dushtasamhararupini | rakshasvarupa
    shishtanam mateva hitakarini || 20|| vandya pujya stuta tvam ca brahmadinam ca sarvada | brahmanyarupa
  devanagari: दुर्गास्तोत्रम् श्रीगणेशाय नमः । श्रीदुर्गायै नमः । नारायण उवाच । पुरा स्तुता सा गोलोके
    कृष्णेन परमात्मना । सम्पूज्य मधुमासे च संप्रीते रासमण्डले ॥ १॥ मधुकैटभयोर्युद्धे द्वितीये विष्णुना
    पुरा । तत्रैव काले सा दुर्गा ब्रह्मणा प्राणसङ्कटे ॥ २॥ चतुर्थे संस्तुता देवी भक्त्या च त्रिपुरारिणा
    । पुरा त्रिपुरयुद्धे च महाघोरतरे मुने ॥ ३॥ पञ्चमे संस्तुता देवी वृत्रासुरवधे तथा । शक्रेण सर्वदेवैश्च
    घोरे च प्राणसङ्कटे ॥ ४॥ तदा मुनीन्द्रैर्मनुभिर्मानवैः सुरथादिभिः । संस्तुता पूजिता सा च कल्पे कल्पे
    परात्परा ॥ ५॥ स्तोत्रञ्च श्रूयतां ब्रह्मन्सर्वविघ्नविनाशकम् । सुखदं मोक्षदं सारं भवसन्तारकारणम् ॥
    ६॥ श्रीकृष्ण उवाच । त्वमेव सर्वजननी मूलप्रकृतिरीश्वरी । त्वमेवाद्या सृष्टिविधौ स्वेच्छया त्रिगुणात्मिका
    ॥ ७॥ कार्य्यार्थे सगुणा त्वञ्च वस्तुतो निर्गुणा स्वयम् । परब्रह्मस्वरूपा त्वं सत्या नित्या सनातनी
    ॥ ८॥ तेजस्स्वरूपा परमा भक्तानुग्रविग्रहा । सर्वस्वरूपा सर्वेशा सर्वाधारा परात्परा ॥ ९॥ सर्वबीजस्वरूपा
    च सर्वपूज्या निराश्रया । सर्वज्ञा सर्वतोभद्रा सर्वमङ्गलमङ्गला ॥ १०॥ सर्वबुद्धिस्वरूपा च सर्वशक्तिस्वरूपिणी
    । सर्वज्ञानप्रदा देवी सर्वज्ञा सर्वभाविनी ॥ ११॥ त्वं स्वाहा देवदाने च पितृदाने स्वधा स्वयम् । दक्षिणा
    सर्वदाने च सर्वशक्तिस्वरूपिणी ॥ १२॥ निद्रा त्वं च दया त्वं च तृष्णा त्वं चात्मनः प्रिया । क्षुत्क्षान्तिः
    शान्तिरीशा च कान्तिः सृष्टिश्च शाश्वती ॥ १३॥ श्रद्धा पुष्टिश्च तन्द्रा च लज्जा शोभा दया तथा । सतां
    सम्पत्स्वरूपा श्रीर्विपत्तिरसतामिह ॥ १४॥ प्रीतिरूपा पुण्यवतां पापिनां कलहाङ्कुरा । शश्वत्कर्ममयी शक्तिः
    सर्वदा सर्वजीविनाम् ॥ १५॥ देवेभ्यः स्वपदोदात्री धातुर्धात्री कृपामयी । हिताय सर्वदेवानां सर्वासुरविनाशिनी
    ॥ १६॥ योगिनिद्रा योगरूपा योगदात्री च योगिनाम् । सिद्धिस्वरूपा सिद्धानां सिद्धिदा सिद्धयोगिनी ॥ १७॥
    ब्रह्माणी माहेश्वरी च विष्णुमाया च वैष्णवी । भद्रदा भद्रकाली च सर्वलोकभयङ्करी ॥ १८॥ ग्रामे ग्रामे
    ग्रामदेवी गृहदेवी गृहे गृहे । सतां कीर्त्तिः प्रतिष्ठा च निन्दा त्वमसतां सदा ॥ १९॥ महायुद्धे महामारी
    दुष्टसंहाररूपिणी । रक्षास्वरूपा शिष्टानां मातेव हितकारिणी ॥ २०॥ वन्द्या पूज्या स्तुता त्वं च ब्रह्मादीनां
    च सर्वदा । ब्राह्मण्यरूपा
