id: prajnavivardhana-stotra
category: stotram
name:
  english: prajnavivardhana stotra
  devanagari: प्रज्ञाविवर्धन स्तोत्र
content:
  english: pathet| pratyusham shraddhayayukto muko vacaspatirbhavet ||5|| mahamamtramayaniti mama namanukirtanam|
    mahaprajnamavapnoti natra karya vicarana ||6||
  devanagari: पठेत्। प्रत्यूषं श्रद्धयायुक्तो मूको वाचस्पतिर्भवेत् ।।५।। महामंत्रमयानीति मम नामानुकीर्तनम्।
    महाप्रज्ञामवाप्नोति नात्र कार्या विचारणा ।।६।।
meaning: {}
