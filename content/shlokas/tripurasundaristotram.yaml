id: tripurasundaristotram
category: stotram
name:
  english: tripurasundaristotram
  devanagari: त्रिपुरसुन्दरीस्तोत्रम्
content:
  english: shritripurasundaristotram shvetapadmasanarudham shuddhasphatikasannibham | vande vagdevatam
    dhyatva devim tripurasundarim || 1|| shailadhirajatanayam shankarapriyavallabham | tarunendunibham
    vande devim tripurasundarim || 2|| sarvabhutamanoramyam sarvabhuteshu samsthitam | sarvasampatkarim
    vande devim tripurasundarim || 3|| padmalayam padmahastam padmasambhavasevitam | padmaraganibham vande
    devi tripurasundarim || 4|| pancabanadhanurbanapashankushadharam shubham | pancabrahmamayim vande
    devim tripurasundarim || 5|| shatpundarikanilayam shadananasutamimam | shatkonantahsthitam vande devim
    tripurasundarim || 6|| harardhabhaganilayamambamadrisutam mridam | haripriyanujam vande devim tripurasundarim
    || 7|| ashtaishvaryapradamambamashtadikpalasevitam | ashtamurtimayim vande devim tripurasundarim ||
    8|| navamanikyamakutam navanathasupujitam | navayauvanashobhadhyam vande tripurasundarim || 9|| kancivasamanoramyam
    kancidamavibhushitam | kancipurishvarim vande devim tripurasundarim || 10|| iti shritripurasundaristotram
    sampurnam |
  devanagari: श्रीत्रिपुरसुन्दरीस्तोत्रम् श्वेतपद्मासनारूढां शुद्धस्फटिकसन्निभाम् । वन्दे वाग्देवतां ध्यात्वा
    देवीं त्रिपुरसुन्दरीम् ॥ १॥ शैलाधिराजतनयां शङ्करप्रियवल्लभाम् । तरुणेन्दुनिभां वन्दे देवीं त्रिपुरसुन्दरीम्
    ॥ २॥ सर्वभूतमनोरम्यां सर्वभूतेषु संस्थिताम् । सर्वसम्पत्करीं वन्दे देवीं त्रिपुरसुन्दरीम् ॥ ३॥ पद्मालयां
    पद्महस्तां पद्मसम्भवसेविताम् । पद्मरागनिभां वन्दे देवी त्रिपुरसुन्दरीम् ॥ ४॥ पञ्चबाणधनुर्बाणपाशाङ्कुशधरां
    शुभाम् । पञ्चब्रह्ममयीं वन्दे देवीं त्रिपुरसुन्दरीम् ॥ ५॥ षट्पुण्डरीकनिलयां षडाननसुतामिमाम् । षट्कोणान्तःस्थितां
    वन्दे देवीं त्रिपुरसुन्दरीम् ॥ ६॥ हरार्धभागनिलयामम्बामद्रिसुतां मृडाम् । हरिप्रियानुजां वन्दे देवीं
    त्रिपुरसुन्दरीम् ॥ ७॥ अष्टैश्वर्यप्रदामम्बामष्टदिक्पालसेविताम् । अष्टमूर्तिमयीं वन्दे देवीं त्रिपुरसुन्दरीम्
    ॥ ८॥ नवमाणिक्यमकुटां नवनाथसुपूजिताम् । नवयौवनशोभाढ्यां वन्दे त्रिपुरसुन्दरीम् ॥ ९॥ काञ्चीवासमनोरम्यां
    काञ्चीदामविभूषिताम् । काञ्चीपुरीश्वरीं वन्दे देवीं त्रिपुरसुन्दरीम् ॥ १०॥ इति श्रीत्रिपुरसुन्दरीस्तोत्रं
    सम्पूर्णम् ।
