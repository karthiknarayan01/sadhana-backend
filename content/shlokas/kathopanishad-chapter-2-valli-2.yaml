id: kathopanishad-chapter-2-valli-2
category: stotram
name:
  english: Kathopanishad - Chapter 2, Valli 2
content:
  english: puramekadashadvaramajasyavakracetasah| anushthaya na shocati vimuktashca vimucyate| etadvai
    tat || shshucishadvasurantarikshasaddhota vedishadatithirduronasat| nrishadvarasadritasadvyomasadabja
    goja ritaja adrija rita mpratyagasyati| madhye vamanamasinam vi~shve deva upasate || || asya visramsamanasya
    sharirasthasya dehinah| dehadvimucyamanasya kimatra parishishyate| etadvai tat || || na pranena napanena
    martyo jivati kashcana| itarena tu jivanti yasminnetavupashritau || mpravakshyami guhya mbrahma sanatanam|
    yatha ca marana mprapya atma bhavati gautama || || yonimanye prapadyante shariratvaya dehinah| sthanumanye
    ya~nti yathakarma yathashrutam || || ya esha supteshu jagarti kama mpurusho nirmimanah| tadeva shukra
    ntad brahma tadevamritamucyate| tasmim ssarve tadu natyeti kashcana| etadvai tat || mpravishto rupam
    rupa mpratirupo babhuva| ekastatha sarvabhutantaratma rupam rupa mpratirupo bahishca || mpravishto
    rupam rupa mpratirupo babhuva| ekastatha sarvabhutantaratma rupam rupa mpratirupo bahishca || || suryo
    yatha sarvalokasya cakshurna lipyate cakshushairbahyadoshaih| ekastatha sarvabhutantaratma na lipyate
    lokaduhkhena bahyah || || eko vashi sarvabhutantaratma ekam rupa mbahudha yah karoti| tamatmastham
    'nupashyanti dhirastesham sukham shashvata ncetanashcetananameko bahunam yo~ vidadhati kaman| tamatmastham
    'nupashyanti dhirastesham shanti shshashvati netaresham || nkimu bhati vibhati va || || na tatra suryo
    bhati na candrataraka nnema vidyuto bhanti kuto 'yamagnih| tameva bhantamanubhati sarva ntasya bhasa
    sarvamidam
  devanagari: पुरमेकादशद्वारमजस्यावक्रचेतसः। अनुष्ठाय न शोचति विमुक्तश्च विमुच्यते। एतद्वै तत् ॥ श्शुचिषद्वसुरन्तरिक्षसद्धोता
    वेदिषदतिथिर्दुरोणसत्। नृषद्वरसदृतसद्व्योमसदब्जा गोजा ऋतजा अद्रिजा ऋत म्प्रत्यगस्यति। मध्ये वामनमासीनं
    विँश्वे देवा उपासते ॥ ॥ अस्य विस्रंसमानस्य शरीरस्थस्य देहिनः। देहाद्विमुच्यमानस्य किमत्र परिशिष्यते।
    एतद्वै तत् ॥ ॥ न प्राणेन नापानेन मर्त्यो जीवति कश्चन। इतरेण तु जीवन्ति यस्मिन्नेतावुपाश्रितौ ॥ म्प्रवक्ष्यामि
    गुह्य म्ब्रह्म सनातनम्। यथा च मरण म्प्राप्य आत्मा भवति गौतम ॥ ॥ योनिमन्ये प्रपद्यन्ते शरीरत्वाय देहिनः।
    स्थाणुमन्ये यँन्ति यथाकर्म यथाश्रुतम् ॥ ॥ य एष सुप्तेषु जागर्ति काम म्पुरुषो निर्मिमाणः। तदेव शुक्र
    न्तद् ब्रह्म तदेवामृतमुच्यते। तस्मिं स्सर्वे तदु नात्येति कश्चन। एतद्वै तत् ॥ म्प्रविष्टो रूपं रूप
    म्प्रतिरूपो बभूव। एकस्तथा सर्वभूतान्तरात्मा रूपं रूप म्प्रतिरूपो बहिश्च ॥ म्प्रविष्टो रूपं रूप म्प्रतिरूपो
    बभूव। एकस्तथा सर्वभूतान्तरात्मा रूपं रूप म्प्रतिरूपो बहिश्च ॥ ॥ सूर्यो यथा सर्वलोकस्य चक्षुर्न लिप्यते
    चाक्षुषैर्बाह्यदोषैः। एकस्तथा सर्वभूतान्तरात्मा न लिप्यते लोकदुःखेन बाह्यः ॥ ॥ एको वशी सर्वभूतान्तरात्मा
    एकं रूप म्बहुधा यः करोति। तमात्मस्थं ऽनुपश्यन्ति धीरास्तेषां सुखं शाश्वत ञ्चेतनश्चेतनानामेको बहूनां
    योँ विदधाति कामान्। तमात्मस्थं ऽनुपश्यन्ति धीरास्तेषां शान्ति श्शाश्वती नेतरेषाम् ॥ ङ्किमु भाति विभाति
    वा ॥ ॥ न तत्र सूर्यो भाति न चन्द्रतारक न्नेमा विद्युतो भान्ति कुतो ऽयमग्निः। तमेव भान्तमनुभाति सर्व
    न्तस्य भासा सर्वमिदं
