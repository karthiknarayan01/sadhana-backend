id: bhishmrikritamshrikrishnastotram
category: stotram
name:
  english: bhishmrikritamshrikrishnastotram
  devanagari: भीष्मृकृतंश्रीकृष्णस्तोत्रम्
content:
  english: bhishmrikritam shrikrishnastotram shrutva tu vacanam bhishmo vasudevasya dhimatah | kincidunnamya
    vadanam pranjalirvakyamabravit || 1|| namaste bhagavanvishno lokanam nidhanodbhava | tvam hi karta
    hrishikesha samharta caparajitah || 2|| vishvakarmannamaste'stu vishvatmanvishvasambhava | apavargo'si
    bhutanam pancanam paratah sthitah || 3|| namaste trishu lokeshu namaste paratastrishu | yogeshvara
    namaste'stu tvam hi sarvaparayanam || 4|| matsamshritam yadattha tvam vacah purushasattama | tena
    pashyami te divyanbhavanhi trishu vartmasu || 5|| tacca pashyami tattvena yatte rupam sanatanam |
    sapta marga niruddhaste vayoramitatejasah || 6|| divam te shirasa vyaptam padbhyam devi vasundhara
    | disho bhujau ravishcakshurvirye shakrah pratishthitah || 7|| atasipushpasankasham pitavasasamacyutam
    | vapurhyanumimimaste meghasyeva savidyutah || 8|| tvatprapannaya bhaktaya gatimishtam jigishave |
    yacchreyah pundarikaksha taddhyayasva surottama || 9|| iti mahabharate shantiparvani 51 adhyayantargatam
    bhishmrikritam shrikrishnastotram sampurnam | mahabharata | shantiparva | adhyaya 51
  devanagari: भीष्मृकृतं श्रीकृष्णस्तोत्रम् श्रुत्वा तु वचनं भीष्मो वासुदेवस्य धीमतः । किञ्चिदुन्नाम्य
    वदनं प्राञ्जलिर्वाक्यमब्रवीत् ॥ १॥ नमस्ते भगवन्विष्णो लोकानां निधनोद्भव । त्वं हि कर्ता हृषीकेश संहर्ता
    चापराजितः ॥ २॥ विश्वकर्मन्नमस्तेऽस्तु विश्वात्मन्विश्वसम्भव । अपवर्गोऽसि भूतानां पञ्चानां परतः स्थितः
    ॥ ३॥ नमस्ते त्रिषु लोकेषु नमस्ते परतस्त्रिषु । योगेश्वर नमस्तेऽस्तु त्वं हि सर्वपरायणम् ॥ ४॥ मत्संश्रितं
    यदात्थ त्वं वचः पुरुषसत्तम । तेन पश्यामि ते दिव्यान्भावान्हि त्रिषु वर्त्मसु ॥ ५॥ तच्च पश्यामि तत्त्वेन
    यत्ते रूपं सनातनम् । सप्त मार्गा निरुद्धास्ते वायोरमिततेजसः ॥ ६॥ दिवं ते शिरसा व्याप्तं पद्भ्यां देवी
    वसुन्धरा । दिशो भुजौ रविश्चक्षुर्वीर्ये शक्रः प्रतिष्ठितः ॥ ७॥ अतसीपुष्पसङ्काशं पीतवाससमच्युतम् ।
    वपुर्ह्यनुमिमीमस्ते मेघस्येव सविद्युतः ॥ ८॥ त्वत्प्रपन्नाय भक्ताय गतिमिष्टां जिगीषवे । यच्छ्रेयः पुण्डरीकाक्ष
    तद्ध्यायस्व सुरोत्तम ॥ ९॥ इति महाभारते शान्तिपर्वणि ५१ अध्यायान्तर्गतं भीष्मृकृतं श्रीकृष्णस्तोत्रं
    सम्पूर्णम् । महाभारत । शान्तिपर्व । अध्याय ५१
