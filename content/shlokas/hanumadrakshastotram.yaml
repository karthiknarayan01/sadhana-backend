id: hanumadrakshastotram
category: raksha
name:
  english: hanumadrakshastotram
  devanagari: हनुमद्रक्षास्तोत्रम्
content:
  english: rinkhalaharatankam | dadanamacchacchasuvarnavarnam bhaje jvalatkundalamanjaneyam || 1|| padmaragamanikundalatvisha
    patalikritakapolamastakam | divyahemakadalivanantare bhavayami pavamananandanam || 2|| udyadadityasankashamudarabhujavikramam
    | kandarpakotilavanyam sarvavidyavisharadam || 3|| shriramahridayanandam bhaktakalpamahiruham | abhayam
    varadam dorbhyam kalaye marutatmajam || 4|| vamahaste mahakricchradashasyakaramardanam | udyadvikshanakodandam
    hanumantam vicintayet || 5|| sphatikabham svarnakantim dvibhujam ca kritanjalim | kundaladvayasamshobhimukhambhojam
    harim bhaje || 6|| iti shrihanumadrakshastotram sampurnam |
  devanagari: ृङ्खलहारटङ्कम् । ददानमच्छाच्छसुवर्णवर्णं भजे ज्वलत्कुण्डलमाञ्जनेयम् ॥ १॥ पद्मरागमणिकुण्डलत्विषा
    पाटलीकृतकपोलमस्तकम् । दिव्यहेमकदलीवनान्तरे भावयामि पवमाननन्दनम् ॥ २॥ उद्यदादित्यसङ्काशमुदारभुजविक्रमम्
    । कन्दर्पकोटिलावण्यं सर्वविद्याविशारदम् ॥ ३॥ श्रीरामहृदयानन्दं भक्तकल्पमहीरुहम् । अभयं वरदं दोर्भ्यां
    कलये मारुतात्मजम् ॥ ४॥ वामहस्ते महाकृच्छ्रदशास्यकरमर्दनम् । उद्यद्वीक्षणकोदण्डं हनूमन्तं विचिन्तयेत्
    ॥ ५॥ स्फटिकाभं स्वर्णकान्तिं द्विभुजं च कृताञ्जलिम् । कुण्डलद्वयसंशोभिमुखाम्भोजं हरिं भजे ॥ ६॥ इति
    श्रीहनुमद्रक्षास्तोत्रं सम्पूर्णम् ।
meaning: {}
