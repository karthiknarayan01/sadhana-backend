id: sri-mangala-gowri-ashtottara-sata-namavali
category: stotram
name:
  english: Sri Mangala Gowri Ashtottara Sata Namavali
content:
  english: om gauryai namah | om ganeshajananyai namah | om girirajatanudbhavayai namah | om guhambikayai
    namah | om jaganmatre namah | om gangadharakutumbinyai namah | om virabhadraprasuve namah | om vishvavyapinyai
    namah | om vishvarupinyai namah | om ashtamurtyatmikayai namah om kashtadaridyrashamanyai namah |
    om shivayai namah | om shambhavyai namah | om shankaryai namah | om balayai namah | om bhavanyai namah
    | om bhadradayinyai namah | om mangalyadayinyai namah | om sarvamangalayai namah | om manjubhashinyai
    namah om maheshvaryai namah | om mahamayayai namah | om mantraradhyayai namah | om mahabalayai namah
    | om hemadrijayai namah | om hemavatyai namah | om parvatyai namah | om papanashinyai namah | om narayanamshajayai
    namah | om nityayai namah om nirishayai namah | om nirmalayai namah | om ambikayai namah | om mridanyai
    namah | om munisamsevyayai namah | om maninyai namah | om menakatmajayai namah | om kumaryai namah
    | om kanyakayai namah | om durgayai namah om kalidoshanishudinyai namah | om katyayinyai namah | om
    kripapurnayai namah | om kalyanyai namah | om kamalarcitayai namah | om satyai namah | om sarvamayyai
    namah | om saubhagyadayai namah | om sarasvatyai namah | om amalayai namah om amarasamsevyayai namah
    | om annapurnayai namah | om amriteshvaryai namah | om akhilagamasamstutyayai namah | om sukhasaccitsudharasayai
    namah | om balyaradhitabhuteshayai namah | om bhanukotisamadyutaye namah | om hiranmayyai namah |
    om parayai namah | om sukshmayai namah om shitamshukritashekharayai namah | om haridrakunkumaradhyayai
    namah | om sarvakalasumangalyai namah | om sarvabhogapradayai namah | om samashikhayai namah | om
    vedantalakshanayai namah | om karmabrahmamayyai namah | om kamakalanayai namah | om kankshitarthadayai
    namah | om candrarkayitatatankayai namah om cidambarasharirinyai namah | om shricakravasinyai namah
    | om devyai namah | om kameshvarapatnyai namah | om kamalayai namah | om mararatipriyardhangyai namah
    | om markandeyavarapradayai namah | om putrapautravarapradayai namah | om punyayai namah | om purusharthapradayinyai
    namah om satyadharmaratayai namah | om sarvasakshinyai namah | om shashankarupinyai namah | om shyamalayai
    namah | om bagalayai namah | om candayai namah | om matrikayai namah | om bhagamalinyai namah | om
    shulinyai namah | om virajayai namah om svahayai namah | om svadhayai namah | om pratyangirambikayai
    namah | om aryayai namah | om dakshayinyai namah | om dikshayai namah | om sarvavastuttamottamayai
    namah | om shivabhidhanayai namah | om shrividyayai namah | om pranavarthasvarupinyai namah om hrinkaryai
    namah | om nadarupinyai namah | om tripurayai namah | om trigunayai namah | om ishvaryai namah | om
    sundaryai namah | om svarnagauryai namah | om shodashaksharadevatayai namah |
  devanagari: ॐ गौर्यै नमः । ॐ गणेशजनन्यै नमः । ॐ गिरिराजतनूद्भवायै नमः । ॐ गुहाम्बिकायै नमः । ॐ जगन्मात्रे
    नमः । ॐ गङ्गाधरकुटुम्बिन्यै नमः । ॐ वीरभद्रप्रसुवे नमः । ॐ विश्वव्यापिन्यै नमः । ॐ विश्वरूपिण्यै नमः
    । ॐ अष्टमूर्त्यात्मिकायै नमः ॐ कष्टदारिद्य्रशमन्यै नमः । ॐ शिवायै नमः । ॐ शाम्भव्यै नमः । ॐ शाङ्कर्यै
    नमः । ॐ बालायै नमः । ॐ भवान्यै नमः । ॐ भद्रदायिन्यै नमः । ॐ माङ्गल्यदायिन्यै नमः । ॐ सर्वमङ्गलायै
    नमः । ॐ मञ्जुभाषिण्यै नमः ॐ महेश्वर्यै नमः । ॐ महामायायै नमः । ॐ मन्त्राराध्यायै नमः । ॐ महाबलायै
    नमः । ॐ हेमाद्रिजायै नमः । ॐ हेमवत्यै नमः । ॐ पार्वत्यै नमः । ॐ पापनाशिन्यै नमः । ॐ नारायणांशजायै
    नमः । ॐ नित्यायै नमः ॐ निरीशायै नमः । ॐ निर्मलायै नमः । ॐ अम्बिकायै नमः । ॐ मृडान्यै नमः । ॐ मुनिसंसेव्यायै
    नमः । ॐ मानिन्यै नमः । ॐ मेनकात्मजायै नमः । ॐ कुमार्यै नमः । ॐ कन्यकायै नमः । ॐ दुर्गायै नमः ॐ कलिदोषनिषूदिन्यै
    नमः । ॐ कात्यायिन्यै नमः । ॐ कृपापूर्णायै नमः । ॐ कल्याण्यै नमः । ॐ कमलार्चितायै नमः । ॐ सत्यै नमः
    । ॐ सर्वमय्यै नमः । ॐ सौभाग्यदायै नमः । ॐ सरस्वत्यै नमः । ॐ अमलायै नमः ॐ अमरसंसेव्यायै नमः । ॐ अन्नपूर्णायै
    नमः । ॐ अमृतेश्वर्यै नमः । ॐ अखिलागमसंस्तुत्यायै नमः । ॐ सुखसच्चित्सुधारसायै नमः । ॐ बाल्याराधितभूतेशायै
    नमः । ॐ भानुकोटिसमद्युतये नमः । ॐ हिरण्मय्यै नमः । ॐ परायै नमः । ॐ सूक्ष्मायै नमः ॐ शीतांशुकृतशेखरायै
    नमः । ॐ हरिद्राकुङ्कुमाराध्यायै नमः । ॐ सर्वकालसुमङ्गल्यै नमः । ॐ सर्वभोगप्रदायै नमः । ॐ सामशिखायै
    नमः । ॐ वेदान्तलक्षणायै नमः । ॐ कर्मब्रह्ममय्यै नमः । ॐ कामकलनायै नमः । ॐ काङ्क्षितार्थदायै नमः ।
    ॐ चन्द्रार्कायितताटङ्कायै नमः ॐ चिदम्बरशरीरिण्यै नमः । ॐ श्रीचक्रवासिन्यै नमः । ॐ देव्यै नमः । ॐ कामेश्वरपत्न्यै
    नमः । ॐ कमलायै नमः । ॐ मारारातिप्रियार्धाङ्ग्यै नमः । ॐ मार्कण्डेयवरप्रदायै नमः । ॐ पुत्रपौत्रवरप्रदायै
    नमः । ॐ पुण्यायै नमः । ॐ पुरुषार्थप्रदायिन्यै नमः ॐ सत्यधर्मरतायै नमः । ॐ सर्वसाक्षिण्यै नमः । ॐ शशाङ्करूपिण्यै
    नमः । ॐ श्यामलायै नमः । ॐ बगलायै नमः । ॐ चण्डायै नमः । ॐ मातृकायै नमः । ॐ भगमालिन्यै नमः । ॐ शूलिन्यै
    नमः । ॐ विरजायै नमः ॐ स्वाहायै नमः । ॐ स्वधायै नमः । ॐ प्रत्यङ्गिराम्बिकायै नमः । ॐ आर्यायै नमः ।
    ॐ दाक्षायिण्यै नमः । ॐ दीक्षायै नमः । ॐ सर्ववस्तूत्तमोत्तमायै नमः । ॐ शिवाभिधानायै नमः । ॐ श्रीविद्यायै
    नमः । ॐ प्रणवार्थस्वरूपिण्यै नमः ॐ ह्रीङ्कार्यै नमः । ॐ नादरूपिण्यै नमः । ॐ त्रिपुरायै नमः । ॐ त्रिगुणायै
    नमः । ॐ ईश्वर्यै नमः । ॐ सुन्दर्यै नमः । ॐ स्वर्णगौर्यै नमः । ॐ षोडशाक्षरदेवतायै नमः ।
