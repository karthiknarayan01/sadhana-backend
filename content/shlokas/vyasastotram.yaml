id: vyasastotram
category: stotram
name:
  english: vyasastotram
  devanagari: व्यासस्तोत्रम्
content:
  english: vyasastotram tasmai bhagavate nityam namah satyaya dhimate | parasharyaya munaye vyasayamitatejase
    || 1|| krishnadvaipayanah sakshadvishnureva sanatanah | ko hyanyastattvato rudram vetti tam parameshvaram
    || 2|| namah kurudhvam tamrishim krishnam satyavatisutam | parasharyam mahatmanam yoginam vishnumavyayam
    || 3|| evamuktastu munayah sarva eva samihitah | prenemustam mahatmanam vyasam satyavatisutam || 4||
    iti kurmapurane purvabhage trimshadhyayantargatam vyasastotram samaptam | kurmapurane purvabhage 30
  devanagari: व्यासस्तोत्रम् तस्मै भगवते नित्यं नमः सत्याय धीमते । पाराशर्याय मुनये व्यासायामिततेजसे ॥
    १॥ कृष्णद्वैपायनः साक्षाद्विष्णुरेव सनातनः । को ह्यन्यस्तत्त्वतो रुद्रं वेत्ति तं परमेश्वरम् ॥ २॥
    नमः कुरुध्वं तमृषिं कृष्णं सत्यवतीसुतम् । पाराशर्यं महात्मानं योगिनं विष्णुमव्ययम् ॥ ३॥ एवमुक्तास्तु
    मुनयः सर्व एव समीहिताः । प्रेणेमुस्तं महात्मानं व्यासं सत्यवतीसुतम् ॥ ४॥ इति कूर्मपुराणे पूर्वभागे
    त्रिंशाध्यायान्तर्गतं व्यासस्तोत्रं समाप्तम् । कूर्मपुराणे पूर्वभागे ३०
