id: girijayaishivaproktamshrikrishnamantrastotram-2
category: mantra
name:
  english: girijayaishivaproktamshrikrishnamantrastotram
  devanagari: गिरिजायैशिवप्रोक्तंश्रीकृष्णमन्त्रस्तोत्रम्
content:
  english: girijayai shivaproktam shrikrishnamantrastotram shambhurvame girijayah karne mantram jajapa
    | parvati tam diyamanam mantram dadhyau hridi tvimam || 57|| om namo harikrishnaya patirupadharaya
    ca | bijaya garbharupaya'patyarupaya shambhave || 58|| sankalpagarbhahridyaya namah putrapradaya ca
    | vijetre'gra'rcyarupaya namo dehi suputrakam || 59|| sarvavijayinam dehi sarvagra'rcyam ca me sutam
    | punyakam te vratam krishna kriyate pritaye tava || 60|| nirvighnam saphalam tatsyat putratman sutado
    bhava | tvatsamam me sutam dehi ciranjivi namo namah || 61|| itimantram haradattam grihitva parvatim
    sati | jagama jahnavitiram shambhuna saha pavanam || 62|| iti shrilakshminarayaniyasamhitayam prathame
    kritayugasantane 94
  devanagari: गिरिजायै शिवप्रोक्तं श्रीकृष्णमन्त्रस्तोत्रम् शम्भुर्वामे गिरिजायाः कर्णे मन्त्रं जजाप ।
    पार्वती तं दीयमानं मन्त्रं दध्यौ हृदि त्विमम् ॥ ५७॥ ॐ नमो हरिकृष्णाय पतिरूपधराय च । बीजाय गर्भरूपायाऽपत्यरूपाय
    शम्भवे ॥ ५८॥ सङ्कल्पगर्भहृद्याय नमः पुत्रप्रदाय च । विजेत्रेऽग्राऽर्च्यरूपाय नमो देहि सुपुत्रकम् ॥
    ५९॥ सर्वविजयिनं देहि सर्वाग्राऽर्च्यं च मे सुतम् । पुण्यकं ते व्रतं कृष्ण क्रियते प्रीतये तव ॥ ६०॥
    निर्विघ्नं सफलं तत्स्यात् पुत्रात्मन् सुतदो भव । त्वत्समं मे सुतं देहि चिरञ्जीवी नमो नमः ॥ ६१॥ इतिमन्त्रं
    हरदत्तं गृहीत्वा पार्वतीं सती । जगाम जाह्नवीतीरं शम्भुना सह पावनम् ॥ ६२॥ इति श्रीलक्ष्मीनारायणीयसंहितायां
    प्रथमे कृतयुगसन्ताने ९४
