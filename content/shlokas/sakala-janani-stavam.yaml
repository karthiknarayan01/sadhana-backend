id: sakala-janani-stavam
category: stotram
name:
  english: Sakala Janani Stavam
content:
  english: ajananto yanti kshayamavashamanyonyakalahai rami mayagranthau tava pariluthantah samayinah
    | jaganmatarjanmajvarabhayatamah kaumudi vayam namaste kurvanah sharanamupayamo bhagavatim || || vacastarkagamyasvarasaparamanandavibhava
    prabodhakaraya dyutitulitanilotpalaruce | shivadyaradhyaya stanabharavinamraya satatam namastasmai
    kasmaicana bhavatu mugdhaya mahase || || anadyantabhedapranayarasikapi pranayini shivasyasiryattvam
    parinayavidhau devi grihini | savitri bhutanamapi yadudabhuh shailatanaya tadetatsamsarapranayanamahanatakamukham
    || || bruvantyeke tattvam bhagavati sadanye vidurasa tpare matah prahustava sadasadanye sukavayah
    | pare naitatsarvam samabhidadhate devi sudhiya stadetattvanmayavilasitamashesham nanu shive || ||
    luthadgunjaharastanabharanamanmadhyalatika mudancaddharmambhah kanagunitavaktrambujarucam | shivam
    parthatranapravanamrigayakaragunitam shivamanvagyantim sharanamahamanvemi shabarim || || mithah keshakeshiprathananidhanastarkaghatanah
    bahushraddhabhaktipranativishayah shastravidhayah | prasida pratyakshibhava girisute dehi sharanam
    niralambam cetah pariluthati pariplavamidam || || shunam va vahnerva khagaparishado va yadashanam
    kada kena kveti kvacidapi na kashcitkalayati | amushminvishvasam vijahihi mamahnaya vapushi prapadyethashcetah
    sakalajananimeva sharanam || || tatitkotijyotirdyutidalitashadgranthigahanam pravishtam svadharam
    punarapi sudhavrishtivapusha | kimapyashtavimshatkiranasakalibhutamanisham bhaje dhama shyamam kucabharanatam
    barbarakacam || || catushpatrantah shaddalaputabhagantastrivalaya sphuradvidyudvahnidyumaniniyutabhadyutilate
    | shadashram bhittvadau dashadalamatha dvadashadalam kalashram ca dvyashram gatavati namaste girisute
    || || kulam kecitprahurvapurakulamanye tava budhah pare tatsambhedam samabhidadhate kaulamapare |
    caturnamapyeshamupari kimapi prahurapare mahamaye tattvam tava kathamami nishcinumahe || || shadadhvaranyanim
    pralayaravikotipratiruca ruca bhasmikritya svapadakamalaprahvashirasam | vitanvanah shaivam kimapi
    vapurindivararucih kucabhyamanamrastava purushakaro vijayate || || prakashanandabhyamaviditacarim
    madhyapadavim pravishyaitaddvandvam ravishashisamakhyam kabalayan | prapadyordhvam nadam layadahanabhasmikritakulah
    prasadatte jantuh shivamakulamamba pravishati || || manushyastiryanco maruta iti lokatrayamidam bhavambhodhau
    magnam trigunalaharikotiluthitam | katakshashcedyatra kvacana tava matah karunaya shariri sadyo'yam
    vrajati paramanandatanutam || || priyangushyamangimarunataravasam kisalayam samunmilanmuktaphalavahalanepathyasubhagam
    | stanadvandvaspharastabakanamitam kalpalatikam sakriddhyayantastvam dadhati shivacintamanipadam ||
    || shadadharavartairaparimitamantrormipatalaih lasanmudraphenairbahuvidhalasaddaivatajhashaih | kramasrotobhistvam
    vahasi paranadamritanadi bhavani pratyagra shivacidamritabdhipranayini || || mahipathovahnishvasanaviyadatmenduravibhi
    rvapurbhigrastashairapi tava kiyanamba mahima | amunyalokyante bhagavati na kutrapyanutama mavastham
    praptani tvayi tu paramavyomavapushi || || kalamajnam prajnam samayamanubhutim samarasam gurum paramparyam
    vinayamupadesham shivapadam | pramanam nirvanam prakritimabhibhutim paraguham vidhim vidyamahuh sakalajananimeva
    munayah || || praline shabdaughe tadanu virate binduvibhave tatastattve cashtadhvanibhiranapayinyadhigate
    | shrite shakte parvanyanukalitacinmatra gahanam svasamvittim yogi rasayati shivakhyam bhagavatim
    || || paranandakaram niravadhishivaishvaryavapusham nirakaram jnanaprakritimaparicchinnakarunam |
    savitrim lokanam niratishayadhamaspadapadam bhavo va moksho va bhavatu bhavatimeva bhajatam || ||
    jagatkaye kritva tadapi hridaye tacca purushe pumamsam bindustham tadapi viyadakhye ca gahane | tadetadjnanakhye
    tadapi paramanandagahane mahavyomakare tvadanubhavashilo vijayate || || vidhe vedye vidye vividhasamaye
    vedagulike vicitre vishvadye vinayasulabhe vedajanani | shivajne shulasthe shivapadavadanye shivanidhe
    shive matarmahyam tvayi vitara bhaktim nirupamam || || vidhermundam hritva yadakuruta patram karatale
    harim shulaprotam yadagamayadamsabharanatam | alancakre kantham yadapi garalenamba girishah shivasthayah
    shaktestadidamakhilam te vilasitam || || virincyakhya matah srijasi harisanjna tvamavasi trilokim
    rudrakhya harasi vidadhasishvaradasham | bhavanti nadakhya viharasi ca pashaughadalani tvamevaika'neka
    bhavasi kritibhedairgirisute || || muninam cetobhih pramriditakashayairapi mana gashakyam samsprashtum
    cakitacakitairamba satatam | shrutinam murdhanah prakritikathinah komalatare katham te vindante padakisalaye
    parvati padam || || tatidvallim nityamamritasaritam pararahitam malottirnam jyotsnam prakritimagunagranthigahanam
    | giram duram vidyamavinatakucam vishvajanani maparyantam lakshmimabhidadhati santo bhagavatim ||
    || shariram kshityambhah prabhritiracitam kevalamacit sukham duhkham cayam kalayati pumamshcetana
    iti | sphutam janano'pi prabhavati na dehi rahayitum sharirahankaram tava samayabahyo girisute ||
    || pita mata bhrata suhridanucarah sadma grihini vapuh kshetram mitram dhanamapi yada mam vijahati
    | tada me bhindana sapadi bhayamohandhatamasam mahajyotsne matarbhava karunaya sannidhikari || ||
    suta dakshasyadau kila sakalamatastvamudabhuh sadosham tam hitva tadanu girirajasya duhita | anadyanta
    shambhoraprithagapi shaktirbhagavati vivahajjayasityahaha caritam vetti tava kah || || kanastvaddiptinam
    ravishashikrishanuprabhritayah param brahma kshudram tava niyatamanandakanika | shivadi kshityantam
    trivalayatanoh sarvamudare tavaste bhaktasya sphurasi hridi citram bhagavati || || purah pashcadantarbahiraparimeyam
    parimitam param sthulam sukshmam sakalamakulam guhyamaguham | daviyo nediyah sadasaditi vishvam bhagavati
    sada pashyantyakhyam vahasi bhuvanakshobhajananim || || pravishya tvanmargam sahajadayaya deshikadrisha
    shadadhvadhvantaughacchiduragananatitakarunam | paramajnakaram sapadi shivayantim shivatanum svamatmanam
    dhanyashciramupalabhante bhagavatim || || mayukhah pushniva jvalana iva taddiptikanikah payodhau kallolah
    pratihatamahimniva prishatah | udetyodetyamba tvayi saha nijaih sattvikagunai rbhajante tattvaughah
    prashamamanukalpam paravashah || || vidhurvishnurbrahma prakritiranuratma dinakarah svabhavo jainendrah
    sugatamunirakashamalinah | shivah shaktishceti shrutivishayatam tamupagatam vikalpairebhistvamabhidadhati
    santo bhagavatim || || shivastvam shaktistvam tvamasi samaya tvam samayini tvamatma tvam diksha tvamayamanimadirgunaganah
    | avidya tvam vidya tvamasi nikhilam tvam kimaparam prithaktattvam tvatto bhagavati na vikshamaha
    ime || || tvayasau janite racayati bhavatyaiva satatam tvayaivecchatyamba tvamasi nikhila yasya tanavah
    | jagatsamyam shambhorvahasi paramavyomavapushah tathapyardham bhutva viharasi shivasyeti kimidam
    || || asankhyaih pracinairjanani jananaih karmavilaya tsakrijjanmanyante guruvapushamasadya girisham
    | avapyajnam shaivim shivatanumapi tvam viditava nnayeyam tvatpujastutiviracanenaiva divasan || ||
    yatshatpatram kamalamuditam tasya ya karnikakhya yonistasyah prathitamudare yattadonkarapitham | tasyapyantah
    kucabharanatam kundaliti prasiddham shyamakaram sakalajananim santatam bhavayami || || bhuvi payasi
    krishanau marute khe shashanke savitari yajamane'pyashtadha shaktireka | vahasi kucabharabhyam yavanamrapi
    vishvam sakalajanani sa tvam pahi mamityavacyam || || iti shrikalidasa viracita pancastavyam pancamah
    sakalajananistavah |
  devanagari: अजानन्तो यान्ति क्षयमवशमन्योन्यकलहै रमी मायाग्रन्थौ तव परिलुठन्तः समयिनः । जगन्मातर्जन्मज्वरभयतमः
    कौमुदि वयं नमस्ते कुर्वाणाः शरणमुपयामो भगवतीम् ॥ ॥ वचस्तर्कागम्यस्वरसपरमानन्दविभव प्रबोधाकाराय द्युतितुलितनीलोत्पलरुचे
    । शिवाद्याराध्याय स्तनभरविनम्राय सततं नमस्तस्मै कस्मैचन भवतु मुग्धाय महसे ॥ ॥ अनाद्यन्ताभेदप्रणयरसिकापि
    प्रणयिनी शिवस्यासीर्यत्त्वं परिणयविधौ देवि गृहिणी । सवित्री भूतानामपि यदुदभूः शैलतनया तदेतत्संसारप्रणयनमहानाटकमुखम्
    ॥ ॥ ब्रुवन्त्येके तत्त्वं भगवति सदन्ये विदुरस त्परे मातः प्राहुस्तव सदसदन्ये सुकवयः । परे नैतत्सर्वं
    समभिदधते देवि सुधिय स्तदेतत्त्वन्मायाविलसितमशेषं ननु शिवे ॥ ॥ लुठद्गुञ्जाहारस्तनभरनमन्मध्यलतिका मुदञ्चद्धर्माम्भः
    कणगुणितवक्त्राम्बुजरुचम् । शिवं पार्थत्राणप्रवणमृगयाकारगुणितं शिवामन्वग्यान्तीं शरणमहमन्वेमि शबरीम्
    ॥ ॥ मिथः केशाकेशिप्रथननिधनास्तर्कघटनाः बहुश्रद्धाभक्तिप्रणतिविषयाः शास्त्रविधयः । प्रसीद प्रत्यक्षीभव
    गिरिसुते देहि शरणं निरालम्बं चेतः परिलुठति पारिप्लवमिदम् ॥ ॥ शुनां वा वह्नेर्वा खगपरिषदो वा यदशनं
    कदा केन क्वेति क्वचिदपि न कश्चित्कलयति । अमुष्मिन्विश्वासं विजहिहि ममाह्नाय वपुषि प्रपद्येथाश्चेतः
    सकलजननीमेव शरणम् ॥ ॥ तटित्कोटिज्योतिर्द्युतिदलितषड्ग्रन्थिगहनं प्रविष्टं स्वाधारं पुनरपि सुधावृष्टिवपुषा
    । किमप्यष्टाविंशत्किरणसकलीभूतमनिशं भजे धाम श्यामं कुचभरनतं बर्बरकचम् ॥ ॥ चतुष्पत्रान्तः षड्दलपुटभगान्तस्त्रिवलय
    स्फुरद्विद्युद्वह्निद्युमणिनियुताभद्युतिलते । षडश्रं भित्त्वादौ दशदलमथ द्वादशदलं कलाश्रं च द्व्यश्रं
    गतवति नमस्ते गिरिसुते ॥ ॥ कुलं केचित्प्राहुर्वपुरकुलमन्ये तव बुधाः परे तत्सम्भेदं समभिदधते कौलमपरे
    । चतुर्णामप्येषामुपरि किमपि प्राहुरपरे महामाये तत्त्वं तव कथममी निश्चिनुमहे ॥ ॥ षडध्वारण्यानीं प्रलयरविकोटिप्रतिरुचा
    रुचा भस्मीकृत्य स्वपदकमलप्रह्वशिरसाम् । वितन्वानः शैवं किमपि वपुरिन्दीवररुचिः कुचाभ्यामानम्रस्तव पुरुषकारो
    विजयते ॥ ॥ प्रकाशानन्दाभ्यामविदितचरीं मध्यपदवीं प्रविश्यैतद्द्वन्द्वं रविशशिसमाख्यं कबलयन् । प्रपद्योर्ध्वं
    नादं लयदहनभस्मीकृतकुलः प्रसादात्ते जन्तुः शिवमकुलमम्ब प्रविशति ॥ ॥ मनुष्यास्तिर्यञ्चो मरुत इति लोकत्रयमिदं
    भवाम्भोधौ मग्नं त्रिगुणलहरीकोटिलुठितम् । कटाक्षश्चेद्यत्र क्वचन तव मातः करुणया शरीरी सद्योऽयं व्रजति
    परमानन्दतनुताम् ॥ ॥ प्रियङ्गुश्यामाङ्गीमरुणतरवासं किसलयां समुन्मीलन्मुक्ताफलवहलनेपथ्यसुभगाम् । स्तनद्वन्द्वस्फारस्तबकनमितां
    कल्पलतिकां सकृद्ध्यायन्तस्त्वां दधति शिवचिन्तामणिपदम् ॥ ॥ षडाधारावर्तैरपरिमितमन्त्रोर्मिपटलैः लसन्मुद्राफेनैर्बहुविधलसद्दैवतझषैः
    । क्रमस्रोतोभिस्त्वं वहसि परनादामृतनदी भवानि प्रत्यग्रा शिवचिदमृताब्धिप्रणयिनी ॥ ॥ महीपाथोवह्निश्वसनवियदात्मेन्दुरविभि
    र्वपुर्भिग्रस्ताशैरपि तव कियानम्ब महिमा । अमून्यालोक्यन्ते भगवति न कुत्राप्यणुतमा मवस्थां प्राप्तानि
    त्वयि तु परमव्योमवपुषि ॥ ॥ कलामाज्ञां प्रज्ञां समयमनुभूतिं समरसं गुरुं पारम्पर्यं विनयमुपदेशं शिवपदम्
    । प्रमाणं निर्वाणं प्रकृतिमभिभूतिं परगुहां विधिं विद्यामाहुः सकलजननीमेव मुनयः ॥ ॥ प्रलीने शब्दौघे
    तदनु विरते बिन्दुविभवे ततस्तत्त्वे चाष्टध्वनिभिरनपायिन्यधिगते । श्रिते शाक्ते पर्वण्यनुकलितचिन्मात्र
    गहनां स्वसंवित्तिं योगी रसयति शिवाख्यां भगवतीम् ॥ ॥ परानन्दाकारां निरवधिशिवैश्वर्यवपुषं निराकारां
    ज्ञानप्रकृतिमपरिच्छिन्नकरुणाम् । सवित्रीं लोकानां निरतिशयधामास्पदपदां भवो वा मोक्षो वा भवतु भवतीमेव
    भजताम् ॥ ॥ जगत्काये कृत्वा तदपि हृदये तच्च पुरुषे पुमांसं बिन्दुस्थं तदपि वियदाख्ये च गहने । तदेतद्ज्ञानाख्ये
    तदपि परमानन्दगहने महाव्योमाकारे त्वदनुभवशीलो विजयते ॥ ॥ विधे वेद्ये विद्ये विविधसमये वेदगुलिके विचित्रे
    विश्वाद्ये विनयसुलभे वेदजननि । शिवज्ञे शूलस्थे शिवपदवदान्ये शिवनिधे शिवे मातर्मह्यं त्वयि वितर भक्तिं
    निरुपमाम् ॥ ॥ विधेर्मुण्डं हृत्वा यदकुरुत पात्रं करतले हरिं शूलप्रोतं यदगमयदंसाभरणताम् । अलञ्चक्रे
    कण्ठं यदपि गरलेनाम्ब गिरिशः शिवस्थायाः शक्तेस्तदिदमखिलं ते विलसितम् ॥ ॥ विरिञ्च्याख्या मातः सृजसि
    हरिसञ्ज्ञा त्वमवसि त्रिलोकीं रुद्राख्या हरसि विदधासीश्वरदशाम् । भवन्ती नादाख्या विहरसि च पाशौघदलनी
    त्वमेवैकाऽनेका भवसि कृतिभेदैर्गिरिसुते ॥ ॥ मुनीनां चेतोभिः प्रमृदितकषायैरपि मना गशक्यं संस्प्रष्टुं
    चकितचकितैरम्ब सततम् । श्रुतीनां मूर्धानः प्रकृतिकठिनाः कोमलतरे कथं ते विन्दन्ते पदकिसलये पार्वति पदम्
    ॥ ॥ तटिद्वल्लीं नित्याममृतसरितं पाररहितां मलोत्तीर्णां ज्योत्स्नां प्रकृतिमगुणग्रन्थिगहनाम् । गिरां
    दूरां विद्यामविनतकुचां विश्वजननी मपर्यन्तां लक्ष्मीमभिदधति सन्तो भगवतीम् ॥ ॥ शरीरं क्षित्यम्भः प्रभृतिरचितं
    केवलमचित् सुखं दुःखं चायं कलयति पुमांश्चेतन इति । स्फुटं जानानोऽपि प्रभवति न देही रहयितुं शरीराहङ्कारं
    तव समयबाह्यो गिरिसुते ॥ ॥ पिता माता भ्राता सुहृदनुचरः सद्म गृहिणी वपुः क्षेत्रं मित्रं धनमपि यदा मां
    विजहति । तदा मे भिन्दाना सपदि भयमोहान्धतमसं महाज्योत्स्ने मातर्भव करुणया सन्निधिकरी ॥ ॥ सुता दक्षस्यादौ
    किल सकलमातस्त्वमुदभूः सदोषं तं हित्वा तदनु गिरिराजस्य दुहिता । अनाद्यन्ता शम्भोरपृथगपि शक्तिर्भगवती
    विवाहाज्जायासीत्यहह चरितं वेत्ति तव कः ॥ ॥ कणास्त्वद्दीप्तीनां रविशशिकृशानुप्रभृतयः परं ब्रह्म क्षुद्रं
    तव नियतमानन्दकणिका । शिवादि क्षित्यन्तं त्रिवलयतनोः सर्वमुदरे तवास्ते भक्तस्य स्फुरसि हृदि चित्रं
    भगवति ॥ ॥ पुरः पश्चादन्तर्बहिरपरिमेयं परिमितं परं स्थूलं सूक्ष्मं सकलमकुलं गुह्यमगुहम् । दवीयो नेदीयः
    सदसदिति विश्वं भगवती सदा पश्यन्त्याख्यां वहसि भुवनक्षोभजननीम् ॥ ॥ प्रविश्य त्वन्मार्गं सहजदयया देशिकदृशा
    षडध्वध्वान्तौघच्छिदुरगणनातीतकरुणाम् । परामाज्ञाकारां सपदि शिवयन्तीं शिवतनुं स्वमात्मानं धन्याश्चिरमुपलभन्ते
    भगवतीम् ॥ ॥ मयूखाः पूष्णीव ज्वलन इव तद्दीप्तिकणिकाः पयोधौ कल्लोलाः प्रतिहतमहिम्नीव पृषतः । उदेत्योदेत्याम्ब
    त्वयि सह निजैः सात्त्विकगुणै र्भजन्ते तत्त्वौघाः प्रशममनुकल्पं परवशाः ॥ ॥ विधुर्विष्णुर्ब्रह्मा प्रकृतिरणुरात्मा
    दिनकरः स्वभावो जैनेन्द्रः सुगतमुनिराकाशमलिनः । शिवः शक्तिश्चेति श्रुतिविषयतां तामुपगतां विकल्पैरेभिस्त्वामभिदधति
    सन्तो भगवतीम् ॥ ॥ शिवस्त्वं शक्तिस्त्वं त्वमसि समया त्वं समयिनी त्वमात्मा त्वं दीक्षा त्वमयमणिमादिर्गुणगणः
    । अविद्या त्वं विद्या त्वमसि निखिलं त्वं किमपरं पृथक्तत्त्वं त्वत्तो भगवति न वीक्षामह इमे ॥ ॥ त्वयासौ
    जानीते रचयति भवत्यैव सततं त्वयैवेच्छत्यम्ब त्वमसि निखिला यस्य तनवः । जगत्साम्यं शम्भोर्वहसि परमव्योमवपुषः
    तथाप्यर्धं भूत्वा विहरसि शिवस्येति किमिदम् ॥ ॥ असङ्ख्यैः प्राचीनैर्जननि जननैः कर्मविलया त्सकृज्जन्मन्यन्ते
    गुरुवपुषमासाद्य गिरिशम् । अवाप्याज्ञां शैवीं शिवतनुमपि त्वां विदितवा न्नयेयं त्वत्पूजास्तुतिविरचनेनैव
    दिवसान् ॥ ॥ यत्षट्पत्रं कमलमुदितं तस्य या कर्णिकाख्या योनिस्तस्याः प्रथितमुदरे यत्तदोङ्कारपीठम् ।
    तस्याप्यन्तः कुचभरनतां कुण्डलीति प्रसिद्धां श्यामाकारां सकलजननीं सन्ततं भावयामि ॥ ॥ भुवि पयसि कृशानौ
    मारुते खे शशाङ्के सवितरि यजमानेऽप्यष्टधा शक्तिरेका । वहसि कुचभराभ्यां यावनम्रापि विश्वं सकलजननि सा
    त्वं पाहि मामित्यवाच्यम् ॥ ॥ इति श्रीकालिदास विरचित पञ्चस्तव्यां पञ्चमः सकलजननीस्तवः ।
