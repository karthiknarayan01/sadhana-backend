id: atmabodhopanishat
category: upanishad
name:
  english: atmabodhopanishat
  devanagari: आत्मबोधोपनिषत्
content:
  english: sakalabhuvanahridyo'ham | paramanandaghano'ham paramanandaikabhumarupo'ham || 8|| shuddho'hamadvayo'ham
    santatabhavo'hamadishunyo'ham | shamitantatritayo'ham baddho mukto'hamadbhutatmaham || 9|| shuddho'hamantaro'ham
    shashvatavijnanasamarasatmaham | shodhitaparatattvo'ham bodhanandaikamurtirevaham || 10|| vivekayuktibuddhyaham
    janamyatmanamadvayam | tathapi bandhamokshadivyavaharah pratiyate || 11|| nivritto'pi prapanco me
    satyavadbhati sarvada | sarpadau rajjusatteva brahmasattaiva kevalam || 12|| prapancadhararupena vartate'to
    jaganna hi | yathekshurasasamvyapta sharkara vartate tatha | || 13|| advayabrahmarupena vyapto'ham
    vai jagattrayam | brahmadikitaparyantah pranino mayi kalpitah || 14|| budbudadivikarantastarangah
    sagare yatha | tarangastham dravam sindhurna vanchati yatha tatha || 15|| vishayanandavancha me ma
    bhudanandarupatah| daridryasha yatha nasti sampannasya tatha mama || 16|| brahmanande nimagnasya vishayasha
    na tadbhavet | visham drishtva'mritam drishtva visham tyajati buddhiman || 17|| atmanamapi drishtvahamanatmanam
    tyajamyaham | ghatavabhasako bhanurghatanashe na nashyati || 18|| dehavabhasakah sakshi dehanashe
    na nashyati | na me bandho na me muktirna me shastram na me guruh || 19|| mayamatravikasatvanmayatito'hamadvayah
    | pranashcalantu taddharmaih kamairva hanyatam manah || 20|| anandabuddhipurnasya mama duhkham katham
    bhavet | atmanamanjasa vedmi kvapyajnanam palayitam || 21|| kartritvamadya me nashtam kartavyam vapi
    na kvacit | brahmanyam kulagotre ca namasaundaryajatayah || 22|| sthuladehagata ete sthuladbhinnasya
    me nahi | kshutpipasandhyabadhiryakama krodhadayo'khilah || 23|| lingadehagata ete hyalingasya na
    santi hi | jadatvapriyamodatvadharmah karanadehagah || 24|| na santi mama nityasya nirvikarasvarupinah|
    ulukasya yatha bhanurandhakarah pratiyate || 25|| svaprakashe paranande tamo mudhasya jayate | cakshurdrishtinirodhe'bhraih
    suryo nastiti manyate || 26|| tatha'jnanavrito dehi brahma nastiti manyate | yathamritam vishadbhinnam
    vishadoshairna lipyate || 27|| na sprishami jadadbhinno jadadoshan prakashatah | svalpapi dipakanika
    bahulam nashayettamah || 28|| svalpo'pi bodho nibide bahulam nashayettamah | kalatraye yatha sarpo
    rajjau nasti tatha mayi || 29|| ahankaradidehantam jagannastyahamadvayah | cidrupatvanna me jadyam
    satyatvannanritam mama || 30|| anandatvanna me duhkhamajnanadbhati satyavat | atmaprabodhopanisha
    muhurtamupasitva na sa punaravartate | na sa punaravartata ityupanishat || 31|| om vanme manasiti
    shantih || iti atmabodhopanishatsamapta adhikadhyayanaya
  devanagari: सकलभुवनहृद्योऽहम् । परमानन्दघनोऽहम् परमानन्दैकभूमरूपोऽहम् ॥ ८॥ शुद्धोऽहमद्वयोऽहं सन्ततभावोऽहमादिशून्योऽहम्
    । शमितान्तत्रितयोऽहं बद्धो मुक्तोऽहमद्भुतात्माहम् ॥ ९॥ शुद्धोऽहमान्तरोऽहं शाश्वतविज्ञानसमरसात्माहम्
    । शोधितपरतत्त्वोऽहं बोधानन्दैकमूर्तिरेवाहम् ॥ १०॥ विवेकयुक्तिबुद्ध्याहं जानाम्यात्मानमद्वयम् । तथापि
    बन्धमोक्षादिव्यवहारः प्रतीयते ॥ ११॥ निवृत्तोऽपि प्रपञ्चो मे सत्यवद्भाति सर्वदा । सर्पादौ रज्जुसत्तेव
    ब्रह्मसत्तैव केवलम् ॥ १२॥ प्रपञ्चाधाररूपेण वर्ततेऽतो जगन्न हि । यथेक्षुरससंव्याप्ता शर्करा वर्तते
    तथा । ॥ १३॥ अद्वयब्रह्मरूपेण व्याप्तोऽहं वै जगत्त्रयम् । ब्रह्मादिकीटपर्यन्ताः प्राणिनो मयि कल्पिताः
    ॥ १४॥ बुद्बुदादिविकारान्तस्तरङ्गः सागरे यथा । तरङ्गस्थं द्रवं सिन्धुर्न वाञ्छति यथा तथा ॥ १५॥ विषयानन्दवाञ्छा
    मे मा भूदानन्दरूपतः। दारिद्र्याशा यथा नास्ति संपन्नस्य तथा मम ॥ १६॥ ब्रह्मानन्दे निमग्नस्य विषयाशा
    न तद्भवेत् । विषं दृष्ट्वाऽमृतं दृष्ट्वा विषं त्यजति बुद्धिमान् ॥ १७॥ आत्मानमपि दृष्ट्वाहमनात्मानं
    त्यजाम्यहम् । घटावभासको भानुर्घटनाशे न नश्यति ॥ १८॥ देहावभासकः साक्षी देहनाशे न नश्यति । न मे बन्धो
    न मे मुक्तिर्न मे शास्त्रं न मे गुरुः ॥ १९॥ मायामात्रविकासत्वान्मायातीतोऽहमद्वयः । प्राणाश्चलन्तु
    तद्धर्मैः कामैर्वा हन्यतां मनः ॥ २०॥ आनन्दबुद्धिपूर्णस्य मम दुःखं कथं भवेत् । आत्मानमञ्जसा वेद्मि
    क्वाप्यज्ञानं पलायितम् ॥ २१॥ कर्तृत्वमद्य मे नष्टं कर्तव्यं वापि न क्वचित् । ब्राह्मण्यं कुलगोत्रे
    च नामसौन्दर्यजातयः ॥ २२॥ स्थूलदेहगता एते स्थूलाद्भिन्नस्य मे नहि । क्षुत्पिपासान्ध्यबाधिर्यकाम क्रोधादयोऽखिलाः
    ॥ २३॥ लिङ्गदेहगता एते ह्यलिङ्गस्य न सन्ति हि । जडत्वप्रियमोदत्वधर्माः कारणदेहगाः ॥ २४॥ न सन्ति मम
    नित्यस्य निर्विकारस्वरूपिणः। उलूकस्य यथा भानुरन्धकारः प्रतीयते ॥ २५॥ स्वप्रकाशे परानन्दे तमो मूढस्य
    जायते । चक्षुर्दृष्टिनिरोधेऽभ्रैः सूर्यो नास्तीति मन्यते ॥ २६॥ तथाऽज्ञानावृतो देही ब्रह्म नास्तीति
    मन्यते । यथामृतं विषाद्भिन्नं विषदोषैर्न लिप्यते ॥ २७॥ न स्पृशामि जडाद्भिन्नो जडदोषान् प्रकाशतः ।
    स्वल्पापि दीपकणिका बहुलं नाशयेत्तमः ॥ २८॥ स्वल्पोऽपि बोधो निबिडे बहुलं नाशयेत्तमः । कालत्रये यथा सर्पो
    रज्जौ नास्ति तथा मयि ॥ २९॥ अहङ्कारादिदेहान्तं जगन्नास्त्यहमद्वयः । चिद्रूपत्वान्न मे जाड्यं सत्यत्वान्नानृतं
    मम ॥ ३०॥ आनन्दत्वान्न मे दुःखमज्ञानाद्भाति सत्यवत् । आत्मप्रबोधोपनिष मुहूर्तमुपासित्वा न स पुनरावर्तते
    । न स पुनरावर्तत इत्युपनिषत् ॥ ३१॥ ॐ वाङ्मे मनसीति शान्तिः ॥ इति आत्मबोधोपनिषत्समाप्ता अधिकाध्ययनाय
