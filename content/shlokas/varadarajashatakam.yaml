id: varadarajashatakam
category: shataka
name:
  english: varadarajashatakam
  devanagari: वरदराजशतकम्
content:
  english: shalinyantakridadishikshanayute vidvadbhiratyadrite | shabdabrahmani durvivecanataya nityanubandham
    gata shrirastam karunamayi prakritivajjihvagrabhageshu nah || 75|| pankacchedini palitatribhuvane
    pankeruhashrikare padasparshaparakritakhilatamastome pare brahmani | payadamshumati prabheva paramavyomashraye
    samsthita padmapanganirikshanaih pratikalam pashyantyananyashritan || 76|| padmaya mukhamambujam suvimale
    netre ca nilotpale tasyashcittamashokamabjavasatervenyam sthita mallika | cutam panitalam tatah smarasharah
    pancapi tatrasate tairnityam parimohitah kimu harirnidrati gehe ciram || 77|| padmaya mukhamambujam
    suvimale tatrapi nilotpale netre tatra kaninika madhukarah sancarakah sarvada | nilambhodarucirhareh
    kaliyugeshvatanvi tenanyatha shuddhasphatikakantiyuktatanuta praudhim gatasya dhruvam || 78|| muktaharavirajite
    manivarashrisampadodbhasite lakshmilocanashatpadairanukalam pepiyamane muda | shrivatsankitavakshasi
    shritavatamanandasandohane shrishasyanishamantarangamadhikam saktam bhavenmamakam || 79|| lakshmipadasarojayavakarasasparshena
    mudrankite gopitungapayodharadaravato gopalakasyadbhute | muktaharamayi virajati ramakantasya vakshahsthale
    lakshmimandirarakshibahyaparigha kshirambudheh kulyaka || 80|| suryatopadalatsadaghanarucivyaptam
    sphurattarakam kantam nityamanantamashritavati vishvapriyadhayini | lakshmirindukaleva rajati tamasstomacchidam
    kurvati hyasmannetracakoraparanakari satsancayashrikari || 81|| rajyabhishekasamaye raghupungavasya
    shakrena sadarasamarpitapadmamala | vakshahsthale vahati varidamadhyagami
  devanagari: शालिन्यन्तकृदादिशिक्षणयुते विद्वद्भिरत्यादृते । शाब्दब्रह्मणि दुर्विवेचनतया नित्यानुबन्धं
    गता श्रीरास्तां करुणामयी प्रकृतिवज्जिह्वाग्रभागेषु नः ॥ ७५॥ पङ्कच्छेदिनि पालितत्रिभुवने पङ्केरुहश्रीकरे
    पादस्पर्शपराकृताखिलतमस्तोमे परे ब्रह्मणि । पायादंशुमति प्रभेव परमव्योमाश्रये संस्थिता पद्मापाङ्गनिरीक्षणैः
    प्रतिकलं पश्यन्त्यनन्याश्रितान् ॥ ७६॥ पद्माया मुखमम्बुजं सुविमले नेत्रे च नीलोत्पले तस्याश्चित्तमशोकमब्जवसतेर्वेण्यां
    स्थिता मल्लिका । चूतं पाणितलं ततः स्मरशराः पञ्चापि तत्रासते तैर्नित्यं परिमोहितः किमु हरिर्निद्राति
    गेहे चिरम् ॥ ७७॥ पद्माया मुखमम्बुजं सुविमले तत्रापि नीलोत्पले नेत्रे तत्र कनीनिका मधुकराः सञ्चारकाः
    सर्वदा । नीलाम्भोदरुचिर्हरेः कलियुगेष्वातन्वि तेनान्यथा शुद्धस्फाटिककान्तियुक्ततनुता प्रौढिं गतस्य
    ध्रुवम् ॥ ७८॥ मुक्ताहारविराजिते मणिवरश्रीसम्पदोद्भासिते लक्ष्मीलोचनषट्पदैरनुकलं पेपीयमाने मुदा । श्रीवत्साङ्कितवक्षसि
    श्रीतवतामानन्दसन्दोहने श्रीशस्यानिशमन्तरङ्गमधिकं सक्तं भवेन्मामकम् ॥ ७९॥ लक्ष्मीपादसरोजयावकरसस्पर्शेन
    मुद्राङ्किते गोपीतुङ्गपयोधरादरवतो गोपालकस्याद्भुते । मुक्ताहारमयी विराजति रमाकान्तस्य वक्षःस्थले लक्ष्मीमन्दिररक्षिबाह्यपरिघा
    क्षीराम्बुधेः कुल्यका ॥ ८०॥ सूर्याटोपदलत्सदाघनरुचिव्याप्तं स्फुरत्तारकं कान्तं नित्यमनन्तमाश्रितवती
    विश्वप्रियाधायिनी । लक्ष्मीरिन्दुकलेव राजति तमस्स्तोमच्छिदां कुर्वती ह्यस्मन्नेत्रचकोरपारणकरी सत्सञ्चयश्रीकरी
    ॥ ८१॥ राज्याभिषेकसमये रघुपुङ्गवस्य शक्रेण सादरसमर्पितपद्ममाला । वक्षःस्थले वहति वारिदमध्यगामि
