id: rajashvetakritamshivastotram
category: stotram
name:
  english: rajashvetakritamshivastotram
  devanagari: राजाश्वेतकृतंशिवस्तोत्रम्
content:
  english: raja shvetakritam shivastotram rajovaca | nirikshya devamishvaram prahrishtamanaso haram |
    nanama sambamavyayam sa rajapungavastada || 1|| namo bhavaya hetave haraya vishvasambhave | namah
    shivaya dhimate namo'pavargadayine || 2|| namo namo namo namo mahavibhutaye namah | vibhagahinarupine
    namo naradhipaya te || 3|| namo'stu te ganeshvara prapannaduhkhanashana | anadinityabhutaye varahasha
  devanagari: राजा श्वेतकृतं शिवस्तोत्रम् राजोवाच । निरीक्ष्य देवमीश्वरं प्रहृष्टमानसो हरम् । ननाम साम्बमव्ययं
    स राजपुङ्गवस्तदा ॥ १॥ नमो भवाय हेतवे हराय विश्वसम्भवे । नमः शिवाय धीमते नमोऽपवर्गदायिने ॥ २॥ नमो नमो
    नमो नमो महाविभूतये नमः । विभागहीनरूपिणे नमो नराधिपाय ते ॥ ३॥ नमोऽस्तु ते गणेश्वर प्रपन्नदुःखनाशन ।
    अनादिनित्यभूतये वराहश
meaning: {}
