id: venkateshastotram-2
category: stotram
name:
  english: venkateshastotram
  devanagari: वेन्कतेशस्तोत्रम्
content:
  english: shrivenkateshastotram venkatesho vasudevah pradyumno'mitavikramah | sankarshano'niruddhashca
    sheshadripatireva ca || 1|| janardanah padmanabho venkatacalavasanah | srishtikarta jagannatho madhavo
    bhaktavatsalah || 2|| govindo gopatih krishnah keshavo garudadhvajah | varaho vamanashcaiva narayana
    adhokshajah || 3|| shridharah pundarikakshah sarvadevastuto harih | shrinrisimho mahasimhah sutrakarah
    puratanah || 4|| ramanatho mahibharta bhudharah purushottamah | coḻaputrapriyah shanto brahmadinam
    varapradah || 5|| shrinidhih sarvabhutanam bhayakridbhayanashanah | shriramo ramabhadrashca bhavabandhaikamocakah
    || 6|| bhutavaso giravasah shrinivasah shriyahpatih | acyutanantagovindo vishnurvenkatanayakah ||
    7|| sarvadevaikasharanam sarvadevaikadaivatam | samastadevakavacam sarvadevashikhamanih || 8|| itidam
    kirtitam yasya vishnoramitatejasah | trikale yah pathennityam papam tasya na vidyate || 9|| rajadvare
    pathedghore sangrame ripusankate | bhutasarpapishacadibhayam nasti kadacana || 10|| aputro labhate
    putran nirdhano dhanavan bhavet | rogarto mucyate rogad baddho mucyeta bandhanat || 11|| yadyadishtatamam
    loke tattatprapnotyasamshayah | aishvaryam rajasammanam bhaktimuktiphalapradam || 12|| vishnorlokaikasopanam
    sarvaduhkhaikanashanam | sarvaishvaryapradam nrinam sarvamangalakarakam || 13|| mayavi paramanandam
    tyaktva vainkunthamuttamam | svamipushkarinitire ramaya saha modate || 14|| kalyanadbhutagatraya kamitarthapradayine
    | shrimadvenkatanathaya shrinivasaya te namah || 15|| venkatadrisamam sthanam brahmande nasti kincana
    | venkateshasamo devo na bhuto na bhavishyati | etena satya vakyena sarvarthan sadayamyaham || 16||
    || iti brahmandapurane brahmanaradasamvade shrivenkateshastotram sampurnam ||
  devanagari: श्रीवेङ्कटेशस्तोत्रम् वेङ्कटेशो वासुदेवः प्रद्युम्नोऽमितविक्रमः । सङ्कर्षणोऽनिरुद्धश्च शेषाद्रिपतिरेव
    च ॥ १॥ जनार्दनः पद्मनाभो वेङ्कटाचलवासनः । सृष्टिकर्ता जगन्नाथो माधवो भक्तवत्सलः ॥ २॥ गोविन्दो गोपतिः
    कृष्णः केशवो गरुडध्वजः । वराहो वामनश्चैव नारायण अधोक्षजः ॥ ३॥ श्रीधरः पुण्डरीकाक्षः सर्वदेवस्तुतो
    हरिः । श्रीनृसिंहो महासिंहः सूत्राकारः पुरातनः ॥ ४॥ रमानाथो महीभर्ता भूधरः पुरुषोत्तमः । चोळपुत्रप्रियः
    शान्तो ब्रह्मादीनां वरप्रदः ॥ ५॥ श्रीनिधिः सर्वभूतानां भयकृद्भयनाशनः । श्रीरामो रामभद्रश्च भवबन्धैकमोचकः
    ॥ ६॥ भूतावासो गिरावासः श्रीनिवासः श्रियःपतिः । अच्युतानन्तगोविन्दो विष्णुर्वेङ्कटनायकः ॥ ७॥ सर्वदेवैकशरणं
    सर्वदेवैकदैवतम् । समस्तदेवकवचं सर्वदेवशिखामणिः ॥ ८॥ इतीदं कीर्तितं यस्य विष्णोरमिततेजसः । त्रिकाले
    यः पठेन्नित्यं पापं तस्य न विद्यते ॥ ९॥ राजद्वारे पठेद्घोरे सङ्ग्रामे रिपुसङ्कटे । भूतसर्पपिशाचादिभयं
    नास्ति कदाचन ॥ १०॥ अपुत्रो लभते पुत्रान् निर्धनो धनवान् भवेत् । रोगार्तो मुच्यते रोगाद् बद्धो मुच्येत
    बन्धनात् ॥ ११॥ यद्यदिष्टतमं लोके तत्तत्प्राप्नोत्यसंशयः । ऐश्वर्यं राजसम्मानं भक्तिमुक्तिफलप्रदम्
    ॥ १२॥ विष्णोर्लोकैकसोपानं सर्वदुःखैकनाशनम् । सर्वैश्वर्यप्रदं नॄणां सर्वमङ्गलकारकम् ॥ १३॥ मायावी परमानन्दं
    त्यक्त्वा वैङ्कुण्ठमुत्तमम् । स्वामिपुष्करिणीतीरे रमया सह मोदते ॥ १४॥ कल्याणाद्भुतगात्राय कामितार्थप्रदायिने
    । श्रीमद्वेङ्कटनाथाय श्रीनिवासाय ते नमः ॥ १५॥ वेङ्कटाद्रिसमं स्थानं ब्रह्माण्डे नास्ति किञ्चन । वेङ्कटेशसमो
    देवो न भूतो न भविष्यति । एतेन सत्य वाक्येन सर्वार्थान् सादयाम्यहम् ॥ १६॥ ॥ इति ब्रह्माण्डपुराणे ब्रह्मनारदसंवादे
    श्रीवेङ्कटेशस्तोत्रं सम्पूर्णम् ॥
meaning: {}
