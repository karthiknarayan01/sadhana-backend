id: sri-bagalamukhi-ashtottara-satanama-stotram
category: stotram
name:
  english: Sri Bagalamukhi Ashtottara Satanama Stotram
content:
  english: narada uvaca bhagavan devadevesha srishtisthitilayeshvara | shatamashtottaram namnam bagalaya
    vadadhuna || || shri bhagavanuvaca shrinu vatsa pravakshyami namnamashtottaram shatam | pitambarya
    mahadevyah stotram papapranashanam || || yasya prapathanatsadyo vadi mukobhavet kshanat | ripavasstambhanam
    yanti satyam satyam vadamyaham || || om asya shripitambaryashtottarashatanamastotrasya sadashiva rishih
    anushtupchandah shripitambari devata shripitambari pritaye jape viniyogah | om bagala vishnuvanita
    vishnushankarabhamini | bahula devamata ca mahavishnuprasurapi || || mahamatsya mahakurma mahavaraharupini
    | narasimhapriya ramya vamana paturupini || || jamadagnyasvarupa ca rama ramaprapujita | krishna kapardini
    kritya kalaha ca vikarini || || buddhirupa buddhabharya bauddhapashandakhandini | kalkirupa kalihara
    kalidurgatinashini || || kotisuryapratikasha kotikandarpamohini | kevala kathina kali kala kaivalyadayini
    || || keshavi keshavaradhya kishori keshavastuta | rudrarupa rudramurti rudrani rudradevata || ||
    nakshatrarupa nakshatra nakshatreshaprapujita | nakshatreshapriya nitya nakshatrapativandita || ||
    nagini nagajanani nagarajapravandita | nageshvari nagakanya nagari ca nagatmaja || || nagadhirajatanaya
    nagarajaprapujita | navina nirada pita shyama saundaryakarini || || rakta nila ghana shubhra shveta
    saubhagyadayini | sundari saubhaga saumya svarnabha svargatiprada || || riputrasakari rekha shatrusamharakarini
    | bhamini ca tatha maya stambhini mohini shubha || || ragadveshakari ratri rauravadhvamsakarini |
    yakshini siddhanivaha siddhesha siddhirupini || || lankapatidhvamsakari lankesharipuvandita | lankanathakulahara
    maharavanaharini || || devadanavasiddhaughapujitaparameshvari | paranurupa parama paratantravinashini
    || || varada varadaradhya varadanaparayana | varadeshapriya vira virabhushanabhushita || || vasuda
    bahuda vani brahmarupa varanana | balada pitavasana pitabhushanabhushita || || pitapushpapriya pitahara
    pitasvarupini | iti te kathitam vipra namnamashtottaram shatam || || yah pathetpathayedvapi shrinuyadva
    samahitah | tasya shatruh kshayam sadyo yati naivatra samshayah || || prabhatakale prayato manushyah
    pathetsubhaktya paricintya pitam | dhruvam bhavettasya samastavriddhih vinashamayati ca tasya shatruh
    || || iti shrivishnuyamale naradavishnusamvade shribagalashtottarashatanamastotram |
  devanagari: नारद उवाच भगवन् देवदेवेश सृष्टिस्थितिलयेश्वर । शतमष्टोत्तरं नाम्नां बगलाया वदाधुना ॥ ॥ श्री
    भगवानुवाच शृणु वत्स प्रवक्ष्यामि नाम्नामष्टोत्तरं शतम् । पीताम्बर्या महादेव्याः स्तोत्रं पापप्रणाशनम्
    ॥ ॥ यस्य प्रपठनात्सद्यो वादी मूकोभवेत् क्षणात् । रिपवस्स्तम्भनं यान्ति सत्यं सत्यं वदाम्यहम् ॥ ॥ ॐ
    अस्य श्रीपीताम्बर्यष्टोत्तरशतनामस्तोत्रस्य सदाशिव ऋषिः अनुष्टुप्छन्दः श्रीपीताम्बरी देवता श्रीपीताम्बरी
    प्रीतये जपे विनियोगः । ॐ बगला विष्णुवनिता विष्णुशङ्करभामिनी । बहुला देवमाता च महाविष्णुप्रसूरपि ॥
    ॥ महामत्स्या महाकूर्मा महावाराहरूपिणी । नारसिंहप्रिया रम्या वामना पटुरूपिणी ॥ ॥ जामदग्न्यस्वरूपा च
    रामा रामप्रपूजिता । कृष्णा कपर्दिनी कृत्या कलहा च विकारिणी ॥ ॥ बुद्धिरूपा बुद्धभार्या बौद्धपाषण्डखण्डिनी
    । कल्किरूपा कलिहरा कलिदुर्गतिनाशिनी ॥ ॥ कोटिसूर्यप्रतीकाशा कोटिकन्दर्पमोहिनी । केवला कठिना काली कला
    कैवल्यदायिनी ॥ ॥ केशवी केशवाराध्या किशोरी केशवस्तुता । रुद्ररूपा रुद्रमूर्ती रुद्राणी रुद्रदेवता ॥
    ॥ नक्षत्ररूपा नक्षत्रा नक्षत्रेशप्रपूजिता । नक्षत्रेशप्रिया नित्या नक्षत्रपतिवन्दिता ॥ ॥ नागिनी नागजननी
    नागराजप्रवन्दिता । नागेश्वरी नागकन्या नागरी च नगात्मजा ॥ ॥ नगाधिराजतनया नगराजप्रपूजिता । नवीना नीरदा
    पीता श्यामा सौन्दर्यकारिणी ॥ ॥ रक्ता नीला घना शुभ्रा श्वेता सौभाग्यदायिनी । सुन्दरी सौभगा सौम्या स्वर्णाभा
    स्वर्गतिप्रदा ॥ ॥ रिपुत्रासकरी रेखा शत्रुसंहारकारिणी । भामिनी च तथा माया स्तम्भिनी मोहिनी शुभा ॥ ॥
    रागद्वेषकरी रात्री रौरवध्वंसकारिणी । यक्षिणी सिद्धनिवहा सिद्धेशा सिद्धिरूपिणी ॥ ॥ लङ्कापतिध्वंसकरी
    लङ्केशरिपुवन्दिता । लङ्कानाथकुलहरा महारावणहारिणी ॥ ॥ देवदानवसिद्धौघपूजितापरमेश्वरी । पराणुरूपा परमा
    परतन्त्रविनाशिनी ॥ ॥ वरदा वरदाराध्या वरदानपरायणा । वरदेशप्रिया वीरा वीरभूषणभूषिता ॥ ॥ वसुदा बहुदा
    वाणी ब्रह्मरूपा वरानना । बलदा पीतवसना पीतभूषणभूषिता ॥ ॥ पीतपुष्पप्रिया पीतहारा पीतस्वरूपिणी । इति
    ते कथितं विप्र नाम्नामष्टोत्तरं शतम् ॥ ॥ यः पठेत्पाठयेद्वापि शृणुयाद्वा समाहितः । तस्य शत्रुः क्षयं
    सद्यो याति नैवात्र संशयः ॥ ॥ प्रभातकाले प्रयतो मनुष्यः पठेत्सुभक्त्या परिचिन्त्य पीताम् । ध्रुवं भवेत्तस्य
    समस्तवृद्धिः विनाशमायाति च तस्य शत्रुः ॥ ॥ इति श्रीविष्णुयामले नारदविष्णुसंवादे श्रीबगलाष्टोत्तरशतनामस्तोत्रम्
    ।
