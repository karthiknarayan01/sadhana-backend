id: sri-datta-stavam
category: stotram
name:
  english: Sri Datta Stavam
content:
  english: shri ganeshaya namah shri sarasvatyai namah shripadavallabha narasimhasarasvati shriguru dattatreyaya
    namah dattatreyam mahatmanam varadam bhaktavatsalam | prapannartiharam vande smartrigami sanovatu
    || || dinabandhum kripasindhum sarvakaranakaranam | sarvarakshakaram vande smartrigami sanovatu ||
    || sharanagatadinarta paritranaparayanam | narayanam vibhum vande smartrigami sanovatu || || sarvanarthaharam
    devam sarvamangala mangalam | sarvakleshaharam vande smartrigami sanovatu || || brahmanyam dharmatattvajnam
    bhaktakirtivivardhanam | bhakta'bhishtapradam vande smartrigami sanovatu || || shoshanam papapankasya
    dipanam jnanatejasah | tapaprashamanam vande smartrigami sanovatu || || sarvarogaprashamanam sarvapidanivaranam
    | vipaduddharanam vande smartrigami sanovatu || || janmasamsarabandhaghnam svarupanandadayakam | nishshreyasapadam
    vande smartrigami sanovatu || || jaya labha yashah kama daturdattasya yah stavam | bhogamokshapradasyemam
    prapathet sukriti bhavet || || shri ganeshaya namah shri sarasvatyai namah shripadavallabha narasimhasarasvati
    shriguru dattatreyaya namah
  devanagari: श्री गणेशाय नमः श्री सरस्वत्यै नमः श्रीपादवल्लभ नरसिंहसरस्वति श्रीगुरु दत्तात्रेयाय नमः
    दत्तात्रेयं महात्मानं वरदं भक्तवत्सलम् । प्रपन्नार्तिहरं वन्दे स्मर्तृगामि सनोवतु ॥ ॥ दीनबन्धुं कृपासिन्धुं
    सर्वकारणकारणम् । सर्वरक्षाकरं वन्दे स्मर्तृगामि सनोवतु ॥ ॥ शरणागतदीनार्त परित्राणपरायणम् । नारायणं
    विभुं वन्दे स्मर्तृगामि सनोवतु ॥ ॥ सर्वानर्थहरं देवं सर्वमङ्गल मङ्गलम् । सर्वक्लेशहरं वन्दे स्मर्तृगामि
    सनोवतु ॥ ॥ ब्रह्मण्यं धर्मतत्त्वज्ञं भक्तकीर्तिविवर्धनम् । भक्ताऽभीष्टप्रदं वन्दे स्मर्तृगामि सनोवतु
    ॥ ॥ शोषणं पापपङ्कस्य दीपनं ज्ञानतेजसः । तापप्रशमनं वन्दे स्मर्तृगामि सनोवतु ॥ ॥ सर्वरोगप्रशमनं सर्वपीडानिवारणम्
    । विपदुद्धरणं वन्दे स्मर्तृगामि सनोवतु ॥ ॥ जन्मसंसारबन्धघ्नं स्वरूपानन्ददायकम् । निश्श्रेयसपदं वन्दे
    स्मर्तृगामि सनोवतु ॥ ॥ जय लाभ यशः काम दातुर्दत्तस्य यः स्तवम् । भोगमोक्षप्रदस्येमं प्रपठेत् सुकृती
    भवेत् ॥ ॥ श्री गणेशाय नमः श्री सरस्वत्यै नमः श्रीपादवल्लभ नरसिंहसरस्वति श्रीगुरु दत्तात्रेयाय नमः
