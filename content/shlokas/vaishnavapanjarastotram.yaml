id: vaishnavapanjarastotram
category: stotram
name:
  english: vaishnavapanjarastotram
  devanagari: वैष्णवपन्जरस्तोत्रम्
content:
  english: '|| 9|| mam rakshasvajita sada namaste''stvaparajita | vishalaksham samaruhya raksha mam tvam
    rasatale || 10|| akupara namastubhyam mahamina namo''stu te | karashirshadyangulishu satya tvam bahupanjaram
    || 11|| kritva rakshasva mam vishno namaste purushottama | etaduktam shankaraya vaishnavam panjaram
    mahat || 12|| pura raksharthamishanyah katyayanya vrishadhvaja | nashayamasa sa yena camaranmahishasuram
    || 13|| danavam raktabijam ca anya~shca surakantakan | etajjapannaro bhaktya shatrunvijayate sada
    || 14|| iti shrigarude purvakhande prathamamshakhye acarakande | vishnupanjarastotram nama trayodasho''dhyayah
    || 13|| garudapurana | purvakhanda | adhyaya 13'
  devanagari: ॥ ९॥ मां रक्षस्वाजित सदा नमस्तेऽस्त्वपराजित । विशालाक्षं समारुह्य रक्ष मां त्वं रसातले ॥
    १०॥ अकूपार नमस्तुभ्यं महामीन नमोऽस्तु ते । करशीर्षाद्यङ्गुलीषु सत्य त्वं बाहुपञ्जरम् ॥ ११॥ कृत्वा
    रक्षस्व मां विष्णो नमस्ते पुरुषोत्तम । एतदुक्तं शङ्कराय वैष्णवं पञ्जरं महत् ॥ १२॥ पुरा रक्षार्थमीशान्याः
    कात्यायन्या वृषध्वज । नाशायामास सा येन चामरान्महिषासुरम् ॥ १३॥ दानवं रक्तबीजं च अन्याँश्च सुरकण्टकान्
    । एतज्जपन्नरो भक्त्या शत्रून्विजयते सदा ॥ १४॥ इति श्रीगारुडे पूर्वखण्डे प्रथमांशाख्ये आचारकाण्डे ।
    विष्णुपञ्जरस्तोत्रं नाम त्रयोदशोऽध्यायः ॥ १३॥ गरुडपुराण । पूर्वखण्ड । अध्याय १३
