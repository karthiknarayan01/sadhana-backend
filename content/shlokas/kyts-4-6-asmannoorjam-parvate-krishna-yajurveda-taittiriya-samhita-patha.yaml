id: kyts-4-6-asmannoorjam-parvate-krishna-yajurveda-taittiriya-samhita-patha
category: stotram
name:
  english: KYTS 4.6 Asmannoorjam Parvate - Krishna Yajurveda Taittiriya Samhita Patha
content:
  english: krishna yajurvediya taittiriya samhitaya ncaturthakande shashthah prashnah shri gurubhyo namah
    | harih om || ashmannurja mparvate shishriyanam va~te parjanye varunasya shushme | adbhya oshadhibhyo
    vanaspatibhyo ssagm raranah || ashmaggste kshudamu ndvishmah || samudrasya tva 'gne pari vyayamasi
    | pavako asmabhyagm shivo bhava || himasya tva jarayuna 'gne pari vyayamasi | pavako asmabhyagm shivo
    bhava || upa nnadishva | agne pittamapamasi || manduki tabhira gahi sema nno yajnam | pavakavarnagm
    shiva nkridhi || pavaka a citayantya kripa | kshama nruruca ushaso na bhanuna nna yamannetashasya
    nu rana a yo ghrine | na tatrishano ajarah || agne pavaka rocisha mandraya deva jihvaya vakshi yakshi
    ca || sa nah pavaka didivo 'gne devagm iha '' vaha | upa yajnagm havishca nah || apamida nnyayanagm
    samudrasya niveshanam | anya ttapantu hetayah pavako asmabhyagm shivo bhava || namaste harase shocishe
    namaste astvarcishe ttapantu hetayah pavako asmabhyagm shivo bhava || nrishade va thsuvarvide vat
    || ye deva devanam ya~jniya yajniyanagm sam thsarinamupa bhagamasate | ahutado havisho yajne asmin
    mmadhuno ghritasya || ye deva deveshvadhi devatvamayan ye brahmanah pura etaro asya | yebhyo narte
    pavate dhama ki ncana na te divo na prithivya adhi snushu || pranada shcakshurda varcoda varivodah
    | anya ttapantu hetayah pavako asmabhyagm shivo bhava || agnistigmena shocisha yagmsadvishva m | agnirno
    vagmsate rayim || saina 'nikena suvidatro asme yashta devagm ayajishtha ssvasti | adabdho gopa uta
    nah paraspa agne shcatushcatvarigmshacca ya ima vishva bhuvanani juhvadrishirhota nishasada pita nah
    | sa ashisha dravinamicchamanah paramacchado vara a vivesha || vishvakarma manasa yadvihaya dhata
    vidhata paramota sandrik | teshamishtani samisha madanti yatra saptarshi npara ekamahuh || yo nah
    pita janita yo vidhata yo nah sato abhya sajjajana | nnamadha eka eva tagm samprashna mbhuvana yantyanya
    || ta a 'yajanta dravinagm samasma rishayah purve jaritaro na bhuna | asurta surta rajaso vimane ye
    bhutani samakrinvannimani || na tam mbhavati | niharena pravrita jalpya casutripa uktha shasashcaranti
    || paro diva para ena prithivya paro devebhirasurairguha yat | kagg ndaddhra apo yatra deva ssamagacchanta
    vishve ndaddhra apo yatra deva ssamagacchanta vishve | ajasya nabhavaddhyeka mbhuvanamadhi shritam
    || vishvakarma hyajanishta deva adi ddvitiyah | tritiyah pita janitaushadhina pita janitaushadhinam
    tpurutra || cakshushah pita manasa hi dhiro ghritamene ajanannamane | yadedanta adadrigmhanta purva
    adi ddyavaprithivi aprathetam || vishvata shcakshuruta vishvatomukho vishvatohasta uta vishvataspat
    | sa mpatatrai rdyavaprithivi janaya ndeva ekah || kigg tkimasit | yadi bhumi nvishvakarma vi dyamaurno
    nmahina vishvacakshah || kigg nka u sa vriksha asidyato dyavaprithivi nishtatakshuh | manishino manasa
    pricchatedu tadyadaddhyatishtha dbhuvanani dharayann || ya te dhamani paramani ya 'vama ya maddhyama
    vishvakarmannutema | shiksha sakhibhyo havishi svadhava njushanah || vacaspatim va~je adya huvema
    | sa no nedishtha havanani joshate vishvashabhumravase sadhukarma || vishvakarman njushanah | muhyantvanye
    abhitah sapatna ihasmaka mmaghava surirastu || vishvakarman havisha vardhanena trataramindra makrinoravaddhyam
    | tasmai visha ssamanamanta purvirayamugro vihavyo yatha 'sat || samudraya vayunaya sindhuna mpataye
    namah | nadinagm sarvasa mpitre juhuta vishvakarmane vishva 'hamartyagm havih || ''huta | rayasposhena
    sagm srija prajaya ca dhanena ca || indrema va~rcasa srija devebhyo bhagadha asat || yasya kurmo havirgrihe
    tamagne vardhaya tvam | tasma deva adhi bravannaya nca brahmanaspatih || udu tva vishve deva agne
    bharantu cittibhih | agne bharantu cittibhih | sa no bhava shivatama ssupratiko vibhavasuh || panca
    disho daivi ryajnamavantu devirapamati mbadhamanah | rayasposhe yajnapati mabhajantih || rayasposhe
    adhi yajno astha thsamiddhe agnavadhi mamahanah | ukthapatra idyo gribhitastapta mparigrihyayajanta
    || urja ya dyajnamashamanta deva daivyaya dhartre joshtre parigrihya deva yajnamayann || suryarashmirharikeshah
    purasta thsavita jyotirudayagm ajasram | tasya pusha prasavam ssapamshyan vishva bhuvanani gopah ||
    deva devebhyo addhvaryanto asthurvitagm shamitre shamita yajaddhyai | turiyo yajno yatra havyameti
    tatah pavaka ashisho no jushantam || vimana esha divo maddhya asta apapriva nrodasi antariksham |
    sa vishvacirabhi cashte ghritacirantara cashte ghritacirantara purvamapara nca ketum || uksha samudro
    aruna ssuparnah purvasya yoni mpitura vivesha | maddhye divo nihitah prishnirashma vi cakrame rajasah
    patyantau ngirah | rathitamagm rathinam va~janagm satpati m || sumnahuryajno devagm a ca vakshadyakshadagnirdevo
    devagm a ca vakshat || vajasya ma prasaveno dagrabhit | atha sapatnagm indro me nigrabhenadharagm
    akah || udgrabha nca brahma deva avivridhann | atha sapatnanindragni me vishucinan vyasyatam || shshishano
    vrishabho na yuddhmo ghanaghanah shaninam | sankrandano thsakamindrah || sankrandanena nimishena jishnuna
    yutkarena dushcyavanena dhrishnuna | tadindrena jayata ta yu~dho nara ishuhastena vrishna ssa nishangibhirvashi
    sagg srashta sa yudha indro ganena | sagmsrishtaji thsomapa bahushardhyu rdhvadhanva pratihitabhirasta
    || brihaspate pari diya rathena rakshoha 'mitragm apa badhamanah | prabhanjan pramrino yudha jayannasmaka
    meddhyavita rathanam || gotrabhida njayantamajma pramrinanta mojasa | imagm sajata anuvira yaddhvamindragm
    sakhayo 'nu sagm rabhaddhvam || balavijnayah vaji sahamana ugrah | abhiviro abhisatva sahoja jaitramindra
    rathamatishtha govit || abhi gotrani sahasa gahamano shshatamanyurindrah | shshatamanyurindrah | dushcyavanah
    pritanashada yuddhyo smakagm sena avatu pra yuthsu || indra asam neta brihaspati rdakshina yajnah
    pura etu somah | devasenana mmaruto yantvagre || indrasya vrishno varunasya rajna adityana mmarutagm
    shardha ugram | mahamanasa njayata mudasthat || asmaka ssamriteshu dhvajeshvasmakam ya~ ishavasta
    jayantu | vi~ra uttare bhavantvasmanu deva avata haveshu || uddhar mmahagmsi | udvritrahan vajinam
    njayatametu ghoshah || upa preta jayata narassthira vah santu bahavah | indro va dhrishya yathasatha
    || avasrishta para pata sharavye brahma sagmshita | gaccha nkancanocchishah || marmani te varmabhishchadayami
    somastva raja 'mritenabhi vastam | urorvariyo varivaste astu jayanta ntvamanu madantu devah || yatra
    bana ssampatanti kumara vishikha iva | indro nastatra vritraha vishvaha sharma yacchatu || pracimanu
    pradisha mprehi vidvanagneragne puro agnirbhaveha | vishva asha didyano vi bhahyurja nno dhehi dvipade
    catushpade || kramaddhvamagnina nakamukhyagm hasteshu bibhratah | divah prishthagm suvargatva mishra
    devebhiraddhvam || prithivya ahamudantariksha 'ruham | divo nakasya prishtha thsuvarjyotiragam maham
    || suvaryanto nape kshanta a dyagm rohanti rodasi | yajnam ye~ vishvatodharagm suvidvagmso vitenire
    || agne prehi prathamo devayata ncakshurdevanamuta martyanam | iyakshamana bhrigubhi ssuvaryantu yajamana
    ssvasti || naktoshasa samanasa virupe dhapayete shishumekagm samici | dyava kshama rukmo antarvi bhati
    deva agni ndravinodah || agne sahasraksha ssahasramapanah | tvagm sahasrasya raya ishishe tasmai te
    vidhema vajaya svaha nprithivyagm sida prishthe prithivya 'ntarikshama prina jyotisha divamuttabhana
    tejasa disha u ddrigmha || ajuhvana ssupratikah purastadagne svam yo~nima sida saddhya | asmin thsadhasthe
    addhyuttarasmin vishve deva addhyuttarasmin vishve devah yajamanashca sidata || preddho agne didihi
    puro no 'jasraya surmya yavishtha | tvagm shashvanta upa yanti vajah || vidhema te parame janmannagne
    vidhema stomairavare sadhasthe dyonerudaritha yaje ta mpratve havigmshi juhure samiddhe || tagm saviturvare
    vi~shvajanyam | yamasya kanvo aduha tprapinagm sahasradhara ngam || sapta te agne samidhah sapta jihva
    ssapta dhama priyani | sapta hotra ssaptadha tva yajanti sapta yonira prinasva ghritena || idri ncaitadrinca
    pratidri nca mitashca sammitashca sabharah || shukrajyotishca citrajyotishca satyajyotishca jyotishmag
    shca satyashcartapashcatyagmhah | ritajicca satyajicca senajicca sushenashcantyamitrashca dure amitrashca
    ganah || ritashca satyashca dhruvashca dharunashca dharta ca vidharta ca vidharayah || idrikshasa
    etadrikshasa u shunah sadrikshasah pratisadrikshasa etana | mitasashca sammitasashca na utaye sabharaso
    maruto yajne asminnindra ndaivirvisho maruto 'nuvartmano yathendra ndaivirvisho maruto 'nuvartmana
    evamimam shca visho manushishcanuvartmano bhavantu || jimutasyeva bhavati pratikam ya~dvarmi yati
    samadamupasthe | anaviddhaya tanuva jaya tvagm sa tva varmano mahima pipartu || dhanvana ga dhanvana
    njayema dhanvana tivra ssamado jayema | dhanu nkrinoti dhanvana sarvah pradisho jayema || vakshyantiveda
    ganiganti karna mparishasvajana | yosheva shinkte vitata njya iyagm samane parayanti || te acaranti
    samaneva yosha mateva putra | apa shatrun viddhyatagm sam vi~dane artni ime vishphuranti amitran ||
    bahvina mpita bahurasya putrashcishca krinoti samana ssankah pritanashca sarvah prishthe ninaddho
    jayati prasutah || rathe tishtha nnayati vajinah puro yatrayatra kamayate susharathih | abhishuna
    mpanayata manah pashcadanu yacchanti rashmayah || tivra n krinvate vrishapanayo ssaha vajayantah |
    avakramantah prapadairamitra n kshinanti shatrugmranapavyayantah || rathavahanagm havirasya nama yatra
    nnihitamasya varma | tatra rathamupa shagmagm sadema vishvaha vayagm sumanasyamanah || svadushagm
    sadah pitaro vayodhah kricchreshrita shshaktivanto gabhirah | citrasena ishubala amriddhra vratasahah
    || brahmanasah shshive no dyavaprithivi anehasa | pusha nah patu duritadritavridho raksha makirno
    aghashagmsa ishata || suparnam va~ste mrigo asya danto gobhi ssannaddha patati prasuta | yatra nara
    nca vi ca dravanti tatrasmabhyamishava shsharma yagmsann || rijite pari vringdhi no 'shma bhavatu
    nastanuh | somo adhi bravitu no shsharma yacchatu || a janghanti sanvesha njaghanagm upa jighnate
    | ashvajani pracetaso thsamathsu codaya || ahiriva bhogaih paryeti bahu mparibadhamanah | hastaghno
    vishva vayunani vidva mpari patu vishvatah || vanaspate vidvango hi bhuya asma ssannaddho asi vidayasva
    ''sthata te jayatu jetvani || divah prithivyah pa va~naspatibhyah paryabhritagm sahah | apamojmana
    mpari gobhiravritamindrasya vajragm havisha ratham ya~ja || indrasya vajro marutamanika mmitrasya
    garbho varunasya nabhih | sema njushano deva ratha prati havya gribhaya || upa shvasaya prithivimuta
    dya mpurutra te manutam njagat | sa dundubhe sajurindrena devairdura ddaviyo apasedha shatrun || a
    krandaya balamojo na a dha nishtanihi durita badhamanah | apa protha dundubhe ducchunagm ita indrasya
    mushtirasi vidayasva || a 'muraja pratyavartayemah ketuma ddundubhi rvavaditi | samashvaparnashcaranti
    no naro 'smakamindra rathino jayantu || thsamudraduta va purishat | shyenasya paksha harinasya bahu
    upastutya nte arvann || yamena datta ntrita enamayunagindra ena mprathamo addhyatishthat | gandharvo
    asya rashanama va~savo niratashta || asi yamo asyadityo arvannasi trito guhyena vratena | asi somena
    samaya viprikta ahuste trini divi bandhanani | ahuste trini divi bandhanani || trini ta ahurdivi bandhanani
    trinyaphsu trinyanta ssamudre | uteva me varunashchan yatra ta ahuh parama m || ima te vajinnavamarjananima
    shaphanagm saniturnidhana | atra te bhadra rashana apashyamritasya ya abhirakshanti gopah || atmana
    ''radajanamavo diva mpatangam | shiro apashya mpathibhih sugebhirarenubhirjehamana mpatatri || atra
    te rupamuttamamapashya njigishamanamisha a pade goh | yada te marto anu bhogamanadadi dgrasishtha
    oshadhirajigah || anu tva ratho anu maryo arvannanu gavo m | anu vratasastava sakhyamiyuranu deva
    mamire virya nte || hiranyashringo 'yo asya pada manojava avara indra asit | deva idasya haviradyamayan
    mprathamo addhyatishthat || irmantasa ssagm shuranaso divyaso atyah | hagmsa iva shrenisho yatante
    yadakshishurdivya va~ta iva dhrajiman | tava shringani vishthita purutra 'ranyeshu jarbhurana caranti
    || upa va~jyarva devadrica manasa diddhyanah | ajah puro niyate nabhirasyanu pashca tkavayo yanti
    rebhah || upa praga thsadhasthamarvagm accha pitara nca | adya devan jushtatamo hi gamya atha ste
    dashushe varyani || kannacatvarigmshacca ma no mitro varuno aryama ''yurindra ribhuksha marutah pari
    khyann | ya dvajino devajatasya sapteh pravakshyamo vidathe viryani || yannirnija reknasa pravritasya
    rati mmukhato nayanti | supranajo memya dvishvarupa indrapushnoh priyamapyeti pathah || esha cchagah
    puro ashvena vajina pushno bhago niyate vishvade tpurodashamarvata tvashte enagm saushravasaya jinvati
    | denagm saushravasaya jinvati || yaddhavishyamritusho devayana ntrirmanushah paryashva nnayanti |
    atra pushnah prathamo bhaga eti yajna ndevebhyah prativedayannajah || hota 'ddhvaryuravaya agnimindho
    gravagrabha uta shagg sta suviprah | tena yajnena svarankritena svishtena vakshana a prinaddhvam ||
    yupavraska uta ye yupavahashcashalam ye~ ashvayupaya takshati | ye carvate pacanagm sabhamrantyuto
    rtirna invatu || upa praga 'dhayi manma devanamasha upa vitaprishthah | anvenam vi~pra rishayo madanti
    devana mpushte cakrima subandhu dvajino dama sadannamarvato ya shir shanya rashana rajjurasya | yadva
    ghasya prabhritamasye trinagm sarva ta te api deveshvastu || yadashvasya kravisho ''sha yadva svarau
    svadhitau riptamasti | yaddhastayo shshamituryannakheshu sarva ta te api deveshvastu || yaduvaddhyamudarasyapavati
    ya amasya kravisho gandho asti | sukrita tacchamitarah krinvantuta medhagm shritapaka tte gatradagnina
    pacyamanadabhi shula nnihatasyavadhavati | ma ta nma trineshu devebhyastadushadbhyo ratamastu || mparipashyanti
    pakvam hareti | ye carvato magmsabhikshamupasata uto teshamabhigu rtirna invatu || yannikshana mmagspacanya
    ukhaya ya patrani yushna asecanani | ushmanya 'pidhana carunamanka ssunah pari bhushantyashva ya~cca
    padbishamarvatah | yacca papau yacca ghasi njaghasa sarva ta te api deveshvastu || ma tva ddhumagandhirmokha
    bhrajantyabhi vikta jaghrih | ishtam ndevasah prati gribhnantyashva m || yadashvaya vasa upastrinantyadhivasam
    ya~ hiranyanyasmai | sandanamarvanta mpriya deveshva yamayanti || ya tte sade mahasa shukritasya par
    va tutoda | sruceva ta havisho addhvareshu sarva ta te brahmana sudayami || catustrigmsha dvajino
    devabandho ssameti | acchidra gatra vayuna krinota parushparuranughushya vi shasta || ekastvashturashvasya
    vishasta dva yantara bhavatastathartuh | ya te gatranamritutha krinomi tata pindana mpra juhomyagnau
    || ma tva tapa mma svadhitistanuva a tishthipa tte | ma te griddhnu 'tihaya chidra gatra nyasina mithu
    kah || na va uvetanmriyase na rishyasi devagm ideshi pathibhih sugebhih | hari te yunja prishati abhutamupa
    dvaji dhuri rasabhasya || sugavya nno vaji svashviya mpugmsah putragm uta vishvapushagm rayim | anagastva
    nno aditih krinotu kshatra nno ashvo vanatagm havishman || || harih om || || krishna yajurvediya taittiriya
    samhitaya ncaturtha kande shashthah prashna
  devanagari: कृष्ण यजुर्वेदीय तैत्तिरीय संहिताया ञ्चतुर्थकाण्डे षष्ठः प्रश्नः श्री गुरुभ्यो नमः । ह॒रिः॒
    ओम् ॥ अश्म॒न्नूर्ज॒ म्पर्व॑ते शिश्रिया॒णां वाँते॑ प॒र्जन्ये॒ वरु॑णस्य॒ शुष्मे । अ॒द्भ्य ओष॑धीभ्यो॒
    वन॒स्पति॒भ्यो स्सग्ं ररा॒णाः ॥ अश्मग्ग्॑स्ते॒ क्षुद॒मु न्द्वि॒ष्मः ॥ स॒मु॒द्रस्य॑ त्वा॒ ऽग्ने॒ परि॑
    व्ययामसि । पा॒व॒को अ॒स्मभ्यग्ं॑ शि॒वो भ॑व ॥ हि॒मस्य॑ त्वा ज॒रायु॒णा ऽग्ने॒ परि॑ व्ययामसि । पा॒व॒को
    अ॒स्मभ्यग्ं॑ शि॒वो भ॑व ॥ उप॒ न्न॒दीष्वा । अग्ने॑ पि॒त्तम॒पाम॑सि ॥ मण्डू॑कि॒ ताभि॒रा ग॑हि॒ सेम न्नो॑
    य॒ज्ञम् । पा॒व॒कव॑र्णग्ं शि॒व ङ्कृ॑धि ॥ पा॒व॒क आ चि॒तय॑न्त्या कृ॒पा । क्षाम॑ न्रुरु॒च उ॒षसो॒ न भा॒नुना
    न्न याम॒न्नेत॑शस्य॒ नू रण॒ आ यो घृ॒णे । न त॑तृषा॒णो अ॒जरः॑ ॥ अग्ने॑ पावक रो॒चिषा॑ म॒न्द्रया॑ देव जि॒ह्वया
    व॑क्षि॒ यक्षि॑ च ॥ स नः॑ पावक दीदि॒वो ऽग्ने॑ दे॒वाग्ं इ॒हा ऽऽ व॑ह । उप॑ य॒ज्ञग्ं ह॒विश्च॑ नः ॥ अ॒पामि॒द
    न्न्यय॑नग्ं समु॒द्रस्य॑ नि॒वेश॑नम् । अ॒न्य त्त॑पन्तु हे॒तयः॑ पाव॒को अ॒स्मभ्यग्ं॑ शि॒वो भ॑व ॥ नम॑स्ते॒
    हर॑से शो॒चिषे॒ नम॑स्ते अस्त्व॒र्चिषे त्त॑पन्तु हे॒तयः॑ पाव॒को अ॒स्मभ्यग्ं॑ शि॒वो भ॑व ॥ नृ॒षदे॒ व थ्सु॑व॒र्विदे॒
    वट् ॥ ये दे॒वा दे॒वानां यँ॒ज्ञिया॑ य॒ज्ञिया॑नाग्ं सं थ्स॒रीण॒मुप॑ भा॒गमास॑ते । अ॒हु॒तादो॑ ह॒विषो॑
    य॒ज्ञे अ॒स्मिन् म्मधु॑नो घृ॒तस्य॑ ॥ ये दे॒वा दे॒वेष्वधि॑ देव॒त्वमाय॒न्॒ ये ब्रह्म॑णः पुर ए॒तारो॑ अ॒स्य
    । येभ्यो॒ नर्ते पव॑ते॒ धाम॒ कि ञ्च॒न न ते दि॒वो न पृ॑थि॒व्या अधि॒ स्नुषु॑ ॥ प्रा॒ण॒दा श्च॑क्षु॒र्दा
    व॑र्चो॒दा व॑रिवो॒दाः । अ॒न्य त्त॑पन्तु हे॒तयः॑ पाव॒को अ॒स्मभ्यग्ं॑ शि॒वो भ॑व ॥ अ॒ग्निस्ति॒ग्मेन॑ शो॒चिषा॒
