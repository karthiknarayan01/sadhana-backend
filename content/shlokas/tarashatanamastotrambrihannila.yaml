id: tarashatanamastotrambrihannila
category: stotram
name:
  english: tarashatanamastotrambrihannila
  devanagari: ताराशतनामस्तोत्रम्बृहन्नील
content:
  english: rinu sadhvi vararohe shatam namnam puratanam | sarvasiddhikaram pumsam sadhakanam sukhapradam
    || 6|| om tarini tarasamyoga mahatarasvarupini | tarakapranahartri ca taranandasvarupini || 7|| mahanila
    maheshani mahanilasarasvati | ugratara sati sadhvi bhavani bhavamocini || 8|| mahashankharata bhima
    shankari shankarapriya | mahadanarata candi candasuravinashini || 9|| candravadrupavadana carucandramahojjvala
    | ekajata kurangakshi varadabhayadayini || 10|| mahakali mahadevi guhyakali varaprada | mahakalarata
    sadhvi mahaishvaryapradayini || 11|| muktida svargada saumya saumyarupa surariha | shathavijna mahanada
    kamala bagalamukhi || 12|| mahamuktiprada kali kalaratrisvarupini | sarasvati saricshreshtha svarganga
    svargavasini || 13|| himalayasuta kanya kanyarupavilasini | shavoparisamasina mundamalavibhushita
    || 14|| digambara patirata viparitaratatura | rajasvala rajahprita svayambhukusumapriya || 15|| svayambhukusumaprana
    svayambhukusumotsuka | shivaprana shivarata shivadatri shivasana || 16|| attahasa ghorarupa nityanandasvarupini
    | meghavarna kishori ca yuvatistanakunkuma || 17|| kharva kharvajanaprita manibhushitamandana | kinkinishabdasamyukta
    nrityanti raktalocana || 18|| krishangi krisaraprita sharasanagatotsuka | kapalakharparadhara pancashanmundamalika
    || 19|| havyakavyaprada tushtih pushtishcaiva varangana | shantih kshantirmano buddhih sarvabijasvarupini
    || 20|| ugrapatarini tirna nistirnagunavrindaka | rameshi ramani ramya ramanandasvarupini || 21||
    rajanikarasampurna raktotpalavilocana | iti te kathitam divyam shatam namnam maheshvari || 22|| prapathed
    bhaktibhavena tarinyastaranakshamam | sarvasuramahanadastuyamanamanuttamam || 23|| shanmasad mahadaishvaryam
    labhate parameshvari | bhumikamena japtavyam vatsarattam labhet priye || 24|| dhanarthi prapnuyadartham
    moksharthi mokshamapnuyat | dararthi prapnuyad daran sarvagama
  devanagari: ृणु साध्वि वरारोहे शतं नाम्नां पुरातनम् । सर्वसिद्धिकरं पुंसां साधकानां सुखप्रदम् ॥ ६॥ ॐ
    तारिणी तारसंयोगा महातारस्वरूपिणी । तारकप्राणहर्त्री च तारानन्दस्वरूपिणी ॥ ७॥ महानीला महेशानी महानीलसरस्वती
    । उग्रतारा सती साध्वी भवानी भवमोचिनी ॥ ८॥ महाशङ्खरता भीमा शाङ्करी शङ्करप्रिया । महादानरता चण्डी चण्डासुरविनाशिनी
    ॥ ९॥ चन्द्रवद्रूपवदना चारुचन्द्रमहोज्ज्वला । एकजटा कुरङ्गाक्षी वरदाभयदायिनी ॥ १०॥ महाकाली महादेवी
    गुह्यकाली वरप्रदा । महाकालरता साध्वी महैश्वर्यप्रदायिनी ॥ ११॥ मुक्तिदा स्वर्गदा सौम्या सौम्यरूपा सुरारिहा
    । शठविज्ञा महानादा कमला बगलामुखी ॥ १२॥ महामुक्तिप्रदा काली कालरात्रिस्वरूपिणी । सरस्वती सरिच्श्रेष्ठा
    स्वर्गङ्गा स्वर्गवासिनी ॥ १३॥ हिमालयसुता कन्या कन्यारूपविलासिनी । शवोपरिसमासीना मुण्डमालाविभूषिता
    ॥ १४॥ दिगम्बरा पतिरता विपरीतरतातुरा । रजस्वला रजःप्रीता स्वयम्भूकुसुमप्रिया ॥ १५॥ स्वयम्भूकुसुमप्राणा
    स्वयम्भूकुसुमोत्सुका । शिवप्राणा शिवरता शिवदात्री शिवासना ॥ १६॥ अट्टहासा घोररूपा नित्यानन्दस्वरूपिणी
    । मेघवर्णा किशोरी च युवतीस्तनकुङ्कुमा ॥ १७॥ खर्वा खर्वजनप्रीता मणिभूषितमण्डना । किङ्किणीशब्दसंयुक्ता
    नृत्यन्ती रक्तलोचना ॥ १८॥ कृशाङ्गी कृसरप्रीता शरासनगतोत्सुका । कपालखर्परधरा पञ्चाशन्मुण्डमालिका ॥
    १९॥ हव्यकव्यप्रदा तुष्टिः पुष्टिश्चैव वराङ्गना । शान्तिः क्षान्तिर्मनो बुद्धिः सर्वबीजस्वरूपिणी ॥
    २०॥ उग्रापतारिणी तीर्णा निस्तीर्णगुणवृन्दका । रमेशी रमणी रम्या रामानन्दस्वरूपिणी ॥ २१॥ रजनीकरसम्पूर्णा
    रक्तोत्पलविलोचना । इति ते कथितं दिव्यं शतं नाम्नां महेश्वरि ॥ २२॥ प्रपठेद् भक्तिभावेन तारिण्यास्तारणक्षमम्
    । सर्वासुरमहानादस्तूयमानमनुत्तमम् ॥ २३॥ षण्मासाद् महदैश्वर्यं लभते परमेश्वरि । भूमिकामेन जप्तव्यं
    वत्सरात्तां लभेत् प्रिये ॥ २४॥ धनार्थी प्राप्नुयादर्थं मोक्षार्थी मोक्षमाप्नुयात् । दारार्थी प्राप्नुयाद्
    दारान् सर्वागम
