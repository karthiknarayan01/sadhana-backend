id: devaihkritamskandastotram
category: stotram
name:
  english: devaihkritamskandastotram
  devanagari: देवैःकृतंस्कन्दस्तोत्रम्
content:
  english: devaih kritam skandastotram deva ucuh | namah kumaraya mahaprabhaya skandaya ca skanditadanavaya
    | navarkavidyuddyutaye namo'stu te namo'stu te shanmukha kamarupa || 13|| pinaddhananabharanaya bhartre
    namo rane danavadaranaya | namo'stu te'rkapratimaprabhaya namo'stu guhyaya guhaya tubhyam || 14||
    namo'stu trailokyabhayapahaya namo'stu te bala kripaparaya | namo vishalamalalocanaya namo vishakhaya
    mahavrataya || 15|| namo namaste'stu manoharaya namo namaste'stu ranotkataya | namo mayurojjvalavahanaya
    namo'stu keyuradharaya tubhyam || 16|| namo dhritodagrapatakine namo namah prabhavapranataya te'stu
    | namaste namaste varaviryashaline kripaparo no bhava bhavyamurte || 17|| iti matsyapurane ekonashashtyadhikashatatamadhyayantargatam
    devaih kritam skandastotram samaptam | matsyapurana | adhyaya 159
  devanagari: देवैः कृतं स्कन्दस्तोत्रम् देवा ऊचुः । नमः कुमाराय महाप्रभाय स्कन्दाय च स्कन्दितदानवाय ।
    नवार्कविद्युद्द्युतये नमोऽस्तु ते नमोऽस्तु ते षण्मुख कामरूप ॥ १३॥ पिनद्धनानाभरणाय भर्त्रे नमो रणे
    दानवदारणाय । नमोऽस्तु तेऽर्कप्रतिमप्रभाय नमोऽस्तु गुह्याय गुहाय तुभ्यम् ॥ १४॥ नमोऽस्तु त्रैलोक्यभयापहाय
    नमोऽस्तु ते बाल कृपापराय । नमो विशालामललोचनाय नमो विशाखाय महाव्रताय ॥ १५॥ नमो नमस्तेऽस्तु मनोहराय
    नमो नमस्तेऽस्तु रणोत्कटाय । नमो मयूरोज्ज्वलवाहनाय नमोऽस्तु केयूरधराय तुभ्यम् ॥ १६॥ नमो धृतोदग्रपताकिने
    नमो नमः प्रभावप्रणताय तेऽस्तु । नमस्ते नमस्ते वरवीर्यशालिने कृपापरो नो भव भव्यमूर्ते ॥ १७॥ इति मत्स्यपुराणे
    एकोनषष्ट्यधिकशततमाध्यायान्तर्गतं देवैः कृतं स्कन्दस्तोत्रं समाप्तम् । मत्स्यपुराण । अध्याय १५९
